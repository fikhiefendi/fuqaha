# Değişiklik isteklerinde (PR) siteyi derleyip hata olup olmadığını kontrol eder; yayınlamaz.
name: Derleme kontrolü

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /fuqaha
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tez toplayıcı testleri
        working-directory: tools/tezci
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests
