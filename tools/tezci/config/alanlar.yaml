# =====================================================================
#  FIKIH TEZ ARŞİVİ — ALAN TANIMLARI
#  Bu dosya, hangi tezlerin "ilgili" sayılacağını belirler.
#  Yazım: Türkçe karakter, şapka (â, î, û) ve büyük/küçük harf fark etmez;
#  her şey karşılaştırmadan önce sadeleştirilir (fıkhî = fikhi = FIKHÎ).
#
#  Terimler kelime BAŞINDAN eşleşir: "fıkh" → fıkhî, fıkhın, fıkhu'l-...
#  Özel desen gerekiyorsa başına "re:" yazın (sadeleştirilmiş metne
#  uygulanan düzenli ifade), örn. "re:\bkiyas(?!la)" = kıyas ama kıyaslama değil.
# =====================================================================

surum: 1

# ---------------------------------------------------------------------
# 1) ÇEKİRDEK BİRİMLER — ABD veya Bilim Dalı adında geçerse tez
#    doğrudan KABUL edilir ve ilgili kategoriye yazılır.
# ---------------------------------------------------------------------
cekirdek_birimler:
  - desen: "islam hukuk"                 # İslam Hukuku ABD / Bilim Dalı
    kategori: fikih
  - desen: "re:\\bfikih (ana ?bilim|bilim) dali"   # Fıkıh ABD / BD
    kategori: fikih
  - desen: "islam iktisadi ve hukuku"
    kategori: [fikih, iktisat]
  - desen: "islam iktisad"
    kategori: iktisat
  - desen: "islam ekonomi"
    kategori: iktisat
  - desen: "islami bankacilik"
    kategori: iktisat
  - desen: "islami finans"
    kategori: iktisat
  - desen: "katilim bankacilig"
    kategori: iktisat
  - desen: "islami sigortacilik"
    kategori: iktisat

# ---------------------------------------------------------------------
# 2) GENİŞ BİRİMLER — bu birimlerin TÜM tezleri çekilir ve tek tek
#    puanlanır (Tefsir, Hadis vb. içinden fıkıhla ilgili olanları bulmak için).
#    Bu birimlerde "İslami bağlam" otomatik var sayılır.
# ---------------------------------------------------------------------
genis_birimler:
  - "temel islam bilimleri"
  - "ilahiyat"
  - "islam bilimleri"
  - "islami ilimler"
  - "islam arastirmalari"
  - "din bilimleri"            # Felsefe ve Din Bilimleri dahil
  - "islam tarihi"             # İslam Tarihi ve Sanatları (fıkıh tarihi için)
  - "islam medeniyeti"
  - "islam mezhepleri"

# ---------------------------------------------------------------------
# 3) KATEGORİLER — sitede görünecek başlıklar
# ---------------------------------------------------------------------
kategoriler:
  fikih:        "Fıkıh ve İslâm Hukuku"
  fikih_usulu:  "Fıkıh Usûlü ve Metodoloji"
  fikih_tarihi: "Fıkıh Tarihi"
  fukaha:       "Fukahânın Görüşleri ve Eserleri"
  mukayeseli:   "Mukayeseli İslâm Hukuku"
  iktisat:      "İslâm İktisadı ve Ekonomisi"

# ---------------------------------------------------------------------
# 4) PUANLAMA
#    Alan çarpanları: başlık x3, anahtar kelime x2, özet x1 (üst sınırlı)
# ---------------------------------------------------------------------
puanlama:
  carpan: {baslik: 3, anahtar: 2, ozet: 1}
  ozet_ust_sinir: 4          # özetten gelen puan en fazla bu kadar
  kabul_esigi: 6             # ≥ 6 → kabul
  inceleme_esigi: 3          # 3–5 → elle incelenecek; < 3 → ret
  # Geniş birimlerde fıkıh dışı bir bilim dalındaki (Tefsir, Hadis, Kelam, Arap Dili…)
  # tezler için daha yüksek kabul eşiği. Genel dallar bu kuraldan muaftır.
  diger_dal_kabul_esigi: 9
  # Genel birimler: bu adlı ABD/BD'lerde normal eşik (6) geçerli. Diğer geniş birimlerde
  # (İslam Tarihi, Mezhepler Tarihi, Din Bilimleri, Tefsir/Hadis/Kelam dalları…) eşik 9.
  genel_dallar: ["temel islam bilimleri", "islam arastirmalari", "islam bilimleri", "islami ilimler", "ilahiyat"]
  # İlahiyat dışı bölümlerde (Hukuk, Tarih, İktisat…) yalnızca "bağlam gerektiren"
  # terimlerle gelen tezler en fazla "inceleme"ye düşer; otomatik kabul için
  # güçlü bir sinyal (fıkıh, İslam hukuku, şer'iyye sicili, katılım bankacılığı…) gerekir.
  diger_bolumde_guclu_sinyal_sart: true

