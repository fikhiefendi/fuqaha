abstract: "Bu çalışmamız boşama tartışmalarıyla ilgili olarak 20. Yüzyıl başlarında yaşayan İslam Hukukçularının çağın sorunlarını da dikkate alarak geliştirdikleri düşünce yapısı ve nassları yorumlama yöntemleri üzerinedir. Çalışmamız, Mısırlı âlim Ahmed Muhammed Şâkir?in ?Nizâmu?t-talâk fi?l İslâm? adlı eseri ile Osmanlının yetiştirdiği son dönem âlimlerinden Muhammed Zâhid el-Kevserî?nin ona reddiye mahiyetinde yazdığı ?el-İşfâk alâ Ahkâmi?t talâk? isimli eserleri esas alınarak hazırlanmıştır. Ahmed Muhammed Şâkir İslam Hukukunda boşama konusunu işlediği eserinde, nassların yanlış yorumlanmasıyla gelişen geleneksel düşüncenin, çözümden ziyade kendisinin sorun oluşturduğuna inanmaktadır. Buna karşın Muhammed Zâhid el-Kevserî ise asıl sorunun, ?toplumda yaygın olan? aşağılık kompleksinden kaynaklandığını, asırlar boyunca İslam Hukukunun kendi dinamikleriyle son derece dengeli çözümler üretebildiğini söylemektedir. Böylece Şâkir?in nasslarla temellendirdiği görüşlerini Kevserî de nasslara dayanarak çürütmeye çalışmaktadır. Ahmed Muhammed Şakir bidat olan talakı, ta'lik-i talakı ve talaka yemini, şahitsiz talakı ve iddet içerisinde yapılacak ikinci bir talakı geçersiz saymaktadır. Bir lafızla yapılan üç talakın bir sayılacağını savunmaktadır. Zahid el-Kevseri ise bu konuda hukuki geleneğin devam ettirilmesi gerektiğini, nassların da bu istikameti desteklediğini belirtmektedir. Aile hukukuyla ilgili problemlerin çözümünde her iki alimin çalışmaları da istifade edilecek niteliktedir."
