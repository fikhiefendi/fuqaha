abstract: "Bu araştırma, bir kişinin hak edinme ve yükümlülük altına girme ehliyetini belirleyen temel konulardan biri olan ehliyetin İslam fıkhındaki hükümlerini karşılaştırmayı ve Suriye mevzuatındaki etkisinin boyutunu analiz etmeyi amaçlamaktadır. Araştırma problemi, İslam fıkhındaki ehliyet kavramı ile bu kavramın Suriye hukukundaki uygulamaları arasında, özellikle de ehliyetin aşamaları ve belirtileri açısından, karşılaştırmalı bir çalışmayı gerekli kılan bir boşluğun varlığında yatmaktadır. Araştırma, fıkhî ehliyet kavramını, bölümlerini, aşamalarını ve onu etkileyen belirtileri açıklığa kavuşturmayı ve Suriye hukukunun ehliyet hükümleri açısından İslam hukukundan ne ölçüde etkilendiğini ortaya çıkarmak için Suriye hukuku ile karşılaştırmayı amaçlamıştır: İlk bölüm İslam fıkhında ehliyeti tanım, bölüm, şartlar ve belirtiler açısından ele alırken, ikinci bölüm Suriye hukukunda ehliyeti incelemeye, fıkhi kavramsallaştırma ile karşılaştırmaya ve Suriye hukukunun İslam fıkhından ne ölçüde etkilendiğini göstermeye ayrılmıştır. Araştırma, özellikle kişisel statü alanında İslam hukuku ve pozitif mevzuat arasında bağlantı kurmanın önemini vurgulayan bir dizi önemli bulguya ulaşmıştır: Araştırma, Suriye hukukunun İslam fıkhının seçilebilirlikle ilgili kavramlarından etkilendiğini göstermiştir. İslam fıkhı ile Suriye hukuku arasında bazı belirtilerde ve ayırt etme yaşı veya olgunluğun belirlenmesinde bazı temel farklılıklar ortaya çıkmıştır. Bu nedenle çalışma, bu konuda diğer yönlerden ek çalışmalar yapılması gerektiğini önermektedir."
