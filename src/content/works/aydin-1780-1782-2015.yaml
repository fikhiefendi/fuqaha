abstract: "Osmanlı tarihi araştırmalarının en önemli kaynaklarından Şer'iyye Sicillerine dayalı olarak yapılan bu tez, 4 Nolu Kütahya Şer'iyye Sicilinin ihtiva ettiği belgeler ışığında hazırlanmıştır. Kütahya şehri, kadılık müessesesi ve Şer'iyye Sicilleri hakkında bilgi verildikten sonra 1780 – 1782 yıllarına ait 224 belgenin bulunduğu defter transkribe edilmiş, belge özetleri tutulmuştur. Ortaya çıkan bilgi ve belgeler değerlendirilerek 1780 – 1782 yıllarında Kütahya ve Anadolu'daki durum ortaya konulmaya çalışılmıştır.“Sicill-i Mahfûz”ve“Sicill-i Mahfûz Defterlü”olarak tutulan defterde ferman, berat, buyruldu ve bunlardan başka nikah hüccetleri, ağırlıklı olarak da terekeler gibi önemli belgeler mevcuttur. Kütahya'nın 7 Nahiye, 34 Mahalle ve 284 köyünün listesi gibi orijinal bilgiler de elde edilmiştir."
