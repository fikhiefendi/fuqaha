abstract: "Fıkhî hükümlerin amele doğru yansıtılması öncelikle amele taalluk eden hükmün iyi bilinmesi ve doğru hatırlanması ile mümkündür. Aksi takdirde amelin zahmeti çekildiği halde kendisi muteber sayılmayacaktır. İşbu sebeple bu çalışmada fıkhî bilginin öğrenilmesini ve pekiştirilmesini hedefleyen bir öğretim metodu olan bilginin uzun süreli bellekte yer etmesini ve hafızadaki bilginin hatırlanmasını kolaylaştıran Türkçe de fıkıh bilmeceleri olarak adlandırdığımız Hacı Mehmed Zihni Efendi'ye ait, Osmalıca telif edilen 'Elğâz-ı Fıkhiyye' adlı eserin Kitâbut- tahâret – Kitâbu'l hudûd arası bölümlerinin referanslandırılarak sadeleştirilmesi amaçlanmıştır."
