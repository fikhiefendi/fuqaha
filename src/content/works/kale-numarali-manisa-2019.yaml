abstract: "Şer'iyye Sicilleri, Osmanlı Devletinde kadıların mahkemelerde verdikleri hükümlerin kayıtlarının tutulduğu defterlerdir. Şer'iyye Sicili kayıtlarını incelediğimizde o bölgenin sosyal, ekonomik, kültürel, hukuki yapısı hakkında bilgi sahibi olmaktayız. 275 Nolu Manisa Şer'iyye Sicilini konu bakımından incelediğimizde ölen kişilere ait tereke kayıtları, miras davaları, boşanma davaları, adam yaralama, Redif kışlasının masraf pusulaları, Saruhan sancak masraf pusulaları, rüşvet hakkında çıkarılan cezalar ile ilgili kayıtlar, izin tezkereleri, savaşlarda yaralanan askerlerin tekaüdlük maaşları hakkında kayıtlar, illet-i veba hastalığı hakkında çıkarılan düzenlemeler gibi mevzular hakkında bilgi edinmekteyiz."
