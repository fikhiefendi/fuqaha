abstract: "ÖZET İslam Dini'nin koyduğu esaslar çerçevesinde finansal konularda işletmecilik yapan müesseselere faizsiz banka (İslam Bankası) denilmektedir. Faizsiz Banka olgusu, günümüzde gittikçe taraftar bulabilmekte ve bankacılık uygulamalarını yeni metodlar ve araçlar deneyerek yaygınlaştırmaktadır. Müslüman ülkeler arasında gelişen ekonomik, kültürel ilişkiler, fon fazlası olan Ortadoğu kökenli ülkelerden, fon ihtiyacı olan (Türkiye Pakistan gibi) ülkelere doğru bir transferin oluşmasını sağlamak ve diğer dini ekonomik v.s. gibi sebeplerle faizsiz bankacılık ekonomik hayatımızda yer bulamaya başlamıştır. İlk olarak 1963 yılında Mısır'da kurulan faizsiz bankanın fikir alanındaki tartışmaları 1 9401ı yıllarda başlamıştı. Bugün çoğu müslüman ülkelerde olmak üzere faizsiz bankaların sayısı 37 ye ulaşmıştır. Kâr Zarar ortaklığı esasına göre çalışan bu bankalar klasik Bankaların yapmış oldukları tüm iilemleri yanında, yeni finansal metodlanda uygulamaktadırlar. Bu kurumların Türkiye'de özel finans kurumu adıyla, kurulmasına; Bankalar ve Türkparasını Koruma kanununa dayanılarak bakanlar kurulununl6.12.1983 tarihinde çıkardığı kararnameyle karar verilmiştir. ÖFKlar sermayeleri ile birlikte yurtiçinde ve yurtdışından cari hesaplar ve kâr zarara katılım hesaplan vasıtasıyla topladığı fonları ekonomiye tahsis etmektedirler. Kurumlar genel olarak ülkemizde oluşturacağı fonlarla (Ek tebliğlerle belirtilecek usuller ile); Her türlü zirai, ticari faaliyetlerin ve hizmetlerin finansmanında ortak yatırımlarda yurt dışı teminat mektuplarının verilmesinden ithalat ve ihracatın finans'ı yatırımlara İlişkin ekipmanların temin edilip firmalara taksitle satılması veya kiraya verilmesi gibi hususlarda kullandırmaklardır. Bu kurumlar gittikçe gelişmekte, o nisbette de Türk ekonomisine ve sermaye piyasası katkıları artmaktadır. Bunu diğer bankalara göre faizsiz alternatif finans metod ve araçları ile yapmaya çalışmaktadırlar. Ayrıca Özel Finans Kurumlan Türkiye'nin Avrupa ile Ortadoğu arasındaki köprü olma fonksiyonuna da katkıda bulunacaktır. Neticede, her şeyin alternatifinin arandığı günümüzde, ÖFK'lar sermaye piyasasıda klasik bankalara, önemli bir alternatif olarak gösterilmektedirler. Aynca, Barter (Takas), risk sermayesi gibi faizsiz esasa göre çalışan yöntemler, gerek sosyal açıdan gerek ekonomi açısından, büyük öneme sahip olduğu varsayılmaktadır."
