abstract: "İnsanlık tarihi boyunca cinsel şiddet öyle veya böyle kişilerin cinsel dokunulmazlığını ihlal eden bir suç türü olarak karşımıza çıkmaktadır. Cinsel şiddet, failin (erkek) cinsel motivasyon eşliğinde karşındakinin rızası olmaksızın ona sözel olarak cinsel içerikli şeyler söylemesi, fiziksel olarak temasa geçmesi veya bunun ötesinde cinsel birlikteliğe zorlaması olarak tarif edilebilir. Bu durumda mağdur, yaş ve cinsiyet fark etmeksizin hayatta olan insandır. Cinsel şiddetin görünümleri ve toplum tarafından algılanış şekilleri, içerisinde bulunulan zaman, din algısı ve kültürel kodlara göre değişiklik arz etmektedir. Buna bağlı olarak tarihteki her medeniyetin cinsel şiddet hususunda kendine has bir algılayış biçimi ve hukuki düzenlemeleri olduğu söylenebilir. Modern hukuk ve tarih sahnesinden geçmiş bazı medeniyetlerdeki cinsel şiddet algısına dair bir girizgâhtan sonra bu çalışmada Osmanlı ceza hukuku ekseninde (17. ve 18. yüzyıl) cinsel şiddetin nasıl ve ne ölçüde yer aldığı incelenmiştir. Teori ve pratiği birleştiren bu çalışmada genel olarak fıkıh literatürünün verileri ile 17. ve 18. yüzyıl Osmanlı'sına has kayıtlar (Şeriyye Sicilleri, fetva mecmuaları, risaleler vs. gibi yazma eserler) incelenmiş ve çalışmayı zenginleştirmek üzere birçok farklı kaynak türleri de kullanılmıştır. Çalışmamız cinsellik hususunda kadın-erkek, hür-köle ayırımları ile homoseksüellik gibi konuları ele alması bakımından çok yönlü ve geniş bir perspektif sunmaktadır."
