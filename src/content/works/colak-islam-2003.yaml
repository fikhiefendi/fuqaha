abstract: "IV ÖZET DOKTORA TEZİ İSLAM HUKUKUNDA CEZA EHLİYETİNİ ETKİLEYEN DURUMLAR Mücahit ÇOLAK Danışman: Prof Dr. Davut YAYLALI 2003, SAYFA: X+192 Jüri : Prof Dr. Davut YAYLALI Prof Dr. Mustafa BAKTIR Doç. Dr. Ali Rafet ÖZKAN Doç. Dr. Hakkı AYDIN Doç. Dr. H.İbrahim ACAR“İslam Hukukunda Ceza Ehliyetini Etkileyen Durumlar”konulu araştırma, bir giriş ve iki bölümden meydana gelmektedir. Giriş bölümünde genel olarak“ehliyet”ve çeşitleri üzerinde durulmuştur. Ehliyetin, kişinin hak, yetki ve sorumluluk sahibi olmaya elverişliliğini ifade ettiği sonucuna varılmıştır. Birinci bölümde ise İslam hukukunda suç, ceza ve ceza ehliyeti kavramları incelenerek diyet, tazminat ve keffaretin ehliyetle ilişkisi incelenmiştir. ikinci bölümde ise ceza ehliyetini etkileyen ve teşekkülünde kişinin iradesinin etki etmediği durumlar, yaş küçüklüğü, akıl hastalığı, bunama, bayılma, kölelik, unutma, hata ve uyku başlıkları altında incelenmiştir. Teşekkülü kişinin ihtiyar ve iradesine veya başka bir kişiye bağlı olarak vukua gelen durumlar ise sarhoşluk, bilmeme ve ikrah konularında incelenmiş, suç failinde ceza ehliyetinin varlığı için akıl ve buluğun şart olduğu, akla tesir eden durumların da ceza ehliyetini etkilediği sonucuna varılmıştır. TC. YÛKSWÛCMTi.W IU,KUU> BOKDMAimSYW MUUUZI"
