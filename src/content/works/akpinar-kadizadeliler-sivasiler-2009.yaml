abstract: "Bu çalışma, Osmanlı Devleti'nin XVII. yüzyılında yaşamış olan Kâdızâde Mehmed Efendi ve tâbileri ile Abdülmecîd Sivâsi Efendi ve bağlıları arasında gerçekleşen tartışmaları fıkhî açıdan incelemeyi hedeflemektedir. Etkileri uzun yıllar boyunca devam etmiş olan bu tartışmaların konusunu, o dönem insanlarının günlük yaşantısında yer alan bazı meselelere, Osmanlı ulema sınıfının en alt tabakası olan vâizler tarafından önerilen ?fıkhî çözümler? oluşturmaktadır.Tez; giriş, iki ana bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmında konunun çerçevesi belirlenmiş, büyük bölümü yazma eser olan kaynaklar tanıtılmış ayrıca tartışmaların gerçekleştiği yüzyılda Osmanlı Devleti'nin içinde bulunduğu ilmî durum hakkında bilgi verilmiştir. Birinci bölümde, Kadızâde ve Sivâsi ekollerinin oluşumu, bu ekolleşmenin önder şahsiyetleri ve tartışmanın tarihî seyri ele alınmıştır. İkinci bölümde ise tartışılan somut konulardan yola çıkarak ekollerin fıkhî bakış açıları tespit edilmeye çalışılmış, birbirinin zıttı bu bakış açılarının muhtemel sebepleri üzerinde durulmuştur."
