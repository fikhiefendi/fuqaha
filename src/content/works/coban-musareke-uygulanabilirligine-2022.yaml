abstract: "Küresel finans içindeki ağırlığı her geçen gün artmakta olan İslami finans İslam ekonomisi ilkelerine dayalı olarak sunduğu hizmetleri büyük oranda katılım bankacılığı yoluyla sunmaktadır. Katılım bankacılığı çoğunlukla murabaha, tekafül, sukuk gibi finansal enstrümanları kullanırken müşareke ve mudaraba gibi araçları düşük düzeylerde uygulamaktadır. Ayrıca sunulan müşareke ve mudaraba finansmanları genellikle uzun vadeli büyük projerlere aktarılmaktadır. Diğer taraftan ülke ekonomilerinin en önemli unsurlarından olan KOBİ'lerin finansman bulmakta zorlandıkları bilinmektedir. Bu çalışmanın temel amacı murabaha gibi temelde borçlandırmaya dayalı finansal araçların yerine kısa vadeye odaklanarak geliştirecek dinamik ortaklık modeli ile KOBİ finansman sorunlarının çözülmesine katkı sunmaktır. Bu amaçla öncelikle TRB1 bölgesinde bulunan 4 ilde 401 KOBİ'ye anket uygulanarak elde edilen veriler Tek Yönlü ANOVA testi ile sınanmıştır. Analiz sonuçlarına göre KOBİ'lerin kısa vadeli ortaklıkların uygulanabilirliğine dair algıları olumlu yöndedir ve finansman sağlanan banka türü grubu dışındaki tüm gruplarda bu algı farklılaşmamaktadır. Son olarak analiz sonuçları ve mevcut uygulamalar dikkate alınarak dinamik ortaklık adı verilen bir model geliştirilmiştir. Model kısa vadeye odaklanmakta ve bu yönüyle mevcut uygulamalardan farklılaşmaktadır."
