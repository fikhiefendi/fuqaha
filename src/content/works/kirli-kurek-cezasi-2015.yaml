abstract: "Bu çalışma fıkhın Osmanlı uygulamasında ne derece etkili olduğu; Osmanlı hukuk uygulamalarında şer'î ve örfî unsurların ne kadar hakim olduğu tartışmalarına katkı sağlama niyetiyle ortaya çıkmıştır. Çalışmada arşiv belgeleri aracılığıyla Kürek Cezası tatbikinin Fıkıh'taki yeri belirtilmeye ve uygulama örneklerinin Ceza Hukuku ilkeleriyle mütabakatı tahlil edilmeye çalışılmıştır. Giriş ve iki ana bölümden oluşan çalışmanın giriş bölümünde Osmanlı ceza hukukunun genel yapısı ve bu yapı içerisinde kürek cezasının konumuna dair genel bilgiler verildikten sonra ilk bölümde tarihi olarak kürek cezası ele alınmıştır. İkinci bölümde ise İslam ceza hukuku ilkeleri bağlamında uygulamanın durumuna dair mülahazalar yapılmıştır. Sonuç bölümünde de değerlendirme yapılarak teorik ve pratik arasındaki ilişki üzerine ipuçları verilmeye çalışılmıştır."
