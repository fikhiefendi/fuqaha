abstract: "Çalışmamızın konusu, Osmanlı Klasik Dönemi ile Erken Cumhuriyet Dönemi arasındaki süreçte Türk Banka Hukuku'nun tarihsel gelişimini incelemektir. Konu üç ayrı bölüm başlığı altında ele alınmıştır. Birinci bölümde; Osmanlı Klasik Dönemi ile Tanzimat Fermanı'nın ilanı arasındaki dönemde uygulanan ve kaynağını doğrudan İslam Hukuku'ndan alan finans sağlama metotları, dönemin en sistematik finans kaynağı olan para vakıfları, ve sarraf uygulaması incelenmiştir. Çalışmanın ikinci bölümünde ise; Tanzimat Fermanı'nın ilanı ile Cumhuriyet'in ilanı arasındaki dönemde banka hukuku mevzuatı araştırılmıştır. Bu dönemde Osmanlı Devleti'nde kurulan ilk bankalar ve diğer finans kaynaklarının kuruluş mevzuatları, uygulanmalarındaki aksaklıklar ve aksaklıkların çözümü için yapılan mevzuatlar incelenmiştir. Üçüncü ve son bölümde ise Türkiye Cumhuriyet'in kurulduğu ilk yıllarda devletin ekonomik gelişimine etki eden ana faktörler ve bu faktörlerin banka hukuku mevzuatına olan etkileri araştırılmıştır. Cumhuriyet döneminin ilk banka kanunları ve bu kanunlardaki değişikliklerin sistematiği incelenmiştir."
