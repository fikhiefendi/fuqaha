abstract: "İslâm'ın asırlar öncesinden yol hakkı, yol adabı ve kurallarına ilişkin koyduğu kaideler günümüzde yaşanan ve gelecekte yaşanması muhtemel pek çok problemlerin çözümüne ışık tuttuğu görülmektedir. Kara yollarının araç yol tutuşlarına uygun yeni teknolojilerle inşa edilmelerine, araçların güvenlik donanımlarının artmasına, kara yollarında daha fazla güvenlik önlemleri alınarak trafik işaretleri ile donatılmasına ve trafik eğitimim temel eğitim çağından itibaren müfredatlara konulmasına rağmen gün geçtikçe trafik kazaların artışın devam ettiği ayrı bir gerçektir. Trafik kazalarında sorumluluğun birincil derecede insan, ardından da yol ve araç faktöründen kaynaklandığı görülmektedir. Trafik kazaları, neticeleri itibarı ile dini, hukuki ve ahlaki sorumlukları da beraberinde getirmektedir. Araştırma ile trafik kazalarına sebep olan faktörler, İslâm hukuku açısından trafik kazalarında zarar ve tazminatın altyapısı, trafik kazalarında kusur ve itlaf konuları ele alınmıştır. Bu bağlamda trafik kazalarından kaynaklı ölümler, sakatlanmalar, maddi ve manevi zararlarının tazmini ile diyet, erş ve kefâret ile ilgili hususlar İslâm hukuku açısından ele alınarak ortaya konulmaya çalışılmıştır. Araştırma; dört ana bölüm ve kaynakçadan oluşmaktadır. Birinci bölümde; Giriş, araştırmanın konusu ve önemi, yöntemi ile kapsamı ve araştırma düzenine değinilmiştir. İkinci bölümde;“İslâm Sorumluluk Hukuku Açısından Trafik Kazaları Sebeblerinin Değerlendirilmesi”başlığı altında trafik kazaları ile ilgili kavramlar, trafik kazalarına neden olan faktörler TÜİK'den alınan istatistiksel veriler ışığında ele alınarak İslâm sorumluluk hukukuna göre hükümleri ortaya konulmuştur. Üçüncü bölümde;“Trafik Kazalarında Tazmin Sorumluluğu Unsurları Fiil-İlliyet Bağı-Teaddî ve Zarar”başlığı altında fiil, illiyet bağı, teaddî (hukuka aykırılık) ve zarar kavramları ele alınmıştır. Dördüncü bölümde;“İslâm Sorumluluk Hukukuna Göre Trafik Kazalarında Tazminat ve Kefâret”başlığı altında tazminat, diyet, erş, hükümetü'l-adl ve kefâret kavramları ele alınarak İslâm sorumluluk hukuku açısından trafik kazalarında tazminat, kefâret ve diyet gerektiren durumlar kurgu olaylar ve örneklerle ortaya konulmaya çalışılmıştır. Trafik kusurları, ihlalleri ve hataları gibi nedenlerden meydana gelen kazalarda yaşanan zararlar, mağduriyetler ve cinayetler İslâm sorumluluk hukuku açısından dünyevi ve uhrevi birtakım yaptırımları beraberinde getirmiştir. İslâm'da zarar vermemek esas olduğundan trafikte başkasına zarar verilmesi, başkasının zararına sebep olunması ve hem kendini hem de başkasını tehlikeye atması da yasaklanmıştır. İslâm hukukunda zararın tazmini esas olduğundan canda ve malda meydana gelen zararlardan doğan sorumluluk cezaî ve hukuki olmak üzere iki açıdan ele alınmaktadır. Bundan dolayı toplumun maslahatı ve def-i mefsedet için konulan kurallara İslâmi esaslara muhâlif olmamak şartıyla herkesin uyması vâcip görülmüştür. Toplum düzeninin sağlanması ve zararın giderilmesi için konulan kurallara uymayarak zarara sebep olanların haksız fiil türlerine göre diyet, kefâret ile sorumlu tutulmaları ve fiilleri suç unsurunu barındırıdğı taktirde ta'zir ile cezalandırılmaları meşru görülmüştür. Böylece alınacak önleyici tedbirlerle zararların en aza indirildiği, mağduriyetlerin giderildiği, adaletin de gerçekleştirildiği huzurlu bir toplumun inşa edilmesi sağlanmış olmaktadır."
