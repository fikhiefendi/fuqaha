abstract: "Değişen bir dünya düzeninde ekonomik ve finans sistemleri de değişmektedir. Mevcut finans sistemi unsurları, ihtiyaçlara göre yeni kurumlar, piyasalar ve piyasa araçları gibi birimlerle bu değişime uyum sağlayarak gelişmektedir. Bu çalışmanın temel amacı, faizsiz finans piyasasında son yıllarda hızla gelişerek artan önemli bir finansman aracı olan sukuku (yatırım sertifikaları), yapısı, işleyişi ve türleri açısından İslam dönemi sözleşmelerine dayalı, günümüz finansal sisteme entegre edilmiş sukuk türleriyle mevcut finans sistemi piyasa araçlarını karşılaştırmalı olarak incelemek ve araştırmaktır. Çalışmada, sukuk ihracı ile finans piyasasındaki gelişmeler ele alınmış olup ayrıca bir varlığı dayalı olarak çıkarılıp menkulleştirilen sukukun Türkiye Muhasebe Standartlarına göre muhasebeleştirme sistematiğine yer verilmiştir."
