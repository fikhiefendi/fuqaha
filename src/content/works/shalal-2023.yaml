abstract: "Nadir bilimsel konulardan biri araştırma ilgisiydi Kur'an-ı Kerim'in tefsiridir O şemsü'd-Dîn Muhammed elmısrî şâfiî t.798 sonrasi Furkan Suresi'nin başından itibaren Neml Suresi'nin sonuna kadar Kitap, ayetlerin anlamlarının bir açıklamasını içerir. Kelime dağarcığı dile göre gösterilir Müfessirlerin sözlerinden mana açıktır Bölümler içerir Dilbilgisi fıkhı inancı Yazar bunu Arapların sözlerinde, şiirinde ve nesirinde bulmuştur Ve bunu Fakihler'in sözlerinde buldu Yazar ayetleri bir surede açıklamıştır. Açıklamak dışında tek bir cümle ya da kelime bırakmadı İniş sebepleri ve uygun ayetler ile ilgilindi Özellikle olay ve kişilerle ilgili ayetler Kuran sureleri, Medine ve Mekke ile ilgilindi Bazı terimleri de açıkladı Yazar araştırmasını üç bölüme ayırdı Birinci bölüm yazarın hayatı Adı ve soyadı onun ailesi Onun bilgi talebi ğretmenleri onun öğrencileri Yazıları ikinci bölüm onun bilimsel yöntemi Kaynaklarının isimleri Kitaplar ve sahipleri İfadelerin belgelenmesi Terimlerin açıklaması üçüncü bölüm kitaptır. Sonunda Sonuç ve sonuçlar En önemli sonuçlardan biri Kuran Mucizesi çıklaması,ve ayetlerin tefsiri,Ve bilimlerin çokluğu ve kaynakların bolluğu ve kiraatın varlığı ve her şeyin ilahı olan Allah'a şükürler olsun ."
