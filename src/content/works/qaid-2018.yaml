abstract: "Araştırmacının teorik yayınları ve ilgili çalışmaları gözden geçirdiği bu çalışma, Türkiye'deki kadın Arap mültecilerin ekonomik olarak güçlendirilmesini tanımlamayı amaçlamaktadır. İlaveten, araştırmacı, kadın mülteciler üzerinde uluslararası ve yerel raporları ve yayınları izlemiştir. Çalışmanın hipotezini test etmek için, araştırmacı, tek değişkenli bir örneklem üzerinde yoğunlaşmış ve 116 maddeden oluşan bir örneklem tasarlamıştır. Araştırmacı, bir örneklem üzerinde SPSS programını kullanarak, sıklıklar, yüzdeler ve ortalamayı hesaplamış ve t-test yapmışır. Türkiye'deki kadın mültecilerin güçlendirilmesinde, görülmüştür ki, istatistik olarak ekonomik ve sosyal faktörlerin belirgin bir etkisi vardır; o da mülteci kadının sağlık ve eğitim hizmetlerine ulaşmasındaki olumsuz etkidir. Kadınlar için, iş bulma fırsatlarına gelince; burda da olumsuz bir etki vardır onların yeteneklerinin ve kişiliklerinin gelişmesini engelleyen ve bu yüzden onları iş hayatı dışında tutan. Son olarak, kadın mültecilerin kendi toplumlarında kadın rolünün önemini yeteri kadar farkedemedikleri için, ki bu onlar için farkındalık programlarını gerekli kılar, yine olumsuz bir etki vardır. Bu çalışma, Türkiye'deki kadın mültecilere sağlık ve eğitim hizmetleri konusunda, özellikle de mülteci yardımı konusunda öneriler sunar. Ve Türk toplumu ve iş ortamına katılmaları, adapte olmaları konusunda onlara yardımcı olacak eğitim programları üzerinden ekonomik ve sosyal sorunları aşmaları konusunda öneri yapar. Son olarak, kadın mülteciler, eğitimlerini tamamlayamayanlara verilecek ve onları ekonomik olarak güçlendirecek uygun eğitimlerle, kendilerine yeterli bir gelir sağlayacak yeteneklerine uygun iş bulma fırsatlarına sahipolurlar."
