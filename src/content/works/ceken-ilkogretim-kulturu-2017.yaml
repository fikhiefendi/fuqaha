abstract: "Bu araştırmanın amacı İlköğretim Din Kültürü ve Ahlâk Bilgisi öğretim programında kazandırılması amaçlanan ibadetlerden, zekât ibadetinin kavramsal analizini, öğretim programında nasıl yer aldığı ve ders kitaplarına nasıl yansıdığını tespit etmektir. Çalışmamız giriş, üç bölüm, sonuç ve önerilerden oluşmaktadır. Giriş bölümünde araştırmanın problemi, amacı, önemi, yöntemi ve sınırlılıklarına yer verilmiştir. Birinci bölümde zekât kavramı ve zekât kavramı ile ilişkili diğer kavramlar anlatılarak, zekât konusu çeşitli açılardan ele alınmıştır. Araştırmanın ikinci bölümünde ilköğretim din kültürü ve ahlâk bilgisi, öğretmen kılavuz kitapları ve ders kitaplarında zekât kavramının, öğretim programındaki yeri değerlendirilmiştir. Üçüncü bölümde öğretim programındaki zekât konusunun ilköğretim din kültürü ve ahlâk bilgisi öğretmen kılavuz kitapları ve ders kitaplarıyla karşılaştırılması yapılmıştır. Araştırmamızın son bölümünde ise sonuç ve önerilere yer verilmiştir. Bu çalışma sonucunda, ders kitapları ile öğretim programı arasında birtakım eksikliklerin olduğu tespit edilmiş ve öneriler sunulmuştur."
