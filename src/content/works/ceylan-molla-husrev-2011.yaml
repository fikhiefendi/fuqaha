abstract: "Tez, Giriş (`İçerik ve Yöntem', `Molla Hüsrev'in Hayatı', `Molla Hüsrev'in Eserleri'), iki bölüm (Birinci Bölüm: `Molla Hüsrev'e Göre İçerik ve Kapsamı Bakımından Delâlet Kavramı', İkinci Bölüm: `Manaya Vâkıf Olmanın Yolları Bakımından Lafzın Kısımlarına Molla Hüsrev'in Yaklaşımı'), Sonuç ve Bibliyografya'dan oluşmaktadır.Tezde geç dönem Hanefî İslâm Hukukçularından Molla Hüsrev'in delâlet anlayışı ele alınmıştır. Delâletin mahiyeti ve çeşitleri hakkında Molla Hüsrev'in özgün yaklaşımı incelenmiş ve bu yaklaşımın fer'î meselelerdeki yansımaları gözlemlenmiştir. Konunun, Molla Hüsrev'in fıkıh usûlü eseri olan ?Mir'âtu'l-Usûl? bağlamında ele alındığı tezimiz neticesinde, fıkıh usûlü ilmindeki delâlet konusunun önceki kaynaklara göre Molla Hüsrev tarafından daha sistemli bir yapıya kavuşturulduğu görülmüştür.Tezin Birinci Bölümü'nde içerik ve kapsamı bakımından delâlet kavramına Molla Hüsrev'in yaklaşımı ele alınmıştır. Molla Hüsrev'in delâlet kavramını sadece fıkıh usûlü bakımından değil; mantık ve beyân ilimleri bakımından da ele aldığı görülmüştür. Tezin İkinci Bölümü'nde ise, Birinci Bölüm'de ele alınan delâlet kavramına dair özelliklerin Molla Hüsrev tarafından fıkıh usûlü ilminde nasıl uygulandığı incelenmiştir. Ayrıca bu bölümde delâlet anlayışının fer'î meselelere yansımaları da ele alınmıştır."
