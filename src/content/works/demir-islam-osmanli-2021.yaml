abstract: "Bu tezde İslam ve Osmanlı hukukunda hakimlerin uyması gereken etik ilkeler, evrensel düzeyde kabul gören yargı etiği ilkeleriyle mukayeseli bir şekilde tahlil edilmeye çalışılmıştır. Çalışmamızın ilk bölümünde meslek etiği, yargı etiği gibi dallarıyla beraber etik kavramı üzerinde durulmuş ve etik ilkelerin pozitif hukuktaki genel görünümü hakkında bilgilere yer verilmiştir. Bu açıdan bakıldığında etik, iyiyle kötünün, doğruyla yanlışın ayırt edilmesine, hakkın hem özüne hem de görünümüne hizmet eden bir disiplindir. Çalışmamızın ikinci bölümünde İslam ve Osmanlı hukukunda, hakimliğin tarihi gelişimi, hakimlik kavramı ve hakimlerin niteliklerine değinilmek suretiyle etraflı bir şekilde hakimlik sistemi üzerinde durulmuştur. Bu bölümde yapılan incelemelerde İslam ve Osmanlı hukukunda tesis edilen sistemle, hakimlerin etik ilkelere riayet edebilmesinde büyük bir kolaylık sağlandığı gözlemlenmiştir. İlk iki bölümde yargı etiğini sorguladığımız alanın kavramsal çerçevesi çizilip teorik alt yapısı oluşturulmuştur. Çalışmamızın esasını oluşturan son bölümde ise İslam ve Osmanlı hukukunda hakimlerin uyması gereken etik ilkeler, günümüzde yargı etiği alanında evrensel düzeyde kabul görmüş Bangalor Yargı Etiği Metni'nde belirlenen ilkeler esas alınarak, uygulama örnekleriyle ve mukayeseli bir şekilde incelenmiştir. Bu tez hazırlanırken arşiv belgeleri, kadı sicilleri, muhimme defterleri gibi birinci el kaynaklardan, edebü'l kadı gibi teorik kitaplardan, Osmanlı Devleti'nin resmi mezhebi olan Hanefi mezhebine yön veren fıkıh eserlerinden, hakimin adabı kısmına yer veren Mecelle şerhlerinden ziyadesiyle istifade edilmiştir. İslam ve Osmanlı hukukunda hakimlerin riayet ettiği etik ilkelerin Mecelle'de düzenli bir şekilde toplanmış olmasından dolayı tezimizde Mecelle'deki düzenlemelere de sıklıkla yer verilmiştir. Bu çalışma incelendiğinde, modern hukuk sistemlerinde bir bütün olarak birkaç yıl önce yer bulabilen hakimlere ilişkin yargı etiği ilkelerinin, İslam ve Osmanlı hukukunda, günümüz dünyasına rehberlik edecek derecede, asırlar önce yer aldığı görülecektir."
