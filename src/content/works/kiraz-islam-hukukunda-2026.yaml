abstract: "Bu çalışmada sehiv (yanılma) secdesinin hükümleri, uygulanış şekli, gerekli olduğu durumlar incelenmiştir. Sehiv secdesi nedir? Bu secde nasıl ve namazın hangi aşamasında yapılır? Sehiv secdesini gerektiren durumlar nelerdir? Hangi hatalar sehiv secdesi ile telafi edilir, hangileri namazı yeniden kılmayı gerektirir? gibi sorulara cevap aranmıştır. Bilimsel analiz yöntemi ile yapılan bu çalışmada sehiv secdesi konuları kategorize edilerek sistemli olarak incelenmeye çalışılmıştır. Bu araştırmada namazda yanılma hakkında rivayet edilen hadisler, sahabenin uygulaması, müçtehit imamların içtihatları, fakihlerin bu husustaki görüşlerine değinilerek Müslüman topluma kolaylık sağlamak amaçlanmıştır. Bu araştırma sonucunda gerek özelde incelemeye alınan Hanefî mezhebi içinde gerekse diğer mezheplerde çok fazla görüş ayrılığının bulunduğu, sehiv secdesini gerektiren durumların ortak paydası olarak namazın bir vacibinin terk edilmesi hususuna dayandığı, ihtilafın sehiv secdesinin sadece hükmü hakkında değil her bir aşamasında olduğu, bütün bu görüş ayrılıklarının temelinde genel anlamda hadislerde geçen olayların farklı algılanmasının yattığı sonuçlarına ulaşılmıştır."
