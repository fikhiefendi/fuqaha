abstract: "Mükelleflerin yaptıkları fiillerin karşılıklarında bir ceza ya da mükafaat terettüp etmesinin yanında bunlardan herhangi birinin konusu olmayan durumlar da bulunur. Fiil serbestisi anlamına gelen bu durumlar fıkıhta mubâh/ibâha gibi kavramlarla ifade edilir. Bir fiilin serbesti alanında olup olmadığı doğrudan o fiili konu edinen nassın bunu bildirmesi ile olabileceği gibi o fiilin ibâha bildiren genel nitelikli nasların kapsamında değerlendirilmesi ile de olabilir. Bizzat naslar tarafından konu edilip mubâhlığı bildirilen meseleler üzerinde fehim içtihadı dışında bir içtihatta bulunulmaz. Fakat meydana gelen meselelerin çözümünde doğrudan ibâha bildiren umum nitelikli nasların kullanılması diğer hükümlerin iptaline yol açabilir. Herhangi bir hükmün iptal edilmediğinden emin olunabilmesi için umum nitelikli nasların ancak içtihat faaliyeti sonrasında devreye sokulması gerekir. Çalışma konumuz olan ibâha-i asliyye prensibi bu özellikteki naslara istinad ettiğinden başvurulacak deliller sıralamasında en son sırada yer alır. Görüldüğü üzere aslî ibâha prensibinin hangi aşamada kullanılacağı oldukça önemlidir. Bu çalışmada ibâha-i asliyye/şer'iyye prensibi, prensibi sıkça kullandığı düşünülen Hanbelî mezhebi çerçevesinde ele alınmaktadır. Fakat meselenin tarihsel arka planı ve kelâmî önkabullerle irtibatına dair elde edilen bulgular kanaatimizce çalışmayı farklı kılan unsurlar arasındadır. Çalışmanın genel olarak; şer'î hüküm tanımı, Hanbelîlik hakkındaki kimi yaygın kanaatlerin tashihi, ibâha-i asliyye prensibinin Hanbelîliğin karakteristiği olup olmadığı yönündeki yanlış algının izalesi hususlarında fıkıh alanına katkı sağlayacağını düşünüyoruz."
