abstract: "IV ÖZET YÜKSEK LİSANS TEZİ KIRAAT FARKLILIKLARININ İSLÂM HUKUKUNA VE METODOLOJİSİNE ETKİSİ Mehmet DAG Danışman: Yrd. Doç. Dr. Necati TETİK 1998- Sayfa: XV + 298 Jüri: Yrd. Doç. Dr. Necati TETİK Bu çalışmanın amacı, Kur'ânî lafızların okunuş şekli anlamına gelen kıraatin İslâm Hukukuna ve Metodolojisine etkisini ortaya koymaktır. Kıraat farklılıklarının bu hukuk ve metodolojisi için gerçekten önemli katkıları olmuştur. Bu durumda İslâm Hu kukunun yorumlanmasında önemli yer tutan kıraat farklılıkları hukuk ekollerinin meto dolojik ayrılıklarının en önemli sebeplerinden birisi olarak değerlendirilebilir. Bu bağ lamda“mütevâtir”,“âhâd”,“müdrec”kırâatların İslâm Hukukuna ve metodolojisine etkisini saptamaya çalıştık."
