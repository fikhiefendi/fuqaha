abstract: "Hanbelî düşüncenin önemli bir temsilcisi olan Ebu Ya'lâ el-Ferrâ'nın Haberî sıfatlar konusundaki düşüncelerini incelemeyi amaç edinen bu çalışma, söz konusu amaca ulaşmak için ilk bölümde haberî sıfatlar ve kelâmî ekollerde haberî sıfatların nasıl anlaşıldığı ve yorumlandığı konusunu incelemektedir. Ayrıca bu bölümde el-Ferrâ'nın düşüncesinin sınırlarını ve başkalarınkinden farklı yönlerini ortaya koyabilmek amacıyla hanbelî düşüncede haberî sıfatlar konusu incelemektedir. Böylece el-Ferra'nın haberî sıfatlar konusundaki görüşlerinin ne olduğu ve onun neden Hanbelî mezhebinin önemli simalarından biri olarak kabul edildiği daha iyi anlaşılacaktır. İkinci bölümde ise el-Ferrâ'nın haberî sıfatları nasıl yorumladığı üzerinde durulmaktadır. Bu çalışma, Hanbelîliğin Selefî gelenek içindeki yerini ve Ebû Ya'lâ el-Ferrâ'nın da Habelî düşüncedeki konumunu ilk defa müstakil bir çalışmaya konu etmesinden dolayı önem arz etmektedir. Ebû Yâ'lâ el-Ferrâ'nın Hanbelî mezhebinin düşünce birikimine katkısının tespitine çalışması, haberî sıfatlar konusunda el-Ferrâ'ya yöneltilen eleştirilerin geçerli olup olmadığını ortaya koyması da bu çalışmayı önemli kılan hususlardandır. Bu araştırmada betimleyici (descriptive) metod kullanılacaktır. Bundan dolayı, haberi sıfatlar konusu, tanımlama, tasnif, betimleme ve açıklama yoluyla işlenecektir. el-Ferrâ, Selef'in tefvîdî yöntemini benimsediği için ilkesel olarak haberî sıfatlara dair yapılmış te'vîlleri reddeder. Bu te'villerin Mu'tezile, Eş'âriye veya Cehmiye'den gelmesi arasında fark gözetmez. Te'vîle karşı olmasının nedeni, te'vîlin zanlar üzerine inşa edilmiş hükümlere dayanıyor olmasıdır. Zan ise bilgi değeri itibariyle kesinlik ifade etmez."
