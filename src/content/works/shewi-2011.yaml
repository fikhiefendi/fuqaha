abstract: "Alimler, zekât, kefaret, adak ve diğer mali yükümlülüklerde kıymet (para) ödenmesi konusunda ihtilaf etmişlerdir. Bir grup, kıymet ödenmesini yasaklamış, diğer bir grup ise bunu caiz görmüştür. Kıymeti ödemeyi yasaklayanların dayanağı, mali yükümlülüklerin bir ibadet türü olduğudur; dolayısıyla bu ibadetlerde şeriatın belirttiği esaslara uygun hareket edilmesi gerekmektedir. Ancak kıymetin ödenmesini caiz görenlerin dayanağı, bu yükümlülüklerin asıl amacının fakirin ihtiyaçlarını gidermek ve ona destek sağlamak olduğu gerekçesidir. Günümüzde ihtiyaçlar çeşitlenmiş ve artmıştır; kıymet, ayni yardımdan daha etkili bir çözüm sunmakta ve her iki taraf için de daha kolaylık sağlamaktadır. Fakir açısından kıymetin ödenmesi, mahremiyeti koruma ve ona özgürce kullanabileceği bir imkân sağlamaktadır. Tedbirli ve ihtiyatlı olmak isteyen, kıymet ödenmesini yasaklayan görüşü izleyerek yükümlülüğünü eksiksiz yerine getirir ve tüm alimlerin nezdinde vicdanen rahat eder. Kolaylık isteyen ve fakirin menfaatini gözeten ise kıymetin ödenmesini caiz gören görüşü izleyebilir. Burada önemli olan fakirin yararını gözetmek ve kıymet ödemesinin fakirlere ve hak sahiplerine zarar vermemesi ve şeriata karşı bir hile aracı olarak kullanılmamasıdır."
