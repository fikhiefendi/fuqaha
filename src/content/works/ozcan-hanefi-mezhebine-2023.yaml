abstract: "Furûk; tefsir, Arap dili, kelâm gibi ilimlerin yanı sıra fıkıh ilminin de alt dalı olarak gelişme göstermiştir. Fıkıh literatüründe şeklen benzediği halde hüküm bakımından farklı olan meselelerin incelendiği alan bu isimle anılmaktadır. Bu ilim dalı füru fıkıh eserlerindeki meselelerin benzer ve farklı yönlerinin incelenmeye başlanmasıyla birlikte gelişme göstermiş hicri 4. asırda ilk müstakil eserler kaleme alınmıştır. Eşbâh ve nezâir türü eserler içerisinde genellikle müstakil bir bölüm olarak furûk bulunmaktadır. Bu bölümlerde fürû fıkhın sistematiği içerisinde furûk örneklerine yer verilmektedir. Diğer yandan usûl eserlerindeki konuların benzerlik ve farklılıklarının ele alındığı eserler de bu isimle anılmaktadır. Klasik fıkıh eserlerindeki içtihatlar arasındaki cem' ve fark noktalarının tespit ve tahlili hâlâ güncelliğini korumakta olup bu alanla ilgili birçok araştırma yapılmaktadır. Bu tezde Hanefî fakîhlerin ibadetlerle ilgili içtihatları furûk yazım yöntemlerinden biri olan fürû metodu kullanılarak tespit ve tahlil edildi. Klasik Hanefî kaynakları doküman analizi yöntemiyle değerlendirildi. Birinci bölümde fıkıh ilminin alt disiplini olarak furûk incelendi. İkinci bölümde taharet, namaz, oruç, zekât ve hac başlıkları altında şeklen benzediği halde hüküm bakımından farklı olan meseleler delilleriyle ele alındı. Bu tezin temel amacı benzer fıkhî meselelerin neden farklı hükümler aldığını tespit etmektir. Sonuç olarak furûkun genellikle içtihadi konularda mevcut olduğu görüldü."
