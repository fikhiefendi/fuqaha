abstract: "İstihsân, genel kıyâs uygulamalarının daralttığı alanları genişletme amacı güden bir metottur. Özellikle Hanefîler İstihsân metodunu sıkça uygulamışlardır. Ebû Hanîfe ve talebelerinden nakledilen bir istihsân tanımının bulunmaması, tartışmaları da beraberinde getirmiştir. Şafiî'nin istihsân metodunu eleştirmesi ve bu eleştirilerin Şafiî mezhebinde yaygınlaşması, Hanefîlerin istihsân metodunu savunmasına yol açmıştır. Nitekim ilk dönem Hanefî usûlcüleri itirazlara cevap maksadıyla istihsân metodunu tanımlayarak, eleştirilere karşı durmaya çalışmışlardır. İlk dönem Hanefî usûlcülerinin istihsân hakkında farklı yaklaşımları bulunmaktadır. İstihsânı illetin tahsîsi olarak gören Cessâs ve Debûsî kendi teorilerini ispatlama yoluna gitmişlerdir. Onlara göre illet olduğu halde hüküm ortaya çıkmayabilir. Daha sonra gelen Pezdevî ve Serahsî bu teoriyi reddetmişlerdir. Onlara göre illetin tahsîsi mümkün değildir. Zira hükmün yokluğu illetin yokluğu sebebiyledir. Her iki istihsân teorisinde de hükümlerin gerekçelendirilmesi bakımından farklılıklar göze çarpmaktadır."
