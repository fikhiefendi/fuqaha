abstract: "Katılım Bankacılığı uzun yıllardır dünya üzerinde var olan bir bankacılık sistemidir. Bu sektörün en önemli özelliği bankacılık sisteminde müşterilerine faizi kullanmadan fon kullandırma, hesap işletme gibi hizmetler sunmasıdır. Emlak Katılım Bankası da 2019 yılında resmi gazetede yayımlanan faaliyet raporuyla Türkiye Emlak Katılım Bankası olarak faaliyetlerine başlamıştır. Giderek büyüyen müşteri portföyüyle sektörde adından sıkça söz ettirmektedir. Bu doğrultuda kendine özgü bir fon kullandırma yöntemi olan proje tercihli özel fon havuzu isimli ürünü müşterilerine sunmuştur. Bu bilgiler doğrultusunda, çalışmada da genel anlamda katılım bankacılığı ile ilgili bilgiler verilmiş olup Emlak Katılım Bankasının çıkarmış olduğu proje tercihli özel fon havuzu ürünü ile ilgili literatür araştırması yapılmıştır. Araştırmanın amacı bankacılık sistemine dahil olmuş insanların yeni bir ürün olarak ortaya çıkan proje tercihli özel fon havuzuyla ilgili bilgi sahibi olup olmadıklarını ölçmek ve ürünü tanıtmaktır. Araştırmanın kapsamı proje tercihli özel fon havuzunun incelenmesidir. Sınırları ise bankacılık sektöründe mülakat yapılan 51 kişidir. Bu konuda daha önce bir çalışma yapılmadığı için araştırma keşfedici bir nitel araştırmadır. Proje bazlı özel fon havuzları, belirli projelerin finansmanını desteklemek amacıyla kullanılan etkili ve yeni finansman aracıdır. Ancak, bu sistemin etkinliğini arttırmak için bazı geliştirilmesi gereken noktalar bulunmaktadır. Şeffaflık ve bilgilendirme, geri bildirim ve iletişim, risk yönetimi-analiz gibi noktalara daha fazla dikkat edilirse yatırımcılar açısından daha etkin olacağı düşünülmektedir. Genel itibariyle bu ürünün tanıtımıyla alakalı eksik kalındığı gözlemlenmiş bu konuda da birtakım adımlar atılması gerektiği kanısına varılmıştır."
