abstract: "Bu tezde, on ikinci hicri yüzyılda yaşayan din alimi“ Şeyh Yusuf Efendi Zade”ye ait olan sahih albuhari açıklama sahifasında yer alan“şirketler”adlı bölümü bilimsel olarak incelenmiş ve dokümante edilmiştir. Şeyh, kitabında sahih abuhari´da yer alan hadisleri açıklamıştır. Tezde, yazarın yaklaşımı ve sahih albuharida yer alan şirketler bölümü açıklamasında kullandığı kaynakları tanıtılmıştır. Tezin önemi, özellikle Arap bilimleri ile ilgili olarak diğer Sahih Buhari yorumcularının çabalarını bir araya getiren, geç Osmanlı bir alimin yazdığı bir sahifanın incelemesinde yer almaktadır. Sahifanın incelenmesi, sahifanın iki nüshası ile yazarın kendi eliyle yazdığı bir temel nüsha karşılaştırılmaya dayanmıştır. Buna ek olarak tezde, yorumlayıcı tarafından benimsenen kaynaklar açıklaması, garip kelimelerin ve deyimlerin belirtilmesi ve söz konusu olan isimleri tanıtılması yer alır. Tüm bunların sunumu ile İmam Buhari ve sahihı hakkında kısa bir bilgi verilmiş, Şeyh Yusuf Zade üzerinede de kısa bir çalışma yapılmış, ve onun döneminde yaşayan osmanlı sültanları, öğrencileri ve hocaları hakkında bilgi verilmiştir. Sonunda bu tezin, Sabahattin Zayyim Üniversitesi'nde bazı öğrencilerin gerçekleştirmiş ve incelemiş olduğu bir dizinin bir parçası olduğunu belirtmemiz gerekmektedir."
