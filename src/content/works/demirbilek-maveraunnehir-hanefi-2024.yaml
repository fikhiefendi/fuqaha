abstract: "Mâverâünnehir'deki Hanefî geleneğin konu edildiği bu çalışmanın amacı, bir mezhebin kimlik inşa sürecini kaynakların imkan verdiği ölçüde ortaya koyabilmektir. Bu yüzden Hanefiliğin oluşum ve Mâverâünnehir'deki gelişim süreci tarihi, siyasi, kültürel ve coğrafi faktörler dikkate alınarak aydınlatılmaya çalışılmıştır. Bu bağlamda birinci bölümde, Ebû Hanîfe, ilk takipçileri ve onların Kufe, Bağdat ve diğer şehirlerdeki faaliyetlerine, geleneğin intikaline tesirleri ölçüsünde değinilmiştir. İkinci bölümde, geleneğin taşıyıcı unsurları olan ulema, ulemanın kurduğu ders halkaları ve bu süreçte üretilen metinler üzerinden Hanefiliğe yüklenen anlam ve bunun temsilcileri belirlenmeye çalışılmıştır. Üçüncü bölümde geleneğin Mâverâünnehir'e taşınması ile oluşan yeni ilim merkezleri ve bu merkezlerin diğer şehirlerle irtibatı hoca talebe ilişkileri ve eser rivayet ağlarının sunduğu verilerden yararlanılarak ortaya çıkarılmıştır. Bölgedeki Hanefilerin kimliklerini oluşturma sürecine muhataplarının katkıları ve tesirlerine dördüncü bölümde odaklanılmıştır. Bu açıdan Mu'tezile, Karamita, Kerramiyye'nin yanı sıra Ashabu'l-Hadis'in bölgedeki en güçlü temsilcisi Şafiiyye ve tasavvufi oluşumların Hanefi ulema üzerindeki tesirleri tespit edilmeye çalışılmıştır. Beşinci bölümde ise tüm bu etkenlerin bölge ulemasının oluşturduğu yazılı literatüre kelami, fıkhi, tasavvufi açıdan ne tür yansımaları olduğu sorusuna kendilerini tanımladıkları kavramlar çerçevesinde cevap aranmıştır. Tarihsel sürecin hicri 5. asra dek getirildiği, yönetimin Sâmânîlerin kontrolünde olduğu bu süreçte yöneticilerin ulema ile ilişkileri, yakın ve uzak muhataplıkların Hanefî geleneğin şekillenmesindeki rolü, bölgedeki ders halkaları ve ortaya çıkan eserler dikkate alınarak incelenmiştir."
