abstract: "Nuh b. Mustafa el-Konevî 17. Yüzyıl Osmanlı'sında yetişmiş allâme ve fakîh bir ilim adamıdır. Zamanının en önemli fıkıh otoritelerinden biri olma ünvanını kazanmıştır. Mesela; Yusuf Efendi'nin kitabında Nuh Efendi'den döneminin Ebû Hanîfe'si diye bahsetmesi O'nun bu yönüne işaret etmektedir. Nuh b. Mustafa, sadece İslamî ilimlerin bir alanında değil, hadis, tefsir, kelam, tasavvuf gibi birçok alanda eserler vermiştir. Eserlerini genellikle kendisine yöneltilen sorulara karşı fetva şeklinde kaleme almıştır. Tahkikini yaptığımız 'el-Fevâidü's-Seniyye fi'l-Mesâili'd-Dîniyye' eseri de namaz hakkında kaleme alınmış güzel bir ilmihal kitabı niteliğindedir. Tezimizin birinci bölümünde, müellifimizin hayatı ve ilmi kişiliğinin yanı sıra, hem fıkha hem de diğer ilimlere dair yazdığı Arapça ve Osmanlıca eserlerinin neler olduğunu anlatmaya çalıştık. İkinci bölümde, 'el-Fevâidü's-Seniyye fi'l-Mesâili'd-Dîniyye' adlı eserimizin sistem olarak nasıl kaleme alındığını, hangi konulardan bahsettiğini kısaca tanıttıktan sonra, müellifimizin eserinde sıkça atıfta bulunduğu ilim adamlarının kimler olduğunun tespitini yaparak, hem bu ilim adamlarının biyografisinden, hem de eserlerinin neler olduğuna yönelik güzel bir çalışma yaptık. Belki de, tezimizin en güzide bölümü olan, Hanefî olan müellifimiz ile Hanefî mezhebinin öne çıkan âlimlerinin namaz konusunu nasıl işledikleri hususunda karşılaştırma yaptık. Son bölümde ise, eserimizin nüshalarının tanıtmını yaptık ve bu nüshalarının hangi kütüphanelerde bulunduğunu tespit ettik. Ayrıca tahkik çalışmamızı yaparken hangi yöntemleri uyguludağımızı ayrıntılı şekilde anlatmaya gayret gösterdik."
