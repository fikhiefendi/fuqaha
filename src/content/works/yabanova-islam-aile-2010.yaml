abstract: "Çalışmada evlilikten doğan ve sürekli bir evlenme engeli olan sıhriyyet, sıhriyetin şartları ve hukuki neticeleri incelenmiştir. Başka yollarla ulaşılamayacak amaçlara hizmet etmesi ve insan neslinin devamını sağlaması bakımından aile önemli bir müessesedir. Kur'an ve Sünnete aile hayatının sağlıklı olabilmesi için evlilik müessesesi kurulmadan önce başlayan ve evlilik hayatı boyunca da devam eden bir takım ilkeler koymuştur. Kimlerle evlenilemeyeceği Kur'an-ı Kerim'de teker teker sayılmış, bu konuda içtihada yer bırakılmamıştır.Araştırmamız için muharremâtla ilgili Kur'an nassları ve hadisler incelenmiştir. Araştırmamız sonunda sıhriyyetin mahiyeti, şartları ve sonuçlarından bahsedilmiş, evlilikten doğan akrabalık sonucu birbirleriyle evlenmesi müebbeden haram olan dört grup insan klasik kaynaklardan istifade edilerek açıklanmaya çalışılmıştır."
