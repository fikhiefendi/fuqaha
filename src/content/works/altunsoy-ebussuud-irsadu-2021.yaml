abstract: "Kur'ân-ı Kerîm, hidayet rehberi olması itibariyle insanlığa sunulmuş son ilâhî kitaptır. Kur'ân'ı anlamak ve hayatımıza aktarmak öncellikle biz Müslümanların daha sonra da tüm insanlığın en mühim vazifesidir. Yüce Allah insana doğru yolun örneklerini en açık şekliyle göstermek maksadıyla Kur'ân'da pek çok peygamber kıssasına yer vermiştir. İnsan hayatı için çok mühim olması sebebiyle müfessirler bu kıssaları açıklayıp gerekli dersleri çıkarmaya önem vermişlerdir. Biz de bu çalışmada Osmanlı Devleti'nin her bakımdan en yüksek seviyeye ulaştığı döneminde yaşamış, dönemin ilim ve siyaset çevrelerine kendini kabul ettirmiş, devrin dini, içtimai ve idari konularında önemli roller üstlenmiş büyük bir devlet ve ilim adamı olan, kendi zamanında Şeyhülislâm, Hoca Çelebi, Ebû Hanîfe-i Sâni unvanlarıyla anılan Ebüssuûd Efen di'nin İrşâdü'l-Akli's-Selîm ilâ Mezâya'l-Kitâbi'l-Kerîm isimli tefsirinde peygamber kıssalarını nasıl işleyip izah ettiğini inceledik. Onun peygamber kıssalarını anlatırken her türlü rivayet ve dirâyet unsurlarını bolca kullandığını gördük. İsrâilî rivayetler karşısında dikkatli olup, uydurma ve akla mantığa ters olan rivayetler konusunda okuyucuyu uyardığını müşahede ettik."
