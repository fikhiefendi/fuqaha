abstract: "Te'vil, genel olarak İslam düşüncesinin oluşum süreçlerinde en etkili olan kavramlardan biridir. Dillerde yaşanan semantik değişim ve kaymalar kapsamında terim anlam kazanan ve fıkıh usulü içerisinde ictihâdın aklî bir yöntemi olarak değerlendirilen te'vilin fürû-i fıkhın şekillenmesinde önemli bir rol oynadığı hususunda şüphe yoktur. Bu anlamda ilke ve prensipleri usulcüler tarafından konan sahih te'vilin mâhiyeti, gerektirici unsurları, şartları ve çeşitlerinin bilinmesi önem arz etmektedir. Bu çalışmada te'vil bir fıkıh usulü kavramı olarak ele alınmış, te'vilin mâhiyet ve niteliği ile sıhhat ve butlan açısından çeşitleri ve müctehidlerin te'vil vasıtasıyla füru-i fıkha dâir ortaya koydukları örnekler üzerinde durulmuştur. Ayrıca te'vil bir yorum biçimi olarak ele alınmış ve diğer disiplinlerle ilgisi değerlendirilmiştir. Neticede te'vilin günümüzde de fıkhî bir istinbât aracı olarak istifade edilebilecek bir kavram olduğu hususuna vurgu yapılmıştır. Anahtar kelimeler: Te'vil, Nas, Müteşâbih, Fıkıh Usulü, İctihâd."
