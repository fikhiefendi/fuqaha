abstract: "Din temelinde inanç, insanlık tarihi boyunca hayatın her safhasında toplumlara yön vermiş bir güç olarak karşımıza çıkmaktadır. Nitekim Kur'an-ı Kerim indirildiği ilk dönemden itibaren hem bireysel hem toplumsal hayata yön vermiştir. Tarihi süreç içerisinde müfessirler Kur'an ayetlerini tefsir ederken faklı metotlar takip etmiştir. Nitekim bazı müfessirler Kur'an'ı edebi yönüyle incelerken, bazıları sosyal hayata dönük içtimai yönünü ele almış, bazıları Kur'an'ın muamelatına dair fıkhi yönünü ele alırken, bazıları tasavvufi yönünü ele almış, bazıları dilsel-lûğavi yönünü incelerken, bazısı da ilmi bilimsel yönlerine değinmişlerdir. Bu çalışma, çağdaş fıkhî tefsir geleneğinin önemli temsilcilerinden Prof. Dr. Hamdi Döndüren'in“Ahkâmu'l-Kur'ân, Kur'ân-ı Kerim ve Fıkhî Tefsiri”adlı eserinde yer alan namazla ilgili ahkâm ayetlerine yaklaşımını incelemektedir. Namaz, İslam dininin beş temel ibadetinden biri olup, Allah'a ibadet etmek, O'na yakınlaşmak ve manevi bir bağ kurmak amacıyla düzenli olarak yerine getirilen, belirli hükümler ve kurallar çerçevesinde uygulanan bir ibadettir. Araştırmada, Döndüren'in farklı mezhep görüşlerini karşılaştırmalı biçimde ele alması, rivayetleri çeşitli boyutlarıyla sunması ve yalnızca Hanefî mezhebiyle sınırlı kalmayarak geniş bir okuyucu kitlesine hitap etmesi gibi yönleriyle eserin özgünlüğüne dikkat çekilmiştir. Ahkâmu'l-Kur'ân hem Hanefî mezhebine mensup bireyler hem de diğer mezheplere bağlı Müslümanlar için kıymetli bir başvuru kaynağı niteliği taşımaktadır. Çalışmanın temel amacı, müellifin namazla ilgili ahkâm ayetlerine dair yorumlarını klasik ve çağdaş ahkâm tefsirleriyle karşılaştırarak değerlendirmek ve bu çerçevede Döndüren'in yaklaşımını ahkâm tefsiri geleneği içinde konumlandırmaktır."
