abstract: "Bu tez, Kıbrıs şer'iyye sicillerinde yer alan ve Müslüman-zimmî ilişkileri kapsamına giren hukukî uygulamaları İslâm hukuku açısından tahlil ederek, yaklaşık üç yüzyıl boyunca Osmanlı idaresi altında kalan Kıbrıs adasında birlikte yaşamış Müslüman ve gayri müslim halkların bir arada yaşama tecrübelerine ışık tutmayı amaçlamaktadır. Araştırma dönemi olarak, adadaki ilk ve en eski şer'î mahkeme uygulamalarını ve Tanzimat öncesi hukukî yapıyı yansıtan 17. ve 18. yüzyıllar, araştırma bölgesi olaraksa, gayri müslimlerin nüfusun yaklaşık üçte ikisini oluşturduğu, Müslüman ve gayri müslim halklar arasında yoğun ilişkilerin kurulduğu Kıbrıs adası seçilmiştir. Çalışmada, Müslümanlar ve zimmîler arasında meydana gelen ve şer'î mahkemeye intikal eden hukukî ilişkilerin neler olduğu, ihtilafların nasıl çözüldüğü ve bu çözümlerde İslâm hukukuna ne ölçüde bağlı kalındığı gibi soruların cevapları aranmıştır. Şer'iyye sicillerinden örnekleme yöntemi ile seçilen belgeler, modern hukuk tasnifine uygun olarak medenî hukuk kapsamına giren şahıs, aile, miras, eşya ve borçlar hukuku başlıkları altında ele alınmış ve tahlil edilmiştir. Tez, giriş ve eklerle beraber üç bölümden oluşmaktadır. Giriş kısmında Kıbrıs'ın 17. ve 18. yüzyıllardaki genel durumu üzerinde durulmuş, birinci bölümde ise Osmanlı Devleti'ndeki şer'î mahkemeler ve şer'iyye sicilleri ele alınmıştır. İkinci bölümde şahıs, aile ve miras hukukuna; üçüncü bölümde ise eşya ve borçlar hukukuna dair şer'î mahkeme kayıtlarının İslâm hukuku açısından tahlilleri yapılmıştır. Çalışmanın sonunda yer alan ekler kısmında araştırmada elde edilen istatistiksel veriler ve örnek belgeler paylaşılmıştır.Tezin temel kaynaklarını, 17. ve 18. yüzyılları kapsayan 22 adet Kıbrıs şer'iyye sicil defteri ile klasik ve çağdaş İslâm hukuku çalışmaları oluşturmaktadır."
