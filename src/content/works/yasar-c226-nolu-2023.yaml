abstract: "Kent tarihi çalışmalarında başvurulacak en önemli kaynaklardan biri olan Şerʻiyye Sicilleri, tutulduğu dönemin ve bölgede yaşayan halkın gündelik hayatını, aile yapısını, yiyecek ve giyecek çeşitleriyle bunların fiyatlarını, mesleki hayatlarını tespit etmemize yardımcı olmaktadır. Bu tez Hudâvendigâr Vilayeti dahilindeki Ertuğrul Sancağı'na bağlı İnegöl Kazası'nın 20. yüzyıl başlarındaki sosyal ve ekonomik yapısının anlaşılması noktasında şerʻiyye sicili temelli bir çalışmadır. Tez çalışması hazırlanırken temel kaynak olarak 1907-1910 tarihlerini kapsayan C 226 numaralı İnegöl şerʻiyye sicil defteri kullanılmıştır. Defterde yer alan bilgiler, Başbakanlık Osmanlı Arşivi'nde İnegöl ile ilgili bulunan belgeler ve Hudâvendigâr Vilayeti Salnameleri'nde yer alan bilgilerle karşılaştırmalı olarak incelenmiştir. İncelenen kaynaklardan ulaşılan bilgiler çerçevesinde 20. yüzyıl başlarındaki İnegöl Kazası'nın sosyo-ekonomik yapısı üzerinde değerlendirmeler yapılmıştır."
