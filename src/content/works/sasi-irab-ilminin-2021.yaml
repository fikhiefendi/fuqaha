abstract: "Bu çalışma, öncelikle metinleri okurken ve analiz ederken nahiv ve i'rabla ilgili karineler arasındaki yakın ilişkiyi göstermek suretiyle i'rabın metinlerin anlamlarını belirtmedeki önemli rolünü göstermeyi ele almaktadır. Bu çalışma, nahiv ve i'rab arasındaki bu yakın ilişkinin varlığına dayanarak, kelimelerin cümle içindeki işlevini belirleme noktasında nahiv ve i'rabın işlevininayırt edilemeyecekboyuta nasıl ulaştığını da ele almaktadır. Çalışma, i'rabın önemi konusunda somut bir gerçeği açıklamaktadır. Bu gerçek de, fıkıh usûlcülerinahvin amacı ve manalara hizmet etmedeki öneminden bahsederken ve usülcü müçtehidin şartları arasında gösterilen ilimlerin kapsamına nahiv ve i'rabı da koymaya sevk eden sebeplerden söz ederkenkendini göstermektedir."
