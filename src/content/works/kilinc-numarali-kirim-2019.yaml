abstract: "Şer'iyye sicilleri, Osmanlı Devleti'nin sosyal ve ekonomik yönünü aydınlatması bakımından önemli bir kaynaktır. Bu kaynak vasıtasıyla Osmanlı halkının günlük yaşamını, uğraşına ve sorunlarına vakıf olabiliriz. Şer'iyye sicilleri tutulduğu dönem ve tutulduğu bölgenin insanlarının hikayesini bize sunmaktadır. Bir köylünün ekip biçtiği ürünü, bir tüccarın satmış olduğu malları veya bir kölenin başına gelen birbirinden farklı durumları muhtevasında barındırmaktadır. Osmanlı Devleti'ne tabi olan Kırım Hanlığı'nda da şer'iyye sicilleri tutulmaktadır. Kırım Hanlığı'nın sosyal, iktisadi, idari, dini, hukuki, etnik ve mimari birçok bilgilerini bu siciller sayesinde ulaşmak mümkündür. Biz de bu bilgiler ışığında 17. numaralı Kırım şer'iyye sicili (H. 1084-1085/M. 1673-1674) transkripsiyonunu ve değerlendirmesini ele aldık. Çalışmamızda sicilin transkripsiyonu tamamlandıktan sonra tasnif işlemi yapılmıştır. Daha sonra hanlığın coğrafyası ve tarihi ele alınmıştır. Sicillerden elde edilen bilgiler sonucunda konusuna göre kayıtlar kullanılmıştır. Elde edilen kayıtlar değerlendirilerek ilk bölümde Kırım Hanlığı'nın idari vaziyeti ele alınmıştır. Hanlığın kazaları, kasabaları, köyleri, mahalleleri ve coğrafi yerleri tespit edilmiştir. İkinci bölümde ise sosyal hayat ele alınmıştır. Hanlık içerisindeki etnik ve dini farklılıklar, aile, suç ve suçlular, toplumda yer alan köleler, unvan ve lakaplar vb. konulara yer verilmiştir. Değerlendirmenin üçüncü bölümünde ise hanlığın ekonomik kısmı 17 numaralı sicil defterine göre sorgulanmıştır. Hanlık içerisinde para birimleri, ölçü ve tartı birimleri, meslek grupları, alım-satım, borç verme-alma ve tereke kayıtlarından elde edilen eşyalar çalışmanın üzerinde durduğu önemli konulardır. Çalışmamız Kırım Hanlığı'nın 1673-1674 yılını kapsayan bir yıllık dönemi içermektedir. Hanlığın sosyal, kültürel ve ekonomik birçok yönünü ortaya çıkarma amacıyla çalışılmıştır."
