abstract: "Osmanlı Devleti altı asrı aşkın tarihi boyunca hüküm sürdüğü topraklarda hoşgörü politikası uygulayarak siyasi, askeri, tarihi ve sosyo-kültürel varlığını devam ettirmiştir. Bir İslam devleti olması ve şer'î kanunları uygulaması sebebiyle Osmanlı Devleti fethettiği bu topraklarda kendine has müesseseleri ile yeni bir kültür ve medeniyet kurmuştur. Osmanlı Devleti'nin kurduğu bu medeniyet“Eski Dünya”diye tanımlanan Asya, Afrika ve Avrupa'nın önemli bir coğrafi kısmında kendisine uygulama alanı bulmuştur. Osmanlı Devleti'nin Avrupa toprakları içerisinde yer alan, Rumeli Eyaleti'ne bağlı Paşa sancağının kazalarından Manastır da bu medeniyetin uygulama alanlarından biri olmuştur. Bu çalışma, Osmanlı Devleti'nin hem merkezden gönderilen idari karar ve emirlerinin yer aldığı hem de Osmanlı kadılarının yerel mahkemelerde ürettiği günlük hukuk uygulamalarının kayıtlarını oluşturan Şer'iye Sicilleri'ne dayalı bir çalışmadır. Çalışmada Manastır sancağına ait 103 Numaralı Manastır Şer'iyye Sicili'nin çeviriyazımı yapılarak defterde geçen belgeler değerlendirilmeye çalışılmıştır. Bu belgelerden faydalanalırak şehrin ekonomik, sosyal, siyasi ve hukuki yapısı hakkında bilgi vermek amaçlanmıştır. İncelenen defterde, vesayet, boşanma, nafaka gibi davalar incelenerek aile hayatı ortaya konulmaya çalışılmıştır. Alım-satım, miras ve terike kayıtlarıyla ekonomik durum hakkında bilgi edinilmiştir. Ferman, berat ve hüccetler tetkik edilerek hukuki meselelerle ilgili bilgiler derlenmiş ve değerlendirilmiştir."
