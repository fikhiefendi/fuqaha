abstract: "Bu çalışmada öncelikle ribânın mahiyeti hakkında bilgi verilmiş, daha sonra nasların muallel olup olmaması görüşüne değinildikten sonra tezin asıl konusu olan Şâfiî mezhebinin ribâ ile ilgili temel görüşleri ele alınmıştır. Çalışma hazırlanırken, Şâfii mezhebine ait kaynak taraması yapılmış ve bu kaynak taramasından sonra başlıklar belirlenmiştir. Başlıkların içerikleri kaynaklardaki delillere binaen düzenlenmiştir.“Altı eşya hadisi”olarak bilinen hadise dayanarak, altın ve gümüşte ribânın illeti (olarak“semen”vasfı ele alınmış ama Şâfiî mezhebine göre diğer paralarda ribânın cereyan etmediği görüşü ortaya çıkmıştır. Buğday, arpa, hurma, tuzda ribânın illeti,“yiyecek olması”dır. Diğer mezheplerin aksine ölçülebilir, tartılabilir, saklanabilme durumuna bakılmaksızın her yiyecekte ribâ cereyan eder görüşüne ulaşılmıştır."
