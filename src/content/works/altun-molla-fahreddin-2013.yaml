abstract: "Molla Fahreddin, 1910-1972 tarihleri arasında Türkiye'nin Güneydoğusunda yaşamış bir alim, mutasavvuf ve yazardır. Molla Fahreddin'in birçok ilim dalında eserleri bulunmaktadır. Bu eserlerin çoğu matbuʻdur. Ayrıca Molla Fahreddin, yaşadığı bölgede tasavvufî faaliyetlerde bulunmuş ve birçok kişiyi irşat etmiştir. Molla Fahreddin, tedrisat ile meşgul olmuş, yetiştirdiği talebeler vasıtasıyla çok büyük kitlelere hitap etmiştir. Molla Fahreddin'in bu etkisi, eserleri ve talebeleriyle günümüze kadar devam etmiştir. Molla Fahreddin, İslam aleminin problemleriyle ilgilenmiş, İslam alemi arasında birliği sağlayacak olan ümmet fikrini telkin etmiştir. Fikri ve mezhebi farklılıkları bir tarafa bırakıp, Müslümanları ümmet paydasında birliğe çağırmıştır. Yaşadığı dönemin gelişmelerini yakından izlemiştir. Özel bir fetva kitabı hazırlamamakla birlikte, müsvedde halinde farklı konularda azımsanmayacak miktarda fetvaları mevcuttur. Molla Fahreddin, özetlemeye çalıştığımız bu durumuyla bilim dünyasında hak ettiği ilgiyi beklemektedir. Maalesef yaptığımız araştırmalara göre hacmi küçük birkaç araştırma hariç, kendisi ve eserleri hakkında herhangi bir bilimsel çalışma yapılmamıştır. Bu sebepten dolayı Molla Fahreddin ile ilgili ulaşabildiğimiz eserleri tetkik attık. Bunun yanında çalışmamıza katkı sağlamak amacıyla konuya vakıf olan şahıslarla görüşmeler yaptık. Çalışmamız, bu alanda azda olsa faydalı olacağını düşünüyoruz."
