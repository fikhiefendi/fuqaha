abstract: "Bu tez, İmam Şâfiî'nin“Kavl-i Kadîm”olarak bilinen erken dönem görüşlerinde hazr ve ibâha kavramlarını incelemektedir. Çalışma, İmam Şâfiî'nin mezhebi içinde zamanla ortaya çıkan kavl-i kadîm ve kavl-i cedîd ayrımının ardındaki fıkhî ve metodolojik sebepleri anlamayı hedeflemektedir. İslam hukuku literatüründe hazr ve ibâha kavramlarının anlamı ve kapsamı, Şâfiî mezhebi bağlamında analiz edilmiştir. Ayrıca, İmam Şâfiî'nin bu iki kavram arasındaki ilişkileri nasıl ele aldığı ve bu bağlamda görüşlerinin nasıl bir evrim geçirdiği tartışılmıştır. Çalışma, öncelikle hazr ve ibâha kavramlarının hem sözlük hem de terim anlamlarını ele almış, bu kavramlarla ilişkili diğer terimler ve delalet biçimlerini incelemiştir. Daha sonra, İmam Şâfiî'nin görüşlerinin zaman içinde nasıl değiştiği ve bu değişimlerin arkasındaki temel nedenler üzerinde durulmuştur. Bu bağlamda, İmam Şâfiî'nin görüşlerinin iki döneme ayrıldığı, bunların kadîm ve cedîd olarak adlandırıldığı, mezhep içerisinde de bu ayrımın etkilerinin görüldüğü belirtilmiştir. Tez, İmam Şâfiî'nin kadîm görüşlerinin ortaya çıktığı bağlamı ve bu dönemdeki temel eserlerini değerlendirerek, bu eserlerde hazr ve ibâha ile ilgili görüşlerini analiz etmiştir. Ardından, cedîd dönemde yapılan değişiklikler ve bu değişikliklerin arkasındaki yeni deliller ve toplumsal gereklilikler ele alınmıştır. İmam Şâfiî'nin bu süreçte Kur'an ve sahih sünneti temel alma konusundaki hassasiyeti de özel olarak vurgulanmıştır. Sonuç bölümünde, İmam Şâfiî'nin hazr ve ibâha konularındaki görüş değişikliklerinin fıkhî, metodolojik ve mezhebi etkileri analiz edilmiş, bu değişimlerin İslam hukuku üzerindeki etkileri tartışılmıştır. Tez, literatürde az çalışılmış bir konuya farklı bir perspektiften yaklaşarak, İmam Şâfiî'nin fıkhî düşüncesine ve metodolojisine dair yeni bir bakış açısı sunmayı amaçlamaktadır."
