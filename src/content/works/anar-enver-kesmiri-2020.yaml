abstract: "Bu araştırma; Giriş, iki ana bölüm ve Sonuç başlıklarından oluşmaktadır. Giriş'te araştırmanın konusu, önemi, amacı, metodu ve kaynakları hakkında hazırlayıcı bilgiler verilmiştir. Birinci Bölüm'de Keşmîrî'nin hayatı ve ilmî faaliyetleri üzerinde durulmuştur. İkinci Bölüm'de Keşmîrî'nin hadis usulü anlayışı, şerh metodu ve hadisçi kimliği incelenmiştir. Araştırma elde edilen sonuçların, varılan kanaatlerin ve yapılan bazı önerilerin yer aldığı bir Sonuç başlığı ile tamamlanmıştır."
