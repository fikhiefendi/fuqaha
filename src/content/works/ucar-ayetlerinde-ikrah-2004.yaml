abstract: "Geçmişten günümüze şöyle bir baktığımızda hiç şüphesiz tarihin her safhasında belli bir dînî inancı veya farklı bir düşünceyi savunan insanların, toplumları veya çok kez donemin otoritesi olan kurumlar veya hakim güç olan sınıflar tarafından dışlandıklarını, ezilmeye ve susturulmaya çalışıldıklarını, bu pasifize edilme, hatta yok edilme çalışmalarında önce iknâya, daha sonra kaba kuvvet ve işkenceye mâruz kaldıklarını görmekteyiz. Bu ikna ya da pasifize etme işleminin korkutucu tehdit ya da işkence ile yapılması Kur'an'da“zorlama, mecbur etme, zor kullanma”anlamlarına gelen ikrah kelimesi ile karşılık bulur. Kur'an bu kelimeyi kimi yerde direkt kullanarak, kimi yerde kullanmadan, kendisine tabî olanların din ve dünyaları hususunda böyle bir durumla karşılaştıklarında nasd bir tavır sergilemeleri gerektiğine işaretlerde bulunur. Ayetlerde Müslümanlara dinleri konusunda yapılan eziyetlere ve baskılara karşı sabretmeleri, dinlerinden dönmeye karşı eğer güçleri yetiyorsa hicret etmeleri (yurtlarını değiştirmelerini) tavsiye edilir. Şayet bunlara güç yetirilemezse kalbin imanla mutmain olması(imanın kalpte sağlam olması) şartıyla dil ile küfür kelimesinin kullanımına ruhsat verilir, kâfirlerle dostluk kurmak zorunda kalındığında ise yine bir ruhsat olan takiyeye başvurulmasına müsaade edilir. İman ve ikrahtan bahsederken kullandığımız ruhsat Müslümanların kendilerine haram kılınan yiyeceklerden yemek zorunda kaldıklarında da gündeme gelmektedir. Buna göre Kur'an helal bir yiyecek bulamadığı için açlıktan ölmekten korkan bir kimsenin haram kılınan yiyeceklerden kendisini ölümden kurtaracak kadar yemesine izin verir. Bu konunun izah edildiği ayetlerde ıztırâr lafzı geçmektedir ki bunun anlamı“mecbur etme, ihtiyaç, zorunluluk hali”dir. Kim yeme içme konusunda haram olan yiyeceklere kaçınılmaz ihtiyaç duyarsa ona bu konuda ruhsat tanınır. Böylece gördük ki Allah kullarının kolaylığını dilemiş ve onlara ruhsat yolunu açmıştır. Ancak ayetlerde de belirtildiği gibi ruhsatlardan asgarî ölçüde yararlanmak gerekir."
