abstract: "Tüm dünyada finansal sistemin önemli bir kısmını işleyişlerinde faize yer veren geleneksel bankalar oluşturmaktadır. İş ve işlemlerinde faiz alan ve veren bu bankaların benzerleri İslam ülkelerinde de kurulmasına rağmen özellikle dini nedenlerle diğer ülkelerdeki kadar gelişme gösterememişlerdir. Bununla beraber özellikle 20. yüzyıl boyunca İslam coğrafyasındaki sanayileşme çabaları ve kalkınma stratejileri kaynak ihtiyacını kaçınılmaz kılmıştır. 1940'lı yıllardan itibaren çeşitli İslam ülkelerindeki düşünürler bu konuyla ilgilenmiş ve zamanla ortaya faizsiz bankacılık çıkmıştır. Ancak bu bankacılık türü sadece İslam ülkeleri ile sınırlı kalmamış, Batılı ülkelerde de büyük bir ilgi görmüştür. Türkiye'de de dünyadakine benzer ekonomik ve toplumsal bir ihtiyacın sonucu olarak ilk faizsiz banka 1985 yılında“Özel Finans Kurumu”ismiyle kurulmuş ve faaliyetlerine başlamıştır. Zaman içinde çeşitli yasal düzenlemeler yapıldıktan sonra, en son 5411 sayılı Bankacılık Kanunu ile mevduat bankaları ile aynı hak ve yükümlüklere sahip olmuş ve isimleri de“Katılım Bankası”olarak değişmiştir. Aynı şartlarda rekabet etme imkânına kavuşan katılım bankalarının bankacılık sektörü içindeki yerinin belirlenmesi ve mali performanslarının diğer bankalar ile karşılaştırmalı olarak ölçülmesi daha önemli hale getirmiştir. Bu amaca yönelik olarak bu çalışmada oran analizi yöntemi kullanılarak katılım bankalarının 2003-2013 dönemine ait performansları ortaya konmaya çalışılmıştır. Bankaların mali tablolarından hesaplanan bazı oranlar yoluyla bankaların; sermaye yeterliliği, likidite yeterliliği, aktif kalitesi, kârlılık, gelir-gider yapısı ve büyüme analizi hakkında yorum yapılmıştır. Yapılan oran analizi sonucunda, incelenen dönem itibariyle aktif, özkaynak, mevduat ve kredilerde katılım bankalarının mevduat bankalarından daha hızlı büyüdüğü tespit edilmiştir. Sermaye yeterliliği açısından mevduat bankaları daha güçlü olsa da bu farkın zamanla kapandığı görülmüştür. Aktif kalitesi açısından aralarında belirgin bir fark bulunmadığı, likidite yeterliliği analizinde ise mevduat bankalarının daha avantajlı olduğu görülmüştür. Bunun sebebi katılım bankalarının topladıkları tüm fonları kredi olarak vermek zorunda olmalarıdır. Kârlılık ve gelir-gider açısından katılım bankaları ve mevduat bankalarının birbirine paralel bir seyir izledikleri söylenebilir."
