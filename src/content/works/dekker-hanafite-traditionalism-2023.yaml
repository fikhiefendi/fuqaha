abstract: "Bu tez, sekizinci/on dördüncü yüzyıl Şamlı gelenekçi Hanefî fakih, kadı ve kelâmcı Ebü'l-Hasen Sadrüddîn Alî b. Ebü'l-İzz'in (ö. 792/1390) Tahâvî Akidesi Şerhi'nin (Şerhu'l-Akîde't-Tahâviyye) teolojisini analiz etmektedir. Ibn Ebü'l İzz, Hanbelî fakihi, kelâmcısı ve tartışmacısı Takiyüddin İbn Teymiyye'nin (ö. 728/1328) öğrenci olan İbn Kesîr'in (ö. 774/1373) talebesi olmuş ve onun düşüncesinden etkilenmiştir. İbn Ebü'l-İzz, Şam'ın önde gelen Hanefî medreselerinde müderrislik yapmış, nihayetinde Şam ve kısa bir süreliğine Kahire Hanefî kadısı olmuştur. İlmî geleneğinden etkilendiği İbn Teymiyye gibi İbn Ebü'l-İzz de başka bir Müslüman âlime yönelik Teymiyeci eleştirilerinin ardından dinî tartışmalara karışmıştır. Günümüzde el-Akîdetü't-Tahâviyye şerhi, İbn Ebü'l-İzz'in özellikle selefî müslümanlar arasında en çok bilinen eseri olmakla birlikte, şerh ancak yirminci yüzyılın ikinci yarısında Arnavut Selefî âlim Nâsırüddin el-Elbânî (1914-1999) tarafından kesin olarak Ibn Ebü'l-İzz'e atfedilmiştir. Mısırlı Hanefî âlim Ebû Ca'fer et-Tahâvî'nin (ö. 321/933) Akîde Ehl-i Sünnet ve'l-Cemâa veya Akîde-i Tahâviyye olarak bilinen itikadı, tartışmasız en iyi bilinen erken dönem sünnî itikadî metnidir. Bu metin, itikadi mezhep bağlılıklarına bakılmaksızın sünnî müslümanların çoğu tarafından sünnî islam itikadının otantik bir ifadesi olarak kabul görmektedir. Bu durum kısmen, Ebü'l-Hasan el-Eş'arî (ö. 324/935-36) ve Ebû Mansûr el-Mâtürîdî'nin (ö. 333/944) çağdaşı olan Tahâvî'nin sünnî kelâm ekollerinin oluşumunu öncelemesinden kaynaklanmaktadır. Bu tez, islam kelamındaki üç temel meseleyi (akıl ve vahiy arasındaki ilişki, imanın tanımı ve Allah'ın kelamının mahiyeti) analiz ederek İbn Ebü'l-İzz'in kelamının temelde İbn Teymiyye'nin düşüncesine dayandığını göstermektedir."
