abstract: "Allah'ın adıyla. Allah'a hamd, Rasülüne, ehline, ashabına ve onu destekleyenlere salat ve selam olsun. Bu çalışma İmam-ı Azam Ebû Hanife en-Nu'man'ın vasiyetinin şerhi olan“Zuhûru'l-atiyye fî şerhi'l-vasıyye”adlı yazma eserin tahkikidir. Eser el-Hasûnî'ye ( ) aittir. Çalışmada İSAM'ın ve Irak Cumhuriyyetinin tahkik esasları dikkate alınmıştır. Buna göre çalışma iki bölümden oluşmaktadır. Birinci bölüm“Dirase”ikinci bölüm ise tahkikten oluşmaktadır. Bu yazma 61 varaktır. Bu eser iman imanın mertebeleri, iman mahluk mu değil mi gibi İslam akidesinin temel konularını içermektedir. Irak Üniversitesindeki hocaların yardım etmesine rağmen başlangıçta eser hakkında pek malümat elde edilememiştir. Daha sonra iki nüsha olarak tespit edilen yazmalardan daha eski, daha açık ve daha özenle yazılmış olana elif (ا), diğerine Bâ (ب) rumuzu verilmiştir. Çalışmada okuyanlara kolaylık olsun diye âyetlerin, hadislerin ve özel isimlerin tahrici yapılmış, bazı garip kelimelerin de anlamı verilmiştir. Metin günümüz imlasına uygun olarak yazılmıştır. Yine de“Her şey tamam olsa da noksanlık vardır”sözünde olduğu gibi çalışmamızın kusurları vardır. Yazmalar İslam ümmetinin ortak mirasıdır, gün yüzüne çıkarılması ve ilim talebelerinin istifadesine sunulması gerekir. Hamd Alemlerin Rabbine aittir."
