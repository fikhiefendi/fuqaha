abstract: "Bu çalışmanın konusu, İslami finansın Türkiye?deki gelişimi, sektörde yaşanan sorunlar ve bu sorunlara çözüm olarak sunulan önerilerdir. Bu kapsamda çalışmanın amacı, dünyada ve Türkiye?de uygulanan İslami finansman modellerini incelemek, bunların Türkiye uygulamalarına ilişkin mevcut sorunları tespit etmek ve çözüm önerileri sunmaktır. Araştırmada yöntem olarak nitel araştırma yöntemlerinden derin görüşme (deep interview) tekniği kullanılmıştır. Görüşmeler 1 Mart 2013 ? 31 Mayıs 2013 tarihleri arasında aralıklı olarak, Konya, Ankara ve İstanbul?da gerçekleştirilmiştir. Düzenleyici-denetleyici organlar, Katılım bankaları ve TKKB, Akademisyenler ve Müşteriler olmak üzere 4 gruptan toplam 70 kişi ile görüşme yapılmıştır. Görüşmeler neticesinde Türkiye?de İslami finansın gelişimini etkileyen temel sorunlar 8 başlık altında toplanmıştır: Otoritenin sektöre bakışı; geleneksel bankacılık yapısına benzerlik; meşruiyet tartışmaları; sermaye kısıtı/şube ve personel sayılarının yetersizliği; enstrüman/ürün yetersizliği; insan kaynakları sorunları; tanıtım, pazarlama ve halkla ilişkiler alanında sorunlar ve muhafazakâr kesimdeki sermaye birikimi. Bu sorunların aşılması için yapılan öneriler ise; katılım bankalarının işleyişini düzenleyen müstakil bir kanunun hazırlanması, danışma kurulları ve mali işler yüksek şurasının kurulması, üniversitelerde İslami finans eğitimlerinin verilmesi, disiplinlerarası ortak akıl çalışmalarının yapılması ve finansal mühendislik faaliyetlerinin geliştirilmesi, şeffaf bir yapı ve güven temini şeklinde kategorize edilmiştir."
