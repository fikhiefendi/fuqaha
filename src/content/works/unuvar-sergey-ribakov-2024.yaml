abstract: "Bu çalışmada S. G. Rıbakov'un 1895 yılında yayımlanan O poetiçeskom' tvorçestve Ural'skih' Musul'man' (tatar', başkir' i tipteriy) [Ural Müslümanlarının (Tatarlar, Başkurtlar ve Tipterler) Şiirsel Yaratıcılığı Hakkında] adlı makalesinde ve 1897 yılında basılan Muzıka i pesni Ural'skih' Musulman' s' oçerkom' ih' bıta [Yaşamlarının Ana Hatlarıyla Ural Müslümanlarının Müzikleri ve Şarkıları] adlı kitabında yer alan Tatar, Başkurt, Tipter ve Nagaybak şarkıları sesbilgisel, biçim-sesbilgisel ve söz varlığı bakımından art-süremli ve eş-süremli yöntemle incelenmiştir. Çalışma Giriş ile birlikte 13 bölümden oluşmaktadır. Bölümlerin sonunda, Rıbakov derlemelerindeki şarkılar notalarıyla birlikte sunulmuştur. Giriş bölümünde tezin konusu, amacı ve yöntemi açıklanmıştır. İkinci bölümde 1875-1900 yılları arasında İdil-Ural bölgesindeki siyasî ve idarî, ekonomik, etnodemografik yapı açıklanarak müzik kültürü hakkında bilgi verilmiştir. Üçüncü bölümde İdil-Ural Türk lehçelerinden Tatar Türkçesi ve Başkurt Türkçesinin Türk dili sınıflandırmalarındaki yeri belirlenerek söz konusu lehçelerin ağızları ve Rıbakov'un derleme güzergâhının bu ağızlardan hangilerine dâhil olduğu belirtilmiştir. Dördüncü bölümde S. G. Rıbakov'un hayatı ve eserleri hakkında bilgiler verilmiş ve bu eserlerdeki şarkıların günümüzdeki varyantları sunulmuştur. Beşinci bölümde Rıbakov derlemelerinin ses düzeni ve imlâ özellikleri ortaya konmuştur. Altıncı bölümde Rıbakov derlemelerindeki Türk kökenli kök biçim birimlerdeki ses olayları; yedinci bölümde alıntı sözcüklerdeki ses olayları art-süremli ve eş-süremli yöntemle değerlendirilmiştir. Sekizinci bölümde, Rıbakov derlemelerindeki biçim-sesbilgisel özellikler; dokuzuncu bölümde dilsel açıdan öne çıkan özellikler belirtilmiştir. Onuncu bölümde Rıbakov derlemelerindeki söz varlığı sınıflandırılarak sözcüklerin kullanım sıklığı ve varyantları tespit edilmiştir. On birinci bölümde, Rıbakov derlemelerindeki metinlerin tıpkı basım, çeviri yazı metni ve Türkiye Türkçesine aktarılmış metinler verilmiştir. On ikinci bölümde Rıbakov derlemelerindeki sözcüklerin dizini eski Türkçe, Kıpçak Türkçesi, Harezm Türkçesi, 20. yüzyıl öncesi İdil-Ural Türkçesi, Çağdaş Tatar Türkçesi ve ağızları ile Çağdaş Başkurt Türkçesi ve ağızları ile karşılaştırmalı olarak sıralanmıştır. On üçüncü bölümde Rıbakov derlemelerinde öne çıkan sesbilgisel, biçim-sesbilgisel ve söz varlığı özellikleri değerlendirilmiştir."
