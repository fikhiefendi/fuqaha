abstract: "İnsana birçok nimet verilmiştir. Bu nimetler arasında gıda maddeleri de yer almaktadır. Kişi bu maddelerle, yaşamının sağlıklı şekilde devam etmesi için önemli yere sahip olan beslenme ihtiyacını gidermektedir. Ancak beslenme ve gıda maddeleri konusunda insan sınırsız bir özgürlüğe sahip değildir. Bunlar hakkında da bazı dinî hükümler bulunmaktadır. Bu hükümlerden bir kısmına doğrudan naslardan ulaşılabildiği gibi bazılarına ise naslardaki genel ilkelerden yola çıkarak yapılan ictihadlar yoluyla ulaşılmaktadır. Müctehidler, yaptıkları ictihadlarda bazen farklı sonuçlara ulaşmışlardır. Bu farklılıklarda, müctehidin yöntemi, bilgi birikimi gibi birtakım değişkenler etkili olmuştur. Ancak ulaşılan hükümlerdeki bu çeşitlilik, kimi insanların zihninde dinde çelişki olduğu sorularının oluşmasına sebep olmuştur. Araştırmamızın amacı, Hanefî ve Şâfiî mezhepleri özelinde, bazı gıdalara verilen hükümleri inceleyerek bu farklılıkların sebeplerini ortaya koymak ve insanların zihinlerinde oluşan sorulara cevap vermektir."
