abstract: "Osmanlı hukukunda önemli bir yere sahip olan fetva literatürü, sadece dini meseleleri değil, aynı zamanda sosyal, ekonomik, idari konuları da kapsayan geniş bir uygulama alanına sahiptir. Bu bağlamda, XVII. yüzyıl Osmanlı ilim ve hukuk tarihinde önemli izler bırakan âlimlerden biri olan Zekeriyyâ-zâde Yahyâ Efendi (ö. 1053/1644) fetvalarıyla dikkat çeken önemli bir şahsiyettir. Yahyâ Efendi, devrin önde gelen ilim adamlarından aldığı derslerin ardından müderrislik, kadılık ve nihayetinde şeyhülislâmlık makamına kadar yükselmiştir. Hem ilmi donanımı ile hem de hukuki meselelere verdiği cevaplarla dikkat çekmiş, böylece sadece çağdaşlarına değil sonraki dönemlere de ışık tutmuştur. Ayrıca şeyhülislâmlık görevinin yanı sıra edebi yönüyle de öne çıkan Yahyâ Efendi, bu alanda etkileyici eserler kaleme almıştır. Edebi yönünün baskın olması fetvalarının daha kolay anlaşılmasına katkı sağlamıştır. Yapılan çalışmada, Zekeriyyâ-zâde Yahyâ Efendi'ye ait olan Fetâvâ-yı Yahyâ Efendi adlı eserin transkripsiyonu yapılmış ve içerik bakımından değerlendirilmesine yer verilmiştir. Eserin dili, üslubu, konuları ele alış biçimi ve verilen cevaplar, klasik Osmanlı fetva geleneğinin devamı niteliğindedir. Bu sebeple eserde yer alan fetvalar, dönemin sosyal yapısını, hukuk anlayışını ve dini hassasiyetlerini yansıtması bakımından önemli ipuçları sunmaktadır. Bu çalışma, Osmanlı fetva geleneğinin tarihsel gelişimini daha iyi kavrayabilmek adına önemli bir katkı sunmaktadır. Ayrıca metnin transkripsiyonu ve değerlendirilmesi, eserin günümüz araştırmacıları tarafından daha kolay ulaşılır ve incelenebilir hale gelmesini amaçlamaktadır. Özellikle metnin Latin harflerine aktarılması sadece tarih alanındaki araştırmacıların değil farklı alanlarda ki uzmanlarında birinci elden kaynağa ulaşmasını mümkün hale getirmiştir."
