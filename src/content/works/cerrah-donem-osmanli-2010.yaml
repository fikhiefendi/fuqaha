abstract: "Bu tez, fıkıh literatüründe ilmihal kavramı, Osmanlının son döneminde ortaya konan ilmihallerden Vesîletü'n-Necât, Musahhah Dürr-i Yektâ, İlmihal'in tanıtım, değerlendirme ve Latinizesi ve müellifleri hakkında bilgi sunmaya dayalı bir çalışmadır.Çalışma, dört temel bölümden oluşmaktadır. Birinci bölümde, ilmihal kavramı, ilmihal bilgisinin önemi, gerekliliği ve faydaları, ilmihal kitaplarının tarihî seyri, son dönem Osmanlı ilmihal literatürü hakkında kısa ve genel bilgi verilmiştir.İkinci bölümde, Ahmed Ziyâüddîn, İmâmzâde Es`ad Efendi ve Süleyman Hüsnü Paşa'nın hayatları, ilmî kişilikleri ve eserleri hakkında kısa bilgi verilmiştir.Üçüncü bölümde, Vesîletü'n-Necât, Musahhah Dürr-i Yektâ ve İlmihal adlı eserlerin tanıtım ve değerlendirilmesi yapılmıştır.Eserin dördüncü ve son bölümünde ise Vesîletü'n-Necât, Musahhah Dürr-i Yektâ ve İlmihal adlı eserler Latinize edilmiştir."
