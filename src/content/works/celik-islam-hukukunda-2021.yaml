abstract: "İnsan, yaratılışı gereği daima toplum içerisinde yaşamak durumundadır. Tarihi süreçte birkaç romana konu olmasının dışında, insanın tek başına yaşadığı görülmemiştir. Bu açıdan toplumun en küçük yapısını oluşturan aileden sonra, insana en yakın çevre, komşuları olmuştur. Komşuluk, asırlar boyu varlığını devam ettiren sosyal bir gerçekliktir. İnsanlık açısından büyük önem taşıyan komşuluk, tarihi süreçte sosyal hayatta farklı görünümler sergilemiştir ve sergilemeye de devam etmektedir. Çünkü değişen hayat şartları, bu farklılığı zorunlu kılmaktadır. Bu değişim, komşulukla ilgili sürekli ve yeni hukuki düzenlemeleri de beraberinde getirmektedir. Bu çalışmada, tarihi süreçten hareket ederek kaynaklarımızda komşulukla ilgili hükümleri tespit etmeye çalıştık. Buradan hareketle günümüzde konuyla ilgili bir kısım teklifler getirilmeye çalışılacaktır."
