abstract: "Bu çalışma, İslami bankaların konsey kararlarını ne ölçüde uyguladıklarını bilmeyi amaçlamaktadır ve çalışma, İslami bankaların konsey kararlarını uygulamada karşılaştıkları en önemli engelleri ve zorlukları göstermektedir. Çalışmada tümevarımcı yaklaşımı esas alan çalışmada, fıkıh meclislerinin konularını ele alan çalışmalar, İslami bankaların şura kararlarını ne ölçüde uyguladıkları ve bu kararların nasıl ilerlediği ve işlediğine dair bir gösterge ve ardından bir açıklama ile tümevarım yaklaşımı esas alınmıştır. İslami bankaların ve bankaların Fıkıh Şûralarının kararlarını nasıl uyguladıklarını, ardından engelleri gösterip açıklamaya çalıştıklarını ve kararlarla İslami bankaları uzlaştırmak için bunlardan nasıl kaçılacağını anlatıyor. Araştırma problemine bir cevaba ulaşmak için analiz ve sonuca dayalı tümdengelimli yaklaşımın yanı sıra. Çalışmada ayrıca veriler için betimsel analitik yöntem kullanılmış ve veriler grafik formlarda sunulmuştur. Araştırmacı anketler hazırladı. Çalışma istatistiksel verileri analiz etmek için SPSS programını kullanmıştır. Çalışma,“İncelenen İslami bankalar, uzlaşma kararlarını uygun bir şekilde uygulamamaktadır”şeklindeki hipotezi reddederek sona ermiştir. Ancak incelenen Filistin bankaları bazı kararları tam olarak uygulamadı."
