abstract: "İslam'ın temel esaslarından biri olan zekât, diğer ibadetlere kıyâsla sosyolojik yönünün daha fazla olması ve hakkında güncel ihtilafları barındırmasıyla temeyyüz etmektedir. Belirli bir malın üzerinden bir kamerî yılın geçmesi (havelânü'l-havl) ve bu maldan belirli oranda belirli kişilere verilmesi ile gerçekleşen zekât ibadetinde, havelânü'l-havl şartı dışında; zekât verilecek malların neler olduğu, nisap miktarlarının arasındaki uyumun güncellenmesi, zekâtın toplanmasının kurumlar tarafından yapılıp yapılamayacağı, uzun süreli borçların zekâta etkisi, zekâtının tenmiyesinin imkânı ve zekâtın sarf yerlerinin güncel karşılıkları vb. konular genel itibariyle zekât hakkında tartışılan meselelerdir. Çalışmamıza konu olan kısım ise zekâtın sarf yerleri ile ilgili klasik ve güncel yaklaşımlardır. Bu sınıflar Tevbe sûresi 60. âyeti ile fakirler, miskinler, zekât memurları (âmiller), müellefe-i kulûb, köleler, borçlular, Allah yolunda olanlar ve yolcular şeklinde sekiz sınıf olarak belirlenmiştir. Kat'i bir delille sabit olduğundan zekâtın bu sınıflar dışında sarfı ibadeti fasit kılmaktadır. Çalışmamızın amacı bu sınıfların klasik fıkıh mezheplerince nasıl anlaşıldığını ve bu anlayışın sebebini ortaya koyduktan sonra günümüzde başta dünyanın önde gelen fetva kurulları ve muasır alimleri nezdinde nasıl karşılık bulduklarını tespit etmeye çalışmaktır."
