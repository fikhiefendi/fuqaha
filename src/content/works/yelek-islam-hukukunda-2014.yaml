abstract: "Vaadin bağlayıcılığı, İslam iktisadının ve modern akitlerin en tartışmalı meselelerinden birisidir. Teorik planda tartışılan temel mesele; akitlerde taraflardan birinin veya her iki tarafın ortaya koyduğu vaadin taraflar açısından bağlayıcı olup olmadığıdır. Bu çalışma giriş ve dört bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu ve önemi ele alınmıştır. Birinci bölümde ilk olarak“vaad”kelimesinin kavramsal analizi ile bu kavramın ilişkili olduğu diğer kavramlar üzerinde durulmuştur. Daha sonra konuyla ilgili temel kaynaklar dikkatlice incelenip mezheplerin ve önde gelen fıkıh âlimlerinin konuya ilişkin görüşleri tespit edilmeye çalışılmıştır. İlk dönem kaynakları analiz edilirken ağırlıklı olarak Hanefi mezhebinin metinleri kullanılmıştır. Ancak konuyu bütüncül bir şekilde görmek için diğer mezheplerin ve âlimlerin bu konuya ilişkin görüşlerine de yer verilmiştir. İkinci bölümde, şarta bağlanan (ta'lik edilen) vaadin hükmü incelenmiştir. Konuyla ilgili olduğu için bu bölümün birinci kısmında“şart ”ve“ta'lik”konusuna değinilmiştir. Bu bağlamda şartın lugavî ve ıstılahî anlamı ile çeşitleri ele alındıktan sonra“şarta ta'lik”konusu ortaya konulmuştur. İkinci kısımda ise, şarta ta'lik edilen vaadin hükmü ve sonuçları incelenmiştir. Üçüncü bölümde ise, içerisinde vaad unsurunu barındırması sebebiyle“ bey' bi'l-vefâ”akdi ele alınıp incelenmeye çalışılmıştır. Bu bağlamda bu akdin tanımı, ortaya çıkışı, keyfiyeti, hükmü ve hukuki sonuçları üzerinde durulmuştur. Dördüncü bölümde de murâbaha bağlamında modern dönemdeki vaad tartışmaları ele alıp incelenmiştir."
