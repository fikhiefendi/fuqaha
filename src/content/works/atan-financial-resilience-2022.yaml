title: "Financial Resilience of Conventional Versus Participation Banking: Evidence from Macro Stress Testing Approach and Risk Spillovers Analysis"
titleTranslation: {"tr": "Konvansiyonel bankacılık ve katılım bankacılığının finansal dayanıklılıklarının karşılaştırılması: Makro stres testi ve risk yayılımı analizi yaklaşımları"}
