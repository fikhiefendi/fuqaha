fullText: "https://tez.yok.gov.tr/UlusalTezMerkezi/TezGoster?key=sELqxhTlFGAjsbjOuuiyCG-ckV1Bg16JdmAiU-mk3jIcQFT9PoyOdA2ONGsB0RvO"
abstract: "Faizsiz finans ilkeleriyle geleneksel finans sistemine alternatif bir yaklaşım sunan katılım bankacılık sistemi, son 20 yılda küresel piyasalarda yükselerek birçok ülkede varlığını sürdürmektedir. İslam hukukuna dayalı ürün ve hizmetlere yönelik artan tüketici talebi, bu dönemde katılım bankacılığını küresel ekonominin ön saflarına taşımıştır. Yatırımcıların ilgisini çekebilecek bir diğer faktör de katılım bankacılığının finansal riskleri yönetme yaklaşımıdır. Katılım bankalarının, özellikle 2008 mali krizi sırasında, geleneksel bankalardan daha iyi performans gösterdiğini belirten çalışmalar, katılım bankacılık sisteminin küresel risk yayılımları için güvenli bir liman olabileceği savını ortaya koymuştur. Bu bağlamda son dönemde geleneksel bankacılık sistemi ile katılım bankacılık sistemi arasındaki farklılıklar ve benzerlikler üzerine birçok araştırma yapılmıştır. Literatürde katılım bankacılığını geleneksel bankacılıktan ayıran temel özellikler tartışılmıştır. Bu bağlamda İslami finans sistemi, İslam Hukuku tarafından kısıtlanan işlemleri tamamen yasaklamaktadır. İslam hukukunda en belirgin kısıtlama faizdir (Riba). Katılım bankaları, miktarı sabit veya önceden belirlenmiş herhangi bir ödemeye izin vermemektedir. Bunun yerine mevduat sahiplerinin bir ortak olarak düşünüldüğü kar-zarar risk paylaşım anlaşmalarını teşvik etmektedir. Ayrıca, herhangi bir mali eylem aşırı belirsizlikten (Gharar) ve spekülasyonlardan (Maysir) uzak olmalıdır. Bu farklarla birlikte katılım bankalarını geleneksel bankalardan ayıran temel özelliklerden biri de ikili denetleme sistemine sahip olmasıdır. Bu bağlamda katılım bankaları geleneksel bankaların sahip olduğu banka denetleme kurullarının yanı sıra finansal işlemlerin İslam hukuk kurallarına uygun olup olmadığının gözetildiği ikinci bir denetleme kuruluna sahiptir. Literatürde yapılan bazı çalışmalar ikili denetleme sisteminin katılım bankalarının performanslarına olumlu yönde katkı sağladığını tespit etmiştir. Katılım bankacılığının bu farklılıklara sahip olmasının özellikle katılım bankalarını yüksek borçluluk ve kaldıraç oranlarının risklerinden koruduğunu söylemekle birlikte son dönemde yapılan çalışmalar katılım bankalarının eskiye nazaran daha güvenli olmayabileceği belirtilmiştir. Son dönemde geliştirilen teverrük, emtia murabahası gibi araçların katılım bankacılığı ilkeleri ile çelişebileceği ve katılım bankacılığını geleneksel finans sistemine karşı daha dayanıklı kılan özelliklerin ortadan kalkabileceği savunulmuştur. Bu noktada katılım bankalarının geleneksel bankalara bir alternatif mi, yoksa onlarla rekabet eden bankalar mı olduğu sorusu gün geçtikçe önem kazanmıştır. Katılım bankaları ile ilgili öne çıkan bir diğer konu ise katılım banka uygulamalarının dünya genelinde bir standardı olup olmadığı tartışmasıdır. Özellikle katılım bankacılığının geleneksel bankacılık sistemine göre yeni olması ve farklı ülkelerde farklı İslam hukuk ilkelerine göre uygulamaların olması bazı araştırmacılar tarafından katılım bankalarının dünya genelinde heterojen bir sisteme sahip olmasıyla açıklanmıştır. Bununla birlikte bazı araştırmacılar son dönemde gelişen İslami Finansal Kuruluşlar Muhasebe ve Denetim Kurumu(AAOIFI/ The Accounting and Auditing Organization for Islamic Financial Institutions), İslami Finansal Hizmetler Kurulu (IFSB/Islamic Financial Services Board) gibi katılım bankacılığı standartları ve ilkeleri oluşturan kurumların artmasıyla katılım bankacılığının genel olarak homojen bir düzene evrildiğini savunmaktadır. Yukarıda bahsettiğimiz bu gelişmeler ışığında, bu tez katılım ve geleneksel bankaları dünya ölçeğinde ve Türkiye bağlamında karşılaştıran üç makaleden oluşmaktadır. Birinci bölümde, çok değişkenli kantil otoregresyon tekniğini kullanarak İslami ve geleneksel bankaların hisse senedi getirilerinin büyük finansal şoklardan nasıl etkilendiğini incelemektedir. 2009-2018 dönemi için 16 ülkeden gelen 192 bankanın verilerine dayanarak, katılım ve geleneksel bankaların finansal risk yayılımlarına karşı olan duyarlılıklarını hem küresel hem de bölgesel düzeyde mukayese etmiştir. Küresel finans endeksler için Dow Jones Endüstriyel Endeksi, MSCI Dünya Endeksi, 10 yıllık Amerika hazine tahvil fiyatları ve Volatilite Endeksi kullanılmıştır. Bölgesel mukayese yapılırken katılım bankacılığının bulunduğu ülkeler Kuzey Afrika ve Orta Doğu (MENA) ülkeleri, körfez ülkeleri ve Asya ülkeleri olmak üzere üç grupta incelenmiştir. Bankaların risk duyarlılıkları incelenirken model doğrultusunda elde ettiğimiz kantil etki tepki fonksiyonları ilk gün şoku üzerinden değerlendirilmiştir. Bu bağlamda bankalar küresel finansal endekslerde meydana gelen bir şok karşısında hisse senedi fiyatlarındaki değişimin ilk gün etkilerine göre farklı gruplara ayrılmıştır ve bu gruplar arasında bir fark olup olmadığı Wilcoxon Rank Sum testi ile analiz edilmiştir. Bu araştırmanın temel amacı, temel finansal endeksler ile banka hisse fiyatları arasında bir bağlantı olup olmadığını gözlemlemektir. Son araştırmalar, banka hisse senedi fiyatının bankaların genel performansıyla bağlantılı olduğunu bulmuştur. Bu bağlamda banka hisse senedi performansı, bankanın genel risk duyarlılığı hakkında bilgi vermesi açısından kritik öneme sahiptir. Elde ettiğimiz sonuçlar küresel finansal endekslerle banka hisse senet getirileri arasında kuyruk bağımlılığı olduğunu ortaya koymuştur. Katılım ve geleneksel bankaları mukayese ettiğimizde ise küresel ve bölgesel finansal şoklara duyarlılık açısından bir fark tespit edilememiştir. Bu sonuç, katılım bankacılık piyasalarının 2008 mali krizinden bu yana faize dayalı finansal sistemler üzerindeki göreceli finansal dayanıklılığını kaybettiği anlamına gelebilir. Bununla birlikte bazı raporların katılım bankacılığının uygulandığı bölgelere göre farklı performans gösterdiğini iddia eden çalışmaların aksine, sonuçlarımız katılım bankalarına yönelik şokların etkilerinin Körfez, MENA ve Asya ülkelerinde homojen olduğunu ortaya koymaktadır. Bu sonuçlar yukarıda bahsettiğimiz son 10 yılda etkinliği artan AAOIFI ve IFSB tarafından yayınlanan İslami finans ilkeleri ve standartlarındaki son gelişmelerin küresel anlamda katılım bankalarını performans açısından birbirlerine yakınlaştırmasıyla açıklanabilir. Tezin ikinci bölümünde ise ilk bölümde yaptığımız analiz genişletilerek, 2010-2020 dönemi için çok değişkenli kantil regresyon tekniği ile 14 gelişen piyasa ülkesinden 170 banka üzerinde analiz yapılmıştır. Bu araştırmanın temel amacı, bankaya özgü değişkenlerin katılım ve geleneksel banka hisse senedi fiyatları üzerindeki risk yayılımlarını nasıl etkilediğini gözlemlemektir. Bankaya özgü değişkenler için literatürde ikili bankacılık sistemini mukayese ederken en çok kullanılan kaldıraç oranı, toplam varlıklar ve sermaye yeterlilik oranı verileri kullanılmıştır. Bulgularımız katılım ve geleneksel bankaların risk duyarlılıklarına etki etmesi açısından bankaya özgü değişikliklerin benzerlikler ve farklılıklar gösterdiğini ortaya koymuştur. Bu bağlamda her iki banka türü için de yüksek kaldıraç oranları küresel hisse senetlerinde meydana gelecek bir şok karşısında bankanın maruz kaldığı şokun etkisini artırmaktadır. Veri setimizde kullandığımız kaldıraç oranları Datastream'den alınmıştır ve toplam borcun toplam varlıklara oranı olarak tanımlanmıştır. Bu açıdan kaldıraç oranları adına elde edilen sonuçlar bankaların borçlarının artması ile birlikte risk duyarlılıklarının artması şeklinde yorumlanabilir. Diğer önemli bankaya özgü değişken banka büyüklüğünün her iki banka türü için farklı etkileri bulunmaktadır. Katılım bankaları adına küçük bankalar finansal şoklara karşı büyük katılım bankalarına oranla daha dayanıklı bir performans sergilemiştir. Literatürde yapılan çalışmalar katılım bankalarının uyguladığı kar-zarar ortaklık sisteminin farklılıkları dolayısıyla kredi riskinin artabileceğini vurgulamaktadır. Dolayısıyla büyük bankalarda kar zarar ortaklık sisteminin takibi daha karmaşık bir hal alacağından ötürü kredi risklerinin yüksek olacağı ve küçük bankalara oranla risklere karşı daha duyarlı olacağı vurgulanmıştır. Bununla birlikte geleneksel bankalara baktığımızda şokun etkisinin banka büyüklüğünün her seviyesinde aynı olduğunu görmekteyiz. Bu sonuç, literatürde banka büyüklüğünün finansal istikrar üzerinde etkisi adına elde edilen farklı bulgularla uyumlu olduğunu söyleyebiliriz. Son olarak sermaye yeterlilik oranları yüksek olan geleneksel bankalar sermaye yeterlilik oranı düşük olan geleneksel bankalara oranla daha iyi bir performans sergilerken, katılım bankalarında sermaye yeterlilik oranlarının etkisi açısından farklı sonuçlar elde edilmiştir. Bu durum, geleneksel bankalar için geliştirilen sermaye yeterlilik standartlarının katılım bankalarının sahip olduğu farklı finans modelini tam anlamıyla ölçememesi sebebiyle izah edilebilir. Üçüncü bölümde ise Türkiye'deki İslami ve konvansiyonel bankaları karşılaştırmak için stres testi analizi yapılmıştır. Bu bölümün temel amacı, Türkiye'deki bankaların sermaye yeterlilik oranlarının makroekonomik tehditlere karşı ne kadar hassas olduğunu belirlemektir. Ayrıca, bankacılık sektörünü geleneksel ve katılım bankaları olarak ikiye ayırarak, hangi bankacılık türünün sermaye yeterlilik oranlarının makroekonomik değişkenlerden daha fazla etkilendiği araştırılmıştır. Stres test analizimiz için iki model kullanılmıştır: toplamsal yarı parametrik kantil regresyon modeli (Koenker 2010,2011) ve yarı parametrik kantil panel modeli (Cai ve diğerleri (2018) Bunun yanı sıra son dönem verileri kullanılarak yarı parametrik kantil regresyon sonuçlarını desteklemek amacıyla senaryo analizi oluşturulmuştur. Stres test üzerinde yapılan çalışmalar ışığında, bu bölümde sermaye yeterlilik oranları üzerinde etki edebilecek değişkenler kamu stok borçluluk oranı, döviz kuru (dolar), repo faiz oranı ve işsizlik oranı olarak belirlenmiştir. Toplamsal yarı parametrik kantil regresyon modeli doğrultusunda elde ettiğimiz sonuçlarda açıklayıcı değişkenler parametrik olmayan, yarı parametrik ve tam parametrik değişken olarak kullanılmıştır. Elde ettiğimiz sonuçlar doğrultusunda verilerin doğrusal kullanılmadığı parametrik olmayan analizlerden elde edilen sonuçların yarı parametrik ve parametrik analizlere oranla istatistiksel olarak daha anlamlı sonuçlar verdiği görülmüştür. Bu bölümde elde ettiğimiz sonuçlarda ise katılım ve geleneksel bankaların sermaye yeterlilik oranlarına etki eden değişkenlerin hepsi pozitif ve anlamlı olmakla birlikte marjinal etkileri açısından farklılıklar gösterdiğini görmekteyiz. Öncelikle kamu borç stok oranının etkisi geleneksel bankaların sermaye yeterlilik oranları üzerinde pozitif ve artan bir etkisi olmaktadır. Katılım bankaları için bu etki pozitif olmakla birlikte bu etki bazen azalan bazen artan seviyelerde seyretmektedir. Aynı şekilde döviz kurundaki artış karşısındaki marjinal etki katılım bankaları yeterlilik oranları üzerinde pozitif ve artan bir etkiye sahipken geleneksel bankalar için bu etki pozitif ama dalgalı şekilde seyretmektedir. Dolayısıyla sermaye yeterlilik oranları için geleneksel bankalarda kamu borç stoğunun katılım bankalarında ise döviz kurunun daha etkili bir değişken olduğunu söylememiz mümkündür. Bununla birlikte işsizlik oranlarının sermaye yeterlilik oranları üzerindeki etkisi her iki banka türü için de pozitif olmakla birlikte bu etki, işsizliğin bütün oranları için aynı seviyede seyretmektedir. İşsizlik oranının sermaye yeterlilik oranları üzerinde diğer değişkenler kadar etkili olmadığı görülmektedir. Son olarak repo faizinin etkisini incelediğimizde ise her iki banka türü için de sermaye yeterlilik oranı üzerindeki marjinal etkinin bazen azalan bazen artan bir etkiye sahip olduğu tespit edilmiştir. Stres test senaryo analizleri doğrultusunda bir adımlık öngörü senaryoları ve olasılık analizleri gerçekleştirilmiştir. Bir adımlık senaryo öngörüsünde uç kantil değerleri parametrik olmayan analizlerine elde edilen sonuçlar kullanılarak hem açıklayıcı değişken hem de sermaye yeterlilik oranı kantil değerlerine göre ayrı ayrı gerçekleştirilmiştir. Elde edilen sonuçlar parametrik olmayan kantil regresyon sonuçlarını desteklemektedir. Bu doğrultuda geleneksel bankalar için borçluluk oranında meydana gelen artış sermaye yeterlilik oranlarında ciddi oranda yükselişe sebep olurken katılım bankaları için bu değişken döviz kuru olmaktadır. Bir adımlık tahmin yöntemi kısmında mevcut veriler değerlendirilerek bankaların açıklayıcı değişkenlerin sermaye yeterlilik oranlarına farklı kantiller üzerinde etkisi araştırılmıştır. Olasılık analizlerinde ise kötü senaryo ve iyi senaryo oluşturularak sermaye yeterlilik oranlarının açıklayıcı değişkenlerde meydana gelebilecek bir şok karşısında eşik değerlerinin altında ya da üstünde kalıp kalmayacağı irdelenmiştir. Elde edilen sonuçlar katılım bankaları için dövizde meydana gelen şokların daha belirleyici olduğunu gösterirken geleneksel bankalar için kamu borçluluk oranı daha etkili olmaktadır. İşsizlik oranındaki değişimler sermaye yeterlilik oranları üzerinde her iki banka türü için de fazla bir değişikliğe sebep olmazken repo faiz oranındaki değişimler katılım ve geleneksel bankalar için dalgalı bir seyir izlemektedir. Olasılık analizlerinde ise her bağımsız değişken için oluşturulan senaryo değerleri karşısında sermaye yeterlilik oranlarının iyi ve kötü koşullarda eşik değerlerinin altında kalma veya üstüne çıkma ihtimalleri hesaplanmıştır. Bu analizlerde de, daha önce yapılan çalışmaları destekler nitelikte, katılım bankaları için döviz kurundaki değişimler ve geleneksel bankalar için kamu borç stok oranındaki değişimler kötü senaryolar için sermaye yeterlilik oranının eşik altında çıkma ihtimalinde etkili rol oynamıştır. Yarı parametrik kantil regresyon modelinden elde edilen sonuçlar ise katılım bankalarının sayısının az olması dolayısıyla sadece geleneksel bankaları kapsamaktadır. Bu kısımda banka büyüklüğü dikkate alınarak zaman serisinde kullanılan değişkenlerin sermaye yeterlilik oranlarına olan etkisi araştırılmıştır. Bulgular, geleneksel bankaların büyüklüğü ve sermaye yeterlilik düzeyi arttıkça, kamu borç oranı ve faiz oranındaki artışa karşı sermaye yeterlilik oranlarını küçük ve orta ölçekli bankalara oranla daha fazla artırabildiğini ortaya koymuştur."
