abstract: "İslam bankalarının faaliyet gösterdiği her yerde bu bankaların İslami niteliğinin korunması, işlemlerini İslami ilkelere göre gerçekleştirmesi ve değişen şartlara uyum sağlayacak şekilde geliştirmesini temin etmek üzere bu kurumlarla eşgüdümlü olarak çalışan şer'î/fıkhî denetim yapılarının bulunması bir zorunluluk olarak ortaya çıkmış, bu yüzden İslamî bankacılığının ortaya çıktığı günden itibaren farklı isimler altında olsa da bankaların işlemlerini denetlemek amacıyla kurulan şerî denetim sistemleri bulunmuştur. Senegal'de İslamî bankacılığının ilk örneği 1981 yılında Prens Muhammed Faysal Âl-i Suûd ile dönemin Senegal Cumhurbaşkanı Abdou Diouf arasında imzalanan anlaşmaya dayalı olarak kuruluşu 1983'te tamamlanan Masraf Faisal al-İslâmî Senegal olmuştur. Senegal'deki ilk İslam bankasının adı daha sonra Senegal İslam Bankası (La Banque Islamique du Senegal, BIS) şeklinde değiştirilmiştir. Şer'î denetim, diğer bir ifadeyle fıkha uygunluk denetimi belirgin bir şekilde özellikle İslamî finans kuruluşların farklı ülkedeki yaygınlaşmasıyla birlikte ortaya çıkmıştır. Biz bu çalışmada Senegal'de İslamî bankalarındaki şer'î denetimi, bu kurumlardaki şer'î denetimin yapısı ve işleyişini inceleme konusu yaptık. Çalışmamızın odağını oluşturan konular şunlardır: Kurumlarda şer'î denetimin mekanizmalarının şekli yapısı (idari birim/heyet/kurul meclis), şer'î denetimin yetkileri ve bu yetkilerin kapsamı, denetim ve uygunluk kriteri olarak belirlenen ilan edilmiş standartların bulunup bulunmadığı, standartlara uyum konusunda anılan kurumların başarısının örnekler üzerinden incelenmesi. İslamî bankacılığıyla birlikte ortaya çıkan denetim yapıları üzerinde zaman içinde nispeten geniş bir literatür oluşmuştur. Farklı ülkelerdeki tecrübeleri konu edinen müstakil eserler kaleme alınmış olmakla birlikte Senegal tecrübesi müstakil olarak bir akademik inceleme konusu yapılmamıştır. Biz bu çalışmada anılan eksikliği gidermek amacıyla Senegal'deki İslami bankaların şer'î denetim yapıları ve bunların işleyişini inceledik. Senegal'de halen faaliyet gösteren bir müstakil İslamî bankası kurumu bulunmaktadır. Bunun yanında ülkede faaliyet gösteren konvansiyonel bankalardan biri içinde İslami ilkelere göre işlem yapan özel bir birim bulunmaktadır. Bunun dışında ülkede küçük ölçekli İslamî finansal kuruluşlar da mevcuttur. Çalışmada şerî denetimin yapı ve işleyişi bu kurumlardan biri olan BIS örneğine yoğunlaşarak inceledik."
