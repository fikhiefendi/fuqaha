abstract: "“Mezhepler Tarihi Açısından Cafer es-Sadık”adını taşıyan araştır- mamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde Cafer es-Sadık'a ait olan ve ona nisbet edilen eser- lerden bahsedildi. Cafer es-Sadık'm döneminin sosyo-politik yapısı ve siyasi idareyle ilişkisi ve döneminin fikir hareketleri üzerinde durulmaya çalışıldı. Birinci bölümde, Cafer es-Sadık'ın tarihi ve menkabevi hayatı geniş ölçüde ortaya konulmaya çalışıldı. O siyasi hüviyetinden çok, ilmi şah- siyetiyle tanınmıştır. Dönemindeki hiç bir isyana katılmadığı gibi, Şii isyanlarda da tarafsızlığını bozmamıştır. Cafer es-Sadık bir çok seçkin ulemadan ders almış, bir çok değerli alim yetiştirmiştir. Cafer es-Sadık ve Ebu Hanife arasındaki ilişki değerlendirildi. Hadis alimleri O'nun güvenilir ve sağlam bir ravi olduğu konusunda ittifak etmişlerdir. Şîi kaynaklarda Menkabevi hayatını değerlendirirken Gayb ve Cifr ilmi hak- kında geniş ölçüde bilgi verildi. Cafer es-Sadık tasavvuf tatarihinde de önemli bir yere sahiptir. Bütün sufiler Cafer es-Sadık'ı evliyadan saymış- lardır. Ayrıca Cafer es-Sadık'a nisbet edilen eserlerin aidiyeti şüphelidir. İkinci bölümde Cafer es-Sadık'ın İlikadî (Tevlıid, Nübüvvet, Kur'an, Ahiret, Kader ve Büyük Günah), Siyasi (Sahabe, İmamet, Siyaset) görüş- leri ortaya konuldu. Cafer es-Sadık'ın Takiyye, Bed'a, Kaim'in Gaybeti, Zuhuru ve Hakimiyeti hakkındaki görüşleri değerlendirildi. Üçüncü bölümde, Cafer es-Sadık herkesin ittifaken kabul ettiği bir imam olduğu için bir çok Şii fırkalar, batıl görüşlerini ona isnad ederek, kendilerine meşruiyyet kazandırmak istemişlerdir. Cafer es-Sadık ve Gulat bölümünde gulat fırkaların savundukları ilahlık, peygamberlik, mucize, takiyye, bed'a, rec'at, tenasüh, hulul, teşbih gibi sıfatlardan uzak kalıhış bu gibi saçmalıkları yapanları lanetlemiş ve onların liderlerini kovmuştur. Cafer es-Sadık'ın görüşleri ile İmamiyye'nin fıklıi konu- lardaki görüşleri çok önemli ayrılıklar göstermemektedir. Ancak inanç esasları ile ilgili hususlarda dikkat çekici özellikler taşımaktadır. Herşeyden evvel Tevhid, Nübüvvet ve Ahiret gibi üç temel usulde birleş- miş olmakla birlikte, imametin usuli'd-din içine sokulması ve dolayısı ile Hz. Muhammed'den sonra belli kişilere üstünlük sağlaması bu kişilerin Peygamber gibi ismet sahibi ve başkalarında olmayan özel bir bilgiye sahip bulundukları gibi hususun kabul edilmesi Cafer es-Sadık ile bağ- daşmamaktadır."
