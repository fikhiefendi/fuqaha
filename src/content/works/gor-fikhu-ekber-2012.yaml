abstract: "Ebû Hanîfe (80-150/699-767) ve İmam Şâfiî (150-204/767-820), İslâm düşünce tarihinin teşekkülündeki en önemli simalardandır. Bu iki önemli zata ait aynı isimli ?el-Fıkhu'l-Ekber? Akâid-Kelâm eseri bulunmaktadır. Çalışmamızda bu eserler bağlamında adı geçen İslam âlimlerinin kelâmi görüşlerini inceledik.Ebû Hanîfe'nin el-Fıkhu'l-Ekber'i, selefî metoddan kelâm metoduna intikal özelliği taşıyan bir eserdir. Bu eserde inanç esasları sade ve tartışmadan uzak bir biçimde özet olarak ifade edilmektedir.İmam Şâfiî'ye nispet edilen el-Fıkhu'l-Ekber'inde ise konular, Ebû Hanîfe'ye nispetle daha ayrıntılı olarak ele alınmıştır. Özellikle Allah'ın sıfatları konusu eserde genişçe yer tutmaktadır. Eser, sistematik bir kelâm kitabı niteliğindedir. İmam Şâfiî, konuları nasslarla ve aklî delillerle izah etmiştir. Gerekli gördüğü yerlerde ayrıntıya girmeden muhaliflerine verdiği cevaplarla da dikkat çeker.?el-Fıkhu'l-Ekber Eserleri Bağlamında Ebû Hanîfe ve İmam Şâfiî'nin Kelâmî Görüşleri? adlı araştırmamız bir giriş ve iki bölümden müteşekkildir. Giriş bölümümüzde müelliflerin yaşadıkları sosyo-kültürel çevre hakkında bilgi verilmiştir. Birinci bölümde Ebû Hanîfe ve İmam Şâfiî'nin hayatları ile ilmî kişilikleri; ikinci bölümde el-Fıkhu'l-Ekber eserleri bağlamında Ebû Hanîfe ve İmam Şâfiî'nin kelâmî görüşleri incelenmeye çalışılmıştır. Sonuç kısmında ise Ebû Hanîfe'nin İmam Mâtürîdî'ye, İmam Şâfiî'nin de İmam Eş'arî'ye kaynaklık edip etmediği ifade edilmiştir. Bu çalışmanın geçmişte de ele alınan bu konulara yeni bir katkı sağlayacağını ümit ediyoruz."
