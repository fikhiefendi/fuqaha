abstract: "XVI. yüzyılda Osmanlı ilim dünyasına damgasını vuran âlimlerin başında geldiği söylenebilen İbn Kemal Paşa el-Vikâye'de gördüğü hataları tashih etmek üzere önce el-Islâh'ı kaleme almış, sonra da -Şerhu'l-Vikâye'de gördüğü hataları da dikkate alarak- bir yandan el-Islâh'ın ihtiva ettiği meseleleri açıklamak, bir yandan da el-Vikâye'ye yönelttiği itirazların gerekçelerini ortaya koymak için el-Islâh'ı Îzâhu'l-Islâh adıyla şerhetmiştir. Ancak İbn Kemal Paşa'nın Hanefî mezhebine mensup âlimlerce pek muteber kabul edilen el-Vikâye ve şerhine yönelttiği tenkitler de tenkitten nasibini almış ve eleştirilerinin çoğunun yerinde olmadığı ileri sürülmüştür. Bu çalışmada İbn Kemal Paşa'nın tenkitleri Hanefî fıkhının muteber kaynakları ışığında tahlil edilip isabetli olup olmadığı ortaya konmaya çalışılacaktır."
