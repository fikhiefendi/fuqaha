abstract: "Fıkıh usulü telifinde fukahâ ve mütekellimîn olmak üzere iki metodun olduğu, genelde ilk metodu Hanefî âlimleri, ikinci metodu ise diğer üç mezhep âlimlerinin kullandığı bilinmektedir. Bunun yanında sonraki dönemlerde iki metodun karışımından ibaret olan memzûc metot ortaya çıkmıştır. Fukahâ metodunu benimseyen Hanefî mezhebinin bünyesinde Irak ve Semerkant ekolü olmak üzere iki ekolün bulunduğu bilinmektedir. Irak ekolü önderlerinden Kerhî ve öğrencisi Cessâs; Semerkant ekolü önderlerinden ise Mâtürîdî ile Alâüddîn Semerkandî'yi zikretmek mümkündür. Çalışmamızda ilk asırlardan itibaren tartışma konusu olan nesih konusunu söz konusu iki ekol arasında mukayeseli bir şekilde ele alınmıştır. İki ekolün bazı âlimlerinin eserlerinin günümüze ulaşmaması ve iki ekolün âlimlerinin düşüncelerinin bir teze sığdırılmasının zorluğu yapacağımız çalışmanın konusunun daraltılmasını gerektirmiştir. Kerhî ile Mâtürîdî'nin fıkıh usulüne dair eserlerinin günümüze ulaşmaması ve bu iki âlimin görüşlerinin büyük oranda kendilerinin çizgilerinde yol alan Cessâs ile Semerkandî'den bize nakledildiğinden, çalışmamız, Cessâs ile Semerkandî özelinde ele alınmıştır. Neshin mahiyeti, anlamı, şartları ve pratikte hangi hükümlerin nesh olup olmadığı tartışmaları ilk asırlardan beri güncelliğini korumaktadır. Genel olarak Cessâs'ın el- Fuṣûl fi'l-uṣûl eseri ile Semerkandî'nin Mîzânü'l-uṣûl fî netâʾici'l-ʿuḳūl eserinin esas alındığı bu çalışmada, her iki âlimin nesih konusundaki yaklaşımları, konu bağlamında teorik açıdan benzeşen ve ayrışan noktalar tespit edilemeye ve değerlendirilmeye çalışılmıştır."
