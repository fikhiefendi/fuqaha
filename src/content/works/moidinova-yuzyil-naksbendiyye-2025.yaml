abstract: "Bu çalışma Nakşbendiyye tarikatının Kâsâniyye kolu ve onun kurucusu Ahmed Kâsânî'nin hayatı, eserleri ve tarikatını konu edinmektedir. Araştırma, Mahdûm-i A'zam Ahmed Kâsânî'nin eserleri ve onunla ilgili kaleme alınan menâkıbnâmeler gibi birincil kaynakları esas alarak Kâsâniyye tarikatının oluşum süreci ve etkilerini ortaya koymayı hedeflemektedir. Çalışmada, mukayeseli metin inceleme yöntemi takip edilerek yazma eserler ve menâkıbnâmeler karşılaştırmalı olarak incelenmiştir. Bunun yanı sıra Ahmed Kâsânî'nin eserleri ve Kâsaniyye kolu ile ilgili Özbekistan'da, Türkiye'de ve İran'da yayımlanan makaleler, tezler ve kitaplar gibi ikincil kaynaklardan istifade edilmiştir. Bu materyallerden yararlanarak söz konusu kolun etkilerini ortaya koymayı amaçlamaktadır. Araştırmanın sonucunda, XVI. yüzyılda Ahmed Kâsânî Nakşbendiyye geleneğinin Orta Asya'ya yayılmasında etkili olmuştur. Özellikle kaleme aldığı eserleriyle Nakşbendiyye literatürüne önemli ölçüde katkı sağlamıştır. Sonraki asırlarda müridleri ve halifeleri Semerkant ve Buhara'nın yanı sıra Belh, Kaşgar, Yarkent, Aksu, Hindistan ve İstanbul'da Nakşbendiyye-Kâsâniyye kolunun yayılmasında öncülük etmişlerdir. Doğu Türkistan bölgesinde Müslüman azınlıkları destekleyerek İslam'ın yayılmasında katkıda bulunmuşlardır. Bu çalışma Ahmed Kâsânî ve Kâsâniyye koluna dair yapılan önceki araştırmalara kıyasla daha kapsamlı bir kaynak incelemesi ortaya koyarak tarikatın tarihsel sürecine dair değerlendirmeler yapmaktadır."
