abstract: "Bu çalışma, kaynaklarda hakkında yeterli bilgi bulunmayan ve hicrî VI. yüzyılda (XI-XII.) vefat ettiği düşünülen Hanefî mezhebi fakihi Ebû Muhammed Tâhir el-Cüllâbî'nin temizlik ve namaz konusuna dair telif ettiği Kitâbü's-salât adlı eser üzerinde yapılmıştır. Müellif eserinde ağırlıklı olarak Hanefî mezhebine müntesip fakihlerin görüşlerine itimat etmekle beraber zaman zaman sahabe, tâbiîn ve tebeu't-tâbiînin sözleri ve Malikî ile Şafiî mezhebi imamlarının görüşlerine değinmiştir. Kitâbü's-salât'ın adı birçok Hanefî mezhebi müellefatında geçmekte ve yaptıkları nakillerde onu kaynak gösteren müelliflerin sayısı yirmiyi aşmaktadır; dolayısıyla Kitâbü's-salât bir müracaat kaynağı konumundadır. Bununla beraber eser gerektiği gibi şöhret kazanmamıştır. Çalışmada, eser ve müellifi tanıtılmış; Kitâbü's-salât, Ebü'l-Leys es-Semerkandî'nin (ö. 373/983) Mukaddime fi's-salât isimli eseri ile mukayese edilmiştir. Daha sonra yazma nüshalarından dört nüshaya dayanılarak Kitâbü's-salât'ın bir bölümü tahkik edilmiştir. Anahtar Kelimler: Ebû Muhammed Tâhir, Cüllâbî, Kitâbü's-salât, Salâtü'l-Cüllâbî"
