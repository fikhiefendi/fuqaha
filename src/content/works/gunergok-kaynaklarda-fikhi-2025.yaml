abstract: "Bu çalışmada, hicrî ilk iki asır özelinde kaynaklarda fıkhî yönlerine dikkat çekilen Basralı muhaddisler tetkik konusu edilmiş ve öncelikle hadis rivâyetiyle ilgilenen 680 isme ulaşılmıştır. Söz konusu isimlerden metodumuz gereği 67'si tarafımızdan muhaddis kategorisinde değerlendirilmiş, bunlardan 27'si ise fıkıhla iştigal eden muhaddis olarak tespit edilmiştir. Fıkıhla iştigal ettiği belirtilen bu muhaddisler hakkında kullanılan“fakih”ifadesiyle geleneğimizdeki bilinen anlamıyla ekol oluşturmuş/mezhep sahibi“fakihler”değil, hadis naklinin yanı sıra aynı zamanda hadisleri anlama gayreti içinde olan, fetvâ veren hatta aralarında resmen kadılık görevi üstlenen“fakihler”kastedilmiştir. Bu durumun bir istisnası olarak sadece Osman el-Bettî usul ve yöntemiyle ekol sahibi bir fakih olarak görülebilir.“Hadisçiler eczacı, fakihler ise doktordur”şeklindeki ifade yanında ehl-i re'yin, muhaddislerin fıkıh bilmediğine yönelik iddiaları ve bazı muhaddislerin“Biz sadece râviyiz, fakih değiliz”tarzındaki söylemleri muhaddislerin hadislerin nakli ile yetinip fıkhı ile ilgilenmedikleri gibi bir algıya yol açabilir. Bu çalışmada -mezkûr anlayışın aksine- belli bir kesim muhaddisin hadis naklinin yanı sıra hadisin fıkhı ile de ilgilendikleri; hadislerden hareketle fetvâ verdikleri, fıkhî görüş beyan ettikleri ve hadisleri anlama gayreti bağlamında rivâyetleri belli başlı konularla ilişkilendirme faaliyetinde bulundukları (tasnîf), hicrî ilk iki asırda Basra'da yaşayan 27 muhaddis-fakih özelinde ortaya konulmuştur. Netice olarak muhaddislerin sadece nakilde bulunduğu, hadislerin fıkhını anlamaya yönelik gayretlerinin olmadığına dair iddilaların, ilgili dönemde yaşayan Basralı 27 muhaddis-fakih için geçerli olmadığı sonucuna ulaşılmıştır. Tez, bu yönüyle hicrî ilk iki asır özelinde fıkhî yönüne dikkat çekilen Basralı muhaddisler bağlamında hadis-fıkıh ilişkisi (fıkhü'l-hadîs) açısından bazı katkılar sunmayı hedeflemiştir."
