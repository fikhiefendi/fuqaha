abstract: "Müteahhir Dönem Hanefî ilim adamları arasında yer alan Molla Ali el-Kârî, İslamî ilimlerin birçok sahasında eser kaleme almıştır. Hadisçi ve Kelamcı kimliğiyle ön plana çıktığı için Türkiye'de de hakkında yapılan çalışmalar genelde bu minvalde olmuştur. Kendisinin kaleme aldığı ve Sadru'ş-Şerîa'ya ait olan en-Nukâye'nin şerhi olan Fethu Bâbi'l-İnâye adlı eseri, Hanefî fıkhının dayandığı delilleri de ele alması açısından oldukça önem arz etmektedir. O, bu kitabında hüküm istinbatında hadis kullanımın az olmasıyla eleştirilen Hanefîler'in istidlallerini bir nevi ortaya koymaya çalışmıştır. Hadisçi kimliğinin etkisi ve müteahhir dönemde olması hasebiyle eserinde kendisinden önceki Hanefî fakihlerinin hadisle olan istidlallerini de göz önüne almıştır. Mezheplerin hüküm istinbatında kullandığı hadisleri muharriclerine de dayandırarak vermiştir. Gerekli gördüğü yerlerde kendi görüşünü beyan etmekten ve çok az da olsa mezhep dışı bazı görüşleri benimsemekten de geri durmamıştır. Ayrıca o, eserinde hem mezhep içi hem de mezhepler arası ihtilaflara değinmiş ve karşı tarafın delillerini de değerlendirmiştir. Bu açıdan da bir mukayeseli hukuk kitabını andırmaktadır. Eser ne mutavvel kitaplar kadar uzun ne de muhtasar eserler kadar kısadır. Buna rağmen işlediği konu hakkında mutavvel kitaplarda yer alan tartışmalara da işaret etmeyi ihmal etmemiştir. Bu çalışmada Fethu Bâbi'l-İnâye temel alınarak Hanefîler'in ve Molla Ali el-Kârî'nin Hanefî fıkhına alanındaki açıklamaları ve hüküm tespitinde belirttiği deliller ve istidlaller değerlendirmeye tabi tutulacaktır. Öte yandan eserde diğer mezhep görüşlerinin delilleriyle birlikte verilmesi sebebiyle mukayese imkanı da söz konusudur. Ayrıca Ali el-Kârî'nin mezhep içi tercihini belirttiği kriterlere de değinilebilecektir."
