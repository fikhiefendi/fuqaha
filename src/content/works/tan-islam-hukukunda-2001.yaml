abstract: "ÖZET Tan, Oğuzhan, İslam Hukukunda Yorum Çeşitleri Ve Birden Fazla Doğru Yorumun Olabilirliği, Yüksek Lisans Tezi, Danışman: Prof. Dr. İbrahim Çalışkan, Ankara Üniversitesi Sosyal Bilimler Enstitüsü, 125s. Bu tez, İslam Hukukunda gerçekleştirilen yorum türlerini açıklamaya çalışmakta ve belli bir konuda birden fazla yorumun olması durumunda bunların hepsinin birden doğru olup olamayacağını tartışmaktadır. Tez, giriş ve sonuç dışında üç bölümden oluşmaktadır. Birinci bölümde,“nass”ve“yorum”kavramları üzerinde durularak, tezin sonraki bölümlerinde bu kavramlarla neler kastedileceği belirtilmiştir. Ayrıca İslam Hukukuna özgü olan yorum ile diğer İslamî disiplinlerde uygulanan yorumlar arasındaki mahiyet farklılığı açıklanmaya çalışılmıştır. İkinci bölüm, yorum türleri ile ilgilidir. Yorumu yapan kişi yada merciye göre yorum, dörde ayrılmıştır. Bu dört tür şunlardır: Teşriî yorum, idarî yorum, kazâî (yargısal) yorum, ilmî yorum. Yorumda esas alınan vasıtaya göre ise, lafzî yorum ve gayeci yorumdan bahsedilmiştir. Üçüncü bölümde, İslam hukukçularının bir hükme ulaşmak için ortaya koymuş oldukları yorumlar içerisinde birden fazla doğru yorumun olup olamayacağı incelenmiştir. Bu incelemede nassların katilliği meselesinden hareket edilmiştir. Yazarın bu konuda ulaştığı sonuç şudur: Her konuda doğru bir tanedir. Fakat zannî konularda yorumu hatalı olan kişi mazur karşılanmalıdır. Çünkü sadece çaba sarfetemek bile saygıya değer bir davaranıştır. Bu nedenle Hz. Muhammed, içtihad edip içtihadında isabet edene iki; isabet edemeyene ise bir sevap olduğunu bildirmiştir. Sonuç bölümünde ise yazar bu çalışması ile ulaştığı sonuçlardan bahsetmektedir."
