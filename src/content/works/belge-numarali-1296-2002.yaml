abstract: "TEZ ÖZETİ Bu tez çalışması Osmanlı Devleti Tarihi araştırmalarının bir devamı olarak hazırlanmıştır. Şehir tarihi alanındaki araştırmalara katkı sağlamak temennisi ile Osmanlı Devleti döneminin güzide şehirlerinden biri olan Tokat bu çalışmada tetkik edilmiştir. Zengin Osmanlı arşivlerinin en önemli malzemelerinden olan“şer'iyye sicilleri”temel kaynak olarak alınmıştır. Tez, Tokat tarihinin M. 1878-1884 tarihleri arasındaki bölümüne ışık tutmaktadır. Bu dönemler Osmanlı Devleti'nin pek çok iç ve dış mesele ile karşı karşıya geldiği bir döneme tekabül etmektedir. Aynı zamanda 19.yy Osmanlı yenilik hareketleri açısından da oldukça aktif bir dönemdir. Anadolu dışından yapılan göçler, 1877-78 Osmanlı- Rus savaşının etkileri, Tanzimat'tan sonra Osmanlı adli teşkilatında yapılan yenilikler yeni mahkemelerin açılması, Mecelle'nin ( medeni kanun) yürürlüğe girmesi, yeni askeri birliklerin oluşturulması gibi bu çalışmaya yansıyan bazı bilgiler Osmanlı Devleti'nin bu dönemdeki genel durumu hakkında bize bilgi vermektedir. Ayrıca, şehrin etnik yapısı, ahalinin eğitim durumu, meslekler ve meslek kolları, gayri menkul fiyatları, evlenme-boşanmaya dair esaslar, şehirde görev yapan memurlar bazı idari uygulamalar da bize hem şehir olarak Tokat'ı tanıtmakta hem de Osmanlı Devleti'nin iç bünyesi hakkında bazı genel fikirlere ulaşmamızı sağlamaktadır."
