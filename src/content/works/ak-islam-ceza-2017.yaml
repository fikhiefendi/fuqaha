abstract: "Tezin konusu İslâm ceza muhâkemesi usûlünde ispat vâsıtaları ve değişimdir. Amaç bilimsel ve teknolojik gelişmelerin sağladığı imkânların, çeşitli suçların ispatı için öngörülen ispat vâsıtalarında yapabileceği değişimi tespit etmeyi amaçlamaktadır. Bu tezde, İslâm hukukunun kabul ettiği,“zamanın değişmesiyle hükümlerin değişebileceği”ilkesinin, İslâm ceza muhâkemesindeki şâhitlik, yemin, ikrar, hâkimin şahsî bilgisinin ispat değeri ve karîne konularındaki boyutu incelenmeye çalışılmıştır. Bu çalışmada İslâm ceza muhâkemesi hukukunun ispata esas kabul ettiği vâsıtalar ile bu vâsıtaların günümüz ceza muhâkemesi hukukundaki durumu incelenmiştir. Bu inceleme ile iki hukuk sisteminin konuya yaklaşımları değerlendirilmeye çalışılmıştır. Böylece değişim imkânı değerlendirilmeye çalışılmıştır. İslâm ceza muhâkemesinin ispata esas aldığı vâsıtalar nasslarla belirlenmiştir. Dolayısıyla hadlerde, nasslar tarafından belirlenen suçlar, nasslar tarafından belirlenen ispat vâsıtalarıyla ispatlanarak, nasslar tarafından belirlenen cezalarla cezalandırılmalıdır. Hadler, nasslarla belirlenmemiş bir ispat vâsıtasıyla ispatlanmışsa, bu suç ta'zir grubuna dâhil edilerek cezalandırılmalıdır. Kısas konusuna gelince, aynı durum söz konusu olduğunda diyet ile hükmedilmelidir. Ta'zir gerektiren suçlarda hadler ve kısastaki sebepler söz konusu olmadığından, nasslarla belirlenmemiş ispat vâsıtalarıyla ispatlandığı hallerde gereğiyle hüküm verilmelidir."
