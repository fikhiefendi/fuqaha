abstract: "The study aims the financial and administrative corruption in the Islamic Shariah and comparing it with the Libyan law to face administrative and financial corruption. In order to achieve the objectives of the research, the descriptive approach was followed because of its importance and ability to accurately describe the subject of the study in addition to the inductive method, by extrapolating the material related to administrative and financial corruption in Libyan law, in addition to extrapolating the texts of the Kuran and the Prophet's Sunnah on combating administrative and financial corruption, and the analytical approach in order to analyze These texts of reading and hadith, and analysis of the text of Libyan law, and finally the comparative approach so that what is stated in those laws related to administrative and financial corruption with the provisions of Islamic law. The study concluded that financial corruption is a global phenomenon witnessed by most developed and developing countries alike. No society is exempt from this phenomenon, but it is more common in developing countries due to its characteristics that make it more susceptible to corruption. The problem is how governments deal with corruption and the seriousness of its intentions to prevent and combat it."
