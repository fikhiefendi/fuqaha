abstract: "1960'lı yıllarda ortaya çıkan ve dünyada“İslami Bankacılık”, Ülkemizde ise“Özel Finans Kurumları”olarak kurulduktan sonra 2006 yılında isim değişikliğine uğrayan Katılım Bankaları, son yıllarda bankacılık sektörünün önemli bir unsuru haline gelmişlerdir ve her geçen gün sektör içerisindeki payları artmaktadır. Bu çalışmanın amacı, Türkiye'deki katılım bankalarının kârlılığını etkileyen faktörlerin araştırılması ve bulguların değerlendirilerek öneriler sunulmasıdır. Bu amaç doğrultusunda, katılım bankacılığı alanında faaliyet gösteren bankaların kârlılık belirleyicileri 2008-2016 dönemi esas alınarak incelenmiştir. Literatüre uygun olarak belirlenen beş adet içsel (katılım bankaları ile ilgili) ve dört adet dışsal ( sektörel ve makroekonomik) faktörün, katılım bankalarının kârlılık göstergesi olarak değerlendirilen Aktif Kârlılığı Oranı (AKO) ve Özsermaye Kârlılığı Oranı (ÖKO) üzerindeki etkisi Eşbütünleşme ve Hata Düzeltme Modelleri ile test edilmiştir. Sonuçta literatür ile paralel olarak belirlenen faktörlerin, bankaların kârlılıkları üzerinde etkilerinin olduğu tespit edilmiştir."
