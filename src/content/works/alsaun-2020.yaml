abstract: "Bu araştırma, dünyadaki birçok ülkelerde yayılması ve insanların geniş kesimlerine doğrudan etkisi sebebiyle çağımızda bir önem kazandığı için“İslam Hukukuda Zorunlu Askerlik Hizmeti”konusunun hükümlerini içine almaktadır. Bu araştırma, parlamento, inkılap ve otorite, krallık gibi yönetim şekillerine bakarak,“zorunlu askerlik”mefhumunu beyan etmeyi, bu kavramın en önemli hedeflerini ve çağdaş ülkelerdeki suretlerini ele almayı, fıkhi hükümlerini incelemeyi hedeflemektedir. Mükellefin durumuna göre, kadınların, çocukların ve azınlıkların askerliği, gayr-i müslim devletlerde Müslümanların askerliği, farklı yönetim şekilleri ile yönetilen farklı devletlerde bedelli askerlik konusunun hükümlerini tanıtmayı amaç edinmiştir. Araştırmacı, araştırmanın hedeflerine ulaşmak gâyesiyle“Betimleme ve İceleme Metodu”nu kullanmıştır. Araştırma özetle şu sonuçlara varmıştır: Zorunlu askerlik konusunun hükmü, devletin yönetim şekli, mükellefin durumu, asker edinmeyle bağlantılı hallere göre farklılık arz etmektedir. Parlamento devletinde, eğer cumhurbaşkanı bu konuda bir fayda görüyorsa, zorunlu askerlik meşrudur. İnkılap ve otorite devletinde –cihadın farz-ı ayn olması durumu müstesna- meşru değildir. Kadınların zorunlu asker yapılması caiz değildir. Kadınlara has konular göz önünde bulundurularak, onların tabiatlarını uygun bir şekilde gönüllü olarak askerlik yapmaları caizdir. İslam devletinde, gayr-i müslim tebaanın zorunlu askerlik yapmaları caiz değildir. Bedelli askerliğe gelince, caiz olup olmamasına göre zorunlu askerliğin hükmünü alır. Zorunlu askerliğin inkâr edilemeyecek kadar çok faydaları vardır. Fitne halinde yahut zorunlu askerliğin caiz olmadığı durumlarda zorunlu askerlik kanununa hile yapmak caizdir."
