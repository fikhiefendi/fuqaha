abstract: "Bu çalışmada Osmanlı Devleti'nin son dönem alimlerinden Ömer Hilmi Efendi'nin (ö. 1889) hayatı ve ceza hukuku alanında yazmış olduğu Mi'yâr-ı Adâlet adlı eseri ele alınmaktadır. Müellif Tanzimat Dönemi'nde yapılan kanunlaştırma hareketlerinde bizzat görev almış, bu bağlamda Osmanlı Devleti'nde ilk anayasa diyebileceğimiz Kânûn-i Esâsî'nin hazırlanmasında ve İslam hukukunun kanunlaştırılması alanında en önemli eser olan Mecelle-i Ahkam-i Adliyye'nin yazımında bizatihi yer almıştır. Kendisi de yazdığı eserlerde kanunlaştırma usulünü takip etmiştir. Ceza hukukunun cinâyât, kısas ve diyet bölümlerini içeren Mi'yâr-ı Adâlet ismini verdiği bir kitap yazmıştır. Bu kitabı Mecelle'yi örnek alarak madde madde ve gayrı müdellel bir yöntem takip ederek telif etmiştir. Eserden istifadeyi artırmak için bu yöntemi takip etmiştir. İslâm ceza hukuku alanında telif edilmiş ilk müstakil eser olması ve kanunlaştırma üslubuyla yazılması sebebiyle önem arz etmektedir. Müellif maddeleri sıralarken Hanefi mezhebini merkeze alarak eseri telif etmiştir. Aynı zamanda davābıt diyebileceğimiz fıkhî kaideleri de zikreder ve bunl arı açıklar. Bütün bunlar dikkate alındığında eserin son dönem Osmanlı kanunlaştırma hareketlerinde ceza hukuku alanında yapılmış bir sivil girişim olma özelliği taşıdığı söylenebilir. Ayrıca burada belirtilmelidir ki eser üzerine iki çalışma yapılmış olup biri şerh diğeri ise maddelerin kaynaklarını ortaya koyan bir çalışmadır."
