abstract: "Fıkıh ilmi, bütün İslam ilimleri arasında yeri ve derecesi yüksek olup, bütün ilimleri içinde barındıran en önemli ve en kuvvetli direk ve temellerden biri olarak kabul edilir. öyleyse fıkıh, Cenâb-ı Hakk'ın Kitabı'nın, Resûlü'nün Sünnet'inin ve sahabe fakihlerinin sözlerinin anlamlarının açıklanmasında, anlaşılmasında ve insan kabiliyeti ölçüsünde Allah'ın muradına göre durulmasında önemli bir dayanaktır; İlim ve irfan sahibi âlimlerin fıkhı ele alması ve fıkhî meseleler ortaya koyması önemlidir. Çünkü fıkıh ilmi, ilimlerin hürmetinedir ve bunların en şereflisi şeref ve izzet meşalesidir. Ve Cenâb-ı Hak bana muvaffakiyet verdikten sonra, kütüphanelerin raflarında el yazması olduktan sonra metodolojiyi anlatan önemli dipnotlardan çok önemli bir dipnot olan bu değerli kitabı ortaya çıkarabildim. Çalışmanın ardından, elyazmalarının kazılmasının ve sayfalarındaki tozun beyaz ellerle temizlenmesinin önemi, bu emaneti en eksiksiz ve optimal şekilde iletme konusunda bu büyük sorumluluğu omuzlarında taşıyan araştırmacıların temsil ettiği azim ve akılla ortaya konulmuştur. Tefsir ilmi, biz Müslümanlar olarak en çok özen göstermemiz gereken ilimlerden biridir ve İslam kütüphanelerinin, İslam dünyamızdaki ileri âlimlerin kitaplarında yer almayan bilgilerini ön plana çıkarmaları gerekir ve bu mesaj iki bölüme ayrıldı: Birinci bölüm: inceleme bölümü: Bu bölüm iki bölüme ayrılmıştır ve birinci bölümde yazarların hayatı (matin ve tefsir), ikinci bölümde kitabın tanımı ve yazarın yaklaşımı ele alınmıştır. İkinci bölüm: kitap doğrulama bölümü: Kitabın nüshası ve doğrulaması, ekleme veya çıkarmanın iki versiyonu arasındaki farkların kanıtıdır."
