abstract: "Bu araştırmanın amacı, Hz. Peygamber'in“Çocuk yatağa aittir, zina eden ise kısıtlanır”hadisini, hem rivayet hem de fıkhî açıdan kapsamlı bir şekilde incelemektir. Söz konusu hadis, nesep ve aile hukuku konularında merkezî bir öneme sahiptir. Çalışmada, hadisin rivayet yolları ve farklı şekilleri ele alınmıştır; öncelikle Sahîhayn, ardından Sünen-i erbaa ve son olarak Musannefler ile Müsnedler incelenmiş, hadiste geçen kelimelerin analizi yapılmış, rivayetler arasındaki farklılıklar ve her bir rivayetin kendine özgü yönleri ortaya konmuştur. Ayrıca rivayet yolları sahâbe üzerinden sınıflandırılmış, hadisin derecesi ve muhaddislerin hadis hakkında söyledikleri, hadisin Sünnetteki yeri ve fıkıhçılar tarafından nesep meselelerinde nasıl değerlendirildiği gösterilmiştir. Fıkhî açıdan ise araştırma, nesebin sabitliği için dayanak teşkil eden kuralları ve fıkıhçılarca kabul edilen ispat yollarını (firâş, ikrâr, kıyâfet gibi) incelemiş, bunların çağdaş karşılığı olan DNA testi tartışılmış ve bu yöntemlerin nesep ispatı veya reddi açısından İslamî ölçülere uygunluğu değerlendirilmiştir. Ayrıca zina mahsulü çocukların hükmü, firaşın bulunmaması hâlinde çocuğun zina edenle ilişkilendirilmesi, boşanmanın nesep üzerindeki etkisi, iddetin asgari ve azami süresi ve buna bağlı fıkhî hükümler ele alınmıştır. Araştırma,“Çocuk yatağa aittir”hadisinin nesep konusunda önemli bir esas olduğu, buna bağlı olarak İslam hukukunda nesebin korunmasının genel bir ilke olarak belirlendiği ve nikahın soybağını tespitte yasal olarak temel bir ölçüt alındığı sonucuna varmıştır."
