abstract: "Bu çalışmada finansal kiralama sözleşmesinin mahiyeti, ortaya çıkışı, türleri, olumlu ve olumsuz yönleri ele alınmaktadır. Bu işlemin operasyonel süreçlerini içeren sözleşmelere ve fıkhi yapısına değinilmekte finansal kiralamanın uygulama şekilleri ve fukahanın söz konusu akitle ilgili ele aldığı konular karşılaştırmalı olarak açıklanmaktadır. Ayrıca çağdaş fukahanın, fıkıh komiteleri/akademilerinin ve danışma kurullarının bu yöntemlerle ilgili fıkhi görüşleri ortaya koyularak her bir uygulama şekline dair fıkhi değerlendirme yapılmıştır. Son olarak Türkiye'deki finansal kiralama sözleşmesinin mevzuatı fıkhi açıdan incelenerek problemli olan maddeler tespit edilmeye çalışılmıştır. Bu maddelerle ilgili kadim ve çağdaş fukahanın görüşleri, varsa danışma kurullarının ve fıkıh komitelerinin/akademilerinin görüşleri zikredilmektedir."
