abstract: "“Mâverdî ve İbnu'l-Cevzî'nin Tefsir Yaklaşımlarının Mukayesesi”adlı bu çalışmamızda en-Nuket ve'l-'Uyûn ile Zâdu'l-Mesîr eserleri örnekliğinde iki müfessirin tefsir yaklaşımlarını, tefsir yöntemi ve Kur'ân ilimleri açısından karşılaştırdık. Hicrî 4-6. asırlar arasında rivayet metodu ile yazılan tefsirlerin tarihsel süreci ve gelişimini yansıtma açısından önemi hâiz olan bu çalışma, aynı zamanda Hanbelî tefsir tarihine ışık tumakta ve söz konusu iki müfessir hakkında önceden yapılmış araştırmalarla elde edilen sonuçların tenkidini amaçlamaktadır. Bu çalışma giriş ve 2 bölümden oluşmaktadır. Giriş bölümünde müfessirlerin hayatlarını, şeyhlerini, öğrencilerini ve eserlerini anlattık; ayrıca içinde yaşadıkları zaman diliminin siyâsî, sosyal ve ekonomik yönlerini, eserlerindeki genel yöntemlerini ve yararlandıkları kaynakları mukayeseli bir şekilde açıkladık. Birinci bölümde rivayet ve dirayete dayalı tefsir yöntemleri açısından iki eseri karşılaştırdık. Bu bağlamda Kur'ân'ı Kur'ân, Sünnet ve selefin sözleri ile tefsir etmeleri, ayetlerin tefsirinde esbâb-ı nüzûl, kıraatler ve isrâîliyyâttan yararlamaları ile fıkıh ve akîde alanlarındaki görüşleri açısından onları karşılaştırdık. Ayrıca dil bilgisi konularında nasıl bir yöntem izlediklerine ve hangi şekillerde kendi görüşlerini belirttiklerinden söz ettik. İkinci bölümde ise Muhkem-Müteşâbih, Nesh, İ'câzu'l-Kur'ân, Mekkî-Medenî vs. gibi bazı Kur'ân ilimleri açısından iki tefsiri karşılaştırdık. Sonuç bölümünde de bu çalışmamızın sonunda ulaştığımız sonuçlara yer verdik."
