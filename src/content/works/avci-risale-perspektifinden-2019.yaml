abstract: "İktisadi ve sosyal sorunlara karşı, çok uç ve yerli yerinde çözümler sunmak; ancak doğru kaynakları, doğru kişileri, doğru zamanda kullanmak ile mümkündür. Az Gelişmişliğin nedenleri noktasında milyonlarca sebepler yazılabilir. Fakat en ehemmiyetli basamak, sebeplerin kökenini bulmaktır. İmam Bediüzzaman Said Nursi, İman esaslarının ispatı ve muhafazası ve bu esasların mantıki ve bilimsel olarak ispatı olan Risale-i Nur Külliyatı'nı yazmıştır. Bunlara ilaveten, sadece Ekonomik Az Gelişmişliğin kökenlerini; bireyler ve toplumlar için teşhis etmekle kalmamış; Kur'an-ı Kerim'den istifade ederek, bu sebeplere; mantıki olarak, sosyal, psikolojik ve ekonomik çözümler getirmiştir."
