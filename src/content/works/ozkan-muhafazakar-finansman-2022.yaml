abstract: "Ülkemizde modern anlamda menkul kıymetler borsasının kuruluşundan itibaren neredeyse kırk yıl geçmiş olmasına rağmen; menkul kıymetler piyasası hala sınırlı sayıda şirketin hisselerinin işlem gördüğü, gelişmekte olan bir piyasadır. Hisseleri piyasada işlem gören şirketlerse, genellikle, belirli aileler veya bu ailelerin ana hissedar olduğu şirket grupları tarafından kontrol edilmektedir. Bunun yanı sıra Türkiye ekonomisi 1980'lerden beri periyodik krizler ve ardından gelen toparlanma dönemlerinden oluşan sürekli bir döngü içerisindedir. Son onbeş yıllık dönemde hisseleri kesintisiz olarak Borsa İstanbul'da işlem görmekte olan şirketlerin finansman tercihlerine yönelik analizler, bu şirketlerin genel olarak borç kullanmaya gönülsüz olduklarını ve önemli bir bölümünün de muhafazakar bir finansman politikası takip etme eğiliminde olduklarını göstermektedir. Bununla birlikte; Türk şirketlerinin finansman tercihlerine yönelik araştırmalar genel olarak sermaye yapısı tercihleri ve bunun bileşenlerine odaklandığından, önceki çalışmalarda bu eğilimin gözden kaçırıldığı görülmektedir. Bu eğilime ve nedenlerine odaklanan bu çalışma, ülkemizdeki geleneksel sermaye yapısı tartışmalarına yeni bir boyut getirmektedir. Diğer taraftan; muhafazakar finansman politikasına yönelik çalışmalar da genellikle gelişmiş ülkelerde, özellikle de Birleşik Krallık ve Amerika'da faaliyet gösteren şirketler üzerine yoğunlaşmaktadır. Bu durum dikkate alındığında; sürekli ekonomik krizler yaşayan, gelişmekte olan bir ülkeden bulgular ortaya koyması nedeniyle çalışmanın muhafazakar finansman politikasıyla ilgili tartışmalara da katkı sağlaması beklenmektedir. Zira ulaşılan sonuçlar önceki çalışmaların, özellikle de gelişmekte olan ülkelerde yapılanların bulgularıyla büyük ölçüde paralellik göstermekle birlikte, farklı ve dikkat çekici bulgular da ortaya koymaktadır."
