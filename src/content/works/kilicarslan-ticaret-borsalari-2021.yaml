abstract: "Bu çalışmada, ticaret borsalarında risk faktörleri ele alınarak risklerin minimize edilmesinde kullanılabilecek enstrümanlar, konvansiyonel ve İslâmi ticaret borsaları açısından karşılaştırmalı olarak ortaya konulmaktadır. Gelişmiş ülke ticaret borsaları ve borsacılık sistemleri incelenerek Türkiye'deki ticaret borsaları ile karşılaştırılmış, Türkiye'deki ticaret borsalarının risk algısı, risk yönetimi ve kullandıkları araçlar konularındaki farkındalıkları anket çalışması yöntemiyle tespit edilmiş ve elde edilen değerlendirmeler ışığında uygulanabilir bir model önerisi ortaya konulmuştur. Bu amaç ve yöntemlerle tez dört bölümde ele alınmaktadır. Birinci bölüm, ticaret borsaları bağlamında emtia borsaları ve gelişimi üzerinedir. Bu bölümde ticaret borsalarının yapısı, gelişimi ve fonksiyonları incelenerek genel özellikleri ile ortaya konulmaktadır. Ayrıca hububat (buğday) alanında ihtisaslaşmış olan Konya Ticaret Borsası ve CBOT; yapısal farklılıkları, borsacılık işlemleri ve kullanılan enstrümanlar bağlamında karşılaştırılmaktadır. Tezin ikinci bölümünde İslâm prensip ve ilkeleri bağlamında İslâmi bir ticaret borsasının yapısı ve konvansiyonel ticaret borsası ile benzerlik ve farklılıkları ele alınmaktadır. Üçüncü bölüm, risk yönetimi bağlamında konvansiyonel ve İslâmi ticaret borsalarında risk faktörleri, risk stratejileri ve enstrümanlar üzerinedir. Tezin dördüncü bölümünde, Türkiye'deki ticaret borsalarının risk farkındalığı çerçevesinde, risk algılamaları, risk stratejileri ve kullandıkları enstrümanlar, anket çalışması ile tespit edilmiş ve riski minimize etmede kullanılabilecek enstrümanlar, model çerçevesinde ortaya konulmuştur."
