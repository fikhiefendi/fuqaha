abstract: "Bu çalışma, XVI. asırdan günümüze kadar geçen sürede Maveraünnehir'in hâkimiyetini Özbekler üstlendiğinden dolayı bugünün bölgesel olaylarının veya problemlerinin teşhis ve çözümü için XVI. asır Şeybânîler sürecinin siyasi, askeri, idari ve iktisadi olarak sağlıklı tahlil edilmesi gerektiğini iddia etmekte ve bu maksatla bu asrı gün yüzüne çıkarmaktadır. Adını, Özbekler'in atası Cengiz Han'ın büyük oğlu Cuci'nin Şeybân ismindeki oğlundan alan Şeybânî Hanlığı, Maveraünnehir, Hârizm ve Fergana bölgelerinde hâkimiyet süren bölgesel bir hanlıktır. Timurlular sonrasında bölgenin idarecileri olan Şeybaniler, Moğol yasası ile İslam şeriatini birleştirerek bir parmakta iki yüzük şeklinde de tabir edebileceğimiz iki sistemli bir anlayış geliştirmişlerdir. Bu anlayış gereğince hâkimiyette ortaklık (veraset sistemi) ve iktidarın paylaşılması (ülüş sistemi), Ebu'l-Hayr hanedanından yaşça en büyüğünün (ekberiyet sistemi)“eşitler arasında birinci”vasfıyla han olarak seçilmesi, kurultay gibi Cengizli meşruiyet, hâkimiyet, hukuk anlayışı ve sembollerini bölgede yeniden canlandırmışlardır. Şeybanilerin bu idari yapısı, Safevî bürokratik devlet sistemi ve Timurlu adem-i merkeziyetçi anlayışı karşısında özellikle Abdullah Han döneminde dönüşüme uğrasa da merkezi yapıyı arzu etmeyen hanedan üyelerinin ve emirlerin etkisiyle asır boyunca sürdürülmüştür. Şeybani hanları mezkûr asır boyunca bir taraftan hanedan içi taht mücadeleleri ile uğraşmışlar diğer taraftan ise Safevîler, Kazaklar ve Bâbürlülere karşı sürekli savaş halinde olmuşlardır. Ancak bu mücadele Şeybanileri siyasi ve idari olarak geriletmiştir. Bu gerilemeyi, iktisadi olarak, doğu-batı istikametinde Maveraünnehir şehirlerinden seyreden kara ticaret yollarının eski önemini yitirip coğrafi keşiflerin de etkisiyle okyanus ticaretinin ve kuzey-güney yönündeki şehirlerin ön plana çıkması ile bölgedeki ırmaklarının mecralarını değiştirmesi hızlandırmıştır. Bütün bunlar Şeybani Hanlığı'nın bütün haşmetine rağmen tarih sahnesinden çekilmesini beraberinde getirmiştir. Anahtar Kelimeler Özbek, Şeybânîler, Maveraünnehir, Safeviler, töre, şeriat, veraset sistemi, ekberiyet."
