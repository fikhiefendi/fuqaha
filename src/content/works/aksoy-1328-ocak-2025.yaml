abstract: "“H. 29-12-1328/M. 1 Ocak 1911 Tarihli 228/31 Numaralı Şer'iyye Sicil Defterine Göre Burdur'un İdari, Sosyal ve Ekonomik Yapısı ”başlığında ele alınan defter incelemeye alınmıştır. Burdur'un idari yapısı, ekonomik uğraşları, vakıfları, gayrimüslim unsurları gibi konular, defterdeki dava numaraları ile esas alınarak açıklanmaya çalışılmıştır. İlk bölüm Giriş kısmında çalışmamızın konusu ve yöntemi açıklanarak, genel bir değerlendirme yapılmıştır. Burdur'un Tarihçesi ele alınmış ve Osmanlı idaresine kadar geçirmiş olduğu siyasi değişiklikler anlatılmış, Burdur'daki Ermeniler ve Rumlar konusu ele alınmıştır. İkinci bölümde 228/31 Numaralı Burdur Şer'iyye Sicil Defterinin Transkribesine yer verilmiştir. Üçüncü bölümde ise, 228/31 Numaralı Burdur Şer'iyye Sicil Defterindeki olayların konularına göre özet tasnifi ve değerlendirmesi ile 228/31 Numaralı Şer'iyye Siciline göre yer tespitleri yapılmıştır."
