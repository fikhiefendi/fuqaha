abstract: "Alemlerin Rabbi olan Allah'a hamt ve sena ederiz. Bütün övgüler O'nadır. Alemlere rahmet olarak gönderilen Resulüne de salat ve selam olsun. Çocukluk, insanların yaşadığı en önemli ve uzun yaç aralığıdır. Bu dönemde insan belli bir gelişim sistemi içinden geçerken diğer taraftan belli oranda bir bilinç ve akıl yetisine sahip olmaya başlar. Çünkü insan, bilinç olarak farklı bir yöne sahiptir. Irakta eğitim, değişik mecralarda, çoğu da devlet eliyle olmak üzere yürütülmektedir. Bu anlamda eğitim materyali olarak kitaplar ve resmi olarak izin verilmiş diğer eğitim öğretim elemanları kullanılmaktadır. Bu materyallerin çocuklar üzerinde farklı etkileri vardır. Bunlardan biri de hiç şüphesiz ırak'ta çıkarılan çocuk dergileridir. Bu dergiler, hem eğitim, hem bilim hem de kültür ve edebiyat noktasında ciddi bir katkı sunmaktalar. Bunların içinde bir kısmı çocuklara bilimi sevdirirken bir kısmı da edebi ve ahlaki manada bir işlevi yerine getirir. Eğlenceli tarih dergisi diyebeileceğimiz dergiler de bazen sahnede yerini alırken diğer taraftan çalışmaıza konu olan 'Mecelletî' gibi dergiler Irak çocuk edebiyatına yaptğı katkılarla öne çıkmaktadır. Eğitimin çocuklar üzerinde bırakabileceği pozitif etkiye ciddi katkılarda bulunan Mecelleti dergisi, uzun soluklu yayıncılık hayatıyla edebi manada önemli bir yere sahiptir. Mecelleti dergisi, içerik olarak hem ahalakî hem de bilimsel bir kaygı taşımaktaydı. İçerikteki hikayeler, ele alınan konular, hem ahalkî yapıya iyi bir etki bırakırken diğer taraftan edebi bir etki de bırakmaktaydı. Bu etki sadece insanlar arasında bahsedilen bir konu olmaktan öte hem diğer dergilere hem de genel manada çocuk edebiyatına etki edecek bir yöne sahipti."
