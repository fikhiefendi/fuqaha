abstract: "n ÖZET Özel hayatın gizliliğinin korunması, kişinin özgürlüklerine ve ilişkilerine saygı gösterilmesini, özel eşyaları ile ilgüeniîmemesini, konutuna girilmemesini, özel haberleşmesinin gizliliğine dokunulmamasım ve birey açısından mahrem olan durumları ifade eder. İslam Hukuku, özel hayatin gizliliğinin korunmasını bir hak olarak kabul eder. Medeni Hukukta, özel hayatin gizliliği ve korunması“Kişinin Hak ve Ödevleri”adı aranda temel bir başlık olarak düzenlenmiştir. Özel hayatin gizliliğinin korunması hakkı, kanun koyucu tarafından verilmiş bir haktir. Temel bir insan hakkı olarak kabul edilen bu hak, kişiye bağlı, dokunulmaz, devredilmez ve vazgeçilmez bir haktir. Bu hakkın ciddiye alınmadığı durumlarda görev, boyutu karşımıza çıkar. Yargı, bu görevi yerine getirmek için taraflara müeyyideler uygulayabilir. Özel hayatin gizliliğinin korunması hakkı, ömür boyu süren bir haktır. Hatta kişinin ölümünden sonra da devam eder."
