abstract: "Mezhepte esas kabul edilen kanaate göre akitten doğan teslim-tesellüm; alacak ve mülk talebi gibi hak ve hükümler birbirine zıt olgulardır, dolayısıyla mezhep asıllarına bağlı olarak bir kişinin tek bir zaman diliminde bu zıt sorumlulukları ve akdin hukukunu üstlenmesi ve de taraflar adına ilgili hakları ifa ve tahsil etmesi mümkün olmaz. Bu gerekçelere bağlı olarak Hanefiler, Şafiiler, bir rivayete göre İmam Malik ve mezhepte zahir olan görüşe göre İmam Ahmet bin Hanbel; vekilin, kendi malını müvekkile satmasının ve/veya müvekkilin malını kendisinin satın almasının caiz olmadığını söylemiştir. İmam Evzai; vekilin, töhmet oluşmasına dair bir çekincenin olmadığı durumda ve/veya mal sahibinin yani müvekkilin bilgisi dahilinde ilgili malı kendisine satabileceğini söylemiş, İmam Leys bin Sa'd ise vekilin, kendi malını aldığı fiyattan daha ucuza satmasının ya da müvekkilin malını piyasa fiyatından daha pahalıya satın almasının caiz olacağına hükmetmiştir. Bu noktada İslam fıkhında bazı durumlarda akitlerin hakikat muhtevasından yüz çevrilmesi, ilgili içtihatların fıkhi arka planının anlaşılması açısından önem teşkil eder. Şöyle ki kimi bazı hükümlerde ilgili hususun kıyas yönü olası bir tasarrufu geçersiz kılarken çeşitli illetler gerekçe gösterilerek cevaza gidilmiştir. Babanın çocuğu adına kendisi ile yaptığı alım-satım buna örnektir. Yine aynı bağlamda kıyastan yüz çevrilen ve istihsanın gereği olarak tercih edilen bazı meseleler de bizim için ufuk açıcı niteliktedir. Bu hususlar göz önüne alındığında araştırma konumuz kapsamında gerçekleştirilecek yeni içtihatlar için şu esaslara mutlak koşulda bağlı kalınması gerektiği düşünülmektedir: Akitte çoklu temsil yetkisi ile gerçekleşen tasarrufların tahrice dayalı bir hükümle onanması için akdi inşa eden birden fazla tarafın asaleten veya vekaleten temsiliyeti netlik kazanmalı, akitten doğan hakların sübut ve ifasındaki töhmet ortadan kaldırılmalı ve tarafların tazmin sorumluluğunu üstlendiği fiilen teyit edilmelidir."
