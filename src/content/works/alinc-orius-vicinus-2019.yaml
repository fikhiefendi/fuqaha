abstract: "Bu çalışmada Adana ili Balcalı yöresinde Kasım 2017-Nisan 2018 döneminde Orius vicinus (Ribaut) (Hemiptera: Anthocoridae)'un kışlama biyolojisi araştırılmıştır. Avcı böceğin yumurta açılma süreleri, nimf gelişme süreleri ve ergin dişilerin preovipozisyon, ovipozisyon ve postovipozisyon süreleriyle bıraktıkları yumurta sayıları ve ayrıca ergin ömür süreleri her ayın ilk haftasında kurulan denemelerle belirlenmiştir. Denemeler Çukurova Üniversitesi Ziraat Fakültesi Bitki Koruma Bölümü'nde doğa koşullarında yürütülmüştür. Orius vicinus yumurtalarının açılma süreleri, tüm aylar için yaklaşık 5 ile 10 gün arasında sürmüştür. Kışın karşılaşılan düşük sıcaklık ve kısa gün koşullarında bile yumurtaların açıldıkları görülmüştür. Denemeye alınan nimflerin yarısından fazlasının sert geçen kış aylarında bile ergin olabildikleri belirlenmiştir. Nimflerin ani sıcaklık değişimlerinden etkilendikleri fakat düşük sıcaklık ve kısa gün koşullarına da toleranslı oldukları gözlenmiştir. Nimf gelişme sürelerinin ise sıcaklıkların düşmesiyle birlikte uzadığı belirlenmiştir. Tüm denemelerdeki dişi bireylerin en soğuk dönemlerde bile (ortalama 15 °C'nin altı) yaklaşık bir ay boyunca yumurta bıraktıkları saptanmıştır. Dişi bireylerin değişken çevre koşullarından fazla etkilenmediği ve üreme diyapozu göstermedikleri tespit edilmiştir. Aralık ve ocak ayındaki bireylerin erken bahara (mart ayı) ulaşamadıkları görülürken, bunun yanında şubat ayından gelen ergin bireylerin bu dönemde de yaşamlarını sürdürdükleri belirlenmiştir."
