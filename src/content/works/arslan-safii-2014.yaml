abstract: "Tezimiz Giriş, üç ana bölüm, sonuç ve ekten oluşmaktadır. Giriş bölümü konu ile ilgili teknik bilgileri içermektedir. Birinci bölüm; İmam Şâfiî'nin vefatından sonra yıllarca onun ders halkasını yöneten, gerek eğitim ve öğretim, gerekse telif faaliyetleriyle Şafiî hukuk düşüncesinin geniş alanlara yayılmasında önemli katkıları bulunan el-Büveytî'nin yaşadığı Abbasilerin ilk döneminin, siyasi, ekonomik, sosyal ve ilmi durumu ile el-Büveytî'nin hayatı ve yetiştiği ilmi çevreyi içermektedir.İkinci bölüm, fıkıh mezheblerinin ve Şâfiî fıkıh mezhebinin oluşum süreci ile el-Büveyti'nin bazı Usûlî görüşleri ve Şâfiî mezhebinin sistemleştirilmesindeki rolünü içermektedir.Üçüncü ve son bölüm, türünün ilk örneklerinden olan Büveyti'nin el-Muhtasar'ının (Kitabu Muhtasari'l-Büveytî) tanıtım ve değerlendirmesini, Ekler bölümü ise, el-Muhtasar'ın bilinen tüm el yazma nüshalarının (4 adet) örnek sayfalarını içermektedir."
