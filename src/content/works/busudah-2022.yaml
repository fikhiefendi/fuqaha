abstract: "Muhkem ayetler, fıkhî hükümlerle bağlantılı olması, üzerine esas ve kaidelerin inşa edilmiş olması, anlam ve çağrışımlar içeriyor olması, tefsir edilirken kullanılan yöntem ve mekanizmaları, kastının anlaşılması ve kendisinden hüküm çıkarılması bakımından özel bir önem arz etmektedir. Alimlerden bazıları, içerisinde ayetlerin anlam ve hükümlerini, mezheplerin görüşlerini, değerlendirme, çıkarım yapma ve delil getirme kurallarını barındıran, muhkem ayetler özelinde tefsirler ortaya koymuşlardır. Öyle ki bu seçkin eserler, yöntem ve genel özellikleri açısından İslam mirasında alışılagelmiş ve bilindik olan tefsirlerden ayrışır hale gelmiştir. Muhkem ayet tefsircileri ve müellifleri, hükümlerin tertibinde fıkıh usulüne uyanlar, Kur'an-ı Kerim'deki sırasına göre düzenleyenler ve bazı ayet ve hükümleri bir risaleye ya da esere atfedenler olarak farklılık gösterirler. Hicri 11.asra tarihlenen ve döneminin kimi alimleri ile bazı ayetlerin tefsirleri hakkında görüş ayrılığı yaşaması sonrasında abdest ve teyemmüm ayetleriyle ilgili bir risale kaleme alan ve asrının kadılarından birine yönelten İbrahim el-Me'muni'ye ait olan elimizdeki çalışma, bu son bölüme aittir. Çalışma, bilgi ve ilim bakımından zengin olmasına ve de mesele, kural, usul ve görüşler içermesiyle birlikte bazı ilke ve meselelerin açıklığa kavuşturulması, sözlerin araştırılması ve yazarlara isnat edilmesi, tercümeleri, tanımlanmaları, karışıklık ve anlama zorluğunun ortadan kaldırılması adına metinlerin harekelenmesi, telaffuz ve anlamdaki kapalılığın açıklığa kavuşturulması için daha fazla çaba gerektirmiştir. Ayrıca hiçbir değişiklik ve müdahale olmaksızın metin, yazarının belirttiği şekilde tahkik edilmiş, ona ihtiyaç duyduğu her şey sunulmuş, onun anlamının açıklığa kavuşturulmasına özen gösterilmiştir. Araştırmacı, fıkhi tefsirin tarifi ve konularına ek olarak İbrahim el Me'muni'nin hayatını, doğumunu, yetişmesini, sıfatlarını, durumunu, hocalarını, öğrencilerini, ilmini, eserlerini, tefsirdeki yöntemlerini, kurallarını ve kaynaklarını ortaya koyan bir çalışma ile işe başlamıştır. Ardından, okuyucuyu metinde geçen ayet, hadis, şahsiyet, şiir ve diğer içeriklere yönlendiren fihristler ile çalışmayı sonlandırmıştır."
