abstract: "Fıkhî ihtilafların ortaya çıkmasında birçok etken vardır. Bu etkenlerin belki de en önemli payını hadis kaynaklı ihtilaflar oluşturmaktadır. Bu ihtilaflar ilk başta olumsuz gibi gözükse de fıkhın gelişmesine uygun ortam hazırlamasının yanısıra İslâm hukuk edebiyatının zenginleşmesi ve gelişmesinde büyük bir rol oynamıştır. Bu farklı düşünce ve görüşlerin incelenmesi; İslâm hukukçularının tartışmalarının rastgele olmadığını aksine bir arka planı olduğunu ve fakihlerin fıkhî problemlerde hüküm verirken bir yöntem ve metoda dayandığını ortaya çıkarmak, ayrıca fıkhî konularda meleke elde etmek açısından son derece önem arz etmektedir. Bu hedeflerle hazırladığımız araştırmamızda iki büyük mezhebin kurucu önderi olan İmam Ebû Hanîfe ile İmam Şâfiî'nin arasında ortaya çıkan ihtilafları aile hukuku (münâkehât bahsi) özelinde inceledik. İhtilafların tespiti hususunda İbn Hacer el-Askalânî'nin Buluğu'l Merâm min Edilleti'l Ahkâm adlı eserini esas alarak ihtilafa sebep olan hadisleri tespit ettik. Akabinde hadisleri konularına göre ayırdık. Daha sonra tespit edilen hadislerin kütüb-i tis'a özelinde tahriclerini yaptık. Ardından ihtilafa neden olan saikleri ve tarafların delillerini Hanefî ve Şâfiî mezhebi fıkıh külliyatlarından faydalanarak ortaya çıkardık. Çalışmamız sonucunda taraflar arasında doğan ihtilaflarda özellikle hadis tercih kriterlerinin ve nasslara yaklaşımlarındaki metod farklılıklarının etkili olduğu sonucuna vardık. Bununla beraber dönemin şartlarının, ihtiyat ilkesinin, lafızlara yüklenen çeşitli anlamların da bu ihtilaflara sebep olduğunu gözlemledik. Araştırmamız; giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Çalışmamızın giriş bölümünde araştırmanın konusu, kapsamı, kaynakları, metodu ve amacından bahsettik. Birinci bölümde zikredilen mezheplerin kurucu imamlarının hayatlarını, eserlerini, ictihad metotlarını, haber-i vâhid ile amel etme metotlarını ve fıkıh ilmindeki yerlerini konu edindik. İkinci bölümde iki kurucu imamın nikâh bahsi özelinde ihtilaflarını ve tarafların konu hakkındaki delillerini inceledik. Sonuç kısmında ise gözlemlenen ihtilaflara dair değerlendirmeleri ve ulaştığımız bulguları serdettik."
