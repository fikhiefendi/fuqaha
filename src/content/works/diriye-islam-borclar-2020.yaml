abstract: "Hibe akdi, bir malın bedelsiz olarak karşı tarafın mülkiyetine geçirilmesini ifade eder. Bu araştırmada, hibe konusundaki fıkhî görüşler Somali Medeni Kanunu ile mukayeseli olarak çalışılacaktır. Hibe konusunda mezheplerin görüşleri incelenecek, ittifakları, ihtilafları ve Somali medeni kanunu ile mukayesesi üzerinde durulacaktır. Bu çerçevede, İslam Hukuku mezheplerine ait temel kaynaklardaki görüşlere müracaat edilecektir. Söz konusu eserlerde konunun kapsamlı olarak ele alınması sebebiyle araştırmanın çerçevesi hibenin tanımı, rükünleri, şartları ve hibeden rücu ve ivazlı hibe ile sınırlı tutulacaktır. Çalışmamız bir giriş, iki ana başlık ve sonuçtan oluşmaktadır. İlk bölümde hibenin tanımı, nitelikleri, hükümleri, çeşitleri, rükünleri ve şartları ele alınacaktır. İkinci bölümde ise hibenin sona ermesi, hibeden rücu ve rücu engelleri konularına temas edilecektir. Hibeye dair fıkhi hükümler, Somali Medeni Kanunuyla mukayeseli olarak inceleneceği için, Somali'de yaygın mezhep olan Şafii mezhebi hükümleri üzerinde özellikle durulacaktır. Ayrıca araştırmamızın giriş kısmında Somali'nin tarihi, hukuku ve medeni kanunundan kısaca bahsedilecektir."
