abstract: "Bu çalışmanın hazırlanmasındaki ana gaye, kapitalizmin ortaya çıktığı ilk günden günümüze kadar geçirdiği tüm süreci ayrıntılı bir şekilde analiz edip, iki temel ayağı olan kar ve başarı için herkesi ve her şeyi araçsallaştırarak insanları nasıl tahrip ettiğini ortaya koymanın yanında, onun yerine insanların kar ve para için araçsallaştırılmadığı, insan olma hasebiyle değer gördüğü ve ona uygun bir hayatın kendisine sunulduğu alternatif bir ekonomik model olan İslam ekonomisini, insanlığın hizmetine sunmaktır. Kapitalist ekonomik model, sanayi devrimiyle birlikte üretim sürecini daha da güçlendirerek, ekonomik açıdan küresel düzeyde ciddi bir güç elde etmenin yanında, insanlar arasında ciddi gelir eşitsizlikleri, insanların değersizleştirilmesi, ahlaki çöküş ve doğanın tahrip edilmesi gibi önemli sorunları da beraberinde getirmiştir. Bu sorunlar ise insanları bir çıkmaza sürüklemiştir. İşte İslam ekonomisi, bu çıkmaz sanılan sokağın, bir çıkışıdır. Kapitalist paradigma, teorik ve pratik uygulamaları ile insanlığı maddenin esiri haline getirmiştir. İnsanı insan yapan tüm değerleri ise darmadağın etmiştir. İnsan, düşünemeyen ya da sorgulayamayan sadece kapitalist modelin çarkını döndürmek için yaşayan basit bir canlıya dönüştürülmüştür. Bu tez, insanların içerisini düştüğü bu esaretin farkına varıp, bir sorgulama yapmasını da hedeflemektedir. Bu tez, dört bölümden oluşmaktadır. Birinci bölümden kapitalist sistemin tarihsel gelişiminden bahsedilmiştir. İkinci bölümde kapitalizmin sebep olduğu krizlere ve bu paradigmaya yapılan eleştirilere değinilmiştir. Üçüncü bölümde İslam ekonomisi teorisi ayrıntılı bir şekilde incelenmiştir. Dördüncü ve son bölümde ise İslam ekonomisi ve kapitalizme alternatif model olanakları analiz edilmiştir. Çalışma, nitel araştırma yöntemi, sayısal veri ve grafikler ile hazırlanmıştır. Çalışmanın asıl yöntemi, sosyolojik yaklaşım, tarihsel analiz, karşılaştırmalı iktisadi yöntem ve eleştirel bir bakış ile tasarlanmıştır. Kapitalizmin tarihsel aşamaları ve dönüşümleri değerlendirilip, bu dönüşümler eksenin de kapitalizmin temel dayanakları ve ferdiyetçilik, kar maksimizasyonu, serbest piyasa gibi ideolojik dayanaklarının ortaya çıkardığı zararlar ayrıntılı bir şekilde incelenmiştir. İslam'ın ekonomik öğretisinin genel çerçevesi, Kur'an, Sünnet, İslam hukuku ve İslam alimlerinin ortaya koyduğu fikirler baz alınarak oluşturulmuştur. Tez'in veri toplama yönteminde, genellikle literatür taramasına başvurulmuştur. Bu çerçevede genel iktisat literatürü, modern ekonomik yaklaşımlar, Kapitalizmin ve İslam ekonomisinin konu edinildiği kitaplar, akademik çalışmalar, tezler ve güncel makaleler ayrıntılı bir şekilde incelenmiştir. Uygulanan yöntemsel çerçevenin ana hedefi, kapitalizmin tarihsel süreci ve ortaya çıkardığı sorunları tespit etmenin yanında tüm bu sorunların çözümü olarak alternatif bir ekonomik model olan İslam ekonomisini başka iktisat camiası olmak üzere insanlığın hizmetine sunmaktır. Sonuç olarak; ortaya konulan tüm bilgiler, İslam ekonomisinin hayatın tamamını kuşatan prensipleriyle kapitalist sistemin alternatifi olduğunu göstermektedir."
