abstract: "Bu araştırma İslam Hukuku ve Irak Hukukunun suçu önleme yolları konusunda belirledikleri yaklaşımları karşılaştırmalı olarak ele almakta ve bu konuda iki hukuk sistemi arasındaki benzerlik ve farklılıkları tespit etmeyi hedeflemektedir. Suç olgusu, bireysel ve toplumsal bazda olumsuz sonuçları bakımından toplumu tehdit eden en tehlikeli sosyolojik olgulardan biri olarak kabul edilmektedir. Bu sebeple araştırmamızda İslam Hukukunda ve Irak Hukukunda suçun tanımını, çeşitlerini, suçun yayılmasının sebeplerini ve suçtan korunma yollarını ele alacağız. Araştırmamız suçtan korumanın, suçu önlemenin yollarını ele incelemektedir. Suçu önlemek üzere bütün tedbirler ve her türlü koruyucu önlemler alınmalıdır. Bu kapsamda bireylerin eğitimden geçmesi, toplumun korumak üzere suçun ortaya çıkmasına ve gelişmesine engel olmakla yükümlü olan resmi ve gayrı resmi kuruluşların irşad faaliyetlerini yürütmesi geremektedir. Bunun için suçun tehlikeleri ve suçun bireysel ve toplumsal istikrar açısından olumsuz yansımaları konusunda ortak bir bilinç oluşturulmalıdır. Araştırmamız Irak'ta suçu önlemenin geleneksel ve modern yöntemlerini incelemektedir. Bu çerçevede suçu ortadan kaldırmak ve suçtan korunmak üzere fakirlik ve işsizlik sorununu ortadan kaldırmanın, basın yayın organlarıyla işbirliği yapmanın zorunlu olduğu tespit edilmiştir. Aynı şekilde çevresel düzenleme önlemlerinin alınması, çevresel faktörlerin suçu önleyecek, suçlunun cesaretini kıracak, suç fırsatlarını ortadan kaldıracak, suç kurbanlarının korunmasını sağlayacak ve toplumsal sorunları sınırlayarak en aza indirgeyecek şekilde düzenlenmesi de zorunluluk arz etmektedir. Araştırma boyunca İslam Hukuku ve Irak Hukukunda suçu önlemek üzere ulaşılması zorunlu olan hedefeleri gerçekleştirmek üzere suçun türlerini, suçtan korunma yollarını ele alacak ve araştırmayı ulaşılan sonuç ve tavsiyelerle tamamlayacağız."
