abstract: "Mekke'de nazil olan ilk sûrelerden olan Fecr Sûresi'nin, ayet sayısı otuz olup, ismini de ilk ayetinde geçen“Fecr”kelimesinden almaktadır. Sûre, eski kavimlere ait kıssalardan misallerle, insanoğlunun kötülüğe yönelmesinden, bunun vahim sonuçlarından, ahiret hayatından ve oradaki durumlar hakkında bilgiler içermektedir. Sûrede Kur'an'ı Kerim'in kendine has, mucizevî üslûpları benzersiz bir şekilde sergilenmektedir. Geçmiş kavimlerin müreffeh yaşantılarından, Rablerine isyan neticesinde üzerlerine azap indirilenlerin hallerinden, adeta Mekke ahalisinin zihinlerine köprü kurarak zamanın asilerine de bir anlamda korku vermekte iken diğer taraftan da mutmain nefsin Cennet'i hak edeceğinden bahsederek müminlerinin kalplerine de huzur serpilmektedir. Bu bağlamda gerçekleştirdiğimiz çalışmamızı önsöz, içindekiler ve genel bilgilerden sonra, iki bölüm olarak planladık. Araştırmanın konusu, önemi, yöntemi ile araştırmanın ana kaynakları olan tefsirlerin ve müelliflerinin tanıtıldığı giriş bölümünden sonra birinci bölüme geçerek bu bölümü, sûreyi genel olarak incelemeye ayırdık. İsimlendirilmesi, nüzul sebebi, fazileti, önceki sûre ile bağı, metin ve türkçe açıklaması bu bölümde yer almaktadır. İkinci bölümde sûrenin, Rûhu'l-me'ânî ve Rûhu'l-beyân adlı tefsirlerden açıklamaları karşılıklı olarak sunulup, diğer tefsirlerden de, bahis hakkında alıntılar yapılarak, ayetlerin karşılaştırmaları yapılmıştır. Bu bölüm, altı başlık ve her başlığa ait alt başlıklar halinde incelenmiştir. İlkinde“İlahi yeminler”başlığı altında beş ayet, ikincisinde“Peygamberleri yalanlayan sapkın kavimler”başlığı altında dokuz ayet, üçüncüsünde“İmtihan”başlığı ile altı ayet, dördüncüsünde“Kıyamet manzaraları”başlığı altında üç ayet, beşincisinde“Ahiret ve insan tabloları”başlığı altında iki ayet ve son olarak“Cennet'te nimete kavuşan can”başlığı altında da, dört ayet ele alınmıştır. Sûrede Âd, Semûd ve Firavun misalleri ile, geçmiş kavimlerden, haddi aşarak sapkınlık yapanların başlarına gelen azaplar zikredilerek, onlar gibi haddi aşanlar uyarılmış, mal, mülk sevgisi ile dünyaya tamah etmek, azgınlık ve zulme meyletmek, ihtiyaç sahiplerine şefkat etmemek eleştirilmiş, insanların rızık elde ederken kolay veya zorlukla elde etmelerinin Allah'tan (c.c.) kaynaklanan ikram veya ihmal etme şeklindeki zan çürütülmüştür. Sapkınlık yapanların, haddi aşanların, ahiret manzaraları anlatılarak serzenişleri tasvir edilmiş, huzur bulan nefislere sahip mü'minler övülerek, Allah'ın (c.c.) rızasını kazandıkları ve ihlaslı kulları ile birlikte Cennet'e girmeleri tasvir edilmiştir."
