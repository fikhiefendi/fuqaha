abstract: "Bu tezde, İslam alimlerinin kaynaklarında bahsi geçen İslami uluslararası ticaret ilkelerinin, konvansiyonel uluslararası ticaret sistemi üzerindeki olumlu etkisi incelenmiştir. Bunu yapmak için, fıkhî hükümleri ve Yeni Uluslararası Ticaret Teorisi modellerini ana bileşen olarak seçerek, uygulanabilirlik ve çağdaşlık yönü birleştirilerek analizedilirken, yeni İslami teorik ufuklar keşfetmeye çalışılmıştır. Çalışma teorik ve ampirik olmak üzere iki ana bölüme ayrılmıştır. Birinci teorik bölümde, İslami uluslararası ticarete yönelik uygun ve optimal bir yapının yürütülebilmesi için piyasaların, esas olarak uygulanması gereken iki kural kategorisinden oluşan belirli ilkelere dayandırılması gerektiğini ortaya konulmuştur. Birinci kural, uluslararası ticaret sistemi piyasaları için Lancaster'in tekelci rekabete ve İmam Şatibi'nin düşüncelerinden esinlenerek öncelik kavramına dayanarak geliştiren kurallardır. İkincisi ise belirli ana politikalara dayanan koruyucu kurallardır: Fiyatlara müdahele politikası, Satmaya teşvik politikası ve Stoklama politikası. Çalışmanın ikinci aşamasında, Al Şatibi'nin kavramını Lancaster'ın modeline uygulayarak tekelci rekabet yapısına sahip piyasaların yer aldığı ülkeler panel veri seti kullanılarak ampirik olarak değerlendirilmiştir. Panel regresyon modelinde, Sabit etkiyi ve Rastgele etki tahmininin hangisinin uygun olduğunu tespit etmek için Hausman testini kullandık. Bulgular, uluslararası ticaret stratejisinde İmam Al Şatibi'nin öncelik kavramının tekelci rekabet ve ürün çeşitlendirmesi çerçevesinde uygulanmasının toplumsal refah üzerindeki olumlu etkisi olduğunu büyük ölçüde doğrulamıştır. Bu sonuçlar literatüre önemli katkılar sağlamakta ve yeni yollar açmaktadır."
