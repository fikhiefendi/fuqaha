abstract: "İbâdiyye Türkiye'de ve İslam ülkelerinde sıklıkla Haricîlik ve şiddet eylemleriyle aynîleştirilerek değerlendirilmektedir. Bu sebeple ilgili tartışmalarda İbâdiyye'nin Haricîlikle ilgilisi, günümüz tekfir gruplarıyla fikirsel benzerlik-farklılığı ve küfür anlayışı merak konusudur. Bu çalışmada İbâdiyye'nin küfür anlayışı Türkçe ve Arapça kaynaklardan hareketle tanıtılmıştır. Bu doğrultuda İbâdiyye hakkında bilinenden hareketle bilinmeyene ulaşma hedeflenmiştir. Çalışmanın birinci bölümünde Mezhepler Tarihinde küfür tartışmalarının bilinen seyri kısaca ele alınmıştır. İkinci bölümün okunmasını kolaylaştırmak amacıyla burada tekfir tartışmasının doğmasına etki eden dini, siyasi ve epistomolojik faktörler ile mezheplerin konuyla ilgili yaklaşımları literatür taramasıyla özetlenmiştir. İlk dönem İslam mezheplerinin küfür konusundaki görüşleri tespit edilip kısaca özetlenmiştir. İkinci ve son bölümde, İbâdiyye'nin oluşumu, inanç esasları, inançla ilgili, tevhid, adalet, kaza-kader, velâyet-berâet, emir ve nehiy, va'd-vaid, menzile beyne'l menzileteyn, la menzile beyne'l menzileteyn, esmâ ve ahkâm kavramları kısaca tanıtılmıştır. Devamında İbâdiyye'ye göre küfrün tanımı, mahiyeti ve tekfirle ilgili nifak, kebîra, sağîra ve ısrar kavramları incelenmiştir. Son olarak, diğer İslam mezhepleri ve İbâdiyye'nin tekfir anlayışlarının mukayesesi yapılmıştır."
