abstract: "Bu tez, İslam iktisadında paranın evrimini kapsamlı bir şekilde analiz etmektedir. İslam iktisadının para kavramını, parasallaştırmayı ve tedavülden kalkmayı nasıl ele aldığını ve bunun uygulamalara nasıl yansıdığını anlamayı amaçlamaktadır. Metalizm çağından günümüze kadar olan süreçte paranın ve parasallaştırmanın evrimini izlemek için nitel ve tarihsel bir analiz metodolojisi kullanılmıştır. Altın, gümüş, fels, çav ve kâime gibi araçların tedavüle girişleri ve tedavülden çıkışları değerlendirilmiştir. Tez, İslam iktisat düşüncesinde paranın karşılaştırmalı bir incelemesini içermekte ve İslam ekonomilerinde paranın tarihsel gelişimine ilişkin mevcut literatürü değerlendirmektedir. İslam hukuk geleneğinde parasal gelişmelerin sonuçlarını analiz etmek için, tarihî kaynaklardan fıkıh eserlerine ve çeşitli dönemlerden mevcut vaka çalışmaları ve para politikalarına kadar uzanan erken dönem İslam iktisat metinleri incelenmektedir. Tez, İslam iktisadının şeriat uyumlu esaslara sadık kalırken, modern parasal gelişmelerle nasıl uyum sağlayabileceği konusunda islam iktisadındaki mevcut para yaklaşımının yetersiz kalabileceğini öngörmektedir. İslam iktisadında paranın evrimini anlamaya çalışan akademisyenler için değerli bilgiler sunmaktadır."
