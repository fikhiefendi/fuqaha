abstract: "Bu çalışma ile öncelikle İslam ceza hukukunda öldürme suçları ve cezaları anlatılmış, Türk ceza hukuku ile benzer ve farklı yönleri karşılaştırılmıştır. Ayrıca her iki hukuk sisteminde suçlara ne şekilde cezalar verildiğine ilişkin örnek kararlar eklenmiştir. Bununla birlikte, önemine binaen kasten öldürme suçunun cezası olarak kısas cezası ayrı bir başlık altında detaylı olarak ele alınmıştır. Tezin yazılması ile amaçlanan, her iki hukuk sisteminin mukayeseli olarak gösterilmesidir. Altı yüz yıldan beri hüküm süren Osmanlı Devletinde İslam ceza hukukunun uygulanmasının da etkisiyle İslam ceza hukukunda öldürme suçları ve cezaları hep merak konusu olmuştur. Çalışmada görüleceği üzere her iki hukuk sisteminin birçok ortak yönü olduğu kadar farklı yönleri de bulunmaktadır. Ancak her iki sistemde de cezanın belirlenmesinde failin kastı önem taşımaktadır. Çalışma ile dört mezhep imamının görüşleri temel alınmış, farklılıklar var olduğunda gösterilmeye çalışılmıştır."
