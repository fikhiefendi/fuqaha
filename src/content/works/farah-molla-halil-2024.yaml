abstract: "İmam İbni Hacer el-Heytemî -Allah ona rahmet etsin- hicri dokuzuncu asrın önde gelen alimlerinden olup, İslami ilimlerde çeşitli pek çok kitap yazmıştır. Bu önemli kitaplardan biri de 467 büyük günahı saydığı ve bunlarla ilgili tehlikeleri açıkladığı“Telhîsu'z-Zevâcir an İktirâfi'l-Kebâir”adlı eseridir. İnanç, ibadet, muamelat ve ahlaka dair konuların yer aldığı bu eser, Şafii fıkıh kitaplarının bab-kısımlarına göre sıralanmıştır. İbni Hacer'den sonra H. 12. yüzyılda Molla Halil es-Siirdî -Allah ona rahmet etsin- bu kitabı kendi zamanına uygun bir şekilde kısaltmış, bazı önemli eklemeler ve eksiltmeler yapmıştır. Ayrıca büyük günahları tek başlık altında toplamış, kendisine göre büyük günah saymadıklarının sonucunda sayı 203'e düşmüştür. Bu çalışmada her iki müellifin hayatı hakkında bilgi verilmiş ayrıca söz konusu eserin yöntemi ve kaynakları üzerinde durularak tanıtımı yapılmış ve bazı konuların kısa tahliline yer verilerek ibadetler bölümü tahkik edilmiştir."
