abstract: "Uluslararası İslam Ekonomisi ve Finansı Konferansı (ICIEF) serisi, İslam ekonomisinin modern anlamda doğuşunu başlatan ve onu akademik bir disiplin olarak ele alan ilk konferans olması bakımından, günümüzde de çalışmalara yön vermesiyle İslam ekonomisi alanındaki önemini sürdürmektedir. Bu çalışma, İslam iktisadı düşüncesinin zamansal dönüşümünü anlamak amacıyla 1976 yılında başlayarak günümüzde hala devam eden Uluslararası İslam Ekonomisi ve Finansı Konferansı (ICIEF) serilerini nitel bir analiz yöntemiyle incelemektedir. İslam ekonomisinin teorik çerçevesi, uygulama alanları ve kurumsal yapılarının zaman içerisindeki evrimini ortaya koymak üzere, konferanslarda sunulan bildirilerin özet metinleri, anahtar kelimeleri, konferans konuları, ana temaları ve konferans kitaplarını inceleyerek tematik kodlama yöntemiyle analiz edilmiştir. Bu bağlamda, dönemsel olarak öne çıkan temalar, kullanılan kavramsal çerçeveler ve yöntemsel yaklaşımlar belirlenmiş; bu unsurların küresel ve bölgesel sosyo-ekonomik gelişmelerle nasıl ilişkili olduğu ortaya konmuştur. Çalışmada, İslam iktisadının ilk dönemlerinde öne çıkan ahlaki ve normatif vurguların, zamanla daha teknik, finansal ve düzenleyici tartışmalara evrildiği gözlemlenmiştir. Ayrıca, küresel ekonomik krizler, dijitalleşme, sürdürülebilir kalkınma ve finansal kapsayıcılık gibi dışsal gelişmelerin, konferans temalarına ve bildirilerin odak noktalarına yansıdığı tespit edilmiştir. Elde edilen bulgular, İslam ekonomisi literatürünün hem söylem hem de uygulama düzeyinde önemli bir dönüşüm geçirdiğini ve bu dönüşümün tarihsel bağlamda okunmasının mümkün olduğunu göstermektedir. Çalışma, İslam ekonomisi çalışmalarının gelişimini ve seyrini ortaya koyarak hem kavramsal hem de metodolojik bir katkı sunmayı amaçlamaktadır."
