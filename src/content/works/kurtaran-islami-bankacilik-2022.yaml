abstract: "İslami Bankacılık kavramı, özellikle 21. yüzyıldan itibaren dikkat çekmeye başlamış ve bu alan üzerinde yapılan tartışmalar söz konusu kavramı teorik bir çerçeveden ampirik bir çerçeveye doğru kaydırmıştır. Yapılan ampirik çalışmalarda ise ilgili kavram daha çok ekonomik büyüme ile ilişkilendirilmiştir. Bu çalışmada da benzer bir durum tercih edilerek literatür göz önünde bulundurulmuş ve bankacılık sistemleri içerisinde alternatif bir olgu olarak kabul edilen İslami Bankaların (Katılım Bankaları) ekonomik büyüme üzerindeki etkileri incelenmiştir. Çalışmanın ampirik analizi, Türkiye'de faaliyette bulunan İslami Bankaların gelişiminden mütevellit spesifik olarak Türkiye örneği ile sınırlı tutulmuştur. Çalışmada, İslami Bankaları temsili eden toplam krediler, toplam fonlar ve toplam aktifler bağımsız değişken olarak kullanılırken, GSYH ise ekonomik büyümeyi temsilen bağımlı değişken olarak ele alınmıştır. Ayrıca sabit sermaye yatırımlarını temsil eden gayrisafi sabit sermaye oluşumu da çalışmada kontrol değişken olarak tercih edilmiştir. Bu bağlamda, 2005Q4-2022Q1 arasındaki toplam 66 çeyrek dönemlik veriler kullanılarak ilk aşamada değişkenler arasındaki ilişki ARDL sınır testi ile incelenmiştir. Daha sonra ise değişkenler arasında nedensellik ilişkisinin gözlenebilmesi için Toda-Yamamoto nedensellik analizi kullanılmıştır. İslami Bankaların ekonomik büyümeyi etkilediği hipotezinin geçerliliğini ölçmek adına yapılan ARDL modeline göre uzun dönemde toplanan toplam fonların ve gayrisafi sabit sermaye oluşumunun ekonomik büyüme üzerinde pozitif ve anlamlı etkileri olduğu görülürken, toplam kredilerin ve toplam aktiflerin ise ekonomik büyüme üzerine etkisinin negatif ve anlamlı olduğu tespit edilmiştir. Toda-Yamamoto nedensellik analizine göre ise toplam kredilerden ve toplam fonlardan GSYH'ye doğru tek yönlü nedensellik, toplam aktifler ve gayrisafi sabit sermaye oluşumu ile GSYH arasında da çift yönlü nedensellik tespit edilmiştir."
