abstract: "Türk bankacılık sektörü için verimlilik ölçümü konusu, güncelliğini koruyan birolgudur. Özellikle ekonomide liberalleşme eğilimlerinin gelişmesiyle sınai kuruluşlargibi finansal kurumların da rasyonelleşme doğrultusundaki atılım ve girişimleriartmakta, bunun rekabet gücü ve verimlilik üzerindeki etkileri daha yakından veduyarlılıkla izlenir olmaktadır.1980'li yıllardan itibaren Ortadoğu'dan Türkiye'ye fon transferigerçekleştirmeye yönelik finansal hizmet sunan kuruluşların kurulmasına yönelikadımlar atılmıştır. Bunun sonucu olarak Türkiye'de ?Özel Finans Kurumları?(12.12.2005 tarihi itibariyle adı ?Katılım Bankaları? şeklinde değiştirilmiştir)kurulmuştur.Türk finans sistemine 1980'li yıllarda giren katılım bankaları yıllar itibariylegelişim göstermektedir. 2005 yıl sonu itibariyle bankacılık kesimindeki payını %2.44,toplam mevduatlar içerisindeki payını %3.33 ve toplam krediler içerisindeki payını%4.94 seviyelerine getirmiştir. Faizsiz bankacılık işlemi yapan katılım bankalarınınetkinlik ve verimliliğinin değerlendirmesi ve faiz esasına göre çalışan mevduatbankaları ile rekabet edebilirliklerinin belirlenmesi önemli görülmektedir.Araştırma çalışmasında etkinlik ölçümü için ?Veri Zarflama Analizi? yöntemiuygulanmaktadır. Veri zarflama analizi bir çok girdi ve çıktının gözlendiği ve bugözlenen girdi ve çıktıların tek bir toplam girdi ve çıktıya dönüştürülemeyeceğidurumlarda verimliliği ölçmek için kullanılan bir yöntemdir. Analizde 28 karar vermebiriminin 2001-2005 yılları arasındaki 3 girdi (mevduat toplamı - toplanan fonlar,personel giderleri, faiz giderleri - kar payı giderleri) ve 2 çıktı kalemi (kredi toplamı -kullandırılan fonlar, faiz gelirleri - kar payı gelirleri) kullanılarak uygulama çalışmasıgerçekleştirilmektedir.Sonuç olarak katılım bankaları ile mevduat bankalarının fon transferigerçekleştiren kurumlar olarak benzerlikleri söz konusu olsa da işlem şekillerinin farklıolması etkinliklerine yansımaktadır. Ayrıca bu farklılık ekonominin genel yapısındakigelişmelerden farklı bir şekilde etkilenmelerine yol açmaktadır."
