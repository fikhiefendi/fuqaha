abstract: "Bu çalışma, fıkhın, ilimleşme serüveninde geçirmiş olduğu aşamalardan birinin aydınlatılmasına katkıda bulunmak amacıyla İbrahim en Nehaî'nin fıkıh tarihindeki yeri ve Hanefî mezhebine etkisini konu edinmektedir. Fıkıh, Nehaî ile ilim olma seyrinde çok önemli bir aşama kaydetmiştir. Nehaî'nin fıkıh tarihindeki yerini belirlemek adına ilk olarak benimsediği ilmî silsile tespit edilmeye çalışılmış, bu bağlamda kendisinin İbn Mes'ûd - Alkame çizgisinin takipçisi olduğu, nedenleriyle birlikte ortaya koyulmuştur. Nehaî'nin fıkıh ilmiyle ilişkili olan faaliyeti, fetva faaliyetidir. Nehaî'nin bu faaliyetiyle, fıkıh tarihinde, hakkında veri olan alanda görüş belirtilmesinden verili olmayan alanda görüş beyan edilmesine doğru oldukça önemli bir geçiş yaşanmıştır. Kendisinden sonra ashabı arasında birtakım uzmanlık alanları yavaş yavaş belirmeye başlamıştır. Nehaî'nin, geçmişle kurulan irtibatı göstermeye dönük yazılan el-Âs̱âr'larda hayli baskın olduğu; buna karşın mesele odaklı metinlerde kendisine çok fazla atıf yapılmadığı müşahede edilmektedir. Tahâvî, Cessâs ve Ebü'l Leys es Semerkandî'nin eserleri üzerinden sonraki literatür hakkında yapılan araştırmada, mezhep doktrinini ele alan metinlerde Nehaî'ye oldukça az yer verildiği, mezhebin temel kaynakları arasında olmayan eserlerde ise nispeten daha fazla yer verildiği görülmüş ve bu durumun fıkhın gelişen diline paralel olarak Ebû Hanîfe üzerinden kendi referans ağını oluşturmaya başlamasından dolayı olduğu belirtilmiştir. Bu durumun bir uzantısı olarak VII./XIII. asra kadarki Hanefî usûl eserleri üzerinden yapılan incelemede Nehaî'ye Irak ve Buhara meşâyihinin ilk metinlerinde oldukça az yer verildiği, sonraki metinlerde ve Semerkant meşâyihinin eserlerinde hiç yer verilmediği görülmektedir."
