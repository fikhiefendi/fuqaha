abstract: "Günümüzde artan dünya nüfusu ve bu doğrultuda artan gıda ihtiyacını karşılamak, daha kısa sürede, daha az alandan, daha çok verim almak, meydana gelen teknolojik gelişmeler ışığında yiyeceklerin raf ömrünü uzatmak, gıdaların tat, görünüm veya yapısal özelliklerinin istenilen düzeye getirmek amacıyla ortaya çıkan“Gıda Katkı Maddeleri”ve“Genetiği Değiştirilmiş Organizmalar'lar (GDO'lar)”tükettiğimiz birçok gıdanın önemli bir parçası haline gelmiştir. Beslenmemizde adeta kaçınılmaz olarak yer alan“Gıda Katkı Maddeleri”ile“GDO”'larla ilgili olarak genel ve katî bir hükme varmak zordur. Gıda Katkı Maddelerinin kaynakları ve sağlık üzerindeki etkileri, istihale veya istihlâke uğrayıp uğramaması açısından değerlendirilmesi gerekmektedir. Ayrıca Genetiği Değiştirilmiş Gıdaların sağlığa etkisi ve genetiğe müdahalenin gıdanın fıtratına müdahale olup olmadığı ayrı bir tartışma konusudur.“Gıda Katkı Maddeleri”ve“GDO”ların İslam hukuku açısından incelendiğinde fayda ve zarar kriteri öne çıkmakta ve böylece zararı kesin olanlardan kaçınılması şüpheli olanlarla ilgili olarak ta mümkün olduğunca dikkatli davranılması icap etmektedir."
