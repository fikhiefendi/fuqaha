abstract: "“İslam Hukukunda Riba İle İlgili İşlemlerin Hükümleri ve Finansal İşlemler Üzerindeki Etkileri”adlı yüksek lisans tezinde riba kavramı hakkında bilgi verilmiştir. Riba en büyük günahlardan biridir. Ribanın büyük bir günah olduğu Kur'an ve Sünnet tarafından belirtilmiştir. Riba akit ve borç işlemlerinde şart koşulmuş bulunan karşılıksız fazlalık demektir. Riba“rib'al-fadl”ve“riba'nesîe”adıyla iki kısma ayrılır. Aynı malların değişimi esnasında iki bedelden birinin miktar bakımından diğerinden fazlalığı bulunursa buna riba'l-fadl; borçlanmada bir tarafın bedeli veresiye ödemesi söz konusu ise riba'nesîe denir. Buna rib'a't-te'hîr (gecikme faizi) de denir. Ribanın iki nevi de haramdır. Riba İslam'dan önce ve bütün asırlarda yaygın olarak uygulanyordu. Allah bütün dinlerde ribayı yasaklamıştı. İslam geldi ve ribanın haram olduğunu açıklıkla bildirdi. İslam'da riba ilahi bir hikmete binaen tedrici bir yöntemle dört aşamada haram olduğu ortaya kondu. Ribanın yasaklamanın birinci aşaması ribadan nefret ettirme aşaması; ikinci aşaması ribanın kapalı bir şekilde yasaklanması aşaması; üçüncü aşaması ribanınkısmen yasaklanması aşaması; ve dördüncü aşaması ise ribanın kesin ve açık bir şekilde yasaklanma aşamasıdır. Kur'an'da riba işlemini yapanlar için kıyamette ve bu dünyada şu beş ceza verileceği bildirilmiştir: Tehabbut (çarpılma), mahk (malın beketsiz olması), harb, küfr, cehennemde edebi kalma. Ribalı işlemler, toplumda zengin bir sınıfın ortaya çıkmasına sebep olur. Buna karşılık riba işlemlerinden elde edilen kazançlardan ise fakir ve muhtac sınıfına herhangi bir pay nasip olmaz. Yine faiz alıp verme işlemleri, toplumda yaygın bir şekilde adaletsizliğe, sömürüye, nifaka, kalpleri nefret ve adaletsizlikle beslemeye, insanların maddi ve fiziksel çabalarını çalmaya ve kalplerin başkalarına karşı merhamet ve şefkat duygularını yok etmeye yol açar. Böyle bir durum ise İslam dininin getirdiği toplum bireyleri arasında gerçekleşmesi istenen iyilikte yardımlaşma ve kardeşlik ruhunun öldürülmesine sebep olur. Bu araştırmada öncelikli olarak paraya dayalı finansal işlemler tanıtılacaktır. Bilindiği gibi“mal”, İslam dininin korumasını emrettiği“can”,“nesil”,“din”ve“akıl”beş değerden biridir. İslamî literatürde bu beş değer için zarûrât-ı diniyye tabiri kullanılır. Dinin korunmasını emretttiği“mal”insanların hayatında büyük bir rol oynar. Hukuki işlemlerin çoğu mal ile ilgilidir. Öte yandan malî işelemlerin bir kısmı ribayı içermekte ya da bunlar hakkında haram şüphesi bulunmaktadır. Zamanımızda bazı kimseler İslam'ın yasakladığı uyuşturucu, alkollü içkiler ve benzeri zararlı maddelerden para ve mal kazanmaktadırlar. İslam dininde, teslimi mümkün olmayan malı satma, bey'ü'r-rükbân, bey'ü'l-îne gibi satımlar yasaklanmıştır. Bey'u'l-îne bir satıcının bir malı başka bir kişiye belli bir fiyat karşılığında satması ve bir süre sonra onu satın alan aynı kişinin ilk fiyattan daha düşük bir fiyata satıcıya satmasıdır. Bu, kaybeden bir taraf ve kazanan bir tarafla sonuçlanıp satıcı kendi parasını ve fazladan bir miktarı almış olur. Bu artış şeriat tarafından yasaklanmıştır. Bu araştırmada genel olarak ivazlı akitler ve akit nazariyesi, meşru olmayan akitler, ticarî işlemler ve iktisadi faaliyetler üzerinde durulacaktır. Sözleşmeler, amacına, sözleşmenin sonucuna, asılına veya üzerine terettüp eden sonuçlara göre sınıflandırılır. Örneğin, akitler şer'i sıhhatına göre ayırdığımız zaman sahih ve sahih olmayan ikiye ayırılır. Sahih/doğru sözleşme/akit, sözleşmenin tüm şart ve unsurlarını kapsayan ve sözleşme imzalandıktan sonra etkileri ve hükümleri yürürlüğe giren sözleşmedir. Batıl/sahih olmayan sözleşme ise, domuz eti satışı gibi şartları ve temel unsurları sahih olmayan sözleşmedir. Bu sözleşmenin hükümleri geçerli değildir. Burada sözleşmelerin insanların hayatındaki önemi ve hükümleri açıklanacaktır. Ribanın yasaklığına dair doğrudan veya dolaylı olarak belirlenmiş küllî/fıkhî kaideler hakkında bilgi verilecektir. Yine bu araştırmada“Fayda sağlayan her borç faizdir”kuralı gibi en önemli fıkıh kuralları açıklanacaktır. Bu kural, ona aykırı herhangi bir eylemin yasaklanması konusunda alimler tarafından neredeyse oybirliğiyle kabul edilmektedir. Buna benzer bir kural da kârın yalnızca iş veya mal ile hakkedildiği kuralıdır. Keza diğer bir kural“Harama götüren şey haramdır”kuralıdır. Keza fıkhi kurallar ve bunların ivâzlı sözleşmelerle olan bağlantıları tartışılacaktır. Bazı fıkhî kurallar şunlardır:“Sözleşmenin bir kısmını geçersiz kılan şey, sözleşmenin tamamını da geçersiz kılar”,“Ücret sadece iş/çalışma ile hak edilir, sözle değil”,“Hakkını isteyip alma, sözleşmenin tamamına dayanır”."
