abstract: "Kendisi veya yakınları ile ilgili olarak can veya mal gibi çeşitli değerlere sahip olan insanın bundan kaynaklanan çeşitli sorumlulukları da vardır. Sahip olduğu değerlere yönelen zarar doğurucu olaylara karşı önceden tedbir almak insan için önemli bir ihtiyaçtır. Bu tedbirin sonucu olarak bireyler, karşı karşıya kalacakları zarar doğurucu olayların ekonomik sonuçlarından kendilerini korumak için sigortaya ihtiyaç duymuştur. Bu nedenle sigorta sektörü ekonomik anlamda büyüdüğü gibi bu büyüme birçok hukuki tartışma konusunu da beraberinde getirmiştir. Bünyesinde barındırdığı belirsizlik ve faiz gibi unsurlar nedeniyle geleneksel sigortanın İslam hukukuna uygun olmadığı İslam hukukçuları tarafından genellikle kabul edilmektedir. Geleneksel sigorta araçları bu nedenle Müslüman toplumlarda istenen seviyede rağbet görmemektedir. Zira insanlar risklere karşı güvence ihtiyacı ile geleneksel siogrta araçları arasında ikilemde kalmaktadır. Bu noktada dünyanın çeşitli ülkelerinde İslam hukukuna uyumlu katılım sigortacılığı gelişme alanı bulmuştur. Katılım sigortacılığı, İslam dininin öngördüğü temel ilkelere aykırı olmayan sigorta araç ve işlemlerden oluşmaktadır. Katılım sigortacılık işlem ve araçlarının İslam hukukun uyumu (şer'i uyum) hayati önemi haizdir. Danışma komitesi, bu uyumun tespiti ve ilgili bilgilerin kamuoyu ile paylaşılması konusunda öngörülmüş yasal bir yapıdır. Bu nedenle danışma komitesinin yapısı, türleri, dayanağı, hukuki niteliği ve görevlerinin araştırılması önem arz etmektedir. Çalışmada dünya örnekleri de dikkate alınarak danışma komitesinin yapısı, işlevi ve hukuki niteliği ele alınmıştır. Ortaya konulan sonuçlar çerçevesinde Türkiye'deki katılım sigortacılık faaliyeti yürütülen İslami finansal kuruluşlarda danışma komitesi yapısının şekillenmesine ve gelişimine katkı sunulması amaçlanmaktadır."
