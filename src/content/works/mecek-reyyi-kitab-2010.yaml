abstract: "?Reyyî'nin `Kitâb-ı Rûşenî' İsimli Manzum Ferâizi (İnceleme-Metin)? isimli çalışmamız, fıkıh ilminin bir kolu olan fakat zamanla ayrı bir ilim dalı olarak şekillenen ve medreselerde okutulmaya başlanılan ferâiz ilmi üzerine yazılmış bir manzume hakkındadır. Secâvendî'nin Ferâizü's-Sirâciyye adlı eseri esas alınarak yazılan manzumeyi, günümüz Türkçesiyle sadeleştirerek, metin ve muhteva bakımından tahlil etmeye çalıştık.Çalışmamız, iki bölümden oluşmaktadır. Giriş bölümünde, ferâiz ilmiyle ilgili genel bilgileri ve manzum ferâizleri anlattık. Akabinde müellifin hayatını ve eserlerini, kaynaklarda ulaşabildiğimiz bilgilere dayanarak verdik.Birinci bölümde eserin adı, sebebi te'lifi ve nüshaları ile ilgili bilgileri vererek dinî kavramlar bakımından tahlilini yaptık.İkinci bölüm ise eserin tanıtımını, nüshaların karşılaştırılmasını ve her iki nüshadan yararlanarak hazırladığımız karşılaştırmalı metni içermektedir."
