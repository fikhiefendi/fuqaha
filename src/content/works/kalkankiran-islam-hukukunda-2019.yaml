abstract: "Bu çalışmanın amacı İslam hukukunda çok geniş bir işleve sahip olan kıyası tanımak ve İslam hukukunun metot bakımından farklı yolları olan mezheplerin, kıyas uygulamalarına temel olabilecek bazı prensipleri ve bu prensipler doğrultusunda ortaya çıkan kıyas türlerinin incelemektir. Araştırmaya konu olarak alınan mezhepler, araştırmanın sınırları açısından günümüzde yaşayan ve halen müntesipleri bulunan Hanefi, Maliki, Şafii ve Hanbeli mezhepleri olarak belirlenmiştir. Araştırmada mezheplerce benimsenen kıyas türleri, her mezhebin kendi genel kıyas ve içtihat anlayışları çerçevesinde değerlendirilmeye çalışılmıştır. İslam hukukçuları tarafından telif edilen değişik usul kaynaklarında farklı kıyas taksimleri yapılmıştır. Bu araştırmada daha önce yapılmış bu klasik kıyas taksimleriyle beraber İslam hukukunun genel prensipleri göz önüne alınarak kıyas sayılabilecek yöntemler tespit edilmeye çalışılacaktır."
