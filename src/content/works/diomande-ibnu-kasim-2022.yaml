abstract: "Bu araştırmada İbnu'l-Kâsım'ın İmam Mâlik'e muhalefet ettiği meselelerden örnek olarak seçilen muamelat ve ukubat konuları delilleri ile ele alınmaktadır. Araştırmada amaçlanan hedef, farklı fıkhî mezhep müçtehitlerinin görüşlerinin incelenmesi, bu sayede araştırmacılara sağlam düşünme ve şer'î naslardan doğru istinbat yapma melekesi kazandırılmasıdır. Ayrıca bu araştırma ihtilaf edilen konularda zayıf ve tercih edilmeyen görüşlerin yerine tercih edilen görüşü benimseme noktasında inceleme ve araştırmaya da teşvik etmektedir. Bunun yanı sıra ilmi konumlarının göstergesi olarak rey sahibi müçtehitlerin hüküm verirken benimsedikleri yöntemleri, delillere ne denli yoğunlaştıklarını ve mezhep taassubuyla hüküm vermediklerini ortaya koymaktadır."
