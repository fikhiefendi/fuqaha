abstract: "Güç ve iktidarın yanlış kullanımının sonuçlarından birisi de şiddet olarak karşımıza çıkmaktadır. Günümüzde bir yandan büyük şiddet olayları yaşanırken, diğer yandan bunun önüne geçebilmek için küresel gayretler ve yönlendirmeler görülmektedir. Verilen mücadele yaşanan şiddet vakaları karşısında oldukça yetersizdir ki, artan şiddet olayları bunu göstermektedir. Şiddetin bu kadar yoğun yaşandığı dünyada aile içi ilişkilerde de şiddet vakaları sıklıkla yaşanmakta, şiddetin mağduru çoğunlukla kadınlar olmaktadır. Bu noktada sadece cinsiyete odaklanmamak, gücün haksız ve orantısız kullanımından da bahsetmek yerinde olacaktır. İslâm ülkelerinde görülen şiddet vakalarını dinle alâkalandırarak dine mâletme eğilimi gösterenler tarafından konuya mesned kabul edilen Nisâ sûresi 34. âyet ve ilgili hadisler İslâm âlimlerince farklı yorumlara konu edilmiş olup bu hususta temelde iki farklı yorum ortaya çıkmıştır. Yorumların farklılığında“darb”kelimesinin birden fazla lüğavî anlama sahip olması etkili olmuştur. Klasik anlayışta, âyette geçen“darb”kelimesine“dövme”anlamı verilirken, özellikle son dönemlerde Kur'ân'ın genel prensipleriyle ve Sünnet uygulamalarıyla bağdaşmadığı gerekçesiyle dövme anlamı verilmemekte ve dövme dışında anlamlar da kullanılmaktadır. Konu ele alınırken, Kur'ân'ın genel prensipleri çerçevesinde ve Hz. Peygamber (s.a.v.)'in uygulamaları dikkate alınarak değerlendirilmesi gerekmektedir. Nisâ sûresi 34. âyeti de mevcut uygulamayı asgariye indirme ve tedricen vazgeçirmenin bir çabası olarak anlamak ve değerlendirmek mümkündür."
