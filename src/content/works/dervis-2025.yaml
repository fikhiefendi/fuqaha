abstract: "Fıkıh Usûlü ilmi, başlangıçta şer'î hükümlerin istinbât yöntemini düzenlemek amacıyla tesis edilmiştir. Lafız kalıpları ve bu kalıpların delaletleri, teşrî' sürecinde büyük bir ehemmiyete sahiptir. Zira teşrî' bu kalıplar üzerine bina edilmiştir. Bu sebeple, usûl âlimleri de bu yöntemi esas alarak hareket etmişlerdir. Ne var ki, usûlcüler haberî lafızlara dair şer'î hüküm istinbâtını ele alan müstakil bir bab yahut özel bir araştırma tahsis etmemişlerdir. Aksine, bu konudaki ifadeleri, çeşitli araştırmalarda dağınık bir şekilde yer almıştır. Günümüzde ise haberî lafzın şer'î hüküm ifade etmediğine dair görüşlerin ortaya çıkmasıyla birlikte, bu araştırma; haberî lafzın mahiyetini ortaya koymak, onu sistemli bir şekilde tanımlayıp tasnif etmek, onunla ilgili usûlî meseleleri zikretmek, hangi kısımlarından şer'î hüküm istinbât edilebileceğini ve hangi kısımlarından edilemeyeceğini belirlemek, ayrıca doğrudan talep (emir, nehiy) yoluna başvurulmaksızın haberî lafız ile teşrî'de bulunmanın hikmetini ve faydasını ortaya koymak, bu bağlamda usûl âlimlerinin görüşlerini her biri kendi bağlamında zikretmek ve özellikle şüphelerin çoğunlukla etrafında döndüğü siyâset-i şer'iyye babında bu konuya dair bazı pratik uygulamalara yer vermek amacıyla kaleme alınmıştır. Çalışmada tümevarımsal ve analitik yöntem benimsenmiştir. Teorik temellendirme kısmında yalnızca usûl âlimlerinin görüşlerine dayanılmış, belâgat ve mantık ehlinin görüşlerine ise müracaat edilmemiştir. Araştırma problemi şu soruda özetlenmektedir:“Haberî lafızdan şer'î hüküm çıkarılabilir mi?”Bu soru, haberî lafzın mahiyetinin tanımlanmasını, sınırlarının belirlenmesini ve usûl âlimlerinin yöntemi doğrultusunda onun haber'den ayrıştırılmasını zaruri kılmıştır. Zira bu konuda usûl literatüründe açık ve kapsamlı bir metin bulunmamaktadır. Araştırma sonucunda, şer'î hükmün, haberî lafzın hem yalın (المحضة) hem de talep içeren (الطلبية) türlerinden birtakım usûlî kayıt ve şartlar çerçevesinde istinbât edilebileceği neticesine ulaşılmıştır."
