abstract: "Tezimizin amacı İmam Gazali'ye göre icma konusunu ve fıkıh usulünde bu konuyla ilgili görüşlerini incelemektir. Tezimizin başlığı (İmam Gazali'ye Göre İcma) olup araştırmamızda usulcülerin konuyla ilgili görüşlerini zikrederek imam Gazali'ye göre icmaya dair fıkıh usulü mesaili incelenecek, usul açısından tartışılacak, akabinde aralarındaki ihtilaf ve ittifak noktaları ve meseleyle ilgili tercih edilen görüş açıklanacaktır. Tez giriş, üç ana bölüm ve sonuçtan oluşmakta olup birinci bölüm İmam Gazalinin tercümeyi hali başlığını taşımaktadır. Bu bölümde İmam Gazali'nin adı, nesebi, yetişmesi, ailesi, ilim yoluna girişi, hocaları, eğitimciliği, öğrencileri, dönemi, eserleri, itikadı ve vefatı konuları işlenmiştir. İkinci bölüm usulcülere göre icma başlığını taşımakta olup bu bölümde icmanın tarifi, rükunları, şartları, delili ve hükmü ele alınmıştır. Üçüncü bölümün başlığı İmam Gazali'ye Göre İcma olup bu bölümde O'na ve Cumhura göre İcma'nın tarifi, bu tarifler arasındaki benzerlik ve farklılık yönleri ele alınmıştır. Peşinden icmanın haberi vahidin nakli ile sabit olup olmayacağı, icmanın oluşumunun engellenip engellenmeyeceği, icma olarak kabul edilmeyenler ve icmayı inkar edenlere Gazalinin cevabı, dönemin bitmesi, dönem sona erdiğinde icmanın bozulup bozulmayacağı hususunda icmayı inkar edenlere Gazali'nin cevap verme yöntemi ele alınmış ve son olarak her bir meselede görüşler tartışılmıştır. Sonuç kısmında konu özetlenecek ve ulaşılan başlıca sonuçlar zikredilecektir."
