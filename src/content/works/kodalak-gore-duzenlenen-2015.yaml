abstract: "Gelişen teknoloji, iletişim, ulaşım ile birlikte uluslararası ticaret, tüm firmalar için vazgeçilmez bir hal almış ve özellikle ülkelerin dış kaynak ihtiyaçlarını karşılamada çok önemli bir unsur haline gelmiştir. Uluslararası ticarette önemli bir ödeme aracı olarak kullanılan akreditif, bütün dünyada yaygın ve önemli bir ödeme aracı olarak kabul edilmektedir. Bu çalışmada dış ticarette kullanılan akreditifli ödeme yönteminin detaylı incelemesi yapılmış ve UCP 600'e göre örnekler incelenmiştir. Altı ana bölümden oluşan çalışmanın birinci bölümünde; dış ticaret kavramı, dünyada ve Türkiye'de dış ticaretin gelişimi incelenmiştir. İkinci bölümde dış ticarette kullanılan belgeler ele alınmış, çalışmanın üçüncü bölümünde ise dış ticarette kullanılan teslim, taşıma ve ödeme şekilleri incelenmiştir. Dördüncü bölümde, akreditifin tanımı, tarafları, çeşitleri, işleyişi ve rezerv konuları açıklanmıştır. Beşinci bölümde UCP 600'ün getirdiği yenilikler açıklanırken son bölümde ise bir katılım bankasından elde edilen veriler değerlendirilmiş ve istatistik sonuçlar irdelenerek aralarındaki bağlantılar gösterilmiştir."
