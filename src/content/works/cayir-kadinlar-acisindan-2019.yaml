abstract: "Cuma namazı, ayet ve hadis ile farz kılınan bir ibadettir. Günümüzde, kadınlar açısından Cuma namazının fıkhi hükmü konusunda bir ihtilaf söz konusudur. Bu çalışma Cuma suresi 9. ayet esas alınarak Cuma namazının kadınlara farz olup olmadığı hususunun Kur'ân ve Sünnet bağlamında tespitini kapsamaktadır. Tezimizde önce Cuma ve Cuma ilgili temel kavramlar ele alınmıştır. Daha sonra tefsirlerde ayetin genel anlamı ve kadınlar açısından işlenişine değinilmiş, Hz. Peygamber ile Sahabe döneminden bizlere ulaşan, Cuma namazının geneli ve kadınların Cuma namazına katılımı ile ilgili rivayetlere yer verilmiştir. Fıkıhta konuya dair mezheplerin görüşleri eşliğinde konunun ele alınışı ve çağdaş çalışmalardaki durum incelenmiştir. Tarafların birbirlerine yönelik değerlendirmelerine yer verilmiştir. Sonuçta Müslüman kadınları yakından ilgilendiren bir konuyla ilgili ayet ışığında çözüm bulunmaya çalışılmış, ayetin genele hitabının içine kadınların da girdiği tespit edilmiştir. Farz olduğunu savunanların görüşlerinin farz olmadığını savunanlara göre daha isabetli olduğu kanaatine varılmıştır."
