abstract: "Bu çalışmanın amacı, katılım bankalarının sorunlu kredilerin çözümlenmesi sürecinde kanuni zorunluluklar sebebiyle iş birliği yapmak durumunda kaldığı varlık yönetim şirketlerinin yerine katılım bankacılığı ilkelerine göre çalışan bir alternatif yapı önerisi sunmaktır. Bu amaç üzere öncelikle katılım bankacılığı ve katılım bankacılığında krediler konusu teorik çerçevede ele alınmıştır. Daha sonra, ülkemizdeki bankacılık sisteminde sorunlu kredi çözümleme sürecinde kilit rol oynayan varlık yönetim şirketlerinin çalışma yöntemleri incelenmiş ve İran, Pakistan, Mısır, Endonezya ve Malezya'da sorunlu kredilerin çözümlenme yöntemleri ortaya konmuştur. Çalışmanın son bölümünde, katılım bankalarının sorunlu kredi süreçlerinde yer alan tüm taraflardan birincil veriler elde etmek adına yapılmış olan saha çalışmasına yer verilmiştir. Nitel bir yönteme dayalı bu çalışmada araştırma deseni olarak, katılımcıların olayları kendi ifadeleri ile ortaya koyduğu fenomenolojik yaklaşım tercih edilmiştir. Ve saha araştırması kısmında katılım bankalarının sorunlu kredilerle ilgili birimlerinde görevli 20 personel, katılım bankalarının sorunlu kredi süreçlerine dış paydaş olarak yer alan 5 avukat ve katılım bankasından kullandığı kredisi sorunlu krediye dönmesi sonrası varlık yönetim şirketlerine satılmış 10 katılım bankası müşterisi ile yarı yapılandırılmış mülakat sorularına dayanan görüşmeler yapılmıştır. Görüşmeler sonunda elde edilen veriler analiz edilmiş ve bu analiz sonucuna dayanarak katılım bankalarının sorunlu kredi çözümleme süreçlerinde yer alabilecek bir alternatif yapı önerisi ortaya konmuştur. Bu alternatif yapının çalışma yöntemlerinin belirlenmesinde de Türkiye Katılım Bankaları Birliği Danışma Kurulu'nun konuya dair görüşü temel alınmış ve 3 farklı ortaklık yapısında faaliyet gösterebilecek alternatif bir yapı önerisi sunulmuştur."
