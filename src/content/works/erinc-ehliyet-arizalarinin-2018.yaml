abstract: "Toplum hayatı yaşamak zorunda olan insanların birbirleriyle etkileşimi kaçınılmazdır. Hayatın idamesi için gerekli ihtiyaçlar ve bu ihtiyaçları karşılamak için yapılan muameleler günlük hayatı kuşatmış durumdadır. İnsanlar farkında olmasalar bile hayatın akışı içerisinde akidler sıkça kullanılmaktadır. Akidler yapılırken belirli şartları taşımaları gerekir. Bu şartların ilki akdi yapan kişinin ehliyetinin bulunmasıdır. Yapılan akidlerin sağlıklı olabilmesi için insanda bulunan ehliyet çeşitleri ve bu ehliyetlere etki eden durumların bilinmesi önem arz eder. Fıkıh usulü ve füru fıkıh eserlerinde farklı başlıklar altında yer alan ehliyet, ehliyet arızaları ve akid konuları birlikte ele alınarak incelenmiştir."
