abstract: "Osmanlı tarihi araştırmaları için önemli kaynaklardan birisi de süreli yayınlardır. II. Meşrutiyet döneminin süreli yayınları hakkında çeşitli sınıflandırmalar yapılmıştır. Bu sınıflandırmalardan birisi de İslami muhtevaları olan yayınlardır. Mikyas-ı Şeriat gazetesi de İslami muhtevasıyla tanınan gazetelerdendir. 1908 yılında meşrutiyetin yeniden ilân edilmesiyle birlikte; Osmanlı İmparatorluğu, sansürsüz bir basın hayatıyla tanışma fırsatı bulmuştur. Basın alemindeki bu hava, süreli yayınlarda eskiyle kıyaslanamayacak bir artışa neden olmuştur. Bu çalışmamızın amacı da II. Meşrutiyet dönemi olaylarını ve basın hayatını dönemin gazetelerinden olan Mikyas-ı Şeriat'ı esas alarak tanıtmak; bazı kavram, kurum ve olaylardan yola çıkarak gazetenin çizgisini tespit etmek, dönemin fikir dünyasına olan katkılarını ortaya koymaktır."
