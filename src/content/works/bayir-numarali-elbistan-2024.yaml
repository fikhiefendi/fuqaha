abstract: "Şer'iye Sicilleri, Osmanlı Devleti'nin, siyasi, sosyal, askerî, iktisadi ve hukuki yapısını anlamak ve incelemek için başvurulabilecek temel kaynaklardan biridir. Osmanlı Devleti'nde Şer'i mahkemelere gelen davaların kayıtlarının tutulduğu defterlere şer'iye sicili denilmektedir. Bu mahkemelerde alınan kararlar ve yapılan kayıtlar bize Osmanlı tarihi ile ilgili çok yönlü bilgiler sunmaktadır. Bu çalışmanın kapsam ve amacı 470 Numaralı Elbistan Şer'iyye Sicil Defteri'nin transkripsiyonun yapılması ve değerlendirilmesidir. Çalışmada, ilk çağdan başlayarak Elbistan'ın tarihi hakkında bilgi verilmiştir. Bu bağlamda Elbistan'ın Roma İmparatorluğu'nun hâkimiyetine girmesi, Türklerin bölgeye intikali, Roma İmparatorluğu'nun dağılmasından sonra Bizans Devleti uhdesinde önce Ermenilerin, sonra yeniden Türk hakimiyetine girmesi ele alınmıştır. Ardından Dulkadiroğlu Beyliğinin ve Osmanlı Devleti'nin bölgedeki hâkimiyetinden kısaca bahsedilmiştir. Bu tez çalışması için konu edilen 470 Numaralı Elbistan Şer'iye Sicili transkript edilip bir takım değerlendirmeler yapılmıştır. Bu Şer'iyye Sicili, Haleb İstinaf Müddeʻi-i Ûmûmîliğince Elbistan Bidayet Ceza Mahkemesine gönderilen emirname ve yazışmaları ihtiva etmektedir. Hicri 1316-1318 / Miladi 1898-1901 yılları arasında Elbistan'da yaşayan tebaiyye ve memurlarının maaş, suç ve çezaları, resm, harç, vb. vergilerin tahsil ve icrası degerlendirilerek özelde Elbistan'ın genelde ise tabi olduğu Osmanlı Devleti'nin tarihî, hukuki ve sosyo-kültürel durumu aydınlatılmaya çalışılmıştır."
