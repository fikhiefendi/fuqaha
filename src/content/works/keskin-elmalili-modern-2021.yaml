abstract: "“Sa'dî ve Elmalılı'nın Modern Meselelere Yaklaşımının Mukayesesi”adı altında hazırladığımız bu çalışma, giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, yöntemi ve kaynaklar hakkında bilgiler verilmiştir. Birinci bölümde ise ilk olarak, Abdurrahman b. Nâsır es-Sa'dî'nin fikrî temellerinin daha iyi anlaşılabilmesi adına selefîliğin genel özelliklerinden bahsedilmiştir. Daha sonra Abdurrahman b. Nâsır es-Sa'dî'nin hayatı, ilmi kişiliği, eserleri ve özellikle“Teysîru'l-Kerîmi'r-Rahmân”adlı tefsirinin öne çıkan bazı özelliklerinden bahsedilmiştir. Devamında ise bazı modern meselelere yaklaşım konusunda, Sa'dî ile mukayese ettiğimiz Elmalılı Muhammed Hamdi Yazır'ın hayatı, ilmi kişiliği, eserleri ve bilhassa“Hak Dini Kur'an Dili”adlı eserinin bir kısım özelliklerine değinilmiştir. Çalışmamızın ana omurgasını oluşturan ikinci bölümde ise aynı dönemlerde yaşayan fakat farklı bölgelerde bulunan Sa'dî ve Elmalılı'nın kaynaklarda geçtiği şekliyle“kölelik, kadının yaratılışı/şahitliği/tesettürü/miras hukuku, çok eşlilik, erkeğin kadından üstün oluşu, kadının dövülmesi, el kesme cezası, recm, İslam'da şûra ve faiz”gibi bazı tartışmalı konulara dair yaklaşımlarının mukayesesi yapılmıştır. Öte yandan konuya ilişkin özellikle modern dönem alimlerinin de görüşlerine yer verilerek genel bir değerlendirme yapılmıştır."
