abstract: "Bu çalışma, Yemen'deki İslami bankalarda risk esaslı iç şeriat denetim mekanizmalarının uygulanabilirliğini COSO çerçevesi temelinde incelemeyi amaçlamaktadır. Araştırma, COSO çerçevesinin beş temel bileşeni—yönetişim ve kültür, strateji ve hedef belirleme, performans, gözden geçirme ve revizyon, bilgi, iletişim ve raporlama—ile risk esaslı şeriat denetiminin etkinliği üzerindeki etkilerini ele almaktadır. Bulgular, yönetişim ve örgüt kültürünün zayıf etkisini ve kurumsal performans ile risk esaslı şeriat denetimi arasında istatistiksel olarak anlamlı bir ilişki bulunmadığını ortaya koymuştur. Çalışmada tanımlayıcı ve analitik bir yöntem izlenmiş; birincil veriler anket yoluyla, ikincil veriler ise kitaplar ve akademik kaynaklardan toplanmıştır. Veriler SPSS programı kullanılarak analiz edilmiş, ortalamalar, Cronbach alfa katsayısı ve %5 anlamlılık düzeyinde hipotez testleri gibi istatistiksel araçlardan yararlanılmıştır. Sonuçlara dayanarak, çalışmada yönetişim ve kültür değerlerinin teoriden uygulamaya geçirilmesi, iç şeriat denetim biriminin stratejik planlama süreçlerine dahil edilmesi ve performans göstergelerinin şeriata uyumu içerecek şekilde yeniden tasarlanması önerilmektedir. Bu adımlar, risk esaslı iç şeriat denetiminin etkinliğini artırmak ve İslami bankacılığın operasyonel ve etik standartlarıyla uyumunu sağlamak için önemlidir."
