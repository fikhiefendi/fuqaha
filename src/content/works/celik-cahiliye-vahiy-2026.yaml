abstract: "Bu çalışma İslam hukukunun sosyolojik temellerini vahiy öncesi ve vahiy dönemi ceza hukuku uygulamaları üzerinden incelemeyi ve tespit etmeyi amaçlamaktadır. Bu bağlamda ceza hukuku uygulamalarının sadece normatif gerçeklikleri değil, onların toplumsal bağlam içerisindeki konumları ve gerçekleştirmeyi istedikleri amaçlar ile bu amaçların dayandığı toplumsal ihtiyaçlar birlikte değerlendirilmiştir. Çalışmada had cezası verilen suçlar olarak nitelendirilen hırsızlık, zina, iftira ve yol kesme suçları ile kısas ve diyet gerektiren suçlar ele alınmıştır. Bu suçların önceki dini ve hukuki metinlerde, Câhiliye toplumunda ve vahiy döneminde nasıl cezalandırıldığı karşılaştırmalı olarak incelenmiş, aralarındaki farklılık ve aynılıklara, bu farklılaşmanın esas teşkil ettiği toplumsal değişimlere işaret edilmiştir. Bu doğrultuda her suç hem normatif karakteri ile hem de sosyolojik boyutuyla birlikte değerlendirilerek İslam ceza hukukunun toplumsal karakteri ortaya konmaya çalışılmıştır. Kavramsal çerçeveyi oluşturduğumu birinci bölümde hukuk, suç ve ceza kavramlarına, hukukun toplum ile ilişkisine, ceza hukukunun amaçları ve toplumsal otorite ile ilişkilerine değinilmiştir. Câhiliye döneminin genel bir fotoğrafını çekmeyi hedeflediğimiz ikinci bölümde ise dönemin toplumsal ve hukuki karakteristiği ve bunu oluşturan toplumsal bağlam ele alınmıştır. Üçüncü ve ana bölümümüzde ise İslam ceza hukukunda konu edinilen had ve kısas cezalarını gerektiren suçlar, tarihsel arka plan, Câhiliye dönemi ve vahiy dönemi uygulamaları üzerinden incelenmiştir."
