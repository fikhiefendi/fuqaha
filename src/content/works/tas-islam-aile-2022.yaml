abstract: "İslâm aile hukukunda boşanma durumu taraflar açısından birtakım sonuçlar doğurmaktadır. Tezimizde bu sonuçlardan biri olan malî sonuçlar konusu ele alınmış ve tarafların bu husustaki hak ve sorumlulukları tezimizin ana konusunu oluşturmuştur. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmamızın konusu, kuramsal çerçevesi ve kaynakları ele alınmıştır. Birinci bölümde İslâm hukukunda evliliğin sona ermesi ve çeşitleri konusu ele alınarak bu konu klasik kaynaklara göre incelenmiştir. Çalışmamızın ikinci bölümünde ise evliliğin sona ermesinin malî sonuçlarından bahsedilmiştir. Malî sonuçlar, İslâm hukukunda belirlenmiş malî sonuçlar ve günümüzde tartışılan malî ödemeler olmak üzere iki başlık altında ele alınmıştır. Belirlenmiş olan malî sonuçlar başlığında mehir, muhâlea bedeli, müt'a ödemesi, iddet nafakası, süknâ hakkı, miras hükümleri ve hidâne masrafları ele alınmıştır. Günümüzde tartışılan malî ödemeler kısmında ise iddet sonrası nafaka ödemesi, maddî ve manevî tazminat ile mal rejiminden bahsedilmiştir. Bu konular ele alınırken yer yer İslâm ülkelerindeki mevcut düzenlemelere ve günümüz pozitif hukukundaki mevcut duruma da değinilmiştir. Çalışmamızın sonuç bölümünde, ulaşmış olduğumuz neticelere yer verilmiştir."
