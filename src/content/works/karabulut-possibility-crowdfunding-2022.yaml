abstract: "Kitle fonlaması, proje sahibi bir kişi ya da grup tarafından talep edilen fonun bir grup insan tarafından finanse edilmesidir. Bu işlem genellikle internet araçlığıyla yapılmaktadır. Konuya özgü araştırmalarda belirtildiğine göre bu yöntem özellikle 2008 krizinden sonra başlangıç seviyesindeki şirketler ile küçük ölçekli şirketlerin finansman bulmakta yaşadıkları güçlüklere alternatif bir çözüm olarak ortaya çıkmıştır. Günümüzde gerek yurt dışında gerekse yurt içinde projelerin kitle fonlaması yoluyla gerçekleştirilmesi yönünde gittikçe artan bir trendin varlığı gözlemlenmektedir. Bu durum, kitle fonlamasının İslamî finans ilke ve prensipleri açısından değerlendirilmesini gerekli kılmaktadır. Katılım bankaları İslamî finans ilke ve prensiplerine bağlı bir şekilde faaliyet gösteren kuruluşlar olarak hâlihazırda kitle fonlamasına benzer birtakım uygulamalar gerçekleştirmekle birlikte söz konusu uygulamaların arzulanan düzeyde olmadığı bir gerçektir. Bu çalışmada kitle fonlamasının tanımı, farklı türleri, geçmişi ve günümüzdeki durumu incelenmiştir ve sayısal veriler ve tablolar eşliğinde açıklanmıştır. İslamî finans prensipleri açısından, katılım bankalarının kitle fonlaması yöntemini nasıl sunabilecekleri irdelenmiştir. Ayrıca katılım bankalarının mevcut faaliyetlerinde kitle fonlamasına benzer uygulamalar incelenmiş, bununla birlikte katılım bankalarını kitle fonlaması yöntemini kullanmaya teşvik edecek diğer unsurlar ortaya konulmuştur. Bu çalışma aracılığıyla kitle fonlamasının toplum tarafından öneminin kavranması, bu konuda katılım bankalarının devreye girmesi ile söz konusu uygulamanın yaygınlaşması ve güvenilirliğinin arttırılması söz konusu olabilecektir. Böylelikle ülke ekonomisine ve bireysel girişimciliğe olumlu katkı sunabilecek pek çok projenin faizsiz ve katılımcı yöntemlerle gerçekleştirilmesi sağlanabilecektir."
