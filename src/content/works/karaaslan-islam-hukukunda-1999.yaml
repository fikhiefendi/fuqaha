abstract: "ÖZET Çevre, canlı varlıkların cansız ortamla bütünlük içinde yaşadığı doğal veya yapay doğa birimidir. Hava, toprak, su olmak üzere başlıca üç öğesi vardır. Ve bunlar etkileşim içindedirler. Birindeki bozulma hemen diğerlerini de etkiler. Sanayi inkılabından sonra çevreye karşı yöneltilen hoyratça kapitalist tutumlar neticesinde başta bu üç unsur olmak üzere maddi-manevi tüm çevre kirlendi. İnsan hayvan ve bitkiler zarar gördü ve hala görmektedir. 20.yüzyılın ikinci yansından itibaren iyice yığılan çevre sorunları ve çevresel talepler çevre hukukunun doğmasına yol açtı ve çevre sorunlarının evrensellik özelliği bir dizi uluslar arası sözleşmelerin imzalanmasına sebep oldu. Bu gelişmeyle beraber İslâm Hukukçuları da konuya eğilmek zorunda kaldı. Çünkü sorun aynıydı. Ve sonuçta İslâm Hukukuna göre çevreyi ele almanın gereği ortaya çıktı. İslâm Hukukunda çevre, İslâm'ın temizlik hükümleri, amme menfaati (Kamu yararı) ilkesi ve hisbe teşkilatı doğrultusunda gelişebilir. Çevrenin temiz tutulmasında ve kirliliğin önlenmesinde kamu yararı olduğu gibi aynı ortamı paylaştığımız bitki ve hayvanatın da büyük yaran vardır. Bu yönüyle çevre hakkı sadece insanlar için yorumlanamaz. Kur' ana göre hayvanlar da bizim gibi birer ümmettirler (tür). Temiz, sağlıklı ve dengeli bir çevre her insanın hakkıdır. Ama bu hak, teknolojinin yararlı taraflarım soyutlayacak şekilde idealize edilemez. İslam Hukuku doğayla uyumlu bir çevre anlayışını öngörür. Salt çevrecilikten uzaktır, salt insanmerkezci de değildir. Herşeyin, tek değer kaynağı olan Allah'tan dolayı değeri vardır. Yunus'un dediği gibi“yaratılanı hoş gör, Yaratandan ötürü”anlayışı hakimdir. İslâm Hukukunun temel iki kaynağından biri olan Kur'anda hava, su ve toprağa sık sık vurgu yapılır ve“altlarında ırmaklar akan ağaçlar”tasviriyle cennet nazara verilir. Doğanın öğeleri olan ağaç hayvan ve bitkilere de sık sık vurgu yapılarak Allah'ın nimetleri hatırlatılır ve dolayısıyla insanın imar ve ıslah görevi... Kur'anda çevreyle viıilgili kesin olarak emredici ve yaptırıcı hükümler yoktur ama tartışmaya imkan vermeyecek şekilde çevresel değerleri korumamız ve geliştirmemiz gerektiğini en basit bir Kur' an okuyucusu bile anlayabilir. Sünnette, Kur'ana göre çevreyle ilgili daha çok emir ve tavsiyeler buluyoruz. Ağaç dikmekten, sit alanı ilan etmeye, hayvanların yumurtalarına basmamaya kadar bir çok husus hakkında hadislerin olduğunu görüyoruz. Gerek tavsiye edici ve gerek bağlayıcı ve yaptırıcı ve hatta cezalandırıcı olabilen bu hükümler daha sonraki yüzyıllarda hisbe teşkilatının doğmasına sebep olmuş ve çevreyi kontrolle ilgili memurluklar ihdas edilmiştir. Bu memurların yetkisi neredeyse bütün yetkileri içine alabilecek kadar genişti ve çevreyle ilgili maddi-manevi bütün problemler bu teşkilatça kontrol ediliyordu. Ana prensipleri“kötülüğü nehyetmek, iyiliği emretmek”di. İşte bu bağlamda, bugünkü anlamda bağımsız ve sistematik olmasa da ilk günden beri var olan çevreci değerler ve hukuk için söz konusu olacak yaptırımlar, daima var olagelmiştir. Osmanlı döneminde, çevreyle ilgili bir dizi yasalar çıkarılmıştır. İslâm Hukukunun genel maksatları olan akıl, nefis, nesil, din ve malı korumanın üçü çevreyle ve çevre hakkı ile ilgilidir. Çevre hakkı bütün bu maksatların ve diğer hakların üzerinde yaşanılarak varlık kazanacağı bir hak çeşididir. vııı"
