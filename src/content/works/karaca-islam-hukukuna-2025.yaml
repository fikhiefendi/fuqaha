abstract: "İslâm hukuku, çocuk haklarına büyük önem vermekte olup, çocukların fiziksel, duygusal ve manevî ihtiyaçlarının korunmasını esas almaktadır. İslâm hukukunda çocukların yaşam hakkı, eğitim hakkı, maddî-manevî bakımı, adalet ve hakkaniyet ilkesi çerçevesinde güvence altına alınmaktadır. Bu bağlamda İslâm hukuk sisteminde sokak çocukları gibi korunmaya muhtaç gruplar için toplumun ve devletin sorumlulukları vurgulamaktadır. İslâm'da çocukların yaşam hakkı, doğum öncesinden itibaren korunmaktadır. Çocukların eğitim alarak ahlâklı bireyler olarak yetiştirilmeleri temel bir görev olarak değerlendirilmektedir. Çocukların maddî ihtiyaçlarının karşılanması, sevgi ve şefkat gibi manevî desteklerin sağlanması ise ebeveynlerin temel sorumlulukları arasında yer almaktadır. Toplum ise çocuklar arasında herhangi bir ayrım yapmaksızın adaletle davranmayı bir ilke olarak benimsemektedir. Sokak çocukları, ekonomik ve sosyal nedenlerle aile desteğinden mahrum kalan bireyler olarak tanımlanmaktadır. İslâm hukuku, bu çocukların korunmasını yalnızca ailelerin değil, aynı zamanda toplumun ve devletin de görevi olarak kabul etmektedir. Devlet, sosyal adaleti sağlamakla birlikte sokak çocuklarının eğitimi, sağlığı ve barınması için gerekli önlemleri almakla yükümlü bulunmaktadır. Zekât ve sadaka gibi mali kaynaklar, bu çocukların ihtiyaçlarının karşılanması amacıyla kullanılmaktadır. İslâm hukuku, sokak çocuklarının suistimal edilmesini yasaklamakta ve onların korunması, eğitimi ve rehabilitasyonu için sevgi temelli bir yaklaşımı teşvik etmektedir. Bu anlayış, çocukların sağlıklı bireyler olarak yetiştirilmeleri için toplumsal ve kurumsal düzeyde çaba gösterilmesi gerektiğini ifade etmektedir."
