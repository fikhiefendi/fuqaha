abstract: "Bu tez, Giriş, iki Bölüm ve Sonuç olmak üzere üç kısımdan oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir.İlk bölümde âriyet ve vakıf terimlerinin izahı yapılmakta, genel hatlarıyla âriyet akdinin ve vakıf muamelesinin kurallarına, kuruluşuna âriyet akdinin ve vakfın temel unsurlarında aranan şartlara değinilmektedir.Tezin ikinci bölümünde âriyet akdi ve vakıf, doğurduğu hukuki sonuçlar açısından karşılaştırılmaktadır. Bu bölümde âriyete konu olan mal ve vakfa konu olan mal üzerinde tarafların hakları ve söz konusu mallara karşı sorumluluklarına değinilmekte, âriyet akdi ve vakıf, bağlayıcılıkları açısından irdelenmektedir. İslam hukukçuları arasında bağlayıcılık açısından vakıf muamelesini âriyet akdine benzeten görüşler ve karşıt görüşler, öne sürdükleri delillerle karşılaştırılarak incelenmektedir.Sonuç kısmında ise elde edilen verilerin karşılaştırılması yapılmaktadır."
