abstract: "İbn Dakîki'l-Îd (702/1302) yedinci yüzyılda İslam dünyasında yetişmiş birçok âlim tarafından mutlak müçtehid ve müceddid olarak kabul edilmiş önemli âlimlerden biridir. İslam hukuku yanı sıra birçok alanda eserler kaleme almış ve İslam fıkhına gerek usûl gerekse furu'da farklı yaklaşım ve yorumlar katmıştır. Çalışmamıza konu edindiğimiz İbn Dakîk'in"
