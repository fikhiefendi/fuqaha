abstract: "İzafet terkibi olarak, hikmetü't-teşrî':“Her hukuki hükmün konuluşunda, asıl itibariyle adalet ve maslahat temeline dayalı olarak amaçlanan hedefler ve gayelerdir”diye tarif edilebilir. Ayrıca hikmet-i teşrî' ilmini, İlm-i Marifeti'ş-Şerâyi' olarak isimlendirmek de mümkündür. Hikmet-i teşri'; fıkhî hükümlerin hikmet ve maslahatlarından söz eden bir ilimdir. Fıkıh Usulü ve bu ilim, şer'î (dini) hükümlerin ve ortaya konuluşlarının felsefesidir. İlahi teklifin hikmeti ancak Hikmet-i teşrî' ilmi ile bilinir. Şer'î kanunların vazediliş sebepleri, hükümlerin hikmetleri, emirler, nehiyler, mükâfat ve cezanın sebepleri ancak bu ilim yolu ile anlaşılır. Bu ilim, Hz. Peygamber döneminde mevcut olmakla beraber, o zamanın şartları gereği tedvin edilmemiştir. Ancak hicri ikinci asırda diğer ilimler gibi bu ilimle ilgili eserler tedvin edilmiştir. İslam dininin hitap ve hükümlerinin tahlil edilmesinde Ta'lil ve Taabbud kavramları terimleşmiş ve çok önemli hale gelmiştir. Bu kavramlar, Şâri' tarafından emredilen herhangi bir emrin akılla bilinip bilinememesi ile ilgilidir. Taabbudî kavramı; gerekçesi akılla kavranamayan hüküm demektir. Bunlar için çok genel hikmetler söylenebilir, buna karşılık çok özel ve gerçek anlamda bir sebep ve izah yapmak mümkün değildir. Taabbudî ibadetlerin en başında; îman, kelime-i şehadet, namaz, oruç, zekât vb. gibi dinin sabiteleri vardır. Bu gibi ibadetler dinin korunmasına yöneliktir. Kıyas ve akıl yürütme asla kabul etmez. Meselâ namaz gerek bütünü gerekse ayrıntıları bakımından taabbüd sayılmış ve namazla ilgili hükümlerin ta'lîle açık olmadığı söylenmiştir. Ta'lîlî kavramı; bir hükmün illetini, gerekçesini araştırma ve tespit etme yöntemidir. Kıyas ve kısmenakıl yürütmeye açık olabilen alanlar vardır. Namaz, taabbudî olup herhangi bir akıl yürütme ile illeti öğrenilemez. Namaz, İslam dininin beş şartından biridir. Namaz, sözlük ve terim olarak pek çok anlama gelmektedir. Hikmet-i teşrî'e ışık tutmak amacıyla geniş olarak; dua, lüzum ve gerekli olmak, ayrılmamak, sımsıkı tutmak ve uylukları hareket ettirmek, cehennemden kurtarıcı, rahmet, övgü, istiğfar, yüceltmek ve tebrik etmek anlamlarına gelmektedir. Fıkıh ıstılahında ise namaz, bilinen fiiller ve özel rükünlerden oluşan bir ibadettir. Namaz, tekbir ile başlayıp selamla biten belirli söz ve hareketleri içeren ibadetin özel ismidir. Ayet ve hadis tezimize konu olan pek çok hikmetleri içinde barındırmaktadır. Namaz, insanlık tarihi kadar eskidir. Bilindiği kadarıyla ilk namaz Âdem (a.s)'in kılmış olduğu namazdır. Semavi dinlere emredildiği gibi, semavi olmayan dinlerde de namazı çağrıştıranritüellere rastlanmaktadır. Geçmiş milletler, üzerlerine farz olan namazı terk etmeleri sebebiyle bazı felaketlere maruz kalmışlardır. Eski Mısır'da zaman hesaplamalarının gelişimi namaz vakitlerini tespit etme gayretleri neticesinde ortaya çıkmıştır. Namaz, İslam teşrî' tarihinde tedrîcî olarak farz kılınmıştır. Şöyle ki, ilk olarak gece namazı Mekke Müslümanlarına farz kılınmıştır. Buradaki gaye ise medeniyet inşasında çekilebilecek zorluklara Müslümanları hazırlamaktır. Namaz, günde beş vakit olarak akıllı, ergen olan her Müslüman için farzdır. Cemaatle kılınması çok önemlidir. Beş vakit namazın haricinde Cuma ve bayram namazları gibi cemaat halinde kılınması gereken namazlarda vardır. Nafile namazlar sünnet olup amel cihetinden eksiklikleri tamamlayıcıdır. Namaz; maddi ve manevi temizliğin tesis edilmesine yardımcı olur, hayatta dakik olmayı sağlar, toplumun bütün fertlerini tek çatı altında toplamaya yardımcı olur, etnik kavgalara mahal vermez, temyiz yaşından ölünceye kadar uzun vadeli sürekli bir okul niteliğindedir. Sağlık açısından büyük faydaları olduğu gibi, irade ve şahsiyet geliştirici özelliği de vardır. Namaz, beden ve ruh sağlığı açısından faydalı olduğu tespit edilmiştir. Toplumsal eğitim açısından faydalar ihtiva ettiği belirlenmiştir. İslam toplumunda kardeşlik ve eşitlik vurgusu yapmaktadır. Bunun en bariz örneği Evs ve Hazrec kabilesinin kardeşliğidir. Zira bu iki kabile daha önce kan davaları sebebiyle kavga halindeydiler. Namaz dua için vesiledir. Psikolojik problemleri olan kimseler namaz kılarak kendilerini rahatlatabilirler. Zira Kur'an, sabır ve namazı tavsiye ederek bu sıkıntılardan kurtuluş şeklini öğretmektedir."
