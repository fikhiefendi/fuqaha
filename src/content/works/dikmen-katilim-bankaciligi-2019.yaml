abstract: "Faizsiz Bankacılık olarak da bilinen Katılım Bankacılığı reel ekonomiyi finanse eden, mali sektörde faaliyet gösteren ve bankacılık hizmetleri sunan kuruluşlardır. Finans sisteminde tasarruflarını değerlendiremeyen yatırım yapma fırsatı bulamayan bireylere fırsat kapısı açmaktadır. Bu nedenle katılım bankaları kurulmuştur. Gelişmekte olan dünyamızda globalleşmenin paralelinde atağa geçen faizsiz bankacılık dünya genelinde ilk olarak Mısırda kurulmuştur (Zaim, 2010).Zaim'in belirttiği üzere; bu gelişim 1963 yılından 1967 yılına kadar evirilmiş, 1971 yılında da ilk olarak adını duyurmuştur. Türkiye'de ise, 1985 yılında hayatımıza giren faizsiz bankacılık uygulamaları özel finans kurumlarının aldığı aksiyonlar ile var olmuştur. Yaklaşık 30 yıl özel finans kurumlarının bünyesinde yer alan faizsiz bankacılık 2005 yılında yapılan yasal değişikliklerle;5411 sayılı bankacılık kanununun hayata geçirilmesiyle 2006 yılı ve sonrasında katılım bankaları olarak anılmaya başlanılmıştır (Büyükdeniz, 2003). Bu çalışmanın amacı Katılım Bankacılığının ekonomiye etkisinin incelenmesidir. Bu amaçla, öncelikle Katılım Bankacılığı kavramı ve onun tarihsel gelişimi örneklerle ele alınmıştır. Akabinde ülkemizde hizmet veren Katılım Bankası ile Ticari bankalarda çalışan personel ve bankacılık sistemi hakkında bilgi sahibi olan bireylere anket uygulanmıştır. Anket neticesinde katılım bankacılığının finans sektöründeki yerinin daha iyi seviyelere gelememesi sebeplerinden birisi, gerek katılım bankası uygulamalarının gerekse faaliyet esaslarının insanlara doğru ve anlaşılır şekilde açıklanmasında eksikliklerin olduğunu, bu sebep dendir ki katılım bankalarının faaliyetlerinin ne olduğunu bilmeyen yüzlerce kişi bulunmaktadır. Ancak katılım bankalarının ticari bankalara alternatif olduğunu ve katılım bankaları var olduğundan ticari bankaları tercih etmeyen kitlelere ulaşılmıştır. Katılım bankalarının faizsiz olması düşüncesi ile katılım bankalarını tercih eden bireylerin atıl olan fonlarını ekonomiye kazandırarak ülke ekonomisine katkı sağlamaktadır. Katılım bankacılığının Türkiye'nin finans sektöründe önemli bir yer edindiği de gözlenmektedir."
