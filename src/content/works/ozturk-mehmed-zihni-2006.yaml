abstract: "İlim ve kültür dünyamızın seçkin şahsiyetlerinden olan Zihnû Efendi,Osmanlı'nın son dönem âlimlerindendir. Te'lif ettiği eserleri, uzun yıllar derskitabı olarak okutulmuş ve bunların içerisinde özellikle Nimet-i İslam, halkımızınve ilim ehlinin ellerinde muteber bir konuma yükselmiştir.Zihnû Efendi, Osmanlı döneminin buhranlı dönemlerinde yetişmesinerağmen, tedris hayatını en güzel şekilde değerlendirerek kendini geliştiren mümtazbir şahsiyettir. Arapça konusundaki engin bilgisi, herkesin takdirine sebeb olmuş,Arapça, Fıkıh ve Akâid hakkında yazdığı eserleri, o dönemin mekteplerinde, derskitabı olarak okutulmuştur.Türkçe yazılan tefsir kitapları arasında Elmalılı Hamdi Yazır'ın Hak DiniKur'an Dili adlı eseri ne kadar önemli ise, ilmihal kitapları arasında da, MehmetZihnû Efendi'nin Nimet-i İslam adlı eseri, aynı şekilde önemlidir. Mehmet ZihnûEfendi'nin, alana hâkim oluşu ve ele aldığı meseleleri titizce incelemesi nedeniyle,Nimet-i İslam adlı eseri, diğer ilmihal kitaplarını etkileyen ve bu kitaplara örnekteşkil eden bir ilmihal olmuştur.Zihnû Efendi, Nimet-i İslam'ın Oruç bölümünde 49, Zekât bölümünde 8, Hacbölümünde 30 ve Nikâh ve Talak bölümünde ise 36 hadis rivayet etmiştir. Buçalışmamızda, Zihnû Efendi'nin fıkıh kitabı olan Nimet-i İslam adlı eserinde, fıkhûbir konunun desteklenmesi maksadı ile nakledilen, Oruç, Zekât, Hac, Nikâh veBoşanma bölümlerine ait toplam 123 hadisin, hadis kitablarındaki yeri tespitedilmiş; ulaşabildiğimiz kadarıyla hadis âlimlerin görüşlerinden yararlanarak,senedi hakkında bilgi verilerek hadislerin tahric ve değerlendirmesi yapılmıştır."
