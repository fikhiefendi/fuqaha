abstract: "Çalışmamızda, Abdurrahman Mübârekfûrî'nin (1353-1935) kaleme aldığı Tuhfetü'l-Ahvezî Şerhu Câmi'i't-Tirmizî isimli eserinde kendisinden beş asır önce yaşamış olan Bedrüddîn Aynî'ye (855/1451) yapmış olduğu itirazlar incelenmiştir. Tezimiz giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde, konunun önemi, amacı ve metodu hakkında bilgi verilmiştir. Çalışmamızın ilk bölümünde Aynî ve Mübârekfûrî'nin hayatı hakkında bilgi verildikten sonra Mübârekfûrî'nin yaşadığı döneme kısaca değinilmiştir. İkinci bölümde Mübârekfûrî'nin Tuhfetü'l-Ahvezî'inde Aynî'ye yapmış olduğu bazı itirazlar metin ve sened yönüyle ele alınmıştır. Yapılan itirazların ağırlıklı bölümü fıkhî konularla ilgili olmasından dolayı bu konuyla ilgili yapılan tenkidler üzerinde daha fazla durulmuştur. Sonuç bölümünde de konuyla ilgili elde edilen neticelere değinilmiştir. Çalışmamıza konu olan eserinde Mübârekfûrî, Aynî'den yaptığı nakillerden yaklaşık dörtte birine itirazda bulunmuştur. Aynî'nin Hanefî mezhebinin ciddi bir savunucusu olması ve Mübârekfûrî'nin de Ehl-i hadis zihniyetine sahip olması dikkate alındığında aralarındaki ihtilâfların nassları anlama ve değerlendirmede sergiledikleri yöntem ve yaklaşım farklılığının bir yansımasından ibaret olduğunu söylemek mümkündür."
