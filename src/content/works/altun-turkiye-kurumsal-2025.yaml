abstract: "Tarih boyunca borçlanma, bireylerin ve toplulukların ihtiyaçlarını karşılamada önemli bir araç olmuştur. Ancak çoğu zaman faiz gibi sömürü araçlarıyla suistimal edilmiştir. Oysa birey ve toplum için maddi ve manevi zararlara yola açan faiz, tüm ilahi dinlerde yasaklanmıştır. Kur'an ve sünnette faiz, tüm türevleriyle yasaklanmış, böylece ekonomik hayatın temelinde önemli bir prensip olarak yerini almıştır. Birey ve tüccarların zaruri ihtiyaçlarından biri olan borçlanmaya da kayıtsız kalmayan İslam; faize alternatif, adalet ve yardımlaşma temelli çözümler sunmuştur. Karşılıksız borç verme manasına gelen ve kendisine“Allah'a borç verme”gibi yüce bir anlam yüklenen“karz-ı hasen”, bu çözümlerden biridir. Karz-ı hasen kültürü, asırlar boyunca hem bireysel hem de toplumsal bir uygulama olarak varlık göstermiştir. Ancak son yüzyılda kapitalizmle birlikte, faizli bankaların ve faizli işlemlerin yaygınlaşması, karz-ı hasen anlayışını zayıflatmıştır. Bu durumu gören birey ve topluluklar, İslam'ın dayanışma aracı olan karz-ı hasen uygulamasını yeniden canlandırmak amacıyla bireysel uygulamaların ötesine geçmiş, ona kurumsal ve sistematik bir nitelik kazandırmaya çalışmışlardır. Bu çalışmanın temel amacı, Türkiye'deki kurumsal karz-ı hasen uygulamalarını incelemek, yapı ve işleyişlerini ortaya koymak ve genel bir değerlendirme sunmaktır. Çalışmada Türkiye'de en yaygın üç tip kurum ele alınmıştır. Nitel araştırma yöntemiyle yürütülen çalışmada, ilgili kurumların resmî belge ve verileri incelenmiştir. Çeşitli yöneticilerle görüşmelerin de yapıldığı çalışmada dokümantasyon analizi yapılmıştır. Kâr amacı gütmeyen vakıf, dernek ve sandık gibi yapıların, kuruluşlarında karz akdinin fıkhını uygulama çabaları ve karz-ı hasen uygulamasının sürdürülebilirliğine yaptıkları katkılar belirginleşmiştir. Çalışma, karz-ı hasen geleneğini ihya etmeyi, bu alanda faaliyet gösteren uygulamalara duyulan güveni pekiştirmeyi ve artırmayı, tespit edilen sorun ve eksikliklerin giderilmesine katkı sağlamayı hedeflemektedir."
