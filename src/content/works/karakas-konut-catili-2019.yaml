abstract: "Türk Borçlar Kanunu m. 350-356 arasında kira sözleşmesinin dava yoluyla sona ermesi düzenlenmiştir. Konut ve çatılı işyeri kiraları hem kiracıdan kaynaklanan sebeplerle hem de kiraya verenden kaynaklanan sebeplerle sona erebilir. Çalışmamızda konut ve çatılı işyeri kiralarının kiraya verenden kaynaklanan sebeplerle sona ermesi incelenmiştir. Konunun daha iyi anlaşılabilmesi için çalışmanın birinci bölümde kira sözleşmesinin tanımı yapılarak; unsurları, hukuki niteliği, süresi ve sona ermesi açıklanmıştır. Ayrıca, Türk Borçlar Kanunu'nda yer alan konut ve çatılı işyeri kiralarına özgü hükümlerin uygulama alanının kapsamı belirlenmiştir. Bu amaçla Türk Borçlar Kanunu'nun 339. maddesi çerçevesinde konut ve çatılı işyeri kavramları açıklanmıştır. İkinci bölümde kiraya verenden kaynaklanan sebepler başlığı altında; konut ve çatılı işyerleri kiralarının ihtiyaç, yeniden inşa veya imar ve yeni malikin ihtiyacı sebebiyle sona ermesi halleri ele alınmıştır. Bu bölümde, Türk hukuk doktrininin kaynakları ve mahkeme içtihatları ele alınmış ve sona erme sebepleri uygulamadan örnekler ile açıklanmaya çalışılmıştır. Üçüncü ve son bölümde tahliye davaları ve sonuçları incelenmiştir."
