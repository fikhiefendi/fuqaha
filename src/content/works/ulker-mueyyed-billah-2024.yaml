abstract: "Şiî gelenek içerisinde doğan ve İslam tarihi incelendiğinde kendine has birtakım ayırıcı özellikleri bulunduğu görülen Zeydiyye mezhebi, teşekkül sürecini hicri 3-4. yüzyıllarda tamamlamıştır. Bazı âlimler, mezhebin teşekkülüne yaptıkları katkı oranında, mezhep mensubu fukaha içerisinde ön plana çıkmışlardır. Bu mezhepte ön plana çıkan âlimlerden birisi de Müeyyed-Billâh Ahmed b. Hüseyin'dir. Farklı yönleriyle bu fakihin hayatını ve Zeydiyye fıkhına yaptığı etkilerle mezhepteki konumunu tespit etme hedefindeki bu çalışmanın birinci bölümünde, Zeydiyye fıkhının teşekkül süreci bu fakih merkeze alınarak anlatılmıştır. İkinci bölümde gerek Zeydî kaynaklar gerekse genel nitelikli tarih kitapları incelenmiş ve müellifin hayatı, ilmî kişiliği, hocaları, eserleri ve yaşadığı dönemle ilgili bilgiler verilmiştir. Üçüncü bölümde ise Müeyyed-Billâh'ın kendi eseri olan Şerhu't-Tecrîd'deki oruçla ilgili görüşleri incelendikten sonra müteahhirûn dönemi ulemasından İbnu'l-Miftâh'ın Şerhu'l-Ezhâr adlı eserine intikal eden görüşleri ekseninde onun mezhebe yaptığı katkılar tespit edilmeye çalışılmıştır. Mezhebin teşekkülüne katkısı bilinen müellifin, mezhebi son dönemdeki klasik biçimine ulaştıran ve yeri geldiğinde tahrîc gibi fıkhî yöntemlerle ona doğrudan katkıda bulunan isimlerden biri olduğu anlaşılmakta, sonraki dönemlerde de onun görüşlerine azımsanmayacak derecede itibar edildiği görülmektedir."
