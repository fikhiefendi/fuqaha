abstract: "İnsan ilişkilerinin ayrılmaz parçası olan borç ilişkisinin güvenli bir zemine taşınması amacıyla ortaya bazı uygulamalar çıkmıştır. Bunlardan biri olan rehin işlemi, borcun bir mal ile teminat altına alınmasını sağlamaktadır. İslâmiyetten önce de mevcut bulunan rehin işleminin sınırları, İslâm hukuku tarafından yeni bazı kural ve şartlar belirlenmek suretiyle çizilmiştir. İslâm hukukunun gerek klasik gerek güncel kaynaklarında rehin akdinin mahiyeti, unsurları, şartları, sonuçları ve bunlarla bağlantılı meseleler ayrıntılı şekilde incelenmiştir. Ancak yapılan çalışmalar çoğunlukla teorik boyuttadır. İslâm hukukunun ortaya koyduğu kural ve hükümlerin insan hayatının işleyişini düzenlediği göz önünde bulundurulduğunda, teorik açıdan detaylı malumata erişim imkanı bulunan rehin akdinin ugulamada nasıl karşılık bulduğu araştırılmaya açık bir husustur. Bu bağlamda genelde İslâm hukuku, hususi olarak ise Hanefî mezhebinin görüşleri üzerine kurulmuş Osmanlı yargı sistemine ait mahkeme kayıtları rehin akdinin işlevini gözlemleme fırsatı sunmaktadır. İki bölümden oluşan bu çalışmanın birinci bölümünde, bahsedilen kurallar ve şartlar Hanefî, Mâlikî, Şâfiî ve Hanbelî mezheplerine ait görüşler mukayese edilerek öz bir şekilde açıklanmıştır. İkinci bölümünde ise XVIII. yüzyıla ait İstanbul Kadı Sicillerinden alınan örneklerin, birinci bölümde yer verilen meselelerle uyumu incelenmiştir. Böylelikle rehin akdine ait teorik bilgiler ile Hanefî mezhebi temellerine dayanan Osmanlı pratiğinin birbirine ne derece uygun olduğu ortaya konmaya çalışılmıştır."
