abstract: "Arapça öğretiminin yayılmasıyla birlikte Arap Dünyası ile Türkiye arasında son dönemlerde başında Arapça öğrenme isteğinin olduğu birçok alanda yakınlaşmaya şahit olduk. Bu durum, Türkçe ve Arapça arasında sesbilim, sarf ve nahiv alanlarında karşılaştırması çözümlenmesine yönelik daha çok çalışma ve araştırma yapılmasını gerekli kılmıştır. Arapça ile diğer dünya dilleri arasında çeşitli dilsel konuları içeren karşılaştırmalı çözümleme konusunda çok sayıda çalışma yapılmıştır. Buna karşılık Türkçe, karşılaştımalı çalışmalardan yeteri kadar nasibini almamıştır. Emrullah İşler tarafından yapılan çalışma örneğinde olduğu gibi Türkçe-Arapça etkileşimini konu edinen çalışmalarda sadece ses yönünden etkileşim veya her iki dilde de kullanılan soru edatlarının mukayesesi gibi belirli bir konuyla sınırlı kalmıştır. Arapça-Türkçe etkileşimine dair çalışmaların sayıca az olmasına sebep olarak Arapçanın Türkler tarafından din dili olarak görülmesi gösterilebilir. Bu bağlamda Türkiye'de Arapça ile ilgili yapılan çalışmaların nahiv, sarf, edebiyat, belagat konularına yoğunlaştığını görmekteyiz. Bu yüzden bu çalışma alandaki boşluğu doldurmak ve bu alanda gelecek çalışmalar için bir umut olmak üzere ana dil olarak Arapça ve ikinci dil olarak Türkçe ses ve cümle yapısı sistemleri arasındaki karşılaştırmalı çözümlemesi hakkında yapılmıştır. Bu araştırma dört bölümden oluşmaktadır. İlk bölümde Türkçe ve Arapçanın gelişimi, karşılaştırmalı çözümleme ile dilcilerin bu husustaki görüşleri ve dünya dilleri arasındaki etkileşim hakkında bilgi verilmiştir. İkinci bölümde her iki dilin fonetiği ele alınmıştır. Üçüncü bölümde ise her iki dildeki cümle yapısı üzerinde durulmuştur. İki dil arasındaki karşılaştırmalı çözümlemenin öneminden hareketle dördüncü bölüm ise Türkçe ve Arapça arasındaki benzer ve farklı yönlerin tahliline yer verilmiştir."
