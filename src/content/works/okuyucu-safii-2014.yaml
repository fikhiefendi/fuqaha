abstract: "Şâfiî mezhebi, günümüze intikal eden dört büyük Sünnî fıkıh mezhebinden birisidir. Muhammed b. İdris eş-Şâfiî'ye (ö. 204/820) nispet edilen bu mezheb, Hanefî ve Mâlikî mezheblerinden sonra ortaya çıkmış ve Şâfiî'nin geliştirdiği yeni usûl anlayışı doğrultusunda, geriye bıraktığı furû fıkıh mirası üzerinde şekillenmiştir. Hicrî ikinci yüzyılın hâkim iki fıkıh ekolü konumundaki Hanefîler ve Mâlikîlerden farklılaşan yeni bir usûl anlayışı geliştirmiş olan Şâfiî'nin görüşleri, ashab olarak anılan yakın öğrencileri ve müteakip nesillerin çalışmaları neticesinde bir fıkıh mezhebine dönüşmüştür. Bir yüzyılı aşkın bir süreç dâhilinde muhtelif alanlarda yaşanan gelişmeler, Şâfiî mezhebini güçlü ve etkin bir fıkıh mezhebi haline getirmiştir. Bu tezde, hicrî üçüncü asırla dördüncü asrın başlarında Şâfiî fıkıh çevresinde yaşanan gelişmeler çerçevesinde mezhebin teşekkül süreci incelenmektedir. Şâfiî'nin ashabı, onların öğrencileri ve üçüncü nesille sınırlanan bu çalışma, Şâfiî fıkıh çevresinde yaşanan ve mezhebin teşekkül sürecine katkı sağlamış muhtelif gelişme alanlarını bahse konu etmekte ve hicrî dördüncü asrın başları itibarıyla Şâfiî mezhebinin ulaştığı noktanın tespitini hedeflemektedir."
