abstract: "Bizi İslam'a ileten ve Hz. Peygamber (s.a.v) yöntemiyle İslam hükümlerini öğrenme kabiliyeti veren rabbimize hamd olsun. Hasın delaleti ve fıkhi hükümlerdeki sonuçları adındaki tezimiz, bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında konunun önemi, konunun seçilmesinin nedenleri, yöntemi, araştırma esnasında karşılaşılan zorlukları ve bu konu hakkında daha önce yapılan çalışmalar ele alınmıştır. Birinci bölümde usulcülere göre hasın durumu ve hükümlerdeki etkisi iki ana başlık altında ele alınmıştır. Birinci başlıkta hasın tanımı, şartları ve şekilleri örneklerle ele alınarak has, husus ve tahsis terimleri arasındaki fark açıklanmıştır. Buna ilave olarak âlimlerin tahsis ile nesih, takyid ile tahsis ve tahsis ile istisna arasındaki farklar hakkındaki görüşleri işlenmiştir. İkinci başlıkta ise, hasın delaleti, hükmü, fer'i konulara etkisi ele alınarak konuyla alakalı bazı kurallar açıklanmış ve hasın hükmü, delaleti ile ilgili etkiler ve bunun fürudaki ihtilafa yönelik yansımaları anlatılmıştır. İkinci bölüm, hasın alt başlıklarını ve bunlara terettüp eden konuları içermektedir. Bu da üç ana başlık altında ele alınmıştır. Birinci başlıkta mutlak ve mukayyedin durumları ve hükümlere delaletleri hakkında olup bunların tanımları, mutlakın mukayyede hamledilmesi ve bunlara bağlı olan hükümleri, mutlak ve mukayyedin has ile olan irtibatı ve netice olarak füru fıkhındaki ihtilaflar açısından bunlara terettüp eden hükümler ele alınmıştır. İkinci başlıkta, emrin mahiyeti ve fürua delaleti işlenmiştir. Bu minvalde emrin tanımı, kalıpları ve etkileri, kuralları, fevre ve ertelemenin cevazına delalet etmesi ve bunlara bağlı olarak füru fıkha etkisi ele alınmıştır. Üçüncü ve son başlıkta ise nehyin tanımı, sigası ve anlamları ele alınarak nehyin delaleti ve hükümlere etkisi ele alınmıştır. Daha sonra fevre ve devama delaleti, fesad ve butlanı gerektirmesi ve bu konuda mezheplerin ihtilafları, görüşleri ve bu ihtilafların füru fıkhındaki etkisi işlenmiştir. Sonuç kısmında ise bu araştırma neticesinde elde edilen çıkarımlar ve tavsiyeler beyan edilmiştir."
