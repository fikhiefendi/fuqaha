abstract: "Kripto paraların doğasını, özelliklerini, türlerini, işlevlerini, gelişimini ve finansal işlemlerde kullanılan teknikleri belirterek, ekonomistlerin ve merkez bankalarının avantajlarını, dezavantajlarını, risklerini ve görüşlerini izleyerek; Korona salgını, Ukrayna savaşı ve diğerleri gibi küresel kriz dönemlerinde faydalarını ve elektronik ticarette bir ödeme aracı olarak kullanılmalarını izleyerek ve ardından bu para birimlerini çevreleyen teknik ve gerçekçi konular hakkında bilgilendirdikten sonra onlar hakkında bir yargıya varmak için tüm bunları İslam ekonomistlerinin önüne koyarak tahmin etmeyi amaçlayan çalışma, ülkedeki tarihsel aşamalar boyunca para birimlerinin gelişimini tanımlamak için tümevarımcı yaklaşım kullanılmıştır. İslami; kripto para birimlerine ve Şeriat alimlerinin her aşamada onlarla nasıl başa çıktıklarına kadar; daha sonra hukukçunun tam bilgisine ve doğru içtihat kuralını inşa etmesini sağlayan bilgilere ulaşmak için tüm yönleriyle blok zinciri teknolojisinin incelenmesi; daha sonra bu para birimlerinin yerel, bölgesel ve küresel düzeyde geleceği ve İslam ekonomisinin onlarla kabul, ret veya nezaketle ne ölçüde etkileşime girdiği hakkındaki algıların geliştirilmesi ve çalışma bir dizi sonuca ulaştı, bunların en önemlisi: para biriminin ihraç edilmesinin devletin vazgeçilmemesi gereken doğal bir hakkı olduğu ve içtihat konseyleri tarafından verilen kararların çoğunun Bitcoin tek başına dijital para birimlerini değerlendirmek için bir model olarak kullanılırken, Ethereum ve Cardano gibi sonraki nesiller, yönetişimin esasını değiştiren ilk nesil Bitcoin'in sorunlarının çoğunu ele aldı. Bu nedenle çalışma, eyalet veya bölgesel düzeyde resmi bir dijital para birimi çıkarmanın gerekliliğini önerdi. Anahtar kelimeleri: Kripto Para Birimleri, Blockchain Teknolojisi, Maliye Politikası, Para Fonksiyonları."
