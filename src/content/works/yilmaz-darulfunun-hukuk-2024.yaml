abstract: "1916 yılında Dârülfünûn Hukuk Fakültesi yayınları arasında yerini alıp, Harf İnkılâbı'na kadar Osmanlıca olarak toplam 38 sayı yayımlanan Darülfünûn Hukuk Fakültesi Mecmuası bu çalışmanın odak noktasıdır. Çalışmada, mecmua tanıtılarak kapsamlı bir dizini oluşturulmuş ve dergide yer alan“Mecelle: Kitâbu'l-Buyû'”üzerine yazılan metinler incelenmiştir. Bu araştırma, söz konusu derginin akademik dünyadaki önemini ve hukuk literatürüne katkısını ortaya koymayı hedeflemektedir. Çalışmanın birinci bölümünde, Darülfünûn'un yayınlarından biri olan bu derginin çıkış amacı, içeriği ve biçim özellikleri detaylandırılmış, her sayıda yer alan yazılar taranarak kapsamlı bir dizin oluşturulmuştur. Bu tarama sürecinde derginin İslam Hukuku'nun farklı alanlarına dair birçok makale yayımladığı ve bazı yazarların modern hukuk normlarına yatkın olduğu gözlemlenmiştir. Bu durum, derginin sadece bir hukuk dergisi olarak, aynı zamanda İslam ve Batı hukuk sistemleri arasındaki entelektüel ve metodolojik etkileşimin bir yansıması olarak da incelenmesi gerekliliğini doğurmuştur. İkinci bölümde ise, dergide İslam Hukuku bağlamında yer alan makalelerden“Mecelle: Kitabü'l-Büyû'”odak noktası olarak seçilmiş ve bu başlık altında yazılan makaleler ayrıntılı bir incelemeye tabi tutulmuştur. Bu bağlamda, hem Osmanlı İmparatorluğu'nun ilk medeni kanunu olan Mecelle'nin yürürlüğe giriş ve yürürlükten kaldırılış dönemine tanıklık eden, Darülfünûn Hukuk Fakültesi hocalarının Mecelle Kitabü'l-Buyu üzerine kaleme aldıkları değerlendirmeler incelenmiştir. Çalışmanın amacı, Osmanlı dönemi akademik dergi kültürünün ilk örneklerinden olan bu dergiyi tanıtmak ve ilgili makaleler yoluyla İslam Hukuku ile Batı hukuk normları arasındaki karşılaştırmalı tartışmaların izini sürmektir. Derginin dizininin yapılmasıyla, o dönemin hukuk çevrelerindeki hararetli tartışmalara ışık tutularak mukayeseli hukuk çalışmaları yapmak isteyen araştırmacılara bu alanda rehberlik edilmesi hedeflenmiştir."
