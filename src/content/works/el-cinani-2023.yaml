abstract: "Bu tez, Yahya b. Abdullah Fahreddin er-Rûmî'nin (ö. 864) Ferâidü'l-leâlî isimli eserinden Tahâret ile şuf'a arasını tahkik etmeyi hedeflemektedir. Eser Hanefi fıkhına göre başlıklandırılmış, muhtasar bir fetva kitabıdır. Müellif eserinde insanların hükmünü her zaman bilmeye ihtiyaç duydukları konularla ilgili Hanefi alimlerin fetvalarını bir araya getirmiştir. Kendisi de fakih olan müellif, insanların başına az gelecek konularla ilgili garib ve nadir fetvaları da insanlara faydalı olacağını düşünerek yazmıştır. Bu sebeple eser tam bir fıkıh kitabı hüviyeti kazanmıştır. Eserde fetva nakledilen yüzün üzerinde kaynak mahtuttur. Hatta bazıları Müntekâ isimli kitapta olduğu gibi kayıptır. Müellifin yaşadığı dönem, zati ve ilmi hayatı, işlenirken betimleyici analitik yöntem kullanılmıştır. Metnin yazılması, harekelenmesi, nüshaların karşılaştırılması, nakledilen görüşlerin asli kaynaklardaki yerlerinin gösterilmesi, âyet, hadis ve fıkhi konuların tahrîcinde ise tahkik ve talik metodu kullanılmıştır. Araştırmada şu sonuçlara varılmıştır: Diğer Hanefî alimlerde olduğu gibi müellif de fıkhî konuları işlerken âyet ve hadisler yanında rey ve içtihada da yer vermiştir. Eser özellikle, namaz, zekât, oruç, hac, alışveriş, faiz, kira ve şuf'a konusunda olmak üzere Hanefî fetvalarıyla ilgili eserler arasında zikredilebilir. Fetvalar fıkhi başlıklar altında verildiği için İlim talipleri konuyla ilgili fetvalara kolayca ulaşarak; eserden rahatça istifade edebilirler. İhtilaflı konularda bürhan ve delile dayalı yapılan tercihlerden de fıkıh talebeleri faydalanabilirler. Eser mellifin fıkhî konularda ichitad etmedeki mahereti ile kendi görüşünü desteklemek için delil ve hüccetleri sunmadaki başarısına delalet etmektedir."
