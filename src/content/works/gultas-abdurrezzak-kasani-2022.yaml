abstract: "Abdürrezzâk Kâşânî İran merkezli bir Moğol devleti olan İlhanlılar'ın (1256-1353) hâkimiyeti döneminde yaşamıştır. Zamanının siyasî iradesiyle kurmuş olduğu iyi ilişkiler kendisinin ilgili mesele bağlamındaki tercihini yansıtması açısından dikkate değerdir. Kâşânî'nin bu tavrı çeşitli çevrelerden kaynaklanan eleştirilere sebep olmuşsa da kendisi bu tutumunun gerekçelerini ortaya koyan beyanlarda bulunmuştur. Genel olarak Arap Dili, Tefsir ve Tasavvuf alanlarındaki çalışmalarıyla temayüz eden Kâşânî'nin söz konusu disiplinler dâhilinde kaleme aldığı eserlerin önemli bir bölümü sonraki dönemlerde yaşamış olan âlimler tarafından müracaat kaynakları olarak kullanılmıştır. Tasavvuf alanında telif ettiği eserler içerisinde özellikle tasavvuf terimlerini konu edindiği sözlükler yanında Fuṣûṣu'l-ḥikem ve Menâzilü's-sâ'irîn şerhleri gibi metinler yazıldıkları dönemden itibaren onun alanda bir otorite olarak anılmasına vesile olmuştur. Kaleme aldığı Fuṣûṣu'l-ḥikem şerhi sebebiyle bir İbnü'l-Arabî takipçisi olarak şöhret bulan Kâşânî'nin Ekberî gelenek içerisindeki konumu tartışmaya açıktır."
