abstract: "Osmanlı Devleti'nin mahkeme kayıtları durumunda olan şer'iyye Sicilleri, Osmanlı'da yerel idare araştırmalarının birinci el kaynakları arasında yer almaktadır. Osmanlı Devletinin ve sosyal, iktisadî, askerî, kültürel alanda sürekli olarak başvurulan kaynaklar içerisinde gösterilmektedir. Defterler ait olduğu bölgenin sosyal, ekonomik ve tarihi gelişimini içermektedir. Ayrıca devletin merkezi devlet otoritesinin devamlılığı işleyişinde büyük önem taşımaktadır. Tutulan kayıtlarla devlet merkezden uzak yerel yöneticilerin kontrolünü de sağlayabilmektedir. İncelemiŞ olduğumuz 166 nolu defteri de bu açıdan incelemeye çalışarak Gaziantep ilinin 16.yüzyıldaki sosyal hayatını belgeler ışığında açıklamaya çalıştık. Ayrıca Osmanlı hukukunun genel yapısı, Kadı Mahkemelerinin işleyişi, Kadı sicillerinin tanımı, tarihi süreci, Şer'iyye mahkemelerinde görevli memurlar, kadılar, kadılarda aranan şartlar, Gaziantep?in tarihi ve defterimizde tespit edilen belgeler ve bu belgelerin değerlendirilmesi yer almaktadır."
