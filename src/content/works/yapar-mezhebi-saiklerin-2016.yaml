abstract: "Bu çalışma, Ettafeyyiş'in Himyân'uz-Zâd İla Dâri'l-Meâd adlı tefsirini incelemektedir. İbadî Mezhebi'ne mensup olan müellifin tefsir anlayışının ortaya çıkarılması amaçlanmıştır. Çalışma, müellifin, önceki müfessirlerin yöntemlerini takip etmekle birlikte kendi mezhebinin görüşlerini savunmak için ciddi çaba sarf ettiğini ve bu yönde yeni argümanlar geliştirdiğini göstermiştir. Yazar'ın muhalif olarak telaki ettiği görüşleri sert bir biçimde eleştirdiği belirlenmiştir."
