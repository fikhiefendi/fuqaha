abstract: "Türk ve İslam hukukunda sözleşme özgürlüğü kuraldır ve bu özgürlüğün çeşitli görünümleri vardır. Sözleşmenin içeriğini düzenleme özgürlüğü de bu görünümlerden birisidir. Her iki hukuk sisteminde de taraflar kural olarak sözleşmenin içeriğini belirlemekte özgürdür. Bu özgürlüğün sınırını ise emredici hükümlere, ahlaka, kamu düzenine, kişilik haklarına aykırılık ve imkansızlık oluşturur. Mukayeseli çalışmanın mahiyeti gereği sözleşmenin içeriğini düzenleme özgürlüğü ve sınırları incelenirken Türk Borçlar Kanunu'nun 27. maddesinde yer alan modern taksim esas alınmıştır. Çalışmamızın ilk bölümünde genel olarak sözleşme özgürlüğü kavramı, ikinci bölümünde ise içerik özgürlüğü ve bu özgürlüğün sınırları mukayeseli olarak ele alınmıştır. Son bölümde ise her iki hukuk sisteminde sözleşmelere uygulanan yaptırımlar ve içerik özgürlüğünün sınırlarının ihlalinin yaptırımına yer verilmiştir. Bunun sonucunda hukuk sistemlerinin insanlar arası ilişkileri düzenlemesi sebebiyle değişime ve gelişime açık olduğu ve benzer düzenlemelere sahip olduğu sonucuna ulaşılmıştır."
