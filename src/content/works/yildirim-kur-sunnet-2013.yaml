abstract: "Bu çalışmanın amacı, Kuran ve Sünnet bütünlüğü içerisinde Kur?an?da cezanın amacının neler olduğunu tespit etmeye çalışmaktır. Konu her ne kadar ?Kur?an ve Sünnet? çerçevesinde ele alınmış olsa da, tabii olarak çalışmanın ilgili yerlerinde İslam Hukuku ve Batı Hukuku?nda ne şekilde değerlendirildiğine de yer verilmiştir. Temel olarak bu çalışma, giriş ve sonuç dışında üç bölümden oluşmaktadır.İlk bölümde, cezanın tanımı, tarihi, İslam hukukuna göre cezaların tasnifi ve Kur?an?da cezanın özelliklerinin neler olduğu konuları yer almaktadır. ?Kur?an ve Sünnet?te, İslam Hukuku?nda ve Batı Kaynaklı Hukukta Cezanın Amacı ? başlıklı ikinci bölümde, Kur?an?ın dünya ve ahiret hayatında cezalandırma için ne gibi amaçlar gözettiği konusu ele alınmış, suçtan etkilenen taraflar olan fail, mağdur ve toplum için cezada hangi amaçların gözetildiği konularına yer verilmiştir. Ardından İslam hukukunda ve batı kaynaklı hukukta cezanın amacını açıklayan akımlar ve düşünürlerin görüşlerine yer verilmiştir. ?Kur?an ve Sünnet?te Yer Alan Örnek Suç Türlerinde Cezanın Amacı? başlıklı üçüncü bölümde Kur?an-ı Kerim?de örnek olarak zikredilen cezalarda ne gibi amaçların gözetildiği konusu verilmiş ve birinci bölümde tespit edilen ?cezanın özellikleri? dikkate alınarak kritik edilmiştir. Sonuç bölümünde ise, çalışma neticesinde ulaşılan tespitlere ve önerilere yer verilmiştir."
