abstract: "Şer'iyye Sicilleri Osmanlı Devleti'nde merkez ve taşrada her tabakadan insanlar arasında vukû bulan hukuki ilişkilere dair kayıtları içermektedir. Bu belgeler, Osmanlı hayatında aile, toplum, ekenomi ve hukuk gibi pek çok alanı kapsamakta olup bu alanlarla ilgili tarihe ışık tutan en önemli kaynaklardandır. Şer'iyye Sicilleri yerel tarih çalışmaları çin birinci dereceden önemli başvuru kaynakları olarak kabul edilmekte olup Osmanlı mahkemelerince kaydedilen bu kıymetli belgeler kaleme alındıkları dönem ve bölge ile ilgili geniş ve önemli blgiler içermektedir. Çalışmamız H.1012-1014/M.1603-1605 tarihlerini kapsayan Gaziantep'te kaydedilen şer'i mahkeme kayıtlarını ihtiva etmektedir. Defter şeklinde tutulmuş olan bu kayıtlar transkripsyonu yapıldıktan sonra tasnif ve tenkit süzgecinden geçirilerek değerlendirmeye tabi tutulmuştur. Defterin konu dağılımı genel olarak miras, nafaka, vasi tayini, evlenme-boşanma, alacak-verecek, icare gibi hukuki içerikli belgelerden meydana gelmektedir. Bu araştırmanın sonucunda Gaziantep 10 Numaralı Şer'iyye Sicili Defterinden yola çıkarak dönemin Gaziantep'inin idari, sosyal, kültürel, ekonomik durumu hakkında önemli bilgiler elde edilmiştir. Transkripsiyonu yapılan belgelerin konuları, içerikleri, hicri-miladi tarihleri ve belgelere ait kısa özetleri her belge için açık bir şekilde yazılarak okuyucuya kolaylık sağlanmıştır."
