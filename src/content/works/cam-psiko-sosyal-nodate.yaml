abstract: "Fıkhî ahkâmın inşâı, süreç içerisinde, yatay ve dikey ilişkiler neticesi ilâhî irâdeyle beraber sosyal bir varlık olan insan tarafından farklı zaman ve mekân dilimlerinde meydana getirilmiş ve ahkâmda ekol, siyâset, iktisâd gibi beşerî ve içtimâî unsurlar da etkili olmuştur. Bir Müslümanın ibâdet hayatından bireysel ve toplumsal ilişkilerine kadar hayatının her aşamasında yaşamına rehberlik eden fıkıh ilminin verdiği hükümler arasında dînin asılları olan Kur'ân ve Sünnetten gelen ana ilkeler olduğu gibi târihi süreçte bu bilgiler üzerine inşâ edilmiş yorumlar, kültürel öğeler ve toplumun ortak aklının ürünü sonuçlar da vardır. Bu gerekçe ve gerçeklik ekseninde, son tahlilde fıkhî ahkâmın inşâında psiko-sosyal gerçekliğin tek başına olmasa da büyük oranda belirleyici olduğunu; İslâm Hukûkunu, ilâhî irâdeye uygun hükmü bulmak, ideali yakalamak, insan ve toplumun yararını temin etmek için metafizik ve fizik âlemin naklî ve aklî verileri doğrultusunda târihi süreç içerisinde meydana getirilmiş normlar bütünü olarak tanımlamanın daha isâbetli olacağını tespit ettik."
