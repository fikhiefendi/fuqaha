abstract: "Sosyal bilimlerde herhangi bir kavramı; kavramın oluştuğu kültür havzasından, semantikten, ekonomik, sosyal ve dinî temellerinden bağımsız incelemek, anakronizm ve“eş mekânlılık”problemini beraberinde getirecektir. Her kavram, ancak kendi sosyal yapı içerisinde tam bir karşılık bulabilir. Kavramın ortaya çıktığı ortamın göz ardı edilmesiyle ortaya çıkacak anakronizm ve“eş mekânlılık”yanılgısı;“kavramı”taşıdığı reel gerçeklikten soyutlayarak bir başka kültür havzasına taşıyacaktır. Bu yanılgı beraberinde eklektik bir düşünceyi getirecektir. Kapitalist iktisat ile İslam iktisat teorisini anlamak; başta bu teorilerin teşekkül ettiği kültür havzası, sosyal ve siyasal ortamın analiz edilmesini gerektirir. Her iki iktisadi teori kendi paradigmaları içerisinde anlamlı bir bütünün parçası olarak görülebilir. Çalışma boyunca kapitalist iktisadın ve İslam iktisadının teorik zemini, toplumsal yapılanmadaki rolü ve süreci kendi paradigmaları içerisinde anlatılmaya çalışıldı."
