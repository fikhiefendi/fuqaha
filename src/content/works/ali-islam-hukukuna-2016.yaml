abstract: "Tacir ve diğerlerinin borçlu durumdayken malları ve ticaretleri konusunda iflasla karşılaşmaları normal bir durumdur. Buna karşın kimi hallerde iflas, suç sayılmaktadır. O da; borçlunun iflas ettiği görüntüsünü verip bununla hak sahiplerinin borçlarını almaya engel olmak. Bu, insanların malları ve kişisel haklarına karşı işlenen bir suçtur. Bu çalışmada hileli iflas beyanlarının hakikati, hükmü ve İslam Hukuku ile 1969 tarihli 111 sayılı Irak Ceza Kanunu'nda verilen cezalar işlenecektir. Bu çalışmada hileli iflasın tanımı, karşılaştırmalı kanunda ve Irak iflas sistemi tarihi konularına değinilmektedir. Daha sonra Kanun ve Şerîat konularını, ortak ve ayrıştıkları noktalara temas edilmektedir. Aralarında tercih yapmak suretiyle konu hakkında dört mezhep âlimlerin görüşlerine de müracaat edip Kur'an ve Sünnet ışığında hileli iflasın hükmü ve verilen ceza, kişi veya şirket düzeyinde yapılan hileli iflasın şartları, verilecek cezayı ve Irak Ceza Kanunu'na göre taksirli davrananların hükmü açıklanmaktadır. Bu çalışmadaki amacımız, İslam Hukuku'nda hileli iflasla ilgili esasların caydırıcılık bakımından kanunda belirtilen cezalardan daya isabetli ve dah sağlam olduğunu ortaya çıkartmaktır. Bu da hileli iflas sonucunda insanlar arasında çıkan ihtilaf ve tartışmaları sonlandırmada daha olumlu sonuçlar doğuracaktır. Son olarak çalışma, sonuç ve bazı tavsiyelerle tamamlanmaktadır."
