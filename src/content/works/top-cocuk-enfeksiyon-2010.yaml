abstract: "Bu çalışmanın amacı Ondokuz Mayıs Üniversitesi Tıp Fakültesi Çocuk Enfeksiyon servisinde KKKA tanısıyla izlenen hastaların epidemiyolojik, demografik, klinik ve laboratuar özellikleri ve sonuçlarının değerlendirilmesidir.Mayıs 2008-Eylül 2009 tarihleri arasında KKKA tanısı olan hastaların tıbbi kayıtları geriye dönük olarak incelendi. Hastaların epidemiyolojik, demografik ve klinik özellikleri ve laboratuar verileri, tedavi şekilleri ve sonuçları dosyalardan kaydedildi.Mayıs 2008-Eylül 2009 arasında KKKA tanılı 39 hasta tespit edildi. Hastaların ortalama yaşı 131.69±57.74 ay idi. Hastaların %48.7'si Samsun'dan ve %79.5'i kırsal kesimden geliyordu. En çok başvuru Haziran ayında (15, %38.5) idi. Hastaların %89.7'inde kene ısırığı öyküsü vardı. Kene ısırması ve hastaların semptomlarının başlaması arasındaki geçen süre ortalama 3.03±1.89 gün ve semptomların başlaması ile hastanemize başvuru arasında geçen süre 3.32±2.55 gün idi. Hastaneye başvuru esnasında başlıca semptomlar ateş (%97.4), kusma (%56.4), halsizlik (%38.5), başağrısı (%35.9), bulantı (%35.9), ishal (%23.1), karın ağrısı (%17.9), kanama (%17.9, burun kanaması, GİS kanama, dişeti kanaması ve vajinal kanama) ve ciltte döküntü (%15.4) idi. Hastaneye başvuru esnasında hastaların %66.7'sinde trombositopeni, %61.5'inde yüksek AST, %51.3'ünde lökopeni, %38.5'inde yüksek INR, %35.9'unda yüksek CPK, %28.2'sinde yüksek ALT ve uzamış PT, %25.6'sında uzamış PTT ve %17.9'unda lökositoz saptandı. Hastaların %69'u ribavirin tedavisi aldı. Ribavirin tedavisi alan hastaların hastaneye başvuru anındaki ortalama lökosit ve trombosit sayıları ribavirin tedavisi almayanlara göre anlamlı düşük, AST ve ALT değerleri anlamlı yüksek idi. Klinik takip esnasında hastaların %20.5'inde hipotansiyon ve %38.5'unda disritmi (bradikardi, inkomplet sağ dal bloğu) tespit edildi. Kardiyovasküler değişiklikler yalnız ribavirin tedavisi alan hastalarda saptandı. Kırım Kongo Kanamalı Ateşli çocukların % 2.5'i kaybedildi.Sonuç olarak, KKKA klinik bulguları çocuklarda erişkinlere benzerdir ve KKKA çocuklarda daha benign seyirlidir. Kırım Kongo Kanamalı Ateşli çocuk hastalarda kardiyovasküler değişiklikler sık görülmektedir ve bu bulgular özellikle ribavirin tedavisi alan hastalarda görüldüğü için ribavirin tedavisi alan hastaların kardiyak yan etkileri açısından yakın takibi uygundur."
