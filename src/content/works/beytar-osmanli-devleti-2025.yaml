abstract: "Osmanlı Devleti'nde vakıflar, toplumun dini, sosyal ve ekonomik yapısının temel taşlarından birini oluşturmuştur. Bu çalışma, vakıfların dini, sosyal ve ekonomik boyutlarını inceleyerek, Osmanlı toplumunda oynadıkları kritik rolleri ortaya koymayı amaçlamaktadır. Dini boyutta vakıflar, cami, medrese, tekke gibi ibadet ve eğitim yerlerinin inşası ve bakımı ile dinin yayılması ve manevi değerlerin korunmasında önemli bir rol üstlenmiştir. Sosyal boyutta ise vakıflar; fakirler, yetimler, dullar ve diğer ihtiyaç sahiplerine yardım sağlayarak sosyal adaletin tesis edilmesine katkıda bulunmuş, toplumsal dayanışmayı ve barışı güçlendirmiştir. Ekonomik boyutta vakıflar; tarım arazileri, ticaret hanları, hamamlar gibi mülklerden elde edilen gelirlerle hem vakıf hizmetlerinin sürdürülebilirliğini sağlamış hem de Osmanlı ekonomisine canlılık kazandırmıştır. Bu çalışma, Osmanlı Devleti'ndeki vakıfların özellikle sosyo-ekonomik boyutuna odaklanıp Fatih ve Süleymaniye Külliyeleri örneğinden hareketle karşılaştırmalı bir analiz sunmayı amaçlamaktadır. Bu doğrultuda çalışmanın temel amacı, Osmanlı Devleti'ndeki vakıf kurumunun toplumsal ve ekonomik hayat üzerindeki etkilerini tarihsel ve analitik bir bakışa tabi tutmaktır. Bu çerçevede çalışmanın amacını daha net ortaya koyabilmek amacıyla Osmanlı Devleti'nin sosyo-ekonomik olarak en görkemli dönemi olarak kabul edilen on beşinci ve on altıncı yüzyıllar ele alınmıştır. Ardından iki külliye seçilerek çalışmanın kapsamı hem dönem hem de külliye örnekleri anlamında daraltılmıştır. Karşılaştırmalı analiz yöntemi kullanılarak yürütülen çalışmada Fatih ve Süleymaniye Külliyelerinin vakıf belgeleri, yapısal özellikleri, hizmet alanları ve toplumsal etkileri incelenmiştir. Çalışma sonucunda her iki külliyenin de inşa edildikleri dönemlerin şartlarını ve sultanların vizyonunu yansıtarak Osmanlı toplumunun sosyal, ekonomik ve dini yapısının bir özeti niteliğinde olduğu görülmektedir. Fatih Külliyesi, Osmanlı Devleti'nin kuruluş dönemi ideallerinin önemli bir temsili olarak öne çıkmakta olup toplumsal dayanışma, eğitim ve dini hizmetlerin entegrasyonu ile inşa edilmiştir. Süleymaniye Külliyesi ise Osmanlı'nın altın çağı olarak kabul edilen Kanuni Sultan Süleyman döneminin siyasi ve kültürel kudretini simgelemekte olup sadece bir dini merkez olmanın ötesine geçerek bilimi, sanatı ve toplumsal hizmetleri bir arada sunan bir kompleks olarak tasarlanırken Osmanlı'nın evrensel vizyonunu yansıtmıştır."
