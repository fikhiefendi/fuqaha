abstract: "İnsanlık tarihinin her döneminde, aile içi huzursuzlukların hangi şekillerde vuku bulduğunu anlamak, çözüm sunmak için önemlidir. Nüşûz, İslam aile düzeninde karı-koca arasında yaşanabilecek huzursuzluk ve sorunları ifade eden bir kavram olarak kullanılmıştır. Nüşûz ve diğer ilişkili kavramların Kur'an-ı Kerim'de zikredilmiş olması meselenin ehemmiyetini göstermektedir. Bu çalışmada aile içi huzursuzluklara neden olabilecek durumlar tespit edilmeye çalışılmış; nüşûz, şikâk, irâz kavramları incelenmiş ve bu kavramların hangi durumları tanımlamada kullanıldığı ve hukuki alana yansımaları tespit edilmeye çalışılmıştır. Kavramların pratikte nasıl işlendiği ve yansımalarının Diyarbakır Şer'iyye Sicilleri'nde yer alıp almadığı araştırılmıştır. Karı-koca arasında nüşûz vuku bulduğu zaman sunulan çözüm önerileri ve hukuki sonuçları incelenmiştir. Tezde sırasıyla; İslam'da Aile içi hak ve sorumluluklar, Aile içi huzursuzluk olarak tabir edilen nüşûz ve ilgili kavramlar araştırılmış, varsa şer'iyye sicillerinden elde edilen veriler sunulmuştur. Ayrıca günümüz türkçesi ile daha kolay anlaşılması için çaba sarf edilmiştir. Karı-kocanın nüşûzunun çözümü ve hukuki sonuçları incelenmiş bu bağlamda Şer'iyye sicillerinden örneklendirme yapılmıştır."
