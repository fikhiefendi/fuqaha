abstract: "ÖZET Osmanlı son dönem müelliflerinden Ali Nurettin Efendi, hem insanların dini bilgiye kolay ulaşmasını sağlamak hem de kendisinin gelecekte hayırla anılması maksadıyla ve çevresindeki ilim insanlarının da teşviki ile bir ilmihal eseri kaleme almış ve bu esere“Envâru'l-Hamîd Fî Fıkhi Ehli't-Tevhîd”adını vermiştir. Bu eser yaklaşık iki yılda tamamlanmış ve üç ciltten oluşmaktadır. Eserin muhtevası \"taharet, namaz, zekât, oruç, hac, nikâh, talak ile kerahiyye ve istihsan olmak üzere sekiz bölümdür. Bu çalışmanın giriş bölümünde çalışmanın konusu-önemi ve amaç-yöntemi belirtildikten sonra birinci bölümde Ali Nureddin Efendi'nin hayatı ve eserleri hakkında bilgi verilecek ve mezkûr eser tanıtılacaktır. İkinci bölümde ise eserin aile hukuku bölümünü oluşturan nikâh ve talak konuları günümüz Türkçesiyle sadeleştirilecek ve günümüz akademik çalışmalarına uygun bir şekilde referanslaştırılarak eserde verilen bilgilerin kaynakları tespit edilecektir. Ayrıca gerek görüldüğü yerde dipnotlarla konulara açıklık getirilmeye çalışılacaktır."
