abstract: "Tezimizde Hanefî mezhebinin dört temel metninden biri olan Mevsılî'nin el-Muhtâr li'l-fetvâ isimli eseri üzerine yine kendisinin şerh olarak yazdığı, medreselerde asırlardır okutulan ve topluma yön veren el-İhtiyâr li-taʽlîli'l-Muhtâr adlı eserindeki“Nikâh”bölümünde yapmış olduğu sosyolojik değerlendirmeleri incelenmiştir. Tezimiz toplam üç bölümden oluşmaktadır. Giriş mahiyetindeki birinci bölümde tezin konusu, nedenselliği, amacı, önemi ve yöntemi; ikinci bölümde Mevsılî'nin hayatı, ilmî kişiliği, hocaları ve talebeleri, yaşadığı çevre ve eserleri ele alınmıştır. Üçüncü bölümde Mevsılî'nin ve görüşlerini naklettiği fakihlerin nikâha ilişkin sosyolojik değerlendirmeleri, bir fakih olarak yaşamış olduğu dönemde gündeme gelen nikâhla ilgili meseleler karşısında naslara bakış açısını, naslarda doğrudan yer almayan meselelerde yapmış olduğu değerlendirmeleri incelenmiştir. Bu incelemenin sonucunda elde ettiğimiz verilerden yola çıkarak Mevsılî'nin ve görüşlerini yansıttığı fakihlerin naslarda yer alan ve onlarda yer almayıp içtihatlarla tespit edilen nikâhla ilgili hükümlerde yaptıkları sosyolojik sayılabilecek değerlendirmeleri ortaya çıkarılmaya ve yorumlanmaya çalışılmıştır. Sonuç bölümünde de ulaştığımız sonuçlar ele alınmıştır."
