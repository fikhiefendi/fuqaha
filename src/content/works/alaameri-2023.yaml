abstract: "Evlenme, dini vecibelerin en önde gelen şartlarından biridir. Cenâb-ı Hak, nikâh akdinin büyük öneminden dolayı, nikâh akdi için bazı şartlar koymuş, nikâh akdi olmazsa evlilik yapılamaz ve bu şartların en önemlilerinden biri de şahitliktir. Bu araştırma, nikâh akdinde gayrimüslim şahidin şahitliği konusuna İslam hukukunun bakış açısını ve bunu destekleyen ve karşı çıkan en belirgin mezhepleri tanımlamakla birlikte, destekleyenlerin veya karşı çıkanların delillerini araştırıp bu konuyla ilgili diğer hükümleri belirtmekle birlikte ortaya koymayı amaçlamaktadır. Bu konuda fıkıhçıların söylemleri okunarak, tümevarım yöntemi esas alınıp, bu söylemlerin analizi yoluyla analitik yaklaşıma dayanılmıştır. Fıkıhçıların her biri kendi mezhebine göre ele aldığı en önemli konular olarak, evlilik akdinde kabul edilmesi konusuna ilişkin genel görüşlerinin belirlenmesi ve şahitte bulunması gereken şart ve koşulları formüle ederken dayandıkları görüş ve delilleri analiz etmek tartışılmıştır. Sonra da evlilik akdinde gayrimüslimlerin şahitliği olan araştırma konusu ile ilgili görüş ve iddiaları yansıtarak genel hayatta geçerli olacak bir sonuca varılmıştır.Araştırma sonucunda, kişilerin haklarının korunması, ihtilafların ortaya çıkmadan önlenmesi ve meydana gelmesi halinde ortadan kaldırılmasının, düşerse yükseltmek, İslam fıkhında şahitliğin en önemli gayesi olup, şahitlik konusunda kısmi bir titizlik gösterildiğinde bu maksatları hatırlamak gerekir. Fıkıhçıların çoğunluğu, nikâh akdinde şahitliğin Müslümanın görevlerinden biri olduğu görüşündedir. Prensip olarak Müslüman evlilik akdinde bir gayrimüslimin şahitliği kabul edilmez, ancak şartlı olarak şahitliğinin kabul edilebileceği durumlar vardır. Gayrimüslimlerin şahitliklerini birileri için kabul etme konusuna gelince, araştırma bunu ele almış ve diğer gayrimüslimler aleyhine onların şahitliklerini mutlak suretle kabul etmek ile her milletin kendi milletine has şahitliklerini kabul edip diğerleri arasında ayrım yapmaktır."
