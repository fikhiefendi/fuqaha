abstract: "Tezimizin konusu İslam hukukuna göre zaruret halinin mali işlemlere olan etkisidir. Maslahatın uygulanması ve ihtiyaçların karşılanması çerçevesinde merkezi bir rol oynayan zaruret kavramı, bireyin can veya organlarının tehlikeye girmesi durumunda hakiki, çeşitli ihtiyaçların karşılanması anlamında da mecazen kullanılır. Hem bireysel hem de toplumsal boyutları bulunan zaruret, hakiki anlamda şer'î delillerin aksine hareket etme ruhsatı verirken, mecazi anlamda İslam hukukunun genel kurallarının dışına çıkma ruhsatı tanır. Çalışmamız giriş ve üç bölümden oluşmaktadır. Girişte çalışmamızın amacı ortaya konularak daha önce bu konuda yapılan çalışmalara işaret edilmiştir. Birinci bölümde zaruret kavramının tanımı ve hükümlere etkisi ele alınmıştır. İkinci bölümde mali işlemler kavramı ve onunla ilgili hüküm ve kaideleri tesbit edilerek klasik dönemde zaruret halinin mali işlemlerin rükün ve şartlarına etkisi incelenmiştir. Üçüncü bölümde ise zaruretin günümüzdeki mali işlemlere yansıması bağlamında alt başlık olarak genel kaidelere ve şer'i delillere aykırı olan bazı işlemlere etkisi örneklerle ele alınmıştır. Çalışmamız ulaştığımız sonuçların özetlenmesiyle nihayete erdirilmiştir. Zaruret, ihtiyacın derecesine bağlı olarak hükümleri etkiler. Hakiki zarurette, esasen haram olan hükümler etkilenebilirken, mecazi zarurette yalnızca \"başkaları için haram\" olan hükümler etkilenir. İlk anlamda zaruretin etkisi geçici hükümlere bağlı olup, ihtiyacın sona ermesiyle birlikte hüküm de sona erer. Umumi zaruretler sabit kabul edilir ve ihtiyacın ortadan kalkmasıyla da devam eder. Zaruretin her iki anlamda incelenmesi farklı sonuçlar doğurur. Dolayısıyla, mali işlemleri etkileyen zaruretlerin hem hususi hem de umumi anlamda ele alınması gerekir. Amacımız, İslam hukukunun zaruret kavramını ve bu kavramın mali işlemlere etkisini ele alarak bu konuda daha geniş bir vizyon sunmaktır. Umuyoruz çalışmamız, bu konuda bir perspektif sunacak ve İslam hukukunun zaruretle ilgili görüşlerinin daha iyi anlaşılmasına katkıda bulunacaktır."
