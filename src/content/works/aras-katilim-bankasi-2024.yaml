abstract: "Bu araştırma, Katılım Bankalarından hizmet alan müşterilerin yatırım fonlarına yönelik algılarını incelemeyi hedeflemektedir. Araştırmanın odak noktaları arasında geleneksel ve faizsiz yatırım fonları ile Katılım Bankası müşterilerinin yatırım tercihleri bulunmaktadır. Geleneksel ve faizsiz fonlar arasındaki temel farklar ve avantajlar, literatür taramasıyla detaylı bir şekilde ele alınmıştır. Ayrıca, katılım bankası müşterilerinin yatırım tercihlerini etkileyen faktörler, literatür taraması çerçevesinde değerlendirilmiştir. Araştırma kapsamında, 114 katılımcıya 21 soruluk bir anket uygulanmıştır. Anket, katılımcıların demografik bilgileri, katılım bankaları ile çalışma süreleri, yatırım tercihleri, risk algıları ve katılım bankasının sunmuş olduğu faizsiz yatırım araçlarına karşı tutumlarını ölçmeyi amaçlamıştır. Elde edilen veriler, katılım bankası müşterilerinin yatırım fonlarına ilişkin algılarını derinlemesine incelemek için kullanılmıştır. Bu analiz, katılım bankasının sunduğu faizsiz yatırım fonlarının müşteriler arasındaki kabul edilme düzeyini ve bu fonlara olan talebi anlamak için önemli ipuçları sunmuştur. Sonuçlar, katılım bankası müşterilerinin yatırım tercihlerini şekillendiren faktörler, yatırım süreleri, getiri beklentileri ve faizsiz yatırım araçlarının yatırımcılar üzerinde oluşturduğu algının önemini vurgulamaktadır."
