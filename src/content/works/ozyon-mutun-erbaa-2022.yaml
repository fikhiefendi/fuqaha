abstract: "\"Mütûn-i Erbaa'dan Mecmaʿu'l-bahreyn ve Mülteka'n-neyyireyn'de İmam Züfer'e Nispet Edilen Görüşlerin Tahkiki konulu bu çalışmamız; özelde Hanefi mezhebinde muteber metin kitapları(Mütûn-i Erbaa)'ndan Mecmaʿu'l-bahreyn ve Mülteka'n-neyyireyn'nin ibâdet ve muâmelât bölümlerinde İmam Züfer'e nispet edilen görüşlerin tahkiki, genel olarak da Hanefi mezhebi müntesiplerinin ilmi birikimlerininnesilden nesile sıhhatli bir şekilde aktarılmasının tesbitine yönelik bir gayenin neticesidir. Buna binaen çalışmamız, bir giriş ve üç bölümden oluşmaktadır: Giriş bölümünü çalışmamızın konusu, önemi, araştırmanın amacı, araştırmanın yönteminin açıklanması ve literatür değerlendirmesi oluşturmuştur. Birinci bölümüde ise, görüşleri çalışmamızın konusu olan İmam Züfer'in hayatı, ilmi kişiliği ve eserleri hakkında bilgi vermeye çalıştık. İkinci bölümde Muzafferuddîn İbnü's-Sââtî, Hanefî Fıkıh Metinleri ve Mütûn-i Erbaa hakkında tafsilatlı bir şekilde (özellikleri, müellifleri…gibi) bilgi vermeye gayret ettik. Üçüncü bölümde Mecmaʿu'l-bahreyn ve Mülteka'n-neyyireyn'de ibadet ve muâmelat bölümlerinde İmam Züfer'e nispet edilen görüşleri incelemeye çalıştık. Sonuç bölümünde de çalışmamızdan elde edilen sonuçların değerlendirmesini yaparak çalışmamızı sonlandırdık"
