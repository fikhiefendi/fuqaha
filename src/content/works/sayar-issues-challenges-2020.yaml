abstract: "Bu çalışmanın temel amacı, Türkiye'de katılım bankacılığının karşılaştığı sorunların ve zorlukların ampirik analizini yapmaktır. Çalışma, katılım bankacılığının finans sektöründe daha da büyümesini engelleyen faktörler üzerinde yoğunlaşmıştır. Bu faktörler, yasal ve düzenleyici çerçeve, yönetim, dini/fıkhî problemler, sektörel sorunlar, toplum perspektifi ve riskler olmak üzere altı başlık altında toplanmıştır. Birincil veriler çalışmada yapılan anket ile toplanmış, istatistiksel bir program ile analiz edilmiştir. Katılım bankacılığına ait ikincil veriler otorite kurumlardan elde edilmiştir. Çalışma kapsamında bulunan anket çalışmasının katılımcıları Türkiye'de faaliyet gösteren katılım bankalarının çalışanlarından oluşmaktadır. Bu anket ile katılım bankacılığının karşılaştığı sorunların doğrudan katılım bankaları çalışanlarının bakış açısıyla sunulması hedeflenmiştir. Anket sonuçlarına göre, Türkiye'de katılım bankacılığı henüz beklenen potansiyele ulaşmamıştır. Yasal ve düzenleyici çerçeve için katılım bankacılığının önünü açacak düzenlemelere ihtiyaç olduğu ortaya çıkmıştır. Yönetim sorunları içinde, geleneksel bankacılık ile benzerlik ve finansal sistemdeki rekabet katılım bankacılığının gelişimini yavaşlatan önemli etkenler olduğu belirtilmiştir. Katılım bankacılığının yapısı nedeniyle Şer'i yönetim çerçevesinde standartların ve merkezi denetim eksikliği öne çıkmıştır. Sektörel problemlerin başında geniş ürün yelpazesi, eğitimli insan kaynağı ve tamamlayıcı finans kurumlarının eksikliği gelmektedir. Toplum algısı içerisinde, olumsuz itibarla birlikte finansal sistemin önemli bir paydaşı olan müşteri tarafında katılım bankacılığı sistemine yönelik bilgi eksikliği olduğu sonucuna varılmıştır. Katılım bankalarının karşılaştığı riskler değerlendirildiğinde ilk üç riskin; (1) geri dönüş riski, (2) borca dayalı sözleşmelerde kredi riski ve (3) likidite riski olduğu ortaya konmuştur."
