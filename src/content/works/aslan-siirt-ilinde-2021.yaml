abstract: "Katılım Bankacılığı günümüzde ekonomi içindeki payının artması nedeniyle daha fazla çalışmaya konu olmaya başlamıştır. Bu çalışmada, Türkiye'de faaliyet gösteren katılım bankacılığının ortaya çıkışının hangi etkenlerle gerçekleştiği, katılım bankacılığının gelişiminde ve ilerlemesinde etkili olan faktörler, Türkiye'deki faaliyetlerinde hangi yöntem ve tekniklerin kullanıldığı incelenmiştir. Bu tür incelemeler yapılırken aynı zamanda katılım bankacılığının faaliyet türlerinin ne olduğu, ülke ekonomisine olan katkıları ve bu katkıların ne seviyede olduğu, katılım bankacılığının kendi içerisinde ne tür faaliyet alanlarına sahip olduğu ve bu alanlarda ne tür ilerlemeler kaydedildiği bu çalışmada incelenen başlıklar arasındadır. Çalışmada ayrıca katılım bankacılığının İslam ülkeleriyle olan ilişkileri güçlendirmek amacıyla çeşitli etkenlerin de katkısıyla Türkiye'de faaliyet göstermeye başlaması ve sonrasında ülke ekonomisi için önemli bir yer edinmesi, bu sürecin tarihsel ve kanuni yönleri de incelenmiştir. Katılım Bankacılığının önemi ve günümüzdeki yeri, diğer bankacılık türleriyle karşılaştırılması üzerine de çeşitli incelemeler yapılmış olup, katılım bankacılığına dair potansiyel sorunlar ve çözümler üzerine de aynı zamanda incelemeler yapılmıştır. Çalışmanın son bölümünde Siirt ilinde katılım bankacılığına yönelik algının ve bilgi düzeyinin tespit edilmesi sorunların ortaya konulması ve çözüm önerileri getirilmesi amacıyla derinlemesine görüşme tekniğiyle bir saha araştırması yapılmıştır."
