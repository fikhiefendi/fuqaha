abstract: "Hanefîler, mezhebin teşekkül ettiği ilk devirlerden itibaren, sahih hadisleri terk edip zayıf hadislerle amel etmeleri ve re'y ile kıyası hadislere tercih etmeleriyle itham edilmişlerdir. Hanefîlerin, Kur'an'dan sonra en sahih kitap olarak kabul edilen Sahîh-i Buhârî'de yer alan hadislerle amel etmemiş olmaları, bu ithamların başında gelmiş ve onlar için ciddi bir tenkit sebebi olmuştur. Bu tenkitlere ilk muhatap kalındığından beri, bazı Hanefî âlimler, ithamların geçersizliğini ispatlamak sadedinde bütün gayretleriyle mezheplerini müdafaa etmeye çalışmışlardır. Bu âlimlerden biri de, hem hadis hem de fıkıh alanında temâyüz eden, ömründe iki kez Hanefî başkadılığı yapmış olan Aynî'dir. Aynî, Sahîh-i Buhârî'ye, Umdetü'l-kârî adını verdiği oldukça hacimli bir şerh yazmış ve burada hadisleri çok yönlü olarak değerlendirmiştir. Baştan sona Hanefî bakış açısının hâkim olduğu bu şerhte, Aynî, Hanefîlerin amel etmedikleri hadislerin yorumuna ayrı bir önem atfetmiş ve Hanefîlerin söz konusu hadislerle amel etmemelerinin haklı gerekçeleri olduğunu ifade ederek geniş izahlarda bulunmuştur. Çalışmanın birinci bölümünde Aynî'nin hayatı, ilmî kişiliği ve eserleri takdim edilmiş, akabinde de çalışmanın fıkhî yönünün daha rahat anlaşılabilmesi amaçlanarak Hanefîlerin hadis metodolojisine kısa ve açıklayıcı bir şekilde yer verilmiştir. Çalışmanın esasını teşkil eden ikinci bölümde ise Aynî'nin, Hanefîlerin amel etmedikleri Buhârî hadislerini yorumlama yöntemi üzerinde durulmuştur. Bu bağlamda Aynî'nin yorumları çerçevesinde, Hanefîlerin hadis istidlâllerinde bazı kriterleri gözettikleri ve ilgili hadisleri de bunlara uymadığı gerekçesiyle terk ettikleri müşahede edilmiştir. Söz konusu kriterler, çalışmada başlıklar hâlinde sunulmuş ve bu ölçütlerle değerlendirilen hadisler ilgili başlığın altında incelenmiştir. Neticede Hanefîlerin, amel etmedikleri Buhârî hadislerinin çoğuna mukabil, kendi kriterlerine uyan başka hadislerle amel ettikleri tespit edilmiştir. Bununla birlikte, Hanefîlerin fıkhî hükümlerinde hadislere gereğince yer vermedikleri yönündeki eleştirilerin, haksız yargılamalar olduğu sonucuna ulaşılmıştır."
