abstract: "Hadis ilimleri, ilk asırdan günümüze dek üzerinde en fazla mesai harcanan ilmî faaliyet alanlarından biridir. Hadis ilimleri açısından hadislerin sıhhatini belirleyen metodolojinin bilinmesi önem arz etmektedir. Bu metodolojiyi ortaya koyup geliştiren Sünnî hadis alimleri olmakla birlikte geç dönemlerde Şîa'nın da bunu örnek alarak bir metodoloji geliştirdikleri görülmektedir. Sünnîlerin dışında İslam toplumunun en büyük mezheplerinden sayılan Şîa'nın bu alandaki katkıları dikkatleri celbetmektedir.“İmâmîyye Şîa'sı Usûl-i Fıkıh Geleneğinde Hadis Metodolojisi -Hicrî V-X. Yüzyıllar Arası-”başlığını taşıyan çalışmamız Şiî-İmamî fıkıh usûlü kaynaklarında usûlîlerin hadis/sünnet ve ahbâr ile ilgili görüş ve metodolojisinin tespitini amaçlamaktadır. Çalışmamızda İmamiyye Şîa'sının Usûlî geleneğinde hicri V. ve X. asırlar arasında yazılan fıkıh usûlü eserleri incelenmiştir. Çalışma bir giriş, dört bölüm ve sonuçtan oluşmaktadır. Girişte tezin konusu, önemi, amacı, kaynakları ve tezin yöntemi ele alınmıştır. Birinci bölümde fıkıh usulünün gelişimi ve haber kavramı incelenmiştir. İkinci bölümde İmâmiyye Şîası'nda mütevâtir haberler, karîneli ve karînesiz âhâd haber konuları üzerinde durulmuştur. Üçüncü bölümde usûlî gelenekte râvi ve mervî gibi konuların yanı sıra hadis usulü ile ilgili diğer tartışmalara yer verilmiştir. Dördüncü bölümde ise usûlî düşüncede Hz. Peygamber'in fiilleri ve bunların kaynak değeri konuları ele alınmıştır. Sonuç kısmında ise genel değerlendirmelerin yanında önemli görülen bazı hususlara dikkat çekilmiştir."
