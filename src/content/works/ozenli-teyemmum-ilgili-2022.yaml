abstract: "Bu çalışmada Kütüb-i Sitte'deki teyemmüm ile ilgili rivâyetlerin tespiti ve değerlendirmesi yapılmıştır. Tespit edilen rivâyetler altı konu başlığı altında toplanmıştır. Bunlar muhtevâ olarak sırasıyla, teyemmümün nüzûlü, yeryüzünün temizleyici oluşu, teyemmümün pratiğe yansıması ve ihtilam olan kişinin teyemmüm yapması, Hz. Peygamber'in (s.a.v.) kendisine verilen selama icabet etmek için teyemmüm alması, hastalık veya yaralanma durumunda teyemmüme müsaade edilmesi ve teyemmümle namaz kılan bir kimsenin bu namazının durumu ile ilgili rivâyetleri içermektedir. Tespit edilen bu rivâyetler öncelikle senedleri sonra da metinleri açısından incelenmiş ve değerlendirilmesi yapılmış, akabinde ise isnad şeması çizilerek konu bağlamındaki tüm tarikler şematik olarak bir arada gösterilmiştir."
