abstract: "İslam hukuku ve tıp alanında kadınlara ait özel halleri ele alan bu çalışmada konu ile ilgili olarak mezheplerin içtihatları ve günümüzdeki tıp verileri mümkün olduğunca mukayese edilmiştir. Günden güne yenilik arz eden tıbbın, bu hususta geldiği noktada hangi görüşlerin daha fazla kabul göreceği konusunda gerekçeler bulunmaya çalışılmıştır. İslam hukukunda ise hakkında yalnızca bir âyet-i kerime ve birkaç hadis-i şerif olan bu konuda verilen fetvalar da genellikle tecrübe ve akıl yürütmeye dayalıdır. Dolayısıyla kadınların biyolojik yapılarına göre değişiklik arz eden bu konunun dini temelleri tespit edilmeye çalışılmıştır."
