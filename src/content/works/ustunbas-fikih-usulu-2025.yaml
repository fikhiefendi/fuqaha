abstract: "Tarihselcilik, 19. yüzyıl içersinde ortaya çıkmış, bilimsel olma iddiasında bulunan felsefî bir akımdır. Tarihselcilik anlayışı, olguları taşıdığı değerlere göre değil, tarihi ortamlarında ve ortaya çıkış bağlamında inceleyerek yorumlar ve bir sonuç çıkarmaya çalışır. Tarihselciliğe göre, her çağ kendi tarihselliğinde var olan ilkeler ve değerlere göre incelenmelidir. Buna göre geçmişte meydana gelmiş tarihi fenomenler biriciktir, meydana geldiği tarihsel ortamı itibari ile bir defalığına olup bitmiştir. Temelleri vahye ve nebevî sünnete dayanan fıkıh usûlü, özgün yapısı ve bütün anlama ve yorumlama dinamikleri ile İslam'ın ilk çağlarından bugüne kadar varlığını korumuştur. Geçmişte bütün İslam toplumlarının karşılaştığı yeni durum ve sorunlara çözüm ürettiği gibi, bugün de yapısında var olan sistem ve metodolojisi ile çağın problemlerine çözüm üretmeye namzettir. Tezimizde ele aldığımız bu araştırmacılar ve düşünürler, Batı kaynaklı olması sebebi ile, tarihselciliği toptan, olduğu gibi yöntem olarak kullanamadıklarından İslam ilim geleneğinden ve fıkıh usulünde yer alan kavramlardan yardım alarak kendilerine argüman ve dayanak yapmaktadırlar. İşte bu araştırma, tarihselcilerin yöntem olarak öne sürdükleri tarihselcilik felsefesini ve dayanak olarak gördükleri argümanlarını, fıkıh usûlü çerçevesinde ele almakta, tarihselcilerin tarihsel olarak düşündükleri bazı fıkhî uygulamaları İslam hukuk metodolojisi içerisinde incelemektedir. Tezimiz giriş bölümü ile birlikte toplam olarak dört bölümden oluşmaktadır. Birinci bölüm giriş mahiyetinde sayılmaktadır. İkinci bölümde hermenötik ve tarihselcilik kavramlarını ele aldık. Üçüncü bölümde tarihselcilik anlayışının argümanlarını fıkıh usûlü açısından irdelemeye çalıştık. v Dördüncü bölümde ise tarihselci anlayışın tarihsel olarak düşündükleri hükümler, fıkıh usûlü bakımından ele alınmıştır."
