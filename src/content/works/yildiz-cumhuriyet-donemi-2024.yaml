abstract: "Osmanlı İmparatorluğu'nun hukuki yapısı şer'i hukuk ve şer'i hukukun düzenlemediği alanlarda, özellikle kamu hukuku alanında, padişah fermanlarıyla ortaya çıkan (kanunnâmeler) örfî hukuktan oluşmaktaydı. Tanzimat Fermanı'nın ilanından sonra Batı'dan bazı kanun iktibasları yapılmaya başlanmış, şer'iyye mahkemelerinin yanı sıra nizamiye mahkemeleri de devreye sokulmuştu. Medeni kanunun da Batı kanunlarından iktibas edilmesi konusunda yoğun tartışmalar yaşanmış muhafazakâr kesimin ısrarları üzerine İslam hukukunun ilk kanunlaştırılması olan Mecelle ortaya çıkmıştı. 1926 tarihinde ise Cumhuriyeti kuran irade Batı kanunlarının resepsiyonuna karar vererek Mecelle ilga edilmiş ve İslam hukukuyla olan bağ koparılmıştı. Bu tezin amacı, Cumhuriyet dönemi Türk hukukçularının 1926'ya kadar yürürlükte olan İslam hukuku hakkındaki yaklaşımlarını incelemektir. İnsanların zihninde Cumhuriyet dönemi modern hukukçularının hepsinin İslam hukukuna karşı olduğu gibi bir önyargı vardır. Biz de tezimizde modern hukukçuların İslam hukuku hakkındaki düşüncelerini inceleyerek bu ön yargının doğru olup olmadığını ortaya çıkarmaya çalıştık. Birinci bölümde İslam hukukundan Medeni hukuka geçiş sürecini ve bunun nedenlerini araştırdık. İkinci bölümde ise Türk hukukçularının İslam hukuku hakkında yaptıkları çalışmaları ve yaklaşım tarzlarını tespit etmeye çalıştık. Bu çerçevede İslam hukukunun dinamik mi statik mi olduğu hakkındaki düşüncelerine, özgünlüğü hakkındaki düşüncelerine, Mecelle hakkındaki düşüncelerine, İslam devlet yapısı hakkındaki düşüncelerine ve vakıflarla alakalı görüşlerine yer verdik. İkinci bölümün son kısmında ise İslam hukukunun en çok eleştirilen bazı meselelerine dair modern hukukçuların verdikleri cevapları ele aldık. Araştırmamız neticesinde modern hukukçular hakkındaki ön yargının yanlış olduğunu, hepsinin İslam hukukuna karşı olmadıklarını, İslam hukukunu bazı noktalardan eleştirseler de topyekûn reddetmediklerini, eleştirilerinin daha çok İslam hukukçularına yönelik olduğunu tespit ettik."
