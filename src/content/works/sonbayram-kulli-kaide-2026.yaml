abstract: "Bu çalışmada, İslam hukukunda önemli bir konuma sahip olan taharrî kavramı, küllî kâideler ve dâbıtlar çerçevesinde ele alınmıştır. Taharrî, klasik literatürde çoğunlukla“delillerin yokluğu veya yetersizliği hâlinde zann-ı galibe binaen hükme ulaşma çabası”şeklinde tanımlanmakta ve bir yönüyle avâmı da kapsayan bir ictihad olarak değerlendirilmektedir. Bu bağlamda taharrî, nas ve kat'î delillerin bulunmadığı durumlarda kişinin şer'î sorumluluğunu yerine getirebilmesi için başvurduğu istidlâlî bir süreçtir. Çalışma; giriş mahiyetinde bir çerçeve, iki ana bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde öncelikle küllî kâide ve dâbıtların mahiyeti, kapsamı ve fıkıh metodolojisindeki yeri ortaya konulmuştur. Ardından taharrî kavramının terminolojik ve kavramsal analizi yapılmış; meşrûiyyet temelleri Kur'ân, sünnet ve fıkhî istidlâl yöntemleri ışığında incelenmiştir. Ayrıca taharrî ile yakından ilişkili olan zann, ictihad, istishâb ve ihtiyat gibi kavramlarla irtibatı ele alınmış; usûl kâideleri ile olan etkileşimi değerlendirilmiştir. Bu bölümde ayrıca taharrîye sevk eden sebepler sistematik biçimde tasnif edilmiş ve taharrî ile amel etmenin şartları, sınırları ve usûlü üzerinde durulmuştur. İkinci bölümde ise taharrînin küllî kâide ve dâbıtlar çerçevesinde fürû-ı fıkha yansımaları incelenmiştir. Bu kapsamda öncelikle ibadetler alanında taharrînin işleyişi; kıble tayini, vakit tespiti ve tahâret gibi meseleler üzerinden örneklendirilmiştir. Devamında muâmelât alanında taharrînin rolü ele alınmış; özellikle şüpheli işlemler, helâl-haram ayrımı ve akitlerde belirsizlik durumlarında taharrînin fonksiyonu analiz edilmiştir. Bu çerçevede, taharrînin yalnızca nazarî bir kâide olmayıp, amelî hayatta karşılaşılan çeşitli meselelere şer'an muteber çözümler üreten bir yöntem olarak işlediği ortaya konulmuştur. Sonuç kısmında ise elde edilen bulgular değerlendirilerek taharrînin İslam hukukundaki yeri, fonksiyonu ve sınırları genel bir çerçevede sunulmuştur."
