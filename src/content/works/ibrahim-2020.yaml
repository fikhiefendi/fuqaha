abstract: "Bu çalışma Vehbe Zuhayli, Cemal Atiyye ve Muhammed el-Avva'nın fıkıh alanında yenilenmeyle ilgili görüşlerini ele almaktadır. Zuhayli'ye göre fıkıh alanında yenilenme ihtiyacı dini bir hükmü uygulamada meşakkatin olması, o hükmün maslahata, teşri maksadına aykırı bulunması veya yeni bir meselenin ortaya çıkması halinde söz konusu olmaktadır. Zuhayli fıkhi yenilenme yöntemlerini ortaya koymakta ve bu yöntemlerden en vasat, adil ve ölçülü olanını tercih etmektedir. İslam hukuku alanında yenilenme iddiasının ancak belirli bir çerçevede kabul edileceğini, belirli şart ve kayıtlara bağlı olduğunu aksi halde kabul edilmeyeceğini söylemektedir .İslam hukuku alanında yenilenmenin şeriata göre izin verilen çerçevede olması gerektiğini savunmuştur. Şeriattan peyderpey uzaklaşmayı, hevaya uymayı ve gelişi güzel keyfi bir yöntemi savunmamıştır. Zuhayli'ye göre mevcut yenilenme anlayışları çağdaşlaşma adı altında fıkıhla oynamaktan ve fıkhı tahrif etmekten ibaret kalmaktadır. Bu alandaki tahrifler alimlerin tembelliklerinden, görevlerini yerine getirmemesinden kaynaklanmaktadır. Öte yandan ona göre sosyal değişim ve ilerlemelerin karşısında İslami yenilenme durdurulamaz birmahiyetarz etmektedi. Cemal Atiyye fıkhi yenilenmeyi iki kısma ayırmaktadır: İslami metodolojinin dışında yenilenme ve İslami kurallara uygun yenilenme. Atiyye ikinci kısım yenilenmeyi esas almıştır. Böyle bir yenilenmeyi sağlayacak müçtehitleri yetiştirmek ümmetin ortak sorumluluğudur. Fıkıh alanında kanunlaştırmayı sağlamak üzere yenilenmenin pozitif hukukla karşılaştırmalı bir şekilde yürümesi gerekir. Muhammed Selim Avva yeni bir fıkha ihtiyacımızın olduğunu ve ehil alimlerin bu yenilenmeyi gerçekleştirmesinin zorunlu olduğunu savunmaktadır. Buna göre her asırda birden fazla müçtehidin bulunması 4 gerekir. İçtihatta asıl olan eski görüşleri olduğu gibi tekrar etme yerine, maslahata uygun yeni hükümler ortaya koyabilmektir. Fıkhi yenilenme alanında atılacak ilk adım, yönetenleri ve yönetilenleri fıkıhla amel etmeye cesaretlendirecek, kanunlaştırma ve yasama alanında fıkhın esas alınmasını sağlayacak en önemli unsur öncelikle mevcut olaylara vakıf olmak, ikinci olarakda bu olaylara doğru bir kıyas yöntemiyle hüküm vermektir. Gerçekten fakihlerin yüzlerce mesele, problem, sorun ve ortaya çıkan yeni durumlara cevap vermeleri, meşru olanı meşru olmayandan ayırt etmeleri ve bunun yerine maksadı gerçekleştirecek alternatifleri ortaya koymaları gerekmektedir. Bu konuda dinin asıllarıyla, genel maksatlarıyla ve kurallarıyla çelişkiye düşülmemelidir. İçtihadın geçerli olabilmesi için meselenin içtihada, yenilenmeye ve düzenlemeye açık olması şarttır. İçtihat sosyal değişimle birlikte süreklilik arz etmelidir. Böylece dinin ana gayeleri gerçekleşmiş olur. İçtihadın dinin ana kaynaklarına dayanması gerekir. İçtihatta pozitif hukuku esas almak fıkıh mirasından uzaklaşmayla sonuçlanır. Modern hayat dini açıdan cevaplanması gereken yüzlerde yeni meseleyi ve problemi beraberinde getirmiştir. Bu sebeple içtihat kapısı kapatılmamalı, aksine ehil olanlar için içtihat kapısı açık tutulmalıdır. Öte yandan ele aldığımız üç fakihin görüşleri bir tek çalışmaya sığdırılmayacak kadar geniştir. Bu sebeple konuyla ilgili uzun soluklu araştırmalar yapılmalıdır. Araştırmada üç fakihin konuyla ilgili görüşleri delilleriyle birlikte karşılaştırılmış, görüşlerin benzer ve farklı yönleri ortaya konulmuştur."
