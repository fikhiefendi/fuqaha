abstract: "İslam ahlak anlayışının İslam iktisadına olan etkilerini ele aldığımız bu çalışmada, günümüze kadar İslam iktisadının ana konuları içerisinde ahlakın yerini ve İslam ahlakıyla olan bağını inceledik. Bu amaçla yaptığımız çalışma bir giriş ve iki ana bölümden oluşup alt bölümlerden oluşmaktadır. Giriş bölümünde öncelikle çalışmanın önemi ve amacı üzerinde duruldu, kapsamı belirlendi ve bu konuya yakın çalışmalara yer verildi. Birinci bölüm ahlak ilmi ve felsefesinin izahından, ahlak ilminin konusundan, ilkelerinden, problemlerinden ve diğer ilimlerle olan ilişkisinden bahsedildi. Daha sonra İslam ahlak felsefesinin izahına geçildi. Bu alanda ise İslam ahlak anlayışının gelişiminden, dini ahlak ile felsefi ahlak arasındaki farklardan, İslam ahlak anlayışının önemli meselelerinden ve Müslüman filozofların bu konulardaki görüşlerinden, en son ise ahlaki yükümlülüklerin kaynağından bahsedildi. İkinci bölümde ise İslam ahlakının İslam iktisadına olan etkileri anlatıldı. Bu bölüm iktisat ilminin izahıyla başlanıldı. Daha sonra İslam iktisadından bahsedilip iktisat ilmi ile ahlak ilminin ilişkisi anlatıldı. En son ise İslam ahlakının İslam iktisadını en çok etkilediği konuları başlıklar halinde izah edildi. Bu konu 16 adet alt başlığa ayrılarak incelendi ve son olarak başlık açılmayacak olan konular“Diğer Meseleler”başlığında incelendi. Araştırma neticesinde elde edilen bulguların ve bu alanda yapılabilecek çalışmaların yer aldığı“Sonuç”bölümü ile çalışmalar sonlandırıldı."
