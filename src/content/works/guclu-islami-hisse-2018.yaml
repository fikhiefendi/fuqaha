abstract: "İslami hisse senedi piyasaları, geleneksel hisse senedi piyasalarında işlem gören hisse senetlerinin faaliyet alanı ve borçluluk durumuna ilişkin çeşitli filtreleme ölçütlerine tabi tutulduğu, söz konusu filtreleme ölçütlerine uygun olan hisse senetlerinden oluşan hisse senedi piyasalarıdır. Araştırmada, Modern Portföy Teorisi ve Sermaye Varlıkları Fiyatlama Modeli çerçevesinde, İslami hisse senedi piyasalarının geleneksel hisse senedi piyasalarından getiri, risk ve finansal bulaşma bağlamında ne ölçüde farklılaştığının belirlenmesi amaçlanmıştır. Bu amaca yönelik olarak Türkiye, Malezya, A.B.D. ve İngiltere İslami hisse senedi endeksleri ile geleneksel hisse senedi endekslerinin getiri performansı risk ayarlı performans ölçütlerinden Jensen alfa, Sharpe oranı ve Treynor oranı ile, oynaklıkları ise GARCH, EGARCH ve GJR-GARCH modeller kullanılarak tahmin edilmiş ve karşılaştırılmıştır. Karşılaştırma yalnızca İslami ve geleneksel hisse senedi piyasaları arasında değil, farklı ülkelerin İslami hisse senedi piyasaları arasında da yapılmıştır. Bununla birlikte söz konusu ülkelerin İslami hisse senedi piyasalarının aralarındaki ilişkiler Hong iki aşamalı nedensellik testi ile incelenerek hem İslami ve geleneksel hisse senedi piyasaları arasındaki hem de uluslararası İslami hisse senedi piyasaları arasındaki finansal bulaşma etkileri belirlenmeye çalışılmıştır. Araştırmanın bulguları incelendiğinde; Türkiye ve Malezya İslami hisse senedi piyasaları geleneksel karşılıklarından daha iyi getiri performansı gösterirken, aynı durumun A.B.D. ve İngiltere İslami hisse senedi piyasaları için söz konusu olmadığı sonucuna ulaşılmıştır. Oynaklıklar açısından bakıldığında, Türkiye İslami hisse senedi piyasasının oynaklığı geleneksel hisse senedi piyasasından daha düşük, Malezya İslami hisse senedi piyasasının oynaklığı geleneksel karşılığı ile benzer, A.B.D. ve İngiltere İslami hisse senedi piyasalarının oynaklıkları ise geleneksel hisse senedi piyasalarından daha yüksek bulunmuştur. Söz konusu İslami hisse senedi piyasalarının oynaklıkları kendi aralarında karşılaştırıldığında ise en yüksek oynaklığa sahip İslami hisse senedi piyasası Türkiye'ye, en düşük oynaklığa sahip olan ise Malezya'ya aittir. Nedensellik testi sonuçlarına göre, Malezya hariç hiçbir ülkenin İslami hisse senedi piyasaları ile geleneksel hisse senedi piyasaları arasında hem ortalama getirilerde hem de varyanslarında bir nedensellik ilişkisine rastlanmamıştır. Farklı ülkelerin İslami hisse senedi piyasaları arasındaki nedensellik analizi sonuçlarına bakıldığında ise A.B.D. ve Türkiye arasındaki ilişki haricinde, gelişmiş ülkelerin İslami hisse senedi piyasalarından, gelişmekte olan ülkelerin İslami hisse senedi piyasalarına doğru bir nedensellik ilişkisi olduğu sonucuna ulaşılmıştır. Bu sonuçlara göre, İslami hassasiyetlere sahip yatırımcılar, yüksek getiriden taviz vermeden düşük riskli İslami hisse senedi piyasalarına yatırım yapma şansına sahiptir. Hisse senedi yatırımlarına dini referanslarla yaklaşmayan yatırımcılar ise İslami hisse senedi piyasalarına yatırım yaparak, portföylerinin risklerini düşürebilirler. Bununla birlikte, gelişmekte olan ülkelerin İslami hisse senedi piyasaları arasında yapılacak portföy çeşitlendirmesi, uluslararası çeşitlendirme avantajı sağlamaktadır."
