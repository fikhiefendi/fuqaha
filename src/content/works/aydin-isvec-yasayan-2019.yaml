abstract: "Bu araştırmada İsveç'te yaşayan Müslümanların güncel fıkıh problemleri, ibadet hayatı, aile hayatı ve helaller haramlar başlıkları altında incelenip tespit edilmeye çalışılmıştır. Araştırmada İsveç'te İslam ve Müslümanların ibadet hayatı ve İsveç toplumunda İslam algısından bahsedilmenin yanı sıra ibadet hayatında yaşanılan güçlükler ve İsveç'te ezan ve minare algısına da yer verilmiş olmakla birlikte, yapılan anket çalışmasıyla da İsveç'te yaşayan Müslümanların güncel fıkıh problemleri tespit edilmeye çalışılmıştır. Verileri toplama da araştırmacı tarafından güncel fıkhi problemler, İsveç'in başkenti Stockholm ve ülkenin en güneyindeki Malmö kentinde toplam 100 kişi ile anket ve 200'e yakın kişi ile de mülakat yapılarak tespit edilmeye çalışılmıştır. Tezin ilk bölümünde İsveç'teki İslam algısı ve ibadet hayatında yaşanılan güçlükler ile bu ibadetlerin yerine getirilmesinde karşılaşılan problemler tespit edilip çözüm önerileri tartışılmıştır. İkinci bölümde ise aile hayatı ile ilgili nişanlanma, evlenme ve boşanma konularında İslam hukukunda karşılaşılan güncel fıkhi problemler tespit edilmeye çalışılmıştır. Yapılan evlilik ve boşanmaların İslam hukukuna uygun olup olmadığı tespit edilmeye çalışılarak çözüm önerileri tartışılmıştır. Üçüncü bölümde ise yiyecek ve içeceklerin İslam hukukuna göre helalliği ve haramlığı anlatılarak, Müslümanların yiyecek ve içeceklerde helal ve harama karşı duyarlı olup olmadıkları tespit edilmeye çalışılmıştır. Devamında ise helal olan yiyeceklere ulaşabilme imkânları tespit edilerek çözüm önerileri sunulmuştur. Dördüncü ve son bölümde ise Müslümanların yoğun olarak yaşadığı Malmö ve Stockholm'de toplam 100 kişi ile yapılan anketin analizi yapılmıştır."
