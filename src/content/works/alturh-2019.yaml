abstract: "ÖZET BİLGİ EKONOMİSİNDE E-TİCARET EĞİLİMLERİ VE İSLAM EKONOMİSİNDE UYGULAMA ARAÇLARI MOHAMAD MUSTAFA SAFI ALTURH Yüksek Lisans, İslam İktisadi ve Hukuku Tez Danışmanı: Dr. Öğr. Üyesi. Mohamad Anas SARMINI Eylül -2019, 193 Sayfa Çalışma, e-ticaretin doğasını ve bununla ilgili özellikleri anlamaya odaklanmış, ayrıca elektronik ticaretin alanlarına ve türleri ve zorluklarına odaklanmış, ayrıca İslami şeriat hükümleri uyarınca İslam ekonomisi perspektifinden e-ticaretin konsolidasyonuna odaklanmıştır. Elektronik ticarette İslami ticaret Alan çalışmasında uluslararası pazarlarda elektronik ticaret, ardından Arap pazarları ve ardından Türk pazarları yer aldı. Bu hedeflere ulaşmak için araştırmacı, konuyla ilgili önceki çalışmaların değerlendirmesinin yanı sıra, çalışma konusuyla ilgili teorik çalışmanın literatürünü gözden geçirmiştir. Çalışmada, e-ticaretin büyüme hızı ile ülkenin kalkınma oranı arasında pozitif bir etkiye sahip olduğu, ayrıca elektronik ticaretin büyüme endeksi ile ülkelerin altyapı, teknik ve elektronik altyapı alanındaki büyüme oranları arasında güçlü bir ilişki olduğunu, iletişim. Devletlerin elindeki en büyük değişimin sorumluluğunu üstlenerek, tesislerin sağlanması, mevzuatın geliştirilmesi ve insan kadrolarının hazırlanması, yasal ve yasal bir yapının oluşturulması ve bu alanda teknolojinin teşvik edilmesi yoluyla, Türkiye'nin tecrübesinden ve BAE ve Suudi Arabistan'ın tecrübesinden yararlanabilir ve ders çıkartabiliriz. Bölgedeki ülkelere. Araştırmacı, İslam ekonomisi, özellikle e-ticaret ve sanal para birimleri, e-ödeme, İslam hukuku hükümlerine uygun olarak e-ödeme gibi hizmetler ve çağdaş İslami finansal enstrümanların imalatında özenle ve kalıcı olarak çalışmayı, İslam ekonomisi ile ilgili çağdaş konulara dikkat etmeyi önermektedir. Rabbinin hukuku, İslami finansal mimariye göre ticari gerçeklik ve sabitlere uymakta, milletin yararına, refah ve refah için gayret ve çaba göstermektedir."
