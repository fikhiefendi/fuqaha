abstract: "Bu çalışma mikro finansın küçük ve orta ölçekli işletmelerin finansmanı ve geliştirilmesi yoluyla yemen'deki savunmasız gruplar ekonomik olarak güçlendirilmesi üzerindeki etkisini belirlemeyi amaçlamıştır. Bu çalışmada araştırmacı, yemen'deki mikrofinans kurumların ortaya çıkışını ve gelişimini açıklamak için tarihsel yaklaşımı kullanmıştır. Mikro finans kurumlarının yararlanıcıları ile (Al-Kuraimi Bankası, Al-Amal Bankası, Al-Tadhamon Bankası) anket yöntemini ve saha çalışmasına verilerini analiz etmek için istatiksel yöntemi kullanarak olguyu incelemek için analitik tanımlayıcı yöntemi kullanmıştır. Araştırmacı yemen'deki mikrofinans kuruluşlarının mükemmel finansal hizmetler sunduğu ancak küçük ve orta ölçekli işletmelerin ihtiyaçlarını karşılamada yetersiz olduğunu ve bu küçük ve orta ölçekli işletmelerin özelliklerini sektöre en uygun olduğunu tespit etmeyi amaçlamış ve araştırma bu sonuca varmıştır. Toplumun ihtiyacının karşılanması ve finansmana erişim ile korunmasız yararlanıcı grupların ekonomik olarak güçlendirilmesi arasında doğrudan olumlu bir ilişki olduğu ve Küçük işletmelerin büyümesinin arkasında birçok engelin bulunduğu, yemenin 2015'ten bu yana savaşın bir sonucu olarak yaşadığı siyasi ekonomik ve güvenlik koşullar olmuştur. Araştırmacı, Yemen'deki mikrofinans kurumlarındaki ilgili otoritelerin, işletme sermayesini finanse etmek, ekipman ve sermaye varlıkları geliştirmek veya küçük projelerin geliştirilmesi için yeni girişimcilik fikirlerini finanse etmek, ayrıca hükümet kontrolü ve bürokratik işlemleri azaltmak için gerekli kredi ve desteği sağlamasını tavsiye etti. prosedürlerdeki karmaşıklıklar veya Kurumdaki Yetkililer tarafından ekonomik faaliyetlerin uygulanması, uygun krediler, öncelikli vergi muafiyetleri, dış rekabetten koruma ve ulusal malların devlet satın alımlarının sigortası yoluyla küçük projelerin geliştirilmesine yönelik bir teşvik politikası benimsemiştir."
