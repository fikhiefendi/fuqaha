abstract: "Bu çalışma, Osmanlı ve Cumhuriyet dönemi âlimlerinden Ömer Nasuhi Bilmen'in Hukuk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kâmusu adlı eserini konu edinmektedir. Ömer Nasuhi Bilmen, İstanbul müftülüğü, Diyanet İşleri Başkanlığı gibi önemli görevler yapmış Erzurumlu bir âlimdir. Fıkhın yanında akâid, tefsir, hadis, ahlâk, kelâm, dinler tarihi ve edebiyat alanlarında da eserler vermiştir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde Ömer Nasuhi Bilmen'in hayatı ve eserleri hakkında bilgi verilmiştir. İkinci bölümde ise Hukuk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kâmusu adlı eserin telif sebepleri, dili, bilimsel özellikleri, metodu, sistematiği, kaynak değeri, literatürdeki yeri gibi açılardan incelemesi yapılmıştır. Çalışmanın neticesinde; Hukuk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kâmusunun, klasik fıkıh kaynakları sistematiğini günümüze taşıdığı, Cumhuriyetin kabulünden sonra Lâtin alfabesiyle yazılmış ilk eser olduğu, İslâm hukukunun neredeyse bütün konularını içerdiği ve mezhepler arası mukayeseli İslâm hukuku eseri olduğu tespit edilmiştir. Ayrıca Hukuk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kâmusu adlı eser hakkında pek çok çalışmanın yapılmış olduğu ancak bu önemli eserin daha pek çok boyutuyla yeniden çalışılması gerektiği görülmüştür."
