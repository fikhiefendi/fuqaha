abstract: "Bu çalışma, şerʻî cevaz düşüncesinin yasama yetkisiyle olan ilişkisini konu edinmektedir. İslam hukukunda devlet fonksiyonlarını ele alan birçok kişi, şeriatta yegâne hüküm koyucunun Allah olması hasebiyle, yasama yetkisinin de şerʻî hükümleri keşfetme ehliyetine sahip sivil fukahaya ait olması gerektiğini savunmaktadır. Yasama faaliyetini şerʻî içtihatlarla özdeşleştiren ve bu itibarla yasa yoluyla ilahî hükümlerin kanunlaştırıldığını ileri süren bu yaklaşımın yasama fonksiyonunu dogmatik bir hale getirdiği söylenebilir. Seyyid Bey ve Mansûrîzâde gibi Türk-İslam aydınlarına göre ise hem yasama fonksiyonu hem de yasamaya konu kılınan hususlar cevaz alanındaki meselelerdendir. Bu alanda Allah katında muayyen bir şerʻî hüküm bulunmadığı için söz konusu meseleler beşerî düzenlemeye açıktır. Bu aydınların yaklaşımını \"şerʻî cevaz düşüncesi\" olarak isimlendirmek mümkündür. Cevaz düşüncesinin İslam hukuku özelinde yasama faaliyetine nasıl bir açılım sağladığını tespit etmeyi amaçlayan bu çalışma üç bölümden oluşmaktadır. Birinci bölümde genel olarak hukukta yasamanın ne olduğu, bunun İslam hukukunda neye tekabül ettiği ve bu bağlamda yasama yetkisinin kime ait olduğuyla ilgili görüşler incelenmiştir. İkinci bölümde teşrîʻî ferağ (boşluk) ve teşrîʻî afv söylemleri de dikkate alınarak şerʻî cevaz düşüncesinin ne ifade ettiği irdelenmiş ve bu düşüncenin teorik bir zemine sahip olup olmadığı tahlil edilmiştir. Üçüncü bölümde ise cevaz düşüncesi açısından yasama yetkisinin nasıl algılandığı, bu düşüncenin yasama faaliyetinin yürütüleceği alanı belirlemede nasıl bir fonksiyona sahip olduğu ve son olarak yasama yetkisinin sınırlandırılmasına imkân tanıyıp tanımadığı ele alınmıştır. Yapılan çalışmada cevaz düşüncesinin, devlet teşkilatının rasyonelleştirilmesine imkân sağladığı ve tavr-ı akılla yürütülecek olan yasama faaliyetine geniş bir alan açtığı sonucuna ulaşılmıştır. Ayrıca cevaz düşüncesini oluşturan görüşlerin, belli bir tutarlılığa sahip olmakla birlikte bir sistem dâhilinde sunulmadığı ve bu sebeple doğrudan cevaz düşüncesini tahkik eden çalışmalara ihtiyaç duyulduğu da ulaşılan sonuçlar arasında yer almaktadır."
