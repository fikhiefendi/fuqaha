abstract: "ÖZET İçerisinde pek çok hukukî olay veya işlemin gerçekleştiği veya bizzat bu olayların ve işlemlerin konusunu teşkil eden deniz araçlarına, milletlerarası teamül gereği, devletlerin egemenlik haklarından doğan yetkilerini kullanmak suretiyle tâbiiyet bahşetmelerine ilişkin benzer sebeplerin hava araçları için de söz konusu olması onlara da tâbiiyet izafe edilip edilemeyeceği sorununu gündeme getirmiş ve sonuçta devletler, milletlerarası sözleşmeler yoluyla hava araçlarına tâbiiyet bahşetmeleri konusunda anlaşmışlardır. Bahşedilen bu tâbiiyetin sonucunda hava araçları bakımından birtakım haklar ve yükümlülükler söz konusu olmuştur. Günümüzde, hava araçlarının tâbiiyetini düzenleyen tek uluslararası anlaşma olan Milletlerarası Sivil Havacılık Anlaşması, hava aracının hangi şartlarla âkit devletlerin tâbiiyetini kazanacağına dair herhangi bir hüküm içermemiş olmasına rağmen, ABD (ikametgâh kriteri ile birlikte), Birleşik Krallık (ikametgâh kriteri ile birlikte), Almanya ve de Türkiye gibi ülkeler, hava aracı ile aralarında“gerçek bir bağ”kurmak, hava aracım idarî, teknik, sosyal konularda daha etkin bir şekilde kontrol altına almak amacıyla, hava aracının maliki hangi devletin tâbiiyetinde ise hava aracının da o devletin tâbiiyetim haiz olacağı şeklinde düzenlemeler yapmışlardır. Bir devletin tâbiiyetini kazanan hava aracı, tâbiiyetin ispatı olarak, o devletin siciline tescil edilip, o devletin tâbiiyet ve tescil markasını taşır. Burada tescil bildirici nitelikte olduğundan, ancak tâbiiyetin varlığına karine teşkil eder. Yine aynı şekilde, tâbiiyetin kazanılmasına ilişkin olarak o devletin tayin ettiği kriterlere 131uyulmaması halinde tâbiiyet kaybedilir. Bu durumda hava aracına ilişkin tescil, sicilden terkin edilir. Bununla birlikte tâbiiyetin kaybı dışında herhangi bir sebeple sicilden terkin edilen hava aracı, o devletin tâbiiyetini kaybetmese de, artık söz konusu tâbiiyet bağı herhangi bir hukukî sonuç doğurmaz. Fakat, fiilen veya itibari olarak uçamaz hale geldiği ya da ziyaa uğradığı için sicilden terkin edilen hava aracı için tâbiiyetten söz etmek artık mümkün değildir. 132"
