abstract: "Bu çalışmada İmam Nesâî'nin es-Sünenü's-süğrâ isimli eserindeki fıkıh anlayışını salât bölümü özelinde dört mezhep imamlarının anlayışıyla karşılaştırmalı olarak ortaya koymayı hedeflemektedir. Nesâî'nin fıkhî meselelere yaklaşım usulünün boyutları ve fıkıh görüşlerinden birini tercih etmedeki yöntemi de araştırmanının konularına dahildir. Araştırmanın önemi ilel ve fıkıh konularında imam olan Nesâî'nin ilmi konumu ve kütüb-i sitte eserlerinden biri olarak kabul edilen kitabından kaynaklıdır. Araştırmanın hedeflerini gerçekleştirmek için betimleyici analitik tarihsel metot kullanılmıştır. Müellifin biyografisi, ilmi durumu, kitabının özelliklerinin tespitinde ve imam Nesâî'nin salât bölümündeki fıkhî görüşlerinin tespit ve tahlilinde bu yöntem kullanılmıştır. Nesâî'nin fıkhî görüşlerinin diğer fakihlerin görüşleriyle kıyaslanmasında karşılaştırma metodu kullanılmıştır. Araştırmada ulaşılan sonuçlardan önemlileri şunlardır: İlel, ricâl ve hadis tarikleriyle ilgili mahareti sebebiyle İmam Nesâî, alimlerin çoğunun sahîh kabul ettiği rivayetleri tercih etmiştir. İmam Nesâî eserinde fıkıh ile hadis ilmini birleştirmiş, fıkıh ilmiyle ilgili en hassas konuları delilleriyle birlikte zikretmiştir. Fıkhî görüşlerini genellikle bab başlıklarında zikretmiş, delile uygun olanı tercih etmiştir. Adalet ve zabt sıfatlarına sahip ravilerden rivayette bulunmuştur. Nesâî'nin en meşhur fıkhî görüşlerinden biri, imam beş vakit namazı kılmak üzere insanlardan biat alır görüşüdür."
