abstract: "Osmanlı Devletinde, kadı sicilleri olarak da adlandırılan Şer'iyye Sicilleri kadılar tarafından tutulan defterlerdir. Bu belgeler tutulduğu dönemin adli, ekonomik, sosyal, sağlık, kültürel idari vs. konularına ışık tutan birincil kaynaklardır. Bu sebeple Osmanlı Devleti şehirlerinin veya bölgelerinin adli, idari, ekonomik, sosyal, sağlık, kültürel konularını inceleyen araştırmacıların, şer'iyye sicillerine başvurmaları araştırmalarına önemli katkı sağlayacaktır. Hicri 1027-1028 / Miladi 1618-1619 tarihleri arasını kapsayan 12 Numaralı Gaziantep Şer'iyye Sicili'nin 1-104 sayfa aralığının transkripsiyonu yapılmış ve tespit edilen 307 belgenin özeti çıkarılarak konulara göre değerlendirilmesi yapılmıştır. Hazırlanan bu çalışma özellikle Gaziantep şehir tarihinin aydınlatılmasına daha sonra şehir tarihi çalışan diğer araştırmacılara önemli katkılar sağlayacaktır."
