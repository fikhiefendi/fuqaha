abstract: "Çalışmamızda İbn Rüşd'ün hilaf niteliğinde olan Bidayetü'l Müctehid Adlı eserinde Ahmed b. Hanbel'e ait görüşleri tahkik etmeye çalıştık. Yaptığımız çalışmanın neticesinde İbn Rüşd'ün Ahmed b. Hanbel'e ait görüşleri naklederken bazı hatalara düştüğünü tespit ettik. Tezimizde 869 görüş incelenmiş olup, 33 hatalı görüş tespit edilmiştir. Hatalı olan görüşler, I. Bölümde namaz, oruç, zekât, hac, sayd, akika, et'ime ve eşribe konularında; II.bölümde talâk, zıhâr, liân konularında; III. Bölümde buyû, icare, lukata ve ıtk konularında; IV. Bölümde ise zina ve akdiye konularındadır.Pek çok konuda bu kadar hatalı bir görüşün olması Bidayetü'l Müctehid'in temel, güvenilir kaynak olma vasfını ortadan kaldırmaktadır. Ancak her alimin görüşünü kendi kaynaklarından öğrenmenin gerekliliği âşikardır."
