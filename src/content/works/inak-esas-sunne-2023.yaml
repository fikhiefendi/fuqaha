abstract: "Çalışmamız; yirminci asır âlimlerinden olan Saîd Havvâ'nın Hadis İlmi ile ilgili yönünün bugüne kadar araştırılmamış olmasından dolayı, kendisinin hayatı, şahsiyeti, eserleri, etkileri, muasırı olan âlimlerle mukayesesi, Hadis Usûlü ile ilgili görüşleri ve hadisleri yorumlamasıyla Hadis İlmi'ndeki konumunu araştırmayı içermektedir. Çalışmamız; giriş, üç bölüm ve sonuçtan oluşmuştur. Giriş bölümünde araştırmanın konusu, önemi, amacı, kapsamı, yöntemi ve kaynakları hakkında bilgiler verilmiştir. Birinci bölümde Saîd Havvâ'nın hayatı, kişiliği, eserleri, etkileri ve muasırı olan bazı âlimlerle mukayesesi işlenmiştir. Hayatı çoğunlukla kendi yazdığı biyografisinden, oğlu Muhammed Saîd Havvâ'nın anlatımından ve diğer kaynaklardan; kişiliği ise siyasî, da'vetçilik ve ilmî yönleriyle eserlerinden ve diğer kaynaklardan aktarılmıştır. Tespit edilebilen eserlerinin kısa tanıtımı yapılmış, özellikle de el-Esâs fi's-sünne ve fıkhihâ'nın üzerinde durulmuştur. Saîd Havvâ'nın ilim dünyasındaki etkileri kendisi ve eserleri hakkında yapılan çalışmalarla belirtilmiş, muasırı olan âlimlerle Hadis İlmi yönünden benzeşen ve benzeşmeyen yönleri ortaya konmuştur. İkinci bölümde Saîd Havvâ'nın Hadis Usûlü ile ilgili görüşlerine eserlerinden örnekler verilerek temas edilmiştir. Üçüncü bölümde de Saîd Havvâ'nın hadisleri yorumlamasında hangi yöntemleri kullandığı yine alt başlıklar çerçevesinde örnekler verilerek açıklanmaya çalışılmıştır. Sonuç bölümünde ise çalışma sonunda elde edilen tespitler sıralanmış, müellifin eleştirilebilecek tarafları dile getirilmiş ve bundan sonraki araştırmacılar için bazı öneriler sıralanmıştır."
