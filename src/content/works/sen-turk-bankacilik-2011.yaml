abstract: "Katılım Bankacılığı'nın Türk bankacılık sektörü içerisindeki durumu bu çalışmada incelenmektedir. Öncelikle Türk bankacılık sektörü hakkında genel bilgilere yer verilmektedir. Türk bankacılık sektörünün Cumhuriyet öncesi ve sonrası gelişim süreci hakkında araştırmalar yapılmış, bu sektördeki bankaların türleri açıklanmış ve denetleyici kurumlar incelenmiştir. Sonrasında Katılım Bankaları'nın tarihsel gelişim süreci, bu bankaların doğuşunu gerektiren sebepler, kullanılan fon toplama ve kullandırma yöntemleri ile dünyadaki durumu incelenmiş ve son olarak Türkiye'de faaliyet gösteren Katılım Bankaları araştırılarak, bu bankalarda çalışan kişiler ile sözlü görüşmeler yapılmıştır."
