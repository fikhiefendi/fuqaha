abstract: "ÖZET Tezimiz; giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde; Pozitif hukuk'ta boşanma sistemleri ve İslam hukukunda evliliğin sona ermesi ve şekilleri hakkında bilgi verilmiştir. Birinci bölümde Talâk (Boşanma) konusu; tarifi, mâhiyeti, rüknü, hükmü, hikmetleri, çeşitleri, boşanmada kullanılan lafızlar, boşama yetkisi gibi başlıklar işlenmiştir. İkinci bölümde ise; Muhâlaa'nın tarifini ve mâhiyetini açıkladıktan sonra muhâlaa'nın hukuki niteliği, muhâlaa'nın hukuki dayanağına ilişkin görüşler ve deliller muhâlaa'nın rükünleri ve şartları, muhâlaa'nın hukuki sonuçları işlenmiş ve sonuç bölümüyle bitirilmiştir."
