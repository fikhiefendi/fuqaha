abstract: "Tezde, Gazâlî'nin İcmâ' Anlayışı, el-Menhûl ve el-Mustesfâ isimli eserleri bağlamında ele alınmaya çalışılmıştır. İcmâ' konusunda Gazâlî'nin görüşleri diğer İslâm hukukçuları ile mukayese edilerek, etkilendiği ve etkilediği isimler tespit edilmeye çalışılmıştır. Ayrıca Gazâlî'nin Şâfiî mezhebine mensup olmakla birlikte mezhep taassubu içerisinde olmadığına dikkat çekilmiştir. Tez, Giriş, İki Bölüm, Sonuç ve Bibliyografyadan oluşmaktadır.Giriş kısmında Tezin İçerik ve Yöntemi ile Gazâlî'nin Hayatı ve Eserlerine yer verilmiştir. Tezin Birinci Bölümünde, İcmâ'ın Mahiyeti, İmkânı ve Delil Oluşu konusunda görüşleri tespit edilmeye çalışılmıştır. Tezin İkinci Bölümünde, İcmâ'ın Şartları, Çeşitleri ve Hukuki Sonuçları konusunda meseleyi ele alışı ortaya konulmuştur."
