abstract: "Bu çalışma, kıraat farklılıklarından dolayı ortaya çıkan fıkhi görüşleri incelemektedir. Fakihlerin kendi aralarındaki ihtilâfların sebebi hakkı ortaya çıkarmaya çalışmaktır. Her grup,her fakih ve fıkhi ekoller bu amaca yönelik araştırma ve çalışmalar bilginlerin yapmışladır. İhtilaflarının sebebi nefsi sebepler olmadığı gibi ihtilâf etmeyi de sevmezlerdi. Her tarafların bu ihtilâflarda kendilerine göre mantıklı sebepleri vardı. Bu araştırmalar neticesinde fıkhi ihtilâfların şu üç kısımda incelenmesi gerektiği oraya çıkmıştır: Birincisi, hoş görülen ihtilâflar Hüküm koyucunun kişinin ihtiyarına bırakmış olduğu, farklı seçeneklerin sunulmuş olduğu meselelerdir, örneğin: Temettü haccı, ifrâd haccı veya kırân haccı gibi. İkincisi, yerilen ihtilâflar: Bunun sebebi de cehâlet, nefse uyma, bir mezhebe ya da görüşe taassub etmek veya nebevî yönteme muhalefet etmektir. Üçüncüsü, mantıki çerçevedeki ihtilâflar: Bunlarda kendisinde delalet ve subût yönünden kati' bir nassın bulunmadığı ictihâdi meselelerde olur. Bunun da birçok sebebi olduğu gibi kıraat farklılıkları da bunlardan birisidir. Görüldüğü üzere Kur'ân Kıraatlerinin bir kısmı mütevâtir diğer kısmı ise şâzz olarak değerlendirilmiştir. Mütevâtir Kıraatlerin hücciyeti hususunda fakihler ittifak etmiştir. Şâzz Kıraatleri Hanefiler ve Hanbeliler şeri' hükümlerde delil olarak kabul ederken Şâfîler ve Mâlikiler delil kabul etmemişlerdir. Bu çalışmada, kıraat farklılıklarının fakihlerin ihtilâf etmesinin sebeplerinden bir sebep olması, uygulamalı olarak örnekler üzerinde incelenmeye çalışılmıştır."
