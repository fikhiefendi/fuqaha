abstract: "İslami hisse senedi endeksleri, dini inançlarına bağlı olan yatırımcıların yatırım yapabileceği bir ortamı sağlamak üzere tasarlanmıştır ve uluslararası sermaye piyasalarında köklü bir geçmişe sahiptir. Ayrıca İslami finans sistemi, yatırımcılar için inançlarına uygun bir yatırım seçeneği olmanın yanı sıra küresel finansal krizlerin etkilerinden korunma veya portföylerini çeşitlendirme amacıyla da tercih edilmektedir. Türkiye'de İslami prensiplere uygun bir şekilde temsil eden ilk endeks katılım 30 endekstir. Hem işlem hacmi hem de piyasa değeri en yüksek 30 işletmenin pay senetlerini kapsayan endekstir. Bu çalışmanın amacı, İslami kurallara uygun olarak oluşturulan Katılım 30 endeksinde yer alan imalat sektöründeki şirketlerin 2018-2022 yılları arasında finansal performansının ölçülmesi ve finansal tablo verileri kullanılarak CRITIC ağırlıklandırma yöntemi ile çok kriterli karar verme modellerinden TOPSİS yöntemi yaralanarak işletmelerin sıralamalarının belirlenmesidir. Çalışmada incelenen yılların aralığı pandemi zamanına gelmesinden dolayı pandemi sırasındaki sıralamanın değerlendirilmesi ve nasıl etki etiğini açısından önem taşımaktadır. Çalışma sonucuna göre en iyi finansal performans skoruna sahip işletmeler sırasıyla OYAKC, EREGL, TUPRS olarak tespit edilmiştir. Diğer taraftan sıralamalarda en son finansal performans skoruna sahip işletmeler ise sırasıyla VESTL, GUBRF ve KARSN şeklinde olduğu görülmüştür. İşletmelerin finansal performans sıralamaları değerlendirilerek pandemi öncesi ile pandemi dönemlerinde finansal performanslarında yıllara göre değişkenlik gösterdiği görülmektedir. Bu bağlamda Covid-19 katılım 30 endeksinde yer alan imalat sektörü şirketlerinin finansal performansını üzerinde çok büyük bir etki olmasa da olumsuz bir etki yarattığını gözlemlenmektedir. Covid-19'un yıllara göre etkisine bakıldığında elde edilen sonuçlar neticesinde 2021 yılındaki finansal performansın 2020' ye göre daha fazla bir etki oluşturduğu görülmektedir."
