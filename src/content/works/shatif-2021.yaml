abstract: "Bu çalışmada، genel olarak Yemen ekonomisine ve özel olarak da Al-Jawf ve Marib illerinin kalkınmasında katkıda bulunacak“Al-Jawf ve Marib illerindeki tarım ve su kaynaklarının sürdürülebilir kalkınmaya dönüştürme olasılığını”ele alınmıştır. Çalışmada، betimsel araştırma yöntemi kullanılarak Marib ve Al Jawf'ın tarihsel، ekonomik ve coğrafi özelliklerine değinerek، yanı sıra niceliksel araştırma yöntemiyle mevcut olan yerel mahsul istatistikleri analiz edilerek uygun çözümlere ulaşılmaya hedeflenmiştir. İstatistiklere göre Al-Jawf، 2009 yılında Yemen'in buğday üretimi ve yeraltı suyu bolluğu açısından birinci ili olarak yer almıştır. Ma'rib ili ise، 2009-2010 döneminde Yemen'in tarımsal üretiminde üçüncü sırada yer alarak toplam ülkenin tarımsal üretiminin % 7،6'sına ulaşmıştır. Çalışma، geniş tarım arazi alanı ve gelişme endeksinin doğrudan ilişkili olduğuna varılmıştır. Buna bağlı olarak ne kadar fazla tarımsal alan varsa gelişme endeksinin o kadar yüksek olduğunu ortaya koymaktadır. Fakat، Al-Jawf ilindeki، kalkınma endeksi ve tarım arazilerinin alanı arasındaki ilişkinin ters orantılı olduğunu gösterilmiştir. Bu bağlamda Al-Jawf ilindeki bulunan geniş tarım alanıyla gelişme endeksinde artış olmadığını görülmüştür. Bunun sebebi ise، su ve tarımsal kaynakları iyi bir şekilde kullanılmadığını ortaya koymaktadır. Çalışmada، Al-Jawf'in belli bölgelerinde ikili arazi alanı artmasıyla gelişme endeksi yükseldiğini rastlanmıştır. Çalışmanın sonucunda söz konusı bu iki kaynağın kalkınma için önemli olduğunu ve bunların iyi kullanılması ile birlikte iki ilinin yeniden doğuşuna ve gelişimine katkıda bulunarak Yemenin ekonomisine ve gıda güvenliğine katkılar sağlayacağına varılmıştır."
