abstract: "Hanefî mezhebindeki farz-vacip ve haram-tahrimen mekruh ayrımlarının hükme ulaştıran delillerin bilgi ve amel değerlerindeki farklılıklardan kaynaklandığı bilinen bir husustur. Delilin kat'î olması durumunda hüküm farz ya da haram, zannî olması durumunda vacip ya da tahrimen mekruh olarak belirtilir. Bu çalışmada, söz konusu yaklaşımın mahiyeti ve kapsamı incelenmiştir. Bu doğrultuda, Hanefîler'in delaleti zannî naslar, âhâd haberler, zannî icma türleri veya kıyasla sabit olmuş hükümlerin tamamını vacip ya da tahrimen mekruh kategorisinde görüp görmediğinin sağlaması yapılmaya çalışılmıştır. Öncelikle kavramsal düzeyde teorik, sonrasında da örnekler üzerinden pratik boyut üzerinde durulmuştur. Araştırmanın neticesinde Hanefîler'in teklîfî hüküm terminolojisinde delilin kat'îliği-zannîliği üzerinden yaptıkları ayrımların ve geliştirdikleri yaklaşımın nassa ziyade anlayışıyla ilişkili olduğu sonucuna varılmıştır."
