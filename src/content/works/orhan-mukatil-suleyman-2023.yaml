abstract: "Çalışmamız tefsir literatüründe ilklere imza atmış bir müfessir olan Mukâtil b. Süleyman ile döneminin önemli alimlerinden olan Konyalı Mehmet Vehbi Efendi'nin telif ettikleri ahkâm tefsirlerini ele almaktadır. Farklı dönemlerde yaşayan bu iki müfessirin hayatlarının, bilgi birikimlerinin, kültürlerinin, hitap ettikleri toplumun tesirinden hareketle eserlerdeki benzerlik ve farklılıkları ortaya koymak temel amacımızı oluşturmaktadır. Tezimiz, giriş ve iki ana bölüm halinde şekillenmiştir. Giriş bölümünde tezimizin konusu, amacı, önemi ve yöntemi ele alınmaya çalışılmış, daha önce konumuzla ilgili yapılan ve literatüre katkı sağlayan kaynaklardan bahsedilmiştir. Bu bölüm çalışmanın rahat şekilde anlaşılabilmesi için fıkhî tefsir konusuna ayrılmıştır. Bu kısımda fıkhî tefsirin tarihi, oluşum süreçleri ve meşhur fıkhî tefsirlere yer verilmiştir. Daha sonra söz konusu müfessirler tanıtılmış, hayatlarına, ilmi kişiliklerine ve eserlerine temas edilmiştir. Son bölümde de eserlerin karşılaştırılması üzerinde durulmuştur. Müelliflerinin yaşadıkları zamanın ve şartların oldukça farklı olması sebebiyle eserler hem şekil hem içerik bakımından mercek altına alınmış ve fıkhî meselelere verdikleri hükümler mukayese edilmiştir."
