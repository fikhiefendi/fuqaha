abstract: "Çalışmanın konusunu, 6098 sayılı Türk Borçlar Kanununun 351. maddesinde düzenlenen konut ve çatılı işyeri kiralarında dava yoluyla kira ilişkisinin sona erme sebepleri arasında sayılan yeni malikin gereksinimi nedeniyle kiralananın tahliyesi oluşturmaktadır. Türkiye'de yaşanan ekonomik değişimler nedeniyle kira ilişkisinden kaynaklanan uyuşmazlıklarda önemli ölçüde artış yaşanmıştır. Kira bedellerinin yükselmesi sebebiyle kira bedelini ödemekte zorlanan kimseler, konut alımına yönelmiştir. Satın aldıkları konutta kiracının oturması halinde konutlarını kullanamayan kimselerin başvurdukları hukuki yol olan ve TBK'nın 351. maddesinde düzenlenen yeni malikin gereksinimi konusu çalışmada detaylı olarak incelenmiştir. Kanun koyucu ''yeni malikin gereksinimi'' başlığını kullansa da ''kiralananı sonradan edinen kişi'' olarak birinci fıkraya başlamış olması sebebiyle kiralananı edinme yolları çalışmada tartışılmıştır. Kira ilişkisinin tanımı ve hukuki niteliğinden başlamak üzere, çalışma konumuzun konut ve çatılı işyeri kirasına özgü düzenlemeler arasında yer alması nedeniyle konut ve çatılı işyeri kavramı detaylı olarak incelenmiştir. Konut ve çatılı işyeri kirasına özgü kuralların hangi durumlarda uygulanacağına ilişkin de çalışmada ayrıntılı değerlendirme yapılmıştır. Çalışma konumuza katkıda bulunması amacıyla kira ilişkisinin diğer sona erme sebepleri de incelenmiştir. Kiralananı sonradan edinen kişinin hangi gereksinimi durumunda TBK'nın 351. maddesine başvurabileceğine ilişkin doktrinde yer alan görüşler ve Yargıtay kararları çerçevesinde inceleme yapılmıştır. Gereksinim iddiasında bulunabilecek kişiler, kanunda sınırlı sayıda sayılmaları nedeniyle detaylı olarak incelenmiş, kanunda sayılan diğer şartlar, dava açılacak yetkili ve görevli mahkeme hususu da çalışmada tartışılmıştır. Ayrıca kiracının tazminat isteme hakkı, yeniden kiralama yasağı hususu da incelenerek bir sonuca varılmıştır."
