abstract: "Daha yüksek bir pazar payına ulaşmak için, faizsiz bankacılık performansını artırarak geleneksel bankacılık ile rekabete hazır hale gelmelidir. Ayrıca, faizsiz bankacılığın faaliyetinin geleneksel bankacılıktan tamamen farklı olduğunu göstermesi gerekmektedir. Dolayısıyla, faizsiz bankacılıkta iyi performans göstermek çok önemlidir. Eğer faizsiz bankacılık iyi performans gösterirse, müşteriler veya yatırımcılar faizsiz bankacılığın ürün ve hizmetlerini talep edeceklerdir. Performans değerlendirme ile ilgili en yaygın ölçüm şekli finansal performanstır. Bu çalışmanın amacı, Türkiye ve Endonezya'daki faizsiz bankalarının finansal performanslarının analizi ve karşılaştırılmasıdır. Bu çalışmanın türü nicel araştırmadır. Türkiye ve Endonezya'daki faizsiz bankacılığın finansal performansını analiz etmek ve karşılaştırmak için bu çalışmada panel veri analizi ve makâsıdü'ş-şerîa endeksi (ME) kullanılmaktadır. Panel veri analizinde bağımlı değişken olarak aktif karlılığı (ROA) kullanılmaktadır. Bu çalışmada kullanılan bağımsız değişkenler ise banka büyüklüğü, kredi oranı, sermaye oranı, faaliyet gideri oranı, banka yaşı ve enflasyondur. ME'nin analizinde din, hayat, akıl, nesil ve varlık olmak üzere beş kavram bulunmaktadır. Bu çalışmadaki veriler bankaların yıllık raporlarından toplanmaktadır. Ayrıca, bu çalışmada Türkiye'deki 5 faizsiz banka ve Endonezya'daki 11 faizsiz banka örneklem olarak kullanılmaktadır. Çalışmanın sonuçları, Türkiye'deki faizsiz bankalarda banka büyüklüğü, kredi oranı, banka yaşı ve enflasyonun ROA üzerinde önemli ölçüde etkisi olduğunu göstermektedir. Endonezya'daki faizsiz bankalarda ise banka büyüklüğü ve sermaye oranının ROA üzerinde önemli ölçüde etkisi bulunmaktadır. Ayrıca, tüm bağımsız değişkenler her iki ülkedeki faizsiz bankacılıkta ROA'yi önemli ölçüde etkilemektedir. ME'nin hesaplamasına göre, Endonezya'daki faizsiz bankaların ME ortalaması Türkiye'deki faizsiz bankaların ME ortalamasından daha yüksektir. Ancak, her iki ülkedeki faizsiz bankaların ME ortalaması %20'nin altındadır. Demek ki, faizsiz bankaların sosyal-ekonomik gelişmişlik üzerinde büyük etki bırakmaları için makâsıdu'ş-şeria'a dayalı performanslarını artırmaları ve iyileştirmeleri gerekmektedir."
