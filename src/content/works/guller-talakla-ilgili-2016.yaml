abstract: "Bu araştırma, İslam Aile Hukuku içerisinde oldukça önemli bir yere sahip olan ve gerek Hz. Peygamber (sav) döneminde gerekse sonraki dönemlerde fakihleri oldukça meşgul eden üç talak konusu ve bu konu etrafında ortaya çıkan görüşlerin kendilerine dayanak kabul ettikleri hadislerin rivayet tekniği açısından incelenmesi amacıyla yapılmıştır. Konuyla ilgili olarak İslam dininin ilk temel kaynağı olan Kur'an-ı Kerim'de tafsilatlı bir hükme ulaşamayan İslam alimleri, ikinci kaynak olan sünnet ve hadise yönelmişler ve bu alanda ulaştıkları kaynaklardan hüküm istinbat etmeye çalışmışlardır. Ancak ne var ki; konuyla ilgili olarak ulaşılan rivayetler bazen lafız ve mana olarak farklılık arz etmiş, bazen aynı rivayet, farklı görüş sahiplerince mesnet kabul edilmiş, bazen de bu rivayetlerin sıhhati noktasında gerekli titizlik gösterilmeden kullanılması cihetine gidilmiştir. İşte bu noktada, fakihlerin üzerine hüküm bina ettikleri bu rivayetlerin incelenmesi büyük önem arz etmektedir. Biz de bu araştırmamızda, üç talak konusunda ortaya çıkan görüşlerin kendilerine delil kabul ettikleri hadislerin rivayet tekniği açısından incelemesini ve tahricini yaparak bu rivayetlerin sıhhatini ve delalet ettikleri manaları ortaya çıkarmaya çalışacağız."
