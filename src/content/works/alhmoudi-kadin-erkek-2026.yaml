abstract: "Sünnet-i Seniyye, şer'î ahkâmın ve mukaddes nassların Kur'an-ı Kerim'den sonraki asli kaynağı olup, sosyal hayatta adalet ve hakkaniyet ilkelerin tesisinde muazzam bir katkı sağlamıştır. Bu köklü şer'î esasların en somut tezahürlerinden biri de kadının yaratılıştan gelen saygın konumunu güvence altına alan ve hayatın muhtelif safhalarında maruz kalınabilecek her türlü haksız ayrıcalığı bertaraf eden bir haklar manzumesi vazetmiş olmasıdır. Bu temel asıllardan hareketle kaleme alınan bu araştırma; İslam şeriatının kadına bahşettiği bir dizi şer'î hakkı tetkik etmek suretiyle, Sünnet-i Seniyye'in kadın ile erkek arasında bir ayrım gözetmeksizin ve hiçbir cinse bir imtiyaz tanımaksızın ortak haklara verdiği ehemmiyeti ortaya koymayı amaçlamaktadır. Çalışmanın nihai hedefi ise; İslam'ın kadının hukukunu gözetmediğini ve onu pek çok fıtri hakkından mahrum bıraktığını iddia eden modern dönem (oryantalist) ithamların, sahih şer'î delillerle çürütülmesidir. Belirlenen bu ulvi amaç doğrultusunda, araştırmanın metodolojik altyapısı tanzim edilirken; kadının hukukuna dair hadislerin bir araya getirilmesi ve bu konudaki sahih rivayetlerin izinin sürülmesi amacıyla“tümevarım yöntemi”kullanılmıştır. Bunun yanı sıra, söz konusu nassların ihtiva ettiği ahkâmı ve şer'î maksatları netleştirmek ve bunları kadının İslam'daki saygın konumunu yansıtan teşriî bağlamla ilişkilendirmek adına“çözümleyici-betimsel yöntem”benimsenmiştir. Belirli bir çerçevede yürütülen bu çalışma, temelde beş asli hak ile sınırlıdır: Birincisi; kadın ile erkek arasında hiçbir ayrım yapılmaksızın kadının ilim tahsil etme hakkıdır. Bu başlık altında, kadının marifet yolundaki aktif rolü ile müphem gördüğü her hususta soru sorma ve fetva talep etme hürriyeti hadis nassları ışığında incelenmiş; böylece Sünnet'in kadının zihnî ve ilmi inşasına verdiği ehemmiyet ön plana çıkarılmıştır. İkincisi; kadının şer'î ilimleri tebliğ etme, insanlara muallimlik yapma, emr-i bi'l-ma'rûf ve nehy-i ani'l-münker (iyiliği emredip kötülükten sakındırma) faaliyetlerindeki rolünü inceleyen ve irşad vazifesinin erkeğe has ve munhasır olmadığını ortaya koyan tebliğ ve davet hakkıdır. Üçüncüsü; kadının iktisadi bağımsızlığını (müstakil zimmet-i maliyesini) teyit eden; hiçbir haksız kısıtlama (hacr) veya hak mahrumiyeti olmaksızın alım-satım, tasadduk ve benzeri her türlü mali tasarrufta bulunabilme salahiyetini gösteren mülkiyet ve mali tasarruf hakkıdır. Dördüncüsü; kadının —ister bakire (bikir) ister dul (seyyib) olsun— rızasının nikâh akdinin sıhhatinde kurucu bir şart kabul edildiğini ve evlilikte zorlamanın (ikrahın) şer'an geçersizliğini beyan eden eş seçme hakkıdır. Buna göre kadın, evlenmek istediği kişiyi seçmede veya istemediği adayı reddetmede mutlak bir irade hürriyetine haizdir; velisinin onu rızası hilafına bir evliliğe icbar etme yetkisi yoktur, şayet böyle bir dayatma vuku bulursa kadının bu nikâhı iptal ettirme hakkı mahfuzdur. Beşincisi ve sonuncusu ise; evliliğin devamının imkânsız hale geldiği durumlarda, geçimsizlik (şikak) sebebiyle kadının meşru yollardan talak veya muhâlea (hul'/bedel karşılığı boşanma) talep edebileceğini gösteren evlilik birliğini sonlandırma hakkıdır. Yürütülen bu kapsamlı araştırma neticesinde şu önemli sonuçlara ulaşılmıştır: Sünnet-i Seniyye, kadının haklarına dair adalet ve onurlandırma eksenli bütüncül bir tasavvur sunmuştur. Üstelik bu tasavvur, salt nazari bir söylem düzeyinde kalmamış; kadının şer'î sınırlar dahilinde güçlendirilmesine ve cemiyet hayatının muhtelif alanlarına katılımına katkı sağlayan, erkekle fıtri bir bütünlük ve denge oluşturan ameli uygulamalara dönüştürülmüştür. Son tahlilde; Sünnet-i Seniyye, kadının cemiyette şuurlu ve müessir bir şahsiyet olması için eğitim hakkını; İslamî değerlerin ve mukaddes ilmin yayılmasına ortak olması için davet hakkını; iktisadi yönden kendi ayakları üzerinde durabilmesi için mülkiyet hakkını; kendi şahsi kararlarını hür iradesiyle alıp huzurlu bir yuva kurabilmesi için eş seçme hakkını ve nihayet ailevi dengenin sarsıldığı durumlarda insanlık onuruna yaraşır bir hayat sürebilmesi için ayrılık/talak hakkını güçlü bir biçimde tahkim etmiştir."
