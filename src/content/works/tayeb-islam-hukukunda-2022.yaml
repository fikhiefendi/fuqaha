abstract: "Araştırma, İslam şeriatında sulh konusunu ele alarak sulh kavramının dilbilimsel ve terminolojik açısından anlamını, benzer kelimelerini, sulhun önemini, meşruiyetini ve meşruiyetinin amacını açıklamaktadır .Ayrıca, Ayrıca İslam fıkhında mali işlemlerde uzlaşma hükümlerinin yanı sıra sınırlar, ceza ve cezalarda uzlaşma hükümlerine açıklık getirmiş ve ayrıca İslam hukukunda uzlaşma bölümlerini açıklamış ve eşler arasında uzlaşma ile de başladık. mezhepler ve kabileler arasında ve ortaklar arasında uzlaşma gibi. Müslümanlarla kâfirler arasındaki sulh ve çeşitlerini de açıklamaya çalışmaktadır. Barışın yasal hükümlerini gerçeğe bağlamak. çalışmakla birlikte, bu hükümlerin çatışmaları sona erdirme ve barışçıl ve güvenli bir yaşam sağlama potansiyeli, sulh hükümlerine bağlı kalarak hasımlar arasındaki anlaşmazlıkların giderilmesi ve sulhun bu konudaki önleyici rolü, İslam, Kur'an-ı Kerim ve Sünnet tarafından teşvik edilen ve erdemli bir iş olarak kabul edilen ara bulmanın önemi, toplumsal barış ve insanların bilinçlendirilmesinin önemi gibi önemli konuları incelemektedir. Çalışma, Kur'an-ı Kerim ayetlerinde ve hadislerde belirtildiği gibi, düşmanlar arasındaki anlaşmazlıkları ortadan kaldırmanın yollarını açıklığa kavuşturmayı, aralarındaki soruna bakış açılarını yaklaştırmayı ve ihtilafların çözümünde şerî çözüme bağlı kalmayı amaçlamaktadır. Çalışmamızda tümevarımsal ve analitik yöntemi izledik ve dört mezhebin mutemet fıkhî kitapları ve konuyla ilgili daha önceki çalışmaları okuduk. Ayrıca Hanefî, Malikî, Şafiî ve Hanbelî olmak üzere dört mezhep arasındaki karşılaştırmalı fıkıh çalışmalarından da faydalandık. Bu tez, sulh sözleşmesinin beraat, iskat ve iltizam açısından en önemli etkileri, sulh ispat etme ve sulh sözleşmesinin feshi yöntemleri hakkında konuşarak sonuçlandırılmıştır"
