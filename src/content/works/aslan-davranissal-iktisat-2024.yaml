abstract: "Para talebi, iktisat literatüründe tüketici davranışlarının yakından ilişkili olduğu bir kavram olarak ifade edilmektedir. Diğer taraftan merhamet ise her insanda hatta hayvanlarda olduğu öngörülen bir güdü olarak bilinmektedir. Bu bilgiler, insan ile yakından ilgili olan bir güdünün, tüketici davranışlarında, dolayısıyla da para talebi üzerinde etkili olabileceği fikrinin ortaya çıkmasına yol açmıştır. Zaten son yıllarda insanların davranışları da davranışsal iktisat çerçevesinde incelenmektedir. Bu tez kapsamında öncelikli amaç, bireylerinin merhamet güdüsü ile para talebinde bulunup bulunmadığını ortaya koyma ve para talebi denklemine merhamet güdüsünü ilave ederek literatüre bir katkı sunmaktır. Bunu ortaya koyabilmek adına örneklem olarak, TR90 Doğu Karadeniz Bölgesi kapsamında; Artvin, Giresun, Gümüşhane, Ordu, Rize ve Trabzon illerinde ikamet eden 18 yaş üstü gelir sahibi bireyler seçilmiş ve bu çerçevede anket çalışması yapılmıştır. Anket çalışmasında, halihazırda psikolojide kullanılan merhamet ölçeği ve para talebine ilişkin sorulara yer verilmiştir. Anket çalışması Haziran 2022-Mayıs 2023 tarihleri arasında gerçekleştirilmiştir. Çalışma kapsamında kullanılan örneklem hacmi ise 461'dır. Analiz iki aşamadan oluşmaktadır. Birinci aşamada, merhamet güdüsünün reel para talebi içinde varlığı sorgulanmıştır. Bu aşamada, reel para talebi bağımlı değişken olarak kullanılırken, gelir, merhamet güdüsü, paranın kendi getiri oranı ve diğer finansal varlıkların getiri oranı bağımsız değişkenler olarak kullanılmıştır. Yapılan en küçük kareler analiz sonuçlarına göre; gelir, paranın kendi getiri oranı ve merhamet güdüsü reel para talebinin anlamlı birer değişkenleri olarak çıkmıştır. Merhamet güdüsünün reel para talebinin bir değişkeni olduğuna karar verildikten sonra, ikinci aşamaya geçilmiştir. İkinci aşamada ise yapısal eşitlik modellemesi kullanılarak, merhamet güdüsü ile para talebini etkileyen faktörler ortaya konulmaya çalışılmıştır. Bu aşamada kurulan yapısal eşitlik modellemesinde merhamet güdüsü ile para talebini; yaşam standartlarının, ekonomik faktörlerin, harcamaların ve satın alma gücü beklentilerinin etkilediği belirlenmiştir. Bu sonuçlar çerçevesinde, para talebi denklemine psikolojik bir faktör olan merhamet güdüsü eklenerek, para talebi teorisinin geliştirilmesi hedeflenmektedir."
