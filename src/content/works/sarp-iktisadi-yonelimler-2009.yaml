abstract: "Araştırılan konu, ?İktisadi Yönelimler ve İş Tercihleri Üzerinde Sosyo-Kültürel Değerlerin Etkileri: Türkiye Finans Katılım Bankası Örneği?dir. Katılım bankacılığı Türkiye'de 1980'li yılların başında Özel Finans Kurumları statüsünde hayat bulmuştur. Daha çok muhafazakar kesimin faiz hassasiyeti göz önüne alınarak hazırlanan bu yapı; nakit para alışverişi yerine peşin ve indirimli mal alımı yapma ve kredi borçlusuna vadeli ve karlı satış ile faiz yerine kar payı alma ve verme esasına göre hazırlanmıştır. Genel itibariyle faiz hassasiyeti bulunan müşterilere hizmet veren katılım bankalarının çalışanları, sistemin aksaksız işlemesi ve müşterilere güven vermesi bakımından çoğunlukla aynı manevi hassasiyet seviyesinde kişilerden seçilmektedir. Katılım bankası çalışanları esas alınarak genel olarak çalışan kesimin iş tercihlerinde ve diğer iktisadi kararlarında kendi sosyo-kültürel değerlerinin etkilerinin ortaya konulması bu araştırmanın temel amacıdır.Araştırmada basit tesadüfi örnekleme modeli kullanılmıştır. Araştırmanın verileri nicel ve nitel araştırma teknikleri kullanılarak elde edilmiştir. Bilgi toplama aracı olarak anket, mülakat, gözlem ve kaynak taramasına başvurulmuştur. Araştırma, teorik ve uygulamalı çalışma olmak üzere iki safhadan oluşmuştur. Teorik bölümde; değerler, sosyo-kültürel yapı ve değer ilişkileri, iktisadi kavramlar ve iktisat-ahlak ilişkisi ve katılım bankacılığı kavramları ele alınmıştır. Buna ek olarak; Weber'in din, ahlak ve kapitalizm üstüne kuramı ile Ülgener'in din, ahlak ve iktisat üzerine görüşleriyle Osmanlı-Türk toplumu örneğinde din, ahlak ve iktisat ilişkilerinin tarihi arka planı incelenmiştir.Araştırmanın uygulama safhasında 54 soruda oluşan bir anket formu Türkiye Finans Katılım Bankası'nın Ankara şubelerinde çalışan farklı statüdeki 110 personele uygulanmıştır. Araştırmamıza göre; sosyo-kültürel değerlerin iş tercihleri üzerinde etkili olduğu, çalışanlarca katılım bankacılığının tercih edilmesinde dini değerlerin etkili olduğu ve tüketim tercihlerinde dini ve milli değerlerin belirleyiciliği görülmektedir."
