abstract: "Ebussuûd Efendi, İrşâdu's-Selîm ilâ Mezâyâ-l-Kitâbi'l-Kerîm adlı tefsîr eserinde bir bakıma ?Kur'ân Edebiyâtı? demek olan Belâgat ilmini, çok etkili bir biçimde kullanmış olmakla birlikte, Zemahşerî ve Beydâvî gibi belâğî tefsir yazan müfessirlerin eserlerinden, çok yararlanmıştır. Ebussuûd Efendi, tefsirinde belâgat uygulamalarına ne gibi açılımlar getirdiğini belirleyebilmek amacıyla çalışma konumuz, ?Ebussuûd Tefsîrinde Belâgat İlmi Uygulamaları? başlığı ile sınırlandırılmıştır. Bu çalışmamızda öncelikle ?Belâgat? ilmini ilgilendiren konular ve belâğî sanatlar, özellikle el-Kazvinî'nin el-Îzâh fî `Ulûmi'l-Belâğa adlı eserinin yanı sıra Telhîsu'l-Miftâh'ı ve es-Suyûtî'nin el-İtkân fî `Ulûmi'l-Kurân'ının ilgili bölümleri taranarak, tespitler yapılmıştır. Bu iki kaynak başta olmak üzere, diğer kaynaklardan da faydalanılmış, belâğî sanatlar için örnek gösterilen âyetler üzerinde çalışılmış ve belâgat ilmini oluşturan ?Meânî?, ?Beyân? ve ?Bedî'? dallarına göre tasnif edilmiştir. Ebussuûd tefsirinde belâgat uygulamalarının tespitinde ise, bu çalışma için birinci derecede göz önünde bulundurulan, İrşâdu'l-'Akli's-Selîm'de yer alan belâgat uygulamaları, el-Beydâvî'nin Envâru't-Tenzîl'i ve ez-Zemahşerî'nin el-Keşşâf'ı ile karşılaştırılarak ?İstiâre?, ?Müsteâr?, ?Kinâye?, ?Mecâz?, ?Teşbîh? terimleri, üzerinde durulmuş ve varılan sonuç, çalışmaya aktarılmıştır."
