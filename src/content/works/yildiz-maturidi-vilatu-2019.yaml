abstract: "Mâverâünnehir bölgesinin Semerkant şehrinde dünyaya gelen Ebû Mansur Mâturîdî (333/944), kelâm ve fıkıh alanında Hanefî mezhebinin önde gelen reislerindendir. Mâturîdi, kelâmî meseleler başta olmak kaydıyla ahlâki, sosyal ve fıkhî problemlere ilişkin getirdiği çözüm önerilerinde nasların yanında akla da gereken değeri ve önemi vermiş, farklı düşünceye sahip olana karşı müsamahayı ve ötekinin görüşlerine saygı göstermeyi sağlamış, gerek yaşadığı dönemde ve gerekse günümüzde görüşlerinden etkilenen ilim çevreleri ile bu ekole mensup toplumların bu husus baskın özellikleri olmuştur. Eserlerinden günümüze kadar ikisine ulaşabilmiştir. Bunlardan Te'vîlâtü'l-Kur'an ilk dirâyet tefsirlerinden birisi olmasının yanında, özellikle ahkâm ayetlerinin tefsirinde fıkhın usul ve meselelerine dair konulara genişçe yer vermiştir. Bu çalışmamızda Bakara suresi özelinde Mâturîdî'nin fıkhî görüşlerini incelemeye çalıştık. Üç bölümden oluşan çalışmamızda, Mâturîdî'nin hayatı ve eserleri, Hanefî geleneği içerisindeki konumu, içtihat ehliyetine sahip olup olmadığı, eğer sahipse hangi tabaka müçtehidi olduğu, fıkhi görüşlerinde Hanefîlerle aynı kanaatti paylaştığı yönler ile ayrı düşündüğü hususlar belirlenmeye gayret gösterilmiştir."
