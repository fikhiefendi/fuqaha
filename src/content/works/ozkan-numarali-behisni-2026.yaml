abstract: "Bu çalışmada, Hicrî 1324-1325 / Miladî 1907-1908 yıllarını kapsayan 188 numaralı Behisni (Besni) Şer'iyye Sicili'nin transkripsiyonu ve değerlendirilmesi yapılmıştır. Osmanlı Devleti'nin hukukî, idarî, sosyal ve ekonomik yapısına ışık tutan şer'iyye sicilleri, şehir tarihinin aydınlatılmasında önemli kaynaklar arasında yer almaktadır. İncelenen sicil defteri, Besni kazasının XIX. yüzyıl sonlarındaki toplumsal yapısı hakkında önemli bilgiler içermektedir. Çalışmada öncelikle şer'iyye sicillerinin tarihî önemi, belge türleri ve kayıt sistemi ele alınmıştır. Ardından Besni'nin tarihî gelişimi, idarî yapısı, sosyal ve ekonomik durumu değerlendirilmiştir. Sicilde yer alan ilâm, hüccet, tereke, vakfiye, ferman ve diğer belge türleri paleografik yöntemle okunmuş ve Latin harflerine aktarılmıştır. Belgeler içerik bakımından incelenerek Osmanlı taşra yapısına dair bilgiler ortaya konulmuştur. Araştırma sonucunda, Besni'nin Osmanlı döneminde önemli bir idarî ve sosyal merkez olduğu görülmüştür. Sicil kayıtları; aile yapısı, miras paylaşımı, vakıf sistemi, ekonomik ilişkiler ve toplumsal dayanışma gibi konularda önemli veriler sunmaktadır. Ayrıca merkez-taşra ilişkileri ile Osmanlı hukuk sisteminin taşradaki işleyişi de belgeler aracılığıyla takip edilebilmektedir."
