abstract: "Konvansiyonel bankacılığın maddi refahın adaletli şekilde dağıtılması ve sürdürülebilir bir ekonomik canlılığın sağlanması noktasında yeterince başarılı olamadığı artık kabul edilen bir gerçektir. Şu anki haliyle İslam bankacılığının faize dayalı bankacılığa ciddi bir alternatif olabilmesi ise uzak görülmektedir. Bunun için İslamî bankacılığın etkin finansman yöntemleri geliştirmesi gerekmektedir. İslamî bankacılığın ciddi bir alternatif olmasının önündeki en büyük engel ise onun murâbaha, icâre ve sukûk gibi, eşyaya dayalı finans yöntemlerine sıkışıp kalmasıdır. İslamî bankacılığın ruhuna ve tarihi gelişimine daha uygun olmasına rağmen mudârabe veya müşârake gibi güvene dayalı finansman yöntemlerinin hemen hemen hiç uygulan(a)madığı görülmektedir. Mudârabe finans yönteminin önündeki en büyük engel ise güvenilir ve yetenekli girişimcilerin bulunamaması/yetiştirilememesidir. Bu bağlamda MÜSİAD, ASKON gibi sivil toplum kuruluşları, tarihte örneklerini gördüğümüz sivil toplum kuruluşları gibi aktif bir rol oynayıp güvenilir/yetenekli girişimcilerin bulunması, yetiştirilmesi hatta bankalara karşı onlar adına bazı sorumluluklar üstlenmesi ve böylece İslamî bankacılığın finansman yöntemlerinin çeşitlenmesine katkı sunmaları kanaatimizce mümkün olabilir. Sivil Toplum Kuruluşları'nın (STK) bir nevi İslamî bankacılığa entegre olması anlamına gelen bu sürecin üç aşamalı yürütülmesi mümkün olabilecektir. STK'ların bu süreçte üstlenebilecekleri roller, kolaydan zora, reelden ideale doğru şu şekilde sıralanabilir: 1- Güvenilir girişimcilerin bulunması/yetiştirilmesi sürecine dâhil olmak. 2- Finanse edilen girişimin faaliyetlerini takip etmek, ihtiyaç durumunda danışmanlık yapmak ve elde ettiği bilgileri İslamî banka ile paylaşmak. 3- Kâr-zarar sürecine dâhil olarak, girişimin gerçek tarafı olmak."
