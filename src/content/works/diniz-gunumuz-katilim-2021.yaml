abstract: "Günümüzde katılım bankacılığı ile Osmanlı dönemindeki para vakıfları faaliyette bulundukları ekonomik sistem içerisinde, İslami usuller doğrultusunda, bölgesel ve ulusal düzeyde finansal uygulamalarda bulunur. Her iki kurumsal yapının da faizi yasak kabul etmesi, buna mukabil İslam dininin kabul ettiği finansal faaliyetlerde bulunması, ilk ortak noktaları kabul edilmiş ve birbirlerine benzetilmelerine neden olmuştur. Osmanlı dönemi para vakıflarının daha çok bölgesel organizasyonlar olması, kuruldukları bölgelerde sosyal dayanışma ve işbirliği faaliyetlerinde bulunması ile toplumsal kalkınmaya önemli katkıda bulunmuştur. Katılım bankaları ise günümüzde banka adı altında ulusal çapta faaliyette bulunmakla beraber ülke ekonomisine önemli katkılarda bulunmaktadırlar. Bu araştırmamızda katılım bankalarının ve para vakıflarının içinde bulundukları ekonomik sistem ve dönem, hitap ettikleri toplum, finansal işleyişleri ve uygulamaları açısından incelenmiştir."
