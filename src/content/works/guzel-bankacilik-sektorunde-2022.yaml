abstract: "Katılım Bankaları son otuz yılda hitap ettiği kesim ve sunduğu farklı enstrümanlarla finansal sektörün ve bankacılık sisteminin önemli bir parçası haline gelmiştir. Sektörde faaliyet gösterdiği diğer bankalar ile performans karşılaştırmasının yapılması, sektördeki yerinin ve katkısının izlenebilmesi açısından önemlidir. Bu çalışmada temel amaç, Türk bankacılık sisteminde yer alan seçilmiş üç Katılım Bankası (Albaraka Türk A.Ş, Kuveyt Türk, Türkiye Finans) ve üç özel bankanın (Türkiye İş Bankası A.Ş, Türkiye Garanti Bankası A.Ş, Yapı ve Kredi Bankası A.Ş) Mart 2009 - Eylül 2020 tarihleri arasında performansları arasında fark olup olmadığının mukayeseli olarak incelenmesidir. Panel veri analizi yöntemi ile yapılan araştırma sonucunda ele alınan dönemlerde Katılım Bankalarında ROA'nın bağımlı değişken olduğu modelde, Sanayi Üretim Endeksi, Dolar Kuru, GSYİH büyüme oranı ve Toplam Mevduat/Toplam Aktif değişkenleri ile ROE'nin bağımlı değişken olduğu modelde Takipteki Alacaklar (Brüt)/Kullandırılan Fonlar, Toplam Mevduat/Toplam Aktif, Sanayi Üretim Endeksi, Dolar Kuru ve GSYİH büyüme oranının bağımlı değişken ile istatistiki olarak anlamlı olduğu saptanmıştır. Özel bankalarda ROA'nın bağımlı değişken olduğu modelde yalnızca Sanayi Üretim Endeksi anlamlı iken ROE'nin bağımlı değişken olduğu modelde, Toplam Kredi/Toplam Aktif ve Toplam Mevduat/Toplam Aktif oranı ile bağımlı değişken arasında anlamlı bir ilişkiye sahip olduğu sonucuna ulaşılmıştır."
