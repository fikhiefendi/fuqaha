abstract: "Finans ihtiyacı, her toplumda olduğu gibi Osmanlı toplumunun ekonomik hayatında da var olagelen bir sorundur. Tarihi süreç içerisinde bu sorun farklı yöntemlerle çözülmeye çalışılmıştır. Bu çalışmada; klasik dönem Osmanlı toplumunda finans temininde kullanılan yöntemlerin tespiti ve incelenmesi esas alınarak bu yöntemler kapsamında pratikte fıkhın işlerliği, belli bir zaman aralığında hukukun uygulamadaki farklılıkları ve ekonomik gelişiminin gözlemlenmesi amaçlanmıştır. Bu bağlamda yaklaşık 146 yıllık bir dönem (1455-1601) Osmanlı şer'iyye sicilleri üzerinden incelenmiştir. Çalışmada, günümüze ulaşan sicillerin en erken tarihlisi olan 1455-1456 tarihli sicili içeren ve XV. yüzyıla ait olan sicilleri günümüze ulaşabilen İslam dünyasının yegâne sicil koleksiyonu olup Osmanlı adlî ve idarî bürokrasisinde defter ve sicil geleneğinin teşekkülü hususunda önemli bir konumda olan Bursa Sicilleri esas alınmıştır. Bursa Sicilleri arşivinde incelenen dönemle ilgili 199 adet sicilin mevcut olduğu tespit edilmiştir. Bu sicillerin tamamının kısıtlı bir süre zarfında incelenmesi zor olduğundan söz konusu döneme dair bir fikrin oluşması için belirli kriterlere göre 9 adedi seçilerek incelenmiştir. XV-XVI. yüzyıl Bursa Sicillerinde bey' bi'l-vefâ, bey' bi'l-istiğlâl, karz-ı hasen, muâmele-i şer'iyye, icâre (kira), mudârebe, müsâkât ve selem usullerinin finans temininde kullanıldığı tespit edilmiştir. Bu yöntemlerin, meşruiyetleriyle ilgili en ciddi tartışmaların yapıldığı dönemde en yaygın şekilde kullanıldığı görülmektedir. Sicillerde söz konusu yöntemlere ilişkin elde edilen bulgular; çalışma hedeflerine bağlı olarak araştırılan dönemde en çok başvurulan klasik fıkıh kitapları, Osmanlı hukuk düşüncesini etkileyen başlıca kaynaklar, söz konusu dönemde telif edilen fıkhî kitaplar, fetvalar, tarihî kitaplar ve doğrudan çalışma konusuyla ilgili yazılan çalışmalar esas alınarak tahlil edilmiştir. Uygulamalara bakıldığında Osmanlı Devleti'nin; ulemanın öncülüğünde şer'î ve örfî hukuk çerçevesinde dönemin şartlarını dikkate alarak toplumun, ihtiyacı olan finansı temin edebilmesi için hukukî yollar aradığı anlaşılmaktadır. Çalışma giriş, dört bölüm, sonuç ve ekler kısmından oluşmaktadır: Girişte; çalışmanın konusu, önemi, amacı, kaynakları ve yöntemi ele alınmıştır. Birinci bölümde, siciller farklı yönleriyle tanıtılarak hukukî değerlendirmesi yapılmış, finans temininde kullanılan yöntemler tespit edilerek uygulama sayısı tablo ve grafiklerle veri olarak gösterilmiş ve finans temin yöntemleri ile yapılan akitlerde kullanılan para birimleri üzerine durulmuştur. İkinci bölümde bey' bi'l-vefâ ve uzantısı bey' bi'l-istiğlâl, üçüncü bölümde karz-ı hasen ve muâmele-i şer'iyye ve dördüncü bölümde icâre ile sınırlı sayıda uygulamalarına rastlanan diğer yöntemlerin üzerinde durulmuştur. Sonuç kısmında, ulaşılan sonuçlara, konuya ilişkin bundan sonra yapılabilecek çalışmalara ve eklerde ise finans temin yöntemleri ile alakalı olan kayıtların tablolar halinde özetlerine, sicillerdeki kayıtların dilini ihtiva eden tablolara ve sicillerin ilk ve son varaklarına yer verilmiştir. Anahtar Kelimeler: Osmanlı Hukuku, Bursa Şer'iyye Sicilleri, XV-XVI. Asır, Finans Temin Yöntemleri, Fıkıh"
