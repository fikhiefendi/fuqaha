abstract: "İslâm hukuku, adalet ekseninde insanın yararını sağlamayı ve zararını gidermeyi gâye edinmektedir. Bu gâyenin kusursuz bir şekilde gerçekleşmesi, zararlı sonuçlar doğurabilecek bazı yolların yasaklanmasını gerekli kılmaktadır. Zira genel olarak mubah ve serbest olan davranışların bazı durumlarda zarara yol açması söz konusu olabilir. Bu durumda bu tür davranışların yasaklanması gerekir. İşte bu doğrultuda bu engellemeyi sağlayacak bir yöntemin işlevselliği önem arz eder. Bu öneme binaen İslâm hukukunda bir hüküm istinbat kaynağı olan sedd-i zerâi ele alınmıştır. Bu çalışmanın amacı, 'kötülüğe götüren yolların/vesilelerin kapatılması/engellenmesi' diye ifade edilen, İslâm hukuk kaynaklarından biri olan sedd-i zerâinin kaynak değerini, önemini ve aktüelliğini göstermektir. İslâm hukukunda sedd-i zerâinin hukuk mantalitesi olan“bireylerin, bilinçli ya da bilinçsiz olarak hukukun ruhuna aykırı davranışlar sergilemesinin önlenmesi”aktüel açıdan ele alınmaya çalışılmıştır. Tez, giriş ve beş bölümden meydana gelmektedir. Girişte; çalışmanın amacı ve yöntemi hakkında bilgi verilmiştir. Sonraki bölümlerde sırasıyla, hukuk ve fıkıh kavramları; İslâm hukukunun özellikleri, amacı ve İslâm hukukunda kaynak kavramı;“sedd-i zerâi”kavramı, kaynak değeri ve fıkıh ekollerinin söz konusu delile yaklaşımı açıklanmaya çalışılmıştır. En son bölümde ise sedd-i zerâi'nin aktüel değeri üzerinde durulmuştur."
