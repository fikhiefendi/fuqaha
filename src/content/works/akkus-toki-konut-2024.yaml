abstract: "İnsanlığın en önemli ihtiyaçlarından birisi kuşkusuz barınmadır. Özellikle son yüzyılda, meydana gelen sosyal ve ekonomik gelişmelerin neticesinde hızlanan şehirleşmenin de etkisiyle bu ihtiyaç ciddi bir şekilde hissedilmiştir. Bu ihtiyacın fertlere bakan yönü olduğu gibi toplumsal yönü de bulunmaktadır. Zira barınmanın, çözüm bulunması gereken önemli bir toplumsal sorun olduğu yadsınamaz bir gerçektir. Ülkemizde toplumsal konut ihtiyacının çözümüne yönelik Toplu Konut İdaresi (TOKİ), kanunla kendisine verilen görev çerçevesinde pek çok çalışma yapmaktadır. Çalışmamızın ana konusu, konut üretiminde TOKİ tarafından en çok uygulanan yöntem olan yoksul, alt, dar ve orta gelirli vatandaşlara yönelik geçmiş altı ayda gerçekleşen, enflasyon veya memur maaş artış oranında fiyat güncellemesi esasıyla yapılan konut edindirme uygulamalarıdır. Üç bölümden oluşan çalışmamızın birinci bölümünde, konut ihtiyacı hakkında genel bir değerlendirme yapılarak TOKİ'nin bu konudaki rolü ve yaptığı katkı tespit edilmeye çalışılmıştır. İkinci bölümde, yapılan satış sözleşmelerinin, konutun inşa edilip edilmemesine bağlı olarak farklı hüküm doğuracağı hususu dikkate alınarak sözleşme şartları, fiyat belirsizliği, değer kaybının izalesi ve vade farkı konuları incelenmiştir. Üçüncü bölümde ise TOKİ sözleşmelerinin, istisnâ' akdi, finansal kiralama sözleşmesi ve mortgage kredisi gibi akit türleriyle kıyaslaması yapılmıştır. Çalışmamızda TOKİ konut edindirme sözleşmelerinin İslam hukukundaki satım akdi, finansal kiralama sözleşmesi ve istisnâ' akdiyle benzer yönlerinin bulunduğu, bulunla beraber mortgage uygulaması gibi bir kredi işlemi olmadığı sonucuna ulaşılmıştır."
