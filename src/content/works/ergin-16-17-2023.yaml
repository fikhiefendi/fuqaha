abstract: "Memlük sultanı Baybars'ın yargı ve iftâ sisteminde dört mezhebe geçilmesine dair aldığı karar ile fıkıh tarihinde yeni bir dönem başladı. Önceki yüzyıllarda mezhepler arası rekabet sebebiyle ve hukukî istikrarı korumak amacıyla âmmîlerin diğer mezhepleri taklid etmelerine ulema arasında olumlu bakılmazken Memlükler döneminde kişilerin mezhepler arasında intikal etmeleri tartışılmaya başlanmış ve âlimlerin önemli bir kısmı bu uygulamaya sıcak bakmıştır. Mezhepler arası intikal meselesi zamanla telfik tartışmalarına evrilmiştir. Telfik konusu avamdan olan kişilerin farklı mezhepleri taklid etmeleri neticesinde her iki mezhebin de kabul etmediği bir görüşün meydana gelmesi sonucu ortaya çıkabildiği gibi mahkemelerde farklı mezhep kâdılarına başvurmak suretiyle de gerçekleşebilir. Aynı şekilde bazı Hanefî fakihler mezhep içerisinde iki farklı görüşü birleştirmek suretiyle yeni bir görüş elde etmek suretiyle fetvalar vermişlerdir. Mezhepler arası intikal ve telfik konusuyla ilgili artan bu tartışmalar üzerine 10.-11./16.-17. yüzyıllarda mezkûr problemleri ele almak için Mekke ve Kahire'de yaşayan âlimler risaleler kaleme almışlardır. Risalelerde bu konular usul, fetvâ, yargı gibi çeşitli açılardan irdelenmiştir. Bu çalışmada, söz konusu literatür çerçevesinde zikredilen yüzyıllarda ve coğrafyadaki fıkhî tartışmalar hukukî esneklik ve istikrar bağlamında incelenecektir. Anahtar Kelimeler: Memlükler, Osmanlılar, risale, taklid, telfik, hukukî istikrar"
