abstract: "Bu çalışma Afganistan'ın hem hukuk sisteminde hem de toplumsal örfünde evlilik hükümlerini ve uygulamalını konu edinmektedir. Çalışmanın temel amacı, İslam aile hukuku hükümlerinin uygulandığı ve ağırlıklı olarak Hanefi mezhebinin yaygın olduğu Afganistan'da evlilikle ilgili yürürlükteki hukuki mevzuat ve örfi uygulamaları tespit ederek Türkiye'deki İslam hukuku araştırmalarına katkı sağlamaktır. Afganistan'ın aile hukuku ve geleneksel evlilik adetleri ile yanlış uygulamalar hakkında ihtiyaç duyulan bilgiyi ortaya koymak da yine çalışmanın amaçları arasında yer almaktadır. Tarih boyunca bütün toplumlarda aileye ve aile hayatına büyük önem atfedildiği malumdur. Ailenin toplumun temelini oluşturduğu fikrinin anayasalara girmiş olması ailenin önemini göstermektedir. İslam din olarak aileye ayrı bir önem atfetmiş ve bu meyanda bizzat Kur'an tarafından önemli hukuki düzenlemeler koymuştur. Bir İslam ülkesi olan Afganistan'da aile hukuku İslam hukukuna göre düzenlenmiş olmakla beraber farklı etnik gruplardan oluşan Afgan toplumunda güçlü yerel örf adetlerin de bu bağlamda ciddi etkisi ve rolü bulunmaktadır. Bu örfi uygulamaların İslam hukuku açısından uygun olmayan pek çok yönleri bulunmaktadır. Çalışmada bunlara da zaman zaman işaret edilmiştir. Çalışma bir giriş ve iki bölümden oluşmaktadır: Birinci bölümde evlilik öncesi aşamalar iki alt başlık halinde ele alınmıştır. Birincisinde evlenmeden önce tarafların birbirleriyle görüşmesi hakkında bilgi verilerek dini/hukuki yönü açıklanmıştır. İkinci alt başlıkta ise evlenme teklifinin yapılması ve nişanlanma aşaması hakkında bilgi verilerek hukuki yönü ile Afgan örfi uygulamaları yönünden açıklanmıştır. İkinci bölümde evliliğin hukuki sonuçları ana başlığı altında dört alt başlıkta ele alınmıştır. Burada kadının kocası üzerindeki mali ve mali olmayan haklar, kocanın karısı üzerindeki haklar, çocuğun nesebi ve bakım ve terbiyesi konuları incelenmiştir."
