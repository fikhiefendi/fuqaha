abstract: "Bu çalışmada, kripto varlıkların bir alt grubu olan kripto paraların İslam hukuku açısından semen/satım bedeli olma yönü incelenmiştir. Araştırmanın amacı, herhangi bir otorite tarafından üretilmeyen ve değerleri son derece değişken olan bu kripto varlıkların, İslam hukuku açısından para olma vasfının ve bunlarla bir mal veya hizmetin satın alınmasının mümkün olup olmadığının tespit edilmesidir. Buna göre, çalışmada öncelikle kripto paranın tanımı, kavramın ideolojik, sosyolojik ve teorik temelleri, bu paraların hangi amaçla ve nasıl üretildiği, piyasaya arz edilme yöntemleri, çeşitleri, olumlu ve olumsuz yönleri, nasıl ve ne amaçla temin edildiği konuları ele alınmıştır. Akabinde semenin satım akdindeki yeri ve semenin ıstılahî manası tespit edilmeye çalışılmış, semenle yakın ilişkili olan kavramlar ve bunların semenle ilişki yönleri ile İslam hukukçularının semenle ilgili görüşlerinden hareketle semen çeşitleri ve satım akdine etkisi yönünden semende aranan şartlar tespit edilmeye çalışılmıştır. Kripto paraların piyasaya para olarak arz edilmeleri ve literatürde paranın semeniyyet vasfını taşıması yönünden birinci sırada yer alması hasebiyle para konusu detaylı olarak ele alınmış ve bu bağlamda paranın unsurlarının, işlevlerinin ve özelliklerinin ne olduğu üzerinde detaylıca durulmuştur. Çalışmanın son bölümünde kripto paraların İslam hukukuna göre semende aranan şartları taşıyıp taşımadığı, semense hangi semen türüne dahil olduğu ve kripto parayla yapılan akitlerin türünün ve hükmünün ne olduğu meselelerine cevap aranmıştır. Bu bağlamda kripto varlıkların İslam hukuku açısından maddî mal olmadığı bununla birlikte literatürde maddî varlığı olmayan menfaatlerin ve birtakım hakların gayri maddî/manevî mal olarak kabul edilip alım-satımına cevaz verilmesinden hareketle teorik olarak gayri maddî mal kapsamına dahil olmasının mümkün olduğu kanaatine ulaşılmıştır. Halihazırda kripto paraların olumsuz yönlerinin faydalarından daha çok olması hasebiyle mütekavvimlik vasfını haiz oluşu şüpheli olduğundan Hanefilere göre gayri mütekavvim mal ile cumhura göre muhterem mal kavramı arasında bir yerde olduğu kanaati oluşmuştur. Kripto varlıkların değerlerinin aşırı değişken olması ve yapılan işlemlerin sistemsel olarak iptal edilememesi, alışverişlerde aşırı aldanma ihtimalini arttırdığından satım bedeli olmasının caiz olmadığı; paranın unsurlarını henüz tam manasıyla taşımadığından para olarak kabul edilemeyeceği, bununla birlikte faiz şüphesinin bertaraf edilmesi için rayiç paralarla mübadelesinde sarf akdinin şartlarına riâyet edilmesi gerektiği, sermayenin para olması şart kılınan ortaklık akitlerinde para olma vasfını tam taşımadığından sermaye olmaya elverişli olmadığı tespit edilmiştir."
