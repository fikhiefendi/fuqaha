abstract: "Enbiyâ sûresi kıyametin yaklaşmasından bahseden ve kıyamet ile ilgili konuları ele alan Mekkî sûrelerden biridir. Önceki ümmetlerin durumunu da konu etmektedir. Enbiyâ sûresi nebi ve resullerden bahsetmekten yanı sıra onların ümmetlerinin durumu, Hz. Muhammed'in ümmeti ile karşılaştırmaktadır. Allah'ın, kavimlerine karşı peygamberlerine nasıl yardım ettiğini, dualarını kabul ettiğini beyan etmektedir. Enbiyâ sûresi dünya ve ahirette müminleri güzel bir sonuç beklediğini açıklamaktadır. Mekâsidü'ş-şerîa' ilmi İslâm şeriatın önemli ilimlerinden bir tanesidir. Bu ilimden maksat Allah'ın Kur'an-ı Kerîm'in âyetlerinde kastettiklerinin bilinmesidir. İslâm şeriatı kulları ilgilendiren bazı amaç ve maksatlar doğrultusunda gelmiştir. Zira yüce Allah'ın işleri abesten münezzehtir. Allah'ın vahyinin amacı maslahatların celbi ve kötülüklerin defi ile kulları ıslah etmektir. Enbiyâ sûresinde birçok önemli mekâsidü'ş-şerîa' diye tabir edilen şer'i maksatlar bulunmaktadır. Bu maksatları konu edinen mekâsidü'ş-şerîa' ilmi muteber ilimlerden olup kulların dünya ve ahiretle ilgili maslahatlarını, bu maslahatların gerçekleşmesini ve zararların giderilmesini amaçlamaktadır. Ayrıca İslam dininin gerçek suretini ortaya konulması ve Allah'ın murad ve maksadını bilinmesi de bu ilmin konuları arasındadır. Kuşkusuz farklı kitaplarda dağınık bir şekilde ve satır aralarında yer alan mekâsidü'ş-şerîa' ilmi teşekkül edene kadar birçok aşamalardan geçmiştir. Özel olanlar ise aile kanunu, kısas, yetimlerin malının korunması ve hayatın diğer birçok alanlarında olduğu gibi belli ve özel bir amacı gerçekleştirmeyi gaye edinmektedir. Ayrıca kudreti ile kâinatta tasarruf eden yüce Allah'ın tevhidi, O'nun peygamberlerine tabi olmak ve elleri ile yaptıkları putlar ile Allah'a ortak koşan müşriklerin azarlanması (tevbih), akıl ve kalplerine galebe çalan cehaletlerinden ötürü ölüleri çıkartmaya kudretlerinin olduğunu iddia edeler de bu sûrenin ele aldığı konular arasındadır. Enbiyâ sûresi Allah'ın kudretini gösteren, vahdaniyetini ispat eden âyetlerin maksatlarını da irdelemektedir. Allah'ın yer, gök, yıldızlar ve bütün kâinatın yaratmasındaki ve insanı yoktan var etmesindeki kudretini gösteren âyetlerle nazil olan Kur'an-ı Kerîm Allah'ın her şeye kadir olduğunu beyan etmektedir. Enbiyâ sûresi aynı şekilde nebi ve resullerin sıfatlarını ve onların insanları Allah'ın ibadetine çağırmak için gönderildiklerini açıklamaktadır. Yine peygamberlerin beşer cinsinden olup diğer insanlar gibi hayatlarını idame etmek için yiyip içtiklerini, ölümlü olduklarını ve beşerin ihtiyaç duyduğu her şeye muhtaç olduklarını dile getirmektedir. Yüce Allah peygamberlerini insanlar içerisinden seçip ibadetine davet etmek, Allah'ın dinini diğer batıl din ve mabutlara karşı yüceltmek için deliller ile teyit ederek göndermiştir. Dolayısıyla tarih boyunca peygamberlerin gönderilmesindeki amaç tehvid, doğru inanç, hakkın ihkakı ve batılın ortadan kaldırılması şeklinde olmuştur. Ayrıca Allah'ın peygamberlerine faziletleri, kıyametin alametleri de Enbiyâ Sûresinin üzerinde durduğu konular arasında yer almaktadır."
