abstract: "Osmanlı Devleti, İslâm Devletleri arasında en uzun ömürlü devletlerden biri olmuştur. Bu başarı, siyaseten güçlü idareciler ile birlikte köklü kurumlar sayesinde gerçekleşmiştir. Güçlü idarecilerden biri, XVI. asır hükümdarlarından Kanûnî Sultan Süleyman'dır. Kanûnî Sultan Süleyman dönemi şeyhülislâmlarının siyaset ve idareye etkisini konu alan bu çalışma, giriş ve üç bölümden oluşmaktadır. Girişte; tezin konusu, amacı, önemi, kaynakları ve yöntemi tanımlanmıştır. Birinci bölümde, Kanûnî'nin hayatına ve dönemin özelliklerine dair genel bilgiler verilmiştir. İkinci bölümde, şeyhülislâmlık kurumunun kökenleri ile Osmanlı Devleti'nde şeyhülislâmlık kurumu ele alınmıştır. Bununla birlikte Kanûnî döneminde görev alan yedi şeyhülislâmın biyografilerine yer verilmiştir. Üçüncü bölümde ise, fetvanın kökenine dair genel malumat aktarılmış ve incelenen dönemde görev alan şeyhülislâmların siyasete etkileri; iç siyaset ve dış siyaset açısından ele alınmıştır. İç siyaset kategorisinde; şeyhülislâmların padişah kararları, şehzade katlleri, aykırı tasavvufi akımlar, hukukî mevzuat ve vakıflar hakkındaki fetvalarına yer verilmiştir. Dış siyaset alanında ise, onların savaş kararı alınmasındaki etkileri aktarılmıştır. Sonuç olarak şeyhülislâmların birçok siyasi meseleye dair fetvaları olduğu tespit edilmiştir. Onların görüş ve fetvaları ile hem iç siyasette hem de dış siyasette üstlendiği önemli roller ortaya konulmuştur. 2025, ix + 124 Sayfa"
