abstract: "Çalışan insanlar; iş yoğunluğu, müşteri tutumu ve mesai arkadaşlarıyla olan ilişkilerden kaynaklanan gerekçeler sebebiyle strese maruz kalabilmektedir. Çalışanın maruz kaldığı streslere yönelik algının yüksek olması ve stres ile başa çıkamaması sonucunda psikolojik sorunlar yaşadığı gözlenmektedir. Bu çalışma, Türk katılım bankacılığı sisteminde iş stresinin örgütsel bağlılığa etkisinin incelenmesi amacıyla yapılmıştır. Bu araştırma, katılım bankacılığında yaşanan iş stresi ve örgütsel bağlılık arasında bir ilişki olup olmadığını ve iş stresinin örgütsel bağlılık üzerindeki etkisini araştırmaktadır. Araştırma Malatya ilinde çeşitli katılım bankalarında faaliyet gösteren 60 banka personeline uygulanmıştır. Araştırma verisinin hazırlanmasında kişisel bilgi formu, iş stres ölçeği ve örgütsel bağlılık ölçeği kullanılmıştır. Araştırmada elde edilen veriler SPSS for Windows 19.0 programı kullanılarak analiz edilmiştir. Sonuç olarak, yapılmış korelasyon analizinin sonunda iş stresinin, örgütsel bağlılıkla ters yönde ve anlamlı bir ilişkisi bulunmuştur. Bu sonuca göre, iş stresi azaldıkça, örgütsel bağlılığın arttığı görülmektedir."
