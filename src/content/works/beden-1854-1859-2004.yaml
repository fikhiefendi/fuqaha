abstract: "ÖZET Şehir tarihçiliği açısından günümüze ulaşabilen ve düzenli olarak tutulmuş olan en önemli belgelerden biri şer'iyye sicilleridir. Bir şehrin idari, sosyal, ekonomik ve demografik yapısı bu kayıtların dikkatlice incelenmesi sonucunda ortaya çıkarılabilir. Şer'iyye sicillerine göre, Osmanlı Devleti'nde aile hukuku tamamen îslam hukukuna dayanmaktadır. İncelenen Antalya örnekli belgelerde bunun Müslim - Gayr-i Müslim farkı gözetilmeden uygulandığı görülmüştür. 1854-1859 Tarihli Arasında Antalya (8 No'lu Antalya Şer'iyye Sicilleri Defterine göre) adlı bu tezde, ilk çağlardan XIX. yüzyıl ortalarına kadarki şehrin tarihi ana hatlarıyla belirtilmiştir, idari açıdan Teke Sancağı' nın Osmanlı Devleti İçerisinde önemli bir yere sahip olduğu anlaşılmıştır. Antalya iktisadi hayatında ziraat ve hayvancılığın çok önemli bir yer tuttuğu belirtilebilir. Tarımla uğraşanların genellikle hayvancılıkla da yaptıkları anlaşılmıştır. Şehrin ticareti Müslimlerden ziyade Gayr-i Müslimlerin kontrolü altındaydı. Sicillere göre, şehrin sosyal yapısının karışık bir düzen arz ettiği görülerek Müslimler ile Gayr-i Müslimlerin birlikte, iç içe yaşadıkları anlaşılmıştır."
