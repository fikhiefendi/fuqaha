abstract: "ÖZET İslam Dininin koyduğu prensipler çerçevesinde banka işletmeciliği yapan kuruluşlara İslam Bankası veya Faizsiz Banka denilmektedir. Günümüzde Faizsiz Banka (İslam Bankası) veya Faizsiz Bankacılık ( İslam Bankacılığı) uygulaması gittikçe yaygınlaşmaktadır. Faizsiz Banka'ların doğuşunu hazırlayan dini, ekonomik ve politik sebepler vardır. Müslüman halkın elinde, İslam Dini'nde faizin yasak oluşu nedeniyle bilinen banka sistemine gitmeyen tasarrufların değerlendirilmesi, islam ülkeleri arasındaki sosyal, kültürel,ekonomik ilişkilerin canlanması ve özellikle fon fazlası olan islam ülkelerden fon açığı bulunanlara doğru bir akımın gerçekleştirilerek bu ülkelerin ekonomik kalkınmalarına katkıda bulunulması v.s. gibi nedenlerle İslam Bankaları kurulması kararlaştırılmıştır. Bu konuda 1940'lı yıllarda başlayan fikir alnındaki gelişmeler uygulama alanında ilk neticesini, 1963 yılında Mısır'da kurulan bir İslam Bankası ile vermiştir. O yıldan bugüne kadar bir çok İslam Bankası kurulmuştur ve bugün dünyada çoğu müslüman ülkelerde olmak üzere 40 İslam Bankası mevcuttur. Faizsiz olarak, kâr-zarar ortaklığı esaslarına göre çalışmayı prensip edinen bu kurumların başlıca finansal yöntem ve araçları mudaraba, müşaraka, murabaha ve icaradır. Bunun yanısıra günümüz bankalarının diğer tüm işlemlerini de yapmaktadırlar. Bu kurumların Türkiye'de Özel Finans Kurumu adıyla kurulmasına 1983 yılı sonunda karar verilmiş ve iki Özel Finans Kurumu 1985 yılında ülkemizde faaliyetlerine başlamıştır. Daha önce bazı girişimlerin olmasına rağmen iki Özel Finans Kurumu'nun 1985 yılında Türkiye'de faaliyete geçmeleri ile birlikte gerçek anlamda faizsiz bankacılıkuygulamasının da ülkemizde başlamış olduğu söylenebilir. Bunları 1989 yılında Kuveyt Türk evkaf Finans Kurumu A.Ş., 1991 yılında Anadolu Finans Kurumu A.Ş., 1995 yılında İhlas Finans Kurumu A.Ş. ve 1996 yılında kurulan Asya Finans Kurumu A.Ş. izlemiştir. Bu kurumlar gittikçe gelişmekte, o oranda da Türkiye ekonomisine katkıları artmaktadır. Bunu diğer bankalara göre faizsiz, alternatif Finans yöntem ve araçlarıyla yapmaya çalışmaktadırlar. Son günlerde Barter (Takas), Risk Sermayesi (Faizsiz Kredi) gibi değişik finansman yöntemlerinin üzerinde durulduğu ve denenmeye çalışıldığı günümüz Türkiye'sinde oniki yıl önce faizsiz esasa göre çalışmak üzere kurulan bu kurumların yerine getirdikleri vazifenin gerek sosyal açıdan gerekse ekonomi açısından büyük öneme sahip olduğu düşünülmektedir."
