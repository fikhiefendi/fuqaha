abstract: "Bu araştırma, İslam ve Hıristiyanlık arasındaki tevhit öğretisini ve ilhad ile (ateizm) ilişkisini karşılaştırmalı bir çalışma şeklinde açıklamayı amaçlamaktadır. Araştırmada İslam, Hıristiyanlık, tevhit öğretisi, teslis ve ilhad (ateizm) kavramları sunulmaktadır. Araştırmada ayrıca İslam'daki tevhit ve Hıristiyanlıktaki teslis öğretisinin özellikleri de ele alınmakta ve ister tevhit ile ateizm arasında ilişki ters olsun ister teslis ile doğru orantılı bir ilişki olsun iki inanç ile ilhad arasındaki ilişki, tartışılmaktadır. Daha sonra araştırmada ilhadın nedenleri, başlangıcı ve bitişi ele alınmakta, İslam'ın bunlarla nasıl baş ettiği açıklanmakta, ardından mülhitlerle ortaya çıkan benzerlikler tartışılmaktadır. Araştırmada son olarak ilhadın kilise düşüncesiyle bağlantılı olarak yayılma nedenleri ve Hıristiyan din adamlarının uygulamalarıyla ilgili diğer nedenleri tartışılacaktır. Araştırmacı, İslam'daki tevhit öğretisi ile Hıristiyanlıktaki teslis öğretisi ile ilgili olarak alınan metinlerin izini sürerken tümevarımsal, betimleyici bir yaklaşım izlemiştir. Daha sonra tanımlayıcı analitik yöntem, toplanan metinleri analiz edecek, bunlar üzerinde yorum yapacak ve elde edilen çıkarımları ortaya koyacaktır. Çalışmadaki ana metot ise, araştırmacının her iki gruba göre tevhit veya teslis öğretisinin ispat ve reddedilmesi delilleri üzerinden iki inancı karşılaştırmaya çalışacağı karşılaştırmalı yaklaşımdır. Bu da iki inancı bir arada ele alan araştırma eksikliğinin ve ilhadın yayılıp yayılmamasının temsil ettiği araştırma boşluğunu doldurmak içindir. Araştırmacı, İslam kelimesinin Şeriat'ta ve Kur'an'da iki anlamı olması da dahil olmak üzere bir dizi sonuca ulaşmıştır. İslam'ın evrensel anlamı: Bütün mahlukatın kendi liderliğine teslim olduğu, Cenab-ı Hakk'a teslim olduğu İslam vardır. Bu evrensel anlamda İslam'ın hiçbir karşılığı ve cezası yoktur. İslam'ın şeri anlamıyla da mükelleflerin Allah'ın emirlerine boyun eğip teslim olmalarıdır. Bu ikinci mana aynı zamanda genel ve özel İslam ifadelerini de içermektedir. Üçlü Tanrı (teslis) düşüncesi Hıristiyan inancına pagan inanışlarının etkisi altında gelmiş olup, yalnızca tevhit inancının ilhad ile çeliştiği ve onunla mücadele ettiği, teslis öğretisinin neden olduğu zihinlerdeki yozlaşmayla yüzleşip onları ateizme doğru ittiği de çalışmanın vardığı sonuçlardandır."
