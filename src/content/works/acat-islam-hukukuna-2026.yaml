abstract: "Bu araştırma, teberru akitlerinde, müteberri'e tanınan rücû hakkının varlığını incelemektedir. Teberru akitleri, kişinin malvarlığını maddi bir karşılık beklemeden başkasının lehine eksiltmesini konu edinen tasarruflardır. Araştırmanın temel amacı, bu akitlerde mülkiyetin intikali ve akdin bağlayıcılığı kapsamında rücû hakkının sınırlarını ve hukuki sonuçlarını, fukahânın içtihatları ışığında ortaya koymaktır. Nitel araştırma yöntemlerinden literatür taraması ve doküman analizi kullanılarak, teberru akitleri rücû kastı taşıyıp taşımamasına göre sınıflandırılmıştır. Bu sınıflandırmaya dayalı olarak, rücû hakkının kişiye tanıdığı yetki genişliğine binaen hiyerarşik bir sıralama takip edilmiştir. Araştırmanın bulgularına göre, teberru akitlerinde rücû hakkı mutlak bir yetki olmayıp mülkiyetin intikali, akdin bağlayıcılığı, ahde vefa ilkesi ve tarafların maslahatı gibi fıkhî gerekçelerle sınırlandırılmaktadır. Vedîa ve âriyet gibi gayri lâzım akitlerde mülkiyet mutlak olarak devredilmediği için, kural olarak rücû hakkı korunmaktadır. Hibe ve vakıf uygulamalarında kabz, tescil veya üçüncü şahısların haklarının taalluk etmesi gibi engeller rücû hakkını düşürmektedir. Karz akdinde ise, belirlenen vadenin bağlayıcılığı, rücû hakkının kullanım zamanı ve şartları yönünden temel bir ayrım noktası teşkil etmektedir. Öte yandan rücû hakkının kapsamı, fukahânın teberru akitlerinde öncelediği unsurlara göre şekillenmektedir. Hanefîler, ivazsızlık ilkesinden hareketle mülkiyet sahibinin tasarruf yetkisinin tamamen kalkmadığını savunarak müteberri'e geniş bir rücû imkânı tanırken, Şâfiî ve Hanbelîler mülkiyetin intikalindeki kesinlik ilkesini merkeze alarak bu hakkı daraltmaktadır. Mâlikîler ise, irade beyanı, örf ve maslahatı belirleyici kabul etmektedir. Neticede, teberru akitlerinde müteberri'e kural olarak rücû hakkı verilmekte, ancak bu hak birtakım nedenlerle kısıtlanabilecek bir yetkiyi ifade etmektedir."
