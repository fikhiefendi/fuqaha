abstract: "Bu araştırmada; fıkıh usulü ilminde eser veren ulema arasında önemli bir yere ‎sahip ‎olan İmam Gazzâlî'nin ictihad konusu hakkındaki görüşleri, değerlendirmeleri, ‎izah ‎ve yaklaşımları ele alınmıştır. Araştırmada, Gazzâlî'nin fıkıh usulü alanında ‎önemli bir ‎yere sahip olan“el-Müstasfâ min ʿilmi'l-usûl”‎‏‎ adlı eserindeki ictihad ‎nazariyesi ‎‏yansıtılmaya çalışılmıştır. Ayrıca müellifin ictihad ile ilgili görüşleri ‎hakkında yapılan bir takım tenkitler değerlendirilmiş ve yer yer gerekli cevaplar ‎verilmeye çalışılmıştır.‎ Gazzâlî, ictihad anlayışını ortaya koyarken diğer usulcüler gibi Kitap, sünnet ‎ve icmâ delillerini kullanmıştır. Ancak bu delilleri kullanırken orijinal ictihad ‎metodolojisini ortaya koymuş, yer yer diğer usulcülerden farklı olarak bazı ilkeler ‎benimsemek suretiyle bunu ictihad nazariyesinde uygulamıştır. Söz gelimi, müellife ‎göre dördüncü şer'î delil istishâb delilidir ve müellif bunu akıl delili olarak da ‎nitelemiştir. Öte yandan kıyası, şer'î deliller arasında saymamıştır. Zira ona göre ‎kıyas, şer'î delillerden biri değil de hüküm çıkarma yollarından biridir. Ayrıca ‎Gazzâlî, müctehidin bilmesi gereken şer'î deliller arasında şer'u men kablenâ, sahâbî ‎kavlî, istihsan ve maslahat-ı mürseleyi saymamıştır. Nitekim bunları mevhûm asıllar ‎olarak nitelemiş ve muteber bir delil olarak görmemiştir. Bunun yanı sıra yetkin ve ‎muhakkik bir usulcü olan İmam Gazzâlî'nin ictihad nazariyesi incelendiğinde ictihad ‎nazariyesinin teşekkülünde İmam Şafii, Basra ‎Mu'tezile ekolü, Ebu'l-Hasen el-‎Eş'arî, ‎Ebû Bekir el-Bâkıllânî ve İmâmü'l-‎Haremeyn el-Cüveynî'nin izleri görülmektedir."
