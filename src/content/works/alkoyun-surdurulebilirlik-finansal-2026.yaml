abstract: "Kurumsal raporlama alanında günümüzdeki en önemli gelişmelerden bir tanesi olan sürdürülebilirlik açıklamaları gün geçtikçe birçok şirket tarafından benimsenmektedir. Hem şirketlerin kendi risk yönetimi açısından hem de paydaşların yatırım yapma, ortaklık kurma gibi nedenlerle ihtiyaç duyduğu bu bilgilerin standartlaşmasına ve karşılaştırılabilir olmasına duyulan ihtiyaç, 2023 yılında Uluslararası Finansal Raporlama Standartları Vakfı tarafından Uluslararası Sürdürülebilirlik Raporlaması Standartları'nın yayımlanmasına yol açmıştır. Bu standartlar Kamu Gözetimi, Muhasebe ve Denetim Standartları Kurumu tarafından çevirileri yapılarak yayımlanmış ve ülkemizde de uygulanmaya başlanmıştır. Çalışmamızda, belirlenmiş olan katılım ve geleneksel bankaların sürdürülebilirlik açıklamaları ile finansal performansları arasındaki ilişkinin panel veri analizi aracılığıyla belirlenmesi amaçlanmıştır. Bu kapsamda bankaların 2019-2024 yılları arasındaki kurumsal raporları Türkiye Sürdürülebilirlik Raporlaması Standartları üzerinden içerik analizine tabi tutularak sürdürülebilirlik açıklama kalitesi skorları hesaplanmış ve bağımsız değişken olarak modele dahil edilmiştir. Aktif kârlılık oranı, özkaynak kârlılık oranı ve net faiz marjının bağımlı değişken; aktif büyüklüğü ve sermaye yeterliliği oranının ise kontrol değişkeni olarak yer aldığı analizde sürdürülebilirlik açıklama kalitesi skoru ile finansal performans arasında istatistiksel açıdan anlamlı bir ilişki bulunamamıştır."
