abstract: "\"İslam borçlar hukukunda zaman ve hükümleri\" başlıklı bu doktora tezinde günlük hayatta oldukça fazla yer tutan mâlî işlemlerde kısmen ya da tamamen araya \"zaman\" girmesi durumunda o akdin hukuki bakımdan etkilenmesi meselesi incelenmiştir. Çünkü bazen tarafların bilinçli olarak şart koştukları süre ile akdin ya da satılan maldan kaynaklanan sebeplerle zorunlu olarak belirlenen süre, hukukta o yapılan işleme olumlu ya da olumsuz şekilde etki etmektedir. İşte bu etkinin sınırı, mahiyeti ve doğurduğu sonuçların izah edilmeye çalışıldığı bu araştırmada İslam âlimlerinin görüşleri, delilleri, müzakereleri ve tercih nedenleri bir araya toplanarak günümüz uygulamalarına bir altyapı oluşturmaya gayret edilmiştir. İslam'da mutlak olarak vakte bağlı olan namaz, oruç, zekât, hac gibi kulun Allah'a karşı sorumluluklarını düzenleyen ibadetlerin tamamı vakte bağlıdır. Bununla birlikte kulun diğer insanlarla olan ilişkilerini düzenleyen muâmelâtla ilgili konuların birçoğuyla da zaman konusu irtibatlıdır. -İslam hukukunda akitlerin sahih olabilmesi için öncelikle \"karşılıklı rıza\"dan bahsedilmişse de bu rızanın da akid yapma yaşına ermiş yani belli bir zamana ulaşmış kişilerden sâdır olmasının yanında bu rızaya delalet edecek lafızların da belli zamana işaret eden siygalardan oluşması elzemdir. Bu şartların hemen akabinde de birçok muhayyerlikte söz konusu olan 'zaman'dan ve onun süresinden bahsedilmesi, zamanın hem akitlerin bir parçası olduğunu hem de akitlere etkisini göstermesi açısından oldukça önemli olduğu tespit edilmiştir. Buna göre işlemin başlangıç ve bitiş vakti hakkında bilgisizliğin ya da belirsizliğin olduğu her akit, fasit veya geçersiz olmaya yol açan bir sözleşmedir. Çünkü bu, akit yapan taraflar arasında çatışma ve anlaşmazlığa yol açar. Zaman, insanlar arasındaki finansal işlemler de dâhil olmak üzere her türlü iş ve işlemi kısaca hayatı kuşatan bir unsurdur. Ayet ve hadislere istinaden Cumhur ulema, \"peşin alış-verişteki bedel veresiyeden daha kıymetlidir\" şeklinde bir genel ilke tespit etmişlerdir. Bu kanaat, zamanın değişmesi ya da vadenin uzamasıyla bir şeyin değerinin de değişebileceği konusunda zamanın etkisini ifade eden en özet kaidedir denilebilir. Çünkü vaktinde kılınan namazla kazaya bırakılan namaz arasında ya da cemaatle kılınan namazla ferdî kılınan namaz arasında bile bir ecir farkı var iken, mümkünse peşin yapılan bir alış-verişle veresiye yapılan bir alış-veriş arasında da fark olması, yani vade farkının bulunması tabii olmalıdır. Bu konuda farklı mezhebe mensup çoğu fukahanın aynı kanaatte olduğu tespit edilmiştir. Özetle İslam hukukunda \"zaman\" \"mâli\" işlemlere dahil pek konuda ya rükün ya sıhhat ya da yürürlük şartı gibi oldukça etkin konumda olduğu tespit edilmiştir."
