abstract: "Bu çalışma, kamu yönetiminde verimliliği ve şeffaflığı zedeleyen yaygın idari ve mali yolsuzluklara ışık tutmayı amaçlamaktadır. Bu yolsuzluk, kamu sektörünün kültürüne kökleşmiş olup, devlet paranın mubah olduğu ve devlette görev alanların onu kişisel menfaatleri için kullanma eğiliminde olduğu düşüncesine dayanmaktadır. Çalışmanın temel amacı, özelleştirmenin bu kurumlarda idari ve mali yolsuzluğu azaltmada, yasal bir çerçeve içinde oynayabileceği rolü araştırmaktır. Çalışma, özelleştirmenin yolsuzluğun azaltılmasına nasıl katkıda bulunabileceğinin mekanizmalarını belirlemeyi, özelleştirmeden en fazla yararlanabilecek kamu sektörlerini tespit etmeyi ve özelleştirme sürecini engelleyebilecek zorlukları ile yolsuzlukla mücadele çabaları üzerindeki etkilerini değerlendirmeyi içermektedir. Çalışmanın hipotezleri, özelleştirme ile yolsuzluk arasında istatistiksel olarak anlamlı bir ilişkinin varlığı ve özelleştirmenin idari ve mali yolsuzluğu azaltabileceği yönündedir. Çalışmanın sonuçları, Libya'daki bazı kamu kurumlarında idari ve mali yolsuzluğun var olduğunu, anketörlerin %99'unun bunu kabul ettiğini göstermiştir. Ayrıca çalışma, yolsuzluk kültürünün toplumda kökleşmiş olduğunu ve bireylerin helal ile haram arasında ayrım yapmadıklarını ortaya koymuştur."
