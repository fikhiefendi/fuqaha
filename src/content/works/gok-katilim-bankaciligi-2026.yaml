abstract: "Bu çalışma, katılım bankacılığı ve sigortacılığı alanında tahkimin İslam hukuku açısından nasıl bir işlev gördüğünü ve hangi sınırlar içinde değerlendirilebileceğini incelemektedir. Çalışmada İslam hukukuna uygunluk hassasiyetinin, tahkimin yapısal sınırları korunarak danışma, rehberlik ve uzmanlaşma araçları yoluyla tahkim sürecine nasıl dâhil edilebileceği ele alınmaktadır. Çalışma, yöntem bakımından normatif analiz ve karşılaştırmalı hukuk incelemesine dayanmaktadır. Klasik İslam hukukunda tahkim kurumu ile modern hukuk sistemlerindeki tahkim anlayışı birlikte ele alınmış; Türkiye'deki mevcut tahkim uygulamaları bu çerçevede değerlendirilmiştir. Ayrıca İngiltere, Malezya, Endonezya ve diğer örnekler üzerinden katılım finans uyuşmazlıklarında tahkimin farklı hukuk düzenlerinde nasıl yapılandırıldığı karşılaştırmalı olarak incelenmiştir. v Çalışmanın sonucunda, katılım bankacılığı ve sigortacılığı alanında tahkimin meşruiyetinin; hakem yeterliliği, gerekçeli karar anlayışı, taraf rızasının niteliği ve İslam hukukuna uygunluk hassasiyetinin bağlayıcı yargı yetkisi doğurmaksızın sürece dâhil edilmesi yoluyla güçlendirilebileceği ortaya konulmuştur. Bu çerçevede, mevcut tahkim düzeniyle çatışmayan, aşamalı ve kurumsal bir model önerisi geliştirilmiştir. Önerilen model, İstanbul Finans Merkezi bünyesinde tahkimin uygulanmasına elverişli bir zemin öngörmekte; kısa vadede mevcut tahkim yapıları içinde uzmanlaşmayı, orta vadede ise katılım finans alanına özgü kurumsal bir tahkim yapısının geliştirilmesini esas almaktadır. Bu çalışma, katılım bankacılığı ve sigortacılığında tahkimin yalnızca hukukî geçerlilik sağlayan bir yol olarak değil; aynı zamanda normatif meşruiyet ve toplumsal kabul boyutlarıyla birlikte ele alınması gereken bir kurum olduğunu ortaya koymaktadır."
