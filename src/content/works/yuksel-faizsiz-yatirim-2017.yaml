abstract: "Dünya finans piyasalarında faizsiz finansman ve yatırım aracı olarak kullanılan, dünya literatüründe sukuk, ülkemizde kira sertifikaları olarak isimlendirilen borçlanma araçları, tüm dünyada olduğu gibi ülkemizde de hacmi artan yatırım ürünlerinden biri durumundadır. Kira sertifikaları ülkemizde 2013 yılından itibaren özellikle islami prensiplerle çalışan finans kurumları tarafından (özellikle katılım bankaları) önemli bir kaynak sağlama aracı olarak kullanılmaktadır. Yine 2012 yılından itibaren Hazine Müsteşarlığı tarafından yapılan ihraçlar ile kira sertifikaları kamu borçlanmasında da yer edinmeye başlamış, toplam iç borç içinde payı yüzde ikiyi aşmıştır. Özellikle özel sektör tarafından ihraç edilen kira sertifikaları piyasada diğer borçlanma araçları ile rekabet halindedir. Ancak, islami yapıları gereği bazı prensiplere uymaları zorunlu olan bu araçların, getiri oranları piyasa şartlarında oluşturulmaktadır. Yapılan çalışmada özel sektör tarafından ihraç edilen kira sertifikalarına odaklanılmış, ihraç edilen kira sertifikalarının rekabet içinde olduğu diğer yatırım araçlarının getirilerinin değişiminden ne ölçüde etkilendiği araştırılmıştır. Araştırmada birincil ihraçlarda oluşmuş olan kira sertifikası getiri oranlarındaki değişim gösterge faiz, mevduat faizi, katılım bankalarınca ilan edilen kar paylarındaki değişim ile karşılaştırılmıştır. Elde edilmiş olan veriler EViews programında önce korelasyon analizine tabi tutulmuş, ardından yüksek korelasyon katsayısına sahip olan eşleşmeler ile regresyon modeli oluşturulmuş ve oluşturulan model test edilmiştir. Regresyon tahminine bağımsız değişken olarak ülke risk primini gösteren CDS verileri ve ayrıca Libor verisi de eklenmiş ve bu şekilde çoklu regresyon tahminleri oluşturulabilmiştir."
