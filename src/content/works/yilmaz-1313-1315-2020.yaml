abstract: "Uzun yıllar boyunca Osmanlı Devleti'ne başkentlik yapmış olan Bursa adlî, ekonomik, kültürel, siyasi, sosyal ve tarihi olarak her zaman önemli bir şehir olmuştur. Bu tezde Tanzimat'tan sonraki süreçte Mecelle-i Ahkâm-ı Adliyye'nin yürürlüğe girmesi ile adaletin nasıl tevzi edildiğini ortaya koymak için kayıtlardan olan Bursa şer'iyye sicillerinden C-147 numaralı sicilin 49-97 arası varaklarının transkripsiyonu ve Fıkıh ilmi açısından tasnif ve tahlili yapılmıştır. Tezimiz giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Tezin giriş bölümünde, tezin konusu, önemi, yöntemi ve kaynakları ile şer'iyye sicillerinin tanıtımına ana hatlarıyla değinilmiştir. Birinci bölümde Bursa Şer'iyye Sicilleri hakkında genel bilgiler verildikten sonra, tezin konusu olan şer'iyye sicilinin ilgili kısmı tanıtılmıştır. Yine bu bölümde, şer'iyye sicilinin ilgili kısmında konu taraması yapılarak tasnif bölümü oluşturulmuştur. İkinci bölümde de dönemin hukuk anlayışına ışık tutan sicil, muhteva itibariyle tasnif kısmında tespit edilip belirlenen fıkhî konular Mecelle-i Ahkâm-ı Adliyye ve Mülteka'l-Ebhur kitabı esas alınarak tahlil edilmiştir. Üçüncü bölümde farklı konular hakkında indekslere yer verilmiştir."
