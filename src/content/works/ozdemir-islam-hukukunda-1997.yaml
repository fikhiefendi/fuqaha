abstract: "TÜRKÇE ÖZET Süt akrabalığı, İslâm dininde, aynen nesep ve sıhrî akrabalık gibi evlenme mânileri arasında yer almaktadır. Bu, Kitap, sünnet ve fakîhlerin icmâı ile sabittir. Süt akrabalığının meydana gelmesi için, emenle, emzirenle ve emilen sütle ilgili bazı şartlar bulunmaktadır. Süt akrabalığı, ancak bu şartların yerine gelmesi ile ortaya I çıkmaktadır. Şartların oluşması durumunda da, emen çocukla, emziren annenin kendisi ve nesli ve kadından o sütün inmesine sebep olan erkeğin kendisi ve nesli ve süt anne ve süt babanın diğer süt çocukları arasında süt akrabalığı meydana gelmektedir. Süt akrabalığının varlığının isbâtı için, emmenin varlığım ya tarafların ikrar etmesi veya bu duruma vâkıf olanların şahitlik etmesi gerekmektedir. îşte biz çalışmamızda, bu hususları ortaya koyarak, ülkemiz kanunlarında bulunmayan ve sadece halk arasında bazı yanlışlıklarla birlikte uygulanmaya çalışılan süt akrabalığı müessesesini, mezhep imamlarının da görüşlerine yer vererek, biraz olsun ortaya koymaya çalıştık. Bu hususların ortaya konulmasında, kaynaklardan faydalandığımız gibi, konu ile ilgili uzman kişilerin yardımına da müracaat ettik. Bunu gerçekleştirirken de, akrabalığının, dînî, içtimaî, hukukî ve tıbbî açıdan, hangi sınırlarda anlaşılması gerektiğini vurgulamaya çalıştık.. Sonuçta süt akrabalığının, gerçekten doğru bir şekilde bilinmesi ve hükümlerinin uygulanması gerektiğinin, dînî, içtimaî ve tıbbî yönden ne kadar önem arz ettiğini bir kez daha yakinen anlaşılmış olduğu kanatindeyiz."
