abstract: "Molla Muhyiddîn Hâvelî 20. yüzyılda, Siirt'te yaşamış Şafiî mezhebine mensup bir ilim adamıdır. Bu çalışma Molla Muhyiddîn Hâvelî'nin (1909/1987) hayatı veRisâletu'l-Esâs fi Ahkâmi'l-Haydi ve'n-Nifâs adlı eserinin tahkik, tahlil ve tercümesinden oluşmaktadır. Molla Muhyiddîn Hâvelî bu eserinde kadınların ibâdet ve sosyal hayatlarını etkileyen hayız, nifas ve istihâze meselelerini Şafiî mezhebi ağırlıklı olarak ele almıştır. Hâveli'nin eseri kaleme almasındaki amacı konu ile ilgili olarak kendisine soru soranlar için başvuracakları temel bir kaynak oluşturmaktır. Tezin birinci bölümünde Hâvelî'nin hayatı, ilmi kişiliği ve eserleri hakkında bilgi verilmiştir. İkinci bölümde ise Risâletu'l-Esas fi Ahkâmi'l-Haydi ve'n-Nifas adlı eserin nüshaları, eserin ismi ve müellife aidiyeti, eserin kaynakları ve içeriği, eserde kullanılan yöntem ve eserde geçen temel kavramlar ele alınmıştır. Üçüncü bölümde ise eserin tercümesi yapıldıktan sonra tahkikli metnine yer verilmiştir."
