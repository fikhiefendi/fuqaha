abstract: "Hazırladığımız bu tezde, İslam aile hukukunun temelini oluşturan nikâh akdinin sahih bir şekilde kurulabilmesi için rükünleri ve şartları ve aynı zamanda ağırlıklı olarak ilgili tarafların rızalarını ortaya koyan irade beyanı incelenmiştir. Tarafların evlilik akdi esnasında iradelerini (icap ve kabul) belirlemede herhangi bir istismarın olmaması için irade beyanı çeşitleri ve zaman sıygaları konuları da dikkatlice ele alınmıştır. Bu tez çalışmamız giriş, iki ana bölüm, sonuç ve kaynakça kısımlarından teşekkül etmektedir. Tezin giriş kısmı; tezin konusu, amacı ve önemi, yöntemi ve konumuzla ilgili literatür değerlendirmesini içermektedir. İslam Aile Hukukunda Akdin Unsurları ve Şartları adlı birinci bölümde; ailenin önemi, aile ve akit kavramları, in'ikad (kurulum) şartları, sıhhat şartları, nikâh akdinin nefȃz (yürürlük) şartları ve nikâh akdinin lüzum (bağlayıcılık) şartları konularıyla ilgili genel bilgiler verilmiştir. Mezkûr konular incelenirken ağırlıklı Hanefi Mezhebi olmak üzere klasik dört mezhebe mensup alimlerin görüşlerine yer verilmiştir. Tezimizin ağırlıklı konusu olan İslam Aile Hukukunda Akdin Kuruluşunda İrade Beyanı adlı ikinci bölümde ise, irade beyanı ve irade beyanı çeşitleri zaman kipi farklılıkları dikkate alınarak incelenmiştir. Çalışmamızda temel klasik fıkıh kaynaklarının yanı sıra günümüzde çalışılmış konuyla ilgili kitap, tez vs. literatürden de istifade edilmiştir. Tezde yer alan görüşlerin kaynakları ilgili her sayfanın alt kısmında dipnot olarak gösterilmiştir. Sonuç kısmında ise tezde ulaşılan görüşler maddeler halinde verilmiştir. Tez, istifade edilen kaynakların sıralandığı kaynakça ile son bulmaktadır."
