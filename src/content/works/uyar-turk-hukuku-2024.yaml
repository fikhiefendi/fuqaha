abstract: "Tasarruf finansman sözleşmeleri, 7292 sayılı Kanun ile getirilen düzenlemeler ile tipik sözleşmeler arasına girmiştir. Böylelikle tasarruf finansman sözleşmelerinin genel esasları belirlenmiştir. Ayrıca tasarruf finansman şirketlerinin faaliyetleri de BDDK'nın yetki alanı içerisine dâhil edilmiştir. Tasarruf finansman sözleşmelerinin tarafları, tasarruf finansman şirketleri ile müşterileridir. Tasarruf finansman sözleşmelerinin konusu da yalnızca konut, taşıt ve çatılı iş yeri edinimidir. Tasarruf finansman sözleşmeleri ile müşteriler, sözleşme konusu mülkleri edinme, tasarruf finansman şirketleri ise, faizsiz finans ilkelerine göre hareket etmek suretiyle kâr etme amacındadır. Faizsiz finans ilkelerine uygun faaliyet gösteren şirketler ile müşterilerinin bir diğer gayesi de İslâm Hukuku'na göre meşru görülen bir işlem yapmaktır. Tasarruf finansman sözleşmelerinin yeni bir sözleşme olmasından ötürü, tasarruf finansman sözleşmelerinin hangi tip sözleşmelere temas ettiği ile İslâm Hukuku'nun genel ilkelerine aykırılığının bulunup bulunmadığının tespit edilmesi önem arz etmektedir. Çalışmamızda, mer'i mevzuatımız kapsamında tasarruf finansman sözleşmelerinin konusu, tarafları, hukuki niteliği, tarafların borçları, sona ermesi ele alınacaktır. Tasarruf finansman sözleşmeleri İslâm Hukuku açısından da temellendirilmeye çalışılacaktır."
