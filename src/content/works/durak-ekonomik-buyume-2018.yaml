abstract: "Bu tez çalışmasında katılım ve konvansiyonel bankacılığın beraber bulunduğu ülkelerin ekonomik büyüme, ticari açıklık ve bankacılık sektör derinliği arasındaki uzun ve kısa dönemli ilişkinin panel veri analiziyle incelenmesi amaçlanmaktadır. Bu çerçevede, çalışmada ekonomik büyüme, ticari açıklık ve bankacılık sektör derinliği arasındaki ilişki katılım bankacılığı ile konvansiyonel bankacılığının beraber bulunduğu İslam İşbirliği Teşkilatı'ndaki toplam on yedi ülke ele alınarak incelenmiştir. Verilerin ulaşılabilirliği ve katılım bankacılığının gelişiminin hızlandığı dönemler göz önünde bulundurularak 1990-2016 dönemi verileriyle çalışma yürütülmüştür. Ekonometrik analizler sonucunda, ülkeler arasında yatay kesit bağımlılığı olduğu bulgusu elde edilmiştir. Ayrıca, yapılan birinci ve ikinci nesil birim kök testleri sonucunda serilerin durağan olmadığına ulaşılmıştır. Seriler durağan olmadığından serilere Westerlund (2007) eşbütünleşme analizi yapılmış ve seriler arasında eşbütünleşme olduğuna ulaşılmıştır. Ardından, uzun ve kısa dönem katsayılarını ve ilişkileri belirlemek için modeller panel ARDL modeli şeklinde yazılarak üç tahminci ile tahmin edilmiştir. Sonuçlar bankacılık sektörünün az gelişmişliğinin uzun dönemli ekonomik büyüme için olumsuz sonuçlara yol açtığını göstermektedir. Ayrıca, ampirik sonuçlar literatürdeki genel eğilim olan büyüme-açıklık ilişkisinin olumlu etkisini teyit etmekte ve model spesifikasyonuna göre değişmeyen benzer kanıtlar sunmaktadır. Özetlemek gerekirse, bankacılık sektörü derinliği değişkenleri ve ekonomik büyüme arasındaki bağlantıya yönelik elde edilen bulgular, bankacılık sektörünün uzun vadeli ekonomik büyümeyi genel olarak bu ülkeler grubunda teşvik ettiğidir. Bu nedenle bu ülkelerde, daha rekabetçi, verimli ve istikrarlı bir bankacılık sektörünün, bankacılık sektörünün derinlemesini teşvik ederek ekonomik büyümeyi daha da arttıracağı düşünülmektedir."
