abstract: "İnsanın, yaratıcısıyla ve diğer insanlarla ilişkilerini düzene koyan ilahi ilkelerin son halkası Hz. Muhammed ile tamamlanmıştır. İnsanın varoluş sebebi olan aile ve bu ailenin işleyişi de İslam'da önemli bir yere sahiptir. Birçok ayet ve hadis, aileyi oluşturan ana baba hakkına, onlara ihsan etmeye ve neslin devamını sağlayacak olan çocukların terbiyesine dikkat çekmektedir. Çocukların manevi yönden davranışlarına etki eden maddi/biyolojik gelişimleri için onların beslenmelerine de dikkat edilmesine dair tavsiyeler bulunmaktadır. Toplumun sağlığı aileye, ailenin sağlığı da anne-bebek irtibatına bağlıdır. Bu sebeple bebeklerin ilk iki yıldaki beslenmeleri İslam dini açısından oldukça önemlidir. Bu dönemde, bebeklerin öncelikle kendi annesinin sütü ile bulunamıyorsa başka annelerden temin edilen süt ile beslenmesi tavsiye edilmiştir. Kur'an ve hadislerde“ r-d-a = rada' ”kavramıyla ifade edilen“süt emzirme”bebeğin hem öz annesinden hem de diğer kadınlardan emmesinin özel adı olmuştur. Kadınların kendi bebeklerinin dışındaki bebekleri emzirmeleri eski toplumlarda da var olan bir gelenekti. Fıtratta bulunan bu süt emzirme âdeti, Kur'an ve Sünnet ile bazı ilkelere bağlanmış, süt emzirme âdeti korunmuş ve bu tür emzirmelerin“süt akrabalığı”oluşturacağı da belirtilmiştir. Öte yandan süt akrabalığı, kan akrabalığı gibi“sürekli evlenme engelleri”içerisinde zikredilmiştir. Bebeğin besin ihtiyaçlarını gideren ve onu çeşitli hastalıklardan koruyan anne sütü, Allah'ın insanoğlu için yaratmış olduğu mucizevi bir gıdadır. Anne sütünün prematüre/erken doğan ve normal doğan için hayati öneme sahip olmasından hareket ederek, çeşitli sebeplerle anne sütünü alamayan bebeklerin bu ihtiyacını gidermek için süt bankaları kurulmaya başlanmıştır. Dünya Sağlık Örgütü (WHO) tarafından da desteklenen süt bankalarının ülkemizde de kurulması planlanmış fakat bu girişim, İslam'da evlenmeleri haram olan süt akrabalığı evliliklerinin yaygınlaşacağı, kontrolünün de mümkün olamayacağı gibi endişeleri gündeme getirmiştir. Bu çalışma, süt bankaları konusundaki dünyada yaygın olan tespitleri, işleyişleri ve bunun İslam'a göre hükmünü incelemek için yapılmıştır. Günümüz fıkıh problemleri çerçevesinde ele alınabilecek olan süt bankacılığının, helal olma şartları ve zaruri durumlarda neler yapılması konusundaki ilkeler belirlenmeye çalışılmıştır."
