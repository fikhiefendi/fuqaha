abstract: "Bu tezin amacı İslâmi finansman yöntemlerinden Karz-ı Hasen'in tanıtılması ve katılım bankalarında uygulanması arzu edilen bir modelin önerilmesidir. Karz-ı Hasen İslâm'da faizsiz, menfaat güdülmeksizin Allah (c.c.) rızasının gözetildiği borç verme işlemi olarak tanımlanmaktadır. Ancak yöntem kısıtlı örnekler dışında kurumsal olarak uygulanmamıştır. Önerilen karz-ı hasen modeliyle Müslüman toplumların hem bireysel hem de kurumsal likidite sorunlarına katkı sağlamayı ve İslâm'da tavsiye edilen karz-ı hasen finansmanının kurumsallaşması amaçlanmıştır. Çalışmada katılım bankalarına karz-ı hasenin modern bir formu sunulmuştur. Modeli test etmek adına ise 3 farklı grup ile odak grup görüşmeleri yapılmıştır. Odak gruplar akademisyenler, katılım banka personeli ve iş adamları olmak üzere katılım bankalarıyla çalışan ve sisteme aşina bireylerden seçilmiştir. Araştırma sonuçlarına göre modelin belirli bir boşluğu dolduracak işleyebilir bir model olduğu, toplum tarafından destekleneceği ve en önemlisi faizin etkinliğinin azaltılmasına katkı sağlayacağı sonucuna varılmıştır."
