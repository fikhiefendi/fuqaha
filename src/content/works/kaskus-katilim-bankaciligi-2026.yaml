abstract: "Bu araştırmanın amacı, Türkiye'deki katılım bankacılığı hizmetlerini tercih etme motivasyonlarının müşteri güveni ve sadakati üzerindeki etkisini incelemek ve bu ilişkide dindarlık düzeyinin aracılık rolünü ortaya koymaktır. Veriler, Türkiye'de ikamet eden Türk, yabancı ve Arap katılımcılardan oluşan 404 kişiye uygulanan bir anket aracılığıyla toplanmış ve SmartPLS 4 programı kullanılarak Yapısal Eşitlik Modellemesi ile analiz edilmiştir. Sonuçlar, kullanılan ölçeklerin yüksek düzeyde geçerlilik ve güvenilirliğe sahip olduğunu göstermiştir. Katılım bankalarının tercih edilmesinde en belirgin faktörlerin dini hassasiyetler, faizsiz finans anlayışı ve İslami ilkelere bağlılığın yanı sıra güvenilir hizmet, şeffaflık ve kurumun itibarı olduğu belirlenmiştir. Ayrıca Yapısal Eşitlik Modellemesi, müşteri güveninin hem sadakat hem de dindarlık düzeyi üzerinde pozitif bir etkisi olduğunu, dindarlığın da sadakati olumlu etkileyerek güven ile sadakat arasında kısmi aracılık rolü oynadığını göstermiştir. Çalışma, sadece faizsiz finans ilkelerine bağlı kalmanın sadakati artırmak için tek başına yeterli olmadığını; güven, şeffaflık ve hizmet ahlakının da temel unsurlar olduğunu ortaya koymaktadır. Bu araştırmanın Türkiye'deki katılım bankacılığı literatürüne katkı sağlaması ümit edilmektedir."
