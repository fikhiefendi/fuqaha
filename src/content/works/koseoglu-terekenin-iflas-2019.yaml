abstract: "Türk Medeni Kanunu'nda; terekenin en yakın mirasçılar tarafından reddedilmesi, hükmen reddi yahut olağan tasfiyede mevcudun borçlara yetmemesi hallerinde sulh hukuk mahkemesince İcra ve İflas Kanunu hükümleri çerçevesinde tasfiyesinin gerçekleştirileceği esası yer almaktadır. İcra ve İflas Kanunu'nda terekenin tasfiyesine ilişkin ayrı bir düzenleme bulunmadığından iflasa tabi şahıslar için mevcut olan hükümler tereke için de geçerli kabul edilmektedir. Çalışmamızın konusunu terekenin iflas hükümlerine göre tasfiyesini gerektiren sebepler ile ilgili Kanun hükümleri ışığında tasfiye edilme usulü oluşturmaktadır. Birinci bölümünde terekenin iflas hükümlerine göre tasfiyesinde yer alan kavramlar hakkında bilgi verilerek resmi tasfiye yöntemleri ele alınmıştır. İkinci bölümde iflas hükümlerine göre tasfiye sebepleri ayrıntılı biçimde incelenmiştir. Üçüncü bölümde terekenin iflas hükümlerine göre tasfiyesi usulü irdelenmiş, Yargıtay kararları ve doktrindeki tartışmalara yer verilerek İcra ve İflas Kanunu hükümleri çerçevesinde yapılacak tasfiye işlemi değerlendirilmiştir."
