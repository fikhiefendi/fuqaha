abstract: "ÖZET Ekonomik hayat, bir nevî ucuzluk ve pahalılıkdan ibarettir. Bu, insanın, eşyanın fiyat veya değeriyle olan temasından dolayıdır. İşte bu temas da ancak fiyat aracılığı ile olur. İslâm hukuku, ticarî ahlak değerleri içerisinde, insanların ve toplumların istismar edilmediği, arz-talep dengesinin ortaya koyduğu piyasa fiyatıyla işlerlik kazanan bir ekonomik hayat içerisinde fiyatlara müdâhale etmez. Zaten İslam hukukunda fiyatlara müdâhale etmemek genel bir prensiptir. Ama bunun yanında İslâm, sunî fiyat artışına sebep olacak faizi, karaborsacılığı, üreteci ile tüketicinin arasına girecek fuzûlî aracıları ve bunun gibi sebepleri şiddetle yasaklar. Yani İslâm, fiyatlara müdâhale etmez derken, bunu tamamen başıboş“bırakın yapsınlar”gibi değil, İslâmın genel bütünlüğü içerisinde değerlendirir. İslâm, fiyatlara müdâhale etmezken, sunî fiyat artışlarına sebep olabilecek durumları ortadan kaldırarak, arz-talep piyasasının en tabiî şartlarda oluşumunu sağlar. Üretimi de devamlı teşvik eder."
