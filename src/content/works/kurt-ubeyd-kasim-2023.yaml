abstract: "“Ebû Ubeyd Kâsım b. Sellâm'ın Kitâbü'l-Emvâl'indeki Siyer Rivayetlerinin Tespiti ve Değerlendirilmesi”adını taşıyan bu çalışma, fakih olan Ebû Ubeyd'in siyer rivayetlerini nasıl ele aldığını incelemeyi hedeflemektedir. Tezde öncelikle Ebû Ubeyd'in ilmî hayatına ve Kitâbü'l-Emvâl'i yazma amacına değinilmiştir. Eserin kamu maliyesi literatüründeki konumu saptanıp değeri ortaya konmaya çalışılmıştır. el-Emvâl'de yetmiş ikisi gazveler, otuz beşi vesikalar hakkında olmak üzere toplam yüz yedi siyer rivayeti bulunmaktadır. Ebû Ubeyd'in bunları hangi kaynaklardan nasıl aktardığı ve yaptığı metin tenkitleri ortaya koyulmuştur. Klasik siyer kaynaklarından farklı olarak hangi rivayetleri naklettiği belirlenmiş ve bunları hangi bağlamda değerlendirdiği saptanmıştır. Ayrıca siyer rivayetlerine niçin tarihçilerden farklı yaklaştığının sebepleri üzerinde durulmuştur. Böylece bir fıkıh eserinin siyer ilmine yapabileceği katkılar tespit edilip değerlendirilmiş ve siyer kaynağı olarak kullanılıp kullanılmayacağı araştırılmıştır."
