abstract: "Çalışmamızın konusu, Hanefi fıkhının temel kaynaklarından biri olan Serahsi'nin Mebsut adlı eserinin“Kitabü's-Siyer”kısmının tahkiki ve tahlilidir. Günümüzde uluslar/devletler arası hukuk alanına giren meselelere değinen“Siyer”bölümü Müslümanların oldukça erken bir dönemde hukuk ilmine yaptıkları katkıları göstermektedir. Bu bölümde büyük ölçüde müslümanlarla gayrimüslimler arasındaki ilişkileri konu edinmektedir. Bu bölümde müşrik, zimmi, mürted ve isyancılarla ilişkiler, bu gruplarla ilgili savaş, barış, ticari muameleler, evlilik, yargılama ve benzeri alanlardaki hükümler ele alınmaktadır. Bu konular Hanefi mezhebine göre detaylı biçimde açıklanıp bazen diğer mezheplerle, özellikle Şafii mezhebiyle karşılaştırılmaktadır. Günümüzde de bu konular önemini korumaktadır. Dünyanın küçük bir köy haline gelmesi, Müslümanların gayrimüslim ülkelere göç etmeleri, konuyla ilgili birçok kavramın yanlış anlaşılması bu alanda çalışma yapmamızın nedenleri arasındadır. Bu konularda ve genel anlamda fıkıhta Hanefi mezhebinin öncü ve erken döneme ait ictihadlarının ele alındığı Serahsi'nin Mebsut'una, önemine rağmen tahkik ve inceleme yönünden gereken hakkı verilmemiştir. Birçok kez basıldığı ve tahkik edildiği iddia edilmesine rağmen ne yazık ki bu baskıların hiç biri günümüz ilim çevrelerinde genel kabul gören tahkik kurallarına uymamakta ve birçok hata içermektedir. Mebsut'un devasa hacmine kıyasla çalışmamızın alçakgönüllü ve küçük boyutuna rağmen, bu çalışmada öne koyduğumuz hedefe ulaşmak için çaba gösterdik. Bu çalışmada ilmi ölçüler içinde tahkik kurallarına uymaya garet ettik. Ayrıca eserde yer alan bazı meseleleri günümüz devletler arası hukukuyla mukayese ettik. Mebsut'un tamamının tahkik ve tahlil edilmesi yönünde bir katkı ve ilk adım olmasını arzu ettiğimiz çalışmamızın bu alanda yapılacak çalışmalara öncülük etmesini ve bu eser ve alan üzerine nicelik ve nitelik açısından daha zengin çalışmaların yapılmasını ümit etmekteyiz."
