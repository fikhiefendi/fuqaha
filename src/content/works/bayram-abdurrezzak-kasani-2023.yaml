abstract: "Bu çalışmada Abdurrezzâk el-Kâşânî'nin (ö.730/1329) Hakâiku't-te'vîl fî dekâiki't-tenzîl adlı işârî tefsirinin 3. cildinin tahkîk ve tahrîci yapılmıştır. Abdurrezzâk el-Kâşânî 14. Yüzyılda İsfahan bölgesinde yaşamıştır. Kendisi Sühreverdiyye tarikatı şeyhlerindendir. Şeyhi Abdussamed b. Alî en-Natanzî'nin (ö. 699/1300) yönlendirmesi ile vahdet-i vücûd ekolü ile ilgilenmiştir. Kâşânî, Muhyiddin İbn Arabî'nin (ö.638/1240) Fusûsu'l-hikem adlı eserini şerh ederek vahdet-i vücûd ekolünün daha geniş kitleler tarafından anlaşılmasına ve yayılmasına katkıda bulunmuştur. Kâşânî'nin Hakâiku't-te'vîl fî dekâiki't-tenzîl adlı eseri işârî tefsir alanında yazılmıştır. Kur'ân-ı Kerîm'in tamamını dil, irab, meânî-beyân, tefsir ve te'vil başlıklarında incelemiştir. Tasavvuf tarihi açısından önemli olan bu eser kütüphanelerde el yazması olarak bulunduğu için Kâşânî'ye aidiyeti birçok araştırmacı tarafından anlaşılamamış, bu yüzden de üzerinde fazla çalışma yapılamamıştır. Kâşânî bu eserini yazmadan önce te'vil bölümünü Teʾvîlâtü'l-Ḳurʾân adı altında müstakil bir eser olarak kaleme almıştır. Bu eser sehven İbni'l-ʿArabî'ye nisbet edilerek ilim çevresinde meşhur olmuştur. Hakâiku't-te'vîl fî dekâiki't-tenzîl adlı eser dört ciltten ibarettir. Bu çalışmada üçüncü cildinin tahkîki yapılmıştır. Tahkîk biri Kâşânî'nin kendi yazmış olduğu müellif nüshası olmak üzere beş farklı el yazması arasında gerçekleşmiştir. Eserde geçen âyet, hadis ve şiirlerin tahrîci yapılmıştır."
