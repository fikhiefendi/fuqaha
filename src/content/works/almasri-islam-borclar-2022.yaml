abstract: "Bu tez, anlaşmazlıkları çözmede arabuluculuk konusunu ele almaktadır. Arabuluculuk konusu ticari mali muamelelerdeki anlaşmazlıklar ile sınırlıdır. Dolayısıyla tez ailevi anlaşmazlıklardaki nafaka gibi diğer mali anlaşmazlıklara değinmemektedir. Tez konusu fıkhi açıdan ele alındığı için, dört fıkhi mezhebin konuyla ilgili görüşleri, mukayeseli olarak işlenmiş, mezhepler arasında ihtilaf ve ittifak edilen noktalar ele alınmış ve görüşler arasında tercih yapılarak ortaya konulmuştur. Tez; bir mukaddime, üç bölüm, bir sonuç ve kaynakçadan meydana gelmektedir. Mukaddime de tezin planı, fihrist ve içerik ele alınmıştır. Tezin birinci bölümünde; arabuluculuk kavramının tanımı ve meşruiyeti, ikinci bölümde; arabuluculuğun rükünleri ve arabuluculukla ilgili hükümler ve şartlar, üçüncü bölümde ise; arabuluculuğun sonuçları ve etkisi ele alınmıştır."
