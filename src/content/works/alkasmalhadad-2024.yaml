title: "-منهج الإمام الماوردي في تفسير آيات الأحكام من خلال كتابه الحاوي -آيات كتاب النكاح أنموذجاً"
titleTranslation: {"tr": ": İmam Maverdi'nin El-Havî adlı kitabındaki“Örnek Nikah Bölümüyle İlgili Ayetler”deki Ahkâm Ayetlerin Tefsir Metodu"}
