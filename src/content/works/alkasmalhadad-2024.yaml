abstract: "İmam Maverdi'nin El-Havî adlı kitabı, fıkıh, tefsir, kıraat, dil ve diğerleri gibi çeşitli ilimleri içeren bir ansiklopedidir. İmam Maverdi, Kur'an metnini güçlü istidlal ve istinbat ile fıkıh araştırmasında kullanmayı başarmış ve fıkıh tefsiri ile tahlili tefsiri bir araya getirmiştir. El-Havî kitabının üçte biri tefsirle ilgilidir, çünkü hükümleri çıkarmak için ayetlerin tefsirinde istidlal sıklıkla esas alınır. Tez,“Kur'an Tefsirlerinin Bölümleme Yöntemleri ve Hususiyetleri”başlıklı bir giriş bölümüne ve birinci bölüme ayrılmıştır: İmam Maverdi'nin Kişisel ve İlmi Yaşamına Dair Bir Özgeçmiş. İkinci bölüm: El-Havî, el-Nüket ve el-Uyûn kitaplarının tanıtılması ve Maverdi'nin ahkam ayetlerini tefsir etme yöntemine dair genel bilgiler. Üçüncü bölüm: Nikâh Kitabındaki Hüküm Ayetlerinin Tefsiri. Araştırma, Maverdi'nin tefsirindeki analitik ve fıkıh yönüne odaklanmayı amaçlamaktadır. Ayrıca, el-Nüket ve el-Uyûn tefsirlerini de tanıtmayı amaçlamaktadır. Nikâh kitabında geçen hüküm ayetleri incelemeyi, bu ayetleri kategorilere ayırmayı ve her kategoriye konunun ana ayeti ile başlık koymayı da amaçlamaktadır. Her bir bölüm için ayet münasebetini dile getirerek analitik tefsir uygulamayı hedeflemektedir. Daha sonra ayetlerin nüzul sebebini, metindeki bilinmeyen lafız ve kelimelerin açıklanmasını, buna daha sonra genel tefsir uygulanması ve daha sonra ayetin tefsirinden bahsederek El-Havî kitabında yer alanları ele almayı, son olarak, bu ayetlerle ilgili en önemli fıkıh meseleleri çıkarmak ve bu hususlardaki fıkıh alimlerinin görüşleri açıklamayı amaçlamaktadır. Bu çalışmada tümevarımsal ve analitik yaklaşım yöntemleri kullanılmıştır."
