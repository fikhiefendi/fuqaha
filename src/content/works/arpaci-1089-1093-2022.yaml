abstract: "Bu çalışmada, Harput Kazası'nın H.1089-1093/M.1678-1682 (s.1-124) tarihli Şerʻiyye Sicili'nin transkripsiyonu ve değerlendirilmesi yapılmıştır. Çalışmada ilk olarak Osmanlı Devleti'nde adli teşkilat ve kadılık kurumu, şerʻiyye mahkemeleri ve mahkeme kayıtları (şer'iyye sicilleri) ile ilgili bilgiler verildikten sonra inceleme konumuz olan sicil içindeki belgeler özetlenip, konularına göre tasnifi ve genel değerlendirilmesi yapılmıştır. Sonrasında ise transkripsiyon metnine yer verilmiştir. İncelememize konu olan Harput Şer'iyye Sicili'nde alım-satım, miras, vasi tayini, mal anlaşmazlığı, hibe, mezhep değiştirme, vergi, hırsızlık, cinayet, darp, evlilik, tımar vb. konuları içeren kayıtlarla; ferman, berat, buyruldu gibi belgelerin suretlerinin kaydı yer almaktadır. Sicilde Harput Sancağı'nın incelediğimiz tarihlerdeki durumu hakkında bilgiler bulunmaktadır. Çalışmamıza konu olan sicilin hazırlandığı devir IV. Mehmed Devri olup ilk Osmanlı-Rus Savaşı'nın çıktığı dönemdir. Dönemin sadrazamı Merzifonlu Kara Mustafa Paşa'dır. Bu zaman dilimi içinde Viyana Kuşatması'na katılmıştır. Bu dönem (1682) Ruslarla yirmi yıllık bir antlaşma yapılarak son bulmuştur."
