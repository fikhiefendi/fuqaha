abstract: "IÖZETYüksek Lisans Tezi70 Numaralı Konya Şer`iyye SiciliNuri ÜNLÜFırat ÜniversitesiSosyal Bilimler EnstitüsüTarih Bölümü2005, Sayfa : I+550Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de Şer`iyyeSicilleridir.Ait oldukları dönem ve yer hakkında oldukça önemli bilgiler veren Şer`iyyesicillerinden faydalanma konusu bu gün için başlı başına bir problem olmaktadır. Budurum ise sicillerden faydalanma konusunu belirli bir metoda bağlı kılmayı zaruri halegetirmektedir. Bizde bu önemli kaynaklardan biri olan 70 Numaralı Konya Şer`iyyeSicilini çalışmamıza konu edindik.Bu metinlerden yola çıkarak yaptığımız değerledirmede Konya'nın bu dönemdeidari, siyasi, askeri, iktisadi, ve sosyal yapıları üzerinden durduk."
