abstract: "İbn Hacer el-Askalânî'nin (ö. 852/1449) fıkıh usûlu anlayışının incelendiği çalışmamızda onun fıkıh birikiminin usûle dair görüşlerine yansımaları ele alınmıştır. Bu bağlamda onun hayatı, fıkhî yönünü besleyen faktörler, fıkhın ilmî hayatındaki yeri, usûl-i fıkıh ıstılahlarına yaklaşımı, fıkhın kaynaklarına dair görüşleri, hükme yaklaşımı ve lafızlardan hüküm istinbatı incelenmiştir. Çalışmamızın amacı İbn Hacer'in usûl-i fıkıh anlayışını sistematik biçimde ortaya koymak ve onun hadis merkezli yorumlarının usûlî çerçevede nasıl bir metodolojiye dayandığını göstermek olmuştur. Bu minvalde İbn Hacer'in, Buhârî'nin el-Câmiu's-Sahîh isimli eseri üzerine yazmış olduğu Fethu'l-bârî bi-şerhi Sahîhi'l-Buhârî adlı eseri çalışmamızın ana kaynağını teşkil etmiştir. Eserin tercih edilmesinde bir hadis şerhi olmakla birlikte içerdiği zengin fıkhî birikim belirleyici olmuştur. Nitekim İbn Hacer, eserinde Buhârî'nin bâb başlıklarında işaret ettiği fıkhî görüşleri mukayeseli bir metotla yorumlamış, konu hakkındaki ihtilaflara değinmiş, mezheplerin ileri sürdüğü delillere yer vermiş ve nihayetinde fıkhî hükümler tespit etmiştir. Bu sebeple İbn Hacer'in söz konusu eseri fıkhî yönüyle ele alınmış ve fıkıhta tercih ettiği usûl bu kaynak üzerinden irdelenmiştir. Bununla birlikte onun diğer bazı eserlerinden de yardımcı kaynak olarak yararlanılmıştır. Literatür taraması ve metin analizi ile yürütülen çalışmamızda İbn Hacer'in usûl-i fıkha dair görüşleri hadislere getirdiği şerhler üzerinde yapılan detaylı inceleme yoluyla belirlenmiştir."
