abstract: "Osmanlı toplumunu teşkil eden unsurlardan biri olan gayrimüslim reayanın haklarını arayabildiği iki yetkili merciiden biri kendi dinî/cemaat mahkemeleri, diğeri Osmanlı mahkemeleridir. Bu çalışmada 17. yüzyılın ikinci yarısında Konya ve Bursa gayrimüslimlerinin Osmanlı mahkemelerinde bulunma sebeplerinin tespiti amacıyla 28 adet Konya Şer'iyye Sicili ve 57 adet Bursa Şer'iyye Sicili taranmış, ilgili hükümler tasnif ve tahlil edilmiştir. Söz konusu zaman diliminde Konya ve Bursa gayrimüslimlerinin ictimaî ve iktisadî vaziyetlerini ortaya koyan bu veriler karşılaştırmalı olarak incelenmiş, evlenme ve boşanmaları, miras davaları, vakıflara ilişkin konuları, cerrahları ve hastalıkları, ihtida ve irtidadları, gayrimenkul alım-satımları, borç ilişkileri, ticari faaliyetleri ve ödemekle mükellef oldukları vergiler bağlamında ele alınmıştır. Buna göre gayrimüslimlerin hemen her konuda haklarını -kendi dinî/cemaat mahkemelerinden ziyade- Osmanlı mahkemelerinde aradıkları, gerek kendi aralarındaki gerekse Müslümanlarla aralarındaki davalar için bu mahkemelere başvurdukları tespit ve teyid edilmiştir."
