abstract: "Kabz; piyasada geçerli olma, tasarrufta bulunma gücü, bir şeyi elle tutup alma, bir meblağı hesaba kaydetme, bir şeyi teslim alarak onda tasarrufta bulunma imkânını elde etmektir. Kabzın tanımı ve nasıl gerçekleşeceği konusunda merkeze alınan Hz. Muhammed'in hadisleri ve klasik dönemlerdeki uygulamalar olduğu gibi önemli ölçüde zamanın ve bölgenin örfü dikkate alınmaktadır. Her devrin kendine ait ticaret metaı değişkenlik gösterebilir. Akitlerde gerçekleşen kabz hakkındaki mezheplerin ihtilaf sebepleri Hz. Muhammed'in satın alınan malın ölçülmeden ve ele geçirilmeden önce satışını yasaklayan hadislerdir. Bu konuda çerçeveyi en geniş tutan Şâfiîler; garar ve haksız kazancı dikkate alarak hiçbir şeyde kabzdan önce satışı caiz görmemişlerdir. Hanefîler ise; garar'ı dikkate alarak kabzdan önce satışı gayri menkullerde caiz görürlerken menkullerde görmemişlerdir. Mâlikîler hadislerde geçen taam'ı (yiyecek maddesi) dikkate alarak yasaklığı sadece yiyecek maddelerinde geçerli görmüşlerdir.Hanbelîler'e göre ise; hadislerde vurgulanan ölçme ve tartma işlerini dikkate alınarak ölçülmeden ve tartılmadan önce mal satılamaz. Malın kabzedilmeden önce hasar sorumluluğu mal sahibine aittir. Malın kabzedilmesiyle hasar sorumluluğu müşteriye geçmektedir. Hasar sorumluluğunun müşteriye geçmesi sebebiyle kabz müşterinin borcu olarak kabul edilir. Kabz öncesi satış yasağı konusunda deliller dikkate alındığında kabz öncesi satışın haksız kazanca sebep olması ve garar içermesi sebebiyle Hanefîler'in ve Şâfiîler'in görüşünün daha genel geçer olduğu ortaya çıkmaktadır. Anahtar Kelimeler: Kabz, hiyaza, tazmin, keylî, veznî, taam."
