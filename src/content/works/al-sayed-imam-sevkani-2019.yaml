abstract: "Bu çalışma İmam Şevkânî'ye göre taharet konusundaki şerʿî ruhsatları ele almayı hedeflemektedir. Giriş ve üç bölümden oluşan bu araştırmanın giriş bölümünde araştırmanın önemi, yöntemi, ele alınan mesele ve önceki çalışmalar hakkında bilgi verilmiştir. Birinci bölümde İmam Şevkânî'nin hayatı ve ilmi konumundan bahsedilmektedir. İkinci bölümde şer'i ruhsatın tarifi yapılıp türleri işlenmekte, ruhsatların delilleri ve onları mubah kılıcı sebepler ortaya koyulmaktadır. Üçüncü bölümde ise İmam Şevkânî'ye göre taharet konusundaki şer'i ruhsatlar diğer mezheplerin görüşleriyle karşılaştırmalı bir şekilde ele alınmaktadır. Bu bölümde yolculuğun, hastalığın, acizliğin, unutmanın, hayız ve nifas hallerinin taharete etkileri incelenmektedir. Çalışma İmam Şevkânî'nin taharet konusundaki görüşlerinin dört mezhebin görüşleriyle uyumlu olduğunu göstermiştir. Onun içtihatları dört mezhebin görüşlerine aykırı değildir. Taharet örneğinde ortaya konulan şeri ruhsatların, dini mükellefiyetleri nasıl kolaylaştırdığı konusuna küçük de olsa bir katkıda bulunması umulmaktadır."
