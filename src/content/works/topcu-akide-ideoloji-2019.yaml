abstract: "Çağdaş selefi gruplar tarafından yaygın olarak gündemde tutulan“tekfir”konusu, çağdaş selefiliğin“akide”açısından incelenmesini zorunlu hale getirmiştir. Çağdaş selefiliğin diğer sünni Müslümanlara karşı“hakikat”olduğu iddiasının temeli akidedir. Çağdaş selefiğe göre İslam'ın akidesi zamanla değiştirilmiştir. Değişmeyen saf akideyi koruyanlar ise kendileridir. Çağdaş selefiliğin akide olarak addettiği esasların siyasala yakınlığı, akideyi ideolojiyle birlikte düşünmeyi gerektirmiştir. Bu bağlamda bu çalışmada selefiğin siyasal konulara akidevi olarak yaklaşması incelenmiştir. Tevhid, şeriat, demokrasi, eğitim, cihat gibi konuların akidevi temelleri ve ideolojik yansımaları gösterilmiştir. Selefiliğin ideolojiyi bir bütün olarak ele alışı nedeniyle toplum ve insana bakışı da gösterilmiştir."
