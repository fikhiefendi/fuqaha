abstract: "Aile toplumun en küçük birimidir ve evlilikle kurulur. İslâm dini aileye büyük önem vermiş, evliliği teşvik etmiş ancak boşanmayı hoş görmemiştir. İslâm aile yapısında arzu edilen hedef, evliliğin bir ömür boyu sürmesi, karı kocanın hayatın zor şartlarına beraber göğüs germeleri, sevinç ve üzüntülerinde birbirlerine destek olmaları, güzellikleri de acıları da paylaşmaları, aile ortamını sıcak bir yuvaya dönüştürmeleridir. Ancak çeşitli sebeplerle eşler arasında problemler oluşur, boşanmalar gerçekleşir. Boşanma, çok hassas, sonuçları çok acı ve çoğunlukla geri dönüşü olmayan bir iştir. Bu konuda Hz. Peygamber'in (s.a.s.) örnekliği çok önemlidir. Hz. Peygamber (s.a.s.), söz, fiil ve takrirleriyle Müslümanlar için en güzel örnektir. Kâmil bir mümin olabilmenin en önemli ve ilk şartı Hz. Peygamber'i (s.a.s.) örnek almaktır.“And olsun, Allah'ın Rasûlünde sizin için; Allah'a ve ahiret gününe kavuşmayı uman, Allah'ı çok zikreden kimseler için güzel bir örnek vardır”ayetinde olduğu gibi onun örnek şahsiyeti Kur'an-ı Kerim'de vurgulanmıştır. Çalışmamızda Hz. Peygamber'in (s.a.s.) örnekliğini ortaya koymak maksadıyla onun boşanmalara karşı tavrını incelemeyi uygun gördük. Model insan Hz. Peygamber'in (s.a.s.) boşanmalara karşı izlediği yöntem, günümüz Müslümanlarının aile içi huzursuzluklara ve boşanmalara karşı sergileyecekleri tutum ve davranışlar için de önemli bir yere sahiptir. İşte bunları gözler önüne sermek çalışmamızın amacını oluşturmaktadır. Hz. Peygamber'in takındığı tavırlarda günümüz Müslümanlarının alması gereken ibretler olduğu kanaatindeyiz. Bu çalışmayı hazırlarken hadis kitaplarında bir sınırlamaya giderek sadece Kütüb-i Sitte'de geçen talâk ile ilgili hadisleri bir araya getirdik ve hadisler ışığında Hz. Peygamber'in (s.a.s.) boşanmalara karşı tutum ve davranışlarını tespit etmeye çalıştık. Bununla birlikte Kütüb-i Sitte'de geçen hadisler için ulaşabildiğimiz diğer hadis kitaplarına da atıfta bulunduk. Tezimiz, giriş dışında iki bölüm ve sonuçtan oluşmaktadır. Girişte Hz. Peygamber'in örnekliğinden, konu ve kaynaklardan bahsedilmiş, konunun üzerine bina edildiği talâk kavramı üzerinde durulmuştur. Talâk kavramının sözlük ve terim manası ortaya konduktan sonra bu kavramla bağlantılı diğer kavramlar üzerinde durulmuştur. Talâkın tarihi seyri ortaya konmuştur. Hz. Peygamber döneminde talâkın ortaya çıkmasındaki temel faktörlerden biri olması nedeniyle, cahiliye döneminde talâk üzerinde durulmuştur. Birinci bölümde“Kütüb-i Sitte”de geçen talâkla ilgili hadisler değerlendirilerek, hadisler ışığında talâk'ın nasıl anlaşılması gerektiği tesbit edilmiş ve ikinci bölümde de Hz. Peygamber'in boşanmalara karşı tavrı ortaya konulmaya çalışılmıştır. Sonuç bölümünde ise genel bir değerlendirme yapılarak tezde ulaşılan neticeler zikredilmiştir. Bu sebeple tez başlığının,“Hazreti Peygamber'in Boşanmalara Karşı Tavrı”şeklinde konulması uygun görülmüştür."
