abstract: "Bu çalışma, Müslümanların kutsal kitabı olan Kur'ân'ın öğretimi için temel kaynak olarak kullanılan elifbâ cüzünün farklı İslâm Ülkeleri'ndeki örneklerini mukayeseli olarak incelemektedir. Ülkemizde ulusal düzeyde çeşitli çalışmalar olsa da uluslararası bir incelemenin yapılmamış olması böyle bir konuyu çalışmamızda bizi teşvik eden ana unsurdur. Üç bölümden oluşan çalışmamızın birinci bölümünde, Kur'ân'ın nüzûl süreci ve İslâm'ın mevâlî arasında yayılmasıyla elifbâ cüzlerine olan ihtiyaç tarihsel süreç olarak ele alınmıştır. İkinci bölümde, alfabeler ve yazı hakkında bilgiler verilerek, alfabe ve yazı ile elifbâ arasında bulunan alakalar sunulmaya çalışılmıştır. Son olarak üçüncü bölümde, İslâm Dünyası'nda günümüzde yaygın olarak kullanılan elifbâ cüzleri analiz edilmiş ve söz konusu cüzlerin benzerlikleri ile farklılıkları ortaya konulmaya çalışılmıştır. Çalışmanın hedefi ise Kur'ân öğretiminde birincil kaynak olarak kullanılan elifbâ cüzünün farklı ülkelerdeki örneklerinin, Kur'ân öğretimine sunmuş oldukları olumlu katkıların ve sahip oldukları noksanlıkların tespit edilmesidir. Bu tespitler ve yapılan analizler neticesinde de ideal bir elifbâ cüzü teklifi geliştirilmesidir."
