abstract: "Bu çalışmada, Tanzanya'daki müslüman ve gayrimüslim vatandaşların karşılaştırılmasına yönelik, islami bankacılığa ilişkin farkındalıklar ve islami bankacılık ürün ve hizmetlerinin tercih edilmesine neden olan faktörler araştırılmıştır. Kartopu örneklem yöntemi ile 330'u müslüman ve 330'u gayrimüslim olmak üzere 660 kişiye anket uygulanmıştır. Tanzanay'daki islami bankacılığa ilişkin algılar açısından müslümanlarla gayrimüslimler arasında anlamlı bir fark olup olmadığının araştırılması için ki-kare testi kullanılmıştır. Müslüman katılımcıların yaklaşık üçte ikisinin islami bankacılığın farkında olmasına gayrimüslimlerin yalnızca üçte birinin farkında olduğu bulunmuştur. İnsanların islami bankacılık ürün ve hizmetleri ile bilgileri daha çok arkadaşlarından ve islami bankalardan edindiği anlaşılmaktadır. İnsanlar, islami bankacılığı, sunulan ürün ve hizmetlerin faizsiz olması ve kar zarar ortaklığına dayanması nedeniyle tercih etme eğilimindedir. Vatandaşların islami bankacılığa ilişkin bilgi düzeyleri ve algıları açısından, müslümanlar ve gayrimüslimler arasında anlamlı farklar olduğu gözlenmektedir."
