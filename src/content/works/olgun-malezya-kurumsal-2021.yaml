abstract: "Modern dönemde zekâtın mükelleflerce ferdi olarak verimsiz ve ihmalkâr bir şekilde yürütülmesi, dünya genelinde artan açlık ve fakirlik, servetin bir zümrenin elinde tekelleşmesi gibi hakikatler, zekâtın Hz. Peygamber ve Hulefâ-yi Râşidîn dönemlerinde olduğu gibi yeniden devlet eliyle yürütülmesi gerektiği gerçeğini bizlere hatırlatmıştır. Günümüzde zekât yönetimini devlet eliyle gerçekleştiren Suudi Arabistan, Mısır, Endonezya ve Malezya gibi ülkeler arasında Malezya'nın kurumsal zekât uygulaması alanında kendini giderek geliştirmesi, zekât yönetimindeki yenilikçi anlayışı ve bu alandaki başarısıyla diğer ülkelere kıyasen daha ön plana çıktığı görülmüştür. Malezya kurumsal zekât uygulamasının bu temâyüz etmiş tecrübesinin fıkhî açıdan incelenmesi ve bu çalışmanın modern dönem İslam hukuku çalışmalarına katkı sağlaması amacı bizi bu çalışmayı gerçekleştirmeye sevk etti. Bu itibarla gerçekleştirilen bu çalışmada Malezya'daki kurumsal zekât sistemi hakkında bilgiler verilerek bu bilgiler ışığında klasik ve modern kaynakların taranmasıyla zekâtın toplanma usulü ve sarf yerlerinin fıkhî açıdan tahlil edilmesi amaçlanmıştır. Malezya'daki zekât sistemini ortaya koyarken ülkede zekât yönetiminde en başarılı konumda olan Federal Bölge ve Selangor eyaletlerinin uygulamalarına yoğunlaşılmış, yer yer diğer eyaletler hakkında da malumatlar zikredilmiştir. Bu çalışma neticesinde Şâfiî mezhebine mensup Malezya Devleti'ndeki Müslümanların, zekâtın toplanma ve sarf usulleriyle alakalı fıkhî konularda diğer mezheplerin görüşleriyle de amel ettiği, özellikle çağdaş ilim adamlarının ictihadlarından âzami derecede istifade ettiği tespit edilmiştir. Ayrıca zekâtta temlik şartını dikkate almadıkları, mâl-i müstefâd kapsamında gelir-maaş üzerinden zekât tahsilinde havl şartına itibar etmedikleri ve zekâtın sarf yerlerinden özellikle müellefe-i kulûb, rikâb ve fî sebîlillah sınıflarını oldukça geniş tanımladıkları fark edilmiştir. Zekât sarf yerlerinden bazı sınıflar kapsamında gayri müslimlerin de zekât fonundan yararlanabildiği ve eyaletler arasında zekât transferi olmadığı saptanmıştır. Ayrıca zekât sarf yerlerine yönelik fakirlik şartını fakir ve miskin sınıfları haricinde pek dikkate almadıkları anlaşılmıştır."
