abstract: "İnsanlar arasındaki ilişkilerin bir düzen dahilinde yürümesi, hukukun esas gayelerindendir. Toplumda kişilerin, aralarında kendi iradeleri ile çözemedikleri ihtilafları, sayılan, sevilen, bilgili ve liderlik vasfı olan kimselere götürerek yardım istemeleri, çok eski zamanlardan beri süregelen adetlerdendir. Kişinin, kendi hakkını kendisinin almaya (ihkak-ı hak) kalkmasının, barış ve huzur ortamını ne kadar bozucu olacağı aşikardır. Uyuşmazlıkların çözümünde, hakimiyet hakkı gereği, resmi otoritenin görevlendirdiği kurumlara müracaat esas olsa da bu kurumların iş yükünü azaltmak, zaman kazanmak gibi sâiklerle hakemlere başvurmanın uygun bir yol olduğu görülmektedir. Tarihte bu yolun kabul gördüğü ve çokça uygulanarak bugünlere gelindiği bilinmektedir. Bugün hem İslam hukuku hem de modern hukuk uygulayıcıları, tahkim kurumunu, belli şart ve kurallarla düzenleyerek, sağlıklı bir tahkim süreci işleyişini garanti altına almaya çalışmaktadırlar. Bu çalışmanın konusu, bir hukuk kurumu olan“tahkim”in önce tarihsel arka planı ve İslam hukukunda bulunduğu yerin tespiti, sonra İslam hukuku alanındaki ilk kanunlaştırma örneği olan Mecelle-i Ahkam-ı Adliye'deki düzenlemenin incelenmesidir. Üçüncü bölümde ise, bugün yürürlükte bulunan 6100 sayılı Hukuk Muhakemeleri Kanunu çerçevesinde“tahkim”kurumunun geldiği noktanın tesbiti ve son olarak Mecelle'de düzenlenen tahkim ile HMK.da düzenlenen tahkim arasındaki farkların belirlenmesine çalışılmıştır."
