abstract: "Fıkıh literatürünü usûl, furu' ve kavâid kitapları şeklinde üç grupta mütalaa etmek mümkündür. Tarih itibariyle önce furu' ve usûl kitapları, dördüncü asrın başlarından itibaren de kavâid kitapları telif edilmeye başlamıştır ve zamanla müstakil kavâid literatürü oluşmuştur. Kavâid kitaplarının telifinde müslüman toplumların kolektif şuurunu oluşturan ana unsur olarak Kur'an ve Sünnet'in, toplumsal sağ duyuyu yansıtan ortak kabullerin ve fakihler tarafından geliştirilen re'y ve ictihadların payı olduğu göz ardı etmememiz lazım. Fıkhın delaletinden istinbat eden mücerret fıkıh düşüncesinin temelini teşkil eden küllî kâideler fıkhın özünü yansıtır, fıkıh mantığı, fıkıh felsefesi ve fıkıh nosyonu kazandırır. İbn Nüceym'in ifadesiyle, küllî kâidelere vakıf olmak fakihi fetvada müctehid seviyesine çıkarır. Mustafa Nazmi'nin Temsîl-i Kavâid ve Zavâbit-i İlm-i Hukuk adlı eserinde Mecelle'deki 99 kavâid-i fıkhiyye aynen iktibas edilmekle birlikte, toplamda 238 kâide ve zâbıta tespit edilir. Eserde hakîkat, mecaz, ictihad, telfîk, ızdırâr, özür, ıstıshâp, örf, adet, maslahat gibi usûlü fıkhın konularının yanı sıra, mülkiyet, tasarruf, butlân, fesât, bey, ikâle, icâre, karz, hacr, rehin, velâyet, vekâlet, kefâlet, havâle, vakıf, mefkûd, husûmet, ukûbet gibi furu'u fıkhın birçok konusuyla ilgili kâide ve zâbıta bulunur. Kâide ve zâbıtaların izahında Tanzimat sonrası çeşitli kanunnâmelere atıf yapılmasıyla, sadece İslam hukuku açısından değil, Türk hukuk tarihi açısından da eser kıymetli bilgiler ihtiva eder."
