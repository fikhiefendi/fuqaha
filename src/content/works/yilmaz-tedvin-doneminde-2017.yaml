abstract: "Bu çalışmada, fıkıh literatürünün ilk örneklerini ortaya koyan ve böylece hem bu ilmin hem de Hanefî mezhebinin ilk müdevvinleri olan üç müçtehit fakihin; Ebû Yûsuf, Muhammed b. El-Hasen eş-Şeybânî ve Hasan b. Ziyâd el-Lüʾlüî'nin günümüze ulaşmayan eserleri konu edilmiştir. Çalışmanın temel malzemesini, biyo-bibliyografik eserlerin yanı sıra, başta V/XI. asrın Bağdatlı fakihlerinden Nâtıfî'nin el Ecnâs'ı olmak üzere, Serahsî'nin el Mebsût'u, Ebû'l-Leys es Semerkandî'nin ʿUyûnü'l-mesâil'i ve Burhaneddin el-Buhârî'nin el-Muhîtu'l-Burhânî'si ile diğer fürû-ı fıkıh eserleri üzerinde yapılan okumalar ve elektronik ortamlardaki taramalar ortaya çıkarmıştır. Ortaya koyduğu bulgular itibariyle, biyo-bibliyografik eserlerden daha ziyâde fıkıh literatürünün birer parçası olan bu furû-ı fıkıh eserlerine dayanması, çalışmanın mümeyyiz vasfını teşkil etmektedir. Çalışmada, fıkıh ilminin ilk tedvin döneminin ürünleri olan bu kayıp literatürün tespiti ve tanıtımı hedeflenmiştir."
