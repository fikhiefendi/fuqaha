abstract: "Hanbelî mezhebine katkıları olan alimlerden birisi İbn Kudâme'dir. Onun el-Muğnî adlı eseri geniş muhtevası, delillere yer vermesi ve değerlendirmeleriyle ön plana çıkmaktadır. Bu eserden yola çıkarak İbn Kudâme'nin mezhepteki yerini ve katkılarını tespit etmeye çalıştık. Birinci bölümde önce İbn Kudâme'nin hayatına, eserlerine ve kendisi üzerine yapılmış değerlendirmelere yer verdik. Yine bu bölümde el-Muğnî'nin Kitabu'n-nikâh bahsindeki tespitlerimizden yola çıkarak eser hakkında yöntemsel bilgileri örnekleriyle sunmaya çalıştık. İkinci bölümde ise Kitabu'n-nikâh bölümünü Hanbelî fıkıh eserleri ile mukayese ettik. el-Muğnî'den önce telif edilen muhtasar ve şerh türü eserleri; el-Muğnî'den sonra yalnızca şerh türü eserleri inceledik. Nikâh bölümü çerçevesinde, Hanbelî mezhebi ulemasının mezhep içi fıkhî mesaisi üzerinde durduk. İbn Kudâme'nin kendisinden önceki fakihlerden farklı tercihlerini, değerlendirmelerini, benzerlik ve farklılıklarını tespit etmeye çalıştık. Ardından İbn Kudâme'nin kendisinden sonraki Hanbelî fakihleri üzerinde ibare, tercih, tahlil veya kaynaklık etmesi bakımından bir etkisinin/katkısının olup olmadığı, olduysa nasıl olduğu üzerinde durduk."
