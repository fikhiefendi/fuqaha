abstract: "Günümüzde, aile problemlerinin artması ve topluma olan etkisinin büyümesi nedeniyle aile kurumu, toplumun önemli konusu haline gelmiştir. Bu sebeple aile hukukuna yönelimler artmış olup, aile ile ilgili çalışmalar önem arz etmeye başlamıştır. İslâm aile hukukunda mal rejimi, mal ayrılığı rejimidir. Mal ayrılığı rejimi, mülkiyet sahibi olan çiftlerden her birinin tek taraflı yetki ile mülkiyetlerinde bulunan malların yönetimi, kullanımı ve tasarruflarından doğan bütün hak ve sorumluluklarının kendilerine ait olduğunu ifade eden hukukî kavramdır. Her insanın mülk edinme ve tasarruf etme hakkı bulunmakla beraber bu hak ve yetkiler bazı durumlarda sınırlandırılmaktadır. Klasik eserlerde mal ayrılığı rejimi, kavramsal olarak bulunmamakla beraber mal ayrılığı rejiminin ihtiva ettiği birçok konu ayrı başlıklar halinde ele alınmıştır. Bu çalışmada, mal ayrılığı rejiminin temeli olan mal, mülkiyet, ehliyet ve haklar konusunu klasik eserler ışığında ele alarak İslâm aile hukuku mal ayrılığı rejimi teorisi tespit edilmeye çalışılmıştır. Birinci bölümde mal ve mülkiyet konusu ele alınıp, sorunlara çözümler üretilmiş, ikinci bölümde ise ehliyet ve hak konusu ele alınıp, problemlere çözüm önerileri sunulmuştur. Anahtar kelimeler; Mal, Mal rejimi, Mal ayrılığı rejimi, Mülkiyet, Ehliyet, Haklar."
