abstract: "ÖZET Bu çalışmamızda bazı batılı hukukçular tarafından ileri sürülen, Roma Hukukunun İslâm hukukuna etki ettiği ve onun bu kadar düzenli ve sistemli bir şekilde oluşmasını Roma Hukukuna borçlu olduğu iddiaları değerlendirilmiştir. Bu iddialar ilmi bir anlayışla cevaplandırılmaya çalışılmıştır. Hukuk sistemlerinin de diğer beşer kanun ve müesseseleri gibi kendisinden önce gelenlerin ve çağdaşlarının tesirleri altında kalmış olmaları tabiî bir hadisedir. Şayet İslâm hukuku da kendinden önce gelmiş olan hukuk sistemlerinden ve Roma Hukukundan şu veya bu şekilde etkilenmişse bunda şaşılacak bir şey yoktur. Ancak yaptığımız araştırmada böyle bir tesirin olmadığı anlaşılmıştır. İki hukuk arasında bazı kaidelerin birbirine benzemesi normaldir. Çünkü insanların da önceden tesbit ettiği bazı kaideler, İslâm hukukuna da uygundur. Zaten İslâm hukukunun, yabancı kaynaklardan faydalandığının zannedilmesinin sebebi de budur. Bu çalışmada, birbirine benzeyen kaidelerin yanısıra iki hukuk arasındaki genel farklılıklara da değinilerek bilgi verilmiştir."
