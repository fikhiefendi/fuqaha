abstract: "Ahkâm Ayetlerinin Tefsirlerinde Dilsel Yönlendirme – Namaz Örneği – Fıkhî ve Dilbilimsel Bir İnceleme\" başlıklı tez, ahkâm ayetlerinin tefsiriyle ilgili dört kitabı ele almıştır. Bu kitaplar şunlardır: Hanefî mezhebine ait Cassâs'ın Ahkâmü'l-Kur'ânı, Mâlikî mezhebine ait İbnü'l-Arabî'nin Ahkâmü'l-Kur'ânı, Şâfiî mezhebine ait Hırâsî'nin Ahkâmü'l-Kur'ânı ve Hanbelî mezhebine ait İbnü'l-Cevzî'nin Zâdü'l-Mesîr adlı eseri. Sonuncu kitap genel bir Kur'ân tefsiri olmakla birlikte, Kur'ân'daki hüküm ayetlerine özel önem vermektedir. Bu nedenle araştırmacı, Hanbelî mezhebindeki ahkâm ayetleri için bu eseri kaynak olarak seçmiştir. Araştırmacı tezini bir giriş ve iki bölüm şeklinde düzenlemiştir. Giriş bölümünde, Ahkâmü'l-Kur'ân kitaplarının doğuşuna dair tarihî bir özet sunmuş ve bu kitapların farklı ilimlerle ilişkisine değinmiştir. Birinci bölümde ise, dört müfessirin hayatı ve tefsir yöntemleri ele alınmıştır. İkinci bölümde araştırmacı, namazla ilgili ayetleri incelemiş ve bu ayetleri beş konu başlığı altında sınıflandırmıştır: 1. Namazı ikame etmek 2. Namaz vakitleri 3. Seferde namaz 4. Cuma namazı 5. Gece namazı Bu bölümde araştırmacı, dilin bu müfessirlerin tercihlerine olan etkisini ortaya koymuştur. Tezde kullanılan yöntem, tümevarımcı, analizci ve karşılaştırmalı bir yöntemdir. Namazla ilgili ayetler dört tefsirden tek tek toplanmış, bu ayetlerde geçen anlam açısından önemli kelimeler dilbilimsel olarak analiz edilmiş, ardından tefsirler arasında ve dil kitaplarıyla karşılaştırmalar yapılarak dilin fıkhî hükümlere etkisi ortaya konmuştur. Çalışmanın en önemli sonuçlarından biri, Arapçadaki çok anlamlı kelimelerin varlığı sebebiyle müfessirlerin, bu kelimelere verdikleri farklı anlamlar doğrultusunda fıkhî hükümlerde ihtilafa düştüklerinin ortaya konmasıdır. Bu durum, araştırmanın sonunda sunulan sonuçlarda açık bir şekilde görülmektedir."
