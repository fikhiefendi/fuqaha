abstract: "İşbu çalışma“İslamı Vakıf Ve Birleşmiş Milletler'ın 2030 Sürdürülebilir Kalkınma Hedeflerini Gerçekleştirmedeki Rolü- Saha Çalışması”nü araştırmayı hedeflemektedir. Bu doğrultuda vakıfların sürdürülebilir kalkınmadaki hedeflerini gerçekleştirmedeki rolleri öğrenilecektir. Vakıf ile sürdürülebilir kalkınma arasındaki ilişkinin olup olmadığı araştırılacaktır. Vakıfların bu hedefleri gerçekleştirme imkanları irdelenecektir. Araştırmacı bu çalışmada betimsel tümevarımsal yaklaşım metodunu kullanmıştır. Bu bağlamda araştırmacı vakıflar ve sürdürülebilir kalkınma alanında bilim adamı ve araştırmacılar tarafından yazılan kaynaklara dönmüştür. Aynı zamanda vakıfların BM'nin 2030 hedeflerini gerçekleştirme boyutlarını ölçebilme adına Türkiye ve Arap coğrafyasında vakıf kuruluşları ve çalışanlarından rastgele gruba anket dağıtımı yaparak istatistiksel analitik yönteme de başvurmuştur. Araştırmacı, vakıfların BM'nin sürdürülebilir kalkınma 2030 hedeflerini gerçekleştirmede rolünün olduğuna varmıştır. Aynı zamanda İslami vakıfların Peygamber Efendimiz (s.a.v.)'in döneminden günümüze kadar bu alanda çalıştığına varmıştır. Bu da vakıfların Birleşmiş Milletler kurulmadan önce de ekonomik, sosyal, sağlık, çevre ve eğitim gibi çeşitli alanlarda toplumu kalkındırmada büyük rolünün olduğu anlamına gelmektedir. Araştırmacı vakıflarla bu hedefler arasında ilişkinin olduğuna varmıştır. Hatta vakıfların bu hedefler için kurulduğunu ancak BM'nin hedeflerinden kendini soyutladığı söylemektedir. Araştırma, vakıflarda çalışan personellerin Birleşmiş Milletlerin sürdürebilir kalkınma hedefleri noktasında bilinçlendirilmesi gerektiğini önermektedir. Ayrıca, deniz yaşamına, çevreye, suya ve kanalizasyona önem verilmesininin gerekliliğini tavsiye etmektedir."
