abstract: "Celâlüddîn Habbâzî, hicrî yedinci asırda yaşamış Mâverâünnehir bölgesi Hanefî fakihlerindendir. Onun usûle dair kaleme almış olduğu el-Muğnî isimli eserinin mukaddimesi bulunmamaktadır. Ancak eserde takip ettiği konu sıralaması ve yazım üslûbuna kısaca göz atıldığında mezkûr telifin Pezdevî ve Serahsî'nin usûllerinden ihtisar edilerek hazırlandığı görülmektedir. Bu bağlamda Habbâzî'nin usûl meselelerini değerlendirme şekli, el-Muğnî ve onun kendi şerhi Şerhu'l-Muğnî isimli telifleri ile yukarıdaki eserler karşılaştırılarak ortaya konulmuştur. Ayrıca onun Pezdevî ve Serahsî'nin usûlünü ne oranda takip ettiği ve özgün görüşlerinin bulunup bulunmadığı tespit edilmeye çalışılmıştır. Habbâzî'nin usûl metodunu ortaya koymayı hedefleyen bu çalışma bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde konunun önemi, sınırlandırılması, kaynak analizi ve ilgili çalışmalar ele alınmıştır. Birinci bölümde Habbâzî'nin hayatı, ilmi kişiliği, eserleri, usûl metodunun temel özellikleri, el-Muğnî'deki konuların tertibi, eserdeki üslubu ve konuları ele alınmış; ikinci ve üçüncü bölümde ise Habbâzî'nin usûl yaklaşımını ortaya koyabilmek amacıyla el-Muğnî ve Şerhu'l-Muğnî'den şer'î deliller ile lafız ve hüküm konuları seçilmiş; bu bağlamda söz konusu teliflerle Pezdevî ve Serahsî'nin usûl eserleri mukayeseli olarak tahlil edilmiştir."
