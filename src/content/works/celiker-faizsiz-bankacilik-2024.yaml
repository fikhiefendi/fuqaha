abstract: "Türkiye Cumhuriyet Merkez Bankası (TCMB) para politikası araçları (açık piyasa işlemleri, döviz piyasası işlemleri, son kredi mercii işlemleri) faiz temelli olup daha çok konvansiyonel bankacılık faaliyetlerine yöneliktir. Faizsiz bankalar İslami kaideleri temel alan, bu doğrultuda faaliyetlerini faizsiz yöntemlerle ekonomik değerlere kanalize etmeye çalışan kurumlardır. Faizsiz bankalar kendilerine öz çalışma prensipleri ve faizsizlik ilkesi gereği TCMB'nin faiz temelli para politikası araçlarından faydalanamamakta ve bu nedenle TCMB bünyesinde likidite yönetimi gerçekleştirememektedir. Faizsiz bankaların TCMB bünyesinde konvansiyonel bankalar ile likidite yönetimi konusunda aynı imkânlara sahip olamaması, faizsiz bankalar açısından bir haksız rekabet ortamı oluşturmaktadır. Bu nedenle çalışma kapsamında TCMB'nin para politikası araçlarının konvansiyonel bankaların kârlılıkları üzerindeki etkisi belirlenmeye çalışılmıştır. Bu sayede konvansiyonel bankaların bu araçları kullanmasının bir sonucu olarak elde etmiş olduğu kazanımlar, faizsiz bankaların ise bu araçları kullanamamasının bir sonucu olarak yaşamış olduğu kayıplar ortaya konulmaya çalışılmıştır. Daha sonra ise faizsiz bankaların TCMB bünyesinde likidite yönetimi gerçekleştirmesine olanak sağlayacak, TCMB'nin mevcut para politikası araçlarına alternatif faizsiz model önerileri sunulmuştur. Çalışmada öncelikli olarak faizsiz bankalar tarafından kullanılamayan ancak konvansiyonel bankalar tarafından kullanılabilen TCMB para politikası araçlarının (repo, ters repo, gün içi likidite, döviz depo) konvansiyonel bankaların kârlılığı üzerindeki etkisi belirlenmeye çalışılmıştır. Seçilen para politikası araçlarının konvansiyonel bankaların kârlılıkları üzerindeki etkisini ölçmek amacı ile ARDL sınır testi analizi kullanılmıştır. Analiz sonuçlarına göre, seçilen para politikası araçları ile konvansiyonel bankaların kârlılıkları arasında bir eş bütünleşmenin olduğu ve repo, ters repo ve gün içi likidite araçlarının konvansiyoonel bankaların kârlılığını uzun dönemde pozitif olarak etkilediği görülmüştür. Analizler sonucu elde edilen bu tespitlerden sonra faizsiz bankacılık alanında öncü olan ülkelerin (Malezya, Bahreyn, İngiltere, BAE gibi) merkez bankalarının faizsiz bankalara sunduğu faizsiz para politikası araçları incelenmiştir. Ayrıca TCMB'nin de para politikası araçları faizsiz bankacılık ilkeleri kapsamında incelenmiştir. Bu doğrultuda faizsiz bankalar tarafından kullanılabilen ve kullanılamayan para politikası araçları için TCMB'ye yeni faizsiz para politikası araçları model önerisi (bankalararası mudaraba yatırımı, enflasyon farkına bağlı kârz, teminatlı murabaha yöntemi, vekâlet yatırımı yöntemi, icâre sukuk, emtia murabahası yöntemi, murabaha yöntemi ile swap uygulaması) olarak sunulmuştur. Sunulan faizsiz para politikası model önerileri sayesinde, faizsiz bankalar TCMB bünyesinde likidite yönetimi gerçekleştirebilecektir. Son olarak çalışma kapsamında ikili (dual) bankacılık yapısı içerisinde her iki bankacılık türünün yer aldığı bir parasal aktarım mekanizması model önerisi olarak sunulmuştur. Bu çalışma ile merkez bankalarının para politikası araçlarının genişletilmesi yoluyla faizsiz bankaların kredi olanaklarının arttırılmasına katkı sağlanacağı ve ülkenin ekonomik katma değerinin artmasına yol açacağı düşünülmektedir."
