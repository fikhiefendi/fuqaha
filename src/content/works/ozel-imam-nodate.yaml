abstract: "Şâfiî'ye ait görüşlerin kadîm-cedîd şeklindeki tasnifi mezhep yapısı açısından önemli bir meseledir. Bu ayrıma dikkat etmeden mezhep hakkında bir görüş ileri sürmek doğru görülmemiştir. Nasların zâhirine sıkıca bağlı kalınması ve ihtiyat ilkesinin gözetilmesi kavl-i cedîdin, meşakkat ve güçlüğü gidermenin ön planda tutulması ise kavl-i kadîmin öne çıkan özelliklerindendir. Mezhebe temel teşkil eden cedîd grubuna giren görüşlerdir. Şâfiî'nin cedîdde hilâfına hükümde bulunup vazgeçtiğini zikrettiği kavl-i kadîmin Şâfiî'yi temsil etmediği tartışma konusu olmamıştır. Muârızı bulunmayan sahih bir hadisle desteklenen kavl-i kadîm, kavl-i cedîdin kendisine aykırı olmadığı kavl-i kadîm ve kavl-i cedîdde temas edilmeyen kavl-i kadîmin de Şâfiî'yi temsil ettiği hususu tartışma konusu olmamıştır. Ancak Şâfiî'nin cedîdde vazgeçtiğini zikretmediği veya vazgeçtiğine delâlet eden bir ifade kullanmadığı, kavl-i cedîde aykırı kavl-i kadîm hakkında ise mezhep çevrelerinde ihtilâf vaki olmuştur. Şâfiî'nin fürû'unda görülen değişime; fürû mesâili ile ilintili cüz'î meselelerin değişimi, üzerine fürû mesâili bina edilen fıkhî kâide/dâbıtların değişimi, usûl-i fıkıh kâidelerindeki değişim, tercihteki değişim ve usûldeki değişim olmak üzere başlıca beş hususun neden olduğu tespit edilmiştir. Şâfiî'nin usûl anlayışında on altı meselede değişim gerçekleştiği iddia edilse de fürû fıkhının aksine değişimin usûlde dört konuyla sınırlı kaldığı tespit edilmiştir. Nitekim Iraklı râvilerin hadisleriyle ihticâc edilmemesi, sahâbe kavlinin kıyasa öncelenmesi, Medine ehli uygulamasının hücciyeti konularında kadîmden cedîde, tâbiîn'in 'bu Sünnettendir' ifadesinin delil değeri konusunda ise cedîd içinde değişimin yaşandığı görülmektedir. Anahtar Kelimeler: İmâm Şâfiî, Kavl-i kadîm, Kavl-i cedîd."
