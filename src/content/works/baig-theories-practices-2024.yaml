abstract: "İslami finansal türevler, diğer İslami finans ürünleriyle karşılaştırıldığında büyümelerini engelleyen makro düzeyde önemli zorluklarla karşı karşıyadır. Bu doktora tez çalışmamız, İslami finans literatüründeki bu kritik boşluğu gidermek için potansiyel inovasyon alanlarını araştırmaktadır.“İslami Türevlerin Teorileri, Uygulamaları ve Potansiyelleri: İslami Finansal Yenilik Arayışı”başlıklı tezimiz bu sınırlamaların üstesinden gelmek için gerekli teorik temellere ve pratik uygulamalara odaklanmaktadır. Geleneksel türevlerin karmaşıklığını ve Şeriat uyumlu çözüm potansiyelini vurgulayarak, anketler ve görüşmeler yoluyla riskten korunmaya dayalı İslami ürünler geliştirmenin kapsamlı bir değerlendirmesini yapmaktadır. Ayrıca araştırma, Müslümanların çoğunlukta olduğu seçilmiş ülkelerde geleneksel türevler ile finansal piyasa etkinliği arasındaki ilişkiyi araştırmak için niceliksel bir analizi de içermektedir. Tez, türev ürünlerin Şeriat uyumluluğunu değerlendirebilecek Şeriat tarama kriterleri önermektedir. Sonuçta, İslami finansta yenilikçi çözümler sunarak Şeriat uyumlu riskten korunma ürünlerinin kullanımını optimize edecek yöntemleri keşfetmeyi hedeflemektedir. Regresyon testleri ve Otoregresif Dağılımlı Gecikme modeli kullanılarak anketlere ve niceliksel verilere istatistiksel ve ampirik testler uygulanmış, mülakat yanıtlarına ise tematik analiz uygulanmıştır. Anket ve mülakat yanıtları, İslami finansın Şeriat uyumlu ürünler geliştirme yeteneğinin sınırlı olduğu hipotezini çürütmektedir. Katılımcılar, gerçek varlıkların transferini içeren Şeriat uyumlu riskten korunma ürünlerinin etkili bir şekilde yapılandırılabileceğini vurgulamaktadır. Ek olarak, geleneksel ürünlerin şeriata uyum açısından incelenmesi, bunların İslami finansta kullanıma uygun hale getirilmesi için de gereklidir. Geleneksel ürünlerin mekanizmalarını anlamak aynı zamanda İslami riskten korunma ürünlerini yapılandırmak için de gereklidir. Ampirik kısımda, İslami Borsada işlem gören türevlerin finansal piyasaların verimliliğini 'etkilemeyeceği' hipotezi de test edilmiştir. Sonuçlar, türev Açık Pozisyonları ile Hisse Ciro Hızı aracılığıyla ölçülen finansal piyasa etkinliği arasında önemli pozitif korelasyonlar olduğunu göstermektedir. Bu bulgular, İslami ETD'lerin sermaye girişlerini artırarak ve ekonomik faaliyetleri destekleyerek piyasa etkinliğini artırabileceğini göstermektedir. Dolayısıyla niteliksel ve niceliksel incelemelerin bulguları her iki hipotezin de reddedildiğini göstermektedir. Araştırma bulguları, İslami finansın riskten korunmaya dayalı ürünler üretme potansiyelinin ve borsada işlem gören türevler ile finansal piyasa etkinliği arasında beklenen ilişkinin daha derinlemesine anlaşılmasını sağladı. Etkin risk yönetimi ve finansal istikrar için Şeriat uyumlu türevlerin önemini ortaya koyan araştırma, türev ürünler için Şeriat tarama mekanizmaları, İslami türevlerin riskten korunma olarak yeniden markalanması ve modern sürdürülebilirlik hedeflerini İslami etik ilkelerle bütünleştiren Sürdürülebilirlik Bağlantlı Sukuk ürünlerinin geliştirilmesini önermektedir. Önerilen Sürdürülebilirlik Bağlantılı Sukuk, Kar Oranı Takası modeli olarak uygulanmakata ve modern sürdürülebilirlik hedeflerini İslami etik ilkelerle bütünleştirerek Sukuk'un küresel çekiciliğini zenginleştirme ve İslami sermaye piyasasını genişletme potansiyeline sahiptir."
