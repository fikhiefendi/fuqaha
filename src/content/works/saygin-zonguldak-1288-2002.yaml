abstract: "ÖZET H. 1288-1289/ M. 1871-1872 yıllarına ait Zonguldak Şer'iyye Sicil Defteri'ni esas alarak yapılan bu çalışmada Zonguldak - Ereğli yöresinde yaşayan Müslüman-Türk ve Gayri-Müslimlerin sosyal hayattan incelenmiştir. Birinci bölümde, defterdeki kayıtlara geçmeden önce Zonguldak-Ereğli şehir adlarının menşei ve yörenin geçirdiği tarihsel evreler üzerinde durulmuştur. Bu bölümde Zonguldak'ın Kastamonu'nun Merkez Sancağı'na bağlı bir köy olduğu, Ereğli'nin ise Kastamonu Vilayeti'nin Bolu Sancağı'na bağlı bir kaza olduğu vurgulanmıştır. İkinci bölümde Zonguldak Şer'iyye Sicil Defteri'nin muhtevası anlatılmıştır. Bu arada defterde geçen bazı şahıs unvanlarının anlamlan izah edilmiş, insanların mallarını satmalarının, vasiyet etmelerinin, vekalet vermelerinin ve barışmalarının nasıl olduğu, örneklerle ifade edilmiştir. Üçüncü bölümde yörede yaşayan Müslüman-Türk ve Gayri-Müslim halkın yaşam biçimleri, meslekleri, giyimleri, evlenme gelenekleri gibi konular, Zonguldak Şer'iyye Sicil Defteri ışığında incelenmiştir. Ayrıca yörede geçen asayiş, aile-içi münasebetler ve toplumla ilgili meseleler örnekler verilerek belirtilmiştir. O dönemde Zonguldak-Ereğli yöresinde yaşayan Rumlar'ın da aynen Müslüman-Türkler gibi miras taksimlerini, toplumla ilgili meselelerini ve anlaşmazlıklarını Şer'iyye Mahkemeleri'nde çözmeleri dikkat çekicidir. Kadınların miras taksiminde, boşanma vs. gibi durumlarda mağdur edilmemesi ve tek eşliliğin hâkim olması, yörenin kadına verdiği önemi göstermesi bakımından manidardır. Sonuç olarak diyebiliriz ki, Osmanlı Toplumu'nun bir parçasını temsil eden Zonguldak-Ereğli yöresindeki sosyal yaşam, inançtan, ırkları farklı da olsa bir toplumun nasıl iç içe yaşayabileceğini göstermesi bakımından önemlidir."
