abstract: "Bu çalışmada katılım bankalarında çalışan personeller üzerinde psikolojik sözleşme ve örgüte güven konusu ve bu iki kavram arasındaki ilişkinin incelenmesi amaçlanmıştır. Literatürde bugüne kadar çeşitli alanlarda ayrı ayrı incelenmiş olan psikolojik sözleşme ve örgütsel güven kavramları bu çalışmada bir arada ele alınmış ve aralarındaki ilişki araştırılmıştır. Bu yönüyle araştırmanın literatüre katkı sağlaması beklenmektedir. Ayrıca araştırmanın yapılacağı sektör açısından da özgün bir değer içerdiği düşünülmektedir. Bankacılık sektörü çalışma ortamı ve yaptığı iş gerekçesiyle güven ve psikolojik sözleşme kavramlarının önemli olduğu bir sektördür. Bu sebeple araştırma örneklemi olarak Antalya ilinde görev yapmakta olan katılım bankalarında çalışan personel seçilmiştir. Araştırma kapsamında seçilen örnekleme anket uygulanarak nicel araştırma teknikleri kullanılmıştır. Çalışmanın uygulama kısmında, Antalya ilindeki katılım banka çalışanlarına toplam 256 adet anket dağıtılmıştır. Bu anketler arasından değerlendirmeye alınan 210 adetinin SPSS 20.0 programı aracılığıyla istatistiksel analizleri yapılmıştır. Analizler sonucunda, psikolojik sözleşme ve alt boyutu olan ilişkisel psikolojik sözleşme ile örgütsel güven ve alt boyutları arasında pozitif yönlü anlamlı ilişkiler olduğu tespit edilirken, işlemsel psikolojik sözleşme alt boyutu ile örgütsel güven alt boyutları arasında anlamlı bir ilişki olmadığı görülmüştür."
