abstract: "Bankacılık sisteminin temeli faiz üzerine kurulmuştur. Bu durum bazı kişilerin bankacılık uygulamalarına katılmasına engel olmaktadır. Özellikle İslam inancına göre faiz üzerinden kazanç sağlanması yasaktır. Bu noktada oluşan açığın kapatılması için arayışlara girilmiş ve faizsiz bankacılık adı altında İslami Bankalar kurulmuştur. İslami bankaların işleyiş şekline göre müşteriler kâr ve zarara ortak olmaktadır. Bu sayede İslami finans sistemi ile faiz hassasiyeti olan kişiler tasarruflarını piyasaya sürmektedir. Türkiye'de İslami finans ilk olarak özel finans kuruluşları adı altında faaliyete geçmiş sonrasında katılım bankaları olarak devam etmiştir. Bu araştırmada bankacılık sistemi bir bütün olarak ele alınmış, mevduat bankaları ve katılım bankalarının kavramsal çerçevesinin çizilmesinin ardından, bir yazın araştırması yapılmıştır. Ayrıca katılım bankalarının Türkiye'de ve dünyada tarihsel gelişim süreçleri incelenmiştir. Özellikle dünyadaki önemli İslami bankacılık uygulamaları ve ülkemiz özelinde katılım bankalarının seyri üzerinde durulmuştur. Çalışma kamu katılım bankalarının sektöre etkilerini ve performanslarını temel aldığından, finans teorisinde ve spesifik olarak bankaların finansal analizinde yaygın olarak kullanılan CAMEL yöntemine dayalı performans analizleri yapılmıştır. Türkiye'de faaliyet gösteren kamu ve özel katılım bankalarının sektör payı, şube ve personel verilerinin incelenmesinin ardından, sermaye yeterlilikleri, aktif kalitesi, yönetim kalitesi, karlılık oranları ve likidite oranları karşılaştırmalı olarak analiz edilmiştir. Araştırmanın kapsamında yer alan kamu ve özel katılım bankalarının 2017 ve 2022 dönemi verileri TKBB, BDDK ve araştırmaya dâhil olan bankaların internet sitesinde yayınlanan yıllık finansal raporlarından derlenmiştir. Araştırmanın sonucunda, incelenen dönemde özel sermayeli ve kamu sermayeli katılım bankalarının performansları genel olarak pozitif bir eğilim sergilemiştir. Kamu katılım bankalarının sektöre dâhil olmasının sektörün gelişimini hızlandırdığı gözlemlenmiştir. Fakat likit aktifler gibi bazı alanlarda kamu katılım bankalarının performansları yetersiz görülmüştür. Bu durumun kamu tarafından desteklenerek kurulan katılım bankalarının yönetimindeki risk algısının özel bankalara kıyasla daha dar olmasından ileri geldiği sonucuna varılmıştır. Bankacılık sektöründe kamu katılım bankaları faaliyete geç başlamış olsa da hızlı bir şekilde geliştiği söylenebilir. Ayrıca teknolojinin gelişmesi ve yeni ürünlerin ve hizmetlerin ürün yelpazesine eklenmesi ile sektörün işlevselliğinin artması söz konusudur."
