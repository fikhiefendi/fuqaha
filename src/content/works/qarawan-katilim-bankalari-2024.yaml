abstract: "Bu çalışma, 2004-2020 yılları arasında Yemen bankalarından seçilen bir örneklem üzerinde gerçekleştirilen bir araştırmayla geleneksel ve katılım bankalarındaki likidite riskinin kârlılık üzerindeki etkisini belirlemeyi amaçlamaktadır. Çoğu bankanın temel hedefi kâr elde etmektir. Ancak, bu hedef, bankaların kâr elde etme, müşteri taleplerini karşılama ve yatırımlarını etkilemeden nakit ihtiyaçlarını karşılama arasında bir denge kurmalarını gerektiren likidite riski gibi çeşitli risklerle karşı karşıya olmalarını içerir. Bu nedenle, likidite, pek çok banka için büyük önem taşımaktadır. Çalışmamızda, bankacılığın teorik yönünü, farklı banka türlerini ve bu bankaların temel işlevlerini bilimsel kaynaklarla destekleyerek ele alındı. Ayrıca likidite riskinin çeşitlerini ve bu risklerin önemini detaylı bir şekilde incelendi. Bilimsel yöntemlerle, çalışmamızda tanımlayıcı ve analitik bir yaklaşımı benimsedik ve analizlerimiz için EVIEWS12 istatistik programını kullanıldı. Araştırmamız, Yemen'deki geleneksel ve katılım bankalarındaki likidite riskinin kârlılığa etkisini araştırmayı amaçlamaktadır. Çalışmamızda, National Bank of Yemen ve Tadhamon Bank olmak üzere iki bankayı ele aldık. Betimsel analizlerimizde, özkaynak kârlılık oranları (ROE) ve aktif kârlılık oranları (ROA) gibi bağımlı değişkenler ile likit varlıkların toplam varlıklara oranı (D1), toplam kredilerin toplam mevduata oranı (D2), toplam mevduatın toplam aktiflere oranı (D3) ve merkez bankası nakitlerinin toplam mevduat ve kısa vadeli dış kaynaklara oranı (D4) gibi bağımsız değişkenler arasındaki ilişkileri incelendi. Likidite riskinin kârlılığa etkisini ölçmek için regresyon analizi testleri gerçekleştirdik ve sonuçları EVIEWS12 istatistik programı kullanarak analiz edildi. Çalışmanın sonuçları, National Bank of Yemen'de likidite riskinin kârlılığı pozitif yönde etkilediğini göstermiştir. Likidite göstergesi hem özkaynak kârlılığı getirisini hem de toplam aktif kârlılığı getirisini artırmaktadır. Diğer bağımsız değişkenler ise kârlılığı negatif yönde etkilemektedir. Tadhamon Bank için ise, likidite riskinin kârlılığı pozitif yönde etkilediğini gösteren bulgular elde edilmiştir. Likidite göstergesi, özkaynak kârlılığı getirisini ve toplam aktif kârlılığı getirisini artırmaktadır. Ancak, diğer bağımsız değişkenler arasında kârlılığı etkileyen bir ilişki bulunmamaktadır."
