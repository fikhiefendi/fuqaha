abstract: "Bütün evrensel dinlerde olduğu gibi İslam dininde de mezhepler var olmuştur. Bunlar içinde Şafiî mezhebi, İslam dininin önde gelen fıkhî mezheplerinden biri olup, İmam Şafiî olarak bilinen Ebû Abdillâh Muhammed b. İdris tarafından kurulmuştur. Hicrî 150 yılında doğan İmam Şafiî, Malikî ve Hanefi Mezhebini mezc eden bir görüş ileri sürerek Şafii Mezhebinin ilk temelini atmıştır. Daha sonra hicrî 199 yılında Mısır'a giden Şafiî, eski görüşlerinden vazgeçerek yeni bir oluşum içine girmiştir. Kaynak eserlerde“Mezheb-i Cedid”olarak geçen bu oluşum, Şafiî ve Mısır'daki talebelerinin özverili çalışmaları neticesinde dört yıl gibi kısa bir sürede oluşum evresini tamamlamıştır. Şafiî'nin Mısır'daki talebeleri arasında bulunan Müzenî'nin çalışması ayrı bir öneme haizdir. Biz de bu çalışmamızda“Şafii mezhebinin gelişiminde Müzenî'nin rolünü”beyan etmeye çalışacağız. Bu çalışmamız giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde çalışmamızın konusu, önemi ve yöntemi gibi teknik bilgilere yer verilmiştir. Birinci bölümde fıkhın Müzenî'ye kadarki gelişim süreci hakkında bilgi sunulmuştur. İkinci bölümde Müzenî'nin hayatı ve ilmî şahsiyeti hakkında bilgi verilmiştir. Üçüncü bölümde Müzenî'nin Şafii mezhebinin gelişimindeki katkıları beyan edilmiştir. Sonuç bölümünde ise konu hakkında genel bir değerlendirme yapılmıştır."
