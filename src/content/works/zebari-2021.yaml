abstract: "Zimmilerin hak ve sorumlulukları konusu fıkıh biginleri için büyük önem taşımaktadır. Bu tezin amacı zimmilere ait hükümleri İslamî kaynaklar çerçevesinde ve uygulamalar ışığında açıklamaktır. İslam hükümlerinin uygulandığı yere dâru'l-İslâm/İslam ülkesi, İslam hükümlerinin uygulanmadığı yere ise dâru'l-harb/harb ülkesi denir. Gayri müslimler kendilerine uygulanacak hükümler itibariyle şöyle gruplandırılabilir: Muhârıb, mus'tad'af, ehl-i zimme, müste'men, muâhid. İslam ülkesinde Müslümanlardan başka müste'men, muâhid ve zimmiler yaşamaktadır. İslam hükümlerinin uygulandığı İslam ülkesinde yaşayan gayri müslim kişilerin hak ve sorumlulukları vardır. Ehl-i zimme/zimmî denince İslâm ülkesine yerleşip orada yaşayan Hristiyan, Yahudi gibi ehl-i kitap sahipleri kasdedilir. İslam ülkesinde bu kişilerin can, mal ve namus güvenliği sağlanmış ve bunlara ibadet ve inanç hürriyeti verilmiş, miras ve evlilik ile ilgili kanunlarını uygulama hakkı tanınmıştır. Mesela onların faizli muamele ve haram sayılan şeylerin ticaretini yapma hakları bulunmamaktadır. Yine ehl-i zimmeye kamu hizmetlerinden yararlanma, helal olan malların ticaretini yapma , haksızlığa uğradığında dava açma ve sosyal adalet çerçevesinde mali haklardan yararlanma gibi pek çok hak tanınmıştır. Zimmilere adaletle muamele edildiğine ve bu hakların tanındığına dair tarih tanıktır. Ehl-i zimmilere tanınan bu haklar karşılığında onlara bazı yükümlülükler de yüklenmiştir. Mesela esasları fıkıh kitaplarında belirlenmiş cizye vergisi, gümrük vergisi ve haraç vergisi gibi. Yine zimmiler İslam'ın kutsallarına saygı göstermek mecburiyetindedirler. Müslümanlık kılıç gücüyle yayılmamıştır. İnsanlar baskı altında olmadan hür iradeleriyle islamiyeti kabul etmişlerdir."
