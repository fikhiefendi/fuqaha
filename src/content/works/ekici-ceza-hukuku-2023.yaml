abstract: "Abdülaziz Han'ın vefatından, sonra cinayet şüphelilerinin yargılamasına, halefi II. Abdülhamit Han döneminde başlanmış olup, yapılan bu yargılama tarihi belgelere Yıldız Yargılaması olarak geçmiştir. Yapılan yargılama, Tanzimat'tan sonra kurulan, mahkemece yapılmış olup, yargılamanın ne derece adil ve tarafsız olduğu günümüze dek tartışılagelmiştir. Yargılamaya, ceza yargılamasına hakim ilkeler ışığından bakılarak yeni bir değerlendirme yapılmaya çalışılacaktır. Ceza yargılamaları ilkeleri her ne kadar o dönem net olarak belirtilmemişse de, hukuk yargılamasında temel metin olan Mecellede ve diğer kanuni metinlerdeki hukuk yargılamasına esas alınan ilkeler baz alınacak ayrıca günümüzdeki ceza yargılaması ilkeleri ile mukayese edilmeye çalışılacaktır. Ayrıca dönem siyaseti ve ekonomisi ele alınarak, dönemin yargı anlayışı tartışılacaktır."
