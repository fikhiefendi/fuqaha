abstract: "Tarihi araştırmalarda gerçeklere ulaşma açısından oldukça önemli bilgiler içeren Şer'iyye Sicilleri, Osmanlı tarihinin önemli arşiv kaynaklarından biridir. Yüksek Lisans Tezinde 2124 numaralı Safranbolu Şer'iyye Sicili (Mikrofilm No; 8332) çalışılmıştır. Giriş bölümünde Safranbolu'nun kısa bir tarihçesi, idari yapısı, nüfusu hakkında bilgilerin yanında, şer'iyye mahkemeleri ve şer'iyye sicilleri hakkında da açıklamalara yer verilmiştir. Belgelerin içerikleri özet olarak verilmiştir. Transkripsiyon basit şekilde yapılarak, çalışmalar tablolaştırılmıştır."
