abstract: "Fıkıh usûlüne dâir günümüze ulaşan en eski eser İmam Şâfiî'nin er-Risâle adlı eseridir. Mütekellimûn metoduna göre yazılmış bu eserden sonra Hanefî usûlcüler de Fukahâ Metodu veya Hanefî Metodu diye bilinen fıkıh usulü sistemini geliştirmişlerdir. Fukahâ metoduna göre yazılmış eserlerden birisi de Ebû Zeyd ed-Debûsî'nin Takvîmü'l-edille adlı eseridir. Debûsî eserini yazarken özellikle İmam Şâfiî ile olan ihtilaflara değinmekte ve bir bakıma Hanefî metodunun Şâfiî metodundan daha tutarlı olduğunu ispat etmeye çalışmaktadır. Debûsî'den sonra gelen bazı Şâfiî usûlcüler özellikle Hanefîlerle kendileri arasındaki ihtilafları, Debûsî'nin görüşlerine atıfta bulunarak incelemişlerdir. Hanefîlerle ilgili ihtilaflara Debûsî üzerinden değinen Şâfiî usûlcülerden biri de Ebû'l-Muzaffer es-Sem'ânî'dir. Eski bir Hanefî fakihi olan Sem'ânî, Kavâtı'u'l-edille adlı eserinde Hanefîlerle ilgili ihtilaflara yer verirken genelde Debûsî'ye atıfta bulunmaktadır. Bu çalışma, Hanefî usulünün önemli temsilcilerinden Debûsî'nin Takvîmü'l-edille isimli eseri ile Şâfiî usulünün temsilcilerinden Sem'ânî'nin Kavâtı'u'l-edille isimli eserini mukayeseli bir şekilde incelemek ve bu iki müellifin görüşlerinin her iki mezhep usulü açısından ne şekilde karşılandığını tespit etmek için yapılmıştır."
