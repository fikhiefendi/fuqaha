title: "Ebu'l-Muzaffer es-Sem‘ânî’nin \"el-Kavâtıu'l-Edillesi’nde Ebû Zeyd ed-Debûsî’ye Yönelttiği Tenkitlerin Fıkıh Usulü Açısından Tahlili"
