abstract: "Bu tezde İmam Ebu't-Tayyib es-Sindî'nin Kurratü'l-Enzâr Alâ Şerhî Tenvîri'l-Eebsâr adlı eserinin tahkiki yapılmıştır. Araştırma velâ bahsinin başından kısmet bahsinin sonuna kadar olan bölümle sınırlandırılmıştır. Araştırmanın önemi şerh edilen eserden kaynaklanmaktadır. Zira eser, Hanefi mezhebinin en önemli kaynaklarından olan Muhammed Abdullah b. Timurtâşî el-Hanefî'nin Tenvîrü'l-ebsâr ve câmiu'l-bihâr isimli eserinin şerhidir. Eserde birçok fıkıh kaidesi yer almakta olup, müellif, başta Muhtasaru Kudûrî, Muhtasaru Tahâvî olmak üzere Hanefi mezhebince muteber birçok kaynakta yer alan görüşleri bir araya getirmiştir. Eser, bu özellikleri sayesinde Hanefi ve diğer mezheplere mensup fakihlerin temel kaynaklarından biri haline gelmiştir. Sindî'nin haşiyesi ise, incelenen konulara dair Hanefi ve diğer mezheplere mensup alimlerin görüşlerine dair faydalı nakiller içermektedir. Hâşiye, müellifin eşsiz tercihleri yanında nakledilen görüşlerden müftâ bih ve ma'mûlun bih olanı ortaya koymasıyla tanınır. Meseleleri güzel bir şekilde sunma, fıkıh konularına uygun olarak eşsiz bir şekilde kısımlara ayırma hususunda temayüz etmiştir. Müellif, Ebû Hanîfe ve diğer Hanefi alimlerin görüşlerini naklederek, uygun olanını tercih etmiş, zaman zaman Şâfiî gibi diğer mezheplerin görüşlerini nakletmiştir. Çalışmada bir kısmı Türkiye'de bir kısmı ise yurtdışında olan üç yazma nüsha esas alınmıştır. Haskefî, Sindî ve Timurtâşî'nin biyografileri, şahsi ve ilimi hayatlarıyla ilgili bilgi verilirken betimleyici tarihsel metot kullanılmıştır. Metin yazılırken ise talik ve tahkik yöntemi tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Kitap mezhebin müftâ bih olan görüşlerini içermektedir. Müellif sadece imam Ebû Hanîfe'nin görüşlerine odaklanmamış, tercih edilen veya kendi tercih ettiği görüşleri esas almıştır. Kendine has bir içtihad yöntemi olan müellif, tercih ettiği görüşleri destekleyen delilleri sunmuştur. Metin sahibi Timurtâşî ve onun şerhi olan Haskefî'nin görüşlerini nakletmekle yetinmemiş, birçok fıkhî konuda onlara muhalefet ederek itiraz etmiştir. Aynı şekilde Sindî de sadece belli imamların görüşlerini nakletmekle yetinmemiş birçok alimin görüşlerini nakletmiş, vakıf menfaatlerinin tazmini, yetim malı, zorla madenden istifade konularında olduğu gibi müteahhir alimlerin görüşlerini tercih etmiştir. Sindî'nin seçim ve doğru tercihlerinde fıkhi mahareti net şekilde görülmektedir. Kaynaklar konusuna gelince, Hanefi mezhebinin temel kitapları yanında çeşitli kaynaklardan nakiller yapmıştır. Nakil yapılan eserler arasında el-Hidâye, Mülteka'l-ebhur, Tebyînü'l-hakâik, Aynî Şerhi, el-Fetâva'l-Velvâliciyye ve daha niceleri yer almaktadır. Henüz baskısı yapılmamış İbn Şahne'nin Tafsîlu Akdi'l-Ferâid, Hayreddîn er-Ramlî'nin Hâşiye alâ menehi'l-Gaffâr, Hüseynî'nin Kitâbu keşfi'-remz, Sicistânî'nin Kitâbu Münyetü'l-Müftî isimli eserlerden de bolca nakiller yapılmıştır. Sindî Kur'ân ayetleri ve hadislerden bolca istidlâlde bulunmamıştır. İstidlâl ettiği hadislerin sayısı dörttür. Lügat kitaplarına sadece iki defa atıf yapmıştır. Sonuçta bu kitap, Hanefi alimlerinin tercih edilen görüşlerini ihtiva eden fıkıh ansiklopedisi mesabesinde olup, kendisinden sonra gelen bütün Hanefiler Allâme es-Sindi'nin eserine itimat etmiştir."
