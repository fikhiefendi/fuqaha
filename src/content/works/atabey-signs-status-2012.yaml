abstract: "Bu çalışma, 16 ila 18. yüzyıllar arası döneme ait Osmanlı şeyhülislam fetvalarında yer alan statü göstergelerini saptamaya çalışmaktadır. Bu çalışmada sorunsallaştırılan temel mesele, Osmanlı bireylerinin ahlaki ve sosyoekonomik statülerine göre farklılaşan hukuki statüleridir. Çalışma boyunca, bu yöndeki bağlantıyı göstermek amacıyla meslek, soy, dindarlık, bilgi ve ekonomik statü gibi bir çok farklı statü göstergesi ele alınmaktadır. Bu bağlamda, mevcut çalışma, gündemine iki genel ve bağlantılı soruyu almaktadır: Sosyoekonomik statü, bireylerin hukuki statüsünün belirlenmesinde nasıl ve ne dereceye kadar rol oynamıştır? Sosyoekonomik statü ile hukuki statü arasındaki bu ilişki hangi noktalarda sosyal düzenin korunmasına yönelik kaygılarla kesişmektedir? Bu çalışmanın temelini oluşturan birincil kaynaklar şunlardır: Fetava-yı Ali Efendi, Fetava-yı Feyziye me'an-nukul, Fetava-yı Abdurrahim, Behçetü'l-fetava ve Neticetü'l-fetava me'an-nukul. Ayrıca, 16. yüzyıl şeyhülislamları Zenbilli Ali Efendi ve Ebussuud Efendi'ye ait bir grup fetvaya da başvurulmaktadır."
