abstract: "Mâlikî usûlünde yer verilen önemli delillerden biri istishâb delilidir. Kur'an, sünnet ve icma' asıllarından sonra dördüncü asıl olarak ele alınmasıyla birlikte fetvada başvurulacak son kaynak olarak değerlendirilmesi istishâb hakkında fikir birliğini sağlamayı zorlaştırmıştır. Bu bağlamda tezimizde istishâbın Mâlikî usulüne katkısı ve deliller hiyerarşisindeki yeri tespit edilmeye çalışılmıştır. İstishâb delili, Mâlikî literatüründe dönem dönem farklı çeşitleriyle gündeme gelmiştir. Aklî istishâb olarak niteleyebileceğimiz berâet-i asliyye istishâbının onaylandığını söyleyebiliriz. Bir istishâb çeşidi olarak ele alınan ibâha-i asliyyenin ise Mâlikî fukaha tarafından bir prensip olarak kullanıldığını fakat istishâb çeşidi olarak gündeme getirilmediğini ifade edebiliriz. Şer'î istishâb türleri olarak niteleyebileceğimiz şer'î hüküm istishâbı ve icma' istishâbında ise muhtelif görüşler bulunmaktadır. Mâlikîler özelinde istishâb delilinin topyekûn bir reddinin söz konusu olmadığı tespit edilmiştir. Bununla birlikte ortaya çıkan ihtilafların sebebinin ayrıntılı meselelerde olduğu görülmüştür. İstishâbın ibâha prensibinin işletilmesi, Mâlikî usûl düşüncesinin sistematikleşmesine katkı sağladığı söylenebilir Bu katkı sayesinde ictihadda gelişigüzelliğin önüne geçilirken muamelat alanına esneklik ve pratiklik kazandırılmıştır. İstishâbın işlevselliği Mâlikîlerin ibâhanın kapsamını geniş tutmaları ve usûl düşüncelerinin büyük ölçüde maslahata dayanması alanlarında da kendisini göstermiştir. İstishâbın fer'î meselelere etkisini de incelediğimiz bu çalışmada usûldeki ihtilafların bazı durumlarda sadece lafzî ihtilaflar olduğu ve pratikte bir netice vermediği görülmüştür. Diğer bazı durumlarda ise bu ihtilaflar, farklı hükümlerle sonuçlanmıştır. Mâlikî hukukçuların fer'î meselelerde istishâb delilini işletirken, diğer mezheplerden farklı sonuçlara ulaşmasına etki eden önemli ilkelerden birisinin ihtiyat ilkesi olduğu gözlemlenmiştir."
