abstract: "Uygur Türklerinin birçok siyasi olay ve krizlere rağmen İslami kimliklerini korumalarının nedenleri incelediğinde Hanefi mezhebini benimsedikleri görülmektedir. Doğu Türkistan farklı kültür ve diğer dinlerin çatışmasının yanı sıra Moğolların ve ardından Mançu-Çin'inin işgali gibi bir dizi sorun ve çatışma, ezici savaş ve değişik sömürgecilik sorunlarıyla karşı karşıya kaldığı yerdir. Son olarak 1949'dan bu yana komünist Çin'in işgali altında bulunmaktadır. Söz konusu siyasi baskı ve işgallere rağmen Uygur Türklerinin büyük çoğunluğu erime ve asimile olmadan İslami kimliklerini büyük ölçüde korumuş ve sosyal hayatlarında etkinliğini yansıtmaştır. Ancak işgal altındaki bazı toplumların baskıcı güçlerin eritme ve asimile etme politikalarına dayanamadığı bilinir. Bu noktadan hareketle çalışmada, Uygur Türklerinin islami bilinci ve islami kimliğini muhaza etmede Hanefi mezhebinin oynadığı önemli rollleri ele alınacaktır. Ardından Doğu Türkistan'da yetişen ulemalerin“Şer'i hükümlerde”ve“içtihat”meselelerinde Hanefi mezhebinin usullerine ve islamda kolaylaştırma ve asayiş sağlama ilkelerine dayanarak, hikmet sahibi Allah'ın Şeriatı tesis etmedeki maksadı ve ruhuna uygun olarak ne kadar derin ve kapsamlı çalışmalar yürüttüğünden bahsetmeye çalışacaktır. Bu çalışmaların çekişmelerin yoğunlaştığı, felaketlerin arttığı ve toplumsal sorunları çözmenin zor olduğu dönemlerde daha da belirginleştiği görülmektedir."
