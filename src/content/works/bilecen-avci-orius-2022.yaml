abstract: "Tetranychus urticae, örtüaltı sebze yetiştiriciliğinde polifag bir zararlı olup akarisitlere karşı ciddi direnç göstermektedir. Son yıllarda, gıda maddelerindeki ilaç kalıntıları, insan ve hayvan sağlığındaki olumsuzluklar, çevrenin kirlenmesi ve yüksek pestisit ücretleri sebebi ile daha ekonomik ve sürdürülebilir olan biyolojik mücadele tercih edilmeye başlanmıştır. Biyolojik mücadele kapsamında doğal düşmanların zararlı üzerindeki biyolojik özellikleri ve işlevsel tepkisi büyük önem taşımaktadır. Bu çalışmada, avcı böcek Orius vicinus'un, T. urticae'nin farklı dönemlerine karşı işlevsel tepkisi 2, 4, 8, 16, 32, 64 ve 128 av yoğunluklarında araştırılmış, ergin T. urticae ile beslendiğinde yumurta ve nimf gelişme süreleri, nimf canlılık oranları, üreme kapasiteleri ve ergin yaşam süreleri ayrı ayrı belirlenmiştir. Denemeler sonucunda O. vicinus'un yumurta açılma süresi 4.07 gün ve toplam nimf gelişme süresi 13.5 gün olarak belirlenmiştir. Nimf canlılık oranı %75.7 olarak belirlenmiştir. Dişi başına bırakılan ortalama yumurta sayısı 31.28 adet olup dişi bireylerin yaşam uzunluğu ortalama 15.3 gün, erkek bireylerin ortalama yaşam uzunluğu ise 12.50 gün olarak saptanmıştır. Yaşam çizelgesi parametrelerine göre, preovipozisyon süresi (APOP) 4.39 gün, toplam preovipozisyon süresi (TPOP) 21.85 gün, ovipozisyon süresi 7.2 gün olarak belirlenmiştir. Kalıtsal üreme yeteneği (r) 0.095 gün-1, artış oranı sınırı () 1.1 gün-1, net üreme gücü (R0) 12.04 yumurta/döl ve ortalama döl süresi (T) 26 gün olarak tespit edilmiştir. İşlevsel tepki denemeleri sonucunda T. urticae yumurtasına karşı O. vicinus'un işlevsel tepkisi tip III olarak belirlenirken, T. urticae'nin diğer dönemlerine O. vicinus'un tip II işlevsel tepki gösterdiği gözlemlenmiştir. İşlevsel tepki sonuçlarına göre T. urticae'nin tüm dönemlerine karşı O. vicinus'un etkili olduğu gözlemlenmiştir. Yaşam çizelgesi parametreleri sonuçlarına göre, T. urticae'ye karşı O. vicinus'un etkinliğinin orta düzeyde olduğu düşünülmektedir. Çalışmada elde edilen sonuçlara göre, O. vicinus'un T. urticae üzerinde yaşam döngüsünü tamamladığı ve popülasyonunu devam ettirebildiği gözlemlenmiş ve T. urticae'nin biyolojik mücadelesinde etkili bir biyolojik mücadele ajanı olabileceği kanaatine varılmıştır."
