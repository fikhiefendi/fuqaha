title: "AVCI Orius Vicinus (Ribaut) (Hemiptera: Anthocoridae)'un Tetranychus Urticae Koch (Acarina: Tetranychidae) Üzerindeki Biyolojisi ve Fonksiyonel Tepkisi"
titleTranslation: {"en": "Biology and functional response of Predator orius Vicinus (Ribaut) (Hemiptera: Anthocoridae) on Tetranychus urticae Koch (Acarina:Tetranychidae)"}
authors: ["Bilecen, Kübra"]
