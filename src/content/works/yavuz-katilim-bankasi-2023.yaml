abstract: "Bu araştırma, beyaz yakalı iş görenlerin çalıştıkları kurumların marka denkliği ve unsurlarını, iç müşteri açısından demografik yapılarına göre nasıl algıladıkları belirlemeyi amaçlamaktadır. Araştırmanın ana kütlesini, İstanbul'daki Kuveyt Türk Katılım Bankası'nda çalışanlardan oluşturmaktadır. Veri toplanma sürecinde kolayda örnekleme metodu kullanılmış ve 410 katılımcıya ulaşılmıştır. Veri toplama aracı olarak çevrimiçi anket formu kullanılmış, analizler ise SPSS ve AMOS istatistik paket programlarıyla gerçekleştirilmiştir. Araştırma sonuçlarına göre; erkek iş görenlerin marka bağlılığı ve algılanan kalite düzeyleri, kadın iş görenlere göre daha yüksek bulunmuştur. Şube çalışanları, diğer birim çalışanlarına kıyasla marka bağlılığı, marka çağrışımı, algılanan kalite ve marka farkındalığı algı düzeyleri daha yüksek bulunmuştur. Hibrit çalışanların, yüz yüze çalışanlara göre marka bağlılığı, marka çağrışımı, algılanan kalite ve marka farkındalığı algıları daha yüksektir. İş tecrübesi 16 yıl ve üzeri olan iş görenlerin algılanan kalite düzeyleri, 1-5 yıl arası iş tecrübesi olan iş görenlere göre daha yüksek bulunmuştur. Medeni durum, yaş, eğitim durumu ve gelir düzeyine göre ise marka denkliği boyutlarında herhangi bir farklılık belirlenmemiştir."
