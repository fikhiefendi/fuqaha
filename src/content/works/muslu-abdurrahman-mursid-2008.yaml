abstract: "Tahkikini yapmış olduğumuz el fethul kudsi fi tefsiri ayetil kürsi adlı eserin müellifi el-mürşidinin tam adı Abdurrahman bin isa bin mürşid el-ömeri dir. Daha çok dedesi mürşide nisbetle el-mürşidi diye bilinir.El-mürşidi 975 yılında Mekke de doğmuştur. Aile bakımından ilim ile meşgul bir aileye mensup el-mürşidi kendisini çok yönlü yetiştirmiş, zamanın önde gelen fakih ve âlimlerinden ders almış yetiştikten sonrada kıymetli eserler ortaya koymuştur.El-mürşidi almış olduğu iyi eğitime karşılık önemli vazifelerde bulunmuştur. Mekke müftülüğü, Mekke kadılığı, mescidi haram imam-hatipliği, Muhammed paşa ve Süleymaniye medresesi müderrisliği ve divanı inşa üyeliği başta olmak üzere birçok önemli görev kendisine verilen el-mürşidi Hanefi mezhebine mensuptur. .El-mürşidi 1037 yılında zamanın Mekke şerifi Ahmed bin Abdülmuttalib in emri ile boğularak öldürülmüştür. Tam olarak öldürülme sebebi belli değildir. Kabri Mekke dedir.Tahkikini yapmış olduğumuz eserin bütün araştırmamıza rağmen Süleymaniye Kütüphanesi Ayasofya bölümü numara 418 de kayıtlı nüshasından başka bir nüshasına rastlayamadık ve ikinci bir nüshanın olmadığı kanaatine vardık.Araştırmamız üç bölümden oluşmaktadır.Birinci bölümde el-mürşidinin kimliğinin tesbiti, doğumu ve ailesi, tahsil hayatı, üstlenmiş olduğu vazifeleri, vefatı, ilmi şahsiyeti, hocaları ve eserlerini zikrettik.İkinci bölümde tefsir ilmi hakkında kısa bir açıklama, ayet tefsirleri, ayetül-kürsinin tanıtımı konularını inceledik.Üçüncü bölümde el-mürşidinin tefsirini ele aldık. Müellifin etkilendiği tefsir kaynakları, ayetül-kürsinin rivayet ve dirayet tefsiri yönünden özellikleri ve kısaca metodu hakkında misaller vererek karşılaştırmalar yaptık.Dördüncü bölümde ise el-mürşidinin tefsirinin tahkiki yer almaktadır."
