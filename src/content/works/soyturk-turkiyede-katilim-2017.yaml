abstract: "Yapmış olduğumuz bu çalışmada, Türkiye'de Katılım Bankacılığı ve çalışma yöntemleri ile konut açığının kapatılmasında, Katılım Bankacılığının katkısı ve çalışma modelleri değerlendirilmiştir. Deprem gerçeği nedeniyle kentsel dönüşüme ağırlık verilen ve yoğun nüfus, göç hareketleri ile konut sorunu yaşanan ülkemizde, yeni modern yaşam alanlarının inşaasında finansman ciddi bir problemdir. Bizde finansal bir çözüm yöntemi olarak konuyu ele aldık. Çalışmamızda Katılım Bankalarının güncel uygulanmaları ve sahada yaşanan sıkıntıları değerlendirdik. Bu sahanın çok yeni olması nedeni ile yüksek büyüme potansiyelinin olduğu gözlemlenmiştir. Çalışmamız sonucunda bu modeller ile, her kesime yönelik güvenli konut edinilebileceğini kanısına vardık. Ayrıca bu alandaki çalışmalara kamusal ve yeni mevzuat desteklerin gerektiği, Blokeli Modellerin tüm tarafların koruyan bir yapı olduğu sonucu saptandı."
