abstract: "Küçük ve orta ölçekli işletmeler (KOBİ'ler) küresel ekonomik genişlemeyi ve istihdam fırsatlarının büyümesini olumlu yönde etkilemiştir. bunun sayesinde politika yapıcılar ve akademik araştırmacılar tarafından büyük ilgi görmüştür. Aynı zamanda finansal danışmanlık hizmetleri KOBİ'lerin büyümesine katkıda bulunmuştur ve finansal krizlerden sağ çıkmak için destek sağlamıştır. Suudi Arabistan'da finansal danışmanlık hizmetleri köklü ve istikrarlı bir sektördür. Ancak, bu alanı Krallık içinde bir araştırma konusu olarak ele alan literatür sınırlıdır. Bu çalışma, Suudi Arabistan'daki KOBİ'lerin performansını iyileştirmede finansal danışmanlık hizmetlerinin temel rolünü vurgulamaktadır. Çalışma, Suudi Arabistan'daki KOBİ'lerin finansal danışmanlık yapanları hedefleyen bir anket aracılığıyla toplanan birincil verileri analiz ederek nitel bir yöntem izlemiştir. Araştırma birkaç önemli bulgu ortaya koymuştur. Krallık'taki KOBİ'lerin neredeyse yarısının Riyad'da bulunduğu, finansal danışmanlık hizmetlerine en çok talep edilen sektörlerin ise hizmetler ve finans sektörleri olduğu bulunmuştur. Çalışma ayrıca, işletmelerin genellikle başlangıç ve düşüş aşamalarında tavsiye aradığını göstermiştir. İş geliştirme ve genişletme danışmanlık hizmetleri sektörde en çok talep gören hizmetler olarak ortaya çıkmıştır. Çalışma ayrıca COVID19 krizinin işin ortamı üzerindeki etkisinin dolayı, uzaktan çalışma bu sektördeki en belirgin değişikliklerden biri haline gelmiştir. Son olarak, çalışma finansal danışmanların iş ortamındaki devam eden değişikliklere ayak uydurabilmek için risk değerlendirme becerilerine sahip olmasının önemini vurgulamıştır."
