abstract: "ÖZETÇalışmamız 216 numaralı Urfa şer'iyye sicilinin hukuksal analizidir. Şer'iyye sicilleriOsmanlı mahkemelerine gelen davaların mahkemelerde tutulmuş olan kayıtlarıdır. Bunlarhem tarihsel, hem hukuksal, hem de sosyolojik olarak önem arzetmekte, o döneme ışktutmaktadır. Çalışmamızda sicil içerisinde yer alan dava çeşitlerinin analizine tek tek yerverilmiştir. Dava çeşidi olarak defterde vekâlet, vasi tayini, nikâh, mehir, talak, miras, nafakave alışverişe dair kayıtlar bulunmaktadır. ncelemiş olduğumuz dönemin, Tanzimat dönemiolması dolayısıyla şer'iyye mahkemelerine gelen dava çeşitleri belli konularla sınırlıdır.Tanzimat döneminde yeni mahkemeler kurulmuş, bunların görev alanları belirlenmiştir. Bunagöre şer'iyye mahkemelerinin yetki alanları kısıtlanmış, yeni kurulmuş olan laik karakterliNizamiye mahkemeleri, şer'iyye mahkemelerinin bir kısım yetkilerini devr almıştır. Osmanlıadalet sistemi içerisinde yer alan mahkemelerde bu adalet tevzii görevini yerine getirengörevliler de vardır. Bunların ilki ve en önemlisi davaları gören ve hükme bağlayan hâkimdir.Hâkim dışında muhzır, mübaşir, katip gibi görevliler de mahkemede görev yapmaktadır."
