abstract: "Neslin devam etmesi için kurulan aile müessesesi toplumda saygın bir kurum olmakla birlikte özünde olan sorumluluk gereği bir takım tedbirleri zorunlu kılmıştır. Makro ve mikro ölçekte toplum düzenine göre değişkenlik arz eden tedbirler tarım toplumunda nüfus yoğunluğunun azlığı ve beşerî ilişkilerin de düzenli olmasına bağlı olarak kanûnî tedbirlerden çok şâhitlik müessesesini öne çıkarmıştır. Asr-ı saadetteki sosyal yapının da bu minvalde olması evliliklerin ispatının şâhitlik ve ilan ile sağlanacağı kanaatini oluşturmuştur. Sonraki dönemlerde artan fetihlerin de etkisiyle oluşan karma toplumda evliliklerin tescili gibi bir ihtiyaç gündeme gelmiştir. Benzer şekilde sanayi toplumunda da oluşan karma yapının etkisi ispat bağlamında devletleri birtakım kanûnî düzenlemelere sevk etmiştir. Maslahat gereği uygulanan bu tedbirlerle evlilikler tescilli ve tescilsiz olarak sınıflanmış ispat bağlamında da tescilsiz evliliklerin hukuki durumu araştırmaya konu olmuştur. Evlilik gibi çeşitli sebeplerle aile birliğine son vermek de insanlık tarihi kadar eskidir. İşleyiş sistematiğine göre tek taraflı irade beyanıyla boşamayı kabul eden İslam hukuku irade beyanın yanı sıra evlilik birliğini sonlandıran muhâlea. süt akrabalığı ve hürmet-i müsâhere gibi durumların oluşmasını da boşama sebeplerinden kabul etmiş ve bu gibi durumların iddia edilmesi halinde ispat yükümlülüğünü getirmiştir. Evlilik bağıyla taraflara yüklenen hak ve sorumlulukların yanında süt ile oluşan akrabalık da ispatın alanıdır. Zira kişinin nesebinin sahih olması lehine mâli hakları oluşturduğu gibi süt emmeyle de evlilik engeli oluşturur. Buna göre ispatın getirilmesiyle kişinin mali hakları korunurken aynı zamanda meşru' olmayan evlilikler de engellenmiş olur."
