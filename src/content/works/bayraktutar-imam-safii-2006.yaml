abstract: "Bu çalışma, mam Şâfiû'nin hadisleri/sünneti anlama ve yorumlama hususunda,kendisine atfedilen zahirû ve literal/lafza bağlı yaklaşım biçiminin yeri ve mahiyetiniincelemeyi ve bu arada Şâfiû'nin hadûsleri/sünneti anlama ve değerlendirme hususundaortaya koyduğu yaklaşımları tesbit etmeyi amaçlamaktadır. ? mam Şâfiû'de Lafza BağlıHadûs/Sünnet Yorumu? başlığında yapılan bu çalışma, giriş bölümü dışında üçbölümden oluşmaktadır.Kavramsal çerçeveden ibaret olan birinci bölümde, genel olarak anlam veyorumun mahiyeti kapsamında, lafız-anlam ilişkisi, nassların yorumu, lafzû yorum veanlama ve yorumlamada lafza bağlılık problemi üzerinde durulmuştur.mam Şâfiû'nin hadûs/sünnet anlayışında lafza bağlı yorumun yeri vemahiyetinin incelendiği ikinci bölümde, önce Şâfiû'ye kadar ki zaman diliminde genelolarak hadûsleri anlama ve değerlendirmede sergilenen temel yaklaşımlara değinilmiştir.Bu arada, mam Şâfiû'nin hadûs/sünnet anlayışına yer verilmiştir. Şafiû'nin lafza bağlıyaklaşım sergilediğine yönelik görüş ve değerlendirmelere yer verildikten sonra,Şâfiû'nin nassları anlamada zahire bağlılık ilkesi, bizatihi Şafiû'nin kendi eserlerinedayanarak teorik açıdan incelenmeye çalışılmıştır. Yapılan inceleme ve araştırmalarsonucunda, Şafiû'nin nasslara zahirû açıdan yaklaşımı temel ilke edindiği ve zahirdenayrılmanın sınırlarını çizerek kayıt almaya çalıştığı sonucuna varılmıştır. Şâfiû'nin lafzabağlı yaklaşım sergilemesinde, onun nass anlayışının, ilim anlayışının, ictihad ve kıyasanlayışının, istihsana menfû yaklaşımının, dil anlayışının, ta'lûl ve taabbud anlayışınınetkili birer faktör olduğu tespit edilmiştir.Üçüncü bölümde ise pratik açıdan hadûsleri anlama ve değerlendirmedeŞâfiû'nin temel yaklaşımları, lafız eksenli ve mana eksenli yaklaşımlar olarak incelenmiş,sonuçta Şâfiû'de genel olarak lafza bağlı yaklaşımın baskın ve egemen olduğu, bu aradakıyas yoluyla ve herhangi bir delûl ve karûne bulunduğunda nassları te'vil etmeksuretiyle, bazen lafza bağlılıkta ısrarcı davranmayıp, nassların amacını da dikkatealması nedeniyle, katı literalist/zahirû bir yaklaşıma sahip olmadığı sonucuna varılmıştır."
