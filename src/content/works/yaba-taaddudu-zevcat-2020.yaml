abstract: "Bu araştırma, İslam hukuku ve Irak hukuku ışığında çok eşlilik konusunu ele almaktadır. Çalışmamız üç bölümden teşekkül etmiştir: İlk bölüm, İslam hukuku ve Irak hukukunda evlilik konusunu ele alımıştır. Bu bölümde, aynı zamanda evlenmenin meşruiyetinden ve temel ilkelerinden bahsedilmiştir. İkinci bölümde, İslam öncesi dönemde ve İslam'da peygamberlerin ve çok eşliliğin çokluğundan bahsedildiği gibi, ilahi dinlerde çok eşliliğin yanı sıra, özellikle İslam'dan önceki uluslarda çok eşlilik konusu ele alınmıştır. Üçüncü bölüm, çok eşliliğin anlamı, meşruiyeti ve yönetimi ile çok eşliliğin nedenlerinden bahsedilmiştir. Aynı zamanda çok eşliliğin şartları ve genel ilkeleri hakkında bilgi verilmiştir. Son olarak çalışma, Irak Aile Hukuku başta olmak üzere bazı Arap ülkelerinin uygulamasında çok eşlilik konusu incelenmiş önemli gördüğümüz bulgulara ve önerilere yer verilmiştir."
