abstract: "Murâd-ı ilâhîyi ortaya koyma gayretinde olan müfessirler, bunun için sahih ve şâz vecihleriyle kıraatlerden istifade etme yoluna gitmişlerdir. Bu araştırmada, sahih kıraatler yanında birçok şâz kıraatten yararlanarak İrşâdü'l-'akli's-selîm'i kaleme alan Ebussuud Efendi'nin, tefsirindeki kıraat olgusu ortaya konacaktır. Girişten sonra üç bölüm ve sonuç kısmından oluşan çalışmanın birinci bölümünde, Ebussuud'un hayatı ve ilmi kişiliği, kıraat ilminin tarihi serecamı ve müellifin kıraatteki kaynakları ile kıraatleri ifadelendirme biçimi ele alınmıştır. İkinci bölümde ise kıraat-Arap dili ve kıraat-tefsir ilişkisi bağlamında kıraat vecihlerinin sistematik tasnifi yapılmış, konu, Arap lehçeleri ve sarf-nahiv kuralları bağlamında incelenmiştir. Üçüncü bölümde ise sahih kıraat kriterleri çerçevesinde müellifin kıraat tasavvuru ortaya konmaya çalışılmıştır. Ele alınan örneklerin, konuyu her açıdan temsil etmesine özen gösterilmiş, konular, birçok kaynaktan yararlanmak sûretiyle izah edilmeye çalışılmıştır."
