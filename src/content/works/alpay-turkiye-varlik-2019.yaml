abstract: "Ulusal varlık fonları geleneksel kamu emeklilik fonları ve ulusal para biriminin destekleyen oluşumlardan farklı yeni bir varlık yönetim türü olarak ortaya çıkmıştır. UVF'ler genel olarak yurtdışında yatırım yapan kamu himayesinde veya kontrolünde bulunan finansal oluşumlardır. UVF'lerin daha çok faaliyet alanları belirlenirken kuruldukları ülkelerinin konjonktürel ve gelecek bakımından ihtiyaçları doğrultusunda teşekkül ettikleri anlaşılmıştır. Her ne kadar UVF'ler ülkelerin merkez bankaları veya resmi döviz rezervlerinin bir parçası gibi görünse de onları farklı kılan özellikleri mevcuttur. 2016 yılı Ağustos ayında ülkemizin ilk varlık fonu olan Türkiye Varlık Fonu Yönetimi Anonim Şirketi kurulmuştur.“Şirketin ana faaliyet konusu, ilgili mevzuat hükümleri çerçevesinde sermaye piyasalarında araç çeşitliliği ve derinliğine katkı sağlamak, yurtiçinde kamuya ait olan varlıkları ekonomiye kazandırmak, dış kaynak temin etmek, stratejik, büyük ölçekli yatırımlara iştirak etmek amacıyla Türkiye varlık Fonu'nun ve bu fona bağlı alt fonların kurulması ve yönetilmesi”olarak belirlenmiştir. TVF bünyesine devredilen Türkiye' nin önemli varlıkları ile yaklaşık 40 milyar dolarlık bir varlık büyüklüğüne ulaşmıştır. TVF' nin kuruluş gerekçesi olarak birçok amaç belirlenmiştir. Bunlardan en dikkat çekenlerin başında“Katılım finansmanına uygun varlıkların gelişmesine destek olmak”gelmektedir. Bilindiği üzere İslami finansal enstrümanlar sukuk adı altında dünyada uzun zamandır kullanılmasına rağmen ülkemiz için yeni ve geliştirilmesi gereken bir konudur. Sukuk 14 farklı alt türe ayrılmış olup genel olarak en çok kullanılan türleri; Mudaraba, Muşaraka, Murabaha, Salam, İcara, İstisna ve Wakala'dır. Türkiye' de sukuk karşılığı olarak kira sertifikası geliştirilmiş olup 5 türe ayrılmıştır. Bu çalışmada varlık fonları incelenecek olup Türkiye varlık fonunun İslami finansal enstrümanların gelişmesine muhtemel katkıları incelenmiş ve önermeler sunulmuştur."
