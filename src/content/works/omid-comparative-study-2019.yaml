abstract: "Bir finansal sistemin amacı, ister geleneksel isterse İslami olsun, finansal kaynakların mobilizasyonu ve bunların farklı yatırım projeleri arasında paylaştırılmasıdır. Böylece faizsiz bankalar, geleneksel finansmanı vuran vahim krize karşı direnişlerini göstermiştir. Bu genel çalışma, Türkiye'de halen aktif olan her iki bankacılık sisteminin ilkelerini, risklerini ve performanslarını ortaya çıkarmak için yapılmıştır. Bu makale, Faizsiz bankaların özelliklerini, geleneksel bankaların kimlerle karşılaştırarak analiz eder. Ayrıca iki sistem arasındaki farklı ürün türlerini de gösterir. Ayrıca iki sistem arasındaki farklı ürün türlerini de gösterir. Bu araştırmanın amacı, beş bölüm geliştirmemizi sağlamıştır. İlk bölüm bankacılık sistemine genel bakış üzerine odaklanacak. Bu bölüm bazı kavramları tanımlamamızı ve bankaları yöneten ilkeleri gözden geçirmemizi sağlayacaktır. İkinci bölüm faizsiz bankacılık sistemine odaklanacak. Öncelikle Faizsiz bankaların ilkelerini ve bu sistemde karşılaştığımız risk türlerini göreceğiz. Ardından Faizsiz bankacılık finansal ürünlerini sunacağız. Bu tezin üçüncü ve dördüncü bölümleri, Türkiye'deki iki bankacılık sisteminin karşılaştırılmasına odaklanacak. Sonunda, son bölüm her iki bankacılık sisteminin ekonomik ve finansal yönlerinin genel bir analizi ile başlayacak ve daha sonra Türkiye'deki farklı ürünlerin detaylı bir analizi ile bitecektir."
