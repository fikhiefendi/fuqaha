abstract: "Bu tezde hicrî 11. asrın önemli Hanefi fakihlerinden Ahmed Hassûnî'nin Mefâtîhu's-Salât ve Yenâbîu'l-Hayat isimli eserinin tahkik ve analizi yapılmıştır. Müellif, namaz, Tahâret zekât, hacla ilgili birçok konuyu beyan etmiş, Hanefi alimlere ait mefkut veya mahtut eserlerden alınan görüşlerin çoğunun gayelerini açıklamıştır. Araştırma 10. Bölümün 16. kısmı olan birinci oturuşta teşehhüd okuma bölümünden kitabın sonuna kadar olan kısmı kapsamaktadır. Araştırma üç adet yazma nüshaya dayanmıştır. Birinci nüsha İstanbul Atıf Efendi Kütüphanesinde (Nr. 1055); ikincisi Adana Yazma Eserler Kütüphanesinde (Nr. 297541) üçüncüsü ise Süleymaniye Kütüphanesi Ali Paşa Yazma Eserler Bölümündedir (Nr. 460). İmam Hassûnî'nin şahsi ve ilmi hayatı, yaşadığı dönemin özellikleri, önemli olayları ve dönemin önde gelen alimleri incelenirken betimleyici tarihsel metot kullanılmıştır. Metnin yazılması, nüshaların karşılaştırılması, yorum yapmaksızın nüsha farklılıklarının belirtilmesi, ayetlerin sure ve âyet numaralarının verilmesi, hadislerin tahrîc edilmesi, görüşlerin asli kaynaklardaki yerlerinin gösterilmesi ve şiirlerin tahric edilip harekelenmesinde talik-tahkik yöntemi tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: imam Hassûnî Bağdat'ta bir salgının yaşandığı çok zor bir dönemde yaşamıştır. Kitabını ibadetlerle ilgili konularda güzel bir şekilde ayırıcı başlıklara ayırması ve bir kısmı hariç meseleleri kaçırmaması müellifin ilmi şahsiyetini yansıtmaktadır. Nakledilen bütün görüşlerde asli Hanefî kaynaklarına atıf yapılmıştır. Kitap ve sünnetten delilleri vermeye, deliller arasında tercih yöntemlerini zikretmeye önem göstermesi ile temayüz etmiştir. Diğer fıkıh kitaplarında eşine az rastlanır şekilde özellikle ibadetlerin tevkîfî yönleriyle ilgili olmak üzere Şer'î hükümlerle bağlantılı latif nüktelere değinmiştir."
