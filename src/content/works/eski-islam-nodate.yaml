abstract: "Bu çalışmada İslâm hukukunun devlet anlayışı içinde sosyal devlete yönelik hüküm ve uygulamalarının ortaya konması ve karşılaştırmaya imkân verecek şekilde incelenmesi amaçlanmaktadır. Araştırma esnasında daha çok literatür taraması yöntemi kullanılmış ve mukayeseler yapılmaya gayrete edilmiştir. Buna göre; İslâm hukukunda sosyal devlet, en geniş anlamıyla zekât üzerine kurulu ve velâyet yetkisi ile hiyerarşik olarak sorumlulukların dağıtıldığı, (zarûriyyât-hâciyyât-tahsîniyyât) ölçütlerine bağlı bir maslahata dayalı devlet anlayışını ifade etmektedir. İslâm hukukunun kaynakları bakımından Kur'ân ayetlerinde geçen paylaşımla ilgili hükümlerde“Allah'ın/Allah'a ait”tabiri ile ifade edilen payın“sosyal”olana, yani topluma karşılık gelmesi sosyal devlet anlayışını destekleyen bulgulardandır. Benzer durum“yetim”lere mallarının teslim edilmesi özelinde yetimlere ait olan mal,“mallarınızı”diye buyrulmak suretiyle“topluma”nispet edilmesi özel mülkünü hukuken temsil edemeyen kişilerin mülkünü kamu mülkiyetine devrederek sosyal bir sorumluluk yüklemektedir. İslâm hukukunda sosyal devlet, Allah'a inanmanın bir gereği olarak toplumun dezavantajlı kesimlerinin ve hukuken temsili henüz mümkün olmayan kesimlerinin sorumluluklarının“Allah'ın”ve“kamu”nun ifadeleriyle topluma yüklendiği bir toplum ve devlet yapısıdır. Zekât, vakıf, ganimetler, fey, kurban, keffaretler gibi olumlu paylaşım esasları ile faiz, ihtikâr, fiyat belirleme gibi olumsuz paylaşım yasakları ile mülkiyetin esas olduğu fakat mülkiyetin vazifeler yüklediği bir devlet anlayışıdır."
