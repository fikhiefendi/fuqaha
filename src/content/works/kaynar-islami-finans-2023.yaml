abstract: "Sektörel gelişimine paralel olarak, Türkiye'de İslami finans eğitimine son yıllarda yoğun bir ilgi söz konusudur. Bununla birlikte eğitim sürecinde yaşanan birçok sorun ve zorluk bulunmaktadır. Bu çalışmanın amacı, yükseköğretim düzeyinde yaşanan bu sorunları tespit etmek ve çözüm yollarını ortaya koymaktır. Çalışmada nitel araştırma yöntemi benimsenmiş olup, veriler mülakat yöntemi ile elde edilmiş ve içerik analizine tabi tutulmuştur. Çalışmanın amacı kapsamında Konya, İstanbul, Bursa, Sakarya ve Ankara gibi İslami finans eğitimlerinin ön planda olduğu illerdeki üniversitelerde bu alanda eğitim gören öğrenciler ve eğitim veren akademisyenler ile toplamda 30 görüşme yapılmıştır. Veri analiz sürecinde MAXQDA 2022 programı kullanılmıştır. Sonuçta, a) Ders materyali eksikliği, b) Standart ve kademeli bir eğitim müfredatının bulunmaması, c) Akademik çalışmalardaki tek düzelik/benzerlik, d) Eğitmenlerin niteliği ve sayısındaki yetersizlikler, e) Öğrenci profili (heterojen) ve kalitesi, f) Mezuniyet sonrası istihdam sorunu ve g) Alana yönelik ideolojik bakış olmak üzere 7 sorun kategorisi belirlenmiştir. Çözüm yolları ise; a) Standart ve kademeli bir eğitim müfredatının hazırlanması, b) Eğitimcilerin eğitimi ve yetkinliğinin artırımı, c) Sektör-kamu – üniversiteler arası ortak çalışma platformlarının oluşturulması ve bilimsel yayın sayısının artırılması, d) Ulusal ve uluslararası akademik faaliyetlerin yaygınlaşması ve lisans/lisansüstü program sayısının artırılması, e) Verilen eğitimlerin pratik olması; sektöre, piyasaya, insanlara dokunması ve sorunlara çözüm sunması, f) Alana yönelik farkındalık yaratımı, finansal okuryazarlık ve siyasi destek sağlanması, g) Alanın akademik unvan ve atamalarda ayrı bir disiplin olarak kabulü, h) Lisans programları için denklik verilmesi olmak üzere 8 kategoride ifade edilmiştir. Bulguların, yükseköğretim kurumlarının yetkili birimlerinin, sektör temsilcilerinin ve ilgili kamu otoritelerinin alana yönelik kararlarına değer katması beklenmektedir."
