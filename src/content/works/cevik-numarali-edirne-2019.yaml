abstract: "Osmanlı tarihi ve şehir tarihi araştırmalarında önemli kaynaklar arasında yer alan Şer'iyye Sicilleri kullanılarak yapılan bu tezin çalışma konusu 33 Numaralı Edirne Şer'iyye Sicili'dir. 33 Numaralı Sicil hicrî 1058- 1059 yıllarını, miladî 1648- 1649 yıllarını kapsamaktadır. Sicil defteri seksen beş varaktan oluşmaktadır. İncelenen defterdeki kayıtlara bakıldığında alacak davaları, borç davaları, miras davaları, vasi tayinleri, nâzır tayinleri, vekil tayinleri, köle azad etme davaları, sulh olma davaları, alım davaları, satım davaları, nafaka davaları, hibe etme davaları, temlik etme davaları, vakıflarla ilgili davalar, reşit olma davası gibi konular bulunmaktadır. 33 Numaralı Edirne Şer'iyye Sicili'nin (H. 1058-1059 /M. 1648-1649) Değerlendirilmesi isimli tez çalışmasında önce Edirne'nin tarihi ve Şer'iyye Sicilleri hakkında bilgiler verilmektedir. Daha sonra ise sicilde yer alan belgelerin konularına göre tasnifi yapılmakta ve defterde geçen belgelerin anlaşılabilir şekilde özetleri yazmaktadır. Çalışmanın ilerleyen kısımlarında ise elde edilen bilgiler değerlendirilmekte ve miladî 1648 ve 1649 yılları arasındaki zaman dilimi içinde Edirne'deki sosyal hayat ve ekonomik durum ortaya konulmaya çalışılmaktadır. Buradan hareketle elde edilen bütün bu bilgiler Edirne'nin sosyal ve ekonomik tarihine katkı sunacaktır."
