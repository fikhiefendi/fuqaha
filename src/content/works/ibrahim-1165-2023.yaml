abstract: "El-Barkavi'nin metni tek kabul edildiğinden el yazması (Temizlik ve Kan Tanımında Evlilerin ve Kadınların Zikrinin Tefsiri) İmam-ı Berkavi'nin -Allah ona rahmet etsin- bedeninin önemli açıklamalarından biridir. Hanefi fıkhının önemli metinlerinden biri olan Berkavi -Allah ona rahmet etsin- hiç kimseye aykırı bir söz söylemeden önemli konularla sınırlandırılmıştır. O، âlimlerdendir. gerekli konuları ve en güçlü ve en doğru olana ve fetva için seçilene ve bu، metninin girişinde belirtildiği gibi - Allah ona rahmet etsin - bu، ondan sonra İmam Muhammed El-Azmiri tarafından açıklandı - Allah razı olsun ona merhamet et - kapanışlarını kaldıran ve içinden geçtiği ve geçmediği yerlerde zorluklarını ortaya çıkaran yeterli bir açıklama,dahil olmak üzere:“Eğer bir kadın Hoşuna gitti، çünkü karnında yarılan bir yara vardı ve içinden çocuk çıktı.”İşte bu، bizim artık sezaryen olarak bildiğimiz şeydir. Bunu bilmek ve onun hükmünü uygulamak، kadının ibadetidir. Bu konu çoğu ilim talebesi tarafından muğlaklığın olduğu konuların ele alındığı bölümlerden biri olarak kabul edilir ve müphemlik kadının kanama ayrımında yatar، hayız kanı mıdır، yolsuzluk kanı mıdır، nerdeyse mümkündür. meselelerinin çoğunda anlaşmaya varmak ve beni diğerlerinin üzerinde bu el yazmasını araştırmaya iten sebeplerden biri de: ulusun mirasını canlandırma arzum. ve seçkin âlimlerimizin geride bıraktıkları zengin ve tükenmez mirasın bilgisi، tıpkı Müslüman kadınların ihtiyacı olduğu gibi; Ve kimse onları elde etmede ve önemleri için incelemede benden önce gelmediğinden, onları başarmanın onuru için büyük bir saikle doğdum. Çalışma, aşağıdakiler de dahil olmak üzere önemli sonuçlara ulaştı: Bu açıklama، faydalı açıklamalardan biri olarak kabul edilir. Aynı zamanda temizlik ve kan konularını da içeriyor, kolay ve kolay ve bu, müfessir tarafından bu nüshanın mukaddimesinde ifade edildiği gibidir:“Ben onu، kapalılıklarını kaldıran ve zorluklarını ortaya çıkaran bir şerh ile açıkladım.”Ancak meselelerini yeniden gözden geçirmek dışında kolay değil."
