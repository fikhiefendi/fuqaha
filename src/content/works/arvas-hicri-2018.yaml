abstract: "Bu çalışmada fıkıh usûlü kelâm ilişkisi, teşekkül ve olgunlaşması hicri yedinci asra kadar süren Hanefî usûl düşüncesi bağlamında incelenmiştir. Külli bir ilim olması sebebiyle bütün şer'î ilimlere etki etmiş olan Kelâm, usûl anlayışlarının, ele alınan konuların ve takip edilen yöntemlerin şekillenmesinde fıkıh usûlüne tesir etmiştir. Hanefi usûl düşüncesinin teşekkülü ve olgunlaşması sürecinde iki bölge Hanefîleri ekili olmuştur. Bunlar; Bağdat merkezli Irak Hanefî meşayihi diğeri ise Buhârâ ve Semerkant merkezli Mâverâünnehir Hanefî meşayihidir. Araştırma neticesinde Irak ve Mâverâünnehir Hânefîleri arasında teolojik, Semerkant ve diğer Hanefîler arasında da yöntem (yaklaşım) farklılıklarının olduğu tespit edilmiştir. Buna göre Irak Hanefî usûlcülerin İ'tizâlî eğilimde, Mâverâünnehir Hanefilerinin ise Sünnî inanç esaslarına bağlı oldukları görülmüştür. Ayrıca Irak Hanefi usûlcüleriyle usûlde onları takip eden Debûsî, Serahsî ve Pezdevî gibi Mâverâünnehir usûlcüleri fıkıh ağırlıklı bir usûl yaklaşımına sahipken, Semerkant Hanefilerinin kelâm ağırlıklı bir usûl yaklaşımına sahip olduğu tespit edilmiştir. Çalışmada Hanefî usûl eserlerinde akıl, hüsün-kubuh, teklif, şer'î illet, içtihatta isabet ve hata gibi kelâmla ilişkilendirilen meseleler, Hanefi usûlcülerin yaklaşımları ve kelâmî tavırları dikkate alınarak ayrıca incelenmiştir."
