abstract: "Bu tez çalışmasında, Nisâ Suresi çerçevesinde Cahiliye döneminde nikâh akdi ve İslam'da evlilik kurumunun gelişimi ele alınmaktadır. Cahiliye dönemi Arap toplumunda, evlilik, çok eşlilik ve kadınların hakları açısından büyük bir düzensizlik hâkimdi. Nikâh akdi genellikle, erkeğin kadına karşı tam bir egemenlik kurduğu, kadının mal gibi görüldüğü bir uygulamadır. Kadınlar, ailesinin veya eşinin malı gibi kabul edilir, boşanma kolayca gerçekleşir ve kadınların tekrar evlenmesi de sınırlıydı. Çoğu zaman kadınların rızası göz ardı edilir, hatta bazı durumlarda kadınlar, boşanmış olsa bile eski eşleriyle yeniden evlenmeye zorlanırdı. İslam, Nisâ Suresi'nde evlilikle ilgili çeşitli hükümler getirerek, bu düzensizliği düzeltmeye yönelik önemli reformlar yaptı. İslam, evliliği bir sözleşme olarak tanımlar ve kadınların da rızasını şart koşar. Çok eşliliğe sınırlamalar getirerek, bir erkeğin en fazla dört kadınla evlenebileceğini, ancak adaletli davranma şartını öne sürer. Boşanma süreci düzenlenmiş ve kadınlara daha fazla hak tanınmıştır. Kadınlar, miras hakkı, nafaka ve boşanma durumunda belirli korumalarla güvence altına alınmıştır. Bu reformlarla, evlilik, toplumda daha adil ve saygılı bir ilişki biçimi hâline gelmiştir. Çalışma, giriş, iki ana bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde, çalışmanın konusu, amacı, önemi ve kullanılan yöntem hakkında genel bilgilere yer verilmiştir. Birinci bölümde, Cahiliye döneminde ve diğer toplumlarda nikâh, evlilik ve aile kavramları incelenmiştir. Bu bağlamda, dönemin evlilik yapısı ve toplumsal normları, konuyla ilgili tezler, makaleler ve akademik çalışmalar ışığında değerlendirilmiştir. Ayrıca, bu dönemde kadınların evlilikteki rolü ve hakları da ele alınmıştır. İkinci bölümde ise, İslam'ın gelişiyle birlikte evlilik kurumunda meydana gelen değişiklikler Nisâ Suresi kapsamında detaylı olarak incelenmiştir. Bu bölümde, İslam'ın getirdiği düzenlemeler ve Nisâ Suresi'nde yer alan ayetler doğrultusunda evliliğin nasıl yeniden yapılandırıldığı açıklanmış; konuya dair ayetler ve hadisler ışığında İslam'ın aile yapısına getirdiği katkılar üzerinde durulmuştur. Sonuç bölümünde ise, İslam'ın rehberliğinde nikâh ve evlilik kurumunun nasıl şekillendiği ve aile yapısının nasıl güçlendirildiği özetlenmiştir. Çalışma, İslam'ın aileye verdiği önemi ve Cahiliye dönemine kıyasla getirdiği ahlaki, sosyal ve hukuki düzenlemeleri ortaya koymayı amaçlamaktadır."
