abstract: "İslâmda sosyal politika uygulamaları sosyal adaletin ve eşitliğin sağlanması temeline dayanmaktadır. İslâm, kişilere ve devletlere toplumun refahına yönelik birtakım sorumluluklar yüklemektedir. Bu anlamda İslâm'da sosyal devlet esastır. Devlet, bireylerin temel ihtiyaçlarını karşılamakla ve yaşam koşullarını iyileştirmekle yükümlüdür. Yükümlülüklerini yerine getirirken de toplumun her kesimine adaletli olması gerekmektedir. İslâm'da eşitsizlikleri azaltıcı ve refah ortamını iyileştirici etkiye sahip olan en önemli araç zekâttır. Zekât yoksulluğun azaltılmasına, gelir dağılımı adaletsizliklerinin giderilmesine ve istihdam artışına katkı sağlamaktadır. Bunun yanı sıra faiz yasağı ekonomik kalkınma ve sosyal refahın artışına, toplumun her kesimine hitap etmesi ve sürdürülebilir olması bakımından katkı sağlamaktadır. Bazı çalışmalar göstermektedir ki, İslâm ülkeleri gerek ekonomik gerekse sosyal refahı artırmaya yönelik uygulamalarında İslâmi bir bakış açısı geliştirememişlerdir Dolayısıyla İslâm ülkelerinde refah politikaları oluştururken, mevcut politikaların toplumsal koşul ve ihtiyaçlara ne kadar uyum sağladığı göz önünde bulundurulmalıdır. Bu tez çalışmasında, İslâm'da sosyal politika uygulamaları ve 57 İslâm ülkesinin sosyal politika uygulamaları incelenmiştir. Ayrıca İslâmi sosyal politika araçlarının İslâm ülkelerinde ne kadar yer edindiği araştırılmıştır. İslâm ülkelerinin sosyal politika uygulamalarına bakıldığında İslâmi uygulamaları tam anlamıyla benimsemedikleri görülmüştür. Bazı ülkeler İslâmi prensiplere göre belirlenen sosyal politikaları devlet aracılığıyla uygulamış olsa da, gerekli kurumsal altyapı oluşturulamadığı için sorunlar yaşanmaktadır ve sosyal politika uygulamaları merkezi hale getirilememektedir. Diğer bir husus ise, İslâm ülkelerinin politika geliştirmeye yönelik işbirliklerinde zayıf kaldıklarıdır. İslâm ülkeleri arasında siyasi ve ekonomik işbirliklerinin artması, ortak platformlar kurularak sosyoekonomik düzeyi oldukça kötü olan ülkeleri kalkındırmada bir araya gelmeleri gerekmektedir. Böyle bir yaklaşım ulusal kalkınma ve uluslararası işbirliklerinin dini ve kültürel temeller geçekleşmesine katkı sağlayacaktır."
