abstract: "Çalışmamızın kapsamı Ahmet Zühdü Paşa ve onun el-Mecmûʻa adlı eserinde nikâh bölümünü islam hukuku açısından ele almaktadır. el-Mecmûʻa idâdi ve sultânî mekteplerinde ders kitabı olarak okutulmuş olup ilmihal türünde yazılmış fıkhî bir eserdir. Zühdü Paşa bu eserini hazırlarken klasik fıkıh kaynaklarından faydalanmıştır. Zühdü Paşa daha çok Mâliye Nâzırı olarak tanınmakla beraber Maârif Nâzırlığı ve daha birçok farklı görevlerde bulunmuştur. Zühdü Paşa aynı zamanda Dâru'l-Fünûn kurucuları arasında bulunmaktadır. Bizim bu eseri tanıtıp değerlendirmesini yapmamız ve latinize halini sunmamız o dönemde yazılmış bir ilmihal örneğinin tanıtılmasına ve ondan istifade edilmesine olanak sağlayacaktır. Çalışmamızın ilk kısmında el-Mecmûʻa'nın hem bir fıkıh hem de bir ders kitabı olarak değerlendirilmesi yapılacak, ikinci kısımda el-Mecmûʻa Hukuk-i Aile Kararnâmesi ile fıkhî açıdan mukayese edilecek ve son kısımda ise Zühdü Paşa'nın el-Mecmûʻa adlı eserinin latinizesi yapılarak günümüz ilim dünyasının istifadesine sunulacaktır."
