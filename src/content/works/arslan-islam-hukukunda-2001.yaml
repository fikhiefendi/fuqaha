abstract: "II ÖZET İnsanın yaşaması için gerekli olan yiyecek, içecek, giyecek, barınma ve tedavi gibi giderlerin karşılanması olan ve İslam hukukunda nikah, mülkiyet veya hısımlık nedenlerinden birine dayanan nafakanın evlilik, usul-furu, havaşi, mülkiyet, hayvanlar, nebatat ve cemadat nafakası gibi çeşitleri vardır. Nafaka verecek olanın zengin, nafaka alacak olanın da fakir olması gerektiğine ek olarak, şayet erkekse, çalışamayacak durumda olması da gerekir. Kız olsun erkek olsun bütün zengin çocuklara, çalışmaya güçleri olup olmamasına bakılmaksızın fakir ana-babalarının ve ne kadar yukarı çıkarsa çıksın onların ana babalarının nafakası vaciptir. Babalara da, kız olsun erkek olsun, çocukları ve ne kadar aşağı inerse insin onların çocukları olan furularından küçüklük, özürlülük, işsizlik, öğrencilik, kadınlık gibi vasıflardan birisi sebebiyle çalışmayacak durumda olanların nafakası vaciptir. Yakınlarının nafakasını vermekten kaçınan, tutuklanır. Müstahakk, kayıp olan nafaka mükellefinin mallarından, hakkı kadarını varsa nafaka cinsi olanlarından yoksa diğerlerinden de alabilir. Nafakanın miktarı mükellefin ödeme gücü, alacakların ihtiyacı, mahallin örf ve adeti dikkate alınarak tespit edilir. Ancak bu miktar sabit değildir. Alacaklıya, borçluya ve ikisinin dışındaki diğer objektif faktörlere bağlı olarak azaltılıp çoğaltılabilir Birden fazla nafaka mükellefi bulunursa nafaka en yakına, yakınlıkta eşitlik olsalar varis olana vacip olur. Birden fâzla alacaklı bulunması durumunda küçüklük, özürlülük, kadınlık gibi vasıflardan birine sahip olan diğerlerinden önce nafaka alır."
