abstract: "Hacı Selim Ağa Kütüphanesi'nde yazma veya matbu halde bulunan fıkıh eserlerini konu edinen çalışma giriş, iki bölüm ve sonuç kısmından oluşmaktadır.Birinci bölümde kütüphanedeki fıkıh nüshaları müellifleriyle birlikte aktarılmıştır. Her müellifin hayatı hakkında gerekli bilgilere değinilmiştir. Müelliflerin kütüphanedeki eserleri ismen söylendikten sonra nüshanın teknik özellikleri verilmiştir. Ayrıca eser hakkında akademik çalışmaları bulunanlar dipnotta belirtilmiştir.İkinci bölümde müellifi belli olmayan eserlere yer verilmiştir. Bunların nüshaları hakkında bilgi verilip müellifi tespit edilmeye çalışılmıştır."
