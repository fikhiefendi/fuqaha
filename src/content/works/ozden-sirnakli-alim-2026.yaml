abstract: "Erzen, güneydoğu medrese kültüründe özellikle de Şırnak bölgesinde tanınmış önemli şahsiyetlerden biridir. Özellikle yaşamış olduğu dönemde halkın sorunlarıyla bizzat ilgilenmiş onların dini sorunlarını çözmeye çalışmıştır. Ayrıca yetiştirdiği talebelerin her biri Şırnak bölgesinde önemli görevlere gelmişlerdir. Erzen gerek yazdığı risâleler gerekse üç ciltlik hacimli eseri olan Levâmi'u'l-cevâhîr fî isna aşere ilmen yücâhir isimli eseri vasıtasıyla topluma ışık tutmaya çalışmıştır. Risâlelerin her biri kendine has bir konuyu ele almakla birlikte üç ciltlik eseri ise başta usûl ve furû fıkıh olmak üzere her cildi muhtelif konularla ilgilidir. Uzun yıllar süren tedris ve irşat faaliyetleri sırasında karşılaştığı soru ve sorunlara cevap mahiyetinde oluşturduğu ve sonradan tasnif edip kitaplaştırdığı anlaşılmaktadır. Bundan dolayı eserde tefsir, fıkıh, kelam, hadis ve hatta gramerle ilgili muhtelif disiplinlere dair malumat söz konusudur. Kitapta ele alınan konuların farklılığı ve genişliği hocanın ilmî ve fikrî birikiminin göstergesidir. Birinci ciltte kelam ilmi, kâinatın yaratılışı, ruh-ceset ilişkisi, sihir, tılsım, makro âlem, bazı hadisler üzerine mülahazalar, cin ve şeytanla ilgili bilgiler, tasavvufun incelikleri ve bazı ayetlerin tefsiri gibi konular işlenmektedir. İkinci ciltte felsefe ve felsefe tarihi, İslam filozofları, bazı tarihi kıssalar, yemek ve adabı, rüya, ilham ve keramet gibi konular yanında bazı tasavvufi meseleler ile peygamberler tarihinden bazı ilginç olaylar ele alınmaktadır. Üçüncü ciltte ise güncel fıkhi meseleler ele almaktadır. Kolonyanın hükmü, organ nakli, azil, meşru müdafaa, teflik, av, ehli kitabın kestiklerinin yenilmesi, tesettür, evlilik gibi güncel dini meseleler üzerinde durulmaktadır."
