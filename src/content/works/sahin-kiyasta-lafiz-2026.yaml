abstract: "Bu çalışma, İslâm hukukunda istidlâl yöntemlerinin merkezinde yer alan kıyasın mâhiyetini, lafzî ve makâsıd merkezli yaklaşımlar bağlamında mukayeseli olarak incelemeyi amaçlamaktadır. Klasik fıkıh usulünde kıyas, çoğunlukla zâhir, munzabıt ve objektif olduğu kabul edilen illetler üzerinden kurulmuş olup şeriatın gayeleri (makâsıd) hukuki gerekçelendimenin dolaylı bir unsuru olarak değerlendirilmiştir. Bu yaklaşım; hukuki istikrarı koruma amacı taşısa da kimi zaman vâkıa ile uyumsuz sonuçlar doğurmuş, istihsân ve hîle-i şerʿiyye gibi yöntemlere başvurulmasını gerekli kılmıştır. Çalışmada, bu problemlerin arka planı analiz edilerek, makâsıd merkezli kıyas anlayışının söz konusu açmazlara nasıl bir çözüm sunduğu ele alınmıştır. Bu bağlamda illet–hikmet ayrımının kıyasa yansımaları detaylı biçimde incelenmiş; Gazzâlî, İzzeddin b. Abdüsselâm, İbn Kayyim ve Şâtıbî gibi klasik dönem âlimlerin görüşleri kronoloji gözetilerek analitik bir yöntemle değerlendirilmiştir. Modern dönemde ise İbn Âşûr ve diğer çağdaş usulcülerin makâsıd teorisine getirdiği açılımlar da kıyas bağlamında ele alınmıştır. Araştırmada, istihsânın çoğu durumda lafzî kıyasın ifade edemediği veya daralttığı makâsıdî gerekçelerin dolaylı bir tezahürü olduğu; makâsıd merkezli kıyasın ise bu işlevi doğrudan ve sistematik biçimde yerine getirebilecek bir istidlal imkânı sunduğu savunulmaktadır. İktisat, aile hukuku ve ibadetler alanından seçilen örnekler üzerinden yapılan uygulamalı analizler, makâsıdî kıyasın güncel fıkhî problemlere daha tutarlı ve işlevsel çözümler üretebildiğini göstermektedir. Sonuç olarak bu çalışma, lafzî kıyasın sınırlarını ve makâsıd merkezli kıyasın imkânlarını karşılaştırmalı olarak ortaya koymakta; fıkıh usulünde kıyasın yeniden yorumlanmasına yönelik teorik ve metodolojik tartışmalara bir katkı sunmayı hedeflemektedir."
