abstract: "Döviz işlemleri; dış ticaretin finansmanı, uluslararası işlemlerin yürütülmesi ve müşteri taleplerinin karşılanması açısından hem katılım bankaları hem de konvansiyonel bankalar için temel faaliyet alanlarından biridir. Ancak bu işlemler, kur dalgalanmalarından kaynaklanan önemli riskleri de beraberinde getirir. Bu çalışma, Türkiye'deki katılım ve konvansiyonel bankaların döviz işlemleri ve döviz kuru risklerini yönetme yöntemleri açısından karşılaştırmalı bir analizini sunmaktadır. Çalışmanın başında her iki banka türünün yapısal benzerlikleri ve farklılıkları ele alınmış, özellikle katılım bankalarının şeri ilkelere bağlı kalma zorunluluğunun işlem ve hedge araçlarının tasarımını etkilediği vurgulanmıştır. Araştırmada, 2023 yılına ait banka performans raporlarına dayalı olarak nicel yöntem kullanılmıştır. Döviz işlemlerinden doğan kâr ve zararların bankanın türüyle değil, operasyonel stratejiler ve hedge araçlarının etkinliğiyle ilişkili olduğu sonucuna ulaşılmıştır. Katılım bankalarının döviz takasları (swap) ve şeriata uygun vadeli döviz sözleşmelerini (forward) hem ticari hem korunma amacıyla kullandığı; konvansiyonel bankaların ise bu araçlara ek olarak opsiyon ve future sözleşmeleri gibi daha geniş bir yelpazede türev araçları tercih ettiği gözlemlenmiştir. Araştırma, katılım bankalarına döviz kuru risklerinin yönetiminde operasyonel stratejilerin güçlendirilmesini ve döviz likiditesini artırmak için döviz cinsinden kıymetli metallere ve sukuklara yatırım yapılmasını önermektedir."
