abstract: "Sürekli değişim ve dönüşüm içerisinde olan toplumda ortaya çıkan problemler ve ihtiyaçlar bazen nasslar tarafından doğrudan çözüme kavuşamayabilir. Fakihler bu durum karşısında özellikle nassların ilke ve amaçlarından hareketle çözümler üretmeye çalışmışlardır. Çözüm üretirken nassların ilke ve amaçları yanında yaşadıkları dönemdeki bilgi ve tecrübelerden istifade etmeye çalışmışlardır. Fakihlerin insan bedeniyle ilgili fetvalarında ve görüşlerinde dönemlerinin bilgi ve tecrübelerden istifade ettikleri bellidir. İşbu çalışma özellikle zaman unsuru taşıyan bedenle ilgili geçmişte fakihlerin vermiş olduğu ama değişim nazarıyla yeniden incelenmesi gerekli fetvalara yoğunlaşmaktadır. Bedenle ilgili değişimin var olduğu düşünülen fetvaların incelendiği bu çalışma giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmında konunun önemi, amacı, sınırları ve konuyla ilgili çalışmalardan bahsedilmiştir. Birinci bölümde konunun teorik olarak altyapısı oluşturulmaya çalışılmış, ikinci bölümde ise pratik yönüne eğilerek fetva ve görüş örnekleri verilmesine gayret edilmiştir. İkinci bölümde örnekler, doğrudan insan bedeniyle ilgili ve bedenle ilgisi dolaylı olan fetvalar şeklinde iki kısım olarak incelenmiştir. Sonuç kısmında değişimin sürekli yaşanabileceğine, bedenle ilgili olsun ya da olmasın fetva verirken zamanın değişen koşullarına dikkat edilmesi gerektiğine vurgu yapılmış ve elde edilen bilgiler maddeler halinde sunulmaya çalışılmıştır."
