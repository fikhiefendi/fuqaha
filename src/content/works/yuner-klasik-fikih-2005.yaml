abstract: "Klasik Fıkıh Doktrininde Kadınların Ceza Konularındaki ŞahitliğiTezin konusu, klasik olarak tabir edilen ve slam'ın gelişinden sonraki ilk birkaç asrıiçeren dönemde kadınların ceza konularındaki şahitlikleri hakkında ortaya konulanhükümlerin belirlenmesi, bu hükümlere varmaya etken olan durumlar ve bunlarıngünümüze yansıması hakkındadır.Böyle bir çalışmanın yapılış amacı, üzerinde birçok tartışmanın yapıldığı, kadınlarınsosyal statüsünün şahitlik bağlamında ilk dönemden başlayarak ne tür münazaralarlaişlendiği konusunu araştırıp, klasik ve modern dönemin görüş birliği ve farklılığıiçinde olduğu hususları açıklığa kavuşturmaktır.Tez üç ana bölümden müteşekkildir. Birinci bölüm, kavram ve müessese olarakşahitliği ve genel olarak kadınların şahitliğini muhtevidir. kinci bölümde, klasikfıkıh doktrinine göre suçlara mukabil verilen cezaların taksimi ve kadınların busuçların ispatındaki şahitlikleri üzerinde durulmuştur. Üçüncü bölümde ise, modernçağ olarak nitelendirilen asrımızdaki bilim adamlarının, kadınların cezakonularındaki şahitlikleri hakkında klasik fıkıh doktrinlerinde serdedilen görüşlereyaklaşımları işlenmiştir.Tez çalışması süresince elde ettiğimiz bulgular neticesinde ortaya çıkan sonuç;klasik dönemde varılan hükümlerin, Kur'an ve Hadislerde bu konuda kesin vebelirleyici ifadelerin bulunmaması nedeniyle, o zamanın hayat şatları da esas alınıp,anılan teşri kaynaklarında konu hakkındaki ifadeler yorumlanarak belirlendiği veçağımız âlimlerinin çoğunluğuna göre bu hükümlerin günümüzde işlerlik bulmasınınmümkün olmadığı şeklindedir."
