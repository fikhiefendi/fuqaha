abstract: "Bu çalışmanın üç temel amacı bulunmaktadır. Bunlardan ilk ikisi İslami hisse senedi yatırımı ilkelerini açıklamak ve başlıca İslami hisse senedi izleme metodolojilerini analitik bir yöntemle tanıtmaktır. Ampirik uygulamada İslami endekslerin risk ve getiri karakteristiği finansal ve ekonometrik modellerle ortaya konularak konuya bütüncül bir yaklaşım geliştirilmiştir. İslami sermaye piyasasının kurucu çerçevesiyle ilgili çözüm bekleyen çok sayıda fıkhi ve teknik mesele bulunmaktadır. Günümüzde konunun teorik çerçevesi ve uygulama alanlarında doldurulması gereken boşluk elde edilen birikimden çok daha büyüktür. İslami izleme kriterlerine yönelik haklı eleştiriler sonucu İslam iktisatçılarının ortak temennisi İslami yatırımların giderek hız kazanarak konvansiyonel sistem içinde kendine alan açması ve bugünkü izleme uygulamalarının bir geçiş dönemi çözümü olarak tarihsel süreçte yerini almasıdır. Uygulama bulgularına göre İslami endeksler ile konvansiyonel muadillerinin risk ve getiri karakteristiği arasında incelenen ülke, endeks tipi ve zaman dilimine bağlı olarak dikkate değer farklar vardır. İslami endeksler konvansiyonel muadillerine kıyasla daha iyi performans gösterme ve daha düşük düzeyde sistematik riske sahip olma eğilimi göstermektedir. Ancak bu bulguların büyük bir kısmı istatistiksel olarak anlamlı değildir. Dolayısıyla teknik ifadesi ile bu çalışmada İslami endeksler ile konvansiyonel muadillerinin risk ve getiri karakteristiği arasında anlamlı bir fark olmadığı sonucuna varılmıştır. Bununla birlikte, dini inançları gereği İslami endekslere yatırım yapan yatırımcıların ilave maliyete katlanacakları iddia edilemez."
