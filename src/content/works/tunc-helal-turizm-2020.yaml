abstract: "İktisat ve iktisadi olaylar insan yaşamında çok önemli bir yer tutmaktadır. İnsanlığın tüm ihtiyacını karşılayacak şekilde gönderilen İslam dini, iktisadi alanda insanların refahını yükseltecek ilkeler getirmiştir. Bu ilkeler etrafında İslam iktisat düşüncesi içerisinde murabaha, mudaraba, müşaraka, sukuk, selem ve istisna gibi faiz dışı sistemler geliştirilmiştir. Diğer taraftan değişen ihtiyaçların karşılanabilmesi için yeni standartlar ortaya konulmuştur. Bu standartlara verilebilecek en güzel örneklerden biri ise Müslüman turistlerin İslami ölçüler çerçevesinde tatil ihtiyaçlarını karşılayabilmeleri için oluşturulan“Helal Turizm”konseptidir. Modern çağda finansal yönetimin uzmanlık gerektirmesi ile birlikte katılım finansı hızlı bir şekilde büyümüş, bu büyüme doğrultusunda da katılım bankacılığı ve İslami finansın diğer alanlarının önü açılmıştır. Katılım bankaları murabaha, mudaraba ve muşaraka sistemlerinin en kurumsal ve sistemli uygulandığı müesseseler haline gelmiştir. Diğer taraftan farklı ölçekteki sermayelerin bir araya gelerek meydana getirdikleri fonlar ise sukuk ve türevlerinin özelikle yatırımların finansmanı için yaygın bir şekilde kullanımını sağlamıştır. Hem katılım bankacılığı hem de sukuk uygulamaları belli bir tecrübe seviyesine ulaşmış, diğer çalışmalara alt yapı sağlayacak noktaya gelmiştir. Bu çalışmada bahsi geçen temel yöntemlere sadık kalmak şartı ile İslam iktisadının yelpazesi biraz daha genişletilerek helal turizmin bir bileşeni olarak kabul edilen termal devre mülklerin kiralanmasında kullanılmak üzere katılım finans ilkeleri etrafında yeni bir model önerisi literatüre ve girişimcilerin istifadesine sunulmuştur. Araştırmada verilerin toplanıp, problemin tüm yönleri ile tespit edilebilmesi amacıyla yarı yapılandırılmış sorular derinlemesine mülakatta açık uçlu olarak muhataplara sorulmuştur. Problemin tespit edilmesinden sonra en doğru modelin geliştirilmesi amacıyla“gayrimenkul yatırım ortaklıkları”ve“sukuk”iş modeli olarak,“katılım bankacılığı katılma havuzları”ise finansal model olarak araştırmanın altyapısını oluşturmuştur. Bulgular modelin işlevselliğini ve katılım finans ilkelerine uyumunu göstermiştir."
