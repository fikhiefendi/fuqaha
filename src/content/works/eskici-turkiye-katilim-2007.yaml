abstract: "Bankacılık sektörüyle karsılastırıldıgında oldukça kısa bir geçmise sahip olan Katılım Bankaları, mali sektördeki gelismelere baglı olarak son yıllarda hızlı bir büyüme sürecine girmistir. Para ticareti yerine mal ticaretine dayalı islemlerin esas alındıgı bu kurumların kavram olarak ifade edilmesinin, tarihsel gelisiminin, hukuki yapılarının, fon kaynakları ve kullanımlarının, ekonomiye katkılarının, Türkiye'deki faaliyet ve büyüklüklerinin yanı sıra müsteri özelliklerinin incelenmesi önem arz etmektedir. Sermayenin küresellesmesinin de etkisiyle, uluslar arası mali piyasada daha yakından incelemeye alınan bu kurumlar kalkınmakta olan ülkelere yeni imkanlar sunmakta ve bir yandan faiz kaygısıyla tasarruflarını ekonominin hizmetine sunmayan kesimlerin tasarruflarını ekonomiye kazandırırken diger yandan da yatırımcıların fon temin edebilecekleri kurumlar islevini görerek yatırım ve tasarruf sahipleri arasında aracılık görevini yerine getirmektedirler. Bu çalısma ile Katılım Bankacılıgı kavramı, temel ilkeleri, uygulamaları, faaliyetleri ve müsteri özellikleri ortaya konulmaya çalısılacak ve Türkiye'deki finansal gelisimleri irdelenecektir."
