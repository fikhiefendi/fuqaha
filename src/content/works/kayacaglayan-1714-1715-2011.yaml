abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından biri Şer`iye Sicilleri'dir. Bu belgeler, ait oldukları dönem ve yer hakkında oldukça kıymetli bilgiler ihtiva etmektedir. Bu çalışmamız, Türk tarihi ve kültürü açısından büyük bir önem taşıyan Şer`iye Sicillerinden H.1126-1127/M.1714-1715 tarihlerini kapsayan Gaziantep'te tutulan şer`î mahkeme kayıtlarını içermektedir. Toplam 287 sayfadan oluşan bu sicil defterinde 132 adet idari ve 405 adet de hukuki içerikli toplam 537 adet belge bulunmaktadır. Defter iki taraflı kullanılarak bir tarafına arzuhaller, nişân-ı şerîfler, fermanlar ve buyruldular gibi idari içerikli belgeler diğer tarafında ise miras, nafaka, vasi tayini, boşanma, alacak verecek gibi hukuki içerikli belgeler kaleme alınmıştır. Bu defter ışığında dönemin Gaziantep'inin idari, sosyal, kültürel, ekonomik durumu ortaya konulmaya çalışılmıştır. Transkripsiyonu yapılan belgeler tasnif ve tenkit edilerek değerlendirmeye tabi tutulmuştur. Transkripsiyonu yapılan belgelerin içerikleri, diplomatik özellikleri, hicri ve miladi tarihleri kısa belge özetleri ile birlikte her belge için ayrı bir tablo içerisinde sunularak okuyucuya kolaylık sağlanmaya çalışılmıştır."
