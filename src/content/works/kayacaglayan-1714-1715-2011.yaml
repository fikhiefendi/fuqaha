title: "1714-1715 Tarihleri Arasında Gaziantep'te Sosyal, Siyasi ve İktisadi Yapı: 65 Numaralı Gaziantep Şer'iyye Sicili Metin Transkripsiyonu ve Değerlendirmesi"
