abstract: "Muhyiddin Ebû Muhammed Abdülkâdir b. Ebî Sâlih Mûsâ Cengîdost el-Geylânî veya daha da tanınan ismiyle Abdülkâdir Geylânî, Büyük Selçuklu Devleti döneminde Hicrî V-VI. yüzyılda yaşamış olup dönemin Hanbelî âlimlerinin önde gelen fakihlerindendir. Aynı zamanda dünyanın çeşitli yerlerinde mensubu bulunan Kadiriyye Tarikatının da kurucusudur. Kendisi tefsir, hadis, fıkıh ve tasavvuf gibi birçok İslâmî ilimleri dönemin ilim merkezi olan Bağdat'ta tahsîl etmiş ve birçok eseri kaleme almıştır. Kendisine ait medresesinde çeşitli bölgelerden gelen ilim tâliplerine de dersler vermiştir. Onun fıkhi görüş ve anlayışına yer vermesi bakımından en önemli eseri el-Gunye li-Tâlibî Tarîki'l-Hak'tır. Söz konusu olan bu eserini Geylânî kelam, fıkıh ve zühd olarak üç bölümde ele almaktadır. el-Gunye eserinin fıkıh hariç diğer alanlarında inceleme çalışmaları yapılmış olup, fıkıh alanı hakkında bir çalışma bulunmamaktadır. Dolayısıyla eserin fıkıh ilmi açısından tetkik edilmesi son derece elzemdir. Bu çalışmada, eserdeki ibadetlere dair furu fıkıh bağlamındaki değerlendirmelerinden Geylânî'nin fâkih kimliği ortaya konmaya çalışılmış, el-Gunye eserinin furu fıkıh yönünün akademik bir perspektifle gün yüzüne çıkarılması hedeflenmiştir. Bu çerçevede çalışmamızda Abdülkâdir Geylânî'nin tarihî şahsiyeti, ilmî kişiliği, eserleri ve etkilerine kısaca değinilmekle birlikte el-Gunye eserindeki ilmihal niteliği taşıyan konuların incelenmesine dair bilgiler ele alınmaktadır. Eseri incelerken özellikle Geylânî'nin Hanbelî fıkıh usulüne ve Mezhep imamının içtihatlarına bağlılık düzeyi de takip edilmeye çalışılmıştır. Ayrıca İbn Kudâme'nin el-Muğnî'si özelinde de kendisinden sonraki Hanbelî fıkhîna etkisi incelenmiştir."
