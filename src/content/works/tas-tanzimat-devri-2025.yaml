abstract: "Bu çalışma, Tanzimat devri ceza hukuku zihniyetini araştırmaktadır. 1838-1858 tarihleri arasında yürürlüğe giren altı adet ceza kanunu bulunmaktadır. Araştırmada bu ceza kanunlarının zihniyet kaynakları incelenmiştir. Ayrıca zihniyetin esasları ve hukuk aktörleri konu edilmiştir. Şer'i hukuk ile örfî hukukun ilişkisine değinilmiştir. 18. yüzyılda ortaya çıkan modern kanun fikrinin klasik Osmanlı hukukuna etkisi araştırılmıştır. Böylelikle ceza hukuku zihniyetinin aydınlatılması hedeflenmiştir. Bunu yaparken kanunların usulü ile dil özellikleri gözetilmiştir. Kanunlarda suç ve cezaların nasıl tanımlandığına ve yerleştirildiğine dikkat edilmiştir. Kanunkoyucu olarak Sultan II. Mahmud, Sultan Abdülmecid ve Tanzimat bürokratlarına kanunlara etkileri nispetinde temas edilmiştir. Ayrıca ulemanın bu konudaki katkıları ve görüşleri çalışmaya dahil edilmiştir. Çalışmanın hedefi, Türk modernleşmesinin ceza hukuku zihniyetini anlamaya çalışmaktır. Böylelikle hukuk devleti kurma isteği, merkezileşme politikaları ve beka kaygısı daha iyi anlaşılabilecektir. Ceza hukuku zihniyetinin ve kanunlaştırma sürecinin bu amaca elverişli olduğu düşünülmektedir. Çalışmada arşiv belgeleri, ikincil kaynaklar ve araştırma eserleri etkin bir şekilde kullanılmıştır. Kanunlarda yer alan kavramların kullanıldıkları bağlama göre değerlendirilmesinde hassasiyet gösterilmiştir."
