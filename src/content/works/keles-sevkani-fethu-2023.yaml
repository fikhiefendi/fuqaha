abstract: "Araştırmamızda, son dönem müfessirlerinden biri olarak birçok alanda ihtisas sahibi olan ve aynı zamanda Yemen'in önde gelen âlimleri arasında gösterilen Şevkânî'nin dirâyet ve rivâyet özellikli Fethu'l-Kadîr adlı tefsirinde yoğun bir şekilde ele alınan kıraat ihtilafları ve bunların tefsire yansıyan yönlerinin araştırılması amaçlanmıştır. Öncelikle araştırmamızın temel konularını belirlemek üzere araştırmamızın iskeletini oluşturan ve zengin bir muhtevaya sahip olan bu eser, baştan sona taranarak zikredilen kıraat ihtilaflarının tefsir çerçevesinde incelenmesi ve Arap dili grameriyle olan bağlantısı temelinde, filolojik tahliller yapılarak ele alınmıştır. Bu amaçla Şevkânî'nin tefsirinde kullandığı kıraat örnekleri tespit edilerek takip ettiği yöntem ortaya konulmaya çalışılmıştır. Müellifin hayatı, yetiştiği ortam ve ilmi kişiliği ana hatlarıyla incelenmiştir. Kıraat ilmi, Fethu'l-Kadîr'in kaynakları, özellikleri ve metodu araştırma konusu yapılmıştır. Şevkânî'nin kıraat tasavvuru, kıraatlerin tevcihinde bulunması, kıraatleri atıf yöntemi, kullandığı sahih ve gayri sahih (şâz) kıraatlerin tefsire yansıyan yönü, kıraatlerin fıkhî meselelere etkisi ve kişisel görüşlerinde de genellikle sahih kıraat imamlarından çoğunluğun üzerinde ittifak ettiği kıraatleri tercih etmesi ele alınmıştır."
