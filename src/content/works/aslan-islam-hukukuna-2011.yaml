abstract: "?İslâm Hukukuna Göre Vakıf Mallarında Vakıf Hükmünün Sona Ermesi? isimli tezimiz bir giriş ile üç bölümden meydana gelmektedir. Giriş bölümü araştırmanın amacı, önemi, sınırları ve yönteminden oluşmaktadır.Birinci bölümde Hanefî, Maliki, Şafiî ve Hanbelîlere göre, vakfın kavramı işlenmiştir. Vakfın rükün ve şartlarıyla ilgili mezhep âlimlerin ilgili görüşleri araştırılmıştır.İkinci bölümde; dört Mezhep ve Osmanlı uygulamasında, sahih olarak kurulan bir vakıf muamelesinin ne gibi sonuçlar doğuracağı tespit edilmeye çalışılmıştır. Vakfın hükmü başlığı altında vakıf hükmünün doğurduğu sonuçlardan vakfın bağlayıcılığı (lüzümu), süresiz (te'bid) olması vakıftan vazgeçilmesi (rücû), vakfedilen malın mülkiyeti, irsâdi vakıflar ve para vakıfları gibi konular incelenmiştir.Üçüncü bölümde ise; dört Mezhep ve Osmanlı uygulamasında uygulamada güncel problemlerle karşılaşılan vakıf mallarında vakıf hükmünün sona ermesiyle ilgili fakîhlerin görüşleri, mukayese edilecek bir şekilde değerlendirmeye tabi tutulmuştur. Ayrıca vakıf mallarında vakıf hükmünün sona ermesine sebep olan vakıftan yararlananların kalmaması (inkita'ı) ve yararlanma imkânı kalmayan (müstağna ânh) vakıfların durumuna çözüm bulmak için vakfın değiştirilmesi (istibdâl edilmesi) konusu ve hizmet etme imkânı kalmamış vakıf mallarının durumunu incelenerek ve tespit edilerek konu bitirilmiştir."
