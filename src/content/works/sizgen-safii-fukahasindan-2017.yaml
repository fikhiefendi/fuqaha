abstract: "Şâfiî fakihlerinden Râfiî el-Kazvînî, Horasânî ve Irâkî tarikleri cem ederek İmam Şâfiî'ye isnadı mümkün olmayan görüşleri ayıklaması bakımından müteahhir fukahâ tarafından ilk muharrir kabul edilmiştir. Bununla birlikte Râfiî el-Kazvînî, Şâfiî'nin usûl kaidelerini baz alıp yine Şâfiî'ye nisbeti mümkün olmayan şaz ve muhtelefun fih görüşleri inceleyerek (tenkih) kendi kanaatince mezhepte esah, ezhar ve sahih olan görüşleri Fethu'l-'Azîz fî Şerhi'l-Vecîz adlı eseri bağlamında kaleme alması neticesinde müteahhir fukahâ tarafından iki şeyhten biri olma (Şeyhan) ünvanına layık görülmüştür. Dolayısıyla Râfiî'nin fıkıhçılığı neticesinde kaleme aldığı eserlerde yer alan görüşler, İbn Hacer el-Heytemî ve Şemsüddîn er-Remlî başta olmak üzere son dönem fakihlerce tartışma konusu yapılmaması hususunda telkinlerde bulunmuşlardır."
