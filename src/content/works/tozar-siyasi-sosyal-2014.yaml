abstract: "Bu tezde Ebû Yûsuf'un (v. 182/798), Kitâbü'l-Harâc ve Ebû Ubeyd'in (v. 224/838), Kitâbü'l-Emvâl adlı eserlerinde verilen bilgiler siyasi ve sosyal tarihe kaynaklık etmesi yönüyle ele alınarak incelenmiştir. Genel de mâli hukuk alanında yazılmış eserler olarak karşılaştığımız harâc ve emvâl kitapları özellikle ilk dönem itibarıyla salt maliye hukuk sahasında bize bilgiler aktaran kaynaklar olmadığı tespit edilmiştir. Ebû Yûsuf'un“Kitâbü'l-Harâc”isimli eseri harâc kitapları arasında yazılmış günümüze ulaşan ilk eser olma niteliği taşımaktadır. Harûn Reşîd'in isteği üzerine kaleme alınan bu eser, maliye hukuk alanında yazılmış bir eser olmasına rağmen Ebû Yûsuf'un çeşitli konulardaki görüşlerine delillendirmek için Hz Peygamber ve sahabe dönemi uygulamalarından bahsetmektedir. Özellikle Hz Peygamber ve Hz. Ömer dönemi uygulamalarının yoğun bir şekilde işlendiği görülmüştür. Emvâl Kitaplarından birisi olan Ebû Ubeyd'in“Kitâbü'l-Emvâl”adlı eserinde Hz. Peygamberin çeşitli zamanlarda yazmış olduğu mektup ve anlaşmalar geniş bir şekilde yer almaktadır. Ayrıca kendi dönemine kadar olan siyasi ve sosyal olaylarla ilgili bilgiler de vermektedir. Bu iki eserin içerisinde dağınık bir halde bulunan bilgileri kronolik bir sıra içerisinde belli başlıklar altında toplayarak anlamlı bir bütün olamasın da çaba göstererek değerlendirdik."
