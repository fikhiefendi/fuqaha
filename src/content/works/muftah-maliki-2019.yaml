abstract: "Diğer mezheplerde olduğu gibi Maliki mezhebinde de İmam Mâlik'in vefatından sonra yeni meseleler ortaya çıkmış ve mezhebin temel kriterlerine göre bu meselelerin hükümlerini tespit etme ihtiyacı doğmuştur. Bu durum Maliki mezhebinin takipçilerini mezhebin temel metinlerini incelemeye sevk etmiştir. Tıpkı bir mezhebin oluşumunda Kur'ân ve Sünnet'in incelendiği gibi. Dört mezhep imamlarından sonra yapılan bu incelemeler neticesinde her mezhebin fetva verirken kullandığı ölçütler imkân nispetinde tespit edilmeye çalışılmıştır. Tespit edilen ölçütlere göre de karşılaşılan yeni meselelerin hükmü tayin edilmiş, bu işleme de tahric adı verilmiştir. Tahric asırlar boyunca mezheplerin takipçileri olan âlimler tarafından kullanılmış fonksiyonel bir faaliyettir. Diğer yandan bu faaliyet fıkhî içtihadın da bir dalı sayılmıştır. Özellikle Maliki mezhebinin tahric faaliyetine önem verdiği nevazil kitaplarından anlaşılmaktadır. Bu çalışma ilgili ehemmiyeti ortaya koymak amacıyla tahricin tanımlarını, tarihsel gelişimini, mezhepler ve tahric ilişkisini ve özellikle Malikî mezhebinde tahricin yerini kaleme alan bir çalışmadır."
