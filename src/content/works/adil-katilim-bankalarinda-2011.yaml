abstract: "İslam coğrafyasında ortaya çıkan ve halen ABD, Avrupa, Rusya, Uzak Doğu ülkelerinde de hızla gelişerek yaygınlaşan faizsiz bankacılık anlayışı Türkiye'de de 1984 yılından beri faaliyetlerine devam etmektedir. Şube sayılarını hızla arttırmalarına rağmen hala kamuoyunun katılım bankaları ile ilgili çok net bilgiye sahip olamadıkları gibi kesin bir yargıya da varamadıklarını söylemek yanlış olmayacaktır.BDDK'nın sitesinden elde edilen verilerden yola çıkarak Türkiye için çok daha hızlı bir şekilde gelişme potansiyeline sahip olan katılım bankalarının istenilen seviyede gelişim gösteremediği söylenebilir. Mevcut yapılanmanın Türkiye bankacılık potansiyelinin %5'ine ulaştığı tespitinden hareketle, katılım bankaları açısından hem tanıtım noktasında, hem de personel yapılanması noktasında bir problem olduğu öngörülebilir.Türk bankacılık sektörü 2010 yılı itibarıyla Türkiye Katılım Bankaları Birliğinin analizlerine göre %12 civarında büyüyecektir, buna karşın katılım bankalarının büyüme oranının %20?25 civarında olacağı öngörülmektedir. Türkiye'de faaliyet gösteren katılım bankalarının mevcut durumlarının doğru olarak algılanabilmesi ve potansiyellerinin değerlendirilebilmesi açısından personel eğitim politikalarının, verilen eğitimlerin hizmet kalitesine ve personelin algısına yansımalarının ve tüm bunlara bağlı olarak ortaya çıkan sonuçların bu bankaların bilinirliği üzerindeki etkilerinin incelenmesi bize nüfusunun %99'u Müslüman olan Türkiye'de bu bankaların bankacılık sistemi içerisinde neden %5'lik bir pay alabildiği ve halen yastık altında bekleyen ve ekonomiye kazandırılamayan yaklaşık 50 milyar Dolar hakkında daha sağlıklı bir yorum yapma şansını sağlayacaktır.Bu araştırmanın konusunu katılım bankası personel yapısı ve hizmet içi eğitim sürecinin banka çalışanlarının algısına etkisinin araştırılması oluşturmaktadır. Bu amaçla çalışmanın Birinci bölümünde katılım bankaları hakkında genel bilgiler verilmiştir. İkinci bölümde insan kaynakları ve hizmet içi eğitim süreci genel olarak açıklanmıştır. Üçüncü bölümde ise katılım bankacılığı kavramı genel hatlarıyla açıklanmıştır. Dördüncü ve son bölümde ise yirmi sorudan oluşan bir anket çalışması ile Ankara'da bulunan katılım bankaları arasından seçilen on altı banka şubesinde verilen hizmet içi eğitimlerin personel üzerindeki algısını ortaya koymak amaçlanmıştır. Tez çalışmasının bu kısmında anket çalışması ve sonuçlarının analizine yer verilmiş olup bu doğrultuda sonuç ve öneriler sunulmuştur."
