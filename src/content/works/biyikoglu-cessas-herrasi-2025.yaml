abstract: "Nesih, tefsir usûlünde önemli konulardan biridir. Zira neshin gerek Kur'ân'ın anlaşılmasında gerekse hüküm çıkarmada büyük ehemmiyet arz ettiği aşikârdır. Bu tezde Cessâs, Herrâsî ve İbnü'l-Arabî'nin ahkâm tefsirlerinden hareketle nesih hususuna dair yaklaşımları ele alınmıştır. Giriş bölümünde çalışmanın amacı, önemi, yöntemi, kapsam ve müracaat edilen kaynaklar zikredilmiştir. Birinci bölümde ise, teorik olarak mezkûr müfessirler bağlamında neshin tanımı ve anlam çerçevesi, konuluş hikmeti, imkânı, neshi kabul edenlerin delilleri, nesih ile ilişkili diğer kavramlar incelenmiştir. Yine bu bölümde üç müfessire göre neshin şartları, neshin hakikatine dair bazı yaklaşımları ayrıntılı olarak belirtilmiştir. İkinci bölümde ise Cessâs, Herrâsî ve İbnü'l-Arabî'nin nesih ile ilgili pratik uygulamaları ele alınmıştır. Onların bu uygulamaları, ibadetler, muamelat, cihâd ve barış hukuku, yasaklar ve cezalar (ukûbât) konularına dair örnekler ile izah edilmiştir. Sonuç olarak bu çalışmada zikredilen üç âlimin perspektifinden nesih meselesine yaklaşımları gözler önüne serilmiştir. Böylece mezkûr âlimlerin görüşleri incelenerek müntesibi oldukları Hanefî, Şâfiî ve Mâlikî fıkhî mezhepleri bağlamında nesih konusuna bakışları ortaya konmuştur."
