abstract: "ÖZET Bu çalışma, erken dönem temelinde fıkıh ve tasavvuf disiplinleri arasındaki ilişkiyi, teklif merkezli bir bakış açısıyla değerlendirmeyi amaçlamaktadır. Modern literatürde genellikle birbirinden bağımsız veya çatışmalı iki ayrı disiplin olarak ele alınan fıkıh ve tasavvuf, bu çalışmada şer'î teklif sisteminin iki tamamlayıcı yüzü olarak yeniden konumlandırılmaktadır. Bu kapsamda, fıkıh tanımlarında geçen amelî ve fer'î niteliklerin yalnızca dış fiillerle sınırlı kalmadığı; bilakis kalbî amellerin de aynı sorumluluk zemini içinde değerlendirilebileceği vurgulanmıştır. Çalışmada, klasik fıkıh tanımlarından sûfîlerin kalp merkezli sorumluluk anlayışlarına kadar geniş bir kaynak taraması yapılmış; niyet, ihlâs, takvâ, zühd, tevbe gibi kalbî fiillerin fıkhî ve tasavvufî bağlamda nasıl ele alındığı analiz edilmiştir. Fıkhın zâhirî hükümlerle sınırlı tutulmadığını, kalbin teklifin başladığı ilk alan kabul edildiğini vurgulayan yaklaşımlar, Ebû Hanîfe, (v. 150/767) Debûsî, (v. 430/1039) Serahsî (v. 483/1090 [?]) gibi fakihlerle Cüneyd-i Bağdâdî, (v. 297/909) Hâkim et-Tirmizî, (v. 320/932) Gazzâlî (v. 505/1111) gibi sûfîlerin metinlerinden hareketle temellendirilmiştir. Ayrıca ilmin türleri, bâtınî bilgi kaynakları, keşf ve ilhâm gibi kavramlar da teklifin epistemolojik boyutuyla ilişkilendirilmiş;“fıkh-ı bâtın”anlayışı klasik metinler üzerinden yeniden yapılandırılmıştır. Sonuç olarak, fıkıh ve tasavvufun birbirinden bağımsız disiplinler şeklinde ele alınamayacağı; zâhir ve bâtın boyutlarını birlikte içeren bütüncül bir teklif sistemine karşılık geldiği ortaya konmuştur."
