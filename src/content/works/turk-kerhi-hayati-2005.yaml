abstract: "02ET Bu çalışma, h. III. asırda yaşamış olan Ma'rûf-ı Kerhî'nin hayatı, tasavvuf! görüşleri ve onun için yazılan Menâkıbu Ma'rûf el-Kerhî isimli eserin tercüme ve değerlendirilmesinden oluşmaktadır. Ziihd dönemi ile tasavvuf dönemi arasında yaşayan Ma'rûf-ı Kerhî'nin görüşlerinde, her iki döneme ait izleri bulmak mümkün olduğu için, tasavvuf tarihi açısından son derece önemli bir safîdir. Tasavvufu, bir kavram olarak ilk defa tanımlamış, zühd hayatına ilişkin unsurları, marifet ve aşkla ilişkilendirmekle“marifet ve aşka dayalı”Bağdat tasavvuf ekolünün oluşmasına zemin hazırlamıştır. Tasavvuf! kavramlara yüklediği orjinal anlamlarla pek çok sûfiyi etkilemiş, mânevi eğitimde mürşid edinme, tevessül gibi tarikatların vazgeçilmez pratiklerinden ilk defa bahsetmiştir."
