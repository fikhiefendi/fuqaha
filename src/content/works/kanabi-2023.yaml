abstract: "Bu tez, içtihat ve hukukun her iki tarafından ticareti ve bunlarla ilgili koşulları, görevleri ve görgü kurallarını incelemeyi amaçlamaktadır. Ticaret, insanların geçim kaynağı olması nedeniyle insanların hayatında önemli bir yer tutmaktadır. Bu nedenle İslam dini bu konuyu ihmal etmemiş, aksine bu konuda uyulması gereken kurallar ve adaplar koymuştur. Kanun,“ticaret hukuku”adı verilen ticari konulara ayrılmış ayrı bir bölüm içerir ve Medeni Kanun ve diğer kanunlardan tamamen ayrıdır. Çalışmanın kapsamını Irak hukuku belirlemiş olup, İslam hukuku ve Irak hukukunda tacirin görevleri, tarihsel gelişimi ve ticaret koşullarının tartışılması üzerinde durulmuştur. Ayrıca, tüccarlar ve insanlar arasındaki ticaret yöntemleri ve tüccarların mesleki etiğe bağlılıkları da dâhil olmak üzere, İslam hukukunun kapsadığı ticaret hukukundaki boşluklar araştırılmıştır. Çalışmanın amacına ulaşabilmek için bilgi toplanırken ve onların analizleri yaparken tefsir, fıkıh, hadis ve İslam ekonomisi kitapları başta olmak üzere Irak hukuk kitaplarına başvurularak betimleyici, tümevarım ve analitik yöntemler uygulanmıştır. Araştırma konusuyla ilgili içtihat ve hukuktan elde edilen bilgiler de analiz edilmiştir. Çalışmamızda hem İslam şeriatının hem de Irak ticaret hukukunun ticarete büyük önem verdiği, toplumun çıkarlarını dikkate aldığı ve tüccarlara ticari çalışmalarına uygun şartlar ve görevler belirlediği sonucuna varılmıştır. Ahlaki konuların fıkıh ilminin önemli bir parçası olurken hukuktaki en büyük ilgisi ise formalitelerin etrafında döndüğü ortaya çıkmıştır. Bunun nedeni belki de İslam'daki bu idari işlemlerin asıl çözümün olduğu konular arasında sayılmasıdır. Bu tedbirler, insanların kendilerine zarar verme çıkarlarını dikkate almanın ötesine geçtiğinde, zararın önlenmesi amacıyla bu tedbirler yasaklanır. İslam hukukunun, ahlaki koşullar ve insanlara ve piyasaya karşı mali yükümlülüklere ilişkin titiz ticaret hukuku üzerindeki üstünlüğüne dikkat çekmektedir. Şeriat, dolandırıcılığın, istifçiliğin vb. yasaklanması gibi insanların çıkarına olan şeyleri ihmal etmemiştir. Irak ticaret kanunu aynı zamanda yurtiçi ve yurtdışındaki ekonomik faaliyetleri düzenlemek, tüccarın yetkilerini tanımlamak ve onu bilge kanun koyucunun onayladığı bazı şartlara bağlamak gibi olumlu avantajlarla da öne çıkmıştır. Ticaret hukuku, genel olarak, özellikle uygunluk ve reşit olma yaşı gibi hassas konularda şeriat kurallarına bağlı kalmaktaydı ve bunun nedeni, şeriatın Irak ticaret hukukunun vazgeçilmez bir kaynağı olmasıdır. Çalışmamızın sonunda ise ticaret işlemi düzenlemenin araçları gibi İslam şeriatının belirlediği yöntemlerine, kanunun şimdikinden daha fazla eklenmesi gerekliliği önerilmiştir."
