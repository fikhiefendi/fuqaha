abstract: "Bu çalışma, İslamiyet ile tanıştığı andan günümüze kadar Nijer Cumhuriyeti'nde klasik ve modern Kur'an çalışmalarının durumunu tanımlamayı amaçlamaktadır. Nijer halkının Kur'an-ı Kerim'i ve ilimlerini nasıl tahsil ettiklerini ve ve çocuklarına öğretmek için kullandıkları öğretim yöntemlerini tartışmaktadır. Çalışma, Fransız işgalinden sonra Nijer bölgesinde Kur'an eğitimi ve öğretiminde meydana gelen değişiklikleri göstermektedir. Nijer'de Kur'an-ı Kerim'i ve ilimlerini öğretme konusundaki bazı Nijerli alimlerin çabalarını, kitaplarını, yazılarını ve Kur'an-ı Kerim çalışmalarına özgü eğitim merkezlerini vurgulamaktadır. Bu araştırmada ayrıca Nijer'de Kur'an eğitiminin günümüzdeki gerçekliği de ele alınmakta, izlenen müfredat ve çalışma planlarından bahsedilmektedir. Ayrıca, bu çalışma Nijer'de Kur'an eğitimini düzenlemeyi amaçlayan kuruluşların çabalarını vurgulamakta ve bu bağlamda sunulan hizmetleri öne çıkarmaktadır. Araştırmacı, bu araştırma yolculuğu sırasında ulaştığı en dikkat çekici sonuçları açıklar ve Nijer'deki Kur'an çalışmalarının geliştirilmesine katkı sağlayabilecek öneriler sunar."
