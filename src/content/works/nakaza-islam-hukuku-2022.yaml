abstract: "İslam hukuku ilke olarak vahye dayalı bir hukuk sistemi olduğundan aynı zamanda merhamet ve hoşgörüye dayalı da bir hukuk sistemidir. Bu sebeple dünyanın her yerinde emniyet ve güvenliğin sağlanmasında aslında tüm hukuk sistemlerine örneklik teşkil edecek nitelikler taşır. Yüce Allah insanların gerek bireysel ve gerekse toplumsal olarak sosyal yaşamlarını şekillendirmek ve ayrıca bu kişilerin hem maddî hem de manevi yönden mutlu bir hayat sürmesi için düzenlemeler ve kanunlar koymuştur. İnsan hayatının diğer canlıların hayatlarına nazaran daha fazla kutsallığı ve yüceliği sebebiyle, İslami Dini insan hayatını yok etmeye yönelik her türlü saldırıyı yasakladığı gibi saldırıdan vazgeçmeyi hedefleyen veya büyük ölçüde sınırlayan etkili yasaklar koyar. Bunun yanında bir insanın hangi durumlarda öldürülebileceğine dair özel hükümler de getirir. Yüce Allah yaşama hakkının yüceliğinden bahisle, bazı haller dışında haddi aşarak insanları öldürenler hakkında kısası emretmiştir. Çünkü kısas, yaşama hakkını garanti altına alan özel bir hayat türüdür. Buna göre bir katil, cinayet suçunu işledikten sonra yaptığının cezasız kalmayacağını ve kendisinin de aynı şekilde cezalandırılacağını bilmesi, aslında onu ve toplumu bu tür suçlardan uzak tutar ve toplum da bu suçlardan kurtulur. Vahiyden uzak şekilde hazırlanan uluslararası hukuk metinlerinde de tür cezalar ve uygulamaların bulunması, İslam hukukuna olan inançlarından ve kabullerinden değil, insan ırkının yeryüzünde hayatta kalması konusundaki çabalarından dolayı olabilir. İslam hukukunda kısas her zaman ya da mutlak şekilde îfa edilmesi gereken bir uygulama değildir. Bunların arasında ihmal ve tedbirsizlik ve failinin dikkat etmemesi sonucu oluşan kasıtsız bir suç olması durumunda İslam Hukuku ve pozitif hukuk, insanları daha dikkatli olmaya ve davranışlarına itina göstermeye teşvik etmek maksadıyla daha düşük cezalar düzenlemiştir. Bu çalışmada, gücümüz nisbetinde cinayet suçuna ilişkin İslam Hukuku ile uluslararası hukuk arasında bir karşılaştırma yapılarak çeşitli sonuçlar elde edilmeye gayret edilmiştir. İslam hukukunun cezalandırmada temel hedeflerinden biri suç işleyeni ıslah etmek, ona doğruyu göstererek topluma yeniden kazandırmak, aksi halde toplumun refahını öncelemektir. İşte İslâm hukukunda kanun koyucusunun gayesi; ortaya çıkması arzu edilen bir fiile insanları teşvik ve ona gayret göstermeleri ve onun meşakkatini ve yükünü yüklemek olursa, o fiili yapmaya mükâfat ve o fiili sevmelerine bir iyi fırsat ortamı oluşturulmuş olur. Buna karşılık aykırı fiil, toplumun emniyetini ve topluluk düzenini ihlâl eden düşmanca suçlar kabilinden olursa, verilecek ceza da, aykırı bu fiilin gerektirdiği fiili yapmaktan caydıran, daha ağır bir ceza ile ıslah eden bir ceza olması gerekir. Öte yandan uluslararası hukukta da toplumda huzursuzluk çıkaranlar için farklı ülkelerde birbirine benzer cezaların uygulandığına şahit olunur. Özellikle insan neslini yavaş yavaş öldürmeyi ve yok etmeyi hedefleyen uyuşturucu veya uyarıcı madde temini ile bunları elde edebilmek için yağmalama, talan, hırsızlık vb. suçlar toplumdaki huzursuzluğu artırdığından yol kesme suçuna benzemektedir. Bunun sonucu olarak da uyuşturucu kullanımı ve buna aracılık yapılan her türlü fiile çeşitli oranlarda ceza verilmektedir. Hatta ilerleyen durumlarda bu suça ölüm cezası dahi uygulanmaktadır. Uluslararası arenada da bazı halkı Müslüman ülkelerde uygulanan ve İslam hukuku kaynaklı ölüm cezaları sürekli gündemde tutularak sanki ölüm cezası sadece İslam hukukunda varmış gibi algılarla İslam hukuku aleyhinde kampanyalar düzenlenmektedir. Bu çalışmada ele alınan konu, İslam hukuku ve uluslararası hukukta ölüm cezası verilen suç çeşitleri ve gerekçelerinin incelenerek İslam hukuku ile pozitif hukuk arasındaki irtibata dikkatler çekilerek, İslam hukuku hakkındaki olumsuz kampanyaların azaltılmasına bir nevi katkıda bulunmak olacaktır."
