abstract: "Günümüzde siyasal, toplumsal ve ekonomik alanda etkin bir konumda olan İslami sermaye/Anadolu sermayesi, belirli bir tarihsel dönemde ortaya çıkmıştır. İslami sermayenin gelişiminde önemli rol oynayan etkin örgütlenme biçiminin temelleri, Osmanlı İmparatorluğu dönemindeki Lonca ve Ahi Teşkilatı'na kadar uzanmaktadır. Böyle özel bir örgütlenme biçiminin yanında özellikle bu sermaye sınıfının 1980 sonrası dönemde iktidarla olan ilişkileri, büyümesine ve gelişimine yön vermiştir. Özellikle 1960-1980 arası dönemde sermaye birikimi, sermayenin kendine özel örgütlenme biçimi ve iktidarla olan yakın ilişkileri/işbirliği avantajından yararlanarak belirli bir büyüklüğe ulaşmıştır. 1980'lere doğru İslami burjuvazi sınıfı, İslami değerleri ön planda tutarak bir araya gelmiş ve aynı zamanda İstanbul sermayesinden farklılaşmaya başlamıştır. Bu dönemde İslami sermaye, etkin bir örgütlenme yoluna giderek, ekonomik alanda büyük İstanbul sermayesi karşısında güçlü bir rakip haline gelmiş görülmektedir. Türkiye'de sermaye birikim zorunluluğu, ister İslami sermaye sahiplerini ister büyük İstanbul sermayesi sahiplerini olsun, bir yandan farklı yatırım alanları arayışına diğer yandan da farklı güç odakları ile yakın ilişkiler kurmaya itmiştir. Bu süreçte bazı sermaye sahipleri iktidara yakın sermaye grupları içerisinde yer almış, bazıları sosyal ağlarını etkin bir şekilde kullanarak sermayelerini genişletmeye çaba göstermişlerdir. Üretici kısmı kendileri için uluslararası bağlantı ve pazar olanağı sağlayan cemaatlere yakın olan sermaye grupları içerisinde yer almışlardır. Çalışmada, Türkiye ekonomisinde özellikle de son dönemlerde etkin bir konuma ulaşan İslami Sermayenin Osmanlı'daki kökenleri, gelişim aşamaları ve tarihsel süreç çerçevesinde; birikim süreci, bir zorunluluk niteliğinde olan devlet ve siyasal güçler ile ilişkileri ve eylemleri ele alınmaya çalışılmıştır. Farklı tarihsel süreçlerde İslami Sermayenin gelişimi analiz edilirken, dönemlerin kendi içindeki toplumsal, tarihsel, kültürel, siyasal ve ekonomik koşulları da dikkate alınmıştır."
