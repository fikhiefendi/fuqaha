abstract: "Hanefî Mezhebinin dönem fıkıh literatürünün en önemli eserlerinden biri kabul edilen Burhâneddin el-Merginânî'nin el-Hidâye adlı eseri mukayeseli bir fıkıh kitabıdır. Çalışmanın temel amacı, el-Hidâye'de yer alan ve İmam Şâfiî'ye nispet edilen görüşleri sistematik bir şekilde ortaya konulması, bu isnatların klasik Şâfiî mezhebi kaynaklarıyla karşılaştırılarak ilmî açıdan değerlendirilmesi ve söz konusu isnatların doğruluk derecesinin tespit edilmesidir. Bu çerçevede tezde öncelikle Merginânî'nin ilmî şahsiyeti, fıkhî yöntemi ve el-Hidâye'nin telif süreci hakkında genel bir çerçeve sunulmuştur. Ardından eserde İmam Şâfiî'ye isnat edilen görüşler ibâdât ve muâmelât başta olmak üzere fıkhın temel alanları dikkate alınarak tasnif edilmiştir. Tespit edilen bu görüşler, İmam Şâfiî'nin kendi eserleri ile erken dönem Şâfiî fakihlerinin temel kaynakları ışığında incelenmiş; görüşlerin lafız, muhteva ve delil bakımından ne ölçüde örtüştüğü analiz edilmiştir. Böylece bazı görüşlerin doğrudan İmam Şâfiî'ye ait olduğu, bazılarının ise mezhep içi yorumlar veya sonraki Şâfiî fakihlerin tercihleri olabileceği ortaya konulmuştur. Merğinânî'nin atfettiği görüşlerin tespiti ve değerlendirilmesi amacıyla başta İmâm Şâfiî'nin el-Umm'u olmak üzere Şirbînî'nin Muğni'l-Muhtâc, Şîrâzî'nin el-Mühezzeb'i ve Şâfiî mezhebine ait birçok klasik kaynağa başvurulmuştur. Yapılan tespit ve tahliller neticesinde, Merğinânî'nin nispet ettiği görüşlerin 78'inde isabet etmediği sonucuna ulaşılmıştır. Çalışmamız, hem Hanefî literatürde Şâfiî görüşlerin sunuluş biçimine ışık tutmakta hem de mezhepler arası isnat meselesinin ilmî ölçütlerle ele alınmasına katkı sağlamayı amaçlamaktadır."
