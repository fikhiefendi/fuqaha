abstract: "Osmanlı Tarihi ile ilgili yerel çalısmalarda Ser`iyye Sicilleri birinci el kaynak olma özelligine sahiptir. Bu çalısma Tokat sehrinin 18.yy. son çeyregine ısık tutmak ve 18.yy.'ın sonunda Tokat'ın siyasal, sosyal, ekonomik ve kültürel durumunun aydınlatılmasına katkıda bulunmak amacıyla hazırlanmıstır. Bu çalısmada 1797-1798 Yılları Tokat Ser`iyye Sicilinin tam transkripsiyonu, özeti ve belgelerin sosyal ve ekonomik yönden degerlendirilmesi yapılmıstır. ncelenen kısımda 292 kayıt bulunmaktadır. 1797?1798 tarihleri arasında tutulan bu kayıtlar; tereke tespit ve taksim hücceti, satıs ilamı, izinnameler, vekâlet, nafaka, alacak dâvâları, verâset ve vekâlet dâvâlarından olusmaktadır. Bunlar içinde verâset dâvâları çogunluktadır."
