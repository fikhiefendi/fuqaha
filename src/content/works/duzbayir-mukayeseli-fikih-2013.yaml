abstract: "Tarih incelendiği zaman, hemen hemen tüm toplumlarda, farklı şekillerde de olsa kurbanın varlığına rastlanmaktadır. Kurban, tarihi itibariyle Hz. Adem?e kadar uzanan bir ibadettir. Bu ibadet, Müslümanlar arasında da Allah?a yakınlaşma amacıyla ifa edilmektedir. Mezhepler penceresinden kurban ibadetinin hükmüne baktığımız zaman farklı hükümlerin olduğunu ve âlimlerin kurban ibadetinin hükmü konusunda ihtilaf ettiklerini görmekteyiz. Özellikle ihtilafın bir cephesinde Hanefi alimlerin bir çoğu dururken, diğer cephede cumhur alimler bulunmaktadır. Müslümanlar arasında bir kesimin kurban ibadetinin ifasına oldukça önem vermesi, diğer bir kesimin ise ilgili ibadetin ifası hususunda aynı ehemmiyeti göstermemesini, bu ihtilafın pratik hayata yansıması olarak kabul edebiliriz. Hanefiler bu ibadetin hükmü konusunda vacip kavramını kullanırlarken, cumhur ulema ise müekked sünnet tabirini kullanmaktadırlar. Bu ihtilafın bir nebze de olsa giderilmesi adına, hükmü konusundaki tarafların delillerinin iyi tahlil edilmesi gerekmektedir. Özellikle bu konuda başta ayetlerin, ardından da Hz. Peygamberin fiili uygulamasının incelenmesinin önemi büyüktür. Çalışmamızda öncelikle kurban ibadeti ile ilgili delil alınan Kevser suresinin 2. ayetini ayrıntılı bir şekilde inceledik. Akabinde delil alınan rivayetler hakkında İslam alimlerinin görüşlerine yer vermeye çalıştık."
