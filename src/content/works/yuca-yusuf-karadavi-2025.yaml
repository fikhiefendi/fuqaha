abstract: "İslâm hukuku ve toplumsal değişim bağlamında Yusuf el-Karadâvî'nin İslâm Aile Hukukuna Yaklaşımını ele alan bu çalışma, onun evlilik, boşanma, aile yapısı ve cinsiyet rolleri üzerine görüşlerini kapsamlı bir şekilde analiz etmektedir. Karadâvî'nin fikirlerinin, İslâm hukukunun modern dünyadaki uygulanabilirliği ve esnekliği üzerindeki etkileri değerlendirilmektedir. Araştırmanın temel problemi, Karadâvî'nin İslâm Aile Hukukuna dair yaklaşımlarının, değişen toplumsal yapılar karşısında nasıl bir çözüm sunduğunu ve İslâm hukukunun çağdaş meselelerle nasıl uyum sağlayabileceğini ortaya koymaktır. Çalışma, Karadâvî'nin eserleri ve ilgili akademik literatür aracılığıyla, onun aile hukuku çerçevesinde sunduğu yorumları incelerken, bu yorumların günümüz toplumlarındaki hukuki ve sosyal dönüşümlerle ilişkisini değerlendirmeyi amaçlamaktadır. Tez, giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde, Karadâvî'nin hayatı, akademik çalışmaları ve ilmî mirası ele alınmaktadır. Birinci bölümde, İslâm aile hukukunda evlilik ve boşanma konuları incelenirken, ikinci bölümde Karadâvî'nin evlenme ile ilgili hükümler konusundaki yaklaşımları ayrıntılı olarak analiz edilmektedir. Çalışmanın sonuçları, İslâm hukukunun çağdaş meselelere nasıl adapte edilebileceğine dair önemli bir bakış sunarak, bu alandaki akademik tartışmalara katkıda bulunmaktadır."
