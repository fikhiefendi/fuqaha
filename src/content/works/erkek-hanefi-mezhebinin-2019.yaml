abstract: "İçinde bulunduğumuz asrın en büyük sorunlarından biri, ilimden uzak bazı kimselerin, İmam Ebû Hanîfe ve öğrencileri tarafından ortaya konan Hanefî fıkıh ekolünün furû kısmının, Hadis ve Sünnet temelli olduğunu görmezden gelmeye, tarihi bir gerçeği yok saymaya çalışmalarıdır. Bu kimseler, birtakım iftira ve bühtanlarla İmam Ebû Hanîfe'ye ve Hanefî mezhebine dil uzatmışlar; Hanefî fukahâsının fetvalarında Kur'ân ve sahih Sünnet'ten elde edilen sağlam delillere ve kanıtlara istinat etmediklerini,“zayıf rivâyetlerle”ihticac ettiklerini iddia etmişlerdir. Onları bu yanlış iddiaya götüren, Hanefîlerin dayandıkları usûl ve kâideler konusundaki cehâletleridir. İmam Ebû Hanîfe'nin sahih hadisler karşısındaki tavrı, selef âlimlerinin zemmettiği ehl-i re'yden olmadığını ispat etmektedir. Hüküm verirken Hadis ve Sünneti aslî bir kaynak olarak kabul etme bakımından, onun diğer müçtehidlerden farklı olmadığı inkâr edilemez bir gerçektir. Biz bu tezimizde, Hanefî mezhebinin diğer üç mezhebin (Mâlikî, Şâfiî, Hanbelî) fıkhî görüşlerine muhalif olarak ortaya koyduğu hükümlerde kullandığı hadisleri, Hindistan'lı Hanefî âlim Zafer Ahmed el-Osmânî et-Tânevî/Tehânevî'nin (1394/1974)“İ'lâü's-Sünen”adlı eserinden“Kitâbü'l-Hacc”bölümünü incelemek suretiyle tespit etmeyi hedefledik. İslâm'ın beş şartından biri olan Hacc ibadetine dair detaylı hükümlerde Hanefî fakihlerinin delil olarak aldıkları hadislerin kaynaklarını,“İ'lâü's-Sünen”den hareketle ortaya koymaya çalıştık. Hanefîlerin -bir örnek olarak- Hacc gibi önemli bir konudaki nebevî dayanaklarını araştırarak, yukarıda sözü edilen iddia ve isnatların doğru olmadığını; delilleriyle ispata gayret ettik. Bu çerçevede, Tânevî'nin tahric ettiği rivâyetlerin yer aldığı başta Kütüb-i Tis'a olmak üzere diğer hadis kitaplarındaki ilgili yerleri tespit ettik; bu rivâyetler üzerinde Hanefî mezhebinin önde gelen imamlarının hadis tenkîdi kriterlerini esas alarak değerlendirmeler yaptık. Hacc ahkâmı bağlamında, dört mezhebin birbirlerine tenkit yöneltirken hangi konular üzerinde yoğunlaştıkları, aralarındaki muhalefetin sebep ve gerekçelerini incelemeye çalıştık. Günümüzde Hacc menâsikinin ne şekilde gerçekleştirildiği, mevcut uygulamalar ile çalışmamızda ele alınan hadislerin birbiriyle ne derece örtüştüğü araştırılmış; karşılaşılan bazı güncel problemlerin giderilmesi için çözüm önerileri sunulmuştur."
