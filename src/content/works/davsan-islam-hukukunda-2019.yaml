abstract: "Birçok amaca matuf olarak insanoğlunun istifadesi için yaratılmış olan hayvanlar bazen arzu edilmeyen zarara, malî ve bedeni kayıplara sebep teşkil edebilmektedir. Bu tezde hayvanların verdiği zararlarda hukukî mes'ûliyetin nasıl teşekkül edeceği, hukukî mes'ûliyet için aranan şartlar, hayvanların türlerine göre meydana gelen zararlar, zararın karşılanması için öngörülen tazmin sebepleri ve tazminat şekilleri İslam hukuku açısından incelenmiş, günümüzde karşılaşılan sorunlara cevaplar aranmıştır. Özellikle kamu tüzel kişiliğinin sorumluluk alanında bulunan sahipsiz hayvanların zararlarındaki mes'ûliyet fikri ile ilgili yeni yaklaşımlar ortaya koymaya çalışılmıştır. Çalışmamızda klasik fıkıh kitaplarının yanında, modern fıkıh çalışmalarından ve güncel meseleler incelenirken hukuk teorilerinden ve mevzû hukuktan yararlanılmıştır. İslam hukukunda“Hayvanların verdiği zarar hederdir”kaidesi genel bir prensip olarak belirtilmiştir. Bununla birlikte hayvanın zarar vermesine sebep olma, telef veya cinâyeti hayvan aracılığı ile kasten yapma, hayvanın bakım ve gözetimi konusunda kusurlu davranma gibi hallerden dolayı hayvanlar tarafından verilen zararlarda, hayvan üzerinde fiili egemenliğe sahip olanın tazminat ödeyeceği konusunda görüş birliği vardır. İslam hukukunda üçüncü kişilerin ya da mağdur tarafın ürkütme, korkutma, kapıyı açma, engel koyma, zararı def etmede ihmalkâr davranması gibi sebep fiilleri neticesinde meydana gelen zararlarda mes'ûliyetin, hayvan sahipleri ile mağdur taraf arasında karşılıklı olarak paylaştırılması öngörülmüştür. Çevreleri için aşırı derecede tehlike arz eden saldırgan hayvanların bireysel olarak barındırılmaları, hukuka aykırılık olarak kabul edilmiştir. Tepme, süsme, ısırma ve benzeri şekillerde zarar verme potansiyeline sahip olan hayvanlar ile başta ekili araziler olmak üzere cana ve mala zarar verdiği çevrece bilinen her türlü hayvanların da sahipleri tarafından gece ve gündüz bakım ve muhafazasının yapılması gerektiği İslam hukukçuları tarafından belirtilmiştir."
