abstract: "Ortadoğu'da yaşanan hadiseler tarihin her döneminde dünyayı etkilemiş hadiselerdir. Hz. Peygamber'in vefatının ardından, kısa bir süre içerisinde Müslümanlar Fas'tan Orta Asya'ya kadar geniş bir coğrafyaya hâkim olarak İslam dinini buralara ulaştırdılar. Bunun sonucunda İslam dini siyasi ve kültürel anlamda farklı yaşam biçimleriyle ve toplumlarla karşı karşıya geldi. Bu farklı kültürlerin bilgi birikimleri, Kur'an ve Sünnet'e yönelik yeni yaklaşımları ve yorumları ortaya çıkardı. Bu yorumların sistemleşmiş şekilleri olarak mezhepler ortaya çıktı. Çalışmamız, giriş ile birlikte üç bölümden oluşmaktadır. Giriş bölümünde araştırmamızın önem ve amacı, metot ve kaynaklar hakkında bilgi verilmiş; Ortadoğu coğrafyasının dinî ve mezhebî açılardan önemi ile Hz. Peygamber'den günümüze Ortadoğu'da mezhep hareketleri ele alınmıştır. Birinci bölümde, Türkiye örneğinden hareketle ülkemizde Sünnîliğin arkaplanı ve gelişimi, günümüz Türkiye'sinde önemli bir kurum olan Diyanet İşleri Başkanlığı ve bu çerçevede özellikle Alevilik meselesi ile Caferîler'e yönelik yaklaşımları incelenmiştir. İkinci bölümde, İran örneğinden hareketle Şîîliğin tarihsel arkaplanı ve gelişimi, Velâyet-i Fakîh doktrini ve bunun İran/Şîî toplumuna yönelik etkileri ile İran'da diğer mezheplere yönelik bakış ve uygulamalar örneklerle ortaya koyulmuştur. Son bölümde ise Suudi Arabistan örneğinden hareketle Vehhâbîliğin tarihsel arkaplanı ve gelişimi ile ülkedeki mezhep politikaları, diğer mezheplere yönelik bakış ve uygulamalar değişik örneklerle ele alınmıştır."
