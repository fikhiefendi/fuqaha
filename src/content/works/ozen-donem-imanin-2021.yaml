abstract: "İman, İslâm düşüncesinde en önemli kavramların başında gelmektedir. Din, iman ile başlamakta ve onunla birlikte anlam kazanmaktadır. İman kavramının önemine binaen imanın ne olduğu münakaşalarını ilk dönemlerden itibaren görülmüştür. Mâhiyeti itibarıyla somut ve evrensel bir karşılığı bulunmaması ona farklı anlamlar yüklenilmesini kaçınılmaz kılmaktadır. İlk dönemlerde iman kavramına yüklenen anlamlar Kitâbu'l-İman başlığı altında neşr edilmiştir. Bu eserler incelendiğinde İslâm düşünce tarihinde iman kavramına yüklenen anlamlar gün yüzüne çıkmaktadır. Bu çalışmada ilk dönem imanın mahiyeti tartışmaları Zeyd b. Ali, Ebû Hanîfe ve Kâsım b. Sellâm'ın risâleleri ışığında ele alınmıştır. Giriş kısmında öncelikle imanın mâhiyeti hakkında yapılan tartışmaların tarihçesine yer verilmektedir. Akabinde ilk dönem âlimleri arasında yer alan, fikrî yaklaşımlarıyla gerek geçmişte gerekse günümüzde insanlığa ışık tutan Zeyd b. Ali, Ebû Hanîfe ve Kâsım b. Sellâm'ın hayatı ve ilmî kişiliklerine değinilmiştir. Birinci bölümde imanın kavramsal tahlili yapılarak imanın mâhiyetine dair İslâm düşüncesindeki yaklaşımlara yer verilmektedir. İkinci bölümde ise kronolojik olarak bu âlimlerin iman nazariyeleri geniş çaplı olarak ele alınmaktadır."
