abstract: "Endülüslü İslam bilgini İbn Hazm, fıkıh, usul, hadis, kelam, felsefe, tarih ve edebiyat gibi birçok alanda eserler vermiş çok yönlü ve üretken bir müelliftir. Zahirîlik mezhebinin ikinci kurucusu ve en büyük temsilcisi olarak kabul edilen İbn Hazm, mezhepler tarihi alanında da öne çıkmaktadır. Devletin en üst kademelerinde görev alması ve Endülüs'ün çalkantılı yıllarına şahit olması, onun görüşlerinin ne derecede önemli olduğunu ortaya koymaktadır. Dinler tarihi, İslam mezhepleri ve kelama dair el-Fasl adlı eserinde, Ehl-i Sünnet'i etkileyen Mürcie mezhebini de incelemiştir. Bu bağlamda İbn Hazm'ın barış ve uzlaşma yanlısı olarak değerlendirilen Mürcie hakkındaki görüşleri oldukça önemlidir. Zira devletinin yıkılış döneminde Endülüs, memalik yönetimlerine teslim olmuştur. Başka bir ifade ile parçalanmış bir devlet düzeni içerisinde İslam mezhepleri konusundaki görüşler değerli kabul edilmelidir. İbn Hazm İslam'ın on birinci asrında Endülüs'te bulunan ve bulunmayan mezheplerle ilgili tahlil ve değerlendirme yapmıştır. Doğu'ya hiç seyahat etmemiş olan İbn Hazm'ın, daha çok mevali arasında yayılmış bulunan Mürcie hakkındaki görüşleri merak konusudur. Bu çerçevede farklı etnik unsurların bir arada yaşadığı Endülüs'te Arap olmayan Müslümanlar arasındaki durum da önemli bir konudur. Barış ve toleransa en çok muhtaç olunan bir dönemde İbn Hazm'ın özellikle iman ve küfür tanımlamalarında Mürcî görüşlerden etkilenip etkilenmediği bu araştırmada ortaya konulacaktır. Ayrıca araştırmayı önemli kılan bir diğer husus, İbn Hazm'ın Zahiri bir bilgin olarak diğer mezheplere ve bu bağlamda Mürcie'ye bakışı ortaya koymasıdır. Bu konuda öncelikle bizzat İbn Hazm'ın kendi eserleri, ikinci olarak yerli ve yabancı araştırma kaynakları değerlendirilecektir. Bu çerçevede en önemli kaynağımız, el-Fasl fil Milel ve'n-Nihal adlı eseri olacaktır."
