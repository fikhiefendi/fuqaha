abstract: "Çalışmanın amacı eşyaya bağlı ayni hakları ve hükümlerini incelemektir. Eşyaya bağlı ayni hak kavramı ayni hakların sahibini belirlemede kullanılan bir ölçüttür. Buna göre iki ayrı taşınmazdan birisi üzerindeki ayni hak sahibi diğeri üzerindeki mülkiyet vasıtasıyla belirlenecektir. İki ayrı taşınmazın varlığı ortaya başkaca soruların varlığını gerektirmektedir. Zira birisi üzerindeki hakkın niteliği, kapsamı ve hükümleri diğer hak sahiplerinin haklarına zarar vermemesi gerekir. Bu sebeple çalışmada eşyaya bağlı bir şekilde kurulan mülkiyet, irtifak ve taşınmaz yükleri ele alınmıştır. Bu kavramlar açıklanmış ve hükümleri incelenmiştir. Bu bakımdan eşyaya bağlı mülkiyette malikin tasarruf yetkisini kullanması sonucunda taşınmazlarda oluşabilecek değişikliklere ayrıca dikkat çekilmiştir. Bundan başka eşyaya bağlı irtifakta hakkın kapsamı ve kullanılması ile ilgili hükümler incelenmiştir. Sonuç bölümünde ise çalışmada sorulan sorulara çözüm önerileri getirilmiştir. Eserin yazılma sürecinde yargı kararlarından, doktrinden ve karşılaştırmalı hukuktan faydalanılmıştır. Böylelikle bu eserle eşyaya bağlı ayni hak kavramı ve hükümleri aydınlatılıp hukuk literatürüne katkıda bulunulması amaçlanmıştır."
