abstract: "Bu tez, 2022 yılında Kuveyt Finans Evi (KFH) ile Ahli United Bank (AUB) arasında gerçekleşen birleşmenin ekonomik ve finansal etkilerini incelemeyi amaçlamaktadır. Çalışmanın amacı, bu birleşmenin İslami bankacılık sektöründe finansal performans üzerindeki etkilerini ölçmek ve bu etkilerin istatistiksel olarak anlamlı olup olmadığını ortaya koymaktır. Araştırmada nicel karşılaştırmalı yöntem kullanılmış; birleşme öncesi ve sonrası dönemlere ait finansal veriler KFH ve AUB'nin yıllık faaliyet raporlarından elde edilmiştir. Analiz edilen temel finansal göstergeler arasında Varlık Karlılığı (ROA), Özsermaye Karlılığı (ROE), Hisse Başına Kazanç (EPS), Sermaye Yeterlilik Oranı (CAR) ve Toplam Borç / Varlık oranı yer almaktadır. Bu göstergeler aracılığıyla bankaların birleşme öncesi ve sonrası performansları değerlendirilmiştir. İstatistiksel analizde Shapiro-Wilk normallik testi ve Wilcoxon işaretli sıralar testi uygulanmıştır. Sonuçlar, birleşme sonrası finansal oranlarda genel bir iyileşme olduğunu ancak bu değişimlerin istatistiksel olarak anlamlı olmadığını göstermiştir (p > 0.05). Bununla birlikte, gözlemlenen iyileşmeler ekonomik olarak anlamlıdır. Ayrıca çalışmada, Şeriat uyumluluğu ve kurumsal sinerji gibi unsurların birleşme sürecine etkisi de değerlendirilmiş ve bu birleşmenin Kuveyt'teki İslami bankacılık yapısına stratejik katkılar sunduğu sonucuna varılmıştır. Bu tez, İslami finans alanındaki birleşmelerle ilgili literatüre özgün bir katkı sağlamakta ve politika yapıcılar için önemli çıkarımlar sunmaktadır."
