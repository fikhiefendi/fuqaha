abstract: "Faizsiz finans, İslami finans esasları doğrultusunda faaliyetleri içeren, konvansiyonel finansta kullanılmayan, kendine özgü finansman yöntemleri ile fon sahiplerinin tercih edebileceği bir alternatif finans sistemi olarak tanımlanabilir. Türkiye Katılım Bankaları Birliğinin 2021-2025 Katılım Bankacılığı Strateji Güncelleme Raporuna göre dünyada Faizsiz Finans sektörünün aktif büyüklüğü bugün 2,2 trilyon ABD doları hacmindedir ve 2025 yılında 3,5 trilyon ABD dolarına ulaşması beklenmektedir. Gittikçe büyüyen faizsiz finans piyasası gerek ulusal gerek uluslararası yatırımcıların ilgisini çekmektedir. Bu bağlamda Türkiye'de de 2019 yılı Cumhurbaşkanlığı Yıllık Programında belirlenen hedefler doğrultusunda İslami Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu (AAOIFI) tarafından yayımlanan Faizsiz Finans Muhasebe Standartları, Türkiye Kamu Gözetimi Kurumu tarafından tercüme edilerek 2020 Ocak ayından itibaren mevzuatımıza kazandırılmış ve katılım bankalarının opsiyonel olarak kullanımına sunulmuştur. Faizsiz finans alanında uygulanacak yeni faizsiz finans muhasebe standartlarının, bu alanda fonlarını Türkiye'de değerlendirmek isteyen yatırımcılara güven vereceği ve yeni düzenlemeyle katılım bankalarının işlem hacminin artması beklenmektedir ve Türk bankacılık sistemi içerisinde, katılım bankalarının kendi faaliyet alanlarına ilişkin işlemlerini finansal raporlarına alırken, Uluslararası İslami finans esaslarına göre raporlama yapmaları hedeflenmektedir. Bu çalışmada, yeni faizsiz finans muhasebe standartlarının açıklanması amaçlanmış ve Türk bankacılık sistemi içerisinde uygulanabilirliğinin mümkün olup/olmadığı değerlendirilip, standartların uyumu için öneriler sunulmuştur."
