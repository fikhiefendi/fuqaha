abstract: "Yurtiçinde ve yurtdışında yaşayan çok sayıda insan faiz ve türevlerinden uzak durmak istemekte, bu nedenle de klasik bankalara gitmemekte, klasik bankaların finansal yatırım araçlarından uzak durmaktadır. Bu durum yüksek miktarda fonların âtıl kalmasına ve ekonomide ciddi bir kaybın oluşmasına sebep olmaktadır. Faiz hassasiyeti nedeniyle oluşan âtıl tasarrufları hem ekonomiye dâhil etmek hem de bu tasarrufları faizsiz enstrümanlarla değerlendirmelerine olanak sağlamak amacıyla 1984 yılında Türkiye' de ilk adımlar atılarak ilk faizsiz finans kurumu kurulmuştur. Dünyada ve özellikle İslam ülkelerinde örnekleri çok daha erken görülen en önemli faizsiz yatırım araçlarından olan Sukuk da yine bu amaçla ortaya çıkmış, faizsiz bir finansal piyasa enstrümanı olarak yurt içinde 2010 yılında ilk ihracını gerçekleştirmiştir. Ülkemizdeki adı kira sertifikası olan bu ürün, giderek yatırım araçları içindeki hacmini arttırmakta, duyulan talep sebebiyle kamu ve özel sektör tarafından bir hayli rağbet görmektedir. Yaptığımız bu çalışmada Türkiye' de katılım bankacılığının gelişimi tarihsel sürecinden başlayarak ele alınmış, katılım bankalarının ürün ve hizmetlerine detaylı olarak değinilmiş, Türkiye açısından getirdiği yenilikler ve avantajlarından bahsedilmiştir. Sonrasında bir finansman sağlama aracı olan sukukun türleri ve işleyişi irdelenmiş, diğer menkul kıymetlerle kıyas edilmiş, sukukun Türkiye' deki uygulaması olan kira sertifikalarına kapsamlı bir giriş yapılmıştır. Çalışmanın sonunda kira sertifikalarının Türkiye' de ulaştığı hacimsel rakamlar ele alınarak ve bu ürünün ülkemizde daha da gelişmesi için önerilerde bulunulmuştur."
