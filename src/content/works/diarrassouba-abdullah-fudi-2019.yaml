abstract: "Bu tez çalışması, Abdullah İbn-i Fudi'nin hayatını, doğumunu, yazdığı bazı eserleri ve tefsirin yöntemini anlatmaya çalışmıştır. Girişte tezin hedefi, amacı, daha önce yapılmış olan çalışmalar, araştırmanın kaynakları ve müellifin kullandığı kaynakları hakkında bilgi verilmiştir. Birinci bölümde İlk olarak Nijerya hakkında genel olarak bilgi verilmektedir. İkinci olarak müellifin hayatı, İslâm üzerine bazı çalışmaları ve incelenmiştir. İkinci bölümde ise Abdullah ibn-i Fudi'nin“Ziyaü't-Te'vil Fi Meani't Tenzil”isimli tefsirindeki rivayet tefsiri ve Kur'an ilimlerindeki metodunun değerlendirmesi sunulmuş ayrıca Abdullah ibn-i Fudi'ninfıkhı tefsir metodu ve fıkhî ilimleri örneğin, taharet kitabı, namaz kitabı, ahval-i şahsiyyet fıkhı, miras, muamelat fıkhı, haddler analizi kullanılmıştır."
