abstract: "Hanefî mezhebinin kurucu metinleri içerisinde yer alan el-Câmiu's-sağîr, kısa olmasıyla birlikte mezhebin ilk ve en hacimli kitabı olan el-Asl'a dikkate değer katkılar sunmaktadır. Bu katkıların izini sürmek amacıyla gerçekleşen bu araştırmada, el-Câmiu's-sağîr'de yer alan meseleler el-Asl ile mukayese edilerek üçlü bir tasnife tabi tutulmuştur. el-Asl'da yer almayan el-Câmiu's-sağîr meselelerini konu edinen birinci bölümde, kimi el-Câmiu's-sağîr meseleleri için şerhlerde zikredilen“havâss”nitelemeleri ayıklanarak el-Asl'da bulunmayan 134 meselenin tespiti yapılmıştır. İkinci bölümde, iki kitabın meseleleri karşılaştırılarak telif zamanı daha geç olan el-Câmiu's-sağîr'in el-Asl'ın anlaşılmasına yönelik muhtelif katkılar sunan 74 mesele zikredilmiştir. Üçüncü bölümde de, el-Câmiu's-sağîr'de farklı bir hükümle zikredilen 20 meseleye yer verilmiş ve fıkıh kitaplarında daha sahih olduğu vurgulanan görüşe işaret edilmiştir. Böylece iki zâhiru'r-rivâye eseri arasındaki ilişkinin boyutları ortaya konularak ilk fıkıh mezhebinin ortaya çıkış dönemindeki literatürünün anlaşılmasına bir katkı sağlanması hedeflenmektedir."
