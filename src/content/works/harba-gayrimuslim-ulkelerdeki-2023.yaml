abstract: "Gayrimüslim Ülkelerdeki Müslüman Mültecilerin Hak ve Sorumluluklarının İslam Hukuku Açısından Tahlili (İsveç Örneği) Bu çalışmanın temel konusu, bazı Müslümanların koşullarını iyice araştırmadan, dinî ve kültürel değerleriyle örtüşmeyen ve çocuklarını İslami prensip ve değerlerle yetiştirmekte zorluk yaşayacakları gayrimüslim ülkelerin sığınmalarıdır. Bu ülkelerin bazı yasaları hem İslam hukuku ile çelişmekte ve hem de Birleşmiş Milletler Mültecilerin Hakları Sözleşmesi'ne uymamaktadır. Ayrıca bu yasalar, genellikle evrensel insan hakları standartlarına da aykırıdır. Bu nedenle Müslüman mülteciler, İslami ve dinî eğitim haklarından mahrum kalmakta ve dinî görevlerini yerine getirmek ile yasal sorumluluklarını yerine getirme arasında bir ikilem yaşamaktadırlar. Bu araştırmanın amacı, İsveç tarafından çıkarılan özel hayata müdahale bağlamında bazı suçlarla ilgili hukuki düzenlemelerin mülteci hakları ve evrensel insan haklarıyla uyumsuzluğunu analiz etmek ve bu yasaların İslam hukukuyla uyumunu incelemektir. Bu bağlamda araştırma, bilimsel bir katkı sağlayarak farkındalık yaratmayı ve ortak bir anlayış geliştirmeyi amaçlamaktadır. Araştırma, nitel bir yöntem kullanmakla birlikte analitik ve karşılaştırmalı yöntemlere de başvurmuştur. Çalışmamızda ulaşılan sonuçlara göre; Müslümanların yaşamında asıl olan, İslam diyarında yaşamaktır ve zorunlu olmadıkça gayrimüslim diyarlarda ikamet etmemektir. Ancak bazı Müslüman ülkelerde zulmün hüküm sürdüğü durumlarda birçok Müslüman zulümden kaçmak ve dinî inançlarını korumak amacıyla gayrimüslim ülkelere sığınmak zorunda kalmıştır. Bu durum, zaruret hükmünü alır ve muzdar durumda olanların hükümlerine tâbi tutulur. Allah Teâlâ, zulme maruz kalmış veya dinlerini koruma amacıyla göç etmek zorunda kalan zayıf kulları için hicreti ve sığınmayı meşru kılmıştır. Müslümanın gayrimüslim ülkelere sığınması, maslahatların korunması, mefsedetlerin def edilmesi yani din, soy ve ailenin korunmasıyla ilişkilidir. Bu durum, gayrimüslim ülkelerde yaşayan Müslümanların güvenliklerini sağlama, dinî inançlarını koruma ve temel hayati çıkarlarını muhafaza etme gayretinin bir yansımasıdır. İslam hukukundaki gayrimüslim ülkelere sığınma ruhsatı, tüm ülkeler için sabit ve kesin hükümler içermemektedir. Bunun yerine, sığınılan ülkelerinin her birinin durumlarına bağlı olarak vacip, mustehap, mübah, mekruh veya haram olarak belirlenir. Bu hükümler, ilgili ülkelerin mevcut yasalarına ve bu yasaların zarûrât-ı hamse idealini gerçekleştirmeye uygun olup olmamasına göre belirlenir. Bu, Müslüman mültecilerin bulundukları ülkelerdeki hukuki durumlarını anlamak ve ona göre hareket etmek adına önemli bir faktördür. Müslümanların, sığınacakları ülkenin yasalarını incelemeleri ve bu yasaların Müslüman mültecilerin haklarıyla uyumlu olduğundan emin olmaları gerekmektedir. Ayrıca bu ülkelerde dinî özgürlüğün sağlandığından ve bu sayede mültecilerin zarûrât-ı hamse (Din, Can, Akıl, Nesil ve Mal) idealini koruyabilecekleri konusunda zann-ı galip sahibi olmaları önemlidir. Bu, mültecilerin, çocuklarını İslami değerlerle yetiştirebilmeleri ve kendi dini inançlarını özgürce yaşayabilmeleri adına kritik bir unsurdur. Bu sonuçlar, mücadele ve zorunlu durumlar bağlamında İslam hukuku ve mülteci hakları açısından çeşitli hükümlerin ortaya çıkabileceğini göstermektedir. Ayrıca bu durumların İslam'ın esas değerleriyle uyumlu hale getirilip getirilemeyeceği konusunda daha fazla bilinç oluşturmak gerekir."
