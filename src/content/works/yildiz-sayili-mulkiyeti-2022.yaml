abstract: "Kat mülkiyeti, günümüzde önem arz eden bir kurumdur. Kat Mülkiyeti, şehirleşme ve nüfus yoğunluğunun artmasıyla dikey yapılaşmanın oluşturduğu sorunlara çözüm olarak getirilmiş özel bir mülkiyet türüdür. Bu kurum, tarihte birçok hukuk sisteminde ihtiyaç duyulan bir uygulama olmuş ve bu sebeple kendisine yer bulmuş bir kurumdur. Günümüzde ise ekonomik zorluklar, şehirlere göçler, konut sıkıntıları gibi sebeplerle bu kurumun önem derecesi artmıştır. Ülkemizde de kabul edilen kat mülkiyeti kurumunun sağlıklı bir şekilde uygulanabilmesi açısından kat maliklerine bazı haklar verilmiş, bunun yanında ise bazı yükümlülükler yüklenmiştir. Kat maliklerinin sahip olduğu hakların bir kısmı tek başlarına maliki oldukları yer ile ilgiliyken diğer bir kısmı da ortak yerlere ve yönetime ilişkin haklardır. Nüfus artışı ile birlikte yaşanan büyüme ve yine aynı hızla artan şehirleşme, bu alanda yaşayan bireylerin birtakım problemler yaşamasını kaçınılmaz kılmaktadır. Bu problemlerin çözülmesi için 23.6.1965 tarih ve 634 sayılı Kat Mülkiyeti Kanunu düzenlenmiş ve bu kanunla maliklere birtakım hak ve borçlar da yüklenmiştir. Bu hak ve borçlar Kat Mülkiyeti Kanunu'nun üçüncü ve dördüncü bölümlerinde düzenleme alanı bulmuştur. Bu bölümler ile bir yanda maliklerin, mülkiyet hakkının sağladığı menfaatlerden yararlanmasına ilişkin hükümler diğer yanda ise bu hakların sınırlarını belirleyen yükümlülükler düzenlenmiştir. Bu çalışmamızda Kat Mülkiyeti Kanunu ve güncel yargı kararları çerçevesinde, kat maliklerinin hak ve borçlarının neler olduğu ve hangi şartlarda bu hak ve borçlardan sorumlu oldukları incelenme konusu yapılmıştır."
