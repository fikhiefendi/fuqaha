abstract: "Yoksulluk Bangladeş'te insanların karşılaştığı önemli bir sorundur. Hükümet ve sivil toplum kuruluşlarının yanı sıra diğer birçok İslami kurum da dahil olmak üzere örgütler ülkede yoksulluk sorununu çözmek için çalışıyor. Başarılarının sınırlı olması nedeniyle, toplumdaki yoksulluğun azaltılmasını hızlandırmak için çeşitli politika ve stratejilere ihtiyaç vardır. Örneğin, Zekat Yönetim Merkezi (ZYM), İslami bakış açısına dayalı olarak Zekatı yoksulluğun azaltılması için kullanmak amacıyla kurulmuş bir kurumdur. ZYM gibi kurumların tarım ağırlıklı bir ekonomi olan Bangladeş'ten Zekat Al-Ushr gibi fonları harekete geçirmesiyle, geçim sıkıntısının yanı sıra küçük çiftçilerin yaşadığı yoksulluk sorununu çözme fırsatları artacaktır. Bu çalışma, temel gıda (pirinç) net çeltik üretimi, Üşr Zekatı için gerekli olan Nisabı aşan çiftçilerden toplanabilecek Uşr Zekatı miktarını tahmin etmeye çalışmaktadır. Bunun için Rajshahi bölgesinde bulunan iki Bangladeş köyünü seçtik; Nouba ve Khamarkandi. Köyler iki farklı ilçede bulunmaktadır. Uygun örnekleme dayalı olarak her köyden 100 çiftçi hanesi yanıtlayıcı olarak seçilmiştir. Bu nedenle, bu çalışma için toplam 200 çiftçi hanesi seçilmiştir. Amacımız Nisab bazında Zekat ödemekle yükümlü olan çeltik çiftçilerinin sayısını, yani gerekli tüm masrafları hesaba kattıktan sonra belirlemektir. Bulgularımız Uşr tahsilatında bir boşluk olduğunu gösteriyor; bu da gerçekte ne kadar toplanabileceğine ve halihazırda ne kadar ödenmiş olduğuna ve bunun aşırı yüksek olabileceğine işaret ediyor. Bunun temel nedeni, Müslüman çiftçilerin günde beş vakit namaz kıldıkları bildirilmesine rağmen, Öşür Zekatını ödeme konusunda motivasyonlarının olmamasıdır. Hükümetin ZYM gibi kurumları teşvik etme çabalarının olmayışı aynı zamanda Zekat-ul-Ushr'un zayıf tahsilatını da açıklamaktadır. Dolayısıyla bu çalışma, ZYM'nin yoksulluğun azaltılması için ek fonları harekete geçirmesi gerektiğini öne sürmektedir. Bulgularımıza dayanarak, bu çalışma ayrıca Bangladeş hükümetine, özellikle Bangladeş'teki geçimini çeltikten sağlayan çiftçilerin yaşadığı yoksulluğu hızlı bir şekilde azaltma hedefini gerçekleştirmek için ZYM modelini kopyalamak için gerekli politika önlemlerini almasını önermektedir."
