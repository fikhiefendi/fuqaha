abstract: "Bu çalışma, Osmanlı dönemi âlimlerinden Darendeli Hamza Efendi'nin Bey' ve Şirâ risalesini günümüz Türkçesine aktarmayı ve eseri fıkhî açıdan incelemeyi konu edinmektedir. Risalede İslâm hukukunda satım ve satın alma akitlerine dair hükümler ele alınmakta; ticari muamelelerin dinî-hukukî sınırları, akitlerin geçerlilik şartları ve tarafların hak–yükümlülükleri açıklanmaktadır. Metin yalnızca alışverişin şekli kurallarını değil, aynı zamanda ticaret ahlâkı, helal kazanç ilkeleri, haksız kazanç türleri, fiyat belirleme yöntemleri ve toplumda yaygın fakat sakıncalı görülen uygulamaları da kapsamaktadır. Bu bağlamda eserde ölçü ve tartıda dürüstlük, aldatma ve faiz yasağı gibi konulara hem klasik fıkıh kaynakları hem de dönemin pratik ihtiyaçları ışığında değinilmiştir. Çalışmamızda ayrıca Hamza Efendi'nin hayatı, fıkıh alanındaki diğer eserleri ve söz konusu risalenin şerhleri ele alınmış; risalede doğrudan atıf yapılan kaynaklar değerlendirilmiştir. Çalışmanın amacı, risaleyi ilmî bir yöntemle neşretmek, dönemin ticari-hukukî anlayışıyla ilişkilerini ortaya koymak ve Osmanlı tecrübesinin günümüz ticari hayatına sağlayabileceği katkıları vurgulamaktır."
