abstract: "İnsanla ibadet arasında yakın bir ilişki vardır. Kulun yaratıcıya imandan sonra ilk görevi olan ibadet geniş kapsamlı bir kavramdır ve ibadet yapma sorumluluğunda insanın kadın veya erkek olması arsında fark yoktur. Ancak mükellefin kadın ve erkek olması bazı ibadetleri ifada hüküm farklılığını netice vermiştir. Bütün ibadetler bütün ayrıntılarıyla Kur'an'da yer almamaktadır. Bu sebeple hem onların sübutu hem de anlaşılmasında, dolayısıyla uygulamada farklı görüşler ortaya çıkmıştır. İbadetlerde kadınların erkeklerden farklı oldukları hükümlerin tahlilini konu aldığımız bu çalışmamızda“namaz, oruç-itikaf, zekât-fitre, hac ve kurban”ibadetleri konumuz açısından değerlendirmeye tabi tutulmuştur. Ele alınan bu konular, dört fıkhî mezhebe göre ve onların klasik eserleri esas alınarak incelenmeye çalışılmış, bazen de diğer mezheplerin görüşlerine yer verilmiştir. İnsan ve ibadet ilişkisini ele aldığımız birinci bölümde insan için ibadetin önemi, ibadet yapmanın sebep ve neticeleri, ibadetin teşri' kaynakları ve içtihadın ibadetlerdeki yeri, yaratılışta ve kullukta kadın ve erkeğin durumu ele alınmış ve değerlendirilmiştir. Namazda kadınların farklılıklarını ele aldığımız ikinci bölümde özel durumdaki kadınların namaz mükellefiyeti ile kadınların Cuma ve bayram namazı kılmakla mükellef olup olmadıkları incelenmiş ve görüş farklılıkları değerlendirilmiştir. Üçüncü bölümde oruçta, dördüncü bölümde zekât ve kurbanda, beşinci bölümde ise hac ibadetinde kadınlarla ilgili farklı hükümler ele alınmış ve bu farklılıklara mezheplerin yaklaşımları incelenmiştir. Çalışmamızın sonucunda kadın ve erkeğin yaratılıştan gelen biyolojik ve psikolojik farklılıklarının her iki cinsin hem dünyevî görevleri hem de ibadetlerinde belirleyici nitelikte olduğu tespit edilmiştir. Cinsiyet farklılığının ibadetlerin esasında değil tatbikinde etkili olduğu ve olması gerektiği görülmüştür. Modernist ve feminist anlayışların İslam'daki kadın anlayışı ile pek örtüşmediği kanaatine varılmış kadın ve erkeğin her konuda eşit değil ancak eşdeğer olduğu sonucuna ulaşılmıştır."
