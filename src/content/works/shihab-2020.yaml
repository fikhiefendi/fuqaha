abstract: "Allah katında çok değerli olduğundan dolayı insan hayatına/kanına azami ölçüde saygı duyulması gerekir. Zira Yüce Allah'ın haram kıldığı en önemli şeylerden biri insan hayatıdır. Cenabı Hakk'ın haram kıldığı en önemli şey kan dökme yani can almadır. Çünkü canı Allah yaratmış ve sorumluluğu da O'na aittir. Bedenlere ruhu veren de dilediği zaman o ruhu alan da ancak Allah'tır. Budan dolayı meşru kanunlar dışında insanların can almaya asla hakları yoktur. Canın alınabilmesinin bazı kanunları vardır. Bunun ilkelerini de Kur'ân-ı Kerîm ve Sünnet-i seniyye belirleyip düzenlemiştir. Allah ve resulü tarafından belirlenen bu hakları hiç kimsenin ihlal etme yetkisi yoktur. Bizim araştırma konumuz İslam şeriatının öldürmeyi gerekli kılan yasal fıkhı incelemesini yapmaktır. İslam hukuk kuralları içerisinde öldürmenin sebepleri, sırasıyla a) haksız yere bir insan öldürme, b) evlilerin zina yapması ve c) dinden dönmedir (ridde). Tezimizde bunların Irak hukuk kanunlarıyla uyumluğu problemini karşılaştırmalı olarak ele aldık. Her meseleden sonra fıkhi görüşleri de karşılaştırarak açıkladık. Okuyanın kolay anlamasını sağlamak için basit bir dil kullandık. İslam fıkhında anlaşılması zor olan kavramları ise açıklama yoluna gittik. Araştırmamız öldürmeyi gerektiren durumlar hakkında üç bölüm şeklinde oluştu. Birinci bölümü öldürme ve çeşitlerine ayırdık. İkinci bölümü, ölümü gerekli kılan durumlar oluşturdu. Burada genel olarak zinayı inceledik. Zinanın hangi durumlarda ölümü gerekli kıldığını ve bu öldürmenin şartlarını ele aldık. Üçüncü ve son bölümde ise İslam dininden dönme (ridde) şekillerini ve bununla ilgili önemli etkenleri ele aldık."
