abstract: "Konvansiyonel sigortacılık sistemi, bilhassa Akdeniz merkezli olan ticaretin gelişmesiyle Avrupa'da görülmeye başlanmış ve İngiltere'de sanayi devrimi döneminde sistematik bir uygulama haline gelmiştir. Bununla birlikte zekât, vakıf, beytü'l-mal, lonca gibi müesseseler İslam ülkelerinde 19. yüzyıla kadar sigorta sistemine alternatif olarak görülmüştür. Ancak 20. yüzyılda sosyal hayat ve ekonomik şartların değişmesi ile beraber bu müesseselerin neredeyse tamamı işlevini yitirmiştir. İşlevinin yitirilmesiyle bu müesseseler, Fıkhî tartışmaları da beraberinde getirmiştir. Sigorta sistemine alternatif olan müesseselerin etkisinin azalması, beraberinde bireyleri, uygun bir çıkış yolu aramaya itmiştir. Bu arayışların neticesinde“Tekâfül Sigortacılığı”kavramı ortaya çıkmıştır. Tekâfül sigorta, temelinde karşılıklı kefalet anlayışı bulunan bir modeldir. Bu model İslam hukukuna uygun bir model olarak sunulmuştur. Tekâfül sigortacılığı, Sudan, Malezya gibi ülkelerin öncülüğünde ortaya çıkarılmış bir model olup, günümüzde İslam ülkelerinde olduğu kadar Avrupa ülkelerinde de uygulanan alternatif bir sigorta modeli haline gelmiştir. Modelin Türkiye'de uygulanmaya başlanması ise ilk kez 2010 yılında Neova Sigorta şirketi ile başlamış ve bu süreç ciddi bir ivme ile gelişim ve büyüme göstermiştir. Yaşanan bu gelişim ve büyüme ile beraber, tekâfül sigortanın, kendisini destekler nitelikte olan ve uluslararası finansal sistemin yapısı içinde yer alan katılım finans sistemine dâhil edilmesinde büyük ölçüde etkili olmuştur. Bu etki ile beraber tekâfül sigorta sisteminin finansal bağlamdaki destekleyicisi rolünü üstlenmiştir. Bu çalışmada ortaya konulan iddia; İslam'ın, sigortacılık sistemine dair mülkiyet ile ilgili ilkelerini ortaya koymak ve İslamiyet'in sunduğu sigortacılık sistemi mevcut durumunda, kapitalist uygulamalara kıyasla insana huzur ortamı sağlama ve hayatını kolaylaştırma noktasında daha tutarlı ve daha yararlı sonuçlar doğurabileceğidir. Araştırmada tekâfül sigortacılığına dair ortaya konulan iddiaların doğruluğunu araştırmak için anket yöntemi uygulanmıştır. Elde edilen sonuca göre; muvakkat dünya hayatında mülkiyetlerin, güvence altına alınması ve bütün şartların İslam hukukuna uygun bir model ile sağlanması anlayışı ortaya konulmuştur. Ebedi olan ahiret hayatını kazanmak gayesi ile bir emanetçi algısı güdülerek, mülkiyet hukukunu gözetecek bir şekilde İslam hukukunun ışığında, uygun bir sigorta sisteminin var olması gerektiği düşüncesinin ağır bastığı sonucuna ulaşılmıştır."
