abstract: "Son yıllarda dijitalleşme devinimi bankacılık sektöründe birçok yeniliği zorunlu kılmıştır. Bu nedenle bankacılık sektöründe rekabeti üst seviyeye taşımak için teknolojik yaklaşımlar müşterilerin deneyimine sunulmuştur. Dolayısıyla bankalar ve müşteriler arasında birçok uygulama üzerinden dijital köprüler oluşturulmuştur. Bu araştırmanın amacı, katılım bankalarında dijital yeniliklerin banka müşterilerinin dijitalleşmeyi benimseme durumları üzerine etkisini incelemek ve finansal sonuçlarını değerlendirmektir. Bu amaç doğrultusunda araştırmada nicel yöntem takip edilmiş olup nicel yöntemde ilişkisel tarama modeli tercih edilmiştir. Araştırmanın örneklem grubunu Kuveyt Türk Katılım Bankası'nın 389 dijital aktif kurumsal müşterileri oluşturmaktadır. Araştırmada“Demografik Form”,“Katılım Bankalarında Dijital Farkındalık Ölçeği”,“Katılım Bankalarında Dijital Yeniliklerin Şirkete Etkisi Ölçeği”“Katılım Bankalarında Dijital Yeniliklerin Finansal Sonuçları Ölçeği”olarak dört farklı veri toplama aracı kullanılmıştır. Verilerin analizi kısmında ise Microsoft Excel ve SPSS 25 programlarından yararlanılmıştır. Faktör analizinden sonra veriler normal dağılmadığı için parametrik olmayan Kolmogorov – Smirnov ve Shapiro-Wilk testleri uygulanmıştır. Değişkenlere ait gruplar arası karşılaştırmalar yapılırken Mann Whitney U ve Kruskal Wallis testinden yararlanılmıştır. Gruplar arasında fark tespit edildiğinde farkın hangi gruplardan kaynaklandığını belirlemek için Posthoc Bonferroni düzeltmeli Mann Whitney U testi kullanılmıştır. Değişkenler arasındaki ilişkilerin belirlenmesi için Spearman korelasyon testi yapılmıştır. Katılımcıların dijitalleşmeyi benimsemelerinin bağımsız değişkenlerden cinsiyete, yaş grubuna, eğitim düzeyine, gelir düzeyine, faaliyet gösterilen sektör ve işletme türüne göre değiştiği tespit edilmiştir. Araştırmanın hipotezlerinin kabul ve reddedilmeleriyle ilgili olarak; dijital bankacılık kullanım süresinin ve kullanım sıklığının dijital yeniliklerin şirkete katkısı üzerinde etkili olduğu; dijital bankacılık kullanım süresinin ve kullanım sıklığının dijital yeniliklerin finansal sonuçları üzerinde etkisinin olduğu yönünde sonuçlar belirlenmiştir. Buna karşın dijital bankacılık kullanmanın öncelikli sebebinin, dijital yeniliklerin şirkete katkısı üzerinde etkisi olmadığı; dijital bankacılık kullanmanın öncelikli sebebinin, dijital yeniliklerin finansal sonuçları üzerinde etkisinin olmadığı da araştırma sonuçları arasındadır."
