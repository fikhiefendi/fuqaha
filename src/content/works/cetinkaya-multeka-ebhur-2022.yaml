abstract: "Osmanlı hukuku, devletin teşekkülünden itibaren sistematik anlamda bazı gelişmeler sergilemektedir. Bu gelişme sürecinde bazı fıkıh kitapları Osmanlı bürokrasisini ve adalet mekanizmasını derinden etkilemiştir. Hanefî hukuk doktrinin kabul gördüğü Osmanlı'da, Fatih'ten itibaren Molla Hüsrev'in Dürerü'l-hükkâm eseri bağlamında gelişen yargı sistemi, XVI. asırdan Mecelle'nin kabulüne kadar Mülteka'l-ebhur merkezli gelişmeye devam etmiştir. Bu çalışmada, Mülteka'l-ebhur'un içeriği, üzerine yapılmış çalışmalar ve Osmanlı Hukukuna etkisi kronolojik bir düzende ele alınıp incelenecektir. Böylece Mülteka'l-ebhur'un Osmanlı hukuku içerisindeki yeri ve önemi ortaya çıkmış olacaktır."
