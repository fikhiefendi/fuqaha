abstract: "Örfün, peçenin şer`î hükmü üzerindeki etkisinin açıklanmasına ve alimlerin bu konuda tercih ettikleri görüşün bilinmesine acil bir ihtiyaç vardır. Çünkü örf Kur'an ve sünnet nassıyla çelişmediği sürece şer`î bir delil sayılmıştır. Peçe konusu son zamanlarda çok tartışılan konulardan olmuştur. Gelenekçi ve modernist fıkıhçılar peçenin vucûbiyeti yahut müstehaplığı konusunda farklı görüşlere sahiptirler. Bu nedenle çalışmamızda peçenin şer`î bir unsur sayılmasında örfün etkisine ve dört mezhep imamının sundukları deliller de dikkate alınarak bu konuda verdikleri hükümlere odaklanılmıştır. Bu incelemelerin ardından içinde yaşadığımız çağın ruhuna en uygun görüş belirlenmeye çalışılmıştır. Çalışmada tümevarım yöntemi, analitik yöntem ve karşılaştırma yöntemi takip edilmiştir. Tümevarım yöntemi kapsamında peçe konusunda derinlemesine çalışan alimlerin içtihatlarından öne çıkanlar tespit edilip açıklanmış, sonra savundukları görüş çerçevesinde öne sürdükleri deliller belirtilmiştir. Analitik yöntemde ise farklı görüşler ve deliller tahlil edilmiş, bu delillerle istidlal çeşitleri açıklanmıştır. Karşılaştırma metodu ise, zikredilen delillerin arasından tercihe şayan ve en doğru olanı tespit etmek için birbirleriyle karşılaştırılması şeklinde uygulanmıştır. Çalışmada ulaşılan sonuçlardan en önemlileri şunlardır: Sahih örf, şer`î amelî hükümlerin çoğunda delil sayılmıştır. Çünkü“zamanın değişmesiyle ahkâmın değişmesi inkâr edilmez”kaidesine muvafık olarak şer`î hükümlerin istinbat edilmesinde, insanların dönemden döneme ve mekandan mekana değişen örf ve adetlerinin etkisi vardır. Ulaştığımız diğer bir sonuca göre alimlerin çoğu kadının yüzünün ve ellerinin avret olmadığı görüşünü tercih etmektedir. Bu görüşü savunanların delilleri muhaliflerinin delillerinden çok daha güçlüdür. Ayrıca bu görüşte, çağın sıkıntılarına karşı inancı ve tesettürüyle mücadele etmekte olan Müslüman kadın için bir kolaylık vardır. Bundan ötürü, özellikle fitneden korunabiliyorsa, peçenin vacip olmadığını söylemek kadını herhangi bir sıkıntıya sokmaz."
