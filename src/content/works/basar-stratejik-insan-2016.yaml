abstract: "Teknolojinin her geçen gün kurumlar üzerindeki etkisinin artarak devam ettiği bu yüz yılda, pazarda rekabet farklılığını oluşturan etkenler bu duruma bağlı olarak değişiklik göstermektedir. Türkiye'de bankacılık sektöründe giderek pazar payını artıran katılım bankalarında bu durumun ne yönde olduğunu araştırmak birçok açıdan literatüre önemli katkılar sağlayacaktır. Ayrıca gerek devlet bankalarının gerekse de diğer konvansiyonel bankaların bu alana girecek olması nedeniyle çalışma pazarda ki büyük resmi görebilmemiz açısından da önemli olacaktır. Türkiye'de faaliyet gösteren katılım bankalarında stratejik insan kaynakları yönetimi ve uygulamaları, rekabetçilik oryantasyonları ve firma-çalışan performansı arasında pozitif ilişki olduğu ön görülmektedir. Anket yönteminin kullanıldığı araştırma, katılım bankalarında görev yapan 283 çalışan üzerinde yapılmıştır. Elde edilen veriler, SPSS 11.00 İstatistik paket programı kullanılarak tanımlayıcı analiz, faktör analizi, güvenilirlik analizine, korelasyon analizi ve regresyon analizine tabi tutulmuştur. Ayrıca AMOS programı ile de yapısal eşitlik modeli uygulanarak aracı değişken etkisi analiz edilmiştir. Yapılan analizler sonucunda Rekabetçi örgüt kültürü oryantasyonlarından olan pazar odaklılık SİKY ile aracı değişken etkisi oluşturmamakta, SİKYU ile de kısmı aracı değişken etkisi oluşturarak firma performansını pozitif yönde etkilemektedir. Öğrenme odaklılık ve girişim odaklılık ise firma performansı ile hem SİKY hem de SİKYU aracı değişken vasıtasıyla pozitif yönde etkilemiştir. Yapılan ikili regresyonlarda rekabetçi örgüt kültürü oryantasyonları alt boyutları ile ele alınmış olup, bunların kurumsal performans ile ilişkilendirildiği hipotezler büyük oranda reddedilmişti. Ancak aracı değişken etkisinde rekabetçi örgüt kültürü oryantasyonları alt boyutları ile değil 3 ana boyut ile analiz edilmiştir. Sonuç olarak rekabetçi örgüt kültürü oryantasyonları pazar odaklılık düşük olmak üzere SİKY ve SİKYU vasıtası ile firma performansını pozitif yönde etkilemiştir."
