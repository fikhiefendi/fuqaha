abstract: "Teklîfî Hükümler içerisinde vacib, biri umûmî diğeri husûsî olmak olmak üzere iki başlık altında incelenir. Hanefiler umûmî mana için farz tabirini kullanırken, husûsî mana için vacib ismini kullanmışlardır. Umûmî manada vacib, Şâri'in yapılmasını bağlayıcı bir şekilde istediği fiili ifade eder. Âlimlerin çoğunluğu bu tanım üzerinde ittifak halindedir ki namaz kılma, zekat verme ve haccetme bu taleplerden sadece birkaçı olup, terki durumunda mükellef cezaya müstehak olur. Çünkü burada hükmün delâleti, delaleti katîdir. Vacibin husûsî manada izahına gelince Hanefiler burada farklı bir metodu takip etmişlerdir. Şöyle ki Şâri'in mükelleften yapılmasını bağlayıcı tarzda istediği ancak bu bağlayıcılığın zanni delille sabit olduğu fiile vacib denir. Dolayısıyla fıtır sadakası, kurban kesme, vitir ve bayram namazları, namazda fatihayı okuma Hanefilere göre vacibtir. Bu hükme sebep olan ise delâleti zannî olarak kabul edilen Haber-i Vâhiddir. Delâleti katîlik ve zannîlik, Hanefîlere göre bu nokta da farz ve vacib ayrımına sebep olmuştur."
