abstract: "Bu çalışma, İslam hukuk geleneğinde tarihsel olarak iç içe geçmiş olan fıkıh ve ahlâk disiplinleri arasındaki ilişkiyi, teorik ve uygulamalı düzeyde sistematik biçimde ele almayı amaçlamaktadır. Modern dönemde disipliner ayrışmanın etkisiyle birbirinden kopuk şekilde değerlendirilen bu iki alan, çalışmada ibadetlerden aile ve borçlar hukukuna, ceza ve yargılama süreçlerinden şer'î hile tartışmalarına kadar geniş bir yelpazede birlikte ve bütüncül olarak incelenmiştir. Çalışma, fıkhın dışsal davranışları düzenleyen bir normatif sistem olmasının yanında, ahlâkî saiklerle temellendirilen bir değerler bütünü olduğunu göstermektedir. Fıkhın klasik tanımındaki“kişinin lehine ve aleyhine olanı bilme”vurgusu, sadece hukuki olmaktan öte ahlâkî sorumluluklara da işaret etmektedir. Bu çerçevede çalışma, fıkıh ile ahlâk arasında yapısal bir kopukluk bulunmadığını, aksine adalet, ihsan, hüsün-kubuh ve hudûdullah gibi temel referans kavramlar aracılığıyla bu ilişkinin tarihsel süreklilik ve anlam derinliği taşıdığını ortaya koymuştur. Çalışmada ef'âl-i mükellefîn, diyânî-kazâî hüküm ayrımı, makâsıdü'ş-şerîa ve sedd-i zerîa gibi usûlî kavramlar, fıkıh-ahlâk ilişkisi bağlamında yeniden yorumlanmış, normun şekilci yorumu ile maksad eksenli yaklaşım arasındaki farklar örneklerle ortaya konmuştur. Ayrıca ibadetler, borçlar hukuku, aile hukuku, ceza hukuku ve yargılama hukuku gibi alanlarda ahlâkî ilkelerin fıkhî hükümlere etkisi ayrıntılı biçimde incelenmiştir. Bu alanlarda özellikle karşılıklı rıza, zararı önleme, kolaylık ve takvaya uygunluk gibi ilkelere vurgu yapılarak fıkhın sosyal adalet ve bireysel erdemi gözeten yönü ön plana çıkarılmıştır. Çalışmanın en dikkat çekici bölümlerinden biri olan şer'î hile başlığı altında ise hukuken geçerli görünen fakat ahlâken sorunlu uygulamalar değerlendirilmiş; fıkhın lafzî yorumuna sığınarak ahlâkî özden uzaklaşmanın doğurduğu yozlaşma eleştirilmiştir. Hile-i şer'iyye örnekleri üzerinden, meşruiyet ile meşruluk arasındaki fark açıklanmış, hukuki şekilciliğin ahlâkî gayeyle uyuşmadığı durumlar somut örneklerle tartışılmıştır. Sonuç olarak bu tez, fıkhın ahlâkî boyutu da dikkate alan bütüncül bir manayı muhtevi olduğu gerçeğinden hareketle günümüzde yaşanan ahlâkî çözülmenin, fıkhın özünden uzaklaşılmasından kaynaklandığını ileri sürmektedir. Fıkhın normatif bir disiplin olmanın ötesinde, bireyi kemale erdirmeyi ve toplumu adaletle inşa etmeyi amaçlayan ahlâk temelli bir sistem olduğu vurgulanmıştır. Bu bağlamda,“makâsıd eksenli fıkıh”anlayışının yeniden canlandırılması, çağdaş İslam toplumlarında değer temelli bir hukuk bilincinin oluşmasına katkı sağlayacaktır."
