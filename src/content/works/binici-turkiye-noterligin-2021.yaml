abstract: "Noterlik kurumunun tarihsel kökenleri oldukça eskidir. Neredeyse yazının icadı ile birlikte var olmaya başlayan bir kurumdur. Batı ve Doğu medeniyetlerinde noterlik görevi temelde birbirine oldukça benzemekle birlikte bürokratik farklılıklar mevcuttur. Bu duruma ise siyasi ve dini koşullar neden olmuştur. Hukuk kavramı yapılacak işi şekillendirmektedir. Bundan dolayı konu batı ve doğu toplumlarındaki hukuki yapılanmalara göre değerlendirilmelidir. Roma ve İslam devletleri döneminde noterlikle ilgili kurumsallaşma konumuz kapsamında incelenmiştir. Osmanlı özelinde kadıların noterlik hizmetinde; naipler, mahkeme kâtipleri ve şühûdü'l-hâl adı verilen yardımcıları vardı. Kavramın Osmanlı Devleti ve Türkiye Cumhuriyeti Dönemi'ndeki algılanışı üzerinde durulmalıdır. Konunun Osmanlı modernleşme süreci ile birlikte değerlendirilmesi gerekir. Bu bağlamda Tanzimat Fermanı (1839) ayrı bir öneme haizdir. Hukukta batılılaşma noterlik kurumunu da etkiledi. Batılı tarzda açılan Ticaret Mahkemeleri, kadılık kurumunun yetkilerinin zayıflamasına yol açtı. Medeni Hukuk açısından önemli bir diğer çalışma da 1868'deki“Mecelle”idi. 1877'de yapılan düzenleme noterliği bir görev haline dönüştürecekti:“Belge düzenleme ve onaylama işlemlerinin belirli bir mercide yapılması hükmü”gerekli dayanağı oluşturacaktı. Osmanlı Devleti sınırları içinde modern noterlik ilk defa Girit Vilayetinde uygulandı. Noterlik, Cumhuriyet Dönemi'nde modern anlamda“hukuk devleti”olma ile eş zamanlı gelişme gösterecektir. 1924'de şer'i mahkemeleri kaldırıldı. Noterlik işlemleri tamamen“kâtib-i adl”lere bırakıldı. 1938'de Noter Kanunu çıkarıldı. Böylece statü gereği Noterlik bir meslek haline getirildi. Alacakları ücret konusunda yapılan düzenleme ile“serbest meslek erbabı”olarak tanımlandı. 1972'ye kadar bu kanun yapılan güncellemelerle yürürlükte kaldı. Noterlik hukuk sistemine işlevsellik kazandıran kurumlardandır. Hukuki ilişkiler devam ettiği sürece noterlik de var olacaktır. Noterliğin hukuki statüsü kanunlarla belirlenmiştir. Noterler özellikle mali konularda devlet memurlarından ayrılırlar. Yaptıkları işlemin karşılığında“noter harcı”denilen bir ücret alırlar. Bu da onların mali açıdan bağımsız olmaları anlamına gelir. Türkiye özelinde Noterlikler ülkenin mülki idari yapılanmasına göre belirlenmiştir. Noterliklerin açılma prosedürü Adalet Bakanlığı bünyesinde gerçekleşmektedir. 1972 Noterlik Kanunu ile meslekte yeni bir yapılanma ve teşkilatlanma sürecine girildiğini ifade etmeliyiz. Noter Odaları'nın kurulması ve noterliklerin buralara bağlanması ile bu mesleğin teşkilatlanması sağlanmıştır."
