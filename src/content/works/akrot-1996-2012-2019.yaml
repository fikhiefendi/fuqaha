abstract: "Bu Tez Küçük Ve Orta Büyüklükteki Projelerin Etkisini Tanımayı, Ekonomik Etkisinin Milli Ekonomiye Etkisini Açıklamayı Ve Bu Projelerin Faaliyetleri Ve Ekonomik Kalkınmanın Arasındaki Bağı Açıklamayı Amaçlamıştır. Yine İslami Katılım Bankasının Küçük Ve Orta Üyüklükteki Projeleri Finanse Etmek Doğrultusunda Yaptığı Katkılara Işık Tutmuştur. Araştırmacı Bu Araştırmasında Endüktif Yöntemi Kullanmıştır. Bunu; İslami Bankalar Ve Küçük Ve Orta Büyüklükte Projeleri Finanse Etmekte Katkıları Konusunda Yapılan Araştırmaları Gözden Geçirerek, Keza Bu Projeleri Finanse Etme Koşullarını Toplamıştır. Yine Araştırmacı Bankanın Küçük Ve Orta Büyüklükteki Projeleri Finanse Etmekte Katkısını Değerlendirmek İçin Analitik Yöntemi Kullanarak İslami Katılım Bankasının Raporlarını İncelemiştir. Araştırmanın Sonucunda Araştırmacı Uluslararası İslami Katılım Bankasının Ve Diğer İslami Bankalarının Faaliyetlerini Tanıtan Ve Diğer Bankalarla Arasındaki Farkı Açıklayan Reklam Ve Tanıtımlar Yapmamasına Rağmen Toplum Bireylerinin Biriktirdikleri Paraları Cezbedebildiği, Uluslararası İslami Katılım Bankasının Kendini Muhtemel Finans Taliplerine Tanıtmakta Ciddi Kusur Olduğu, Bu Finans Taliplerinin Banka Hakkında Adının İslami Olduğu Haricinde Finans Koşul Ve Mevzuatı Hakkında Bilgileri Olmadığı, Bundan Dolayı Finans Taliplerinin Olmadığı Sonuçlarına Varmıştır. Araştırmacı Araştırmasının Sonucunda Yemen İslami Finans Kurumlarına Finans Programlarını Açıklayıcı Ve Net Bir Şekilde Mümkün Olan Her Türlü Yolla Tanıtmalarını, Özellikle Uluslararası İslami Katılım Bankasına Küçük Ve Orta Büyüklükteki Proje Sahiplerinin Başvuru Yapmalarını Beklemeyip Bu Proje Sahiplerini Aramasını, Keza Üyük Kazanım Vadeden Yatırım Alanları Hakkında Araştırma Yapmasını, Bu Yolla Proje Sahipleriyle Bir Süreliğine Ortaklık Yapıp Böylece Hem Ekonomik Hem De Sosyal Amacını Gerçekleştirip, Aynı Zamanda Verdiği Finansın Karşılığında Kar Sağlamasını, Daha Sonra Bu Projelerin Tamamen Sahiplerine Ait Olmasını Tavsiye Eder."
