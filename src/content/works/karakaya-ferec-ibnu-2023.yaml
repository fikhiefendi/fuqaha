abstract: "Ebu'l-Ferec İbnü'l-Cevzî, 510 - 597 (1116 - 1201) yılları arasında Bağdat'ta yaşayan ömrünü ilmî faaliyetlere adamış fakih, müfessir, muhaddis ve vaizdir. Vaaz konusundaki hünerleri ile kısa sürede Abbasi devlet ricâli ile de yakın münasebetler kuran İbnü'l-Cevzî, farklı alanlarda seçkin eserler ortaya koymuştur. İbnü'l-Cevzî'nin hayatı, , eserleri ve öğrencilerini araştırılarak hazırladığımız çalışmamız, onun Hanbelî Mezhebi içindeki konumunun anlaşılması için önem taşımaktadır. Çok yönlü bir âlim olan Ebü'l-Ferec İbnü'l-Cevzî'nin Telbîsü İblîs adlı kitabı, şeytanın çeşitli gruplara kurduğu tuzaklara karşı insanları uyarmak maksadıyla yazdığı önemli bir eserdir. Çalışmamız, İbnü'l-Cevzî'nin bu eserinde İslam mezheplerine yaklaşımını incelemektedir. Onun İslam Mezhepleri hakkındaki görüş ve eleştirilerine yer verilerek yapılan incelemede, görüşlerinin hem klasik kaynaklarla hem de eser içindeki anlatımlarla kıyaslanarak yapılmasına özen gösterilmiştir. On üç bölümden oluşan eserin, muhtelif bölümleri arasındaki tutarsızlıklara da yer verdiğimiz bu çalışmada İbnü'l-Cevzî'nin fırka tasnifine yapılan eleştirilerden bahsedilerek bu tasnifin ona aidiyeti tartışılmıştır. Ayrıca eserde geçen fırka isimleri üç farklı nüshadan karşılaştırılarak doğru isimlendirmeler tespit edilmeye çalışılmıştır."
