abstract: "İslam hukuku, Nijerya hukuk sisteminde göz ardı edilemeyecek bir yere sahiptir. Bilhassa sömürge öncesi dönemde, Nijerya'nın kuzey eyaletlerinde İslam hukuku medenî hukuk ve ceza hukuku dahil olmak üzere hayatın çeşitli alanlarına uygulanacak şekilde detaylandırılmış ve uygulanmıştır. Söz konusu dönemde İslam hukuku Alkali, Emir ve temyiz mahkemelerinde esas hukuk olarak kabul edilmiştir. İslam hukukunun etki alanı İngiliz sömürü döneminde nispeten sınırlandırılmıştır. İngiliz sömürgeciler İslam hukukunu kişisel hukuk ve tarafların muvafakat ettiği diğer konularla ilgili olmak üzere sınırlamışlardır. Günümüzde Nijerya hukuk sistemi içerisinde yer alan farklı kanun metinlerinde İslam hukukunun bu sınırlı konumu varlığını sürdürmektedir. 1999 yılında Nijerya Devleti, demokratik bir hükümet sistemini benimsediğinde, kuzey eyaletlerinden on iki tanesi kapsamlı bir İslam hukuku sistemini benimsemeyi tercih etti. Bu, ülkede farklı kesimlerden ciddi bir eleştiriye yol açan tam teşekküllü bir hukuki çoğulculuğu ima etmekteydi. Bu araştırmanın amacı İslam hukukunun Nijerya hukuk sistemi içindeki yerini değerlendirmektir. Bu amaç doğrultusunda, araştırmanın hedefleri, Nijerya gibi laik bir devlette İslam hukukunun uygulanmasının ne tür sonuçlara yol açtığını incelemek ve nihaî olarak İslam mahkemelerinde karara bağlanan seçilmiş davaları tetkik ederek Nijerya`da İslam hukuku uygulamasının keyfiyetini ortaya koymaktır. Araştırmamızda ağırlıklı olarak deskriptif yöntem ve analitik yöntem uygulanmıştır. Veri toplama süreci, basılı materyallerden ve elektronik kaynaklardan bilgi toplama işlemini içermiştir. Araştırmamız, Nijerya'nın bazı eyaletlerinde yürürlükte olan İslam hukukunun uygulamaları ile söz konusu eyaletlerdeki güvenlik sorunları arasında doğrudan bir ilişki olmadığını da ortaya koymaktadır. Aynı şekilde sömürge mirası olan hukuki çoğulculuğun da önemli zorluklar yarattığı sonucuna varılmıştır."
