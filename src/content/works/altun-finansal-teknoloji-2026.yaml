abstract: "Finansal teknolojiler (FinTek), finansal hizmetlere erişimi kolaylaştıran yenilikçi çözümler sunmakla birlikte güvenlik, gizlilik, operasyonel risk ve aşırı borçlanma gibi çeşitli riskleri de beraberinde getirmektedir. Bu risklerin yalnızca yasal düzenlemelerle değil, aynı zamanda etik ve değer temelli çerçevelerle yönetilmesine yönelik tartışmalar artarken, İslam İktisadı Anlayışı faiz hassasiyeti, borç duyarlılığı ve etik/toplumsal sorumluluk ilkeleriyle önemli bir referans noktası sunmaktadır. Bu çalışma, FinTek kullanım niyetini hem teknolojik faktörler hem de normatif değerler çerçevesinde incelemekte ve İslam İktisadı Anlayışı'nın FinTek riskleri üzerindeki düzenleyici rolünü araştırmaktadır. Araştırma, İstanbul'da yaşayan ve seçili FinTek uygulamalarını aktif olarak kullanan 772 katılımcı ile gerçekleştirilmiştir. Ölçek geliştirme sürecinde açımlayıcı faktör analizi (AFA) SPSS, doğrulayıcı faktör analizi (DFA) AMOS ile yürütülmüş; yapısal model SmartPLS kullanılarak PLS-SEM yaklaşımıyla test edilmiştir. Bulgular, İslam İktisadı Anlayışı'nın çok boyutlu bir yapı sergilediğini ve faiz hassasiyeti boyutunun kullanım niyetini azaltırken borç duyarlılığı boyutunun artırdığını göstermektedir. Ayrıca analizlerde, sosyal etkinin davranışsal niyet üzerindeki etkisinin faiz hassasiyeti tarafından anlamlı biçimde düzenlendiği görülmüştür. Faiz hassasiyeti yüksek bireylerde sosyal etkinin kullanım niyetini artırıcı etkisi güçlenmekte; bu durum, sosyal onay ve meşruiyet algısının değer temelli tereddütleri kısmen yumuşatarak kullanım niyetini destekleyebildiğine işaret etmektedir. iii Sonuçlar, İslam iktisadı anlayışının FinTek'e ilişkin risklerin azaltılmasında normatif ve davranışsal bir filtre işlevi görebileceğini ortaya koymakta; güven, meşruiyet ve etik uyum ekseninde FinTek uygulamaları ve politika tasarımları için önemli öneriler sunmaktadır."
