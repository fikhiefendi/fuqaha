abstract: "Geçmişten günümüze fıkıh tarihi ile ilgili yapılan te'liflerde salt olarak fıkhın genel anlamda geçirdiği evreler ele alınmakta ve fıkhın kaynakları ve belli başlı konularına dâir başlıklar sunulmakta, neredeyse her eser bir öncekinin tekrarını yapmaktadır. Halbuki belli bir dönemin siyâsî, ictimâî ve hatta ekonomik ahvâlinin de göz önünde bulundurulması gereken fıkıh tarihi çalışmalarında belli bir zaman diliminin veya coğrâfî bir bölgenin tahdidi yapılarak sınırlı bir zaman ve zeminde yapılacak fıkıh tarihi çalışmaları ilgili zaman ve dönem içinde fıkhın geçirdiği seyrin ve aldığı rengin nasıl bir değişime uğradığını göstermek hususunda daha sağlıklı neticeler verecektir. İşte bu gereklilik ve alandaki boşluğa bir nebze katkı olması hedefiyle bu çalışma coğrafya eksenli fıkhı tarihi çalışması hedeflenmekte ve fıkıh havzaları içerisinde yer alan Nil havzası genelinde Mısır'ın fethinden günümüze kadar fıkıh mecrasında geçirdiği aşamalar tarihi bir perspektifte ele alınmasını konu edinmektedir. Nil havzasının fıkıh tarihi açısından incelenmeye fazlasıyla değer ülkesi Mısır'ı konu olan bu çalışmanın her bölümünde genel olarak, Mısır'da belli dönemler çerçevesinde fıkıh ilminin gelişimi ve ahvâli, yaygınlaşmış mezhepler, bunların oluşumları, gelişimleri, ülkedeki diğer mezheplerle olan ilişkileri, ülkede yayıl(a)mayan mezhepler, dönemsel olarak Mısır'da mevcut olan fukahâ ve hal tercemeleri, etkileme ve etkilenme açısından fıkıh rıhleleri, dönemsel olarak Mısır'daki fıkıh tedrîs merkezleri, fıkıh/fukahâ ile irtibatlı olması açısından yaşanan siyâsî, ictimâî, ilmî, hâdiseler, fukahâ ve mezhepler arasında meydana gelen ihtilafların ülkedeki fıkıh hayatına yansıması; tarih perspektifinde fıkıh/fukahâ-siyâset ilişkisi, her dönemin kazâ (yargılama) sistemi gibi konulara temas edilerek geçmişten günümüze fıkhın Mısır'da nasıl bir yol çizerek günümüze geldiği istidâtımız ölçüsünde tafsilatlı olarak aktarılmaya çalışılacaktır."
