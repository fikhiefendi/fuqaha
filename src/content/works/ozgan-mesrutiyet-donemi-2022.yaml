abstract: "Osmanlı Devleti'nin klasik döneminde şeyhülislamlar, devlet yönetimi içinde doğrudan bulunmamalarına rağmen önemli konularda kendilerine danışılmak amacıyla Divan-ı Hümâyûna çağrılırlardı. Özellikle şeyhülislamların verdiği fetvâların devlet yönetiminde ve siyasi alanda büyük bir etkisi bulunmaktadır. Ayrıca şeyhülislamların, padişahların aldığı kararlara karşı görüş bildirebilmeleri, kararlarını eleştirmeleri, padişahların tahttan indirilmelerine ve katledilmelerine kadar çeşitli konularda fetvâ vermeleri onların siyasi alandaki önemini ve gücünü göstermektedir. Bu çalışmada II. Meşrutiyet döneminde görev yapan şeyhülislamların siyasetle ilişkileri ele alınıp incelenmiştir. II. Meşrutiyet döneminde yönetime karşı ortaya çıkan askeri ve siyasi olaylar padişahları zor durumda bırakmıştır. Bu bağlamda padişahlar, devleti daha kolay yönetmek için, şeyhülislamların verecekleri fetvâlara ihtiyaç duymuştur. Bundan dolayı şeyhülislâmların, devlet yönetim sistemi içindeki etkileri daha da artmıştır. II. Meşrutiyetin tekrar ilan edilmesi için kurulan partilere başta şeyhülislâmlar olmak üzere birçok ilmiye mensubu ve ulema katılmış veya destek vermiştir. Böylece şeyhülislamların aktif bir şekilde siyasî hayatın içinde yer almaya başladığı söylenebilir. Bu çalışmada, Osmanlı Devleti'nin son dönemine ışık tutan şeyhülislamların, siyasi alana dönük müdahaleleri ele alınmıştır."
