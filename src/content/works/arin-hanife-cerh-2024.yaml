abstract: "Bu çalışma Ebû Hanîfe'nin cerh-ta'dîl alanında göstermiş olduğu faaliyeti farklı yönleriyle ele almayı amaçlamaktadır. Ebû Hanîfe fıkıh alanında otorite ve çığır açmış bir isimdir. Bilindiği gibi fıkhın temel iki kaynağı Kur'ân ve sünnettir. Fıkıh alanında çalışma yapacak bir kişinin iyi bir Kur'ân bilgisinin yanında iyi bir sünnet bilgisine sahip olması elzemdir. Hadis ise sünnetin en önemli kaynağıdır. Dolayısıyla bir fıkıh imamı olarak Ebû Hanîfe'nin sünnetten/hadis ilminden müstağni kalması düşünülemez. Ebû Hanîfe, hakkında olumlu-olumsuz farklı görüşlerin beyan edildiği bir isimdir. Onun hakkında hadisten anlamadığı, şahsi reyini hadise tercih ettiği, hadis rivayetini kasten terk ettiği, 17 hadis bildiği gibi iddialar ileri sürülmüştür. Ancak Ebû Hanîfe'nin hadis anlayışı ve hadis ilmiyle iştigaline dair ilmi çalışmalarla mezkûr iddiaların gerçeği yansıtmadığı ortaya konulmuştur. Bu çalışmada da Ebû Hanîfe'nin cerh-ta'dîl değerlendirmeleri ele alınarak onun tenkid faaliyetindeki rolü belirlenmeye çalışılmıştır. Ebû Hanîfe cerh-ta'dîl ilminin erken dönemlerinde faaliyet göstermiş bir isimdir. O fıkıhtaki seçiciliğini hadis rivayetinde de göstermiş, kendisine ulaşan rivayetleri titizlikle incelemiş, belirlediği sıkı şartlara uymayan rivayetleri kabul etmemiştir. Bu durum onun az hadis rivayet etmesine sebep olmuştur. Râvi değerlendirmesinde kimi zaman kendine has bir üslup ve terim kullanarak alana yenilik/katkı sağladığı da olmuştur. Ayrıca muasırları ile karşılaştırıldığında cerhta'dîl alanında birçoğundan hem nitelik hem de nicelik bakımından önde olduğu söylenebilir. Diğer yandan Ebû Hanîfe'nin, tüm mesaisini hadise vakfetmiş biri olmayıp çoğunlukla fıkıh ile iştigal ettiği unutulmamalıdır. Ancak o, iddia edilenin aksine hadiste yetkin bir seviyeye sahip olup, hadis ilminin en temel konularından olan cerh-ta'dîl alanında da hatırı sayılır bir yere sahiptir."
