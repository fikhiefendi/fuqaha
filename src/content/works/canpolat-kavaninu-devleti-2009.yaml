title: "قوانين الدولة العثمانية وصلتها بالمذهب الحنفي Kavaninu'd-Devleti'l-Osmaniyye ve Siletiha bi'l-Mezhebi'l-HanefiThe laws of Ottoman and its relationship to the Hanifi School of Islamic Jurisprudence"
