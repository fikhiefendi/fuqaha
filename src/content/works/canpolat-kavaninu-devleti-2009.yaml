abstract: "Bu çalışmamızda \"Osmanlı Kanunnamelerinin Hanefi Mezhebiyle ilişkisi\" konusu ele alınmıştır. Birinci bölümde önsözle birlikte konuyla ilgili genel tarihi bilgi verildikten sonra, Osmanlı öncesi ve Osmanlı döneminde fıkhi hükümlerin kanun haline getirilmesi, Osmanlı dönemi önemli fakih ve eserlerini, ardından Osmanlı devletinin Hanefi mezhebini resmi mezhep olarak seçmesinin nedenlerinden bahsettik. İkinci bölümde, Fatih Sultan Mehmet'ten önce ve sonrası Kanunnamelerin hazırlanışı, içerik açısından Kanunnamelerin çeşitlerinden söz edilmiştir. Üçüncü bölümde ise, Kanunnamelerin hazırlanmasına iten nedenler ve hedeflerinden, ileri sürüldüğü gibi Osmanlı Kanunnamelerinin Bizans kanunlarından etkilenip etkilenmediği incelendikten sonra, ileri sürülen şüphelere ve bu şüphelere delilleriyle birlikte yanıt verilmeye çalışılmıştır. Dördüncü bölümde, Kanunnamelerin özelliğinden, muhtevasından ve şekli yapısından söz edilirken, bununla birlikte Kanunnamelerin şer'i olmadığını ileri sürenlerin görüşleri tartışılmıştır. Beşinci bölümde, Kanunnamelerin temel unsurlarıyla birlikte hazırlanan kanunnameler arasındaki benzerlik ve farklılıklara değinilmiştir. Ayrıca Kanunnamelerin hazırlanmasında Sultanın rolü ve etkisi incelenmiştir. Altıncı bölümdeyse, genel olarak Kanunnamelerin içeriğinden ve uygulanmasıyla ilgili bilgi verilirken Hanefi mezhebiyle, diğer mezheplerin görüşleri karşılaştırılmıştır. Ayrıca çalışmamızda Osmanlı Kanunnamelerinin daha sonraki dönemlerde hazırlanan kanunlara etkisinden de bahsedilmiştir."
