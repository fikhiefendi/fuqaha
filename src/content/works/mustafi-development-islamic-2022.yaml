abstract: "Bölge olarak Balkanlar, stratejik konumu, doğal kaynakları ve Avrupa kıtası ile Asya arasındaki altyapı bağlantı potansiyeli nedeniyle her zaman hedef olmuştur. Bu nedenle bu bölge tarihsel olarak çatışmalara ve karışıklıklara sahne olmuş ve büyük güçlerin ilgisini çekmiştir. Balkanların bir diğer özelliği de dini, etnik ve kültürel açıdan karışık nüfusudur. Son dönemlerdeki sosyal ve ekonomik gelişmelere paralel olarak İslami finansta gelişmeye ve gündeme olmaya başlamıştır. Bu bölgede İslami Finansın geliştirilmesinde ve bundan sonraki gelişmelerinde arka planda yatan pek çok nedenler vardır. Her şeyden önce, bu bölge önemli bir Müslüman nüfusa ev sahipliği yapıyor ve bu da dini bir gereklilik olarak İslami finansın gelişimini olumlu etkiliyor. İkincisi, bu bölge eğitiminden başlayarak İslami finansın geliştirilmesini, kurumsal tecrübenin yeniden canlandırılmasını ve kaybedilen İslami mirasın yeniden ihya edilmesini savunan tüm tarihsel altyapıya sahiptir. Üçüncüsü, bir din olarak İslam'ın evrenselliği ilkesi İslami finans içinde geçerlidir ve sistemin Müslüman olmayan nüfus için de kullanılmasını sağlar. Balkanlarda İslami finansın geliştirilmesine yönelik olarak bankalar, mikro finans, sunumlar, fuarlar, öğretim programları, araştırma, proje finansmanı vb. ile sonuçlanan bazı ilerlemeler kaydedilmiştir. Bununla birlikte, Balkanlar'da ve genel olarak dünyadaki İslami finans gelişimi, ekonomik olmayan faktörlerden de etkilenir. Bu araştırma üzerinden özelikle Balkan bölgesinde İslami finans için yaratılan belirsizliklere ışık tutmaya çalıştık. Aynı zamanda eğitim, kültür ya da vakıf şeklinde olan İslami mirasının yeniden ihya edilmesi imkânları da bu araştırmada yer almıştır. Anketler ve görüşmeler kullanarak finansal okuryazarlığı, İslami finans oranı okuryazarlığı, borç verme ve borç alma kültürünü, İslami ve konvansiyonel finansa sahip olma isteğini hem eğitimsel hem de uygulanabilir olarak ölçmeye çalıştık. Bununla beraber Balkanlarda İslami finanstaki gelişmeleri değerlendirdik. Son olarak, politika odaklı önerileri sunarak İslami finansın nasıl geliştirilebileceğine dair öneriler çıkarıldı."
