abstract: "Hint alt kıtasında fetva faaliyetlerinin sosyal, siyasî ve dinî şartların bir sonucu olarak gelişim gösterdiği söylenebilir. Müslümanların hâkim olduğu Delhi Sultanlığı ile Bâbürlüler döneminde daha çok pratik fayda sağlamak, İslâm hukukunu yaygınlaştırmada önemli bir işlevinin olması, tarihsel olayların etkisi, zamanla değişen şartlar ve yeni sorunların ortaya çıkması gibi değişkenler toplumun fetva faaliyetlerine yönelmesine neden olmuştur. Namazda kıraatin Arapça dışındaki bir dilde okumanın câiz olup olmaması, güvenlik nedeniyle farz olan hac ibadetinin düşmesi, Sûfîlerin müzik dinlemesinin câiz olup olmadığı, Kȃdiyȃnîlerle evlenmenin câiz olup olmaması gibi fetvalar toplumun karşılaştığı dinî-ictimaî problemlere önemli birer örnek teşkil etmektedir. Dönemin ulemâsı, hükümdarlar ve medreseler fetva faaliyetlerinin merkezinde yer almıştır. Gayri müslimlerin hâkim olduğu İngiliz sömürgeciliği döneminde fetva geleneği derinden etkilenmiştir. İngilizlerin kendi hukuk sistemini dayatma çabaları, idarî yapı ve eğitim sistemindeki değişiklikler, Müslümanların dinî hayatını olumsuz yönde etkilemiştir. Bu ve buna benzer gelişmeler dönemin fetva faaliyetlerinin şekillendirmesinde etkili olmuştur. Bu dönemde farklı İslâmî hareketlerin ortaya çıkması, Müslümanların yeni duruma uyum sağlama çabalarının bir yansıması olarak görülebilir. Bu çalışmada zikredilen üç dönem özelinde Hint alt kıtasında oluşan ve gelişen fetva geleneği incelenmiştir."
