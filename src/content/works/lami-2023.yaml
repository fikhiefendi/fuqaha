abstract: "Çalışma, ipotek ve hisse senedi ödünç alma işlemlerine ve bununla ilgili yasal hükümlere ışık tutmayı amaçlamaktadır. Çalışmanın amaçlarına ulaşmak için araştırmacı konu ile ilgili kitaplara ve kaynaklara baktıktan sonra ardından verileri ve bu konuda yapılan açıklamaları analiz ederek, analitik betimsel yaklaşımı kullanmıştır. Araştırmanın en önemli sonuçları arasında: Payın ipotek edilmesinin meşruiyeti, pay sahibi olan kurum veya kişinin yaptığı faaliyetin meşruiyetinden kaynaklanır. İçki, tefecilik ve domuz eti satan şirketlerin payları ile bazı imtiyazlı pay türleri şeriat tarafından yasaklanan ticari faaliyetlerin sonucu olduğu için ipotek edilemez. Şirketin sermayesinin kaynağının caiz olması da dahil olmak üzere başka ek meşruiyet belirleyiciler mevcuttur Şirket, Helal olanı araştırırken yalan, ihanet, asılsız dedikodu, tekel, hisseli kumar gibi haramlara düşmemeye dikkat etmek ve çoğu harama götüren zanlardan sakınmak. Hisse senetlerinin ödünç verilmesi ile ilgili hukuki hükme gelince, bu konuda ümmet âlimleri arasında görüş ayrılığı vardır. Ancak, hisselerin ödünç verilmesinin meşruiyeti hakkındaki hükmü, hissenin cinsi, hak ve görevleri ve hissenin kaynağının meşruiyeti ile ilgili özel şartlara göre vermiştir. Hisse senetlerinin ödünç verilmesine ilişkin hüküm, şirket mallarının gayrimenkul, nakit, borç veya ikisinin karışımı olmasına göre değişir ve Çalışmanın tavsiyeleri arasında: Şeriat piyasalarına, hisse senedi alım-satımı, ipotek ve borç verme konularında şeriat boyutlarını ve şeriat sınırlarını açıklayan bir kurum veya ofis iliştirilmesi ve bu ofis, hisse senetleri ile ilgili tür, kaynak gibi bilgilerin toplanması ve yasallığının netleştirilmesi konusunda uzmanlaşmıştır."
