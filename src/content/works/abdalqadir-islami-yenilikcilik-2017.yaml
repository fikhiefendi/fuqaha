abstract: "Batı'nın fikri, siyasi ve ekonomik gelişmeleri, Batı karşısına İslam dünyası ve Müslümanlara bir mağlubiyet kazandırmıştır. Son iki asırda bu yenilgiyi fark eden Müslüman düşünürler, dönemin bilim anlayışını ve mevcut olan gelişmeleri yakalamak ve daha fazla başarısızlıklara uğramamak için, İslam'ın düşünce ve hukuk alanlarında bir reformun gerekliliğini savunmuşlardır. Bu reform ve yenileme projesi, önemli konularından biri kadın konusu olmuştur. Günümüzde toplumsal değişmenin bir tezahürü de kadının kamusal alanda erkek ile yan yana çalışması, toplumsal rollerinin büyük bir değişmeye dönüşmesi ve erkeklerle eşit bir hale getirilmesidir. İslami yenilikçiler, İslam'ın ısrarla savunduğu adalet ilkesi ışığında, İslam toplumlarında kadının kaybettiği değer ve hakları geri vermek ve Müslümanların arasında yaygın olan erkek egemenliği düşüncesini sonlandırarak bu adaletsizliği ortadan kaldırmaya çalışmışlardır. Bundan dolayı, hukuki alanda kadın ile ilgili birçok hükümler yeniden gözden geçirilmiştir. Kadının problemlerinin geleneksel İslam anlayışında ontolojik olduğunu savunarak ve kadının modern zamandaki konumuna dayanarak, yeniden İslam hukukunda mevcut olan kadının konumu, toplumsal rolleri, kadının örtünmesi ve şahitliği, kadının boşanma hakkı ve mirastaki payları gibi konuları yeniden yorumlayarak, kadının lehine yeni hükümler ortaya koymuşlardır."
