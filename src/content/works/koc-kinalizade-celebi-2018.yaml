abstract: "İslam ilim ve kültür tarihinin ortak kavramlarından biri de 'tabaka'dır. Tabaka arap lisanında hal, mertebe ve derece anlamlarına gelir. Tabakât ise tabaka'nın çoğuludur. Terim olarak tabakât, temelde belirli bir yaş, meslek, görev, nesil, unvan, mezhep, tarikat ve coğrafyaya mensup olmaları dolayısıyla ortak bir grup (tabaka) oluşturan kişilerin biyografilerine verilen bir addır. İslâm tarihinde biyografi yazımının özellikle Hz. Peygamber'in, sahâbe, tâbiîn ve sonraki nesillerin, Resûl-i Ekrem'in hadislerini nakleden râvilerin hayatını tesbit etmek amacıyla orijinal bir tür olarak ortaya çıktığı kabul edilmektedir. Zamanla biyografi türü içerik zenginliği kazanarak toplumun hemen her kesiminden çeşitli alanlarda meşhur kişileri konu edinmiş ve İslâm'ın ilk asırlarından itibaren çok sayıda biyografi kitabı telif edilmiştir. Fukahâ tabakâtı, fıkıh literatürünün tarihî boyutunu tamamlayan en önemli telif geleneğini oluşturmaktadır. Osmanlı Devleti'nin en kudretli asrı olan XVI. yüzyılda yasayan Kınalızâde Ali Efendi (1510/1571) değerli bir ilim adamıdır. Ebu Hanife'nin hayatından söz ederek başlayan Kınalızâde'nin Tabakâtu'l-Hanefiyye'si, İbn Kemal Paşazade'ye kadar geçen Hanefi hukukçular hakkında kısa bilgiler vermektedir. Kınalızâde'nin tabakâtı, Hanefi tabakâtları arasında kısa ve öz olmasına rağmen pek çok Hanefi fakihine yer vermektedir. Eserin yazma nüshaları, İslam dünyası kütüphanelerinde çokça olup bu da bu kitabın değerli olduğunu göstermektedir. Tezimizin birinci bölümünde; Kınalızâde Ali Çelebi'nin hayatı, ilmî şahsiyeti, Türkçe ve Arapça eserlerinden bahsettik ve bu eserlerin neler olduğunu anlatmaya çalıştık. İkinci bölümde, 'Tabakâtu'l-Hanefiyye' adlı eserimizin muhteva yönünden tahlili, müellifimizin eserinin Hanefi Tabakâtı'ndaki yeri, Hanefi tabakât kitapları ve bu kitaplarda kullanılan yöntemler hakkında bilgiler vermeye çalıştık. Ayrıca eserin Taşköprüzâde'ye nisbeti hakkında da bilgi verdik. Son bölümde (Üçüncü Bölümde) ise eserimizin nüshalarının tanıtımını yaptık ve bu nüshalarının hangi kütüphanelerde bulunduğunu tespit ettik. Ayrıca tahkik çalışmamızı yaparken hangi yöntemleri uyguladığımızı ayrıntılı şekilde anlatmaya gayret gösterdik."
