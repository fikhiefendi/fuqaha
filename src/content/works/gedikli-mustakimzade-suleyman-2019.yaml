abstract: "Müstakimzâde; XII. (XVIII.) yüzyıl Osmanlı Dönemi âlimlerinden olup, ilmî sahada çok yönlü bir şahsiyettir. Dinî, edebî ve sanatsal alanlarda çok sayıda eseri vardır. Eserlerinden Hanefî-Mâtürîdî bir çizgide olduğu anlaşılan Müstakimzâde'nin tasavvufî yönü de vardır. Nakşibendîlik Tarikati'nin Müceddidîlik kolunun önemli isimlerindendir. Nakşibendîliğin Anadolu'da yayılmasında oldukça etkili olmuştur. Müstakimzâde'nin biyografi alanında yaptığı çalışmalar en önemli eserleri arasında yer alır. Tanınmış isimler ve Osmanlı şeyhülislamlarını ele aldığı biyografik eserleri günümüz araştırmacılarının da istifade ettiği başvuru kaynaklarındandır. Kendisi de bir hattat olan Müstakimzâde'nin hattatların biyografisi üzerine hazırladığı eseri de bu alanda gerçek bir başucu kaynağıdır. Müstakimzâde, Osmanlı Devleti'nin neredeyse her alanda güçlü olduğu“Yükselme Dönemi”nden çıkıp“Gerileme Dönemi”nin sürdüğü bir zamanda yaşamıştır. Eserlerinde yaşadığı dönemin tartışma konularının hatta X. (XVI.) yüzyıl tartışma konularının izlerine rastlanmaktadır. Saray, tekke ve medresenin toplum üzerinde oldukça etkili olduğu bu dönemde Müstakimzâde, tasavvufî kimliği nedeniyle“tekke”den yana bir duruş sergilemiştir. Özellikle Kadızâdeliler-Sivâsîler çekişmesine dair tartışma konularının eserlerine yansıdığı görülmüştür. İstanbul'da doğup, büyüyen ve burada yetişen Müstakimzâde 1788'de vefat etmiştir. Ardında yüzden fazla eser bırakmıştır. Bu eserleri arasında Hanefî mezhebinin kurucu imamı Ebû Hanîfe'nin en önemli eserlerinden biri olan el-Fıḳhü'l-ekber'in şerhi de yer almaktadır. Müstakimzâde'nin Şerefü'l-akīde adını verdiği el-Fıḳhü'l-ekber şerhi bu çalışmamızın ana konusudur. Çalışmamızda ayrıca Müstakimzâde'nin hayatı, eserleri ve kelâmî görüşleri hakkında da bilgi verilmiştir. Birinci bölümde Müstakimzâde'nin hayatı ve ilmî kişiliği; ikinci bölümde Şerefü'l-akīde adlı eseri ve üçüncü bölümde ise itikadi görüşlerine yer verilmiştir. Çalışmada Müstakimzâde'nin yaşadığı dönem olan XII. (XVIII.) yüzyıl sosyokültürel özelliklerine de yer verilmiştir. Müstakimzâde'nin kelâmî görüşlerinin tespit edilmesinde ulaşılabilen bazı eserlerinden yararlanılmıştır. Başta Şerefü'l-akīde olmak üzere Terceme-i Mektûbât-ı Kudsiyye, Ahidnâme, İrade-i Cüz'iyye Risalesi, Şerh-i Dîvân-ı Ali, Tefsîru sûreti'l-Fâtihâ adlı eserler tetkik edilmiştir. Ayrıca Müstakimzâde'nin eserleriyle ilgili yapılmış tez çalışmalarından, akademisyenlerce hazırlanan makalelerden ve Müstakimzâde'nin diğer bazı eserlerinden de istifade edilmiştir. Sonuç kısmında ise Müstakimzâde'nin elde ettiğimiz kelâmî görüşlerine dair açıklamalara yer verilmiştir. Yapılan değerlendirmeyle Müstakimzâde'nin Hanefî-Mâtürîdî bir yaklaşımla tasavvufu harmanlanması neticesinde oluşturduğu zengin mirasın daha iyi anlaşılması amaçlanmıştır."
