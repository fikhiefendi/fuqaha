abstract: "Asırlardan beri, İslam hukuk düşüncesinde tartışılan önemli konulardan biri, ibadet ve muamelat hükümleri arasında yöntemsel olarak bir ayrımın yapılıp yapılamayacağı sorunudur. İbadetler Şarii'nin hakkıdır ve bunların ifa ve şekilleri ancak şer'i naslar yoluyla bilinebilir. Bu itibarla bunlarda bir değişiklik olamaz. Muamelat hükümlerinde ise, maslahata ve örfe riayet esastır. İslam fıkhında, bu şekilde bir ayrıma karşı çıkanlar olduğu gibi, İslam hukukunun sosyal şartların değişimine ayak uydurabilmesi için, böyle bir ayrımın mecburi olduğunu savunanlar da bulunmaktadır. Bu çalışmamızda, konu netliğe kavuşturulmaya çalışılacaktır. Araştırmamız giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde kavramsal çerçeve çizildikten sonra, ikinci bölümde ayrım, klasik fıkıh usülü çerçevesinde değerlendirilmiştir. Üçüncü bölümde ise, konu hakkında modern dönem tartışmalarına değinilmiştir."
