abstract: "Âlemlerin Rabbi olan Allah'a hamd olsun. Kıyamet gününe kadar Allah'ın salât ve selamı nebilerin ve resullerin en faziletlisi Peygaberimiz Muhammed'e, ehli beytine ve arkadaşlarına olsun. İslam dininin üstünlüklerinden biri de her zaman ve her mekân için geçerli olmasıdır. Bundan dolayıdır ki İslam dini tüm problem ve gelişmelere çözüm üretebilecek bir kabiliyete sahiptir. Bu durum; ümmetin fıkıh ve usul âlimlerini, İslamî mirasımıza, fıkıh ve onun usul kuralarının kaynaklarına değinmelerine neden olmuştur. Böylece fıkhî kurallar ve usullerı fakihin başvuracağı bir kaynak olmuştur. Fakih, fıkhî kurallarla her türlü ortaya çıkan mesele ve olay için şeriat çerçevesinde bir hüküm bulur. Bundan dolayı, fıkhi kurallar islam fıkhı ve usulünde önemli bir yer teşkil etmektedir. Bu ilmi konunun önemli olması nedeniyle, tezimin bu alanda yapılmasına karar verdim. Uzun bir araştırma ve okuma sonucu hadis ve fıkıh alanında İslam âlimleri arasında önemli bir yeri olan İmam Abdul'-hay el-Leknevî'nin“Şerh'ül Hidâye”kitabının ibadet bölümündeki fıkhi kuralları ortaya çıkarmayı hedefledik. İmam Abdul'-hay el-Leknevî ve eseri önemli olduğu için kısaca hayatından bahsettik. Bilindiği gibi“el-Hidâye”' kitabı Hanefi âlimler arasında kendisine başvurulan kaynak bir kitaptır. Bu kitap, fıkıh ilminde hazine değerindedir. Eserin yazarı eserinde Hanefi mezhebine dair rivayetin önemlilerini ve dirayet metinlerini toplamıştır. Böylece El-Hidâye kitabı, Hanefî fıkhında en önemli eserlerden biri olmuştur. Bundan dolayı eser, Hanefî âlimler arasında en fazla başvurulan ve en fazla yaygın eser olarak büyük bir önem görmüştür. Tezimizde terminolojide yer alan fıkhî kuralların tanımını açıkladım. Sonra fıkhı kuralların herhangi bir kısımda farklı konular içeridiğini belirttim. Aynı zamanda fıkıh ilminin genel bir çerçeve olduğunu muayyen bir babta, farklı konulara havi olduğuna temas ettim. Daha sonra fıkhi kaidelerle fıkhı kuralları, kanunları açıkladım. Her ikisinin arasındaki fark sonraki asırlarda ortaya çıkmıştır. Her ilmin kendine has bir anlamı olmuştur. Tezimizde aralarındaki benzerliği ve farklılıkları açıkladık. Bu tez yirmi tane kural içererek (Taharet, namaz, zekât, oruç, hac) gibi konuları kapsamaktadır. Çalışmamız esnasında bu kurallardan râcih olanı seçerken mercûh olan kavli eledik"
