abstract: "XX. Yüzyılın başından bu yana hilafet boşluğu yaşayan İslam dünyası, İslam devletlerinde meşruiyet sorununu beraberinde getirmiştir. Bu sorunun aşılabilmesi için İslam düşünürleri bazı kavramların ortaya konulmasına zemin hazırlamıştır. Bu süreçte sorunun çözülmesi için konulan kavramlardan biri de hâkimiyet mefhumudur. Konuyla ilgili yapılan incelemeler ve klasik eserlerde bahsimizle ilişkin kısıtlı bilgi bulunmasından dolayı birçok İslam devletinde meşruiyet sorununun yaşandığı ve istikrarsızlığa sebep olduğu görülmektedir. Bu nedenle İslam hukuku açısından devletin meşruiyet sorununu ele almak için İslam tarihinde belirli bir dönem ilim merkezi ve hilafetin başkenti olarak yer alan Irak devleti örneği mülahaza edilmiştir."
