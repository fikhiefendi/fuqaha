abstract: "Bu tezde, literatürde neredeyse kendisine hiç atıfta bulunulmamış olan Mâlikî hukukçusu Ebu Abdullah el-Bekkûrî'nin, Tertîbu'l-furûk adlı eseri bağlamındaki hukukî yaklaşımları detaylı bir şekilde inceledik. Birinci bölümde Bekkûrî'nin biyografisini, eserlerini ve içinde yaşadığı coğrafyanın ilmî, kültürel ve siyasi yapısını ele aldık. Bekkûrî, VII/XII. yüzyılda Endülüs'te doğmuş ve burada ilk öğrenimini tamamladıktan sonra Mağrib'e geçerek Merâkeş'e yerleşmiştir. Hayatı, hocaları ve öğrencileri hakkında kaynaklarda çok az bilgi yer almaktadır. Bu bölümde ayrıca araştırma konumuzla dolaylı olarak ilgisi bulunan Karâfî'nin biyografisine, eserlerine ve furûk literatürü gibi konulara da kısaca temas ettik. İkinci bölümde Bekkûrî'nin, hocası Şehâbeddîn el-Karâfî'nin furûk literatüründe çok önemli bir yeri olan Furûk adlı eserine sunduğu katkıları tertip, telhîs ve istidrâk başlıkları altında çeşitli örnekler üzerinden mercek altına aldık.“İstidrâk”başlığı altında Bekkûrî'nin hocasına yaptığı itirazlar bu bölümün en dikkat çekici konusudur. Tertîbu'l-furûk'un özelde furûk literatürü, genelde İslam hukuku alanındaki yerini tespit etmeye çalıştık. Son bölümde ise Bekkûrî'nin metodolojik yaklaşımları incelenmiştir. Özellikle maslahat kuramına dair tespit ettiği on üç ilkenin birçoğunu, hadisçi yönünün fıkhî görüşlerine yansımalarını, doktrin dışına çıkan görüşleri gibi meseleleri ayrı başlıklar altında ele aldık. Arap dili alanındaki yetkinliği ve bunun hukukî yansımaları, örfe bakışı, istishab ve zaruret prensiplerini kullanarak yapmış olduğu hukuki çıkarımlar da bu bölümde incelediğimiz konular arasındadır."
