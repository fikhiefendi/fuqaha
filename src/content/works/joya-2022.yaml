abstract: "Şüphesiz ki Büyük Osmanlı Devletinden bize miras kalan sayısız vakıflarından biri de bırakmiş olduğu ve günümüzde de gerek bilimsel gerek kültürel ve gerekse sanatsal olarak hizmet vermeye devam eden muhteviyatı ile büyük ve kapsamlı kütüphanelerdir. İstanbul Fatih semtinde bulunan Süleymaniye Kütüphanesi bünyesinde Şeyh ul İslam Aşır Efendi (Ö1804) adına tahsis edilmiş kısımdaki Aşir Efendi kütüphanesi de bunlardan sadece biridir. Elimizdeki bu yazma eser ve tahkiki li hali, Süleymaniye kütüphanesindeki Aşır Efendi koleksiyonude bulunan Aşır Efendi vakfiyesinin ta kendisidir. Eser vakfın tapusunun, Vakfiyeyi kayıt altına alan kayıt heyetinin ve şahitlerin isimlerinin, vakfın şartları, depo ve dükkanlardan oluşan taşınmazın vasıflarının, kayıtlı olduğu 14 Varak ve 28 sayfadan oluşmaktadır. Bunlara ilaveten Aşır Efendi Hem babasının daha önce vakfettiği kitapları hem de kendi kitaplarını da zikretmiştir. Aynı zamanda kütüphanenin işletmesi, çalışma kurallarının en ince detayları, memur ve öğretmenlerin belirlenmesinde emanet ve ihlaslı olma özelliklerini, alacak oldukları maaş çalışma şartları, kütüphanenin açılış ve kapanış saatleri, elde edilen karın ne şekilde harcanacağı, taşınır ve taşınmazların restorasyonuna kadar zikretmişti."
