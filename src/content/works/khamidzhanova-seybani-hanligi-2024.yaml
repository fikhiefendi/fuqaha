abstract: "Şeybânîler; Mâverâünnehir ve Horasan'da Timurlulardan sonra bir asır boyunca hüküm süren ve ismini Cengiz Han'ın büyük oğlu Cuci'nin Şeybân adındaki oğlundan alan bir İslâm hanedanıdır. Bu çalışma, Mâverâünnehir bölgesinde geç dönemde Hanefî mezhebinin konumu, fıkhî yaklaşımlar, gelişmeler ve uygulamaları tespit etme amacıyla 16. yüzyılda Şeybânî Hanlığında uygulanan ve bir taraftan özel hukuk alanlarına hakim olan \"şer'î hukuk\"un izlerini diğer taraftan konunun bütüncül anlaşılması açısından kamu hukukunu düzenleyen Cengiz yasası ve Türk halklarının âdetlerinden kaynaklanan örfî hukuk uygulamalarını ele almaktadır. Hanefî mezhebine mensup olan Şeybânîler hakimiyetlerinin erken tarihlerinden itibaren özel hukuk alanı sayılan borçlar hukuku, aile hukuku vakıf hukuku gibi alanlarda şer'î hukuku uygulamaya başlamışlardır. Bunun yanında kamu hukuku içinde mütalaa edilen idare hukuku, savaş hukuku, arazi, vergi ve ceza hukuku gibi alanlarda Cengiz yasalarına dayanan hukuki yaklaşımları ve uygulamaları canlandırmışlar, kendilerinden önce bu bölgelerde hakim olan Timurlu hukuk mirası ve kurumlarını devralarak devam ettirmişlerdir. Şeybânîlerin yasa ve Timurlu hukuk mirası bağlamında geliştirdikleri hukuki anlayış birçok çalışmaya konu edilse de, şer'î hukuk uygulamaları müstakil ele alınmamıştır. Şeybânîlerin uyguladıkları Hanefî mezhebine dayanan fıkhi görüşler bölgedeki şer'î hukuk uygulamalarının dayanağını teşkil etmiştir. Mâverâünnehir'i hızlı bir fetih politikasıyla ele geçiren Şeybânîlerin hakimiyetlerinin erken tarihlerinde vakıflar hukuku ile ilgili fıkhî temelli uygulamalara rastlanmaktadır. Hüküm sürdükleri dönemin orta ve sonlarına doğru ise şer'î mahkemelerde özel hukuk alanlarını düzenleyen davaların kayıt altına alındığı görülmektedir. Bu kayıtlardaki \"şer'î kanun\" tabiri ile Hanefî mezhebi görüşlerinin esas alındığı şer'î hukuk uygulamaları ifade edilmektedir. Şeybânîler döneminde fıkıh uygulamaları dışında fıkıh eserlerinin telifi, medreselerdeki fıkıh eğitimi, güncel fıkhî konulara dair belge düzenleme çalışmalarının (şürût) yapıldığı da tespit edildiğinden bu hususlarla birlikte -şer'î hukuku temsil eden şeyhülislamlık, kadılık, sadrazamlık-gibi kurumların idari teşkilat içindeki yeri, görevleri, faaliyetleri, özellikleri, dönemin görevde bulunan şeyhülislam ve kadıları gibi önemli şahsiyetlere de çalışmamızda yer verilmiştir."
