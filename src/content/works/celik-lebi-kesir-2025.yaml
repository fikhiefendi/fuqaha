abstract: "Kur'ân, toplumda huzur ve güven ortamının sağlanması amacıyla kamu hukukunu ilgilendiren cezalarla ilgili birtakım düzenlemeler ortaya koymuştur. Müfessirler, bu konuların geçtiği âyetleri gerek yöntemlerine gerek mezhebî tercihlerine gerek de yaşadıkları çağların ihtiyaçlarına göre birbirinden farklı şekillerde tefsir etmişlerdir. Çalışmamızda bu müfessirlerden olan Saʻlebî ve İbn Kesîr'in ceza âyetleriyle ilgili yorumları ve yöntemleri ele alınmıştır. Giriş, üç bölüm ve sonuçtan oluşan bu çalışmanın; birinci bölümünde Kur'ân'da toplumsal düzen bağlamında ceza kavramı, ikinci bölümünde müfessirlerin ilmî hayatları ve rivayet kullanım usûlleri, üçüncü bölümünde ise karşılaştırma yöntemiyle kısas ve had cezaları başlıkları altında müfessirlerin ceza âyetlerine dair yorumları ve metodları incelenmiştir. Neticede müfessirlerimiz, yaşamış oldukları dönemlerin ve ilmî birikimlerinin etkisiyle eserlerini erken dönem rivayet tefsirlerinden farklı olarak kendilerine has üslûplarla ele almışlardır. Tefsirinde naklettiği rivayetlerin sıhhati üzerinden eleştirilen Saʻlebî, âyetlere yapmış olduğu dilbilimsel açıklamalarla lûgavî tefsir alanına büyük katkılarda bulunmuştur. Ancak el-Keşf'in rivayet tefsiri olarak sınıflandırılması, eserin bu yönünün arka planda kalmasına neden olmuştur. İbn Kesîr, tefsirinde Saʻlebî'den çok daha fazla rivayet nakletmesine rağmen müfessirin bu rivayetleri tenkide tabi tutması tefsirini güvenilir kılmıştır. Müfessir, rivayetlere olan bağlılığını korumakla birlikte nüzûl sebeplerine dayanarak anlamı teke indirmemiş, âyetleri daha genel kapsamlı değerlendirmiş tüm bunların sonucunda müellifin eseri rivayet tefsiri geleneğine yoğun malzeme olanağı sağlamıştır. Müfessirlerimiz ceza âyetleriyle belirlenen hükümlerin temel esasları üzerinde hemfikirdirler fakat müelliflerin yorumları ve tefsir yöntemlerindeki farklılıklar nedeniyle âyetlerin izahlarında ve cezaî yaptırımların ikincil hususlarında farklı sonuçlara ulaşmışlardır."
