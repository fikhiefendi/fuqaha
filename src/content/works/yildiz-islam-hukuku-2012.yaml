abstract: "Tez, bir giriş ve iki bölümden oluşmaktadır.Giriş kısmında tezin konusu, amacı ve yöntemi açıklanmıştır.Birinci bölümde nikâh kavramı üzerinde durulmuştur. Nikâh kavramının fıkıh kaynaklarındaki tariflerine yer verilmiş, nikâh akdinin rükûn ve şartları, neticeleri ve nikâhın hükmü incelenerek genel hatlarıyla ortaya konulmaya çalışılmıştır.İkinci bölümde velâyet hakkında genel bilgiler verilmiş olup velâyetin tanımı, Kur'ân'da ve hadislerdeki kullanım şekilleri ifade edilmiştir. Velâyetin kısımları, velilerin tertibi ve velide aranan şartlar ele alınmış, velâyeti düşüren durumlara açıklık getirilmeye çalışılmıştır.Nikâh akdinde velinin yetkisinin ele alındığı bu bölümde ayrıca ilk olarak bulûğa ermemiş çocukların evlendirilmesinde velinin yetkisi üzerinde durulmuş, tam ehliyetli kızların evliliğinde velinin yetkisi meselesi; velinin bâliğa olan bekâr kızını cebren evlendirmesi, kızın velisinden izinsiz evlenmesi ve kadının bizzat nikâh akdi yapması başlıkları altında incelenmiştir. Kadının evliliğinde velâyet yetkisi problemi nikâhta veliyi gerekli görmeyenler ile nikâhta veliyi gerekli görenler şeklinde ele alınmıştır.ANAHTAR KELİMELER1. Nikâh2. Veli3. Velâyet4. Ehliyet"
