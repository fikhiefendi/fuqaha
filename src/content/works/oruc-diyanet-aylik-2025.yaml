abstract: "Diyanet İşleri Başkanlığı'nın görev ve faaliyet alanı ilk olarak kuruluşunu sağlayan 429 sayılı kanunda belirtilmiştir. Diyanet İşleri Başkanlığı'na genel çerçevede verilen görev, insanlar arasındaki evlilik, ticaret, miras, vasiyet gibi hukuki çerçeve içerisinde olmayan konuların dışında kalan inanç ve ibadetlerle ilgili iş ve işlemlerin yürütülmesidir. Ayrıca Diyanet, ibadet yerleri ve buralarda görev yapan personelin idaresinden sorumlu tutulmuş, yayımcılık faaliyetlerini 1950'li yıllara kadar çok sınırlı sayıda ve türde yürütmüştür. 1956 yılında Diyanet İşleri Reisliği Mecmuası Ramazan Nüshası ve Diyanet İlmi Dergi ile başlayan Diyanet süreli yayıncılığı, 1968 yılında Diyanet Gazetesi, 1979 yılında Diyanet Çocuk Dergisi ile zenginleşmiştir. İlmi Dergi ile akademik camianın bilimsel birikimlerini hizmet alanlarına taşıyan Diyanet İşleri Başkanlığı, Çocuk Dergisi ile geleceğimiz olan çocukların seviyelerine uygun içerikler oluşturmuştur. İlk sayısı 1991 yılı ocak ayında yayımlanan ve Diyanet İşleri Başkanlığı'nın geniş yayın yelpazesi içerisinde yer alan Diyanet Aylık Dergi de toplumun dini bilgi düzeyinin artırılması başta olmak üzere gerek Başkanlık personelinin mesleki açıdan geliştirilmesi gerekse ülkemizin en uç noktalarında hizmet veren personeliyle kurumsal iletişimin sağlanması amacıyla yayınlanmaktadır. Dergi'nin ikinci sayısında Diyanet Aylık Dergi'nin ilk sayılardan itibaren hem dünya gündeminde yer alan dini konuları hem de diğer alanlarda yer alan konuları ve bu olayların Türkiye üzerindeki etkilerini içeriğine taşımayı amaçladığı belirtilmektedir. Bu sebeple çalışmamızda süreli yayın olarak yayınlanan Diyanet Aylık Dergi'nin ilk sayısından 2023 yılı aralık ayına kadar yayınlanan 396 adet basılı yayını incelenerek, Dergi'nin Türkiye ve dünya gündemini nasıl takip ettiği, İslâm Mezhepleri Tarihinin araştırma alanına giren belli başlı konuları sayılarında nasıl ele aldığı, yayımlandığı tarihlerdeki gündeme başlıkları ve ilgili makaleleri, sahih dini bilgiyi vatandaşlara güncel bir şekilde nasıl ulaştırmayı amaçladığı ortaya konulmaya çalışılmıştır. Çalışmamız kapsamında İslâm Mezhepleri Tarihinin inceleme alanına giren kavramlar tüm dergilerde taranarak tablo halinde sunulmuştur. Dergi'de yayımlanan toplam makale sayısı 7632'dir. İslâm Mezhepleri Tarihi ile alakalı 60 makale tespit edilmiştir. 33 yıllık gibi uzun bir sürede yayımlanan dergi külliyatı 10'ar yıllık bölümlere ayrılarak incelenmiş, makaleler üzerinde yer yer sebep – sonuç ilişkisi değerlendirmesi de yapılmıştır. Ayrıca Diyanet İşleri Başkanlığı'nın süreli ve süresiz yayınları yaparken toplumsal birliğin sağlanması amacını güttüğüne ve dergi içeriklerini oluştururken sadece ülke gündemi değil İslâm Mezhepleri Tarihi açısından Orta Doğu başta olmak üzere İslâm coğrafyasında gündemde olan konuları ve İslâmofobi çerçevesinde dünya üzerinde yer alan mezhepsel konuları gündemine taşıdığı da değerlendirilmiştir."
