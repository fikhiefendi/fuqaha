abstract: "Kanunlar, toplumun mutluluğu, huzuru, sağlıklı gelişimi ve ilerlemesi hedeflenerek hazırlanmaktadır. Bu amaçla ortaya konulan kanunların, toplumların ihtiyaçlarını en uygun şekilde karşılayacak nitelikte meydana getirildiği, genelgeçer bir anlayıştır. Bu husus, ilâhî kanunlarda olduğu gibi beşerî kanunların hazırlanmasında da geçerlidir. Geçen zamanla birlikte yaşanan yeniliklere ve gelişimlere bağlı olarak toplumların sosyal, ekonomik, siyasi, kültürel ve dini hayatlarında birtakım değişiklikler olduğu izahtan varestedir. İşte bu sebepten dolayı yeni hükümleri tebliğ etme göreviyle gönderilen peygamberler, içinde bulundukları şartlara yönelik olarak dinin uygulamalı hükümleri açısından yepyeni hükümler getirmişlerdir. Hükümlerdeki bu değişimler ilâhî vahye dayalı dinler arasında olabildiği gibi, tek bir şerîatın hükümleri arasında da gerçekleşmiştir. Hukukî açıdan makûl bir durum olan bu değişim, İslâmî literatürde \"nesh\" ile ifade edilmiştir. Nesh, tarihî seyri itibariyle farklı açılardan farklı ilmî disiplinlere konu olmuştur. Bu tarihî süreç içerisinde konu, spesifik olarak sadece bir mezhebin bakış açısı ve mezhep içi değerlendirmesi açısından incelenmemiştir. Bu itibarla neshin Şâfiî mezhebi usûl ve fürû-u fıkıh açısından incelenmesine bir ihtiyaç olduğu görülmüştür. Bu çalışmada neshin var olup olmadığı tartışmalarına fazlaca girilmemiştir. Şâfiî usûl geleneğinde İmâm Şâfiî'ye muhâlefetin en ciddi olduğu yer olan nesh konusunun Şâfiî mezhebi ekseninde metodolojik olarak nasıl incelendiği ve fürûa yansımasının nasıl olduğunun tespiti hedeflenmiştir. Belirlenen bu hedef doğrultusunda öncelikle Şâfiî mezhebi fıkıh usûlu kitaplarında nesh ile ilgili ele alınan hususlar ve neshin gerçekleşmesi için öne sürülen şartlar üzerinde durulmuş, ardından neshin fürû-u fıkha yansıması ve mensûh olduğu söylenen âyetlerin fürûda ele alınışı delilleriyle birlikte incelenmiştir. Ana konusu Kur'ân ve sünnet nasları olan nesh, ilk kez Kur'ân ile gündeme gelen bir mesele değildir. Sahâbe ve tâbiûna ait rivâyetlerde konuya atıfların olması Müslümanların ilk kuşaktan itibaren konunun farkında olduklarını ve neshle ilgili kavramsal bir algının var olduğunu göstermektedir. Tespitimize göre nasların nüzûl/vürûdlarının yaklaşık yirmi üç yıllık bir zamana yayılması, zorunlu olarak neshin varlığını gerekli kılmaktadır. Dolayısıyla nesh, derin tarihi köklerinden dolayı reddedilmeyen fakat sınırlandırılması gereken bir olgu olarak algılanmalıdır, düşüncesindeyiz."
