abstract: "318 ÖZET Özmen, Ramazan, Hanbelî Mezhebi Fıkıh Usulenlerinim Hadis/Sünnet Metodolojisi.. Doktora Teri, Danışman; Prof. Dr. Mehmet Hayri Kırbaşoğlu, XXVIII- 319 sayfa. Hanbeü Mezhebi Fıkıh Usûlcüterinin Hadis/Sünnet Metodolojisi adlı tezimizi şu şekilde özetlememiz mümkündür: Tezimiz bir giriş, iki bölüm, sonuç ve bibliyografya kısımlarından müteşekkildir. Girişte Hanbeülik üzerine yapılan çalışmaları ve Hanbeü usûl literatürünün doğuşu ve gelişimini ele akük. Tezin birinci bölümünde genel olarak, Hanbeü mezhebine mensup fıkıh usâlcülerinin haberle ilgili meselelere yaklaşım tarzları ortaya konmaya çalışılmıştır. Burada ük önce Hanbeü usâlcülerin haber anlayışları ele alınmış olup, onların haber tarifleri üzerinde durulmuştur. Bu bölümde ağırlıklı olarak işlenen diğer konular ise, haberlerin sened açısından taksimi, haberlerin reddini gerektiren ve gerektirmeyen sebeplerdir. Hanbeü usûlcüler haberleri sened açısından mütevâtir ve âhâd olmak üzere ikiye ayırırlar. Onların geneline göre mütevâtir haberlerden hâsıl olan bilgi zorunlu bir bilgidir. Ancak âhâd haberlerden hâsıl olan bilgi ise zorunlu bir bilgi değil, zannî bir bilgidir. Böyle olmakla birlikte Hanbeü usûlcüler, âhâd haberlerle amel edilmesinin gerekliliği üzerinde ısrarla dururlar ve âhâd haberlerin delil olma değerini öne sürdükleri dînî ve akü delillerle ispat etmeye çakşırlar. Hanbeü usülcülere göre, âhâd haberlerle şahitlikleri ispat edildiği sürece mutlaka amel edilmelidir. Meselâ onlara göre, asıllara veya kıyasa muhalif olsa dahi âhâd haberlerle amel edilmesi gerekir. Umûmî belvâ konusunda vâridolan âhâd haberlerle de ameİ edilir. Hanbeü usûlcüler haberlerin red gerekçeleri ile ilgili olarak, pratikte uygulanıp uygulanmadığı ayrıca test edilmesi gereken sağlam kriterler belirlemişlerdir. Meselâ onlara göre bir haberin aklın verilerine aykırı olması o haberin asılsız olduğunu gösterir. Veya bir haberin Kur'an 'm zahirine ve mütevâtir sünnete aykırı olması da bir haberin reddi için yeterü bir nedendir. Hanbeü usûlcüler haberler arasında tercih meselesini 'senedle ilgili tercih nedenleri', 'metinle ilgili tercih nedenleri' ve 'sened ve metinle ilgili olmayan tercih nedenleri' olmak üzere üç başlık altında incelerler. Tezimizin ikinci bölümünde ise râvî ve rivayetle ilgili meseleler ele alınmıştır. Burada haber rivayet edem râvînin taşıması gereken vasıflar, râvîde aranmayan şartlar ve kendilerinden hadis alınması caiz olmayan kişiler meselesi gibi konulara değinilmiştir. Ayrıca bu bölümde cerh-ta'dü ile ilgili meseleler, sahabe' a in tarifi, sahâbe'nin adaleti ve sahâbe'nin hadis rivayet ile ilgili iafdeleri gibi konulara da yer verilmiştir, fine bu bölümde ele alman diğer bir konu ise hadis tahammül yollarıdır. Bu bölümde ağırlıklı olarak işlenen diğer konular ise, mürsel rivayetler, müdeUes rivayetler, zayıf hadisle amel, hadiste takû', hadiste ziyâde ve hadislerin mânâ ile rivayeti gibi konulardır"
