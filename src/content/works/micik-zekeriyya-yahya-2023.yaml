abstract: "İmâm-ı Nevevî (ö. 676/1277) hem hadis hafızı hem muhaddistir. Aynı zamanda takvâ sahibi, zâhid, âbid, mutasavvıf bir kişiliktir. Yaşadığı dönemde Şâfiî fıkhının en büyük âlimi olarak bilinir. Moğol ve Haçlı saldırılarının olduğu, İslâm coğrafyasının birtakım sorunlar geçirdiği dönemde yaşamış bir ilim ve düşünce adamıdır. Faaliyetlerini ilmî çerçevede yürütmesi, zâhidâne hayatı tercih etmesi ile örnek teşkil etmiştir. Yaşadığı sürece İslâmî çizgisinden ödün vermemiştir. Bu tezde İslâmî ilimlerde özellikle de hadis ve fıkıh alanlarında otorite sahibi olan, telif ettiği eserlerle büyük bir üne kavuşan İmâm-ı Nevevî'nin hadis ve tasavvuf alanında yazmış olduğu eserlerinden hareketle tasavvuf anlayışını ele almaya çalıştık."
