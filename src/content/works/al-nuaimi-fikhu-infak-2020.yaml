abstract: "Tezin adı İslam Hukukunda İnfak ve Sonuçları'dır. Bu tezde çalışmanın ilkelerini, sorunlarını ve amaçlarını ana başlıklarıyla ele aldık. Tezin başında infakın sözlük ve terim anlamını açıkladık, konuyla ilgili Kur'an ve sünnetten delliler zikrettik. Ardından da İslam İktisadında infakın çeşitleri, toplumdaki önemi ve diğer vezî sistemlere olan üstünlüğü hakkında bilgi verdik. Ayrıca devletin yaptığı harcamalar ve İslam hukukunun konuya bakışını ele aldık. Sonra da konunun genel çerçevesini sunmak için, çalışmanın temelini oluşturan, kendilerine zekât verilen sekiz sınıfı açıkladık, zekâtın hükmü ve faidelerine değindik. Bu konuları ele alırken ayrıca zekâtın İslam ekonomisinde önemli bir gelir kaynağı olduğunu da vurguladık. Zekâtın toplumdaki yeri, insanlara sunduğu insani ve ahlakî amaçlarını da“İnfakın sonuçları”başlığı altında ele aldık. Çalışmanın temellerinin açıklanması için İslami ekonomisinin genel infak kurallarını ayrıntılı bir şekilde açıkladık. Çalışmayı üç kategoride ele aldık: Birincisi, önceliği dikkate alarak infakın sıralanmasıdır. İkicisi, İslam ilkelerine göre mali dengenin ekonomik dengenin korunmasındaki rolüdir; zira, söz konusu dengesizlik devletin mali ekonomik sisteminin bozulmasına neden olur. Üçüncüsü ise, kişisel, bölgesel ve merkezi düzeyde infaklarda adaletin teşvik edilmesidir. Çünkü adalet ve denge güveni sağlamaktadır. Adalet, toplumun fertleri arasında ekonomik dengenin gerçekleştirilmesi için önemli bir husustur. İnfak politikasının İslam ekonomik sisteminde, devlet ve toplum içerisindeki önem ve etkisi açıktır. Bu nedenle mali politikanın anlamını, unsurlarını, temellerini, fert ve topluma olan etkisini ve sonuçlarını açıkladık. Ayrıca infakın üretim, tüketim ve yatırıma olan etkisine de değindik."
