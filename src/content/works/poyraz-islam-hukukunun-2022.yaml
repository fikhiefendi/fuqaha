abstract: "Fakîhin, herhangi bir şer'î-fer'î hükme ulaşmada olanca gücünü sarf etmesi anlamına gelen ictihad, müctehid adı verilen ehil kişilerce yerine getirilen bir faaliyettir. Gerek naslara, gerek Arap diline ait bazı hususiyetler, gerekse müctehidlerin akıl ve tabiatlarının farklı oluşu gibi sebepler birtakım görüş ayrılıklarını beraberinde getirmiştir. Ayrıca, farklı bir delile ulaşma, örfe ve maslahata müstenit hükümlerde örfün ve maslahatın değişmesi gibi durumlara binaen müctehidin, ictihadını değiştirmesi caiz ve vakidir. Söz konusu sebeplere ilaveten fıkhın kazâ kurumuna intikali ile de hâkimlerin birbirlerine muhalif ictihadlarda bulunması,“farklı ictihadlar birbirini nakzeder mi”sorusunu gündeme getirmiştir. İctihadın nakzı, ictihadla ulaşılan eski hükmün nâfiz ve kesinleşmiş olduktan sonra bozulması ve iptal edilmesi anlamına gelmektedir. İctihadın nakzının iki türü vardır. Bunlardan ilki, bir müctehidin amele dökülmüş olan kendi ictihadını nakzetmesi iken ikincisi müctehidin bir başka müctehidin ictihadını nakzetmesidir. İctihadın başka bir ictihadla nakzedilememesi, ictihada açık meseleler üzerinde yapılan ictihadlarla ilgilidir. Mahalli dışında yapılan ictihadların nakzedilmesi konusunda ise görüş ayrılığı bulunmamaktadır. Ayrıca ictihadın başka bir ictihadı nakzetmesi, ictihadın sırf ictihad olarak ele alınmasına bağlıdır. İctihada kuvvet kazandıran ilave vasıfların eklenmesi ise durumu değiştirmektedir. Usûlcüler, ictihadın nakzına ilişkin iki farklı görüş üzere ihtilaf etmişlerdir. Çoğunluk ictihadın nakzını kabul etmezken bir kısım usûlcüler ise ictihadın ictihadı nakzedebileceği görüşünü benimsemişlerdir. Kaynaklarda, ictihadın ictihadla nakzedilebileceği görüşü İbn Uleyye (öl. 193/809), Ebûbekir el-Esam (öl. 200/816) ve Bişr el-Merîsî'ye (öl. 218/833) nispet edilmektedir. Onların bu görüşe sahip olmalarına, ictihadî meseleye dair tek bir hükmün ve bu hükme götüren kat'î bir delilin mevcut olduğu anlayışı sebep gösterilmiştir. Zira ictihada mesnet teşkil eden delil kat'î olduğu için, bu delile muhalif görüşte bulunanlar mutlak olarak hatalı konuma düşmektedirler. Böylece hatalı görüşün nakzedilmesinin meşrûiyet zemini oluşturulmuş olmaktadır. Nakzı kabul etmeyenler ise Hanefî, Mâlîkî, Şafiî ve Hanbelî usûlcülerdir. Söz konusu usûlcüler, her ne kadar ictihadın bir başka ictihadla nakzedilemeyeceğini savunsalar da meseleye dair aralarında bazı görüş ayrılıkları cereyan etmiştir. İctihadın nakzı meselesi, çeşitli vesilelerle ilk dönem fürû-i fıkıh literatüründe kendisine yer bulmuş ve zaman içerisinde kâideleşme sürecine girmiştir. Günümüze ulaşmış eserler içerisinde, meseleye kâide formunda ilk defa yer veren, 4./10. asırda yaşamış Hanefî fakîh ve usûlcü Ebü'l-Hasen el-Kerhî'dir (öl. 340/952). Kerhî kâideye, Hanefî imamların ictihadlarında dayandıkları genel ilke ve kâideleri tespit amacıyla kaleme aldığı risalesinde yer vermiş ve onu“İctihadla karar kılınan bir hüküm benzeri bir ictihadla feshedilemez, ancak nasla feshedilir”şeklinde ifade etmiştir. Kâide daha sonraki süreçte ağırlıklı olarak“ictihad ile ictihad nakzolunmaz”şeklinde ifade edilerek yerleşik hale gelmiş ve Mecelle'nin küllî kâideleri arasında kendine yer bulmuştur. Hukukî istikrarı temin eden en önemli konuların başında gelen ictihadın nakzı meselesi her dönem için güncelleğini korumaktadır. Dolayısıyla konuya dair yapılacak bir çalışma İslam hukukunun dinamik ve istikrarlı yapısını ortaya koyması açısından önem arzetmektedir. Bu çalışmada ictihadın nakzı meselesi hem usûl hem de kavâid literatürü bağlamında detaylı bir biçimde ortaya konulmaya gayret edilmiştir. Çalışma, iki bölümden oluşmaktadır. Birinci bölümde konunun kavramsal çerçevesi çizilmiş ve konu fıkıh usûlü bağlamında ele alınmıştır. İkinci bölümde ise“ictihad ile ictihad nakzolunmaz”küllî kâidesinin tarihî seyri gösterilmiş ve teorik çerçevesi belirlenmiştir."
