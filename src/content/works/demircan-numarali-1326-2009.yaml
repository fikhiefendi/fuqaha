abstract: "Yargı yetkisine sahip olan kadıların vermiş oldukları kararları, tuttukları zapıtları, idarî, siyasî ve hukukî yazışmaları içeren tarihî vesikalar olan şer'iye sicilleri, XV. yüzyılın ikinci yarısıyla XX. yüzyılın ilk çeyreği arsındaki döneme ait Osmanlı tarihi ve kültürünün ilk elden kaynaklarıdır.Çalışmamızın temel kaynağı olan Kırşehir Şer'iye Sicilleri'nin mikrofilmleri, Ankara Milli Kütüphane'de bulunmaktadır. 20 Numaralı Kırşehir Şer'iye Sicili, Milli Kütüphane'den fotokopi yoluyla temin edilmiş olup, hacimli olması nedeniyle ilk 93 sayfalık kısmı teze alınmış ve 20/1 Numaralı (H. 1326-1327/ M. 1908-1909) Kırşehir Şer'iye Sicilinin Transkripsiyon ve Değerlendirilmesi adıyla günümüz harflerine çevrilmiş, değerlendirilmiş ve kaynakça taraması yapılmıştır. Ayrıca bütün belgeler konularına göre tasnif edilmiştir. Tezin sonunda yer alan ekler kısmında teze konu olan sicilin orjinali fotokopi ile çoğaltılarak bir nüsha halinde verilmiştir.Bütün bu düşünce ve çalışmalar sonucunda Kırşehir'in ve aynı zamanda Osmanlı Devleti'nin idari, içtimai, siyasi, askeri ve iktisadi tarihine ışık tutabilecek bilgiler elde edilmiştir."
