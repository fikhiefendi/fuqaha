abstract: "vııı ÖZET Günümüze kadar Kırım-Kongo kanamalı ateşi (KKKA)'nin patogenezinde sitokinlerin rolü netlik kazanmamıştır. Biz burada KKKA hastalarının serum virüs titreleri, sitokin seviyelerini araştırdık. Ribavirin, KKKA hastalığı için potansiyel bir terapötik ajan olduğu düşünülen antiviral bir ilaçtır. Biz, ayrıca KKKA hastalarında serum virüs titresi ve sitokin seviyeleri üzerine oral ribavirin tedavisinin etkinliğini de değerlendirdik. Bu çalışmaya 2005 yılında, KKKA salgım esnasmda Sivas Cumhuriyet Üniversitesi Hastanesine KKKA hastalığım düşündüren akut infeksiyon tablosu ile başvuran hastalar dahil edildi. Tüm hastalardan gelişde ve takip edildiği 7 gün süresince uygun şekilde seroloji, viroloji ve sitokin analizleri için serum örnekleri toplandı. Ek olarak tüm hastalarda rutin kan ve biyokimyasal tetkikler çalışıldı. KKKA virüs antijeni real time RT-PCR ile çalışıldı, KKKA spesifik IgM ve IgG antikorları ve serum sitokin seviyeleri ELÎSA ile ölçüldü. Hastalardan çalışmaya sadece viral RNA pozitif olan hastalar dahil edildi. Onbeş sağlıklı kontrol bireyi alındı. Gelişde uzamış INR değeri (INR>1.4) ve şuur değişikliği olan vakalar şiddetli vaka olarak kabul edilip oral ribavirin tedavisi başlandı. Tedavi almayan hastalar kontrol gurubu olarak alındı. Toplam 31 hastanın KKKA nedeniyle kaybedilen 11 vakası değerlendirildi, ölen vakalarda başlangıç virüs titresi 5.5E+09 copy/ml, yaşayanlarda ise 5.7E+08 copy/ml idi (P 0.05). Biz genellikle, kontrol gurubu ile karşılaştırıldığında ardışık serum örneklerinde ne virüs yükü ne de serum sitokin seviyeleri ve rutin laboratuar testlerinde ribavirin tedavisinin etkin olmadığım gözlemledik. Bu çalışma, serum virüs titreleri ve sitokin fırtınasının, KKKA patogenezinde önemli bir rol oynadığım göstermiştir. Hem inflamatuar cevap hem de virüse özgül bağışıklık ölümle ile ilişkili olabilir ve ribavirin KKKA' da serum virüs titresi üzerinde önemli bir etkiye sahip değildir."
