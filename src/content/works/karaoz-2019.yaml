abstract: "Bu çalışma anayasa hukukunda güçler ayrımı ilkesi bu ilkenin İslâm siyasi fıkhı, Ürdün ve Türkiye anayasalarındaki konumunu ele alır. Araştırmacı, giriş bölümünde güçler ayrımı ilkesinin tarifi, oluşumu, ortaya çıkış gerekçelerine ve ilke hakkındaki eleştirilere değinmektedir. Birinci bölümde ise, yasama-yürütme-yargı güçlerini anayasa hukuku ve İslâm siyasi fıkhıyla karşılaştırmaktadır. İkinci bölümde araştırmacı yasama-yürütme-yargı güçlerinin Ürdün ve Türkiye anayasalarında yerini ortaya koyarak güçler ayrımı ilkesini bu iki anayasada işlemektedir. Son olarak araştırmacı üçüncü bölümde güçler ayrımı ilkesinin İslam siyasi fıkhı ile Ürdün ve Türkiye anayasaları arasındaki karşılaştırmasını yapmaktadır."
