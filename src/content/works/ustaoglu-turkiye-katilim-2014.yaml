abstract: "Dünyada büyük bir gelişim sürecine giren faizsiz bankacılık; 1970'li yıllarda pratiğe aktarılmış olup; ilk olarak 1976 yılında Mısır' da uygulama alanı bulmuştur. 'Faizsiz Bankacılık' adı altında yaygınlaşan katılım bankaları, başlangıçta müslüman ülkelerde faaliyet gösterirken, bugün farklı ihtiyaçların karşılanması noktasında tüm dünyada önem arz eden bir işlevsellik kazanmıştır. Faizsiz bankacılık sistemi ekonomik hayatımıza yaklaşık 30 yıl önce 1983 yılında çıkarılan yasa ile giriş yapmıştır. Çıkartılan Kanun Hükmünde Kararname ile ilk faizsiz banka“Özel Finans Kurumu”adıyla kurulmuş olup, sonrasında 5411 sayılı bankacılık kanununda yapılan değişikle bu kurumların adı“Katılım Bankaları”olarak değiştirilerek günümüze kadar bu şekliyle, gelişerek gelmiştir. Ülkemizde katılım bankaları özellikle 2001 yılından sonra büyük bir ivme kazanmış olup, ticari bankalar ile rekabet edebilir hale gelmiştir. Bunda katılım bankalarının, Bankalar Kanununa tabi ve ticari bankalar ile mevzuat bakımından eşit haklara sahip olmasının büyük etkisi vardır. İşbu çalışmada Türk bankacılık sistemi içerisinde katılım bankacılığının yeri, sistemde yer alan diğer bankalarla olan ilişkisi değişik açılardan ele alınarak; tüm dünyadaki finansal entegrasyon ve tasarrufların değerlendirilmesi ihtiyacı sonucu gelişme gösteren katılım bankacılığına ışık tutulmaya çalışılacaktır."
