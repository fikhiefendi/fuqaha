abstract: "“Emir”in mahiyeti ve emirle ilgili meseleler, İslam hukuk düşüncesinin felsefi ve metodolojik temellerini inceleyen fıkıh usulü eserlerinde ilk dönemlerden itibaren en fazla tartışılan konular arasında yer almıştır. Belirli karînelerin bulunması durumunda emirden çıkarılacak anlamın daha çok bu karîneler ışığında tespit edileceği genel bir kabul görmekle birlikte, usul bilginlerince karînelerden soyutlanmış (mutlak) emrin mûcebi hususunda ilkesel bir tavır belirlenmesi önemli görülmüş ve bu çerçevede ayrıntılı tartışmalar cereyan etmiştir. Bu bağlamda, bazı mütekaddimîn dönemi Eş'arî ve Mu'tezilî usul bilginlerinin görüşleri ile alakalı -gerek ileriki dönem klasik usul eserlerinde gerekse muasır yayınlarda- farklı bilgilerin yer aldığı görülmektedir. Günümüzde bu bilginlere veya onlara en yakın dönemde yaşamış müelliflere ait eserlerin ilmî neşirlerinin yapılmış olması, bu konuda araştırmacılara daha güvenilir tespitler yapabilme imkânı sağlamıştır. Bu nedenle, tezimizde Mütekaddimîn dönemi Eş'arî ve Mu'tezilî usul eserlerinde yer alan emrin mûcebi ile ilgili tartışmalar ele alınmış ve bu tartışmalar ışığında, bazı usul bilginerinin görüşlerine açıklık getirilmeye çalışılırken usul düşüncesi bakımından da bazı değerlendirmeler yapılmıştır."
