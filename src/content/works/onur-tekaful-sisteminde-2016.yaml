abstract: "İnsanlık tarihi boyunca şahıslar, risklerini pek çok kişiye yayma çabası içinde olmuşlardır. 14. yüzyılda Batı'da oluşturulan sigorta, böyle bir çabanın ürünüdür. Müslüman coğrafyada ilk dönemlerden sonra yaşanan yardımlaşma boşluğu, son dönemde sigorta ile kapatılmaya çalışılmıştır. Fakat incelemeye alınan sigorta akdi, çoğunluk muasır alim tarafından İslam hukukuna muhalif bulunmuştur. Sigortaya alternatif olarak araştırmalar ve sempozyumlar neticesi meydana getirilen tekâfül sistemi ise İslam hukukuna uygun bir şekilde 20. yüzyılda oluşturulmuştur. Bu tezde tekâfül sistemi vekalet ve mudarabe akitleri çerçevesinde tanıtılmakta, konvansiyonel sigorta ile karşılaştırılmakta ve vekalet ve mudarabe akitlerinin sistemde uygulamasına yer verilmektedir. Öte yandan tekâfül sisteminde uygulanan vekalet ve mudarabe akitlerine yöneltilen tenkitler ele alınmaktadır. Sonuçta sistemde uygulanan vekalet ve mudarabe akitlerinin İslam hukukuna muhalif olmadığına kanaat getirilmektedir."
