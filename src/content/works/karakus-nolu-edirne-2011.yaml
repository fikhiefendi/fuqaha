abstract: "Osmanlı tarihi araştırmalarının en önemli kaynaklarından Şer?iyye Sicillerine dayanarak yapılan bu tez, 270 Nolu Edirne Şer?iyye Sicilinin ihtiva ettiği belgeler ışığında hazırlanmıştır. Edirne şehri, kadılık müessesesi ve Şer?iyye Sicilleri hakkında bilgi verildikten sonra 1801-1803 yıllarına ait 208 belgenin bulunduğu defter transkribe edilmiş, belge özetleri yapılarak, belgeler türlerine ve konulara göre tasnife tabi tutulmuştur. Ortaya çıkan bilgi ve belgeler değerlendirilerek 1801-1803 yıllarında Edirne ve Rumeli'deki durum ortaya konulmaya çalışılmıştır.Sicill-i Mahfuz Defterlü olarak tutulan defterde merkezden gelen ferman, buyruldu gibi kayıtlar ve bunların gereği yazılan önemli belgeler mevcuttur. Rumeli'deki isyanların mahiyeti ile Edirne'ye etkisinin detaylarıyla gözlemlenebildiği çalışmada; Rumeli Valisi Hakkı Paşa'nın müsadere edilen mal varlığı listesi, Edirne'nin 162 mahalle ve 253 köyünün listesi, Edirne şehrinin gün gün 1,5 yıllık masrafları, bölgedeki görevliler, Edirne'nin şehir kapıları ve derinlemesine araştırılmayı gerektirir bilgiler tespit edilmiştir."
