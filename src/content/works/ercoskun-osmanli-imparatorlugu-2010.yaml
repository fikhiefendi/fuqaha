abstract: "Osmanlı Devleti'nde diğer tüm toplumlarda olduğu gibi evlenme, devletin kuruluşundan beri önemle üzerinde durulan sosyal bir kurum olarak karşımıza çıkmaktadır. İslam hukukunun temel kurallarına göre devletin bir müdahalesinin olmaması gerekirken, gelenek ve örfün etkisiyle evlenme ve nikâhların başlangıçtan itibaren düzenlendiği görülmektedir. Söz kesme, nişan ve nikâhın nasıl yapılacağı, yaşanan sorunların nasıl giderildiği genel hatlarıyla ele alınmıştır. Ne var ki sorunların devam etmesiyle birlikte düzenleme girişimleri de olmuş, Tanzimat'ın ilanıyla yeni bir safhaya girmiştir. Çağdaşlaşma sürecinin başladığı 19. yüzyılın ilk yarısından itibaren toplumu ilgilendiren, çeşitli alanlarda kalıcı ve köklü değişikliklerin yapıldığı bilinmektedir. Bununla birlikte, evlenme ve nikâhta süregelen sorunların çözümüne yönelik yasal düzenlemelerin yanı sıra yörelerin özelliğine göre, yerel önlemlerin de alındığına ilişkin önemli bilgi ve belgeye ulaşılmıştır.Bu bilgi ve belgeler değerlendirildiğinde, başta nüfus artışını sağlamak olmak üzere, halkın refahının önünde bir engel olarak görülen düğünlerde gereğinden fazla harcama ve masrafların yapılmamasına özen gösterilmişti. Bütün çabalara karşın yaşanan sorunlara çözüm getirmekte kalıcı olamamıştır. Tanzimat sürecinde her alanda olduğu gibi bu konuyla ilgili olarak da nizamnameler çıkarılmış, bölgelerin özelliği de göz önünde bulundurularak düzenlemelere gidilmişse de, istenilen amaca varılamamıştır.Meşrutiyet'in ilanıyla birlikte, aile hukukunu ilgilendiren evliliklerin her dinin kendi kurallarınca belirlendiği göz önünde tutularak kanunlaştırmanın yani Mecelle'nin dışında tutulmasına rağmen, uyrukluk kanunu, İranlılarla evlenme yasağının sürdürülmesi, sicill-i nüfus nizamnameleri gibi bir dizi düzenlemeyle evliliklerin nasıl yapılacağına dair kurallar konulmuştur. Bu çabalardan da istenilen sonuç alınamayınca 1917'de Hukuk-i Aile Kararnamesiyle kesin çözüm getirilmek istenmişti."
