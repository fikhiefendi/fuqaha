abstract: "Elektronik ödeme araçları aracılığıyla yapılan altın alım satım işlemlerinin İslam hukuku açısından değerlendirilmesinin yapıldığı bu araştırmada, teknoloji çağının yeni ödeme araçlarının nitelikleri özellikle de alışveriş işlem süreçleri irdelenerek sarf akdinin temel kurallarına uygunluğu tespit edilmeye çalışılmıştır. Tespit edebildiğimiz kadarıyla şimdiye kadar elektronik ödeme araçları bağlamında her hangi bir çalışmanın mevcut olmaması bu konunun çalışmasında etkili olmuştur. Bu nedenle sarf akdinin temel kurallarına uygunluğunun tespiti açısından e-ödeme araçlarının her birinin müstakil olarak incelenmesi yerinde olacaktır. Araştırmanının birinci bölümünde; kavramsal ve teorik çerçevede sarf akdinin kendisine özgü temel kuralları, e-ticaret açısından sarf akdiyle ilgili olan diğer akitler ile elektronik ticaretin araçları özellikle de ödeme araçları ele alınmıştır. İkinci bölümde ise elektronik ödeme araçlarının her biri kendi başlığı altında bir değerlendirmeye tabi tutulmuştur. Sonuç kısmında kartlı ya da kartsız ödeme araçlarının işlevleri ve işlem süreçlerinin birbirinden farklı olması sebebiyle, her biriyle yapılan sarf sözleşmelerinin fıkhî sonucunun farklı olacağı beyan edilmiştir."
