abstract: "ÖZET Tez, İbn Rüşd'ün hukuki yönünü, özellikle onun“Bidayetü'l-Müctehid ve Nihayetti' l-Muktesıd”adlı eserinden hareketle ortaya koymayı amaçlayan bir çalışmadır. Giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde İbn Rüşd'ün yaşadığı siyasi ve ilmi çevre ile onun hayatı ve eserleri üzerinde durulmuştur. Birinci bölümde, İbn Rüşd'ün Hukuki metodu ve görüşleri, onun Bidayetü'l- Müctehid ile Muhtasaru'l-Mustasfa adlı eserinden faydalanılarak incelenmiş, gerek hukuki tercihleri, gerekse kendine has yorumları, tespit edilmeye çalışılmıştır. İkinci Bölüm, İbn Rüşd'ün Bidayetü'l-Müctehid adlı eserinin tahlilini içermektedir. Eserin bir ihtilaf kitabı olmasından dolayı, ihtilaf kitapları ve Bidayetü'l- Müctehid'in bu kitaplar içerisindeki konumu ve önemi üzerinde de durulmuştur. İkinci bölüm, eserin kaynakları hakkında verilen bilgilerle tamamlanmaktadır. Seksen yedi sayfadan oluşan tez, genel bir değerlendirmenin yapıldığı sonuç bölümünün ardından, bibliyografya ile bitmektedir."
