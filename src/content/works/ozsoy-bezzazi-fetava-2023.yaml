abstract: "Bu çalışma, Muhammed b. Muhammed b. Şihâb el-Kerderî el-Hârizmî el-Bezzâzî (v. 827/1424) isimli Hanefi bir alimin,“el-Fetâva'l-Bezzâziyye”ismiyle meşhur olmuş fetâvâ kitabındaki ukûbât bahislerinin incelemesini ve bu bahislerin Hanefi fıkıh literatürüne olan etkilerini konu edinmektedir. İnceleme faaliyetinin, Hanefi mezhebine ait bir fetâvâ metninde yapılması, mezhebin klasik dönem fetâvâ isimli metinlerinin ukûbât alanındaki işlevlerini, temsil niteliği yüksek bir metin üzerinden örneklendirmeyi amaçlamaktadır. Zira klasik Hanefi literatürde fetâvâ ismiyle meşhur olan pek çok metin, mahzâ soru-cevap usulünde yazılmış fetva kitaplarından farklı olarak tanım, taksim, tartışma ve anekdot gibi unsurlar da içermektedir. Ayrıca hem mezhep imamlarından hem de daha sonra gelen Hanefi fukahâdan ve yazıldığı dönemin alimlerinden aktarılan çeşitli fetvaları aynı anda içerebilmektedir. Bu şekildeki bir metinler topluluğunda suç ve ceza konularının seyrini incelemek önemli bir faaliyet olmalıdır. Hanefi literatürde ukûbât bahisleri ile ilgili çokça atıf yapılan ve iktibasta bulunulan Bezzâzîyye metninin müellifi, hicri VIII. yüzyılın sonu ile IX. yüzyılın başında bir Türk-Moğol İslam devleti olan Altın Orda Hanlığı'nda yaşamıştır. Bu dönemde, İslam dünyasında çeşitli iç karışıklıklar ve fitneler yaşanmaktadır. Müellif bu hareketli dönemde, Altın Orda toprakları ve ayrıca Anadolu coğrafyasında bulunarak, döneminin meşhur uleması ile hoca, akran ve talebelik ilişkisi içerisinde olmuştur. Böylece fürû-ı fıkıh alanında ulema arasında önemli derecede temayüz etmiştir. Yazmış olduğu metinlerle, Hanefi fıkıh literatüründen ibâdât, muâmelât ve ukûbât olarak fıkıh ilminin tüm bilgi alanlarında çok sayıda atıflar almıştır."
