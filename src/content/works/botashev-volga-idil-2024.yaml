abstract: "Volga Bulgar devleti eski Türk devletlerinden biridir. Altıncı asırda ortaya çıkarak XIII. asra kadar varlığını devam ettirmiştir. Bu devleti mühim kılan birkaç husus bulunmaktadır. Volgalıların m. 922'de İslam dinini benimsemeleri dönüm noktası olmuştur. İslam'la beraber hukuk alanında yenilikler gelmiş ve eski kültürün etkisiyle farklı bir bakış açısı sergilenmiştir. Volga devleti, ilk Türk-İslam devletlerden biri olması da kayda değer. İdil bölgesinin halifeliğin ve İslam coğrafyasının en kuzey bölgesinde yer alması ayrı bir değer katmıştır. Arap ve diğer İslam coğrafyalarında bulunmayan özellikler bu bölgede görülmüştür. Yatsı namazının vaktinin oluşmaması meselesi ilk defa bu topraklarda ortaya çıkmıştır. Günümüz uleması hâlen bu meseleye çözüm aramaktadır."
