abstract: "Fakihler geçmişten günümüze dinî amelî birçok konuda ihtilaf etmişlerdir. Bu ihtilafın çok sayıda sebebi bulunmakla birlikte, bunların en önemlisi şüphesiz ki deliller arasındaki teâruz faktörüdür. İlahi hikmet bazı nasların arasında zahiren teâruzamahal vermek suretiyle bu durumun müçtehitler arasında ihtilafa yol açmasını ve bu ihtilafın amelî konularda ümmet hakkında rahmet ve kolaylığa vesile olmasını sağlamıştır. Ancak bu konudaki içtihat-ihtilafların ümmet hakkında rahmet olması için içtihadın ehil kimselerden sadır olması, açık naslarla ve usul kurallarıyla çatışmaması şarttır. Bu kapsamda usulcüler naslar arasındaki teâruz problemini ve teâruzu giderme yöntemlerini ele almış, dinin özünde bir teâruzun ya da çelişkinin bulunmadığını, naslar arasındaki teâruzunise zahiri olduğunu, yalnızca müçtehidin nazarında varlık kazandığını ve bu teâruzun cem-telif, nesh veya tercih yöntemiyle ortadan kalktığını ispatlamışlardır. Ancak naslar arasındaki teâruzu giderme yöntemleri teorik açıdan ana hatlarıyla arz edilen başlıklar altında toplanmakla birlikte, pratik açıdan naslar arasındaki teâruzu gidermek içtihadî bir husustur. Nitekim muarız naslar arasında bir haberi diğerine tercih etme sebepleri uygulamada bir müçtehitten diğerine farklılaşaniçtihadî bir mahiyettedir. İçtihadın olduğu yerde ihtilaf olduğundan, bu durum dinin amelî hükümlerinin birçoğunda görüş farklılıklarını beraberinde getirmiştir. Bu ihtilaf özü itibarıyla teorik ve pratik açıdan muarız nasları uzlaştırma, nesh veya tercih konusundaki usul farklılaşmasından ileri gelmektedir. Araştırmamız teâruz ve teâruzu giderme yöntemlerindeki usul farklılaşmasını ve bu farklılaşmanın ibadetler, muamelat ve ukubat alanındaki tezahürlerini incelemektedir. Füru fıkıh alanındaki teâruz merkezli ihtilafların tamamını ele almak çalışmanın sınırlarını aştığından konu ibadet, muamelat ve ukubat evreninden bazı örneklerle sınırlandırılmıştır. Bu kapsamda kitap ve sünnette muarız olduğu zannedilen naslar üzerinde durulmuş ve bu tearuzun amelî hükümlerdeki ihtilafa etkileri değerlendirilmiştir. Araştırmada analiz, sentez ve değerlendirme yöntemleri esas alınmıştır. Birinci bölümde teâruz olgusu usul açısından incelenmiştir. Sonraki bölümlerde ise muarız naslar zikredilmiş, tearuz yönleri açıklanmış, bilahare bu teâruzun fıkhi meselelerdeki ihtilafa yansımaları fakihlerin yaklaşımı çerçevesinde değerlendirilmiş, bilahare ihtilaflı konularda görüşler arasında bir tercihe gidilmiştir."
