abstract: "Bu çalışma; Hanefi mezhebinin muteber kitapları arasında olan mütûn~i erbaa'nın ibadetler bölümünde İmam Ebü Yûsuf a nispet edilen görüşler Özelinde, bir sıhhat tespiti çalışmasıdır.Çalışmamız, bir giriş ve üç bölümden oluşmaktadır: Gîriş bölümünde çalışmanın amacını ve sıhhat tespiti için takip ettiğimiz yöntemi anlattık.Birinci bölümde, görüşlerinin doğru aktarılıp aktarılmadığını tespit etmeyi amaçladığımız İmam Ebû Yûsuf (v. 182/798) hakkında kısaca bilgi verip; hayatı, ilmi kişiliği ve eserlerinden bahsettik.İkinci bölümde, Hanefi furû-i fıkıh alanındaki tarihi seyrini ve metinlerin temel özelliklerini anlattık. Ardından mütûn-i erbaa'yı oluşturan dört metin kitabı ile bu kitapların müellifleri hakkında bilgi verdik.Üçüncü bölümde, ibadetler bölümü özelinde mütûn-i erbaa'da İmam Yûsufa nispet edilen görüşleri ele aldık. Bu görüşleri“nispeti isabetli olan görüşler”,“nispeti hatalı olan görüşler”ve“isabeti tespit edilemeyen görüşler”şeklinde üçlü bir taksime tabi tuttuk. Daha sonrada hanefi mezhebi kaynaklarını tarayarak bu görüşleri tahkik etmeye çalıştık.Sonuç bölümünde ise çalışma neticesinde elde edilen istatistiksel bilgileri sunup, ulaştığımız sonuçları zikrettik."
