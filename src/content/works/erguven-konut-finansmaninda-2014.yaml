abstract: "Bu araştırmanın amacı, uzun vadeli ve faizsiz bir konut finansman sistemi olan Elbirliği sistemini araştırmak ve müşterilerin Elbirliği sistemi tercihlerini etkileyen faktörlerin neler olduğunu tespit etmektir. Bu çalışmada öncelikle Dünya'da ve Türkiye'de konut finansman sistemi incelenmiş daha sonra konut finansmanında müşterilerin Elbirliği sistemini tercih etme nedenleri üzerine yapılan anket analiz edilmiştir. 405 Elbirliği sistemi müşterisine uygulanan anket ile elde edilen veriler frekans (f), aritmetik ortalama, t-testi, ANOVA, korelasyon analizi ve tukey testi ile değerlendirilerek, tablolara aktarılarak yorumlanmıştır. Müşterilerin Elbirliği sistemini tercihlerine etki eden faktörlerin belirlenmesi için yapılan çalışma sonucunda; müşterilerin Elbirliği sistemini tercihinde demografik ve sosyo-ekonomik özelliklerinin belirleyici olmadığı ortaya çıkmıştır. Araştırma bulgularına göre, müşterilerin Elbirliği sistemini tercihlerinde beş ana faktörün etkili olduğunu görülmektedir. Analiz boyutunu ön plana alan, saha araştırmasına dayanan bu araştırmanın bilimsel çalışmalara katkı sağlayacağı düşünülmektedir."
