abstract: "Molla Said Arnasî (ö. 2008) yaşadığı dönemde halkın adeta fetva merciî olmuş, fahri olarak görev yaptığı yerlerde bulunan medreselerde çok sayıda öğrenci yetiştirmiştir. Sarf, nahiv, fıkıh ve hadis ilimlerinde eserler yazmış, kendisine tevcih edilen soruları ve bu sorulara verdiği cevapları not ederek bize çok değerli bir miras bırakmıştır. Bölgemizin değerli âlimlerinden olan Molla Said Arnasî'nin değerli mirasına sahip çıkmak amacıyla bize ve gelecek nesle örneklik teşkil edeceğine inandığımız fıkhi çalışmalarını incelenmesi önem arz etmektedir. Bu çalışmada Molla Said Arnasî'nin hayatı ve fıkhi kişiliği ele alınmaktadır. Arnasî'nin hayatı, ilim yolunda yaşadığı zorluklar ve elde ettiği bilgi ve birikimin yanı sıra, özellikle fıkıh alanındaki mesaisi ve bu alanda ortaya koyduğu çalışmalar araştırılmaktadır. Özellikle kendisine tevcih edilen fıkhi sorulara verdiği fetvaları kaleme almış olması onun fıkhi bilgisi ve ilmi kişiliği konusunda bize önemli ipuçları vermektedir. Ayrıca fıkhın önemli konularından olan miras hukuku ile ilgili risale üzerine yazdığı haşiye değerli bir çalışma olarak dikkat çekmektedir. Çalışmanın Arnasî'nin tanınmasına, ilmi çalışmalarının incelenip değerlendirilmesine ve fıkhi kişiliğinin ortaya çıkmasına katkı sunacağı hedeflenmektedir."
