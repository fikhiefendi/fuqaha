abstract: "Bu tez çalışmamızda günümüz Türk hukukuyla karşılaştırmalı olarak İslam hukukunda özel hayatın korunmasını inceledik. Özel hayatın korunması insan hakları içinde son derece büyük öneme sahiptir. İslam hukukunun temel kaynakları olan Kuran ve sünnet özel hayatın korunması noktasında çok sayıda düzenleme içermektedir. Örnek olarak burada Kuran'dan şu ayeti aktarabiliriz : ?Ey iman edenler! Zannın çoğundan kaçının. Çünkü zannın bir kısmı günahtır. Birbirinizin kusurunu araştırmayın. Biriniz diğerinizi arkasından çekiştirmesin?? (Hucurat, 49/12) 10 Aralık 1948 tarihli İnsan Hakları Evrensel Bildirisinde vurgulanan özel hayatın korunması Türk Anayasalarında ise tam olarak 1961 Anayasasında düzenlenmiştir. Özel hayatın korunması ahlak hukuk ilişkisi açısından da son derece önemlidir. Karşı karşıya kaldığımız pek çok problem ahlaki değerlerin desteği olmaksızın sadece hukuk yoluyla çözülemez. Özellikle özel hayatın korunması noktasında ahlaki değerler çok önemli bir unsurdur. Kanaatimizce ahlaki ve hukuki değerler aslında gerçekliğin birbirini tamamlayan iki görünümüdür ve ideal bir toplum her iki unsurun uyumlu birlikteliğinden oluşur."
