abstract: "Çalışmamızda Hanefî Mezhebi'nin kurucu İmâmı EbûHanîfe'nin vefatından sonra ders halkasının başına geçip Hanefîlerin ikinci İmâmı olan İmâm Züfer'i tanıtmaya çalıştık ve onun ibadetler alanında Mezhep içerisindeki farklı görüşlerinin tesbit ve tahlili üzerinde durduk. Çalışmamız neticesinde İmâm Züfer'in hem usûlde hem de fürûda kendine özgü görüşleri olan mutlak bir müçtehit olduğu kanaatine vardık. Onun ehl-i hadis olmak yanında Hanefîlerden kıyası en çok kullanan İmâm olduğunu gördük. Bazı kaynaklarda ibadetler alanındaki farklı görüşlerinden sadece bir tanesinin daha önceki dönemlerde mezhepçe kabul gördüğüne şahit olsak da bu hususta her dönem için tam bir sayı vermenin doğru olamayacağını, mesela günümüzde bu sayının yedi olabileceğini tesbit ettik."
