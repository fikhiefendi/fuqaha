abstract: "Bu çalışmada 18. yüzyıl ortalarında ortaya çıkan ve günümüze kadar etkili bir şekilde varlığını devam ettiren bir mezhebin doğuşunda ve gelişmesinde müessir olan âmillerin ortaya konulması amaçlanmıştır. Bu çerçevede ilk önce Vehhâbiliğin lideri Muhammed b. Abdilvehhâb'ın hayatı ve görüşleri ele alınmış, daha sonra arka plan kapsamında hareketin ortaya çıktığı Necid bölgesi ve civarının coğrafi özellikleri, bu özelliklerin sosyo-ekonomik hayata etkileri, genelde Avrupa ile Osmanlı Devleti'nin özelde ise Necid bölgesinin siyâsî yapısı araştırma konusu yapılmıştır. Yine aynı kapsamda Vehhâbilik ile diğer dînî mezhep ve akımların ilişkisi incelenmiş, İbn Abdilvehhâb'ın liderlik vb. kişisel özelliklerinin harekete etkileri üzerinde durulmuştur. Burada sosyoloji, psikoloji, coğrafya gibi diğer bilim dallarının verilerinden faydalanılmıştır. Bu noktada bölge coğrafyasının halkın sosyo-kültürel ve ekonomik yapısını etkilediği, yine Osmanlı ve bölgedeki siyasi durumun Vehhâbiliğin gelişmesine katkıda bulunduğu görülmüştür. Diğer taraftan hareketin bölgede etkin olan Hanbelî mezhebinden ve İbn Teymiyye'den etkilendiği, Hâricilik ve Zâhirilik ile benzer taraflarının bulunduğu tespit edilmiştir. Bununla beraber bu hareketlerden ayrıldığı konular olduğu sonucuna ulaşılmıştır. Bu nedenle Hanbelî mezhebinin devamı değil, yeni bir mezhep olarak değerlendirilmiştir. Vehhâbilik, yaklaşık üç asra yayılan bir hareket olduğu için konu sınırlandırılarak II. Suûd Devleti'ne kadar olan tarihi arka plan ele alınmıştır. Ayrıca İslam dünyasında 18, 19 ve 20. yüzyılda ortaya çıkan dîni hareketlere Vehhâbiliğin etkisinin olup olmadığı tartışılmıştır. Günümüzde Vehhâbiliği diğer yerlere ihraç etmek için sistemli çalışmalar yapıldığı tespit edilmiştir. Bu nedenle Vehhâbiliğin arka planı ayrıntılı açıklanmaya çalışılmıştır."
