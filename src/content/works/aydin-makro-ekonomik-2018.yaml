abstract: "Zekat, İslam'ın en önemli şartlarından biridir. Dini bir yükümlülük olan zekatın sosyal ve ekonomik etkileri de bulunmaktadır. Türkiye'de kurumsallaşmış bir zekat sisteminin olmayışı, zekatın sosyal ve ekonomik etkilerinin ölçülmesini de zorlaştırmaktadır. Son yıllarda bazı ülkelerde zekatın kurumsallaşması için bir takım çalışmaların yapıldığı görülmektedir. Bu ülkelerin başında Malezya gelmektedir. Bu tez çalışması Malezya zekât sisteminin Türkiye'de uygulanabilirliğini konu edinmektedir. Tezin temel amacı, Malezya zekat sistemini incelemek ve Türkiye için normatif önerilerde bulunmaktır. Malezya'da yaşayan zekât mükelleflerinin Malezya zekât sistemi konusunda algı ve memnuniyet durumlarının ölçülmesi ve Türkiye'de uygulanacak en uygun zekât modelinin ortaya konabilmesi bu çalışmanın en önemli çıktılarındandır. Araştırmada; belge tarama, derinlemesine görüşme ve anket tekniğinin birlikte kullanıldığı karma yöntem tercih edilmiştir. Malezya'da federal bölgede zekat toplamakla yetkilendirilmiş Pusat Pungutan Zakat (PPZ) isimli şirketin yöneticileri ile yüz yüze görüşülmüştür. Ayrıca Kuala Lumpur, Selangor ve Terengganu eyaletlerinde yaşayan zekat mükelleflerine anket formu dağıtılmıştır. Malezya zekat sisteminin; kamu modeli, yarı kamu modeli ve özel modelden oluştuğu görülmüşütür. Malezya'da ankete katılan zekat mükelleflerinin mevcut zekat sistemden genel olarak memnun oldukları tespit edilmiştir. Yarı kamu modelinin Türkiye için daha uygun olacağı sonucuna varılmıştır."
