abstract: "Bu çalışmada fıkıh usûlü eserleri çerçevesinde Hanefî mezhebinin sünnet hadis ve haber konuları ile ilgili yaklaşımlarının tespiti ve mezhebin bu hususta kendi içinde geçirdiği değişim ve gelişim konu edilmiştir. Mâverâünnehir bölgesi ve hicrî V.-VIII. asırlar arasındaki dönem, konunun sınırlarını oluşturmaktadır. Mukayese yönteminin esas alındığı çalışmada, mezhep içindeki değişimi takipte özellikle üç husus göz önünde bulundurulmuştur. Bu hususlardan ilki, Hanefî mezhebi içindeki Irak meşâyihi-Semerkant meşâyihi ayrımının sünnet bahislerine yansıması ve kelamcı usûl yazarlarının farklılık arz eden görüşlerinin dikkate alınması, ikincisi Hanefî fıkıh usûlüne hadis usûlü konularının dâhil edilmesi meselesidir. Üçüncüsü husus ise Moğol istilasından sonraki döneme denk gelen klasik sonrası dönemde mezhepler arası uzlaşma arayışının sünnet bahislerindeki tezahürüdür. Özellikle kelamcı usûl yazarlarının sünnet konusunda hâkim Hanefî gelenekten ayrılan bir takım görüşlere sahip olduğu görülmektedir. Bu farklı yaklaşımlar genellikle itikadla ilişkilendirildiğinden, bu durumun sebebinin onların kelâmî öncülleri dikkate alan usûl yaklaşımları ile izah edilmesi mümkündür. Özellikle Pezdevî ve Serahsî'nin usûllerinde görülen hadisçilerin ıstılah ve konularını ele alma yönündeki değişimin ve bazı meselelerdeki yumuşamanın ise mezhep eleştirilerine karşı bir reaksiyon olarak ortaya çıktığını söylemek mümkündür. Sonradan yerleşik hale gelen Hanefî usûl geleneği de hem ele alınan konular hem de bu konulardaki yaklaşımlar açısından çoğunlukla Pezdevî-Serahsî çizgisini takip etmiştir. Usûlünde hem yerleşik Hanefî usûlündeki bazı ilkeleri eleştiren hem de hadis mecmuaları ve hadis usûlü eserlerinden istifade eden Abdülazîz Buhârî'nin usûl eserinde ise klasik sonrası dönemin uzlaşma ortamının tesirleri görülmektedir."
