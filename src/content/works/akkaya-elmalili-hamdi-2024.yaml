abstract: "Ticaret ve ekonomi insan hayatının merkezindedir ve yaşam bu alanın etrafında şekillenmektedir. Kur'ân'da bu faaliyetler esnasında kişinin nasıl bir ahlaki tutum içerisinde olması gerektiği belirtilerek, dürüst bir şekilde davranan, doğruluğu ilke edinen kimselerin büyük mükâfatlara kavuşacağı müjdelenmiş aksine, hileye başvuran ve aldatmaca peşinde olanların dünya ve ahirette ağır bir yaptırımla karşı karşıya kalacakları vurgulanmıştır. Ticaretin ve bu tür ekonomi ile ilgili işlemlerin, günü kurtarmak, kısa yoldan zengin olmak hayatı devam ettirmek gibi amaçlarla değil, adalet ve dürüstlük ilkeleri rehber edinerek elde ettiği temiz kazançla hem kendine hem de topluma faydalı bir birey olarak cenneti kazanmak için yapılması gerektiği belirtilmiştir. Kur'ân'da bahsi geçen ayetleri Elmalılı ahlaki açıdan da tefsir ederek ayetlerin manasının daha iyi anlaşılmasını sağlamıştır. Elmalılı'nın bu ayetlere getirdiği çok yönlü bakış açısı, ticaret ve ekonomi açısından da bizler için, ayetlerin mahiyetini anlama ve iktisadi hayatımıza yön verme hususunda büyük önem arz etmektedir. Bu sebepten yola çıkarak Elmalılı'nın yorumladığı ticaret ile ilgili ayetleri inceleyip ahlak çerçevesinde ortaya koyduğu fikirleri değerlendirmeyi amaçladık. Bunun sonucunda müfessirin, kavramların daha çok uhrevi boyutunu ön plana çıkardığını örneğin ticaretin, bir amaç değil araç olarak görülmesi ve kişinin ebedi saadetine vesile olması için bu tür işlemlerde ayetlerde belirtilen esaslara riayet edilmesi gerektiğine gibi hususlara dikkat çektiği görülmüştür."
