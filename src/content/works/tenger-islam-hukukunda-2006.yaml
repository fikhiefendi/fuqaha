abstract: "Hakimin kendi bilgisiyle hüküm verip veremeyeceği ile ilgili bu çalışma,bir giriş ile iki bölümden ve sonuç kısmından meydana gelmektedir.Giriş kısmında ?içerik ve yöntem? başlığı altında konunun önemi,sınırlandırılması, sunulması ve kullanılan kaynakların değerlendirilmesihakkında bilgi verilmiştir.Konunun anlaşılmasına yönelik genel bilgileri içeren birinci bölümdekonuyla ilgili kavramlar açıklanmaya çalışılmıştır. Hakimin şahsi bilgisiylehüküm vermesi konusunun usÃ»l hukuku alanına dahil olmasından hareketletarihi süreç içerisinde ceza muhâkemesi alanına özgü olmak üzere usÃ»lsistemlerinin hakimin takdir yetkisine yaklaşımı ve hukuk muhâkemesiusÃ»lünün delilleri taksimi hakkında bilgi verilmiştir. Daha sonra belli başlı ispatvasıtalarının çok genel olarak özelliklerine değinilmiş ve bunlar üzerinde nederece hakimin takdir yetkisinin olduğu tespit edilmeye çalışılmıştır.İkinci bölümde İslâm hukuku ağırlıklı olmak üzere hakimin bilgisininmahiyeti açıklandıktan sonra hem İslâm hukuku hem de Türk hukukuaçısından bu konu üzerindeki genel malumat üzerinde durulmuştur.Sonuç bölümünde ise genel bir değerlendirme yapılarak ulaşılan neticebelirtilmiştir."
