abstract: "Hicrî beşinci yüzyılda yaşamış Mâverâünnehirli Hanefî âlim Ebû Zeyd ed-Debûsî'nin Takvîmü'l-edille adlı usûl eseri, Hanefî usûl literatüründe bir dönüm noktasını teşkil eder. Fukahâ metodu usûl yazıcılığının en tipik örneği olan bu eserinde Debûsî, kendisinden önce Cessâs'ın el-Fusûl fi'l-usûl'ünde işlenen konuları çok daha sistematik olarak ele almasının yanında, usûle tamamen kendisi tarafından kazandırılan bazı konulara da yer vermiştir. Debûsî'nin usul eseri, tasnif, üslup, içerik, kavramlar ve örnekler açısından sonraki Hanefî usul eserlerinde belirleyici olduğu gibi, başka mezheplere mensup âlimleri de çeşitli açılardan etkilemiştir. Debûsî'nin usul anlayışını ortaya koymayı hedefleyen bu çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde konunun amacı, önemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Debûsî'nin hayatı, yaşadığını dönemin özellikleri ve eserleri hakkında bilgi verilmiştir. İkinci bölümde Debûsî'nin usûl anlayışı, yöntem, üslup, tasnif ve getirdiği yenilikler açısından tahlil edilmiş, ayrıca Debûsî'nin kelam ilmi ile ilişkisi incelenerek kelâmî yönelişi tespit edilmeye çalışılmıştır. Üçüncü bölümde ise Takvîmü'l-edille'den seçilen bir başlık olarak emir-nehiy bahisleri mukayeseli olarak ele alınmıştır."
