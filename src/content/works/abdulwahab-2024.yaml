abstract: "İslam Hukukuna göre muhasebe açıklama standartlarının uygulanmasının İslami Finansal kuruluşlara istikrarın sağlanmasında olan etkisi çalışmada ele alınmaktadır. Bu doğrultuda standartların tanımı, İslami Finansal Kuruluşların istikrar endeksleri ve ilgili standartların uygulanmasının karar vericiler nezdinde finansal tabloların güvenirliliğini artırmasında oynadığı rol ele alınmaktadır. Son olarak açıklama standartlarına bağlılığın önemi ve ilgili kuruluşlarda finansal istikrara olan etkisi hususunda tavsiyeler verilmektedir. Çalışma, 2018-2022 yılları arasında İslami Finansal Kuruluşların çıkarmış olduğu mali tabloların bilgilerini analiz sürecinden geçirerek betimleyici yöntem kullanmaktadır. Bunun yanı sıra İslami Finansal Kuruluşlardan elde edilen verilerden hareketle veri analizi ve sonuç değerlemesi yöntemlerini kullanan analitik-tümdengelim yöntemine de başvurulmaktadır. Çalışma, İslami Finansal Kuruluşların standartlara bağlı kalmasında finansal istikrara ulaşılması açısından pozitif etkisi olduğu sonucuna ulaşmaktadır. Çalışma, İslami finans kurumlarının taahhütlerinin finansal istikrar üzerinde olumlu bir etkisi olduğunu buldu."
