abstract: "Pîr Mehmed Üskübî´nin Fetvaları adlı tezin konusu; İstanbul doğumlu, Üsküp müftülüğü görevini yapmış bir Osmanlı alimi olarak Pîr Mehmed Üskübî'nin hukûki açıdan tanıtılmasıdır. İbadetler Hakkında Dersler, Evlenme ve Boşanma bölümlerinden oluşur. Çalışma giriş bölümünde bahsedilen konuyu seçme nedenlerini zikrederek başlar. Konunun önemine, araştırma sırasında karşılaşılan zorluklara ve bu alanda daha önce yapılmış çalışmalara değinir. Tez iki bölüm ve sonunda bir analiz kısmından meydana gelir. Birinci Bölüm'de Pîr Mehmet Üskübî'nin hayatı ve en önemli eserleri ele alınmaktadır. İkinci Bölüm; onun kitaplarında yapılan araştırmalar sonucunda Üskübî'nin ayet, hadis ve sahâbeden yapılan alıntılarını tanzîm ve sınıflandırma, ardından onun konulara yaklaşımı ve kulandığı yöntem bakımından kitabının incelenmesine ayrılmıştır. Ayrıca fıkhî kaidelerden ve diğer hukuk ekollerinden yapılan alıntılar, fetvalarında kullandığı kaynaklardan da bahsedilir. Tezin bölümleri bittikten sonra da eserin tam metninin tıpkı basım transkripsiyonu verilmiştir. Bu metin Temizlik ve Namaz, Zekat, Oruç, Hac, Evlilik ve Boşanma konularını içermektedir. Sonuç bölümünde de araştırmanın nihayetinde ulaşılan önemli bilgiler ve bulgulardan bahsedilerek bunlar değerlendirilir."
