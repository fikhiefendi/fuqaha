abstract: "Kur'an'a göre her insan, Allah'ın insana teklif ettigi dine ve bu dinin itikadi esaslarına inanmakla mükelleftir. Dinin ahlaki ve ameli esasları ise dogal olarak ancak bu dine ve bu dinin inanç esaslarına inanan insanlara teklif edilmistir. Bunun yanı sıra, Kur'an'da açıklanmıs bütün esaslarla mükellefiyetin ve bu mükellef olunan seylerin eda edilmelerinin bir takım sartları ve kaideleri bulunmaktadır. badetler, ameli hükümlerdendir. Bu hükümlerin mükellefiyet sartları yanında, bunların eda edilmelerinin de bir takım sartları vardır. Ve bu ameli tekliflerin eda edilmesi mükellefiyeti, ancak ilgili sartların mevcudiyetiyle söz konusu olabilmektedir. Sartların bulunmaması ya da bulundugu halde sonradan herhangi bir sebeple ortadan kalkmaları durumunda, Kur'an'da açıklanan hükümlerin kabul ve eda zorunlulugu geçici veya sürekli olarak ortadan kalkmaktadır. Bu esaslar çerçevesinde sakat ve özürlülerin, Allah hakları olarak kabul edilen ibadetlerle sorumluluklarının, bu ibadetleri eda edebilme güçleri oranında düzenlenmesi söz konusudur. ?Allah'ın hiç kimseye gücünün üzerinde sorumluluk teklif etmeyecegini? ifade eden ayet ve diger nasslar, bedensel ve zihinsel özürlülük halinde, kisinin ibadetlerini yerine getirirken durumuna göre kendisine kolaylıklar tanındıgını bildirir."
