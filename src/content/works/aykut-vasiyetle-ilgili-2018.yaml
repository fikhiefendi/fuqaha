abstract: "İslam literatüründe Kur'an-ı Kerim'den sonra en önemli kitap kabul edilen Sahih-i Buhâri, kendi dönemi ve kendisinden sonraki dönemlerde Müslümanlara dinî alanda ışık tutmuştur. Sahîh-i Buhâri'nin diğer hadis kitaplarından daha güvenilir kabul edilmesinin sebebi, müellifinin sened ve metinlerin tespitinde gösterdiği titizliktir. Bu nedenledir ki üzerinde çok fazla şerh ve inceleme yapılmış; yapılmaya da devam edilmektedir. Sahih'in tamamı ve belli bölümleri incelemeye tabi tutulmuş ve üzerinde çok sayıda çalışma yapılmıştır. Ancak bizim tespit ettiğimiz kadarıyla, müstakil olarak vasiyet konusu üzerinde, diğer konulara nispeten çok fazla çalışılmamıştır. Bu nedenle Sahîh-i Buhâri'nin vasiyet bölümünün incelenmesini kararlaştırdık. Günümüzde vasiyet konusu tam olarak bilinmemektedir. Vasiyet konusundaki hadis çalışmaları diğer konulara göre geride kalmış, istenilen seviyeye ulaşamamıştır. Konumuzu Sahih-i Buharî özelinde yapmamızın sebebi ise Sahih-i Buhâri'nin Kur'an-ı Kerim'den sonra en güvenilir kaynak olması ve içinde vasiyet konusu ile ilgili yeterince rivayetin bulunmasıdır. Bu çalışma giriş, onu takip eden üç bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı ve önemi üzerinde durulmuştur. Onu takip eden birinci bölümde; Buhâri'nin hayatı, ilmi kişiliği anlatılmış; Sahih-i Buharî hakkında bilgi verilmiştir. Aynı zamanda 'vasiyet' kelimesinin tahlili yapılmıştır. İkinci bölümde; vasiyet bölümünün bâb başlıkları, senedlerin incelenmesi, râvi şeceresi, âli-nâzil isnad ve konu bakımından hadisler değerlendirmeye alınmıştır. Üçüncü bölümde ise önce Kütüb-i Sitte'nin diğer müellifleri hakkında kısa bilgiler verilmiş daha sonra vasiyet bölümleri karşılaştırılmıştır. Sonuç bölümünde ise genel değerlendirme yapılmıştır."
