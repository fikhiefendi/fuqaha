abstract: "Çalışmanın amacı, İslami finansın kavramsal ve teorik çerçevesi ile Türkiye'deki uygulamalarını incelemektir. Çalışma, nitel araştırma yöntemlerinden literatür taraması ve doküman analizi tekniklerini kullanarak gerçekleştirilmiştir. Çalışmada, İslami finansın tarihsel gelişimi 7. yüzyılda İslam'ın ortaya çıkışından günümüze kadar kronolojik olarak ele alınmıştır. Modern anlamda İslami finansın 1970'li yıllardan itibaren sistemsel bir yapıya kavuştuğu, Dubai İslam Bankası'nın 1975 yılında kurulması ve İslam Kalkınma Bankası'nın faaliyete geçmesi ile başlayan kurumsallaşma sürecinin günümüzde bankacılık, sigortacılık, sermaye piyasaları ve fon yönetimi gibi geniş bir yelpazede faaliyet göstermesini sağladığı görülmüştür. Türkiye'de İslami finans sektörünün incelenmesi kapsamında, sektörün 1980'li yıllarda Özel Finans Kurumları olarak başlayan gelişim sürecinden günümüze kadar olan tarihsel gelişimi ele alınmıştır. 2005 yılında Katılım Bankası adının benimsenmesi ve bankacılık sistemi içerisinde resmi olarak tanınmasının sektörün kurumsallaşması açısından önemli bir dönüm noktası olduğu görülmüştür. Mevcut durumda Türkiye'de 9 katılım bankasının faaliyet gösterdiği, sektörün toplam aktif büyüklüğünün 2,04 trilyon TL'ye ulaştığı ancak toplam bankacılık sistemi içerisindeki payının %7,31 seviyesinde kaldığı belirlenmiştir. Katılım sigortacılığı alanında ise toplam sigorta sektörü içerisindeki payın %5 seviyesinde olduğu görülmüştür. Bu oranların, Türkiye'nin demografik yapısı ve İslami finans potansiyeli göz önüne alındığında oldukça düşük bir seviyeyi temsil ettiği değerlendirilmiştir. Çalışmada, Türkiye'de İslami finans sektörünün karşılaştığı yapısal sorunlar incelenmiştir. Düzenleyici çerçevedeki eksiklikler, insan kaynakları yetersizlikleri, ürün çeşitliliği konularındaki sınırlılıklar ve teknolojik altyapı yetersizlikleri temel sorun alanları olarak değerlendirilmiştir. Küresel İslami finans sektörü ile karşılaştırmalı değerlendirmede, Türkiye'nin mevcut konumunun potansiyelinin altında kaldığı görülmüştür. Çalışma sonucunda, İslami finans sektörünün Türkiye'de sürdürülebilir büyüme için yasal düzenlemelerin güçlendirilmesi, insan kaynakları gelişiminin desteklenmesi, ürün çeşitliliğinin artırılması ve teknolojik altyapının güçlendirilmesi önerilmektedir."
