abstract: "Hukukta zamanaşımı, bir hakkın belli bir süre kullanılmaması nedeniyle dava edilebilme niteliğinden mahrum kalmasıdır. Dava veya cezanın düşmesine neden olan zamanaşımı, devletin ceza verme hak ve yetkisinden feragatini ifade eder. Nitekim aradan geçen süreye rağmen dava açılması hakkın kötüye kullanılmasına, yıllar sonra açılacak davalar ise toplumsal düzenin bozulmasına ve adil yargılama hakkına zarar verebilir. Dolayısıyla zamanaşımı, uzun bir süre devam eden fiili bir durumu hukukileştirmektedir. Osmanlı Hukuku ve bu çerçevede hazırlanan Mecelle'de de zamanaşımı bazı hukuki sonuçlara bağlanmıştır. Mecelle'nin 16 maddeden oluşan 14'üncü kitabının 2'inci bölümü zamanaşımı hakkındadır. İlgili hükümler zamanaşımının hak kazandırma fonksiyonuna sahip olmayıp, yalnızca hakkın geri alınmasına engel olduğunu göstermektedir. Uygulamada ise dönem idarecilerini meşgul eden mesele, hazinenin alacağının zamanaşımına tabi olup olmayacağı konusu olmuştur. Mecelle'de zamanaşımı konusunda hukuk birliği sağlandığı fakat geçiş sürecinin nispeten sancılı olduğu anlaşılmaktadır. Dönemim Kadı Sicilleri kayıtları baz alınarak hazırlanan bu çalışma, Mecelle'de zamanaşımı ile ilgili hükümlerin Osmanlı hukuk kurumunun temsilcileri olan kadılar tarafından nasıl yorumlandığı ve sorunların nasıl çözümlediğini göstermesi açısından önem arz etmektedir."
