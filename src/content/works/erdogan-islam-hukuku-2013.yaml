abstract: "İslam hukukunda ana hüküm kaynakları Kur?ân-ı Kerim ve Hz. Peygamber (S.A.S.)?in söz ve davranışlarıdır. Müslümanlar Hz. Peygamber (S.A.S.) zamanından itibâren bu iki kaynağı doğru bir şekilde anlayıp yorumlayabilmek için farklı yöntemler kullanmışlardır. Bu yöntemlerden birisi de lâfızlardaki kapalılığın (hafa) giderilmesidir. Bu çalışma lâfızlardaki kapalılığın giderilme yöntemlerini ele almaktadır. Tez; Giriş, üç ana bölüm, Sonuç ve Bibliyografya?dan oluşmaktadır. Birinci bölüm başlığına ?Genel Olarak Delâlet Şekilleri? adı verilmiş ve fıkıh usulünün delâlet şekilleri özetlenmiştir. İkinci bölüm?de ?Lâfızlardaki Kapalılığın Kaynakları? incelenmiş ve lâfızların delâletlerindeki kapalılık esas alınarak yapılan, hafî, müşkil, mücmel ve müteşâbih kavramları izah edilmiştir. Üçüncü bölüme ise ?Lâfızlardaki Kapalılığın Telâfi Yolları? ana başlığı konulmuş ve klasik usul-i fıkıhtaki beyân kavramı temelinde, kapalılığın telâfisi için takip edilecek metot üzerinde durulmuştur. Tezde klasik kaynaklar esas alınmış ve mevzu hakkında sentez yapılmaya çalışılmıştır."
