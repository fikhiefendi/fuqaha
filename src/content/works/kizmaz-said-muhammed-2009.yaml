abstract: "Bu çalışmada 18. yy Osmanlı alimlerinden Ebu Said Muhammed Hadimi ve onun Mecamiu'l-Hakaik adlı eseri ekseninde usulcülüğü incelenmektedir.18. yüzyılın önde gelen alim, mutasavvıf ve fıkıhçılarından biri olan Hâdimî, soy itibariyle orta Asya'dan gelen ve öteden beri ilimle meşgul olan bir aileye mensuptur. Konya vilayetine bağlı Hadim kazasında doğmuş, Hadim-Konya-İstanbul üçgeninde eğitim görmüş ve tahsil hayatı sonrası, Hadim'de eğitim-öğretim faaliyetleri ve eser telifiyle hayatını sürdürmüştür.Hadimi İslami ilimlerin hemen her dalında irili ufaklı eserler vermiştir. Tamamına yakını Arapça olan bu eserlerin bir kısmı bir-iki sayfalık risaleler olmakla birlikte, hacimli eserleri de vardır.Tezimiz kapsamında incelediğimiz Mecamiu'l-Hakaik ise kısa ve veciz üslubuyla bir ders kitabı mahiyetindedir. Usul ve külli kaideler olmak üzere iki farklı yönü olan kitap, fıkıh usulünü kırk küsur sayfada özetlemiş olmakla birlikte usul ilminin temel bütün konularını içeren, karma metodla yazılmış sistematik bir eserdir. Mecamiu'l-Hakaik yazıldığı dönemde ve sonrasında tercih edilen bir usul eseri olmuş, üzerinde tercüme ve şerh çalışmaları yapılmış, Osmanlı eğitim kurumlarında devlet tarafından ders kitabı olarak okutulmuştur.Hadimi'nin en çok söz sahibi olduğu ilmi disiplinlerden biri de fıkıh ve fıkıh usulüdür. Hanefi geleneğe bağlı olan Hadimi, klasik usul geleneği içerisinde kaleme aldığı Mecamiu'l-Hakaik isimli eserinde de hanefi mezhebi ekseninde konulara yaklaşmış ve mezhebin görüşleri dışına pek çıkmamıştır. Bununla birlikte, farklı görüşlerin olduğu hususlarda mezhep sınırları içerisinde yer yer kendi görüşlerini ve tercihlerini de ortaya koymuştur.Hadimi bu eseriyle kendisinden sonraki usul ve külli kaidelere yönelik çalışmaları etkilemiştir."
