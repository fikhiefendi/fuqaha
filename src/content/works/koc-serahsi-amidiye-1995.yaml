abstract: "ÖZET SERAHSİ ve AMİDİ'ye Göre Emir Emir, genel anlamda bir kimsenin diğerine“yap”demesidir. Bu tanımlama bütün mezheplerce kabule şayan olsa da İslam hukukçuları, emrin delaleti hususunda farklı görüşlere sahiptirler. Hanefi bilginlere ve İmam Serahsiye göre emir vücup ifade etmektedir. Bazı Şafii bilginleri ve el-Amidi ise emrin vücup ifade etmeyip tevakkufa delalet ettiği düşüncesindedirler. Onlara göre bir kimse diğerine“yap”dediğinde bunun mecburiyet ifade edip etmediğini anlayamayız. Serahsi ve Amidi, emrin gereğinin hemen yerine getirilmesinin gerekli olmadığı hususunda hemfikirdirler. Ancak emir, belli bir zamana bağlanmışsa fiil de o zaman içerisinde yapılmalıdır. Mükellef, emri anlamak ve ifa etmek için akıllı olmalı ve yeterli fiziki güce sahip bulunmalıdır. Aksi halde emrin hukuki neticelerinden sorumlu tutulamaz. Memurun bih, güzel olduğu için emredilmiştir, fakat Allah, her güzel fiili emretmek ve her kötü fiili yasaklamak zorunda değildir. İnsan aklı fiillerin güzelliğini ve çirkinliğini kavrayabilir. İmam Serahsi, eserinde tümevarım metodunu, Amidi ise tümdengelim metodunu kullanmıştır."
