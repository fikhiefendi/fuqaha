abstract: "Teknolojinin ilerlemesi, internetin yaygınlaşması ve akıllı telefonların çok büyük bir hızla yayılmasıyla birlikte insanlar sanal ortama yönelmiştir ve bu evrilme metaverse'e doğru gitmektedir. İslam dini hukuk kurallarıyla insanın dünya hayatına etki etmektedir. Ahlakî ve vicdanî emirleriyle zaman ve mekân ötesi hükümleri kendi içinde mezcedebilmiş olan İslam hukuku, saadet asrından günümüze ışık tutup bugünün dünyasındaki yeniliklere de çözüm üretir niteliktedir Geçtiğimiz yıllarda pandeminin yayılmasıyla birlikte insanların sokağa çıkma yasakları, hastalanma korkusu ve internetten sipariş verip kapıda teslim alabilme kolaylığı gibi sebeplerle internetten alışveriş yapma alışkanlığı iyice artmıştır. E-ticaretteki bu rağbet elbette bu konuya hassasiyetle yaklaşan kişilerin alışveriş yönteminin İslam dinine göre yapılabilirliğinin araştırılmasına sebep olmuştur. Böylece e-ticaretin nasıl yapılabilir olduğu ve alışverişteki muamelelerin karşısında nasıl bir davranışta bulunulması gerektiği sorusunun sorulmasına neden olmuştur. Çalışmamız bu konuda bir katkı sağlamak üzere satıcı ile özellikle son alıcı olan tüketici açısından değerlendirilebilmesi için B2C sisteminde elektronik ticaret sitelerinden yapılan alışveriş muamelelerinin İslam hukuku açısından nasıl değerlendirilmesi gerektiğinin tespitini hedeflemiştir."
