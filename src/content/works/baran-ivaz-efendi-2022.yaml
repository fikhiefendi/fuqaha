abstract: "Usûl ilminin zamanla gelişen alt disiplinlerinden biri benzer meseleler arasındaki ince farkları konu edinen furûk eserleridir. Bu çalışma, İvaz Efendi (v. 994/1586)'nin Furûku'l-usûl adlı eseri bağlamında usûlde farklar konusunu incelemektedir. Bu eser dikkate alınarak furûku'l-usûl ilminin tanıtılması amaçlamıştır. Tezde literatür tarama yöntemi ile bilgiler toplanmış, bunların analiz ve sentezi yapılmıştır. Çalışmada, usûlle ilgili farkların ilk dönemlerde usûl kitaplarında yer aldığı, müstakil eserlerin ise ancak hicri onuncu yüzyılda kaleme alınmaya başladığı tespit edilmiştir. Fûrû fıkıh alanındaki meselelere dair müstakil furûk edebiyatının oluşumunun ise hicri dördüncü yüzyıl gibi erken dönemde ortaya çıkmaya başladığı saptanmıştır. Bunun nedeninin ise fûrû meselelerin halka hitap edip, usûlle ilgili meselelerin entelektüel kesim olan fukahâya hitap etmesi olarak belirlenmiştir. İvaz Efendi'nin eserinde birbirine tamamen zıt meselelere değindiği gözlemlenmiştir. Bu serde bu tarz meselelerin yer alması eserin eğitim amaçlı yazılmasıyla izah edilmiştir. Ayrıca çalışmada İbn Kemal Paşa (v. 940/1534)'ya da nispet edilen Furûku'l-usûl adlı eserin İvaz Efendi'ye ait olduğu tespit edilmiştir."
