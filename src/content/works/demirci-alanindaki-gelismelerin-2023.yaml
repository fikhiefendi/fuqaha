abstract: "Günümüzde süregelen bir değişim mevcuttur. Her alanda yenilik ve gelişmeler göze çarpmaktadır. Özellikle teknolojik gelişmeler, çağımızda hayli önem kazanmıştır. Bu teknolojik gelişmeler pek çok alanda olduğu gibi tıbbî gelişmelerin de hız kazanmasına sebep olmuştur. Tıbbî alandaki bu gelişmelerin klasik eserlerde yer alan hükümler üzerindeki etkisinin araştırılması ve ortaya çıkan sorunlara çözüm aranması bir ihtiyaca dönüşmüştür. Bu sebeple Mecelle-i Ahkâm-ı Adliyye'nin 39. maddesinde de yer alan zamanın ve buna taalluk eden şartların değişmesiyle hükümlerin de değişmesinin kaçınılmaz olduğunu ifade eden kaidede de açıklandığı üzere tıbbî gelişmeler sonucunda klasik eserlerde yer alan hükümlerde meydana gelebilecek değişimler ve güncellemeler sorusu ele alınmıştır. Tez giriş ve sonuç hariç üç bölümden oluşmaktadır. Birinci bölümde ilk olarak İslam hukukunda hükümlerin değişmesi, değişime etki eden faktörlerle İslam hukukunda değişime açık olan hükümler ve hükümlerde değişimin sebepleri beyan edilmiştir. Ardından tıp ve fıkıh ilişkisi ele alınmış, bu bağlamda İslam âlimlerinin tıp ilmi hakkındaki görüşleri ve fıkhî hükümlerde tıp ilminin etkisi birkaç örnekle incelenmiştir. Tezin ikinci bölümünde ibâdât kısmında tıbbî meselelerini ilgilendiren bulûğ yaşı ve alametleri, hayızın asgari ve azami süresi, nifasın süresi, gebelik esnasında görülen kanın hükmü, hayatta olan ya da ölü bir annenin karnı kesilerek bebeğin alınması, anne karnındaki bebeğin düşürülmesi, secde mahalli ile oruca taalluk eden konular ele alınmıştır. Bu konulara ait fıkhî bilgiler klasik eserler incelenerek derlenmiş, ardından aynı konular hakkında güncel tıbbî gelişmeler ele alınarak hükümler üzerindeki etkileri değerlendirilmiştir. Tezin üçüncü ve son bölümünde ise muamelât kısmında tıbbî gelişmelere taalluk eden nikâhta tefrik sebebi sayılan hastalıklar, gebeliğin asgari ve azami süresi, nesebin ispat yolları, fâili meçhul cinayetlerin açığa çıkarılması ve içki içmenin cezasıyla ilgili meseleler dört mezhebe ait klasik fıkıh eserlerinde ele alınmış, günümüz tıbbî gelişmelerinin bu hükümler üzerindeki etkileri incelenmiştir."
