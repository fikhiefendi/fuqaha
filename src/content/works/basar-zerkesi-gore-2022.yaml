abstract: "Kur'an ve sünnet metinlerini özellikle ahkam açısından doğru anlama ve yorumlama yöntemi olan fıkıh usulü ilminin en önemli konularından birisi emir konusudur. Bu konu Zerkeşî özelinde ele alınıp incelenmiştir. Onun fıkıh usulüne dair birkaç eserinin bulunması, özellikle kendinden önceki eser ve müelliflerden zengin bilgi aktarımlarında bulunması konuyu önemli kılmaktadır. Bu çalışmanın temel amacı, emrin yorumuna dair özgün ve her kaynakta ulaşılması mümkün olmayan bazı yorum ve teorileri tespit ederek Zerkeşî'nin tercih ve değerlendirmeleri ışığında ortaya koymak suretiyle bu alanda yapılacak çalışmalara katkı sağlamaktır. Bu çerçevede bir diğer amacımız ülkemizde tefsir ve hadis alanlarında üzerinde belli ölçüde akademik çalışmalar bulunan Zerkeşî'nin usûlcü yönünün özellikle el-Bahru'l-Muhît adlı eseri eşliğinde ilim dünyasına tanıtılmasına vesile olmaktır. Çalışma, bir giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde Zerkeşî'nin biyografisi, ilmî yönü ve eserleri hakkında bilgi verilmiş; ayrıca çalışmamıza esas teşkil eden usûle dair eserleri genel nitelikleriyle tanıtılmıştır. İkinci bölümde ise Zerkeşî'de emrin yorumu incelenmiştir. Bu çerçevede özellikle el-Bahru'l-Muhît adlı eser üzerinden müellifin emir konusu ile ilgili ele aldığı meseleler hakkındaki görüşleri ve yorumları tespit edilmeye çalışılmıştır. Sonuç kısmında ulaşılan tespit ve değerlendirmelere yer verilmiştir."
