abstract: "Yöntem meselesi, modern dönemde bilimsel araştırmaların mahiyetini temelden belirleyen ve bilgiyi konu edinen her çabanın ilgi odağı olmuştur. Modern dilbilimi, Batı'da neşet ettikten kısa bir süre sonra Arap dili araştırmalarını da etkisi altına almış, yöntem tartışmalarının etkisiyle Arap dil mirasını tartışmaya açmış ve böylece Arap dünyasında yöntem arayışları başlamıştır. Temmâm Hassân ve Menâhicü'l-baḥs̱ fi'l-luġa isimli çalışması bu arayışın, dilbilimi alanını temsil eden en iyi örneklerdendir. Temmâm Hassân, Arap dili hakkında telif ettiği çeşitli eserlerinde yöntem konusunu doğrudan ve dolaylı olarak tartışma konusu yapmıştır. Bununla birlikte biz, iki sebepten dolayı, çalışmamızı adını zikrettiğimiz eserle sınırlı tuttuk. Birincisi, bu çalışmanın zamanı Temmâm Hassân'ın bütün eserlerini incelemeye yetmeyeceği düşüncesi. İkincisi ise daha dar bir alanda derinlikli inceleme yapmanın daha faydalı olacağı kanaati. Bununla birlikte, Temmâm Hassân sonraki dönemlerde ön plana çıktığı bazı görüşlerine bu çalışmada yer verdik. Çünkü, bize göre, ele aldığımız eseri onun temel hareket noktasıdır ve daha sonra ortaya koyduğu kuram ve kavramlar bir bakıma bu eserin ürünü olmuştur."
