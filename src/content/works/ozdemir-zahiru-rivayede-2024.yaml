abstract: "Hanefi mezhebinin kurucu imamlarından biri olan Muhammed b. el-Hasen eş-Şeybânî'nin Hanefi mezhebinin teşekkülü ve fıkıh usulünün oluşumunda önemli etkileri vardır. Bu etki en bariz biçimde, Şeybânî'nin telif ettiği, Hanefî mezhebinin kurucu metinleri olarak kabul edilen“zâhirü'r-rivâye”adıyla meşhur olmuş altı eserde görülür. Bu eserler; fıkıh ilminin konu, problem ve dil açısından bağımsız hale geldiğine, fıkhî konuların belirli usul kuralları çerçevesinde şekillendiğine işaret eden, hem müellifin hem de hocaları Ebû Hanîfe ve Ebû Yûsuf'un görüşlerini ihtiva eden Hanefilere ait ilk fıkıh metinleridir. Bu çalışmada sözü edilen fıkhî birikimin dayandığı şer'î deliller çerçevesinde Şeybânî tarafından kaleme alınan bu altı eserin içerisine yayılmış usul konularını istikra yöntemiyle tespit ederek Hanefilerin fıkhî istidlâllerinin temellendirilmesine katkı sağlamaktır. Bununla birlikte ilk dönem Hanefi mezhebinin usûl anlayışının iddia edildiği üzere tamamen fürûdan hareketle tümevarım metoduyla oluşmadığına, ana omurgasının kurucu imamlar tarafından çeşitli fıkhî hükümler içerisine yayıldığı görüşüne katkı sunmaktır. Tezimiz giriş, üç bölüm ve sonuç bölümlerini içermektedir. Giriş bölümünde tezin konusu, amacı, önemi ve özgün değeri, araştırma yöntemi ve“zâhirü'r-rivâye”eserleri üzerine yapılan çalışmalar ele alınmıştır. İkinci bölümde Şeybânî'nin hayatı, dönemin siyasi ve sosyal ortamı, hocaları, öğrencileri, eserleri, Hanefi mezhebindeki yeri ve rolü hakkında bilgiler verilmiştir. Üçüncü bölümde ise önce delil kavramı üzerinde durulmuş, ardından Şeybânî'nin fıkhî çözümlerde başvurduğu Kur'an, sünnet, icmâ, kıyas, sahâbî kavli, istihsan, örf ve şer'u men kablenâ gibi deliller ile yapmış olduğu istidlâller ele alınmıştır. Tez çalışmamızın dördüncü bölümünde usul konularından zâhirü'r-rivâye'de geçen ahkâm ve lafız konuları başlığı altında zâhirü'r-rivâyede hüküm konusu, lafza ait usûl kuralları ve hüküm çıkarma yolları ortaya konulmaya gayret edilmiştir. Teklifî ve vazʻî hükümler kavramsal çerçeveleriyle birlikte ele alınmış, daha sonra zâhirü'r-rivâyede geçen teklîfî ve vazʻî hükümler kullanım çeşitleriyle tespit edilmeye çalışılmıştır. Hüküm konusuyla yakın bağlantısına binaen naslardan hüküm çıkarma yolları konusu da bu başlık altında incelenmiştir. Yine fıkıh usulünün önemli konularından olan ehliyet ârızaları, teâruz, tercih ve nesih konularına da hüküm konusuyla yakın bağlantısına binaen bu bölümde yer verilmiştir. Ayrıca çalışmamız kapsamında ulaşılan sonuçların, Hanefî mezhebinin usûl ve fürû' kaynaklarındaki bilgilerle de mukayesesi yapılmaya çalışılmıştır. Sonuç kısmında ise elde edilen bulguların Hanefî mezhebi fıkıh külliyatına katkısı hususu değerlendirilmiştir."
