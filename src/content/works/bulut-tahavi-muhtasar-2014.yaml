abstract: "Fıkıh muhtasarları mezheplerin temel mesele ve hükümlerini, delillere yer vermeksizin özet bir şekilde sunan ve özel bir telif geleneğini temsil eden eserlerdir. Muhtasaru't-Tahâvî de bu telif geleneğinin Hanefî mezhebi içerisindeki ilk örneğini teşkil eder. Tahâvî bu eserinde Hanefî imâmları arasındaki ihtilaflı meseleleri nakletmekte ve bu meselelerde Hanefî imâmlarının görüşleri arasından birini وبه نأخذ ifadesiyle açıkça tercih etmektedir. Bu çalışmada da Tahâvî'nin Muhtasar'ında sarih ifadelerle yapmış olduğu tercihleri incelenmiş, özellikle bu tercihlerin muhtasar telif geleneği içerisinde Muhtasaru't-Tahâvî'nin edinmiş olduğu yere etkisi araştırılmıştır. Tahâvî'nin tercihleri Hanefî imâmlarının görüşleriyle mukâyese edildiğinde daha çok Ebû Yûsuf ve Muhammed b. Hasan eş-Şeybânî'nin görüşlerini tercih ettiği görülmektedir. Nitekim Tahâvî, naklettiği ihtilaflı meselelerin yaklaşık %75'inde Ebû Hanife'ye muhâlefet etmektedir. Muhtasaru't-Tahâvî'nin Hanefî mezhebi içerisinde yaygın olarak kullanılan ve mûtemed kabul edilen muhtasarlarda esas kaynak olarak kullanılmadığı ve pek yaygınlaşmadığı görülmektedir. Buna etki eden önemli sebeplerden biri olarak Tahâvî'nin sarâhaten yapmış olduğu tercihlerinin büyük kısmının Ebû Hanife'nin değil de Sâhibeyn'in görüşleri doğrultusunda olması düşünülmektedir. Nitekim meşhûr olan ve mûteber kabul edilen muhtasarlarda büyük oranda Ebû Hanife'nin görüşlerinin tercih edilmiş olması bu düşünceyi teyid etmektedir."
