abstract: "Bu çalışma Diyanet İşleri Başkanlığı'nın bir telefon hizmeti olan Alo Fetva hattında çalışan kadınların fetva verme pratiklerini analiz etmeyi amaçlamaktadır. Tez, vaizelerin ve din hizmetleri uzmanlarının fetva sorularına cevap verdiği odada yapılan bir etnografik çalışmaya dayanmaktadır. Çalışma fetva anlatılarına ve fetva veren öznelere odaklanarak, Diyanet'in kadın memurları tarafından verilen fetvaları insanlara hem“iyi”yi ve“doğru”yu gösteren etik bir pratik, hem de egemen iktidarın insanların evlerine girmesini ve özel hayatlarına müdahale etmesini mümkün kılan bir“yönetimsel teknik”olarak ele almaktadır. Bu bağlamda, gündelik hayat ve aile problemleri ile ilgili sorulara verilen cevaplar çalışmanın başlıca dayanak noktalarıdır. Tez, seküler bir kurumda gerçekleştirilen geleneksel bir pratikte dini söylemin nasıl inşa edildiğini ve dinin, etiğin ve politikanın nasıl iç içe geçtiğini göstermeyi amaçlamaktadır. Bunu yapmak için, vaizelerin kendilerine, pedagojilerine, işlerindeki motivasyonlarına, duygularına ve yaptıkları işi nasıl anlamlandırdıklarına odaklanmaktadır. Vaizelerin pozisyonlarını Diyanet İşleri ile halk arasında bir aracı olarak tartışan çalışma, vaizelerin otoritelerinin kaynaklarını ve kendi yorumlama alanlarındaki akıl yürütme yollarını analiz etmektedir. Tez, bu yorumlama alanında vaizelerin bir yandan fetva isteyen kadınların haklarını korumaya çalıştığını, bir yandan da Diyanet'in ve hükümetin kadın ve aile konusundaki söylemini üstlendiğini iddia etmektedir. Ve böylece tez, vaizelerin işlerini icra ediş tarzlarının bunlardan birine ya da diğerine indirgenemeyeceğini savunmaktadır."
