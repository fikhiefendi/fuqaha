abstract: "Bu çalışmanın amacı Vurgulayın Yemen İslami bankalarında bankacılık hizmetlerinin performansının iyileştirilmesinde bilgi ve iletişim teknolojisinin rolü, teknik gelişiminin boyutu, departmanlarının bu gelişime ilgisi ve yayılma derecesi; Karşılaştığı zorluklar ve çözüm önerileri, Bu hedeflere ulaşmak ve hipotezlerini test etmek amacıyla, çalışmanın teorik çerçevesini geliştirmek için tanımlayıcı yaklaşıma ve 400 müşteri öğesi ve 50'yi içeren çalışma öğelerine ilişkin verileri toplamak için bir anket tasarlayarak analitik yaklaşıma güvenilmiştir. Spss istatistik programını kullanarak banka çalışanlarını inceleyin. Çalışmada, örneklem üyelerinin yanıtlarının çalışmanın eksenlerine göre homojen olduğu, banka hesabı sahibi olanların çoğunluğunun çalışanlar olduğu, müşterilerin en fazla işlem yaptığı Al-Kuraimi İslami Mikrofinans Bankası ve ardından İslami Mikrofinans Bankası olduğu sonucuna varılmıştır Dayanışma Bankası. Çalışma ayrıca bankadaki bilgi ve iletişim teknolojisi ile Yemen bankalarındaki bankacılık hizmetlerinin performansı arasında“orta ve güçlü”bir korelasyon olduğu sonucuna vararak şu sıfır hipotezinin reddedilmesine yol açtı:“Bilgi ve iletişim teknolojisinin etkisi yoktur”iletişim teknolojisinin Yemen bankalarındaki bankacılık hizmetlerinin performansına etkisi 0,05 anlamlılık düzeyindedir.“Alternatif hipotezin kabul edilmesi: ”Yemen bankalarında bilgi ve iletişim teknolojisinin bankacılık hizmetlerinin performansı üzerinde 0,05 anlamlılık düzeyinde etkisi vardır.\""
