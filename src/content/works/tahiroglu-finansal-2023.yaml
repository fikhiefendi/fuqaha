abstract: "Türkiye'de ticari manada helal standardı sadece finans (bankacılık), sigortacılık, gıda ve turizm firmalarına yönelik olarak, sınırlı şekilde tatbik edilmektedir. Oysa helal ölçüsü sadece bu üç sektörün mal ve hizmetleri ile sınırlı bir olgu değildir. Tez çalışmasının konusu, temel finansal tablolarda açıklanan bilgilerin helal standartlara uygunluğuna, standartlar çerçevesinde bir ayrıştırma ve raporlamanın gerekliliğine olan ihtiyacın araştırılmasıdır. Amaç, finansal tercihlerini helal hassasiyeti çerçevesinde yapan tarafların seçimini kolaylaştırmaktır. Çalışmada ihtiyaç analizi bağlamında ankete dayalı niceliksel araştırma yöntemi ile derinlemesine mülakatları içeren niteliksel araştırma yöntemi kullanılmıştır. Araştırmalarda tüm sektörleri kapsayacak şekilde ticari faaliyetlerde helal standartların oluşturulması ve uygulanmasına ihtiyaç olduğu, bu tür bir uygulama ve denetimin bağımsız denetçiler tarafından yapılması gerektiği, konu ile ilgili uygulamanın yaygınlaştırılması ve hassasiyetin artırılması için kamu desteğinin sağlanmasının gerektiği öne çıkan tespitlerdir. Araştırma sonuçları dikkate alınarak temel finansal tablolarda helal ayrıştırma önerileri oluşturulmuş, önerilere göre ayrıştırma ve raporlama örnekleri verilmiştir. Böylelikle, finansal tercihlerini helal hassasiyeti çerçevesinde yapan tarafların tercihlerini doğru bilgilere dayalı olarak gerçekleştirmesi mümkün olacaktır."
