abstract: "Bu çalışma, çağımızda oldukça yaygın görülen ve sosyal bir sorun haline gelen ailenin dağılmasını; Maliki mezhebi ve Fas Medeni Kanunu çerçevesinde incelemeye çalışmayı hedeflemiştir. Bu amaçla çalışmada, boşanma hükümleri ve sonuçları Maliki mezhebi ve Fas Medeni Kanunu'nda karşılaştırmalı olarak ele alınmıştır. Maliki mezhebinin Fas medeni Kanunu üzerindeki etkisine temas edilmiştir. Bu konuyu tercih etmemin sebebi, Fas toplumunda gözlemlediğim boşanma ahkamı alanındaki bilgi eksikliği ve insanları bu alanda daha fazla bilinç sahibi yapmaya yönelik arzumdur. Bu Çalışma üç bölümden oluşmaktadır; İlkbölümde boşanma, boşanmanın tanımı, boşanmanın şartları ve çeşitlerinden bahsedilmiştir. İlk bölüm dört alt başlıktan oluşur ve her başlık kendi içinde bazı alt başlıkları ve konuları içermektedir. İkinci bölümde boşanma ve mahiyeti ele alınmış iki konu başlığı altında incelenmiştir. Birinci konu başlığında, anlaşmazlık nedeniyle boşanmayı, ikinci konu başlığı altında ise kadının başka sebeplerden ötürü eşinden boşanmak istemesi işlenmiştir. Bu konu ayrıca altı alt başlıktan oluşmakta, her başlıkta bu sebepler zikredilmekte ve kadının boşanma ve evliliği bitirme hakkının olduğu açıklanmaktadır. Üçüncü ve son bölümde, iki alt başlıkta anlaşmalı boşanma (talak-ı ittifaki) ve hul' konusu anlatılmıştır. Sonuç bölümünde ise, çalışmanın çıktıları sıralanarak bazı önerilerde bulunulmuştur."
