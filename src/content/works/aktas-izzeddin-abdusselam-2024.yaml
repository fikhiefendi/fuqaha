abstract: "Cihad kavramı geniş anlamlar ihtiva etmekle birlikte genellikle“müslüman olmayanlarla savaş”şeklindeki manası öne çıkarılarak“Allah (cc) yolunda can, mal, dil ve diğer vasıtalarla savaşmak”şeklinde tarif edilmiştir. İslâm'ın erken dönemlerinde müstakil bir tür olarak cihadı öven eserler kaleme alınmış ve bu eserler“Fezâilü'l-cihâd”olarak adlandırılmıştır. İslâm dünyasının içinde bulunduğu şartlara göre bu eserlerin sayısında zaman zaman artma ve eksilmeler olmuştur. 6./12. ve 7./13. asırlar İslâm dünyasının Haçlı Seferleri ve Moğol istilâları ile uğraştığı bir dönemdi. Bu dönemde cihad üzerine yazılan eser sayısında artmalar olduğu gözlemlenmektedir. İbn Abdüsselâm da bu dönemde yaşamış zamanının önde gelen âlimleri arasında yer almaktadır. O, İslâmî ilimlerin pek çok alanında temayüz etmiş bir âlim olmakla beraber özellikle fıkıh ve fıkıh usûlünde öne çıkmıştır. Verdiği fetvalarla meşhur olmuş, halkın hakkını korumak uğruna devlet erkânıyla pek çok defa karşı karşıya gelmiştir. Eserlerinde cihad konusunu sıklıkla vurgulayan İbn Abdüsselâm Ahkâmü'l-cihâd ve fezâilühû isminde bir eser kaleme alarak halkı cihad konusunda bilgilendirmeyi ve onlara cihadın faziletlerini anlatmayı amaçlamıştır. Bu çalışma döneminde ilmî otorite olan İbn Abdüsselâm'ın hayatını ve onun Ahkâmü'l-cihâd ve fezâilühû isimli eserini konu edinmektedir. Giriş ve sonuç dışında iki bölümden oluşan çalışmanın giriş bölümünde İbn Abdüsselâm'ın yaşadığı dönemin siyasî, sosyal ve ilmî durumu değerlendirildikten sonra çalışmada istifade edilen kaynaklar ve araştırmalar hakkında bilgi verilmiştir. Birinci bölümde İbn Abdüsselâm'ın hayatı ve ilmî kişiliği ele alınmıştır. İkinci bölümde ise Ahkâmü'l-cihâd ve fezâilühû isimli eseri muhteva, kaynaklar, usûl ve dil açısından incelenmenin yanı sıra tarihsel bağlamda ele alınmış ve dönemin siyasî ortamının esere ne şekilde yansıdığı incelenmiştir."
