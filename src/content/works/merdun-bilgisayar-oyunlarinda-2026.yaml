abstract: "Teknolojik gelişmelerle birlikte dijital oyunlar, emek ve sermaye karşılığında tedavüle sokulan varlıkların maddi karşılık bulduğu küresel sosyo-ekonomik sistemlere dönüşmüştür. Sanal varlıkların kazandığı bu iktisadi değer, beraberinde oyun ekosistemlerinde gerçekleşen dijital veri hırsızlığı gibi yeni suçları gündeme getirmiştir. Geleneksel hukuki normların fiziksel mülkiyet kavramına göre şekillenmiş olması ise soyut nitelikteki dijital varlıkların hukuki statüsünün belirlenmesinde boşluklar doğurmuştur. Bu çalışma, bilgisayar oyunlarında meydana gelen dijital hırsızlık fiillerini Türk Ceza Kanunu (TCK) ve İslam hukuku penceresinden mukayeseli bir perspektifle ele almayı amaçlamaktadır. Literatürde bu iki hukuk disiplinini dijital veri/varlık hırsızlığı özelinde bir araya getiren bütüncül bir analizin bulunmaması, çalışmanın özgün değerini oluşturmaktadır. Araştırmada nitel araştırma modellerinden belgesel tarama yöntemi kullanılmış; elde edilen veriler betimsel içerik analizine tabi tutularak tasnif edilmiştir. Tezin kuramsal zeminini pozitif hukukta yasal mevzuat ve Yargıtay kararları, İslam hukukunda ise temel dini kaynaklar ile klasik ve modern dönem eserleri oluşturmaktadır. Araştırma sonucunda, bilgisayar oyunlarının makâsıdü'ş-şerîa kriterleri ekseninde fıkhen mubah olduğu; ekonomik değer, hukuki kontrol ve aidiyet barındıran dijital varlıkların ise değişen zaman, örf, zarûret ve maslahata dayanan istihsân gereği“mal”kapsamında değerlendirilmesi gerektiği tespit edilmiştir. Sanal dünyadaki şifreleme mekanizmaları kanaatimizce modern“hırz”olarak kabul edilse de mülkiyet hususundaki belirsizlikler nedeniyle dijital hırsızlığın“had”cezasını gerektiren bir sirkat suçu oluşturmadığı,“hadlerin şüpheyle düşmesi”kuralı gereğince dijital oyunlarda gerçekleşen hırsızlığın çağdaş bir“ta'zir”suçu sayılması gerektiği belirlenmiştir. Pozitif hukuk boyutunda ise Yargıtay'ın 2017 sonrasındaki güncel kararlarında bu fiilleri nitelikli hırsızlık (TCK m. 142/2-e) yerine bilişim suçu (TCK m. 244/4) kapsamında değerlendirdiği görülmüştür. Ancak bu durumun, internet bankacılığı hırsızlığı uygulamalarıyla çelişerek hukuki paradokslara yol açtığı saptanmıştır. Nihayetinde çalışma; suçta ve cezada kanunilik ilkesini zedelemeden hak kayıplarını önlemek adına, soyut“veri”kavramından ayrışan, sanal mülkiyeti doğrudan koruyan müstakil bir“dijital varlık”tanımının TCK'ye kazandırılması ve bu doğrultuda yasal bir reform yapılması gerektiğini ortaya koymaktadır."
