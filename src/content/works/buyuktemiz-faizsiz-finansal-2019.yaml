abstract: "Faizsiz finansal bankacılık, yirminci yüzyılın ikinci yarısından itibaren dünya üzerinde gittikçe yayılan ve piyasa üzerindeki etkisini arttıran bir oluşumdur. Özellikle Arap dünyasındaki petrol rezervlerinin bulunması ve buralardaki maddi gelirlerin artması, faizsiz bankacılığın bulunmasında önemli rol oynamıştır. Temel prensip olarak İslami hukuka ve geleneklere uygun bir model olan faizsiz bankacılık son yıllarda Türkiye'de de kendisine yer bulmaya başlamıştır. Mevcut piyasa üzerinde oldukça etkili bir paya sahip olan faizsiz bankacılık ve muhasebe standartlarının, önümüzdeki yıllarda gittikçe artan değerler arasında yer alacağı hakim öngörüler arasındadır. Konu ile ilgili yapılacak sonraki araştırmalara ve çalışmalara ışık tutması bakımından bu kavramların karşılaştırmaları konumuzda derinlemesine incelenecektir."
