abstract: "?204 Numaralı Şer`iyye Sicili Defterine Göre Urfa'da Ekonomik Sosyal ve Kültürel Hayat? başlığı altında yaptığımız bu tez çalışmamızın amacı, söz konusu sicilin transkripsiyonun yapılması ve sicilde yer alan kayıtların değerlendirilmesiyle Urfa'nın ekonomik, sosyal ve kültürel hayatına dair bilgilere ulaşılmasıdır.Çalışmamız giriş ve iki bölümden meydana gelmektedir. Giriş kısmında Urfa ilinin tarihin ilk dönemlerinden cumhuriyet dönemine gelinceye kadar genel tarihinden, Osmanlı Devleti'nde yargı sisteminin önemli unsurlarından biri olan şer`iyye mahkemeleriyle bu mahkemelerdeki görevliler ve yargılama usûlünden, şer`iyye sicillerinin muhtevası, önemi ve bu sicillerdeki belge çeşitlerinden söz edilmiştir.Birinci bölümde, sicildeki dava kayıtlarından yola çıkarak Urfa'nın sosyal, ekonomik ve kültürel hayatı tahlil edilmeye çalışılmıştır. İki ana başlık altında ele alınan bu bölümde Urfa toplumunun temelini oluşturan aileden, Urfa halkının günlük hayatta kullandığı çeşitli elbise ve eşyadan, toplumdaki Müslim-gayr-i müslim ilişkilerinden, Urfa'da kullanılan isim, ünvan ve lakaplardan, Urfa'daki çeşitli ekonomik faaliyetlerden, miras işlemlerinden, vakıf müessesesi ve bu müessesenin işleyişinden söz edilmiştir. İkinci bölümde 204 numaralı Urfa Şer`iyye Sicili'nin transkripsiyonu verilmiştir."
