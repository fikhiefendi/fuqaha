abstract: "Bu çalışmada hisse senedi arındırma yöntemleri kara dayalı ve gelire dayalı yöntemler olmak üzere iki başlık altında incelenmiştir. Her iki yöntemi tavsiye eden kurumlardan bahsedilmiştir. Arındırma yöntemlerinin gerçek verilere uygulandığında gösterdiği sonuçların incelenebilmesi için BIST katılım 100 endeksinden hesaplanama için elverişli verisi olan 69 şirketin 2022-2024 yılları arası üç yıllık arındırma tutarları her iki yönteme göre hesaplanmış ve karşılaştırılmıştır. Çalışmada ana çıktı olarak bu 69 şirketin toplam arındırma tutarları hesaplanmıştır. Ek olarak arındırma oran ve tutarlarının hangi makroekonomik değişkenlerden etkilendiği, farklı sektörlerde nasıl değişiklik gösterdiği, yatırımcı kâr veya zarar ettiği durumlarda arındırmanın gerekli olup olmadığı incelenmiştir. Çalışmada ortaya koyulan en önemli bulgular gelire dayalı arındırma yönteminin kâra dayalı yönteme göre çok daha fazla tutarda arındırma yapmayı gerektirmesi ve şirketlerin katılım finansına uygun olmayan gelir oranlarının reel faiz arttıkça arttığının gösterilmesidir."
