abstract: "Eşya hukuku, insanın nesneyle olan ilişkisinden kaynaklanan hakları inceleyen bir hukuk dalıdır. Aynî haklar olarak isimlendirilen şahsın eşya üzerindeki bu hakları; mülkiyet hakkı ve sınırlı aynî haklar olmak üzere güç ve nitelik açısından iki ana gruba ayrılır. Mülkiyet hakkı, aynî haklar arasında en güçlü olanıdır. Mal sahibine, mutlak sahiplik hakkı verir ve mal üzerinde tam kontrol ve tasarruf yetkisi sağlar. Mülkiyet hakkı, malın kullanımından kaynaklanan tüm menfaatleri elde etme yetkisini içerir ve mal sahibine mal üzerinde en geniş yetkileri sunar. Sınırlı ayni haklar ise mülkiyet hakkının sınırlanmış biçimleridir. Bu haklar, mal üzerinde belirli yetkileri ve kullanım haklarını içerir, ancak tam sahiplik hakkını vermez. Çalışmamızın bel kemiğini oluşturan intifâ hakkı da sınırlı ayni haklar kategorisine dahildir. İntifâ hakkı, mal sahibine, malın kullanımından kaynaklanan menfaatleri elde etme yetkisi sağlar. Ancak mal sahibinin tam mülkiyet hakkını sınırlar ve belirli bir süre veya belirli bir amaca yönelik olarak kullanılabilir. İntifâ hakkı İslam hukukunda mal sahibinin mal üzerindeki menfaatleri elde etme yetkisini ifade eder. Türk medenî hukukunda ise intifâ hakkının hukukî niteliği ve kullanımı farklı yorumlanabilir. Buna göre bazı yorumlarda intifâ hakkı mülkiyet hakkının bir parçası olup, mülkiyet hakkının sınırlarını belirlerken; bazı yorumlarda intifâ hakkı tamamen ayrı bir hak olarak ele alınır. Bu çalışmada intifâ hakkının hukukî niteliği, tanımı, sınırları, kaynakları, hak sahipleri, korunması ve kullanımı gibi konular İslam hukuku ve Türk medenî hukuku özelinde ayrı ayrı incelenmiştir. Her iki hukuk sistemindeki benzerlikler ve farklılıklar ortaya konulmuş ve intifâ hakkının önemi ve değeri üzerinde durulmuştur. Bu şekilde, intifâ hakkının hukukî niteliği ve sağladığı yetkilerin karşılaştırmalı bir değerlendirmesi yapılarak kapsamlı bir anlayış sunulmaya çalışılmıştır."
