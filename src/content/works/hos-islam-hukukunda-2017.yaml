abstract: "Bir duyguyu, düşünceyi, fikri veya doğal bir olayı anlatmak gayesiyle, ölçülü ve ahenkli seslerin belirli bir sanat anlayışı içerisinde, ritimli veya ritimsiz olarak estetik bir şekilde bir araya getirilmesi ile oluşan müzik, zamanla Hz Peygamber (s.a.v) dönemindeki sade kullanımından uzaklaşıp çok daha girift bir hal almıştır. İslam Hukukçuları genel olarak müziği, çalgı aleti kullanılıp kullanılmaması bakımından iki farklı kısımda incelemişlerdir. Bu noktada birçok görüş öne sürülmüş olup, Âlimler genel olarak müziğin istisnai durumları dışındaki hallerine cevaz vermeyip, müziğin İslam hukuk ilkelerine uygun olması şartı ile meşru olabileceğini belirtmişlerdir. Bu çalışma, giriş, dört bölüm ve sonuç bölümünden oluşmakta olup, müziğin İslam hukuku açısından araştırılması ele alınmıştır."
