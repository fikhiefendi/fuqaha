abstract: "Bu tez; 17. yüzyıl Osmanlı Devleti'nin hüküm sürdüğü coğrafyada yaşamış, farklı dönemlerde müderrislik, kâdılık, kazaskerlik ve şeyhülislâmlık vazifelerinde bulunmuş; devrinin âlim, müftî ve müverrihi, Karaçelebizâde Abdülaziz Efendi'nin fetvâ mecmû'ası türündeki eseri olan (Fetâvâ-yı Karaçelebizâde)'nin nikâh-talâk bölümlerinin transkripsiyon ve îzâhatları başta olmak üzere müellifin hayatını, fıkhî/tabiî şahsiyetini, eserlerini, İslâm fetvâ müessesini, Osmanlı hukuk nizâmını, İslâm aile hukuku konularını kapsamaktadır. İlaveten, tarihin seyri içerisinde önemli bir mevkiyi tutan şeyhülislâm fetâvâlarının içinde çalışılmayı bekleyen (Fetâvâ-yı Karaçelebizâde) isimli eseri ana hatlarıyla tanıtıp günümüz araştırmacılarının hizmetine sunmayı ve özellikle bu eser içerisindeki aile hukuku konularını ihtivâ eden nikâh-talâk mevzularını tetkik etmeyi amaçladık. Çünkü aile, İslâm tarihi ve kültürü içerisinde yer alan en önemli yapı taşlarından biridir. Biz de Türk-İslâm medeniyetinin önde gelen mümessillerinden olan Osmanlı Devleti'nin mühim bir ferdi Karaçelebizâde'nin şeyhülislâm olduğu dönemlerdeki fetvâlarına yansıyan aile yapısını ve Osmanlı hukuk nizâmını inceleyerek nice faydalı sonuçlara ulaşmak, literatürümüze önemli bir değer kazandırmak istiyoruz. Bu bilgi ve neticelere ulaşırken ikinci bir nüshaya ulaşamadığımız için başta fetvâ eserinin orijinal el yazması olan nüshadan faydalanma yolu izlenmiştir. Bunun yanında kıymetli, tarihte yerini sağlam bir şekilde alan fıkıh kitaplarıyla birlikte muteber tarih kitapları ve konumuzla irtibatlı gördüğümüz; kitap, tez, makale, akademik dergi yazısı ve ansiklopedi maddesi gibi her türlü te'lifâttan da faydalanılmıştır. Çalışmamızda takip ettiğimiz bu usûle ek olarak, nikâh-talâk mevzularının transkripsiyonunda elde ettiğimiz malumatlarla birlikte eserin; rakamsal tahlilleri, muhtevasından çıkardığımız bilgiler de çalışmamıza ışık tutmuştur. Bu tez çalışması, müellifin hayatî bilgilerini devrin tarihî bağlamıyla eseri ve eserin mevzumuzla alakalı bölümlerini ise İslâm aile hukuku bağlamında değerlendirmek suretiyle yürütülmüştür."
