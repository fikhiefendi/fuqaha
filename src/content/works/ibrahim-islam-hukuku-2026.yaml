abstract: "Bu tez, makasıd açısından hürriyeti, İslam hukuku ve pozitif hukukta, birey-devlet-toplum arasındaki ilişkilerin inşasında etkili olan en önemli teşri'I maksatlardan biri olarak ele almaktadır. Çalışmanın önemi, özgürlüğün insani ve teşri'I düşüncedeki merkezi konumundan, diğer hakların düzenlenmesindeki rolünden ve yönetim ile sorumluluk arasında denge sağlanmasından kaynaklanmaktadır. Araştırma, İslam Hukuku ve pozitif hukukta hürriyetin kavramsal temellerini ortaya koymayı, bu kavramın usul düşüncesindeki gelişimini analiz etmeyi hedeflemektedir. Ayrıca başta adalet, saygınlık, din, akıl ve nefsin korunması olmak üzere makâsıd sistemi içinde hürriyetin yerini açıklamayı amaçlamaktadır. Ayrıca günümüz hukuk düşüncesi felsefesinde hürriyetin dayanığını analiz ederek her iki sistemin dayandığı kaynak ve usûlleri karşılaştırmayı da hedeflemektedir. Tezde dört temel yöntem kullanılmıştır: Şer'i ve hukuki metinleri takip etmek için tümevarımsal yöntem, hükümlerin makâsıdını açıklamak için analitik yöntem, ittifak ve ihtilaf noktalarını tespit etmek için karşılaştırmalı yöntem ve kavramın İslami ve Batı bağlamlarındaki gelişimini izlemek için tarihsel yöntem. Çalışmanın ulaştığı sonuca göre İslam Hukuku, hürriyeti ibadet ve ahlak temelli bir çerçevede ele alarak bireysel haklar ve kamu maslahatı arasında denge kurmakta; buna karşılık pozitif hukuk çoğunlukla göreceli felsefi zeminlerden hareket etmekte ve uygulamada çelişkilere neden olmaktadır. Tez, İslam Hukunun makâsıdı ile pozitif hukukun araçlarından istifade ederek insan onurunun korunmasına katkı sağlayan ve şer'î sâbiteler ile yeni devlet düzeninin gereklilikleri arasında denge kuran bütünlüklü bir teşri' sisteminin inşa edilmesini önermektedir."
