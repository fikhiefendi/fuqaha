abstract: "Tarih boyunca çocuklar, toplumun en zayıf kesimini oluşturmuşlardır. Bu durum onların, haklarının ihlal edilmesine ve hor görülmelerine neden olurken dolaylı olarak da, fiziksel ve ruhsal gelişimlerini olumsuz yönde etkileyerek topluma kazandırılmalarına engel oluşturmuştur. Bu hususta İslâm hukuku, bireye verdiği önem ile çocuğun bedensel ve ruhsal gelişimini, bunun yanı sıra da haklarını koruma altına almaya çalışmıştır. Osmanlı Devleti de, fıkıhtaki hüküm ve uygulamalardan yola çıkarak çocuğun her açıdan korunması için uğraşmıştır. Fakat çocukla ilgili mevcut çalışmaların Tanzimat Fermanı'ndan sonra olması nedeniyle Osmanlı Devleti'nin klasik döneminde çocuğun toplumdaki konumu ve çocukla ilgili İslâm hükümlerinin ne derece uygulandığı hususu belirsiz kalmıştır. Dolayısıyla bu tez çalışmasında, çocuğun İslâm ve Osmanlı hukukundaki hakları, bakımı, himâyesi, çocuğa yönelik işlenen suçlar ve sicillere yansıyan çeşitli konular incelenerek Konya örneği üzerinden Osmanlı toplumunda çocuğun konumu ve hukukî durumu tespit edilmeye çalışılacaktır."
