abstract: "Bu araştırma, Doğu ve Batı ekonomik etkilerinin kesiştiği bir şehir olan İstanbul, Türkiye'de katılım sigortacılığının gelişen sahnesini incelemektedir. Tekafül sigortacılığı olarak da bilinen katılım sigortacılığının kendine has özelliklerine ve İslami finans standartlarıyla uyumuna odaklanan çalışma, tarihsel gelişimini, düzenleyici sistemini, itici güçlerini, zorluklarını, toplumsal etkisini ve etik düşüncelerini ayrıştırmaya çalışmaktadır. Bu araştırmayı yönlendiren temel soru şudur:“İstanbul'da katılım sigortacılığının gelişimini yönlendiren temel faktörler nelerdir ve bölge içinde etik ve islami sigortacılığa uygun finansal düzenlemelerin değişimine nasıl katkıda bulunmaktadır?”Araştırma, bu soruyu ele alarak mevcut literatürdeki önemli bir boşluğu doldurmakta ve politika yapıcılar, sektör ortakları ve analistler için önemli bilgiler sunmaktadır. Kapsamlı bir yaklaşım kullanan çalışma, İstanbul'daki katılım sigortacılığının yönünü belirlemek için bir anket kullanarak nicel veri analizini kullanmakta ve etik finans ve sigorta konusundaki daha geniş konuşmaya katkıda bulunan nüanslı keşiflerin reklamını yapmaktadır. Anket, İstanbul'da katılım sigortacılığının gelişiminin temel itici güçleri olarak ahlaki ve islami sigortacılığa uygun finansal düzenlemelere yönelik kritik bir tercihi ortaya çıkarmıştır. Ayrıca, bulgular katılım sigortacılığının toplumsal etkisinin altını çizmekte, toplum ve sosyal görevlerin geliştirilmesindeki rolünü vurgulamaktadır. Bu deneyimler, İstanbul ve ötesinde finansal hizmetler içinde etik ölçümleri geliştirmeyi hedefleyen politika yapıcılar ve sektör ortakları için çok önemlidir."
