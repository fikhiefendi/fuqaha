abstract: "Günümüzde Yunanistan sınırları içerisinde kalan ve Batı Trakya diye isimlendirilen bölgede yaşayan Müslüman-Türk azınlığı eğitim, vakıflar ve müftülük gibi toplumsal yapıyı çok yakından ilgilendiren pek çok sorunla yüz yüze gelmektedir. Bu pek çok sorunun içinde en önemlisi ve en çok tartışılanı Batı Trakya Müslüman-Türklerinin Müftülük sorunudur.Bu sorunun iki önemli yönü vardır. Bunlardan birincisi müftülerin seçimi sorunudur. Bu sorunda seçilmiş müftü-atanmış müftü ayırımı tartışılmaktadır. İkincisi ise atanmış müftülerin sahip oldukları yetkilerle ilgili tartışmalardır.Müftülerin seçimiyle ilgili epey çalışmaya rastlamak mümkünken, müftülerin sahip oldukları yetkilerle ilgili bilimsel çalışmalara aynı önemin verildiğini söylemek mümkün değildir.Batı Trakya'daki resmi müftülerin şahıs, aile ve miras hukukuyla ilgili kazaî görevleri yanında, din görevlilerinin göreve gelmesi ve vakıfların denetimi gibi idari yetkilerinin olduğunu da görmekteyiz.Müftülerin sahip oldukları bu yetkiler İstanbul Antlaşması, Atina Barış Antlaşması, Sevr Antlaşması ve Lozan Antlaşması gibi uluslararası antlaşmalara dayanmaktadır. Ancak günümüzde konuyla ilgili ciddi tartışmalar yapılmaktadır. Bu tartışmaların bir kısmı uluslararası antlaşmalarla ilgiliyken, bir kısmı da Yunanlı yazarlar tarafından İslâm hukukuna getirilen eleştirilerle ilgilidir.Söz konusu sebeplerden dolayı bu çalışmamızda, antlaşmalarla kendilerine verilen ve günümüzde de geçerliliğini devam ettiren müftülerin yetkilerini ele alarak konuyla ilgili Yunanlı yazarların düşünce ve eleştirilerine de yer vereceğiz."
