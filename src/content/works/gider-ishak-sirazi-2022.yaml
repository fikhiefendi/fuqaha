abstract: "“Ebû İshâk eş-Şîrâzî'nin Nesih Anlayışı”adlı bu çalışmamız bir giriş iki bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu ve sunulması, sınırlandırılması, amacı ve önemi, kavramsal çerçevesi, yöntem ve tekniğine değinilmiştir. Buna ilaveten bu bölümde araştırmanın kaynaklarına yer verilmiştir. Birinci bölümde Şîrâzî'nin yaşadığı çağ, hayatı, öğrencileri, hocaları ve eserleri hakkında bazı bilgiler verilmiştir. Tezin esas kısmını oluşturan ikinci bölümde ise Şîrâzî'nin nesih ile ilgili görüşleri ortaya konulmaya çalışılmıştır. Bu bölümün başlıkları Şîrâzî'nin el-Lüma', Şerhu'l-Lüma' ve et-Tabsira eserlerinden hareketle oluşturulmuş, neshin mahiyeti, imkân ve vukuu, vaktinden evvel bir emrin neshi, bedelli ve bedelsiz nesih, te'bîd kayıtlı bir hitabın neshi, nesih türleri, neshin mahalli (konusu), haberlerde nesih, delillerin birbirini neshi, önceki şeriatlar bağlamında nesih gibi başlıklar yer almıştır. Her başlık altında Şîrâzî'nin görüşlerinin yanında bazı usulcülerin nesihle ilgili görüşleri verilmiştir. Zaman zaman bu görüşlerin Şîrâzî'nin görüşleriyle mukayesesi yapılmıştır. Şîrâzî'nin eserlerinde nesih bahsi incelendiğinde, onun cedelci kişiliğe sahip olduğu görülür. O, çoğunlukla farklı görüşleri verdikten sonra kendi görüşünü deliliyle birlikte açıkça belirtir. Bazen farklı görüşlere ve konuyla ilgili gelebilecek muhtemel itirazlara da yer vererek, bu görüşlerin veya itirazların aksini ispat etmeye çalışır. Bu çalışmada Şîrâzî'nin nesihle ilgili görüşleri ele alınırken, zaman zaman görüş ayrılıklarının sebepleri üzerinde durulmuş, konuyla ilgili bazı çıkarımlar ve değerlendirmeler yapılmıştır. Şîrâzî'nin eserlerinde nesih konusu ele alınırken birçok fırkanın görüşlerinden söz edilir. Ancak onun en çok tenkit ettiği mezhebin Mu'tezile olduğunu söylemek yanlış olmaz. Nitekim nesih konusu bağlamında Mu'tezile'nin konuyla ilgili görüşleri muhtelif yerlerde gündeme getirilerek tenkit edilir. Şîrâzî'nin nesih ile ilgili görüşlerinde usul geleneğine bağlı kaldığı, bazı meselelerde ise geleneğe muhalif bir tutum sergilediği görülmüştür. Bazen de daha önce yazdığı eserinde benimsediği görüşünü terk ettiği tespit edilmiştir. Anahtar Kelimeler Fıkıh, Ebû İshâk eş-Şîrâzî, Nesih, Şâfiî, Lüma'"
