abstract: "Bu çalışmada, yaşadıkları dönemin Hanefi mezhebinde otorite olan Mâtürîdî'nin“Te'vîlâtü'l-Kur'ân”, Cessâs'ın“Ahkâmu'l Kur'ân”tefsirlerinden belirlenen Mekkî ayetlerdeki hükümler ve konu ile ilgili yorumları incelenmektedir. Tez; giriş, iki ana bölüm ve sonuç olmak üzere dört bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi, kapsamı/sınırları, yöntemi, kaynakları ve konunun sunulması ile ilgili bilgiler verilmektedir. Birinci bölümde Mâtürîdî ve Cessâs'ın hayatları, eserleri ve tefsir yöntemleri hakkında kısaca bilgi verildikten sonra konunun kavramsal çerçevesi denilebilecek“hüküm/ahkâm”,“ayet”,“ahkâm ayetleri”tanımlanmakta; ahkâm ayetlerinin sayısı, tesbiti, üslubu, tasnifi ve Kur'an-ı Kerim'den hüküm çıkarma ile ilgili hususlarda açıklamada bulunulmaktadır. İkinci bölümde ise Mekkî sûre/ayet hakkındaki açıklamaların ardından, Mâtürîdî ve Cessâs'ın tefsirlerinden belirlenen Mekkî ayetlerdeki ibadetler, ahlak, muâmelât ve ukûbât ile ilgili ahkâm ayetlerine yaptıkları yorumlar, ayetlerden çıkardıkları hükümler incelenmektedir. Ayrıca ilgili başlıklar altına girmeyen bazı hüküm ayetleri“diğer bazı hükümler”başlığı altında ele alınmaktadır. Sonuç kısmında ise araştırmada ele alınan müfessirlerin ve meselelerin genel bir değerlendirmesi ile elde edilen sonuçlar yer almaktadır."
