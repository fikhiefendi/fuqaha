abstract: "Bankacılık sektöründe rekabet arttığından beri; müşteri perspektifi bankacılık sektöründe önemli bir unsur haline gelmiştir. Dolayısıyla, İslami bankacılık hizmetlerinden yararlanan tarafların İslami bankacılık faaliyetlerine yönelik tutum ve davranışlarının tespit edilmesini gerekli kılmaktadır. Bu çalışmada Türkiye'deki Türk ve Suriyeli müşterilerin tutumu istatiksel yöntemler kullanılarak incelenmektedir. Müşterilerin tutumları demografik özelliklere, eğitimin niteliğine, mesleğe ve yaş gruplarına göre araştırılmaktadır. Bankaların mevcut ve potansiyel müşterileri için İslami bankacılık faaliyetlerinin müşteri algısı anket yöntemi ile belirlenmektedir. Anket sonuçlarına göre, İslami bir banka ile çalışmayı tercih eden, etmeyen ve kararsız olan Türk ve Suriyeli katılımcıların tüm cevapları baz alınarak istatistiksel olarak aralarındaki farklılıklar tespit edilmeye ve anlamlılıklarının test edilmesi amaçlanmıştır. SPSS uygulaması kullanarak katılımcıların İslami bankacılık meselesiyle bağlantılı ifadelere katılıp katılmadıklarını ölçmek için açıklayıcı analiz, Likert Ölçeği, Ki-Kare Testi ve T-testi uygulanmıştır. Çıkan sonuçlara göre, yaş, meslek ve aylık gelir hem Türk hem de Suriyeli müşterilerin üzerinde İslami bankacılık tercihinde etkisi bulunmaktadır. Ancak cinsiyetin İslami bankacılık tercihinde ne Türk ne Suriyeli üzerinde Etkisi vardır. Eğitim düzeyine gelince; Türk müşterilerin üzerinde etkisi yoktur, Suriyeli müşterilerin üzerinde ise etkisi bulunmaktadır. Türkler ile Suriyelilerin sonuçları karşılaştırıldıktan sonra, cinsiyete, eğitim düzeyine, mesleğe ve aylık gelire göre Türkler ve Suriyeliler arasında ilişki bulunmaktadır. Fakat yaşa göre Türkler ve Suriyeliler arasında bir ilişki yoktur. Faktörlere gelince, din faktörü, banka itibarı, müşteri bilinci, hizmet kalitesi ve müşteri davranışı etkisi sonuçlanmaktadır. Kitle iletişim araçları faktörü ise Türklerin üzerinde etkisinin olduğu söylenebilir; Suriyelilerin üzerinde ise etkisi bulunmamaktadır."
