abstract: "TÜRKÇE ÖZET İslam Hukukunda Âkile Müessesesi adlı bu yüksek lisans tezinde, İslam ceza hukuku alanında hata ve şibh-i amd (kasıt benzeri) yoluyla işlenen cinayetlerin diyetinin kimler tarafından ve ne şekilde ödeneceği ele alınmıştır. Âkile Müessesesi; hata ya da şibh-i amd sonucu meydana gelen bir yaralama ya da öldürme olayına belirlenen ağır mâlî ödemenin aralarında“tecavüze karşı yardımlaşma”ya sebep olacak bağlar bulunan birçok kişi tarafından ödenmesi esasına dayanır. Kasıt unsuru taşımayan öldürme ve yaralamalarda İslam Hukukunca diyetin ödenmesinde cani ile beraber âkilenin sorumlu tutulmasındaki müessir sebep(illet), âkile bireyleri arasında tecavüze karşı karşılıklı dayanışmanın (tenâsur) bulunmasıdır. Diyetin âkileye taksimi ile, öldürme kasdı taşımayan failin, yüksek bir meblağ olan mâlî ödemede iktisaden sıfırlanmaması için ona bir yardım ve mağdur tarafın da maddî ve manevî zararının giderilmesi hedeflenmiştir. Âkilenin diyeti ödeme süresi, üç senede tamamlanmak üzere icma ile belirlenirken, Mâlikî fakihlerince, sıkıntıya düşmeden yerine getirilmesi için âkileyi oluşturan sayı geniş tutulmaya çalışılmıştır. Âkileyi oluşturan gruplar Hz.Peygamber (s.a.v.) zamanında caninin asabesi ve kabilesi iken Hz.Ömer (r.a.) zamanında, âkile olarak divan oluşturulmuştur. Hanefî ve Mâlikîlerce, divan uygulamasından istifade ile, çeşitli iş ve meslek gruplarının da birer âkile olabileceği hükmüne varılmıştır. Âkile içerisinde dayanışma ehli olmayan kadın, çocuk ve delilerden diyet alınmaz. Bütün vatandaşları kapsayacak şekilde düzenlenen âkile müessesesinde, caninin âkilesi bulunmaması veya fakir olmaları durumunda, diyeti devlet üstlenir. Bu çalışmada, Hz.Peygamber (s.a.v.) ve sahabe tatbikatı esas alınarak bütün mezheplerin görüşleri değerlendirilmek suretiyle âkile müessesesinin günümüzde de -aralarında dayanışma bağı olabilecek meslek gruplarına- uygulanabilirliği tespit edilmiştir. Âkile, can ve mal güvenliğinin sağlanmasında önemli bir fonksiyon icra edebilecek olan, sosyal dayanışma ve murakabenin ortaya konduğu orijinal bir alternatif müessese olarak düşünülebilir. vıu"
