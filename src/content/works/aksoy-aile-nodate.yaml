abstract: "İslâm hukukunda aile hayatına ve aile hayatının tesisini sağlayan evlenmeye büyük önem verilmiştir. Zira evlenmenin hem bireyler hem de toplum açısından dünyevî ve uhrevî birçok maslahatı vardır. Bunların en önemlisi de fıtrattan gelen bazı arzuların meşru dairede karşılanması ve neslin belli bir düzen içerisinde devamının sağlanmasıdır. Ancak bazı hallerde taraflar, evlilik hayatında bulunması gereken sevgi, şefkat ve saygı duygularını yitirebildiklerinden evliliğin sonlandırılması kaçınılmaz olabilmektedir. Bu sebeple İslam hukukunda evlenme akdi, evlilik hayatı ve evlenmenin sona ermesine ilişkin köklü düzenlemeler getirilmiştir. Söz konusu düzenlemelerin azımsanmayacak bir kısmı da Kur'an'da yer almıştır. Ne var ki âyetlerin önemli bir bölümünün delalet açısından içtihada açık olması birçok hükmün ictihad ile istinbat edilmesini gerekli kılmıştır. İctihad ise hem farklı usullerin benimsenmesinden hem de müctehidlerin kavrayış ve anlayışlarının farklılık arz etmesinden kaynaklı olarak ihtilaflara sebebiyet vermiştir. İşte bu çalışmada, aile hukuku ile ilgili ahkâm âyetleri bağlamında vuku bulmuş ihtilaflar incelenmiştir. Bu kapsamda görüşlerin usulî dayanakları ve her bir görüş sahibinin diğer görüşlere ilişkin yaklaşımları ele alınarak ihtilafların şekillenmesinde etkili olan sebepler tespit edilmeye çalışılmıştır. Fıkhî ihtilafların ele alındığı gerek klasik gerekse modern birçok eser bulunmakla birlikte bu çalışmada hedeflenen tarzda bir araştırma tespit edilemediğinden tezin alana katkı sağlayacağı ve İslam hukukunun diğer konularında yapılacak çalışmalara örneklik teşkil edeceği düşünülmektedir. Çalışmanın sonucunda ihtilafların, kişisel heva, ideolojik görüş, siyasi düşünce veya mezhepsel taassuptan değil, naklî ve aklî veriler ışığında benimsenen usulî yöntem farklılığına bağlı olarak vuku bulduğu tespit edilmiştir."
