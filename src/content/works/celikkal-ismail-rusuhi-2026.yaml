abstract: "Klasik Türk edebiyatında şerh geleneği göz önünde bulundurulduğunda, şerh geleneğine kaynaklık eden eserler arasında Arapça, Farsça ve Türkçe kasidelerin çokluğu göze çarpmaktadır. İslam medeniyetinin altın çağında, hem Arap hem de İslam edebiyatında derin izler bırakan şairlerden biri olarak bilinen İbnü'l-Fârız, klasik Arap şiirinin en önemli temsilcilerindendir. Aslen Hamâlı olup Kâhire'de dünyaya gelen İbnü'l-Fârız, özellikle tasavvufi şiirleriyle tanınmıştır. Dîvân'ında yer alan şiirler, derin tasavvufi anlamları, ince bir lirizmle birleşen zengin dili ve sembolik anlatımıyla dikkat çeker. Bahsi geçen şerh geleneğine kaynaklık eden kasidelerden biri de İbnü'l-Fârız'ın Dîvân'ında yer alan en meşhur ve en uzun kasidesi olan Kasîde-i Tâʼiyyesi'dir. el-Kasîdetü't-Tâ'iyye ya da uzunluğundan dolayı et-Tâ'iyyetü'l-Kübrâ adıyla bilinen bu kasidenin Türkçe ilk şerhi XVI. yüzyılda Trabzonlu Mehmed Ma'rûf tarafından Şerh-i Kasîdetü't-Tâʼiyye ismiyle yapılmıştır. Tespit ettiğimiz ikinci şerh ise çalışmamıza da konu olan XVII. yüzyılda İsmâil Rüsûhî Ankaravî'ye ait Makâsıd-ı 'Aliyye fî Şerhi't-Tâ'iyye adlı eserdir. Üzerinde çalıştığımız bu şerh kasidenin tamamını yani, 761 beyti ele alması bakımından önemlidir.“İsmâil Rüsûhî Ankaravî, Makâsıd-ı 'Aliyye fî Şerhi't-Tâiyye: İnceleme, Metin, Bağlamsal Sözlük”başlığını taşıyan bu tez bahsi geçen şerhi çevri yazı alfabesine aktarıp analitik bir incelemeye tabi tutarak onun özelliklerini ve Türk edebiyatındaki önemini ortaya koymayı amaçlamaktadır. Bu amaç doğrultusunda çalışma; giriş, dört bölüm, sonuç ve değerlendirme, metin ve bağlamsal sözlükten oluşmaktadır. Giriş bölümünde Türk edebiyatında şerh geleneğine değinilmiştir. Birinci bölümde İbnü'l-Fârız'ın hayatı, Dîvân'ı ve Kasîde-i Tâ'iyye'si hakkında bilgi verilmiştir. İkinci bölümde İsmâil Rüsûhî Ankaravî'nin hayatı, tasavvufi kişiliği ve eserleri üzerinde durulmuştur. Üçüncü bölümde eser ayrıntılarıyla incelenmiştir. Dördüncü bölümde eserin çeviri metni oluşturulmuştur. Bu bölümden sonra eserin daha iyi anlaşılmasını sağlamak için de bağlamsal sözlük hazırlanmıştır. Tüm bunlardan hareketle çalışmanın sonucu ve değerlendirmesi yapılmıştır. Böylece eser, Türk edebiyatı tarihindeki yerine yerleştirilmeye çalışılmıştır."
