abstract: "Fama French Üç Faktör Varlık Fiyatlama Modeline göre hisse senedi getirisindeki değişim; piyasanın risksiz faiz oranı üzerindeki fazla getirisi, ölçek ve DD/PD oranları tarafından açıklanmaktadır. Bu çalışmanın temel amacı Fama French Üç Faktör Varlık Fiyatlama Modelinin İslami finansa uyarlanmasıdır. Çalışmada Geleneksel Fama French Üç Faktör Varlık Fiyatlama Modeli sonuçlarına da ulaşılarak İslami Fama French Üç Faktör Varlık Fiyatlama Modeli sonuçlarıyla karşılaştırılması da amaçlanmaktadır. Bu amaç doğrultusunda KATLM 30 endeksinde yer alan 2011-2017 yılları arasındaki her yıl Aralık ayının sonunda özsermayesi pozitif olan ve kesintisiz verisine ulaşılabilen 25 adet hisse senedi baz alınmıştır. Çalışmada iki ayrı pazar portföyü BİST 100 ve KATLM 30 kullanılmıştır. İslami Fama French Üç Faktör Varlık Fiyatlama Modelinin oluşturulması için faiz oranı yerine enflasyon alınmıştır. Elde edilen hisse senetlerinin aylık verileri regresyon analizi yöntemi ile analiz edilmiştir. Araştırma sonucunda Fama French Üç Faktör Varlık Fiyatlama Modelinin İslami finansa uygulanabilir olduğu ama ilgili dönem için geçerli olmadığı sonucuna ulaşılmıştır. Geleneksel Fama French Üç Faktör Varlık Fiyatlama Modelinde pazar portföyünün BİST100 alındığı modelde SH, BL, BM ve BH portföylerinde geçerli olduğu tespit edilmiştir."
