abstract: "Katılım sigortacılığı 2009 yılında Türkiye'de sigorta sektöründe yerini almış, konvansiyonel sigortacılığın yerine bir seçenek olarak tercih edilmeye başlanmıştır. Muhasebe kayıt işlemleri ve finansal raporlama gibi konulara bakıldığında, katılım sigorta şirketlerinin, aynı konvansiyonel sigortacılık yapan sigorta şirketleri gibi, şirketler taraflarından kullanılan tek düzen hesap planı dikkate alınmakta ve finansal raporlama kapsamlı şekilde oluşturulmaktadır. Finansal raporlar, şirketlerin yıllık sunduğu faaliyet raporlarında yer almakta, şirketin tüm bilgileri, verileri ve sürdürülebilirliği hakkında detaylar veren, açık, şeffaf ve güvenilir raporlardır. Şirketler geçmiş ve güncel bilgileriyle, benzer şirketler ve kendi içinde karşılaştırma sağlayabilmekte ve gelecek yıllar için nasıl bir yol izlemesi gerektiği hakkında bilgi edinebilmektedir. Finansal raporlardaki verilerle bir şirketin etkinliği ölçülebilmekte ve sürdürülebilirlikle ilgili gereklilikler, eksiklikler tespit edilebilmektedir. Sürdürülebilirlik, güncel ihtiyaçlara cevap verebilen, dijital ortama ayak uyduran, teknolojiyi bilen şirketlerin her dönem var olabilmesi için gereklidir. Etkin bir şirket, prim üretimi ve teknik karlılık açısından belirli bir seviyede olan şirkettir ve sürdürülebilirliğe cevap verebilmektedir. Katılım sigorta ürünlerinin sunulduğu şirketlerle ilgili olarak, etkinlik durumlarının ne ölçüde olduğu önemli bir sorudur. Etkinlik ölçümü, şirket hakkında kaynaklarının verimli kullanımı ve faaliyetlerinin etkin şekilde yürütüp yürütemediğini analiz ve etkin olmadığı durumlar için nasıl bir iyileştirme yapabileceği seçeneklerini tespit etmektedir. Çalışmadaki amaç Veri Zarflama Yöntemi ile 2018 2021 yılları arasında katılım sigorta ürünleri sunan şirketlerin etkinliklerini, ilgili girdi ve çıktı değişkenleriyle ölçerek değerlendirmek, değerlendirmeler sonucu etkinlik skorlarına bakılarak, iyileştirmeler hakkında bilgi vermektir. Etkin şirketlerin etkin olmayan şirketlere referans olma oranları yazılarak referans grupları oluşturulmuştur. Elde edilen sonuçlar, şirketlerin ortalama etkinlik skorlarının, yıldan yıla arttığını göstermiş ve ilgili öneriler yapılmıştır."
