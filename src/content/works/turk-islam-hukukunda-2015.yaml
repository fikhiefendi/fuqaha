abstract: "Özür/engel realitesi, kökleri insanlık tarihi kadar eskilere dayanan ve fakat tarih boyu belki de en fazla ihmal görmüş bir vakıadır. O kadar ki geçmişte pek çok inanç engellileri toplumun sırtında bir yük olarak telakki ederken, bazı inançlara göre de engelliler lanetlenmiş kişiler demek olduğu için öldürülmüşlerdir. İlkesel olarak adalet ve kolaylık prensiplerini düstur edinen İslam dininin emirleri, mükelleflerin takat ve yeterlilikleri düzeyindedir. Nitekim bu ilkenin bir iz düşümü olarak, İslam Hukukunda özür sahiplerinin durumları dikkate alınmış, insanların özürleri nispetince mükellefiyetlerinde kolaylıklar sağlanmıştır. Zira İslam, engel mefhumunu kul açısından bir imtihan şekli olarak görmekte, ayrıca sağladığı kolaylıklarla engellileri ötelemeyip muhatap aldığını, dolayısıyla bu bireylere verdiği değeri ortaya koymaktadır. Görme engelinin yaygın dört mezhep ekseninde hükme tesir boyutunun incelendiği bu çalışmada; söz konusu engelin ibâdetler, medeni hukuk, ceza hukuku, cihad, kurban kesme, cizye, kadılık ve devlet başkanlığı sahalarında etkisi olduğu tespit edilmiştir."
