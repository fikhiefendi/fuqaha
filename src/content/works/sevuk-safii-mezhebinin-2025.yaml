abstract: "Şâfiî mezhebinin fıkhî görüşlerinin aktarımında, İmam Şâfiî'nin önde gelen öğrencileri arasında yer alan Büveytî ve Müzenî'nin katkıları büyük önem arz etmektedir. Bu çalışmada, her iki âlimin henüz Türkçeye kazandırılmamış olan 'elMuhtasar' adlı eserlerinde yer alan görüş ayrılıkları incelenmiştir. Özellikle ibadet bahsindeki konulara odaklanılarak, eserler karşılaştırmalı biçimde ele alınmış; İmam Şâfiî'den aktarılan rivayetlerdeki farklılıklar ile müelliflerin kendi tercihleri sonucu doğan ihtilaflar tespit edilmiştir. Araştırmanın ilk bölümünde, Büveytî ve Müzenî'nin hayatları, ilmî kişilikleri ve mezhep içerisindeki yerleri değerlendirilmiş; devamında 'el-Muhtasar' eserlerinin yapısı ve içeriği karşılaştırılmıştır. İkinci bölümde ise abdest, namaz, zekât, oruç ve hac gibi ibadet konularındaki görüş ayrılıkları analiz edilmiş, her bir mesele sonunda Şâfiî mezhebinde muteber kabul edilen görüşe yer verilmiştir. Bu çalışmada, Büveytî ve Müzenî'nin eserlerindeki 46 ihtilaf tespit edilmiş ve sonuç kısmında bu ihtilafların değerlendirilmesi yapılmıştır."
