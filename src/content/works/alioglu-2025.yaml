abstract: "Bu çalışma, Ebû Bekir el-Cassâs'ın“Ahkâmü'l-Kur'ân”eserindeki metinlerin tefsiriyle ilgili usûlî kāideleri ele almaktadır. Ebû Bekir el-Cassâs، Hanefî mezhebinin önde gelen âlimlerinden biri olup, fıkhî tefsirin önemli bir ismidir. Çalışmanın amacı, el-Cassâs'ın Kur'an hükümlerini tefsir ederken kullandığı usûlî kāideleri belirlemek, sınıflandırmak ve karşılaştırmalı bir şekilde incelemektir. Çalışma, usûlî kāidelerin istinbat yöntemlerini düzenlemedeki rolünü ve müçtehidin hata yapmaktan nasıl korunacağına dair açıklamalarla başlamaktadır. Ardından, el-Cassâs'ın sosyal ve entelektüel bağlamı tanıtılmış, sonrasında ise onun tefsir metodolojisi ve usûlî yaklaşımı incelenmiştir. Çalışma, metinlerin incelenmesinde indüktif, analitik ve karşılaştırmalı yöntemler kullanarak, el-Cassâs'ın ayetleri nasıl ele aldığı ve bu ele alışta hangi usûlî kāideleri esas aldığına dair derinlemesine bir çözümleme sunmaktadır. Böylece, usûlî kāideler ile fıkhî tefsir arasındaki güçlü ilişkiyi ortaya koymakta ve el-Cassâs'ın Kur'an'ı tefsir ederken fıkıh usûlünü nasıl uyguladığını göstermektedir. Bu çalışma, araştırmacıların genellikle yeterince üzerinde durmadığı bir alanı aydınlatmakta ve el-Cassâs'ın fıkıh ile Kur'an arasındaki ilişkiyi nasıl kurduğuna dair usûlî yaratıcılığını vurgulamaktadır."
