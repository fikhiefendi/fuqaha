abstract: "Kur'an ve Sünnet metinlerinden türetilen temel hukuk ilkeleri, alt konulara ilişkin hükümlerin uygulanmasında referans görevi görür. Bu hukuk ilkeleri arasında zararla ilgili olanlar da yer almaktadır. Araştırmacı, bu ilkeleri ve bunların savaşın harap ettiği ülkelerde, özellikle Suriye örneğinde, aile hukuku üzerindeki etkilerini incelemektedir. Araştırma, ailenin toplumun temel taşı ve en önemli bileşeni olması nedeniyle aileyle ilgili konulara odaklanmaktadır. Bu araştırma bir giriş ve üç bölümden oluşmaktadır. Giriş bölümü şunları içermektedir: araştırma problemi, araştırma amaçları, konunun önemi, konunun seçilme nedenleri, araştırmanın kapsamı, araştırma metodolojisi ve önceki çalışmalar. Birinci bölüm, başlığın ve ilgili tanımların yanı sıra şu konuları içermektedir: hukuk ilkesi ve hukuksal kontrollerin tanımı ve aralarındaki fark, temel ilkenin tanımı ve hukuk ilkesi ile arasındaki fark, zarar türleri ve bunların hukuken kabul görmüş kontrolleri. İkinci bölüm,“Zarar ortadan kaldırılmalıdır”kuralı ve ondan türetilen ve onunla ilgili kurallar hakkındadır ve“Zarar ortadan kaldırılmalıdır”kuralı,“Zarar ortadan kaldırılmalıdır”kuralıyla ilgili kurallar ve hükümler ile amaçlar ve zararı dikkate almayla ilgili en önemli kurallar gibi konuları içermektedir. Üçüncü bölüm, uygulamalı dallar hakkındadır ve kamplarda çok çocuk sahibi olmanın zararı, kamplarda evliliğin zararı, genel olarak çok eşliliğin zararı, çocuk evliliğinin zararı, sahte evlat edinmenin zararı ve rejim askerleri tarafından tecavüz sonucu kürtajın zararı gibi on bir konuyu içermektedir. Araştırma daha sonra en önemli bulgularını sunmuştur; bunlar arasında şunlar yer almaktadır: Suriye kamplarında uygun yetiştirme koşullarının olmaması nedeniyle geçici doğum kontrolü; Suriye kamplarında evlilik beş yasal hükme tabidir; zarar, evlilikle ilgili orijinal hükmü etkilemez; kamplarda çok eşliliğin mümkün olduğu durumlarda genel zararı önlemek için başka bir kadınla evlenmek zorunludur; Bir erkek ilk eşini ihmal edeceğine inanıyorsa çok eşlilik yasaktır; çünkü benzer bir zarar vererek zarar telafi edilemez; Suriye kamplarında reşit olmayan bir kızla ergenlik çağına gelmeden evlenmek de caiz değildir."
