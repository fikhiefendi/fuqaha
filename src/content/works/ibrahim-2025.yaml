abstract: "Bu araştırma, İslam'ın dört ana fıkıh mezhebinde“nehiy”kavramını ele alan karşılaştırmalı bir usûl-i fıkıh incelemesidir. Çalışmanın amacı, mezhepler arasındaki nehyin delaletlerini ve bu delaletlerin ibadetler ile muamelatlar alanındaki uygulamalarını analiz etmek; ayrıca bunları amaçsal ve tarihî boyutlarla ilişkilendirerek, nehyin şer'î hükümlerin çıkarılmasında merkezi bir rol oynadığını ortaya koymaktır. Bu yönüyle çalışma, dijital para gibi çağdaş fıkhî meselelerde ortaya çıkan garar sorunlarına çözüm getirmeyi, mezhepler arası yöntemleri yakınlaştırmayı, makâsıd temelli içtihadî araçlar geliştirmeyi ve esnek, maslahat odaklı hüküm çıkarımına katkı sağlamayı hedeflemektedir. Böylece şeriatın dinamik ve yaşayan bir sistem olarak anlaşılmasına zemin hazırlamaktadır. Araştırmanın temel problemi, dört mezhep arasında“nehiy”kavramının anlamı ve yorumu konusundaki farklılıkların, hem teklifî hem de vaz'î hükümler açısından önemli ihtilaflara yol açmasıdır. Bu durum, özellikle dijital para gibi yeni meselelerde birleştirici bir içtihadın oluşmasını zorlaştırmaktadır. Bu çalışmada, kavramsal belirsizliği gidermek ve makâsıd odaklı, bütüncül bir yaklaşım geliştirmek amaçlanmaktadır. Araştırma, nehyin farklı delaletlerini (haramlık, mekruhluk, irşad vb.) incelemekte; mezheplerin nehyin haramlığa mı yoksa mekruhluğa mı delalet ettiği konusundaki görüş ayrılıklarını analiz etmekte; nehyin ibadet ve muamelat üzerindeki geçerlilik veya fesad etkilerini değerlendirmekte; klasik ve modern örnekler üzerinden uygulama alanlarını incelemekte ve nihayetinde nehyi şeriatın beş temel amacına (dinin, nefsin, aklın, neslin ve malın korunması) bağlamaktadır. Çalışma, giriş ve üç bölümden oluşmaktadır: Birinci bölümde nehiy kavramının lügat ve ıstılah anlamı açıklanmakta, açık (örneğin“لا تفعل”) ve örtük (lanet, tehdit vb.) kalıpları belirlenmekte, nehyin temel delaletleri ve gerekleri (derhal uygulanma, tekrarlanma, fesad etkisi vb.) analiz edilmektedir. İkinci bölümde, mezheplerin nehyin haramlığa (cumhur) veya mekruhluk yönüne (delil ile) delalet ettiği konusundaki görüş ayrılıkları incelenmekte; nehyin ibadetlerde mutlak fesadı gerektirdiği (Şafiî, Malikî, Hanbelî) veya vasfa bağlı olarak sınırlı fesat doğurduğu (Hanefî) görüşleri karşılaştırılmaktadır. Ayrıca teklifî ve vaz'î sonuçlar arasındaki farklar sistematik olarak ele alınmaktadır. Üçüncü bölümde, nehyin uygulamaya yansımaları analiz edilmekte; ibadetlerde (yasak vakitlerde veya mekânlarda namaz, yasak günlerde oruç) ve muamelatlarda (garar içeren sözleşmeler, fasit şartlar, fasit nikâh, gasbedilmiş mallarda tasarruf) örnekler üzerinden değerlendirmeler yapılmakta; çağdaş meseleler de makâsıdî çerçevede tartışılmakta ve içtihadî öneriler sunulmaktadır."
