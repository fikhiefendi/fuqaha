abstract: "İslam hukuku kaynaklarında dava konusu ele alınırken davalar değişik şekillerde sınıflandırılmıştır. Bunlardan birine göre davalar hukuk davaları ve ceza davaları şeklinde iki gruba ayrılır. Ceza davalarının kendi içinde özel bir taksimine yer verilmemesi nedeniyle ilk bakışta İslam ceza muhakemesi hukukunda tek dava tipinin benimsendiği izlenimi oluşmaktadır. Ancak İslam hukukunun benimsediği meseleci yöntem dikkate alınarak gerekli araştırma yapıldığında aslında bu okumanın gerçeği yansıtmadığını tespit etmek zor değildir. Çünkü İslam hukukunda haklar ve suçlar konusu ayrıntılı olarak ele alınmış, ilgili bölümlerde hangi suçların ne tür hakları ihlal mahiyeti taşıdıkları, hangileri için şahsi dava açılması gerektiği, hangilerinin takibinin resen yapılacağı, resen takibi yapılacak suçlardan hangileri için şikâyet şartı arandığı açıkça belirtilmiştir. Bu çalışmada tümevarım yöntemi kullanılmıştır. Öncelikle kavramsal çerçeve başlığı altında ele alınan konularla İslam hukukunda kamu davasının mahiyeti tespit edilmeye çalışılmıştır. Ardından ikinci bölümde kamu davasının suç işlendiği şüphesi ile başlayıp dava açılması ile son bulan aşamasına kadar olan işleyiş süreci aktarılmıştır. Ayrıca konu İslam hukuku ile ülkemizde yürürlükte olan hukuk (pozitif hukuk) arasında mukayeseli olarak ele alınmıştır. Bu çalışma ile her iki hukuk sisteminde kamu davası açılmasındaki amacın kamu haklarını korumak olduğu, ancak bu iki hukuk sistemindeki hak nazariyesi arasındaki önemli farklılığın kamu davasına yansıdığı görülmüştür. Buna ek olarak İslam ceza muhakemesi hukukunda davaların şahsi dava ve kamu davası şeklinde ikiye ayrıldığı, sırf kamu hakları ile ağırlıklı olarak kamu hakkını ihlal eden suçların takibinin kamu davası kapsamında yapılacağı anlaşılmıştır. Ayrıca kamu davalarının açılması ve devlet adına takip edilmesinin muhtesibin görevleri arasında yer aldığı, muhtesibin bu kapsamdaki görevini günümüzde savcılık kurumunun üstlendiği sonucuna ulaşılmıştır. Anahtar Kelimeler: Hak, Kamu Yararı, Suç, İddia, Muhtesip/Savcı, Muhakeme ve Kamu davası."
