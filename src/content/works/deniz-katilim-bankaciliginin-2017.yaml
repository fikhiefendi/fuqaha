abstract: "Ekonomilerde kritik öneme sahip olan bankacılık sektörü için etkin ve verimli çalışmak büyük önem arz etmektedir. Ekonomilerde son yıllarda yaşanan küresel krizler faizli işlem yürüten bankalara olan güveni azaltmıştır. Faizli işlem yapmak istemeyen yatırımcılarında atıl kaynaklarını harekete geçirip ekonomik sisteme dâhil etmek istemesi insanları farklı banka alternatiflerine itmiştir. Katılım bankaları da mevduat bankalarına alternatif olarak ülkemizde 1983 yılında Özel Finans Kurumları adıyla kurulmuştur. Türkiye'de yıllar itibariyle gelişme gösteren katılım bankaları son on yılda %17 büyüme göstermiştir. Katılım bankalarının aktif büyüklüğü de % 6 seviyelerine ulaşmıştır. Bankacılık sektörünün önemli bir unsuru haline gelen katılım bankalarının kaynaklarının etkin ve verimli kullanıp kullanmadığı çalışma da tespit edilmeye çalışılmıştır. Bu bağlamda Türkiye'de faizle çalışan ticari bankalar ile katılım bankalarının 2011-2015 yılları arasındaki etkinlik performansı Veri Zarflama Analizi ile ölçülmüştür. Malmquist TFV endeksi ile toplam faktör verimliliği ve etkinlik düzeylerinin yıllara göre değişimi ölçülmüştür. Yapılan analiz sonucunda katılım bankalarının mevduat bankalarına göre kaynaklarını daha etkin ve verimli kullandığı tespit edilmiştir."
