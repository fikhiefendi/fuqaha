abstract: "Literatürde fıkhî hükümlere kaynaklık eden hadislere“ahkâm hadisleri”adı verilmiştir. Bu hadisler, İslâm fıkhının temelini teşkil etmiş ve fıkhî hükümlerin çoğu bu rivâyetler üzerine binâ edilmiştir. İhtivâ ettikleri hükümlerin ehemmiyetinden dolayı sözkonusu hadisler muhtelif eserlerde bir araya getirilmiş ve birçok âlim tarafından bu eserler üzerlerinde şerh çalışması yapılmıştır. Bu âlimlerden birisi de hadis şerhçiliğinde önemli bir yere sahip olan İbn Dakîki'l-Îd'dir. İbn Dakîki'l-Îd'in ahkâm hadislerini şerh etmesini konu edinen bu tez giriş, üç ana bölüm ve sonuçtan meydana gelmektedir. Giriş bölümünde İbn Dakîki'l-Îd'in yaşamış olduğu dönem siyâsî, ilmî ve sosyal açıdan genel hatlarıyla incelemeye tâbi tutulmuştur. Birinci bölüm İbn Dakîki'l-Îd'in hayatına ve ilmî kişiliğine ayrılmış ve ilmî kişiliğini oluşturan öğeler üzerinde durulmuştur. Bu bağlamda hocaları, talebeleri ve eserleri araştırmaya konu edilmiştir. İkinci bölümde hadis usûlcülüğü ve bazı hadis meselelerine yaklaşımı ele alınmış ve bu konularda diğer usûlcülerden farklı olan yönleri araştırılmıştır. Üçüncü bölümde İhkâmü'l-ahkâm şerhu Umdeti'l-ahkâm ve Şerhu'l-İlmâm bi-ehâdîsi'l-ahkâm ve el-İmâm fî ma'rifeti ehâdîsi'l-ahkâm adlı eserleri incelenerek İbn Dakîki'l-Îd'in ahkâm hadislerini şerh etmedeki metodu irdelenmiştir. Bu çerçevede ahkâm hadislerini hangi ilke ve esaslar çerçevesinde değerlendirmeye tâbi tuttuğu araştırılarak kendine hâs bir hadis yorum yönteminin olup olmadığı ortaya konulmaya çalışılmıştır. Bu bölümlerdeki açıklamalar neticesinde sonuç kısmı oluşturulmuştur."
