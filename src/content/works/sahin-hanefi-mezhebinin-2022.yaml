abstract: "Hanefî Mezhebinin Diğer Mezheplere Üstünlüğüne Dair Tartışmalar adlı tezde, mezhep üstünlüğü ve tercih tartışmaları el-İntisâr ve't-tercîh li'l-mezhebi's-sahîh ve en-Nüketü'z-zarîfe fî tercîhi mezhebi Ebî Hanîfe adlı risaleler bağlamında incelenmiştir. Mezhep mensupları arasında münakaşa ve münazaralar yaşanmıştır. Mezheplerin kurumsallaşmasıyla birlikte bu tartışmalar, tercih ve üstünlük tartışmalarına dönüşmüştür. Mezhep mensupları mezheplerini diğer mezheplerden üstün olduğunu kanıtlamak için çeşitli eserler kaleme almışlardır. Müellifler kaleme aldıkları bu eserlerde mezheplerinin üstün ve tercih edilebilir olduğunu çeşitli meseleler ve deliller kullanarak anlatmaya çalışmışlardır. Bu alanda kaleme alınan risalelerden biri Eyyûbîler döneminde Sıbt İbnu'l-Cevzî (ö.654/1256) tarafından, diğeri Memlûkler döneminde Ekmeleddin Bâbertî (ö.786/1384) tarafından kaleme alınmıştır. Her iki müellifte kendi dönemlerinde Ebû Hanîfe ve mezhebi hakkında ortaya atılan eleştirilere cevap vermişlerdir. Ebû Hanîfe ve mezhebinin diğer imamlar ve mezheplerine göre özellikle Şafiî mezhebine göre üstün ve tercih edilmesi gerektiğini belirtmişlerdir. Bu risaleler incelendiğinde tartışmalar Hanefiler ve Şafiîler arasında meydana gelmiştir. Aynı zamanda Bâbertî ile aynı dönemde yaşayan Hanefî âlimlerinden İbn Ebi'l-İzz'in, İttibâ' adlı eseriyle onun eserine reddiye kaleme alması, yaşanan tartışmaların Hanefîlerin kendi aralarında da yapıldığını göstermektedir."
