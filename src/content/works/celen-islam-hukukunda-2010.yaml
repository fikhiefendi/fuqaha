abstract: "İslâm hukuk kaynaklarında yer almayan eşyâ hukuku kavramının, son dönem İslâm hukukçularınca modern hukuktaki sistematiğe uygun olarak uyarlandığını görmekteyiz. Buna göre İslâm hukukundaki eşyâ hukukunun temel kavramları, milk, hukuk ve ibâha kavramlarıdır. Yine modern hukukta yer alan ancak klasik İslâm hukuk kaynaklarında rastlanmayan müşterek mülkiyet kavramı, İslâm hukukunda şirket-i milk kavramıyla ifade edilmektedir.Müşterek mülkiyeti ilgilendiren kavramların şirket, mülkiyet, müşâ' ve mal olduğu görülmektedir. İslâm hukukuna göre şirket, akit ve milk şirketi olmak üzere ikiye ayrılır. Milk şirketi de cebrî ve ihtiyârî olmak üzere iki kısımdır. Meydana geliş yolları nazara alındığında ihtiyârînin modern hukuktaki müşterek mülkiyete, cebrînin de kısmen iştirak halindeki mülkiyete tekabül ettiğini görmekteyiz. İslâm hukukunda, malın da değişik açılardan tasnifi yapılmıştır. Gerek Anayasa'da gerekse Medenî Kanun'da güvence altına alındığı halde tanımı verilmeyen mülkiyet, İslâm hukukunda, ?Bir şeyin hukuken engelleyici, olağan dışı bir durum olmadıkça kişiye tek başına o şey üzerinde yetkili olma ve tasarrufta bulunma imkânı sağlayacak şekilde hıyâzet altına alınması? şeklinde tarif edilmiştir.Tam mülkiyet, eksik mülkiyet, deyn (borç-alacak) ve ayn gibi kısımları vardır. Müşâ' kelimesi de Mecelle'de ?hissei şâyiayı hâvî olan şey, şâyî payları ihtiva eden eşyâ? ifadesiyle tarif edilmiştir.İslâm hukukunda müşterek mülkiyet, alım, satım, hibe, sadaka, vasiyeti kabul, ganîmet, mîras, malların karışması gibi mülk edinme yollarından biriyle meydana gelir. Ortaklar kendi hissesinde istediği gibi tasarruf yetkisine sahipken, ortağın hissesinde yabancı gibidir. Müşterek mülkiyet belli bir malda olduğu gibi alacaklarda da olur.Müşterek mülkiyetin, alım-satım, hibe, vakıf, vasiyet, şâhitlik, borç verme gibi işlemlerle meydana gelen hukukî sonuçları vardır. Bunların bir kısmının câiz olduğunda ittifak varken; diğer bir kısmında ihtilâf vardır. Modern hukukta olduğu gibi, müşterek mülkiyete konu olan malın taksimiyle, istimlâkiyle, cebrî satışla, malın yok olması ve elden çıkarılması gibi yöntemlerle müşterek mülkiyet sona erer."
