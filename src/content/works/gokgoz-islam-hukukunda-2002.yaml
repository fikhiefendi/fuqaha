abstract: "ÖZET“İslâm Hukukunda Vasiyet”adıyla yaptığımız bu tez çalışmamızda bu konudaki hukukî kural ve ilkeleri bir araya getirmeyi gaye edindik. Ölüme bağlı bir tasarruf çeşidi olan vasiyet, klâsik fıkıh kitaplarında Kitâbu'l Vesâyâ başlığı altında müstakil olarak işlenmekte olup günümüz İslâm ülkelerinin medeni hukuklarında ise Ahvâli Şahsiyye bölümlerinde yer almaktadır. Vasiyet, mîras hukukunun önemli bir parçasını teşkil eder. Zira mirasın taksiminden önce vasiyet ifa edilir. Vasiyet, bir mal veya menfaati ölüme bağlı olarak bir şahsa veya bir hayır cihetine meccânen temlik etmeyi, mülk olarak vermeyi ifade eder. İslam Hukukunda, vasiyetin ibâdet boyutu olduğu kadar sağladığı faydalar açısından kişisel ve toplumsal boyutu da vardır. Zira kişi vasiyet yoluyla hem ibâdetlerindeki eksiklikleri tamamlayıp manevî yönden huzur bulmakta hem insanlara karşı vefa borcunu ödemekte hem de toplum yararına faydalı işler yapmaktadır. İşte konumuzun bu önemini dikkate alarak İslâm vasiyet müessesesine âit kuralları ele alırken mukayeseye imkân vermesi açısından yer yer Türk medeni kanunu ile de karşılaştırmalar yaptık. Çalışmayı bir giriş ile üç bölüm halinde tasnif ettik : a) Giriş: Çalışma hakkında genel bilgi ve mukayeseli hukukta vasiyet müessesesi, b) I. Bölüm: Vasiyet akdi. c) II.Bölüm: Vasiyette aranan şartlar, d) III.Bölüm: Vasiyetin hukukî sonuçlan hakkında bilgi verdik."
