abstract: "Haksız fiil, kişinin bir hukuk kaidesini ihlal ederek bir başkasına maddîmanevî,cismani ve mali zarar vermesidir. İslam hukukunda haksız fiiller, gayri meşrû fiiller olarak tanımlanmış, genel bir tasnif içinde şahsa ve mala yönelik olmak üzere iki bölümde incelenmiştir. Şahıslara yönelik haksız fiiller klasik fıkıh kitaplarının cinayetler; mala ve eşyaya yönelik haksız fiiller ise gasp ve itlâf ile ilgili bölümlerinde ele alınmıştır. Tezimizin birinci bölümünde sorumluluk kavramı ve sorumluluğun borçlar hukukundaki önemi ve amacı; ikinci bölümünde hem çağdaş hem de İslam borçlar hukukunda haksız fiil kavramı ve haksız fiilin unsurları ile sorumluluğu ortadan kaldıran durumlar, üçüncü bölümünde ise haksız fiillerden doğan cismani, mali ve manevî zararların tazmini ile ilgili konular incelenmeye gayret edilmiştir. Tezimizde, haksız fiil kavramının modem hukuk ve İslam hukukundaki yeri ve haksız fiilin unsurları incelenmeye gayret edilmiştir."
titleTranslation: {"en": "Torts and responsibility resulting from unlawful action in Islamic Law"}
