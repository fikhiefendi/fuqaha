abstract: "Bütün mezheplerde olduğu gibi Şâfiî mezhebinde de teşekkül ve gelişme sürecine ilk dönem talebelerin büyük katkısı olmuştur. İmam Şâfiî'nin (ö. 204) mezhebe damgasını vurmuş birçok talebesi olmakla beraber, Irak'ta Za'ferânî, Mısır'da el-Büveytî (ö. 231), el-Müzenî ve er-Rebi' b. Süleyman el-Murâdî gibi isimleri zikretmek mümkündür. Mezhebe katkı noktasında en fazla ön plana çıkan talebelerden biri olan Müzenî, ilmî hayatının ilk evresinde kelâmî konulara eğilmiş, sonraları ise İmam Şâfiî'nin etkisiyle fıkha yönelmiştir. İmam Şâfiî'den sadece dört yıl ilim okumasına rağmen mezhepte çok muteber biri kabul edilmiştir. Şu da var ki kendisi münazara da mahir biri olduğu için İmam Şâfiî'nin kendisine ayrı bir teveccühü söz konusu olmuştur.“Muhtasarü'l-Müzenî”adlı eseriyle meşhur olmuş, bu eser mezhebin ana kaynaklarından kabul edilmiştir. Bu eser üzerine çeşitli şerh ve haşiyeler yazılmış olup, dünyadaki çeşitli meşhur kütüphanelerde bulunmaktadır. Bunun dışında birçok eser kaleme almıştır. el-Muhtasar, İmam Şâfiî'nin el-Ümm isimli eserinin özeti olmakla beraber, eserde kendi fıkhi görüşlerine de ayrıca yer vermiştir. Bundan dolayı mezhep içerisinde her zaman tartışılan biri olmuştur. Günümüzde dahi, bazı Batılı ve Atlantik ötesi ilahiyatçılar, bu konu üzerine çalışmalar yapıp, bazı çıkarımlarda bulunmuşlardır."
