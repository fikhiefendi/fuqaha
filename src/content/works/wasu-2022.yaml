abstract: "Bu çalışma, Kur'an tefsirinde özellikle ceza ayetleri ve fıkhî mezhebe bağlılığının veya muhalefetinin boyutunun incelenmesi; kendisinden önce gelen müfessirlerden bağımsız şahsi içtihatlarının olup olmadığı gibi hususlarda Şeyh el-Merâgî'nin yaklaşımının izini sürmeyi hedeflemektedir. Bu çalışmanın önemi; a) Şeyh Al-Merâgî''nin ilmî şahsiyetinin öneminden. b) yaşadığı asırdaki diğer din ve kültürlerine açık olan yaklaştırma reform projesinin öneminden. c) ilmî hayatının büyük bir kısmında el-Ezher'i yönetmiş olması. d)zamanının siyasî ve ilmî hayatında temel ve önemli bir rol oynamasından kaynaklanmaktadır. Araştırmacı, Şeyh el-Merâgî'nin şahsî ve ilmî kişiliğini incelerken tarihsel yaklaşım metodunu; yaşadığı asrın en belirgin özelliklerini ve ceza ayetlerinin tefsirinde yazdıklarını incelerken betimleyici tümevarım yaklaşımını kullanmıştır. Analitik betimleyici yaklaşımı ise Şeyh'in çalışmalarını analiz etmek ve onun içtihatlarını ortaya çıkarmak için kendisinden önceki müfessirlerle karşılaştırmakta kullanmıştır. Çalışmada müellifin içtihatlarındaki metodu anlaşılmış olup bir dizi neticeye varılmıştır. Bunlardan en önemlisi, el-Merâgî'nin tefsirinin, okuyucunun eğitim seviyesi ne olursa olsun anlayabilmesi için tefsiri basitleştirme zorunluluğuna dayanmasıdır. İkincisi, kendisinin bazen Hanefi mezhebine tabi olmamasıdır. Üçüncü olarak; el-Merâgî'nin, ceza ayetlerindeki hükümlerin iptal edilmeden uygulanmasının ve hafifletilmemesinin doğru olduğuna inanmasıdır. Fakat o hırsızın elinin kesilmesi cezasının miktarını 1,2 gram altın olarak belirleyerek Hanefi mezhebine muhalefet etmiştir. Bu çalışma el-Merâgî'nin kendi içtihatlarında, şeyhi ve hocası olan İmam Muhammed Abduh'un; hükümlerin ayrıntılarına bağlılığından çok -kendi içtihadına göre- özgür bir metodu esas alarak, şeriatın hikmetine odaklanan, günümüzün ruhunu anlama ihtiyacı ve aslına ve amacına bağlı kalarak Kur'an'ın her zaman ve mekana uygunluğuna vurgu yapması düşüncesinden ne ölçüde etkilendiğini göstermektedir."
