abstract: "İslam dinine göre ilim öğrenmek inanan her bireyin üzerinde önemle durması gereken bir husustur. Bu nedenle kişi dininin temel kurallarını öğrenmek suretiyle ilmi açıdan bilincini uyanık tutmalıdır.Kadınlar İslâm tarihinin ilk dönemlerinden itibaren ilim alanında kendilerini göstermişlerdir. Öncelikle hadis, kıraat/ Kur'ân'ın okunması ve ezberlenmesi, tefsir, kelam ve fıkıh ilimleri üzerinde önemle durmuşlardır.Kadınlar, özellikle sahâbe ve tâbiîn dönemlerinde, fıkıh ilminin gerek öğrenilmesi gerekse öğretilmesinde önemli katkılarda bulunmuşlardır. Bu bağlamda araştırmamıza konu olan kadınların, kendi dönemlerinde ilimlerinden faydalanılmak için aranan fıkıhçılardan sayılmaları ve zamanın meşhur âlimlerinin yetişmesinde öncülük etmeleri büyük önem arz etmektedir.Kadınların fakih kimlikleri ile öne çıkartılıp tanıtılması ise araştırmamızın asıl amacını oluşturmuştur."
