abstract: "Narsist kişilik, bireyin kendini aşırı beğenmesi, kendini diğer kişilerden daha üstün ve özel olarak görmesi, başarıya odaklı, her durumda takdir bekleyen bir kişilik durumudur. Son dönemde konu iş dünyasınca dikkat çekmektedir. İşkoliklik ise bireylerin aşırı çalışma eğilimi göstermeleri, hayatlarının merkezine iş yaşamlarını koymaları ve hem aile hem sosyal yaşamlarından uzaklaşması gibi sonuçlar doğuran bir durumdur. Bu durum bireyin kendisi için sağlık ve mutluluk açısından olumsuz sonuçlara sebep olurken aynı zamanda iş hayatında da performans ve verimlilik açısından istenmeyen sonuçlara sebep olabilmektedir. Bu tezin amacı ise narsist kişiliğin işkoliklik üzerindeki etkisinin araştırılmasıdır. Araştırma Konya ili merkez ilçelerinde bulunan kamu, katılım ve kamu katılım bankalarında çalışmakta olan bankacılar üzerinde yürütülmüştür. Bu araştırma sonucunda banka çalışanlarının narsisist kişilik özelliklerinin işkoliklik özellikleri üzerinde anlamlı bir etkisinin olduğu, narsist kişilik alt boyutlarından ise liderlik ve sömürücülük alt boyutlarının işkolikliğin aşırı çalışma ve kompulsif çalışma boyutları üzerine anlamlı etki ettiği görülmüştür."
