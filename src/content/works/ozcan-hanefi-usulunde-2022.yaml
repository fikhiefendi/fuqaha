abstract: "Hanefi mezhebi özellikle haber-i vâhidleri, kabul, anlama ve yorumlama noktasında özel bir yönelime sahiptir. Haber-i vâhidi diğer delillerle tutarlı anlama adına birçok prensip geliştirmişlerdir. Bunların başında hiç şüphesiz asıllara muhâlefet etmeme şartı ve bunu sağlayan arz yöntemi gelir. İşte bu çalışmamızda asılların ilki olan Kur'ân'a arzı Hanefi düşüncesinde Cessâs'ın taşıdığı noktayla ele almaya çalıştık. Çalışmamız giriş ve sonuç dışında üç bölümden oluşmaktadır. Birinci bölümde Kur'ân'a arzın tanımı, kapsamı ve tarihçesiyle konuya başlanmıştır. Bu noktada öncelikle Hz. Peygamber (s.a.v.) ve sahabe dönemlerindeki Kur'ân'a arz teorik ve pratik olarak incelenmiştir. Sonrasında Hanefi usûlünde arz çeşitleri tespit edilip, tezin konusu olan Kur'ân'a arz yöntemi kurucu imamlardan başlayıp mezhep içinde oluşan ekollere gelinceye dek ele alınmıştır. Bu bölümle ayrıca Kur'ân'a arza mesafeli durduğu söylenen Hanefi usûlcülerinin yaklaşımlarına ve günümüz Kur'ân'a arz yorumlarının nasıllığına da temas edilmiştir. Tezimizin ikinci bölümünde Cessâs'ın hayatı, ilmi kişiliği ve Kur'ân'a arz anlayışı çalışılmıştır. Arz anlayışında öne çıkan noktalardan, arz için getirdiği delillerden, prensiplerden ve özellikle itizâlî yönelimi neticesinde arzı itikâdî alana genişleterek görüşlerine dayanak kılmasından bahsedilmişitir. Üçüncü bölümde ise Cessâs'ın arz anlayışındaki özgünlük uygulamalarla gösterilmeye çalışılmıştır. İtikâdî ve fıkhî arz olmak üzere iki kısımda ele aldığımız bu bölümde hem kelâmî hem de fıkhî konulardaki arz örnekleri incelenmiş, özellikle itizâlî tercihleriyle kelâmî örneklerdeki arz anlayışı arasındaki ilişki ortaya konmaya çalışılmıştır. Ayrıca fıkhî arzdaki ilkesel tavrını itikâdî arzda ne derece sağladığı incelenmiştir."
