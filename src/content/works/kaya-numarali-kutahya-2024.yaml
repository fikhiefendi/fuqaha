abstract: "Bu çalışma 19. yüzyılın ortasında Kütahya şehrini sosyal, kültürel ve ekonomik açıdan incelemeyi amaçlamaktadır. Bu değerleri ortaya çıkarmak amacıyla H 1279-1281 M 1863-1865 tarihli 38 numaralı Kütahya Şer'iyye sicili seçilmiştir.Şehrin yönetiminde 19. yüzyıl idari siteminin taşradaki yansımaları görülmektedir.İncelenen sicilden hareketle, Şehirdeki ticari faaliyetlerin, kale ve çevresinde yoğunlaştığı anlaşılmaktadır. Kütahya'da gayrimüslim ve müslümanların bir arada yaşadığı, çok eşliliğin olmadığı, boşanmış kadınların ve yetim kalmış çocukların korunduğu görülmektedir.Çalışma, yetim çocukların haklarının korunmasına dair pratikleri Kütahya örneğinde gösterir."
