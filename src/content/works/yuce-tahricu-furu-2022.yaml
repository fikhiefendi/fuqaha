abstract: "İlimler tarihinde herhangi bir ilim teşekkül edip temel metinleri ortaya konulduktan sonra o ilmin öğrenimini veya öğretimini kolaylaştıracak alt disiplinler ortaya çıkmaya başlar. Tahrîcü'l-fürû ale'l-usûl literatürü de böyle bir ihtiyaca binaen fıkıh ilminin alt disiplini olarak ortaya çıkmıştır. Şâfiî mezhebine müntesip âlimlerin ilk temsilciliğini üstlendiği tahrîcü'l-furu ale'l-usûl literatürü Zencânî'nin eseriyle sistematik bir yapı kazanmıştır. Literatür içerisinde telif açısından üçüncü eser olarak nitelendirebileceğimiz İsnevî'nin et-Temhîd fî tahrîci'l-fürû ale'l-usûl adlı eseri de bunlardan bir tanesidir. Bu eser usul kaideleri sistematiğine göre oluşturulması, kaideleri ve meseleleri işleyiş tarzı, konuların anlaşılır olması ve sadece Şâfiî mezhebi içerisindeki ihtilafları konu alması bakımından öne çıkmaktadır. Bu çalışmamızda İsnevî'nin et-Temhîd adlı eseri tahrîcü'l-fürû ale'l-usûl literatürü içerisindeki yeri ve öne çıkan özellikleri açısından incelenmiştir."
