abstract: "Bu el-Mamuni risalesinin konusu, abdest ve teyemmüm üzerinedir. Bu bölüm, Kur'an-ı Kerim'in ahkam ayetlerinden olan Maide suresinden sekiz ayeti ele almaktadır. Suyun yokluğunda abdest ve teyemmümün keyfiyetini açıklamaktadır. Müellif, bu ayetlerin içinde barındırdığı anlamın, ayetle ilgili bütün detayların üzerinde durarak şerh ve açıklamasını yapmıştır. Sebebi nüzulünden ve nüzul zamanından başlayıp,“Ercüleküm”ün kıraatinde nasb mı yoksa hafz mı yapılacağı yönündeki ihtilaf gibi fukaha ve kurranın arasında bulunan ihtilafların olduğu lügavi ya da fıkhi meseleleri içinde barındıran bütün lafızların anlamları üzerinde durmuştur. Tabi bunun anlamı değiştirmede bir etkisi yoktur.“La Mestüm”lafzı da bu mesele kapsamında örnek olarak verilebilir. Ayeti kerimede abdest uzuvlarının sınırlandırılmasının hikmeti üzerine tartışmayla bölüm bitirilmiştir. Müellif bütün bu açıklamalarında ulemanın sözlerini ve delillerini nakleder ve bunları tartışır. Bu delillerin Kur'an-ı Kerim metinleri, Hz. Peygamber'in hadisleri veya akli ve mantıki hüccet arasında çeşitliliğe işaret ettiği sonucuna ulaşır."
