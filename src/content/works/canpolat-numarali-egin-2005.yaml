abstract: "ÖZET Yüksek Lisans Tezi 4 Numaralı Eğin Şer'iyye Sicili Sibel CANPOLAT Fırat Üniversitesi Sosyal Bilimler Enstitüsü Tarih Bölümü 2005, Sayfa:348 Ait oldukları dönem ve yer hakkında oldukça önemli bilgiler veren Şer'iyye Sicilleri Osmanlı Tarihinin en önemli arşiv kaynaklarından biridir. Şer'iyye Sicilleri ihtiva ettikleri idari, siyasi, askeri ve sosyal nitelikli belgelerden dolayı Osmanlı tarihine ışık tutan kaynaklardır. Hazırlamış olduğumuz 4 Numaralı Eğin Şer'iyye Sicili H. 1248-1256 (M. 1832- 1840) yılları arasındaki belgeleri kapsamaktadır.Bu dönemde Eğin Harput Eyaleti'ne tabi bir kazadır. Bu çalışmamızda 4 Numaralı Eğin Şer'iyye Sicilini transkrip kurallarına uygun olarak Latin harflerine çevirdik. Bu belgeleri konularına göre tasnif edip özetlerini verdikten sonra, transkripsiyonu sunduk."
