abstract: "İslâm borçlar hukukunda kiralama önemli bir yere sahiptir. Kiralamanın İslâm borçlar hukukundaki karşılığı icâre akdidir. Geçmişten bu yana sıklıkla faydalanılan kiralama yöntemi insanların ellerinde olmayan ancak ihtiyaç duydukları menfaatleri temin etmek amacıyla kullanılmıştır. İslâm hukukunda söz konusu kiralama işleminin kapsamı dar bir çerçeveyle sınırlandırılmayıp İslâm'ın mubah/helal gördüğü alanlarda bu tür sözleşmelere imkân sağlanmıştır. Son dönemlerde ulaşım, taşımacılık gibi birçok mubah amaca hizmet etmesi sebebiyle sıklıkla kullanılan araç kiralama yöntemi hayatı daha pratik ve konforlu bir hale getirmeye yardımcı olmaktadır. Klasik dönem İslâm hukuku kaynaklarında dönemin mevcut şartlarında araçların henüz keşfedilmemiş olması sebebiyle işlenmemiştir. Araç kiralama mevzuu teknolojik gelişmeler neticesinde araçların ortaya çıkmasıyla daha ziyade güncel bir araştırma konusu haline gelmiştir. Geçmişte araç kiralama hizmetine benzer amaçla hayvanlar kiralanırdı. Günümüzde bu benzerlikten yola çıkarak araç kiralama sözleşmelerinin İslâm hukuku açısından değerlendirmesi yapılırken hayvanların kiralanması bahsinde İslâm hukukunun belirlediği kaideler de esas alınmak suretiyle araç kiralama sözleşmeleri de analiz edilecektir. Konunun daha iyi anlaşılabilmesi ve daha doğru sonuçlar elde edebilmemiz için çalışmamızda üç ana başlık işlenecektir. Bunlar: İcâre, icâre-i hayvan ve son olarak araç kiralama konusudur. İlk iki başlığı açıklarken Kitâb, sünnet, icmâ ve kıyastan delillerle açıklama yapılacaktır. Son başlık olan araç kiralama konusunda bunlara ek olarak maslahat ve günümüz örfü göz önüne alınacaktır. Sonuç olarak çalışmamızda, temelde bir kiralama anlaşmasının nasıl olduğundan yola çıkarak günümüzde kullanılan araç kiralama sözleşmelerinin ne şekilde kurulacağı ve İslâm hukukuna uygunluğu araştırılarak değerlendirilecektir."
