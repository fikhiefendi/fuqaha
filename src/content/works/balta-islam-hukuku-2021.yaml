abstract: "Mescit, kavram olarak İslam dininin mabetlerini ifade etmektedir. Cami ve mescitler tarih boyunca değişim ve gelişim göstermişlerdir. Hz. Peygamber devrinden itibaren ibadet mekânı olma vasfının dışında birçok amaç için kullanılmışlardır. Cami ve mescit yapımı teşvik edilmiş ve özel hükümler uygulanmıştır. İslam hukuku açısından bir yere mescit hükümlerinin hangi şartlarda uygulandığı araştırılmış mer'i hukukla mukayesesi yapılmıştır. Aynı zamanda cami ve mescitlerin idaresi, mali durumu ve görevlileri gibi konular da incelenmiştir. Bu çalışmamızda cami ve mescitlerin kavramsal çerçevesi ayrı ayrı incelenirken, ilk bölümden itibaren aynı anlamda kullanılmıştır. İslam hukuku açısından cami ve mescitlerin durumu incelenirken İslam hukuk sistemi mezheplerinden Hanefi mezhebi temel alınmış, ilgili durumlarda diğer mezheplerin görüşlerine de yer verilmiştir. Mer'i hukuk açısından mescitler yürürlükte olan kanun, tüzük ve yönetmeliklerle incelenmiştir."
