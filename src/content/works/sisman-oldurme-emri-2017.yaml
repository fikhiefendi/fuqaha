abstract: "İslâm Hukukunda kişilere uygulanan cezaların kaynağı elbette ki Kur'an ve sünnettir. Bu çalışmada Kur'an'da yer alan kısas cezası ile hadislerde yer alan“öldürme”emirlerine yer verilmiştir. İki bölümden oluşan çalışmanın birinci bölümünde Yahudilik, Hıristiyanlık ve İslâm'da öldürme cezaları ele alınmıştır. Çalışmanın ikinci bölümünde ise tezin konusunu oluşturan“öldürme”emri ile ilgili rivayetlerin sened ve metin tahlili yapılarak, rivayetlerin sıhhat durumu ve konu ile ilgili değerlendirmelere yer verilmiştir. Araştırmanın sonucunda konu ile ilgili hadisler arasında sahih, zayıf, mevzu rivayetler ile mensuh rivayetlerin olduğu da tespit edilmiştir."
