abstract: "Elinizdeki çalışma,“İlham Verici Liderlik ve Meslekî Tükenmişliğe Etkisi: Türkiye'deki Katılım Bankaları Üzerine Uygulamalı Bir Çalışma”konusunu ele almaktadır. Tezde ilk etapta“ilham verici liderlik”kavramı açıklanarak, liderliğin geçmişten günümüze tarihsel gelişimi üzerinde durulmuş ve ilham verici liderliğin özellikle iktisadi kurumlara etkisinden bahsedilmiştir. Ardından“meslekî tükenmişlik”kavramı; çıkış noktası, özellikleri ve içerdiği teorilerle birlikte ele alınmış, mesleki tükenmişliğin sebepleri, aşamaları ve etkileri açıklanmıştır. Sonra sırasıyla mesleki tükenmişliğin önüne geçmede ilham verici liderliğin rolü üzerinde durulmuş, bu noktada katılım bankaları uygulama örneği olarak ortaya konarak, bu bankaların tarihsel serüveni hedefleriyle birlikte açıklanmıştır. Çalışmada analitik tümevarım yöntemi kullanılmıştır. Sonuç kısmında; cinsiyet faktörünün, çalışanların nüfuz alanı ve başarı oranında etkili olmadığı ve bankalardaki idari liderliğin çalışanların başarı oranını önemli ölçüde etkilediği çıkarımları başta olmak üzere birçok neticeye varılmıştır. Ardından ilham verici liderliğin katılım bankaları tarafından dikkate alınması, bu bankalardaki çalışanlarla ilgilenilmesi ve onlara maddi ve manevi teşvikler sağlanması gibi pratik önerilerde bulunulmuştur."
