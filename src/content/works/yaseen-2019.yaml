abstract: "Bu araştırmamızdaki amaç; geçmişten günümüze Kürt alimlerinin İslam hukuku alanında yapmış oldukları çalışmalar hakkında bilgi vererek, bizlere bırakılan zengin kültür mirasından istifade etmektir. Bu nedenden dolayı araştırmamızı iki bölüm altında inceleye çalıştık. Çalışmamızın ilk bölümünde Molla Yahya'nın ailesi, doğdoğu ve ilim tahsil ettiği yerler, icazetiyle ilgili bilgiler, meşhur olan öğrencileri ve eserleri hakkında bilgi vermektir. Tahkik ettiğimiz haşiyede kaleme almış olduğu eserinden bir tanesidir. Irakın içinde ve dışında döneminin büyük alimleri arasında gösterilen bu alimden, başta Kürt kabileleri olmak üzere Osmanlı devletide fetvalarından istifade etmiştir. Çalışmamızın ikinci bölümünde Molla Yahya el-Munzuri'nin Tahfetül Muhtac haşiyesinin taharet babından (konusundan) hadesin (abdestsizlik) sebeplerine kadar olan bölümün tahkik çalışmasını yaptık. Haşiyede geçen Kuran ayetleri ve hadisleri tespit ederek kaynaklarını belirlemeye çalıştık. Bununla birlikte haşiyede geçen kavramların anlamını ve kaynalarını belirlemeye çalıştığımızı da ifade etmek isteriz. Haşiyede geçen bazı işaaretlerin ne anlama geldiğini ifade etmeye çalışırken eksik gördüğümüz yerleri dipnotta açıklamaya çalıştık. Ayet ve hadislerle birlikte kitabın metninide parantez içinde verdik."
