abstract: "Terörizm ve organize suçların günümüz demokratik toplumlarına yapmış olduğu tehdidin büyüklüğü hiç küçümsenemeyecek boyutlardadır. Özellikle demokrasinin gelişmekte olduğu toplumlar bakımından en büyük tehdit kaynağını, bu iki grupta toplanan suç örgütleri oluşturmaktadır. Zira bu şekildeki örgütlü suçların en belirgin özelliği, demokrasinin işlemesini aksatma amacını gütmesidir. Son dönemlerde de İslam'la ilgili yapılan tartışmaların ağırlık noktasını, din adına yapılan şiddet hareketleri oluşturmaktadır. Bunun sonucu olarak meydana gelen şiddet eylemleri, yanlış yorumlarla veya kasıtlı olarak İslam'a dayandırılmaya çalışılmaktadır. Biz araştırmamızda İslam hukukunun terör ve terörle ilgili kavramları nasıl değerlendirdiğini, İslam'la Terörizmin ilişkisizliğini ifade etmeye çalıştık."
