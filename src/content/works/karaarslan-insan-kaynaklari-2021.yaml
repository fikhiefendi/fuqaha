abstract: "Bu çalışma, insan kaynakların uygulamalarının çalışan performansına etkisinde psikolojik iyi oluşun aracı rolünü ölçmeyi amaçlamaktadır. Bu kapsamda Türkiyede faaliyet gösteren 6 farklı katılım bankasında görev yapan personel ile anket uygulaması gerçekleştirilmiştir. Elde edilen verilerle güvenirlik analizi, açımlayıcı/keşfedici faktör analizi, betimleyici analizler, normal dağılım testleri, korelasyon analizi, regresyon analizi, t-testi ve anova analizleri, doğrulayıcı faktör analizi ve yapısal eşitlik modellemesi gerçekleştirilmiştir. Yapılan analizler sonucunda insan kaynakları uygulamalarını temsil eden en önemli boyut ödüllendirme, psikolojik iyi oluşu temsil eden en önemli boyutun ise olumlu ilişkiler olduğu görülmüştür. Katılımcıların insan kaynakları uygulamalarına yönelik algısı, psikolojik iyi oluş durumları ve çalışma performanslarının çalıştıkları departmana, unvanlarına, kurumda çalışma sürelerine, kurumun faaliyet sınırı ve faaliyet alanına, cinsiyetlerine ve medeni durumlarına göre farklılaşmaktadır. İnsan kaynakları uygulamaları; psikolojik iyi oluş ve çalışan performansının önemli bir yordayıcısı konumundadır. Psikolojik iyi oluş ise çalışan performansını yordamaktadır. Çalışmada elde edilen faktörler bir model dahilinde ele alındığında, psikolojik iyi oluş hali, insan kaynakları uygulamalarının çalışan performansı üzerindeki etkisine aracılık etmektedir. Çalışanlar iş yerinde iletişime önem vermektedir. Bununla birlikte çalışmakta oldukları kurumların kendileriyle iletişimine yönelik tutumları kararsızlık seviyesindedir. İnsan kaynakları uygulamalarının ortaklaşa kazanç üzerine inşa edilmesi, çalışanlara yönelik plan ve politikaların salt onların performansını yükseltmeye odaklanmaması ve yürütülen politikalarda çalışanların psikolojik konforlarının da göz önünde tutulması gerekmektedir."
