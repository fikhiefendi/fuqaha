abstract: "Bu çalışmada el-İhtiyâr adlı eserde Şâfiî ve Mâlikîler'e atfedilen görüşleri inceledik. Bu görüşlerin naklî ve aklî delillerini zikretmek suretiyle mukayeseli bir bakış açısı sunmaya çalıştık.El-İhtiyâr'da var olan bu atıfların Ebû Hanîfe'nin görüşleri esas alınmak suretiyle yapıldığını tespit etmiş olduk. Zira bazı atıflarda Ebû Hanîfe dışındaki Hanefî ulemasına ait görüşlerin diğer mezhep âlimlerinin görüşleriyle örtüştüğünü gördük. Söz konusu atıflardan beş tanesinde isabet olmadığını, dört tanesinde de mezhebin zayıf görüşüne atıfta bulunulduğunu tespit ettik. Günümüze kadar çözüme kavuşmuş, kıyamete kadar da çözüme kavuşacak olan milyonlarca meselenin çözümünde mezheplerin birer rahmet vesilesi olduğunu bir kez daha görmüş olduk. Yine mezheplerin İslamın evrenselliğine hizmet eden boyutunu müşahede etmiş olduk."
