abstract: "Bu tezde 4/10. asrın sonu 5/11. asrın başında yaşayan Zeydî muhaddis ve fakih Müeyyed-Billâh Ahmed b. Hüseyin'in (ö. 411/1021) Şerhü't-Tecrîd isimli eseri ele alınmıştır. Bu eser bağlamında ahkâm hadislerini inceleme yöntemi üzerinde durulmuştur. Bu çalışmanın asıl odak noktası Zeydî fakihlerin ahkâm hadislerini ne tür bir incelemeye tabi tutup bu hadislerin anlaşılma problemlerine nasıl bir çözüm ürettiklerini ortaya koymaktır. Bu doğrultuda Müeyyed-Billâh Ahmed b. Hüseyin'in Şerhü't-Tecrîd eseri incelenerek nasıl bir çözüm ürettiği değerlendirilmiştir. Ayrıca bu çalışmada müellif-eser bütünlüğünü koruyan bir yöntem izlenmiştir. Bu çerçevede ahkâm hadislerinin anlaşılmasına katkı sağlayacağını düşündüğümüz analiz yöntemine başvurulmuştur. Şerhü't-Tecrîd'de yer alan hadis incelemeleri neticesinde ortaya konan örneklerden yola çıkarak tümevarım metodu ile sonuçlara ulaşılmıştır. Şerhü't-Tecrîd eserinin ahkâm hadislerini tahlil ederken sened ve metin birlikteliğini gözettildiği görülmüştür. Bu doğrultuda kendi döneminde Ehl-i sünnet rivâyetlerini Zeydî kaynaklarıyla kaynaştıran kişi olarak bilinen Müeyyed-Billâh'ın hem rivâyet hem de dirâyet bütünlüğüyle tahlil ve analizler yaptığı tespit edilmiştir. Bu minvalde onun bütüncül bir bakış açısıyla rivâyetlere yaklaştığı müşahade edilmiş. Netice itibariyle Müeyyed-Billâh'ın rivâyetlere hem râvî hem muhaddis hem de fakih perspektifinden yaklaştığı sonucuna ulaşılmıştır."
