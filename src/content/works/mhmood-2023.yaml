abstract: "Bu çalışma, Buhari'nin Sahih'inde naklettiği İmam Muhammed bin Sîrîn'in fıkhî görüşlerini toplamış ve incelemiştir. Sahih-i Buhari, Kur'an'dan sonra en doğru kitaplardan biri olarak kabul edilir. Bu yüzden Peygamber'in hadis-i şeriflerinin tahrîc edilmesi ve hadis fıkhını öğrenmek için bu kitaba başvurulur. Biz de İbn Sîrîn'in fıkhî görüşlerini takip edip dört fıkıh mezhebine katılıp katılmadığını inceledik. Çünkü o, ilk devrin en önde gelen fakihlerinden biriydi ve o olmasaydı icma da sağlanamazdı. Bu, İbn Sîrîn'in fıkıh statüsünü vurgulama ve Buhari'nin Sahih'inde onun fıkhî görüşlerine dayanması, onun döneminin fakihleri ve müctehidleri arasındaki statüsünü yansıtma hedefine ulaşmak içindir. Zira, İbn Sîrîn bu statüye sahip olmasaydı Sahih-i Buhari'de ismi zikredilmezdi. İbn Sîrîn'in Sahih-i Buhari'deki fıkhî görüşlerinin yanı sıra fıkhın dört mezhebinin izini sürmek için tümevarım yötemini kullandık. Daha sonra fıkhî görüşleri ve onların delillerini karşılaştırmak için mukayeseli yaklaşım yöntemini kullandık. Çalışma birkaç önemli sonuca ulaştı: İbn Sîrîn çağdaşları arasında güçlü bir fıkıh konumuna sahipti. Hicretin birinci ve ikinci asırlarının en iyi fakihlerinden biriydi ve sadece bir rüya tabircisi değildi. Bu, Buhari'nin İbn Sîrîn'i Sahih'inde zikretmesi ve İbn Sîrîn'in dil ve tefsir gibi diğer ilimlerle meşgul olmasından anlaşılmaktadır. Buhari'nin Sahih'inde naklettiği İbn Sîrîn'in fıkhî görüşleri, fakihler arasında ihtilaflı meselelere konu olmuştur. Çünkü İbn Sîrîn, Sahabilerle aynı asırda yaşamış ve onun görüşlerine itimad edilir. Benzer şekilde İmam İbn Sîrîn, âhâd haberleri ve mürsel hadisleri kabul eder ve onlarla amel etmektedir."
