abstract: "Molla Ali el-Kârî (ö. 1014), başta fıkıh ve hadis olmak üzere kıraat, tefsir, kelam, tasavvuf, tarih dil ve edebiyat alanlarında devrin önde gelen âlimleri arasında yer almaktadır. İlk eğitimini memleketi Herat'ta aldıktan sonra Mekke'ye gitmiş ve oraya yerleşmiştir. Kıraat ilmine vukufiyetinden ötürü kendisine“el-Kârî”nispesi verilmiştir. İslami ilimler alanında bir çok eser telif ettiği rivayet edilmiştir. Bu eserlerin çoğu günümüze kadar gelmiştir. Tahkik ve tahlilini yaptığımız“Teşyiü'l-fukahâ li teşni'i' s-süfehâ”adlı risâlesinde Ali el-Kârî, Şâfiî fıkıh âlimlerinden İmam el-Cüveynî'ye atfedilen bazı görüşlerin aslında ona ait olmayıp rafizî ve harici bir takım kimseler tarafından ileri sürüldüğünü ifade etmektedir. Müellif, risâle boyunca Hanefi fukaha ve görüşlerine karşı ileri sürülen ve Cüveynî'ye atfedilen bu iddialara cevap vermekte ve onları çürütmeye çalışmaktadır."
