abstract: "Çalısmamızda ibn Rüsd'ün hilaf kitabı niteliginde olan Bidâyetü'l-Müctehid adlı eserinde imam Sâfiî'ye dair naklettigi görüsleri tahkik etmeye çalıstık. Tezimizde de bahsettigimiz üzere bir mezhebe mensub bir alimin baska bir mezhebin görüsünü naklederken bazı hatalara düstügü görülür. Bunların sebepleri arasında mezhebî taassub,objektif olamama, diger mezhebin ana kaynaklarına ulasamama ,ıstılah farklılıgından dogan yanlıs anlasılmalar,herhangi bir kaynaga dayandırılmadan zihindeki kanaatle yetinme gibi durumlar sayılabilir. ibn Rüsd'dün de eserinde imam Sâfiî'nin görüslerini verirken bazı hatalara düstügü görülür. Bu hatalar mezhebî taassub ve objektif olamamaktan kaynaklanmamakta olup genelde ibn Rüsd'ün kanaatiyle hareket ettigi ?tahminimce? dedigi meselelerde görülmektedir. Bidâyetü'l- Müctehid'de imam Sâfiî'ye dair 1068 görüs incelenmis olup, 22 hatalı görüs tespit edilmistir. Bunlar 1. bölümde Abdest, Necasetten Temizlenme, Namaz, Cenaze , i'tikaf, Hac, Cihad konularında; 2. bölümde Nikah ve Talak konularında,3. bölümde Büyu', Kırâd, Süf'a, Lukata, Feraiz konularında; 4. bölümde Diyât, Sirkat, Akdiye konularındadır."
