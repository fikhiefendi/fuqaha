abstract: "İslam iktisadı, son yarım yüzyılda modern iktisadi paradigmanın ürettiği kriz ve eşitsizliklere karşı, normatif ve ahlaki bir alternatif olarak küresel ölçekte tartışılmaktadır. Söz konusu tartışmaların açık ya da örtük ideallerinden biri bu tartışmalar içerisinde şekillenen bir ahlak ve zihniyetin toplumsallaşması olsa gerektir. Teorik düzeyde üretilmeye çalışıldığı kadar çeşitli pratik uzanımlarının da gündemde olduğu bir dönemde, bu idealin gerçekleşme yollarından biri de yaygın din eğitimi araçlarından biri olan hutbedir. Bu araştırma, Diyanet İşleri Başkanlığı (DİB) tarafından 2015-2024 yılları arasında Türkiye genelinde irad edilen hutbelere yansıyan iktisadi içeriği, seküler iktisat ve İslam iktisadının temel ilkeleri ekseninde analiz etmeyi amaçlamaktadır. Araştırma kapsamında, Diyanet'in resmî arşivinden“amaçlı örneklem”yöntemiyle seçilen, ilgili yıllarda bayram günlerinde ve her hafta Cuma günü irad edilen, 534 hutbe, nitel araştırma yöntemlerinden betimsel içerik analizi tekniği ile incelenmiştir. Elde edilen veriler;“Sosyal Dayanışma ve Yardımlaşma”,“Emek ve Kazanç”,“Finansal İşlemler”ve“Tüketim ve Tasarruf”olmak üzere dört ana tema altında tasnif edilerek analiz edilmiştir. Veriler, hutbe söyleminde zekât, sadaka ve infak gibi sosyal dayanışma eksenli kavramların belirgin bir ağırlığa sahip olduğunu; buna karşılık faizsiz finans ve kurumsal İslam iktisadı mekanizmalarına dair söylemin sınırlı kaldığını göstermektedir. Tüketim ahlakının“israf kanaat–şükür”üçgeninde teolojik bir zemine oturtulduğu; emek ve helal kazanç vurgusunun ise modern“homo economicus”anlayışına karşı ahlaki bir“homo islamicus”inşa etme amacı taşıdığı tespit edilmiştir. Sonuç olarak hutbelerin, mevcut ekonomik sorunlara karşı sistemik bir analizden ziyade, bireysel dindarlık ve hayırseverlik üzerinden bir“kardeşlik ekonomisi”kurguladığı; ancak katılım finansı gibi güncel pratiklerin toplumsal meşruiyetini sağlama potansiyelini henüz yeterince değerlendiremediği görülmüştür."
