abstract: "Katılım bankaları, kanunla kurulan, farklı bankacılık ürünleri ile bireylerin yatırımlarını kar ve zarar esasına göre yöneten finans kuruluşlarıdır. Bankalar kanuna tabi olarak faizsiz bankacılık yapmak üzere kurulan katılım bankalarının kâr payı esasına göre çalışmaları, bankacılık sektöründe farklı ürünlere odaklanmalarını sağlamıştır. Bu nedenle, diğer bankaların benimsedikleri pazarlama stratejilerinin yanında kendilerine ait özel pazarlama anlayışları bulunmaktadır. Bu yüksek lisans tezinde; katılım bankacılığında kullanılan pazarlama stratejileri ve özellikleri incelenmiştir. Çalışmanın birinci bölümünde katılım bankacılığı ve özellikleri incelenmiş, ikinci bölümde bankacılık sektöründe pazarlama ve bankacılıkta pazarlamanın önemi, pazarlamaya konu olan ürünler ve pazarlama süreci ele alınmış ve katılım bankacılığında pazarlama stratejileri ile pazarlama yaklaşımları araştırılmıştır. Üçüncü bölümde ise örnek olay incelemesi ile ele alınan bir katılım bankasının pazarlama stratejisine uygun olarak müşteri bulma, müşterinin finansal tablolarının değerlendirilmesi ve analiz edilmesi ile pazarlamaya yönelik karar alma süreçlerinden sonra finansal ürün teklifi incelenmiştir. Katılım bankacılığında toplanan fonların kâr payına dayalı olarak taraflarca belirlenen vadede ekonomik faaliyetlere katılması pazarlamanın temelini oluşturmaktadır. Tasarruf sahiplerinden sağlanan fonların nasıl değerlendirileceği, vade sonunda kar veya zararın oluşmasına neden olmaktadır. Bu nedenle, katılım bankacılığında pazarlama kâr payının oluşmasına ve destek verilen ekonomik uygulamaların performansına bağlıdır. Katılım bankalarının müşterileri ile kurdukları iletişimsel pazarlama yaklaşımı ile diğer bankalardan farklılık göstermektedir. Katılım bankaları mevcut bankacılık işlemlerinin hepsini yerine getirirken müşterileri ile kurdukları iletişimle belirli riskleri üstlenmektedir. Katılım bankacılığı belirli bir müşteri grubu için faaliyet gösterdiği için pazar analizi yapılması ile başlayan süreç, şirket analizi ile devam etmekte ve müşteriye özel finansal ürünlerin sunulması ile pazarlama süreci tamamlanmaktadır."
