abstract: "Tahkik çalışmasını yapmış olduğumuz Mesâilü tercihi'l-beyyinat adlı eser adından da anlaşılacağı üzere yargılama hukukundan bahseder. Aralarında anlaşmazlık çıkan kişiler, hakkını aramak için mahkemeye başvururlar. Hakimler tarafların iddialarını ve sunduğu delilleri inceler. İddiasını delille ispatlayanın lehine hüküm verir. Taraflar bazen delil sunamazlar, bu durumda hâkim iki tarafın iddiasını inceleyip, birinin sözünü diğerine tercih eder. Bazen iki taraf da delil sunar, bu durumda hâkim, tarafların ortaya koyduğu delillerin sıhhatini ve kuvvet derecesini inceleyip iki delilden birini diğerine tercih eder. Hâkim, iki delil arasında bir tercih sebebi bulamaz ise dava konusu olan şey hakkında iki taraf arasında ortaklaşa hüküm verir. Bazen de iki delilin birbirini nakzetmesi halinde hâkim, iki tarafın da deliliyle hükmetmez. Klasik fıkıh kitaplarında bu meselelerin cevapları ayrıntılı bir şekilde ele alınmıştır. Ancak pek çok dava ile muhatap olan kadıların her bir meseleyi bu kitapların ilgili yerlerinden bulup incelemesi zordur. Başta Ahîzâde Abdülhalim Efendi'nin Mesâilü tercihi'l-beyyinât adlı eseri olmak üzere bu alanda yazılan eserler yargılama hukuku ile ilgili meseleleri bir araya toplaması hasebiyle kadıların işini kolaylaştırmaktadır. Özellikle Mesâilü tercihi'l-beyyinât adlı eser klasik kaynakları da referans göstererek yargılama hukuku ile ilgili füru' meselelerini içermektedir."
