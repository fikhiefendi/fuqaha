abstract: "1980'lerden bu yana, Türk bankacılık sektörü, Orta Doğu ve Kuzey Afrika bölgesinden sermaye girişlerinde önemli bir oyuncu olmuştur. İslami bankalar, geleneksel bankalarla birlikte faaliyet göstermektedir. Türkiye'de İslami finans sistemi 1984 yılında başlamıştır. İslami finansın ilk ticari markası Özel Finans Kurumları olmuştur ve bunun için 2005 yılında yeni bankacılık lasları ile Katılım bankalarına dönüşmüştür. 2001'den sonra, Türk bankacılık sektörü köklü bir yeniden yapılanma sürecinden geçmiştir ve hükümet, sonunda sektörün birçok yabancı yatırımcıya açılmasını sağlayan iyileşmiş programları benimsemiştir. Bu çalışmanın amacı, Türkiye'deki İslami bankaların ve konvansiyonel bankaların finansal performanslarını karşılaştırmak ve aynı zamanda 2008 küresel finansal krizinde farklı davranıp davranmadıklarını incelemektir. Çalışma, İslami bankacılık literatürüne katkı sağlamayı amaçlamaktadır. Tezin kullandığı metodoloji, CAMELS yaklaşımı içindeki değişkenleri kullanarak bankaların karlılığını ve likiditesini test etmeyi ve araştırma hipotezlerini test etmek için panel verilerini kullanmayı içerir. Sonuçlar, iki tür bankanın performansı açısından bir fark olmadığını göstermektedir. Bununla birlikte, riske göre ayarlanmış getiriler, İslami bankalar için olumsuz bir performans ölçüsü olduğunu göstermektedir. Regresyon sonuçlarına göre çalışmada, kriz sırasında ortaya çıkan İslami ve konvansiyonel bankaların farklı davranmadığı ve aralarında önemsiz bir fark olduğu bildirildi."
