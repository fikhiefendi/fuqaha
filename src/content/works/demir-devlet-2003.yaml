abstract: "ÖZET DOKTORA TEZİ DEVLET KUDRETİNİN SINIRLANDIRILMASI PROBLEMİ AÇISINDAN RAŞİT HALİFELER DÖNEMİ Halis DEMİR Danışma: Prof. Dr. Hazma AKTAN 2003-Sayfa: Jüri: Prof. Dr. Hazma AKTAN Prof. Dr. Beşir GÖZÜBENLİ Prof. Dr. Niyazi USTA Doç. Dr. Şamil DAĞCI Doç. Dr. H. İbrahim ACAR Devlet kudretinin sınırlanması kamu hukukunun önemli problemlerinden birisidir. Konu, hukukun çeşitli başlıklarını ilgilendirmektedir. Günümüzde çeşitli kurumlar, bir te minat niteliğinde olarak sınırlama işlevi görmek üzere teklif edilmektedir. Ahlaki sınırlar insan haklarıyla ilgili sınırlar, kamu oyu, hukuk devletinin yapısı gereği bazı sınırlardır. Bu bahis seçim, anayasa sistemi, kuvvetler ayrılığı, yargı denetimi ve halk denetimi şeklinde dir. Bu başlıklar altındaki her bir kurumun devlet kudretini sınırlamada icra ettiği fonksi yon tartışılmaktadır. Raşit Halifeler dönemi Hz. Peygamberin vefatından itibaren devlet başkanlığına seçilen Hz. Ebu Bekir, Hz. Ömer, Hz. Osman, ve Hz. Ali dönemleri içine almaktadır. Bu dönemde henüz devletin birçok kurumu ortaya çıkmamıştır. Halifeler, toplumdaki bazı uy gulama ve kurumlan da dikkate alarak adalet, nısfet, hakkaniyet ve eşitliği sağlamak için gayret göstermişler, ihtiyaçlarla orantılı olarak yeni kurumlar oluşturmuşlardır. Halifelerin ve diğer devlet görevlilerinin sınırsız, mutlak güç sahibi olmadıklarını hissettikleri anlaşılmaktadır. Kur'an ve Sünnet'e bağlılık, adalet, iyiliği emretmek ve kötü lüğü yasaklamak ile yöneticilikle halkın irtibatını sağlayan şûra prensibi devlet başkanını ve yetkilerini sınırlayan bazı prensiplerdir. Kurumlan ihtiyaçlar ortaya çıkardığına, kültür, ortam ve tecrübeye göre ihtiyaçlar farklı şekiller alabileceğine göre, prensiplerin varlığı, zihniyetin de varlığını ortaya koyacaktır. Konuyla ilgili tartışmalarda İslam Hukuk tarihindeki çeşitli tecrübeleri incelemek farklı çözümleri akıla getirmektedir, fikir dünyamıza bir zenginlik katmaktadır."
