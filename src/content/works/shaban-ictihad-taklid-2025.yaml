abstract: "Bu tezde, Vehbî Süleyman Gavoçi'nin (1923-2011) fıkhî görüşlerinde kullandığı usûl analiz edilmiştir. Arnavut kökenli ve son dönem Sünnî-Hanefî âlimlerinden biri olan Gavoçi, 20. yüzyılda müslümanlar arasında İslâmî ilimler metodolojisi konusunda yaşanan zihinsel karışıklıklar döneminde, geleneksel İslâm ilim birikimini günümüze taşıyan mezhebî bakış açısını benimsemiştir. Bu çalışmada, Gavoçi'nin fıkıh faaliyetlerinde takip ettiği usulünü anlamak amacıyla ictihad ve taklid ile ilgili ele aldığı konular tahlil edilmiştir. Ayrıca Gavoçi'nin dört mezhep dışındaki görüşleri savunanlara ve Ebû Hanîfe'ye yönelik eleştirilere karşı verdiği cevapları incelenmiş ve Hanefî mezhebi içinde hangi tavrın izlerini taşıdığı belirlenmeye çalışılmıştır."
