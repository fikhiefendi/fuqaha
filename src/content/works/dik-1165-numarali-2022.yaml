abstract: "Osmanlı hukuk sistemine kendine has özellik kazandıran yargı teşkilatının başında Şer'iyye mahkemeleri gelir. Merkezde ve taşrada adaleti sağlamak için hukukî olarak padişahın vekâletiyle kadılar ve onların yardımcıları nâibler görevlendirilmişlerdir. Kadıların görevleri sırasında tuttuğu Sicil adı verilen defterler birinci el kaynak niteliği taşımakta, aynı zamanda Osmanlı aile, toplum, ekonomi ve hukuk hayatı hakkında bizlere önemli bilgiler sunmaktadırlar. Bu hukukî metinler ayrıca dönemin ve ait olduğu şehrin tarihine ışık tutmaktadırlar. Düzce kazasına ait Devlet Arşivleri Başkanlığı'nda 33 adet Şer'iyye sicili mevcuttur. 1885-1908 yıllarını kapsayan bu sicillerden daha önce yalnızca 1153 numaralı 1895 yılına ait Sicil çalışılmıştır. İkinci çalışma ise 1165 numaralı 1318- 1319/1901-1902 tarihli Sicil üzerine tarafımızca yapılan bu çeviri yazı ve değerlendirmedir. Takriben bir senelik zaman dilimini kapsayan bu Sicil içerisinde 64 dava kayıtlıdır. Sicil'in son sayfalarında da kadıya ait birkaç not mevcuttur. Sicil'de geçen davalar çeşitli konularla ilgiliyse de kadı nâibi genellikle aile hukukuyla ilgili davalara bakmıştır. Nitekim dava konularını ekseriyetle miras, nikâh, boşanma, nafaka ve alacak ile ilgili meseleler oluşturmaktadır."
