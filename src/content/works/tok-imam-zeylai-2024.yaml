abstract: "Bu çalışmada, Kenzü'd-deḳāʾiḳ'in en önemli şerhlerinden birisini kaleme alan Zeylaî'nin, Tebyînü'l-hakâʾik adlı eserinde bey' bölümü bağlamında takip ettiği yöntemin tahlili yapılmıştır. Konu genel hatlarıyla bir giriş ve üç bölüm olmak üzere işlenmiştir. Tezin birinci bölümünde, Zeylaî'nin yaşamış olduğu coğrafya ve döneminin kendisi ve eseri üzerinde etkisinin olduğu açıklığa kavuşturulmuştur. Çalışmanın bu bölümünde Tebyîn eserinin muhtevasından hareketle Zeylaî'nin fakihlik yönü, Tebyîn'in kaynakları ve yazılış amacı incelenmiştir. Çalışmamızda Tebyîn'de takip edilen usul ve yöntem incelenerek Zeylaî'nin şerh metodu ortaya konmuştur. Böylelikle onun, Kenz metninde geçen hükümleri nasıl temellendirdiği daha anlaşılır bir seviyede aktarılmıştır. Zeylaî, Tebyîn'de sadece Kenz metninde olan hükümleri açıklamakla yetinmemiş bunun yanında metinde olmayan fakat metindeki hükümle ilişkili bazı yeni hükümler ilave etmiştir. Zeylaî'nin hükümleri temellendirirken hangi istidlâl yöntemlerini nasıl kullandığı, Zeylaî'nin istidlâl kavramıyla neyi kastettiği, Hanefî mezhebi içerisinde yer alan ihtilaflar karşısındaki tutumu ve onun Hanefî mezhebi içerisinde tercih ehli sayılabileceği meselesi örnekler üzerinden açığa çıkarılmaya çalışılmıştır. Zeylaî'nin mezhep içerisinde vuku bulan ihtilaflar karşısındaki tutumu incelenmiş ve onun genellikle Kenz metninde geçen hükümleri tercih ettiği bazı meselelerde ise metinde gecen hükmü tercih etmeyip ihtilaflı görüşlerden birisini tercih ettiği tesbit edilmiştir. Çalışmamızda ayrıca Tebyîn eserinin etkisi gerek Osmanlı Hanefî fakihlerin telif ettiği eserlerde gerek diğer coğrafyalarda yaşayan Hanefî fakihlerin telif ettiği eserlerde görüldüğü ortaya konmuştur."
