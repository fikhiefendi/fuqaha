abstract: "Bilgiyi tekelinde bulunduranın otorite kabul edildiği bir dönemde fikri mülkiyet meselesi, popüler kültür ve ekonominin en önemli gündem maddelerinden biri olmaktadır. Hem bireysel hem de toplumsal açıdan stratejik bir anlam ifade eden fikri mülkiyet, zihni bir faaliyet sonucu ortaya çıkan fikir ürünler üzerindeki ayrıcalıkları temsil etmektedir. Çok yönlü tartışmalara neden olan bu mesele, modern dünyada Müslüman toplumların da tavrını belirlemesi gereken bir konu haline gelmiş ve İslam hukuku açısından hangi çerçevede ele alınması gerektiği yönünde çeşitli tekliflerde bulunulmuştur. Bu çalışmada ise İslam hukukunda fikri mülkiyet ile ilgili çağdaş dönemde yazılmış Türkçe, İngilizce ve Arapça literatür incelenerek konunun hangi kavramlar esas alınarak, ne çerçevede ve hangi sorulara cevap verilerek ele alındığı tahlil edilmiştir. Bu bağlamda, mevcut birikimin tarihsel seyri eleştirel ve bütüncül bir bakış açısıyla yorumlanarak, konu ile ilgili herhangi bir hükme varmaksızın, İslam hukukunda güncel bir fıkhi mesele ile ilgili nasıl bir ictihad faaliyetinin yürütüldüğü ve gelinen nokta incelenmek istenmektedir."
