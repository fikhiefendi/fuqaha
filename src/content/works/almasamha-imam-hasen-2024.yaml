abstract: "Zamanının âlim imamı, Hanefi mezhebinin önde gelen imamı ve Irak müftüsü, Şeyh İmam Ebü'l-Hasen Ubeydullah b. el-Hüseyn b. Dellâl el-Kerhî (ö. 340/952), döneminde Hanefi mezhebinin önderi ve şöhret sahibi olmuş, öğrencileri ve ünü tüm dünyaya yayılmıştır. Kerhî'nin fıkıh alanında yazılmış -matbu olmayan- müstakil bir kitabı bulunmaktadır. Ayrıca müellifimiz fıkıh usulü alanında da yetkin bir ilmi kişilik olarak öne çıkar. Hanefi mezhebiyle çeliştiği birçok fıkhî görüşü vardır ve bu nedenle Hanefî mezhebini tasnif edenler, onun görüşünü mezhebin diğer imamlarının görüşlerine kıyasla zikretmişlerdir. Bazı durumlarda Kerhî'nin herhangi bir fıkhî görüşü çoğunluk Hanefî bilginlerin yorumlarına tercih edilmiş, bazı görüşlerinde de Kerhî, çoğunluk karşısında yalnız kalmıştır.“İmam Ebü'l-Hasen el-Kerhî'nin Hanefi Mezhebindeki Konumu ve Fıkhî Görüşleri”başlıklı bu tezde, birinci bölümde onun hayatından bahsedilmişitr. İkinci bölümde Kerhî'nin ibadetlerle ilgili görüşleri, üçüncü bölümde kurban ve av gibi konular, dördüncü bölümde muamelata dair konular, beşinci bölümde hadler, altıncı bölümde aile hukukuna dair konular İmam Kerhî'nin görüşleri çerçevesinde incelenmiştir."
