abstract: "Hanefî Mezhebinin ana omurgasını teşkil eden ve ilk metinleri olan zâhirü'r-rivâye eserleri üzerine tarih boyunca birçok çalışma yapılmıştır. Şerh başta olmak üzere ihtisâr, tertîb, nazm vs. türlerde oluşturulmuş çalışmalar mezhebin klasiklerinin oluşmasında önemli bir yer tutmuşlardır. Yapılan araştırmalar sonucunda tespit edilen çalışmaların kahir ekseriyeti Maveraünnehir uleması tarafından yapılmıştır. Aynı zamanda mezhebin klasikleri olarak ifade edilen birçok eser de yine bu bölge ulemasının faaliyet gösterdiği 3 asırlık bir süreçte telif edilmiştir. Bu dönemden sonra birçok ilmî ve kültürel miras Hint ve Anadolu coğrafyasına taşınmaya başlamıştır. Anadolu'da hüküm süren Osmanlı Devleti zamanında zâhirü'r-rivâye üzerine çok az çalışma yapıldığı tespit edilmiştir. Bunun sebebi Osmanlı döneminde özellikle Maveraünnehir kaynakları üzerine inşa edilen bir hukuk anlayışı benimsenmesinden dolayı söz konusu kaynaklar üzerine şerh ve hâşiye türü eserlerin telifi üzerine yoğunlaşılmasıdır."
