abstract: "Bu çalışma, katılım bankacılığı ve risk sermayesi modellerini karşılaştırarak, her iki yapının benzerlik ve farklılıklarını incelemiştir. Her iki model de kâr ve zarar ortaklığına dayanırken, uygulama ve işleyişte farklılıklar göstermektedir. Katılım bankalarının faizsiz finansman olanakları ile risk sermayesinin girişimcilere sunduğu destek arasında paralellikler bulunmaktadır. Çalışmada iki veri seti ile yapılan analizlerde, İslami ve konvansiyonel girişim sermayesi fonlarının performansları incelenmiştir. İlk veri setinde, Ekim 2020 ile Şubat 2025 arasında, İslami fonlar düşük volatilite ve istikrarlı ama sınırlı getiri sağlarken, konvansiyonel fonlar yüksek volatiliteye sahip ancak daha yüksek getiri sunmuştur. Konvansiyonel fonlar, risk-düzeltilmiş getiri açısından daha iyi sonuçlar elde etmiştir. İkinci veri setinde, Nisan 2024 ile Şubat 2025 arasında, İslami fonlar %0,0208, konvansiyonel fonlar ise %0,0236 getiri sağlamıştır. Konvansiyonel fonların daha düşük volatilite ile istikrarlı performans sunduğu ve daha yüksek Sharpe oranı elde ettiği görülmektedir. Sonuç olarak, katılım bankacılığı ve risk sermayesi, girişimcilik ekosistemini destekleyerek sürdürülebilir finansman modelleri geliştirebilir. Katılım bankalarının profesyonel risk sermayesi yönetimi ile işbirliği yapması, ekonomik kalkınmaya katkı sağlayacağı düşünülmektedir."
