abstract: "Bu tezde klasik ve çağdaş radikal kent-mekan kuramları çerçevesinde İstanbul'un Fatih İlçesinde bulunan ve Süleymaniye Camii'nin etrafında oluşmuş Süleymaniye Mahallesi'ndeki Nazır İzzet Efendi ve Fetva Yokuşu sokaklarında 2004-2019 arasında gerçekleşen mekânların yeniden üretiminin ve bu mekânsal üretimlerden sonra ortaya çıkan demografik dönüşümün nedenleri araştırılmıştır. Bu çerçevede önce kapitalizm ve mekanın üretimi ilişkisi, kapitalizmin devamını sağlamak için mekanın yeniden üretilmesi açısından incelenmiştir. Klasik kent kuramcılarının görüşleri özetlenmiş ve Chicago ekolünün temel yaklaşım ve tezlerine değinilmiştir. Radikal kent kuramcılarının görüşleri, özellikle Henri Lefebvre'in yaklaşımlarına odaklanılarak ele alınmış; bu bağlamda kapitalizmin şehir ve mekanları üretmesi, işgal ve tahrip etmesi incelenmiştir. İslam ve Osmanlı şehirlerinin genel nitelikleri izah edilerek, mekan-ekonomi ilişkisi, küreselleşmenin bir sonucu olarak ortaya çıkan mekânsal farklılaşmalar gibi konulara değinilmiştir. Araştırmada, İstanbul'un kültürel ve tarihi kimliği ile teknolojik gelişmelerin karşı karşıya gelmesiyle ortaya çıkan çöküntü mahalleler ve göç sorunu ilişkileri üzerinde durulmuştur. Özellikle Süleymaniye Mahallesi'nde bulunan sokaklardaki mekanların yeniden üretimi ile ortaya çıktıkları üzere,“buluşma mekanları”olarak kafeler olgusu açıklanmıştır. Nazır İzzet Efendi ve Fetva Yokuşu sokaklarında saha incelemesi yapılmış, bu sokaklardaki işletmeler ve işletmecilerin eylem ve fikirleri, ilgili kent ve mekan kuramları açısından değerlendirilmiştir. Çalışmada, bu sokaklarda 2004-2019 arasındaki dönüşüm ve mekanın üretimi süreçlerinin, kapitalizmin rekabet ve işgal karakteristiklerinden ziyade geleneksel İslam kentlerindeki pazar ekonomisi ve esnaflar arası yardımlaşma ve dayanışma gelenekleri çerçevesinde oluştuğu, mekanların yeniden üretimlerinde rasyonel sonuçlarla beraber irrasyonel sonuçların da ortaya çıktığı tespit edilmiştir."
