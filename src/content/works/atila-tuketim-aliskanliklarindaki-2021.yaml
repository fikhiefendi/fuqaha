title: "Tüketim Alışkanlıklarındaki Değişimin Mekan Üzerine Etkisi: İstanbul Süleymaniye Mahallesi Nazır İzzet Efendi ve Fetva Yokuşu Sokaklarında 2004-2019 Yılları Arasında Esnaf Tipi ve Sokak Kültüründeki Dönüşümler"
titleTranslation: {"en": "The effect of changes in consumption habits on space: Transformations in the craftsmen type and street culture in the streets of Nazir İzzet Efendi and Fetva Yokuşu in İstanbul Süleymaniye district between 2004-2019"}
