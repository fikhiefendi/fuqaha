abstract: "Osmanlı Devleti'nin iktisadi ve içtimai hayatının her alanında varlığını sürdüren vakıflar, devletin hukuki ve şer'i yapısı temelinde uzun yıllar faaliyetlerini icra etmişlerdir. Osmanlı'nın kuruluş yıllarından itibaren işlerliklerini sürdüren vakıflar, devletin büyümesine paralel olarak gelişme göstermiştir. Nitekim Osmanlı Devleti, kendisinden önce de var olan vakıf müessesesini etkili bir şekilde uygulamıştır. Bu durumun neticesi olarak vakıfların bir türü olan para vakıfları ortaya çıkmıştır. Bu çalışmada, Şer'iyye sicillerinde yer alan 1 No'lu muhasebe defterinden hareketle 1633-1634 yıllarında İstanbul'da faaliyette bulunan vakıfların ekonomik ve sosyal faaliyetleri irdelenmiştir. Bu çerçevede; vakıfların ekonomik ve sosyal hizmetleri tablolar vasıtasıyla kapsamlı bir şekilde aktarılmıştır. Çalışmada, para vakıflarının elde ettiği gelirler ve yaptığı giderler hakkında bilgilere verilmiştir; vakıfların ekonomik bağlamda kişilere verdikleri borç para ve toplam miktarı da gösterilmiştir. Muhasebe defterlerinden elde edilen veriler ışığında vakıfların temel gelir kaleminin murabaha olduğu; en çok harcama yaptığı giderlerin ise kendi bünyesinde istihdam ettiği görevlilerinden oluştuğu sonucuna ulaşılmıştır. İncelenen muhasebe defterinde en çok dikkat çeken bulgu sosyal hizmet bağlamında gerçekleşen yardımların az olduğudur. Bununla birlikte incelenen vakıfların toplumun her kesimden kişilere borç para verdiği de tespit edilmiştir. Bu durum, para vakıflarının Osmanlı toplumunun refah düzeyi açısından ne kadar önemli ve etkili bir kurum olduğunu ortaya çıkarmaktadır."
