abstract: "Endonezya'da İslam hukukunu uygulayan tek bölge Açe'dir. Fakat, İslam hukukunun gayrimüslimlere uygulanmasıçoğu kez tartışmalara neden olmaktadır. Bu tartışmalara dayanarak tezimiz, Açe'deki İslam hukuku uygulamasının gayrimüslimlerin din özgürlüğü üzerinde etkisini bilmek, incelemek ve tarif etmeyi amaçlamaktadır. Tezimiz amacına ulaşmak için öncelikle iki meseleyi incelemektedir. Birincisi, Açe'deki İslam hukukunun gayrimüslimlere uygulanmasını, ikincisi, Açe'deki gayrimüslimlerin din özgürlüğü hakkındaki düşüncelerini incelenmektedir. Bu tez, gözlem, mülakat ve dokümantasyon yöntemleriyle veri toplayan nitel bir yaklaşım kullanmaktadır. Bu yöntemle tezimiz, Açe'de İslam hukuku uygulanmasının gayrimüslimlerin dini özgürlüğü üzerinde olumsuz bir etkisi olmadığı sonucuna varmaktadır. Diğer bir deyişle, Açe İslam hukukunu uygulamasına rağmen, gayrimüslimler dini alanda faaliyetlerini yürütmekte serbesttirler. Bune destekleyen veriler tezde incelenmiştir. Açe'de uygulanan İslam hukuku temel olarak sadece Müslümanlar için geçerlidir, ancak Jinayat yasasının uygulanması bağlamında gayrimüslimlerin İslam hukukuna uygun yargılanmayı talep etmeleri de mümkündür. Fakat bu, gayrimüslimlerin İslam hukukunu takip etmeye zorladığı anlamına gelmez. Bununla yasal bir boşluğun oluşmaması ve tüm Açe halkları için adaletin oluşturulması amaçlanmaktadır;İslam hukuku uygulamasına ilişkin olarak çıkartılan kanunlarda gayrimüslimlerin din özgürlüğü de garanti altına alınmıştır, Böylece gayrimüslim halklar, kendi dinlerinde ibadeti veya diğer dini faaliyetleriherhangi bir kısıtlama ve zorlama olmaksızın özgürce gerçekleştirebilirler. Ayrıca gayrimüslimlerin görüşleri, İslam hukukunun uygulanmasını kabul ettiklerini ve hatta Açe'deki gayrimüslimlerin hayatlarına fayda sağladıklarını göstermektedir."
