abstract: "Bu tez Necah el-Kari li Sahihi' l-Buhari (Buhari Şerh-i) eserini tahkikli metniyle birlikte sunmayı hedefler. Günümüzde, 30 ciltte yazılmış bu eserin yazarı Yusuf Efendizâde 'nin isimlendirdiği gibi Necah el-Kari li Sahihi' l-Buhari (Buhari Şerh-i) olarak bilinmektedir. Yazarın eserinin girişinde söylediği gibi, şahsi görüşleri ve hadis anlayışına değinmenin yanı sıra, kitabında önceki âlimlerin şarhlarını da topladığını belirtilmelidir. Özelikle İmam İbn Hacer'in“ Fethu'l Bari ”isimli Sahihi Buhari Şerhinin ve Imam El- aynî'nin“Umdetu'l Karî ”isimli Sahihi Buhari Şehri'nin derlemelerini yapmıştır. Eserinin bazı yerlerinde onların birçok sözlerini iktibas ettiği ancak geri kalan yerlerde kendi fikir ve düşüncelerini belirttiği ayriyeten onların fikirlerini de tartıştığı açıktır. Buna ek olarak, yazar Hanefi mezhebine dayanarak bazı konularda içtihat görüşlerini açıklığa kavuşturdu ve buna“ve yoldaşlarımızda”olarak işaret ediyordu. Birçok durumda, görüşlerini aynı mezhebinde olan İmam El-Aini'den iktibas ediyor ve yazar, görüşlerinin çoğunda“Allah en iyisini bilir (allahü â'lem)”diyerek bitiriyordu."
