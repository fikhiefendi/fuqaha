abstract: "Osmanlı İmparatorluğu'nda yaşayan gayrimüslimler İslam hukuku çerçevesinde kendilerine tanınan belirli haklar ve sınırlılıklar içerisinde dinî ve sosyal yaşantılarına devam etmişlerdir. Ayrıca Patrikhanelere bağlı kilise teşkilatlarının işleyişini ve buna bağlı olarak dinî-hiyerarşik yapılarını da Osmanlı idaresi tarafından belirlenen kurallar çerçevesinde devam ettirmişlerdir. Osmanlı İmparatorluğu'nda gayrimüslimlerin bir yönüyle temsilcisi de olan bu yapı, genel olarak Rum ve Ermeni Patrikhaneleri altında teşkilatlanmıştır. Patrikhaneler, kilise teşkilatları sayesinde şehir, kasaba ve köylere kadar kendilerine bağlı cemaatler üzerindeki dinî otoritelerini sağlamaktadır. Bu durum Osmanlı idaresi tarafından kendilerine tanınan hak ve sorumlulukların dışına çıkmadan, devlet ile beraber bu süreci yürütebilmeleri sayesinde mümkün olmuştur. Kilise teşkilatını ilgilendiren malî ve idarî meseleler ile kilise teşkilatı içerisindeki görevlilere verilen berat ve ahkâm gibi resmi evrakın takip ve kontrolü için Osmanlı bürokrasisinde, maliye kalemleri içerisinde, Piskopos Mukataa Kalemi oluşturulmuştur. Tarihi süreç içerisinde dönüşümler geçiren büro, on sekizinci yüzyılın ortalarına doğru klasik şeklini almıştır. Bu zaman dilimi, kendi iç dinamikleri ve Osmanlı bürokrasi ile ilişkileri çerçevesinde değerlendirildiğinde, İstanbul Rum Patrikhanesinin daha kurumsal bir yapıya kavuşmaya başladığı dönem olarak dikkat çekmektedir. Bu tez çalışmasında Osmanlı bürokrasisi içerisinde, Piskopos Mukataa Kaleminin ihdası, gelişimi ve lağvedilme süreci, İstanbul Rum Patrikhanesi ve buna bağlı kilise teşkilatı çerçevesinde incelenmektedir. Böylece İstanbul Rum Patrikhanesinin, Osmanlı bürokrasisi içerisindeki konumunun açıklanması amaçlanmaktadır. Bu çalışmanın kaynaklarından en önemlisi, Piskopos Mukataa Kalemi tarafından tutulan ve içerisinde patrik, metropolit ve piskoposların berat kayıtları ile kilise teşkilatının işleyişi ile ilgili hükümlerin yer aldığı defter serisi olan Piskopos Mukataası Ahkâm ve Berevât Defterleridir. Bununla birlikte bürokratik işleyişi açıklamak adına Osmanlı Arşivi'ndeki diğer belge ve defterlerden de yararlanılmıştır. Çalışmada İstanbul Rum Patrikhanesinin, Osmanlı İmparatorluğu'ndaki bürokratik konumu incelenmekte, özellikle maliye bürokrasisi ile ilişkisi ortaya konulmaktadır. Buna göre Patrikhanenin, kilise teşkilatı üzerinde idarî konulardaki yetkilerini kullanabilmesi, Osmanlı idaresinin izin ve bilgisi dâhilinde gerçekleşmektedir. Böylece İstanbul Rum Patrikhanesinin devlet teşkilatı içerisinde belirli görevleri yerine getirmekle yükümlü bir Osmanlı müessesesi olduğu sonucuna ulaşılmıştır."
