abstract: "Katılım bankacılığı'nın (Özel Finans Kurumları'nın) Türkiyedeki başlangıç tarihi 1983 yılıdır. 16.12.1983 tarih 83/7506 sayılı kararname ile Özel Finans Kurumları'nın temeli atılmıştır. Katılım bankaları şuan itibariyle 5411 sayılı Bankalar Kanununa tabidir. Kuruluşunun üzerinden 25 yıldan daha uzun bir süre geçmesine rağmen, ülkemizde katılım bankaların sektördeki payı % 5'lerde seyretmektedir. Topladıkları fonların yasal zorunluluklar hariç tamamı ile reel ekonomiyi fonlamakta olan bankaların %5 lik dilimlerin daha yüksek oranlara çıkma potansiyeli bulunmaktadır.Kredi derecelendirmesi kredi sağlayıcı kuruluşların riskinin temelini oluşturmaktadır. Derecelendirme, tüm şirketleri analiz etmeye yardımcı olan bir işlemdir. Derecelendirme sonucu elde edilen netleştirilmiş bilgiler karar vermeyi kolaylaştırmaktadır. Günümüzde gittikçe artan işler karşısında zaman kısıtının önemi de göz önüne alındığında, değerlendirme ile ilgili bilgilere kısa sürede ulaşmanın önemi ortaya çıkmaktadır.Bu çalışmada, Türkiye'de faaliyet gösteren katılım bankalarının kredi derecelendirmelerini nasıl yaptıkları araştırılmış, uygulamalı ve teorik açıdan bu bankalar incelenmiş ve birbirleriyle karşılaştırılmıştır. Derecelendirmede kullanılan subjektif kriterler önemlilikleri dikkate alınarak en önemli subjektif kriterler belirlenmiştir.Çalışma Türkiye genelinde faaliyet gösteren dört katılım bankası üzerine yapılan araştırmayı içermektedir. Katılım bankalarında kredi analisti olarak görev yapan toplam 2.256 adet uzman araştırmanın evrenini oluşturmaktadır.Kredi derecelendirme de kullanılan subjektif kriterler; önem, zorluk ve kullanılabilirlik düzeyleri dikkate alınarak önemli faktörler ölçüldüğünde birinci faktör moraliter değerlendirmeler olduğu belirlenmiştir. Moraliter değerlendirmeler analizi en önemli faktör olarak hesaplanmıştır. Kredi kuruluşları ve bankalar kredi tahsis aşamalarında kredi talep edenin moraliter değerlendirmesini en ön planda dikkate almalılardır."
