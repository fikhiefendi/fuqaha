abstract: "Günümüzde insan hakları kavramı bütün dünya toplumlarında önemli bir değer olarak görülmektedir. Bu çerçeve de insan haklarının en önemli unsurlarından birisi olan çocuk hakları da üzerinde durulmaya değer bir nitelik taşımaktadır. Bu çalışma, son dönem Osmanlı âlimlerinden Celvetî Şeyhi Bandırmalızâde Ahmed Münib Efendi'nin Hukuk-u Veled, Risâle-i Akîka ve Ta'rifü'l-Hitân adlı risâlelerinin günümüz Türkçesine sadeleştirmek sûretiyle aktarımını amaçlamaktadır. Bu çerçeve de çalışmamız, müellif ve eserleri hakkında kısa bilgileri ve başlıca çocuk hükümleri ile ilgili üç risâlesinde geçen çocuk haklarını kapsamaktadır. Müellifin risâlelerde vermiş olduğu bilgilerin kaynakları tarafımızca tespit edilip dipnotlarda referanslandırılmış ve zenginleştirilmiştir. Müellif, İslam Hukuku açısından mendub olan çocuk haklarını, yine çocuk hükümleri ile ilgili akîka kurbanı ve çocuğun sünnet edilmesi (hitân) hususlarını bu üç eserinde irdelemiştir. Genel sûrette Hukuk-u Veled adlı risâlenin kapsamına dahil olan Risâle-i Akîka ve Ta'rifü'l-Hitân adlı eserlerde müellif, akîka ve hitân kelimelerini açıklayıp bu konularda dikkat edilmesi gereken noktaları delilleriyle belirtmiştir. Kapsam itibarıyla daha geniş olan ve konumuzun ana metnini oluşturan Hukuk-u Veled adlı risâle de ise müellif, sadece“Hukuk-u Mendûbe”kapsamındaki hakları kaleme almış ve delillendirmiştir. Bu haklar kısaca; cinsiyetine bakılmaksızın doğan çocuğa sevinme, sağ kulağa ezan-ı Muhammedî okuyup sol kulağa kamet getirme, tahnîk yapma, akîka kurbanı kesme, çocuğu emzirme, süt emme dönemindeki çocuğun ağlaması, çocuğu güzel bir isimle isimlendirme, çocuğu sünnet etme/ettirme, çocuğu evlendirme, çocuğun terbiye edilmesi ve ilim tahsil etmesi ve son olarak çocuğa helal rızık yedirme şeklinde sıralanmıştır. Bandırmalızâde Ahmed Münib Efendi'nin zikri geçen bu üç risâlesi, İslam hukuku açısından çocuk haklarını tanıtan tarihi bir belge olma hüviyetine sahiptir."
