abstract: "TEZ ÖZETYazar : Ömer Şerif B LG NÜniversite : Uludağ ÜniversitesiAnabilim Dalı : Temel slam BilimleriBilim Dalı : slâm Hukuku Bilim DalıTezin Niteliği : Yüksek Lisans TeziSayfa Sayısı : xii + 319Mezuniyet Tarihi :Tez Danışmanı : Prof. Dr. Hamdi DÖNDÜRENKUR'AN'DA YER ALAN HUKUKSAL AMAÇLAR( LK BEŞ SÛRE)Allah'tan aldığını bildirerek insanlığa sunduğu Kur'an'ın amaçlarını en iyi bilen kişininHz. Muhammed olduğu kesindir. Kur'an dışında O'na gelen ve slâm dinine ışık tutanvahiylerin, Kur'an gibi kesin (mütevatir) olmadığı bilinmektedir. Eğer gerek duyulsaydı, bunlarda Kur'an gibi korunabilirdi. Bizce, buna gerek duyulmamasının sebebi, slâm'ın değişmezgüçlü ana amaçları ile gelişmeye açık değişken araç hükümlerinin tümüyle Kur'an'da varolmasıdır. nsanın, aklını ve bilimi kullanarak bu güçlü ana amaçlar ışığında, Kur'an'dakidoğru yolu bulabileceği kabul edilmiş olmalı ki; tek hidayet kaynağı olarak Kur'an'ın korumaaltına alındığı yine Kur'an'da belirtilmiş bulunmaktadır. şte bu mesaja uyularak bu çalışmada,Kur'an'daki değişmez ve güçlü ana amaçların hukuksal olanları, sadece Kur'an metinlerinedayanılarak belirlenmeye çalışılmıştır.Birinci bölümde, Kur'an metinlerinin insanlığın anlamasına sunulmuş olduğu dikkatealınarak, bunları oluşturan sözcük, kavram sözcük, sözce ve tümcelerin bilimsel verilerçerçevesinde doğru anlaşılabilmeleri ve amaçlarının doğru olarak belirlenebilmesi için gereklibilgilerin neler olduğu, bilgi teorisi, anlambilim ve mantık bilimi verileri çerçevesinde özetolarak verilmeye çalışılmıştır.Ayrıca, hukuk bilimi ile slâm hukukundaki hukuksal amaç kavramı ele alınarak, hukukkurallarının yapımında dikkate alınan ve hukukun amaçlarını içeren ?olması gerekenhukukun? ne olduğu ve ?olan hukuk?un gelişme yönündeki değişimi ile yorumlanması ve kamuyararına yönelik amaçlarının belirlenmesinde, hukuk biliminden nasıl yararlanılabileceğigösterilmeye çalışılmıştır.kinci bölümde ise, Kur'an ve sünnet metinlerinin yorumlanmasında kullanılanyöntemlerin yetersizlikleri ve amaçların belirlenmesinde yeterli olamayacakları ortaya konmuşve Kur'an'daki amaçların belirlenmesinde yardımcı olacağı düşünülen bazı kavramlara yerverilmiştir.Aynı bölümde Kur'an ve sünnet metinlerinin yorumu ile amaçlarının belirlenmesindeetkin olacağı düşünülen, ?Bilimsel Bütünsel Amaçsal Yorum Metodu? ortaya konmayaçalışılmıştır.Üçüncü ve son bölümde, bu metot kullanılarak, Kur'an'ın ilk beş sÃ»resinde yer alanhukuksal amaçlar, ayet sıralarına göre belirlenmeye çalışılmıştır."
