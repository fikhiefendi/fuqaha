abstract: "Klasik eserlerde faiz; alış verişten ve borçtan elde edilen faiz olmak üzere ikiye ayrılır. Borç faizi üzerinde fazlaca durulmayıp konu, ?kitabu'l-büyû? başlığı altında alım satım kapsamında işlenir. Dört mezhepten her biri, ?altı mal hadisi? olarak meşhur olan rivayetleri esas alarak birer faiz illeti belirlemiş ve sistemlerini ona göre kurmuşlardır. Sonuç olarak farklı faiz sistemleri ortaya çıkmıştır.?Allah, alım satımı helal, faizi haram kılmıştır.? (Bakara 2/275) Bu sebeple çalışmanın amacı faizi net bir şekilde tanımlayarak, onun diğer ticari faaliyetlerden ayrılmasını kolaylaştırmaktır. Bunun için ?ticaret? ve ?faiz? kavramları, ilgili diğer kavramlarla birlikte Kur'an sünnet bütünlüğü içinde ele alınmıştır. Öncelikle Kur'an'da yasaklanan faizin ?borçtan gelir elde etme? yöntemi olduğu ve bu açıdan diğer ticari faaliyetlerden ayrıldığı tespit edilmiştir. Ardından da Hz. Peygamber'in faiz hakkındaki hadislerinin, Kur'an'dan farklı olarak, yeni bir faiz çeşidi ortaya koymadığı, sadece bazı ticari faaliyetlerin, Kur'an'da yasaklanan borç faizine alet edilmesini önlemeyi amaçladığı görülmüştür."
