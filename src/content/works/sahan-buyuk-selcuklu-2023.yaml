abstract: "Yenikent'ten ayrılarak Cend'e gelen Selçuklular bu bölgede İslam ile tanıştı. Burada İslam'ı kabul etmenin stratejik önemini kavradılar ve bu dini kabul ettiler. Bölge ve çevresi itikatta ekseri Maturidi veya Eşari, fıkıhta ise Hanefi, Şafi, Hanbeli veya Maliki gibi Ehl-i Sünnet fırkalarına mensuptu. Selçuklular da Sünni İslam'ı benimsediler ve özellikle Hanefiliğe bağlı kaldılar. İslam'ı kabul etmeleri bölgede siyasi etkinliklerini ve güçlerini arttırdı. Selçukluların büyük bir güç olarak ortaya çıktığı bu yüzyıllar, İslam dünyasının en buhranlı devrine denk gelmekte idi. İslam, kendi içinde Şii ve Sünniliği temsil eden iki farklı kola ayrılmış, bunlarda kendi imamlarını seçerek halifelik adı altında kurumsallaşmıştı. Selçuklular, müstakil bir devlet olarak ortaya çıktıklarında ilk işleri Abbasi Devleti'ni tahakkümü altına alan Şii güçlerine karşı tepki göstermek oldu. Bu tepki aynı zamanda dini politikalarının da bir belirleyicisi idi. Onların dini politikası, vezir Kündüri'nin uyguladığı Mute'zile mihneti hariç, hâkim oldukları bölgelerde inanç ve mezhep çeşitliliği karşısında birliğin sağlanabilmesi için denge siyaseti yürütmekti. Fakat Selçuklular her ne kadar bu politikayı yürütmeye çabalamışsalar da her mezhebin bir başka mezhebe tepki olarak ortaya çıktığı göz önüne alınırsa sık sık kendini gösteren dini hareketlerin arasında kalmış idiler. Özellikle Şafii ve Hanbeli gibi Sünni mezhepler Mu'tezile'ye tepki almışlar, Mu'tezile'de onlarla mücadeleye girmekten geri durmamıştı. Bir gerilim de Hanbeliler ve Eşariler arasında yaşanmıştı. Malikiler ise bu tarz konularda daha geri planda durmayı tercih etmişlerdi. Hanefilerin de Nizamülmülk ile güçlenen Şafiilere karşı rekabete girdikleri görülür. Bu tartışmalar Selçuklular için önemli bir sorun iken ayrıca daha büyük problemler Şiilerle yaşanıyordu. Selçukluların silahlı mücadelesini gerektirecek kadar büyüyen İsmaili hareket de baş göstermişti. Bu çalışmada bahsi geçen olaylar çerçevesinde Selçukluların mezheplere karşı yaklaşımı, alınan tedbirler ve bu durumlar karşısında ne kadar rasyonel kalabildiklerine dair inceleme yapılmıştır. Bu inceleme yapılırken mezheplerin doğuşu ve öğretileri hakkında da bilgiler aktarılmış, Selçukluların ortaya çıkışından öncesine değin, İslam'daki ilk ihtilaflaşmalar da dahil edilerek olaylar örgüsü bütünüyle ele alınmıştır."
