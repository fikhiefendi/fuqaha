abstract: "Temelleri Roma hukukuna dayanan tasnife göre borcun üç temel unsuru bulunmaktadır. Bunlar; alacaklı, borçlu ve edimdir. Borcun konusunu oluşturan edimin ise Roma hukuk sisteminde yapma, yapmama ve verme şeklinde üç türü tespit edilmiştir. Bunlardan verme borçları ise cins, parça ve para borçları olarak üç şekilde tezahür etmektedir. Klasik fıkıh literatüründe verme borçlarından cins ve para borçlarına“deyn”kavramı, parça borçlarına ise“ayn”kavramı tekabül etmektedir. Fıkıhta borçlara ilişkin hükümler bahsedilen edim türlerinin değişmesine bağlı olarak esaslı farklılıklar göstermektedir. Bu çalışmada verme borçları kapsamında yer alan cins borçları, mukabili olan parça borçları ile mukayese edilmek suretiyle incelenerek fıkıhta edim türlerine bağlı olarak borçlara ilişkin hükümlerde görülen farklılıklara dair bir örnek sunulması hedeflenmiştir. Bu bağlamda çalışmamızda ayn ve deyn kavramlarının mahiyeti ana hatlarıyla ortaya konduktan sonra özellikle cins borçlarının tayini, konusunda aranan şartlar, borç konusu üzerinde tasarruf, borcun teminat altına alınması ve sona ermesi dört mezhebin yaklaşımı çerçevesinde ayrıntısıyla incelenmiştir."
