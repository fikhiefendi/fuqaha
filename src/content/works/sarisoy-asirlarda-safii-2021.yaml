abstract: "Bu çalışma, IV.-VI. (X.-XII) asırlarda Şâfiî mezhebinde fetvâ faaliyetini tarihî seyri içinde ortaya koymak amacıyla dönemin müftîlerini ve fetvâ eserlerini konu edinmektedir. Erken dönem Şâfiî mezhebi iftâ tarihinde, müftî olarak temayüz eden birçok fakihin bulunduğu, bu fakihlerin ağırlıklı olarak mezhep hâkimiyetinin güçlendiği Irak ve Horasan bölgelerinde yaşadıkları, buna bağlı olarak adı geçen bölgelerde iftâ faaliyetinin diğer bölgelere nispetle daha yoğun seyrettiği anlaşılmıştır. Bölgelerde iftâ faaliyetlerinin sayı ve yoğunluğunda, başta eğitim olmak üzere bir takım sosyo-kültürel ve siyasî sebeplere bağlı olarak değişiklikler yaşandığı görülmüştür. İftâ faaliyeti, kahir ekseriyeti mezhep temsilcisi olan fakihler tarafından yürütülmüş; bu bağlamda müftîlerin, ilmi yetkinliğe sahip dönemin önde gelen Şâfiî âlimleri oldukları anlaşılmıştır. Dönemin müftîlerinin, iftânın yanı sıra tedris ve münazara konularında da aktif rol alarak mezhebin yayılmasında ve istikrar bulmasında büyük katkılar ortaya koyduğu görülmüştür. Şâfiî literatürü kapsamında en erken tarihli fetvâ eserinin, hicrî dördüncü asırda yaşamış Mısırlı müftî fakih İbnü'l-Haddâd el-Kinânî'nin (ö. 344/955) Fetâvâ'sı olduğu tespit edilmiştir. Dönemin günümüze ulaşan diğer altı fetvâ eseri üzerinden yapılan incelemede, tasnif bakımından bir kısmında Müzenî'nin el-Muhtasar'ının örnek alındığı, fetvâların ağırlıklı olarak muâmelât konularıyla ilgili olduğu, üslûp itibariyle aralarında kısmî farklılıklar bulunduğu ve dil üzerinde coğrafî etkilerin görüldüğü belirtilmelidir."
