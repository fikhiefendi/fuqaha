abstract: "Eşref-i mahlukat olarak yaratılan insan, mahlukat içerisinde en önemli yere sahiptir. Tarih boyunca yeryüzünde var olan sisteme göz attığımızda her insanın varlığını sürdürebilmesi için haddi zatında kendi dışındaki varlıklarla iletişimde bulunmak zorunda olduğu görülmektedir. Bu yüzden her insanın diğer insanlarla var olan iletişim ağını sağlıklı bir şekilde devam ettirmesi gerekmektedir. Fakat insanoğlu başlı başına bir âlem olduğu için bazen var olan ilişkilerin devamlılığı da sorun haline gelmekte, her şahsın kendine özgü kurallar koyma eğiliminde olduğu dikkatleri çekmektedir. Dolayısıyla ilişkilerin sağlam bir zeminde yürütülebilmesi huzur ve güven ortamının oluşturulabilmesi için toplumda kabul gören bir hukuk sistemine ihtiyaç duyulmaktadır. İnsan ilişkilerine bu sağlam zemini kazandırma açısından bakıldığında, eski çağlardan günümüze kadar uygulanmış hukuk sistemleri arasında İslam hukukunun teoride ciddi öneriler getirdiği ve pratikte de bunları son derece ciddi yaptırımlarla hayata geçirdiği görülmektedir. İslam hukuku insan ilişkilerini ve toplumlar arası münasebetleri düzenleme adına, en eski hukukî müesseselerden biri olan akidleri kullanmış ve onlara yeni açılımlar getirmiştir. Günlük hayattan devlet işlerine, miras hukukundan ticarete kadar her alanda muâmelâtın ilk nüvesini akidler teşkil etmektedir. Hal böyle olunca İslâm'ın ilk muhatapları da akidlerle ilgili konularla meşgul olmuşlardır. Fakat Sahabiler Hz. Peygamber'in (s.a.s) uyguladığı akidlerin sebebini, maslahatını ve ilkelerini bilmekte, aynı şekilde uygulamaktaydılar. Bundan dolayı naslarda akidlerle ilgili tarif veya ayrıntılara rastlanılmaz. Daha sonraki yüzyıllarda akdin alanları ve onunla ilgili problemler çoğalıp çeşitlendikçe bu tanımlama ve ayrıntılara ihtiyaç hissedilmiştir. Akid sözlükte bağlamak, düğümlemek gibi anlamlara gelmekte olup ıstılahta ise hukukî sonucu mahallinde doğacak tarzda îcab ve kabulün meşru bir şekilde irtibatından ibarettir. Ancak tarafların haklarının güvence altına alınabilmesi için akdin meşru bir şekilde kurulması gerekmektedir. Bu doğrultuda mahallin akdin muktezasına uygun olması gerekmektedir. Bu yüzden akidlerde“mahal”önemli unsurlardan birisidir. İslâm hukukunda akdin mahalli, yapılan akdin türüne göre farklı yapı ve mahiyette olabilmektedir. Mesela bey' akdinde mahal mebî, icâre akdinde kiralanan şeyin menfaati, hibe akdinde hibe edilen mal, karz akdinde borç verilen para, selem akdinde sonradan ödenecek mal, istisnâ' akdinde sipariş verilen mal, vedîa akdinde malın korunması, vekâlet ve kefâlet akidlerinde söz konusu işin yapılması akdin mahalli olmaktadır. Fukaha, tarafları anlaşmazlığa düşmekten korumak amacıyla, akdin mahallinde bulunması gereken şartları akid mahallinin mevcut olması, malum olması, mubah olması ve tesliminin mümkün olması şeklinde belirlemişlerdir. Akde mahal olacak şeyin hukuken istifade edilmesine müsaade edilmiş olması da gerekmektedir. Her ne kadar durum böyle olsa da akde mahal olmayan şeyler de mevcuttur. Mesela yenilmesi, içilmesi veya kullanılmasına izin verilmeyen şeyler akde mahal olamazlar.“Akid Mahallinin Mubahlık Şartı”konulu bu tezimiz giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın konusu ve metodu ele alınmıştır. Konumuzun temelini oluşturması açısından birinci bölümde mal, mülkiyet, mubah ve akid kavramlarının tanımı yapılarak İslâm hukukunda akid ile ilgili hususlar alt başlıklarla desteklenerek anlatılmaya çalışılmıştır. İkinci bölümde akid mahallinin mubahlığı meselesi ele alınmıştır. Bu çerçevede Fıkıh eserlerinde yer alan her bir akid çeşidi ele alınarak bu akidlerin mahallinin mubahlığı Hanefi mezhebinin görüşüne göre tek tek incelenmiştir. Öte yandan akidleri bâtıl yapan hususlar da belirtilmiş ve buna dair bazı uygulamalardan örnekler verilmiştir. Sonuç bölümünde ise çalışmada elde edilen veriler ve ulaşılan bulgular değerlendirilmiş ve okuyucuyla paylaşılmıştır."
