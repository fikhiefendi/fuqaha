abstract: "İslâm hukukunda, bireyden sadır olan her söz ve fiil için bir hüküm tayin edilmiştir. Bu bağlamda, kişinin gerçekleştirdiği tasarrufların neticelerini göz önünde bulundurarak hareket etmesi zaruridir. Bununla birlikte, birey kimi zaman kendi irade ve isteği doğrultusunda gerçekleştirdiği bazı tasarruflardan vazgeçmek isteyebilir. Bu durum, insanın tabiî haklarından biri olmakla birlikte, birtakım hukuki sonuçları da beraberinde getirmektedir. Klasik fıkıh literatüründe; müçtehidin içtihadından, müftünün fetvasından, şahidin şahitliğinden, ikrarda bulunan kimsenin ikrarından, îcabda bulunanın îcabından ve ayrıca hibe, vakıf ya da vasiyet gibi hukukî işlemlerden dönme halleri“rücû”kavramı çerçevesinde ele alınmıştır. Kadının mahkemeye müracaatı sebebiyle evlilik akdinin feshedilmesi, eşine îlâda bulunan erkeğin yeminini bozarak eşine dönmesi ve kefilin, ödediği borcu tahsil etmek üzere borçluya müracaat etmesi gibi hususlar rücûun örneklerinden sadece birkaçıdır. Bu çalışmada genel olarak rücû kavramının İslâm hukukundaki teorik ve uygulamalı yansımaları incelenmiş; özellikle Hanefî ve Şâfiî mezhepleri çerçevesinde konu metin karşılaştırması yöntemi ile mukayeseli olarak ele alınmıştır. Bu çalışmanın temel amacı, İslâm hukukunda rücû kavramının yansımaları ve hukukî sonuçlarına dair literatürde dağınık halde bulunan bilgileri sistematik bir bütünlük içerisinde ele almak ve ilgili meseleleri Hanefî ile Şâfiî mezhepleri özelinde mukayeseli bir yöntemle incelemektir. Ayrıca günümüzde bireylerin akitlere gereği gibi bağlılık göstermemeleri, ortaya çıkan ihtilafların çözümünde yetersiz kalmaları ve muâmelât alanında akitten rücû etmeleri durumunda İslâm hukukunun sunduğu çözüm imkânlarına erişimlerini kolaylaştırmak da çalışmanın temel hedefleri arasında yer almaktadır."
