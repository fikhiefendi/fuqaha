abstract: "Bu çalışmada, modern Türk hukuku ile İslam hukukunun beden bütünlüğüne yönelik suçları ele alış biçimleri ve farklı yönleri incelendi. Bu bağlamda, öldürme, hürriyetten yoksun bırakma, yaralama ve cinsel suçlar detaylıca ele alındı. Çalışmamızda tespit edebildiğimiz kadarıyla, detayda bazı farklılıklar olmakla birlikte her iki hukuk sistemi de bedene yönelik suçları ele almışlar ve cezalandırmışlardır. Türk hukuk sistemi, ergenlerin rızaya dayalı cinsel birleşmelerini cezalandırmazken İslam hukuku toplumun korunmasını ön plana alarak bu durumu suç olarak telakki etmiş ve cezalandırmıştır. Türk hukuku cezalandırma yöntemi olarak hürriyeti bağlayıcı cezaları esas alırken, İslam hukuku parasal ve bedene yönelik cezaları esas almıştır."
