abstract: "III ÖZET 1413/8101 NUMARALI GİRESUN ŞER'IYYE SİCİLİ (H.1307/1308-M. 1889- 1890) TRANSKRİPSİYON VE DEĞERLENDİRMESİ Çalıştığımız dönem, H.1307- M.1889/1890 yıllarına ait 1413/8101 nolu Giresun Şer'iyye Sicili'dir. Çalışmamızın başında şer'iyye sicillerinin ortaya çıkışı, Osmanlı Şer'iyye Sicilleri'nin tarihi gelişimi, şer'iyye sicillerinin önemi ve kapsadığı belgeleri; konumuzla bağlantılı olması nedeniyle Osmanlı Devleti'nin hukukî yapısını, şer'î ve örfî hukuku ana hatlarıyla ele alarak izah etmeye çalıştık. Giresun'a ait şer'iyye sicilleri'nin incelenmesi ile mahalli tarihçilerin ihtiyaç duydukları malzeme, sayılabilir rakamlarla verilmektedir. Bu belgelerden Giresun'un kapsadığı bölgelerin tarihleri, coğrafyaları, eski eserleri, ekonomik ve ticarî faaliyetleri, memur listeleri, nüfusları gibi değişik konularda bilgiye ulaşılmaktadır. Milâttan önce IV. ve V. yüzyıla kadar uzanan bir tarihin parçası olan Giresun, Osmanlı hâkimiyetine girişinden sonra da müstahkem bir kale olarak önemini korumuş, fındık ticaretiyle ön plana çıkmış, iç kesimlerin hububatının ve madenlerinin ihraç limanı olma özelliği ile de kale-şehir olarak gelişme göstermiştir. Bu özellikleriyle birçok kültüre de ev sahipliği yapmıştır. 1413/8101 numaralı Giresun Şer'iyye Sicili'miz yüz on üç adeti hüccet, elli yedi adeti ilâm olmak üzere toplam yüz yetmiş adet belgeden oluşmaktadır. Çalıştığımız dönemde Giresun'da Ermeniler, Rumlar ve Müslümanlar bir arada yaşamışlardır. Temelde teokratik temellere oturan Osmanlı Devleti' nde İslâm hukukunun yanında örfî hukuk kurallarına da uyularak gayr-i müslimler için bir asimile politikası uygulanmamış, kendi dinlerini muhafaza etmiş ve asgari müştereklerde uzlaşarak barışIV içinde yaşamışlardır. İncelediğimiz belgelerin yüz on dokuz adeti müslümanlarla ilgili, otuz dört adeti gayr-i müslimlerle ilgili, on yedi adeti ise müslümanlarla gayr-i müslimler arasında ki meselelerle ilgilidir. Siciller, daha çok miras-tereke, alacak-verecek, alım-satım ve vekil tayininden oluşan belgelerin yanısıra vasi tayini, ibra ve ıskat, görev tevcihi, evlenme-boşanma ve nafaka, emlâk ve emvalin fuzûlen zaptı, sulh, icar, vakıf ve tevliyet konularını da içermektedir. Müslümanlarla gayri müslimler arasındaki ilişkiler, daha ziyade ticaret ve gayrı menkul alış-verişi ile borç alıp verme şeklinde kendini göstermektedir. 1413 no'lu defterde hakim huzurunda nikah akdine çok az kayıtta rastlamaktayız. Bu kayıtlarda da nikahın vekaleten olduğunu görüyoruz. Buna karşılık boşanma ve nafaka davalarına daha fazla rastlamaktayız. Boşanma ile ilgili olarak kadın haklarının üst düzeyde olduğu gözümüze çarpmaktadır. Buluğa ermemiş bir yetimin veya akılca zayıf ve hasta olan bir kimsenin malını idare etmek için vasî tayin edilmiştir. Vasiler genelde birinci derece akrabalardan tayin edilir. Bu durum sosyal devlette yetimlerin himayesiz kalmamalarını sağlamakta ve hisselerine düşen eşya veya malların başkalarının ellerine geçmemesini de garanti altına almaktadır. İhtiyaç duyulduğunda müslümanlar vakıflar kurarak, vakıfların ayakta kalmaları için de bağ, bahçe ve para gibi mallar vakfederek gelir temini sağlanması amacında olmuşlardır."
