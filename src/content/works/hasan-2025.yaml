abstract: "Bu çalışma, İslam hukuku mirasına ait fıkhî bir el yazmasını ele almaktadır. İncelenen eser, tahâret, namaz, oruç, nikâh ve talâk gibi çeşitli fıkhî konulardaki ince meseleleri ele alması bakımından Hanefî mezhebine önemli bir katkı sunmaktadır. Araştırmacı, söz konusu el yazmasının nadir bulunan bir referans kaynağı olması sebebiyle önemini vurgulamaktadır. Ayrıca, müellifin fıkhî meseleleri açıklama yöntemini ve şer'î hükümlerin istinbâtına (hüküm çıkarımına) yönelik yaklaşımını titizlikle ortaya koymaktadır. Bununla beraber farklı görüşlerin münakaşası da yapılmıştır. Araştırmacı bu tahkik çalışmasında ince ilmî bir yöntem izlemiştir. Çalışmada, orijinal metinler karşılaştırılmış, metindeki hatalar düzeltilmiş ve anlaşılması güç fıkhî ifadeler açıklığa kavuşturulmuştur. Metnin tahkiki özenle sunulmuş, müellifin ele aldığı fıkhî bağlamlar detaylı bir şekilde incelenmiş ve metnin anlaşılmasını kolaylaştırıcı açıklamalar yapılmıştır. Sonuç olarak, bu araştırma derin fıkıh düşüncesini temsil eden söz konusu klasik fıkıh eserinin ehemmiyetini ortaya koymaktadır. Bu bağlamda, bu tür kıymetli eserlerin gün yüzüne çıkarılmasının, fıkıh literatürüne sağladığı ilmî zenginlik ve pratik faydalar açısından büyük bir gereklilik olduğu ortaya konulmuştur."
