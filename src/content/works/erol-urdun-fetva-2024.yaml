abstract: "Gelişen tıbbi uygulamalar, İslam hukuku alanında yeni meseleleri gündeme getirmiştir. Bu meseleler, farklı disiplinlerin konuyu birlikte değerlendirmesini gerekli kılmış ve kolektif içtihadın önemini daha görünür hale getirmiştir. Bu çalışmada, gerektiğinde bireysel içtihat yoluna da başvurmakla birlikte kolektif içtihat yöntemini de benimseyen ve biyofıkıh alanında ortaya çıkan güncel meselelere cevap arayan çağdaş fetva kurumlarından biri olan Ürdün Fetva Dairesi'nin tıbbi fetvaları incelenmektedir. Çalışma kapsamında fetvaların tercüme edilerek aktarılmasından ziyade benzer meselelerin belirli başlıklar altında tasnif edilmesi, verilen hükümlerde başvurulan delillerin ve kullanılan fetva metodolojisinin analiz edilmesi hedeflenmektedir. Araştırma üç ana bölümden oluşmaktadır. İlk bölümde Ürdün Fetva Dairesi'nin tarihçesi, kurumsal yapısı, fetva verme metodu ve hususen tıbbi fetvalarda kullandığı yöntem mevzu edilmektedir. İkinci ve üçüncü bölümlerde ise hayatın başlangıcı ve sonuna dair meseleler, beden üzerindeki tıbbi müdahaleler, meslek ahlakı ve tıbbi uygulamalara ilişkin çeşitli fetvalar tasnif edilerek incelenmektedir. Ayrıca benzer konularda Din İşleri Yüksek Kurulu'nun görüşlerine yer verilmekte ve iki kurumun yaklaşım biçimleri mukayeseli olarak değerlendirilmektedir. Çalışmada fetvaların dayandığı delillerin yanı sıra fetva verirken nasıl bir yol izlenildiğinin ortaya konulması hedeflenmektedir. Hükme ulaşılırken izlenen yöntem, kullanılan külli kaideler, maslahat ve zaruret ilkelerinin fetvalara etkisi de incelenmektedir. Bu çalışma sayesinde Ürdün Fetva Dairesi'nin tıbbi fetvalarının Türkçe literatüre kazandırılması, kurumun çağdaş tıbbi meselelere yaklaşımının ortaya konulması ve modern biyofıkıh tartışmalarında kullanılan yöntemlerin değerlendirilmesi hedeflenmektedir."
