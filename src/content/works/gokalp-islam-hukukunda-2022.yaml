abstract: "Bu çalışmada İslam hukukunda toplumsal güvenin tesisinde kamu ve özel hak ihlalleri neticesinde öngörülen cezalar incelenmiştir. Bu itibarla güven sarsıcı ve yıkıcı suçlar olan kasten adam öldürme, zina, iffete iftira, hırsızlık/sirkat, terör/hirabe gibi suç ve cezalar ele alınmıştır. Bunun yanında toplumsal refahı tesis etme adına İslam'ın temel rükünleri olan oruç ve hac ibadetlerinde oluşan ihlaller neticesinde öngörülen cezalar da işlenmiştir. Çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi ve araştırmanın sınırları ele alınmıştır. Birinci bölümde toplumsal güvenin önemi, toplumsal güvenin birimleri ve toplumsal güvenle ilişkili kavramlar irdelenmiştir. İkinci bölümde toplumsal güvenin dayanakları ve dış güvenlik konusu ele alınmıştır. Üçüncü bölümde ise toplumsal güvenin tesisinde İslam hukukunun rolü, İslam hukukunun güven hususunda işleyişi, toplumsal güveni sarsan yapılanmalar, bu yapılanmalara karşı hukukî önlem ve cezalar ele alınmıştır."
