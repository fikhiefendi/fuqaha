abstract: "Faizsiz bankacılık İslami prensiplere uygun bir şekilde fon toplayan ve bu fonları ihtiyaç sahiplerine kullandıran bir bankacılık türüdür. Bu bankacılığı klasik bankacılıktan ayıran en önemli özellik, kullandığı yöntemlerin İslamiyet?in yasaklarıyla sınırlandırılmış olmasıdır. Türkiye?de faizsiz bankacılık, Katılım Bankası adı altında faaliyet göstermektedir. İktisadi bir kuruluş olan bu bankalar faaliyetleri gereği bazı risklere maruz kalmaktadır. Bankalar bu risklere karşı önlem almak durumundadır. Bankalar, karşılaştığı bu risklerin ve belirsizliklerin olumsuz etkilerini azaltmak için risk yönetimine ihtiyaç duyarlar. Faizsiz bankalar kullandıkları faiz içermeyen yöntemler gereği faiz oranı riskinden uzakmış gibi görünürler. Ancak ikili bankacılık sisteminde aynı ekonomik çevre ve benzer müşteri profili nedeniyle faizsiz bankalar diğer risklerle birlikte faiz oranı riskine de maruz kalmaktadır. Zira klasik bankalarla rekabet halinde olan faizsiz bankalar kâr payı oranlarını faiz oranlarına yakın tutmaya çalışır. Türkiye?deki katılım bankaları için faiz oranı ? kâr payı ? mevduat ilişkisini inceleyen bu çalışmada klasik bankaların mevduat faiz oranlarının katılım bankalarının kâr payına ve mevduat miktarına etkisi analiz edilmektedir. Yapılan analiz ile faiz ve kâr payı oranları arasındaki ilişkiye ve katılım bankalarının mevduatlara vermiş olduğu kâr payı oranlarının katılım bankalarının mevduatlarına olan etkisi incelenmiştir. Ayrıca faiz oranlarının katılım bankalarının mevduatlarına olan etkisi ve faiz oranı ile kâr payı oranı arasındaki bir farkın katılım bankalarının mevduatına olan yansımaları araştırılmıştır. Elde edilen bulgulara göre, faiz ve kâr payı arasında pozitif yönde bir ilişki vardır. Ayrıca kâr payının ve faiz oranının katılım bankalarının mevduatına olan etkilerine bakınca hem kâr payının hem de faiz oranının katılım bankalarının mevduatını etkilediği sonucuna ulaşılmıştır."
