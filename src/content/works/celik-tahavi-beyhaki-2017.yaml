abstract: "Bu çalışmada Tahâvî'nin Şerhu Meani'l-Asar'ı ile Beyhakî'nin Ma'rifetü's-Sünen isimli eseri mukayese edilmiştir. Şerhu Meâni'l-Âsâr Tahâvî'nin, hadisler arasında gerçekte ihtilaf olmadığını isbat etmeye çalıştığı bir eser olması yanında Hanefî mezhebinin fıkhî görüşlerini hadislerle temellendirmeye çalıştığı önemli bir kaynaktır. Beyhakî, Şafiî'nin görüş ve delillerini bir araya getirmek için Ma'rifetü's-Sünen'i telif etmiş, bu eserinde Tahâvî'ye birçok konuda itirazlarda bulunmuştur. Ma'rifetü's-Sünen bu yönüyle Şerhu Meâni'l-Âsâr'a bir reddiye niteliği taşımaktadır. Tahâvî ve Beyhakî'nin söz konusu eserlerini ele aldığımız bu çalışma giriş ve üç bölümden oluşmaktadır. Girişte çalışmanın önemi, metodu ve kaynaklarından bahsedilmiş ardından kısaca Tahâvî ve Beyhakî'nin hayat ve eserlerine yer verilmiştir. Birinci bölümde tezin konusunu teşkil eden iki eser ele alınmıştır. Eserler, telif amacı, telif metodu ve kendisinden sonrakilere etkileri gibi konular açısından tahlil edilmiştir. İkinci bölümde, Beyhakî'nin eserinde Tahâvî'ye yöneltmiş olduğu tenkitler tasvirî bir anlatımla zikredilmiştir. Üçüncü bölümde ise söz konusu tenkid konularından altı tanesi, müelliflerden önce ve sonra yaşamış olan âlimlerin konuya ilişkin görüşleri de göz önünde bulundurulmak suretiyle mukayese edilmiş detaylı bir şekilde tahlil edilmeye çalışılmıştır."
