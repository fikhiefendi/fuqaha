abstract: "Çalışmanın amacı; Türkiye'de faaliyette bulunan altı katılım bankasının yıllara göre fon kaynak miktarlarını inceleyerek, hangi fon kaynağının daha önemli olduğunu ve belirlenen ağırlıklara göre hangi katılım bankasının hangi yılda fon kaynaklarını daha etkin kullandığını saptamaktır. Bu amaçla; çalışmada örneklem olarak Türkiye'de faaliyette bulunan 6 katılım bankası seçilmiştir. Bu bankalar; Albaraka Türk Katılım Bankası, Kuveyt Türk Katılım Bankası, Türkiye Finans Katılım Bankası, Ziraat Katılım Bankası, Vakıf Katılım Bankası ve Emlak Katılım Bankası'dır. Katılım bankaları fon toplama yöntemleri olarak geleneksel bankalar ile benzerlik gösterse de faizi devre dışı bırakarak kâr payını kullanması ile diğer bankalardan ayrılmaktadır. Katılım bankaları fon kaynaklarını elde ederken 5 hesap türü ile işlem yapmaktadır. Bu hesap türleri; özel cari hesaplar, katılım hesapları, tasarruf hesapları, yatırım hesapları ve kıymetli maden depo hesaplarıdır. Çalışmanın analizinde kullanılan hesap türleri ise; özel cari hesaplar, katılım hesapları ve kıymetli maden depo hesaplarıdır. Türkiye'de katılım bankalarını kullanan yatırımcıların yıllara göre hangi fon kaynaklarını tercih ettiği ve katılım bankalarında hangi fon kaynaklarını kullandığını inceleyen bir çalışmaya rastlanılmamıştır. Bu konunun araştırılmasının ve analiz edilmesinin, İslam iktisadî ve finansı alanına önemli katkı sağlayacağı düşünülmektedir. Çalışmada katılım bankalarına ait 2013-2022 yılları arasını kapsayan 10 yıllık fon kaynak miktarları kullanılmıştır. Ardından çok kriterli karar verme tekniklerinden SD ve WASPAS yöntemleri kullanılarak analiz çalışması yapılmıştır. SD yöntemi ile analizde kullanılan özel cari hesaplar, katılım hesapları ve kıymetli maden depo hesaplarının ağırlıkları saptanmıştır. SD analiz sonuçlarına göre; Türkiye'de yaşanan ekonomik gelişmelere bağlı olarak yıllara göre farklı hesap türlerinin ağırlık oranlarının fazla olduğu görülmüştür. WASPAS yöntemiyle ise önceden belirlenen ağırlıklar yardımıyla 6 katılım bankasının belirlenen zaman dilimindeki fon kaynak performansı ölçülmüştür. WASPAS analiz sonuçlarında ise tüm yıllarda Kuveyt Türk Katılım Bankası'nın diğer katılım bankalarına göre performansının daha iyi olduğu tespit edilmiştir. Kuveyt Türk katılım bankasının bu performansı; kuruluş yılı itibari ile en eski olması, Türkiye'deki katılım bankacılık sistemine öncülük etmesi, bankanın uygulamış olduğu ürün çeşitliliği, yurtiçinde ve yurt dışında etkin faaliyette bulunmaları gibi gerekçelere dayandırılabilir."
