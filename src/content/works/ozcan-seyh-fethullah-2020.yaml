abstract: "Bu çalışma, günümüzde halen ilim ve irfan yuvası olarak bölgeye hizmetlerde bulunmaya devam eden Ohin Medrese ve dergâhının kurucusu Şeyh Fethullah elVerkânisî'nin (v.1317/1899) ilmi hayatı ve Menasiku'l-Hacc ve'l-Umre adlı eserinin tahkik ve tahlili'nden ibaret bir çalışmadır. Şeyh Fethullah el-Verkânisî, Osmanlı devletinin son yüzyılında şark bölgesinde hayatını idame ettirmiş ilmi bir şahsiyet, kalemi güçlü meşhur bir âlimdir. ElVerkânisî, fıkıh alanındaki yetkinliğinin yanında yaşadığı bölge itibariyle muasırlarının pek yapmadığı, günümüze ulaşan ve ulaşmayan bir sürü eser kaleme almış, bu konuda sonraki nesillere ilham kaynağı olmuş ve eser yazma geleneği kendisinden sonra da devam etmiştir. Ohin Kütüphanesini el yazma eser zengini ilmi bir mekân haline getirmiştir. Adı geçen Kütüphanedeki nadide eserlerden biri de, Şeyh Fethullah'ın fıkıh ilminin önemli bahislerinden Hac ve Umre menasik'i konusundaki telifidir. Eser, kendisine has üslubu, kısa net ve öz oluşu bakımından önemlidir. Çalışmamızın birinci bölümünde Şeyh Fethullah el-Verkânisî'nin ilmi hayatına, üstat, talebeve eserlerine değinilmiştir. İkinci bölümünde eserin tahkikinde esas alınan nüshalar ve özellikleri, eserin ismi, müellife aidiyeti ve kaynakları, eserin içeriği ve yöntemi, eserde geçen kavramlar gibi başlıklar altında eserin tahlili yapılmıştır. Üçüncü ve son bölümde ise Menasiku'l-Hacc ve'l-Umre adlı eserin tahkiki yapılmıştır."
