abstract: "Ege Denizi'nin kuzeydoğusunda, Anadolu sahillerine yakın, stratejik bir öneme sahip olan Midilli, tarih boyunca birçok devletin ilgi odağı olmuştur. Eski çağlardan Osmanlı'ya kadar Persler, Romalılar, Bizanslılar, Venedikliler, Cenevizliler gibi farklı devletlerin egemenlik mücadelelerine sahne olmuş bir adadır. 1462 yılında Fatih Sultan Mehmed'in Midilli'yi fethedip Osmanlı topraklarına katmasıyla imparatorluğun önemli bir sancağı haline gelmiştir. Osmanlı hakimiyetindeki Midilli, sadece bir deniz üssü değildi, aynı zamanda zeytin ve zeytinyağı sabun üretimi gibi ekonomik faaliyetleriyle de dikkat çekmiştir. Bu tez XVIII. Yüzyıl sonlarında Osmanlı hakimiyeti altındaki Midilli adasının durumunu, özellikle 164 Numaralı Midilli Şer'îyye üzerinden ele almayı amaçlamaktadır. Şeri'yye sicilleri, Şer'î mahkemelerde tutulan kayıtlar olarak; adanın sosyo-ekonomik ve idari yapısı ve hukuki düzenlemeleri hakkında eşsiz bilgiler sunmaktadır. Bu çalışmada adanın, zeytin üretimine dayalı ekonomisi, tereke defterleri, vergi kayıtları, vakıf sistemi ve Müslüman- Gayrimüslim grupları arasındaki iletişimler ayrıntılı bir şekilde incelenmiştir. Ayrıca Şer'îyye sicillerinde yer alan evlenme-boşanma, mülkiyet ve miras da'vâları, adanın toplumsal yapısını ve günlük yaşamına dair önemli ipuçları sunmaktadır."
