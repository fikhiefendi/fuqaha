abstract: "Tezde İslam toplumunun egemenliği altında yaşayan gayr-i müslimlerin hakları ve sorumluluklar Hanefi mezhebinin ilk dönem eserleri kapsamında incelenmektedir. Tezin hazırlanmasında tümevarım yöntemi metodu kullanılmıştır. İslam toplumunun egemenliği altında yaşayan gayr-i müslim unsurlar ticari faaliyetlerinin bazılarında Müslümanların sahip olmadıkları başka haklara da sahip oldukları görülmektedir. Zimmîler, özel hayatlarında Müslümanların sahip olmuş olduğu haklardan başka haklara sahiptirler. Zimmîler, harac, cizye ve gelir vergisi gibi ekonomik konuların yanı sıra sosyal hayata ilişkinde sorumlulukları bulunmaktadır."
