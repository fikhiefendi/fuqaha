abstract: "Tezimizde, Şehâbeddin Karâfî'nin, Furûk adlı eseri, Furûk adlı eserdeki tasavvufi konuların fıkhı boyutu ve analizinin yapıldığı bölümün daha iyi anlaşılması için çalışılmıştır. Günümüzdeki benzer konulara ışık tutulması, yeri geldiğinde çözüm bulunmasına yardımcı olması amaçlanmıştır. Bunlarla beraber fıkıh ve tasavvuf arasındaki ilişki ve bağlantıların daha iyi anlaşılması için gayret gösterilmiştir. Bu sayede tasavvuf, ahlak ve fıkıh meselelerinin tatbikinin doğru ve kolay olmasına yardımcı olması için gayret gösterilmiştir. Çalışmamız Envârü'l-burûḳ fî envâʾi'l-furûḳ isimli eserin dördüncü bölümündeki maddeler halinde yer alan“farklar”diye adlandırılan başlıklarda işlenen konulardan olmuştur. Maddeler halindeki farklar dil yönünden titizlikle incelenip tercüme edilmiştir. Sonrasında 'Fark'lardaki konular tek tek ele alınmış, gerek Karâfî'nin görüşleri olsun gerek eserdeki atıf yapılan kişilerin görüşleri olsun fıkhî açıdan tek tek incelenmiştir. Karâfî yer yer kendi görüşlerini sunmuş ve yer yer de atıflar yaparak sunduğu görüşlerden birine uyduğunu veya bu görüşlerden uygun ya da uyulabilir olanları bizlere sunmuştur. Çalışmamızda tasavvufi konuların fıkhî boyutunun olduğunu hatta durum, şart, konum ve kişiye göre hükmünün de değişebildiği tespit edilmiştir."
