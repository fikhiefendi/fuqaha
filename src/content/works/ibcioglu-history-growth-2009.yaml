abstract: "Bu tez Türk bankacılık sisteminde Katılım bankacılığı olarak bilinen niş sektörün daha yakından incelenmesi amacıyla yazılmıştır. İlk bölümde, İslami bankacılığın özet tarihi hakkında bilgiler sunulmuştur, akabinde temel prensipler ve ürünler anlatılmıştır. Devam eden bölümlerde, Türkiye'deki Katılım bankacılığının gelişimi incelenerek, Katılım bankalarının ticari bankalara kıyasla maruz kaldıkları risk ve yönetimi açısından olumlu ve olumsuz yönleri verilmiştir."
