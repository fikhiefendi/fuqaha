abstract: "Osmanlı Devleti, kurulduğu dönemden itibaren İslam'ın koruyuculuğunu üstlenmiş ve bu yolda mücadele etmiştir. Geniş bir coğrafyada söz sahibi olmuştur. Dolayısıyla Osmanlı Devleti'nde gerçekleşene hukukla alakalı çalışmalar büyük bir bölgede etkili olmuştur.Osmanlı Devleti'nde Tanzimat'tan sonra başlayan kanunlaştırma hareketlerinden biri 8 Muharrem 1336 (25 Ekim 1917) tarihli Hukuk-u Aile Kararnamesidir. Osmanlı Devleti'nde yaklaşık bir buçuk yıl yürürlükte kalmasına rağmen önemli bir etkiye sahip olmuştur.Çalışmamız, Osmanlının son dönemlerinde hukuk alanında gelinen noktada yapılan bazı kanunlaştırma çalışmalarına yöneltilen eleştiri, bunun sebeplerini ve bunların değişik açılardan değerlendirilmesi şeklinde olacağından, o dönemde yapılan hukuki çalışmalarda nelerin etkili olduğunu, bunların nasıl ve ne şekilde bir tepkiyle karşılandığını görmemizi sağlayacak olması açısından önemlidir.Tanzimat sonrası hukuk alanındaki çalışmalardan biri olan Hukuk-i Aile ve Usul-i Muhakemat-ı Şer'iyye Kararnameleri'ne değişik taraflardan, muhtelif sebepler dolayısıyla eleştiriler yöneltilmiştir. Özellikle İslamcılık fikrine sahip âlimler tarafından yapılan eleştiriler Kararnamelerin ilgasında büyük etkiye sahiptir.Biz çalışmamızda bu eleştirileri ve özellikle Sadreddin Efendi'nin yapmış olduğu eleştirileri İslam hukuku açısından değerlendirdik ve müellif hakkında bilgi vermeye çalıştık."
