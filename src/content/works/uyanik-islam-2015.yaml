abstract: "Tarih boyunca suç sayılan belirli fiiller bütün toplumlar ve inançlar tarafından yasaklanmıştır, yasağı çiğneyenler de cezalandırılmıştır. Bu cezalardan birisi de hapistir. Tarih'in kaydettiği en eski cezalardan birisi olan hapis; başta Hititler, Asurlar, Persliler, Yunanlılar, Mısırlılar, Bizanslar, Araplar, Eski Türkler… olmak üzere bütün medeniyetlerde uygulanmış bu uygulama günümüzde de devam etmektedir. Hapis cezası, İslam Hukukunda da var olan hürriyeti bağlayıcı cezalardan birisidir. İslam ceza hukukunda suçlar, yaptırımın ağırlığına veya bunların ana kaynaklarda (naslarla) belirlenmiş olup olmamasına göre had, kısas, ta'zîr şeklinde üçe ayrılmaktadır. Hapis, ta'zîr kısmına girmektedir. Kur'ân-ı Kerim'de hapis cezasını öngören açık bir ayet bulunmasa da, hapsin varlığına işaret eden örneklerden söz edilmektedir. Hz. Peygamber döneminde de günümüzdeki şekliyle hapis cezası ve hapishane mevcut değildir. İslam Tarihinde Raşîd Halifeler ve Emeviler, Abbasiler, Fatımiler, Memluklular, Timurlular ile sonraki İslam devletleri hapis cezasına ve dolayısıyla hapishaneye başvurmuşlardır. Osmanlı da başlangıçta hapis cezasını tam ve asli bir ceza olarak uygulamamış ancak Tanzimattan itibaren asli bir ceza olarak uygulamaya başlamıştır. İslam Hukukunda hapis cezası, maksadı göz önünde bulundurulduğunda ihtiyati tedbir ve ceza şeklinde iki ana bölüme ayrılmaktadır. Süresi açısından da müddeti belli olan ve olmayan, süresi belli olan hapis çeşidi de muvakkat ve müebbet hapis şeklinde ikiye ayrılmaktadır. Hapis cezasını sona erdiren başlıca sebepler ise; ölüm, akıl hastalığı, af, tövbe (pişmanlık), zaman aşımı, sürenin bitmesi ve diğer sebeplerdir. Suç işlemiş olsa da mahkumun bir takım hakları vardır. Bunun için mahkumun insan olduğunun unutulmaması ve insani haklarından yararlandırılması gerekir. Hapis cezasının uslandırıcı yönü her zaman beklendiği gibi olmasa da suçu önleyici fonksiyonu inkar edilemez. Anahtar kelimeler: İslam ceza hukuku, suç, ceza, ta'zir, hapis, hapishane, mahpus"
