abstract: "Günümüzde hayvan beslemesinde kullanılan yem ve yem katkı maddeleri birçok açıdan güncel tartışmalara sebebiyet vermektedir. Gelişen teknoloji ve bilgi birikimindeki artış ile hayvanlarda entansif üretim yapılmakta ve bu üretimde hayvanların yüksek kar amacıyla iyi yaşam düzeyinde en yüksek verimi amaçlanmaktadır. Bu felsefe güdülürken insan ve sağlık açısından zararlı maddelerin kullanımı veya kullanılan maddelerin daha sonradan zararlarının ortaya çıkması birçok tartışmayı da beraberinde getirmiştir. Bunun yanı sıra hayvan beslemede kullanılan maddeler ve uygulamalar bazı dini görüşler için de sorun teşkil etmektedir. Bu çalışmada kanatlı hayvan beslemesinde kullanılan maddelerin ve uygulamaların, fıkhen sakınca bulundurup bulundurmadığı ve insan sağlığına etkileri bakımından fıkhi durumunun değerlendirilmesinin yapılması amaçlanmaktadır."
