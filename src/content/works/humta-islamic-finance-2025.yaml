abstract: "İslami finans, uluslararası finans alanında küresel büyüme görmüştür ve belirli ülkelere odaklanmıştır. İslami finansın son zamanlarda yılda yaklaşık %20 oranında büyümesi, kısmen adalet, katılım ve sahiplenme ilkeleri sayesinde, kalıcılığının ve geniş çekiciliğinin kanıtıdır. İslami finansın, risk paylaşımına verdiği önem, aşırı risk maruziyetine getirdiği kısıtlamalar ve somut ekonomik faaliyetlerle olan yakın bağlantısı nedeniyle teorik olarak şoklara karşı dirençli olduğu söylenebilir. Ekonomik kalkınma, bir ekonominin hayatta kalması için gerekli olan çok boyutlu bir süreçtir. Bir ekonominin gerçek ulusal gelirinin zamanla arttığı uzun vadeli, sürekli bir süreçtir. Yirmi birinci yüzyılda, gelişmekte olan ekonomilerin birincil hedefleri daha yüksek ekonomik kalkınmanın hayatta kalması ve sürdürülebilirliğidir. Bu çalışma, İslami finans ile ekonomik kalkınma arasındaki bağlantıyı inceler; burada İslami finans, İslami bankacılık, İslami sermaye piyasaları (kira sertifikası) ve İslami sigorta (takafül) ile ölçülür. Buna karşılık, ekonomik kalkınma, Birleşmiş Milletler Kalkınma Programı (UNDP) tarafından geliştirilen İnsani Kalkınma Endeksi ile ölçülür. Malezya, Endonezya, Kuveyt, Katar, Nijerya, Suudi Arabistan, Umman ve Türkiye gibi önde gelen İslami finans sektörü ülkeleri bağlamında 2015-2021 yılları arasında panel verileri kullanılarak, İslami finans ile ekonomik kalkınma arasında çeşitli göstergelerle ölçülen ilişki incelenmiş ve bu ülkeler için sektörü genişletmeye dair geçerli ve yenilikçi sonuçlar elde edilmiştir. Bu araştırma, her modelin sonuçlarını sonuçlandırmak için üç farklı Sıradan En Küçük Kareler Regresyon Modeli, En Küçük Kareler Kukla Değişken Etki Modeli ve Rastgele Etki Modeli kullanmıştır: a) Bir taraftan, sıradan en küçük kareler regresyon modelleri, doğrudan yabancı sermaye çıkışı ile İslami banka kârlılığı ve sukuk arasında negatif ve anlamlı bir ilişki göstermektedir. Diğer taraftan, doğrudan yabancı sermaye çıkışı, takafül ve kârlılık ile sukuk arasındaki çarpan etkisiyle pozitif ve anlamlı bir şekilde ilişkilidir. b) Rastgele etkili regresyon modeli, takaful ile insani gelişme endeksi (Ekonomik Kalkınma) arasında pozitif ve anlamlı bir bağlantı olduğunu göstermektedir. Sukuk, İslami bankaların karlılığı yoluyla düzenleyici etki yoluyla insani gelişme endeksi ile pozitif ve anlamlı bir ilişkiye sahiptir. Giriş yapan doğrudan yabancı yatırım, hükümet verimliliğinin düzenleyici etkileri yoluyla ekonomik kalkınma ile pozitif ve önemli bir bağlantıya sahiptir. c) En küçük kareler kukla değişken regresyon modeli, İslami bankacılık ile Sukuk arasında gayri safi yurtiçi hasıla (GSYİH) üzerinde pozitif ve anlamlı bir ilişki olduğunu göstermektedir. Aynı zamanda, takaful GSYİH ile anlamsız bir şekilde ilişkilidir. Döviz kuru ve enflasyon, siyasi istikrarın düzenleyici etkisi aracılığıyla GSYİH ile pozitif ve önemli bir ilişkiye sahiptir. Malezya, Endonezya, Kuveyt, Katar, Nijerya, Suudi Arabistan ve Umman'da İslami bankacılığın GSYİH'ye katkısı, Türkiye'den daha düşüktür. Bu durum, diğer değişkenler sabit tutulduğunda, İslami bankacılığın Türkiye'nin GSYİH'sine katkısının diğer ülkelerden daha fazla olduğu anlamına gelmektedir. Bu sonuçlar, belirtilen ülkeler bağlamında İslami finans sektörünü geliştirmeye yönelik geçerlidir."
