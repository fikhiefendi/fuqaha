abstract: "“İbadetlerde Kıyas”adlı bu çalışma iki bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı ve kaynaklarına ilişkin bilgiler yer almaktadır. Burada çalışmanın amacı ve hangi kaynaklara başvurulduğu belirtilmektedir. Birinci bölümde önce ibadet kavramı tanımlanıp dar ve geniş anlamları açıklanarak ibadet-taabbüdîlik ilişkisine yer verilmiştir. Ardından kıyas kavramı tanımlanmış, ilk dönemlerde kıyasın nasıl ve hangi anlamlarda kullanıldığı açıklanmaya çalışılmış, kıyası kabul edenlerin ve etmeyenlerin delilleri sıralanıp kıyasın fonksiyonu ele alınmış ve ardından kıyasın rükünleri ve şartları incelenmiştir. İkinci bölümde ibadetlerde kıyasın uygulanmasında ihtilafın sebepleri açıklandıktan sonra ibadetlerde kıyasın varlığı konusunda tartışmalara yer verilmiştir. Hanefîler, teknik olarak ibadetlerde kıyası kabul etmemektedirler ancak füru eserlerine baktığımızda ibadetlerde kıyas yapıldığının örneklerini bulmaktayız. Çalışmanın devamında ibadetlerde kıyasın uygulamadaki örnekleri üzerinde durulmuştur. İbadetlerin asıllarıyla alakalı bir tartışma bulunmamakla beraber detaylarına indiğimizde gerek tanımlardan kaynaklanan gerekse yöntemsel farklılıklardan dolayı ibadetlerde kıyas olduğu ya da olmadığı yönünde tartışmalara rastlamaktayız. Çalışmada ayrıca örnek uygulamalardaki yansımalar ele alınarak, incelenen ibadetlerde kıyası kabul edenler ve kabul etmeyenlerin görüşleri delilleriyle ele alınmıştır."
