abstract: "Tarihte, hükümdarlar çeşitli sebeplerle birtakım kurullara danışmıştır. Devletlerin yapısına bağlı olarak, bu kurulların bir kısmı yasama ve yargı alanlarında yetki sahibiyken diğer bir kısmı yalnızca hükümdarlara danışmanlık etmiştir. Günümüzde meclisler ya geçmişten gelen birikime dayanılarak ya da deneme yanılma yolu ile oluşturulmaktadır. Türkmenistan Halk Maslahatı, kendi tarihi köklerine dayandırılarak oluşturulan bir meclistir. Başka bir deyişle, Türk tarihinin kadim meclisleri günümüzün koşullarına uyumlandırılarak Halk Maslahatı meydana getirilmiştir. Halk Maslahatı başta yasama, yürütme ve yargı mensuplarının olmak üzere toplumun tüm kesimlerinden bireylerin katılmasıyla yılda bir kez toplanmaktadır. Bu meclisin de etki ve katkısıyla Türkmenistan, kendi demokrasi yolunu alışılagelmişin dışında belirlemiştir."
