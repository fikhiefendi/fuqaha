abstract: "Bu çalışma satım ve kira gibi ivazlı akitleri kurmak ve istekliler arasında en yüksek bedeli önerileni belirlemek için kullanılan müzâyede (açık artırma) yönteminin İslam hukuku açısından değerlendirilmesidir. Tarihi M.Ö. 5. asra kadar götürülen müzâyede geçmişte birçok toplum tarafından kullanılmıştır. İslamiyet geldikten sonra Müslümanlar tarafından kullanılmaya devam edilmiştir. Klasik İslam hukuku kaynaklarında çoğunlukla cebrî icra yoluyla haczedilen malların satışlarında borçlu ve alacaklıların maslahatı göz önünde tutularak müzâyede yönteminin kullanılması gerekli görülmüştür. Müzâyede sayesinde satış konusuna olan rağbetin artması ve neticede daha fazla yarar sağlanması hedeflenmiştir. Müzâyede günümüzde hem özel kişi ve kuruluşlar hem de kamu kurum ve kuruluşları tarafından birçok alanda uygulanmaktadır. Çoğunlukla satım akitlerinde kullanılmakla birlikte kira, trampa gibi akitlerde de kullanılmaktadır. İslam hukuku açısından ilke olarak mübah kabul edilen akitlerde müzâyedenin kullanılmasında sakınca görülmemektedir. Bununla birlikte İslam hukuku, müzâyedecinin neceş ve tedlis gibi hileler yapmasını ve aynı şekilde isteklilerin belirli bir fiyattan sonra fiyat artırmamak üzere kendi aralarında anlaşmaları gibi usulsüzlüklere başvurmasını yasaklamıştır."
