abstract: "Bu tez; Osmanlı Devleti'nin onuncu Şeyhülislamı olan, 16. yy Osmanlı Şeyhülislâmlarından Sa'di Sadullah Çelebi'nin yaşadığı dönemin tarihsel arka planı, Sa'di Çelebi'nin eserleri, fıkhi görüşleri ve fetvalarının çevrim yazısı konularından oluşmaktadır. Araştırma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde dönemin tarihsel arka planından bahsedilmektedir. Birinci bölümde şeyhülislamlığın geçirdiği tarihi süreç ve Sa'di Çelebinin'nin hayatı, eserleri ve şahsiyeti incelenmiştir. İkinci bölümde ise Sa'di Çelebi'nin fetva mecmuasının çevrim yazısı bulunmaktadır. Sonuç bölümünde ise mecmua hakkında genel bir değerlendirme yapılarak fetvaların orijinal metni eklenmiştir."
