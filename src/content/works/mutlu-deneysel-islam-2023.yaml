abstract: "Nörofinans; finansal kararların ardında yatan nedenleri nörobilim, finans, biyoloji ve psikoloji teorileri aracılığıyla anlamaya çalışan çoklu disipliner bir araştırma alanıdır. İslami finans, Müslüman bireylerin finansal meselelerde ihtiyaç duyduğu kavram ve kurumları İslam ve İslami ilkeler açısından inceleyen araştırma alanıdır. Bu araştırmanın amacı, dini inancın finansal karar verme sürecindeki rolünü nörofinans teorisi aracılığıyla incelemektir. Bu amaç doğrultusunda, dini mensubiyetini İslam olarak ifade eden 12 gönüllü katılımcı fMRG (fonksiyonel manyetik rezonans görüntüleme) cihazı aracılığıyla gözlemlenmiştir. Deneysel ödüller herhangi bir finansal cezai yaptırım ve risk içermeyecek biçimde sunulmuştur. Deney katılımcılarına, deneysel çekim başlamadan önce finansal ödülleri kabul etmeleri durumunda deney biter bitmez bunları nakit olarak alacakları ve bu ödülün dini statüsü gereği manevi mesuliyetinin tamamıyla kendilerine ait olduğu defalarca ifade edilmiştir. Katılımcıların deney boyunca sergiledikleri beyin aktivasyonları deneysel MR görüntüleri aracılığıyla, ödülleri gördükleri ve değerlendirdikleri sürelerdeki nörobiyolojik aktivasyonları açısından karşılaştırmalı olarak analiz edilmiştir. Deney ödülleri, 500 TL tutarında 10 adet haram ve 500 TL tutarında 10 adet helal olmak üzere 1000 TL tutarında 20 adet risk ve finansal ceza içermeyen nakit finansal ödüllerden oluşmuştur. Katılımcıların ana akım ekonomi alanyazınına göre bütün pozitif ve risk içermeyen finansal ödülleri kabul etmesi ve söz konusu ödüllere nörobiyolojik açıdan ödül reaksiyonu sergilemesi beklenmekteydi fakat katılımcılar“haram”olarak tanımlanan finansal ödülleri almayı kabul etmemiştir. Katılımcıların haram olarak tanımlanan ödülleri gördükleri süre ile helal olarak tanımlanan ödülleri gördükleri süre kıyaslandığı zaman sağ posteriour insula bölgelerinde anlamlı nöral aktivasyon sergiledikleri görülmüştür. Finansal açıdan pozitif ve risk içermese dahi dini açıdan“haram”olarak ifade edilen finansal ödülleri kabul etmemişlerdir. Haram finansal ödülleri görsel olarak algıladıkları anda nörobiyolojik açıdan hoşnut olmama tepkisinden kaynaklandığı öngörülen sağ posterior insula aktivasyonu sergilediği gözlemlenmiştir. Bu çalışmanın alanyazında dini motivasyon ve finansal karar verme etkileşimini MR cihazında araştırması açısından öncülük edeceği düşünülmektedir."
