abstract: "İnsanlar yaradılışları gereği sosyal varlıklar olduğundan belli ihtiyaçları, hakları ve sorumlulukları bulunmaktadır. Bu akış içerisinde başka bireyler ve topluluklarla etkileşim halinde olmak, muhtemel çatışma ve uyumsuzluklara zemin hazırlamaktadır. Bu nedenle insanların meydana getirdiği toplulukların, yine insanların koydukları hukuk normlarıyla düzene kavuşması zaruri olmaktadır. Bu çalışmanın ilk bölümünde; hukukun düzen işlevinin temelini oluşturan formalizm konusuna, kavramın hukuk normlarına olan etkilerine ve Türk Hukuk Doktrininde formalizmin uygulandığı alanlardan örneklere yer verildi. Çalışmanın ikinci bölümünde ise; İslam Hukuk normlarının koyduğu sınırlardan yine İslam Hukuk normlarına uygun yöntemlerle çıkış yol= bulma manasına gelen, hile-i şer'iyye konusu ele alındı. İslam Hukuk âlimlerinin konu hakkındaki görüşlerine, mezhep imamlarının hükümlerine ve delillerine değinilerek, İslam Hukuk Doktrininde tartışılan hile-i şer'iyye örneklerine yer verildi. Üçüncü ve son bölümde ise; formalizm uygulamasının İslam Hukukundaki yerine ve bu uygulamanın hile-i şer'iyye bağlamındaki tezahürlerine yer verilerek değerlendirmeler yapıldı."
