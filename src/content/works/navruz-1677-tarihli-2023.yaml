abstract: "Yüksek lisans tezi olarak incelediğim 23 Numaralı Konya Kadı Sicili, Ağustos 1677'den Aralık 1677'ye kadar olan dönemi kapsamaktadır. Ne yazık ki metnin ilk sayfaları yıpranma nedeniyle okunamamaktadır. Bu metin, Osmanlı Padişahı IV. Mehmed döneminde Konya tarihine ışık tutan birinci elden bir belgedir. Bu metinden vergilendirme, boşanma, mirasın taksimi, nafakanın tespiti, adi suçlar, vakıflar, mal satışı gibi konularda Konya İslam Mahkemesine başvuru yapıldığı anlaşılmaktadır. Bu nüshada zimmi-Müslüman ilişkilerine ışık tutan birçok belge bulunmaktadır. 1677'de Konya'da Ermeniler, Rumlar ve at yetiştirmekle görevli Atçekenlerin de bulunduğu belgelenmiştir. Ancak daha çok Müslümanların Konya mahkemesini kullandıkları ortaya çıkmaktadır."
