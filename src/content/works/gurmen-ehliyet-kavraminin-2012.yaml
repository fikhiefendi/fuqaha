abstract: "Ehliyet kavramı hukuki bir terimdir. Bu kelimeyi biz kaynaklardaaraştırdığımız zaman çeşitli tariflerini görmekteyiz. Genel manada ehliyetkişinin dini hukuki hükümlere muhatap olmaya elverişliliği anlamınagelmektedir. Ehliyet sözlükte ?yetki, elverişlilik, liyakat, yeterlilik.'' gibianlamlara gelir. Bir iş için uygun olma, kifayet sahibi, yeterli ve layık olmamanalarına gelmektedir. İnsan sosyal bir varlıktır ve insanlar her yöndensürekli münasebet halindedir. İnsanların münasebetleri esnasındaki işlemleringeçerliliği her iki tarafın ehliyetine, o işlem için yeterli olup olmamasınabağlıdır.İslam Hukukunda ise `'ehliyet kanun koyucunun şahısta takdir ettiği veonu bir hukuki hitaba muhatap olmaya salih hale getiren vasıftır.''Bir başkadeyişle şari'in bir kişide takdir ettiği onu din ve hukukun muhatabı olmayauygun bir kişi haline getiren vasıflardır.Ehliyet konusu genel manada hukuk açısından ele alınmaktadır. Amakonu insan olduğundan İslam Hukuku açısından incelendiğinde ibadetlerkonusu da insanları ilgilendirdiği için bu açıdan da inceleme konusuolmaktadır. Çünkü insanların bir taraftan Allah'la diğer taraftan diğerinsanlarla münasebet halindedir. Bu münasebetler esnasında insanlar herzaman olumlu davranamayabilir ve bundan dolayı bazı problemler ortayaçıkabilir. Bu problemlerden dolayı taraflardan birine ceza vermek gerekebilir.vKişilere yapmış olduğu bu hatadan dolayı ona ceza verilip verilmeyeceği de yineo kişinin ehliyetine bağlıdır.Tezimizin konusu olan ehliyet kavramını kısaca özetlemeye çalıştık. Özettede belirttiğimiz gibi Kişinin şahıs olarak varlığının yanında bazı ehliyetlere desahip olması gerekmektedir. Tabi bununla beraber bazen sadece onun varlığı,hayatta olması hatta anne karnında bile olması yeterli olmaktadır. Özetleehliyet cenin döneminden itibaren gençlik döneminde, orta yaş ve yaşlılıkdönemindeki insanın haklarını, bu haklara sahip olma yetilerini inceler.Anahtar kelimler: İslam, Hukuk, Modern"
