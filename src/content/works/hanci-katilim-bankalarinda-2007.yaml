abstract: "lk çaglardan günümüze toplumlar sürekli can, mal ve mülkiyet kayıplarına yol açan risklere maruz kalmıslar ve bu risklerden korunmak için bugün sigorta olarak adlandırabilecegimiz bir çok riskten korunma metotlarına basvurmuslardır. Türkçe karsılıgı güven olan sigorta ise bireylerin ve isletmelerin karsı karsıya bulundugu ve kendi imkanları ile karsılamakta zorluk çekecekleri her türlü riskleri azaltmak ve riskin gerçeklesmesi durumunda ortaya çıkan zararları yayarak yok etmek ve paylasmak amacıyla örgütlenmis toplumsal bir kurumdur. Sosyal faydalarının yanında ekonomik açıdan da faydası büyük olan sigortacılık sektörü bugün ekonomilerde bacasız bir endüstri haline gelmis ve sermaye piyasasının ana unsurlarından birisi haline gelen sektör ülkemizde istenilen düzeyde olmasa da hızlı bir gelisim göstermektedir. Ülkemizde sigortacılık sektörünün gelisimini engelleyen ekonomik, sosyal ve hukuksal birçok çesitli nedenler vardır. Bu nedenlerden bir tanesi de halkımızın dini inanısları ve toplumsal yasamdır. slam'ın ilk yıllarından itibaren Müslüman toplumlarda modern ticarî sigorta sirketlerinin sundugu hizmetler, dinî sosyal güvenlik sistemleri olarak nitelendirebilecegimiz, zorunlu veya gönüllü kuruluslar tarafından karsılanmıs ve bu yüzden modern anlamda sigorta sistemine ihtiyaç duyulmuyordu. Fakat tarihi süreç içerisinde meydana gelen gelismeler ve degismeler bu müesseselerin önemini yitirmesine neden olmustur. Bundan dolayı bireyler ve toplumlar hayatta karsılasabilecekleri risklerin kötü sonuçlarından kendilerini korumak için sigortacılık faaliyetlerine yönelmislerdir. Günümüzde ise modern ticarî sigorta slâm literatüründe karsılıklı koruma anlamına gelen takaful islemleri olarak yürütülmektedir. Biz çalısmamıza konu olan takaful islemlerinin katılım bankalarımızda uygulamasına yönelik üç modelin uygulanabilecegi sonucuna ulastık. Fakat ülkemizde takaful islemleri katılım bankalarının yanı sıra özel isletmeler ve kamu idaresi tarafından da yerine getirilebilecegi düsüncesindeyiz. Kamu özel isbirligi içerisinde kurulacak kurumlarda takaful uygulamalarının sonuçları daha büyük ve basarılı olacaktır."
