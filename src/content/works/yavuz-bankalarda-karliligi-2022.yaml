abstract: "Bankacılık sektörü finansal sistem içinde oldukça önemli bir yere sahiptir. Bütün işletmelerde olduğu gibi bankacılık sektöründe de karlılık bankaların devamlılığı için gerekli unsurlarındandır. Bankaların karlılığı banka faaliyetlerinin devamı ve ülkelerin ekonomileri için önemli bir olgudur. Karlılıkta azalma meydana gelmesi veya bankaların zarar etmeleri ekonomiyi, üretimi, istihdamı vb. olumsuz etkiler. Dolayısıyla bankacılık sektöründe karlılığın belirleyicilerinin saptanması ve yakından izlenmesi çok önemli bir konudur. Bankacılıkta karlılığın belirleyicilerinin bir kısmı banka iç yapısından kaynaklanan kontrol edilebilen değişkenler grubunda iken, bir kısmı genel iktisadi yapıdan kaynaklanan kontrol edilemeyen değişkenler grubunda yer almaktadır. Çalışmada ekonominin vazgeçilmez sektörü olan bankacılığın karlılığı konusu ele alınmıştır. Bankanın tarihsel gelişimi, banka türleri, karlılık gibi kavramlar eşliğinde ticari ve katılım bankalarının karlılıklarını belirleyen faktörler karşılaştırılmıştır. Analiz sürecinde dünyada katılım bankacılığının %85 inin yapıldığı ve literatürde Q.İ.S.M.U.T ülkeleri olarak yer alan Katar, Endonezya, Suudi Arabistan, Malezya, Birleşik Arap Emirlikleri ve Türkiye'de faaliyet gösteren bankaların ekonomik verileri kullanılmıştır. Analizde 66 adet ticari banka ile 32 adet katılım bankası olmak üzere toplam 98 bankanın 2011-2016 yılları arasındaki finansal rasyolarına Bankfocus veri tabanı programı aracılığı ile ulaşılmıştır. Çalışmanın amacı, Q.I.S.M.U.T. ülkelerinde banka karlılığını etkileyen unsurların araştırılması ve sonuçlara dayalı olarak politika önerilerinin geliştirilmesine yardımcı olmaktır. Yapmış olduğumuz analiz 2011-2016 yılları arası 6 yıllık süreçte, ticari bankalarda aktif karlılık değişkeni için oluşturulan panel regresyon modelleri içerisinde en doğru modelin ilk fark modeli ve en uygun etki türünün de bireysel etki olduğunu göstermiştir. Katılım bankalarında ise en doğru modelin sabit etki modeli uygun etki türünün ise bireysel etki olduğu görülmüştür. Ticari bankalarda ilk fark modeline göre net krediler/toplam aktifler, net krediler/mevduatlar ve fonlar, maliyet/gelir, net faiz geliri/ortalama aktifler, diğer işlem gelirleri/ortalama aktifler ve takipteki krediler/brüt krediler değişkenleri aktif karlılık üzerinde istatistiksel olarak anlamlı etkiye sahiptir. Katılım bankalarında ise maliyet/gelir, net kar payı geliri/ortalama aktifler, diğer işlem gelirleri/ortalama aktifler, takipteki krediler/brüt krediler, özkaynaklar/toplam aktifler ve özkaynaklar/borçlar değişkenleri aktif karlılık üzerinde istatistiksel olarak anlamlı etkiye sahiptir. Ticari ve katılım bankalarının her ikisinde de özsermaye karlılığı değişkeni için en doğru model ilk fark modeli ve en uygun etki türü de bireysel etkidir. Her iki bankada ilk fark modeline göre maliyet/gelir, net faiz gelirleri/ortalama aktifler, diğer işlem gelirleri/ortalama aktifler, takipteki krediler/brüt krediler istatistiki olarak anlamlı etkiye sahiptir. Ticari bankalarda net faiz marjı değişkeni için oluşturulan tüm panel regresyon modelleri içerisinde en doğru model ilk fark modeli ve en uygun etki türü de bireysel etkidir. Katılım bankalarında net kar marjı değişkeni için ise en doğru model sabit etki modeli ve en uygun etki türü de zaman etkisidir. Her iki bankanın kendisi için uygun olan modellere göre Net Krediler/Toplam Aktifler, Dönen Varlıklar/Mevduat ve Fonlar, Net Krediler/Mevduat ve Fonlar, Özkaynaklar/Toplam Aktifler, Özkaynaklar/Borçlar değişkenleri istatistiki olarak anlamlı etkiye sahiptir."
