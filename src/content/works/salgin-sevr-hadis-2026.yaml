abstract: "Bu çalışma, erken dönem fakihlerinden Ebû Sevr el-Bağdâdî'nin hadis temelli içtihat anlayışını ve onun rivayet-dirayet dengesi üzerine kurulu yaklaşımını günümüz fıkıh tartışmalarına ışık tutacak şekilde ortaya koymaktadır. Başlangıçta ehl-i rey geleneğine mensup Muhammed eş-Şeybânî'nin (ö.189/805) öğrencisi olan Ebû Sevr, Şâfiî ile tanıştıktan sonra fikrî bir dönüşüm yaşamıştır. Bu tanışmadan sonra içtihatta, hadislerin rolünü öncelemeye başlamış ve giderek ehl-i hadis çizgisine yönelmiştir. Bu bağlamda, dirayet kabiliyetininde etkisiyle hadis metinleri üzerinden özgün yorumlar yapmıştır. Bir fâkih olarak da fıkhî meseleleri hadis merkezli ve maslahat öncelikli bir metod ile çözmeye çalışmıştır. Bu yönüyle Ebû Sevr, ehl-i hadis ile ehl-i rey arasında bir köprü kurmuş; rivayet ile dirayeti bütünleştiren bir içtihat çizgisi geliştirmiştir. Onun ilmî mirasını disiplinlerarası bir bakışla yeniden gündeme getiren bu çalışma, hem klasik literatüre katkı sunmakta hem de çağdaş fıkıh tartışmaları için yeni bir perspektif geliştirmektedir. Tez ayrıca, Ebû Sevr'in hadis merkezli fıkıh anlayışının yalnızca klasik dönemde değil, modern fıkıh tartışmaları bağlamında da değerlendirilebileceğini göstermektedir."
