abstract: "Çalışmamız konusu olarak, Türk ve Ürdün hukukunda taksir kavramı ve taksirle işlenen suçlarının seçilmesi; her iki hukukta sözkonusu suçun nasıl düzenlendiğini ve aralarındaki farklılıkları ve benzerlikleri ortaya koymaktır.Konunun fazla uzatılmaması için belirli sınırlar içinde kalınmış ve benzeri suçlarda karşılaştırılmıştır. Doktrin ve uygulamada; konuya ilişkin görüş ve kararlar kaynakların elverdiği ölçüde yansıtılmaya çalışılmıştır. Bizim katıldığımız ve savunduğumuz görüşler gerekli yerlerde belirtilmiştir.Türk ve Ürdün hukukunda taksirli suçunun olarak belirlediğimiz çalışmamız üç bölümden oluşmaktadır.Çalışmanın ilk bölümünde; birinci kısmında taksir suçunun tarihi gelişimi, ikinci kısmınde ise taksirli suçunun mukayeseli hukuktaki ve Türk Hukukundaki durumuna ve kanuni düzenlemesine yer verilerek husus hakkında genel bilgi verilmiştir.Çalışmamız ikinci bölümünde; taksir kelimesi anlamında ve genel olarak Türk ve Ürdün Hukuku bakımından taksir kavramı ve Kanunu'nda tanımlanma şekli ile taksirin unsurları, taksirin şekilleri ve 5237 sayılı Türk Ceza Kanununun ve Ürdün Ceza Kanunu'na göre taksirin gerçekleşme şekli olarak dikkat ve özen yükümlülüğüne aykırılık ile taksir çeşitlerini belirtmeye çalıştık.Çalışmamız üçüncü bölümünde ise, her iki hukukunda taksir suçunun koruduğu yarar tespit edilmeye çalışılarak ve özellikle bu suçun faili ve mağdurunun kimler olabileceği konusunda detaylı bilgi verilmeye çalışılarak suç hakkında teknik anlamda genel bilgi verilmek istenmiştir. Bunu hemen akabinde özellikle suçun hukuka aykırılık ile maddi manevi unsurları üzerinde teorik açıklamalar yapılmaya çalışılmıştır. Üçüncü bölümün son kısmında suçun özel görünüş halleri üzerinde durulmuştur. Suçun teşebbüsü, iştirağı ve içtimaı şekilleri ve yargılama usulü ele alınmıştır.Çalışma konumuz olan taksir suçu, her iki hukuk bakımından sahip olduğu farklılıklar ve benzerlikler özet olarak sonuç bölümünde yer verilmiştir."
