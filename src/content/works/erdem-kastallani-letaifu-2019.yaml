abstract: "Bu çalışmamızda X. asırda yaşamış olan ve birçok alanda eserleri bulunan Kastallânî'nin Letâifü'l-İşârât isimli eserinden kıraat ve tecvîd ilminin en önemli konularından kabul edilen vakf ve ibtidâ konusunu incelenmektedir. İlk olarak Kastallânî'nin hayatı, hocaları, talebeleri ve eserleri hakkında genel bir bilgi verilmektedir. Daha sonra Kastallânî'nin temas ettiği konuları başlıklar halinde ele alınmaktadır. Vakf ve ibtidâ'nın konusu içerisinde geçen kavramların tanımlarından, öneminden, kaynağından, gayesinden, vakf çeşitlerinden, vakf ve ibtidâya ait genel hükümlerden, vakf ve ibtidâ yapmanın sakıncalı olduğu yerlerden, vakf ve ibtidâ konusunda kurrâ imamlarının görüşlerinden, bazı kelimeler üzerinde özel vakf uygulamalarından, vakf ve ibtidâ konusunun tevkîfiliği ve ictihâdiliği meselesinden, Kastâllânî'nin vakflarda kullandığı rumuzlardan ve konuyu ele alırken başvurduğu kaynaklardan ve metodundan bahsedilmektedir."
