abstract: "Mülkiyet hakkı iki temel şekilde kazanılabilir: Mülkiyetin devren kazanılması ve mülkiyetin aslen kazanılması. Mülkiyetin aslen kazanıldığı hâllerden biri, mülkiyetin kazandırıcı zamanaşımı yoluyla kazanılmasıdır. Kazandırıcı zamanaşımı, hem taşınır eşya hem taşınmaz eşya bakımından söz konusu olabilir. Türk Medeni Kanunu?ndaki mülkiyetin kazandırıcı zamanaşımı yoluyla kazanılmasına ilişkin hükümler, sınırlı aynî haklara da uygulanır.Kazandırıcı zamanaşımı, olağan ve olağanüstü kazandırıcı zamanaşımı olarak ikiye ayrılır. Olağan kazandırıcı zamanaşımını olağanüstü kazandırıcı zamanaşımından ayıran temel unsur, eşya üzerinde mülkiyeti kazanmak isteyen zilyedin, zilyetlik süresi boyunca iyiniyetli olması gerekliliğidir. Oysa olağanüstü kazandırıcı zamanaşımı bakımından böyle bir koşul aramak mümkün değildir. Çünkü taşınır veya taşınmaz eşyanın olağanüstü kazandırıcı zamanaşımına konu olabilmesi için bu eşyanın mutlaka bir malikinin olması gerekse de bu malikin kim olduğunun dışarıdan anlaşılmasını sağlayacak bir mekanizmanın hiç bulunmaması ya da işlememesi gerekir. Öyle ki, zilyet bu eşyanın kendisine ait olmadığını bilir; ama eşyanın kime ait olduğunu öğrenebilme olanağından mahrumdur. Taşınmaz eşya bakımından olağanüstü kazandırıcı zamanaşımını olağan kazandırıcı zamanaşımından ayıran bir başka husus ise, zilyedin mülkiyeti kazanmak için on yıl değil yirmi yıl beklemesi gerekliliğidir. Ancak taşınırlar söz konusu olduğunda, olağan kazandırıcı zamanaşımında da olağanüstü kazandırıcı zamanaşımında da işlemesi gereken zilyetlik süresi sadece beş yıldır.Kazandırıcı zamanaşımına ilişkin hükümlerin uygulama alanı pek de geniş değildir. Taşınmazların olağanüstü kazandırıcı zamanaşımına konu olmaları bakımından bu durum, bir yandan ülkedeki kadastro çalışmalarının neredeyse tamamlanmış olmasına, diğer yandan da Anayasa Mahkemesi?nin 2011 yılında verdiği bir iptal kararına bağlanabilir. Çalışmamızda Türk Medeni Kanunu?nun kazandırıcı zamanaşımına ilişkin hükümlerini, Türk Hukuk öğretisinin ve yargı kararlarının ışığı altında değerlendirmiş bulunmaktayız."
