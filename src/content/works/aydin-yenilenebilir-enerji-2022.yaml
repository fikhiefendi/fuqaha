abstract: "Enerji talebinin konvansiyonel kaynaklardan temin edilmesi; sanayileşmeyle gelen negatif dışsallıklar, nüfus artışı, küreselleşme, ekonomik ve teknolojik gelişmeler, rekabetçilik gibi farklı faktörlerle birlikte konsantre antropojenik olumsuzluklara sebep olmaktadır. Bu durum, çevre, iklim, gıda, ekonomi, güvenlik, fırsat eşitliği gibi pek çok konu üzerinde materyal bozulmalara yol açmaktadır. Yenilenebilir enerji, iklim ve çevreye duyarlı, enerji erişimi ve arz güvenliği sağlayabilme kabiliyeti olan sürdürülebilir bir kaynaktır. Ancak altyapı finansmanı görece maliyetlidir ve yatırım ufku uzundur. Yeşil sukuk, yenilenebilir enerji kaynaklarının finansmanında kullanılabilecek alternatif bir varlık sınıfı olarak enerji ve sermaye piyasalarının bileşkesidir. Yeşil sukukun bu alanda kullanımı, hızla büyüyen İslami finans fonlarının sürdürülebilirlik ve İslami finansal sistemin temel doktrinleri doğrultusunda faydaya dönüştürülmesine olanak sağlayacaktır. İlaveten, yeşil sukuk, finansal piyasa derinlik ve verimliliğinin arttırılmasına; daha geniş sermaye tabanına erişilmesine vesile olacaktır. Bu çalışmanın amacı, yeşil sukukun kuramsal olarak anlaşılmasına katkı sağlamakla birlikte yenilenebilir enerji altyapısının fonlanmasında fayda-maliyet penceresinden potansiyelini, fırsat ve avantajlarını sorgulamaktır. Tezde, enerji ve finans kavramları, birincil enerjinin negatif dışsallıkları, yeşil enerjinin kavramsal, nitelik ve niceliksel boyutları, İslami perspektiften çevre etiği, sukuk ve yeşil sukukun nitelik ve niceliksel görünümü gibi pek çok konu ele alınmıştır. Son olarak, Konya ilinin Karapınar ilçesinde 10MW'lık bir güneş enerjisi santrali (GES) projesi, ön fizibilite çalışmasından elde edilen finansal modele dayalı olarak indirgenmiş nakit akışı (DCF), net bugünkü değer (NPV) ve iç verim oranı (IRR) kullanılarak finansal analiz edilmiş ve çıkan değerler muadil finansal varlıkların getirileri ile kıyaslanmıştır. Analiz sonucuna göre, bahsi geçen GES projesinin yeşil sukuk ile fonlanması finansal açıdan uygulanabilirdir (feasible) ve yeşil sukuk muadil varlıkların getirisi bakımından daha avantajlıdır."
