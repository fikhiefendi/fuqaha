abstract: "Asrı saadetten itibaren ferdi mesailer olarak şekillenen fıkhi faaliyetler, hicri dördüncü asrın ortalarına gelindiğinde artık kurumsal bir yapıya bürünmüş ve belli bir kurumun/mezhebin çatısı altında sürdürülmüştür. Bu kurumlar, görüşleri mezhep sistematiğinin temelini oluşturan ve“kurucu imam”da denilen kimselere nispet edilmiş ve onların adıyla bilinegelmiştir. Bununla birlikte her ne kadar kurucu imam ön planda tutulsa da bir kurumun oluşumunu tek kişiye inhisar etmek isabetli değildir. Çünkü kurucu imamın çevresinde olup ona öğrencilik yapmış kimselerin de bu oluşuma verdikleri katkılar yadsınamayacak ölçüdedir. Aynı kurum altında mesai harcamış âlimlerimiz her konuda fikir birliğinde olmamış Kur'an ve sünneti temel alarak“müctehedün fih”dediğimiz alanlarda hem kurucu imamın hem de diğer mesai arkadaşlarının görüşlerinden farklı görüşler de serdetmişlerdir. Bu durum, diğer mezheplerde olduğu gibi Hanefîlerde de çok belirgindir. Bu tez çalışmasında, Hanefi mezhebinde kurucu otorite kabul edilen Ebu Hanife (v.150/767) ve mezhep içi imamlar hiyerarşisinde ondan sonraki konuma sahip olan Ebu Yusuf (v.182/798) ile mezhebin tedvini ve bize ulaşmasında önemli bir yere sahip olan İmam Muhammed (v.189/805) arasında meydana gelen ihtilaflı görüşler temel ibadetler özelinde ele alınmaya çalışılmıştır. Çalışma, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, sınırları, amacı, izlenen yöntem ve yararlanılan kaynakların sistematik açıklaması yer almaktadır. Birinci bölümde üç imam arasında temizlik ve bedenî ibadetlerde meydana gelen ihtilaflı görüşler tespit edilip ele alınmaya çalışılmıştır. İkinci bölümde ise mâlî ve mâlî-bedenî ibadetlerdeki ihtilaflı görüşlerin tespiti ve incelenmesine yer verilmeye çalışılmıştır. Görüşlerin incelenmesinde ihtilafların sebepleri, imamların çıkış noktaları, delilleri, meşayıhın görüşler arasındaki tercihleri ve mezhepte konuya dair fetvaya esas olanın hangi tarafın görüşü olduğu ortaya konulmaya çalışılmıştır."
