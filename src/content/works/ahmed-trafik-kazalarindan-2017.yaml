abstract: "Şüphesiz ki adalet ilkesi, İslâm hukuku ve önceki semâvî din hukuklarının vurgulamaya çalıştığı en önemli ilkeler arasında yer alır. Ayrıca insanlar arasında adaletin gerçekleştirilmesi vacip olduğundan hiçbir kişinin hakkına geçilmemesi, zarara uğraması durumunda da buna sebebiyet veren kişinin meydana gelen zararı tazmin etmesi gerekmektedir. İslâm hukuku ve Modern hukukun korumaya çalıştığı haklardan bir tanesi de trafik kazaları sonrası ortaya çıkan zararın mağdurun lehine olacak şekilde telafi edilmesidir. Çünkü hukuka göre sürücü, kusuru varsa sebebiyet verdiği kaza ve sonuçlarından sorumludur. Dolayısıyla kaza, sürücünün kusuruyla değil bir dış tesirden dolayı meydana gelmişse bu durumda şöför sorumlu tutulmaz. Şu var ki, bu durumda söz konusu dış tesirin kanıtlanması şarttır. Modern hukuk, mağdurun hakkının korunması için bir takım özel kurallar belirlemiştir. Bunlardan bir tanesi, mağdur lehine sürücünün kusurlu bulunduğuna dair mutlaka bir kanıtın olmasıdır. İslâm hukuku ise (o dönemde araç ve şöförlük olmadığı için) genel bir yaklaşım sergileyerek vuku bulan olaylarda doğrudan kusuru bulunanları suçlu kabul ederek olaya sebebiyet verenleri de zararı karşılamakla mükellef kılmıştır. Bu doğrultuda biz de“Trafik Kazalarından Doğan Hukuki Problemlerin İslâm Hukuku Açısından Hükmü”başlığı altında bir tez hazırlama gayreti içerisine girerek ele aldığımız konuları günümüz hukuku ile mukayeseli bir şekilde değerlendirmeye tabî tuttuk. Çalışmamızın giriş kısmında, konunun hangi sebeplerden ötürü seçildiği, yapılan araştırmanın amacı ve yönteminin neler olduğu ve eksiksiz bir şekilde çalışma içeriğine dair açıklamalar ele alındıktan sonra şu bölümlere yer verilmiştir: Birinci Bölümde,“Trafik ile İlgili Genel Bilgiler”başlığı altında trafik kurallarının zorunluluğu, trafikle ilgili tanımlar, trafik kazalarının nedenleri ve trafik kazalarına ilişkin kavram ve terimlere değinilmiştir. İkinci Bölümde,“Devletin Koyduğu Kurallara Uyma Zorunluluğu”başlığı altında, kuralların ihlali ve trafik kazalarının meydana gelmesi, yol ve benzeri kavramlar, yol durumu, yolun nitelikleri ve çeşitleri, İslâm'ın yola verdiği önem ile yoldaki arabalar ve tabelalar konu edinmiştir. Üçüncü Bölümde,“Şoför ve Yayaların Sorumlulukları”başlığı altında şoförler ve trafik kazaları, şoförlükle ilgili hükümler, yayalar ve trafik kazaları ve trafik ihlalleri ve cezaları hakkında detaylıca durulmuştur. Dördüncü Bölümde,“Trafik Kazaları Sonrası Oluşan Zarar”başlığı altında zararın içeriği, zararın blançosu, zarar sonrası yükümlülükler, başkalarına zarar vermenin yasak oluşu, zararın meydana gelmesinden sonra sorumluluğu kesinleştiren fıkhî kurallar ve fakihlerin delilleri incelenmiştir. Beşinci Bölümde,“Zararın Telafisi ve Bağlı Bulunduğu Durumlar”başlığı altında, Zararın Telafisi İle İlgili Genel Bilgilere yer verilerek konu toparlanmaya çalışılmıştır. Altıncı Bölümde, Trafik Kazalarından Kaynaklanan Ölümler\" başlığı altında ise kasten meydana getirilen katl, kasta benzer katl, hata sonucunda gerçekleşen ölüm, hata ile meydana gelen ölüm, trafik kazaları ile ilgili dört mezhebin yaklaşımı, modern ulaşım araçları ve öldürme suçunun bu araçlarla olan bağlantısı konu edinerek araştırma noktalanmaya çalışılmıştır."
