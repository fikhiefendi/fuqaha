abstract: "Muteber ihtilaf konusu, İslam fıkhının önemli konulardan bir tanesidir. Zira muteber ihtilafın bilinmesi, ihtilafa konu olan meselelerde Müslümanlar arasındaki ayrışmayı ve nizaı en aza indirmede büyük öneme haizdir. Önemine binaen bu çalışmada, İslam fıkhında muteber ihtilaf konusu ele alınmıştır. Bu bağlamda çalışmada“muteber ihtilaf”kavramının izahı yapılmış, gayesi ve İslam hukukundaki yerine temas edilmiştir. Aynı şekilde İslam hukukunda ihtilafın hükmü, beş vakit namazın farziyeti ve cana kıymanın haram olması gibi ihtilafa mahal olmayan kati hükümler ele alınmıştır. Çalışma kapsamında ihtilafın hücciyeti konusuna da temas edilmiştir. Ayrıca hilafın şeran muteber sayılabilmesi için gerekli şartlara yer verilmiştir. Çalışmada Hz. Peygamber döneminden fıkıh mezheplerinin ortaya çıktığı döneme kadar şer-i ihtilafın katettiği merhaleler ve fıkıhçıların şer-i hüküm istinbatında ihtilafa düşme gerekçeleri incelenmiştir. Bunun yanı sıra çalışmada Müslüman birisinin muteber ihtilafa karşı tutumunun nasıl olacağı, nefret ve düşmanlığa neden olan ihtilaflardan kaçınmanın gerektiği, İslam'ın davet ettiği temel ilkelerden biri olan birlik ve beraberliğin önemi gibi konuyla alakalı bazı hususlara da temas edilmiştir."
