abstract: "Kendisinden ''kitap'' ve ''sahife'' olarak bahseden Medine vesikası, akademisyenlerin yaklaşımlarındaki farklılık nedeni ile ''muahede'', ''vesika'', ''anayasa'', ''sözleşme'' gibi çeşitli şekillerde isimlendirilmiştir. Muhacir, Ensar ve Yahudiler ile müşrik Arapların katılımları neticesinde Hz. Muhammed (s.a.s.)'in liderliğinde kaleme alınan Medine vesikası Müslüman ve batılı araştırmacılar tarafından araştırma konusu olmuş tarihî ve hukukî bir belgedir. Medine şehir devletinin inşasında yer alan kurucu ilkeleri içeren vesika, ilerleyen tarihî süreçte İslam devletlerinin anayasa teşkilatlanmalarında kaynaklık teşkil etmiştir. Ayrıca İslam devletinin hukuk merkezli bir konumda bulunduğunu göstermesi açısından da oldukça önemlidir. Medine vesikasında yer almış olan mefhumlardan bazılarının ifade ettiği anlam olarak çağımız hukuk kaynaklarında yer alan mefhumların benzer hatta aynı olduğu görülmektedir. Muhammed Hamidullah'ın tespitlerine göre yeryüzünde kaleme alınmış ilk yazılı anayasa olan Medine vesikası, devletin unsurları, devletin esas işlevleri, temel hak, özgürlükler ve yükümlülükler, adalet ve eşitlik, din ve vicdan özgürlüğü, suçun şahsiliği, milli müdafaa, parasal yükümlülükler ve sosyal güvenlik hakkı gibi birçok hukukî konuyu içermektedir. Dolayısıyla bu çalışma ile İslam Anayasa Hukuku bağlamında Medine vesikasının öneminin ortaya konması hedeflenmiştir. Bu çerçevede çalışmamın birinci bölümünde Medine vesikasına giden sürece yer verilmiş, vesikasının isimlendirilme mevzusu, tetkiki, katılımcıları, hususiyetleri, ihlal edilmesi ve ihlal edilmesinin neticelerine değinilmiştir. İkinci bölümde ise İslam Anayasa Hukuku bağlamında Medine vesikası incelenmiştir."
