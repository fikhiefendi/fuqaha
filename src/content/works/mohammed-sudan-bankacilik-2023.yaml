abstract: "Çalışmada, faizsiz finans (İslami) bankacılık sisteminin uygulandığı Sudan bankacılık sisteminin yapısı ve tarihsel süreci ele alınarak; faizsiz finans ürünlerinin Sudan bankalarında nakit akışı üzerindeki etkisi araştırılmıştır. Sudan bankacılık sistemi ve AAOIFI standartlarının uygulaması ile mali tablolarda sunum ve genel açıklama konuları kavramsal çerçevede ele alınmıştır. Sudan bankacılık sisteminde kullanılan finansal araçların araştırıldığı analiz kısmında çok kriterli karar verme yöntemlerinden MOORA ve ARAS yöntemi kullanmıştır. Çalışma kapsamında kullanılan veriler 2011- 2020 dönem sonuna ait Sudan bankalarında kullanılan faizsiz finans ürünlerini (Murâbaha, Mudâraba, Müşâreke, İcara, İstisnâ, Selem, Mugavala, Karz-ı Hasen vd.) kapsamaktadır. Çalışmanın kapsamı ve kısıtları doğrultusunda MOORA ve ARAS yöntemine göre faizsiz finansal ürünlerin 2018 ve 2020 yıllarında en yüksek finansal performans sonuçlarına sahip olduğu ortaya çıkmıştır."
