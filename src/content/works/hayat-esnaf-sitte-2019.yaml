abstract: "Bu çalışma bir giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Birinci bölümde“Esnâf-ı Sitte”hadisinin analizi yapıldı. İkinci bölümde ise faiz illetinin fıkhî yönü araştırıldı. Hadis analizi yapılırken onsekiz raviden gelen“Esnâf-ı Sitte”hadisinin tahricine, senedin ve metnin tenkidine yer verildi. Fıkıh bölümünde ise illetin sözlük ve istılahî tanımı, illetin çeşitleri, şartları, illeti tespit etme metotları, faizin sözlük anlamı, istılahî tanımı ve haram kılınmasının hikmeti açıklandıktan sonra faiz illeti ile ilgili görüşler detaylı bir şekilde ele alındı. Faiz illeti ile ilgli fukahanın görüşleri ele almadan önce“Faiz ancak vadeli işlemlerde olur”hadisi sened ve metin açısından incelenip, Faiz hakkında fukahanın ihtilaflarına değinildi. Daha sonra faiz illeti ile ilgili Dört Mezhep, İbaziyye ve Zeydiyye gibi mütekaddimun âlimlerin görüşleri ve onların delileri geniş bir şekilde açıklandı. Bunun yanısıra faiz illeti ile ilgili çağdaş âlimlerin görüşleri beyan edilerek bu meselede tercih edilen görüş zikredildi. Daha sonra faiz illeti ile ilişkili bazı fıkhî meselelere yer verildi. Bu konu çerçevesinde şu meseleler ele alındı: Faizli mallardaki mübadelenin asıl hükmü, iki bedel arasındaki eşitlik ölçüsü, cins birliğinin ve farklılığının ölçüsü, faizli malların arasındaki kabz keyfiyeti, borcu başka para birimiyle kapatmanın hükmü, altın ve gümüşün para olması, cinsiyle ve gayricinsiyle altından ve gümüşten yapılan süs eşyasının satın alınması, kredi kartıyla altın süs eşyasının satın alınması, ticari evraklar ile altın süs eşyası satın alınması, bankaya altın yatırılması vb. Bu bölümü sonlandırırken altın ticareti ile ilgili Cidde'deki Mecma'ü'l-Fıkhi'l-İslâmi'd-Düvelî fetva kurulunun kararı ve Faizsiz Finans Kuruluşları Muhasebe ve Denetleme Kurumu'nun altın ile ilgili (57) standardı zikredildi. Sonuç bölümünde ise ulaştığımız neticelere yer verildi. Ulaştığımız bazı sonuçlar şu şekilde özetlenebilir: -“Esnâf-ı Sitte”hadisi onsekiz sahabeden rivayet edilmiştir. Bu rivayetlerin çoğu merfû' bazıları ise mevkûftur. Bu hadisi rivayet eden sahabeler şunlardır: Hz. Ebu Bekir, Ömer b. Hattâb, Abdullah b. Mesûd, Ebu'd-Derdâ, Ubâde b. Sâmit, Osman b. Affân, Ali b. Ebî Tâlib, Ebû Bekra, Fadâle b. Ubeyd, Ruveyfi b. Sâbit, Ebû Hüreyre, Hz. Âişe, Abdullah b. Ömer, Ebu Saîd el-Hudrî, Enes b. Mâlik, Hz. Peygamberin eşleri ve iki sa'd'dır. Bu rivayetler sened açısından incelendiğinde Hz. Ömer, Ubade b. Samit, Fadale b. Ubeyd, Ebû Hüreyre ve Ebû Said el-Hudrî'nin rivayetlerinin sahih, diğer rivayetlerin ise zayıf olduğu tespit edilmiştir. -“Esnâf-ı Sitte”hadisi Hz. Ömer'den hem merfû hem de mevkuf rivayet olarak gelmiştir. Merfû ve mevkûf rivayet senedleri analiz edildiğinde ikisinin de sahih olduğu sonucuna ulaşılmıştır. Metinlere bakıldığında Hz. Ömer, Mâlik b. Evs'in Talha b. Ubeydullah ile yüz dinarı bozdurmak istediği rivayet, merfû olarak gelmiştir. Hz. Ömer'den gelen mevkûf rivayetin ise fetva açısından söylendiği görülmüştür. Bu hadisin en meşhur ve yaygın rivayeti, Hz. Ebû Saîd el-Hudrî'nin rivayetidir. Hudrî'den biri mevkûf diğeri merfû olmak üzere faiz ile ilgili iki hadis nakledilmiştir. Bunlardan Mevkûf hadis“dinar dinar ile, dirhem dirhem ile”iken merfu hadis ise“Esnâf-ı Sitte”hadisidir. Sened açısından merfû nitelikli sahih olan rivayetler, metin açısından analiz edildiğinde hadisin şu metinlerinin sahih olduğu ortaya çıkmıştır: Hz. Ebû Saîd el-Hudrî rivayetinde“altın altın ile, gümüş gümüş ile, buğday buğday ile, arpa arpa ile, hurma hurma ile, tuz tuz ile, misli misline ve peşin olarak satılır. Kim artırır veya artırılmasını talep ederse ribaya girmiştir, alan da veren de günahta eşittir”. Hz. Ubâde b. Sâmit rivayetinde“altın misli olan altınla, gümüş misli olan gümüş ile, buğday buğday ile, arpa arpa ile, hurma hurma ile, tuz tuz ile, kim artırır veya artırılmasını talep ederse ribaya girmiştir”. Hz. Ebû Hureyre rivayetinde“altın altın ile, gümüş gümüş ile, buğday buğday ile, arpa arpa ile, hurma hurma ile, tuz tuz ile, misli misline, peşin olarak değiştirilir, cinsleri farklı olmadıkça kim artırır veya artırılmasını talep ederse ribaya girmiştir”şeklindedir. Hz. Ömer rivayetinde ise“altın gümüş ile peşin olarak satılmazsa riba olur, buğday buğday ile peşin olarak satılmazsa riba olur, hurma hurma ile peşin olarak satılmazsa riba olur, arpa arpa ile peşin olarak satılmazsa riba olur”şeklindedir. Hudrî'den mevkûf olarak nakledilen“Dinar ile dinar, dirhem ile dirhem arasında bir fazlalık olmaması gerekir”hadisi, merfû olarak nakledilen“Esnâf-ı Sitte”hadisinden farklı bir hadistir. Fakat bu hadis“Esnaf-ı Sitte”hadisinin anlamını desteklemektedir. Fadele b. Ubeyd rivayeti sened açısından sahih olmasına rağmen metninde bir ızdırab vardır. Bu ızdırab güçlü olduğu için rivayetin metni delil olmaktan çıkmıştır. Zira lafızlardaki farklılıklar, biri diğerine tercih edilemeyecek kadar aynı derecede sika olan ravilerden gelmiştir. Hadisin şu lafızlarının zayıf olduğu sonucuna varılmıştır: Ubâde b. Sâmit rivayetindeki“Bu altı sınıf farklı olursa peşin olması şartıyla istediğiniz gibi satınız”ziyadesi zayıftır. Çünkü bu ziyadeyi Hâlid el-Hazzâ bir grup sika ravilere muhalefet ederek rivayet etmiştir. Aynı şekilde“vezin vezin ile”,“keyl keyl ile”“kefe kefe ile”,“buğday hurma ile peşin olması şartıyla istediğiniz gibi satınız, arpayı hurma ile peşin olması şartıyla istediğiniz gibi satınız”,“onun ham ve işlenmiş hali”,“med med ile”,“peşin olup gümüş daha fazla olma şartıyla altın gümüş ile satılabilir”,“peşin ve arpanın daha fazla olması şartıyla buğday arpa ile satılabilir”,“vadeli olursa caiz olmaz”,“hurmayı tuz ile peşin olması şartıyla istediğiniz gibi satınız”,“iki dinar bir gümüş ile, iki buğday bir arpa ile, iki tuz bir arpa ile peşin olarak satılabilir”şeklindeki ziyadeler sahih değildir, zira bunları rivayet eden raviler kendilerinden daha sika olan ravilere muhalefet ederek rivayetlerde bulunmuşlardır.“Kim artırır veya artırılmasını talep ederse ribaya girmiştir”ziyadesinin ise sahih olduğu kanaatine varılmıştır. - Hz. Usâme b. Zeyd, Berâ b. Âzip ve Zeyd b. Arkam“riba ancak vadeli işlemlerde olur”hadisini rivayet etmiştir. Bu hadis hem sened hem de metin açısından analiz edilip sahih olduğu görülmüştür. Fukaha bu hadis ile“Esnaf-ı Sitte”hadisi arasındaki çelişkiyi kaldırmak için altı farklı görüşe ayrılmışlar: Birinci görüş: Nesih, ikinci görüş:“Riba ancak vadeli işlemlerde olur”hadisi iki mal farklı cinsten olursa geçerli olur, üçüncü görüş:“riba ancak vadeli işlemlerde olur”hadisi altı çeşit dışındaki mallarda geçerlidir. Dördüncü görüş:“riba ancak vadeli işlemlerde olur”hadisinden kastedilen riba haramlığı daha şiddetli olan ribadır, beşinci görüş:“Esnaf-ı Sitte”hadisinin bağlamı“riba ancak vadeli işlemlerde olur”hadisinin anlamından daha evveldir, altıncı görüş ise:“Riba ancak vadeli işlemlerde olur”hadisi ile gerçek faiz kastedilmektedir. İbn Abbas'ın“ Riba ancak vadeli işlemlerde olur”görüşünden döndüğü rivayet edilmektedir, fakat dönmediğine dair rivayetler daha sahihtir. - Faiz dar manada borç faizi (Cahiliye faizi) ve alışveriş faizi olmak üzere ikiye ayrılmaktadır. Alışveriş faizi ise fadl ve nesîe (vadeli) faizlerinden oluşmaktadır. Faiz geniş manada ise her fâsit veya haram olan akitleri kapsamaktadır."
