abstract: "Bu çalışma, İslam hukukunun evlilikle ilgili hükümler ile Gana Cumhuriyeti kişisel statü hukukunda konuyla ilgili düzenlemeleri karşılaştırmalı olarak ele almayı hedeflemektedir. Karşılaştırmalı ve analitik bir içtihat çalışması olan Gana Cumhuriyeti hukuku; konusu ve yöntemi bakımından evlilik bölümlerinde karşılaştırmalı bir hukuk çalışmasına imkân vermektedir. Bu yolla Müslümanların azınlık konumunda bulunduğu Gana Cumhuriyeti'ndeki hukuki imkanlarına dair değerlendirme yapmak imkânı mümkün olacaktır. Bu çalışma ayrıca Ganalı Müslümanların hukuki durumlarıyla ilgili bilimsel tespitler yaparak, bu konuda kendileri için yeni kapılar açılmasının imkanlarını araştırmayı ve mevcut durumun geliştirilmesine ne tür katkı yapacaklarını ortaya koymayı hedeflemektedir. Konunun seçilmesinde, daha önce Ganalı Müslümanların Ahval-i Şahsiyye konuları ve özellikle Evlilikle ilgili hükümler bakımından hukuki durumlarıyla ilgili olarak islam hukuku ve mevcut hukuki statüyü karşılaştırmalı olarak inceleyen herhangi bir çalışmanın bulunmayışı etkili olmuştur. Bu araştırma bir giriş ve üç bölümden oluşmaktadır. Giriş şunları içerir: Araştırma temelleri, başlığı seçme nedenleri, konunun önemi, çalışma hedefleri, araştırma metodolojisi, araştırma problemi, önceki çalışmaların değerlendirilmesi ve araştırma planı. Ayrıca girişte Gana Cumhuriyeti hakkında genel bilgiler, Müslümanların durumu, İslam'ın Gana'ya girişi, Gana Cumhuriyeti Hukukunun doğası ve kaynakları hakkında bilgilere yer verilecektir. Birinci bölümde İslam Hukuku ile Gana Cumhuriyeti hukuku çerçevesinde evlilik konusundaki temel hükümlere yer verilecektir. Bu çerçevede İslam hukukunda evlilik, tanımı, hükümleri ve konuyla ilgili önceki çalışmalar ele alınacaktır. Daha sonra Gana Cumhuriyeti hukukunda evlilik: tanımı, hükümleri ve konuyla ilgili önceki çalışmalar incelenecektir. Çalışmanın ikinci bölümünde, eşlerin her iki hukuk sisteminde sahip olduğu karşılıklı hak ve sorumlulukları ele alınarak benzer ve farklı yönleri karşılaştırılmaktadır. Üçüncü bölümde evlilik Hukuku bakımından İslam Hukuku ile Gana Cumhuriyeti hukukundaki hükümlerin karşılaştırılması yapılmaktadır. Bu çerçevede evlilik akdinin farklı yönleri her iki hukukun tanımlamaları bakımından tartışılacaktır. Sonuç kısmında, iki hukuk sisteminde evlilik hukuku açısından mevcut hükümler değerlendirmeye tabi tutularak, Gana Müslümanlarının hukuki ve siyasi süreçlere katılımını etkileyen farklı yaklaşımlara dikkat çekilecektir."
