abstract: "Bu çalışmada, hicrî dördüncü asırda yaşamış olan Hanefi fakîhi ve usulcüsü Ebû Bekr el-Cessâs'ın hayatı ve Ahkâmu'l Kur'ân isimli eserinde İslam Ceza Hukuku konuları ile ilgili yorumları ve yaklaşımları ele alınmıştır. Tezimiz iki ana bölümden oluşmaktadır. Birinci bölümde Cessâs'ın içinde doğup büyüdüğü ve vefat ettiği hicrî dördüncü asrın siyasî, sosyal, iktisâdî ve ilmî durumunun yanında Cessâs'ın hayatı, yetişmesi, ilmî şahsiyeti, Hanefi tabakalarındaki yeri, itikadî görüşleri, hocaları, öğrencileri ve eserleri hakkında bilgi verilmiştir. İkinci ve tezimizin esasını oluşturan bölüm ise yine iki alt başlıktan oluşmaktadır. Birinci kısımda Cessâs'ın Kur'ân-ı Kerim ayetlerinden İslam Ceza Hukuku'na dair hükümleri çıkarmada takip ettiği metod ortaya konulmuştur. Bu anlamda onun Kur'ân ayetleri, Sünnet, Sahabe kavli, Şer'u men kablenâ ve usul kaideleri gibi şerî delillerle hüküm istinbâtına örnekler verilmiştir. İkinci kısımda ise İslam Ceza Hukukunun en önemli konularını oluşturan ve gerektirdiği ceza yönünden tasnif edildiğinde kısas ve hadd cezaları olarak isimlendirilen konularda Cessâs'ın ortaya koyduğu bazı tercihlerine örnekler sunulmuştur."
