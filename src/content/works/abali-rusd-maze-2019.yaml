abstract: "Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde, El-Muhitu'l-Burhani isimli eserinde İbn Maze'nin talakla ilgili görüşleri hakkında bilgi verilmiştir. Müellif, talak konusunu çoğunlukla farazi meseleler üzerinden açıklamıştır. Bundan dolayı çalışmada talakla ilgili eserde bulunan bütün meselelere değil konuların anlaşılmasına katkı sağlayacak sayıda meseleye yer verilmiştir. Ayrıca İbn Maze, eserinde bazı konularda Farsça meselelere de yer vermiştir. Müellifin Farsçayı da kullandığını belirtmek üzere birkaç Farsça mesele çalışmaya alınmıştır. İkinci bölümde, Bidayetü'l-Müctehid ve Nihayetü'l-Muktesıd isimli eserinde İbn Rüşd'ün talakla ilgili görüşleri hakkında bilgi verilmiştir. Müellif, eserinde mezhepler arasında karşılaştırma yaparak fıkıh konularını ele almıştır. Bu çalışmanın amacı iki müellif üzerinden bir nevi Hanefi mezhebiyle Maliki mezhebinin talakla ilgili görüşlerinin karşılaştırılması olduğu için bu bölümde İbn Rüşd'ün Maliki mezhebine atfettiği görüşlere yer verilmiştir. Üçüncü bölümde, İbn Maze ve İbn Rüşd'ün bu çalışmanın kaynakları konumundaki eserlerinde yer alan talakla ilgili görüşleri karşılaştırmalı olarak ele alınmıştır. İbn Maze, konuyu daha kapsamlı açıkladığı için karşılaştırma onun eserindeki konu başlıkları merkeze alınarak yapılmıştır. Sonuç ve değerlendirme bölümünde ise iki müellifin talakla ilgili görüşleri değerlendirilip, önemli görülen hususlarla ilgili tespitlere yer verilerek çalışma sonlandırılmıştır."
