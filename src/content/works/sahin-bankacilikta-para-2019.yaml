abstract: "Bu doktora tezi para üretimine dair iktisadi ve fıkhî yönlerden yapılmış incelemeleri ve değerlendirmeleri içermektedir. Modern para üretimi, şüphesiz modern iktisadi hayatın en önemli fenomenlerinden biridir. Bankalar tarafından gerçekleştirilmekte olan para üretimi insanların her gün yoğun olarak kullandığı paranın satın alım gücünü etkilemektedir. Merkez bankaları kağıt para üretimi vesilesiyle, ticari bankalar da kaydî para üretimi vesilesiyle ülke ekonomisinde tedavül eden toplam para arzını ve fiyatlar genel seviyesini etkilemektedir. Bu çok disiplinli çalışmada hem para üretiminin yol açtığı iktisadi etkiler, hem de bu etkilerin arkasındaki idarî eylemlerin fıkhî boyutu ele alınmaktadır. Ardından para üretimine dair süreçlerde iktisadi ya da fıkhî açıdan sorun tespit edilen alanlar eleştirilmekte ve bu sorunların giderilmesi konusunda öneriler sunulmaktadır."
