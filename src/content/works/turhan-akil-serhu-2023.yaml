abstract: "Bu çalışma, İbn 'Akîl'in şerh etmiş olduğu İbn Mâlik'e ait Elfiyye adlı eseri üzerine yazmış olduğu Şerhu İbn 'Akîl ismiyle şöhret bulan eserin tanıtımıdır. İbn 'Akîl miladi 14. asırda yaşamış fıkıh, tefsir, kelam, mantık, kıraat dersleri almış bir âlimdir. Özellikle fıkıh ve nahiv ilminde kendisine başvurulan birisi olmuştur. İbn 'Akîl, yazmış olduğu Şerhu İbn 'Akîl adlı eseriyle nahiv alanına büyük katkıları olmuş hatta günümüzde de bu eseri Arap dilinin öğretiminde başvurulan kaynaklardandır. Bu çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın amacı, konusu ve İbn 'Akîl'in yaşamış olduğu dönem hakkında bilgiler verilmiştir. Birinci bölümde İbn 'Akîl'in soyu, hayatı, ilmî hayatı, hocaları, öğrencileri, nahiv alanındaki eserleri gibi konular ele alınmıştır. İkinci bölümde Şerhu İbn 'Akîl eserinde takip edilen metod ve İbn 'Akîl'in nahiv kâideleri için kural belirlerken dayandırdıkları deliller hakkında bilgi verilmiştir. Üçüncü bölümünde ise İbn 'Akîl'in nahivle ilgili görüşleri, Basra ve Kûfe ekolleri, İbn 'Akîl'in bu ekollerle iv münasebeti, Şerhu İbn 'Akîl'de İbn 'Akîl'in istifade etmiş olduğu âlimler ve son olarakta İbn Mâlik'in yazmış olduğu Elfiyye üzerine yazılmış şerhlerden birkaç tanesiyle Şerhu İbn 'Akîl arasında mukayese yapılmıştır."
