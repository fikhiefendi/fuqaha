abstract: "Bu çalışma, İslâm hukuk ve siyaset düşüncesinde devlet başkanında aranan şartların tespit ve tahlilini konu edinmektedir. Devlet başkanlığının dinî ahkâmın icrası ve dünyevî işlerin idaresine dönük en büyük sorumluluk makamı olarak taşıdığı önem, bu görevi üstlenecek kimselerde aranacak nitelikler hususunda titizlik gösterilmesini gerekli kılmıştır. Bu nedenle İslâm toplumunu sevk ve idare etme sorumluluğunu üstlenecek olan devlet başkanının hangi niteliklere sahip olması gerektiği meselesi, İslâm hukuk ve siyaset düşüncesi metinlerinde temel bir problem alanını oluşturmuştur. Meşruiyet problemleri ve yöneten, yönetilen ve yönetim ilişkileri açısından büyük önem taşıyan bu meselede, İslâm hukukçuları nasların, yerleşik mezhep kabullerinin, içtihatların ve İslâm tarihi boyunca ortaya çıkan siyasî ve toplumsal tecrübelerin ışığında birtakım şartlar tespit ederek Müslümanları yönetmeye talip olan kişinin bu şartlara sahip olması gerektiğini dile getirmişlerdir. Devlet başkanlığı için gerekli görülen şartların siyasî liderliğin meşruiyeti problemiyle doğrudan ilişkili olması, kuşkusuz konuyu erken dönemlerden modern döneme değin giderek daha esaslı bir tartışma alanı haline getirmiştir. Çalışmanın temel amacı, devlet başkanında aranan şartlar konusu etrafında teşekkül eden literatürün izini sürüp bu literatürün nasıl ve ne yönde bir gelişme gösterdiğini kronolojik bir çerçevede ortaya koymak ve fıkıh mezhepleri arasındaki görüş farklılıklarını da dikkate alarak meselenin İslâm hukuk ve siyaset düşüncesindeki serencamına dair geniş bir çerçeve çizmektir."
