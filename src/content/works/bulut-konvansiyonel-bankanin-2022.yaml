abstract: "Dünya'da faizsiz bankacılığın gelişimine bakıldığında son dönemlerde konvansiyonel bir bankanın İslami bir bankaya dönüştürülmesine yönelik çok sayıda örneklerle karşılaşılmaktadır. Bu dönüşüm örneklerinde konvansiyonel bir banka hızlı bir şekilde tam teşekküllü İslami bankaya dönüştürülebildiği gibi, İslami pencere açmak veya ayrı bir İslami banka kurmak suretiyle kısmi ve aşamalı olarak ta dönüştürülebilmektedir. Bu kapsamda katılım finans sisteminin gelişimine katkıda bulunmak amacıyla farklı bir yöntem olarak dönüşümün Türkiye'de uygulanması konusu gerek Dünya örnekleri gerekse uzman kişilerle gerçekleştirmiş olduğumuz derinlemesine mülakat sonuçlarına göre analiz edilmeye çalışılmıştır. Bu bağlamda konvansiyonel bir bankanın faizsiz sisteme dönüşümü iktisadi, hukukî, fıkhî, mali ve teknik açıdan tüm detayları ile ele alınarak, Türkiye şartlarına uygun alternatif yaklaşımlar ve model önerileri sunulmuştur. Çalışmanın sonuçlarına göre ilk tercihimiz mümkünse konvansiyonel bir bankanın tamamen ve hızlı bir şekilde faizsiz bir bankaya dönüştürülmesidir. Türkiye koşulları göz önünde bulundurulduğunda ise sırasıyla bağlı ortaklık ya da pencere uygulamasına dayalı kısmi ve aşamalı dönüşüm yöntemlerinin tercih edilmesi daha uygun olacaktır. Dolayısıyla dönüşüm şeklinin mevcut şartlara göre bankadan bankaya farklılık arz edebileceği ve başarılı bir dönüşüm için ise öncelikle yasal zeminin ve fıkhî standartların oluşturulması gerektiği sonucuna varılmıştır."
