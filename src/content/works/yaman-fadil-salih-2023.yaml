abstract: "Nahiv ilminin özellikle de i'râb'ın tam olarak anlaşılabilmesi adına alimlerin çoğu çeşitli eserler telif etmişlerdir. Bu alimlerden birisi de Fâdıl Sâlih es-Sâmerrâî'dir. Sâmerrâi nahiv ilmine yeni görüşler ve katkılar sağlamak için çaba göstermiştir. Bununla birlikte birçok alimin görüşlerini daha net anlaşılır hale getirmek için gayret sarfetmiştir. Öncelikle alimlerin görüşlerine yer vermiş sonrasında kendi görüşlerini delilleri ile zikretmiştir. Konumuzu teşkil eden iki eser incelendiğinde Sâmerrâî'nin lafız mana arasındaki ilişkiye ne kadar önem verdiği aşikâr olacaktır. Sâmerrâî konumuzun ana kaynaklarından birisi olan dört ciltlik Me'âni'n-nahv eserinde Arapça'da lafızlarda yapılacak en ufak değişikliklerin bile manada nasıl bir etkiye sebep olduklarını araştırmış, genellikle Kur'an-ı Kerim'den ayet-i kerimeleri delil olarak kullanmış, lafız olarak birbirine benzeyen ayet-i kerimelerin arasındaki mana farklılıklarına dikkat çekmiştir. Yer yer en tartışmalı nahiv meselelerini zikretmiş, kendi görüşlerini beyan etmiş, kimi zamanda kendi ulaştığı yeni görüşleri zikretmiştir. en-Nahvu'l-arabî ahkâm ve meâni eserinde ise Me'âni'n-nahv eserine kıyasla, nahiv meselelerine daha yüzeysel bir üslup ile yaklaşmış, genellikle Ayet ve şiirleri istişhâd olarak kullanmış ve bunların altına“المعنى”başlığı ile daha sade lafızlarla tercümelerini eklemiştir. Her iki eserde de öncelikle izah edilecek konu ile alakalı lâfzî veya istilahi tarifler varsa bunlara yer verilmiş, konu ile ilgili detaylar maddeler halinde zikredilmeye ihtiyaç duyuyorsa maddelendirme yöntemine gidilerek açıklanmaya çalışılmıştır. Müellif çoğu zaman konuyu izah ederken her iki eserinde de aynı kelime ve aynı örneklere müracaat etmiştir. Öyle ki Me'âni'n-nahv eserinde izah edilen bir konunun aynı kelime ve aynı örnekler kullanılarak birebir aynısının en-Nahvu'l-arabî ahkâm ve meânî eserinde de yer aldığını görebiliyoruz. Sâmerrâî, en-Nahvu'l-arabî ahkâm ve meânî eserinde bir tek dipnot dahi zikretmemiş olup, eserde geçen Ayet-i Kerimelerin isim ve numaralarını bile Ayet-i Kerimelerin hemen ardından zikredip dipnot olarak vermemiştir. Me'âni'n-nahv ise dipnot bakımından oldukça zengindir. Faydalanılan eserlerin isim ve sayfa numaralarının zikredilmesi dipnotun büyük bir kısmını oluşturmaktadır. en-Nahvu'l-arabî ahkâm ve meânî de zikredilen bir konu Me'âni'n-nahv eserinde, en-Nahvu'l-arabî ahkâm ve meânî'ye göre farklı başlıklar altında zikredilmiş ve daha farklı yönleriyle de izah edilmiş olabilmektedir. Bir bakıma dört cilt olarak kaleme aldığı Me'âni'n-nahv eserinin özeti diyebileceğimiz en-Nahvu'l-arabî ahkâm ve meâni eserinde toplam 282 yerde Me'âni'n-nahv eserine atıflarda bulunarak, konuyu daha detaylı incelemek isteyenleri daha hacimli eseri olan Me'âni'n-nahv eserine yönlendirmiştir. Çalışmamızda en-Nahvu'l-arabî ahkâm ve meânî eserinin birinci cildi sadece ele alınacak olup, birinci ciltte yer alan 152 atıf yeri incelenecektir."
