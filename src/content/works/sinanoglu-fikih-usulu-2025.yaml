abstract: "Kavram ve terimlerin (ıstılahların) belirlenmesi, genel olarak İslami ilimlerde, özelde ise Fıkıh Usulü ilminde temel bir giriş niteliği taşır. Çünkü usulî terimler, şer'i metinlerin delaletlerini belirlemek ve Şâri'in bu metinlerdeki muradını anlamak için kullanılan bilgi ve yöntem aracıdır. Bu sebeple, belirli bir mesele üzerine yapılan hiçbir usul çalışmasının tamamlanması veya istikamet bulması, etrafında dönülen terimin dakik bir şekilde tanımlanmasından önce mümkün değildir.“ ”Bu çalışma, tedvin tarihi süresince usûl ıstılahları sözlüklerini ve hudûd/ta'rifât literatürünü incelemeyi hedeflemektedir. Çalışma, belirli bir dönem veya müellifle sınırlı kalmayıp, bu alanda kaleme alınan literatürü kapsamakta; sözlük yazarlarının tanımları oluşturmadaki (siyaga) titizliklerine ve belirledikleri kriterlere (davabıt) özellikle dikkat çekmektedir. Söz konusu tarihsel iz sürüş; usûlî tanım sözlüklerinin; usûl metinleri, genel sözlükler, mezhep imamlarının ve ekollerin görüşleri ile usûl kitaplarının giriş kısımlarındaki kısa ve özlü işaretlerden, Hicri 5. asırdan günümüze kadar nasıl bağımsız ve bütüncül eserlere dönüştüğünü anlamak açısından elzemdir.“ ”Çalışma ayrıca, bu sözlük (mu'cem) yazım sürecinin izini sürmeyi; bu terimlerin 'özel telifler' halinde müstakil olarak ele alınmasını gerektiren metodolojik ve eğitimsel sebepleri analiz etmeyi hedeflemektedir. Bu doğrultuda çalışma, şu temel hedefleri gerçekleştirmeye yöneliktir: Birincisi: Sözlük yazarlarının fıkhî mezheplerini, bulundukları coğrafi bölgeleri belirtmek ve her sözlük hakkında kısa bir tanıtım sunmak suretiyle bu eserlerin tarihî ve bibliyografik dokümantasyonunu yapmak; ayrıca çalışmanın kurucu kavramları olan sözlük, terim (ıstılah), tanım (had), kamus ve ansiklopedi ile usûl terimlerinin sınırları ve tariflerine ilişkin kavramsal ağ arasındaki ayrımları ortaya koymaktır. İkincisi: Söz konusu sözlükleri; içerikleri, barındırdıkları usûlî tanımların yoğunluğu, her bir sözlüğün izlediği yöntem ve üslup açısından inceleyip analiz etmektir. Üçüncüsü: 'Hudûd' (Tanımlar) kitaplarında yer aldığı şekliyle Mendub, Sebeb, Kıyas, Müşterek, Emir, Müçtehid, Mukallid ve Fetva gibi seçilmiş usûl terimlerinin analizini yaparak; fıkhî ve usûlî tartışmalara zenginlik katan ince farkları, uzlaşı ve ayrılık noktalarını görünür kılmaktır. Dördüncüsü: Terimsel tutarlılığı (ıstılahî zaptı) sağlamak, usûl eğitimini geliştirmek, fetva üretim kalitesini artırmak ve güncel meselelerdeki (nevâzil) bilimsel ix araştırma temellerini güçlendirmek amacıyla; bu sözlüklerin akademik ve bilimsel çevrelerdeki kullanım durumunu değerlendirmektir.\""
