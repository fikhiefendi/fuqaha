abstract: "Hadis ilminin en temel hedeflerinden biri hadislerin sonraki asırlara nakledilirken mümkün olduğunca asıl şeklinin korunup korunamadığını tespit etmektir. Bu durum merfû, mevkuf ve maktû her bir hadis için geçerlidir. Söz konusu hedefi gerçekleştirebilmek için isnad sistemi ve hadis ilminin alt dalları oluşturulmuştur. Hadislerin sened ve metinden müteşekkil olduğu dikkate alındığında bir hadisin aslına uygun şekilde nakledilip edilmediği mesinin bu iki kısım incelenerek tespit edilir. İsnadın düzgün şekilde naklini ilgilendiren meselelerden biri ref' konusudur. Zira merfû olmayan bazı hadisler râviler tarafından çeşitli sebeplerle merfû hadis gibi nakledilmiştir. Bu durum hem rivayet sisteminin güvenirliği hem de hadislerin delil değeri gibi temel konularla ilgilidir. Bu yüzden muhaddisler bu konuya büyük bir ilgi göstermişlerdir. Bu çalışmada, Ebû Hanîfe'nin tâbiîlerden rivayet edilen maktû hadislerin sonraki nesle intikali ele alınmış ve özellikle de ref' durumunun bulunup bulunmadığı araştırılmıştır. Ayrıca bu hadislerin ne kadarının hem maktû hem de merfû olarak nakledildiği ele alınmış ve bu tür durumlarda nasıl bir yaklaşım benimsemenin gerektiği incelenmiştir."
