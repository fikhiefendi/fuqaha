abstract: "COVID-19 pandemisinin bankacılık sektörüne olan etkisi kaçınılmaz olmuştur. Bu çalışmada katılım bankalarının 2019-2021 yılları arası verilerle pandemi öncesi ve sonrası dönemdeki performansları değerlendirilmiştir. Çalışmada ÇKKV Yöntemleri yöntemleri olan Entropi, Bulanık Entropi ve İdeal Çözüme Benzerlik Yoluyla Tercih Sıralama Tekniği (TOPSIS) yöntemi kullanılmıştır. Çalışmada 6 tane katılım bankası ile çalışılmış olup değişken olarak bankacılık sektörü için önemli olan 10 tane değişken kullanılmıştır. Çalışma sonucunda; Kuveyt Türk Katılım Bankası'nın en yüksek performansa sahip banka olduğu görülmüştür. En düşük performansa sahip olan bankanın, entropi yöntemine göre Albaraka Türk Katılım Bankası iken bulanık entropi yönteminde en düşük performanslı bankanın yıllara göre farklılık gösterdiği görülmektedir. Örneğin, 2020 yılında en düşük performans Vakıf Katılım Bankası'nda gözlemlenmekte iken, 2021 yılında bu durum Ziraat Katılım Bankası'na geçmektedir. Bu çalışma, literatürde sınırlı olan katılım bankalarının pandemi dönemine ilişkin performans analizlerine katkı sağlamayı ve fayda-maliyet dengesinin finansal performansa olan etkilerinin bulanık mantık kapsamında değerlendirilerek bu alanda yapılacak çalışmalara katkı sağlamayı amaçlamaktadır."
