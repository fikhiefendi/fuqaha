abstract: "“İslam Fıkhında Hüküm Teorisi”adlı çalışmamız, hükmün mahiyeti, oluşumu, oluşumunu etkileyen faktörler ve bu bağlamda hüküm kavramıyla doğrudan veya dolaylı olarak ilişkili kavramlar, hükmün bilgi değeri ve bağlayıcılığı ile ilgili konulardan oluşmaktadır. Çalışmada hüküm kavramını merkeze aldığımızdan, hükümle ilgili tali sayılabilecek uzak unsur veya etmenleri tezin sınırlarını zorlayacağı düşüncesiyle dışarıda tutmaya çalıştık. Çalışma, bütün dinî ekolleri içermemekte, genel itibariyle sünnî ekoller ile mu'tezile merkezlidir. Bununla birlikte kısmen ve ihtiyaç olduğu kadar hâricilere de yer verilmiştir. Fakat şia çalışmanın dışında tutulmuştur. Dinî bir konuda hüküm vermek, çok ciddi ve son derece hassas bir konudur. Zira dini bir konuda soru soranı, vereceğimiz hükümle yönlendirmiş, ilgili hükme tabi olması noktasında inancını bir anlamda şekillendirmiş olmaktayız. Şer'i bir hükme ulaşmanın ve özellikle bunu ictihad veya fetvâ ile oluşturmanın ciddi bir faaliyet ve sorumluluk gerektirdiği ortadadır. Dinî şer'î bir alanda hüküm verme işlemi, delilsiz, gerekçesiz, gelişi güzel dinî alanda konuşma ve söylem şeklinde olmamalıdır. İctihad/fetvâ yoluyla elde edilen hükmün hem hükmü veren hem de muhatapta oluşan bilgi değeri önem arz etmektedir. Meydana gelen şer'i hükmün tutarlı, istikrarlı, gerekçesi sağlam ve sağlıklı olması, onun hem bilgi açısından değerini hem de bağlayıcılığını etkileyecektir. Bu durum, konunun belirlenmesi ve çalışılmasının da sebebini oluşturur. Bu bağlamda çalışmanın amacı, Müslümanların dini hayatlarının ameli tarafını önemli ölçüde etkileyen dini-şer'i soru ve sorunlarına çözüm üreten, hükmü tespitte sağlam, tutarlı, usûlî ilke ve esaslar ortaya koymaktır. Çalışmamızda hüküm ve hüküm ile ilgili konular, betimleyici, inceleme ve değerlendirme şeklinde ele alınmıştır. İslam fıkhında Allah mutlak anlamda hüküm koyan, Hz. Peygamber ise mecâzi manada şârî' konumundadır. Müctehid/müftü ise Allah katında mevcut olduğu düşünülen hükmü çıkarmaya çalışmakta olup, şârî' sıfatına sahip değillerdir. İctihad ile oluşan hükümler zann-i galib üzerine kurulmakla beraber hükmü veren ile o hükme tabi olan için kesinlik ifade eder. Maslahat üzerine hüküm verilecekse, bu hükmü bir müctehidin değil, bir ictihad heyetinin vermesi gerekir. Zira bir müctehidin o konuda yanılgısı ile heyetin yanılgısı bir olmayacaktır. Bu manada hükmü mümkün mertebe nesnel düzeye çıkarmak, hatayı minimize etmek için heyet ictihadı öne çıkmaktadır. Hz. Peygamber'in tasarruflarından fetvâ ve risâlet özellikli olanların bağlayıcı olduğu bir hakikattir. Ancak ictihad edip etmediği konusu ile devlet başkanı ve hâkim sıfatıyla yaptığı tasarruflarının bağlayıcılığı tartışmalıdır. Bununla birlikte bu son üç kısımda yaptığı tasarruflara karşı genellemeci bir yaklaşım doğru değildir. İlgili tasarruflarının belki tek tek analizi gerekmektedir. Kur'an'ın ahkâmını bütünüyle evrensel kılmak doğru olmadığı gibi, yerel olarak görmek de yerinde ve isabetli değildir. Bu iki yaklaşım tarzı, ifrat ve tefriti çağrıştırmaktadır. Bunun yerine ekser ahkâmının evrensel olduğunu, çok az kısmının ise yerel motifler taşıdığını kabul etmek gerekir. Bununla birlikte Kur'an, lafzı ve mesajı itibariyle kıyamete kadar geçerlidir. Bu bağlamda yöntem ve metodu itibariyle kadim usul geleneğimizden tamamen farklı yaklaşım sergileyen tarihselcilik anlayışının Kur'an ahkâmına uyarlanmasını doğru görmüyoruz. Nesih olgusu hem aklen hem de vakıada mümkündür. Bu olgunun bedâ fikri ile ilişkilendirilmesi isabetli değildir. Meselenin ilâhî ve beşer perspektifi ile ilgisi vardır. Beşer zaviyesinden nesih, tebdil olabilir ancak, ilâhî nazar açısından bunun beyandan başka bir şey olmadığını söyleyebiliriz. Günümüzde şer'î-amelî güncel bir meselede ferdî veya heyet şeklinde meydana gelen ictihadî hükümleri önemsemekle beraber hükümde hata payını en aza indirmesi açısından heyet ictihadı önem arz etmektedir."
