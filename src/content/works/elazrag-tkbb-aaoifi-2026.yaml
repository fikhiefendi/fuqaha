title: "‫دراسةٌ مقارنةٌ للفروقِ بينَ معيارِ إصدار الأسهمِ وتداولها لاتحاد البُنُوْكِ التَّشاركيةِ التركيةِ ⁦TKBB⁩، ومعيارِ الأَوْرَاقِ المَالِيَّةِ (الأسهمِ والسنداتِ) لهيئةِ المحاسبةِ والمراجعةِ للمؤسساتِ المالية الإسلاميةِ ⁦AAOIFI"
