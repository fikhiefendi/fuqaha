abstract: "İki standart arasındaki teknik ve fıkhî farklılıkları incelemeyi, bunları ortaya koyup açıklamayı, sebeplerini ve dayanaklarını analiz etmeyi, karşılaştırmalı olarak değerlendirmeyi ve iki standardın yakınlaştırılarak daha sağlam hâle getirilmesine katkı sunmayı amaçlamaktadır. Araştırma; tümevarımsal, betimleyici, analitik ve karşılaştırmalı yöntemleri kullanan nitel bir çalışmadır. Önce farklı hükümler belirlenip tasvir edilmekte; ardından dayanakları ve gerekçeleri incelenmektedir. İlgili fıkhî görüşler karşılaştırılarak ayrıntılı deliller, yerleşik fıkıh kaideleri, şeriatın maksatları ve ekonomik maslahat ışığında doğru veya doğruya en yakın hüküm belirlenmektedir. Çalışmada, standartların meseleleri hakkındaki literatür ile mezhep fakihlerinin bu hükümlerin dayandığı temel meselelere ilişkin görüşlerinden yararlanılmaktadır. *Çalışmanın özgün katkısı, daha önce belirginleştirilmemiş farklılıkları ortaya koyması, sebeplerini ve dayanaklarını açıklaması ve aralarında değerlendirme yapmasıdır.* Ayrıca TKBB standardındaki daha önce müstakil incelenmemiş bazı meseleleri ele almaktadır. Bulgular, her iki standardın muteber şer'î dayanaklara sahip olduğunu; farklılıkların çoğunun toplumsal, siyasal, hukuki özelliklerden veya teknik tercihlerden kaynaklandığını; bazı düzenlemelerin diğerlerinden daha sağlam, tutarlı ve isabetli olduğunu ve ondan fazla meseledeki farkın fıkhî ihtilaftan doğduğunu göstermektedir. Araştırmanın önemi, şer'î bağlılığın dünya ve ahiret bakımından değerinden ve AAOIFI ile TKBB standartlarının öneminden kaynaklanmaktadır. Bunlar içinde pay senetlerine ilişkin standartlar, İslami finans ve ekonomi üzerindeki etkileri sebebiyle özel önem taşımaktadır. Çalışmanın, katılım finansı pay senetlerine ilişkin hüküm ve uygulamaları sağlamlaştırmaya, güveni artırmaya ve bunları reel ekonominin inşasına yönlendirmeye katkı sağlaması beklenmektedir."
