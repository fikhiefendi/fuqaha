abstract: "Bu çalışmada, Hanefî Fakihlerden İmam Tâcüşşerîa Ömer b. Ahmed el-Mahbûbî'nin ‎Nihâyetü'l-kifâye li-dirâyeti'l-Hidâye isimli eseri tahkik edilip incelenmiştir. Söz konusu ‎eser, el-Hidâye'nin en eski ikinci şerhi olup Mergînânî'nin“el-Hidâye şerhu bidâyeti'l-‎mübtedî”adlı eserinin“Kavlühû”tarzında bir şerhidir. Eserin, Buhâra şehri ilim ve ‎siyasetinde ön plana çıkan Orta Asya Sadrüddinzâde Mahbûbî Hanefî fukahâ ailesi ‎hakkında bazı bilinmeyen bilgileri de içermesi yönüyle tahkiki önem kazanmaktadır. ‎ Dünya kütüphanelerinde tespit edebildiğimiz kadarıyla 30 civarında farklı nüshası olup ‎Türkiye kütüphanelerinde 29 farklı nüshası vardır. Konumuza dahil olan kısımlar, birinci ‎cildin Türkiye Kütüphanelerindeki 14 nüshasından 5 tanesiyle karşılaştırılarak tahkik ‎edilmiştir. Asıl nüshamız 713/1313 istinsah tarihli Türkiye'deki en eski ikinci nüsha olan ‎İzmir Milli Kütüphanesi nüshası olup müstensihi Muhammed b. Ebî Abdillâh Yahya b. ‎Muhammed el-Hamâdî'dir. O, Feyzullah Efendi, Edirne Serez ve Ragıp Paşa ‎kütüphanelerindeki nüshaları da istinsah etmiştir. ‎ Tacüşşerîa, açık bir üslupla yazdığı eserinde el-Hidâye'den kavlühû diye zikrederek aldığı ‎bazı kapalı cümleleri, ayrıntılı olarak şerh etmiştir. Hanefî mezhebinin kendinden önceki, ‎kendi çağındaki ve bazen delilleriyle vardığı tercihlerini“ve aleyhi'l-fetva/fetva onun ‎üzerinedir”,“ve bihi yüftâ/onunla fetva verilir”,“ve bihi ne'huzu/biz onu alırız”,“ve ‎aleyhi'l-i'timad/ona itimad edilir”vb. ibarelerle ifade etmiştir. ‎ Çalışmamızda dipnotlarda; müellifin metinde zikrettiği âyet ve hadislerin tahrîci yapılmış, ‎zikredilen yer, şahıs, kişi isimleri ve şiirler hakkında bilgi verilerek ekte indeks olarak da ‎verilmiştir. Dirâse/tanıtım-değerlendirme kısmında İSNAD atıf kuralları, İSAM tahkikli ‎neşir kılavuzu esasları kullanılmıştır. ‎"
