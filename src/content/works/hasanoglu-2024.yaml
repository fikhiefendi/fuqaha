abstract: "Bu araştırma, İslam hukukunun önemli bir yönü olan mali ve ekonomik boyutunu incelemektedir. Araştırma, İslam'ın temel ilkelerinden biri olan zekât ve sadaka üzerine inşa edilen ve İslam'ın başlangıcından itibaren var olan vakıf kurumunu derinlemesine incelemektedir. Özellikle, fıkıh alimlerinin sınıflandırmasına göre sadaka-i cariye olarak kabul edilen vakfa odaklanmaktadır. Araştırma, vakfın mahiyeti, tanımı, kökeni, çeşitleri, amaçları, özellikleri ve İslam'da siyasi, sosyal ve ekonomik rolleri ile Müslüman toplumlar üzerindeki etkileri gibi çeşitli yönlerini incelemektedir. Diğer bir yandan ise sürdürülebilir kalkınma kavramını, alanları ve tanımı açısından ele alarak İslam'ın sürdürülebilir kalkınmadaki rolünü ve İslam'da sürdürülebilir kalkınmanın özelliklerini ortaya koymaktadır. Üçüncü bölümde ise vakıf ile sürdürülebilir kalkınma arasındaki ilişki, vakfın İslam medeniyetinin gelişimine katkıları ve vakfın sürdürülebilir kalkınmanın tüm boyutlarına olan etkileri üzerinden incelenmektedir. Vakıf ile sürdürülebilir kalkınma arasındaki ilişki bu araştırmanın temelini oluşturmaktadır. Araştırma, vakfın tarihsel olarak medeniyetin inşasındaki katkılarını gözden geçirmekte ve vakfın ekonomik boyuttan (vakıfların en iyi şekilde kullanılması), sosyal boyuttan (ihtiyaç sahibi kesimlere destek) ve çevresel boyuttan (vakıf yönetiminde sürdürülebilir uygulamaları teşvik) başlayarak sürdürülebilir kalkınma hedeflerinin gerçekleştirilmesindeki olumlu etkilerini analiz etmektedir. Dördüncü bölümde ise vakfın bir uygulama örneği olarak Türkiye'deki vakıf sistemi incelenmektedir. Bu bölümde, Türkiye toplumunda vakfın merkeziyeti, Osmanlı vakıf mirası ve modern Türkiye'de vakfın günümüzdeki uygulamaları, Türkiye içinde ve dışında kurulan modern Türk vakıfları ve Türkiye'de kurulan modern yabancı vakıflar (bu araştırmanın yenilikçi yönü) gibi konular incelenmektedir. Son olarak, araştırma bu modern vakıf kuruluşlarının ekonomik, sosyal ve çevresel sürdürülebilirlik üzerindeki etkilerini değerlendirerek sonuçlara ulaşmaktadır. Araştırmanın en önemli sonucu, vakfın tüm boyutlarda ve yerel ile küresel düzeyde sürdürülebilir kalkınmayı gerçekleştirmede etkili bir araç olduğu yönündedir. Araştırma, dört ana başlık altında incelenen konularla ilgili olarak bazı geliştirme önerileri ve çözümler sunmaktadır. \"Sonrasında, araştırma, bahsedilen modern vakıf kuruluşlarının ekonomik, sosyal ve çevresel sürdürülebilirlik üzerindeki etkilerini incelemektedir. Sonuç olarak, araştırma vakfın, sürdürülebilir kalkınmanın tüm boyutlarında ve yerel ile küresel düzeyde etkili bir araç olduğu sonucuna varmaktadır. Araştırma ayrıca, araştırmanın dört ana başlığı altında incelenen konularla ilgili olarak bazı geliştirme önerileri ve çözümler sunmaktadır."
