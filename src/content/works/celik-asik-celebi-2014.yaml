abstract: "ÖZET 16. asırda Osmanlı Devleti'nde yaşamış bir kadı ve şair olan Aşık Çelebi (ö.1572), meşhur Hanbeli alimi İbn Teymiyye'nin es-Siyâsetü'ş-Şeriyye isimli eserini Osmanlı diline çevirmiş ve idare, yargı, maliye ve askerlik konularında Osmanlı kamu (amme) hukukuna dair önemli telif bölümler ilave etmiştir. Tercüme ve ilave telif kısımlarından oluşan bu eserine Mirâcu'l-İyâle ve Minhâcu'l-Adâle ismini vermiştir. Yazma halinde olan bu eser, Osmanlıların İslam siyaset düşüncesi ve kamu hukuku konularında, kendilerinden önceki Müslümanların meydana getirdikleri ilmi mirası tevarüs ettiklerini göstermekte ve aynı zamanda Osmanlı'da siyaset-i şeriyye kavramı ve ilgili meselelerin güncelliğini ortaya koymaktadır. Osmanlı siyaset düşüncesinde halife kavramının sadece yönetici anlamında kullanılması, Osmanlıların ehl-i zimmet hukukunu kendisinden önceki devletlerden tevarüs etmiş olması, arazi hukuku ve beytülmal gelir ve giderlerinde fıkhî hükümlerin uygulanması telif kısımlarının tahlilinde detaylı olarak incelenen hususlardır."
