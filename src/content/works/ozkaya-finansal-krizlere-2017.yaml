abstract: "Bu tezde 2000'li yıllardan sonra gelişen Küresel Buhranlar ve Ekonomik Krizlere rağmen hızla büyüyen İslami Finans Politikaların rolü ve bu çerçevede İslami Bankacılığın önemi incelenmiştir. Tarihsel süreç kapsamında Küresel Ekonomik büyümeye katkı sağlayan Katılım Bankacılığı Modelinin Avrupa'ya ve İslam Dünyasına Küresel etkisi çizelge ve şekiller kullanılarak Dünya Finans Piyasalarındaki yeri saptanmış ve incelenmiştir. Bu boyutta özellikle Küresel İslami Bankacılık İşlemlerinde Sukuk Uygulamaların Rolü kapsamlı araştırılmış ve bu vesile ile Önemi Okuyucunun ilgisine sunulmuştur."
