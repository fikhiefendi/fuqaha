abstract: "Salgın ve vebaların incelenmesi, birçok âlimin kitaplarında ve mecmualarında ve muhtelif devir ve devirlerde anlatıp yazdıkları önemli konulardan biridir.Bu bir şeye işaret ediyorsa, İslam dininin insanlığa ve insanlığa olan ilgisini gösterir. Peygamber (sallallahu aleyhi vesellem) pek çok hadisinde bundan bahsetmiştir.Buna sabredenlerin lütuf ve mükâfatı. (Veba, ümmetim için bir şehadettir) sözünden dolayı kendisini şehit saydığı için, bir sakatlıktan sonra ve vebada ölenlerin mükâfatı vardır. Ve Corona salgını (yeni oluşturulan) Covid-19, Müslümanları ve diğerlerini etkileyen veba ve salgın hastalık türlerinden biridir, ancak salgın veya virüs olarak adlandırıldığı için adı farklıdır ve semptomları da farklıdır ve Bu, birçok insanın ölümüne neden olan tehlikeli salgınlardan biridir ve Yüce Allah'ın:(Allah'ın kullarını imtihan ettiği imtihanlardan biridir. ve benim ilgimin ve bu konuyu seçmemin ve bu konuyu risâlemi yazmak için bir başlık haline getirmemin, İslam dininin insanlık için menfaatini temsil eden büyük bir serideki bir halkadan başka bir şey olmadığını, içinde fıkhî hükümleri açıkladığım gibi, (ibadet bölümlerinde) insanların dinlerinin meselesinden haberdar olmaları için bu salgınla tanıştırıldılar; Kafaları karışmasınlar ve Allah'ın gazabına uğrayacak hatalar yapmasınlar diye."
