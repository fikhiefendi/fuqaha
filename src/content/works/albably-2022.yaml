abstract: "Bu çalışma, İslam ekonomisinin hedeflerine ulaşmada ulusal stratejik planlamanın rolünü ele almıştır. Çalışma, tümevarımsal yaklaşımı ve tanımlayıcı analitik yaklaşımı kullanarak, İslam ekonomisinin hedeflerine ulaşmada ulusal stratejik planlamanın rolünü bilmek için literatür taraması yapılmişhr. Çalışma, Çin, Malezya ve Güney Kore gibi son yıllarda bazı başarılı ülkeler için bir ulusal stratejik planlama biçimi olarak kalkınma stratejileri modellerini ele aldı. İslam ekonomisinin hedefleri de ele alınarak, bu hedefler için üç eksen önerildi: birey, devlet ve toplum. Çalışma, ulusal stratejik planlamanın İslam ekonomisinin hedeflerine ulaşmada nasıl bir rol oynadığını gösterdi. Çalışma, kalkınma stratejileri için önerilen bir model geliştirdi. Bu model, (1) kalkınma stratejilerini mümkün kılan unsurlar, (2) bu stratejilerin faaliyet gösterdiği eksenler ve (3) bu stratejilerin hayatta kalmasını ve sürekliliğini sağlayan süreklilik faktörleri olmak üzere üç unsurdan oluşmaktadır. Çalışma, İslam ekonomisinin hedeflerine ulaşmada ulusal stratejik planlamanın, özellikle kalkınma stratejilerinin etkinleştirilmesinin önemini gösteren sonuçlara ulaşmıştır."
