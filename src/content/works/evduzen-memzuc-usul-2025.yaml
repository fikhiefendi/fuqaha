abstract: "Hicrî V. yüzyılda Bâkıllânî'nin ürettiği birikim üzerinden hareket eden Eş'arî fıkıh usulü yazımı, h. VI. yüzyılda Irak'ın dışında daha da etkili olarak İslam coğrafyasının büyük kesiminde kabul gören bir öğreti geliştirdi. Muhtelif mezhep müntesiplerinin takip ettiği bu öğreti kendi doktrinleri içinde özümsenerek ortak ifade kalıplarıyla benimsendi. H. VII. yüzyılın hemen öncesi ve başlarında ise Eş'arî usulünde bir yenilenme yaşandı. Gazzâlî'nin kabul gören usul anlatısı üç Eş'arî figür (Râzî, Âmidî ve İbnü'l-Hâcib) tarafından baştan aşağı değiştirilerek yeniden ele alındı. Burada sadece eskinin anlatısı takip edilmiyor, ayrıca dönemin yükselen ilimlerinin taleplerini dikkate alan bir çerçeve teklif ediliyordu. Hanefî usulcülerin metinleri ise bir yenilenme içermiyor, Pezdevî'nin son şeklini verdiği geleneksel usul anlatısı üzerinden ilerliyordu. İki ekol arasındaki farklılıklar uzunca bir süre belirginliğini korudu. Hanefîler ve buna paralel olarak Eş'arî/Şâfiîler birbirlerini ve entelektüel miraslarını h. VII. yüzyılın sonlarına kadar dikkate almadılar. Selçuklularla başlayan ve devamında Moğol istilalarıyla güçlenen göç dalgaları sonrasında Hanefîlerin Eş'arîlerin yoğun olduğu bölgelerde varlık göstermesi bu durumu değiştirdi. Yaşanan bölgesel yakınlaşma sonucunda Hanefî usul metinlerinde iki büyük dönüşüm meydana geldi. Hanefîler Eş'arîlerin ürettiği usul birikimini dikkate almaya başlayıp Hanefî bir perspektifle işleyerek kendi geleneklerine mal ettiler ve yanı sıra aralarından bir grup yeni câmi bir model geliştirdi. Bu bağlamda çalışma, h. VIII. yüzyılın eşiğinde cereyan eden iki okul arasındaki entelektüel etkileşimin izlerini sürmekte ve müteahhir dönemde Hanefîlerin (İbnü's-Sââtî, Sadrüşşerîa, Molla Fenârî, İbnü'l-Hümâm, Molla Hüsrev ve Bihârî) Eş'arî usulüyle olan hikayesini anlatmaktadır."
