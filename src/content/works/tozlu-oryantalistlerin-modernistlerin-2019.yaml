abstract: "Bu çalışmada modernistlerin ve oryantalistlerin Kur'ân'a yaklaşımları mukayese edilmiştir. Mukayese sonucunda iki taraf arasında bir etkileşimin bulunup bulunmadığı sorusuna cevap aranmıştır. Her iki tarafın görüşleri kendi içinde tahlil edilmiş daha sonra ortak ve farklı yönler tespit edilmeye çalışılmıştır. Mukayese esnasında gerekli görülen yerlerde değerlendirme yapılmıştır. Oryantalizm, çağdaş dönem aydınlarının Kur'ân tasavvurunun şekillenmesinde etkili olmuştur. Söz konusu etkileşimin sonucunda islâmî bir metin İslâm dışı bir ortamda yorumlanmak istenmiştir. Bu etkiyi ve tesiri kabul etmeyen geleneksel anlayış ise arka plana itilmiştir. Bu dönemde aslından farklı bir şekilde kullanılan Batılı metotlardan, Rönesans ve Reform hareketlerinden sonra gündeme gelen Batılı değerlerden oluşan yeni bir tefsir usulü geliştirilmiştir. Hz. Peygamber geleneksel sistemdekinden farklı bir konuma konulmuştur. Peygamber hakkındaki ümmilik kavramı farklı şekilde yorumlanmış Peygamber'in okuma yazma bildiği iddia edilmiştir. Ayetlerin lafızlarının Peygamber'e ait olduğu ifade edilmiştir. Batı'dan etkilenilmesi sonucu çağdaş dönemde klasik dönemden farklı bir Kur'ân tarifi yapılmış ve tefsire farklı bir işlev yüklenmiştir. Kur'ân dışındaki kaynaklar işlevsiz hale getirilmiştir. Bu hususta Protestan misyonerlerdeki tek başına metin yeterlidir anlayışı çağdaş dönemde modernistlerin Kur'ân'a ve Hadis'e bakışlarını şekillendirmiştir. Kur'ân Batı'daki Kutsal metinlerle kıyaslanmıştır. Bunun sonucunda ayetler arasında uyumsuzluk olduğu ve metinde gramer hatası bulunduğu iddia edilmiştir. Hükümlerin modern insanlara hitap etmediği bu sebeple yeniden yorumlanması gerektiği iddia edilmiştir. Ayetler bilimsel bir çerçevede yorumlanmış bilimle bağdaşmayan kısımlar ise tevil veya inkar edilmiştir."
