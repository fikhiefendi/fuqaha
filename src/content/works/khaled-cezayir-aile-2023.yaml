abstract: "Bu çalışma, İslam hukuku çerçevesinde evlilik ve evliliğin sona ermesi konularındaki hükümleri karşılaştırmak amacıyla Cezayir Aile Kanunu ile Osmanlı Hukuk-ı Aile kararnamesini incelemektedir. Her iki kanun da kökenlerini İslam hukukundan alsa da, içtihat farkları ve eleştirilere açık noktalar bulunmaktadır. Her iki hukuk sistemi de nişanın evliliğin bir ön hazırlığı olduğu konusunda anlaşmaktadır, ancak nişanın bir sözleşme olmadığını vurgularlar. Evlilik akdinin rükunları konusunda ise her iki kanun da evlilik akdinin temel rüknünün rıza olduğunu kabul eder. Evlilik akdinin şartları, esasa ilişkin ve şekle ilişkin şartlar olmak üzere iki kategoriye ayrılmıştır. Bu şartlar arasında evlenme ehliyeti, mehir, velayet, şahitlik, evlenme engelinin bulunmaması, önceki evlilik durumu, denklik ve tıbbi muayene bulunmaktadır. Cezayir Aile Kanunu ile Osmanlı Hukuk-ı Aile kararnamesi arasında benzerlikler ve farklılıklar bulunmaktadır. Her iki kanun da mehrin kadının hakkı olduğunu kabul eder, evlenme akdinde iki şahidin bulunmasını sıhhat şartlarından biri olarak belirler. Ancak, mehir konusunda Cezayir Aile Kanunu'nun mehri evlilik akdinin bir şartı olarak görmesiyle, Osmanlı Hukuk-ı Aile kararnamesi mehri evlilik akdinin bir sonucu olarak kabul eder. Cezayir Aile Kanunu, Osmanlı Hukuk-ı Aile kararnamesi'nde olmayan şartları içerir. Her iki kanun da evlenme akdinin resmi makamlara tescil edilmesini şart koşar. Bu şartın amacı, eşlerin ve çocukların haklarını korumak ve evlilik sürecini devlet kontrolü altında tutmaktır. Evlilik akdinin hükümleri açısından kadın-erkek eşitliği konusunda adımlar atılmış, kadınların hakları ve onuru korunmuştur. Evlilik mal rejimi konusundaki etkileri taşıyan her iki kanun, neseple ilgili konuları ele alırken Cezayir Aile Kanunu'nun modern bilimsel yaklaşımlara uygun güncellendiğini gösterir. Evlilik nafakası hükümleri, İslam hukukuna dayanır ve kadınların ekonomik haklarını korumayı amaçlar. Her iki kanun da evliliğin sona ermesi konusunda üç yöntemi kabul eder: boşanma, tefrik ve hul'. Cezayir yasası her iki hususu da evlilik bağının sona ermesinin neticesi olarak ele alırken, Osmanlı yasası sadece bekleme süresine ilişkin hükümleri ele almıştır."
