abstract: "Bu çalışmada İslam iktisadının özellikle son yüzyılda ekonomik birimler arasında öne çıkan merkez bankasına bakışı ve İslam iktisadı bağlamında para politikasının ne olduğu, nasıl uygulandığı ve uygulanabileceği üzerine araştırma yapılmıştır. Konvansiyonel sistemin para politikasına dair fikirlerinin ve uygulamalarının çoğunlukla İslam iktisadının temel aldığı değerler çerçevesinde yasak olan faiz üzerine kurulması sebebiyle İslam iktisadı bağlamında para politikası kamuoyunda ilgi çekmektedir. İslam iktisadı bağlamında merkez bankacılığı ve para politikasının ilgi çekmesine karşılık İslami finanstaki gelişmeye oranla gelişimi oldukça sınırlı kalmıştır. Bu alandaki çalışmaların az olması, uygulama sahasının da birkaç ülke ile sınırlı kalması neticesinde ve konvansiyonel sistemde para politikasında faize oldukça etkin rol verilmesi nedeniyle İslam iktisadı bağlamında para politikasının yürütülmesine dair soru işaretleri oluşmuştur. Çalışma süresince İslam iktisadının son yüzyıldaki finans alanındaki literatür zenginliğine bakıldığı zaman aynı literatür zenginliği para politikası için geçerli olmadığı görülmüştür. Özellikle 2008 krizi sonucunda konvansiyonel sistemin kusursuz olmadığı ve finansal yapıda istikrarsızlıkları tetiklediği düşüncesi alternatif politikalar için arayışları beraberinde getirmiştir. Son 20 yılda İslam iktisadı ve para politikası alanında çalışmaların arttığı görülmüştür. Alanın kendine özgü politika araçları geliştirmesi ve uygulaması ile İslam iktisadı bağlamında merkez bankacılığının ve para politikası uygulamalarının yürütülebildiği sonucuna varılmıştır. Ancak daha iyi bir biçimde yürütülebilmesi için hem daha fazla çabaya hem de birincil ve ikincil piyasaların gelişebilmesi için zaman ihtiyaç olduğu sonucuna varılmıştır. Para politikası araçlarına ve finansal enstrümanlara geniş yer verilerek sonuç açık bir biçimde ortaya konmuştur."
