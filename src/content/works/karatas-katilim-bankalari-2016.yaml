title: "Katılım Bankaları ile Mevduat Bankaları Finansal Performanslarının Çok Değişkenli Karar Verme Yöntemleri ile Karşılaştırılması: Borsa İstanbul'da İşlem Gören Bankalar Üzerine Bir Uygulama (2004-2014)"
titleTranslation: {"en": "The comparison of financial performances of participation and deposit banks by mutivariate decision making methods: An application on the banks traded in İstanbul Exchange (2004-2014)"}
