abstract: "Ülkelerin finans sisteminin sağlıklı bir yapıda olması, o ülkedeki bankacılık sistemi ile yakından ilgilidir.Çünkü bankalar finansal sistemin en önemli yapı taşıdır. Bu çalışmada, Borsa İstanbul'da işlem gören 2 Katılım Bankası ve 12 Mevduat Bankasının 2004-2014 yılları arasındaki performansı Çok Değişkenli Karar Verme yöntemleriyle incelenmiştir. Çalışmada GRİ İLİŞKİSEL ANALİZ, TOPSIS ve VIKOR analiz yöntemi kullanılmıştır. Çalışma sonucunda; GRİ İLİŞKİSEL ANALİZ yöntemine göre, en yüksek performansa sahip banka Vakıfbank, en düşük performansa sahip banka ise Şekerbank olmuştur. Vakıfbank TOPSIS analizine göre yine en yüksek performanslı banka olarak karşımıza çıkmıştır. TOPSIS analizine göre düşük performansa sahip banka Bank Asya olmuştur. Son olarak VIKOR yönteminde ise en yüksek performans Denizbank'a aittir. Performansı en düşük banka ise Albaraka Türk olarak belirlenmiştir. Genel bir değerlendirme yapıldığında, bankacılık sektörünün karlı bir yapısı olduğunu ve her geçen gün büyüdüğünü söylemek mümkündür. Ancak Bank Asya'nın son dönemde yaşadığı sıkıntılı süreçler performansının düşmesine neden olmuş ve böylece bu banka beklenen performansı sergileyememiştir."
