abstract: "Avrupa'da İslam ekonomisi ve finansına yönelik çalışmaların 20. yüzyılın ortalarından günümüze kadar geçen süreçte önemi artmıştır. Bu araştırma ile İslam ekonomisi ve finansı alanındaki çalışmaların ve uygulamaların Avrupa'da izlediği sürecin ortaya konulması amaçlanmıştır. Avrupa'da İslam ekonomisi ve finansı alanıyla ilgili çalışmamıza dahil olan ülkeler ise şunlardır: İngiltere, Almanya, Hollanda, İsveç, İtalya, Fransa, Litvanya ve İsviçre. Araştırmanın birinci bölümünde Avrupa'da İslam ekonomisi ve finansı ilk olarak nerede ve nasıl ortaya çıktığı ile hangi üniversitede ilk çalışmaların başladığı incelenmiştir. Ayrıca İngiltere'deki İslam ekonomisi ve finansı alanında eğitim veren kurumlardan detaylıca bahsedilmiştir. İkinci bölümde ise Avrupa'da İslam ekonomisi ve finansının gelişimi ile ilgili çalışma yapan kişiler, kurumlar, üniversiteler ve bu alanda yazılan makaleler, kitaplar, tezler ve raporlar ayrı başlıklar altında detaylandırılarak anlatılmıştır. Ayrıca bu bölümde literatürde yer alan çalışmalar incelenmiş ve uygulanan modeller hakkında bilgi verilerek kaynak tarama yöntemi kullanılmıştır. Özellikle Modern İslamî finansın gelişimindeki tarihsel eğilimler, mevcut bilgilere, kaynaklara ve metodolojiye dayanan kısıtlamalar ve fırsatlar bağlamında ileri sürülen öngörülerden bahsedilmektedir. Bu araştırmada, Avrupa'da İslam ekonomisi ve finansı alanında yapılan çalışmaların akademik açıdan sayılı üniversitelerde teorik ve uygulamalı bir şekilde giderek artan bir seyir izlediği gözlemlenmiştir. Ayrıca incelenen çalışmaların içerik kısmında ampirik tespit edilen bulguların bilinçli bir şekilde anlaşılması yoluyla rollerinin nasıl iyileştirileceği konusunda stratejiler verilerek detaylı bir şekilde yazılmıştır. Gerek iktisadi kurum ve kuruluşlar gerekse akademik çevreler arasında iş birlikleri oluşturulduğu, ortak organizasyonların ve merkezlerin kurulmakta olduğu gözlemlenmiştir."
