abstract: "Aile, kişinin ilk sosyalleştiği, dini, temel değerlerin öğrenildiği, sevginin ve muhabbetin başladığı bir yuvadır. Aile bu özelliğiyle dini, manevi, duygusal bir yapıya sahiptir. Ailede içtimai, beşerî ve mali münasebetler de söz konusudur. Çünkü ailede eşlerin mallarının idaresi, kullanımı, tasarrufu gibi ilişkilerin yanında onların boşanmaları durumunda konu olan bu malvarlığı değerlerinin pay edilmesi durumu da mutlak bir gerçektir. Bu araştırmada gerek Türk Hukukunda gerekse İslam Hukukunda ailede eşlerin mallarının yönetim ve tasarrufu ve boşanmayla birlikte bunların bölüşümünü konu edinen mal rejimleri ele alınmaktadır. Mal rejimleri, geçmişte olduğu gibi günümüzde de önemli olan bir husus olmaktadır. Türk Medeni Kanunu'nun iktibas edildiği ve Avrupa'daki devletlerin kaynağını oluşturduğu bu hukuk sisteminin kökeninin Roma'ya uzandığı bilinmektedir. Batı'nın hukuk sistemi evlilikte kadının ehliyetine, hak ve tasarruflarına yönelik sınırlayıcı bakış açısından dolayı asırlarca tartışılan bir mesele olmuştur. Lakin İslam hukuk sisteminde kadın ve erkek ayrımı olmaksızın onlara sunulan hak ve fiil ehliyetlerinin çok geniş tutulduğu bilinmektedir. İslam'da kadın ve erkeğe sunulan bu hakların şahsi mülklerinin tasarrufuyla yönetimini de kapsadığı görülmektedir. Nitekim İslam, karı ile kocanın mallarında tasarruf ve yönetiminde mal ayrılığı rejimini benimsemektedir. Türk Medeni Hukuku'nda söz konusu olan mal rejimlerinin İslam Aile Hukuku bakımından ele alındığı bu çalışmada, Türk Medeni Hukuku'nda düzenlenen mal rejimlerinin, İslam aile hukuku perspektifinden incelenerek karşılaştırılması ve bu iki hukuk sistemindeki benzerlikler ile farklılıkları ortaya konulmaya gayret edilmektedir. Her iki hukuk sistemindeki farklılıkların temel nedeni evliliğe bakış açılarının aynı olmamasıdır. Nitekim, Türk hukukunda evlilik, eşlerin mallar üzerinde paylaşım yapmayı ve ortaklık kurmayı bir sebep olarak görürken; İslam hukukunda bu, bir neden teşkil etmemektedir."
