abstract: "Bu çalışmada boşanma sonrası çocuklar için verilen nafaka kavramı İslâm hukuku ve Medeni Hukuku kapsamında mukayese edilmeye çalışılmıştır. Çalışma her ne kadar Hanefî mezhebi özelinde olsa da gerekli görülen yerlerde diğer mezheplerin görüşlerine de yer verilmiştir. Çalışmanın ikinci bölümünde tezin ana ekseninde bahsi geçen hidâne ve iştirak nafakası kavramlarını açıklayarak konu ile alakalı olarak yapılan önceki çalışmalara yer verilmiştir. Üçüncü bölümde hidâne ücreti konusu genel hatlarıyla ele alınmıştır. Dördüncü bölümde hidâne ücreti konusu ele alınarak bakılması gereken çocuğun hangi durumlarda ücret alacağı, ne kadar ücret alacağı, nafaka ile sorumlu olanların kimler olduğu ve nafaka ödemedeki sorumluluk dereceleri ele alınmaya çalışılmıştır. Bu araştırmada Medeni Hukukta iştirak nafakası ile İslâm hukukundaki hıdane ücreti konuları içeriksel ve ana başlık olarak birbiriyle örtüşecek şekilde ele alınmaya gayret edilmiştir. Bunun dışında çalışmanın tamamında İslâm hukuku ile Medeni Hukukun bakıma muhtaç çocuk özelinde ortaya çıkan ücret konusu benzediği ve ayrıldığı noktalarda mukayese yapılmaya çalışılmıştır."
