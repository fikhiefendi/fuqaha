abstract: "Bu araştırmada, Kürtler arasında yayılan İslam mezheplerinin aydınlatılması hedeflenmiştir. Bunun için Kürt coğrafyasının Müslümanlar tarafından fethedilme ve Ehl-i Sünnet mezhebinin söz konusu bölgeye hakim olma süreci ele alınmıştır. Ayrıca Kürt coğrafyasında faaliyet gösteren Sünnî fıkıh mezhepleri ve onların önde gelen isimlerinden söz edilmiş, bu arada Şâfiîliğin diğer mezheplere göre daha baskın olduğu vurgulanmıştır. Ardından Kürt bölgelerindeki Haricî hareketlere ve Kürtlerin bu hareketleri destekleme nedenlerine değinilmiş, yanı sıra Kürtlerin başlattığı veya desteklediği en önemli isyanlar zikredilmiştir. Daha sonra Haşebiyye, Zeydiyye, İmâmiyye ve Gulâtü'ş-Şiâ gibi bölgede zuhur eden Şiî fırkalara değinilmiştir. Öte yandan Kürt coğrafyasında faaliyet yürüten sûfî gruplar ve tarihi süreçleri de unutulmamıştır. Bunlardan Adeviyye Tarikatı merkeze alınmış; doğuşu, ilkeleri, önemli şahsiyetleri ve yaşadığı sapmalar izah edilmiştir. Belirlenen hedeflere ulaşmak için bu araştırmada üç metottan yararlanılmıştır. Bunlardan biri olan deskriptif metot sayesinde Kürt coğrafyasında görülen mezheplerin durumları hakkında derinlik sağlanmıştır. Ayrıca söz konusu zaman dilimindeki siyasi, sosyal ve diğer durumlar tasvir edilmiştir. Yine Kürt coğrafyasının Müslümanlarca fethi, tarihi olaylar ve mezheplerin söz konusu coğrafyada ortaya çıkış süreçleri ele alınırken de deskriptif metottan istifade edilmiştir. Daha sonra analitik metoda başvurularak gelişen olaylar, Kürt coğrafyasında farklı mezhep ve dinlerin ortaya çıkmasında etkili olan faktörler ve araştıma sonucunda elde edilen bulgular analiz edilmiştir. Bununla da muğlak olan bazı hususların açığa kavuşturulması ve sağlıklı sonuçların elde edilmesi hedeflenmiştir. Ayrıca tümevarım yönteminden de istifade edilerek, el-milel ve'n-nihal kitaplarının ve birincil tarihi kaynakların mezheplerle ilgili kaydettiği bilgiler bir araya getirilmiştir. Bu araştırmada bazı önemli sonuçlara ulaşılmıştır. İslam'ı benimseyen diğer uluslar gibi Kürtler de gelişen tarihi olaylardan etkilenmiş ve içlerinde birçok fırka neşet etmiştir. Ayrıca kimi zaman topraklarına hakim olan unsurlara karşı isyanlar geliştirmiş ya da başkalarının başlattığı isyanlara destek vermişlerdir. Şu kadar var ki İslam'ı benimseyen Kürtlerin büyük çoğunluğu Sünnîliği ve onun fıkhî mezheplerinden biri olan Şâfiîliği benimsemişlerdir. Bununla birlikte sınırlı sayıda diğer mezhepleri benimseyenler de olmuştur. Kimi Kürtler Haricileri desteklemiş ve başlattıkları isyanlara katılmış olsalar da aslında bunu hakim devletin sultasından ve vergi yükünden kurtulmak gayesiyle yapmışlardır. Bu araştırma Kürtlerin sûfî hareketlerden de etkilendiği sonucuna varmıştır. Adeviyye gibi bazı aşırı sûfî gruplar da Kürtler içinde görülmüştür. Adevilik, süreç içerisinde ikiye ayrılmış, bir bölümü İslam'dan saparak Yezidilik adıyla bağımsız bir dine dönüşürken diğer bölümü ise inanç esaslarına bağlı kalmıştır. Son olarak söz konusu bölgede zuhur eden mezheplerin tarihi süreçlerinin araştırılması gerektiği teklif edilmektedir. Zira daha önceki araştırmacıların değinmediği birçok şey bulunmaktadır. Bu araştırma ise bu hususta ancak mütevazi bir çalışma sayılabilir."
