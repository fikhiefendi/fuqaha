abstract: "Devletin yaptırım gücüyle desteklenmiş ve alacaklısına hakkını devlet zoruyla alma imkânı sağlayan bu tür borçlara medenî/tam borçlar; müeyyide unsurundan mahrum borçlara ise eksik/tabiî borçlar denir. Roma hukukunda tabiî borç (obligatio naturalis) olarak adlandırılan ve günümüz hukukunda Borçlar Hukuku içinde düzenlenen eksik borçlar, kanunun medenî borçlar seviyesinde desteklemediği, ama tamamen hükümsüz de saymayıp birkısım sonuçlar bağladığı borçları ifade etmektedir. Borçlar hukuku alanında ayrıcalıklı ve istisnaî bir yeri temsil eden ve eksik borç kavramı, fıkıh, ahlâk, hukuk ve siyaset felsefesiyle ilgili temel meselelerin kesişim noktasında durması açısından büyük ehemmiyeti haizdir.İslâm hukukunda, doğuş şartları, özellikleri ve sonuçları açısından Roma-Türk hukuk literatürü içinde ?tabiî/eksik borç? olarak isimlendirilen borç türüyle bazı hususlarda paralellikler gösteren, bazı hususlarda farklılıklar sergileyen ve ifası yargı yoluyla elde edilemez ama geçerli şekilde ifa edilebilir borçlar bulunmaktadır. İslam hukukundaki eksik borçlar, kazâî hüküm-diyânî hüküm ayırımına dayanmakta olup diyânî borçların bir altkümesini teşkil etmektedir. Bu çalışmada, Roma hukukunda doğan ve Kıta Avrupası üzerinden günümüz Türk hukukuna geçen ?eksik borç? kavramı İslâm hukuku açısından incelenmiş, tabiî/eksik borçlara dair düzenlemeler çerçeve edinilerek İslâm hukukundaki benzeri borçlar tasnif edilmiş, kaynakları ve sonuçları açıklanmış ve Roma-Türk hukukundaki tabiî/eksik borçlarla İslam hukukundaki eksik borçların benzerlik ve farklarına işaret edilmiştir."
