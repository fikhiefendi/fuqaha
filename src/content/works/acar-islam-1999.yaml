abstract: "ÖZET Denizcilik sektörünün ve limanlarla liman işletmeciliğinin uluslararası önemli bir faaliyet olduğu bilinmektedir. 8.333 km. kıyı şeridine sahip ülkemizin jeopolitik konumunun ne kadar önemli olduğu ve ülkemizin jeostratejik bir konumda olduğu açıktır..Ancak bunların yanısıra denizcilik sektörümüz ile limanlarımız mevcut uygulamalar ve yasal düzenlemelerle günümüzdeki bürokratik sistemde beklenen gelişmeyi gösterememektedir. Ayrıca ülkemizin her gün bir yenisi yayınlanan uluslararası konvansiyon ile denizcilik sektörüne getirilen yenilikler ve standardizasyonlann gerisinde kaldığı için büyük kayıplara uğradığı da bir gerçektir. Türkiye açısından büyük bir potansiyel olan ve ülkemizin ekonomik gelişiminde lokomotif görevini üstlenebilecek denizcilik sektörü ile buna bağlı olarak limanlarımızın, istenen ve beklenen düzeyde ülkeye katkı sağlaması ve ülkemizin ekonomik gelişiminde rol oynaması için, etkin kullanımlarının verimli çalıştınlmalanmn ve bunlara bağlı olarakta. marjinal faydalarının bir an önce yükseltihnesinin gerektiği açıkça görülmektedir. Limanlar ülkelerin nefes alabileceği dışa açılan pencereleridir. Dikkat edilirse limanı iyi olan ülkelerin ekonomileri de iyidir. Özelleştirme limanların ve Türkiye'nin kurtuluşu olacaktır. Ülke ekonomisine katkısı oldukça yüksek olan İzmir Limanı'nm kullanıcılara ve gemi sahiplerine daha iyi hizmet verebilmesi, hizmet kalitesinin ve kapasitesinin yükseltilerek daha verimli ve rantabl bir hale getirilebilmesi için öncelikle sorunların tespit edilmesi ve daha sonra bu sorunlara en uygun çözümün bulunması için tüm çözüm önerilerinin değerlendirilmesi gerekmektedir."
