abstract: "Finansal rasyolarla bankaların karşılaştırılması, dünyada bir kaç akademik çalışmada kullanılmıştır. Bu çalışmada, Katılım Bankaları'nın ve Klasik Mevduat Bankaları'nın finansal performans karşılaştırılması için, karlılık, likidite ve risk rasyoları kullanılmıştır. Elde ettiğimiz sonuçlar, rasyoların ortalaması göstermektedir ki Likiditede, Klasik Bankalar ile katılım Bankaları arasında açık bir fark bulunduğunu söyleyemiyoruz. Ancak Risk rasyoları göstermektedir ki Klasik Bankaların finansal yapısı daha sağlamdır. Karlılık rasyoların da ise Katılım Bankaları ise elinde bulundurduğu varlıkları daha verimli kullandığı gözükmektedir. T-test sonuçları ise sadece iki rasyoda anlamlı derecede fark olmadığını göstermektedir. Altı rasyoda ise yıllara göre sonuçlar farklılık göstermektedir."
