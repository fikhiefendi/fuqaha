abstract: "Klasik fıkıh kitaplarının yazıldığı zamanlarda muayene ve teşhis için yeterli teknik donanım olmadığından fukaha, âdet döngüsünü tespit edebilmek amacıyla çoğunlukla, âdet ve temizlik dönemlerinin asgari ve azami sürelerini dikkate almıştır. Bu süreleri de konuyla doğrudan ya da dolaylı ilgileri olan rivayetlerle belirlemişlerdir. Özellikle Hanefî mezhebinde âdet ve temizlik dönemlerinin asgari ve azami süreleri, dinin belirlediği miktarlar olarak kabul edilmiş, konuyla ilgili tıbbi açıklamalar, kadının kanaati ve örf (sosyal veri), hükme giden sürecin dışında bırakılmıştır. Şâfiî, Mâlikî ve Hanbelî mezheplerinde ise Hanefî mezhebinden farklı da olsa asgari ve azami süreler belirlenmiş olmakla birlikte kadının âdet kanamasıyla özür kanamasını birbirinden ayırt etme yetisine (temyize) de önem verilmiştir. Öte yandan, çevrelerindeki kadınların âdet düzenlerini de araştıran fakihler, elde ettikleri bilgileri hükme varırken örfi delil olarak kullanmışlardır. Bu da Hanefî mezhebiyle diğer mezhepler arasında önemli bir usul farkı ortaya çıkarmıştır. Âdet döngüsü, kadının yaşı, mutadı, hastalığı, doğum kontrol yöntemi, kullandığı ilaçlar, psikolojik durumu ve çevresel koşullara göre farklılık gösterir. Bu itibarla âdet dışında başka bir sebeple açıklanabildiği takdirde standart süreler içinde kaldığı gerekçesiyle her kanama/lekenin âdet süresine dahil edilmesi ihtiyatlı bir yaklaşım değildir. Çünkü yanlış tespit edilen âdet döngüsü sebebiyle ibadet ve aile hayatındaki birçok dinî hüküm de isabet etmemiş olur. Âdet döngüsünün tespitiyle ilgili alan uzmanlarının görüşleri yol gösterici olmalıdır. Ayrıca kadınların, kanamanın niteliği ve vücuttaki semptomları gözlemleyerek kendi kanaatlerine göre amel etmesi, içinde bulundukları durumla daha uyumlu olacağı için ibadet ve aile hayatındaki huzura katkı sağlayacaktır."
