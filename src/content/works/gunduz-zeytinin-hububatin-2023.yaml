abstract: "Tezimizde Çanakkale ilinin Çan ve Ezine ilçelerinde üretilen hububat ve zeytinin üretim ve pazarlama sürecinde yapılan işlemlerin İslam hukukuna uygun olup olmadığı fıkhî açıdan değerlendirilmeye çalışılmıştır. Tezimiz giriş, iki bölüm ve sonuçtan oluşmaktadır. Birinci bölümde hububat ve zeytinin üretimi için yapılan toprak kiralama, ziraat ortakçılığı ve bağ-bahçe ortakçılığı, ikinci bölümde ise bu ürünlerin pazarlamasında başvurulan peşin satım, vadeli satım ve dalında satım işlemlerinin yapılış şekilleri tespit edilip Hanefî mezhebinin görüşleri esas alınarak değerlendirilip yorumlanmıştır. Araştırmamız Çan ve Ezine ilçelerinde üretim ve pazarlama yapan birçok çiftçi ve tüccar ile yaptığımız görüşmelere ve bölgede yapılan muâmelâta dair gözlemlerimize dayanmaktadır. Elde ettiğimiz veriler çerçevesinde araştırma bölgemizde hububat ve zeytinin üretim ve pazarlama sürecinde yapılan muâmelâtın incelenmesi sonucunda bunlar içinde İslam hukukuna uygun olanlar ve uygun olmayanlar tespit edilip her birinin gerekçesi ortaya konmaya çalışılmıştır. Yapılan işlemlerde İslam hukukuna uygun düşmeyen ve akdi fâsit kılan uygulamaların bulunduğu, bunların da çoğunun akitle ilgili bilinmezlikten (cehâlet) kaynaklandığı tespit edilmiş, hukuka uygun hale getirilmesi için çeşitli önerilerde bulunulmuştur."
