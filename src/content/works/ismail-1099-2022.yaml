abstract: "Bu çalışmada Celbe Musa Efendi (ö. 1132'den sonra) olarak meşhur olan/tanınan Kadı Abdülkadir'in Fevâidü'l-Fukahâ isimli eserinin üçüncü cüzünü ele aldım. Eserin tamamının tahkikine benim haricimde bir grup öğrenci de katıldı. Ben eserin 94. sayfasından sonuna kadar tahkik ettim. Adı geçen kitapta birçok fıkhi mesele, farklı İslam hukukçularının görüşleri ve birçok hüküm yer almaktadır. Örneğin tüm yönleriyle bey'/alış veriş, caiz olan ve caiz olmayan bey', fasid bey', hıyâru ru'ye/görme muahyyerliği ve benzerleri gibi. Bunların yanı sıra şuf'a, icâre, edebü'l-kâdî, bu konudaki fetvalar, kişinin her hangi bir konuda bir mezhepten diğerine geçişi, kazayı bozan ve bozmayan meseleler, şehâdet ve bâbları, dava ve ilgili konular, ikrâr ve hasta kişinin ikrârı ile ilgili meseleler, vekâlet, vekilin tasarrufları, kefâlet, kefilin sorumlulukları, sulh, rehin, rehin alan ve verenin sorumlulukları, müzâraa ve şartları, mudârebe ve mudarebe için caiz olanlar, arazi sulama ve bunun nasıl olacağı, eş' ribe/içecekler, içilmesi haram olan şeyler, kurban ve şartları, me'zûn/izinli ve hacr/engelliler ve bunların yaptıklarından sahih olanlar, cinayetler, öldürme ve vücut bütünlüğüne verilen zararlar, bu konuyla ilgili kasâme bâbı, hayvanların öldürülmesi gibi konular yer almaktadır. Yine gasp ve gasp edenle ilgili hükümler, ateş ile telef etme, telef edilenin nasıl tazmin edileceği, vasiyetler, ferâiz ve hıyel ile ilgili konular yer almaktadır. Adı geçen eserin sonunda ilim ve fıkhın önemine dair hikmetli sözler bulunmakta ve müellif bize Peygamberimiz'in (s.a.v.) doğum ve vefat tarihlerini, raşid halifelerin hilafete geçişleri ve benzeri faydalı bilgileri de vermektedir. Bu çalışmada Fevâidü'l-Fukahâ isimli eserin bir kısmını, el yazması eserlerin tahkik yöntemlerine bağlı kalarak tahkik ettim. Çalışma üç kısımdan meydana gelmektedir. 1. Kısımda müellifin hayatı ve yaşadığı dönem incelendi. Müellif alim, kadı, hikmet sahibi yargıya ehil olan zeki bir şahsiyettir. Kendisinin Fevâidü'l-Fukahâ' dışında Ahkâmu'n-Nâtıfî gibi farklı eserleri de vardır. Ayrıca bu bölümde müellifin yaşadığı dönemin siyasi, ekonomik, sosyal ve kültürel olaylarına da yer verildi. 2. Kısım Fevâidü'l-Fukahâ' isimli eserin incelenmesi, tahlili, eserin yazara ait olup olmadığı, kitabın isimlendirilmesi ve özellikleri, el yazması nüshanın nitelikleri, ,ve eserin tahkikinde takip edilen metoda tahsis edildi. Bunların yanında el yazması (ا) ve (ب) nüshalarının ilk ve son sayfalarının sureti ilave edildi. Son olarak ta eserde yer alan bazı meseleler tahlil edildi. 3. Kısımda tahkik edilen metin ve sonunda kaynaklar zikredildi."
