abstract: "Birinci Dünya Savaşı'nı kaybeden Osmanlı İmparatorluğu, savaş sonrası ilân edilen Mondros Mütarekesi ile İtilâf Devletleri'nin işgaline uğramıştır. Bu işgal sırasında, özellikle Batı Anadolu'da müslüman halka yapılan mezalim, Anadolu Millî Hareketi'nin doğmasına zemin hazırlamıştır. Anadolu insanı, Mustafa Kemal ATATÜRK'ün önderliğinde giriştiği Kurtuluş Mücadelesini kazanarak genç Türkiye Cumhuriyeti Devleti'ni kurma başarısını göstermiştir. Böylece Türk Milleti için bağımsızlık uğruna ölümüne bir savaş olan Milli Mücadele, aynı zamanda yeni bir devletin de doğmasına imkân sağlamıştır. Millî Harekete karşı olan güçler (Sultan-Halife, İstanbul Hükümeti ve İtilâf Devletleri), Anadolu Millî Hareketini yok edebilmek için yoğun bir din istismarına girişmiştir. Bu istismarın en önemi aracı ise, İngilizlerin isteği doğrultusunda çıkarılan, millî hareketin lider kadrosunu ölüme mahkum eden ve Anadolu'da ortaya çıkan isyan hareketlerini alevlendiren 'fetva' olmuştur. Anadolu'nun, Millî hareketi destekleyen ve harekete öncülük eden, sağduyu sahibi din adamları ise, bu dinsel söyleme karşı, millî harekete meşruiyet kazandıran karşı bir fetva çıkarmışlardır. Böylece bir çeşit“Fetvalar Savaşı”gündemi işgal etmiştir. Milli Mücadele Dönemi boyunca, din olgusunun ve dinsel kurumların çoğu zaman millî hareket etrafında birleştirici rol oynamalarına rağmen, zaman zaman da toplumsal yapının cehalet içerisinde olduğu ve dinin söylemlerinin de gerektiği gibi anlaşılamadığı durumlarda, bölücü bir işlevi üstlendiği görülmektedir."
