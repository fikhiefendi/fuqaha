abstract: "Araştırmanın amacı İbâzî tefsir geleneğinde ahkâm âyetlerinin nasıl yorumlandığını ortaya koymaktır. Bu amaç için incelenilen tefsir Muhammed b. Yûsuf Ettafeyyiş'in son tefsir eseri olan Teysîrü't-Tefsîr'dir. Nitekim Ettafeyyiş mezhebi içerisinde“Kutb”lakabı ile anılan tefsir ve fıkıh ilimleri başta olmak üzere diğer İslâmî ilimlerde de yetkinlik sahibi olan bir müfessirdir. Ettafeyyiş'in de eserinde vurguladığı gibi İbâzıyye mezhebi, Hanefî mezhebi ile ahkâma ait birçok konuda ittifak halindedir. Bunun yanı sıra Şâfîî ve Mâlikî mezhebi ile de birçok meselede ittifakı bulunan Ettafeyyiş eserinde bu benzerlikleri ifade ederken mezhepler ile ihtilaf halinde olduğu konuları da belirtmekten çekinmemiştir. Özellikle Zâhirî mezhebi ile olan ihtilafları, Ettafeyyiş'in ve mezhebinin âyetleri literal okumaktan uzak olduklarını ortaya koymaktadır. İbâzıyye mezhebinin neşet ettiği Hâricî mezhebi ile bir görüş birliği içerisinde olmaması gerek Ettafeyyiş'in gerek İbâzıyye'nin, Hâricîler gibi nasları yorumlamada sert bir tutuma sahip olmadıklarının göstergesidir. Her ne kadar İbâzıyye, Hâricî fırkaları arasından günümüze ulaşan tek zümre olsa da İbâzîler dinin ahkâmı karşısında literal tavırdan uzak durmuş, mutedil bir tutum benimsemiştir. Ettafeyyiş'in sünnî mezhepler ile ittifak ettiği meseleler doğrultusunda İbâzıyye mezhebinin ahkâm konusunda Hâricîlerden ziyade sünnî mezhepler ile olan benzerliğinin daha fazla olduğu tespit edilmiştir."
