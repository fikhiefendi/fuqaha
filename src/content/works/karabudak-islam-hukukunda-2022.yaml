abstract: "Bu çalışmanın amacı, İslam hukukunda kadının şahitliğinin cinsiyet ile temellendirilmesine analitik bir bakış olarak değerlendirilmesidir. Yaptığımız çalışmanın sonucunda Kur'an ve hadislerde bu konunun nasıl gündeme geldiğini tespit ederek belirlemeye çalıştık. Araştırma olarak seçmiş olduğum bu konu, bazı önemli problemlerin çözümünü sağlayacak mahiyettedir. Çünkü konu olarak Kadının şahitliği meselesinin, bazı şeylerin ispatı sadedinde kullanılmasında etkisi bulunmaktadır. Şahitlik başlı başına delil olması açısından İslâm Hukukunda önemli bir yer teşkil etmektedir. Hz. Peygamber (sav), herhangi bir dava için huzuruna gelenlere şahit getirmelerini ve meramlarını anlatırken, olayı olduğu gibi anlatmalarını talep ediyordu. Çünkü Hz. Peygamber (sav) nihai hükmünü, şahitlerin beyanları muvacehesinde veriyor ve şahitliğin ehemmiyetini vurgulama babında“Güneş kadar açık biliyorsan şahitlik yap, yoksa bırak!”şeklinde şahide ikazda bulunuyordu. Kur'an, erkek ve kadını bağımsız kişiliklere sahip bireyler olarak ele almıştır. Ancak bu iki cinsin fizyolojik ve psikolojik özellikleri birbirinden farklı olduğundan erkek ve kadın, her konuda eşit değerlendirilmemiştir. Unutulmamalıdır ki, her eşitsizlik, adaletsizlik demek değildir. Allah'ın erkek ve kadın hakkında koyduğu hükümler, bir bütün olarak değerlendirildiğinde mutlak bir eşitliğin olmadığını, ancak hiç kimsenin hakkını zayi etmeyecek şekilde adale-tin tesis edildiğinin rahatlıkla görülebileceği kanaatindeyiz. Çalışmamızda da kadının şahitliği konusu çerçevesinde oluşan birtakım şüpheleri belirtip bu şüpheleri değerlendirdik."
