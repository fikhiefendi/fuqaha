abstract: "İslâm hukuk düşüncesinde içtihat ve görüşler temellendirilirken başvurulan argümanlar arasında küllî kâideler ve dâbıtların hususi bir yeri vardır. Bu çalışma, Hanefî mezhebinin önde gelen kaynaklarından el-Hidâye'nin Kitâbü'l-Beyʻ ve ilgili bölümlerinde yer alan kâide ve dâbıtları tespit edip değerlendirmeyi amaçlamaktadır. Telif türü itibarıyla bir şerh olmakla birlikte metin türü eserlere yakın bir hacme sahip olan el-Hidâye, birçok kâide ve dâbıt içermesi bakımından dikkat çeker. Eserin yazarı Mergînânî, benimsediği görüşleri savunmak amacıyla zikrettiği argümanlar arasında kâide ve dâbıtlara da sıklıkla yer verir. Bu tür argümanlara, mezhep içinde ittifakla kabul edilen içtihatların yanı sıra tartışmalı olan ve mezhepler arası ihtilaflara konu olan yerlerde de rastlanır. el-Hidâye'nin küllî kâideler ve dâbıtlar bakımından zengin bir içeriğe sahip olması, Hanefî hukuk düşüncesinde kavâid ilminin gelişimine ciddi katkılar sunmasını sağlamıştır. Bu çalışmada, bey' (alış-veriş) ve ilgili bölümlerde zikredilen kâideler ve dâbıtlar belli bir tasnifle sıralanmış, hangi bağlamlarda ve hangi amaçlarla dile getirildikleri tespit edilmiş ve genel hukuk düşüncesi bakımından tahlil edilmiştir."
