abstract: "Muhammed Zâfir el-Medenî (1829-1903), 1829 yılında, bugün Libya sınırları içinde kalan Mısrâte'de doğdu. Malikî mezhebine bağlı bir fakih ve Şazeliyye tarikatı şeyhidir. Osmanlı Devleti padişahı II. Abdülhamid'in şeyhi olmakla meşhurdur. Kardeşi Hamza Zâfir ve Trablusgarb valisi Mahmud Nedim Paşa'nın girişimleriyle 1870'li yıllarda İstanbul'a geldi. Şeyhlik vazifesini önce Unkapanı'ndaki Balmumcu Tekkesi'nde, daha sonra kendisi için II. Abdülhamid tarafından Beşiktaş'ta yaptırılan ve günümüzde Ertuğrul Tekke olarak bilinen Zafir Tekkesi'nde yürüttü. Aynı zamanda padişahın İslam ülkelerine ilişkin dini-siyasi çalışmalarında, saygınlık ve nüfuzunu kullanarak destekleyici görevler üstlendi. Osmanlı Devleti'nin özellikle Fransa ve İngiltere'yle mücadelesinde Kuzey Afrika, Suriye ve diğer Ortadoğu topraklarındaki nüfuzunu kullanarak katkıda bulundu. 1903 yılında İstanbul'da öldü. Kabri, Beşiktaş'taki tekkenin bitişiğindeki türbededir. Biz bu çalışmamızda Muhammed Zâfir Efendi'nin el-Envâru'l Kudsiyye adlı eserini, elimizde matbu olarak bulunan iki nüshasını karşılaştırarak tahkik ve tercüme etmeye ve eserdeki tasavvufi görüşlerini tesbit etmeye çalıştık. O, bu eserinde Ebu'l Hasan Şâzilî'nin biyografisine, sözlerine, müridlerine tavsiye ettiği dua ve zikirlere, babası Muhammed Hasan b. Hamza Zâfir el-Medenî'nin biyografisine ve Şazeliyye tarikatına bağlı olarak babasının kurduğu Medeniyye Tarikatı hakkında bilgilere yer vermiştir."
