abstract: "Bu çalışma giriş ve üç bölümden oluşmaktadır. Çalışmamızın amacını, İslam'ın muamelat noktasında nikâha ve dolayısıyla evlilik müessesine yüklemiş olduğu misyonunun irdelenmesi, akabinde de bu misyon ile bağlantılı olarak nikâhın sürdürülebilirliğini etkileyen problemlerin tespiti oluşturmaktadır. Bu tespit, aynı bir marazın teşhisi gibi, İslam'ın sunduğu prensiplerden bağımsız olarak inşa edilen nikâh müessesesinin, yaşamına devam etmesini engelleyen problemlere ışık tutmayı gaye edinmektedir. Girişte konunun önemi ve amacı, çalışmanın kapsam ve yöntemine yer verilmiştir. Birinci bölümde ise İslam hukukuna göre nikâhın mahiyetine dair; ne anlama geldiği, hükmü, nasıl gerçekleştiği, kurulabilmesi için gerekli olan şartların neler olduğu ve çeşitleri incelenmiştir. İkinci bölümde de“insan”ve“toplum”için nikâhın nasıl bir fonksiyona haiz olduğu açıklanmaya çalışılmıştır. Üçüncü bölümde ise öncelikle nikâh kurumunun yaşayan bir yapıya sahip olması sebebiyle en sağlıklı şekilde yürütülebilmesi için İslam'ın ortaya koyduğu ve Müslüman olan bireylerden bu nizama göre yaşamalarını beklediği hususlar açıklanmıştır. Akabinde de İslamî bir niteliğe sahip olmaktan kısmî veya topyekûn olarak uzaklaşan bireylerin nikâh müesseselerini sürdürebilmeleri noktasında karşılaştıkları problemler irdelenmiş ve çözüm yollarının İslam hukukundaki varlığı ortaya konulmaya çalışılmıştır."
