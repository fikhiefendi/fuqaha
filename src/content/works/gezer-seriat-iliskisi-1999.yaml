abstract: "Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde Araştırmanın amacı, konusu ve önemi hakkında bilgi verilmiştir. Birinci bölümde konumuzun omurga kelimelerinden olan din, şeriat, millet ve İslam kelimelerinin kavramsal olarak tahlili ve Kur 'an 'da kazandıkları anlam alanları ortaya konmuştur. Buna göre, din kelimesi itaat etmek ve bağlanmak, hüküm, boyun eğmek, borçlu olmak anlamlarına geldiği tespit edilmiştir. Şeriat kelimesi ise su kaynağı, açıklamak, kanun yapmak anlamlarına gelmektedir. Millet kelimesi ise mezhep, şeriat anlamlarına gelirken, İslam kelimesi de CahiliyYe döneminde barış yapmak, insanın değerli bir şeyi başkasına teslim etmesi anlamına gelmektedir. Bu kelimeler Kur 'an 'da yaklaşık olarak din anlamlarma gelmelerine rağmen kazandıkları anlamlar farklı olmuştur. Şeriat kelimesi Kur 'an 'da kamın yapmak, ortaya koymak anlamlarına gelmektedir. İsim olarak kullanılması ise Peygamber 'in şahsında somutlaşan birtakım ilke ve uygulamalardan ibaret olan, dinin yatay boyutunu yansıtmaktadır. İslam ise Kur 'an 'da içeriğinin Allah'a teslim olma niteliği taşıdığı, Kur 'an 'da vaihy süreci boyunca bütün dinlerin İslam'la tanımlandığı sonucuna varılmıştır. İkinci bölüm ise din-şeriat ilişkisinin mahiyeti ve ikisi arasındaki ilişkiye ayrılmıştır. Tarihi süreç içerisinde (fıkıh) hukuk ve şeriat özdeş kabul edildiğinden, geleneksel İslam düşüncesinde ve Kur 'an 'da fıkhın anlaşılması konusu işlenmişti. Ayrıca şeriatlerin normatif olduğu, her peygamberin şahsında somutlaşan ve toplumsal durumlara göre farklılaşabildiği ortaya konmuştur. Daha sonra şeriatlerin farklı olmasında etkili olan unsurlar üzerinde durularak Kültürün vahyin şekillenmesindeki önemi üzerinde durulmuştur. Bu bağlama vahiy-olgu ilişkisine değinilerek, olgunun (kültür, gelenek) vahyi şekillendirdiği sonucuna varılmıştır. Dinin bu yönüne ise şeriat denilebileceği kanaatine varılmıştır. Gezer, Süleyman, Kur 'an 'da Din Şeriat İlişkisi, Yüksek Lisans Tezi, Danışman: Prof. Dr. Salih Akdemir-, s. 88"
