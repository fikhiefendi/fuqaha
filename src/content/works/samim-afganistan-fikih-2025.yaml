abstract: "İslâm, Afganistan'a ikinci halife Hz. Ömer döneminde ulaşmış ve bu tarihten itibaren bölgede önemli fıkıh âlimleri yetişmiştir. Belh, Bust, Gazne, Herat ve Cüzcan gibi merkezlerde birçok klasik fıkıh eseri kaleme alınmıştır. Zamanla, hükümdarların doğrudan talebiyle yazılan fıkıh kitapları da ortaya çıkmıştır. Bu çalışmada, söz konusu geleneğin bir parçası olan Fetâvâ-yı Ahmed Şâhî ve Kânûn-i Emîrî adlı iki fıkhî eser incelenmektedir. İlki, Afganistan'ın kurucusu Ahmed Şah Abdâlî'nin talebiyle Molla Abdullah tarafından Peştuca kaleme alınmış olup Peştuca'daki ilk fetva kitabı olma özelliği taşımaktadır. İkincisi ise Emir Şîr Ali Han'ın isteğiyle Kadı Abdulkâdir Kadro tarafından Farsça olarak yazılmıştır. Çalışmanın amacı, bu iki eseri içerik, yöntem, kaynak kullanımı ve hukuk anlayışı bakımından karşılaştırarak tanıtmaktır. Eserlerin dil özellikleri, tertip şekli, delil sunma biçimleri, ihtilaflara yaklaşımları ve tercih süreçleri analiz edilmiştir. Aynı zamanda, nadir bulunan yazma ve matbu nüshalara ulaşmak amacıyla yapılan saha çalışmaları ve arşiv taramaları detaylı biçimde aktarılmıştır. Bu yönüyle çalışma, akademik literatürde yeterince ele alınmamış Peştuca ve Farsça kaynakları karşılaştırmalı biçimde inceleyen özgün bir katkı sunmaktadır."
