abstract: "Şer'iyye Sicilleri Osmanlı Devleti'nde yaşayan insanların çeşitli sebeplerle mahkemeye başvurmaları sebebiyle tutulan kayıtları ihtiva eden sicillerdir. Bu kayıtlar Osmanlı Devleti'nin hukuk tatbikini içeren birinci elden kaynakların başında yer alır. Şer'iyye sicilleri ayrıca Osmanlı Devleti'nin hukuk tatbikini göstermekle birlikte araştırmacılara oldukça zengin bir çerçeve sunar. Bu çerçeve içerisinde merkezden gelen ferman, berat, sicilin bulunduğu şehri ilgilendiren idari yapı, o şehre ait demografik, ekonomik, sosyal ve beşerî birçok alanda önemli bilgiler sunar. Belgelerdeki bu çeşitlik yerel tarih araştırmalarına ciddi derecede katkı sağlamaktadır. Şer'iyye Sicillerinin kast edilen mana çerçevesindeki çok yönlü yapısı hem Osmanlı Devleti'nde uygulanan hukukun hem de sicilin ait olduğu şehirde kayıt altına alınan tarihteki yapısını ve günümüze kadar süre gelen dönüşümünü araştırma hususunda da önemli bir yer tutar. Bu çalışmada Cumhurbaşkanlığı Devlet Arşivleri Başkanlığı Osmanlı arşivi kataloğunda yer alan 135 numaralı Şer'iyye Sicili'nin (H. 1158/M.1745) 1-106 sayfalarını içeren hükümlerin transkripsiyonu ve değerlendirilmesi yapılmıştır. Bu amaçla Kayseri'de 1158/1745 tarihinde 135 numaralı Şer'iyye Siciline yansıyan kayıtlar aktarılmaya çalışılmıştır. Sicilde yer alan alım-satım, eşya, miras, mihr, nafaka, vasî ve mütevelli tayinleri, çeşitli suçlar, cami, medrese gibi sosyol, ekonomik ve kültürel etmenleri içinde barındıran kayıtların XVIII. Yüzyılda Kayseri'deki tespiti ve değerlendirilmesiyle Osmanlı Devleti'nde hukuk uygulamalarına ve Kayseri şehir tarihi literatürüne katkı sağlama amacı güdülmüştür."
