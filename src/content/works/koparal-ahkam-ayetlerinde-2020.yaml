abstract: "Dinler insanın kutsalla olan ilişkisini düzenler. Fakat İslam dini, insanın sadece kutsalla ilişkisini düzenlemekle yetinmeyerek insanın diğer varlıklarla olan ilişkilerini de düzenler. İslam, beşeri hayatın tamamına doğrudan veya dolaylı olarak müdahale eder. Doğrudan müdahil olduğu noktada en önemli unsur içerisinde hüküm barındıran ayetlerdir. Bu ayetler için“ahkâm ayetleri”tabiri kullanılmaktadır. Bu çalışmada ahkâm ayetlerinde yer alan hükümlerin inişindeki düzene dair tespit edilen tedricilik ve nesih gibi birtakım yöntemler incelenmektedir. Bu yöntemlerin incelenmesiyle birlikte hükümlerin inişinde takip edilen farklı bir yöntemin varlığı tespit edilmeye çalışılmaktadır. Tespit edilen bu yönteme teşdîd ve tahfîf metodu isminin verilmesi uygun görülmekte, bu bağlamda teşdîd ve tahfîf kavramlarının tanımlarına yer verilmektedir. Sonrasında ise hükümlerin inişinde teşdîd ve tahfîfin varlığının delilleri ve hikmetleri ele alınmaktadır. Son bölümde de tespit edilip ortaya konmaya çalışılan metoda ahkâm ayetlerinden örnekler verilmekte ve bu yöntem çerçevesinde değerlendirmeler yapılmaktadır. Netice itibariyle hükümlerin inişinde tespit edilen teşdîd ve tahfîf metodunun sonradan Müslüman olanlardan -hastalık seviyesinde- birtakım alışkanlıkları bulunanlara uygulanması teklif edilmektedir. Bu bağlamda hükümlerin, aldığı son şekliyle değil de kişilerin ve toplumların durumları göz önünde bulundurularak inişinde uygulanan sıralamaya benzer bir sırayla uygulanmasıyla toplumların maslahatı sağlanacak ve böylece İslam'ı kabullenmeleri de kolaylaşacaktır."
