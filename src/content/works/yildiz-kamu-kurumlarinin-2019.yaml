abstract: "Bu tez çalışmasındaki amacımız kamu kurumlarının kredi kullanımlarının genel ve yerel seçimlerin olduğu dönemlerde özellikle politik konjonktürel etkilerden dolayı düştüğünü ifade ederek bu bağlamda yine kamu sektörünün orta ve uzun vadeli altyapı ve üstyapı projelerinin akamete uğramaması adına uygulanabilir bir model olarak mudarebe önerisi sunmak olmuştur. Giriş kısmı olan birinci bölümde problem ortaya konularak, problemin çözümüne yönelik, izlenecek yöntem, varsayımlar ve çıkarımlar ortaya konulmuştur. İkinci bölümde kamu kurumlarının finansmanında politik konjonktürel dalgalanmaların etkisine değinilmiştir.. Ve sırasıyla; politik dalgalanmaların modeli, rasyonel beklentiler modeli ve rasyonel dalgalanmaların bütçe değişimi üzerindeki durumu incelenerek, mudarebenin uygulanabilirliği araştırılmıştır. Üçüncü bölümde mudarebenin tanımı, kapsamı, özellikleri uygulanma şartları üzerinde durulmuştur. Mudarebenin bölümleri ve tarafları da araştırmaya dahil edilmiştir. Dördüncü bölümde temel ampirik testler 2007-2019 yıllarına ait veriler kullanılarak regresyon analizleri ile test edilmiştir. Sonuç kısmı olan beşinci bölümde ise özellikle seçim dönemlerinde gerek konjonktürel etkiler ve yine buna bağlı olarak artan faiz oranlarına binaen düşüş gösteren kamu kesiminin kullandığı kredilerin sübvanse edilebilmesi ve projelerin aksamaması adına mudarebe önerisi sunulmuştur."
