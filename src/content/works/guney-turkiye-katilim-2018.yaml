abstract: "Dünyadaki ekonomik sistem genel olarak faize dayalıdır. İslami inanış faizi yasaklamış olduğundan faize duyarlı kesimler faizsiz finans ve bankacılık ürünlerini tercih etmektedirler. Ülkemizde de halihazırda faizsiz çalışan bankacılık kurumları bulunmaktadır. Ancak ülkemizde katılım bankacılığının geçmişi çok eski olmayıp ağırlıklı olarak 1980'li yıllardan sonra kurulmaya başlanmıştır. Günümüze kadar, katılım bankaları finans sistemine entegre olmuşlardır. Bugün katılım bankacılığının Türk bankacılık sektördeki payı yüzde beşe yakındır. Devlet İslami bankacılığının Türk finans sektöründeki ağırlığını artırmak amacıyla bu alana girme kararı almış ve bu yönde iki kamu katılım bankası kurulmuştur. Devletimiz de“Öncelikli Dönüşüm Programı”kapsamında alınan karar uyarınca, mevduat bankacılığı yanında kamunun da katılım bankacılığına dahil edilmesi ve katılım bankalarının desteklenmesi yönünde karar almıştır. Bu çalışmada kamunun bu alana girme nedenleri incelenmiş kamunun bu alanda faaliyet göstermesinin İslami bankacılığının gelişmesinde önemli katkıları olacağı belirlenmiştir."
