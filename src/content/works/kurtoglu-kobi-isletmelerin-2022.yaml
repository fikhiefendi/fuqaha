abstract: "Bu çalışmanın amacı, Gaziantep ilinde faaliyette bulunan KOBİ'lerin islamı bankacılıa yönelme sebeplerini araştırmaktır. Bu anlamda, küçük ve orta ölçekli işletmelerin katılım bankacılığı tercih etme nedenleri bir anket aracılıyla analiz edilmiştir. 20 sorudan oluşan anket, SPSS 22 programı ile analiz edilmiştir. Elde edilen bulgular çalışmaya dahil olan katılımcıların dini değerleri sebebiyle katılım bankacılığına yöneldildikleri anlaşılmaktadır. Kendilerine uygun yatırım ürünlerin var olduğunu belirtilmiş olsa da, katılımcıların önemli bir kısmı katılım bankacılığın sunduğu hizmetleri ve/veya ürünleri yatırım gerekçesiyle tercih etmediklerini vurgulamaktadırlar. Bulgular katılımcıların sadece bir kısmı yatırım ve finans ürünlerinden kaynaklı katılım bankacılığını tercih ettiklerini belirtmektedirler. Dikkat çeken diğer bir sonuç ise işletme sahiplerin katılım bankacılığında hesap açma nedenleri arasında ikinci sırada iş yerine yakınlılık olduğunu ifade etmek mümkündür. Elde edilen bu çarpıcı sonuç katılımcılar için bir bankanın « konumun » ne derece de önem taşıyabileceğini göstermektedir. Ancak, konum faktörü katılım bankası dışında « konvansyonel » bir bankanın aynı konumda olmuş olsaydı yine katılım bankasını tercih edermiydiniz sorusu sorulmadığından önem derecesi tartışmaya açık kalmıştır. Çevresel faktörlerin tercih edilme konusunda anlamlı olmadığı anlaşılmaktadır. Katılımcılar tercih ettikleri katılım bankasının kamu bankası olması tercihlerini olumlu yönde etkilediklerini ifade etmektedirler. Son olarak katılım bankasında çalışan personnellere duyulan güven ve kaliteli hizmet öne çıkan diğer bir faktördür. Bu bulguların ışığında katılım bankaların sundukları ürünler ve finans/yatırım araçları katılımcıların islam bankacılığına yönelme sebeplerin yerinde yer almaması katılım bankacılığı sektöründe henüz yeterli düzeyde ürünlerini tanıtılmadığı düşünülebilir. Bu bağlamda, sektörün henüz « tokluk » noktasına ulaşmadığını ve Pazar payı elde etme açısından hala bir marjın varlığını göstermektedir."
