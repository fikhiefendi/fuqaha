abstract: "Türkiye'de İslami bankacılık modeli katılım bankaları adı altında yürütülmektedir. Başta faiz hassasiyeti olmak üzere ekonomik, dini ve sosyal nedenlerle geleneksel finans piyasalarında tasarruflarını kullanmak istemeyen yatırımcıların ellerindeki fonların âtıl kalması, katılım bankalarının ortaya çıkmasında önemli bir etken olduğu söylenebilir. Özü faizsizlik ilkesi olup kar ve zarara katılma esasına göre çalışan katılım bankaları, tasarruf sahibinden topladığı fonları yine İslami ilkeler çerçevesinde üretim ve proje gibi alanlarda kullanarak fonların tekrar yatırıma dönüştürülmesini sağlayan kurumlardır. Kamu harcamalarının karşılanmasında önemli bir gelir kaynağı olan verginin bankacılık sistemindeki önemi oldukça büyüktür. Bu bağlamda geleneksel ve İslami bankacılık sisteminin birlikte yürütüldüğü Türkiye'de vergi yükümlülük ve sorumluluklarının bilinmesi oldukça önemlidir. Ancak Türkiye'de katılım bankalarının vergi mevzuatına yönelik yapılan çalışmalar oldukça sınırlıdır. Bu boşluğu doldurmak ve literatüre katkı sağlamak amacıyla, 2007-2020 yılları arasında katılım bankaları tarafından ödenen Kurumlar Vergisi, Banka ve Sigorta Muameleleri Vergisi, Katma Değer Vergisi ve Gelir Vergisinin vergi gelirleri içindeki payı incelenmiştir. Ayrıca geleneksel bankalar tarafından ödenen vergilerin de toplam vergi gelirleri içindeki payı incelenerek karşılaştırma yapılmış ve katılım bankalarının mali yapısı irdelenmeye çalışılmıştır. Elde edilen bulgular, katılım bankalarının vergi gelirleri içinde 0,10, geleneksel bankaların ise 1,07'lik bir paya sahip olduğunu göstermiştir. Kurumlar vergisi açısından bakıldığında ise katılım bankalarının toplam kurumlar vergisi içinde 0,86 iken, geleneksel bankaların ise 6,11'lik bir paya sahip olduğu görülmüştür. Vergisel açıdan değerlendirilen katılım bankalarının sektörde her geçen gün büyümeye devam ettiği, buna karşılık Türk bankacılık sektörünün halen küçük bir parçasını oluşturduğu söylenebilir."
