abstract: "Katılım Bankaları, özel cari ve katılma hesapları yoluyla fon toplayarak kredi kullandırmak esas olmak üzere faaliyet gösteren kuruluşlardır. Ülkemizde 1983 yılında alınan 83/7506 sayılı Bakanlar Kurulu kararına dayanarak“Özel Finans Kurumları”adı altında faaliyete başlamışlardır. 2005 yılında yürürlüğe giren 5411 sayılı Bankacılık Kanunu ile“katılım bankası”adını almış ve tüm faaliyetleri bankacılık kanunu kapsamına alınmıştır. Katılım bankalarının kuruluş esası“faizsiz bankacılık”ve“kar-zarar ortaklığı”ilkelerine dayanmaktadır. Katılım bankacılığı işlemlerinin“faizsiz bankacılık”ve“kar-zarar ortaklığı”ilkelerine uygun olarak yürütülüp yürütülmediğinin tespiti için öncelikle“faiz”,“kar”ve“kar payı”kavramları ile Türk hukukunda geleneksel bankacılık faaliyetlerini icra eden mevduat bankalarının ve mevduat bankaları işlemlerinin incelenmesi gerekmektedir. Katılım bankalarının fon toplama ve fon kullandırma yöntemleri de ayrıca ele alınmalıdır. Katılım bankacılığının kuruluş felsefesi İslam dininde yer alan faiz yasağına dayandığı için, bahsi geçen incelemelerin Türk ve İslam hukukunda mukayeseli olarak incelenmesi daha doğru olacaktır. Katılım bankalarının fon toplama yöntemleri“özel cari hesap”,“katılım hesabı”ve“sendikasyon kredileridir”. Katılım bankalarının fon kullandırma yöntemlerine dair Türk hukukundaki uygulama ve kavramlar ile global uygulama ve kavramlar ayrı ayrı anlatılmalıdır. Fon toplama çeşitliliği sağlamak amacıyla, anonim şirketlerin tahvil ihraç etmelerinden esinlenilerek“sukuk”adlı sermaye piyasası aracı ortaya konulmuştur. Sukuk, Türk hukukunda“kira sertifikası olarak”adlandırılmaktadır."
