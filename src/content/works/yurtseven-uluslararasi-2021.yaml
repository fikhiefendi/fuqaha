abstract: "Bu çalışma, İslam ekonomisinin iz düşümlerini genel iktisat tarihi içerisinde aramış ve İslam ekonomisinin bilgi/bilim bağlamında sosyal bilimler içerisindeki konumunu incelemiştir. İslam ekonomisinin bir model olma imkânını, hâkim paradigmaya meydan okumasının dayanaklarını da inceleyerek ele almıştır. İslam ekonomisinin bir model olarak diğerlerinden neden ve nasıl ayrıştığını, hangi yönlerle ne düzeyde birleştiğini sorgulamıştır. Bu doğrultuda İslam ekonomisinin ilkelerine dayanarak sürdürülebilir bir model olma imkânını tesis edecek kurumsal vizyonu, kendine özgü düzenleme ve denetleme anlayışı, kurumsal yapı ve araçları bütüncül bir perspektifle değerlendirilmiştir. Ayrıca İslam ekonomisinin kurumsal mimarisi, uluslararası arenada faaliyet gösteren İslami finans kuruluşlarının niteliği, niceliği ve yapısal işleyişleri karşılaştırmalı yöntemlerle değerlendirilmiş ve hizmet yürüttükleri alanlara göre tasnif edilmiştir. Özellikle bu kuruluşların İFE üzerindeki düzenleyici ve denetleyici rolleri seçilen ülke örnekleri nezdinde değerlendirilmiş ve bu kurumların fonksiyonları, yayınladıkları standartları/rehber ilkeleri uluslararası diğer kuruluşlarla/standartlarla mukayese edilmiştir. Çalışmanın son bölümünde ise Türkiye'nin uluslararası arenada faaliyet gösterebileceği, düzenleme ve denetleme fonksiyonu da içerisine alan kurumsal bir model taslağı önerilmiştir. İslami finansın küresel mimarisinin sahip olması gereken gereksinimlerin ve buna bağlı olan bileşenlerin ne/nasıl olması gerektiği bu çalışmada ele alınmıştır. İslami finansın kurumsal mimarisinin boyutlarını ortaya koyan yasal belegeler, literatür, kurumlar, raporlar, saha çalışmaları ülke örnekleriyle incelenmiş ve betimleyici yöntemle nicel-nitel araştırma teknikleri de kullanılarak çalışmanın yöntemsel evreni oluşturulmuştur. Bu inceleme ve analizlerin ardından Türkiye katılım finans sisteminin düzenlenip denetlenmesine olanak sağlayacak ve diğer gereksinimleri de karşılayacak kurumsal model önerisinin fırsat ve güçlükleri değerlendirilmiştir."
