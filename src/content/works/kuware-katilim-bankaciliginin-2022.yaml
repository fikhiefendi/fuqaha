abstract: "Günümüz dünyasında katılım bankacılığı, varlığı göz ardı edilemeyecek kadar hızla büyümektedir. Bankacılık sektörünün büyümesi, büyük bankaları özellik niş pazarlara hizmet etmek için katılım bankacılığı gibi farklı pencereler açmaya zorlamaktadır. Katılım bankacılığı sektörü birçok ülkede ivme kazanmış olsa da, ekonomik büyümeye katkısı pek çok ülke için yeterince ilgi çekici olmamıştır. Buçalışmanın amacı katılım bankacılığının finansal piyasalara ve ekonomik büyümeye olan katkısını araştırmaktır. Belirtilen hedefe ulaşmak amacıyla katılım bankacılığı uygulayan dört ülke; Bahreyn, Katar, Suudi Arabistan ve Türkiye incelenmiştir. Finansal ve ekonomik gelişimin ölçülmesi amacıyla ilgili ülkelerin katılım bankaları, borsa katılım endeksleri ve GSYİH'larının çeyreklik verileri analize tabi tutulmuştur. Varlık kârlılığı ve öz kaynak kârlılığı açıklayıcı değişkenlerdir. Elde edilen veriler 2011 ile 2020 arasındaki on yıllık bir zaman serisine aittir. Zaman serisi veri setinde Otoregresif Dağıtılmış Gecikme (ARDL) modeli ve Toda Yamamoto Granger Nedensellik testi kullanılmıştır. Bulgularda Bahreyn için; GSYİH ile katılım bankalarının yatırımlarının getirisi (ROI), borsanın toplam endeks getirisi (ROTI) ve ROI arasında güçlü bir tek yönlü ilişki olduğusonucu ortaya çıkmıştır. Katar'da GSYİH ile ROI, ROTI ve katılım bankaları varlık kârlılığı (ROA) ile ROTI ve ROI arasında güçlü ve çift yönlü bir ilişki ve ayrıca GSYİH ve ROA arasındaki güçlü tek yönlü bir ilişki bulunmaktadır. Suudi Arabistan için ROTI ve ROA, ROTI ve ROI arasında tek yönlü bir ilişki mevcuttur. Türkiye'de ise GSYİH ve ROI, ROTI ve ROA ile ROTI ve ROI arasında güçlü ve çift yönlü bir ilişki olduğu gösterilmiştir."
