abstract: "Sünnet İslam dininin ikinci ana kaynağıdır. Mahiyeti ve hücciyeti hakkında bir takım mülazahalar bulunmaktadır. Sünnet kavramı Şafiî öncesinde Hz. Peygamber'den sadır olan şeyler hakkında kullanılmakla beraber, sahâbe ve tabiûna ait söz ve davranışlar anlamında da kullanıldığı görülmüştür. Sünnet Müslümanların hayatına yön veren bir fenomen olduğu, Hz. Peygamber ve kendisini takip eden nesilden öğrenmekteyiz. Kimi sahâbîler, hadisi olduğu gibi kabul edip zahiri yaklaşım gösterirken, kimisi de fıkhî bir yaklaşımla yorum farklılığında bulunmuşlardır. Ancak her iki yaklaşımı kesin çizgilerle ayırmak mümkün değildir. Aynı durumu tabiûn neslinde de görmek mümkündür. Şafiî öncesi sünni mezheplere baktığımızda karşımıza Hanefî ve Mâliki mezhepleri çıkmaktadır. İmam Ebû Hanîfe ve öğrencileri sünneti deliller sıralamasında ikinci sıraya koyarken, sünnetin Kur'an'a ve akl-ı selimle çelişmemesi gerektiğini söylemişlerdir. İmam Mâlikin sünnet anlayışının merkezinde amel-i ehli Medîne olgusu vardır. O, Medîne amelini Mütevatir hadis gibi değerlendirmektedir. Her iki mezhep, sahih sünnetin tespiti için kendilerine ait yol ve yöntemler ortaya koymuşlardır. Tespit ettikleri sahih sünneti hüccet olarak kabul görmüş, itikatta ve amelde delil olarak kullanmışlardır."
