abstract: "Bankacılık sektörüne genel olarak bakıldığında ortaya çıkışı nedenlerini, koruma, saklama, tahsil etme, ticareti geliştirme gibi unsurlar olduğu görülmektedir. Giderek etkinliğini ve verimliliğini artıran daha kompleks hale gelen yeniliğe açık haliyle bankacılılık sektörü bugün adeta insanların vaz geçilmez asli kurumlarından bir tanesi haline gelmiştir. Katılım Bankacılığı ise, mevduat bankaların aksine kısa bir geçmişe sahip olması bilgi, birikim ve tecrübe noktasında yatırımcısında şüphe uyandırsa da öte yandan içinde beslediği potansiyeli çalışma usulü ve finansal krizlere olan güvenirliği nedeniyle de mevduat bankalara rakip olacağı izlenimini vermektedir. Bu çalışmada Katılım Bankacılığın doğuşu, gelişimi, işleyişi, Türkiye'deki ve dünyadaki seyri ele alınmıştır. Katılım Bankacılığının uyguladığı kâr payları ile mevduat bankaların uyguladığı faiz oranları arasındaki ilişki Türkiye'nin 2011m01-2024m04 dönemi için ARDL Sınır testi ile incelenmiştir. Bu amaçla kâr payı oranlarının (Model I) ve mevduat faiz oranlarının bağımlı değişken olduğu (Model II) iki model oluşturulmuştur. Aynı zamanda fonlama maliyeti, enflasyon oranı, döviz kuru kontrol değişkenleri olarak; para arzı ile kukla değişkenler (Covid19 ve kur korumalı sisteme geçiş) dışsal değişkenler olarak modellere dâhil edilmiştir. Yapılan analiz sonucu para arzı, fonlama maliyeti, enflasyon oranı ve mevduat faiz oranı Türkiye'deki kâr payı oranlarını pozitif yönde etkiler iken, döviz kuru ise negatif yönde etkilediği belirlenmiştir. Türkiye'de mevduat faiz oranını ise para arzı, fonlama maliyeti, enflasyon oranı ve kâr payı oranı pozitif yönde etkilediği; döviz kuru ise olumsuz yönde etkilediği tespit edilmiştir. Dolayısıyla, her iki modelde de kontrol değişkenlerinin kâr payı ile mevduat faiz oranı üzerindeki etkilerinin benzer olmakla birlikte, özellikle dışsal değişkenlerin oransal anlamda daha etkili olduğu belirlenmiştir. Ayrıca, Türkiye'deki mevduat faiz oranı ile kâr payı oranlarının birbirlerinden etkilendiği ve bu etkilerinin pozitif olduğu ortaya konmuştur. Bununla birlikte, Türkiye'deki 2011m01-2024m04 dönemi için kâr payı oranları, mevduat faiz oranlarını daha fazla etkilediği ifade edilebilir."
