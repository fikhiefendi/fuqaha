abstract: "Haksız ve adil olmayan, bir tarafa kazandırırken bir tarafı ezen bir gelir bölüşüm mekanizması olan faiz ile mücadele tarih boyunca devamedegelmiştir. İslâm dini ise faizi, faiz alan veya verenden birini mutlaka haksızlığa uğrattığı için reddetmiştir. İslâm coğrafyasında Faize karşı olan direnç ve mücadele, teori ve pratiğiyle faizsiz bankacılık yönteminin geliştirilmesine sağlamıştır. Faizsiz Bankacılığın en önemli örneği ülkemizin de üyesi bulunduğu İslam Kalkınma Bankası'dır. Ülkemiz İslam Kalkınma Bankası Yönetim Kurulu'nda devamlı üye bulundurma hakkını 1984 yılında elde etmiş, böylece Türkiye yaklaşık elli devleti çatısı altında toplayan İslam dünyasının en büyük finansman kuruluşunda çok etkin rol oynayabilecek duruma gelmiştir. Dünyada genelde 'İslâm bankaları' olarak adlandırılan faizsiz bankalar, ülkemizde 1985 yılında Özel Finans Kurumları adıyla kurulmuş, 2006 yılından itibaren bu kurumlar Katılım Bankaları adını almışlardır. Katılım bankalarının yatırım/girişim projelerini finanse etmek suretiyle tasarrufların değerlendirilmesine imkân sağlayan mudarebe sistemine ağırlık vermek suretiyle kâr/zarar ortaklığının uygulama alanını genişletmesi, ekonomik kalkınmaya daha fazla katkı sağlaması önemli görülmektedir. Katılım Bankalarının; dini saiklerle mevcut finansal sistemden uzak duran fonları sisteme kazandırması, yastık altı tabir edilen atıl kaynakların değerlendirilmesini sağlayarak tasarruf sahibine kazanç sağlaması, faizin tersine toplum içerisinde gelir dağılımını pozitif yönde düzenleyici etkisi, ekonomik sisteme sağladığı en önemli katkılardandır. Ülkemizde katılım bankalarının gelişimi izlendiğinde, 2005 yılından sonra katılım bankalarının göz ardı edilmeyecek bir gelişme gösterdiği söylenebilir. 2001 yılında yaşanan ekonomik kriz katılım bankalarını da etkilemiştir. Mevduat bankaları 2005'ten sonra küçülmek zorunda kalırken, finansal piyasalardaki olumsuzluklara rağmen Katılım Bankaları sabit kalmayı başararak piyasa paylarını artırmışlardır.2007 yılı itibariyle yaşanan küresel finans krizine rağmen faizsiz bankacılık sektöründe, krizden sonraki 5 yılda ortalama %23,5 oranında büyüme gerçekleşmiştir. Ülkemizin 2001 ekonomik krizinden bu yana ekonomide gösterdiği gelişimde bankacılık sektörünün ciddi payı vardır. Son 10 yıl içerisinde bankacılık sektörü hemen her yıl büyüme göstermiş, 2003-2012 yılları arasında % 537 oranında oldukça yüksek bir büyüme oranına ulaşmıştır. Türk Finansal Sistemi içinde bankacılık sektörünün günümüzdeki payının %85 seviyesinde olduğu, sektörün bu payı ilerleyen yıllarda da koruyacağı düşünülmektedir. Ayrıca bu gelişim üzerine son uluslararası bankaların 10 yılda Türk bankacılık sektörüne olan ilgisi arttığı görülmektedir. Bu bilgilerden hareketle katılım bankalarının Türk bankacılık sektörü içerisindeki performansının incelenerek ve bu performansın artırılmasına yönelik çalışılması gerektiği düşünülmektedir. Önümüzdeki süreçte küresel bir ekonomik kriz yaşanmaması ve sisteme giren fon artışının devam etmesi şartıyla; katılım bankalarının fon kullandırma oranları ile birlikte aktiflerin içindeki payının artacağı, bunun getireceği gelir artışı ve kaynak maliyetindeki düşüşün katılım/faizsiz bankalarının kârlılığı ve sitemdeki payını artıracağı değerlendirilmektedir. Günümüzde dünya ekonomisi, İslamiyet'in doğduğu dönemden oldukça farklı ve karmaşık bir yapı arz etmektedir. Bu yapı içerisinde günümüzde faizsiz bankacılık sistemine getirilen en yoğun eleştiri, faizsiz finansmanın/bankacılığın günümüzdeki uygulamalarının klasik faizli bankacılık faaliyetleri ile çok benzer olduğudur. Bu eleştirilerin nedeni ise, faizsiz finans/bankacılık uygulamalarının mevcut klasik faizli sisteme benzetilen dar kapsamlı uygulamaların ötesine geçilmemiş olması şeklinde ifade edilmektedir. Yinede halen büyüyen ve gelişen bir sistem olan faizsiz finans, İslami kurallara uygun, modern finansman ihtiyaçları ve araçlarına yönelik bir arayış çerçevesinde, iş ortaklığının değişik biçimlerinin ortaya koymaya çalışmaktadır. Kanımızca faizsiz bankacılığın ülkemizdeki gelişimine engel teşkil eden ve yöneltilen en büyük eleştiri; katılım bankalarının dağıttığı veya talep ettiği kar oranlarının, klasik faizli bankaların uyguladığı faiz oranları ile aynı veya yakın oranlarda oluşudur. Uygulanan kar ve faiz oranlarının aynı veya birbirine yakın oranlarda oluşu yönündeki eleştiride haklılık payı olsa da; temelde bu durumun, klasik bankalar ile faizsiz bankaların mevcut ekonomik sitemde bir arada yer almasından ve piyasada aynı şartlarda rekabet etmeleri gerektiğinden kaynaklandığı değerlendirilmektedir. Bu bakımdan; katılım bankaları ile faizli bankaların uygulamalarındaki farkları, dini açıdan iş ortaklığı ile faizden elde edilen gelir arasındaki farkı, faizin yarattığı toplumsal/sosyolojik problemler ile gelir dağılımında sebep olduğu adaletsizliğin geniş toplum kitlelerine çok iyi anlatılması gerekmektedir. Yine bu baptan bir İslam toplumunda yapılması gereken en doğru şeyin ise, ekonomik sistemde sadece faizsiz finans/bankacılığın var olması, faizli finans/bankacılığa hiçbir şekilde yer verilmemesi gerektiği kanaatindeyiz."
