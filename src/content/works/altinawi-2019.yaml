abstract: "Genel olarak İslam mevzuatı ve özellikle araştırmamızda incelenenlerin kavranması, insanın aheretteki ve bu dünyadaki yararı için beş gereksinimin korunmaktadır: din, nefis, şeref, akıl, para gibi konuların etrafında dönmektedir. İslam Mevzuatı, Yaratıcısının düzenine ve onun büyüklüğüne cevaben, önce içten sonra dışardan bir güç ilehayatındaki iyi davranışını sağlamak ve onu topraklarında Allah'ın mesajını taşımaya hazırlamak için, insan ile insan kardesi ve etrafındaki evren arasındaki ve hayatı arasındaki ilişkiyi düzenleyen çok detaylı bir ilahi sistemdir. Bu sırada adalet, sadaka, özgürlük ve onur dolu bir hayat tadını çıkarsın diye. Ve bizim bu çalışmadaki geçen cihad mevzuatı yalnızca uzun bir zincirin bağlantısıdır, birbirine bağlı ya da resmin bir parçası olarak görünen hükümler, İstenilen amaca ulaşmak için resmin parçaları, yalnız her biri yerinde, tüm parçalarının sırayla birbirini tamamlaması gerekmektedir. Cihad ve hükümlerinin yasası, insanın saygınlığını ve insanlığını saldırganlığının geri dönüşünü ve kendilerin korunmasını savunmak ve toprağı savunmak ve yüce İnsan özgürlüğü ve saygınlık çağrısı, kibir, uzlaşmazlık, kınama ve hatta kısır bir savaş, güçlerinin gücünün, hırslarının, köleliklerinin, zulmünün ve zulmünün savunulmasında, tüm ellerinde ve her düzeyde ve cephelerde. Bütün bunlar, bu zalim rejimleri ve haksız ve önyargılı yasalarını soymak için azami gayret ve çaba sarfediyor: Doğru ve yanlış arasındaki savaş devam ediyor ve cihad Kıyamet Günü'ne kadar devam ediyor. Ey Allah, bizi, yaratıcılığınızın ve dininizin koruyucularından, sevgili Peygamberinizin bayrağını güvenlik , emniyet, merhamet ve hayırseverlik mesajı ve ahlaki sonuçların tamamıyla taşıyanlardan eyle."
