abstract: "Namaz ibadeti konusunda tavizsiz bir tutum sergileyen İslâm dini bu ibadeti îfâ edebilme noktasında Müslümanlara bir takım ruhsatlar/kolaylıklar tanımaktadır. Bu ruhsatlardan bazıları da teyemmüm ve cebire meseleleri ile ilgilidir. Teyemmüm, suyu bulamayan veya bulup da bazı mazeretlerden dolayı kullanamayan kimsenin hades hâlini/hükmî kirliliği gidermek gâyesiyle ellerini toprak cinsinden temiz bir şeye sürerek yüzünü ve kollarını onunla meshetmesidir. Cebîre ise, vücudunun herhangi bir yerindeki kırık-çıkık vb. bir yaradan ötürü sargı bulunduran insanın abdest veya gusül sırasında bu sargıyı çözmeden üzerini meshetmekle yetinebilmesidir. Bu iki meselenin meşrûiyyeti kitap, sünnet ve icmâ ile sâbittir. Cumhur-u fukaha bu delillerden yola çıkarak teyemmüm ve cebîrenin meşrûyyetini ve ruhsat oluşlarını kabul etmektedir. Bu iki konunun detaylarında genel mânada birbirine yakın tutumlar sergilemekle beraber mezheplerin ihtilafa düştükleri bazı noktalar da vardır. Bu araştırmada dört büyük mezhebe göre teyemmüm ve cebîrenin tanımları, meşrûiyyetleri, hükümleri, teyemmümün yapılabildiği maddeler, teyemmüm ile cebîrenin farz, sünnet, mendup ve mekruhları, hem abdest almaktan hem de teyemmüm yapmaktan mahrum olan kişinin namazı ve teyemmümlü kimsenin imameti gibi durumlar ele alınmış, teyemmüm ve cebîre ile edâ edilebilen ibadetler ve bu ibadetlerin nihai durumları açıklanmış, dört mezhebin bu konularla ilgili ittifak ettikleri ve ihtilafa düştükleri noktalara dikkat çekilmiştir."
