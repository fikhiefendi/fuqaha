abstract: "Toplumların inanç, kültür, ahlak, tecrübe ve yaşam koşullarından etkilenen“devlet kavramı”geçmişten bugüne çok farklı şekillerde tanımlanmıştır. Devlet kavramını şekillendiren bu etmenler, toplulukların sevk ve idaresinin nasıl gerçekleştirileceğini de şekillendiren başlıca unsurlardır. Kimi araştırmacılara göre, devlet yönetme sanatının tarihsel kodlarına erişme çabasında, standartlarının değiştirilmesinde ve yeniden yapılandırılmasında Anglo-Amerikan ve Batı kaynaklarının öncelenmesi, Doğu toplumlarının bu alanda sahip olduğu derinliğin geri planda bırakılmasına yol açmaktadır. Bu doğrultuda, araştırmamıza yön veren temel soruyu şu şekilde ifade edebiliriz;“Doğu toplumlarının siyaset düşüncesi ve yönetim anlayışlarına doğrudan erişebilme imkanı sağlayan siyasetnamelere lafzı ve ruhunu veren temel ilke, değer ve yönetsel prensipler günümüz çağdaş devletinin kamu yönetimi ve kamu hizmetlerine yön verecek niteliğe sahip midir?”Bu noktada, siyasetnamelerin temel kimliğini oluşturan unsurlardan İslamiyet inancı ve Türk kültürünü ön plana çıkarabiliriz. İlk İslam toplumlarının erken sayılabilecek bir dönemde devletleşme sürecine girmeleri ve genişleyen topraklarının daha iyi idare edilebilmesi için komşu medeniyetlerle etkileşime açık bir tutum sergilemeleri zengin bir yönetim mirası oluşturmalarını sağlamıştır. Siyasetname geleneğinin günümüze dek varlığını sürdürmesinde etkili olan diğer bir unsur ise Türk kültürü ve medeniyetidir. Geçiş noktasındaki Anadolu topraklarının zengin yönetsel mirası ve İslamiyet inancının kaidelerini sentezleyerek kendine has“kut ve töre”gibi yönetsel ilkelerle sentezleyen Türkler, devamında da Osmanlılar kurdukları devletlerle yüzyıllar boyu geniş toprakları yönetme gücüne sahip olmuştur. Bu çalışmayla yönetime dair ilke, yöntem ve yapıların Türk dünyası ve İslamiyet inancı ekseninde gelişen siyasetnameler aracılığıyla saptanması ve değerlendirilmesi amaçlanmaktadır. Bu amaç doğrultusunda, kronolojik bir sıra takip edilerek Abdülhamid el-Kâtib, Mâverdi, Yusuf Has Hâcib ve Defterdar Sarı Mehmet Paşa tarafından kaleme alınan siyasetnamelerden detaylı bir şekilde yararlanılmıştır. Çalışmada literatür taraması ve betimsel söylem analizi yöntemleri kullanılmıştır. Saptanan veriler“devlet ve devlet başkanlığı”,“personel sistemi”,“denetim”,“yargı ve hukuk”,“etik ve ahlaki değerler”,“ekonomi”gibi başlıklar altında incelenmiştir. Yapılan bu çalışmayla siyasetnameler aracılığıyla ulaşılan ilke, yöntem ve yönetsel yapıların günümüz çağdaş yönetimleri için pratiğe dayalı kullanılabilir alanlar açması beklenmektedir."
