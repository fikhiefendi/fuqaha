abstract: "Temelini Kur'an ve sünnetten alan İslam Hukuku bir bütün olarak mülahaza edildiğinde, mükelleflerin emir ve nehiylere aynı seviyede muhatap olması icap eder. Ancak Kur'an'da,“Hasâisü'n-Nebî”olarak adlandırılan Hz. Peygamber'e (s.a.v) has bazı hükümler zikredilmektedir. Bu hükümler Hz. Peygamber'e (s.a.v) tahmil edilen ağır risâlet vazifesinin hafifleyebilmesi için Rabbi ile daimi irtibat halinde olmasını gerektiren ibadetler, ümmete örnekliği noktasında, çirkin ithamlardan uzak bir konumda olmasını sağlayan yasaklar, İslam'ın intişarı için lüzumlu olan bazı mubahlar, içermektedir. Ayrıca Hz. Peygamber (s.a.v) kendisine verilen görevi ifa ederken gönderilmiş olduğu ortamın şartlarını ve muhataplarının ihtiyaçlarını göz önünde bulundurarak“Kadâyâ'l- A'yân”denilen özel düzenlemelerde bulunmuştur. Kur'an ve Sünnette karşılaştıkları olaya dair açık bir hüküm bulamayan sahâbe de, gerek ictihadî gerekse de siyasi konumlarının gerektirdiği şartları haiz, dünyevi ve uhrevî bazı maslahata uygun çözümler geliştirmişlerdir. Biz bu çalışmamızda bu özel düzenlemelere ve bu düzenlemelerin başkaları için de geçerli olup olamayacağına ilişkin fukahanın görüşlerini ele alacağız."
