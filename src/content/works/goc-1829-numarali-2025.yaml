abstract: "Hicrî 1046-1052 (Miladî 1636–1642) tarihli olan 1829/15 numaralı Trabzon Şer'iyye Sicili'nde yer alan bazı kayıtlar, dönemin idari, hukuki ve sosyo-kültürel yapısına dair birinci elden veriler sunmaktadır. Şer'iyye sicilleri, Osmanlı hukukunun uygulamadaki görünümünü, toplumsal yapının işleyişini ve yerel düzeydeki yönetim ilişkilerini ortaya koyan temel kaynaklar arasında yer almaktadır. 1829/15 numaralı Trabzon Şer'iyye Sicili'ni temel alan bu çalışma üç bölümden oluşmaktadır. Birinci bölümde, Osmanlı hukuk sistemi genel hatlarıyla incelenmiştir. İkinci bölümde Trabzon Eyaleti'nin idari yapısı analiz edilmiş; görev ve unvanlar, idarî teşkilat ve yerleşim birimleri çerçevesinde değerlendirilmiştir. Ayrıca sicilde yer alan kayıtlar aracılığıyla Trabzon Eyaleti'nin sosyo-kültürel yapısı ortaya konmuş; aile yapısı, toplumsal roller, dini hayat ve gündelik yaşama dair veriler sistematik olarak ele alınmıştır. Üçüncü bölümde ise 1829/15 Numaralı Trabzon Şer'iyye Sicilinin transkripsiyonu verilmiş ve orijinal metinler içeriklerine göre özetlenmiştir. Bu çalışma, Osmanlı taşra yapısını hukuki, idari ve toplumsal boyutlarıyla inceleme imkânı sunmaktadır. Aynı sicil üzerinden yapılan bu inceleme, özgün bir katkı sağlamakta ve yerel tarih yazımına, sicil temelli mikrotarih çalışmalarına kaynaklık etmeyi amaçlamaktadır."
