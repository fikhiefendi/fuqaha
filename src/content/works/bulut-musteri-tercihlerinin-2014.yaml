abstract: "Dünyada büyük bir gelişim gösteren ve 'Faizsiz Bankacılık' adı altında yaygınlaşan katılım bankaları, başlangıçta Müslüman ülkelerde faaliyet gösterirken giderek tasarrufların değerlendirilmesi ve ekonomiye tam anlamıyla katılamayan atıl fonların ekonomiye katılması amacıyla dünyanın bir çok ülkesinde önem kazanmaya başlamıştır. Ticari bankalar ise ekonominin ilerlemesi, fon fazlası olandan fon ihtiyacı olanlara gerekli aktarmanın yapılması açısından çok büyük rol oynamıştır. Rekabetin sürekli arttığı günümüz koşullarında hizmet sektöründe yer alan bankaların farklarını ortaya koyabilmek ve başarılarını arttırabilmek için yoğun çalışmalarda bulunduğu kaçınılmaz bir gerçektir. Modern pazarlama anlayışından yola çıkarak, bankaların başarılarını arttırabilmek için öncelikli amacı müşteri memnuniyetini en üst seviyeye taşımaktır."
