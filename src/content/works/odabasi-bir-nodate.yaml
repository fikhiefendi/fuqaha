abstract: "Bu tez, faizsiz bankacılıkta likidite ihtiyacına cevap vermek amacıyla geliştirilen menkulleştirme uygulamalarından olan icâre sukûkun İslâm hukuku bakımından meşruiyetini, başlıca türleri özelinde incelemeyi amaçlamaktadır. Çalışma, faizsiz finans alanında sıkça dile getirilen“özgünlük”tartışmasının kimi zaman aşırı idealist ve pratikten kopuk bir zeminde cereyan etmesini eleştirmekte ve bunun yerine İslam hukukunun maksatları (makâsıd), maslahat ve kolaylık ilkeleri çerçevesinde çözüm üretme imkânını sorgulamaktadır. Bu yönüyle tez, teorik mükemmeliyet iddiasından ziyade, pratikte karşılaşılan sorunları şer'î ilkelere uygun olarak temellendirmeyi ve bu sorunlara çözümler üretmeyi fıkhî yaklaşımlarına esas alan fakihlerin görüşlerini önemsemektedir. Tezin temel hedefi, icâre sukûk uygulamalarını klasik fıkıh literatürü ile çağdaş şer'î standartlarla mukayeseli bir şekilde ele alarak bu alanda ortaya çıkan temel fıkhî sorunları tespit etmek ve söz konusu sorunlara ilkelerle uyumlu çözüm önerileri sunmaktır. Bu amaç doğrultusunda, tarihi süreçte ortaya çıkan bey' bi'l-vefâ ve bey' bi'l-istiğlâl gibi satış türleri, modern sukûklaştırma işlemleriyle benzerlikleri açısından ele alınmıştır. Bu satım türlerini meşruiyet ve mahiyet bakımından temellendirirken orijinal görüşler serdeden Hanefî fakihlerin yaklaşımları özellikle merkezde tutulmuştur. Ayrıca AAOIFI ile Uluslararası İslam Fıkıh Akademisi tarafından alınan kararlar ve çağdaş akademik çalışmalar karşılaştırmalı olarak değerlendirilmiş ve mevcut uygulamaların fıkhî tahliline odaklanılmıştır. Çalışmada ulaşılan temel bulgu, icâre sukûkun İslam hukukunun temel hükümleri ve maksatlarıyla çatışmadığı için özgün ve meşru kabul edilebileceği yönündedir. Bu çerçevede, icâre sukûk uygulamalarında mülkiyetin mahiyeti, geri alım taahhütleri, garanti mekanizmaları ve ikincil piyasa işlemleri gibi tartışmalı alanlar belirlenmiş; bazı uygulamaların fıkhî açıdan sorunlu olduğu, bazılarının ise uygun yapılandırmalarla meşrulaştırılmasının mümkün olduğu tespit edilmiştir. Tez, Türkiye'de sukûk alanındaki akademik ve hukukî boşluğa dikkat çekerek, özellikle icâre sukûk özelinde yapılacak yasal düzenlemelere fıkhî bakımdan teorik bir zemin sunmayı da hedeflemektedir."
