abstract: "İslâm'dan önce dış ticaretten vergi alınmıyordu. İslâm yayıldıktan sonra ticaret amacı ile alınan mallardan vergi alınmaya başlanmıştır. Bu araştırma kapsamında İslâm Hukukunda dış ticaretin vergi uygulamaları incelenmektedir. Araştırma toplamda iki bölümden oluşmaktadır. Birinci bölümde; verginin tanımı ve temel özellikleri, İslâm öncesi dönemde vergi, diğer toplumlarda vergi ve vergi çeşitleri üzerinde durulmuştur. Bu bölümde ayrıca verginin kimlerden alınacağı ve oranın nasıl yapıldığı konusu ele alınmıştır. İkinci bölümde ise, İslâm hukukunda ticaret kavramı, dış ticaret, dış ticaretin çeşitleri, gümrük kavramı, gümrük verginin genel özellikleri, gümrük işlemleri, taşıtın ve malların kontrol kapsamı, İslâm'da gümrük mahiyeti, İslâm'da gümrük vergisinin oranı ve İslâm toplumunda gümrük vergisi incelenmiştir. Sonuç bölümünde ise araştırma konusundan genel olarak bahsedilmiştir."
