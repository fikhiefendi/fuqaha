abstract: "Türkiye'de bankacılık sistemi ticari bankalar, yatırım bankaları ve katılım bankaları olmak üzere üçlü bir yapıya sahiptir. Katılım bankacılığı, faizsizlik prensibine göre çalıştığı için bazı noktalarda ticari bankalardan ayrılıyor olmakla birlikte birçok faaliyetlerinde ticari bankaların faaliyetlerine benzerlik göstermektedir. Dünya'da faizsiz bankacılık ile ilgili ilk girişim 1963 – 1967 yılları arasında geliştirilen“Tasarruf Sandığı”biçiminde ortaya konulan uygulamaya dayanmaktadır. Dünyadaki ilk faizsiz ticari banka ise 1972 yılında Mısır'da kurulmuştur. 1975 yılında da İslami bankacılığı dünyaya yaymak ve kamusal projelerinin finansmanını çözmek nedeniyle Suudi Arabistan'da 'İslam Kalkınma Bankası' kurulmuştur. Günümüzde faizsiz bankacılık yapan bankalar sadece Müslüman ülkelerde değil Japonya, İngiltere, ABD, Almanya, Danimarka ve Hollanda gibi ülkelerde faaliyet göstermektedir. Faizsiz bankacılık kavramı Türkiye'de ilk olarak 1983 yılında çıkarılan Kanun Hükmünde Kararname ile ''Özel Finans Kurumu'' adı ile kurulan kuruluşlar sayesinde gündeme gelmiştir. 1983 – 2005 arasında“Özel Finans Kurumu”olarak faaliyet gösteren bu kuruluşlar 2005 yılında çıkarılan 5411 sayılı Bankacılık Kanunu ile banka statüsü kazanmışlar ve 2006 yılından bu yana ''Katılım Bankaları'' adı ile varlığını sürdürmektedirler. İslam dinine göre faiz'in haram olması nedeni faiz hassasiyeti olan insanlar faizli bankacılık sisteminden uzak kalmaktadırlar. Katılım bankaları, mali sektörde bir yenilik olarak, faiz endişesi nedeniyle klasik bankalara gitmeyen fonları ekonomiye kazandırmak ve tasarruf sahiplerinin fonlarını güvenle saklamalarına ve değerlendirmelerine yardımcı olmak amacıyla kurulmuştur. Bu çalışmanın amacı çalışma prensipleri açısından konvansiyonel bankalardan ayrılan ve hem dünyada hem de ülkemizde gelişmekte olan katılım bankalarının performansının ölçülmesi ve birbirleri ile performanslarının karşılaştırılmasıdır. Çalışmada 2010 – 2014 yılları arasında ülkemizde faaliyet gösteren dört katılım bankasının performansı CAMELS analizi ile değerlendirilmiştir. Analiz kapsamında 6 bileşene ait toplam 21 değişken belirlenmiş ve elde edilen sonuçlar ilk başta statik analize tabi tutularak yıllık veriler tek olarak incelenmiş daha sonra ise dinamik analiz ile birbirini izleyen yıllar içerisinde performans eğilimleri saptanarak ve diğer katılım bankaları ile karşılaştırılmıştır."
