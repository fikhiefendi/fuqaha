abstract: "Osmanlı arşiv vesikalarının en önemli kaynaklarından biri olma özelliğini taşıyan Şer'iye sicilleri, Osmanlı Devleti'nin siyasî, hukukî ve ekonomik düzeninin, insanların birbirleriyle olan ilişkilerinin ve sosyal yapının ortaya çıkarılmasını sağlayan önemli belgelerdir. Osmanlı Devleti'nin kurumsal yapıları tarafından korunarak günümüze kadar getirilen bu vesikalar, orijinal, güvenilir ve objektif özellik taşıdığından dolayı birinci elden kaynak olarak yapılan çalışmalara ışık tutmuştur. Bu çalışmada, 8 Numaralı Manastır Şer'iye Sicili'nin 1-64 varakları incelenerek XVII. yüzyılın ilk yarısında bir Balkan şehri olan Manastır'ın sosyal, kültürel, siyasî, ekonomik, hukukî ve siyasî yapısının ortaya konulması amaçlanmıştır. Çalışılan sicilde Manastır, Rumeli Eyaleti'nde Paşa Sancağı'na bağlı bir kaza merkezidir. Şehir bugünkü sınırlarımızın dışında olup Makedonya sınırları içerisinde bulunmaktadır. Bölgede çok sayıda etnik gruptan insanlar yaşaması (Müslüman, Yahudi, Nasrânî, Ermenî, Rus, Kıbtî, Çingene, Arap, Türk) dillerin, dinlerin ve kültürlerin kaynaştığı ve birlikte yaşadığı bir yer olması bölgeye ayrı bir özellik kazandırmaktadır. Bu özellik yer, şahıs, mahallî isim ve kelimelere de yansımıştır. Bölgeyle ilgili çalışmaların az olması, çalışmada geçen bazı isimlerin okunmasını güçleştirmişse de Manastır Şer'iye Sicili'nin bölge tarihi ve bölgenin yapısını aydınlatmak açısından birinci elden kaynak olarak ulaşılması sağlanmaya çalışılmıştır. Araştırma sürecinde belgelerin transkripsiyon kısmında her bir belgeye sayfa numarası ve belge numarası verilerek tasniflenmesi sağlanıp belgelere daha kolay bir şekilde ulaşılması sağlanmıştır.Sicilin 1-64 varakları arası 841 tane belge tespit edilip, belgelerin konuları alacak verecek, alım satım, miras, nafaka, mehir, boşanma, vakıf, atama ve görev tevcihleri, vergi, gasp, yaralama ve hırsızlık gibi olaylardır. Bahsedilen belgeler, bölgenin iktisadî ve içtimaî yapısıyla ilgili önemli bilgiler sunmakla birlikte Osmanlı Devleti'nin idarî, siyasî ve adlî yapısıyla ilgili bilgilere de ulaşmamızı sağlamaktadır. Bu nedenle sicilin pek çok araştırmacı için önemli bir kaynak olduğu anlaşılmaktadır."
