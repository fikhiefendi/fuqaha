abstract: "İnsanlar ve toplumsal gruplar sosyal yaşamda diğer bireylerle ve gruplarla olan ilişkilerini sözler ve davranışlarla göstermektedir. Bireylerden sosyalleşme ihtiyacını karşılarken içinde bulundukları topluluğa uyum sağlayacak davranış kalıplarına göre davranması ve topluluğun kurallarına uyması beklenmektedir. Bir topluluğun yaşam biçimini, folklorik unsurlarını, sözlü kültür öğelerini anlamlandırmak için o topluluğun kolektif yaşam içinde oluşturduğu ve nesilden nesile aktardığı örf, âdet, gelenek ve göreneklerin bilinmesine ihtiyaç vardır. Halk hukuku, grupların birbirleriyle ilişkilerinin sonucu olarak doğan sözlü şekilde genelleşmiş kurallardır. Kültürel aktarım yoluyla yöreden yöreye değişkenlik gösteren halk hukuku unsurları; töre, örf, âdet, gelenek, görenek, teamül gibi kaynaklarla şekillenmektedir. Anadolu'nun pek çok bölgesinde olduğu gibi araştırma sahasında da İslam hukukunun etkisi halk hukuku uygulamalarında kendini göstermektedir. Kızıltepe sahasında halk hukukuna ilişkin unsurlar bölgenin geleneksel toplum düzenini yansıtmakla birlikte günümüzde de uygulanmaya devam ettirilmektedir. Kızıltepe halkının geçmişteki örf, âdet, gelenek ve göreneklere olan bağlılığı halk hukuku uygulamalarındaki geçmiş uygulamalarının izleri şeklinde sirayet etmektedir. Çalışma, Kızıltepe'nin sosyal yaşamla değişen folklor unsurlarındaki halk hukuku yansımalarının derlenip irdelenmesi ve bölgenin unutulmaya yüz tutan örf ve âdetlerinin bölgedeki hukuki düzeni sağlamadaki önemini ortaya koyması bakımından önem arz etmektedir. Çalışmada geçiş dönemlerinin, toplumsal ilişkilerin ve aile içi ilişkilerin düzenlenmesinde başvurulan halk hukuku kurallarına, cezai yaptırımlarına yer verilerek bu kural ve yaptırımların sözlü kültür ürünlerine yansımaları irdelenmiştir."
