abstract: "Çalışmanın amacı konvansiyonel bankalar ile katılım bankalarının hizmet kalitesinin karşılaştırılmasıdır. Yani bankalarda verilen hizmetlerde kullanıcıların beklenti ve algıları arasında fark var mıdır, bu farklar nelerdir gibi soruların cevapları aranmaya çalışılmıştır. Araştırmada banka kullanıcılarından veriler toplanarak“Servquel Ölçeği”yöntemi ile müşterilerin beklentileri ve algıları beş boyutta (fiziki görünüm, güvenilirlik, heveslilik, güven ve empati) ele alınarak, onların beklentileri ve algıları arasındaki farkların değerlendirilmesi yapılmıştır. Araştırmanın evrenini konvansiyonel ve katılım bankalarını birlikte kullanan ya da en az birisini kullanan kullanıcılar oluşturmaktadır. Sonuç olarak, yapılan analiz ve araştırmalarda genel olarak bankacılık hizmetlerinin müşterilerin beklentilerini karşılamadığı görülmüştür. Özellikle bütün boyutlarda katılım bankacılığı hizmetleri, konvansiyonel bankalara nazaran oldukça yetersiz görülmüştür. Dolayısıyla bu çalışma, bankacılık sektöründe hizmet eden kurumlar için müşteri algı ve beklentilerini öğrenmek ve ona göre strateji geliştirmek açısından yol gösterici nitelikte olmuştur. Ayrıca Türkiye'de bankacılık hizmet kalitesine yönelik yapılan böylesine bir çalışma olmadığından, yeni araştırmacılara da örnek teşkil etmiş olup, geliştirilmeye muhtaçtır."
