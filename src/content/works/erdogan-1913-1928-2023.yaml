abstract: "Sözleşme serbestisi kavramı günümüz hukukunun temel ilkelerinden biri sayılır. Sözleşme serbestisinin meri hukuktaki bu önemli yeri 19. yüzyıl Batı hukuku düşüncesinde ilk defa kavram olarak ortaya çıkışıyla beraber düşünüldüğünde, kavramın Batı dışındaki hukuk ekolleriyle olan etkileşiminin keyfiyeti irdelenmesi gereken bir konudur. Bu çalışmanın amacı bu etkileşim sürecini Mecelle ve sonrası için Osmanlı-Cumhuriyet bağlamında ele almak, kavramın uygulamaya giriş sürecindeki hukuk ve iktisat temelinde yürütülen tartışmaları ortaya koymaktır. Bir şemsiye kavram olarak“serbestî”(liberalizm) iktisadi, siyasi ve hukuki yansımaları olan bir anlamsal bütünlüğe sahiptir. Bu kavramın hukuki veçhesini ifade eden sözleşme serbestisinin (serbestî-i mukavelât) ise Batı hukuku ve kapitalist ekonomi modeli çerçevesinde üretilen bir kavram olduğu ve iktisadi yayılım sürecinde Osmanlı dünyasına girdiği görülür. Mecelle'de“Bey' bi'ş-Şart”başlığında ele alınan şartlar konusunun Hanefi mezhebine göre düzenlenmesi dönemin serbest ticaret ve sözleşme anlayışıyla uyuşmadığı bizzat Mecelle Cemiyeti tarafından tespit edilmiş ve örfe yapılan atıfla çözülmeye çalışılmıştır. Bu teklifin uygulamada yeterli olmaması sebebiyle özellikle II. Meşrutiyet ve sonrasında görülen eleştirilere karşılık olarak Usul-i Muhakemât-ı Hukukiye Kanunu ve Mecelle'de yapılan tadil çalışmalarıyla ticari ilişkilerdeki ihtiyaçlar giderilmeye çalışılmıştır. Bu süreçte fıkıh birikiminin sözleşme serbestisi kavramına imkân verecek şekilde yeniden okunduğu, ilk başta telfîk usulünce mezhepler arası bir yaklaşım benimsenirken daha sonra mezheplerle sınırlı olmadan uygun bir ictihadın tercihiyle kavrama meşruiyet sağlandığı görülmüştür. Son olarak, çalışma dâhilinde sözleşme serbestisi ilkesinin yürürlüğe girdiği ilk düzenlemenin 1914 Usul-i Muhakemât-ı Hukukiye Kanunu olduğu tespit edilmiştir."
