abstract: "Araştırmanın amacı; sermaye piyasası araçlarından olan gayrimenkul yatırım fonlarının ve Türkiye'de gayrimenkul yatırım fonlarının gelişiminin ve uygulanabilirliğinin, ikincil veriler ve paydaşlar görüşmelerinin sonuçlarına dayalı olarak değerlendirilmesidir. Araştırma kapsamında gayrimenkul yatırım fonlarının gelişimi ve seçilmiş ülkelerdeki mevcut durumu öncelikle teorik olarak incelenmiş olup, Türkiye'de yeni bir yatırım fonu aracı olan gayrimenkul yatırım fonunun gelişimi ve mevcut durumu; yasal düzenlemeler ve uygulama açılarından incelenmiştir. Araştırmanın uygulama kısmında ise Türkiye'de Sermaye Piyasası Kurulu'nca yürürlüğe konulan“Gayrimenkul Yatırım Fonlarına İlişkin Esaslar Tebliği”ile kurulan gayrimenkul yatırım fonlarının yapısı, çeşitleri, fonların başlıca yatırım yaptıkları veya yapma eğiliminde oldukları projeler, fonların temel sorunları ve çözüm olanakları, ikincil veriler olan portföy yönetim şirketleri, gayrimenkul değerleme şirketleri, saklayıcı kuruluşlar, denetim firmaları, fona ürün sağlayanlar ve fona yatırım yapan yatırımcılarla yüz yüze görüşme yoluyla toplanan verilere göre değerlendirilmiştir. Veri toplamada derinlemesine görüşme mülakat tekniği kullanılmış olup, bu yöntemde yüz yüze ve birebir görüşmeler neticesinde hedef kişilere araştırma ile ilgili açık uçlu sorular yöneltilmiş, yöneticiler ve gayrimenkul yatırım fonunda yer alan diğer paydaşların gayrimenkul yatırım fonu ve Türkiye'deki uygulama sorunları, fonların tapudaki işlem sorunları, ülke ekonomisi, inşaat ve gayrimenkul sektörüne olan katkılarının incelenmesi sağlanmıştır. Araştırma sonuçlarına göre gayrimenkul yatırım fonlarının ülke ekonomisi ve özellikle inşaat ve gayrimenkul sektörlerine önemli katkısının olabileceği, ancak henüz fonların uygulamasının oldukça yeni başlamış olması nedeni ile fonların net ekonomik katma değer ve performans analizlerinin yapılması için yeterli verilerin olmadığı ortaya konulmuştur. Gayrimenkul yatırım fonları ile nitelikli yatırımcı sınıfı içinde olmakla birlikte nispeten küçük yatırımcı sayılabilecek gerçek ve özel hukuk tüzelkişilerinin büyük parasal değerlere ulaşan gayrimenkul yatırımlarına katılımlarının önü açılmış olmaktadır. Fonun Sermaye Piyasası Kurulu tarafından denetlenmesi ve uzman kişilerce yönetilmesinin sağladığı güven neticesinde gayrimenkul yatırım fonlarının bilinirliği ve yabancı yatırımcıların ilgisi artmaktadır. Yasal düzenlemelerin yapılması ve mali konularda kolaylıkların sağlanmasına karşın, yapılan düzenlemelerin eksik yönlerinin olması, fon yöntemi, yatırım analizleri ve risk değerlendirme konusunda çalışan gayrimenkul geliştirme uzmanlarının sayısının yetersizliği, değerleme sistemine ilişkin yetersizlikler, mülkiyet, imar ve inşaat süreçlerine ilişkin sorunlar fonların gelişimini kısıtlamaktadır. Gayrimenkule dayalı diğer araçlarda olduğu gibi gayrimenkul yatırım fonlarının kuruluşu, değerlemesi, risk ve yatırım analizleri konularında çalışan Gayrimenkul Geliştirme ve Yönetimi uzmanlarının artırılması ve fonların paydaşları olan kurumlarda istihdam edilmelerinin sağlanması ile sorun çözümleme ve fonların hızla gelişimine katkı sağlanması mümkün olabilecektir. Bunun dışında fonların yatırım yaptıkları gayrimenkullerin mülkiyet ve imar haklarının sigorta ve diğer yollarla güvence altın alınması ve İslami finans temellerine dayalı ürünlerle yabancı yatırımcı sayısının artırılmasına özen gösterilmesi de gerekli görülmektedir."
