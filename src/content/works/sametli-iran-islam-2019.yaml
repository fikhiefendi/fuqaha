abstract: "İran İslam Cumhuriyeti'nin İtikâdî doktrinini, Velayet-i Mutlakay-i Fakik üzerinde dayanmaktadır. Bu doktrin Şii klasik ve çağdaş fıkhında ender görüşlerden birisidir. İran İslam Cumhuriyeti Anayasası da önce bu doktrin ve sonra Şii fıkhı temelleri üzerinde, teokratik ve demokratik unsurları içinde barındırarak kurulmuştur. Bu karma anayasa karma bir siyasi yapının kurulmasına yol açmış ve İran İslam Cumhuriyeti'ni uluslararası camiada ve evrensel hukuk ilkeleri açısından, uluslararası hukuku ihlal eden bir devlet konumunda oturtmuştur. Bu araştırmada Velayet-i Fakih doktrini, Şii siyasi fıkhı ve Ayetullah Ruhullah Humeyni'nin düşüncelerinde, enine boyuna incelenmiştir. Ayrıca İran İslam Cumhuriyeti'nin 1979 ve 1989 anayasaları analiz edilerek, devletin siyasi yapısı, temel ilkeleri ve iç hukukun dış hukuka karşı tutumu irdelenmiştir. Son olarak İran İslam Cumhuriyeti ve uluslararası hukuk ölçütleri açısından, yabancı temsilcilikler ve diplomatların dokunulmazlığı ve bu doğrultuda Amerika Birleşik Devletleri Diplomatları Rehine Krizi olayı ve Türkiye, İngiltere ve Suudi Arabistan temsilciliklerine saldırı vakaları, diğer bölümde de ise Salman Rüşdi Krizi ve Ayetullah Humeyni'nin Şeytan Ayetleri yazarına karşı yayınladığı ölüm fetvası ve nihayet İran'da 18 yaş altı çocukların infazı, İslam ve Şii fıkhı ve uluslararası hukuk açısından irdelenmiştir. Bu tezin sonunda da“İran İslam Cumhuriyeti'nin Birleşmiş Milletlerin üyesi ve birçok uluslararası hukuk anlaşmalara tabi olmasına rağmen, karşılaştığı birtakım uluslararası konularda, uluslararası hukuk ve İslam öğretilerine uymayarak kendi rejim yararları, radikal görüşleri ve ulusal çıkarları doğrultusunda ihlallere neden olduğu”sonucuna varılmıştır."
