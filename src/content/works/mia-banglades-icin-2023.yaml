abstract: "Yaklaşık 50 senedir Bangladeş'te sivil toplum kuruluşlarının dışında mikrofinans kuruluşları da ekonomisini güçlendirmek ve fakirliği azaltmak için hizmet etmiştir. Ne yazık ki Bangladeş ekonomik açıdan gelişmesine rağmen sosyal refahın sağlanması ve fakirlikle mücadele konusunda pek ilerleme gösterememiştir. Tezin amacı zekât ve İslami mikrofinansı bir araya getirip sürdürülebilir yeni bir kurum oluşturmaktır. Konuyla ilgili detaylı tartışmalar üç farklı bölümde ele alınmıştır. İlk bölümde çalışmanın ana konusu olan zekât ve İslami mikrofinanstan bahsedilmiştir. İlk olarak fakir, miskin ve zengin kavramlarıyla ilgili mevcut fıkhi tartışmalar ele alınmıştır. Zekât ile fakir ilişkisi, zekât ile mikrofinans ve İslami mikrofinans ilişkisi hakkında örnek kurumlarıyla birlikte anlatılmıştır. Çalışmanın ikinci bölümünde mikrofinans çatısı altında kimlere ne kadar zekât verileceği bağlamında altı mesele ele alınmıştır. Son bölümde mikrofinans, İslami mikrofinans ve zekât kurumları varken Bangladeş'te neden zekât temelli yeni bir mikrofinans kurumuna ihtiyaç olduğu sorusuna cevap aranmıştır ve bu çalışmanın teklif ettiği yeni kurum açıklanmıştır. Bu bölümde kurumun teorik ve pratik uygulaması ile ilgili konular kaleme alınmıştır."
