abstract: "Cedel, bir konu üzerinde kendi görüşünün doğruluğunu, karşı tarafın görüşünün ise yanlışlığını ortaya koymak için tarafların arasında cereyan eden tartışmayı ifade eder. Bu tartışma metodu pek çok ilimde uygulanmış olup bizim ele aldığımız alan, cedelin fıkıh ilminde yapılan istidlallere nasıl uygulandığı olmuştur. Bunu yaparken çalışmamızda pergelin sabit ayağını oluşturan alan Ebû İshak eş-Şîrâzî'nin eserleri olmuş, buna ilave olarak diğer cedel eserlerine de müracaat edilmiştir. Cedel yönteminin fıkıh ilmine uygulanmasını konu edindiğimiz bu çalışmamızın, giriş ve sonuç kısımları haricinde üç bölümde ele alınması planlanmıştır. Giriş bölümünde çalışmamızın konusundan, amacından ve öneminden bahsedilmiş ve çalışmamızın yazımında takip ettiğimiz yöntem aktarılmıştır. Ayrıca kaynakların değerlendirilmesine de bu bölümde yer verilmiştir. Birinci bölümde bir tartışma yöntemi olan cedel hakkında genel bir perspektif çizilmiş; cedelin ne olduğundan, tarihinden ve benzer ilimlerle münasebetinden bahsedilmiş, bu ilimlere dair bazı literatür örneklerine yer verilmiştir. Ayrıca genel anlamıyla tartışmanın nasıl işleyeceğine dair bilgiler zikredilmiştir. İkinci bölümde, ilk olarak çalışmamızın temel kaynaklarının sahibi olan Şîrâzî'nin biyografisine yer verilmiş, sonrasında onun şer'î deliller üzerinde nasıl tartışılacağına dair görüşleri işlenmiş; usûlî cedeldeki soru türlerine yer verilmiştir. İkinci bölümde ana hatlarıyla zikredilen bu soru türlerinin deliller üzerine nasıl tatbik edileceği ise üçüncü bölümde konu edinilmiştir. Çalışmanın ana gövdesini oluşturan bu bölümde her bir delil özelinde hangi itirazların gündeme gelebileceği örnekler ile açıklanmıştır."
