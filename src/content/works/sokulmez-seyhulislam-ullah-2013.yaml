abstract: "Bu tez, 12 Rebîülevvel 1008/2 Ekim 1599 ile 20 Safer 1017/5 Haziran 1608 tarihleri arasındaki muhtelif zamanlarda dört defa, beş yıl yedi ay süreyle Osmanlı Devleti?nde şeyhülislâm olarak görev yapan Sun`ullah Efendi?nin fetvaları örneğinde Osmanlı Hukuku?nda talâk konusu ile ilgili Arapça fetvaları Türkçe?ye çevirme ve fetvaların değerlendirilmesi konusunu içermektedir. Bu çerçeve dâhilinde Osmanlı Devleti?nde meşhur olan fetva mecmualarına, fetva ile kaza arasındaki ilişkilere ve Osmanlıda şeyhülislâmlık kurumu konularına da yeri geldikçe değinilmiştir.Araştırma, giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, konusu ve metodları açıklanmıştır. Birinci bölümde Şeyhülislâm Sun`ullah Efendi?nin hayatı, hizmetleri ve eserleri, fetva ile kaza arasındaki ilişki, Osmanlıda meşhur olan fetva mecmualarından bir kısmı hakkında özet bilgi verilmiş ve şeyhülislâmlık kurumu hakkında genel bir giriş sunulmuştur. İkinci bölümde Şeyhülislâm Sun`ullah Efendi?nin fetvalarına göre talâk konusu ele alınmış, üçüncü bölümde ise talâkla ilgili bilgiler ışığında fetvalar değerlendirilmiştir."
