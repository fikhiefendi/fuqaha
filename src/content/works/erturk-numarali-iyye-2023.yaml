abstract: "Şer'iyye sicilleri, adaleti temsil eden kadıların görev yaptıklar yerleşim birimlerinde şer'i mahkemelere intikal eden adlî vakalar hakkında yaptıklar işlemleri yahut verdikleri hükümleri, üst makamlardan gelen resmi belgelerin suretlerini ve sorumlu olduklar bölgelerdeki adlî olaylar kaydettikleri defterlerdir. Kadı ve naibler tarafından tutulan bu defterler ferman, berat, buyuruldu, mektup, tezkere, hüccet ve i'lam gibi çeşitli belgeleri içermektedir. Siciller, merkez- taşra arasındaki ilişkileri, devlet görevlilerine ait belgeleri ve kadıların aldıklar kararlar ihtiva etmektedir. Şer'iyye sicilleri sayesinde ait olduğu dönemin sosyal, ekonomik, idari, askeri ve hukuki özellikleri hakkında bilgi edinmek mümkündür. Bu çalışmada, 5 Numaral Bor Şer'iyye Sicilinden elde edilen verilerden hareketle (H. 1083- 1085) (M. 1672- 1675) yıllar arasında Bor kazasının sosyal, ekonomik durumu ve askerî faaliyetlerin oluşturduğu etkiler tahlil ve analiz edilmeye çalışılmıştır."
