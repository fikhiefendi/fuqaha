abstract: "İnsanlık tarihinde bankacılığın temeli çok eski zamanlara dayanmaktadır. Para icat edilmeden önce insanlar tasarruflarını biriktirmeye başlamış ve bu birikimlerini emanet edecekleri yerler aramış, bu arayış bankacılık faaliyetlerinin oluşumuna zemin hazırlamıştır. Emanet edilen ödünçler önceden aynî iken paranın icadı ile nakdî hale gelmiştir. Mevcut en eski perakende bankası 1472'de, mevcut en eski ticaret bankası ise 1590'da kurulmuştur. Türkiye' de ise ilk banka 1845 yılında İstanbul Bankası ismiyle açılmıştır. Bankacılık sektöründe önemli bir yeri olan faiz, uygulanması noktasında tarih boyunca başta semavî dinler olmak üzere beşeri sistem ve ideolojiler tarafından tartışılıp eleştirilmiştir. Yaşadığımız coğrafyanın dini, ahlâki ve toplumsal yapısını göz önüne aldığımızda faizli bankalara alternatif faizsiz bankacılık sisteminin oluşması kaçınılmazdır. Dünyada büyük gelişim sürecine giren faizsiz bankacılık 1940-1970 yılları arasında özellikle Mısır'da kendini göstermiştir.“Faizsiz Bankacılık”adı altında yaygınlaşan katılım bankaları, başta Müslüman ülkelerde faaliyet gösterirken bugün farklı ihtiyaçların karşılanması noktasında tüm dünyada önem arz eden bir işlevsellik kazanmıştır. Bugün dünya üzerinde beş kıtada 60'dan fazla ülkede faaliyet gösteren İslâmî finans kuruluşları ve bankaların sayısı dünya genelinde 400'e yaklaşmaktadır. Yıllık sermayesi ise iki trilyon dolar olup toplam bankacılık faaliyetlerinin yüzde ikisini oluşturmaktadır. Türkiye'de hali hazırda uygulanan üç tür bankacılık sisteminden bahsedilebilir. Bunlar; Mevduat Bankacılığı, Katılım Bankacılığı ve Yatırım ve Kalkınma Bankacılığıdır. Faizsiz bankacılık sistemi“Özel Finans Kurumları”olarak ülkemize ilk olarak 1984 yılında girmiş, 2000'li yıllarda ilerleme kat etmiş, 2005 yılında ise“Katılım Bankacılığı”adını alarak bankacılık sektöründe büyük bir gelişme göstermiştir. Bu gelişmeler katılım bankalarının faizli bankalar karşısında faiz yasağı, akit serbestesi, kâr zarar ortaklığı gibi İslâmî değerleri ve murabaha, müşâreke, mudarebe, sükuk, icâre gibi İslâm Fıkhını temel alarak alternatifler sunmaktadır."
