abstract: "ÖZET Günümüzde özellikle ticari hayatta, cezai şart, sözleşmelerin vazgeçilmez unsuru haline gelmiştir. Borçludan cezai şart vaadi alan alacaklı, kendini güvencede hisseder. Zira işin icra safhası bu şekilde çok kolaylaşmaktadır. İcra safhasını kolaylaştırması dışmda cezai şartın bir diğer önemli işlevi, borcunu vaktinde ve doğru bir şekilde ödemek konusunda, borçluya psikolojik baskı yapmasıdır. Bu çalışmada sözleşmelerin bir türü olan cezai şartı temellendirmek amacıyla irade ve şart hürriyeti hakkında bilgi verilerek bir ön hazırlık yapılmıştır. İslam hukuk ekolleri dönemi hukukçularının bu konularla ilgili görüşleri karşılaştırma yapılmak suretiyle incelenmiş ve bir değerlendirmeye gidilmiştir. Batı hukukunda uygulama alanı bulan cezai şart,İslam hukukunda muteber sayılan rehin ve kefelet akdi gibi alacaklının hakkının güvenceye alınmasını hedeflemektedir. Ayrıca borçlunun borcunu zamanında ifa etmesi yönünde mali bir müeyyide mahiyetindedir. Ticaret, sanayi ve teknolojinin geliştiği günümüzde borçların icrasının gecikmesi veya ifa edilmemesi durumunda alacaklının telafisi mümkün olmayacak oranda zarara uğraması muhtemeldir.Bu nedenle cezai şartın varlığına önceki dönemlerle kıyaslanmayacak derecede ihtiyaç duyulmaktadır. Araştırmada cezai şart konusunda klasik dönem hukuk ekollerinin görüşlerine yer verilmiş bu ekoller arasında karşılaştırmalar yapılmıştır. Ayrıca medeni hukuktan da yararlanılmıştır. Bu çalışmayla Batı kaynaklı cezai şartın İslam hukuku prensipleri çerçevesinde değiştirilmesi durumunda ne derece uygulama alanı bulunabileceği amaçlanmıştır. VI"
