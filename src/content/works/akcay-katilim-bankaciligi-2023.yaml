abstract: "Türkiye'de katılım bankacılığı hizmet ve ürünleri, özellikle son yıllarda daha fazla tercih edilmesiyle öne çıkmaktadır. Katılım bankacılığı her ne kadar geleneksel bankacılık sistemine kıyasla bankacılık ürünlerinin bir kısmından mahrum kalsa da gelişen ve değişen piyasa koşullarına ayak uydurmakta zorlanmayan, değişimlere hızlı uyum sağlayan yenilikçi yapılarıyla finans piyasalarında daha fazla karşılık bulmaya başlamıştır. Uluslararası bankacılık sektöründe katılım bankacılığı nispi olarak daha düşük bir paya sahip olsa da özellikle Müslüman nüfusun yoğun olduğu ülkelerde katılım bankacılığı ürünleri oldukça yaygın olarak tercih edilen bir finansal alternatif olarak destek görmektedir. Dünyada yaygın olarak kullanılan katılım bankacılığı ürünleri arasında olan“teverruk”ürünü, banka müşterilerinin nakit ihtiyacının doğrudan temini için kullanılmaktadır. Türkiye'de katılım bankacılığı sektöründe en sık kullanılan finansman usulû ise“murabaha”yöntemi olarak bilinmektedir. Bu iki yöntem dışında gittikçe kendini gösteren ve gelecek yıllarda daha fazla tercih edilip kullanılacağı öngörülen katılım bankacılığı finansmanı alternatifi ise“mudarebe”yöntemidir. Bu çalışmada, mevcut ekonomik şartlarda yeni bir güvenilir alternatif olarak mudarebe yöntemine olan ihtiyacı belirlemek ve katılım bankacılığında gelenekselleşmiş olan murabaha yönteminin dışına çıkabilme yollarını araştırmak amacıyla; nüfus yoğunluğunun yüksek olduğu ve katılım bankacılığı işlemlerinin yoğun bir şekilde kullanıldığı İstanbul ilinde çalışan katılım bankası çalışanlarından anket yöntemi ile veriler temin edilmiştir. İstanbul'daki katılım bankası çalışanlarına, mudarebe yönteminin daha etkin kullanım olanaklarını ortaya koymak üzere; öncelikle katılımcıların yaşı, mesleki deneyimleri, eğitim durumları, çalıştıkları kurumdaki pozisyonları, katılım bankacılığındaki mesleki deneyimleri ile mevduat, yatırım ve kalkınma bankalarındaki tecrübeleri konusunda 5'li likert tipinde sorular iletilmiştir. Anket kapsamında cevaplandırılmak üzere toplam 303 katılımcıya 34 adet soru sunulmuştur. Toplanan veriler SPSS ve AMOS istatistik programlarına aktarılarak analiz edilmiş, ulaşılan bulgular yorumlanmıştır."
