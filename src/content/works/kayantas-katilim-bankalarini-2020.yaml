abstract: "Bu çalışmanın amacı Bingöl ilinde Katılım Banklarını kullanan müşterilerin farkındalık düzeylerinin tespit edilmesi ve katılım bankalarını kullanan müşterilerin katılım bankalarına bakışlarını istatistiki analizlerle ortaya koymaktır. Ayrıca bu alanda Bingöl ilinde yapılmış ilk çalışma olması nedeniyle bilimsel çalışmalar alanında Katılım bankacılığı alanına önemli katkılar sunacağı söylenebilir. Bu çalışmada kullan veriler Bingöl ili şehir merkezinde anketle veri toplama yöntemiyle müşterilerle yüz yüze yapılan görüşmeler sonucu elde edilmiştir. Bu kapsamda 385 adet anket yapılmıştır. Çalışma da anket yöntemi ile elde edilen veriler SPSS programı aracılığıyla frekans analizi, gruplama yöntemi ve faktör analizi uygulanmıştır. Katılım bankası müşterileri, kamu çalışanları, serbest çalışanlar, emekliler ve çalışmayanlar olarak gruplandırılmıştır. Kamu çalışanları grubuna memur ve işçiler alınmış ve bunların genel katılım içerisindeki oranı %55,84 olarak belirlenmiştir. Serbest çalışan grubuna esnaf, iş adamları, çiftçi ve belirli bir aylık karşılığında serbest çalışan müşteriler alınmıştır ve bunların tüm katılımcılar içerisindeki oranı %15,58 olarak tespit edilmiştir. Emekli grubuna yaş farkı gözetmeksizin herhangi bir kurumdan emekli aylığı alan müşteriler alınmıştır ve bunların tüm katılımcılar içerisindeki payı ise %6,49 olarak belirlenmiştir. Çalışmayan grubuna ise herhangi bir işte çalışmayıp ve herhangi bir geliri olmayan müşteriler ve öğrenciler alınmıştır bunların tüm katılımcılar içerisindeki payı %22,07 olarak belirlenmiştir. Katılım bankalarını tercih eden müşterilerin bankacılık tercihlerini etkileyen faktörlerin ortaya konulması konuyu daha çok açığa kavuşturacağı söylenebilir. Buna göre çalışmada belirlenen 22 değişken faktör, 2 faktöre indirgenmiş ve tanımlanmıştır. Birinci faktör Banka ve Müşteri İlişkisi ikinci faktör olarak da Sunulan Hizmetlerin Uygunluğu olarak tanımlanmıştır. Dolayısıyla Katılım bankalarını tercih eden müşterilerin etkilendiği faktörlerin bu iki faktör çerçevesinde ele alınması gerektiği söylenebilir. Bu iki faktörün toplamı toplam varyansın %58,03‟ünü açıkladığını ve yine yapılan analizde KMO test değerinin 0,963 gibi yüksek bir değerle kullanılan değişkenlerin faktör analizi için uygun olduğu belirlenmiştir."
