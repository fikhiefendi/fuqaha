abstract: "Bu tez çalışmasının amacı; çalışan memnuniyeti kavramını günümüze kadar üretilen teoriler ve tarihsel bakış yönüyle anlatıp, ayrıca ekip kavramıyla ilişkini ortaya koyduktan sonra İslami Değerler ışığında ele almak, diğer yandan bir saha çalışması ile İslami Değerlerin Çalışan Memnuniyetine Etkilerinin Katılım Bankası örneğine değinmektir. Çalışmanın ilk kısmında kapsamlı olarak; çalışan memnuniyetinin tanımı, önemi, tarihsel seyri ve çalışan memnuniyetini etkileyen faktörler ile ekip kavramının çalışan memnuniyetiyle ilişkileri ele alınmıştır. İkinci kısımda; çalışma yaşamında İslami Değerlerin önemi ve İş Ahlakı ilişkileri yer almaktadır. Bunun yanı sıra; çalışan memnuniyetine İslami değerlerle bakış ile İslami değerlerle çalışan memnuniyeti arasındaki ilişki ele alınmıştır. Üçüncü kısımda yer alan saha çalışmasında İslami değerler ve çalışan memnuniyeti arasındaki ilişkiyi ölçmek için anket kullanılmıştır. Çalışmanın örneklemini 300 adet katılım bankası çalışanı oluşturmaktadır. Anketlerden elde edilen veriler; SPSS ve Smart-PLS 2.0 programları analizlerine tabi tutulmuştur. Analizler neticesinde, saha çalışmasının uygulandığı Kurumda İslami değerlerden; Hikmet, Şecaat, İffet, Adalet ve Mülk'ün anlamsız, İnsanın değeri ve Tevhidin anlamlı olduğu sonuçlarına ulaşılmıştır."
