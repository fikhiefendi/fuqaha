abstract: "Sosyal bir olgu olarak Batı'da ortaya çıkmış olan modernite, Müslümanların yaşamında ve İslam düşünce dünyasında derin tesirler bırakmış, bundan etkilenen düşünürlerin fıkha yeni yaklaşımlar getirmelerine neden olmuştur. İslam dünyasında modernleşme sürecinin nasıl geliştiği, modern yaklaşıma sahip müelliflerin dayandıkları argümanlar ve Zahid el-Kevseri'nin eleştirileri ile fıkhi mirası çalışmamızın konusunu oluşturmaktadır."
