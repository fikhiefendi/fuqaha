abstract: "Her Müslümanın günlük hayatında yaptığı ibadetlerin başında namaz gelmektedir. Bu sebeple namaz konusunun delilleriyle birlikte temel kaynaklardan araştırılması zorunludur. Bunun için mezhep imamlarına yakın dönemlerde yazılmış kaynaklardan konunun araştırılması, doğru bilginin elde edilmesi açısından son derece önem arz eder. Bu çalışmada Hanefî mezhebine ait ilk dönem eserlerinden biri olan Mebsut ile Şafiî mezhebine göre yazılmış yine ilk dönem bir kaynak olan Hâvil-Kebîr kitaplarının namazla ilgili bölümlerinin bazı kısımları mukayese edilerek incelenmiştir. Mebsut, Hanefî mezhebinin kurucusu Ebu Hanîfe'nin talebesi İmamı Muhammed'in yazmış olduğu eserlerin şerhi iken, Hâvil-Kebîr de Şafii mezhebinin kurucusu İmamı Şafiî'nin talebesi Müzeni'nin kitabının şerhidir. Bu çalışmada her iki müellifin hayatlarına, eserlerine ve mezhepteki yerlerine kısaca temas edilmiştir."
