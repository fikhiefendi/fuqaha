abstract: "İslâm tarihinde Hz. Peygamber'in vefatıyla birlikte Müslümanlar arasında özellikle Hz. Ali'nin hilafet döneminde İslâm toplumunda meydana gelen tefrika olayları hadis uydurma hareketinin başlamasına sebep olmuş, gerek siyasî, gerek itikadî gerekse fıkhî konularda ihtilaflar yaşanmıştır. Bu olaylar güvenilir ve doğru haberi elde etme yöntemlerini geliştirmeye yönelik çalışmaların yapılmasına zemin hazırlamıştır ve bu alanlarda hadis kullanımına yönelik bazı ilkeler vaz edilmiştir. Bu çalışmada bu ilkelerin neler olduğu ortaya konulmuş ve İslâm hukukçularının koydukları bu kurallara uyup uymadıkları ve uymadılarsa hangi sebeplerle kuralları esnettikleri araştırılmıştır. Çalışmamız giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında çalışmanın konusu, amacı ve kaynaklarına değinilmiştir. Birinci bölümde çalışmamız ile ilgili temel kavramlar olan sünnet ve hadis, mütevâtir ve âhâd, makbul ve merdûd, yakîn ve zan, fıkıh ve ahkâm kavramları açıklanmıştır. İkinci bölümde ise İslâm hukukunda makbul hadis kullanımı zorunluluğu, hadislerde zaafiyetin beyan zorunluluğu, uydurma rivâyetlerle amel etmeme ve uyarısız nakletmeme zorunluluğu, fıkıhta zayıf ve uydurma hadis kullanımına dair âlimlerin görüşlerine yer verilmiştir. Çalışmamız neticesinde âlimlerin, gerek itikatta gerek ahkâmda gerekse ahlak konularında zayıf hadislerle amel edilmeyeceğini belirtmiş olsalar da maalesef bu alanların hepsinde de zayıf hadis kullandıkları tespit edilmiştir."
