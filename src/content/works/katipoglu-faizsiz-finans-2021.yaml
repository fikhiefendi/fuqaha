abstract: "Bu çalışma ile faizsiz finans sektöründe çalışan kişilerin işsiz kalma korkusunun işkoliklik ve motivasyon ile ilişkisinin ortaya konması amaçlanmıştır. Yapılan çalışmada örneklem olarak Türkiye'de bulunan Samsun ilinde faaliyet gösteren faizsiz finans sektörü çalışanları seçilmiştir. Veriler, 156 kişinin katılımıyla online anket sistemi yardımıyla elde edilmiştir. Verilerin analizi sırasında SPSS 22.0 analiz programı kullanılmıştır. Yapılan analizlerde anket formu üç kısma ayrılmış, tüm anket sorularına ve her bölüme ayrı ayrı güvenirlik analizi uygulanmış, güvenirlikleri kabul edilebilir düzeyde çıkmıştır. Faktör analizi uygulanan verilere daha sonra regresyon analizi uygulanmıştır. Regresyon analizi sonuçlarına göre işkoliklik ile motivasyon arasında anlamlı bir ilişki olduğu tespit edilmiştir. İşsiz kalma korkusu ile motivasyon arasındaki ilişkinin ve işkoliklik ile işsiz kalma korkusu arasındaki ilişkinin ise anlamsız olduğu tespit edilmiştir. Bu sonuçlara göre işsiz kalma korkusunun, işkoliklik ve motivasyon arasında aracı rolü bulunmadığı görülmektedir."
