abstract: "Ebu Bekir el-Cessâs 10. Yüzyılda yaşamış, devrin en büyük Hanefî fakihi Ebü'l-Hasan el-Kerhî ve Hâkim en-Nîsâbûrî gibi âlimlerden ders almış önemli bir âlimdir. el-Cessâs, Kerhî'nin vefatından sonra Bağdat'ta ders vermeye başlamıştır. Ebû Bekir Muhammed b. Mûsâ el-Hârizmî, Ebû Abdullah Muhammed b. Yahyâ el-Cürcânî, Ebü'l-Hüseyin Muhammed b. Ahmed ez-Za'ferânî, Ebû Ca'fer Muhammed b. Ahmed en-Nesefî, Ebû Ca'fer el-Üsrûşenî, Muhammed b. Ahmed el-Vâsıtî gibi birçok talebe yetiştirmiştir. el-Cessâs'ın ona yakın eseri vardır ve ahkâm âyetlerini tefsir ettiği Hanefî mezhebinin hükümlerini barındıran Ahkâmü'l Kur'ân'ı en meşhurudur. Ahkâmü'l-Kur'ân hüküm içeren âyetleri tefsir etmesi açısından yazılan ilk örneklerden biridir. el-Cessâs âyetleri tefsir ederken Arap şiirinden deliller getirmiştir. Bu çalışmanın asıl konusu el-Cessâs'ın şiirle istişhâd yöntemidir. el-Cessâs'ın şiiri delil getirdiği âyetler konu ve dil bakımından farklıdır. Tefsir ettiği âyete şiiri delil olarak ilk sırada da getirmesi onun dil bakımından şiirlere duyduğu güveni ortaya koyar. Ebu Bekir el-Cessâs'ın Ahkâmu'l Kur'ân adlı eserini konu edinen bu çalışma iki bölümden oluşmaktadır. Birinci bölümde müellifin hayatına, eserlerine, ilmî kişiliğine, Kur'ân ve hadiste şiirin konumuna yer verilmiştir. Çalışmanın ikinci bölümünde çalışmanın en temel konusunu oluşturan Ahkâmu'l Kur'ân'da şiirle istişhâd yöntemi belirlenmiştir. Bu bağlamda şiirle istişhâd ettiği âyetler sınıflandırılmış ve örneklendirilmiştir. Böylece Ahkâmu'l Kur'ân'daki şiirle istişhâd yöntemi ortaya konmuştur."
