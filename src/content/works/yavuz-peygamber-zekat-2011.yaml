abstract: "İslâm dininin en önemli esaslarından biri olan zekât ibadeti, Hz. Peygamber zamanında kurum haline getirilmiş ve bu kurum organizesi kamu otoritesinin yetkisine havale edilmiş.Hz. Peygamber döneminde zekât mallarının toplanma zamanı belirlenmiş, düzenli bir şekilde toplanması için görevliler atanmış, toplanan zekâtlar kayıt altına alınmış ve Kur'ân-ı Kerîm'de belirtilen yerlere dağıtılmıştır. Zekât müessesesinin işlevselliğini yerine getiren en önemli organ ise zekât memurları olmuştur. İslâm'ın yayıldığı coğrafyalara gönderilen memurlar görevlerine lâyıkıyla îfâ etmişlerdir.Zekât Müessesesi, sonuç olarak Hz. Peygamber döneminde inşaâ edilmiş, kamu otoritesi tarafından yönetilmiştir. Bu kurum tam anlamıyla işlerlik kazandığı için toplumdaki fakirlik problemine çare bulunmuş ve insanların sıkıntıları büyük oranda çözülmüştür."
