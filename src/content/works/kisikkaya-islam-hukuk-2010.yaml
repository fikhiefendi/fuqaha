abstract: "İslam hukukunda ana hüküm kaynakları Kur'an-ı Kerim ve Peygamberin söz ve davranışlarıdır. Müslümanlar Peygamber zamanından bu yana bu iki kaynağı yeni sorunlar ve bunların çözülmesi için farklı yöntemler kullanarak yorumlamıştır. Bu yöntemlerden birisi de kıyastır. Bu çalışmada, kıyas çeşitlerinden birisi olan kıyas-ı şebeh konusu incelenmiştir.Kıyas-ı şebeh, mezheplerin çoğu tarafından geçerli kabul edilen bir yöntemdir. Onlar, Kanun koyucu olan Yüce Allah'ın bazı ibadetlere ön şart koştuğu kimi emirlerin, benzeyen başka ibadetlerde de geçerli olduğunu iddia ederler. Dolayısıyla kutsal kitapta veya peygamberin sözlerinde geçmese bile o olayın da benzeriyle aynı hükmü alması gerektiğini düşünürler. Örneğin kutsal metinlerde ramazan ayı orucu için geceden niyet edilmesi gerektiğine dair bir şey yoktur. Ancak Kur'anda kefaret için tutulmak istenen oruca niyet şart koşulmuştur. Öyleyse Ramazan orucunda da niyet şart olmalıdır derler.Hanefi mezhebi ise kıyas-ı şebehi geçerli kabul etmez. İbadetler ve Tanrı tarafından belirlenen cezalarda mantık yürütülemeyeceğini düşünürler. İbadetler sadece Tanrının emirleridir. Bu sebeple Hanefiler, insan ilişkilerinde sık kullandıkları kıyasın ibadetlerde geçerli olmadığını ifade ederler.Her iki görüş taraftarları da kendi iddialarını ispatlamak için çeşitli deliller ileri sürdüler. Biz yaptığımız bu araştırma sonucunda Hanefilerin delillerinin daha güçlü olduğu kanaatine vardık."
