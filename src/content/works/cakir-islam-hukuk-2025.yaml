abstract: "Bu çalışma, İslam hukukunda reddiye geleneğini Ebu Yusuf ve Evzâî örneği çerçevesinde incelemeyi amaçlamaktadır. Reddiye, farklı görüşlere sahip müctehidlerin karşıt düşünceleri eleştirmek ve kendi görüşlerini savunmak amacıyla yazdığı eserler ile İslam düşünce tarihinde önemli bir yer tutmaktadır. Araştırmada, reddiye kavramı detaylı bir şekilde ele alınmış, ilişkili kavramlar ve tarihsel bağlam incelenmiştir. Çalışma dört ana bölümden oluşmaktadır. İlk bölümde reddiye kavramının tanımı yapılmış, kavramın hilaf, cedel ve ihtilaf gibi terimlerle ilişkisi açıklanmış ve tarihsel gelişimi incelenmiştir. İkinci bölümde, dört temel İslam mezhebinde yazılmış reddiye eserleri örneklerle ele alınmış ve bu eserlerin yöntemsel yaklaşımları değerlendirilmiştir. Üçüncü bölümde, çalışmanın merkezinde yer alan Ebu Yusuf ve Evzâî'nin hayatları ve eserleri tanıtılmıştır. Son bölümde ise“er-Red alâ Siyeri'l-Evzâî”adlı eser detaylı bir incelemeye tabi tutulmuş, Ebu Yusuf'un Evzâî'ye yönelttiği eleştiriler ve iki müctehidin ittifak ettiği noktalar analiz edilmiştir. Araştırma sürecinde literatür taraması yöntemi kullanılmış ve ilgili kaynaklardan derlenen bilgiler nitel analizlerle yorumlanmıştır. Çalışma, reddiye türünün İslam hukuku bağlamında önemini vurgularken, bu eserlerin İslam düşüncesine kazandırdığı eleştirel bakış açısını ve ilmi tartışma kültürünü ortaya koymayı amaçlamaktadır."
