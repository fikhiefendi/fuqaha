abstract: "Kur'an, gerek Ebû Bekir (ra.) döneminde yazıldığında, gerekse Osman (ra.) döneminde nüshalar halinde çoğaltıldığında, nâzil oluş şekli korunarak hiçbir ilave yapılmamıştır. Ancak zamanla duyulan ihtiyaç üzerine önce harekeler, sonra birbirine benzeyen harflerin ayırt edilmesi için nokta/noktalar konulmuştur. Hicri dördüncü asırdan itibaren bazı mushaflarda bazı vakf yerlerine bir takım alâmetler konulmaya başlanmış, onuncu asırdan sonra da bu durum yaygınlık kazanmıştır. Ancak vakf yerleri ve işaretlerinin belirlenmesi ictihâdî bir konu olduğundan tartışmalara açık olması kaçınılmazdır. Nitekim İslâm ülkelerinde basımı yapılan mushaflardaki vakf yerleri ve işaretleri arasında bazı farklılıklar bulunmaktadır. Ülkemizde tilâvet edilen mushaflarda da birçok vakf yeri ve işareti hem diğer İslâm ülkelerindeki mushaflarla farklılık arz etmekte hem de birbirine benzer yerlerdeki vakf yerleri/işaretleri ile çeliştiği görülmektedir. Bazen âyetin anlaşılmasında problem oluşmadığı halde (لا) alâmeti konulmuş, bazen de vasl edilmesi durumunda âyetin anlaşılmasında problem oluşmadığı halde (م) alâmeti konulmuştur. Bazen muânaka alâmetine gerek yokken konulmuş, bazen de muânaka alâmeti konulması uygun olduğu halde konulmamıştır. Bazı yerlerde ise vakf edildiğinde ortaya çıkan mana ile tefsir kaynaklarında ve meallerde âyet için yapılan yorumun uyum arz etmediği görülmektedir. İşte bu çalışmada söz konusu problemler ve çelişkiler örneklerle açıklanmıştır. Çalışmada vakf ve ibtidâ kavramının lügat ve terim anlamları, vakf kavramları ve işaretleri, vakf ve ibtidâ ilminin başlangıç tarihi, Kur'an'ı yorumlamadaki etkisi ve alanla ilgili eserler üzerinde durulmuştur. Sonra Türkiye'de tilâvet edilen mushaftaki vakf yerleri için asıl kaynak kabul edildiğinden Secâvendî, vakf ve ibtidâdaki metodu ve konuyla ilgili eseri hakkında bilgi verilmiştir. Son olarak Türkiye'de tilâvet edilen mushafta uygun olmadığı kanaatine varılan vakf yerleri ve işaretleri belirlenerek kritiği yapılmış ve alternatif vakf yerine/alâmetine işaret edilmiştir."
