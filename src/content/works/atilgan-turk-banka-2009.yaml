abstract: "Katılım Bankacılığı, kavram olarak Türk Hukuk literatürüne 2005 yılında girmiş bir kavramdır. Fakat işlevselliğinin başlangıcı 26 yıl eskiye, 1983 yılına dayanmaktadır. Türkiye'nin serbest piyasa ekonomisine geçiş sürecinde Özel Finans Kurumları, faizsiz bankacılık alanında faaliyet göstermek üzere Türk finans sektörü içindeki yerlerini almışlar ve o tarihten bu yana da sürekli gelişme göstererek ekonomi içindeki yerlerini sağlamlaştırmışlardır.Bu çalışmada genel olarak ?faizsiz banka? kavramının fikren doğuşunun sebepleri, dünyada ve Türkiye'de uygulamaya geçiş süreçleri incelenmiş; sonrasında ise Türkiye'de faaliyet gösteren Katılım Bankalarının 1983 yılında verilen faaliyet izinlerinden itibaren geçirdikleri yasal süreç incelenmiştir.Ayrıca, Türkiye'de Katılım Bankalarının (eski ismiyle Özel Finans Kurumları'nın) klasik bankacılık faaliyetleri dışında fon toplama ve fon kullandırma işlemlerini nasıl gerçekleştirdikleri izah edilmiş; yasal yükümlülükler açısından Türkiye'de faaliyet gösteren ve Bankalar Kanunu hükümlerine tabi olarak faaliyetlerini yürüten bankalarla içerdiği farklılıklar ve benzerlikler incelenmiştir. Örneğin Özel Finans Kurumları'nda toplanan fonların 2001 yılına kadar herhangi bir güvence altında olmaması, rekabet eşitliği ilkesine ters bir uygulama olarak ön plana çıkmıştır. Fakat aynı zamanda bankaların, bünyelerinde finansal kiralama (leasing) işlemi yapamıyor olduğu halde Özel Finans Kurumlarının bu faaliyeti yapmasının önünde yasal bir engel bulunmaması da tersi bir eşitsizlik ortaya çıkarmıştır.2005 yılında yapılan son yasal düzenleme ile Türkiye'de faaliyet gösteren Özel Finans Kurumları ve bankalar aynı çatı altında, 5411 sayılı Bankacılık Kanunu ile birleştirilmiş ve sistemdeki oyuncuların eşit şartlarda çalışmalarına imkan sağlanmıştır."
