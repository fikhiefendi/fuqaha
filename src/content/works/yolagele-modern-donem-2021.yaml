abstract: "Muhammed Ebû Zehre, bir meseleyi fıkhî açıdan ele aldığında öncelikle kaynak olarak Kur'an ve Sünneti referans kabul etmiştir. Kur'an ve Sünnette mesele hakkında hüküm bulamadığında Sahabe ve müçtehit imamların sözleri, toplumsal maslahat ve insanların örf ve âdetlerini göz önünde bulundurarak fetvâ vermeyi tercih etmiştir. Fetvâ veren kimselerin orta yolu takip etmeleri yani ne çok sert olmaları ne de fıkhî hükümleri hafife almamaları gerektiği hususu da Ebû Zehre'nin fetvâ verirken dikkate aldığı hususlardır. Doğru olduğunu düşündüğü görüşlerini ifade etmekten hiçbir şekilde geri durmayan Ebû Zehre, Mısır'da çıkarılmaya çalışılan çok evlilik ve talâkın sınırlandırılması girişimlerine ağır eleştirilerde bulununca kendisinin gazete ve dergilerde yazılarının yayımlanması, seminer ve konferanslar vermesi yasaklanmıştır. Hayatı boyunca eğitim faaliyetlerinde aktif olarak görev alan Ebû Zehre, çok yönlü ilmi bir kişiliğe sahip olunmasıyla da bilinmektedir. İslâm fıkhında üzerinde icmâ edilen hükümlere yapılan itirazlara yapmış olduğu açıklamalar ile fıkhî konularda tarihselci anlayış benimsemenin doğru olmadığını da ifade etmiştir. Muhammed Ebû Zehre,“el-Fetâvâ”adlı eserinde fıkha dair görüşlerini sistematik bir şekilde ele almıştır. İbadetler bölümünden başlayarak bu alanda ihtilaflı olan bazı konular hakkında veya kendisinin farklı bir tercihte bulunduğu konuları değerlendirmiştir. Borçlar hukuku bölümünde özellikle bazı güncel konulara değinerek tercih ettiği görüşleri açıklamıştır. Ebû Zehre, fıkıh mezhepleri ve İslâm hukukçularının çoğunluğunun aynı görüşte olduğu tâlak sayısında farklı bir yaklaşım benimsemiştir. Ceza hukuku ile ilgili olarak recm konusunda da farklı bir görüş tercih eden ve bu cezanın uygulanmaması gerektiğini belirten müellifimiz günümüz Müslüman toplumlarında ortaya çıkan muhtelif bazı fıkhî meseleler hakkında da fıkhî açıdan değerlendirme de bulunmuştur."
