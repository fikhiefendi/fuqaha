abstract: "Altı asrı aşkın süre boyunca tarih sahnesinde yer alan Osmanlı Devleti, başarısını dinamik varlığına, hukuki yapısına ve kurduğu müesseselere borçludur. Kurulan müesseseler arasında Meşihat makamının önemi büyüktür. Bu çalışmada Meşihat makamına bağlı olarak varlığını ortaya koyan Ceride-i İlmiyye mecmuası, din eğitimi açısından incelenmiştir. Mecmua, 1914-1922 yılları arasında Osmanlı Devleti'nin sosyal, siyasi ve kültürel değişmeler gösterdiği I. Dünya Savaşı atmosferinde yayımlanması açısından önem arz etmektedir. Ceride-i İlmiyye döneminin en işlevsel yayınlarından biri olmuş ve toplumun ıslahı noktasında büyük faydalar sağlamıştır. Yayın hayatı boyunca dönemin önde gelen ilim ve fikir adamlarını bir araya getirmiş çok yönlü bir mecmua olarak faaliyet göstermiştir. Aynı zamanda devletin tüm kesimlerine hitap eden bir dergi olmuştur. Edebi değeri yüksek olan dergide çeşitli konularda makaleler yayımlanmış ve bu bağlamda toplum sorunları çözüme kavuşturulmak istenmiştir. Çalışmada doküman analizi metodu kullanılarak Ceride-i İlmiyye'de yayımlanan din eğitimi ile ilgili yazı ve makalelerin sayı sayı içerik analizleri yapılmıştır. Ceride-i İlmiyye dergisinin din eğitimi açısından incelenmesi amaçlanmıştır. Bu amaç doğrultusunda derginin nüshalarına bakıldığında mecmuada özellikle fıkhi ve ahlaki eğitime yönelik yazılara yer verildiği görülmüştür. Aynı zamanda dönemin medreselerinde yapılan ıslahat çalışmalarından detaylı olarak bahsedilmektedir."
