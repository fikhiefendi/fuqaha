abstract: "Kanunun yorumu konusu hukukta öteden beri üzerinde durulan konulardan biri olup yorumun, lafzî, gâî, mantıkî, tarihî ve sistematik gibi türleri vardır. Hukuk ekolleri, bu yorum türlerine verdikleri öneme göre birbirinden ayrılırlar. Ancak bütün hukuk ekollerinin üzerinde anlastıgı bir gerçek varsa o da lafzî yorumdan müstagni kalınamayacagıdır. slam Hukuk Ekollerinin birbirinden ayrısmasının temelinde de aslında bu yatar. Hanefî ve Safiî fıkıh ekolleri sistematik bütünlügü önde tutarken, Malikî ekolü gâî yoruma önem vermis, Zâhirî fıkıh ekolü ise lafzı her seyin önünde tutarak literalist bir yaklasım sergilemistir. Ne var ki diger yorum türleri, lafzî yorumdan bigane kalamadıgı için bütün fıkıh ekolleri lafza deger vermislerdir. Lafzî yorum ise kelimelerin sözlük ve örf anlamları ile dilbilgisi kurallarının bilinmesine baglıdır. Bu sebeple Zâhirîsinden Mâlikîsine bütün fıkıh ekolleri, Fıkıh Usulü eserlerinin yarıya yakın bir bölümünde lafızla ilgili konuları incelemislerdir. Nahiv kurallarının Fıkıh üzerindeki etkisini fark eden el-snevî, el-Kevkebu'ddurrî adlı eserini yazarak fıkıh meselelerinin çözümünde kullanılan nahiv kurallarını isim, fiil, harf taksimini esas alarak incelemis ve her bir kurala dayanan örnekler vermistir. Biz bu çalısmamızda yeni bir tasnifle nahiv kurallarını tahlil ederek fıkhî örnekler verdik. Çalısmamız neticesinde tahsis (daraltıcı yorum), kıyas ve mefhum-i muhalif gibi konuların büyük ölçüde nahiv kuralları ile iliskili oldugunu ve bu kurallar bilinmeksiniz fıkıh ilminde yetkinlik kazanılamayacagını tespit ettik."
