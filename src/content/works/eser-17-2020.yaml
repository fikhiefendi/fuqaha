abstract: "17. yüzyılda yaşamış bir Osmanlı fakihi olan Çatalcalı Ali Efendi hem on üç yıl süren şeyhülislamlığı, hem de oldukça muteber görülen fetvaları ile dikkat çeken bir isimdir. Fetvalarının derlendiği Fetâvâ-yı Ali Efendi adlı eserden hareketle hazırlanan bu çalışma giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Birinci bölümde Çatalcalı Ali Efendi'nin kapsamlı bir biyografisi hazırlanmış, Fetâvâ-yı Ali Efendi'nin derleniş süreci ortaya konmuş ve eser hakkında literatürde yer alan bilgiler tekrar gözden geçirilerek en isabetli verilere ulaşılmaya çalışılmıştır. İkinci bölümde Ali Efendi'nin fetvalarına genel bakış yapılmış; kullandığı fetva dili ve üslubu, fetvalarında yer verilen coğrafi ögeler ve fetvaya konu olan kişiler / topluluklar araştırılarak dönemin Osmanlı toplumu hakkında incelemeler yapılmıştır. Üçüncü ve son bölümde Ali Efendi'nin fetvaları fıkhî açıdan ele alınmıştır. Bu bağlamda bazı ihtilaflı meselelerde tercih edilen kavli ifade biçimi, teklîfî hükümlere dair ıstılahları kullanımı, fıkhî kavramlara dair izahları, Osmanlı dönemindeki bazı tartışmalı meselelere yaklaşımı, mezhep dışı kavillerle amel hakkındaki tutumu ve fetvalarında gözettiği fıkhî ilkeler incelenerek Çatalcalı Ali Efendi'nin fıkıh düşüncesi tespit edilmeye çalışılmıştır. Son olarak, Ekler kısmında Fetâvâ-yı Ali Efendi'nin bizzat gördüğümüz doksan adet yazma nüshasına ait istinsah bilgilerinin yanısıra, Vakıf bahsinin tenkitli neşrine de yer verilmiştir."
