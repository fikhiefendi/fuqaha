abstract: "Müteahhirin Hanefi fukahasının ilgilendiği meselelerden biri olan vakıf malın tamiri, Osmanlı dönemi vakıflarının işleyişinde önemli bir yere sahiptir. Ebedi olmak üze-re kurulan vakıf yapılar ancak tamir işinin görülmesiyle ayakta kalabilmektedir. Bu çalış-mada şer'i hükümlerin yer aldığı fıkıh literatürü ile on sekizinci yüzyıl Osmanlı bürokrasi-ne ait kaynaklardan hareketle vakıf malın tamiri konusu şu üç soru eşliğinde ele alınmıştır: (i) Harap olan vakıf mal kim tarafından tamir edilmelidir? (ii) Vakıf geliri tamire yetmi-yorken mütevelli hangi seçeneklere sahiptir? (iii) Tamir edilemeyen vakıf malın akıbeti nedir? Çalışmada teori-pratik ve hukuk-uygulama gibi karşıtlıklardan sarfınazar edilmiş, fukahanın zikrettiği usuller ile Osmanlı döneminde gerçekleşen tamir vakalarının öngör-düğü usuller birlikte değerlendirilmiştir."
