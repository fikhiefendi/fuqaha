abstract: "Bu çalışmada İslam iktisadi sisteminin, iktisadi sorunların çözümünde bir alternatif yaklaşım olup olmayacağı konusu irdelenmektedir. Bunu gerçekleştirirken geleneksel sistemlerin (Kapitalist ve Sosyalist Sistemlerin) başarısızlık nedenleri üzerinde durularak, İslam iktisadi siteminin bu açığı nasıl kapatabileceği konusu ele alınmaktadır. Bu çerçevede öncelikle temel iktisadi sorunların üzerinde durulmakta, ardından Kapitalist ve Sosyalist iktisadi sistemlerin tanımları, yapıları, kurumları ve işleyişi ele alınmaktadır. Daha sonra İslam iktisadi sisteminin kaynakları, yapısı, özellikleri üzerinde durulmaktadır. İslam ekonomisi doğal kaynakları, emeği-sermayeyi etkin bir şekilde kullanıp insanların refah seviyesinin yükselmesini, aynı zamanda Allah'a karşı sorumluluklarından ötürü bireylerin kendilerine ve topluma faydalı olmaları gerektiğini her fırsatta vurgulamaktadır. İslam İktisadının hem dünyevi hem de uhrevi refahı göz önünde bulunduran bir yaklaşım olmasının, refah arayışına farklı bir boyut kazandırmakta olduğu görülmektedir."
