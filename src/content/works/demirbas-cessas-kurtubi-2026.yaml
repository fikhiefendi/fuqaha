abstract: "Cessâs (ö. 370/981) ve Kurtubî (ö. 671/1273 İslâm hukuk düşüncesi ve tefsir geleneğinde 'Ahkâm Tefsiri' türünün en yetkin örneklerini vermişler ve Kur'ânî hükümlerin istinbatı noktasında mihenk taşı niteliğinde eserler telif etmişlerdir. Bu çalışma, mezkûr müelliflerin ibadetlere dair âyet ve hadis temelli fıkhî çıkarımlarını, metodolojik bir perspektifle değerlendirmeyi amaçlamaktadır. Araştırmamızda her iki âlimin yaşadığı sosyo-kültürel çevre, müntesibi oldukları mezhebî ekoller ve sahip oldukları ilmî müktesebatın, ibadetlere dair içtihat süreçlerine ve hüküm istihracı yöntemlerine etkileri mukâyeseli bir analize tabi tutulmuştur. Cessâs ve Kurtubî'nin farklı mezhebî yaklaşımlara yer vererek geliştirdikleri çoğulcu değerlendirmeler, çalışmamızın teorik çerçevesini zenginleştiren temel unsurlar olarak belirlenmiştir. Araştırmamızda farklı mezheplere müntesip olan Cessâs (Hanefi) ve Kurtubî'nin (Maliki) ahkam tefsirlerinde ibadetlerle ilgili temel konularla ilgili vermiş oldukları hükümler, hükümlerin gerekçeleri ve meseleleri ele alış biçimleri fıkhî açıdan mukayeseli olarak ele alınmıştır. Cessâs'ın ahkâm tefsiri literatüründeki metodolojisi incelendiğinde, müellifin konuları ele alış biçiminde Kur'ân merkezli bir yaklaşımı benimsediği müşahede edilmektedir. Ahkâm tefsiri üzerine yazdığı eserde, özellikle fıkhî tartışmaların fazla olduğu meselelere değinmediği görülmüştür. Bunu en belirgin sebebi tartışmalı olan konuların âyetlerin nassıyla doğrudan irtibatlandırılaması olarak belirlenmiştir. Müellifin, mensubu olduğu Hanefî mezhebinin fıkhî prensiplerini temellendirme gayreti içinde olduğu belirgin bir tutum olarak yansımaktadır. Bununla birlikte Cessâs, yer yer mezhep içi genel kabullerin dışına çıkarak, cumhura ve hatta zaman zaman mezhep içi baskın görüşlere dahi muhalefet edebilen müstakil bir ilmî duruş sergilemiştir. Ancak bu mezhep içinde karşı çıktığı görüşler ibâdetler konusundan ziyade kelam ilminin içine dâhil olan konular olduğu görülmüştür. Mezhep içi hiyerarşide, ihtilaf durumlarında Cessâs'ın Ebû Hanîfe'nin içtihatlarına öncelik verdiği ve onun metodolojisine daha yakın durduğu tespit edilmiştir. Eserin mukaddime mahiyetindeki bölümlerinde yer alan fıkıh usulü kaideleri, müellifin âyetlerden hüküm istinbat ederken takip ettiği metodolojik çerçeveyi sunması bakımından büyük bir öneme haizdir. Kurtubî de ise Cessâs'ta var olan tartışmacı yöntemin daha ılıman bir yapıya evrildiği görülmüştür. Kurtubî mezhebinin doğruluğunu kanıtlama çabasından ziyade mezheplerin fikirlerini ve dayandıkları delilleri vererek okuyucuları araştırmaya ve kendi düşüncelerini oluşturmaya yönlendirmiştir. Kur'ân eksenli olmakla beraber konuları daha geniş bir yelpazeden değerlendirmeyi tercih etmiştir. Bu çalışma kapsamında, her iki müfessirin âyetlerden hüküm istinbat etme metotları ile ibadetlere dair vazettikleri hükümlerin fıkhi gerekçeleri analiz edilmiş; ulaşılan sonuçlar mensubu oldukları mezheplerin görüşleri bağlamında mukâyeseli bir değerlendirmeye tabi tutulmuştur. Cessâs'ın tefsirinde yer almayan fıkhi meselelerde Hanefî literatürüne; aynı şekilde Kurtubî'nin eserinde bulunmayan fıkhi konular ise Mâlikî kaynaklarına müracaat edilerek tamamlanmıştır. Bu yöntemle, tefsir metinleri ile mezhep külliyatı arasındaki bağın ve fıkhi istidlal süreçlerinin bütüncül bir anlayışla ortaya konulması amaçlanmıştır"
