abstract: "Bu çalışma, el-İhtiyâr li-ta'lîli'l-Muhtâr adlı hükümlerin gerekçelendirilmesinde kullanılan küllî kâideler ve müellifin bu kâideleri nasıl kullandığı sorununa odaklanmaktadır. Aynı müellif tarafından kaleme alınan el-Muhtâr'ın önemli bir şerhi niteliğindeki bu eserde, hükümlerin temellendirilmesinde başvurulan küllî kâidelerin tespit edilmesi, bu kâidelerin hangi bağlamlarda kullandığını ve bu kâideleri kullanma yöntemini incelemeyi amaçlamıştır. Araştırmada tasvir ve tahlil yöntemleri benimsenmiştir. Bu doğrultuda, öncelikle eserde kullanılan küllî kâideler tespit edilmiş, ardından bu kâideler sistematik bir tasnife tabi tutulmuştur. Çalışmanın birinci bölümünde küllî kâidelerin tarihsel gelişim süreci ele alınmıştır. İkinci bölümde ise Mevsılî'nin hükümleri gerekçelendirirken başvurduğu kâideler ile bu kâidelerin bağlam içerisindeki kullanım biçimleri incelenmiştir. Sonuç bölümünde ise elde edilen sonuçlar maddeler halinde sıralanmıştır. Sonuç olarak, Mevsılî'nin hükümleri gerekçelendirirken küllî kâideleri hem destekleyici bir unsur olarak kullandığı tespit edilmiştir. Ayrıca müellifin, başvurduğu kâideleri farklı bağlamlarda ele alırken onların temel anlamını koruduğu, ancak bağlama uyum sağlamak amacıyla zaman zaman lafızlarda değişikliğe gittiği görülmüştür."
