abstract: "Somali'de İslami bankacılık ve finans kurumlarının yirmi yıldan kısa bir sürede elde ettiği başarıya rağmen, merkezi bir hükümetin yokluğu ve ülkedeki tüm finans kurumlarının çöküşüyle aynı zamana denk gelen bu koşullar, Somali'deki faaliyetleri engelleyen bir takım zorluklar yarattı. onların gelişimi ve büyümesi. Bu zorluklar, ülkenin güvenlik ve ekonomik koşullarından ve yurtdışındaki düşük itibarından kaynaklanan dış zorlukları ve çalışma ortamından veya kuruluşların içinden kaynaklanan iç zorlukları içerir. Bu bağlamda araştırmacı, Somali'deki İslami bankacılığın gerçekliğini ve gelişimini engelleyen iç zorlukları incelemeyi, bu zorlukları analiz etmeyi ve bunlara olası çözümleri keşfetmeyi amaçlamaktadır. Araştırma hedeflerine ulaşmak için araştırmacı, Somali'deki ekonominin ve İslami bankacılığın gerçekliğini ve karşılaştığı iç zorlukları incelemek için tanımlayıcı yaklaşıma ve ardından olası çözümlere ulaşmak için bunları analiz etmek için analitik yaklaşıma güvendi. Araştırmacı, nitelikli mesleki yeterliliklerin yanı sıra idari uzmanlık ve şeriat gözetimi eksikliği de dahil olmak üzere toplumdaki İslami bankacılık okuryazarlığının en önemli olduğu zorluklar olduğu sonucuna vardı. Ayrıca birçok İslami finans ürününü benimseme konusunda isteksizlik var; Riskten kaçınma nedeniyle. Bu zorlukları çözmek için öncelikle bankacılık okuryazarlığının her yönüyle ortadan kaldırılması, katılımcı finansmanda risk alınması, tüketici dışı kalkınma yatırımları ile araştırma ve danışmanlık merkezlerinin kurulması ve etkinleştirilmesi gerekliliğinin ortadan kaldırılması gerekmektedir."
