abstract: "Bu çalışma, Elbistan'ın 454/1 Numaralı Şer'iyye Sicili'nin Transkripsiyonu ve Değerlendirmesinden oluşmakta olup, H.1292(M.1875) yılı mahkeme kayıtlarını ihtiva etmektedir.Sicildeki kayıtlar incelendiğinde Elbistan'da halkın Müslüman ve gayri Müslimlerden oluştuğu, Müslüman halkın genelde tarım ve hayvancılıkla; gayri Müslim halkın ise ticaretle uğraştığı görülecektir.Çalışmamızın temel kaynağı olan Elbistan Şer'iyye Sicillerinin mikrofilmleri Ankara'da Millî Kütüphane'de bulunmaktadır. 454/1 Numaralı Elbistan Şer'iyye Sicili, Millî Kütüphane'den fotokopi yolu ile temin edilmiştir. Söz konusu şer'iyye sicilindeki belgelerin tamamı günümüz harflerine çevrilmiştir. Ve aynı şekilde bütün belgeler konularına göre tasnif edilmiştir. Tezin sonunda yer alan ekler kısmında 454/1 Numaralı Elbistan Şer'iyye Sicili'nin orijinal metninden örnekler verilmiştir."
