abstract: "Bu çalışmada, Türkiye katılım bankacılığı sektörünün aktif karlılığı ve özkaynak karlılığına etki eden faktörlerin tespit edilmesi amaçlanmıştır. Bu doğrultuda, içsel faktör olarak nitelendirilen sektöre ait 10 adet değişken ile makroekonomik gösterge olarak nitelendirilen 14 adet değişkenin Türkiye katılım bankacılığı sektörü aktif karlılığı ve özkaynak karlılığı ile kısa ve uzun dönemli ilişkisi ARDL Sınır Testi yaklaşımı ile araştırılmıştır. İçsel faktörler ile kurulan modellerden elde edilen sonuçlara göre, nakit ve nakit benzerleri, türev finansal varlıklar, kiralama işlemlerinden alacaklar ve toplam kullandırılan fonların karlılık üzerinde kısa ve uzun dönemli etkisinin bulunduğu, alınan krediler, türev finansal yükümlülükler ve kiralama işlemlerinden yükümlülüklerin karlılık üzerinde kısa dönemli etkisinin bulunduğu tespit edilmiştir. Makroekonomik göstergeler ile kurulan modellerden elde edilen sonuçlar ise, karlılık üzerinde Euro kurunun kısa dönemli, altın fiyatlarının uzun dönemli ve USD kurunun hem kısa hem uzun dönemli etkisinin bulunduğunu göstermektedir. Üretim ile ilgili makroekonomik değişkenlerden gayri safi yurtiçi hasıla büyümesinin karlılık üzerinde kısa dönemli etkisi tespit edilirken, sanayi üretim endeksinin ise gerek kısa dönemde gerek uzun dönemde karlılığı etkilediği görülmüştür. Mevduat faizi oranı, ihtiyaç kredisi faizi oranı, tüketici fiyat endeksi ve üretici fiyat endeksinin ise katılım bankacılığı sektör karlılığı üzerinde yalnızca kısa dönemli bir etkiye sahip olduğu sonucuna ulaşılmıştır."
