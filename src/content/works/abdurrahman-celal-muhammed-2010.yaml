abstract: "Kaynaklarımızda kendisinden fazilet timsali bir âlim olarak bahsedilen ve devrinin âlimleri arasında saygın bir yeri bulunduğu belirtilen, kadı Cemâl diye meşhur olan Celâl b. Muhammed el-İ`madî el-Fethâbâdî' ye ait ilmü'ş-şürûtla ilgili ?Gurerü'ş-şürût ve Dürerü's-sümût? isimli eser henüz basılmamış ve üzerinde çalışılmamış bir eserdir. Çalışmamızda öncelikle kütüphane katalogları taranmış ve eserin sekiz nüshasına ulaşılmıştır. Tespit edebildiğimiz nüshalar tek tek gözden geçirilmiş ve bu nüshalardan dört tanesini seçerek çalışmamızı bunların üzerinde yoğunlaştırdık.Çalışmamız iki bölümden meydana gelmektedir. Bir tahkikinde bulunduğumuz Arapça bölümü; diğeri ise, Müellif ve şürût ilmiyle alakalıdır.A. Arapça Bölümü:A) Bu bölümde Eserin başından sekiz yaprağı ?tahkîk? ettik. Yanı eser ve metnin geçirdiği süreçlerde maruz kaldığı bozulma ve değişiklikleri nüshalar arasında karşılaştırarak düzeltip orijinal haline döndürdük.B) Metinde geçen garip kelime, şahıs ve eserin biyografi ve bibliyografisini ve Âyet ve hadisin kaynağını dipnotta gösterdik.B. Türkçe BölümüÇalışmamızın Türkçe kısmı, eserin tanıtımı ve şürût ilmiyle alakalı genel bilgilerin yer aldığı iki bölümden meydana gelmektedir.a. Birinci BölümBu bölümü şu şekilde ele aldık:A) Bu bölümde çalışmamızın konusu olan Celâl b. Muhammed el-İ`madî el-Fethabadî' ye ait olan?Gurerü'ş-şürût ve Dürerü's-sümût? adlı eserin bulunduğu kütüphane ile ilgili katalog bilgileri ve sekiz nüshalarının tanıtımı ve eserin muhtevasını hakkında bilgi verdik.B) Eserin Müellifinin hayatı ve hayatı hakkındaki tutarsızlıkların karşılaştırılması olarak ele aldık.C) Çalışmamızın kaynaklar bölümünde müellif Celâl b. Muhammed el-İ`madî el-Fethabadî'nin ?Gurerü'ş-şürût ve Dürerü's-sümût? isimli eserinde istifade ettiği şahıs ve eserlere değindik.b. İkinci BölümBu bölümü şu şekilde ele aldim:A. ?İlmü'ş-Şürût?a Genel Olarak BakışHukukî muameleleri ve mahkeme kayıtlarını belgeleme usulünü konu alan ilmin ve bu alanda yazılan eserlerin ortak adı olan ?İlmü'ş-şürût?ün tarifi ve asr-ı saadetten günümüze kader? İlmü'ş-şürût? ün geçirdiği tarihî süreçler.B. ?İlmü'ş-Şürût?La İlgili Başlıca KavramlarBu bölümde ?Şürût ilmi? açısından özel öneme sahip başlıca kavram ve terimleri, ?İlmü'ş-şürût? ün yürütüldüğü a) müessese; b) şürût ehli (İlmü'ş-şürût ile meşgul olan şahıslar); c) ve İlmü'ş-şürûtta kullanılan malzeme olarak üç bölümde inceledik."
