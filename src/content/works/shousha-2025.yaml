abstract: "“İstisna Sözleşmesi Yoluyla Zekât Fonlarının Yatırımı: Fıkhi Bir Değerlendirme Çalışması”başlıklı bu araştırma, güncel bir konuyu ele almaktadır: zekât almaya hak kazananlar için İslam hukukunun amaçlarını yerine getirecek şekilde zekât fonlarının nasıl yatırılacağı. Bu çalışmanın önemi, zekât fonlarının yatırılması için yasal bir temel oluşturmaya çalışmasında yatmaktadır. Bu yatırımın sınırlarını ve kontrollerini, paranın korunmasını ve sadece Kutsal Kur'an'da belirtildiği şekilde hak sahiplerine ulaşmasını sağlayacak şekilde açıklığa kavuşturmaktır. Ayrıca, zekât fonlarının yatırılmasıyla uyumlu İslami finansman formüllerinden biri olarak istisna sözleşmelerinin kullanılma olasılığı konusunda pratik bir vizyon sunmaktadır. Araştırma problemi, zekât fonlarının yatırılmasına ne ölçüde ihtiyaç olduğu, istisna sözleşmelerinin zekât fonlarının yatırılması için uygunluğu ve istisna sözleşmelerinin zekât fonlarının yatırılmasına ilişkin yasal kontrollere tabi olup olmadığıdır. Çalışma ayrıca, zekât fonlarının yatırılmasının şeriata uygunluğu, istisna sözleşmeleri yoluyla zekât fonlarının yatırılması sırasında karşılaşılabilecek riskler ve zorluklar ve bunların nasıl aşılabileceği konularını da vurgulamaktadır. Tüm bu sorular konuyu daha net hale getirmiş ve araştırmacıları bu konuya ışık tutmaya sevk etmiştir. Araştırma iki temel hipoteze dayanmaktadır: Birincisi, zekât almaya hak kazananların ihtiyaçları ancak zekât fonlarının onlara yeterli ve sürekli gelir sağlayan kalkınma projelerine yatırılmasıyla tam olarak karşılanabilir. İkincisi, istisna sözleşmelerinin, zekât fonlarını İslam hukukunun kuralları ve hükümlerine uygun bir şekilde kullanma ve yatırma imkânı sunan bir İslami finansman formülü olduğu. Araştırmacı, hedeflerine ulaşmak için, hukukçuların ifadelerini ve akademisyenlerin görüşlerini izlemek için betimsel bir yaklaşım ve bu ifadeleri tartışmak ve çağdaş uygulamalar için yararlı olanları çıkarmak için analitik bir yaklaşım kullanmıştır. Çalışma, zekât fonlarının belirli düzenlemeler altında yatırılmasının caiz olduğu sonucuna varmıştır."
