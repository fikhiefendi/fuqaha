abstract: "Takrib çalışmalarının ister istemez beraberinde getirdiği toleranslı yaklaşımların, Oniki İmamcı mezhepsel dogmaları tahrip ettiğini düşünen muhafazakar bir ulema-yönetici zümresi öteden beri mevcuttu. Bu yeni dengenin bu kesimi memnun ettiği muhakkaktır. İyi bir gözlemci, takribçi idealler etrafında kurulan Kum'daki Dinler ve Mezhepler Üniversitesi'nin kadro ve eğitim programlarının görece liberal çehresi ile, aynı şehirdeki Şii idealizminin yüksek öğretimdeki ulus lararası meşhur markası el-Mustafa Üniversitesi'nin muhafazakar çehresini mukayesede fazla zorlanmaz. Ehl-i Beytçilik el-Mustafa özelinde devlet desteğiyle gerçekten dev bir tüzel kimlik ortaya çıkartırken, takribçi idealler diğerinde kısıtlı imkanlarla işini yürüten bir vakıf teşebbüsünün eline bırakılmıştır. Örnekleri çeşitlendirmek mümkündür. Bunun diğer anlamı, aynı gayeyi hedefleyen devlet aygıtlarının, kurumsal dengeleri tümden bozabilecek bir rekabeti içten içe taşıdıklarıdır. Birinin bir kazanımı diğerinin zararına algılanabilmektedir. Buradaki belirleyici, İran'ın iç siyasal dengelerinin muhafazakar mı yoksa daha liberal bir zeminde mi kurulacak olmasıdır. Bu nun dışarıya yani Şii olmayan dünyaya yansıması ise, takrib idealinin Sünni zihinlerde epeyce yozlaşmasıdır. Ne yazık ki İran'ın son yıllardaki dış politikası, bir asırdır İslam birliği idealinin bir parçası haline gelmiş 'takrib-i mezâhib'e Müslümanlar nezdinde son darbeyi indirmiştir. Ümmetçi-İslamcı çevreler açısından bile bu vakitten sonra takribin saygın bir karşılığı muhtemelen olmayacaktır."
