abstract: "Bu çalışma,“İslâmî İlimlerde Terimleşen Kur'ân-ı Kerîm Kavramları”nı tespit ederek bu kavramların ıstılahlaşma süreçlerini incelemeyi amaçlamaktadır. Kur'ân-ı Kerîm, İslâm medeniyetinin ve bu medeniyetin temelini oluşturan tefsir, fıkıh, hadîs, kelâm ve tasavvuf gibi İslâmî ilimlerin kurucu metni ve temel başvuru kaynağıdır. Bu ilimlerin terminolojik altyapısı, büyük ölçüde Kur'ân'da yer alan kelime ve kavramlar üzerine inşa edilmiştir. Bu bağlamda araştırmanın temel problemi,“İslâmî ilimlerde terimleşen Kur'ân-ı Kerîm kavramları hangileridir ve bu kavramların ıstılahlaşma süreci nasıl gerçekleşmiştir?”sorusu etrafında şekillenmektedir. Araştırmada nitel araştırma yöntemlerinden yararlanılmış; özellikle tarihsel-semantik analiz, doküman incelemesi ve eleştirel metin analizi teknikleri esas alınmıştır. Bu metodoloji çerçevesinde, temel İslâmî ilimlerde merkezi birer terim haline gelmiş yüzden fazla anahtar kavram belirlenmiştir. Her bir kavramın anlam yolculuğu üç temel aşamada incelenmiştir: 1) Kavramın İslâm öncesi Cahiliye döneminde Arap dilindeki lügavî ve kültürel kullanımı, 2) Kur'ân-ı Kerîm'in bu kavrama yüklediği yeni veya özelleşmiş (tahsis, ta'mim, nakl) şer‛î anlam, 3) Kavramın ilgili İslâmî ilim dalında kazandığı spesifik ıstılâhî (terimsel) kimlik. Bu analizler için klasik Arapça sözlükler, temel tefsir kaynakları, Cahiliye şiiri divanları, ilgili ilim dallarının klasik ve modern temel metinleri ile modern akademik çalışmalar taranmıştır. Tespit edilen kavramlar, ait oldukları ilim dallarına göre (tefsir, fıkıh, kelâm, tasavvuf vb.) tematik olarak sınıflandırılmıştır. Araştırmanın sonucunda, İslâmî ilimlerin kavramsal yapısının tesadüfi bir şekilde değil, doğrudan Kur'ân-ı Kerîm'in yönlendiriciliği ve dönüştürücü etkisiyle şekillendiği tespit edilmiştir. Salât, zekât, savm ve hac gibi temel ibâdet kavramlarının, genel sözlük anlamlarından sıyrılarak nasıl belirli şartları ve rükünleri olan şer‛î terimlere dönüştüğü gösterilmiştir. Sabır, şükür, tevekkül, zühd gibi ahlakî kavramların, özellikle tasavvuf geleneğinde seyr-i sülûkun manevi basamaklarını ifade eden birer“makam”olarak nasıl terimleştiği ortaya konulmuştur. İman, küfür, şirk, nifâk ve fısk gibi kavramların kelâm ilminin temel tartışma konularını oluşturduğu; helâl, haram, farz gibi kavramların ise fıkıh ilminin temelini teşkil ettiği belirlenmiştir. Sonuç olarak bu çalışma, Kur'ân'ın sadece mevcut bir dili kullanan pasif bir metin olmadığını; dili dönüştüren, kavramsal çerçeveler inşa eden ve yeni bir düşünce dünyasının temellerini atan kurucu bir özne olduğunu ortaya koymaktadır. Bu ıstılahlaşma sürecini bilmek, hem Kur'ân metnini hem de ondan doğan zengin ilim geleneğini doğru bir şekilde anlamak için hayati bir öneme sahiptir."
