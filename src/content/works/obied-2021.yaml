abstract: "İslam hukukunda ve Libya hukukunda hiba, hibanin bir bağış sözleşmesi olduğu ve İslam hukuku tarafından yetkilendirildiği ve teşvik edildiği ve onu yöneten ve düzenleyen pozitif mevzuatın yasa ve kuralları çıkardığı karşılaştırmalı bir çalışmadır. Ve hiba, doğruluk ve sadaka üzerine kurulu olduğu için insanlar arasındaki bağları güçlendirdiği için, üstün yeteneklilere zevk ve akit taraflar arasında sevgi eker. İslam Şeriatı bu sözleşmeye özen göstermiş ve teşvik etmiştir çünkü bu, Yüce Allah'a atfedildiği ve O'nun sıfatlarından biri olduğu için en soylu davranışlardan biri olarak kabul edilir ve bir Müslümanın Müslüman kardeşi için yapması arzu edilen bir şeydir. ruhları güçlendirdiği ve kin ve kinleri ortadan kaldırdığı için bağışçının mali ifşasında bağışçının davasının mülkiyetini kendi özgür iradesiyle tazminatsız olarak başkalarına devretmesi ve tehlikenin mirasçılarına uzanması nedeniyle ve bu davranış çok tehlikelidir, Libyalı yasa koyucu da dahil olmak üzere pozitif mevzuat, bu sözleşmeyi medeni hukukta düzenlemiştir, işlerin istikrarını sağlamak için insanlar arasında hiba, bireyler arasında işbirliği ve karşılıklı bağımlılık ruhunu oluşturur ve bu yüzden İslam hukuku ve insan yapımı mevzuat tarafından her zaman araştırma konusu"
