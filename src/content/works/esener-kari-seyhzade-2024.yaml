abstract: "Vekâlet, toplumsal bir varlık olan insanın hayatının her alanında gündem olan bir konudur. İslâm dini, sadece kulun Allah ile ilişkisinde değil, her halinde denge sahibi olması için yol gösterici kurallar koymuştur. Bu minvalde İslâm hukuku; ister ibâdât, ister muâmelât isterse de ukûbât alanında olsun hayatı kolaylaştırıcı çok sayıda hüküm içermektedir. Bu çalışmada hac ibâdeti, hacda vekâlet, vekilin hacda yapması gerekenler gibi başlıklarla ibâdet yönü ve kimlerin hac için vekâlet vermeye elverişli olduğu, vekilin ve müvekkilin taşıması gereken şartlar konularıyla da muâmelât yönü ele alınmaya çalışılmıştır. Bu kapsamda 17. yy'da yazılmış iki risâlenin tahkîk, tercüme ve latinizesiyle meselenin bu risâlelerde işlenişi değerlendirilmiştir."
