abstract: "Bu tezin amacı Ahzâb suresinde yer alan ve hüküm ifade eden ayetlerin mukayeseli olarak incelenmesidir. Kur'an'ın çok konulu surelerinden olan Ahzâb suresinde yer alan hükümler zamanımızın insanına nasıl hitap etmektedir? Suredeki hükümleri nasıl anlamamız gerekmektedir? Farklı tefsirlerden yola çıkarak bu sorulara verilen cevapları karşılaştırmalı olarak ortaya koymaya çalıştık. Bu incelemeyi yaparken Muhammed Ali es-Sâbûnî'nin“Revâiu'l-Beyân Tefsîru Âyâti'l-Ahkâm Mine'l-Kur'an”adlı eserini temel aldık. Hükümleri mukayeseli olarak incelerken, Ahzâb suresindeki konularla ilişkili olan ve farklı surelerde yer alan ayetler üzerinde de durulmuştur. Bu anlamda müellifin hem yararlandığı hem de yararlanmadığı klasik ve çağdaş tefsirlerden yararlanılmıştır. Müellifin konuları, ayetteki sıralamayı takip ederek işlediğini gördük. Biz de çalışmamızda benzer konuları bir başlık altında toplayarak hükümleri işlemeyi uygun bulduk. Bu çalışmada Ahzâb suresindeki hükümlerin cahiliye Arap toplumunda kök salmış bazı gelenek ve görenekleri bütün sonuçlarıyla birlikte ortadan kaldırdığını bazılarını da ıslah edip düzelttiğini gördük. Surede nikâh, talâk, iddet, mehir ve örtünme gibi aile hukuku alanındaki yenilikler ile miras hukuku alanındaki yeniliklerin yerleşik geleneksel yapıyı bozduğunu aile, soy, nesep ve miras açısından daha sağlıklı bir işleyiş getirdiğini ortaya koyduk. Hz. Peygamber'in eşleri, evliliği ve O'na salâvat getirmek ile hükümlerin efendimize gösterilecek saygı, sevgi ve bağlılık açısından çok önemli olduğu bulgusuna ulaştık. Âdâb-ı muâşeret kurallarının insan olmanın ayrılmaz bir parçası olduğunu ve insanlık onurunu koruyup yükselten kurallar bütünü olduğunu müşahede ettik."
