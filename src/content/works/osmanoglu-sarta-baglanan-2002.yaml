abstract: "oz Evliliği sona erdirme şekillerinden biri de talâktır. Talâk kocanın tek taraflı evliliği sona erdirmesidir. Koca, bu yetkiyi en fazla üç kere kullanabilir. Kocanın, talâk yetkisini nasıl kullanacağını Allah Teâlâ Kur'an'da bizlere bildirmiştir. Allah'ın emrettiği şekilde talâkın gerçekleşmesi için kadının hayızlı olmaması, eğer temizlik döneminde ise o temizlik dönemi içinde onunla ilişkiye girmiş olmaması gerekir. Bunun dışındaki boşama şekilleri Kur' an' a aykırı olacağından geçerli değildir. Gelecekteki bir zamana veya bir şarta bağlanan talâk, Allah'ın emrettiği şekilde olmadığı için geçersizdir. Çünkü Allah'ın bize bildirdikleri arasında böyle bir boşama şekli yoktur."
