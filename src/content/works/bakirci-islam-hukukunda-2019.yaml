abstract: "İslâm Devletinin gayri müslim tebaasının ergenliğe ermiş olan erkeklerinden fert başına aldığı vergiye cizye denir. İslâm Devleti bu vergiyi, onların savaşmaması ve İslâm topraklarında özgürce yaşamaları karşılığında bir bedel olarak kendilerinden alır. Cizye vergisi sadece İslâm'a münhasır bir vergi değildir. İslâm Devletinden önce de pek çok büyük devletler, İslâm'da ki cizye vergisine benzer vergileri tebaalarından almışlardır. Tarihte görülen en büyük devletlerden birisi olan Roma devletinde“tributum capitis”adı altında bu vergi alınıyordu. Yine kendi devrinde güçlü bir iktidara sahip olan Sâsâni devletide halkını çeşitli tabakalara ayırarak onlara vergiler yüklemiştir. Bu bağlamda 20 ile 50 yaş arasında olan fertlerden, kendi varlıklarına göre baş vergisi almıştır. İslâm Devleti Tebük seferinden sonra Arap yarımadasında hâkim bir güç olmaya başladıktan sonra çevre kabilelerden cizye vergisini almaya başlamıştır. Bu çerçevede Hz. Peygamber bu kabilelerle anlaşmalar yapmış, bu anlaşmalarda kabilelerden cizye vergisi alınacağı zikredilmiştir. Hz. Peygamber'in vefatından sonra, hilafete gelen Hz. Ebu Bekir ve Hz. Ömer zamanında fetihlerin artmasıyla birlikte cizye, İslâm Devletinin en önemli gelir kaynaklarından birisi olmuştur. Yine Hz. Osman'ın hilafetinin ilk altı yılında İslâm topraklarının o zamana kadar hiç görülmemiş bir şekilde genişlemesiyle toplanan cizye vergisi de aynı ölçüde artmıştır. Ancak Hz. Osman'ın hilafetinin son altı yılında ve Hz. Ali zamanında iç karışıklıklarının artmasıyla fetihler durmuş, İslâm Devleti kendi iç problemlerini çözmek için politikalar üretmeye başlamıştır. Bu sebepten dolayıda cizye vergisinin toplanmasında bir azalma meydana gelmiştir. Cizye vergisi, hukuki kaynağını kitap, sünnet ve icmâ'dan almaktadır. Tevbe suresinin 29. âyetinde“Ehl-i kitap'tan Allah'a ve âhiret gününe inanmayan, Allah ve resulünün yasakladığını yasak saymayan ve hak dine uymayan kimselerle, yenilmiş olarak ve kendi elleriyle cizye verinceye kadar savaşın.”buyrulmuştur. Bu bize cizye vergisinin kitabi kaynağını gösterir. Hz. Peygamber'in cizye vergisiyle alakalı hadisleri ve zamanında yaptığı uygulamalar ve kendisinden sonra Raşid Halifeler'in uygulamaları bu vergi üzerindeki sünnet ve icmâ'nın oluştuğunu bize gösterir. Bu hukuki kaynaklara dayanarak müçtehitler bu vergiyle alakalı hükümler vermişlerdir. Başta dört büyük mezhep olarak tanınan Hanefî, Mâlikî, Şafiî ve Hanbelî mezhepleri âlimleri olmak üzere pek çok âlim cizye âyetini ve Hz. Peygamber'in uygulamalarını yorumlamışlar ve cizye ile alakalı hükümler vermişlerdir. Biz de bu çalışmamızda bu hükümler ve cizye'nin tarihiyle alakalı bilgileri kaynaklardan ayrıntılı bir şekilde incelemeye çalıştık ve bu çalışmayı ortaya koyduk."
