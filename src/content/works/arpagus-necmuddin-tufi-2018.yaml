abstract: "Beşerî manada Kur'ân'ın ilk müfessiri, şüphesiz Hz. Peygamberdir. Ancak o (s.a.v.), Kur'ân'ı bütünüyle de tefsir etmiş değildir. Vefatından sonra, önce“sahabe”diye isimlendirilen yakın arkadaşları, daha sonra da bilgi ve tecrübesiyle toplumda temayüz etmiş ilim adamları, Kur'ân'ın kapalı kalan manalarını insanlara açıklamışlardır. Değişimin kaçınılmazlığı ve anlayışların farklılığı sebebiyle, asıl metne bağlı kalınmasına rağmen, yöntem ve muhteva olarak birbirinden farklı pek çok tefsir ortaya çıkmıştır. Mesela; Mukâtil b. Süleymân'ın (ö. 150/767) et-Tefsîru'l-kebîr'i, Zemahşerî'nin (538/1144) el-Keşşâf'ı, Fahreddîn er-Râzî'nin (ö. 606/1210) Mefâtîhu'l-gayb'ı ve Beyzâvî'nin (ö. 685/1286) Envâru't-Tenzîl'i bunlardan sadece birkaçıdır. Necmüddîn et-Tûfî'nin (ö. 716/1316) el-İşârâtü'l-ilahiyye ile'l-mebâhisi'l-usûliyye'si de bütün bu yazın içerisindeki yerini almıştır. Onun, el-İşârât'ının incelendiği bu araştırmada, hayatı ile birlikte eserinin metot ve muhtevası ele alınmıştır. İlk bölümde klasik kaynaklarda yer aldığı kadarıyla müellifin hayatı irdelenmiş ve yaşadığı dönemle birlikte ders aldığı hocaların onun üzerindeki etkilerine değinilmiştir. İkinci bölümde ise eserin tanıtımı yapılarak metodu ortaya konmuştur. Varmak istediği sonuç bakımından usulü dîn için“kader”e, usulü fıkıh için de“umum ve husus”a merkezî bir konum vermesinden hareketle düşünce ve ekol olarak Eş'arî-Hanbelî çizgisinde olduğu anlaşılmıştır. Çalışmada, muhtevadan hareketle kelâm veya fıkha ait ihtilaf örneklerine üçüncü bölümde yer verilmiştir. Bu yapılırken kelâm konuları, klasik kelâmın kendi içindeki tasnife uygun olarak ulûhiyet, nübüvvet ve ahiret olarak tasnif edilmiştir. Şî'a ve felsefecilerle ulema arasındaki tartışmalı konular ise konu bütünlüğü gözetilerek“diğer bazı ihtilaf konuları”başlığı ile verilmiştir. Fıkhî ihtilaflar, eserin muhtevasıyla irtibatlı olarak usulü fıkıh konuları ile mükellef, nesih ve içtihat gibi belli başlı konular üzerinden ilerlemiştir. Tefsir literatürü içerisinde mezheplerin kendi meşruiyetleri için delil getirdiği ayetleri, Kur'ân'ın kendi tertibine uygun olarak nasıl yorumladıklarını ele alması, büyük çoğunluğun onlara karşı ne şekilde cevap verdiğini belirtmesi ve bunu yaparken de müellifin objektif kalmaya azamî derecede özen göstermesi, el-İşârât'ı oldukça farklı yapmaktadır. Bu bakımdan el-İşârât'ın özgün bir tefsir olduğu kanaatine varılmıştır. Anahtar Kelimer: Tefsîr, Tûfî, el-İşârâtü'l-ilâhiyye, kelâmî ve fıkhî tartışmalar"
