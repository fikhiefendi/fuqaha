abstract: "Bu çalışma, Mali toplumunda nikâh ve boşanmaya ve aile hukukuna ilişkin örf ve gelenekleri fıkhî ve sosyolojik bir perspektifle incelemeyi amaçlamaktadır. Çalışmada, özellikle evlilikte kefâet anlayışı, nişan sürecine dair uygulamalar, tarafların rızası, velâyet ilişkisi, yabancı (kabile dışı) taliplerin reddi ve bakire kızın iradesinin göz ardı edilmesi gibi yaygın örfî pratikler ele alınmıştır. Bu örflerin bir kısmının, toplumun sosyal yapısını ve aileler arası ilişkileri düzenleyici işlevi bulunmakla birlikte, bireysel irade ve rıza bakımından çeşitli sorunlar doğurduğu görülmektedir. Araştırma, evliliğin Songhay kültüründe bireysel bir birliktelikten ziyade, aileler ve kabileler arası bir ittifak olarak algılandığını ortaya koymaktadır. Çalışmada inceleme konusu yapılan örfler, İslâm hukuku çerçevesinde naslar, fıkhî ilkeler ve şeriatın maksatları (makâsıdü'ş-şerîa) ışığında değerlendirilmiştir. Bu bağlamda, din ve ahlâk temelli kefâetin esas alınması gerektiği, rızayı ortadan kaldıran veya bireyin evlenme özgürlüğünü sınırlayan örflerin şer'î açıdan geçerli sayılmaması gerektiği sonucuna ulaşılmıştır. Çalışma, Songhay toplumundaki ailevi örflerin tümüyle reddedilmesi yerine, şer'î ölçüler doğrultusunda ıslah edilmesi gerektiğini savunmakta; böylece hem toplumsal istikrarın hem de bireysel hak ve özgürlüklerin korunabileceğini ileri sürmektedir."
