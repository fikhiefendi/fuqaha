abstract: "Son yıllarda çeşitli disiplinlerde hayvanlara yönelik çalışmaların belirgin biçimde arttığı görülmektedir. Bu çalışmaların önemli bir kısmını, ilahiyat araştırmaları çerçevesinde ele alınan hayvan hakları ve hayvan refahı yaklaşımları oluşturmaktadır. Ancak mevcut çalışmaların büyük ölçüde metin merkezli bir okuma ile sınırlı kaldığı; İslam hukukunun temel usul ve meseleleri bağlamında hayvanın nasıl ele alındığı, hayvana yönelik normların üretim süreçleri ve bu süreçlerin hukuk sisteminin kendi iç dinamikleriyle yeterince ilişkilendirilmediği dikkat çekmektedir. Bu durum, İslam hukukunun kendi yapısı içerisinde hayvanı nasıl konumlandırdığını ele alan bütüncül bir çalışmanın önemini arttırmaktadır. Hayvan refahı kavramı, modern bir terminolojiye sahip olmakla birlikte, hayvanların korunması, acı ve eziyetlerinin önlenmesi ve temel ihtiyaçlarının gözetilmesi gibi hususların, farklı kavramsal çerçeveler içinde İslam hukukunda yer aldığı görülmektedir. Bu çalışma, İslam hukukunun hayvana yönelik yaklaşımını, kendi normatif ve ahlaki yapısı içerisinde incelemeyi; bu doktriner okumanın da Osmanlı uygulamaları üzerinden somutlaştırılmasını amaçlamaktadır. Bu bağlamda araştırma, Osmanlı dönemine ait hukuk metinleri üzerinden hayvanların hukuki statüsünün nasıl değerlendirildiğini ve insan-hayvan ilişkilerine dair normatif sınırların hangi ilkeler doğrultusunda belirlendiğini incelemektedir. Kapsamlı bir literatür taramasına dayanması, güncel hayvan hakları ve refahı söylemleri ile diyalog kurması ve bunu yaparken fıkhın kendine özgü hukuk yapısını merkeze alarak, teorik çerçeve ile tarihsel uygulamayı bütüncül bir bakış açısıyla değerlendirmeye tabi tutması, bu araştırmanın öne çıkan özellikleri arasında yer almaktadır. Anahtar Kelimler: İslam Hukuku, Osmanlı Fetva Literatürü, Hayvan Hukuku, Hayvan Hakları, Hayvan Etiği, Hayvan Refahı"
