abstract: "Küresel ekonomik sistemin alt yapısını oluşturan modern finans anlayışı temel olarak faiz esasına dayanır. Faizin esas olduğu bu sistem, ABD'de de 2007 yazında meydana gelen finansal piyasalardaki sorunların Eylül 2008'de küresel bir krize dönüşmesiyle birlikte yeniden sorgulanmaya ve bu sisteme alternatifler aranmaya başlandı. Alternatif olarak da en çok, faiz yerine kâr payı/ortalık esasına dayalı olarak çalışan İslami finans modeli gösterilmektedir. Ülkemizde İslami finans modeliyle çalışan katılım bankalarının krizlere duyarlılığı az da olsa bu krizde test edilmiş oldu. Bu çalışmada, ülkemizdeki faaliyet gösteren dört katılım bankası ile sermaye yapısı benzerlik gösteren dört mevduat bankası örnek alınmış ve 2008 krizin etkileri karşılaştırmalı olarak araştırılmıştır. Karşılaştırma sonucunda, gerek bankacılık sisteminin riske duyarlılık göstergeleri açısından gerekse seçilmiş finansal göstergeler açısından katılım bankalarının 2008 krizinden daha az etkilendiği görülmüştür."
