abstract: "Bu araştırmada, katılım bankaları ve konvansiyonel bankalarda kredi riskini belirleyen değişkenler belirlenmek amaçlanmaktadır. İslami ve Konvansiyonel Bankalar arasında bir karşılaştırma vurgulanmıştır. Araştırmacı, panel verinin sabit etkiler modelini kullanarak, Türkiye'de üç Katılım Bankasına ait üç aylık verileri 2008 Ç1- 2017 Ç4 arasındaki dönemleri analiz etmek için kullandı. Geleneksel bankalar için, Türkiye'deki önceki araştırmalar, İslami bankaları geleneksel bankalarla karşılaştırmak için kullanılmıştır. Takipteki krediler oranı kredi riski mümesseli olarak kullanılmıştır. Ampirik sonuçlara göre, Katılım bankalarındaki takipteki krediler, özel karşılıklar ve kredi / mevduat oranlarından olumlu yönde etkilenmekte ve ölçekten olumsuz yönde etkilenmektedir. Geleneksel bankalarda ise net faiz marjı, özel karşılıklar, sermaye yeterlilik oranlarından olumlu yönde etkilenmekte ve kredi / mevduat oranı, kredi / aktif oranı ve hacminden olumsuz yönde etkilenmektedir. İslami bankalar ile geleneksel bankalar arasında, kredi zararları ve Alacaklar / Aktifler oranları haricinde, tüm çalışma değişkenleri bakımından belirgin farklılıklar vardı."
