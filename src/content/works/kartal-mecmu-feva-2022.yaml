abstract: "Edebiyatımızda geniş bir yer tutan mecmû'alar araştırmacılar için büyük öneme sahiptir. Mecmû'alar kişilerin pek çok konuda beğenilerini manzum ya da mensur veya her ikisi de karışık olarak düzenli ya da düzensiz biçimde kaleme almış oldukları notlarıdır. Ayrıca yazıldıkları dönemin dil ve kültür özelliklerini barındıran bu eserler birçok bilime de ışık tutmaktadırlar. Tez çalışmamızın konusunu oluşturan, İmam Câfer es-Sâdık b. Muhammed Bakır'a ait olan MK, 06 Mil Yz A 2668/1 de, ''Tâbirnâme'' adı altında kayıtlı olan bu eser Türkçe bir tercümedir. Mürettibin kim olduğu hakkında bir bilgi yoktur. Eserin muhtevası incelendiğinde, tâbirnâme, namaz, zekât ve fetvâlar bölümü olmak üzere dört bölümden oluşmaktadır. Eserin birinci bölümünü oluşturan tâbirnâme bölümünde mürettib rüyada görülen nesnelerin ve içinde bulunulan durumların ne anlama geldiğinin izahını yapmakta ve rüyayı gören kişinin ne yapması gerektiğini de bildirmektedir. Eserin ikinci bölümünde namaz ibadetinin önemini belirten mürettib sonrasında namazın hükümlerini açıklamaktadır. Eserin üçüncü bölümünde mürettib zekâtın kimlere farz kılındığı ve sahibi olunan bazı ürünlerin ne kadarının zekât olarak verilmesi gerektiğini açıklanmaktadır. Eserin dördüncü bölümü fetvâ-yı Kemal Paşazade'ye taalluk olan meselelerin açıklandığı bölümdür. Çalışmamızın üçüncü bölümünde sözlük yer almaktadır. Sonuç bölümünde eserin muhtevası dikkate alınarak eser hakkındaki kanaatimize yer verilmektedir. Çalışmamız beşinci bölümünde yararlandığımız kaynaklar, altıncı bölümünde eserin tıpkıbasımı ile tez son bulmaktadır."
