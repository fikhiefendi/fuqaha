abstract: "İmam Mergînânî'nin el-Hidâye isimli eserinde Hanefî fıkhının temel yapıtaşlarından biri olan İmam Ebû Yûsuf'un muhalif kaldığı görüşlerinin incelendiği bu çalışma Giriş, İki Bölüm ve Sonuç kısımlarından oluşmaktadır. Girişte çalışmanın konusu, amacı ve kaynakları üzerinde durulmuştur. Birinci Bölümde İmam Ebû Hanife ile öğrencilerinin ilk sıralarında gelen Ebû Yûsuf ve İmam Muhammed'in yaşadığı dönem, ilmî kişilikleri ele alınarak mezhep içerisinde kullanılan bazı kavramlar hakkında bilgi verilmiştir. Ayrıca İmam Mergînânî'nin el-Hidâye isimli eserinin muhtevası ve müellifin şahsıyla ilgili bilgi verilerek eser hakkında bir alt yapı oluşturulmaya çalışılmıştır. İkinci Bölümde ise el-Hidâye isimli eserin Şirket, Vakf, Büyû' (Ortaklık, vakıf ve muamelat) bölümlerinde İmam Ebû Yûsuf'un muhalif görüşleri başta olmak üzere yer yer İmam Züfer ile diğer mezhep imamlarının görüşleri verilmiştir. Tezimizin Sonuç kısmında ise Hanefî mezhebi içerisinde bir müçtehit konumunda olan Ebû Yûsuf'un bu özelliği değerlendirilerek muhalif görüşlerinin sebepleri usûlî açıdan sunulmaya çalışılmıştır. Bu değerlendirmelerimizin bir sonucu olarak birçok meselede diğer imamlarla aynı görüşte olduğu ancak bazı meselelerde farklı görüşlerinin bulunduğu, bu durumun da Ebû Yûsuf'un fıkıh usulü açısından farklı bir yaklaşım sergilemesinden kaynaklandığı sonucuna varılmıştır."
