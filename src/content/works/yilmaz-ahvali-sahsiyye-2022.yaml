abstract: "Modern dönem ahvâl-i şahsiyye kanunlarındaki talâk ile ilgili bazı hükümler, klasik fıkha nazaran farklılık arzetmektedir. Bu bağlamda geçmişte verilen bazı hükümler terkedilerek farklı görüşler tercih edilmiş ve talâk konusunda yeni düzenlemelere gidilmiştir. Bu değişimin sebeplerinin ve yeni düzenlemelerin yapılmasının mümkün olup olmadığının bilinmesine ihtiyaç vardır. Çalışmamızın birinci bölümünde geçmişe nazaran farklılık arzeden; iddet içinde kadının talâka mahal olup olmadığı, şarta bağlanan talâk, talâka yemin ve talâka şahitlik şeklinde dört konu seçilmiş ve bu konuların geçmişte ve ahvâl-i şahsiyye kanunlarında nasıl ele alındığı ortaya konulmuştur. İkinci bölümde ise talâk konusunda geleneksel fıkıh düşüncesi ile başta ahvâl-i şahsiyye kanunları olmak üzere modern fıkıh düşüncesi karşılaştırılmıştır. Klasik fıkıhta talâkın kapsamının geniş tutulduğu, boşanma yöntemi olarak talâkın ön plana çıkarıldığı ve verilen birçok hükmün ictihadi olduğu söylenebilir. Ahvâl-i şahsiyye kanunlarında ise farklı görüşlerden tercihler yapıldığı, talâk kapsamına bir sınırlama ve düzenleme getirilmeye çalışıldığı görülmektedir. Talâk konusunda ictihada açık olan ve olmayan hususlar göz önünde bulundurularak, delili kuvvetli olan görüşün seçilmesi, görüşler arasından farklı bir görüşün tercih edilmesi, bazı haklarda sınırlandırmaya gidilmesi ve oluşan duruma uygun yeni düzenlemelerin yapılması mümkündür. Bu durum ihtiyaca ve zamana göre zaruri hale gelebilmektedir. Ahvâl-i şahsiyye kanunları da bu gerekçelerle ortaya çıkmıştır. Bu çerçevede bazı ahvâl-i şahsiyye kanunlarında kadının iddet içerisinde talâka mahal olmadığı, yemine ve şarta bağlanan talâkın geçerli olmadığı, talâk esnasında şahitlerin şart olduğu gibi görüşler yer almıştır ki bunları deliller açısından daha isabetli buluyoruz."
