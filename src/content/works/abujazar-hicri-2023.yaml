abstract: "Bu çalışma, hicrî ilk beş asırda Hanefilerde fesad teorisini tespit etmeyi hedeflemektedir. Ayrıca, Hanefilerin bu teorinin özel hukuktaki konumunu belirlemeyi amaçlamaktadır. Özel hukuk düşüncesindeki fesad terimine benzer olan hükümsüzlük anlayışına odaklanmak için iki hukuk sistemi seçtik. İlk olarak, özel hukuk sisteminin temelini teşkil eden Roma hukuku sistemi, ikinci olarak ise modern özel hukuk görüşünü yansıtan ve günümüzdeki durumunu temsil eden Türk hukukudur. Hicrî ilk beş asırdaki Hanefilerin fesad teorisini tespit etmek için kronolojik olarak Kerhi ve Cessâs'ın fesad anlayışına odaklandık. Ardından, bu dönemdeki en kapsamlı fesad teorisini oluşturan Debûsî'nin anlayışını açıkladık. Debûsî, fesad kavramını oldukça geniş bir şekilde ele almıştır. Fesad teorisini temellendirmek için Debûsî, iki temel unsuru ortaya koymuştur: Birincisi, şeri varlık kavramını oluşturmak, ikincisi ise sebep-sonuç ilişkisi ilkesini kurmaktır. Bu şekilde, hicrî ilk beş asırda Hanefi hukuk doktrininde geliştirilen fesad teorisi ile ilgili düşünce birikiminin özel hukuktaki hükümsüzlük düşüncesindeki konumunu ve sağlayabileceği katkıyı incelemiş olduk."
