abstract: "Osmanlı Devleti'nin modern anlamda ilk medenî kanunu Mecelle veya tam ismiyle Mecelle-i Ahkâm-ı Adliyye'dir. Mecelle, aynı zamanda birçok ülkenin de medenî hukukunun oluşmasında ilham kaynağı olmuştur. Dolayısıyla Mecelle'nin daha iyi anlaşılabilmesi için birçok şerhi yazılmıştır. Çalışmamızın konusunu oluşturan Ali Haydar Efendi'nin ?Dürerü'l Hukkam Şerhu Mecelleti'l-Ahkâm? adlı eseri ise Mecelle'nin mevcut şerhleri arasında en meşhuru ve en hacimli olanıdır.Çalışmamız Dürerü'l Hukkam Şerhu Mecelleti'l-Ahkâm adlı eserin icâre bahsi ile alâkalı bilgileri içeren 458-533. maddelerinin kaynaklarının tespit ve tahkikinden oluşmaktadır. Metinden faydalanmayı kolaylaştırmak amacıyla ilgili bölüm latinize edilmiş ve bu esnada metnin aslına sadık kalınmaya özen gösterilmiştir.Tezimiz, giriş ve ana bölümden oluşmaktadır. Ana bölüm; Ali Haydar Efendi'nin hayatı ile bahsi geçen maddelerin latinize edilmesi ve kaynaklarının tahkik çalışmasından oluşmaktadır.Tezimizin amacı ise Dürerü'l Hukkam Şerhu Mecelleti'l-Ahkâm'ın Kitâbü'l-İcâre bölümünün belirtilen maddelerini latinize ederek ve kaynaklarının tahkik çalışmasını yaparak konuyla ilgilenenlerin bu eserden istifadelerini kolaylaştırmaktır."
