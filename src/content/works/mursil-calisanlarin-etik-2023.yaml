abstract: "Yöneticilerin çalışanlara karşı davranışları ve onlarla olan ilişkileri örgütsel bağlılık düzeyi üzerinde etkili olmaktadır. Yöneticiler ve çalışanlar arasındaki ilişkiler, çalışanın örgüte bağlılık düzeyini doğrusal olarak etkiler. Örgüt içinde verimli bir çalışma ortamı yaratmak için yöneticiler ve çalışanlar arasındaki ilişkinin incelenmesi gerekir. Çalışanlar, yöneticilerinden yüksek düzeyde güven algıladıklarında ve onlarla olumlu deneyimler yaşadıklarında, organizasyonu sahiplenerek daha verimli çalışacaklardır. Bu bağlamda yürütülen araştırmanın konusu, yöneticilerin etik liderlik ve örgütsel adalet davranışlarının çalışanların örgütsel bağlılık düzeyleri üzerindeki etkisinin incelenmesidir."
