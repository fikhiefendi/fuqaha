abstract: "Sahabe döneminden itibaren islam ve fıkıh tarihi boyunca kıyas, naslarda hükmü bulunmayan meselelerin çözümünde önemli bir işleve sahip olmaktadır. Kıyasın esasını ve ana dayanağını de \"illet'' oluşturmaktadır. Bundan dolayı Gazali, kıyasa illet de denilebileceğini söylemektedir. Zira illet, kıyas metoduyla istinbat edilen hükümlere kaynaklık etmekte ve kıyastan beklenen neticenin alınabilmesi ancak ona bağlı olmaktadır. Bu yönüyle ta'lil ameliyesi, dolayısıyla illet mefhumu fıkhi/hukuki problemlerin çözüme kavuşturulmasında büyük bir fonksiyona haiz olmuştur. Hz. Peygamber nassları ta'lile konu yaptığı gibi, ashab-ı kiram da naslarda yer alan şer'i hükümleri ta'lile tabi tutmuşlar, ortaya çıkan yeni olaylar karşısında, meselelere çözüm üretmişlerdir. Aynı durum, mezheplerin teşekkül etmeye başladığı ilk dönem için de söylenebilir."
