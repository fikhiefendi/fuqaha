abstract: "Faiz, insanlar arasında adaletsizliğe sebep olması nedeniyle geçmişten günümüze tüm dinlerde yasaklanmıştır. İslamiyete göre alışveriş helal, faiz ise haramdır. Allah Kur'an-ı Kerim'de faizden sakınmayanların Allah'a ve Rasülüne(sav) savaş açtıklarını; ayrıca ahirette kabirlerinden şeytan çarpmış gibi kalkacaklarını haber vermektedir. Yapılan bazı çalışmalarda, temel görevi İslam dinini en iyi şekilde insanlara anlatmak olan Diyanet personelinin faiz hassasiyeti incelenmiştir. Faizin haram olduğunu bilmelerine rağmen diyanet personolinin bir kısmının faizli işlem yapmaktan kaçınmadığı tespit edilmiştir. Bu bağlamda çalışmamız hassasiyet eksikliğinin gerekçelerini ortaya koymak üzerine kurgulanmıştır. Diyanet personelinin faiz konusunda hassasiyetinin beklenenden daha az bulunduğu verisinden yola çıkarak, bunun akli gerekçelerini ve rasyonalitesini ortaya koymak bu tezin konusunu oluşturmaktadır. Bu çalışmanın amacı Diyanet personelinin banka tercih nedenlerini rasyonalize etme gerekçelerini ortaya koymaktır. Literatür incelendiğinde diyanet porsonelinin banka tercih nedenlerin gerekçelerini inceleyen herhangi bir çalışma yapılmadığı görülmektedir. Bu açıdan çalışmanın literatüre katkı sağlayacağı belirtilebilir. Üç bölümden oluşan çalışmanın birinci bölümünde müşteri kavramından bahsedilmiştir. Müşterinin gruplanması anlatılmış ve müşteri memnuniyeti kavramı üzerinde durulup açıklanmıştır. İkinci bölümde müşterilerin banka tercihlerini etkileyen faktörler ele alınıp incelenmiştir. Üçüncü bölümde ise Sakarya'nın çeşitli ilçelerinden seçilen farklı görevlerdeki 35 Diyanet personeli ile öncelikle anket uygulaması, ardından derinlemesine mülakat yapılmıştır. Sonuç bölümünde ise elde edilen veriler ışığında çalışmanın değerlendirmesi yapılıp gelecekte yapılacak çalışmalar için öneriler sunulmuştur."
