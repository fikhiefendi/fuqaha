abstract: "Bu tezin temel amacı, günümüz dünyasında sanayi ve teknoloji alanında yaşanan baş döndürücü gelişmeler nedeniyle önemli bir iktisadi değer oluşturan ve bu yüzden de hukuk sistemlerinin temel konularından biri haline gelen sınai mülkiyet haklarının İslam hukuk sisteminde nasıl bir karşılığının bulunduğunu tespit etmeye çalışmaktır. Tezde, doktrindeki ve hukuki düzenlemelerdeki tanımlamalar ışığında sınai mülkiyet hakları tanımlanarak, İslam hukukunun hak ve mülkiyet teorileri çerçevesinde bu hakların İslam hukukundaki karşılığı incelenmeye çalışılmıştır. Ayrıca patent hakkıyla ilgili Osmanlı döneminden günümüze kadar yapılmış olan hukuki düzenlemeler özetlenmiştir. Bu çalışmanın neticesinde, sınai mülkiyet haklarının İslam hukukunun hak ve mülkiyet müesseseleri içerisinde yer bulabileceği, sınai mülkiyet haklarının İslam hukuku bakımından da ekonomik bir değer olarak kabul edilebileceği ve bu hakların hukuki işlem ve muamelelere konu olabileceği sonucuna ulaşılmıştır. Ayrıca, toplumsal hayatın vazgeçilmez bir parçası haline gelmiş olan sınai mülkiyet hakları ile ilgili İslam hukukçularının daha kapsamlı çalışmalar yapması gerektiği, diğer hukuk sistemlerinde olduğu gibi, İslam hukukunda da sınai mülkiyete ilişkin içtihatlar oluşturulması düzenlemeler yapılması gerektiği kanaatine varılmıştır."
