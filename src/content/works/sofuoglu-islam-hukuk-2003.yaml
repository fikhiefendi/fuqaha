abstract: "ÖZET Bu çalışmanın amacı, Zahiriye Ekolünün usûl anlayışını ortaya koymaktır. Zahiriye Ekolü İslâm hukuk tarihinde önemli bir yere sahiptir. Siste mini nassların literal anlamı üzerine kurmuştur. En büyük temsilcileri Dâvûd ez-Zâhirî ve İbn Hazm'dır. Bu ekolün en büyük özelliği kıyası reddetmiş olmalarıdır. Bu çalışmamız bir giriş ve üç bölümünden oluşmaktadır. Giriş bölümünde“mezheb/ekol”kavramı üzerinde durduk. Bu kavramın ortaya çıkış sürecini ele alıp İslâm hukuk mezheplerinin oluşumunu inceledik. Birinci bölümde, Zahiriye Ekolünün tarihî arka planını ele aldık. Bu ekolün ortaya çıkmasını etki eden faktörleri tespit etmeye çalıştık. İkinci bölümde ise, Zahiriye Ekolünün karakteristik özelliklerini ortaya koymaya çalıştık. Onların ictihaddan, taklitten, akıl/nakil ilişkisinden ve Zahirî yorumlamadan ne anladıktan üzerinde durduk. Son olarak üçüncü bölümde, Zahirîlere göre, hüküm çıkarmada nelerin delil kabul edilip nelerin delil kabul edilmediğini inceledik. Dolayısıyla Kur'ân, Sünnet, İcmâ, Delil, Kıyas, Nâsih ve Mensuh gibi kavramlara yükledikleri anlamları tespit etmeye çalıştık."
