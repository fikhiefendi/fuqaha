abstract: "Dünyevileşme ve teknoloji kirliliği ile birlikte esen ve toplum vicdanında yer bulmayan değişim rüzgârları, birçok anlayış gibi aile anlayışımızın da içini boşalttı. Her birimizin hayatına dokunan yönü olan ailenin, yeni anlamlar yüklemeden zaten var olanı açığa çıkararak içinin doldurulması, doğal sınırlarına çekilip sınırlarının kalın çizgilerle belirlenmesi ve onun kendi bütünlüğünün sağlanması, her ailede görülebilecek ufak tefek aksiliklerin ya da ciddi uyuşmazlıkların hallini sağlayacak girişimlerin sonuçlanması; kadın ya da erkeğin kendilerini saf dışı bırakması, ya da birbirini saf dışı etmesi veya güç yarışına girmesiyle değil; güvenilirliğini ve yeterliliğini ispatlamış bireylerin aileye yüklenilen mânâları (ahlaki ölçülenme, iman öğretimi, dava birliği, hedef birliği, gönül hoşnutluğu) ve aileye dair değerleri (sevgi, saygı, hürmet, ilgi-alâka, fedakârlık, sabır, emek, güven, vefa, adalet, emanet, mahremiyet, istişare, teenni, huzur, rahmet, sükûnet) kendilerinde barındırmalarıyla mümkündür. Bu vesile ile soyut olan aile kavramı kadın özelinde somutlaştırılmış, toplumun ailelerden, ailelerin de kadın ve erkekten oluşup şekillendiğinin farkındalığıyla birey olmanın sorumluluğu, farklılıklara toleranslı olmanın gerekliliği, kadın ve erkeğin yuvalarında bütünleşmesinin ve dengeleşmesinin değerliliği, kadın olmanın ailede neye karşılık geldiği, kadın ve ailenin iç içeliği; kadından aileye, aileden kadına tevarüs eden şeylerin/değerlerin mezc ediciliği; birbirlerinin hayat menbaı ve merkez noktaları olmaları göz ardı edilmeyen bir perspektifle gözlem altına alınmıştır."
