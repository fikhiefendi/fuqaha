abstract: "Kıymetli madenler geçmişten günümüze takas aracı, madeni para, fiziki birikim aracı ve yatırım enstrümanı olarak kullanılmasının yanı sıra sanayi faaliyetlerinde hammadde ve gündelik yaşamımızda ziynet eşyası olarak da kullanılmıştır. Ülkelerin savaşta ve barışta kullandığı önemli bir enstrüman olan altın Dünya üzerinde geçer akçe olarak bilinen bir kıymetli madendir. Gümüş, platin, paladyum, bakır ve nikel gibi kıymetli metallerde hem yatırım aracı olarak hem de sanayide kullanılmaktadır. Bankalar, ticari ve bireysel hesaplarda kıymetli madenlerin alım-satım işlemlerini gerçekleştiren finans kuruluşlar olarak günümüzde birçok çeşit kıymetli maden hesapları açmaktadırlar. Katılım Bankaları ayrıca bu tür işlemleri yaparken Mevduat Bankalarından farklı olarak İslami kurallar çerçevesinde, bir finansal düzen içerisinde kalarak faaliyet göstermektedirler. Dünya üzerinde birçok banka ve finans kuruluşları kıymetli maden alım satım işlemi yapmaktadır. Türkiye dışında faaliyet gösteren bu bankalar Türkiye'deki açılan hesaplar haricinde alternatif oluşturabilecek kıymetli maden işlemleri yapmaktadır. Çalışmamızda Türkiye'deki yastık altı fonların da incelenerek, Türkiye'deki finans kuruluşlarının kıymetli maden faaliyetleri incelenmiş, yurtdışındaki faaliyet gösteren kuruluşlarının alternatif metal ve bakır işlemleri, ülkemizdeki bankaların ilgili birimlerinden görüşler de alınarak öneri olarak sunulmuştur. 141 kişiyle yapılan anket çalışmasının sonuçları, anketin geçerlilik ve güvenilirlik çalışmaları SPSS 25.0 programında yapılmıştır. Açımlayıcı faktör analizinde KMO, Barlett ve madde faktör yük değerlerine bakıldıktan sonra binişik madde olmadığından dolayı herhangi bir madde atımı gerçekleştirilmemiştir. Daha sonra maddelerin madde ayırt edici indeksi incelenmiştir. Herhangi bir sorunla karşılaşılmamıştır. Anketin geçerlilik güvenilirlik çalışmasından sonra 2 grubun karşılaştırılması t testi, 2'den fazla grubun karşılaştırılmasında tek yönlü varyans analizi kullanılmıştır. Alternatif hesap olarak bakır hesabına yönelik olumlu görüşler anketinde eğitim düzeyine göre olumlu sonuca ulaşılmıştır."
