abstract: "islam hukukunun olusumunda F1k1h kaidelerinin acik bir rolii vardir. Cunkil bu kaideler Allah' 111 kitabi ve Hz. Peygamber' in si.innetindeki naslann bi.itiini.inden F1k1h alimlerinin anladiklannm hulasasi mesabesindedir. F1k1h alimlerinin bu kaideleri vaz etmesindeki amac; f1kh111 kendisi i.izerine bina edilebilecegi fetvaya esas bir takun kurallar ve anlasmazhk durumunda kendisine basvurulabilecek bir kisun kaideler olusturmaktrr.Bu kaideler aracihgryla mtiftti fetvasrru verebilecek ve hakim verecegi hiikrne referans olabilecek esaslara sahip olacakur. Bu sebeple dort mezhebe mensub olsun olmasm F1k1h alimlerinin tarnarnr; bu kaideleri rneydana getirmek, bablara ayrrmak ve bunlan feri' meselelere tatbik etme hususuna onern verrnislerdir ki her bir fikrh alimi, bu ilimden elde ettiklerini bir araya toplanus olsun. Bunin fikih ictihadlan bu kaidelere dayamr ve biitiin mezhepler bunlan goz onunde bulundurmaya caba sarfeder. fikrh alimleri arasmda bu kaideler etrafmda tartismalar suregelmistir. Bunun sonucunda bir kisim kaideler i.izerinde ittifak edilirken bazilan da mezhepler arasmda ihtilaf konusu olmustur. Ote yandan F1k1h alimleri; F1k1h kaidleri ile usul kaideleri arasmda aynma gittikleri gibi, kavaidi fikhiyye ile zavabrtifikhiyyeyi de birbirinden ayrrmrslardtr. Cunku bunlardan her biri digerlerinden farkh bir anlama sahiptir. Bu sebeple Islam medeniyetindeki hukukcular; Rasid halifeler donemindeki yargrlama usiillerinde adaletin gozetilrnesine verilen onern ve bunun sonucu olarak ortaya cikan insanlar arasinda adaleti gozetip, kisi hak ve hurriyetini garantiye almaya oldukca onem verrnislerdir. Ozellikle bu durum Osmanli'run son doneminde (Tanzimat donerni) bi.iti.in ciplakltgi ile kendini gostermistir. Cunkii bu donemde hukukcular fikrh kaideleri rsigmda Devlet idaresini esas alan kanunlar haztrlamislardrr. Bu fikih koleksiyonunun (Mecelle-i Ahkam-i Adliyye) onernli sonucu; bu koleksiyonun sonunda yer alan, devlet idaresi ve yargilama hukukuna dair maddelere yer verilmis olmasrdrr. Biz bu cahsrnarruzda; Mecelle-i Ahkam-i Adliyye cercevesinde Osmanh Devlet Yonetiminde F1k1h kaidelerinin rolunun boyutlanrn arasuracagrz.Bu sebeple oncelikle; Hanefi Mezhebi basta olmak uzere mezheplerin klasik fikrh kaynaklanndan basvurulmustur. Sonra da devlet idaresi ve yargilama hukuku alanmdaki Osmanh vesikalan uzerinde cahsilrmsnr. Bumm yamnda mahkemelerin ti.irleri ile cograf dagihmlan ve adaletin gerceklesmesi. insan hak ve hi.irriyetinin korunmasmdaki etkilerine de ternas edilmistir. Ayrica bu calismada ki.illi lrkrh kaidelerinden kanun tarzmda alt maddelerin nasil crkanldrgi da Mecelle-i Ahkanu Adliyye cercevesinde arasurrna konusu yapilrmstrr."
