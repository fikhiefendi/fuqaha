abstract: "Bu çalışma, Vakıf sisteminin İslami vizyonuna hayırsever bir insani kalkınma sistemi olarak toplumlarda gelir ve servat yeniden nasıl dağıtacağına ilişkin büyük bir araştırma sorusunu yanıtlayarak gerçekleştirilmiştir. Ayrıca, vakıf genel olarak insan toplumlarındaki sınıf boşluklarını azaltmada rolünü yapabilmek için, ve servetin birikimi ve dağıtımı arasındaki dengesizlik ve adalet sorunları çözmeye yönelik bir sosyo-ekonomik mekanizması olduğu için toplum tarafından desteklenmeli ve geliştirilmelidir. Çalışma, kuramsal ve metodolojik çerçevesinden sonra, vakıfların islam fıkhı çerçevesinde kurallarının, yapısının ve koşullarının tanımlanmasıyla, kavramlaştırılmasına başlamıştır. Daha sonra Vakıfların İslam uygarlığının çağları boyunca önemine odaklanmıştır. Çalışma ayrıca, çağdaş toplumlarında sınıf boşluğu problemine ve bu boşlukları gidermek için vakıfların rolüne ışık tutmadan önce, dağıtım sürecinin İslam iktisadı perspektifinden hukuki ve usulsel köklenmesini analiz etti. Çalışmanın pratik boyutunu vurgulama bağlamında, batılı ve İslami modeller ile her iki modelde de vakıfların dağıtım rolleri arasında bir karşılaştırma sunmayı amaçlamaktadır. Vakfın sadece İslami bir ürün olduğu gerçeğine rağmen, felsefesi, İslam'ın ortaya çıkmadan önce eski insan medeniyetleri, ve İslam'ın ortaya çıkışından sonra İslami olmayan medeniyetleri ve diğer dinler çerçevesinde ortaya çıkan modelleri bulunmuştur. Özellikle İslami Vakıf deneyimlerinden yararlanan ve kültürel paylaşım çerçevesinde uygulayan Amerikan ve Avrupalılar modern Batı uygarlığı için bir başlangıç noktası olmuştur. Çalışmada, vakfın tüm seviyelerde, ekonomik, sosyal, gelişimsel ve hatta politik düzeyde önemine değinilmiştir. Aynı zamanda, İslam ekonomisinin genel perspektifinden servetin gelir ve dağıtımında adalet ilkelerini vurgulamıştır. İslamda servatin toplanması ve dağıtması için önde gelen iki önemli sosyo-ekonomik model bulunmaktadır. Bunlar birincisi farz edilen zekat ikincisi ise vakıflardır. Çalışmada, İslam iktisadı teorisindeki mülkiyet temelleri ve İslami ekonomik perspektifte servet dağılımının aşamaları açıklanmış ve çalışmanın pratik boyutu göze alınmıştır. İslâmî bir perspektiften bu dağılımın tarihsel ve çağdaş modelleri aracılığıyla araştırılınca, Vakıflar sistemi, İslamin medeniyeti boyunca ve islamin en zayif dönemlerinde bile, islam toplumlarında en önemli rol oynayan sistemdir. Çalışma, çağdaş İslam toplumlarındaki sınıf boşluklarının gerçekliğini inceleyip ve bu boşlukları etkin bir şekilde doldurmak için vakıf oynadığı veya oynayabileceği rolü analiz etmiştir. Özellikle, Vakıf sisteminin karşılaştığı zorluklar ve sorunlar ele alınmasıyla , bu sorunlar politik, ekonomik, sosyal ve yasal düzeylerde olabilir. Araştırma, tohumları islam uygarlığından alınmış ve kendi toplumlarında dikmiş ve geliştirilmiş vakıf sisteminin batı deneyimi ve tecrübesi ele almıştır. Çalışma, iletişim, idari, hukuki ve ekonomik gelişmeler ile dev kurumlara dönüştürülen önde gelen batı vakıf örneklerinden bazılarını sunmuştur. Bu vakıf kurumları büyük yatırımlar, iddialı yatırım stratejileri ile büyük getiriler elde ediyor, sadece vakıfları korumakla kalmıyor, aynı zamanda toplumu bir bütün olarak fayda sağlayacak şekilde varlıklarını artırırlar ve geliştirmektedirler. Bütün bunlar, Müslüman olmayan toplumlarda, İslam'ın ortaya çıkmasından önce ve sonra vakıf tarihinin gözden geçirme amacıyla araştırılmıştır. Daha sonra mevcut batı deneyimlerinden yararlanarak vakfın en önemli imajlarını ve çağdaş uygulamalarını, batılı toplumlarda sınıf ve tabaka boşluklarını doldurulmasında vakıf sektörünün oynadığı rolu ele alarak Arap ve İslam ülkeleri düzeyinde batı vakıfları başarılarından nasıl yararlanılacağı tartışılmıştır."
