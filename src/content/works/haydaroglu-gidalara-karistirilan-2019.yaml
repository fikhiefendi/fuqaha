abstract: "Gıdalara karıştırılan katkı maddelerinin hükmünü ele aldığımız bu araştırmamızda, toplumlar arası sınırların manasını kaybettiği günümüzde sanayileşme ve materyalist hayat anlayışının Müslümanları helâl beslenme ve sağlıklı nesiller yetiştirme konusunda karşı karşıya bıraktığı temel problemlerden biri olan içeriği ve hükmü bilinmeyen katkı maddelerini ana hatları ile değerlendirip bu konuda farkındalık oluşturmaya çalıştık. Bu bağlamda konuyu, biri temel gıda maddeleri ve ahkâmı diğeri gıda katkı maddeleri ile istihlâk ve istihale çerçevesi olmak üzere iki ana bölümde değerlendirdik. Konuları ele alırken başta temel tüketim ürünleri olan gıdalara karıştırılan katkı maddelerinin birçok yönden mahzurlu olduğu ve kullanılmalarının dünya ve ahirete müteallik çok ciddi riskler barındırdığını ifade etmeye çalıştık."
