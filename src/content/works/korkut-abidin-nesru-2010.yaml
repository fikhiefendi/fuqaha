abstract: "İbn Âbidin'in ?Neşru'l-arf fî binâi ba`di'l-ahkâmi ale'l-örf? Adlı Risâlesi ve Bu Risâle Işığında Sosyal Değişmenin Hükümlere Etkisi? adlı bu çalışmamızda öncelikle İbn Âbidin'in ?Neşru'l-arf? adlı risalesi tercüme edilmiştir. Birinci Bölümde; tercümeyle birlikte bu risalenin müracaat kaynakları tam olarak tespit edilmiş, eserler ve müellifleri hakkında kısa tanıtıcı bilgiler verilmiştir. Örf konusunda önemli bir yer tutan bu risâleye ayırdığımız birinci bölümde risalenin müellifi İbn Âbidin'in Hanefi Fıkhındaki yeri, risâlede yer verilen konular ve risalede kullanılan yöntem ele alınan diğer konulardır.Risalede örf kavramı üzerinde durulmuş, örf ve âdetin lügat ve ıstılahî anlamları, bu iki kavram arasındaki benzer ve farklı yönler, örfün kısımları, örf kavramıyla aynı veya farklı köklerden gelip literatürde örfle aynı anlamda kullanılan diğer kavramlar, örfün şer'î bir kaynak oluşunun delilleri ve örfe hukûkî değer kazandıran şartlar hakkında burada yeterli bilgiler verilmiştir.İkinci bölümde ulaşmayı hedeflediğimiz nokta olan ?Sosyal değişmenin hükümlere etkisi? konusu örf risalesi eksene alınarak incelenmiştir. Bir başlık altında hükümleri etkileyen âmiller tek tek ele alınmış ve örneklerle îzah edilmiştir. Yine bu bölümde örfün hükümler üzerindeki etkisi ayrı bir başlık altında ele alınarak örfün değişmesi ve bunun hükümlere yansıması etraflıca değerlendirilmiştir. İbn Âbidin'in risalesi ışığında çıkılan yolda örf kavramı üzerinden sosyal değişmenin hükümleri etkileyip etkilemediği ve bunun sınırları ortaya konmaya çalışılmıştır."
