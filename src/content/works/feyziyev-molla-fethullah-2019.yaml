abstract: "Molla Fethullah el-Kâşânî h. 10. Yüzyıl Şii müfessirlerindendir. Çalışmamızın konusu olan Zübdetü't-Tefasir eseri el yazmasına dayalı olarak basılmış, daha önce çalışılmamıştır. Bu tez el-Kâşânî'nin Zübdetü't-Tefasir'deki kullandığı kaynak, metodu araştırarak, dönemin Şii tefsirinin genel özelliklerini ortaya koymayı ve mezkûr eseri tanıtmayı amaçlamaktadır. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın amacı, kapsamı, metoduyla birlikte, el-Kâşânî'nin hayatına ve eserlerine dair bilgileri içermektedir. Birinci bölüm el-Kâşânî'nin kullandığı hadislerin konularını, sahabe, tabiûn, tefsir, hadis mecmuaları, dilbilimsel ve kıraatle ilgili başvurduğu kaynakları kapsamaktadır. İkinci bölümde müellifin Ulûmu'l-Kur'an, klasik dil disiplinlerinin sarf, nahiv, belagat, fonetik, kıraat gibi farklı dalları, Kelam, Fıkıh gibi konularda görüşleri ve diğer farklı fikir sahiplerine karşı tavrı ortaya konulmuştur. Sonuç kısmında Zübdetü't-Tefasir hakkından genel bir değerlendirme yapılarak elde olunan sonuçlar açıklanmıştır."
