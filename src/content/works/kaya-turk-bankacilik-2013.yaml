abstract: "Katılım bankacılığı, faizsizlik prensiplerine göre çalışan, bu prensiplere uygun her türlü bankacılık faaliyetlerini gerçekleştiren, kar ve zarara katılma esasına göre fon toplayıp, ticaret, ortaklık ve finansal kiralama yöntemleriyle fon kullandıran bir bankacılık modelidir. Türk bankacılık sistemi, ticari bankalar, katılım bankaları ve yatırım bankaları olmak üzere üçlü bir yapıya sahiptir. Türkiye'de ilk kurulduğu tarihte 'Özel Finans Kurumu' adı verilen faizsiz bankacılık kuruluşları 5411 sayılı Bankacılık Kanunu'nda yapılan değişiklikle 2006 yılı başından itibaren 'Katılım Bankası' adını almıştır. Katılım bankaları, ticari bankalarda verilen hizmetlerin tamamına yakın kısmını verebilmektedir. Sektörde dört katılım bankası hizmet vermektedir. Banka sayılarının artması önümüzdeki dönemde beklenmektedir. Diğer bankalarla rekabet edebilmeleri açısından ürün sayısı ve kalitesinin artması önemlidir. Bankacılık sektöründe de tüm hizmet sektörlerinde olduğu gibi, bankanın ve verilen hizmetin müşteriler tarafından neden tercih edildiğinin ve nasıl algılandığının tespit edilmesi çok önemlidir. Katılım bankalarının bu piyasadan daha yüksek pay alması ve diğer bankalarla rekabet edebilecek düzeye ulaşması için müşterilerinin tercih nedenlerini belirlemesi ve müşteri memnuniyetini en üst düzeyde sağlaması gerekir. Özellikle katılım bankalarının tercih edilme nedenlerinin bilinmesi yönünde yapılacak araştırmaların, sistemin daha fazla büyümesi ve etkin olarak varlığını sürdürmesi ile Türk ekonomisine katkısının ölçülmesi açısından önemli faydaları olacağı düşünülmektedir."
