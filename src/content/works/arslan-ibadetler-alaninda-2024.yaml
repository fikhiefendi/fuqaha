abstract: "İmam Kudûrî'nin el-Muhtasar adlı eserinin ibadetler bölümünde Hanefi İmamlar arasındaki ihtilaflar ve dayanaklarının tahlilinin yapıldığı bu çalışma Giriş, İki Bölüm ve Sonuç kısımlarından oluşmaktadır. Giriş kısmında çalışmanın amacı, konusu ve kaynakları üzerinde durulmaktadır. Birinci bölümde ilk olarak Hanefî mezhebi kurucusu İmâm-ı Âzam Ebû Hanîfe ve onun önde gelen talebeleri İmam Ebû Yusuf ile İmam Muhammed'in hayatı ve eserleri hakkında bilgi verilmektedir. Daha sonra İmam Kudûrî'nin hayatı ve eserlerinden bahsedilmektedir. Bu çalışmanın ana konusu olan el- Muhtasar eserine de ayrı bir başlık altında yer verilmektedir. İkinci bölümde ise el- Muhtasar isimli eserin ibadetler bölümünde Hanefi İmamlar arasındaki ihtilaflar ele alınmıştır. İhtilaf edilen meselelerde imamların delillerine yer verilerek tahlili yapılmış, konuyla ilgili Din İşleri Yüksek Kurulu fetvası varsa o da eklenmiştir. Çalışmanın sonuç kısmında ise Hanefi mezhebi imamlarının muhalif görüşleri değerlendirilmiştir. Bu değerlendirmeler neticesinde birçok meselede imamların müttefik olduğu ancak bazı meselelerde farklı görüşlerinin bulunduğu tespit edilmiştir. İhtilaf etmelerinde, usül açısından farklı yaklaşım sergilemeleri, yaşadıkları zaman ve mekânın değişiklik göstermesi veya farklı tecrübeler edinmeleri gibi sebeplerin rol oynadığı neticesine ulaşılmıştır."
