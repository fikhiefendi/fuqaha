abstract: "Cassâs'ın Ahkâmü'l- Kur'an adlı eseri fıkhî tefsir alanında yazılmış eserlerin ilklerinden ve en önemlilerinden kabul edilir. Eserde, Sahabe, müçtehit âlimler ve mezhep imamların görüşlerine bolca yer verilmektedir.“Cessâs'ın, Ahkâmü'l-Kur'an'da İbâdetlerle İlgili İmam Şâfii'ye Nispet Ettiği Görüşlerin Tahkiki ”adlı çalışmamızda Şâfiî mezhebinin kurucusu olan İmam Şâfiî'ye ibadetler ili ilgili nispet edilen atıflar incelenmiştir. Tez, giriş, iki bölüm ve sonuç bölümlerinden oluşmaktadır. Giriş bölümünde konunun konusu, önemi, amacı, yöntemi belirtilmiştir. Birinci bölümde İmam Cassâs'ın hayatı anlatılmış ve tezin konusu olarak ele alınan eserin özellikleri anlatılmıştır. İkinci bölümde Ahkâmu'l- Kur'an adlı eserindeki İbadetlerle ilgili İmam Şâfiî'ye yapılan atıflar incelenerek araştırmanın asıl bölümü yazılmıştır. Bu bölümde Taharet, Namaz, Oruç, Zekât ve Hac konuları ile ilgili atıfların isabetli olup olmadıkları ile tartışılmıştır. Sonuç bölümünde yapılan atıfların isabet oranları tespit edilerek bir oran elde edilmiştir."
