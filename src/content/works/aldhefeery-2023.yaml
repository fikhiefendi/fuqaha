abstract: "Alimler, tarihte ve günümüzde pek çok meselede ihtilaf etmişlerdir. Bu durum onların gerek teorik gerekse de pratik olarak istinbat kaidelerinde ihtilaf etmelerinden kaynaklanmaktadır. Zaten İslam Hukuku kitapları, meselelerin kolay anlaşılması için fıkhî kaidelere, istinbat yollarını açıklamak için de aslî kaidelere sık sık atıfta bulunurlar. Hemen hemen bütün Fıkıh kitaplarında herhangi bir fer'î meselenin hükmü beyan edildiğinde, meselenin hangi kaidenin altına girdiği de ifade edilir. Usul kaidelerinin bazıları deliller, hükümler, tearuz ve tercih ile ilgiliyken diğer bazıları da lafzın delaleti, müftî ve müsteftî hakkındadır. Her delilin bir medlûlu/sonucu olması gerektiği gibi bir hükmü de olmalıdır. Bazen zahirde bir tearuz görünebilir fakat bunun yeri müctehidlerin zihinleridir. Remlî'nin Fethu'r-Rahman Şerhu Zubdi İbn Ruslan adlı eserinde miras bıraktığı kaideler hususunda, ele alınan risalenin büyük bir payı vardır. Bu çalışmada, kaideler usul bablarına göre sıralanarak dört bölüme ayrılmıştır: fıkhî kaideler, deliller-hükümler, lafzın delaleti ve tearuz-tercih. Bilimsel ve akademik araştırma kurallarına riayet edilen bu çalışmada, tümevarımcı bir şekilde kaideler detaylı bir şekilde incelenerek kaidelerin lügavî ve ıstılahî manaları açıklanmış, varsa alimlerin o konudaki ihtilafları belirtilmiş ve furu'-ı fıkıh ile kaide arasındaki ilişki ve etkileşim ifade edilmiştir."
