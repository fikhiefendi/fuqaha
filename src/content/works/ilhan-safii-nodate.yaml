abstract: "Ebu't-Tayyib et-Taberî (ö. 450/1058), ashâb-ı vücûhtan sayılan erken dönem Şâfiî fakihlerinden biridir. Irak ekolünü temsil eden önemli isimlerden ve döneminin ilmî otoritelerinden biri kabul edilen Ebû Tayyib et-Taberî, ilmî titizliği, güvenilirliği, usûl ve furû meselelerine hâkimiyeti, güzel ahlakı ve takvası ile ön plana çıkmış, gerek kendi dönemi gerekse sonraki dönemlerde âlimler tarafından birçok övgüye mazhar olmuştur. Erken yaşlarda ilim tahsiline başlayan Taberî, doğduğu Âmül şehri başta olmak üzere Cürcân, Dînever, Nîsâbûr ve Bağdat'ta birçok âlimin ders halkalarına katılmış ve Hatîb el-Bağdâdî (ö. 463/1071), Ebû Bekir eş-Şîrâzî (ö. 476/1083) ve İbnü's-Sabbâğ (ö. 477/1084) gibi mezhep içinde temayüz eden birçok isme talebelik yapmıştır. Usûl, cedel, mezhep, hilaf, hadis ve şiir alanlarında derinleşmiş olan müellif, çok sayıda eser kaleme almış ve bu alanlardaki birikimini sonraki nesillere aktarmada önemli bir rol oynamıştır. Yazdığı eserler arasında et-Talîkatü'l-kübrâ adıyla bilinen Müzenî'nin (ö. 264/878) el-Muhtasar'ı üzerine yazdığı geniş hacimli şerhi, kendi dönemi ve sonraki nesiller tarafından büyük önem atfedilen bir eser haline gelmiştir. Sahabeden başlayarak kendi dönemine kadar çok sayıda ismin fıkhî görüşlerine yer vermesi açısından bu kitap, hilaf türünün başarılı bir örneği kabul edilir. Aynı zamanda erken dönemde kaleme alındığı için, içerdiği usûlî bilgiler açısından, o dönemin usûl tartışmalarını göstermesi bakımından hatrı sayılır bir konumda bulunmaktadır. Yine hem İmâm Şâfiî'nin farklı görüşlerini hem de mezhep içindeki ihtilafları nakletmesi ve çoğu zaman tercihlerini beyan etmesi bakımından büyük bir öneme sahiptir. Daha çok tercihlerinden teşekkül eden ictihâdî faaliyetlerinin yanı sıra müellif, eserinde mezhep içi ictihad ve tahrîclerde de bulunmaktadır. Bu tezde Taberî'nin fıkıhçılığı söz konusu eseri üzerinden ortaya konulmaya çalışılmıştır. Bu bağlamda ilk bölümde Taberî'nin hayatı, ilmî kişiliği, eserin önemi, muhtevası, metodu, kaynakları gibi konular ele alınmıştır. İkinci bölümde Taberî'nin hükümleri delillendirme yöntemi ve usûli görüşleri incelenmiştir. Son bölümde ise müellifin fıkhî ictihadları üzerinde durulmuştur. Bu bağlamda mezhep sınırları içinde yaptığı ictihadlar, tahrîcler ve tercihleri tespit edilmiş ve incelenmeye tabi tutulmuştur."
