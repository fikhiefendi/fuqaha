abstract: "İslâmî ilimlerin temelini oluşturan Kur'ân-ı Kerîm ve Hadîs-i Şerifler, insanları karanlıklardan aydınlığa çıkarmak ve onları dalaletten kurtarıp doğru yola ulaştırmak için en temel bilgi kaynağını teşkil ederler. Kur'ân- Kerim ve Hadîslerin bu hidâyet görevini yerine getirebilmesi, öncelikle onların doğru anlaşılabilmesine bağlıdır. Aradan geçen asırlar içerisinde, sözcüklerde birtakım anlam değişmelerinin meydana geldiği gelebileceği bir gerçektir. O halde bu anlam değişmelerinin belirlenmesi, doğru anlam için kaçınılmazdır. Hadîs metinlerinde yer alan bazı kelimelerin ne anlama geldiğinin bilinmesi, varsa garîp lafızların açıklanması, hadîsi daha doğru anlamamıza vesile olacaktır. İlerleyen zaman içerisinde bazı kelimelerin mana ve kullanışında değişmeler olmuşsa bu kelime ve ifâdelerin hadîslerde geçtiği şekliyle o günkü ve o kabilelerin lügatındaki manaları tespit etme hadîsi doğru ve daha iyi anlamamıza vesile olacaktır. İslâm Dîni, bilgi temeli üzerine oturan bir dindir. Getirdiği dünya görüşü, insanlığa sunduğu yaşam biçimi, bilmek ve yaşamak ya da bilerek yaşamak ilkesini esas kabul eder. Dinî kültürümüzün şekillenmesinde önemli katkısı olduğunu düşündüğümüz Kütüb-i Sitte ki, tarihi süreçte Müslümanların en çok itibar ettikleri temel hadîs kaynaklarından biri olmuştur. Bu çalışmamızda, Kütüb-i Sitte içerisinde yer alan“Kitâbü'l-İlim”bölümlerindeki hadîslerin, şârihlerin açıklamaları doğrultusunda o dönemlerde hangi anlamlara geldiklerini tesbit ederek, ilim kelimesinin anlamı üzerinde zaman içerisinde anlam değişikliklerin olup olmadığının ortaya çıkarılması amaçlanmıştır."
