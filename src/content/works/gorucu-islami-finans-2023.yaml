abstract: "İslami Finans Okuryazarlığı ve Finansal Yönetimlere Etkisi: Manisa Diyanet Personeli Örneği\" Adlı tez çalışmamızda günümüz finansal sistemi içerisinin büyük bir çoğunluğunu oluşturan faizli bankacılık ile faizli finansman çeşitlerinin yanında sistem içinde azda olsa İslami kurallar ve İslam ticaret hukuku ile varlığını gösteren Katılım bankaları ve onların finansman ürünleri de yer almaktadır. Konvansiyonel bankalar ile Faizli ekonomik sistem içerisinde sadece finansman çeşitlerinin yanında birçok piyasa ve ticari alışverişin finans okuryazarlığı incelenmiş ve araştırılmıştır. Ele aldığımız çalışmamızda Faizli sistem karşısındaki İslami duyarlılık sahibi kişi ve kurumların kendine has İslam iktisadı kriterleri ile oluşmuş bir finansal okuryazarlığın edinilmesini inceledik. Özellikle İslami duyarlılığı olan kişiler, İslami finans okuryazarlık ve bilgi düzeylerinin yetersiz olduğu durumlarda ilk başvurdukları kişi yâda kurum Diyanet İşleri Başkanlığı Personeli ile Diyanet İşleri Başkanlığı'na bağlı olan taşra ve merkezlerde yer alan temsilcilikleridir. Manisa ili Diyanet İşleri Başkanlığı'nda görev yapan personelin; teşkilattaki görev süreleri, cinsiyetleri, eğitim düzeyleri ve unvanları referans alınarak yapılan anket çalışmamızda sorular sorulmuştur. Yaptığımız anket çalışması ile personelin İslami finans okur yazarlığı konusundaki bilgi ve farkındalıklarını ölçülerek bir veri ortaya konmuştur. Edindiğimiz bulgular görev süreleri, unvan, cinsiyet ve eğitim seviyelerindeki farklılık ile İslami okuryazarlığın ne düzeyde olduğu ve Katılım Bankalarının finansman çeşitlerine vukufiyetleri ile kendilerine gelen finansman çeşidi ve İslami Finans sorularına cevapları araştırılmıştır."
