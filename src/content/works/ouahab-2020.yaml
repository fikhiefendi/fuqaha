abstract: "ÖZET YEREL YATIRIM PROJELERİNİ FİNANSE ETMEDE ZEKAT SANDIĞININ ETKİSİ ÖRNEK OLARAK SETİF İLİ ARAŞTIRMA ÖZETİ Ameur OUAHAB Yüksek Lisans, İslam İktisadı ve Hukuku Tez Danışmanı: Dr. Öğr. Üyesi AbdelKader CHACHI Temmuz – 2020 / 138 + xiii Sayfat Vakıflar ve Din işleri Bakanlığı idaresinde zekat Sandığında Cezayir Tecrübesi, Zekat mallarının toplanması ve Ekonomik ve sosyolojik olarak toplum hizmetine yönlendirilmesinde bir ilden diğerine farklılık bulunsa bile önemli tecrübelerden sayılır. Ancak bu tecrübenin güncel olarak gerçekleştirmiş olduğu başarının değerlendirilmesi ve eksikliklerin giderilmesi maksadıyla, gerek sandiğin heykel düzenleme seviyesi ve gerekse tahsil yöntemleri ve finans araçları yönlerinden ileri bir seviyeye ulaşması için gerçekçi olarak değerlendirilmesinin yapılması gerekir. Bu sandık zekat mallarından hareketle toplum için Devletin Kullanmış olduğu iktisadi yönden gelişmede önemli finans araçlarından sayılır. Bu durum bu iş için yapmış olduğu bazı düzenlemeler aracılığıyla olmaktadır. Bu araştırma da Cezayir'in en önemli illerinden biri olan Sutayf ilinde Zekat sandığının İdare yöntemi ve gidişatı, ilde yerel yatırımı destekleme açısından ne derece ekonomik etkinliği olduğu ve kuruluşundan bu güne kadar kuruluş görevini yerine getirme ve gelişimde ve yerel yatırım projelerini finanse etmede Zekat sandığının etkisinin bilinmesi çalışması yapılmıştır. Bu araştırma dört kısımdan oluşmaktadır. Zekat'ın istılahi çerçevesi ve ekonomik boyutları, toplama ve dağıtım işlerinde Zekat müessesesinin önemi, sonra yerel yatırım'ın manası ve Zekat mallarının yatırımda kullanılmasının meşruluğu, daha sonra Cezayir Zekat sandığı müessesesinin tanıtımı, hedefleri ve çalışma organları, Sonra Sutayf ili yatırım projelerinin finanse edilmesinde Zekat sandığının etkisi, Meydan araştırması, toplama ve dağıtım yönünden faaliyet gelişimi için tüzük ve organlar. Yatırım projelerini teşvik ederek gelişimi desteklemekte bu sandığın tecrübesi üzerine ışık tutmaya çalışarak bir takım fiili sonuçlara ulaştığı gibi daha büyük ve derin bir şekilde hedeflerini gerçekleştirmek sonucuna ulaşmak amacıyla Sandığın görevini ifa ve çalışmalarında bazı eksik ve noksanlıkları giderecek tavsiyelerde bulunma sonucuna ulaşmıştır. Zekat sandığı Cezayirde gelişme ve yenileşme için teşvik ve geliştirmeyi hak eden örnek bir deneyimdir."
