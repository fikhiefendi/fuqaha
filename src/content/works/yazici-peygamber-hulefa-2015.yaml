abstract: "Bu tezde, Hz. Peygamber ve Hulefâ-yı Raşidîn devirlerinde özel bir kullanım alanına sahip olan âmil terimi ele alınmıştır. Bu kavram tarihsel yöntemle ele alınarak, bunların görevleri, atanma yöntemleri, yaptıkları hizmetler ve devlet yönetimindeki konumlarının tespit edilmesi amaçlanmıştır. Çalışma, Hz. Peygamber devrinde âmilliğin bir devlet kadrosu olduğunu, vergi tahsilinde çalışan memurlar ile Hz. Peygamber'in çeşitli bölgelere gönderdiği valilerin âmil olarak isimlendirildiğini göstermiştir. Bu kurum için Hz. Peygamber tarafından esaslar ve kurallar koyulduğu, talimat ve öğütlerle bir çalışma etiği oluşturulduğu belirlenmiştir. İlk dört halifenin de Hz. Peygamber'in uygulamasını geliştirerek sürdürdükleri ve söz konusu kurumun temel esaslarında bir değişikliğe gitmedikleri tespit edilmiştir."
