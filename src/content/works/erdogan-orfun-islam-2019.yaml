abstract: "İslam Hukuku, günümüz meselelerine uygulanması mümkün olmayan katı ve statik bir sistem değildir. Dolayısıyla dünya ve ahiret hayatının her safhasındaki sorulara cevap veren, değişen zamana ve mekâna göre dinamikliğini koruyabilen bir sistemdir. Hiç şüphesiz İslâm hukukunun ana kaynakları Kur'an ve Sünnet pek çok meseleyi çözüme kavuşturmakla beraber bazı meselelerde hükümlerin delalet etme biçimlerinde sarahat bulunmamaktadır. İslâm Hukukçuları ilk dönemden beri asli kaynaklara dayalı hükümleri daha anlaşılır kılmak için tali hükümleri istinbat etmek üzere özgün yöntemler geliştirmişlerdir. Bunların başında da örf ve âdetlerin hukuki süreçlerde üstlendiği rol yer almaktadır. Ayrıca İslâm, Cahiliye döneminin bütün örf ve âdetlerini ortadan kaldırmamıştır. İslâm inancına aykırı olmamak kaydıyla ya kabul etmiş ya da tashih etme yoluna gitmiştir. İslâm'da korunması gereken değerlerin başında ise hiç şüphesiz aile gelmektedir. Bu değerlerin korunması adına İslâm hukuku ailenin oluşum aşamaları, evlilik sözleşmesine konu olan karı-kocanın evlilik süresince yüklenecekleri hak ve sorumlulukları, hatta evlilik bağının sonlandırılması aşamasından sonraki süreçte bile tarafların karşılaşacakları sorunlara çözüm bularak karşılıklı hak ve hukuklarının korunmasını amaçlamıştır. Bu durumda İslâm hukukunun asli kaynakların yanı sıra toplumların sosyal hafızası olan örf ve âdetlerden hangi oranda bir etkiyle karşı karşıya olduğunun tespiti önemlidir. Mevcut durumuyla evlilik ve daha genel olarak aile ilişkileri örf ve âdetler dikkate alınmadan hazırlanan normatif hukuktan büyük ölçüde bağımsız hareket etmeye müsait görünmektedir. Biz“Örfün İslâm Aile Hukukuna Etkisi”isimli bu çalışmamızda İslâm aile hukukunun hangi konularda ve hangi oranlarda etkilendiğini misalleriyle izah etmeye çalıştık. Gördük ki aile, bu konudan en fazla etkilenen toplumsal yapıdır. Normatif kurallara rağmen kendi içindeki birçok meselede bu normlara karşı kapalı olduğunu uygulanma yoğunluklarına bakarak görebiliyoruz."
