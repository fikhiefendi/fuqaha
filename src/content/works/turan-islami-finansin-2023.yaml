abstract: "İslam ülkelerinin ikinci dünya savaşı sonrasında bağımsızlıklarını kazanmaları ile İslami finansın 1970'li yıllardan itibaren çağdaş anlamda başladığı gelişiminde politik ekonomi önemli bir rol oynamıştır. İslami finans dayandığı iktisadi temelleri üzerinde yükselirken hem geleneksel finansın araçlarından hem de gelişmekte olan dijital teknolojilerden yararlanmıştır. Özellikle 2008 küresel finansal kriz sonrası yaygınlaşan finansal teknolojiler tüm finans sektörünü dönüşüme uğratmaya başlamıştır. İslami finans sektörü ve İslami finansın ekonomi politiği gelişmekte olan finansal teknolojilerden yararlanarak bu alana yeni bir bakış açısı kazandırmıştır. Geleneksel finansal teknolojilere ek olarak blokzinciri ekonomisi üzerinde yükselen merkeziyetsiz finansın ortaya çıkışı tüm dünyaya sistemik bir öneri getirirken İslami finans için de yeni yollar açmıştır. Bu çalışmada İslami finansın ekonomi politiği çerçevesinde merkeziyetsiz finans uygulamaları, özellikle merkeziyetsiz otonom organizasyonlar işlenmektedir. İslami finansın, finansal teknolojilerin sunduğu imkânlar ile daha iyi bir hizmet alternatifi sunacağı düşünülmektedir. Çalışma, İslami finans ve merkeziyetsiz finans kesişiminde ortaya çıkan uygulama alanının“Merkeziyetsiz İslami Finans”kavramsallaştırmasıyla ele alınabileceğini önermektedir. Bu bağlamda İslam ülkelerinin Merkeziyetsiz İslami Finansı politik ekonomi çerçevesinde değerlendirebileceği aktarılmaktadır. İslam ülkelerinin girişimci devlet anlayışıyla İslami finansın ekonomi politiğinde merkeziyetsiz finans uygulamalarının gelişimine öncülük edebileceği savunulmaktadır. Bu yaklaşım dijitalleşmenin yükselişi karşısında İslami finansın daha katılımcı anlayışla birey, devlet ve toplum nezdinde etkin bir şekilde yaygınlaşmasını ve uygulanmasını mümkün kılabilecektir. Merkeziyetsiz İslami Finans, iktisadi temelleri, dijital olanakları ve dağıtık yönetişim anlayışıyla yeni bir tasavvur vaat etmektedir."
