abstract: "Bu tez son dönem İslâm âlimlerinden Ömer Nasuhi Bilmen'in ahkâm ayetleriyle ilgili görüşlerinin ne olduğunu ortaya çıkarmak ve meydana getirdiği tefsir eserindeki görüşlerin kendi içtihadının sonucu ortaya çıkmış görüşler olup olmadığını tespit etmek amacıyla hazırlanmıştır. Söz konusu tespit yapılırken ahkâm ayetlerinin tamamı değil örneklendirme metoduyla daha ziyade geçmişten bu yana üzerinde tartışmaların yoğunlaştırıldığı ayetler incelenmiştir. Ayetler incelenirken genel itibarıyla önce konuyla ilgili tarih içerisinde oluşmuş görüşlere yer verilmiş, sonra da Bilmen'in görüşlerine değinilmiştir. Daha sonra ise konuyla ilgili farklı yaklaşım tarzlarına, farklı fikirlere sahip araştırmacıların görüşlerine yer verilerek geçmiş ve günümüz arasında bir anlamda köprü görevi yapmış olan Bilmen'in fikrî olarak nerede durduğu tespit edilmeye çalışılmıştır.Araştırmamız dört bölümden oluşmaktadır. Giriş bölümü olarak hazırlanan birinci bölüm tezin konusu, amacı, yöntemi ile bilmenin hayatı ve eserlerine ilişkin açıklamalardan oluşmaktadır. İkinci bölümde temel ibadetlerden namaz, oruç, hac ve zekâtla ilgili ayetlerin açıklanması ve incelenmesine yer verilmiştir. Üçüncü bölüm ise aile hukuku ve ceza hukukuyla ilgili ayetlerin incelenmesine ayrılmıştır. Son bölümde ise diğer bazı ayetlerin tahlili yapılmıştır."
