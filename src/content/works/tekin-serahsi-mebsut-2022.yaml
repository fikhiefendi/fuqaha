abstract: "Bu çalışma, Hanefî mezhebinin önde gelen âlimlerinden biri olan Şemsu'l-eimme Serahsî'nin (v. 483/1090) el-Mebsût isimli eserinde aile hukukuna ilişkin olarak İmam Şâfiî'ye yönelik atıf ve tenkitlerini ihtiva etmektedir. Bu atıf ve tenkitlerin incelenmesi; fukahânın meselelere yaklaşırken fıkhın aslî ve ferî kaynaklarından nasıl yararlandıklarını tahlil etmesi, usûl ve metodlarının farklılıklarını ortaya koyması bakımından önem arz etmektedir. Tezimiz; giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmında çalışmanın amaç, yöntem ve kaynaklarına değindikten sonra Serahsî ve Şâfiî'nin hayatlarına, fıkıh ilmindeki konumlarına ve eserlerine temas ettik. Birinci bölümde nikâh bahsindeki atıfları, ikinci bölümde ise evliliğin neticeleri ve son bulması ile ilgili atıfları ele aldık. Söz konusu atıfların incelenmesi sonucunda ulaştığımız bir takım neticelere de sonuç kısmında yer verdik."
