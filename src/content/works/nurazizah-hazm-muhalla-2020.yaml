abstract: "İbn Hazm hem İslam hem de Batı dünyasında oldukça iyi tanınan önde gelen Müslüman ilim adamlarından biridir. Endülüs döneminde yaşayan İbn Hazm'ın İslam hukukunda Zâhirîlik düşüncesini savunmasından dolayı diğer mezhep imamları gibi önemli bir konumda bulunduğu kabul edilir. İbn Hazm, naslardan hüküm elde ederken zâhirî bir metot kullanmakta olup onun kullandığı bu yöntem literal manayı benimseme olarak ifade edilir. Fıkhın yanı sıra İbn Hazm hadis, dil ve edebiyat, kelam, tarih gibi alanlarda birçok eser telif etmiştir. Bu çalışmada İbn Hazm'ın el-Muhallâ adlı eseri baz alınarak, aile hukuku bağlamında İmam Şâfiî'ye nispet ettiği görüşlerin isabetli olup olmadığının tespiti konu edinilmiştir. Giriş ve iki bölümden oluşan bu çalışmanın giriş bölümünü araştırmanın konusu, amacı, kaynakları ve yöntemini oluşturmaktadır. Çalışmanın birinci bölümünde İbn Hazm ile ilgili genel bilgiler aktarıldıktan sonra onun ilim hayatı, öğrencileri ve eserlerinden bahsedilmektedir. İkinci bölümde ise İbn Hazm'ın el-Muhallâ adlı eserinde aile hukuku ile ilgili İmam Şâfiî'ye nispet ettiği görüşler Şâfiî mezhebi kaynaklarına göre isabetle nakledilip nakledilmediği değerlendirilmiştir. İbn Hazm'ın mezkur eserinde aile hukuku ile ilgili İmam Şâfiî'ye atfedilen 117 görüşten 111 tanesi isabetli olup 6 görüş hatalı olarak nakledilmiştir. Hatalı olan görüşler Nikâh (3), Mehir (1), Zıhâr (1), Nafaka (1) konularında yer almaktadır."
