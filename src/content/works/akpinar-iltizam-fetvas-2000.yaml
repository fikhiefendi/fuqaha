abstract: "ÖZET OSMANLI ŞEYHÜLİSLAM FETVALARINDA İLTİZAM Akpınar, Kürşad Urungu Yüksek Lisans, Tarih Bölümü Tez Yöneticisi: Dr. Evgenia Kermeli September 2000 Gelir toplama işinin belli bir süre için bir kişiye belirlenmiş bir para bedeli karşılığında verilmesi demek olan iltizam, Osmanlı maliyesinin başlıca gelir toplama yöntemlerinden birisiydi. Onaltıncı yüzyıldan sonra timar sisteminin önemini yitirmesi ile iltizam yaygınlaştı. Devletin yanısıra timar, zeamet, hass ve vakıf gelirlerine mutasarrıf olan bireyler de gelirlerini kendileri toplamak yerine iltizama vermeyi karlı buluyorlardı. Bu çalışmada, şeyhülislam fetvalarında iltizamın nasıl ele alındığı incelenmektedir. Kullanılan fetvaların çoğu, 1674-1730 dönemini kapsayan ve fetvahanece en“muteber”addedilen şu dört mecmuadan alınmıştır: Fetava-yı Ali, Feyziyye, Abdurrahim ve Behcetü'l- Feîava. Fetvalar iltizamın hukuki yönlerini anlamak için önemli bir kaynaktırlar. İltizamın fetva mecmualarında 1670lerden sonra yer almaya başlamış olması, onun artan önemini gösterir.“îctihadKapısı”nın kapandığı bir dönemde, iltizam gibi bir“yeni”olguyu İslam Hukuku'nun klasik çerçevesine oturtmada şeyhülislam fetvaları önemli bir rol oynamıştır. Bu fetvalarda mültezimlerin yükümlülükleri ve iltizamdan edecekleri kar gibi konularda, uygulamadan farklı görüşlerin savunulduğu görülmektedir. Şeyhülislamlar fetvalarında mültezimlerin suistimallerini önlemeye çalışırken devletin ali menfaatlerini koruma amacı gütmüşlerdir.“Adalet dairesi”anlayışıyla tam bir uyum içinde olan bu yaklaşımlarıyla şeyhülislamlar, her kesime hakkım teslim eden, haksızlığa ve zulme karşı çıkan bir ahlaki tavrı elden bırakmadan yaşadıkları devrin gerçeklerini pratik bir anlayışla ele almışlardır."
