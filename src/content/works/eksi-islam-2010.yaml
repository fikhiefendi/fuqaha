abstract: "Hayat, sağlık, vücut bütünlüğü değerlerine yönelik olan ve inceleme konumuzu oluşturan tıbbi müdahalelerle öncelikle kişilerin hastalıklarını teşhis ve tedavi etmek, bu rahatsızlıklardan kaynaklanan acıları hafifletmek veya kişileri hastalıklardan korumak amaçlanmaktadır. Ancak yapılacak işlemlerin tıbbi müdahale olarak isimlendirilebilmesi için müdahalenin yetkili kişiler tarafından, tıp ilminin kabul görmüş kural ve esaslarına uygun olarak gerçekleştirilmesi gerekir. Bu nitelikler aynı zamanda yapılan müdahaleye meşruluk kazandırmaktadır.Doktor ile hastası arasında, doktorun sorumluluğuna esas teşkil eden iki ayrı hukuki ilişkiden söz edilebilir. Bunlar, sözleşme ve haksız fiil ilişkisidir. Doktor, hastayı, aralarında yaptıkları tedavi sözleşmesine istinaden tedavi ederse sözleşmeye dayanan bir sorumluluk sözkonusudur.Tıbbi müdahaleler, hukuka uygun olduğunda doktorun sorumluluğuna gidilmez. Fakat müdahale hukuka aykırı nitelik taşırsa doktor sorumlu tutulur. Doktorun tıbbi müdahaleden kaynaklanan sorumluluğu, ihlal edilen hakkın çeşidine göre değişir. Kusurlu olduğu ortaya çıkan doktorun müdahalesi, hastanın mal varlığında eksilmeye neden olmuş ise zararı telafi edici tazminat ödemekle yükümlü olur. Hastanın kişilik haklarını ihlal etmiş ise müeyyide doktorun kusuruna göre değişir. Kusur ağır ise hem cezai hem de medeni mesuliyet söz konusudur. Eğer kusur, ihmal ve dikkatsizlik şeklinde ise yalnız medeni mesuliyet söz konusu olur."
