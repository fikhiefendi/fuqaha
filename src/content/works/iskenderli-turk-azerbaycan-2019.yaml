abstract: "Bu çalışmanın esas amacı evlat edinmenin şartlarını, Türk ve Azerbaycan hukuku bakımından ele alınmaktır. Çalışmamızda evlat edinmenin şartları Türk Medeni Kanunu, Azerbaycan Aile Mecellesi, uluslararası sözleşmeler ve her iki ülkenin kanunları çerçevesinde ele alınmış, her iki hukukun benzer ve farklı yönleri değerlendirilmiştir."
