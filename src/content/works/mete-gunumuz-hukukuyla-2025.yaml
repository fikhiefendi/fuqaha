abstract: "GÜNÜMÜZ HUKUKUYLA MUKAYESELİ OLARAK İSLAM HUKUKUNDA İHKAK-I HAK Rukiye METE Erzincan Binali Yıldırım Üniversitesi Sosyal Bilimler Enstitüsü Temel İslam Bilimleri Anabilim Dalı Yüksek Lisans Tezi, Temmuz 2025 Danışman: Doç. Dr. Muhammed Fatih TURAN ÖZET İhkak-ı hak, şahısların yetkili makamlara müracaat etmeden, bizzat kendi imkânları ile iddia ettikleri hakkı elde etme çabasıdır. Bu tür eylemler, otoritenin zaafa uğramasına ve adaletin zedelenmesine sebep olduğu için, ilahi ve beşeri kaynaklı hukuk sistemleri tarafından genellikle yasaklanmıştır. Temel haklara yönelik bir ihlal söz konusu olduğunda, resmi bir makama müracaat ederek anlaşmazlıkların hukuk yoluyla çözülmesi, esas ilke olarak benimsenmiştir. İhkak-ı hak, 756 sayılı mülga Türk Ceza Kanunu'nda müstakil bir suç tipi olarak düzenlenmiştir. Meşru müdafaa ve zaruret halleri dışındaki durumlarda bu eylem, hukuka aykırı kabul edilmiştir. 5237 sayılı yürürlükteki Türk Ceza Kanunu'nda ise ihkak-ı hak, doğrudan bir suç olarak değil; hırsızlık, dolandırıcılık ve yağma gibi suçlara ilişkin olarak, hukuki bir ilişkiye dayalı alacağın tahsili durumunda cezada indirimi gerektiren bir unsur şeklinde değerlendirilmiştir. İslam hukukunda da genel ilke, hakkın devletin yetkili organları aracılığı ile elde edilmesidir. Ancak devlet otoritesinin zayıfladığı, hakkın kaybedilme ihtimalinin bulunduğu istisnai durumlarda, kişinin kendi hakkını bizzat elde etmesi meşru görülmüştür."
