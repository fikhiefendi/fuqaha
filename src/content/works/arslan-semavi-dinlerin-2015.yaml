abstract: "İstanbul, Bizans İmparatorluğu döneminde Hristiyanlığın (Ortodoksluk) ardından Osmanlı İmparatorluğu döneminde (özellikle Hilâfet açısından) İslam Dini'nin merkezi olmuştur. Safa Yeprem“Türk Cami Mûsıkîsiyle Mukâyeseli Olarak İstanbul Gayr-i Müslimlerinde Mâbet Mûsıkîsi”isimli doktora tezinde Kaside, Dua, Na't, Mevlid ve Miraciye İlâhileri arasında“işlevsel manada”bir takım benzerlik ve farklar tespit etmiştir. Çalışma, bu tezin Mevlid bölümünden hareketle,“Kutlu Doğum”ve“Doğuş Bayramı”İlâhilerini oluşturan müzikal hücrelerin birbirlerine ne dereceye kadar benzerlik ve farklar ortaya koyduklarını tespit etme gâyesiyle hazırlanmıştır. İlâhiler, Alman Latin Katolik Kilisesi, Keldânî Katolik Kilisesi, Süryânî Ortodoks Kilisesi, Rum Ortodoks Kilisesi, Ermeni Ortodoks Kilisesi, Presbiteryen Kilisesi, Protestan Kilisesi ve Sünnî Hanefî İslam Cemaatlerinden derlenmiştir. Veriler biçimsel, makamsal, güfte, icrâ, çalgı kullanımı, notasyon ve Peygamberin Doğuşu ile ilgili anlayış özelliklerine göre tasnif edilerek açıklanmış, bulgular kendi içlerinde frekans tablolarına ve yüzdelik dilimlere dönüştürülerek grafikler halinde analiz edilip istatistiksel olarak karşılaştırılmıştır. Ulaşılan ilâhilerin çoğu ilk kez derlendiği için ses ve mümkün olanlarda görüntü kayıtları da çalışmada yer almıştır."
