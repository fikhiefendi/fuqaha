abstract: "Tezimize“İnsanlığın Gelişiminde Fıkıh Kaidelerinin Rolü”başlığını verdik. Çünkü, ister uhrevi, ister dünyevi olsun, insan yaşamıyla ilgili pek çok hükme dair fıkıh kaideleri, insanlığın gelişiminde önemli rol oynamıştır. Bu konuyu seçmemin sebebi, yaşamın çeşitli alanlarındaki fıkıh kaidelerinin önemi ve bunların beşeri gerçekle uyumudur. Fıkıh kaideleri pek çoktur. Ben, bunlardan insanlığın gelişiminde rolu olanları seçtim. Bu araştırmada, fıkıh kaideleri ve kaideler ile beşeri gelişimin tanımını ve fıkıh kaideleri ile insanlığın gelişimi arasındaki ilişkiyi anlattım. Araştırmanın bölümlerinde nefse hakim olma ve onu kontrol etme yönünden insanlığın olumlu gelişimine katkı sağlayan fıkıh kaidelerini ele aldım. Ayrıca, dinin ve insanların yararını gözeten bir yönetimle kendi kendini yönetmeye kadir bir kuşağı meydadan getirmeye katkı yapacak biçimde bireylerde liderlik yeteneklerinin geliştirilmesi konusuna giren kaideleri de işledim. Son bölümde ise eğitim bakımından bireylerin gelişime etki eden kaidelere değindim. Bu çalışmanın sonunda fıkıh kaidelerinin, insanların işleriyle ilgili her şeyi kapsayan İslam fıkhının büyüklüğünü ortaya koyan bir şekilde insanlığın gelişmesine katkı sağladığı sonucuna ulaştım."
