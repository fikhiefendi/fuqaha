abstract: "Bu çalışmada Hanefî usulünde önemli bir yere sahip olan ve birçok konuda kendisinden sonra gelen İslâm bilginlerine kaynak eser olma niteliği taşıyan Fahru'l-İslâm Pezdevî'nin yazdığı Kenzu'l-vüsûl ilâ mâ'rifeti'l-usûl adlı eserin son kısmında geniş yer verilmiş olan“ehliyet”bahsi ele alınmıştır. Bununla birlikte Pezdevî'den önce yaşamış olan Debûsî ile Pezdevî'nin çağdaşı olan Serahsî'nin ehliyet konusundaki açıklamalara da yer verilmiş ve Pezdevî ile mukayese edilmiştir. Ayrıca Pezdevî'den sonra yaşamış olan usûlcülerin, ehliyet konusunda Pezdevî'den etkilenmiş olduğu yönler de çalışmamız içerisinde yer almaktadır. Öte yandan Pezdevî'nin ehliyet ile ilgili izahları yanında tezimizin sınırları içerisinde, konunun anlaşılmasına yardımcı olması açısından fürû fıkıh ile alakalı açıklamalara da yer verilmiştir. Mezhep içi ihtilaflarda çoğunlukla Ebû Hanîfe'nin görüşlerine bağlı kalan Pezdevî'nin, İmameyn'e ait olup ve kabul etmediği görüşlerin neden makbul olmadığına dair verdiği bilgiler de ortaya konulmuştur. Bu çalışmamızın, ehliyet nazariyesinin gelişimi konusunda fıkıh usûlü alanında yapılan çalışmalara küçük de olsa bir katkı sağlamasını ümit ediyoruz."
