abstract: "İslam hukuku talâk konusunda tek taraflı irade beyanıyla evliliği sonaerdirme hakkını öncelikle erkeğe vermiştir. Kadına da bedel mukabili karşılıklırıza ile (muhâlea) ve hâkim kararıyla (tefrûk) evliliği sona erdirme hakkıtanımıştır. Ancak kadının tefrûk ve muhâlea yollarına başvurarak evliliği sonaerdirme imkanı olsa da erkeğin rızasına ve mahkemeye başvurmaksızın kendiirade beyanıyla boşanma yetkisine Kur'an ve sünnette sabit olduğu üzere tefvûz-italâk yöntemiyle sahip olmaktadır.Kadın tefvûz yöntemiyle boşanma yetkisine nikah akdinde bu yetkininkendisinde olmasını şart koşarak veya evliliğin sonraki zamanlarında kocasınıntalak hakkını ona vermesiyle de elde edebilmektedir. Kadın tefvûz yöntemiyle eldeettiği bu hakkını kendisi kullanabildiği gibi, üçüncü bir şahsa verilmesini deisteyebilir ve bu yetkinin üçüncü bir şahıs tarafından mahkemenin denetimi vearacılığı ile de kullanılmasını şart koşabilir.Kadın tefvûz yöntemiyle boşama yetkisine sahip olmakla birlikte bu erkeğinboşama hakkını etkilememekte, erkek bu yöntemle karısını, onu boşamaya ortaketmiş olmaktadır.Boşama konusunda kadın ile erkeği eşit konuma getiren tefvûz-i talâkuygulamada pek az görülmüştür. Erkeğin yetki paylaşımını benimseyebilmesi vekadının da bu hakkını bilinçli kullanabilmesi için tefvûz nikah akdi ile doğan birprosedüre bağlanmalı, hayata geçirilebilmesi için çalışılmalı ve uygulanabilirliğiortaya konmalıdır."
