abstract: "Muhtasar İmam Baybars, taharet bölümünden başlayıp feraiz bölümüne kadar Hanefî fıkhının tüm kitap ve bablarını bir araya getirmiş ve ilk dönem alimlerinin büyük kısmının görüşlerini toplamıştır. Delilin yakın olduğu konuya göre görüşleri zayıf veya sahih kabul ettiği veya tercihte bulunduğu bu eserinde, Kudurî'nin muhtasarını almış ve problemlerini de açıklamıştır. İmam Baybars, Abbasi halifeleri nezdinde güvenilir bir kişilik olup, Halife Mustansır'ın kendisine Bağdat kādılkudâtlık görevi teklifini kabul etmemiştir. Fakih, verâ sahibi ve güzel ahlaklı biriydi. İslami ilimlerde ileri gitmiş, fıkıh, fıkıh usulü ve akide alanında ön planda biri olmasına rağmen, maalesef hakkında yeterli tanıtım yapılmadığı için hak ettiği itibarı görememiştir. Bu çalışmada, 'el-Muhtasarü'l Havî li'l-Beyâni'ş-Şâfî' adlı el yazması eserin 'İkrâr' babından 'Me'âkil' babına kadar olan kısmın tahkik kurallarına uygun, ilmi ve titiz bir tahkikinin yapılması hedeflenmiştir. Bunun yanında, soyu Maveraünnehir tarafında bir Türk kabileye mensup olan müellifin ismi ve nispeti, yazma eserin müellifine olan nispeti teracim kitaplarından ve çalışmada kullanılan eserin iki nüshasından yararlanılarak tespit edilmeye çalışılmıştır. Bu konuda her iki nüshada da 'Alim, allame emir ve imam Baybars b. Abdullah en-Nebevî'nin telif ettiği' şeklinde ifade kullanılmıştır. Çalışma neticesinde elde edilen sonuçlar arasında şunlar zikredilebilir: Bahse konu müellifin bu çalışmanın da ele aldığı kitabı, akidede Tahavî'nin şerhi olan 'en-Nurü'l-Lâmi' ve'l-Burhâni's-Sâti' adlı tahkik edilmiş bir eseri ve fıkıhta tahkik edilmemiş 'Mukaddimetü's-Salat' adlı kitabı gibi birçok eserinin olduğu ortaya konmuştur. Ayrıca onun başta Kudurî'nin muhtasarından ve Semerkandî'nin Tühfetü'l-Fukaha adlı eserinden çokça yararlanıp alıntı yaptığı, daha sonra da Serahsî'nin el-Mebsut adlı eseri, İmam İsbîcâbî'nin Muhtasar İmam Tahavî'sinden ve diğer birçok kaynak ve mezhep kitaplarından istifade ettiği ve bunlar arasında tercihlerde de bulunduğu tespit edilmiştir. Bununla beraber bazen de müellifin bazı meselelerde mevcut ihtilafı zikretmekle yetinip bir tercihte bulunmadığı görülmektedir. İstidlal metodu olarak da istihsanı hadislere daha çok tercih ettiği de bulunmuştur. 17"
