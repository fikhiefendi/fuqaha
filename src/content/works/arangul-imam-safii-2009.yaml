abstract: "İmam Şâfiî'nin Kitâbu İhtilâfi Mâlik ve'ş-Şâfiî adlı eserinde İmam Mâlik'e yönelttiği eleştirileri inceleme konusu yaptığımız çalışmamızda bu iki imamın genel olarak hangi konularda ihtilaf ettiğini ve bu ihtilafların (asıl) sebeplerini tespit etmeye çalıştık. Aslında Mâlik'in talebelerinden biri olan ve bu eseri hocasının vefatından yaklaşık yirmi yıl sonra telif eden İmam Şâfiî'nin eleştirilerinde ne kadar haklı olduğu, neden böyle bir kitap yazmaya gerek duyduğu da cevap vermeye çalıştığımız sorular arasındadır.Şâfiî'nin eleştirilerini değerlendirmek amacıyla Mâlik'in Muvatta`ını ve Mâlik'in görüşlerinin rivayet edildiği diğer bir kitap olan Müdevvene'yi incelediğimizde, iki imam arasındaki ihtilafın her zaman Şâfiî'nin söylediği gibi olmadığını, Şâfiî'nin Mâlik'in rivayet ve görüşlerini her zaman bir bütün olarak değerlendirmediğini gördük. Mâlik'in görüşleri kadar, Şâfiî'nin Mâlik'in görüşlerine yaptığı yorumların da eleştirilerin yönünü belirlediği sonucuna ulaştık. Bu sonuca ulaşmamızda Mâlikî literatür ve özellikle de bazı Muvatta` şerhleri etkili oldu.Şâfiî'nin Mâlik'i eleştirdiği konulardan değerlendirmeye tabi tuttuğumuz örneklerin Kitâbu İhtilâfi Mâlik ve'ş-Şâfiî'nin yanında Kur'an, sünnet, amel, haber-i vâhid, sahâbî kavli ve kıyas gibi delillerin bu iki imamın usulündeki yerinin ve birbirleriyle olan ilişkilerinin anlaşılmasına da bir nebze olsun katkıda bulunacağı kanaatindeyiz."
