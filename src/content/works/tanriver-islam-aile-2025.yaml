abstract: "Aile, İslâm toplumunda toplumsal düzenin temel taşı olarak kabul edilmiştir. Eşler arasındaki sevgi, merhamet ve adalet ilkeleri, bireylerin onurunu korumada kritik bir rol oynamaktadır. Aynı şekilde çocukların haklarının korunması, onların eğitim ve terbiyesine yönelik hükümlerin detaylı bir şekilde ele alınması, İslâm hukukunun insan onuruna verdiği değerin somut göstergelerindendir. İslâm hukuku, insan onurunu yaratılıştan itibaren kutsal bir değer olarak kabul etmekte ve bunu hukuki düzenlemelerle koruma altına almaktadır. Kur'an ve Sünnet'in rehberliğinde, bireylerin iradesine saygı, eşlerin hak ve sorumluluklarının dengesi, nafaka ve mehir gibi düzenlemelerle ekonomik güvence sağlama gibi konular, insan onurunun korunmasını amaçlamaktadır. Özellikle evlilik akdinin karşılıklı rızaya dayanması, bireyin haklarına saygıyı ifade ederken; boşanma sürecinde getirilen kurallar, tarafların maddi ve manevi olarak korunmasını hedefler. Sonuç olarak, İslâm aile hukuku, insan onurunu koruma ilkesini merkeze alarak aile birliğini sağlam bir temele oturtmakta ve bireylerin haklarını adalet ve merhamet ekseninde korumaktadır. Bu çerçevede, insan onuruna verilen önem, İslâm hukukunun toplumsal düzeni ve bireysel hakları nasıl şekillendirdiğini göstermektedir. Bu çalışma, İslâm aile hukukunda insan onurunun korunmasının ne ölçüde dikkate alındığını incelemektedir. Araştırmanın temel amacı, İslâm hukuku çerçevesinde insan onurunun, hukuki ve ahlaki hükümlerdeki yansımalarını ortaya koymaktır. Çalışmada, insan onuru kavramının İslâmi perspektifte nasıl ele alındığı, evlilik öncesi süreçten başlayarak evlilik akdi, evlilik süreci ve boşanma sonrası aşamalarda incelenmiştir. Araştırma, klasik İslâm hukuku kaynakları ve çağdaş çalışmaları bir araya getirerek, İslâm aile hukukunun insan hakları ile uyumlu yapısını değerlendirmektedir."
