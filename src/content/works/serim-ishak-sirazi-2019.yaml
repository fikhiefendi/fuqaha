abstract: "İslam hukuku, bünyesinde barındırdığı özler itibariyle içtihada müsait bir yapı arzetmektedir. Fakihlerin nassları anlama ve kullanmadaki metod farklılıkları ile oluşan farklı içtihadların derlenmesi ile hilafiyyat literatürü meydana gelmiştir. Ebû İshâk eş-Şîrâzi'nin en-Nüket isimli eseri İmam Şâfi'î ile Ebû Hanîfe arasındaki ictihad farklılıklarını kaleme alan bir eserdir. Tezde, Şîrâzî'nin nikâh ve talak konularında Ebû Hanîfe'ye nisbet ettiği meseleler, Hanefî kaynaklarından kontrol edilmiş, nisbetin doğruluğu tesbit edilmiştir. Tezin giriş bölümünde Şîrâzi'nin hayatı ve eserleri hakkında kısa bilgilere yer verildi. Birinci bölümde, en-Nüket'te nikâh bölümüyle ilgili olarak zikredilen 52 mesele Hanefi kaynaklarındaki yeri açısından incelenmiştir. İkinci bölümünde talak bölümüyle ilgili olarak zikredilen 34 meseleye yer verilmiştir. Toplamda 86 meselenin incelendiği tezin sonuç bölümünde Ebû Hanîfe'ye yapılan nisbetlern doğruluk derecesi istatiksel veri olarak eklenmiştir. Tezin sonucunda kaynaklarda rastlayamadığımız bir mesele hariç tutulduğunda Şîrâzî'nin Ebû Hanîfe'ye atfettiği görüşlerin tamamında nisbetin isabetli olduğu, Hanefiler için güvenilir bir kaynak olduğu sonucuna ulaşılmıştır."
