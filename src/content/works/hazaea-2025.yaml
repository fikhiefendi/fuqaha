abstract: "Bu araştırma, genel olarak fakihlerin ve özellikle de Kadi el-Umerani'nin fıkhi tercih ve seçimlerinde kullanılan terminoloji ve metodolojiyi açıklamayı amaçlamaktadır. Bu amaçla, fıkıh alimlerinin görüşleri ile Kadi el- Umerani'nin görüşleri, özellikle de“ El-Müctehid'in Başlangıcı ve İhtiyatlı Kişinin Sonu”adlı eserinde yer alan görüşleri karşılaştırmalı olarak incelenmiştir. Yemen'in en önemli çağdaş alimlerinden biri olan Kadi Muhammed bin İsmail el-Umerani'nin kişiliği, hocaları, bilimsel hayatı ve genel olarak fıkhi tercihleri, özellikle de nikah babı üzerindeki görüşleri, İbn Rüşd'ün“ El-Müctehid'in Başlangıcı ve İhtiyatlı Kişinin Sonu”eserine yaptığı yorumlarla birlikte incelenmiştir. Bu çalışma, Kadi el-Umerani'nin görüşlerini diğer fıkıh alimlerinin görüşleri ile karşılaştırarak, bu farklılıkların nedenlerini ve özelliklerini ortaya koymayı hedeflemektedir. Aynı zamanda bu çalışma, nikah kavramı, geçerliliğinin şartları, velininnitelikleri, şahitliğin etkileri, nikahın yerleri ve Kadi el-Umerani'ye göreharam sayılan evlilikler gibi konularıda ele almaktadır ve araştırmadakisorunlara cevaplar vermektedir. Bu araştırma, İbn Rüşd ve Kadi el-Umerani'nin hayatlarını açıklamak içinbetimleyici yöntemi kullanmakta, fıkhi tercihleri çıkarmak için tümevarımyöntemini kullanmakta ve Kadi el-Umerani'nin tercih ve yorumlarındakullandığı yöntemi ortaya çıkarmak için analiz ve çıkarım yönteminikullanmaktadır. Bu çalışma, Kadi el-Umerani'nin bilimsel değerini ortaya koyarak, onuntaklitçi veya bağnaz olmayan müctehid bir alim olduğunu, özellikle fıkıh, hadis ve tarih alanlarında geniş bir bilgiye sahip olduğunu ve şer'ihükümleri çağdaş koşullara uygun hale getirerek birçok tarihsel ve gerçekçimeseleyi şer'i meselelerle birleştiren bir katkı sağladığını göstermiştir. Aynızamanda, öğrencilere ve alimlere fıkıh, tercih ve tercihlerde bulunma konusunda araştırma yapma becerisi kazandıran bir yöntemin temellerini, atmıştır."
