abstract: "Bu çalışma, önemli bir konuyu, tüketici davranışının rasyonelleştirilmesini, bilişsel eğilim ve davranışsal dürtme teorisini kullanarak ele almayı amaçlamaktadır. Bilişsel eğilimler, bir insanın özellikle bilinçaltında olan davranışlarını bilimsel yol ile açıklayan sezgisel bilimden ve bir diğer taraftan, bazıları önceki deneyimlerden ve çevreden dolayı stabil olan, bazıları ise anlık olarak karar verme anındaki motivasyondan kaynaklanan bilişsel eğilimlerden dallanarak gelişmiştir. Bu çalışma, tüketici davranışını rasyonelleştirmek için İslami yasal kontrollerle disipline edilen bu bilimden İslam ekonomisinin nasıl olumlu bir şekilde yararlanabileceğini göstermektedir. Çalışma, bazı markalarda uygulama yapmaktadır. Çalışmanın objektiflerine ulaşmak için, bilişsel eğilimlerin ne olduğunu, onun tüketici davranışları üzerindeki etkisini ve tüketici davranışını nasıl geliştirebileceğimizi anlamak gerekmektedir. Çalışma, temel bilişsel eğilim türlerini ve bunların davranışsal tutumlar üzerindeki etkilerini, uygulanan vakaların her biri için açıklamalarıyla birlikte sunmuş ve en önemli sonuçları gözden geçirmiştir. Çalışmada ayrıca, geleneksel ekonomi ve İslam ekonomisinde müşterinin bilinçli ve bilinçsiz davranışları ve bu davranışların sezgisel yöntemlerle açıklanması da incelenmiştir. Çalışma, davranışsal dürtme teorisi olan bilişsel eğilimleri makroekonomiye uygulamanın bir yöntemini ve bunların dürtme birimlerini kullanarak tüketici davranışını rasyonelleştirmek için nasıl kullanılacağını açıklamıştır. Son olarak marka endüstrisine uygulanarak mikroekonomik düzeyde nasıl kullanılacağı ve bilişsel eğilimlerin kullanımına ilişkin yasal ve İslami sınırlar belirlenerek çalışma sonuçlandırılmıştır."
