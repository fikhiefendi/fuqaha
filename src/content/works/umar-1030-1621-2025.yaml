abstract: "Şer'iyye sicilleri şehir tarihi açısından önemli birincil elden kaynaklardır. Bu yüzden çevirisi yapılan 168 numaralı Ayıntab Şer'iyye sicilinin Gaziantep şehrinin tarihine ışık tutacağı umulmaktadır. Tez olarak çalışılan bu sicil üç ana bölümden oluşmaktadır. Giriş bölümünde kısaca Gaziantep şehri ve tarihinden kısaca bahsedilmiştir. Bu şehir Ayıntab ismiyle ya da daha eski isimleriyle (Dülük) tarih sayfalarına geçtiği dönemlerden itibaren başlanılarak Roma-Pers, İslam Devletleri, Selçuklular, Anadolu Beylikleri, Osmanlı İmparatorluğu olmak üzere kronolojik sıra takip edilerek araştırması yapılmıştır. Yine bu bölümde Osmanlı Hukuk sistemi ve kadılardan bahsedilmiştir. Mahkemede görev yapan memurların ismi, sicile giren belge türleri gibi konulardan bahsedilmiştir. Birinci bölümde bu sicilin içeriğinden hareketle Gaziantep hakkında elde edilen bilgilerin değerlendirilmesi yapılmıştır. Bu belgelerde geçen ferman, berat, buyrultulardaki isimlerden bahsedilerek şehrin yönetici sınıfı, ticaret, yerleşim, ve sosyal hayatın gelişimi tespit edilmiştir. Belgelerde geçen mahalle, köy, kaza, nahiye gibi yerleşim birimleri tespit edilmiştir. Ayıntab şehir merkezindeki çarşılardan bahsedilmiştir. Ve son olarak davaların konuları belirlenip istatiksel olarak grafiğe tabi tutulmuştur. Son kısım olan İkinci bölümde ise bu defterin transkripsiyonu ve metin özetleri yer almaktadır."
