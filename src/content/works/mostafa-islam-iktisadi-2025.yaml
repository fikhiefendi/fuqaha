abstract: "Bu çalışma, Türkiye bağlamında döviz dalgalanmalarının borç ilişkileri üzerindeki etkisini İslam ekonomisi perspektifinden incelemeyi amaçlamaktadır. Öncelikli odak noktası, paranın ekonomik sistemdeki rolü ve değeri ile bu değişimlerin zaman içinde bireysel ve kurumsal finansal sözleşmeler üzerindeki etkisidir. Çalışma üç bölümden oluşmaktadır. Tezin ilk bölümü paranın kavramsal, tarihsel ve teorik temellerini ele almakta; ayrıca parasal değer değişimlerinin detaylı bir analizini sunmaktadır. İkinci bölümde TÜRKİYE'DE DÖVİZ KURU DALGALANMALARI VE BORÇLAR ÜZERİNE ETKİLERİ: BİR VAKA İNCELEMESİ. Üçüncü bölümde DİJİTAL EKONOMİNİN PARA VE BORÇLAR ÜZERİNE ETKİLERİ. Bu tez, İslam ekonomisinin ilkeleri doğrultusunda döviz dalgalanmalarına sürdürülebilir çözümler geliştirmeyi ve bu alana teorik olarak katkıda bulunmayı amaçlamaktadır."
