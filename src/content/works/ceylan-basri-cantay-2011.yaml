abstract: "?H. Basri ÇANTAY'ın `Kur'ân-ı Hakîm ve Meâl-i Kerîm' Adlı Meâli ile Mustafa İSLAMOĞLU'nun `Hayat Kitabı Kur'ân' Meâli Üzerine Mukâyeseli Bir İnceleme? konulu bu çalışmada, Cumhuriyet'in ilk ve son dönemlerinde, meâl-tefsir sahasında, kaleme alınmış iki çalışmada mukâyeseler yapılmıştır.Çalışmamız iki ana bölümden oluşmaktadır.Birinci Bölüm'de, Hasan Basri Çantay'ın hayatı ve eserleri, Hasan Basri Çantay'ın meâl-tefsir çalışmasının değerlendirilmesi üzerinde durulmuştur.İkinci Bölüm'de, Mustafa İslamoğlu'nun hayatı ve eserleri, Mustafa İslamoğlu'nun meâl-tefsir çalışmasının değerlendirilmesi ele alınmıştır.Sonuç Bölümü'nde ise, incelediğimiz iki meâl-tefsir çalışmasına dair genel bir değerlendirme yapılmıştır."
