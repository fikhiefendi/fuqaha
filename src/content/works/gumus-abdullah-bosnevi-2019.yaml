abstract: "17. yy.'ın önemli Fusūs şârihlerinden ve sufi şairlerinden olan Abdullah Bosnevî'ye nispet edilen Makāsıd-ı Envâr-ı Gaybiyye ve Masâid-i Ervâh-ı Tayyibe isimli risâle üzerine yapılan çalışma ile risâlenin muhteviyatı incelenmektedir. Risâle, her ne kadar Abdullah Bosnevî'ye nispet edilse de araştırmamız sırasında risâlenin Ali b. Siyâvuş'a ait olan Makāsıd-ı Nâciye Fi'l-Mebde' ve'l-Meâş ve'l-Meâd isimli eserin tercümesi olduğunu tespit ettik. Bir giriş, üç bölüm ve eklerden oluşan bu çalışmada risâlenin müellifi Ali b. Siyâvuş ve mütercimi Abdullah Bosnevî'nin hayatları ve eserleri hakkında bilgiler yanında yoğun bir tasavvufî içeriğe sahip olan risâle'nin konuları mebde', meâş ve meâd başlıkları altında ele alınmakta ve risâlenin günümüz harflerine çevirisi bulunmaktadır. Ekler kısmında ise mevcut el yazması nüshalardan örnekler yer almaktadır. Risâle, tasavvufun birçok konusunu mebde', meâş ve meâd başlıkları altında bir araya getirdiğini söylemek yanlış olmayacaktır. Bu yönüyle risâle, sistematik muhtasar bir Tasavvuf el kitabı olarak nitelenmeyi haketmektedir."
