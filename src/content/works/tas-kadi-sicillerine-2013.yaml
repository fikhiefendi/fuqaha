abstract: "Urfa'nın XIX. yüzyıl ikinci yarısındaki sosyal hayatını kadı sicillerine göre işleyen tez, giriş ve beş ana bölümden oluşmaktadır. Çalışmada öncelikle şehrin kadı sicillerine ve incelenen dönemdeki siyasî, mülkî ve idarî yapısına değinilmiştir. İnsanların etnik ve dinî mensubiyetleri ile nüfus ve yerleşimleri belirlenmiştir. Umumiyetle iyi ilişkilere sahip olan Müslüman ve gayrimüslim unsurların, birçok mahallede birlikte yaşadıkları tespit edilmiştir. Müslümanlar evlilik, boşanma ve mirasta şer`î hukuka riâyet etmiş; gayrimüslimler ise, kendilerine tanınan hoşgörü gereği sosyal hayatlarını dinlerine göre tanzim etmişlerdir. Ancak bu serbestliğe rağmen karşılaştıkları çoğu meseleleri kendi istekleriyle kadı mahkemesine getirerek şer`î hükmü talep etmişlerdir. Çalışmada toplum hayatının önemli unsurlarından insanlar arası ilişkiler, eğlence şekilleri, çeşitli zümreler, sağlık hizmetleri, asayiş olayları ve kimsesizlerin korunmasına yönelik sosyal tedbirler üzerinde durulmuştur. Alınan sosyal tedbirler sayesinde yardıma muhtaç kimselere ait hakların korunduğu anlaşılmıştır. Müslümanlara ve gayrimüslimlere ait eğitim kurumları ile dinî mekânlar hakkında bilgi verilmiştir. İhtida ederek Müslüman olan bazı Yezidî ve Hıristiyanlar'ın sosyal hayatları incelenmiş, din değiştirmede insanların rızalarıyla hareket ettiği ve herhangi bir baskının olmadığı ortaya konulmuştur. Vakıf kültürünün canlı bir şekilde yaşatıldığı şehirde sosyal hayatın birçok alanında hizmet veren vakıflar tespit edilmiştir. Ayrıca ekonomik hayatın tarım ve hayvancılığa dayandığı bu dönemde şehrin ticarî durumuna, ticaret merkezlerine ve tarım ile hayvancılık faaliyetlerine yer verilmişti"
