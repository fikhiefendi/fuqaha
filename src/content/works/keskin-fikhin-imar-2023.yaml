abstract: "Bu çalışmada Fıkhın İmar Uygulamalarına Etkisi üzerinde durulmuştur. Konuya ilgili kavram ele alınarak başlanmış daha sonra da bu alanla ilgili kaynaklar ve geçmişten bu güne bunun literatürdeki yerine değinilerek devam edilmiştir. Bu alanın en temel unsurlarından biri olan bina, birçok yönüyle değerlendirilmiş ve bunların yapısal olarak fiziksel ve kültürel faktörlerden etkilendiği ifade edilmiştir. Aynı zamanda binaların, bir kısmı yapım öncesini diğer bir kısmı da inşa sürecini ilgilendiren birtakım ilke ve esaslar çerçevesinde yapılmasının öngörüldüğü ifade edilmiş ve bunların her biri de fakihlerin görüşleri etrafında ortaya koyulmuştur. Fıkhın Müslümanlar tarafından meydana getirilen mimari yapılaşmadaki etkisi incelenmiş ve bu hususta belirleyici bir rol ve etkiye sahip olduğu belirtilmiştir. Bu anlamda cadde ve yollar ele alınmış ve bunların gerek genişlik gerekse kullanımı konusunda fakihlerce ortaya koyulan hüküm ve esaslar ifade edilmiştir. İlgili konuda üzerinde durulan bir diğer husus da konut ve diğer yapılar olmuştur. Bunlarla ilgili hususlarda fakihlerce belirlenen ve esas kabul edilen bazı prensiplerin belirleyici olduğu görülmüştür. Bunlardan biri olan ve temelinde de hadis bulunan zarar prensibine ilgili konuda oldukça geniş yer verildiği görülmüş ve fakihlerin ilgili husustaki birçok meseleyi bu prensip çerçevesinde değerlendirerek çözümlediği ifade edilmiştir. Ayrıca mezheplerin söz konusu prensiple ilgili yaklaşımları ele alınmış ve bu konuda özellikle Hanefî ve Mâlikîlerin söz konusu prensibi daha işlevsel kullanmaları yönüyle öne çıktıkları vurgulanmıştır. Farklı türdeki yapıların yol açtığı görmeye, sese, kokuya, duman ve sarsıntıya dayalı zararların önlenmesi konusunda fakihlerce etkin bir şekilde kullanılan söz konusu prensibin, İslam mimarisinde yapılaşmanın şekillenmesine yön veren en önemli etken olduğu belirtilmiştir. Konut ve diğer yapıların mimarisini etkileyen bir diğer prensibin de mahremiyet olduğu ifade edilmiştir. İslâmî açıdan oldukça önemli olan söz konusu prensibin özellikle konutların iç ve dış mimarisini etkilediği ve bu anlamda İslam mimarisine özel bazı unsurların yapılarda yer almasını sağladığı belirtilmiştir. Yine kıbleye doğru tuvalet ihtiyacını gidermenin fıkhî boyutu ve bunun yapılaşmaya etkisi, bu konuda varid olan hadisler ve bunlar üzerine yapılan yorumlar çerçevesinde değerlendirilmiştir. Geçmişte birbirine yakın şekilde oluşan yapılaşma sonucu ortaya çıkan irtifak hakları ile genel olarak ortak kullanımı söz konusu olan duvar ve tavanla ilgili mesele ve bunların hükümlerine de konumuzu ilgilendiren kısmıyla yer verilmiştir."
