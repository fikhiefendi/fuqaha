abstract: "Bu tez Kuşeyrî'nin Letâifü'l-İşârât ve Tabâtabâî'nin el-Mîzân fi Tefsîri'l-Kur'an adlı tefsirlerini batın kavramı çerçevesinde mukayese eder. Farklı çağlarda yaşamış iki müfessirin bakış açılarının ve ayetlere yaklaşım tarzlarını ele alır. Çalışmada Tabâtabâî'nin tefsiri hacimli olması sebebi ile ön planda tutan bir yöntem izlenmiştir. Bâtın kavramının açıklamasıyla başladığımız tezin birinci bölümünde batın kavramının Kur'an'da kullanımına ilişkin örnekler vererek, tarihi serüvenine ve mahiyetine ilişkin mülahazalarda bulunduk. Tezin ikinci bölümünde ise müfessirlerimizin kişisel hayatlarına ilişkin bilgiler verilip düşünce ufuklarını tanımaya yönelik açıklamalar yapılarak mukayeseler yaptık. Üçüncü bölümde ise tezin ana konusunu teşkil eden her iki müellifin tefsirlerini imamet, nübüvvet, ilmi ledün ve ilmi huruf kavramları ekseninde mukayese ettik. Yapılan mukayeselerde çeşitli bulgular elde edilmiş benzer ve farklı özellikler ortaya konulmuştur. Yapılan değerlendirme ve mukayeselerde müelliflerin, bazen aynı ayet, bazen ise farklı ayetler üzerinde zahir anlamın dışında bâtınî yorumlar yaptıkları tespit edilmiştir. Her iki ekolün farklı doktrinsel ögeler taşımasına rağmen benzer amaçlarla bâtınî tefsire yönlenmesi dikkat çekici bir husus olup, bu duruma yönlendiren amiller hakkında mülahazalarda bulunulmuştur."
