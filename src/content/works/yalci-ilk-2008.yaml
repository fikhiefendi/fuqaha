abstract: "Araştırmamızda fıkıh usulü ilminin gelişimi açısından önemli bir asır olan beşinci asır dahil olmak üzere, ilk beş asır usul eserlerinde istıshab delili hakkındaki mülahazalar ve bu delilin ilk dönem usul bilginleri tarafından nasıl algılandığına dair temel yaklaşımların ortaya konulmasına çalışılmıştır.İlk dönem usul eserlerinde konunun dağınık bir şekilde ele alındığı, dönemin usul bilginlerinin istıshab hakkındaki görüşlerinin kelamî görüşleriyle de alakalı olarak, şeriatın vürudundan önce eşyanın hükmü ve hüsn-kubh meselelerine bakış açılarına göre farklılıklar arz ettiği görülmektedir.Hakkında özel delil bulunmayan durumlarda eşyadan yararlanma ve davranışlarda serbest olmak anlamında istıshab, müçtehidin zihninde yer alan ve akılda yerleşik birer hüküm olduğu kabul edilen aslî ibaha ve aslî berâet anlayışlarının literatürde teknik olarak ifade edilmiş hali gibidir. Dolayısıyla usul eserlerinde genellikle şer'î delillerin sonuncusu olarak zikredilen istıshabın, hakkında hükmü belirlenmeyen şeylerde aslî ibaha fikrine ulaştırması açısından, aslında fer'î delillerin ilki olarak düşünülmesi mümkündür.Karşılaşılan meselelerde müçtehidin önünü açması ve ona küllî bir bakış açısı sunması yönüyle çok büyük önemi haiz bu delilin, ilk dönemdeki anlamının öne çıkarılarak günümüz fıkıh faaliyetinde yerini alması gerektiği kanaatindeyiz."
titleTranslation: {"en": "Istıshab in Islamic jurisprudence literature of the first five centuries"}
