abstract: "İbadetler, kulun Allah'ın emirleri doğrultusunda, yapılan birtakım tutum ve davranışları ifade eder. Bu konuda, insan olmanın özelliklerinden kaynaklanan birtakım eksiklik veya yanlışlar ortaya çıkabilmektedir. Bu eksiklik veya yanlışlar da fakihler tarafından mezheplere göre farklı hükümlere tabi tutulmuştur. Bu çalışmanın ana konusu da ibadetler hususunda ortaya çıkan hata ve unutmadan kaynaklanan problemlerin sonuçlarının Hanefi mezhebine göre ele alınmasıdır. İbadetlerde hata, Allah ve kul hakkını ilgilendirmesi bakımından iki kısımda değerlendirir. Allah hakları ile ilgili konularda hata, günahtan kurtaran bir özür olup ibâdet sorumluluğunu ortadan kaldırmaz. İbadetlerin şartları veya ibadeti bozan durumlar ile kul haklarını ilgilendiren konularda ise hata bir mazeret teşkil etmez. Unutma da orucu bozan durumların haricinde ibadetler açısından bir özür teşkil etmez. Unutmanın hükümlere etkisinde kasıt ve hatadan farkı yoktur. Nitekim namaza başlamak için hadesten ve necasetten temizlenmeyi, oruç için niyet vaktini, hac için ihrama girme ve niyet etmeyi unutma gibi ibadetlerin şartlarından herhangi birisinin yerine getirilmemesi ibadeti geçersiz kılar. Aynı zamanda namazda konuşmak, ihram yasaklarını çiğnemek gibi ibadetler açısından yasaklanmış ya da ibadeti bozan herhangi bir durumun, unutma sebebiyle meydana gelmesinde de hüküm değişmemektedir."
