abstract: "Şer`iyye sicilleri; Osmanlı Tarihi açısından günümüze kadar ulaşmış elimizde bulunan önemli kaynaklardır. Çünkü bunlar dönemin dilini, yaşam tarzını, örf ve âdetlerini, yargı sistemini, hukuk anlayışını, kadıların ictihadlarını, ekonomik, sosyal ve siyasî yaşamı irdelemek ve sorgulamak açısından elimizde bulunan çok önemli birinci el tarihi belge niteliğindedir.Şer`iyye sicillerinin diğer önemli bir yanı da yerel özellik taşımalarıdır. Nitekim herhangi bir bölgeye ait siyasi, sosyal, kültürel ve ekonomik araştırma yapanlar için ilk başvurulacak kayıtlar arasında Şer`iyye Sicilleri yer almaktadır.Osmanlı Devlet teşkilatı içinde önemli bir yer tutan kadı ve mahkemeler tarafından tutulan bu siciller XV. asrın yarısından başlayarak, XX. asrın ilk çeyreğine kadar ki uzun bir zaman dilimi içinde en azından 472 yıllık Osmanlı Devleti'nin tarihini, iktisadî, siyasî, sosyal ve hukukî hayatını yakından ilgilendirmekte ve kısaca Türk kültür ve tarihinin temel kaynaklarının başında gelmektedir.İşte bu bağlamda bizim yapmış olduğumuz bu çalışma Tire şehriyle ilgili önemli bilgiler içermesi sebebiyle elli adet sicil kaydının metinlerinin okunması ve değerlendirmesini ihtiva etmektedir. Bu metinlerde genel olarak; miras hukukundan dolayısıyla taksimattan çokça bahsedilmiştir. Ayrıca Tire ile birlikte Ödemiş, Birgi, Ayasluğ (Selçuk), Balyanbolu (Beydağ), Aydın, Kütahya, İnegöl, Alaşehir, Sart şehirlerinin isimleri sicillerde geçmektedir."
