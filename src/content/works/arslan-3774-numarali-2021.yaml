abstract: "Şer'iyye sicilleri, Osmanlı tarihinin aydınlatılması açısından birincil kaynaklardır. Bilhassa, sosyo-ekonomik, sosyo-kültürel, dinî ve siyasî birçok konunun aydınlatılması amacıyla bu defterlerin önemi her geçen gün artmaktadır. Çalışmamıza mesned teşkil eden 577 Numaralı Diyarbakır Şer'iyye Sicili defteri XIX. asrın son çeyreğindeki mahkeme kayıtlarını ihtivâ etmektedir. 577 numaralı defter 16 varak ve 68 hükümden oluşmaktadır. Defterdeki en erken tarihli hüküm 1135 (1723) tarihlidir. En son ise, 1269 (1853) tarihli hüküm yer almaktadır. Defterdeki hükümler çoğunlukla verâsetle ilgili olmasına rağmen, evlilik, boşanma, yol tamiri ve başka şehirlere göçler, yaralama ve gasp suçlarına ilişkin mehkeme kararları da yer almaktadır. Bu kararlar, dönemin sosyo-ekonomik ve sosyo-kültürel yaşamına ışık tutmaktadır."
