abstract: "Bu çalışma, elektronik pazarlama araçlarının bireyleri hayır kurumlarına bağış yapmaya teşvik etmedeki etkinliğini değerlendirmeyi amaçlamaktadır. Çalışma, elektronik pazarlama etkinliğini ölçmenin en önemli yöntemlerini ve hayır kurumları tarafından kullanılan elektronik pazarlama araçlarını incelemekte olup, ayrıca hayır kurumlarına gelen bağışlardan pazarlama giderlerinin kesilmesi konusundaki görüşler ve fıkıh kurallarını ele almaktadır. Çalışmanın amaçlarına ulaşmak için anket bir araştırma aracı olarak kullanılmış ve veriler, Yapısal Eşitlik Modellemesi (Structural Equation Modeling) tekniği kullanılarak istatistiksel olarak incelenmiş ve analiz edilmiştir. AOMS programı kullanılarak yapılan analizler sonucunda, elektronik pazarlama araçlarının bireyleri bağış yapmaya teşvik etmede etkili bir rol oynadığı ve bireylerin güveni ve memnuniyetinin bu bağlamda ana faktörler olduğu ortaya çıkmıştır. Çalışma, sosyal medya araçları ve çevrimiçi reklamlar ile bağış yapma teşviki arasında istatistiksel olarak anlamlı doğrudan pozitif bir ilişki ve etkisi olduğunu, içerik platformları ile bağış yapma teşviki arasında ise istatistiksel olarak anlamlı doğrudan negatif bir ilişki ve etkisi olduğunu göstermektedir. Sonuçlara dayanarak, çalışma, hayır kurumlarının elektronik pazarlama araçlarını kullanma etkinliğini artırmak için pratik öneriler sunmaktadır. Bu öneriler arasında, kamuoyuyla güven inşa etmeye odaklanmak, sunulan içeriğin kalitesini artırmak ve özellikle ücretli araçlar kullanıldığında finansal kaynaklardan en iyi şekilde yararlanmak için bu alanda deneyimli ve yetkin kişilerin istihdam edilmesi yer almaktadır."
