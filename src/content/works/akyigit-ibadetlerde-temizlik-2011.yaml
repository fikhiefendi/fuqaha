abstract: "İbadetlerin insan hayatındaki etkisi ve önemi büyüktür. Kulluk bilincinin oluşması ve kulun Allah'a kendini yakın hissetmesi için, ibadetler adeta sığınma kalesidir. Her işin bir başlangıcı olduğu gibi, ibadetlerin de ön hazırlık aşaması vardır. Tezimizin amacı, herkesin bildiği klasik ilmihal konularından ziyade, bütün Müslümanların gündemini meşgul edip, tartışmaya sebep olan konuları açıklığa kavuşturmaktır.Tezimizde, özel günlerindeki bayanların, ibadetlerini nasıl ifa edecekleri, menopoz döneminde namazlarını nasıl kılıp, oruç ibadetlerini nasıl yerine getirecekleri, bununla birlikte, değişen günümüz dünyasında hac yolculuğu yapan bayanların, özel halleri vukuu bulunca, yarım kalan tavaf ibadetini nasıl yapacakları sorularına mezheplerin de farklı fetvalarıyla çözüm yolları bulduk. Ayrıca Kur'anı Kerim'i okuma ve ona dokunmada temizlik şartını da inceledik. Bunun gibi akla takılan ve İslam dünyasının gündemini oluşturan, güncel dini sorunlara çözüm bulmaya çalıştık."
