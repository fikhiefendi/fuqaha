abstract: "Faizsiz bankacılık olarak bilinen katılım bankacılığının faaliyetlerinin sürdürülebilirliği açısından likidite riski önemlidir. Bu çalışmanın amacı katılım bankalarının likidite riskini önleyici sermaye piyasası araçlarının yönetimini irdelemektir. Bu amaç doğrultusunda ilk olarak Türkiye'de katılım bankacılığının tarihi ele alınmıştır ve yatırım ve proje finansmanı süreçlerinde sukuk veya kira sertifikalarının ihraçları irdelenmiştir. Daha sonra katılım bankalarının karşılaşabilecekleri risk unsurları incelenmiş ve ardından likidite riskini önleyici olarak sermaye piyasası araçlarından biri olarak sukuk ihracı ile katılım bankalarının sermaye yeterlilik oranları arasındaki korelasyonuna bakılmıştır. Oran analizi ile Türkiye'deki katılım bankalarının sermaye yeterlilik oranları ile Sukuk ihraçları arasındaki ilişki incelenmiştir. Analiz sonucunda sukuk ihracının likidite riskini önleyici bir araç olarak kullanılabileceği tespit edilmiştir. Özellikle iki bankada derinliğin olduğu son üç yılda SYR ile sukuk ihraçları arasında ilişki olduğu tespit edilmiştir. SYR düştükçe, bankaların artan likidite risklerini azaltmak için sukuk ihracına daha fazla odaklandıkları ve Pazar paylarını arttırdıkları görülmüştür. Katılım bankaları likidite yeterliliklerini güçlendirebilmek için finansal ürün ve hizmet çeşitliliklerini arttırmalıdır."
