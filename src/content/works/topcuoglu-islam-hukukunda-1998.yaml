abstract: "Bu tezimizde, Hanifi mezhebini esas alarak diğer mezhepleri görüşüne de imkân nisbetinde temas ettik. Bununla beraber Türk Medeni Hukuku'ndaki uygulamaya da zaman zaman atıfla bulunduk, mukayeseler yaptık. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde şahıs ve şahsiyet kavramları üzerinde durduk. Ayrıca günümüzde mer'i olan Türk Medeni Hukuk ndaki uygulamaya da yer verdik. Çalışmamızın birinci bölümüne kayboluş-hükmen ölü sayılma sürecindeki mefkûd üzerinde durduk. İkinci bölümde ise, mefkûdun hükmen vefatının hukuki neticelerine temas ettik. Üçüncü ve son bölümde de vefatına hükmedilen mefkûdun ortaya çıkması halindeki hukuki durumu ele aldık."
