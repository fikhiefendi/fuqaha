abstract: "T.C. Cumhurbaşkanlığı Diyanet İşleri Başkanlığı'na bağlı merkez teşkilatında bulunan, Dinî Yayınlar Genel Müdürlüğü alt birimi olan, Süreli Yayınlar ve Kütüphaneler Daire Başkanlığı'nın çalışmaları kapsamında birtakım yayıncılık faaliyetleri yürütülmektedir. Söz konusu faaliyetlerden biri olarak süreli yayımlanan dergiler arasındaki Diyanet İlmî Dergi, araştırmanın odağındaki yayın olmaktadır. Diyanet İlmî Dergi'de Yer Alan Kadın Yazarların İslam Fıkhına Katkıları'nın araştırıldığı çalışmada kadın yazarların Diyanet İlmî Dergi'de kaleme aldığı makaleler arasında İslam fıkhı verileri ele alınmıştır. Tezin adlandırılması aşamasında konu alanı ve kapsamına işaret edilmesi ön planda tutulmuştur. Bu doğrultuda 2003-2023 yılları arasındaki sayıların tümü mercek altına alınmıştır. Diyanet İlmî Dergi'de 2003-2023 yılları arasında yer alan kadın yazarlar tarafından fıkhî verilere yer verilmiş makalelerin dağılımının tespit edilmesi, makalelere ne kadar yer verildiğinin saptanması, alan yazına katkı sunulması gibi amaçlar etrafında araştırma sağlanmıştır. Bu doğrultuda gerçekleştirilen kaynak taramasında Diyanet İlmî Dergi üzerine herhangi bir çalışma yapılmadığı anlaşılmıştır. Bu alanda boşluk olduğu dikkate alınarak mezkûr araştırmayı gerçekleştirmek öneme haiz bir mesele haline gelmiştir. Yirmi yıllık süreçteki araştırma verisi birikimi, toplumun yapısı ve talepleri gibi unsurlardan referansla makale içeriklerinin değişimiyle ve dönüşümüyle etkileşim içindedir. Bu durum gerçekleştirilen araştırmanın önemini arttırmıştır. İlgili araştırmada nitel araştırma yöntemlerinden doküman ve içerik analizleri kullanılmıştır. Diyanet İlmî Dergi'de araştırma kapsamındaki yirmi yıl ranjında yayımlanmış sayılar, kadın yazarların fıkhî telifleri arasından tespit edilmiş ve makaleleri analiz edilmiştir. Söz konusu makaleler anlatım biçimi, muhtevası, ilgili bilim dallarına katkısı başta olmak üzere pek çok açıdan değerlendirilmiştir. Ardından yapılan değerlendirmeler ibâdât, muamelât, ukubât ve güncel fıkhî meseleler açısından taksim edilmiş ve raporlaştırılmıştır. Araştırma çerçevesinde yer alan makaleler analiz edilmiş ve taksim edildiği grupta birtakım sayısal verilere ulaşılmıştır. Alanı gereği doğrudan fıkhî konularda toplamda on üç adet makale yayımlanmıştır. Toplamda on adet muhtevası gereği ilgili konunun fıkhî boyutlarının dolaylı olarak veya makale içinde alt bölüm olarak fıkhî bakış açılarına yer verilmiştir. Öte yandan kadın yazarlar tarafından ele alınan konuların dikkate değer kısmında kadınlara özgü meseleler, çeşitli konuların kadınlara yansıyan fıkhî hükümleri ve bakış açıları üzerinde durulduğu bilgisine ulaşılmıştır. Diyanet İlmî Dergi'de yayımlanan sayıların bazılarında İslamî ilimlere katkı sağlamış şahsiyetlerin çeşitli yönlerinin ele alındığı konseptlerle oluşturulan makalelerin bir araya getirildiği sonucuna ulaşılmıştır. Bazı sayılarda İslam hukuku donelerine yer veren kadın yazarlara rastlanmadığı, bazı sayılarda ise herhangi bir konuda makale kaleme alan kadın yazarların yer almadığı bulgusuna erişilmiştir."
