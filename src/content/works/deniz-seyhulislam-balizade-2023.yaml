abstract: "Osmanlı dönemindeki ilmi çalışmaların, hemen hemen her alanda İslam literatürüne yaptığı katkı tartışılmaz bir gerçektir. XI/XVII. yüzyılda yaşayan ve IV. Mehmed (1648-1687) dönemi Şeyhülislâmlarından olan Bâlîzâde Mustafa Efendi (ö. 1073/1662) de İslam literatürüne katkı yapmış büyük bir ilim ve devlet adamıdır. Mustafa Efendi, başta fıkıh ve hadis olmak üzere birçok alanda eserler kaleme almıştır. Çalışmamızda, Osmanlı Devleti'nin dînî vazife bakımından en üst mertebesi olan Şeyhülislâmlık görevinde bulunmuş böylesi bir İslâm âliminin, Ebû Eyyûb el-Ensârî tarafından rivayet edilen hadisleri derlediği el-Ehâdîsü'l-merviyye 'an Ebî Eyyûb el-Ensârî adlı eserinin tahkikli neşri yapılarak literatüre kazandırılması amaçlanmıştır. Böylelikle hem Şeyhülislâm Bâlîzâde Mustafa Efendi'nin biyografisine dönük yetersiz ve dağınık çalışmalara katkı sunulması hem de kaleme aldığı bu önemli eserin ilk defa tahkikli neşri vesilesiyle hadis literatürüne katkı sağlanması planlanmıştır. İslâm medeniyetinin“İkinci Klasik Dönemi”olarak adlandırılabilecek olan VII/XIII.-XIII/XIX. yüzyılları arasında yapılan çalışmaların, entelektüel birikimin gereği gibi araştırma mevzu edilmemesi ve bu dönemde çalışılması gereken ilmî ve fikrî pek çok eserin varlığı, bu çalışmanın hayata geçirilmesini önemli kılmaktadır. Araştırmanın konusu olması hasebiyle özellikle Hadis alanı başta olmak üzere birçok alanda yazılmış değerli eserler, kütüphanelerin tozlu raflarına mahkûm edilmiştir. Bu eserlerin tahkik edilerek hem eser hakkında hem müellifi hakkında hem de eserin yazıldığı dönemim ilmî ortamının tanınması hakkında bilgiler toplanması, bu alanda araştırmalar yapmak noktasında bir hayli önemi hâizdir. Bu doğrultuda Şeyhülislâmlık yapmış bir âlimin, Osmanlı topraklarına kadar ulaşarak buraya defnedilmiş Ebû Eyyûb el-Ensârî (ö. 49/669) gibi önde gelen bir sahâbînin rivayetlerini derlediği bir eser üzerinde çalışarak tahkikli neşrini yapmak bu araştırmanın önemli motivasyon kaynaklarından biridir. Araştırmaya özgün değer katan hususların başında, bu konuda müstakil ve kapsamlı bir yüksek lisans, doktora tezi veya farklı herhangi bir çalışmanın bulunmaması gelmektedir. Zira tespit edilebildiği kadarıyla Bâlîzâde'nin telif ettiği eserlerden hiçbirisi tahkik edilmemiştir."
