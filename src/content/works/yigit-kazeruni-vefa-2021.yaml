abstract: "Çalışmamızda tahkik ve tahlilini yaptığımız İşâretü ba'zı ehli'l-vefâ bi-cem'i ahkâmi bey'i'l-vefâ adlı eser, Mekke'de yaşamış Kâzerûnî diye tanınan Afîfüddîn Abdullah b. Hasan tarafından kaleme alınmıştır. Eser, İslam Hukuk külliyatında risale türünde telif edilmiştir. Bu konuda yazılmış bilinen en kapsamlı eser olması açısından önem arz etmektedir. Çalışmamız, giriş ve sonuç hariç dört bölümden oluşmaktadır. Önsöz ve girişte araştırmanın konusu, amacı, kapsamı, metodu ve kaynaklarına değinilmiştir. Birinci bölümde müellifin hayatı, yaşadığı çevre, ilmî kişiliği, döneminin siyasi ve ilmî koşulları gibi konulara yer verilmiştir. İkinci bölümde müellifin metodu üzerinde durulmuş, eserde atıfta bulunulan kaynaklar tespit edilerek müellifleriyle birlikte tanıtılmış, böylece eser kaynakları açısından tahlil edilmiştir. Üçüncü bölümde Kâzerûnî'nin risalesi başta olmak üzere konuyla ilgili diğer Hanefî fıkıh kaynaklarına başvurularak bey' bi'l-vefânın tanımı, uygulamaları, ortaya çıkışı, hükmü, müellifin yaşadığı dönemde Mekke ulemasının konuya bakışı ve diğer mezhep kaynaklarında bey' bi'l-vefânın nasıl yer aldığı konularına değinilmiştir. Böylece literatüre katkısının daha net anlaşılması, bu konuda yazılmış en kapsamlı eser olduğu iddiasının doğrulanması ve ortaya çıkışından müellifin yaşadığı döneme kadar bey' bi'l-vefâ ile ilgili hangi meselelerin vurgulandığı görülmüş olacaktır. Dördüncü bölümde ise eserin tamamı tahkik edilerek nüsha farklılıklarına dipnotta yer verilmiştir."
