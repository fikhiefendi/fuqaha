abstract: "On sekizinci yüzyılda başlayan Türk modernleşmesi, cumhuriyet sonrasında kültürleşme, millileşme ve öze dönüş politikaları çerçevesiyle sınırlandırılmış, sosyokültürel alanda Batı'ya karşı egemenlik ve bağımsızlık ilanı ile dinin millileştirilmesi yönünde din politikaları düzenlenmiştir. Osmanlı modernleşmesinden uzun bir süreç sonucunda devralınan Türk modernleşmesi, Türk Devrimi ile geçmiş modernleşmeden kopmuş ve Cumhuriyet döneminin modernleşme politikasını görünürde Batı merkezli Osmanlı modernleşmesinden ayırmıştır. Dil, tarih, ekonomi ve hukuk politikaları uluslaşma ve ulus inşasının gerekliliğine yönelik düzenlendiği gibi cumhuriyetin din politikası da uluslaşma ve ulus inşasının gerekliliği üzerinden kurgulanmıştır. Bir yandan İslamî pratiği ve dinî kavramsallaştırmayı millileştirmek için hukuk ve ibadet dilinde milli bir söylem kullanılmış, diğer yandan din dilini millileştirmek için kapsamlı bir çalışma yapmak gerekmiştir. Hukuku din sınıfından arındırmak ve ulemanın devlet üzerindeki etkisini kırmak için kamu hukukunun örfe tabi kılınarak laikleştirilmesi ve din dilinin Türkçeleştirilerek Türk din anlayışı kodlarına dönülmesi cumhuriyet projesinin hedefleri arasındadır. Bu amaç doğrultusunda Cumhuriyet'in teolojik temeli, din ve siyasetin birbirinden ayrılmasına imkan veren Hanefî-Mâturîdî ekolden hareketle atılmış ve Batı'da yaşanan laiklik biçimlerine karşı Türk tipi laiklik gerçekleştirilmiştir. Milli din politikası; milli iktisat, milli tarih ve milli hukuk politikalarıyla aynı hedefler doğrultusunda düzenlenmiş olsa da cumhuriyetin din politikası din temelli bir muhalefetle karşılaşmış ve Osmanlı Devleti İkinci Meşrutiyet döneminde ortaya çıkan İslamcı anlayış, cumhuriyet döneminde de karşı söylem olarak yeniden belirmiştir. Türkiye Cumhuriyeti'nin kuruluş ilkelerinde Ulus Devlet tasavvuru vardır; diğer çağcıl örnekler ile benzeştiği kısmı, belirli sınırları olan, egemen bir devlet anlayışı olmasıdır, bazı ulus devletlerden ayrıştığı kısım ise din ve devlet ayrılığı ilkesini merkeze alması, ve milli aidiyeti ulusal kimlikle tarif etmesidir. Dinin kamusal hayattan tamamen tasfiye edilmesini hedef edinen Marksizm ile din ve devlet işlerinin birbirinden ayrılmasına karşı çıkan ve din devleti şemsiyesi altında ruhban sınıfının tahakkümünü talep eden İslamcılık, ulus devletin din toplumu anlayışından tabiatı gereği farklıdır. İslamcı ideolojinin cumhuriyet karşıtı söylemi, bu bağlamda, dinin siyasallaştırıldığı ve siyasi karşıtlıkların dinselleştirildiği bir söylemdir."
