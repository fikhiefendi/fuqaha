abstract: "Hicrî IV. asrın sonlarına doğru ilmî dilin gelişmesiyle tasavvuf, tedvin sürecine girmiştir. Bu anlamda tasavvufun bir dinî ilim olduğunu birçok açıdan ortaya koymaya çalışan sûfî müellifler, tasavvufa ana kaynaklarını kazandırarak bir literatür inşa etmişlerdir. Tedvin sürecinin Gazzâlî'de son bulduğu düşünüldüğünde bu müelliflerin son halkası diyebileceğimiz Ali b. Osman el-Hücvîrî (ö. 465/1072), daha çok Arapça olarak kaleme alınan literatüre, Farsça telif ettiği eseri Keşfü'l-mahcûb'u dâhil etmiştir. Eserine isbâtü'l-ilm konusu ile başlaması ve ilk kez tasavvufî fırkaları taksim eden kişi olmasıyla dikkat çeken Hücvîrî, bu manada diğer müelliflerden ayrıcalıklı bir yere sahiptir. Çalışmamızda, tasavvufun tedvin sürecinin muhatap ve muhalifleri ve Hücvîrî'nin onlara karşı geliştirdiği yaklaşımlar, çeşitli başlıklar halinde tasnif edilecek ve onun tasavvuf anlayışının ortaya çıkmasında ne tür etkileri olduğu soruşturulacaktır. Bunu yaparken de, bir geleneğin takipçisi olması hasebiyle hemen hemen her konu, Hücvîrî'den önceki müelliflerle mukayeseli bir şekilde ele alınacak ve en nihayetinde Hücvîrî'nin tasavvuf anlayışı ve tasavvufun teşekkül sürecine etkisi ortaya konulmaya çalışılacaktır. Üç bölümden oluşan çalışmamızın birinci bölümünde bir tasavvuf tarihi yazıcısı olarak Hücvîrî'nin tasavvuf düşüncesindeki önemini ve tedvin dönemine katkılarını tabakât ve fırkalar bahsi özelinde tespit etmeye çalıştık. İkinci bölümde, tasavvufu bir dinî ilim olarak kabul eden Hücvîrî'nin, bilginin varlığı ve bilinebileceği noktasındaki kanaatini ortaya koyduktan sonra bu kabulünü tasavvufun mevzu, mesele ve yönteminin oluşuyla delillendirdiğini tesbit ettik. Üçüncü bölümde ise tasavvuf kavramının kullanımı ve sûfîlerin dindarlığı üzerinden karşılaştıkları eleştirilere ve Hücvîrî'nin bu eleştirilere cevaben ele aldığı konulara değinmeye gayret ettik."
