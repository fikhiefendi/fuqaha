abstract: "Hanefî mezhebinin yetistirmis oldugu en büyük alimlerden biri olan Bezzâzî, ömrünün büyük bir bölümünü Altınordu devletinin baskenti olan Saray sehrinde geçirmis, kendisini büyük bir söhrete kavusturan el-fetâvâ'l-Bezzâziyye adlı eserini yazmıs, Kırım ve Bulgar sehirlerinin dısında bir dönem de Anadolu'ya giderek ilmi mübâheselerde bulunmus ve 827/ 1424 yılında vefat etmistir. Bezzâzî'nin mezhebin temel görüslerinin aktarılmasında büyük bir islev gören elfetâvâ'l- Bezzâziyye adlı eseri ise mezhebin en güvenilir kaynaklarından biri olup kendinden önce yazılan eserlerde geçen görüslere ısık tutmustur. Bunun yanında yazarımız eserinde yasadıgı devre de ısık tutmus ve kimi meselelerde de sahsî tercih ve görüslerini dillendirmistir. Bu çalısmada yapılan ise onun özgün yanını, meseleler hakkındaki yorumlarını ve meselelere bakıs açısını daha ön plana çıkaracak fıkhî çözümlere yer vermek ve bu yolla onun fıkıh ilmine yapmıs oldugu katkıları ortaya koymaktır."
