abstract: "“İmam Muhâmilî'nin İmam Nevevî'ye Ait Kitabu'l-mecmu` Adlı Eserinde Yer Alan Taharet ve Namaz Bölümleri Hakkındaki Görüşleri”başlıklı tezim karşılaştırmalı bir fıkhî araştırmadır. Bu tezin önemi İmam Muhâmilî'nin fıkhî hükümlerle ilgili görüşlerini toplaması, onun bu hükümler için dayandığı delilleri ve ilim ehlinin delilleriyle ortaya koyduğu kanaatlerini ve bu deliller üzerine yapılan tartışmaları zikretmesinde yatmaktadır. Araştırmacı her konudaki görüşleri en güçlü delillere dayanarak değerlendirmiştir. Bu tez bir mukaddime ve üç bölümden oluşmuştur. Birinci bölümde İmam Muhâmilî'nin ve İmam Nevevî'nin (Allah onlara rahmet eylesin) kapsamlı biyografileri ve Kitâbu'l-mecmu`adlı eserin tanıtımı yer almaktadır. İkinci bölümde İmam Muhâmilî'nin sular ve abdest konularıyla su kapları ve bunlarla ilgili hususlardaki görüşleri bulunmaktadır. Üçüncü bölümde ise namazın ezan ve imamete dair konuları işlenmiştir. Kıraatin cehrî yapılması, tahiyyatü'l-mescidin tekrar edilmesi, cuma namazı ve namaza dair konulardan namazların birleştirilmesi bu bölümde ele alınmıştır. Bu tez birçok sonuca ulaşmıştır. En önemlilerinden biri alimlerle oturması, onlardan ders alması ve fıkıh ezberiyle tanınan İmam Muhâmilî'nin ilmî konumudur. İmam Muhâmilî kitap, sünnet, icmâ` ve muteber kıyas ilmi üzerine inşa edilmiş olan tartışmalı birçok fıkhî konuda fetva vermiştir. Önemi nedeniyle İmam Nevevî'nin ansiklopedik eseri el-mecmû`adlı eserinde ondan bahsettiğini görüyoruz. Araştırmacı bu konuyu çalışırken tarihsel metot ile analiz ve karşılaştırmaya dayalı tümevarımsal metodu kullanmıştır. Çünkü bu metotlar bilimsel materyallerin toplanmasında, incelenmesinde ve bunlardan gerekli görüşlerin çıkarılmasında temel bir role sahiptir."
