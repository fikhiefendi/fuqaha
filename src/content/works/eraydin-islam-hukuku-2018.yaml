abstract: "Hz. Peygamber'in vefatıyla beraber ortaya çıkan hilafet konusu, Müslümanların karşılaştıkları ilk meseledir. Başlangıcından itibaren Müslümanlar arasında hilafet etrafında önce siyasî ihtilaflar ortaya çıkmış, sonra da hilafet, itikadî bir meseleye dönüşmüştür. Aslında Müslümanların tarihî süreç içerisinde edindiği yönetim tecrübesinin ifadesi olan hilafet, çeşitli merhalelerden geçmiş olmakla birlikte ilga edildiği 3 Mart 1924'te kadar İslam toplumunun en temel siyasî müessesesi konumunda olmuştur. Hilafetin ilga sürecinin bir başlangıcı kabul edilen II. Meşrutiyetten günümüze kadar hilafet üzerine birçok tartışma yapılmış ve bu konuda önemli eserler kaleme alınmıştır. Biz de bu çalışmamızda yazdıklarıyla ve fikirleriyle hilafet tartışmalarında önemli yer tutan Türk hukukçu Muhammed Seyyid Bey, Mısırlı hukukçu Abdurrazık Senhûrî ve Pakistanlı âlim Ebu'l Alâ Mevdûdî'nin hilafet hakkındaki görüşlerini ortaya koyup İslam hukuku açısından değerlendirdik. Çalışmamız giriş, dört bölüm ve sonuçtan oluşmaktadır. Giriş kısmında araştırmanın amacı, yöntemi, kaynakları, kapsamı, tezin sunulması, hilafetin tarifi ve kısaca tarihine yer verilmiştir. Birinci bölümde Seyyid Bey'in hilafet anlayışı, ikinci bölümde Senhûrî'nin hilafet anlayışı, üçüncü bölümde Mevdûdî'nin hilafet anlayışı aktarılmış ve dördüncü bölümde de bu yazarların hilafet anlayışları değerlendirilmiştir. Sonuç bölümünde ise konu hakkında ulaştığımız sonuca yer verilmiştir."
