abstract: "Namaz, ilk peygamber Hz. Adem (a.s.) ile son peygamber Hz. Muhammed (s.a.v.) arasında gelmiş geçmiş bütün peygamberlerin şeriatlarında emredilen bir ibadettir. Allâhu Teâlâ'ya tazim ve kulluğu izhar etmek olan bu ibadetin maksadı ve gayesi tarih boyunca aynı olsada, mahiyeti ve keyfiyeti dönem dönem farklık gösterebilmektedir. İslâmiyet'le birlikte son halini alan namazın nasıl kılınması gerektiğini bizzat Hz. Cibrîl Hz. Peygamber'e (s.a.v.) imamlık yaparak fiili olarak talim etmiş, O'da (s.a.v.) daha sonra bu ibadeti ümmetine tarif ve tebliğ etmiştir. Ashâb-ı kirâm, Raslullâh'tan (s.a.v.) talim ve müşahede ettikleri bu ibadeti kendinden sonraki nesillere tevarüs yoluyla aktarmışlar, daha sonra gelen fakihler de namaz hakkında nakledilen haberlerden belirli usullere riayet ederek birtakım hükümler isitnbat etmişler ve bunları sistematik bir hale getirerek bu sahada İslâm ümmetine büyük bir hizmet sunmuşlardır. Hz. Peygamber (s.a.v.) namazı fiili olarak tarif etmekle birlikte, ashâbına kendisinden gördükleri şekilde kılmalarını emretmiş, aslına uygun olarak kılmayan kimseleri ikaz ederek namazın muayyen bir şekli olduğuna işaret etmiştir. Namaz ile alakalı rivayetler mülahaza edildiğinde, bunların Hz. Peygamber'den (s.a.v.) tek seferde topyekün sadır olmadığı, bilakis muhtelif zamanlarda ve mekanlarda peyderpey zikredildiği anlaşılmaktadır. Namazın farzlarına taalluk eden hadislerin vürud sebebi ekseriyetle yeni bir ilahi hükmü tebliğ etmek olduğu gibi, bazen namaz ile alakalı bir ayeti tefsir etmek, bazen namaz ile alakalı yöneltilen bir suale cevap vermek, bazen de namazı yanlış kılan bir kimseyi ikaz etmek suretiyle olmuştur. Bu gibi sebeplerle teşekkül eden hadis müktesabatı, zamanla namaz ahkamı için büyük kaynak oluşturmuştur. Fıkıh alimleri, namazın tarifinde zikredilen“muayyen şartlardan ve rükünlerden teşekkül eden bir ibadettir”şeklindeki ifadede bahsedilen şartları ver rükünleri, kitap ve sünnet olarak tabir edilen Kur'ân ayetlerinden ve Hz. Peygamber'in (s.a.v.) hadislerinden istinbat etmişler, bu iki asli kaynakla birlikte bunlara tabi olan başka usülleride kullanmışlardır. Fakihler tarafından, Kur'ân ayetlerinin yorumlanması, Hz. Peygamber'in (s.a.v.) hadislerini huccet değeri taşıması, bu ikisine bağlı diğer tali metodları kullanma noktasındaki farklı bakış açıları, bazı meselelerde bir takım muhtelif görüşlerin ortaya çıkmasına sebebiyet vermiştir. Bu çalışmada sözkonusu şartların ve rükünlerin tespiti ve tayini noktasında hadislerin rolüne temas edilecek, namazın farzlarıyla alakalı hükümlerin bina edildiği rivayelerin tahrici ve tahlili yapılacak, sünnetin/hadisin dinde bir teşri' kaynağı olması cihetine, Kur'ân ile arasındaki yakın münasebete ve Hz. Peygamber'in (s.a.v.) dinde hüküm koyma salahiyetini haiz olduğuna işaret edilecektir."
