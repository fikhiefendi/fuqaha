abstract: "This research aims to show the relationship between the media and the rights and freedoms, and highlight the role of the media in protecting the fundamental rights of the individual, as a right of life, dignity, and freedom of conscience, equality between individuals in civil and constitutional rights. The search achieved number of findings and recommendations, including: Confirmation of media's role in preserving the community through the activation of an Islamic media with confirmation of the principle of the Secretariat, justice and social equality in Islam, showing advantages and disadvantages of the media in its different forms by Islamic perspective scale, also divided media of tow audible, notification, and readable, depending verses of Holy Quran and Prophet sayings, as well as emphasize the importance of security of the individual and society and human rights by providing decent living for the individual, and defiance of the crime in society, and the removal of individuals from reasons of crime such as poverty and others. The most important recommendations find out from the research was performance the responsibly from charges, through the use of media as a tool to guide the community right direction for the reform of the individual and the family."
