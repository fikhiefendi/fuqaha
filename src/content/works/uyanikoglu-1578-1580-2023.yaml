abstract: "Bu tezde, 1578-1580(986-988) tarihli Çirmen şer'iyye sicili hukuksal açıdan analiz edilmiştir. Osmanlı hukukunun kaynağı olan İslam hukukunun, yargıçların kararlarına etki edip etmediğinin tespit edilmesi hedeflenmiştir. Bu bağlamda sicilde yer alan tüm konular incelenmiş, bazı önemli olaylar ise analiz edilmiştir. Çalışmada evlenme, boşanma, alışveriş, kiralama, karz ve vakıf konuları ile ukûbat alanında zina, zina iftirası, hırsızlık, öldürme, yaralama, gasp, itlaf, ihrâk ve belgede sahtecilik suçları ile ilgili kayıtların sicilde yer aldığı tespit edilmiştir. Kadınların, mehir hakları için mahkemeye başvurdukları, mahkemeye getirilen boşanmalardan biri dışında tamamının muhâlea şeklinde gerçekleştiği yani kadının mehir ve nafaka haklarından feragat ederek kocasından ayrıldığı belirlenmiştir. Para vakıflarında muâmele-i şer'iyyenin %10 olduğu, gerekli görüldüğünde bu oranın arttırıldığı, borcun geri ödenmesinin ise kefil ve rehin ile garanti altına alındığı tespit edilmiştir. Sicilde yer alan davalarda genelde kadı'nın kararları yer almamış, daha çok olayın tespiti ile yetinilmiştir. Bazı ceza davalarında davalıların vovvoda (yönetici), muhzır (mübaşir) ve subaşı (polis) gibi görevlilere teslim edildikleri, yargılama tedbiri olarak kefâlet ve hapis uygulamalarına başvurulduğu belirlenmiştir. Zina davasına ait bir kayıtta zinayı itiraf eden zimmîye had vurulduğu bilgisi yer almıştır. Müslüman ile gayr-i Müslimler arasında satım ve kiralama gibi yollarla hukuki ilişkiler kurulduğu yani Müslüman ile gayr-i Müslim ilişkilerinde bir sorun olmadığı tespit edilmiştir. Zimmîlerin kendi davalarını mahkemeye taşıdığı, bu davalarda da İslam hukukunun uygulandığı belirlenmiştir. Bazı oryantalistlerin İslam hukuku uygulama alanı bulamamıştır iddiasının aksine İslam hukukunun uygulandığı, mahkemenin kararlarında Hanefi fıkhını takip ettiği, zimmîlerin Müslümanlar aleyhine şahitliğinde ise Şeyhülislam Ebussuud Efendi'nin fetvasına uygun işlem tesis ettiği tespit edilmiştir."
