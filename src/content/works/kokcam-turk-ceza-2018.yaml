abstract: "“Türk Ceza Hukukuyla Mukayeseli Olarak İslam Hukukunda Hırsızlık Suçu”adlı çalışmamızda hırsızlık suçunun İslam ceza hukukundaki yerini, unsurlarını ve neticelerini 5237 sayılı Türk Ceza Kanunun ilgili maddeleri ile kıyaslayarak günümüz ceza hukukuyla olan benzerlikleri ve farklılıkları ortaya koymaya çalıştık. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde; malvarlığına karşı işlenen suçlara ilişkin kavramlar, hırsızlık suçunun tarihsel gelişimi, benzer suçlarla karşılaştırılması ve İslam ceza hukukunda suçların tasnif edilmesi konularını ele aldık. İkinci bölümde; hırsızlık suçunun koruduğu hukuki yarar ve suçun unsurlarını inceledik. Çalışmamızın üçüncü bölümünde ise; hırsızlık suçunda daha az cezayı gerektiren haller, teşebbüs, içtima iştirak, soruşturma ve kovuşturma usulü incelenmiş olup, konuyla ilgili değerlendirmelerden oluşan sonuç kısmına yer verilmiştir."
