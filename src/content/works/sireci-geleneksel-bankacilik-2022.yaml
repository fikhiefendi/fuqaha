abstract: "Finansal sistemde, banka faaliyetlerinin önemli bir yeri bulunmaktadır. Bankacılık tarihine bakıldığı zaman M.Ö. 1157 yılına kadar uzandığı görülmektedir. Global dünyada, faaliyet gösteren geleneksel bankacılık sistemleri daha yaygın olduğu tespit edilmiştir. Fakat finansal sistemde oluşan iktisadi açıkta, katılım bankaları oluşturulmaya başlanmıştır. Katılım bankaları, İslam hukukunun belirlediği kurallara göre müşterilerine hizmet vermektedir. Dünyada yaklaşık yarım asır, Türkiye'de 1985 yılından itibaren katılım bankalarının faaliyetleri günümüze kadar devam etmektedir. Katılım bankalarının, geleneksel bankalar ile karşılaştırılarak, geleceğe yönelik uygulamalarının belirlenmesinde, performans analizinin yapılması etkili olacaktır. Bu çalışmada bankacılık tarihi, geleneksel bankacılık ve katılım bankacılığı uygulamaları, kâr payı ve faiz ile ilgili detaylı bilgiler literatür doğrultusunda açıklanmaya çalışılmıştır. Finansal sistem içinde bulunan bankaların ortaya çıkışı ve önemi karşılaştırılmıştır. Çalışmanın analiz kısmında geleneksel bankaları ve katılım bankalarının 2017 ve 2020 yılları arasındaki verileri TBB ve TKBB aracılığıyla elde edilerek, karşılaştırmalı finansal analizi yapılmıştır. Çalışmanın sonucunda, geleneksel ve katılım bankalarının arasında katılım bankalarının performansının daha yüksek olduğu tespit edilmiştir. Fakat bankacılık sektöründe katılım bankalarının, geleneksel bankalara oranla sayılarının daha az olduğu gözlenmiştir. Buna rağmen katılım bankaları, bankacılık sektöründe önemli bir gelişme gösterdiği ortaya çıkmıştır. Katılım bankalarının müşterilerine ve sektöre yönelik iyileştirici çalışmalar yapması, marka tanınırlığı üzerinde stratejik hamleleri uygulaması bankacılık sektöründeki payının artıracağını ön göstermektedir."
