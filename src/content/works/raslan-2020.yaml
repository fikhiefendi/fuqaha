abstract: "Bu çalışmada Hz. Peygamber'in ümmeti üzerindeki hukuku konusu ele alınıp incelenmiştir. Çalışmamızda deliller eşliğinde sunmaya çalıştığımız bu konu daha önce bu şekliyle incelenmiş değildir. Konuyla ilgili parça halindeki bilgiler Kadı Iyaz'ın eş-Şifa'sında, Keza Siyer, Hasâis ve Şemâil kitaplarında yer almıştır. Değişik kaynaklarda parça halinde bulunan bu bilgileri belli bir sistem halinde aktarmaya çalıştık. Tezde yer alan nebevi hakları iki başlık halinde ele aldık: Hz. Peygamber'in zatına ilişkin emirler, Hz. Peygamber'in zatına ilişkin nehiyler. Toplamda ise tez bir giriş ile üç bölümden oluşmaktadır. Giriş bölümünde konuyla ilgili ana kavramlar tanımlanmıştır. Birinci Bölümde; Hz. Peygamber'in (aleyhissalatu vesselam) kişiliği konusu ele alınmıştır. Alt başlıklar olarak şu konulalar incelenmiştir: Hz. Peygamber'in kişiliğinden maksat, Hz. Peygamber'in Kur'an'daki kişiliği; Delâilü'n-Nübüvve, Şemâil, Fıkhu's-Sire ve İslam tarihi kaynaklarında kişiliğine dair bilgiler… İkinci Bölümde; \"Hz. Peygamberin Kişiliğiyle İlgili Emirler\" başlığını taşımakta olup burada, Müslümanların Hz. Peygamberin şahsiyeti karşısında amel ve itikad bakımından nasıl bir tavır almak gerektiği incelenmiş, hangi tavırların vacip, müstehap, mendup veya mübah olduğu örneklerle açıklanmıştır. Üçüncü bölümde; \"Hz. Peygamberin Kişiliğiyle İlgili Nehiyler\" başlığı altında ise Hz. Peygamberin zatına ve manevi şahsiyetine yönelik olarak yasaklanan veya hoş karşılanmayan söz ve hareketler incelenmiş, bunlardan hangilerinin kişiyi küfre götürdüğü, hangilerinin günah olduğu veya hoş olmadığı belirtilmiştir. Araştırmanın sonunda ise bu meselenin en belirgin sonuçlarının yanı sıra ilim talebelerinin yararlanabileceği bazı önemli tavsiyelerden bahsedilmiştir. Anahtar Kelimeler: Emirler, Nehiyler, Peygamberin Şahsı, Peygamberin Hakları."
city: "Diyarbakır"
