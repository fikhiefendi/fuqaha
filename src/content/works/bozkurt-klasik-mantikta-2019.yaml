abstract: "El-Mustasfâ'sı bağlamında Gazzali'nin mantıkî kıyas ve fıkhî kıyas anlayışını tahlil ettiğimiz bu çalışma giriş ve sonuç hariç üç bölümden ibarettir. Giriş kısmında araştırmanın önemi, amacı, kapsamı, yöntemi ve kaynakların tanıtımını yaptık. Gazzali'nin mantıki kıyası ile fıkhi kıyası arasında etkileşim olup olmadığını ve fıkhi kıyasın yerine mantıki kıyası koyup koymadığını araştırdık. İlk bölümde müellifin mantıkî kıyası, ikinci bölümde fıkhî kıyası nasıl ele aldığını inceledik. Üçüncü bölümde ise Gazzali'nin bu iki kıyas arasında ifade veya işaret ettiği benzerlik ve farklılıkları tespit ettik. Gazzâlî'nin mantıki kıyasta yeni kavramlaştırmalara gittiğini, mantıki kıyası fıkhi kıyası iptal etmeden bir çıkarım yöntemi olarak önerdiğini tespit ettik."
