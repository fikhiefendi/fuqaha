abstract: "Bu çalışmada İslam hukuk literatüründe önemli bir yer tutan, imamet, siyasetü's-şer'iyye ve edebü'l-kadı başlıkları altında incelenen devlet yönetimi şekli ve tarihsel tecrübede ortaya çıkmış olan, genel hukuk anlayışına dayalı devlet yönetim şekilleri karşılaştırmalı olarak değerlendirilmiştir. Çalışmanın giriş kısmında, tezin konusu, amacı ve önemine değinilmiştir. Birinci bölümde, devlet düzenini oluşturan kurallar anlamında genel hukuk teorisi ve İslam hukuku kavramı ile arasındaki ilişki ağı anlatılmakta, genel hukuk teorisine dayalı devlet anlayışı ve İslam hukukuna dayalı devlet anlayışı arasındaki benzerlikler ve farklılıklara değinilmiştir. İkinci bölümde, tarihsel süreçte ortaya çıkan, modern devlet yönetim sistemleri olarak günümüze kadar uygulana gelmiş devlet yönetim sistemleri fikirsel alt yapılarını oluşturan ideolojilere de yer yer değinilerek tanıtılmış ve İslam hukukundaki devlet yönetim sistemi ile karşılaştırmalı bir biçimde değerlendirilmiştir. Sonuç bölümünde ise sonuç ve öneriler ele alınmaktadır."
