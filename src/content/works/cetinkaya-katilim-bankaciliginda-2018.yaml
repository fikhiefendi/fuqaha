abstract: "Bu tezin amacı, katılım bankalarında risk yönetiminin nasıl yapıldığını anlamak ve katılım bankası çalışanlarının risk yönetim algısını ölçmektir. Çalışmanın birinci bölümünde katılım bankacılığı alanındaki temel kavramlara yer verilmiştir. İkinci bölümde geleneksel bankacılığın tanımı, türleri ve fonksiyonları ele alınıp katılım bankacılığının kuruluş sebepleri, ilkeleri ve faiz, kar, kira gibi konular karşılaştırmalı olarak incelenmiştir. Üçüncü bölümde; faizsiz bankacılığın tarihsel gelişim süreci anlatılmış, katılım bankalarınca gerçekleştirilen fon toplama ve fon kullandırma faaliyetleri ele alınmıştır. Dördüncü bölümde katılım bankalarının faaliyetleri sırasında karşılaştıkları riskler ve bu risklerin yönetimi ele alınmıştır. Çalışmanın son bölümünde katılım bankalarında risk yönetiminin nasıl yapıldığını tespit etmek için ampirik bir çalışma yapılmıştır. Anket verileri yüz yüze anket yöntemiyle 25 Mart ve 10 Mayıs tarihleri arasında toplanmıştır. Araştırma kapsamında Antalya, Isparta ve Burdur illerindeki katılım bankalarından toplanan veriler, SPSS 20 İstatistik Paket Programı yardımıyla analiz edilmiştir. Anket verilerinin güvenilir olduğu tespit edildikten sonra yanıtların frekans ve yüzde dağılımları bulunmuştur. Araştırmada beş bağımsız değişken ve bir bağımlı değişken yer almaktadır. Araştırma hipotezlerini test etmek için regresyon modeli benimsenmiştir. Demografik özelliklere göre cevapları analiz edebilmek için gruplar arasında fark olup olmadığı incelenmiştir. Veriler normal dağılım göstermedikleri için de parametrik olmayan testlerden Mann Whitney U testi ile alt gruplar arasında istatistiki olarak anlamlı bir fark olup olmadığı incelenmiştir. Ayrıca Crosstabs Testi ile de alt grupların cevapları analiz edilmiştir. Araştırmada risk değerlendirme ve analizi ve risk izleme bağımsız değişkenlerinin risk yönetimi uygulamaları bağımlı değişkeni üzerinde pozitif yönde bir etkiye sahip olduğu sonucuna ulaşılmıştır. Araştırmanın sonuçları katılım bankacılığı sisteminin maruz kaldığı en önemli risk türünün kredi/fon riski olduğunu ortaya koymuştur."
