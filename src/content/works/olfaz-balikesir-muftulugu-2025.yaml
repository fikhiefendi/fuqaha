abstract: "Bu çalışmada, Balıkesir İl Müftülüğü bünyesinde hizmet veren alo fetvâ 190 hattına 2017-2022 yılları arasında gelen dini sorular ve bu sorulara verilen cevaplar fıkhî açıdan incelenmiştir. Dini hassasiyetleri ve soruların yoğunluğunu dikkate alarak, Balıkesir halkının dini anlayışını ve ihtiyaçlarını daha iyi anlamak amacıyla bu sorular tasnif edilip, ilgili kaynaklar ışığında değerlendirilmiştir. Çalışmada, sorular iman, ibadet, aile hayatı ve helaller-haramlar gibi ana başlıklara ayrılmış ve her başlık altında soru ve cevaplar analiz edilerek fıkhi değerlendirmeler yapılmıştır. İslâm'ın temel ve tali kaynaklarına dayanan bu analizler sonucunda, halkın dini konularda sıkça merak ettiği meseleler ve Balıkesir'deki din diline özgü özellikler tespit edilmiştir. Bu çalışma, Balıkesir halkının dini bilgi ve hassasiyetlerini analiz ederek diğer şehirler için model olabilecek veriler sunmaktadır. Müftülük hizmetlerinin kalitesini artırmak ve halkın dini sorularına daha etkili cevaplar vermeyi amaçlayan çalışma, Balıkesir İl Müftülüğünün din hizmetlerinin yerel ihtiyaçlara uyumunu ve verilen fetvâların İslâm fıkhı açısından değerlendirilmesini temel almıştır."
