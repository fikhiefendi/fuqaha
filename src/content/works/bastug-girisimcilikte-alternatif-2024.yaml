abstract: "Teknoloji ve dijital dönüşümün sağladığı fırsat ve kaynakların artışı ile birlikte girişimcilik faaliyetleri altın çağını yaşamaktadır. Geleceğin şekillenmesi adına zengin bir düşünce kaynağına sahip olan girişimciliğin gelişmesinde en önemli engellerden birisi finansa erişimdir. Girişimciliğin teknoloji içeren yenilikçi faaliyetler içermesi ortaklığa dayalı alternatif yöntemleri öne çıkarmıştır. Aile ve sosyal çevre ile başlayan finansa erişim, kitle fonlama (KF), melek yatırım, girişim sermayesi fonları ile destek bulmaktadır. Her bir yöntem girişimciliğin gelişim sürecine katkı sunmakla beraber erken dönem finansman ihtiyacının karşılanmasında KF'nin etkinliği oldukça fazladır. KF, 2008 krizi ile birlikte dikkatleri üzerine çekmiş olup 2010 yılından itibaren başta gelişmiş ekonomiler olmak üzere birçok ülkede aktif olarak kullanılmaya başlamıştır. Girişimciliğin gelişmesinde risk sermayesi içeren yöntemlerin ön plana çıkması katılım finans sisteminin arzu ettiği ortaklık ekonomisi için fırsatlar sunmaktadır. Müslüman ülkelerde karşılık bulan yöntem faizsiz normlar üzerinden düzenlenerek gelişim sağlamıştır. Türkiye'de 2021 yılında düzenlenen paya ve borçlanmaya dayalı KF tebliği ile birlikte SPK'dan 17 adet platform listeye alınmış olup 2023 sonu itibari ile paya dayalı yöntem üzerinden 123 adet girişime finansman sağlanmıştır. T.C. Cumhurbaşkanlığı Finans Ofisi tarafından yayınlanan 2022-2025 yılı katılım finans strateji belgesinde, KF yönteminin ortaklık yöntemi ve sosyal finansı içine alan yönü ile katılım finansın gelişimi için potansiyelinden bahsedilmiştir. Ülkemizde KF tebliği incelendiğinde Katılım esaslı KF faaliyetine yönelik düzenleme bulunmamaktadır. Çalışmamızda risk paylaşımı içeren pay, mudarebe ve müşareke sözleşmelerine dayalı katılım esaslı KF model önerisinde bulunularak, katılım finansın değer odaklı ürün çeşitliliğini arttırmak ve kitlesel işbirliğini destekleyen yapıların tesis edilmesine katkı sunmak hedeflenmiştir."
