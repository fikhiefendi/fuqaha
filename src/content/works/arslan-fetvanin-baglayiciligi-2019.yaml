abstract: "Fetvânın bağlayıcılığı ve hatasından bahsedebilmek için öncelikle fetvânın mahiyetinin belirlenmesi gerekmektedir. Şer'î bir soruya cevap vermek olarak tanımlanan fetvâ önceleri yalnızca ictihad ehliyetini haiz müftüler tarafından ifâ edilmekteyken, zamanla mukallid müftüler de bu faaliyete dahil olmuşlar ve mezheplerin ortaya koyduğu fetvâ usulüne uygun olarak fetvâ vermişlerdir. Bu yüzden fetvâda hata probleminin değerlendirilmesi; içtihada dayalı fetvâlarda fıkıh usulü, taklide dayalı fetvâlarda da fetvâ usulü üzerinden yapılması gerekmektedir. Konunun müstefti ve müftü zemininde ele alındığı bu çalışmada mükellefin sorumluluklarının tespitinde önce anahtar niteliği taşıyan bağlayıcılık kavramı incelenmiştir. Kaynaklarda genelde istişarî bir konu olarak ele alınan fetvânın, tarih boyu manevî müeyyidelerle bağlayıcılığı devam ederken çeşitli ilmî ve siyasî sebepler gereği maddî müeyyide gerektiren bağlayıcı bir hukuk metnine dönüştüğü de görülmüştür. Bu bağlamda hatalı fetvâ karşısında müftünün medenî ve cezaî sorumlulukları, ehliyetli olup olmamasına göre değişmektedir. Bundan dolayı müsteftinin ehliyetli bir müftüden fetvâ isteyip kendi sorumluluğunu yerine getirmesi halinde, hatalı fetvâsından dolayı müftünün tazmin yükümlüğü mevzu bahis edilmiştir. Öte yandan fetvânın istişarî mahiyetini dikkate alan görüşler böyle bir yükümlülüğünün olmadığını benimsemiştir."
