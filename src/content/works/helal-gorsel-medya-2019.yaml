abstract: "Bu çalışma görsel medyanın ülke ekonomisi ile ne ölçüde ilişkili olduğunu amaçlamaktadır, Ve topluluğun ekonomik davranışı Bu, Temmuz 2013 sonrası Mısır'daki örnek olay modeli tarafından pratikte gösterilmiştir Ve Mısır'da, bu dönemden sonra rakamlarında radikal değişiklikler gören Mısır ekonomisinin ilişkisi ve ekonomik alanların medya çeşitliliği konusunda netlik vardı. Bu da beni, diğer yazılı ve sesli medyanın özetlerinde ilk hedefi temsil eden görsel medya arasındaki ilişkinin doğasını, Ve Mısır ulusal ekonomisi ile olan ilişkisi ve daha sonra görsel medyanın yasal muamele yöntemi ve ekonomi ile ilişkilerini İslami bir bakış açısıyla incelememi sağladı. Çünkü İslam hukuku hayat ve ekonomik, politik ve sosyal işleri için bir müfredat haline geldi. Mısır Merkez Bankası tarafından yayınlanan bilgi programları ve resmi raporların takibi ile, Görsel medyanın Mısır ekonomisi üzerindeki etkisi ortaya çıkmış olup, 2013 sonrası dönemde ortaya çıkan amaç ve hedefler anlaşıldı. Mısır'ın şimdiye kadar yaşadığı ekonomik krizden çıkma konusunda net bir vizyon olmadığı için vatandaşların yaşadığı ekonomik yaşamın zorluğu, Ve ülkenin ekonomik politikalarını kontrol eden, yozlaşmış ve uygun olmayan bu güç krizinden Mısır'ı kurtarmak için çalışma gereği, İnsanların birbirleriyle günlük ilişkilerinde ahlaki yolsuzluklar, ekonomik durumun düşüşüyle devlet ve toplum üzerindeki etkisinde güçlü bir ilişki içindedir. Ve İslam'ın yasal metinlerinden ve bilim adamlarının geliştirdiği içtihat kurallarından, seçkin bir medyaya duyulan ihtiyaç olması Yolsuz Batı medyasının karşısına çıkmak için gereklidir. Araştırmacı, görsel medya uygulamasının bilimsel yönünü aktive etmeyi ve basmakalıp yönünden çıkmayı ve en son ekonomik durumların sürekli değerlendirilmesini ve İslam hukukunun öğretileriyle tutarlı olan cümlelerin, kuralların ve kanunların çıkarılmasını, görsel medya ve ekonomi ile ilgili bilimsel çabaları birleştirme, araştırma ve çalışmaları daha doğru bir şekilde tahsis etme, sorunları anlama ve sağlam İslami hükümler oluşturma ihtiyacını önermektedir."
