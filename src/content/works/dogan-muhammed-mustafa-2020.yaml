abstract: "Risaletü'l-Hamdele, Muhammed b. Mustafa el-Akkirmânî'nin (ö.1760) XVIII. yüzyılda kaleme aldığı fıkıh, ibadet ve ahlâk konularını içeren, Arapça olarak yazmış olduğu bir eserdir. Akkirmânî fıkıh, kelam, tefsir, hadis, siyer, tasavvuf ve İslam ahlâk felsefesi gibi alanlarda sayısız eser yazmış, kadılık görevlerinde bulunmuş önemli bir şahsiyettir.Bu değerli âlimin eserini tercüme etmek, Osmanlı Devleti'nin XVIII. yüzyıldaki durumuna tanıklık etmesi açısından önem arz etmektedir.Bu çalışma Risaletü'l-Hamdele'nin içerik, kaynak, fikirler ve sorunsallarını ele alma açısından önemli bir kaynak mesabesindedir. Risaletü'l-Hamdele, İmam Ebu Hanife'nin el-Vasiye'sinin hâşiyesi ve Buhârîzâde'nin ahlâk ile ilgili risalesinin hâşiyesinden oluşmaktadır. Bu çalışma bir giriş, üç bölüm ve eklerden meydana gelmektedir. Birinci bölümde Akkirmânî'nin, hayatı, ilmî şahsiyeti ve eserleri ele alındı. İkinci bölümde yazarın metodolojisi ve yararlandığı kaynaklar belirlenmeye çalışıldı; eserin genel özellikleri ile muhteviyatı hakkında bilgi verildi. Üçüncü bölümde ise eserin içeriğine yönelik değerlendirmelerde bulunuldu. Bu çalışmanın temel konusu olan Risaletü'l-Hamdele'nin Türkçe ve orijinal metni de ekler kısmına ilave edildi."
