abstract: "Araştırmamızda ictihad faaliyeti açısından önem arz eden, Şârî`in gayelerine vukûfiyet düşüncesine, Hanefî mezhebi bilginlerinin hukuk mantığında ayrılan yerin tespit edilmesine çalışılmıştır.Tezimizin düzey ve hacmi açısından geniş bir furû fıkhı külliyâtına sahip bulunan Hanefî mezhebi literatürünün tamamını taramanın zorlukları göz önünde bulundurularak konumuz Hanefî furû fıkhı dendiğinde ilk akla gelen temel yapıtlardan olduğu tartışma götürmez olan Serahsî'nin el-Mebsût adlı eserindeki aile hukukuyla ilgili hükümlerle sınırlandırılmıştır.Tüm hukuk sistemlerinde olduğu gibi İslam hukukunda da önemli ve özel bir yeri bulunan aile hukuku ile ilgili hükümlerin taranması suretiyle bu hükümlerin arkasındaki aslî gayelerin yanında pek çok tâlî gayenin de tespit edilmesi mümkün olmuştur. Bu tespitlerimiz sonucunda İslam aile hukukunun gerek aslî gerekse tâlî gayelerinin tamamının -İslam Hukukunun genel olarak da nihâî gayesi olan- insanların faydasını (maslahat) te'min ve onlardan zararı uzaklaştırma düşüncesi üzerine temellendirildiğini söylemek mümkündür.Gelişen sosyal hayatla birlikte ortaya çıkan yeni meselelerin çözülmesi bakımından Şârî`in gayelerinin bilinmesinin müctehid açısından sağlayacağı yararın yadsınamaz olduğu gerçeğinden hareketle, fıkhın her dalında bu gayelerin tespiti yönünde çalışmaların yapılması gerektiği kanaatindeyiz."
