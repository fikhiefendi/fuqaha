abstract: "Yaradılışı itibarıyla topluluk halinde yaşamaya ihtiyaç duyan insanoğlu, bu ihtiyacının bir gereği olarak tarih boyunca birlikte yaşamayı kolaylaştıracak çeşitli oluşumlar vücuda getirmiştir. Söz konusu oluşumların zirvesini hiç şüphesiz devlet teşkilatı temsil etmektedir. Devletleşmenin istenilen düzeyde gerçekleşebilmesi için devletin idarî ve kazaî yapısı, bu çerçevede devlet başkanının belirlenme yöntemi ve hangi kritere göre belirleneceği önem arz etmektedir. Bu sebeple sahabe döneminden itibaren bahsi geçen konular Müslüman ilim adamlarının gündemini meşgul etmiştir. Bunun neticesinde Ahkâm-ı sultâniyye literatürü ortaya çıkmış; imâmet için aranan nitelikler, imamın göreve geliş yöntemleri ve azli, imamın görevleri gibi yürütmeyle ilgili konular ile kazâ teşkilatı ve mezâlim velâyeti gibi yargıyla alakalı hususlar ve genel anlamda devlet işleyişi, ilgili literatüre konu olmuştur. Hicrî beşinci asır, mezkûr eserlerin tedvin faaliyetlerinin yoğunlaştığı dönem olması açısından önemli bir yere sahiptir. Nitekim alandaki çalışmalara temel kaynak teşkil eden pek çok kitap bu dönemde kaleme alınmıştır. Günümüze ışık tutması açısından söz konusu eserlerin incelenerek araştırmalara konu edilmesi ve içerdiği bilgilerin ortaya çıkarılması önem arz etmektedir. Çalışmamızda Mâverdî (ö. 450/1058) ve Ebû Ya'lâ'nın (ö. 458/1066) el-Ahkâmü's-Sultâniyye'leri ile Cüveynî'nin (ö. 478/1088) el-Giyâsî adlı eseri incelenmiştir. Bu eserler yöntem ve içerik açısından ele alınmış ve aralarındaki farklılıklara yer verilmiştir. Öte yandan mezkûr eserler esas alınarak yürütme ve yargı erklerine temas edilmiştir. Bu vesileyle hicrî dört ve beşinci asırlarda varlığını idame ettiren hilâfet sisteminde devlet idaresi ve devlet-toplum ilişkisi hakkında fikir sahibi olunması amaçlanmıştır. Ayrıca bahsi geçen literatürde ortaya çıkan yönetim modeli diğer yönetim sistemleriyle karşılaştırılarak değerlendirilmeye tabi tutulmuş ve günümüze ışık tutacak yönlerine dikkat çekilmeye çalışılmıştır."
