abstract: "Evlenen çiftler konum, yetki ve sorumluluklar bakımından evlenmeden önceki hayatlarından farklı bir durumdadırlar. Aynı şekilde evliliği sona erenler de evlilik hayatlarından farklı bir duruma sahiptirler. Çünkü evlilik, birbirleriyle evlenen kadın ve erkeğe birtakım hak ve vazifeler sunduğu gibi, boşanma da boşanan taraflara hak ve görevler getiriyor. Bunlar boşanmanın sonuçları olup en önemlileri iddet ve yeni bir evlilik yapma imkanının doğmasıdır. Hemen bütün hukuk sistemlerinin kabul ettiği ve bütün toplumlarda bulunan iddet, evliliği sona eren kadının ilk ve en önemli dini ve hukuki görevidir. Bu görev yerine getirildiği takdirde en başta nesepler korunmuş olacaktır. İddet süresinde düşünüp taşınan eşler, pişmanlık duyuyorlarsa birbirleriyle; evliliklerini bitirmede kararlı iseler başka biriyle yeniden evlenebilirler. Boşanan kadınlar artık evlilik hayatlarından daha farklı bir konumda bulunduklarından yeni bir evlilik için iddet başta olmak üzere uymaları gereken yeni birtakım durumlar söz konusudur."
