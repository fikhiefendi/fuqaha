abstract: "Bu tez, sigaranın İslam hukukundaki yerini ve bu konudaki farklı Fıkhî görüşleri detaylı bir şekilde ele almaktadır. Çalışma üç ana bölümden meydana gelmektedir. Birinci bölümde, sigaranın tarihsel serüveni irdelenerek, üretim süreçleri ve sağlık üzerindeki etkileri detaylandırılmıştır. Bu kapsamda, sigaranın tarihsel evrimi ve modern çağdaki sağlıkla ilişkilendirilen olumsuz yansımaları, kapsamlı bir literatür taramasıyla ortaya konulmuştur. İkinci bölümde ise, sigaranın İslam hukukundaki statüsüne dair dini değerlendirmeler mercek altına alınmıştır. Bu bağlamda, sigaranın haram veya mekruh olup olmadığına dair fıkıh araştırmacılarının analizleri ve çeşitli İslam kurumlarının bu konudaki hükümleri ele alınmıştır. Bu bölüm, dini metinlerin yanı sıra hadis ve fıkıh literatüründen elde edilen bilgilerle zenginleştirilmiştir. Tezin üçüncü bölümünde, sigaranın İslam hukukundaki hükmü üzerine farklı Fıkhî perspektifler irdelenmiştir.“Sigara Haramdır”,“Sigara Mekruhtur”ve“Sigara Mübahtır”görüşlerinin savunucularının argümanları ve bu görüşlere temel teşkil eden kaideler ayrıntılı olarak incelenmiştir. Sonuç olarak, bu tez, sigaranın İslam hukukundaki yerini, tarihsel, sağlık ve Fıkhî boyutlarıyla ele alarak, konu hakkında kapsamlı ve akademik bir perspektif sunmaktadır."
