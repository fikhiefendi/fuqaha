abstract: "Osmanlı Devleti'nin önemli arşiv belgelerinden biri olan şer'iyye sicilleri, sosyal, iktisadî, siyasî ve idarî alanlarda geniş bilgiler içermekte olup, devletin çeşitli kazâlarından Behisni Kazasına ait 179 numaralı şer'iyye sicili de bu açıdan büyük önem taşımaktadır. 1890 ile 1893 yılları arasını kapsayan ve 1'den 156'ya kadar olan sayfalarda yer alan belgede, iki kadıya ait toplam 309 mahkeme kararı bulunmaktadır; bunların 39 adeti ikinci kadıya aittir. Ayrıca, belgenin 10 sayfası izinname defterinin transkriptiyle doludur. Bu sicil, Behisni Kazasının sosyal ve ekonomik yapısına dair zengin ve kıymetli bilgiler sunmakta, dönemin günlük yaşamı, toplumsal ilişkileri ve idarî işleyişine dair önemli veriler içermektedir. Transkripsiyonu tamamlanarak araştırmacıların hizmetine sunulan bu belge, Osmanlı tarihinin incelenmesinde ve özellikle Behisni Kazasının çeşitli yönlerinin anlaşılmasında vazgeçilmez bir kaynak olma özelliği taşımaktadır. Anahtar Kelimler: Şer'iyye Sicili, Besni (Behisni), Adıyaman, 19. Y.Y. Osmanlı Tarihi, Kadı"
