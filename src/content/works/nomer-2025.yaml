abstract: "Bu çalışma, finansal risklerin teorik temellerine odaklanmakta olup, İslami bankaların karşılaştığı finansal risklerin doğasına dikkat çekmektedir. Çalışmanın amacı, İslami bankalarda korunma araçlarını incelemek ve bu araçların, El-Rajhi Bankası'nın mukavele sözleşmeleri aracılığıyla finansal riskleri azaltmadaki etkisini araştırmaktır. Bu hedeflere ulaşmak için çalışma, finansal risklerin ve türlerinin kavramını incelemek amacıyla indüktif bir yaklaşım kullanmıştır. Ayrıca, mukavele sözleşmelerindeki korunma araçlarının doğasını ve bu araçların finansal riskleri azaltmadaki rolünü açıklamak amacıyla tanımlayıcı bir yaklaşım izlenmiş, aynı zamanda bu araçların El- Rajhi Bankası'ndaki uygulamaları da ele alınmıştır. Çalışmanın pratik kısmında ise, El-Rajhi Bankası'ndaki uzmanlara anketler dağıtarak, mukavele sözleşmelerinin uygulanma derecesini ve finansal risklerin azaltılmasına etkisini belirlemek amacıyla analitik bir yaklaşım benimsenmiştir. Çalışma, El-Rajhi Bankası'nda envanterin farklı derecelerde uygulandığı ve bu araçların finansal riskleri azaltmada önemli katkı sağladığı sonucuna varmıştır. Bu durum, El-Rajhi Bankası'nı Suudi Arabistan ve dünya bankacılık sektörlerinde en büyük İslami bankalardan biri haline getirmiştir. Banka, güvenli bankacılık açısından en yüksek sıralamalarda yer almaktadır. Çalışma, İslami bankaların, mukavele sözleşmeleriyle temsil edilen sözleşmesel korunma araçlarını ve ekonomik korunma araçlarını kullanmalarını, bunları finansal piyasalarla olan etkileşimlerinde ve çeşitli faaliyetlerinde stratejilerinin bir parçası haline getirmelerini önermektedir."
