abstract: "“İslâm Hukukunda Dârülharp Ahkâmı”adındaki bu tezimiz bir giriş ve üç bölümden oluşmaktadır. Giriş bölümü araştırmanın konusu, amacı, önemi, yöntem ve sınırlılıklarından meydana gelmektedir. Araştırmamızın birinci bölümünde dârülharp ile ilgili konular kavramsal çerçevede ele alınmaktadır. Bu bölümde özellikle dârülharp kavramının Kur'ân ve Sünnet'teki yeri, ülkelerin dârülharp ve dârülislâm diye taksim edilmeleri ve dârülharp ahkâmının ortaya çıkış sebepleri delilleriyle ele alınmaktadır. İkinci bölümde mezheplerin dârülharp ile ilgili görüşlerine yer verilmektedir. Üçüncü bölümde 'İslâm Hukukunda Dârülharp Ahkâmı' ile ilgili en çok tartışma konusu olan hükümler, Kur'ân-ı Kerim, Sünnet ve Sahabe uygulamalarına dayandırılarak klasik ve çağdaş hukukçuların görüşleri çerçevesinde işlenmektedir. Bu bölümde İslâm âleminde en çok tartışma konusu olan dârülharpte faiz ve hadlerin uygulanması konusu üzerinde durulmaktadır. Ayrıca Cuma namazı, nikâh, ikamet, hicret gibi gündemde olan konulara da yer verilmektedir. Akabinde de bu konular ile ilgili Kur'ân-ı Kerim, Sünnet ve Sahabe uygulamalarından örnekler verilmektedir. Son olarak da klasik kaynaklarda yer alan bu kavramların zamanın siyasi şartlarından ne şekilde etkilendiğine değinilerek konu bitirilmektedir"
