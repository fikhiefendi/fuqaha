abstract: "İlimler tarihinde herhangi bir ilim teşekkül edip temel metinleri ortaya konulduktan sonra o ilmin öğrenimini veya öğretimini kolaylaştıracak alt disiplinler ortaya çıkmaya başlar. Tahrîcü'l-fürû ale'l-usûl edebiyatı da böyle bir ihtiyaca binaen fıkıh ilminin alt bir disiplini olarak ortaya çıkmıştır. Özellikle günümüzde fıkıh ilminin işlevine dair tartışmalar bu disiplinin son dönemlerde daha fazla gündeme gelmesine sebebiyet vermiştir. Bu tezde ise tahrîcü'l-fürû edebiyatı içerisinde Mâlikî mezhebi çerçevesinde kaleme alınmış tek eser olan Tilimsânî'nin Miftâhu'l-vüsûl ilâ binâi'l-fürû ale'l-usûl adlı eseri incelenecektir. Eser, tahrîcü'l-fürû edebiyatındaki yeri ve öne çıkan özellikleri açısından incelemeye tabi tutulmuştur. Böylece hem edebiyat etrafında şekillenen iddialar hem de edebiyata yüklenen işlevler tartışılacaktır. Ayrıca hakkında çok fazla çalışma yapılmamış olan Tilimsânî'nin hayatı ve İslam ilim geleneğine olan katkısı ele alınacaktır."
