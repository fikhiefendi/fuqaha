abstract: "Bu çalışmada, İslâm hukuk ekollerinden Şâfiî mezhebine göre evlenmenin sonlandırılması şekillerinden talâk, hul', zıhâr, îlâ ve liân konuları ele alınmıştır. Bu konularda Şâfiî ve Hanefi mezhepleri arasında en önemli görünen ihtilaflı meseleler arasında mukayese yapılmıştır. Yapılan mukayeseler sonucu bazı meselelerde Şâfiî, bazılarında ise Hanefi mezhebi tercih edilmiştir. Bu tercihler yapılırken İslâmın genel prensipleri, Osmanlı Aile Hukuk Kararnâmesi ve Ahval'ı Şahsiyye kitapları dikkate alınmıştır. İki mezhebin ihtilaf kaynağı, delillerin farklı yorumlanması olup, mezhebi taassuptan uzak olduğu tespit edilmiştir. Çalışama esnasında genel olarak ilk dönem fıkıh kitaplarından yararlanmakla beraber tefsir ve hadis kitaplarından da istifade edilmiştir."
