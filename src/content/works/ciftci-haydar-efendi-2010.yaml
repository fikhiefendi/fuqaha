abstract: "Bu araştırmada XIX. y.y.'da İstanbul'da yaşamış olan son dönem Osmanlı hukukçusu Büyük Ali Haydar Efendi'nin Fıkıh Usûlü'ne dair yazdığı ?Usûl-ü Fıkıh Dersleri? adlı eseri örneğinde Osmanlı Devleti'nde medeni hukuk alanında kanun metni olarak hazırlanan ?Mecelle?nin Fıkıh Usûlü'ne yansımaları araştırılmıştır.Araştırmamız üç ana bölümden oluşmaktadır.Birinci bölümde eserin sahibi Ali Haydar Efendi'nin hayatı ve eserleri, ilmî kişiliği, hocaları, öğrencileri, yaptığı memuriyetler araştırılmıştır.İkinci bölümde Osmanlı Medeni Hukuku ?Mecelle?yi ortaya çıkaran nedenler, hazırlık aşamaları, yürürlüğe girmesi, İslam âlemine etkisi, yürürlükten kaldırılması, üzerinde yapılan çalışmalar hakkında bilgiler verilmiştir.Üçüncü bölümde ise ?Mecelle? maddelerinin ?Usûl-ü Fıkıh Dersleri? adlı esere yansıması, maddelerin işlenişi, metodu ile Fıkıh Usûlü konuları bağlamında bu maddelerle ilgili verilen örnekler incelenmiştir."
