abstract: "Bu çalışma son dönem Osmanlı fikir ve devlet adamlarımızdan Said Halim Paşa'nın“İslâm'da Teşkilat-ı Siyâsiye Risâlesi”adlı eserini, İslâm İdare Hukuku bakımından inceleyip ele almaktadır. Müellif, batılılaşma tartışmalarının ortasında kaleme aldığı bu eserde zorunlu olarak batılılaşma gerekiyorsa bunun idari sahada nasıl olması gerektiğini ifade etmiştir. Konuyla ilgili bazı tahlil, tespit ve karşılaştırmalara yer vermiş, Doğu ve Batı medeniyeti arasındaki farklara değinerek çözüm mahiyetinde öneriler ileri sürmüştür. Çalışmamızda ele alınan eserin daha iyi anlaşılabilmesi için ilk olarak“İdare Hukuku”kavramı açıklanmıştır. Devamında da“Tarihi Süreçte İdare Hukuku”başlığına yer verilmiş, modern hukuk ve İslâm Hukuku şeklinde ikili bir ayrımla tarihçe işlenmiştir. Sonrasında ise konumuzla ilgili kavramlar ve konunun kaynaklarına yer verilmiştir. İlerleyen bölümlerde“görevleri ve şahsiyet olarak önemi, fikir dünyası ve etkileşimde olduğu kimseler”başlıklarıyla Said Halim Paşa'nın hayatına değinilmiş, ağırlıklı olarak konuya dair düşünceleri ele alınmıştır. Ayrıca burada Said Halim Paşa'nın eserlerinin tanıtımına kısaca yer verilmiştir. Çalışmamızın son bölümünde ise“İslâm'da Teşkîlât-ı Siyâsiyye Risâlesi”adlı eserin İslâm İdare Hukuku açısından değerlendirilmesi yapılmıştır."
