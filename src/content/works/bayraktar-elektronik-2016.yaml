abstract: "Araştırmamız bugüne kadar ülkemizde İslam hukukçularınca doktora düzeyinde girilmemiş ve değerlendirilmemiş bir mesele olan İslam hukuku açısından elektronik ticareti konu edinmiştir. Bu manada ilk bölümde İslam hukuku açısından ticaret hukuku kavramlarına kısa bir değini yapılmış ve bununla ilgili çok temel bilgiler verilmiştir. İkinci bölümde İslam hukuku açısından e-ticaret incelenmiş, E-ticaretin İslam hukuk kavramlarıyla nasıl anlaşılabileceğine ve anlatılabileceğine dair görüş ve tespitlerimiz sunulmuştur. Elektronik ortamda akitleşme, irade beyanı gibi yeni durumların analizi yapılmıştır. Üçüncü bölümde ise fıkhî hükümleri açısından e-ticaret incelenmiştir. Bu bölümde de e-ticarette yeni ortaya çıkan durumlar, kavramlar ve olgular incelenmiştir. Fıkhî açıdan hangi kavramlarla açıklanacağı hususunda kanaatlerimiz sunulmuştur. İkinci bölüm değerlendirme ve analiz ağırlıklı iken üçüncü bölümde daha çok pratik sonuçları açısından durum incelenmiş, bu hususta literatüre girmesi gerektiğini düşündüğümüz yeni kavramlar ve tasnifler de zikredilmiştir. Son olarak da mevcut modern yasalarda e-ticaretin nasıl ele alındığı gösterilmiş, İslam hukuku açısından nasıl değerlendirilebileceğine dair görüşlerimiz arz edilmiştir."
addedAt: 2026-09-24
