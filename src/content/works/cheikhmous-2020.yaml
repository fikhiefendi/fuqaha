abstract: "Araştırma, Islam'da kraliyet para gelirlerinin çağdaş sorunlarımın ekonomik etkileri ele almaktadır. Araştırma problemi, hükümetin bu çağdaş sorunlarda yaptıklarının yasal olarak geçerliliği bulunan ve devlet ekonomisini geliştiren bir eylem olduğundan emin olmak adına, Islami ve Ekonomik hukuk çerçevesinde çağdaş kamu mali gelirleri felaketlerini netleştirmektir. Bu araştırmayla ilgili olarak araştırmacı, tarihsel, tanımlayıcı, analitik, tümevarim ve tümdengelim yöntemlerini benimsemiştir. Araştırma, ekonomik faaliyetlerin büyük önemini ve bazı mali faaliyetlerin yasal olarak geçerli olduğu ve ekonomiyi geliştirdiğini, bazı faaliyetlerin ise yasal olarak geçerliliğinin bulunmadığını ortaya çıkarmıştır. Asıl amaç para fonlarının himaye edilmesidir ancak fonlara el konulması Şeriatta ikincil bir ceza olup, yalnızca istisnai durumlarda uygulanır. Yasal olmayan gelirler, devlet gelirlerinde nominal bir artıştır. Ekonomik yıkımın doğrudan bir nedenidir. Ayrıca ya haramdır yani haksız kazançtır ya da faizdir yani büyük günahtır. Allah'a ve Resulüne büyük bir savaştır. Araştırma, Islam dünyasının topraklarımı, önderliğini, para birimini, altın standardını birleştirmeyi ve bunları benimsemek için çalışmayı tavsiye etmektedir"
