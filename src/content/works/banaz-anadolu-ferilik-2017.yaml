abstract: "“Anadolu'da Ca'ferîlik, Ca'ferîler ve Ca'ferîleşme Olgusu Çorum Ehl-i Beyt Vakfı Örneği”isimli doktora tezimizde, Çorum'da yaşayan bir takım Alevî vatandaşlarımızın İran İslam Devrimi'nden sonra Ca'ferîleşmesi olgusundan hareketle onların inanç, ibadet, örf ve âdetlerine ilişkin durumları incelenmeye çalışılmıştır. Tezimiz, giriş, üç ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde tezimizin konusu, amacı, önemi ve kapsamına dâir hususların yanında, araştırma yapılırken kullanılan metoddan bahsedilmiştir. Ayrıca tezimizde kullandığımız bazı kaynak eserler yine bu bölümde zikredilmiş, Şiîlik, Ca'ferîlik, Sünnîlik, Kızılbaşlık, Alevîlik ve Bektâşilik gibi tezimizin anlaşılmasındaki anahtar kavramlar hakkında özet bilgiler verilmeye çalışılmıştır. Birinci bölümde Ca'ferî mezhebine ait anlayışların Anadolu'ya girişinden, konu hakkındaki tartışmalardan bahsedilmiş ve bu amaçla XIII-XIV ve XV. yüzyıllardan başlayarak günümüze kadar gelen tarihi süreçte Safevî Tekkesi öncesindeki, Safevî Tekkesi etkisi altındaki ve Safevî Devleti kurulduktan sonraki yıllarda Anadolu'nun İmâmiye Şiîliği/Ca'ferîlik açısından durumu orta koyulmaya çalışılmıştır. Böyle bir kronolojik seyir neticesinde ise Ca'ferîliğin Anadolu'ya girişi izah edilmiştir. İkinci bölümde Türkiye'deki Ca'ferîlerin etnik yapıları, nüfus ve yerleşim yerleri, teşkilat yapıları, faaliyetleri, yayın organları ve öne çıkan yazarları incelenmiş ve ardından Türkiye'deki Ca'ferîlerin mevcut durumlarına ait genel bilgiler verilmeye çalışılmıştır. Araştırmamızın üçüncü bölümde Çorum'da yaşayan Ca'ferîleşmiş Alevîlerin Ca'ferîliğe geçiş süreçleri, inanç, ibadet, muâmelât konularındaki durumları, örf ve âdetleri, faaliyetleri, Sünnîlerle ve Alevîlerle ilişkileri, yaşadıkları toplumda karşılaşmış oldukları problemleri, talepleri ve İran ile ilişkileri gibi konular işlenmiştir. Sonuç bölümünde ise yaptığımız çalışmada ortaya çıkan durum genel hatlarıyla değerlendirilmeye çalışılmıştır."
