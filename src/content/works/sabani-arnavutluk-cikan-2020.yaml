abstract: "15. yüzyılın başından itibaren Osmanlı yönetimi altına girmeye başlayan Arnavut halkından dağlık bölgelerde yaşayanlar belli aralıklarla isyan etmişlerdir. 1560–1590 yılları arası Osmanlı ve Venedik arşiv belgeleri incelendiğinde âsilerin bağımsız bir devlet veya beylik kurma arayışı içinde olmadıkları anlaşılmaktadır. Bu isyanların en önemli sebeplerinden biri bölge halkının başına buyruk ve serazad bir tabiata sahip oluşları, en önemli bahaneleri de vergiler olmuştur. Merkezî idarenin isyancılarla ilgili gönderdiği tâlimatlarda bölge yetkililerin isyanları bastırırken şeriata ve kanuna göre hareket etmeleri gerektiği ısrarla vurgulanmıştır. Klasik İslâm hukukunda cezalar \"had\", \"kısas\" ve \"ta'zîr\" olmak üzere üç kısma ayrılmıştır. Hangi suçların had veya kısas kapsamında yer aldığı hususunda fukaha arasında belli bir anlayış birliği bulunmakla birlikte isyanın üçlü tasnifteki yerinin ne olduğu konusunda farklı görüşler ileri sürülmüştür. Mâlikî, Şâfiî ve Hanbelî fukahası isyan suçunu had kategorisinde değerlendirirken Hanefî hukukçuları ta'zîr olarak yorumlamışlardır. Bu nedenle isyancılara verilecek cezaların türü ve miktarı devlet başkanının takdirine bırakılmıştır. Osmanlı Devleti Hanefî mezhebini benimsediği için isyan suçunu da bu anlayışa göre düzenlemiştir. Osmanlı'nın klasik döneminde çıkarılan ceza kanunları isyan suçu ve cezasıyla ilgili herhangi bir madde içermemekle birlikte Arnavutluk'ta çıkan zimmî isyanlarına dair Dîvân-ı Hümâyun'un gönderdiği ferman ve hükümlerden Hanefî fıkhı doğrultusunda hareket edildiği anlaşılmaktadır. Bu konuda Osmanlı'nın gerek kanun koyucularının gerek kanun uygulayıcılarının keyfîlikten uzak, hukuka ve şeriata uygun davrandıkları görülmektedir."
