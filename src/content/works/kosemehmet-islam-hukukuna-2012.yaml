abstract: "?İslam Hukukuna Göre Akitlerde Cehalet (Bilinmezlik) ve Akde Etkisi? isimli tezimizde, insanların sosyal hayatında önemli bir yeri olan ?akitler? konusu ele alınmakta ve özellikle akitlerin geçersiz olmasında en çok etkisi görünen etkenlerden biri olan ?cehalet? konusu işlenmektedir.Bu bağlamda tezimiz, akitlerle ilgili ?Teorik Çerçeve? ve ?Bilinmezlik Kavramı, Bilinmezliğin Kapsamı, Akde Etkisi? olmak üzere iki ana bölümden oluşmaktadır.Birinci bölümde akitlerle ilgili teorik çerçeve ele alınmakta, akitlerin kuruluşu, geçerlilik dereceleri, hukukî sonuçları ve sona ermesi incelenmektedir. Tezimizin temelini oluşturan ikinci bölümde ise öncelikle bilinmezlik kavramının üzerinde durulmakta ve çerçevesi tespit edilen bilinmezliğin, özellikle satım akdi olmak üzere muhtelif akitlere tesiri ortaya konulmaktadır."
