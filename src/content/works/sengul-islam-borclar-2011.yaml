abstract: "Bu tez, bir Giriş ve üç Bölümden oluşmaktadır. Girişte tezin amacı, içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir.Birinci Bölümde asıl konumuza ışık tutması için muhayyerlik tanımı yapılarak, muhayyerliğin mahiyeti ortaya konmaya çalışılmış ve diğer muhayyerlik türleri de özetle ele alınmıştır.İkinci bölümde asıl konumuz olan görme muhayyerliği ve hukukî sonuçları detaylı bir şekilde ele alınmıştır.Üçüncü bölümde de tüketim ve tüketici kavramlarından bahsedilerek, Hukuk sistemlerinin ve özellikle İslam Hukukunun tüketiciyi koruma adına ne gibi tedbirler aldığı, bu tedbirler arasında görme muhayyerliğinin tüketici hakları açısından önemi tespit edilmeye çalışılmıştır."
