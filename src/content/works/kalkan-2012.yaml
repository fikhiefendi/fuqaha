abstract: "Bu tezde, 7./13. yüzyılın sonlarında yaşamış Orta Asyalı Hanefî âlim Hüsâmeddîn es-Sığnâkî ve onun en-Nihâye fî Şerhi'l-Hidâye başlıklı çalışması incelenmiştir. Tezde öncelikle Sığnâkî'nin hayatı ve yaşadığı dönemin ilmî şartları ele alınmış; ardından en-Nihâye'nin özellikleri, şerh yöntemi ve Hanefî fıkıh literatüründeki yeri değerlendirilmiştir. Hüsâmeddîn Hüseyin b. Alî b. Haccâc el-Buhârî es-Sığnâkî'nin günümüz Kazakistan sınırları içinde bulunan Sığnak/Sunak şehrinde doğduğu ve 714/1314 yılında Merv'de vefat ettiği kabul edilmektedir. Fıkıh başta olmak üzere usûl, kelâm ve Arap dili gibi farklı ilim dallarında eserler kaleme alan Sığnâkî, çok yönlü ilmî kişiliğiyle temayüz etmiş bir âlimdir. Sığnâkî'nin, Mergînânî'nin el-Hidâye başlıklı eserine kaleme aldığı en-Nihâye, Hanefî fıkıh literatüründe el-Hidâye üzerine yazılmış ilk şerh olması bakımından müstesna bir konuma sahiptir. Bu tezde söz konusu şerhin tanıtımı, yöntemi ve üslubu üç başlık altında incelenmiştir. Şerh'te Sığnâkî'nin, el-Hidâye'nin tasnifini takip etmekle birlikte meseleleri ayrıntılı biçimde ele aldığı, fıkhî konularla ilgili hadisleri bir araya getirerek rivayetler arasındaki farklılıkları değerlendirdiği ve ardından kendi tercihini ızhar ettiği görülmüştür. Bu yönüyle en-Nihâye, Hanefî fıkıh geleneği içinde özgün bir yere sahiptir. Bugüne kadar eser üzerine kapsamlı bir akademik çalışmanın yapılmamış olması önemli bir eksikliktir. Bu çalışmanın, Sığnâkî ve eserlerinin tanıtılmasına katkı sağlaması ve Hanefî fıkıh literatürünün daha iyi anlaşılmasına katkıda bulunması amaçlanmıştır."
