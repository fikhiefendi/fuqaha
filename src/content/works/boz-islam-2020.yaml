abstract: "İslâm dininin yüce öğütleri, hayatın her safhasında sosyal dayanışma ve yardımlaşma üzerine ısrarla vurgu yapmakta ve teşvik etmektedir. Naslar yetimin üzerinde titizlikle durmuş, onun erdemli bir yaşam sürmesi için şartlar ve esaslar va'z etmiştir. Söz konusu naslar yetimin korunması, barınması, kefaleti, malının ihsan üzere değerlendirilmesi, şefkat ve merhametle yaklaşılmasını hedeflemiştir. Hakkının gasp edilmemesi, zulüm edilmemesi, zamanı gelincede malının tam olarak teslim edilmesi, hususunda Kur'ân toplam yirmi üç kere yetime vurgu yapmaktadır. Kur'ân'ın yetimle ilgili hedefi onu azarlamamak ve haklarını korumaktır. Hz. Muhammed'in yaşamının yansıması olan sünnetinde titizlikle üzerinde durmuş, yetimin hamisi ile birlikte cennette olacağını müjdelemiştir. Bu nasların emirleri doğrultusunda Müslümanlar asırlardır vakıflar aracılığıyla yetim konusuna eğilmekte ve çözümler üretmektedirler."
titleTranslation: {"en": "The rights of orphans in İslamic law and responsibilities about orphans"}
