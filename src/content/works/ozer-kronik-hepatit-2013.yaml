abstract: "Giriş: Bu çalışmada, kronik hepatit c hastalarında ürik asit düzeylerinin pegile-interferon alfa (PEG-IFN-a) 2a/2b ve ribavirin tedavisi üzerindeki etkilerinin değerlendirilmesi amaçlanmıştır. Yöntem: Çalışmaya İzmir Katip Çelebi Üniversitesi Atatürk Eğitim ve Araştırma Hastanesi Gastroenteroloji Kliniği'ne 01.01.2005 – 01.11.2012 tarihleri arasında başvuran ve yaşları 20 ile 75 arasında değişen, tedavi öncesi e sonrası ürik asit düzeyleri ile birlikte 0, 12, 24, 48 ve 72. Haftalardaki HCV-RNA değerlerine ulaşılabilen toplam 165 hasta dahil edilmiştir. Bu parametreler, tedavi yanıtına göre belirlenen gruplarda (kalıcı virolojik yanıt – SVR, relaps ve yanıtsızlar) karşılaştırılmalı değerlendirilmiştir. Bulgular: Ürik asit düzeylerinin ve/veya karaciğer biyopsilerinin elde edilememesi nedeniyle 28 hasta çalışma dışı bırakılmıştır. Dahil edilen 137 hastanın 117'sinde hiperürisemi yoktu. Tek değişkenli analizlerde hiperürisemi ile yaş, bel çevresi, HOMA-IR skoru, kalıcı virolojik yanıt, fibrozis ve histolojik aktivite indeksi arasında anlamlı bir ilişki tespit edilmedi. Ancak hiperürisemi ile vücut kitle indeksi, hipertansiyon, metabolik sendrom varlığı ve steatoz derecesi arasında anlamlı bir ilişki tespit edildi. Çok değişkenli analizlerde ise hiperürisemi ile herhangi bir parametre arasında anlamlı ilişki saptanmadı. Sonuç: Hastalarda hiperürisemi ile steatoz arasında anlamlı ilişki tespit edilmiştir. Ancak ürik asit düzeylerinin tedavi üzerine etkisi gösterilememiştir. Bu metabolik durumu açıklayacak daha fazla çalışmaya ihtiyaç söz konusudur."
