abstract: "Yahyâ b. Âdem, yaşadığı ikinci asırda temayüz etmiş seçkin bir alimdir. O hadis sahasındaki birikimi ile birçok ravinin mercii olmuştur. Hakkında birçok övgüde bulunulmuş ve ilmi yetkinliği ulema tarafından kabul edilmiştir. Günümüze ulaşan tek eseri Kitâbü'l-Harâc'dır. Bu eserinde, fıkhın bir alt konusu olan harâca (toprak vergisi ve devlet gelirlerine) dair bilgileri hadisçi bakış açısıyla değerlendirmiştir. Eserde, merfu, mevkuf ve maktu hadisleri birlikte kullanarak eseri şekillendirmiştir. Ayrıca, harac kapsamındaki konularda kendi döneminin ve önceki dönemlerin farklı fıkhî yaklaşımlarına yer vermiştir. Yahyâ, hadisteki kabiliyeti yanında kıraat ve fıkıhta da önemli bir yetkinliğe erişmiştir. İlimdeki bu geniş yelpazesi, onun kendi döneminde öne çıkan alimlerden biri olmasını sağlamıştır. Bu çalışmada, Yahyâ'nın hayatı, ilmi kimliği ve Kitâbü'l-Harâc özelinde hadisçiliği incelenmiş ve genel bir sonuca ulaşılmaya çalışılmıştır."
