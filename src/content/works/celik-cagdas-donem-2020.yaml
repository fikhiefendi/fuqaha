abstract: "Din, insanlar için vardır. İnananların, dinlerini ve kitaplarını daha iyi daha doğru anlamaları için bazı metotlar geliştirmeleri, böylece murat olunanı tespit etmeleri ve karşılaştıkları problemlere bu yolla çözüm aramaları tabiî bir durumdur. Bu çalışmada; Abduh-Reşid Rızâ'nın Tefsîru'l-menâr ve Tabâtabâî'nin el-Mîzân fî tefsîri'l-Kur'ân adlı tefsirleri 'ulûmü'l-Kur'ân ve bazı tefsir problemleri açısından mukayese edilmiştir. Çalışma giriş ve üç bölümden oluşmaktadır. Girişte, çalışmanın amacı, yöntemi ve kapsamı belirtilmiştir. Birinci bölümde, Abduh-Reşid Rızâ ve Tabâtabâî'nin hayatları, Menâr ve Mîzân tefsirleri tanıtılmış ve Mîzân tefsiri daha detaylı bir şekilde ele alınmıştır. İkinci bölümde, ulûmü'l-Kur'ân konuları ele alınmış, müfessirlerin öncelik verdikleri konular dikkate alınmak suretiyle başlıklar belirlenmiştir. Ele alınan başlıklar/konular İslâm düşüncesinde nasıl tartışıldığına kısaca değinildikten sonra iki tefsirdeki görüşler mukayese yapılmıştır. Üçüncü bölümde, akıl din ilişkisi, mezhep taassubu ve kadın konusunu müfessirlerin tefsirlerinde nasıl izah ettikleri ortaya konulurken; imâmet, nübüvvet, velâyet ve mut'a nikâhı başlıklarında mezhebî tercihlerinin kendilerini nasıl etkilediği tespit edilmeye çalışılmıştır."
