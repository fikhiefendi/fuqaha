abstract: "Kur'an maksadını açık ve anlaşılır şekilde anlatır. Bunu yaparken çeşitli yöntem ve teknikleri kullanır. Bu yöntemlerden biri de kıssa tekniğidir. Tamamen kendine özgü bir tarzı olan bu teknik Kur'an'ın üçte birini oluşturmaktadır. İlahi kelamın bu kadar büyük bir bölümünü kapsayan kıssalar elbette bir maksatla anlatılmıştır.Kur'an'ın gönderiliş gâyesi insanların dünya ve ahiret mutluluğunu sağlamaktır. Bu saadetin gerçekleşebilmesi için maksatları anlamak gereklidir. Biz de bu maksatları anlayabilmek için, öncelikle kıssanın ne olduğunu araştırdık ve özel bir tekniği olduğunu gördük. Kıssaların amacının Kur'an'ın amacından farklı olamayacağını anladık. Kıssalardaki maksatların tümel olanlarını yani zaruriyyatı tespit ettik. Bunu en doğru şekilde yapabilmek için maksad-ı şeria'nın ve maslahat'ın ne olduğunu anlamaya çalıştık.Sonuç olarak Kur'an'ın ve kıssaların genel maksatlarının olabileceği ve bu maksatlarla usulüne uygun hükümler çıkarılabileceği görüşüne vardık."
