abstract: "Bu tez, Hanefi Mezhebinde zekât ve hac örneğinden hareketle ibadetler konusunda ortaya çıkmış içtihat farklılıklarını incelemeyi hedeflemektedir. Araştırma, beş bölümden oluşmaktadır. Birinci bölümde araştırmanın amacı, konusu ve kaynakları hakkında bilgi verilirken ikinci bölümde ibadet, taabbud ve ta'lil kavramları, ibadet hukukunun genel özellikleri ve Hanefi Mezhebinin içtihat usulü hakkında bilgi verilmiş, Üçüncü bölümde Hanefi Mezhebinde mezhep içi görüş farklılıklarının sebepleri ortaya konulmaya çalışılmıştır.Dördüncü bölümde, zekât ve hac ahkâmıyla ilgili Hanefi Mezhebinde var olan içtihat farklılığı örnekleri üzerinde durulmuş; beşinci bölümde ise çalışmanın genel bir değerlendirmesi yapılmıştır.İnsan hayatında önemli yer işgal eden ibadetlerin asıllarında (özünde) içtihadın olmayacağı açıktır. Fakat zamanın ve şartların değişmesiyle uygulama noktasında birtakım içtihatların olduğu ve olabileceği muhakkaktır. Çünkü zaman ve şartların değişmesiyle ibadetlerin ifası sırasında bir takım düzenlemelerin yapılması, organizasyonun sağlanması, insanları, karşılaşabilecekleri sıkıntı ve zorluklardan kurtarmak bakımından gereklidir."
