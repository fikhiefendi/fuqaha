abstract: "İslâm medeniyeti IX.- X. Yüzyıllara kadar gelişimini sürdürmüş; aklî ve naklî ilimlere dair pek çok eser tercüme ve telif edilmişti. Yaklaşık iki yüzyıl süren durgunluk süreci sonrası Selçukluların ortaya çıkması ile bu durgunluk sona ermiş; ilmi ve ulemâyı koruyan güçlü bir siyasi otorite altında alimler Selçuklu ülkesine gelerek çalışmalarını sürdürmüşlerdir. Bu alimlerin çalışmaları Selçuklu Devleti'nin yıkılışına kadar devam etmiştir. Selçuklu devletinin son hükümdarı olan Sultan Sencer'in 1098 yılında Horasan'a hakim olduktan sonra meliklik devri başlamış ve Selçuklu coğrafyası, Sencer'in vefatı ve Selçuklular'ın yıkılışına (1157) kadar, alınan ilmî miras ve alimlere sağlanan tüm imkânlar neticesinde İslâm dünyasının dört bir yanından alimlerin geldiği bir coğrafya haline gelmiştir. Eğitim kurumlarında ise Melikşah devrinde kurulan Nizamiye Medreseleri Sencer devrinde de işlevini sürdürmüş, Horasan yanında Maveraünnehir bölgesinde de pek çok medrese kurularak eğitim faaliyetleri devam etmiştir. Özellikle, farklı coğrafyalardan gelen ve farklı düşünce yapısı ve ekolleri de beraberinde getirerek Horasan'a yerleşen alimler sayesinde ilim dalları ve mezhebî fikirlerde büyük zenginlik ve çeşitlilik oluşmuştur. Devrin alimlerinden Gazzâlî'nin, ilimleri naklî ve aklî ilimler şeklinde iki kısma ayırması ve bu devirde yapılan çalışmalardan hareketle Sultan Sencer devri ilmî hayatı; naklî ilimlerden; Hadis, Fıkıh, Kelam, Tasavvuf, Şiir, Dil ve Edebiyat; aklî ilimlerden ise Matematik, Geometri, Fizik, Tıp, Astronomi ve Felsefe alanlarında yapılan çalışmaları içermektedir. Devrin alimleri ve yazdıkları eserler, Türk- İslâm medeniyetine katkıları ve Sultan Sencer'in sağladığı ilmi ortam bağlamında değerlendirilmiştir. Selçuklu coğrafyasında fikrî hayattaki çeşitlilik mezhebi konulara da yansımış ve ağırlıklı olarak Eşârilik ve Maturîdilik gibi sünnî mezhepler yanında Şiilik ile İmâmiye, İsmailiyye ve Batınîyye gibi fırkaları ve gayrî sünni mezhep olarak kabul edilen Mu'tezîle ekolü varlığını sürdürmüştür."
