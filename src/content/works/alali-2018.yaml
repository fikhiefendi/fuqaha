abstract: "Tezimiz, mükelleflerin“meşru/yasal olmayan kasıtlı davranış”larının mahiyetini nikah akdi özelinde açıklamayı amaçlamaktadır.“Nikah Akdi”ile“kasıt”kavramları arasında beden-ruh ilişkisinde olduğu gibi güçlü bir bağ olduğu düşünüldüğünde konunun önemi daha çok anlaşılmaktadır. Bunun yanında,“bâis/sebep-etken”,“irade”,“garaz/amaç”gibi, bazen birbirine yakın anlamlar ifade eden, bazen de iç içe geçen terimlerin farklılıklarının özenle ortaya konmasına ihtiyaç duyulmaktadır. Söz konusu durum, özellikle de terimlerin iç içe geçtiği durumlarda, ekstra dikkat ve yoğunlaşmaya ihtiyaç duymaktadır. Dolayısıyla, mükelleflerin“meşru/yasal olmayan kasıtlı davranışları”nın mahiyetini incelemeye geçmeden önce sözkonusu terimlerin anlamları, birbirlerine benzerlikleri veya aralarındaki farklılıklar, ya da terimler arasında olabilecek umum-husus gibi ilişkiler üzerinde durulması gerekmektedir. Bunu sağlamak amacıyla Giriş Bölümünü bu konuya tahsis ettik. Birinci Bölümde ise,“mükelleflerin kasıtlı davranışları”kavramını, önce genel anlamı itibariyle, daha sonra da nikah akdi özelinde ele aldık. Sonrasında da, söz konusu kavramın;“meşru/yasal olan–gayri meşru/yasal olmayan”,“mübâşir/direk olan-gayri mübaşir/dolaylı olan”gibi kısımlarını inceledik. Yapılan bu taksimin,“bâis/sebep-etken”ve“kasıt”kavramları arasında tespit ettiğimiz farklılıkları son derece hassas ölçüler çerçevesinde ortaya koyabilmiş olmamızın bir sonucu olduğunu söyleyebiliriz. Söz konusu taksim, aynı zamanda,“gayr-i meşru/yasal olmayan mübaşir/direk kasıtlı davranış”,“gayr-i meşru/yasal olmayan gayr-i mübaşir/dolaylı kasıtlı davranış”kavramlarının izahı ve bu kavramların, akdin sahih veya batıl olmasındaki etkilerini örnekleri ile incelememizin bilimsel temelini oluşturmaktadır.“Mübaşir/direk kasıtlı davranış”,“gayr-i mübaşir/dolaylı kasıtlı davranış”,“meşru/yasal kasıtlı davranış”,“gayr-i meşru/yasal olmayan kasıtlı davranış”kavramlarının bir araya geldiği durumlarda“kasıtlı davranışın taaddüdü/birden çok olması”kavramı gündeme gelmektedir ki, bu da tezimizin ikinci bölümünün başlığını teşkil etmektedir. Bu bölümde, daha önce“mükelleflerin kasıtlı davranışları”na dair yaptığımız kısımlandırmanın ışığı altında,“kasıtlı davranışların taaddüdü/birden çok olması”kavramının anlamı ve söz konusu taaddüdün nikah akdine etkisini inceledik. Tezimizin bir bölümünün anlaşılabilmesinin bir önceki bölümünün anlaşılmasına bağlı olması ve bunun doğal bir sonucu olarak da bölümler arasında var olan uyumu, tesbih tanelerinin düzenine benzetmek mümkündür. Tabi, konu hakkında yapılan okumalar esnasında ve meselenin takdiminde ekstra bir yoğunlaşmaya ihtiyaç duyuluyor olmasının da bu uyum üzerinde etkisi olduğunu inkar etmek mümkün değildir. Tezimizin son bölümünde,“gayr-i meşru/yasal olmayan kasıtlı davranış”kavramının fıkhî uygulamalarını zikrettik. Bu kavram ile fıkhî hükümler arasındaki ilişkiyi incelerken, daha önceki bölümlerde tespit ettiğimiz bilimsel esaslar çerçevesinde, fakihlerin konu hakkındaki farklı görüşleri arasında tercihlerde bulunduk. Son olarak da, tez çalışmamız esnasında elde ettiğimiz bir takım sonuçları takdim ettik. Ve konu hakkında bazı tavsiyelerde bulunduk."
