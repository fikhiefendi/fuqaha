abstract: "TÜRKÇE ÖZET“Kasım b. Kutluboğa ve Hadis İlmi'ndeki Yeri”konulu bu çalışmada, kendi döneminde önde gelen fıkıhçı ve hadisçilerden olmasına rağmen günümüzde pek tanınmayan Kasım b. Kutluboğa 'nın tanıtılması ve önemli bir fıkıhçı olmasının temel sebebini oluşturan hadisçilik yönünün ortaya konulması hedeflenmiştir. Çalışma giriş ve üç bölümden oluşmaktadır: Giriş Bölümü 'nde, Kasım b. Kutluboğa 'nın yaşadığı yer olan Kahire, onun yaşadığı 9./15. asırdaki siyasi, içtimaî, iktisadî, dînî ve ilmî durumu itibariyle incelenmiş ve böy lelikle onun hem şahsiyeti hem de ilmî kişiliğinin anlaşılmasına zemin hazırlanmıştır. Kasım b. Kutluboğa 'nın biyografisi hakkında elde edilen bütün bilgiler,“Hayatı”ve“Şahsiyeti ”başlıkları altında Birinci Bölüm 'de değerlendirilmiştir. Yine bu bölümde, hocaları ve talebeleri alfabetik olarak kaydedilip, haklarında özet bilgi verilmiştir. İlmî kişiliğinin en önemli yönünü teşkil eden 200 'e yakın eseri, İkinci Bölüm 'de ilim dallarına göre tasnif edilmiş ve her biri; isimleri, konuları, muhtevaları, varsa baskıları veya basılmamışsa yazma nüshalarının bulunduğu kütüphane kayıtları gibi özellikle riyle tanıtılmıştır. Bu bölümde ayrıca, hakkında söylenenler de zikredilmek suretiyle Kasım b. Kutluboğa 'nın ilmî yönü üzerinde durulmuştur. Son kısım olan Üçüncü Bölüm 'de ise Kasım b. Kutluboğa 'nın, Hadis İlmi 'yle ilgili te rimlere, kitaplara, râvilere ve hadislere olan vukûfiyeti, hadis tenkitçiliği ve delil kabul edip-etmemesi açısından hadis çeşitlerine bakışı değerlendirilmiş, böylelikle onun Ha dis İlmi 'ndeki yeri ortaya konmaya çalışılmıştır. Sonuç olarak Kasım b. Kutluboğa 'nın, kendi döneminde Fıkıh ve Hadis otoritelerinden biri olup, fıkhî mezhebi itibariyle Hanefî olduğu gibi, hadislere bakışta da Hanefîlerin metodlarını benimseyip uyguladığı üzerinde durulmuştur. IX"
