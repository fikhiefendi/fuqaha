abstract: "Çalışmada, İslâm hukuk biliminin teşekkül döneminde istihsân delilinin ortaya çıkışı, istihsân deliline hukuk ekollerinin bakış farklıkları, istihsân delili üzerinde yoğunlaşan tartışmaların hukukî alt yapısı ve tarihî arka plan konu edilmiştir. İstihsân delilinin tarihî süreci iki ana dönem olarak ele alınmıştır. İlki, istihsân kavramının ortaya çıktığı başlangıçtan Şâfiî'ye kadar olan dönemdir. Diğeri ise istihsân kavramının terimleştiği ve Şâfiî sonrası ama fıkhın tedvîn öncesi dönemdir. Tarihî arka planda istihsânın tanımlanması ve kıyâs karşısında konumlandığı yere göre kıyâsın, ya daha güçlü bir delil ile terk etme ya da daha güçlü kıyâsa dönüş anlamını ifade eden ictihadî istihsânın, şer'î-aklî delil olup olmama yönünden incelenmesidir. Aslında Şâfiî'nin şer'ilik ve nesnellik anlayışına bağlı olarak kıyâsın alanını genişletmesi, ictihat ve kıyâsı aynı anlama gelen iki farklı kelime olarak mana yüklemesi neticesinde oluşan kıyâs anlayışı bir nevi istihsânı terimleşme döneminde dönüştürmüştür. İlk dönemde istihsân delilinin; tanımlanıp ilkelerinin belirtilmemesi, bilginler ile yetkisiz insanları (âmme/kamu) hüküm vermede eşitleyebilecek şekilde delilsiz ve hevâ/bid'âtlere sebebiyet verecek salt akla dayalı olarak yorumlanabilecek tehlikeli yönü ifade eden hükmün sonucunu güzel görme, sonucunun güzel olabileceğine inanma ve aynı hukukî meselenin çözümünde hüküm fazlalığına sebebiyet verecek tarzda su-i istimâle açık anlamı bulunduğu, dinde taklit ruhunu ortaya çıkartacak manası olduğu gibi; şer'ân, şârînin münferid uygulamalarını da ifade eden kıyâstan daha güçlü yönleri de kapsadığı kuşkusuzdur. Bu bakış açısında, Kur'ân'ın ve sünnetin içinde de istihsân düşüncesinin de var olduğu öngörülerek, özel durumlara karşı gizli kıyâsla, daha güçlü bir delil nedeniyle genel kuraldan ayrılmak, mezhep içindeki yerleşik kuralı terk etmek, insanların ihtiyacı, yarar, fayda temin etme, zaruret (örf), adalet, maslahat gibi nedenlerle hukukçunun tamamen hukukî kaygılarıyla, hukuk formasyonu gücünde müracaât ettiği bir yöntemdir. İstihsânla; müctehidin salt gözlem ve akla dayalı, delilsiz olarak tamamen hukuk mantığı neticesinde hüküm verme, özel şart ve durumlarda benzerlerinde verilen hükümden dönülme yönüyle birlikte hukukun çizdiği sınırlar içinde had (ceza) ve miktarlarda, hâkimin takdîr yetkisiyle bağlantı kurulabilir. Çünkü istihsân mutlaka bir delile dayanmak zorundadır (vechu'l-istihsân). Bu manada istihsân, delil olmaktan daha çok hükmün dayanağını ifade etmekten başka bir anlam ifade etmemektedir."
