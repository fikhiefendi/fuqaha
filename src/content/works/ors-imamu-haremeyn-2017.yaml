abstract: "İstidlâl, usûl düşüncesini bir bütün olarak sunabilen önemli kavramlardan biridir. İstidlâl delile dayalı bir düşünmeyi ifade ettiği için bütün İslami ilimlerde tartışılmıştır. Usul-i fıkıhta ise ele alınan ilk kavramlardan biri olup zamanla farklı anlamlar kazanmıştır. En fazla kullanıldığı anlam ise delil talebinde bulunmaktır. Bu çalışmada ilk dönemlerden Cüveynî'ye kadarki süreçte istidlâl kavramının kullanıldığı anlamlar incelenmiş ve kronolojik sıra takip edilerek sunulmuştur. Cüveynî'ye kadarki sürecin incelenmesiyle onun bu kavrama katkısı tespit edilmeye çalışılmıştır. Cüveynî'nin usûlü bir bütün olarak göz önünde bulundurularak istidlâlin beşinci delil olarak sunulmasının anlamı incelenmeye çalışılmıştır."
