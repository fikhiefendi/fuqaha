abstract: "Hz. Resûl-i Ekrem Efendimiz (SAV) döneminden günümüze dek İslâm medeniyeti içerisinde müstesna bir yere sahip olan vakıflar tarih boyunca İslâm toplumlarında din, eğitim, sağlık, bayındırlık ve sosyal alanlardaki kamu hizmetlerinin finansmanını gerçekleştirmede önemli bir rol oynamıştır. Allah Teâlâ'nın rızasını kazanmak adına yapılan sadaka-i câriyelerin iktisadî anlamda adeta üçüncü bir sektör olarak kurumsallaşmış halini temsil eden vakıflar, İslâmî bir ekonomide fakirlik; gelir adaleti, kaynak tahsisatı, tüketim, yeniden dağılım ve yatırımların gerçekleştirilmesinde önemli bir aracı rolü üstlenmiştir. Özellikle Osmanlı devletinde, yaygınlık ve kurumsallaşma açısından İslâm tarihindeki zirvesine erişen vakıfların Türkiye Cumhuriyeti'ndeki serüveninin geçmişe kıyasla iktisadî açıdan nasıl bir noktada bulunduğu net olarak tespit edilememiştir. Dolayısıyla, günümüzde vakıfların İslâm tarihi boyunca gördüğü işlevleri ne ölçüde ifa ettiklerinin anlaşılabilmesine olanak sağlayacak yeteri kadar araştırma bulunmamaktadır. Bu açıdan, vakıfların Türkiye ekonomisinde oynadığı rolün tespit edilmesi mevcut durumun anlaşılmasına, sorunların belirlenmesine ve vakıfların söz konusu işlevlerini yerine getirmesine imkân sağlayabilmesi açısından önem arz etmektedir. Türkiye'deki vakıfların iktisadi işlevleri güncel durumda yükseköğretim, araştırma-geliştirme, savunma sanayi ve sosyal hizmet gibi alanlar üzerine yoğunlaşmaktadır. Çalışma kapsamında vakıf sektörü; mazbût-mülhak vakıflar, yeni vakıflar (vakıf şirketleri ile birlikte), cemaat vakıfları, irsâdî vakıflar ve vakıf üniversiteleri olmak üzere beş alt bileşeni kapsamaktadır. Vakıfların iktisadi rolünü tespit etmek için ilk olarak 2018 yılı Türkiye ekonomisinin iktisadi dinamiklerini yansıtan bir Sosyal Hesaplar Matrisi ve ona uyumlu bir Hesaplanabilir Genel Denge modelinin kullanılmıştır. Bu çerçevede vakıfların fakirlik, gelir adaletsizliği, hanehalkı refahı, üretim, gayrisafi yurtiçi hasıla, vergi yükü ve bütçe açığı gibi makroekonomik değişkenler üzerindeki etkisinin tespit edilmesi yoluyla Türkiye ekonomisindeki rollerinin ortaya konulmaya çalışılmıştır. Ardından elde edilen bulguların İslâm vakıf hukukunun bu minvalde sunduğu temel ilkeler üzerinden değerlendirilmesi ve Türkiye'deki vakıfların bu açıdan nerede durduğu tartışılmıştır."
