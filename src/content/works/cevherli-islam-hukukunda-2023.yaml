abstract: "Ortaklık müessesi, bireylerin tek başına gerçekleştirmesinin zor olduğu yatırımların başka bireylerle çeşitli açılardan bir araya gelerek gerçekleştirmelerine önemli katkılar sağlar. Ortaklıkların tesis ettiği iş bölümü sayesinde bireyler kendi kendilerine yapabilecekleri işlerden çok daha büyük ölçekte işler yapabilirler. Bu bağlamda İslam hukukundaki ortaklık çeşitlerinden mudarebe ortaklığını ele alan bu çalışmada, İslam hukukunun klasik kaynaklarından hareketle mudarebe ele alınmış, öte yandan çağdaş fetva literatüründe mudarebe ortaklıkları incelenmiş ve günümüzde katılım bankacılığında mudarebe uygulamalarının çeşitli yöntemleri ele alınmıştır. Mudarebe sadece geçmişte gördüğü işlev açısından değil, günümüzde katılım bankalarının kullandığı bir araç olması açısından da önemlidir. İslam hukukunda mudarebe ortaklığının yerini ortaya koyma amacını taşıyan bu çalışma, aynı zamanda İslam ekonomisinde mudarebe ortaklığını geçmişten günümüze; günümüz katılım bankacılığındaki uygulamalarıyla birlikte inceleme amacını taşıması bakımından diğer çalışmalardan farklılık arz etmektedir. Bu çalışmada, çalışmanın amacına uygun olacak şekilde birbirinden farklı veri toplama araçları kullanılmıştır. Araştırmanın teorik kısmında literatür taraması yapılmış; alan araştırmasında nitel araştırma yöntemlerinden yarı yapılandırılmış görüşme, doğrudan gözlem ve doküman inceleme tekniklerinden faydalanılmıştır. Katılım bankalarının mudarebe enstrümanının kullanımına dair tüm katılım bankalarının personelleri ile gerçekleştirilen görüşmeler neticesinde mudarebe enstrümanının katılım bankalarında oldukça az kullanıldığı ancak ilgili düzenlemelerle bu kullanımın artırılabileceği sonucuna ulaşılmıştır. Elde edilen veriler ışığında mudarebe finansmanının artırılmasına dair öneriler sunulmuştur. Kanun koyucu kurumlar, mudarebenin uygulandığı katılım bankaları ve toplumun mudarebeyle ilgili bilgilendirilmesi neticesinde mudarebenin toplum arasında yaygınlaştırılması mümkün olacaktır. Mudarebe enstrümanının artırılması, günümüz dünyasında İslami finansın gelişimine katkıda bulunacaktır."
