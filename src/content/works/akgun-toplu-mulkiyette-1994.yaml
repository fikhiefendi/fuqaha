abstract: "(61) ÖZET Tezimize Borçlar Kanunu, ve 6570 sy. Kanun.' da düzenlenen tahliye sebeblerini içeren bir plan içinde başladık, ilk bolümde kıra ilişkisinin özelliklerinden bahsederken, konumu z c tezimizin ikinci bölümünde kıra ilişkisinin sona ermesinden kısaca bahsettikten sonra Borçlar Kanunundan kaynaklanan cahiıye sebeplerini anlatmaya, başladık. Borçlar Kanunundan kaynaklanan Temerrüt nedeniyle tahliye, sözleşmeye aykırılık nedeniyle, hak i ı sebeplerle tahl iye, feshin ihbar ı, kıracının iflası, kıracının ölümü baslıkları altında her konuda doktrin ve Yargıtay kararları ışığında tarafların çokluğu halinde fesih, feshi ihbar ve tahliye durumlarını konunun ayrıntıları içinde inceledik. Tezimizin uçünçü bölümünde, 6570 sy. Kanundan doğan tahliye sebeplerini tahliye taahhüdü, ihtiyaç sebebiyle (mesken ve ısverı ihtiyacı, yeni malikin ıht ıvacı >, 1 k ı nakli ihtar, yeniden inşa veya imar, aynı sehır veya belediye sınırları içinde kıracının veya birlikte yaşadığı eşinin meskeninin bulunması, fuzuli işgal, baslıkları altında tarafların çokluğu halinde tahliye durumunu konunun ayrıntıları içinde ı ne eledik."
