abstract: "Konya kadı sicilleri kaynak olarak kullanılan bu çalışmada, nazarî İslam muhakeme usullerinin Osmanlı muhakeme usulleriyle pratiğe nasıl dönüştüğü ve ne şekilde uygulandığı konusuna ışık tutmayı amaçlamaktadır. Muhakeme usullerinin yanında adlî teşkilat konusunda bugüne kadar Konya sicilleri temelli yapılan çalışmalarda değinilen ancak çalışılan defter bazlı verilen bilgilere genişlik ve derinlik kazandırılarak bütüncül bir yaklaşımla değerlendirilme yapılmış ve özellikle adlî teşkilatın taşradaki en önemli temsilcisi kadı hakkında Konya mahkemesinden örnekler verilmiştir. Bugüne kadar yapılan mahkeme çalışmalarından farklı olarak mevsimsel ve dönemsel etkenlere de yer verilmiştir. Konya mahkemesine başvurma süreleri, merkez ve çevrenin mahkemeyi kullanma şekilleri mahkeme binası ve mahkeme binası dışında yapılan yargılamalar örnekleri ile izah edilmiştir. Son olarak Konya sicillerinin fiziki durumları, kayıp nedenleri, defterlerin oluşturulma şekli, defterlerdeki dava, noterlik ya da merkezden gelen çeşitli belgeler dışında kalan farklı notlar, hüccet ve hüccetlerin tanzim şekli ile ferman, berat, arz, vakfiye ve mürasele gibi belge çeşitleri örnekleriyle anlatılmıştır. Araştırma dönemi olarak mühimme ve şeriye sicillerinin bulunduğu 16. yüzyılın ikinci yarısı ile 18. yüzyılın ortalarına kadar geçen dönem (1550-1750) ele alınmıştır. Araştırma bölgesi olarak ise 16. yüzyılın sonlarından itibaren Mevleviyet kadılığı haline getirilen 17. yüzyılın sonlarından itibaren üst düzey ilmiye mensuplarına arpalık olarak verilen Konya kadılığı seçilmiştir. Tezin temel kaynaklarını16-18. yüzyıla ait Konya sicilleri ile başta mühimme defterleri olmak üzere çeşitli arşiv belgeleri ile fetva kitapları ve klasik İslam hukukuna ilişkin çalışmalar oluşturmaktadır."
