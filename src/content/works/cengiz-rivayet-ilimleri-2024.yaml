abstract: "ÖZET Kıraat ilmi Kur'ân'ı Kerîm'in dil, anlam ve okuyuş birlikteliğini sağlar. Hz. Peygamber'den günümüze ve kıyamete kadar sahih bir şekilde iletilmesi ve korunmasında âmildir. Çalışmamızda Mâverdî'nin (ö.450/1058) en-Nüket ve'l-uyûn adlı eseri ile İbnü'l-Cevzî'nin (ö.597/1201) Zâdü'l-mesîr adlı eserlerinde kıraatlerin kullanımı ve hadis kıraat kavramlarında müşterek olan kavramlar konu edilmiştir. Müellifler IV. ve VI. yüzyılda yaşamışlardır. Hz. Peygamber'e, sahâbeye, kıraat imamlarına, râvilerine atfedilen farklı kıraatler ele alınmış ve mukayese hedeflenmiştir. Böylelikle eserler baştan sona tetkik edilmiştir. Tespit edilen kıraat farklılıkları müellifler tarafından mahirane işlenmiştir. Bu farklılıklar Kur'ân'ın anlam zenginliği olarak addedilmiştir. Çalışma giriş ve iki bölümden oluşmaktadır. Girişte müelliflerin hayatı ve eserleri anlatılmıştır. Birinci bölümde kıraat ilmi hakkında bilgi, kıraat ve hadiste ortak kullanılan kavramlar açıklanmış, hadis- kıraat mukayesesi yapılmıştır. Hadis, tefsir ve kıraatte müşterek kullanılan kavramlar farklı kıraat kaynakları ile mütâlaa edilmeye çalışılmıştır İkinci bölümde eserlerde geçen kıraatlerin mukayesesi açıklanmıştır. Çalışmanın neticesi sonuçlara yansıtılmıştır."
