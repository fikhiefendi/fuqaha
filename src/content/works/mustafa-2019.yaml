abstract: "Bu tezde usul-ü fıkıh ilmindeki örf konusu ve örf konusunun alış-verişteki tatbikatı incelendi. Öncelikle örfün tarifi yapıldı ve örf kavramının oluşumu anlatıldı. Sonra örfün delil oluşu ve âlimlerin örfle amel konusundaki ihtilafları delilleriyle beraber anlatıldı ve tarafların delilleri değerlendirildi. Ayrıca örfün şartları, önemi, kullanım alanları ve deliller içerisindeki konumu ele alındı. Sonra örfün kısımları ve bu kısımların alış-veriş babındaki tatbikatı anlatıldı. Araştırmacı örfü üç kısım olarak ele aldı ve konuyu incelerken tümdengelim metodunu kullandı. Ayrıca üç kısım için ayrı ayrı eski ve yeni örnekler verdi. Sonra örfle ilgisi olan fıkhî kâideler anlatıldı. Araştırmacı“Zamanın değişmesiyle ahkâmın değişmesi inkâr edilemez”kaidesi için özel bir bahis açtı. Bu kaidenin manasını, delillerini, sübutunu ve örften etkilenen hükümleri anlattı. Bu hükümleri anlatırken pratikten örnekler verildi ve bu örneklerin insanların örf ve adetlerinin değişmesiyle nasıl değiştiği izah edildi. Yapılan Bu Çalışmada Şu Sonuçlara Ulaşılmıştır: a. İstisnasız olarak âlimlerin hepsi örfü delil alarak kabul etmiş ve örfle amel etmiştir. Ancak örfün delil olması konusunda âlimler ikiye ayrılmıştır. Bazıları onu müstakil ve asıl delil kabul ederken, bazıları ikincil ve tâbî delil kabul etmiştir. İnceleme ve araştırmada sonucunda örfün ikincil ve tâbî bir delil olduğu görüşünün tercihe şayan görüş olduğu ortaya çıkmıştır. Çünkü örf kendi başına bir hüküm ortaya koyamaz. Örfle irtibatlı olan bütün hükümler diğer ana delillerle irtibatlıdır. b. İslam hukukunda örfün çok önemli bir yeri vardır. Özellikle Şeriatın maksat ve gayelerini ortaya koymada örfün etkisi büyüktür. Örf, İslamî hükümlerin insanlar açısından ne derece uyumlu olduğunun en önemli delillerinden ve İslam fıkhının zengin kaynaklarından biridir. İnsanların ve toplumların örf ve adetlerini bilmek müçtehit, müftü ve kadı için olmazsa olmaz şartlardandır. c. Örfün kısımlarını bilmenin büyük faydaları vardır. Bu bilgi araştırmacıya araştırma yaparken daha bir dikkatli olmasını sağlar ve hükmü vakıaya uyarlarken yardımcı olur. d. Kavâidu'l-fıkhiyye ilminde örf konusuyla ilgili yeterince araştırma yapılmıştır.“Âdetler hakem tayin edilir”kâidesi, bütün fıkıh meselelerinin -bir şekilde- bağlantılı olduğu beş küllî kâideden biridir. Mecelletü'l-Ahkami'l-Adliyye örf konusuyla alakalı on tane kâide zikretmiştir. Şüphesiz bu örfün fıkıh usûlü ilminde ne kadar önemli olduğunu ifade etmektedir. e. İnsanların örf ve adetleri şüphesiz değişkendir. Devamlı değişir ve yenilenir. Örfe dayalı olan hükümlerde insanların örf ve adetlerinin değişmesine binaen değişir. Bu temel ilke İslam fıkhının genişliğine, uyumluluğuna ve bütün çağlar için elverişli olduğunun delilidir."
