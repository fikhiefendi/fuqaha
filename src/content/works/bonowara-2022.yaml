abstract: "Allah bizim için finansal işlemleri emretti; Ekonomik hareketliligi ve gelişimini kolaylaştırdık ve bunun için insanları birbirine zulmetmekten koruyan kontroller koyduk. Yeni meselelerden bazıları, kolaylaştırma ve gelişmeyi sağlayan şeylerden biri olmakla adaletsizlik ve şüpheli islemler arasında dönüyordu. Araştırma، kavramının tanımını، imajını، fıkhî uyarlaması ile ilgili alimlerin koydugu hüküm ve kaidelerini, mesele ile ilgili delillerini açıklamayı, aralarindaki farkı tartışmayı içerdiğinden, borç ve alacaklarda yapilandırma meselesinin bir çalışmasıdır. Bunun için de (borç ve vadeli satış) kavramının incelenmesi, bunların dayanaklarının ve türlerinin her sözleşmedeki yerinin açıklığa kavuşturulması tezde yer almıştır. İslami bankalarda yapılandırmayı devreye alma ve hızlandırma konusuna açıklık getirdik. Konunun bankaların borç planlaması ile alakalı olduğu kanısına vardım. Anahtar elimeler: Koy ve acele et، borç، kredi، merdiven، vadeli satış, taksitli satış Ekonomi, İslam ekonomisi, İslami bankalar, finansal işlemler."
