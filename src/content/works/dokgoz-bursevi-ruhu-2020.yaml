abstract: "Bu doktora tez çalışması İsmail Hakkı Bursevî'nin 'Rûhu'l-Beyân' adlı tefsirindeki, usûl-i fıkıh ve fürû'a dair görüşlerinin ortaya çıkarılması amacıyla yapılmıştır. Çalışmamızı bu tefsiri esas alarak yapmamızın temel sebeplerinden birisi bu eserin işârî/tasavvufî tefsir özelliği taşımasıdır. İşârî (tasavvufî) tefsir, mutasavvıf müfessirin Kur'an ayetlerini okuduğunda kalbine doğan manalar ile oluşturulan tefsir olduğundan kendine has özelliklere sahip bir tefsir türüdür. Ahkam ayetlerinden hüküm çıkarma faaliyeti ise fıkıh usulü kaideleri çerçevesinde objektif kurallara tabi olan bir eylemdir. Bu nedenle işârî bir tefsirin ahkam ayetlerine yaklaşımının ve yorumlama metodunun tespit edilmesinin önemli bir gereklilik olduğunu düşünüyoruz. Tezimiz dört bölümden oluşmaktadır. Birinci bölümde tefsir, te'vil, işârî tefsir kavramları hakkında açıklamalarda bulunulmuştur. İkinci bölümde İsmail Hakkı Bursevî'nin hayatı ve ilmî kişiliği üzerinde durulmuş, 'Rûhu'l-Beyân' tefsiri hakkında bilgiler verilmiştir. Üçüncü ve dördüncü bölümler tezimizin ana bölümlerini teşkil etmektedir. Üçüncü bölümde İsmail Hakkı Bursevî'nin ahkam ayetlerini yorumlama metodu, fıkıh usulü sistematiği ve kuralları çerçevesinde değerlendirilmiştir. Dördüncü bölümde ise Bursevî'nin fürû'a dair görüşleri ele alınarak değerlendirilmeleri yapılmıştır. Bursevî'nin ahkam ayetlerini yorumlama ve fürû'a dair görüşlerinin incelenmesi sonucu elde edilen bulgular 'sonuç' kısmında özetlenerek aktarılmıştır. Çalışmamızda işârî tefsirlerin fıkhî yönüne dair önemli tespit ve bulguların ortaya konulduğu kanaatindeyiz. Bu çalışma neticesi gördük ki, tasavvufî tefsir yazan mutasavvıflar genel fıkıh kaynaklarından ayrıca ilham, keşf ve rüya gibi tasavvufî bilgi kaynaklarını da kullanmaktadırlar. Ayrıca müçtehitlerce ortaya konulmuş mevcut fıkhî hükümleri tercih konusunda da bir takım tasavvufî ilkeler çerçevesinde hareket etmektedirler. Bu durum fıkhî hükümlerin tasavvuf mensuplarının yaşamlarına aktarılması üzerinde tasavvufî anlayışın etkilerinin mevcut olduğunu göstermektedir."
