abstract: "Tarih boyunca ye~itli dinlere inanml~ olan Uygurlar farkh zamanlarda farkh topluluklar halinde ye~itli dinlere mensuplardl. 10 yUzyl1dan itibaren Islam dininin Dogu Tiirkistan'a ginnesiyle Uygurlar topluca miisliiman olmu~lar. Uygurlar bu tarihten giiniimiize kadar yok ye~itli zulumlere ugraml~ olmalarma ragmen benliklerini korumayl ba~arnl1~lardlr. Aym zamanda Uygurlar siiuni mezheplerden biri olan Hanef! mezhebini benimseyerek bu mezhebin Dogu Tiirkistan'a yayllmasma vesile olmu~lardlr. Zamanla islam dini ve Hanefi mezhebi Dogu Tiirkistan'da kokle~erek toplum hayatml degi~tinni~tir. Bu kapsamda Hanefi m~hml yok iyi bilen iilimler yeti~mi~ ve Dogu Tiirkistan'm genelinde yapllml~ olan biryok medresede ders vererek ogrenciler yeti~tirmi~lerdir. islam dinini oZiimseyen Uygurlar Dogu Tiirkistan'm biryok yerinde ibadet etmek iyin camiler in~a etmi~lerdir. Uygurlar sosyal hayatlanm da islam dinine gore diizenleyerek kar~lla~tlklarl sorunlarl yozmek iyin ~eriat mahkemeleri kunnu~lardlr. Bu tezimizde 10. yUzyl1dan beri miisliiman olan Uygurlar'm Dogu Tiirkistan'da sosyal alanda yapml~ olduklan degi~iklikleri, in~a ettikleri medreseleri, camileri ve hukuki sorunlarml yozmek iyin kurduklarl ~eriat mahkemeleri incelenmektir, genel olarak Hanefi mezhebinin Dogu Tiirkistan'da giiniimiize gelene kadar ne gibi degi~ikliklere ugradlgl ve bu konuda verilen eserleri ara~tlfllmaktadlr."
