abstract: "Kadı sicilleri her ne kadar mahkemelerde verilen kararların ve tutulan kayıtların toplandığı defterler olsa da kaydedildiği yerleşim yerinin idari, sosyal, ekonomik ve kültürel yapısına ilişkin inceleme yapan araştırmacılar için önemli bir kaynak niteliğindedir. Nitekim kadı sicilleri, toplumun her kesiminden insanların birbirleriyle ve devletle olan ilişkilerini, yaşadıkları problemleri ve bunların çözüm seyrinin nasıl olduğuna dair başka kaynaklardan edinilemeyecek bilgileri içermektedir. Kırım Hanlığı Kadı Sicilleri de hanlık döneminden geriye kalan belgeler arasında önemli bir yere sahiptir. Bu çalışma Kırım Hanlığı'na bağlı Gözleve şehrine ait H. 1107-1108/M. 1696 tarihli 31 numaralı Kırım Hanlığı Kadı Sicili'nin transkripsiyon ve değerlendirmesinden oluşmaktadır. Transkripsiyon ve değerlendirme sonucunda Gözleveli şehir sakinlerinin dinleri, etnik aidiyetleri, meslekleri, yaşadıkları yerler, aile yapıları, asayişe konu olan hususları, maddi kültürleri, ekonomik durumları, birbirleriyle ve devletle olan ilişkileri ele alınarak şehrin etnik, sosyal ve ekonomik durumu aydınlatılmaya çalışılmıştır."
