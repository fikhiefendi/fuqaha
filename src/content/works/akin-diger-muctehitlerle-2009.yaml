abstract: "?Diğer Müçtehitlerle Farklılıkları Bağlamında Ebû Hanife'nin İçtihat Mantığı? isimli tezimizde, Hanefî fıkhının kurucusu ve İslâm Hukuk doktrinini şekillendiren baş mimarlardan birisi olan Ebû Hanife'yi diğer müçtehitlerden farklı kılan içtihatları ve bu içtihatlardaki mantığı ele alınmaktadır.Bu bağlamda tezimiz, ?Ebû Hanife'nin Hukuk Mantığını Oluşturan Etkenler? ve ?Ebû Hanife'nin Hukuk Mantığına Yansıyan Genel İlkeler? olmak üzere iki bölümden oluşmaktadır.Birinci bölümde, Ebû Hanife'nin düşünce yapısını, dolayısıyla da hukuk mantığını şekillendiren fizîkî ve sosyo-kültürel çevreyi inceledik.İkinci bölümde ise, Ebû Hanife'yi diğer müçtehitlerden ayıran içtihatları ve bu içtihatlarda etkili olan genel ilkeleri ortaya koymaya çalıştık."
