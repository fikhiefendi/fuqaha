abstract: "Bankacılık ve finans günümüz ekonomilerinin en önemli temel taşıdır. Bu sebeple ülke ekonomilerinde de çok önemli bir yere sahiptir. Bankacılık ve finans sisteminin güçlü olması, ülke ekonomilerinin de güçlü olmasını sağlayacaktır. Bankacılığın büyümesi ve gelişmesiyle ülke ekonomisinin de büyümesi ve gelişmesi aynı yönde doğru orantılı olarak artacaktır. Dolayısıyla ülke ekonomilerini etkileyen en büyük etkenlerden birisinin bankacılık olduğu görülmektedir. Bu araştırmada amaç; Türkiye'deki bankaların finansal yapılarını inceleyerek bankaların finansal yapılarının müşteri tercihine etkisini araştırmaktır. Araştırmada Türkiye'deki bankaların 2009 ile 2013 yılları arasındaki finansal yapıları incelenmiş olup 2009 yılı öncesi kapsam dışı bırakılmıştır. Araştırmada bankaların finansal yapılarını incelemek amacıyla en kuvvetli veri kaynağı olarak görülen Bankacılık Düzenleme ve Denetleme Kurumu (BDDK) verilerinden ve Türkiye Bankalar Birliği (TBB) verilerinden yararlanılmıştır. Toplumun banka tercihlerinde bankanın finansal yapısının etkisini araştırmak amacı ile araştırmacı tarafından“Bankaların tercih tutum ölçeği”geliştirilmiştir. Araştırma internette bulunan“surveey”anket sitesi üzerinden yapılmıştır. Araştırmaya 549 kişi katılmıştır. Araştırmanın geneline bakıldığında bankaların 2009-2013 yılları arasında toplam aktiflerinin, öz kaynaklarının, kredilerinin, mevduat ve fon toplamlarının düzenli olarak arttığı görülmüştür. Bunun yanında bankaların finansal yapılarının müşteri tercihine etkisi olduğu özellikle bankaların şube sayısı, ATM sayısı ve banka tarafından alınan masrafların müşteri tercihinde etkisi olduğu sonucuna ulaşılmıştır."
