abstract: "Çalışmamız giriş ve üç bölümden meydana gelmektedir. Birinci bölümde; Diyanet işleri Başkanlığı ve hutbelerin mahiyeti ve tarihi konuları üzerinde durulmuş, Diyanet işleri Başkanlığı'nın kısa bir tarihçesi ve teşkilat yapısı açıklanmıştır. Ayrıca geçmişten günümüze kısaca hutbeler irdelenmiştir. İkinci bölümde Diyanet işleri Başkanlığı Hakkâri İl Müftülüğünce 2015-2016 yıllarınca hazırlanan hutbelerde geçen hadislerin tahric ve tahlili yapılmıştır. Hadislerin kaynağı gösterilmiş, tercüme ve tahlili yapılmıştır. Üçüncü bölümde; hutbelerde kullanılan hadislerin kullanım yöntemi ve genel bir değerlendirmesi yapılmıştır. Çalışmamız sonuç ve bibliyografya kısmıyla neticelenmiştir."
