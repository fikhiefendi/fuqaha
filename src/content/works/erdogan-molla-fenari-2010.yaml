abstract: "Çalışmamız bir giriş ve dört bölümden oluşmaktadır. Giriş bölümünde Molla Fenârî'nin Yaşadığı asra genel olarak baktıktan sonra Molla Fenârî'nin hayatı, öğrencileri ve eserleri hakkında bilgi vermeye çalıştık.Birinci bölümde Molla Fenârî'nin Usul-i Fıkıh ilmi ile ilgili yapmış olduğu tanımı anlattıktan sonra Fusûlü'l-Bedâi? isimli eserin kaynaklarını vermeye çalıştık.İkinci bölümde, İslâm hukuk kaynakları, kaynaklardan hüküm çıkarma metotları, hükümlerin gayeleri, teâruz ve tercih hakkında Molla Fenârî'nin yaptığı tanım ve açıklamaları vermeye çalıştık.Üçüncü bölümde, Molla Fenârî'nin İslâm hukuk kaynaklarından çıkarılan hükümler hakkındaki görüşlerini vermeye çalıştık.Dördüncü bölümde, Molla Fenârî'nin ictihad, taklid ve fetvâ meseleleri ile ilgili görüşlerini izah etmeye çalıştık.Çalışmamızda şu sonuca vardık. Eserini kendisinden önce yaşayan Hanefî âlimlerin görüşleri açıklamak için yazan Molla Fenârî eserinde, Hanefî ve Şafiî âlimlerince kabul edilmiş kaideleri mukayeseli olarak bir araya getirmiş, Hanefî ve Şafiî mezhepleri arasındaki bazı usûl farklarını birleştirip birbirine uzak olan mefhumları uzlaştırmıştır. Birçok meselede kendisinden önce yaşayan usulcülerin görüşlerini almış, tartışmalı meselelerde kendisine göre tercihler yapmış, nakil ve akıl arasında tam bir uyum oluşturmaya çalışmıştır.Anahtar Sözcükler1.Molla Fenârî2.Fusûlü'l-Bedâi?3.Usûl-i Fıkıh4.İslâm Hukuku5.Şeyhülislâm"
