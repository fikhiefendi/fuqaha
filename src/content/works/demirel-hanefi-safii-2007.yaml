abstract: "?Hanefû ve Şafiû Fıkhında Zekât le lgili Farklı Görüşler? isimli tezimiz bir girişile dört bölümden meydana gelmektedir. Giriş bölümü araştırmanın amacı, önemi,sınırları ve yönteminden oluşmaktadır.Birinci bölümde zekâtın vücubunun şartları ile edasının şartlarını Hanefû ve Şafiûmezhep imamlarının görüşleri doğrultusunda tespit edilmeye çalışılmıştır. ki mezhebinfarklı görüşlerinin yanında mezhep içerisinde âlimlerin farklı görüşlerine de yerverilmiştir.kinci bölümde zekâtı vacip olan mallar her bir mezhebe göre tespit edilmeyeçalışılmıştır. Bunun yanında farklı görüşler de işlenmiştir.Üçüncü bölümde zekâtın verileceği kimseler mezheplere göre tespit edilmeyeçalışılmıştır.Dördüncü bölümde ise sadaka-i fıtır konusu işlenilmiştir. Vücubunun, edasınınşartları ile sadaka-i fıtır miktarı mezheplere göre tespit edilmeye çalışılmıştır."
