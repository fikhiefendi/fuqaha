abstract: "Kaynaklarda aralarında Hanefî âlimlerin de bulunduğu pek çok muhaddis ve fakîh, sahâbî kavlini şer'î bir delil kabul edip onunla amel ettiklerine, kitap, sünnet ve icmâ'dan muahhar, kıyastan ise mukaddem kabul ettiklerine yönelik Ebû Hanîfe (ö. 150/767), Ebû Yûsuf (ö. 182/798) ve Muhammed eş-Şeybânî (ö. 189/805)'den müsned ve gayrı müsned otuzu aşkın rivâyette bulunmuştur. Öte yandan Ebû Hanîfe ve İmâmeyn kıyasla/akılla idrak edilsin ya da edilmesin fer'î meselelere verdikleri birçok hükme sahâbe kavillerini gerekçe olarak sunmuş ve sahâbe kavli karşısında kıyası terk etmişlerdir. Ancak bütün bunlara rağmen, pek çok Hanefî usûl âlimi imamların, akılla idrak edilemeyen hususlarda kendi nesilleri içinde hiçbir muhâlefet olmaksızın bir sahâbîden rivayet edilen sahâbî kavliyle amel ettiğini, akılla idrak edilebilen konularda ise sahâbî kavliyle amel ettiklerine yönelik onlardan hiçbir rivâyet gelmediğini, hatta onların akılla idrak edilebilen konularda sahâbî kavli hususundaki tatbikatlarının birleşmediğini ve sahâbî kavlini kıyasa takdim etmediklerini iddiâ etmiştir. Bunun yanı sıra Hanefî usûl bilginleri, kendi nesilleri içinde hiçbir muhâlefet olmaksızın bir sahâbîden nakledilen sahâbî kavlinin kıyasla/akılla idrak edilemeyen konularda hüccet olduğu hususunda ittifak etmişler, kıyasla/akılla idrak edilebilen konularda kıyastan mukaddem olup olmadığı konusunda ise iki gruba ayrılmışlardır. Ebû Saîd el-Berdâî (ö. 317/930)'nin öncülük ettiği ilk grup, gerek akılla/kıyasla idrak edilemeyen gerekse de edilebilen hususlarda sahâbî kavliyle amel etmenin vâcip olup, sahâbî kavli mevcutken kıyasa gitmenin câiz olmadığını savunurken, Ebû'l-Hasen el-Kerhî (ö. 340/952)'nin başını çektiği ikinci grup ise, yalnızca akılla/kıyasla idrak edilemeyen hususlarda sahâbî kavli ile amel etmenin câiz olduğunu ve sahâbi kavlinin kıyas karşısında herhangi bir üstünlüğünün bulunmadığını söylemiştir."
