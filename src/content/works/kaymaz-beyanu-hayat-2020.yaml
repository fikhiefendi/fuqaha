abstract: "Tefsir faaliyeti Kur'ân'ı anlama ve yorumlama faaliyetidir. Kur'ân'ın ilk nüzûlünden günümüze kadar çeşitli metotlarla bu faaliyet sürdürülmüştür. Bu çalışmada M. Zeki Duman'ın telif ettiği Beyânu'l-Hak ve M. Sait Şimşek'in telif ettiği Hayat Kaynağı Kur'an Tefsiri adlı eserler mukayaseli olarak ele alınmış ve ne tür bir tefsir etkinliği yaptıkları tespit edilmeye çalışılmıştır. Ayrıca müelliflerin eserlerinde hangi yöntemi kullandığı, okuyucuya ne gibi yenilikler sunulduğu, nesh, müteşabih gibi konulara yaklaşım, çağdaş problemlere getirilen çözüm önerileri, iki eserde öne çıkan görüş ve anlayışların ne olduğu hangi konularda aralarında ittifakın ya da ihtilafın olduğu ve bunların hangi sebeplerden meydana geldiği incelenmiştir."
