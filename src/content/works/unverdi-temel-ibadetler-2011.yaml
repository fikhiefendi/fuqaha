abstract: "Hicri III. asrın sonlarına doğru sistemleşmeye başlayan, günümüze kadar ulaşmayı başaran ve günümüzde ülkemiz de dâhil olmak üzere, birçok ülkede yaygınlık kazanan, sünnî ekole mensup fıkhî mezheplerden, Hanefî ve Şâfiî mezheplerinin, birçok konuda ihtilâf ettikleri, bilinen bir gerçektir. Bu ihtilâfların, daha çok uygulanagelen temel ibadetler alanında öne çıktığını görmek mümkündür.Bu iki mezhep de, diğer mezhepler gibi, temellerini İslam'ın iki ana kaynağı, Kur'an ve Sünnet'e dayandırmış ve İslam teşriînin anlaşılması hususunda, bu iki kaynak dışında, delillerini açıklamaya yardımcı olacak birçok metodu ( icma-kıyas-istihsan vs.) kullanmışlardır. Kullanılan bu metodlar ve deliller, birçok ihtilâflı meseleye kapı aralamıştır. Varılan ihtilâflar sonucu, toplumda bazı problemler kendisini aksettirmiş ve bunun sonucunda da, fırkalar, mezhep taassupları, zaman içerisinde birbirlerinin görüş ve delillerini çürütme gayesi içerisinde olan, farklı görüşlere mensup oluşumlar ortaya çıkmıştır.Geçmişte çok fazla kendini hissettirmemekle birlikte, günümüzde, mezhep telakkisinin yanlış aksettirilmesi sonucu, Hanefî-Şâfiî anlayışı ön plana çıkmıştır. Oysa her iki mezhep de ulaştığı sonuçları, Kur'an'a ve Sünnet'e dayandırmış, bu görüşleri kendilerine mal etmeden, hükümlerin, sadece nassların anlamından çıkan bazı fürû meselelerine dair olduğunu ispata çalışmış, sünnî ekole mensup mezheplerdir. Bu ihtilafların İslam toplumu için bir rahmet ve kolaylık olduğunu idrak etmek gerekir. Çalışmamızda her iki mezhebin ihtilaf ettikleri temel meseleleri, mukayeseli olarak delilleriyle beraber izaha çalışacağız."
