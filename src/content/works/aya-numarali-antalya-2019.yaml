abstract: "Altı asır boyunca hüküm sürmüş Osmanlı Devleti, bünyesindeki birçok etnik, dini ve kültürel farklılıklara rağmen devleti ayakta tutan güçlü bir hukukî yapıya sahiptir. Osmanlı Hukuku'nun esasını İslam Hukuku oluşturmaktadır. Osmanlı Devleti'nin hüküm sürdüğü dönem içerisinde kendine özgü hukukî bir yapı geliştirdiği anlaşılmaktadır. Osmanlı hükümdarlarının kendilerine tanınan haklar ve alanları doğrultusunda ortaya koymuş oldukları hukuk kuralları göz ardı edilemez. Osmanlı Hukuku'nun temel öğeleri arasında Şer'iyye Mahkemeleri'ni ve bu mahkemelerce kayıtlara geçirilen Şer'iyye Sicilleri'ni görmekteyiz. Osmanlı tarihi açısından birinci derecede kaynak değeri taşıyan bu defterlerden muhteva bakımından akla gelecek birçok konuda geniş veriler elde edilmekle beraber yazıldığı döneme ve mahâle ilişkin sosyal, ekonomik, adlî ve idarî konularda önemli veriler elde edilmektedir. İncelemesi yapılan 99 Numaralı Antalya (Finike) Şer'iyye Sicili Defteri 1916-1924 yılları arasında tutulmuş olup sicilden elde edilen verilere dayanılarak Finike'nin 20. yüzyıl başlarındaki sosyo-ekonomik durumu değerlendirilmeye çalışılmıştır. İncelenen hükümler genellikle Antalya Sancağı'na bağlı Finike'ye ait olmakla birlikte defterde Elmalı Kazası'na ait olan hükümler de mevcuttur. Değerlendirilen 99 Numaralı Antalya (Finike) Şer'iyye Sicili Defteri yazıldığı dönem itibariyle büyük önem taşımaktadır. Defter Osmanlı Devleti'nin çöküş dönemi ve Türkiye Cumhuriyeti'nin kuruluş dönemi safhasında tutulmuştur. Osmanlı Devleti'nin yaşamış olduğu bu geçiş evresini tam anlamıyla gözler önüne sermektedir. Defterde Antalya'nın ve Finike'nin bu idarî değişiklikten nasıl etkilendiği ve Antalya'nın sancaktan vilayet statüsüne yükseliş evresini takip edebilmekteyiz. Bunun yanısıra defterin 1916-1924 yılları arasında tutulması hasebiyle I. Dünya Savaşı ve Anadolu'da başlatılmış olan Milli Mücadele hareketinin Finike'ye yapmış olduğu etkiler de 99 Numaralı Antalya (Finike) Şer'iyye Sicili Defteri'nden elde ettiğimiz bilgiler ışığında gösterilmeye çalışılmıştır."
