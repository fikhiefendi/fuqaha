abstract: "İzmirli İsmail Hakkı, ülkemizde yetişen önemli bilginlerden biridir. O'nun İslami ilimler alanında çok sayıda eseri bulunmaktadır. Bu eserler içerisinde İlm-i Hilâf önemli bir yere sahiptir. Eserin önemi, alanında yazılmış ilk Türkçe kaynak olmasından kaynaklanmaktadır. Tezimizde bu eseri Fıkıh Usûlü açısından değerlendirmeye çalıştık.Bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde İzmirli İsmail Hakkı'nın hayatı, tahsili, eserleri ve fıkıh anlayışı üzerinde durulmuştur. Yine bu bölümde hilâf ilminin tanımı, doğuşu ve hilâf ilmi hakkında yazılan eserlere değinilmiştir.Birinci bölümde, İzmirli İsmail Hakkı'nın ele aldığı şer'î delillerden ictihâd, fetvâ ve tercih konularına yer verilmiştir.İkinci bölümde, İzmirli İsmail Hakkı'nın bazı alanlara etkisi ve O'nun hakkında yapılan değerlendirmeler üzerinde durulmuştur. Sonuç bölümünde ise kısa bir değerlendirme yapılmıştır."
