abstract: "Araştırmanın en önemli hedeflerinden biri tek bir kişinin zor şartlar altında toplumunun gelişmesine etkisini tespit etmektir. Bu konu ele alınırken ilmi ve derin anlayışı ile temayüz etmiş örnek şahsiyetlerden Mustafa Zerkâ ve Mustafa Sıbâî seçilmiştir. Bu iki alimin çok emek sarf ederek telif ettikleri ilmî eserler ve bu eserlerin amelî alana yansımaları, araştırma ve incelemeye muhtaçtır. Bu gibi çalışmalar İslâm ümmetinin yeniden kalkınmasına sebep olacaktır. Bugün İslâm alemi savaşlar ve krizler sebebiyle duraklamış ve ümitsizliğe düşmüştür. Bu zamana kadar gelmiş olan ilmî birikimi -şeriatın sınırları içinde kalarak- yeniden yorumlayacak alimler de kalmamıştır. Bu eksiklik, bazı kimselerin problemleri ile baş başa kalmalarına sebebiyet vermiş, özellikle aile hayatını sınır tanımaksızın yabancılara sunan kimseler orta yolu kaybetmişlerdir. Bu tarz problemlerin çözümü için kişinin dinini bırakmaksızın evvela kendisini, sonrasında da yetiştiği ailesini düzeltmesi lazımdır. Kişi ancak bu yolla toplumuna faydalı bir fert olur. Bu açıdan araştırmanın amelî bir yönü de bulunmaktadır. Araştırma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde“Ahval-i Şahsiye”kavramı, nereden türediği ve kanunlaşma süreci ele alınmıştır. Birinci bölümde Mustafa Zerkâ ve Mustafa Sıbâî'nin yaşadığı dönem olan yirminci yüzyılda Suriye'nin tarihi kısaca incelenmiş ve iki alimin biyografilerine yer verilmiştir. İkinci bölümde ise Zerkâ ve Sıbâî'nin ahval-i şahsiye alanında yaptıkları çalışmalar ve kanunlaştırma sebepleri incelenmiştir Ahval-i şahsiye kanunundaki meseleler ve görüşler kaynak eserlerden tespit ve cemedilmiş, kanundaki ictihadlar ve hükümler, delilleri zikredilerek tahlil edilmiştir. Üçüncü bölümde Zerkâ ve Sıbâî'nin çabalarının semereleri açıklanmış, aile ahkamı ile alakalı yeni çıkan meseleler zikredilmiştir. Bu meselelerden sadece bazıları şerh edilmiş, sonrasında her meseleyi bu kaidelere uygulayarak iki alimin fıkhî metotları açıklanmıştır. Sonuç bölümünde ise araştırmada ulaşılan neticelere yer verilmiştir."
