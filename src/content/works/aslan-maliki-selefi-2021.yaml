abstract: "Günümüz dünyasında İslâm âlemi bin dört yüz yıllık tarihinde müslümanların İslam'ı anlayış şekillerine paralel olarak birçok itikâdî ve fıkhî mezhebî kimlikler oluşturmuştur. İtikâdî ve fıkhî olarak ilk dönemden itibaren var olan mezhebî kimliklerden biri de Mâlikî-Selefîlik'tir. Günümüzde Selefî düşünce anlayışının genelini Hanbelî-Selefîlik oluşturmaktadır. Selefî bir itikâdî anlayışın amelî olarak bir diğer şekli de Mâlikî-Selefîlik olarak karşımıza çıkmaktadır. Mâlikî-Selefî akîde, Mâlikîlerin ilk temsilcisi ve kurucusu olan Mâlik b. Enes'den başlayarak günümüze gelinceye kadar farklı şahıslar üzerinde varlığını devam ettirmiştir. Bu çalışma ile İslam'ın ilk yıllarından itibaren ortaya çıkan Mâlikî-Selefi İslam anlayışının nasıl ortaya çıktığı, son dönem bu anlayışın en önemli temsilcilerinden Muhammed b. Alevî'nin görüşleri ve düşünceleri mercek altına alınmıştır. Muhammed b. Alevî'nin düşünce sistemi ve günümüz Hanbelî-Selefîlerden farklı olarak beyan etmiş olduğu fikir ve düşünceleri incelenmiş ve karşılaştırmalı olarak aktarılmaya çalışılmıştır."
