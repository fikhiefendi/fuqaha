abstract: "Ehliyet, kişinin lehine ve aleyhine olan hakların oluşmasına elverişli olması veya başka bir ifade ile borçlandırmaya ve borçlanmaya yetkili olmasıdır. Kişinin ehliyetini daraltan, ortadan kaldıran ya da hükümlerin değişmesine sebep olan hallere ehliyet ârızaları denir. Ehliyet ârızaları semâvî ve mükteseb olmak üzere iki kısma ayrılır.Haklar şahıslar içindir. Hak sahibi olma ve hakları kullanma sınırının belirlenmesi ârızaların ehliyete olan tesirinin iyi bilinmesi ile mümkündür. Biz de çalışmamızda bunu ortaya koymaya çalışacağız.Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde konu ile yakından ilgisi bulunan şahıs ve şahsiyet terimleri ele alınmıştır. Birinci bölümde ehliyetle ilgili kavramsal çerçeve, ikinci bölümde ise ehliyet arızları ele alınmıştır. Birinci bölümde ehliyetin tanımı, ehliyetin bölümleri ve ehliyete göre insanın geçirdiği dönemler incelenmiştir. İkinci bölümde ise ehliyet ârızalarının tespiti yapılmış, dini ve hukuki açıdan sonuçları incelenmiş ve güncel hukuktaki yerine kısmen de olsa değinilerek bir sonuca varılmaya çalışılmıştır."
