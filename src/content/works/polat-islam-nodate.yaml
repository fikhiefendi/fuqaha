abstract: "Bu Bu çalışma, genel itibarıyla temizlikle başlayıp miras taksimatıyla son bulan fıkıh ilminin geniş konu yelpazesi içerisinde ortaya çıkan şüphelerin giderilmesine yönelik olarak fıkıh mezheplerinin geliştirdiği sistematiği; kavramsal, metodolojik ve uygulamalı boyutlarıyla bütüncül bir bakış açısı içinde ele almayı amaçlamaktadır. Dört mezhebin klasik ve geniş hacimli eserlerinde yer alan, şüphe ile ilişkili hükümlerin temellendirmesini ortaya koymak amacıyla bu çalışmada tümevarım yöntemi esas alınmıştır. Bu doğrultuda, mezheplerin fer'î meselelere dair uygulamalarından hareketle, tespit edilen şüphenin izale yolları araştırılmıştır. Böylece, şüphenin fıkhî hükümlere etkisi hem teorik hem de pratik düzlemde bütüncül bir yaklaşımla ortaya konulmuştur. Fıkıh bilginleri hükümde şüpheyi dikkate almıştır. Çalışmada; ibadetler, muâmelât, ahvâl-i şahsiyye ve ceza hukuku alanlarında ortaya çıkan şüphe örnekleri incelenmiş; ibadetlerde ihtiyat ilkesinin, akitlerde tarafların korunması ve zaruret ölçüsünde müsamahanın, talâk hükümlerinde ise lafızların muhtemel anlamlarından kaynaklanan şüphenin belirleyici olduğu tespit edilmiştir. Ceza hukukunda ise“hadler şüphe ile düşer”prensibi çerçevesinde, şüphenin sanık lehine yorumlanması ilkesinin erken dönemden itibaren benimsendiği ortaya konulmuştur. Bu ilke, çağdaş ceza hukukundaki“in dubio pro reo”kuralıyla karşılaştırmalı olarak ele alınmıştır. İslâm âlimleri, şüphenin giderilmesine yönelik olarak Kur'an ve Sünnet merkezli kaideler geliştirmiş; hüküm istinbatında nasların yanı sıra örf, âdet, maslahat ve sedd-i zerâi gibi fer'î delilleri de dikkate almışlardır. Bu durum, şüphe meselesinin disiplinlerarası bir niteliğe sahip olduğunu göstermektedir. Fıkıh literatüründe şüphenin giderilmesine yönelik çalışmalar, İslâm Hukuku'nun kolaylık ve maslahat ilkeleriyle uyumlu bir yapı arz ettiğini ortaya koymaktadır. Özellikle son asırlarda bilimsel gelişmelerin büyük ilerleme kaydetmesiyle birlikte, fıkıh sahasında daha önce şüpheli kabul edilen bazı meseleler yakînî bir seviyeye ulaşmıştır."
