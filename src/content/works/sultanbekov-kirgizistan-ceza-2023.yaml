abstract: "İnsan topluluğunu diğer canlı varlılardan farklı kılan ve onları ayakta durmasını sağlayan en temel unsur, toplum içerisinde belirli bir düzenin varlığıdır. Tarih boyunca kaydedilen her toplumun mutlak surette bir hukuki düzeni olduğu görülmektedir. Hukuk sistemleri, bireylerin haklarını inceliyor olması açısından her zaman büyük bir ilgi ve merak konusu olmuştur. Toplumun içinde yer alan bireylerin farklı düşünce biçimleri, kavrayışlar ve eğilimler taşımalarının yanı sıra, kendi bireysel çıkarlarını gözetmeleri ve çeşitli eylemlerde bulunmalarının kaçınılmaz olduğunu söylemek mümkündür. Dolayısıyla, insanlar arasındaki zaman zaman anlaşmazlıkları nedeniyle çeşitli mücadelelere girmişlerdir ve bu durum günümüzde de devam etmektedir. İnsanların karşılaştığı bu durum için her dönemde cezai yaptırımlar öngörülmüştür. Konuya ilişkin yaptığımız araştırmada, Kırgız toplumunun tarih boyunca geçirdiği evrelerde hukuk sistemi üzerinde değişimler olmuştur. İslamiyet'in Kırgızistan'da kabulünden önce, toplum örf ve adetlere dayalı bir hukuk sistemi oluşturmuştur. Ancak İslamiyet'in kabulü ile bu iki sistem bir arada varlık göstermiştir. Sovyetler Birliği dönemi, ideolojik amaçlara uygun olarak sosyalist hukukun benimsendiği ve uygulandığı bir dönem olarak öne çıkmaktadır. Bu dönemde, toplumsal ideoloji gereği sosyalist hukuk normları öne çıkarılmış ve uygulanmıştır. Ancak bağımsızlığın kazanılmasının ardından Kırgızistan, Kıta Avrupa hukuk sistemini benimsemiş ve uygulamıştır. Bu süreçte hukuk sistemi, toplumun kültürel, dini ve siyasi faktörlere bağlı olarak evirilmiş ve günümüze kadar ulaşmıştır. Bu çalışmada, İslam Ceza Hukuku esas alınarak yürürlükte olan Kırgızistan Ceza Kanunu açısından değerlendirme yapılmıştır. İçerik olarak öncelikle İslam Ceza Hukuku'nun kavramları, kaynakları ve unsurları hakkında ve Kırgızistan Ceza Hukuku'nun tarihçesi, kaynakları ve içeriği hakkında genel bir bilgi sunulmuştur. Ardından, detaylı bir şekilde kişilere karşı bazı suçlar üzerinden İslam Ceza Hukuku ve Kırgızistan Ceza Hukuku'nun değerlendirmesi yapılmıştır. Her iki hukuk sisteminin tamamını bir araştırmada ele alıp değerlendirmek oldukça güçtür. Dolayısıyla araştırmamızda sadece“Hayata karşı işlenen suçlar”,“Vücut dokunulmazlığına karşı işlenen suçlar”,“Cinsel dokunulmazlığa karşı işlenen suçlar”ve“Şerefe karşı işlenen suçlar”üzerinde durulmuştur."
