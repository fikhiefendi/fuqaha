abstract: "Tevbe suresinin 60. ayeti ile belirlenen zekâtın sarf yerlerinden birisi de“müellefe-i kulûb”dur. İlk dönem fukahâdan itibaren bu sınıfın tanımı ve bu sınıfın kimleri ifade ettiği fukahâ arasında ihtilaf oluşturmuştur. Bu konudaki başka bir ihtilaf ise bu sınıfın sadece Hz. Peygamber dönemine özgü bir sınıf mı olduğu, yoksa müellefe-i kulûb sınıfından sayılabilecek kimselerin günümüzde de bulunması halinde bunlar hakkındaki hükmün devam edip etmediği konusudur. Hükmün devam edip etmediği yönündeki ihtilafların dayanağını, Hz. Ömer'in Hz. Ebûbekir döneminde bu sınıftan sayılan bazı kişilere zekâtın müellefe-i kulûb fonundan pay vermemesi oluşturmaktadır. Hz. Ömer'in bu uygulaması referans alınarak fukahânın kimileri tarafından hükmün devam etmediği, kimileri tarafından ise hükmün her dönemde bakî olduğu anlayışı ortaya çıkmıştır. Bu yorumlar çerçevesinde Hz. Ömer'in uygulamasını nasslara müdahale ve yürürlükten kaldırma olarak anlayanlar konuyu; hükmün nesh edildiği, hükmün uygulamasının tamamen düştüğü ve hükmün düştüğü ancak ihtiyaç halinde devam edeceği şeklinde yorumlamışlardır. Fıkhî hükümlerin değişmezliğinin nasslarla sabit olduğunu savunanlar ise konuya hükmün her dönemde bakî olduğu görüşü nisbetinde yaklaşmışlardır. Her iki anlayış tarzı da bu görüşlerini, nesh, sükûtî icma, illet, maslahat, ictihat, kamu otoritesi ekseninde delillendirmeye çalışmışlardır."
