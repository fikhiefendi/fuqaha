abstract: "Bu tez, Tahir Melik'in Şeytanat romanının 1. cildinde bir Özbek Türkçesi söz dizimi çalışmasıdır. Çalışmamızda Leyla Karahan'ın“Türkçede Söz Dizimi”adlı çalışması esas alınarak Özbek Türkçesinde söz dizimi incelenmiştir. Tahir Melik'in Şeytanat romanı beş ciltten oluşmaktadır. Biz, romanın birinci cildindeki cümleleri ve kelime gruplarını ele aldık. Romanda, daha iyi insan olma, erdem, ahlak gibi konular işlenmiştir ve bu değerler yüceltilmiştir. Tahir Melik'i seçme nedenimiz Özbek edebiyatının yaşayan en büyük ve en sevilen yazarlarının başında gelmesidir."
