abstract: "Bu çalışma, İslam miras hukuku olarak da adlandırılan ferâiz ilmi konusunda Türkçe olarak yazılmış olan manzum eserler üzerine yapılmıştır. Çalışmada, haklarında çok az bilgi bulunan ve konu bütünlüğü sebebiyle bir tür oluşturan bu eserleri tespit etmek, tespit edilen eserlerin metinlerini ortaya çıkarmak ve bu metinlerin incelemesini yapmak amaçlanmıştır. Metinlerin tespit edilmesinin ardından edisyon kritik yöntemiyle bu metinlerin yazı çevrimleri yapılmıştır. Bu işlem sırasında birden fazla nüshası bulunan eserlerin, çok büyük oranda, bütün nüshalarına ulaşılmış ve bu nüshalar eskilik, hacimli olma gibi kriterler doğrultusunda tenkitli metnin oluşturulmasında kullanılmışlardır. Bununla birlikte bazı manzumelerin ünik nüsha olması, bütün eserler için edisyon kritik yapılmasını engellemiştir. Bu işlemlerden sonra metinlerin şekil ve muhteva yönünden incelenmesi aşamasına geçilmiştir. Amaç ve yöntemi hakkında kısaca bilgi verilen bu çalışma üç ana bölümden oluşmaktadır. İlk bölümde ferâiz ilmine dair genel bilgilere yer verilirken ikinci bölümde ferâiz konusundaki eserlerden ve manzum ferâizlerden bahsedilmiştir. Üçüncü bölümde ise tespit ettiğimiz ferâiz-nâmelerin/manzum ferâizlerin çeviri yazılı metinleri ve incelemeleri yer almaktadır. ANAHTAR KELİMELER Türk edebiyatı, ferâiz-nâme, manzum ferâiz, İslam miras hukuku, ilm-i ferâiz, ferâiz şiirleri, kırk hâl manzumeleri."
