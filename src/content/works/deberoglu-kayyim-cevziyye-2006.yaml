abstract: "XIII ÖZET İslâmî ilimlere katkısı olan Hanbeli mezhebi alimlerinden birisi İbn Kayyım el-Cevziyye'dir. İbnü'l-Kayyım, zaman zaman, bağlı bulunduğu mezhep görüşünün dışında görüş açıklayabilen, mezhep tasssubu bulunmayan bir alimdir. Tezde, İbnü'l Kayyim'ın“riâmü'l-muvakkıîn”adlı eserindeki ibadetler ve aile hukukuna ait hukukî görüşleri tespite çalışılmıştır. Yazarın görüşlerinin, meşhur dört hukuk mezhebinin görüşleri ile mukayesesi yapılarak, İbnü'l-Kayyım'ın hukuki kişiliğinin daha iyi anlaşılmasına gayret edilmiştir. Çalışmada İbnü'l-Kayyım'ın fıkha dair yaklaşık yüz onüç konudaki görüşüne yer verilmiştir."
