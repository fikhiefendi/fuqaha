abstract: "Bu tezde Tahtâvi'nin hayatı ve onun Hanefi fıkhındaki El-Dürr-i Muhtar adlı eserindeki yaklaşımı ele alınmaktadır. Al-Tahtâvi onun üzerine, yazarının zamanının en iyi dipnotlarından biri olarak kabul edilen psikolojik bir dipnot yazmıştır. İbn Abidin bunu benimsemiş ve ünlü şerhi Redd-ül Muhtar'da onu en önemli kaynak haline getirmiştir. Bu benim ilgimi çekti ve kitabını incelemeye ve yöntemini tanıtmaya teşvik etti. Tartışma bir giriş ve iki bölüm halinde düzenlenmiştir: Birinci bölüm: (Al- Tahtâvi'nin hayatı ve çevresi) iki bölümden oluşmaktadır: Birinci bölüm: Dönemini, yaşamını, ülkenin içinde bulunduğu sosyal ve ekonomik durumu anlatıyor. Bilimsel ve entelektüel hareketi not ediyor, ardından siyasi ve idari durumu aktararak devam ediyor. Aynı zamanda yazarı, soyunu, ailesini ve menşe yerini tartışıyor ve onun bazı ahlak ve erdemlerini ve bilim adamlarının onu öven sözlerini sunuyor. İkinci bölüm: Orijinalin ve dipnotun incelenmesini, El-Dürr-i Muhtar kitabının ve menşeinin tanıtılması, gözlerin aydınlatılması, açıklama, dipnot ve yorumlarının incelenmesini içermektedir. Daha sonra dipnotun yazarına atfedilmesinin doğruluğunu açıklar ve kaynaklarını sunar. İkinci Bölüm: (Yazarın kitaba yaklaşımı) ve üç bölümden oluşmaktadır: Birinci Bölüm: Müellifin genel olarak ilmî ilgileri, Arap diline ve ilmî terimlerin tanımlanmasına olan ilgisi, sözlü ve hadis konularına olan ilgisi yer almaktadır. İkinci Bölüm: Özellikle yazarın hukuki menfaatlerini içerir. Onun fikhî ihtilafları bilmesi, beyanları tenkidi, seçme ve tercihe maruz kalması, bazı konuların uzun uzadıya tartışılması, beyanların uzlaştırılması ve çelişenlerin uzlaştırılması da buna dahildir. Üçüncü Bölüm: Yazarın dipnotunun diğer bazı dipnotlarla karşılaştırılması konusunu ele alır. Bunu El- Halebi'nin Tuhfet-ül-Akhyar dipnotu, İbn Abidin'in Reddu'l-Muhtar'a dipnotu, el-Sindhi'nin Tavali-i Envar'a dipnotu ve ardından Ala Maraki el-Falah dipnotu ile karşılaştırır. Son olarak çalışmanın ulaştığı en önemli sonuçların yer aldığı bir özet ve sonuç bölümü yer almaktady. DHALEE Şahsıma asıl olarak tevdi edilen isbullişikteki belgenin tam ve doğru olarak Arapça dilinde"
