abstract: "Osmanlı Devleti'nin askerî, siyasi, hukuki ve ekonomik yapısını anlamak için incelenmesi gereken temel kaynakların başında şer'iye sicilleri gelmektedir. Şer'i mahkemeye intikal eden bütün olayların, davaların kayıtlarının tutulduğu deftere şer'iye sicili denilmektedir. Elbistan'ın İlk Çağ'dan başlayarak Roma hâkimiyeti, Türklerin bölgeye gelişi, Roma dağıldıktan sonra Bizans himayesinde Ermeni senyörleri, tekrar Türk hakimiyeti ve Dulkadirlilerin beylik kurması ve son olarak Osmanlı'nın bölgeye hâkimiyeti üzerine kısa bir değerlendirme yapıldı. Akabinde tez konusu olan 468 numaralı Elbistan şer'iye sicili transkript edilerek değerlendirildi. Belge muhtevasında boşanma, tereke, darp gibi olayların olduğu tepit edilerek bu olaylar üzerinden Osmanlı Elbistan'ı değerlendirilerek Elbistan'ın H 1324-1325/ M 1906-1908 yılları arası aydınlatılmaya çalışıldı."
