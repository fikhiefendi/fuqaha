abstract: "İslam ibadet sisteminin temel esaslarından biri olan zekât, bireyin Allah (CC.) ile olan kulluk bağını güçlendirmesinin yanı sıra, önemli bir sosyo-ekonomik işlevi de bulunan mali bir ibadettir Zekâtın kimler tarafından verilmesi gerektiği, hangi malların zekâta tabi olduğu, zekât oranlarının neye göre belirleneceği ve kimlere verileceği gibi hususlar, İslam hukukunun detaylı inceleme alanına giren meselelerdendir. Bu konular, farklı mezheplerin fıkhî yöntem ve içtihat anlayışları doğrultusunda çeşitli yorumlara tabi tutulmuştur. Hanefi ve Şafii mezhepleri, İslam hukuk tarihinde geniş etki alanına sahip iki büyük fıkıh ekolüdür. Bu mezhepler, zekâta dair temel ilkelerde çoğunlukla ortak görüşlere sahip olmakla birlikte, özellikle uygulamaya ilişkin meselelerde dikkat çeken bazı farklılıklar ortaya koymuşlardır. Bu farklar; zekâtın verilme zamanı, zekâta tabi malların kapsamı, zekâtın verileceği kişilerin nitelikleri ve zekâtın veriliş biçimi gibi konularda kendini göstermektedir. Türkiye'de yaşayan Müslümanların büyük çoğunluğu Hanefi ve Şafii mezheplerine mensup olduğundan, bu iki mezhebin zekâta dair hükümlerinin karşılaştırmalı olarak incelenmesi hem bireysel ibadetin doğru şekilde ifası hem de toplumsal uygulamalar açısından son derece önemlidir. Bu çalışma, söz konusu iki mezhebin zekâtla ilgili yaklaşımlarını karşılaştırarak, benzerlikleri ve ayrılık noktalarını sistematik bir biçimde ortaya koymayı amaçlamaktadır."
