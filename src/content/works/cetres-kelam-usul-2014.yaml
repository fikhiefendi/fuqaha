abstract: "Tesbit edebildiğimiz kadarıyla bugüne kadar“Kelâm-Usûl-i Fıkıh İlişkisi”konusunda detaylı bir çalışma yapılmamış sadece belli şahıslar ve düşünceleri üzerinde sınırlı çalışmalar gerçekleştirilmiştir. Şunu hemen belirtelim ki, kelâm ile usûl-i fıkıh disiplinleri hem yapısal hem de yöntemsel açıdan birbirine çok benzemekte, bu iki bilim dalı arasında ortak birçok konu bulunmakta, hattâ söz konusu disiplinler bunları benzer yöntemler kullanarak incelemektedir. Bu çalışmada, bâkir bir alan olduğunu düşündüğümüz“Kelâm-Usûl-i Fıkıh İlişkisi”konusunu, İmâmü'l-Haremeyn el-Cüveynî (ö. 478/1085) ekseninde sınırlandı¬rarak, ele almaya çalıştık. Çalışmanın Giriş Bölümünde tezin konusu, amacı, kapsamı, metodu ve orijinalliği ile kullanılan kaynak ve yöntemler hakkında bilgi verilmiştir. Birinci bölümde,“kelâm ve usûl-i fıkhın doğuşu”başlığı altında, Hz. Peygamber ve sahâbe dönemi, kelâm ve fıkhın doğuşu, kelâm-fıkıh ayrışması, usûl-i fıkhın doğuşu, Ehl-i sünnet'te kelâm-usûl-i fıkıh ilişkisi ve Ehl-i sünnet'in teşekkülüne tekaddüm eden dönemin dört büyük imâmı İmâm Âzam Ebû Hanîfe, İmâm Şâfiî, Ahmed b. Hanbel ve İmâm Mâlik'in kelâm-usûl-i fıkıh ilişkisi açısından konum¬ları incelenmiş; Cüveynî dönemine kadar olan süreçteki kelâm-usûl-i fıkıh ilişkisi özetlenmiştir. İkinci bölümde,“kelâm-usûl-i fıkıh ilişkisi”ana başlığı altında bu ilişkinin mâhiyeti üzerinde durulmuş, bu konu aslîlik-fer'îlik ve yöntem açısından ele alınarak süreç içinde ortaya çıkan mütekelimîn, fukahâ ve memzûc metodlara değinilmiştir. Çalışmamızın“Cüveynî'nin kelâm ve usûl-i fıkıhtaki yeri”başlığını taşıyan üçüncü bölümünde ise, Cüveynî'nin kelâm yöntemi ve bu alandaki kaynakları, onun usûl-i fıkıhtaki yeri, yöntemi ve kaynakları üzerinde durulmuş, bu ünlü âlimin mantık ilmindeki yeri, kelâm usûl-i fıkıh ilişkisi çerçevesinde değerlendirilmiştir. Araştırmanın sonuç kısmında ise, usûl-i fıkıh başta olmak üzere bütün Temel İslâmî ilimlerin kelâm ilmine dayandığı hususuna dikkat çekilmektedir. Usûl-i fıkhın kelâm, fıkıh, Arap dili ve edebiyatından çeşitli yönlerden yardım aldığı belirtilmekte, kelâm ilminin Temel İslâm bilimlerinin her alanına etki ettiği sonucuna ulaşılmaktadır"
