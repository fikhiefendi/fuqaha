abstract: "Bankacılık sistemi, paranın muhafaza edilmesi için güvenli bir ortam sağlanması, tedavüldeki paranın toplanması ve ödenmesi gibi işlemleri gerçekleştirmek, çek ve akreditif muameleleri yapmak, müşteri adına menkul kıymet alım satımı yapmak, kefalet ve teminat mektubu vermek, kiralık kasa hizmeti vermek, seyahat çeki ve kredi kartı gibi konularda danışmanlık yapmak, iş adamlarına banka referans mektubu vermek ve çeşitli faturaların tahsilini yapmak üzere faaliyet göstermektedir. Dünya'da ve Türkiye'de bankacılık sektörü faizli sistem üzerine inşa edilmiştir. Faiz, İslam dinine göre haram (yasak) kılındığı için Dünya'da,özellikle Malezya ve Türkiye gibi Müslüman ülkeler geleneksel faizli bankacılık sisteminden uzak kalmaya çalışmaktadırlar. Bu yüzden bu ülkelerdeki tasarrufların bir kısmının ekonomiye aktarılması için dünyada ve ülkemizde faizsiz bankacılık kurumları yani Katılım Bankaları faaliyet göstermektedir. Genelde bankacılık sektörü, finansal sistemin en önemliaktörlerinden birisidir. Bankacılık sektörünün etkinliği, ekonomik ve sosyal bakımdan önemlidir. Bu yüzden çalışmada 2010- 2013 yılları arasında, Türkiye'de bankacılık sektöründe faaliyet gösteren katılım bankaları ile Malezya'da İslam bankalarının etkinliği, ölçeğe göre değişken getiri varsayımı altında girdi odaklı VZA (Veri Zarflama Analizi) ve EMS faktör verimlilik endeksi ile karşılaştırılmıştır. Bankaların etkinliğinin araştırılmasıyla 7 girdi (Toplam Fonlar ve Alacaklar / Toplam Aktifler, Toplam Krediler ve Alacaklar / Toplam Mevduat, Takipteki Krediler(Brüt) / Toplam Krediler ve Alacaklar, Takipteki Krediler(Net) / Toplam Krediler ve Alacaklar ,Özel Karşılıklar / Takipteki Krediler(Brüt) , Duran Aktifler / Toplam Aktifler , Tüketici Kredileri / Toplam Krediler ve Alacaklar) ve 1 çıktı (Finansal Varlıklar / Toplam Aktifler) değişkeni kullanılmıştır. Analiz sonucunda Türkiye katılım bankaları ile Malezya İslam bankalarının etkinlikleri detaylı bir şekilde ortaya konulmuştur. Etkinliklerinin az olduğu saptanan bankaların daha verimli olabilmeleri için politika önerilerinde bulunulmuştur. Katılım bankalarının, hem reel sektöre fon yaratan önemli bir kaynak olmaları ve hem de aynı zamanda bireylerin dini hassasiyetlerini göz önüne alarak ülke üretiminin ve refahının artırılmasına katkı sağlamaları nedeniyle bankacılık sistemindeki paylarının arttırılmasının daha yararlı olacağı görüşü ön plana çıkmaktadır."
