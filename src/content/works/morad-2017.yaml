abstract: "Tezimiz, canlı ve cansız eşyayı edinmeye (iktinâ) dair hükümleri konu edinmektedir. Eşyayı edinme ve onunla ilgili kavramları, mülk edinmenin şer'i delillerini, bütün çeşitleriyle canlı ve cansızları mülk edinmenin hükmünü, isteğe ya da ihtiyaç veya zarurete binaen mülk edinme konularını ihtiva etmektedir. Konumuzun fıkhî kaide ve fer'î ahkâmla sıkı bir ilişkisi bulunmaktadır. Mesela mülk edinilen şeylerde zekâtın veya ribânın cereyan edip etmediği gibi konular bu çerçevede mütalaa edilebilir. Bütün bu konuları ümmetin genel kabulüne mazhar olan Ehl-i Sünnet Fıkıh mezhepleri çerçevesinde ele alıp incelemeye çalıştık. Konuyu farklı yönleriyle tartıştıktan sonra gerekçesini de belirterek yer yer tercihlerde bulunmaya gayret ettik. Gücümüz oranında konuya dair dağınık halde bulunan bilgileri bir araya getirerek belli bir sistem içerisinde aktarmaya çalıştık. Allah'tan temennim, bu çalışmanın hem bana hem de diğer ilim taliplerine faydalı olmasıdır."
