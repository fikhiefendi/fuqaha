abstract: "Bilimin ilerlemesi ve teknolojinin baş döndürücü hızda gelişmesi insanoğlunun çeşitli alanlarda çok derin araştırma ve çalışmalar yapmasına imkân tanımaktadır. Bu imkânlar dâhilinde kullanılan yöntem ve tekniklerle canlıların en küçük yapıları olan hücrelerindeki DNA'larına müdahale edilmek suretiyle yaratılışlarından çok farklı yapıda canlılar ortaya çıkabilmektedir. Özellikle bu tekniklerin temel gıda maddelerini oluşturan tarım ürünlerinde uygulanması konuyu toplumun ilgi alanına dâhil etmektedir. Zira bu ürünler çoğu insanın günlük tükettiği yiyecek ve içeceklerde hammadde olarak kullanılmaktadır. Hayatının her alanını Allah'ın emirleri doğrultusunda düzenlemek zorunda olan Müslümanlar bu konuda yapacakları çalışmaları da O'nun çizdiği sınırlar dâhilinde kontrollü olarak yapmak durumundadırlar. Bu sınırlara riayet edebilmek için öncelikle konunun bilimsel olarak açıklığa kavuşturulması gerekmektedir. Bunun için biyoteknoloji alanında çalışmalar yapan bilim insanlarının araştırmaları son derece önem arz etmektedir. Bu çalışmada tarım ürünlerinin genetik yapılarının değiştirilmesi bilimsel açıdan incelenmiş, ne şekilde ve hangi amaçlar için elde edildiğine yer verilmiştir. Bu ürünler İslam Hukuku açısından öncelikle fıtrata müdahale açısından ele alınmış ardından meşruiyeti hakkında değerlendirme yapılmıştır."
