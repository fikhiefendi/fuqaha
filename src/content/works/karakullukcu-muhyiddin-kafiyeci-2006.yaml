abstract: "XIV.yüzyılın sonu ile XV.yüzyılda yaşamış olan Muhyiddîn el-Kâfiyeci Arap dili ve edebiyatı başta olmak üzere; tefsir, hadis, kelam, fıkıh vb. bir çok ilim dalında eser vermiş ve sayısız öğrenci yetiştirmiştir. İslam hukuku alanında verdiği eserlerde, daha çok bugün dahi güncelliğini koruyan mezheplerin mahiyeti, içtihat, taklit, hükmün araştırılması ve mukallidin durumu gibi konulara değinmiştir. İlmi çalışmalara taklidin damgasını vurduğu bir dönemde Kâfiyeci, içtihadın her dönemde gerekli olduğunu söylemekte ve alimleri içtihat yapmaya teşvik etmektedir. İşte bu özelliği, bizi kendisine ait bir eserin tahlil ve tahkikini yapmaya sevk etmiştir Çalışmamıza konu olan ?Vecîzü'n-Nizâm? adlı eserde, halefin ve selefin içtihat metotları ayrı ayrı açıklanmıştır. Yeni sorunlar ortaya çıktığında, yeni içtihatların yapılabileceği üzerinde durulmuştur. Kâfiyeci içtihat yapabilmeyi halefin ve selefin yöntemini bilmeye bağlamış ve bizzat kendisi yeni içtihatların nasıl yapılabileceğini örneklerle açıklamıştır. Müellifin hayatının araştırılması sırasında biyografi eserlerinden istifade edilmiştir. Risâlenin iki nüshası tespit edilmiştir. Süleymaniye Ktp. Ayasofya bölümü ve Leipzig Üniversite Ktp.nde bulunan iki nüsha karşılaştırılarak incelenme imkanı bulunmuştur. Nüshaların orjinalliklerine dokunulmadan, nüsha farklılıkları belirtilip varak numaraları kaydedilmiştir. Risâlenin içinde geçen ayetlerin sûre ve numaraları ve hadislerin kaynakları tespit edilmiştir."
