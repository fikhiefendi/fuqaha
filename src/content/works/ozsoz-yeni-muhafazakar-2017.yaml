abstract: "Din olgusunun sosyal yansımalarıyla ele alınması toplumun sosyal ve kültürel yapısının anlaşılabilmesi için bir gerekliliktir. Bu olgunun ve ilişkili olduğu yapıların ekonomi alanıyla kesiştiği noktalar da ele alınmaya değer özel bir çalışma alanı sunmaktadır. Bu doğrultuda bu çalışma“Yeni Muhafazakâr Orta Sınıf”kavramsallaştırmasıyla ele aldığımız dindar sermaye sahiplerinin gündelik pratiklerinde ve ekonomik tutumlarında inandıkları ilkelerin ve piyasa şartlarının ne ölçüde etkin olduğuna odaklanmaktadır. Bu aktörlerin bulundukları konumun daha iyi anlaşılabilmesi için Weber'in ekonomi ve din ilişkisine dair yaptığı belirlemeler, bu belirlemelere –özellikle Ülgener tarafından- yöneltilen eleştiriler ve İslâmi ilkelere göre organize edilen ekonomik yaklaşımların ortaya çıkış süreçleri ele alınmaktadır. Bu hat izlenerek Anadolu sermayesinin Türkiye'deki etkinliği ve MÜSİAD'ın bu süreçte üstlendiği rol üzerinde durulmaktadır. Dindar sermaye sahiplerinin söz sahibi olmak istedikleri alanlara nasıl dâhil oldukları, bu süreçte alanları nasıl dönüştürdükleri ve kendilerinin nasıl dönüşümler yaşadıkları MÜSİAD Kayseri Şubesi örneği üzerinden Bourdieu'nün kavramlarıyla ele alınmaktadır."
