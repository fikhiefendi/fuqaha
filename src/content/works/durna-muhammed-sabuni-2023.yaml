abstract: "Kıraatler, Kur'ân âyetlerinin telaffuzu ve tefsirinde, anlam zenginliği ve farklı yaklaşımlar ortaya koyması bakımından tefsir ilminin başlıca unsurlarından olmuştur. Muhammed Ali Sâbûnî tarafından te'lif edilen Revâiü'l-Beyân adlı tefsir, her düzeyde ilim ehlinin istifade ettiği bir eserdir. Müellifinin, İslâmî ilimlere olan vukûfiyetleri dolayısıyla, Kur'ân âyetlerini, dil, i'râb, kıraat vb. ilimlerden istifade ederek, kısa ve anlaşılabilir ifadelerle tefsir etmesi, onu başarılı kılmıştır. Tefsirde özlü ifade konusundaki başarısını kıraatlere yaptığı atıflarda da göstermiştir. Bu çalışma, Muhammed Ali Sâbûnî'nin Revaiü'l-Beyân ahkâm tefsirinde kıraatlere yaklaşımını ele almıştır. Müellifin kıraatlere yaklaşımındaki esas aldığı kriterler ve esaslar, kıraatleri dilbilimi, fıkıh, mânâ ve tefsir açısından değerlendirmesi gibi hususların açıklığa kavuşturulması hedeflenmiştir. Kıraatlerin tefsir ve fıkıhla ilişkisine birçok alim dikkat çekmiştir. Çağdaş dönemde ahkâmu'l-Kur'an alanında eser yazan Sâbûnî de bu alana yönelik katkı sağlamıştır. Müellifin kıraat-tefsir, kıraat-fıkıh ilişkisini mezcettiği bu eserin tahlil edilmesi kıraat alanına katkı sağlayacağı, bu alanda bir boşluğu doldurduğu kanaatindeyiz. Çalışmanın birinci bölümünü, müfessirin hayatı ile Revâiü'l-Beyân tefsirinin tanıtımı oluşturmaktadır. Bu bölümde müfessirin ilmî şahsiyeti, ders aldığı hocaları ve yetiştirdiği talebeleri, âlimlerin onun hakkındaki görüşleri, tefsir yönü, fıkhî yönü ve mezhebi ele alınacaktır. Çalışmanın ana gövdesini oluşturan ikinci bölümde ise, Revâiü'l-Beyân tefsirindeki kıraatlerin konu ve sıhhat bakımından genel değerlendirmesinin yanı sıra, tefsirde kıraatlerle ilgili kullanıldığını tespit ettiğimiz bazı husûsi kavramların açıklaması yapılacaktır. Aynı şekilde bu bölümün devamında, tefsirdeki kıraat farklılıklarının Arap lehçeleri, sarf-nahiv ilmi ve edatlar ile olan ilişkisi, örnekleriyle detaylıca izah edilecektir. Hülâsa bu çalışma, İslami ilimler literatüründe önemli bir yeri olan Revâiü'l-Beyân tefsirini kıraatler açısından değerlendirerek yaklaşım tarzını ortaya koyacaktır."
