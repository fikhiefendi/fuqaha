abstract: "Kur'ân-ı Kerim nazil olmaya başladığı andan günümüze kadar insanlar, sure ve ayetlerin eşsiz nazmı ve güzelliği karşısında aciz kalmışlardır. Şairler ve edipler bu güzellik karşısında hayranlıklarını dile getirmekten kendilerini alamamışlardır. Kur'ân-ı Kerîm ve kıraâti Hz. Peygamber'den itibaren günümüze kadar kuşaktan kuşağa aktarılarak nakledilmiştir. Bu kuşakların en önemli halkasını ise Ashâb-ı Kirâm oluşturmuştur. Kur'ân ve kıraâtlerinin Hz. Peygamber'den sahih olarak nakledilmesinde çok sayıda kıraât âlimi, kurrâ, hafız ve hattatlar büyük gayretler göstermişlerdir. Tüm bunlara rağmen gerek ülkemizde gerekse de Arap dünyasında kimi çevrelerce sahih kıraâtlerin dışında yeni kıraâtler oluşturulmaya çalışılmakta ve tecvidin bidat olduğunu savunulmaktadır. Sahih kıraâtin Hz. Peygamberden geldiği şekli üzere muhafaza edilebilmesi ve uydurma/zayıf kıraâtlerin önüne geçilebilmesi için İslam dünyasının birçok bölgesinde kıraât medreseleri bulunmaktadır. Bu minvalde Kıraât tarihimizin önemli yapı taşlarından birini oluşturan medreselerden biri olan Nuru'l-Hikme Eğitim ve Kültür Vakfı yüksek lisans tezimize konu olacaktır. Sözü geçen vakıf tarihten gelen ilmi geleneği sürdürmesi ve yürütmekte olduğu eğitim programıyla toplum içerisinde sahih kıraâtlerin yaygınlaşmasını, sahih kıraâtlere sahip hafız ve kurrâların yetişmesini sağlamak, sahih kıraâtlerin muhafazasını ve sahih -sahih olmayan ayrımının doğru bir şekilde anlaşılmasını sağlayabilmeyi hedeflemektedir. Yapacağımız bu çalışma İslam dünyasının farklı bölgelerinin ortak paydası olan İslam ilim geleneğinin muhafazası adına yapmış olduğu çalışmaları bir nebzede olsa gözler önüne serecektir. Çalışmanın bilimsel proje olarak sunulması farklı bölgelerde yapılan kıraât çalışmalarını ortaya koyacağı anlamına geleceğinden, İslam ilim mirasının tek bir kaynaktan beslendiğini ortaya koyması açısından büyük bir önem arz etmektedir."
