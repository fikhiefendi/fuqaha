abstract: "Para tarihsel olarak değişim aracı olma, servet biriktirme ve hesap birimi olma gibi özellikleri nedeniyle insanlık tarihini etkileyen ve iktisadi hayatı düzenleyen temel bir unsur olmuştur. Zaman içinde paranın formunda ve kullanım alanındaki değişim hem iktisadi hayatı hem de finansal kuruluşları derinden etkilemiştir. Dijital inovasyon (yenilikçilik), hayatın birçok alanında olduğu gibi ekonominin tüm sektörlerinde kapsamlı değişiklikler meydana getirmiştir. Bunlardan bir tanesi de dijital paradır. Merkez Bankası Dijital Parası da (MBDP) o ülkenin yerel para birimi cinsinden ifade edilen, merkez bankasının doğrudan yükümlülüğü olan paranın dijital formudur. Bu yeni para formunun, tasarım ve uygulama şekline göre finansal kuruluşlar üzerinde önemli etkileri olacağı düşünülmektedir. Bu çalışmada öncelikle dünyada para otoriteleri tarafından yeni tartışılan ve araştırılan MBDP'nin kavramsal ve tasarım özellikleri ortaya konmuştur. MBDP'nin iktisadi hayata olası etkileri incelenmiş ve özgün bir dijital para tedavül model önerisi sunulmuştur. Çalışmada dijital paranın tedavüle verilmesi durumunda bankacılık sektörüne olası etkisi simülasyon modeli ile analiz edilmiştir. Çalışma bankacılık sektörü bağlamında gerçekleştirilmiş ve analiz katılım bankaları özelinde genişletilmiştir. Bu çalışmayı kıymetli yapan birkaç husus vardır: Öncelikle MBDP'nin yeni bir kavram olması ve henüz uygulaması olmaması nedeniyle literatürde öncü nitelikte bir araştırma özelliği taşımasıdır. İkinci olarak henüz merkez bankaları özelinde tartışılan bir kavramın akademik camianın dikkatine sunulacak şekilde tasarım parametrelerinin, iktisadi boyutunun tartışılmaya açılması ve bir model önermesi de dikkat çekicidir. Ayrıca MBDP'nin tedavüle verilmesi durumunda bankacılık sektöründe mevduattan MBDP'ye dönüşümün etkilerinin gerçek bankacılık verileri üzerinden analizinin yapılması en özgün katkı olarak ilgililerin dikkatine sunulmaktadır.“Dün dünde kaldı cancağızım. Bugün yeni şeyler söylemek lazım.”"
