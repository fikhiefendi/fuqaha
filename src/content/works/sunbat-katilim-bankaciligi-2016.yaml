abstract: "Türkiye'de bankacılık sisteminde üçüncü bir bankacılık türü olarak yerini almış olan Katılım Bankaları, sektöre dahil olduğundan bu yana karlılığını ve hızlı değişimini sürdürmektedir. Türk bankacılık sisteminde dört adet katılım bankası bulunmaktadır. Bu katılım bankaları 2005 senesinden bu yana kriz dönemleri dahil karlılıklarında devamlı olarak ilerleme kaydetmişler ve geleneksel bankacılık ile rekabet edebilir duruma ulaşmışlardır. Katılım bankaları Türkiye'deki toplam bankacılık sistemindeki aktif toplamının 2012 yılsonu itibariyle % 5,1'ine sahiptir. Rakamın küçük gibi gözükmesine karşın bankacılık anlayışı olarak geniş kitlelere ulaşmış olan katılım bankaları, sektörde yerini sağlamlaştırmıştır. Bu çalışmada katılım bankacılığı ve performansı hakkında farkındalık oluşturulması amaçlanmıştır. Çalışmanın ilk bölümünde finansal kurumlar ve araçları hakkında bilgiler verilmiştir. Çalışmamızın ikinci bölümünde faizsiz bankacılık, faizsiz bankaların dayandığı temel ilkeler, işlevleri, fon teminleri hakkında bilgiler verilmiştir. Üçüncü bölümde ise katılım bankalarının kavramı, gelişimi, dünyadaki ve Türkiye'deki gelişimi, özellikleri incelenmiştir."
