abstract: "İslâm hukukunda, şer'i hükümleri delillerden elde etme meselesi ehil kimseler tarafından büyük bir titizlikle yapılmıştır. Müctehitler şer'i bir hükmü delillerden elde etmeye çalışırken, öncelikle naslara, naslarda bunun delilini bulmayınca ictihada başvurmuşlardır. Bunun sonucunda farklı metodlar ortaya çıkmıştır. Bu metodların başında mütekellimîn ve fukahâ metodları gelmektedir. Müctehidler, geliştirdikleri metodları temellendirmek ve diğer metodların delillerini zayıf göstermek için eserler kaleme almış ve bu eserlerinde diğer metodların görüşlerine yer vererek eleştirmişlerdir.“Şemsü'l-eimme”olarak şöhret bulan İmam es-Serahsî, fukahâ (el-Hanefîyye) metoduna göre kaleme alınmış olduğu Temhîdu'l-Fusûl fi'l-Usûl adlı eserinde Hanefîlerin usûle dair görüşlerini temellendirmeye çalışırken diğer mezheplerin görüşlerine de atıflar yapıştır. Serahsî'nin en çok atıf yaptığı ve genel anlamda eleştirdiği fakihlerden birisi de Şâfiî'dir. Biz tezimizde, Serahsî'nin Temhîdu'l-Fusûl fi'l-Usûl adlı eserinde Şâfiî'ye nispet ettiği görüşler ile bu görüşlerin gerek Şâfiî, gerekse Şâfiî ulemasına eserlerindeki ilgili meselelerle mukayesesi üzerinde durduk."
