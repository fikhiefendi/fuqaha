abstract: "Müslüman toplumlar içinde Şiî-İsnâaşeriyye mezhebi, Ehl-i sünnet'ten sonra en fazla müntesibe sahip olan fırkadır. Bu fırka, tarihî süreç içerisinde Usûliyye ve Ahbâriyye olmak üzere iki karşıt ekole ayrılmıştır. Kur'an, sünnet, icmâ ve akıl, usûlî ulemânın ahkâm konusunda temel aldığı dayanaklar olarak kabul edilirken, ahbârî ulemâ dinî hükümlerin aklî istidlâllerle elde edilemeyeceğini savunmuş ve masum imamlara dayanmayan icmâyı da reddetmiştir. Her ne kadar günümüz İsnâaşeriy-ye'sinde Ahbâriyye etkisini büyük ölçüde kaybetmiş görünse de zaman zaman bazı usûlî ulemânın ahbârî tutumlar sergilediği göze çarpmaktadır. Ahbâriyye'nin aklı red-detmesi nedeniyle günümüzde de akla karşı muhalif tutum sergileyen bazı Şiî âlimler, geçmişteki ahbârî çizgiyle ilişkilendirilmektedir. Bu âlimlerden biri Mirza Muhammed Mehdi Garavî İsfahânî'dir (1885-1946). Mirza İsfahânî, Necef ilim havzasında usûlî bir eğitim almış olmasına karşın felsefe ve tasavvufa sert biçimde karşı çıkmıştır. Kendisinden sonra Meşhed ilim havzasında görüşleri talebeleri vasıtasıyla yayılan Mirza İsfahânî, daha sonraları Mekteb-i Tefkik olarak adlandırılan çağdaş dinî bir akımın lideri olarak şöhret kazanmıştır. Bu bağlam-da, temel fikrî altyapısını Mirza İsfahânî'den alan ve günümüzde felsefe ile tasavvuf karşıtlığıyla tanınan Mekteb-i Tefkik'e yönelik eleştiriler, Şiî çevrelerde çokça araştırma konusu olsa da bu mesele ülkemizde özellikle İslâm Mezhepleri Tarihi ve çağdaş İslâmî akımlar alanında yeterince işlenmemiştir. Bu araştırmada, söz konusu ekolün ideoloğu Mirza İsfahânî'nin hayatı, temel görüşlerini ortaya koyduğu Ebvâbu'l-Hüdâ adlı ese-rindeki düşünceleri ile kendisinden sonra ortaya çıkan Mekteb-i Tefkik ve Encümen-i Hüccetiye ekolleri, İslâm Mezhepleri Tarihi araştırmalarında kullanılan“fikir-hadise / zaman-mekân irtibatı”yöntemi çerçevesinde incelenmiştir."
