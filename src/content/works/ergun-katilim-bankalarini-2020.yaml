abstract: "Katılım bankaları, faizsizlik prensibi yönüyle diğer bankalardan ayrılmaktadır. Çalışmada katılım bankalarını tercih eden bireysel ve kurumsal (ticari) müşterilerin bu bankaları tercih etmedeki benzer ve farklı davranışsal yönlerinin tespit edilmesi amaçlanmıştır. Çalışma Türkiye İstatistik Kurumu tarafından belirlenen Türkiye geneli 12 bölge düzeyini kapsamaktadır. Katılım bankası müşterilerinin davranışsal yönlerini etkileyebilecek 9 ana faktör ve 33 alt faktör ile bir ölçüm modeli oluşturulmuştur. Bu model, elde edilen verilerin normal dağılım göstermesinden dolayı maksimum olabilirlik hesaplama tekniği doğrultusunda ölçüm modelinin toplanan veriler ile uyumlu olup olmadığı ikinci düzey Doğrulayıcı Faktör Analizi yöntemiyle test edilmiştir. Veri toplama aracı olarak bireysel ve kurumsal müşteri kategorisi için ana ölçeği aynı olan anket formu kullanılmış olup, toplam 440 bireysel ve 393 kurumsal (ticari) katılım bankası müşterisine ulaşılmıştır. Analizden daha doğru sonuçlar elde etmek için müşteriler ile yüz yüze görüşülerek anket formu müşterilere doldurtulmuştur. Analizden elde edilen bulgularda, katılım bankalarını tercih eden bireysel müşterilerin davranışları üzerinde tutum, sosyal etki, dini hassasiyet, yardımseverlik, güven ve farkındalık faktörleri ile katılım bankalarının toplum üzerindeki imaj ve itibarının, kurumsal müşterilere göre daha fazla pozitif yönde etkili olduğu istatistiksel olarak saptanmıştır. Kurumsal müşterilerin ise bankacılık işlemlerinde davranışsal olarak memnuniyet, doğruluk ve özellikle maliyet ile ilgili konularda daha hassas oldukları tespit edilmiştir. Buna ilave olarak televizyon, gazete, radyo gibi geleneksel medya araçları ile twitter, facebook, instagram gibi sosyal medya araçlarındaki katılım bankalarına yönelik verilen reklamlardan etkilenmediği ortaya çıkmıştır. Sonuç olarak, uyum göstergelerine göre bireysel ve kurumsal müşteriler için oluşturulan ölçüm modelleri Doğrulayıcı Faktör Analizi ile doğrulanmıştır."
