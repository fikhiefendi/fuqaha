abstract: "Bu çalışmamızda Lâle Devri'nde (1718-1730) Osmanlı Devleti'nin başkenti İstanbul'un üç büyük kazasından birisi olan Galata'da yaşayan Müslim ve gayrimüslim kadınlar hakkında bilgiler verilmiştir. Çalışmada, dönem hakkında bilgi veren kronikler, 1718-1730 yılları arası Galata Kazası'na ait mühimme, şikâyet defterleri ve Ali Emiri, Cevdet gibi diğer fonlardaki merkezi arşiv belgeleri ile mahalli arşiv belgeleri olan Galata Şer'iyye Sicilleri'dir. Ayrıca o dönemde verilen fetvaların yer aldığı Fetva Mecmuaları, seyahatnameler ve bugüne kadarki yapılan araştırmalardan istifade edilmeye çalışılmıştır. Tezimiz giriş, beş ana bölüm ve sonuçtan meydana gelmektedir. Giriş bölümünde; Osmanlı kadını hakkında yapılan çalışmalar, literatür değerlendirmesi ve tezin amacı açıklanmıştır. Birinci bölümde; İstanbul tarihi hakkında kısa bir giriş yapılmış, dönemin siyasi atmosferi, tarih içinde Galata'nın durumu, demografik yapısı ve Galata Mahkemesine vâki olan müracaatların nitelikleri hakkında bilgiler verilmiştir. İkinci bölümde; kadının nişan, evlenme ve boşanma gibi aile içerisinde yaşanması muhtemel konumları üzerinde durulmuştur. Üçüncü bölümde; ekonomik hayatta kadının rolü, zenginliğinin kaynakları üzerinde durulmuş ve tasarrufları hakkında bilgiler verilmiştir. Dördüncü bölümde; hukuk karşısında kadının durumu ele alınmıştır. Beşinci bölümde ise; kadının toplum içerisinde konumu, vakıflar konusundaki faliyetleri üzerinde durulmuştur. Tezimiz kadın üzerine değerlendirmelerin yapıldığı sonuç kısmı ile bitmektedir. Bu çalışmanın Osmanlı kadın tarihi çalışmalarına katkı sağlaması umulmaktadır."
