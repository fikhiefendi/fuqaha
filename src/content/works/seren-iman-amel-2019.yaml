abstract: "Çalışmamız, iman ve amel münasebetini özellikle Ebu Hanîfe ve Mürcie'nin görüşleri etrafında ele almaktadır. Onlara göre iman, tasdik ve dil ile ikrardır. Ameller ise imana dâhil değildir. İmanın, kalbin tasdiki ve dilin ikrarı olduğu hususunda aynı şeyi savunmalarına karşın Ebu Hanîfe'nin, amel konusunda Mürcie kadar katı ayrımcılığı kastetmediği kendi ifadelerinden anlaşılmaktadır. O, iman-amel arasındaki önemli ve ayrılmaz bağı korumaya çalışmış, imanın bireyi tüm yönleriyle kuşatan, eğiten ve koruyan etkilerine gerekli önemi vermiştir. Buna rağmen“mâsiyetlerin imana zarar vermediğini”iddia eden Mürciîler'den olmak ile itham edilmiştir. Çalışmamızda Ebu Hanîfe'ye atfedilen bu ithamın muhtemel sebeplerine yer verilerek konuya açıklık getirilmeye çalışılmıştır. Amellerin hafife alınmasına imkân veren Mürciî iman nazariyesinin sonuçları günümüzde de bir problem olarak karşımıza çıkmaktadır. Bu çalışma vasıtasıyla iman-amel arasındaki ilişkinin niteliği incelenmiş, Mürciî nazariyenin olumlu ve olumsuz sonuçları araştırılarak günümüz iman-amel anlayışında görülen kayıtsızlığa Mürciî nazariyenin etkisinin olup olmadığı tespit edilmeye çalışılmıştır."
