abstract: "Bu çalışmanın konusunu fıkhın alt disiplinlerinden olan kavâid edebiyatı alanında Zeynüddîn İbn Nüceym'in (ö. 970/1563) telif etttiği el-Eşbâh ve'n-nezâir adlı eserine Pîrîzâde İbrahim'in (ö. 1099/1688) 'Umdetü zevî'l-basâir li-halli mühimmâti'l-Eşbâh ve'n-nezâir adıyla yaptığı haşiyenin tahkik ve tahlili oluşturmaktadır. Eserin tahkikinde sekiz nüsha karşılaştırması yapılmış, tahlil kısmında ise Pîrîzâde'nin haşiyesini telif etme gerekçelerinden hareketle eserin tahlili tamamlanmıştır. Ayrıca İbn Nüceym'in el-Eşbâh ve'n-nezâir eseri üzerine yapılan çalışmaların tespitinde daha çok yazma nüshalardan istifade edilmiştir. Araştırmada kavaid edebiyatında eşbâh ve nezâir türünün oluşumunun gerekçeleri üzerinde durulmuş, eşbâh ve nezâir kavramlarının analizleri ve bu sahada telif edilen eserlerin karşılaştırılması yapılmıştır. Eserin tahlili kısmında Pîrîzâde'nin, İbn Nüceym'in el-Eşbâh'ındaki kapalı ifadeleri açıkladığını, Hanefî mezhebi kaynaklarında göremediği bazı meseleleri tespit ettiğini, Hanefî mezhebinin muteber fıkıh ve fetvâ kitaplarında yer alan fakîhlerin görüşlerini esas aldığını, ihtilaflı konularda farklı görüşlere yer vererek müftâ-bih görüşü belirttiğini, sahih/esah olan rivayetleri zikrettikten sonra tercihini ortaya koyduğunu, mütekaddimîn ile müteaahhirîn fakîhlerinin görüşlerine yer verip mu'temet ve râcih görüşleri tercih ettiğini, meşayıhın bazı rivayetlerini zamana uygun bulmadığını belirttiğini, mefhumu rivayet ile amel ettiğini, yeri geldikçe diğer mezheplerin görüşlerine yer verdiğini tespit ettik."
