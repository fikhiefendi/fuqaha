abstract: "Ev sahibi olma, her bireyin bu hayatta gerçekleştirmek istediği bir olgudur ve bu hedef için genellikle borçlanma yöntemine başvurulur. Bu noktada bireylerin gerek değer yargıları gerekse gelir seviyelerine bağlı olarak borcun geri ödenmesi sürecine yönelik farklı seçenekler sunmak, finansmanı sağlayan kurumların göz önünde tutması gereken bir husustur. Faizsiz Finans çerçevesinde geliştirilen Ortaklığa Dayalı Konut Finansmanında, finansmanı sağlayan kurum ile müşteri konutun ortaklarıdır ancak müşteri, konutun kira gelirinden aldığı pay ile birlikte finansör kuruma yaptığı ilave ödemelerle ortaklıktaki hissesini artırma hakkına sahiptir. Müşterinin zamanla konutun tek sahibi olmasıyla sonuçlanan bu ödeme sürecine ilişkin yapılmış çalışmalar, ödeme miktarlarındaki dönemler arası değişimler dikkate alınarak oluşturulan modeller literatürde mevcuttur. Bu çalışmada, Ortaklığa Dayalı Konut Finansmanında borcun geri ödenmesi sürecinde atlamalı ödeme yaklaşımı temel alınarak kira ve geri ödeme miktarlarının dönemler itibarıyla geometrik ve aritmetik değişim gösterdiği durumlar için, kira gelirinden alınan pay ve ödemelerle müşterinin ortaklıktaki hissesinin nasıl değiştiğini gösteren matematiksel ifadeler elde etmek amaçlanmıştır. Bu ifadeler sayısal örneklerle desteklenmiştir. Faizsiz Finans Sisteminin yenilikçi bir uygulaması olan Ortaklığa Dayalı Konut Finansmanında borç ödeme sürecinin farklı yaklaşımlarla ele alınıp düzenlenebilmesi, Ortaklığa Dayalı Konut Finansmanının klasik finans sistemindeki benzer uygulamalara bir alternatif olabileceğini gösteren önemli bir husustur."
