abstract: "Bu çalışma, Türkiye'deki, analiz için seçilmiş geleneksel ve katılım bankalarının 2018-2023 dönemindeki performanslarını CAMELS derecelendirme sistemi çerçevesinde karşılaştırmayı amaçlar. Çalışmada, geleneksel ve katılım bankalarının sermaye yeterliliği, varlık kalitesi, yönetim kalitesi, kârlılık, likidite ve piyasa riski duyarlılıkları incelenmiş ve bu bağlamda her iki bankacılık türünün performans farklılıkları ortaya konulmuştur. 2023 yılı itibarıyla, 1,0-1,5 değerlendirme aralığında“Güçlü”performans sergileyen bankalar şunlardır: İş Bankası, VakıfBank, Akbank, Ziraat Katılım ve Vakıf Katılım. 1,6-2,5 değerlendirme aralığında“Yeterli”performans gösteren bankalar ise Garanti Bankası ve Ziraat Bankası'dır. 2,6-3,5 değerlendirme aralığında“Makul”performans sergileyen bankalar Kuveyt Türk ve Türkiye Finans'tır. 3,6-4,5 değerlendirme aralığında“Sınırda”performans gösteren banka Albaraka Türk'tür. Sonuç olarak, Geleneksel bankalar, kârlılık, sermaye yeterliliği, aktif kalitesi, yönetim kalitesi ve piyasa riskine karşı duyarlılık gibi kriterlerde katılım bankalarına kıyasla daha üstün performans sergilemektedir ve Camels notları daha iyidir. Öte yandan katılım bankaları, likidite konusunda daha avantajlıdır. İki bankacılık sisteminin güçlü ve zayıf yönleri göz önünde bulundurularak, stratejiler geliştirilebilir. Katılım bankaları sermaye, kârlılığı artırma ve piyasa riskine karşı farklı stratejilere odaklanmalı ve yönetim kalitesini iyileştirmeli, geleneksel bankalar ise likidite yönetimini daha etkin yönetmelidir"
