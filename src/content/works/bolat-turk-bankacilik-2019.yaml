abstract: "Bankalar ülkelerin finansal piyasalarında rol oynayan en önemli aktörlerindendir ve ekonomik sistemde birçok alanda çeşitli faaliyetlerde bulunurlar. Bu faaliyetleri yerine getiren bankalar çalışma yöntemlerine göre bazı farklılıklar göstermektedir. İslami bankalar ya da Türkiye'deki adıyla katılım bankaları faaliyetlerinde faizsizlik prensibini benimsemişler ve iş akışlarını buna göre düzenlemişlerdir. Çalışmada öncelikle Türkiye'deki ve QISMUT (Katar, Endoneyza, Suudi Arabistan, Malezya, Birleşik Arap Emirlikleri, Türkiye) ülkelerindeki ekonomik sistem incelenmiş ve daha sonra bu ülkelerin bankacılık sistemleri anlatılmıştır. Ayrıca bu ülkelerdeki İslami bankalar ve Türkiye'deki katılım bankalarının çeşitli finansal büyüklükleri karşılaştırmalı olarak incelenmiştir. Çalışmanın amacı; Türkiye'deki katılım bankaları ile QISMUT ülkelerindeki İslami bankaların finansal açıdan etkin olup olmadıklarının belirlenmesidir. Araştırmada yöntem olarak Veri Zarflama Analizi (VZA), Malmquist Toplam Faktör Verimlilik Endeksi (MTFVE) ve Süper Etkinlik (Super Efficiency) modelleri birbirine entegre edilerek kullanılmıştır. Analizde karar birimleri olarak her ülkedeki İslami Bankalar seçilmiştir. Analiz dönemi 2012-2017 yılları arası verileri kapsamaktadır. Analizde girdi değişkenler olarak; Toplam Varlıklar ve Toplam Özkaynaklar, çıktı değişkenler olarak; Toplam Gelir ve Net Kar belirlenmiştir. Analiz girdi yönelimli olarak, ölçeğe göre sabit getiri altında (CCR) ve ölçeğe göre değişken getiri (BCC) altında ayrı ayrı yapılmıştır. Yapılan analizler ve elde edilen sonuçlara göre; incelenen yılların tamamında (2012-2017) analize dahil edilen bankalardan etkinlik skoruna ulaşan banka sayısı etkinlik skoruna ulaşamayan banka sayısından çok daha düşük çıkmıştır. Bu çalışma sonucunda incelenen yıllarda ve ülkelerdeki İslami bankaların genellikle düşük performanslı ve uygun olmayan ölçeklerde çalıştıkları görülmüştür."
