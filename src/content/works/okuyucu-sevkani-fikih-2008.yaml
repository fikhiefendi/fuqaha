abstract: "?Şevkânî'nin Fıkıh Tarihi Anlayışı ve Mezheblere Bakışı? ismini taşıyan bu tezde, 1760?1834 yılları arasında Yemen'de yaşayan Şevkânî'nin fıkıh tarihini nasıl ele aldığı ve mezheblere bakışının hangi istikamette olduğu incelenmiştir. Tez, bir giriş ile iki bölümden oluşmaktadır.Giriş bölümünde Şevkânî'nin hayatı ve yaşadığı dönem ana hatlarıyla ortaya konmuş ve meşhur eserleri tanıtılmıştır. İlk bölümde öncelikle, Şevkânî'nin fıkıh tarihi anlayışını belirlediğini düşündüğümüz birtakım usûl meseleleri hakkındaki görüşleri ortaya konmuş ve bu görüşlerinin geçmiş fıkıh mirasını el alışında nasıl bir belirleyiciliğe sahip olduğu tespit edilmeye çalışılmıştır. Daha sonra Şevkânî'nin fıkıh tarihini dönemlendirişi, fıkıh usûlü hakkındaki tenkitleri, ictihad kapısı ve müctehidler hakkındaki görüşleri de yine bu açıdan ortaya konmuştur. İkinci bölümde ise Şevkânî'nin mezheblerin ortaya çıkışı ve yayılması hakkındaki düşünceleri, mezheb imamları hakkındaki kanaatleri, mezheb müntesiblerine yönelttiği tenkitler ile mezheb içi fıkhî faaliyetlere nasıl baktığı incelenmiştir.Tezde yürütülen inceleme neticesinde, Şevkânî'nin bütün bir fıkıh tarihine bakışını belirleyen en önemli hususun, ictihad kapısının hiçbir dönemde kapanmadığı ve kapanamayacağı hakkındaki kanaati olduğu ortaya çıkmıştır. İctihad karşısında taklidin kabul edilemeyeceğini düşünen Şevkânî'nin, ?bidat? olarak nitelediği bu tavırla yine ?bidat? olarak nitelediği mezhebler arasında kurduğu ilişki ise tezde ortaya konan diğer bir önemli husustur. Şevkânî'nin bu görüşleri vefatından kısa bir müddet sonra ictihad tartışmalarında isminin sıkça zikredilmesini sağlamış ve eserleri dolayısıyla da fikirleri geniş bir yayılma imkânı bulmuştur."
