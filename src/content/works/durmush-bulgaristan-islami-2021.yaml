abstract: "Bu tez Bulgaristan'da yaşayan Müslümanların durumunu ve orada faaliyet gösteren İslami akımları konu almıştır. Türkiye'ye yakınlığının yanında ciddi yerleşik Türk-Müslüman nüfusa sahip olmasıyla ve uzun bir tarihi geçmişe dayanan Hanefi-Matüridi anlayışını sürdürmüş olması bu konuda ayrı bir önem taşımaktadır. Bu çerçevede bütün akımları konu etmenin imkânsızlığından kaynaklı Bulgaristan'da kalıcı faaliyet gösteren ve kendilerine taraftar oluşturan gruplar seçilmiştir. Tezimizde İslami akımları, tekfirci akımlar, mehdici akımlar ve tasavvuf kaynaklı kültürel yapılar olarak üç ana kategoriye ayırarak ele almaya çalıştık. Bulgaristan toplumunun bu akımlarla karşılaşması, tanışması daha ziyade son dönemde yani 1990 sonrası, Bulgaristan'ın demokratik sisteme geçişi ve dini alanda özgürlüğün elde edilmesiyle olmuştur. Bu doğrultuda tezimiz giriş, üç ana bölüm ve sonuçtan oluşmaktadır. Girişte çalışmanın konusu, metodu, sınırları ve kaynakları ele alınmıştır. Birinci bölümde Bulgaristan'ın kuruluşu ve geçirdiği tarihi süreç incelenmiştir. İkinci bölümde konuya tesiri açısından Bulgaristan Başmüftülüğü kurumunun kuruluşu ve tarihi, ülkenin din eğitimi konusundaki işlevi ele alınmıştır. Üçüncü bölüm ise Bulgaristan'da faaliyet gösteren İslami akımlara ayrılmış, durum ve faaliyetlerine yer verilmiştir. Sonuç kısmında ise, tezimizde ulaşılan sonuçlar kısaca verildikten sonra genel olarak değerlendirilmiştir."
