abstract: "Türk Hukukunda kira sertifikası kavramı Sermaye Piyasası Kurulu tarafından 01.04.2010 tarihinde Resmi Gazete'de yayımlanan 27539 sıra sayılı tebliğ ile anılmaya başlanmıştır. Bu tebliğ“Kira Sertifikalarına ve Varlık Kiralama Şirketlerine İlişkin Esaslar Hakkında Tebliğ”adıyla yürürlüğe girmiştir. Akabinde bu tebliğ III-61.1 sıra sayılı tebliğ ile yürürlükten kaldırılmıştır. Türk Hukukunda kanuni düzenlemelerinde kendisine yer bulamayan kira sertifikası kavramı nihayet 6362 sayılı Sermaye Piyasası Kanunu m. 61 ile kanuni dayanağına da kavuşmuştur. Özellikle İslam finansında kira sertifikası İslami yasaklara uygun ihraç edilmesi zorunluluğu nedeniyle Müslüman yatırımcılar tarafından büyük ilgi görmektedir. Kavramın hukukçular tarafından az bilinmesi ve ele alınması sebebiyle tarafımca bu alandaki boşluğu doldurmak üzere çalışma yapılması planlanmış ve akabinde bu tez hukuk camiasına kazandırılmıştır. Bu çalışmada öncelikle kira sertifikası yani İslam Şeriat Hukukundaki adıyla sukukun tarihçesi Dünyada(özellikle İslam ülkelerinde) ve Türkiye'de incelenecektir. Akabinde kira sertifikasının özellikleri ve ihracında başat rol oynayan aktörler incelenecektir. Sonrasında Türk Hukunda III-61.1 sıra sayılı tebliğde düzenlenen kira sertifikası çeşitleri incelendikten sonra İslam Hukukunda yaygın olan sukuk çeşitleri incelenecek ve son bölümde kira sertifikasının nasıl ihraç edileceğinden bahsedilecektir."
