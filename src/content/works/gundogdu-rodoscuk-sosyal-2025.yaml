abstract: "Bu tez çalışmasında, Sultan II. Mustafa döneminde (1695-1703) Osmanlı Devleti'nin önemli şehirlerinden Rodosçuk'un sosyal ve ekonomik yapısı şer'iyye sicillerine dayanılarak incelenmiştir. Araştırmanın temel kaynaklarını, söz konusu yıllara ait dokuz adet şer'iyye sicili oluşturmuştur. Bu siciller dönemin toplumsal ilişkilerini, aile yapısını, hukuki düzenlemelerini ve ekonomik faaliyetlerini anlamada birincil kaynak niteliği taşımaktadır. Çalışma bir giriş ve iki ana bölümden meydana gelmektedir. Birinci bölümde Rodosçuk'ta sosyal yaşam ele alınmış; aile yapısı, evlilik ve boşanma, mehir ve nafaka uygulamaları, miras ve veraset, vasi ve vekil tayini, kölelik, ihtida (din değiştirme) gibi konular değerlendirilmiştir. Ayrıca toplum düzenini bozan suçlar (hırsızlık, cinayet, darp) ile ilgili kayıtlar analiz edilmiştir. İkinci bölümde ise ekonomik yaşam üzerinde durulmuş; ticari faaliyetler, mülk alım-satımı, vergi, meslekler, servet dağılımı, borçlanma ilişkileri, hibe, vakıflar ve imar faaliyetleri incelenmiştir."
