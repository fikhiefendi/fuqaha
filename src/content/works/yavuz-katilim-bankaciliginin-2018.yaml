abstract: "Dünya'da ve ülkemizde katılım bankacılığı ürünlerinin sayısı ve kullanım miktarı son on yıldır artış trendindedir. Bu ürünlerden sukuk, geleneksel tahvil yatırımlarının sağladığı getiriye benzer bir getiri sağladığı için hem ihraççılar hem de yatırımcılar tarafından sıklıkla kullanılan bir finansman aracı haline gelmiştir. Proje finansmanı da özellikle son yıllarda, büyük projelerde kullanılmaktadır. Proje finansmanı işleyiş ve felsefe olarak faizsiz finansman ile benzerlik göstermektedir. Faizsiz finansmanda, finansmanı sağlayan tarafın getirisi, zamana değil kazanılacak gelire bağlıdır. Bununla birlikte ticari bir risk de içermesi gerekmektedir. Bu yönüyle hem proje finansmanı hem de faizsiz finansman amaç bakımından birbirine benzemektedir. Sukuk konusunda da: Bilindiği gibi Türkiye tasarruf açığı veren bir ülkedir. Bu nedenle büyük tutarlı projelerde alternatif bir yol olarak sukukun kullanılıp kullanılamayacağı bu çalışmanın temel felsefesini oluşturmaktadır. Sukukun da dayandırıldığı bir varlık olması nedeniyle sukuk ve proje finansmanı entegre edilebilir. Bu amaçla; çalışmada öncelikle faizsiz bankacılık sisteminin temel felsefesi üzerinde durulmuştur. Sukuk ürününün temelini teşkil eden sistem ile ilgili bilgiler verildikten sonra sukukun teorisi, işleyişi, dünyadaki ve Türkiye'deki durumu aktarılmıştır. Son olarak da proje finansmanının sukuk ile birlikte entegre edilmesinin ve Kanal İstanbul projesinin alternatif bir finansman aracı olup olamayacağı tartışılmıştır."
