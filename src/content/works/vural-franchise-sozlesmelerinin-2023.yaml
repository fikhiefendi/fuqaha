abstract: "Franchise sözleşmeleri, bir firma tarafından kontrol edilen bir marka, ürün veya hizmetin başka bir kişi ya da kuruluş tarafından kullanılmasını sağlamak için yapılan sözleşmelerdir. Bu sözleşmeler, franchise veren firma tarafından sağlanan mali destek, eğitim ve danışmanlık hizmetleri ile franchise alan tarafının kendi işletmesini kurmasını ve yürütmesini sağlar. Bu çalışma, franchise sözleşmelerinin Türk Borçlar Hukuku ve İslam Borçlar Hukuku açısından incelenmesini amaçlamaktadır. İlk bölümde, franchise sözleşmelerinin genel tanımı, tarihçesi, uygulama şekli ve taraflar açısından amaçları, avantajları ve dezavantajları ele alınmaktadır. İkinci bölümde, Türk Borçlar Hukuku açısından franchise sözleşmelerin hukuki niteliği, karakteristik özellikleri, benzer sözleşmelerle karşılaştırılması, unsurları, tarafların hakları ve borçları, sözleşmenin sona ermesi gibi konular ele alınmaktadır. Üçüncü bölümde ise konu İslam Borçlar Hukuku açısından incelenmektedir. Tez sonunda, franchise sözleşmelerinin Türk Borçlar Hukuku ve İslam Borçlar Hukuku açısından değerlendirilmesi sonucunda ortaya çıkan sonuçlar sunulmaktadır. Araştırma, franchise sözleşmelerinin modern bir sözleşme türü olarak temel İslami kriterleri ihlal etmemesi şartıyla İslam hukukuna uygun olduğu sonucuna ulaşmıştır. Genel olarak franchise sözleşmelerinin hak ve menfaatlerin satımı, örf ve maslahat ilkeleri üzerine kurulu olduğunu anlaşılmıştır. Ayrıca, franchise sözleşmelerinin tekelciliğe sebep olabilecek bazı sorunlu yönleri olduğu, ancak bu konuların sözleşmeyi düzenleyen taraflar tarafından ele alınması gerektiği vurgulanmıştır."
