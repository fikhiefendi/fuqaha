abstract: "Islam, Allah'ın insana bağışladığı en pahalı ve en kıymetli hediye olmasiı sebebiyle insan hayatına çok büyük bir önem vermiştir. O halde hayatı veren O olduğu için herhangi bir kişinin bu hayata son vermeye hekki yoktur. Bundan dolayı islam, bir kişinin hayatına haksız yere kast etmeyi en büyük günahlardan saymış ve onu en büyük cezaya çarptırma ile tehdit etmiştir. Aynı zamanda islam hukuku hak eden kişilerin öldürülmesini de mübah kılmıştır. Bu şekilde katledilmesine izin verilen gruplar Kur'an'da açıklanmıştır. Bu izin yeryüzünde fitne ve bozgunculuğun def edilmesi için verilmiştir. Böylece Kur'an-ı Kerim kısas ilkesini - ki o aynıyla karşılık vermektir - insan hayatının korunması ve yaşamın garanti altına alınması olarak ifade etmektedir. islam bir kişinin hayatına son vermeyi bütün insanlığın hayatına son vermek ile aynı tutmuştur. Zira bir kişinin hayatına son vermekten çekinmeyen insan yüzlerce veya binlerce kişinin de hayatına son vermekten çekinmez. Bunun tam karşılığı olarak da bir kişinin hayatını ölümden kurtarıp yaşamasına vesile olan da tüm insanlığı yaşatmış gibi kabul edilir."
