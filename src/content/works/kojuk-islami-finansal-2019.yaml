abstract: "Geçmişi milattan önceki yıllara dayanan türev araçlar ilk başta riskten korunma amacıyla ortaya çıkmıştır. Malların arz ve talebinin fiyatlardaki dalgalanmayı tetiklemesinde bir önlem olarak düşünülmüştür. Fakat gerçekleştirilen işlemlerin spekülasyon ve manipülasyona açık olması, bir taraf kazanırken bir tarafın kaybetmesi ve kaldıraç etkisinden dolayı bu miktarların büyüklüğü, Amerika'da yaşanan mortgage balonu üzerindeki etkisi de düşünüldüğünde riskten ne kadar koruduğu şaibeli hale gelmiştir. Müslüman kesimin fonlarını geleneksel riskten korunma araçlarının çekememesi, türev araçların İslam hukuku kurallarının temel yasakları olan garar, faiz ve kumar ilkelerini çiğnemesi, geleneksel riskten korunma araçlarının bu ilkelerle kesinlikle bağdaşmaması İslami Finansın oluşumunda etkili olmuştur. İslami finansal sözleşmelerin şartlarının net ve açık olması ve bu finansman biçiminin ticaret odaklı çalışması kriz dönemlerinde gayrimüslim yatırımcılarında dikkatini çekmiştir. Bu amaçla en bilinen borsalarda İslami endeksler oluşturulmuştur. Bu gelişmeler sonucunda bu sözleşmelerinde riskten korunma amacıyla kullanılıp kullanılamayacağı, İslami finansal araçların türev araçlardan riskten koruma da daha etkili olup olmadığı ya da İslami finansın bu amaçla ürün gelişiminin incelenmesi sorunsalını ortaya çıkarmıştır. Bu çalışmada geleneksel finans sistemine ait olan türev araçların temel kavramları açıklanarak, işleyişleri ve birbirleriyle olan farkları, İslami finansal araçların temel ilkeleri, sözleşme türleri açıklanmaya çalışılmıştır. Son bölümde ise bu iki birbirinin alternatifi olan finansal sistemin benzer ve farklı yönleri, riskten koruma şekilleri ve riskleri anlatılmaya çalışılmıştır. Bu tezin temel sorunsalı olan riskten koruma yöntemi olarak türev araçların mı yoksa İslami sözleşmelerin mi daha etkili olduğu konusu literatür taramasıyla araştırılacaktır."
