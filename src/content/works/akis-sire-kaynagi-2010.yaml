abstract: "Hz. Peygamber'in hayatı ile ilgili yapılan çalışmalarda siyer ve meğazi kitaplarının yanı sıra, diğer İslamî ilimler alanında hazırlanan eserler de kaynak olarak kullanılmaktadır. Bu noktadan hareketle ele alınan Serahsî'nin el-Mebsut adlı eserinde de, Hz. Peygamber'in hayatının ve kişiliğinin çeşitli yönleriyle ilgili bilgilere ulaşılmıştır.Hazırladığımız tezde de görüldüğü gibi, özellikle Serahsî'nin bu eseri fıkıh kaynağı olduğundan, Hz. Muhammed'in hukukî alandaki uygulamaları ve oluşturduğu toplumun iktisadî hayatına dair oldukça detaylı bilgiler elde edilmiştir. Bunun yanı sıra eserde Hz. Peygamber'in, İslam'ı savunma ve Allah'ın adını yüceltme amacıyla gerçekleştirdiği gazve ve seriyyelere ilişkin haberler de genişçe yer almaktadır.el-Mebsut, Hz. Peygamber'in beşeri yönüne, O'nun ahlakî özelliklerine, toplumda yaşayan insanlarla hür-köle, kadın-erkek-çocuk vb. kişilerle olan yakın münasebetine dair rivayetler de içerir. Ayrıca aile ilişkileri, insan ilişkileri, cemaat konusundaki hassasiyeti, Müslümanların diğer din mensuplarına benzememesi konusundaki uyarıları vb. konulardaki tutumlarının anlaşılmasına yardımcı olacak örnekler de tespit edilerek değerlendirilmiştir.Serahsî el-Mebsut'ta bütün bunların yanı sıra, Hz. Peygamber'i, dönemin bazı kültürel ögelerini anlamamıza olanak sağlayan rivayetleri ve Resulullah'ın ibadet hayatına dair örnekleri de nakleder.Yaptığımız çalışma sonucunda görülmüştür ki, Serahsî fıkhî hükümlere delil olarak aktardığı bazı haberler de, maalesef yanlış bilgilere de yer vermiştir. Özellikle bazı isimler konusunda ilk dönem sîre kaynaklarında yer alan bilgilerle örtüşmeyen aktarımlarda bulunduğu görülmektedir.Yaptığımız bu çalışma ile şu sonuçlara ulaşılmıştır: Serahsî'nin el-Mebsut adlı eseri, rivayetler hususunda titiz davranmak şartıyla sîre çalışmalarında da kaynak olarak kullanılabilir. Ancak araştırmacıların özellikle tarihlendirilmemiş olayların tespitinde ve doğruluğu konusunda şüphe duyulan haberlerde dikkatli davranması gerektiği görülmektedir. Bu hususları göz önüne alan bir sîre araştırmacısı için el-Mebsut'un önemli katkılar sağlayabilecek bir kaynak olduğu söylenebilir."
