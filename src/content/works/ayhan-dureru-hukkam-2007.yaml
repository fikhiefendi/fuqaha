abstract: "Dürerü'l-Hükkâm fi Şerhi Mecelleti'l-Ahkâm, Osmanlı medenî hukuku sayılan Mecelle'nin ve genel hukuk çalışmalarının anlaşılması açısından büyük bir öneme sahiptir. Bu tezin amacı Dürerü'l-Hükkâm'ın Vekâlet kitabının latinize çalışması yapılarak o döneme ait hukuk çalışmalarının anlaşılmasına katkıda bulunmaktır. Ayrıca bahsi geçen ?vekâlet kitabı?nın kaynak tespitini yapmaktır. Üç ana bölümden oluşan tezin birinci bölümü Ali Haydar Efendi ve eserlerine dairdir. İkinci bölüm Dürerü'l-Hükkâm'ın ?vekâlet kitabı?nın hazırlanışı esnasında müellifin yararlandığı eserlere dair bilgiler içermektedir. Üçüncü bölüm de ise ?vekâlet kitabı?nın günümüz diline uyarlanarak latinize çalışması yapılmıştır. Çalışmada, sözcüklerin kendi dönemlerine ait kullanımları günümüz dilinde karşılık buluyorsa bugünkü kullanımıyla; karşılığı bulunmuyorsa orijinal formuyla sunulmuştur"
