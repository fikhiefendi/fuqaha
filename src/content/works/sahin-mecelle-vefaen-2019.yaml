abstract: "Kredi temin etmek maksadıyla ortaya çıkan vefaen satış sözleşmesi hukuk tarihinin en tartışmalı konularından biridir. Bu sözleşmeye yönelik ileri sürülen farklı hukuki nitelendirmeler sebebiyle uygulanacak hükümler konusunda da birbirinden farklı sonuçlara ulaşılmıştır. Mecelle-i Ahkam-ı Adliyye vefaen satış sözleşmesi için hukuki nitelendirme ve özel düzenlemeler yapmıştır. Fakat bu hukuki nitelendirme ile düzenlenen maddeler arasında tamamen uyumun olduğunu söylemek mümkün değildir. Bu çalışma kapsamında Mecelle'de satış sözleşmesinin düzenleme şeklinden sonra sırasıyla vefaen satış sözleşmesinin tarifi, hukuki niteliği, kurulması, hükümleri, sona ermesi, bu sözleşmeye ilişkin uyuşmazlıklar ve bu sözleşmenin tarih boyunca ortaya çıkan farklı görünümleri ele alınacaktır."
