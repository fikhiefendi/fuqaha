abstract: "Bu tez, Osmanlı‟nın son döneminde Yakovalı Ali Mürteza tarafından derlenen Ġlaveli Mecmua‟-i Cedide isimli eserin feraiz bölümünü konu edinmektedir. Ġlgili bölümdeki Osmanlıca fetvalar transkripsiyon edilerek içerdiği fetvaların tahlili yapılmıĢtır. Tezde miri arazinin çıkarılan kanunlarla intikal hakkı sahiplerinin geniĢletildiği gözlemlenmiĢtir. Ayrıca incelediğimiz kitap ve yazıldığı dönemle alakalı bazı bilgilere ulaĢmayı hedeflemektedir. ÇalıĢma, GiriĢ ve iki ana bölümden müteĢekkildir. GiriĢ‟te, fetvanın ve fetva kitaplarının öneminden bahsedilmiĢ ve faydalanılan kaynaklara değinilmiĢtir. Birinci Bölüm‟de, fetva olgusu ve Osmanlı‟da fetva olgusu tartıĢılmıĢ ve fetvaları veren Ģeyhulislamların hayatı özetlenmĢtir. Ayrıca nakillerde kullanılan kitaplar tanıtılmıĢtır. Ġkinci Bölüm‟de ise, feraiz alakalı fefetvaların transkripsiyonu verilmiĢ, akabinde ilgili fetvaların değerlendirmelerine yer verilmiĢtir. Son olarak, ilgili bölümle alakalı genel bir değerlendirme kaleme alınmıĢtır."
