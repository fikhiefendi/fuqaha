abstract: "Bu çalışmada Türkiye'deki katılım bankacılığının genel durumu ve katılım bankacılığındaki büyümenin bankacılık sistemine göre etkinlik yönünden durumu araştırılmıştır. Katılım bankaları, özellikle mevduat bankalarının faaliyet alanı içerisinde yer aldıklarından dolayı, ilk önce mevduat bankalarına genel olarak değinilmiş olup, sektör içindeki durumlarının analizi yapılmıştır. Ardından faizsiz bankacılığın gelişimi, işleyişi ve dünyadaki durumuna değinilerek, Türkiye'de faizsiz bankacılığı ifade eden katılım bankacılığı ele alınmıştır. Katılım bankacılığının sektör içerisindeki genel durumu ve gelişiminden sonra, 2003?2008 dönem aralığı itibariyle Veri Zarflama Analizi (VZA) yöntemi ile göreli olarak etkinliği incelenmiştir."
