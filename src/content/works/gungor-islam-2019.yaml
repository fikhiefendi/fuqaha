abstract: "İslâm hukuku vahiy kaynaklı bir hukuk sistemi olmasının yanı sıra günümüz modern hukuk sistemlerinin barındırdığı birçok kavramın da temelini teşkil etmektedir. Modern kavramlardan olan“Toplumsal sözleşme teorisi”de bireylerden oluşan halk kitlelerinin etrafında kümelendikleri muhteviyatı incelerken, aynı zamanda bir arada yaşama kültürünün temellerini de ele alan bir ıstılahtır. Aslında İslâm hukuku, toplumsal sözleşme teorisi ile benzer bir anlayış içerisinde insana dair hal ve davranışların sosyolojik anlamda bütünlüğünü irdelemekte ve gerektiğinde yönlendirici unsur olarak karşımıza çıkmaktadır. İslâm'ın onurlu/mükerrem insan odaklı yaklaşımı, İslâm hukukunun toplumsal sözleşme teorisine olan bakış açısı, bu teori ile olan uzlaşısı ve sonucunda ortaya çıkan yönetim anlayışı, nevi şahsına münhasır bir niteliktir. Öte yandan, İslâm'da bir devlet yönetim modeli olup olmadığı tartışmalarına rağmen süreç içerisinde çeşitli şekillerde ve farklı zamanlarda İslâm perspektifli yönetim anlayışını benimseyen devletler de kurulmuştur. Buna mukabil“Toplumsal Sözleşme Teorisi”İslâm Devlet Yönetimi içerisinde adlandırılmamıştır. Bu teori 17 ve 18. yüzyıllarda, ünlü filozoflar Thomas Hobbes, Jean-Jacques Rousseau ve John Lock tarafından anayasal monarşi, liberal demokrasi ve cumhuriyetçiliğin temeli esas alınarak geliştirilmiştir. Nitekim, İslâm Hukuk literatürü içerisinde yer almayan Toplumsal Sözleşme Teorisi İslâm Devlet Yönetimi'nin küresel konjonktürünü olumsuz yönde etkilemiştir. İslâm hukukunun kendine özgü epistemolojisi ve çok boyutlu bakış açısı, hukuk felsefesinin özünde yer alan adâlet ve eşitlik ilkesinin temel dayanağıdır. Dolayısıyla, İslam ancak kendine özgü çağdaş bir modern anlayış ile kendini ifade edebilecektir. Çalışmamızın mihenk noktası, İslâm hukukunun kamu hukuku alt başlığı altında incelenebilecek olan“insan-insan”ve“insan-otorite ilişkisi”bağlamındaki İslâm'ın temel insan hak ve özgürlüklerine uygun olarak günümüze kadar taşıdığı kavramları evrensel kabul edilen değerler ile buluşturarak, İslâm toplumsal sözleşmesini temellendirmek üzerine kurulu olacaktır. Böylece, İslâm'ın toplumsal sözleşme üzerindeki etkisi, İslâm hukukunun yönetim anlayışını çerçevelendirmesi ve batı medeniyetinin, İslâm medeniyeti ile kucaklaşmasının aslında hiç de zor olmadığı hususu ifadelendirilebilecektir."
