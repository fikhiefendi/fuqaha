abstract: "Çalışma, Otomatik Katılım Sistemi (OKS)'ne dahil olan şirketlerin fon seçimlerini belirleyen etkenler üzerine odaklanmaktadır. Derinlemesine mülakat tekniği ile toplanan nitel veriler yoluyla faiz hassasiyetinin kurumsal karar alma süreçlerine ne şekilde yansıdığı analiz edilmektedir. Farklı sektör ve büyüklükteki şirket temsilcileri ile gerçekleştirilmiş olan mülakatlar, mevcut yasal düzenlemelerin bu hassasiyetler üzerindeki etkisini araştırmayı hedeflemektedir. Araştırma bulguları doğrultusunda Bireysel Emeklilik Sistemi (BES)'nin ve OKS'nin İslami Finans ilkesine uygun şekilde geliştirilmesine yönelik politika önerileri sunmak araştırmanın temelini oluşturmaktadır. Çalışmanın hem akademik literatüre katkı sağlaması hem de uygulayıcılara rehberlik etmesi amaçlanmaktadır."
