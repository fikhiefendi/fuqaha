abstract: "Bu çalışma iktisat literatüründe inceleme konusu yapılan“İktisadi Kalkınma”meselesini dini-sosyolojik perspektiften ele almaktadır. Sosyoloji, esasında, din ve iktisat olgularının kesiştiği ortak noktadır. Bu nedenle öncelikli olarak ekonomik bir mesele olarak iktisadi kalkınma hadisesinin sosyolojik açıdan değerlendirilmesi elzemdir. Araştırmanın birinci bölümünde sosyolojik açıdan ekonomik kalkınmadan ne anlaşıldığı üzerine durulmuştur. İktisadi kalkınmanın sosyo-kültürel dinamikleri, küresel bir problem olarak azgelişmişlik meselesi ve iktisadi kalkınma teorileri ise odaklanılan diğer konular arasındadır. İkinci bölümde ise din ve iktisat arasındaki karşılıklı ilişki derinlemesine incelenmeye çalışılmıştır. Toplumsal kurumlar olarak din, iktisat ve ahlakın birbirleriyle olan ilişkilerinden hareketle Musevi ve Hıristiyan toplumlarının dini-iktisadi tecrübeleri özetlenmeye gayret edilmiştir. Araştırmanın üçüncü bölümünde ise İslam toplumlarının sosyo-ekonomik hayatı ele alınmıştır. Erken dönemlerden itibaren İslamiyet ile iktisadi davranış arasındaki karşılıklı ilişkiye değinilmiştir. İslam toplumlarının tarihi, sosyolojik ve kurumsal tecrübeleri ışığında İslam ekonomisinin sosyolojik imkânı kritize edilmiş; teorik ve metodolojik argümanlar sunulmuştur. Son bölümde ise Türk toplumun seküler kalkınma modeli mercek altına alınmıştır. Bilhassa Osmanlı devletinin son dönemlerinden itibaren tarım, ticaret ve finans kaynaklarının toplumsal kalkınma üzerindeki etkisi üzerine odaklanılmıştır. Neticede ise Türk toplumunun cumhuriyet tecrübesinin seküler bir kalkınma modeli olduğu ortaya koyulmuştur. Ancak bu kalkınma modeli her kronolojik dönemde farklı kimlikleri ortaya çıkarmış; Türk toplumu bilhassa 1980'lerden itibaren heterojen bir toplum olmaya başlamıştır."
