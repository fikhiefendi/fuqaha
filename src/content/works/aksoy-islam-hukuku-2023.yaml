abstract: "İçtihat meselesi İslâm dininde önemli bir konuma sahiptir. Çünkü dinin hükümlerinin kıyamete kadar ilahi iradeye uygun olarak hayata aksettirilmesi içtihat ile mümkün olur. Hükümlerin delilleri, şeriatın makâsıdı ve esrarı ancak içtihat ile bilinir. Yine hakkında nass olmayan konularda içtihat sayesinde hükme ulaşılır. Bu sebeple tarihten bugüne içtihat sahası birçok usûlcü tarafından ele alınmış, mahiyeti ve şartları itibariyle tartışılmıştır. İslâm hukuku İçtihat metodolojisinde aslî kaynaklar Kitab/Kur'ân-ı Kerim ve Sünnettir. Daha sonra bu iki nassî delile nazaran tali derecede olan icmâ ve kıyas gelir. Bu dört delile asli deliller adı verilmektedir. İlk ikisi nakil temelli ikinci iki delil ise akıl temellidir. Dolayısı ile içtihat metodolojisi açısından nakil ve akıl birbirinin mütemmimi mesabesindedir. İçtihat aklî bir faaliyettir. Aklın en temel ilkelerinden biri de tutarlılık/çelişmezlik ilkesidir. Bu ilke içtihat metodolojisinin en temel gereksinimlerindendir. İslâm hukuku içtihat metodolojisinde farklı müçtehitler tarafından tutarlı bir şekilde ilkeleştirilen kurallar, zamanla ekolleşme/mezhepleşme ile sonuçlanmıştır. İlkelerini tutarlı bir şekilde furûʻa yansıtmayı başaran mezheplerin başında dört sünnî mezhep olarak ifade edilen Hanefî, Mâlikî, Şâfiî ve Hanbelî mezhepleri gelmektedir. Akla dayalı içtihat faaliyetinin semeresi olarak ortaya çıkan mezhepler büyük oranda tutarlı ve sistematik bir yapıya sahip olsa da netice itibariyle beşer ürünü olması hasebiyle tutarlılık ilkesi bağlamında kusursuz değildir. Bu sebeple bazen benimsenen ilkelerin aksiyle amel edilebilmiştir. Bu durum muhalif mezhepler tarafından zaman zaman tutarsızlıkla itham edilmelerine sebep olmuştur. Bu ithamlar karşısında kendilerini sitemli bir şekilde savunma yoluna giden müçtehitler hilaf ilmini geliştirmişlerdir. Ortaya çıkan ihtilaf ve karşılıklı ithamların birçoğunun temelinde müçtehitlerin meseleleri mensup oldukları mezhebin ilkeleriyle değerlendirmeleri yatmaktadır. Bu sebeple hilaf ilminin yöntemleri kullanılarak meseleler tahlil edildiğinde tutarsızlık ithamına maruz kalan müçtehit ve ilkesinin aslında tutarlı olduğu anlaşılmaktadır. Bu sebeple sünnî mezheplere tutarlılık bağlamında yapılan ithamlar bu zaviyeden değerlendirilmelidir."
