abstract: "Şer'iyye sicili, Osmanlı Devleti'nin askeri, hukuki, iktisadi, dini ve idari müesseseleri gibi birçok alanı hakkında önemli bilgiler içermektedir. Şehir tarihleri ile ilgilenen araştırmacılar için bulunmaz bir hazine olan şer'iyye sicillerinde kaza, köy ve mahalle isimleri; ticarî, cezaî ve her türlü hukukî kararlar; halkın geçim tarzı, ekonomik ve sosyal yaşamı ile ilgili bütün ayrıntılar bu defterlerde yer almaktadır. Bu nedenle Osmanlı tarihi araştırmaları için bu belgelerin günümüz Türkçesine çevrilmesi ve incelenmesi gerekmektedir. Tezimiz 61 Numaralı Gaziantep şer'iyye sicilinin 101 ile 200 sayfaları arasını kapsamaktadır. Sicil Hicri 1124-1125/ Miladi 1712-1713 yıllarını kapsamaktadır. Söz konusu sicil defterinin çevirisi sayesinde Gaziantep'in Hicri 1124-1125/Miladi 1712-1713 yılları arasındaki siyasi, sosyal, ekonomik, idari, mali, hukuki durumuna ilişkin somut bilgilere ulaşılmıştır. Aynı zamanda Osmanlı Devleti'nin de idari yapısı hakkında fikir sahibi olabilmekteyiz."
