abstract: "Fıkıh mezheplerinin hadisleri kabul etmesi veya reddetmesi büyük çoğunlukla hadisin amel edilebilir olup olmamasıyla alakalı iken, muhaddislerin hadisleri kabul ve reddi sadece hadisin sübut yönü ve tarihi bilgi değeri ile ilgilidir. Fakihler muhaddislerin zayıf bulduğu bazı rivayetlerle başka asıllarla takviye edilmeleri sebebiyle amel etmekteyken, muhaddislere göre sahih olan bir takım rivayetlerle de bazı sebeplere dayanarak amel etmemişlerdir. Bu durumda muhaddislerin sistematiği üzerinden fıkıh mezheplerinin delillerinin değerlendirilmesi, fakihlerin metodunun anlaşılmasını sağlamadığı gibi çoğu zaman yanlış sonuçlara götürmektedir. Fakihlerin muhaddislerin aksine bütüncül bir bilgi teorisi ve deliller hiyerarşisi olduğundan onların bazı rivayetlerle amel edip etmemeleri konusu da kendi sistemleri içerisinde değerlendirilince doğru anlaşılabilir. Çalışmamızda İmam Ebu Yusuf'un Kitabu'l-asar'ının“İftitahu's-salat”ve“Sehiv”baplarındaki merfu ve muttasıl rivayetler incelenmiş, bunlar arasından ilk dönem muhaddislerinin illet sebebiyle zayıf buldukları dört hadisin senet açısından detaylı tahlilleri yapılmış, bu hadislerin içerdikleri konuyla ilgili muhaddisler ile Hanefi, Maliki ve Şafii mezheplerinin yaklaşımları kısaca işlenmiş, daha sonra ise Hanefiler'in bu hadislerle hangi kaidelere dayanarak amel ettikleri ve bu baptaki bazı sahih hadislerle hangi sebeplerle amel etmedikleri konuları Hanefi imamlardan yapılan nakillerle veya İlk dönem Hanefi usulcülerin değerlendirmeleri ışığında açıklığa kavuşturulmaya çalışılmıştır. Hanefilerin muhaddislere göre zayıf sayılan bazı hadislerle amel etme ve sahih sayılan bazı hadislerle amel etmemesinin incelediğimiz örnekler çerçevesinde kendi usulleriyle uyumlu olduğu görülmüştür. Hanefi mezhebinin hadislerin kabulü konusundaki usulünün yöntem ve amaç açısından muhaddislerden farklı olduğu görülmüş, Hanefilerin amel ettikleri veya amel etmeyi uygun bulmadıkları hadislerin muhaddislerin usulüne göre değerlendirilmesinin gerçekçi olmadığı ve mezhebin hadis anlayışının doğru anlaşılmasına hizmet etmediği görülmüştür. Özelde Hanefilerin genelde ise bütün fukahanın hadisleri kabul konusundaki yaklaşımları kendi usulleri ve bilgi teorileri çerçevesinde değerlendirilmelidir."
