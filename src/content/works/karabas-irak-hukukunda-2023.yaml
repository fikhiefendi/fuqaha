abstract: "Irak hukukunda ticari isimlerin korunması konusu ele alınırken öncelikle ticari isimlerin kapsamının ne olduğu, hangi alanlarda kullanıldığı ve bunların tacirin ne işine yaradığına değinilmelidir. Ticari isim kullanan tacirlerin sahip hakların ne olduğu, bu hakları nasıl kullanabileceği, tescile bağlı olarak ticari isme yönelik ihlallerin nasıl önlenip zararın ne şekilde karşı taraftan talep edilebileceği hususları; Irak hukukunda yer alan düzenlemeler çerçevesinde çalışmada anlatılacaktır. Hukuki ve cezai koruma yollarının hem ulusal hem de uluslararası boyutu irdelenerek korumanın hangi şekilde yapılacağı, nasıl ve ne kadar etkili olabileceği tartışıldıktan sonra ticari isimlerin korunmaya çalışılmasında esas alınacak unsurlar ve eleştiriler çalışmada yer alacaktır. Bu suretle mevcut ihlallerin karşılık bulduğu koruma yanında cezai işlemlerle birlikte bu ihlallere sebep olan kişi ve durumların ileride yaşanacak daha büyük sorunlara sebep vermeden önüne geçmek adına korumaya ilişkin yasal düzenlemelerin kuvvetlendirilmesi için önerilerde bulunulacaktır. Günümüzde ticari isimler, ticaret hayatında tacirler tarafından fark edilmek için kullanılan işaretler arasında yer almaktadır. Bu ayırt edici işaretler arasındaki ilişki; kanunlarımızda açıkça düzenlenmemiş, bilimsel çalışmalarda ve yargı kararlarında da yeterince irdelenmemiştir. Örneğin, ticari isim olarak tescil edilen bir ifadenin aynı zamanda ticaret unvanı olarak da kullanılıp kullanılamayacağı, ticari isim sahibi olan bir tacirin bu ismini marka olarak başkası tarafından tescil edildiğinde tescil işlemine itiraz etme hakkı olup olmadığı, bir ifadenin bir tacir tarafından ticari isim olarak kullanılırken başkası tarafından ticaret unvanı veya marka olarak kullanıp kullanamayacağı gibi hususların mevzuat veya öğretide açıklığa kavuşturulması gerekmektedir. Markanın ayırt edici özellikleri, objektif koşulları ve öneminden bahsedilmesi esastır ve markanın tescilinin yöntemlerinin, tescilin iptal edilme ve yenilenme koşullarının nasıl karşılanacağının bilinmesi önemlidir. Ek olarak tanınmış markanın hukuki ve cezai olarak korunması ve uluslararası arenada markanın korunma koşulları tekrar incelenmesi gereken konulardır."
