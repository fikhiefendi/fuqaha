abstract: "İnsanlık tarihi boyunca bireylerin ve toplumların temel ihtiyaçları olan yeme, içme ve barınma gibi zorunlulukları karşılamaya yönelik çabaları, nüfusun artması ve zamanla daha karmaşık ihtiyaçların doğması nedeniyle bu süreç, ekonomik düşüncenin sistematik bir disiplin olarak ortaya çıkmasına neden olmuştur. Bu tez çalışması, dünya tarihine yön vermiş üç temel ekonomik paradigma olan kapitalizm, sosyalizm ve İslam ekonomisini, her birinin dayandığı temel aksiyomlar, metodolojik yaklaşımlar, kendilerine özgü amaçlar, değişmeyen sabit ilkeler ve zaman içerisinde karşı karşıya kaldıkları ekonomik değişkenler bağlamında ayrıntılı biçimde incelemektedir. Söz konusu sistemler ayrı ayrı olarak analiz edildikten sonra, karşılaştırmalı bir yaklaşımla benzerlikleri ve farklılıkları değerlendirilmiş; böylece ekonomik yapıların bireysel yaşam, toplumsal düzen, adalet ve eşitlik anlayışı, üretim-tüketim dengesi, emek ve sermaye yapısı ve gelir dağılımı üzerindeki etkileri ortaya konulmuştur. Elde edilen bulgular doğrultusunda sonuç bölümünde değerlendirmelere yer verilmiş ve ilgili paradigmaların çağdaş ekonomi üzerindeki yansımalarına dair bazı çıkarımlarda ve önerilerde bulunulmuştur."
