abstract: "Endüstrileşme ve ticaretin önemli bir manivelası olan bankacılık sektörünün bu fonksiyonunu yerine getirebilmesi için kendi kârlılığındaki sürdürülebilirlik son derece önemlidir. Bu çalışmada konvansiyonel bankacılık ve katılım bankacılık kârlılığını belirleyen faktörlerin kıyaslaması panel veri yöntemi [Genişletilmiş Ortalama Grup Tahmincisi (AMG) ve Genelleştirilmiş Momentler Metodu (GMM Sabit Etki)] tahminleme tekniklerinden faydalanılarak 2013 4Ç – 2019 4Ç dönemleri arasındaki üçer aylık verilerle yapılmıştır. Kârlılık bağımlı değişkenlerinin literatüre uygun olarak ROA (Aktif kârlılığı), ROE (Öz kaynak kârlılığı) ve NIM (Net faiz / kâr marjı) olarak ele alındığı çalışmanın bağımsız değişkenleri ise makroekonomik ve bankaya özgü olarak iki başlık altında incelenmiştir. Çalışma sonucunda elde edilen bulgulara göre; GSYH, imalat sanayi üretim endeksi ve imalat sanayi kapasite kullanım oranı endeksi gibi reel çıktı göstergeleri katılım bankalarının kârlılığını konvansiyonel bankalara göre çok daha güçlü bir şekilde desteklemektedir. Hatta incelenen dönem içinde imalat sanayi kapasite kullanım oranı endeksi artışlarında katılım bankacılığı sektöründe kârlılık artarken konvansiyonel bankacılık sektöründe kârlılığın azaldığı görülmüştür. Katılım bankalarının konvansiyonel bankalara göre iyi yönettiği diğer kalemler NPL rasyosu ve maliyet rasyosu kalemleri, konvansiyonel bankaların iyi yönettiği kalemler ise toplam özkaynaklar ve komisyon rasyosu kalemleri olmuştur."
