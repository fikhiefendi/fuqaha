abstract: "İşletmelerin faaliyetlerini kurumsal sosyal sorumluluk bilinci içerisinde yürütmesi işletmelerin farklılaşmaları için önemli bir ölçüt haline gelmiştir. Bu çalışmada, kurumsal sosyal sorumluluk kavramının Türkiye'deki mevcut durumu ve bankaların yapmış oldukları çalışmalar incelenerek elde edilen veriler ışığında karşılaştırma yapılması ve kurumsal sosyal sorumluluk düzeylerinin bankacılık performansı üzerindeki etkisinin incelenmesi amaçlanmaktadır. Çalışmada konvansiyonel bankalar ve katılım bankaları ele alınmıştır. Seçilen bankaların bağımlı ve bağımsız değişkenlerindeki değerler faaliyet raporlarından ve Türkiye Bankalar Birliğinden elde edilerek Panel veri analizi yardımıyla sonuçlandırılmaya çalışılmıştır. Bankacılık sektöründe sosyal sorumluluk göstergeleri ile performans göstergeleri arasındaki ilişkiyi istatistiksel olarak açıklayabilmek için üç model oluşturulmuştur. Bankacılık performansı ile sosyal sorumluluk göstergelerine ilişkin değişkenlerin logaritması alınarak analizlere dahil edilmiştir. Bankacılık sektöründe sosyal sorumluluk göstergeleri ile bankaların performans göstergeleri arasındaki ilişkinin pozitif olduğu görülmüştür. Konvansiyonel bankalar ve katılım bankaları için sosyal sorumluluk göstergeleri bakımından bankalar içi kırılganlığın bankalar arasındaki kırılganlıktan daha yüksek olduğu görülmüştür. Konvansiyonel ve katılım bankalarının sosyal sorumluluk uygulamalarının performansları üzerindeki etkilerini göstermek için oluşturulan Model 1, Model 2 ve Model 3 için Delta homojenlik testi uygulanmıştır. Testte sıfır hipotezi, eğim katsayılarının tümünün yatay kesit birimler karşısında aynı olduklarını, alternatif hipotezin ise eğim katsayılarının yatay kesit birimlere göre farklılaştıklarını varsaymıştır. Homojenlik test sonuçlarına göre, sosyal sorumluluk uygulamalarının konvansiyonel ve katılım bankalarının performansını gösterebilmek için oluşturulan modellerin %5 önem düzeyinde eğim katsayılarının tümünün yatay kesit birimler karşısında aynı olduklarını ifade eden sıfır hipotezinin reddedilemediği görülmektedir. Bu bulgu, tüm modellerde eğim katsayılarının homojen olduklarını söylemektedir."
