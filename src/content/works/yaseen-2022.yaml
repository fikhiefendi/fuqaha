abstract: "Fıkıh usûlü özelde fıkıh genelde de şeriat ilimlerinin esas aldığı temel ilimlerden biridir. Fıkıh usûlünün en önemli konularından biri de teşri`in kaynağı olan nassın, yani kitap ve sünnetin lafızlarının delaleti konusudur. Araştırma İbn Hacer'in Bulûgu'l-merâm min edilleti'l-ahkâm adlı kitabının ibadetler kısmında yer alan, usûlcülerde işaret ve îmâ'nın delil sayılması ve bunların fıkhî uygulamaları konusundaki amaçlarını açıklamayı hedeflemektedir. Araştırma birkaç önemli neticeye varmıştır. Bunlardan birine göre usûlcüler işaret ve îmâ'nın delil sayılması konusunda iki görüşe ayrılmıştır: 1. Mütekellimûn: Gayri sarih mantukun delaletinin içeriğinde bunu müstakil delalet sayarlar. 2. Hanefiler: Nassın ibaresi içeriğinde sayarlar. Hanefiler işaretin tarifi konusunda mütekellimden farklı düşünmezler. Nassın işareti mana üzerindeki nassın delaletidir ki asli veya tebeî olarak kastedilmez. Ancak sözün doğruluğu ve şer'î yönden sağlıklı anlaşılması kendisine bağlı olmayan hükme delaletidir. Îmâ'nın delaleti şudur: Hükmün iktiranıdır, hükme o illet olmasaydı o hüküm şari'den uzak olurdu. Îmâ'nın delaleti iltizamın delaletlerinden biri kabul edilir ki bu iltizam delalet yoluyla illiyete delalet eder. Çünkü illiyet lafız yoluyla değil mana yoluyla anlaşılır. Îmâ'nın delaleti ise işaretin delaletini tercih eder. Yine çeşitlerini mefhuma tercih eder. Çünkü amaçlanan nassın siyakıdır. Ancak nas bunu iktizanın delaletinin hilafında kabul etmez. İşaretin delaleti cümlede hüccettir. Bu konu alimler arasında bir ittifak noktasıdır. Ancak bu hüccet işaretin açıklığı ve zıddının bulunmamasına bağlıdır. Bulûgu'l-merâm min edilleti'l-ahkâm kitabında işaret ve îmâ'nın delaleti konusundan çokça bahsedilmektedir. Alimler işaret ve îmâ yoluyla insanlara birtakım hükümleri vacip kıldılar. Fıkıh usûlü ilmî ve şer'î hükümlere ulaştıran en önemli yollardan biridir."
