abstract: "Osmanlı Devleti ile ilgili araştırmalarda ve yerel tarih araştırmalarında şer'iyye sicillerinin önemi son derecede büyüktür. Kadılar, merkezi devlet yönetimi ile olan yazışmaları ile birlikte halkın şikâyetlerini ve isteklerini, mahallî idarelere ait hukuki düzenlemeler olarak kabul edilen ferman ve hükümleri, en önemlisi de ait olduğu bölgenin sosyal ve iktisadî hayatını yansıtan mahkeme kararlarını kayıt altına almışlardır. İşte şer'iyye sicilleri adıyla bilinen bu defterler incelenmeden Osmanlı Devleti'nin siyasî, idarî ve sosyal ve ekonomik tarihin tam olarak bilinmesi mümkün değildir. Yine kentlerin yerel tarih araştırmaları ve çeşitli bölgelerde yapılacak mahallî hayata ait araştırmaların en önemli kaynağı da şer'iyye sicilleridir. İncelenen 66 Numaralı Kastamonu Şer'iyye Sicili(H.1203-1204/M.1788-1789) defterinde bir çok kayıt bulunmaktadır. Bunların önemli bir kısmını hüccet ve tereke belgeleri ile birlikte ferman, berat, buyruldu, mektup, temessük, mürasele ve vakfiye kayıtları da defterde bolca mevcuttur. Bu belgelerden yola çıkarak bu dönemde Kastamonu'nun sosyo-ekonomik, kültürel, hukuki ve idari manada nasıl bir durum arz ettiği tespit edilmeye çalışılmıştır. Tezin transkripsiyon kısmında her varak'a ve varaktaki belgelere birer hüküm numarası verilmiş olup aynı yöntem araştırmanın daha pratik bir şekilde yapılması için belge özetleri bölümünde de uygulanmıştır. Çalışmamızın ana kaynağını oluşturan 66 Numaralı Kastamonu Şer'iyye Sicili Kastamonu'ya ait olan H.1203-1204/M.1789-1790 tarihli Şer'iyye sicil defterlerinden oluşmaktadır."
