abstract: "Bu asırda dünyanın küreselleşmesine bağlı birçok evlilik ve nişanlılık türü ortaya çıkmış ve yaygınlaşmıştır. Yazılmış olan tez günümüz aile hukuku problemlerinden nişanlılık ve evlilik ile ilgili olan mevzuları incelemektedir. Bu amaçla yaptığımız çalışma bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde aile hukuku üzerinde durulmuş, aile hukukun önemi ve amacına yer verilmiştir. Birinci bölüm nişanlılık kavramından bahsedilmiş ve sonra nişanlılık akdi esnasında çıkan çağdaş problemler üzerinde durulmuştur. İkinci bölüm evlilik kavramından bahsedilmiş ve sonra evlilik akdi esnasında çıkan çağdaş problemler üzerinde durulmuştur. Bu araştırma neticesinde şeri hükmü ortaya koymak suretiyle, uygun çözüm yolları bulmak daha kolay olacaktır. Yer aldığı ''Sonuç'' bölümü ile çalışma sona ermiştir."
