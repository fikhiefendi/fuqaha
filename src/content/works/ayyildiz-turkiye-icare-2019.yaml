abstract: "Katılım bankaları, İslami finansman faaliyetlerine aracılık eden finansal kurumlardır. Bu anlamda faiz hassasiyeti olan bireyler, bankacılık işlemlerinde özellikle katılım bankacılığı ürünlerini tercih etmektedirler. Katılım bankacılığı ürünlerinden biri olan icâre yöntemi, geleneksel bankacılıkta kullanılan leasing yöntemine alternatif bir finansal araç olarak ortaya çıkarılmıştır. İşletmelerin genel mali durumlarından dolayı bir sabit varlığı tamamen satın almak yerine kiralamayı tercih etmeleri, leasing sektörünün ortaya çıkmasına neden olmuştur. Fakat leasing sektörü faizli finansal ürünlere karşı hassasiyeti olan banka müşterileri tarafından tercih edilmediği için katılım bankaları, geleneksel bankalara karşı alternatif ürünlerine bir yenisini daha ekleyerek, bu kesimin ihtiyacını karşılamak üzere icâre yöntemini geliştirmiştir. Bireylerin ticari finansman ihtiyaçları doğrultusunda hem leasing hem de icâre yöntemleri, geçmişten günümüze önemli ilerlemeler kaydetmesine rağmen, ekonomik ve finansal dalgalanmaların arttığı dönemlerde, ciddi duraksamalar bazen de gerilemeler yaşadığı gözlemlenmiştir. Günümüzde leasing ve icâre sektörlerindeki gelişimleri etkileyen birçok değişken bulunmaktadır. Bu faktörlerin başında ülkedeki ekonomik/finansal dalgalanmalar ve buna bağlı enflasyon oranı ile kredi faiz oranlarındaki büyük ölçekli değişimler gelmektedir. Bunun dışında ülkemizde leasing ve icâre sektörlerini en çok etkileyen ekonomik politikalar ve maliye politikaları çerçevesinde KDV oranlarındaki değişim yer almaktadır. Bu çalışmada, leasing ve icâre yöntemlerinin yıllar itibariyle finansal gelişimini incelemek ve bu sürece etki eden makroekonomik değişkenlerin, ne ölçüde etkili olduğunu tespit etmek amacıyla, leasing ve icâre yöntemlerinin verileri üzerinde; Eş Bütünleşme, Granger Nedensellik ve VAR yöntemi gibi testler uygulanmıştır. Bu uygulama sonucunda, piyasa faiz oranları yükseldiği ölçüde icâre yönteminin daha çok tercih edildiği, dolayısıyla aralarında anlamlı (doğru orantılı) bir ilişkinin varlığı tespit edilmiştir. Analiz dönemi olarak seçilen ve katılım bankalarının finansal verilerinin yer aldığı 2013-2017 yılları arasında piyasa faiz oranlarının yükseldiği süreçlerde, icâre yönteminin kullanımı da artmış, öte yandan piyasa faiz oranları azaldıkça, leasing yönteminin kullanımı da artmıştır. Bunun yanında, GSYH düzeyinin yükseldiği dönemlerde, leasing ve icâre yöntemlerinin kullanımının da arttığı gözlemlenmiştir. İki uygulama birbiri ile karşılaştırıldığında, her ne kadar birbirinin alternatifi olarak görülseler de, iki uygulamayı da etkileyen benzer makroekonomik değişkenler bulunmaktadır. Netice itibariyle, leasing ve icâre yöntemleri 2013-2017 yılları arasında sürekli bir büyüme eğilimi göstermiş ve çeşitli makroekonomik göstergelerdeki değişimlerden doğrudan etkilenmişlerdir."
