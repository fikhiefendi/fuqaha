abstract: "?Mütûn-i Erbaa'da İmam Muhammed'e Nispet Edilen Görüşlerin Tahkiki (İbâdât Bölümü)? adlı bu çalışma; Hanefi mezhebinin muteber kitapları arasında olan mütûn-i erbaa'nın ibadetler bölümünde İmam Muhammed'e atfedilen görüşler özelinde, Hanefi mezhebindeki ilmi birikimin tevarüsünün sıhhatini tespite yönelik bir çabanın ürünüdür.Çalışma, bir giriş ve üç bölümden oluşmaktadır: Giriş bölümünde çalışmanın amacını ve sıhhat tespiti için takip ettiğimiz yöntemi anlattık.Birinci bölümde, görüşlerinin doğru aktarılıp aktarılmadığını tespit etmeyi amaçladığımız İmam Muhammed'in (v. 189/805) hayatı, ilmi kişiliği ve eserlerinden bahsettik.İkinci bölümde hemen hemen tüm İslami ilimlerde örneklerine rastladığımız metin tarzı eserlerin Hanefi furû-i fıkıh alanındaki tarihi seyrini ve -tespit edebildiğimiz ölçüde- metinlerin temel özelliklerini anlattık. Ardından mütûn-i erbaa'yı oluşturan dört metin kitabı ile bu kitapların müellifleri hakkında bilgi verdik.Üçüncü bölümde ibadetler bölümü özelinde mütûn-i erbaa'da İmam Muhammed'e nispet edilen görüşleri ele aldık. Klasik kitaplarda ?kitâb? denilen başlıkların her birinin, bir ana başlığı oluşturduğu bu bölümde, ele alınan görüşleri ?nispeti isabetli olan görüşler?, ?nispeti hatalı olan görüşler? ve ?isabeti tespit edilemeyen görüşler? şeklinde üçlü bir taksime tabi tuttuk.Sonuç bölümünde ise çalışma neticesinde elde edilen istatistiksel bilgileri sunup, ele alınan çerçeve içerisinde Hanefi mezhebinin ilmi tevarüsünün sıhhati ile ilgili ulaştığımız sonuçları zikrettik."
