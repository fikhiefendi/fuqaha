abstract: "İbadet vakitleriyle ilgili klasik/güncel ihtilaflar fıkıh usulünü doğrudan ilgilendirmektedir. İbadet vakitleriyle ilgili ihtilafın sebebi, vakte delalet eden nassın yorumunda ihtilaf ve tahkiku'l-menât içtihadında ihtilaf şeklinde özetlenebilir. İbadet vakitlerinin şer'î alametlerini ve sınırlarını tespit etmek nas içtihadına, bu alametlerin dış dünyadaki varlığını tespit ederek takvime dönüştürmek ise tahkiku'l-menât içtihadına konu olmaktadır. Vakte delalet eden nasların yorumundaki farklılıkların yanı sıra bu konudaki yanılgılar ibadet vakitlerinin şer'î alametleri ve takvim boyutu konusunda çeşitli ihtilaf ve yanılgılara yol açmaktadır. İbadetlerin vakit sınırları konusunda kitaba, sünnete, icmaya ve usul kurallarına aykırı olan görüşler ve bu tür görüşlerden hareketle tespit edilen vakitler geçersizdir. İbadet vakitleri için belirlenen takvimlerin bağlayıcı olması için, bu takvimlerdeki vakit sınırlarının şer'î vakit alametlerine uygun olması şarttır. Araştırmamızın tezi fıkıh usulünde ibadet vakitleriyle ilgili farklı yaklaşımları sistematik bir şekilde ortaya koymak, ibadet vakitleriyle ilgili güncel bazı ihtilafları bu çerçevede değerlendirerek bir sonuca ulaşmaktır. Fıkıh usulü açısından ibadetlerin vakit boyutunu incelemek üzere fıkıh usulü kaynaklarından, bu konudaki teorik bilgileri somutlaştırmak için füru fıkıh kaynaklarından, güncel vakit ihtilaflarını bu çerçevede değerlendirmek üzere çağdaş araştırmalardan istifade edilmiştir. Giriş kısmında araştırmanın konusu, problemi, yöntemi, ana hatlarıyla ibadetlerde vakit mefhumu, araştırmada kullanılacak hüküm kavramları ve vakitle ilişkisi ele alınmıştır. Birinci bölümde fıkıh usulü açısından mutlak ibadetlerde vakit kavramı incelenmiş, ikinci bölümde muvakkat ibadetlerde vakit kavramı ele alınmış, üçüncü bölümde ise ibadetlerin vakit sınırlarıyla ilgili bazı güncel tartışmalar değerlendirilmiştir."
