abstract: "Bu tezin amacı son dönemlerde dünyada ve Türkiye'de katılım bankacılığı, İslami Bankacılık ya da faizsiz bankacılık gibi isimlerle anılan bankacılık sisteminin geleneksel bankacılık sistemiyle risk yönetimi açısından karşılaştırılmasıdır. Karşılaştırma yapılırken özellikle bankaların herbirinin finansal şoklara duyarlılığı ekonometrik yöntemlerle incelenmiştir. Bu bağlamda son dönemlerde White vd.(2016) tarafından geliştirilen ve risk analizlerinde sıklıkla kullanılan kantil VAR yöntemi kullanılmıştır. Çalışmada ilk olarak BIST100 de kote olan geleneksel bankalardan Akbank, Garanti Bankası, İşbankası, Yapı ve Kredi Bankası, ve katılım bankası olan Albaraka Türk'ün yerel ve küresel piyaslarla ortak kuyruk bağımlılığı (tail codependence) test edilmiştir. Daha sonra bu bankalar için günlük dinamik riske maruz değer tahmin edilmiştir. Son olarak ta ulusal ve uluslararası piyasalar ile islami piyasalarda da bir şok meydana geldiğinde bankaların uzun dönem risklerinin bu şoklara tepkisi ve dirençliliği kantil VAR tekniğinden elde edilen etki tepki fonksiyonlarıyla analiz edilmiştir. Bu çalışmada ulusal piyasalar BIST100 endeksiyle ve uluslararası piyasalar S&P500 endeksleriyle, İslami piyasalar ise DJ Islamic Financial endeksiyle temsil edilmiştir. Çalışma sonuçları finansal krizlerden katılım bankalarının geleneksel bankalara göre daha az etkilendiğini ortaya koymaktadır"
