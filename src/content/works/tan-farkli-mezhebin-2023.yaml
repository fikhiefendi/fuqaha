abstract: "İslam hukukunda mukallid-müctehid ilişkisi hicrî ilk üç asırda her bir meselede farklı müctehidin görüşüyle amel etmek anlamındaki taklîd-i mutlak iken mezheplerin teşekkülünün tamamlanıp sistematik bir kisveye bürünmesi ile bir mezhebe bağlanma anlamına gelen taklîd-i şahsî halini almıştır. Günümüzde ise kısmî de olsa taklid-i mutlaka rucû edilerek mukallidin mezhebine muhalefetinin yaygın hale geldiği görülmektedir. Mukallidin gerek bilinçli gerekse bilinçsizce mezhebine muhalefet etmesi kendisine birçok kolaylık sağlasa da bu durum mezhebiyle olan ilişkilerinde birtakım çıkmazlara yol açmış ve fakihler arasında görüş farklılıklarına neden olmuştur. Tezimiz, farklı mezhebin kavliyle amel edilebilir mi sorusundan yola çıkarak birbirleriyle karıştırılan kavramları, intikale olumlu veya olumsuz cevaz veren âlimlerin görüşlerini, intikalin ortaya çıkardığı problemleri ve Abdülazîz el-Buhârî'nin meseleye yaklaşımını ele almaktadır."
