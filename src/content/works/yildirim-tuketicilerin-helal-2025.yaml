abstract: "Tüketicilerin satın alma niyetlerini şekillendiren birçok unsur bulunmaktadır. Bu unsurlar arasında kültürel değerler, ekonomik koşullar ve sosyal etkenlerin yanı sıra dini inanç ve değerler de önemli bir rol oynamaktadır. Helal kavramı, Müslüman tüketiciler açısından yalnızca gıda ürünlerinde değil, kozmetik, tekstil, temizlik, lojistik, finans, turizm, ilaç ve sağlık ürünleri alanları gibi birçok alanda belirleyici bir faktör haline gelmiştir. Bu çalışmanın amacı, tüketicilerin helal ilaç satın alma niyetlerini etkileyen faktörleri belirlemek ve bu kapsamda dindarlık, sağlık bilinci, helal ilaç bilgisi ile helal ilaç anlayışının satın alma niyeti üzerindeki etkilerini incelemektir. Araştırmada nicel yöntem kullanılmış, veriler Türkiye genelinde farklı demografik özelliklere sahip 251 katılımcıya uygulanan anket aracılığıyla toplanmıştır. Anket formunda beşli Likert tipi ölçekler kullanılmış, elde edilen veriler SPSS programı ile analiz edilmiştir. Analizler sonucunda,dindarlık, helal ilaç bilgisi ve helal ilaç anlayışı değişkenlerinin helal ilaç satın alma niyeti üzerinde anlamlı ve pozitif etkiler yarattığı tespit edilmiştir. Buna karşın, sağlık bilinci anlayışının satın alma niyeti üzerinde doğrudan anlamlı bir etkisinin bulunmadığı belirlenmiştir. Ayrıca, katılımcıların yaş, cinsiyet, eğitim ve gelir gibi demografik özelliklerinin satın alma niyetinde istatistiksel olarak anlamlı bir farklılık oluşturmadığı sonucuna ulaşılmıştır. Bulgular, ilaç sektöründe pazarlama ve bilinçlendirme stratejilerinin oluşturulmasında dini hassasiyetlerin, sağlık bilincinin ve bilgi düzeyinin dikkate alınması gerektiğini ortaya koymaktadır."
