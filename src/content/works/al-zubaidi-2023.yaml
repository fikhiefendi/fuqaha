abstract: "Bu tez, Allâme Hatibzâde'nin,“Hâşiyetün Ala Şerhi'l-Vikâye Li Sadri'ş-Şeria”adlı eserinin tahkik ve incelemesini ele almaktadır. Çalışma, Kitabu't-Tahara'dan, Kitabu Nevâkidi'l-Vudû' arası konular ile sınırlanacaktır. Bu çalışmanın önemi müellifin bu ilimdeki yerinden kaynaklanmaktadır. Kendisi Hicri 9, Asrın önde gelen âlimlerinden biridir. Yaşadığı dönemdeki kıraat, tefsir, fıkıh, dil ve akli ilimler gibi birçok ilimde söz sahibidir. Bu araştırmanın bir diğer önemi ise, Allâme el-Mahbûbî'nin Kitabu'l-Vikâye adlı eserindeki kapalı meselelerin bir şerhi olması ve taharete bağlı ibadetler babında incelenen konuları içermesinden kaynaklanmaktadır. Eserdeki konuların düzeni ve bölümlendirlmesi gayet güzeldir. Kitaptaki konulara ibâdetler ile başlanmış, sonra ameller ile devam edilmiştir. Müellif kitabı fıkhi kitap bölümlerine, ardından bablara ve furu'lara daha sonra faydalar ve uyarılar gibi kısımlara ayırmıştır. Hanefi imamlarının ve diğer mezhep sahiplerinin sözlerini de akıcı ve açık bir anlatımla sunmuştur. Bu çalışmada, eserin Türkiye'deki iki nüshasına itimat edilmiştir. Çalışmada, Hatibzâde'nin biyografisi, ilmi hayatı ve yaşadığı asır gibi konularda betimleyici-tarihsel yöntem izlenmiş, imla kur,allarına göre eserin istinsahı yapılmış ve sonra diğer nüshalarla karşılaştırılmıştır. İçindeki alıntı ve Hadislerin tahricinde ise tahkik ve yorumlama yöntemini kullanılmıştır. Bu çalışmanın en önemli bulgularından biri Müellifin, Hanefi ile Şafii ve bazen de Hanefi ile Maliki arasındaki görüş karşılaştırmasında çok ayrıntılara girmiş olmasının tespit edilmiş olmasıdır. Zira Müellif, Hanefilerin sözlerini takdim eder ve daha diğer mezheplerin imamlarının sözleriyle karşılaştırır. Karşılaştırma ve münakaşa esnasında çoğu zaman,“Şafi, Malik veya Ahmed'ten farkı olarak”gibi sözler kullanır. Hatibzâde, Hanefi mezhebi içindeki ihtilafı açıklamakla da ilgilenmiştir. İmam Ebu Hanife'nin görüşünden bahsetmekle yetinmemiş, aksine sık sık Ebu Yusuf ve Muhammed'in ve bazen de İmam Züfer ve el-Hassan'ın de görüşlerine yer vermiştir. Ayrıca bazen el-Kudûrî, el-Kerhî ve et-Tahavî'nin görüşülerine de atıfta bulunmaktadır."
