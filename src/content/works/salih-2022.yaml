abstract: "Müellifin özgeçmişi okunduğunda ve el yazmasında belirtilen görüş, yorum ve reddiyeler incelendiğinde okuyucu, Kâdî el-Beydâvî'nin ve onun üzerine haşiye yazan ashabının görüşlerini bir araya getirmedeki yöntemiyle, bu görüşleri tartışmasıyla ve onları sağlam bir şekilde tahliliyle müellifin yeteneğinin ne kadar geniş olduğunu idrak eder. Yorumlar nahiv, dil, usul ve fıkıh meselelerinde kapsamlı bir bilgiye sahip olduğuna delalet etmektedir. Zira dikkat ve olay örgüsü ile karakterize üslubuyla sağlam görüşe sahip olduğu, isabetli söz ve doğru manayı çıkarmak için illetli görüşü karmaşıklıktan uzak anlaşılır kolay lafızlarla düzelttiği ortaya çıkmaktadır. Müellif -Allah rahmet eylesin- Kur'an-ı Kerim'in birçok suresinde belirli yerlere yorumlar getirmiş surelerin tamamını ele almamıştır. Bu yorumlar, konuyu farklı bir şekilde açıklamakla birlikte bazen Beydâvî'nin -Allah rahmet etsin- sözlerini teyit ettiği bazen de muhalefet ettiği konuları da kapsamıştır. Bununla birlikte, çoğu zaman bu tefsirleri teyit etmiş ve Beydâvî'ye karşı çıkan pek çok âlim ve haşiye ashabının görüşüne yorum yaparak cevap vermiştir. Birtakım yöntemler kullanarak bu tefsirlerin doğruluğunu pek çok yönden göstermiştir. Ayrıca Zemahşerî'nin -Allah ona rahmet etsin- tefsirlerini getirerek görüşlerini ve tefsirinde Beydâvî'nin görüşlerine nelerin benzediğini, nelerin onlardan farklı olduğunu açıklığa kavuşturmuştur. Sonra bu sözler hakkında gerek kıyas yoluyla gerek lügat ile tefsir yoluyla ya da görüşleri bir araya getirerek ve en güçlü olanları alarak elindeki delillere göre bir hükme varmaktadır. Aynı şekilde haşiye ashabının sözlerinde de (Örnek olarak: Saadi Efendi ve Sinan Efendi) büyük ölçüde bu yöntemi uygulamış ve Beydâvî'nin tefsirleri hakkında reddiye sunmak için bu sözlere itimat etmiştir. Daha sonra her iki görüş hakkında da doğru olduğunu düşündüğü görüşünü açıklamıştır. Beydâvî tefsirinde ele almak istediği ayetleri yazar, sonra o ayetlere yaptığı yorumu açıklar, sonra da haşiye ashabının bu tefsirlerle ilgili görüşlerini açıklardı. Sonra bu sözlere cevap verir ve onları detaylandırırdı. Onların sağlam görüşünü açıklar, diğer sözlerin zayıf yönlerini ve aynı şekilde zayıflığının sebebini açıklardı. Yorumlarında, tefsir için İcma-i Ulema, kıyas, lügat, Kur'an belagati gibi birçok yöne itimat ederdi. Ayrıca belagat ve nahiv yönünü açıklamayı amaçlamasının yanında garîbi (anlaşılmayan kelimeleri) açıklamak için de bazı şiirsel dizeleri kullanmıştır."
