abstract: "Çocuk istismarı, çocuğun bakım, gözetim ve terbiyesinden sorumlu olan şahıslar ya da toplumun diğer birey ve kuruluşları tarafından çocuğun büyüme ve gelişmesini olumsuz yönde etkileyen her türlü tavır ve davranış olarak nitelendirilebilen bir olgudur. Çocuk istismarı tarih boyunca her toplum ve kültürde rastlandığı gibi, son bir asırdır dünya gündemini daha çok meşgul eden bir olgu haline gelmiştir.Biz bu çalışmamızda çocuk istismarını İslam aile hukuku açısında ele almaya çalıştık. Çalışmamız boyunca gerek Kur'an-ı Kerim ve Sünnet'teki ifadeler açısından gerekse İslam hukukunun çocuklarla ilgili genel hükümleri açısında olsun, çocuk istismar ve ihmaline karşı birçok önleyici tedbir getirdiğine şahit olduk.Özellikle de normal ana-babalı çocuklara göre daha zayıf ve istismar edilmeye daha çok elverişli pozisyonda olan, yetim ve terk edilmiş buluntu çocuklarla ilgili hükümlere bakıldığında, İslam hukuku bu çocukları her türlü tehlike ve istismara karşı daha çok koruma altına almış ve bunların korunup himaye edilmesi için daha fazla gayret sarf etmiştir."
