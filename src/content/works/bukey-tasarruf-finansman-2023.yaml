abstract: "Bu çalışmada, dünyada farklı isimler altında ve değişik biçimlerde uygulanan tasarruf finansman sistemleri tanıtılmıştır. Ülkemizde faizsiz bir şekilde işletilen tasarruf finansman sistemi tercihine etki eden faktörleri tespit etmek amacıyla katılımcıların demografik ve sosyo-ekonomik değişkenleri ile sistemi tercih etme nedenleri arasındaki ilişki araştırılmıştır. Hâlihazırda uygulanan modellere yapılan eleştiriler dikkate alınarak İslami finans ilkelerine uygun ve murabahaya dayalı yeni bir finansal araç önerilmiştir. Uygulama bölümünde, TRB1 Bölgesinde tasarruf finansman sistemini tercih eden 384 katılımcıya anket uygulanmış ve anketten toplanan veriler analiz edilmiştir. Analizlerden elde edilen bulgulara göre katılımcıların demografik ve sosyo-ekonomik özelliklerinin tasarruf finansman sistemi tercihlerinde etkili olduğu sonucuna varılmıştır. Yapılan DFA ile katılımcıların tasarruf finansman sistemi tercihlerinde tutum, dini hassasiyet, memnuniyet ve maliyet faktörlerinin belirleyici olduğu tespit edilmiştir. Önerilen finansal araç ile katılımcılara konut, taşıt ve çatılı işyerinin güncel fiyatı üzerinden finansman sağlanabilmektedir. Katılımcılar, diğer tasarruf finansman modellerine göre daha az maliyetle konut, taşıt ve çatılı işyeri sahibi olabilmektedir. Aynı zamanda tahsis sırası nedeniyle katılımcılar arasında yaşanan ve fiyat artışından kaynaklanan adaletsizlik, giderilebilmektedir."
