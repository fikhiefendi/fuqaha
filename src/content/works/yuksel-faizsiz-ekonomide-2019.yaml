abstract: "“Faizsiz Bir Ekonomide Finansal Sözleşmeler (Doğuşu Meşruiyeti ve Fonksiyonu)”adlı bu çalışmada, faizin yasak kabul edildiği iktisadi sistemde finans sağlayan sözleşmeler tespit edilip başta klasik kaynaklardan istifade etmek suretiyle doğuşu, meşruiyeti ve fonksiyonu bakımından incelenmeye çalışılmıştır. Bu bağlamda şu sözleşmeler tespit edilmiştir: selem, istisna', bey' bi'l-vefâ, bey' bi'l-istiğlal, îne satışı, murabaha, leasing, muzaraa, musakat, müşareke. Selem, satış bedelinin peşin, malın vadeli olmasıdır. İstisna, sanat erbabına bir eşya yaptırmaktır. Bey' bi'l-vefa, satıcı bedeli geri verince alıcının da satılan malı geri vermesi şartıyla yapılan satıştır. Be'y bi'l-istiğlal, bir malın gelirinden faydalanmak için onun bizzat satıcısına kiralanmasıdır. Îne satışı, bir malın vadeli olarak satılmasından sonra aynı malın, peşin parayla satıldığı fiyattan daha ucuza alınmasıdır. Murabaha, malın maliyetinin karşı tarafa bildirilerek üzerine kar ilavesiyle yapılan güvene dayalı satım şeklidir. Leasing, mülkiyetin temliki ile sona eren menfaatin temlikidir. Mudârabe, bir tarafın emeği bir tarafın sermayesi ile kurulan ortaklık türüdür. Muzaraa, mahsulü paylaşmak üzere arazi sahibiyle emek sahibi arasındaki ortaklıktır. Muşaraka, ticari ortaklıktır. Önceki fukaha, finansman ihtiyacı ile şer'î ilkeler arasında şartlara uygun meşru çözüm bulamadıklarında en azından haramların açıkça ihlalini önlemek adına yine hukukun içinde hile-i şer'iyyeden yararlanmıştır. Bu surette ilave bir getiri sağlayan kredi işlemlerine cevaz vermiştir. Bunların bir kısmı günümüzde de varlığını ve fonksiyonunu devam ettirmektedir. Günümüzde de çağdaş murabaha ve leasing gibi birtakım meşru finans temin yöntemleri geliştirilmektedir. Müslüman toplumların sahip olduğu aşkın değerlerle yaşadıkları hayat arasında meşruiyet sorununu aşması için meşru finansman bulma çabasının önceki zamanlara göre daha öncelikli hale geldiği söylenebilir."
