abstract: "Bu çalışmada h. VI. yüzyılda yaşayan, Hanefî mezhebine mensup şeyhülislâm unvanı taşıyan altı fakihten biri olan Ebü'l Hasan Ali b. Muhammed el-İsbîcâbî'nin hayatı ve fıkhî görüşleri ele alınmıştır. Bu çalışmanın amacı, Semerkand gibi önemli bir ilim merkezinde kadılık yapacak ve şeyhülislâm olarak anılacak kadar Hanefî ekolünde önemli bir yere sahip olan İsbîcâbî'nin ilmî hayatına, fıkıh anlayışına ve Hanefî fıkhına yaptığı katkıya ayna tutmaktır. Çalışma üç bölümden oluşmaktadır. Birinci bölümde İsbîcâbî'nin hayatı literatür araştırılması çerçevesinde incelenmiştir. İsbîcâbî'nin yetiştiği bölgede hüküm süren devletlerin siyasi hayatı, bu çerçevede meydana gelen gelişmeler ile bu devletlerin ilmî hayata verdikleri önem ele alınmıştır. İkinci bölümde İsbîcâbî'nin fıkıh anlayışı ana hatlarıyla ele alınmıştır. Yazdığı Şerhu Muhtasari't-Tahâvî adlı eseri örnek olarak incelenmiş, bu eserinin yazım şekli, eserde kullandığı kaynaklar, kullandığı örnekler çerçevesinde nasıl bir eser olduğu ortaya konulmuştur. Üçüncü bölümde İsbîcâbî'nin fürû fıkıh alanında Hanefî fıkhına katkısı incelenmiştir. Kendisinden sonra gelen âlimlerin, fakihin görüşlerine başvurarak bu görüşleri kendi eserlerinde referans olarak kullanmaları ele alınmıştır. Çalışmanın kapsamını aşacağından her referansa değinme imkânı olmadığından -özellikle ibadetler konusunda- ele alınmıştır. Sonuç olarak bu çalışma ile İsbîcâbî'nin özgün kişiliği ve ilmî birikimi ortaya konulmaya çalışılmıştır."
