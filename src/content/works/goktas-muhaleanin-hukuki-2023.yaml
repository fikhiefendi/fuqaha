abstract: "Bu çalışmada, muhâlea sözleşmesinin hukuki nitelik ve sonuçları incelenecektir. Muhâlea, özel lafızlarla kurulan bir akittir ve karının kocasına vereceği bedel karşılığında kocanın karısını boşamasını ifade eder. Araştırmamızda öncelikle muhâleanın teorik ve yapısal özelliklerinden bahsedilmiştir. Birinci bölümde, İslam hukuk ekollerinin muhâleaya yaklaşımı, hul' sözleşmesinin hukuki dayanakları, geçerlilik şart ve unsurları ve akit teorisi bağlamında diğer sözleşmelerle benzeşen ve ayrışan yönleri tespit edilmeye çalışılmıştır. Çalışmamızın ikinci bölümünde muhâleanın İslam hukukçularınca tartışmalı olan hukuki vasfı ve sonuçları irdelenmiştir. Hukuki nitelik bakımından muhâlea, birtakım klasik ve son dönem hukukçuları tarafından fesih olarak nitelendirilirken çoğunluk fıkıh bilginlerine göre talâk olarak değerlendirilmektedir. Bu bölümde öncelikle fesih, tefrîk ve talâk ilişkisi tartışılmış, ardından tarafların delilleri ve yaklaşımları ayrıntılı olarak incelenmiştir. Üçüncü bölümde muhâlea sözleşmesine dair çağdaş yaklaşımlara yer verilmiştir. İslâm sorumluluk hukuku çerçevesinde tazminatla ilgili genel kavramlar tanıtılmış, maddi ve manevi tazminat unsurları üzerinden muhâleada kocaya verilen bedelin boşanma tazminatı olarak değerlendirilip değerlendirilemeyeceği hususu tartışılmıştır."
