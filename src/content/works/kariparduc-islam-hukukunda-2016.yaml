abstract: "İslam borçlar hukukundaki temel konulardan olan damân ve taahhüt genel olarak mali ödeme sorumluluğunu ve risk yüklenmeyi ifade etmektedir.Tez çalışmamızda, damân kavramının naslardaki temelleri, fıkıh literatüründeki algılanma ve yorumlanma biçimi, damân teriminin gelişim süreci ve damânın uygulanabileceği konular ve sınırları ele alınmıştır.Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında konunun fıkıh ilmi içindeki yerine, sınırlandırılmasına, araştırmanın amaç ve yöntemi ile kaynaklarına dair bilgilere yer verilmiştir.Birinci bölümde damân teriminin kavramsal çerçevesi ortaya konulmuştur. Bu bölümde damânın anlamı ve tanımı, damânın mahiyeti, benzer terimlerle ilişkisi, konuyla ilgili naslara yer verilmiştir. Çalışmanın ikinci bölümü damânla ilgili bazı genel kurallar, damân sebepleri, damân ile kefâlet arasındaki farklar konusuna tahsis edilmiştir.Çalışmamızın son bölümü olan üçüncü bölümde ise, damânın uygulanabileceği konular ve sınırları ele alınmıştır. Çalışmamız, vardığımız neticeleri ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır."
