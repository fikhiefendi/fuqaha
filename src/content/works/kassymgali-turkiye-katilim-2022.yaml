abstract: "Bu araştırma, banka karakteristiğinin yanı sıra makroekonomik belirleyicilerin Türkiye'deki faizsiz bankaların karlılığı üzerindeki etkisini incelemektedir. Türkiye'deki katılım ve geleneksel bankaların karlılığının belirleyicilerini anlamak amacıyla 2010-2018 yılları arasında Türkiye'deki 30 bankadan toplanan 5 katılım ve 25 geleneksel bankadan elde edilen verilerin analizinde tek adımlı sistem GMM (GMM) yöntemi kullanılmıştır. Karlılığı ölçmek için Ortalama Aktif Karlılığı (ROAA), Ortalama Özkaynak Karlılığı (ROAE) ve Net Faiz Marjı (NIM) belirleyicileri kullanılmıştır. Sermaye yeterliliği, varlık kalitesi, yönetim, likidite ve banka büyüklüğü gibi bankaya özgü belirleyiciler karlılığa karşı gerilemiştir. Buna ek olarak, listelenen yerli şirketlerin piyasa değeri, bankalar tarafından özel sektöre yurt içi kredi, genel devlet harcamaları, para arzı gibi makroekonomik değişkenleri de analiz edilmiştir. Bu çalışmanın sonuçları, tüm bankaya özgü belirleyiciler arasında Yönetim Verimliliğinin Türkiye'deki tüm banka karlılığı belirleyicileri ROAA, ROAE ve NIM üzerinde olumsuz önemli bir etkiye sahip olduğunu göstermektedir. Sermaye yeterliliğinin katılım ve geleneksel bankaların NIM ve ROAA'sı üzerinde olumsuz, katılım bankalarının NIM'İ üzerinde olumlu ve önemli etkisi bulunmaktadır. Aktif Kalitesinin katılım bankalarının ve geleneksel bankaların ROAA'sı üzerinde olumsuz güçlü etkisi bulunmaktadır. Piyasa kapitalizasyonunun katılım bankalarının ROAE'si ve geleneksel bankaların NIM'i üzerinde olumlu ve önemli etkisi vardır."
