abstract: "Zekât Müslümanları birbirine bağlayan bir ibadettir. Zekât toplama ve dağıtma sistemi devlet eliyle yürütüldüğünde adil olarak dağıtılacak ve hak edilen yerlere ulaşacaktır. İslam dünyasındaki zekât kurumlarının mezhep, coğrafya, sosyal, siyasi gibi etkenler nedeniyle farklılık gösterdiği tespit edilmiştir. Bu sebeple çalışmamızda Ürdün başta olmak üzere Türkiye ve İslam ülkelerindeki sistemler araştırılmıştır. Ürdün zekât sistemi incelendiğinde bazı hukuki maddeleri, organizasyon yapısı, harcama yerleri, üretme ve geliştirme projeleri gibi özellikleri birçok İslam ülkesine örnek teşkil edecek şekildedir. Ürdün Zekât Kurumundan elde edilen raporlardan 2014-2021 yılları arası veriler istatiksel olarak değerlendirildiğinde Tevbe suresinin 60. ayetindeki zekât harcama yerlerine uygun olarak dağıtıldığı tespit edilmiştir. Tezin temel amacı, Ürdün zekât sistemini incelemek ve Türkiye için bir model önerisi oluşturmaktır. Günümüz zekât kurumları içerisinde Ürdün sisteminin başarılarının, ulaştıkları hedeflerinin ve eksikliklerinin tespit edilmesi ve Türkiye'de kurulacak bir zekât kurumu modeli oluşturulması bu çalışmanın en önemli çıktılarındandır. Araştırmada literatür çalışması ve belge tarama teknikleri kullanılmıştır. Ürdün Zekât Kurum'unda yetkili kişilerle soru cevap niteliğinde online görüşme sağlanmıştır. İslam Ülkelerindeki zekât kurumları karşılaştırma yönteminden faydalanılarak konu aydınlatılmaya çalışılmıştır."
