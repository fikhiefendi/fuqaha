abstract: "Bu çalışmada câhiliyeden Hz. Ömer?in hilâfeti sonuna kadar olan dönemdeki yargı kurumu ve işleyişi konu edilmiştir. Giriş ve iki bölümden oluşan çalışmamızın giriş kısmında araştırmanın metodu ve kaynaklarından, sonrasında ise bir devlet fonksiyonu olarak yargı ve İslâm?da yargı kavramından bahsedilmiştir. Birinci bölümde ?Hz. Ömer Dönemine Kadar Yargı? başlığı altında câhiliye, Hz. Peygamber ve Hz. Ebû Bekir dönemlerindeki yargı ve yargıyla ilgili faaliyetler incelenmiştir. Câhiliye döneminde yargı konusu; hakemler, davalar ve yargılama usûlü olmak üzere iki kısımda ele alınmıştır. Yine Hz. Peygamber döneminde yargı konusu da; yargı kurumunun temelleri, başkent Medine?de ve diğer bölgelerde yargı, kadılar ve yargılama usûlü dört kısımda incelenmiştir. Son olarak Hz. Ebû Bekir döneminde yargı konusu ise; başkent Medine?de ve diğer bölgelerde yargı ve yargılama usûlü olmak üzere iki kısımda ele alınmıştır. Çalışmamızın ana gövdesini oluşturan ikinci bölümünde ise Hz. Ömer dönemindeki yargı konu edilmiştir. Hz. Ömer dönemindeki yargı konusu ise ?Kadılar ve Yargılama Usûlü? olmak üzere iki başlık ve bunların altındaki ara başlıklar şeklinde ele alınmış ve açıklanmıştır. ?Kadılar? bölümünde şehirlere yapılan kadı atamaları, kadıların atanma ve görevden alınmaları, kadı atamalarında dikkat edilen hususlar ve kadıların maaşları incelenmiştir. ?Yargılama Usûlü? bölümünde ise Hz. Ömer?in kadılarına göndermiş olduğu mektup ve talimatlar, hilâfeti dönemindeki davalar ve bu davalarda dikkat edilen hususlar örneklerle açıklanmıştır."
