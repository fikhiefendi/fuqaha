abstract: "Konumuz Kiraya Verenin Ayıba Karsı Tekeffül Borcu günümüz toplumunda birçok kiracıyı ve kiraya vereni ilgilendirmektedir. Bu arastırmada öncelikle kiraya verenin ayıba karsı tekeffül borcunu farklı hukuklarda kıyasladık. Roma, Mecelle ve ?ngiliz Hukukları gibi hukuklardaki durumunu inceledik. Genel Borç iliskilerinde kötü ifanın tanımını, kosullarını ve sonuçlarını inceledik. Daha sonra bu bilgiler ısığında kiraya verenin ayıba karsı tekeffül borcunun tanımını, hukuki niteliğini ve özelliklerini arastırdık. Tezimize kiraya verenin ayıba karsı tekeffül borcunun olusmasının sartlarıyla devam ettik. Bu sartları da iki bölüm halinde: Esasa ?liskin sartlar, sekle iliskin sartlar olarak inceledik. Daha sonra kiraya verenin ayıba karsı tekeffül borcunun hükümlerini anlattık. Bu bölüm altında olusacak hükümleri ve niteliklerini analiz ettik. Yaptığımız çalısmamızda genel olarak kiraya veren ile kiracının hukuki iliskilerini inceledik. Bu arastırmayı; Borçlar Kanunu, Yeni Türk Borçlar Kanunu Tasarısı, Yargıtay ve Doktrin ısığında ele aldık."
