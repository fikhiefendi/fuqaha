abstract: "Köle, hukukî, iktisadî ve sosyal ihtiyaçlarından mahrum bırakılıp özgürlüğüne zincir vurulan ve hür insanlara nazaran çok aşağı statüde kabul edilen kimseye denmektedir. İslam Hukuku'na göre bu statüde bulunan erkeğe“köle”, kadına ise“cariye”denir. Kölelik, insanlık tarihi kadar eski bir kurum olup Sümer, Akad, Eski Mısır, Hitit, Fenike, Babil, Hint gibi hemen hemen bütün uygarlıklarda görülmüştür. Yapılan savaşlar sonucu kişinin esir düşmesi, kumar veya başka sebeplerden dolayı borçlanması, zorla kaçırılması, satılması ve köle olarak doğması gibi birçok durum köleliğin kaynağı olarak gösterilebilir. Anadolu Selçuklu Devleti'nde kölelerin genel olarak ordu ve sarayda kullanıldığını görebilmekteyiz. Belirli bir eğitim sisteminden geçerek köle-asker özelliği kazanan gulâmlar, devletin birçok üst kademesinde de zaman zaman görev almışlardır. Kölelik her ne kada kaldırılmaya çalışılmışsa da günümüze kadar farklı şekillere bürünüp varlığını sürdürmüştür. Anadolu Selçuklu Devleti'ndeki kölelik kurumu da kendisinden önce kurulan İslam devletlerinin bir devamı niteliğindedir. Böylece mevcut İslam ülkelerinde uygulanan kölelik müessesesi Anadolu Selçuklu Devleti'nde de ufak değişikliklere uğrayarak devam etmiştir."
