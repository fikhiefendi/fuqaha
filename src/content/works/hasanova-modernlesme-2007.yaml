abstract: "Modernlesme Sürecinde slam Hukukunda Maslahat Tartısmaları? isimli tez çalısması giris, iki bölüm ve sonuçtan olusmaktadır. Giris bölümünde modernlesme sürecine genel bakıs yapılarak bu sürecin slam dünyasındaki yansımasına ve özellikle müslüman ilim ve fikir adamlarının hukuk tefekkürlerine etkisine genel olarak deginilmis, Osmanlı dönemi ve Cumhuriyet dönemi Türkiye'si yanında, diger slam ülkelerinde modernlesme sürecinin kısa tarihi özetlenmistir. Birinci bölümde, klasik kaynaklar ısıgında maslahat düsüncesinin ortaya çıkması, terimlesme süreci, kavramsal çerçevesi, diger delillerle iliskisi ve mezheplere göre gelismesi incelenmistir. kinci bölümde ise, son dönem slam dünyasında maslahat eksenli tartısmalarda öne çıkan cmanın Kurumsallastırılması, Örf-âdet ve Makâsıd konuları ele alınmıstır. Belirtilen konular, bunları son dönemde özel bir vurgu veya farklı bir bakıs açısı ile yeniden gündeme getiren Muhammed Abduh, Ziya Gökalp ve Muhammed Tâhir b. Âsûr'ın görüsleri ısıgında incelenmeye çalısılmıs ve bu konularda dikkat çeken baska alim ve düsünürlerin fikirlerine yeri geldikçe isaret edilmistir. Sonuç olarak, degisen ve gelisen toplum, hukukun canlılıgını korumak için dogal olarak yeni hükümlere ihtiyaç duymaktadır. slam muhitinde maslahat/makâsıd kavramları üzerinde ısrarla durulması ve maslahat eksenli tartısmaların hukukun hemen her meselesinde gündeme gelmesi bu dogal ihtiyacın teoriye yansımasından baska bir sey degildir. Degisime ayak uydurmak ve Batı'ya tamamen teslim olmak istemeyen slam alimlerinin bu amaçla maslahat kavramını yeniden ele almaya ve onun slam hukuk literatüründe ve tesriînde tuttugu önemli yeri daha belirgin biçimde ortaya koymaya çalıstıkları açıktır. Genellikle bu düsünceyi naslara aykırı veya onlardan bagımsız biçimde isletmeme noktasında fikirbirligi bulundugu, fakat bunun nasıl basarılabilecegi hususunda ortaya konan önerilerin genis bir yelpaze olusturdugu görülmektedir."
