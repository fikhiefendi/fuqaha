abstract: "Bu çalışmanın amacı, katılım bankalarının tarım finansmanındaki yeri ve önemini ortaya koymaktır. Bu amaçla, 2009-2020 banka kredi verileri sektörlere göre analiz edilmiş ve örnek bir katılım bankasının tarım sektöründeki finansman faaliyetleri ve karlılığa etkisi incelenmiştir. Çalışmanın sonucunda katılım bankalarının toplam kredilerden aldığı pay ve genel tarım sektörü içerisinde aldığı nakdi ve gayri nakdi krediler yıllar itibari ile incelenmiş hem kredi pastasında hem de tarım kredileri içerisinde katılım bankalarının payı incelenen dönemlerde artış trendin de olduğu gözlemlenmiştir. Ayrıca çalışmanın dikkat çeken sonuçlarından birisi de incelenen bankanın tarım sektörüne hizmet vermeye başladığından itibaren toplam aktiflerinin, kullandırdığı fonların ve net kar seviyesinin artış trendinde olduğu görülmektedir. Diğer bir ifadeyle tarım sektörüne hizmet vermesi banka finansal tablolarına olumlu olarak yansıdığı söylenebilir. Bunlara ek olarak, analiz sonucunda tarım sektöründe takibe dönüşüm oranının bankacılık sektörü ortalamasının altında olduğu ortaya çıkmıştır. Bu durum tarım sektörünün katılım bankaları için fırsat olarak değerlendirilebilir. Çalışma, giriş bölümü hariç dört ana bölümden oluşmaktadır. Çalışmanın ilk bölümünde bankacılık ve katılım bankacılığı ile temel kavramlar ve genel bilgiler açıklanmıştır. Çalışmanın ikinci bölümünde katılım bankacılığının sektörlere yönelik fon toplama ve fon kullandırma yöntemleri ile birlikte katılım bankalarının aktif olduğu sektörler ele alınmıştır. Bunlara ilave olarak ülkemizde faaliyet gösteren katılım bankalarına ait bilgilere yer verilmiştir. Çalışmanın üçüncü bölümünde tarım sektörünün işleyişi, finansman süreçleri, tarım sektörünün sorunları incelenerek çözüm önerileri getirilmiştir ve faizsiz araçlarla tarım finansman şekli açıklanmıştır. Çalışmanın dördüncü bölümünde; katılım bankalarının tarım sektöründeki önemini belirlemeye yönelik istatistiki veriler tablo ve grafik olarak sunulmuş ve yorumlanmıştır. Bu bölümde örnek bir katılım bankasının tarım sektöründeki kredi verileri ve tarım sektörünü fonlama seçenekleri ile ilgili bilgiler açıklanmıştır. İncelenen katılım bankasının yıllar itibari ile tarım sektöründeki durumu ortaya çıkarılmış ve bankanın tarım finansman riskine, tarım kredi kart riskine ve ELÜS (Elektronik Ürün Senedi) ürün risklerine yer verilmiştir. Bankacılık sektörü ve Tarım sektöründeki takibe dönüşüm oranlarının karşılaştırmaları yapılmıştır. Sonuç kısmında tüm incelenen verilerle katılım bankalarının ve örnek incelenen bankanın sektörde daha aktif ve pay oranın artırılması için değerlendirme yapılmış ve önerilerde bulunulmuştur."
