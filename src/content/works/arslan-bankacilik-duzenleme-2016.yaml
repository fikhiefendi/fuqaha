abstract: "Ülkemizde halen yürürlükte olan 5411 sayılı Bankacılık Kanunu kapsamında katılım ve mevduat bankacılığı sistemi arasında var olan farklılıklar bankaların istisnai çalışma sistemleri dışında büyük oranda ortadan kaldırılmıştır. Bu bağlamda 5411 sayılı Kanun dahilinde“banka”kavramı içerisine dahil edilen katılım bankacılığı sistemi günümüzde faizsiz bankacılık anlayışı içerisinde mevduat bankaları tarafından gerçekleştirilen bankacılık faaliyetlerinin birçoğunu kendi prensiplerine ters düşmemek kaydı ile yerine getirmektedir. 5411 sayılı Bankacılık Kanunu dahilinde katılım ve mevduat bankacılığı sistemi arasında var olan farklıkların büyük oranda ortadan kaldırılmasına karşın esas itibariyle katılım ve mevduat bankalarının çalışma sisteminin temelini oluşturan faizli ve faizsiz bankacılık anlayışı bakımından her iki banka türü açısından farklılık devam etmektedir. Bu bağlamda her iki tür bankanın müşterilerinin banka tercihindeki esas müşterilerin faizli ve faizsiz bankacılık tercihidir."
