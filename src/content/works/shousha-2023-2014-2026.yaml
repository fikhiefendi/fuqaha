abstract: "Bu araştırma, İslami sosyal finans araçlarının yapısal toplumsal dengesizliklerin giderilmesindeki ampirik etkinliğini ölçmek gibi temel bir meseleyi ele almaktadır. Çalışmanın önemi, geleneksel teorik söylemin ötesine geçerek; İslami Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu (AAOIFI) tarafından yayınlanan Şer'i standartları bir düzenleyici çerçeve olarak kullanıp, Şer'i amaçlar (Makasid) ile ekonometrik modelleme arasında ampirik bir köprü kurmasından kaynaklanmaktadır.Araştırma problemi, özellikle zekât ve vakfın“ortak etkisini”entegre bir sistem olarak ölçen çalışmaların kıtlığı göz önüne alındığında; İslami iktisat politikalarının felsefi temelleri ile yoksulluğun azaltılması üzerindeki somut dijital etkileri arasındaki metodolojik ve pratik boşluğu vurgulamaktadır. Araştırma sorularına cevap bulabilmek amacıyla araştırmacı; teorik ve karşılaştırmalı yönler için Betimsel-Analitik yaklaşım, uygulamalı analiz için ise Malezya'nın Selangor eyaletine ait 2014-2023 dönemi zaman serisi verilerini analiz etmek üzere Oto-Regresif Dağıtılmış Gecikme (ARDL) modelini kullanarak Ampirik Ekonometrik yaklaşım benimsemiştir.Çalışma sonucunda temel bulgulara ulaşılmıştır; bunların en başında (Zekât-Vakıf) sistemi ile incelenen toplumdaki yoksulluk açığının azaltılması arasında uzun ve kısa dönemli bir denge ilişkisinin (Eşbütünleşme/Cointegration) varlığının kanıtlanması gelmektedir. Bulgular ayrıca, her iki aracın ortak kalkınma etkisinin, bireysel etkilerinden daha fazla olduğunu göstermiştir; zekât acil bir tüketim destek aracı olarak işlev görürken, vakıf yapısal bir yatırım istikrar aracı olarak rol oynamaktadır. Çalışma, Selangor deneyiminin başarısının açıkça Şer'i standartlara bağlılığa ve dijital kurumsallaşmaya dayandığını, bu araçların toplumsal istikrar ve sürdürülebilir ekonomik refahın sağlanmasında etkili yöntemler olduğunu teyit etmiştir."
