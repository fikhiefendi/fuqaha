abstract: "İslam aile hukukunun en önemli konularından biri mehir ve ev eşyasıyla ilgili anlaşmazlıklar ve bunların çözümüdür. Her ne kadar mutlu ve huzurlu devam eden evliliklerde bu tür anlaşmazlıklar vuku bulmasa da özellikle boşanmanın, karı ile kocadan biri veya her ikisinin ölümü durumunda sıkça vuku bulması muhtemeldir. Her ne şekilde olursa olsun İslâm hukukçuları, mehir ve ev eşyasıyla ilgili vuku bulan anlaşmazlıklara büyük önem vermiş ve bunlara pratik çözüm önerileri getirmişlerdir. Karı ile koca veya onların varisleri arasında mehirle ilgili muhtemel anlaşmazlıklar; mehrin tayin edilip edilmemesi, miktarının ne kadar olduğu, cinsi, nev'i ve vasfının ne olduğu; artması, eksilmesi veya tamamen telef olması durumunda kimin bunu tazmin edeceği, zevce tarafından teslim alınıp alınmadığı ve zevceye verilen bazı eşyaların mehir sayılıp sayılmayacağı gibi konularla ilgilidir. Ev eşyasıyla (metâu'l-beyt) ilgili muhtemel anlaşmazlıklar ise genellikle evi dayama-döşeme (techizu'l-beyt) görevinin zevceye mi yoksa kocaya mı ait olduğu ve evde bulunan eşyanın kimin mülkü olduğu hususlarıyla ilgilidir. Tüm mezheplere göre, karı ile koca arasında zikri geçen konularda anlaşmazlığın vuku bulması durumunda kanıt varsa, kanıta göre hükmedilir. Kanıtın olmaması durumunda ise karı ile koca kendi iddialarının doğru olduğuna dair yemin etmeye davet edilirler. Karı ile kocadan birinin yemin etmesi durumunda, iddiası üzerine yemin eden tarafın iddiasına göre hükmedilir. Her ikisinin yemin etmesi veya etmemesi durumunda ise mezheplerin farklı görüşleri vardır. Karı ile kocadan birinin veya her ikisinin ölümü durumunda, onların varisleri arasında zikri geçen konularda anlaşmazlığın vuku bulması halinde, Hanefi mezhebi hariç diğer üç mezhebe göre karı ile koca sağmış gibi hareket edilir."
