abstract: "İslam medeniyeti her alanda velûd bir karakter arz eder. Şer'î ilimlere, özellikle İslam'ın sosyal hayatta en belirgin yüzü olan fıkıh ilmine dâir selef ulemâsının ortaya koyduğu gayretlerin, gerek tahkik/edisyon kritik, gerek araştırma/değerlendirme olarak gün yüzüne çıkarılması son derece önem arz etmektedir. Genelde İslam alemi, özelde Filistin ve Kudüs'te Osmanlı döneminde kaleme alınan fıkıh eserleri, zannedildiğinin aksine hiç de azımsanacak boyutlarda değildir. Edisyon kritiğini yapmış olduğumuz, Kudüs müftülüğü görevini ifa eden Abdülfettâh b. Derviş en-Nablusî et-Temîmî'nin (h.1138/m.1726) Fethu Rabbi'l-Beriyye fî Fıkhi's-Sâdeti'l-Hanefiyye adlı eseri, söz konusu dönemde Hanefi mezhebi fetvâ literatürüne dair yazılan önemli bir kaynak olduğu gibi müellifin yaşadığı döneme ait tarihi bir belge niteliğindedir."
