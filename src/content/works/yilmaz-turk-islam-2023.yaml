abstract: "Türklerin devletli tarihine yönelik çalışmaların odağı, devletlerin bürokratik mekanizmaları ya da bu mekanizmaların kuruluşuna yönelik tarihsel serencamın baskın olduğu zeminde şekillenir. Tarihsel ya da kamu hukuku ağırlıklı bu inceleme metodunun ötesinde, devlet olgusu çok yönlü bir metodolojinin konusudur. İslam öncesi ve sonrası Türk devletlerinin incelenmesinde, modern hukuktan Batılı siyaset felsefesine, Doğunun oluşturduğu klasik siyaset felsefesi birikiminden İslam Hukukuna, siyasi tarihten, siyasal antropolojiye kadar birçok disiplinin kavramsallaştırmalarının birlikteliği zorunludur. Buna karşın Türkiye'de, Türk devletlerine yönelik ikili bir kavramsal dünya ayrımı oluşmaktadır. Bir tarafta batılı literatürün belirleyici olduğu siyaset bilimi ve kamu hukuku yoğunluklu çalışmalar, diğer yanda ise İslam hukuku ve klasik Doğu siyaset felsefesi yaklaşımlarıyla örülü bir yapı bulunmaktadır. Bu iki yapının da birbirleriyle ilişkisi gayet sınırlı kalmaktadır. Bu durum altında İslam öncesi ve sonrası Türk devletlerinin kavranması, aralarındaki sürekliliklerin ve farklılıkların anlaşılması için verimli bir zemin oluşmamaktadır. Bu çalışmada da devlet denilen olgunun, kavramların coğrafya ya da zamanlarla sınırlı dünyasının dışına çıkılarak, birçok disiplinin de yardımıyla devlet olgusunu açıklayan çekirdek kavram olan egemenlik doktrinine odaklanılarak bu süreç incelenmiştir. Devletlerin egemenlik doktrini, o devletin doğduğu toplumsal ve siyasal kültür içinde şekillenirken, egemenlik üzerinden de devlet mekanizması ve hukuk kültürü şekillenmektedir. Dolayısıyla egemenlik doktrine odaklı bir çalışma yukarıda anılan birçok disiplinin de kavramlarını kullanmayı zorunlu kılmaktadır. Çalışmada bu yönde birincil ve ikincil tarihsel kaynaklardan yararlanılırken, bu kaynaklar üzerinde hem Doğu hem Batı literatürün kavramsal çerçeveleri kullanılmıştır. Böylece Türk tarihindeki devlet denilen olgu, Türk toplumunun tarihsel macerasındaki gelişimi Türklerin toplumsal, kültürel ve medeni birikimlerinin oluşturduğu özgülüğe sadık kalınarak incelenmiştir. Bu incelemenin gösterdiği en belirgin sonuç, Türklerin İslam öncesinde ve sonrasında kurdukları devletlerin egemenlik kavrayışlarının benzerliği ve bu kavrayış etrafında şekillenen hukuk kültüründeki sürekliliktir. Döneminin diğer milletlerin kültürel ve medeni sahalarından kendini ayırarak belirginleşen bu farklılığın en bariz yansıması ise bağımsız siyasal alanın oluşumda Türklerin gösterdiği başarıdır. Devlet denilen olgu bir gelenekle kavranacaksa, bu geleneğin somutlaştığı alan da böylece egemenlik doktrinindeki süreklilikle gözlemlenebilir."
