abstract: "Bu çalışmanın amacı Bediüzzaman Said-i Kürdi'nin (1876-1960) düşüncesinde etik alanın formülasyonunu sunmaktır. Bu fikrin İslam'ın klasik çağındaki görünümünü resmederek, ve bu çağda etik alanın metafizik, Kutsal Metin ve politik kaygılarla şekillendiğini sunarak iddia edilmiştir ki İslam Dünyası'mn modernleşme süreciyle İslam'ın ruhuna yabancılaşması, bir yandan modernist toplum zihniyetini içselleştiren ve öte yandan İslam hukuku algılamasını modern koşullara uyarlayan eğilimler ortaya çıktı. Bu iki akımın Bediüzzaman tarafından 19. yüzyıl ideal toplum kavramsallaştınlması olarak Sufi yaklaşımlarının sunduğu parametreler içerisinde sentezlendiği iddia edildi. Sufizm yoluyla Bediüzzaman, Aydınlanma ideallerini insanın dünyadaki gerçek varoluşu olan Allah'ın halifeliği konumu varsayımıyla yeniden değerlendirerek modern bir sosyal düşünceye ulaşmıştır.Bu sosyal düşünceyle o, akla dayanan ve hedefi özgürlük olan bir İslam hukuku yorumuna varmıştır."
