abstract: "Tezimizde Fetâvâ-yı Ali Efendi'nin yazma nüshası üzerine çalışılmıştır. Nüsha, Amasya Beyazıt Yazma Eser Kütüphanesi'nde bulunmaktadır. Nüshanın 2a-56b varakları arasındaki 881 fetvâ latinize edilmiştir. Çalışmanın birinci bölümünde fetvânın tanımı yapılmıştır. Akabinde Hz. Peygamber (s.a.v.), sahâbe, tâbiîn, müctehid imamlar ve Osmanlı Devleti dönemlerinde işleyişi anlatılmıştır. Müellif Çatalcalı Ali Efendi'nin (ö. 1103/1692) hayatı, eğitimi ve vazifelerinden bahsedilmiş, Fetâvâ'sına dair bilgiler paylaşılmıştır. İkinci bölümde Amasya ve Merzifon'un XVIII. yüzyıldaki siyasî, iktisadî ve sosyal durumu anlatılmıştır. Bu bölgelerde yaşayan halkın inançlarının, sosyal ve kültürel durumlarının müstensih Seyyid Abdülgafûr'un Fetâvâ-yı Ali Efendi'den yaptığı seçkilerdeki tezahürü üzerinde durulmuştur. Orijinal nüshadaki fetvâlar içerisinden bazılarının tercih edilmesinin nedenleri fetvâ örnekleriyle birlikte açıklanmıştır. Mecmûanın 2a-56b varakları arasındaki 881 fetvânın soruları ve cevapları örnekleriyle birlikte tablolar halinde verilmiştir. Çalışmanın sonuna 881 fetvânın latinize metni, fetvâ sayılarının bâblara göre dağılımı, örnek metinler ve mecmûanın kütüphane kayıtlarına hatalı işlenişine dair görsel eklenmiştir."
