abstract: "İbn Receb'in Ravâiu't-tefsîr adlı eseri özelinde hazırladığımız bu tez bir giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi, konusu ve çalışma yapılırken takip edilecek yöntemler hakkında bilgiler verilmiştir. Çalışmanın birinci bölümünde, İbn Receb'in yaşadığı Memlûk Devleti genel hatlarıyla tanıtıldıktan sonra yaşadığı dönemin ilmî ortamı ele alınmıştır. Bunun yanında İslâmî eğitimin verildiği merkezler ile buralarda yetişen âlimlerin fikir, düşünce ve eserleriyle tefsir, hadis ve fıkıh gibi dinî ilimlere yaptıkları katkılar incelenmiştir. Daha sonra İbn Receb'in nesebi, doğumu ve ailesinden bahsedilerek ilmî kişiliğinin oluşmasında emeği geçen hocaları ve onun tarafından yetiştirilen talebeler hakkında kısaca bilgi verilmiştir. Aynı bölümde müellifin geniş ilmî müktesebatını yansıtan eserler üzerinde durulmuştur. Çalışmanın ikinci bölümünde tefsirinin ismi, telif şekli, özellikleri ve kaynakları hakkında bilgi verilmiştir. Hadis râvîlerinin adâlet ve zabt yönünden durumları araştırılarak, hadisleri rivâyet etme ehliyetine sahip olup olmadıkları incelenmiştir. Böylelikle müellifin, isnad ve metin sistemine dair bakış açısı tespit edilmeye çalışılmıştır. Çalışmanın üçüncü bölümünde ise hadis metinleri arasında oluşan ihtilafı gidermede, müellifin takip ettiği metodun detayları zikredilmiştir. Bazı örnek hadisler üzerinden yapmış olduğu değerlendirmeler tespit edilerek onun, hadis metinlerini yorumlama yönteminin açığa çıkarılması hedeflenmiştir. Son olarak İbn Receb'in selefî, itikâdî, fıkhî ve tasavvufî düşüncelerinin tespiti önemsenmiş ve tefsirdeki yansımaları araştırılmıştır."
