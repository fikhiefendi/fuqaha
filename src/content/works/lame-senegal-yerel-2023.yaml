abstract: "İslâm'ın Senegal'e girişi ilk olarak fetihlerle gerçekleşse de zaman içerisinde ticaret yolları aracılığıyla Müslümanların bölgeye girmesiyle gerçekleşmiştir. İslam'ın bölgeye girişiyle birlikte çeşitli mezheplerde yaygınlaşmış ve Senegal'de özellikle Mâlikî mezhebi tutulmuştur. Mâlikî mezhebinin Senegal'de yaygınlaşmasının sebebi diğer Afrika coğrafyalarında olduğu gibi Mâlikî âlimlerin bu coğrafyaya göç etmesi ve burada İslâm'ın yaygınlaşması için gayret göstermeleri ve Afrika'nın bazı yerel değer ve geleneklerinin Mâlikî mezhebinin örf ve uygulamalarıyla çatışmayarak, uyumlu olması dolayısıyla mezhebin kolaylıkla kabul edilmesidir. Senegal'de Mâlikî mezhebinin kabul edilmesiyle birlikte mezhep içi uygulamalar ülkedeki medreselerde de kendini göstermiştir. Bu çalışmada Senegal'deki yerel ilim meclislerinde ve medreselerinde Mâlikî mezhebinin rolünden bahsedilmiştir. Senegal'in en önemli medreselerinden Tivaouane medresesi, Mâlikî fıkhının yaygınlaşmasında etkili olan çok sayıda âlim yetiştiren bir kurumdur. Çalışmada söz konusu medresenin devletle ilişkisi, medrese müfredatı, medresenin fıkıh anlayışı ve günümüz fıkıh meseleleri hakkındaki görüşlerine yer verilmiştir. Medresenin, Senegal'de yaygın olan kadın sünneti gibi yerel fıkıh meseleleriyle ilgili görüşlerine ve medresede eğitim gören öğrenciler için zorunlu olan uygulamalara da temas edilmiştir. Çalışmada son olarak Tivaouane medresesinin, Senegal'de yerel bir cemaate dönüşmesi sürecinden de bahsedilmiştir."
