abstract: "Tez konusu olan 199 Numaralı Mahmûd Paşa Mahkemesi Şer'îyye Sicili çerçevesinde elde edilen bilgiler ışığında oluşmaktadır. Tarih boyunca önemli bir konuma sahip olan İstanbul şehrini çok sayıda imparatorluk ve kültüre başkentlik yapmış olmasından ötürü hem konumuyla hem de sahip olduğu tarihi zenginlikleriyle araştırılmaya değer görülmüştür. Bu doğrultuda Osmanlı tarihiyle ilgili doğru bilgilere ulaşılmasını sağlayan birinci elden kaynak olan şeriyye sicilleri bu amaç uğrunda en kayda değer kayıtlar olarak kabul edilir. Bu tez çalışmasında H.1322-1324/M.1904-1906 yılları arasındaki İstanbul'un Sur İçi'ndeki Mahmûd Paşa Semti'ndeki Mahmûd Paşa Camisi'nin avlusunda icra edilen Mahmûd Paşa Mahkemesi Şer´îyye Sicili'ne ait davaların bulunduğu 199 Numaralı Şer´îyye Sicili'nin transkripsiyon ve değerlendirilmesi ile elde edeceğimiz yeni bilgilere ulaşılması hedeflenmiştir."
