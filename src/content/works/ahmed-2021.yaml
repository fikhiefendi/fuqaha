abstract: "Fıkıh Usulü, okuyucusuna faydalı ve gücünü artıran en önemli Şeriat bilimlerinden biridir ve şeriat kararlarının verilmesi sırasında ne âlimin ne de hakimin vazgeçemeyeceği standart bilimlerden biridir. Bu sanatta; Kanunun yörüngesi onun üzerinde olduğu için ve onunla amaçları biliniyor ve hükümleri yönlendiriliyor ve bilim adamları geçmişte ve günümüzde bununla ilgilenmişlerdir. Çünkü bilimleri şeriatın hükümlerine bağlar ve ben onları içtihat ve kesinti ile ve gerekli yasal hükümlere ulaşmada en yüksek derecede uzmanlaştım, ancak sanat insanlarının dediği gibi bu onun faydası ve meyvesi. Bunun için uygun değil; Çünkü bilimleri denetlemiştir ve Yüce Tanrı'nın istediği şeyi küçümsemede en yüksek düzeydedir. Alimler, bu sanatın konularını tanımlamış, ayrıntılı olarak belirtmiş ve bilmeyenlerin: O, kullar arasında fetvalar çıkarma ve aralarında hüküm verme yetkisine sahip değildi ve bu önemli köktendinci konular arasında şunlar yer alıyor: Erdemli alim Sadr alSharia Ubeyd Allah bin Mesud al-Mahbubi el-Bukhari el-Hanafi'nin (ö. 747 h) Kitabın ortasında belirsiz, kendi kitabından bildirdi; Eş-Eş'arî'nin gittiği şeyin zayıflığını, iyinin ve çirkinin emir vermek ve yasaklamak dışında ispatlanmadığını göstermek için, o halde iyinin emrettiği ve çirkin olanıdır: yasakladığı şeydir, sonra kanıtını aktardı ve şöyle dedi: Zayıflığı apaçık, sonra dedi ki: Birçok alimin bu kanıta kesin olarak inandığını bilin. Ve buna kesin olarak inanmayanlar, girişlerinde söylenebilecek bir yasağa yer vermediler: Bu bir şeydir ve içindeki hata yerleri her iki taraf için gizlenmiştir ve ne düşüneceğimi duyuyorum ve bu dört tanıtıma dayanmaktadır(1) Bu yüzden bu el yazmasının yüksek lisans derecesi almak için araştırma alanı olmasını istedim, bu yüzden İslami Araştırmalar Merkezi'nde (ISAM) yapılanlara göre başardım ve dört nüsha elde ettim ve Hindistan'daki normal üniversite nüshası olan metin ve numaralandırmanın kopyalanması ve kontrolünde ilkini benimsedim.(no: 330) (ve cuma Al Macid merkezi'de fotoğrafları var). En eskisi olduğu için ve geri kalanıyla ilgili olarak, metni kontrol etmede onlardan yardım istedim ve metni modern yazım kurallarına göre hazırladım ve benim için kolay olduğu kadar onaylanmış kitaplarından sahiplerine fikirlerini atfettim. Cevap verdim ve Uzun, sıkıcı veya kısa olmamak için araştırmamı ılımlılaştırmaya çalıştım."
