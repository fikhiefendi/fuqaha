abstract: "Bu akademik tez çalışmasında, karşılaştırmalı tarih çerçevesinde 1299-1317 yılları arasında İlhanlı-Memlûklü ilişkilerinde bilim insanı ve siyaset teorisyeni İbn Teymiyye ve devlet yöneticisi Reşidüddin Fazlullah ekseninde onların devletin yönetim pratiklerini ve siyasi düşüncelerini etkileyerek yönetimde oynadıkları etkin rolleri incelenmiştir. Bu etkin rollerin anlaşılması için İbn Teymiyye ve Reşidüddin Fazlullah'ın hayatları, içinde bulundukları devlet yapısının siyasi düşüncesi, dönemin koşulları, onların dini düşünceleri, toplum yapısı ve mekânsal yönleri göz önünde bulundurularak geniş bir yelpazede incelenmiştir. Memlûk aklı olarak İbn Teymiyye, İslâm dininin ayakta kalması için İlhanlı Devleti'ne karşı mücadele etmiş ve İlhanlı Devleti Müslüman bir devlet olmasına rağmen ona karşı savaş fetvası vermiş, vaaz ve söyleyişlerde bulunarak halkı ve yöneticileri savaşa teşvik etmiştir. Ayrıca İbn Teymiyye'nin savaşa katılması, diplomatik adımlar atması, Memlûk sultanının savaşa katılması için onu ziyaret etmesi ve sultana mektuplar göndermesi, İlhanlı yanlısı gruplarla mücadele etmesi ve halkın devlete olan bağlılığını artırmak için koşulsuz itaat edilmesi gerektiğini ifade etmesi gibi faaliyetleri de dikkate alınarak devlet yönetiminde ve yönlendirilmesinde İbn Teymiyye'nin ne derece etkili olduğu bu çalışmada ortaya konmuştur. İlhanlı aklı olarak Reşidüddin Fazlullah'ın ise devletin sürekliliği açısından Memlûk Devleti'ne karşı verdiği mücadele, hem asker hem de tabip olarak savaşa katılması, diplomasi ilişkilerinde yer alması, ikna sanatını etkili bir biçimde kullanması ve dinî argümanlara yer vermesi gibi faaliyetleri göz önüne alınıp hem yönetimde hem de yöneticiyi üzerinde ne kadar etkili olduğu incelenmiştir. Bu bağlamda iki farklı devletin, iki farklı aklı İbn Teymiyye ve Reşidüddin Fazlullah'ın İlhanlı-Memlûklü çatışmasında düşünce yapılarıyla bürokrasiye yön vererek tarihin akışını nasıl değiştirdikleri gösterilmeye çalışılmıştır. Bu şekilde ele aldığımız çalışmamızda dönemin müelliflerinin kaleme aldıkları eserler, resmî vesikalar, mektuplar ve tetkik kaynaklardan yararlanılmıştır."
