abstract: "Bu çalışmada İmam Şafiî'nin edebî yönünün ortaya çıkarılması amacıyla yaşadığı dönem, hayatı, ilmî şahsiyeti ele alınmıştır. Fâkih, müctehid, hicrî ikinci asrın müceddidi olarak tanınan İmam Şafiî'nin aslında Arap dilinde de âlim, belagat fesahat ve beyanda eşsiz yeteneğe sahip bir şahsiyet olduğu ortaya konulmaya çalışılmıştır. İmam Şafiî'nin Arap dili ve belagati alanındaki yetkinliği ve bunun ilmî kişiliği üzerine etkisinin ne denli büyük olduğuna işaret edilmiştir. Çalışmamız giriş ve dört bölümden oluşmaktadır. Giriş bölümünde yaşadığı dönem, siyasî içtimaî ve ilmî yönden ele alınmıştır. Abbasiler dönemi Arap şiirinin genel özelliklerinden bahsedilmiştir. Birinci bölümde Şafiî'nin ilmi şahsiyetinin oluşmasına etki eden hususları incelemek üzere hayatı ve ilim yolculuğuna değinilmiştir. İkinci bölümde edebî üslûbu, şiir ve nesirleri incelenerek ele alınmıştır. Üçüncü bölümde şiir divanı şekil ve içerik açısından tahlil edilmiş, dördüncü bölümde Meâni İlmi açısından tahlil edilmiş bahse konu belagat sanatlarının tanımı yapılarak Divan'dan örnekler ile açıklanmıştır. Bütün bunlar analitik yöntem ile ele alınmıştır."
