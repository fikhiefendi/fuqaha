abstract: "Son dönemde iktisat biliminin gelişimi ve ona atfedilen önemin artması sebebiyle alternatif bir yaklaşım olarak öne çıkan İslam iktisadi yaklaşımı da merak uyandıran, çalışmalara konu olan ve diğer iktisadi yaklaşımlar ile benzerlik ve farklılıkları ortaya konulan bir alt dal olarak göze çarpmaktadır. İslam iktisadi yaklaşımı temelini İslam'ın birincil kaynakları olan Kur'an ve sünnetten almakta ve kısaca özetlemek gerekirse tüm insanlığın huzur bulacağı bir dünya hedefi doğrultusunda adil bir ekonomik sistemin yol haritasını ortaya koymayı amaçlamaktadır. Ağırlıklı olarak on dokuzuncu yüzyıldan itibaren şekillenmeye başlayan İslam iktisadi yaklaşımına dair pek çok kitap, makale ve tez yayımlanmıştır. Bu çalışma ise , adil bir ekonomik sistem odaklı İslam iktisadi yaklaşımını Kur'an ve sünnet temelinde açıklayıp günümüzde ana akım iktisadi yaklaşım olarak kabul gören ortodoks iktisat yaklaşımından ayrıştığı noktaları belirterek, bugün gelinen noktada İslam iktisadi yaklaşımının pozisyonunu değerlendirmiştir. Günümüzde hakim iktisadi yaklaşım olarak kabul gören ortodoks iktisat yaklaşımı ile farklılıklar ortaya konularak İslam iktisadi yaklaşımının aslında heterodoks bir yaklaşım olarak ele alınabileceği ifade edilmiştir. Çalışmanın ilk bölümünde İslam iktisadi yaklaşımı Kur'an ve sünnete dayalı olarak detaylı bir şekilde açıklanmış ve temel çerçevesi ifade edilmiştir. Ayrıca bu temel çerçeve dahilinde günümüz şartları göz önünde bulundurularak özellikle bankacılık ve finans alanı ile ilgili uygulanmakta olan alternatif İslami çözümlere yer verilmiştir. İkinci bölümde İslam'da devlet kavramına atfedilen önem ve iktisadi alanda devletin görevleri açıklanmış ayrıca İslam'ın kamu maliyesi perspektifi ifade edilmiştir. Son bölümde ise ana akım iktisadi yaklaşım olarak günümüz ekonomi politikalarına yön veren ortodoks yaklaşımlar İslam iktisadi yaklaşımı gözüyle eleştirilmiş ve İslam iktisadi yaklaşımı heterodoks bir yaklaşım olarak ifade edilmiştir. Sonuç bölümünde ise günümüzde İslam iktisadının geldiği nokta itibariyle metodolojik varsayımlar ışığında ortaya konulan çözümlerin yetersizliğinden bahsedilmiştir."
