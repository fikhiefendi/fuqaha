abstract: "Bir akdin esasını, o akit ile elde edilmek istenen hukuki neticeye yöneltilmiş olan tarafların kastı belirler. Bu açıdan kasıt olmazsa akit teşekkül etmez. Fakat içsel bir durum olan kasıt, açığa vurulmadıkça hukuki bir işlemin meydana gelmesi imkânsızdır. O hâlde hukuki işlemlerden söz edilebilmesi için kastın beyan edilmesi gereklidir. Buna binaen bu çalışmamızda İslam borçlar ve aile hukukunda kasıt ve kastın etkisini konu edindik. Çalışmamızda kasıt kavramının mahiyeti ve İslam hukuk ekollerinin kasta ilişkin yaklaşımları üzerinde durduk. İslam hukuk ekollerinin kasta ne derece önem verdikleri, kasıt ile beyanın uyumsuzluğu hâlinde hangisini önceledikleri, dolayısıyla ona ne tür hukuki sonuçlar bağladıklarını araştırdık. Bu bağlamda kasta ilişkin doktriner yaklaşımları belirlemeye çalıştık. Ayrıca İslam hukukçularının kasta dair metodolojik anlayışlarının fıkıh meselelerine ne derece yansıdığını inceledik. Buna binaen mükrehin ve kastetmeksizin dil sürçmesi sonucu ağzından talâka ilişkin sözler çıkan muhtî'in, sarhoşun, hâzilin ve kontrolünü kaybedecek derecede öfkelenmiş kimsenin yaptığı nikâh ve talâkının gerçekleşip gerçekleşmeyeceği hususun hukuk doktrinleri arasında nasıl tartışıldığını ele aldık. Bu ve benzeri işlemlerin hukuki durumları üzerinde durduk ve hukuk ekollerinin konu hakkındaki görüşleri ve dayanak olarak gösterdikleri delilleri serdederek tahlillerde bulunduk."
