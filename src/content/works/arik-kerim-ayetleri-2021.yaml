abstract: "Kur'ân-ı Kerim Âyetleri Işığında Oruç ibadeti ele alınan bu çalışmada özel anlamda İslâm dininde, genel anlamda ise semâvî dindeki konumu incelenmiştir. Oruç kelimesi, Arapça'da savm/sıyâm ve Farsça'da ise rûze olarak isimlendiren kelimelerin Türkçeleşmiş şekli ve karşılığıdır. Terim olarak oruç, niyet ederek tan yerinin ağarmaya başlamasından (imsak vaktinden) itibaren güneş batıncaya kadar yeme, içme ve cinsel ilişkiden uzak durmayı ifade eden bir ibadettir. Oruç ibadetinin farz kılındığı ay ise Ramadan olarak isimlendirilmekte ve bu kelime Kur'ân-ı Kerim'de sarih olarak sadece bir yerde ismen zikredilmektedir. Savm ve sıyâm lafızları ile türevleri ise Kur'ân-ı Kerîm'de on dört yerde, hadislerde ise çok sayıda geçmektedir. Kur'ân-ı Kerîm'de oruç ile ilgili hükümleri ihtiva eden ayetler: Oruçla ilgili hukukî hükümler, Müslümanlara oruç tutmanın farz olması, oruç tutma süresi, hasta ve yolcunun ruhsatı, fidye, ikinci şafağın başlangıcından gün batımına kadar olan oruç vaktinin belirlenmesi gibi hükümleri içermektedir. İslâm, orucun diğer semâvî olan ve olmayan dinlerdeki ibadet dışı boyutuna son vermesiyle birlikte ilk insan ve ilk peygamber olan Hz. Adem'den son peygamber Hz. Muhammed'e kadarki toplumlarda değişik amaçlarla oruç tutulduğu anlaşılmaktadır."
