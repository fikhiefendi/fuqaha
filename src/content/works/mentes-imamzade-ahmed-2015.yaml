abstract: "Yargılama Hukuku alanında mahkemeler tarafından davalılara gönderilen celpnameler hukukun işlerliği ve adaletin tesisi bakımından önemli bir yere sahiptir. Özellikle de, açılan davalarla bir ilgisi varmış gibi görünen ancak hakikatte duruşmalarda hazır bulunmalarının mahkemenin vereceği karara olumlu ya da olumsuz herhangi bir etkisinin olmayacağı üçüncü şahısların gereksiz yere mahkemelerde meşgul edilmemeleri dikkat edilmesi gereken bir konudur. Yapmış olduğumuz bu çalışma, Hanefi mezhebi kaynaklarına dayanılarak yazılmış olup mahkemelerde davacı ve davalı dışındaki üçüncü şahısların hangi durumlarda duruşmalara katılmaları gerektiği konusunu ele alan, İmamzâde Ahmed b. Muhammed b. İbrahim el-Eyyûbî'nin Vâcibu'l-Hıfz adlı risalesinin tahkik, tercüme ve değerlendirilmesini ihtiva etmektedir. Çalışmamız dört bölümden meydana gelmektedir. Birinci bölüm giriş, tezin konusu ve kapsamı, tezin amacı, araştırmada izlenen metot ve teknikler hakkındadır. İkinci bölümde müellif İmamzâde'nin hayatı, eserin adı ve müellife aidiyeti, nüshaların tanıtımı ve tahkikte izlenen metot, eserde atıf yapılan kaynak kitaplar ve kullanılan rumuzlar anlatılmıştır. Üçüncü bölümde eserin tahkikli metni yer almaktadır. Dördüncü bölümde metnin tercümesi yapılmıştır. Ardından, değerlendirme ve sonuç yer almaktadır."
