abstract: "İslam Hukuku üç ana bölümden oluşmaktadır: İbadat, Muamelat ve Ukubat. İslam Hukukunda muamelatın içinde münekahat başlığı altında incelenen Aile Hukuku, son dönemlerde muasır âlimler tarafından“Ahvalü'ş-Şahsiye”olarak müstakil bir şekilde ele alınmıştır. Tarih boyu aile önemini korumuş ve tüm insanlığın üzerinde hukuk ürettiği bir konu olmuştur. İnsanlığa dünya ve ahiret saadeti vadeden dinimizin temel kaynağı Kur'ân'da, Aile Hukukuyla alakalı yetmiş kusur ayet mevcuttur. Aile Hukuku hükümlerinin tek tek vahye dayanma oranı, diğer hukuk alanlarına oranla daha yüksektir. Hayrettin Karaman, Mustafa Çağrıcı, İbrahim Kâfi Dönmez ve Sadrettin Gümüş, tarafından telif edilen Kur'ân Yolu Türkçe Meal ve Tefsir, eserinde aile hukuku açısından ahkâm ayetlerinin değerlendirilmesi tezimizin konusunu oluşturmaktadır. Bu çalışmamızda Kuran Yolu müelliflerinin ayetleri yorumlama metotları, tahlil ve tercihleri, konuyla alakalı kanaatleri, yararlandıkları kaynaklar açısından inceledik. Komisyonun ahkâm ayetleriyle ilgili yorumları, hangi sebebe dayandığını ve konuyla alakalı tercihlerinin kaynaklarda, yerlerini tesbit etmeye çalıştık."
