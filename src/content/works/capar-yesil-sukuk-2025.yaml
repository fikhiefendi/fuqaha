abstract: "Bu tezde, çevresel sürdürülebilirlik ilkeleri ile İslami finans anlayışının kesişim noktasında yer alan yeşil sukuk kavramı teorik ve uygulamalı yönleriyle ele alınmıştır. Öncelikle yeşil sukuk tanımlanmış; geleneksel sukuk türlerinden farkları ve sürdürülebilir finans ile ilişkisi açıklanmıştır. Ardından Malezya, Endonezya ve İngiltere gibi ülkelerdeki uygulamalar incelenerek farklı kurumsal yapılar altında yeşil sukuk piyasalarının gelişimi karşılaştırmalı olarak değerlendirilmiştir. Türkiye bağlamında, yasal altyapı, düzenleyici kurumların rolleri, yatırımcı ilgisi ve sektör bazlı uygulama potansiyelleri analiz edilmiştir. SPK, TKBB ve ilgili kurumların yayımladığı belgeler temel alınmış; Emlak Katılım Bankası'nın gerçekleştirdiği yeşil sukuk ihracı örnek olay olarak ele alınmıştır. Ayrıca, 2053 Net Sıfır Emisyon hedefi ve Yeşil Mutabakat Eylem Planı doğrultusunda Türkiye'deki gelişim potansiyeli değerlendirilmiştir. Çalışma, ampirik veri yerine literatür taraması ve belge analizine dayanmaktadır. ESG uyumu, şer'i denetim, yatırımcı davranışları ve metodolojik standart eksiklikleri gibi alanlarda literatürdeki boşluklara dikkat çekilmiştir. Sonuç olarak, Türkiye'de yeşil sukuk piyasasının gelişimi için düzenleyici netlik, kurumsal iş birliği ve yatırımcı farkındalığı gerekliliği vurgulanmıştır."
