abstract: "En önemli finans mühendisliği ürünlerinden biri olarak tahvillere uluslararası ilgi ışığında, İslami finansal sukuk tasarlandı; kendilerini diğer tefecilik tahvillerinden ayıran bir yapıları vardı ve çeşitli projeleri finanse ettikleri için kuruldukları projeye göre de çeşitlilik gösteriyorlardı. Bu, meşruiyetlerini, rollerini ve uygulama sırasında olası şeri sorunları araştırmayı gerekli kılmıştır. Dolayısıyla şu soruda temsil edilebilecek bu araştırmanın amacı: İslami kurumlardaki yatırım tahvilleri İslam Şeriatının hükümlerine ne ölçüde uymaktadır? Bu araştırmanın önemi, sukuk ihracı, dolaşımı ve amortismanına ilişkin şeriat kararlarını nasıl vurguladığı; bankalarda ve İslami kuruluşlarda sukukun teminat altına alınma yolları netleştirilerek, her biri için verilen şeriat hükümleri bu araştırmaya dahil edilmiştir. Sukukun kalkınma ve finansmantaki rolü ve devlet projelerinin finansmanında, büyük ve küçük projelerin desteklenmesinde ve havalimanlarının inşası ve geliştirilmesindeki rolü; vakıf mülklerinin yeniden inşası, hizmet projelerinin finansmanı, işsizliğin ve atıl fonların ortadan kaldırılmasındaki rollerinin yanı sıra devletin genel bütçesinin finansmanındaki rolleri de açıklığa kavuşturulmuştur. Bu araştırma, doğrulama süreçlerinde yer alan hukuki sorunları netleştirmeyi ve çağdaş hukukçuların hükmünü ve bu konudaki anlaşmazlıklarını ayıklamayı amaçlamasıyla ayırt edilir. Örnek olarak, aina satışı ve kira sukukunun iafsı, sukukun her türlü şekliyle itibari değerinden geri kazanılmasının garantisi; kar garantisi, bazı sukuk türlerinde sözleşmenin yanlışlığı ve periyodik dağıtım miktarlarının faiz oranı göstergelerine bağlanmasına değinilmiştir. Fiili kârın beklenenden az olması ve ihraç yönetimi için teşvikin gerekli olduğu durumlarda sukuk yöneticisine sukuk sahiplerinin borç vermenin yanı sıra; acentenin veya yüklenicinin varlıkların kaybının sonuçlarına ilişkin garantiye sahip olduğu durumlarda; ihraççının spekülasyon sukuk ve diğerlerinin sermayesinden sıfır faizli kredi şeklinde borç alması gibi konular, İslami sukukun karşılaştığı zorluklar ve engeller tartışıldı. Bu çalışma, yürürlükte olan İslami sukukun şu anda teori ile pratik arasında, çağdaş hukukçular arasında kabul ile yasak arasında hukuki sorunlardan muzdarip olduğu; sukuku kabul görenleri ile yasaklayanlar arasında, her iki grup için de konuların çoğunda ayrıntılı kanıtları tartıştık,, ancak yasaklayanların kanıtları birçok konuda daha güçlü olarak tespit edildi. Bunun arkasındaki sebep, uygulama üzerine Şeriat olarak değerlendirilen hedeflerin hesaba katılmamasıydı; Bunun sebebi de sukukun faizli bir ekonomik ortamda ortaya çıkmasıdır ki bu, kârın faiz endeksi tarafından askıya alınması ve ihraççının sukuku itibari değerden geri kazanması garanti altına alındığında ortaya çıkar. Araştırmacı, en önemlileri şunlar olmak üzere bir dizi öneri önermiştir: İçtihat görüşlerini birleştirmek ve sukukun çıkarılmasını, dolaşımını ve amortismanını yöneten eksiksiz bir yasal standart belirlemek. Ayrıca, sukuk bültenlerinde bazı değişiklikler yapmak, şeriatla ilgili çelişkileri ortadan kaldırmak ve bu yayınları Şeriata sınırlarıyla daha uyumlu hale getirecek şekilde geliştirmek, araştırmacıların sukukun maruz kaldığı sorunlara güçlü şeriat çözümleri bulmalarına ihtiyaç duyulmaktadır."
