abstract: "Birmâvî, Hicri sekizinci asrın sonları ve dokuzuncu asrın başlarında yaşamış, fıkıh, usûl, hadis ve nahiv ilminde temayüz etmiş âlimlerden biridir. Kendisinden sonra gelen Alaaeddîn el-Merdâvî (ö.885) Şihâbuddîn el-Kastalânî (ö. 923), Zekeriyya el-Ensârî (ö. 926) Şihâbuddîn er-Remlî (ö.957) ve İbn Kâsım el-Abbâdî (ö. 992) gibi âlimler bilhassa fıkıh usulü ile ilgili görüş ve değerlendirmelerini naklettikleri görülmektedir. Birmâvî yazdığı usûl eseriyle öne çıkmaktadır. Araştırmamızda usûl alanında yetkin olan bir âlimin hayatını, ilmi kişiliğini ve mezhepteki konumuyla birlikte kıyas konusundaki görüşlerini ve değerlendirmelerini araştırma konusu yapmaya çalıştık. Birmâvî'nin kıyasa ilişkin görüşlerini ortaya koyarken kendisine has görüşleri başta olmak üzere diğer usul âlimleri ile ittifak ettiği ya da ihtilaf ettiği konuları, kıyas alanında gösterdiği örnekleri ve belirli konularda usul âlimlerini eleştirdiği konulara değindik."
