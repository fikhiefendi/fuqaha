abstract: "Delâlet kavramı, fıkıh usulünde olduğu gibi diğer usül ilimlerinde de en önemli kavramlar arasında yer alır. Dolayısıyla delâlet, başta mantık, vaz', sarf, nahiv, belâgat, fıkıh usulü olmak üzere İslâm kültüründeki aklî ve naklî ilimlerin müştereken kullandıkları kavramlardan bir tanesidir. Genel bir bakışla usul-i fıkıhtaki delâlet bahisleri metni anlamaya ve anlam güvenliğini sağlamaya yönelik anlam bilim çalışmalarıdır. Bu sebepledir ki usul-i fıkıh çalışmalarında, metin mana ilişkisi çok büyük bir yekün tutar ve meseleler delâlet sonucu ortaya çıkacak sahih manayı elde edebilmek için hassasiyetle tahlil edilir. Giriş, üç bölüm ve sonuçtan oluşan bu çalışmanın giriş kısmında konunun önemi, amacı, kapsamı, yöntemi ve kaynaklarına ilişkin açıklamalar yer almaktadır. \"Anlambilim ve delâletin anlambilim içindeki yeri\" başlığını taşıyan birinci bölümde, anlambilimin mahiyeti, kuruluşu ile Doğu ve Batı'da yapılan anlambilim çalışmalarına değinilmiş, ardından İslâmî ilimlerde delâlet ile Batı'nın henüz yeni tanıştığı anlambilim arasında mukayese yapılmış ve değerlendirmede bulunulmuştur. Daha sonra İslâmî ilimlerdeki \"Delâletin\" temel öğeleri tanıtılarak ikinci bölüme geçilmiştir. İkinci bölümde ise anlambilime dair materyallerin en fazla kullanıldığı ve usul-i fıkhın mevzu bahis meselede daha ziyade veri alışverişinde bulunduğu mantık, dil ve belağat gibi ilimlerde delâlet kavramı incelenmiştir. Son bölümde ise tezimizin ana gövdesini oluşturan ve Hanefîlerce taksim edilen, hükme varmada delâlet yolları ayrıntılarıyla incelenip her biri hakkında değerlendirmede bulunulmuştur. Anahtar Sözcükler: Hanefî fıkhı, delâlet, ibarenin delâleti, işaretin delâleti, nassın delâleti, iktizanın delâleti."
