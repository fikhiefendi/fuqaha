abstract: "Bu çalışmada 16. yüzyıl Osmanlı âlimlerinden Lütfullah Çelebi'nin Tercüme-i Risâle-i Fâdıhatu'l-Mülhidîn adlı eserinin mezhepler tarihi açısından tahlili ve transkripsiyonu konu edilmektedir. Araştırmada eserin ortaya konduğu döneme ve müellife dair elde edilen kısa bilgilerle birlikte müellifin eserde kullandığı kaynak ve yöntem ortaya konulmakta; aynı zamanda eserin muhtevası farklı açılardan ele alınmaktadır. Tezin birinci bölümünde müellifin hayatı, eserleri ve tezimize konu olan eseri incelenmektedir. İkinci bölümde risaleye konu olan mezheplerin müellif tarafından bakış açısına değinilmiş ve ilgili mezheplerin hak mezhep olmadıklarına dair fetvalara yer verilmiştir. Üçüncü bölümde müellifin tenkide tabi tuttuğu İsmailiyye, Dürziyye ve Nusayriyye mezheplerinin tarafımızdan detaylı incelemesi yapılmıştır. Dördüncü bölümde risalenin dil kurallarına uygun bir şekilde transkripsiyonu yapılmıştır. Araştırma neticesinde ise ulaşılan tespitler belirtilmiştir."
