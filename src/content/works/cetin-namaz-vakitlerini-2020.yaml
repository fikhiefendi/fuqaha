abstract: "İnsanın yaratılış sebebi ve yaratılış gayesi ibadettir. Bu ibadetlerden birisi de namazdır. Namaz, vakti içerisinde yerine getirilmesi gereken bir ibadettir. İbadetler içerisinde önemli bir yeri olan namaz Kur'an-ı Kerim'de farz kılınmış vakitli bir ibadet olarak nitelenmektedir. Günde beş kere kılınması farz olan namaz vakitlerine Kur'an-ı Kerim'de mücmel olarak değinilmiş, Hz. Peygamber'in söz ve fiilleriyle vakitlerin sınırları belirlenmiştir. İslam hukukçuları namaz vakitleri ile ilgili ayet ve hadislerden hareketle görüşler beyan etmişlerdir. Namazın beş vakit şeklinde farz kılındığı hususunda Şia hariç diğer mezhepler hem fikirdirler. İlgili ayetler ve Hz. Peygamber'in (s.a.v) söz ve uygulamalarından hareketle günlük farz kılınan namazların vakitlerini belirleme yoluna gidilmiştir. Namaz vakitlerinden sabah ve ikindi namazı vaktinin çıkış, öğle ve akşam namazının giriş vakti konusunda herhangi bir ihtilaf yoktur. Fakat sabah, ikindi ve yatsı namazının başlangıcı ile öğle, akşam ve yatsı namazının sonu hakkında ihtilaflar bulunmaktadır. Günümüzde Türkiye'de namaz vakitlerinin, Diyanet İşleri Başkanlığı, Süleymaniye Vakfı, Fazilet Neşriyat, Türkiye Takvimi ve Ehli Beyt Vakfı tarafından farklı hesaplandığı görülmüştür. Bunlardan Diyanet İşleri Başkanlığı, klasik fukahanın görüşleri doğrultusunda hareket ederek ve modern teknolojik aletleri kullanarak alanında uzman kişilerle hem aletsel hem de denek gözlemcilerle farklı zaman ve mekanlarda gözlemler yapmak suretiyle bu konuya açıklık getirmiştir. Süleymaniye Vakfı ise ayet ve hadisleri Diyanet İşleri Başkanlığından farklı yorumlayarak ve bazı gözlemler yaparak özellikle sabah namazı vaktinin girişi, akşam namazı vaktinin çıkışı, yatsı namazı vaktinin girişi ve çıkışı hususunda yanlışlıklar yapıldığını dile getirerek farklı görüşler öne sürmüştür. Fazilet Neşriyat ve Türkiye Takvimi ise Diyanet İşleri Başkanlığı'ndan farklı olarak vakitlere sadece temkin adı altında ihtiyat payı eklemiştir. Ehl-i Beyt Vakfı'ında ise günlük farz olan namazlar sabah namazı, öğle ile ikindi, akşam ile yatsı namazı birleştirilmek suretiyle üç vakite indirilmiştir. Ama namaz vakitleri saati de diyanetin ilan ettiği vakitle aynıdır."
