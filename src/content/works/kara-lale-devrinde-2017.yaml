abstract: "Osmanlı Devleti'nin kuruluş yıllarında dini problemlerin çözümü için dönemin alimlerinden görüş alınırdı. Resmi olarak fetva verme vazifesi her ne kadar II. Murad zamanında Molla Fenari'ye verilmiş olsa da bu dönemde bağımsız bir şeyhülislamlıktan bahsedilemez. Genellikle kadıaskerler veya mevleviyet kadıları vazifelerinin yanında fetva verme işini yürütmüşlerdir. Oysa Fatih Sultan Mehmed dönemiyle beraber şeyhülislam ilmiye sınıfının başı kabul edilmiş ve şeyhülislamlık bağımsız bir birim haline dönüşmüştür. Şeyhülislamlık müessesi Zenbilli Ali Efendi, İbn-i Kemal ve Ebussuud Efendi dönemlerinde ise en prestijli olduğu yılları yaşamıştır. Osmanlı Devleti'nin diğer kurumlarında olduğu gibi bir süre sonra şeyhülislamlık kurumunda da bozulmalar yaşanmıştır. Bozulmanın belki de görünen önemli sebepleri şeyhülislamların önceki dönemlere kıyasla iyi yetişmiyor olmaları ve siyasi olaylara daha çok müdahil olmalarıydı. Bu yüzden şeyhülislamlar görevleri başında kendilerinden öncekilere nazaran daha kısa süre kalmaya başlamışlardır. Şeyhülislamların azledilme durumlarının çok sık yaşandığı XVIII. yüzyılda, Yenişehirli Abdullah Efendi'nin on iki yıl boyunca görevde kalması meşihat tarihi açısından önemli bir hadisedir. Bu durumun belki de en önemli sebebi Yenişehirli Abdullah Efendi'nin on iki yıl boyunca Padişah III. Ahmed ve veziriazam Damat İbrahim Paşa ile kurduğu ilişki olmalıdır. Yenişehirli Abdullah Efendi'nin, bu dönemde devletin meşru olarak aldığı kararlarda önemli derecede etkili olmasının devlet adamlarıyla kurduğu münasebetin etkisi vardır. Elbette ki Yenişehirli Abdullah Efendi'nin bulunduğu dönemin siyasetine çok fazla müdahil olmaması da görev süresinin uzamasına katkısı olmuştur. Yenişehirli, gerek devlet adamlarıyla kurduğu yakın münasebet gerekse alim kişiliği ile ilmi açıdan yazdığı eserlerle önemli bir şahsiyet olarak karşımıza çıkmaktadır."
