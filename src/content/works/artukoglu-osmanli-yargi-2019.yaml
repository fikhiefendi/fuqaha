abstract: "Hak arama hürriyetinin en önemli gereklerinden birisi, savunma hakkıdır. Yargılama sırasında savunma hakkının tanınması yargılamanın adil bir şekilde gerçekleşmesini sağlar. Davanın tarafları kendini savunma hakkına sahiptir. Kişi kendini savunamayacağını düşünüyorsa ya da zorunlu olarak kişiyi bir başkasının savunması gerekiyorsa vekil tayin edecektir. Kişinin kendi yerine bir başkasını tayin etmesi vekalet olarak adlandırılır. Tayin ettiği kişi de vekildir. Antik Yunan ve Roma'dan İslam devletlerine ve dolayısıyla İslam hukukunun ilkeleriyle hukuk sisteminin şekil aldığı Osmanlı Devleti'ne kadar vekilliğin ve vekaletin farklı şekillerde gerçekleştiği görülmüştür. Tezin amacı; İslam hukukunda yeri olan, fıkıh kitaplarında anlatılan ve Peygamber Efendimiz (s.a.v.) zamanına kadar uzanan“vekillik”,“vekalet”kavramlarının İslam hukukundaki yansımalarını anlatıp, sonrasında bir İslam devleti olan Osmanlı'daki gelişim sürecini incelemektir. Bu amaçla, Osmanlı'nın adli teşkilatı içerisinde, Osmanlı Klasik döneminde ve Tanzimat döneminde vekilliğin nasıl ele alındığı, Osmanlı'nın Klasik döneminde vekilliğin, İslam hukukunun çizgisinde ilerlediği, Tanzimat döneminde ise çıkartılan nizamnameler ışığında vekilliğin gelişim ve kurumsallaşma süreci anlatılmaya çalışılmıştır."
