abstract: "Kur'an'ın maksatlarını ifade eden Makâsıdu'l-Kur'an hakkında inceleme yapmak bu çalışmanın temel konusunu teşkil etmektedir. Bu çalışma Kur'an'ın Makâsıdu'ş-Şerî'a dışında da birtakım maksatlarının var olduğu ön kabulüne dayanmaktadır. Literatürde yapılan inceleme sonucunda makâsıd nazariyesine dair yapılan çalışmalarda makâsıdın teolojik, ontolojik ve epistemolojik temellerinin kapsamlı bir şekilde ele alınmadığı görülmüştür. Çoğu araştırmacının Makâsıdu'l-Kur'an'ı Makâsıdu'ş-Şerî'a'nın aynısı ya da bir parçası olarak gördüğü, bu sebeple Makâsıdu'l-Kur'an'ın metodolojik alt yapısının oluşmadığı, bu alt yapı eksikliğinin Makâsıdu'l-Kur'an'ın tasniflerine de yansıdığı anlaşılmıştır. Yine tefsir külliyatında makâsıdî tefsire dair dikkate değer bir yönelmenin olmadığı görülmüş ve bunun tefsir sahasında bir eksiklik olduğu düşünülmüştür. Bu hususları incelemek ve bunlara çözüm önerileri sunmak için bu konu çalışılmıştır. Bu tezde yoğun bir şekilde disiplinler arası çalışma yapılmış, tasvir, analiz ve sentez yöntemleri kullanılmıştır. Çalışmanın birinci bölümünde makâsıdın kavramsal analizi yapılmış, makâsıd nazariyesinin kavramsal ve kuramsal arka planına değinilmiştir. İkinci bölümde de Kur'an'ı anlamada temel ilkeler üzerinde durulmuş; hikmet, maslahat ve mefsedet kavramları bağlamında Kur'an ve makâsıd nazariyesi arasındaki ilişki ele alınmıştır. Üçüncü bölümde ise makâsıdı keşfetmede bilinmesinin gerekli olduğunu düşündüğümüz, beyân, burhân ve irfân bilgi sistemleriyle ilahi emir, Kur'an metninin beyânı ve tümevarım yöntemleri üzerinde durulmuş, klasik ve modern dönemlerde yapılan Makâsıdu'l-Kur'an tasniflerine değinilmiş ve konuya dair genel bir değerlendirmede bulunulmuştur. Çalışmanın neticesinde Kur'an'ın küllî ve âmm birtakım maksatlarının olduğu, Makâsıdu'l-Kur'an ile Makâsıdu'ş-Şerî'a'nın bire bir aynı olmadığı, aralarında kaynak ve muhteva açısından birtakım farklılıkların bulunduğu, Makâsıdu'l-Kur'an'ın küllî ve âmm maksatlarının insanlığın artan problemlerine çözüm olabileceği ve Makâsıdu'l-Kur'an'a dair yapılan çalışmaların daha başlangıç aşamasında olduğu tespitinde bulunulmuştur"
