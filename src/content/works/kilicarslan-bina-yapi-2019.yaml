abstract: "6098 Sayılı Türk Borçlar Kanunu'nda düzenlenen 69.madde, kusursuz sorumluluk çeşitlerinden biri olan, bina ve yapı eseri sahiplerinin sorumluluğunu içermektedir. Bu düzenlemeyle bina ve yapı eseri sahibi ile intifa ve oturma hakkı sahiplerine kusursuz sorumluluk yüklenmektedir. Malik yapılıştaki bozukluktan tek başına sorumlu iken, intifa ve oturma hakkı sahipleri bakım eksikliğinde malik ile birlikte müteselsilen sorumludurlar. Bu kişiler kurtuluş kanıtından yararlanamazlar. Bu sebeple söz konusu sorumluluk çeşidi, ağırlaştırılmış olağan sebep sorumluluğudur. Bu kişilerin zarar neticesindeki sorumluluktan kurtulabilmeleri ancak sebep ile sonuç arasındaki illiyet bağının kesilmiş olması şartıdır. Ayrıca, bina veya yapı eserinden kaynaklı bir zarar tehlikesinin önlenebilmesi için; malik, intifa ve oturma hakkı sahibi ile menfaati bulunan üçüncü kişiler de gerekli tedbirlerin alınmasını talep edebilirler."
