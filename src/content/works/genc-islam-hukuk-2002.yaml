abstract: "ÖZET Genç, İskender, İslam Hukuk Usulünde Mefhûm-ı muhalefet Kavramı ve Hukuki Değeri, Yüksek Lisans Tezi, Danışman, Doç. Dr. Şamil Dağcı, 96 s.“Hüküm itibariyle, zikredilmeyenin; zikredilene muhalif olması. ”şeklinde tanımlayabileceğimiz mefhûm-ı muhalefete Hanefîler, tahsîsu'ş-şey-i bi'z-zikr; Şafıîler ve Hanbeliler, mefhûm-ı muhalefet; Malikîler'de dehlu'l-hitâb isimlerini vermişlerdir. Şafiî'ye göre mefhûm-ı muhalefet, sıfat, zaman, mekan ve adet olmak üzere dört tanedir. Bu sayıyı on üçe kadar çıkartan usûlcüler de vardır. Aslında gerçek olan Kazvînî'nin dediği gibi,“Şartlarını taşıyarak takyid ve tahsis edilen mantûk türü miktarınca, mefhûm-ı muhalefet vardır. ”Hanefi usulenlerine göre, mefhûm-ı muhalefet sadece insanların konuşmalarında ve eserlerinde delilken, diğer mezheplere göre, hem insanların sözlerinde hem de nasslar'ın tamamında delildir. Mefhûm-ı muhalefeti delil olarak kabul eden usulenlerin çoğunluğuna göre, mefhûm-ı muhalefet, meşruiyetini ditin kendi yapısından alan, zannî bir delildir. Yine bunlara göre, aynı sıfata ve özelliğe sahip cinsler için, mefhûm-ı muhalefetin genel geçerliliği vardır. Hanefi usulcülerine göre, mefhûm-ı muhalefetle Sâri' in kastını tespit imkanı yoktur. Bunu delil kabul edenlere göre, İslam Hukukçusunun görevi, Şâri'in kastını bulabilmek için bütün gücüyle çalışmaktır. Mefhûm-ı muhalefet ise böyle bir çalışmadır. Bu çalışmayla da Şâri'in kastı bulunabilir. Mefhûm-ı muhalefetin delilliği konusunda usulcülerin üç ayrı görüşü vardır. İlk olarak, usulcülerin tamamına yakınına göre, mefhum-ı lakap delil değildir. İkinci olarak, insanların sözlerinde ve eserlerindeki mefhûm-ı muhalefet, bütün mezheplerce delildir. Son olarak ise, nasslardaki mefhûm-ı muhalefet, Mâliki, Şafiî, ve Hanbelîler'in büyük çoğunluğuna göre delildir. Hanefilere göre ise delil değildir. Usulcülerin bir çok konuda olduğu gibi mefhûm-ı muhalefette de farklı düşüncede olması, doğal olarak ibadetlere ve hukuka da farklılık olarak yansımıştır. Bu farklı yaklaşımların etkilerini, ibadetlerden, şahıslar, aile, ticaret ve ceza hukukundan verdiğimiz örneklerle inceledik."
