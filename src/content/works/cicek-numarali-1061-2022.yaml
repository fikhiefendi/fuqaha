abstract: "H.1061-1064/M.1651-1654 tarihli şer'iyye sicil defterinin transkripsiyonunu yapmak ve defterde bulunan belgelerin konularına göre tasnifi ve değerlendirmesini yapmak sûretiyle Amasya'nın idari, sosyo-kültürel ve ekonomik yapısı araştırmacılara sunulmaya çalışılmıştır. Bu çalışma üç bölümden oluşmaktadır. İlk bölümde, 10 No'lu Şer'iyye Sicili'nin tanıtımı ve değerlendirilmesine yer verilmiştir. Defterdeki belgeler konularına göre iki başlık altında değerlendirilmiştir. Bu başlıklardan biri;merkezden eyalete gelen yazılar, diğeri ise; kadılar tarafından tutulan kayıtlar olarak sınıflandırılmıştır. Merkezden eyalete gelen yazılar; ferman, berat, buyuruldu, temessük ve tezkire alt başlıklarında incelenmiş olup belge türleri hakkında bilgi verilerek, belgelerden örneklerle yorumlamalar yapılmıştır.Kadılar tarafından tutulan kayıtlar bölümünde bulunan belgeler, konularına göre tasnif edilip, sicilde yer alan örneklerle yorumlanmaya çalışılmıştır. Osmanlı Devleti'nde yargı sistemi, mahkeme ve mahkeme görevlileri, şer'iye sicillerinin tanımı ve kapsamı hakkında açıklayıcı bilgiler verilmeye çalışılmış; günümüzde şer‛iye sicillerinin durumu ve bu konuda yapılan çalışmalara değinilmiştir.İkinci bölümde,transkripsiyonu yapılan 10 No'lu Şer'iyye Sicili'nden istifade edilerek çıkarılan özetler yer almaktadır.Üçüncü bölümde ise,“10 Numaralı Amasya Şer'iye Sicili Defteri”nin transkripsiyonlu çevirisi okuyucuya sunulmuştur."
