abstract: "Hicrî ilk üç asır, Hz. Peygamber'den gelen rivâyetlerin yanında sahabe ve tabiin neslinden aktarılagelen rivâyetlerin de şifâhî ve kitâbî olarak nakledildiği, cem ve tedvîn edildiği bir dönemdir. Gerek şifâhî olarak gerekse kitâbî olarak sürdürülen rivâyet faaliyetinde bu rivâyeti aktaran râvi merkezî bir konuma sahiptir. Râvinin ilmî, itikâdî ve ahlâkî vasıfları rivâyetin sıhhatini ve güvenilirliğini belirlemede bir kriter olarak kabul edilmektedir.Bu tez konusu çerçevesinde ?ilk hicrî üç asırda rivâyetin naklinde fakih bir râvinin rolü nedir? sorusu cevaplandırılmaya çalışılmıştır. Belli rivâyetlerin kabulünde râvinin fakih olmasının bir şart olarak ileri sürülebilip sürülemeyeceği, fakih râvinin ön plana çıktığı mana ile rivâyet, tercih sebepleri gibi konular yanında özellikle muhaddislerin fakih râvi ile ilgili görüşleri ele alınmaya çalışılmıştır. Konunun hem muhaddisleri hem de fakihleri ilgilendiren yönleri olduğu göz önüne alınarak her iki tarafın da görüşlerine yer verilmeye gayret edilmiştir."
