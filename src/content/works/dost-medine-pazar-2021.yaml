abstract: "İktisat, her dönem olduğu gibi Hz. Muhammed (sav) döneminde yaşayan kimseler içinde önemli bir alandı. Bu durumu gören ve tecrübeli bir tüccar olan Hz. Peygamber, Medine'ye hicret ettikten sonra o günün iktisadi düzenine karşı, Medine Pazarı için getirmiş olduğu kurallar İslam ticaret ahlakının temelini teşkil etmektedir. Asırlar boyu kurulan her İslam Devletinde bu kurallar geçerli olmasına karşın bazı dönemlerde bu prensipler ihmal edilmiştir. Medine Pazar kuralları Osmanlı Devletinde hisbe teşkilatı vasıtasıyla denetlenmektedir. Bu araştırmada hisbe teşkilatının kontrol ettiği hususların, Medine Pazar prensipleriyle ne kadar uyumlu olduğunun karşılaştırmasını yaptık. Özellikle faiz hakkında para vakıfları ve narh konusunda çeşitli görüş ve değerlendirmelere yer verdik. Kadı sicillerinden misaller vererek konuyu o günkü tarihi atmosferini de dikkate alarak değerlendirmeye gayret gösterdik. Yapmış olduğumuz çalışmadaki maksadımız; ulaştığımız sonuçların öncülüğünde, günümüz problemlerine ışık tutmak ve gelecek planlamamızı daha sağlam bir zemine oturtmaktır. Bu araştırma da konu ile ilgili kadı sicillerinden yararlanılmış olmakla birlikte, literatür taraması da yapılmıştır."
