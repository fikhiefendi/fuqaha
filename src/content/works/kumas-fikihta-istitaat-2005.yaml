abstract: "02. Özet“Fıkıhta İstitâat Kavramı ve Tezahürleri”isimli tezimiz“Sonuç”bölümü hariç üç bölümden oluşmaktadır. Birinci bölümde istitâat kavramının fıkıh ve kelâm ilimlerindeki mahiyeti ele alınarak, istitâat kavramı ile yakın ilişkili terimler, istitâatin çeşitleri ve Türk Pozitif Hukukunda istitâat kavramı yerine kullanılan terimler açıklandı. İkinci bölümde istitâatin zedelenmesi veya tümden kalkması halleri ele alındı. Üçüncü bölümde ise istitâatin fürûu fıkıhta hangi şekiller altında ele alındığı tespit edilmeye çalışıldı. Sonuç olarak istitâat, kişilerin mükellef olmasına dayanak teşkil eden önemli bir kavram olduğu söylenebilir. Bu kavram dikkate alınarak kişilerin mükellef olma durumları tespit edilmektedir. Bunun sonucunda da kişilerin mükellef veya muaf tutulup tutulmayacakları tayin edilmeye çalışılmaktadır."
