abstract: "İslamda ferâiz ilmi büyük önemi haizdir. Çünkü ölen kişinin malının adaletli bir şekilde taksim edilmesi hem mûrisin hem de varîslerin arzusudur. İslam miras hukukunda terikeden hangi vârisin ne kadar pay alacağı Kitab, sünnet ve icmâ' ile belirlenmiştir. Büyük âlimler müstakil miras hukuku ile ilgili eserler vermişlerdir. İslâm miras hukuku ferâiz adıyla medreselerde okutulan dersler arasında yerini almıştır. Çalışmanın giriş kısmında araştırmanın konusu, amacı ve araştırmanın yöntemi ele alınmıştır. Birinci bölümde öncelikle Halife Yusuf'un hayatı ve esereleri üzerinde durulmuş ve müellifin eserlerinin içeriğine kısaca değinilmiştir. Daha sonra medreselerin tarihçesi, medreselerde genel olarak okutulan dersler ve ferâiz kitapları ele alınmıştır. Buna el olarak medreselerde okutulan ferâiz eserleri üzerinde yapılan çalışmalar ele alınmıştır. İkinci bölümde Halife Yusuf'un Kitâbu'l-Ferâid Min Dureri'l-Ğaraid isimli eseri ele alınmıştır. Eser medreselerde okutulan diğer eserler ile kıyaslanmış, bu eserlerle benzerlikleri farklılıkları ele alınmıştır. Bu eserdeki bütün konular tek tek ele alınıp bölüm başlıkları konulup, ferâiz melelerindeki örneklerin tahlil ve çözümlemeleri tabloyla gösterilmiştir."
