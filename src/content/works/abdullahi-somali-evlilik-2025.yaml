abstract: "يتناول هذا البحث موضوعًا يتعلق بالقضايا المعاصرة الخاصة بالأحوال الشخصية في الصومال من منظور فقهي، مع التركيز على تحليل الأنظمة القانونية السائدة في البلاد مقارنة بالشريعة الإسلامية. كما يشير البحث إلى الوضع الاجتماعي والتاريخي في الصومال، مستعرضًا تأثيرات الحروب الاستعمارية وما بعدها على الحياة الزوجية والعلاقات الأسرية. ويتطرق البحث إلى عدة محاور، بما في ذلك: كيفية المقارنة بين أحكام الزواج والطلاق في القانون الصومالي وقانون ولاية بونتلاند، ومدى توافق هذه الأحكام مع الشريعة الإسلامية. وأيضًا تم طرح الدراسة عن الزواج ومقدماته في الصومال، مع التركيز على انتشار الزيجات الفاسدة وسبل الوقاية منها بناءً على آراء علماء الصومال. وتداعيات التعصب القبلي على الحياة الزوجية وارتفاع معدلات الطلاق، وتحليل هذه الظاهرة من خلال فتاوى وآراء الفقهاء. كما يستهدف البحث تقديم رؤية حول أهمية العودة إلى الشريعة الإسلامية في حل القضايا المعاصرة المتعلقة بالأحوال الشخصية، وأن الحلول الفعالة تكمن في تطبيقها في المجتمع. تهدف هذه الرسالة إلى إبراز تأثير النظام الجمهوري على التشريعات المستمدة من الاستعمار، وتسليط الضوء على أن العودة إلى الشريعة الإسلامية في وضع الأحكام والقوانين كانت الخيار الأنسب. فالدين الإسلامي هو دين شامل وصالح لكل زمان ومكان، وقادر على التعامل مع جميع القضايا المعاصرة. تركز هذه الدراسة على استكشاف دور القانون العرفي الصومالي المعروف بـ“الحير”في المجتمع الصومالي، من حيث نطاق تطبيقه، ومستوى نفوذه بين أفراد المجتمع. كما تتناول الدراسة مدى توافق أحكام“الحير”مع أحكام الشريعة الإسلامية، لا سيما في القضايا المتعلقة بالأحوال الشخصية، مع تحليل الجوانب التي قد تتعارض فيها بعض تطبيقاته مع المبادئ الشرعية. ومن أهم مصادر الدراسة : كتب المذهب الشافعي في الدرجة الأولى لكونه المذهب المعتمد لدى الشعب الصومالي، ومن هذه الكتب الشافعية كتاب منهاج الطالبين للنووي، وكتاب روضة الطالبين وعمدة المفتين للنووي، أيضا كتاب تحفة المحتاج في شرح المنهاج لابن حجر الهيثمي وهناك مصادر أخرى : قانون الأحوال الشخصية في الصومال الذي تم إصداره 1975 باللغة العربية قانون الأحوال الشخصية في الصومال باللغة الصومالية كتاب الأحوال الشخصية في الصومال ما قبل الاستعمار للكاتب أحمد علي برالي وكذا من المصادر أقوال الفقهاء والعلماء والشيوخ المحلية مراعاة لتوثيق آرائهم عن هذه المواضيع ."
