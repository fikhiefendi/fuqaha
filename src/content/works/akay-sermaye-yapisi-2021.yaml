abstract: "Sermaye yapısı kararları firmaların finansal durumlarını koruması, sağlamlaştırması ve faaliyetlerini etkin bir şekilde sürdürebilmesi açısından önem arz etmektedir. Firmaların sermaye yapılarını ne kadar borç ne kadar özsermaye ile ile karşılayacağı kararı firma değeri ve sermaye maliyeti üzerinde önemli etkiye sahiptir. Bu kapsamda Katılım 30 Endeksi'nde faaliyet gösteren ve endekste yer alabilmeleri için borçlanma düzeylerinin belirli seviyede tutmaları gereken 17 reel sektör firması için sermaye yapısı belirleyicilerinin 2011-2020 döneminde panel veri analizi ile tespit edilmesi amaçlanmıştır. Çalışmada finansal kaldıraç bağımsız değişken, borç dışı vergi kalkanı, büyüklük, faaliyet kaldıracı, likidite oranı, aktif karlılık ve satışlardaki dalgalanma ise bağımsız değişkenler olarak analize dahil edilmiştir. Analiz sonucunda borç dışı vergi kalkanı ve satışlardaki dalgalanma ile finansal kaldıraç arasında istatistiksel olarak anlamlı bir ilişki tespit edilememiştir. Büyüklük ve faaliyet kaldıracı ile finansal kaldıraç arasında istatistiksel olarak anlamlı ve pozitif ilişki, likidite ve aktif karlılık değişkenleri ile finansal kaldıraç arasında ise istatistiksel olarak anlamlı ve negatif ilişki tespit edilmiştir. Bu kapsamda Katılım 30 Endeksi'nde işlem gören firmaların temsil, işaret etkisi ve finansal hiyerarşi teorilerini dikkate alarak sermaye yapısı kararlarını aldıkları söylenebilmektedir."
