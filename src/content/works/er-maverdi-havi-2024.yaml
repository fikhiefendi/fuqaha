abstract: "Bu çalışmada, Basra doğumlu Şafii fakihi Mâverdî'nin telif ettiği ve İslam hukuku alanında önemli kaynaklar arasında yer alan el-Hâvî'l-kebîr'in ibadet bölümünde Ebû Hanîfe'ye nispet edilen görüşlerin tahkik edilmesi amaçlanmıştır. Eser mukayeseli İslam hukuku alanında önemli bir yere sahiptir. Mukayeseli fıkıh üzerine telif edilen eserlerde diğer mezheplere ait muhalif görüşler müellif tarafında yer yer mevzubahis mezhebin benimsediği fetvaya veya hükme uygun olmayan bir şekilde aktarılır. Bu tür eserlerde bir meseleye ait mezhep görüşünün tam olarak yansıtılmaması farklı faktörlere bağlı olduğundan dolayı bu durum, bizi bir örnek eser üzerinden tahkik faaliyetine sevk etmiştir. Çalışma giriş ve sonuç kısmına ek olarak, üç ana bölümden oluşmaktadır. Çalışmanın giriş kısmında araştırmanın konusu, amacı, çalışmada kullanılan temel kaynaklar ve çalışma boyunca tatbik edilen yöntemden bahsedilmiştir. Çalışmanın birinci bölümünde, öncelikle, Mâverdî'nin hayatı, kendisinden ilim aldığı ileri gelen hocaları, öğrencileri, kaleme aldığı eserleri, şahsiyeti, genel olarak fıkıh metodu ve görüşlerinden örnekler incelenmiş, ardından çalışmamıza konu olan eseri tanıtılmıştır. İkinci bölümde, eserin ibadet bölümleri ile sınırlı olmak üzere el-Hâvî'de Ebû Hanîfe'ye nispet edilen görüşler incelemeye tabi tutulmuş, Hanefî mezhebi kaynaklarına müracaat edilerek bu bilgilerin doğruluğu tespit edilmeye çalışılmıştır. Üçüncü bölümde ise incelenen meseleler kapsamında Hanefî mezhebinin tercih edilen görüşüyle bağdaşmayan nakiller analiz edilmiştir. Sonuç bölümünde çalışmada ulaşılan sonuçlar özetlenmiştir."
