abstract: "Bir ülkenin güçlü olabilmesi, tam bağımsız kararlar alabilmesi, sosyo-kültürel açıdan yüksek seviye yakalayabilmesi ve ekonomik yönden gelişmiş ülke düzeyine gelebilmesi için gerekli olan en önemli unsurlardan biri de ticaret hacmidir. Ülkenin ticari yönden gelişim göstermesi ve ticari potansiyelini gerçekleştirebilmesi için ise finans sisteminin iyi ve yeterli olması gerekir. Bu amaçla kurulmuş olan bankaların ülke ekonomisine sağladığı yararlar veya zararlar çok büyük ölçüde olabilmektedir. Nitekim 2001 ve 2002 krizinde batan bankaların faturası ülkemiz için büyük olmuş, insanlarımız ve ticari şirketlerimiz çok büyük sıkıntılara maruz kalmıştır.Bankaların güçlü bilançoya sahip ve güvenilir olması, ülkeye olan yabancı yatırımları ve sıcak parayı da beraberinde getirmektedir. Ayrıca ticaretini büyük ölçüde bankalardan aldığı kredilerle sağlayan birçok şirket için de bu durum önemlidir. Zira bankalar zor durumda kalması halinde, vermiş olduğu kredileri geri çağırabilmekte ve bu durumda birçok şirket iflas edebilmektedir. Bu nedenle bankaların kar edebilmesi, ülke için son derece önemlidir. Kar edebilmenin en önemli nedenlerinden biri de doğru yere şube açmaktır.Ülkemizde faaliyet gösteren Katılım Bankacılığı, Mevduat Bankacılığı?na alternatif ve ikame olarak kurulmuştur. Faiz hassasiyeti olan ve faiz sistemine karşı olan kesimlerin yararlanabileceği bir sistemdir. Ayrıca birikimlerini faiz hassasiyetinden ötürü bankalara yatırmayan, yastık altında bırakarak ülkenin finansal anlamda ileri gitmesine katkıda bulunamayan kesim için de, işleyişini kar ve zarara katılma hesapları açarak kar payı esasına dayanarak yapan Katılım Bankaları iyi bir alternatif olmaktadır. Para verirken; para mukabilindeki mal veya hizmeti satıcı kişiden kendisi alarak, parayı sadece satıcıya ödeyerek, bu mal veya hizmeti müşterisine kendisi vadeli olarak satar. Para alırken ise; kar ve zarara ortaklık esasına dayanarak aldığı mevduatlarla birlikte kendi sermayesinin de içinde olduğu büyük havuzlar oluşturup, yaptığı ticari faaliyetler neticesinde bu havuzların elde ettiği karı, hissesi oranında hak ettiği miktarca mudilerine ödeyerek kar payı dağıtmış olur. Kar payı dağıtırken, mudilerin hissesine düşen payın küçük bir yüzdesini kendisi alır, kalanı mudilerine öder. Aynı şekilde Katılım Bankaları?nın da güçlü bir bilançoya sahip olması, güven aşılaması ve kar elde etmesi, faaliyetlerine devam edebilmesi için gayet önemlidir. Tabi kar edebilmesi ve zarar etmemesi için, fizibilite çalışmalarını iyi yaparak, doğru yerde şube açmış olması gerekir. 2001 yılında batan İhlas Finans Kurumu, Katılım Bankaları?nın prestijini sarsmasının yanında, duyulan güvenin yok olmasını da beraberinde getirmiştir. Katılım Bankası Şubesi açmak için uygun olan ilçelerin objektif olarak belirlenmesi önemli bir husustur. Bu çalışmada, Katılım Bankası Şubesi açma noktasında uygun olan ilçeleri belirlemek amacıyla çok kriterli karar verme yöntemlerinden Analitik Hiyerarşi Proses Yöntemi kullanılmıştır. Hem objektif hem de sübjektif değerlendirme kriterlerini dikkate alması, değerlendirmelerin tutarlılığını kontrol etmesi, çok sayıda kritere göre alternatiflerin önceliklerini belirlemesi nedeniyle bu yöntem tercih edilmiştir. Uygulama aşamasında, İstanbul Anadolu Yakası?nda yer alan 14 ilçe alternatifi arasından, belirlenen kriterlere göre Katılım Bankası Şubesi için en uygun ilçeyi belirleyerek karar vericiye yardımcı olunmaya çalışılmıştır."
