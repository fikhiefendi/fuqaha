abstract: "Bu çalışma, TR33 Bölgesi'nde faaliyet gösteren KOBİ'lerin katılım bankacılığını tercih etme düzeylerini ve bu tercihi belirleyen unsurları ortaya koymayı amaçlamaktadır. Araştırmanın evrenini Afyonkarahisar, Kütahya, Manisa ve Uşak illerinde KOSGEB kriterlerine göre KOBİ niteliği taşıyan işletmeler oluşturmakta; örneklem, bölgedeki işletme yöneticilerinden toplanan anket verilerine dayanmaktadır. Nicel araştırma yaklaşımı benimsenmiş ve veri toplama aracı olarak yapılandırılmış ölçek kullanılmıştır. Ölçeğin güvenilirliği Cronbach Alfa katsayısı ile değerlendirilmiş, verilerin faktör analizine uygunluğunu sınamak üzere Kaiser–Meyer–Olkin KMO ve Bartlett testleri uygulanmıştır. Açıklayıcı Faktör Analizi (AFA) ve Varimax döndürme sonucunda katılım bankacılığı tercihini açıklayan boyutlar belirlenmiştir. Değişkenler arası ilişkiler Pearson korelasyon analizi ile incelenmiştir. Katılım bankacılığı tercihini etkileyen temel unsurlar ise regresyon analizi üzerinden test edilmiştir. Ayrıca işletme ve yönetici özelliklerine göre farklılaşmalar bağımsız örneklem t-testi ve tek yönlü ANOVA ile değerlendirilmiştir. Bulgular, finansal getiri beklentisi ile kredi tahsis süreçlerinde hız ve erişim kolaylığının KOBİ'lerin katılım bankacılığı tercihinde en güçlü belirleyiciler olduğunu göstermektedir. İslami ve dini güven/uyum boyutu anlamlı olmakla birlikte, tek başına tercih davranışını açıklamada yeterli değildir. İslami ve dini güven/uyum boyutunun, finansal açıdan rekabetçi koşullar sağlandığında etkisi güçlenmektedir. Sonuç olarak TR33 Bölgesi'ndeki KOBİ'lerin katılım bankacılığı tercihinde belirleyici olan temel unsur rasyonel finansal beklentilerdir. Bulgular, işletmelerin ağırlıklı olarak finansal getiri, maliyet avantajı ile kredi tahsis sürecindeki hız ve kolaylığa odaklandığını göstermektedir. İslami ve değer temelli gerekçeler ise tek başına tercih davranışını açıklamakta yetersiz olup ancak finansal açıdan avantajlı koşullar sağlandığında etkisi görünür hâle gelmektedir. Bu çerçevede çalışma, katılım bankacılığının sürdürülebilir bir gelişim gösterebilmesi için finansal rekabet gücünü artıran, tahsis süreçlerini sadeleştiren ve aynı zamanda sektörün felsefesine ve ülkenin tarihsel birikimine uygun özgün bir yapı oluşturması gerektiğine işaret etmektedir."
