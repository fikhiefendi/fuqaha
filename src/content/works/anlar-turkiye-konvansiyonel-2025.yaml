abstract: "Bu çalışmanın amacı, Fourier Toda Yamamoto nedensellik testini kullanarak Türkiye'de geleneksel ve katılım bankacılığı endeksleri ile temel ekonomik göstergeler arasındaki etkileşimleri analiz etmektir. Bu çalışma, Fourier Toda Yamamoto nedensellik testini kullanarak Türkiye'de geleneksel bankacılık ve katılım bankacılığının kârlılığını analiz etmektedir. Bulgular, katılım bankacılığı endeksi ile cari açık, enflasyon ve ekonomik büyüme değişkenleri arasında çift yönlü bir nedensellik ilişkisi olduğunu göstermektedir. Ancak katılım bankacılığı endeksi ile işsizlik değişkeni arasında anlamlı bir nedensellik ilişkisi bulunamamıştır. Geleneksel bankacılık endeksi açısından ise cari açık, enflasyon ve ekonomik büyüme değişkenleri ile çift yönlü nedensellik ilişkisi tespit edilmiştir. Geleneksel bankacılık endeksi ile işsizlik değişkeni arasında ise tek yönlü bir nedensellik ilişkisi bulunmuştur. Dalgacık analizi sonuçları, 2016 yılından itibaren katılım bankacılığı ile ekonomik büyüme arasında yüksek frekanslı pozitif bir ilişki olduğunu göstermektedir. Katılım bankacılığı ile cari açık arasındaki ilişki 2008 yılından itibaren negatif yönlüdür. Katılım bankacılığı ile enflasyon arasındaki ilişki 2007'ye kadar pozitif, 2020'den 2024'e kadar ise yüksek frekanslı pozitiftir. Katılım bankacılığı ile işsizlik arasında anlamlı bir ilişki bulunamamıştır. Konvansiyonel bankacılık ile işsizlik arasındaki ilişki analiz dönemi boyunca yüksek frekanslı pozitiftir. Konvansiyonel bankacılık ile ekonomik büyüme arasındaki ilişki 2016'dan itibaren hem pozitif hem de negatif eğilimler göstermektedir. Konvansiyonel bankacılık endeksi ile cari açık arasındaki ilişki 2008 yılından bu yana negatif yönlüdür. Konvansiyonel bankacılık ile enflasyon arasındaki ilişki ise 2015 yılından sonra negatife dönmüştür. Bu sonuçlar, Türkiye'de bankacılık sektörü ile ekonomik göstergeler arasındaki dinamik ilişkiler hakkında önemli bilgiler sağlamaktadır."
