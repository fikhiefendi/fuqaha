abstract: "İslami ev finansmanı, İslami finans kurumları tarafından sağlanan ve Şeriat ilkelerine bağlı bir finansal üründür. Bu çalışma, müşterilerin Kanada'da İslami konut finansmanını benimseme niyetlerini etkileyen faktörleri araştırmak için Gerekçeli Eylem Teorisini (TRA) bir çerçeve olarak kullanmaktadır. Kanadalı Müslümanlardan 135 adet kullanılabilir anket elde edilmiştir. Veriler daha sonra sonuçları elde etmek için SmartPLS-SEM yazılımıyla analiz edildi. (PR) ve (AWA) üzerindeki düzenleyici değişken Hükümet desteğinin (GS) yanı sıra Tutum (ATT), Dini yükümlülük (RO), Fiyatlandırma (PR) ve Farkındalık (AWA) olmak üzere beş belirleyici faktör vardır. Sonuçlar tutum, dini yükümlülük ve farkındalığın anlamlı düzeyde olduğunu göstermektedir. Fiyatlandırma ve devlet desteği önemli olmasa da müşterilerin İslami konut finansmanını kullanma niyetlerini etkiledi. Bulgular, piyasa oyuncularının, daha rekabetçi olabilmek ve müşteriler için daha çekici olabilmek amacıyla etkili İslami ev finansmanı ürünleri oluşturmak amacıyla iyileştirmeleri gereken yönlere ilişkin stratejilerini geliştirmelerine yardımcı olacaktır. Yazarın bildiği kadarıyla bu, Kanada'da İslami finans üzerine yapılan ilk niceliksel çalışmadır."
