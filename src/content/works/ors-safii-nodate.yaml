abstract: "Bu tez çalışması İmâm Şâfiî'nin vefatından sonra mezhebinin geçirmiş olduğu iç ekolleşme olgusunu tarihî veriler ile fıkhî aktarımlar çerçevesinde incelemektedir. İmâm Şâfiî'nin ilk nesil öğrencileri ile beraber mezhep kurumsallaşma sürecini devam ettirmiş ve birçok öğrenci yetişerek farklı bölgelere mezhebin taşınmasını sağlamıştır. Ancak farklı bölgelere giden bu öğrenciler zamanla bölgesel ilmî ekollerin oluşmasını sağlamışlardır. Bu ekolleşmeler temelde Irak ve Horasan olmak üzere iki ilmî kanal üzerinden varlığını sürdürmüştür. Irak'ta Ebû Hâmid el-İsferâyînî, Horasan'da ise Kaffâl el-Mervezî klasik literatürde“tarîk”olarak ifade edilen bu ekolleşmeyi zirveye taşımışlardır. Her biri kendi bölgesindeki Şâfiî ekolünün reisi/şeyhi olan bu âlimlerin faaliyetleri ile mezheb farklı bir evreye geçmiştir. Bu iki âlimlerin faaliyeti ile başlayan ayıklama dönemi mezhep içerisinde uzun bir süre devam etmiş ve Râfiî ile Nevevî'nin faaliyetleri ile kemale ulaşmıştır. Tez çalışmasında İmâm Şâfiî'nin öğrencilerinden başlayıp Irak ve Horasan ekollerinin reislerinin yaşadığı döneme kadarki süreç hem tarihsel hem de ilmî gelişim açısından araştırılmıştır. Bu süreç oluşum, gelişim ve ayıklanma olmak üzere üç evre üzerinden ortaya konulmuştur. Oluşum döneminde ekollerin temelini atan rivayet ve görüşlerin aktarılması, gelişim döneminde mezhebin İbn Sürec ve öğrencileri ile güçlü bir savunma hattına geçişi ve mezhebin farklı açılardan dönüşümü, ayıklanma döneminde ise İmam Şâfiî ile ashabının görüşlerinin tespiti, delillendirilmesi, tahrîci ve tefrî'i gibi fıkhî faaliyetler üzerinden üstlendiği rol ortaya konulmuştur. Her bir ekol zikredilen üç evre üzerinden incelenerek mezhebin dinamikliği ve ekollerin birbirlerine olan etkileri araştırılmıştır. Tarîk kavramı etrafında yürütlen bu çalışmada kavramın salt bir ihtilaf aktarımı olmadığı, aynı zamanda ihtilafın yorumlanması, delillendirilmesi, temellendirilmesi ve yeni hüküm inşâ etmesi gibi birçok fonksiyonu ifade eden mezhep içi istidlâl biçimi olduğu da ortaya konulmuştur."
