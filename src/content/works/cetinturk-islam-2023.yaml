abstract: "İnsanın iç dünyasında içkin bulunan iradenin, hukukî bir anlam ve geçerlilik kazanması için dışa aksettirilmesi gerekir. Farklı bir ifadeyle içte oluşan, özü ve mahiyeti gereği subjektif bir anlam taşıyan iradenin hüküm ifade edebilmesi için dışta bilinmesi gerekir. İradenin bir aşaması sayılan ihtiyâr, hukukî işlemlerin özünü teşkil etmektedir. Bu bakımdan İslâm hukukunda ihtiyâr sahibi olmayan gayri mümeyyiz çocuk, mecnun (akıl hastası) ve bayılan kimselerin hukukî işlemlere ilişkin beyanları hükümsüzdür. Bu çalışmamızda İslâm hukuku meselelerinden ihtiyâr nazariyesini ele aldık. Çalışmamızda ihtiyâr kavramının mahiyeti yanında İslâm hukuk ekollerinden Hanefî, Mâlikî, Şâfiî ve Hanbelî mezheplerinin ihtiyâr kavramına yönelik yaklaşımları üzerinde de durduk. İhtiyâr ile rızânın yakın anlamlı olmasına bağlı olarak mezheplerin sözü edilen iki kavrama ilişkin yaklaşımları farklı olmuştur. Akdin doğuracağı sonuca yönelik rızâ bulunmadığı halde, akdin sebebine ilişkin salt bir ihtiyârın hukukî açıdan geçerliliği konusunda mezheplerin tutumunun nasıl olduğunu araştırdık. Öte yandan ihtiyâr ile ehliyet ârızaları arasındaki ilişkiyi konu edinerek, ehliyet ârızalarının ihtiyârı ne derecede etkilediğini ve/ya ortadan kaldırdığını tespit etmeye gayret gösterdik. Bilhassa ikrâh, hezl ve hata gibi iradenin kısmen şaibeli olduğu durumlarda ihtiyârın varlığının ve hukukî bakımdan geçerliliğinin mümkün olup olmadığını mezheplerin görüşleri doğrultusunda konu edindik. Ayrıca akdin hükümleri arasında yer alan fâsid ile ihtiyâr arasındaki ilişkinin nasıl olduğu ve bu doğrultuda fesih ihtimali bulunan ve bulunmayan akitlerin taksiminde mihenk taşı konumunda olan ihtiyârın işlevi üzerinde durduk. Bununla birlikte irade muhtâriyeti ve akit hürriyetinde ihtiyârın rölüne ilişkin delilleri ortaya koyarak tahlillerde bulunduk. Anahtar Kelimeler: İslâm Hukuku, İrade, İhtiyâr, Rızâ, İrade Beyanı, İkrâh, Fesih."
