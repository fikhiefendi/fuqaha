abstract: "Bu çalışmanın amacı, İslami finansal okuryazarlık ve buna etki ettiği düşünülen psikolojik faktörlerin (çaresizlik, dindarlık, mali tatmin) Kahramanmaraş Sütçü İmam Üniversitesi İİBF ve İlahiyat Fakültesi öğrencileri üzerindeki etkisinin araştırılmasıdır. Yapılan çalışma ile öğrencilerin İslami finansal okuryazarlık düzeyleri ve bununla ilişkili olduğu düşünülen psikolojik faktörlerin analiz edilmesi, elde edilen bulguların literatüre kazandırılması ve bu alanda kullanılmak üzere bir ölçek geliştirilmesi planlanmaktadır. Bu amacı gerçekleştirmek üzere, Abdul Rahim vd. (2016) tarafından geliştirilen ölçek bir grup üniversite öğrencisi üzerinde test edilmiştir. Çalışmanın verileri Kahramanmaraş Sütçü İmam Üniversitesi'ndeki 640 öğrenciye dağıtılan anket formlarından sağlanmış ve elde edilen veriler SPSS programı ile analiz edilmiştir. Araştırmadan elde edilen bulgular İslami finansal okuryazarlık için geçerli ve güvenilir bir ölçeğin varlığına işaret etmektedir. Analiz sonuçları, öğrencilerin İslami finansal okuryazarlık düzeylerinin yüksek olduğunu, bayanların erkeklere oranla İslami finansal okuryazarlıkta daha ilerde olduklarını göstermektedir. Ayrıca, İslami finansal okuryazarlık ile dindarlık arasında pozitif ve anlamlı bir ilişkinin olduğu gözlemlenmiştir. Yine öğrencilerin İslami finansal okuryazarlık düzeyleri arttıkça çaresizlik eğilimleri azalmakta ve dini eğilimleri ile finansal memnuniyetleri ise artış göstermektedir."
