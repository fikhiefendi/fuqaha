abstract: "Türkiye ekonomisinin Kasım-2000 ve Şubat-2001 tarihlerinde yaşadığı krizin ardından Türk bankacılık sistemi köklü bir yeniden yapılandırma süreci yaşamış ve 2003 yılından itibaren Türk ekonomisine paralel olarak sektörde hızlı bir büyüme gerçekleşmiştir. Türk bankacılık sisteminin büyük parçasını oluşturan geleneksel ticari bankaların yanı sıra, faizsiz bankacılık yapan Özel Finans Kurumları (ÖFK) da aynı yapılandırma sürecinden geçmiş; 2005 yılında çıkarılan 5411 sayılı Bankalar Kanunu'na tabi olarak ?Katılım Bankası? adını almıştır. 5411 sayılı kanun ile katılım bankaları ticari bankaların tabi oldukları bütün düzenlemelere tabi olmuş; bu durum katılım bankalarının Türk bankacılık sektörü içindeki yerinin belirlenmesini ve mali performansın ölçülmesini önemli hale getirmiştir.Bankacılık sektöründe, banka bilanço ve gelir tablolarının değerlendirilmesinde kullanılan oranların, katılım bankaları mali tablolarına uyarlanması ile gerçekleştirilen bu çalışmada yüzyılı aşkın bir tecrübeye sahip ticari bankacılık sektörü ile, katılım bankacılığı sektörü karşılaştırılmış, ayrıca sektörde faaliyet gösteren katılım bankaları kendi aralarında bir değerlendirmeye tabi tutulmuştur.Yapılan oran analizi sonucu, incelenen dönemde katılım bankalarının ticari bankalardan daha hızlı büyüdüğü, sermaye oranlarının daha küçük olduğu ve katılım bankalarında fon kullandırma oranının daha büyük olduğu tespit edilmiştir. Katılım bankaları için mali açıdan öne çıkan konuların hızlı büyüme ve büyümede istikrarın sağlanması,sermaye yeterliliği ve kredi risklerinin azaltılması olduğu söylenebilir."
