abstract: "Ebû'l-Leys es-Semerkandî'nin (d. 373/983) kaleme aldığı en-Nevâzil adlı eser, İslam Hukuku alanında önemli bir konuma sahiptir. Bu eser hicrî üçüncü ve dördüncü yüzyılda yaşamış Belhli ve Semerkandlı Hanefi fakihlerin görüşlerini içeren bir derlemedir. Ancak ifade edilmelidir ki bu görüşler Hanefî ekolün fıkhî görüşlerini yansıtan temel Hanefî hukuk literatüründe yer almamaktadır. Semerkandî bu eserinde Horasan ve Türkistan bölgesinden altı Hanefî fakihin görüşlerine yer vermiştir.Bu eserde ?Kitâbü'l-Hiyel? babı da mevcut olup iki yüz kırk mesele ele alınmıştır. Bu çalışma iki bölümden oluşmaktadır. Birinci bölümde müellifin hayatından, hocalarından, öğrencilerinden, eserlerinden ve içinde yaşadığı sosyo-politik çevreden bahsedilmiştir. Ayrıca bu bölümde genel anlamda ?hiyel ilmi?nden söz edilmiştir.İkinci bölümde ise, ?Kitâbü'l-Hiyel ve'l-Mehâric? babının edisyon kritiği sunulmuştur. Metin, Süleymaniye Kütüphanesi'nde bulunan iki nüshası karşılaştırılmak sureti ile oluşturulmuştur. Eserde geçen İslam Hukuku terimleri ve şahıs isimleri hakkında dipnotlarda açıklamalarda bulunulmuştur. Ayrıca esere ve yazarına sonraki dönem Hanefî literatürde yapılan atıflara işaret edilmiştir.Anahtar kelimeler, Kitâbü'l-Hiyel, Semerkandî, en-Nevâzil, görüşler, edisyon kritiği."
