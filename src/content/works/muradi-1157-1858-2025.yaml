abstract: "Afganistan coğrafyasının Müslümanlar tarafından fethedilmesinden sonra bölge halkı İslam dinini kabul etmiş ve daha önceden var olan hukukun yerini İslam hukuku almıştır. İlim tahsili ve bölgedeki hukukî ihtiyaçları çözmek için Kûfe'ye ve Ebû Hanife'nin ilim halkasına giden Afgan öğrenciler, Ebû Hanife'nin görüşlerini ve Kûfe'de elde ettikleri fıkhî birikimleri Afganistan'a taşımıştır. Böylece Hanefî fıkhı Afganistan'da yayılmaya başlamıştır. Daha sonra bu fıkhî gelenek, her bölgenin kültür ve tecrübeleri ile zenginleşip o bölgenin şartlarına göre farklı şekillerde gelişmiş ve fakihlerin bulundukları coğrafyaya nispetle Belh ekolü ve Buhara ekolü gibi mezhep içi alt ekoller meydana gelmiştir. Afganistan topraklarında kurulan devletlerin Hanefî mezhebini esas almasıyla da Hanefîlik halk tabanında kabul görmüştür. Bu süre zarfında Afganistan'da fıkıh alanında önemli birçok fakih yetişmiştir. Özellikle \"Daru'l-fıkıh\" ismiyle anılan Belh şehrinin ilmî ve İslam kültürü açısından önemi büyüktür. Bu şehirde ilim merkezleri kurulmuş ve İslam fıkhı diğer beldelere buradan intikal etmiştir. Belh fukahası, Hanefî mezhebinin temel ilkelerine bağlı kalsalar da Belh'in kültürel ve coğrafi şartlarını dikkate alarak bazı hususlarda mezhebin hâkim görüşünden farklı görüşler ortaya koymuşlardır. Bölgede birçok farklı mezhep var olmuşsa da en yaygın olanı Hanefî mezhebi olmuş ve Belh fıkıh ekolü, Sünnî Hanefî çizgi üzere asırlarca devam etmiştir."
