abstract: "Araştırmada Hanefi usûlü fakihlerinin her birinin şahsî ve ilmî hayatı ele alınmıştır. Bunlar Fevâidi'z-zîniyye'nin müellifi İbnü Nüceym El-mısrî ve araştırmamızın konusunu teşkil eden Tertîbü Fevâidi'z-zîniyye adlı eserin müellifi şârih Muhammed b. Ahmed Mustafa El-Kedûsî'nin hayatlarıdır. Kedûsî bu eserinde fıkhın her konusu hakkında fevaidi bir araya getirmiştir. İbadetler, muâmelât ve diğer şer'î hükümlerin tamamı vardır. İbn Nüceym Fevâidi'z-zîniyye'yi muhtasar bir eser olarak telif etmiştir. Kedûsî bu esere zeyl, ekleme ve şerh yapmış ve kitabın daha iyi anlaşılmasını sağlayacak şekilde açıklamıştır. Araştırma fıkıh ilminin ilimler içerisinde büyük bir değere ve dinî bir makama sahip olduğunu ve büyük bir boşluğu doldurduğunu göstermiştir. Bu kitabın tahkik edilmesinin fıkıh ilmi sahasında değerli bir katkı sağlayacağı, bütün Müslümanlara bir hizmet yerine geçeceği kabul edilebilir. Tertîb, İbn Nüceym'in fıkhî meselelerinin düzenlenmesi, onlara ekleme yapılması kitapta anlaşılması zor kısımları izah etmek, özlü ifade edilmiş kısımları daha geniş açıklamak için telif edildi. Allâme Mustafa El-kedûsî'nin alim kişiliğini tanınıp yıldızının parladığı ilmî kültüründen ve Fevâid'i kendi usulünce düzenleyip çalışmasından anlaşılmaktadır. Bu, onun ilmî kültüründen ve bu faydaları düzenlemesinden açıkça bellidir ve bilhassa fıkıh ve dil sahasında ilmî bir kurtuluşa işaret eder.. Böylece Mustafa El-kedûsî Et-tertîb adlı eserini önyargısız ve sıkıcı olmayan vasat bir eser olarak telif etti. Müellif şer'î hüküm alanındaki ilmî birikimin nakledilmesi için büyük bir hassasiyet ve dürüstlükle çalışmıştır."
