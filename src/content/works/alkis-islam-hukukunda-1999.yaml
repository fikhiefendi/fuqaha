abstract: "ÖZET İslâm Hukukçuları hadislerden hareketle, faizin hangi mallarda ve hangi şartlarda gerçekleştiğini yani faiz illetinin ne olması gerektiğini tesbit etmeye çalışmışlardır. Buna göre paralarda faiz illeti; Hanefîler ve Hanbelîlere göre,“cinsle beraber tartılır olma özelliği”, Şâfiîler ve Mâlikilere göre,“para olma özelliğinin hakim unsur olması”, bazı fakihlere göre de,“tam para olma özelliği olması”dır. Paraların dışındaki mallarda ise faiz illeti; Hanefîler ve Hanbelîlere göre,“cinsle beraber ölçülür olma özelliği”, Şâfiîlere göre,“gıda olma özelliği”, Mâlikilere göre,“stoklanabilen gıda olma”dır. Ancak söylendiği devrin şartlan için uygun olabilen bu faizde illet anlayışları günümüz iktisadî ve ticarî hayatına tam uyum sağlayamamaktadır. Buna göre, günümüzde ticarî ve iktisadî hayatımıza cevap verebilecek faiz illeti“cinsle beraber mislî mal olmadır”. vıu"
