abstract: "Yaşam hakkı, insanın sahip olduğu en değerli haklardan biri olup, sırf insan olmasından dolayı ona özgüdür ve ayrılmaz haklardan en önemlisidir. Devletin ise bu hakkı koruma ve insanlara optimal yaşam standartlarını sağlama yükümlülüğü, Avrupa İnsan Hakları Sözleşmesi'nin 2. maddesinde yaşam hakkı hükmünde belirlenmiştir. İntihar ise tarih boyunca yaşam hakkına yönelik başlıca tehditlerden biri olarak tehlike arz etmektedir. Dünya Sağlık Örgütü'ne (World Health Organization) göre, yıllık intihar sayıları neredeyse 720 binin üzerine çıkmıştır. Çalışmamızın temel amacı, Türkiye ve Azerbaycan Cumhuriyetleri'nde intiharla ilgili hem mevzuat hem de doktrindeki düzenlemeleri, hem günümüzdeki hem de geçmiş dönemlerdeki halleriyle aydınlatmaktır. Bu araştırmayı gerçekleştirmemdeki etkili neden, her iki ülkede de intihar oranlarının zamanla artması olmuştur. Araştırmamızda intihara yönelik kavramsal yaklaşımlar ele alınmış, Avrupa İnsan Hakları Mahkemesi'nin devletlerin olumlu yükümlülüklerini emsal kararlar doğrultusunda analiz edilecek ve her iki ülkenin mevzuatında yer alan intihara teşvik suçları, yürürlükten kalkmış kanun ve mecellelerde incelenerek değerlendirilmiştir. Yürürlükten kalkmış kanun ve mecellelerin incelenmesindeki temel dayanak, her bir mecelle ve kanunun o dönemdeki toplumsal tehlike arz eden eylemleri cezalandırmaya tabi tutmasından kaynaklanmaktadır. Bu nedenle, intiharın çok boyutlu incelenmesi, intiharın oluşum nedenlerini ve devletlerin bu nedenleri önlemek için hangi adımları atmaları gerektiğini içeren inceleme yapılmıştır."
