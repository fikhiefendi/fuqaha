abstract: "Bu çalışmada İslâmi ilimlerin en parlak dönemlerinden biri olan Memlükler Dönemi'nde (1250-1517) yetişmiş Celâleddîn el-Mahallî'nin Tâceddin es-Sübkî'nin (ö.771/1370) Cemʻü'l-Cevâmiʻ adlı muhtasar usûl metni üzerine yazdığı el-Bedrü't-Tâliʻ adlı şerhi incelenmiştir. El-Bedrü't-Tâliʻ, açıklamayı uzatmadan akıcı bir dil ve sade bir üslup ile musannifin muradını açıklamış olması, ilim ehlinin rağbetini celp etmiş ve Cemʻü'l-Cevâmiʻ ile birlikte uzun yıllar ders kitabı olarak okunmuştur. Bu bakımdan çalışmamızda ana hatlarıyla Sübkî'nin ilmi şahsiyeti ile Cemʻü'l-Cevâmiʻ isimli eserinin genel özelliklerine temas edildikten sonra Mahallî'nin hayatı, hocaları, öğrencileri ve eserleri kaleme alınmıştır. Ardından el-Bedrü't-Tâliʻ isimli şerhinin genel özellikleri ve yazılış metodu ele alınarak onun fıkıh usulü ilmindeki önemine ve katkısına değinilmiştir."
