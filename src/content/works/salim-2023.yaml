abstract: "Fetva, Müslümanı hükmünü bilmediği konularda doğru yola sevk ettiği için Müslümanın hayatında büyük bir yere sahiptir. Fetva kurumunun dinimizde bu denli önemli bir yer sahip olması ve Kuveyt Vakıflar ve İslâmî İşler Bakanlığı'nda on altı yılı aşkın bir süre çalışmış olmam, beni Vakıflar Bakanlığı'ndaki Fetva Komisyonuna sunulan güncel mali meseleleri incelemeye sevk etti. Böylece Fetva Komisyonuna sunulan güncel mali meseleleri ele alıp içeriklerini incelemeye, metodolojisini ve meselelere yaklaşım tarzını ele almaya, insanların içinde bulunduğu gerçekliklere ne kadar uygun olduğunu ve dayanılan Şer'i ilkeleri de belirtip fakih ve alimlerin sözleriyle karşılaştırarak fetva verme yöntemlerinin neler olduğunu açıklamaya karar verdim. Ulaşmak istediğim diğer bir husus da Fetva Heyetinin çağdaş mali işlemlere dair fıkıh meselelerini ele alırken izlemiş olduğu yöntemin özelliklerinin neler olduğunu ortaya koymaktır. Araştırmacı, Kuveyt Devleti'ndeki Fetva Makamına sunulan finansal işlemleri tümevarımcı, betimleyici ve eleştirel yaklaşıma dayanarak ele almış ve genel olarak İslam hukukunda ortaya çıkan meselelerin içtihadına ve çağdaş finansal işlemlere odaklanma ihtiyacında önemli sonuçlara ulaşmıştır."
