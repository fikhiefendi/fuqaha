abstract: "İslam yargılama hukukunda dava kavramı, davacının hâkim huzurunda anlaşmazlık halinde olduğu kişiden hakkını talep etmesi olarak tanımlanır. Davanın seyrini belirleyen unsurlar, taraflar, irade beyanları, dava konusu olan hak ve yargı merciidir. Akdin oluşumunda da tarafların bulunması, karşılıklı rızaya dayanan beyanları, bu beyanların gerçekleştiği meclis ve bir akit konusunun bulunması şarttır. Dava konusunun bir hak ve iddia içermesi ve davacının davayı açmasında hukuki bir yarar olması gerekmektedir. Akdin konusunun ise akdin hükmünü taşımaya elverişli olması beklenir. Dava, bir akit çeşidi olmamakla birlikte kaynaklarda akit tekniği çerçevesinde ele alınan seyri ve sonuçları itibariyle akitle benzer yönleri olan hukuki bir tasarruftur. Bu çalışmada, İslam yargılama hukukunda davanın, bütün yönleri ile ele alınarak mevcut tasnif ve usul itibariyle akit teorisi açısından analizi konu edinilmektedir. Çalışma, İslam hukuk düzeninde dava ve akit kavramlarının birlikte incelenmesi bakımından önem arz etmektedir."
