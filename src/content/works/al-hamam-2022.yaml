abstract: "Bu araştırma, İmam Ebu Hanife ile İmam Züfer'in fıkıh görüşlerine dair karşılaştırmalı bir fıkıh incelemesi olup bu çalışmada geniş ölçüde yayılan Hanefi mezhebinin fıkıh anlayışının ortaya çıkarılması amaçlanmıştır. Öncelikle Peygamberden (s.a.v.) rivayet edilen ve Sünnet-i Nebeviyye'nin ilk tedvin örnekleri olarak kabul edilen sıhah kitapları ve müsnedler üzerinden Kitâb, Sünnet-i Nebeviyye ve eserler ile delil göstermeleri ele alınmış, daha sonra İslam fıkhının zenginleştirilmesine sundukları katkılar aktarılmış ve ortaya koydukları görüşler diğer selef-i salih, fıkıh imamları ve âlimlerinin fıkhi görüşleri ile karşılaştırılmıştır. Araştırmada, kendisine ait olduğu sabit olan ve hadis kitaplarına dayanan fıkhî eserler incelenerek ve aynı meselede diğer fakihlerin sözleri ve içtihatları ile karşılaştırma yapılarak analitik tümevarım yöntemi kullanılmıştır. Araştırmada birtakım sonuçlar elde edilmiştir. Bunların en önemlileri, Peygamberden (s.a.v.) rivayet edilen görüşlerin sahihliği ve buna isnatlarının sıhhat derecesi, hadis âlimlerinin bunlarla delil göstermelerinin ölçüsü, muhaddisler ile fakihlerin hadislerde ve sünenlerde geçen hususları esas alma yöntemleri, ayrıca İslam fıkhının asırlar boyunca üzerine bina edildiği mezhep imamlarının fıkhı olan içtihadî fıkıh temelinin bir parçası olarak söz konusu imamların sahip oldukları fıkhî içtihat kudreti ve yetenekleri ile ilgili sonuçlardır. Araştırmada, bölümler halinde ayrılmış olarak ilgili meseleler ve konular değerlendirilmiştir."
