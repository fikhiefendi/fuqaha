abstract: "Ülkemizde faizin haram olduğu görüşüne sahip insanların birikimlerini ekonomiye aktarmaması bu birikimlerin atıl kalmaması, diğer bir ifade ile yastık altı kalmayıp reel ekonomiye aktarılması için faizsiz bankalar kurulmuştur. Bu faizsiz bankalar profesyonel anlamda 1970'li yıllarda ortaya çıkmış olup ülkemizde 1983 yılında Özel Finans Kurumları adı altında faaliyetlerine başlamışlardır. Özel Finans Kurumları 2005 yılında çıkarılan kanunla isim ve statü değişikliğine gitmiş ve bankacılık çatısı altına girerek Katılım Bankası adını almışlardır.Katılım Bankaları birçok faaliyetinde ticari bankalarla benzerlik göstermesine rağmen faizsiz bankacılık prensibiyle çalıştıkları için bazı noktalarda ticari bankalardan ayrılmaktadır.Bugün faizsiz bankacılık sadece Müslüman ülkelerde değil; İngiltere, Almanya gibi Avrupa ülkeleri ve Amerika Birleşik Devletleri gibi ekonominin çok ileri düzeyde olduğu ülkelerde de yaygınlaşmaktadır. Ülkemizde de Katılım Bankaları 2001 krizinden sonra büyük bir atılım yapmış, 2005 yılında Katılım Bankaları olmakla birlikte ticari bankalarla rekabet edebilecek konuma gelmişlerdir. Bu kurumlar her alanda kendilerini sürekli güncelleyerek büyüme trendlerini devam ettirmektedirler.Bu çalışmada Faizsiz Bankacılık Sistemi anlatılmış olup faizle kâr arasındaki farklar ve faizsiz bankaların çalışma prensipleri anlatılmıştır. Bir faizsiz bankacılık modeli olan Katılım Bankalarının Dünyadaki ve Türkiye'deki gelişim süreci, Katılım Bankalarının faaliyetleri anlatılmıştır. Ayrıca Katılım Bankalarının faaliyetleri, kârlılıkları ve Katılım Bankalarının gelişmesinde işletmelerin rolü anlatılmış ve Adana, Batman, Gaziantep, Hatay, Mardin, Mersin, Osmaniye ve Şanlıurfa Bölgelerinde anket uygulaması yapılmıştır. İşletmelere yapılan anketler SPSS programıyla analiz edilip yorumlanmıştır."
