abstract: "Katılım bankaları prensipleri gereği, faiz hassasiyeti olan toplumların atıl kalmış fonlarının ekonomiye kazandırılması ve yabancı paraların ülkeye girmesi açısından bir köprü görevi üstlenmektedir. Türkiye'de yaklaşık 35 yıllık geçmişe sahip olan bankalar, ekonomilerini giderek iyileştirmekte ve bankacılık sektörü içerisindeki payını artırmaktadır. Ülkemizde katılım bankacılığına devlet desteğinin verilmesi, bu bankacılık sisteminin daha çok tanınmasında ve güven ortamının oluşturulmasında etkili olmuştur. Türkiye'de 2010-2017 yılları arasında meydana gelen Gezi Parkı Olayları, 17-25 Aralık Soruşturması ve 15 Temmuz Darbe Girişimi gibi toplumsal ölçekli siyasal ve sosyoekonomik olayların, ekonomideki etkileri günümüzde hala devam etmektedir. Finansal ve siyasal kriz dönemlerinde katılım bankalarına göre mevduat bankaları, çok daha büyük bilanço zararları ile karşılaşmışlardır. Faiz oranlarında oluşan dengesizlik ortamı ile döviz kurlarında meydana gelen oynaklık, mevduat bankalarının ve ülke ekonomisinin olumsuz etkilenmesine sebep olmuştur. Tüm bu olumsuzluklara rağmen katılım bankaları bu süreçten sınırlı düzeyde etkilenip; özkaynaklar, aktif büyümeler, karlılık ve şubeleşme açısından büyümeye devam etmiştir. Bu çalışmanın amacı; Türkiye'de ve Dünya'da katılım bankacılığının tarihsel gelişimi çerçevesinde, katılım bankalarının Türkiye ekonomisine olan katkılarını ele almak, faaliyet gösteren bankaların toplam şube ve çalışan sayılarını, aktif büyüme oranlarını, toplanan fonlar ile kullandırılan fonların yapılarını, özkaynaklarını ve net kar kalemlerini betimleyici analiz yöntemiyle incelemek ve değerlendirmektir. Başka bir ifadeyle, ulusal ekonomik ve siyasi kriz dönemlerini ayrıntılı olarak inceleyip, bu dönemlerde katılım bankalarının likidite ve karlılık pozisyonlarındaki değişimlerin nedenlerini grafikler yardımıyla analiz etmektir. 2010-2017 dönemini kapsayan grafikler, hem kendi faaliyet gösterdiği dönem içerisinde analiz edilmekte, hem de yıl bazında birbirleri ile karşılaştırılarak değerlemeye tabi tutulmaktadır. Bu çalışmaya, TMSF'ye devredilen Bank Asya da dâhil edilmiştir. Bu bankanın likidite ve karlılık rasyoları Türkiye Katılım Bankaları Birliği verilerinde belirtildiği gibi, 2015 yılı 3. çeyreğine kadar alınmıştır. Çalışmaya, 2015 yılında Ziraat Katılım ve 2016 yılında Vakıf Katılım Bankası da dâhil edilmiştir. Çalışma sonucunda, bütünsel bir yaklaşım çerçevesinde katılım bankalarının karlılık oranlarının 2014 yılında aşırı değer kaybına uğradıkları görülmüştür. Değer kaybının meydana gelmesinde, özellikle Bank Asya'nın 813 milyon TL zarar etmesi etkili olmuştur. Kriz dönemlerinde ise, kar-zarar esasına göre faaliyet yürüten katılım bankalarının, sektördeki olumsuzluklardan sınırlı oranda etkilenip, büyüme fonksiyonlarını devam ettirdikleri saptanmıştır. Katılım bankalarının, orta ve uzun vadede sektördeki payını artırıp daha etkin hale geleceği öngörülmektedir."
