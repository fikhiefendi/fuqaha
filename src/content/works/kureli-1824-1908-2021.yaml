abstract: "Bu tez, İran Ahkâm Defteri'nde bahsi geçen İranlı tüccarların Osmanlı şehir ve kasabalarındaki ticari faaliyetleriyle gelişen hukûkî ve sosyolojik hareketliliği ele almaktadır. Söz konusu Ahkâm Defteri, Osmanlı Arşivi'nde bulunmakta olup 759 hükümden ibarettir. İranlı tüccarların faaliyetlerini düzenlemek üzere Osmanlı şehir ve kasabalarına tayin olunan şehbender, şehbender vekili, maslahatgüzar, kârperdaz ve diğer görevlilerin ekonomik ve sosyal faaliyetleri de bu tezin inceleme konuları arasında yer almıştır. Osmanlı ve İran devletlerini içine alan coğrafya, tarihin en eski ticaret güzergâhları olarak bilinen İpek ve Baharat Yolları'nın kesiştiği noktada bulunması itibarıyla bu tarihi sürece ilişkin yapılan bilimsel araştırmalar üzerinden konuya giriş yapıldı ve ana hatlarıyla bu coğrafyadaki ekonomik ve sosyal hareketlilik incelendi. XIX. yy.'ın ilk çeyreği nihayetine kadar olan Osmanlı ve İran devletleri arasındaki ticari münasebetlere de yapılan bilimsel çalışmalar üzerinden kısaca değinildi. Bölgeye hâkim konumdaki İngiltere, Rusya ve Fransa devletlerinin birbirleriyle olan kıyasıya rekabetleri ve özellikle Rusya'nın kışkırtmaları neticesinde üç buçuk sene (1820-1823) sürecek şiddetli bir harbe tutuşan Osmanlı ve İran devletleri ciddi kayıplar verdiler. Savaş dolayısıyla tamamen sıfırlanan bölge ticareti, tüccar sınıfının ciddi baskıları neticesinde Osmanlı ve İran devletleri ticari bir muahede yapmak zorunda kaldılar. Yapılan antlaşma neticesinde ticari geliş-gidişler yeniden başladı ve tüccar sınıfının bu teşebbüsü başarıyla sonuçlandı. Kıtlık ve yoklukla mücadele eden bölge halkı ve büyük kayıplar veren tüccar sınıfı nihayet rahat bir nefes alabildi. iii Ahkâm Defteri, Osmanlı ve İran Devletleri arasında yapılan ticaret muâhedesi sonucunda gelişen ticari ve siyasi hareketliliğin kayıt defteridir. Gönderilen hükümler İranlı tüccarlara iyi davranılmasını emretmekte ve bunun neticesinde ekonomik bir rahatlama hedeflenmektedir. İki tarafta da bu konudaki isteklilik dikkati çekmektedir. Ticari kazanç uğruna yollardaki eşkıyaca öldürülen ve malları yağmalanan tüccarlarla onların pazarladıkları mallar, bu tezde tek tek ele alındı. Bir kıyaslama yapabilmek için iki ülke arasındaki en büyük gümrük kapısı olan Erzurum Gümrüğü'ne getirilen ticari ürünlere de bu tezde yer verildi. İran Devleti'nin ticari elçileri konumundaki şehbender, şehbender vekili gibi görevlilerin tayin ve azil işlemleri defterde ticaretten daha çok yer işgal etmekte; hac ve diğer maksatlarla Hicaz bölgesine gidecek ya da İran'a dönüş yapacak olan yüksek seviyeli İranlı misafirlere iyi davranılması, kendilerine yardımcı olunması hususunda yol güzergâhındaki yerel idarecilere yazılan yol emirleri de Ahkâm defterinde belli bir yekûn tutmaktadır."
