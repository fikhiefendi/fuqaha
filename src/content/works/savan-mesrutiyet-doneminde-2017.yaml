abstract: "Bu çalışma, II. Meşrutiyet devrinin başlıca yayın organlarından olan Sırât-ı Müstakîm mecmuası üzerinden İslâmcıların iktisâdî görüşlerini, dönemin genel iktisâdî gündemiyle bağlantılı olarak ortaya koymaya çalışmaktadır. Geri kalmışlığını itiraf ettiği İslâm âlemini uyandırarak eski parlak günlerine kavuşturmayı amaçlayan mecmua yazarları, İslâm özünde ilerlemeyi teşvik ettiği halde Müslümanların şeriatı tamamen yanlış anlayıp dine getirdikleri bid'atlar neticesinde dünyayı ihmal edip geri kaldıklarını iddia ediyordu. Bu çerçevede ilerlemenin anahtarı olan ictihâd kapısı tekrar açılıp dünya-ahiret dengesi yeniden kurulduğu ve Batı'nın her türlü ilmî-teknik bilgisi alındığı takdirde Müslümanların hızla yeniden kalkınacağına inanıyorlar ve bu çerçevede kapsamlı bir program öneriyorlardı. Dönemin başka bazı tematik mecmua ya da gazetelerinden farklı olarak esasen dînî-ictimâî-fikrî meselelere münhasır bir yayın organı olması nedeniyle iktisâdî meseleler Sırât-ı Müstakîm'in gündeminde her zaman ilk sırasında görülmüyordu. Ancak bu alanda İslâmcılar, çağdaşlarını tekrar eden yaklaşım içinde de olmayıp dînî ve millî hamiyet çağrılarıyla toplumda bir zihniyet dönüşümü gerçekleştirmeye çalışıyorlardı: Savaşın eski zamanlardaki gibi mutlaka topla tüfekle olmadığını fark eden bu düşünürler, boykot eylemleri ile ekonominin yönlendirilebileceğini görmüşler; gelişmiş ülkelerin kudretini bilhassa şahsî teşebbüse borçlu olduğunun bilincine varmışlardı. Yine insanları memur olmaya teşvik eden zihniyet yüzünden kalifiye uzmanların yetişmediğini ve bunun da dışa bağımlılığın başlıca nedenlerinden biri olduğunu anlamışlardı. Çalışma kapsamında İslâmcı düşünürlerin ortaya koyduğu iktisâdî hayat tasavvuru, devrin diğer iki önemli fikir akımı olan Türkçülük ve Batıcılığın iktisâdî gündemleriyle de kıyaslanmaktadır. Böylelikle genel olarak bir devrin iktisatla ilgili öncelikleri ve ortak gündemi mukayeseli bir yaklaşımla ortaya konulmaktadır. Son olarak, serbestî-yi ticaretten himâyeciliğe geçişin yaşandığı bu dönemde mecmua yazarlarının ilk görüşe daha yakın durdukları görülmüştür. İktisâdî görüşleri liberal çizgiler taşıyan yazarlar, ülkenin ancak özel şirketlerle imar edilebileceği iddiasıyla okurlarını şahsî teşebbüse teşvik etmiş; yeni bir çalışma ahlâkı doğduğu, fabrika ve okullar açılıp şirketler kurulduğu takdirde kalkınmanın kendiliğinden geleceğine dair inançlarını dile getirmişlerdir."
