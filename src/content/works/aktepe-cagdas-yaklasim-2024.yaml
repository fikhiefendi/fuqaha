abstract: "Yeryüzünde yaratılan ve yaşatılan her şeyin bir sebep ve gaye çerçevesinde ele alınması önemli görülmüştür. Çünkü Allah yarattığı her şeyde bir hikmet vaz etmiş olduğundan Allah'a asla sebepsiz ve anlamdan azâde bir söz ya da işin izafe edilemeyeceği vurgulanmıştır. Allah'ın gözettiği en umumî amaç elbette tüm insanlığın maslahatını temin etmek, zararlı olan şeylerden onları uzaklaştırmaktır. İslâmî ilimler metodolojisinde usûl alimlerinin genelinin İslam'ın temel gayesini insanların maslahatını temin olarak görmesine özellikle dikkat çekmek istiyoruz. Bu itibarla İslâm alimlerinin dinin amaca mâtuf yönüne bağlı kalmak kaydıyla oluşturdukları anlama çabaları, Kur'ân'ın içinde barındırdığı temel amaçları tespit etmeyi sağlamaktadır. Nüzûl döneminden itibaren Kur'ân'ı anlama sadedinde gerçekleştirilen tüm çabalara bakıldığında iki farklı görüşün ortaya konulduğu görülür. Bunlardan birincisi Kur'ân'ı açık ve anlaşılır bir metin olarak görmekte, diğeri ise Kur'ân'ın anlaşılması için belirli ilmî kıstasların gerekli olduğunu savunmaktadır. Kur'ân, ezelde tasarlanarak belirli bir maksada matuf oluşturulmuş bir kitap değildir. Tümel veya tikel maksatları önceden belirlenerek Hz. Peygambere inmiş de değildir. Kur'ân, nüzûl döneminde bireysel yahut toplumsal olarak yaşanan olaylar karşısında Allah'ın tüm insanlığa mesajının top yekûn halidir. Ayetlerin oluşturduğu sureleri tek bir konu bütünlüğü içinde değerlendirmek de mümkün görülmemektedir. Sınırları çizilmiş ve kendine ait kavramlar oluşturarak literal anlamda özgünlük kazanmış olan bir ilim, tanımı yapılan ve kendini diğer disiplinlerden ayıran bir vasıf taşımaktadır. Bu yaklaşım sadedinde evvela disiplinler arası yaklaşımla İslamî ilimler içerisinde Belâgat, Tasavvûf, Kelâm, Fıkıh gibi ilimler çerçevesinde makâsıdî değerlendirmeler yapılacak ve Hermenötik yaklaşım çerçevesinde“bir yöntem olarak makâsıd”anlayışının izleri aranmaya çalışılacaktır. Makâsıdu'l-Kur'ân'ın öncelikle Tefsir ilmi dairesinde değerlendirildiğini söylememiz gerekir. Tefsir ilmine ait bir alt disiplin hüviyetinde olan Makâsıdu'l-Kur'ân, kendisine ait pratik bir metod ortaya koyarak, son tahlilde murad-ı ilâhiyyeyi tespit anlamında Kur'ân'ın tüm amaç ve maksatlarına ulaşmayı hedef edinmiştir. Makâsıdu'l-Kur'ân'ın bu gayeci yönü elbette tefsir ilminin usûl dairesinde değerlendirilmeli ve ele alınmalıdır. Kur'ân'ın maksatlarına ulaşmak için kullanılacak metod ve ilkelerin belirlenmesinde düşünsel anlamda Makâsıdu'l-Kur'ân'ın önemi büyüktür. Makâsıdu'l-Kur'ân'ı, güncel bir yaklaşım olarak Kur'ân'ın tamamını amaçsal bir metod çerçevesinde inceleyerek, kendisindeki tümel maksatları tespit etme çabasına dair Kur'ânî bir okuma biçimi olarak tarif etmek mümkündür. Bu anlamda Makâsıdu'l-Kur'ân, Kur'ân'ın makâsıd merkezli ele alınması, ayetlerin nüzûl sebepleri, bağlamı ve hikmetine ilişkin olarak beşerî ve sosyal hayata müteallik ahlaki, hukuki ve itikadî tümel maksatların belirlenmesine ilişkin bir metod olarak kabul edilmiştir. Kur'ân'ın anlaşılması ve yorumlanması konusunda güncel bir yöntem olarak ortaya konan Makâsıdu'l-Kur'ân'ın, Kur'ân'ın tümel ve tikel maksatlarının ortaya konulması adına önemli bir çabayı ortaya koyduğunu söylemek mümkündür."
