abstract: "Hz. Peygamber'in risâletinin ilk döneminden itibaren Müslümanlar ibadet, muâmelât ve ahlâk gibi konularda zihinlerine takılan, çözüm bulamadıkları meseleleri Hz. Peygamber'e arz ediyorlardı. Hz. Peygamber de sahâbilerin sorularına ya vahiy bekleyerek cevap veriyor ya da kendi kanaatini söylüyordu. Soru cevap şeklinde Resûlullah (s.a.v) döneminde başlayan bu uygulama zamanla dinî konulardaki sorulara cevap veren ulemânın fetvalarına, mezheplerin doğmasına, ilgili literatürün oluşmasına, fetva kurum ve kuruluşlarının teşkiline sebep olmuştur. Bunlardan biri de Diyanet İşleri Başkanlığı Din İşleri Yüksek Kuruludur. Kurul, dinî ihtisas sahibi üye ve uzmanlarıyla toplumdan gelen dinî sorulara ya da kendisinin doğrudan gündemine aldığı meselelere fetvalar yayınlamakta; kararlar almaktadır. Kurul, fetvalarını kitap, kitapçık ve internet ortamında yayınlamaktadır. Kurul, fetvalarında İslâm hukuku ilminin yerleşik kurallarına itibar etmekte; pek çok fetvasında âyetler yanında sünneti temsil etmesi bakımından hadislere de atıf yapmaktadır. Akaid ve fıkıh ilminde yerleşik kurallardan biri atıf yapılacak hadislerin sahih ya da en azından hasen derecesinde olmasıdır. Zayıf hadislere akaid ve fıkıh ilminde yer verilmesi uygun görülmemektedir. Bu noktada Kurulun atıf yaptığı hadislerin sıhhat durumu önem arz etmektedir. Araştırmalarımıza göre bu hususta akademik bir çalışmaya rastlanmamıştır. Bu çalışmada Diyanet İşleri Başkanlığı Din İşleri Yüksek Kurulunun Fetvalar adlı eserinde İtikât ve Tahâret bölümlerinde geçen hadisler üzerinden hadis kullanımına yönelik tespitler yapılmaya çalışılmıştır."
