abstract: "İnsan, dünyaya gelmesiyle beraber hakların üzerinde doğmasını mümkün kılan bir zimmete sâhiptir. Bu zimmetin sayesinde ehliyet sâhibi olur. Ehliyet, hakların şahsın zimmetinde toplanmasına müsaade etmesi itibarıyla vücûb, zimmetinde toplanan bu haklar üzerinde şahsın tasarruf kabiliyetini ifade etmesi itibarıyla edâ ehliyeti olarak tarif edilmiştir. Şahsın kendi başına hak edinebilmesi ve mükellefiyet altına girebilmesi için edâ ehliyetine sahip olması gerekir. Edâ ehliyeti belli hâllerde noksanlaşır. Bu hallere ehliyet arızaları denir. Hacr, bu hallerde kişilerin hukukî tasarruflarından kısmen veya tamamen menedilmesidir. Bununla birlikte ehliyet arızaları arasında sayılmayan borçluluk ve amme menfaati ihlal etme hallerine de şâmil olarak daha umumî bir mana taşır. Hacr, esas olarak kendiliğinden ve mahkeme kararıyla vuku bulan hacr şeklinde ikiye ayrılır. İlk kısma küçüklük, akıl hastalığı, akıl zayıflığı, kölelik, ölüm hastalığı halleri; ikinci kısma, borçluluk, sefeh, gaflet, amme menfaatini ihlal etme halleri girer. Şer'iye sicilleri, fetva kitapları, kanunnâmeler, mühimme defterleri ve nizamnâmeler gibi tatbikatı aksettiren vesikalara bakıldığında, Osmanlı Devleti zamanında, hacre dâir şer'i hükümlerin bütün unsurlarıyla tatbik edildiği görülür. Bu tatbikat umumiyetle Hanefî mezhebi görüşlerinden hacre daha geniş bir saha tanıyan İmam Ebû Yusuf ve İmam Muhammed'in kavilleri üzere vuku bulmuştur."
