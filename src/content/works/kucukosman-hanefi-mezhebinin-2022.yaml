abstract: "Hadis alanında yapılan çalışmalarda mezheplerin oluşmasına sebep olan sosyal ve siyasal sebepler konusunda pek çok eser yazılmaya başlanmıştır. Bu amaçla yazılan kadim eserlerde ise tarafsızlık pek mümkün olmamıştır. Günümüzde yapılan çalışmalar ise genellikle karşılıklı ilişkiyi incelemekten ziyade ulemanın ilim anlayışını ortaya koymayı amaçlamıştır. Polemik tarzında yapılan çalışmalarda ise Hanefîler itiraz edilen konumda tutulmuştur. Bu çalışmada ise merkezde Ebû Hanîfe ve önde gelen talebeleri ele alınmıştır. Çalışmanın başında Ehl-i re'y ve Ehl-i hadîs kavramlarının mahiyetine ve bu iki ifadeyle kimlerin kastedildiğine dair tartışmalara değinilmiştir. Kurucu imamların hadis kabul şartları ya da akîde gibi temel meselelerde hadis ehliyle aynı çizgide olmakla beraber kendileriyle lafzî bazı farklılıklar yaşamışlardır. Buna rağmen aralarında büyük bir ayrılığın olduğunu bildiren rivayetlerin usul ve vakıaya aykırı olduğu muhakkaktır. Kelâmî konularda yaptığı açılımlarla hadis ehline de öncülük yapan kurucu imamların hadisçilerle ilişkisinde paralellik söz konusudur."
