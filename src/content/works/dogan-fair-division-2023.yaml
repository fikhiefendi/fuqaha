abstract: "Bir kaynağın, kaynak üzerinde birbiriyle çelişen mülkiyet iddialarında bulunanlar arasında paylaştırılması hususu, mikroiktisat literatüründe işbirlikçi oyun teorisi içinde adil paylaşım konu başlığı altında incelenir. Bu husus, ilgili literatürde ağırlıklı olarak, iddia sahiplerinin istemlerine karşılık gelen değerlerin toplamı ile kaynağın değeri arasındaki ilişki bağlamında ele alınır. Kaynağın nispeten kıt olması durumu talepler veya iflas problemi, nispeten bol olması durumu ise fazlalık paylaşımı problemi başlığında irdelenir. Kaynağın yerini katlanılacak bir külfetin, taleplerin yerini ise edinilecek ferdi faydaların aldığı durumlar ise maliyet paylaşımı problemi başlığı altında incelenir. Adil paylaşım problemlerine konu olan hukuki uyuşmazlıklar, nitelikleri gereği çok çeşitlilik gösterebilmektedir. Öyle ki literatürde bu problemler bağlamında ilk kez tetkik edilen ve daha sonra sıklıkla atıfta bulunulan uyuşmazlıklar ve bunların çözümleri Yahudiliğin temel metinlerinden biri olan Talmud'tan alınmıştır. Örneğin, Talmud'tan alınmış Nizalı Kumaş Probleminde, bir kumaşın uçlarından tutan iki kişiden biri kumaşın tamamının kendisine ait, diğeri ise kumaşın yarısının kendine ait olduğunu iddia eder. Talmud'tan problemin çözümü olarak alınan, genellenip kural haline getirilerek Vazgeçileni-ver-kalanı-böl Kuralı adı verilen tahsis yöntemine göre uyuşmazlık, sırasıyla kumaşın dörtte üçünün ve dörtte birinin iddia sahiplerine verilmesi suretiyle çözülür. Uyuşmazlık; ilk olarak Aristoteles'in Nikomakhos'a Etik (V) eserinde adı geçen, Aristoteles'in dağıtıcı adalet anlayışını karşılayan Orantılı Kurala göre ise sırasıyla kumaşın üçte ikisi ve üçte biri iddia sahiplerine verilerek çözülür. Literatürde incelenen uyuşmazlıklar arasında Talmud'tan derlenen tarihi problemler olduğu gibi daha güncel uyuşmazlıklar da adil paylaşım problemleri bağlamında modellenmiştir. Çoklu müze ziyaretine ilişkin gelir dağıtımı problemi, üniversite kaynaklarının bölümler arasında tahsisi problemi, spor etkinliklerinin TV yayınlarından elde edilen yayın gelirlerinin paylaşılması problemi, özellikle COV˙ID-19 pandemisi sürecinde gündeme gelen solunum cihazı dağıtımı problemi, uçakların piste iniş düzeninin belirlenmesi problemi literatürde ele alınan modern problemlerden bazıları olarak sıralanabilir. Literatürde, irdelenen tarihi ve güncel problemlere uygulanarak çözüm elde edilen kurallar Vazgeçileni-ver-kalanı-böl Kuralı ve Orantılı Kuraldan ibaret değildir. Literatürde, dağıtım yöntemi olarak tanımlanan kurallar arasında Sınırlandırılmış Eşit Kazanımlar Kuralı, Sınırlandırılmış Eşit Kayıplar Kuralı, Piniles'in Kuralı, Talmud Kuralı, Asgari Örtüşme Kuralı, ˙Ibn Ezra Kuralı, Rastgele Geliş Kuralı, Ardışık Öncelik Kuralı gibi birçok kural bulunur. Literatürde, güncelliğinden bağımsız olarak daha önce irdelenmemiş bir uyuşmazlığın adil paylaşım problemi bağlamında modellenmesi ve bu problemi çözmek için tanımlı kurallardan yararlanılması sıklıkla başvurulan bir yöntemdir. İlaveten, bazı problemlerle beraber sunulan yerleşik hale gelmiş tahsislerin dağıtım kuralı olarak tanımlanması da mümkün olmuştur. Bu durumlarda, tahsis yöntemlerinin benzersiz bir kural olarak tanımlanabilmeleri için aksiyomatik karakterizasyon yaklaşımı benimsenmiştir. Bu tezde de benimsenen aksiyomatik yaklaşım gereği, bir kural o kuralı karakterize eden özellikleri üzerinden tanımlanır. Uyuşmazlığa konu olan problemin çözümü için probleme uygulanan her bir kural tek değerlidir. Dolayısıyla, tanımlanan dağıtım kuralı, ele alınan problem için benzersiz bir çözüm önerisinde bulunur. Bu durumda probleme uygulanan her kural problem için farklı bir çözüm sunar. Aksiyomatik yaklaşım gereği, eğer bir probleme sunulan çözüm probleme genellenebilir belirli bir kural uygulanarak elde edilmişse kuralın özelliklerine bakılarak kuralı seçenin seçimi arkasındaki saikler bir ölçüde ayırt edilebilir. Örneğin, orantılı kural, literatürde yukarı yönlü bütünlük ve öz-ikililik adı verilen özellikler (aksiyomlar) vasıtasıyla karakterize edilir. Dolayısıyla, orantılı kuralın bu iki özelliğin işaret ettiği nosyonları barındırdığı ifade edilebilir. Bunun gibi, genellenebilir bir paylaşım yönteminin özellikler vasıtasıyla benzersiz bir kural olarak tanımlanmasına aksiyomatik karakterizasyon denir. Belirli problemler için aynı gerekçelere dayanarak aynı benzersiz çözümü sunan, genellenebilir kural haline getirilen uygulamaların aksiyomatik karakterizasyonu yapılarak uygulayıcıların adalet anlayışı aksiyomlar üzerinden kıyaslamalı olarak ve daha somut bir şekilde kavranabilir. İslam tarihi, adil paylaşım problemi olarak tanımlanabilecek hukuki meseleler ve uyuşmazlıklar ile dağıtım kuralı olarak genellenip karakterize edilebilecek tahsis yöntemleri bakımından oldukça zengindir. Sadece İslam miras hukuku kaynaklarında yer alan uyuşmazlıklar bile mikroiktisat literatüründe Talmud'tan derlenip incelenmiş problemlere kıyasla sayıca çok daha fazladır. Ancak ilgili mikroiktisat literatüründe bu İslam hukuku meselelerine ve de facto dağıtım yöntemlerine herhangi bir referans bulunmamaktadır. Benzer şekilde, ilgili İslam hukuku literatüründe de bu tür hukuki uyuşmazlıkların sistematik bir şekilde biraraya getirilerek incelendiği çalışmalar oldukça sınırlıdır. Mevcut çalışmalarda ele alınan uyuşmazlıklar ve dönemin hukukçularının önerdiği çözümler yalnızca sosyo-kültürel ve tarihsel bakış açılarıyla değerlendirilmiştir. İslam hukukundaki mezhepsel farklılıkların odağında yer alan konulardan birisinin miras hukuku olduğu düşünülünce özellikle miras hukuku uyuşmazlıklarında otoritelerin farklı çözümlerinin gerekçelendirilmesi için daha nesnel bir bakış açısına ihtiyaç olduğu açıktır. Bu tezde, İslam tarihinden adil paylaşım problemi olarak tanımlanabilecek hukuki meseleler ve uyuşmazlıklar, eğer varsa dönemin hukukçularının problemlere sundukları çözüm önerileriyle beraber İslam hukuku kaynaklarından derlenmiştir. Adil paylaşım problemi olarak tanımlanan uyuşmazlıklara klasik adil paylaşım kuralları uygulanarak bu kuralların sunduğu çözümler dönemin çözümleriyle kıyaslanmıştır. Kıyaslamalara riayeten tespit edilen benzerlikler ve farklılıklar doğrultusunda dönemin çözümleri genellenebilir paylaşım kuralı olarak karakterize edilmeye çalışılmıştır. Karakterizasyon öncesinde çözümlerin genellenebilir olup olmadığı hususu, ilgili İslam hukuku kaynaklarında yer alan çözüm gerekçelerine göre belirlenmiştir. Özellikler (ya da aksiyomlar), İslam ilkelerine uyumlulukları açısından irdelenmiş ve karakterizasyonlarda kullanılırken İslami değerlere uygun olacak bir şekilde adapte edilmiştir. Örneklendirmek gerekirse, el-Ferâizü's-Sirâciyye kaynağından Şurayhiyye meselesi; davaya konu uyuşmazlık, uyuşmazlığa dönemin otoritelerinden Hz. Ali'nin ve Kadı Şureyh'in çözümleri ve bu çözümlerin gerekçelendirmeleri ile beraber alınmıştır. Şureyhiyye adı verilen bu problem, talepler problemi olarak modellenmiş, probleme klasik adil paylaşım kuralları uygulanmıştır. Klasik kuralların önerdiği çözümler ile dönemin otoritelerinden Hz. Ali'nin ve Kadı Şureyh'in çözümleri kıyaslanmıştır. Klasik kuralların çözümleri ve dönemin çözümleri arasında tespit edilen ayniyet gereği kuralların eş kurallar olabileceği ihtimali üzerinde durularak dönemin paylaşımlarının kural olarak karakterize edilmesine çalışılmıştır. İslam hukukunun başka kaynakları da incelenerek dönemin otoritelerinin çözümlerini nasıl gerekçelendirdikleri araştırılmış, ve bu gerekçeler gereği çözümlerin genellenip genellenemeyeceği belirlenmiştir. Genellenebilen çözümleri dağıtım kuralı olarak karakterize edebilmek için adil paylaşım literatüründen kullanılabilecek özellikler tespit edilmiştir. Daha sonra bu özelliklerin İslam ilkelerine uyumlulukları incelenmiş, İslam ilkeleriyle çelişmeyen özellikler İslami değerlere göre adapte edilmiştir. Son olarak, dönemin otoritelerinin genellenebilir dağıtım yöntemlerini karakterize eden özellik kümeleri, klasik dağıtım kurallarını karakterize eden özellik kümeleriyle karşılaştırılmış, özdeşlik ve farklılıklar tespit edilmiştir. Bu sayede, siyasi ve tarihsel olarak yüzyıllar boyunca tartışılagelen, bazı mezhepsel anlaşmazlıklara kaynaklık eden hukuki meseleler daha önce ele alınmamış bir bakış açısıyla ele alınmış, aksiyomatik olarak değerlendirilmiştir. Literatürde sıklıkla ele alınan güncel ve tarihsel uyuşmazlıklara çözüm öneren kurallardan, Talmud'ta bahsi geçen Çekişmeli Kumaş Problemine sunduğu çözümle bilinen Vazgeçileni-ver-kalanı-böl Kuralı, Abraham İbn Ezra'nın (ö.1164/1167) çalışmalarına ithafen İbn Ezra Kuralı diye ve Musa bin Meymûn'a (ö.1204) ithafen Maimonides Kuralı diye adlandırılan kurallar farklı yazarlar tarafından belirli özellik kümeleri kullanılarak karakterize edilmiştir. Bu tezde, literatürde benimsenen yöntemlerden biri olan aksiyomatik yaklaşım kullanılarak, özellikle İslam miras hukukunda 'Avl Doktrini ve Red Doktrini adıyla anılan dağıtım yöntemleri genellenebilir kurallar olarak tanımlanmıştır. Bu dağıtım yöntemlerinin uygulandıkları uyuşmazlıklara klasik adil paylaşım kuralları uygulandığında, Orantılı Kuralın bu yöntemlerle aynı çözümü önerdiği tespit edilmiştir. Literatürde, Orantılı Kuralı karakterize eden özelliklerin İslam ilkeleriyle uyumlulukları irdelenmiş, özellikler İslami kontekste uyarlanarak her iki doktrinin de karakterizasyonunun aynı özellik kümeleriyle yapılabileceği gösterilmiştir. Böylelikle, 'Avl ve Red Doktrinlerinin Orantılı Kural ile sırasıyla talepler problemi ve fazlalık paylaşımı problemi bağlamında özdeş olduğu gösterilmiştir. Öte yandan, Talmud'ta bahsi geçen Nizalı Kumaş Probleminin iki farklı varyasyonunun İslam hukukunda yer aldığı tespit edilmiştir. Bu meselelere çözüm öneren Ebu Hanife'nin çözüm gerekçelerinin Vazgeçileni-ver-kalanı-böl Kuralı'nın gerekçesiyle aynı olduğu belirlenmiştir. Ayrıca, İslam hukukunda ikrar meselesi olarak nitelendirilen bir uyuşmazlık yeni bir adil paylaşım problemi türü olarak tanımlanmıştır. Bu problemin çözümü için dönemin otoritelerinden Ebu Yusuf'un önerdiği çözüm genellenebilir bir kural haline getirilmiştir. Probleme uygulanan klasik adil paylaşım kurallarından elde edilen çözümler arasında bulunan İbn Ezra Kuralının önerdiği çözüm ile Ebu Yusuf Kuralı çözümü arasında benzerlikler tespit edilmiştir. Gereği yapılan inceleme neticesinde iki tahsis yöntemi arasındaki tek farkın Ebu Yusuf Kuralında bulunan bir kısıt olduğu belirlenip bu kısıta atıfta bulunularak Sınırlandırılmış İbn Ezra Kuralı yeni bir adil paylaşım kuralı olarak tanımlanmıştır. Böylelikle Ebu Yusuf ve Sınırlandırılmış İbn Ezra yöntemlerinin identik olduğu sonucuna ulaşılmıştır. Sonuç olarak, bu tezde, İslam Hukukunun başlıca kaynaklarından derlenen talepler problemi ve fazlalık problemi bağlamında incelenebilecek/uyarlanarak incelenebilecek uyuşmazlıklar ve ilgili kaynaklarda yer alan çözümler derlenmiş, uyuşmazlıklar, ilgili kontekste uyarlanarak modellenmiş, ilgili çözümlerden genellenebilir kural vasfına sahip olanları kural olarak tanımlanıp özellikler aracılığıyla karakterize edilmiş, adil paylaşım literatürünün klasik kuralları bu uyuşmazlıklara uyarlanarak uygulanmış ve uyarlanmış klasik kuralların önerdiği çözümler eserde verilen çözümlerle aksiyomatik olarak kıyaslanmıştır. Benzerlikler gereği başvurulan özellikler İslami bağlama adapte edilmiş ve ilgili İslami dağıtımlar karakterize edilmiştir."
