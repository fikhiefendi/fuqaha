abstract: "12. yy'da yaşamış olan Cemâlüddin Ahmed bin Muhammed el-Gaznevi İslam Hukuku ve Usulü alanında derin bilgi sahibi olan ve bilhasasa Hanefi fıkıhı alimlerinin önde gelen isimlerindendir. Bu tez de onun eserlerinden biri olan ve arapça olarak yazılan“Mukaddimetü'l-Gazneviyye fil-Furu'il Hanefiyye”ele alınmaktadır. Eserin ana teması islam ibadet esaslarının ayet ve hadislerle izahıdır. İbadet esaslarının açıklanması konusunda önemli izah ve yorumlara sahip olan bu eseri gün yüzüne çıkartılıp tanıtılmasını amaçlayan bu çalışma, giriş, iki bölüm ve sonuçtan meydana gelmektedir. Giriş bölümünde eser ve yaptığımız çalışma hakkında genel bilgi verilmiştir. Birinci bölümde müellifin hayatı ve eserleri hakkında bilgi verilmiştir. İkinci bölümde eserin Arapçadan Türkçeye tenkitli tercümesi ile ayet ve hadislerin künyelerinin dipnotla gösterilmesi yer almaktadır. Aynı zamanda tercümeye anlam katan ve tercümede tercih edilen nüsha farklılıkları dipnotta açıklanmıştır. Üçüncü bölümde ise öncelikle eserin değerlendirmeye aldığımız Süleymaniye Kütüphanesine ait nüshaların tasnifi yapılmış ve diğer nüshaların özellikleri verilmiştir. Sonuç bölümünde ise müellif ve eserin muhtevası hakkında daha detaylı bahsedilmiştir. Ardından eserin son kısmına Hacı Beşir Ağa nüshası esas alınarak ayetlerin ve hadislerin dipnotta gösterilmesi suretiyle matbu hali, okuma kolaylığı sağlamak amacıyla noktalama işaretleriyle birlikte tenkitli bir metin oluşturulmuştur. Aynı zamanda dipnotta, eserin matbu hali ile diğer nüshalar arasında karşılaştırılmalara yer verilmiştir."
