abstract: "İslam hukukunun değişmez kaynaklara sahip olmasına rağmen değişen zamana ve koşullara nasıl uyum sağladığı her zaman sorgulanan konulardan biri olmuştur. Özellikle insanlık tarihinin belki de en büyük çaplı dönüşümünün yaşandığı modernleşme sürecinde din kaynaklı bir hukuk sisteminin geçirdiği evrim merak uyandıran meselelerden biridir. Bu çalışma söz konusu büyük çaplı değişim sürecinde genelde hukukun özelde ise hukukun uygulanma organları olan mahkemelerin iktidar ile olan ilişkisine odaklanmakta ve Nizamiye Mahkemelerinin Osmanlı iktidarı tarafından toplumsal kontrol aracı olarak kullanılmasını konu edinmektedir. Bu bağlamda, öncelikle toplumsal kontrol kavramının mahiyeti, geleneksel devletten modern devlete geçişte toplumsal kontrol açısından yaşanan gelişmeler ve bunların Osmanlı Devleti'ndeki yansımaları incelenmiştir. Akabinde, Nizamiye Mahkemelerinin öncülleri olarak niteleyebileceğimiz Tanzimat sonrası yargılama meclislerinin tarihi serüveni ve temel işleyiş yapıları incelenerek toplumsal kontrol açısından yaşanmaya başlayan dönüşüm tespit edilmiştir. Sonrasında tezimizin ana konusunu teşkil eden Nizamiye Mahkemelerinin toplumsal kontrol aracı olarak kullanımı, bu mahkemelerin temel yapısı, işleyişi ve somut yargı örnekleri üzerinden incelenmiştir. Çalışmada temel olarak dönemin hukuki düzenlemelerinden, arşiv kaynaklarından ve mahkeme kayıtlarından yararlanılmıştır. Bu kaynaklardan hareketle, modernleşen Osmanlı'nın yeni kurmaya başladığı devlet hukukunun (statutory law) ve bu hukukun uygulanma organı olan mahkemelerin karakteristik özellikleri tespit edilmiş ve Osmanlı'nın yeni hukuki düzenlemelerdeki temel hedefleri nelerdi ve hukuk ile mahkemelerin iktidar ile ilişkisi nasıldı sorularına cevap aranmıştır. Yapılan çalışma sonucunda modernleşen Osmanlı'nın ceza kanunlarında düzenlediği kurallar gibi ürettiği yeni devlet hukukunu merkezden taşraya kadar sıkı bir biçimde uygulamak için kurduğu Nizamiye Mahkeme teşkilatını toplumsal kontrol aracı olarak kullandığı tespit edilmiştir."
