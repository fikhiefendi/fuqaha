abstract: "İdam, tarih boyunca yeryüzünde farklı coğrafyalarda, çeşitli sebeplerle verilen cezalardan biridir. İran da geçmişte idam cezasını uygulamış ve idamı hala uygulayan ülkeler arasındadır. İran'da uygulanan idam cezalarının varlığı, özellikle son dönemlerde iletişim araçlarının(medya araçlarının) gelişmesiyle global alana taşınmıştır. Bu sebeple de farklı ülkelerde idam cezaları daha sık gündeme gelmektedir. İran'da uygulanan idam cezaları birçok açıdan eleştirilmektedir. Çalışmamızda İran'da uygulanan idam cezalarının İslam Hukuku açısından analizi yapılmıştır. Çalışmamız literatür taraması eksenli bir çalışma olup, her türlü öznel yargı ve değerlendirmelerden uzak bir şekilde betimleyici bir metot ile kaleme alınmıştır. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde İran'ın tarihi, coğrafi, kültürel, etnik ve dini yapısı hakkında genel bilgilendirme yapılmıştır. İkinci bölümde, İran'da uygulanan idam cezalarının analizi için İran Ceza Hukuku hakkında bilgilendirme, ceza hukukunun tarihsel seyri, İran'da uygulanan idam cezalarının tarihsel süreci ve kriterleri, son dönemde sosyal medyaya yansıyan idamlar hakkında bilgi verilmiştir. Üçüncü bölümde ise İslam Hukuku'nda ölüm cezası gerektiren suçlardan bahsedilmiş ve İran'daki idam cezaları İslam Hukuku açısından değerlendirilmiştir."
