abstract: "İslam hukuk tarihinde mezheplerin oluşumunu takip eden dönemde furu fıkıh birikimi üzerinde yapılan çalışmalar sonucu çeşitli yazım türleri ortaya çıkmıştır. Bunlardan biri de benzer meseleler arasındaki ince farkları konu alan furûk yazım türüdür. Çalışmamız, H. 4. asır Hanefi fukahasından Ebu'l-Fadl el-Kerâbîsî'nin Kitabu'l-Furûk adlı eserini, furûk literatürünün özelliklerini dikkate alarak analiz etmeyi amaçlamaktadır. Çalışma üç bölümden oluşmaktadır. Birinci bölümde furûk yazım türünün genel özellikleri klasik ve modern olmak üzere çeşitli kaynakların taranması sonucu bir araya getirilmiştir. İkinci bölümde müellifin hayatı yaşadığı dönem hakkında bilgi verilmiş ve Kitabu'l-Furûk adlı eseri çeşitli açılardan incelenmiştir. Üçüncü bölümde ise, kitabın temizlik, namaz, oruç ve zekar ile ilgili bölümleri analiz edilerek değerlendirilmiştir."
