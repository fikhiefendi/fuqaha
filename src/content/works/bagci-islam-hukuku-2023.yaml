abstract: "Kameri takvimin recep, zilkade, zilhicce ve muharrem aylarından oluşan haram aylar, Allah'ın gökleri ve yerleri yarattığı günkü yazgısında bulunan saygın zaman dilimleridir. Haram ayların İslam hukuku açısından araştırılacağı çalışmamızda giriş kısmında kavramsal çerçeve çizilecektir. Araştırma iki bölümden oluşacaktır. İlk bölümde oruç, hac, umre, kurban ve namaz gibi ibadetlerle haram ayların ilişkisi anlatılıp haram ayların kişinin kulluk bilincine olan etkisi irdelenecektir. İkinci bölümde haram aylar, insan ilişkileri (muamelat), ceza (ukubat) ve savaş hukuku açısından araştırılacaktır. Haram aylarda insanın zulüm ve kötülüklerden sakınmasıyla ilgili değerlendirmeler üzerinde durulacaktır. İkinci bölüm içerisinde haram ayların önemi, değeri, şiar oluşu ile ilgili ayetler ve yorumlar aktarılacaktır. Bu aylarda işlenen suçlara yönelik cezaların artırılması ile ilgili görüşler paylaşılacaktır. Haram aylar ile savaş hukuku arasındaki irtibatın tarihi seyrine kısaca değinilip İslam sonrası savaş yasağının devam edip etmediği ile ilgili ihtilaf izah edilecektir. Sonuç kısmında haram aylar hakkında günümüze yönelik değerlendirmelerde bulunulacaktır. Bilhassa zulüm, suç ve çatışmaların engellenmesi, devam eden savaşların ateşkes ile ara verilmesine yönelik haram ayların etkisi üzerinde durulacaktır."
