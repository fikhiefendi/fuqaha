abstract: "Din, inanış ve davranış şekillerini düzenleyerek insanların huzur içinde hayatlarını devam etmelerini sağlayan bir kurallar bütünüdür. Din duygusundan kaynaklanan hareketlerin diğer fiillerden farkı, doğruluğuna inanarak yapılmasıdır. Bu inanç fertle birlikte var olduğu için her fiil ve her düşünce dînî bir anlam ve değer taşır. Hareketlerine değer yüklenmesi insanı diğer canlılardan ayıran özelliktir. Hareketlerin ve yükümlülüklerin îslam açısından hükmünü araştıran fıkıh ilmi, dîne uygun fiili göstermesi bakımından Müslümanlara yardımcı olmaktadır. Bireyin hayatını tüm yönleri ile kuşatan bir inanç sisteminde, yeme-içme, giyinme-süslenme, eğlenme biçimleri, ev hayatı gibi karşılıklı hak unsuru taşımayan fiiller de îslam Hukuku'na konu olmaktadır. Özellikle Hanefî mezhebine ait fıkıh kitaplarında herhangi bir konu başlığı altında incelenmeyen, bireyin yaşamı içinde her an karşılaşabileceği problemler için yeni bir bölüm oluşturulmuştur. En yaygın kullanımı ile“kerâhiyet ve istihsan”adı verilen bu bölümün incelenmesi, yapılan çalışmanın temelini oluşturmaktadır. Değişen yaşam biçimi ve hayat şartları sebebi ile ortaya çıkan her yenilik doğrudan kabul edilemez. İslam'ın genel prensipleri ve öğretilerinin ışığında incelenir. Hükmü belirlenir. Dînî hassasiyetleri bulunan kimseler, yeni durumlar karşısında tavır belirlerken, inançlarına aykırı hareket etmemeye dikkat ederler. İslam âlimlerinin teklifi hükümlere getirdiği açıklamalar yanında, insan zihninde fiiller“serbest olanlar”ve“sakıncalı olanlar”şeklinde çok basit ikili bir ayrıma indirgenmiştir. İlgili fıkıh bölümüne ad olarak seçilen kelimeler de genel olarak bu ikili ayrımı yansıtır.“Dinen, ahlaken ve örfen hoş görülmeyen”anlamına gelen“kerâhiyet”; sosyal, dînî ve günlük yaşamda toplumun benimseyip güzel gördüğü davranışlar“ anlamındaki ”istihsan“; yasak ve serbest olan şeyler anlamında ”hazr ve ibâha“ ve ”haramlar ve helaller“ kavramları bu ikili ayrımı açıkça göstermektedir. Çalışmanın, daha verimli olması ve sağlam bir zemine oturması için öncelikle teklifi hükümler incelenmiştir. Burada mekruh, mendub ve mubah hükümlerinin kerâhiyet ve istihsan konuları ile yakından ilişkisi göze çarpmaktadır. Bununla birlikte mubah, helal ve caiz kavramlarının anlam genişlemesi ile insan zihnindeki ”serbest olanlar\"ı karşıladığı tespiti önemlidir. Klasik kaynaklarda bölümün işlenişi ve incelenmesi ele alındıktan sonra, bölümde yer alan konuların değerlendirilmesi yapılmıştır. Ahlak, örf ve görgü kurallarının hukukla ve İslam Hukuku ile ilişkisi incelenmiş, zaman ve mekanın değişmesi ile değişen ahlak, örf ve görgü kurallarının, fıkha etki edebileceği ve bu etkinin sınırları aktarılmıştır. Çalışmada son olarak yeme-içme, giyinme-süslenme, günlük hayat ve sosyal yaşamla ilgili dönemimizde ortaya çıkan meselelerden örnekler verilmiştir. Bu örnekler yeni yazılacak bir fıkıh kitabında ilgili bölüme girmesi muhtemel konulardan seçilmiştir. Hakkında hüküm belirtilmeyen konuşlarda, esas olanın serbestlik olduğuâlimler tarafından bir ilke olarak benimsenir. Bu bakımdan yenilikler karşısında sürekli olumsuz bir tavır içinde olmak doğru değildir. İslamiyet'in genel prensipleri ve çizdiği sınırların dışına çıkmadığı müddetçe yaşamı kolaylaştıran yenilikleri desteklemek gerekir. İslâmî kuralların maslahat prensibini gözettiği unutulmamalıdır. Kerâhiyet İstihsan Hazr îbâha Mekruh Mubah II"
