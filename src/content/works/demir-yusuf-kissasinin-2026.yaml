abstract: "Bu çalışma, Hz. Yusuf dizisi ve Kur'an-ı Kerim'deki Hz. Yusuf Kıssasını konu alarak dizinin ne kadarının Kur'an ayetlerine dayandırıldığını, ne kadarının harici kaynaklara dayandırıldığını ortaya koymayı amaçlamaktadır. Araştırmamızda, Kur'an-ı Kerim'in özlü anlatımı ile televizyon dizisinin görsel ve kurgusal detayları karşılaştırmalı bir analize tabi tutulmuştur. Bunun tespiti için Kur'an'da olup dizide olmayan, dizide olup Kur'an'da olmayan ve her ikisinde de ortak olan hususlara değinilmiştir. Ortaya çıkan sonuç doğrultusunda farklılıkların sebepleri üzerinde durulmuştur. Çalışmanın sonucunda Hz. Yusuf dizisiyle Kur'an'da ki Yusuf Kıssasının ana konular itibarıyla Kur'an'daki bilgilerle örtüştüğü görülmüştür. Dizide yer alan farklılıkların sebebi ise senaryo geçişlerinde boşlukları kurgularla doldurmak adına tefsir rivayetlerine ve İsrailiyattan edinilen bilgilerle doldurduğu görülmüştür. Bu bağlamda genel hatları itibarıyla Kur'an ve dizi arasında kısmi farklılıklar olsa da öz itibarıyla farklılıklar bulunmadığı saptanmıştır. Ayrıntılarda ve içerikte saptanan bu farklılıkların ihtilaf boyutunda olmadığını söylememiz mümkündür."
