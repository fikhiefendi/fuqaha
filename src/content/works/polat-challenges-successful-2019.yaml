abstract: "İyi tanımlanmış bir strateji formülize etmek her şirketin arzu ettiği bir şeydir. Şirketler bunun için danışmanlık hizmeti alırlar, zaman ve bütçe ayırırlar. Ancak birçok zaman stratejileri başarısızlıkla sonuçlanır. Bu durum çoğu zaman stratejinin iyi bir şekilde formülize edilmemesinden değil etkili bir şekilde icra edilememesinden kaynaklanır. Şirketler stratejilerini icra ederken bir takım zorluklarla karşı karşıya kalabilirler. Bu çalışmada araştırmacı bir vaka analizi gerçekleştirerek Kuveyt Türk'te stratejinin başarılı bir şekilde icra edilmesinin önündeki zorlukları tespit etmeye çalışmıştır. Bu amaçla farklı departman ve seviyelerden 20 kişi ile yüzyüze mülakat gerçekleştirilmiştir. Diğer yandan yapılandırılmış bir anket ve ikincil verilerle analiz desteklenmiştir. Araştırmacı bu çalışmada keşfedici araştırma yaklaşımını kullanmıştır. Çalışma neticesinde bulgular, farklı seviyelerden çalışanların stratejinin formülasyonu ve icrası aşamaları konusundaki algılarının farklı olduğunu göstermiştir. Diğer yandan katılımcılar tarafından stratejinin icrasında en çok karşılaşılan zorluklar olarak stratejinin formülasyonu, piyasa belirsizliği, stratejinin iletişimi, organizasyonel kültür ve hızlı değişen trend ve teknolojiler belirtilmiştir."
