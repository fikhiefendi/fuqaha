abstract: "Yıllardır hayatımızda olan, bazılarımızın yadırgadığı bazılarımızın inanmadığı bazılarımızınsa inancı itibarı ile hayatında yer alan Katılım Bankacılığı ürünlerinden Sukuku inceleyeceğiz. Çalışmanın amacı ekonomik hayatta giderek artan yeri ile katılım bankacılığını inceleyip sukuk ihraçlarının ekonomiler içindeki paylarını ve de katkılarını irdelemektedir. Katılım Bankacılığının tarihi ve tanımı ile başlayıp, kısaca ürünleri tanıtılacaktır. Netice olarak da Sukuk ürünü tanımlanıp Türkiye'de yapılan ihraçları incelenecektir."
