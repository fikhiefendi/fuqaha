abstract: "Şehitlik, İslâm dininde Allah yolunda canını feda eden kişiye verilen en yüce mertebedir. Bu kavram, Kur'ân-ı Kerîm ve hadislerde sıkça yer alır ve İslâm tarihi boyunca önemli bir rol oynamıştır. Şehitler, Allah katında en yüce mertebededirler. Cennette ebedi saadete kavuşacaklar ve birçok nimet ile ödüllendirileceklerdir. Şehitlerin aileleri de bu nimetlerden nasipleneceklerdir. Gazilik ise, Allah için savaşan ve yaralanan veya sakat kalan mümine verilen unvandır. Bu unvan, kişinin cesaretini, fedakarlığını ve kahramanlığını temsil eder. Türkiye'de şehitlik ve gazilik kavramları, tarihsel, kültürel ve toplumsal bağlamlarıyla derinlemesine incelenmesi gereken oldukça önemli konulardır. Bu kavramlar sadece birer statü veya maddi bir ödülün ötesinde, milli birlik ve beraberliğin, vatan sevgisinin ve kahramanlığın sembolü olarak kabul edilir. Ancak şehitlik ve gazilik kavramı dönemsel ve bölgesel olarak farklı tanımlanmıştır. Bu nedenle şehitlik ve gazilik kavramının araştırılması ve İslâm hukuku açısından oldukça önemlidir. Bu tez 'İslâm Hukuku Açısından Şehitlik ve Gazilik Kavramı' konusunu ayet ve hadisleri esas alarak konunun doğru anlaşılmasına katkıda bulunmak amacıyla kaleme alınmıştır. Yararlanılan kaynaklarda hadislerde şehitlik, diğer dinlerin şehitliğe bakışı, gazilerin bu durumlarda başa çıkma yöntemleri gibi örneklere yer verilmiştir. Bu çalışmada da diğer tezlere ek olarak Türkiye'de şehitlik ve gazilik kavramının tanımı ve sağlanan imkanların neler olduğu ortaya konmuştur."
