abstract: "Tuhfetu'l-Ahyar isimli eser Hanefi fıkhının en önemli eserlerinden biridir. Bu eser el-Haskefi'nin“Durril Muhtar”,“Ala Tenvir El Ebsar ”kitabına yazılmış bir haşiye niteliğindedir. Bu çalışmanın önemi, Hanefi fıkhının en önemli kitabı olan“Tuhfetu'l-Ahyar ale'd-Durri'l-Muhtar”kitabıyla ilgili derin bir çalışma olması ve bir nüshanın tefsir edilmiş olmasında da kendini göstermektedir. Fıkıh, araştırma, inceleme ve konuların açıklanması konusunda tanınmış bilgindir. Al-Mazari, haşiyesinde, aşağıdaki şekle göre özetleyebileceğimiz, ölçülü ve sağlam bir yöntem benimsemiştir: -Kitabın tamamına değil, sınırlı yerlere açıklık getirirken ve yorum yaparken nesnel bir yöntem benimsedi. -Belirsiz fıkıh terimlerini ve ifadelerini açıkladı. -Fıkıh meselerini meşrulaştı ve Hanefi mezhebine göre yönlendirdi, Bazen Şafii mezhebi gibi diğer mezhepleriyle karşılaştırıyordu. -Konu bazen Kitap ve Sünnet'ten çıkarsanmaktadır, ancak bu sadece küçük bir orandadır. -Görüşü konusunda fanatik değildi ve bazen bu konuda emin değildi, aksine araştırma, düşünme ve tefekkür için alan bıraktı. -Yazara çıkarılmış ve fikrini güçlendirmiş ve bazen tartışılmış ve düzeltilmiştir. -hadis rivayetinde hadislerden çok fıkhî kaynaklara dayanmış ve bunlardan çok azı ile hükmedilmiştir. -Araştırmacı tarafından incelenen kısım, namazla ilgili bazı konuları içermektedir: namazda sesli okuma, imamlık, sehiv secdesi, farz namazı idrak etme, namazı kaza etme gibi. -Bu çalışmada araştırmacı, yazmanın ilk nüshasını ana nüsha olan (a) harfiyle, ikinci nüshayı (b) ve üçüncü nüshayı (c) harfiyle ikisi karşılaştırmak için simgeleyen üç nüshaya dayanmıştır, Belgesel ve betimleyici yaklaşımı kullandı ve bunları bilimsel olarak Hanefi fıkhıyla ilgili bu büyük kitaba hizmet etmek için kullandı. -Araştırmacı, çalışmayı iki bölüme ayırmıştır; Birinci bölümde başyapıtın müellifi Al-Madhari Ibrahim Al-Halabi'yi, Al-Durr Al-Mukhtar'ın müellifi Ala Al-Din Al-Hasakfi'yi ve Tenvir El Ebsar'ın müellifi Al-Tamrtashi'yi tanıttı, tahkik edilen bölümde yazarın yaklaşımı ve kaynaklarına ilişkin açıklamalarla başyapıt kitabının tanımı ve sahibine ait olduğunu geçerliliği üzerine bir çalışma da yapmıştır. -İkinci bölümde ise metni incelemiş, haşiyede yer alan hadisleri ve etkileri çıkarmış, buradaki derin terimleri ve fıkhî terimleri netleştirmiştir. Ayrıca içerdiği kişilere tanıtmıştır."
