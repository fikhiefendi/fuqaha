abstract: "Katılım Fonlarının Sigortalanması, Yüksek Lisans Tezi, Ankara, 2008.Katılım bankaları, ülkemizde yirmi yıl süreyle özel finans kurumları adıyla faaliyette bulunmuş ve 2005 yılında çıkarılan Bankacılık Kanunu ile bu kurumların isim ve unvanları katılım bankası olarak değiştirilmiştir. Katılım bankalarında, özel cari hesap ve katılma hesabı olmak üzere iki türlü hesap bulunmaktadır. Bu hesaplardaki paralar da katılım fonu olarak ifade edilmektedir. Katılım fonları için 2001 yılına kadar herhangi bir sigorta güvencesi söz konusu değildi. Ancak 2001 yılında ülkemizde yaşanan mali krizden etkilenen bir özel finans kurumunun faaliyet izninin kaldırılması, bazı hesap sahiplerinin mağdur olmasına neden olmuş ve bu kurumlar için de sigorta gereksinimi ortaya çıkmıştı. Bunun sonucunda 4389 sayılı Bankalar Kanunu'nda değişiklik yapılarak 2002 yılında katılım fonlarını sigortalamak üzere Güvence Fonu adıyla yeni bir müessese kurulmuştur.Güvence Fonu, 2005 yılında çıkarılan Bankacılık Kanunu ile kaldırılarak katılım fonları mevduatla birlikte Tasarruf Mevduatı Sigorta Fonu tarafından sigortalanmaya başlamıştır. Ancak bu durum katılım fonlarının ve özelliklede bu fon içindeki katılma hesaplarının işleyiş yapısına uymamaktadır. Çünkü katılma hesapları kâr ve zarar ortaklığına göre çalışan hesaplar olup bu hesaplarda anapara garantisi de yoktur. Katılma hesaplarının bu şekildeki işleyiş farklılığından dolayı mevduattan ayrı olarak sigortalanması gerekmektedir. Ayrıca bu hesapların mahiyetine uygun olarak risk ayrımı yapılarak ve önceden olduğu gibi Güvence Fonu tarafından sigortalanması gerekmektedir."
