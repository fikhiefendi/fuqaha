abstract: "Sıhriyyet bağlarıyla kurulan ve toplumdaki her bireyin bakım ve temel ihtiyaçlarına cevap bulduğu aile kurumu, çeşitli nedenlerle her birey için aynı sosyal ve hukuki imkânları sunamamaktadır. Tezimizin temel konusu; çeşitli sebeplerle aile kurumundan mahrum kalan bireylerin hak ve yükümlülükleri ve ilgili şahıslara yönelik mevcut uygulamada yer alan sosyal içerikli koruyucu tedbirlerin fıkıh perspektifinden ele alınarak değerlendirilmesidir. Nitekim İslam dini gerek Kur'ân'ı Kerîm'de gerekse Hz. Peygamber'in öğretileriyle (s.a.v) kimsesiz çocukların hakları ve yükümlülükleri üzerine pek çok uygulama ve çözüm önerisi sunmuştur. Toplumsal değişmeler, yaşam koşullarının zorlaşması, aile içerisinde çocuğa yönelik şiddet, boşanmalar, evlilik dışı beraberlikler, ekonomik sıkıntılar, içki, kumar vb. kötü alışkanlıkların artması, savaşlarda, kazalarda ve afetlerde toplu ölümlerin olması, toplumun tüm yapılanmalarında etkisini göstermiş; bunun yanı sıra, fertler bazında en büyük etki bakıma muhtaç kimsesiz çocuklar üzerinde gerçekleşmiştir. Özellikle günümüzde sokaklarda yaşayan, çeşitli suçlara ve kötü alışkanlıklara karışan ve isimleri bu suçlarla anılan kimsesiz çocuklarla ilgili problemler toplumların sosyal bir gerçekliği olarak gerek resmi kurum ve kuruluşlar gerek sivil örgütler aracılığı ile çözüm beklemektedir. İbadet hükümlerinin yanı sıra hayatın her alanında düzenlemeler getiren İslam dininin kimsesiz çocuklar hususuna yaklaşımının ve çözüm önerilerinin tespiti bu araştırmanın amacını oluşturmaktadır. Çalışmamız giriş ve üç bölümden oluşmaktadır. Birinci bölümde çocukluk kavramı tanımlanarak çocuğun korunma hakkı ve çocukları korumanın genel amacı üzerinde durulmuştur. Akabinde koruyucu tedbirlere muhatap olan çocuklar günümüz uygulaması ile fıkhi perspektiften tanımlanarak konuya muhatap olan zümre sınırlandırılmıştır. Çocuklar hakkında günümüz uygulamasında koruma tedbirinin alınması ve sonuçlarının değerlendirilmesiyle birinci bölüm tamamlanmıştır. Çocuk için uzun vadeli aile yanında bakım modellerinden evlat edinme uygulaması ve fıkhi yönü bu araştırmanın ikinci bölümünü oluşturmaktadır. Son bölüm ise evlat edinme uygulamasına göre daha kısa süreli olmakla beraber hükümleri ve uygulanış yönüyle de pek çok yönden farklılaşan“Koruyucu Aile”ile“Kurum Bakımı”modellerinin izahı ve fıkhi açıdan değerlendirilmesini içermektedir. Araştırma esnasında söz konusu uygulamalar Medeni Hukuk/İslam Hukuku zemininde tarihsel süreçteki uygulamalar ile günümüz uygulamaları kıyaslanarak sunulmuştur. Çocukların korunmasını sağlayan resmi kurum“Aile, Çalışma ve Sosyal Hizmetler Bakanlığı bünyesinde Çocuk Hizmetleri Genel Müdürlüğü ”dür. Çocuk Hizmetleri Genel Müdürlüğü, sosyal hizmet ve yardım uygulamalarıyla korunmaya muhtaç çocuklara himaye sağlamayı amaçlamaktadır. Kimsesiz çocukların himayesi ve bakımı ile ilgili mevcut uygulamalar değerlendirildiğinde, söz konusu çocuklar açısından öncelikli tercihin aile yanında bakım olduğu fakat böyle bir ailenin bulunmaması durumunda ya da çocuk veya ebeveynden kaynaklanan bazı zorunlu sebepler bulunması halinde çocuk için kurum bakımının tercih edildiği tespit edilmiştir. Bu bakım yöntemlerinin uygulanma esasları ve İslam Hukuku'nun konu ile ilgili yorumu da araştırmanın esasını oluşturmaktadır. Nitekim Klasik Fıkıh kaynaklarında konunun“Lakît”ve“Yetim”başlıklarıyla izah edilmiş olması, İslam dininin tarihsel süreçte kimsesiz çocukların bakım ve himayesine kayıtsız kalmadığını göstermektedir."
