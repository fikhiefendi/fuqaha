abstract: "Bu çalışmada gıdalarda alkol kullanımının İslâm hukuku açısından incelenmesi amaçlanmıştır. Bunun için helâl gıda alanının en temel meselelerinden birisi olan alkol konusu ele alınmıştır. Özellikle etil alkolün ve içerisinde farklı şekillerde etil alkol bulunan gıdaların fıkhî hükmü tespit edilmeye çalışılmıştır. Öncelikle genel olarak alkoller hakkında bilgi verildikten sonra etil alkol ve gıdalarda bulunma şekilleri incelenmiştir. Etil alkolün ve içerisinde etil alkol bulunan gıdaların hükmünün tespit edilebilmesi için içkilerle alakalı Kur'an ve sünnette yer alan hükümler, mezheplerin ve günümüzdeki fetva kurullarının bu konudaki yaklaşımları verilerek değerlendirilmiştir. Yapılan araştırma ve incelemeler neticesinde etil alkolün hükmüyle alakalı olarak iki farklı yaklaşım tespit edilmiş ve bu yaklaşımlar delilleriyle birlikte incelenmiştir. Sonuç olarak etil alkolün İslâm'da kesin bir şekilde haram kılınan hamrdan (şarap) farklı olarak değerlendirilmesi gerektiği vurgulanmıştır. İçerisinde etil alkol bulunan gıdaların tüketilmesinde sarhoş edici miktarda olmaması ve sarhoş olmak kastıyla tüketilmemesi şartıyla bir sakınca bulunmadığı kanaatine varılmıştır."
