abstract: "Osmanlı Devleti hukuk sisteminde en önemli icra organı şer'i mahkemelerdir. Bu mahkemelerde, verilen kararlar ve merkezden gönderilen emirler şer'iyye sicillerine kaydedilirdi. Tez araştırma konusu olan 2/505 numaralı İstanbul Bâb Mahkemesi Şer'iyye Sicili bunlardan biridir. Adı geçen defterde İstanbul'un idari, sosyal, ekonomik ve kültürel yapısı hakkında bilgiler içeren kayıtlar bulunmaktadır. Defterde genel olarak tatlik, nafaka, alacak, sulh gibi konuları ihtiva eden hükümler yer almaktadır. Transkribi yapılan bu belgeler mukabilinde şehrin hukuki, idari, iktisadi ve içtimai alanlarına ait birçok konu değerlendirme yapılarak sonuca ulaşılmıştır."
