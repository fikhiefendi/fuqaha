abstract: "Sukuk, sermaye piyasalarında portföy çeşitliliğini artırmak amacıyla önemli bir yatırım aracı olmuştur. Bu portföy çeşitliliğinin artışı, sermaye piyasalarına daha fazla yatırımcının gelmesini ve daha fazla nakit akışını sağlayacaktır. Dini inanışları sebebiyle faizden kaçınan ve geleneksel finansal araçlara yatırım yapmak istemeyen yatırımcılar için değerlendirilmesi gereken bir fırsat olmuştur. Aynı zamanda, şirketlerin sermaye yetersizliği durumunda başvurdukları banka kredileri ve bu kredilerinden kaynaklanan borçların şirketlerin bilançolarında görülmesi durumu kredibilitesini düşürmekte ve rekabet gücünü zayıflatmaktadır. Bu olay gerek kamu gerekse özel sektörde etkisini göstermektedir. Bu gibi sebeplerden kaynaklanan yüksek enflasyon ve ekonomik krizler görülmektedir. Ülkemizde Sermaye Piyasası Kurulu tarafından kira sertifikaları olarak adlandırılan sukuk, Ortadoğu'da ortaya çıkmasıyla Malezya'da hızla yayılmış ve Dünya'da 2008 yılında yaşanan küresel krizle birlikte sukuk ihraçlarında önemli artışlar olduğu ve bu artışların ülkemizde de gerçekleştiğini görmekteyiz. İslami finansın, bu konuda daha koruyucu olduğunu ve çözümler sağladığı düşünülmektedir. Bu duruma açıklık getirebilmek adına geleneksel bonolar ile karşılaştırılarak, literatür araştırması ve bu konudaki görüşler dahilinde sukukun daha iyi anlaşılması amaçlanmıştır."
