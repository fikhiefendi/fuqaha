abstract: "Karabük Üniversitesinde yapılan bu araştırmada öğrencilerin İslamî finansal okuryazarlık düzeyleri, İslamî finansal okuryazarlık düzeyini etkileyen faktörler ve alt boyutları ele alınmıştır. 245'i kadın, 208'i erkek olmak üzere toplam 453 kişi üzerinde yapılan araştırma sonucunda elde edilen veriler titizlikle toplanmış ve IBM SPSS programında frekans analizi, güvenilirlik analizi, bağımsız örneklem t-testi ve korelasyon testi yöntemleri ile incelenmiştir. Finansal okuryazarlık düzeyinin alt boyutlarından İnanç Eğilimi boyutu ve Mali Tatmin boyutu cinsiyete göre farklılık göstermiştir. İnanç Eğilimi boyutu, Finansal Uygulama boyutu ve Dindarlık boyutları da okunan bölüme göre farklılık göstermiştir. Ayrıca katılımcıların yaşları ile İslamî finansal okuryazarlık düzeyinin alt boyutları arasında sadece Mali Tatmin boyutu açısından pozitif ve düşük düzeyde anlamlı bir ilişki bulunmuştur."
