abstract: "Akademik çevrelerde, usul ilkeleri ile fürû arasındaki ilişki tartışılmaktadır. Kimi akademisyenler bunların ayrı ele alınması gerektiğini savunurken, diğerleri ayrılmaz bir bütün olduğunu ileri sürmektedir. Araştırmamız, fıkıh usulünün fürû kitaplarındaki pratik yansımalarını inceleyerek bu tartışmaya katkı sunmaktadır. Hanefî fürûsunun usul üzerine inşa edilip edilmediği, usul-fürû ilişkisinin teorik veya pratik boyutları ve fürûnun kendine has özellikleri gibi temel sorulara cevap aramaktadır. Bu kapsamda, Hanefî mezhebinin temel fürû kitaplarından Bedâʾiʿu'ṣ-ṣanâʾiʿ'nin Tahâret, Beyʿ ve Sirkat bölümlerindeki fıkhî meselelerde usul kaidelerinin kullanımı ve konumu analiz edilmiştir. Araştırma içerisinde görüldüğü üzere usul ve fürû arasında birbirinden ayrılmasını engelleyen güçlü bir ilişki tespit edilmiştir. Kâsânî'nin bu ilişkiye verdiği önem, değerli bir fıkıh eseri ortaya koymasını sağlamıştır. Bu bağlamda fıkıh usulü işlevselliğini korumakta ve görevini etkin biçimde sürdürmektedir. Nitekim Kâsânî, fıkıh usulünü eserinde bazı amaçlar çerçevesinde kullanmıştır. Bunlardan bazıları şunlardır: Farklı mezhep imamlarının görüşlerine itiraz etmek, mezhebin kurucu imamlarının görüşlerini değerlendirmek, kendi görüşünü desteklemek, farklı görüşler arasında tercih yapmak, meşâyihin kavillerini elemek, Hanefî âlimlerinin görüşlerini eleştirmek ve birbiriyle çelişkili görünen rivayetlerdeki teâruzu gidermek. Ayrıca hüküm istinbatında da fıkıh usulünden yararlanmış, Hanefî usulü kaidelerini genellikle aynen uygulamış ve bunlara ek olarak farklı usul kaidelerinden de istifade etmiştir. Hakkında nas bulunmayan meselelerde gösterdiği tavır da gerçekten dikkat çekici olmuştur. Araştırmamızın sonuçları, fıkıh usulünün genel konumu ve işlevine dengeli yaklaşılması gerektiğini göstermektedir. Bu metodolojinin sadece tarihsel bir araç olduğunu düşünmek yanlış olduğu gibi, günümüz meselelerinin çözümünde tek başına yeterli olduğunu iddia etmek de hatalıdır. Dengeli yaklaşım, hem usul hem de fürûdan yeterince ve birlikte istifade etmektir. Bu sebeple, usul ile fürû arasındaki güçlü ve dinamik bağ bu araştırmada vurgulanmıştır."
