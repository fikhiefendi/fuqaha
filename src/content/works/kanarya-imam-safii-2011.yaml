abstract: "Bu çalışmada, İslam düşünce tarihine önemli katkılar sunan İmam Şâfiî'nin, alanında ilk eser olma özelliğini kazanmış olan“İhtilâfü'l Hadîs”isimli eserinin Hadîs ilmindeki yeri konu edilmiştir.Çalışma, giriş ve iki bölümden oluşmaktadır.Girişte araştırmanın, konusu, sınırları, amaç ve metodolojisi ele alınmıştır.Birinci bölümde, İhtilâfü'l Hadîs ilmi ile ilgili bilgiler verilmiştir.İkinci bölümde ise, İmam Şâfiî'nin“İhtilâfü'l Hadîs”eseri incelenmiştir. Şâfıî, sahih ve sabit olan hadîslerin ne Kur'an'la ne de birbirleriyle anlam uyuşmazlığı gösteremeyeceğinin altını çizmektedir. Eserde bazı usulî prensiplerden hareketle, İmam Şafii'nin muteârız hadîsleri çözüme kavuşturduğu görülmektedir.İmam Şâfiî, görünüşte ihtilâflı görünen hadîslerin arasını bulma anlamında cem'/ te'lif, (bu metod, diğerlerine göre daha fazla kullanılmıştır) bir hadîsin diğerinin hükmünü ortadan kaldırması anlamında nesh ve hadîslerin bazı yönlerinin diğerinden üstün olduğu anlamında tercih metodlarına başvurarak hadîsler arasındaki ihtilafı çözüme kavuşturmak istemektedir."
