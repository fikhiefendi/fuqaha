abstract: "Aile, toplumun dayandığı temel direklerden biri olarak belirgin bir öneme sahip olduğu toplumların ilk yapı taşıdır. Evlilik, bir insanın hayatında yaptığı en önemli sözleşmelerden biridir. Bu nedenle İslam Şeriatı, nişanlı çiftin evlenmeden önce göz önünde bulundurması için özel hükümler belirleyerek buna büyük önem vermiştir. İlişkinin doğru yolda ilerlemesi ve İslam şeriatının yozlaşma ve ayrılıktan uzak hükümlerine göre sağlam temellere dayanan sağlam bir aile kurmak. İslam'da nişanlılığın önemi göz önüne alındığında, bu konu hakkında (Ahkamu'l-Hitba va Kadayalra'l-Muasara'l-Mutaallikatu Biha Fi'l-Fikhi'I-Islami va Kanuni El-Ahvali'şŞahsilye El-Libiy) başlığı altında yazmayı tercih ettim. Bu çalışmada Libya Aile Hukuku ile İslam Hukuku arasında nişanlılık konusunda bir karşılaştırma yapmak için Libya Aile Hukuku'nu örnek olarak seçtim. Bu çalışma üç bölümden oluşmakta olup, birinci bölümde dil ve terminolojiye katılımın tanımı, İslam Hukukuna göre meşruiyeti ve hükmü ile Libya Aile Hukukundaki meşruiyeti ele alınmıştır. İkinci bölümde nişanlılığın amacı, görgü kuralları, yolları ve türleri ele alınmıştır. Üçüncü bölüm, hem İslam Hukukunda hem de Libya Aile Hukukunda nişanlılığın iptalinin hükümlerini her talep ve araştırmada güncel sorunlarla ilgili bir beyanname ile birlikte açıklamıştır. Bu araştırma, aşağıdaki gibi bazı önemli bulgularla sonuçlanmıştır: Nişan bağlayıcı bir sözleşme değildir ve sadece nişanın iptal edilmesi tazminat için mecburi bir neden değildir. Bir erkek ve bir kadın arasındaki evlilik ilişkisini gerçek Şeriat hükümlerinden uzak tutmaya çalışan yıkıcı fikirlerle yüzleşmenin yanı sıra. Ayrıca, evlenmek isteyen gençleri ve evlenmek üzere olanları eğitmeye çalışarak zamanımızdaki nişanlılıkla ilgili yanlış anlamaları düzeltmek ve onları İslam Şeriatındaki nişanlılık kararlarına uymaya teşvik etmek."
