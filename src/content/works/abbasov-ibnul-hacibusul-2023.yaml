abstract: "Bu çalışma, fıkıh usulü tarihinin en etkin isimlerinden İbnü'l-Hâcib'in usul anlayışını ve görüşlerini ortaya koymayı ve bu alanda yazdığı Muhtasaru'l-Münteha etrafında gelişen şerh geleneğini incelemeyi hedeflemektedir. Metafizik-mantık dili üzerine kurulu mütekellim usul yazımınının en iyi örnekleri arasında yer alan bu eser, fıkıh usulü tarihinde üzerinde en çok şerh ve hâşiye çalışmasına esas teşkil etmiş bir metin olması yönüyle temayüz eder. Bu çalışma, dört bölümden müteşekkildir. Birinci bölümde ilk olarak İbnü'l-Hâcib'in hayatı ve eserleri hakkında genel bilgiler verilmiş, sonrasında usul eserlerinin kaynakları, muhtevası ve sistematiği ortaya konulmuştur. İkinci bölüm İbnü'l-Hâcib'in usul görüşlerine hasredilmiştir. Bu bölümün ilk kısmında İbnü'l-Hâcib'in özellikle fıkıh usulü tasavvuru ve bu ilmin bütününe yönelik küllî bakış açısı değerlendirilmiştir. İkinci kısmında ise eserinde yer verdiği temel fıkıh usulü meselelerine dair görüş ve yaklaşımları ayrıntılarıyla incelenmiştir. Ayrıca diğer usulcülerden farklı olan bakış açılarına, usul konularıyla ilgili kendine özgü görüş ve yaklaşımlarına değinilmeye çalışılmıştır. Üçüncü bölümde İbnü'l-Hâcib'in el-Muhtasar'ı üzerine yapılan şerh ve hâşiye çalışmalarının dökümü verilmiş, eser üzerine niçin bu kadar çok şerh yazıldığı sorusunun cevabı araştırılmıştır. Dördüncü bölümde eser üzerine yazılan dört şerh ayrıntılı olarak tanıtılmış, kaynakları ve şerh üslubuyla ilgili özellikleri tespit edilmiştir."
