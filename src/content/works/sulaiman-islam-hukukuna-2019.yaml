abstract: "İnternet, ülkeler arasındaki coğrafi sınırları kaldırması ve dünyayı küçük bir köye çevirmeye yardımcı olması hasebiyle geçen yüzyılın sonlarından itibaren enformasyon alanında insan aklının ulaştığı en önemli buluşlardan biri sayılmaktadır. İnternet tıpkı diğer buluşlar ve iletişim araçları gibi tek seferde geliştirilmemiş, aksine soğuk savaş döneminde askerî amaçlar doğrultusunda peyderpey geliştirilerek uygar gayeler ve daha sonraları ticaret ve elektronik kontratların onaylanmasında kullanılmaya başlanmıştır. Modern dönem öncesi İslâm hukukunda elektronik akit bahsi geçmediği gibi bilinmiyordu da. Çünkü daha öncede değinildiği gibi 20. yüzyılın sonlarından itibaren bu kavram gündeme getirilmiş ve üzerinde konuşulmaya başlanmıştır. Bu kavram için ekonomi uzmanları tarafından birçok tanım öne sürülmüştür.“modern iletişim araçları yoluyla ve meşru bir şekilde bir malın başka bir malla değiştirilmesi”şeklindeki tanım bizim tercih ettiğimiz tanımdır. İslâm hukukunda elektronik ticaret akdinin meşruluğu ve keyfiyeti, ticaret akitlerindeki rıza ile beraber ispat kuralları, teslim etme ve teslim alma olanaklarının bu önemli alanda bir sözleşme özgörlüğü ve alışveriş kolaylığını ön görüyor. Öte yandan İslâm hukuku, yapılan akitleri yazılı bir şekilde kayıt altına almayı rıza nedenlerinden saymakta ve rızayı her akitte olduğu gibi özellikle ticaret akdinde insanlar arasındaki muamele ve ilişkilerin en önemli özelliği olarak addetmektedir. Bu açıdan çağdaş ve meşru fıkhî araştırmalar, ticaret alanına kolaylık getirmesi ve insanlara fayda sağlamasından hareketle, icâb ve kabul ilkelerinin de benimsenmesiyle Kur'ân-ı Kerîm ve sünnetten çıkarsama yaparak modern teknolojinin kullanılması yoluyla alışveriş akitlerinin gerçekleştirilmesine cevaz tanımaktadır. Elektronik akit, iki tarafın rızasıyla gerçekleşmektedir. Rızanın gerçekleşmesi de irade beyanının yanı sıra herhangi bir ifade yoluyla karşılıklı olarak yapılan akdin icâbı ve bu icâbın kabulüne dayanmaktadır. Konuşma, yazışma ve yaygın olarak kullanılan emoji ve göstergeler ile birlikte akit esnasında inkâr edilmesi mümkün olmayan bir uygulama ifade yolları arasında sayılmaktadır. İrâde beyanının da kişisel e posta ve özel bir web sitesi aracılığıyla gerçekleştirilmesinde bir mahszr görülmemiştir. Aynı zamanda irâde beyanı toplumda kabul gören genel yöntemlerle gerçekleştirilebildiği gibi görüntülü konuşma esnasında elektronik mesajlarla da gerçekleştirilebilmektedir. Aslında ifade ediliş tarzı dışında elektronik icâbın geleneksel icabtan bir farkı yoktur. Bununla birlikte icâb ve yüzyüze görüşmeye davet arasında icâbtan dönme olasılığının olup olmaması hususunda bir farktan söz edilebilir. Çünkü elektronik icâbta akdin onayıyla birlikte bir geri dönüş ve cayma söz konusu olamazken yüzyüze görüşmede onay sonrası olsa bile kişinin bir geri dönüş hakkı bulunmaktadır. Elektronik icâbın açık ve net olması, doğrudan belirli şahıs veya şahıslara yöneltilmesi ve istenilen düzeyde kesin olması gibi şartları da bulunmaktadır. Elektronik icâb için ön görülen genel şart ve kurallar aynı şekilde elektronik kabul için de geçerlidir. Elektronik kabulün, kabul ikonu ve butonuna basılması ve yapılan yükleme işlemleri esnasında ekranda yatay ve içi boş bir şekilde bulunan çizginin dolması gibi kendisine özgü yöntemleri de bulunmaktadır. Ayrıca bazen elektronik kabul, açık ve zımnî bir şekilde yapılmaktadır ama sukut, bazı istisnâi durumlar dışında bir elektronik kabul sayılmamıştır. Elektronik akit gibi alışverişin yapıldığı akit meclisleri de oldukça önemlidir. Genelde bu meclisler, hakikî ve hükmî olacak şekilde ikiye ayrılmaktadır. Hakiki meclis, alıcı ve satıcının bir ortamda birbirleriyle doğrudan iletişime geçerek ve birbirlerini duyacak şekilde icâb ile başlayıp kabul ile son bulan ya da tamamıyla reddedilen veya reddedilmeden feshedilen meclislerdir. Hükmî meclis ise genelde elektronik akitlerin gerçekleştirildiği alıcı ve satıcının satış esnasında hazır bulunmayıp birbirleriyle doğrudan temasa geçmediği meclislerdir. Elektronik akitlerin gerçekleşmesi sonrası yapılan ödemeler de elektronik ödemeler olarak bilinmektedir. Bu da satın alınan ürünün, hizmetin veya verinin yine internet üzerinden ücretinin verilmesi şeklinde gerçekleştirilmektedir. Bu anlamda“Elekrtonik ödeme, elektronik ticaretin özellikleriyle bir uyumluluk içindedir”denilebilir. Elektronik ödeme yöntemleri maddelendirilmek istense aşağıdaki gibi bir maddelendirmeye gidilebilir: Kredi Kartı: Bu kart, bankalar tarafından müşterilerine belirli bir dönemde istifade edilmek üzere belli bir miktarda limitle verilen ve anlaşmalı üye iş yerlerinde POS cihazı üzerinden belirlenen limit ve dönem dahilinde alışverişlerde kullanılabilen manyetik ve plastik yapılı bir çeşit ödeme veya borçlanma kartı şeklinde tanımlanabilir. Elektronik Havale: Bu yöntem, borçlunun bankalar veya bu işe tahsis edilmiş özel kurumlar aracılığıyla ürün bedelini alacaklının hesabına belli bir para cinsiyle havale etmesi şeklinde gerçekleştirilir. Elektronik Bankacılık: Cep telefonuna indirilen uygulama yazılımı veya internet bankacılığı üzerinden yapılan ödemeler için kullanılan bir tabirdir. Diğer Modern Elektronik Cihazlar: Bu cihazlarla internet üzerinden etkileşim gerçekleştirilmekte ve internet şebekeleri yoluyla karşılıklı iletişime geçilebilmektedir."
