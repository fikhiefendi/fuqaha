abstract: "Tezde gereksiz ayrıntılardan kaçınarak ilkin İmâm Bulkînî'nin hayatından bahsettim. Sonra çalıştığım kitabın Bulkînî'ye nispetinin sıhhatini gösteren bilgiler zikrettim. Daha sonra fıkhi davâbıtı, kaideleri ve nazariyyatı ayrıntılı bir şekilde tanıtarak fıkhi davâbıtla diğer ikisi arasındaki farkları açıkladım. Bu tezde İmâm Bulkînî'nin zikredilen eserinde belirlediği davâbıtı bir araya getirdim. Daha sonra dâbıtın tahlili başlığı altında, söz konusu dâbıtın araştırmada dayanılan anlamına göre bir dâbıt olup olmadığını tespit ettim. Eğer bu anlamda dâbıt sayılıyorsa, o dâbıtı çalışarak, onunla ilgili meselelerinin delillerini zikrettim. Bazı dâbıtlar, kelimenin lügavi manalarından bazılarına uygunluk arz etse de, kabul ettiğim ıstılâhî anlamlara uygun olmaması sebebiyle, dâbıt ismini almaya uygun olmayanları hangi sebeple çalışmama almadığımı zikrettim. Çalışmamda çoğunlukla itimat edilen Şafii kitaplarını dikkate aldım. Bazı meselelerde ise deliller konusunda ayrıntıya girmeden dört mezhep fakihlerinin meseleyle ilgili farklı görüşlerine değindim. Müellifin ölçülerinde işaret ettiği Şafii görüşlerini naklettim ve bu görüşlerden itimat edilenleri açıkladım. Eğer bir sebepten ötürü görüşlerden birine meylettiysem bunu açıkladım."
