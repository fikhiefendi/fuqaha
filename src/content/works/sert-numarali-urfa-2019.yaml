abstract: "Bu çalışma ile 213 Numaralı Urfa Şerʻiyye sicilinin (H.1290-1292/M. 1873-1875) 1-174 sayfaları arası transkripsiyonu ve değerlendirmesi yapılmaya çalışılmıştır. Bu kadı defteri Urfa'nın hususi olarak 1873-1875 yılları arasındaki davaları ihtiva eder. Bu belgelerde Urfa'nın mahkemeleri, sosyal hayatı, ticari hayatı ve dini hayatı incelenmeye çalışılmıştır. Ancak her ne kadar defterde geçen davalar Urfa'da geçen üç yılı kapsar ise de parça bütünün numunesi olması hasebiyle incelenen bu şerʻiyye sicili genel olarak Osmanlı'nın diğer bölgeleri hakkında da bilgi vermektedir. Şerʻiyye mahkemelerinin yetki genişliği sebebiyle birçok farklı konuda davaların olduğu görülmektedir. Kadı kayıtlarındaki davalardan birkaç örnek verilmesi uygun olacaktır. Mihr davalarında, nikah akdi yapılırken erkeğin kadına vadettiği mihri ödememesi durumunda kadın mahkemeye başvurarak mihrinin verilmesini talep ederdi. Mihr, İslam'ın kadına vermiş olduğu kadını korumaya yönelik bir haktır. Şerʻi kanunlar esas alındığı için kadın hakları yasal olarak koruma altındaydı. Gayr-ı müslim davalarına bakacak olursak; bu davalarda gayrimüslimler Müslümanlarla ve kendi aralarında yaptığı ticaret veya diğer ilişkilerde anlaşmazlık durumunda şerʻi mahkemelere başvurdukları görülmektedir. Bu olay gayr-ı Müslimlerin şerʻi mahkemelere olan güvenini gösterir. Defterde geçen başka bir kayıt türü de mülk satışı ile ilgilidir. Bu kayıtlarda mahkemelerin noter görevini üstlendiği görülmüştür. Kaza ve sancaklardaki resmi işlemler, genel olarak şerʻiyye mahkemelerinde görülürdü. Bu mahkemelerin başkanı da kadı idi. Bu çalışma sonucunda davalara konu olmuş Urfa'nın mahalle, köy ve kazalarında yaşayan insanların sosyal, ekonomik ve dini hayatları hakkında bilgiler tespit edilmiştir. Mahalle sakinleri olan Müslümanların kendi aralarındaki komşuluk bağlarının güçlü olduğu ve gayrimüslimlerle inanç farklılığından kaynaklı problemlerin olmadığı görülmektedir. Bunun yanında Bir Osmanlı şehri olan Urfa'nın kaza, köy, nahiye ve mahallelerindeki mimari yapılar olan cami, çarşı pazar, han, hamam, dükkan ve evleri hakkında bilgi edinilmiştir. Ayrıca Osmanlı Devleti'nin hukuk sisteminde, zimmi tebaanın ikinci sınıf vatandaş muamelesi görmediği, hukukun herkes için geçerli olduğu ve isteyen herkesin mahkemeye başvurabildiği söylenebilir."
