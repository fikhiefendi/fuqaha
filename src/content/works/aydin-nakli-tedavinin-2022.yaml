abstract: "Modern tıbbın ilerlemesine paralel olarak ortaya çıkan yeni tedavi metodları birçok dinî ve etik problemi de beraberinde getirmiştir. Modern tedavi yöntemlerinden biri olan kan nakli ile tedavi, gerek kanın İslam hukukuna göre taşıdığı vasıflar gerekse mükerrem olarak yaratılan insanın vücudundan bir parça olması gibi birçok sebeple uygulanabilirliği açısından tartışmalı güncel fıkhî konular arasında yerini almıştır. Kan nakli ile tedavi sadece İslam dininin tartıştığı bir konu olmakla kalmayıp, aynı zamanda benzer problemler çerçevesinde diğer semâvî dinlerin de tartıştığı bir mesele haline gelmiştir. Bu yönüyle kan nakli ile tedavi İslam ve Batı dünyasının gündemini meşgul etmiştir. Çalışmamız giriş ve sonuç hariç üç ana bölümden oluşmaktadır. Birinci bölümde İslam hukukunun tıp ilmine bakışı ile birlikte İslam dininin sağlık politikası genel bir çerçevede ele alınmış, akabinde tedavinin meşruiyeti ve âlimlerin tedavi konusundaki olumlu ve olumsuz yaklaşımları incelenmiştir. İkinci bölümde ise kan nakli ile ilgili temel bilgiler verilmiş ve bunun yanında konunun özünü teşkil eden tıbbî kavramlar izah edilmiştir. Ardından kan naklinin tarihsel gelişimi ve İslam dışındaki semâvi dinlerin kan nakli konusundaki görüşleri ele alınmış ve son olarak konu tıp etiği açısından tahlil edilmiştir. Üçüncü bölümde ise araştırmanın temelini teşkil eden kanın İslam hukukuna göre hükmü ve hükme etkisi bağlamında necis ve habîs vasıfları hakkında bilgi verilmiştir. Bu vasıflar ile birlikte insanın mükerrem yaratılışıyla da bağlantılı olarak âlimlerin kan nakli ile tedavi konusundaki olumlu ve olumsuz yaklaşımları delilleriyle birlikte tasnif edilmiştir. Bir sonraki adım olarak ise konu muamelât açısından ele alınmış, kanın satımı ve kan bankalarının dinî mahiyeti ortaya konmaya çalışılmıştır. Son olarak da kan nakli ile bağlantılı olarak İslam hukuku çerçevesinde dinleri farklı kişiler arasında kan bağışı ve naklin evlilik engeli oluşturması gibi çeşitli meselelere yer verilmiştir."
