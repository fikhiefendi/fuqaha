abstract: "Sınırlı bir ayni hak olan rehin hakkı, eşya üzerinde taşınır rehni ve taşınmaz rehni (ipotek) olarak kurulabilmektedir. Taşınmaz rehni sınırlı sayı ilkesine (numerus clausus) tabi olup, kanunda sayılan üç türden biriyle kurulabilir. Çalışmamızda bu rehin türlerinden biri olan ve uygulamada sıklıkla karşılaşılan ipotek incelenmiştir. İpotek Roma hukukunun son dönemlerinde teslimsiz rehin hakkıyla gerçekleşti. İpotek kişisel bir alacağı teminat altına almak amacıyla, halen mevcut olan veya henüz doğmamış olmakla beraber doğması kesin veya olası (muhtemel) bulunan her hangi bir alacak için taşınmaz malın karşılık gösterilmesi şeklinde, tapuda tescil ile kurulur. İpotek asıl alacağa bağlı feri bir hak olup, varlığı asıl alacağa bağlıdır. Asıl alacak sona erdiği durumlarda, asıl alacağa bağlı olan ipotek de sona erer. Rehne konu olacak taşınmazın mutlaka borç altına giren kişiye ait olması gerekmez. Taraflar arasındaki temel ilişkiye yabancı bir üçüncü kişi, alacak için kendi taşınmazını rehin verebilir. Kişi kendi borcu dışında, başkasının borcu için de kendi taşınmazını rehin verebilir. Kanundaki şartların yerine getirilmesi koşuluyla bir alacak için birden fazla taşınmaz rehin (ipotek) verilebilir (TMK m. 855- toplu rehin). İpoteğin kurulması için tapu siciline tescil gereklidir. Açıklık ilkesi tescili gerekli kılar. Tescilin geçerli olması için de kural olarak, geçerli bir iktisap sebebi ile taşınmaz malikinin yazılı tescil talebi gerekir. Kural bu olmakla birlikte kanunda“tescile tabi kanuni ipotek hakları”düzenlendiği gibi, bu kurala istisna teşkil eden tescile tabi olmayan rehin hakları da düzenlenmiştir. Alacağın miktarı Türk para veya yabancı para ölçüsüyle belirlenmektedir. Yabancı para üzerinden taşınmaz rehninin kurulması için bazı şartların gerçekleşmesi aranmaktadır. Bunların ilki, kredi niteliğinde gerçekleşmiş olan alacaktır. Diğeri ise, bu kredinin yurt içinde veya dışında faaliyette bulunan kredi kuruluşları tarafından sağlanmasıdır. Bir alacağı teminat altına almak amacıyla kurulan ipotekte, teminat altına alınan borç ifa edilmediğinde, rehinli alacaklı rehinli taşınmazı icra yoluyla sattırarak, satış parasından alacağını öncelikle temin etme hakkına sahiptir. Alacağın, muaccel olmasından önce yapılan, borçlunun, borcunu vadesinde yerine getirmediği takdirde rehinli alacaklının teminat konusu taşınmazın mülkiyetini iktisap edeceğine dair yapılan sözleşmeler geçersizdir. Borç ifa edilmediğinde alacaklı ipoteğin paraya çevrilmesi yoluna başvuracak ve icra organları yoluyla ipotekli taşınmazı sattırıp, satış parasından alacağını öncelikle temin edecektir. İpotekli taşınmaz borçluya ait olup, alacağı karşılamaya yetmezse borçlunun geriye kalan alacak için kişisel sorumluluğu devam eder. Teminatın kapsamı bakımından anapara ve üst sınır ipoteği şeklinde kurulan ipotek tescille kurulur. Tapu kütüğüne tescil ile kurulan ipotek alacağa bağlı bir feri bir hak olarak varlığını devam ettirir. Alacak sona erince, alacağa bağlı feri bir hak olan ipotekte sona erer. Ancak ipotek tapuda şekli olarak varlığını devam ettirir. Bu ipoteğin tapudan terki gerekir. Terkin rehinli alacaklının talebiyle veya rehinli alacaklı terkine muvafakat etmezse (terkin talebinde bulunmazsa), ipotekli taşınmaz malikinin açacağı terkin davası sonucu alacağı ilamla durumun tapuya işlenmesi sonucu, tapuda şeklen varlığını devam ettiren ipotek terkin ettirilir ve ipotek sona erer."
