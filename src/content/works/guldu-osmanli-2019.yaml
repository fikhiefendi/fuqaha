abstract: "Hüsün-kubuh konusu kelam ve fıkıh usûlünün kesiştiği disiplinlerarası bir konudur. Sadrüşşerîa dört mukaddime şeklindeki delilinde, konuya illet-ma'lûl birlikteliği içerisinde yaklaşmıştır. Ancak felsefe temelli bu yaklaşımla, kelam geleneğinde kabul edilemeyen nedenselliğe varmamak için delilini âdet teorisi yerine ahval teorisi üzerine kurmuştur. Delil, insan fiilinin zorunlulukla meydana gelmediğini ispatta literatüre orijinal bir katkı sunmuştur. Fatih döneminde dört mukaddime üzerine hâşiyeler yazılmış ve sonrasında bu bir gelenek haline gelmiştir. Bu çalışmada hüsün-kubuh konusunun, dört mukaddime şeklinde bir telif geleneği haline gelinceye kadar Hanefî fıkıh usûlü literatüründe hangi konular içerisinde ve hangi bağlamda tartışıldığını görmek amacıyla kronolojik bir okuma yapılmıştır. Daha sonra Sadrüşşerîa'nın dört mukaddime yazmasının gerekçesini belirlemek için kendi kaynakları ve ayrıca kelam kaynakları incelenmiştir. Fatih dönemi hâşiyelerinin literatüre katkılarını incelemek üzere öncelikle yazmaların kütüphane kayıtları belirlenmiştir. Sonrasında her bir hâşiye tek tek incelenerek, hâşiyelerin meseleyi ele aldığı konular tespit edilmiştir. Bu konular üzerinden hüsün-kubuh meselesinin nasıl tartışıldığı aktarılmıştır. Hâşiyelerde Sadrüşşerîa'nın delilinin İbn Sina felsefesi ile irtibatının kurularak incelendiği görülmüştür. Sadrüşşerîa'nın ahval teorisi ile insan iradesinin yaratılmamış olduğunu vurgulamasının, Mâturîdî kelamında daha önce net bir şekilde söylenmediği tespit edilmiştir. Bu yaklaşımının Fatih döneminde olmasa da sonraki dönemlerde Osmanlı âlimlerini etkilediği görülmüştür. Sadrüşşerîa'nın tabii alanda kabul etmediği zorunluluğu, fıkhî kıyasa uygulayıp uygulamadığı incelendiğinde ise onun fıkhî kıyastaki zorunluluğun savunucularından biri olduğu tespit edilmiştir."
