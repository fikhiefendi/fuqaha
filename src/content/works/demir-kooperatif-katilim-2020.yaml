abstract: "Kooperatifler, varoluşlarından bu yana birlikte yaşayan toplumların ortak ihtiyaçlarını giderebilmek için bir araya geldikleri demokratik kuruluşlardır. Büyüyen dünya ekonomisi içerisinde kooperatiflerde varlıklarını sürdürebilmek ve rekabet edebilmek için finansmana ihtiyaç duymuşlardır. Hem kendi bağımsızlıklarını korumak hem de finansal sorunlarını çözebilmek adına Kooperatif Bankaları kurulmuştur. 19.yüzyılın başından itibaren Kooperatif Bankaları ekonomik sistem içerisinde varlıklarını göstermiş birçok ülkede de ekonomik kalkınma veya krizlerle mücadele noktasında etkin rol oynamışlardır. Ancak dünya ekonomisinde önemli bir yere sahip olan İslam dünyası ve onun bir parçası olan ülkemiz için aynı sözleri Kooperatif Bankacılığı özelinde söylemek maalesef mümkün değildir. Bugün 1,5 milyardan fazla Müslüman yaşayan dünyamızda toplumların temel ihtiyaçları farklılıklar göstermiş, gelişen ekonomilerle rekabet, yetersiz sermaye gibi unsurlar, bu insanların ekonomik faaliyetleri sırasında finansal ihtiyaçlarının da artmasına neden olmuştur. Özellikle 1950'lerden sonra bu finansal ihtiyaçların çözümü için yapılan arayışlar bugünkü ismi ile Katılım Bankalarını ya da İslami Banka ve Finans kuruluşlarını ortaya çıkarmıştır. Katılım bankalarının gerek Dünyada gerekse Türkiye de ki uygulamalarına baktığımızda son zamanlarda Kamu tarafından açılanlar dikkate alınmadığında daha ziyade özel sektör kuruluşları olduğu, yani toplumsal bir hareketin ya da inancın organize bir hareketinin sonucu olmadıkları görülmektedir. Oysa böylesi kabul gören ve kökleri olan İslam dininin mensuplarının bu konuda daha proaktif olmaları beklenirdi. Bu çalışma ile kar ve zarar esasına dayalı bir finansman modeli olan Katılım Bankacılığı ile, dayanışma ve birlikte kalkınma amacıyla kurulan Kooperatifçilik faaliyetlerinin konsolide edilerek ülke ekonomisine, kooperatiflerin finansal sorunlarına ve Katılım Bankacılığının büyümesine katkı sağlayabilecek yeni bir finansal model olarak“kooperatif Katılım Bankacılığı”sistemini inceleyeceğiz."
