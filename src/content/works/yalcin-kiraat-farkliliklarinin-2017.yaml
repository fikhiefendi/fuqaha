abstract: "Allâh'ın kitabı Kur'ân-ı Kerîm'deki kırâat farklılıkları, âlimlerin üzerinde durdukları ve ciddi araştırmalar yaptıkları bir konudur. Çünkü kırâat ilmi açısından kırâatlar, Kur'ân-ı Kerîm'i oluşturan parçalardır. Her âlimin kendi alanı ile alakalı olan âyetlerin kırâatları üzerinde durduğu bir hakikattir. Lüğat âlimleri, kelime yapısındaki kırâat farklılıklarının, sarf (morfoloji) ilmine etkisi üzerinde dururken, nahiv âlimleri kırâatlardaki i'rab farklılıklarının nahiv ilmine etkisi üzerinde durmuştur. Aynı şekilde müfessirler kırâatlardaki farklılıkların tefsir ilmine, fakihler de kırâat farklılıklarının fıkhî hükümlere etkisi üzerinde durmuşlardır. Kırâatlar alt başlıklara sahip olmakla birlikte genel olarak, makbul/sahih ve merdûd/şâz şeklinde iki ana başlık altında incelenmektedir. Biz bu çalışmamızda, kırâatların mâhiyetini, kırâat imamları ile râvîlerinin kim olduğunu ve kırâatlardan fıkhî hükümlere etki eden örnekleri sunmaya çalışacağız."
