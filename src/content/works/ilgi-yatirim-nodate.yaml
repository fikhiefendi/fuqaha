abstract: "Tüm dünyada olduğu gibi ülkemizde de finans sektöründe yaşanan hızlı gelişmeler, İslamî finans kurumlarını ve katılım bankalarını sektördeki varlıklarını sürdürmekle birlikte yeni finansal ürünler geliştirerek müşterilerinin ihtiyaçlarını karşılamak zorunluluğuna itmektedir. Ancak katılım bankalarının kuruluş felsefesi gereği gerçekleştirdikleri faaliyetlerin İslam hukuku açısından uygun olması gerekliliği söz konusudur. Katılım bankalarının üzerine kurulu olduğu temel akit türü ortaklığa dayalı mudarebe ve müşareke akitleridir. Ancak henüz yeni sayılabilecek bir süre zarfında katılım bankaları tarafından vekâlet sözleşmesini esas alan bazı uygulamalar geliştirilerek yatırım vekâleti uygulamaları bir finansal ürün olarak sunulmaya başlanmıştır. İşte bu çalışmada katılım bankalarında uygulanan yatırım vekâletine dayalı finansal ürünlerin İslam hukuku açısından değerlendirilmesi ele alınmaktadır. Üç bölümden oluşmakta olan çalışmamızda konuyla ilgili teorik ve pratik veriler analiz edilerek Türkiye'de uygulanan şekliyle yatırım vekâleti uygulamaları yurt dışı örnekleriyle karşılaştırılmıştır. Birinci bölümde yatırım vekâleti tanımı, çeşitleri, şartları ve diğer benzer akitlerle mukayesesi yapılarak kavramsal olarak ele alınmıştır. İkinci bölümde ise yatırım vekâletinin hukuki niteliği, yatırım vekâleti ile ilgili vekilin yetkisi bağlamında tartışmalı konuların yanında ücret, kar ve sermaye konuları irdelenerek teorik yönü etraflıca ortaya koyulmuştur. Üçüncü bölümde ise yatırım vekâletinin Türkiye'deki hukuki alt yapısı, yatırım vekâletine dayalı fon yönetimi, sukuk ihracı, hesap uygulamaları ve diğer uygulamalar ele alınarak pratik çerçevesi titizlikle ortaya koyulmuştur. Sonuç olarak, yatırım vekâleti uygulamalarının genelde İslamî finans özelde ise katılım bankacılığına olumlu ve olumsuz katkıları olduğu ancak bu uygulamanın İslam hukukunun belirlediği çerçevede uygulanması durumunda sektörün gelişimine önemli katkılar sunacağı değerlendirilmiştir."
