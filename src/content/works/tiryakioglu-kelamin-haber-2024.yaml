abstract: "Kelâmi epistemolojinin fıkıh usûlüne yansıması, kelâmi öncüllerin fıkıh usûlü üzerindeki etki alanlarından biridir. Çalışmamızda, söz konusu yansıma Muʻtezile âlimlerinden olan Ebü'l-Hüseyin el-Basrî'nin (ö. 436/1044) Kitabu'l-Muʻtemed isimli eserinde ele aldığı haber teorisi bağlamında incelenerek tespit edilmeye çalışılacaktır. Zira el-Basrî, son dönem Mu'tezili bilginlerin önemli kelâmcılarından biri olmakla birlikte felsefe-kelâm çizgisinin ağır bastığı müteahhir kelâmcıların da atıfta bulunduğu önemli bir şahsiyettir. Kelâmi epistemolojinin usûl-i fıkıh üzerindeki etkisini haber teorisi bağlamında incelememizin nedeni İslâm düşüncesinin temel bilgi kaynakları olan Kur'ân, sünnet ve icmânın haber teorisiyle temellendirilmesi ve dolayısıyla ilk dönemlerden itibaren İslâm bilginleri tarafından teorik zeminde tartışılagelmesindendir. Konuyla ilgili izini sürdüğümüz el Basrî de hocası Kâdî Abdülcebbâr'ın (ö. 415/1025) ortaya koyduğu haber teorisini kelâmi öncülleri temel alarak sistematize etmiş ve kendinden sonraki usûlcülere kaynaklık etmiştir. Çalışmada başta müellifimizin eseri olmak üzere klasik dönem bilginlerinin haber meselesini nasıl ele aldığı mercek altına alınmış el-Basrî'nin fıkıh usulü literatürüne katkısı değerlendirilmiştir. Karşılaştırma, analiz, sentez, tenkit ve değerlendirme metotları kullanılarak ortaya çıkan görüşlerin kelâmi öncüllerden ne kadar etkilenip etkilenmediği tespit edilmeye çalışılmıştır. Araştırmanın neticesinde el-Basrî'nin usûl-i fıkıhın pek çok meselesinde olduğu gibi epistemolojik yapısında da kelâmı merkeze alan bir yaklaşım sergilediği görülmüştür."
