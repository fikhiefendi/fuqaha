abstract: "İlk kurulduğu yıllardan itibaren hak ve hukuka büyük önem veren Osmanlı Devleti, en küçük yerleşim birimlerine kadar adaleti sağlamak için kadılar vasıtasıyla Şeriat Mahkemeleri'ni kurmuştur. Şer'i ve örfi kuralların birlikte uygulandığı Osmanlı hukuk sistemi, devletin güçlü olduğu dönemlerde mükemmel işleyişini sürdürmüştür. İlerleyen yıllarda iç ve dış gelişmelere bağlı olarak, devletin temel kurumlarında yapılması gereken yeniliklerden Osmanlı yargı kurumu da nasibini almıştır. Tanzimat ile birlikte Klasik dönemden farklı olarak, Osmanlı mahkemelerinin yapısında, işleyişinde ve mahkeme kararlarının dayandığı esaslarda köklü değişikliklere gidilmiştir. Şer'i kuralların yerini, çeşitli tarihlerde oluşturulan ve Avrupa örneğine göre düzenlenen ceza kanunları almıştır. Bu dönemdeki tüm mahkeme uygulamalarının kaydedildiği şer'iyye sicilleri, her ne kadar zengin belge çeşitliliğine sahip olmasa da oluşturulduğu bölgenin siyasi, ekonomik, sosyal ve kültürel özelliklerini yansıtan doyurucu bir özelliğe sahiptir. 310 No'lu Tarsus Şer'iyye Sicili de bu açıdan önemli bilgiler ihtiva etmektedir. Tezimizde, 1866- 1873 tarihleri arasında Tarsus'ta mahkemeye intikal eden olaylardan hareketle, somut verilerin ışığında hem söz konusu sicilin hem de o dönem Tarsus'unun çok yönlü özellikleri ele alınıp incelenmiştir."
