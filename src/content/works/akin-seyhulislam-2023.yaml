abstract: "Zekeriyyâzâde Yahya Efendi, üç ayrı dönem halinde toplamda on sekiz yılı aşan bir süre zarfında, Osmanlı Devleti'nin en önemli makamlarından birisi olan Şeyhülislâmlık görevini başarıyla yürütmüş mümtaz şahsiyetlerdendir. Görev hayatının büyük bir bölümü de devletin yapısını yeniden güçlendiren IV. Murad'ın padişahlık dönemine tekabül etmektedir. Bu makamda bulunduğu süre zarfında dini, hukuki, idari, siyasi ve ictimai konuları ihtiva eden çok sayıda fetvaya imza atmıştır. Bu fetvalarıyla dini ve hukuki yapıya, idari kararlara ve ictimai hayata yön vermiştir. Fetvalarının etkisi sadece yaşadığı dönemle sınırlı kalmamış sonraki çağlara da ulaşmıştır. Zira onun vermiş olduğu fetvalar, Fetâvâ-yı Yahya Efendi adıyla derlenerek bir mecmua haline getirilmiş ve istinsah edilerek sonraki dönemlerde de müracaat kaynağı olarak kullanılmaya devam etmiştir. İşte bu tez Yahya Efendi'ye ait fetvaların ibadetler, aile ve ceza hukukuyla ilgili olanlarını fıkhi açıdan incelemeyi amaçlamıştır. Çalışmamız bir giriş, dört bölüm ve sonuçtan oluşmaktadır. Giriş kısmında tezimizin konusu, kapsamı, amacı, önemi, yöntem ve kaynakları hakkında bilgi verildi. Birinci bölümde Yahya Efendi'nin hayatı, eserleri, yaşadığı dönemin hukuki, siyasi ve ictimai yapısı ele alındı. Fıkhın ibâdât, münakehât, muâmelât ve ukûbât şeklindeki dörtlü tasnifi de göz önünde bulundurularak ikinci bölümde ibadet hayatına dair fetvalar, üçüncü bölümde nikâh ve talâk konuları başta olmak üzere aile hayatına dair fetvalar, dördüncü bölümde ise ceza hukukuna dair fetvalar fıkhi açıdan incelenmeye ve değerlendirilmeye çalışıldı. Sonuç kısmında ise çalışmamızdan elde edilen sonuçlar zikredildi. Fetâvâ-yı Yahya Efendi içerisindeki fetvalarda ibadetlere dair meselelerin az, aile, ticaret ve ukûbât konularını içine alan muâmelâta dair meselelerin ise çok olduğu görülür. Fetvalar hayatın içinde yer alır ve hayatta karşılaşılan tüm fıkhi sorulara cevaplar vermeyi ve çözümler üretmeyi amaçlar. Yahya Efendi cevaplar verirken, çözümler üretirken müntesibi bulunduğu ve aynı zamanda devletin resmi mezhebi kabul edilen Hanefî mezhebine daima bağlı kalmıştır. Büyük çoğunlukla mezhep içerisindeki müftâ bih görüşlerle amel etmeyi tercih etmiş, zaman zaman da bu kuralın dışına çıkmıştır. İki görüş arasında kaldığında ise genellikle ihtiyata uygun olanı tercih etmiştir."
