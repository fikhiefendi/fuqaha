abstract: "12. yüzyılın sonu ile 13. yüzyılın başları arasında yaşamış olan Azîz Nesefî, tasavvuf alanında önemli eserler bırakmıştır. Bu çalışmanın konusu olan Zübdetü'l-Hakāik, Nesefî'nin geriye bıraktığı önemli eserlerden sadece bir tanesidir. Üzerinde çalıştığımız eserinin Farsçadan çevirisini, Hacı Hüseyinzâde olarak da tanınan Mısırlı Âlim Seyyid Hâfız Muhammed Ayintâbî yapmıştır. Ayintâbî tercümesine yazdığı mukaddimede eserin Mebde' ve'l-Me'âd'ın muhtasarı olduğunu belirtir. Ardından Nesefî'nin ifadelerindeki vecizliğinin, bu kitabı okuyacak kişilere pek çok feyizler vereceğini belirtir. Zübdetü'l-Hakāik adlı eserde Nesefî, âlemi (âlem-i kebîr) ve insânı (âlem-i sağîr) ele alır. Kitap üç babtan ve her bab da üç asıldan oluşmaktadır. Nesefî konuları ele alırken önce şerî'at ehlinin, sonra hikmet ehlinin, en sonunda da vahdet ehli olarak bilinen sûfîlerin görüşlerini ele alır. Konuları diğer eserlerinde de görüldüğü gibi doğrudan muhatabına seslenerek sohbet tarzında işler. Çalışma üç bölümden müteşekkildir. Önce literatür taraması ve Nesefî ile alâkalı yapılan çalışmalara yer verildi. Akabinde eserin mütercimliğini yapan Ayıntâbî Seyyîd Hüseyinzâde hakkında malûmat verildi. Devamında müellifin hayatı, şahsiyeti, yaşadığı yüzyılı ve eserleri hakkında bilgiler verildi. Daha sonra Zübdetü'l-Hakāik'te geçen tasavvufî kavramlar, ilk dönem tasavvuf klasik eserlerinin yanı sıra İbnü'l-Arabî ve Gazzâlî'nin görüşleri etrafında karşılaştırmalar yapıldı. Çalışmanın son bölümünde ise eserin Osmanlıca'dan günümüz Türkçe'sine yapılan çevirisine yer verildi."
