abstract: "Küresel ve ulusal finansal krizlerin tanımlama parametrelerinin içerisinde, bankacılık sektörü önemli bir unsur olarak yer almaktadır. Para krizi, sistematik kriz ve dış borç krizi ile birlikte bankacılık krizi, işletmelerin faaliyetlerini sürdürme noktasında darboğazlarla karşılaşmaları gibi şoklarla karşı karşıya kalması sonucunu doğurmaktadır. Bu çalışma, konvansiyonel bankacılık sisteminin alternatifi olarak varlığını konumlandırmaya çalışan ve finansal sistem içinde faaliyet gösteren katılım bankalarının finansal kriz dönemlerinde KOBİ ve ticari müşterilerinin memnuniyet düzeylerini değerlendirmeyi amaçlamaktadır. Finansal kriz etkilerini gidermeye yönelik olarak katılım bankalarının Türkiye'deki işletmelere katkısını ortaya koyan ilk çalışmalardan olması, çalışmanın önem kazanmasını sağlamaktadır. Çalışmanın amacı doğrultusunda, Türkiye'de 1994 ile 2020 yılları arasında yaşanan finansal krizler dönemine yönelik bu finansal kriz dönemlerinde ve sonrasında faaliyette bulunan; halen faaliyetlerini sürdürme koşulunu dikkate alarak üç katılım bankasının“Türkiye Finans Katılım Bankası A.Ş., Kuveyt Türk Katılım Bankası A.Ş. ve Albaraka Türk Katılım Bankası A.Ş”müşterilerine Türkiye genelini yansıtacak şekilde 428 katılımcıdan oluşan bir örnekleme anket uygulanmıştır. Çoğunluğunu Marmara bölgesindeki işletmelerin cevapladığı anketlerden elde edilen veriler, standart sapma ve aritmetik ortalama değerleri kullanılarak anlamlandırılmış;“Kruskal Wallis-H ve Mann-Whitney U”testleri uygulanarak bağımsız değişkenler açısından farklılık analizleri gerçekleştirilmiştir. Çalışmanın bulguları, ankette yöneltilen soruların neredeyse tamamında işletmelerin memnuniyet düzeylerinin yüksek olduğunu göstermektedir. Ancak ürün ve hizmetlerin; ücret ve komisyonları ile kredi limit ve teminatlarındaki memnuniyet düzeyi katılım bankalarına duyulan güven ve bağlılığa nispetten düşük olduğu sonucuna varılmıştır. Farklılık analizleri sonucunda anketi cevaplayan firma yetkilisinin, firmanın ortağı olup olmadığı ve finanstan sorumlu olma durumu, firmanın cirosu, katılım bankaları ile çalışma süresi, firmanın ithalat-ihracat yapma durumu, firmaların faaliyet süresi, firma türü ve diğer bağımsız değişkenler açısından farklılıklar bulunduğu görülmektedir. Bu araştırmada varılan diğer bir sonuç ise; bireysel ve ticari müşterilerin katılım bankalarına yönelik minnettarlığını ve takdirini en çok artıran davranışın, sıkıntı yaşadıkları zamanlarda kendilerine verilen destek olduğu ve bunun da müşteri memnuniyetini ve katılım bankasına olan bağlılığı artırdığıdır."
