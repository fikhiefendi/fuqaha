abstract: "Hicrî VI. asır Hanefî âlimlerinin önemli sîmâlarından olan Burhâneddîn el-Merğînânî'nin el-Hidâye'si yıllar boyu medrese ve İslam hukuku alanında eğitim veren kurumlarda okunmuş ve okutulmuştur. Günümüzde hala geleneksel eğitim veren kişi ve kurumların vazgeçilmez kitapları arasındadır. Merğînânî, eserinin birçok yerinde“zâhirü'r-rivâye”ifadelerine yer vermiştir. Ancak bu ifadelerden hangileri ile Muhammed b. Hasan eş-Şeybânî'nin eserlerini kastettiği, Muhammed b. Hasan'ın eserlerini kastettiği yerlerdeki nakillerinin tamamında isabet edip etmediği ve isabet ettiği yerlerde konunun Muhammed b. Hasan'ın zâhirü'r-rivâye eserlerinin hangisinde yer aldığı konuları kapalı kalmıştır. Bu araştırmada bahsi geçen konuların açıklığa kavuşturulması hedeflenmiştir."
