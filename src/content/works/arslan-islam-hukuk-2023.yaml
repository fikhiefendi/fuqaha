abstract: "Bu çalışmada abdest esnasında bez çorap üzerine giyilen mestler üzerine mesh etme meselesi ele alınmıştır. Bu tür mestler üzerine mesh etme hakkında 14. asırda Osmanlı fukahâsı tarafından caiz olduğuna dair fetva verilmesi üzerine halk arasında uygulanagelen bir yöntem olmuştur. Ancak 16. yüzyıl ortalarında mutad olan bu uygulama için şeyhülislam Çivizâde Muhyiddin Mehmed Efendi'nin mezhepte nakil olmadığı gerekçesi ile caiz olmadığına dair fetva vermesi üzerine tartışmalar başlamıştır. Zira abdestin farz mahalli olan ayaklara yapılan işlem geçersiz olduğunda hem abdest ve hem de bu abdestle yapılan ibadetler geçersiz olmaktadır. Bu sebeple konunun açıklığa kavuşması için Kanuni Sultan Süleyman fukahâdan araştırma yapmalarını istemiştir. Bu vesile ile birçok mesh risâlesi kaleme alınmış ve Çivizâde'nin görüşü kabul görmemiştir. Ebussuûd Efendi Osmanlı şeyhülislamları arasında öne çıkmış âlimlerden biridir. Bez çorap üzerine giyilen mestler üzerine mesh etme meselesinin çok tartışıldığı bu dönemde Ebussuûd Efendi, bu tür bir meshin caiz olmadığı yönünde fetva vererek risâle yazan Çivizâde'ye reddiye niteliğinde ve bizim de konu olarak seçtiğimiz Risâle fi'l-mesh 'ale'l-huffeyn adlı eserini kaleme almıştır. Ebussuûd Efendi'nin bu eseri üzerine kapsamlı çalışma yapılmamış olması sebebiyle bu eserin değerlendirilmesi yapılmaya çalışılmıştır. Eserde yer alan tartışmalı konular ve Ebussuûd Efendi'nin görüşleri tespit edilmiştir. Buna göre mevcut mutad uygulamanın meşru olduğu sonucuna ulaşılmıştır. Ebussuûd Efendi'nin klasik fıkıh kaynaklarına yaptığı atıflar onun bunlara en ayrıntısına kadar vakıf olduğu, bunları istidlal ve tahric gibi yöntemlerle şartlara uygun bir şekilde anlama ve uygulamaya aktarma gayreti içinde olduğu ve körükörüne lafza bağlılığı önerenlere karşı da gelişime açık hukuk geleneğini muhafaza konusunda mücadele ettiği anlaşılmıştır."
