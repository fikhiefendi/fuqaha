abstract: "ÖZET İslam hukukunda,“bir malı değerinin altoda bir bedel karşılığında satma veya değerinden fazla bir bedel karşılığında satın alma suretiyle aldanma”manasında kullanılan“gabin”kavramı, rızayı sakatlayan ve akdi fasid kılan ayrı bir sebep olarak görülmemiş, rızanın ihlal edildiğini veya haksız bir zararın bulunduğunu gösteren objektif kriterlerin bulunması nispetinde gündeme gelmiştir. İslam hukukçularının büyük çoğunluğunun benimsediği görüşe göre, bir akitte meydana gelen gabnin fahiş olup olmadığını belirlemede, o akde ve bölgeye ait âdetin ölçü alınması gerekir. Mezhepteki kuvvetli görüç bu oknakla birlikte, Hanefî fikıh alimlerinin önemli bir kısmı, örf ve âdet ölçüsünü daha açık hale getirebilmek için“bilirkişinin tespit ettiği değere dahil olan”bedeli“gabn-i yesîr”, bunun altında veya üstündeki bedeli ise“gabn-i fahiş”kabul etmişlerdir. Yine İslam hukukunda“bir kimseyi istenen yönde bir irade beyanında bulundurmak için onda yanlış bir kanaat uyandırarak veya mevcut bulunan hatalı fikrin devamını sağlayarak yanıltma”anlamında kullanılan“tağrîr”kavramı, İslam hukukçuları tarafından buna maruz kalan tarafın iradesinin oluşumunun bozulmasının veya rızasının sakatlanmasının sebebi olarak nitelendirilmektedir. Buna göre, akdi icra etmeye yönelik tercihte hulunsa bile tağrîr'e maruz kalan tarafın, gerçekte akde rızası bulunmamaktadır. O halde tağrîr, söz konusu sebeplerden dolayı sözleşmenin feshine, fiyat mdirirnine ve hatta tazminat talebine imkan vermektedir. Çalışma boyunca mukayese metodu takip edilerek Hanefî, Mâlikî, Şafiî ve Hanbelî mezheplerinde konuyla ilgili görüşler incelenmiş ve bu mezheplere göre tağrîr bulunmadıkça sadece gabn-i fahiş gerekçesiyle akdin feshedilemeyeceği görüşünün doktrinde muteber kabul edildiği sonucuna ulaşılmıştır. Genel olarak yapılan doktrin çalışmasından sonra, İbn Âbidîn'in araştırma konusu olarak seçilen“Gabin Risâlesi”nin metin ve muhteva yönünden incelenmesi, onun yukarıda zikredilen doktrin görüşü içinde hareket ettiğini göstermektedir. Sayda Müftüsü ve onun Nâib'i tarafından, sadece gabn-i fahiş gerekçesiyle akdin feshedileceği yönünde verilen fetvanın zâhiru'r-rivâyeye aykırı olduğunun ve aldatma unsuru bulunmadan aldanan kişinin fahiş oranda aklanmış olsa bile mahkeme kararıyla akdi feshetmeye yetkili olamayacağının İbn Âbidîn tarafından kesin ifadelerle söylenmesi bu hususu teyit etmektedir. VI"
