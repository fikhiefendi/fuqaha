abstract: "Bu çalışma, katılım bankalarında müşterilerin finansal teknolojilere yönelik algılarını ölçmeyi amaçlamaktadır. Bu amaçla, ilk olarak finansal teknolojilerin (internet bankacılığı, mobil bankacılık, kartsız ödeme sistemleri, elektronik ödeme sistemleri, online finans, bankamatik) müşteriler üzerindeki etkisi araştırılarak demografik bilgiler kapsamında finansal teknolojilerin cinsiyet, eğitim durumu, finansal teknolojilerin kullanım süresi ve kullanılan uygulamaya göre farklılık gösterip göstermediği incelenmiştir. Araştırma, Türkiye'de faaliyet gösteren özel ve kamu katılım bankası müşterilerini kapsamaktadır. 28.03.2022-119 tarih ve sayılı Süleyman Demirel Üniversitesi etik kurul kararına göre veriler kolayda örnekleme yöntemi kullanılarak 320 kişiden yüz yüze anket tekniği ile toplanmıştır. Araştırmanın veri analizinde SPSS (Statistical Package for the Social Sciences) 26.0 programı kullanılmıştır. Araştırmanın bulgularına göre, finansal teknolojiler katılım bankası müşterilerinin kullanma niyetlerini olumlu yönde etkiler. Yapılan fark testlerine göre finansal teknolojiler katılım bankası müşterilerinin finansal teknolojileri kullanma niyetine, eğitim düzeyine ve yaş gruplarına göre farklılık göstermektedir. Buna göre müşterilerin niyetine en fazla etkiyi kolaylaştırıcı koşullar, en düşük etkiyi ise uyum boyutunun yaptığı görülmüştür. Katılımcılardan lisans ve üstü eğitim düzeyine sahip olanların diğer eğitim düzeylerine göre finansal teknolojileri kullanma niyetlerinin yüksek olduğu görülmüştür. Yapılan Tukey testi sonucuna göre, uyum boyutunda eğitim düzeyi lisans ve üstü olanların algısı ilköğretim grubunda olanlara göre daha yüksektir. Niyet boyutunda lisans ve üstü eğitim düzeyine sahip olanların algısı ilköğretim düzeyinde mezun olanlara göre daha yüksektir. Endişe boyutunda ise ilköğretim düzeyine sahip olanların algıları lisans ve üstü eğitim düzeyine sahip olanlara göre daha yüksektir. Tukey testi sonucuna göre, yaş grubu 41 ve üstü olanların 30 ve altı olanlara göre algısı daha yüksektir. Bu sonuca göre yaş arttıkça endişe boyutu da artmaktadır. Ayrıca finansal teknolojilerin katılım bankası müşterilerinin cinsiyetine ve segmentlerine (bireysel/kobi) farklılık göstermediği sonucuna ulaşılmıştır. Sonuçlar değerlendirilerek önerilerde bulunulmuştur. Sonuç bölümünde araştırmanın bulgularına yer verilerek araştırmacılara önerilerde bulunulmuştur."
