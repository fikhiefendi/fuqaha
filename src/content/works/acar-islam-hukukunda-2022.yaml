abstract: "İslâm hukukunda ihtilat denilince akla ilk gelen kadın ve erkeğin bir arada bulunması akla gelmektedir. Klasik fıkıh eserlerinde de kavramsal olarak daha çok bu bahis işlenmektedir. Ancak daha detaylı bakıldığında ihtilat kavramının fıkhın başka konularına da şamil olduğu görülmektedir. Dolayısıyla bu çalışmanın nihai hedefi bu bahisleri ortaya çıkararak fıkhın genel ilkeleri çerçevesinde meseleye açıklık getirmektir. Çalışma üç ana bölümden meydana gelmektedir. Birinci bölümde ihtilat ve onunla iltisaklı olan diğer kavramlar ele alınmıştır. İkinci bölümde ihtilatın furu' fıkıhtan sular, kuyular, zekât, alışveriş, şirket vb. birçok kalemde örnekler verilerek konunun kapsam alanları ortaya konmaya çalışılmıştır. Üçüncü ve son bölümde ise fıkıh bilginlerinin ihtilatı giderme ve çıkış yollarındaki yöntem/metotları ortaya konmuştur."
