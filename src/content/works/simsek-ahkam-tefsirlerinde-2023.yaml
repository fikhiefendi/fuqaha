abstract: "Ahkâm tefsirleri dinin toplumsal düzlemde anlaşılması ve uygulanması için açıklayıcı mahiyette ortaya konulmuş eserlerdir. Nitekim geleneksel dönemde popüler olan bu eserler günümüzde de önemini korumaktadırlar. Bu noktada yazılmış eserlerden bazıları sadece ahkâm ayetlerini ele almaktayken üzerinde çalışma yapacağımız Kurtubî'nin eseri ise Kur'an'ın tamamını tefsir etmesi bakımından diğer ahkâm tefsirlerinden ayrılmaktadır. Bu yüzden kadın konusu klasik âhkamü'l-Ķur'ân geleneğinin en kapsamlı eseri olan Kurtubî'nin eseri üzerinden ele alınacaktır. Çalışmanın ilk bölümünde ahkâm tefsiri ile ilgili genel bilgilere, Kurtubî'nin hayatına ve eserlerine yer verilecektir. Çalışmanın kinci bölümünde ise kadının yaratılış, evlilik, boşanma, dini ve toplumsal uygulamalar gibi başlıkları içeren konular Kurtubî'nin el-Câmi' li-Aĥkâmi'l-Ķur'ân adlı tefsiri merkeze alınarak Kurtubî'nin kadınlara dair hükümlerin gerekçelerine dair yorumlarından onun kadına dair bakışı tespit edilmeye çalışılmıştır."
