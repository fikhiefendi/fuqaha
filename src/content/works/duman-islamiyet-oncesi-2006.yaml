abstract: "Kur'an alanında araştırma yapmak isteyenler, onu anlayabilmek için gönderildiğitoplumun dini, kültürel, folklorik ve hukuki yapısını çok iyi bilmek durumundadır. Bunedenle İslam öncesi Arap toplumunun folklorik yapısını, örf ve adetlerini Kur'aniçerisinde ne kadar yer aldığını araştırmaya çalıştık. Çalışmamızda İslam öncesidönemle ilgili bilgilere, genellikle İslami kaynaklardan, tefsirlerden ve bazı batılımüsteşriklerin eserlerinden faydalanarak ulaştık. Çalışmalarımız neticesindeulaştığımız sonuç ise; Kur'an'da uyulması emredilen dini, hukuki ve sosyal birçok konuİslam öncesi Arap toplumu tarafından bilinen ve uygulanan hükümlerdir. Ancak bunlarbir takım şirk unsurlarıyla, haksızlıklarla ve zulümle anlamsız hale getirilmiştir. Kur'angetirdikleriyle Arapların inanç hayatını şirk unsurlarından arındırmış, sosyal hayatınadenge getirmiş, hukuki alanda da adaleti sağlamıştır. Bu çalışmamızın İslam öncesidönemin folklorik yapısını ortaya koyması ve Kur'an'ın bu konulardaki tavrının neolduğunun bilinmesi açısından önemli olduğu kanaatindeyiz."
