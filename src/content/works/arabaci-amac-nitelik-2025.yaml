abstract: "Bir sözleşmenin hukuki niteliği, o sözleşmenin hukuk düzeni içerisindeki mahiyetini ve hangi hukuki işlem türü kapsamında değerlendirileceğini ortaya koymaktadır. Sözleşmelerin hukuki niteliğinin tespit edilmesi, ilgili sözleşmelere uygulanacak hükümlerin ve bu sözleşmelerin doğuracağı hukuki sonuçların belirlenmesi açısından büyük önem taşımaktadır. Bu nedenle klasik fıkıh kaynaklarında satış, kira, hibe ve âriyet gibi tipik sözleşme türleri tanımlanarak nitelik ve kapsamları belirlenmiştir. Ancak modern dönemde özellikle katılım bankacılığı sektöründe ortaya çıkan ve klasik kaynaklarda doğrudan karşılığı bulunmayan yeni nesil sözleşmelerin hukuki niteliklerinin nasıl belirleneceği ve bu hususta hangi esaslara itibar edilmesi gerektiği, önemli bir tartışma konusu haline gelmiştir. Bu çalışma, söz konusu meseleyi ele alarak İslam hukuk doktrininde amaç olgusunun sözleşmelerin hukuki niteliği üzerindeki etkisini incelemeyi ve bu bağlamda hukuki nitelik tartışmalarında benimsenmesi gereken isabetli ve tutarlı yöntemi ortaya koymayı hedeflemektedir. Bu çerçevede çalışmada öncelikle amaç olgusunun mahiyeti ile taşıdığı farklı anlam düzeyleri ele alınmış, ardından klasik fıkıh doktrininde amacın sözleşmeler üzerindeki etkisi değerlendirilmiştir. Bu değerlendirme sırasında klasik literatürde amaca vurgu yapan kaideler özgün ve derinlikli bir okumaya tabi tutulmuştur. Amaç olgusu temelinde sözleşmelerin hukuki niteliğinin nasıl belirlenmesi gerektiği ortaya konulduktan sonra uygulamaya yönelik olarak cari hesap, finansal kiralama ve organize teverruk işlemleri analiz edilmiştir. Bu kapsamda amaç ve hukuki nitelik ilişkisine dair çağdaş literatürdeki yöntem sorununa dikkat çekilmiştir."
