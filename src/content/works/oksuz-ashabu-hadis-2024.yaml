abstract: "İnsanın yaratılışı itibariyle din de dâhil olmak üzere yaşamın her alanında farklı fikirlere sahip olması gayet tabii bir durumdur. Dolayısıyla din gibi özel bir alanın içinde bile, aynı inanç sistemine sahip olan insanların farklı mezhep ve yorumları sahiplenmesi yüce yaratıcının hilkatinin bir yansımasıdır. Ancak bireylerin bu doğal farklılığı sadece kendi inanç sistemlerini merkeze alarak diğerlerinden üstün/hak olduğu gerekçesiyle yorumlaması, toplumda birtakım ayrıştırıcı reaksiyonların oluşmasına neden olmuştur. Dolayısıyla bu çeşitliliğin tefrikaya değil de hikmete dönüşmesi için aynı din mensuplarının birbirlerine karşı şablon yargılardan olabildiğince uzak, hoşgörü ve diyalog içerisinde yaklaşmaları elzemdir. Ancak erken dönem İslam düşünce geleneğine baktığımızda yapmış olduğumuz bu değerlendirmenin aksine birçok ayrıştırıcı olayın gerçekleştiği bilinmektedir. Bu kapsamda tanık olduğumuz bir ayrışma da hicrî ikinci ve üçüncü asırda Ashâbü'l-Hadîs ile Hanefîler arasında gerçekleşmiştir. Hz. Peygamber ile başlayan süreçte İslam düşünce geleneği içerisinde fikir ve usulleriyle kendilerinden söz ettiren önemli şahsiyetler bulunmaktadır. İşte bu gelenek içerisinde yer alan Ebû Hanîfe de hem kendi döneminde hem de günümüzde etkisini bir hayli hissettiren saygın âlimlerden biridir. Bununla birlikte Ahmed b. Hanbel, İmam Mâlik ve Buhârî gibi Ashâbü'l-Hadîs âlimlerinin“İmâm-ı Âzam”lakabıyla meşhur olan Ebû Hanîfe'ye yönelik oldukça sert tenkitleri bulunmaktadır. Bugünden bakıldığında Ehl-i sünnet çevreler için vazgeçilmez bir değere sahip olan bu isimler tarihsel süreçte karşılıklı kamplaşmaların taraftarları olarak konumlandırılmışlardır. Peki, niçin Ebû Hanîfe'ye küfre varan ciddi ithamlar yöneltilmişti? İşte cevabını aradığımız bu soru, bu konuya odaklanmamıza neden olmuştur. Ancak amacımız meraka mucip olan bu konuyu günümüze taşıyarak tartışmaları devam ettirmek değil, yaşanan acı tecrübelerden dersler alarak aynı hatalara bugün düşmemektir. Zira farklı fikirlere sahip olmaktan dolayı ötekileştirilmek sadece tarihin belli bir alanında -hicrî ikinci ve üçüncü asır- olup bitmiş bir olgu değildir. Bugün de özellikle ilahiyat fakültelerinde birçok akademisyenin farklı fikirlere sahip olmasından dolayı ötelendiği ve ötekileştirildiği hatta toplumdan tecrit edilerek sürgün hayatı yaşadığı görülmektedir. Mezhepler Tarihi disiplininin yaklaşımıyla ele alınan hicrî ikinci ve üçüncü asırlardaki Ebû Hanîfe merkezli bu tartışmalar, mihne öncesi ve mihne sonrası şeklinde tasnif edilerek ele alınmıştır. Çalışmada, söz konusu tartışma sadece teolojik olarak değil fikir-hadise irtibatı bağlamında sosyo-politik ve psikolojik etkenler de göz önünde bulundurularak farklı boyutlarıyla incelenip değerlendirilmiştir. Elde edilen verilerden hareketle Ashâbü'l-Hadîs'in mihne öncesinde Ebû Hanîfe'yi ircâ fikri ve hadislere yaklaşımındaki usulü nedeniyle eleştirdiği tespit edilmiştir. Bu dönemde Ebû Hanîfe'nin sosyo-politik hayatta Ashâbü'l-Hadîs âlimlerine nazaran daha etkin olması ayrı bir eleştiri konusu olmuştur. Mihne sonrasında ise söz konusu meselelere halku'l-Kur'ân, Cehmî suçlamaları ve iman nazariyesi eksenindeki görüşlerine yönelik tenkitler de eklenmiştir. Mihne sonrasında tartışmanın çerçevesinin genişlemesi gruplar arası gerilimi de arttırmıştır. Özellikle bazı Hanefîlerin mihne sürecinde aktif rol alması Ebû Hanîfe'ye yönelik eleştirilerin şiddetlenmesinde doğrudan tesiri bulunduğu değerlendirilmektedir. İşte yaşanan tüm bu gelişmeler, Ashâbü'l-Hadîs ile Hanefîler arasında çok boyutlu fikir ayrılıklarının doğmasına neden olmuştur. Ortaya çıkan bu durum ise hem Ebû Hanîfe'nin hem de takipçilerinin hicrî dördüncü asra kadar birçok olumsuz sıfatla itham edilmesine sebep olmuştur."
