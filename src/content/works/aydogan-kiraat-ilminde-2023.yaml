abstract: "Kırâat ilmi içersinde sıla konusu önem arz etmektedir. Ashâb-ı Sıla'nın kendine has vucûhâtı bulunmaktadır. Sıla uygulamasını temsil eden kırâat imamları; Kalun, İbn Kesir, Ebû Caʿfer'dir. Bu kurraların ortak özelliği, çoğul ( كم ,هم ,أنتم ) muttasıl ve munfasıl zamirlerinde, (م ) harfinde ( و ) varmışçasına ( sıla ) geçiş yapmalarıdır. Sıla konusunun kırâat ilminin yanında, telaffuzundaki farklılık yönüyle fonetik, kelimenin aslına işaret etme yönüyle de morfolojik yönü vardır. Bunun yanında“Ha'i Kinâye”konusunda da kırâat imamları arasında sıla yaparken ortak yönler ve farklılıklar bulunmaktadır. Kırâat ilmi içerisinde, Ashâb-ı Sıla'nın ayrı olarak ele alınması, ortak benzerliği olan bu kırâat imamlarının okuyuşlarını anlamada kolaylık sağlayacaktır. Ashâb-ı Sıla okuyuşlarındaki benzerlikler ve usul farklılıkları karşılaştırmalı analiz yöntemiyle ele alınmıştır. Ashâb-ı Sıla okuyuşlarındaki benzerlikler ve usul farklılıkları, eş-Şâtıbiyye ve ed-Dürretü'l Mudiyye (el-Qıraatu's Suğrâ) ekolü kaynak edinilerek, bir giriş, üç bölüm ve sonuç şeklinde yazılmıştır. Giriş bölümünde araştırmanın amacına, kapsam ve kırâat ıstılahlarına yer verilmiştir. Çalışmanın birinci bölümünde; Ashâb-ı Sıla hakkında genel bilgi verilerek bu grubun tanıtımı yapılmıştır. Bu grubu ortak kılan sıla konusu ayrı olarak işlenmiş, kırâat imamlarının hayatları hakkında bilgiler verilmiş, tarikleri ve sembolleri gösterilmiştir. İkinci bölümde; Ashâb-ı Sıla hakkında usul yönünden benzerlikler ve farklılıklar karşılaştırmalı olarak işlenmiştir. Usul konuları işlenirken asıl kaynak olan eş-Şâtıbiyye ve ed-Dürretü'l Mudiyye manzumeleri şahit gösterilmiştir. Son bölümde ise Ashâb-ı Sıla kırâatlarının“ferşi'l hurûf”yönünden incelemesi yapılmıştır. Ashâb-ı Sıla vücûhâtları ile diğer kırâat imamlarının okuyuşları karşılaştırılarak analiz edilmiştir."
