abstract: "Bu çalışma, farklılık yönetimi, örgütsel bağlılık ve kurumsallaşma arasındaki ilişkiyi araştırmak üzere gerçekleştirilmiştir. Araştırma verileri hedef kitle olarak belirlenen; bir katılım bankasının genel müdürlük çalışanlarından alınmıştır. Örneklem büyüklüğü 191 kişidir. Araştırmanın amacı doğrultusunda ilk olarak farklılık yönetiminin örgütsel bağlılık üzerindeki etkisi açıklanmıştır. Sonrasında ise sözü edilen bu etkide çalışanların kurumsallaşma düzeyi algısının rolü ortaya konmuştur. Bulgular doğrultusunda; farklılık yönetiminin, özellikle yönetsel uygulamalar ve politikalar alt başlığında, çalışanların örgütlerine karşı geliştirdikleri bağlılıklarını olumlu anlamda etkilediği ve bu etkide çalışanların kurumsallaşma algısının düzenleyici bir rolünün bulunduğu sonucuna varılmıştır. Buna göre çalışanların içinde bulundukları örgütün kurumsallaşma düzeyine ilişkin algıları; işletmelerin farklılık yönetimi ile ilgili uygulamalarının ve politikalarının çalışan bağlılığına etkisinde önemli bir rol oynamaktadır."
