abstract: "Bu çalışma XVIII. yüzyılın ilk yarısında Konya'da kredi ve borç ilişkilerini, finans kaynaklarını ve ticari faaliyetleri üç bölümde incelemektedir. Sıcak para ihtiyacının bireysel ve kurumsal borçlanmalarla karşılandığı tespit edilmiştir. Bu çalışmanın ilk kısmında halk arasındaki kredi ve borç ilişkileri incelenmekte, faizli işlemlerin var olduğunun fakat oldukça sınırlı kaldığının altı çizilmektedir. Yardımlaşma ve güven duygusuna dayanan“Karz-ı Hasen”en çok görülen borçlanma türüdür. İkinci aşamada finans kaynaklarının kurumsal ayağını para vakıfları oluşturmuştur. Faizle para işleten pek çok vakıf arasında özellikle Avârız Vakıfları önemli yer tutmaktadır. Son olarak şehrin ticari hayatında faizsiz finans yollarından biri olan iş ortaklıklarının varlığı tespit edilmiştir. En sık rastlanan ortaklık türleri İnan ve Mudârebe ortaklıklarıdır. Küçük sermayelerden oluşan bu ortaklıkların ömrü de oldukça kısadır."
