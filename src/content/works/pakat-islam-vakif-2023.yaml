abstract: "Yaşamı tümüyle kuşatan ve her canlının doğrudan veya dolaylı olarak talep ettiği hak kavramı, dinî ve dünyevî hayatın en önemli terimleri arasında yer almaktadır. Hak olarak farklı alanlarda çeşitli tanımlar yapılmış dinî ve dünyevî iş ve ilişkilerde hukukî, ahlakî vs. tüm alanlar dikkate alınarak sınırlar çizilmeye gayret gösterilmiştir. Bu çalışmada hak unsuru din çatısı altında ve muâmelât-ı şer'iyye içerisinde olup mal varlığı hukuku kapsamında incelenmiştir. Çalışma, mal varlığı hukukundaki karşılığı milk (mülkiyet) olan hak kavramını vakıf hukuku bağlamında ele almıştır. Milk, mal ve vakıf kavramları çalışma maksadını aşmayacak şekilde değerlendirilmiştir. Mülkiyet teorisi vakıf hukuku bağlamında incelenip mülkiyete dair genel kabul gören bir görüşün olup olmadığı irdelenmiştir."
