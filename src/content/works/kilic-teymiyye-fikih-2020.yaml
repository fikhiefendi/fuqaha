abstract: "Teşekkül sürecinden itibaren hayatın içinde olan ve ondan bağımsız düşünülemeyen İslam hukuku, zamanla ortaya çıkan yeni durumları kendi amaç ve ilkelerine göre değerlendirmiştir. Genel olarak değişim ve dönüşüme açık olan fıkhın“esneklik”özelliği, onun özünü muhafaza ederek yeni durum ve şartlara adapte olabilme kabiliyetini göstermektedir. İslam hukukunun nihai hedefleri, bireysel ve toplumsal ihtiyaçların karşılanmasına bağlıdır. Bu ise fıkhın, sosyal gerçekliği dikkate almasını zorunlu kılmaktadır. Biz bu çalışmamızda İslam hukukunun sosyal gerçekliği dikkate aldığını ortaya koymaya çalışırken İbn Teymiyye'nin fıkıh anlayışında ve verdiği fetvalarında bu gerçekliği göz önünde bulundurup bulundurmadığını, toplumsal gerçekliğe dayalı bir fıkhî istidlal yöntemi olan mesâlih-i mürsele (maslahat) prensibinin İbn Teymiyye'nin anlayışında hangi boyutlarda olduğunu ortaya koymaya çalıştık. Bunu yaparkende maslahat esasına dayanarak vermiş olduğu fetvalarında ve toplumsal gerçekliğin önemli göstergelerinden biri olan özel risâlelerinden örnekler sunmaya çalıştık."
