abstract: "Bu tez, para–kredi–bankacılık sistemlerinin beş bin yılı aşan gelişimini medeniyetler arası etkileşim bağlamında inceleyerek, borca dayalı kısmi rezerv bankacılığı uygulamalarının birey, toplum ve devlet düzeyinde ürettiği bağımlılık ilişkilerini çok boyutlu bir analizle ortaya koymaktadır. Para–kredi ve bankacılık tarih yazımına kronolojik, karşılaştırmalı ve bağlantısal bir bakışla yaklaşıldığında; (i) kısmi rezerv bankacılığına benzer uygulamaların antik dönemlerden itibaren mevcut olduğu ve tüccar-bankacıların gayri-nakdî ödeme belgelerini kredi-belgelerine dönüştürerek sahip oldukları sermayenin üzerinde kredi kullandırmak suretiyle karşılıksız kredi-para üretebildikleri; (ii) modern para–kredi sisteminin 19. yüzyılın ikinci yarısından itibaren birey, toplum ve devleti para-kredi üretim sürecinin dışına iten bir merkezileşme ile şekillendiği; (iii) kamu finansman açıklarının sabit faizli tahvillerle finanse edilmesinin“kurumsal faiz/riba”niteliğinde bir bankacılık rejimi oluşturduğu; (iv) devlet–finans kapital ortaklıklarının güçlenmesiyle Müslüman toplumların modern sistemi revize etme imkânı olmaksızın adapte etmek zorunda kaldıkları tespit edilmiştir. İslam medeniyetlerinin para ve bankacılık tarih ile teorik ve kuramsal literatür ise; (i) parasal sermaye ve servetin dar bir kesimin elinde toplanarak devlete dönüşmesine ve kredi arzının dar bir kesimin elinde merkezileştirilerek yönetilmesine izin verilmediğini, (ii) birey, toplum ve devletin birlikte katıldığı çok-segmentli bir bankacılık yapısının işleyişi içerisinde iii) parasal sermaye ve servetin sosyal sermayeye dönüştürülerek kullanıldığı paylaşımcı ve dayanışmacı uygulamaların borç bağımlılığını ve borç köleliğini önlediğini göstermektedir. Bu tarihsel çerçeve, günümüzde para–kredi üretimine yeniden katılımcı ve dayanışmacı yaklaşımları esas alan normatif bir dönüşümün gerekliliğine işaret etmektedir. Böyle bir dönüşüm, parasal sermayenin belirli kesimlerde yoğunlaşmasını engelleyebileceği gibi, öz sermaye ve iştirak bankacılığı mantığıyla çalışan katılım bankacılığına yeniden büyüme ivmesi kazandırabilecektir."
