abstract: "Bu çalışmada Sünnet'in İslam Dinindeki yeri ve önemi, Sünnet'in temel fonksiyonlarından olan teşri' görevi esas alınarak hem usul yönüyle, hem de füru' fıkha dair örnekleriyle sistematik bir şekilde temelde Hanefi mezhebi esas alınmak suretiyle ortaya konmaya çalışılmıştır. Araştırmada İslam Dininin anlaşılması ve yaşanmasında Kur'an'dan sonra ikinci kaynak olan Sünnet'in yasama yetkisiyle doğrudan ilintili olan temel konular incelenmiştir. Bu çerçevede birinci bölümde konunun usul yönüyle doğrudan ilişkili olduğu;“Sünnet'le Kur'an arasındaki kaynaklık vasfı ve ilişkisi”,“Sünnet'in kaynağı”,“Sünnet'in bağlayıcılık açısından tasnifi”ve“Hz. Peygamber (sav)'in ictihadı”konuları işlenmiştir. Söz konusu hususlarla ilgili Hanefi mezhebi uleması başta olmak üzere ehl-i sünnet bilginlerinin görüşleri değerlendirilmiştir. İkinci bölümde, Sünnet'in müstakil teşri' kaynağı olduğunu kabul eden ve etmeyen görüşler delilleriyle birlikte ele alınmıştır. Üçüncü ve son bölümde özellikle pratik ameli hayatta işlevsel olan füru' fıkha dair ahkâmı içeren örnekler üzerinden Sünnet'in teşri' değeri ortaya konarak delillendirilmeye çalışılmıştır. Örnekler incelenirken, öncelikle fıkhi hükümlere ait hadisler zikredilmiştir. Akabinde bahse konu hadislerin, üzerlerine hüküm bina edilebilecek sıhhatte olup olmadıkları belirtilmiştir. Daha sonra temel fıkıh kaynaklarından ilgili hükmün sübutunun delili ortaya konmuş ve Sünnet'in o konuyla ilgili ifade ettiği anlam dile getirilmeye çalışılmıştır. İslam tarihi sürecinde ehl-i sünnet mezhepler, fıkhi içtihatlarının temelinde var olan dinamizm ve kimlikleri bakımından farklı adlandırmalarla anılmışlardır. Bu çerçevede Hanefi mezhebinin ehl-i rey, diğer ehl-i sünnet mezheplerin ise ehl-i hadis olarak isimlendirildiği bilinmektedir. Şer'i ahkâmın istinbatında ve delillendirilmesinde Hanefi mezhebi hakkında Sünnet'e karşı oluşan bu olumsuz ve yersiz adlandırmanın isabetsiz olduğu vurgulanmaya çalışılmıştır. Nitekim araştırma kapsamında incelenen füru' fıkha dair örneklerde görüldüğü üzere Hanefi âlimler, ilgili konuya ait hadisleri doğrudan hükmün teşri'ine delil olarak kabul etmek suretiyle Sünnet'i müstakillen şer'i kaynak olarak dikkate almışlar, söz konusu hükmü, Kur'an ve icma'yla destekleme ihtiyacı hissetmeksizin Sünnet'le sabit kabul etmişlerdir."
