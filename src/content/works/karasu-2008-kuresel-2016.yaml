abstract: "2008 küresel finans krizi sonrasında finansal işlemlerin varlığa dayalı olmamasının yanında, finansal mühendisliğin tasallutu altında gerçekleşen konvansiyonel finansal işlemlerine alternatif olarak İslami finans araçlarına yönelik talep hem Türkiye'de hem de dünya genelinde kayda değer bir artış yaşamıştır. Dünya genelinde sukuk ihracatı 2001 yılında 1,172 milyon dolardan, 2014 yılına gelene kadar artarak 138,170 milyon dolar değere ulaşmıştır. Yine İslami finansa dayalı varlık hacmi de 809,980 milyon dolardan 1,261,064 milyon dolar seviyesine yükselmiştir. Ayrıca dünya genelinde İslami finans araçlarının kullanımına yönelik 38 milyon potansiyel müşteri olduğu dikkate alınırsa, İslami finans araçlarının sadece Türkiye gibi gelişmekte olan bir finans piyasası için değil aynı zamanda dünya genelinde Müslüman az yoğun olan ülkeler için de ne gibi imkânlar taşıdığı hususu önem arz etmektedir. Mevcut tez çalışması dahilinde ise tarihsel süreç içerisinde reel sektör ile sanal piyasalar arasında yaşanan dengesizlik sonucu ortaya çıkan krizlerin yapısından, 2008 küresel finans krizinin sebeplerinden, nasıl bir süreç içerisinde küreselleşerek dünya çapında ne gibi bir etki oluşturduğu ve nihayet söz konusu krize yönelik ne tür bir mücadele süreci yürütüldüğü ele alınmaktadır. Bununla birlikte İslami finansman araçlarının türleri, işleyişi, kullanım alanı, İslami finansa kimlerin ihtiyaç duyduğu, hangi ülke ve kuruluşların öncülük ettiği gibi meselelerin yanı sıra İslami finans varlık hacimlerinin küresel kriz sonrasında yaşadığı tarihsel seyir incelenmekte ve Türkiye özelinde de sektörün nasıl bir gelişim potansiyeli içinde olduğu ele alınmaktadır. Son olarak da küresel düzlemde İslami finans varlık hacmine sahip ülkelerin söz konusu yıllar dahilinde GSYİH değerleri ile nasıl bir etkileşim içinde olduğu panel veri analizi üzerinden incelenmiştir."
