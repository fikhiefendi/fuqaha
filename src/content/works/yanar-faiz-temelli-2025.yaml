abstract: "Bu tez, insanlık tarihinin sosyoekonomik dönüşümlerini, hayatta kalma içgüdüsü ve ihtiyaçların karşılanmasına yönelik arayışlar ekseninde ele almaktadır. Avcılık ve toplayıcılıkla başlayan bu iktisadi evrim, zaman içinde tarım, sanayi ve teknoloji temelli sistemlere doğru ilerlemiş; bu süreçte toplumsal yapılar da kabile düzeninden modern ulus-devletlere kadar çeşitlenmiştir. Özellikle Sanayi Devrimi sonrasında Batı Avrupa'da gelişen sermaye birikimi, günümüz kapitalist iktisadi sisteminin kurumsallaşmasının zeminini hazırlamıştır. Bu sistemin merkezinde yer alan faiz mekanizması, servetin belirli ellerde yoğunlaşmasına, sınıf farklılıklarının derinleşmesine ve küresel düzeyde ekonomik eşitsizliklerin artmasına neden olmuştur. Sömürüye dayalı bu yapı, iç savaşlar, siyasi istikrarsızlıklar ve ekonomik krizler aracılığıyla dünya genelinde toplumsal huzuru tehdit eden bir unsur haline gelmiştir. Bu çalışma, kapitalist iktisadi sistemin faiz merkezli işleyişini eleştirel bir yaklaşımla incelemekte, bu sistemin doğurduğu ekonomik ve sosyal sorunların kökenlerine ışık tutmaktadır. Tez, İslam iktisadının faiz yasağını merkeze alarak, mevcut sisteme alternatif bir model önerisi sunmayı amaçlamaktadır. İslam ekonomisinde yasaklanan faiz, sadece bir finansal araç değil, aynı zamanda sömürüye ve haksız servet transferine dayalı gayrimeşru bir düzenin sembolü olarak değerlendirilmekte; bireyi ve toplumu ekonomik zulümden koruyan ahlaki bir ilke olarak ele alınmaktadır. Çalışma, borca dayalı finans yerine, üretime ve risk-kâr paylaşımına dayalı modelleri ön plana çıkarmaktadır. Öz kaynakların doğrudan yatırıma dönüştürüldüğü ve spekülatif etkilerden arındırılmış finansal yapıları esas alan İslam iktisadı, sürdürülebilir, adil ve insani bir ekonomik düzenin inşasına katkı sunma potansiyeline sahiptir. Bu bağlamda tez, mevcut kapitalist sistemin eleştirisinin ötesine geçerek, İslami bir perspektiften alternatif bir iktisadi paradigma arayışına kapı aralamaktadır. Çalışma, bu amaca ulaşmak için metodolojik olarak karşılaştırmalı analiz yöntemini kullanmakta; kapitalist ve İslam iktisat sistemlerini, temel prensipleri ve sonuçları üzerinden mukayese etmektedir."
