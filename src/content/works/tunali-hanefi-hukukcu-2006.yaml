abstract: "Yargılama Hukuku, ?yargılama usulü, hakimlerin ve diğer görevlilerin çalışma metotları, kanunların uygulanma şekilleri? gibi mevzuları içeren önemli bir daldır. Diğer hukukların hemen hepsi gibi İslam Hukuku'nun da tarihi süreç içerisinde bir Yargılama Hukuku şekillenmiş ve buna bağlı olarak da Yargılama Hukuku Külliyatı oluşmuştur. Tezimiz, bu külliyat içerisindeki önemli eserlerden biri olan ?Kitabu'l-İ'lam fi Mustalahi'ş-Şuhudi ve'l-Hükkam?ın tahkikidir. Eserin müellifi Necmeddin et-Tarsusi'dir (m.1321-1358). Tarsusi, Memlükler döneminde Dimeşk kadıl kudatlığı yapmış ve ondan fazla eser vermiş önemli bir şahsiyettir. Kitabu'l-İ'lam kendi içinde üç ana bölüme ayrılmıştır. Birinci bölümde ?el-adlü'lkatib? in (bugünkü notere tekabül eden bir kurumdur), ikinci bölümde de ?katibu'l-hüküm?ün çalışma metotları pratik örnekler üzerinde açıklanmıştır. Üçüncü bölümdeyse ?edebu'l-kadı? konusu, ilgili kitaplardan alıntılarla kısaca açıklanmıştır. Eserin sonuna müellif, ?fiziki görünüşe göre isimlendirme, künye ve lakap? isimli bir ek bölüm koymuştur. Tezimiz de bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde müellif ve yaşadığı dönem hakkında bilgiler bulunmakta, ikinci bölümde Kitabu'l-İ'lam tanıtılmakta, üçüncü bölümdeyse eserin tahkikli metni verilmektedir. Tahkikte, eserin dört farklı nüshası karşılaştırılmış ve farklılıkları ortaya konmuştur. Nüshaların ikisi İstanbul'da (Süleymaniye Kütüphanesi ve Taksim Atatürk Kitaplığı), biri Paris'te, biri de Berlin'de bulunmaktadır. Kitabu'l-İ'lam; ?el-adlü'l-katib?, ?katibu'l-hüküm? ve Memlükler Adli Teşkilatı hakkında önemli bilgiler içeren ve bu alanlarda çalışan araştırmacıların görmezden gelemeyeceği mühim bir eserdir."
