abstract: "Bu araştırmamda, fıkıh usulünün birçok meselesinde görülen ve âlimlerin görüş ayrılıklarına yol açan sebeplere değinilecek ve füru fıkhî konularda uygulamalı bir surette ele alınacaktır. Ayrıca usulü fıkıh ve ilmu'l-hilâf kavramları tanımlanacaktır. Yanı sıra ihtilaf nedenlerinden sayılan kelam ilmi, mantık ilmi ve içtihat gibi kavramlar açıklanacaktır. Daha sonra usulcülerin Kur'ân, Sünnet, icma, kıyas, sahabe kavli, istihsan, istishab, mesalih-i mürsele ve şer'u men kablenâ gibi muhtelefun fîh konular izah edilecektir. Ayrıca usulcülerin âm, hâs, mutlak, mukayyet, müşterek gibi terimlerin anlamlarındaki ihtilaflar örneklerle açıklanacaktır."
