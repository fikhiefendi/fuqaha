abstract: "Katılım Bankaları esas itibariyle faizin olmadığı bir hizmet anlayışına sahip bankalardır. Bu amaç doğrultusunda,“Faizsiz Banka”ve“İslam Bankası”adları ile Müslüman ülkelerde“ribanın haram olmasına”bağlı olarak, faizli işlem yapmak istemeyen mevduat sahiplerinin de bankacılık faaliyetlerine katılmasını sağlamak üzere, 1960'lı yıllardan itibaren kurulmaya başlamıştır. Ülkemizde 15.12.1983 tarihli Kararname ile faizsiz esaslara göre çalışan Özel Finans Kurumları, Katılım Bankaları çalışmalarının başlangıcı kabul edilmektedir. Katılım Bankaları, Türkiye'de de faizli işlem yapmak istemeyen mevduat sahiplerinin ihtiyaç ve beklentilerine cevap verebilecek bir modeldir. Katılım Bankaları, İslami usul ve esaslara göre belirlenen fon toplama ve bu toplanan fonların kullandırılma işlemleri ile konvansiyonel bankacılık sisteminden ayrıştığı yönleri olmakla birlikte bu bankaların kuruluş esasları açısından yapamayacağı, bazı faaliyetlerde de bulunabilmektedir. Bu çalışmanın amacı, Katılım Bankaları'nın tüm yönleriyle incelenerek daha bilinir hale gelmesini sağlamaktır. Aynı zamanda bu bankaların, konvansiyonel bankacılık sistemi ile karşılaştırılarak artı ve eksi yönlerinin tespit edilmesi ve sonuçların değerlendirilmesi hedeflenmektedir."
