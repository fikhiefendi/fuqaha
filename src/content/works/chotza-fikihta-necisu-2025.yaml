abstract: "Modern bilimin gelişmesiyle gıda, giyim, kozmetik, ilaç, tıp alanlarında ve insanların günlük hayatta kullandığı birçok araç ve gereçte İslâm dinine göre pis (necis) sayılan maddeler kullanılmaktadır. Fıkhî açıdan necis kabul edilen bu maddeler, içerisine eklendikleri ürünlerin dini hükmü konusunda çeşitli tartışmaları gündeme getirmiştir. Bu tür tartışmaların sağlıklı bir şekilde yürütülebilmesi için, öncelikle söz konusu maddelerin İslâm'ın aslî kaynaklarındaki yeri ve fıkıh literatüründeki tarihi serüveni dikkatle incelenmelidir. Bu doğrultuda necis maddeler hakkında yapılmış çalışmalar mevcuttur. Fakat bu çalışmalar içerisinde maddenin özünde necis olduğunu ifade eden“necisü'l-ayn”kavramı merkeze alınarak, kavramın doğuşu, gelişimi ve mezhepler tarihindeki kullanımı müstakil olarak incelenmemiştir. Bu çalışmada necisü'l-ayn kavramının ortaya çıkışı, geçirdiği değişim ve dönüşümler fıkıh mezhep tarihi üzerinden ele alınacak, en son necisü'l-ayn maddelerin fıkhî hükümlerine yer verilecektir."
