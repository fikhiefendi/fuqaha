abstract: "Memlüklerin son dönemi ile Osmanlıların hâkimiyetinin ilk döneminde Mısır'da yaşayan İbn Hacer el-Heytemî ile Şemsuddîn er-Remlî, Şâfiî mezhebinde son sözü söylemiş, İmâm Şâfiî (v. 204/820) ve Şeyhayn olarak ifade edilen Râfiî (v. 623/1226) ile Nevevî'den (v. 676/1277) sonra mezhebin en etkili isimleri olmuşlardır. Heytemî'nin görüş ve tercihleri, Mısır ve Hicaz dışında bütün Şâfiî coğrafyasında en mutemet görüş olarak kabul edilmiş ve kendilerinden sonra gelen birçok fakihin görüşünün şekillenmesinde etkili olmuştur. Remlî ise Mısır ve Hicaz da büyük bir etkide bulunmuş, ayrıca hâşiyeler dönemine ciddi manada tesiri olmuştur. Çok yönlü olan ve birçok ilim dalında eserler veren bu iki âlim, Nevevî'nin Şâfiî fıkıh literatüründe önemli bir yeri olan Minhâcu't-Tâlibîn adlı eserine Tuhfetu'l-Muhtâc ve Nihâyetu'l-Muhtâc adıyla birer şerh yazmışlardır. Yazdıkları bu şerhler en az müellifleri kadar şöhret bulmuştur. Günümüzde de istifade edilmeye devam edilen bu iki eser medreselerde okutulmuş ve âlimlerin fetva verirken müracaat ettikleri başucu eserler arasında yer almıştır. İmameyn, şeyhayn ve iklîleyn gibi lakaplarla anılan Heytemî ile Remlî, aynı dönemde yaşamış, aynı hocaların rahle-i tedrisinden geçmiş ve aynı bölgede hayatlarını sürdürmüşlerdir. Bu denli ortak noktaları olan bu iki âlimin füru-i fıkıhla ilgili birçok ihtilâfları meydana gelmiştir. Bu ihtilâflar önceleri çok fazla önemsenir ve taraf haline gelirken, sonra ikisinin görüşleri bütün Şâfiî coğrafyasında mutemed kabul edilmiştir. İhtilâfları kendilerinden sonraki fakihlerin dikkatini çekmiş, ihtilâf ettikleri konular hakkında bazı âlimler tarafından kitaplar yazılmıştır. Ancak ihtilâf sebepleri ile ilgili herhangi çalışma yapılmamıştır. Dolayısıyla bu çalışmada ikisinin ihtilâf sebepleri ve her birinin Şâfiî fıkhına etkileri de çalışılmıştır. Yaşadıkları dönemden itibaren günümüze kadar bütün Şâfiî coğrafyaya etki eden bu iki fakihin ihtilâflarının büyük bir kısmı yaptıkları tercihlerden kaynaklanırken, kısmen kıyas, örf ve maslahat gibi delil farklılığından kaynaklanmıştır."
