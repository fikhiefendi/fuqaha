abstract: "Bankacılık sektörü var oluşundan itibaren insanların ihtiyaçları doğrultusunda yeni ürün arayışına girmiş ve konvansiyonel bankacılık uzun yıllar varlığını tek başına sürdürmüştür. Türkiye'de faizden uzak duran kesimin yatırım talebini karşılama görevini katılım bankaları üstlenmiştir. Katılım bankaları ihtiyaçlar doğrultusunda İslami finans ürünlerinde çeşitliliği sağlayarak müşteri potansiyelini arttırmıştır. Türkiye'de“kira sertifikası”olarak adlandırılan sukuk İslami ülkelerin piyasalarında çok fazla talep görmüştür. Faiz hassasiyeti nedeniyle atıl olarak yastık altı bekletilen tasarruflar katılım bankacılığı ürünleri ile reel sektöre aktarılarak ekonomik hayatının gelişmesine katkı sağlamaktadır. Faizsiz finansman ürünleri içinde öne çıkan sukuk, dünya genelinde önemli ihraç rakamlarına ulaşmış bir yatırım aracıdır. Bu duruma istinaden çalışmada sukukun dünya ve Türkiye piyasasındaki geçmişten günümüze artan önemini ele alarak ekonomideki yarattığı değişiklikler incelenmiştir. Çalışmadaki temel amaç, İslami piyasaların en çok kullanılan ürünlerden biri olan sukuk hakkında bilgi vermenin yanında dünyadaki ve ülkemizdeki sukuk uygulamalarını ve gelişimini inceleyerek, ülkemiz sukuk piyasasında karşılaşılan sorunlara çözüm önerileri geliştirmek ve geliştirilmesi yönünde atılacak adımlara katkı sağlayabilmektir. Çalışmada elde edilen nitel ve nicel veriler ışığında Türkiye'deki sukuk uygulamalarında karşılaşılan başlıca sorunlar tespit edilmiş olup, elde edilen bulgular çerçevesinde Türkiye sukuk piyasasına yönelik öneriler geliştirilmeye çalışılmıştır. Ülkemiz sukuk piyasasının da önerileri dikkate alması sonucunda kamu ve kurumların sukuk ihraç değerlerindeki artışla birlikte dünya sukuk piyasasındaki payını artırması mümkün görülmektedir."
