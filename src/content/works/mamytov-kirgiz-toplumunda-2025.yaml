abstract: "İlmihallerin Müslümanlar arasındaki genel işlevine baktığımızda görülmektedir ki, bu eserlerden beklenen temel yarar, her bir Müslüman bireye günlük dini konularda rehberlik etmeleridir. Bu sebeple, İslam dünyasının farklı bölgelerinde halkın temel dini bilgilerini karşılamak üzere çeşitli ilmihal kitapları yazılmıştır. Benzer şekilde, Kırgız toplumu da bu tür eserlere yer vermiştir. Kırgızistan'da İlmihal Geleneğinin Gelişimi konusunu ele alan bu çalışmada, Kırgız âlimler tarafından kaleme alınan ve ilmihal niteliği taşıyan eserler üzerinden, bağımsızlık sonrasındaki dönemde ilmihal geleneğinin ne düzeyde geliştiği ortaya konulması amaçlanmaktadır. Bu çerçevede tespit edilen ilmihal çalışmaları incelenmiş ve tanıtılmıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın önemi, sınırlandırmaları, amacı, yöntemi ve kullanılan kaynaklara yer verilmiştir. Birinci bölümde Kırgızlar hakkında genel bilgilere; İslam öncesi ve sonrasındaki dini yaşama ve dini bilgi kaynaklarına dair açıklamalara yer verilmiştir. İkinci bölümde ise bağımsız Kırgızistan'da kaleme alınan ilmihal eserleri ile bu eserlerin yazarlarının hayatlarına dair bilgiler sunulmuştur."
