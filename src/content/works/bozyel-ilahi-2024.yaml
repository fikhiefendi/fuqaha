abstract: "Hicrî dördüncü asır âlimlerinden Bâkıllânî (v. 403/1013), Eş'arî kelâmının sistemli bir hale gelmesinde etkili bir rol oynamıştır. Ancak Bâkıllânî'nin kelâm ilmi dışında usul ilmi açısından da önemli bir konumu bulunmaktadır. Usul ilminin olgunlaştığı bir dönemde bu ilmin bütün konularını içerecek şekilde ele aldığı et-Takrîb ve'l-irşâd eseri kurucu bir usul eseri olma özelliğine sahiptir. Bu eserde Bâkıllânî, bir taraftan nazarî bir ilim olan ve bu açıdan kelâm ile benzer bazı hususiyetlere sahip usulün kelâm ilminden farklılaşan yönlerine işaret etmiş, diğer yandan usul ilmini bütünüyle şer'î sınırlar içerisinde değerlendirmiştir. Bu açıdan Mu'tezile'nin aklî teklif anlayışının izlerinin görüldüğü usul ilmini Ehl-i Sünnet dairesi içerisinde yeniden inşa etmiştir. Bu çalışma Bâkıllânî ve et-Takrîb eseri özelinde ilahi hitabın mükellefin fiilleri için hüküm olma keyfiyetini incelemektedir. Hitabın nasıl anlaşılacağı, hangi esaslar üzerine bina edileceği ve hitaptaki lafızların anlamlarının nasıl tespit edileceğine dair Eş'arî bir âlimin ortaya koyduğu kelamî ve lügavî zemin ele alınacaktır. Bu teorik meselelerin somut bir göstergesi olarak emir ve nehiydeki bazı hususlar incelenecektir."
