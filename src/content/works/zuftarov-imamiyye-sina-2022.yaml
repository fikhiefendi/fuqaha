abstract: "Bazı alanlarda yapılan çalışmalar, eksik veya yanlış olduğu için ihtiyaca cevap vermemesi bakımından yeniden ele alınması gerekebiliyor. Bunun farklı sebepleri vardır: Araştırılan konu herhangi bir mezhebin hassas konusu ise aynı hassasiyeti korumaya çalışarak doğru bir şekilde araştırılmalı ve açıklanmalıdır. Ayrıca, bir mezhebin görüşü ele alındığında farklı mezheplerin kaynaklarına da müracaat edilmeli ve taassuptan uzak bir araştırma ortaya konulmalıdır. Farklı iddialara dikkat edilmediği takdirde yapılan çalışma ihtiyacı karşılayamayacağı, eksik veya yanlış anlaşılacağı için aynı çalışmanın yeniden ele alınıp işlenmesi gerektiğini düşünüyoruz. Bu yüzden biz İmamiyye Şia`sı'na göre imamet konusunu ele almayı tercih ettik. Bu çalışmada yalnız İmamiyye Şia`sı'nın değil, Ehl-i Sünnet`in de konuyla alakalı görüşlerini açıklamaya çalıştık. İslam alimleri imamet hususunda farklı yorumlar yapmış ise de, biz Ehl-i Beyt imamlarının ve her iki mezhep alimlerinin naslarla açıklamaya çalıştıkları görüşleri ortaya koymaya çalıştık. İmamet konusu ile ilgili mezhepler arasında ciddi görüş farklarının olduğu bilinmektedir. İmamiyye Şi'ası'nın imamet meselesini temel inanç esası olarak almalarının dayanakları ve Ca`feri alimlerinin imamet meselesinde kendi iddialarına delil olabilecek naslar ele alınmış ve onlar üzerindeki açıklamaları tahlil edilmiştir."
