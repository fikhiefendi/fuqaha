abstract: "Faiz tarih boyunca insanlığın ızdırap çektiği önemli problemlerden biri olmuştur.İslam öncesi cahiliye döneminde varlıklı insanlar,zorda olan insanlara borç verirken yüksek faizler koyarak insanları acımasızca sömürmüşlerdir.Borcunu ödemeyenlerin faizleri katmerli bir şekilde arttırılarak,zordaki insanların emekleri sömürülmüştür.Hatta İslam öncesi dönemlerde birçok insan faiz borcunu ödeyemediği için borçlarına karşılık köle yapılmıştır.Bu açıdan cahiliye dönemi tam bir tefecilik zihniyetinin hakim olduğu bir dönemdir.İslam,insanların emeğini sömürme aracı olarak kullanılan faize karşı cephe almış,faizin her türlüsünü yasaklamıştır.Fakat ne hikmetse bütün olumsuzlukları bilinmesine rağmen,günümüzde faiz artık devletlerin kontrolünde uygulanan bir müesese haline gelmiştir.Daha ilginç olanı,günümüzde faizin iktisadi hayatın bir gereğiymiş gibi savunulmasıdır.Oysa faiz vasıtasıyla zayıf ülkelerin sömürüldüğü,ekonomilerin çöktüğü,faiz sebebi ile birçok insanın servetini kaybettiği,ailelerin dağıldığı artık herkesin bildiği bedihi bir gerçektir.Kısacası faiz, günümüzde de birçok iktisadi,sosyal ve ferdi problemlerin ana sebeplerinden biri olarak durmaktadır. İşte bütün bu olumsuz etkilerinden dolayı İslam faizi kesin bir şekilde yasaklamıştır.Kur'an, faiz yemeyi, Allah ve Resulü'ne harp açmakla bir tutmuştur.Bu çalışmada,İslam'ın faizi niçin yasakladığı üzerinde durulmuş,faiz konusu İslami bir perspektifle ele alınıp işlenmiştir.Giriş bölümünde faizin tanımı,tarih içerisinde nasıl bir seyir takip ettiği ve faiz çeşitleri ele alınmıştır. Birinci bölümde,İslam hukuku açısından faizin çeşitleri üzerinde durulmuştur.İslam'ın yasakladığı faiz çeşitleri alış-veriş faizi,fazlalık faizi ve vade faizleridir.Alış-veriş faizi, kendisinde faiz cereyan eden mallar arasında meydana gelen faizdir.Cinsi ve türü aynı olan malların değişiminde şart koşulan fazlalık ,alış-veriş faizidir.Beş yüz kilo buğdayın altı yüz kilo buğdayla değiştirilmesinde fazlalık faizi cereyan eder.Bu tabir daha çok hadiste sayılan altı çeşit malda (altın,gümüş,buğday,hurma ,tuz ve arpa) cereyan eden faiz için kullanılmaktadır.Fazlalık faizi de mahiyeti itibarı ile aslında alış-veriş faizinin aynısıdır.Ancak bu sadece yakarıda sayılan altı maddeyi değil, kendisinde faiz cereyan eden tüm malların faizi anlamında kullanılmaktadır. Diğer bir faiz türlü ise neise de denilen vade faizidir.Bu faiz türü,kendisinde faiz cereyan eden malların değişiminde bir tarafın malı peşin teslim ederken, diğer tarafın borca bırakması şeklinde ortaya çıkan faizdir. Bir taraf vadeden istifa ile diğer tarafa haksızlık yaptığı için bu işlem de faiz kabul edilmiş ve yasaklanmıştır. İşte bu bölümde faizin bu üç çeşidi İslam hukuku açısından ele alınıp incelenmiş,bu tür muamelelerin neden ve hangi durumlarda faiz sayılacağı ve buna dair tafsilatlı hükümlerin neler olduğu ortaya komaya çalışılmıştır. İkinci bölümde,normalde alış-veriş gibi gözükmekle beraber aslında kendisinde faiz cereyan eden alış-veriş çeşitleri ele alınmıştır.Bunlar,Beyu'l- İne,Beyu'l-Müzabene,Beyu'l-Muhakale,Beyu'l-Taksit gibi alış-veriş çeşitleridir.Bu tür alış-verişlerde faizin cereyan edip etmediğine dair fukahanın görüşleri ve delilleri verilip bu görüşler mukayese edilmeye çalışılmıştır.Bu kapsamda günümüzde çok yaygın olan vadeli alış-verişlerde faizin cereyan edip etmediği işlenmiştir. Son bölümde,faizle kira, faizle alış-veriş arasındaki farklar da ortaya konmaya çalışılmıştır.Buna ilaveten şahıslarla devlet arasında faizin cereyan edip etmeyeceği,günümüz banka faizlerinin hükmü, zaman unsurunun bu konudaki ahkama tesirinin olup olmadığı,parayı sigortalamanın faiz kapsamına girip girmediği ile ilgili zamanımıza özgü bazı meselelerde de ele alınıp işlenmiştir."
