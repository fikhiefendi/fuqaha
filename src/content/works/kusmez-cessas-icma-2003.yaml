abstract: "Cessas'ın el-Fusul fi'l Usul isimli eserinin esas alındığı tez üç bölümden oluşmaktadır.Birinci Bölüm: Cessas'n Hayatı ve Eserleri başlığındadır.Bu bölüm; Cessas'ın hocaları, öğrencileri, Hanefi mezhebi ve fıkıh alanındaki yeri ve önemi, eserlerinin yaşadığı döneme yakın eserlerle mukayesesi, eser verdiği alanların bilinmesi açısından önemlidir.İkinci Bölüm: İcma'ın Hucciyyeti başlığını taşımaktadır.Bu bölüm icma'ın derli toplu olarak ilk kez Cessas tarafından Kitap ve Sünnet ile temellendirildiğinin ortaya koyulması açısından önem taşımaktadır. Üçüncü bölümde ise; İcma'ın Mün'akid Olması başlığı yer almaktadır.Bu bölümde; İcma'ın mün'akid olabilmesi için gerekli şartlar, icma'ın oluşumunu etkileyen ve etkilemeyen faktörler yer almaktadır. Tezdeki görüşler Cessas merkezli olmasına rağmen, sunulan konu hakkında mezheplerin veya ilim adamlarının görüşlerine yer verilmiştir.. Tez, Cessas'ın icma'ı ideal şartlarda ele aldığını ortaya koymaktadır. Ümmetin icma'ı ve alimlerin icma'ı kavramını birlikte ele alan Cessas, icma konusunda şüpheli görüşlere sahip olan, Rafizi, Harici, Zahiri mezhepleri gibi birçok mezhebi bu görüşün dışında tutmuştur. İcma'ı delil olduğuna ayetlerden temellendiren Cessas' a göre ' icma' sadece ve sadece ümmetine mahsustur ve bunu da bu ayetler kanıtlamaktadır. Cessas, bir devirde oluşan icma'ın ebediyyen hüccet olduğunu ve bu icma'a kimsenin muhalefetinin geçerli olmadığını savunur."
