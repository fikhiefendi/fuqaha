abstract: "?Eşler Arası Şiddeti Önlemede Fıkıhta Öngörülen Tedbirler? adlı bu çalışma `Giriş' ve `Sonuç' dışında iki bölümden oluşmaktadır.Giriş kısmında; tezin konusu, amacı, tezde ele alınan problemler ve sınırlılıkları ile araştırmada takip edilen metot hakkında bilgi verilmiştir.Birinci bölümde; genel anlamda şiddet temelinde aile içi şiddet konusu ele alınarak, bu bağlamda eşler arası şiddetin sebepleri ve türleri hakkında bilgi verilmiştir.İkinci bölümde ise; eşler arası şiddeti ifade etme sadedinde fakihler tarafından kullanılan kavramlar yanında, fıkhî düzenlemelerde yer alan, tarafların şiddetten uzaklaşmaları yönünde düzenleyici ve denetleyici hükümler üzerinde durulmuştur. Bu bağlamda eşlerin hak ve sorumluluklarının kendilerine hatırlatılması, vaki olan uyuşmazlık hallerinde hukuk çerçevesinde kimin ne gibi haklara sahip olduğu, dava neticesinde hâkimin taraflara ne gibi yaptırımlar uyguladığı, günümüzde konunun çağdaş kaynaklarda ne şekilde işlendiğini ele alan çalışmalarla yer yer mukayeselere gidilerek detaylı olarak incelenmiştir.Sonuç kısmında ise araştırmadan elde edilen netice özetlenmiştir."
