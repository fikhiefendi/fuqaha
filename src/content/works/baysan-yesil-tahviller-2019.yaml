abstract: "Yeşil tahviller, iklim projelerinin finanse edilmesinde ve iddialı uluslararası iklim hedeflerine ulaşma yolunda artan faaliyetlerde dönüştürücü bir rol oynama potansiyeli ile büyük heyecan duyulan araçlardır. Bu heyecan, yeşil tahvillerin geçtiğimiz 10 yılda aşırı büyümeleri ve yoğun sermaye aktarımına olanak tanımaları göz önünde bulundurulduğunda haklı görünmektedir. Yatırımcıların artan talebi, büyüyen ihraççı topluluğu ve sürekli olarak iyileşen piyasa koşulları ile varlık sınıfı son yıllarda önemli ölçüde genişleyen yeşil tahviller ve diğer iklim uyumlu tahvil evreninin piyasa büyüklüğü, 2018 yıl sonunda 1,5 trilyon ABD Doları'na ulaşmıştır. Bu çalışmanın temel amacı, yeşil tahviller ile geleneksel muadilleri arasındaki ilişkinin varlığını araştırarak elde edilen sonuçlara göre hem yatırımcılara bilgi sunmak hem de literatüre katkıda bulunmaktır. Bu amaçla Türkiye Sınai Kalkınma Bankası (TSKB) tarafından ihraç edilen yeşil tahvil ve geleneksel muadilinin Haziran 2016-Mart 2019 dönemindeki günlük verilerinin haftalık ortalamaları kullanılarak Johansen Eşbütünleşme ve Toda-Yamamoto Nedensellik Testleri yapılmıştır. Çalışmanın sonuçlarına göre, testlerin gerçekleştirildiği dönemde, yeşil tahvil ile geleneksel tahvilin uzun dönemde eşbütünleşik ve aralarında çift yönlü nedensellik ilişkisinin olduğu sonucuna varılmıştır."
