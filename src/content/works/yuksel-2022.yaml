abstract: "Bu çalışma, Franchise sözleşmelerinin niteliğini kamu ve özel tarifleriyle tanım açısından ele almayı amaçlamaktadır, bu sözleşme ilk olarak Amerika Birleşik Devletleri'nde ortaya çıkmış ve tüm dünyaya yayılmıştır. Franchise sözleşmesi ise franchise verenin markasını ve diğer gayri maddi mallarının kullanımını sağlamakla ve franchise alanı korumakla yükümlü olduğu, franchise alanın ise sisteme dâhil olarak mal veya hizmetlerin sürümünü gerçekleştirdiği ve bunun karşılığında franchise verene ücret ödemekle yükümlü olduğu tam iki tarafa borç yükleyen bir sözleşmedir. Franchise sözleşmelerinin benzer sözleşmeler ile en önemli farklılıklarıyla açıklığa kavuşturmuştur, imtiyaz veren ve alan tarafların yükümlülükleri ve yapılması gerek olan borçları beyan edilmektedir, Franchise sözleşmelerinin avantajlarını bazı olumlu ve olumsuz yönleriyle birlikte franchise sözleşmesinin sona ermesi nedenlerini açıklamaktadır. Bu çalışma franchise Sözleşmesi ile ilgili tüm Şer'i hükümlerini kapsayarak bu sözleşmenin geçerliliği için gerekli koşullarını ve Şer'i standartlarını da yansıtmaktadır ve günümüzdeki ticari uygulamalarını bazı örnekleriyle birlikte İslam alımlarının farklı görüşlerini Kur'an ve Sünnetten alan fıkhı hükümleri konusunda kanıtını sunmaktadır. Son olarak bu çalışma birçok önemli bulgular ve önerilerle ile sona ermektedir."
