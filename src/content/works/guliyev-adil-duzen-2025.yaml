abstract: "Ekonomik sistemler toplumun refahını ve kaynaklarının dağılımını belirleyen en temel unsurdur. Kapitalizm ve sosyalizm gibi ana akım ekonomik sistemler uzun yıllardır küresel ekonomi sahnesine hâkim olmuştur. Ancak bu iki sistemin alternatifi olan İslam ekonomisinin günümüzdeki uygulama alanları oldukça kısıtlıdır. Adil Düzen, Türkiye'de 1990'lı yıllarda Prof. Dr. Necmettin Erbakan tarafından ortaya atılan ve Refah Partisi'nin siyasi vizyonunu şekillendiren bir ekonomik, sosyal ve siyasal sistem önerisidir. Akevler Kooperatifi, Türkiye'de Adil Düzen fikrinin doğuşu, gelişimi ve yaygınlaşmasında merkezi bir rol oynamış hem fikri altyapının oluştuğu zemin hem de uygulama alanı olarak büyük bir öneme sahip olmuştur. Adil Düzen'in teorik altyapısı, ilk kez Akevler çevresinde tartışılmış ve olgunlaştırılmıştır, Akevler Kooperatifi vasıtasıyla hayata geçirilmeye çalışılmıştır. İşçi, mühendis ve müteahhitlerin birlikte karar aldığı demokratik yapılar oluşturulduğu Akevler Kooperatifi, faizsiz ticaret ve üretim modelleri üzerine güncel uygulamalar yapmıştır. Bu pratikler, Adil Düzen' in ekonomik yönünü şekillendirmiştir. Çalışma, Adil Düzenin insanların yaşadıkları ekonomik sorunlara kooperatifler yoluyla nasıl çözümler getirdiğini araştırmaya yöneliktir. Bu tezde iki konu öne çıkmıştır. Birincisi yeni bir dünya görüşü olarak kendisini ileri süren Adil Düzen arayışları arasında kesişen ve ayrışan hususlardır. İkincisi ise kapitalist ve sosyalist sistem uygulamaları karşısında savunmasız kalan kişiler ile emeklerinin nasıl korunacağı karşısında gelişen kooperatifçiliktir. Bu çalışmada öncelikle söz konusu sistem yaklaşımı ele alınmış, esasları belirlenmiş, tanımları üzerinde durulmuş, daha sonra ise kooperatifçilik ile söz konusu sistem arasında nasıl bir bağ kurulduğuna yer verilmiştir. Tezde Refah Partisi parti programı olarak Adil Düzen ile bu programın öne çıkmasında önemli bir rol oynayan kooperatifleşme ve nihayet söz konusu çalışmaları bir model olarak geliştiren Akevler Kooperatifi olmak üzere üç temel bileşenden oluşmaktadır. Ahlaki/dini, iktisadi, ilmi ve siyasi bileşenlerden meydana gelen Adil Düzen bu boyutları ile ele alınmıştır. Araştırma sonucunda gerek Refah Partisi gerekse Akevler Kooperatifinin yönetici kadrolarının“hakkı üstün tutan bir medeniyet”siyasetini benimsedikleri ve özellikle ortaklık ekonomisine dayan faizsiz bir sistem oluşturmak için gayret gösterdikleri ve bu konuda İslami deliller arasında yer alan“içtihat”yöntemini esas aldıkları, İslam ahlak ve maneviyatını öne çıkardıkları, özellikle ortaklık ekonomisini esas alan faizi haram kabul eden İslam ekonomisi tecrübesini geliştirmeye çalıştıkları, ilimde ekollere ve rekabete dayanan sistemi öne çıkardıkları, siyasette ise çoğunluk yerine çoğulculuğu benimsedikleri gözlemlenerek tespit edilmiştir. Yeni bir dünya oluşturmaya çalıştıkları, başarıları ve karşılaştıkları zorluklar ve yapamadıkları nedenleriyle SWOT analizinde tartışılmış ve ortaya konulmuştur."
