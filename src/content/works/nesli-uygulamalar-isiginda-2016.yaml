abstract: "“Kanunsuz suç ve ceza olmaz”şeklinde ifade edilen kanunîlik ilkesi, günümüz hukuk sistemlerinin temelini oluşturmaktadır. Bireylerin uygulanacak kurallardan haberdar olmaları, hukukî güvenliğin sağlanması bakımından önemlidir. Osmanlı ceza hukukunda kanunîlik ilkesinin geçerli olup olmadığı araştırılırken, konu bu hukuk sisteminin kendine özgü yapısı çerçevesinde ele alınmalıdır. Osmanlı hukukunda çok sık kullanılan“meşrû, şer' ve kanun üzere”ifadeleri, kanunîlik ilkesinin taşıdığı mânâ ile benzer bir anlama sahiptir. Osmanlı Devleti kural olarak İslâm hukukunu uyguladığından, çalışmada öncelikle İslâm ceza hukukunda kanunîlik ilkesi incelenmiştir. Konu bu hukuk sisteminin kavramları, kaynakları ve hukuk sisteminde yer alan suç türleri kapsamında ele alınmıştır. Osmanlı Devleti'nde kanunîlik ilkesinin daha net bir şekilde anlaşılabilmesi için had, kısas ve ta'zir suçları ayrımına gidilerek kanunnâmeler, fetvâ mecmuaları, şer'iyye sicilleri ve mühimme defterleri değerlendirilmiştir. Genel ve sancak kanunnâmelerinde çok sayıda suç tipi yer almaktadır. Bu kanunnâmeler kanunîlik ilkesinin belirlilik işlevini yerine getirmektedir. Kanunîlik ilkesinin uygulamada gerçekleşip gerçekleşmediği, çalışmada yer verilen ve daha önceden Latin harflerine çevrilmiş olan şer'iyye sicilleri ve mühimme defterleri kayıtları çerçevesinde incelenmiştir. Bu bağlamda Osmanlı hukukunun şer'î ve örfî karakteri bir bütün olarak değerlendirilmiştir."
