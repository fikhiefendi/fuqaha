abstract: "Dünya'da ekonominin gelişmesiyle beraber finansal piyasalarda yeni ürünler ortaya çıkmaktadır. Piyasalarda çok çeşitli finansal ürünler vardır fakat faizsiz anlamda bu çeşitlilik daha düşük ve ihtiyaçlara her an cevap veremez bir noktaydı. Son yıllarda bu ihtiyaçları karşılamak için özellikle İslami ülkelerde uygulaması artmış olan sukuk, ülkemizde kendine yer edinmeye başlamıştır. Sukuk aynı zamanda yine ülkemizde SPK tarafından kira sertifikası olarak telaffuz edilmektedir. Sukukun özellikle son dönemlerde katılım bankaları tarafından kullanım seviyesi artmış ve fon toplama aracı olarak önemli bir işlev görmektedir. Sukukun ülkemizde arz ve talebinin artışıyla beraber benzer özelliklere sahip fakat temelde farklı olan para piyasası ürünü bono ile getirileri üzerine karşılaştırılmalar yapılmıştır. 2015 yılından başlayarak 2021 yıl sonuna kadar olan ihraç örnekleri incelenmiştir. Çalışmada TKBB ve BİST'ten alınan veriler kullanılmıştır. İlgili tarihler arasında sukuk ihracı yapan katılım bankaları ve bono ihracı gerçekleştiren konvansiyonel bankaların verileri baz alınmıştır. İnceleme yapılırken sukuk ve bono ihraçlarının benzer tarih aralığında ve birbirine yakın vade süreleri olan örneklerin seçilmesine dikkat edilmiştir. Çalışma bütününe bakıldığında sukuk ve bono ihraç oranları birbirine paralel olarak ilerlemiş ve TCMB repo oranları ile piyasa pozisyonlarına göre ihraç oranlarında aşağı yukarı yönlü benzer hareketler görülmüştür. Son kısımda 2015 ve 2021 yılları da dahil edilerek toplam 7 yıllık süreç baz alınmış ve aktifi birbirine yakın olan bir tane katılım bankasına ait 42 veri, bir tane konvansiyonel bankaya ait yine 42 adet veri kullanılarak (her iki banka içinde yıllık 6 adet örnek ihraç seçilmiştir) aynı dönemdeki TCMB repo oranları arasındaki ilişki Toda-Yamamoto testi ile incelenmiştir. Testin sonucu olarak 3 değişken arasında çift yönlü ilişki görülmüştür."
