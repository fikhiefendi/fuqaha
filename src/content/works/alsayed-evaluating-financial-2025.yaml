abstract: "Finansal kapsayıcılık, bireylerin—özellikle hizmete erişimi kısıtlı grupların—uygun fiyatlı bankacılık, kredi, tasarruf ve sigorta hizmetlerine erişimini ifade eder. Bu çalışma, Suudi Arabistan ve Malezya'daki finansal kapsayıcılığı Şeriat uyumlu ilkelerle yapılandırılmış özel bir Finansal Kapsayıcılık Endeksi (FKE) aracılığıyla incelemektedir. Analiz, Dünya Bankası'nın 2011, 2014, 2017 ve 2021 yıllarına ait Findex verilerine dayanmakta; GSYİH, petrol rantları, cinsiyet eşitsizliği, patent başvuruları, internet penetrasyonu ve İslami Finans Ülke Endeksi (IFCI) sıralamaları gibi makroekonomik göstergeleri içermektedir. Ridge regresyonu, bu değişkenlerle finansal kapsayıcılık arasındaki olası ilişkileri keşfetmek için uygulanmıştır; ancak gözlem sayısının sınırlı olması nedeniyle bulgular genellenemez. Sonuçlar, ekonomik büyüme, İslami finans sıralamaları ve teknolojik yeniliklerin kapsayıcılığı destekleyebileceğini, petrole bağımlılık ve cinsiyet eşitsizliklerinin ise erişimi kısıtlayabileceğini göstermektedir. FKE, İslami finans sistemlerinde erişimi değerlendirmek için sağlam ve çok boyutlu bir araç sunmaktadır."
