abstract: "Mezhepte İmâmeyn olarak adlandırılan Ebû Yûsuf ve Muhammed eş-Şeybânî'nin Hanefî mezhebinin teşekkülünde yadsınamaz katkıları olmuştur. Fakat bazen İmâmeyn'in hocaları Ebû Hanîfe ile ihtilafa düştükleri fıkhî meseleler olmuştur. Meydana gelen ihtilafların bir arka planı olduğuna dikkat çekerek ve mezhep içerisinde fetvaya esas olacak görüş belirlenirken belli bir usûl takip edildiğine de işaret ederek bu çalışmayı ele aldık. Hanefî fakihler, mezhebin görüşlerini nakletmek suretiyle bazı eserler kaleme almışlardır. Telif edilen bu eserler“metin”olarak adlandırılmış, mezhebin temel görüşlerini ihtiva eden ve mezhepte itimat edilen kaynaklar olarak değerlendirilmiştir. Biz de klasik döneme ait Muhtasar ve Hidâye, mütûn-i erbaa'dan (dört temel metin) sayılan Muhtâr ve Osmanlı'da 14. yüzyılın temel metinlerinden kabul edilen Mülteka adlı eser bağlamında İmâmeyn'in ibadet ve aile hukuku alanında Ebû Hanîfe'ye muhalif olduğu görüşlerin incelemesini yaptık. Araştırmamızın ilk kısımda imamların biyografilerine ve telif ettikleri eserlere özetle yer verdikten sonra mezhep içerisinde ictihad/taklit ehl-i fukaha açısından müftâ-bih re'yi belirleme usûlü hakkında birtakım kaidelere ve mezhepte fetva verirken başvurulacak eserlere değindik. Çalışmanın ikinci bölümünde ise İmâmeyn'in görüş birliğinde olup Ebû Hanîfe'ye muhalefet ettikleri ibâdet ve âile hukuku alanındaki 53 meseleyi gerekçeleriyle birlikte incelemeye çalıştık. Çalışmanın sonunda ek olarak, mezhep içerisinde ihtilaf edilen meselelerin net bir biçimde görülebilmesi için bir tablo hazırlanmış, bu tabloda Kudûrî, Mergînânî, Mevsılî ve Halebî'nin tercih ettiği görüşler, mezhepte tercih edilen görüş ve Din İşleri Yüksek Kurulu'nun yayımladığı fetvalarda tercih edilen görüşler bir arada gösterilmiştir."
