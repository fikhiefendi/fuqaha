abstract: "İlk insanın eşi olarak yaratılan kadın, tarih boyunca hayatın her alanında var olmuştur. Kur'ân-ı Kerim'de bazen bir peygamber hanımı, bazen bir peygamber anası veya yakın bir akrabası olarak zikredilen kadın, genelde ilâhî davetin destekçisi olmuş, ancak nadiren de olsa bu davete yüz çevirmiş, bazen de düşman olarak yer almıştır. Öte yandan beşerin devamı, nikah bağıyla kurulan aile aracılığıyla olmuştur. Kur'ân-ı Kerim, ailenin huzuru ve muhafazası için aile bireylerine karşılıklı olarak birtakım haklar ve görevler tayin etmiştir. Aile birliğinin kurulması aşamasında gündeme gelen nişan ve nikah kavramlarını açıklamış; mehir, nafaka, iyi geçinmek gibi kadının haklarını izah etmiştir. İtaat kavramı altında kadının kocasına karşı görevlerine değinen İslam; güzel isim, süt emme, hidâne, nafaka, adâlet, talim ve terbiye başlıkları altında çocukların haklarını açıklamıştır. Ebeynin haklarını ihsan kavramı altında dile getirmiştir. Aile birliğinin devamının mümkün olmadığı durumlarda ise, asgarî bir zararla bu birliğin sonlandırılması hakkındaki hükümlere yer vermiş ve bunları açıklamıştır. Talak, iddet, îlâ, muhâlea, zıhar, liân gibi ailenin dağılması ile ilgili konulara açıklık getirmiştir. Kadın ve aile ile ilgili âyetlerin ifade ettiği fıkhî hükümlerin ortaya çıkarılmasında ve tefsir ilminin gerektirdiği araçları kullanarak bu konudaki âyetlerin daha iyi anlaşılmasında ahkâm tefsirlerinin katkısı inkar edilemez. Öte yandan ilk dönem klasik ve önemli mevkiye sahip ahkâm tefsirleri arasında mukayese yaparak konunun araştırılmasının, daha iyi anlama, analiz etme ve bir yargıya varma açısından önemli olduğunu ifade edebiliriz."
