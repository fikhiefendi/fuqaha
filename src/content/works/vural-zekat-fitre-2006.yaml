abstract: "SAÜ, Sosyal Bilimler Enstitüsü Yüksek Lisans Tez ÖzetiTezin Başlığı: ?Zekat -Fitre Nisabı ve Günümüz Ölçüleriyle Yeniden Tespiti?Tezin Yazarı: Hüseyin VURAL Danışman: Yrd. Doç. Dr. Abdullah ÖZCANKabul Tarihi: 23 Mayıs 2006 Sayfa Sayısı: VI (ön kısım) + 69 (tez)Anabilimdalı: Temel slam Bilimleri Bilimdalı: slam HukukuZekât müessesesi slam dininin beş temel esasından birisi olması hasebiyle önemli bir kurumdur. Bukuruma tam anlamıyla işlerlik kazandırıldığı dönemlerde toplumdaki fakirlik problemine çarebulunmuş ve insanların sıkıntıları büyük ölçüde giderilmiştir. Günümüzde zekât müessesesi ile ilgilibazı uygulamaların ?zamanın teğayyuru? prensibine bağlı olarak tam anlamıyla anlaşılmadığıgörülmektedir. Hz. Peygamber (s.a.v) döneminde olmayıp daha sonraları ortaya çıkan mallarınmevcudiyeti ve o dönemde belirlenen nisap miktarlarının bu gün işlevsel olup olmayacağı gibiproblemlerin ortaya çıkması bu durumu açıkça ortaya koymaktadır.Bu tezi; yeni ortaya çıkan malların zekâtla ilişkilendirilip ilişkilendirilemeyeceği, nisap miktarlarınındeğişip değişmeyeceği; nisabın modern ekonomi kavramlarıyla ilişkisi ve fitre miktarının güncelparasal değerinin ne olması gerektiği gibi konuları ele almayı hedeflemektedir.Bu çalışmayı yaparken günümüzde kullanılan yoksulluk sınırı, asgari ücret, açlık sınırı gibi birtakımmodern kavramları da ele alarak konumuza ışık tutmaya çalıştık. Zekât ve fitrenin bu günküdurumunu belirleyebilmek için ilk uygulamaları bünyesinde bulunduran Asrı Saadetteki örneklerinebaktık. Çalışmamızda mezhep ayrımı gözetmeksizin günümüzde uygulanabilme şansına sahip olanörneklere ve fakihlerin çoğunluğunun üzerinde ittifak ettikleri görüşlere ağırlık verdik.Sonuç olarak mali bir müessese olan zekâtın hiçbir kuruma benzemediğine, başlı başına kendisi içindebir bütün olduğuna, günümüzde ortaya çıkan çeşitli kurumlarla zekâtın fonksiyonunun yerinegetirilemeyeceğine ve değişebilir yönlerinin bulunmasına rağmen büyük çoğunluğunun taabbudiolduğuna dikkat çekmeye çalıştık.Bu çerçevede Havâic-i Asliye meselesinin halledilmesiyle nisap miktarlarının Hz. Peygamber'in(s.a.v ) belirlediği ölçülerde kalabileceğine ve fitre miktarında ise limitleri düşük tutmanın verenleriçoğaltacağına ve alanların daha çok ihtiyaçlarını giderebileceği sonucuna vardık."
