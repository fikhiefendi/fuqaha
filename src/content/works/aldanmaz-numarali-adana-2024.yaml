abstract: "Tarihi yazmanın en önemli olaylarından biri belkide en önemlisi belgelerin ve kaynakların doğruluğudur. Dolayısıyla bu konudaki en önemli obje birinci elden kaynaklardır. Bu cümleden olarak Osmanlı Devleti'nin tutmuş olduğu“sicillat-ı şer'iyye defterleri”bu bahiste değerlendirilir. Osmanlı Devleti'nin hukuki, idari, ekonomik ve ictimai hayatıyla alakalı önemli verileri bu defterler aracılığıyla öğrendiğimizden çok kıymetlidir. Kadıların tutmuş oldukları bu defterler her bir idari bölge hakkında bilgiler sunmaktadır.“8 Numaralı Adana Şer'iyye Sicili”yukarıda belirtilen konularda özelde Adana hakkında bilgiler ihtiva etmektedir. Eyalet merkezi olması hasebiyle o dönemde payitahttan gelen Asakir-i Mansure-i Muhammediye neferatına ait sayıların kazalara göre dağılımları hakkında bilgiler mevcuttur. Tereke kayıtlarındaki mirasların dağılımları, camilere atanan din görevlilerinin alacakları ücretleri, esnaf çeşitliliği ve meslek isimler bahsi geçen sicile yansımıştır. Vali, mütesellim ve diğer atamaları ve bunlara ait harç-ı rah mikdarları ele alınan konular arasındadır. Ayrıca sicilde Adana eyaletine bağlı kaza, köy, mahalle, nahiye gibi idari yapıların isimleri ve sayıları hakkında bilgiler bulunmaktadır. Veraset davalarında ortaya ortaya çıkan miraslara göre o dönemde Adana'da kullanılan eşyalar hakkında bilgiler bu belgelerle ortaya çıkmaktadır. Yine kayıtlara göre Adana'nın o dönemde demografik yapısının nasıl olduğu hakkında bilgiler verilmektedir. Müslüman ahali haricinde Hristiyan, Yahudi topluluklarının varlığından da söz etmek mümkündür."
