abstract: "Bu çalışmada, Taberî, İbn Atıyye, Kâsımî ve Süleyman Ateş'in tefsirlerinin mukaddimelerindeki yedi harf konusu incelenmiş ve gözden geçirilmiştir. Çalışmanın asıl hedefi, Taberî, İbn Atıyye, Kâsımî ve Süleyman Ateş'in yedi harf konusuna ne kadar değindiği, bu meseleyi nasıl yorumladığı ayrıca söz konusu müfessirlerin konu hakkındaki benzerlik ve farklarını tespit etmek ve bununla ilgili yorumlarını ortaya koymaktır. Bu amaçla, ilk etapta mukaddimelerdeki yedi harf konusu baştan sona kadar titizlikle okunmuştur. Okuma neticesinde elde edilen bilgilerden oluşan veriler, konu başlıkları şeklinde iki bölümde ele alınmıştır. Giriş bölümünde temel esaslar ve çalışmanın metodu verilmiştir. Birinci bölümde dört müfessirin hayatı, ilmî kişiliği, tefsiri ve kıraat ilmindeki yeri hakkında bilgi verilmiştir. İkinci bölümde İbn Cerîr et-Taberî'nin Câmiu'l-beyân an te'vîl-i âyi'l-Kur'ân, İbn Atıyye'nin el-Muharrerü'l-vecîz fî tefsîri'l-Kitâbi'l-azîz, Cemâleddin el-Kâsımî'nin Meḥâsinü't-teʾvîl'i ve Süleyman Ateş'in Yüce Kur'ân'ın Çağdaş Tefsiri adlı eserlerin mukaddimelerindeki yedi harf konusu ele alınmış ve mukayese edilmiştir. Çalışma sonuç ve kaynakça ile sona ermektedir."
