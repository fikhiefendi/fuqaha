abstract: "İslam İktisadı konusu, yaklaşık elli yıldır iktisat ilmi içersinde önemli bir yer tutmuştur. İslam İktisadı uygulamalarında, bu görüşü destekleyenler olduğu gibi karşı çıkan görüşler de vardır. Bu yeni ilim alanında yayınlanmış yüzlerce makale, kitap ve araştırma yapılmştır. Bu tez, günümüzde islam iktisadı uygulamalarının bir bölümünde ele alınmıştır. Ele alınan konuların başında anonim şirketleri gelir. Anonim şirketler kuruluş amaçları ve kuruluş sözleşmeleri, şirketlerin işleyişi ve anlamları incelenmiştir. Anonim şirketlerin karşılaşacağı riskler nasıl bertaraf edilir, risklere karşı hangi önlemler alınabilir. Bunların yanında şeri esaslara uygun olup olmama konusu ihtilaflı bir konu olmuştur. Bu tezde şirketlerin İslami esaslara uygun hale getirilmesinin kriterleri araştırılmıştır. Bu tezde bazı neticelere varılmıştır: İslami kurallar ve şeri hükümler çerçevesinde kişiler, mülkiyet haklarını korumak ve çoğaltmak hakkına sahiptir. Sözleşmelerdeki asıl olan mubahtır sözü, şeri bir hüküme dayanmamaktadır. Günümüzdeki fıkıhçılar arasında anonim şirketler konusu da ihtilaflıdır. Ağırlıklı olan görüş şeri olmadığı yönündedir. Sonuç olarak, Anonim şirketi maliyet hesaplar riskine karşı korunmak için mülkiyete dayalı veya hizmete dayalı şirket haline dönüştürülmelidir."
