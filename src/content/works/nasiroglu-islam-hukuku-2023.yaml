abstract: "Günümüzde değişen iletişim araçları ile birlikte gerçekleşen etkileşim sonucu mahremiyet algısı da değişmiştir. Her yaştan, her dilden ve her dinden insanın kolaylıkla iletişim kurabildiği sosyal medya platformları bu değişimin en önemli unsurlarındandır. Sosyal medya platformları gittikçe yaygınlaşmakta ve bireyler kişisel hayatlarıyla ilgili bilgilerini hatta mahrem alanlarını dahi paylaşabilmektedirler. Bireylerin yaptıkları bu paylaşımlar insanların merakını celp ederek zaman zaman tecessüse yol açmaktadır. İster iyi niyetli ister kötü niyetli olsun tecessüs, İslam Hukuku'nda yasaklanmış bir fiildir. İletişim açısından birçok faydası olan sosyal medya platformlarının amacının dışında kullanılması bireyi yanlışa yönlendirmektedir. Bireydeki bulunduğu toplumda kabul görmek, görünür olmak, takdir edilmek, merak vb. arzu, istek ve duygular, bireyi hem paylaşım yapmaya hem de başkalarının paylaşımlarını takip etmeye sevk etmektedir. Birey istediğine ulaşmak için zaman zaman sınırları ihlal ve ihmal ederek mahremiyet ile ilgili yasakları göz ardı etmektedir. Bunların sonucunda hem mahremiyet alanlarının daralması hem de tecessüsün artması insanları huzursuz etmektedir. Biz çalışmamızda bazı sosyal medya platformları üzerinden bunları değerlendirmeye çalıştık."
