abstract: "Bu çalışma, Osmanlı Devleti'nde XVII. yüzyıldan sonra meydana gelen hal' vakalarına/ihtilallere, bu ihtilal süreçlerini meşrulaştıran hal' fetvalarına ve bu fetva metinlerinde ileri sürülen sebeplerin, şer'i gerekçeler olup olmadıklarına odaklanmaktadır. Osmanlı Devleti'ndeki hal' vakaları Osmanlı merkezi bürokrasisindeki kilit isimlerin yürüttükleri iktidar savaşının bir sonucudur. Öte yandan hal' süreçlerinde, padişahın da, bu güçlere karşı saltanatı için mücadele verdiğine tanık olunmaktadır. Dolayısıyla Osmanlı hal' vakaları, iktidar, meşruiyet, düzen, itaat-muhalefet uyumu, isyan, ayaklanma ve iktidara başkaldırı, hükümdar değişiklikleri ile padişahların hal' edilmesinin şer'î hükmü ve imkânı gibi İslam-Osmanlı dini-siyasi tarihinin önemli meselelerinin iç içe geçtiği bir hakikate işaret etmektedir. Osmanlı Devleti'nde, geleneksel bir hale gelen hal' vakaları sonucunda bazı padişahlar, saltanattan uzaklaştırılmıştır. Bu durumun ekonomik, sosyal ve siyasi birçok farklı nedeni bulunmaktadır. Ancak hal' sürecinin, dine müracaat edilerek, şer'i zeminde takdim edilmesi ve bu yolla ihtilale meşru ve hukukî bir çerçeve kazandırılması bir teamül haline gelmiştir. Hal' sürecinin aktörleri, sebepler farklı olsa da, şeriattan ayrılan halife veya hükümdarı yeniden şeriata ittiba etmeye davet eden söylemler geliştirmişlerdir. Dine referans vermek, hal' sürecinin şer'i ve hukukî bir temele oturtulmasını temin ettiği gibi, kamuoyu oluşturulmasına ve ihtilalin hedefine ulaşmasına da imkân sağlamaktadır. Hal' vakalarını dini bir çerçeveye kavuşturan, şer'i - siyasi bir metin olan hal' fetvası olmaktadır. Hal' fetvası ile, siyasi kriz sarmalının aşılabilmesinde ihtiyaç duyulan meşruluk temin edilmektedir. Yine bu fetva ile dini-siyasi akıl devreye sokularak, mesele suhuletle neticelendirilmekte ve ihtilal meşrulaştırılmaktadır. Böylece bazı şer'i sebeplerle suçlanan hükümdarın hal' edilmesi, bir fetva suretiyle, şeriata ve hukuka uygun hale getirilerek, şeklen de olsa, İslam Hukuku'na riayet edilmiş olmaktadır."
