abstract: "Evlilik birliği devam ettiği müddetçe eşler, çocuklarının bakımını ve onlarla ilgili sorumlulukları birlikte yerine getirmektedir. Ancak boşanma halinde çocukların kimin yanında kalacağı, bakım ve yetiştirilme sorumluluğunun kime ait olacağı meselesi gündeme gelmekte ve bu durum gerek çocuğun yanında kaldığı taraf gerekse diğer taraf açısından hukuki düzenlemeleri gerektiren bir problem olarak karşımıza çıkmaktadır. Bu problemlerin çözümü amacıyla anne, baba ve çocukların birbirlerine nasıl davranması gerektiğine işaret eden nasların ve fıkıhta prensib haline getirilen kuralların tespit edilerek günümüz hukukuyla mukayesesinin yapılması tezin temel hedefini oluşturmaktadır. Bu çalışmada, hidâne ve velâyet gibi çocuğun bakımına ilişkin temel kavramlar üzerinde durulduktan sonra sonra ilgili naslar verilerek konunun fıkıh kaynaklarında işlenişi ve günümüz hukukuyla karşılaştırılması yapılmıştır. İslam hukukunda boşanmış ailelerin çocuklarına ilişkin düzenlemeler ile modern hukuktaki velâyet düzenlemesi arasında bazı farklılıklar bulunmaktadır. İki hukuk arasındaki en temel ayrım, İslam Hukukunda çocuğun özellikle annesine ihtiyaç duyduğu dönemde annenin, herhangi bir sebeple bu hakka sahip olamadığı durumlarda çocuğun babaya değil çoğunlukla anne tarafından üçüncü kişilere teslim edilmesidir. Modern hukukta ise tarafların eşit olması halinde anne ya da babaya teslim edilmesi hususu hâkimin takdir yetkisine bırakılarak düzenlenmiştir. Yapılan değerlendirmeler sonucunda, çocuğun babası dururken üçüncü kişilere teslim edilmesinin bazı mahsurlar içerdiği kanaatine varılmıştır."
