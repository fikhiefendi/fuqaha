abstract: "Usûlü's-Serahsî ve el-Müstasfâ min ilmi'l-Usûl adlı eserlerde lafızların manalarına delâleti bahsi fakihler ve kelamcılar metodları bağlamında mukayese edilmiştir. Mukayeseye lafızlar bahsi dâhil edilmemiştir. Mukayese yapılırken önce konu betimleme yöntemiyle olduğu gibi ortaya konulmuş sonra karşılaştırma yöntemi ile delaletler arasında açığa çıkan farklılıklar ile ortak yanlar tespit edilmiştir. Bu mukayesenin maksadı fakihler ve kelamcılar metodlarının en zirve örnekleri olan bu usûl eserlerinde ne gibi farklılıkların açığa çıkacağını, ortak yanlarını, konunun füru fıkha etkisini ve Serahsî ile Gazzâlî gibi dakik ve özgün usûlcülerin konuya katkılarını tespit etmektir. Ayrıca bu çalışma bu usûl eserlerini lafızların delâleti bahsinin tümüne şamil olarak mukayese eden başka herhangi bir çalışma bulunmaması sebebiyle yapılmıştır. Mukayese sonucunda lafızların manalarına delâleti bahsinde birkaç hususta ciddi farklılıklar ve birçok mevzuuda ortak olunan noktaların bulunduğu ve Serahsî ile Gazzâli'nin bazı noktalarda konuya birtakım kazanımlar sağladıkları tespit edilmiştir. Farklılıkları teşkil eden hususlar şunlardır: el-Müstasfâ'da kıyas lafzî delâlet olarak değerlendirilmekte iken hem Kelamcılar hem de Serahsî ile Fakihler kıyası lafzî delâlet olarak değerlendirmemektedirler. Mefhûmu'l-muhalefe yine el-Müstasfâ müellifi Gazzâlî tarafından bütün türleri ile kabul edilmemekle birlikte bazı türlerinin kabulü ile lafzî delâletlerden addedilirken, kelamcı usûlcülerin çoğunluğu tarafından bu delâlet diğer türleri ile birlikte lafzî delâletlerden kabul edilmektedir. Usulü'sSerahsî'nin müellifi Serahsî ve fakih usulcüler tarafından ise bu delâlet fâsid bir istidlâl olarak görülür. Delâletlerin tearuzu meselesinde delâletlerin farklı kuvvet derecelerinde görülmeside farklılığı teşkil eden önemli bir diğer husustur. Pratiğe dönük bir etkisi olmamakla birlikte bazı noktalarda yine farklılıklar mevcuttur. Bu farklılıkların başında delâletlerin farklı isimlendirilmelerini zikredebiliriz. Bu tür farklılıkların bir diğeri ise delâletlerin farklı üst başlıklar altında değerlendirilmesidir. Serahsî ile Gazzâlî'nin lafızların manalarına delâleti bahsinde ortak noktaları ise çoktur. İktizâ delâletinde muktezanın umum ifade etmemesi, mefhûmu'l-muvafaka delâletini kıyastan farklı görmeleri, mefhûmu'l-muvafaka delâletinde hem evla çeşidini hem müsavi çeşidini geçerli saymaları, nassın delâletinde kastedilen anlamın önemine vurgu yapmaları gibi hususlar ortak noktaları oluşturmaktadır. Ayrıca Gazzâlî'nin işâretin delâletini bir kelamcı usûlcü olarak ilk defa eserinde zikretmeside Serahsî ile ortak noktalarını oluşturan bir diğer husustur. Bu sonuçlara ek olarak her iki Usûlcü'nünde bağlı oldukları ekollere muhalif olmama gibi bir kaygı taşımaksızın gerektiğinde seleflerinin kanaatlerinin dışına çıkarak kendi özgün düşüncelerini belirttikleri gözlemlenmiştir."
