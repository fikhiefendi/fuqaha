abstract: "Bankalar, geçmişi yüzyıllara dayanan, toplumun büyük bir kesimini etkileyen kuruluşlardır. Bankaların kurumsallaşan ve büyüyen yapılarına bağlı olarak faaliyetlerini etkin ve verimli yerine getirmeleri amacıyla denetim ihtiyaçları ortaya çıkmıştır. Türkiye'de bankalar, mevduat bankaları, katılım bankaları ve kalkınma ve yatırım bankaları olarak temelde 3 grupta toplanmışlardır. Bu çalışmada, faizsizlik prensibiyle hareket eden katılım bankaları ile mevduat bankalarının denetim anlamında mukayesesi yapılarak, benzer ve farklı yönleri incelenmektedir. Öncelikle bankacılık sektörü ve denetiminin tanım, unsur ve çeşitlerinin üzerinde durularak, Türkiye'deki katılım bankaları ile mevduat bankalarının denetim anlamında mevzuat düzenlemelerine istinaden benzer ve farklı yönleri iç ve dış denetim perspektifinde karşılaştırmalı olarak bahsedilmiştir. Akabinde dünyada İslami finans prensiplerine uygunluk denetimine ilişkin standartları belirleyen kuruluşlara yönelik bilgiler verilerek denetim anlamında yayımlanan standartların üzerinde durulmuştur. Örnek olması maksadıyla da Malezya'da İslami finans prensiplerine uygunluk denetimine ilişkin oluşturulan model, kapsam ve çalışmaların değerlendirilmesine yer verilmiştir."
