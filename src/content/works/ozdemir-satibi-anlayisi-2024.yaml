abstract: "Bid'at kavramı terim olarak“ dinde daha önce benzeri bulunmayıp sonradan ortaya çıkan (muhdes) şey”anlamına gelmektedir. Bid'at kavramına sahabe döneminden bu yana çeşitli yorumlar yapılmış ve belli çerçeveler çizilmiştir. Kimi bu çerçeveyi geniş tutarken kimisi de bu çerçeveyi iyice daraltmıştır. Makasın bu kadar geniş olmasının sebebi konu ile ilgili farklı yorum ve yöntemlerin varlığıdır. Bu çalışmayla önemli ölçüde konuyu ele alan Ebû İshâk İbrâhîm b. Mûsâ b. Muhammed el-Lahmî eş-Şâtıbî el-Gırnâtî' nin (ö.790/1388) bid'at ile ilgili dağınık olan görüşleri bir araya toplanmış ve değerlendirilmiştir. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmamızın kapsam ve yöntemiyle birlikte İslam hukuk literatüründe bid'at ile ilgili yapılmış klasik ve çağdaş dönemlerde ki eserlerle ilgili bilgi verdik. Birinci bölümde Endülüs'ün yetiştirmiş olduğu önemli alimlerden biri olan Şâtıbî'nin yetişmesinde önemli bir etken olan maddi ve manevi çevre, şahsiyeti, hocaları ve öğrencileri ele alınmıştır. Bunların bir semeresi olarak ortaya çıkan ve özellikle konuyla ilgili olan 'el-İ'tisâm' adlı eseri ile birlikte diğer eserlerini de tanıtmaya çalıştık. Bir başka alt başlıkla İslam hukuku çerçevesinde bid'at kavramının sözlük ve ıstılahi anlamını, ortaya çıkışı ve sebeplerini, son olarak da bid'atın taksimi ile ilgili bilgiler verilmiştir. İkinci bölümde 'Şâtıbî'nin Bid'at Anlayışı' üst başlığı altında bid'at kavramının tarifi ve içeriği, kavramın kötülenmesi ile ilgili delilleri, bid'atın kısımları, kime bid'atçı denilip denilemeyeceği, bid'atçının günah dereceleri, bid'atçıların dayanak olarak göstermiş oldukları istidlal kaynakları gibi konuyla ilgili bazı konular ele alınmıştır. Sonuç bölümünde ise Şâtıbî'nin görüş ve yöntemlerinin genel bir pörtfoyundan sonra konu ile ilgili kanaat ve önerilerimize de yer verdik."
