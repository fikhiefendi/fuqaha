abstract: "Bu çalışmada, öncelikle hicrî V. asrın Bağdat'ında yaşayan ve daha ziyade fakih kimliğiyle tanınan Ahmed b. Muhammed Ebü'l-Hüseyn el-Kudûrî'nin (ö. 428/1037) ilmî şahsiyeti ve hadis ilmine dair bazı değerlendirmeleri incelenmiş, ardından benimsediği umûm anlayışının hadis yorumundaki etkisi araştırılmıştır. Bu amaçla Kudûrî'nin kaleme aldığı ve Hanefî mezhebinde önemli bir konuma sahip olan et-Tecrîd adlı eserinin tahâret bölümünde umûm kapsamında değerlendirdiği hadislerin sübûtu ve delâleti irdelenmiştir. Bu araştırmada Kudûrî'nin et-Tecrîd'inde mana ve maksat eksenli hadis yorumunun yanı sıra Arap dil kurallarına dayalı lafız ağırlıklı bir yaklaşım tarzının da olduğu görülmüştür. Nitekim Kudûrî ve diğer Irak Hanefî fakihleri tarafından benimsenen ve nasları anlama ve yorumlama yöntemi olarak kullanılan umûm anlayışı, yoğunlukla Ehl-i hadîs taraftarlarınca önemsenen zâhirci ve lafızcı bir hadis yorumuna yol açmıştır. Buna rağmen Kudûrî'nin, yeri geldiğinde hadislerin dilsel unsurlarını bir kenara bırakarak farklı unsurları nazarı itibara alması onun, lafız-mana dengesini korumaya özen gösterdiğini ve lafızcı tavrının, re'y ve akıl yürütmekten tamamen soyutlanmadığını göstermektedir. İsnad, cerh-ta'dîl ve ilel gibi hadis ilmine ilişkin teknik meselelerde Abdurrahman b. Mehdî (ö. 198/813), Abdullah İbnü'l-Mubârek (ö. 181/797), Yahyâ b. Maîn (ö. 233/848) ve Ahmed b. Hanbel (ö. 241/855) gibi önde gelen hadis münekkitlerinin görüşlerine başvuran Kudûrî, hadisleri yorumlama sırasında kendi geleneğine sıkı sıkıya bağlı kalmaktadır."
