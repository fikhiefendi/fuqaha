abstract: "Bu çalışma, yirminci yüzyılın önde gelen İslam âlimlerinden Muhammed Sadık Muhammed Yusuf'un hayatını, eserlerini ve fıkhi görüşlerini incelemeyi amaçlamaktadır. 1952-2015 yılları arasında yaşayan Muhammed Sadık, Sovyetler Birliği'nin baskı dönemi ve ardından gelen bağımsızlık sürecinde Özbekistan'da İslami ilimlerin yeniden canlanmasında merkezi bir rol oynamıştır. Araştırmada, Muhammed Sadık'in Andican'da doğumundan vefatına kadar geçen yaşam serüveni, aldığı eğitim, görev yaptığı kurumlar ve toplumsal etkileri incelenmiştir. Tefsir, hadis, fıkıh, akaid ve tarih alanlarında kaleme aldığı yüzü aşkın eser içerikleri dikkate alınarak sınıflandırılmış ve kısaca tanıtılmıştır. Özellikle fıkhi görüşleri, Hanefi mezhebi çerçevesinde değerlendirilerek çağdaş problemlere dair görüşleri bazı örnekler üzerinden olarak incelenmiştir. Çalışma sonucunda Muhammed Sadık'ın bir din âlimi olmanın ötesinde toplumsal dönüşümün öncüsü ve modern dünyada İslami değerlerin yaşatılmasında aktif rol oynayan bir şahsiyet olduğu ortaya konmuştur."
