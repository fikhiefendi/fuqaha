abstract: "Osmanlı devletinde Tanzimat'tan sonra devlet memurları ile ilgili bilgilere hızlı ve kolay ulaşabilmek amacıyla özlük hakları konusunda yeni düzenlemeler yapılmıştır. 1879 yılında Sicill-i Ahvâl İdaresi kurulmuş, böylece memurun doğum tarihi, eğitim durumu, görevleri, eserleri, rütbe ve madalyaları gibi bilgiler Sicill-i Ahvâl İdaresi'nin bünyesindeki tercüme-i hâl dosyalarında muhafaza edilmiştir. İlmiye personelinin bilgileri de derli toplu olarak Şeyhülislamlıktan günümüze intikal etmiştir. İslâm Tarihi'nin her döneminde, Hz. Peygamber'in neslinden gelen seyyid ve şerifler, fethedilen bölgelerde İslâm'ın ve yeni devletin gücünün yayılmasında etkili oldukları gibi Hz. Peygamber'in ilmi mirasının aktarılmasında da mihenk taşı olmuşlardır. Bu çalışmada Şeyhülislamlık Belgeleri Işığında Hz. Peygamber'in ilmi mirasını günümüze aktaran seyyid ulemanın biyografileri ele alınmıştır. Şeyhülislamlık Arşivi'ndeki yaklaşık 7.554 ulema içerisinden Hz. Peygamber ve Sahabe-i Kiram nesline mensup âlimlerin kimlik bilgileri, sayısal olarak istatistiki verileri ve ilmi kariyerleri incelenmiştir."
