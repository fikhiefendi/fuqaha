abstract: "Bu çalışmanın amacı, sürdürülebilir tarımla ilgili sorunların tespit edilmesi ve çözümüne yönelik İslami ilkelerle uyumlu, kapsayıcı ve yenilikçi bir agritech iş modelinin önerilmesidir. Sürdürülebilir tarımla ilgili sorunların tespitine yönelik literatür taraması yapılmıştır. Bu kapsamnda elde edilen sorunlar 7 kategoriye ayrılarak aktarılmıştır. Sonrasında sürdürülebilir tarımla ilgili tespit edilen bu sorunların çözümüne yönelik İslam ekonomisinin ilkeleri ve İslami finansın sunduğu enstrümanlar temel alınarak; müzâraa, müsâkāt, muğārese ve icâre gibi tarımsal ortaklık ve kira sözleşmeleri ile selem, istisna, murabaha, sukuk, kitle fonlaması ve karz-ı hasen gibi finansal araçların, çağdaş tarım uygulamalarıyla entegre edildiği bir iş modeli önerilmiştir. Önerilen bu modelin geliştirilmesi ve uygulanabilirliğinin artırılması için, akademisyenler, uzmanlar ve tarımsal işletme sahiplerinden oluşan 22 kişiyle mülakatlar yapılmıştır. Yapılan mülakatlar sonrasında modelin anlaşılabilirliği, uygulanabilirliği, güçlü ve zayıf yönleri, İslami ekosisteme katkısı değerlendirilmiş olup, modelin geliştirilmesine yönelik katılımcıların önerileri alınmıştır. İkinci olarak, katılımcıların önerileri değerlendirilerek modelde yapısal değişiklikler yapılmış ve geliştirilen model önerisi nihai yapısıyla sunulmuştur. Üçüncü olarak, geliştirilen bu modelin çiftçiler ve arazi sahipleri tarafından uygulanabilirliğinin değerlendirilmesi için 11 kişiyle mülakatlar yapılmıştır. Bu aşamada yapılan mülakatlar ile geliştirilen modelin anlaşılabilirliği, uygulanabilirliği, karşılaşılan sorunları çözmedeki etkinliği değerlendirilmiştir. Yapılan mülakatlar sonunda, Türkiye'de tarım sektöründe yapısal değişimlerin yapılmasının gerekli olduğu, geliştirilen modelin uygulanabilirliğinin yüksek olduğu, sürdürülebilir tarımın sağlanmasında etkili olacağı ve İslami finans ekosisteminin tarım sektörüne aktarılmasında önemli fırsatlar sunacağı sonuçlarına ulaşılmıştır. İslami bir perspektifle ele alınan tarım konusunun hem teorik hem de uygulamaya yönelik olarak ele alınması, Türkiye'de tarım sektörünün Dünya'daki teknik ve teknolojik gelişmelere uygun olarak geliştirilmesine ve tarımsal sürdürülebilirliğin sağlanmasına yönelik önemli katkılar sunması amaçlanmaktadır."
