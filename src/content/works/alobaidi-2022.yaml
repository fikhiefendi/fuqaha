abstract: "“Örf ve onun çağdaş hukuk hükümlerine etkisi”çalışmasının önemi, örf ve âdeti bir mevzuat kaynağı olarak ele alması ve sonrasında Irak toplumunda yürürlükte olan ve uygulamadaki bazı konulara uygulanmasında yatmaktadır. Bu yerleşik geleneği geçerli, övgüye değer veya kınanabilir bir yozlaştıracak olan bu konuları, dikkate alınan yasal koşullara sunmak ve araştırma sorunu, getirilen hükümlerin ve Irak toplumundaki dikkate değer gelişmenin, etkilenen hükümlerin çoğunun değiştirilmesine katkıda bulunmasıdır. işlemlerin farklı yaşam alanları, kişisel durum vb. ile ilgili normları değiştirerek, Burada araştırmacı, hükümlerini netleştirmek için bu normları ve araştırma merkezinin amaçlarını, İslam hukukunun insan haklarını ve haysiyetini koruma konusundaki ilgi ve ilgisinin boyutunu göstermenin yanı sıra, İslam hukukunun gösterdiği çabalara ışık tutmak için ele almaktadır. Öncellerin örf ile ilgili hükümleri açıklarken ve bunların İslam hukuku ile ne ölçüde uyuştuğunu belirtirken ve araştırmacının araştırmasında bunu takip ettiği Irak, Kabul edilen bu örflerde şeriat hükümlerini ortaya çıkarmak için tümdengelimci yaklaşımda olduğu gibi, neyin doğru neyin yanlış olduğunu bilmek için, araştırma, yasal olarak kabul edilebilmesi için en önemlisi bu gelenek olan çeşitli sonuçlara ulaştı, daha sonra araştırma bölümlerinde bahsedilecek olan belirli yasal koşullar ve kontroller ile disipline edilmelidir. Bu kontrollerin boyunduruğundan kurtulan âdete gelince, hiçbir değeri yoktur ve Şeriat 'ta bir örneği değildir ve araştırma ayrıca, araştırmada sunulacak konuların, hükümlere göre hükümlerde farklılık gösterdiğini tespit etmiştir ve bunların arasında dokunulmazlık hükmü de vardır, çünkü onu kontrol eden örf, âdetin bir çözüm ve bir kutsallık etrafında döndüğü yasal koşullar ve kontroller tarafından kısıtlanmaz."
