abstract: "İslami iktisat sistemi, ekonomik hayatın yanı sıra soysal ve politik hayatla da bütünleşik durumdadır. İslami iktisadın asıl unsuru olan emek, İslami finansın da çıkış noktasını teşkil etmektedir. İslami finans teknikleri de bu bağlamda emek çevresinde ortaya çıkan, emek ile ilgili işlemleri düzenleyen ve emeğe finansal bir hüviyet kazandıran tekniklerdir. Bu teknikler, İslami finans bünyesinde İslami bankalar, İslami sigortacılık ve İslami sermaye piyasası gibi kurumlarda kendilerine kullanım alanı bulmuşlardır. Çalışmamızın konusu, faizsiz finansın temel prensiplerini açıklayarak dünyada ve ülkemizde finansın farklı alanlarında kullanılan faizsiz finans tekniklerini incelemek, Türkiye'de reel sektörde en çok kullanılan faizsiz finans ürünlerini ile bu ürünlerin kullanılma ve kullanılmama sebeplerini tespit etmek ve bu bağlamda bir takım önerilerde bulunmaktan oluşmaktadır. Faizsiz finans teknikleri, kullanım alanlarına bağlı olarak bankacılık, sigortacılık ve sermaye piyasalarında kullanılan teknikler olarak bir sınıflandırmaya tabi tutulmuştur. Türkiye'de reel sektörün faizsiz finans ürünlerini kullanma ve kullanmama sebeplerinin araştırılmasında yöntem olarak anket yöntemi kullanılmıştır. Anket, İstanbul'da merkezi ya da şubesi bulunan, farklı sektörlerden oluşan, farklı türlerde ve meşelerde, farklı yaşta ve büyüklükte toplam 152 şirkete uygulanmıştır. Toplam 7 sorunun sorulduğu ankette, şirketlerin hangi faizsiz finans ürününü kullandıkları, kullanma sebepleri, kullanmama veya kullanmak istememe sebepleri, aynı zamanda kullandıkları faizli finans ürünleri ve kullanma sebepleri gibi sorulara cevap aranmaya çalışılmıştır. Faizsiz finans ürünleri kullanan şirketlerin yarısına yakın bir kısmı faiz hassasiyetinden dolayı bu ürünleri kullanıyorken üçte birlik kısmının ise limit ve teminatlandırma şartlarından dolayı bu ürünleri kullandığı sonucuna ulaşılmıştır."
