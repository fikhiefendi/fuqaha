abstract: "Râşid Halifeler döneminden başlayarak Kûfe'de yaklaşık 60 yıl boyunca kadılık vazifesinde bulunan Kâdî Şüreyh, bağımsız ictihadlarda bulunan âlim bir şahsiyet olarak öne çıkar. İslâm hukukunun erken dönemine önemli katkılarda bulunduğu tespit edilen Kâdî Şüreyh'in fıkhî görüşleri, daha sonra bazı âlimleri de etkilemiştir. Bu etkiden en fazla nasibini alanlar ise genellikle Hanefî mezhebinin kurucu müctehidleri olmuştur. Nitekim nikâh akdi ve onunla ilgili meseleler bağlamında incelenen toplam 27 meseleden 19'unda Şüreyh ile Hanefî fakihlerin benzer yaklaşımlar sergilediği; 8 meselede ise farklı görüşlere sahip oldukları görülmüştür. Şüreyh ve Hanefî müctehidlerinin aynı çevrede yaşamaları, aynı fıkıh geleneğinden beslenmeleri ve benzer ilmî çevrede bulunmaları, görüşleri arasındaki uyumu sağlayan temel unsurlar olarak değerlendirilmiştir."
