abstract: "Bir hukuk sistemini anlamak büyük oranda o hukuk sisteminin hukuk kurallarını anlamaya bağlıdır. Hukuk kurallarının oluşumunda toplumsal ihti-yaçlar önemli bir belirleyicidir. Bir diğer önemli unsur da; onları oluşturan hu-kukçuların hareket ettikleri temel prensiplerdir. ?şte bu temel prensipler huku-kun öncüsü olan ve onlara yön veren hukukun genel ilkeleridir. Pozitif hukukta, hemen her hukuk bölümünün başında, ?genel hükümler? adı altında genel hu-kuk kuralları bulunmaktadır.Benzer bir durum, şeklen olmasa da içerik itibariyle ?slam hukuku için de geçerlidir. Pozitif hukuk doktrininde, bir yönüyle tabii hukuk düşüncesine dayanan hukukun genel ilkeleri, ?slam hukukunda da kendine has yapısıyla başlangıçtan beri mevcuttur. islam hukukçuları bir konuda hukuk kuralı ko-yarken ya da hüküm inşa ederken zahiren veya zımnen bu kurallardan hareket etmişlerdir. Çalışmamızda ?Külli kaide? veya ?genel hukuk kuralları? adı veri-len ?slam hukukunun bu genel ilkelerini, Kâsânînin Bedâ'i` isimli eseri ekse-ninde belirlemeye ve belli bir plan dâhilinde vermeye çalıştık."
