abstract: "Alâeddîn es-Semerkandî'nin telif etmiş olduğu Tuhfetü'l-fukahâ adlı kitabı Hanefî mezhebi açısından önemli bir eserdir. Mezheplerin teşekkül etmesinin ardından mezhep içi istidlal yöntemlerinden biri olarak ortaya çıkan tercihin yüz civarında örneğini barındıran eser, üslup açısından da son derece anlaşılır bir dile sahiptir.Semerkandî, eserinde yer alan tercih örneklerinde ?ve's-sahîhu? ile ?ve hüve'l-esahhu? başta olmak üzere muhtelif tercih lafızlarını kullanmıştır. Ayrıca Ebû Hanîfe, Ebû Yusuf ve İmam Muhammed dışında yaklaşık kırk kadar Hanefî fakihin görüşlerine de yer vermiştir. Ancak O örneklerin çoğunda üç mezhep imamının görüşünü tercih etmiş, yalnızca beş meselede farklı fakihlerin görüşlerini benimsemiştir.Günümüzde Hanefilerin çoğunluğunun itikattaki mezhebi olan Mâturîdîlik, ilk olarak Maveraünnehir bölgesinin Semerkand şehrinde ortaya çıkmıştır. Mâturîdîliğin kurucusu olan Ebû Mansûr el-Mâturîdî kendi zamanında hak ettiği ilgiyi görmemiş; ancak ölümünden birkaç yüzyıl sonra Semerkand Hanefî Ekolü mensubu olan takipçileri tarafından ihya edilmiştir. Mâturîdî ile birlikte Semerkand Ekolünün yeniden doğmasında en önemli katkıya sahip kişilerden biri de Alâeddîn es-Semerkandî'dir.Alâeddîn es-Semerkandî'nin en önemli temsilcilerinden biri olduğu Semerkand Hanefî kolunun görüşlerini Mîzânü'l-usûl usûl adlı eserinde dile getirmiş olduğu ve savunduğu aşikardır. Ancak mensup olduğu ekolün görüşlerinin, Semerkandî'nin furûu fıkha dair görüşlerini ne ölçüde etkilediği ise bu çalışma ile ortaya konmaya çalışılmıştır. Bu meyanda yapılan karşılaştırmalar neticesinde elde edilen sonuçlar üzerinde yapılan tahkik ile de Semerkand ekolünün görüşlerinin son dönem Hanefî fıkhı üzerindeki etkisi de tespit edilmeye çalışılmıştır."
