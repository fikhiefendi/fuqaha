abstract: "Orman kaynaklarının sürdürülebilirliği ve etkin kullanımı birçok faktöre bağlıdır. Bunlardan en başta gelenlerinin, ormanlar üzerindeki mülkiyet hakkının türü, güvenilirliği ve malike sağladığı kullanım haklarının kapsamı ve hukuksal yapısı olduğunu söylemek mümkündür. Bu çalışmanın amacı, orman mülkiyetinin gerek kamu ve gerekse özel orman mülkiyeti kapsamında hukuksal temellerini ortaya koyarak, malikin mülkiyet hakkı yoluyla sahip olduğu kullanım haklarının türlerini, kapsamını ve her bir kullanım hakkının hukuksal niteliğini açıklamaktır. Bununla birlikte, mülkiyet türü ile kullanım haklarının orman kaynaklarının sürdürülebilirliğine olan etkisinin ortaya konulması da diğer bir hedeftir.Yukarıda sayılan amaçlara ulaşmak adına çalışmanın birinci bölümünde öncelikle mülkiyet kavramı felsefi, sosyal, ekonomik, politik ve hukuki yönleriyle ele alınmış ve bu kavramın tarihi süreçteki gelişimi ve karşılaştırmalı hukuktaki durumu irdelenmiştir.İkinci bölümde ise öncelikle Osmanlı Devleti ve Cumhuriyet dönemi Türk hukukundaki arazi mülkiyeti ve orman mülkiyeti kavramları, toprak hukuku çerçevesinde incelenmiştir. Böylece, literatürde tartışmalara konu olan Osmanlı Devleti döneminden Cumhuriyet dönemine geçişte arazi ve orman mülkiyetinin şekillenişi ayrıntılı olarak ortaya konmaya çalışılmıştır. Daha sonra ise Cumhuriyet dönemi orman mülkiyet ve kullanım hakları anlayışı, literatürdeki haklar demeti teorisi açısından irdelenmiştir.Üçüncü bölümde ise Karaavrupası Hukuku, Anglo-Sakson Hukuku ve Sosyalist Hukuktaki orman mülkiyet ve kullanım hakları, ülkemizdeki orman mülkiyeti yapısının sağlam temellere oturtulması amacıyla incelenmiştir.Çalışmanın son bölümde ise ülkemizdeki orman mülkiyet yapısı, ormanların sürdürülebilirliği ana ekseninde tartışılmış ve karşılaştırmalı hukuktan elde edilen bilgiler ışığında önerilerde bulunulmuştur."
