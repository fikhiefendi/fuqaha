abstract: "İstisna akdi, özellikle gemi, uçak, ekipman ve gayrimenkul gibi ağır sanayi alanlarında yaşanan gelişmelerle birlikte günümüzde birçok ihtiyacı karşılayan önemli bir sözleşme türüdür. Ancak bu gelişmelerin beraberinde, İslamî bankalar ve finans kuruluşları tarafından bu sözleşmenin uygulanmasında bazı şer'î sorunlar ortaya çıkmıştır. Bu bağlamda, Albaraka Türk Katılım Bankası'nın sunduğu istisna akdi modeli araştırmaya konu edilmiştir. Çalışmanın amacı, söz konusu modelin, İslami Finansal Kuruluşlar için Muhasebe ve Denetim Kurumu (AAOIFI) tarafından yayımlanan istisna standardı doğrultusunda değerlendirilmesidir. Bu çalışmanın temel hedeflerinden biri, istisna sözleşmesinin fıkhî tanımını ve şer'î hükmünü ortaya koymak; ayrıca fıkıh âlimlerinin bu sözleşmeye ilişkin belirlediği temel şart ve kuralları açıklayarak sözleşmenin dinî amaçlarını değerlendirmektir. Bunun yanı sıra, uygulama esnasında karşılaşılan başlıca fıkhî sorunlar ve bu sorunların taraflar üzerindeki etkileri detaylı olarak ele alınmıştır. araştırmada, üç temel bilimsel yöntem kullanılmıştır: Tümevarım yöntemi ile istisna sözleşmesine dair fıkhî görüşler ve uygulamada karşılaşılan sorunlar tespit edilmiştir. Tanımlayıcı yöntem ile söz konusu sorunların mahiyeti ve etkileri açıklanmıştır. Analitik yöntemle ise, Albaraka Türk Katılım Bankası'nın istisna sözleşmesinde yer alan hükümler, hem klasik fıkıh metinleri hem de AAOIFI standartları ışığında değerlendirilmiştir. Araştırma sonucunda ulaşılan temel bulgu, Albaraka Türk Katılım Bankası tarafından sunulan istisna sözleşmesinin genel olarak AAOIFI tarafından belirlenen kurallar ve standartlarla uyumlu olduğudur. Ancak sözleşmede, ayıp muhayyerliği ve görme muhayyerliği gibi bazı ayrıntılı hükümlerin yer almaması, olağanüstü durumlarda sözleşmenin tadiline ilişkin açık bir mekanizmanın belirtilmemesi gibi bazı ayrıntılı noktalarda farklılıklar tespit edilmiştir. Bu farklılıklar, çalışmanın ilgili bölümlerinde ayrıntılı bir şekilde analiz edilmiştir."
