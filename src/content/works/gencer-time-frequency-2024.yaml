abstract: "İslami finansal varlıklar günümüz finansal ekosisteminde vazgeçilmez bir araç haline gelmiştir. Bu çalışmanın amacı, İslami finansal ürünleri kullanan bir portföy yöneticisinin geleneksel riskten korunmak için kullandığı yöntemleri etkin bir şekilde kullanıp kullanmadığını incelemek ve olası çözüm önerilerini ortaya koymaktır. Yapılan incelemeler sonucunda özellikle hisse senedi ağırlıklı İslami finansal varlıkların endeks bazında normal hisse senedi ağırlıklı geleneksel finansal varlıklardan anlamlı bir farklılık gösteremediği, bu farklılığı gösteremediği için de risk çeşitlendirmesinde etkin bir şekilde kullanılamadığı sonucuna ulaşılmıştır. Bu sonucun ardından yeni İslami kriterlere sahip bir endeks oluşturmak için araştırma yapılmış ve günümüzde kullanılan İslami finansal endekslere göre risk tahsisi ve performans açısından nispeten daha iyi performans gösterdiği tespit edilmiştir."
