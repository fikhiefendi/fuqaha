abstract: "Balıkesir doğumlu olmasına rağmen medrese hocalığı yaptığı ve ömrünün en bereketli yıllarını İzmir'in Birgi kasabasında geçirdiği için Birgivî lakabını alan, geçmişten günümüze İmam Birgivî olarak tanınan Mehmed Efendi (öl. 1573) Osmanlı medreselerinde yetişmiş züht hayatı ile hafızalarda yer etmiş bir âlimdir. Medrese eğitimini İstanbul başta olmak üzere Balıkesir ve İzmir illerinde almıştır. Osmanlı medreselerinde tahsilini tamamlayarak icazet alan ve devrin önde gelen büyük âlimlerinden çeşitli dersler alarak İslami ilimlerde adından söz ettirmiştir. Devlet memurluğu görevinden kendi rızası ile ayrılan Birgivî, medrese hocalığı yaparak birçok talebe yetiştirmiştir. İslami ilimlerin hemen hemen her alanında çeşitli telifleri bulunan Birgivî, hadis ve hadis usulü ile alakalı eserler de kaleme almıştır. Bu çalışmada, Birgivî'nin hayatı, ilmî kişiliği, hocaları ve yetiştirdiği talebeleri kısaca anlatıldıktan sonra, ilim ve ahlaka dair hadislerden müteşekkil el yazması eserinin tahkik ve tahrîci ele alınmıştır. Çalışma, bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında, tezin amacı, önemi, kapsamı, metodu ve kaynak değerlendirmesi yer almaktadır. Birinci bölümde, Birgivî'nin hayatı ve eserleri kısaca anlatılarak, Kitâbü'l İstihsân'ın tahlili yapılmıştır. İkinci bölümde, tahrîcin tanımı ve çalışmada takip edilen tahrîc metodu ile tahkikin tanımı ve metodu verildikten sonra, Kitâbü'l İstihsân'ın tahkik ve tahrîci yapılmıştır. Tezin sonuç bölümünde ise ulaşılan neticelere yer verilmiş ve konunun genel değerlendirilmesi yapılmıştır."
