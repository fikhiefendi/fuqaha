abstract: "Bu tez, Türkiye'de katılım bankacılığı sektörünün gelişimini ve performans dinamiklerini Kuveyt Türk Katılım Bankası örneği çerçevesinde incelemeyi amaçlamıştır. Çalışmada, katılım bankacılığının finansal sistem içerisindeki konumu, reel ekonomiyle kurduğu ilişki ve sektörel büyümeye katkıları teorik ve uygulamalı bir çerçevede ele alınmıştır. Bankacılık sektörünün temel işlevleri ve katılım bankacılığının faizsiz finans ilkelerine dayalı özgün yapısı değerlendirilerek Türkiye'de bu sistemin oluşum süreci, yasal altyapısı, fon toplama-fon kullandırma yöntemleri ve sektörel dönüşümüne yön veren faktörler ayrıntılı biçimde incelenmiştir. Araştırmanın son bölümünde Kuveyt Türk'ün kurumsal gelişimi, finansal büyüme göstergeleri, ürün-hizmet çeşitlendirmesi, dijitalleşme kapasitesi ve ulusal finansal yapıya yaptığı katkılar analiz edilmiştir. Bu kapsamda bankanın şube ve personel sayıları, fon toplama hacmi, fon kullandırma yöntemlerinin kompozisyonu, bireysel bankacılık performansı ve katılım bankacılığı sektörü içindeki konumu karşılaştırmalı veri analizleriyle değerlendirilmiştir. Ayrıca Kuveyt Türk'ün sosyal sorumluluk faaliyetleri, inovasyon çalışmaları, finansal teknoloji yatırımları ve uluslararası iş birlikleri ele alınarak bankanın hem Türkiye ekonomisi hem de küresel katılım finans ekosistemi üzerindeki etkileri ortaya konulmuştur. Bu çalışmada, belge ve doküman analizi yönteminden yararlanılmıştır. Bu yöntemle birlikte konuyla ilgili akademik yayınlar, raporlar, resmi istatistikler ve ilgili kurumlara ait olan veriler sistemli biçimde incelenmiştir. Bu yöntemin seçimindeki amaç, konuyla ilgili bilgi birikiminin bütüncül biçimde değerlendirilmesidir. Çalışmanın bulguları, Kuveyt Türk'ün Türkiye'de katılım bankacılığı sektörünün büyümesine yön veren başlıca kurumlardan biri olduğunu göstermektedir. Bankanın reel sektöre dayalı finansman modellerini etkin bir şekilde uygulaması, risk paylaşımı esaslı yapısı, ürün çeşitliliğini artırması, teknolojik dönüşüme uyum sağlaması ve uluslararası fon kaynaklarına erişim kabiliyeti sektördeki rekabet gücünü önemli ölçüde artırmaktadır. Değerlendirme sonuçları, Kuveyt Türk'ün sektörün kurumsallaşmasına, finansal kapsayıcılığın genişlemesine ve faizsiz finansın yaygınlaşmasına belirgin katkılar sunduğunu ortaya koymaktadır. Bu doğrultuda çalışma, Türkiye'de katılım bankacılığının yapısal dönüşümünü açıklayan bütüncül bir çerçeve sunmakta ve Kuveyt Türk örneği üzerinden sektörün geleceğine ilişkin önemli çıkarımlar sağlamaktadır."
