abstract: "ÖZET YÜKSEK LİSANS TEZİ 95 NUMARALI AMASYA ŞER'İ YYE SİCİLİNİN TRANSKRİPSİYON VE DEĞERLENDİRMESİ (Sayfa: 154-230 H. 1283-1290/M. 1866-1874) ERSOY, Nilgün TARİH ANABİLİM DALI TEZ DANIŞMANI: Prof. Dr. Efkan UZUN 2024 Şer'iyye sicilleri taşra teşkilatının vazgeçilmez kaynakları olarak kazalarda meydana gelen hukuki meseleleri, kaza bölgesini etkileyen olayları, bölgenin iktisadi ve içtimai yapısını, siyasi ve dini gelişmelerini anlamamıza ve açıklamamıza yardımcı olan birinci elden kaynak konumundadırlar. Siciller, tutuldukları döneme ait bölgenin nüfus yapısı ve nüfusun dağılımı, bölge halkının gelir kaynakları ve ekonomik durumu, şehrin profili, şehirdeki eşkıyalık hareketleri, bölgeye ait geleneksel değerler ile aile yapısı gibi konularda da bizlere bilgiler vermektedir. ''95 Numaralı Amasya Şer'iyye Sicili'' tarihi itibariyle M. 1866-1874 yıllarına ait hukuki belgeleri içeren 19. yüzyıla ait bir defterdir. 19. Yüzyıl, devlet kurumlarının hemen her alanında reformlara gidildiği bir dönemdir ve mahkemelerde de yeniliğe gidilmiştir fakat bu yenilik mevcut mahkemelerin yanında modern yeni mahkemelerin kurulmasıyla gerçekleşmiştir. Yeni kurulan mahkemelerin varlığının şer'i mahkemeleri ne ölçüde etkilediğini incelemek de döneme ait şer'iyye sicillerini incelemekle mümkün olacaktır. 95 Numaralı Amasya Şer'iyye Sicili de bu değişim ve etkilere ışık tutacaktır."
