abstract: "ÖZET Şahin, Sami, Muhammed b. el-Hasen eş-Şeybânî'nin Hadis Kültüründeki Yeri, Doktora Tezi, Danışman: Doç.Dr. t Hakkı Ünal, VHI-256 s. Tez, kısa bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Girişte konunun amacı, önemi, kapsamı ve ilgili kaynaklara kısaca temas edilmiştir. Birinci bölümde Şeybânî'nin hayatı anlatıldıktan sonra fıkıh, hadis ve diğer konularda yazmış olduğu eserleri tanıtılmış, ilmî şahsiyetiyle ilgili hoca ve talebelerinin kimler olduğu belirtilmiş, hangi kaynakları delil olarak kullandığının anlatıldığı fıkhî yönüne temas edilmiştir. Bu bölümde ayrıca Şeybânî'nin hayatına tekabül eden toplumun siyasi, sosyal ve kültürel durumu anlatılmış, hicrî ikinci yüzyılda özellikle hadis alanında kaleme alınmış eserler genel olarak tanıtılmıştır. İkinci bölümde Şeybânî'nin hadis ilmindeki konumunun ortaya konması için hadis kültürünü yansıtan Asar, Hucce, Muvatta gibi eserleri şekil ve muhteva yönünden incelenmiş, bu eserlerdeki hadis ilmiyle ilgili kullandığı terimler ve bu terimlere hangi anlamlar yüklendiği, delil olarak kullandığı hadislerin isnadında ne türlü bir yöntem uyguladığı örnekleriyle ortaya konmuştur. Şeybânî'nin metinle ilgili kriterlerini belirlemek için, hadislerin Kur' ân' a ve maruf sünnete uygunluğu, şartların değişmesiyle bazı hükümlerin de değişebileceği ilkesi, mütezat hadislerin cem ve telifi, hadislerin nâsih ve mensuhunun bilinmesi, eserin kıyasla çatışması halinde tercihi gibi konular hakkındaki uygulamaları yeterli derecede örnekler verilerek incelenmiştir. Üçüncü bölümde Şeybânî cerh ve tadil yönünden ele alınmıştır. Önce onu cerh edenlerin, daha sonra da tadil edenlerin sözlerine yer verilmiştir. Bu bölümün sonunda gerek lehte gerekse aleyhte söylenen sözlerin değerlendirilmesi yapılmıştır. Tez, araştırma boyunca ulaşılan bilgi ve bulguları içeren sonuç bölümüyle bazı teklif ve öneriler de ilave edilerek tamamlanmıştır."
