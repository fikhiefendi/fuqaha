abstract: "İslâm aile hukukunda nafaka, hak sahibine hakkının verildiği, sorumluluğu bulunan kişinin sorumluluğunu yerine getirdiği, bir kimsenin diğer canlıların hayatiyetinin sürdürülmesine katkı sağlamanın yanı sıra, eşya ve maldan yararlanmanın sürekliliğinin temini ve toplumda yardımlaşma ve dayanışma duygularının hâkim kılınarak toplumun sosyal korunmasının sağlandığı bir sistemdir. İslâm aile hukuku ilişkisinden kaynaklanan nafaka çerçevesinde bireyin önce kendisinin sonra eşinin, usûl, fürû' ve diğer mahrem yakınlarının nafakalarını sağlamakla yardımda bulunması dinî, ahlâki ve hukukî bir sorumluluktur. Evlilik birliği içinde kadının nafakasıyla sorumlu olan tek kişi kocasıdır. Hısımlık ilişkisi çerçevesinde usûlün nafakasıyla ilk sorumlu olan ve kişinin mükellefiyette ortak olmadığı fürû'udur. Bu açıdan İslâm aile hukukunda gerek evli kadının gerekse usûlün haklarının ayrıca korunduğu, toplum ve aile yapısı için ne kadar önemli bir yere sahip oldukları görülmektedir. Çalışmamızda evlilik birliği içinde nafakanın gerekli olması için mükellefiyet şartları, hukuki dayanaklar ve nafaka mükellefiyetinin düşmesine yer verilmiş, evlilik birliğinin bazı sebepler dâhilinde son bulmasından dolayı iddet nafakasıyla da mükelleflerin ve hak sahiplerinin durumları tespit edilerek çözümler sunulmuştur. Süresiz nafaka uygulamasıyla adaletsizliklerin olduğu, bireyde, toplumda ve aile yapısında ne kadar zarara sebebiyet verdiği örnekler dâhilinde görülmüştür. İslâm aile hukukunda evlilik, hısımlık ve mülkiyet olmak üzere üç sebebe dayanarak nafaka verildiği, süresiz veya süresi belli yıllara ayrılmış nafaka uygulamasının bu üç sebepten hiçbiriyle uyuşmadığı, İslâm'ın genel ilkeleriyle bağdaşmadığı görülmüştür. İslâm aile hukukunda hısımlık nafakasının evlilik nafakasıyla birbirini tamamlayıcı mahiyette hükümler içerdiği ve belli bir sistematik içinde mükellefiyetlerin belirlendiği, bir kimsenin evlilik veya hısımlık nafakasıyla mükellef olacak kimsesi bulunmadığında“velisi olmayanın velisi devlettir”anlayışıyla sosyal devletin gereği olarak nafakayı üstlenmesi gerektiği görülmüştür. İslâm aile hukukunun konuya ilişkin genel hükümleri ve ilkeleri incelendiğinde her dönem ve zamana hitap ederek günümüz nafaka problemlerinin çözümünde de başvurulacak ilk kaynak olduğu görülmektedir."
