abstract: "Günümüz dünyasında küreselleşmenin de etkisiyle ulus içinde yapılan ticaretin yanı sıra uluslararası ticaret de her geçen gün artarak devam etmektedir. Tüm dünyada ulusal bazda ve uluslararası düzeyde gerçekleştirilen ticari hareketliliklerde KOBİ'ler (Küçük ve Orta Büyüklükteki İşletmeler) önemli unsurlardan bir tanesidir. Ülke ekonomilerinin önemli bir taşıyıcısı konumunda olan KOBİ'ler ile ulusal ve küresel bazda gerçekleşen bu ticarette ülke olarak öne geçmek, sürdürülebilirliği sağlamak, dış ticarette artı vermek için işletimlerinizin de güçlü olması gerekmektedir. KOBİ'lerin ve dolayısıyla ülke ekonomilerinin bu niteliklere sahip olabilme noktasındaki en önemli dayanakları güçlü bir finansal yapıdır. Kendi öz sermaye güçlerinin yetmediği zamanlarda finansman ihtiyaçlarının zamanında ve uygun koşullarda karşılanması için tüm dünyada bankacılık sistemi aktif rol oynamaktadır. Finans sektörünün en önemli aktörü olan bankaların yurt içinden veya yurt dışından buldukları finansmanlar ile işletmelere sermaye aktarımı yapması sayesinde işletmeler ulusal veya uluslararası düzeyde rekabet gücü yakalayabilmektedirler. Son dönemde ülkemizde konvansiyonel bankaların yanı sıra katılım bankaları da finansman alanında adından söz ettirmeye başlayarak her geçen yıl reel sektöre verdiği desteği arttırmaktadır. Yakın bir sürece kadar sadece özel ve yabancı sermayeli bankaların hâkim durumda olduğu Türkiye katılım bankacılığı sektörüne kamu otoritesinin sektördeki canlanmaya ve artan hacme kamu otoritesi de kayıtsız kalmayarak son dönemde hızlı şekilde sektöre giriş yapması ile sektörün konvansiyonel sistemle arasındaki farkı kapayarak sektöre kamusal sermayenin girişinin sektöre bir dinamizm kazandırması durumu ortaya çıkmıştır. Bu sürecin performans göstergeleri ile yıllar itibariyle gözlenmesi amacından hareketle çalışmada kamusal sermayeli katılım bankalarının sektöre girişinin ortaya çıkardığı etkinin ölçülmesi amacıyla çalışmada 2010: Q1-2020: Q2 yılları arasındaki veriler ile dinamik panel veri analizi yöntemi kullanılarak analizler gerçekleştirilmiştir. Çalışmanın sonucunda kamusal sermayenin sektöre girmesinin olumsuz etki ortaya çıkardığı yapılan analizler sonrasında gözlenmektedir. Buradan hareketle kamu sermayeli katılım bankalarının daha çok yaygınlaşarak ölçek ekonomisi etkisi yaratmasıyla sektöre olumlu katkı sağlayabilir. Aynı zamanda Kamu katılım bankaları devlet otoritesini kullanarak yurt içi ve yurt dışından daha çok kaynak temin edebilir. Bu bağlamda da avantaj sağlayarak sektöre önemli bir katkı ortaya çıkaracağı düşünülmektedir."
