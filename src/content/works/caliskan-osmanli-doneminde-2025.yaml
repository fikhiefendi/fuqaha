abstract: "Bu çalışma, Osmanlı Dönemi'nde İçel Sancağı sınırları içindeki vakıf kurumlarını incelemeyi amaçlamaktadır. Silifke, Mut, Ermenek, Anamur, Gülnar ve Selendi (Gazipaşa) kazalarını kapsayan sancağın kendi isminde idarî merkezi olmadığı için tarihsel süreçte önce Ermenek, ardından Silifke idarî merkez olarak kullanılmıştır. İçel sancağında yer alan vakıflar; eğitim, ibadet ve sosyal amaçlarla kurulmuş olup, bu yapıların tespiti ve incelenmesi arşiv belgelerine dayalı olarak gerçekleştirilmiştir. Çalışmada başta vakfiyeler olmak üzere, tapu tahrir defterleri, şer'iyye sicilleri, hurufat defterleri, salnameler, evkaf muhasebe defterleri ve şahsiyet kayıtlarından istifade edilmiştir. Tez, giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde İçel'in coğrafî, tarihî ve idarî yapısı ele alınmış; vakfın tanımı, hukukî statüsü ve işlevleri açıklanmıştır. Birinci bölümde, eğitim ve öğretim amaçlı vakıflar kapsamında medrese, mektep, muallimhane ve dârülhuffâz gibi yapılar incelenmiştir. İkinci bölümde, ibadet amacıyla kurulan vakıflar çerçevesinde cami ve mescitler ile bunlara bağlı görevli atamaları ve vakıf gelir-giderleri ele alınmıştır. Üçüncü ve son bölümde ise sosyal amaçlı vakıflar başlığı altında zaviyeler, türbeler, hamamlar ve avarız vakıfları değerlendirilmiştir. Araştırma sonucunda, İçel Sancağı'nda vakıfların sadece dinî yapılarla sınırlı kalmayıp, eğitimden sosyal yardıma kadar geniş bir alanda toplum hayatını düzenleyici bir yapıya sahip olduğu tespit edilmiştir. Bu yönüyle vakıflar, kamu hizmetlerinin sürekliliğini sağlayan temel kurumsal yapılardan biri olarak karşımıza çıkmaktadır."
