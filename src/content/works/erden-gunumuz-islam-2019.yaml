abstract: "İslâm aile hukukunda eşlerin arasının açılması korkusunun bulunması durumunda erkeğin ve kadının ailesinden birer hakem tayin edilerek eşlerin aralarının bulunması anlamına gelen ve“tahkim”adıyla vücut bulan bu müessese gizli, güvenilir ve pratik hususiyetlerinin yanında yoğunluk sebebiyle yeterli gelmeyen hukuk düzeninin sağlıklı bir şekilde yürütülmesine katkılar sağlamaktadır. Bu nedenle birçok İslâm ülkesi, İslâm dininin tesis ettiği bu müesseseye kanunlarında yer vermiş ve eşlerin boşanma davası görülmeden önce bir hakeme başvurması gerektiğini, ancak bu şekilde bir çözüm bulunamaması halinde boşanma davalarının mahkeme sürecinin başlayacağını söylemişlerdir. Hz. Peygamber döneminden itibaren var olan bu uygulamanın günümüz İslâm aile hukuku kanunlarında nasıl ve ne şekilde yer aldığını, söz konusu ülkelerde nasıl icra edildiğini, Kur'ân'ın ortaya koyduğu usûle uygun olup olmadığını göstermeyi hedefleyen bu çalışma, iki bölümden oluşmaktadır. İlk bölümde genel tahkim ve İslam aile hukukunda tahkim, ikinci bölümde ise her biri birer İslâm ülkesi olan Katar, Malezya, Fas, Pakistan ve Suudi Arabistan aile hukuku kanunlarında yer alan tahkim usûlünün mahiyeti, mahkeme kayıtlarıyla birlikte ülkelerin uygulamaları arasındaki benzerlikler ve farklılıklar ele alınacaktır."
