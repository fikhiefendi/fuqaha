abstract: "İslam fıkhında; seyahatte ibadet hükümleri dışında kalan yolcu hak mükellefiyetlerini konu edinen bu araştırmamız; giriş, birinci bölüm, ikinci bölüm ve sonuç olmak üzere dört ana bölümden meydana gelmektedir. Giriş bölümünde araştırmanın konusu, amacı, yöntemi ve kavramsal çerçevesi ile temel kaynakları açıklanmıştır. Birinci bölümünde seyahat kavramı, mahiyeti, çeşitleri ve ilişkili olduğu diğer kavramlar ortaya konulmuştur. Bu bölümde Kur'an ve sünnette sefer şekilleri, sefer ve yolculukların hedefleri anlatılmıştır. İkinci bölümde sefer ve yolcu kavramı, sefer çeşitleri, bireylerin hukuki statülerine göre sefer hükümleri anlatılmıştır. Bu Bölümde seyahat akdinin niteliği, kayıt altına alınması, seyahat belgesi (bilet) ele alınmış hukuki hususiyeti, muhteviyatı, ortaya konulmaya çalışılmıştır. İkinci bölümün yolcunun hak ve mükellefiyetleri ana başlığı altındaki diğer başlığı seyahat akdinde muhayyerlik konusunun anlatıldığı bölümdür. Bu bölümde yolcunun muhayyerlik hakları başlığı altında; meclis muhayyerliği, görme, şart, tayin ve ayıp muhayyerlikleri tarif edilmiş, seyahat akdindeki hükümlerin hem yolcu hem seyahat şirketi açısından sonuçları ortaya konulmaya çalışılmıştır. Tezimizin ana konusu olan seyahat akdi yolcu ve şirketinin hakları ve mükellefiyetlerinin ele alındığı bölüm ise sonuç kısmından önce ele alınmıştır. Bu bölümde hakların çıkış kaynakları ve seyahat akdinin çıkış kaynağı açıklanmış mükellefiyet hak ilişkisi belirtilip seyahat akdi taraflarının hakları ve mükellefiyetleri maddeler halinde açıklanmıştır. Tezimiz sonuç kısmıyla bitirilmiştir."
