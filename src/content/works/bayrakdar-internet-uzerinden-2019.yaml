abstract: "İnternet üzerinden yapılan alışverişlerde akdin konusunun bilinir olması konulu çalışmamız üç bölümden oluşturuldu. İlk bölümde mal kavramı, akit kavramı ve akdin unsurları tanıtıldı. Akdin geçerli olması için taşıması gereken şartlar üzerinde durularak tezimizin amacına uygun bir zemin oluşturulmaya çalışıldı. İkinci bölümde internet ve elektronik ortam hakkında kısa bilgiler verildi. Elektronik ticaret için kullanılan iletişim araçları tanıtıldı. İnternet üzerinden akdedilen sözleşmelerin özellikleri ve klasik akitlere ek olarak taşıması gereken şartlar üzerinde duruldu. Üçüncü bölümde internet üzerinden yapılan alışverişlerde akdin konusu üzerinde duruldu. Sözleşmenin konusunun türleri içeriği ve taşıması gereken şartlar belirlendi. Sözleşmenin konusunun bilinebilme yöntemleri, sözleşme konusu hakkında bilmenin/bilgilendirmenin niteliği üzerinde duruldu."
