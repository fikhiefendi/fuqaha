abstract: "Temel İslami bilimlerden biri olan İslam hukuku, asırlar boyu Müslüman toplumların hayatına yön veren en etkin ilim dallarından biridir. Bu alandaki bilgi, dinin bireysel ve toplumsal yaşamla ilgili kurallarını inceleyerek, değişen coğrafya ve yaşam koşullarında İslam'ın nasıl yaşanacağına dair bilgiye kaynaklık etmektedir. Bu doğrultuda zaman içerisinde, pratik hayatın her yönünü kapsayan zengin fıkhi bir birikim oluşmuştur. Bu birikim neticesinde farklı perspektiflerle incelenen fıkhi konuların ele alınma biçimleri çeşitlenmiştir. Nitekim metin, şerh, hâşiye, kavâid, eşbâh ve'n-nezâir, fürûk, vâkıat, nevâzil ve küllî kâide literatürü gibi yazım türleri ortaya çıkmıştır. Bu alt edebî türler, fıkıh ilminin canlı ve dinamik yapısını gösterirken, aynı zamanda hükümlere ulaşmayı da kolaylaştırmıştır. Özellikle el-Eşbâh ve'n nezâir ve kavâid-i edebiyatı geniş bir yelpazede bulunan furû' fıkıh konularını belirli kategoriler altında inceleyerek, gerek mevcut meseleleri gerekse gelecekte ortaya çıkabilecek meselelerin ortak yönlerini ve aralarındaki temel farklılıkları tespit edip çözüme kavuşturma noktasında fakihlere büyük kolaylık sağlamıştır. Çalışmamız da bu alanın öncü eserlerinden biri olan İmam Celâleddin es-Süyûtî'nin (ö. 911/1505) el-Eşbâh ve'n-nezâir adlı eseridir. Tezimiz iki ana bölümden oluşmaktadır. İlk bölümü iki kısma ayırdık. Birinci kısmında İmam Süyûtî'nin hayatı ele alınmıştır. Bu bağlamda Süyûtî'nin nesebi, doğumu, ailesi bununla beraber ilmi hayatı, yetişmesi ve yaşadığı dönemdeki siyasi ve sosyal duruma kısaca değinilmiştir. İkinci kısmında ise konumuzla yakından alakalı olmasından dolayı küllî kâide terimi ve ilgili kavramların açıklanması ve tarihsel süreci, gelişimi, delil olma vasfı gibi özellikleri incelenerek kısaca ele alınmıştır. İkinci bölümünde ise tezimizin ana konusunu oluşturan eserin ikinci kısmında yer alan kırk küllî kâidenin açıklama ve yorumlamalarına ve varsa istisnai durumlara yer verdik. Bununla beraber her bir kâideye kaynaklık eden ilgili ayet ve hadisler, varsa delil gösterilerek konunun şer-î delilleri ortaya koyduk. Mecelle de yer alan kâideler ile çalışmamızda yer alan benzer kâideleride belirttik."
