abstract: "İnsanların toplum içinde yaşayan bir varlık olması sebebiyle sosyal ilişkilerini devam ettirirken birtakım anlaşmazlıklar yaşamaları kaçınılmazdır. Ortaya çıkan bu uyuşmazlıkların çözüme kavuşturulması için çeşitli hukuki yollar mevcuttur. Uyuşmazlığı yaşayan tarafların, uygun şartları taşıyan bir kişiyi ya da kişileri hakem olarak seçmesi neticesinde onun verdiği hükme uyarak bu anlaşmazlığı sonuçlandırmalarına tahkim denir. İhtilafların çözülmesinde oldukça pratik bir yöntem olarak hukuka hizmet eden tahkimin uygulanabilirliğinin artması ve özelliklerinin kavranabilmesi isteği bu çalışmanın ortaya konulma amacıdır. Tahkimin tarihçesi hukuk tarihi kadar eskiye dayanmaktadır. Bu çalışmanın ilk bölümünde, kaynakların ışık tuttuğu ölçüde tahkim müessesinin tarihteki yeri aydınlatılmaya çalışılmıştır. İkinci bölümde ise tahkim müessesesinin İslam hukukundaki yeri ele alınmıştır. İslam hukukunda tahkime ilişkin kaynaklar ayrıntılı şekilde incelenmiştir. Ayrıca konunun bütünü, Mecelle-i Ahkam-ı Adliye'nin tahkime ilişkin maddelerinin süzgecinden geçirilerek hazırlanmıştır. Tahkimin şekli, şartları, hukuki değeri ve konusuna ilişkin bilgiler verilmiş olup görüş farklılıkları ortaya konmuştur. Tahkime konu olan uyuşmazlığı çözümleyecek kişi olan hakemlik kurumu son bölümde ayrıca incelenmiştir. Hakemin vasıfları, seçimi, yetkileri ve kararları incelenmiş İslam hukukçularının bu konudaki görüşleri ortaya konmuştur."
