abstract: "Bu çalışmada, meşhur kelam, fıkıh ve tefsir âlimi İmâm Ebû Mansûr el-Mâtürîdî'nin (ö. 333/944) büyük ölçüde, Te'vîlâtü'l-Kur'ân adlı eseri esas alınarak toplumsal düzen ve hukukla ilgili konu ve ayetlere yaptığı yorumlar ele alınmıştır. Çağdaş dönemde İmâm Mâtürîdî'nin din ile şeriat arasında ayrım yaptığı, buna göre onun Kur'ân'da belirlenen hükümlerin ictihâdla neshedilebileceği görüşünde olduğu ileri sürülmüştür. Ayrıca din-siyaset arasında ayırım yaptığı ve cihadı dinin bir gereği olarak görmediği de savunulmuştur. Bu itibarla çalışmamızda onun toplumsal düzen ve hukukla ilgili konu ve ayetlere yaklaşımı ele alınmıştır. Böylece onun hem İslâm geleneğindeki yeri, hem de onun üzerinden ileri sürülen iddiaların tutarlı olup olmadığı ortaya konmaya çalışılmıştır. Giriş, dört bölüm ve sonuçtan oluşan çalışmanın giriş bölümünde İmâm Mâtürîdî'nin hayatı ile ilmî kişiliğine kısaca değinilmiştir. Birinci bölümde onun din-şeriat ve din-siyaset ilişkisine dair yorumları ile klasik ve çağdaş dönemde yapılan yorumlarla karşılaştırılmış ve onun yaklaşımında herhangi bir farkın bulunup bulunmadığı ortaya konulmuştur. İkinci bölümde genel devlet ve devletler hukukuyla ilgili görüşlerine yer verilmiştir. Üçüncü bölümde ceza hukuku; dördüncü bölümde ise ahvâl-i şahsiye ile ilgili ayetlere yaptığı yorumlar ele alınmış, klasik dönemdeki yaklaşımlarla mukayesesi yapılmıştır. Çalışmanın sonucunda İmâm Mâtürîdî'nin din ile şeriat arasında ayrım yapsa da Kur'ân tarafından belirlenen hükümlerin ictihâdla neshedilemeyeceği görüşünde olduğu görülmüştür. Din ile siyaset arasında bir ayrıma gitmediği, bu itibarla da onun yorumlarından laikliğin çıkarılamayacağı sonucuna varılmıştır. Bunun yanı sıra onun cihadı İslâm'ın yayılması ve İslâm topraklarının genişletilmesi amacına matuf olarak dinin bir gereği olarak gördüğü neticesine ulaşılmıştır. Ayrıca ahkâm ayetleriyle ilgili ortaya çıkan tartışmalarda Hanefî âlimlerin görüşlerini savunduğu, dolayısıyla sıkı bir Hanefî olduğu anlaşılmıştır."
