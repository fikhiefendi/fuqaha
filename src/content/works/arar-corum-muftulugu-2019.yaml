abstract: "Hadis ilmi açısından Hz. Peygamberimizin Hadis-i Şerif'lerinin bizlere kadar sa- hih bir şekilde gelmesine vesile olan hadis âlimlerimizin geride bıraktıkları Hadis kitap- ları, kuşkusuz biz Müslümanlar için büyük bir hazinedir. Vaaz ve hutbe hazırlayan her- kesin mutlaka başvurması gereken hadis kitaplarından gereken faydayı sağlaya- bilmesi için belli bir hadis tarih ve edebiyatı bilgisine sahip olması gerekir. İşte biz de Çorum İl Müftülüğü Din Görevlilerince 2007-2011 Yılları Arasında Hazırlanan Hutbelerdeki Ha- dislerin Tahribi, isimli çalışmamızla din görevlilerinin hadis bilgilerini değerlendirmeye çalıştık. Giriş bölümünde, dinlerdeki mabet hakkında bilgi verilmekte özelliklede İslam dininin mabedi olan camilerle ilgili Kur'an ayetlerine ve Hadislere yer verilmiştir. Bi- rinci bölümde diğer dinlerde mabet olgusunu ve bu mabetlerdeki ibadetleri, dinlerin ma- betlerindeki irşat faaliyetlerini ele alırken özelliklede İslam dininde camilerin önemi- ni, İslam toplumundaki fonksiyonlarını, Camilerde yapılan irşat faaliyetlerinden olan vaaz ve hutbelerin izahını yapmaya, vaaz ve hutbelerde dikkat edilmesi gereken konuları ele aldık. İkinci bölümde; ise Çorum Müftülüğü Din Görevlilerince hazırlanan hutbelerdeki hadisler tespit edilip, Arapça metinlerinin orijinalleri anlamları ile beraber yazıldıktan sonra bu hadislerin tahrîci yapılmıştır. Hadislerin tahrîcinde başta Kütüb-ü Tis'a'dan faydalanılmış. Ancak Kütüb-ü Tis'a'da hadislerin bulunamadığı durumlarda ise diğer hadis kaynaklarına başvurulmuştur. Sonuç bölümünde ise, din görevlilerinin hadis ede- biyatı bilgileri ve hadis kaynaklarını kullanabilme bilgi ve becerileri hakkında bir değer- lendirme yapılmıştır."
