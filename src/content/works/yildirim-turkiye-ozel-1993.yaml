abstract: "ÖZET İslâm Dini'nin koyduğu prensipler çerçevesinde banka işletmeciliği yapan kuruluşlara İslâm Bankası veya Faizsiz Banka denilmektedir. Günümüzde Faizsiz Banka (İslâm Bankası) veya Faizsiz Bankacılık (İslâm Bankacılığı) uygulaması gittikçe yaygınlaşmaktadır. Faizsiz Banka'ların doğuşunu hazırlayan dinî, ekonomik ve politik sebepler vardır. Müslüman halkın elinde, İslâm Dini'nde faizin yasak oluşu sebebiyle bilinen banka sistemine gitmeyen tasarrufların değerlendirilmesi, müslüman ülkeler arasındaki sosyal, kültürel, ekonomik ilişkilerin canlanması ve özellikle fon fazlası olan müslüman ülkelerden fon açığı bulunanlara doğru bir akımın gerçekleştirilerek bu ülkelerin iktisadi kalkınmalarına katkıda bulunulması v.s. gibi sebeplerle İslâm Bankaları kurulması kararlaştırılmıştır. Bu konuda 1940'h yıllarda başlayan fikir alanındaki gelişmeler uygulama alanında ilk neticesini, 1963 yılında Mısır'da kurulan bir İslâm Bankası ile vermiştir. O yıldan bugüne kadar bir çok İslâm Bankası kurulmuştur ve bugün dünyada çoğu müslüman ülkelerde olmak üzere 37 İslâm Bankası mevcuttur. Faizsiz olarak, kâr zarar ortaklığı prensibine göre çalışmayı prensip edinen bu kurumların başlıca finans metod ve araçları mudaraba, muşaraka, murabaha ve icaradır. Bunun yanısıra, günümüz bankalarının diğer tüm işlemlerini de yapmaktadırlar. Bu kurumların Türkiye'de Özel Finans Kurumu adıyla kurulmasına 1983 yılı sonunda karar verilmiş ve iki Özel Finans Kurumu 1985 yılında ülkemizde faaliyetlerine başlamıştır. Daha önce bazı girişimlerin olmasına rağmen iki Özel Finans Kurumu'nun 1985 \\ılında Türkiye'de faaliyete geç:neleri ile birlikte gerçek anlamda faizsiz bankacılık uygulamasının da ülkemizde başlamış olduğu söylenebilir. Bunları 1989 ve 1991 yılında kurulan yeni iki Özel Finans Kurumu izlemiştir. Bu kurumlar gittikçe gelişmekte, o oranda da Türkiye ekonomisine katkıları artmaktadır. Bunu diğer bankalara göre faizsiz, alternatif finans metod ve araçlarıyla yapmaya çalışmaktadırlar. Son günlerde Barter (Takas), Risk Sermayesi (Faizsiz Kredi) gibi değişik finansman yöntemlerinin üzerinde durulduğu ve denenmeye çalışıldığı günümüz Türkiye'sinde yedi yıl önce faizsiz esasa göre çalışmak üzere kurulan bu kurumların yerine getirdikleri vazifenin gerek sosyal açıdan gerekse ekonomi açısından büyük öneme sahip olduğu düşünülmektedir."
