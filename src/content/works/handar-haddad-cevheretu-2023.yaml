abstract: "Haddâd'ın el-Cevheretü'n-neyyire adlı eseri Hanefî mezhebindeki önemli eserlerden biridir. el-Cevheretü'n-neyyire, Haddâd'ın Kudûrî'nin el-Muhtasar isimli eserine yazmış olduğu şerh olan es-Sirûcü'l-vehhâc'ın muhtasarıdır. Haddâd, el-Cevheretü'n-neyyire'de Şâfiî mezhebinin kurucusu olan İmam Şâfiî'ye birçok yerde atıflar yapmıştır. Bu çalışmada Haddâd'ın el-Cevheretü'n-neyyire'de ibadetler bölümünde İmam Şâfiî'ye yapmış olduğu atıflar incelenmiştir. Çalışmamız bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde; araştırmanın konusu, önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Haddâd'ın hayatına ve eserlerine dair biyografi kaynaklarından yararlanılarak bilgiler verilmiştir. İkinci bölümde ise el-Cevheretü'n-neyyire'de İmam Şâfiî'ye atfedilen görüşler Şâfiî kaynaklardan incelenmiştir. Araştırma neticesinde İmam Şâfiî'ye 103 atıf yapılmış bu atıfların 99 tanesinde isabet edilirken 4 tanesinde isabet edilmediği görülmüştür. Sonuç bölümünde ise yapılan atıfların doğruluk oranı tablo halinde verilerek elde edilen bulgular paylaşılmıştır."
