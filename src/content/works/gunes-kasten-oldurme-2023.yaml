abstract: "Kasten öldürme suçu, insanlık tarihi kadar eskiye dayanmakta olup, eski hukuk dönemlerinde Roma, Mısır, İbrani ve İslam hukuku gibi hukuklarda yer almıştır. Osmanlı döneminde ilk olarak Fatih Sultan Mehmet Kanunnamesi'nde, son olarak 1858 yılında \"Ceza Kanunname-i Hümayunu'nda düzenlenmiştir. Cumhuriyet dönemindeki kanunlaşma çabalarının sonucu 01.03.1926 tarihli ve 765 sayılı Türk Ceza Kanunu(TCK) m.448 ve devamında yer almıştır. Günümüzde ise 26.09.2004 tarihli ve 5237 sayılı TCK m.81'de bu suçun temel hali, TCK m.82'de ise nitelikli halleri düzenlenmiştir.Kasten öldürme suçu, yaşam hakkına yönelen saldırıların yaptırımı olup, bu suçun, doğru bir biçimde uygulanması için kuralların iyi bir biçimde belirlenmesi gerekir. Bu kapsamda bu çalışmada kasten öldürme suçunun temel ve nitelikli hallerine yer verilmiştir. Ayrıca, çalışmada bu suçun tarihsel gelişimi, bu suça ilişkin hukuka uygunluk sebepleri, kusurluluğa etki eden nedenler, suçta hata, suçun özel görünüş biçimleri ile bu suça dair soruşturma usulü ve yaptırım başlıkları ele alınmıştır. Çalışmanın ikinci bölümünde bu suçun nitelikli halleri ele alınmıştır. Tasarlama suretiyle, canavarca his ve eziyet çektirme suretiyle bu suçun işlenmesi, belirli akrabalara, çocuklar ve kendini savunamayacak halde olan kişiler aleyhine işlenmesi, kadına yönelik işlenmesi, kamu görevlisine yönelik işlenmesi gibi nitelikli haller ile bu nitelikli hallere ilişkin özel durumlara yer verilmiştir."
