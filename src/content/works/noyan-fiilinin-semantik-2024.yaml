abstract: "Kur'an-ı Kerim bütün Müslümanların okuması ve anlaması gereken bir kitaptır. Kur'an'da yer alan ayetlerin doğru anlaşılabilmesi için ayetlerde geçen kavramların doğru anlaşılması gerekmektedir. Son dönemde doğru anlaşılmadığı için üzerinde tartışma bulunan kelimelerden birisi de“vurmak”manasındaki d-r-b fiilidir. Bu fiilin özellikle kocalarına itaat etmeyen evli kadın olursa üçüncü aşamada ona vurun şeklinde ayette zikredilmesi, İslam'da tüm kadınların dövülmesi tavsiye ediliyor, algısı oluşturulmak istenmektedir. Hâlbuki İslam ceza hukukunda bile en küçük karineden zanlı yararlanır. Dolayısıyla, evli bir kadın kocası tarafından ilkesi, ölçüsüz ve suçsuz yere cezalandırılamaz. Bununla birlikte evlilik kurumu“çok özel”bir konuma sahip olduğundan, basit şekilde çözülebilecek meselelerin dışarıya aksettirilmeden karı-koca arasında çözüme kavuşturulması da İslam aile hukukunun en bariz farklardan birisidir. D-r-b fiili hem yalın halde hem de birlikte kullanıldığı harflere ve kelimelere göre farklı anlamlar kazanabilen bir fiildir. Kur'an'da 56 ayette d-r-b harflerinden türemiş kelime ya da fiili bulunmaktadır. Bu ayetlerden 10 tane ahkâm ayetinde toplamda 11 adet d-r-b kökenli kelime bulunmaktadır. Bu çalışmada d-r-b fiilinin kullanıldığı ayetler, sözlükler, ahkâm tefsirleri kapsamında değerlendirilmiştir. Ahkâma konu olan ayetlerde istiskâ, sadaka, eşler arası geçimsizlik durumunda Kur'an'ın çözüm önerileri, savaşta Müslüman olduğunu söyleyen kimsenin durumu, yanında Müslüman kimse bulunmadan yolculukta ölen kimsenin vasiyeti, namazların kısaltılması, tesettür emri, şeriatta hilenin yeri, savaş esirlerinin durumu ve gece namazı konuları incelenmiştir. Nisa Suresi 34.ayet kapsamında karı-koca arası geçimsizlik durumuna özel olarak yer verilmiş ve bu ayetteki mananın Hz. Peygamber'in detaylı şekilde izah ettiği şekliyle basit manada ıslah amaçlı vurulması olduğu sonucuna ulaşılmıştır."
