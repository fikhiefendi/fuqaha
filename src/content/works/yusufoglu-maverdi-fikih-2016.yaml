abstract: "“Mâverdî'nin Fıkıh Usûlü Anlayışı”isimli bu çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde çalışmanın konusu ve önemi ele alınmıştır. Birinci bölümde Mâverdî'nin hayatı, ilmi şahsiyeti, hocaları, talebeleri ve eserleri incelenmiştir. İkinci bölümde Mâverdî'nin fıkıh usûlünün temel konuları hakkındaki görüşleri tespit edilmiştir. Sonuç kısmında çalışmada varılan sonuç maddeler halinde zikredilmiştir."
