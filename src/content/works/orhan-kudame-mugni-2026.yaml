abstract: "Bu tez çalışmasında, İbn Kudâme'nin el-Muğnî adlı eserinde ceza hukuku alanında Şâfiî mezhebine yapılan atıfların doğruluğunun tespit edilmesi amaçlanmaktadır. Çalışmada, İbn Kudâme'nin aktarımları nitel araştırma yöntemlerinden karşılaştırmalı metin analizi yöntemiyle incelenmiş; isabetli, hatalı, eksik ve tespit edilemeyen nakiller belirlenerek tasnif edilmiştir. Yapılan inceleme sonucunda, nispetlerin büyük ölçüde Şâfiî mezhebinin güvenilir kaynaklarıyla uyumlu olduğu tespit edilmiştir. Hatalı nispetlerin, Şafiî kaynaklarında yer alan görüşlere aykırı biçimde aktarıldığı; eksik nakillerin ise mezhep içi ihtilafı tam olarak yansıtmayıp birden fazla kavilden yalnızca birinin zikredilmesi suretiyle gerçekleştiği belirlenmiştir. Çalışma; üç bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümü oluşturan giriş bölümünde araştırmanın konusu, problemi, amacı, önemi, yöntemi ve literatürü ele alınmıştır. İkinci bölümde İbn Kudâme'nin hayatı, ilmî kişiliği, hocaları, öğrencileri ve eserleri ile el-Muğnî'nin genel özellikleri incelenmiştir. Üçüncü bölümde ise el-Muğnî'de ceza hukuku bağlamında Şâfiî mezhebine nispet edilen görüşler, mezhebin temel kaynakları esas alınarak mukayeseli biçimde değerlendirilmiştir. Çalışmanın, mezhepler arası mukayeseli araştırmalara ve klasik fıkıh eserlerinin eleştirel değerlendirilmesine katkı sunması hedeflenmiştir."
