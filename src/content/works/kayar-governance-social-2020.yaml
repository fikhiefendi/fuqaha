abstract: "Bu tezin amacı, Osmanlı İmparatorluğu'nda on yedinci yüzyıldan itibaren bir ceza mekanizması olarak kullanılan nezrin kapsamlı bir haritasını oluşturmaktır. Nezrin erken uygulamaları göz önüne alındığında, bu geleneksel araç İslam öncesi Araplardan alınmış ve İslam kültürüne dahil edilmiştir. Nezir, İslam geleneğinde dini bir pratik olarak ele alındı ve çeşitli İslam hukuku kaynakları tarafından geliştirildi. Bu esas olarak folklorik bir uygulamaydı ve birçok kültürde görülebiliyordu. Ancak Osmanlı Devleti nezrin kademeli olarak değişimine tanık olmuş ve nezrin yenilenen formu fetvalarda ve Osmanlı mahkemelerinde ortaya çıkmıştı. Üstelik, Osmanlı Devleti bu kademeli değişimi kullanarak neziri özellikle kolektif bağlayıcılığı olan bir ceza mekanizmasına dönüştürdü. On yedinci yüzyıldan on dokuzuncu yüzyıla kadar merkezi hükümet neziri esas olarak taşra toplulukları için kullandı; ancak, bu uygulama aynı zamanda taşra güçlerinin ve topluluklarının elinde de bir güç haline geldi. Devletin ve taşranın çıkarları çerçevesinde, on sekizinci yüzyıl ve on dokuzuncu yüzyılın başları, merkezi hükümet, taşra toplulukları ve liderleri arasındaki değişen dengelerde nezrin rolünü açıklamada çok önemli bir role sahiptir. Bu sorgulama aynı zamanda imparatorluğun on yedinci yüzyıldan on dokuzuncu yüzyıla kadar değişen devlet ideolojisine de ışık tutmayı amaçlamaktadır."
