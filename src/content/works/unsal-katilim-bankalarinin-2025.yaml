abstract: "Katılım bankaları küresel sermayede İslami finansın tutunabilmesi için, İslami hassasiyeti olan tasarruf sahipleri ile yatırımcılar arasında bir köprü kurarak tasarrufların rotasını belirleyen bir kan dolaşımı sistemi olarak karşımıza çıkmaktadır. İslami finansın bilinirliği ve tercih edilme oranı son zamanlarda hızla yükselmektedir. Katılım bankalarından sermaye piyasalarına doğru uzanan bir köprü olarak tanımlayabileceğimiz Katılım Endeksi ise, yatırımcıya verdiği güven hissi sayesinde İslami finansın etkisini görünür kılmaktadır. Bu nedenle yatırımlarını İslami hassasiyetlere uygun şekilde yönlendirmek isteyen yatırımcılar için alternatif bir yatırım aracı olan katılım endekslerine ilgi son dönemde artmış ve endeksler arasındaki ilişki araştırmacılar tarafından inceleme alanı doğurmuştur. Bu çerçevede araştırmanın amacı, katılım endeksleri ile geleneksel endeksler arasındaki ilişkiyi BIST Pay Piyasası özelinde incelemek ve endeksler arasında belirgin bir ilişkinin olup olmadığı tespit etmek olmuştur. Bu çerçevede çalışmada 16.11.2021-25.07.2025 dönemlerine ait günlük veriler kullanılarak ekonometrik analiz yapılmıştır. Ekonometrik analiz kapsamında öncelikle serilerin birim kök testleri ADF ve PP birim kök testleri kullanılarak yapılmıştır. Her iki birim kök test sonucunda bütün değişkenlerin birinci fark değerinde birim kök içermediğini ve durağan olduğunu gösteren bulgular elde edilmiştir. Değişkenler arasındaki ilişkinin açıklanmasında Johansen Eşbütünleşme testi ve Granger Nedensellik Testi kullanılmıştır. Johansen eşbütünleşme testi sonuçları, değişkenler arasında eşbütünleşme ilişkisinin olduğu ve uzun vadede birlikte hareket ettiklerini göstermektedir. Granger Nedensellik Testi sonuçları da katılım endeksinde meydana gelebilecek fiyat değişimlerinin ve oynaklıkların diğer endeksleri etkileyebileceğini göstermiştir. Elde edilen bulgular, katılım endeksi ile BIST Pay endeksleri arasında güçlü bir ilişkiyi göstermekte olup İslami finansın sermaye piyasalarındaki etkinliğinin makroekonomik değişkenler ile desteklenmesinin önemli olduğunu göstermektedir."
