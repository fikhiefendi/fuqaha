abstract: "Bu çalışmanın amacı, felsefe tarihi boyunca filozofların konu edindiği din ve felsefe ilişkisinin ele alınışının tarihsel izleğini sunmanın yanı sıra, özel olarak İbn Rüşd ve Spinoza'nın bu ilişkiyi nasıl ele alıp incelediklerini irdelemektir. Bu amaçla, öncelikle, İslam ve Hıristiyan felsefe tarihinde din ve felsefe ilişkisinin ele alınışıyla ilgili genel bir çerçeve sunulacak olup, ardından iki filozof özelinde bu konunun nasıl irdelendiği üzerinde durulacak ve birbirleriyle ortak yönleri ve ayrıştıkları noktalar ortaya konmaya çalışılacaktır. Din ve felsefe arasındaki ilişki üç biçimde ortaya konabilir: 1)Dine önem verip felsefeyi reddetmek ki bu din adamlarının tavrıdır. 2) Felsefeyi esas alıp dini reddetmek ki bu dine karşı çıkan felsefecilerin tavrıdır. 3) Felsefe ile dini uzlaştırma çabası ki birçok felsefeci pek çok nedenle bu tavrı sergilemeye çalışır. İbn Rüşd ve Spinoza'nın tavrını, bu üçüncü tip tavır kapsamında değerlendirebiliriz. Zira her ikisi de felsefe ile dini uzlaştırmaya çalışmıştır, ancak her birini bu tavrı takınmaya yönelten nedenleri şöyle açıklayabiliriz: İbn Rüşd'ün yaşadığı dönemde din adamları, felsefe çalışmalarının, bilhassa Aristoteles felsefesinin caiz olmadığı yönünde fetva veriyorlardı ve bu nedenle İbn Rüşd, din ile felsefeyi uzlaştırmaya, aralarında zıtlık olmadığını, dinin felsefi düşünceyi gerektirdiğini, felsefenin herkese değil, özel bir kesime yönelik olduğunu, yalnızca aklî istidâdı bulunanların işi olduğunu açıklamaya çalışmıştır. İbn Rüşd bu yaklaşımla felsefe karşıtlarını ikna etmeye çalışarak felsefecilerin, felsefe çalışmalarında, bilhassa Aristoteles felsefesinden özgür olabilmelerini sağlamak istemiştir. Nitekim Aristoteles felsefesinin kâmil hakikat olduğuna inanıyordu. Spinoza ise Rönesans döneminde cumhuriyetçi bir yönetim altında yaşamasına rağmen, fanatik Yahudi ve Hıristiyanların baskısına maruz kalmıştır. Bu nedenle gerçek görüşlerinin felsefecileden ve araştırmacılardan başkası tarafından anlaşılmaması için Ortaçağ terimlerini kullanmaya yönelmiş, din ve felsefenin ortak hedefi mutluluğa ulaşmaktır, ancak felsefenin kullandığı yol, dinin kullandığı yoldan farklıdır, felsefenin yolu akıl ve hikmet iken dinin yolu takva ve itaattir demiştir. Anahtar Sözcükler Din, Felsefe, Tanrı, İslam felsefesi, İbn Rüşd, Spinoza, Hıristiyan felsefesi"
