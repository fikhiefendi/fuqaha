abstract: "Müslümanın günlük ibadet hayatının en önemli kısmını beş vakit namaz teşkil eder. Bu farz namazlar Kur'an-ı Kerim ile sabittir. Bunlara ek olarak pek çok rivayetle günümüze kadar gelen farz namazlarla irtibatlı ve onlara tâbî olarak eda edilen sünnet namazlar da vardır ki bunlara revatib sünnetler denir. Bu sünnet namazların mahiyeti, rekat sayısı, kılınış şekli ya da vakitleri hakkında mezhepler arasında bir takım ihtilaflar vardır. Bu ihtilafların sebebi kimi zaman rivayetlerdeki teâruzdan kimi zaman da mezheplerin fıkıh usullerindeki farklılıklardan kaynaklanmaktadır. Biz bu çalışmamızda genel olarak fıkıh ilminde sünnet ve nafile kavramlarının karşıladığı manaları açıklamaya, genel çerçevede nafile namazlarla ilgili konuları, özel çerçevede de revatib sünnetlerle alakalı hükümleri dört mezhebe göre işlemeye çalıştık. Bu araştırmada bize yardımcı olacak usul, hadis ve fıkıh kaynaklarından azami derecede istifade etmeye gayret gösterdik."
