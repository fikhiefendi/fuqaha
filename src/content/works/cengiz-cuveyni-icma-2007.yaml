abstract: "İslâm hukukçuları, hukukun ana kaynakları içerisinde üçüncü sıraya yerlestirilen icmâ delilini temellendirmeye çalısırlarken genellikle Sâfiî tarafından kullanıldıgı rivayet edilen Nisâ ,4,115. ayet'e dayanırlar. Ancak icmâ'nın sözü edilen ayetle temellendirilmesinin çok da saglıklı olmadıgı tezinden yola çıkarak bunun icmâ'nın ispatında kullanılamayacagını savunan isim Cüveynî olur. Cüveynî ?Kendisine dogru yol belli olduktan sonra, Rasul'e muhalefet edip mü'minlerin yolundan baska bir yola uyanı yöneldigi yolda bırakır ve onu cehennem'e atarız.?mealindeki Nisâ,115.ayeti in icmâ için delil olarak görmedigi gibi, ?Ümmetim dalâlet üzerinde birlesmez.? hadisini de vâhid haberler arasında yer alması gerekçesiyle yetersiz bulur. Ona göre icmâ iki sekilde sâbit olur: Birincisi, alimlerin, üzerinde ittifak edilen hükmü kat'î olan ve zanna dayanmayan naklî bir delile dayandırmaları seklinde sâbit olan icmâ'dır. ikincisi de alimlerin zanna dayalı bir hükümde icmâ etmeleri veya onu zanna dayandırdıkları- nı açıklamaları durumunda önceki nesillerin, icmâ'ya muhalefet etmenin apaçık bir sapıklık oldugu fikri üzerinde birlesmeleriyle kesinlik kazandıgı icmâ'dır."
