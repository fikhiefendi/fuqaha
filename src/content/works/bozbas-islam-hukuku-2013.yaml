abstract: "Bu çalışma İslâm hukukçularının önemle üzerinde durduğu, dâru?l-harbde faiz uygulamaları çerçevesinde var olan tartışmayı ortaya koymayı amaçlamıştır.Dâru?l-habdeki faiz uygulamalarının niteliği ve tartışmaya mahal olan yönlerinin anlaşılması için çalışmada öncelikle ?faiz? ve dâru?l-harb? kavramları incelenmiştir. Klasik ve modern kaynaklarda uzun değerlendirmelere konu olan faizin niteliği hakkında fikir vermek üzere kısaca bilgi verildikten sonra İslâm hukukunda yapılan dâru?l-İslâm, dâru?l-harb ve dâru?s-sulh şeklindeki ülke taksiminin mâhiyeti ve asıl konuyu ilgilendiren yönü ele alınmıştır. Son olarak çalışmanın konusunu teşkil eden dâru?l-harbdeki faiz uygulamaları hususunda klasik ve modern dönemde var olan görüşlere temas edilerek bu konudaki farklı yaklaşımlar değerlendirilmiştir."
