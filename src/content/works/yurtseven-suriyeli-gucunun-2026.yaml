abstract: "Türkiye'de iş gücü piyasasında yer alan Suriyeliler özellikle imalat sanayiinde vazgeçilmez bir işgücü haline gelmiştir. İşverenlerin, Suriyelilerin olası geri dönüş senaryosu nedeniyle bu işgücünü geçici olarak değerlendirmekte ve stratejik planlamalarına dahil etmemektedir. Bu durum, Suriyeli işçilere bağımlı hale gelen işletmeler açısından emek arzında daralma, maliyet yapısında değişim ve üretim sürekliliğinde aksaklıklar gibi önemli riskler oluşturmaktadır. Bu çalışma, Suriyeli işçilerin Türk imalat sanayiindeki rolünü ve potansiyel geri dönüş sürecinin işletmeler üzerindeki etkilerini fenomenolojik bir yaklaşımla incelemeyi amaçlamaktadır. Çalışmada Konya Organize Sanayiinde imalat sektöründe faaliyet gösteren 11 firma yetkilisi ile amaçlı örnekleme metoduyla derinlemesine görüşmeler gerçekleştirilmiş, elde edilen veriler fenomenolojik analiz, TF-IDF (Terim Frekansı-Ters Doküman Frekansı) analizi ve duygu analizi yöntemleriyle değerlendirilmiştir. Bulgular, Suriyeli işçilerin görüşme yapılan firmalarda toplam işgücünün %8-20'sini oluşturduğunu ve ağırlıklı olarak vasıfsız veya yarı vasıflı pozisyonlarda (paketleme, imalat, kaynak, montaj) istihdam edildiğini göstermektedir. Katılımcılar, Suriyeli çalışanları üretim sürekliliği açısından vazgeçilmez olarak tanımlamakta, özellikle gece vardiyası ve fiziksel güç gerektiren işlerde kritik bir boşluğu doldurduklarını belirtmektedir. Geri dönüşün önündeki en büyük engel olarak barınma sorunu öne çıkmakta olup, firmaların büyük çoğunluğunun Suriyeli işçileri uzun vadeli stratejik planlarına dahil etmediği ve olası bir geri dönüş sürecine yönelik somut hazırlıklarının bulunmadığı belirlenmiştir. Duygu analizi, genel olarak pozitif bir tonun baskın olduğunu ancak belirsizlik ve güven konularında kaygıların varlığını ortaya koymuştur. Suriyeli işçilerin Türk imalat sektöründe kritik bir konuma sahip olduğu ve sektörün bu işgücüne yapısal bir bağımlılık geliştirdiği ortaya konmuştur. Firmaların geri dönüş senaryosuna yönelik strateji eksikliği ve belirsizlik algısı hem politika belirleyiciler hem de sektör yöneticileri için acil eylem planlarının gerekliliğini göstermektedir. Bu çalışma, göçmen işgücüne yönelik işveren tutum ve davranışlarını ileri düzey doğal dil işleme teknikleriyle sistematik olarak analiz ederek, göç ekonomisi, işgücü psikolojisi ve örgütsel davranış literatürünün kesişim noktasında metodolojik ve kuramsal açıdan özgün bir katkı sunmaktadır. Bulgular, gelecekte yapılacak disiplinler arası araştırmalar ve kanıta dayalı politika geliştirme süreçleri için önemli bir referans teşkil etmektedir."
