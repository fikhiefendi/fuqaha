abstract: "Bu bilimsel çalışmanın amacı, İmam Bedreddin el-Aynî el-Hanefî'nin (ö. 855/1451) el- Mukaddimetü's-Sûdâniyye fi'l-Ahkâmi'd-Dîniyye adlı eserinin 53 numaralı varaktan kitabın sonuna kadar olan kısmını incelemek ve tahkik etmektir. Eser, müellif tarafından dostu Emir Sudun et-Tarantaî'ye (ö. 794/1392) hediye edilmiştir. Emir Sudun, kadıların hüküm verirken yararlanabilecekleri, Hanefî mezhebine göre kaleme alınmış muhtasar bir fıkıh kitabı talep etmiş; bu nedenle eser, döneminin ilmî ve idarî ihtiyaçlarını karşılayan kapsamlı bir Hanefî fıkıh özeti niteliği taşımaktadır. On bölümden oluşan kitap,“Kitâbü't-Tahâre”ile başlamış“Kitâbü'l- Hudûd”ile sona ermiştir. Araştırmacı, çalışmasını eserin tek nüshası üzerine inşa etmiş ve tahkikte iki temel yöntemi takip etmiştir. Birincisi, müellifin biyografisini, ilmî kişiliğini ve eserlerini ele alırken kullanılan tanımlayıcı- tarihsel yöntemdir. İkincisi ise klasik yazma eserlerin ilmî tahkikinde başvurulan metotları esas alan metin-tenkit yöntemidir. Çalışmada şu sonuçlara ulaşılmıştır: Aynî, dönemin önde gelen âlimleri arasında sağlam ilmî birikimi, telif, tedris ve fetva faaliyetlerindeki etkin rolü sayesinde hem İslam hukukunda hem de diğer şer'î ilimlerde belirleyici bir etkiye sahip olmuştur. el- Mukaddimetü's-Sûdâniyye, içerdiği bilgiler itibarıyla Ebû Hanîfe ve mezhep imamlarının görüşlerini derleyen bir fıkıh ansiklopedisi niteliği taşımaktadır. Müellif, fıkhî meseleleri kapsamlı ve titiz bir analizle ele almış; mezhepte tercih edilen sahih görüşleri belirtmiş, şaz veya terk edilmiş görüşlere yer vermekten kaçınmıştır. Fıkhî ihtilaflara genişçe yer vermemiş, meseleleri mümkün olduğunca özlü bir biçimde aktarmayı tercih etmiştir. Eserde hadis rivayetlerine yer verilmiş olmakla birlikte, rivayet eden râvîlerin isimleri çoğu zaman zikredilmemiş; rivayetlerin sahihlik veya zayıflık derecelerine dair değerlendirmelere nadiren temas edilmiştir. Müellif, eserini büyük ölçüde Hanefî mezhebinin temel kaynaklarına dayandırmış; diğer mezheplerle mukayeseye girmemiştir. Bu tavrın, eserin muhtasar bir fıkıh özeti olarak hazırlanmasının ve idarî-amelî ihtiyaçlara hizmet etmesinin doğal bir sonucu olduğu düşünülmektedir. Araştırma, Aynî'nin ilmî ufkunun genişliğini, kültürel birikiminin çeşitliliğini, özellikle fıkıh ve usûl alanlarındaki derin vukufiyetini, dil ve lehçelere yönelik özel ilgisini de ortaya koymuştur. Müellifin bazı zayıf veya asılsız hadisleri sıhhat durumlarına işaret etmeksizin aktarması ve birçok âlimin görüşünü açık bir isnat yapmaksızın nakletmesi, eserde dikkat çeken hususlar arasındadır."
