abstract: "Muhasebe bilgi sistemi her tür işletme için temelde girdi-süreç-çıktı şeklinde işlemekte olup, bu sistemin çıktıları olan finansal raporlar noktasında farklılıklar oluşmaktadır. Bankalar başta olmak üzere finansal kurumların farklı bir hesap planı kullanmaları, Türkiye Finansal Raporlama Standartlarına uzun yıllardır tabi olmaları, Sermaye Piyasası Kurulu ve Bankalar Birliği gibi kurumların düzenlemelerine uymak durumunda olmaları gibi sebeplerle muhasebe bilgi sistemleri de farklı kurgulanmıştır. Finansal kurumlar içerisinde de özellikle faizsiz finans kurumları diğerlerinden ayrışmaktadır. Ülkemizde faizsiz finans kurumları katılım bankaları olarak faaliyet göstermekte ve bu bankalar, faiz içeren işlemler yapmamakta; kredi ve mevduat sahipleri ile bir ortaklık ilişkisi kurmaktadır. Geleneksel finans kurumlarından temelde bu özellikleri ile farklılaşan faizsiz finans kurumlarının bağımsız denetimlerinin de özellikli olması gerekmektedir. Bu konu,“Faizsiz Finans Denetim Standartları”nın Kamu Gözetimi Muhasebe ve Denetim Standartları Kurumu tarafından yayımlanarak yürürlüğe girmesiyle düzenlenmiştir. Bu standartlardan yola çıkılan çalışmada halihazırda mevcut“Faizsiz Finans Denetim Standartları”ile yine Kamu Gözetimi Muhasebe ve Denetim Standartları Kurumu tarafından yayımlanan“Bağımsız Denetim Standartları”arasındaki ilişki incelenmiştir. Buradan hareketle öncelikle Faizsiz Finans Denetim standartları irdelenmiş; kapsadığı konular hangi bağımsız denetim standardı ile örtüşmekte ise o standartlarla eşleştirilmiş; sonrasında her bir ortak nokta ayrıntılı açıklanmıştır."
