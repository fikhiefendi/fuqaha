abstract: "Tasarruf finansman sistemi İslami finansman yöntemleri içerisinde önemli bir yere sahiptir. Sistemin İslam hukukuna göre değerlendirmesi yapılırken fıkhi temelleri yanı sıra paranın durumu, değeri, değer kaybı açısından da değerlendirilmesi önem arz etmektedir. İçinde yaşadığımız çağda parayı en fazla etkileyen olayların başında şüphesiz enflasyon gelmektedir. Çalışmada tasarruf finansman sistemlerinin enflasyon açısından değerlendirilmesi amaçlanmıştır. Bu amaçla girişten sonra başlayan ikinci bölümde sistem İslam hukuku açısından ele alınmıştır. Bunun için öncelikle sistemin yapısı ve işleyişi üzerinde durulmuş, mevcut yöntemler İslam hukuku açısından değerlendirilmiştir. Bölümün sonunda öne sürülen fıkhi dayanaklar ve yorumlar ele alınmıştır. Üçüncü bölümde enflasyon konusu üzerinde durulmuş, zararları ve çözüm yolları belirlenmeye çalışılmıştır. Enflasyon farkı alınması konusunda mezhep görüşlerine ve güncel görüşlere bu bölümde yer verilmiştir. Dördüncü bölümde tasarruf finansman sistemi enflasyon açısından değerlendirilmiştir. Enflasyonun etkileri, enflasyondan korunmak için alınan veya önerilen yöntemler İslam hukuk ilkelerine göre değerlendirilmiştir."
