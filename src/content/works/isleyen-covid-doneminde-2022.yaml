abstract: "İspanyol Gribi'nden sonra dünyanın karşılaştığı en büyük salgın olan COVID-19 salgını tüm dünyada önemli değişimlere yol açmıştır. Toplumsal, çevresel, ekonomik ve psikolojik etkileri olan bu süreç dünya ekonomilerini de derinden sarsmış ve ekonomik faaliyetten para politikalarına her alanı etkilemiştir. Bu dönemde uygulanan politikalar bankalar üzerinde de büyük etki uyandırmıştır. Türkiye'de COVID-19 dönemine özel uygulanan para politikaları incelenmiş ve bu politikaların bankacılık kârlılığına etkileri Panel Veri Analizi ile STATA programında analiz edilmiştir. Katılım bankalarının bu politikalardan nasıl etkilendiği de ayrıca incelenmiştir. Banka değişkenleri, makroekonomikdeğişkenlerle birlikte dönem değişkenlerinin de eklendiği analizde bankacılık kârlılığını en çok etkileyen değişkenlerin net faiz marjı, GSYH büyümesi, Aktif Rasyosu, COVID-19 dönemi ve dolar kurunun olduğu gözlenmiştir. Net faiz marjı, GSYH büyümesi ve Aktif Rasyosu bankacılık kârlılığını pozitif etkilerken, COVID-19 dönemi ve dolar kuru bankacılık kârlılığını negatif etkileyen faktörlerden olmuştur. COVID-19 dönemine özel olan Aktif Rasyosu uygulamasının katılım bankalarını, bankacılık sektöründen ayrıştırıp ayrıştırmadığı incelenmiş ve katılım bankalarının bu dönemde bankacılık sektörüne paralel bir gelişim kaydettiği görülmüştür."
