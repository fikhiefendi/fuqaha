abstract: "Alternatif finans olarak Müslüman olmayan ülkelerde de gelişme potansiyeline sahip olan Katılım Finans sistemi sadece bankacılık sektörünü değil bununla birlikte diğer sektörleri de beraberinde geliştirmektedir. Sermaye piyasaları, finans piyasaları, mal piyasaları gibi diğer piyasalarda da domino etkisi yaratarak ekonomide büyük bir etki oluşturmaktadır. Dolayısıyla bu sektörün gelişimi için ciddi bir mevzuat altyapısına ihtiyaç vardır. Bu çalışmada, Katılım Finans ürünlerinin çeşitleri hakkında bilgi verilmesinden ziyade özellikle sukuk (kira sertifikası) ele alınarak sukuk ve çeşitleri ile özellikle de Türkiye'de uygulanmakta olan sukuk çeşitleri anlatılmaktadır. Tezin asıl amacı ise Türkiye'de islami finans ürünü olan sukuk'un vergilendirilmesi, Türk Vergi mevzuatındaki yeri ve vergi kanunlarındaki ilgili maddeleri üzerinde çalışmaktır. Ayrıca mukayese için örnek olarak seçilen İngiltere, Malezya ve Lüksemburg'da Katılım Finansı'nın gelişimi ve ülke mevzuatlarına göre sukuk'un vergilendirilmesi ele alınmıştır. Son olarak, tavsiyeler ve sonuç bölümüne yer verilmektedir."
