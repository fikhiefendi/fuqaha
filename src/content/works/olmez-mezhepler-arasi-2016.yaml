abstract: "Fıkıh mezheplerinin bakış açılarına göre telfîk konusunu tahlil etmeye çalıştığımız bu çalışma giriş ve iki bölümden oluşmaktadır.Giriş kısmında çalışmanın amaç, önem, yöntem ve sınırları ortaya konulmaya çalışılmıştır.Birinci bölümde islam hukukçuların perspektiflerinden hareketle taklîd konusunu gerek bilgi değeri gerekse şerî hükmü bakımından analiz ederek onların bu konudaki görüşlerini sunmaya çalışıldı. Ayrıca âmmî ve müctehid, taklîd ile ittibâ kavramları tahlil edilerek aralarındaki nüans ve fark irdelenmiştir.İkinci bölümde ise telfik konusunu ve telfikin şeri hükmünü ortaya koymak amacıyla mezhep âlimlerinin bu konu ile ilgili yorumları ve kavram olarak telfikle ilişkisine binaen ictihad, intikâl beyne'l-mezâhib, ittibau'r –ruhas, fasl ve tafsil veihdâsü'l-kavli's-sâlis kavramları detaylı bir şekilde ele alınmıştır."
