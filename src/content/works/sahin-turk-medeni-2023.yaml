abstract: "Bu çalışma, Ankara Sosyal Bilimler Üniversitesi Sosyal Bilimler Enstitüsü Özel Hukuk (Medeni Hukuk) Ana Bilim Dalı altında yüksek lisans tezi olarak hazırlanmıştır.Tezde, Türk medeni hukukunda velayet kurumu ile bu kurumun İslam hukukundaki ‎karşılığının incelenmesi ve birbirleriyle karşılaştırılması konusu akademik araştırmaya tabi tutulmuştur. Çalışmada temel olarak Türk medeni hukuku ve İslam hukukunda ‎“velayet”adı altında‎ ana baba ve çocuklar arasındaki ilişkilerin ne suretle düzenlendiği üzerinde durulmuştur. Bu kapsamda velayetin manası, hangi ilkelere dayandığı, tarafların karşılıklı hak ve yükümlülükleri ile bilhassa çocukların doğdukları andan itibaren korunma, şefkat, yardım ve ilgi görme gereksinimlerine karşı ne gibi tedbirler getirildiği incelemeye tabi tutulmuştur. Çalışmanın ilgili bölümlerinde Türk hukuk öğretisi, İslam hukuku kaynakları ve mahkeme içtihatları ele alınmış ve uygulamadan örnekler ile açıklanmaya çalışılmıştır. Çalışmanın birinci ve ikinci bölümünde, aile hukuku açısından önemli bir yere sahip olan çocukların hukuken korunup gözetilmesini amaçlayan velayet müessesesinin Türk medeni hukuku ve İslam hukuku sistemlerindeki yeri, mahiyeti ve içeriği, tartışmalı noktalarıyla müstakil olarak ele alındıktan sonra üçüncü bölümünde, aralarındaki benzerlikler ve farklılıklar, konuya ilişkin kanunlaştırmalar ve yargı kararları ışığında incelemeye tabi tutulmuştur. Genel olarak zayıfların korunması prensibinin bir sonucu olan velayete ilişkin olarak her iki hukuk sisteminin, çocukluk döneminin kendine has özellikleri ve ehemmiyetine binaen çocuklar bakımından özel hükümler içerdiği ve çocuğun yararını korumayı temel ilke olarak benimsediği gözlenmiştir. Bununla birlikte devlet müdahalesinin yoğunluğu, velayete sahip olanlar, onlara tanınan hak, yetki ve ödevlerin kapsamı ile velayetin sona ermesi gibi hususlarda iki hukuk sistemi arasında farklılıklar tespit edilmiştir. Tüm bu verilerden yola çıkarak bu çalışmanın, özellikle Türk medeni hukukunda velayet konusunda yapılacak akademik çalışmalar ‎için konuyla ilgili meselelerin İslam hukuku düşüncesindeki karşılığının tespitine dair ‎teorik zeminde yol gösterici bir çalışma olacağı ümidini taşıyorum."
