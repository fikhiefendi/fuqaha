abstract: "Zenzibar Cumhuriyeti bağlamında Şafii ve İbadi Mezheplerinde boşanmayla ilgili hükümlerin karşılaştırmalı incelemesini konu edinen bu çalışmada konu her iki mezhebin Zenzibar'daki tarihî arka planı, usûlî ilkeler ve fürû ile ilgili hükümler çerçevesinde ele alınmıştır. Tarihî ve usûlî ilkelerle ilgili bölümler, temel inceleme konusuna giriş niteliğindedir. Fürû ile ilgili bölümde boşanmayla ilgili beş mesele ele alınmış ve Zanzibar Cumhuriyeti Şer'î Mahkemelerindeki uygulamalardan bazı örnekler de dikkate alınarak incelenmiştir. Söz konusu beş örnek mesele şunlardır: hul' (kadının bedel karşılığında boşanması), tek seferde üç talâk, sayı niyet edilerek yapılan talâk, hayız veya lohusalık döneminde yapılan talâk ve Allah'ın iradesine bağlanan (Allah dilerse) şeklindeki talâk. Konular incelenirken Hanefî, Mâlikî ve Hanbelî mezheplerinin görüşlerine de işaret edilmiştir. Araştırmanın temel amacı, Şafii ve İbadi mezhepleri arasında ittifak ve görüş ayrılıklarını ortaya koymaktır. Çalışmada önce Zanzibar'ın İslamlaşma tarihi ve Şafii ve İbazi mezheplerinin Zenzibar'da yayılışı incelenmiş, ardından iki mezhep arasındaki usûle dair temel farklılıklar ve genel olarak fıkhî ihtilafların sebepleri yer yer diğer mezheplerin görüşlerine de değinilerek kısaca ele almıştır. Daha sonra Zanzibar'daki Şer'î Mahkemelere dair kısa bir bilgi verilmiş ve ardından beş ihtilaflı fıkhî mesele detaylı biçimde incelenmiştir. Bu amaçla fıkıh metinleri analiz edilmiş, çoğu zaman temel kaynaklara müracaat edilmiş ve görüş ayrılıklarının sebepleri açıklanmaya çalışılmıştır. Çalışmada her iki mezhep için beşer temel kaynak esas alınmış, gerek görüldüğünde başka kaynaklara da başvurulmuştur. Çalışmada ayrıca imkân ölçüsünde Zanzibar'daki yargı uygulamaları kararlarına yer verilmiştir. Araştırmada betimleyici, tümevarımsal, karşılaştırmalı hukuki içerik ve metin analizi yöntemlerini kullanmıştır. Mezheplerin fıkhî görüşleri ana kaynaklara müracaat edilerek derlenmiş ve karşılaştırılmıştır. Benzer şekilde bu görüşlerin Zanzibar Şer'î Mahkemelerinde uygulanışı gösteren bazı örnekler betimleyici-analitik yöntemle çalışmaya dahil edilmiştir. Araştırmanın temel amacı, Şafii ve İbazi mezhepleri arasında beş boşanma meselesindeki fıkhî benzerlik ve ihtilafları ortaya koymak, Zanzibar'da her iki mezhep mensupları arasında karşılıklı anlayışı katkıda bulunmak, bu çerçevede fıkhî ihtilafın meşru temellerine ışık tutmaktır. Çalışma, mukayeseli fıkhın mezhep içi ve mezhepler arası hoşgörü ve birlikte yaşama kültürünü güçlendirmedeki rolünü teyit etmektedir."
