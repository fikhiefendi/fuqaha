abstract: "Bireylerin tesis etmekle yükümlü oldukları devlet, bireylerin din ve dünya işlerini düzene koyma amacına matuftur. Bireylerin eylemlerinin sonucu olan devlet aynı zamanda bireylerin maslahatı için tesis edilmektedir. Devlet idaresi ise bireylerin din ve dünya işlerinin düzenini sağlarken bireylerin veli, vekili ve Şârî tarafından kendisine verilen yetki ile tasarruf etmektedir. Devlet tasarruflarında hukuka/şeriata bağlı kalmalıdır. Aksi halde tasarruflarının meşruiyeti sorgulanır hale geleceğinden bireyin devlete itaati de söz konusu olmaz. bundan anlaşılan bireyin devlete itaatinin sınırlı ve şartlı olduğudur. Diğer taraftan bireylerin onayı devlet idaresinin meşruiyetinde de etkilidir. Devletin bireyin yaşamında etkisi ve kararlarının birey açısından anlamı tasarrufun konusuna göre değişmektedir. Öncelikle devletin buyruğu hükmün mahiyetine tesir etmemekte çoğu zaman hükme harici bir destek özelliği taşımaktadır. Durum böyle olunca bireyin eylem ve uygulamalarının geçerliği devletten bağımsız olarak gerçekleşmektedir. Bu, devletin birey üzerinde etkili olmadığı anlamına gelmemektedir. Devlet başkanının veli olma yetkisine bağlı bireyin tasarrufları devlet başkanının velayetinden kaynaklı olarak devletin iznine bağlıdır. Diğer yandan kamu maslahatına muhtevi mubah hükme dair buyrukları bireyi bağlamaktadır. Dolayısıyla ne tamamen birbirine bağlı ne de tamamen birbirinden kopuk devlet ve birey şeklinde ayrı iki taraftan bahsedemeyiz. Şâfiî'lerin Siyaset düşüncelerini belirleyen iki husus bulunmaktadır: İlki Hz. Peygamber'in devlet başkanı olarak yaptığı iddia edilen tasarruflarını risalet çerçevesinde ele almaktadırlar. ikincisi devlet yönetimine dair Hz. Ömer'in iddia edilen uygulamalarını kendi usul ve belirledikleri sistem içerisinde yorumlamaktadırlar. Bu iki husus onların devlet yönetimi anlayışlarını diğer mezheplerden ayrıştırmakta, devletin yetkilerini daraltarak bireye nispeten daha geniş hareket alanı sunmaktadır. Anahtar Kelimeler Devlet, Birey, Hak, Yetki, Şâfiî Mezhebi"
