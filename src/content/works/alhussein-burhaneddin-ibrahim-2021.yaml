abstract: "Bu tez çalışmasında, Şeyh Burhâneddîn İbrahim el-Halebî el-Medârî'nin Tuhfetu'l-ehyâr 'alâ'd-Durri'l-muhtâr kitabının birinci kısmını teşkil eden ve başlangıçtan ezan başlığına kadar olan bölümün tahkik ve incelemesi yapılmıştır. Bu çalışma hicrî 12. asrın büyük alimlerinden biri olan Şeyh Allâme Burhâneddîn İbrahim el-Halebî el-Medârî'nin Tuhfetu'l-ehyâr 'alâ'd-Durri'l-muhtâr kitabının birinci bölümünün incelemesi ve ilmi tahkikinden ibarettir. Tuhfe, Hanefî fıkıh kitaplarından olan ed-Durru'l-muhtâr isimli eser üzerine yazılmış bir haşiyedir. Bu kısım 'temizlik [et-tahâra]' ve 'namaz vakitleri [mevâkîtu's-salât]' isimli bölümleri içermektedir. Bu çalışma için üç nüsha seçilmiştir. Birinci nüsha müellifin yaşadığı dönemde tashih edilmiştir. İkinci nüsha müellifin yaşadığı dönemde yazılmış; ancak tashih edilmemiştir ve bazı eksiklikler bulunmaktadır. Üçüncü nüsha daha hatalı ve daha fazla eksiklik içermektedir. Metin bu üç nüsha ile mukayese edilmiş ve aralarındaki farklılıklara işaret edilmiştir. Bu çalışma giriş ve iki bölümden oluşmaktadır. Birinci bölüm incelemedir ve Timurtâşî'nin biyografisi, Tenvîru'l-ebsâr isimli eserin metnini, şarih Alâuddîn el-Haskefî'nin biyografisi, ed-Durru'l-muhtâr isimli eseri, Osmanlı Devleti'nin büyük alimlerinden Burhâneddîn İbrahim el-Halebî'nin biyografisi ve haşiyeyi içermektedir. Bu bölümde haşiyenin üslubu, kaynakları ve tezde takip edilen aşamalar hakkında bilgi verilmiştir. İkinci bölüm tahkik edilmiş metindir. Müellifin mukaddimesi ile başlayıp, 'temizlik' ve 'namaz vakitleri' isimli başlıklar içermektedir. Metinde ihtiyaç duyulan kelimeler harekelenmiş, kaynaklar tespit/teyit edilmiş, ayet ve hadisler de tahric edilmiştir. Metnin sonunda konular, ayetler, hadisler, şiir beyitleri, mekanlar ve ilmi terimleri kapsayan genel bir fihrist bulunmaktadır. İlgili yerlere noktalama işaretleri eklenmiştir. Bu çalışmada eserin müellife nispetinin doğruluğu, nakil ve alıntıdaki inceliği, üslubunun güzelliği, nakil ve red hususunda alimlere olan edebi tespit edilmiştir. Yalnızca Allah'a dayanır, onun cömertliğinden fazilet ve ihsan umarız"
