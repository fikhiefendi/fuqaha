abstract: "Mülkiyet hakkı, temel hak ve ödevlerden biri olup, 1982 Anayasası ve Avrupa İnsan Hakları Sözleşmesi uyarınca korunmaktadır. Mülkiyet hakkı, ancak kamu yararı amacıyla ve kanunla kısıtlanabilir. Planlı ve kamu ihtiyaçlarına cevap verebilecek bir kentleşmenin sağlanabilmesi amacıyla hazırlanan imar planları ile mülkiyet hakkından doğan yetkilerin belirsiz süreliğine kısıtlanması söz konusu olabilmektedir. Kamulaştırma yapılmaksızın imar planlarında kamusal alanda kalan özel mülkiyete konu taşınmaz üzerinde meydana gelen kısıtlılık hali hukuki el atma olarak ifade edilmektedir. Kamulaştırmasız el atma, uzun yıllar sadece fiili el atma olarak kabul edilmişse de yargı kararlarıyla hukuki el atmanın da bir tür kamulaştırmasız el atma olduğuna karar verilmiştir. Hukuki el atma kavramının Türk Hukukunda kabul edilmesi nedeniyle kamulaştırma ve kamulaştırmasız el atma kavramlarına değindikten sonra hukuki el atmanın tanımı yapılmış, niteliği, koşulları ve geçirdiği süreç yargı kararları ışığında ele alınmış, taşınmaz malikinin hukuki el atmaya karşı başvurabileceği yollar ve açabileceği dava türleri incelenmiştir."
