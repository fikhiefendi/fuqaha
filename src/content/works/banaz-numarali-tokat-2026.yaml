abstract: "Bu çalışma, Osmanlı taşra teşkilatının idarî, malî, hukukî ve toplumsal işleyişine dair zengin veriler ihtiva eden Tokat 7 Numaralı Şer'iyye Sicilini merkez alarak, 18. yüzyıl sonları ile 19. yüzyıl başlarına ait kısmi bir tarihi kesiti analiz etmektedir. Şer'iyye sicilleri, Osmanlı toplumunun her kesiminden bireylerin gündelik yaşantılarına dair izler taşırken, aynı zamanda devletin taşradaki memurları ile halk arasındaki etkileşimin canlı arşivleri olarak değerlendirilmiştir. Bu çerçevede Tokat 7 Numaralı Şer'iyye Sicili, sadece yerel bir adli kayıt defteri olarak değil, dönemin şehir hayatına dair çeşitli veriler sunan önemli bir kaynak olarak değerlendirilmiştir. Çalışmada Tokat'ın toplumsal yapısı, üretim-tüketim ilişkileri, hukuki uygulamaları ve idari yapısı ele alınmıştır. Böylelikle bu tez, Osmanlı Tokat'ının sosyo-ekonomik yapısına dair belge temelli tespitler ortaya koymayı hedeflemiş, hem Osmanlı tarih yazımına hem de yerel tarih çalışmalarına katkı sunmayı amaçlamıştır. Sicilde yer alan tereke kayıtları, bireylerin mal varlıklarını, aile yapılarını, borç-alacak ilişkilerini, tüketim alışkanlıklarını ve miras hukukunun işleyişini gözler önüne sererken, narh ve salyane defterleri, dönemin ekonomik şartlarını, fiyat dengelerini ve vergi yükümlülüklerini ortaya koymaktadır. Ayrıca çeşitli fermanlar, ilâm ve beratlar, taşra yöneticilerinin atamaları, vakıf idaresi, güvenlik tedbirleri, halkın şikâyetleri ve merkezden taşraya iletilen siyasî-iradi müdahaleler hakkında mühim bilgiler sunmaktadır. Çalışmada her belge türü ayrı ayrı ele alınmış, içerik analizi ve tarihsel çerçevesi içinde değerlendirilmiştir. Tereke kayıtlarından hareketle Müslim ve gayrimüslim halkın profilleri karşılaştırılmış, mahkemenin işleyişine değinilmiş ve dönemin mahkeme memurları değerlendirilmiştir. Narh defterleri ise 1216 ve 1217 yıllarına ait fiyat hareketlilikleri üzerinden ekonomik dalgalanmaların izini sürmek üzere kullanılmıştır. v Menzil ve sefer belgeleriyle birlikte askeri-idari lojistik, mühimmat nakilleri tarihsel bir zemin üzerine yerleştirilmiştir."
