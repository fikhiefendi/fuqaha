abstract: "Bu çalışmanın amacı, faizsiz finans ve muhasebe alanında standartlar düzenleyen İslami Finans Kurumu Muhasebe ve Denetim Örgütü'nün (AAOIFI) yayınlamış olduğu sukuk standardının Türkiye'deki muhasebe sistematiğinin nasıl olması gerektiğine yöneliktir. Bu sebeple Faizsiz Finans ve Muhasebe Standartları (FFMS) Türkiye Finansal Raporlama Standartları (TFRS) ile karşılaştırılarak faizsiz finans ve muhasebe standartlarından sukukun muhasebe sistematiğinin Türkiye'de nasıl olması gerektiği konusunda literatür ve uygulamadan faydalanılarak muhasebe kayıtları geliştirilmiştir. İslami muhasebe ile geleneksel muhasebe, faaliyetsel ve niteliksel özellikleri itibariyle birbirleriyle farklılıklar göstermektedir. İslami muhasebenin gelişimi Türkiye'de yakın tarihe dayansada, İslami muhasebe dünyanın pek çok yerinde önemli ilerlemeler kaydetmiştir. İslami muhasebenin gelişmesiyle birlikte İslami muhasebe standartlarına ihtiyaçlar artmıştır. Bugüne kadar ülkemizde geleneksel bankalar ve islami bankalar aynı yasal ve kurumsal düzenlemelere tabi tutulmuştur. Bu sebeple AAOIFI'nin yayınladığı Faizsiz Finans ve Muhasebe Standartlarının Türkiye mevzuatına kazandırılmasıyla birlikte Sermaye Piyasası Kurulu (SPK) tarafından belirtilen 01 Ocak 2020 tarihi itibariyle katılım bankaları bu standartları ihtiyari olarak uygulamaya geçmiştir. Bu çalışmada sukuk (kira sertifikası) işlemlerinin, TFRS'ye yönelik kayıtları incelenerek faizsiz finans ve muhasebe standardına uygun kayıtların yapılması amaçlanmıştır. Çalışmanın ilk bölümünde, İslami muhasebenin beraberinde getirdiği katılım bankacılığının gelişimi ve islami finans alanında standartan üreten uluslararası kuruluşlar hakkında genel bilgiler verilmiştir. İkinci bölümde sukuk kavramının tanımı, özellikleri, avantajlı, dezavanatajlı yönleri, riskleri ve sukukun geleneksel bankalarda finansal araç olarak kullanılan tahvil ile karşılaştırılması yapılmıştır. Sukukun işleyişi modellemelerle gösterilerek örnekler çerçevesinde pekiştirilmeye çalışılmıştır. AAOIFI'nin sukuk ve sukuk modellerine yönelik çıkardığı, Türkçeye çevrilen her bir standardın kapsamı, TFRS ile ilişkilerinin incelemesi yapılmıştır. Üçüncü bölümde ise sahipliğe dayalı kira sertifikası (icara sukuk) modeli örnek alınarak katılım bankası ve varlık kiralama şirketi tarafından yapılması gereken muhasebe kayıtları TFRS 16 (Kiralamalar) uyarınca incelenerek FFMS 8 (İcare ve İcare Müntehiye Bittemlik)'e uygun öneri kayıtlar yapılmıştır.Ardından yatırımcılar tarafından FFMS 33 ve FFMS 34 kapsamında yapılması gereken muhasebe kayıtları öneri olarak sunulmuştur."
