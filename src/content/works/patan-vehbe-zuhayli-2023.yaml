abstract: "Hukuk ve hak kavramlarının insanlığın ortaya çıkışından itibaren var olduğu bir gerçektir. İlk insan ve ilk Peygamber olarak gönderilen Hz. Âdem (a.s.) ile ona yoldaş olan eşi Havva'nın cennette yaşadıkları aile hayatında kendilerine yapmamaları söylenen bir yasağı işlemelerinden sonra söyledikleri“Ey Rabbimiz! Biz kendimize zulmettik. Eğer bizi bağışlamaz, bize acımazsan mutlaka ziyan edenlerden oluruz!”(el-A'râf, 7/23) ifadesi onların hak ve hukuka riâyet etmediklerinden dolayı cennetten çıkarıldıklarını ifade etmektedir. Bu çalışmada Vehbe Zuhaylî'nin“İslâm Fıkhı Ansiklopedisi”adlı eserinde aile hukuku ile ilgili İslâm fıkıh âlimlerinin aile hukuku ile ilgili görüşleri etraflıca incelendi. Vehbe Zuhaylî'nin yukarıda mezkûr eserinde aile hukuku ile ilgili tercihlerinin ne olduğuna ulaşılmaya çalışıldı. Bu çalışmanın sonraki yapılacak çalışmalarda İslâm aile hukuku alanında Vehbe Zuhaylî'nin görüşlerinin nelerden ibaret olduğunu topluca görebilme imkânı sunabileceği temel hedef olarak belirlendi. Bu çalışma toplam üç bölümden oluşmakta olup ilk bölümde Vehbe Zuhaylî'yi tanıtıcı bilgiler verilmiştir. İkinci bölümde nişan (hıtbe) konusuyla nikâh konusu, üçüncü bölümde ise talâk, fesh, vs. gibi konular ve neticeleri de birçok alt başlıklar halinde incelenmiştir."
