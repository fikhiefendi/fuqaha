abstract: "Şer'î hükme dair teorik çerçeve fıkıh usûlü tarafından belirlenmiştir. Usûl eserleri bağlamında şer'î hükme dair yapılan incelemelere bakıldığında bunların yoğun bir kelâmî arka plana dayandığı görülür. Zira şer'î hüküm bir yönüyle ilâhi bir kaynağa aitken bir diğer yönüyle de insan fiillerine ilişkin bir olgudur. Dolayısıyla kelâm ilmi kapsamında incelenen bu iki konuya dair tartışmaların şer'î hükme dair anlayışa etkisi kaçınılmazdır. Kelâm ilmindeki yaklaşımların şer'î hüküm konusundaki belirleyici rolü, bu yaklaşımlar noktasında ayrışan kelâmî ekollerin kendilerine özgü bir şer'î hüküm anlayışı geliştirmelerini de beraberinde getirmiştir. Bu çalışma İslâm kelâmının önde gelen ekollerinden biri olan Eş'arîliğe mensup usûlcülerin şer'î hüküm anlayışını, kelâmî tercihlerine bağlı şekillenen şer'î hüküm tanımı bağlamında belirginleştirmeyi hedeflemektedir. İlk bölümde, şer'î hüküm tanımına etki eden kelâmî meseleler belirlenmiş ve Eş'arî usûlcülerin bu konulardaki yaklaşımları netleştirilmeye çalışılmıştır. Buna göre Eş'arî usûlcülerin şer'î hüküm anlayışlarını belirleyen temel yaklaşımın, şer'î hükümlerin kaynağı niteliğindeki emir ve nehyin kelâm-ı nefsîye ircâ edilmesine bağlı, şer'î hükmü insan fiilinin bir parçası değil de ilâhi sıfata ilişkin bir olgu olarak benimsemeleridir. İkinci bölümde ise başta bu temel yaklaşım olmak üzere ilk bölümde ortaya konan çerçevenin şer'î hüküm tanımı üzerindeki etkisi incelenmiştir. Bu bağlamda şer'î hüküm tanımındaki unsurlardan her biri, Eş'arî usûlcülerin kelâmî yaklaşımları doğrultusunda incelenmiştir. Eş'arî usûlcülerin benimsediği kelâmî yaklaşımların hem şer'î hüküm tanımındaki unsurlara yüklenen anlamı belirlemede hem de bu anlam aracılığıyla birtakım tartışma alanlarının doğmasına zemin teşkil etme şeklinde iki yönlü bir etkisinin olduğu saptanmıştır."
