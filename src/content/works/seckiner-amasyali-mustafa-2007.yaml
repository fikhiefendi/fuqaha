abstract: "Hicri dördüncü ve beşinci asırlarda mezhep ihtilafları ve mezhepte taassubun artmasıyla birlikte, mezhep imamları ve bazı müntesipleri yoğun biçimde eleştiri ve karalamaya hedef olmuşlardır. Bununla birlikte mezhep imamlarını müdafaa eden eserler kaleme alınmıştır. Araştırmamıza konu olan eser, Menakıb türü olarak bilinen bu çalışmalardan biridir. Eser, Ebu Hanife ile ilgili söylenen; hadise muhalefet ettiği, kıyası nassın önüne aldığı gibi eleştirilere cevap mahiyetindedir. Eleştiri ve karalamada aşırı gidilmesinin ve bu eleştirilere cevap teşkil eden eserler kaleme alınmasının sosyal, siyasi sebeplerinin yanında psikolojik nedenleri de vardır. Dinin ortaya çıkışıyla birlikte dört asrın, insan faktörünün psikolojik yansımaları ile birlikte analizi yapıldığında ilk dönemde dini yapıyı kabullenip-kabullenmeme, sonraki dönemde muhalefet edip-etmeme, bir sonraki dönemde tutuculuk-taassup aşamaları ile şekillendiği söylenebilir"
