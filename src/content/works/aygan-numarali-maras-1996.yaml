abstract: "ÖZET 235 NUMARALI MARAŞ ŞER İYE SİCİLİ H.1319-1320 (M. 1901-1902-1903) İnsanlarla İlgili bütün hukukî olayları, kadıların verdikleri karar suretlerini, hüccetleri ve yargıyı ilgilendiren çeşitli yazılı kâğıtları ihtiva eden defterlere seriye sicili denir. Osmanlı Devleti'nde islâmi hukuk kuralları geçerli idi. Bundan dolayı yapmış olduğumuz çalışmanın giriş kısmında belgelerin anlaşılmasına kolaylık sağlamak amacıyla islâm hukuku ve Osmanlı adliye teşkilatının fonksiyonları hakkında bilgi verilmiştir. Daha sonra seriye sicillerinin genel özelliklerini ve tarihi önemini açıklamaya çalıştık. Maraş seriye sicillerine gelince, bu siciller Müh Kütüphane' de muhafaza edilmekte olup 7 adettir. En erken tarihlisi H. 1295-1296 tarihlidir. En geç tarihlisi ise H. 1326-1336 yıllarına aittir. Tez konumuz olan 235 Numaralı defter 28x34 cm ebatmda olup, H. 1319-1320 (M. 1901-1902-1903) yıllarına ait olup; miras, tereke kayıtları, alım-satım, aile hukuku, vakfiye, vasi ve vekil tayinlerini ihtiva etmektedir. Araştırmacılara kolaylık sağlamak amacıyla belgelerin özetleri çıkarılıp, daha sonra metin trankripsiyonu verilmiştir. Değerlendirme kısmında ise çalışmamız sırasında elde ettiğimiz sonuçlan ele alarak XX yüzyılın ilk yarısında Maraş 'ın idarî, iktisadî ve sosyal yapısı hakkında bilgiler verilmiştir. Buna göre XX. yüzyılın ilkyansında Maraş Halep Vilâyeti 'ne bağlı bir sancak merkezi idi. Halk; tarım, hayvancılık ve ticaretle uğraşmaktadır. Müslim ve gayr-ı müslim halk arasındaki ilişkilerin iyi olduğu görülmektedir. Defterdeki yazı çeşidi hakkında bilgi vermek amacıyla ekler bölümünde dört adet belge fotokopisi verilmiştir."
