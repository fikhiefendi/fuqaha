abstract: "Bu çalışmada Hanefî fıkhındaki tercih ve istidlâllerdeki etkisi ve rolü bakımından hadislerdeki ziyadeler, bir kavram olarak ziyâdetü's-sika'nın hükmü ve örnekleri çerçevesinde incelenmiştir. Hanefî mezhebinin görüşlerinin delillendirilmesi konusunda önemli bir yeri bulunan Tahâvî'nin (ö. 321/933) hadisle ilgili eserleri çalışmanın merkezinde yer almıştır. Çalışmanın amacı, rey ehli olarak anılan ve aklı ön plana çıkararak nakli ikinci plana atmakla ithâm edilen Hanefî mezhebinin hadis rivayetine verdiği önemi ortaya koymaktır. Bu bağlamda Hanefî haber teorisi ve tercih anlayışına dair genel kabul görmüş bazı prensiplerin ziyadeli rivâyetlerin kabulü ya da reddindeki yansımaları Tahâvî örnekliğinde ele alınıp incelenmiştir."
