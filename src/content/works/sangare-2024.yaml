abstract: "Bu çalışma, İslami sosyal finansı, ekonomik ve sosyal güçlenmeye yardımcı olan ve Mali'deki düzensiz göçün ele alınmasına katkıda bulunan bir finansman mekanizması olarak incelemeyi amaçlamaktadır. Araştırmacı, konu ile ilgili kitap ve yayınları kullanarak tanımlayıcı ve analitik bir yaklaşım izlemiştir. Çalışmada, finansman araçlarının çeşitliliği ve halkın ihtiyaçlarına uyum sağlaması nedeniyle İslami sosyal finansın Mali'deki Düzensiz göçle mücadelede uygun bir çözüm olduğu da dahil olmak üzere çeşitli sonuçlara ulaşılmıştır. Mali Mali toplumu çeşitli projelerin finansmanında bundan yararlanabilmesi ve bu projelere ilişkin verilerin elde edileceği sistemlerin kurulması için diğer İslami sosyal finansman araçları."
