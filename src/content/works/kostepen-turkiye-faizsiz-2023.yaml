abstract: "Günümüz dünyasında katılım bankaları ve katılım bankacılığı faizsiz finans ürünlerinin önemi yadsınamayacak bir boyuta gelmiştir. Hem Türkiye'de hem de dünyada katılım bankaları artmakta ve katılım bankalarına olan ilginin sadece Müslüman toplumlarda değil, Müslüman olmayan toplumlarda da tercih edildiği görülmektedir. Katılım bankaları, faizsiz finans anlayışına sahip işletmeler olmasından dolayı konvansiyonel bankalarda olduğu gibi faiz merkezli bankacılık sisteminden farklı bir yaklaşım sunmaktadır. Katılım bankacılığı, faizsiz finans ilkeleri ve temel yaklaşımı olan“paylaşımcılık”anlayışına dayanmaktadır. Önemi ve popülaritesi artan katılım bankaları tıpkı konvansiyonel bankalarda olduğu gibi finansal işlemlerinde dikkate aldığı Uluslararası Finansal Raporlama Standartları'dır. Bununla beraber günümüzde üzerine çalışmalar yapılan ve daha da geliştirilmeye çalışılan Faizsiz Finans Muhasebe Standartları karşımıza çıkmaktadır. Dünyada ortak muhasebe dili oluşmasını sağlayan Uluslararası Finansal Raporlama Standartları çerçevesinde hazırlanan Faizsiz Finans Muhasebe Standartları katılım bankalarının finansal faaliyetlerinde bir çerçeve görevi üstlenmektedir. Bu noktada çalışmada hem Türkiye'de hem dünyada sayıları gittikçe artan katılım bankaları ele alınıp Türkiye'de faaliyet gösteren katılım bankaları incelenmiş ve Faizsiz Finans Muhasebe Standartları ile ilişkisi açıklanmıştır."
