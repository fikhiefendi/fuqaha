abstract: "Bu çalışma, Ali el-Kârî ve Ali el-Geylânî'ye ait Tasrîfu'l-İzzî şerhlerini karşılaştırmalı olarak incelemektedir. Her iki eser de sarf ilminin temel konularını ele almakla birlikte, anlatım tarzı ve yöntem bakımından farklılık göstermektedir. Ali el-Kârî daha teorik ve anlam merkezli bir yaklaşım sergilerken, Ali el-Geylânî açıklayıcı ve sistematik bir yöntem benimsemiştir. Yapılan analizler, her iki şerhin de sarf ilmine önemli katkılar sunduğunu ve farklı okur profillerine hitap ettiğini ortaya koymuştur."
