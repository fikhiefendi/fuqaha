abstract: "Bu çalışma, Ortaçağ Moğol toplumlarında evlilik kurumunun iki temel unsuru olan çeyiz ve mehir uygulamalarını hem bozkır örf hukukunun geleneksel yapısı hem de İslâm hukuku çerçevesindeki dönüşümüyle birlikte incelemektedir. Araştırmanın temel amacı, Moğol evlilik ekonomisinde yer alan maddi yükümlülüklerin tarihsel kökenlerini, toplumsal işlevlerini ve siyasî anlamlarını ortaya koymak; bu unsurların İlhanlılar döneminde nasıl yeni bir senteze dönüştüğünü göstermektir. Çalışmada ilk olarak Moğolların evlilik yapısı, kadının aile ve toplum içindeki konumu, örf hukuku kapsamında şekillenen kalın (bridewealth) geleneği ve bu geleneğin evlilik ittifakları içindeki yeri ele alınmıştır. Kalının sadece ekonomik bir ödeme değil, aynı zamanda kabileler arası barışın, siyasal bağlılıkların ve güç ilişkilerinin bir göstergesi olduğu tespit edilmiştir. Temücin–Börte evliliği ve siyah samur kürk gibi örnekler, erken dönem Moğol dünyasında evlilikle birlikte gerçekleşen mal aktarımının sembolik ve politik boyutunu ortaya koymaktadır. İslâm'ın kabulüyle birlikte Moğol toplumunun evlilik pratiğine yeni bir unsur olarak mehir dâhil olmuş ve mehir, kadının şahsî mal varlığı üzerinde hak sahibi olmasını sağlayan vazgeçilmez bir hukukî güvence niteliği kazanmıştır. Bu süreçte örfî kalın ile şer'î mehir uygulamasının birbirini dışlamadığı, aksine İlhanlı Devleti başta olmak üzere İslâmlaşmış Moğol hanlıklarında birlikte yürütüldüğü görülmüştür. Hanedan evlilikleri üzerinden incelenen mehir miktarları, dönemin ekonomik yapısına, siyasî dengelerine ve saray kadınlarının statüsüne dair kapsamlı veriler sunmaktadır. Özellikle II. Bûlûgân Hatun'a verilen olağanüstü yüksek mehir, İlhanlı sarayında kadınların siyasî ve ekonomik etkisini güçlendiren önemli bir örnek olarak öne çıkmaktadır. Araştırmada hem klasik kronikler hem de modern tarihçilik çalışmaları değerlendirilmiş, evlilik ekonomisinin bozkır gelenekleriyle İslâm hukukunun birleştiği noktalar analiz edilmiştir. Bulgular, çeyiz ve mehirin Moğol toplumlarında yalnızca ekonomik birer evlilik unsuru olmadığını; diplomatik ilişkilerin, toplumsal hiyerarşinin, kadın statüsünün ve kültürel sürekliliğin şekillenmesinde belirleyici rol oynadığını göstermektedir. İlhanlı dönemi üzerinden görülen örf–şer'î sentez, Moğol–İslâm toplumlarının özgün evlilik modelini anlamada temel bir örnek sunmaktadır."
