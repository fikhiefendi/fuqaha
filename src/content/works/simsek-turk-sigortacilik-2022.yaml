abstract: "Özellikle son yıllarda önemli ölçüde gelişme gösteren ve bankacılık sektöründe gittikçe büyümekte olan bir yere sahip olan katılım bankacılığı, verdiği hizmetler açısından konvansiyonel bankacılıkla eşit düzeye yaklaşmıştır. Katılım sigortaları tarafından sunulan sigortacılık hizmetleri, İslami usullere uygun tekafül sisteminin ön plana çıkmasını sağlamıştır. Bu çalışmada Türkiye Finans ve Vakıf Katılım Bankaları'nın 2016-2021 yılları arası sundukları hizmetler TKBB raporları çerçevesinde karşılaştırılmış ve katılım sigortacılığının Türk bankalarında ülke ekonomisine sağladığı katkı ortaya konmuştur."
