abstract: "İslâm hukukunda hükümlerin konulmasındaki maksadın esasım hem dünya, hem âhirette kişilerin maslahatlarını temin teşkil eder. Bu maslahatlardan bir kısmı zorluğu kaldırmak ve sıkıntıyı gidermek için insanların muhtaç oldukları şeylerdir. İslam hukuku bu yararlan gerçekleştirmek için temel prensipler vaz' etmiştir. Bunlardan birisi de“kolaylık prensibidir. Yüce Allah, İslâm dîninin evrensel bir din olmasını istemiştir. Bu sebeble getirilen yükümlülüklerin insanların gücü nisbetinde ve kolayca yapılabilir olmasına dikkat edilmiştir. Hem başlangıçta yükümlülükler bu tarzda konulmuş, hem de sonradan ortaya çıkan bazı zarurî durumlar için ruhsatlar getirilmiştir. Böylece bir yandan mükelleflere çıkış yolu açılmış, diğer yandan da hukukun sürekliliği sağlanmıştır. Eğer hukukta bu yol uygulanmasaydı bu durum kişileri büyük sıkıntılara sokar ve dinden uzaklaşmalarına sebeb olurdu. İslam hukukunda kolaylık prensibinin dayanağı âyet ve hadislerdir. Kur'ân'da: ”Allah sizin için kolaylık ister, zorluk istemez“ (Bakara,2/185) buyrulmuştur. Hz. Peygamber de: ”Gerçekten bu din kolaylık dînidir.\" (Buhârî, fman,29) buyurmuştur. Bu ve benzeri âyet ve hadisler ışığında İslâm hukukçuları küllî kaideler düzenlemişlerdir. Zaruret, ikrah, yolculuk, hastalık, unutma, hata, bilgisizlik, noksanlık ve genel ihtiyaçlar kolaylık prensibim doğuran sebeblerdir. Bu özür durumlarının herbiri sebebiyle pek çok güçlükler kaldırılıp, ruhsatlar getirilmiştir. Sonuç olarak, kolaylık prensibi İslâm hukukunda önemli bir yere sahiptir. Ve hukukun hemen her sahasına nüfuz etmiştir. Bu bakımdan kolaylık prensibi İslâm hukukunun temel esasları ile uygulama arasında bir denge unsuru olmuştur."
