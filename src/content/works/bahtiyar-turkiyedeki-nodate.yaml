abstract: "Günümüzde otoyollar, havaalanları, köprüler, limanlar, metrolar, demiryolları, hastaneler, toplumsal amaçlı binalar, okullar, içme suyu hatları ve enerji santralleri vb. birçok yatırım altyapı yatırımları kapsamında değerlendirilmektedir. Bu sebeple, altyapı yatırımları devletlerin iktisadi ve sosyal gelişiminde kritik öneme haizdir. Büyük tutar ve uzun vade gerektiren altyapı yatırımlarının sınırlı finansman kaynaklarıyla karşılanması ise ülkeler açısından önemli bir sorun teşkil etmektedir. Bu doğrultuda, gelişmiş veya gelişmekte olan ülkelerde altyapı yatırımlarının finanse edilmesi amacıyla birçok finansman modeli geliştirilmiştir. Bu çalışmanın ilk bölümünde Dünya'da ve ülkemizde mevcut durumun ve sorunların tespit edilmesi amacıyla altyapı yatırımlarında kullanılan 30 farklı faizli ve/veya faizsiz finansman modeli detaylı olarak incelenmiştir. Çalışmanın ikinci bölümünde faizsiz finansman modelleri arasında odağımızda yer alan Sukuk'un Türkiye'de kamu altyapı projelerinin finansmanı amacıyla kullanılması üzerine mevcut durum ve yürürlükteki yasalar incelenmiştir. Bu veriler ışığında İslamî prensiplere uygun biçimde Sukuk'un ülkemizde uygulanması adına karşılaşılan sorunlar tespit edilmiştir. Çalışmamızda takip edilen mukayeseli analiz yöntemi ve akabinde gerçekleştirilen derinlemesine mülakatlar sonucunda ülkemizde ihracı mümkün olan sukuk finansman modelinin kamu tarafından nasıl hayata geçirilebileceği üzerinde durulmuştur. Bu noktada Türkiye Varlık Fonu (TVF) üzerinde odaklanılmış ve önerilen sukuk finansman modellerinin TVF tarafından kamu altyapı projelerinin finansmanı amacıyla kullanılmasının mümkün olduğu kanaatine ulaşılmıştır."
