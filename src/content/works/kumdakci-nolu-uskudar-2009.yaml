abstract: "Tezimiz, Üsküdar Şer?iyye Mahkemelerine ait H. 1153- 1154 tarihli 402 numaralı Şer?iyye Sicilidir. Bu, üzerinde çalıştığımız sicilin orjinali İstanbul Müfütülüğünde, mikrofilmi ise İSAM Kütüphanesinde bulunmaktadır.Çalışmamızın giriş kısmında Osmanlı Devletinin sosyal, iktisâdî, siyâsî, hukûkî tarihini en iyi şekilde yansıtan Şer?iyye sicilleri ve bunlar hakkında, bunları kaleme alan kadılar ve bunların görevleri, daha sonra üzerinde çalıştığımız 402 numaralı Şer?iyye Sicili'nin muhtevâsı ve şekil özellikleri hakkında bilgi, akabinde sicilimizde yer alan dava konularının listesi verildikten sonra çalışmamızın asıl konusunu teşkil eden 402 numaralı Şer?iyye Sicilinin transkripsiyon, özet ve hükümlerin tasnifi yapılmıştır.402 numaralı Şer?iyye Sicilinde her sicilde bulunan sosyal konuların yanında (mülk, eşya alım satımı, ipotek, evlilik, boşanma, vasîlik, vekil tayin etme, görevli tayini, tereke), Osmanlı'nın o dönemde ilişki içinde bulunduğu İran ve Rusya ile olan münâsebetlerine de değinmektedir. Ayrıca esnaf nizamıyla ilgili (sütçülük, ekmekçilik) pek çok hüküm de bulunmakta ve bize o döneme ait orijinal bilgiler vermektedir"
