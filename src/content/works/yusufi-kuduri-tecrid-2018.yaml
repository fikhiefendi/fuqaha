abstract: "Kudurî, IV. asırda yaşamış, Hanefî mezhebinin önde gelen simalarından birisidir. Kudûrî, sadece kendi mezhebini öğrenmekle yetinmemiş, aynı zamanda hadis uleması tarafından“sadûk”olarak nitelendirilecek düzeyde hadis ve en az bir şâfiî kadar Şâfiî mezhebini de delilleriyle birlikte öğrenmiştir. Kudûrî birçok te'lifatının yanı sıra, Hanefî ve Şâfiîlerin ihtilaf ettiği meseleleri delilleriyle birlikte ele almak suretiyle et-Tecrîd adlı eserini hazırlamıştır. Bu eserinde her iki mezhebin ilgili mesele için irad ettikleri görüşlerini ve ihticâclarını karşılaştırarak, cedel yöntemiyle farklı açılardan incelemiştir. Kitâbü's-Salât özelinde iki mezhebin nasslara dayalı ihtilâflarının, sübûta ve delâlete dair olmak üzere ikili bir taksimi yapılmıştır. Rivayetin sübûtuna dair ihtilâflar, rivayetlerin senedine ve kaynağına yönelik olarak ele alınmıştır. Delâlete dair ihtilâflar ise; lafızların vaz'ına, manaya mefhum ve delâletine, teviline, kapsamına ve gramatik açıdan farklı yorumlanmasına dair ihtilâflar olmak üzere beşli bir taksime sahiptir. Eserde bunların her birinde cedel metodu kullanılarak delillerin münakaşası yapılmakta ve Hanefî mezhebinin görüşleri savunulmaktadır."
