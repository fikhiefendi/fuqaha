abstract: "ÖZET Fıkıh kitaplarında halife olacak kişi için bir takım şartlar aranmıştır. Bu şartların bir kısmında görüş birliği sağlanmış, diğer bir kısmında ise görüş ayrılığı olmuştur. Halifede görüş birliği ile aranan şartlar doğuştan gelenler ve sonradan kazanılabilenler olmak üzere iki kısma ayrılmaktadır. Birinci kısım halifenin ergen, akıllı, duyu ve organlarının sağlam olması; ikinci kısım ise halifenin müslüman, hür, adil, ilmi-idari-askeri açılardan yeterli olması şartlarını kapsamaktadır. Bunlardan ilim ve adalet şartlan en çok işlenen şartlar olarak göze çarpmaktadır. Halifenin cinsiyeti, soyu, erdemliliği, günahsız olması ve görünürde olması görüş ayrılığına konu olan şartlardır. Kalsik bilginler, halife olmayı sadece erkeğin hakkı olarak görürlerken, son dönem araştırmacıları ise, kadının da halifeliğine cevaz vermektedirler. Şia'ya göre halifenin Haşimi soyundan olması, Ehl-i Sünnet'e göre, Kureyş kabilesinden olması gerekmektedir. Harici ve Mutezile'nin de benimsediği diğer bir görüşe göre ise, her hangi bir müslüman halife olabilmektedir. Şia ve ilk dönem Ehl-i Sünnet bilginlerine göre halifenin zamanının en erdemli kişisi olması gerekmektedir. Diğer bir görüşe göre ise en erdemli olmasa bile, yeterli olan herkes halife olabilmektedir. Şia'ya göre, halifenin günah ve hata işlemekten beri olması (masumiyet) gerekmektedir. Şia'nın dışındaki gruplara göre ise halifenin adil olması yeterli olmaktadır. Çünkü masum olma peygamberlere has bir özelliktir. Ehl-i Sünnet'e göre halifenin görünürde olması gerekmektedir. Şia'ya göre ise, gizli bir şekilde bile halifelik yapılabilmektedir. Nitekim onikinci imam Mehdi el-Muntazar şu an gizli bir şekilde bu görevi sürdürmektedir."
