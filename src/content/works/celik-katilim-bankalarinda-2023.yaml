abstract: "Ülkelerin ekonomik göstergeleri üzerinde doğrudan etkiye sahip olabilecek birçok sektör bulunmaktadır. Bankacılık sektörü de bu sektörler arasında yer almaktadır. Dolayısıyla bankaların hedeflerine ulaşması, sürdürülebilir bir performans göstermeleri ve finansal performansları üzerinde etkili olabilecek faktörlerin belirlenmesi önem taşımaktadır. Bu kapsamda çalışmada Türkiye'de faaliyet gösteren katılım bankalarında iç kontrol sisteminin etkinliğinin incelenmesi, iç kontrol sistemi ile finansal performans arasındaki ilişkinin ve iç kontrol sisteminin finansal performans üzerinde etkisinin olup olmadığının ortaya konulması amaçlanmaktadır. Bu amaç doğrultusunda, katılım bankası çalışanlarına iç kontrol sisteminin etkinliğini ölçmeye yönelik bir anket uygulanmıştır. Ayrıca bankaların 2022 yılı ilk altı aylık dönemine ilişkin finansal tablolarından elde edilen bilgiler doğrultusunda aktif kârlılık ve öz sermaye kârlılık oranları hesaplanmıştır. Anketlerden ve rasyolardan elde edilen veriler, SPSS programı yardımı ile frekans, yüzde, ortalama ve tanımlayıcı istatistiklerin yanı sıra, faktör analizi, korelasyon analizi ve basit doğrusal regresyon analizi ile analiz edilmiştir. Araştırma sonucunda katılım bankalarında iç kontrol sisteminin ve ayrı ayrı her bir bileşenin uygulanma seviyelerinin orta düzeyde olduğu belirlenmiştir. Bununla birlikte, aktif kârlılık ile kontrol ortamı, risk değerlendirme, kontrol faaliyetleri, bilgi ve iletişim bileşenleri arasında düşük düzeyde ve pozitif yönlü; izleme bileşeni ve iç kontrol sistemi ile arasında ise orta düzeyde ve pozitif yönlü bir ilişki tespit edilmiştir. Ayrıca öz sermaye karlılığı ile iç kontrol sistemi ve tüm bileşenleri arasında orta düzeyde ve pozitif yönlü bir ilişki olduğu görülmüştür. Son olarak iç kontrol sistemi ve her bir bileşenin katılım bankalarının hem aktif karlılığı hem de öz sermaye karlılığı üzerinde pozitif etkiye sahip olduğu belirlenmiştir."
