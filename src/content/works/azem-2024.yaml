abstract: "Çalışmada, hizmet sektöründe faaliyet gösteren yabancı küçük ve orta ölçekli şirketlere odaklanılarak İslami finans ve bankaların Türk ekonomisinin geliştirilmesindeki rolü gözden geçirildi. Gerçek çalışma neticesinde, bu şirketlerin beklentileri ile sağlanan İslami finansal hizmetler arasında bir boşluk oluşturduğunu, işletme sahiplerinin bankaların belirli kurallar çerçevesinde finansman çözümlerinin mevcut olduğuna dair güvenceleri karşılığında finansal destek eksikliği hissettiklerini gösteriyor. Şirketler aynı zamanda bankaların düzenleyici sistemlere atfettiği bankacılık ve kredi hizmetlerindeki zorluklar gibi idari ve hizmet engelleriyle de karşı karşıya kalıyor, ayrıca çalışma, bankaların tanıdığı ve çözmeye çalıştığı müşteri hizmetlerindeki engeller ve prosedürlerdeki belirsizlik gibi idari zorlukların varlığını da ortaya koyuyor. Bazı şirketler şüphelerini dile getirirken, bankalar da bu kontrollere tam bağlılıklarını teyit ederken, şeriat kontrollerine ne ölçüde uyum sağlandığı konusunda da bazı sorular mevcut. Sonuç olarak çalışma, bu engellerin üstesinden gelmek ve gerekli bankacılık hizmetlerinin kolaylaştırılmasını sağlamak için iletişim kanallarının iyileştirilmesine ve şirketler ile bankalar arasındaki ortak anlayışın geliştirilmesine yönelik acil ihtiyacı doğrulamaktadır."
