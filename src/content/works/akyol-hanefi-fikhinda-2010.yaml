abstract: "Bu tez bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı ve önemi, araştırma esnasında takip edilen metot, araştırmanın sınırlandırılması, araştırmanın planı ve kaynaklar hakkında genel bilgiler verilmiştir.?Hanefî Usûlünde Kıyâsın Mahiyeti, Unsurları ve Hücciyyeti Hakkındaki Yaklaşımlar? isimli birinci bölüm, iki ana başlığa ayrılır. ?Hanefî Usûlünde Kıyâsın Mahiyeti ve Unsurları? isimli birinci ana başlıkta Hanefî usûl anlayışı bağlamında kıyâsın tanımı, rükünleri, şartları ve hükmü, konuları ele alınmıştır. ?Hanefî Usûlünde Kıyâsın Hücciyyeti Hakkındaki Yaklaşımlar? isimli ikinci ana başlıkta ilk önce kıyâsın hüccet olup- olmadığı konusundaki farklı görüşler Hanefî usûlü ağırlıklı olarak ele alınmış, bu esnada gerekli görülen yerlerde İbn Hazm'ın yaklaşımları kısaca açıklanmıştır.?Hanefî Usûlünde Kıyâsın Hukuki Dayanağı? isimli ikinci bölüm, ?Kıyâsın Hukuki Dayanağı Hakkında Delil Getirilen Âyetler?, ?Kıyâsın Hukuki Dayanağı Hakkında Delil Getirilen Hadisler? ve ?Kıyâsın Hukuki Dayanağı Hakkında Delil Getirilen Sahâbe Görüşleri? şeklinde üç ana başlığa ayrılır. Bu bölümde Hanefî usûlcülerin kıyâsın hüccet oluşunu ispat etmek için delil getirdikleri âyetler, hadisler, sahâbe görüşleri ve bunların kıyâsın meşruiyetine delil getirilişinin arkasındaki gerekçe ve mantık ele alınmıştır."
