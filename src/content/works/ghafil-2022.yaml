abstract: "Tez başlığı:“Evlilikte zorlama kuralı ve sonuçları, Irak hukuku ile karşılaştırmalı bir hukuk çalışması”dır. Bu konu zorla evlendirilen kişiye yapılan haksızlığın engellenmesi bakımından önemlidir. Evlilik akdinin zorlamayla değil, rızayla yapılması gerekir. Araştırmanın amacı, zorla evlendirmeye ilişkin hükümlerin açıklamak, İslam hukukunun ve Irak hukukunun insan neslinin korunmasına verdiği önemi ortaya koymaktır. Araştırmada tümevarım, tahlil ve karşılaştırma yöntemine başvurulmuştur. Tezin son bölümünde ulaşılan sonuçlara değinilmiştir. Buna göre yetişkin kız zorla değil, kendi tercihi ve rızasıyla evlendirilmelidir. Zorla evlendirilmiş olan kadının boşanmak için mahkemeye başvurma hakkı vardır. Dava açma hakkına sahip olan kişi zorla bundan vazgeçirilemez, o ancak kendi rızasıyla vazgeçebilir. Kişinin mecbur bırakılarak yapmak zorunda kaldığı seçimler hukuki olarak geçersizdir. Özellikle şeriat mahkemelerinde cari olan Irak medeni kanununun ve Irak hukukunun zorlamada bulunan kişilere yönelik caydırıcı cezaları vardır. Araştırmada zorla evlendirmeye ilişkin hükümler açıklanmıştır. Evlilik velayeti, bunu lehte veya aleyhte etkileyen durumlar, velilerin önceliği, velayetin illeti hakkında bilgi verilmiştir. Aynı şekilde kızın küçük veya büyük yaşta zorla evlendirilmesinin hükmü belirtilmiştir. Velinin tasvip etmemesi, nedenleri, bunun aile ve toplum üzerindeki etkileri açıklanmıştır. Araştırmada zorla yapılan evliliğin, evlilik sürecine ve evliliğin sonlandırılmasına; hal`, ric`at, îlâ, zıhar gibi konulara etkisinden bahsedilmiştir. Araştırma, Irak hukukunda yer alan kanun maddeleri zikredilerek karşılaştırmalı bir şekilde çalışılmıştır."
