abstract: "Ülkemizde 346 milyar TL aktif büyüklüğü, 268 milyar TL fon büyüklüğü ve 190 milyar TL kredi hacmiyle katılım bankacılığı önemli bir parasal büyüklüğe ulaşmıştır. İçinde bulunduğu finansal piyasalarda yaşanan düzenlemeler ve uygulamalar katılım bankacılığına olumlu veya olumsuz etkilerde bulunmaktadır. Beş bölümden oluşan söz konusu çalışmanın birinci bölümü giriş olarak yazılmıştır. İkinci bölümünde para politikası teorilerinden, üçüncü bölümünde para politikası araçlarından bahsedilmiştir. Dördüncü bölümde ise Katılım bankacılığı ve Merkez bankası para politikası araçları arasındaki etkileşim irdelenmiştir. Beşinci bölüm ise sonuç ve değerlendirmeler yer almaktadır."
