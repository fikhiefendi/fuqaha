abstract: "Osmanlı Devleti, kuruluşundan itibaren yeni baştan bir hukuk oluşturmak yerine İslam hukukunun genel kaideleri üzerinden kendine has bir usul oluşturarak 'Osmanlı hukuku' olarak tanınan bir hukuk düzeni kurmuştur. Osmanlı hukukunun kaynakları da İslam Hukuku ile benzerlik teşkil eder. Kur'an, sünnet ve icma, Osmanlı hukukunun asli kaynakları olarak hukuka doğrudan etki ederler. Hukukçuların içtihatları ise fer'i kaynak olarak asli kaynakların düzenleme yapmadığı alanlarda varlık gösterir. Bunların yanında yardımcı bazı kaynakları da vardır ki, hukukun işleyişine yardım edip teorik ve pratik bilgi sağlarlar. Bunlar fıkıh kitapları, kanunnameler, şer'iyye sicilleri ve fetvalardır. Fetva kurumu, bu kaynaklar içerisinde özel bir konuma sahiptir. Müftülerce verilen fetvalar davaya sunulduğunda, kadıları etkileyerek hükmü değiştirebilmekte, bazen de bir uyuşmazlığı dava haline gelmeden sonuca ulaştırabilmektedir. Şeyhülislam fetvasının etkileri ise daha geneldir ve ülkenin tamamını etkileyebilecek sonuçlara sahiptir. Taşrada herhangi iki kişi arasındaki uyuşmazlık hakkında kadıya ilmi bir pencere sunan fetva kurumu, başkentte ise devlet yetkililerine savaş, barış, siyaseten katl, Padişah hal'i gibi konularda etkili ve doğrudan sonuca yönelik hukuki (şer'i) görüş bildirmektedir. Fetva metninin, Padişah tarafından verilecek bir ferman ile kanun gücünü kazanması da mümkün olup bu konuda birçok örnek bulunmaktadır. Tezde Osmanlı hukukunun kaynakları arasında fetvanın konumu, hukuk sistemi içerisindeki önem ve etkisi araştırılarak örnekler üzerinden açıklanmaya çalışılacaktır. Tezde, fetvanın Osmanlı hukukunda bir kaynak olarak kabulünün görekliliği gösterilmek istenmektedir."
