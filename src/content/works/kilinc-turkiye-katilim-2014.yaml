abstract: "Katılım bankaları, faizsiz esasa dayalı olarak çalışan kuruluşlardır. Dolayısıyla faizsiz esasa uygun her türlü bankacılık faaliyetini yürütmektedirler. Konvansiyonel bankacılık sektörüyle karsılaştırıldığında oldukça kısa bir geçmişe sahip olan katılım bankaları, ekonomik, politik ve sosyal konjonktüre bağlı olarak son yıllarda hızlı bir büyüme sürecine girmiştir. Türkiye'de de 1985 yılında“Özel Finans Kurumları”olarak faaliyetlerine başlayan katılım bankaları, 2006 yılında 5411 sayılı Bankacılık Kanunu'nda yapılan değişiklikle“Katılım Bankası”adını almışlardır. Türk bankacılık sektörü içerisinde dört adet katılım bankası faaliyetlerine devam etmektedir. Katılım bankalarının, konvansiyonel bankalarla rekabet edebilmeleri ve sektörde söz sahibi olabilmeleri için müşteri tercih kriterlerinin belirlenmesi ve dolayısıyla müşteri memnuniyetinin en üst düzeyde sağlanması gerekmektedir. Bu noktadan hareketle yapılmış olan bu çalışmada; katılım bankalarının temelini oluşturan dini hususlar, çalışma esasları, sunulan hizmet/ürünler ile katılım bankalarının tarihsel ve finansal gelişme evreleri incelenmiştir. Son bölümde ise Türkiye'deki katılım bankalarının, müşteriler tarafından tercih edilme sebepleri bir anket uygulaması ile belirlenmeye çalışılmıştır. Anket uygulaması sonucunda toplanan veriler ile frekans tabloları oluşturulmuş ve söz konusu veriler, faktör analizine ve ortalama değerlere tabi tutularak çeşitli bulgular elde edilmiştir. Söz konusu bulgulara göre katılım bankalarının tercih edilmesinde etkili olan en önemli sebepler; dini hassasiyet, hizmet kalitesi ve müşterilerin personelle olan yakın ilişkileridir."
