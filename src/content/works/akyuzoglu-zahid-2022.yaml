abstract: "Osmanlı Devleti'nin son şeyhülislam vekili olan Muhammed Zâhid el-Kevserî, Türkiye, Suriye ve Mısır'da yaşamış, 20. Yüzyıl gibi oldukça çalkantılı bir dönemde farklı ülkelerden Müslümanlarla görüşmüş, bilgi alışverişsinde bulunmuştur. Kevserî, İslam âlemi için siyasi, sosyal, ekonomik ve de dini açıdan oldukça büyük değişimlerin yaşandığı bu dönemde pek çok eser kaleme almış, pek çok eserin yayınlanmasında da katkısı olmuş çok yönlü bir âlimdir. Yazdığı ya da yayınlanmasında katkısının olduğu eserler tefsir, hadis, tarih ve fıkıh gibi çok çeşitli alanları kapsamaktadır. Kevserî'nin fıkhî düşüncesi hem yaşadığı dönemin âlimlerinden biri olması, hem de dönemin tartışmalarında geleneği ve gelenekten gelen usûlü savunması hasebiyle araştırılması ve incelenmesi açısından oldukça önemlidir. Kevserî'nin fıkhî düşüncelerinin eserlerinde dağınık bir hâlde yer alması böyle bir çalışmayı önemli hale getirmektedir. Kevserî'nin eleştirilerine konu olan ve yaşadığı dönemin fıkhî gündemini de oluşturan mezhepsizlik iddialarının, taklid eleştirilerinin, maslahat ve ictihad kavramlarından hareketle tecdid çalışmalarının tarafların iddiaları ve Kevserî'nin fikirleri çerçevesinde araştırılması Kevserî'nin fıkhî düşüncesini anlamamıza yardımcı olacaktır. Kevserî'nin Hanefî mezhebine bağlılığı ekseninde çıkan taassup iddiaları de araştırılması gereken hususlardandır. Bu saiklerle yapmış olduğumuz bu çalışma, Kevserî'nin kitaplarında dağınık halde bulunan fıkhî düşüncesini bir araya getirmemize yardımcı olacağı gibi dönemin fıkhî meselelerinin ve fıkıh âlimlerinin gündeminin neler olduğunu göstermesi açısından da ayrıca yol gösterici olacaktır."
