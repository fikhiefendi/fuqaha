abstract: "İslam ve Roma hukukunda benzeşen genel hukuk prensipleri bir çok çalışmaya konu olmuştur. Benzerliklerden yola çıkan bir takım Oryantalist çalışmalarda, Roma hukukundaki genel hukuk kuralları İslam hukukundaki kaidelerin kaynağı olarak gösterilerek, İslam hukukunun Roma hukukundan iktibas edildiği teorisi desteklenmeye çalışılmıştır. Elinizdeki bu çalışmada İslam hukukundaki kaideler ile Klasik dönem Roma hukuk prensipleri olan regulae iuris ile karşılaştırılmış ve ortaya atılan iktibas teorileri bu açıdan değerlendirilmiştir. Nitekim iki hukuk sistemindeki genel hukuk prensipleri, uygulama, kapsam ve mantık açısından incelendiklerinde, aralarında mühim farklılıklar görülebilmektedir. Roma-Bizans hukukunun mahiyeti ve kaynakları üzerindeki tartışmalara da yer verilen çalışmada, Kuzey Arabistan'da yerel hukuk uygulamasına örnek teşkil eden Suriye Roma Kodu'ndaki veriler de dikkate alınmıştır. Tekil hüküm ve prensipler üzerinden yapılan bir mukayesenin eksik kalacağı dikkate alınarak, kaide ve regula kavramlarının kaynakları, tarihsel süreci, türleri ve temel iç dinamikleri mukayese edilmiştir."
