abstract: "Kitlesel fonlama, geleneksel finansal kaynaklara alternatif olarak kurumların ya da girişimcilerin, internet aracılığıyla çok sayıda kişinin desteklerinden yararlanılarak sosyal, kültürel ve kâr amaçlı girişimlere fon bulma çabalarıdır. Tez çalışmamızda kitlesel fonlamanın tanımı, mahiyeti, çeşitleri, İslam hukukunda karşılık geldiği yöntemler, konuya örnek kitlesel fonlama platformları ve fıkhî açıdan değerlendirilmesi yapılmıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında konunun hukuki mahiyetine, amacına, yöntemine ve kaynaklarına değinilmiştir. Birinci bölümde kitlesel fonlama teriminin kavramsal çerçevesi zikredilip, tarihine, çeşitlerine, mahiyetine değinilmiştir. Kitlesel fonlamanın çeşitlerine yer verilmiştir. Kitlesel fonlama sisteminin işleyişi ve avantaj ve dezavantajları ele alınmıştır. Çalışmanın ikinci bölümü, İslam hukuku perspektifinden kitlesel fonlama yöntemlerinin analizine tahsis edilmiştir. Bu bölümde kitlesel fonlamanın dört çeşidinin İslam borçlar hukukundaki hangi yönteme tekabül ettiğine yer verilmiştir. İslami kitlesel fonlama platformlarından birkaçı ele alınarak bir değerlendirmede bulunulmuştur. Çalışmamız ulaştığımız neticeleri ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır."
