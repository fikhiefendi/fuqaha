abstract: "Bankalar, halkın parasının kullanılması sürecinde aracı olan mali kuruluşlardır. İlk bankaların tapınaklar, bankacıların ise din adamları olduğu söylenmektedir. Ticari bankacılık Milattan önce (M.Ö.) 3500'e kadar uzanmaktadır. Katılım bankacılığı ise M.Ö. 2123-2081'e kadar uzanmaktadır. Finansal sistem içerisinde ticari bankacılık faiz esasına göre hareket ederken, katılım bankacılığı ise kar payı esasına göre hareket etmektedir. Bu çalışmada Türkiye'de faaliyet gösteren Katılım Bankaları ve Ticari Bankalar analiz edilmiştir. Bankaların kriz öncesi dönemi (2005-2008), kriz dönemi (2008-2011) ve kriz sonrası dönemi (2011-2015) verileri kullanılarak analiz gerçekleştirilmiştir. Çalışma kapsamına toplam 13 banka (3 Katılım Bankası, 10 Ticari Banka) alınmıştır. Bankaların mali performansları dönem dönem değerlendirilmiştir. Bu dönem içerisinde varlığı görülen Bank Asya faaliyetlerinin sonlandırılmasından dolayı değerlendirilme dışında bırakılmıştır. Analizde kullanılan mali veriler Bankacılık Düzenleme ve Denetleme Kurumu (BDDK), Türkiye Bankalar Birliği (TBB), Türkiye Katılım bankaları Birliği (TKBB) ve ilgili internet sitelerinden alınmıştır. Bankaların performansı çok kriterli karar verme yöntemlerinden TOPSİS yöntemiyle ölçülmüştür. Çalışma sonucunda Türkiye'nin diğer ülkelere bakılarak beklenenden daha iyi performans gösterdiği bunun nedeninin de 2001 krizinde yaşanan olumsuzluklardan sonra önlemlerini almış olmasıdır. Bankalara bakılacak olursa küresel kriz öncesinde ve küresel kriz sonrasında ticari bankaların mali performansları başarılı olurken, küresel kriz döneminde katılım bankalarının performanslarının iyi olduğu gözlemlenmiştir. Kriz öncesinde ya da kriz sonrasında ticari bankaları ilk sıralarda görünürken, kriz yılında (2008) katılım bankalarının daha iyi performans gösterdiği, mali değerleri bakımından daha karlı olduğu göze çarpmaktadır. TOPSİS"
