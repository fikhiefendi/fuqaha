abstract: "ÖZET Bu araştırmada, miladi XII. yy'da, Karahanlılaı döneminde, Maveraünnehr'de yaşamış büyük bir Hanefi hukukçusu olan Kadıhan'ın hayatı ve O'nun en önemli eseri olan Haniyye (Fetava-yı Kadıhan)'deki metodu incelenmiştir. Kadıhan, Hanefi hukukuyla ilgili eserlerinin yanında, İmam Muhammed'e ait Camiu's-Sağir, Camiu'l-Kebir, Ziyadat ile Hassaf in Edebu'l-Kadi'sini şerhetmiştir. Çalışmamız üç ana bölümden ojuşmaktadır: Birinci bölümde Kadıhan'a kadar İslam hukuku'nun geçirdiği devreler ana hatlanyla ele alınmıştır. İkinci bölümde Kadıhan'ın hayatı, yaşadığı dönem ve çevre ele alınmış, Kadıhan'ın hayatı, ölümü, hocaları, yetişmesi, öğrencileri, eserleri, ilmî kişiliği, Karahanlılar Devleti ve dönemlerindeki ilmî, kültürel gelişmeler hakkında bilgiler verilmiştir. Üçüncü bölümde Haniyye' nin metodu incelenmiş, Haniyye' nin konulan, kaynaklan, sistematiği, üslubu, konulan işleyiş tarzı ile Kadıhan'ın ve llaniyyc'ııin İslam hukukundaki yeri hakkında bilgi verilmiştir. mKUMurr/ufOi mmu\\"
