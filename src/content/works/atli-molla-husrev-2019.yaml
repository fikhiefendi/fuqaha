abstract: "Bu çalışmada, Molla Hüsrev'in 'Dürerü'l-Hükkâm' isimli eserinde bulunan, Hanefi mezhebi âlimlerine yöneltilmiş toplam 63 itiraz zikredilmiş ve Hanefi mezhebinin muteber kitaplarından, Molla Hüsrev'in yaptığı itirazda haklı olup olmadığı değerlendirilmiştir. Yaptığımız araştırma sonucunda Molla Hüsrev'in, Hanefi âlimleri arasında en çok Sadru'ş-Şeria ve Zeylaî'ye itiraz ettiğini tespit ettik. Molla Hüsrev'in itirazlarını değerlendiğimiz bu çalışmayı iki ana bölümde ele aldık; Birinci bölümü;“Molla Hüsrev ve Fıkıhçılığı”ve“Dürer Kitabı ve Etrafında oluşan literatür”şeklinde iki alt başlıkta inceledik.“Molla Hüsrev ve Fıkıhçılığı”başlığı altında Molla Hüsrev'in hayatı, eğitimi, eserleri, görevleri ve fıkıhçılığı hakkında kısaca bilgiler verdik.“Dürer Kitabı ve Etrafında oluşan literatür”başlığı altında ise, Dürer üzerine yazılmış olan şerh, haşiye ve ta'liklerden bahsettik. Tezimizin ikinci bölümü itirazların değerlendirmesinden oluşmaktadır. Bu bölümü ise kendi içinde dört kısma ayırdık; birinci kısım: ibadetler bölümündeki itirazların değerlendirilmesi, ikinci kısım; aile hukuku bölümündeki itirazların değerlendirilmesi, üçüncü kısım; Muamelat hukuku bölümündeki itirazların değerlendirilmesi, dördüncü kısım; Ceza hukuku bölümündeki itirazların değerlendirilmesi."
