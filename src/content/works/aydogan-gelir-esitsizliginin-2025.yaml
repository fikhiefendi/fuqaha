abstract: "Gelir eşitsizliği, yalnızca ekonomik göstergeler üzerinden tartışılan bir konu olmaktan çıkmış; toplumların sosyal, siyasal ve kurumsal yapısını doğrudan şekillendiren temel bir mesele haline gelmiştir. Küreselleşme, teknolojik ilerleme ve sanayileşme süreçleri birçok ülkede büyümeyi hızlandırmış olsa da bu büyümenin yarattığı refahın adil bir şekilde paylaşılmadığı görülmektedir. Gelir farklılıklarının derinleşmesi, toplumsal uyumdan demokratik istikrara, kurumsal meşruiyetten fırsat eşitliğine kadar geniş bir alanda etkiler yaratmaktadır. Bu nedenle eşitsizliği, yalnızca ekonomik performansın yan ürünü değil; kültürel değerler, dinî yönelimler ve kurumsal düzeneklerle iç içe geçmiş, çok katmanlı bir olgu olarak ele almak gerekmektedir. Eşitsizlik, bireylerin eğitim ve istihdam fırsatlarına erişimini sınırlayarak sosyal hareketliliği zayıflatabilir, kaynakların etkin tahsisini bozarak ekonomik verimliliği olumsuz etkileyebilir ve siyasal kutuplaşmayı derinleştirerek demokratik kurumları aşındırabilir. Literatürde, belirli bir seviyeye kadar eşitsizliğin yatırım, girişimcilik ve yenilikçilik için teşvik unsuru olabileceğini öne süren görüşler bulunsa da, yüksek ve kalıcı eşitsizlik düzeylerinin toplumsal maliyetleri çok daha ağırdır. Bu bağlamda gelir eşitsizliği, ekonomik süreçlerin ötesinde kültürel değerler, dinî yönelimler ve kurumsal düzeneklerle iç içe geçmiş, çok katmanlı bir olgu olarak ele alınmalıdır. Böylece, eşitsizliği yalnızca büyümenin yan ürünü değil; aynı zamanda büyümeyi, siyasal düzeni ve toplumsal ilişkileri biçimlendiren belirleyici bir unsur olarak kavramsallaştırmak mümkün hale gelmektedir. Bu çalışmada, gelir eşitsizliğinin belirleyicilerini üç temel değer kümesi üzerinden incelemektedir: (i) kültürel değerler (özerklik, post-materyalist yönelimler, toplumsal güven), (ii) dinî değerler (ölümden sonra hayat inancı ve devlet-din ilişkileri) ve (iii) kurumsal değerler (hukukun üstünlüğü ve demokrasi). Araştırmada bağımlı değişken olarak Gini katsayısı kullanılmış; 1995–2020 dönemine ait, 76 ülkeyi kapsayan veriler Dünya Değerler Araştırması (WVS), Religion and State (RAS), Varieties of Democracy (V-Dem) ve Economist Intelligence Unit (EIU) veri setlerinden derlenmiştir. Çoklu regresyon modelleri aracılığıyla hipotezler test edilmiştir. Bulgular, eşitsizliğin farklı değer alanlarıyla ilişkili olduğunu ortaya koymaktadır. Hukukun üstünlüğü istikrarlı biçimde eşitsizliği azaltıcı etki gösterirken, demokrasi endeksinin bazı modellerde eşitsizliği artırıcı yönde anlamlı katsayılara sahip olduğu bulunmuştur. Dinî değerlerde bireysel düzeyde Bireysel Dini Değerler eşitsizliği artırıcı etki yaratırken, RAS göstergesi eşitsizliği azaltıcı ve görece güçlü bir etkiyle öne çıkmaktadır. Kültürel değerlerde ise özerklik eğilimleri eşitsizliği azaltıcı, toplumsal güven ve post-materyalist yönelimler ise bağlama duyarlı ve kimi koşullarda artırıcı etkiler sergilemektedir. Sonuç olarak, gelir eşitsizliği ekonomik göstergelerle sınırlı bir olgu değildir; kültür, din ve kurumların kesişiminde şekillenen karmaşık bir yapıya sahiptir. Tezin bulguları, kapsayıcı kurumların güçlendirilmesinin, kültürel özerkliğin desteklenmesinin ve devlet–din ilişkisinin eşitlikçi bir çerçevede düzenlenmesinin gelir dağılımında daha adil sonuçlar üretebileceğini göstermektedir."
