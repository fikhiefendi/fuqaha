abstract: "Bu çalışmanın konusu Osmanlı hukukunda vekalet sözleşmesidir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde vekalet sözleşmesinin genel hükümleri incelenmiştir. Vekalet sözleşmesinin genel hükümlerinde vekalet sözleşmesinin kurulması, vekalet sözleşmesinin tarafları ve borçları, vekalet sözleşmesinin unsurları, vekalet sözleşmesinin benzer hukuki işlemlerle mukayesesi incelenmiştir. Bunun yanında, kadınların, kölelerin ve Osmanlı devletinde yaşayan gayri müslim teba olan zimmilerin özel durumlarına değinilmiştir. Ayrıca Roma, İslam ve Türk hukukunda vekalet sözleşmesinin bir mukayesesi yapılmıştır. Birinci bölümde son olarak vekalet sözleşmesinin sona erme halleri incelenmiştir. Çalışmanın ikinci bölümü, vekalet sözleşmesinin Osmanlı hukukundaki uygulanış şekilleri oluşturmaktadır. Osmanlılar, vekalet sözleşmesini özel uygulama şekillerine ayırarak ele almışlardır. Bu kapsamda çalışmada da bu ayırım esas alınmıştır. Bu bölümde ilk olarak, evlenmeye vekalet konusu işlenmiştir. Bey akdi demek olan satın alma işlemlerine vekalet konusu ve şira akdi denen satın alam işlemlerine vekalet durumları ele alınmıştır. Bu kapsamda konu örneklerle izah edilmeye çalışılmıştır. Ayrıca şirketler hukukunda uygulanan vekalet türleri ele alınmıştır. Son olarak vekalet sözleşmesinin günümüze uzandığı şekilde husumete vekalet ve bu konunun mahkemelerdeki görünümü olan dava vekilliği konusu işlenmiştir."
