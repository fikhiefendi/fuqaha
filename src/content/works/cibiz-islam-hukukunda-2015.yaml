abstract: "İnsanların yaşamlarını sürdürmeleri için gerekli olan gıda ve ilaç gibi maddeler doğal biçimde ancak %20 nispetinde üretilebilmekte iken aradaki gıda ve ilaç açığı, sanayi tipi üretim ile kapatılabilmektedir. Sanayi tipi gıda üretimi, GDO'lu (Genetiği Değiştirilmiş Organizmalar) ürünleri, sanayi tipi ilaçlar ise kimyasal ilaçları karşımıza çıkarmıştır. Netice itibariyle sekiz bin çeşit katkı maddesi ile karşı karşıya gelinmiştir. Baş döndürücü bir hızla çoğalmakta olan bu maddeler karşısında hangi maddenin helal, hangisinin haram olduğu, hangisinin ana maddesinin ne olduğu, bunların nasıl bir dönüşüm ve değişime uğradığı gibi mevzularını tespit işi hayli karışık bir hal almıştır. Bunun yanında bazı ülkelerde su kaynaklarının kıt olması, küresel ısınma gibi sebeplerle suyun daha verimli kullanılmasını ve arıtılmasını gerektirmektedir. Bu meseleyi çözebilmek için fıkıh kitaplarımızdaki“İstihâle”kavramını ve çerçevesini iyi anlamak ve yorumlamak lazımdır. Fıkıh kitaplarında zikredilen şarabın sirkeye dönüşmesi, merkebin veya köpeğin tuz gölüne düşerek tuz olması, pis yağdan sabun yapılması, gübrenin yanarak kül olması, misk geyiğinin kanının miske karışması, topraklaşma gibi misaller istihâle ile alakalı geçmişten günümüze tartışılan meselelerdendir. Günümüzde kullanılan gıda katkı maddeleri, GDO'lu ürünler, su arıtma, hayvan yemleri, alkolün gıda, ilaç ve kozmetikte kullanımı gibi meseleler, klasik fıkıh kitaplarımızdaki istihâle konusuna kıyas edilerek çözüm yolları aranmıştır."
