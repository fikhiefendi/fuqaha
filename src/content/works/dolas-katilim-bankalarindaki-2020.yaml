abstract: "Bu çalışmada katılım bankaları aracılığıyla ihraç edilen sukuk uygulamaları ile ilgili tasarruf sahiplerinin görüş ve düşünceleri incelenmiştir. Özellikle son yıllarda büyük bir ivme yakalayan katılım bankaları ve bu bankalar aracılığıyla ihraç edilen sukuk İslami finans sisteminin en önemli finansal araçlarından biri olmuştur. Faiz hassasiyeti ile hareket eden tasarruf sahipleri için daha da önemli olmaktadır. Sukuk, kamuoyu tarafından yeterli düzeyde avantajları ve dezavantajları bilinmediğinden dolayı uygulamaya konulduğu ilk yıllarda yeterli rağbet görmemesine rağmen son zamanlarda hem kamu bankaları hem de özel kesim bankaları tarafından teşvik edilmiştir. Mikro anlamda bireysel yatırımcıların ihtiyaçlarını karşılamakta, makro düzeyde ise atıl kaynakları ekonomiye kazandırarak finansal sisteme olumlu katkı yapmamaktadır. Bu çalışmada, Elinde fon fazlası bulunan yatırımcılar ile katılım bankalarının bir araya gelmesini engelleyen yahut geciktiren temel faktörlerin neler olduğunun belirlenmesi amaçlanmıştır. Bu doğrultuda 120 adet örneklemden toplanan anket verileri önce Microsoft Excel programına gerekli sayısal kodlamalar ile girilmiştir. Ardından İBM SPSS 23.0 versiyonuna veriler girilerek gerekli değişken tanımlamaları yapılmıştır. Sukuk uygulamalarına karşı katılımcıların tutumlarına ilişkin veriler doğrultusunda olumsuz, orta ve olumlu olmak üç aşamalı gruplandırılmıştır. Dini değerlendirmeler itibariyle katılımcıların sukuk'a karşı tutumları; çoğunlukla orta, düşük düzeyde olumlu olduğu görülmüştür."
