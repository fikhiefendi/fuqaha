abstract: "Şer'î hükümlerin bel kemiğini oluşturan emir ve nehiy, fıkıh usûlünun en önemli konularından biridir. Efali mükellefinin keyfiyetinde Şâri'nin emir ve nehiylerine göre sınırların çizilmesi, bu konunun iyice bilinmesi gereğini ortaya koymaktadır. Kelam ilminde ikinci Eş'arî olarak bilinen dolayısıyla otorite olarak kabul edilen Bâkıllânî'nin fıkıh ilminde de otorite olarak bilindiği bir gerçektir. Fıkıh usulü ile ilgili kısmi olarak elimize ulaşan ve İslam kültürünün zirve yaptığı hicri IV. asrın usûl ile ilgili atmosferini bize yansıtan“et-Takrîb ve'l-İrşâd”adlı eser ilk dönem mütekellim usulü esas alınarak telif edilmiş olması açısından önemlidir. Eserin“el-Kebîr”diye adlandırılan nüshası bize ulaşmamısına rağmen onun muhtasarı olarak da isimlendirebileceğimiz“el-Sağîr”dönemin ilmi yönden haritasını çizmesi açısından önemlidir. Üç cilt olarak basılan eserin ikinci cildinin tamamı (340 sayfadan fazlası) emir ve nehiy konusuna ayrılmıştır. Tezimizde Bâkıllânî'nin usulü ile ilgili genel kanaat ve onun emir ve nehiy hakkında görüşünü ortaya koyacak verileri verilerek betimlenmeye çalışılmıştır. Kitabın dilinin karmaşık olması, konuları teorik olarak işlemesi ve dönemin alt yapısının iyi bilinmemesi önümüze çıkan engeller olarak sıralanabilir. Yine de Bâkillânî'nin konuları işlerken tutarlı olması ve sonradan yazılan“et-Telhîs”ve“el-Mustasfâ”gibi eserler konunun anlaşılmasında bize yardımcı olmuştur. Tezimiz, İmam Şafiî'den sonra Mütekellim usûlünü sistemleştirip kendinden sonraki usûlcüleri etkileyen Bâkillân'i'nin“et-Takrîb vel-İrşâdü's-Sağîr”adlı eseri çerçevesinde emir ve nehiy kavramlarını işlemektedir. Bu çerçevede mütekellimin usulünde lafızların manaya dalaleti hususunda farklı bir tavır olan vakfîyye düşüncesinin usûlü ve bakış açısıyla emir ve nehiy kavramları ele alınıp tahlil edilmeye çalışılmıştır. Bu tez, genelde kavramlara yüklenen anlamlar ile ilgili farklı ekoller arasındaki farklılıkları ve tartışmaları Bâkillânî'nin bakış açısı ile tahlil edip sunmaktadır. Anahtar Sözcükler Bâkilllânî, emir, nehiy, fevr, terâhî, tahyîr"
