abstract: "Tâcuddîn es-Sübkî, h. 728/1328-771/1370 yılları arasında Memlüklerin Bahriye kolunun hâkim olduğu Mısır ve Şam bölgesinde yaşamış önemli bir ilim adamıdır. Memlükler, Eyyubilerin varlığına son vererek onların hâkimiyet alanına kurulmuş ve yaklaşık 250 yıl hüküm sürmüşlerdir. İbnü's-Sübkî'nin yaşadığı dönem aralığında devlet yönetimi on üç defa el değiştirmiştir. Bu durum siyasi istikrarsızlığa neden olsa da ilmi üretkenliğe ve gelişmelere engel olmamıştır. Nitekim bu dönemde eğitim kurumlarının sayısındaki artış ve devlet yetkililerinin ilim adamlarına verdiği değer devam etmiştir. Tâcuddîn es-Sübkî, ilmi donanıma sahip köklü bir ailede doğmuş, ilk eğitim ve öğrenimini dönemin kâdu'l-kudat'ı olan babası Takiyuddîn Ali'den almıştır. Mısır ve Şam bölgesinin önemli âlimlerinden istifade eden İbnü's-Sübkî, on sekiz yaşında icazet alarak ifta ve tedris hakkını elde etmiş, yirmi sekiz yaşına geldiğinde ise Şam'ın kâdu'l-kudatlığı görevini üstlenmiştir. Fıkıh, fıkıh usulü, hadis, tefsir, kelam, tarih, gramer, şiir ve edebiyat gibi farklı alanlarda eserler telif eden Tâcuddîn es-Sübkî, üslubu ve metoduyla sonraki dönem âlimlerini etkilemiştir. Özellikle onun fıkıh usulü ile ilgili yazdığı Cem'u'l-cevâmi' adlı eseri başta Ezher olmak üzere yüzyıllarca İslam coğrafyasının birçok medresesinde ders kitabı olarak okutulmuş üzerine şerh, ihtisar, haşiye ve ta'likler yazılmış, şiir haline dönüştürülmüş ve ezberletilmiştir. Tez çalışmamızda İbnü's-Sübkî'nin söz konusu eserinden hareketle onun fıkıh usulüne katkıları ele alınmıştır. Bu bağlamda onun cumhura muhalif, Hanefîlere ve Mutezileye muvafık, bağlı bulunduğu mezhebin imamları olan Eş'arî ve Şâfiîye muhalif görüşleri, fıkhi kavramlara yaklaşım tarzı ve Şâfiî usulüne kazandırdığı kavramlar tezde yer alan başlıca konulardandır."
