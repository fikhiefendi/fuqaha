abstract: "İçinde bulunduğumuz yüzyılda alternatif çözüm yolları ve onun türlerinden biri olan arabuluculuk, devletler tarafından teşvik edilen ve uyuşmazlık taraflarınca sıklıkla tercih edilen bir kurum olmuştur. Türk hukuk sistemi açısından hukuk tarihine nispetle oldukça yeni olarak uygulanan bu yöntemler, geldiğimiz noktada uyuşmazlıkların çözümü için önemli ölçüde tercih edilir olmuştur. Bununla birlikte bu yöntemler her ne kadar bugünkü toplumlar için oldukça yeni olsa da kadim toplumlar ve onların hukuk sistemlerinde kendine dâima yer bulmuştur. Bu bağlamda çalışmamızda Türk hukukunda uygulanmaya başlanan alternatif uyuşmazlık çözüm yollarından olan arabuluculuk incelenecek olup sonrasında Fıkıh ilmi açısından da değerlendirilmesi yapılacaktır. Bununla birlikte Türk hukukunun tarihi bir kesiti olan Osmanlı hukuku da uygulama açısından ele alınacak ve Diyarbekir şer'iyye sicilleri bu konu özelinde incelenerek İslâm hukukunun uygulayıcı konumunda olan Osmanlı hukukunda meselenin ne şekilde uygulandığı üzerinde durulacaktır. Her iki hukuk sistemindeki kurumlar ayrıntılı olarak değerlendirildikten sonra benzer ve/veya farklı yönleri ortaya konulacaktır."
