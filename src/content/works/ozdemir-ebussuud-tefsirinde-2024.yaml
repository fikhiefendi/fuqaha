abstract: "Kur'ân-ı Kerîm dini bir metin olmanın ötesinde belâgat açısından eşsiz ilahî bir kelâmdır. Bu ilahî kelâm, dil ve ifade zenginliği bakımından yalnızca inananları değil, aynı zamanda dilbilimcileri, edebiyatçıları ve düşünürleri de etkilemiştir. Nitekim Kur'ân'ın belâgat yönü, nesiller boyu farklı perspektiflerden pek çok telifin konusu olmuş, bu eserler Kur'ân'ın mûcizevî belâgatını anlama çabasını temsil etmiştir. Bu çerçevede, Ebüssuûd Efendi'nin (ö. 982/1574) İrşâdü'l-'akli's-selîm adlı tefsiri, belâgat konusunda öne çıkan eserlerden biridir. Söz konusu eser belâgat konusunda Zemahşerî (ö. 538/1144) ve Beyzâvî'den (ö. 685/1286) fazlaca istifade etmiştir. Klasik dönemde yazılmış her eserde olduğu gibi İrşâd'da da eserin özgün olup olmadığı meselesi bir soru olarak durmaktadır. Bu sorudan hareketle çalışmamızda, İrşâdü'l-'akli's-selîm'in meânî ilminin bir dalı olan kasr konusundaki yaklaşımı temel iki kaynağı olan Zemahşerî ve Beyzâvî'nin tefsirleriyle mukayese edilerek, mezkûr tefsirin özgün olup olmadığı incelenecektir. İslâm ilim geleneğinde özgünlük, kişiye has içsel keşif sürecinin bir çıktısı ve edinilen bilgilerin kişisel bir yorumla harmanlanarak benzersiz bir anlam kazanması olarak değerlendirilebilir. Bu bakış açısıyla ele alındığında, Ebüssuûd Efendi'nin kasra yaklaşımı ve bu bağlamdaki açıklamalarıyla, kendi tefsir üslûbunu oluşturarak diğer müfessirlerden ayrıştığı sonucuna ulaşılmıştır."
