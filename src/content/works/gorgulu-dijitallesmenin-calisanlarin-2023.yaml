abstract: "Covid-19 pandemisi diğer alanlarda olduğu gibi katilim bankacılığı alanında da yaşanan dijital gelişimi hızlandırmıştır. Bu çalışmada dijitalleşme sürecinin katılım bankalarında çalışanlar üzerinde olan etkileri araştırılmıştır. Pandemi tüm bankacılık işlemlerinin temassız ve uzaktan yapılabilmesine olanak veren teknolojik çalışmaları da beraberinde getirmiştir. Yapılan teknolojik çalışmalara uygun finansal ürünler hizmete sunulmuştur. Katılım bankaları da bankacılık sektöründe yaşanan dijitalleşme faaliyetlerine hızla uyum sağlamışlardır. İslami koşullara uygun dijital ürünler müşterilerin hizmetine sunularak, uzaktan ve temassız bir şekilde müşterilerinin bankacılık faaliyetlerini yapabilmelerine olanak sağlanmıştır. Bu durum katılım bankalarında çalışanların iş hayatını etkilemiştir. Çalışmada katılım bankalarında çalışanların yaşanan dijitalleşme ile birlikte çalışma hayatlarında yaşadıkları etkiler anket çalışması yapılarak incelenmiştir. Çalışanların demografik özelliklerine bakılarak çalıştıkları yerdeki iş tatmin düzeyleri ölçülmüştür. Çalışanların dijitalleşme ile iş tatmini arasındaki ilişki de regresyon analizi ile ölçülmüştür. Bulgularda dijitalleşmenin içsel ve dışsal doyumu ölçülmüştür. Ölçüm sonucuna göre dijitalleşme, katılım bankalarında çalışanların iş tatminini artırmaktadır. Ancak bu artırıcı etkinin zayıf olduğu görülmüştür."
