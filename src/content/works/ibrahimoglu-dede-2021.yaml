abstract: "Dört sünnî amelî mezhepten biri olan Mâlikî Mezhebi, Medine'de İmam Mâlik'in ders halkasında temelleri atıldıktan kısa süre sonra, henüz Mâlik hayatta iken Mısır ve Kuzey Afrika üzerinden Endülüs'e ulaşmış; burada resmî mezhep olarak kabul edilmiştir. Zamanla Endülüs'te dikkate değer bir Mâlikî birikimi oluşmaya başlamıştır. Hicrî 450'de Kurtuba'da doğan ve 520'de yine Kurtuba'da vefat eden Dede İbn Rüşd, Endülüs Mâlikî fakihlerinin en önde gelen isimlerindendir. Gerek tedris gerekse telif faaliyetleri ile mezhebe ciddi katkılar sağlamıştır. Bu çalışmada öncelikle girişte onun içerisine doğduğu ilmî ortam olan Endülüs Mâlikîliği ve tarihi seyri hakkında kısaca bilgi verilmiş; birinci bölümde hayatı, ilmî şahsiyeti, hoca ve talebeleri ile eserleri hakkında bilgi verilmiştir. İki ve üçüncü bölümlerde mezhebe katkıları farklı açılardan incelenmiştir. \"Mezhep birikiminin aktarılmasına Yönelik faaliyetleri\" adını taşıyan ikinci bölümde mevcut mezhep birikiminin tespit edilmesi, temellendirilmesi ve bu birikimin doğru bir şekilde bir sonraki nesle aktarılması noktasındaki çalışmalarına odaklanılmıştır. \"Mezhep içi istidlal faaliyetleri\"nin ele alındığı üçüncü bölümde ise, İbn Rüşd'ün, Mâlikî mezhebi müntesibi bir fakih olarak, mezhep birikimini dikkate alarak gerçekleştirdiği fıkhî faaliyetleri; tercîh, mezhep asıllarının tespiti, tahrîc, tevcîh başlıkları altında irdelenmektedir."
