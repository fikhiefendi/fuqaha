abstract: "Babürlü Devleti'nin dördüncü hükümdarı olan Padişah-ı Gazi Âlemgîr Ebu'l-Muzaffer Muhammed Muhyiddin Evrengzîb (1658/1707), 3 Kasım 1618'de, günümüzde Bombay'a (Mumbai) bağlı Panch Mahal bölgesindeki Dohad kasabasında doğmuştur. Şah Cihan ve ünlü eşi Mümtaz Mahal'in üçüncü oğlu olan Evrengzîb Babür Devleti'nin“altın çağı”olarak tanımlanabilecek bir dönemi yaşatmıştır. Ancak sonradan onun dönemine yönelik olumsuz ifadeler ve çeşitli eleştiriler ortaya çıkmıştır. Babürlü Devleti'nin çöküşüne neden olduğu iddiasıyla suçlanmasına kadar varan bu eleştiriler özellikle 20. yüzyılda, çoğunlukla Avrupa'da yayımlanan eserlerde yer bulmuştur. Bu çalışmada, Evrengzîb dönemi, yargı sistemi, yargı sisteminde temel kaynak olan el-Fetâva el-Âlemgîriyye ve doğrudan dönemin olaylarını aktaran klasik bir metin niteliğinde olan Hamîdüddin Han Bahadır Nimçe'nin yazdığı Ahkâm-ı Âlemgîrî eserlerinee dayanarak incelenecektir. Eser, Evrengzîb'in şehzadelik döneminden başlayarak yaklaşık yarım asır süren hükümdarlığı boyunca gerçekleşen önemli olayları içermektedir. Ayrıca, halkının büyük bir kısmı gayrimüslim olan ülkesini İslam hukuku çerçevesinde nasıl yönettiği ele alınacak, onun bir Müslüman hükümdar olarak icraatları analiz edilecektir. Bu bağlamda Evrengzîb'in yönetim biçimi ve Babürlü toplumunda bıraktığı izler değerlendirilmeye çalışılacaktır."
