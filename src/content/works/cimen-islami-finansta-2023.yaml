abstract: "Bu çalışma, İslami finans endüstrisinin büyümesinde kritik bir rol oynayan standardizasyonun öneminin ortaya konulması amacıyla oluşturulmuştur. İslami finansın büyüme potansiyelini artırmak için standardizasyonun gerekliliği ve bu alanda karşılaşılan eksiklikler vurgulanmıştır. Çalışma, İslami finans sektöründe standardizasyonun rolünü anlama ve düzenleyici çerçevenin nasıl geliştirilebileceğine katkıda bulunma amacı taşımaktadır. Ayrıca, İslami Finans Kuruluşları Muhasebe ve Denetleme Kurulu (AAOIFI), İslami Finansal Hizmetler Kurulu (IFSB), Uluslararası İslami Sermaye Piyasaları Kurulu (IIFM) ve Türkiye Katılım Bankaları Birliği (TKBB) Danışma Kurulu gibi standart yapıcı kuruluşların yapısını ve işleyişini incelemekte buna ek olarak yayımladıkları standartları karşılaştırmalı bir şekilde analiz etmektedir. Bu çalışma, İslami finansın daha fazla gelişmesi ve uluslararası alanda daha fazla kabul görmesi için standardizasyonun kritik bir araç olduğunu belirtmektedir."
