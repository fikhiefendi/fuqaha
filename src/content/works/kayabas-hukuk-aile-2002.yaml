abstract: "öz Çalışmanın konusu; Tanzimat'tan sonra başlayan kanunlaştırma hareketi sürecindeki son büyük halkayı oluşturan 25 Ekim 1917 tarihinde yürürlüğe giren Hukuk-ı Aile Kararnamesi' dir. I. Dünya Savaşı'nın olumsuz şartları altında, aile hukuku alanında düzenleme ihtiyacı nedeniyle hazırlanmıştır. İslam hukuku çerçevesinden ayrılınmamış ve değişik mezhepler için geçerli en modern İslami hükümler seçilerek bir araya getirilmiştir. Ayrıca Kararnamenin en önemli özelliklerinden biri; Osmanlı vatandaşı olan Hıristiyan ve Musevilerin de aile hukuku kurallarını düzenliyor olmasıdır ki bu hükümlerle dini liderlerinin aile ile ilgili yetkileri ellerinden alınmıştır. Ancak daha sonra dini liderlerin itirazları Kararnamenin kaldırılmasının en önemli nedenlerinden biri olmuştur. Çalışma dört bölümden oluşmaktadır. İlk bölümde Kararnamenin hazırlanma sürecinde etkili olan sosyal, ekonomik, siyasal ve kültürel nedenler ile Kararnamenin sistem ve kapsamı incelenmiştir. İkinci ve üçüncü bölümde, aile hukuku, evlilik ve boşanma ile ilgili düzenlemeler, dördüncü bölümde ise Kararnamenin yürürlükten kaldırılması ve sonrasında 1923 ve 1924 Hukuk-ı Aile Kararnamesi tasarıları incelenmiş ve çalışma Medeni kanunun kabul edilmesiyle noktalanmıştır. m"
