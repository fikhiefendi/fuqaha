abstract: "Osmanlı Devleti'nin son yıllarına kadar varlığını sürdüren şer'i mahkemelerde kadı veya naib tarafından tutulan defterlere şer'iyye sicili ya da kadı sicili adı verilmektedir. Bu defterlerde merkezi hükümetin emirlerini barındıran fermanlar, beratlar, mektûblar vb. bulunduğu gibi kadı tarafından verilen hüccet, ilam vb. belgeler de bulunmaktadır. Bu çalışmanın esasını oluşturan 1182 No'lu Edremit Şer'iyye Sicili ise 1529-1530 yılları arasına tarihlenmekte ve çeşitli meselelere dair hükümler içermektedir. Transkripsiyonu yapılan belgeler muhteviyatına göre idari, sosyal, iktisadi ve hukuki bakımdan ele alınmış ve bu başlıklar altında değerlendirilmiş ve anılan başlıklar doğrultusunda Edremit hakkında bazı genel yargılara varılmıştır."
