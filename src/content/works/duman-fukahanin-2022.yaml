abstract: "Kadın konusu, ilmî, dinî, felsefî pek çok alanda araştırmalara konu olmuş; sosyal, siyasal ve ekonomik anlamda kadının konumu, psikolojik, biyolojik ve fizyolojik yapısı ile ele alınarak belirlenmeye çalışılmıştır. Bu çalışmada özellikle milâdî 7-13. yüzyıllar ile 18-21. yüzyıllar arasında yaşamış fukahânın, yaşadığı dönem, kültür ve coğrafya içerisinde kendi kişisel zaafları, değerleri ve mizacının da etkisiyle oluşan kadın tasavvuru ortaya çıkartılmaya çalışılmış ve bu tasavvur neticesinde oluşan ictihadî hükümlere yer verilmiştir. Çalışma giriş ve sonuç kısımları hariç, dört bölümden oluşmaktadır. Birinci bölümde kadın tasavvurunun kilit noktası diyebileceğimiz kadının yaratılışı ile birlikte fıtrî, karakteristik, dinî ve hukuksal özellikleri ele alınmıştır. İkinci bölümde fukahânın kadına yüklediği özellikler ve fukahânın mizacı, değişim karşısındaki tutumu, mezhep taassubu gibi etkenlerin kadın tasavvuruna etkileri incelenmiştir. Üçüncü bölümde fukahânın zihninde oluşan kadın tasavvurunun ibadet hayatı ve özel hukuk hükümlerine etkisi incelenirken, dördüncü bölümde de kamu hukuku alanındaki ictihadî hükümlere etkisi, hükümlerin gerekçeleri üzerinde tartışmalar ve değerlendirmelere yer verilmiştir. Genel olarak sünnî mezheplerin görüşleri alınmış, gerekli görüldüğünde bahsedilen zaman aralığının dışına çıkılmıştır. Tümevarım ve tümdengelim yöntemi ile tahlil ve mukayese metodu kullanılmıştır. Çalışmada dönemler arası farklılıklara rağmen, bazı konular dışında fukahânın zihnindeki kadın tasavvurunda değişiklik olmadığı, kadının temel özellikleri açısından değişime kapalı, sosyal ve siyasal konumu açısından değişime açık bir bakış açısı sergilendiği görülmüştür. Anahtar kelimeler: İslâm Hukuku, Fukahâ, Kadın, Tasavvur, İctihad."
