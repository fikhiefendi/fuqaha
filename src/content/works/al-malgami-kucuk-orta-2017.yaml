abstract: "Çoğu Arap ülkesinin ekonomiklerinde uyguladığı politikalar ve eylemler, doğal kaynaklarında büyük hazine varlığına rağmen sorunlarını ortadan kaldırmamıştır ,aksin yoksulluk ve işsizlik , özellikle gençler dünyasında artmıştır, Gelişmiş ülkeler, işsizliği azaltmak ve ekonomiyi canlandırmak için küçük ve orta ölçekli işletmelerin desteklenmesine büyük önem vermektedir . karşılıklı bağımlılık ve ekonomik kalkınmayı sağlayabilecek kültürel mirasımızın ihmal edimsi ve canlandırmamasi not ediyoruz Küçük ve orta ölçekli işletmele desteklenmesi için vakıflar rolünü aktive ederek ve yatırım direktifleri vasıtasıyla faaliyete geçirmeleri için kalkınmayı karşılamayan ve işsizliği ortadan kaldırmayan tüketici projelerine yöneltmek yerine yatırım projelerinin tüm İhtiyaçlarını karşılamak gerekir.Küçük ve orta ölçekli işletmeler kurmak ve finanse etmek için bağış fonları yönlendirmek ekonomiyi büyütmeye yardımcı olur; çünkü bu sektör dünya ekonomisinin en önemli taşı ve ana motoru olarak düşünülür dolayısıyla, Vakıf kurumlarının rolünü nasıl olacak özellikle de Arap ülkelerindeki petrol fiyatlarındaki düşüşün ardından, finansman sorunları ile uğraşan küçük ve orta ölçekli işletmeleri vakıf kurumlarının verecekleri deseklere kalmışlar. Çalışma, İslam dışı İslam ekonomisinde birçok kaynak bulunduğunu göstermeyi amaçlıyor. ayrıca petrolün finansman yöntemleri ve toplumlarımızdan uzak yöntemleri yerine, ekonomik ve sosyal kalkınmayı sağlayan kültürel mirasımızı canlandırması şarttır"
