abstract: "Bu çalışmada, Hilâfet anlayışı ile çağdaş yönetim modellerinden Başkanlık, Yarı-Başkanlık ve Parlamenter sistemlerdeki devlet başkanları karşılaştırmalı olarak ele alınmıştır. Farklı yönetim modelleri arasındaki benzer ve farklı yönlerin tespit edilmesi amaçlanmıştır. Çalışma, Hz. Ebubekir'in (10-12/632-634) seçimi ile başlayan Hilâfet anlayışında zamanla farklı görüşlerin ve uygulamaların ortaya çıktığını göstermiştir. Hilâfet, Başkanlık, Yarı-başkanlık, Parlamenter gibi farklı yönetim sistemlerinin devlet düzenini sağlamak amacıyla ortaya çıktıkları ve ülkelerin kültürel ve sosyal yapılarına bağlı olarak geliştikleri tespit edilmiştir. Bazı belirgin farklar taşısalar bile, aynı amaca ulaşmayı hedeflemeleri nedeniyle, benzerlikler taşıdıkları görülmüştür. Her yönetim sisteminin, her yerde aynı sonucu veremiyeceğine dikkat çekilmiştir."
