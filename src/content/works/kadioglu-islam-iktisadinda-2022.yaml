abstract: "Sözleşmeye dayalı joint venture şirketi İngiliz ve Amerikan mahkemeleri kararlarında kâr amacı yanında tek iş unsuru ve ortaklarının müşterek taahhüt ve risk yükleniminde bulunması gibi ayırt edici unsur ve özellikleriyle öne çıkmaktadır. Mudarebe ise terim olarak bir tarafın sermaye koyduğu, diğer tarafın ise sermayenin işletilmesini üstlendiği kâr ortaklığı anlaşmalarını ifade etmektedir. Bir yandan ticaretle uğraşan ve yeterli mali gücü bulunmayan girişimci tüccarın finansman ihtiyacını karşılama, diğer yandan tasarruflarını bizzat işletme imkânından yoksun kişilerin paralarını değerlendirdikleri bir araç olma fonksiyonunu üstlenen mudarebe sözleşmeleri girişim sermayesi finansman yöntemine benzetilmiştir. Yatırımcılardan topladığı sermayeyi pay sahipleri hesabına yönetmekle sorumlu olan girişim sermayesi portföy yönetim şirketleri faaliyetlerini sermaye sahibi yatırımcılardan bağımsız şekilde yürütmekte, hem fonların kurulması hem de yönetiminden sorumlu olmakla mudarebe tanımındaki işleticiye benzemektedir. Çalışmamızda sözleşmeye dayalı joint venture şirketi temel unsurları ile İslam ticaret hukukunda yer alan şirketler ve özel olarak da mudarebe şirketiyle karşılaştırılmış, benzerlik ve farklılıkları ortaya konmaya çalışılmıştır. Literatürde katılım bankacılığının hukuki temelini oluşturduğu belirtilen mudarebe sözleşmelerinin unsurları esas alınarak katılım bankacılığında katılım fonu uygulamaları değerlendirilmiş, mudarebe sözleşmelerine benzetilen girişim sermayesi yatırım fonları bir model olarak ayrıca incelenmiştir. Çalışmamızda literatür araştırması ve karşılaştırma yöntemi uygulanmıştır. Mudarebe sözleşmelerinin girişim sermayesi yatırım fonları model alınarak hayata geçirilebileceği sonucuna varılmıştır."
