abstract: "Osmanlı tarihine ışık tutması açısından önemli bir yere sahip olan Şer'iyye Sicilleri sayesinde toplumun en küçük yapı taşına kadar inme imkânı mevcuttur. Kadılık makamının adli ve idari yapıda yer edinmiş olması ve Şer'iyye Sicillerinin kayıtlarını Kadıların tutmuş olması sebebiyle bu makama dair kayıtlar önem arz etmektedir. H.1170-1171(M. 1757) arasını kapsayan bu belgemizde de genelde Osmanlı'nın özelde ise Ankara'nın adli, idari yapı taşlarını araştırmaya çalıştık. 137 sayfadan oluşan bu çalışmamız üç kısım şeklinde incelenmiştir. Birinci kısımda Ankara'nın tarihi süreçteki yeri ve Şer'iyye Sicilleri üzerinde durulmuştur. İkinci kısımda ise Ankara'nın sosyal, ekonomik ve idari yapısının değerlendirilmesi yapılmıştır. Üçüncü kısımda 141 numaralı Ankara şer'iyye sicilinin transkripsiyonu yapılmıştır."
