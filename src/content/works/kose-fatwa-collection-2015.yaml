abstract: "Bu çalışma 1657 yılında Erzurum müftüsü olarak atanan Vani Mehmed Efendi'nin fetvalarını derlediği mecmuasını incelemektedir. Mecmua Osmanlı kenar müftülerine ait fetva mecmualarının tipik bir örneğidir ve yerel halkın kendi meseleleri ile ilgili Vani'den talep ettikleri hukuki rehberliğin sonucu olarak verilen fetvaları içermektedir. Bu tez, mecmuadan seçilen fetvaların incelenmesi neticesinde Kadızadeliler hareketi ile ilişkilendirilen önemli bir dini figürün zihni dünyasını anlamlandırmada önemli bilgiler sunmaktadır. Vani'nin henüz Erzurum'da iken“bidatlar”konusunda Kadızadelilerin çizgisine çok benzer bir çizgi izlediği, hatta bazı hususlarda hareketin önde gelenlerinden bile daha keskin fikirlere sahip olduğu gözlenmektedir. Bu çalışmada Vani'nin çeşitli konularda verdiği hükümler, bir yandan Erzurum'un dini, sosyal ve kültürel bağlamında, bir yandan da mensubu olduğu Hanefi mezhebinin metinsel referansları çerçevesinde analiz edilmektedir. Vani'nin fetvalarını dayandırdığı fıkıh kitapları listesi incelendiğinde Buhara-Semerkand bölgesi Hanefi alimlerinin onun hukuki birikiminde önemli bir rol oynadığı görülmektedir. Bu açıdan Vani'nin umumi Osmanlı ulema topluluğunun bir parçası olduğu da söylenebilir."
