abstract: "Bu çalışmamzda Ebu'l-Berakât en-Nesefî'nin (ö. 310/710)“Medâriku't-Tenzîl ve Hakâiku't-Te'vîl”adlı eserindeki ahkâm ayetlerine yaklaşım tarzını açıklamaya çalıştık. İslamî ilimlerin her sahasında eserler vermiş olan en-Nesefî'nin tefsir alanında yazmış olduğu tek eser“Medâriku't-Tenzîl ve Hakâiku't-Te'vîl'dir. Bu eser, sade, kısa, kolay anlaşılır olmasının yanında içerik bakımından son derece zengin bir eserdir. Araştırmamız, bir giriş ve on bir bölümden oluşmaktadır. Çalışmamızın birinci bölümünde araştırmanın amacı ve metodu hakkında genel bilgi verdik. İkinci bölümde hayatı, ders aldığı hocaları, yazmış olduğu eserleri, yetiştirmiş olduğu önemli talebeleri ve ”Medâriku't-Tenzîl ve Hakâiku't-Te'vîl\" hakkında genel bilgi verdik. Üçüncü bölümde en-Nesefî'nin temizlik ile ilgili ahkâm ayetlerine karşı tutumunu belirledik. Teyemmüm ve gusül konuları hakkındaki yorumlarını tespit ettik. Dördüncü bölümde ibadet konuları olan ezan, namaz, oruç, hac, zekât ve kurban ile ilgili yorumlarına yer verdik. Beşinci bölümde aile hukuku konuları olan evlilik, nikâh, talâk gibi konular hakkındaki ayetlerle ilgili yorumlarını aktardık. Bu konularla alakalı olan genel şartları açıklamaya çalıştık. Altıncı bölümde ise miras hukuku konuları hakkındaki ahkâm ayetleri genel olarak açıklanmaya çalışılmıştır. Konu ile kavramları genel olarak verdik. Bu bölümde en-Nesefî'nin konu ile ilgili ayet yorumları genel olarak açıklanmıştır. Yedinci bölümde borçlar hukuku ile ilgili konular ele alınmış ve müfessirin konu ile ilgili ayetlerle ilgili yorumlarına yer verilmiştir. Sekizinci bölümde ceza hukuku hakkındaki yorumlarına yer verilmiştir. Bu kısımda ceza konusunda genel ilkeler yanında özel cezalar hakkındaki içki, zina, kazf, sirkat, bağy gibi ayet yorumları, kısas cezaları ve ta'zir cezaları ile ilgili ayetler hakkındaki yorumlarına yer verilmiştir. Dokuzuncu bölümle muhakeme hukuku konuları olan şahitlik ve şahitlerde aranan genel ve özel şartlarla, şahitlerin yemin ettirilmesi ve şahitlikten dönme konuları ile ilgili ayet yorumlarını aktardık. Onuncu bölümde devletler hukukunu üç kısım halinde işledik. Birinci kısımda Müslüman yöneticilerde bulunması gereken özellikleri, ikinci kısımda temel haklar konusunu, üçüncü kısımda ise savaş hukuku konuları hakkındaki ayetleri tespit ederek en-Nesefî'nin yorumlarını aktardık. On birinci bölümde yukarıda açıklamaya çalıştığımız konular dışında kalan değişik konular hakkındaki müfessirin yorumlarını verdik."
