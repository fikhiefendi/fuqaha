abstract: "Çevresel açıdan sürdürülebilir projeleri finanse etmek üzere tasarlanmış faizsiz bir finansal yenilik olan Yeşil Sukuk, İslami finans ile küresel sürdürülebilirlik hedefleri arasında bir köprü işlevi görme potansiyeliyle giderek daha fazla ilgi görmektedir. Malezya, Endonezya ve Suudi Arabistan gibi ülkelerdeki artan ihraçlara rağmen, Yeşil Sukuk piyasası halen sınırlı kapsamlı, dengesiz gelişen ve yönetişim açısından parçalı bir yapıdadır. Bu tez, piyasayı kısıtlayan çok boyutlu engelleri incelemekte ve bu engellerin önceliklendirilmesine yönelik yapısal bir çerçeve sunmaktadır. Çalışmada sistematik ve bibliyometrik literatür taraması, uzman görüşmelerine dayalı nitel analiz ve Bayesyen En İyiden-En Kötüye Yöntemi (BWM) gibi entegre yöntemler birlikte kullanılmıştır. Literatür analizi, kavramsal netlik, düzenleyici uyum ve paydaş etkileşimi konularında önemli boşlukları ortaya koymaktadır. Uzmanlarla yapılan görüşmeler, piyasayı şekillendiren kurumsal, etik ve bağlamsal dinamikleri açığa çıkarmıştır. BWM ise, belirsizlik ortamında zorlukların ve çözüm seçeneklerinin önceliklendirilmesine olanak sağlayan karar destek aracı olarak bu bağlamda uygulanmıştır. Bulgular, farklı ülkelerde şiddeti değişen temel engelleri—ESG ile Şeriat uyumsuzluğu, standart eksikliği, yatırımcı farkındalığının düşük olması gibi—gözler önüne sermektedir. Bu çok yöntemli yaklaşım, paydaş temelli bir zorluk taksonomisi ile esnek bir karar verme çerçevesi geliştirilmesine olanak sağlamıştır. Araştırma, İslami sürdürülebilir finans alanına etik, kurumsal ve karar bilimi boyutlarını bütünleştiren yenilikçi katkılar sunmaktadır."
