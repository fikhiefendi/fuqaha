abstract: "Katılım Bankacılığı, İslami hassasiyetleri olan kişilerin faizle işlem gören geleneksel bankacılığı kullanmak istememeleri sebebiyle ortaya çıkmıştır. Katılım bankacılığının işleyişinin temelinde ortaklık mantığı yatmaktadır ve İslam'da ticari ortaklık teşvik edilmiştir. Katılım bankacılığı da bu minval üzere kurulmuştur. Katılım bankacılığı nev-i şahsına münhasır özellikleri yanında kredi kartı, finansman desteği, fon kullandırma ve sigortacılık işlemleri gibi diğer bankacılık işlemlerini de yapmaktadır. Fakat bu işlemleri de yaparken yine hak keza İslami esaslara riayet edilmektedir. Katılım bankacılığının yaygınlaşması ile faiz hassasiyeti nedeniyle para piyasasına dâhil edilmeyen atıl kalan fonlar da ticari sahaya intikal ederek piyasada ki işlem hacmi genişlemiştir Bu çalışmada ülkemizde faaliyette bulunan katılım bankalarının Covid-19 Salgın döneminde finansal performansları TOPSİS yöntemi kullanılarak analizi amaçlanmıştır. TOPSİS yöntemi çok kriterli karar verme yöntemlerinden biridir. Çalışma kapsamında ülkemizde faaliyette bulunan altı adet katılım bankasının 2019-2022 yılları arası finansal performansı analizi için Aktif Karlılık, Özkaynak Karlılığı, Özkaynaklar/Aktif Toplamı, Net Faiz (Kâr Payı) Geliri/Aktif Toplamı, Vergi Öncesi Kâr (VÖK)/Pasif Toplamı, Kullandırılan Fonlar / Toplam Aktifler, Kullandırılan Fon / Toplanan Fonlar olmak üzere yedi adet oran kullanılmıştır. TOPSİS yöntemi kullanılarak yapılan analiz sonucunda 2019 yılında en yüksek performans gösteren katılım bankasının Ziraat Katılım Bankası olduğu, en düşük performans gösteren katılım bankasının Albaraka Türk Katılım bankası olduğu, 2020 yılında en yüksek performans gösteren katılım bankasının Kuveyt Türk Katılım Bankası olduğu, en düşük performans gösteren katılım bankasının Emlak Katılım Bankası olduğu, 2021 yılında Kuveyt Türk Katılım Bankası yine en yüksek performansı gösteren katılım bankası, Emlak Katılım Bankası en düşük performansı gösteren katılım bankası, 2022 yılında da en yüksek ve en düşük performans değişmemiş en yüksek performansın Kuveyt Türk Katılım Bankası en düşük performansın ise Albaraka Türk Katılım Bankası olduğu tespit edilmiştir."
