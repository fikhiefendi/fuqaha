abstract: "İslam Ceza Hukukunda Suça Teşebbüs? adını taşıyan bu tezimiz, klasik ve çağdaş kaynaklara dayanarak İslam Ceza Hukukunun ?suça teşebbüs? teorisine yabancı olmadığını ve buna gereken önemi verdiğini ortaya koymayı amaçlamaktadır.İslam Ceza Hukukunda teori olarak teşebbüs ortaya konmamıştır. Çünkü Batı Hukukunda bu teorinin geliştirilmemesi durumunda ?kanunsuz suç ve ceza olmaz? prensibi gereğince teşebbüs aşamasında kalan bir çok zararlı davranış cezasız kalacaktı. İslam Hukukunda ise ta'zîr suç ve cezaları teşebbüsü de kapsadığından bu teoriye ihtiyaç duyulmamıştır. Zira İslam Hukukuna göre; bir fiil veya terk masıyet/suç kapsamına giriyorsa ve naslar tarafından cezası belirlenmemişse ta'zîrle cezalandırılır, hükmü teşebbüsü de kapsamaktadır.İslam Ceza Hukukunda teşebbüs; kasıt (manevi unsur), suçun icrasına başlanmış olması (maddi unsur) ve failin iradesi dışında neticenin meydana gelmemesi unsurlarından oluşur. Buna göre, İslam Hukukunda teşebbüs öncesi düşünce cezalandırılmamaktadır. Suç öncesi hazırlık hareketlerinin cezalandırılması gerektiğini söyleyen fakihler varsa da İslam Hukukçularının genel kanaati aksi yöndedir. Kasıtlı olmayan suçlar ise manevi unsur bulunmadığı için teşebbüse konu olmamaktadırlar. İslam Ceza hukukuna göre, teşebbüs ta'zîr ile cezalandırılır. Ta'zîrin miktarını belirleme yetkisi ise ulu'l-emre ve hâkime bırakılmıştır.Teşebbüste vazgeçme konusunu fakihler tevbenin cezalara etkisi bağlamında ele almışlardır. Tevbe, kamuyu/hukukullahı ilgilendiren teşebbüs suçlarında cezayı düşürmekle birlikte kul hakkını ilgilendiren suçlarda tevbenin cezaya bir etkisi bulunmamaktadır"
