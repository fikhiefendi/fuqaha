abstract: "Bu çalışmada,sağkalım analizi teknikleri kullanılarak Türkiye'deki katılım bankacılığı ve geleneksel bankacılık firma kredilerinin temerrüt olasılıkları 2011 Ocak-2012 Aralık dönemi içerisinde karşılaştırılmıştır. Bankalar söz konusu dönemde, firmalara 4 milyonun üzerinde kredi tahsis etmişlerdir. Banka, borçlu ve kredi karakteristiklerinin etkisi kontrol edildiğinde, katılım kredilerinin temerrüt olasılığı, geleneksel kredilere göre daha fazladır. Sadece katılım bankalarından kredi kullanan kişilerin kredi temerrüt olasılığı, her iki banka tipinden kredi kullananların kredi temerrüt olasılığından düşüktür. Her iki banka tipinden de borç alanlar incelendiğinde, katılım kredilerinin temerrüt olasılıkları aynı şekilde görece yüksektir. Büyük krediler incelendiğinde, kredi temerrüt olasılığı nüfusun fazla olduğu, kişi başı cami oranının yüksek olduğu ve kişi başı Kuran kursu katılımcısının fazla olduğu illerde daha düşüktür."
