abstract: "Ahkâm âyetlerinin ardındaki maksat ve hikmetlerin bazen doğru anlaşılamamasının temel sebeplerinden biri bu hükümlere delil gösterilen nebevî sünnetin çoğunlukla bağlamından koparılarak yüzeysel ve lafzî bir yaklaşımla yorumlanmasıdır. Bu durum özellikle kadına ilişkin meselelerde daha belirgin bir hâle gelmiş, klasik ahkâm tefsirlerinde yer alan bir kısım yorumlar kimi zaman dilsel veya sosyokültürel bağlamından tamamen kopuk ve yalnızca lafzî düzeyde kalmıştır. Zamanla bu eserler, kadınla ilgili dinî anlayışın oluşumunda etkili kaynaklar hâline gelmiştir. Bu çalışma; yukarıda sözü edilen yanlış algı ve anlayıştan hareketle Cessâs, Kiyâ el-Herrâsî, İbnü'l-Arabî ve Kurtubî gibi mezhebi kimliği farklı olan klasik ahkâm tefsiri geleneğinin öncü isimlerinin eserlerini merkeze alarak mehir, nüşûz, boşama yetkisi (muhâlea ve tefvîz), miras ve şahitlik gibi kadına ilişkin meselelerde başvurulan nebevî sünneti bağlamsal analiz yöntemiyle yeniden incelemektedir. Araştırmada, nebevî sünnetin çok katmanlı bir bağlam analiziyle daha sahih ve kapsayıcı bir anlama ulaşılabileceği savunulmaktadır. Araştırma; metin içi ve metin dışı bağlam analizi olmak üzere iki ana kategoride yapılandırılarak metin içi bağlam düzeyinde rivayetlerin dilsel özellikleri, konusal bütünlüğü ve diğer sünnet verileriyle ilişkisini içeren bir analiz uygulanırken metin dışı bağlamda ise rivayetlerin vürûd bulduğu tarihsel zemin ile toplumsal ve kültürel şartlar bütüncül bir perspektifle tahlil edilmektedir. Yapılan analizler sonucunda, klasik tefsirlerdeki bazı yorumların sünneti dönemin örfî yapısından ve nebevî örnekliğin bütüncül-kuşatıcı ilkelerinden soyutlayarak değerlendirdiği tespit edilmiştir. Sünnetin iç ve dış bağlam katmanları dikkate alındığında, söz konusu tefsirlerdeki yorumların nebevî mesajın dönüştürücü ve adalet merkezli asıl maksadından farklılaştığı ortaya konmuştur. Neticede bu tez, nebevî sünnetin bağlamsal ve bütüncül bir perspektifle okunmasının; klasik ahkâm tefsirlerindeki literal daralmaları aşmada ve Kur'an-sünnet bütünlüğüne dayalı sahih bir anlam ufkuna ulaşmada vazgeçilmez bir yöntem olduğunu savunmaktadır."
