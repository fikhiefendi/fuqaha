abstract: "Mahkemeler adaletin tecelli bulması adına kurulan ve her türlü davaların görülüp karara bağlandığı yerdir. Osmanlı Devleti'nde bu kimi zaman kadının evi kimi zaman cami olabilmekteydi. Davacı ve davalıların söz konusu davadaki söz haklarından sonra delil ve şahitlerin de dikkate alınmasıyla bir hükme bağlanmak suretiyle dava çözüme kavuşturulurdu. Osmanlı mahkemeleri kadı huzurunda gerçekleşmekte ve dava konuları özenle tutulmaktaydı. Bu dava kayıtlarının tutulması şer'iyye sicilleri veya kadı sicilleri diye adlandırılan muhtevasında birçok belge türünü bulunduran defter türünün oluşmasını sağlamıştır. Şer'iyye sicilleri içerisinde yer alan belge türleri arasında hüccet, i'lâm, tereke, ferman, berat, vakfiye vs. bulunmaktadır. 179 Numaralı Sivas Şer'iyye Sicili'nin incelendiği bu çalışmada söz konusu sicilde yer alan belgelerin vekalet hücceti olduğu tespit edilmiştir. Muhtelif konular içermekle birlikte miras, alacak-verecek, nikah en sık vekalet verilen konular olmuştur."
