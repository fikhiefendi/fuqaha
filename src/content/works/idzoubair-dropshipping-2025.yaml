abstract: "Günün koşulları ve gelişen teknoloji ile beraber ortaya çıkan ve dropshipping olarak adlandırılan bir satıcının elinde stok bulundurmadan sipariş alıp, müşteriye başka bir tedarikçi veya toptancı üzerinden ürün, mal veya hizmet sağlanması yoluyla e-ticaret gittikçe yaygınlık kazanmaktadır. Bu, karlı satış modellerinin en belirgin örneklerinden birini teşkil etmektedir. Ciddi anlamda yaygınlık kazanması, insanların buna meyletmesi ile meydana gelen bu yeni ticaret modelinin araştırılması ve buna ışık tutulması bu çalışmanın önemini ortaya koymaktadır. Bu bağlamda çalışma, adı geçen e-ticaret modeliyle alakalı kavramların açıklanması, Bu ticaret modelinin mahiyetini, bu akit içerisinde yer alan tarafları ve bunların rollerini incelemektedir. Bu aşamaların sonunda ise bu yöntemin fıkhî olarak incelenmesi ve doğru hükme ulaşılması hedeflenmiştir. Ayrıca bu modelde bulunması muhtemel İslam hukukuna aykırı durumlara da alternatif olabilecek çözümler bulunması amaçlanmıştır. Araştırmacı, çalışmasında belirttiği hedefleri gerçekleştirebilmek adına konuyla alakalı toplanması gereken veriyi kitaplar, akademik çalışmalar ve elektronik kaynaklardan elde etmede tümevarım yöntemini kullanmıştır. Ayrıca bu satış modelinin mahiyetinin belirtilmesi için betimleyici yöntem ile elde edilenlerin analizi ve değerlendirilmesi için de analitik yöntemden yararlanmıştır. Çalışmanın ulaştığı önemli sonuçlardan bazıları şunlardır. Çağdaş âlimler, bu elektronik satışın hangi fıkıh kategorisine girdiği konusunda ihtilaf etmişlerdir. Bazıları bunun bir“selem satışı”olduğunu savunurken, bazıları da satıcının elinde bulunmayan bir malın satışı olarak değerlendirmiştir. Araştırmacı, bu görüşleri detaylı bir şekilde inceleyip tartıştıktan sonra ikinci görüşün daha isabetli olduğu kanaatine varmıştır. Buna göre, mağaza sahibinin elinde olmayan bir ürünü satması, işlemi geçersiz kılmaktadır. Zira satıcı; henüz mülkiyetinde bulunmayan, selem şartlarını taşımayan, teslim alınmamış ve garanti edilmemiş bir malı satmaktadır. Tüm bu unsurlar, İslam hukukunda yasaklanan durumlara işaret etmekte olup araştırmacı bu konuyu detaylı bir şekilde analiz etmiştir. Zikredilen ve cevazı noktasında sorun olan bu yöntemler yerine araştırmada komisyon yoluyla satış ve ücretli vekalet olmak üzere iki alternatif önerilmektedir. Çalışmada bunların elektronik ticarette ilgili hükümleri, ilke ve kaideleri de açıklanmıştır."
