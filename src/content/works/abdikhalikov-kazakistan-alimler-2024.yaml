abstract: "Bu çalışmada, Kazakistan Âlimler Konseyi ile Türkiye Cumhuriyeti Diyanet İşleri Başkanlığı Din İşleri Yüksek Kurulu'nun ibadetle ilgili fetvaları, fıkhî açıdan tahlil edilmiştir. Araştırma, giriş ve iki ana bölümden oluşmaktadır. Hem Kazakistan Âlimler Konseyi hem de Türk Din İşleri Yüksek Kurulu, 57 ülkenin üye olduğu Uluslararası Fıkıh Akademisi'nin aktif üyeleridir. Tez, Kazakistan Âlimler Konseyi'nin resmi olarak kurulduğu 2013 tarihinden itibaren yayınladığı üç cilt halindeki fetvalardan özellikle ibadet alanındakileri karşılaştırmayı amaçlamaktadır. Tezde, her iki kurumun ibadetle ilgili fetvalarının analizi yapılmış ve bu fetvaların fıkhî temelleri üzerinde derinlemesine bir inceleme gerçekleştirilmiştir. Kazakistan Âlimler Konseyi ve Türk Diyanet İşleri Başkanlığı'nın fetvalarının benzerlikleri ve farklılıkları vurgulanarak bu durumun bölgesel ve kültürel nedenleri tahlil edilmeye çalışılmıştır."
