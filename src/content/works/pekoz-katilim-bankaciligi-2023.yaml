abstract: "Yurtiçinde ve yurtdışında yaşayan çok sayıda insan faiz ve türevlerinden uzak durmak istemekte, bu nedenle de klasik bankalara gitmemekte, klasik bankaların finansal yatırım araçlarından uzak durmaktadır. Bu durum yüksek miktarda fonların âtıl kalmasına ve ekonomide ciddi bir kaybın oluşmasına sebep olmaktadır. Faiz hassasiyeti nedeniyle oluşan âtıl tasarrufları hem ekonomiye dâhil etmek hem de bu tasarrufları faizsiz enstrümanlarla değerlendirmelerine olanak sağlamak amacıyla 1984 yılında Türkiye'de bu konuda önemli adımlar atılarak ilk faizsiz finans kurumu kurulmuştur. Katılım bankacılığı olarak adlandırılan bu bankalar da diğer bankalar gibi teknolojiye dayalı ürün ve hizmetler sunmaktadırlar. Bu çalışmada katılım bankacılığı müşterilerinin finansal teknolojiye dayalı ürün ve hizmet kullanımlarına yönelik tutumları araştırılmıştır. Araştırmanın örneklemini 430 katılımcı oluşturmuştur. Araştırmanın verileri anket yöntemi ile toplanmış SPSS programı ile analiz edilmiştir. Araştırmanın sonuçları çalışmanın sonuç kısmında sunulmuştur."
