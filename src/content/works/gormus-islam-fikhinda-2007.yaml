abstract: "Dünyada sıklıkla karsılasılan engellilik, özürlülük, sakatlık kavramları ve bu kavramlar arasındaki farklılıkların günlük yasamda değeri yoktur. Bizler için önemli olan kisilerin engellilik konumunu tanımlayan kavramlar değil, engellilerin sağlıklı kisilere nazaran farklı hizmet ihtiyaçlarının bulunduğunun bilinmesidir. Engelli bireylerin ihtiyaçlarının farkında olunması, onlara sağlanacak hizmetleri etkilemesi ve kalitesini artırması açısından büyük önem tasır. Hangi kavramla ifade edilirse edilsin önemli olan engellileri anlayabilmek, engellerini asgariye indirgeyebilmek için azami derecede sosyal dayanısmayı gerçeklestirerek toplumsal anlayısın yükselmesine katkıda bulunabilmeyi sağlamaktır. Dünyada olduğu gibi ülkemizde de sorunları ve ihtiyaçları tam olarak tespit edilememis zihni, bedeni ve ruhi yönden engelli olan insanların olusturduğu bir engelli nüfusu mevcuttur. Engellilik olgusu insan aklını ve gücünü zaman zaman zorlayan ve hatta bazen de asan bir durum olduğundan bu olguyu yine insan aklı ile idrak edip onu anlamlandırmaya çalısmak oldukça zordur. Her insan farklı bir yetenek ve değisik bir yapıda yaratıldığından Allah'ü Teala insanoğlunu gücünün yetebileceği islerle sorumlu kılmıs engellilerle ilgili özel hükümler koyarak inanan kisilerin birbirleriyle dayanısma içerisinde olmalarını emretmistir. Bu tez, gelisen ve değisen sosyal olgular nedeniyle tam bir kavram birlikteliğinin henüz olusturulamadığını bu nedenle engelliliği tam olarak kapsamamakla birlikte çesitli kavramların kullanıldığını, bu kavramların birbirleriyle örtüsen veya ayrısan yanlarının olup olmadığını, engellilerle ilgili mevzuatın birçok hukukta yer aldığını, dini anlamda engelliğin değerlendirilmesi ve sınıflandırılması ile Kur'an ve sünnette engelliye getirilen sorumluluklar ve tanınan kolaylıkları ilgili ayetler ve hadisler ısığında ele alarak bugün engellilerin yasadığı birçok soruna ve ibadetlerin edasıyla ilgili kiside tereddüt meydana getiren konularda herkesin gücü nispetinde ibadetlerle sorumlu olduğuna engelli kisilerin yasamlarını ve ibadetlerini kolaylastıracak bir rehber olarak ısık tutmayı hedeflemektedir. Bu çalısmayı yaparken engelli bireylerin tüm sağlıklı insanlar gibi bu toplumun bir üyesi olduklarına dikkat çekerek ?slam hukukunda engellilerle ilgili ibadet hukukunun olusumunda temel nasların(normların) ayet ve hadislerin varlığını ortaya koymaya ve fıkıh kitaplarında engellilerin ibadetleri ile ilgili seri hükümleri namaz, oruç, hac ve kurban alanlarında ele almaya çalıstık. Öncelikli olarak engellilerin bugünkü durumlarıyla ilgili değerlendirmeler yapabilmek için islamın engellilere destek olunmasını ve onların himaye edilmesini emrettiği ve bunu en önemli evrensel değerler arasında zikretmesiyle birlikte Peygamberimiz Hz. Muhammed'inde ( s.a.v ) birçok hasta, engelli, muhtaç, aciz, zayıf ve güçsüz kimselere sahip çıkarak yakın ilgi ve sefkat gösterdiği bu kimselerin maddi ve manevi açıdan sıkıntılarını gidermeye ve ihtiyaçlarını temin etmeye çalıstığı, onların korunması gerekip toplumun birer parçası olduklarını ifade ettikleri örneklere baktık. Ayrıca çalısmamızda mezhep ayrımı gözetmeksizin fakihlerin ( âlimlerin ) çoğunluğunun üzerinde ittifak ettikleri görüslere ağırlık vermeye çalıstık. Sonuç olarak, islamın insanları değerlendirirken fiziki özelliklerine, renklerine, cinsiyetlerine, ırklarına, zenginliklerine, sağlam ve engelli olup olmadıklarına önem vermeden yaratılmısların en üstünü ve mükemmeli olan insanın Allah katındaki değerinin yalnızca gücü nispetinde ( ölçüsünde ) yapabildiği ibadetler, güzel ahlak, salih amel ve imanı derecesinde olduğunu ayrıca yasanan sıkıntıların kisilerin kendi ihmal ve kusurlarından kaynaklanabileceği gibi kisilerin ihmal ve kusuru olmadan da çesitli nedenlerden kaynaklanabildiğini, bu durumun sabrı ve tahammülü gerektiren bir imtihan olduğunu da ayet ve hadislerin ısığında özet olarak, anlasılır ve bilimsel bir yöntemle sunmaya çalıstık. Bütün toplumların anlamak ve anlamlandırmak için gayret gösterdiği engellilik olgusunun bugün ve gelecekte insanlığın gündeminde olacağı ve bu olgunun her bireyin engelli adayı olması dolayısıyla sadece engellileri ilgilendiren bir durum değil, aslında tüm insanlığı ilgilendiren bir durum olduğu sonucuna ulastık. Burada yapılan yorumlar bugünün yorumlarıdır. Yarın için yapılacak yorumlar değisen ve gelisen sartlara göre farklı olacaktır. Bu da bize islamın zenginliğini akıl nimetine verilen önemi ve değeri göstermektedir. Anahtar Kelimeler; Engelli, ?slam Hukuku, ?badet, Kur'an, Hadis, Sünnet"
