abstract: "Hz. Peygamber'in anne ve babasının dinî ve uhrevî durumu meselesi, İslâm düşüncesinde hem akidevî hem de duygusal yönüyle ele alınan konulardan biridir. Farklı dönemlerde gündeme gelen bu mesele, rivâyetlerin anlamlandırılması ve yorumlanması sürecinde mezheplerarası yaklaşım farklılıklarını da beraberinde getirmiştir. Özellikle el-Fıkhu'l-ekber adlı eserde yer alan“Hz. Peygamber'in anne ve babası küfür üzere ölmüştür.”ifadesi çerçevesinde oluşan literatür, konunun sadece bir rivâyet meselesi olmadığını aynı zamanda kelâmî, ahlakî ve sosyolojik boyutlarıyla da değerlendirildiğini göstermektedir. Molla Ali el-Kârî ve Saçaklızâde gibi isimler üzerinden yürütülen tartışmalar, literal ve bağlamsal yorum yöntemlerinin meseleyi nasıl farklılaştırdığını ortaya koymaktadır. Osmanlı ilim çevrelerinde bu tartışma, toplumsal duyarlılıklar ve peygamber sevgisiyle birleşerek daha derin bir anlam kazanmıştır. Tasavvufî yaklaşımlar ise nûr-i Muhammedî ve hakikat-i Muhammediyye gibi kavramlar aracılığıyla meseleyi metafizik düzlemde yeniden yorumlamış, Hz. Peygamber'in soyunun iman ve safiyetle örülü olduğunu vurgulamıştır. Çalışmada yapılan değerlendirmeler, bu konunun ilim, inanç ve edep dengesi içerisinde ele alınması gerektiğini ortaya koymuştur. Çalışmanın birinci bölümünde, Ebeveyn-i Resûl meselesinin İslâm düşünce tarihindeki yeri kavramsal açıdan ele alınmış; erken dönem rivâyetler ışığında konunun nasıl şekillendiği ortaya konulmuştur. İkinci bölümde, Molla Ali elKârî'nin konuya dair fikirleri analiz edilerek onun rivâyet merkezli ve literal yaklaşıma dayalı düşüncesi detaylandırılmıştır. Üçüncü bölümde, Saçaklızâde'nin ebeveyn-i Resûl konusuna yaklaşımı incelenmiştir. Dördüncü ve son bölümde ise her iki âlimin görüşleri karşılaştırmalı bir bakış açısıyla değerlendirilmiş; metot, dil, kaynak ve sonuç açısından benzerlik ve farklılıkları ortaya koyan kapsamlı bir analiz yapılmıştır."
