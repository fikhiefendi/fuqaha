abstract: "İkâle, akdin hükmünü kaldırmak üzere kendine has bir takım şartlar dahilinde taraflar yahut onların yerini alan kimseler tarafından gerçekleştirilen bir anlaşma olarak tanımlanabilir. Hukuken geçerlilik kazanmış bir akdi sonlandıran veya ortadan kaldıran bir işlemin, ikâle olarak tanımlanabilmesi için, öncelikle bu sonlandırma işinin, akde hayat veren her iki tarafın da katılımı ile gerçekleşip gerçekleşmediğine bakılır. Yani ikâlenin vücûda gelebilmesi için, taraflardan, aralarında mevcut olan akdî bağı sonlandırmaya yönelik iradenin sâdır olması gereklidir. Zirâ, ikâlenin câri olduğu akitler, her iki tarafı da bağlayıcı türde akitlerdir. Bu sebeple bu akitlerin kurulma aşamasında olduğu üzere ortadan kalkmasında da karşılıklı rızaya ihtiyaç vardır. Bağlayıcı olmayan akitlerin ise, akdin kendisini bağlamadığı taraf cihetinden her zaman feshedilme imkânı bulunduğundan, bu tür akitlerin sona ermesinde ikâleye ihtiyaç kalmamaktadır. Ayrıca bir akdin ikâleyle ortadan kalkması için bağlayıcı olması yanında, feshi kâbil olması da icap etmektedir. Bu durumda bey` veya bey`e benzerlik gösteren muâvazalı akitler ikâlenin mahallinde yer alırken; talâk, nikâh, hul` ve ıtk gibi hukukî işlemler feshi mümkün olmamaları hasebiyle ikâlenin kapsamı dışında tutulmaktadır. Fıkıh mezhepleri ikalenin mahiyeti hakkında farklı görüşler ileri sürmektedirler. Bunlardan bir kısmı, hem taraflar hem de üçüncü şahıslar açısından ikâlenin satım akdi gibi bir akit türü olduğunu söylerken bir kısmı da fesih olduğunu ifade etmişlerdir. Bunun yanında ikâlenin taraflar açısından fesih, üçüncü şahıslar açısından yeni bir akit olduğunu ileri süren âlimler de mevcuttur."
