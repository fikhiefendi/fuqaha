abstract: "1173-1250 (1760-1834) yılları arasında yaşayan Yemenli alim Şevkânî, otuz yaşlarına geldiğinde bağlı bulunduğu Zeydiyye mezhebinden ayrılarak kendisini mutlak müctehid olarak ilan etmiştir. Bundan sonra da gerek eserlerinde gerek fetvalarında hiçbir mezhebe bağlı kalmadan kendi icithadıyla hükmetmiştir.es-Seylü'l-cerrâr, Şevkânî'nin son furû' fıkıh eseri olduğundan onun nihai görüşlerini bu eserden takip etmek mümkündür. Şevkânî es-Seylü'l-cerrâr'da esas itibariyle Yemen'deki hakim fıkıh mezhebi olan Hâdevîlik'e reddiyesini sunarken aynı zamanda kendi fıkıh anlayışını da ortaya koymaktadır.Tezin ilk bölümünde Şevkânî'nin hayatı, ilmî şahsiyeti ve telif ettiği eserler hakkında bilgi verilmiştir. İkinci bölümünde ise Şevkânî'nin es-Seylü'l-cerrâr adlı eseri incelenerek fıkıh anlayışı ortaya konmaya çalışılmıştır. Ardından da es-Seylü'l-cerrâr'ın Yemen Zeydi hukukundaki etkisi ele alınmıştır."
