abstract: "Katılım bankacılığı, riba yasağı, garar yasağı ve riskin paylaşılması gibi İslami finans ilkelerine dayanan yapısıyla hem Türkiye'de hem de dünya genelinde istikrarlı biçimde büyümektedir. Sektörün gelişmesine paralel olarak, ürün ve hizmet çeşitliliği artmış; bu durum bankalar ile bireysel müşteriler arasındaki uyuşmazlıkların sayısını ve karmaşıklığını beraberinde getirmiştir. Bu çalışmanın amacı; katılım bankacılığı sektöründeki bireysel müşteri uyuşmazlıklarında başvurulan mevcut yargı dışı çözüm yöntemlerinin fıkhi uygunluğunu değerlendirmek; tahkim ve arabuluculuk gibi alternatif uyuşmazlık çözüm yöntemlerinin hem hukuken hem de İslam hukuku açısından meşruiyetini ve uygulanabilirliğini incelemektir. Çalışma, İstanbul Finans Merkezi'nin katılım finansında merkezi bir rol üstlenme vizyonu çerçevesinde, hızlı, öngörülebilir ve fıkhi ilkelere uygun uyuşmazlık çözümünün sektörün iktisadi sürdürülebilirliği açısından da zorunlu olduğunu savunmaktadır. Çalışmanın ilk bölümünde, uyuşmazlık çözümünün İslam hukukundaki teorik temelleri ele alınmış; sulh ve tahkim müesseseleri değerlendirilmiştir. Bu çerçeve de sulh, tarafların rızasına dayalı en erdemli çözüm yolu olarak öne çıkarken, tahkim tarafların seçtikleri hakem aracılığıyla uyuşmazlıklarını bağlayıcı olarak çözmelerine imkân tanıyan bir yöntem olarak değerlendirilmiştir. Çalışmanın ikinci bölümünde, Türkiye'deki katılım bankacılığı sektöründe bireysel uyuşmazlıklara yönelik mevcut çözüm uygulamaları incelenmiştir. Yapılan inceleme, Türkiye Katılım Bankaları Birliği Bireysel Müşteri Hakem Heyeti verilerine göre, 2022 yılı ve sonrasında bireysel finansman alanındaki başvuruların belirgin bir biçimde arttığını göstermektedir. Bu durum katılım bankacılığının gelişiminin bir göstergesi olması yanında ortaya çıkan yeni uyuşmazlık çözüm arayışının da bir göstergesidir. Üçüncü bölümde ise tahkim standartları, uluslararası İslami finans tahkim kurumları çerçevesinde tahkimin önemi değerlendirilmiş; uzmanlık ve uluslararası icra kabiliyeti sunan tahkimin katılım bankacılığı açısından gerekliliği ortaya konulmuştur. Sonuç olarak, tahkim ve arabuluculuk, katılım bankacılığında yalnızca alternatif değil; sistemin fıkhi meşruiyetini ve müşteri güvenini sağlayan temel mekanizmalar olarak değerlendirilmelidir."
