abstract: "Karşılaştığımız 2007-2008 finansal krizi, 1929'dan beri dünyanın bilinen en büyük krizlerinden birini temsil ediyor. Subprime krizi tarafından tetiklenen bu kriz, 2008'de finansın küreselleşmesi ve finansal piyasaların gelişmesiyle güçlenerek domino etkisiyle tüm dünyaya yayıldı. Devletleri'nin bu krizle baş etme ve dünyayı bir çöküşten kurtarma çabalarına rağmen, kapitalist sistemin etkinliğini en üst noktaya getiren bu durum bugüne kadar kaydedilmedi. Nitekim, yaşadığımız bu durum, finansal sistemin ve temellerinin başarısızlığını vurgulamış; pek çok araştırmacıyı bu durumda ne yapılabileceği ve ekonominin çöküşten nasıl kurtarılabileceği konusunda soru sormaya mecbur bırakmıştır. Bazı araştırmacılar bu kriz için modern finansın mevcut uygulamalarını (spekülasyon ve faiz uygulaması) savunmayan farklı ilkeleriyle İslami finansta bir çözüm yolu olduğunu gördü. Bu çözüm yolu sayesinde, büyümenin, geleneksel finansın iki katı kadar hızlı olduğu tahmin ediliyor. Bu amaçla İslami finansın bu krizi ne ölçüde çözebileceğini anlamak için önce İslami finansmanın temellerini sunmaya çalışacağız. Daha sonra bu sistemin mevcut sistem ve kriz için alternatif bir çözüm yolu olup olamayacağını anlamaya çalışacağız. Sonuç olarak, Fas'ta alternatif ürünlerin sunulmasıyla ilgili olarak bu sistemle ilgili Faslıların algısını analiz etmek için; daha önce kredi kullanan veya hiç kullanmamış olan Faslıların da dahil olduğu deneysel bir çalışma ile bu araştırmayı sonuçlandırıyoruz."
