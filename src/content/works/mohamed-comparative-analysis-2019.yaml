abstract: "Bankalar, bir ülkenin finansal sisteminin temel kuruluşlarından biridir. Bu finansal kuruluşlar tarafından sağlanan operasyon ve hizmetler, ekonominin farklı sektörleri üzerinde hem doğrudan hem de dolaylı etkilere sahiptir. Bu nedenle, ekonominin istikrarlı ve sorunsuz bir şekilde yürütülmesini sağlamak için bankaların operasyonlarının ve performansının uygun şekilde kontrol edilmesi önemlidir. Bankacılık sistemi, uzun yıllardır geleneksel sistem altında faaliyet göstermekte olup, kredi verme, finansal kiralama hizmetleri, fon transferi ve faiz ödemeleri karşılığında mevduat şeklinde para oluşturma gibi hizmetler sunmaktadır. Bu bankalar faiz prensipleri altında faaliyet gösterdikleri için Bankacilik işlemi gerçekleştirmek isteyen Müslümanların ihtiyaçlarını karşılayacak başka bir bankaya ihtiyaç vardı. Bu İslami finansal sistem tamamen İslam'ın ilkelerine dayanmakta olup iş ilişkileriyle ilgili İslami kurallara göre çalışmaktadır. Bu nedenle, 1980'de“faizsiz bankacılık”kavramı ilk olarak ekonomi literatürüne girmiştir. Şu anda, bu bankacılık sistemi, Batı'dan uzak Doğu'ya muazzam bir şekilde genişledi. Bu sistem, farklı kurumlar ve daha gelişmiş finansal araçlarla dünya çapında bir fenomen haline gelmiştir. İslam Kalkınma Bankasından gelen tahminlere göre, Dünyadaki Faizsiz Bankacılığın yönettiği fonlar 200 milyar ABD dolarının üzerindedir. Bu büyük büyümenin temel nedeni, sistemin özellikle Dünya finansal krizi sırasında finansal şokları sürdürme kabiliyetidir. Bu çalışma, 2008 Finansal krizi sırasında ve sonrasında İslami bankaların (Katılım bankaları) ve Geleneksel bankaların CAMEL derecelendirme modelini kullanarak performansını analiz etmeyi amaçlamaktadır. Araştırmada kullanılan veriler esas olarak Türkiye Bankalar Birliği (TBB) ve bireysel bankaların web sitelerinden elde edilmiştir. Analiz sonuçlarına göre, Katılım bankaları, 2008 mali krizinde sermaye yeterliliği, yönetim kalitesi ve piyasa riskine duyarlılık açısından daha iyi bir performans göstermekte olup, likidite, kârlılık ve Aktif kalitesi bileşenlerinde düşük performans göstermiştir."
