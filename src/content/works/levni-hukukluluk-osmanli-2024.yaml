abstract: "Osmanlı İmparatorluğu'nun zengin hukuki mirası, Tanzimat öncesi dönemde geniş bir coğrafyada homojen bir şekilde uygulanmıştır. Bu dönemde, İslam Hukuku ve yerel adetler, hukuki düzenlemelerin temelini oluşturmuştur. Ekonomik açıdan duraklayıp imparatorluğun zayıflamasıyla birlikte, XIX. yüzyılın sonlarında“Avrupa'nın Hasta Adamı”olarak tanımlanan Osmanlı İmparatorluğu hukuk yapılanması, Tanzimat reformlarıyla birlikte modern hukuki yapıların ve Batı hukukunun entegrasyonuyla karmaşık birçok hukukluluk deneyimini doğurmuştur. Tanzimat sonrası dönem, Osmanlı İmparatorluğu'nun modernleşme çabalarını ve Avrupa Hukuku'nun etkilerini yansıtırken, bu dönüşüm Yugoslavya'daki çok hukuklu uygulamaların tarihsel perspektifini de şekillendirmiştir. Modern hukukun egemenlik alanındaki gelişimine rağmen, Osmanlı İmparatorluğu hala İslam Hukuku kurallarını benimsemiş ve uygulamıştır. Osmanlı İmparatorluğu'nun yerel örf ve âdet hukuku yanı sıra Batı ve Doğu hukuk sistemlerini aynı anda kullanma çabası, çok hukukluluk konseptinin karmaşıklığını ortaya koymaktadır. Bu karmaşıklık, Osmanlı İmparatorluğu'nu ve egemen olduğu bölgelerde uygulanan çok hukukluluk deneyimini, özellikle de egemenliği döneminde Balkanlar üzerinde kurulan çok hukuklu yapının, sonrasında Yugoslavya'nın oluşumu sürecinde nasıl etkiler yarattığını ve bu dönemdeki hukuki yapıların evrimi önemli bir örnek olarak araştırmaların odak noktasındadır. Osmanlı egemenliğinin sona ermesiyle birlikte Balkanlar'da yeni bir siyasi düzen kurulmuş ve Yugoslavya Krallığı gibi çok uluslu devletler ortaya çıkmıştır. Bu çalışmada, Osmanlı'nın mirası ve Yugoslavya'da çok hukukluluk arasındaki ilişki, Balkanlar'ın özgün sosyo-politik ve hukuk tarihi bağlamı göz önünde bulundurularak incelenecektir. Yugoslavya Krallığı çok uluslu devlet olarak her ne kadar Osmanlı egemenliği sonrası ortaya çıkmış olsa da çalışmada Balkanlar'ın o bölgesi için“Yugoslavya”terimi kullanılacak ve Osmanlı İmparatorluğu'nun egemenlik döneminden başlayarak Birleşik Güney Slavların hukuki sistemine kadar olan süreci inceleyen hukuk tarihi analizi yapmayı amaçlayacaktır."
