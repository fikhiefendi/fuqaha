abstract: "Bu çalışmada bankacılık sektöründe ve katılım bankacılığında kaynak maliyeti ve fiyatlama ilişkisi konusu araştırılmıştır. Bankacılık sektörü üzerinde makroekonomik koşulların ve yaşanan ekonomik krizler dolayısıyla bankacılık sektörü için yapılan mikro reformlar doğrultusunda bankacılık sektörü üzerine getirilen kamusal yükler ve zorunlu karşılık oranları (vergiler),bankaların kaynak maliyetlerini yükseltmektedir. Ancak alınan bu tedbirlerin finansal istikrara sağladığı katkı tartışılmaz bir gerçektir. Bankalar üzerinde oluşan bu kamusal baskı bankaların fiyatlama davranışlarını etkilemekte böylece bankaların kaynaklarını verimli bir şekilde kullanamamalarına neden olmaktadır. Bu da ekonomik büyümeye olumsuz etki etmekte, bankaların aracılık görevini etkin bir şekilde yerine getirememesine neden olmaktadır. Anahtar Kelimeler; Kaynak Maliyeti, Fiyatlama, Başabaş Analizi"
