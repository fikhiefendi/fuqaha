abstract: "Evlilik, ailenin temel taşıdır. Evlenmek, insanı haramdan uzaklaştıran dini bir müessesedir. Evlilik, insanın kendine uygun bir hayat arkadaşı bularak hem maddi hem de manevi huzur çabasına girişmesi, fakat bu uğraşıda her şeye rağmen mutluluğu elde edebilmesidir. Aynı zamanda evlilik, kaynağını Kur'an ve Sünnetten aldığı için ibadetler arasında değerlendirilir. Bunlar bir taraftan evlilik müessesesinin sınırlarını çizerken diğer taraftan da sorumluluk ve mükellefiyetleri belirler. Evlilikte, hem fert hem toplum için sayılamayacak kadar çok fayda ve güzellikler vardır. Bunların bir kısmı dünya hayatının mutluluğu diğer bir kısmı ise ebedî hayatı elde etmeye yol açan ilâhî olanaklardır. Dünya ve ahiret mutluluğu, Allah'ın emirlerine, Sevgili Peygamberimiz(s.a.v.)'in emir ve tavsiyelerine uymakla elde edilir. Bekârların evlenmesi ise bu emir ve önerilerin başında gelenlerinden biridir. Peygamberimiz (s.a.v.) hem kendisi evlenerek bizlere örnek olmuş, hem de onu şiddetle tavsiye etmiştir. Bu tez/inceleme kapsamında Kütüb-i Sitte'deki evlilik ile ilgili hadisler tespit edilmiştir. Evliliğin aşamalarını geçerken önerilen çeşitli tedbirler ile ilgili değerlendirmelerde bulunulmuştur. Değerlendirme yaparken de Hadis kaynakları'ndan yapılan araştırmalar, Kur'an-ı Kerim ayetleri ile desteklenmiştir. Ayrıca İslâmî bilimler alanında yazılmış diğer kaynaklardan ve modern verilerden yararlanılmıştır. Bu bağlamda; Kütüb-i Sitte ve diğer Hadis kitapları ile bunların şerhleri, Kur'an- Kerim Meal ve Tefsiri, Fıkıh literatürü, konuya dair basılı ya da dijital yayınlar temel kaynak olarak kullanılmıştır. Bu araştırma kapsamında evlilik ile ilgili doğru ve yanlış uygulamaları ortaya koymak; ülkemizde günde yüzlerce yapılan nişan, düğün ve nikâh merasimlerinin İslam'a uygunluğunu akademik bir bakış açısıyla hadislerle birlikte incelemek ve değerlendirmek hedeflenmiştir. Bu sebeple de bu araştırmada evliliğin şartlarının ve aşamalarının, ilmi bağlamda hadislerle tespiti ve İslam'da olması gereken evlilik ile ilgili gerçeklerin hadislerle ortaya konulması amaçlanmıştır."
