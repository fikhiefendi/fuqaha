abstract: "Bu tez, Ebû İshâk eş-Şîrâzî'nin fıkıh usûlünde emir ve nehye dair görüşlerini konu edinmektedir. Şer'i hükümlerin bel kemiğini oluşturan emir ve nehiy, fıkıh usûlünun en önemli konularından biridir. Şari`nin emir ve nehiylerine göre sınırların çizilmesi, bu konunun iyice bilinmesini gerektirmektedir.Üç bölümden oluşan bu tezin birinci bölümü, Şîrâzî'nin hayatı, ilmi gelişimi, hocaları, öğrencileri ve eserlerini konu edinmektedir. İki kısma ayrılan ikinci bölümün birinci kısmında genel olarak emir, ikinci kısımda ise Şirazi'nin emir hakkında düşünceleri incelenmektedir. Üç kısma ayrılan üçüncü bölümde ise birinci kısım genel olarak nehyi, ikinci kısım Şiraz'inin nehye dair görüşlerini, üçüncü kısım ise emir ve nehiy arasındaki ortak meseleyi konu edinmektedir."
