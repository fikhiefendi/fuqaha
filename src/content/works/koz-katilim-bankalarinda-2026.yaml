abstract: "Ekonomik büyümenin ve finansal istikrarın sağlanması konusunda bankacılık sektörü ülkeler için oldukça önemli konumdadır. Bankalar fon talep edenlerle fon arz edenleri bir araya getirerek tasarrufun yatırıma dönüşmesine katkı sağlar. Bankaların kullandırdığı kredilerin zamanında geri ödenmesi bankacılık sisteminde işleyişin devam etmesi için oldukça önemlidir. Kredi kullanan borçlunun borcunu geri ödemediği durumda şüpheli alacaklar oluşur. Şüpheli alacaklar hem bankaları hem de ülke ekonomisini olumsuz etkilemektedir. Bankalar varlık yönetim şirketlerine şüpheli alacakları satarak mali ve operasyon yükünden kurtulur. Konvansiyonel bankalar açısından şüpheli alacağın satışı sorun oluşturmazken katılım bankaları açısından şüpheli alacağın satışı fıkhi tartışmalara sebep olmuştur. Bu çalışmada Türkiye'de faaliyette bulunan katılım bankalarının şüpheli alacak yönetimi incelenmiş ve fıkhi açıdan uygunluğu analiz edilmiştir. Ayrıca katılım bankaları için fıkhi açıdan tartışma yaratan şüpheli alacakların varlık yönetim şirketine satışı konusunda İslam hukukuna uygun alternatif çözüm yolları sunulmaktadır. Bu amaç doğrultusunda iki öneri sunulmuştur: Birinci öneri borçlular için bireysel iflas sistemi oluşturulmasıdır. Bireysel iflas sistemi için mevcut uygulamada bulunan Amerikan Bireysel İflas Sistemi incelenmiştir. İkinci öneri ise katılım bankalarını kapsayan donuk alacak için karşılık ayırma muafiyetidir. Çalışmanın katılım bankalarına kredi riski konusunda daha hassas olmaları ve donuk alacaklardan daha az maliyetle kurtulma konusunda, bireylere ise iflas konusunda yeni bir bakış açısı sağlaması dolayısıyla katkı sağlaması beklenmektedir."
