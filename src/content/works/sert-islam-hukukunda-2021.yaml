abstract: "Bu çalışmada İslam hukukunda helal gıda ile insan sağlığı arasındaki ilişki ele alınmıştır. Çalışmada helal gıdaya dair temel kavramlar, gıda güvenliği ve insan sağlığı açısından tek sağlık yaklaşımı, İslam hukukunda helal gıdaya yönelik genel kurallar ile fıkhi açıdan hayvansal ve bitkisel gıdalar, içecekler, katkı maddeleri ve genetiği değiştirilmiş organizmalar insana, sağlığa, doğaya etkilerinin yanı sıra etik boyutuyla zarar ve faydalarına işaret etmek suretiyle interdisipliner yöntemle farklı boyutlarıyla ifade edilmiştir. Çalışma iki bölümden oluşmuştur. Birinci bölümde helal gıda ve kavramsal çerçeve, helal gıda kavramları, konuyla ilgili yapılan akademik çalışmalar, yaşam hakkı açısından helal gıda, gıda güvenliği ve İslam hukukunda helal gıdaya dair genel kurallardan bahsedilmiştir. İkinci bölümde fıkhi açıdan insan sağlığı yönüyle hayvansal ve bitkisel gıdalar, içecekler, katkı maddeleri, genetiği değiştirilmiş organizmalar ayrıntılı olarak ele alınmış, konuyla ilgili görüşler değerlendirilmiştir. Çalışma genel değerlendirmelerin yapıldığı sonuç bölümüyle tamamlanmıştır."
