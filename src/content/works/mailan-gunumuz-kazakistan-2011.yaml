abstract: "Kazak halkının örfi uygulamaları İslâm öncesi inançlara kadar uzanmaktadır. İslâm öncesi Kazak halkı Mecusilik ve Şamanizm'den çok etkilenmiştir. Ailedeki örfi uygulamaların bu iki inançtan kaynaklandığını görmekteyiz.IX-XIII. yüzyıllar arasında İslâmiyet Kazaklar arasında yaygınlaşmaya ve yerleşmeye başlamıştır. Bu tarihlerde Kazakların eski inançlarıyla İslâm inançları, örfi uygulamalar sahasında bazen çatışmışsa da, zaman içinde İslâm inançlarına ters düşen örfler terk edilmeye başlanmış, İslam inancına uygun olanları ise devam etmiştir. XVII. asırdan itibaren Rusların Kazak topraklarında işgalci politikalarını uygulamasından sonra, Kazak halkının aile örflerine ve inançlarına maddi ve manevi zarar verdiği görmekteyiz. Ruslar, Kazakların kendi örf ve inançlarını unutturmaya çalışmış ve ateizm inancını yaymışlardır. Kazakistan Cumhuriyeti'nin 1991 senesinde bağımsızlığını kazanmasıyla birlikte, unutturulmuş olan milli örflere hızla geri dönüş başlamıştır ve bu kapsamda, aile örflerine de geri dönüş olmuştur.Tez çalışmamız giriş ve dört bölümden oluşmaktadır. Giriş bölümünde genel olarak Kazak halkının örfi uygulamaları anlatılmaktadır. Birinci bölümde ise İslâm hukukunda örfün yeri ve önemi tespit edilmiştir. Son üç bölümde ise Kazak halkının Aile örfleri İslâm hukuku açısından incelenmeye çalışılmıştır."
