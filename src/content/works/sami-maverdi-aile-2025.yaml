abstract: "Bu çalışmada, Mâverdî'nin (ö. 450/1058) el-Hâvi'l-Kebîr adlı eserinde aile hukukuna dair meselelerde ahkâm ayetlerine yaklaşımı, tefsirî ve fıkhî perspektifler ışığında incelenerek klasik fıkıh literatürünün Kur'ân merkezli yapısı ortaya konulmakta; fukahanın Kur'ân'ı nasıl yorumladıkları ve ondan nasıl hüküm istinbatında bulunduklarına dikkat çekilmektedir. Zira Kur'ân ahkâmını doğrudan konu edinen fıkıh eserlerinde Kur'ân, teşrî'in ilk ve en önemli kaynağı kabul edilmiş; fakîhler de belirli usûlî prensipler çerçevesinde hemen her meselede Kur'ân'a müracaat etmişlerdir. Bu bağlamda, çalışmada Mâverdî'nin aile hukukuna dair ahkâm ayetlerini ele alış tarzı, fıkıh kitaplarındaki sıralama dikkate alınarak konulu bir yöntemle incelenmiş; böylece her meseleye ilişkin deliller bir arada değerlendirilerek konunun bütüncül biçimde anlaşılması hedeflenmiştir. Sonuç olarak bu tez, Mâverdî'nin fıkıh ilmindeki önemini vurgulamakta; el-Hâvi'l-Kebîr'in yalnızca bir fıkıh metni değil, aynı zamanda Kur'an tefsiri açısından da kıymetli bir kaynak olduğunu göstermektedir. Çalışma, İslam düşünce tarihinde fıkıh ve tefsir ilimlerinin ayrılmaz bağını Mâverdî örneği üzerinden somutlaştırarak gelecekteki fıkıh ve tefsir usûlü araştırmaları için zemin hazırlamaktadır. Elde edilen bulgular, klasik fıkıh metinlerinin Kur'ân ayetlerine yaklaşımının sanılandan daha derin ve metodolojik olduğunu ortaya koymuş; böylece tefsir-fıkıh ilişkisine yeni bir bakış açısı kazandırmıştır."
