abstract: "Kiralanın el değiştirmesi başlıklı bu çalışmada, TBK m. 310 ve 311 hükmüyle birlikte Türk hukukunda meydana gelen değişiklik incelenmiştir. 6098 s. TBK'nda, 818 s. BK m. 254 düzenlemesinden farklı olarak, kiralananın el değiştirmesi halinde, yeni malikin kira sözleşmesine taraf olması kural haline getirilmiştir. TBK m. 311'de ise sınırlı aynî haklar konusunda da, TBK m. 310'un kıyasen uygulanacağı esası belirlenmiştir. Hükmün hukukî niteliği yasal sözleşme devri olarak belirlenirken, emredici karakteri sebebiyle, eski malik, yeni malik ve kiracı yasal sözleşme devrinin sonuçlarından kurtulamazlar. TBK m. 311 konusunda ise, yasal sözleşme devrinden farklı sonuçlar da ortaya çıkabilecektir. Bazı sınırlı aynî haklarda hükmün uygulanması mümkün değilken, kimilerinde de sözleşmeye katılmadan bahsedilebilir."
