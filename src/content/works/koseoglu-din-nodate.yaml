abstract: "DİYK, Diyanet İşleri Başkanlığının dini konularda en yüksek karar ve danışma organı olma niteliğini taşımaktadır. İslam dininin temel bilgi kaynaklanını ve metodolojisini, tarihi tecrübesini, güncel talep ve ihtiyaçları dikkate alarak dini konularda karar vermek, görüş bildirmek ve dini soruları cevaplandırmak gibi bir görevi vardır. Ayrıca, dini konularda telif, tercüme, inceleme ve araştırmalar yapmak yaptırmak, ihtiyaç duyduğu konularda inceleme ve araştırma grupları oluşturmak, bu hususta yurtiçi veya yurtdışındaki uzman kişi ve kuruluşlardan yararlanmak, gerektiğinde bu alanlarda hizmet satın almak ve sonuçlarını Başkanlığa sunmak görevi yine DİYKnun asli görevleri arasında bulunmaktadır. Yurtiçinde ve yurtdışında İslam dinine mensup farklı dini yorum çevrelerini, dini sosyal teşekkülleri ve geleneksel dini kültürel oluşumları incelemek, değerlendirmek; bu konularda bilgi bankaları oluşturmak, ilmi ve istişari toplantılar, konferanslar düzenlemek ve çalışmalar yapmak; yurtiçinde ve yurtdışında İslam diniyle ilgili gelişmeleri, dini ve ilmi faaliyetleri, neşriyatı ve dini propaganda mahiyetindeki çalışmaları takip etmek, bunları değerlendirmek ve sonucunu Diyanet İşleri Başkanlığı'na sunmak yine DİYK'nun görevleri arasında bulunmaktadır. Bunun yanında, Diyanet İşleri Başkanlığınca kendisine tevdi edilen görevleri yapmak gibi bir sorumluluk taşımaktadır.“DİYK Fetva Usûlü ve Fetvada Değişim”isimli çalışmamızda başta ülkemiz ve dünyanın çeşitli bölgelerinde yaşayan müslümanların gündeminde sıkça tartışılan dinî konularda hayatımızda karşılaşılan meseleleri doğru bir şekilde çözüme kavuşturmayı ve Müslümanları din konusunda sağlıklı bilgilendirme ve aydınlatmada önemli bir rol üstlenen DİYK'nun diğer ferdî ve kurumsal fetvalarla ortak bir bakış açısını geliştirmeyi amaçladık. Verilmiş olan karar ve fetvaların yaşam koşulları, değişen durumlar, zaman- mekân farklılıklarına göre nasıl değiştiğini tespit etmeye çalıştık. Fetvalarda hikmet-maslahat ve makasıd ilişkine ve hedeflerine usûl denetiminde fürudan hareketle hayatın nasıl yönlendirildiğine işaret ettik. DİYK'nun aldığı kararların din ile evrensel değerler arasında bir tenakuzun olmadığını ve sosyal değişimin ortaya çıkardığı problemlerin sağlıklı bir perspektifle çözüme kavuşturulmasının mümkün olduğunu göstermektedir."
