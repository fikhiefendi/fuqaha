abstract: "ÖZET Osmanlı hukukunun kaynakları şer' i ve örfi hukuka dayanmaktadır. Tanzimat döneminden önce, Fatih Sultan Mehmet ve Kanuni Suttan Süleyman dönemlerinde önemli kanunnâmelerin çıkarıldığı bilinmektedir. Osmanlı devletindeki çeşitli mahkemeler de Tanzimat öncesi Osmanlı hukukunun genel durumu hakkında fikir verici mahiyettedir. Tanzimatın ilanıyla bir takım hukuk ve kanunlaştırma reformları yapılmış, yeni kanunlar yürürlüğe konulmuştur. Bu dönemde, çeşitli mahkemelerin kurulmasıyla adli teşkilat alanında da önemli reformlar gerçekleştirilmiştir. Kanunlaştırma alanında yapılan reformlardan biri olan M ecelle- i Ahkfim-ı Adliye' nin oluşumunda, iç ve dış sebeplerin önemli etkisi olmuştur. Söz konusu faaliyete başlanmadan önce birtakım hukuk çalışmaları da yapılmıştır. Mecelle'nin hazırlanmasında başta Ahmet Cevdet Paşa olmak üzere on beş Osmanlı ilim adamı ciddi caba ve gayret göstermişlerdir. Hazırlanması, sistematiği, metodu, içeriği ve kaynakları tahlil edildiğinde, ona yöneltilen bazı eleştirilere rağmen Mecelle'nin, ciddi bir çabanın ürünü olduğu görülmektedir. IV"
