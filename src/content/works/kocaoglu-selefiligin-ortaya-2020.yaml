abstract: "İslâm dini, ortaya çıktığı dönemden itibaren belirli bir coğrafyada yayılmaya başlayarak kısa zamanda büyük bir gelişme kaydetmiş ve yayıldığı toplumlarda zamanla pek çok dini ekol ortaya çıkmıştır. Bunlardan biri de Selefiliğin temeli“İbn Teymiyye Ekolü”dür. İbn Teymiyye'ye dayandırılan bu ekol, başlangıçta taraftar bulsa da onun ölü-müyle birlikte zayıflamaya başlamış ve gücünü gittikçe kaybetmiştir. Ancak izleri tama-men kaybolmayan Selefiyye ekolü XVIII. yüzyıla gelindiğinde Muhammed b. Abdül-vehhab tarafından Selefîlik şeklinde yeniden gündeme getirilmiştir. Bu yeni selefilik her ne kadar İlm-i Selefiyye'ye benzese de aslında zihniyet olarak oldukça farklıdır. Öte yandan Selefîlik akımı yalnız dini değil, izlediği metot ve uygulamalarına bakıldığında onun aynı zamanda siyasi bir hareket olduğu da söylenebilir. Selefîler dı-şındaki Müslümanların ötekileştirilmesi, hatta kimisinin kâfir olarak görülmesi bu özelli-ğinden kaynaklanmış olmalıdır. Selefîlik esasen son dönemde Suudi Arabistan'ın resmi dini ideolojisi haline getirilmiş ve devletin kuruluşunda önemli bir rol oynamıştır. Her ne kadar kökleri oldukça eskiye dayansa da Selefîlik bugün modern bir gö-rünüm kazanmıştır. Militan Selefîler ve Siyasi Selefîler gibi ayrışmalar bunun en açık işaretidir. Işid, El-Nusra, El-Kâide, Boko Haram, Eş-Şebâb gibi dini görünümlü siyasi amaçlı örgütlerin, dünyanın pek çok yerinde kanlı terör olaylarını gerçekleştirmeleri onla-rın dini hareketlerden ziyade siyasi yapılanmalar olduğunu açıkça ortaya koymaktadır."
