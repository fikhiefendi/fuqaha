abstract: "Zekât malî bir ibadettir. Ekonomik şartlar her geçen gün geliştiği için zekâta tabi olan malların kapsamı da genişler ve yeni güncel zekât konuları ortaya çıkar. Güncel zekât konularından biri de yatırım mallarının zekâtıdır. Çalıştırmak veya kiraya vermek suretiyle kendisinden para kazanılan her türlü mal, yatırım malı kapsamına girmektedir. Zekâta tabi olduğu konusunda hususi nass yani hadis olan tüm mallar ittifakla zekâta tabidir. Hakkında hususi nass olmayan malların zekâtı konusunda âlimler ihtilaf etmektedir. Yatırım mallarının bir kısmı Resûlullah (s.a.v.) döneminde mevcut olmadığı, mevcut olanlar da çok ender olduğu için bu malların zekâtı konusunda doğrudan hadisler yoktur. Bunun için muasır âlimler yatırım mallarının zekâta tabi oluşu konusunda farklı görüşler beyan etmektedir. Bu konuda genel anlamda üç farklı görüş mevcuttur.Zekât konusunda kıyasa fazla yer vermeyen ve zekât mallarının kapsamını hadislerde zekâta tabi olduğu beyan edilen mallarla sınırlandıranlara göre, yatırım mallarının kıymetinde zekât vacip değildir. Sadece bu mallardan kazanılan parada zekât vaciptir, bu parada zekâtın vacip olması için nisaba ulaşması ve üzerinden bir yılın geçmesi lazımdır. Zekât konusunda kıyasa geniş yer veren ve zekât mallarının kapsamını geniş tutan mezhep imamları ve muasır yazarlara göre yatırım malları ticaret malı hükmündedir. Buna göre hem yatırım mallarının kıymetinde hem de bu mallardan kazanılan parada zekât vaciptir, bunun toplamından kırkta bir zekât verilir. Diğer bazı âlimler ise yatırım mallarını tarla ve bahçeye kıyas etmektedir. Buna göre bu malların net gelirinden onda bir veya toplam gelirinden yirmide bir zekât verilir."
