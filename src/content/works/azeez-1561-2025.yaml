abstract: "Bu tez, hicri onuncu yüzyıl fakihlerinden Taşköprizade Ahmed Efendi (958/1551) olarak bilinen, Şeyh Allâme Kâdî Ahmed b. Mustafa b. Halil'in (ö. 958/1551) mirasla ilgili bir kısım meseleleri kısa bir metinle sunduğu şerhiyle birlikte bulunan“Metnü'l-ferâiz”kitabının tahkik, incelenmesi ve araştırılmasıyla ilgilidir. Bu şerhin önemi, es-Sirâciye ve şerhinin müellifi Siracüddin es-Secevandî, Şerhu's-Siraciyye'nin müellifi Şerif el- Cürcânî, İbn Kemal Paşa gibi bu alandaki âlimlerin önemli görüşlerini içermesindendir. Ayrıca sahabe, tabiîn ve hukukçuların sözleriyle desteklenerek bu konuyla ilgili en önemli fıkıh tercihlerini ve seçimlerini de ihtiva etmektedir. Çalışma iki el yazması nüshaya dayanarak hazırlanmıştır. Çalışma Kâdî Taşköprizâde'nin kişisel ve ilmî biyografisini, onun döneminde yaşayan önemli şahsiyetleri, yaşadığı dönemin özelliklerini, içinde gerçekleşen olayları ele alırken betimleyici tarihsel yaklaşım takip edilmiştir. Tahkik kısmında yazma nüshaların karşılaştırarak okunması ve farklılıkları, zıtlık değerlendirme yöntemi kullanılmıştır. Bu farklılıklara yorum yapmadan dipnotta yer verilmiştir. Ayrıca Kur'an ayet numaralar tespit edilerek ve Hz. Peygamber hadisleri temel kaynaklardan yerleri bulunarak dipnota yazılmıştır. Araştırmanın sonunda elde edilen en önemli sonuç şudur; şerhi yapılan konularda müellif önce Hanefi mezhebi sonra diğer mezhep âlimlerinin görüşlerini zikretmeye özen göstermiştir. Bu görüşleri de Kur'an, sünnet, icma ve sahabe ve tabiînin sözlerinden delil ve hüccetlerle desteklemiştir. Müellifin taassuptan uzak olduğu ve kendi mezhebini üstün tutmadığının göstergesi isabetli olması muhtemel meselelerde diğer mezhepleri tercih etmesidir. Bu da onun engin bir kültür ve ileri seviyede bilgiye sahip olduğuna işaret eder. Müellif birçok konuya değinmiştir. Hamileliğin azami süresinin iki yıl olduğu ve hünsanın iki paydan daha azına sahip olması gerektiği şeklinde tercihte bulunmuştur. Ölüm tarihi bilinmeyen ve birbirine miras bırakamayıp yaşayan vârislerine mirasları kalanlarla ilgili hükümlerde boğulma, göçük altında kalma, yangın ile ölenler konusunda fetvayı cumhurun görüşüne göre vermiştir."
