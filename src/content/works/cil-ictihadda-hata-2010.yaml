abstract: "İctihad, karşılaşılan bir soruna İslam Hukukunun prensipleri ışığında, temel kaynaklardan çözüm bulabilmek amacıyla gösterilen çabaların tamamını ifade eder.İctihad faaliyetinin belli oranda öznellik taşıması, aynı sorun hakkında farklı çözümlere ulaşılabilmesini mümkün kılar. Bu durum da, ictihadla ulaşılan çözümlerden birinin mi, yoksa her birinin mi doğru olacağı tartışmasına yol açmıştır. Zamanla teorik bağlantılar ve derinlikler de kazanan bu tartışma farklı bir çok disiplin yanı sıra Fıkıh Usûlünde de ele alınıp incelenmiştir.`İctihadda Hata-İsabet Tartışması' başlıklı bu çalışmada, söz konusu tartışma ile bağlantılı hususlar her yönüyle ele alınmaya ve genel bir biçimde ortaya konulmaya çalışılmıştır. Ayrıca fıkıh usulü tarihinin önemli bir döneminde telif edilen ve ilgili literatürün kaynakları arasında gösterilen bir eserin de bu tartışma bağlamında örnek incelemesi yapılmıştır.Hata-isabet tartışması farklı anlayış ve kaygılar etrafında şekillenmiş ve geniş bir yelpaze oluşturacak şekilde farklılaşmış görüşlerin bulunduğu bir konudur. Tartışmayla bağlantılı ve fakat İslam alimlerinin büyük çoğunluğu tarafından benimsenmediği için sınırlı sayıda taraftara sahip bazı uç görüşler ayrı tutulursa, tartışmada iki temel yaklaşımın bulunduğu görülür. Bu yaklaşımlar arasındaki farklılıklar da uzlaştırılamaz nitelikte değildir. Tartışmanın pratiğe yansıması sürecinde her iki yaklaşım da aynı sonuca ulaştırmaktadır. Teorik yönden ise yaklaşımlar arasında bir tercih zorunluluğu bulunmamakla birlikte, ulaşılan farklı ictihadi sonuçların yalnızca birinin doğru olduğunun kabul edilmesi, tartışmanın özellikle İslami ilimlerin çeşitli alanlarındaki kabullerle tutarlılığının daha kolay izah edilebilmesine imkân sağlamaktadır."
