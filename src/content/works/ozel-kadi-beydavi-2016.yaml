abstract: "Kâdî Beydâvî'nin fıkıh usûlü görüşlerinin açıklanmaya çalışıldığı bu çalışma, bir giriş ve altı bölümden oluşmaktadır. Giriş bölümünde Beydâvî'nin yaşadığı asır ve mekân hakkında bilgi verildikten sonra hayatı ve ilmî kişiliği konuları ele alınmıştır. Birinci bölümde fıkıh usûlü ilmi hakkında genel bilgiler verildikten sonra Minhâcu'l-Vusûl adlı eserin kaynakları belirtilmiştir. İkinci bölümde hüküm ve unsurları konusu ele alınmıştır. Üçüncü bölümde istinbât metodları hakkında müellifimizin görüşleri belirtilmiştir. Dördüncü bölümde fıkhın delilleri konusu aslî ve fer'î deliller olarak tasnif edildikten sonra ele alınıp işlenmiştir. Beşinci bölümde teâdül ve tercîh konularına yer verilmiştir. Altıncı bölümde ise Beydâvî'nin ictihâd ve iftâ konuları hakkındaki görüşlerine yer verilmiştir. Çalışmamızda şu sonuçlara ulaştık: Beydâvî'nin Minhâcu'l-Vusûl adlı eseri, yalnızca et-Tahsîl'in bir muhtasarı değil, Beydâvî'nin kendi özgün tercihlerinin de yer aldığı, mütekellimîn metodu fıkıh usûlü anlayışını tam ve özlü bir şekilde yansıtan, usûl meselelerinin cedel yöntemiyle ele alındığı, tarafların delillerine yer verildiği kısa ve özlü bir usûl eseridir."
