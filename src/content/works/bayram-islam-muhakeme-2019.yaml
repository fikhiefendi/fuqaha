abstract: "Usul hukuku, İslam hukukunun teşekkül devrinden itibaren tafsilatlı olarak ele alınmıştır. Böylece İslam muhakeme hukukuna dair geniş bir literatür oluşmuştur. Tezde, İslam muhakeme hukukunun önemli konularından biri olan tenâkuz doktrini konu edilmektedir. Ayrıca tenâkuz doktrinine benzer bir müessese olan İngiliz hukukundaki estoppel doktrini de ele alınmaktadır. Bu iki doktrin arasındaki irtibat üzerinde durulup, aralarında bir karşılaştırma da yapılmaktadır. Tenâkuz ele alınırken, klasik fıkıh kitaplarına müracaat edilmekle beraber Osmanlı Devleti'nin son devrinde kaleme alınan kitap ve risaleler de kullanılmıştır. Özellikle estoppel ile tenâkuz arasındaki irtibatın izleri ilk olarak Mecelle-i Ahkâm-ı Adliye'nin İngiliz hâkimler tarafından yapılan İngilizce tercümelerinde tespit edildiğinden, Mecelle ve şerhlerine sıklıkla müracaat edilmiştir. Tez, tenâkuz-estoppel irtibatı üzerine yapılan ilk çalışmadır. Bu haliyle tez, mukayeseli medeni usul hukuku sahasında bir çalışma olarak da kabul edilebilir."
