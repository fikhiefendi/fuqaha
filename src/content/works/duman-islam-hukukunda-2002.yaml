abstract: "İnsanlar, yaşadıkları sürece pek çok rol üstlenmektedirler. Nitelikleri ve etkileri farklı olan bu rollerin hepsi de önemlidir. Annelik de bu rollerden birisidir. İslâm hukuku insanların hayatlarının her dönemiyle ve taşıdıkları her rolüyle ilgili hükümler koymuştur. Anne hakkında vaz edilen hükümler, annenin, anne olmasından önce başlayan, hamileyken ve çocuğunu doğurduktan sonra da devam eden dönemleri içine almaktadır. Kadının, insan ve kadın olmasının dışında anne olması hasebiyle yerine getirmesi gereken sorumlulukları ve haklan araştırmanın kapsamını oluşturmaktadır. Araştırma, bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde, annenin tanımı, anne olmanın yolları, anneliğe engel olma ve bir annede bulunması gereken nitelikler hakkında bilgi verilmiştir. İkinci bölümde, annenin haklan ve görevleri üzerinde durulmuştur. Üçüncü bölümde, İslâm hukukunun ibadetler, aile, yargılama, ceza, devletler hususi ve miras gibi farklı branşlarında yer alan anne ile ilgili hükümler ele alınmıştır. Araştırmanın amacı, bu farklı branşlarda bulunan hükümlerin tek bir başlık altında toplamaktır. Anne ile ilgili hükümler, klasik hukuk kitaplarında tetkik edilmekle beraber, sistematik bir şekilde tek bir başlık altında ele alınmamıştır. Konu, İslam hukukunda“neseb”.“hidâne”,“radâ”vb. ilgili bölümlerde işlenmiştir. Çağdaş İslâm hukuku çalışmalarında ise, konu ya klasik usulde olduğu gibi ya da ansiklopedi maddesi olarak ele alınmıştır. Araştırmanın diğer bir amacı da, annenin, insan hayatındaki yerine ve önemine dikkat çekmektir. Araştırmada öncelikle İslâm hukukunun ilk kaynaklarına müracaat edilerek veriler toplanmıştır. Konu ile ilgili meseleler ele alınırken genellikle meşhur hukuk ekolleri; Hanefî, Maliki. Şafiî ve Hanbelî mezheplerinin görüşleri mukayeseli olarak verilmiştir. Ayrıca İslâm hukuku kaynaklarının dışında diğer modern ve klasik kaynaklardan da yararlanılmıştır. Daha sonra elde edilen bilgiler bilimsel olarak ele alınıp isabetli görüşlere ulaşılmaya çalışılmıştır. Araştırmanın sonucunda görülmüştür ki, anne ile ilgili hükümler, İslâm hukukunda hayli yekûn teşkil etmekte ve bu konu İslam hukukunun hemen hemen her alanını ilgilendirmektedir. İslâm hukuk doktrininde anneye hakiki ve mecazi anlamlar yüklenmiş, anne ile ilgili hükümler çocuk doğurmadan önce başlamış, annenin kocası ve çocukları, çocuğun annesi üzerinde bir takım haklara sahip olduğu görülmüştür. Kadının, anne olması hasebiyle İslâm miras, ceza, yargılama, devletler hususi hukukunda ve ibadetlerde farklı hükümlere tâbi olduğu tespit edilmiştir. Ayrıca anneliğin çok önemli bir vasıf ve hiçbir şekilde ihmale gelmemesi gereken bir konu olduğu sonucuna da varılmıştır."
