abstract: "Bu araştırmanın amacı, Osmanlı döneminde Samsun'da kurulan vakıfları çeşitli yönleriyle inceleyerek ortaya koymaktır. Çalışmanın temel kaynakları şer'iyye sicilleri ve Vakıflar Genel Müdürlüğü Arşivindeki belgelerdir. Coğrafi olarak araştırmanın çerçevesi, Canik sancağının Samsun ili sınırları içerisinde kalan bölgesidir. Beş bölümden oluşan çalışmanın giriş kısmında konu, yöntem, kaynaklar, Samsun'un kısa tarihi ve genel olarak vakıflar hakkında bilgi verilmiştir. Birinci bölümde Samsun'da kurulan vakıfların kimler tarafından hangi amaçla kuruldukları ve hangi akarların bunlara bağlandıkları incelenmiştir. İkinci bölümde vakıfların Samsun'daki coğrafi ve kronolojik dağılımı, üçüncü bölümde vakıf kuran kişilerin sosyal statüleri, dördüncü bölümde Samsun'daki vakıfların ekonomik yapısı, beşinci bölümde ise vakıfların hizmet amaçları ele alınarak değerlendirilmiştir.Sonuç olarak Samsun'da iki yüz seksen dokuz vakfiyede, başta dini hizmet ve kurumlar olmak üzere, eğitim, sağlık ve sosyal ve belediye hizmetleri alanında toplam sekiz yüz doksan yedi hizmet şartı tespit edilmiştir."
