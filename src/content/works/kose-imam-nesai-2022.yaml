abstract: "İslâmiyet'in ilk zamanlarından itibaren Hz. Peygamber'in hadisleri gerek hafızalara kazınmak gerekse kaleme alınmak suretiyle korunmaya gayret edilmiştir. Çünkü Hz. Peygamber'in bütün davranışları hayatın her devrinde odak noktası olmuştur. Özellikle Hadis ilminin ortaya çıkma aşaması ile tedvin ve tasnif dönemlerinde pek çok eser türü yazılmıştır. Bu eser türlerinden en önemli olanı da şüphesiz sünen adlı eserlerdir. Sünen türü eserlerin başında ise hafızalara Nesâî'nin kaleme almış olduğu“Sünen”adlı eser gelmektedir. Zira söz konusu telif, İslami ilimler içerisinde çok önemli bir paya sahiptir. Kütüb-i Sitte içerisinde zikredilmesi bu tezi desteklemektedir. Ayrıca bu eserin başta Hadis ve Tefsir ilmine katkısı olduğu kadar Fıkıh ilmine de katkısı yadırganmayacak kadar ehemmiyetlidir. İmam Nesâî ismi geçen eserinde sadece hadis rivayetinde bulunmamış, aynı zamanda yer yer bazı meselelerde fıkhi düşüncelerini de açıklamıştır. Bu çalışmamızda Sünen adlı eserde konunun sınırlandırılması adına İmam Nesâî'nin nikâh, alışveriş ve zînet meseleleri üzerine ileri sürdüğü hükümlere değinilmiştir. Ayrıca söz konusu bu hükümleri diğer mezheplerle mukayesesi yapılmıştır."
