abstract: "Bu tez, Giriş, Üç Bölüm, Sonuç ve Kaynakçadan oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir. Birinci bölümde, Burhâneddîn Merginânî hakkında ve araştırmanın kaynağı olan eseri el-Hidâye hakkında bilgi verilmektedir. İkinci bölümde, şer'î deliller arasında teâruzun vukuunun imkanı ve sebepleri açıklandıktan sonra, hadisler arasındaki teâruz konusu incelenmektedir. Mezheplerin hadisler arasındaki teâruza yaklaşımları, çözüm yolları ve kullandıkları yöntemler olan nesih, tercih, cem'/te'lif ve tevakkuf/tesâkut hakkında bilgi verilmiş, alimlerin bu yöntemlerin kullanırken nasıl bir sıralamalarıya göre tatbik ettikleri incelenmiştir. Üçüncü bölümde, hadisler arasındaki teâruzu giderme yöntemlerinin Merginânî tarafından el-Hidâye eserinde nasıl tatbik edildiği örnekler üzerinden incelenmiş, o yöntemler özelliklerine göre sınıflandırılmış ve değerlendirilmiştir."
