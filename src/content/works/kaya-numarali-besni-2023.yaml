abstract: "Tarihî olay ve olgulara sahne olan bölgelerde bir tarihçinin bilimsel araştırma yaparken temel kriterleri belgelerdir. Belgeler tarihçinin pusulasıdır. Tarihçinin bu belgeler ışığında olaylar arasında sebep-sonuç ilişkisi kurarak çıkarımlar yaptığı ve insanların geleceğe daha güvenle bakabilmesine olanak sağladığı düşünülmektedir. Transkripsiyon ve değerlendirmesi yapılan 187 Numaralı Besni Şer'iyye Sicili ile bölgenin ekonomik, kültürel ve demografik hayatı hakkında önemli bilgilere ulaşma imkânına sahip olunabilir. Gayrimüslim ve Müslüman ahalinin birbirlerine vekillik ve şahitlik yaptıkları, Osmanlı Devleti'nin şer'iyye mahkemelerinde tutulan mahkeme kayıtlarına yansıdığı görülmektedir. Ayrıca gayrimüslimlerin Ermeni Mahallesi, Hristiyan Mahallesi gibi kendilerine has yerleşim alanları kurdukları da mahkeme kayıtlarına yansımıştır. Yine Osmanlı Devleti'nin nakit ihtiyacını karşılamak için uyguladığı iltizam sisteminin 187 Numaralı Besni Şer'iyye Sicili'nde geçen 81 karyede uygulandığı görülmektedir. Ayrıca bu sistemin mültezim çıkarlarına alet edildiği, mahkeme kayıtlarına yansıyan şikâyetlerden çıkarılmaktadır. Ayrıca şer'iye sicilinde iltizam sistemini, alt mültezimleri, devletin mültezimlere sağladığı ödeme kolaylıkları, köy ve mahalle isimlerini, vergi sistemlerini ve ve yapılan usulsüzlükleri, Osmanlı Devleti'nin sefer güzergâhında bulunan yöre halkına uyguladığı vergilendirme sistemi örneklerine ve memur olarak atanan kişilerin görevlerini devam ettirmek için gösterdikleri kefilleri görmekteyiz."
