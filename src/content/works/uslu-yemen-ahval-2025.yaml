abstract: "Lozan Antlaşmasıyla Yemen, Osmanlı toprağı olmaktan çıkarılmış, kuzey ile güney olarak ikiye ayrılmıştır. Kuzey Yemen, Zeydî emirliği yönetiminde Yemen Arap Cumhuriyeti'ni kurarken; Güney Yemen, İngiliz himayesi altında kalmış, İngilizlerin çekilmesiyle Yemen Demokratik Halk Cumhuriyeti kurulmuştur. Kuzey Yemen, 3/1978 sayılı Ahvâl-i Şahsiyye Kanunuyla, Güney Yemen 1974 tarihli Ahvâl-i Şahsiyye Kanunuyla yönetilmiştir. 1990 yılında Kuzey ve Güney Yemen birleşmiştir. 1992 yılında Yemen Ahvâl-i Şahsiyye Kanunu çıkarılmıştır. Mevcut Yemen Ahvâl-i Şahsiyye Kanunu Zeydiyye mezhebinin temel kaynaklarından beslenmektedir. Çalışmamızda Yemen Ahvâl-i Şahsiyye Kanununda evlilik birliğinin sona ermesiyle ilgili bahislerde Zeydî fıkıh anlayışına bağlı kalınan noktalar ve farklılaşan alanlar tespit edilmektedir. 1992 yılında çıkarılan, 1998, 1999, 2003 yıllarında değişikliğe uğrayan Yemen Ahvâl-i Şahsiyye Kanunu ile Zeydiyye mezhebinin görüşleri mukayese edilmiştir. Çalışmamızda Zeydiyye mezhebinin temel eserlerinden faydalanılmıştır. Yemen Ahvâl-i Şahsiyye Kanununun hukuki kaynakları incelenmiştir. Çalışmanın temel bulguları arasında şunlar bulunmaktadır: Kanun oluşturulurken Zeydiyye mezhebinden faydalanıldığı gibi telfîk yöntemine de başvurulmuştur. Gerektiğinde yeni ictihadlar yapılmıştır. Zamanın değişmesiyle hasıl olan yeni ihtiyaçlar, ortaya çıkan yeni durumlar doktrindeki klasik hükümlere bağlı kalmayı zorlaştırmaktadır. Tek bir mezhebe bağlı kalmaya çalışmak İslam hukukun günümüze tatbikini zorlaştırmaktadır. Bu nedenle kanunun çağa ve toplum yapısına uygun, maslahatı önceleyen, olası olumsuzlukları ve oluşabilecek mağduriyetleri engelleyen, telfîkten ve ictihadî hükümlerden yararlanan maddelerden oluşması kaçınılmazdır. Araştırmamız giriş, sonuç ve üç ana bölümden oluşmaktadır. İlk bölümde Yemen Aile Hukuku alanında yapılan kanunlaştırmaların tarihçesi ele alınmış, ikinci bölümde evlilik birliğinin sona ermesi, üçüncü bölümde evlilik birliğinin sona ermesinin sonuçları değerlendirilmiştir."
