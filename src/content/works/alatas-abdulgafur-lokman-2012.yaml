abstract: "Türkiye'deki farklı kütüphanelerden ulaşabildiğimiz on beş adet nüshası bulunan Abdülğafûr b. Lokman el-Kerderî'nin Hayretü'l-fukahâ adlı eseri üzerinde yaptığımız bu çalışma giriş, üç bölüm, sonuç ve kaynakçadan oluşmaktadır. Birinci bölümde el-Kerderî'nin hayatını ve eserlerini tanıtıp, Hanefi fıkhındaki yerini belirlemeye çalıştık. Eserin tahliline ayrılan ikinci bölümde; Hayretü'l-fukahâ'nın Hanefi fıkhındaki yeri, Hayretü'l-fukahâ'da ele alınan konular, Hayretü'l-fukahâ'da kullanılan yöntem ve Hayretü'l-fukahâ'da faydalanılan kaynaklar hakkındaki çalışmamız yer almaktadır. Üçüncü bölüm ise iki ana kısımdan oluşmaktadır. Eserin tahkikini içeren birinci ana başlıkta Hayretü'l-fukahâ'nın elimizdeki mevcut nüshaların tanıtımı, tahkikte izlene metot ve tahkikli metin yer almaktadır. İkinci ana kısımda ise Hayretü'l-fukahâ'nın tercümesi bulunmaktadır. Tezimiz sonuç ve kaynakça ile sona ermektedir."
