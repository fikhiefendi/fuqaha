abstract: "حمد اهلل تعالى أوالً عمى ما أنعـ عمي مف نعمو الكثيرة ومنيا إتماـ ىذه الرسالة، و ما كنت ألىتدي ليذا لوال أف ىداني اهلل تعالى. ثـ أشكر أساتذتي الذيف أفادوني ودرسوني في حياتي العممية، فجزاىـ اهلل عني خير الجزاء، وتقبؿ اهلل جيودىـ لرضاه. وأخص بالشكر أساتذي الذيف أفادوني و درسوني في مرحمة الماجستير في كمية الشريعة في جامعة اليرموؾ، والذيف كاف ليـ أثر كبير في حياتي العممية. وأخص منيـ أوالً مشرفي فضيمة األستاذ الدكتور محمد محمود طبلفحة الذي كاف نعـ المشرؼ، وكاف خير معيف لي في إتماـ ىذه الرسالة، فجزاه اهلل عني خير الجزاء وبارؾ في عمره وعممو. وكذلؾ أشكر فضيمة األستاذ الدكتور عبد الجميؿ زىير ضمرة عمى ما أسدى إلي مف توجيياتو القيمة في إعداد ىذه الرسالة، فجزاه اهلل عني خير الجزاء، وأنعـ عميو ببركة العمر والعمـ."
