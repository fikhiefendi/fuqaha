abstract: "Konya Şer'iyye Sicilleri'nde 18. yüzyılın ikinci yarısında yer alan kadınların miras meselelerinin incelendiği bu tezde kadın ve miras konusu; hibe, sulh ve tehârüc, mehir, ketm ve ihfâ, vasiyet, vesâyet, mûris muvâzaası, zürri vakıflar, örfi intikalde kadın gibi başlıklar altında incelenmiştir. Tezin amacı kadının miras konusunda yaşadığı haksızlıklara tarihten bir pencere açmak ve günümüzdeki problemlere de ışık tutmaktır. Öncelikle Osmanlı miras hukukunun şer'î ve örfi hukuku kapsaması nedeniyle, Osmanlı hukuk sistemi tanıtılmıştır. Osmanlı miras hukukunda kadının şer'î ve örfi miras hukukundaki durumu anlatılarak teorik bağlamda kadının mirası konuları ile ilgili bilgi verilmiştir. Araştırılan dönemde sicillerde yer alan belgeler ışığında kadının miras meseleleri incelenmiş ve erkek çocuklarına yapılan hibelerin kız çocuklarına yapılan hibelerden daha fazla olduğu tespit edilmiştir. Ayrıca kadınların tehârüc ve sulh yoluyla terikedeki haklarından başka mallar almak suretiyle sıklıkla ayrıldıkları fark edilmiştir. Bazı belgelerde kadınların terikedeki haklarından daha az malla ayrıldıkları net bir biçimde görülmektedir. Mehrin, miras belgelerinde dava konusu olduğu görülmektedir. Yakınlarının mehrini terikeden isteyen vârisler, kocasının ölümüyle terikeden mehir hakkını isteyen kadın veya mehrinin miktarını ispatlayan ve terikeden olmadığını göstermeye çalışan kadın örnekleri belgelerde yer alır. Tezin sonunda kısaca kadının miras meseleleri ile ilgili fetvalar dönemin sıklıkla kullanılan fetva mecmualarından derlenmiştir. Tarih boyunca gerek hukuk sistemlerinde gerekse dinlerde kadınların miras hakları konusunda bilgiler yer almaktadır. Bu hakların pratik anlamda uygulanıp uygulanmadığı halkın gelişmişlik seviyesi ve hukukun işlerlik kazanıp kazanamadığı ile ilişkilidir."
