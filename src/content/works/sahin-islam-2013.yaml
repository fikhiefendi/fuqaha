abstract: "İslam Hukuku ve Biyoetik (Sorumluluk ve Özerklik Ekseninde Biyoetik Tartışmalar) adlı tez, günümüzde tartışılan biyoetik ikilemlere İslam hukukunun metodolojik yaklaşımını ortaya koymayı amaçlayan bir çalışmadır. Bu nedenle tez iki bölümde tasarlanmıştır. Birinci bölümde, biyoetiğin, tıbbi gelişmelerin ortaya çıkardığı ikilemlere ilke temelli yaklaşımı ve bu ilkelerden özerklik ilkesinin evrensellik boyutunun tartışılması. İkinci bölümde, İslam hukukunun, biyoetik ikilemlere metodolojik yaklaşımı ve bu yaklaşımda öne çıkan ikilemlerin sorumluluk merkezli değerlendirilmesi. Tez, teori ve pratiği bir araya getirmesi ve disiplinler arası karşılaştırmalı bir yöntem izlemesi yönü ile alanında yapılan önemli bir çalışma olarak kabul edilebilir."
