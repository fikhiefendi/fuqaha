abstract: "Bu çalışma el-Hârisî'nin hayatını ve Müsnedü Ebî Hânîfe adlı eserinin hadis ilmi açısından değerlendirilmesini konu almaktadır. İlk dönemlerden itibaren Ebû Hanîfe'nin rivâyetlerini cem etme amacıyla ortaya konulan ve Müsnedü Ebî Hanîfe adıyla derlenen birçok eser bulunmaktadır. Özellikle de Hanefî mezhebi âlimleri tarafından yapılan bu derlemeler hicri ikinci yüzyıldan itibaren telif edilmiş ve sonraki dönemlerde yapılan ilmî çalışmalara konu olmuştur. İlk dönemlerde Ebû Hanîfe'nin rivâyetlerini toplayan bu eserlerin oluşmasında özellikle Hanefî mezhebinin reyi öncelediği, az hadis bildikleri gibi iddialara önemli bir yer tutmaktadır. Bu bağlamda el-Hârisî'nin derlemiş olduğu Müsnedü Ebî Hanîfe adlı eser hem erken dönemde oluşturulması hem de sonraki dönemlerde derlenenlere kaynaklık etmesi açısından Ebû Hanîfe müsnedleri arasında öne çıkmaktadır. Bu çalışmanın birinci bölümünde öncelikle el-Hârisî'nin yaşadığı dönem, hayatı ve ilmî kişiliği incelenmiş, el-Hârisî hakkındaki eleştiriler değerlendirilmiştir. İkinci bölümde ise öncelikle bir tür olarak Müsned incelenmiş, bu türün el-Hârisî'ye kadarki örnekleri verilmiştir. Ardından kısaca Ebû Hanîfe'nin hayatı ve ilmî kişiliğine değinilmiştir. Son olarak ise el-Hârisî'nin Müsnedü Ebî Hanîfe adlı eseri hadis ilmi açısından incelenmiştir."
