abstract: "Osmanlı Devleti pek çok alime ev sahipliği yapmış ve pek çok eserin üretilmiş olduğu bir ilim merkezi olmuştur. On beşinci asırda yaşamış ve üzerine yeterince çalışma yapılmamış olan Molla Gürânî çeşitli ilim dallarında eser üretmiş bir Osmanlı alimidir. Eğitimine küçük yaşlarda başlamış, muhtelif ilim merkezlerinde ünlü isimlerinden ilim tahsil etmiştir. II. Murad döneminde Osmanlı'ya gelen Gürânî, burada ilmî zekasıyla kendisini padişaha sevdirmiş ve önemli medreselerde müderrislik yaptıktan sonra padişahın oğlu II. Mehmed'e hocalık yapmış; Fatih Sultan Mehmed'in İstanbul'u fethetmesinde fikrî ve manevî destekte bulunmuştur. Osmanlı Devleti'nde kadılık, kazaskerlik ve şeyhülislamlık gibi görevlerde bulunan Molla Gürânî üzerine yapılan çalışmalarda onun fakih yönüne değinilmemektedir. Bu tezde, bir Osmanlı alimi olan ve fıkıh ile bu kadar alakalı mesleklerde görev almasına rağmen bu yönü yeterince çalışılmayan Gürânî ele alınarak fıkıh ilmi açısından alandaki boşluğun doldurulması amaçlanmaktadır. Bu amaçla iki bölümden oluşan bu tezin birinci bölümünde Molla Gürânî'nin hayatı, tahsili, tedrisi, yapmış olduğu görevleri, öğrencileri, eserleri ve kurmuş olduğu vakıflarından bahsedilmekte; ikinci bölümde onun füru fıkha dair görüşleri aktarılmaktadır. Bu maksatla Molla Gürânî'nin, üzerine yapılan çalışmalarda eksik bırakılan füru fıkıh görüşleri, onun yazmış olduğu tefsiri Gâyetü'l-emânî fî tefsîri'l-kelâmi'r-rabbânî ve Buhârî şerhi el-Kevserü'l-cârî alâ riyâzi'l-buhârî'den elde edilen bilgiler doğrultusunda tespit edilmekte ve görüşleri modern hukuka uygun başlıklar altında tasnif edilmektedir. Ayrıca Osmanlı Devleti'ne geldikten sonra kaynaklarda Hanefi mezhebine geçtiği aktarılan Molla Gürânî'nin mezkûr eserlerde bazı konularda Şâfiî'nin görüşlerini tercih etmesi ve Ebu Hanife'nin görüşlerini eleştirmesi dikkat çekmektedir."
