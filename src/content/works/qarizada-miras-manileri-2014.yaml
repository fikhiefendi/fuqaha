abstract: "“Miras manileri arasında yer alan faktörlerden din farkı”adlI çalışmamızın amacı sahabe döneminden itibaren bu konuyla ilgi farklı ictihadları ortaya koymak ve delil bakımından en güçlü olanı tercih yapmaktır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş Kısmında konuyla ilgili kaynakların tesbiti, mirasin tarihçesi, din kavramı, inanç ve ülke açısından insanların tasnifi konuları incelenmiştir. Birinci Bölümde mirasın kavramsal çerçevesi başlığı altında mirasın rükün, sebep ve manileri incelenmiştir. İkinci bölümde ise din farkının mirasla ilgili hükümleri başlığı altında müslümanlar ile gayri müslimler arasındaki tevarüs, farklı dinlere mensup olan gayri müslimler arasındaki tevarüs ve mürtedle başkaları arasındaki tevarüs konuları incelenmiştir. İslâm hukukçulari gayri müslimin müslümana mirasçı olamaması konusunda icmâ etmişlerdir. Müslümanın gayri müslime mirasçı olup olmaması konusunda ihtilaf etmişlerdir. Cumhur müslümanı gayri müslime mirasçı kılmazken; azınlıkta kalan İslâm hukukçuları müslümanı gayri müslime mirasçı kılmıştır."
