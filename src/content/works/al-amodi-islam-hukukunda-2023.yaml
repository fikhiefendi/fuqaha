abstract: "Dünya genelinde karmaşıklığın artmasıyla birlikte, bu karmaşıklıklardan kaynaklanan riskler, kazalar ve hasarlar da artmıştır. Bu nedenle insanların güvende hissetme ve korunma ihtiyacı artmıştır. Sigorta ilk olarak, 14. yüzyılda Avrupa'da geleneksel sigorta sistemi olarak ortaya çıkmış, daha sonra sigorta sözleşmeleri İslâm toplumlarına da girmiş ve sigorta sözleşmesi bu İslâm toplumlarında yeni bir sözleşme olarak kabul edilmiştir. Bu alandaki araştırmalar halen devam etmektedir ve sigorta her yönüyle hukuki, dini, analitik, eleştirel, teknik ve ekonomik olarak incelenmeye devam edilmektedir. Günümüzde sigorta zorunlu hale gelmiştir. Otomobil kazalarına karşı sigorta, üçüncü şahıslara karşı sorumluluk sigortası ve yangın gibi risklere karşı sigorta gibi birçok alanda sigorta zorunlu hale gelmiştir. Sigorta sistemi tanımlanmış ve tarihçesi incelenmiştir; bu, sigortanın temellerini ve tarihsel gelişimini anlamak için yapılan bir genel bakıştır. Sigortanın, yasal bir çerçeveye nasıl evrildiği de incelenmiştir. Ayrıca, sigorta birçok türe ayrılmıştır ve çalışma, geleneksel sigorta ve İslâmi sigorta (kooperatif) olarak bilinen Tekâfül gibi türlerine odaklanılmıştır. Bu iki sigorta türü arasındaki benzerlikler ve farklılıklar incelendiğinde, sigorta kontratının yönleri diğer şer'i (kanuni) ve gayri şer'i (kanuna aykırı) kontratlarla karşılaştırıldı. İslâm hukuku, sigorta kontratının yönleri ve diğer şer'i ve gayri şer'i kontratlarla benzerlikleri üzerine yapılan incelemeler sonucunda sigortanın meşruiyetine dair görüşe ulaşmıştır. İster geleneksel olsun isterse İslâmi olsun, her türde sigortanın temelinde önemli bir unsur olarak menfaat bulunmaktadır ve menfaat olmadan sigorta kontratı geçerli değildir. Ayrıca, sigortacının sigortalıya olan yükümlülükleri de bulunmaktadır. Tehlike kavramı da sigorta anlayışının ayrılmaz bir parçasıdır, çünkü tehlikedeki potansiyel riskler nedeniyle sigorta sistemi ortaya çıkmış ve güvenliği yaymak amacıyla (tehlikelere karşı) sigorta kontratı oluşturulmuştur. Sigorta sistemi tanımlandı ve tarihçesi incelendi; bu, sigortanın temellerini ve tarihsel gelişimini anlamak için yapılan bir genel bakıştır. Bu inceleme, sigortanın yasal olarak nasıl şekillendiğini anlamak amacıyla gerçekleştirilmiştir. Sigortanın unsurları açıklandı ve farklı türlere ayrıldı; çalışmada özellikle geleneksel sigortayla bilinen ticari sigorta ve İslâmi sigorta (kooperatif) olarak bilinen Tekâfül'e odaklanıldı. Ayrıca, bu iki sigorta türü arasındaki benzerlikler ve farklılıklar incelendi. İslâm hukukuna olan uygunluğu incelemek amacıyla, sigorta kontratının yönleri ve diğer şer'i (kanuni) ve gayri şer'i (kanuna aykırı) kontratlarla benzerlikleri üzerine yapılan incelemeler sonucunda İslâm hukukunun sigortanın meşruiyetine dair görüşü belirlendi. Bu görüş, alanında uzman bilim adamları ve hukukçuların da görüşleriyle desteklenmiştir."
