abstract: "Bu araştırma, İslâmî mali sistemde adalet kavramını ele almaktadır. Araştırma, Irak'taki zekât uygulamasını, adaletin gerçekleştirilmesindeki etkinliğini ölçmeye yönelik uygulamalı bir örnek olarak incelemektedir. Araştırma, zekâtı düzenleyen açık ve kurumsal bir yasal-çerçevenin bulunmamasının, gerek devlet gerekse toplum düzeyinde zekâtın etkin biçimde uygulanamamasına yol açtığını ortaya koymaktadır. Bu çerçevede çalışma, Irak'taki zekât sisteminin mali adaleti gerçekleştirme kapasitesini sorgulamaktadır. Zekâtın, makâsıdü'ş-şerîa ve çağdaş gerçekliğin değişkenleriyle uyumlu biçimde etkinleştirilmesi için gerekli şart ve gereklilikleri tespit etmeyi amaçlamaktadır. Araştırmada betimleyici-analitik ve tümevarımsal yöntemler esas alınmıştır. Ayrıca zekât sandıklarında görev yapanlar ile bu sandıklardan yararlananlara uygulanan bir anket aracılığıyla saha araştırması yöntemi kullanılmıştır. Elde edilen bulgular, örneklemin önemli bir kısmının Irak'ta zekâtın yönetiminden sorumlu merkezi bir otoritenin bulunmadığı kanaatini taşıdığını ortaya koymuştur. Bunun yanında bazı katılımcılar, zekâtın ülkedeki yoksulluğun boyutlarıyla orantılı biçimde yasal ve kurumsal düzeyde etkinleştirilmediğini ifade etmişlerdir. Katılımcıların önemli bir bölümü ise, zekâtın kurumsal bir çerçevede etkin biçimde uygulanmasının toplumsal sınıflar arasındaki mali uçurumun azaltılmasına katkı sağlayabileceğini belirtmiştir. Araştırma, zekâtın bağımsız bir hukuki çerçeveye dayalı olarak kurumsal düzeyde etkinleştirilmesi hâlinde, adalet ve ekonomik dengeyi gerçekleştirmede somut mali ve iktisadî etkilere sahip bir araç olabileceği sonucuna ulaşmıştır. Bu bağlamda araştırma; zekâtın yönetiminden sorumlu resmî ve ulusal bir kurumun tesis edilmesini, çağdaş ihtiyaçlara cevap veren mevzuatın oluşturulmasını, toplumsal farkındalığın güçlendirilmesini ve zekât gelirlerinin geçici ve tüketim odaklı harcamalar yerine, üretken ve sürdürülebilir kalkınma projeleriyle ilişkilendirilmesini önermektedir."
