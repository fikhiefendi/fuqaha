abstract: "Üzerinde çalıştınız 6 numaralı Halep şer'iyye sicili Şam'da“merkezi vesaiki tarihîye”'de mevcuttur. Belge 995-999 H-1587-1591 M, tarihlerine aittir. Toplam 362 sayfa ve 1512 adet belgeden oluşan 6 numaralı şer'iyye sicilinin 201-280 sayfa arası,ArapçadanTürkçe 'ye çevrildi. İçinde bulunan 3 belge Osmanlıcadır. Konular mucip-i Gılman, katil davası, tımar satışı üzerinedir. Bu belgeler üç kısımda incelenmiştir: Bu belgelerde; sosyal yapı, evlilik, boşanma ve nafaka hakkında bilgi verilmektedir. Mehr-i mukaddem miktarları 80 dînâr ile 120 dînâr arasında değişmektedir. Peşin ödenen mehr-i muaccel ile genellikle sonradan ödenen mehr-i müeccelin 60-80 dinar arasında olduğu hesaplanmıştır. Kişinin sevap kazanması için cariyenin mükatebe yoluyla azat edilişi de yer almaktadır, cariye ve köle 100 - 195 dînâra satılırdı. Miras, vasi ve vekâlet hakkında da bilgi vermektedir. Halep'teki vakıflarla ilgili işlemlere ait bilgiler incelemiş olduğumuz kayıtlarda yer almaktadır. İslam hukukçuları arasında en tartışmalı konulardan biri olan vakıf gayrimenkullerinin tebdili konusunda Halep'te zorunluluk durumunda değişiklik yapılabildiği görülmektedir. Vakıf yönetimi için bir kişi tayin edilmiştir. Vakıf yöneticisine“mütevelli el-vakıf ”adı verilir, kusuru olduğunda değiştirilmesi gerekir. Ekonomik yapı, Halep parası, fiyatlar ve gayrimenkul (ev ,dükkan ,han , değirmen) gibi satışlar hakkında da bilgileri ihtiva etmektedir. Çeşitli ticari işlemler ve sair konularla ilgili az sayıda belge bulunmaktadır. Bu dönemde çalışanların günlük -aylık olarak kaç para aldığından da bahsedilmiştir. İmamlık, mütevellilik ve çeşitli çalışanların günlük 1 – 96 osmani akçe arası ücret aldığını görüyoruz"
