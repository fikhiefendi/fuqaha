abstract: "Yüksek din öğretimi kurumlarında Temel İslam Bilimleri alanı içinde yer alan fıkıh dersleri, ilahiyat eğitiminin simge derslerinden biridir. Fıkıh dersleri, bireylere bir Müslüman olarak taşıdığı dinî-amelî sorumlulukların ve sahip olduğu hakların öğretildiği derslerdir. Bu dersler yüksek din öğretimi kurumlarında Fıkıh/İslam Hukuku ve Fıkıh Usûlü/İslam Hukuk Usûlü adı ile okutulmaktadır. Bu çalışma yüksek din öğretimi kurumlarında verilen fıkıh eğitiminin nasıllığını ve bu eğitim esnasında karşılaşılan sorunların neler olduğunu tespit ederek bu sorunlara uygun çözüm önerileri getirmeyi amaçlamaktadır. Bu araştırmaya Afyon Kocatepe Üniversitesi İlahiyat Fakültesi ve Uşak Üniversitesi İslami İlimler Fakültesi 2, 3 ve 4. sınıf öğrencileri arasından tesadüfi örnekleme metoduyla belirlenen öğrenciler katılmıştır. Veri toplama aracı olarak kullanılan beşli likert-tipi anketin güvenirliği 0.936 bulunmuştur. Elde edilen veriler frekans ve yüzde dağılımı olarak incelenmiş, bu verilere dayalı olarak yorumlanmıştır. Araştırma sonucunda fıkıh dersleriyle ilgili bazı problemler olmasının yanı sıra bu derslerin öğrenciler nazarında yüksek oranda önemli görülen ve sevilen dersler arasında olduğu görülmüştür. Fıkıh derslerinde uygulanan ölçme ve değerlendirme yaklaşımının daha çok test ağırlıklı olduğu ve yorum gerektiren sorulara yer verilmediği, derslerin işlenmesi esnasında teknolojik araçların kullanılmadığı, öğrencilerin ders ile ilgili araştırma yapmaya yönlendirilmediği tespit edilmiştir. Derslerde okutulan fıkıh ders kitaplarının üslubu ve anlaşılabilirliği konusunda, derslerde farklı görüşlere ve mezhepler arası farklılıklara yer verilmesiyle ilgili demokratik tutum konusunda, derste işlenen konuların İslâm dinini doğru yansıtıp yansıtmadığı konusunda sorunlar olduğu görülmüştür. Sonuç olarak fıkıh gibi önemli bir dersin öğretiminde tespit edilen sorunların giderilmesi, bu dersin öğretiminin bilimselleşmesi ve teoride kalmayan hayata aktarılabilen bir ders olması için din eğitimi bilimi açısından önerilerde bulunulmuştur."
