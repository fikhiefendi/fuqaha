abstract: "Bu çalışmada Hz. Peygamber'in fiillerinin, ümmeti için bağlayıcılığı konusu, klasik dönem hanefî fıkıh usulü eserleri çerçevesinde araştırılmıştır. Bu bağlamda, fıkıh usulü literatüründe tartışılan konu, onun hükmü bilinmeyen fiilleridir. Bunun yanında Hanefîlerin hüküm bakımından sünneti tanımlamalarının yukarıdaki yaklaşımları ile tutarlı olup olmadığı da ortaya konmaya çalışılmıştır Hanefi gelenekte ilk fıkıh usulü eseri olan el-Fusûl Fi'l-Usûl'de, konu ayrıntılı bir şekilde tartışılmıştır. Cassas Kerhî'nin görüşlerine de atıfta bulunmuştur. Hz. Peygamber'in kastı bulunmaksızın işlediği fiiller ile hataları/zelle olduğu bildirilenler, ittiba açısından dikkate alınmazlar. Bu konuda görüş birliği vardır. Hükmü bilinen fiillerinde ise, o fiili Hz. Peygamber'in işlediği vasıfla/hükümle yerine getirmeyi ittiba olarak görürler. Cassas'ın tercihine göre, Hz. Peygamber'in hükmü bilinmeyen fiillerine ancak mübah olarak ittiba edilebilir. Bu yaklaşım genel olarak sonraki Hanefi usulcüler tarafından da kabul edilmiştir. Hanefîlerin sünneti hüdâ ve zevâid olarak tanımlamaları sınırları çok net olarak belirlenmiş tanımlar olarak gözükmemektedir."
