abstract: "Habâis ve tayyibât kavramlarının kapsamına giren hususlar müslümanın hayatında son derece önemlidir. Çünkü bunlardan bir kısmı olan yiyecek ve içeceklerle beslenmekteyiz. Dolayısıyla selim fıtratımızı muhafaza etmek ve dualarımızın kabulü için habîs ve tayyib olan şeylere dikkat etmemiz gerekiyor.Yine bu hususlar günlük hayatta en çok karşılaşılan meselelerden biridir. Ayrıca gün geçtikçe bu kavramların kapsamına girebilecek yeni konular ortaya çıkmakta ve bunların yeniden değerlendirilmesi gerekmektedir. İşte bu gerekçelerle bu konuda bir çalışma yapmayı uygun gördük. Bu kavramlar hayatın her alanını kapsamaktadır. Zira güzellik veya çirkinlik her şeyde olabilecek bir sıfattır. Ancak biz çalışmamızda yiyeceklerden, bunlar içinde özellikle hayvanlardan ve içeceklerden bahsettik. Habâis sözlükte aşağı ve değersizliğinden dolayı hoşa gitmeyen çirkin şeyler, tayyibât ise nefsin ve duyguların hoşuna giden şeylerdir. Yiyecek ve içeceklerde aslolan mubah olmasıdır. Bazılarının haram olması ârızî sebeplerden kaynaklanmaktadır. Dünyada insan nüfusunun her geçen gün artması sonucu insanoğlu sanayi ve fabrikasyon tipi ürünlere ve katkı maddelerine yönelmiştir. Sanayi tipi bu ürünlerin ham maddesi bazen aslı helal ve temiz olan bir madde olurken bazen bunun tam tersi olabilmektedir. Ancak bu hammaddeden yeni bir ürün elde ederken farklı kimyasal yöntemler kullanılmakta böylece o hammadde bir değişime uğramaktadır. Bu yeni ürünün hükmü nedir? İşte bu durum fıkıh kaynaklarımızda yer alan istihâle ve istihlâk kavramlarını tekrar ele almayı gerektirmiştir."
