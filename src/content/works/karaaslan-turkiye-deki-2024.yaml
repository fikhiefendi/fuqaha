abstract: "Bu çalışma, İslami finans ekosisteminin bir parçası olan İslami sosyal finans uygulamalarından biri ve üçüncü sektörün ana faktörü olan vakıfların İslami sosyal finans üzerindeki rolü ve finans kurumlarıyla ilişkilerini analiz etmeyi amaçlamaktadır. Geçmişten gelen sağlam köklere dayalı olan vakıf kurumu ülkemizde özellikle toplumsal refah ve birlikteliğin sağlanması açısından büyük önem arz etmektedir. Ayrıca vakıflar; Afrika, Filistin, Doğu Türkistan gibi farklı coğrafyalarda kader birliği yaşayan insanlığın belki de son umut taneleriyle, ülkemizdeki insanların gönüllerinin buluşmasında önemli bir rolü üstlenmektedir. Çalışma sırasında önde gelen vakıfların yetkilileri ile derinlemesine mülakat gerçekleştirilmiş; mevcut durum, yaşanan problemler ve katılım bankaları önde olmak üzere finans kurumlarıyla olan ilişkileri ele alınmıştır. Ayrıca Vakıflar Genel Müdürlüğü sitesinde adları yayımlanan; cemaat, mülhak, yabancı ve yeni vakıfların İslami Sosyal Finans faaliyetlerine dair analizler gerçekleştirilmiş olup önde gelen bazı vakıflara dair detaylı bilgilere yer verilmiştir. Bulgular, Vakıflar Genel Müdürlüğü uhdesinde vakıfların gerçekleştirdiği faaliyetlerin İslam iktisadının prensipleri çerçevesinde gerçekleştirilmesinin sağlanması üzere kurumsal yapının tesis edilmesinin gerekliliğini, katılım bankalarının vakıflar ile olan ilişkilerini geliştirecek ürünler sunması gerektiğini, katılım bankaları ile vakıflar arasındaki iletişim ağının güçlendirilmesinin şart olduğunu, vakıfların bağış ödemelerini gerçekleştirmesinin önündeki engellere yönelik alternatif yollara dair çalışmalar yapılmasının önem taşıdığını, vakıflar ve katılım bankaları arasında karz-ı hasen yöntemiyle bir ürün geliştirmesi adına iş birliği gerçekleştirilebileceğini, vakıfların dijital dönüşüme ayrıca odaklanmaları gerektiğini göstermektedir. Bu sonuçlar, geçmişte toplumun merkezinde yer alan vakıfların günümüzde tekrar eski hüviyetine kavuşması için tüm İslami finans ekosisteminin birliktelik içerisinde hareket etmesi gerektiğini vurgulamaktadır."
