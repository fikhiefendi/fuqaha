abstract: "Bu tezde, 18. asır İstanbul'unda öldürme suçu konu edilmiştir. İlk önce Hanefi/Osmanlı hukukunda muteber kabul edilen fıkıh kitapları temelinde öldürme suçunun teorisi açıklanmış daha sonra şeriye sicilleri, fetva kitapları ve öldürme suçuyla ilgili muhtelif arşiv vesikaları yardımıyla teori ve uygulama arasındaki ilişki ortaya konulmuştur. Bu haliyle çalışma, Hanefi hukukunun ileri bir tarihli uygulaması olan Osmanlı hukukundaki görünümünü aksettirmiştir. Çalışmada, uygulamayı göstermek için sadece şeriye sicilleriyle yetinilmemiştir. Ayrıca kısas cezasıyla ilgili olan ve Dîvân'a intikal etmiş muhtelif birçok arşiv belgesi de kullanılmıştır. Bu sayede, kısas kararlarının şeriye mahkemesinden Dîvân'a kadar uzanan yolculuğuna şahit olunmuş; teori ve uygulama arasında bazı farklılıklara rağmen büyük oranda uygun bir bütünlük gözlenmiştir.Bu tezde, 18. asır İstanbul'unda öldürme suçu konu edilmiştir. İlk önce Hanefi/Osmanlı hukukunda muteber kabul edilen fıkıh kitapları temelinde öldürme suçunun teorisi açıklanmış daha sonra şeriye sicilleri, fetva kitapları ve öldürme suçuyla ilgili muhtelif arşiv vesikaları yardımıyla teori ve uygulama arasındaki ilişki ortaya konulmuştur. Bu haliyle çalışma, Hanefi hukukunun ileri bir tarihli uygulaması olan Osmanlı hukukundaki görünümünü aksettirmiştir. Çalışmada, uygulamayı göstermek için sadece şeriye sicilleriyle yetinilmemiştir. Ayrıca kısas cezasıyla ilgili olan ve Dîvân'a intikal etmiş muhtelif birçok arşiv belgesi de kullanılmıştır. Bu sayede, kısas kararlarının şeriye mahkemesinden Dîvân'a kadar uzanan yolculuğuna şahit olunmuş; teori ve uygulama arasında bazı farklılıklara rağmen büyük oranda uygun bir bütünlük gözlenmiştir."
