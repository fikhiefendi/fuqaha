abstract: "Bu tez, tasavvufun teşekkül ettiği süreçte zühd-kesb ilişkisi merkezinde kesb sorununun gelişim seyrini konu edinmektedir. Hicrî ilk iki asırda müslümanların zenginleşip dünyevileşmelerini dindarlık açısından önemi bir sorun olarak gören zâhidler, bu duruma karşı eleştirel bir söylemi dillendirirken bir yandan zenginliğe sebep olduğu için kesbi tahkir eden bazı yaklaşımlar ortaya koymuşlar, diğer yandan benimsedikleri rızık anlayışları üzerinden çalışıp kazanmanın sınırlarını belirlemeye çalışmışlardır. Hicrî ikinci asrın sonlarından itibaren zühd söylemindeki zenginlik karşıtlığını pekiştirerek onu fakirlik temelinde sistematik bir yapıya dönüştüren ilk sûfîler ise, ortaya koydukları tevekkül anlayışlarıyla kesb meselesinin müslümanlar arasında önemli bir soruna dönüşmesine neden olmuşlardır. Bu sorun çoğunlukla kesbin terk edilmesi ve onu tahkir eden anlayışın yaygınlaşmasının sebep olduğu problemler çerçevesinde gelişmiş ve bu bağlamda ortaya çıkan tartışmalarda ilk sûfîleri tenkit eden taraf çoğunlukla fakihler olmuştur. Tasavvufun teşekkülünde“kriz”aşamasını ifade eden bu sürecin akabinde, tasavvufu ibâhîlikten ve sûfîleri de aşırı zühd gruplarından ayırmaya gayret eden sûfî müellifler, kesb sorunun çözümüne dair geliştirdikleri yaklaşımlarla fakihler ve müslümanların geneli ile bu konu üzerinde bir uzlaşıya varmaya çalışmışlardır. Tez konumuzu ele alırken iki temel yöntemi benimsedik. Birincisi, kesb sorununun gelişim sürecini, bu sorunu ortaya çıkaran ve şekillendiren etkenleri kronolojiyi dikkate alarak ve sorunun farklı boyutları arasında irtibatlar kurarak bütüncül bir şekilde yorumlamaya çalıştık. Çalışmamızda uyguladığımız bu yöntem, tasavvufun eleştiri-kriz-uzlaşı olarak üç temel aşamada teşekkül ettiği sürecin kesb sorunu merkezinde zühd-kesb ilişkisinin gelişim seyri üzerinden izlenebileceğini göstermiştir. Bu anlamda, başlangıçta zenginleşmenin eleştirilmesi üzerinden gelişen ve bununla irtibatlı olarak çok çalışıp kazanmayı bir sorun haline getiren zühd söylemi, ilk sûfîler tarafından daha ileri bir noktaya taşınarak kesb meselesini bir krize dönüştürmüş, bu krizden çıkmanın yollarını arayan sûfî müellifler tarafından ise zühd tekrardan yorumlanarak zühd-kesb ilişkisinin sınırları büyük ölçüde sünnî paradigmanın sınırları ile belirlenerek bir uzlaşıya gidilmiştir. Bununla birlikte tezimizde ulaştığımız en önemli neticelerden birisi, sûfî müelliflerin sağlamaya çalıştıkları uzlaşının sûfîlerin kendi aralarında değil sûfîlerle müslümanların geneli ve özellikle fakihler arasında gerçekleşmiş olmasıdır. Diğer bir deyişle sûfî müellifler, seçkin ve az sayıdaki bir sûfî zümre üzerinden hem tasavvufun diğer dinî ilimlere hem de sûfîlerin diğer insanlara olan üstünlüğüne dair yaklaşımları pekiştirerek devam ettirmişlerdir. Çalışmamızda esas aldığımız ikinci yöntem ile, kesb sorununa dair tartışmaların en önemli tarafı olan zâhid ve sûfîleri bizzat ticari hayatın içinde arayarak zühd-kesb ilişkisi merkezinde gelişen bu sorunun sınırlarını belirlemeye çalıştık. Bu yöntemin bizi ulaştırdığı neticelerden birisi şudur; tasavvufun teşekkül ettiği ilk aşamada zâhidler ticari hayatın içinde daha çok görülürken, zühd söyleminin sistematize edildiği ikinci aşamada ilk sûfîlerin ticari hayattaki varlıkları azalmıştır. Bununla birlikte zâhid ve sûfîlerin mesleklerine ve kesb anlayışlarına dair ortaya koyduğumuz veriler, kesb sorununun gelişim seyrinde zâhid ve sûfîlerin kendi aralarındaki görüş farklılıklarının da önemli bir yeri olduğunu ve bu anlamda onları kesb tartışmalarında tek bir tarafta görmenin doğru olmadığını göstermiştir."
