abstract: "Vahyin nüzul sürecine ve Hz. Peygamber'in risâlet vazifesine doğrudan tanıklık eden sahâbe nesli, İslâm hukuk düşüncesinin teşekkülünde merkezi bir role sahiptir. İslâm hukukunun hüküm ve gayelerini Hz. Peygamber'in rehberliğinde bizzat tecrübe eden sahâbîlerin, hukukî meselelere dair görüş ve değerlendirmeleri erken dönemden itibaren fıkhî mezheplerin oluşum sürecini etkilemiş, fıkhî birikimin şekillenmesinde başvurulan temel referanslar arasında yer almıştır. Sahâbenin hukuki görüşlerinin etkilediği mezheplerden biri de Hanefî mezhebidir. Bu çalışma, Hanefî mezhebinde sahâbî kavlinin deliller hiyerarşisindeki yerini ve bu konuma ilişkin usûl literatüründe ortaya konulan kabullerin furû' fıkıh alanındaki yansımasını ele almaktadır. Bu bağlamda mezhebin imamlarının konuya dair yaklaşımları ile önde gelen Hanefî fakihlerin değerlendirmeleri ortaya konulmuş; söz konusu usûlî çerçevenin fıkhî tercihlere hangi düzey ve bağlamlarda yansıdığı incelenmiştir. Ayrıca Hanefî furû' fıkhının teşekkül sürecinde belirli sahâbîlerin etkili olup olmadığı araştırılmış; bu çerçevede sahâbî tercihlerinde gözetilen metodolojik ölçütler değerlendirilmiştir. Bunun yanı sıra sahâbî kavlinin, fıkhî hükümlerin gerekçelendirilmesinde müstakil bir delil mu yoksa mevcut tercihleri destekleyici bir delil mi olarak kullanıldığı hususu da somut örnekler üzerinden ele alınmıştır. Giriş ve iki bölümden oluşan çalışmanın ilk bölümünde, Hanefî mezhebinin sahâbî kavline ilişkin yaklaşımı usûl literatürü çerçevesinde, tarihsel gelişim süreci de dikkate alınarak incelenmiştir. İkinci bölümde ise mezhebin temel furû' eserlerinden seçilen fer'î meseleler çerçevesinde, usûl literatüründe belirtilen kabullerin pratikteki karşılığı değerlendirilmiş ve Hanefî fakihlerin sahâbî tercihlerinde benimsedikleri metodolojik ölçütler bütüncül bir bakış açısıyla ortaya konulmuştur."
