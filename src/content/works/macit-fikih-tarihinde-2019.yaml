abstract: "Çalışmamız, fıkıh tarihi ve fıkıh literatürü çalışmasıdır. İslam Fıkıh Tarihinde bir yazım türü olarak Muhtasar eserlerden bahsetmektedir ve üç bölümden oluşmaktadır. Birinci bölümde öncelikle konunun temelini teşkil eden“muhtasar”kavramı üzerinde duruldu. Kavramsal bir çerçeve çizildi. Muhtasar eserler sadece fıkha münhasır olmadığından ve bu tür eserler İslam ilim tarihinde mevcut bütün ilim dallarında olabildiğinden, kavramsal çerçevenin ardından İslam ilim geleneğinde ihtisar ve muhtasar eserler hakkında genel bilgi verildi. Bilahare fıkıh tarihinde ihtisar geleneği çerçevesinde bilgiler sunuldu. Bu konu detaylandırılırken fıkhî mezhepler tarihinin ana gövdesini oluşturan dört büyük sünnî mezhebin bu meyandaki çalışmaları ele alındı. Konunun makul sınırlar içinde kalması için böyle bir sınırlandırmaya gidildi. İkinci bölümde iki meşhur fıkhî muhtasarın müellifleri ve muhtasarları hakkında bilgi verildi. Bu konu, eserlerin mukayesesinin yapıldığı üçüncü bölümle bağlantılı olarak ele alındı. Bu bağlamda, biri Mısır diğeri Bağdat merkezli olarak yazılmış iki meşhur Muhtasar'ın müelliflerinin yaşadıkları zaman ve mekânların ilmi ve kültürel açıdan tahlilleri yapıldı. İlmi birikimlerinde ve bu eserleri yazmalarında etkili olan faktörlerin, yaşadıkları bu sosyo-kültürel ortamlardaki izleri sürüldü. Kişisel ve ilmi hayatları kısaca irdelendi. Üçüncü bölümde ise her iki muhtasarın şekil, muhteva üslup gibi birkaç açıdan karşılaştırılması yapıldı."
