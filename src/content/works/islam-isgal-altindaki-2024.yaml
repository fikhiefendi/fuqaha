abstract: "İslam tarihi boyunca Müslümanların toprakları, farklı din mensupları tarafından sıklıkla işgale uğramıştır. Özellikle 19. ve 20. yüzyıllar, İslam dünyası Doğu, Batı, Kuzey ve Güneyden en çok işgal edildiği dönem olmuştur. Toprakları işgale uğrayan Müslümanlar, işgalcilerin kısıtlamaları nedeniyle bazen ibadet özgürlüğünden mahrum kalırken, bazen dini eğitim alanında, ekonomik ve sosyal alanlarda İslam hukukuna göre hayatlarını sürdürmelerinin mümkün olmadığı bir hale düşmüşlerdir. Bu koşullar altında, sınırlı kaynaklarla ve diğer Müslümanların yardımı olmadan işgalcilere karşı ayaklanmaların ve cihadi hareketlerin çoğu, işgalcilerin şiddete başvurması ve sert politikalar dayatması için fırsat olmuştur. Hicret etmeyi seçenler de gittikleri yerlerde sosyal, ekonomik ve ailevi konularda dini hayata dair çeşitli zorluklarla karşılaşmışlardır. Bu durumlar, işgale uğrayan Müslümanların toprakları içinde ve dışında karşılaştıkları sorunlarına İslam hukuku açısından çözüm bulmayı zorunlu hale getirmiştir. Bu araştırmanın amacı, Çin işgali altındaki Doğu Türkistan'daki Müslümanların durumunu örnek alarak klasik ve modern İslam hukuk kaynaklarındaki fetvalardan onların sorunlarına ne türden cevaplar sunulduğunu derli toplu bir şekilde ortaya koymaktır. Bu çalışmanın giriş bölümünde işgal kelimesinin tanımı, işgal ile yakın anlamlı kavramlar, ayet ve hadisler, işgalin İslam hukukundaki yeri ve işgal ile ilgili İslam hukuku terimlerine yer verilmiştir. Birinci bölümde Doğu Türkistan'da Çin tarafından tatbik edilen işgal siyaseti, dini, sosyal, kültürel ve ekonomik hayata müdahaleler gibi meseleler zikredilmiştir. İkinci bölümde hicret ve karşılaşılan sorunlar, işgalcilere karşı direniş, ayaklanmalar ve sonuçlarına değinilmiştir. Sonuç olarak bu çalışmada bir taraftan Doğu Türkistan'ın işgale uğramasının nedenlerine ve bu çerçevede ortaya çıkan fıkhi sorunlara dair değerlendirme ve önerilere yer verilmiştir."
