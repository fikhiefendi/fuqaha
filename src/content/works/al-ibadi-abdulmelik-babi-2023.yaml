abstract: "Tez, 839/1436 yılında vefat eden Abdülmelik b. Alî el-Bâbî'nin“Muhtasar mimmâ leyse fi'r-Ravza ve'l-Minhâc”adlı eserinin Kadâ bahsinden Ümmehâtü'l-Evlâd bahsine kadar edisyon kritiğini içermektedir. Tahkiki yapılan bölümler şunlardır: Kitâbü'l-Kadâ, Kitâbü'l-Kısmât, Kitâbü'ş-Şehâdât, Kitâbü'd-Davâ ve Kitâbü'l-Beyânât, Kitâbü'l-Itk, Kitâbü't-Tedbîr, Kitâbü'l-Kitâbe ve Kitâbu Ümmehâti'l-Evlâd. Yazar bu kitabı, Şâfiî fıkıh kaynaklarından naklettiği birtakım konulara ayırmıştır. Yazarın konulara yaklaşımı, bölümlerde esneklik, dil kolaylığı ve fikirleri kademeli olarak sunma konusunda esneklik göstermiştir. Ayrıca konuları ele alırken Kur'an-ı Kerim'e, Peygamber Efendimizin sünnetine ve icmaa dayanmaktadır. Şafii fakihlerinin görüşlerinden birden fazla görüş ileri sürerek mukayese etmiştir. Hanefî ve Mâlikî mezheplerinin görüşleri ile karşılaştırmıştır. Ayrıca İmam Şafii'nin mezheb-i kadim ve mezhebi cedidi olan fetvalarına temas etmiştir. Kitap, döneminin çağdaş fıkıh meselelerinden bahsetmesiyle, kaybolan kaynaklardan alıntı yapmasıyla ve İmam Nevevî'nin (El-Ravda) ve (El-Minhac) kitaplarında ele almadığı konuların sunumu ile temayüz etmektedir. Araştırmacı tezi üç bölümde ele almıştır: Birinci bölümde yazarın hayatını detaylıca işlemiştir. İkinci bölümü de ikiye ayırmıştır. Birinci kısımda tahkik edilecek nüsha incelenmiş; ikinci kısımda de yazarın üslubu analiz edilmiştir. Üçüncü bölümde ise tahkiki yapılan eser bilgisayar ortamında modern imla kurallarına uygun olarak farklı nüshaları ile karşılaştırılarak yazılmıştır."
