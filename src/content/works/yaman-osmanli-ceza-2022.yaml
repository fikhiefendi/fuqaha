abstract: "Çalışma, meşru müdafaa müessesesinin Osmanlı ceza hukukundaki yerini ele almaktadır. Literatürde konuyla ilgili detaylı araştırmaların bulunmadığı tespit edildiğinden, çalışma ile birlikte, literatürdeki bu boşluğun bir nebze de olsa doldurulması ve bu suretle Osmanlı ceza hukuku müktesebatına katkı sağlanması hedeflenmektedir. Çalışmada zaman ve bölge yönünden sınırlamaya gidilmemiş, meşru müdafaanın tüm Osmanlı tarihi ve coğrafyasındaki görünümü ortaya konulmaya çalışılmıştır. Şer'iyye sicilleri, mühimme defterleri, arşiv belgeleri, Osmanlı kanunnameleri, fetvalar gibi birinci el kaynaklardan istifade edilen tezde ayrıca meşru müdafaanın şer'î hukuktaki yerini göstermesi açısından fıkıh kitaplarından; Tanzimat dönemi hukukçularının yaklaşımını yansıtması bakımından ise bu hukukçuların kitap ve makalelerinden istifade edilmiştir. Yeri geldikçe doktrindeki görüşlere de temas edilmiştir. Elde edilen sonuçları şöyle özetlemek mümkündür: Osmanlı hukuk sisteminin meşru müdafaayı istikrarlı şekilde hukuka uygunluk sebebi olarak kabul ettiği; Tanzimat dönemi için tartışmalı noktalar bulunmakla birlikte, meşru müdafaanın nefse, ırza ve mala karşı suçlarda ve ayrıca üçüncü kişilere yönelik saldırılarda tanındığı anlaşılmıştır. Tahlil edilen kararlardan hareketle, gerek klasik dönemde gerekse Tanzimat döneminde, teorik bilgilerin uygulamaya yansıdığı sonucuna ulaşılmıştır. Tanzimat dönemine ait mahkeme kayıtları, ikili hukukun ahenk içerisinde uygulandığını göstermektedir. Ayrıca dönemin hukukçularının, 1858 Ceza Kanunnamesi'ndeki meşru müdafaa düzenlemelerine yönelik tenkitleri dikkate alınarak kanunî düzenlemeler yapıldığı tespit edilmiştir."
