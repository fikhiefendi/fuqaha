abstract: "Bu çalışma tahkimin ne olduğunu tanımlamayı, türlerini bilmeyi, İslam hukukunda meşruiyetini açıklamayı ve danışmanlık, yargı, uzlaşma ve uzlaşma arasındaki farkları ve farklılıkları tespit etmeyi ve tahkim şartlarını bilmeyi ve İslam hukukunda tahkim yerini açıklamayı amaçladı. Bu makalede, tahkimin avantajlarını ve dezavantajlarını vurgulamıştır. Ve tahkimin ülkeler için önemini ve bunun yatırım üzerindeki etkisini açıkladım ve konuyla ilgilenen bir dizi bilimsel metodolojiyi, araştırma probleminin özelliklerini tanımlamak ve bunun çeşitli yönlerini teşhis etmek için gerekli araştırma yöntemini araştırmak amacıyla araştırma probleminin gerçekliğini tahmin etmeyi amaçlayan ve bunu veri toplama yoluyla izledim. Çeşitli kaynaklar aracılığıyla araştırma problemi için gerekli olan, en önemlisi araştırma konusu, masaüstü bilgi araştırması ve tahkimde uzman referansları ile ilgili önceki çalışmalardır. Araştırma problemine ilişkin sonuçları, önerileri ve önerilen politikaları çıkarmak için araştırmada tümdengelimi kullanmaya yönelik tümdengelimsel yaklaşımı izledim. Hakemlik ve yasal olarak tahkimin bazı yönlerini ele aldı, böylece çalışma entegre bir kavramsal çerçeve içinde ve araştırma bir dizi öneri ile sonuçlandı, en önemlisi Arap tahkim organları arasındaki koordinasyonu arttırmak için İslam hukukundan değer ve koşullar elde etmek için çalışıyor."
