abstract: "Günlük yaşamımızın vazgeçilmez bir parçası olan bina ve yapıeserlerinin yararları kadar, tehlikeleri de bulunmaktadır. Bu sebeple yasakoyucu, bina ve yapı eseri malikinin sorumluluğunu, Borçlar Kanunu'ndakusura dayanmayan bir sorumluluk hâli olarak düzenlemiştir.Sorumluluğun temeli, olağan sebep sorumluluklarındaki objektif özengösterme ödevine aykırılık esasına dayanmaktadır.BK. m. 58 hükmüne göre sorumluluğun ortaya çıkabilmesi için, malikolma, bir bina veya yapı eserinin var olması, bina veya yapı eserindeki yapımbozukluğu veya bakım eksikliğinden bir zarar doğması ve illiyet bağınınkesilmemiş olması şartları aranmaktadır.Malike karşı, BK. m. 58'e dayanarak zarar görenler tarafından açılacaktazminat davaları, BK. m. 60'da düzenlenen bir ve on yıllık haksız fiilzamanaşımına tabidir. Bununla birlikte, zararı tazmin eden malikin, BK. m.58/II gereğince, kendisine karşı sorumlu olan diğer kişilere ileri sürebileceğirücu hakkı bakımından, bu sorumluluğun sebebini oluşturan hukuki ilişkininniteliğine göre, özel zamanaşımı süreleri uygulanır. Buna göre, malikin binayısatın aldığı kişiye karşı rücu hakkı, beş yıllık zamanaşımı süresine tabidir.Satıcının hilesinin bulunduğu durumlarda ise bu süre on yıl olacaktır. AyrıcaBK. m. 58 hükmü bir kusursuz sorumluluk hâlini düzenlediğinden, BK. m.60/II'de öngörülen ve daha uzun olan ceza zamanaşımı uygulama alanıbulunmamaktadır.Borçlar Kanunu'muz, sadece bina veya yapı eserlerinden doğanzararın tazmini konusunda hüküm koymakla yetinmemiştir. Aynı zamanda,59. madde hükmü ile, başkasına ait bir bina veya yapı eseri yüzünden zarartehlikesi ile karşı karşıya kalan kişiye, daha zararın doğumundan önce,önleyici tedbirler aldırmak yetkisini tanımış ve onu bu düzenleme ile korumuşbulunmaktadır. Bu maddede düzenlenen tehlikeyi giderici tedbirlerin alınmasıtalebi için, malikin kusuru veya tehlikenin yapım bozukluğu yahut bakımeksikliğinden kaynaklanması gerekmemektedir."
