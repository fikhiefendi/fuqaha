abstract: "Akli bir yöntem olan kıyas Hanefiler tarafından oldukça sık kullanılmaktadır. Hanefiler kıyası usul kitaplarında felsefi olarak ele almakla birlikte furu fıkıh eserlerinde çok canlı bir şekilde kullanmışlardır.Usulü fıkıh fıkıh ilminin teori boyutunu ele almakta furu fıkıh ise pratiği ile ilgilinmekte bir anlamda teorinin uygulamasını ifade etmektedir. Dolayısıyla usulü fıkıhta ele alınan yöntemlerin uygulama sahası olan furu fıkıhtaki karşılığı bu yöntemlerin çerçevesini çizmede çok büyük önem taşımaktadır. Bu amaçla zamanla ortaya çıkan problemlerin çözümünde içtihadın olmazsa olmazlarından biri olan kıyas yönteminin Hanefi mezhebinin ilk dönem usul eserlerinde teorik yönünü özet bir şekilde ele aldık. Daha sonra ise kıyasın uygulamasının usuldeki tanım ve tariflerle nekadar uyum sağladığını görebilmek adına mezhebi en iyi şekilde temsil eden muhtasar furu fıkıh kitaplarından biri olan el-Hidaye adlı eser çerçevesinde bol miktarda örnek ve çözümleme ile inceledik.Sonuç olarak kıyasın furu alanında usulden daha geniş bir kullanıma sahip olduğunu tespit etmiş bulunuyoruz."
