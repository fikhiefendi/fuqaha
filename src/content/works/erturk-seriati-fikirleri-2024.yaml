abstract: "ÖZET İnsan, varoluşu itibariyle hem bireysel hem de toplumsal yönü olan ve bu iki yönünün birbirine bağımlılığını kendi yaşam pratiğinde ortaya koyan bir canlıdır. Karşılaştığı her olay ve durumda seçimlerini özgür iradesiyle yaptığını düşünen insan, esas itibariyle yaşamı boyunca karşılaştığı her olay ve durumda tercihlerini ortaya koyarken belli başlı unsurların etkisi altındadır. Yaşam koşullarının kendisine dayattığı psikoloji içerisinde, insanın salt kendi seçimlerinin olup olmadığı konusu tartışmalı bir konudur. Yapısı itibariyle de zayıflıkları olan insan, içerisine doğduğu dünyada hem çevresel hem de sosyal faktörlerin etkisi altında kalmaktadır. Ali Şeriati, insanoğlunun hayatında dört belirleyici unsur olduğunu ileri sürerek; tabiatın belirleyiciliği, tarihin belirleyiciliği, toplumun belirleyiciliği ve insanın kendi belirleyiciliği şeklinde kategorize ettiği bu dört unsuru“zindan”benzetmesi ile literatüre kazandırmıştır. İnsanoğlu, tarih boyunca yaşanan, kırılma noktaları olarak değerlendirilebilecek bütün gelişmelerden olumlu ya da olumsuz biçimde mutlaka etkilenmiştir. Bu çalışmanın amacı Ali Şeriati'nin ileri sürdüğü bu dört unsura ek olarak, gelişen teknoloji sonrası yaşanan dijital devrimin bireyler ve toplumlar üzerindeki etkisini ele alıp beşinci belirleyici unsur olarak sosyal medyayı ortaya koymaktır. Çalışma literatür taraması yapılarak ve yarı yapılandırılmış derinlemesine görüşme yöntemi kullanılarak yapılan araştırma sonucunda oluşturulmuştur. Çalışma sonucunda bireyler ve toplumlar üzerindeki etkisiyle sosyal medyanın beşinci belirleyici unsur olarak ortaya konulabileceği görülmüştür."
