abstract: "Osmanlı devleti kurulduğu andan itibaren idari anlayışını sağlam temeller üzerine kurmuş ve sahip olduğu adalet anlayışıyla tebaasında bulunan birçok millete sahip çıkmıştır. Osmanlı, tarihini inşa ederken insanların dili, dini, ırkı ne olursa olsun ayırd etmeden herkesin eşitlik hürriyet ve yaşama hakkına riayet etmiş tek devlettir. Birçok İslâm ülkesinde/devletinde Kur-an'a ve sünnete dayalı olan adalet anlayışı Osmanlıda da aynı sistemle -kadılık makamıyla- devam ettirilmiştir. Bu sistemin olmazsa olmaz parçası ise kadıların hükümlerini içeren dönemin şer'iyye sicil defterleri olmuştur. Şer'iyye sicilleri Osmanlı hukuk sistemi yanında bize siyasi, kültürel ve ekonomik anlamda birçok veri sunmaktadır. Özellikle mahkemelerce kayda geçirilen olayların da içerisinde yer aldığı bu siciller hem Osmanlı hukuk tarihi hem de milli tarihimiz açısından büyük bir öneme sahiptir. Osmanlı İmparatorluğunun yıllarca süren başarısının ardında güçlü bir askeri sistem kurmuş olmasının yanı sıra düzenli bir vakıf sistemine sahip olması da sosyal bir devlet olmasının en büyük kanıtı olmuştur. Sosyal yaşantının can damarını oluşturan vakıflar bizlere dönemin sosyo-kültürel yapısını anlatırken aynı zamanda adalet sisteminin nasıl işlediği ile ilgili de ipuçları vermektedir. Tüm bu sebepler düşünüldüğünde tarihin doğru bir şekilde anlaşılması ve günümüz şartlarında değerlendirilebilmesi için öncelikli olarak tarihe şahitlik eden belgelerin gün yüzüne çıkarılması gerekmektedir. Ancak bu yolla dönemi sağlıklı bir şekilde değerlendirebilir ve günümüzdeki benzer konular için emsal teşkil etmesini sağlayabiliriz."
