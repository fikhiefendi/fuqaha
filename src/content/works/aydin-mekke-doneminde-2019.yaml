abstract: "Hz. Muhammed (sav) 610 yılında vahye muhatap olmaya başlamış, ilk tebliğ görevine içinde yaşadığı Mekke toplumunda başlamıştır. Hz. Muhammed (sav), geneli putlara tapan, içinde şirk unsurlarını barındıran inanç sistemine sahip olan bir topluma peygamber olarak gönderilmiştir. Mekke döneminde inançla ilgili hususlar üzerinde durulmuş ve bu dönemde ibadetler de şekillenmeye başlamıştır. İslamiyet'in geldiği ortamda Mekke halkı, putperest bir inanç sistemine sahip olmalarından dolayı ibadetleri de putlar etrafında şekillenmekteydi. Hz. Muhammed (sav) Mekke de yaşadığı sürede toplumun yanlış inanç sistemlerini ıslah etmeye çalışarak tevhid inancını yerleştirmeye çalışmıştır. İşte ibadetler de bu tevhid inancı üzere Mekke döneminde şekillenmeye başlamıştır. Mekke dönemi olarak belirtilen süreç genel kabul görmüş olunan risaletin başlangıcından Medine'ye hicrete kadar olan bölüm kastedilmektedir. Mekke döneminde şekillenmeye başlayan ibadetler yirmi üç yıllık bir süreçte son halini almıştır. Mekke döneminde ibadetler Kur'an-ı Kerim'in dil ve üslubuyla tedrici bir şekilde ortaya çıkmaya başlamıştır. İbadetler bir anda emredilmemiş, öncelikli olarak zihinler bu sürece hazırlanmıştır. Bu araştırma neticesinde namaz, oruç, zekât, kurban ve hac olarak formel ibadetlerin ortaya çıkışları incelenmiştir. Bu çalışmayla Mekke dönemindeki ibadetler, müşriklerin ibadetleri ve Müslümanların ibadetleri şeklinde mukayeseli olarak ortaya konulmuştur."
