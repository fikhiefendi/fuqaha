abstract: "1059 ve 1136 yılları arasında yaşamış olan şair, fakih, mutasavvıf ve edebiyatçı olan Edirneli Kami olarak bilinen Muhammed Kami Edirnevi“Mehammu'l-fukaha”adlı eserin sahibidir. Bu eser, Hanefi mezhebi bilginlerinin hayatı hakkında yazılmış bir eser olup elimizde yedi adet el yazması bulunmaktadır. Bu yedi nüsha arasında yaptığım karşılaştırma ve araştırmalarım sonucunda Beyazıt Devlet Kütüphanesi el yazması bölümünde bulunan ilgili el yazma nüshayı esas kabul ettik. Bu eseri tahlil ve tahkik etmekteki maksadımız bu eserin gün yüzüne çıkartılıp orijinal şekilde basılması ve araştırmacıların istifadesine sunulmasıdır. Eser, Hanefi fıkhı bilginlerinin biyografileri hakkında önemli bir eserdir. Nitekim eserde, İmam-ı Azam Ebu Hanife'den başlayarak müellifin asrına kadarki Hanefi âlimlerinin hayatı, eserleri, resmi görevleri ve yaşamış oldukları bazı enteresan olaylar kaleme alınmıştır. Önsözde belirtildiği üzere çalışmamız giriş ve dört bölümden oluşmaktadır. Birinci bölüm; Edirnevi'nin hayatı ve eserleri hakkında bilgi içermektedir. Çalışmamızın ikinci bölümü ise müellifin eseri yazarken kullandığı metodunu, kaynaklarını, bilimsel çalışmalarını ve fakihleri değerlendirmesini ele almaktadır. Ayrıca bu bölümde,“Mehammu'l-fukaha”nın tabakat kitapları arasındaki yeri ve önemine yer verilmiştir. Üçüncü bölümde ise mezheplerin fıkıh alanında tabakat ilmine bakışı ve müctehidleribilginleri kısımlandırmaları ele alınmıştır. Dördüncü bölümde ise el yazması eserin tahkiki yer almaktadır. Ayrıca belirtmek gerekir ki; İslam kültürüne ilişkin pek çok alanda eser veren Edirnevi'nin yeni nesillere tanıtılması önem arzetmektedir. Anahtar Kelimler: Edirneli Kami Efendi, Tabakat İlmi, Mehammu'l Fukaha, Tabakâtü'l-müctehidin, Hanefi mezhebi."
