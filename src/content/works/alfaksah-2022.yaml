abstract: "Tezimin konusunu sanal paralar ve fıkhî hükümleri olarak seçmiş bulunuyorum. Bu konu özellikle de günümüzde İslam hukukunun büyük bir alanında yer tutan finansal işlemler noktasında yeni ortaya çıkan konulardan biridir. Bu alan, en fazla ve en hızlı gelişen alandır. Bu nedenle İslam fıkhının da bu gelişmeleri yakından izlemesi çok önemlidir. Bu nedenle tezimde takastan başlayıp, paranın kullanımına, ardından altın ve gümüşün para olarak kullanılmasına ve akabinde kağıt paraların kullanımı ve ulemanın bunlara cevaz vermesine kadar insanların uyguladığı finansal işlemlerin tarihçesinden bahsedeceğim. Ardından“sanal paralar”konusunu; doğuşu, türleri, ortaya çıkma sebepleri, diğer paralarla ilişkileri, siyasi ve ekonomik etkilerinden bahsedeceğim. Ardından kabul gören bazı fıkıh heyetlerinin fetvaları, bazı muasır alimlerin görüşleri ve şerî delilleri incelenerek bilimsel ve fıkhî açıdan tartışmaları yapılacaktır. Tezimizi yazarken birkaç farklı problemle karşılaştım. Bunlardan en önemlisi sanal paraların siyasi ve ekonomik boyutlarının bugün bile halen bilinmiyor olmasıdır. Dolayısıyla bu bilgiler sadece zahirî birtakım analiz ve verilere dayalı kaynaklardan alınmaktadır. Öte yandan tezin hazırlanması sırasında karşılaştığım zorluklardan biri de konunun çok yeni olması ve konu ile ilgili kitap ve çalışmaların son derece az olmasıdır. Bu nedenle kimi zaman internet sitelerine ve az sayıdaki bilimsel makalelere müracaat ederek sanal paralar hakkında bilgi toplamaya çalıştım. Fetvalar açısından ise; Ezher İslami Arıştırmalar Kurulu ve DİB Din İşleri Yüksek Kurulu gibi fıkhî heyetlerin fetvalarının yayınlandığı internet sitelerinden bilgi temin ettim ve finansal işlemler alanında uzman alimlerin görüşlerini tespit etmeye çalıştım. Fetvaların tartışılması ve eleştirilmesi noktasında ise finansal işlemlere özel İslam hukuku kitaplarına müracaat ederek ve meseleleri şerî delillerde irtibatlandırarak temellendirmeye çalıştım. Konumuzun önemi, çok fazla çaba harcanması ve irdelenmesi gereken yeni meselelerden biri olmasında gizlidir. Tezimizde konuyla ilgili fetvaların toplanıp analiz edilecek olması ilgililerin konuyu tam olarak anlamasını sağlayacak ve işlerini kolaylaştıracaktır."
