abstract: "İslam aile hukukunda kefâet (denklik) evlenecek olan eşler arasında belli hususlarda denkliğin bulunmasını, daha çok da evlenecek eşlerden erkeğin kadına denkliğini ifade eden bir terimdir. Evlilikte denkliğin şart olup olmadığı islam hukukçuları arasında tartışılmıştır. Evlenmede denkliği şart koşan hukukçular denkliğe konu vasıflar ve muhtevası üzerinde farklı görüşler ortaya koymakla beraber din/dindarlık konusunda ittifak etmişlerdir. Kefâet islam hukukçuların çoğunluğunca kabul edilen ve kadının haklarını koruma amacıyla oluşturulan bir unsur olarak değerlendirilmektedir. Bu bağlamda denklik olmadığında kadına veya velilerine nikahı feshetme hakkının da verilmiş olduğu görülmektedir. Kefâet sağlam ve uzun ömürlü evliliği temin, aile kurumunu korumak, eşler arsında ahenk huzurun temini ve daha mes'ud olabilmeleri içindir."
