abstract: "Bu çalışmamızda, İslam ekonomisinde özelleştirme sistemine geçiş kriterleri üzerinde durulması hedeflenmiştir. Öncelikle pozitif ekonomi sisteminde, özelleştirme kavramının tanımını yapılırken İslam ekonomisi açısından da değerlendirmesini yapılacak ve özelleştirme eylemine hukuki açıdan doğru yaklaşımlar açıklanacaktır. Özelleştirme, İslam hukukuna yeniden eklenen bir sektör türüdür ve bütün şeklinin doğru ve İslam hukukuna uygun olduğunu söylemek mümkün değildir. Yani bazıları İslam hukukuna uygun iken bazıları aykırı olabilir. Bunlar, çalışmamızda delilleriyle açıklamaya çalışılmıştır. Çalışmamızda özelleştirme ile ilgili İslam ekonomisi açısından bir dizi kriterler bulabildik. Bu kriterleri, şer'i, ahlaki, sosyal, siyasi, mali, idari, ekonomi ve pazarlama gibi birkaç türe ayırmak mümkündür. Ayrıca, İslam ekonomisi açısından özelleştirme kriterlerinin saha uygulaması olarak, Libya tecrübesi esas alınmıştır ve uzmanlar tarafından yapılan yönetimsel istatistiklerden yararlanılmıştır. Sonuç olarak Libya'daki özelleştirme tecrübesi istenen kriterleri gerçekleştiremediği görülmüştür ve bu başarısızlığın sebepleri açıklanmıştır. Çalışmanın sonunda birkaç önemli önerilere yer verilmiştir. Bunların en önemlisi; İslam ekonomisindeki özelleştirme kriterlerine bağlı kalmanın gerekliliği vurgulanmış, aksi takdirde, özelleştirmede başarı sağlanamayacağı göz önüne serilmiştir."
