abstract: "Bu tez çalışması Osmanlı Devleti döneminde Tokat ilinde gerçekleşmiş olayların, yaşanmış hikâyelerin, insanlar arasındaki ilişkilerin kayıtlı belgelerden bulunup gün yüzüne çıkarılmasıdır. Osmanlı Devleti'nin 18. Yüzyılda Tokat şehrinin durumunu, yaşantısını veşehrin içerisinde bulunan mali ve hukuki durumu anlamak adına o günlerden elimize ulaşan kayıtları çözümleyerek bilgiyi ortaya çıkarmaktır. Tokat iline ait şeriyye sicilleri için yapılmış belki birçok örnek mevcuttur. 4 nolu şeriyye sicili üzerinde bu alanda daha önce bir çalışma gerçekleştirilmemiştir. Tokat 4 nolu şeriyye sicilinin transkripsiyonunun yapılmasındaki amaç Tokat'ın sosyo- ekonomik durumu, idari yönetimi ve Tokat halkının sorunlarına bir bakış açısı getirmektir. Osmanlının gerileme döneminde Tokat ilinde neler yapılıyor, şehrin durumu nasıl ve insanlar hayatlarını nasıl idame ettiriyorlardı. Tokat'ın 18.yüzyılın sonlarına doğru şehre farklı bir açıdan bakıp o dönemin yaşantısını, beraberliğini ortaya koymaktır. Bu çalışma üç ana bölüm hâlinde yapılandırılmıştır. Birinci bölümde, Sicil Defteri'nde yer alan belgeler sistemli bir şekilde tasnif edilmiş; söz konusu belgelerin transkripsiyonları yapılmış ve defterde geçen kayıtlar içerik ve şekil bakımından ayrıntılı biçimde açıklanmıştır. İkinci bölümde ise Tokat'ın idarî yapısı tarihî çerçevesiyle ele alınarak, şehrin nahiyeleri ve köyleri hakkında bilgilere yer verilmiş ve Tokat'ın sosyal, kültürel ve ekonomik hayatı incelenmiş; toplum yapısı, günlük yaşam ve iktisadî faaliyetler, sicil kayıtları ışığında değerlendirilmiştir."
