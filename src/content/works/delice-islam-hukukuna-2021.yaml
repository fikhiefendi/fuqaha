abstract: "Hukuk, sosyal hayatı kanunlar çerçevesinde koruma altına alan ve bireylerin hakkını savunan, bunu da çeşitli yaptırımlarla destekleyen kurallar bütünüdür. İnsanın insanla ve insanın eşyayla olan ilişkilerini düzenleyen, gerektiği yerde yaptırımlar uygulayarak insanın huzur ve düzen ortamında, toplum içerisinde varlığını sürdürmesini amaçlayan hukuk, çocuğun da fiillerini ve bu fiillerin neticelerini kurallarla düzenlemiştir. Bu çalışmada genel anlamda hukukun, özel anlamda İslâm Hukukunun toplum kuralları çerçevesinde çocuğun fiilleri ve bu fiillerin neticeleri incelenmiştir. Konu ağırlıklı olarak Hanefî mezhebinin görüşleri doğrultusunda ele alınarak, ara ara Şâfiî, Mâlikî ve Hanbelî mezheplerinin de görüşlerine yer verilmek suretiyle çocuğun işlediği fiillerden sorumlu olup olmadığı, bu fiillerin şer'î kaynaklardaki karşılığının neler olduğu tespit edilmeye çalışılmıştır. Çocuğun işlediği yasaklanmış fiilin gerçek anlamda suç olmadığı, bu fiillere karşı çocuğa uygulanan yaptırımın da gerçek anlamda ceza olmadığı ve çocuğu terbiye amacı taşıdığı konusunda ittifak vardır. Kanunlarla koruma altına alınan, eğitim, kişisel gelişim, beslenme, barınma gibi ihtiyaçları aile ve devlet sorumluluğunda bulunan çocuk, işlediği fiillerinden dolayı kısmi sorumluluk sahibidir. Onun işlediği fiillerin bir kısmı hukuki sonuç doğurmamaktadır. Bu durum yetişkinler tarafından suistimal edilmeye açıktır. Bazen de çocuğun kendi aile bireyleri tarafından suç işlemeye yönlendirildiği müşahede edilmektedir. İslâm hukuku çocuğu her türlü suistimale karşı korumuş, işlenen fiillerin neticelerini kişinin ehliyet durumuna göre ele almış, şahsın ve toplumun hakları gözetilerek sonuca vardırmıştır. Kendini ifade edemeyen ve koruyamayan çocuğun sözlü ve fiili tasarruflarının muteber olup olmadığı, bu fiillerin gerek dünya, gerek ahiret hayatında ne ifade ettiği, fiillerin kanunlardaki karşılığı gibi konular çocuğu koruma altına almayı hedeflemektedir. Burada nihaî amaç toplumun huzurunu ve bekasını sağlamaktır."
