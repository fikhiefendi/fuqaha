abstract: "Bu çalışma, Libya'daki kalkınma bütçe açığını azaltmada İslami (sukuk) rolünü ve ekonomik büyüme ve gelişime katkılarını ele almakta. Sukukun kalkınma açığını finanse etme üzerindeki etkisini ve ekonomiyi destekleme konusundaki etkinliklerini incelemeyi amaçlamaktadır. Çalışma, Libya'da sukuk kullanımını geliştirme finansmanında iyileştirmek için öneriler sunmakta, bunları etkili ve şeffaf bir şekilde ihraç etme prosedürlerini geliştirmeye odaklanmaktadır. Şeriat'a uygun finansal araçlar olarak sukuk kullanımının artırılmasının önemini, kalkınma bütçesini desteklemek ve gelişim için önemli projeleri finanse etmek, ve sukuk ihraç mekanizmalarını geliştirerek verimliliği artırma ve gelişimdeki rolleri hakkında farkındalık yaratma ihtiyacını vurgulamaktadır. Çalışma, araştırma hedeflerini desteklemek için anketler aracılığıyla toplanan birincil verilere dayanarak, indüktif ve tanımlayıcı-analitik metodları birleştiren çok yöntemli bir yaklaşım kullanmaktadır. Kalkınma bütçesinin, kaynakları altyapı projelerine ve uzun vadeli yatırımlara yönlendirerek ekonomik büyümeyi artırdığı sonucuna varmakta ve eğitim ve sağlık gibi sektörlere yatırım yapmanın önemini vurgulamaktadır. Çalışma, hükümetin kalkınma projelerini finanse etmede sukuk kullanımını desteklemesi gerektiğini, yararlarını genişletmek ve iş toplulukları arasında sukuk kültürünü yaymak için teşvik edici politikaların geliştirilmesini önermektedir"
