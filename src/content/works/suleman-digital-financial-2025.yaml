abstract: "Bu çalışma, 2004-2023 yılları arasındaki yıllık zaman serilerini kullanarak, finansal kapsayıcılığın Gana'daki ekonomik büyüme üzerindeki etkisini ampirik olarak incelemektedir. Çalışmada, kişi başına düşen GSYİH ile finansal kapsayıcılık endeksi, dışa açıklık, enflasyon ve nüfus artışı gibi belirleyici değişkenler arasındaki uzun ve kısa dönem eşbütünleşme etkisini araştırmak için Otoregresif Dağıtılmış Gecikmeler (ARDL) eşbütünleşme yöntemi kullanılmıştır. Finansal kapsayıcılığı ölçmek ve çoklu doğrusal bağlantıyı önleyerek boyutsallığı azaltmak amacıyla Temel Bileşenler Analizi (PCA) uygulanmıştır. ARDL sınır testi, kişi başına düşen GSYİH ile açıklayıcı değişkenler arasında güçlü bir uzun dönem eşbütünleşme etkisi olduğunu ortaya koymuştur. Uzun dönemde, temel bulgular finansal kapsayıcılık endeksinin ekonomik büyüme üzerinde olumlu ve anlamlı bir etkiye sahip olduğunu gösterirken, dışa açıklık ve enflasyonun ekonomik büyüme üzerinde olumsuz ve anlamlı bir etkisi olduğu görülmüştür. Kısa dönemde ise, finansal kapsayıcılık endeksi ve enflasyonun ekonomik büyüme üzerinde hemen bir etkisi bulunmamaktadır. Buna karşılık, nüfus artış oranındaki artışın kısa dönem dinamiklerinde kişi başına düşen gelir üzerinde olumsuz ve istatistiksel olarak anlamlı bir etkisi vardır. Ayrıca, korelasyon testi analizinin bulguları da finansal kapsayıcılık ile ekonomik büyüme arasında pozitif ve anlamlı bir ilişki olduğunu ortaya koymuştur. Bu nedenle, Gana'daki hükümet, politika yapıcılar ve finansal düzenleyiciler, finansal erişimi olmayan dezavantajlı ve savunmasız grupları hedefleyerek finansal kapsayıcılık düzeyini artırmalı, aynı zamanda kapsayıcı büyümeyi teşvik etmek için makroekonomik kontrol değişkenlerini istikrara kavuşturmalı ve yönetmelidir. Ek olarak, literatürdeki bulgular, finansal erişimle ilgili engelleri ele alırken İslami finans ve bankacılığın finansal kapsayıcılığı teşvik etme potansiyeline sahip olduğunu vurgulamaktadır."
