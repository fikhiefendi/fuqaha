abstract: "Hanefilerin Müslim'den almadıkları rivayetler ve bu rivayetler hakkındaki değerlendirmeleri adıyla ele almaya çalıştığımız tezimiz giriş, iki bölüm ve sonuçtan meydana gelmektedir. Giriş kısmında konunun önemi, amacı, yöntemi ve kaynaklara dair bilgiler yer almaktadır. Birinci bölümde Hanefilerin haber-i vâhidleri kabul kriterleri başlığı altında maddi inkıtâ' ile manevi inkıtâ' konuları yer almaktadır. İkinci bölümde, Hanefilerin amel etmedikleri Müslim rivayetleri ve usûlî açıdan değerlendirmesi hem füru hem de usul eserlerinden tespit edilmiştir. Sonuç bölümünde ise çalışmamız neticesinde tespit ettiğimiz hususlar maddeler halinde kısaca özetlenmiştir."
