abstract: "Ebû Bekr Ahmed b. Amr b. Abdilhâlık b. Hallâd b. Ubeydillah el-Atekî el-Basrî'nin yani meşhur adıyla Bezzâr'ın (ö. 292/905) telif ettiği el-Müsned isimli eseri ile Ebu'l-Hasan Ali b. Ömer b. Ahmed ed-Dârakutnî'nin (ö. 385/995) el-İlel adlı eserinde ref'-vakf ihtilafı bulunduğu muhaddislerce beyan edilen rivayetlerin ve bu rivayetler hakkında verilen hükümlerin karşılaştırılmasını konu edinen bu çalışma, bir giriş ve iki bölümden oluşmaktadır. Çalışmanın giriş kısmında tezin konusu, amacı, yöntemi, kaynakları hakkında bilgiler verilmiştir. Birinci bölümde İlelü'l-Hadîs ilmi kapsamında illetin mahiyeti, bulunduğu yer, hadisin sıhhatini etkileyip etkilememesi ana hatlarıyla ortaya konulmuştur. Ayrıca illet çeşitlerinden biri olan ref' problemi hakkında kısa bilgi verilmiştir. İkinci bölümde ref'-vakf ihtilafı bulunan rivayetler muhaddislerin verdiği hükümlere göre mukayeseli bir şekilde tasnif edilmeye çalışılmıştır."
