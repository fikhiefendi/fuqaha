abstract: "Bu çalışmada Cezîrî tarafından telif edilen“el-fıkh 'ale'l-mezâhibi'l-erba'a”adlı eserin ibâdât bölümünde nakledilen görüşlerin Hanefîlere aidiyeti incelenmektedir. Giriş ve üç bölümden oluşan bu çalışmanın giriş bölümünde araştırmanın konusu, amacı, önemi, yöntemi, kapsamı ve sınırlılıkları ele alınmakta ve yararlanılan bazı kaynaklara işaret edilmektedir. Akabinde Cezîrî'nin, hayatı, eserleri ve el-Fıkh 'ale'l-mezâhibi'l-erba'a adlı eserin muhteva ile sistematiği tanıtılmaktadır. Birinci bölümde Hanefîlere ait olmadığı halde Cezîrî tarafından onlara atfedildiği tespit edilen on dokuz görüş açıklanmıştır. İkinci bölümde aslında zayıf görüş olduğu halde Cezîrî tarafından Hanefîlerin sahih görüşü olarak nakledilen yirmi görüş incelenmiştir. Üçüncü bölümde ise Hanefî mezhebinin birden fazla sahih görüşü arasından Cezîrî'nin sadece bir görüş vermekle yetinmesi üzerinde durulmuştur. Her üç bölümde de bu görüşlerin Hanefîlere aidiyeti mezhep kaynaklarında yer alan bilgilerle karşılaştırılarak tespit edilmiştir. Bu çalışmada ele alınan Cezîrî'nin el-fıkh 'ale'l-mezâhibi'l-erba'a adlı eseri, bazı eksiklikleri barındırsa da kaynak olma niteliğini korumaya devam etmektedir. Zira titiz bir çalışma sonucu ortaya çıkan bu eserde, tali bazı mesleler dışında mezheplere ait esas görüşler genel olarak doğru aktarılmaktadır."
