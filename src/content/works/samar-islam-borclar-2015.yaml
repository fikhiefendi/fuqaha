abstract: "İslam borçlar hukukunun temel konularından birisi olan akitlerde ca'lî şartlar, genel olarak tarafların akitle beraber ileri sürdükleri ve üzerinde anlaştıkları şartları ifade eder. Tez çalışmamızda ca'lî şartların kısımları, sınırları, bu sınırları belirleyen esaslar ve akitlere etkisi ele alınmıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında konun İslam borçlar hukuku içindeki yerine, önemine, amacına, sınırlandırılmasına ve kaynaklarına dair bilgilere yer verilmiştir. Birinci bölümde şart teriminin kavramsal çerçevesi ve genel anlamda akitlerde şart koşma hürriyeti ele alınmıştır. Bu bölümde şart teriminin tanımı ve kısımları, akitlerde şart koşma serbestisinin sınırları ve nasslardaki temellerine yer verilmiştir. Çalışmanın ikinci bölümü İslam hukuk doktrininde ca'lî şartlar ve akitlere etkisi konularına tahsis edilmiştir. Bu bölümde şarta ve zamana bağlılığı kabul edip etmemesi bakımından akitlere yer verildi. Son olarak takyîdî şartlar ve akitlere etkisi konuları ele alınarak bir değerlendirmede bulunuldu. Çalışmamız vardığımız neticeleri içeren bir sonuç bölümüyle tamamlanmıştır."
