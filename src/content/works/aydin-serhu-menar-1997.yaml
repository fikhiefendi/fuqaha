abstract: "ÖZET Şerhü'l-Menar, Arap fıkıh bilginlerinden Nesefî'nin kısaca Menaru'l-Envar adlı fıkıh kitabının Türkçe'ye yapılmış bir şerhi olup, eser, Kuzey grubuna giren Kıpçakçanın bir kolu olan Memlûk-Kıpçak Türkçesiyle yazılmıştır. Ketebe kaydındaki 1402 tarihi istinsah değil; teliftir.Bu kayda göre Mukbil b. Abdullah adlı bir zat tarafından yapılan Türkçe bu şerhi, daha sonra şeyhi Şeyh Saltuk'un önünde okumuş ve onun da fikrini almıştır. Türkçe şerh, satır arası tercüme olmayıp ayet, hadis veya bir Arapça ibareden sonra şerhine geçilmiştir. Tek yazma nüshası Bursa Haraççıoğlu Kitaplığı 697' de kayıtlıdır. Yazma 131 varak olup genellikle 18 satırdır.Bazı satırların 17, 19, 20 ve 21 satır oldukları görülür.Başı ve sonu mevcut olup, bu yönüyle tam bir nüshadır. Dili bakımından karışık özellikler gösteren eser üzerinde inceleme yapanlar genellikle eseri, Anadolu Türkçesinin ilk mahsullerinden saymışlardır.Oysa ki Kıpçak eserlerinin dili ile bir mukayese yapıldığında benzerlikler görülecektir.Bizim yaptığımız bu tez çalışması ile eseri, Memlûk-Kıpçak eserleri içerisine almış bulunmaktayız."
