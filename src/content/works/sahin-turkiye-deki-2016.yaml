abstract: "Bu çalışmada pazar odaklılığın işletme performansı üzerindeki etkisi incelenmiştir. Bu kapsamda pazar odaklılığın alt boyutlarından olan müşteri odaklılık, rakip odaklılık ve departmanlar arası koordinasyonun, işletme performansı ile birlikte işletme performansının alt boyutları olarak ele alınan yenilik performansı, finansal performans ve finansal olmayan performans üzerindeki etkileri analiz edilmiştir. Araştırma, Türkiye'de faaliyet gösteren katılım bankaları üzerinde yapılmıştır. Anket yoluyla toplanan veriler; faktör, güvenilirlik, t-testi, korelasyon ve regresyon gibi çeşitli analizlere tabi tutulmuştur. Araştırma sonucunda, pazar odaklılığın işletme performansı üzerinde pozitif yönlü ve anlamlı bir etkisi olduğu tespit edilmiştir."
