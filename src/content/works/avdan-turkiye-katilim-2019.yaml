abstract: "Gelişmekte olan piyasalarda, finansal sistemin işlevselliği önemlidir. Finansal sistem, ekonomik birimlerin tuttuğu atıl fonların reel sektöre aktarılmasında aracılık üstlenmektedir. Finansal derinlik kavramı ekonomide finansal yenilik sürecinde tasarrufları yatırıma dönüştüren kanalların yaygınlaşmasını ifade etmektedir. Finansal derinleşme ile kişi başına düşen finansal hizmet ve kuruluşların artması ve bu sayede finansal sistem içinde daha fazla kişinin yer alması sağlanmakta ve daha yüksek hacimli işlemler mümkün olabilmektedir. Finansal derinleşmenin sağlanması aynı zamanda reel sektöre fon aktarılmasını da olumlu yönde etkilemektedir. Bu araştırmanın amacı katılım bankalarının finansal derinleşme üzerindeki etkilerinin tespit edilmesidir. Araştırmada kullanılan veri seti TCMB ve TÜİK veri tabanlarından elde edilmiştir. Verilerin değerlendirilmesinde birim kök testi, Johansen Eşbütünleşme testi ve Granger Nedensellik testi kullanılmıştır. Katılım bankalarındaki temel faaliyetlerin (kredi ve mevduat işlemleri) uzun dönemde finansal derinlik üzerinde etkili olduğu ancak kısa dönemde finansal derinlik üzerinde etkili olmadığı tespit edilmiştir. Bu durum Türkiye'de katılım bankacılığı faaliyetlerinin finans ve reel sektör üzerindeki etkilerinin önemli olduğunu göstermektedir."
