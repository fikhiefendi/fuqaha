abstract: "Tezimde, Şafii mezhebine mensup olan İbnü'l-Mülakkın'in Hudud kitabı ile ilgili en önemli fıkhi kuralları inceledim. Araştırmama, İmam İbnü'l-Mülakkın'in kısa bir biyografisiyle başladım ve ardından kitabının öneminden bahsettim. Giriş bölümünde, fıkhi kuralların önemine ve benzeri kurallar ile farklarına (usuli kaide, fıkhi zapt, eşbah ve nezair gibi) değindim. Fıkhi kuralların delil olma konusundaki âlimlerin mezheplerini, bu ilmin gelişim aşamalarını ve Şafii mezhebinin bu konudaki katkılarını anlattım. Araştırmaya, hududun hakikati ve suçların genel sınıflandırılması ile başladım, ardından hududun teşriinin hikmetini ele aldım. Yirmi fıkhi kural zikrettim; bunlardan ikisi nastan alındı, on bir kural doğrudan ifade edilmiş ve geri kalanlar ise istinbat yoluyla çıkarılmıştır. Kuralların çoğu genel, bazıları ise kapsamlıdır. Açıkça belirtilenleri önce, doğrudan ifade edilenleri ise ardından ele aldım, istinbat edilenleri ise en son zikrettim. Kapsamlı kuralları genel kurallardan önce verdim ve her kuralın önemini tartıştım. Eğer kural diğer mezheplerde de varsa, o mezheplerin kaynaklarına dayandırdım. Kuralın bireysel ve genel anlamını, dayandığı temeli ve ilgili hükümleri zikrettim. Eğer âlimler arasında görüş ayrılığı varsa, her görüşün delillerini belirttim ve kuralın İbnü'l-Mülakkın'in kitabındaki uygulamalarını zikrederek sonlandırdım. Araştırmayı, ulaştığım en önemli sonuçları belirterek bitirdim. En önemli sonuçlardan biri, Allah'ın hududu insanlara azap olarak değil, rahmet olarak belirlediğidir. Kuralları bilen kişinin birçok fer'i meseleleri ezberlemesine gerek kalmadığını ve başkaları arasında çelişen şeylerin kendisinde birleştiğini belirttim. Ayrıca araştırmacı arkadaşlarıma ve ilim talebelerine bazı tavsiyelerde bulundum."
