abstract: "İslam dinindeki faiz yasağı insanları klasik bankalarda işlem yapmaktan uzaklaştırmış, fon sahibi ve fon ihtiyacı olan insanların ekonomi dışında kalmasına sebep olmuştur. Bu durumun ortadan kalkması ve faiz hassasiyetine sahip insanların ekonomik faaliyetlere dahil olma ihtiyacı katılım bankalarının doğuşuna sebep olmuştur. İslami bankacılık, Faizsiz bankacılık gibi isimlerle de anılan katılım bankaları fon sahiplerinden faizsiz yollarla fon toplayıp ekonomiye kazandırmak ve yine faizsiz yollarla fon talep edenlerin ihtiyaçlarına cevap vermek için faaliyet gösteren bankacılık türü olarak ortaya çıkmıştır. Mali analiz işletmelerin finansal tablolarına uygulanan teknikler yardımıyla işletmelerin mevcut durumunun belirlenmesi, değerlendirilmesi ve geleceğe yönelik yorumlar yapılması işlemleridir. Bu analizler işletmelerin karlılık durumundan sermaye yeterliliğine, likidite durumundan borç-alacak oranlarına kadar birçok durumu ortaya koyarak yöneticilerin kalma alma süreçlerine destek olmaktadır. Finansal risk analizi ise işletmelerin mevcut risk durumunu hesaplayarak geleceğe dönük tahminler veren, karar alma süreçlerinde yöneticilere yardımcı olan ve mali analiz sonuçlarının verimliliği açısından analizciye destek olan bir analiz türüdür. Bu çalışma da katılım bankalarının mevcut finansal durumlarını ortaya çıkarmak, sektördeki durumunu tespit etmek, gelecek yılları hakkında tahminler yapmak amacıyla risk ve mali analiz yöntemleri uygulanmıştır. Risk analizi yardımıyla katılım bankalarının riske karşı dayanıklılığı, mali analiz ile ise bankaların finansal görünümleri, yıllar içindeki gelişimi ortaya çıkarılmıştır."
