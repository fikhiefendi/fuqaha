abstract: "slâm sorumluluk hukuku, zararların giderilmesini esas alır. nsana ve mala gelen zararlardan sorumluluk, cezâî ve hukûkî olarak ikiye ayrılmaktadır. Günümüz modern hukukunda zamanın degismesine bagl ı olarak ortaya konulan sorumluluk ilkelerine, zararın giderilmesi açısından bakıldıgında islâm hukukunun daha önceden bu ilkeleri ortaya koydugunu görmekteyiz. slâm sorumluluk hukukunda tazmin için kusur, genel ve önemli bir prensip olmakla birlikte, kusursuz sorumluluk daha dar ve istisna özelligi tasımaktadır. slâm hukuku olaya zararların izalesi açısından bakarak magduriyetleri gidermek, adaleti gerçeklestirmek ve mutlu bir toplum olusturmak temelinde degerlendi rmektedi r. Tehlike sorumlulugunun ortaya çıkabilmesi için fiil veya olgu, illiyet bagıyla bi rlikte tehl ike bagının mevcudiyeti ve zararın gerçeklesmesi gibi unsurlar ın bulunması gerekmektedir. Tehlike sorumlulugunda genel sorumluluk unsuru olan f iilin mutlaka bulunması gerekmemekte ve olgusal tehlikenin varlıgı yeterli olmaktadı r. Günümüz modern hukuk dokt rininde de tartısılan ?tehlike sorumlulugu? kavram olarak slâm hukukunda bulunmamakla beraber mantıksal olarak düsünüldügünde temel alt yapısının var oldugu ortaya çıkmaktadır. Tehlike sorumlulugunu ortaya çıkaran temel nedenler, sebebiyet düsüncesi, kusuru ispat güçlügü ve kamu yararı anlayısıdır. slâm hukuk dokt rininde bütün bunların bulundugu kanısındayız. slâm hukuku, sebebiyet anlayısını benimsemis ve belli sartlar dahilinde kabul etmistir. Bundan dolayı tehlike sorumluluguna aynı zamanda sebep sorumlulugu da denilmektedi r. Adaleti gerçeklesti rmeyi ve zararlar ı gidermeyi sadece kusura indi rgedigimizde ortaya çıkan her zararı gidermek mümkün olmadıgı gibi bir çok adaletsizliklerin ortaya çıkması da kaçınılmazdı r. Çünkü basit bir ihmal belki de olaganüs tü büyük zararların ortaya çıkmasını saglayabilir. Kusur oranına göre hareket edildiginde magdur ların acıları dindirilemeyecektir. Bu nedenle slâm hukuku, kusurdan ziyade sonuca önem vermis ve zararın ortaya çıkıp çıkmamasına bakmıs ve giderilmesini esas almıstır. Sonuç olarak, temelde slâm hukukunun asırlar önce ulastıgı tehlike sorumlulugu anlayısına ancak 19. yüzyı ldan sonra ulasıldıgını tespit etmis bulunmaktayız."
