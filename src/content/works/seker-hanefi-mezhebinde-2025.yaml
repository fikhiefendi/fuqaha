abstract: "Fıkhın anlaşılması, daha iyi kavranması yeni problemlerin çözümünde ondan istifade edilebilmesi açısından önem arzetmektedir. Bu bağlamda çalışmamızda günlük hayatta sıkça kullanılan mu'âmelâtın malî sözleşmelerini kapsayan özel borç ilişkilerindeki ihtilâflar ele alınmıştır. Hanefî mezhebinin kurucu fakîhlerinden İmâm Ebû Hanîfe, İmâm Ebû Yûsuf, İmâm Muhammed ve İmâm Züfer arasında bu konuda ortaya çıkan görüş ayrılıkları ve gerekçeleri detaylı bir şekilde incelenmiştir. Araştırmamız giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümünde Hanefi mezhebinde kurucu imâmlar ve borçlar hukukunun genel çerçevesi zikredilmiştir. İkinci bölümde ise ihtilâf kavramı ifade edilerek kurucu fakîhlerin özel borç ilişkilerine dair görüş ayrılıkları işlenmiştir. Yapılan çalışma neticesinde, kurucu imâmlar arasındaki görüş ayrılıklarının bazı durumlarda müşterek kanaate, bazılarında ise karşılıklı muhalefete dönüştüğü tespit edilmiştir. Buna göre İmâm Ebû Hanîfe birçok konuda talebeleri ile aynı kanaati paylaşmıştır. Bazı konularda ise talebelerinin ittifâk ederek hocalarından ayrıldıkları, kimi meselelerde ise üç imâmın birbirinden bağımsız görüş beyan ettiği görülmüştür. Bu görüş ayrılıkları, fıkhın zamanın şart ve ihtiyaçlarına uygun çözüm ve tercih üretmekte ne kadar canlı bir yapıya sahip olduğunu göstermektedir. Ayrıca görüş ayrılıklarının dayandığı delillerin çoğunlukla zannî olması, hadislerin sıhhat derecelerine ilişkin değerlendirmeler, delillerle ilgili farklı tercihler, dönemin değişen piyasa şartları, kolaylık ve maslahatın esas alınması, delillerin farklı yorumlanması ve bunlara bağlı olarak ictihâdî usûl farklılıkları gibi çeşitli sebeplerden kaynaklandığı belirlenmiştir. Bu ihtilâflar, Hanefî fıkhının dinamik, zengin ve esnek yapısını ortaya koymakla kalmayıp aynı zamanda fıkhî görüşlerin anlaşılmasına ve gelişmesine katkı sunmuştur."
