abstract: "Bu çalışma Hanefî usûl düşüncesinde neshi tespit yollarını cumhurla mukayeseli olarak ele almakta ve örneklerle desteklemektedir. Ayrıca, Hanefilerin mütekaddim ve müteahhir dönemini dikkate alarak Hanefî mezhebinde neshi tespit yollarına dair genel bir portre çizmektedir. Hanefîlerin çoğunluğu tarafından kabul gören neshi tespit yolları şunlardır: Kur'an ve sünnet, icmâ, sahabe beyânı, tarihlerin bilinmesi, tarihler bilinmediği zaman asılların delâleti ve râvinin rivâyetine muhâlefeti. Hanefîlerin, neshin tespitinde cumhura kıyasla daha geniş bir usûl benimsedikleri görülmektedir. Tarihler bilinmediğinde asıllara dayanarak neshi tespit ve ravinin rivayetine muhalefeti, cumhur tarafından neshi tespit yolları arasında sayılmadığı halde Hanefî usûlcüler tarafından neshi tespit yolları arasında zikredilmiştir. Ayrıca Hanefîler, sahabeden gelen nesih haberlerini daha fazla kabul etmektedir. Hanefîlerin neshin tespiti konusundaki bu yaklaşımlarının temel sebeplerinden bazıları şunlardır: a) Hanefîlerin genel nesih teorisi, cumhura kıyasla neshe daha geniş bir alan tanımaktadır. b) Hanefîlere göre sahabe kavli hüccettir ve neshin tespiti konusunda da bu otoriteyi korumuştur. c) Hanefîler, cumhurun tercih yolları arasında saydığı bazı yöntemleri neshin alanına dahil etmiştir."
