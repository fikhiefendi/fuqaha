abstract: "Teknolojide her alanda meydana gelen değişim ve gelişmelerin bankacılık sektörüne de yansımasıyla birlikte, geleneksel bankacılık faaliyetlerinin yanında dijital bankacılık faaliyetleri var olmuştur. Bu çalışma bankacılık sisteminde, katılım bankalarının dijital platformlar üzerinden müşterilerine sunmuş oldukları hizmetlerde özellikle üniversite öğrencilerinin bu hizmetleri değerlendirmelerine ilişkin analizleri içermektedir. Teknolojiye bağlı olarak gelişen dijital bankacılık kapsamında, çağdaş bankacılık sisteminde, bankaların dijital platformlar üzerinden müşterilerine sunmuş oldukları hizmet kanalları incelenerek, dijital bankacılık faaliyetlerinin kurum ve müşteriler için avantaj ve dezavantajları ele alınmıştır. Katılım bankacılığında dijitalleşme faaliyetlerini üniversite öğrencilerinin değerlendirmesi amacıyla ele alınan çalışma dâhilinde katılım bankalarının dijital bankacılık hizmetleri detaylı şekilde incelenmiştir. Çeşitli üniversite ve bölümlerden seçilen öğrencilere anket tekniğiyle sorular yöneltilerek elde edilen veriler dâhilinde; öğrencilerin bankacılık işlemlerinde dijital bankacılık kanallarını oldukça sık tercih ettikleri gözlemlenmiştir. Araştırma kapsamında incelenen teorik çerçeve ve ilgili konudan elde edilen sonuçlar analiz edilerek rapor edilmiştir."
