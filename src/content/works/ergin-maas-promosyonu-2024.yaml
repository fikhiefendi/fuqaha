abstract: "Bankacılık sektörünün gelişimiyle birlikte, çalışanların ücret, prim ve ikramiye gibi tüm mali ödemeleri bankalar aracılığıyla yapılmaya başlamıştır. Maaş tutarının toplu bir şekilde ve belirli bir süre önce bankaya yatırılması ve diğer bankacılık ürünlerinin pazarlanmasına karşılık olarak, maaş promosyonu olarak ifade edilen birtakım ek mali menfaatler ortaya çıkmıştır. Çalışmamız kapsamında, farklı çalışan gruplarına yönelik maaş promosyonunun uygulama biçimi, yasal düzenlemeler ve promosyonun İslam Hukuku açısından durumu gibi hususlar ele alınmıştır. Çalışma giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde; araştırmanın konusu, önemi ve amacı ile istifade edilen kaynaklar hakkında bilgi verilmiştir. Birinci bölümde, banka hesaplarının hukuki mahiyeti ve bu konudaki tartışmalara yer verilmiştir. İkinci bölümde promosyonun tanımı, günümüz uygulamaları, yasal düzenlemeler ve mahkeme kararlarına değinilmiştir. Üçüncü bölümde ise İslam Hukukçularının promosyona ilişkin görüş ve delilleri incelenmiştir. Buna göre, promosyonun caiz olmadığı ve caizliği yönünde iki farklı yaklaşımın bulunduğu ve birinci yaklaşım çerçevesinde promosyonun ribâ/faiz veya faiz şüphesi barındırdığı, diğer bir görüşe göre ise hibe/hediye kavramları ile ilişkilendirildiği görülmüştür. Sonuç kısmında genel bir değerlendirme yapılmış, promosyona ilişkin görüş ve önerimiz belirtilerek çalışmamız tamamlanmıştır."
