abstract: "Açılımı“Do Not Resuscitate”, Türkçe tercümesi ile de“canlandırma yapma”manasına gelen DNR talebi, hukuki açıdan geçerli olacak şekilde hasta tarafından kardiyopulmoner resüsitasyonun (KPR) gerçekleşmemesini talep ettiği bir form doldurulmasıdır. Hasta bu formu, kalbi ve solunumu durduğunda gerçekleştirilecek kalp masajı ve suni solunum gibi canlandırma müdahalelerini önlemek için doldurmaktadır. DNR talebi hakkında sunulan en önemli gerekçelerden biri hastanın acı ve ıstırap içindeki hayatının gereksiz bir şekilde uzatılmasını önlemektir. Bunun dışında DNR talebinin uygulanma sebepleri arasında terminal dönemdeki bir hastada acıyı arttıracak fakat aynı zamanda da başarı oranın oldukça düşük olduğu öngörülen bir tedaviden kaçınmak, hastanın onurlu bir şekilde ölmesini sağlamak ve benzeri kaygılar da görülmektedir. Hastanın bizzat kendisi, vekili veya birinci derecedeki yakınları bu formu doldurabilmekte, sözlü talep ise hukuken geçerli sayılmamaktadır. DNR talebinde bulunan hastanın kararına sağlık ekipleri tarafından saygı gösterilmelidir. Ayrıca bu talepte bulunan hastanın tedavisinde ya da bakımında herhangi bir aksama olmaması beklenmektedir. DNR talebi felsefi ve etik boyutu ile birçok araştırmanın konusu olmasına rağmen İslam hukuku açısından incelenmesi oldukça yetersiz kalmaktadır. Bu talebin Türkiye'de yasal geçerliliği olmamakla birlikte bu şekilde canlandırma müdahalelerin reddi, oldukça yoğun bir şekilde Müslümanların yaşadığı Amerika'da ve Avrupa ülkelerinin birçoğunda geniş uygulama alanına sahiptir. Türkiye'de geçerli resmi bir form olmamasına rağmen hasta veya hasta yakınları tarafından kalp masajının ve suni solunumun gerçekleştirilmemesi gibi taleplerlerde bulunulduğuna şahit olunabilmektedir. Bu nedenle DNR talebi başlığı altında canlandırma müdahalelerini reddetme hakkının İslam hukuku açısından incelenmesi oldukça önemlidir."
