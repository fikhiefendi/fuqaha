abstract: "Tezimizde Hanefi fıkıh alimlerinden Nakibzâde Hâlid Ayni'nin ?Neticetü'l-Usûl? adlı eserini tahkik ederek, müellifin hayatı, fıkıh usulü alanındaki görüsleri, ve eserin fıkıh usulü tarihindeki yeri gibi konuları arastırıp degerlendirdik. Çalısmamız bir giris, üç bölüm ve bir sonuçtan olusmaktadır. Giris bölümünde eserin nüshaları ile ilgili bilgileri verdikten sonra tahkik ve tahlilde izledigimiz metotları belirttik. Birinci bölümde eserin müellifi olan Nakibzade'nin hayatı ve yasadıgı dönemle ilgili elde ettigimiz bilgileri ve ulastıgımız bütün ipuçlarını degerlendirdik. kinci bölümde müellifimizin“Neticetü'l-Usul”adlı eserinin tahlilini yaptık. Üçüncü bölümde tahkikli metni verdik. Sonuç bölümünde ise çalısmamız neticesinde vardıgımız sonuçları ortaya koyup bir degerlendirme yapmaya çalıstık. Tezimizin müellifin hayatını, eserlerini ve fıkıh usulü alanındaki görüslerini içine alan birinci bölümünde kaynak taraması ve analizi teknigini kullandık. Nüsha incelemesi yaptıgımız son bölümde ise eserin nüshalarını arastırdık, müellif nüshasına ulasmaya çalıstık ve elde ettigimiz nüshadan eserin tahkikini yaptık. Eserin tahlil ve degerlendirilmesinin yapıldıgı ikinci bölümde ise yine kaynak taraması ve analizi teknigini kullandık. Tezi yapmaktaki amacımız, Neticetü'l-Usul adlı eseri tahkik ederek istifadeye hazır hale getirmek ve eserin müellifi olan Nakibzade Halid Ayni'nin hayatını ve fıkıh usulü alanındaki görüslerini sistemli bir sekilde ortaya koymaktır. Hatalarımızın iyi niyetle karsılanacagını umuyor ve çalısmamızın okuyuculara faydalı olmasını temenni ediyoruz."
