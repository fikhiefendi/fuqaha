abstract: "Dinî muhtevalı suallere âlimler tarafından verilen cevaplara fetva denir. İstiftâ ve iftâ ameliyeleri insanlık tarihi kadar eskidir. Hz. Peygamber'in vefatından yetmiş sene sonra dünyaya gelen Ebû Hanîfe'nin kurduğu mezhep umumen Müslümanlar ve hususen Türkler arasında en yaygın fıkıh ekolüdür. Bu mezhep, sûfîler vasıtasıyla X. asırdan itibaren Hint alt kıtasında da yayılmaya başlamış; Delhi Sultanlığı zamanında hâkim mezhep hâline gelmiştir. Bâbürlüler döneminde ise resmî mezhep olamamışsa da Fetâvâ-yı Hindiyye ve onun hâmîsi Âlemgîr Şah vasıtasıyla kazâ ve iftâ faaliyetlerinin merkezinde yer almıştır. Âlemgîr Şah umumen Sünnî İslâm'ı ve hususen Hanefî mezhebini himaye etmiştir. Ülke genelinde hukuk anarşisinin önüne geçmek için Fetâvâ-yı Hindiyye'yi dönemin en muteber âlimlerinin yer aldığı bir heyete telif ettirmiştir. Bu eser Hanefî mezhebinin fetvaya medar olan görüşlerini esas almıştır. Bölgenin örf ve gelenekleri telif sürecinde göz önünde bulundurulmuştur. Kadı ve müftülere görevlerini icra ederken Fetâvâ'yı başvuru kaynağı olarak kullanmaları emredilmiştir. Eser, telif edildiği dönemde çokça istinsah edilip İslâm coğrafyasının muhtelif yerlerine gönderilmiştir. Arapça kaleme alınan Fetâvâ; Farsça, İngilizce, Urduca ve Türkçe gibi dillere çevrilmiştir. Kendi döneminde etkili olan eser, birçok fıkıh kitabının ve kanun metninin kaynakları arasında yer almıştır. Gerek Fetâvâ gerekse Âlemgîr Şah hakkında birçok menfi iddialar ileri sürülmüştür. Bu çalışmada hem Fetâvâ-yı Hindiyye hem Âlemgîr Şah ve telif heyeti hakkında ulaşabildiğimiz bilgileri sunacak hem de bu iddiaların cevaplarını arayacağız. Ayrıca Kanun-ı Âlemgîrî ile Fetâvâ'yı ana hatlarıyla karşılaştıracak, Fetâvâ'nın vakıf kitabıyla bazı seçme meselelerin karşılaştırmalı analizini yapmaya çalışacağız. Çalışmamızın Türkçe'de bu kıymetli kitap hakkındaki ilk akademik eser olmasının mutluluğunu yaşarken sonuncu da olmamasını ümit ediyoruz."
