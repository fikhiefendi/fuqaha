abstract: "Bu çalışmada İslâm Hukuku'nda boşanma çeşitlerinden biri olan muhâlea konusuna teorik olarak değinilmiş, Osmanlı Dönemi mahkemelerinde teorinin uygulamaya dönüşmesi İstanbul kadı sicillerindeki uygulamalar ele alınarak incelenmiştir. Çalışma çeşitli yıllara ait toplam yetmiş iki sicil ve bin dört yüz yetmiş dört davanın incelenmesiyle oluşturulmuştur. Eşlerin anlaşarak boşanması anlamına gelen muhâlea, kadı sicillerde en fazla başvurulan boşanma çeşididir. Çalışmada muhâleanın bir talâk çeşidi olması sebebiyle öncelikle kısa bir şekilde talâk konusuna değinilmiş, daha sonra muhâlea konusunun teorik boyutu incelenmiştir. En son bölümde ise, İstanbul kadı sicillerinde bulunan muhâlea ile alakalı kayıtlar ayrıntılı bir şekilde ele alınarak Osmanlı Dönemi'nde uygulanan muhâlea örneklerine yer verilmiştir. Çalışma sonucunda Osmanlı Dönemi'nde mahkemelerin İslâm Hukuku ve geleneğine sahip çıkarak uygulamaya koyduğu gözlenmiştir."
