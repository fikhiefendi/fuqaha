abstract: "Gelişen dünya ekonomisiyle birlikte bankacılık sektöründe de büyüme ve gelişmeler yaşanmıştır Katılım bankaları; dini hassasiyete sahip kesim ile ülkemizde son dönemde önemi gittikçe artan bankacılık sistemidir. Atıl kalan fonların hem ülke ekonomisine hem diğer ülkelerin ekonomilerine kazandırılmasını sağlamak amacıyla faaliyette bulunan katılım bankaları, son dönemlerde devletin de desteğiyle birlikte bankacılık sektöründe önemli bir yere sahip olmuşlardır. Dünya'da 1960 yılından sonra katılım bankalarının faaliyetleri artmıştır. Katılım bankaları ülkemizde ise 1980'li yıllardan itibaren hızla gelişmeye başlamıştır. Katılım Bankacılığı sistemi, kamu sermayeli Ziraat Katılım, Emlak Katılım ve Vakıf Katılım; özel sermayeli Kuveyt Türk Katılım, Albaraka Türk Katılım, Türkiye Finans Katılım ile ülkemizde faaliyetlerine devam etmektedirler. Bu çalışmada öncelikle İslam Ekonomisine dair temel bilgiler verilecek daha sonra Katılım Bankacılığının; tanımı tarihsel gelişimi, katılım bankacılığına ihtiyaç duyulma nedenlerini, fon toplama yöntemleri, fon kullandırma yöntemleri, Türkiye'de faaliyet gösteren katılım bankalarının sektör içerisindeki faaliyetleri ile ilgili karşılaştırmalı olarak incelemelerine yer verilmiştir. Bankacılık sektörü ve katılım bankacılığı sektöründe 2016-2020 yılları arasında ödemiş oldukları kurumlar vergisi miktarları ve sektör payları ile ilgili bilgilere yer verilmiş olup katılım bankalarının faaliyetlerinin artış gösterdiği, ödemiş oldukları kurumlar vergisinin yıllar içerisinde arttığı ve ülke ekonomisi üzerinde kayıt dışı ekonomiyi azaltma, istihdamın artması, ekonomik krizlerin olumsuz etkisini azaltma ve rekabet ortamının gelişmesine katkı sağlamak gibi olumlu sonuçları olduğuna ulaşılmıştır."
