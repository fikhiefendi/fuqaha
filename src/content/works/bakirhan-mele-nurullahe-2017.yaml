abstract: "Kürt çocukları için hazırlanmış ve Kürtçe akide/ilmihal kitaplarına güzel bir örnek teşkil eden, Mele Nurullahê Godîşkî'ye ait“Çenta Yetîman”adlı eser üzerinde yapılan bu tez çalışmasıyla, genel olarak akide ve fıkıh ilimlerinin gayelerine değinilmiş ve Kürtler arasında yaygın olan, medreselerde okutulan Kürtçe akide kitaplarının öneminin tespit edilmesi amaçlanmıştır. Özelde ise eserin Kürt diline katkıları ve diğer Kürtçe akide kitaplarıyla benzer ve farklı noktalarının tespiti amaçlanmıştır. Kitabın, yapılan tercüme ve transkripsiyon çalışmaları ile daha geniş bir kitleye ulaşmasını hedefleyen bu çalışma neticesinde,“Çenta Yetîman”ın elde edilen iki nüshası arasındaki değişiklikler tespit edilmiş, kitabın kullandığı dil ve konuları işleyiş tarzı bakımından özgün bir eser olduğu anlaşılmıştır.“Çenta Yetîman”bağlamında da Kürtçe akide kitaplarının genel olarak birbirine benzediği, medrese eğitimi almış olan yazarlarının, bunları yazmadaki amaçlarının halkın ihtiyaç duyduğu itikadî bilgileri ele almak, halkı dini yönden eğitmek ve onların itikadî yönden yozlaşmalarını önlemek olduğu tespit edilmiştir."
