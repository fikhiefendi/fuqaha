abstract: "İslami ilimlere ait bilgi birikiminin belirli bir düzeye ulaşıp tedvin edilmesinden sonra mevcut bilgiyi özetleme ve düzenleme gibi her ilmin kendine has ihtiyaçları telifte daha çok ihtisar olarak isimlendirilen ilmî bir faaliyet başlatmış, bu faaliyet sonucunda muhtasar adıyla yeni bir telif türü ortaya çıkmıştır. Fıkhî faaliyetlerin mezhebe bağlı olarak yürütülmesi sebebiyle fıkıhta ihtisar, her mezhepte imam kabul edilen şahsiyetlerin görüşleri üzerine mezhep içi bir faaliyet olarak gerçekleştirilmiştir. Hanefî mezhebindeki ihtisar faaliyetlerinde, Ebû Hanîfe ile onun mezhepte imam kabul edilen öğrencileri Ebû Yûsuf ve Muhammed eş-Şeybânî'nin görüşleri esas alınmış; ihtisarın ana kaynaklarını onların görüşlerini ihtiva eden eserler oluşturmuştur. Hanefî fıkhını ihtisara yönelik ilk faaliyetler hicrî III. asırda başlasa da mezhep fıkhını kuşatıcı mahiyette ilk muhtasarlar IV. asırda Tahâvî, Hâkim eş-Şehîd el-Mervezî ve Kerhî tarafından kaleme alınmıştır. V. asırda Kudûrî'nin bu çalışmalardaki tecrübeden istifade ederek kaleme aldığı muhtasarın hemen herkes tarafından kabul görmesiyle metinler standart bir yapıya kavuşmuş; onun metnini esas veya örnek alan Vikâye, Mecma'u'l-bahreyn, Kenzü'd-dekâik ve el-Muhtâr'ın kaleme alınmasından sonra bu eserler el-mütûn adıyla mezhebin en muteber temel metinleri kabul edilmiştir. Mezhep fıkhının ihtisar sürecinin son metinlerini temsil eden Gurer, Mültekâ, Tenvîru'l-ebsâr gibi eserler ise daha çok bunları cem, telif ve ikmal etme amacıyla kaleme alınmıştır."
