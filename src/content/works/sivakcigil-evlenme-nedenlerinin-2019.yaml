abstract: "Bu çalışmada, teori ve pratikte aile kurumu ele alınmıştır. İslam hukukunda evlilik nedenlerinin tespiti ile Gaziantep ilinde yaşayan ve Antepli olan öğretmen ve sağlık çalışanlarıyla görüşme (mülakat) usulü kullanılarak evlilik nedenlerinin araştırılması amaçlanmıştır. Çalışmamızda, İslam'da evliliğin teşvik edildiği, zina tehlikesinde farz olduğu, şiddet ve benzeri durumlarda ise haram olduğu belirlenmiştir. Gaziantep özelinde yapılan çalışmada mesleklerin ve geleneklerin evlilik üzerinde etkisinin olduğu tespit edilmiştir. Evlilik öncesi tanışmalarda, evlilik içi ilişkilerde, çocuk sayısında çevre etkisinin oldukça yüksek olduğu belirlenmiştir. Sağlam bir yuva kurmanın ve bunu devam ettirmenin en etkili yolunun sevgi, saygı, sadakat, anlayış, dürüstlük gibi temel değerler olduğu görülmüştür. Gaziantep'te nikâh dışı birlikteliklerin onaylanmadığı sonucuna ulaşılmıştır. Ailenin önemli bir kurum olduğu, bu kurumun sağlam olarak devam etmesinin toplumun ve devletin geleceği için elzem olduğu vurgulanmıştır."
