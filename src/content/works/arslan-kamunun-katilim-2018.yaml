abstract: "Türk mali yapısı kapsamında bankacılık sektörüyle mukayese edildiğinde çok kısa olan tarihsel serüveni bulunan Katılım Bankaları, ülkemiz coğrafyasındaki ekonominin ve siyasal merkezin etkisiyle beraber içinde bulunduğumuz dönemlerde çok hızlı bir ilerleme süreci meydana gelmiştir. Faizsiz bankacılık sermayenin global bir hale gelmesiyle sermaye eksikliği ile karşı karşıya kalan gelişmekte olan devletlere yeni kaynaklar sunmaktadır. Diğer yandan, toplumun faizle ilgili dini sebeplerle hassasiyeti dikkate alındığında ekonomiye tam olarak kazandırılmamış girdi olarak ciddi bir veri sağlamaktadır. Bu araştırmanın amacı ülkemizde kamu bankalarının katılım bankacılık sektörüne girmesiyle katılım bankacılık sektörü ve Türkiye ekonomisine muhtemel olumlu ve olumsuz etkilerinin araştırılmasıdır. Araştırma üç ana bölümden oluşmaktadır. Araştırmanın birinci bölümünde global ekonomide ve Türkiye'de faizsiz bankacılığın ortaya çıkışı ve gelişimiyle ile ilgili literatür taraması yapılmıştır. Araştırmanın ikinci bölümünde yine literatür taraması ile faizsiz bankacılık sistemi ile konvansiyonel bankacılık sistemi arasındaki farklılıklar, faizsiz bankacılığın avantajlı ve dezavantajlı yönleri ve katılım bankacılığında kullanılan fon toplama ve fon kullandırma yöntemleri ortaya konmuştur. Araştırmanın üçüncü bölümünde ise literatür taraması sonuncunda Türkiye'de faaliyet gösteren katılım bankalarında üst yönetim kademelerinde görev yapan yöneticilerin konu ile ilgili olarak düşünce ve fikirlerinin alınması amacıyla araştırmanın amacına doğrultusunda beş adet açık uçlu soru hazırlanmıştır. Araştırmamızla ilgili olarak Türkiye'de faaliyet gösteren katılım bankalarında (Vakıf Katılım, Türkiye Finans, Kuveyt Türk, Albaraka Türk, Ziraat Katılım) üst yönetim kademelerinde görev yapan yöneticilere telefon ve elektronik posta yöntemiyle ulaşılmış ve araştırmayla ilgili bilgi verildikten sonra araştırmamıza katılıp katılamayacakları sorulmuştur. Bazı yöneticiler iş yoğunluğu nedeniyle araştırmamıza katılmaya olumsuz cevap vermişlerdir. Araştırmamıza katılmaya olumlu cevap veren yöneticilere araştırmamızla ilgili olarak hazırlanan beş adet açık uçlu soru kendilerine yöneltilmiş ve konu ile ilgili fikir ve düşünceleri alınmıştır. Araştırmamızdan elde ettiğimiz sonuçlar; Dünya'daki katılım bankaları örnekleri incelendiğinde özellikle Körfez ülkeleri ve Asya'daki ülkelerde Türkiye'ye oranla bankacılık sektöründeki pazar payının oldukça yüksek olduğu görülmektedir. Bu ülkelerde katılım bankalarının bankacılık sektörü içindeki pazar payının yüksek olmasının; katılım bankalarının çok uzun zamandır faaliyet göstermesi ve fetva kurullarının kurumsallaşmasından kaynaklandığı düşünülmektedir. Türkiye'de ise Katılım Bankacılığı her geçen gün artmakla birlikte toplam bankacılık faaliyetleri içerisindeki pazar payının yetersiz olduğu görülmektedir. Katılım bankacılığının topluma tanıtılamamış olması katılım bankacılığının gelişmesi ve ilerlemesi açısından ciddi bir eksikliktir. Türkiye'de fetva kurulunun kurulamaması nedeniyle geliştirilen ürün ve hizmetlerin İslam hukukuna uygun olup olmadığı konusundaki katılım bankaları arasında tartışmalara neden olmakta; bu da katılım bankalarının bu ürün ve hizmetleri sunarken müşteriler nezdinde güvensizliğe sebep olabilmektedir. Aynı zamanda katılım bankacılığı alanındaki yasal düzenlemelerin eksik olması ya da bu düzenlemelerin yapılamamış olması katılım bankacılığının pazar payının artmasını engellemektedir. Katılım bankalarının müşterilerine sundukları ürün ve hizmet yelpazesi konvansiyonel bankalara göre yeterince geniş olmaması katılım bankalarının pazar payının sınırlı kalmasına neden olmaktadır. Katılım bankalarının sermaye problemleri ülke genelinde yeterince şube ağını genişletememesi nedeniyle geniş kitlelere ulaşmada sıkıntılar yaşamaktadır. Şube ağının yaygın olmaması nedeniyle bazı banka işlemlerini gerçekleştirememesi nedeniyle mevcut müşterilerin taleplerini karşılayamamaktadır. Kamu katılım bankalarının açılması ile birlikte katılım bankacılığının toplam pazar payı nispeten artmış olduğu gözlenmekle birlikte beklenen düzeye henüz ulaşamamıştır. Kamu katılım bankalarının devlet kurumu olması nedeniyle müşterilerin güvenirlik açısından daha fazla tercih edilmesi kamu katılım bankaları açısından bir avantaj sağlamaktadır. Katılım bankacılığını tercih eden müşteriler ve firmalar kamu katılım bankalarını devlet güvencesinde olması ve marka olarak risksiz buldukları için kamu katılım bankalarını daha fazla tercih etmektedirler. Türkiye'nin konvansiyonel banka müşterileri olup katılım bankacılığına geçebilecek müşteri potansiyeline sahip olduğu ve bunun daha orta vadede gerçekleşeceği düşünülmektedir. Şu anda %5 düzeyinde olan pazar payı orta ve uzun vadede %15 seviyelerine çıkması öngörülmektedir. Gelecek dönemlerde katılım bankalarının sayısının; bankacılık sektörünün büyüklüğü dikkate alındığında kamunun yanında özel sektör tarafından gerçekleşecek olan yatırımlarla artış göstermesi beklenmektedir. Kamu Katılım bankaların bankacılık sektöründeki pazar payının Türkiye ekonomisinde olumlu yönde gelişmeler olduğu takdirde 2023 yılı için ilk etapta %10, ilerleyen zamanlarda %15 seviyelerine ulaşılabileceği düşünülmektedir. Kamu katılım bankalarının finansman aracılığı ile girişimcilerle ortaklık kurma görevini üstlenerek ülkenin gelişmesinde ve kalkınmasında aktif rol oynayabilecek seviyeye ulaşmaları gerekmektedir."
