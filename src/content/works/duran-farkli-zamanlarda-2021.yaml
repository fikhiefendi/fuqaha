abstract: "Bu çalışmanın amacı Osmanlı döneminde farklı zamanlarda farklı nitelikte şahıslar tarafından yazılmış, mûsikînin helal ya da haram olmasını, semâ, devrân, raks, tegannî, zikir, lahn bağlamında inceleyen ve hangi delilleri kendi görüşlerini desteklemek adına gösterdiklerini ifade ettikleri bir takım risâleleri inceleyerek tahlil etmektir. Bu kapsamda iki adet farklı şahıslarca yazılmış Osmanlıca risâleler günümüz Türkçe'sine aktarılarak incelenmesi sonucunda dayandırdıkları deliller tahlil ve tasnif edilmiştir. Bu çalışma dört bölümden oluşmaktadır. Öncelikle giriş kısmında semâ ve semâ risâleleri hakkında tarihsel olarak genel bilgiler verilmiştir. Birinci bölümde incelenen risâlelerin yazarlarının biyografileri ve inceleme konusu olan risâlelerin tanıtımı yapılmıştır. İkinci bölümde inceleme konusu olan risâlelerin günümüz Türkçe'sine aktarımları yapılmıştır. Üçüncü bölümde ise metinlerde yer alan ayet, hadis, ilgili âlimlerin görüşleri ve eserleri incelenerek sınıflandırılmıştır."
