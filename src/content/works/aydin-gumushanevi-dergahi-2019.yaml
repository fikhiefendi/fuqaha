abstract: "Bu çalışmada Osmanlı'nın son dönemindeki bozulma ile başlayan iktisadi, askeri, siyasi ve sosyoekonomik geri kalmışlığına kendi yöntemi ile çare arayan Gümüşhânevi Dergâhı ve bu dergâhın Cumhuriyet Türkiye'sine kadar uzanan etkileri incelenmiştir. Osmanlı sonrası Batı'nın karşısındaki geri kalmışlık kendi özünden inkişaf etmeyen sistemleri model alan Türkiye Cumhuriyeti için de geçerlidir. 19. yüzyılın sonlarındaki -Türkiye Cumhuriyeti kurulduktan sonra da devam eden- bu iktisadi çözülmenin ahlaki ve zihnî boyutuna da dikkat çeken Ahmed Ziyaüddin Gümüşhânevi, kurduğu dergâhı aracılığıyla Osmanlı toplumunu bilinçlendirmeye, aydınlanmaya ve kendi tarihi kökünden beslenerek İslamlaşmaya çağırmıştır. Çünkü o, sosyoekonomik geri kalmışlığın sebebini ahlaki çöküntüden ötürü değişen zihniyete ve bu zihniyet değişikliğinin sonucu millî ve manevi hayattan uzaklaşılmasına bağlamıştır. İslamın amacı insanları sadece ahiret hayatına yönelik hazırlamak değil aynı zamanda dünya hayatını da yaşanılabilir bir hâle getirmektir. İnsanoğlu Dünya yaratıldığından beri akıl çerçevesinden Varlık, Ahiret, Mutluluk, İyi, Kötü gibi kavramları kendince sorgulamış ve ilahi mesaja muhatap olması ile de bu soyut kavramları kendi kafasında somut bir hale getirmiştir. Doğru tespit ve teşhiste bulunan Gümüşhânevi, her ne kadar kendi müritleri arasında uygulamalı olarak ürettiği çareler doğrultusunda ahlaklı bireyleri yetiştirmeyi, faizsiz borçlanmalarla çeşitli yatırımların gerçekleşmesini sağlasa da kısa vadede toplumun genelinde etkili olamamış, doğal olarak da Osmanlı Devleti'nin çöküşünü engelleyememiştir. Ancak feraset sahibi ve Nakşi tarikat geleneğinin Halidî kolunun şeyhi olan Gümüşhânevî'nin, yaymaya çalıştığı konuyla ilgili öğretilerinin uzun dönemde etkisini göstereceğinin bilincindeydi. Dolayısıyla Türkiye Cumhuriyeti başta olmak üzere, ülkelerin toplumsal bazda sosyoekonomik kalkınmasına çözümler üretecek modeller sunmuştur."
