abstract: "Günümüzde, İslam ve İslam'ın güncel hayattaki yeriyle ilgili tartışmalar İslam Hukuku ya da şeriat kavramına vurgu yapmaktadır. İran ve Suudi Arabistan'da siyasal olarak yetki sahibi olan pek çok kişi şeriatın tüm yaşam alanlarına uygulanmasını talep etti. Ancak, Allah'ın inananlar için verdiği hükümler ve bu hükümlerin şeriat sisteminde uygulanması arasındaki farklılığın belirlenmesi bazı yasal alanlar için oldukça zor olabilir. Bu zorlukların göz önünde bulundurulmasıyla, sosyal hayatin çeşitli dinamiklerinin İslam Hukuku'nun şekillenmesinde önemli bir rol oynadığı açıkça anlaşılmaktadır. Bu tarihi gelişim önemli alanları içermektedir: zamanla yasallaşma, yasallaşmada yer alan alimler, yasallaşmanın teorik temelleri, ve yasallaşmanın sayısız metot, ilke ve yöntemleri. Bu makalenin konusu, Suudi Arabistan ve İran'da şeriatın hem tarihsel hem de modern zamanlarda nasıl uygulandığını ve işlediğini incelemek ve bu yasanın tarihi ile doğrudan ilgilidir. Iran ve Suudi Arabistan'daki hukuk sistemlerinin incelenmesi üç bölüm ve çeşitli alt bölümlerde tartışılacaktır. Bu tezin birinci ve ikinci bölümleri, sırasıyla İran ve Suudi Arabistan'daki yasaların gelişimine odaklanmaktadır. Dahası, bu bölümler, hukukun temel kaynaklarının yanı sıra siyasi yetkililer ve onların yasal eğitim sistemleriyle olan farklı ilişkilerine de dikkat çekecektir. Bu bölümlerin amacı, alan içerisinde üretilen bilgileri kullanarak şeriat sistemlerinin oluşumunu açıklamaktır. İran ve Suudi Arabistan'daki yasal prensipler, kronolojik değişimler ve yasal sistemlerin temel unsurlarının anlaşılması, bu ülkelerde şeriatın nasıl uygulandığının anlaşılmasına dair geniş bir konsepte olanak tanır. Son bölüm, bu yasal sistemlerin kişisel kararlara nasıl ulaştığına dair kısa bir çerçeve çizmekte ve aile hukuku allananında şeriat hükümlerinin kullanılmasını, Iran ve Suudi Arabistan'daki evliliklerde rıza yaşının belirlemesine önem veren örneklerle açıklamaktadır. Sonuç olarak, bu araştırmanın temel amacı, bu iki ülkede uygulamanın nasıl farklılaştığını ortaya çıkarmak ve bu farklılıkların şeriat hükümleri veya bölgesel kültür ve tarihle ne ölçüde bağlı olduğunu açıklamaktır. Açıkça anlaşılmaktadır ki, özellikle evlilik için rıza yaşının belirlenmesi gibi özel alanlarda, kültürün etkisi fıkıh metinlerinden daha fazla olmaktadır ve bu muhtemelen klasik metinlerin rutin olarak kültür ya da gelenek lehine göz ardı edilmesinden kaynaklanmaktadır."
