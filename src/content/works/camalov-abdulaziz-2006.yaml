abstract: "Emir kavrami fikih usuliiniin en onemli kavramlanndandir. Ciinkii emrinbilinmesiyle helaller ve haramlar bir birinden aynhr. Nitekim bir 90k fikih usulciisii eserineemir kavramiyla ba§lar. Abdulaziz BuharT de, arastirmamizin temel kaynagi olan Kegfu'l-Esrar adh eserinde emir kavramina 90k genis. yer vermektedir.Abdulaziz Buhan'ye Gore \"Emir\" Kavrami adh tezimiz giris kismi ve iki boliimden olu§maktadir. Giri§ kisminda Abdulaziz BuharT'nin hayati ve eserleriyle ilgili bilgilere yer verdik. Burada aynca yaptigimiz ara§tirmalar sonucu Abdulaziz BuharT'nin tespit ettigimiz bazi elyazma eserlerini de tamtmaya cah§tik. Bunlardan en onemlisi Kegfu'l-Esrâr'a yapilan elestirilere Abdulaziz BuharT'nin bir cevap niteliginde telif ettigi Ha§iye aid Kegfi'l-Esrâr diger adiyla Risâletü'l-Kâfiye li Defati't-Ta'dn aid Ke§fi'l-Esrâr eseridir. Giris. kisminda bunun yam sira tezin amaci, hedefi, sinirlandmlmasi ve tezde kullamlan yontemden bahsettik.Birinci bolumde Abdulaziz BuharT'nin yaklasimina gore emir kavrami, emrin mucebi, emrin ger9ekle§mesinin §artlan, emrin tekrara delaleti, yasaktan sonra gelen emrin hukmu gibi konulan arastirdik. Burada ulasmak istedigimiz hedef temel olarak kavramsal olarak emrin sinirlanni belirlemek, emrin mucebinin ne oldugu ve bunu tespit etmenin yollan oldu. Cunkii ikinci bolumde uzerinde duracagimiz emirle hukum arasindaki iliskinin zeminini bu konular olu§turmaktadir.Ikinci bolumdeki inceleme konumuz emirle hukum arasindaki iliskinin sekli oldu. Bundan kasit bir dil konusu olan emrin dim hukumleri dogurmasinin imkamdir. Bununla ilgili olarak dim hiikumlerin ortaya 9ikma §ekli, ba§ka bir deyisje musliimanlann dim hükümlere ula§masinm yollan uzerinde durduk. Bu bize dim hiikumlerin ortaya 9ikma §ekli konusunda onemli ipu^ari sagladi. Dim hiikiimlerin ortaya 5ikma sekli konusunda iki farkh yaklasimi ele aldik. Bunlardan biri dim hiikiimlerin tahakkukunu lafzl istidlalle a5iklayan yaklasim, digeri ise full tevatiirii esas alan yakla§imdir. Bu yakla§im §ekillerinde kullamlan yontemlerin farkh olmasiyla beraber vanlan sonucun aym oldugu kanaatindeyiz."
