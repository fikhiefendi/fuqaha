abstract: "İnsanların haklarını koruyup adaleti tevzi edecek olan“Adli Yargı Birimi”bir devletin en önemli müesseselerinden biri sayılır. Bu sebeple asr-ı saadetten itibaren İslam devletlerinde daima adaletin sağlıklı bir şekilde yürütülebilmesi için her türlü tedbir alınmıştır. Bu tedbirlerden birisi mahkeme kayıtlarının tutulmasıdır. Osmanlı devletinde Şer'iyye Sicilleri, gayet sağlıklı bir şekilde tutulup günümüze ulaşmıştır. Söz konusu Siciller, İslam tarihi ve özellikle Fıkıh ilmi tarihi açısından büyük bir önem arz etmektedir. Ayrıca bu siciller, Fıkıh ilminin, teorinin ötesinde pratikte kendi muhitinde ve mantığında mükemmelen uygulandığını gösteren en bariz vesikalarıdır. Bu siciller arasında, İstanbul Şer'iyye Sicillerinden sonra sayı ve muhteva zenginliği ve en eski tarihli defterlerin günümüze ulaşması bakımından Bursa Şer'iyye Sicilleri ikinci sırayı almaktadır. Çalıştığımız Bursa Şer'iyye Sicili, Milli Kütüphane'de B-18 numara ile kaydedilmiş olup h. 1008-1009/m.1599-1600 yıllarında Bursa'da“Şer'î Mahkeme'ye”intikal eden dava, hüccet ve fermanları içermektedir. Bu çalışmada, öncelikle sicil, imkan nisbetinde hatasız bir şekilde okunup bilgisayar ortamına aktarılmıştır. Bu esnada konu taraması yapılarak dizin oluşturulmuştur. Akabinde Arapça kayıtlar Türkçe'ye tercüme edilmiş, Osmanlıca kayıtlar transkripsiyon işaretleri kullanılarak latinize edilmiştir. Nihayet ilgili dönemde en çok başvurulan Hanefi fıkıh kaynaklarına dayanılarak kayıtlar tahlil edilmiştir."
