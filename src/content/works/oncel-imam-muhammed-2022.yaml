abstract: "Hanefî Mezhebi'nde kıyasın katılıklarını yumuşatmak ve karşılaşılan meselelerde daha tatmin edici çözümlere ulaşabilmek için geliştirilen istihsan prensibinin terim olarak ortaya çıkışı Hicrî II. yy.'a tekâbul etmektedir. İstihsan kavramını teknik anlamı ile ilk kullanan isim ise Ebû Hanîfe'dir. Hanefî hukuk düşüncesi için anahtar kavramlardan biri olan istihsanın, usûl eserlerinde sınırları çizilen belirli çerçeveler içerisine yerleştirilmemiş ilk halini ortaya koyabilmek, istihsanın mâhiyetinin tam olarak kavranabilmesi için son derece önemlidir. Bu ise ancak istihsanın ilk elden kaynaklara dayanılarak incelenmesi ile mümkündür. Bu çalışmada da sadece Hanefî Mezhebi'nin değil; bir bütün olarak İslam Hukuku'nun ilk hacimli kaynağı olan ve kendisinden sonra kaleme alınan bütün fıkıh kitapları üzerinde etkisi bulunan el-Asl adlı eserin tamamı üzerinde istihsan merkezli bir inceleme yapılmış; bu sayede istihsan kavramının ilk dönem uygulamasında nasıl algılandığı tespit edilmeye çalışılmıştır. Aynı zamanda müstakil bir bölümde, istihsan kavramının klasik dönem usûl eserlerinde işlenişine de yer verilerek, teorideki istihsan ile uygulamadaki istihsan arasında mukâyeseye gidebilme imkânı sağlanmıştır. Araştırmalarımız neticesinde ulaştığımız sonuç, el-Asl'daki istihsan anlayışının Hanefî usûl literatüründe ortaya konulan istihsan teorisinden daha genel olduğu; bir diğer anlatımla uygulamadaki istihsanın teorideki istihsanı kampsam bakımından aştığı yönündedir. Yine araştırmalarımız, teorideki istihsan ile pratikteki istihsanın zaman zaman çatıştığını; usûl literatüründe, istihsanla ilgili bazı konularda sergilenen sert tavrın uygulamaya aynı ölçüde yansımadığını göstermektedir."
