abstract: "En genel anlamıyla hangi dinden olursa olsun ibadet yeri, ibadete mahsus bina anlamındaki mâbedlerin tarihi insanlık tarihi kadar eskidir. Hz. Âdem'den itibaren insanlar, yeme-içme kadar önem verdikleri ibadetlerinin merasimlerini icra etmek amacıyla mâbedler edinmişlerdir. Bu itibarla mâbedler, ilahi bir kaynağı olsun veya olmasın, insanların düzenli olarak içinde ibadet ettikleri mekânlar olarak tarihe geçmiştir. Nitekim Kur'ân, sırasıyla Yahudi, Hıristiyan, müşrik ve Müslümanların ibadet edindikleri mekânları bildirmiştir. Bazılarını onaylarken bazılarına şiddetle karşı çıkmıştır. İslam'da önemli bir yere sahip olan mâbedlere ilişkin tasarruflar, kimi yöneticelerin haksız ve keyfi uygulama ve insafına bırakılmamıştır. Nitekim gayri müslimlere tanınan haklar çerçevesinde mâbed hürriyeti Kur'ân ve sünnet temelinde önemli bir yer edinmiştir. Bu bağlamda Arap yarımadası gibi bazı istisnalar dışında gayri müslimlerin mâbedlerine müdahale edilmemiştir. Bilakis meskûn oldukları yerlerde mâbedlerini inşa etmelerine müsaade edilmiştir. Nitekim bu hususlarda İslam hukukunda müstakil hükümler vazedilmiştir. Son din olarak kendini ifade eden İslâm'da mescid kavramı, Mescid-i Harâm'la başlamıştır. Mescidlerin imar edilmesi ve muhafazası Müslümanların sorumluluğuna verilmiştir. Mescid-i Nebevî'nin inşa edilmesiyle birlikte kutsal bir mekân olarak umumiyetle ibadete yönelik faaliyetlerde değerlendirilen mescid; ictimaî, askerî, ilmî ve siyasî faaliyetlere de ev sahipliği yapmıştır. Ancak İslam'ın geniş bir coğrayaya intişarından sonra billassa günümüzde mescidler ibadetlere mahsus hale gelmiştir. İslâm hukuk tarihinde gelinen noktada mescidlerin statüleri şer'î hükümler çerçevesinde belirlenmiştir. Anahtar Sözcükler İslâm Hukuku, Mâbed, Mescid, İbadethâne, Müslüman, Gayri Müslim."
