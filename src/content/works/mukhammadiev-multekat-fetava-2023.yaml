abstract: "Hanefî mezhebinin gelişiminde Mâverâünnehir bölgesinde yetişen fakihlerin katkısı büyüktür. Özellikle bu konuda bölgenin en gelişmiş şehri olan Semerkant ayrı bir yere sahiptir. Bu bölgeden fıkıh eserlerine“Kâle Maşayihi Semerkand”,“Fetâvâ Ehl-i Semerkand”gibi terimlerin girmesine neden olan onlarca meşhur fakih yetişmiştir. Bu araştırmada Hanefî mezhebi mensuplarından birisi, İslami kültür ve medeniyet merkezi olan Semerkant topraklarında doğan ve orada yetişen Ebü'l-Kâsım Nâsırüddîn Muhammed b. Yûsuf es-Semerkandî'nin fıkıh ilmindeki yeri üzerinde durulacaktır. Semerkandî'nin“el-Mültekat fi'l-fetâva'l-Hanefiyye”eseri çerçevesinde yapılan bu araştırma bir giriş ve iki bölümden oluşmaktadır. İlk bölümde Hanefî mezhebinin Semerkant'a girişi, gelişimi, bölgede yetişen meşhur fakihler, Nâsırüddîn Semerkandî'nin hayatı, ilmî kişiliği, eserleri hakkında bilgi verilmiştir.“el-Mültekat fi'l-fetâva'l-Hanefiyye”nin tanıtımı ile başlayan ikinci bölümde eserin muhtevası, kullanılan fıkıh usulü delilleri, Nâsırüddîn es-Semerkandî'nin fıkhî görüşleri ve eserde kullanılmış fıkıh ıstılahları, mezhep içi ve diğer mezhep görüşleri tek tek incelenmiş, eserin kaynakları tanıtılmıştır. Araştırmanın temel amacı hicrî VI. yüzyılda Semerkant'ta fıkhî hareketlerin durmadığını ortaya koymak ve bu yüzyılda yaşamış olan Semerkandî'nin fıkhını tanıtmaktan ibarettir."
