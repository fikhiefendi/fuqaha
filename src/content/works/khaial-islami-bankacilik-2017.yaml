abstract: "Bu araştırma İslam ekonomisi alanındaki, İslami faaliyetlerin düzeltilmesini ve şer'i denetimin İslami bankalardaki işlemlerin kontrolünde, dini yönden pratik uygulamalarda periyodik izlemler yapmak suretiyle rolünü etkinleştirmeyi hedeflemektedir. Bu hassas açıdan ekonomi yönünden İslami bankaların ilgisini vurgulamaktadır. İslami bankalar klasik bankalardan birçok yönden farklıdır. İslami bankaların yönetim kurulundan tam bağımsız, şeri denetim kurulu olarak bilinen bir kurul tarafından şer'i denetime tabi tutulması bu farklardandır. İşte bu mesele araştırmamın konusudur. Araştırmamın konu başlığı; ''İslami Bankacılık Faaliyetlerinde Şer'i Denetim Kurulu'dur. Bu kurul İslam dininin kaynaklarından çıkarılan dini fetvalar olarak bilinen bir takım kurallara uygun hareket eder. Bu kurulun incelemeleri yönetim kurulu ve ortakların belirlenmesi, feshi ve ücretlerini belirleyen ortaklardan oluşan genel kurula sunulur. Bazı İslami bankalarda bir takım kusurlar bulunmasına rağmen, birçok İslami bankada hataların ve işlemlerin düzeltilmesinde, faaliyetlerin geliştirilmesinde ve daha iyi performanslarda şer'i denetim heyetleri önemli rol oynamaktadırlar. Bu araştırma İslami bankalarda çalışanlara kısaca bilimsel ve pratik kazanımlar kazandırmakla beraber bu bankalarda uygulandığı üzere, şeri denetimin hedef, özellik ve anlaşılmasında tektir. Aynı zamanda bu araştırma bu heyetin sorumluluğunu nasıl yerine getireceğini, bir açıdan iç kontrol ve muhasebe kaynakları arasındaki ilişkiyi de ortaya koyarken bir başka açıdan merkez bankası ile aralarındaki ilişkiyi de açıklamaktadır."
