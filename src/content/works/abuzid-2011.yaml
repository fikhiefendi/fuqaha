abstract: "Bu çalışma, daha önce çalışması yapılmamış makâsıdı cüz'iyyenin rutbesini, usul ve uygulamasının hakkını vererek terimin tanımlanmasını, ona yakın terimlerden farkını, infirad ve teaddüd, cüziyyet ve külliyet, kesinlik ve zan, aslilik ve tabilik gibi makâsıdı cüz'iyyenin tabiatının izahını, hükmün maksadı ile illeti arasındaki ilişkinin tabiatını açıklamak gibi çeşitli teorik yanlarını beyan ederek ele almayı hedefledi. Daha sonra çalışma, Kur'ân-ı Kerim'den, Nebevi Sünnet ve Ashâb-i Kirâmin amelinden yola çıkarak amelin makäsıdı cüz'iyye ile şerii ta'silini ele aldı. Aynı zamanda usulcuların sözlerini zikredip onları takip ederek makâsıdı cüz'iyyenin ibadetlerde ve genel ve özel olarak diğer konularda varlığından söz etti. Çalışma, makâsıdı cüz'iyyeyi arama yollarını ele alıp illeti arama yollarıyla karşılaştırmasını yaptı. Ayni şekilde çalışma, makasidı cüz'iyyenin yönetmeliklerini koydu ve hüccetinin sınırını gösterdi. Ayrıca bu yönetmeliğin etkisini ve hüccetinin faydasını zikretti. Çalışmanın ele aldığı sorunlardan biri, makäsidı cüz'iyyenin genel ve özel görevlerini belirtti. Sonra mustakil uygulamalı bir ekle son buldu. Ayrıca çalışmanın tüm bölümlerinde uygulamalı örnekler yer almıştir. Bütün bunları delillendirirken usulcuların ve çağdaş çalışanların görüşlerinden istifade etmiştir. Böylece İslam şeriatinde makâsıdı cüz'iyyenin mükemmel ve disiplinli teorisini katmıştır."
