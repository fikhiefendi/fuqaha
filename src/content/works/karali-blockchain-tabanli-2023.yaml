abstract: "Çalışmamın amacı, tekâfül sigortasının geleneksel işleyişine blockchain teknolojisini entegre ederek daha güvenli, şeffaf ve verimli bir sigorta sistemi oluşturmaktır. Bu çalışma, blockchain teknolojisinin sunduğu dağıtık defter ve akıllı sözleşmeler gibi özellikleri kullanarak sigorta süreçlerinin izlenebilirliğini artırmayı, veri güvenliğini sağlamayı ve dolayısıyla müşterilere daha iyi hizmet sunmayı hedeflemektedir. Ayrıca, blockchain tabanlı tekâful sigortası, katılımcıların katılım paylarının yönetimi ve dağıtımı gibi konularda daha şeffaf bir yaklaşım sağlayarak adaletli bir sistem oluşturmayı amaçlamaktadır. Araştırmada ilk olarak, blockchain teknolojisinin temel prensipleri ve sigorta sektörü üzerindeki potansiyel etkileri araştırıldı. Blockchain'in merkezi olmayan doğası, güvenlik, şeffaflık ve veri bütünlüğü gibi önemli özelliklerini literatürde yer alan çalışmalarla vurgulandı. Ayrıca, blockchain teknolojisinin sigorta sektöründe veri paylaşımı, akıllı sözleşmeler ve tazminat süreçleri gibi alanlarda nasıl uygulanabileceği konuları ele alındı. ikinci olarak, konvansiyonel sigortacılıkta kullanılan InsurTech kavramı ve InsurTech Ekosisteminin sektöre sağlamış olduğu kazanımlar üzerine vurgu yapıldı. Üçüncü olarak, tekâful sigortacılığına odaklanıldı. Literatürdeki çalışmalar, tekâful sigortacılığının temel prensipleri, mevcut zorluklar ve geleneksel sigortacılıktan farklılıkları üzerinde duruldu. Ayrıca, tekâful sigortacılığına yönelik blockchain tabanlı çözümlerin potansiyel avantajları ve dezavantajları üzerinde tartışıldı ve örnek bir“Blockchain Tabanlı Tekafül Modeli”senaryosu oluşturularak, blockchain tabanlı tekâful sigortacılığının nasıl uygulanacağına ilişkin bir fikir sunulmuştur. Blockchain tabanlı tekâful sigortacılığının geleneksel tekâful sigortacılığından farklı olarak sağladığı kazanımlara odaklanıldı ve bu teknolojinin uygulanmasıyla, geleneksel tekâful sisteminde eleştirilen hususlara nasıl çözümler sunulabileceği tartışıldı. Son olarak bu eleştirilere karşılık olarak ürettiği çözüm önerileri detaylı bir şekilde anlatıldı."
