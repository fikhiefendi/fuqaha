abstract: "Faizsiz finansın küresel olarak büyüklüğü artmış ve kapsama alanı oldukça genişlemiştir. Bu kulvarda çeşitli bankacılık ve finansman ürünleri geliştirilmiştir. Faizsiz bankacılıkta yapısal olarak üç tip model ortaya çıkmıştır. Bunlardan ilki, bankanın bağımsız bir yönetim kurduğu, ayrılmış bir sermaye topladığı ve şeriat uyumlu bankacılık ve finansman ürünleri geliştirdiği 'Tam Teşekküllü' modeldir. İkincisi, bir 'Bağlı Ortaklık' modelidir. Bu model, konvansiyonel bankaların şeriat uyumlu hizmetleri sunmak için yarı bağımsız bir yapı kurmasıyla oluşmaktadır. Yönetimi konvansiyonel olandan farklı olmasına ve ayrılmış bir sermayeye sahip olmasına rağmen, ana sermaye konvansiyonel bankaya aittir. Üçüncüsü, konvansiyonel bankaların şeriat uyumlu ürün ve hizmetler sundukları bir 'Pencere' modelidir. Pencere modeli, daha ziyade halkın çoğunluğu Müslüman olmayan ülkelerde geliştirilmiştir. Bu modelin her ne kadar faizsiz finans ürün ve hizmetlerini yaygınlaştırdığı düşünülse de, bu bankaların sermayesi, gelirleri ve yönetimi konvansiyonel anlayışa dayandığından, tam anlamıyla İslami ilke ve kurallara uygun olmadığı yönünde eleştirilmektedir. Etiyopya, belli kısıtlamalarla da olsa 2013'ten beri bu modeli uygulayan ülkelerden biridir. Bu süre zarfında ülkedeki 10 yerel konvansiyonel ticari banka pencere modeli uygulamış ve İslami finansa uyumlu ürünlerle bir milyar dolardan fazla fon toplamıştır. Bu çalışmada, pencere sisteminin etkinliği değerlendirilmiştir. İlk olarak, dünyadaki genişleme oranı diğer sistemlerle mukayeseli olarak incelenmektedir. Ayrıca, toplumda pencere modelinin kabul ve ilgi görme derecesini değerlendirmek için rastgele örneklemeye dayalı bir saha araştırması yapılmıştır. Sonuçlar, her ne kadar faizsiz bankacılık işlemleri genişlemeye devam etse de, Müslüman toplumda bu modelle ilgili ciddi bir rahatsızlık ve tam teşekküllü modele yönelik güçlü bir talep olduğunu göstermektedir."
