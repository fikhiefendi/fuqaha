abstract: "Anglo-Muhammadan Law, Hint Alt-Kıtası'nda 18. yüzyılın ikinci yarısından itibaren, 19. yüzyılın ortalarına kadarlık bir zaman diliminde ortaya çıkmış melez bir hukuk sistemini ifade etmektedir. Anglo-Muhammadan Law kavramı en basit haliyle bu şekilde ifade edilir. Daha kapsamlı olarak ise Anglo-Muhammadan Law kavramı, İngiliz koloni idaresinin yönetimi altındaki Hindistan'da adli idarenin değişimi, fıkıh kaynaklarının tercümesi ve yeni bir doktrin literatürünün ortaya çıkması aşamalarıyla ortaya çıkan kanunlar, kurumlar ve eserler bütününü bünyesinde barındırmaktadır. Diğer yandan Anglo-Muhammadan Law, fıkhın İngiliz idaresi altında modernleşmesini tecrübe ettiği için İslam dünyasında orijinal bir hukuk modernleşmesini de temsil etmektedir. Bu açılardan bakıldığında Anglo-Muhammadan Law'un, farklı yanları odağa alınarak farklı şekillerde tanımlanabileceği görülmektedir. Bu çalışmada Anglo-Muhammadan Law'un ortaya çıkış aşamaları incelenmiş, mahiyeti tartışılmış ve hakkında yapılan tanımlar ele alınmıştır. Tezde, Anglo-Muhammadan Law'un ortaya çıktığı bağlamın gösterilmesi için Hindistan'da İngiliz varlığının tarihi başından sonuna kadar anlatılıp Anglo-Muhammadan Law açısından önemli aktörlere işaret edilmiştir. Yine bağlamın kurulması için Anglo-Muhammadan Law'un geliştiği ortamda İslam hukukunun durumu, şahıs ve kurumlar incelenerek ele alınmıştır. Anglo-Muhammadan Law, ortaya çıktığı dönemi aşan bir kavramdır. Bu bağlamda bu hukuk sisteminin nasıl dönüşümlere yol açtığı ve Hint Alt-Kıtasında bağımsız devletlerin ortaya çıkışından sonra bu devletlerin hukuk sistemlerinde nasıl etkiler bıraktığı da tartışılmıştır."
