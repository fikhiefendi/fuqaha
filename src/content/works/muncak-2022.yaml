abstract: "“Molla Hüsrev'in Dureru'l-Hukkam Eserinden Çıkarılan Fıkhî Kaideler”başlıklı bu çalışma mukaddime, giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Araştırmacı, çalışmasında Osmanlı'nın en önde gelen alimlerden biri olan İmam Molla Hüsrev'in“Dureru'l-Hukkam Şerh Ğureru'l-Ahkam”adlı eserindeki fıkıh kaidelerini derlemiş ve bu kaideleri açıklayıp kitapta zikredildiği yerlere işaret etmiştir. Çalışmanın giriş bölümünde araştırmacı konunun öneminden, konuyu seçme nedenlerinden, araştırmada karşılaşılan problemlerden, bu konuyla ilgili önceki çalışmalardan ve araştırma metodundan bahsetmiştir. Araştırmacı temhid kısmında çalışmada kullanılan kavramları tanımladıktan sonra, fıkhî kaideler konusunu ele alarak, kaide, zabıt, fıkhî ve usulî nazariyye, fıkhî kaidelerin hücciyeti ıstılahları arasındaki farkları belirtmiş ve bunlarla hükmü çıkarma meselesini incelemiştir. Yine bu bölümde İmam Molla Hüsrev'in hayatı ve ilmî şahsiyetinden söz etmiş, kitabını incelemeye tabi tutarak yazarın metodolojisi ve kitapta başvurulan kaynakları ortaya koymaya çalışmıştır. Ardından“Dureru'l-Hukkam”adlı eserin kendisinden sonra telif edilen kitaplara etkisini ele almıştır. Birinci bölümde ise araştırmacı“Dureru'l-Hukkam Şerh Ğureru'l-Ahkam”kitabında geçen genel fıkıh kaidelere yer vermiş ve beş başlıktan altında kaidelerin delillerini açıklayıp kitaptaki yerlerini göstermiştir. İkinci bölümde“Dureru'l-Hukkam”adlı eserdeki genel olmayan fıkhî kaideleri incelemiş, ilgili kaidelerin kitapta zikredildiği yerlere işaret etmiştir. Sonuç bölümünde ise çalışmada varılan en önemli bulgulara yer verilmiştir."
