abstract: "İslam hukukuna dayalı kodifikasyonun ilk örneği olan Mecelle-i Ahkâm-ı Adliye'nin hazırlanışı ve içeriği farklı açılardan eleştirilmiştir. Eleştirinin temel nedeni, Hanefi mezhebiyle sınırlı olan akıl yürütme yönteminin takip edilmesidir. Bu nedenle Mecelle'de bazı konulardaki hükümler çağın gereklerine uygun olamamış ve içeriğinde çeşitli eksiklik ve fazlalıklar olmuştur. Mecelle, kimilerine göre bir çeşit fıkıhtır ve Osmanlı'nın zayıflaması sonrası yeniden dirilişin habercisi ve başlangıcıdır. Diğer bir görüşe göre ise fıkıhta ayırt edici özelliklerinden biri görüş çeşitliliği olmasıdır. Bu çeşitlilik hukuki değişim ve uygulamada esneklik için en önemli etkenlerden birisidir. Ancak Mecelle'de hukukun tedvin ve standardize edilmesi nedeniyle bu olasılık ortadan kalkmıştır. Mecelle'nin hazırlanışı ve içeriği de bu noktada ciddi düzeyde eleştirilmiştir. Eleştiriler, ağırlıklı olarak Hanefi mezhebiyle sınırlı olan yargı yönteminin kullanılmasına dayanmaktadır. Bu eleştirilere göre mezhep taassubu nedeniyle Mecelle'de bulunan bazı konular hakkındaki hükümler çağın ihtiyaçlarını karşılamamakta, içeriğine uygun olmayan eksiklikler ve fazlalıklar bulunmaktadır. Genel eleştirilerin yanı sıra Mecelle'nin bazı düzenlemeleri de eleştirilmiştir. Mecelle tenkidi ise klasik metin tenkidine göre çok farklı yönlere sahiptir. Bu eleştiriler, fıkhın onaylanmasına dayalı olarak meydana çıkan eserin hata ve kusurlarını göstermesi bakımından önemlidir. Ayrıca diğer hukuk yazılarından farklı olarak bir heyet tarafından telif edilmiş, birçok seçkin âlimin denetiminden geçirilmiş, padişah tarafından emredilmiş ve kadıları bağlamıştır. Sayılan bu nedenlerden dolayı Mecelle'ye yönelik eleştiriler, çeşitli derecelerde de olsa, hazırlanmasına katkıda bulunan herkese yöneliktir."
