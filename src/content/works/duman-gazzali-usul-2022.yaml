abstract: "Fıkıh usûlü ilminde önemli bir yere sahip olan Gazzâlî, ortaya koyduğu görüşlerle kendisinden sonra yazılmış -neredeyse- tüm usûl eserlerine bir şekilde etkide bulunmuş bir şahsiyettir. Bu büyük usûl âliminin şer'î delillere bakış açısını, hangi delilleri aslî, hangi delilleri tâlî kabul ettiğini bilmek hem hukuk teorisi bakımından hem de İslâm hukukundaki hüküm kaynaklarını anlamak bakımından önemlidir. Gazzâlî'nin, diğer âlimlerin kabul ettiği bazı delilleri niçin reddettiğini bilmek de bu anlama faaliyetinin önemli bir kısmını oluşturmaktadır. Bu çalışmanın amacı, Gazzâlî'nin meşhur eseri el-Müstasfâ'da mevhûm deliller adını vererek reddettiği, sahih bir yöntem veya kaynak olarak kabul etmediği delilleri incelemek ve bunlara itiraz sebeplerini anlamaktır. Bu amacı gerçekleştirmek üzere çalışmamız, üç ana bölümden oluşturulmuş; birinci bölümde Gazzâlî'nin özellikle de ilmî ve fıkhî şahsiyeti hakkında özet bilgi verilmiş; ikinci bölümde, Gazzâlî'nin aslî delillere bakışının genel bir çerçevesi çizilerek son bölümün daha iyi anlaşılmasına zemin hazırlanmış; üçüncü ve son bölümde ise asıl araştırma konumuz olan, Gazzâlî'nin mevhûm olarak isimlendirdiği dört delil tek tek incelenmiştir. Bu deliller, şer'u men kablenâ, sahâbe kavli, istihsan ve istıslâhtır. Çalışmada, Gazzâlî'nin delil anlayışı ve genel olarak şer'î deliller hakkında bazı sonuçlara ulaşılmıştır."
