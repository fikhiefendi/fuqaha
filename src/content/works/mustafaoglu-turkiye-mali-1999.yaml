abstract: "1. GİRİŞ Bu çalışma Türk mali kesiminin reel sektörle olan ilişkisini baz almakta ve bu iki temel ekonomik sistemin içinde bulundukları koşulların, söz konusu sistemlerin karşılıklı etkileşimlerinde yol açtığı sorunları irdeleyerek daha sağlıklı bir ekonomik yapıya ulaşılabilmesi için ihtiyaç duyulan alternatif mali enstrümanlar konusunda fikir yürütmektedir. Bu iki sistem arasındaki ilişkinin yeniden düzenlenmesinin Türkiye ekonomisinin bugün içinde bulunduğu temel sorunların kademeli bir biçimde çözümlenmesinde yardımcı olacağı savı vurgulanmaktadır. Araştırmanın amacını ve hedef aldığı konulardaki çözüm yaklaşımlarını daha iyi açıklayabilmek için Türkiye ekonomisinin genel yapısını ve bu yapının zaman içindeki değişimini incelemek gerekmektedir. Türkiye ekonomisi Cumhuriyet'in ilk yıllarından beri uygulanan planlı ekonomi modeli ekseninde, sınırlı kaynakları gözönüne alındığında, oldukça hızlı bir gelişme göstermiştir. 2. Dünya Savaşı'nı izleyen yıllarda patlama halinde büyüyen Dünya ekonomisinin de desteğiyle bu büyüme sürdürülmüş ve 1960-1980 döneminde ithal ikameci politikalar izlenmiştir, ithal ikameci dönem boyunca yerli sanayinin gelişimi hem ithalata karşı koruma, hem de özendirme yoluyla desteklenmiştir. Yabancı menşeli malların ithalatı, aynı malın yerli üretimi sözkonusu olduğu takdirde, kalite ve fiyat farkına bakılmaksızın zorlaştırılmış, bazen dolaylı olarak imkansızlaştırılmıştır. Özendirme tarafında ise, kamu kaynakları kullanılarak yerli endüstrinin kuruluşu için gerekli şartlar hazırlanmış ve desteklenmiştir. Devlet ekonomik gelişimi hızlandırmak amacıyla, ekonomik hayata sadece düzenleyici olarak değil, doğrudan ekonomik faaliyetlerde bulunarak da katılmış ve Kamu İktisadi Kuruluşları (KİT) aracılığıyla pek çok sektörde tekel konumuna gelmiştir. Bugün bile, finans kesimi başta olmak üzere, bazı sektörlerde kamu kesiminin payı oldukça yüksektir. Dönemin şartları içerisinde KİT'lerin kurulmasının bir zorunluluk olduğu açık olmakla beraber, bu kuruluşların gerekli fizibilite çalışmaları yapılmadan kurulmaları ve coğrafi konum / sektör seçiminde bilimsel veriler yerine, siyasi tercihlerin ön plana çıkması, günümüzde ekonomi politikasının en büyük sorunlarından biri haline gelen KİT açıklarının temelini oluşturmaktadır."
