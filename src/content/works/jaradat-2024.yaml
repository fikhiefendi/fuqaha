abstract: "İslami bankalara özgü riskler başta olmak üzere risk konusunu ele alan çalışma, risklerin niteliğini, türlerini ve özelliklerini belirlemeyi ve özellikle Filistin İslami bankalarının karşı karşıya olduğu riskleri belirlemeyi amaçlamıştır. risklerle yüzleşmenin en belirgin yolları ve araçları Potansiyeli, bu araçların meşruiyetini araştırmak ve Filistin'de incelenen İslami bankacılarla ilgili bir saha çalışması çalışması yoluyla araçların riskleri azaltma kabiliyetini göstermek. Araştırmacı, çalışma metodolojisinde, tümevarım yönteminde ve her yöntemin çalışmanın belirli bir bölümüne uyduğu analitik yöntemde çeşitli yöntemler kullandı. Araştırmanın sonunda araştırmacı yaptığı saha çalışmasıyla riskleri azaltmak için mevcut araçların etkili olduğu ancak birçoğunun meşru ihlaller içerdiği sonucuna varmıştır. Araştırmacı ayrıca risk yönetimi için İslami bankaların ihtiyacı olduğu sonucuna varmıştır. Geleneksel bankaların ihtiyacından farklıdır."
