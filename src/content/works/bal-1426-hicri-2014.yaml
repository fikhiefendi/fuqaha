abstract: "Bu tez çalışmasında, (Hicri 1311-1312 / Miladi 1895-1896) yıllarına ait“1426 Numaralı Giresun Şer'iye Sicilinin transkripsiyonu yapılarak, defterde bulunan belgeler ışığında adı geçen dönemde Giresun'daki idarî, sosyo – ekonomik, dinî ve kültürel yapı değerlendirilmeye çalışılmıştır. Çalışmamız giriş ile birlikte üç bölümden meydana gelmiştir. Giriş bölümünde araştırmanın amacı ve önemi, araştırmanın temel kavramları, yöntem ve verilerin çözümlenmesi ele alınmıştır. İlk bölümde ”1426 Numaralı Giresun Şer'iye Sicili Defteri\" nin transkripsiyonlu metni yer almaktadır. İkinci bölümde ise, defteri oluşturan belgeler konularına göre ayrılmış, daha sonra her bir konu bu belgeler çerçevesinde ayrı ayrı değerlendirilmiştir. 1895 - 1896 yıllarında Giresun şehrinin idarî, sosyo – ekonomik, dînî ve kültürel yapısı hakkında transkripsiyonu yapılan belgelerden istifade edilerek bilgiler verilmiştir."
