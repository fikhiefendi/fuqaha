abstract: "19.yüzyılın ilk yarısında Osmanlı Devleti'nde başlayan Tanzimat Dönemi, toplumsal hayatın pek çok alanında olduğu gibi aile hukuku alanında da önemli değişim ve tartışmaları beraberinde getirmiştir. 1839-1876 yılları arasındaki bu dönem, Batılılaşma hareketleri ve yenileşme çabalarıyla şekillenmiştir. Tanzimat'la birlikte kadınların toplumdaki konumu ve aile içindeki rolleri gündeme gelmiş, çok eşlilik (teaddüd-i zevcat), boşanmada kadına tanınan tefvîz-i talâk hakkı ve küçük yaşta evlendirme gibi konular tartışılmaya başlanmıştır. Dönemin aydınları ve uleması arasında bu konularda farklı görüşler dile getirilmiştir. Bir yandan çok eşliliğin yasaklanması, kadına boşanma hakkı tanınması gibi değişimler savunulurken, diğer yandan geleneksel İslami uygulamaların sürdürülmesi gerektiği ileri sürülmüştür. Örneğin Namık Kemal gibi aydınlar çok eşliliğe karşı çıkarken, Babânzade Ahmed Naim ve Aksekili Ahmed Hamdi gibi isimler bunu savunmuşlardır. Benzer şekilde boşanma hakkı konusunda da fikir ayrılıkları yaşanmıştır. Bu görüş ayrılıkları ve tartışmalar, 1917'de ilan edilen Hukuk-ı Aile Kararnamesi ve ardından gelen Medeni Kanun'un hazırlanmasında etkili olmuştur. Tanzimat'ın getirdiği yenileşme rüzgarları, kadın hakları ve aile hukuku alanında da önemli değişimlere ve fikri mücadelelere yol açmıştır."
