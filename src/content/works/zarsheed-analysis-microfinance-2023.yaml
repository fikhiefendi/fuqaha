abstract: "Bu araştırma, beş büyük mikrofinans kuruluşuna odaklanarak Afganistan'daki mikrofinans kurumlarının finansal ve sosyal performansını değerlendirmektedir: First Microfinance Bank (FMFB), OXUS, Mutahid, FINCA ve The Islamic Investment and Finance Cooperatives (IIFC). Çalışma, sosyal performans göstergelerini (erişim derinliği ve genişliği), finansal performans göstergelerini (portföy kalitesi, verimlilik ve sürdürülebilirlik) ve ayrıca faiz oranlarının bu kurumların verimliliği ve sürdürülebilirliği üzerindeki etkisini değerlendirmektedir. MIXmarket.org'dan elde edilen verilerin analizinde hem nicel hem de nitel araştırma yöntemi kullanılmaktadır. Bu çalışmanın bulguları, yoksul müşterilerin ve kadın borçluların yüzdesinin düşük olması nedeniyle kurumların sosyal yardımlarını genişletmeleri gerektiğini göstermektedir. Kurumlar, çalışma döneminde (2014-2018) kabul edilebilir finansal performans elde etseler de, kredilere ve sübvansiyonlara olan yoğun bağımlılıkları, uzun vadeli sürdürülebilirliklerini ve verimliliklerini tehdit etmektedir. Sonuç olarak çalışma, yüksek faiz giderinin bu kurumların verimliliğini ve sürdürülebilirliğini olumsuz etkilediği sonucuna varmıştır."
