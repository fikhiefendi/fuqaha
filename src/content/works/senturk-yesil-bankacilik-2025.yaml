abstract: "Son yıllarda küresel ısınma, çevresel bozulma ve doğal kaynakların hızla tükenmesi, sürdürülebilir kalkınmanın tüm sektörlerde olduğu gibi finans sektörü açısından da bir zorunluluk haline gelmesine neden olmuştur. Bu kapsamda ortaya çıkan yeşil bankacılık, çevreye duyarlı projelere finansman sağlayarak ekolojik sürdürülebilirliği desteklemeyi amaçlayan alternatif bir finansal sistem olarak dikkat çekmektedir. Yeşil bankacılık, yalnızca ekonomik kalkınmayı değil, aynı zamanda çevresel ve sosyal sorumluluğu da gözeten bütüncül bir yaklaşım sunmaktadır. Özellikle İslam ülkelerinde uygulanan faizsiz finans prensipleri üzerine kurulu İslami bankacılık, yeşil bankacılığın temel ilkeleriyle yüksek düzeyde örtüşmekte ve şer'i esaslara uygun sürdürülebilir finansman imkanları yaratmaktadır. Bu tez çalışmasında, yeşil bankacılık kavramı, işleyişi ve İslami finans ile uyumu detaylı biçimde ele alınmış; ardından Malezya, Endonezya, Suudi Arabistan ve Birleşik Arap Emirlikleri gibi seçilmiş İslam ülkelerinde uygulanan yeşil finansman politikaları analiz edilmiştir. Analiz sonucunda, Malezya ve Endonezya'nın yeşil sukuk piyasasını aktif olarak geliştirdiği, BAE ve Suudi Arabistan'ın ise yenilenebilir enerji projelerine yönelik büyük ölçekli yeşil finansman sağladığı görülmüştür. Türkiye'de ise yeşil bankacılık uygulamaları henüz gelişme aşamasında olup, özellikle katılım bankalarının yeşil finansman modellerini yaygınlaştırma konusunda daha fazla teşvike ihtiyaç duyduğu tespit edilmiştir. Sonuç olarak, yeşil bankacılık ve İslami finans, Türkiye'nin sürdürülebilir kalkınma hedeflerine ulaşmasında önemli bir role sahiptir. Türkiye, İslami yeşil finansman araçlarını geliştirerek hem İslam ülkeleri arasında hem de küresel ölçekte yeşil bankacılık alanında öncü bir ülke olma potansiyeline sahiptir."
