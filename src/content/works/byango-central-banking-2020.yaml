abstract: "Para politikasını yönetmede merkez bankacılığı işlemler, İslami olsun ya da olmasın her ekonominin ana ve en önemli unsurudur. İslami bankacılık ve finans uygulamaların seviyesi yükseldikçe, İslami para sisteminin geleneksel muadiline göre daha verimli ve etkili olduğu hipotezi gün geçtikçe daha fazla geçerlilik kazanmaktadır. Bununla birlikte, ikili bankacılık ve finansal sistemlere sahip hiçbir ülke İslami çerçevede para politikası uygulamamaktadır. Bu araştırmanın temel motivasyonu, muhtelif Müslüman ülkelerin bankacılık ve finans sektörlerini İslami ilkelere göre yeniden düzenlemeye yönelik büyük gayretlerine rağmen, merkez bankacılığı ve para politikası operasyonlarının halen büyük ölçüde geleneksel şekilde devam etmesidir. Müslüman ülkelerin faize dayanan para politikası uygulamalarının ekonomik ve finansal olarak başarısız olduğu açıkça ortaya konulmuş olmasına rağmen, faize dayalı para politikasi uygulamalarına devam eden ısrarları, İslami para politikası alternatifinin üstünlüğü hakkında şüphe uyandırmaktadır. Dolayısıyla, bu çalışmanın amacı, bu üstünlüğü hem teorik hem de ampirik olarak ikili parasal ve finansal sistemler altında incelemektir. Çalışmanın uygulama kısmında Uluslararası Para Fonu (IMF), Uluslararası Finansal İstatistikler (IFS) ve Dünya Bankası'ndan elde edilen ikincil yıllık veriler kullanılmıştır. 8 yatay kesitten elde edilen 26 gözlem 1991-2016 yıllarını kapsayacak şekilde analize dahil edilmiştir. Uygulama kısmı her iki parasal sistemi para talebi fonksiyonunun göreceli istikrarına, paranın dolaşım hızının göreceli istikrarına, parasal toplamlar ile parasal taban arasındaki korelasyona ve aynı zamanda para politikası hedefi ve geleneksel olana göre İslami para sisteminin parasal toplamını dikkate alarak mevcut literatürü genişletmektedir. Çalışmada, uzun vadeli para talebinin tahminleri için panel DOLS ve FMOLS eşbütünleşme teknikleri kullanılmıştır. Kısa dönemli regresyon testleri için, ARDL sınır testi kullanılmış ve her iki sistemde para talebi fonksiyonunun istikrarlılığı her bir kesit için CUSUM ve CUSUMSQ grafikleri kullanılarak incelenmiştir. Çalışmanın bulguları teorik ve ampirik olmak üzere iki kategoride ele alınabilir. Teorik analiz kapsamında, özellikle sürdürülebilir fiyat ve finansal istikrar başta olmak üzere, makro-ekonomik hedeflere ulaşılmasını kolaylaştırmada faizsiz bir finansal ve parasal sistemin göreceli üstünlüğünü ve etkinliğini gösteren epistemolojik temeller incelenmiştir. Kuran-ı Kerim, İncil, Tevrat ve Hz. Muhammed'in (PBH) sözleri, davranışları ve eylemleri de dahil olmak üzere, başlıca kutsal kitaplarda bahsedildiği gibi, insanlığa geçen nesiller boyunca rehberlik eden bir ekonomik düzenin temeli incelenmiştir. Çalışma, İslami para sisteminin geleneksel muadiline kıyasla makro-ekonomik hedeflere daha verimli ve etkili bir şekilde ulaşılmasını nasıl kolaylaştırdığını görtermektedir. Son olarak, teorik kısımda, İslami bir para ve finans sisteminin tam anlamıyla faaliyete geçtiğinde optimal düzeyde çalışacağı sonucuna varılmıştır.. Bu seviyede, sadece para politikasının yüksek hasıla düzeyinde fiyat ve finansal istikrar hedeflerine ulaşılmış olmayacak, aynı zamanda işsizlik sorunu da çözülmüş olacaktır. Ampirik sonuçlar beklenen enflasyon oranının hem uzun vadeli eşbütünleşme hem de kısa sonuçlu regresyon, sonuçlarının davranışsal iktisat teorisine uygun olması nedeniyle yasaklanmış enflasyon oranının mükemmel bir ikamesi olduğunu ortaya koymaktadır. CUSUM ve CUSUMSQ grafikleri her iki modelin de %5'lik anlam seviyesinde nispeten istikrarlı olduğunu göstermektedir. Bu, faiz oranının fırsat maliyet değişkeni olarak beklenen enflasyon oranıyla değiştirilmesi ile açıklanabilir. Faiz oranı değişkenini kullanmama gerekçemiz sadece faiz oranlarının İslami bir ekonomik düzende yer almaması gerçeğine değil, aynı zamanda faiz oranının aksine beklenen enflasyonun özellikle gelişmekte olan ülkelerde para tutmanın fırsat maliyetini, daha iyi yansıtan bir araç olduğu konusundaki genel kabuldür (Bahmani, Oskooee ve Tanku, 2006; Budina vd., 2006Bulgular bize faizsiz paranın dolaşım hızının varyansının faize dayalı olana göre çok daha düşük olduğunu gösteriyor. Bu sonuç, faizsiz parasal toplamların faize dayalı olanlara göre daha az oynaklık gösterdiği yönünde daha önceki bulgularla örtüşmektedir. Ayrıca, para tabanı ile parasal toplam arasındaki korelasyon ve nihai para politikası hedefi (sürdürülebilir fiyat istikrarı) ile parasal toplamlar arasındaki bağlantı, İslami para sisteminde geleneksel sistemdekilere göre görece daha güçlü bulunmuştur. Bu çalışmanın bulguları akademi, politika yapıcılar, düzenleyiciler ve uygulayıcılar başta olmak üzere, geniş bir paydaş yelpazesi için önemli politika çıkarımlarına sahiptir. Son olarak, bu çalışma, herhangi bir para politikası hedefinin etkin ve verimli bir şekilde uygulanması ve gerçekleştirilmesi için bir ön koşul olarak para talebi fonksiyonunun istikrarına ilişkin genel ampirik destek eksikliği üzerine literatürdeki boşluğu doldurmaya çalışmıştır."
