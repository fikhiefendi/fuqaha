abstract: "Günümüzde meydana gelen teknolojik gelişmelerle birlikte bireylerin mahremiyetlerinin korunması daha da karmaşık hale gelmiştir. Müslüman toplumlar, İslami rehberlik konusunda fetva verme rolünü üstlenen rasyonel bir dini otoriteye ihtiyaç duymaktadır. Modern tıbbın gerektirdiği prosedürler, genetik testler, dijital kayıtlar vb. teknolojik gelişmeler, bireylerin mahremiyetinin sınırlarını hem zorlamakta hem de bulanıklaştırmaktadır. Dolayısıyla dini bir otoriteye duyulan ihtiyaç günden güne artmaktadır. Çeşitli fetva akademileri çağdaş dönemde bu ihtiyacı karşılamak için yoğun bir çaba içerisindedir. Bu anlamda fetva faaliyeti yürüten beş fetva kurumu esas alınmıştır. Bu kurumlarının ortak yönlerinden birisi ve belki de en önemlisi çağın, gelişim ve dönüşümlerinden bilhassa modern tıbbın gelişmesinden kaynaklanan ve bireylerin çoğu zaman nasıl davranması gerektiğini bilemediği, çözüme kavuşturulmasını beklediği hususlarda referans aldıkları önemli kurumlar olmalarıdır. Bu çalışma, çağdaş fetva kurumlarının tıbbi meselelerle ilgili fetvalarını İslam'ın mahremiyet anlayışı ve insan onuru çerçevesinde değerlendirmektedir. Dolayısıyla ilgili kurumların üreme ve doğurganlık, cinsel ve jinekolojik müdahaleler, tıbbi teşhis sürecinde dikkat edilmesi gereken durumlar ve hayatın sonuna dair fetvaları incelenmiştir. Bu anlamda mahremiyet ve insan onuru perspektifinden değerlendirilmiş ve genel olarak zaruret-maslahat eksenli kararlar aldıkları görülmüştür. Fetvalarda,“canın korunması”ilkesine öncelik verilmiş; hayati tehlike durumlarında tedavi meşru, diğer hallerde ise mahremiyetin korunması zorunlu görülmüştür. Tüp bebek tedavisi zaruret kapsamında caiz sayılırken, taşıyıcı annelik nesep karışıklığı ve insanın mükerremliğine zarar gerekçesiyle reddedilmiştir. Kürtaj, annenin hayatını kurtarmak gibi istisnai durumlarla sınırlandırılmış, embriyo potansiyel bir insan olarak değerlendirilmiştir. Organ nakli, otopsi ve kadavra konularında da zaruret ve maslahat ilkeleri gözetilerek bedenin dokunulmazlığı korunmuştur. Bu fetvalar, insan bedeninin sadece biyolojik değil, aynı zamanda onur ve mahremiyet yönüyle de korunması gereken bir emanet olduğunu ortaya koymaktadır."
