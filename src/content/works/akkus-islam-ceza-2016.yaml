abstract: "Bu çalışmada, İslam ceza hukuku açısından bilişim suçlarının mahiyeti ele alınmıştır. Çalışmanın ilk kısmında İslam ceza hukukunun nitelikleri, gayeleri, prensipleri ve suç-ceza kavramları hakkında bilgi verilmiştir. İkinci bölümde bilişim suçları; kavram, kapsam ve tabi oldukları cezalar yönüyle modern hukuk açısından tanıtılmıştır. Son bölümde ise bu suçlar İslam ceza hukukuna göre değerlendirmeye tabi tutulmuştur. Çalışma, İslam hukukunun, klasik metodolojisi ve modern kanunlar çerçevesinde, ortaya çıkan bu yeni probleme yaklaşımını içermektedir. Bu yönüyle zaman zaman karşılaştırmalar ve kavram geçişlerine yer verilmiştir. Günümüz ceza kanunlarının temel kurallarla yapısal çerçevesini çizdiği bilişim suçları, İslam hukukunun temel kaynakları doğrultusunda incelenmiştir."
