abstract: "Hamd yalnızca Allah'a, salat ve selam da kendisinden sonra peygamber gelmeyecek olan zata olsun. Velâ ve berâ kavramları, ayet-i kerimeler, hadisler ve tarihî kıssalarla açıklandığı üzere ilahî kaynağı itibariyle davetin başlangıcında ortaya çıkmıştır. Bu kavramlar, Allah'a, Rasûlü'ne ve müminlere karşı velayet; şeytan, müşrikler, kâfirlere ve diğerlerine karşı beraette karşımıza çıkmaktadır“Kur'an'da Velayet ve Beraet”, dinî inançların en belirginlerinden biridir. Günümüzdeki bazı radikal İslamî akımların çeşitli konularda yanlışa düştükleri bir vakıadır. Bunlardan bir kısmı“Velayet ve Beraetten”“tekfirciliğe”bir yol açmaya çalışmıştır. Bu aşırı-uç akımların yaptıkları; kâfir olarak gördükleri insanların öldürülmelerine ve sözle tenkitlerine dair fetva aramaktır. Onların davranışları hakikatte Allah'ın rıza ve maksadından çok uzak olup Yahudilerin Kur'an'ı ve İslam'ı bulandırmak gayesiyle yaptığı bir oyunudur, yalan ve iftiradır. Öldürme, hakaret etme, yaralama, tekfir, kâfir saydıkları Müslümanlarla savaşma, onların evlerini yok etme, yurtlarından kovma, ekin ve nesli bitirme gibi eylemlerine rağmen bir taraftan da kendilerinin en iyi dindar olduklarını, Kur'an'ı, şeriati ve onun yöntemini tatbik ettiklerini iddia etmeleri üzücü bir gerçektir. Hakikatte ise Kur'an ve şeriat bunlardan beridir. Burada şu hususu da belirtmeliyiz ki, İslam fıkhı İslam şeriatinden ayrı olmadığı gibi, İslam şeriati de İslam akidesinden bağımsız değildir. Fıkhın asıl kaynağı Kur'an ve onun tefsiridir. Aralarında bir ayrım söz konusu değildir. Çalışmamızın birinci bölümünde, peygamberlerde ve Allah'ın salih kullarında velâ ve berâdan bahsettik. Bu akidenin Şia, Rafiziler, Hariciler, Selefiler ve ehl-i sünnetteki keyfiyetini belirttik. Meselenin hükmünü, lügavî, şer'î tariflerini tafsilatlı şekilde açıkladık. Velâ ve berânın izahı, kısımları; hükmü, sebepleri ve önemi üzerinde durduk. İkinci bölümde, Kur'an ayetleriyle Allah'a, Rasulullah'a ve müminlere olan velayet ve beraeti inceledik. Yine ayetler ışığında Şeytan'a, ehl-i kitaba, müşriklere ve kâfirlere karşı velayet ve beraeti ele aldık. Üçüncü bölümde ise ayetler ışığında velayet ve beraetin hükmü açıkladık."
