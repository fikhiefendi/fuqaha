abstract: "Barınma insanoğlunun varlığından beri, hayati öneme sahiptir. Gayrimenkuller insanların bu barınma ihtiyaçlarını gidermeleri için zorunlu elde edilmesi gereken taşınmazlardır. Toplumda gayrimenkul kavramını duyduğumuzda akla ilk gelen taşınmaz türü konutlardır. Gayrimenkul kavramı üzerine düşünüldüğünde, insan hayatı için önemli olan değerin, talebi yüksek olmaktadır. Talebi yüksek olan gayrimenkulün, elde edilme maliyeti de yükselmektedir. Büyük çoğunluğu Müslüman olan ülkemizde gayrimenkul satın alımında İslami kurallara uygun finansman seçenekleri önem arz etmektedir. Bu finansman seçeneğini sunan faizsiz finans kurumları mevcuttur. Bunlardan bazıları katılım bankası finansmanı, Toplu Konut İdaresi finansmanı, elbirliği sistemi finansmandır. Bu çalışmanın amacı, konut alımında seçilecek olan finansman yönteminin belirlenmesinde mali açıdan ekonomik aynı zamanda İslami kurallara uygun olacak seçeneğin belirlenmesine yönelik bir araştırma yapmaktır. Çalışma 4 bölümden oluşmaktadır. Birinci bölümde çalışmaya giriş yapılırken ikinci bölümde dünyada ve Türkiye'de bankacılığın tarihsel gelişmelerinden bahsedilmektedir. Bunun yanı sıra, katılım bankacılığı detaylı olarak ele alınmaktadır. Üçüncü bölümde, diğer finansman yöntemleri başlığı altında Toplu Konut İdaresi'nin tarihsel gelişim süreci ele alınmakta ve faizsiz finansmanda önemli bir yere sahip olan Elbirliği sistemine değinilmektedir. Dördüncü bölümde üç farklı faizsiz konut finansman seçenekleri matematiksel veriler üzerinden güncel araştırmalar yapılarak hesaplanmaktadır. Sonuç olarak üçlü faizsiz finansman seçenekleri tablo üzerinden karşılaştırılmaktadır. Karşılaştırmada 300.000 TL'lik finansman talebinin 120 ay vade ile taksitlendirilmiş geri ödeme planı temel alınmaktadır. Karşılaştırma sonucuna göre noter huzurunda çekilen kura sistemi ile katılımcılara finansman kaynağı sağlayan elbirliği finansmanı 41. aya kadar maliyet açısından avantajlı olduğu 41. aydan sonra çıkan taksitler için Toplu Konut İdaresi'nin finansman sistemi avantajlı olduğu sonucuna ulaşılmaktadır. Katılım bankasının sunmuş olduğu finansman seçeneği mevcut durumda en maliyetli seçenek olarak hesaplanmaktadır. Ülkedeki ekonomik şartların istenilen seviyede olmaması sebebiyle kar oranının yüksek hesaplanmasına neden olmakta bunun sonucu olarak katılım bankası finansmanının çok daha maliyetli hesaplanmasıyla sonuçlanmaktadır."
