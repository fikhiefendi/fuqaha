abstract: "“İslam ceza hukukunda Ehl-i Kitap”adlı bu çalışma giriş ve iki bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı ve kaynaklarına ilişkin bilgiler yer almaktadır. Burada çalışmanın amacı ve hangi kaynaklara başvurulduğu da belirtilmektedir. Çalışmanın birinci bölümünde; İslam ceza hukukunun nitelikleri, amaçları, prensipleri; suç, ceza ve ehl-i kitap kavramları hakkında bilgi verilmiştir. Çalışmanın ikinci bölümünde; İslam ceza hukukunun“ehl-i kitap”için öngördüğü had, kısas ve ta'zir cezaları; Kur'an, Sünnet, İcma, mezhep imamları ve bazı müctehidlerin görüşleri çerçevesinde ele alınmıştır. Ayrıca ehl-i kitap anlamına gelen terimler ve bunların hukuki dayanakları da araştırmada ihmal edilmemiştir. Bu yönüyle zaman zaman karşılaştırmalara ve kavram tanımlamalarına yer verilmiştir."
