abstract: "ABSTRACTPh. D. THESISTHE EFFECT ARISTOTLE'S LOGIC ON THE ISLAMIC METHODOLOGYSCIENCEHâ¢seyin âALDAKSupervisor : Prof. Dr. AbdulkuddÆs BİNGâ¦L2006-PAGE : 161Jury : Prof. Dr. AbdulkuddÆs BİNGâ¦LProf. Dr. Kazım SARIKAVAKAccos. Prof. Dr. Neşet TOKUAssis. Prof. Dr. Mâ¢slim AKDEMİRAssis. Prof. Dr. Sebahattin âEVİKBAŞAt this study, it is determined using Aristotle's logic and method of Islamic science asa result of interation by taken up relation between logic and Islamic method sciences.First it is exposed that logic had meet a positive and negative reactions after it hadbeen entered to world of Islam. At the same time, it had seen examined inference methodsusing by world of Islam before logic had been entered to it.At the following section of this study, it is dwelled upon subjects of Aristotle's logicthat is using by Islamic Jurisprudence. These are definition, proposition, syllogisme, analogy,indiction examined by from of using method of Islamic Jurisprudence. Furthermore, it isdetermined structure of analogy and its most important part cause at his section.İt is scarched, subject of Aristotle's logic that using by method of IslamicJurisprudence with samples by determined relations and differances between analogy andsyllogisme at the last section."
