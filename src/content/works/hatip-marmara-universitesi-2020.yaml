abstract: "Bu araştırma, Marmara Üniversitesi İlahiyat Fakültesi hazırlık sınıfında okuyan Türk öğrencilerin Arapça yazılı anlatım dersinde fonetik, morfoloji, sentaks, semantik ve imla düzeylerinde düştükleri yaygın dilsel hataların belirlenmesini hedeflemektedir. Araştırma, hazırlık sınıfları için yapılan yılsonu final sınavına katılan öğrencilerden rastgele seçilmiş bir örneklem üzerinde uygulanmıştır. Araştırma Arapça ile Türkçe arasında, iki dil arasındaki farklılıkları ve Türk öğrencinin karşılaşabileceği zorlukları belirleme amacıyla fonetik, morfoloji, sentaks, semantik ve imla düzeylerinden her birindeki analitik karşılaştırma yöntemine dayanmaktadır. Araştırmacı, yapılan hataların analizini şu üç aşamada gerçekleştirmiştir: Hatanın tespiti, tanımlanması ve yorumlanması. Araştırmanın ulaştığı sonuçlara göre ana dil olan Türkçe'nin bu hatalardaki rolü sadece fonetik düzeydedir, diğer düzeylerde bu dilin etkisi sınırlıdır. Hataların asıl sebebi, öğrenilmesi hedeflenen dilin kurallarındaki ve ayrıntılarındaki çokluktan kaynaklanmaktadır. Bazı dilsel öğeler arasındaki uyum kaideleri (mutabakat) ve hemzenin kelime ortasındaki (hemze-i mutavassıta) yazım kuralları buna örnek verilebilir. Yine hemze ve sayılar konusunda ana dili Arapça olan öğrencilerle ortaklaşa yapılan hatalar da bu kapsamdadır. Araştırma, dilsel beceri ve düzeylerin bütünleyici bir bakış açısıyla öğretilmesinin zorunluluğunu, ayrıca yaygınlık ve tedricilik kurallarına riayet edilerek işlevsel kuralların verilmesini tavsiye etmekte, yine tedricilik yöntemine uyulması şartıyla öğretim süreci boyunca fonetik alıştırmaların çoğaltılmasını ve öğrencilerdeki hataların çoğunu oluşturması sebebiyle dilsel öğeler arasındaki uyum kurallarına yönelik“mutabakat”konusundaki alıştırmaların yoğunlaştırılması gerektiğini öngörmektedir"
