abstract: "İnceleme, İsmail bin Abdurrahman el-Belbisi el-Mısri'nin (1179'dan sonra)“Şerhu İbn Kasım el-Gazzi li Müttefaki İ Abi Şuca”adlı eserinin ilk bölümünden başlayarak ilk abdest bölümüne kadar olan bölümleri üzerine yapılmıştır. Bu araştırma, miras olarak değerli bir kültürel mirası ele almaktadır. Araştırma, Şafi mezhebi alimlerinin sekiz temiz su türü, kaplarda kullanılan suyun hükmü, abdestin farzları, gusül ve teyemmümün hükümleri, diğer dilbilimsel, gramer ve morfoloji ile ilgili konuları içermekte ve İbn Kasım el-Gazzi'nin açıklamalarını açıklamayı amaçlamaktadır. Yazar, delil olarak Allah'ın kitabında veya Peygamberinin sünnetinde veya ittifakla bir görüşü veya söylemi desteklemekte kullanmaktadır. Ayrıca, metinlerin sunumu, düzeni ve eserin tarih ve doğa bilimleriyle ilişkili konuları eserin ansiklopedik kültürünü yansıtacak şekilde ele alınması açısından esneklik ve düzenlilik açısından da başarılı olmuştur. Belki de en önemli özelliği, yazarın taharet konularını incelemesi, modern meseleler ve olaylarla ilgilenmesi ve bunları hocalarına danışarak veya şer'i metinleri inceleyerek doğru hükümler çıkarmasıdır. Buna ek olarak, yazarın kaynakların çeşitliliğini ortaya çıkardığı ve iki kategoriye ayrıldığı belirtilmiştir: Birinci kategori: Şafi fıkhının yaygın kaynaklarından bilinen kaynaklar. İkinci kategori: Yazarın hocalarının ve öğretmenlerinin doğrudan kaynakları, bazılarını kendi elleriyle kopyaladığı veya günümüzde nadir ve kayıp olanlardan. Araştırmacı, beyanların belgelenmesi ve sahiplerine atfedilmesi için tümevarımsal yöntemi kullanmış ve yazarın kültürel kaynaklarının çeşitliliği konusunda elde ettiği en önemli sonuçlardan biri, dilbilimsel, gramer, morfoloji ve tefsir konularını içeren konuların gözden geçirilmesi ve bilimsel ve doğa bilimleri ile ilgili yönlerdir. Aynı zamanda, kaynakların çokluğu ve çeşitliliği ile belirtilen hususlar arasında özellikle modern sorunları ele alması ve bunlara hoclarıyla danışması ve bunlarda ihtiyatlı olmasıyla da öne çıkmıştır."
