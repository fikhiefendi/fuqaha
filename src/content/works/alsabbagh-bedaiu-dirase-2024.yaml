abstract: "Bu çalışmada, bedii ilminin özgün bir şekilde tesis edilememesi sorunsalı ele alınmış ve müfessirlerin Kur'an-ı Kerim'de karşılaştıkları en önemli meseleler üzerinde orijinal ve uygulamalı bir inceleme yapılmıştır. Ayrıca çalışmada, müfessirlerin sözleri gözden geçirilmiştir ve bu, Kur'an çalışmalarında Kur'an'ın benzersizliği meselesi gibi büyük öneme sahip olduğunu belirttikleri konulara ayırdıkları bilimsel alanı bilmekle beraber çeşitli mekanizma ve araçlarını ortaya çıkarmak için yapılmıştır. Bir diğer yandan çalışmada, bu sözler arasındaki denge gözetilmiş ve öne çıkan modern edebi çalışmalardaki ifadelerden eklemeler yapılma cihetine gidilmiştir. Yine çalışmada, dildeki bedii ile Kur'an'daki bedii arasındaki farklar ortaya konmuş ve Kur'an'daki bediiler akışı düzenleyen bir grup temaya ayrılmıştır. Bu temalar; orantı teması, ilham teması, özetleme ve detaylandırma teması ve tefsir teması olarak ortaya konmuştur. Daha sonra bu temalarla bağlantılı öne çıkan metodolojik meseleler üzerinde durularak Kur'an ilimleriyle ilgilenen kişilerin uygulamaları ışığında her temanın öne çıkan özelliği açıklanmıştır. Çalışmada ayrıca, Kur'an-ı Kerim ile ve ondaki bediilerle ilgisi olmayan başka temalar da incelenmiş ve metodolojik sebepler açıklanmıştır. Son olarak çalışma, bedii ilmi üzerine çalışma yapan kişilerin gözetmesi gerektiği gibi bir dizi metodolojik gramer üzerinde durularak nihayete erdirilmiştir. Çalışma sonucunda, Kur'an-ı Kerim'deki bedii örneklerinin araç, üslup ve yöntem bakımından nesir, şiir, yüksek dilsel makamlardan farklı olduğu neticesine varılmıştır. Bu, ona benzersizlik özelliğini veren şeydir. Zira biricik olduğunu yansıtan ve boş konuşma, yapmacıklık ve karmaşıklıktan beri ve münezzeh olması hasebiyle Kur'an'la bağdaştırılamayacak dışsal görüntüyü yok sayan özel ilmi bir terimle (Kur'an-ı Kerim'de Bedii) öne çıkmıştır."
