abstract: "Genetik mühendisliği çağımız açısından popüler alanlardan biridir. Genom düzenleme teknikleriyle ortaya çıkan somut gelişmeler, genetik isminin daha çok duyulur olmasına sebep olmuştur. CRISPR-Cas9 tekniğiyle birlikte genetik alanında yeni bir dönem başlatılmıştır. Genetik hususunda kabiliyetlerin geliştirilmesiyle fiziksel, zihinsel, davranışsal ve ruhsal özellikler genlerle ilişkilendirilmeye başlamış, insanın doğadaki özne konumu tartışmaya açılmıştır. Yaşanan bu gelişmeler dini, hukuki ve etik problemleri de beraberinde getirmiştir. Karma araştırma yöntemleri kullanılan çalışmamızda konu hakkında genetik bilgilendirme yapılmış, embriyo üzerinde araştırma ve genetik müdahale uygulamaları ele alınmış, niyet, amaç ve kapsam açısından değerlendirilmiştir. Biyoteknolojinin son türü olan CRISPR-Cas9 tekniğiyle birlikte genetik müdahale kapsamında hangi uygulamalara yer verildiği, beklenen fayda, başarı oranı ve fıkhî hükümlere etkisi ortaya konulmaya çalışılmıştır. Ayrıca genom düzenlemenin ortaya çıkaracağı muhtemel problemlere, maslahat-mefsedet yönlerine, kullanım alanlarına ve insanlığı hangi şeylerin beklediğine dikkat çekilmiştir. Bu bağlamda embriyonun kullanım alanlarına ilişkin yaklaşımlar ele alınmış, insanın genler üzerindeki müdahale hakkı, etkileri ve sonuçlarının tartışılması gaye edinilmiştir. Embriyoya yönelik genetik müdahalelerin incelendiği tezimizde ilgili fıkhî hükümlerin embriyonun hukuki statüsü, niyet ve kullanım amacına göre farklılık arz ettiği anlaşılmıştır. Güncel gelişmelerden hareketle genom düzenleme uygulamaları önleme, tedavi, iyileştirme ve geliştirme amaçlı sürdürülmektedir. Bunun yanında teknik sorunlar içermesi sebebiyle tedavi açısından da henüz net bir durum söz konusu değildir. Bu bakımdan kişinin germ hattında sonuçları öngörülemeyen bir uygulamanın yapılması caiz görülmemektedir. Genom düzenlemenin daha tehlikeli boyutlara sebebiyet vermememesi için sedd-i zerâi kapsamında engellenmesi gerekmektedir. Buna karşın gelecekte etkinlik ve güvenlik problemleri aşıldığında tedavi amacıyla uygulanmasının önünde bir engel kalmayacaktır. Fakat çoğunluğun karşı çıkmasına rağmen kamu düzeni ve toplumsal varlığı korumak adına geliştirme amaçlı müdahaleler için kapının tamamen kapatılmaması gerektiği sonucuna varılmıştır."
