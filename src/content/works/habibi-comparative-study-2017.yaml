abstract: "Bu tezde Seyyid Kutub ve Fazlur Rahman'ın siyasal düşüncelerinin özellikle İslam ve devlet ilişkileri konusuna yaklaşımları açısından karşılaştırmalı bir incelemesi yapılmaktadır.Tez Kutub ve Rahman'ın Kuran tefsir usulleri (metodolojileri) ve siyasal düşünceleri arasındaki ilişkilerin incelenmesi üzerine kuruludur.Buradan hareketle Kutub'un“eşsiz Kuran nesli”ve“cahiliye”kavramları ve Rahman'ın vahyin tabiatına ilişkin görüşleri ve“iki hareket teorisi”ayrıntılı bir şekilde incelenmiştir.İslam ve devlet ilişkisi konusunu açıklayabilecek olan üç paradigmadan söz edilebilir; bunlar“entegre paradigma”,“simbiyotik paradigma”ve“seküler paradigma”dır.Entegre paradigma, İslam'ı politika da dahil olmak üzere insan hayatının tüm yönlerini düzenleyen bütünsel ve kapsayıcı bir din olarak ele alır.Simbiotik paradigma İslam ve devletin karşılıklı bir ilişkisi olması gerektiğini belirtir.Seküler paradigma devletin İslam'dan bütünüyle ayrı olması gerektiğini belirtir.Tezde Kutub'un ve Rahman'ın devlet, demokrasi, şura, Allah'ın egemenliği, halk egemenliği ve şeriat gibi konulardaki siyasal görüşleri bu perspektiften incelenmiştir.Kutub'un siyasal düşüncesi entegre paradigmanın, Rahman'ın siyasal düşüncesi ise simbiyotik paradigmanın bir örneği olarak değerlendirilecektir."
