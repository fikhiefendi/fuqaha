abstract: "Mabetler, toplumların kendine özgü dini ritüellerini icra ettikleri yerlerdir. Dolayısıyla her toplum kendi mabedine kutsallık atfetmiştir. Dinlerin kutsal olarak addettiği mabet, bir dinden başka bir dine farklılık göstermektedir. Bundan dolayıdır ki mabetler her inanç sistemini dinamik kılan fonksiyonel mekânlar olmuşlardır.İslâm toplumunun mabedi olan camiler Kur'ânda 14 yerde geçmektedir. Camiler sıradan mimari yapılar olmayıp, İslâm'ın dinamizmini içinde barından ve etrafa hissettiren eserlerdir. Çünkü İslâm kültür ve medeniyetinin kendi olarak kalmasında fevkalede roller üstlenmiştir. Dolayısıyla camilerin, birtakım hukukî temellendirmelerden yoksun olmadığını İslâm Hukukunun iki ana unsuru olan gerek Kur'ân'da gerekse de Sünnette birçok nassı görmek mümkündür.Camiler, aynı zamanda toplumların geleneklerinden hızla koptuğu bir dönemde, İslâm toplumunda önemli işlevler üstlenmiştir. Bunun bir sonucu olarak da camiyle ilgili hükümler, İslâm Hukukunda çesitli mezhepler tarafından ele alınmıştır.Bu bağlamda İslâm hukukunda sadece camilerle ilgili hükümler ele alınmamıştır. İslâm ülkesindeki diğer mabetlerin fıkhi statüsü de ele alınan konular arasında yer almıştır. Hatta Gayrimüslim mabetleri ile ilgili ahkâmın fıkıh fitaplarında kayda değer bir hacmi vardır."
