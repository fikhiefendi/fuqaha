abstract: "Günümüzde hakim olan iktisadın tüketim-üretim anlayışının sonucunda ortaya çıkan aşırı tüketim, kaynakların savurgan bir şekilde kullanılmasına neden olmaktadır. Çalışmanın amaçlarından biri, İslam iktisadı tüketim, ihtiyaç ve savurganlığı nasıl ele alınmakta olduğunu ve ahlaki değerler kaynakların verimli kullanılabilmesi üzerine katkısının olup olmadığını ortaya koymayı amaçlamaktadır. Çalışmanın diğer amacı ise, israf edilen kaynaklardan bir tanesi olan gıda ürünlerinin israfını dikkate alarak Sakarya ili içerisinde yer alan Adapazarı, Erenler ve Serdivan ilçelerinde ne kadarlık bir gıda israfı olduğunu, israf algısının tüketim ve tasarrufa etkilerinin ne olduğunu, bu etkilerin sosyal yapıya yansımasının nasıl olduğunu tespit etmeyi amaçlamaktadır.Çalışmada karma araştırma yöntemi kullanılmıştır. Nicel araştırma yöntemlerinden olan Basit tesadüffi örnekleme yöntemi ile Sakaryanın ilçeleri olan Adapazarı, Erenler Serdivan'da ikamet eden hanehalkına anket uygulanmış olup elde edilen veriler SPSS 26. programıyla analiz edilmiş ve katılımcıların demografik özellikleri ve gıda ürünlerinin israfını tespit etmek için frekans analizi yapılmıştır. Bu çalışmada nitel araştırma yöntemlerinden durum araştırması deseni tercih edilmiştir. Çalışmaya, söz konusu ilçelerden 482 kişi katılmış olup bunların 446'sı dikkate alınmıştır. Gözlem çalışması olarak Adapazarı ilçesinde kurulan çarşamba pazarında 11 hafta gıda atıkları gözlemlenmiş ve tasnif edilmiştir."
