abstract: "Çalışmamızın temel konusu, İslam Hukuku'nda maraz-ı mevt halinde yapılan tasarruflardır. Ölüm hastalığı, ehliyet arızalarından biri olduğu için birinci bölümde; ehliyetin tarifi, nevileri, merhaleleri ve arızalarından bahsetmeyi gerekli gördük. Ölüm hastasının herhangi bir tasarrufta bulunurken kötü niyetli olabileceğine ve tasarruflarının kısıtlanması gerektiğine, İslam Hukuku'nda yer alan sedd-i zerâi, hakkın kötüye kullanılması, iç irade-dış irade uyuşmazlığı gibi ilkelerden hareket ederek ulaştık. Bu sebeple ikinci bölümde, bu ilkelere yer vererek üçüncü şahıslara nasıl zarar verildiğini ve bu durum karşısında İslâm Hukuku'nun izlediği yöntemi anlatmış olduk. Üçüncü bölümde ise çalışmamızın ana konusu olan ölüm hastasının tasarruflarına yer verdik. Bu çerçevede; ölüm hastasının ivazlı akitler, teberru akitleri, ikrar, evlenme, boşanma tasarruflarını ele aldık."
