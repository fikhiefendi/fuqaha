abstract: "Fıkhî kavâid ilmi, şer'î ilimler arasında yerleşik bir konuma sahiptir. Ancak bu ilim, belirli zamandaki belirli alimler tarafından bir defada ortaya konulmuş değildir. Bilakis onun mefhumu, form ve kalıpları muhtelif asırlarda her mezhebin ileri gelen büyük fakihleri elinde tedricen oluşmuştur. Küllî kâidelerin ayrı bir ilim olarak doğuşunda Hanefi mezhebi alimleri öncelik sahibi olmakla beraber bu durum İzz b. Abdusselâm'dan başlamak üzere Şafiî mezhebi lehine gelişme göstermeye başlamış ve İmam Suyûtî ile istikrara kavuşmuştur. Tezimizin konusu olarak belirlediğimiz İbn Nüceym'in el-Eşbâh ve'n-nezâir'i ile Suyûtî'nin el-Eşbâh ve'n-nezâir'i hicrî onuncu asır eserleri arasında bulunmaktadır. Bu dönem, kavaid literatürünün olgunlaştığı, önceki birikimlerin derlendiği, kâidelerin ifade yapılarının berraklaştığı ve kavâid eserlerinde kullanılan tasnif yönteminin belirli bir sistematiğe kavuştuğu dönemdir. İbn Nüceym, bazı farklarla beraber tertip, üslup ve muhteva bakımından çoğunlukla Suyûtî'den faydalanarak el-Eşbâh'ını oluşturmuştur. Bu kazanımı, Hanefi ekolünün 65'e yakın metin, şerh ve fetva türü müktesebatından aldığı fıkıh nosyonuna uyarlayarak geliştirmiştir. Bu şekilde yedinci yüzyıldan itibaren inkıtaya uğramaya başlayan Hanefi kavâid edebiyatını tekrar canlandırmış ve kendisinden sonrakiler için çığır açarak kitabı üzerinde yapılan onlarca çalışmaya zemin hazırlamıştır. Bu çalışma mezkur iki eserin genel muhtevasını“Bütün işler maksatlarına göre hüküm alır”kâidesi çerçevesinde ele alıp bu kâidenin kapsamına giren bütün fıkhî konuları, babları ve meseleleri mukayeseli olarak incelemek amacıyla yapılmıştır. Bu sayede eşbâh nezâir çalışmalarının tümdengelim metoduna dayanarak furû-ı fıkıh içerisindeki geniş birikim ve müktesebatın küllî kâideler bağlamında yeniden taranması ve gözden geçirilmesi sonucunda oluştuğunu müşahade ettik. Nitekim İbn Nüceym ve Suyûtî'nin bazı küllî kâideleri örnek ve hükümleriyle anlattıktan sonra“Gördüğünüz gibi bu kâide fıkhın ekseri bablarını ve konusunu kapsamaktadır”sözüne yer vermeleri buna işaret etmektedir."
