abstract: "Hz. Peygamber'in vefatından sonra dinî, siyasî ve toplumsal şartların etkisiyle İslâm toplumunda fırka ve mezhepler ortaya çıkmıştır. Mezhepler; kültürel, fikrî ve yorumsal zenginlik kaynağı olan beşerî oluşumlardır. Ancak mezhep-din ilişkisinin doğru kurulamaması büyük sıkıntıları beraberinde getirmiştir. Bir kısım fırka mensuplarının taassup ile hareket etmesi sonucunda İslam toplumundaki birlik bozulmuş, aynı dinin mensupları mücadelelerini birbirlerine karşı sürdürmüşlerdir. Bu mücadeleden hadis ilmi de etkilenmiştir. Bu tezimizde“Fırka ve Mezhep Taassubunun Hadis İlmine, Hadis Ricâli ve Kitâbiyatına Etkisi”incelenmiştir. Tezimizde taassup, mezhep ve fırka kavramlarının tahlili yapılmış; taassubun sebepleri, türleri ve sonuçları üzerinde durulmuştur. Râvilerin adaletine yönelik ithamlar içerisinde yer alan bid'atçilik ithamı, hadisçilerin bid'at ehlinin rivayetine bakışı, ehl-i bid'at kabul edilen fırkaların temel görüşleri ile hadislere yaklaşımları incelenmiştir. Mezhep taassubunun ricâl kitapları, hadis kitâbiyatı, hadis şerhleri ve hadislerin kabul veya reddi ile hadis vaz'ındaki etkileri ayrıntılı olarak ele alınmıştır. Ehl-i bid'at fırka mensubu olduğu iddia edilen bazı râviler ve bu râvilerin Sahîhayn'da yer alan rivâyetleri tespit edilerek yapılan ithamların gerçekliği tespit edilmeye çalışılmıştır. Mezhep taassubuyla doğrudan ilişkisinin olduğunu düşünmemiz sebebiyle Hâricîlik ve Râfıza fırkaları ile Ebû Hanîfe ve Şâfiî hakkındaki rivâyetler incelenerek değerlendirilmiştir."
