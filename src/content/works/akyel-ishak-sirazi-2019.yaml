abstract: "Ebû İshâk eş-Şîrâzî, Şâfiî mezhebinde İmam Şâfiî'den sonra fıkıh usûlü alanında eserleri bir bütün olarak elimize ulaşan ilk usûlcülerden biridir. Şâfiî mezhebinde hem usûl hem de furû' alanında önemli eserler vermiştir. Bu eserler kendisinden sonraki dönemlerde uzun bir süre Şâfiî mezhebinin temel başvuru kitabları arasında yer almıştır. Yine bu eserler Şâfiî âlimleri etkilemiş ve bu mezhebin düşüncelerine yön vermiştir. Şîrâzî, birçok konuda Şâfiî'nin görüşlerine bağlı kalmış, ancak başta kıyas konusu olmak üzere birçok konuda da Şâfiî'nin görüşlerinden farklı görüşler ifade etmiştir. Bu çalışmada Ebû İshâk eş-Şîrâzî'nin et-Tebsıra, el-Luma' ve Şerhu'l-Lüma' adlı eserleri çerçevesinde usûlü'l-fıkhın en önemli konularından biri olan kıyas konusu incelenmiştir. Bu bağlamda Şîrâzî'nin kıyas için yapmış olduğu tanım, kıyasın hüküm çıkarmak için geçerli bir yöntem olduğu hususundaki temellendirmesi, kıyasın şart ve rükünleri, kıyasın çeşitleri, illet belirleme yöntemleri ve kıyas ile ilgili diğer konular hakkındaki görüşleri incelenmiştir. Bu konulardaki görüşleri gerekli görülen yerlerde kendisinden önceki usûlcülerin görüşleri ile kıyaslanarak, Şîrâzî'nin Şâfiî mezhebinin usûlüne yapmış olduğu katkılar ve takip etmiş olduğu yöntem belirlenmeye çalışılmıştır."
