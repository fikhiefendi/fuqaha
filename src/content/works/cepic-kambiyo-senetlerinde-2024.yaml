abstract: "Ulusal ve uluslararası ticaret açısından oldukça önem arz eden kambiyo senetlerinin yalnızca tanzim eden ve lehtar yönünden kambiyo taahhüdü içermesi söz konusu olmayıp, tedavül kabiliyetini haiz bu senetlerin devir işlemine tabi olması mümkündür. Bu noktada hukuken emre muharrer senet vasfını haiz kambiyo senetlerinin ciro yolu ile devredilmesi esas olup, bazı hallerde alacağın temliki ya da miras, şirketler, kanun gereği devir ya da icra ve iflas hukuku kapsamında bir başkasına intikal edebilmektedir. Kambiyo senedinin ciro yolu ile iktisap edilebilmesi için aynı zamanda senedin zilyetliğinin de devri şarttır. Dolayısıyla, maddi hukuk yönünden senedin yetkili hamili vasfını haiz olan kimsenin şekli anlamda da senedin maliki olması gerekmektedir. Ayrıca ciro işlemi yapılırken herhangi bir kayıt veya koşul içermeksizin devir usulüne riayet edilerek senedin iktisap edilmesi ile senetten doğan tüm hakların devralınması esastır. Ancak senedin tahsilat ya da rehin maksadıyla iktisap edilmesi halinde, cironun temlik işlevi bulunmadığından bu noktada alacağın bir başkasına temlik cirosu yolu ile iktisap ettirilmesi mevzubahis değildir."
