abstract: "Bankacılık sistemi içerisinde faizsiz finans modeli, İslami kurallara dayalı faaliyet gösteren İslami bankalar olarak bilinmektedir. İslami bankaların en büyük görevi, insanların dini inançlarından dolayı yastık altında bulundurdukları fonları ekonomiye kazandırmak, ekonomik büyüme ve kalkınmaya katkı sağlamaktır. Dünya'da İslami banka olarak bilinen bu banka modeli Türkiye'de özel finans kurumları olarak faaliyete başlamış ilerleyen yıllarda ise bankacılık kanununda yapılan değişikliklerle katılım bankaları olarak faaliyetlerine devam etmiştir. Bu çalışma ile İslami banka modelinin, çalışma prensipleri, amaçları ve tarihsel gelişmeleri hakkında bilgi verilmiş, Türkiye'de İslami banka olarak faaliyet gösteren özel ve kamu katılım bankalarının finansal verileri incelenerek performansları karşılaştırılmıştır. Katılım bankalarına ait finansal performans karşılaştırması 2015-2021 yıllarını kapsamaktadır. Bu tarihleri kapsamasının nedeni ise kamu katılım bankalarının 2015 yılında faaliyete başlamış olmasıdır. Bu karşılaştırmada CAMELS analiz yöntemi kullanılmıştır. CAMELS analiz yönteminde ait altı adet ana verinin değerlerini oluşturmak için yirmi bir adet alt veri literatür taraması yapılarak oluşturulmuştur. Çalışmada kullanılan veriler, Türkiye Katılım Bankaları Birliği'nden ve katılım bankalarına ait internet sitelerindeki finansal raporlardan alınmıştır. Yapılan çalışmanın sonucunda katılım bankalarının belirlenen yıllar arasındaki finansal performansları hem pozitif yönlü hem de negatif yönlü eğilim göstermiştir. Analize konu olan verilerden çıkan sonuçlara göre katılım bankalarının bankacılık sektöründeki ilerlemesinin yavaş olduğu gözlemlenmiştir. Bununla birlikte yapılan teknolojik yatırımların artması ve müşterilerine yönelik ürün çeşitliliğin artırılmaya başlanmasıyla, katılım bankalarının sektördeki payının ve işlevselliklerinin artması mümkün gözükmektedir."
