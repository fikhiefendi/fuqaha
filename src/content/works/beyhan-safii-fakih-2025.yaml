abstract: "Abdülvâhid er-Rûyânî'nin hayatı ve Bahrü'l-Mezheb adlı eserinin incelendiği bu çalışma, giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Girişte çalışmanın konusu ve amacı ile ilgili genel bilgiler verilmiştir. Birinci bölümde h. 5. yüzyılda yaşamış olan Abdülvâhid er-Rûyânî'nin hayatı, ilmi kişiliği talebeleri, hocaları, eserleri ve dönemin siyasi durumu hakkında bilgi verilmiştir. İkinci bölümde Rûyânî'nin Bahrü'l-Mezheb adlı eserinin genel tanıtımı yapılmış, eserdeki şerh yöntemi ve eserin önemli hususiyetleri üzerinde durulmuştur. 14 cilt olarak matbu halde bulunan eser esasen Müzenî'nin el-Muhtasar adlı eserinin şerhi konumundadır. Eseri, mezhep içinde önemli kılan en temel özelliklerinden biri eserde gerek mezhep içi gerekse mezheplerarası ihtilaflara yer verilmiş olmasıdır. Üçüncü bölümde ise Bahrü'l-Mezheb'in kaynakları tespit edilmiş ve Şâfiî mezhebindeki önemine dikkat çekilmiştir. Klasik fıkıh eserleri sistematiğine sahip olan eser, her ne kadar Müzenî'nin el-Muhtasar adlı eserinin şerhi olsa da kendi dönemine kadarki neredeyse bütün Şâfî kaynaklardan özellikle de Mâverdî'nin el-Hâvi'l-Kebîr isimli eserinden istifadeyle kaleme alınmıştır. Gerek eserin muhtevası gerekse yararlandığı kaynaklar dikkate alındığında eser, ansiklopedik bir eser görünümündedir. Tezin sonuç kısmında ise çalışmanın sonucunda varılan bulgular değerlendirilmiştir."
