abstract: "Katılım bankacılığı ifadesi, 1985 yılından itibaren Türkiye'de uygulanan, temel bankacılık hizmetlerini İslam hukuku çerçevesinde yürüten, dünyada İslami bankacılık veya faizsiz bankacılık olarak isimlendirilen finansal hizmet sektörünü tanımlar. Katılım bankacılığı, geleneksel bankacılık ile birlikte finans piyasalarının en önemli iki faktörüdür. Dış görünüş itibariyle benzer noktalar barındıran bankacılığın bu iki türü, süreçler, sözleşmeler, ürünler, niyet ve yaklaşımlar açısından büyük farklılıklar göstermektedirler. Katılım bankaları, konvansiyonel bankacılığa benzer şekilde fakat farklı prosedürler çerçevesinde tasarruf fazlası olan gerçek ve tüzel kişilerin tasarruflarını bir araya getirerek fon ihtiyacı olan kişilere aktarır ve bu süreç içerisinde aracılık geliri elde ederler. Şu hâlde finans piyasasının çok önemli bir aktörü olan katılım bankaları temel olarak üç görev ifa ederler: 1. Fon Toplama: Bankaların tasarruf sahiplerinden, Kar ve Zarara Katılma Hesabı (vadeli hesap) ve Özel Cari Hesap (vadesiz hesap) adı altında topladıkları mevduatlardan oluşur. Bankacılık Mevzuatı gereği Özel Cari Hesaplara kâr payı ödenmez iken Kar ve Zarara Katılma Hesaplarına dönem sonunda tahakkuk eden gerçek değerler üzerinden kar veya zarar ödemesi yapılır. 2. Fon Kullandırma: katılım bankalarının topladıkları fonları İslam Hukukunun izin verdiği yöntemlerle finansman ihtiyacı olan gerçek ve tüzel kişiler lehine fonlamada bulunmasını ifade eder. Fon kullandırma süreci sonucunda katılım bankaları faaliyet karı elde ederler. 3. Finansal Aracılık Hizmetleri: Bankaların müşterilerine sunduğu yurtiçi ve yurtdışı para transferleri, çek ve senet ödemesi, sigorta poliçesi, yatırım fonu, Bireysel Emeklilik Sistemi (BES) poliçe satışları, fatura tahsilatları, kredi kartı, banka kartı, ATM, POS ve benzeri hizmetler olup bunların karşılığında tahsil edilen bedellere faaliyet dışı gelirler adı verilmektedir. Katılım bankalarının ana faaliyet alanlarından birisi fon kullandırma olup bu bankaların toplam gelirlerinin %92'si bu kalemden oluşmaktadır (TKBB, 2019). Fon kullandırma fonksiyonu, fon pazarlama, kredi tahsis, teminatlandırma, icap ve kabul şartları çerçevesinde kredi ödemesinin yapılması, kredinin geri tahsili ve gecikmiş alacakların yönetimi ile idari ve hukuki takip aşamalarını içermektedir. Bu tez çalışmamızda öncelikle katılım bankalarının tahsis ettiği kredilerden geri tahsil edilemeyenler için uyguladıkları süreç ve prosedürler ile tahsili gecikmiş alacakların banka finansalları üzerine olan etkileri incelenecektir. Literatür taraması olarak nitelenebilecek bu aşamadan sonra tahsil edilemeyen alacaklar için uygulanan kredi yeniden yapılandırması derinlemesine incelenerek, bu işlemin kredi kullanan firmalar açısından etkinliği ekonometrik bir modelle test edilecektir. Bu amaca yönelik olarak, katılım bankacılığı sektöründen elde edilen verinin boyutu, kalitesi ve kapsadığı zaman dilimi dikkate alınarak en uygun ekonometrik model seçilmiştir. İleride detaylı olarak açıklanacağı üzere bu model, Altman Z Skorundaki değişimin panel veri analizi ile test edilmesine dayanmaktadır. Neticede kredileri yeniden yapılandırılan firmaların Altman Z Skorundaki değişimlerinin yönü ve anlamlılığı elde edilerek yeniden yapılandırmanın etkin olup olmadığı araştırılmıştır. Literatür incelemesinde tahsili gecikmiş alacaklar ile ticari bankaların etkinliği arasındaki ilişki üzerinde çok sayıda çalışmanın yapıldığı görülmektedir. Ayrıca, bankalardaki tahsili gecikmiş alacakların makro düzeyde ülke ekonomisinin verimliliği ve performansı üzerindeki etkisini inceleyen akademik çalışmalar da mevcuttur. Yalnız, bu çalışmalarda sadece geleneksel bankacılık verileri kullanılmış olup katılım bankacılığının kapsam dışında tutulduğu görülmektedir. Tez çalışmamızın araştırma bölümünde katılım bankalarından kredi kullanan ve kredi yeniden yapılandırmasına konu olan firmaların bilanço verileri kullanılacaktır. Bu şekilde, akademik bir boşluğun doldurulmasına katkı sağlanacağı düşünülmektedir. Kredilerin yeniden yapılandırılması, geri ödemede sorun yaşanan kredilerin geri ödeme planının, başlangıçta belirlenen veya daha farklı bir kar oranıyla daha uzun bir vadeye yayılması, böylece kredi alan firmaların nakit akışının rahatlatılması işlemidir. Kredilerin yeniden yapılandırılması, özellikle iktisadi kriz dönemlerinde veya sonrasında, azalan satışlar ve düşen kar marjlarının etkisiyle banka borcu olan firmaların sıklıkla başvurduğu bir durumdur. Bu süreç neticesinde firmalar nakit akışlarını rahatlatarak faaliyetleri için gerekli işletme sermayesini oluşturabilmekte ve daha da önemlisi kredi veren kuruluşlarla hukuki sorun yaşama ihtimalini en aza indirebilmektedirler. Şu halde kredilerin yeniden yapılandırılmasında amaçlanan faydalar aşağıdaki şekilde ifade edilebilir: a. Finansal başarısızlık yaşayan firmanın nakit akışının rahatlatılması ve iflas noktasından uzaklaştırılması. b. Bankanın gecikmiş alacak oranının (NPL) yükselmesinin önüne geçilmesi. c. Bankanın gecikmiş alacağı için ilave karşılık ayrılmasının, neticede banka karlılığında azalmanın önlenmesi. d. Finansal başarısızlık durumundaki firmanın faaliyetlerine devam etmesiyle, işsizlikte artış, üretim, ihracat ve vergi gelirlerinde azalma gibi muhtemel makroekonomik sorunların engellenmesi. Katılım bankalarında kredilerin yeniden yapılandırılması için kullanılan yöntemler geleneksel bankacılıktan farklıdır. Geleneksel bankacılıkta yeniden yapılandırma, eski kredi sürecinin kesilmesi ve borç bakiyesinin yeni bir faiz oranı ve daha uzun bir vade ile farklı bir kredi sürecinin başlatılması şeklinde yürütülür. Bu tür bir yöntemin katılım bankacılığı prensiplerine uygun olmaması nedeniyle katılım bankaları organize teverruk denilen bir yöntem ile kredileri yeniden yapılandırabilmektedir. Mal murabahası (commodity murabaha) da denilen bu yöntemde katılım bankası organize bir mal borsasından peşin olarak satın aldığı bir malı, vadeli ve daha yüksek bir fiyattan müşterisine satmaktadır. Müşteri ise söz konusu malı aynı borsada farklı bir alıcıya peşin olarak satmakta ve nakit girişi elde edilmektedir. Aslında müşterinin elde ettiği nakit eski kredi borcunun kapatılmasında kullanılmakta, yeni durumda ise müşteri bankaya satın aldığı mal karşılığı vadeli olarak borçlanmaktadır. Tezin son bölümünde, katılım bankalarının gerçekleştirdikleri kredi yeniden yapılandırmalarının firma (müşteri) açısından ektin olup olmadığı araştırılmıştır. Bu araştırma için Altman Z skoru çerçevesinde panel veri analizi uygulanmış ve elde edilen sonuçlar ile çözüm önerileri tartışılmıştır."
