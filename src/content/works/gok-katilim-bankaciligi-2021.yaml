abstract: "Katılım bankacılığının sürdürülebilir gelişimi ve sektörel etkinliğinin artırabilmesi için müşteri ihtiyaçları doğrultusunda ürünler geliştirmesi önem arz eden bir konudur. Türkiye'de katılım bankaları, ticari faaliyet gösteren şirketlerin nakdi finansman ihtiyaçlarını karşılamak için ağırlıklı olarak murabaha ve ayrıca icare, müşareke, mudarebe ile istisna yöntemlerine dayanan ürünlerle hizmet sunmaktadır. Bu yöntemlere dayanan ürünler ise ticari faaliyet gösteren müşterilerin faaliyetlerinin devamı için elzem olan; SGK ödemeleri, vergi ödemeleri, çalışanlarının maaş ödemesi, ticarete konu belgelenemeyen ticari giderler gibi işlemlerin finansmanında etkin olarak kullanılamamaktadır. Çalışmanın temel amacı ticari faaliyet gösteren firmaların günümüz katılım bankacılığı nakdi finansman yöntemlerine dayanan ürünler ile etkin olarak karşılanamayan ihtiyaçlarının karşılanabilmesini sağlayabilecek yeni bir yöntem ve bu yönteme dayanan ürün önerisi sunmaktır. Yeni yöntemimizi stok finansmanı yoluyla satış yöntemi bu yönteme dayalı ürünümüzü ise stok finansmanı olarak adlandıracağız stok finansmanı yoluyla satış yöntemi, emek-sermaye ortaklığı, murabaha, selem ve vekâleten satış uygulamalarının sentezlenmiş ve bazı güncellemeler yapılmış hali olarak ifade edilebilir. Bu kapsamda stok finansmanı yoluyla satış yöntemine dayanan stok finansmanı ürünü detaylı olarak anlatılarak, uygulanabilirliği fıkhi, sektörel, vergisel, sigorta ve hukuki açıdan incelenerek ayrıca ilgili uzmanları görüşlerine yer verilecektir. Bu incelemeler akabinde ise katılım bankacılığı sistemine uygun mevcuda ek ve alternatif bir nakdi finansman yöntemine dayanan ürün önerisi sunulması hedeflenmektedir. Bu durum Katılım bankalarının sektördeki diğer oyuncular karşısındaki rekabet gücünü arttıracaktır. Böylece İslami finans sitemi temellerine dayanan katılım bankacılığı sisteminin, mevcuda nispeten daha etkin bir noktaya ulaşabilmesi sürecine katkı sağlayacağı öngörülmektedir. Araştırma kapsamında stok finansmanı yoluyla satış yöntemine dayanan stok finansmanı ürünün, fıkhi, sektörel, vergisel, sigorta, hukuki, açısından uygulanabilirliği sorgulanmış ve müspet sonuç elde edilmiştir. Ortaya çıkan durum ve kanaatler, sektör idarecileri ile araştırmacılar için bilgiler ve politika geliştiricileri için öneriler sunmaktadır."
