abstract: "Bu tezde, merkez bankası para politikası araçları İslam iktisadı açısından incelenmiş ve çözüm teklifleri ortaya koyulmaya çalışılmıştır. Çalışma, İslam iktisadı sisteminin temel ilkelerini, özelliklerini vurgulamakta ve genel bir bakış açısı sunarak başlamaktadır. Daha sonra konvansiyonel sistemin egemen olduğu ekonomilerde kullanılan para politikası araçları incelenmiştir. Bu bağlamda çalışma, konvansiyonel para politikası araçlarının İslam iktisadı ile uyumlu olup olmadığını incelemekte ve para politikasının İslam iktisadına uygun bir çerçevede ekonomik büyüme ve istikrarı teşvik etmedeki rolünü tartışmaktadır. Ayrıca, İslam iktisadına uygun bir para politikasının uygulanmasındaki zorluklar belirlenmeye çalışılmıştır. Tez bu amaçlara ulaşmak için, nitel bir araştırma yaklaşımı kullanarak İslam iktisadı ve para politikasına ilişkin literatürün kapsamlı bir incelemesini içermektedir. Bu çalışmanın bulguları, İslam iktisadına uygun para politikasının temel ilkelerinin adâlet, eşitlik ve refah olduğunu ve sürdürülebilir ekonomik büyüme ile toplumsal refahı teşvik etmeyi amaçladığını ortaya koymaktadır. Araştırma, İslam iktisadına uygun para politikasının uygulanması için uygun kurumsal ve yasal çerçevenin geliştirilmesinin yanı sıra İslâmî finansın karşı karşıya olduğu zorlukları ele alarak yenilikçi araç ve tekniklerin benimsenmesinin gerekliliğine vurgu yapmaktadır."
