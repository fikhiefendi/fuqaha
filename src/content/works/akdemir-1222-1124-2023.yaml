abstract: "Bu çalışma, Harput Kazası'na ait H.1122-1124/M.1710-1712 (s.1-90) tarihli Şer'iyye Sicilinin traskripsiyon ve değerlendirmesini içermektedir. Çalışmada sırasıyla, Osmanlı Devleti'nde kadılık kurumu, şer'iyye mahkemeleri ve şer'iyye sicilleri hakkında bilgi verildikden sonra, söz konusu sicil içindeki belgeler özetlenip, konularına göre tasnifi ve genel değerlendirilmesi yapılmıştır. Sonrasında ise transkripsiyon metnine yer verilmiştir. İncelediğimiz Harput Şer'iyye sicilinde, idari atamalar, menzillerle ilgili belgeler, vergi, alım-satım, alacak-verecek, borç, miras konuları, mal davaları, vasi, vekil tayini, evlenme, hırsızlık, darp, ölüm olayları, din değişikliği, eşkiyalık vb. konulara ilişkin belgeler yer almakta olup bahsi geçen bu başlıklar altında Harput sancağının incelemeye konu olan tarihlerdeki siyasi, iktisadi ve sosyal durumu hakkında bazı tespitlerde bulunulmaya çalışılmıştır. Sicilin hazırlandığı dönem, Osmanlı ve Rusya arasında yaşanan Prut Savaşı'na denk gelmekte olup bu savaş sonrasında 1711 yılında Prut Antlaşması yapılmıştır. Bu dönemde Osmanlı Devleti padişahı III. Ahmet'tir."
