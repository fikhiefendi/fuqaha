abstract: "Günümüz İslam dünyasında Şiî-İmâmiyye, Ehl-i sünnet ekolünden sonra en fazla taraftarı bulunan İslam mezhebidir. Ca'ferî mezhebi ise bu grubun izlediği fıkhî yoldur. Ca'ferî fıkıh usûlünde Kitâb, Sünnet, icmâ ve akıl olarak sıralanan delillerden dördüncü sırayı alan akıl delilinin, mezhebin teşekkül sürecinden başlayarak fıkıh usûlüne girişine kadar geçirdiği serüveni incelemek ve fıkıh usûlünde aklın rolünü, sınırlarını belirlemek; bu süreçte usûl ilminde akıl etrafında yapılan tartışmaları ve bu tartışmaları besleyen sosyal, siyâsî, ilmî ve zihnî altyapıyı tespit etmek; ayrıca akıl delilinin Ca'feri fürû fıkhına etkisini belirlemek bu tezin konusudur."
