abstract: "Fıkıh tarihi yazımı ve dönemlendirme şablonları,“tarih yüzyılı”lakabıyla anılan 19. yüzyıldan itibaren araştırmacıların ilgisini çekmiştir. Bu süreçte fıkıh tarihini dönemlendirmeye yönelik çok sayıda yöntem ortaya çıkmış, farklı kriterler esas alınarak iki yüzü aşkın dönemlendirme önerisi ortaya konmuştur. Bu tez, literatürdeki dönemlendirme önerilerinin kökenlerini, aktarım sürecini ve metodolojik zaaflarını incelemektedir. Söz konusu dönemlendirmeler, araştırmacının yeni fıkıh tarihi yazımı olarak adlandırdığı literatürden seçilen örneklem üzerinden analiz edilmiştir. İlk olarak dönemlendirme teşebbüslerinin dayandığı tarihi zemin incelenmiş ve bağlamı inşa edilmiştir. Bu bağlamda YFT literatürüne hâkim olan gerileme paradigması şablonunun 19. yüzyılda oryantalist Arapça literatür tarihi yazarları tarafından kullanıldığı, bu şablonun hem oryantalist hem de modern İslam dünyasında kurulan üniversite müfredatlarına zahmetsizce taşındığı görülmüştür. Bu taşımada ve yeniden üretilme sırasında 18. yüzyıl ıslahatçılarının ve ıslahatçı ekolün rolleri tespit edilmiştir. Ayrıca mevcut tarih felsefesi açmazları ile Türk-Arap ilişkileri arasındaki sorunların YFT dönemlendirmelerini üretmedeki yardımcı rollerini ortaya koyulmuştur. İkinci bölümde iki yüzü aşkın dönemlendirme içerisinden bir örneklem belirlenmiş ve bu örneklem üzerinden ilk kitap olarak tespit edilen çalışmadan itibaren tezin tamamlandığı 2025 yılına kadar yapılmış dönemlendirmeleri değerlendirilmiştir. Üçüncü bölümde ise genel tarih felsefesi ve tarihyazımı literatüründe yer alan dönemlendirme eleştirileri ile önerilerden yola çıkarak mevcut YFT tasniflerinin taşıdığı zaaflara değinilmiştir. Tez, mevcut tasniflerin beş temel ilkeye (kavramsal sadelik, kapsayıcılık, muhtevaya delalet, ölçütlerde açıklık ve tutarlılık, tarihi doğru yerden bölme ve gerçeklik) uymadığını ortaya koymaktadır. Ek bölümünde yer alan tablolarla da çalışmanın grafiksel özeti yapılmıştır."
