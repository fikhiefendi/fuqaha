abstract: "Yüksek lisans tezi olarak hazırlanan“Şerāyiṭü'l-İslâm”adlı eseri Muhammed bin 'Abdurrahman Şubat 1594 tarihinde kaleme almıştır. Eser, dil özellikleri itibariyle Klâsik Osmanlı Türkçesi dönemi ve Eski Anadolu Türkçesi dönemi özelliklerini yansıtmaktadır. İlmihal özelliği taşıyan eserin yazarı,“herkes okusun diye”eserini Türkçe yazdığını belirtmektedir ve eserin bu amaca uygun olarak sade ve anlaşılır bir dille yazılmış olduğu görülüyor. Eser bu özelliklerinden ötürü Türk dili açısından zengin yapı ve birimler barındırmaktadır. Ayet ve Hadisler Arapça olarak yazılmış olup açıklama kısımları ise sade Türkçe iledir. Tamamı 90 varaktan oluşan eser, bu çalışmayla sayfa ve satır numaraları verilerek transkribe edildi. Gramer kısmında imlâ, ses değişmeleri, şekil bilgisi, sözcük türleri, kelime grupları, cümle ve fiil çekimleri ayrıntılı bir şekilde incelendi. Yapı bakımından Arapça ve Farsça terkipli ifadeler geleneğe uygun olarak inceleme dışında tutulmuştur. Özellikle kelimelerin anlamları verilirken kelimelerin metin içerisindeki kullanımı dikkate alınmıştır. Ünlülerde yuvarlaklaşma temayülü ve kimi eklerin yalnız düz şekilli, kimi eklerin yalnız yuvarlak şekilli görülmesi gibi kimi özellikler, metinde Eski Anadolu Türkçesi özelliklerinin varlığını devam ettirdiğini göstermektedir. Bu yönleri dikkate alındığında eser Türk kültürü ve Türk dili açısından önem arz etmektedir."
