abstract: "Bu araştırma, talak (boşama), onun çeşitlerini, sebeplerini ve çözüm yöntemlerini Kur'an-ı Kerim ve Peygamberimizin Sünneti ışığında açıklamayı hedeflemektedir. Birinci bölümde talakın tanımı, çeşitleri ve delilleri, ikinci bölümde boşanmanın kadın veya erkekten kaynaklanan sebepleri, üçüncü bölümde ise boşanma öncesinde, sırasında ve sonrasında aile için Kuran'ın rehberliği konusu ele alınmıştır. Araştırma problemi, boşanma vakalarına neden olan aileyi etkileyen güncel sorunlara odaklanan yeterli çalışmanın olmaması ile boşanmanın zikredilen üç aşaması için Kur'an eksenli yol gösterici çalışmalarının bulunmamasıdır. Dolayısıyla çalışmanın önemi de tam olarak burada, yani boşanmanın en önemli nedenlerini bilmek ve onlara yönelik çözümler geliştirmeyi amaçlamakta ortaya çıkmaktadır. Araştırmada bu, Kur'an'ın direktiflerine, nebevi sünnet kaynaklı metinlere ve bunlardaki aile fıkhının maksat ve gayelerine ittiba suretiyle yapılmaktadır. Bunu gerçekleştirebilmek adına yazar, talak ayetlerini ve bu ayetlerdeki müfessirlerin sözlerini elde edebilmek için hem betimleyici hem de tümevarımcı metotları, ardından da toplanan ayetlerin detaylarını, analizini ve tasniflerini ortaya koyabilmek için betimleyici analitik metodu kullanmıştır. Bu sayede araştırma, Kur'an-ı Kerim'de boşanma ayetleri, sebepleri ve çözümleri hakkında kapsamlı ve açıklayıcı bir çalışmaya olan ihtiyaç şeklinde ifade edilebilecek araştırma boşluğunu ve yazarın incelediği önceki çalışmaların konuyu bir bütün halinde ele almayıp yalnızca parçalar halinde bazı bölümlerinin çeşitli araştırmalara dahil edilmesi noktasındaki araştırma açığını kapatmaktadır. Yazarın ulaştığı en önemli sonuçlar şu şekilde sıralanabilir: Boşanma konusunda Kur'an'ın getirdiği çözümlerden biri boşanmanın vuku bulması durumunda kadının bulunduğu evinden çıkarılmamasıdır. Boşanmanın en önemli nedenlerinden biri acele ile bir karara varmaktır. İslam, boşanmayı tam anlamıyla vuku bulması için bir değil üç talak şeklinde sunmuştur ki bununla boşanma kararından cayabilmeleri noktasında eşlere yeterli fırsatı vermek amaçlanmıştır."
