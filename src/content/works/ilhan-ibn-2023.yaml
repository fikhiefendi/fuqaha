abstract: "Tebliğ sürecinden itibaren İslam'ın insanlar arasında hızlı bir şekilde yayılması, farklı birçok örf ve adetle karşılaşmasına; bu bağlamda çeşitli uygulama ve problemlerin ortaya çıkmasına neden olmuştur. Fıkıh âlimleri bu problemleri çözüme kavuşturabilmek için ictihad etmişler ama birbirlerinden farklı sonuçlara varabilmişlerdir. Bu bağlamda mezhepler arasında ve mezhep içinde birçok farklı görüş ortaya çıkmıştır. Bu durum sonraki dönemde, ulemanın farklı içtihatlar arasında tercih yapmasını gerektirmiştir. İbn Nüceym ve onun el-Bahrü'r-râik adlı eseri hem Hanefî mezhebinde hem de İslam Hukuku alanında önemli bir yere sahiptir. Bu çalışmada müellifin mezkûr eserindeki tercihleri konu edinilmiştir. Çalışmadaki amaç; İbn Nüceym'in tercihlerini tespit ve tahlil edip, mezhep içi tercih mantığını nasıl uygulandığını göstermek, mezhep içi fıkhi tefekkürün uygulanış biçimini İbn Nüceym örneğinde ortaya koyarak literatürde katkı sağlamaktır. Bu bağlamda araştırma, müellifin son çalışması olan el-Bahrü'r-râik ile sınırlandırılmıştır. İlgili sınırlandırmaya rağmen, tezin amacına katkı sağlayacağı düşünülen yerlerde müellifin diğer eserlerine de başvurulmuştur. Belgesel Kaynak Tarama yöntemi kullanılarak tercihler belirlenmiş ve ardından bu tercihler arasından temsil gücü yüksek olan örnekler tespit edilerek değerlendirilmiştir. Çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı kapsam ve sınırlılıkları gibi ön bilgiler verilmiştir. İlk bölümde İbn Nüceym'in hayatı, eserleri, ilmi yönü, şahsiyeti ve yaşadığı dönem betimsel olarak ele alınmıştır. İkinci bölümde tercih kavramı üzerinde durulmuştur. Bu konuda literatürde yer alan görüşler değerlendirildikten sonra, İbn Nüceym'in tercih kavramı hakkındaki düşünceleri eserlerine başvurularak ortaya konmaya çalışılmıştır. Üçüncü ve son bölümde ise eserde tespit edilen tercihler arasından temsil gücü yüksek olanlar, mezkûr eserin konu tasnifine göre ele alınarak değerlendirilmiştir. Sonuç bölümünde ise genel bir değerlendirme yapılarak elde edilen bulgular sunulmuştur."
