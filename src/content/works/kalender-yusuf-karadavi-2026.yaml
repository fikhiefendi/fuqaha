abstract: "Çağımızda İslâm hukuku alanında yaptığı çeşitli çalışmalarıyla adından söz ettiren Yûsuf el-Karadâvî, geliştirdiği çağdaş fetva yöntemiyle de dikkatleri üzerine çekmiştir. İslâm hukukunun işlevselliğini devam ettirdiğini düşünen Karadâvî güncel soru ve sorunlara da fıkhî bir perspektiften çözüm bulmanın mümkün olduğunu savunmuştur. Bunun için de fetva vermede takip edilecek belli birtakım ilke ve prensiplerin belirlenmesini gerekli görmüştür. Bu çalışmada Karadâvî'nin fetva yöntemi ve fetva verirken takip edilmesi gerektiğini savunduğu ölçütlerin tespit edilmesi amaçlanmıştır. Karadâvî, bu ölçütleri taklitten uzak durmak, kolaylaştırmak, çağın dilini yakalamak, faydası olmayan konulardan yüz çevirmek, ictihada bağlı olarak verilen fetvaların zamana göre değişebilirliğini dikkate almak, ifrât ve tefrît arasında itidali yakalamak şeklinde belirlemiştir. Tespit edildiği kadarıyla Karadâvî, sözkonusu ölçütler arasında fetvada teysir, taklîtten uzak durma, realite fıkhı ve makāsıdü'ş-şerîa prensiplerine ayrı bir önem vermiştir. Fetvalarında genel anlamda dört mezhebi esas almakla birlikte, gerektiğinde dört mezhebin dışındaki müctehid imamların fetvalarının alınmasını da gerekli görmüştür. Fetvası olmayan güncel meseleler hakkında ise ictihad müessesesinin aktifleştirilmesini elzem görmüştür. Bu çerçevede aktifleştirilmeyen bir ictihad müessesesinin güncel problemlere cevap veremeyeceğini, fıkhi gelişmeleri sekteye uğratacağını hatta donduracağını iddia etmiştir. İctihad ehliyetine sahip kimselerin naslardan direkt hüküm çıkararak amel etmelerini gerekli görürken, bu ehliyete sahip olmayan âmmî kimselerin de belli bir mezhebe bağlı kalmaksızın ilim ehlinin kendilerine vereceği fetvayla amel etmelerini savunmuştur."
