abstract: "Hakkın düşmesi hukukun; olay, eylem ya da işlemlere bağladığı sonuç olarak tanımlanabilir. Bu tanımda hakkın düşmesinin üç tane sebebinin olduğu görülmektedir. Bunlar; hukûkî olay, hukûkî eylem ve hukûkî işlemdir.Hakkın düşmesinin ortaya çıktığı hukûkî durumlar birbirinden farklı özellikler taşır. Bu farklılık, hakkın düşmesinin hukûkî mahiyet ve içeriğini de şekillendirir. Rıza, ferağat, imkânsızlık, cezâî müeyyide, zamanın geçmesi, hakkın düşmesinin mahiyetini izah eden temel kavramlar olarak sıralanabilir. Hakkın düşmesi bazen bireyin rızasına dayalı olarak ortaya çıkarken, kimi zaman imkânsızlık (ölüm gibi) hakkın düşmesinin sebebi olmaktadır. Bazen de hukukun bireye eylemleri nedeniyle ceza vermesi hak kaybını ifade eder. Belirtilmesi gerekir ki, İslâm hukukunda zamanın geçmesi, hakkın özüne ilişkin bir kaybı doğurucu nitelikte değildir."
