abstract: "Bilişim bilimlerinin bir alt kategorisi olarak“yapay zekâ”ile çalışan sistemeler uzun zamandır kendi alanı dışında farklı alanlara da etki etmektedir. Bu alanlardan bir tanesi de İslam Hukuku bilim dalıdır. Bu çalışmamızda, yapay zekânın bilimsel mahiyetini, hangi bakış açısıyla değerlendirilmesi gerektiğini, pozitif hukukun konuyla ilgili kısa çözüm önerilerini ve İslam Hukuku bilim dalının konu ile ilgili ne gibi tekliflerde bulunabileceği ele alınmıştır. Giriş kısmında konunun önemine, etki alanına ve fıkhi açıdan neden ele alınması gerektiğine değinilmiştir. Birinci bölümde yapay zekânın anlaşılması için, detaylı bir şekilde ne ile karşı karşıya olduğumuz, yapay zekâ ile ilgili temel kavramlar ve yapay zekânın nasıl çalıştığı ele alınmıştır. İkinci bölümde, konunun hukuk bilimi tarafından nasıl ele alındığına örneklik teşkil etmesi için pozitif hukukta bu konunun nasıl ele alındığı gösterilmiştir. Bu bölümde yapay zekânın nasıl değerlendirildiği, hangi kanuni düzenlemeler altında ele alındığı, nesne olarak kendisine nasıl bakıldığı ve mahiyet itibariyle hangi başlık altında tartışıldığı tartışılmıştır. Çalışmamızın son bölümünde ise, yapay zekâ meselesinin İslam Hukuk Usulü ve İslam Hukuku açısından nasıl değerlendirilebileceği ele alınmıştır. Bu bölümde öncelikle konu için üst düzey öneme sahip olan ruh, bilinç ve akıl konuları, bilimsel tartışmaların ışığında açıklanmaya çalışılmıştır. Daha sonra hukuki ehliyet için temel rol oynayan akıl hakkında İslam Hukuk Usulü üzerinden bazı değerlendirmeler yapılmıştır. Metodolojik temeller atıldıktan sonra, yapay zekânın İslam Hukuku bakımından hangi başlık altında ele alınabileceğine değinilmiş ve yapay zekâdan doğacak zararların kimler tarafından giderilmesi gerektiği tartışılmıştır. Son olarak ise yapay zekânın ahlaki boyutuna değinilmiştir."
