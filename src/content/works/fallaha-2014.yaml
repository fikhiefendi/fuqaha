abstract: "Bu araştırma, fesat nikah akdinin İslam hukuku açısından incelenmesi ve toplumsal, ekonomik ve hukuki etkilerinin değerlendirilmesini amaçlamaktadır. Fesat nikah akdi, İslam hukukunda meşru olmayan ve geçersiz sayılan bir evlilik sözleşmesidir. Araştırma, farklı İslam hukuk okullarının fesat nikah akdi konusundaki görüşlerini karşılaştırmalı olarak ele almakta ve bu tür bir akdin sonuçlarını detaylı bir şekilde tartışmaktadır. Araştırmada, fesat nikah akdinin geçersiz olmasına rağmen bazı hukuki sonuçlar doğurabileceği, örneğin çocukların nesebinin korunması gerektiği belirtilmiştir. Ayrıca, fesat nikah akdinin toplumsal düzeni ve aile yapısını olumsuz yönde etkileyebileceği vurgulanmaktadır. Bu nedenle, İslam hukuku çerçevesinde bu tür akitlerin geçersiz sayılması ve gerekli önlemlerin alınması önemlidir. Araştırma, fesat nikah akdinin tarihi ve günümüzdeki uygulamaları, bu konudaki fıkhi tartışmalar ve ilgili hukuki düzenlemeler ayrıntılı olarak incelenmiştir. Sonuç olarak, bu araştırma, İslam hukuku perspektifinden fesat nikah akdinin toplumsal ve hukuki etkilerini kapsamlı bir şekilde ele almakta ve bu konuda önemli çıkarımlar sunmaktadır"
