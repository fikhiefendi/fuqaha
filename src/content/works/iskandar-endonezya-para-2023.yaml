abstract: "Bu çalışma, Endonezya'da para vakfı kanununun ve fıkhi perspektifinden uygulanmasının incelenmesi ve analiz edilmesi amacını taşımaktadır. Para vakıflar, İslam toplumu tarafından bir ibadet şekli olarak kabul edilen vetopluma fayda sağlama amacı güden önemli vakıf türlerinden birini oluşturmaktadır. İslam medeniyeti tarihinde, para vakıflar Müslüman toplumun gelişimine büyük katkılarda bulunmuştur. Ancak, para vakıfları konusu İslam hukuku alimleri arasında tartışmalı bir konu olmuştur. İslam hukukuna göre, çoğunlukla alimler para vakıflarının caiz olduğu konusunda hemfikirdirler. Ancak, vakıf varlıklarının türüne uygulanan şartlar ve koşullar konusunda alimler arasında farklı görüşler bulunmaktadır. Alimlerin para vakfı konusundaki farklı görüşleri, dikkate alınması gereken önemli bir konudur. Bu nedenle, Endonezya'da para vakfının uygulanmasını düzenleyen vakıf mevzuatı daha ayrıntılı bir şekilde incelenmelidir. Çalışmanın sonuçları, Endonezya'da para vakfının uygulanmasının temelini oluşturan 2004 tarihli 41 sayılı Vakıf Kanunu'nun önemini ortaya koymaktadır. Bu kanun, para vakıfların toplanması, para vakfının yönetimi ve dağıtımı gibi konuları düzenlemektedir. Endonezya'da vakıf kanunundaki genel hükümler, İslam hukuku ile uyumlu olmasına rağmen bazı özel hükümler İslam hukukunda yer almayan konuları ele almaktadır. Örneğin, İslam hukukunda yer almayan unsurları içeren Endonezya vakıf hukuku, vakıf unsurunda bazı düzenlemelere sahiptir. Ayrıca, İslam hukukunda nazir olarak tanımlanan vakıf yöneticileri veya örgüt şeklindeki Nazırlar Endonezya vakıf hukukunda ele alınmıştır. Nazır tarafından alınabilecek ücretler konusunda Endonezya vakıf hukuku %10 sınırlaması getirirken, İslam hukuku bu konuda belirli bir sınırlama koymamaktadır. Nazırın değiştirilmesi, vakıf malının değiştirilmesi, para vakfının yönetimi, vakıf senedi ve vakıf malını kötüye kullanma veya ihlal edenlerin cezalandırılması gibi konularda ise Endonezya vakıf yasasının hükümleri, İslam hukuku ile çelişmemektedir. Endonezya vakıf hukukunda bazı teknik konular da daha ayrıntılı bir şekilde ele alınmıştır."
