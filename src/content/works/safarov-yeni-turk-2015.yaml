abstract: "Kira sözleşmesi her iki tarafa borç yükleyen bir sözleşme olup kiraya verenin kiralananın kullanımını kiracıya bırakmayı üstlendiği, kiracının ise bunun karşılığında kira bedeli ödemeyi yüklendiği bir sözleşmedir. Her iki tarafa borç yükleyen bir sözleşme olması itibariyle hem kiraya verenin, hem de kiracının hakları ve borçları vardır. Kiracının haklarına, kiralananın kullanıma elverişli teslim edilmesini , sözleşme süresince kiralananın kullanıma elverişli bulundurulmasını , kiralananın ayıplı olması durumunda ayıbın giderilmesini isteme vs. gibi haklarını örnek verebiliriz. Buna karşılık, kiraya verenin kiralananın özenle kullanılmasını, kira bedelinin ödenmesini, kiralananın geri verilmesini isteme gibi hakları vardır. Çevresel etkilerden korunma ve barınma, günlük geçimi sağlama insanın temel gereksinimleri içerisinde yer almaktadır. İnsanların bu ihtiyaçlarını karşılamak için daha çok konut ve işyerlerini kiralama yoluna başvurdukları görülmektedir. Bu yönüyle konut ve çatılı işyeri kiraları önem arzetmektedir. Konut ve çatılı işyeri kirasının önemli unsuru olan konut, insanların sürekli barınma ihtiyacını karşılayan, kötü hava koşullarından ve çevresel etkilerden koruyan taşınmaz yapılardır. İşyeri ise, kişinin ticari, sınai, ekonomik, mesleki faaliyetlerini yürüttüğü veya mesleğinin icrasına hizmet eden faaliyeti yürüttüğü bir mekandır. Her ne kadar Kanun Koyucu çatılı işyerinden bahsetse de, genel eğilim çatılı çatısız ayrımınin kaldırılması yönündedir. Bunun yanı sıra, konut ve çatılı işyerine ilişkin hükümler, kullanımı kiracıya bırakılan eşya hakkında da uygulanır. Konut ve çatılı işyeri kiraları hem kiracıdan kaynaklanan nedenlerle, hem de kiraya verenden kaynaklanan nedenlerle sona erebilmektedir. Kiraya verenin ve eşinin, altsoy, üstsoy ve kanun gereği bakmakla yükümlü olduğu kişilerin ihtiyacı nedeniyle tahliye, yeni malikin gereksinimi nedeniyle tahliye kiraya verenden kaynaklanan sona erme nedenleridir. Yazılı taahhüt nedeniyle tahliye, iki haklı ihtar nedeniyle ve kiracının veya birlikte yaşadığı eşinin aynı ilçe veya belediye belde sınırları içinde oturmaya elverişli konutu bulunması nedeniyle tahliye, kiracıdan kaynaklanan tahliye nedenlerine dahildir. Bunun yanı sıra, konut ve çatılı işyeri kiraları genel hükümler gereğince de sona erdirilebilir."
