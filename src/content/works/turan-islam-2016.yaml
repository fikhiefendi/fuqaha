abstract: "Bu tezde bir bedel karşılığında mülkiyetin veya menfaatin karşı tarafa transferi ele alınmıştır. Tezimiz giriş ve üç bölümden oluşmaktadır. Birinci bölümde kabz (teslim alma) ve kabzla ilgili akit, bedel, mülkiyet, tasarruf ve teslim kavramları incelenmiştir. Tezimizin ikinci bölümünde kabz ve hukukî mahiyeti ele alınmıştır. Teslim almada öncelik hakkı araştırılmış ve yorumlanmıştır. Tezimizin üçüncü bölümünde ise, kabzın hukuki sonuçları üzerinde durulmuştur. Mülkiyet intikalinde en çok satım akdi, menfaat akdinde ise icare akdi araştırılmıştır. Teslimden önce mal ve bedelde tasarrufun hükümleri ortaya konmuştur. Günümüz meselelerine yansımaları irdelenmeye çalışılmıştır. Anahtar Kelimeler Kabz, Bedel, Tasarruf, Mülkiyet, Tazmin"
