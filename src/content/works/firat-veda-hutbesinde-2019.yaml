abstract: "İnsanoğlu, temel insani haklara sahip olabilmek ve koruyabilmek adına kadim çağlardan itibaren tartışma ve mücadele içerisinde olmuştur. Değişik kültürler, ekonomik ve siyasi düzenler ile din kuralları gibi farklı referanslar neticesinde insan haklarına yönelik birçok düşünce ve ilke ortaya çıkmıştır. 20. yüzyıl başlarına gelindiğinde uluslararası toplum, insan haklarına önem vermeye ve bu hakları korumayı amaç edinmiştir. İnsan hakları açısından ilk beyanname olarak belirtebileceğimiz Hz. Muhammed'in bütün dünyaya hitap eden Veda Hutbesi çalışmamızın konusudur. İlk bölümde, insan hakları kavramı, tarihsel gelişimi, uluslararası ve milli kaynakları ve sınıflandırmaları ile İslam hukukunun temel kaynakları, İslam'da hak kavramı, İslam'da temel insan hakları ve hürriyetleri incelenmiştir. Ayrıca, Medine Vesikası ve diğer önemli insan hakları beyannamelerine ana hatlarıyla değinilmiştir. Çalışmanın ikinci bölümünde Hz. Muhammed'in irat ettiği Veda Hutbesi'ndeki insan hakları genel olarak irdelenmiştir. Hz. Peygamber on dört asır öncesinden Veda Hutbesi ile insanlığa seslenerek insanın ve haklarının ebediyete kadar dokunulmaz olduğunu bildirmiştir. Muhafazası için gerekli tüm tedbirlerin alınması gerektiğini belirterek evrensel nitelikte bir hüküm getirmiştir. Çalışmada Veda Hutbesi öncesi durum ile Veda Haccı anlatılmış ve hutbenin metin içeriği açıklanmıştır. Araştırmamızda Veda Hutbesi'ndeki insan hakları; yaşama hakkı, eşitlik hakkı, malın korunması ve mülkiyet hakkı, kişisel hak ve hürriyetler, özel hayatın gizliliği, kadın hakları, suçun bireyselliği başlıkları altında detaylı olarak değerlendirilmiştir. Hz. Muhammed'in Veda Hutbesi'nde irat ettiği konuların, günümüzdeki uluslararası sözleşmelere yansıması, tüm insanlığa bir çığır açması ve hala geçerliliğini devam ettiren değerler zincirini oluşturması, medeni dünya ve tüm toplumlar için önem arz etmektedir. Çalışma konusu, hem hukuki ve hem de İslami boyutları ile işlenmeye çaba gösterilmiştir."
