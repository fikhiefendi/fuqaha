abstract: "Bu çalışma 19.yy Osmanlı Anadolu ve Rumeli vilayetlerindeki kız kaçırma ve kaçışma ile ilgili mahkeme davalarını incelemektedir. Osmanlı tebaasının hukukla girdiği ilişki ve hukuku kullanma mekanizmalarına değinmektedir. Zorla kadın kaçırma ve gönüllü kaçışma davaları, bu vakaların genellikle asayiş ve“ahlak”sorununa yol açması sebebiyle 19.yy Osmanlı'sının nüfus, güvenlik ve namus politikaları üzerinden izlenebilmektedir. Osmanlı İmparatorluğu, 1851 Ceza Kanunnamesi'nin 206.maddesinde kadın kaçırmayı bir suç olarak tanımlamasına karşın bu çabaları ne kız kaçırma ne de kızların gönüllü kocaya kaçmalarını engelleyemedi. Bu durum örfi evlenme ritüelleri ve bazı şeri kuralların standarize edilmesine karşı bir savaşa sebebiyet verdi.Bu tezle beraber, geleneklerin“modernleştirilmesi”, şeri hukukun standarize edilmesi ve Osmanlının kız kaçırma ve gönüllü kaçışmayı algılama biçimleri doğru evliliğin nasıl ve hangi yollarla olacağı hakkında bir gösterimde bulunur."
