abstract: "Akıl-nakil konusu, İslam düşünce tarihinde sürekli olarak tartışılan bir konu olmuştur. Kelâmcıların aklı ön plana çıkartıp onunla argümanlar geliştirdikleri bilinmektedir. Fakat naklin de kelâmda önemli bir yeri vardır. Kelâm âlimleri zahiriye, selefiye ve diğer nakilci ekollerin şiddetli eleştirilerine maruz kalmışlardır. Onlar tevil ve reyi kullanan kelâmcıları şiddetli bir şekilde yermişlerdir. Bu eleştirilere muhatap olan kelâmcıların onlara karşı kendilerini savunmaları ve alternatifler üretmeleri elzem olmuştur. Akıl-nakil konusundaki görüşlerine yer vereceğimiz Kâdî el- Beydâvî, Eş'arî mezhebine mensuptur. Bu mezhebe ciddi katkıları olmuştur. Beydâvî hem ele aldığı eserleriyle hem de görüş ve düşünceleriyle yaşadığı döneme ve sonraki çağlara hitap eden önemli bir isimdir. Hemen hemen her alanda eserler veren Beydâvî daha çok tefsir alanında tanınmakla beraber kelâm, fıkıh ve tasavvufla da ilgilenmiştir. Beydâvî'nin akıl-nakil tartışması bağlamındaki tercihleri, Eş'arîliğin konuya bakışını yansıtması açısından önem taşımaktadır.“Kâdî el-Beydâvî'de Akıl-Nakil İlişkisi”İsimli bu tez, bir giriş ile üç bölümden oluşmaktadır. Birinci bölümde Kâdî el-Beydâvî'nin yaşadığı dönem ve kelâmî görüşleri, ikinci bölümde akıl-nakil ilişkisi, üçüncü bölümde ise Kâdî el-Beydâvî'de akıl-nakil ilişkisi üzerinde durulmuştur."
