abstract: "Araştırmamızda fıkıh literatüründe taksimin bir alt türü olarak incelenen muhâyee akdini Modern Hukuktan İslam Hukukuna uyarlanan genel akit nazariyesini göz önünde bulundurarak sistematik bir biçimde işlemeye çalıştık. Daha önce bu şekilde bir incelemeye tabi tutulmamış olan muhâyee akdi muasır birkaç eserde kısaca işlenmiş olup genelde unsurları, hükümleri, sona ermesi gibi alt başlıklara ayrılarak diğer akit türleri gibi incelenmek yerine daha çok bütün yönleriyle bir başlık altında kaleme alınmıştır. Biz ise giriş, sonuç ve üç ayrı bölümden oluşan çalışmamızda şu şekilde bir yol izledik:Giriş bölümünde muhâyee akdi ile doğrudan irtibatlı olan müşterek mülkiyet kavramına ve onu sonlandırma yollarından bilhassa taksime teferruatlı şekilde temas ettik.Birinci bölümde muhâyee akdinin tarifi, hukukî dayanağı, unsurları ve genel bazı şartları ile hukukî niteliği hakkında bilgi verdikten sonra çeşitleri konusunu ayrıntılı şekilde ele aldık.İkinci bölümde birinci bölümdeki açıklamaların ışığında muhâyeenin hükümleri ve akabinde sona ermesi hakkında bilgi vermeye çalıştık. Akdin hükümlerinin bu şekilde çeşitlerinden sonra ve ayrı bir bölümde ele alınmasının nedeni ise her bir türüne bağlanan hükümlerin birbirinden farklı olmasıdır. Söz konusu bu hükümleri akdin bağlayıcılığı, hukukî sonuçları ve akdî mes'ûliyet başlıkları altında ele aldık.Üçüncü ve son bölümde ise İslam Hukukundaki şekli ile ayrıntılı şekilde incelenen muhâyee akdinin Türk Medenî Hukukundaki yerine ve devremülk kavramı ile olan irtibatına temas ettik.Bu nacizâne çalışmamızla ilim dünyasına katkı sağlamayı ve bu yolda yürüyenlere faydalı olmayı temenni ederim."
