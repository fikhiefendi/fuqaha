abstract: "Para, günümüz dünyasında artmakta olan ticari faaliyet ve mübadeleler kapsamında sürekli olarak karşı karşıya kaldığımız bir olgudur. Paranın günümüzde çok fazla şekil aldığını hepimiz bilmekteyiz. Emtia paralardan itibari paralara, sanal paralardan kripto paralara kadar mübadele aracı olarak kullanabileceğimiz para çeşitleri artmıştır ve artmaya devam etmektedir. Tarih boyunca paranın makul bir istikrarlı serüveni vardı, ancak teknolojinin gelişimiyle hızlı bir şekilde para anlayışımız değişmiştir. Kripto paralar yavaş yavaş günlük hayatımıza oturmaya başlamıştır. Peki bu gelişimin Fıkhî değerlendirilmesi nasıl yapılmıştır? Bu tezde kripto paralara geçmeden öncelikle para kavramının anlamını, paranın taşımış olduğu özellikleri ve İslam'da para anlayışından bahsedilecektir. Kripto paraların teknolojik altyapısı olan Blockchain (blokzinciri), işlemlerin güvenliğini nasıl sağladığı anlatılacaktır. Kripto paraların çeşitleri ve dünya genelinde uygulamaları ve hukuki statüleri değerlendirilecektir. Son kısımda ise İslam hukukçuların kripto para hakkındaki görüşleri bildirilecektir."
