abstract: "Bu tez 16. yüzyıl Osmanlı Anadolu'sunda tarihsel olarak Kızılbaş diye bilinen kişi ya da gruplara isnad edilen suçları konu edinmektedir. Osmanlı devleti tarafından Kızılbaşlara karşı yapılan suçlamalar bu tezin merkezindedir. Bu tez Osmanlı devletinin kendi tebaasıyla arasında olan ilişkiyle ilgilenmektedir. Bu çalışmanın hedefi Osmanlı ve Safavi devleti arasındaki politik mücadeleyi incelemek ya da dini bir analiz yapmak değildir. Bu çalışma türlerine, içeriklerine ve benzerliklerine dayanarak Kızılbaşlara karşı yapılan suçalamalar için geniş bir kategorizasyon önermektedir. Burada çalışılan örnekler ya devletin dini hassasiyetlerini ya da siyasi çıkarlarını yansıtmaktadır. Suçlamaların tür, içerik ve benzerlikleri Sünni İslamın temel prensiplerini, toplumsal ahlakı veya siyasi çıkardan hangisini ya da hangilerini ihlal ettiklerine göre belirlendi. Bu değerlendirme bir kategorilendirmenin mümkün olup olmadığını ve suçları kesin bir biçimde“siyasi”ve“dini”suçlar olarak ayırmanın olası olup olmadığını sorgulamaktadır. Giriş bölümü bu çalışmayı 16. yüzyılda Osmanlı devletinin bir imparatorluk haline gelmesi ve Sünnileşme sürecinin içinde konumlandırmaktadır. İkinci bölüm Kızılbaş kavramının siyasi ve dini otoritelerce nasıl tanımlandığını incelemektedir. Üçüncü bölüm Osmanlı'daki cezai süreci incelemektedir. Dördüncü bölüm Kızılbaşlara isnat edilen suçları kategorilendirmekte ve her kategoriyi birden çok örnekle detaylı bir biçimde incelemektedir."
