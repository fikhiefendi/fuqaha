abstract: "Hz. Osman dönemi İslâm tarihi için önemli bir zaman dilimini ifade etmektedir. Dolayısıyla dönemin bütünsel olarak ve değişik perspektiflerle ele alınması, tarihi olayları anlamlandırma noktasında daha sağlam veriler ortaya koyacaktır. Bu bağlamda Hz. Osman dönemini iktisâdî bir bakış açısı ile bütünüyle ele alma gayesinde olduğumuz çalışmamızda Hz. Osman'ın hilafete gelişi, Hz. Osman'ın mâlî politikasının ana hatları, İslâm devletinin dayandığı sınırlar ve neticesinde kozmopolit yapısı daha da belirginleşen toplumun değişen sosyoekonomik yapısı hakkında bilgiler verilerek konuya giriş yapılmıştır. Devamında devlet gelirleri, Müslümanlardan ve gayrimüslimlerden elde edilen gelirler şeklinde sınıflandırılmış, dönemde mevcut iktisâdî yaşayış derinlemesine incelenmiştir. Sonrasında gelirlerin sarf yerleri hakkında bilgi verilmiştir. Çalışmanın son bölümünde ise iktisâdî yaşayışın aktif bir biçimde gözlemlenebileceği saha olan dönemin pazarları, ticaret hayatı, tarım ve hayvancılık, zanaat hakkında bilgiler okuyucunun idrakine sunulmuştur."
