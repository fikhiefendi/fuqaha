abstract: "Sorunlu Finasmanı (NPF), bir bankacılık kurumunun sağlık seviyesini ölçmek için kullanılan göstergelerden biridir. Araştırmanın amacı, NPF oranını etkileyen Endonezya'daki İslami Bankalarda makroekonomi ve bankaya özgü faktörleri tespit etmektir. Bu araştırmada kullanılan yöntem, 2014 yılının ilk çeyreğinden 2017 yılının dördüncü çeyreğine kadar olan üç aylık verilere sahip panel veri analizidir. Sonuçlar, LNASET ve FDR'nin NPF'yi olumlu yönde etkilediğini gösterirken, GSYH, INFL, FR, CAR ve ROA NPF üzerinde olumsuz etkileri vardır. Öte yandan, UNMPT ve GCG'nin NPF düzeyi üzerinde önemli bir etkisi yoktur. Bulgulara dayanarak çeşitli önerilerde bulunuldu. İlk olarak, İslami Bankaların FR, LNASET, CAR, FDR, ve ROA seviyelerini izlemesi gerekir. İkincisi, İslami Bankalar makroekonomik koşullara daha duyarlı olmalıdır. Ayrıca, düzenleyici olarak hükümetin, makroekonomik değişkeni, özellikle enflasyon oranını kontrol etmesi ve toplumun borçlarını ödeme yeteneğini arttırması için GSYH büyümesini iyileştirmesi gerekir."
