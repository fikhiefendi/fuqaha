abstract: "Bu çalışma, Körfez İşbirliği Konseyi (KİK) ülkeleri ve Malezya'da seçilen 30 tam teşekküllü İslami bankanın, 2018 yılı için Şeriat Denetim Kurulu'nun (SSB) özelliklerinin Kurumsal Sosyal Sorumluluk (KSS) ifşa seviyesi üzerindeki etkilerini ampirik olarak incelemektedir. İslami bankalar, şüphesiz yıllar içinde çok başarılı olduklarını kanıtladılar, ancak ortaya çıktıkları İslami ekonomik ideallere ulaşıp ulaşamadıkları sorusu cevaplanmayı bekliyor. Bu çalışmada, SSB özelliklerinin İB'lerin KSS performansında oynadığı rolü araştırıyoruz. KSS ifşa, KSS performansı için bir vekil olarak kullanılır. Daha önceki çalışmalarda, Yönetim Kurulu büyüklüğü, üyelerinin şeriat geçmişi, şeriatta doktora yeterliliği, yönetim kurulunun uluslararasılığı ve mesleki yeterlilik gibi SSB özelliklerinin İslami bankalar (IBs) tarafından KSS ifşası düzeyindeki etkilerini inceledik. Çoklu regresyon analizi kullanarak, KSS ifşasının; daha büyük SSB boyutundan, şeriat / fıkıhta doktora yeterliliğine sahip daha fazla akademisyenden ve SSB üyelerinin artan şeriat bilgisinden, olumlu ve anlamlı bir şekilde etkilendiğini bulduk. KİK ve Malezya arasında yapılan çift yönlü ANOVA karşılaştırması, iki bölge arasındaki KSS ifşa seviyelerinde anlamlı bir fark bulamadı. Ancak, KİK ülkeleri arasında yapılan aynı karşılaştırma, KSS ifşasında bölgesel farklılıkların varlığını doğrulamıştır. KSS'nin tanımlayıcı analizi, ifşa seviyelerinin; genel olarak orta (%55) olduğunu ve gönüllü ifşalar söz konusu olduğunda kritik derecede düşük olduğunu göstermektedir."
