abstract: "Ne geleceğin planı yapılırken geçmişten kopulabilir, ne de gelecek için geçmiş yok sayılabilir. Aydınlatılan belge ve konular devletlerin özellikle siyasi tarihlerinin güçlenmesini sağlamaktadır. Son yıllarda yerel tarih araştırmalarında gün yüzüne çıkan şer'iyye sicilleri Osmanlı taşra işleyişinin, en derin izlerini taşıyan önemli kaynaklardandır. Bu kaynaklar sayesinde Devlet-i Aliye-yi Osmaniye'nin yönetimdeki işleyişini muazzam bir şekilde ortaya koymaktadır. Yapılan çalışma çeşitli belge ve konuları ihtiva etmemiş olsa bile, döneminde kayda geçirilmesi ve saklanması devletin sağlam temeller üzerinde oturmuş olduğu gözardı edilemez bir gerçektir. Şer'iyye sicilleri, kadıların davalardaki hükümleri ve merkezden gönderilen emir, ferman ve beratlar ihtiva eden belgelerden oluşmaktadır. Şer'i mahkemelerden kalan bu defterler birinci elden kaynak özelliği taşımaktadır Osmanlı'daki sosyal devlet anlayışının taşradaki en güzel örneklerinden birini sunan 212 numaralı Urfa Şer'iyye Sicili belgeleri eytam sandığı kayıtlarını içermektedir. Sadece kefalet ve rehin borçlarının kaydedildiği belgelerden oluşmaktadır. Geçmişten günümüze hangi dil ve alfabeyle yazılmış olurlarsa olsunlar gün yüzüne çıkarılan her belge o milletin tarihi zenginliğiyle beraber sahip olduğu tüm değerleri insanlığa ulaştırır. Yapılan çalışmada XIX. yüzyılın ikinci yarısında Urfa'ya ait yerel bilgiler gün yüzüne çıkarılmıştır. 212 numaralı Urfa Şer'iyye Sicili 93 varak, 186 sayfa, 584 belgeden oluşmaktır. Dört bölümden oluşan çalışmanın ilk bölümünde Urfa'ya ait bilgiler, şer'i mahkemeler ve bu mahkemelerdeki görevliler ve tutulan belgelerle ilgili genel bilgiler sunulmuştur. İkinci bölümde 212 numaralı Urfa Şer'iyye Sicili'nin transkribi ve transkribe bağlı belge özetleri yapıldı. Üçüncü bölümde materyal ve yöntem ve dördüncü bölümde transkribi yapılan belgelere ait bulgular gün yüzüne çıkarılmıştır."
