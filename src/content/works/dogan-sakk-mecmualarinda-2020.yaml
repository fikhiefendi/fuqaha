abstract: "Osmanlı mahkemelerinde verilen kararların ve tutulan kayıtların toplandığı defterler olarak bilinen şerʻiyye sicilleri, bu dönemi çalışan araştırmacılar için en önemli kaynaklar arasındadır. Osmanlı Devleti'nde şerʻiyye sicillerinin imlâ ve üslûp kâidelerini gösteren birçok sakk mecmûasının kaleme alındığı görülmektedir. Bu mecmûalar arasında -ilk matbu sakk mecmûası olması hasebiyle- Debbağzâde Nuʻman Efendi'nin Tuhfetü's-Sukûk'u ayrı bir önemi hâizdir. Bu tez çalışmasında XVIII. yüzyılın sonlarında yazılmış olan, dönemin önemli sakk mecmûalarından olup, birçok baskısı bulunan Tuhfetu's-Sukûk isimli eserin hüccet bölümünün transkripsiyon ve değerlendirmesi yapılacaktırr. Tez giriş ve üç bölümden oluşmaktadır. Giriş kısmında şerʻiyye sicilleri ve sakk mecmûaları hakkında kısa bir tarihi süreç ve kavramsal çerçeve bilgisi verilmiştir. Çalışmanın birinci bölümünde müellifin hayatı ve eserleri hakkında bilgi verilmiş, ikinci bölümde ise eserin hüccet kısmı incelenerek müellifin faydalandığı kaynaklar değerlendirilmiştir. Eserin hüccetler kısmının transkripsiyonu ise tezin üçüncü ve son bölümünde yapılmıştır."
