abstract: "Kutbüddinzâde İznikî, 15. yüzyıl Osmanlı toplumunun önemli âlimlerinden biridir. Bu çalışmada önde gelen eserlerinden Mürşidü'l-Müteehhilîn adlı eserini fıkıh sosyolojisi perspektifiyle incelemeyi amaçlamaktayız. Söz konusu eserde nikâh kurumunun yalnızca fıkhın genel hükümleri çerçevesinde mi ele alındığı, yoksa dönemin toplumsal şartlarıyla yani örf ile irtibatlı bir biçimde mi temellendirildiği sorusu etrafında şekillenmektedir. İslam medeniyetinde nikâh, bireysel bir tercih alanı olmanın ötesinde, toplumsal düzenin korunması, ahlâkî değerlerin muhafazası ve neslin devamı açısından merkezi bir kurum olarak değerlendirilmektedir. Fıkıh literatüründe nikâhın hükmü, kişilerin sosyal ve ekonomik durumlarına göre farklılaşabilmektedir. Bu durum fıkhın sosyoloji ile kurduğu dinamik ilişkiye işaret etmektedir. Bu çalışmada, klasik bir fıkıh metni olmaktan ziyade nasihat ve irşat metni olan Mürşidü'l-Müteehhilîn üzerinden nikahın ve ailenin hangi sosyolojik dinamiklerle ilişkilendirildiği analiz edilmiştir. Eserde yer alan nikâhın fayda ve zararlarına dair tasnifler, kadın-erkek rolleri, düğün ahkâmı, ahlâkî bozulma algısı ve ideal aile gibi temalar, fıkıh sosyolojisinin kavramsal çerçevesi ışığında değerlendirilmektedir. Böylece ahkama dair hükümlerin arka planındaki toplumsal kaygılar ve dönemin sosyo-ekonomik şartlarının hüküm ve tavsiyelere nasıl yansıdığı ortaya konulmaya çalışılmıştır. Birinci bölümde fıkıh sosyolojisinin teorik zemini ve bazı temel kavramlar açıklanmış, ikinci bölümde Kutbüddinzâde İznikî'nin hayatı, ilmî şahsiyeti ve yaşadığı dönemin toplumsal yapısı incelenmiştir. Üçüncü bölümde ise eser merkezli analiz yapılarak nikâh kurumunun toplumsal boyutları ve örfün ahkama etkisi değerlendirilmiştir. Sonuç olarak bu tez, klasik bir fıkıh/ilmihal metninin yalnızca şerî klasik hükümler bütünü olarak değil, aynı zamanda toplumsal bir gerçekliğe cevap veren dinamik bir söylem olarak okunabileceğini ortaya koymaktadır. Aynı zamanda şerî dayanaklar kullanılarak yaşanılan çağın sorunlarına dair hükümler çıkarmanın bir örneği olarak gösterilebilmektedir. Hem Osmanlı ilmî geleneğine ait bir eserin yeniden değerlendirilmesine katkı sunmakta hem de fıkıh sosyolojisi alanında metodolojik bir örneklik teşkil etmektedir."
