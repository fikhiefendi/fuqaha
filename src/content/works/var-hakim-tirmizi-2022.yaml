abstract: "Hakîm et-Tirmizî'nin fıkıh sahasında kaleme aldığı Kitâbü'l-Menhiyyât adlı eseri dinde yasaklanan hususları ele alan bir çalışmadır. Eserde fıkıh ve fıkhın bölümlerini ilgilendiren hadisler olduğu gibi, tasavvuf, ahlak, edep kurallarını ilgilendiren ve bir müslümanın yapmaması gereken fiilleri ve davranışları konu edinen hadisler de mevcuttur. Tirmizî eserinde hocalarından aldığı hadisleri senetsiz olarak nakletmiş, altında ayet ve hadislerden faydalanarak ve çeşitli fıkhi mülahazaları ekleyerek konuları açıklamıştır. Eserde yüz yetmiş hadis ve bu hadislerin altında açıklamalarda kullanılan birçok merfu ve mevkuf haberler bulunmaktadır. Hadislerin kaynakları kitabın muhakkiki Muhammed Osman Huşt tarafından tahriç edilmiştir. İki bölümden oluşan çalışmanın birinci bölümünde Hakîm et-Tirmizî ve Kitâbü'l-Menhiyyât adlı eseri hakkında bilgi verilmiştir. İkinci bölümde ise Tirmizî'nin Kitâbü'l-Menhiyyât adlı eserindeki nehiy hükümleri barındıran hadisleri ve Tirmizî'nin hadislerdeki nehiylere dair açıklamaları zikredilerek değerlendirmeye tabi tutulmuşturmiştir. Ayrıca Tirmizî'nin hadislerdeki nehiylerin hikmetine dair yapmış olduğu yorumlar ve açıklamalar mezheplerin görüşleriyle birlikte fıkhi yönden tahlil edilmiştir. Tez çalışması sonucunda Tirmizî'nin çok yönlü bir âlim olduğu, ayet ve hadisleri yeri geldiğinde bir fıkıh âlimi edasıyla kendisine kaynak edindiği, hadislerin şerhlerinde fıkhî açıklamalarla tasavvufi yorumları güzel bir şekilde harmanladığı müşahade edilmiştir."
