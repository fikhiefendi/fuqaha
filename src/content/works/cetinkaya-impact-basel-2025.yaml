abstract: "2008 küresel finansal krizinin ardından geliştirilen Basel III düzenlemeleri, bankaların sermaye yeterliliği, likidite yapısı ve risk yönetimi uygulamalarını güçlendirmeyi amaçlamaktadır. Bu tez, Basel III'ün finansal performans üzerindeki etkilerini ve Türkiye'de faaliyet gösteren katılım (İslami) ve mevduat (konvansiyonel) bankalarının uyum davranışlarını karşılaştırmalı olarak incelemektedir. Çalışma; kârlılık, verimlilik, likidite, borç ödeme gücü ve risk yönetimi gibi performans göstergeleri üzerinden, Basel III öncesi ve sonrası dönemler için regresyon analizleriyle gerçekleştirilmiştir. Ayrıca döviz kuru, faiz oranı, enflasyon ve aktif büyüklüğü gibi makroekonomik değişkenler kontrol edilmiştir. Elde edilen bulgular, Basel III'ün bankacılık performansını etkilediğini; ancak bu etkinin bankacılık modellerine göre farklılık gösterdiğini ortaya koymaktadır. Her iki bankacılık türünde de kârlılık azalırken, bu düşüş aktif kârlılığı ve faiz dışı gelirlerde daha belirgindir. Katılım bankalarının enflasyona karşı daha duyarlı olduğu ve operasyonel verimsizliklerden daha fazla etkilendiği görülmüştür. Verimlilik açısından mevduat bankaları maliyetlerini azaltırken, katılım bankalarının hizmet geliri verimliliğinde düşüş yaşanmıştır. Likidite bakımından katılım bankaları daha yüksek likidite tamponları korurken, kredi verme konusunda temkinli davranmıştır. Ödeme kabiliyeti açısından, katılım bankaları menkul kıymet yönünde, mevduat bankaları kaldıraç oranlarını yükseltmiştir. Risk yönetiminde ise katılım bankalarının karşılık oranlarını artırarak ve bilanço dışı riskleri azaltarak temkinli strateji izlediği tespit edilmiştir. Genel olarak, bulgular Basel III'ün bankacılık performansının üzerinde çeşitli etkilere sahip olduğunu doğrulamaktadır. Tez, düzenleyici politikaların bankacılık modellerinin yapısal farklılıklarını gözeterek tasarlanması gerektiğine dair politika önerileri sunmaktadır."
