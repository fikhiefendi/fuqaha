abstract: "İngiliz sömürge dönemi (1757-1947) İslamiyet sonrası Hint alt kıtası tarihi için oldukça önemli bir dönemdir. Bölgede daha önce hâkim olan Müslümanların İngilizlere yenilmeleri sonucunda müslümanlar arasında ortaya çıkan dinî ve siyasî istikrarsızlıklar, Hint alt kıtası müslüman fikir dünyasında bu duruma bir tepki olarak doğan ve radikal etkiler meydana getiren çok sayıda hareketin ortaya çıkmasına neden olmuştur. İngiliz sömürgedöneminde Hint alt kıtasında ortaya çıkan hareketlerin başında ise kuşkusuz Hacı Şerîatullah'ın liderliğinde Bengal bölgesinde ortaya çıkan Ferâiziyye hareketi gelmektedir. Ferâiziyye hareketi, bir taraftan İngilizlere karşı mücadelede önemli rol oynaması diğer taraftan ise müslümanların dinî ve siyasî hayatına olan etkisi bakımından Müslüman Hint alt kıtası tarihi önemli bir yere sahiptir. Bu tez Hacı Şerîatullah'ın hayatı, fikirleri, İngiliz hükümetine karşı tutumu, Ferâiziyye hareketi; hareketin doğuşu, arka planı, gayesi, özellikleri, Bengal müslüman topluluğuna olan etkisini ele almayı amaçlamaktadır. Ayrıca Hanefiliğin hâkim olduğu bölgede, Vehhabî düşüncelerinden etkilenen bir harekete Bengal müslümanlarının ilgileri ve sonraki dönemlerde bölgedeki İslamî fikir dünyasında hareketin izleri analiz edilmiş, bu hareketin Bengal-Müslüman topluluğuna etkisi tespit edilmeye çalışılmıştır."
