abstract: "Çalışmamız, İslam hukukunda boşanma sonrası kocanın nafaka yükümlülüğünü eski ve günümüz medeniyetlerin hukuk sistemleri ile mukayese ederek ele almıştır. Bu konu hazırlanırken diğer hukuk sistemlerindeki nafaka anlayışları sistematik ve bütüncül bir şekilde incelenmiştir. İslam hukuk sisteminde ise nafaka hakkında tek bir mezhebin görüşüne bağlı kalınmayarak dört mezhebin görüşlerine yer verilmiştir. Böylece bu çalışma ile İslam hukuk sisteminin adaletli ve hakkaniyetli nafaka ölçüsü olan iddet süresi ve maruf miktarının diğer hukuk sistemlerinin nafaka anlayışlarına yol göstermesi hedeflenmiştir. Çalışmamızın bölümlerine geldiğimizde ise bunlar; bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte araştırmamızın konusu, amacı, yöntemi, önemi, sınırları ve benzer araştırmalardan farkı ortaya konularak ele alınmıştır. Birinci bölümde ise eski ve günümüz medeniyetlerinin hukuk sistemlerinde boşanma sonrası kocanın nafaka yükümlülüğü ile ilgili kanun maddelerinin çevirileri ve nafaka ile ilgili uygulamalar tek tek incelenmiştir. Böylece bu bölümde ilk medeniyetlerden itibaren günümüze kadar olan nafaka yükümlülüğünün varlığı, önemi ve gelişim süreci gösterilerek bu yükümlülüğün hukuk tarihindeki yerinin daha iyi anlaşılması amaçlanmıştır. İkinci bölümde ise öncelikle kocanın nafaka yükümlülüğünün İslam hukukundaki yeri, önemi ve ilgili tanımları işlenmiştir. Daha sonra kocanın nafaka yükümlülüğünün İslam ülkelerindeki gelişim süreci ortaya konulmuş ve bu nafaka yükümlülüğü diğer hukuk sistemleri ile mukayese edilmiştir. Sonuçta ise elde edilen bilgiler ve bulgular değerlendirilmiştir."
