abstract: "Linguistik ya da dilbilim daima modern döneme ait Batı ürünü gibi sunula gelmiştir. Bu alanda yazılan Batı menşeli eserler, bu disiplinin tarihsel gelişiminden bahsederken daha çok Eski Yunan ve Romalılar tarafından yürütülen çalışmalar üzerinde durmaktadır. Bununla birlikte söz konusu eserler, Orta çağda Arapların dilbilime dair katkılarından ve bu alandaki öncü çalışmalarından nadiren bahsetmekte veya hiç bahsetmemektedir. Buradan hareketle bu çalışmada, modern anlayışıyla birlikte dilbilimin Orta çağda Arap dilbilimciler tarafından başladığı ve Arap dilbilimci İbn Fâris'in“es-Sâhibî fî Fıkhi'l-Luğa ve Süneni'l-Arab fî Kelâmihâ”(Dilin Fıkhı ve Arapların Konuşma Tarzları) adlı eseriyle müstakil bir disiplin olarak hüviyet kazandığı ispat edilmeye çalışılmaktadır. Çalışmada, dilbilimin tarihsel gelişimi doküman incelemesi yöntemiyle ele alınarak incelenmiş ve İbn Fâris'in Fıkhu'l-Luğa anlayışının filoloji değil linguistik eşdeğeri olduğu tartışılmıştır. Elde edilen bulgular neticesinde, İbn Fâris'in söz konusu eserinin müstakil bir disiplin olarak dilbilime dair kaleme alınan ilk eser olduğu ve bu eserin filolojiden daha kapsamlı olup linguistik ya da dilbilime eşdeğer olduğu sonucu elde edilmiştir."
