title: "İbn Faris'in “Es-Sâhibî Fî Fıkhi'l-Luğa”adlı Eserinin İncelemesi Işığında Fıkhu'l-Luğanın Bir Dilbilimin Dalı Olarak Tanıtımı ve Tarihsel Gelişimi"
titleTranslation: {"en": "The introduction and historical development of Fıkhu'l-Luğa as a branch of linguistics in the light of analyzing Ibn Faris's“es-Sâhibî fî Fıkhi'l-Luğa”"}
