abstract: "islam temeli üzerine oturan, fakat diğer bazı dinlerden de etkilenen Bahailik, Şii imamiyye fırkası bünyesinde doğan Şeyhiyye ve Keşfiyye diye adlandırılan tasavvufi harekete dayanmaktadır. Kendi taraftarlarınca“Din”olduğu iddia edilen Bahailik“ Eklektik/Seçmec i”özel l iğe sahiptir ve“Mesih i ”karakter taşı maktad ır. Bahaİlik, iran'da o.tuya çıkmıştır ve ortaya çıkmasında İran toplumunun iÇinde bulunduğu sosyal, kültürel ve ekonomik şartların önemli bir yeri vardır. Bahailiğin kurucusu, lakabı Bahaullah otan Mirza Hüseyin Ali'dir. Bahaullah'ın ölümünden Sonra yerine Abdülbaha, daha sonra da torunu Şevki Efendi geçmiştir. Günümüzde Bahailer israil'in Hayfa şehrinde bulunan Yüce Adalet Evi tarafından yönetilmektedir. Bu çalışmada Bahailikte ibadet ve kutsal günler konuları araştırılmıştır. Giriş bölümünde Bahailik hakkında kısa bilgi verilmiş, Bahailiğin tarihsel gelişimi, inanÇ esasları, Bahailiğin prensipleri ve günümüzde Bahailik konuIarına değinilmiŞtir. Birinci bölümde Bahailikte İbadet konusu üzerinde durularak, çalışma ve hizmet, dua, abdest , namaz, oruç, hac, zekat, Tanrı hukuku ve kutsal sözlerin her gün okunması gibi konularda bilgi verilmiştir. İkinci bölümde Bahailikte şer'i hükümler konusu ele alınmıştır. Evlenmeboşanma, miras ve vasiyetname, Bahai takvimi ve l9 gün ziyafeti, bağımlılık yaPan maddelerin hükmü, hükümete sadakat ve sonrasında Bahaİlikte diğer şer'i hükümler konularında bilgi verilmiştir. Son bölümde ise Bahailikte kutsal günler ve bayramlar nelerdir? Bu kutsal günler ve bayramlarda neler yaparlar? Bu konular anlatılmıştır. Amaç, dünyada ve Türkiye'de var olan Bahailiğin ibadet şekillerinin, şer'i hükümlerinin, kutsal günler ve bayramlarının neler olduğu ve bu kutsal günler ve bayramlarda neler yaptıklarını açıklamaktır."
