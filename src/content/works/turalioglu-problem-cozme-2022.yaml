abstract: "İnsanlar, yaşam süreçlerinde geçirdiği dönemlerin her birinde basit, karmaşık, farklı boyutlarda ve oldukça çeşitli problemlerle karşı karşıya kalmaktadır. Günümüzde bireylerin karşısına en çok fıkhî problemlerin çıktığı söylenebilir. Karşılaşılan problemler kimi zaman yaşamanın doğal bir parçası olarak görülmekte kimi zaman da önem derecesi ve boyutuna göre stres, bunalım, depresyon gibi olumsuz duygulara neden olabilmektedir. Problem çözme becerisi de, bireyin hayatta karşılaştığı yaşam problemleri ile etkin olarak mücadele etmesini sağlayan üst düzey bir yetenektir. Bu araştırmada temel olarak problem çözme yönteminin fıkıh öğretiminde kullanımı konu edilmektedir. Bu kapsamda konuyla ilgili literatür taranarak hazırlanan taslak çerçevesinde ders kitapları incelenmiştir."
