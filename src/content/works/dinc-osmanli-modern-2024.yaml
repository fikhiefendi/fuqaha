abstract: "Ticari ve mali temelli bir sosyal sınıf olan burjuvazi 19'uncu yüzyıl başlarında Fransa ve İngiltere gibi Batı Avrupa ülkelerinde toplumsal egemenliği ele geçirdi ve bu egemenliğini 19'uncu yüzyıl boyunca yeryüzünün geri kalan yerlerine de yaydı. Michel Foucault'nun Gözetlemek ve Cezalandırmak: Hapishanenin Doğuşu (Surveiller et Punir: Naissance de la Prison) isimli eserinde ortaya koyduğu üzere, burjuvazi egemenliği bir disipliner toplum inşasına ve bunun da temelinde olmak üzere bir hapishane sistemine dayalıydı. Yeni Çağ'dan ve bilhassa Aydınlanma döneminden beri toplumsal disiplin fikrinin ve ona dayalı çeşitli idari dönüşümlerin bir araya gelmesi sürecinin sonunda 1810 Fransız Ceza Yasası ile Fransa'da yasal olarak neredeyse bir gün içinde tesis edilmiş olan bu hapishane sisteminin Osmanlı Devleti'ne ulaşıp orada da oluşturulması uzun sürmedi. 1839 Tanzimat Fermanı ve onu müteakip 1840 Ceza Kanunnamesi ile önce Batı Avrupa merkezli (uluslararası) burjuvazinin Osmanlı Devleti'ndeki ortağı olan modern Osmanlı bürokrasisinin can ve mal güvenliği sağlanıp bu yeni bürokratların geleneksel elitler ve hatta bir bakıma hükümdar üzerinde yetkili ve güçlü hâle gelmesi sağlandı. 1851 Ceza Kanunname-i Cedid'i ile bir nebze geri adım atılarak geleneksel elitlere ve yarı-elitler ile ahali gibi diğer geleneksel sosyal sınıflara, ama özellikle Müslüman olanlarına birtakım tavizler verildi. Sonuncuların temsil ettikleri İslam şeriatına yeni kanunnamede 1840'takine göre daha büyük saygı ifadelerinde bulunuldu. Yine de 1840 Ceza Kanunnamesi'nde girilmiş olan yola bu ikincisinde de devam edildi. Nihayet Kırım Harbi'nin sonunda 1856 Islahat Fermanı ile ve en nihayetinde de 1858 Ceza Kanunname-i Hümayunu ile modern laik burjuva yasası ve onun hapishane sistemi Osmanlı Devleti'nde de oluşturuldu ve dolayısıyla uluslararası burjuvazi ile modern bürokrasi Osmanlı Devleti ve toplumu üzerinde egemenleşti. Modern Osmanlı bürokrasisi içindeki muhafazakâr Müslümanlar ve özellikle Ahmed Cevdet Paşa bu kanunlaştırma faaliyetinde kilit önemdeydi. 1859 Kuleli Vakası'nda bazı popüler yarı-elit“madun”Müslümanların bu sürece olan son sert karşı çıkışının bastırılmasıyla beraber süreç temelde tamamlandı. Bu çalışmada, özellikle bu kanunnameler üzerinden, sosyal sınıflar arası ilişkilere dayalı yapısal bir“Foucaultiyen”analizle hapishane sisteminin ve genel olarak burjuvazi ve modern bürokrasiye ait disipliner sosyal kontrolün Osmanlı Devleti'nde yasal ve söylemsel kuruluşu irdelenmektedir."
