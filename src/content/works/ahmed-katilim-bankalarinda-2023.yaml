abstract: "Bu çalışmada, katılım bankalarının karlılıklarını etkileyen değişkenlerin belirlenmesi amaçlanmıştır. Çalışmada katılım bankalarının aktif ve öz sermaye karlılıkları bağımlı değişkenler olarak kullanılmıştır Bağımsız değişkenler olarak katılım bankalarının 2015-2021 yılları arasında toplam aktifler, personel sayısı, finansal varlıkların aktif toplamına oranı, kaldıraç oranı, kâr payı giderleri/toplam aktifler, toplam toplanan fonlar / toplam aktifler, likit aktiflerin toplam aktiflere oranı, faaliyet giderleri oranı, kredi/mevduat oranı, kullandırılan fonlar/toplam aktifler, takipteki krediler (net) / toplam krediler ve alacaklar ve bilanço dışı yükümlülükler / aktif toplam değişkenleri seçilmiştir. Değişkenlerin banka karlılıkları üzerindeki etkisi için panel veri analiz yöntemi kullanılmıştır. Değişkenlerin sabit etki modeline göre katılım bankalarında araştırmada incelenen serilerinin banka karlılığı üzerinde etkisi anlamlı değildir. Bunun pek çok sebebi olabilmekle birlikte, katılım bankalarının yeni, verilerinin az ve işleyiş sistemlerinin diğer bankalardan farklı olmasından kaynaklandığı söylenebilir."
