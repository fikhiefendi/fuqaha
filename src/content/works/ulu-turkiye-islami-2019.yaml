abstract: "Bireylerin tasarruflarını etkili bir şekilde yönetebilmesi ve alternatifler arasından verimli olabilecek tercihler yapabilmesi, sahip olabileceği finansal okuryazarlık yeteneği ile mümkündür. Finansal okuryazarlık bireylerin finansal piyasalar hakkında en azından temel düzeyde bilgi sahibi olması ve çeşitli alternatifler arasından seçim yapabilmesi iken, İslami finansal okuryazarlık ise bireylerin faizsiz olan finans ürünleri hakkında bilgi sahibi olması ve seçimlerini yaparken bu faizsiz ürünler arasından hangisini/hangilerini seçeceğine karar verebilme yeteneğidir. Finansal okuryazarlığın geliştirilmesi, tasarruf ve yatırım bilincinin arttırılması, finansal istikrarın ve sermaye piyasalarının gelişimi açısından büyük önem taşımaktadır. İslami finans okuryazarlığının geliştirilmesi ise finansal okuryazarlığın faydalarının yanı sıra, ortaklık bilincinin gelişmesine ve ekonomik krizlerin oluşmasında ve büyümesinde büyük etkisi olan faiz probleminin de etkisinin azalmasını sağlayacaktır. Bu çalışmada; İstanbul Ticaret Odası'na kayıtlı küçük ve orta büyüklükteki 16 işletme sahibi ile mülakat yapılarak, bu işletmelerin İslami finans enstrümanı olan katılım bankacılığı sistemini ne derece bildikleri ve bankacılık işlemlerinde bu banka türünü kullanıp kullanmadıkları araştırılmıştır. Araştırma sonucunda katılım bankalarının müşteri nezdindeki algı problemleri ve çalışma prensiplerindeki bazı aksaklıklar tespit edilmiş ve bu durumun giderilmesi için öneriler getirilmiştir."
