abstract: "Bu çalışma, Cafer Sadık'tan ismini alan Ca'feriyye mezhebinin tarihi süreç içerisinde nasıl anlaşıldığı ve bu kavram ile kimlerin kastedildiğini tesbit edebilmek için hazırlanmıştır. Çünkü günümüze gelene kadar farklı grupların Ca'feri olarak isimlendirildiğini görmekteyiz. Tezimiz Giriş ve iki bölümden oluşmaktadır. Birinci bölümde Ca'feriyye'nin ismini aldığı Cafer Sadık'ın hayatı, fikirleri, hakkındaki iddialar, yaşadığı dönemin genel durumu, kendisinden önce ve sonra çıkan fırkalara yer verdik. Bu bölümde Ca'feri olarak tesbit ettiğimiz grupların imamete layık kişinin Cafer Sadık ve onun soyundan gelen kişiler olduğunu iddia ettiklerini gördük. Bu dönem içinde Ca'feriyye kavramının itikadi yönünü ele aldık. İkinci bölümde ise Ca'feriyye'nin devletler içerisinde yayılmasına ve önde gelen önemli isimlerine yer verdik. Ca'feriyye'nin itikadi, siyasi ve fıkhi yönünü temsil etmeye başladığını tespit ettik. Son olarak da Ca'ferilik-Alevilik ilişkisini değerlendirdik."
