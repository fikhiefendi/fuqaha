abstract: "Kişinin sağlığını, bedenini ve ruhunu muhafazası İslâm'ın önemsediği değerler arasındadır. Bu nedenle, bağımlılık yapan gıda katkı maddelerinin, özellikle de monosodyum glutamat (MSG) gibi katkı maddelerinin sağlık açısından potansiyel zararlarına dikkat edilmelidir. MSG'nin aşırı tüketimi bazı insanlarda sağlık sorunlarına neden olabilir. Başta obezite olmak üzere baş ağrısı, bulantı, göğüs ağrısı, baş dönmesi ve hatta kimi durumlarda alerjik reaksiyonlar gibi semptomlar gösterir. Bu sağlık sorunları, kişinin bedenini ve sağlığını koruma sorumluluğuna zarar verir. MSG içeren gıdalar genellikle işlenmiş ve hazır gıdalar arasında yer alır. Bu tür gıdaların aşırı tüketimi, beslenme kalitesinin düşmesine ve sağlıklı beslenme alışkanlıklarının zayıflamasına neden olur. İnsanlar, sağlıklı ve doğal gıdalara olan taleplerini azaltarak ve vücutlarının ihtiyaç duyduğu besin öğelerini alamayarak sağlık sorunlarına davetiye çıkarabilirler. İslâm'da, sağlıklı bir bedene sahip olmak, ruhun da sağlıklı olmasıyla ilişkilendirilir. MSG'nin neden olduğu sağlık sorunları, insanın ruhunu ve maneviyatını da etkiler. Kişi, bedeniyle ilgili sorunlar yaşadığında ruhsal olarak da zorlanabilir. Bu nedenlerle, İslâm açısından, MSG gibi bağımlılık yapıcı gıda katkı maddelerinin tüketimiyle ilgili dikkatli olunmalı ve sağlıklı beslenme alışkanlıkları teşvik edilmelidir. Kişiler, bedenlerini korumak ve sağlık sorunlarından kaçınmak için doğal ve sağlıklı gıdalara yönelmelidirler. MSG gibi bağımlılık yapıcı maddelerin kullanımıyla ilgili olarak, sağlığa zarar verme riski göz önünde bulundurulmalı ve bu tür maddelerin kullanımı sınırlandırılmalıdır. İslâm hukuku, insanların tükettiği gıdaların helal ve temiz (tayyib) olmasını ister. MSG gibi katkı maddelerinin helal ve temiz olup olmadığı konusu, içerdikleri maddenin doğası ve kullanım amacına bağlı olarak önem taşımaktadır. İslâm hukuku açısından bağımlılık yapan gıda katkı maddeleri özelinde monosodyum glutamatın kullanımı, insan sağlığını koruma, zarar verme yasağı ve helal gıda prensipleri açısından şüpheler içermektedir."
