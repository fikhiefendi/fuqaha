abstract: "İbrahim el-Halebî (ö. 956/1549) tarafından kaleme alınan Mülteka'l-Ebhur isimli eser, Osmanlı coğrafyasında en yaygın Hanefî fıkıh metni olma özelliğine sahiptir. Mültekâ kendinden önce Hanefî fıkhına dair yazılan ve“mutun-ı erbaa”olarak adlandırılan dört temel metnin yanısıra Kudurî'nin el-Muhtasar ve Merğinânî'nin el-Hidaye'si gibi meşhur fıkıh metinlerindeki meseleleri daha sistematik olarak içeren bir eserdir. Bunun yanısıra Halebî'nin yaptığı tercihlerle ön plana çıkan bu eser, zaman içerisinde medreselerde okutulan temel bir metin haline gelmiş, fetvâ ve kazâ alanında başvurulan temel bir kaynak hüviyetini kazanmıştır. Bu eser üzerine 50'yi aşkın şerh ve haşiye yazılmıştır. Bu şerhlerden bazıları da yaygınlık kazanmış ve ilim ehlinin müracaat ettiği kaynak eserler haline gelmiştir. Bu şerhlerden biri de İsmail b. Sinan es-Sivasî (ö. 1047/1637) tarafından yazılan Ferâidu Mülteka'l-Ebhur isimli şerhtir. Sivâsi, kendi değerlendirmeleri ve tercihleriyle birlikte klasik Hanefi fıkıh birikimini bu şerhe yansıtmış ve Mültekâ'yı daha istifade edilir bir eser haline getirmiştir. Bu çalışmada önce metnin müellifi Halebî ve eseri Mültekâ üzerinde durulmuş ardında Sivasî ve Ferâid isimli eseri tanıtılmaya çalışılmıştır. Hacimli bir şerh olması sebebiyle eserin üçte birlik kısmını oluşturan Kitâbu'l-İ'tâktan başlayan ve Kitâbu'l-Mükâteb'in sonuna kadar olan kısım biri müellif nüshası olmak üzere toplam beş nüsha esas alınarak tahkik edilmiştir. Tahkik, İSAM (İslami Araştırmalar Merkezi) tarafından hazırlanan tahkik kurallarına uygun bir şekilde hazırlanmıştır."
