abstract: "Tezimiz, Endülüs'te (384-456/994-1064) yılları arasında yaşamış olan İbn Hazm'ın, tefaduliyet konusuna bakışını ve bu konu hakkındaki değerlendirmelerini konu edinmiştir. Bu bağlamda Endülüslü âlim İbn Hazm'ın eserleri esas alınmış ve onun görüşlerine yer verilmiştir. Ayrıca konu hakkında diğer görüşler de dini kaynaklar ve siyasi olaylar ile temellendirilmeye çalışılmıştır. Araştırmamız, bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde çalışmamızın konusu, amacı ve önemi ele alınmıştır. Ayrıca bu bölümde İbn Hazm'ın görüşlerinin daha açık bir şekilde ortaya koyulabilmesi için onun yaşadığı dönemde Endülüs'ün siyasî, dinî ve sosyo-kültürel yapısına yer verilmiştir. Tezimiz kapsamında öncelikle tafdîl konusu, tefaduliyetle doğrudan ilişkili olan imâmet ve hilâfet bağlamında ele alınmıştır. İslam Mezhepleri Tarihinin klasik kaynaklarında imâmet ve hilâfet konularının nasıl ele alındığı ve özellikle imâmet konusu çerçevesinde ortaya çıkan temel tartışmalar ile İbn Hazm'ın bu konulardaki görüşleri incelenmiştir. Akabinde ashabın fazileti konusunda İbn Hazm'ın değerlendirmelerine yer verilmiştir. Bu bölümde, özellikle tefaduliyet meselesiyle öne çıkan Şia mezhebinin iddialarına yönelik İbn Hazm'ın yaklaşımı ele alınmıştır. Tefaduliyet konusundaki tartışmalar Hz. Peygamber'in vefatından sonra ortaya çıkmış ve günümüzde de önemini korumuştur. Bu sebeple araştırmamızın son bölümünde tefaduliyet tartışmasının günümüzde yaşayan mezheplere etkisi üzerinde durulmuş ve mezheplerin tefaduliyet anlayışı ele alınmıştır. Araştırmamız bu üç bölümün değerlendirmesini içeren sonuç bölümüyle tamamlanmıştır."
