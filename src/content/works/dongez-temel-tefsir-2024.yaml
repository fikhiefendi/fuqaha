abstract: "İslâm'ın emrettiği hükümler sadece ahiret hayatına yön verecek nitelikte değildir. Emredilen her şeyin aslında ahiret hayatıyla birlikte dünya hayatına yöneliş hususları bulunmaktadır. Bu yönlerden bazıları sosyal, hukukî ve ekonomik özellik taşımaktadır. Bazıları ise hayatın tüm alanlarında önümüze çıkarak bize yol gösterici bir konumda olmaktadır. Bunları zekât, infak, sadaka ve karz-ı hasen örneklerinde görmemiz mümkündür. Kur'an'da bununla ilgili İslam iktisadına yönelik belirleyici hükümlerin başında zekât gelir ve bu bağlayıcı hükmün dışında asıl şekliyle insanların ihtiyaçlarının yine Allah'ın belirlediği çerçevede belirlenmesi söz konusudur. Böyle bir durumda her ibadetin kendine göre yüklendiği bir misyon bulunur. Bu noktada zekât gibi belirleyici bir mali ibadetin yanı sıra karz-ı hasen uygulamaları da Kur'an'da teşvik edilmektedir. Bu açıdan sosyal yardımlaşmaya teşvik vardır. Bu çalışmada beş tefsir çeşidinde karz-ı hasen uygulamasının yeri ve yüklendiği anlam üzerinde durulmaktadır. Bu bağlamda Kur'an'da karz-ı hasen ifadesinin anlam özelliği, geçtiği bağlama göre yüklendiği anlamlar, yakın anlamlıları, insanı iman, ibadet ve ahlak boyutuna taşıması üzerinde durulmaktadır. Bu sebeple ilk olarak, temel eser niteliğinde Taberî tefsirine başvurmak kaçınılmaz olmuştur. Zira Taberî'nin rivâyet tefsiri olan Câmiu'l-Beyân'ı bu bağlamda en kapsamlı eserlerin başında gelmektedir. Bununla birlikte rivâyet tefsiri alanında Râzî ise gerek akli ilimlerde gerekse nakli ilimlerde önde gelen müfessirler arasındadır. Mefâtîhu'l-gayb adlı eserinde ise âyetleri tefsir ederken kendine özgü tasnifleri yapmasıyla, konu hakkında kapsamlı bilgilere yer vermesiyle ve aynı zamanda çeşitli ilimlerle bu bilgileri harmanlamasıyla bilinmektedir. Ahkam tefsiri olarak ise, Kurtubî'nin el-Câmiʿ li-ahkâmi'l-Kurʾân tefsirinde aşırı mezhep taassubu olmaması, rivâyet ve dirâyet metodlarının ihmal edilmemiş olması, bunun yanı sıra cahiliye şiirlerine de yer verilmesi hem ifade kalıbı hem de konu edinilen kavramlar açısından geniş bir perspektif sunması sebebiyle başvurulan eser olarak belirlenmiştir. Mutasavvıf müfessir olan Bursevî'nin ise söz konusu ifadeye batıni anlamda nasıl yorum getirdiğine değinilmesi gerekmektedir. Bu açıdan bu tefsirin konuya zahirî anlamı dışında farklı bir bakış açısıyla görmeye yardımcı olmuştur. Bu bağlamda Rûhu'l-beyân fî tefsîri'l-Kurʾân eseri önemli bir kaynak olarak önümüze çıkmaktadır. Şii tefsir tarihine baktığımız zaman sadece yöntem değil Kur'an ve tefsir anlayışında da bir değişim söz konusu olduğundan, bu konuya yaklaşımda daha geniş bir çerçeveden bakmak mümkündür. Burada da Tâbatabâî'nin el-Mîzân fî tefsîri'l-Kurʾân adlı eserine başvurulmuştur. Söz konusu olan altı âyet için seçilmiş olan müfessirlerin görüşleri, yöntemleri ve tefsir metotlarını genel olarak yansıtan ifade yer verilmiştir. İlgili âyetlerin içinden Karz-ı hasen ifadesi tasniflenerek müfessirlerin konuyla ilgili görüşleri değerlendirilmiştir. Konunun daha iyi analiz edilebilmesi açısından teze konu olan tefsirlerin türleri farklı çeşitlerde seçilmiştir. Böylece bu tefsir çeşitlerinde ifade kalıbının işlenişi görülerek farklı işlenişlerin yöntemden kaynaklanıp kaynaklanmadığı tespit edilmeye çalışılmıştır."
