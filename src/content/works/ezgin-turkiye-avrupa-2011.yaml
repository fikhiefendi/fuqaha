abstract: "Bu çalışma, Türkiye'de kadın erkek eşitliği bağlamında yapılan düzenlemelerin hangi koşulların etkisiyle gerçekleştiğini ortaya koymayı amaçlayan sosyolojik bir çözümlemedir. Çalışma konusu itibariyle tarih, sosyoloji ve hukuk alanları ile ilgilidir ve amacıyla bağlantılı olarak hukuk sistemi incelenmiş, ardından Türkiye'nin ilk medeni kanunu Mecelle'den bu yana Medeni hukuk alanında yapılan değişikliklerin sosyolojik bir analizi yapılmıştır.Çalışmada; Avrupa Birliği sürecinde gerçekleştirilen anlaşmalar, topluluk programları, raporlar gözden geçirilmiş ve dönemin Türkiye koşullarını ortaya koymaya yönelik bir okuma yapılmaya çalışılmıştır. Ayrıca 1926 Tarihli Türk Medeni Kanunu ve 2001 Tarihli Yeni Türk Medeni Kanunu'nun ilgili maddeleri kadın erkek eşitliği bağlamında yapılan değişiklikler açısından içtihat örnekleri ile karşılaştırılarak tartışılmıştır.Sonuç olarak; inceleme verileri Türk Medeni Kanunu'nda kadın erkek eşitliği çerçevesinde yapılan düzenlemelerin salt Avrupa Birliği sürecinin gereklilikleriyle açıklanamayacağı, toplum yapısındaki sosyal, siyasal, ekonomik koşulların değişikliklere zemin hazırladığı ve gerçekleşenlerin kadın hareketleri, sivil toplum kuruluşlarının da çabaları sonucunda oluştuğunu ortaya koymaktadır. Diğer yandan bu konuda ele alınan Medeni Kanun karşılaştırmaları da; Yargıtay'ın içtihat kararları verirken kadın erkek eşitlik ilkesini göz önünde bulundurduğu ve böylece Avrupa Birliği uyum süreci söz konusu olmadığında dahi Türk Medeni Kanunu'nun çağdaş, yenilikçi, devrimsel bir niteliğe sahip olduğu sonucunu vermektedir."
