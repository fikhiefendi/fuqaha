abstract: "İnsanlığın başlangıcından bugüne kadar, tüm dönemler, kendi politik yapıları içerisinde hükümdarlarına ve yöneticilerine sahip olmuştur. Bu yönetim anlayışı dolayısıyla, bu bağlamda, devletlerin nasıl yönetmesi gerektiği ve din ile devlet arasındaki ilişkinin nasıl olması gerektiğinin açıklanması gerekmektedir. Bu anlayışa istinaden, Kur'an'da ve hadiste hüküm bulunmadığı zaman, kararların, hükümdarların rasyonel yönetimlerine ilişkin olarak alındığı ve dinî yönetimin bu biçimde uygulandığı görülmektedir. Bu kararlar alınırken, hilâfet ve zıllullâh gibi bazı politik terminolojinin dikkate alınması çok önemli olacaktır. Yönetimsel zorlukları ve yükleri hafifletmek için, vezirlik makamına ihtiyaç duyulduğu anlaşılmaktadır. Bu çalışmada, hükümdarlar, halife ve vezirler için ahlakî davranışların ne olması gerektiği tartışılmakta ve açıklanmaktadır. Dinî yönetime ilişkin bu hususlar bağlamında meşveretin önemi araştırılmakta ve değerlendirilmektedir."
