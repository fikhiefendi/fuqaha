abstract: "Eserin adı Şehr-i Gülşen olup yazarı ve tarihi hakkında kesin bilgi bulunmamaktadır. Muhtemelen 1794-1795 yılları arasında yazılmıştır. Gunnar Jarring Koleksiyonu'ndan temin edilmiştir. Eserin Çağatay Türkçesiyle yazıldığı görülmektedir. Nesir şeklinde yazılmış olan eser toplam 272 sayfa yani 136 varaktan oluşmaktadır. Bu incelemede ilk 130 sayfa yani 65 varak ele alınmıştır(1a-65b). Şehr-i Gülşen, yirmi iki bölümden oluşan dinî içerikli, didaktik bir eserdir. Her bölüm, dinin kurallarından birini konu başlığı edinilerek ayet, hadis ve rivayetlerle açıklanmıştır. Söz dizimine uygun bir eser olduğu görülmektedir. Eserde Arapça, Farsça az sayıda olmakla beraber Uygurca ve Özbekçe sözcükler yer almakla beraber söz varlığı zengindir. Gayet okunaklı nesih bir yazıyla yazılmış olan eser, öncelikle dönem sözlükleri, Osmanlıca-Türkçe-UygurcaÖzbekçe sözlükler ve yayımlanmış tezlerin sözlük ve dizinlerinin yardımıyla transkribe edildi. Metin söz dizimi incelemesi; cümlenin öğeleri, kelime grupları, cümle çeşitleri başlıkları altında üç ana grupta yapıldı. Her grup kendi içinde alt kollara ayırmak suretiyle örneklerle incelendi. Bu bilgiler doğrultusunda sonuç bölümü elde edildi. Metindeki yabancı kelimeler için sözlük oluşturuldu."
