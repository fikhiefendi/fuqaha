abstract: "Bir bankacılık türü olan katılım bankacılığı, bankacılık işlemlerini İslami esaslara uygun olarak yapmayı amaç edinen, faizin dinen haram olmasından dolayı kâr-zarar ortaklığını benimsemiş kuruluşlardır. Bu nedenle katılım bankaları, İslam dininin ruhuna, değer sistemine ve ahlâkına uygun olarak yönetilen bir bankacılık çeşididir. Türkiye'de İslami bankalar, 1983 yılında“Özel Finans Kurumları”adıyla yasal olarak kurulmuştur. Özel Finans Kurumları 2005 yılında 5411 sayılı Bankacılık Kanunu'nda yapılan değişiklikle“Katılım Bankası”ismini alarak faaliyetlerine devam etmişlerdir. Türkiye Katılım Bankaları Birliği tarafından 2015 yılında yayınlanan“Strateji Belgesi”nde, katılım bankalarının bankacılık sektörü içindeki payının 2025 yılında %15 seviyesine ulaşması ve aktif büyüklüğün 300 milyar USD olması hedeflenmiştir. Türkiye'de 2019 yılsonu itibarıyla faaliyette bulunan altı katılım bankasının bankacılık sektörü içindeki paylarının %6,3 seviyesinde, aktif büyüklüklerinin ise 285 milyar TL civarında olduğu görülmektedir. Bu çalışma kapsamında katılım bankalarının 2025 yılında ulaşmayı arzu ettikleri hedefleri, katılım bankalarının 2009-2019 yılları arasındaki yıllık bileşik büyüme oranı verisi üzerinden değerlendirilerek 2020-2025 yılları arasında gerekli olan büyüme verisi hesaplanmaya çalışılmıştır. Bu minvalde katılım bankacılığı sisteminin zayıflıklarına ve hedeflerin yakalanmasına yardımcı olabilecek önerilere de yer verilmiştir."
