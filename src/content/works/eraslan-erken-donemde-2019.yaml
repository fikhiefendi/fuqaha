abstract: "Bu tez erken dönemde Hanefî-Mâtürîdî kelam sisteminin tasavvufla ilişkisini konu almaktadır. Çalışma giriş, dört bölüm ve sonuçtan oluşmaktadır. Birinci bölümde Hanefî-Mâtürîdî kelam sisteminin tasavvufla ilişkisinin tarihi arka planına yer verilmektedir. İkinci bölümde ulûhiyyet konusunda kelam ve tasavvufun ilgi alanına giren konular her iki disiplin açısından ayrı ayrı değerlendirilmektedir. Üçüncü bölümde kelam ve tasavvufun en çok etkileşim halinde olduğu nübüvvet konusu velayet, ilham, ismet ve keramet konuları açısından ele alınmaktadır. Dördüncü ve son bölümde ise Horasan-Mâverâünnehir bölgesinin disiplinler üstü ortak tavrını gösteren esmâ ve ahkâm konuları kelam ve tasavvuf bağlamında değerlendirilmektedir. Sonuç bölümünde ise tüm bölümlerin ortak bir değerlendirilmesi yapılmak suretiyle erken dönemde Hanefî-Mâtürîdî kelam sisteminin tasavvufla ilişkisi ortaya konulmuştur."
