abstract: "Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde, mahzar ve sicil kavramları, İbn Mâze'nin hayatı, ailesi, ilmi seviyesi, eserleri ve Hanefi mezhebindeki konumu hakkında bilgi verilmiştir. İkinci bölümde; her biri farklı fıkhi bir konuyu ele alan ve geçerli sayılan 63 mahzar ve sicil kaydı vardır. Bunlardan bazıları miras, şuf'a, icâre, nikâh akitlerini kapsamaktadır. Müellif, bu kayıtları ortaya koyarken önce mahzar kaydı, sonra sicil kaydı, ardından da varsa def kaydı şeklinde sıra takip etmiştir. Mahzarlar kayıt altına alınırken hüküm açıklanıncaya kadarki resmi olmayan kısım, kâdıya yardımcı olacak şekilde kayda geçirilmiş ve burada genellikle farazi hukuk esas alınmıştır. Sicil kısmında ise, hüküm açıklanarak, dâva resmiyet kazanmış ve hüküm taraflara bildirilmiştir. Bazı kayıtlarda da dâvalı, dâvacıya def dâvası açmıştır. Üçüncü bölümde, bir illet sebebiyle geçerli sayılmayan 66 mahzar ve sicil kaydı incelenmiştir. Burada, bir illet sebebiyle dâvacının iddiaları kabul edilmemiştir. Ancak kâdı, def'e konu olan bu illet sebeplerini dikkate alarak hüküm vermiştir. Bu illet sebeplerini sonuç bölümünde maddeler halinde sıraladık. Çalışmada toplam 129 mahzar kaydı incelenmiş ve bunlar aynı zamanda tercüme edilmiştir. Bölüm tasnifi yapılmış, tercüme edilen metne azami ölçüde bağlı kalınmıştır. Çalışmamızda Karahanlılar dönemine ait olan eserde Arapça ve Farsça tercümesini sunmuş olduğumuz mahzar ve sicil kayıtlarının derli toplu olması açısından ilk mahzar kayıtları olduğunu düşünüyoruz. Yaptığımız araştırmalar sonucunda Osmanlı dönemi mahzar ve sicil kayıtlarıyla alakalı çalışmaların yapıldığı; fakat Karahanlılar dönemi ve öncesini (m. 840-1212) kapsayan bir çalışmanın yapılmadığını gözlemledik. Sonuç ve değerlendirme kısmında ise, mahzar ve sicillerde önemli görülen hususları değerlendirip örnekleriyle birlikte aktararak çalışmaya son verdik."
