abstract: "Fıkıh usûlü ve nahiv usûlü arasındaki ilişkinin ele alındığı bu çalışmada her iki usûl arasındaki ilişki boyutları incelenmiş ve aralarındaki benzer ve farklı yönler ortaya konmaya çalışılmıştır. Bu çalışma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde çalışmanın konusu, önemi, amacı ve kapsamı üzerinde durulmuş ve çalışmanın kaynaklarına yer verilmiştir. Birinci bölümde fıkıh ve nahiv ilimleri arasındaki ilişki boyutlarının genel çerçevesi incelenmiştir. Nahiv ve fıkıh usûlü ile nahiv usûlü ve fıkıh usûlü arasındaki ilişkiye değinilmiştir. Ayrıca her iki usûldeki telif yöntemi, dilin kökeni, hükümler, lafızların anlama delaleti ve müctehidin şartlarına yer verilmiştir. İkinci bölümde bu iki usûlde geçen ve naklî deliller olan Kitap, Sünnet ve icmâ delillerinin mahiyetleri, şartları, delil oluşları ele alınarak bu deliller arasındaki benzer ve farklı yönler incelenmiştir. Üçüncü bölümde her iki usûlde bulunan ve aklî deliller olan kıyas, istihsân ve istishâb delillerinin mahiyetleri, türleri şartları ve delil oluşları incelenmiştir. Ayrıca her iki usûldeki delillerin teâruzu ve tercih yöntemleri ele alınmıştır. Sonuç kısmında da bu araştırmayla elde edilen neticelere yer verilmiştir. Anahtar kelimeler: Fıkıh, nahiv, fıkıh usûlü, nahiv usûlü, kitap, sünnet, icmâ, kıyas, illet, istihsân, istishâb."
