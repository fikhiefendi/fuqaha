abstract: "Ülkelerin ekonomik gelişim düzeyleri; kendilerine has çeşitli yapısal özelliklerinden ve ekonomik sistemlerinin farklı büyüklüklerinden dolayı birbirlerinden ayrışmaktadır. Finansal açıdan gelişmiş ülkelerin bankacılık sektörleri incelendiğinde, finansal yapının ana iskeletini, etkin ve teknolojik anlamda gelişmiş çok farklı yapıda ve çok sayıda bankaların oluşturduğu (bankacılık sektörü) görülmektedir. Bu yüzden; bankacılık sektöründeki gelişmeler ile ülke ekonomisindeki makro ekonomik gelişmeler arasındaki ilişkiler gerek ekonomi gerekse de bankacılık literatüründe ilgi odağı olmuş ve bunun neticesinde ülkelerin ekonomik performanslarının ve finansal gelişmelerinin bankacılık sektörüne olan etkileri çok çeşitli araştırmalara konu edilmiştir. Zira sermaye tabanı güçlü, etkinliği yüksek, son derece şeffaf, kontrol edilebilir, denetlenebilir ve teknolojik açıdan gelişmiş bir bankacılık sektörünün varlığı, ülkelerin finansal sistemleri ve ekonomik kalkınmaları adına fevkalade önemlidir. Bu sayede derinlik kazanan finansal sistemler, ekonomilerdeki atıl fonları ve birikimleri çok çeşitli modellerle ve çok daha etkin bir şekilde tüketicilere, sanayi aktivitelerine ve üretime kazandırmakta ve bu sayede hem kaynak çeşitliliğinin sağlanmasında hem de kaynak maliyetlerinin daha makul seviyelere çekilmesinde ciddi rol oynamaktadırlar. Bankacılık sektörünün makroekonomik gelişmelerden ne şekilde etkilendiğinin, özellikle de ülkemizde faaliyet gösteren iki önemli banka türü olan katılım bankalarının ve konvansiyonel bankaların ekonomik gelişmelere ne düzeyde duyarlı olduklarının ve ne şekilde tepki verdiklerinin akademik çalışmalarla tespit edilmesi önemlidir. Bu amaç doğrultusunda; bu tez çalışmasında, seçilmiş makroekonomik değişkenlerin bankacılık sektörü temel büyüklükleri olan mevduat, kredi ve kârlılık hacimlerine olan etkileri incelenerek ve iki farklı bankacılık türü olan katılım bankaları ve konvansiyonel bankalar üzerindeki etkilerinin istatistiksel mukayesesi yapılarak literatüre katkı sağlanması amaçlanmaktadır. Özetle; ülkemizin ekonomik gelişimi için de bankacılık sektörünün varlığının, sağlığının, gelişiminin ve kârlılığının son derece önemli olduğu muhakkaktır. Bu yüzden makroekonomik değişkenlerin bankacılık sektörü mevduat, kredi ve kârlılık hacimlerine etkisinin akademik çalışmalarla belirlenmesi, sektörün gelişimi ve isabetli öngörülerle geleceğe doğru oluşturulacak temel stratejilerin esaslarını belirleme adına çok mühimdir."
