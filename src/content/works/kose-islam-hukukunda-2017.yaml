abstract: "İnsanlar vefat ettikten sonra emekle biriktirdikleri mallarını yakınlarına aktarılmasını isterler. Mal aktarımı yapılırken varisler arasında adaletli bir şekilde taksim yapılabilmesi için uyulması gereken prensipler vardır. İslam Hukuku da miras paylaşılırken dikkat edilecek prensipleri ve hususları belirlemiştir. Bu çalışmada, İslam Hukuku tarafından belirlenen prensipler ve hususlar incelenmiş. Özellikle varislerde bulunan bazı özelliklerin ya da bazı durumların miras engeli oluşturacağı konusu üzerinde durulmuştur. İslam Hukukunda miras engelleri murisi öldürmek, din ayrılığı, ülke ayrılığı, kölelik, muris ile varis arasında ölüm zamanının tespit edilememesi, muris ile varis arasındaki yakınlığın belirlenememesi gibi durumlar tespit edilmiştir."
