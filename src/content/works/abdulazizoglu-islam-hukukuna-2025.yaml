abstract: "Bu çalışma, temelde bir risk paylaşım yöntemi olan emeklilik sisteminin mahiyetini incelemeyi, İslâm medeniyetindeki benzer kavram ve kurumlarla olan ilişkisini ele almayı, İslâm'ın temel ilkeleri ile fıkhın prensipleri ve kabulleri ışığında söz konusu sistemin fıkhî zeminini değerlendirmeyi amaçlamaktadır. İnsanoğlu her dönemde karşılaşabileceği sosyal risklere yönelik tedbir alma ihtiyacı hissetmiştir. Mahiyeti ve yöntemleri değişse de her dönemde bunun için farklı organizasyonlar geliştirmiştir. Önceleri bireysel tasarruflar ve aile içi yardımlaşmalar şeklinde devam eden bu süreç sanayi devrimi ve şehirleşmenin ortaya çıkardığı modern riskler karşısında aciz kalmıştır. İşte emeklilik sistemi de günümüz insanını sosyal ve ekonomik tehlikelere karşı himaye etmeyi amaçlayan modern bir risk paylaşım yöntemidir. Ancak risk paylaşımı kavramı modern bir konu değildir. Dolayısıyla İslam medeniyetinin toplumu tehdit eden sosyal risklere karşı dayanışma ve risk paylaşımı anlamı taşıyan belli başlı kavramlarının ve hukuki müesseselerinin var olup olmadığını sorgulamak, eğer varsa bunların klasik doktrinde algılanış biçimlerini ele almak, daha sonra da bu kavram ve kurumların emeklilik sisteminin mahiyeti ve amacıyla ilişkisini kurmak fıkhın emeklilik kurumuna yaklaşımını tutarlı bir şekilde değerlendirebilmek için zorunludur. Klasik fıkıhta emeklilik sistemiyle fonksiyonel benzerlikleri olan tenâsur, âkıle, velâ, hilf, nafaka ve vakıf gibi birçok kavram ve kurum olmakla birlikte doğrudan özdeşlik kurabileceğimiz bir sistem bulunmamaktadır. Muasır çalışmalarda da emeklilik sistemini doğrudan ele alan müstakil eserler oldukça azdır. Var olan çalışmalarda ise emeklilik sistemine daha ziyade sigorta sistemi bağlamında değinildiği görülmektedir. Emeklilik sistemi ile ilgili fıkhî tartışmaların çoğunun ödenen primler ile sistem tarafından sağlanacak faydaların niteliği bir başka ifadeyle emeklilik sisteminin konusu noktasında yoğunlaştığı görülmektedir. Primlerin, sosyal sigorta himayesinden faydalanmak amacıyla sisteme zorunlu olarak yapılan, vergi ya da ücret gibi doğrudan bir müesseseye bağlanması gerekmeyen, ivaz ve teberru karakterini birlikte taşıyan, kamu hukukuna dayalı, kendine özgü bir yükümlülük ve ödeme türü olduğu anlaşılmaktadır. Emeklilik sistemini ise Kitab, Sünnet ve klasik fıkıh literatüründe doğrudan yer almayan, tenâsur, muâvaza ve teberrû özelliklerini birlikte bünyesinde barındıran, İslam'ın temel ilkeleriyle uyumlu, nev'i şahsına münhasır bir himaye sistemi olarak değerlendirmek isabetli görünmektedir."
