abstract: "?İslam Hukukunda Çift Cinsiyetliler (Hünsâ)? adlı çalışmamızda, doğuştan getirdiği özellikleriyle ne erkek ne de kız olduğu bilinemeyen, tıpta anormal cinsel farklılaşmalar başlığı altında ele alınan ve ?hermafrodit? kavramıyla, İslam fıkhında ise, ?hünsâ? kavramıyla karşılanan, bu kavramların kapsamına giren kişiler ve onlarla ilgili gerek klasik, gerekse günümüz eserlerinde yer alan hükümler ve bazı noktalarda çözüm önerileri üzerinde durmaya çalıştık. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, önemi ve çalışmada yararlandığımız kaynaklar nelerdir bunlar üzerinde durduk. Birinci bölümde hünsâ kişileri tıpsal açıdan değerlendirmeye tabi tuttuktan sonra hünsâ kişiler için büyük önem arz eden, gerçek cinsiyetlerine kavuşturulmaları için uygulanacak tıbbi cerrahi müdahalelerin, İslam Hukukuna uygunluğunu tartıştık. İkinci bölümde hünsânın beşeri hukukta ele alınışına değindikten sonra, hünsânın İslam Hukukunda nasıl ele alındığı ve nasıl tanımlandığı üzerinde durduk ve çalışmamızın en önemli kısmı diyebileceğimiz, hünsânın gerçek cinsiyetine kavuşması için başvurulacak kriterleri inceledik. Üçüncü bölümde ise, özellikle hünsâ-i müşkil tanımının kapsamına giren ve ne erkek ne de kız olduğuna hükmedilemeyen kişilerin, İbadât, Muâmelât ve Ukûbât alanına giren hukuki işlerde nasıl hareket edecekleri konusunu işledik."
