abstract: "İbnü'l-Arabî'nin Ahkâmü'l-Kur'ân Eseri Bağlamında Örf İle Tefsir başlıklı bu araştırma, önsöz, giriş ve iki bölümden oluşmaktadır. Araştırmacı bu çalışmasında İbnü'l-Arabî'nin ahkam ayetleri tefsir yöntemine ve örf deliline göre bu ayetlerden istinbat edişine değinmiştir Giriş bölümünde araştırmanın kavramsal çerçevesini açıklamış, bu doğrultuda örf konusuna mercek tutmuş, tanımını yaparak şartlarını zikretmiş ve referans değerinden bahsetmiştir Ahkam ayetlerini serdetmiş, sayısından ve bu konuda yazılan eserleri metotlarıyla beraber işlemiştir Buna ek olarak İbnü'l-Arabî'nin hayatı, rıhleleri ve eserlerinden söz etmiştir. Daha sonra tefsir ilminin tanımını yapmış, hükmünden, çeşitlerinden, yöntemlerinden ve faziletinden bahsetmiştir. İlk bölümde İbnü'l-Arabî ve diğer müfessirlerin nassın mutlakını örf ile takyid etmeleri konusunu ele almış, İkinci bölümde ise umum nassın örf ile tahsisine yine İbnü'l-Arabî ile diğer müfessirleri kıyaslayarak değinmiştir. Çalışmanın sonunda, ulaşılan en önemli sonuçlardan bahsedilmiş, aynı zamanda genel olarak tefsirle özel olarak da ahkam ayetleriyle ilgilenen araştırmacılara bir takım tavsiyelerde bulunulmuştur."
