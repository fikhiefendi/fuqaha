abstract: "Âdâbü'l-fetva ve fetva verme yöntemleri (fetva usûlü) olarak iki kısımda mütalaa edilen resmü'l-müftî muhtevasından fetva verme yöntemleri mezhep kavlinin değiştirilmesinin gerekli olduğu durumlar, mezhep birikimi arasından esas alınacak kavlin belirlenmesine dair prensipler ve Hanefi fıkıh külliyatı içerisinden itimat edilen kitaplar olmak üzere üç kısımdan oluşur. Mezhep kavlinin değiştirilerek yeni bir kavil ortaya konulması bir tahrîc faaliyetidir. Mezhep birikimi yani zâhiru'r-rivâye, nevâdir ve fetâvâ mesâili veya mezhep imamlarıyla meşayih kavilleri arasından esas alınacak kavlin belirlenmesine ise tercih denilir. Bir kitaptan mevcut kavli tahkiye etmek ise o fakihi taklit etmek olarak nitelendirilir. O halde müftî için bir usûl belirleme arayışında olan resmü'l-müftî literatürünün, şartlara ve durumlara göre müftî için üç yöntem sunduğu söylenebilir. Bunlar tahrîc, tercih ve taklid ederek fetva vermektir. Bu çalışma, resmü'l-müftî muhtevası içerisinde yer alan bu üç fetva verme yönteminin Hanefi fıkıh tarihinde ortaya çıkışına, gelişimine ve fukahanın bu yöntemlerle ilgili prensipler hakkındaki değerlendirmelerine odaklanarak tahrîc, tercih ve taklid üst başlıkları altında fetva verme yöntemlerini inceleme konusu yapmıştır."
