abstract: "Türkler, İslamiyeti benimsedikten sonra bu dinin şartlarını öğrenmek ve yerine getirmek için dinî eserleri Türkçeye çevirmiş ve dinin şartlarını yerine getirebilmek adına kılavuz kitaplar yazmıştır. Üzerinde çalıştığımız, Derviş Muhammed oğlu Mustafa tarafından yazılan bu eser, yazıldığı dönemdeki insanların dinî görevlerini yerine getirirken sıkıntılarını konu alan Sadrü'ş-Şeria, Kudûrî ve Dürer-i Gurer adlı eserlerden faydalanarak yazılmıştır. Bazı bölümler çeviri olmakla birlikte bazılarını yazar kendisi yazmıştır. Yazar, bu dinî konuları 41 bölümde anlatmıştır. Çalışmamızda, önce eserin çeviriyazılı metnini oluşturduk. Okuma esnasında varak ve satır numarasını parantez içine alarak gösterdik (ör. 1a/a). Eserdeki Arapça dua, tekbir vb. kısımları özgün biçimleriyle metne ekledik. Açıklaması yapılan dini terimleri transkribe ettik. Metinde noktalama işaretlerini kullanmadık. Çok az bir bölümü harekeli olan metni harekelere bağlı kalarak bire bir çevirdik. Harekesiz olan sözcüklerin başka yerlerde yazılışlarını göz önünde bulundurduk. Bu sözcükleri cümlenin anlamı ve sözcüğün yapısına göre biz değerlendirdik. Dil incelemesinde sözcüklerin ve eklerin tespitinde dönem eserleriyle ilgili çalışmalarını göz önünde bulundurduk ve metnin dışına çıkmadık. Çalışmamız; dil bilgisi, metin ve sözlük olmak üzere üç bölümden oluşmaktadır. Dil incelemesini de ses ve şekil bilgisi olmak üzere iki bölüme ayırdık. Dil incelemesinde ağırlığı yazım konusuna verdik. Sonuç bölümünde eserin genel değerlendirilmesi yapılmıştır. Çalışmada yararlanılan eserlerin künyesi son bölüme eklenmiştir."
