abstract: "ÖZET GÜR Mehmet Sadık, İmam Şafiî'nin Tefsir Usulündeki Yeri (Yüksek Lisans Tezi) Yöneten: Doç. Dr. Muhammed ÇELİK Abdurrahman b. Mehdi, Şafiî'den, Kur' an, sünnet, icma ve kıyas ile istidlal şartlarını, nasih ve mensuhun mahiyetini, umum ve hususun özelliklerini anlatan bir kitap yazmasını istemiş, Şafiî de bu istek üzerine“Risale”isimli bir eser yazmış ve eseri ona göndermiştir. Son otuz-kırk yıl içinde modern ilim çevreleri, gittikçe artan bir tarzda Şafiî'nin ilk dönem İslam fıkıh literatürünün gelişmesinde oldukça merkezi bir rol oynadığını kabul ede gelmişlerdir. Tarihteki konumuna paralel olarak gelişen bu ilgiyi, başta onun bu alandaki baş eseri Risale olmak üzere eserlerinin neşirlerinin yapılması ve böylece ilk elden bilgi edinme imkanının doğması teşvik etmiştir. Bu çalışmada Şafiî çevresinde oluşan meseleler, tartışmalara direkt olarak girilmeden Risale perspektifinden ele alınmaya çalışılmıştır. Çalışma giriş, iki bölüm ve sonuçtan meydana gelmektedir. Şafiî usulde geliştirilmiş iki temel eksenin, Hicaz ve Irak ekollerinin ikisinden de feyiz alarak kendi orijinal metodunu geliştirmiştir. İlk olarak sağlam bir yöntem bilim oluşturmuş ve düşüncelerinde çelişkiye düşmeden onu takip etmek için büyük gayret sarf etmiştir. Onun geliştirdiği ana fikirleri şöyle sıralayabiliriz: 1. Nassların otoritesi her türlü kişisel düşüncenin üstündedir. 2. İnsan aklı ilahi iradeyi keşfetmede önemli görevler icra eder. 3. Aklın bu görevi yerine getirirken izlemek durumunda olduğu yöntemler haddizatında nassların ruhunda mündemiçtir. 4. Nasslar keyfilikten ve kural tanımazlıktan arındırılmalıdır. 5. Akıl yürütmeyle ortaya konan çözümler bir noktada birleştiklerinde, nassların manalarını daha güçlü veya eşit seviyede taşıdıklarında tam bağlayıcıdırlar."
