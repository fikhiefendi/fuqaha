abstract: "Yaratılış itibarıyla farklı mizaçlara sahip olan insanlar kimi zaman bir menfaati elde etmek ya da bir zararı uzaklaştırmak adına kendi çıkarlarını ön planda tutmuşlardır. Bu tavır bazen bir başkasının hakkının ihlali ile sonuçlanmış, uyuşmazlıklar ortaya çıkmış ve yargıya başvurmak kaçınılmaz olmuştur. Uyuşmazlığa düşen tarafların başvuracağı yargı organlarının görevi, taraflar arasındaki uyuşmazlığı hakkaniyet çerçevesinde çözüme kavuşturmaktır. Bu noktada İslâm hukukunda davanın taraflarının belirlenmesi ve husumetin en adil bir biçimde çözüme kavuşturulması ilke edinilmiş, kişinin kendisini savunma hakkı koruma altına alınarak bununla ilgili gerekli düzenlemeler yapılmıştır. Bu çalışmada muhâkeme usulünde savunma vasıtaları kapsamında değerlendirilen ve davalının kendisine yöneltilen iddiaya karşı ileri sürebileceği bir hak olan“defi davası”konusu ele alınmıştır. İlk olarak klasik fıkıh literatüründe konuyla ilgili bilgiler derlenmiş sonra da bu bilgiler ışığında defi davasının niteliği, kapsamı, kabulü için gerekli olan şartlar, ileri sürülebilme zamanı ve türleri incelenmiştir. Giriş ve üç bölümden oluşan çalışmamızın giriş bölümünde tezimizin konusu, amacı, yöntemi ve kapsamına dair öz bilgi verilmiştir. Birinci bölümde, genel olarak dava teorisi anlatılmış, İslâm hukukundan farklı olarak defi ve itiraz ayrımına giden beşerî hukuk sisteminin bu ayrımı hangi temellere dayandırdığı hakkında bilgi verilmiş, ardından davada sıfat yokluğu sebebiyle gündeme gelen husumetin defi ve defi davası arasındaki farklar ele alınmıştır. İkinci bölümde, asıl davanın ve defi davasının taşıması gereken genel ve özel şartlar incelenmiş, ispat yolları araştırılmıştır. Üçüncü bölümde, dava konusu hakka etkisi bakımından defi davasının çeşitleri ve hükümleri incelenmiş, bunlara ilişkin örnek davalara yer verilmiştir. Çalışmamızın içerdiği meseleler öncelikle İslam hukukunda ele alınmış, sonrasında pozitif hukuk sistemine değinilerek mukayese yapılmak suretiyle benzerlikler ve farklılıklar tespit edilmeye çalışılmıştır. Ayrıca gerek Osmanlı döneminde kaleme alınan fetva mecmualarından gerekse Yargıtay kararlarından örnek davalar verilerek konunun daha anlaşılır olması hedeflenmiştir."
