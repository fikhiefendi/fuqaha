abstract: "Çalışmamızın esasını teşkil eden Kütahya 105 Numaralı Şer'iyye Sicilini muhteva olarak şu şekilde özetleyebiliriz.105 Numaralı Şer'iyye Sicili klasik Şer'iyye Sicillerine benzememektedir. Bu defter (1914-1918) yılları arasında Kütahya ve çevresindeki mahkemelerde görevlendirilecek memurların atamalarını kapsamaktadır. Başkâtip, zabıtkâtibi, muhzır, mübaşir, müşavir, naib, mahkeme mümeyyizi (a'zalar), müftüler, noter, odacı gibi memur atamalarını anlatmaktadır.Defter Osmanlı Devleti'nin son yıllarındaki memur yaşamı hakkında kısmi bilgiler sunmaktadır. Ayrıca memurların almış oldukları ücretler ve görev değişimleri ile ilgili bilgi vermektedir. Savaş dönemi olması nedeniyle sık sık görev değişimi yaşanmıştır.Bu tarihler arasında mahkemeler iki derecelidir. Bidayet ve İstinaf Mahkemeleri kademeli olarak görev vermektedir. Bu mahkemelerin üzerinde Temyiz Mahkemeleri görev yapmaktadır."
