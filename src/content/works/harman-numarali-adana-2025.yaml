abstract: "Bu tez çalışması, Adana Sancağının H.1128-1129/M. l 716-l 717 arasını kapsayan şer'iyye sicili üzerinde şekillenmiştir. Çalışmada Adana' da görevli kadılann kayıt altına aldığı 21 Numaralı Adana Şer'iyye Sicili ana kaynak olarak alınmıştır. Sicilde geçen belgeler transkript edilmek suretiyle özetlenmiştir. Bu transkripsiyonlar ve özetlemeler çerçevesinde, sicil ile ilgili değerlendirme yapılmaya çalışılmıştır. Çalışma üç bölümden oluşturulmuştur. Birinci bölümde sicilin tanımına ve değerlendirmesine yer verilmiştir. Sicilde geçen belgeler, belge türüne göre tasnif ve konulanna göre tasnif olarak iki farklı şekilde sınıflandırılmaya çalışılmıştır. Belge türüne göre tasnifleme işlemi yapılırken belge türleri hakkında bilgi verilmiş ve sicilde geçen belge numaralan tablolar şeklinde belirtilmiştir. Konulanna göre tasnif işlemi yapılırken ise sicilde geçen bilgiler doğrultusunda yorumlanmaya çalışılmıştır. Akabinde sicilde geçmekte olan eyalet, sancak, kaza, nahiye, köy, mahalle isimleri tablolar şeklinde eklenmiş, araştırmalardan elde edilen bilgiler doğrultusunda açıklanmış ve belgelerden çıkanmla değerlendirilmiştir. Aynca sicilde geçen cemaat ve aşiret isimleri de listelenerek açıklanmaya çalışılmıştır. Son olarak sicilde karşımıza çıkan müslüman erkek ve kadın isimleri, gayrimüslim isimleri ve lakaplar tablolar şeklinde belirtilmiş ve değerlendirmeye dahil edilmiştir. Tez çalışmasının ikinci bölümünde, çalışma konusu olan 21 Numaralı Şer'iyye Sicili poz, sayfa ve belge sayılan verilerek özetlenmiştir. Üçüncü bölümde ise 21 Numaralı Adana Şer'iyye Sicili'nin birebir transkripsiyonu verilmiştir."
