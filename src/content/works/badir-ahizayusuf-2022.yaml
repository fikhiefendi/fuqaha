abstract: "Çalışmamızda hicrî IX. yüzyılın sonu X. yüzyılın başlarında yaşamış, Sultan Fatih ve II. Bayezid devri Hanefî fakihlerinden olan Ahîzade Yûsuf b. Cüneyd et-Tokâdî'nin (ö. 905/1500)“Zahîratü'l-ukbâ fî şerhi Sadrişşerîati'l-uzmâ”adlı eseri üzerine bir tahkik ve Türkçe tahlil yapılmıştır. Çalışmamız giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı ve yönteminden bahsedilmektedir. Birinci bölümde müelliflerin hayatları ve ilmî şahsiyetleri hakkında kısaca bilgi verilmektedir. Çalışmamızın omurgasını oluşturan ikinci bölümde Zahîratü'l-ukbâ adlı eserin tanıtımı ve tahlili yapılmaktadır. Çalışmamızın üçüncü bölümünde ise eserin müellif nüshası olması kuvvetle muhtemel olan nüsha esas alınıp diğer nüshalarla karşılaştırılarak İSAM tahkik kurallarına göre tahkiki yapılmıştır. Sonuç bölümünde ise tespit ve değerlendirmede bulunulmuştur."
