abstract: "Bu tez çalışmamızda 54. Hükümetin Başbakanı, ilim ve fikir adamı Prof. Dr. Necmettin Erbakan'ın siyasi ve ekonomik projeleri ve bu projelerinin Türkiye ekonomisine genel etkileri incelenecektir. Yakın siyasi tarihimizde 42 yıllık siyaset hayatı ile önemli yer edinen Necmettin Erbakan'ın Türkiye ile birlikte 8 Müslüman ülkenin ekonomik olarak kalkınması için kuruluşuna öncülük ettiği D-8 Teşkilatı çok yönlü bir yaklaşım ile incelenecektir. D-8 Teşkilatı gelişmekte olan Türkiye, Nijerya, Mısır, Pakistan, Endonezya, İran, Malezya ve Bangladeş'ten oluşmaktadır. Bugünü anlayabilmek ve geleceğe dair mantıklı öngörülerde bulunabilmek, geçmişi doğru bir şekilde anlamaktan ve gereken dersleri almaktan geçmektedir. Bu doğrultuda Türkiye'nin iç ve dış kaynaklı yaşadığı siyasi, ekonomik, sosyal gelişmeleri ve bu gelişmelere etki eden faktörleri çok boyutlu incelemek gerekmektedir. Tez çalışmamızda Necmettin Erbakan'ın kapitalist ekonomi sistemine karşı oluşturmak istediği Adil Düzene dayalı İslam ekonomisi modeli ile bu modelin uluslararası ayağını oluşturan ekonomik ve siyasal nitelikler taşıyan D-8 Teşkilatı incelecektir. Bir sanat eserini tanımlamaya, anlamlandırmaya çalışır iken ilk dikkat çeken olgulardan biri eserde sanatçısından ve sanatçının içinde bulunduğu toplumdan taşıdığı izlerdir. Bu doğrultuda tez çalışmamızda Türkiye ekonomisinin dönemlerine, dönemlere etki eden faktörlere ve D-8 Teşkilatının kurucusu Necmettin Erbakan'ın hayatına çalışmamızda yer verilmiştir."
