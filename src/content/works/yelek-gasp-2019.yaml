abstract: "Gasp ve itlaf bağlamında Hanefi sorumluluk hukuku üzerine bir incelemenin yapıldığı bu çalışma, bir giriş ve beş bölümden oluşmaktadır. Giriş bölümünde araştırmanın önemi ve amacı, konunun sınırlandırılması, tezin içerik, yöntem ve kaynakları ile literatürün değerlendirilmesi gibi teknik konular üzerinde durulmuştur. Birinci bölümde sorumluluk kavramı, sorumluluk fikrinin tarihi seyri ve sorumluluk hukukunun amaçları ile sorumluluğun konusu, sebepleri, çeşitleri ve şartları gibi konular, mukayeseli bir şekilde genel olarak sunulmuş; sonrasında da bir değerlendirme yapılarak bazı problemlere işaret edilmiştir. İkinci bölümün ilk kısmında; teaddî terminin klasik Hanefi kaynaklarında kullanımı ve bu kavramın taammüd termiyle ilişkisi ortaya konulmuştur. Bölümün ikinci kısmında da, damân literatürünün Hanefi mezhebindeki ilk örnekleri ve bu tezin ana kaynaklarını teşkil eden vâkıât türündeki kitaplar tanıtılmış ve değerlendirilmiştir. Bu bağlamda Üsrûşenî'nin el-Fusûl fi'l-muâmelât, İmâdüddîn el-Mergînânî'nin Fusûlu'l-ihkâm ve Şeyh Bedreddin'in Câmiu'l-fusûleyn'indeki tazminat bölümleri ile Fudayl Çelebi'nin müstakil olarak telif ettiği ed-Damânât fi'l-furûi'l-hanefiyye isimli kitabı mukayeseli olarak incelenmiştir. Tezin üçüncü ve dördüncü bölümde, Hanefi mezhebinin kurucu imamlarının görüşleri etrafında şekillenen gasp ve itlaf doktrininin yukarıda zikredilen vâkıât türündeki eserlerde meşâyih tarafından nasıl geliştirildiği, onların gasp ve itlafla ilgili ortaya çıkan yeni meseleleri nasıl çözüme kavuşturdukları ve bunu yaparken hangi tür araçları kullanarak hukukî faaliyetlerde bulundukları tahlil edilmiştir. Beşinci bölümde ise, önceki bölümlerde ele alınan gasp ve itlaf konularından bazılarını seçerek daha önce verilen teorik bilgilerin Osmanlı fetvâ mecmuâları ve mahkeme kararlarına nasıl yansıdığı, pratikte bunun nasıl uygulandığı ve ilgili meselede herhangi bir değişimin olup olmadığı bazı somut örnekler üzerinden ortaya konulmuştur."
