abstract: "Pediatrik ötanazi, çocuklara ilişkin yaşam sonu kararlarına dair güncel etik ve hukuki tartışmaların en karmaşık alanlarından birini teşkil etmektedir. Uygulamanın bazı ülkelerde yasallaşması, çocuklarla ilgili yaşam sonu kararlarının İslam hukuku açısından nasıl değerlendirileceği sorusunu da gündeme getirmiştir. Bu çalışma, pediatrik ötanazi meselesini etik ve fıkhî perspektiflerden incelemektedir. Bu kapsamda pediatrik ötanazinin hukuki gelişimi, çocuğun ahlaki statüsü, insan hayatının değeri ve dokunulmazlığı, kaygan zemin argümanı, sedd-i zerâi ilkesi ve maslahat-mefsedet değerlendirmelerine ilişkin normatif tartışmalar ile çocukların yaşam sonu kararlarına katılımına dair pratik sorunlar analiz edilmiştir. Çalışma sonucunda çocuğun İslam hukukunda kıymetli, korunması gereken ve bağımsız ahlaki değere sahip bir özne olarak konumlandırıldığı görülmüştür. Bu doğrultuda insan hayatının dokunulmazlığı ile maslahat, mefsedet ve sedd-i zerâi ilkeleri gereğince aktif ötanazinin meşru kabul edilmediği ve çocuğun aktif ötanazinin öznesi olamayacağı sonucuna ulaşılmıştır. Buna karşılık tedavinin başlatılmaması veya geri çekilmesi gibi yaşam sonu kararlarının belirli şartlar altında mümkün olabileceği tespit edilmiştir. Ayrıca çalışmada karar vericiler arasındaki çatışmalar, karar ölçütlerinin belirlenmesi ve ekonomik faktörlerin etkileri gibi pratik sorunlar da tartışılmıştır. Bu çerçevede çalışma, yaşam sonu kararlarında genel ilkelerin tek başına yeterli olmadığını; her vakanın kendi tıbbi, etik ve sosyal koşulları içerisinde değerlendirilmesini gerektiren çok boyutlu bir maslahat-mefsedet muhasebesine ihtiyaç bulunduğunu ortaya koymaktadır."
