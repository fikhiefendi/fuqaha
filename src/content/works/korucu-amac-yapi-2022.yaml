abstract: "Genel olarak mezhep ve daha hususi olarak fıkıh mezhepleri özellikle modern dönem araştırmalarda ilgi konusu olmuştur. Fıkıhta mezhebin anlam çerçevesi, fıkıh mezheplerinin doğuşu, teşekkülü, yayılması ve ilgili süreçler hakkında gerek oryantalist çevrelerde, gerek İslâm dünyasında çok sayıda araştırma yapılmıştır. Gerçekleştirilen araştırma ve tartışmalar neticesinde ilgili konular hakkında çeşitli yaklaşımlar ortaya konmuş, fıkıh mezheplerinin doğası, yapısı ve işlevi hakkında farklı tasavvurlar teklif edilmiştir. Bu çalışmada fıkıh mezheplerini açıklamaya yönelik daha önceki yaklaşımları kuşatacak, kendi bünyesinde anlamlı kılacak ve söz konusu tasavvurların gerçek bağlamlarını bulmalarına imkân verecek yeni bir bakış akışı geliştirilmeye çalışılmıştır. Bu yeni yaklaşıma göre mezhep bir \"araç\" olarak tasvir edilmiş ve fıkıh mezhepleri mükelleflere ait amellerin şer'î değer hükümlerini tespit amacıyla geliştirilmiş amel ölçme araçları olarak tasavvur edilmiştir."
