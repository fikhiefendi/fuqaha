abstract: "Hz. Peygamber'den rivayet olunan sünnet metinleri birçok emir ve nehiy ifadeleri kapsamaktadır. Sünnet, toplumu, ferdi hayatı düzenleyen ve onların dini işlerini beyan eden birçok emir ve nehiy bulunmaktadır. Dini hükümlerin çoğu sünnet üzerine bina edilmiştir. Bu ifadeler usulü fıkıh kitaplarında önemli bir yer tutmaktadır. Bu çalışmamızda İslami hükümlere tesir eden emir ve nehiyleri konu edindik. Sünnetteki emirler her zaman vücup ifade etmezler. Bazen nedb bazen da ibaha ifade etmektedir. Aynı şekilde sünnetteki nehiyler de her zaman haramlık ifade etmezler. Onlar bazen haramlık bazen da kerahet ifade etmektedir. Fıkıh bu esaslar üzerine dayanır. Çalışmamızın birinci kısmında, Fıkıh, Fıkıh Usûlü, Sünnet, Emir, Nehiy ve Delâlet kavramları ana hatlarıyla ele alıp, sünnette birçok emir ve nehyin yer aldığını örnekleriyle birlikte vermeye gayret ettik. İkinci bölümde sünnette emir sığalarını kullanışlarını ve delalet yönünden karinelerin etkisini belirtildi. Alimlerin, emrin tekrarının vücup ifade edip etmediği ve o emrin hemen mi yoksa daha sonra mı olacağı hususundaki sözlerini zikredildi. Bu konuyla alakalı bazı meseleri ve onlara dair alimlerin görüşlerinden örnekler verildi. Çalışmamın üçüncü bölümünde sünnette nehiy sığası ve onun kullanım alanlarından bahsedildi. Nehyin delâlet yönlerindeki karinelerden zikredildi. Nehyin süreklilik arz edip, etmediği alimlerin görüşleri muvâcehesinde değerlendirildi. Aynı şekilde nehyin fevr mi yoksa terahi mi ifade ettiği ulemanın görüşleriyle izah edildi. Ayrıca önemli bir mesele olan sahabenin“Rasulullah şöyle emretti veya şöyle nehyetti”sözünün emre mi, yoksa fesada mı yoksa butlana mı delalet ettiği konusu tartışıldı. Bu konuda ister ibadet ister muamelat ile alakalı olsun alimlerin bu konularla alakalı görüşleri nakledildi. Konuyu daha kolay anlamak için alimlerin bu alanda verdiği örneklerden faydalanarak meseleye açıklık getirildi. Çalışmamızın son bölümünde emir ve nehyin delâleti hususundaki ihtilaflarla birlikte fıkhı esasları ameli planda uygulamak için Hz. Peygamberin sünnetinden örnekler verildi."
