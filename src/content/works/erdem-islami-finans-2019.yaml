abstract: "Çalışmada İslami finansın KOBİ'ler için alternatif olma potansiyelinin araştırılması amaçlanmıştır. Araştırmada veri toplama yöntemi olarak anket yöntemi kullanılmıştır. Ankette kullanılmak üzere çalışmanın yazarı tarafından İslami Finansın KOBİ'ler İçin Alternatif Olma Potansiyeli Ölçeği (İFKAPÖ) geliştirilmiştir ve araştırmada uygulanacak anket formu hazırlanmıştır. Anket formları; yüz yüze anket tekniği ile İstanbul, Kocaeli, Sakarya, Bursa, Yalova ve Çanakkale şehirlerinde faaliyette bulunan ve rassal olarak seçilen 400 KOBİ'ye uygulanmıştır. Anket formlarına verilen yanıtlar elektronik ortama aktarılmış ve çalışmanın verileri oluşturulmuştur. Elde edilen verilere güvenirlik ve yapı geçerliği analizleri uygulanmıştır. Toplanan veriler SPSS ve LİSREL paket programları aracılığıyla analiz edilmiştir. Güvenirlik analizi kapsamında ölçeğe Cronbach's Alpha testi uygulanmıştır ve 0.831 sonucu elde edilmiştir. Elde edilen bu sonuç ile ölçeğin yapılacak analizler için uygun olduğu ve sonuçların güvenilir olduğu anlaşılmıştır. Ölçeğe yapı geçerliği kapsamında açımlayıcı ve doğrulayıcı faktör analizleri uygulanmıştır. Açımlayıcı faktör analizi neticesinde ölçeğin yaklaşık %76'sını açıklayan 6 faktörlü bir yapı taşıdığı tespit edilmiştir. Elde edilen faktör yapısı önceden belirlenen model olarak tanımlanmış; mevcut verilerin bu belirlenen modele ne derecede uygun bir yapı gösterdiğinin anlaşılması ve ölçüm modelinin geçerliliğinin ve güvenilirliğinin test edilmesi için doğrulayıcı faktör analizi uygulanmıştır. Analiz sonucu elde edilen uyum indekslerine ilişkin bulgular, ölçeğin belirlenen modelinin genel araştırmalar için uygun olduğunu göstermiştir."
