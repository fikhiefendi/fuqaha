abstract: "Faizsiz bankacılık uygulamaları genellikle İslâmi bankacılık olarak anılan ve faize yer vermemesi ile de klasik bankacılıktan ayrılan bir kavram olmuştur. Ülkemizde faizsiz bankacılık uygulamaları ilk olarak özel finans kurumları adıyla 1985 yılında faaliyete başlamıştır. Özel finans kurumlarına yönelik 1999 ve 2001 yıllarında yapılan önemli değişikliklerin ardından, 2005 yılında 5411 sayılı Bankacılık Kanunu'nda yapılan değişikliklerle, bankalar kanunu kapsamına alınan özel finans kurumları, 2006 yılından itibaren katılım bankaları olarak anılmaya başlamışlardır. Katılım bankacılığı hakkında bilgi vermeye çalıştığımız bu çalışma ile faizsiz bankacılık prensibiyle çalışan katılım bankalarının ülkemizdeki gelişimi analiz edilmiş ve bu amaçla katılım bankalarının 2005-2013 dönemine ilişkin çeşitli verileri incelenerek, bankacılık sektöründeki yeri analiz edilmeye çalışılmıştır. Çalışmanın uygulama bölümünde, bireylerin katılım bankalarına yönelik algılarını ölçmek amacıyla hazırlanan anket çalışması, Batı Akdeniz bölgesindeki illerde uygulanmış ve elde edilen veriler SPSS for Windows programı kullanılarak analiz edilmiştir. Yapılan araştırmanın sonucunda, katılımcıların çoğunluğunun katılım bankalarını diğer bankalardan farklı buldukları, ancak katılım banklarının çalışma prensipleri hakkında bilgi sahibi olma oranının düşük olduğu, son dönemlerde katılım bankalarının bilinirliğinin arttığı görülmüştür. Ayrıca dini hassasiyetler nedeniyle tercih etme sebebinin, bu kurumları tercih etmede etkili olan ilk tercih sebebi olmadığı sonucuna varılmıştır."
