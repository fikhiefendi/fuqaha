abstract: "İslam Hukuku; dini [vahyi], kutsal, değişmez olarak tanımlamıştır. Hukuk teorisiyle sosyal değişim arasındaki ilişki ise temel problemlerden birisidir. Hukuk veya kanun kendisini değişmek için zorlayan sosyal değişimler için nasıl cevap verecektir? Nasslar sınırlı, olaylar ise sınırsız. Dindeki hukuk boşlukları [meskutun anh] acaba bu değişimlere cevap vermede yeterli mi? Ayrıca insani değerlerin önem kazandığı, insan haklarıyla ilgili olarak eşitlik, hürriyet, sosyal adalet, kişi dokunulmazlığı, özel hayatın gizliliği, manevi hürriyetler, din ve vicdan hürriyeti, fikir açıklama hürriyeti gibi hakların fevkalade ön planda olduğu zamanımızda İslam'ın cevabı nedir? Veya Kur'ani yaklaşım nasıl olmalıdır? Bu sorulan cesaretle kendisine soran Şatibi, kendi sistematiği içerisinde cevap olarak“maslahat”kavramını ortaya koymuştur. Onun bu düşüncesi, hukuk kavramı ile sosyal değişim arasındaki ilişkiyi düzene koymayı amaçlamış ve başardı da olmuştur. İslam hukuk nazariyesinin temel özelliği olarak, işleyişini tartışmıştır. Bu yüzden Şatibi, ilgisini eğitiminin daha ilk zamanlarında, kendisine sorduğu sorularla usul-ü fikha yöneltmiş ve cevap aramıştır. Sorularının cevabının geleneksel hukuk anlayışında olmayacağını çok iyi görmüş ve günümüzde bile;“İslam Hukuk Felsefesi'V'Makasıdu'ş-Şeria”ya da Dinin Gayeleri, Hükümlerin Konuluş Amaçlan fazla araştırılmamış; tartışılsa da başarılı bir şekilde sosyal değişime hukuk adaptasyonunu sağlayacak metodunu izah etmiştir. Bu tezin amacı da küçük de olsa temel hak ve hürriyetler, hukuk metodoloji konularında İslam'ın felsefesini açıklamaya çalışmaktır. Tez çalışmamızda daha çok büyük bilgin Şatibi'nin düşüncelerini özetlemeye çalıştık. Onun döneminde hakların nasıl korunduğu ve kullanıldığı; İslam'ın hür düşünceye sağladığı katkıları açıklamaya çalıştık. Özellikle dinin zaruretleri [beş temel ilke: Can, nefis, akıl, nesil ve mal] ve içtihat konularının İslam'da, bugünkü manada insan temel hak ve hürriyetlerini ortaya koyduğu sadece farklı kelimelerle ifadelendirildiğini gördük. Zaten Şatibi'nin de referans olarak verdiği Kur'an ayetleri İslam'ın felsefesini ortaya koyuyor. Sonuç olarak İslam'ın inşam hem dünya hayatında hem de ahiret hayatında, kişi merkezli haklarını koruduğunu ve zayi etmediğini söyleyebiliriz. İnsan haklarını ölüm ve sonraki hayata taşıyarak mutlak adaleti gerçekleştirmektedir. VI"
