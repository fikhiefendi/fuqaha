abstract: "Bu çalışma, İslam miras hukuku olarak da adlandırılan ferâiz ilmi konusunda yazılmış olan Şȋrȋ'nin Manzûm Ferâ'iz-nâmesi adlı eser üzerinde yapılmıştır. Eser hakkında bilgi elde etmek için öncelikle kütüphanelerin internet ortamındaki katalogları, arşivleri incelenmiştir. Ardından eser ile ilgili yazılmış kitap, makale, tez, ansiklopedi maddesi gibi çalışmalar gözden geçirilmiş ve bu kaynaklardan yararlanılmıştır. Bu işlemlerden sonra eser iki bölüm ve eklerden oluşan başlıklar altından incelenmeye çalışılmıştır. Çalışmanın giriş bölümünde çalışma boyunca izlenen yollar, yöntemler ve aşamalar hakkında bilgi verilmiştir.Çalışmanın birinci bölümünde Şîrî hakkında kaynaklardan ve Şîrî'ninManzûmFerâ'iz-nâmesi adlı eserinden yola çıkarak elde ettiğimiz veriler ışığında bilgi verilmiştir. Bu bölümde ayrıcamanzumenin şekil ve muhteva özellikleri üzerinde durulmuştur. Birinci bölümde son olarak ferâiz ilmi tanıtılmış, Kur'ân ve sünnetteki yeri üzerinde durulmuş ve eserde yer alanferâizleilgili kavramlar açıklanmıştır. Çalışmanın asıl ağırlık noktasını ikinci bölüm oluşturmaktadır. Bu bölümde eser,çeviri yazılı alfabeyle Latin asıllı Türk alfabesineaktarılmıştır. Çalışmanın sonundaeserin el yazma nüshasına ait orijinal"
