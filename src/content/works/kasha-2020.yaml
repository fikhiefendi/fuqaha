abstract: "Arabi ilimlerin arasında sarf ilminin önemi hiç kimseye gizli değildir. Bundan dolayı eskiden beri alimlerimiz bu sarf ilmini telif etmeyi önemsemişler. Bir bölümünü incelediğim Mehdi Hanefi ye ait olan şerhül merah bu önemli kitaplardan birisidir. Gün yüzüne çıkmaya layık olan kitaplardandır. Bu kitap sarf ilminde faydalı olan kitaplardandır. Yazarın şahsiyeti bu kitapta ortaya çıkmıştır. Sarf kitaplarının arasında kendine layık bir yer edinen hoş bir şerh olarak gelmiştir. Tüm dikkatimi metni doğru bir şekilde yazmaya odaklandım. Nokta ve harf hatalarından arınmış bir şekilde kapalı olan ibarelerini açıkladım. Allah'tan bu çalışmamın faydalı olmasını dilerim, çünkü o en iyi işiten ve en yakın olandır."
