abstract: "İslâm hukukunda cezalar başlığı altında bulunan, Allah ve Rasûlu (s.a.v.) tarafından tespit edilmiş olan had cezaları büyük önem taşımaktadır. Bu cezalar kamu hukuku sayılmakla birlikte affı mümkün olmayan cezalardır. Bunlar; zina, eşkıyalık, namuslu kadına zina iftirasında bulunmak, hırsızlık, içki içmek, haksız şekilde devlete isyan etmek ve İslâm dininden dönme suçlarıdır. İslâm'da cezaların amacı kişileri cezalandırmak değil toplumu iflah etmek, insanları caydırıcı cezalarla bu suçlardan uzak tutmaktır. Bu cezalar arasında ridde, içki içmek ve devlete isyan suçu hadislerle sabit kılınmıştır. Kur'ân ilimlerinin en değerlileri arasında yer alan tefsir ilmi, yorum yapmak anlamına gelir. Ancak had cezalarından bahseden âyetleri yorumlamak diğer âyetlere oranlara daha sınırlı olabilir. Mukayese etmek için klasik dönem rivâyet tefsirlerinden olan İbn Kesir ve Cumhuriyet dönemi müfessirlerinden ve dirâyet tefsirinin en güzel örneklerinden sayılan Elmalılı M. Hamdi Yazır tefsirlerini seçmemizin amacı mezhepsel, geleneksel ve dönemsel farklılıklardan kaynaklanan değişiklikler olup olmadığını ortaya koymaktır. Had cezalarından bahseden âyetlerin bu müfessirler arasında incelenmesi sonucunda mezhep farklılığından ötürü değişim az bulunmakla birlikte zamanın değişmesinden ötürü de herhangi bir değişim ortaya çıkmadığı tespit edilmiştir. Yalnız rivâyet ve dirâyet tefsirleri olmalarından kaynaklı olarak İbn Kesîr'in (öl. 774/1373) söz konusu hususlarda fazla yorum yapmadığı ve Elmalılı'nın (1878-1942) ise Müslümanlara güncel ve gündelik hayata dair fikir ve nasihatlere ve ayrıca Türkçe diliyle yazması sebebiyle Arapça dilbilgisi ile ilgili açıklamalara yer verdiği görülmektedir. Ayrıca Elmalılı hem okuyucuyu yönlendirdiği suçların ve cezalarının sebep ve hikmetlerinden daha fazla bahsederek zaman zaman okuyucuyu ikna etmeye çalışmış hem de İbn Kesîr kadar çok rivâyete yer vermemiş, âyetlerin iniş sebepleri konusunda makul kabul edilenleri yeterli görmüştür. Ancak tüm bunlara rağmen had cezalarından bahseden âyetlerin tefsiri mukayese edildiğinde ahkâm tefsiri olmamalarına rağmen iki müfessirin de mezkûr konularda yeteri kadar bilgiye yer verdikleri ve tefsirlerinde aşırı bir fark görülmediği saptanmıştır."
