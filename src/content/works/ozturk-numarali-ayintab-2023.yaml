abstract: "Bu çalışma, Ayıntâb'a ait H.12.29.1119/M.26.12.1715 (s.1-125) tarihli Şer'iyye Sicilinin traskripsiyon ve değerlendirmesini içermektedir. Çalışmada; Ayıntâb tarihi, Osmanlı hukuku, Osmanlı Devleti'nde kadılık kurumu, şer'iyye mahkemeleri ve şer'iyye sicilleri hakkında bilgi verildikden sonra, 62 Numaralı Ayıntâb Şer'iyye sicilinin içindeki belgeler özetlenip, konularına göre tasnifi ve genel değerlendirilmesi yapılmıştır. Değerlendirmeden sonra ise transkripsiyon metnine yer verilmiştir. İncelediğimiz Ayıntâb Şer'iyye sicili, vasi, nafaka, miras, alım-satım, alacak-verecek, borç, mal davaları, vekil tayini, evlenme, hırsızlık, darp, ölüm olayları, huzur bozucu, eşkıyalık vb. konulara ilişkin belgeler yer almaktaktadır. Bahsi geçen başlıklar altında 62 Numaralı Ayıntâb Şer'iyye sicilinin incelemeye konu olan tarihlerdeki siyasi, iktisadi ve sosyal durum hakkında bazı tespitlerde bulunulmaya çalışılmıştır. Sicilin hazırlandığı dönem, Osmanlının gerileme dönemine denk gelmektedir. Bu dönemde Osmanlı Devleti padişahı III. Ahmet'tir."
