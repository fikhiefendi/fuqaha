abstract: "Fıkıh usulüne dair günümüze kadar ulasan ilk eser er-Risâle'nin yanısıra genis hacimli bir furu-ı fıkıh eseri olan el-Ümm'ün sahibi olan Safiî, bagımsız bir fıkıh ekolünün temellerini atmanın ötesinde slam hukuk metodolojisi üzerinde derin etkiler bırakmıstır. Safiî'nin ictihad ve kıyas kavramlarını es anlamlı olarak kullanmıs olması farklı yorumlara sebep olmustur. Kimi islam hukukçuları ve arastırmacılar Safiî'nin rey ictihadını kıyasa indirgeyerek dinde insan aklına verilen önemi sınırlandırdıgını, kıyas dısında rey ictihadının kapsamında bulunan istihsan, istislah vb. gibi diger prensipleri devre dısı bıraktıgını söylemislerdir. Bu görüste olanlara göre Safiî ?kıyas? kavramını, fıkıh usulünde bilinen anlamıyla kullanmaktadır. Buna karsılık usul literatüründe ilk dönemlerden bu yana Safiî'nin kıyas kavramını maslahat, istihsan vb. prensipleri de kapsayacak sekilde kullandıgına dair ifadelere rastlamak mümkündür. Ne var ki bu arastırmacıların büyük bir bölümünde Sâfiî'nin teorik açıklamaları ile yetinilmis, teorik görüslerin uygulamaya nasıl geçtigi üzerinde nedense pek durulmamıstır. Arastırmalarımız Sâfiî'nin gerek teorik açıklamaları gerekse uygulamaları onun kullanımındaki kıyas sözcügünün, sonraki dönemde usul literatüründe yer alan kıyastan daha genel oldugunu göstermektedir. Bu anlamda onun kıyas kavramının kapsamına usulî/ser'î kıyas, kimi yorum faaliyetleri ve genel prensip ictihadı girmektedir. Biz kıyasın yalnızca teorik boyutu degil aynı zamanda örnekler bazında uygulaması üzerinde durarak usul kitaplarında kıyas konusunun sayılı birkaç örnege hasredilmesinin kıyasın verimliligi konusunda ortaya çıkarabilecegi tereddütleri gidermek ve bu konudaki tartısmalara ısık tutmak istedik. Yine usulün anahtar kavramlarından birinin usule dair ilk eserde ve ilk dönem uygulamasında nasıl algılandıgını ortaya koymaya çalıstık. Çalısmalarımız sonucu elde ettigimiz izlenim Sâfiî'nin akıl ve vahiy arasındaki dengeyi basarılı bir sekilde kurabildigidir."
