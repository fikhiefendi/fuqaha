abstract: "ÖZET İslam toplumunun genel çerçevesini çizmekte etkin rol oynayan 'fıkıh' zaman içerisinde, kendi genel ilke ve prensiplerinden bazen şaşarak, bazen de o ilkelerin bir gereği olarak ve 'maksat'lara uygun şekilde değişime uğramış ve uğramaktadır. Fıkıh kültürünün değişimi noktasında da Tanzimat'ta geleneksel fıkıh anlayışından İslam hukuku anlayışına doğru gidildiğini görmekteyiz. Sadece fıkıh anlamında değil, kültürel hayatın tüm boyutlarında bir dönüm noktası olan ve geniş anlamda bir kültürel değişim dönemi olarak nitelenen Tanzimat Dönemi, hem Osmanlı Devleti ve hem de modern Türkiye Devleti açısından büyük önem arz eden ve Türkiye Cumhuriyeti Devleti'nin oluşmasında azımsanamaz payı olan bir zaman dilimidir. 18. Yüzyıldan itibaren Avrupa'daki gelişmelerden etkilenen Osmanlı Devleti, hukuk sahasında yaşanan kanunlaştırma hareketlerinden de etkilenmiş ve Tanzimat'ın ilanından sonra Batıdan kanun iktibaslarına başlamıştır. Bu dönemde Batıda laik-seküler fikirler gelişmiş, dinin sınırları çizilmiştir. Bu nedenle yapılan kanunlar da -bazı istisnalar dışında- dini kayıtlardan uzak 'modern' düşüncenin ürünüdür. Bu durumda Tanzimat Dönemi Türkiye'de Din düşüncesinin değişimini ve geçirdiği evreleri kavramak için bir dönüm noktası olarak karşımızda duruyor. Yaşadığımız çağda genelde Din, özelde ise 'fıkıh' düşüncesindeki değişimi tam anlamıyla kavramanın yolu, en azından son dönem için bize Tanzimat'ı işaret etmektedir. İşte bu çalışmamızda değişimi arayan bir bakış açısıyla Tanzimat Döneminde yapılan İslam hukuku çalışmalarını konu almaktayız. Birinci bölümde Tanzimat Dönemi 'nin genel bir değerlendirilmesi yapılmakta. İkinci bölümde ise dönemin fıkıh veya yeni anlayışla, İslam hukuku anlamında yapılan belli başlı çalışmaları olan Ceza Kanunnâmesi, Arazi Kanunnamesi, Mecelle ve Hukuk-u Aile Kararnamesini konu alacağız. Ve bu kanunlaştırmalar çerçevesinde Tanzimat'ta yaşanan değişimi göz önüne sermeye çalışacağız."
