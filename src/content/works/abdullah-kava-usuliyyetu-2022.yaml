abstract: "Bu araştırmadaki amaç, İmam Molla Ali el-Kari'nin (Allah ona rahmet etsin) durumunu, şahsi ve ilmi hayatını açıklığa kavuşturmak ve onun fıkhi kitabının önemini anlatmak, şer'i ve şer'i izaha özen kapısını aralamaktır. saflık metninin yazarı İmam Ubeydullah Al-Maboubienin (Allah ona rahmet etsin) pozisyonunu netleştirmek ve İmam tarafından belirtilen temel kuralları çıkarmak. Molla Ali (Allah ona rahmet etsin) adlı kitabında İnayat Kapısını Açmak adlı kitabında, temel prensipleri plana göre sınıflandırıp, her bölümün altına onunla ilgili olanı koyuyor. İfa, yargı ve ruhsata gelince, onları müspet kurala, anormal okuma ile ilgili olanları, nakledilen hadisleri, 'tatmin haberlerini ve sahabenin sözlerini müspet hüküm altına koydum. Kitap ve Sünnet araştırmaların' inceledim ve emir ve yasaklamayı, geneli, özeli, mutlakı, sınırlıyı, istisnayı ve sahabeyi yerleştirdim ve o, Kitap ve Sünnet arasında ortak olan konularda biz ve başkaları tarafından yasalaştırıldı. Daha sonra tasdikli Fıkıh Usul kitaplarından bahsi geçen her kuralı belgeledim ve eğer bir açıklama gerekirse kuralın kelime dağarcığını açıkladım, ardından usulilerin kitaplarını kullanarak kuralı basit bir açıklama ile açıkladım, aslendinci kuralları birbirine bağladım. kuralın uygulanmasında kitaptaki hukuk dallarının bir modeline bağladım."
