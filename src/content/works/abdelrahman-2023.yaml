abstract: "Çalışma, İslam hukukunun amaçlarını inceleyerek ve sosyal, dini, politik ve güvenlik boyutları üzerinden İslam ekonomisinin amaçlarını kanıtlamaya çalışarak İslami ekonomi için hedefler türetmeyi ve çıkarmayı amaçlamıştır. Bu hedefler, İslam hukukunun beş genel amacını gerçekleştirmeye yöneliktir. Ayrıca, nükleer enerji üretiminin bazı ekonomik yönleri de gözden geçirildi ve nükleer enerjiye sahip olmanın uygunluğu, İslami ekonominin beş amacını (yöneticilik, kalkınma, bağımsızlık, adalet ve güvenlik) gerçekleştirir ve sonra İslam hukukunun amaçlarını gerçekleştirir. Aynı zamanda nükleer enerjiye sahip olmanın uygunluğu ve bunun birey, toplum ve devlet üzerindeki etkisi de incelendi. Çalışma, tümevarımsal ve betimleyici analitik yaklaşımı kullanmış ve bu beş amacın İslami ekonomi amaçları olarak kabul edilebileceği sonucuna varmıştır. Ayrıca, nükleer enerjiye sahip olmanın ve bundan faydalanmanın, büyük ölçüde İslami ekonomi amaçlarıyla uyumlu olduğu ve sonuçta İslami hukukun amaçlarını gerçekleştirdiği teyit edilebilir. İslam'ın İslami ekonomiye bakışı, yalnızca finansal işlemlerin fıkhı ile sınırlı değildir, çünkü finansal işlemler ve onların fıkhı, İslami ekonomi bileşenlerinin bir parçasıdır. Nükleer enerjiye sahip olmak, devletlerin güç ve güvenliğinin araçlarından biri olduğundan, İslami ülkelerin dünyada güvenlik dengesine ulaşmak için bu enerjiye sahip olmaya çalışmaları gerekmektedir. Nükleer enerjiye sahip olmanın ana hedefi ve anlamı, devlet için caydırıcılıktır, saldırganları caydırmaktır. Devlet enerjiye sahip olduğunda, güçlü bir ülke olarak kabul edilir ve bu onun için bir koruma olacaktır. Çalışma ayrıca, İslami ekonomi amaçlarının, nükleer enerji gibi modern konularla güçlü bir ilişkisi olduğunu bulmuştur. İslami ekonomi, ilerici ve dinamik bir ekonomidir ve nükleer enerji ile ilgili projelere harcama yapmayı teşvik eder. Çalışma ayrıca, İslam ekonomisinin amaçlarının, nükleer enerji gibi ortaya çıkan konularla güçlü bir ilişkisi olduğu sonucuna varmıştır. İslam ekonomisi, ilerici, dinamik ve nükleer enerji ile ilgili projelere harcama yapmayı teşvik eden bir ekonomidir."
