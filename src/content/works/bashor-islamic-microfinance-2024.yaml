abstract: "Mikrofinans, ana akım bankacılık sektörünün şartlarını karşılayamayan yoksullara finansal hizmetler sağlama konusunda uzmanlaşmış bir finansal kurumdur. Son zamanlarda Endonezya'da pesantren olarak bilinen İslami eğitim kurumları kendi mikrofinans kurumlarını bağımsız olarak kurabilmiş ve kayda değer başarılar elde etmişlerdir. Bu durum, pesantrenleri gelenekçi görüşe fazlasıyla bağlı ve ekonomik olarak kendilerini idame ettiremeyecek kadar zayıf kurumlar olarak gören toplumdaki hakim önyargıya rağmen gerçekleşmiştir. Bu nedenle çalışma, bu öngörülemeyen olguyu gerçeğe dönüştüren faktörleri ortaya çıkarmayı amaçlamaktadır. Bu çalışma için özel olarak seçilen dört örnek bulunmaktadır; bunlar Haramain Mini Bank, BMT La Tansa Gontor, LAZIS Tazakka ve BMT UGT Sidogiri'dir; vakalar sırasıyla küçük, orta ve büyük ölçekli kurumları temsil etmektedir. Veriler nitel doğrudan gözlem, derinlemesine mülakat ve dokümantasyon yöntemiyle toplanmış, daha sonra nitel veri analizi yazılımı QDA Miner Lite ile işlenmiştir. Analiz, derinlemesine mülakatlardaki sıklıklarını sayarak konuyla ilgili kodların önemini ortaya koymuş, bunu gözlem ve belgeler ile teyit ederek daha da güçlendirmiştir. Bulgular, her vakanın kendine özgü uygulamaları ve fikirleri olduğunu, ancak hepsinin birkaç özet kavramla bütünleştirilebileceğini ve genelleştirilebileceğini göstermektedir. Tüm vakaların başarısı, birçok kısıtlamaya rağmen az miktardaki kaynaklarını kurnazca seferber etme becerileri ile bağlantılıdır. Bu başarı, yüksek manevi bağlılıkları, sağlam toplulukları ve sadık bağımsızlıkları sayesinde mümkün olmuştur; bu nitelikler daha sonra güvenilirlikleri, kurumsal güçleri ve özgüvenleri ile ilişkilendirilmiştir."
