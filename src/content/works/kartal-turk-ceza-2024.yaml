abstract: "Çalışmanın konusu 5237 sayılı Türk Ceza Kanunu'nda düzenlenen kasten yaralama suçudur. Çalışma üç bölümden oluşmaktadır. İlk bölümde kasten yaralama suçunun tarihsel gelişimi; Roma Hukuku Dönemi, İslamiyet Öncesi Dönem, İslam Hukuku Dönemi, Tanzimat Dönemi, 765 sayılı Türk Ceza Kanunu dönemi başlıkları ile incelenmiştir. Kasten yaralama suçunun karşılaştırmalı hukuk bakımdan incelenmesi; İngiliz Hukuku, Alman Hukuku, Avusturya Hukuku ve İtalyan Hukuku bakımından incelenmiştir. Kasten yaralama suçunun uygulamada benzer özellik gösterdiği; cebir suçu, işkence suçu, eziyet suçu kısaca açıklanarak, kasten yaralama suçundan ayrıldığı noktalar vurgulanmıştır. Çalışmanın ikinci bölümünde kasten yaralama suçunun unsurlarına yer verilmiştir. Kasten yaralama suçunun unsurları tipiklik unsuru ve hukuka aykırılık unsuru olarak iki bölümde incelenmiştir. Tipiklik unsuru içerisinde suçun maddi unsurları ve manevi unsurları incelenmiştir. Kasten yaralama suçunun maddi unsurları incelenirken netice unsuruna dikkat çekmek ve fiil unsurunun daha iyi anlaşılmasını sağlamak amacıyla netice unsuru, fiil unsurundan önce ele alınarak açıklanmıştır. Bu bölümde tipiklik unsurundan sonra hukuka aykırılık unsuru açıklanmıştır. Hukuka aykırılık unsurunun içerisinde son dönemlerde doktrinde tartışma konusu olmuş; tedip hakkı, sportif faaliyetler, sünnet ve hekimin sorumluluğu konularına ayrıntılı olarak yer verilmiştir. Çalışmanın üçüncü bölümünde ise suçun nitelikli halleri, özel görünüş halleri ve yaptırımı incelenmiştir. Tüm bölümlerde Yargıtay kararları örnek gösterilerek açıklanmak istenen hususlar daha somut hale getirilmeye çalışılmıştır. Sonuç bölümünde ise kasten yaralama ile ilgili özellikle tartışmalı konulara dair önerilere yer verilmiştir"
