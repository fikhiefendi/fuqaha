abstract: "Bankalar, farklı türde mali ve sosyal hizmetleri yerine getirmekle birlikte dinamik yapıda para ve kredi ticareti yapan, kuruluşlardır. Ancak bu faaliyetler faiz ile birlikte yürütülmektedir. Katılım bankacılığı sektörü ise hem alternatif bir bankacılık sistemi hem de mevcut bankacılık sistemini yapmaktadır. Katılım bankaların temel faaliyetleri, konvansiyonel bankalardan farklı bir şekilde yatırımcıdan fon toplamak ve bu fonları piyasaya aktarmak suretiyle mali aracılık yapmaktır. Bu çalışmanın birinci bölümünde, banka kavramının tanımı ve türleri anlatılmış, günümüz bankacılık sektörünün faaliyet alanları ve bankacılık işlevleri üzerinde durulmuştur. İkinci bölümünde, katılım bankacılığı diğer adıyla İslami veya faizsiz bankacılık kavramının tanımı, ortaya çıkış sebepleri, tarihsel gelişimi, işleyiş biçimi ve ekonomiye katkıları ele alınmıştır. Ayrıca uygulama katılım bankalarının müşterilerine yönelik olduğundan, müşteri kavramının tanımı ve müşteri memnuniyeti kısaca anlatılmıştır. 2018 yılı Haziran ve Temmuz aylarında Sivas ilindeki Katılım bankalarının müşterilerine anket yapılmış ve elde edilen verilerin analizleri, SPSS 24 proğramında yapılmıştır.“Müşterilerin Katılım Bankalarını Tercih Etme Sebeplerinin İncelenmesi: Sivas İli Örneği”adlı bu çalışma, katılım bankalarında; Fiziki Koşullar, Personel Yaklaşımı, Çalışma Disiplini, Müşteri Memnuniyeti, Sanal Bankacılık Hizmetleri ve Dini Hassasiyet konuları araştırılmıştır. Bu araştımada müşterilerin; yaş, meslek, medeni durum, gelir düzeyi, cinsiyet, eğitim durumu ve müşterilik yılı göz ününde bulundurularak kıyaslama ve karşılaştırma yapılmıştır. Sivas ilinde yapılan bu çalışmada deneklere yönetilen ifadelere katılım düzeylerinin katılıyoruma yakın olduğu tespit edilmiştir."
