abstract: "Çalışmamızda İmâmeyn ve Ebû Hanîfe'nin ticari akitlerdeki ihtilafları, Mergînânî'nin el-Hidâye'si başta olmak üzere mezhebin muteber metinleri üzerinden tespit edilerek, bu ihtilafların usûlî sebepleri incelenmeye çalışılmıştır. Araştırmamız neticesinde İmâmeyn ile Ebû Hanîfe arasında ticari akitler bağlamında 85 ihtilaf tespit edilmiştir. Bu ihtilaflarda İmâmeyn'in delillerin zahirine bağlı kalma, Ebû Hanîfe'nin ise delillerin ruhunu anlama odaklı bir usûl takip ettiği sonucuna ulaşılmıştır. Çalışmamız, ihtilafları ele alınan imamların ve el-Hidâye müellifinin hayatlarını inceleyen ilk bölüm, imamların ihtilaflarının dayandığı usûlî sebepleri başlıklandıran ikinci bölüm ve ticârî akitlerdeki fürû ihtilafların usûl bakımından incelendiği üçüncü bölüm olmak üzere bir giriş, üç bölüm ve sonuçtan oluşmuştur."
