abstract: "Para, bilinebilen insanlık tarihi içerisinde, mal ve hizmet değişimlerinde takastan sonraki mübadele aracı olmuş, dolayısıyla binlerce yıldır ticarette ve günlük hayatta yoğun bir şekilde kullanılan ödeme ve tahsilât aracı haline gelmiştir. Bu özelliğiyle para, bilinebilen tarihin en büyük insanlık icadıdır. Özellikle değerli madenlerden altın ve gümüş, insanlık tarihi boyunca en çok kullanılan madeni paralar olmuştur. İnsan neslinin çoğalması ve toplumsal yaşamın değişime uğraması ile insanoğlunun kullandığı paralarda zaman içerisinde değişime uğramıştır. Dünyanın değişik bölgelerinde farklı toplumlar ve devletler kendi adlarına metal veya diğer malzemelerden paralar bastırmış ve ticari hayatta bu paraları kullanmışlardır. Bu işleviyle para, bir nevi devletlerin var olma, egemenlik ve bağımsızlık göstergesi haline gelmiştir. Bugün dünyada 8 milyardan fazla insanın yaşadığı ve bu nüfusun yaklaşık 2 milyar kadarını Müslüman toplumların oluşturduğu bilinmektedir. Müslüman birey ve toplumların hayat anlayışı, hemen her konuda Allah'ın buyruklarına uygun olarak yaşama arzusuyla şekillenmiştir. Bu sosyal gerçeklik; içinde bulunduğumuz modern bilgi çağında, bilişim ve iletişim teknolojilerinin sağladığı yeniliklerin İslam Ekonomisini tercih eden insanlar açısından da incelenmesini, bu ekonominin maksat ve ruhuna uygun olan işlem ve araçlar ile uygun olmayan diğer işlem ve araçların belirlenmesini ihtiyaç haline getirmiştir. Paranın ticarette ve günlük alışverişte değişim aracı olarak kullanılması ile paranın üretimi yani basılması, güvenliği, saklanması, nakli, değer kazanması ve kaybetmesi gibi konular, geçmişten günümüze kadar pek çok kez gündeme gelmiştir; ancak bugün de hem bireyleri hem de ekonomi çevrelerini sürekli meşgul etmeye devam etmektedir. Ticari hayatta vazgeçilemez bir ödeme ve değişim aracı olan para, aynı zamanda her dönemin önemli bir zenginlik göstergesi olarak da algılanmıştır. Paranın bu özelliği, zenginler ile ihtiyaç sahipleri arasındaki borç alıp verme işlemlerinde, kredi kullanımlarında, devletlerin vergi tahsilâtında bugün de yoğun bir şekilde hissedilmektedir. Teknolojinin gelişmesi ve bilgi toplumuna geçilmesiyle beraber gündelik hayatlarda bilgisayar ve internet kullanımı artmış, insanlar birçok ticari işlemi internet ortamında gerçekleştirmeye ve hem tahsilât hem de ödemelerini sanal kartlar ve elektronik paralar aracılığıyla yapmaya başlamışlardır. Bu çalışmada özellikle paranın tarihçesi, İslam dünyasındaki kullanımı, Osmanlı Devleti'nde nasıl kullanıldığı, paranın kullanım alanları, altın ve gümüş para sistemleri, ilk kâğıt paranın ortaya çıkışı, bankaların ve merkez bankalarının kuruluş süreci gibi konular öncelikle ele alınmış, daha sonra da bilişim teknolojisinin gelişmesi ve bilgi toplumuna geçişle beraber internetin yaygın kullanılması sonucu ortaya çıkan elektronik bankacılık hakkında bilgi verilmiştir. Bunun doğal sonucu olarak da elektronik, dijital, kripto para birimi gibi bugünkü sanal ekonomik araçlar ve işlevleri incelenmiştir. Bu araçlar ve işlevleri üzerine yapılmış araştırma ve incelemelerin ekonomik alanda hem bugün yaşanmakta olan hem de ileride yaşanması mümkün ve muhtemel olan sorunlar ve çözüm yolları hakkında bilimsel çalışmalara katkı sağlaması hedeflenmiştir. Tez çalışmada özellikle elektronik para sistemlerinin özü ve yapısı, disiplinler arası bir perspektifle ele alınıp İslam hukuku, bankacılık ve bilgisayar mühendisliği açısından incelenmiş gerek Bitcoin gerekse diğer kripto paralar İslam ekonomisi açısından değerlendirilip uygun olan ürünler sonuç bölümünde önerilmiştir."
