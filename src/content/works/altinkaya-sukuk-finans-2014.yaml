abstract: "Dünyada İslami finans din farkı gözetilmeksizin bütün ülkeler tarafından ilgiyle izlenmekte ve yeni düzenlemelerle uygulanmaktadır. İslami finansın önemli lokomotifi olan katılım bankaları faiz yerine kar ve zarara katılma esasına göre mali sektörde faaliyet gösteren, reel ekonomiyi finanse eden, kendine özgü fon toplama ve fon kullandırma yöntemlerine sahip olan kurumlardır. Katılım bankacılığının kendine özgü sistemi faizsiz finansman endüstrisinde atıl fonların ekonomiye kazandırılmasında yeni alternatifleri otaya çıkarmıştır. Bu alternatifler arasında son yıllarda hızla gelişen özelliğiyle sukuk finansman aracı öne çıkmaktadır. Sukuk piyasası geleneksel bono piyasasının yanında İslam ülkeleri başta olmak üzere tüm dünyada hızla gelişmektedir. Türkiye de sukuk piyasasının potansiyelini görerek 2012 Eylül ayında 1.5 milyar dolarlık sukuk ihraç ederek gerçek anlamda piyasa adım atmıĢtır. Bu çalışmada sukuk finans modeli tanımlanmış olup, dünyada yaygın olarak kullanılan bu modelin Türkiye için uygulanabilirliği, hacmi ve derinliği incelenmiştir. Sukuk sertifikası ile ilgili kanun ve düzenlemeler tamamlanmış olup, ihracın önemli hacmini oluşturan katılım bankaları ihraç oranları Kuveyt Türk Katılım Bankası örneği ile karşılaştırılarak sukuk finansman modeli ayrıntılı olarak tanıtılmıştır. Elde edilen veriler ışığında ve sukuk piyasasının dünyadaki gelişimi incelendiğinde henüz bu piyasada yeni yeni ihraçlar yapmaya başlayan Türkiye‟nin çok geniş bir potansiyele sahip olduğu görülmektedir."
