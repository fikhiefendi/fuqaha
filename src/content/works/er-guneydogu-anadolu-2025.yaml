abstract: "Cahiliye döneminin âdetlerinden biri olan kan davaları insanlık tarihi kadar eskidir. Bu âdet insanlık tarihi kadar eski olmakla birlikte maalesef günümüz dünyasında hâlâ karşılaştığımız bir olgudur. Bu olgu sebebiyle birçok insanın temel haklarından biri olan yaşama hakkı büyük bir tehdit ile karşı karşıya kalmaktadır. Özellikle yaşadığımız coğrafya olan Güneydoğu Anadolu Bölgesinin birçok yerinde kan davaları görülmektedir. Bu davaların sonucunda birçok insan maddi ve manevi zararlarla karşı karşıya kalmaktadır. Bölgede kan davalarında sadece katilin ailesi değil aynı zamanda maktulun ailesinin de can ve mal güvenliği tehlike altına girmektedir. Kan davaları bazı toplumların en önemli sorunların başında yer alır. Güneydoğu Anadolu Bölgesinde kan davalarının ekonomik, siyasi, toplumsal ve kültürel birçok nedeni mevcuttur. İslâm hukuku açısından kasten öldürme fiilinin dünyevî cezası kısas, diyet ve mirastan men, ahret cezası ise ebedi cehennemdir. Ancak Türkiye'nin hukuk düzeni dünyevî müeyyidenin uygulanmasına elverişli değildir. Bu nedenle İslâm hukukunun ek çözümü olan arabuluculuk kurumu sulh yoluyla diyet ödenmesi devreye girmektedir. Bununla birlikte İslâm hukukunun temel ilkelerinden yararlanarak bu bölgedeki kan davalarının nedenlerini ortadan kaldıracak eğitimsel, ekonomik, siyasi, hukuki, toplumsal ve kültürel unsurların ıslahı ile toplumu bu konuda bilinçlendirmek gerekir."
