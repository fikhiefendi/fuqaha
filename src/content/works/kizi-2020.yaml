abstract: "İslâm evrensel bir din olarak farklı coğrafyalara yayılmış, farklı dil ve kültüre mensup insanları bir araya getirmiştir. Günümüzde dinin insan ve toplum hayatının“vazgeçilmez”bir parçası olduğu fikri genel kabul görmektedir. Ancak dinin birleştirici gücü olduğu gibi, doğru anlaşılıp yaşanmadığında birtakım sapmalara da neden olabilmektedir. Kırgızistan bağımsızlığına kavuştuktan sonra, ülkede İslâmlaşma trendi hızla yükselmeye başlamıştır. Bağımsızlıkla birlikte Kırgızistan'ın tarihsel kimliği, dini inançları, örf ve adetleri konusunda toplumda bir farkındalık ortaya çıkmıştır. Sovyet yönetimlerinin ateist baskıları Kırgızistan'daki dini hayatı derinden etkilemiş olsa da, Kırgızların sahip oldukları dini miras, onların dini kimliklerini korumalarını sağlamıştır. 70 yıl SSCB'nin ateist baskılarıyla yaşamlarını sürdürmeye çalışan halkımız, SSCB'den sonra kalplerinin derinliklerinde saklı bulunan dînî duyguları yaşama imkanına sonunda kavuşmuştur. İslam dini Kırgızistan'da Sovyet sonrası döneminde yaygın ve örgün olmak üzere iki yoldan yayılmıştır. Bununla beraber, kapsam ve etki olarak yaygın din eğitimi kurumları daha ön plandadır. Kırgızistan Din İşleri Başkanlığının verdiği bilgilere göre ülkede bir İslam Üniversitesi, on Enstitüsü, üç İlahiyat Fakültesi, 102 Kur'an Kursu (medrese) mevcuttur. Ancak resmi olarak sadece 78 Kur'an Kursu hizmet vermektedir. Araştırmamızın konusu,“Türkiye ve Kırgızistan'daki Kur'an Kursları: Karşılaştırmalı Bir Çalışma”dır. Türkiye ve Kırgızistan'daki Kur'an Kurslarının tarihi gelişimi araştırılmış, eğitim programları, müfredat, devlete bağlı olup olmadığı, hukuki durumu, mali durumu, hocaların eğitim durumu, derste izlediği yöntemler vs. gibi konulara değinilmiştir. vii Bölümler olarak incelediğimizde; araştırmamızın giriş bölümünde; kuramsal bilgilerden ve gelişmelerden bahsedilmiştir. Araştırmanın amacı ve önemi, problemi, yöntemi, temel kavramları, evren ve örneklemi, sınırlılıkları ile ilgili bilgilere yer verilmiştir. Birinci bölümde; Türkiye'deki Kur'an Kursları, çeşitleri, müfredatı programları, eğitim programlarının amacı ve uygulama ilkeleri gibi konular ele alınmıştır. İkinci bölümde; önce Kırgızistan'daki dini durum, dini kurumlar ve yaygın din eğitim kurumları hakkında bilgilere yer verilmiş, üçüncü bölümünde ise, Bişkek'te hizmet veren üç Kuran Kursunda uygulanan mülakat sonuçlarına yer verilmiş, elde edilen sonuçlar değerlendirilerek birtakım önerilerde bulunulmuştur."
