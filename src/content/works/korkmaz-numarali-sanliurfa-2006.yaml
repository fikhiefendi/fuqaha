abstract: "Türk tarihi açısından oldukça önemli bilgiler ihtiva eden Şer`iyye Sicilleri, Osmanlıtarihinin en önemli arşiv kaynaklarından biridir, bu nedenle Şer`iyye Sicillerine dairçalışmalara yeterli özenin gösterilmesi gerekmektedir.Bu düşünceden hareketle, 205 Numaralı Urfa Şer`iyye Sicili'nin Transkripsiyon veDeğerlendirmesinin yapılması suretiyle, bu çalışmanın bu alanda yapılan çalışmalarabir örnek teşkil etmesi amaçlanmıştır.205 Numaralı Urfa Şer`iyye Sicili'nin H. 1269 / M. 1852 - H. 1272/ M. 1855 yıllarınıkapsayan bölümü çalışılmıştır.Bu sicil Urfa'ya ait diğer Şer'iyye Sicilleriyle birlikteAnkara Milli Kütüphanede muhafaza edilmektedir."
