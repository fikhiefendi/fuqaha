abstract: "Küreselleşme ile birlikte rekabetinde daha arttığı günümüz coğrafyasında işletmeler, faaliyetlerini her zamankinden daha farklı yöntem ve modellerle sürdürmek zorundadır. İşletmeleri diğerlerinden farklılaştıracak önemli iki unsur; çalışan memnuniyetini sağlamak ve markalaşmaktır. Pazarlama literatüründeki geçmişi çok yeni olan içsel pazarlama ve içsel markalama kavramları bu çerçevede işletmelere önemli rekabet avantajı sunmaktadır. Tüm sektörlerde önemli olmasına karşın özellikle hizmet sektöründe çalışanın fonksiyonu daha fazla önem arz etmektedir. Bir hizmet sektörü olan bankacılık sektörü Türkiye'de rekabetin en yoğun yaşandığı hizmet sektörlerinin başında gelmektedir. Pazarlama kavramı, genelde mal ve hizmetin dış müşteriye satılması olarak düşünülmektedir. İçsel pazarlama anlayışında ise bir işletmedeki personel o işletmenin ilk pazarı olarak görülmektedir. İçsel pazarlamanın ana amacı, her seviyede müşteri odaklı ve motive olmuş çalışanlar elde etmektir. Bankacılık sektöründe ve bütün hizmet sektörlerinde hizmeti üreten ve sunan çalışandır. Bundan dolayı, işletmelerin en temel politikası, dış müşterilerinin istek, ihtiyaç ve beklentilerini en iyi şekilde karşılamanın yanında, iç müşterisinin istek, ihtiyaç ve beklentilerini de karşılamak olmalıdır. İşletmelere rekabet avantajı sunan bir diğer temel unsur ise markalaşmaktır. Markalaşma, şirketler ve organizasyonlar için önemli ve eşsiz bir kimliktir. İşletmeler genellikle markalaşma sürecinde çalışanlardan daha fazla dış müşterilere odaklanmaktadır. Oysa marka vaadinin iletilmesinde çalışanlar çok önemli bir role sahiptirler. Özellikle hizmet sektöründe markalaşma çoğunlukla çalışanların tutum ve davranışlarına bağlıdır. İçsel markalama, dış müşterilere marka vaadini ve marka değerlerini uygun bir şekilde iletebilmeleri için çalışanların tutum ve davranışlarının şekillendirilmesidir. Bu araştırmada, Türkiye'deki beş katılım bankasında çalışan bankacılar üzerinde içsel pazarlama uygulamalarının içsel markalamaya olan etkisi tespit edilmeye çalışılmıştır. Bu süreçte iki aşamalı araştırma gerçekleştirilmiştir. İlk aşamada teorik bir altyapı oluşturmak için içsel pazarlama ve içsel markalama kavramları araştırılmıştır. Uygulama aşamasında ise Türkiye'deki katılım bankalarında çalışan personel üzerinden içsel pazarlamanın içsel markalama üzerindeki etkisi öğrenilmeye çalışılmıştır. Bu amaç doğrultusunda katılım bankacılığında istihdam edilen personele anket çalışması yapılmıştır. Araştırmanın verileri istatistiksel teknikler kullanılarak yorumlanmıştır."
