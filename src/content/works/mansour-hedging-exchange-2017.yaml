abstract: "Günümüzde, dünya ekonomileri döviz kuru riski ile karşılaşmakta ve bu riski elimine etmenin yollarını aramaktadırlar. Söz konusu risk, günlük işlemlerinde birden fazla para birimi kullanan dünya İslami bankacılık sistemi üzerinde de önemli bir etkiye sahiptir. Döviz kuru riskine açık olan İslam bankalarının etkin bir biçimde kendilerini bu riskten korumaları gerekmektedir. Bu bağlamda, bu tezde İslam bankaları için türev araçlar (forward, futures, opsiyonlar ve swap) yoluyla döviz kuru riskinden korunmanın nasıl gerçekleştirileceği ortaya konulmaya çalışılmıştır. Bu çalışmada türev araçlar içinde İslam bankacılığı ilkelerine daha uygun olan swap ve forward sözleşmeler üzerinde ağırlıklı olarak durulmuştur. Daha sonra opsiyon sözleşmelerinin İslam bankacılığı açısından ne kadar uygun olacağına dair tartışmalara yer verilmiştir. Bu çalışma için gerekli olan bilgiler; kitaplardan, makalelerden, daha önce yapılan çalışmalardan ve resmi internet sayfalarından elde edilmiştir. Yapılan bu teorik çalışmanın ardından Türkiye'de faaliyet gösteren hem geleneksel hem de İslami bankaların döviz kuru riskini nasıl yönettikleri anket yoluyla belirlenmeye çalışılmıştır. Veriler, Türkiye bankacılık sektörünün döviz kuruna açık olma durumunu araştırmak için üst yönetimden anket yoluyla toplanmıştır. Bu çalışmadan beklenen katkılar aşağıdaki gibidir: Tezin teorik kısmının, döviz kuru riskine karşı korunma açısından literatüre üç katkı sağlaması muhtemeldir. İlk katkı, çalışmanın, İslami çapraz döviz swapları ve İslami tam çapraz swap şemalarında önerdiği değişikliktir. Bu değişiklik, İslam bankalarının döviz kuru riskine karşı etkili bir korunma imkânı sağladığını göstermektedir. İkinci katkı, çoklu döviz kuru riskini azaltmaya yardımcı olabilecek çoklu döviz çapraz swap şeması kullanarak yeni bir korunma tekniği için temellerin oluşturulmasıdır. Aynı zamanda önerilen swap şeması, İslam bankalarının, döviz kuru riskine karşı önerilen swap tekniği ile her koşulda kar sağladığını göstermektedir. Üçüncü katkı, hem İslami hem de geleneksel bankalar ve aynı zaman sözleşmenin karşı tarafı için döviz kuru riskini azaltmak için vadeli döviz swap şemasının gösterilmesidir. Bu çalışma, vadeli döviz swapı şemasını açıklayan ilk çalışmadır. Dolayısıyla, şemalarda gösterilen işlemler, Şeriat ilkeleriyle tamamen uyumludur ve yasaklanan herhangi bir İslami unsuru içermemektedir. İkinci yaklaşım, çalışmanın ampirik alanına çeşitli katkılar sağlamaktadır. İslami bankalar geleneksel bankalara göre daha çok kur riskine açık olmaktadır. Bankaların %70'nin her gün rapor hazırladıkları, %10 ise haftalık ve günlük olarak rapor hazırladıkları kaydedilmektedir. Katılımcıların %70'nin korunma için finansal türev ürünlerini kullandıkları saptanmıştır. Ancak katılımcıların %10'u, hem İslami hem de geleneksel bankalarda korunma ve arbitraj için finansal türev ürünlerini kullanmaktadırlar. Ayrıca, geleneksel bankalarda döviz swapları ve döviz forwardlarının kullanımının (%40) seviyesine çıktığını ortaya konulmuştur. Türev araçlar içinde döviz forward sözleşmelerinin kullanımı %60 seviyesinde olsa da Murabaha sözleşmeleri, en çok kullanılan sözleşmelerdir. İslami bankalarda en çok kullanılan türev ürünler arasında teminat biçimli sözleşmeler ve paralel sözleşmeler yer almaktadır. Ancak opsiyon sözleşmeleri, geleneksel bankalarda en önemli korunma sözleşmeleridir. Çalışmanın katkılarında ifade edildiği gibi İslami bankalarda İslami swaplar, riski azaltma yönünden en önemli araçlardır. Dolayısıyla çoklu döviz çapraz swapları ve forward swapları döviz kuru olmak üzere iki şema oluşturulmuş ve önerilmiştir."
