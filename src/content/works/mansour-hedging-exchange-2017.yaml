title: "Hedging Exchange Rate Risk by Derivatives in Islamic and Conventional Banks: A Comparative Study"
titleTranslation: {"tr": "İslam bankalarında ve geleneksel bankalarda türev araçları ile döviz kuru riskinden korunma: Karşılaştıralabilir bir çalışma"}
