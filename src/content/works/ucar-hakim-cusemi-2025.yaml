abstract: "Tefsirler, müfessirin kültürel ve mezhebî arka planından bağımsız olarak ele alınamaz. Zira her tefsir, müfessirin kendine özgü düşünce sistemi ve paradigmaları çerçevesinde şekillenir. Müfessirler, farklı fıkhî, kelâmî ve felsefî kabullerle eserlerini kaleme almışlardır. Bu çalışma, bu perspektiften hareketle, Hâkim el-Cüşemî'nin (ö. 494/1101) Mâide sûresinde ahkâm başlığı altında yaptığı yorumları incelemektedir. Cüşemî'nin bu yorumları, onun fıkhî ve kelâmî kimliğini net bir şekilde ortaya koymaktadır.Cüşemî'nin Mu'tezilî bir müfessir olması, bu çalışmanın odak noktasını oluşturmaktadır. Bu durum, bize farklı bir mezhebin Kur'an'a ve ahkâm ayetlerine bakış açısını derinlemesine inceleme imkânı sunmaktadır. Müfessirler, genel olarak, mensup oldukları mezhebin konumunu pekiştirmek amacıyla Kur'an ayetlerini kendi mezhebî görüşleri doğrultusunda yorumlamışlardır. Cüşemî'nin de bu doğrultuda hareket ederek, bazı yerlerde doğrudan mezhep büyüklerine atıflarda bulunması, tefsirlerin sadece metin analizi değil, aynı zamanda mezhebî bir konumlandırma aracı olarak da kullanıldığının bir göstergesidir. Kur'ân ayetleri müfessirler tarafından farklı konular ile ilişkilendirilmiştir. Bir ayetin birden çok konu ile müfessirler tarafından ilişkisinin kurulması bunun en büyük örneğidir. Bu çalışmada Cüşemî'nin ayetleri yorumlayış metodu üzerinde durulacaktır. Ayetleri ahkam çerçevesinde çeşitli konular ile ilişkilendiren Cüşemî bu ilişkiyi delâlet kavramıyla ortaya koymaktadır. Bu çalışmada Cüşemî özelinde ahkam ve delâlet anlayışı ve bunun Kur'ân yorumuna etkisi ele alınacaktır."
