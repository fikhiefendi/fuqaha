abstract: "Yapay Zekanın (YZ) hızlı gelişimi, yaşamın ve gelişimin birçok yönünü etkileyen çeşitli türler, dallar ve uygulamalarla çeşitlendi. Bu araştırma, Yapay Zeka ve çeşitli uygulamalarına hukuki açıdan yaklaşarak tanımlayıcı-analitik ve tümevarımsal-tümdengelimli bir metodoloji kullanır. Çalışma, akıllı elektronik ticaret, robot tasarımı, yeterlilik, sorumluluk ve garanti konularını içerir. İslami etik yönlerini ele alarak, akıllı teknolojilerin insan hakları, onur, davranışlar ve etik düşünceleri üzerindeki etkilerini inceler. Araştırma, yapay zeka tabanlı ticaretin, bağımsız mağaza işlemlerinin ve akıllı acentelerin hukuki geçerliliğini doğrular. Robotlara yönelik sorumluluk ve yetkinin yasaklanması ile garanti ve sorumluluk kararlarını ele alır. Akıllı teknolojilerle tedavi ve hastalıkların önlenmesine ilişkin konuların caiz olduğunu savunur, ancak genetik iyileştirme müdahalelerini reddeder. İslami etik açısından, akıllı uygulamaların insan yaşamı, onur, mahremiyet, adalet, şeffaflık ve mahremiyet gibi temel değerlere uyması gerektiğini vurgular. Çalışma, yapay zekanın evrimi ve etik kuralların ortaya çıkardığı hukuki sorunlar üzerine daha fazla araştırma yapılmasını önerir. Müslüman araştırmacıları, tüketimden ziyade İslami vizyon ve değerlere dayalı tasarım ve geliştirmeye yönlendiren, akıllı uygulama işleyişinin mekanizmalarını derinlemesine inceleyen teorik ve uygulamalı çalışmalar yapmaya teşvik eder."
