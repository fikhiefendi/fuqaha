abstract: "Zâhirî Mezhebinin ikinci imâmı kabul edilen İbn Hazm, teze konu olan el-Muhallâ'da, kendi görüşlerinin yanında diğer mezhep imâmlarının görüşlerini de vermiş, yer yer bu görüşlere katılmış yer yer sert eleştiriye tabi tutmuştur. İbn Hazm'ın bu eserinde, görüşlerini verdiği âlimlerden biri de İmâm Mâlik'tir. Bu tezde İbn Hazm'ın ibadet konularında İmâm Mâlik'e nispet ettiği görüşlerin tespit ve tahkiki yapılmıştır. Tez giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş kısmında tezin önemi ve amacı, sınırlılıkları ile tezde başvurulan başlıca kaynakların izahı yapılmıştır. Birinci bölümde İbn Hazm ve İmâm Mâlik'in hayatı, eserleri ve bilhassa tezin ana kaynağını oluşturan el-Muhallâ'dan bahsedilmiştir. Tezin ana gövdesini oluşturan ikinci bölümde el-Muhallâ'da ibadet bahislerinde, İmâm Mâlik'e nispet edilen görüşlerin tespiti ve İmâm Mâlik'in el-Muvatta adlı eseri ile Mâlikî mezhebinin meşhur eserlerinden tahkiki yapılmıştır. Bu çalışmada İmâm Mâlik'e ait 253 görüş tespit ve tahkik edilmiştir. Bu görüşlerin 236 tanesinde isabet, 9 tanesinde hata 8 tanesinde ise kısmen isabet tespit edilmiştir. Çalışmanın sonuç kısmında ise yapılan araştırma sonucuna dayanarak değerlendirmeler yer almaktadır."
