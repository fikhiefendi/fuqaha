abstract: "?Cessâs'ın `el-Füsûl' Adlı Eserindeki Asılların Tespiti? isimli bu tez, `Giriş' ve `Sonuç' dışında bir ana bölümden oluşmaktadır.Çalışmanın `Giriş' kısmında araştırmanın yöntem ve amacı belirlenmiş, Fıkıh Usûlünün Hanefiler açısından gelişimine değinilmiş, Cessâs'ın hayatı ile `asıl' ve `kâide' terimleri hakkında bilgi verilmiştir.Çalışmanın ana bölümünde el-Füsûl'deki asıllar tespit edilmiş ve bu asılların yer aldığı konular örnekleriyle birlikte imkân ölçüsünde özetlenmiştir.Sonuç kısmında ise araştırmada ulaşılan veriler maddeler halinde sıralanmıştır."
