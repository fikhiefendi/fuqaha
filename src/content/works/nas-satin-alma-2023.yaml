abstract: "Tüketim insanoğlunun varoluşundan beri hayatını devam ettirebilmek için gerçekleştirdiği eylemlerden biridir. İlk başlarda yeme-içme, giyinme ve barınma gibi temel ihtiyaçları karşılamak için tüketen birey, zaman içerisinde gelişen imkânlarla ihtiyaçları bunlarla sınırlı kalmamış, psikolojik ve sosyo-kültürel amaçlarla da tüketim yapmaya başlamıştır. Bu gelişmeler toplumda aşırı tüketim atmosferi oluşturarak bireyleri sınırsız ve sorumsuz tüketime yönlendirmiştir. Son dönemlerde tüketim bağımlılığını azaltarak tüketimi sınırlandırmak ve bireylere sakin tüketim alışkanlıkları kazandırmak için çeşitli savlar ve yöntemler oluşturulmuştur.“The Buyerarchy of Needs”grafiği de Sarah Lazarovic tarafından bireylerin satın alma davranışı sergilemeden önce başka alternatiflere yönelebileceğini hatırlatmak amacıyla oluşturulmuştur. Türkçe literatürde Satın Alma Hiyerarşisi olarak kendine yer bulan grafik, bireylerin ihtiyaç duydukları şeyi satın almadan önce sırasıyla sahip olduklarını kullanma, ödünç alma, takas yapma, ikinci el ürünlere yönelme ve kendin yapma seçeneklerini sunmaktadır. İslam dini inananlara dengeli davranmalarını tavsiye etmiş, hayatlarının her anında itidali elden bırakmamalarını öğütlemiş ve bu doğrultuda israfı yasaklamıştır. Nitekim İslam iktisadının temel ilke ve prensiplerinden sayılan toplumda sosyal adalet, yardımlaşma ve dayanışmanın sağlanması israfın bertaraf edilmesi ile gerçekleşecektir. Bu çalışmada tüketim ve israfın kavramsal çerçevesi oluşturulmuş, İslam iktisadında tüketim, ihtiyaç ve israf olguları incelenmiş ve İslam iktisadının bu prensibi doğrultusunda harcamada israfı azaltmanın alternatif bir yöntemi olarak kabul edilebilen Satın Alma Hiyerarşisi incelenmiş ve İslam iktisadındaki yansıması aktarılmıştır. Bu çalışmanın ortaya çıkmasındaki motivasyon bireylerin sınırsız ve sorumsuz tüketim alışkanlıklarının değiştirilmesine yardım etme ümididir. Bilinçli tüketim alışkanlıklarının kazanılmasına imkân sağlayarak toplumsal ve kültürel değerleri bozan ve ekolojik ve ekonomik dengeleri etkileyen israfın azaltılmasına katkıda bulunmak hedeflenmiştir."
