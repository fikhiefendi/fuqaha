abstract: "Bengal bölgesi pek çok âlime ev sahipliği yapmış ve pek çok eserin üretilmiş olduğu bir ilim merkezi olmuştur. Medrese eğitim geleneğine göre yetişen ve bu gelenek çerçevesinde ders veren Muhammed Feyzullah, ömrünün çoğu ilim öğrenme-öğretmeye ve insanlar arasında baş gösteren dinî ve dünyevî sorunları çözmeye adamıştır. 20. yüzyılın önde gelen âlim, fakih ve mutasavvıflarından biri olan Muhammed Feyzullah, çeşitli ilim dallarında eser üretmiş bir Diyûbendi âlimidir. Eğitimine küçük yaşlarda başlamış, muhtelif ilim merkezlerinde dönemin önde gelen âlimlerden ilim tahsil etmiştir. Altmış yılı aşkın eğitim ve öğretim hayatı boyunca dinî-hukukî metinlerin anlaşılması üzerine mesai harcamış, Bangladeş'te ilk olarak yüksek fıkıh araştırmalar merkezi ve fetva kurulu kurmuş, insanlardan gelen sorulara delillerle ayrıntılı olarak cevap vermiş ve fetvaları halkın nezdinde muteber olduğu için Müftü-i Âzam lakabına laik görülmüş olan Muhammed Feyzullah, yaşadığı döneminde baş gösterdiği çeşitli hurafeler, şirk ve bid'ata karşı sert tutumlar sergilemiştir. Bununla ulaşmak istediğimiz amaç, Diyûbend medreselerinin yetiştirdiği büyük âlimlerden birisi olan Muhammed Feyzullah'ın daha iyi tanınmasına hizmet etmek ve Muhammed Feyzullah hakkında yapılacak yeni çalışmalara kapı aralamaktır. Bu amaçla iki bölümden oluşan bu tezin birinci bölümünde, Muhammed Feyzullah'ın hayatı, ilmi kişiliği ve eserlerinden bahsedilmekte; ikinci bölümünde ise, füru fıkha dair düşüncelerine yer verilmiştir."
