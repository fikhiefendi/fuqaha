abstract: "Bu çalışma, Ebû Zeyd ed-Debûsî'ye nispet edilen Te'sîsü'n-nazar adlı eseri muhteva ve yöntem bakımından tahlil etmeyi; eserin Hanefî mezhep içi ihtilafları nasıl kuramsallaştırdığını, klasik kaynaklarla ilişkisini ve Osmanlı hukuk düşüncesine yansımaları gibi etkilemiş olduğu alanları göstermeyi amaçlamaktadır. Araştırma, önce Debûsî'nin hayatına ve ilmî mirasına dair çerçeveyi çizmekte; ardından Te'sîsü'nnazar'ın yazılış gerekçesi, temel kavramsal şeması ve delil kullanımındaki usulî tutumunu ortaya koymaktadır. Çalışmada, eserin fıkıh ve usûl sahasında sunduğu karşılaştırmalı okuma imkânının, mezhep imamları arasındaki nazarî ayrışmaları sistematik bir“asıl–mesele”örgüsü içinde görünür kıldığı gösterilmektedir. Bu örgünün, ibâdât özelinde pek çok bölümde“kaide–tatbik”ilişkisinin somut meseleler üzerinden izahına olanak verdiği örneklerle ortaya konulmaktadır. Metin tahlilinde, Hanefî mezhebinin üç büyük imamı olan İmam Ebû Hanîfe ve onun iki öğrencisi İmam Ebû Yûsuf ve İmam Muhammed arasındaki iç ihtilafları esas alan karşılaştırmalar, eserde yer alan örnek kümeleri üzerinden takip edilmiştir. Meselâ namazın bütünlüğüne ilişkin“fiillerden bir kısmının fesadıyla hurmetin (iftitah tekbiri) fesada uğramayacağı”aslı, namazın sıhhati bağlamındaki yan etkileri açıklayan bir çatı kaide olarak belirginleşmektedir. Bu kaidenin farklı fer'î meselelerde ne tür sonuçlar doğurduğu, tartışmalı örnekler üzerinden serimlenmiştir. Örneğin, çalışma içerisinde teyemmüm, imamet ve hac gibi ibâdât konularında Debûsî'nin delil örgüsünü mukayeseli biçimde irdelemektedir. Teyemmümün“suya fiilî kudret”şartıyla ilişkisi; suyun bulunmasıyla birlikte hükmî taharetin sona ermesi; teyemmümlünün abdestli kimseye imametinin mezheplerce değerlendirilmesi gibi meseleler, rivayetler ve usulî ilkelerle birlikte ele alınmaktadır. Bu bağlamda, zaruret–bedel ilişkisi ve“asıl/bedel”ayrımının hükme etkisi de tartışılmaktadır. Sonuç olarak çalışma, Te'sîsü'n-nazar'ın ilm-i hilâfın sistematikleştirilmesinde ve delillerin kıymetlendirilmesinde oynadığı rolü, eserin iç mantığına sadık bir çözümlemeyle ortaya koymakta, aslî kaynaklardan edinilen bilgilerle karşılaştırılarak ele almaktadır."
