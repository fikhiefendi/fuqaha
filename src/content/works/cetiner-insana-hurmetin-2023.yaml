abstract: "İnsan kerem sıfatına sahip bir şekilde yaratılmış olup diğer canlılardan üstün tutulmuştur. Keramet; din, ırk, mezhep vb. ayrım yapılmaksızın insanın sadece insan olmasından kaynaklanan, or¬tadan kalkması düşünülemeyen ve tüm insanlarda bulunan bir sıfattır. İnsanın kerem sıfatına sahip olması fıkhi hükümlere de yansımıştır. Bu çalışmada insana gösterilen hürmetin fıkıhtaki yansımaları tespit edilmeye çalışılmıştır. Bu çalışma bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, kapsamı, amacı, önemi ve izlenen yöntem anlatılmıştır. Birinci bölümde konu etrafında zikredilen kavramsal çerçeve ve fıkıh usûlü alanında yer alan deliller çerçevesinde konu değerlendirilmiş ve fıkıh usulünün diğer konuları arasında yer alan örnekler anlatılmıştır. İkinci bölümde ibâdât, muâmelat, İslâm ceza hukuku, İslâm miras hukuku ve İslâm aile hukukunda yer alan konu ile ilgili örnekler zikredilmiştir. Üçüncü bölümde ise insana hürmeti ilgilendiren güncel meseleler ele alınmıştır. Sonuç kısmında ise elde edilen verilerin tahlili yapılmıştır."
