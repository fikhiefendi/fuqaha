abstract: "Arap şiiri, İmru'l-Kays (ö. 540 ?), Nabiğa (ö.18/604) gibi Cahiliye dönemi şairlerinden günümüze, Arapça'nın anlam ve kültür zenginliğini yansıtan en önemli argümanlardan biri olmuştur. İslamiyetten sonra da Arap şiiri toplumsal değerini kaybetmemiş, aksine kendi içinde yeni temalar üreterek kendi tekamül sürecini sürdürmüştür. Emevi ve Abbasi dönemi, Arap şiirinde tema ve konu zenginliği bakımından yükseliş dönemidir. Endülüs, Memluklu, Eyyubi, Selçuklu ve Osmanlı dönemlerinde yer yer eski ihtişamını aratacak bir yavaşlama görülse de, modern dönemde Mısır'da Bârûdî (1839-1904), İsmâil Sabri Paşa (1854-1923), Ahmed Şevkī (1868-1932) Hâfız İbrâhim (1871-1932) gibi; Irak'ta Cevahîrî (1899-1997) ve Adnan el-Cezâirî (ö. 1942) gibi büyük şairler yetişmiştir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde Arap şiirinin kavramsal ve tarihi gelişim süreci; mukayeseli Arap şiir çalışmaları literatürüne yer verilecektir. Birinci bölümde Ömer b. Ebî Rabia ve Adnan el-Cezerî'nin hayatı ele alınacak; ikinci bölümde Ömer b. Ebî Rabi'a ve Adnan el-Cezâirî'nin şiirleri, başta“gazel”türü olmak üzere Arap şiirinin gayeleri ve aşkın mevzusu olarak kadın ve erkek imajı açısından değerlendirilecek; üçüncü bölümde her iki şair, şiir dili ve üslûb; şiirlerindeki konu bütünlüğü; şiirin ahengini ilgilendiren vezin kafiye gibi konular bakımından mukayese edilecektir."
