abstract: "Geniş bir coğrafyaya hakim olan Osmanlı Devleti, bu geniş topraklarda uzun bir süre hüküm sürmüştür. Bu süre zarfında farklı farklı milletleri (Türk, Kürt, Boşnak, Çerkez, Laz, Rum, Ermeni vb.) himayesi altında neredeyse sorunsuz bir şekilde idare edebilmeyi başarmıştır. Bu başarının sırrının ne olduğu araştırıldığında ilk olarak karşımıza devletin adaletli bir yönetim anlayışına sahip olması çıkmaktadır. Dünyaya adaletiyle nam salan Osmanlı Devleti bu ünvana layık olacak şekilde adalet sistemine büyük önem vermekteydi. Çalışmamız 3545 Numaralı Çerkeş Şer'iyye Sicili'nin transkripsiyon ve değerlendirilmesini ihtiva etmektedir. Araştırmada kadılık müessesesi, mahkeme görevlileri ve şer'iyye sicilleri hakkında kısa bilgiler verilmiştir. 3545 Numaralı Çerkeş Şer'iyye Sicili toplamda 98 pozdan oluşmaktadır. Hükümlerde bahsedilen konular olarak tereke, nikah akdi, boşanma, vasilik, vekalet, nafaka, alım-satım sayılabilir. Bu çalışmada Çankırı İli Çerkeş İlçesi'nin sosyo-ekonomik yapısı detaylandırılarak gün yüzüne çıkarılmaya çalışılmış ve bundan sonra yapılacak olan araştırmalara da katkı sağlanması amaçlanmıştır."
