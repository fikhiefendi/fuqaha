abstract: "Bu çalışmada, ilk önce Müslümanların toplumsal gelişmesinde din faktörü ve iktisadi durum ele alınmıştır. Daha sonra İslam iktisadının XX. ve XXI. yüzyılın kurumsal şekli olan katılım bankalarının tanımı, temel özellikleri, tarihçesi ve işleyişine değinilmiştir. Çalışmanın aslını oluşturan bölümde ise Türkiye'de 1983 yılından başlayarak,“Özel Finans Kurumları”(ÖFK) olarak kurulan ve 2006 yılında da“Katılım Bankaları”adını alan, özel hedef kitlesi ve müşteri portföyü bulunan katılım bankaları müşterilerinin bankayı tercih etmesinde etkili olan nedenler araştırılmıştır. Araştırma için Van ilinde bulunan 4 katılım bankası müşterileri ile anket yapılmıştır. Müşterilerin demografik ve sosyoekonomik özellikleri ile bankayı tercih etmesinde etkili olan nedenlerin yer aldığı anket, SPSS programı kullanılarak analiz edilmiştir. Çalışmada yer alan demografik ve sosyoekonomik değişkenler ile banka tercih etme değişkenlerinin frekans, varyans ve ki-kare analizleri yapılmıştır."
