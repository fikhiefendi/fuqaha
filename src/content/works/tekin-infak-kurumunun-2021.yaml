abstract: "Gelir ve servet dağılımı adaletsizliğinin günümüzde geldiği seviye, bu adaletsizliğin nedenlerinin daha yüksek sesle sorgulanmasına neden olmuştur. Bu çalışmada, iktisat yazınında bahse konu adaletsizliğin başat faktörlerinden biri olarak öne sürülen kurum ve kurumsallaşma olguları ele alınarak, İslâm dininde öngörülen belli başlı iktisadi kurumlar ve İslâm medeniyetinde bu kapsamda ortaya çıkmış olan pozitif iktisadi kurumlar üzerinde durulacaktır. Bu çerçevede, İslâm dininde, zekât, sadaka ve vakıf gibi hayır ve dayanışma kurumlarının bir nevi çatı kavramı olarak ifade edilen infak kurumunun gelir ve servetin yeniden dağılımındaki rolüne odaklanılmaktadır. Bu amaçla, Türkiye'de infak faaliyetlerinin dijital teknolojilerden de faydalanmak suretiyle şeffaflık, hesap verilebilirlik ve etkinlik prensipleri çerçevesinde kurumsallaşmasına yönelik somut bir model önerisi ortaya konulmakta ve önerilen infak platformu modelinin gelir ve servet dağılımı adaletsizliğini gidermedeki rolü tespit edilmeye çalışılmaktır. Bu amaçla, Python programlama dili ile oluşturulan simülasyon modeli yardımı ile Türkiye'de infak kurumunun potansiyelini gerçekleştirecek şekilde teşekkülü halinde gelir ve servet dağılımı üzerindeki etkileri çeşitli simülasyon deneyleri ile analiz edilmeye çalışılmıştır. Simülasyon sonuçları, Türkiye'de infak kurumunun önerilen model çerçevesinde kurumsal bir nitelik kazanması durumunda gelir ve servet dağılımı adaletsizliğinde yıllara yaygın olarak önemli iyileşmelerin olacağına işaret etmektedir."
