abstract: "Bünyamin Çalık tarafından hazırlanan ?Kadızade Muhammed Arif Efendi'nin ?Bahru'l Fetâvâ? Adlı Eserinin Fetvâ Açısından Değerlendirilmesi? adlı bu tezde İslâm hukukundaki fetva konsepti kapsamında ?nukûllü fetva? türlerinden sayılabilecek bir yazma eseri latinize ederek günümüze kazandırılmıştır. Ayrıca Kadızâde'nin fetvalarından hareketle XVIII. yüzyılın ilk yarısında Osmanlı dönemi Erzurum toplumunda aile, ticaret, arazi, vakıf ve ceza hukuku alanlarında karşılaşılan hukukî sorunları ve çözümleri incelenmiştir. Elde edilen verilerden hareketle bu dönemde İslâm hukukunun nasıl anlaşıldığı, uygulandığı tespit edilemeye çalışılmıştır.Kadızâde'nin fetvalarında Hanefî mezhebine sıkı sıkıya bağlı kalmaya özen gösterdiği anlaşılmaktadır. O, devraldığı zengin hukuk külliyâtı içinde bir meselede farklı görüşlerle karşılaştığında; zayıf da olsa devlet ve toplum maslahatına uygun görüşü tercih etmeye çalıştığı gözlenmiştir. İctihadlar arasından birini tercihte zorlandığı durumlarda fakihleri tasnif ederek maslahata uygun çözümü ortaya koyma yolunu tutmuştur.Kadızâde, Şia'ya yönelik fetvalarında Osmanlı uygulamasını esas almış, Osmanlı sultanlarının Sünnîliğin temsilcisi olduğunu açıkça belirtmiştir. O, fetvalarıyla toplumun Sünnî çizgide kalmasına çaba göstermiştir. Ayrıca başta arazi ve para vakfıyla ilgili olmak üzere pek çok fetvalara da yer vermiştir.Kısaca Kadızâde'nin eser-i mezburu İslâm hukukunda klasiğin dışına çıkmadan yaşadığı dönemin sorunlarına Hanefi fıkhında devlet ve toplum maslahatına uygun pratikleri ortaya koymaya katkı sağladığı söylenebilir."
