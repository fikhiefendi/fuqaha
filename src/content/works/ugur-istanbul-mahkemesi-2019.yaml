abstract: "Osmanlı İmparatorluğu'nun hukuk tarihini belgelemesinin yanı sıra İmparatorluk tarihini her yönüyle aydınlatan şer'iyye sicilleri, oldukça mühim bir kaynak grubunu oluşturmaktadır. Bu tez çalışmasında H. 1204-1205 / M. 1790-1791 yıllarına ait İstanbul Bab Mahkemesi 304 Numaralı Şer'iyye Sicil Defteri incelenmiştir. 70 varaktan meydana gelen bu defter içerisinde 296 hüküm yer almaktadır. Bu defter boşama-boşanma, nafaka, mehir, miras, satış, alacak, sulh, vasi tayini, veraset gibi konuları ihtiva etmektedir. Bu çalışma ile defter içerisindeki tüm hükümler transkript edilmiş ve özetlenmiştir. Defter içerisinde yer alan davalar kayıt altına alındığı dönemin hukuk tarihi, ekonomik tarih, kültürel tarih, şehir tarihi, mimari tarih ve Osmanlı aile yapısı dair önemli bilgiler verirken, müslim ve gayrimüslim halk arasındaki ilişki hakkında fikir sahibi olmamıza olanak sağlamaktadır. İstanbul Bab Mahkemesi 304 No'lu sicil kaydının incelenmesi ile çeşitli disiplinlerin yararlanmasını sağlayacak bir kaynak sunulmaya çalışılmıştır."
