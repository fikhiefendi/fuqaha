abstract: "Bu çalışmada, sahâbe döneminde öne çıkan hukukçu sahâbelerin mirasla ilgili uygulama ve içtihatlarının incelenmesi hedeflenmiştir.Çalışmamız, giriş, dört ana bölüm ve sonuç kısımlarından oluşmaktadır. Birinci bölümde, İslam miras hukuku'nun kaynaklarına, tevdinine ve ilgili ıstılahların açıklamalarına yer verilmiştir.İkinci bölümde, İslâm'ın ortaya çıktığı bölge olan Arap Yarımadası ve çevresinde uygulanmış Roma, Yahudi ve Arap miras hukukları farklı özellikleri öne çıkarılarak özetlenmeye çalışılmıştır. Özet olarak bahsedilen bu hukuk sistemleriyle ilgili bölümlerin sonunda, miras hukukunun genel prensipleri bağlamında İslam miras hukuku ile karşılaştırılmalarına da temas edilmiştir.Üçüncü bölümde, miras hukukunda neyin içtihat neyin nassla belirlenmiş olduğunu daha iyi ayırt edebilmek amacıyla Kur'ân-ı Kerim ve Peygamber (sav)'in uygulamasından hareketle İslâm miras hukuku ortaya konulmaya çalışılmıştır.Çalışmamızın ana kısmını oluşturan dördüncü bölümdeyse, sahâbenin miras hukukuyla ilgili uygulama ve içtihatları incelenmiştir. Çalışmada, özel olarak uygulama ve içtihatları belirtilen sahabeler, Ebû Bekir, Ömer b. Hattab, Zeyd b. Sâbit, Abdullah b. Mes'ûd, Abdullah b. Abbas, Ali b. Ebi Tâlib'dir."
