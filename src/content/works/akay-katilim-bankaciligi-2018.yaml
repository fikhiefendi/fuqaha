abstract: "Bu yüksek lisans tezinde; Türkiye'de bankacılık, kamu bankaları, dünyada ve Türkiye'de katılım bankacılığı, Türkiye'de katılım bankacılığına devlet yatırımları, kamu katılım bankaları konuları ele alınmış olup; katılım bankası çalışanlarına sektör hakkında anket uygulanarak, kamu katılım bankaları hakkında düşünce ve beklentileri test edilmek istenmiştir. Bu çalışmada katılım bankacılığının ülkemizdeki gelişim hızıyla birlikte, kamu sermayeli yatırımların sektöre dahil olmasıyla katılım bankacılığı algısının gelişimi ele alınmıştır. Araştırma sonucunda katılım bankası çalışanlarının, kamu katılım bankalarına bakış açılarının genel olarak benzerlik gösterdiği görülmüştür."
