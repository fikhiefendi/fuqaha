abstract: "Çeşitli fıkhi meseleleri kuşatıcı ve öz bir şekilde kendinde toplayan fıkhi kaideler, genel şer'î metinlere dayanmakta olup hayatın farklı alanlarında olumlu etkiler yaratır. Bu kaideler, anlamlarının açıklığı ve kolay uygulanabilirlikleri bakımından dikkat çeker, aynı zamanda muteber (geçerli) deliller olarak kabul edilir. kavâid-i külliye-i kübrâ, birçok fıkıh dalının temelini oluşturur. Hâkimler ve müftülerin dini hükümleri çıkarmalarında ve yeni ortaya çıkan meselelerin çözülmesinde önemli bir kaynak niteliğini taşır. Bu kaideler, İslam hukuku ışığında çağdaş problemlerin çözümünde önemli etkisi olan dağınık haldeki birçok mesleyi bir arada toplar. Araştırmacı, külli kaidelerin kapsamını inceledi ve zamanla nasıl yenilendiklerini vurgulayarak bu kaidelerin Kur'an, Sünnet ve diğer kaynaklara dayandığını açıkladı. Ayrıca bu kaidelerin toplumsal değerleri güçlendirme ve toplumun istikrarını sağlayabileceği üzerindeki rolüne de değindi. Bu tez, külli kaidelerin sadece fıkhi birer araçtan ibaret olmadığını, aynı zamanda çağın zorlukları karşısında sürekliliğini ve gücünü koruyabilen İslami değerlerin pekiştirilmesinde etkili vasıtalar olduğunu da vurgulamaktadır. Bu bağlamda külli fıkhi kaideler, İslami kimliğini ve özünü muhafaza edebilecek sağlam bir İslami toplumun inşası için temel yapı taşı niteliğindedir."
