abstract: "Ekonomik büyüme ile finans arasındaki ilişki, çoğu tartışma geleneksel finansa dayansa da, ekonomi bilimciler arasında tartışmaya açık bir tartışma konusu olmayı sürdürüyor (King ve Levine, 1993; McKinnon, 1974). Öte yandan geleneksel finansın başarısızlığına dair bazı kanıtlar ve eleştiriler de bulunmaktadır (Issah, 2019). Dolayısıyla bu çalışmanın temel amacı İslami finansın ekonomik büyüme üzerindeki etkisini anaakım iktisat yaklaşımı çerçevesinde incelemektir. Bu çalışma, literatürdeki bu boşluğu doldurmak için, her bir İslami finans bileşeninin (İslami bankalar, İslami sermaye piyasaları ve Tekafül), ekonomik büyüme üzerindeki etkisini geleneksel finansla karşılaştırmalı olarak incelemiştir. Çalışmada, 2017Q1'den 2021Q4'e kadar 21 İİT ülkesini kapsayan çalışma hedeflerine ulaşmak için Genelleştirilmiş Moment Yöntemi (GMM) tekniği uygulanmaktadır. Araştırmanın bulgularına göre İslami finans bileşenleri, özellikle İslami bankalar, İslami sermaye piyasaları ve tekafülün ekonomik büyümeye etkisi geleneksel finansa göre daha güçlü ve daha istikrarlıdır. Sonuçlar tüm bileşenler üzerinde istatistiksel olarak pozitif anlamlılığı doğrulamakla birlikte; geleneksel sigortacılığın ekonomik büyüme üzerindeki etkisi tekafülden daha fazla bulunmuşçtur. Çalışmanın bulguları, tüm finansal kurumların, sanal işlemler (finansallaşma) yerine gerçek işlemler altında faaliyet göstermeyi de içeren İslami finans ilkelerine göre faaliyette bulunması gerektiğini göstermektedir. Son olarak, İslami ve geleneksel finans hakkındaki farkındalığın artması ve bu alandaki bilgi birikimine katkı yapması bu çalışmanın diğer önemli bir katkısıdır."
