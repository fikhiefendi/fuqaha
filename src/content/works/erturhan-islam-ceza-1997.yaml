abstract: "Ceza hukuku, İslâm Hukuku içerisinde önemli bir yer işgal eden İslâm Ceza Hukukunun yanlış veya eksik bilgilenme gibi nedenlerle asıl mahiyetinden değişik bir şekilde algılandığı olmuştur. İslâm kültürünün fazla yaygın olmadığı çevrelerde bu yanlış algılama daha da belirgindir. Bu itibarla İslâm Ceza Hukukunun aslî yönüyle tanıtılması bir zorunluluk arz etmektedir. Bu olgu dikkate alınarak İslâm Ceza Hukukunun insanî yönünün bir bölümünün tanıtılması amacıyla çalışmamızın adı“ İslâm Ceza Hukukunda Şüphe Kavramı ”olarak tesbit edilmiştir.“ Şüpheden sanığın faydalanması”ilkesi İslâm Hukuku'nda yerleşik olan, aynı zamanda İslâm'ın adalet, merhamet ve af yönlerini yansıtan insanî bir ilkedir. Araştırmamız bir giriş ve iki bölümden oluşmaktadır. Çalışma İslâm Ceza Hukuku bağlamında yapıldığından giriş bölümünde İslâm'ın suç kabul ettiği fiiller, suçun genel unsurları ve bu suçlara öngörülen cezalar ana hatlarıyla anlatılmıştır. Birinci bölümde, cezaların düşmesinde müessir olan şüphenin kanunî dayanağı ve uygulama örnekleri ortaya konulmuş buna bağlı olarak her mezhep tarafından değişik isimler altında ele alman şüphe çeşitleri tanıtılmıştır.Bir mukayese imkânı vermesi amacıyla Modern Hukukta şüphe anlayışı da ayrıca verilmeye çalışılmıştır. İkinci bölümde, şüphenin oluşması incelenmiştir.Bu bölüm içerisinde suçun unsurlarında meydana gelen şüpheler, cehaletten kaynaklanan şüpheler ve ispatta meydana gelen şüpheler üzerinde durulmuştur. Daha sonra şüphenin kuvvet dereceleri ve hukukî sonuçlan izah edilmeye çalışılmıştır."
