abstract: "Bu çalışmada siyâset-i şer'iyye mahiyeti ve âlimlerin verdiği tanımlar farklı mezheplere göre tespit ederek değerlendirmeye gayret gösterilmiştir. Çağımızdaki muhtemel uygulanma alanlarının detaylıca incelenmiştir. Tez, giriş ve sonuç kısımıyla birlikte üç bölümden oluşturmaktadır. Tezin giriş kısmı konunun amacı, önemi, sınırlandırılması, sunulması ve kaynak değerlendirilmesini içermektedir. Birinci bölümde, siyâset-i şer'iyye kavramına genel bir bakış ele alınmıştır. Bu bölümde klasik ve modern fukaha'nın verdiği siyaset-i şer'iyye kavramının tanımlamaları sunulmuştur. Bu bölümde de Hz. Peygamberin siyaset olarak yaptığı işlerin örnekleri tespit edilmştir. Siyâset-i şer'iyye'ye dayandığı kaynakları incelenmiştir. Siyâset-i şer'iyye uygulanabilmek için alimerin koyduğu şartlar olması gerekmektedir. İkinci bölümde ise, siyâset-i şer'iyye ve modern siyaseti arasında mukayeseli yapılmıştır. Bu bölümde siyâset-i şer'yye'nin ve modern siyaseti özellikleri değerlendirmeye çalışılmıştır. Üçüncü bölümde ise, günümüzde siyâset-i şer'iyye'nin uygulanma alanları ele alınmıştır. Bu bölümde genel yönetim veya idâre, devletler arası ilişkiler, yargı sistemi ve iktisadi /ekonomik alanlarını kapsamaktadır."
