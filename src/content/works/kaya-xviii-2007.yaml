abstract: "nsanoglunun toplumsal yasamda borç alma ihtiyacı duydugu bilinen bir gerçektir. Bu durum tarihin hemen her devrinde borç vererek faiz geliri elde etmegi meslek edinen sahıs veya kurumların ortaya çıkmasına sebebiyet vermistir. Ancak ilahi dinlerin tamamında faiz yasak kılınmıstır. slam'a baglı kalmayı kendilerine siar edinmis Osmanlı ulemasının da faizi açık ve kesin ifadelerle yasakladıkları görülür. Buna mukabil toplumun borç alma ihtiyacını karsılamak üzere bazı hile-i seri`yyelere ulema tarafından cevaz verildigi müsahede edilir. 18. yüzyıl söz konusu oldugunda muamele-i seri`yye ve bey bi'l-istiglâl en çok uygulanan hile-i seri`yyelerdir. Bu islemlerle A'dan Z'ye her sahıs ve kurum, verdikleri borç karsılıgında %15'i geçmemek sartıyla artı bir gelir elde edebilirdi. Verilen borç karsılıgında artı bir fazlalık alma, sömürü aracı olarak dönüsmeye yatkındır. Bu noktada ulemanın, muamele-i seri`yye, bey bi'listiglâl vb. islemleri hem sömürü aracına dönüsmesini engelleyecek sekilde düzenledi hem de denetim altında tuttugu görülür. Temel islevi devlet maliyesi ve askeri zümrenin kredi ihtiyacını karsılamak olan sarrafların sair kurum ve sahıslara da borç verdigi görülür. Vakıfların borç verdigi kimseler ise daha ziyade esnaf ve hane halklarıdır."
