abstract: "?İslâm Ceza Hukukunda Şüphe Kavramı ve Cezalara Etkisi? adlı tez çalışmamızda, İslâm Hukukunda şüphenin cezaları düşürmedeki etkisi incelenmiştir. Bu çerçevede çalışmamız bir giriş üç bölüm olmak üzere dört bölümden oluşmuştur:Giriş bölümünde, İslâm Ceza Hukukunun iki temel kavramı olan suç ve ceza kavramları kısaca anlatılmıştır. İkinci bölümde ise, şüphe kavramının tanımı, şüphe benzeri kavramlar, suç fiillerini ispattaki etkisi genel hatlarıyla anlatılmıştır. Ayrıca bu bölümde suçun unsurları ile şüphe kavramının suçun unsurları arasındaki yeri de anlatılmıştır.Üçüncü bölümde; şüphenin mahiyeti, çeşitleri, bunların kendi arasındaki kısımları, mezheplerin görüş farklılıkları da göz önünde bulundurularak örneklerle anlatılmıştır.Dördüncü bölümde ise; özel ceza hükümleri açısından şüphenin cezaya etkisi; özellikle hadd, kısas, müessir fiiller ve ta'zir cezalarını gerektiren suçları ele alarak konunun mahiyetini anlatır bir şekilde örnekler verilerek anlatılmıştır.Sonuç olarak, çalışmamızda Medeni Hukukta ?Şüpheden sanık faydalanır? şeklinde ifade edilen prensibin, İslâm Ceza Hukuku'nda da ?Cezaları şüphelerle kaldırınız? temel prensibiyle gündeme gelen temel kaidenin, İslâm Ceza Hukuku'nda özellikle telafisi mümkün olmayan, hadd ve kısas gibi cezaların düşürülmesinde ne kadar önemli ve etkili olduğu gerçeği dile getirilmeye çalışılmıştır."
