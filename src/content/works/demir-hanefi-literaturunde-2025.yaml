abstract: "İslam hukuk düşüncesinin gelişimiyle birlikte, hicrî 2. yüzyıldan itibaren fıkıh alanında birçok eser kaleme alınmıştır. Bu eserlerden bir kısmı ayrıntılı ve geniş hacimli, bir kısmı ise özlü ve sistematik yapısıyla dikkat çeken muhtasar türünde yazılmıştır. Fıkhî bilgileri delillere yer vermeksizin özet bir şekilde sunan ve genellikle eğitim amaçlı kullanılan bu metinlerin ilk örneklerini Hanefî fakihleri telif etmişlerdir. Hanefî mezhebi literatüründe büyük öneme sahip olan ve“Mütûn-i Erbaa”olarak bilinen dört temel eser, bu geleneğin en güçlü halkalarını oluşturmaktadır. Bu tezde, söz konusu dört temel metinden biri olan ve Hanefî fakihlerinden İbnü's-Sââtî (ö. 694/1295) tarafından kaleme alınan Mecmau'l-bahreyn ve mülteka'n-neyyireyn adlı eser merkeze alınmıştır. İbnü's-Sââtî bu eserinde, daha önce yazılmış önemli bir muhtasar olan Kudûrî'nin (ö.428/1036) Muhtasar'ı ile Nesefî'nin (ö.537/1143) Manzûme'sini bir araya getirmiştir. Meselelerin özgün bir biçimde ele alındığı eserde her bir âlimin görüşü farklı bir cümle kalıbı ile aktarılmış, görüş sahiplerine rumuzlarla işaret edilmiş, konular sistematik bir şekilde ele alınmıştır. Ancak eserin üslubu son derece veciz olup, anlaşılması belirli düzeyde fıkıh ve dil bilgisine sahip olmayı gerektirmektedir. Muhtasar eserler yalnızca öğretici ve özetleyici metinler değildir; aynı zamanda mezhep içi tercihleri belirginleştiren, normatif sınırları çizen ve fıkhî otoriteyi temsil eden temel kaynaklardır. Mecmau'l-bahreyn, bu yönleriyle klasik muhtasar geleneğinin devamı ve özgün bir örneği olarak öne çıkmaktadır. Bu çalışma, hem Hanefî muhtasar geleneğini hem de bu geleneğin özgün bir örneği olan Mecmau'l-bahreyn'i daha yakından tanımayı ve ilim tarihindeki yerini ortaya koymayı amaçlamaktadır. Literatür taramasına dayalı tarihsel-doküman analiz tekniğiyle hazırlanan bu çalışmanın birinci bölümünde, muhtasar eserlerin tanımı, tarihî gelişimi ve Hanefî literatüründeki yeri ele alınmıştır. İkinci bölümde, İbnü's-Sââtî'nin yaşadığı ilmî-sosyal çevre, hayatı, hocaları, öğrencileri, ilmî kişiliği ve eserleri hakkında bilgi verilmiştir. Üçüncü bölümde ise Mecmau'l-bahreyn adlı eserin içeriği, sistematiği, metodu, dili ve üslubu detaylı biçimde değerlendirilmiş; kullandığı kaynaklar ve mezhep içindeki yeri tespit edilmiştir."
