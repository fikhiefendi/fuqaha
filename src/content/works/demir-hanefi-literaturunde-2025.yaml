title: "Hanefî Literatüründe Muhtasar Geleneği ve Ibnü's-Sââtî'nin Mecmau'l-Bahreyn ve Mülteka'n-Neyyireyn Adlı Eserinin Değerlendirilmesi"
titleTranslation: {"en": "The tradition of Mukhtasar works in Hanafi literature and an evaluation of Ibn al-Saati's works Majmaʿ al-Bahrayn and Multaqa al-Nayyirayan"}
