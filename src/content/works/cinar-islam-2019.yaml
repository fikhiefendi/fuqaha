abstract: "Bu çalışmada, İbn Kayyim'in (ö. 751/1350) İslam aile hukuku alanındaki görüşleri ele alınmıştır. Üç ana başlıktan oluşan çalışmanın ilk bölümünde onun hayatı ve ilmî kişiliğini tanıtmaya dönük özlü bilgiler verilmiştir. İkinci bölümde görüşleri diğer âlimlerle mukayeseli bir şekilde değerlendirilmiştir. Bu çerçevede nişanlanma, evlilik, akdin rükûnları-şartları ve bunların fıkhî sonuçları izah edilmiştir. Evlilik cihetinden bakıldığı takdirde İbn Kayyim, nikâh akdinin gerçekleşmesinde kolaylaştırıcı bir anlayış benimsemiştir. Onun îcâb ve kabûl için kullanılacak Arapça nikâh ve tezvîc kavramları yanında diğer dillerdeki lafızların da geçerli olduğunu söylemesi bunun açık bir tezahürüdür. Üçüncü bölümde boşama ve onunla doğrudan ilişkili konular incelenmiştir. Onun bu bağlamda çerçeveyi oldukça daraltarak talâkın cari olmasına sebebiyet veren nedenleri azalttığı tespit edilmiştir. Bidʻî talâkın geçersiz, üç talâkın ise bir boşama şeklinde geçerli olacağını ifade etmesi; sarhoş ve zor altında olan şahsın talâkını boşama niyeti bulunmadığı için muteber görmemesi bu anlayışının bir yansımasıdır. İbn Kayyim, yer yer Ahmed b. Hanbel (ö. 241/855) ve İbn Teymiyye'ye (ö. 728/1328) muhalefet etmiş olsa da çoğunlukla onlara muvafık kalmıştır. Onun, toplumun sorunlarına başarılı çözüm önerileri getirmesi fetvalarının hüsnü kabul görmesinde etkili olmuştur. Bunda engin ilmî, diyalektik ve objektif metodu ve ictihad ameliyesini etkin bir şekilde işletmesinin rolü büyüktür. Böylece hayattayken yaygınlık kazanan şöhreti giderek artmıştır. Nihayet görüşleri yakın ve muasır dönem âlimler için referans olmuştur."
