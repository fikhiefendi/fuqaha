abstract: "Bankacılık sektöründe türev ürün kullanımı, özellikle son yıllarda ciddi bir artış göstermektedir. 2008 Küresel Finans Krizi ve sonrasında yaşanan gelişmeler, türev ürün kullanımında en önemli gerekçenin riskten korunmak olmadığını, spekülasyon amacıyla türev ürün kullanımının giderek daha da yaygınlaştığını göstermektedir. Bu çalışmada, geleneksel bankacılıkta yoğun bir şekilde kullanılan türev ürünlerin katılım bankacılığı açısından değerlendirilmesi yapılmıştır. Bankacılığın ve katılım bankacılığının doğuşuna ve gelişimine değinilerek, her iki alanda yer alan ve her iki alana özgü kavramlar açıklanmaya çalışılmıştır. Finansal piyasalarda yer alan dört ana türev ürünün; forward, futures, swap ve opsiyon sözleşmelerin açıklamaları yapılarak, bu dört türev ürüne özgü kavramlara ve özelliklere değinilmiştir. Türk Bankacılık Sektörü açısından türev ürün kullanımının yıllara göre değişimi ve bu değişime ilişkin grafiklere yer verilmiştir. Çalışmanın son bölümünde ise, türev ürünlerin katılım bankacılığı açısından değerlendirilmesi yapılmıştır. Türev ürünlerle ilgili katılım bankacılığında genel yaklaşım değerlendirilmiş ve katılım bankacılığı alanında türev ürünlere ilişkin genel fıkhî değerlendirmelere yer verilmiştir. Katılım bankacılığı alanında, forward, futures, swap ve opsiyonlarla ilgili yapılmış olan fıkhî değerlendirmelere son bölümde ayrı ayrı yer verilerek konu detaylı olarak aktarılmaya çalışılmıştır. Çalışmanın sonunda ise, Türkiye'de faaliyette bulunan katılım bankalarının yapmış oldukları türev ürünlerin yıllara göre gelişimi grafikler yardımıyla açıklanmaya çalışılmıştır."
