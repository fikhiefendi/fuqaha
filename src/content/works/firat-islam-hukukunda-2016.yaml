abstract: "İslam hukuku kulun Allah'ın emrettiği bir hayatı yaşamasının yoludur. İslam hukukunun temel dinamiklerinden biri tüm zaman ve mekânlara şamil oluşudur. İşte bu şumuliyetin gerçekleşmesinde ve İslam hukukunun dinamik yapısını korumasında en önemli etkenlerden biride hiç şüphesiz kuralları arasında kıyas yapılabilinmesi özelliğidir. Kıyas biri illet biri de hikmet temelli olmak üzere iki şekilde değerlendirilir. Âlimler tarafından genel olarak kabul gören hükümlerin illet eksenli temellendirilmesi iken, hikmet eksenli temellendirilme de bazı usûl âlimi tarafından kabul edilmiştir. Hükümlerin hikmete göre ta'lîl edilmesi mevzusu İslam hukukçuları arasında tartışma konusu olsa da, uygulama alanında birçok hükmün hikmete göre ta'lîl edilerek hüküm verildiği aşikârdır. Bu durumda hikmet ile ta'lîli İslam hukuk metodolojisinde bir yöntem olarak kabul etmek gerekmektedir."
