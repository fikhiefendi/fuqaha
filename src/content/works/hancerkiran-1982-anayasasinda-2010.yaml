abstract: "Suçsuzluk karinesi suç ile itham edilen kişinin, bir mahkeme hükmü ile itham edildiği suçu işlediği hukuka uygun delillerle adil bir şekilde yapılan yargılama neticesinde sabit kabul edilinceye kadar kişinin suçsuz kabul edilmesidir. Bu ilke birçok milletlerarası sözleşmede de ifade edilmiştir. Bu kapsamda ilkenin Evrensel İnsan Hakları Bildirisinde ve Avrupa İnsan Hakları Sözleşmesinde de yer aldığı görülmektedir. İlke Avrupa İnsan Hakları Mahkemesince adil yargılanma hakkı içerisinde, bu hakkın bir unsuru olarak değerlendirilmektedir. Suçsuzluk karinesi düzenlemesi hukukumuzda açık olarak ilk kez 1982 tarihli Anayasada yer almıştır. Bu düzenleme öncesinde İslam hukukundan kaynaklı olarak ilkenin hukuk uygulamamızda olduğu iddia edilmiş ise de, yazılı kural olarak ilkenin 1982 tarihli Anayasadan önce bulunmadığı görülmektedir. Suçsuzluk karinesi fonksiyonu itibariyle suskun kalma hakkı, ispat, şüpheden sanığın faydalanmasına ilişkin evrensel hale gelmiş ceza muhakemesi müesseseleri ile de çok yakından ilgilidir. Suçsuzluk karinesi tüm kişi ve kurumların saygı göstermesi gereken bir haktır. Basın ve yayın organları soruşturma ve ceza muhakemesine ilişkin haber ve yorum hak ve özgürlüğüne sahiptir ancak bu özgürlüğün kullanılmasında, basın yayın kuruluşları da soruşturulan ya da kovuşturulan kişilerin suçsuzluk karinesinden kaynaklanan lekelenmeme hakkına özen göstermek ve bu hakka uygun davranmak zorundadırlar. Türk Ceza Kanununda suçsuzluk karinesinden kaynaklanan kişisel hakkın korunması amacıyla, bu hakkın ihlaline havi eylemler suç olarak düzenlenmek suretiyle karineden kaynaklanan hak koruma altına alınmıştır. Anayasa Mahkemesi ve Yargıtay'ın da karineyi dikkate alarak bazı durumlarda değerlendirme yaptıkları görülmektedir. Ancak bu değerlendirmelerin Avrupa İnsan Hakları Mahkemesinin yaptığı derinlikte ve genişlikte olmadığı görülmektedir. 1982 tarihli Anayasanın 90. maddesi uyarınca milletlerarası sözleşmelerin doğrudan uygulanma olanağı getirildiğinden ve AİHS'si de bu kapsamda bir sözleşme olduğundan, ayrıca Ülkemizce AİHM'nin yargılama yetkisi kabul edilmiş olduğundan, karine ile ilgili uygulama, yorum ve değerlendirmelerde milli soruşturma ve yargılama makamlarının AİHM'nin içtihatlarını gözetmeleri gerekmektedir."
