abstract: "Bu çalışma, Anglo-Amerikan hukuk geleneğinde ortaya çıkan escrow sözleşmesini İslam hukuku açısından incelemeyi ve katılım bankacılığı sektöründeki uygulanabilirliğini değerlendirmeyi amaçlamaktadır. Türkçe akademik literatürde escrow sözleşmesini İslam hukuku perspektifinden ele alan kapsamlı çalışmaların sınırlı olması, araştırmanın hareket noktasını oluşturmaktadır. Araştırmada nitel araştırma yöntemi benimsenmiş; temelde klasik Hanefi fıkıh literatürü, modern Türk hukuku doktrini, AAOIFI standartları ve katılım bankacılığı uygulamaları doküman incelemesi ve karşılaştırmalı analiz yöntemiyle değerlendirilmiştir. Çalışma sonucunda, escrow sözleşmesinin klasik fıkıh literatüründeki herhangi bir akitle birebir özdeşleştirilemeyeceği, ancak işlevsel açıdan en yakın kurumun yed-i adl olduğu sonucuna ulaşılmıştır. Ayrıca Anglosakson hukukundaki bazı mülkiyet ve güven ilişkilerinin Kıta Avrupası hukukuna kıyasla İslam hukukuyla daha güçlü yapısal benzerlikler taşıdığı tespit edilmiştir. Escrow sözleşmesinin faiz yasağı, garar ve mülkiyetin intikaline ilişkin bazı fıkhî değerlendirmeleri gerektirmekle birlikte, uygun sözleşme kurgusu ve şer'î ilkelere uygun uygulama esasları çerçevesinde katılım bankacılığı bünyesinde kullanılabileceği değerlendirilmiştir. Murabaha, sukuk ve yatırım vekaleti gibi katılım bankacılığı ürünlerinde escrow benzeri mekanizmaların işlevsel olarak yer aldığı; Türkiye'deki Güvenli Ödeme Sistemi'nin de bu yapının günümüzdeki kurumsal örneklerinden biri olduğu görülmüştür. Sonuç olarak escrow sözleşmesinin İslam hukukunun temel ilkeleriyle bağdaşabilecek nitelikte olduğu ve katılım bankacılığı uygulamalarında değerlendirilebilecek bir güven mekanizması sunduğu kanaatine ulaşılmıştır."
