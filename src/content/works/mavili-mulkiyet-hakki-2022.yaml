fullText: "https://tez.yok.gov.tr/UlusalTezMerkezi/TezGoster?key=CG8WvdvvxJP04Unr7Yecf9-RjxAWDAi-R4riZ9OQ02xKIdfgM1ckwdU7z9D-WMbH"
abstract: "Devletler, gümrük kaçakçılığı suçu ile mücadele kapsamında önleyici ve cezalandırıcı birçok idari ve adli düzenlemeler yapmakta, yine bu çerçevede kaçak eşyaya elkonulması, kaçak eşyanın naklinde kullanılan taşıma aracının alıkonulması, kaçak eşyanın tasfiyesi ve müsaderesi gibi tedbir ve yaptırımlara başvurmaktadırlar. Ceza Hukuku'nun da konusu olan söz konusu tedbir ve yaptırımlar, 1982 Anayasası ile Avrupa İnsan Hakları Sözleşmesi tarafından müştereken koruma altına alınan temel hak ve özgürlüklerden birisi durumundaki mülkiyet hakkının kullanımını sınırlandırmaktadırlar. Suç ile mücadeleye yönelik olarak kamu makamlarınca uygulanan tedbir ve yaptırımlar neticesinde, mülkiyet hakkına müdahale edilen kişilerce Anayasa'ya ve AİHS'ne aykırı davranıldığı ve mülkiyet hakkının ihlal edildiği iddiası ile bireysel başvuru yoluna gidilebilmektedir1. Çalışmanın ilk bölümünün birinci kısmında gümrük kaçakçılığı suçunun tanımı yapılmaya çalışılacak, ikinci kısımda ise ayrıca elkoyma, taşıma aracının alıkonulması, tasfiye ve müsadere tedbir ve yaptırımları açıklanacaktır. Ayrıca gümrük personeline tanınan ve yine bir koruma tedbiri niteliğinde olan arama işlemine de yer verilecektir. Dinamik bir yapıya sahip olan gümrük kaçakçılığı suçu, ekonomik nitelikte bir suçtur. Suçun eşya ile ilgili olması ve parasal bir değer ifade etmesi, suçu şiddet içermeyen ekonomik bir suç haline getirmektedir. Gümrük kaçakçılığı suçu, dış ticarete konu olan her türlü eşya ile ilgili olarak gümrük idaresinin yanıltılması veya eşyanın hiç beyan edilmeksizin gümrük idaresinden gizlenmesi suretiyle tarife ve tarife dışı önlemlerden kaçınmaya yönelik fiil ve hareketlerdir. Suçun konusu, ticarete konu olan herhangi bir eşyadır. Çalışmada gümrük kaçakçılığının kavramsal tanımının yapılması amaçlanmaktadır. Ayrıca, vergi kaçırmaya ya da vergi dışı diğer önlemleri aşmaya yönelik fiillerin kabahat yahut suç olarak tasnifinin ne şekilde yapılması gerektiği belirlenmeye çalışılacaktır. Gümrük kaçakçılığı suçu söz konusu olduğunda özel hayata müdahale niteliği taşıyan“arama”tedbiri de ayrı bir önem kazanmaktadır. 21.03.2007 tarihli ve 5607 sayılı Kaçakçılıkla Mücadele Kanunu'nda2 gümrük personeline arama konusunda geniş bir yetki tanınmış ve kaçak eşya, her türlü silah ve uyuşturucu madde bulunduğundan şüphe edilen kap, ambalaj veya taşıma aracı ile kişilerin üzerinde arama yapılabileceği hüküm altına alınmıştır. 5607 sayılı Kanun uyarınca arama tedbiri, 04.12.2004 tarihli ve 5271 sayılı Ceza Muhakemesi Kanunu3 hükümlerine istinaden yürütülecektir (5607 s. Kanun, m.9/1). Elkoyma, 5271 sayılı Kanun'un 116 vd. maddelerinde arama tedbiri ile birlikte düzenlenmiş geçici nitelikte bir tedbir iken müsadere, 26.09.2004 tarihli ve 5237 sayılı Türk Ceza Kanunu'nun4 54 ve 55 inci maddelerinde bir güvenlik tedbiri olarak düzenlenmiştir. 5607 sayılı Kanun, gümrük kaçakçılığı suçu şüphesine istinaden uygulanacak elkoyma tedbirinin 5271 sayılı Kanun hükümleri (5607 s. Kanun, m.9/1) ve müsaderenin 5237 sayılı Kanun hükümleri uyarınca uygulanacağını hüküm altına almıştır (5607 s. Kanun, m.13). Çalışmada gümrük kaçakçılığı suçları kapsamında uygulanan tedbir ve yaptırımlar örnek yargı kararları eşliğinde açıklanacaktır. Çalışmanın ikinci bölümünün birinci kısmında mülkiyet hakkının kavramsal tanımı yapılacak ve Anayasa'da ve Avrupa İnsan Hakları Sözleşmesi'nde düzenlenişi ele alınacaktır. İkinci kısımda gümrük kaçakçılığı suçlarına istinaden uygulanan tedbir ve yaptırımlara ilişkin mülkiyet hakkı ihlaline yol açtığı iddiası ile yapılan bireysel başvurulara dair Anayasa Mahkemesi ve Avrupa İnsan Hakları Mahkemesi'nin örnek kararları irdelenecektir. 1982 Anayasası'nın 35 inci ve Avrupa İnsan Hakları Sözleşmesi'nin Ek (1) no.lu Protokol'ünün 1 inci maddeleri ile müştereken koruma altına alınan mülkiyet hakkı, malik ile sahip olduğu şey arasındaki bağdır5 . Mülkiyet hakkı, hukuk düzeni sınırları içerisinde kalmak şartıyla malike eşyasını dilediği gibi kullanma, ondan dilediği gibi yararlanma ve üzerinde dilediği gibi tasarrufta bulunma yetkisini vermektedir6 . Mülkiyet hakkı, 1982 Anayasası'nda ve AİHS'de benzer şekilde düzenlenmiş ve normatif yapısı gereği hak üç sütun üzerine kurulmuştur; 1- Mülkiyete saygı ilkesi, 2- Mülkiyetten yoksun bırakma ve 3- Mülkiyetin kontrolü. Anayasa'nın ve Sözleşme'nin birinci cümlelerinde yer verilen mülkiyete saygı ilkesi, herkesin mülkiyet hakkına sahip olduğunu ve malikin eşyası üzerinde sahip olduğu mülkiyet hakkına devlet ve diğer herkes tarafından saygı gösterilmesini ifade etmektedir. Bu kural ile mülkiyet hakkı güvence altına alınmıştır7 . Anayasa'nın ve Sözleşme'nin ikinci cümlelerinde bahsedilen mülkiyetten yoksun bırakma, malikin eşyası üzerindeki mülkiyet hakkından kesin bir şekilde ve herhangi bir süreye tabi olmaksızın mahrum bırakılması anlamında kullanılmaktadır8 . Anayasa'nın ve Sözleşme'nin üçüncü cümlelerinde bahsedilen mülkiyetin kullanımının kontrolü, malik için mülkiyet hakkının kullanımını ortadan kaldırmamak şartıyla sınırlayan her türlü işlemi içermektedir9. Çalışmada, mülkiyet hakkına yapılan müdahaleler üzerine yapılan bireysel başvurular sonucunda verilen örnek kararlar incelemek suretiyle üç ilkenin anlam ve sınırlarına dair tespitlerde bulunulması amaçlanmaktadır. Mülkiyet hakkına müdahale edilen herkes, hakkın ihlal edildiği iddiası ile bireysel başvuru yoluna başvurabilmektedirler. Bireysel başvuruya ilişkin yapılan idari ön inceleme neticesinde başvurunun komisyona havalesine karar verilmesi halinde, başvuru kabul edilebilirlik incelemesine tabi tutulmakta ve bu aşamada başvurucunun bireysel başvuru yoluna gidebilme yetisine sahip olup olmadığı, bireysel başvurunun ikincil bir yol olduğu kuralına uyulup uyulmadığı ile başvuru hakkının kötüye kullanılıp kullanılmadığı denetlenmektedir. Bireysel başvurunun kabul edilebilir olduğuna karar verildikten sonra başvurunun esastan incelenmesine geçilmektedir. Bu aşamada cevap aranan sorular şu şekilde belirtilebilir: 1- Anayasa ve Sözleşme uyarınca tanınan bir mülk varlığı söz konusu mudur? 2- Mülkiyet hakkına müdahale edilmiş midir? 3- Müdahale hangi kural kapsamında değerlendirilmelidir? 4- Müdahale hukukilik/kanunilik ilkesine uygun mudur? 5- Müdahale kamu yararı amacına yönelik midir? 6- Müdahale ölçülü müdür?10 Mülkün varlığının tespitinde başvuruya konu olayda başvurucunun 1982 Anayasası ve AİHS tarafından korunan mülkiyet hakkı kapsamında bir mülkünün olup olmadığı araştırılmaktadır. Anayasa ve AİHS tarafından koruma altına alınan mülkiyet hakkı mevcut olan mal, mülk ve varlıkları kapsamaktadır. Bunun istisnaları ise belli hallerde bir“ekonomik değer”veya icrası olanaklı olan“alacağı”elde etmeye yönelik meşru beklentilerdir11. Mülkün varlığının tespitinden sonra müdahalenin varlığı ve türü incelenmektedir. Müdahalenin varlığının tespiti ile müdahalenin mülkiyete saygı ilkesi, mülkiyetten yoksun bırakma ve mülkiyetin kontrolü kurallarından hangisi kapsamında ele alınacağı belirlenmektedir. Müdahalenin ihlal oluşturup oluşturmadığı sırasıyla üç ölçüt kapsamında teste tabi tutulmaktadır; 1- Hukukilik/Kanunilik İlkesi, 2- Meşru Amaç İlkesi ve 3- Ölçülülük İlkesi. Mülkiyet hakkına yapılan müdahalenin ihlale neden oluşturmaması mutlak olarak hukukilik/kanunilik ilkesine riayet edilmesine bağlıdır12. Anayasa Mahkemesi, mülkiyet hakkına müdahalenin mutlak surette bir kanuna dayandırılmış olmasını aramakta iken Avrupa İnsan Hakları Mahkemesi kanuni düzenleme ile birlikte içtihat haline gelmiş yargı kararlarının da mülkiyet hakkının sınırlandırılmasında müdahaleye dayanak oluşturabileceğini kabul etmektedir. Mülkiyet hakkına yönelik müdahaleler meşru amaç ilkesine uygun şekilde gerçekleştirilmelidir. 1982 Anayasası'nda ve AİHS'de müdahalenin meşru amacı kamu yararının sağlanması olarak belirtilmiştir. Bu sebeple mülkiyet hakkına yönelik müdahalelerin kamu yararı amacı dışında herhangi bir saik ile gerçekleştirilmesi söz konusu değildir13 . Ölçülülük ilkesi uyarınca mülkiyet hakkına yönelik müdahalenin kabul edilebilir olması müdahalenin kamu yararı amacını gütmesinin yanında ayrıca kamu yararının gereklilikleri ile bireyin temel hak ve özgürlüklerinin korunmasına yönelik menfaati arasındaki adil dengenin sağlanmasına bağlıdır14 . Ölçülülük ilkesi“elverişlilik”,“gereklilik”ve“orantılılık”olmak üzere üç alt ilkeden oluşmaktadır.“Elverişlilik”müdahalenin ulaşılmak istenilen amacı gerçekleştirmeye müsait olmasını,“gereklilik”müdahalenin zorunlu olmasını ve“orantılılık”müdahale ile bireyin menfaati ve kamu yararı arasında adil bir dengenin gözetilmesi gerekliliğini ifade etmektedir15 . Gümrük kaçakçılığı suçlarına istinaden mülkiyet hakkına yapılan müdahalelerde birey aleyhine olacak şekilde orantısız bir külfet yüklendiğinin tespiti mülkiyet hakkının ihlali kararının verilmesine neden olmaktadır. Çalışmada gümrük kaçakçılığı suçlarına ilişkin uygulanan tedbir ve yaptırımlar neticesinde ihlal iddiası ile yapılan başvurulara istinaden Anayasa Mahkemesi ve Avrupa İnsan Hakları Mahkemesi tarafından müdahalelerin ilkeler ışığında değerlendirilmesi irdelenecek ve ihlallerinin engellenmesine yönelik çözüm önerilerinde bulunulacaktır."
