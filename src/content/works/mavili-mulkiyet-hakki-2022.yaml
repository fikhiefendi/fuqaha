title: "Mülkiyet Hakkı Bağlamında Gümrük Kaçakçılığı Suçlarına Uygulanan Tedbir ve Yaptırımlar"
titleTranslation: {"en": "Measures and sanctions applied to crimes of customs smuggling within the context of the right to property"}
