abstract: "Çalışmamızda, Kur'an ayetlerinin fiilen yaşanan olaylara indirgenme kurallarının nasıl oluştuğunu incelenmekte ve ibadetler, eşler ve toplum gibi çeşitli konularda Kur'an'ı Kerim'den alınan bazı fıkıh hükümlerinin şekillendirme uygulamaları sunulmaktadır. Konunun önemi, ayetlerin gerçekle bağdaştırılma usul ve kuralları tespit edilerek ve ihtiyaç duyulan fıkıh hükümlerinden Kur'an ayetlerinden çıkarılma ilkeleri bilinerek, yeni ortaya çıkan konu ve meselelerde yaşanan gerçekliğin Kur'an'ı Kerim ayetlerine bağlanmasına ve Kur'an'ı Kerim ayetlerinin sapkınların ve heves düşkünlerinin saptırmalarından korunmasına şiddetle ihtiyaç duyulmasında gizlidir. Çalışmamız, giriş, üç farklı konu ve sonuç bölümünden oluşmaktadır; Araştırmacı giriş bölümünde kuralları tanıtmış önemini ele almış ayetlerin fiilen yaşanan olaylara indirgenme kavramını. Ardından birinci bölümde fıkıh bölümlerinden hüküm çıkaranların uygulaması gereken ve Kur'an'ı Kerim'le fiilen yaşanan olayları bağdaştırmaya yönelik kuralları ele almıştır. Sonrasında ikinci bölümde Kur'an ayetlerinden çıkarılan fıkıh hükümlerinin anlaşılmasının şekillendirme ilkeleri, Ardından üçüncü bölümde, fıkıh hükümlerinin doğrulanması amacıyla konuya örnek getirmek adına modern dönemde günümüz alimlerinin çeşitli hükümler verdikleri ibadetler, eşler ve toplum gibi çeşitli konulara ışık tutulmuştur; İndirgeme konusu, kıyas ve temsil yoluyla görüş bildirme kabilinden sayılmaktadır. Eğer bu görüş eleştirilen bir görüş ise yapılan indirgeme de eleştirilir. Eğer iii eleştirilmiyorsa belirli kurallara sahip demektir. İslam hukukunun temel metinleri insanların yaşam ve geleneklerine hakim olmak ve bunları süzmek ve doğrulamak üzere gelmiştir. Bir müçtehidin çevresi ve toplumundaki gelenekleri dikkate alması, metinlerin genelliğini ve değişken çevrelerin geleceklerinin göreceliğini inkar ettiği anlamına gelmemektedir."
