abstract: "Erken dönemlerden itibaren Müslümanlar, ekonomi pratiğinin olası tıkanıklıklarına karşı önlem almaya çalışmışlardır. Bunun bir neticesi olarak birtakım malî hîle-i şer'iyye uygulamaları üretilmek suretiyle bu tıkanıklık hukuk sınırları içerisinde giderilmeye çalışılmıştır. Bugün ortaya çıkan veya çıkacak olan yeni faizsiz finansman sistemleri, geçmişte üretilen enstrümanlardan en azından ilkesel olarak istifade etmelidir. Bu varsayımdan hareketle, Türkiye'deki faizsiz konut finansman sistemlerinin fıkhî ve tarihî arka planını sorgulayıp, mevcut sistemlerin meşruiyet değerlerinin belirlenmesi çalışmanın en temel amacıdır. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Genel anlamda çalışmanın sınırlarının çizildiği giriş kısmından sonra birinci bölümde faiz yasağı ve bu yasağı aşma veya alternatif üretme anlamında tarihî ve fıkhî arka plan verilmeye çalışılmıştır. İkinci bölümde, fıkhî meşruiyetin tartışılacağı üçüncü bölüme zemin hazırlamak amacıyla Türkiye'deki mevcut konut organizasyonları işleyiş mekanizmaları dikkate alınarak tanıtılmıştır. Üçüncü bölümde ise, bu organizasyonlar klasik ve modern akit teorilerinden hareketle analiz edilerek malî hîle-i şer'iyye uygulamalarıyla ilişkileri sorgulanmıştır. Sonuç olarak, Türkiye'de faaliyet gösteren konut finansman organizasyonlarının mevcut faaliyetlerinin geçmişteki malî/ticarî hîle-i şer'iyye uygulamalarıyla oldukça benzerlik gösterdiği tespit edilmiştir. Aksi örnekler olmakla birlikte bu benzerlik, kanaatimizce salt bir kâr gayesi olarak okunmamalı; aksine fıkhın arka planındaki ahlakî yapının dejenere olmasının tezahürlerinden biri olarak görülmelidir."
