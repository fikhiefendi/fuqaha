abstract: "YÜKSEK US ANS TEZ ÖZETİ 576 NUMARALI KARAHİSÂR-I SÂHİB ŞER'İYYE SİCİLİNE GÖRE AFYON (H.1265 -1268 / M.1848-1851 ) Meral ŞAHİN Tarih Anabilim Dalı Afyon Kocatepe Üniversitesi Sosyal Bilimler Enstitüsü Nisan 2001 Danışman: Yrd. Doç. Dr. Süleyman ÖZBEK Bu defter çalışması ile H.1265- 1268 / M.1848-1851 yıllan arasını kapsayan 576 numaralı Karahisâr-ı Sâhib Şer'iyye Sicili incelenmiştir. Şer'iyye Sicilleri şehir tarihlerinin incelenmesi açısından büyük Öneme sahiptirler. Şehirlerin sosyal, ekonomik, kültürel, özelliklerinin araştırılması neticesi o şehir hakkında sağlıklı verilere ulaşmak mümkün olabilmektedir. Yakın dönemde şehir tarihleri üzerinde yapılan çalışmaların sayısı artmıştır. Defterde değişik belge örnekleri bulunmaktadır. Narh kayıtları, terekeler, eşya dökümleri, pnra-flynt hareketleri, askerlikle ilgili konular, arazi anlaşmazlıkları, ilk akla gelenlerdir. Fiyatların sürekli değişken olduğu ve arttığı gözlenmektedir. Bu durum enflasyonun varlığını ortaya koymaktadır. Karahisâr-ı Sâhib Sancağı'nın idâri ve fiziki yapısı, kaza ve köy isimleri gibi yerleşim coğrafyası açısından önemli olan unsurlar tespit edilmiştir. Defter, yakm yüzyıl Afyonkarahisar mahalli tarihi açısından kendine has bir muhteva içermekte olup, gelecekte yapılacak daha kapsamlı şehir tarihçiliği çalışmalarında zengin altyapı malzemesini ortaya koymaktadır."
