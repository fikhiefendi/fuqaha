abstract: "Biz bu tezimizle, İslam hukukçuları arasında meydana gelmiş hazine değerindeki bu görüş ayrıldıklarından, mezheplerin dar kalıpları içerisinde sıkışıp kalmış ve mezhep taassubuyla hareket alanı iyice sınırlandırılmış bu farklı görüşlerden tercih edilmiş fetvalardan sürekli faydalanmanın mümkün olmadığını, bu hazineden faydalanmak için daha serbest ve daha kolay bir takım şart ve kriterlerin bulunması gerektiğini iddia ediyoruz. Bu iddiamızı ispat için, günümüzde bu ihtilaflardan faydalanarak müftülük görevini ifa edecek olanların, makâsıd (şâriin dini hükümleri koyarken gözettiği gayeler) konusunda bilgi sahibi olmak, meseleleri kaynaklarından anlayabilecek kadar Arapça bilmek, fetva vereceği konu ile ilgili ahkam ayet ve hadislerine kaynaklarından ulaşabilmek, İslam hukukçularını ve İslam hukukunun furû kaynakların tanımak, İslam hukukçularının ihtilaf sebeplerini bilmek, mahallin örf ve âdetlerini bilmek, ihtilaflı kavillerden fetva verme âdâbını bilmek gibi şartlan kendilerinde toplamaları kafidir. Şunu da belirtelim ki, bu şartlar bütün meselelerle ilgili olmayıp yalnız fetva verilecek mesele için bulununca maksat hasıl olacaktır. Saydığımız bu şartlara sahip olan günümüz müftüsü, müsteftînin (fetva isteyenin) durumuna bakarak âlimlerin ihtilaflı kavillerinden, cem ve telif ve teflik yollarıyla faydalanabileceği gibi, hükmün maksadına veya insanların maslahatına daha uygun olan kavli, benimseyenleri çok olan kavli, daha kolay olan kavli, salim akla daha uygun olan kavli, örfe daha uygun olan kavli veya değişen şartlara daha uygun olan kavli tercih gibi kriterlerden biri ile bu farklı görüşlerden faydalanması mümkündür. İşte günümüz müftüleri bu şart ve kriterlerle İslam hukukçularının ihtilaflarından faydalanabilirler. Hatta bu şart ve kriterlerle ihtilaflardan faydalanırken zamanla mutlak içtihat ehliyetini de elde edebilirler. Müsteftî ise belli bir mezhebi seçebileceği gibi, fetva isteyeceği müftüyü de seçebilir."
