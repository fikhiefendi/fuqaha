abstract: "Araştırmacı, tez çalışmasında şu hedeflere ulaşmak istemiştir: Kur'an-I Kerime göre Ailenin yeri, eşler arasındaki ilişki konusunda Kur'an üslubun beyanı. Bu çalışmada ayrıca Şâri-I Teâlâ'nın ailenin teşkilindeki yüksek hikmetleri de gösterilmeye çalışmıştır. Ayrıca ailenin doğruluğu ve selameti sonraki nesillerin sıhhatli olmasının temelinde yatan unsurdur. Bu (gibi) unsurlar selameti, güçlü birbirine kenetlenmiş bir toplum temel şartıdır. Araştırmamızda Kur'an-ı Kerimdeki aile ile alakalı ayetleri (nas) bir araya getirilip düzenlenmiş ve ayetlerin ailenin korunmasını ve salim bir şekilde devamını hedeflediği anlaşılmıştır. Bu çalışma aşağıdaki şekilde özetlenebilir. A. Giriş: Bu kısımda aile ve korunma kelimelerinin sözlük lügat ve ıstılah (terim) manasına değinilmiş, fakihlerin bu kelimelerin nasıl kullandığı ve Kur'an'ın manası lügat ve ıstılah açısından izah edilmiştir. B. Birinci bölüm: Bu kısımda ailenin nizamından ve hayat arkadaşı seçimini izah eden, evlenmeye teşvik eden ve aile nizamını ve ailenin devamını sağlayacak hükümler koyan çoksayıda ayet-I kerimenin mevcudiyetinden bahseder. Bu müesseselerin korunması Kur'an-ı Kerim'in maksatlarından birisi olması ailenin inşasındaki hikmetlerden birisidir ve bu kısım bunu da beyan eder. C. İkinci Bölüm: Bu bölümde Kur'an-ı Kerimdeki (evlilikten önceki davranışlar hakkında) gelen ve takrir edilen teşrii hükümlerden bahsedilir bu teşriin hükümlerin maksatlarından birinin ailenin muhafazası ve korunması olduğu ifade edilir. Aileyi muhafaza edilen unsurlar ise şunlardır: örtünme (tesettür), (odaya girerken) izin isteme, kazf (iftira haddi) zinanın ve ona götüren şeylerin yasaklanması, Müslüman ile (ehl-I kitap olmayan) kâfir arasında evliliğin haram oluşu. D. Üçüncü fasıl: bu kısımda yuvanın kurulmasından sonra onu korumaya dair olan aile reisliği hakkında hanıma değil kocaya verilmesi, boşanmadan geri dönüş imkânı (ric'at) iki taraf arasında çıkan sıkıntılı durumlarda iki hakemin seçilmesi, kadının veya erkeğin serkeşliği durumunda bu sorunun çözüm yolunun gösterilmesi gibi teşrii hükümlerden bahsedilir. E. Bu kısımda ayrıca ailenin korunmasına dair olan zıharın haram kılınması, büyük ayrılıktan sonra (beynünei-kübra) ricatın yasaklanması, îlâve zulüm edilişi gibi yasaklardan da bahsedilir. F. Sonuç (netice): Bu kısımda araştırma mevzu hakkında çalışanlara aile ile alakalı mühim tavsiyeler zikredilir ve çalışmanın neticeleri beyan edilir."
