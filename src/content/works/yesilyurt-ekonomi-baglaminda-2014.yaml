abstract: "Din ve ekonomi bağlamında İslam maliye sisteminin tarihsel gelişimi ve günümüz maliye sistemi ile karşılaştırılmasını konu edinen bu çalışmada; din ve ekonomi kavramlarının birbirinden ayrı ve ilgisiz olmadığı, tam aksine birbirini destekleyen iki kavram olduğu ve bu kapsamda dini kurallar çerçevesinde bir maliye sisteminin mümkün olabileceği ele alınmıştır. Araştırmanın sonucunda dinin insan hayatının her alanına hitap ettiği ve bu alanların başında maliye sistemleri geldiği ortaya konulmuştur. Böylece dini kurallar çerçevesinde tanzim edilen İslam maliye sisteminin kaynakları, gelişimi, tarihsel süreç içerisindeki uygulanışı ve günümüz maliye sistemi ile karşılaştırılması ele alınmıştır. İslam dini ve tarihi hakkında yapılan ikincil kaynakların temel alındığı bu çalışmada, küreselleşmenin ve modernleşmenin yaşanmasıyla dini kurallar çerçevesinde ortaya konulan bir maliye sisteminin giderek yok olduğu ve onun yerine küresel bağlamda bir maliye sisteminin oluştuğu ortaya konulmuştur."
