abstract: "Ebü‟l-Hüseyn el-Basrî, Mu„tezile mezhebinin müteahhirun alimlerindendir. Kâdî Abdülcebbâr‟ın öğrencisi olan Ebü‟l-Hüseyn el-Basrî fıkıh usûlü alanında yazdığı“Kitâbu‟l- Mu„temed fî Usûli‟l-Fıkh”adlı eseri, mütekellimûn usûl metodu ile kaleme alınan dört temel eserden bir tanesidir. Daha sonraları Ġslam dünyasının önemli isimlerinden Fahreddin er-Râzî (ö. 606/1210) ve Ebû Muhammed el-Ġsnevî (ö. 772/1370) gibi alimlerin fıkıh usûlü eserlerinde bu kitaba atıflarda bulunmaları hatta nakilde bulunmaları, eserin önemini bir kez daha ortaya koymaktadır. Eser usûl konularını mütekellimûn metodu ile ele almıĢ ve incelemiĢtir. Fıkıh usûlü konularından âm ve hâs meselesi kaynaklardan istinbat/hüküm türetme hususunda önemli iki kavramdır. Ġslam hukuk alimleri, Ģârinin maksadını anlamayı, bunlardan hareketle Ģer‟i hükümlere ulaĢmayı sağlayan usûl ilmi, lafızlarının konuluĢ amaçlarını ve bunların dilbilim açısından hükmü kapsama meselesini tartıĢmıĢlardır. Umûm ifade eden bir lafzın ifade ettiği umûmiyet ve bunun sınırlarını koymak elbette hükmün tezahürü için büyük önem arz etmektedir. Ancak usûl ilminin tarihine bakıldığında Ġslam fıkhı için ortaya konulan kurallar mütekellimûn metodu ve fukahâ metodu Ģeklinde iki ana baĢlık altında incelenmiĢtir. Fukahâ metodunun ortaya konulması Ehl-i Sünnet alimlerinin önde gelen isimlerinden Ġmâm Ebû Hanîfe‟ye (ö. 150/767) dayandırılmıĢtır. Ortaya koyduğu fıkıh usûlü kuralları da mütekellimûn metodunun ortaya koyduğu metottan daha güçlü olduğu kabul edilmiĢtir. Ancak Ehl-i Sünnetin diğer bir kolu olan ġâfiî mezhebi ve imamı olan Ġmâm ġâfiî (ö. 204/820) mütekellimûn metodunu benimsemiĢ ve fıkhî istinbatlarını bu metot üzere belirlemiĢtir. Bu çalıĢmada, iki fıkıh usûlü metodundan biri olan mütekellimûn metodunun en önemli dört eserinden biri olan“Kitâbu‟l-Mu‟temed fî Usûli‟l-Fıkh”adlı kitabında ele aldığı âm ve hâs lafızlarının muhtevası incelenecektir."
