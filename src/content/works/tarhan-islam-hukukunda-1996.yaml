abstract: "ÖZETISLAM HUKUKUNDA KADINLARIN MIRASÇILIGI İslam hukukunda, mülk edinme vasıtalarından biri olan mirasçılık, önemli bir yer tutar. Mirasçı, evlilik, akrabalık ve velâ gibi sebeplerden dolayı ölen kişinin mallarına ve haklarının kendisine geçtiği kişidir. İslam hukukunda mirasçılığın gerçekleşmesi için mirasçılık sebepleri dışında, mirasçılığın unsurları, şartları, engelleri ve prensipleri de belirlenmiştir. Mirasçılar ve mirastaki paylarının belirlenmesindeki en önemli prensipler adalet, yakınlık ve ihtiyaçtır. Mirasçıların terike (miras)deki hakları teçhiz, tekfin, borç ve vasiyetten sonra gelir, İslam hukukunda mirasçılar on gruba ayrılır ve mirastaki payları açısından her fert ayrı olarak değerlendirilir. Islamdan önceki eski hukuk sistemlerinin bir çoğunda, kadınlara mirastan pay ve rilmemiş hatta kadın bizzat kendisi miras (mal) olarak kabul edilmiştir. Ancak son zaman larda, çağdaş hukuk sistemlerinde, kadınlar erkeklerle eşit paylar almaya başlamışlardır. TMK'da kadın ve erkek eşit haklara sahiptir. islam'dan önce ve islam'ın geldiği dönemlerde başta Araplar olmak üzere pek çok hukuk sistemlerinde kadınlara mirastan haklar verilmezken, islam hukuku kadınların - anne, eş, kız çocuğu, kız kardeş ve nine- olarak mirasçı olmalarını sağlamıştır. Kur'an-ı Kerim ayetlerinde (Nisa, 7, 11, 12, 13, 19, 176,...)de belinrtildiği gibi kadınlara mirastan 1/2, 2/3, 1/3, 1/4, 1/6, 1/8 gibi belirli paylar ayrılmıştır. Bu belirli pay sahibi mirasçılara“ashabu'l-ferâiz”denilmektedir. Malın geri kalanı ise, asabe adı verilen erkek mirasçılara verilmektedir, öncelikle belirli pay sahipleri -ki çoğunluğu kadınlardır- mirastan paylarını alırlar. Kadınlar, iddia edildiği gibi, her durumda erkeklerden eksik pay almamakta, bazen eşit bazen de erkek mirasçılardan fazla pay almaktadırlar. Kadınların eksik hisse almaları, erkek kardeşleriyle beraber mirasçı olmaları ile eşlerin birbirlerine mirasçılığında geçerlidir. Bunun da en önemli sebebi, islam hukukunda, mali sorumlulukların erkeklerin (baba, eş, erkek kardeş, dede, vs.) omuzları üzerinde olmasıdır. Mirasçılığın bazı durumlarındaki farklılık, cinsiyetten değil ihtiyaçtan kaynaklanmaktadır, islam hukukunun bir hükmünü anlayabilmek için, sistemi bütün olarak incelemek gerekir.Modernist düşünürler, kadınların mirasçılığında esas alınan prensipleri kabul etmekle birlikte, bu hükümlerin günümüz şartlarına göre değişmesi gerektiği görüşündedirler. Ancak kadınların mirastaki payları, kesin nasslarla (âyet ve hadislerle) belirlenmiş olup zamanın ve toplumsal şartların değişmesiyle değişebilirliği kabul edilemez hükümlerdendir. Ayrıca mirasçılıkta esas alınan prensipler, tam anlamıyla henüz değişikliğe de uğramamıştır."
