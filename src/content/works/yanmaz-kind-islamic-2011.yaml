abstract: "Faizin yasak olduğu İslam dünyasında finansal araçların başlıca özelliği faizsiz çalışma esasına dayanmasıdır. Bu kapsamda çıkartılan İslami finansman sertifikası sukuk esas olarak varlık finansmanı için çıkarılmakta olup, elde edilen fonla alınan varlık/yapılan yatırımdan elde edilecek gelirin Sukuk sahibine belli dönemlerde ödenmesi esasına dayanmaktadır. Sukuk 2008 yılındaki ağır ekonomik bunalımdan sonra popülaritesi en çok artan finansal araç olarak karşımıza çıkmaktadır. Çalışmamızda alternatif finansman aracı olan sukuk ele alınacak ardından Türkiye'ye özgü bir sukuk modeli önerilecektir. Sukuk'un en önemli özelliği faizsiz bir finansman aracı olmasıdır. Faiz yıllardır tartışılmaktadır ve görünen o ki tartışılmaya devam edilecektir. Faiz uygulamaları tarihin ilk yıllarından itibaren hemen hemen her toplumda görülmüştür. Faiz eksenli ekonomiler her zaman risk taşır, son ekonomik kriz bu gerçeği ortaya koymuştur. Sukuk; devletler ve şirketler tarafından kullanılan özel şekiller içeren ve gerçek bir ekonomik değer tarafından desteklenen bir finansal araçtır. Sukuk uygulamaları Malezya'da ortaya çıkmış ve kısa sürede diğer İslami ülkelere yayılmıştır. Sukuk bugün sadece İslami ülkeler tarafından değil aynı zamanda gelişmiş batı ekonomileri tarafından da kullanılan bir finansal araçtır. En yaygın olarak kullanılan sukuk çeşidinin icara sukuk olduğu görülmektedir. Türkiye ekonomisi sukuk ile henüz yeni tanışmıştır. Türkiye Müslüman halkı ve laik demokrasiye sahip kendine özgü koşulları bulunan bir ülkedir. Çalışmamızda Türkiye'de sukuk uygulamaları için yeni bir model önerilmiştir çünkü her ekonominin olduğu gibi Türkiye ekonomisinin de kendine özgü koşulları bulunmaktadır. Sukuk bununla birlikte diğer finansal araçlarda olduğu gibi bazı riskler içermektedir, yeni model çerçevesinde bu riskler minimize edilmeye çalışılmıştır. Çalışmamız Sukuk hakkında yeni model öneren ilk çalışma olma özelliğindedir."
