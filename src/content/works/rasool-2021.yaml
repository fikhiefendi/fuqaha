abstract: "İslam Şerî'atında Engellilerin Hükümleri başlıklı bu çalışma özel bakıma ihtiyaç duyanlar ve onlar için şer'î hukuk bakımından onlarla ilgili problemleri ele alan fıkhî ilmî bir araştırmadan ibarettir. Bu bakımdan bu çalışma Eski ve yeni olmak üzere toplumlardaki engellilik olgusu olan toplum hayatına ilişkin önemli bir problemi çözmektedir. Başta fakihler olmak üzere eski bilgiler İslam şerî'atındaki verilere dayanarak bu konuyu tartışmıştır. Bu çalışma ise şeriat bakımından bu problemi yeniden incelemektedir. Çalışmada özellikle“engelli”kavramı ve bu konuda o kavramla ilişkili olan diğer kavramlar ele alınmaktadır. Özel bakıma ihtiyaç duyanların yeri incelenmekle birlikte insanın musibetler ve sıkıntılarla sınanmasındaki ilâhî hikmet açıklanmaktadır. İki bölüm ve sonuçtan oluşan bu çalışmada İslam şerî'atında engellilerin hakları olarak saygınlık hakkı, toplumda yaşama hakkı, mal edinme hakkı, çalışma hakkı, eğitim hakkı, sosyal sorumluluk olmak üzere diğer hakların hepsi ilk bölümde incelenmektedir. İkinci bölümde ise taharet, ibâdât, muâmelât, nikâh, evlilik ve boşanma olmak üzere İslam fıkhında engellilerle ilgili şer'î hükümler ele alınmaktadır. Çalışmanın sonuç bölümünde ise araştırmada varılan sonuçlar yer almaktadır. Sonuçlardan en önemlisi ise şeriatın özel bakıma ihtiyaç duyanlar için özel hakları maddî ve manevî bakımdan garanti altına almasıdır. Söz konusu özel haklar ise yeme, içme, barınma, giyim, eğitim, mal edinme, toplumdaki sosyal faaliyetlerin bütününe katılma ve benzeri haklardır."
