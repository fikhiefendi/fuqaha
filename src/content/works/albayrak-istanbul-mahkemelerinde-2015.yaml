abstract: "Osmanlı İmparatorluğunda müste'men, ahidnâme verilen Avrupa devletleri teb'asına verilen isimdir. Ahidnâme sayesinde Avrupalı tüccarlar ve onların bayrağı altında bulunanlar; Osmanlı ülkesinde ikamet edebilir, ticaret yapabilir, mahkemelere başvurabilirdi. Venedik ve Ceneviz'in ardından 16. yüzyılın sonundan itibaren Fransa, İngiltere ve Hollanda ahidnâmeler elde ederek Levant ticaretinde güç kazanmıştır. Müste'men tüccarlar kendi aralarındaki uyuşmazlıkları genellikle konsoloslar vasıtasıyla çözmekteydi. Ahidnâme gereği Osmanlı teb'ası ile olan uyuşmazlıkları için Osmanlı mahkemelerine başvurmaları gerekiyordu. İstanbul şer'iyye sicillerinde oran olarak az miktarda müste'men tüccar kaydına rastlanılmaktadır. 17. Yüzyılın çeşitli dönemlerine ait incelenen yaklaşık 30 defterde karşılaştığımız kayıtların büyük bir bölümü müste'menlerin hukukî muamele tescildinden oluşmaktadır. Bunların yaklaşık %20'si ise davalardır. Davalar genellikle müste'men ile Osmanlı tebası arasında olmakla birlikte iki müste'men arasındaki davalara da rastlanılmıştır. Müste'men kayıtları borçlanma ilişkileri, alım-satım ve ortaklık ilişkileri gibi konularda ağırlık kazanmaktadır. Yine şer'iata ve ahidnâmeye göre tescil zorunluluğu olan kefalet, vekalet gibi hususlar da çoktur. Muhakeme şeriatın hükümlerine göre yapılmakla beraber ahidnâmedeki bazı imtiyazlar müste'menler tarafından sürekli öne sürülürdü. Bunlar arasında özellikle belge ile ispat zorunluluğu, yetkisizlik iddiası ve bazı muafiyetler mahkemede üstünlük sebebi idi. Müste'menler davalar esnasında sıkça ahidnâmeyi destekler nitelikte şeyhülislâm fetvalarını da mahkemeye sunmuşlardır. Müste'menlerin ticari hayatta yaşanan anlaşmazlıklarla bağlantılı olarak mahkemelere etkin olarak başvurabildiklerini, ve davayı kazanmak için bir çok vasıtayı kullandıklarını söylemek mümkündür. Davalardan anlaşıldığı kadarıyla Osmanlı kadıları ahidnâmelere bağlı kalarak müste'men tüccarların ticari faaliyetlerini gözetmektedir."
