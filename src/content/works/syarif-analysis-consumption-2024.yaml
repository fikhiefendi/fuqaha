abstract: "Türkiye'nin Müslüman ülkeler arasında yükseköğrenim görmek için en çok tercih edilen ülkelerden biri olduğu düşünüldüğünde, bu çalışma Türkiye'deki yabancı öğrenci topluluğunun, bu durumda Endonezyalı öğrencilerin tüketim kalıplarını ve davranışlarını keşfetmeyi amaçlamaktadır. Bu çalışma, Türkiye'deki Endonezyalı öğrenciler arasında tüketim davranışını şekillendiren iki faktör olarak yaşam yeri ve İslami değerlere göre tüketim bilincini kapsamaya çalışmaktadır. Nicel yaklaşıma dayalı bir araştırma olan bu çalışmada, çevrimiçi ve çevrimdışı olarak dağıtılan anketler kullanılarak örneklem olarak 289 katılımcıdan veri toplanmıştır. Veri işleme ve analizi Partial Least Squares-Yapısal Eşitlik Modellemesine (PLS-SEM) göre gerçekleştirilmiştir. Sonuçlar, İslami farkındalık ve Türkiye'de yaşamanın Türkiye'deki Endonezyalı öğrencilerin tüketim davranışları üzerinde önemli bir pozitif etkisi olduğunu ve İslami farkındalığın Türkiye'de yaşamaktan nispeten daha büyük bir etkiye sahip olduğunu göstermektedir. Katılımcıların çoğunun yanıtlarına dayanarak, Türk halkının yaşam tarzının Endonezyalı öğrencileri daha sağlıklı bir şekilde tüketmeye teşvik ettiği de ortaya çıkmıştır. Bu çalışmanın, tüketim davranışı konusunda diğer ülkelerden gelen yabancı öğrenci toplulukları üzerine yapılacak daha ileri araştırmalara ilham verecek somut bir temel teşkil etmesi beklenmektedir. Yurtdışındaki Endonezyalı öğrencilerin tüketimine özel olarak, belirli özelliklere uyum sağlamak için çok daha karmaşık ve temsili bir araştırma aracına ihtiyaç vardır."
