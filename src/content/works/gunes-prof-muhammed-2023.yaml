abstract: "Prof. Dr. Muhammed Hamidullah çalışmalarında tetkik ve tenkide önem veren titiz bir araştırmacıdır. Geçmişten günümüze kadar ilmî ve kültürel, bilgi birikiminin orijinalliğini korumuş entelektüel bir fikir adamıdır. Bu çerçevede Muhammed Hamidullah günümüz fıkıh problemlerine dair görüşlerinin bilinmesinin etkisiyle İslam hukuk tarihinin doğru okunmasına ve aktarılmasına katkı sağlamıştır. Bununla beraber İslam tarihini ve İslam peygamberini en detaylı şekilde ele almıştır. Bu alana bağlı olarak Hadis ve Sünnet alanında İslam tarihine büyük katkısı olmuştur. Muhammed Hamidullah bu sayede İslam hukuk tarihinin, en önemli varislerindendir. Bu çalışmada da ömrü boyunca gerçekleştirdiği ilmi faaliyetlerinde İslam tarihi ve İslam hukuku alanında etkili olmuş aynı zamanda İslam âlimlerinden biri olan Prof. Dr. Muhammed Hamidullah'ın, hayatı ve eserleri ele alınmış, eserleri kitaplar ve makaleler olarak 2 bölümde detaylı bir şekilde incelenerek bilgiler sentezlenerek aktarılmıştır."
