abstract: "Makasıd düşüncesinin ortaya çıkışında maslahat, talil, hüsün-kubuh ve aslah tartışmaları etkindir. Makasıd düşüncesine ilişkin ilk terim ve tartışmalar Kaffal Şâşî'de görülmektedir. Kaffal, Cüveynî ve Gazzâlî Horasan bölgesindeki Eş'arî/Şâfiî hukukçular olarak makasıd düşüncesinin ilk kaynaklarını oluşturmaktadır. Mutezilenin savunduğu Hüsün-kubuhun aklîliği ve aslah görüşlerine Eş'arî geleneğin cevabı makasıd düşüncesini oluşturmaktadır. Makasıdın zarûriyyât hâciyyât tahsîniyyât şeklinde kısımlara ayrılması Şâfiî mezhebinin mürsel maslahata bakışını yansıtmaktadır."
