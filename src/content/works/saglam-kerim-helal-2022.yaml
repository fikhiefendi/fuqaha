abstract: "Kur'ân'a göre insan, Allah'ın yeryüzündeki halifesidir. Allah (c.c.) yeryüzünde insanoğlunun varlığını sürdürebilmesi ve yeryüzünde faydalanması için birçok nimet yaratmıştır. İnsanoğlunun varlığını sürdürebilmesi için temel gereksinimlerden birisi de gıda ihtiyacıdır. İnsanlar, kendilerine sunulan bu nimetlerden çeşitli yönlerde faydalanarak onlardan istifade ederler. Allah Teâlâ Kur'ân-ı Kerîm'de insanların fayda ve zararına olan yiyecek ve içecek türü şeyleri açıklayıp, bunlarla ilgili hükümleri helâl ve haram şeklinde bildirmiştir. Allah (c.c.) tarafından helâl ya da haram olarak belirlenen yiyecek ve içecekler hükmen bütün müminler için aynı şekilde bağlayıcıdır. Kişinin helâl ve harama karşı gösterdiği duyarlılık onun dindarlıktaki özveri ve hassasiyetini belirler. Bu çalışmada, Kur'ân-ı Kerîm'de bulunan helâl ve haram yiyeceklerin neler olduğu ele alınmıştır. Allah'ın helâl kılıp rızık olarak faydalanılmasını istediği yiyecekler ile Allah'ın haram kılıp insanların faydasına olmadığını belirttiği yiyeceklerin neler olduğu, ilgili tefsîrler açısından değerlendirilmiştir."
