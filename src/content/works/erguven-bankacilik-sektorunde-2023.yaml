abstract: "Bu çalışma, dijital gelişmelerin katılım bankacılığı çalışanları üzerindeki etkisini ortaya çıkarmayı amaçlamıştır. Bu kapsamda teknoloji kabul modeli, algılanan fayda, algılanan kullanım kolaylığı, algılanan verimlilik, ekonomik kaygı ve çalışanların tutumları konuları ele alınmıştır. Bu amaçla, dijitalleşme, bankacılık ve teknoloji kabul modeli gibi anahtar kelimeler tanımlanmıştır. Ayrıca, katılım bankacılığının tarihsel gelişimi, dijitalleşme, bankacılık sektöründe dijital dönüşüm ve çalışanların dijital dönüşüme tutumları konuları da ele alınmıştır. Tezde anket ile veri toplanmış ve çeşitli analizlere tabi tutulmuştur. Bu tezin literatüre katkı sağlamanın yanı sıra katılım bankacılığı yöneticilerine yol gösterici olması beklenmektedir."
