abstract: "?İslâm Hukuk Metodolojisinde Delillerin Teâruzu ve Tercûh Kaideleri?isimli tezimiz bir giriş ile üç bölümden meydana gelmektedir. Giriş bölümüaraştırmanın amacı, önemi, sınırları ve yönteminden oluşmaktadır.Birinci bölümde önce teâruz kavramı işlenmiştir. Bilginlerin şer'û delillerarasında çelişkinin meydana gelip gelmemesiyle ilgili görüşlerinin nelerden ibaretolduğu araştırılmıştır. Bundan sonra şer'û delillere, İslâm hukuk metodolojisindekaynaklardan hüküm çıkarma metotlarına ve lafızların manâ ile ilişkileri açısından tâbitutuldukları ayrımlara işaret edilmiştir.İkinci bölümde teâruzun rükün ve şartları, teâruza konu olan deliller ve delillerarasında -ister hakikû, ister zahirû- teâruzun (çelişki) meydana geldiğini kabul edenfakûhlerin hangi usÃ»llerle teâruzu giderdikleri tespit edilmeye çalışılmıştır. Ayrıca şer'ûdeliller arasında çelişkinin meydana gelmesinin nedenleri ve ihtilâfın tarihsel gelişimikısaca verilmiştir. Teâruz ve tercûh konusunun teorik değeri yanında usÃ»le ait biryaklaşımın fürÃ»da ne gibi sonuçlara yol açtığı ve İslâm hukuk doktrinlerinin oluşumunanasıl bir katkıda bulunduğunu tespiti bakımından önemini ifade etmek için teâruzunictihad faaliyetlerindeki değeri üzerinde durulmuştur. Bu bölümdeki konunun daha iyianlaşılması için, teâruz türleri tespit edilmeye çalışılmıştır.Üçüncü bölümde ise şer'û deliller arasında meydana gelmiş olan çelişkinin(teâruz) giderilmesinde bilginler tarafından teâruzu giderme prensipleri olarak tespitedilen cem' ve tevfûk, tercûh, nesh ve tesâkut metotları ele alınarak incelenmiştir.Nihayet birbirine muârız görünen bazı âyetler ele alınarak bilginlerin söz konu âyetlerarasındaki çelişkiyi giderirken başvurdukları usÃ»llere yer verilerek konu bitirilmiştir."
