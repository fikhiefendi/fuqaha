abstract: "Kurumsal sosyal sorumluluk (KSS), işletmelerin yalnızca ekonomik performanslarıyla değil, aynı zamanda yasal, etik ve çevresel etkileri çerçevesinde değerlendirilmesini öngören çok boyutlu ve normatif bir yaklaşımdır. Artan paydaş beklentileri, sürdürülebilirlik anlayışının yaygınlaşması ve kurumsal meşruiyet arayışları, KSS'nin işletme stratejileri içerisindeki önemini artırmıştır. Bu bağlamda finans sektörü, kaynak tahsis mekanizmaları ve ekonomik yönlendirme gücü nedeniyle KSS analizlerinde kritik bir alan olarak öne çıkmaktadır. Faizsiz finans ilkelerine dayalı katılım bankacılığı etik temelli yapısı, risk paylaşımı yaklaşımı ve reel ekonomi ile kurduğu ilişki sayesinde özgün bir inceleme alanı sunmaktadır. Bu çalışmanın amacı, katılım bankalarının faaliyet raporları ile KFMS'lerde yer alan KSS içeriklerini ekonomik, yasal, etik ve gönüllü sorumluluk boyutları çerçevesinde sistematik ve karşılaştırmalı olarak incelemektir. Nitel araştırma yaklaşımı kapsamında 2015–2024 dönemine ait faaliyet raporları ile KFMS metinleri doküman incelemesine tabi tutulmuş ve içerik analizi yöntemiyle analiz edilmiştir. Analizlerde kelime bulutu, kelime frekansı, kod istatistikleri, kod matris tarayıcısı ve kod trendleri gibi tekniklerden yararlanılmıştır. Elde edilen bulgular, katılım bankalarının faaliyet raporlarında KSS'nin çok boyutlu, uygulama odaklı ve toplumsal etkiyi önceleyen bir perspektifle ele alındığını; özellikle etik ve gönüllü sorumluluk boyutlarının öne çıktığını, ekonomik ve yasal boyutların ise daha çok tamamlayıcı nitelikte yer aldığını göstermektedir. Buna karşılık KFMS'lerin KSS yaklaşımının ağırlıklı olarak yasal ve etik eksende, normatif ve düzenleyici bir çerçevede yapılandığı; ekonomik ve gönüllü boyutların görece sınırlı düzeyde kaldığı belirlenmiştir. Ayrıca 2019 yılında yayımlanan KFMS'lerin ardından KSS boyutlarının faaliyet raporlarında daha görünür hâle geldiği, ancak bu etkinin banka bazında farklılaştığı tespit edilmiştir. Sonuç olarak, katılım bankalarının KSS yaklaşımının değer temelli ve uygulama ağırlıklı; KFMS'lerin ise yasal ve etik odaklı normatif bir yapı sunduğu tespit edilmiştir. Bu doğrultuda, sosyal sorumluluk boyutlarının dengeli biçimde ele alınması, gönüllü sorumluluk alanlarının güçlendirilmesi ve standartların uygulama boyutunu destekleyecek şekilde geliştirilmesi önerilmektedir."
