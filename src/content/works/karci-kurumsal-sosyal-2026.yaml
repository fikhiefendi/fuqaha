title: "Kurumsal Sosyal Sorumluluk Açısından Katılım Bankalarının Faaliyet Raporları ve Katılım Finans Muhasebe Standartlarının İçerik Analizi Yöntemiyle Karşılaştırılması"
titleTranslation: {"en": "Comparison of participation banks' annual reports and participation finance accounting standards via content analysis from the perspective of corporate social responsibility"}
