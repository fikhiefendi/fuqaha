abstract: "Bu tez, Hicri 11. Asır alimlerinden eş-Şeyh el-Âlim Nâzım el-Medîh el-Muhammedi Abdirrahmân b. Ahmed b. Abdirrahmân b. Ali b. Ahmed b. Misk es-Sehâvî el-Ensârî eş-Şâfiî tarafından yazılmış olan el-Ecvibetü'l-Münbasita alâ'l-Esileti'l-Mültekata adlı kitabın ilk dörtte birlik bölümün tahkik ve incelemesini ihtiva etmektedir. Bu dörtte birlik ilk bölüm kitabın“ibadat”kısmının tamamını içermektedir. Çalışmayı iki kısma ayırdım: Kısım: Bir inceleme ve üç konudan oluşmaktadır. Konu: Yazarın hayat hikayesini ele almaktadır. Burada İmam İbn-i Misk es-Sehâvî'nin hayatı beş başlık altında ele alınmıştır. Konu: el-Ecvibetü'l-Münbasita alâ'l-Esileti'l-Mültekata adlı kitabın tanıtımı, kitabın ismi, yazara aidiyeti, kitabın yazılış amacı, önemi, ve yazarın yöntemi gbi konuları içermektedir. Bu konu da dört başlık altında incelenmiştir. Konu: Yazma nüshaların tanıtımı ve tahkikteki yöntemim ele alınmıştır. Bu konu da iki başlıkta altında anlatılmıştır. Kısım: Kitabın tahkikinin metin bölümüü içermektedir: Yazar, başta bir fasıl açarak hocalarının hayat hikâyelerini anlatmıştır. Sonra yedi babdan oluşan Taharet Kitabı adlı bölüme devam etmiştir. Daha sonra birçok mesele içeren Namaz Kitabı adlı bölüme geçmiştir. Daha sonra yine Şeyh Zekeriya el-Ensârî'nın akranlarının zamanından soru ve cevapları içeren bir bölüm aktardı. Sonra Kudve babıyla ilgili çeşitli meseleleri işlemiştir. Sonra da Zekât ve Bey' kitabıyla ilgili meselelerle kitabını sonlandırmıştır. Böylece kitabın“İbadat”adlı kısmını içeren ilk dörtte birlik bölüm tamamlanmış olmaktadır."
