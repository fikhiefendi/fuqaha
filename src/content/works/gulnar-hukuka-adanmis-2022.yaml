abstract: "Ali Himmet Berki, 1882 tarihinde babasının o sırada kadı olarak görev yaptığı Elbistan'da dünyaya gelmiştir. İkinci Meşrutiyet dönemi, Millî Mücâdele dönemi ve Cumhuriyet dönemine şahitlik etmiş önemli bir hukukçu olan Berki, hem İslam Hukuku'na ve hem de Medeni Hukuk'a hakim ender hukukçulardandır. Ali Himmet Berki, babası Demircizâde Kadı Osman ile aynı kadı okulu olan Mekteb-i Kudât'ta yetişmiştir. Mezun olduktan sonra Kânûn-ı Arâzî muallimliğinde ve Fetvâhâne memurluklarında çalışmıştır. Daha sonra Amasya, Tokat ve Ankara gibi önemli merkezlerde kadılık yapmıştır. Kadılık görevlerinden sonra İstanbul Mahkeme-i Asliye Reisliği, Şer'iye ve Evkaf Vekâleti Hey'et-i Müşâvere Azâlığı, Mahkeme-i Temyiz Azâlığı, Mahkeme-i Temyiz İkinci Reisliği ve Mahkeme-i Temyiz İkinci Hukuk Dairesi Reisliği görevlerini ifa etmiştir. On beşi münferit, üçü müşterek olmak üzere ağırlıklı olarak hukuk ve farklı konularda toplamda on sekiz adet kitap neşretmiştir. Tespit edilebilen 124 adet makale, yazı ve incelemesi bulunmaktadır. 1950'de emekli olduktan sonra bile hukukçu yaşantısını devam ettirmiş olan Ali Himmet Berki, 27 Mayıs 1976 tarihinde 94 yaşında vefat etmiştir."
