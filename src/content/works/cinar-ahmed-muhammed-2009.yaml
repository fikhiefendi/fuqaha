abstract: "Bu çalışma bir giriş ve iki bölümden meydana gelmektedir.Giriş'te, müellifin hayatı ve yaşadığı yer ve zaman dilimi hakkında bilgi sahibi olmak için, miladî XV. asırda Mâverâünnehir ve Semerkandın dinî, siyasî ve ilmî durumuna genel bakış yapılmıştır.Birinci bölümde incelemiş olduğum ?Mu`înü'l-Ümme alâ Ma`rifeti'l-Vifâk ve'l-Hilâf Beyne'l-Eimme? adlı yazma telifin şekil ve muhteva özellikleri ele alınmış, eserin mevcut olup esas alınan nüshaları arasında mukayese yapmak sureti ile nüshalar hakkında bilgi verilmiş, ittifak ve ihtilaflı meseleler bakımından eser değerlendirmeye tabi tutulmuştur. Bunun yanısıra kısaca ilm-i hilâf üzerinde durulmuş ve tezde inceleme konusu yapılan yazma eserin ilm-i hilâf ile olan ilişkisine de değinilmiştir.İkinci bölümde ise tezimize konu olan eserin kaynakları, müellifleri ile beraber tanıtılmış ve kaynaklar hakkında kısa bir değerlendirme yapılmıştır."
