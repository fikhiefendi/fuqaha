abstract: "Çalışmamız dört bölümden oluşmaktadır. Birinci bölümünde bekarlık kavramıyla birlikte evde kalmış kız tabirini açıklamaya çalıştık, fakihlerin bu kavramlarla ilgili görüşlerine yer verdik. Bekârlık ve evde kalmış kız, nedenlerini inceledik. Araştırmamızın ikinci bölümünde, evlilikte kızın tercihi karşısında anne baba tutumunu, babanın kızının evliliğini engellemek yönelik çaba içerisinde olmasını ve bu durumun evde kalmış kızların sayısal bakımdan artmasına sebebiyet verdiğini tespit ettik. Ayrıca İslam hukuku açısından bunun hükmünü belirlemeye çalıştık. Bununla birlikte günümüzde kızlara verilen takılar ve mehr miktarının çok olması da evde kalan kızların artmasına sebebiyet verdiğini de söylemek mümkündür. Mehr konusunu incelerken, bunu fıkhi yönleriyle ele aldık. Tezimizin üçüncü bölünde, bekarlık ve evde kalmış kızların sayısal oranlarının artmasının nedenlerinden birinin de boşanma vakalarının artmasından kaynaklandığını tespit ettik. Çalışmamızın dördüncü bölümündeyse, boşanma vakalarının önüne geçmek için Kur'an, sünnet ve fıkıh kitaplarımızın getirmiş olduğu çözümleri sunmaya çalıştık. Burada ailelerin bilinçlenmesine ve aile birliğinin önemine değindik."
