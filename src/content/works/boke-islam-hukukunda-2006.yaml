abstract: "Dinî veya lâik bütün hukuk sistemleri, fertlerin ihtiyaç duyduğu tasarruf ve ilişkileri belirli bir düzene bağlamış ve bu ilişkilerin \"hukukî işlemler\" dediğimiz meşruiyet içerisinde gerçekleşmesini istemiştir. Her devirde ve toplumda farklı adlandırma, işleyiş ve sonuca sahip olsa bile hukukî işlemler, beşerî ilişkilerin zorlaması sonucu ortaya çıkmış ve mevcut hukuk sistemleri tarafından da yapılan birtakım müdahalelerle objektif bir yapıya kavuşturulmuş hukukî ilişkiler münasebetidir. İnsanlık tarihinin en önemli müesseselerinden birisi olan hukukî işlem müessesesi diğer hukuk sistemlerinde olduğu gibi İslâm hukukunda da borcun önemli kaynaklarından birini teşkil etmektedir. Hukukî işlemler içerisinde ise çok taraflı olanlar olduğu gibi \"tek taraflı hukukî işlemler\" de önemli bir yere sahiptir. Zira bu tür işlemler bir taraftan hukuk sistemlerine doktrin zenginliği ve hukuka işlerlik sağlarken bir taraftan da insanlar arası dayanışma ve yardımlaşmaya büyük ölçüde katkı sağlamaktadır. İslâm hukuku ile ilgili yapılan çalışmaların da eksenini teşkil eden hukukî işlemler, muamelât hukukuyla ilgili olan akidler başlığı altında çağdaş müellifler tarafından ele alınmış ve bu hususta haylî mesafe kat edilmiştir. Buna rağmen modern batı hukukuyla ilgili eserlerle mukayese edildiğinde İslâm hukukunun bazı bölümleri geniş ölçüde işlenmiş ve belirginlik kazanmış olmakla birlikte fıkhın geneli açısından yapılması gereken çalışmaların yapılanlardan daha fazla olduğu görülmektedir. İşte tek taraflı hukukî işlemler konusunda hazırlanan bu tez muâmelâta dair yapılmış bir çalışma niteliğindedir."
