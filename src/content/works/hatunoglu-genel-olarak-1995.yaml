abstract: "ÖZET Îsİam Bankaları, bankacılık işlemlerini islami esaslara uygun şekilde yapan kuruluşlardır. Eski zamanlarda bu bankaların bazı niteliklerine sahip olan kuruluşlar değişik ülkelerde ve değişik isimler (iş ortaklığı, dostluk cemiyetleri, yardım sandığı gibi) altında faaliyet göstermişlerdir. İslam Bankacılığı fikri ilk alarak 1955 yılında iktisatçı Muhammad Uzair tarafından ortaya atılmış olmasına karşın, ilk örneğini 1963 yılında Mısır'da Myt-Ghmr kasabasında vermiştir. islam Bankaları, genel olarak, cari, tasarruf ve yatırım hesaplarına fon toplamakta ve bu fonları temel alarak iki değişik yöntemle kul landırma ktadırlar.. Bu fon kullandırma yöntemlerinin birincisinde üretim yedi değişik şekilde finanse edilebilmektedir. Bu finansman şekilleri; mudaraba, muşaraka, murabaha, kiralama, kiralama-satın alma, vadeli satış ve selem satışı'dır. Fon kullandırma yöntemlerinin ikincisinde ise ihtiyacı alanlara, karşılığında faiz veya başka bir isim altında herhangi bir getiri talep edilmeden kredi verilmektedir. Merkezi İslam ülkelerinde bulunan ( Kuveyt, Suudi Arabistan gibi) ve İslam Bankaları olarak isimlendirilen bu bankalar, diğer ülkelerde farklı isimler altında faaliyet göstermektedirler. Türkiye'deki İslam Bankaları, cari ve katılma hesaplarına fon toplamakta ve bu fonları dört değişik yöntem ile kullandırmaktadırlar. Bu yöntemler sırasıyla, kar-zarar ortaklığı, üretim desteği, leasing ve mal karşılığı olan vesaikin alım satımı yöntemidir. Türkiye'deki İslam Bankalar ı 'nın tasarruf sahiplerinin fonlarını topladıkları cari ve katılma hesapları. Klasik Ticari Bankalardaki vadeli ve vadesiz mevduat hesabına benzer özelliklere sahip olmasına karşın, Türkiye'deki İslam Bankaları gerek fon kullandırma yöntemleri gerekse yasal dayanakları açısından farklı özelliklere sahiptirler. Bu124 çalışmada ilk olarak lalam Bankacılığının tarihi, işleyişi ve varoluş nedenleri genel olarak tanıtılmıştır. ikinci bölümde islam Bankacılığının Türkiye'deki uygulaması anlatılmış ve Türkiye'deki islam Bankaları ile Ticari Bankaların aralarındaki farklılıklar ortaya konmuştur. Bu çalışmanın son bölümünde Türkiye'deki islam Bankalarının Müşteri ler i ' nin bu kurumlara olan yaklaşımlarını değerlendiren bir çalışma yer almaktadır."
