abstract: "İslam ceza hukukunun uygulamadaki en geniş alanını oluşturan ta'zir, fürû fıkıhta hadd cezası gerektiren suçların bedeli ve tekmilesi olarak görüldüğünden hadd cezaları içerisinde ele alınmış bir konudur. Ukûbâtın diğer alanlarından farklı olarak ta'zir siyasî otoritenin yetki alanında olduğu için suçu ve cezayı belirleme yetkisi de ilke olarak kamu otoritesine bırakılmıştır. Bu açıdan bakıldığında ta'zirin İslam hukukunun beşerî alanını temsil ettiğini söyleyebiliriz. Bununla birlikte tarihsel süreç içerisinde fürû fıkhın bu alana da müdahale ettiği, bazı kurallar koyduğu, hangi fiillerin suç oluşturduğu ve bu fiillere verilecek olan cezanın mahiyetini belirlediği de görülmektedir. Devletlerin yazılı kanunlar çıkarmaya başlamaları ile ceza kanunları da yazılı hale gelmeye başlamış ve nihayet 19. yüzyıl ile birlikte ta'ziri belirleme yetkisi tekrar siyasî otoriteye geçmiştir. Fakihin/kâdının yetkisinde olan bu alan önce kanunnameler sonra ceza kanunları ile tekrar siyasetin eline geçmiştir. Bu çalışma ilk bölümde fürû fıkıhta ta'zirin nasıl anlaşıldığını; ikinci bölümde suç teorisini ta'zir açısından ele almayı ve üçüncü bölümde ise ta'zir olarak verilen cezaları konu edinmektedir."
