abstract: "Hz. Ali, Hz. Peygamber'in ashabı arasında, kendine özgü bir takım özelliklerle ön plana çıkmış biridir. Onu öne çıkaran vasıflarından biri, karşılaşılan sorunların üstesinden gelebilecek bir zekâ ve bilgi birikimine sahip olmasıdır. Gerek Hz. Peygamber döneminde yaptıklarıyla gerek sahabe dönemi ve halifeliği süresince yaptıklarıyla ve gerekse Ondan sonraki devirlerde yaşayan fakihlerin ilgisini çekmesiyle, İslam hukukunun oluşum sürecine katkı sağlamıştır.Çalışmamız giriş ve üç ana bölümden oluşmaktadır.Birinci bölümde, Hz. Ali'nin hayatını ve İslam Fıkhının oluşum evrelerini inceledik. Hz. Ali'nin Hüküm verirken izlediği metodu tesbit edip, bu metodun pratikteki uygulamalarını verdik.İkinci bölümde ise Hz. Ali'nin hüküm ibadetlere dair fetvaları, rivayetleri, görüşleri, hükümleri, ictihadlarının mezheplere yansımasını işledik. Hanefi mezhebinin Hz. Ali'den çokça etkilendiğini tespit ettiğimizden bu konu üzerinde ayrıca durduk.Üçüncü bölümde Hz. Ali'nin Muamelat ve ukubata dair görüşlerini inceledik. Konuyla ilgili tasnifler yapıp, Hz. Ali'nin bu alandaki rolünü gösterdik.Bütün bunlardan hareketle Hz. Ali'nin İslam hukukunun teşekkül sürecine katkıda bulunduğunu, etki ettiğini savunabiliriz."
