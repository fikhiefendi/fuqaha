abstract: "Zehebî'nin rahle-i tedrîsatından geçen isimlerden biri olan Tâcüddîn es-Sübkî'nin Şâfii tabakât yazıcılığının en hacimli eserlerinden birisi, Tabakâtü'ş-Şâfiiyeti'l-kübrâ isimli eseridir. Bu eserde hocası Zehebî'den pek çok nakilde bulunmakla birlikte ona itirazları da vardır. Bu itirazların; cerh-ta'dil, biyografiye dair bilgiler, kaynaklar, üslup, yöntem ve bunun gibi konularla ilgili olduğu görülmektedir. Söz konusu itirazların bir kısmı Sübkî'nin isabetli olduğunu gösterirken diğer bir kısmı da Zehebî'nin aktardığı bilgilerin sıhhatini yansıtmaktadır. Bunların yanı sıra mezhep hususunda da bazı itirazlar görülmektedir ki bunlar en ağır ifadeler içeren itirazlardır. Şâfii-Eş'arî olan Sübkî, Hanbelî görüşlerine şiddetli bir meyli olduğunu belirttiği hocası Zehebî'yi özellikle Eş'arî alimlerin biyografilerini doğru ve yeterli düzeyde aktarmamakla itham edip hocasını sert ifadelerle eleştirmektedir. Bu eleştiriler, diğer kaynaklar çerçevesinde değerlendirildiğinde ise diğer eleştirilerde olduğu gibi tamamı için bir tarafın görüşünün tercih edilemeyeceği görülmekte; iki alimin de kendi bakış açısına uygun değerlendirmeler yaptığı anlaşılmaktadır. Zehebî'nin mutlak anlamda Eş'arî ve Şâfiî alimlerin haklarını ihlal ettiğini ileri sürmenin mümkün olmadığı ancak bazı alimlerin biyografilerini gerekenden kısa verdiği ve her alimin görüşüne aynı şekilde müsamahalı yaklaşmadığı, Sübkî'nin ise hocasına yönelttiği bazı itirazlarda haklı iken genelleme yaparak tepkisel ve mübalağalı bir tavır içerisinde olduğu görülmektedir. Ayrıca Sübkî'nin bazı haklı itirazlarla birlikte edebî yönünün ve mezhebine bağlılığının etkisiyle hocasını ağır ifadelerle eleştirdiği; Zehebî'nin ise onun iddia ettiği düzeyde gayr-i âdil bir tutum sergilemediği anlaşılmaktadır."
