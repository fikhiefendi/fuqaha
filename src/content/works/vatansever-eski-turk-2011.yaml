abstract: "Boşanma, evliliğin sona erme şekillerinden birisidir ve tarihsel süreç içerisinde toplumdan topluma ve zamana göre değişim geçirmiştir. Bu değişim sürecinde birçok sistem ve ilke benimsenmiştir. Eski Türk Hukukunda irade ilkesine dayalı, serbest boşanma sistemi hakimken; günümüz Türk Hukukunda, kusur, irade, temelden sarsılma, elverişsizlik ve fiili ayrılık ilkelerinin hepsinden yararlanılarak oluşturulan, boşanmayı belli sebeplere ve hâkim hükmüne dayandıran sistem hakimdir.İslamiyet'ten önceki Türk Hukukunda koca sebep bildirmeden, kadınsa zina, fena muamele, iktidarsızlık gibi sebeplere dayanarak boşanma talep edebiliyordu. İslamiyet'in kabulüyle birlikte Türk Hukukunda, İslam Hukuku kuralları uygulanmaya başladı. Bu devirde boşanmalar çoğunlukla talak (erkek tarafından boşama) ve muhalaa (karşılıklı rızayla boşanma) yoluyla gerçekleşiyordu. 1917 tarihli Hukuk-i Aile Kararnamesi'nin kabulüyle birlikte, Türk Boşanma Hukukunda yeni bir döneme girildi ve günümüzdeki boşanma sebeplerine benzer boşanma sebepleri Kararname'de düzenlendi. Buna göre artık kadınlar; evliliğe engel fizyolojik bir kusur veya hastalık, kocanın nafaka borcunu yerine getirmemesi, gaiplik ve geçimsizlik nedenleriyle mahkemeden boşanma talep edebiliyordu.Günümüzde ise Türk Medeni Kanunuyla; zina, hayata kast, pek kötü veya onur kırıcı davranış, suç işleme ve haysiyetsiz hayat sürme, terk ve akıl hastalığı özel boşanma sebepleri olarak; evlilik birliğinin temelinden sarsılması, eşlerin anlaşması ve ortak hayatın yeniden kurulamaması genel boşanma sebepleri olarak düzenlenmiştir.Eski ve yeni her iki hukuk sisteminde de boşanmayla birlikte, eşler ve çocuklar bakımından bir takım sonuçlar doğmaktadır."
