abstract: "Bu çalışma, bireylerin finansal farkındalık düzeylerini, kitle iletişim araçlarının etkisini ve İslami finans sisteminin yatırım kararlarına olan yansımalarını incelemektedir. Finansal farkındalık, bireylerin finansal ürünler, fırsatlar ve riskler hakkında bilgi sahibi olmasını sağlayan bir süreçtir. Çalışma, finansal farkındalığın bireylerin daha bilinçli kararlar almasını kolaylaştırdığına ve toplumsal refaha katkıda bulunduğuna dikkat çekmektedir. Ancak, finansal sistemin karmaşıklığı ve bilgiye erişimdeki dengesizlikler, bireylerin farkındalık düzeylerini sınırlandırmaktadır. Kitle iletişim araçları, bireylere finansal bilgiye erişim sağlarken aynı zamanda bilgi kirliliği ve algı yönetimi gibi sorunları da beraberinde getirmektedir. Bu araçların sağlıklı bilgi aktarımı sağlaması, yatırımcıların doğru yönlendirilmesi açısından kritik öneme sahiptir. İslami finans, faiz yasağı gibi ilkeleriyle Müslüman yatırımcılar için alternatif bir yaklaşım sunmaktadır. Ancak, faizsiz finansman yöntemlerinin sınırlı uygulanabilirliği ve sermaye piyasalarındaki kısıtlılıklar, özellikle gelişmekte olan ülkelerde yatırım kararlarını etkilemektedir. Çalışma, finansal farkındalık ve eğitimle bireylerin yatırım kararlarında rasyonel davranmalarını sağlamayı, kitle iletişim araçlarının bilgi paylaşımındaki rolünü geliştirmeyi ve İslami finans sisteminin yaygınlaştırılabilirliğini artırmayı hedeflemektedir. Bu üçgen içerisinde yer alan dinamiklerin yatırımcı algısı üzerindeki etkileri analiz edilerek, bireysel ve toplumsal finansal refahın artırılmasına yönelik öneriler sunulmaktadır."
