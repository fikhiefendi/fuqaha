abstract: "Bu araştırma، planların üzerinde gayrimenkul satış sürecini، satış kavramını، kökenini، gelişimini، türlerini، amacını، önemini ve karşılaştığı riskleri göstermektedir. Aynı zamanında bu araştırma siyasi، ekonomik، sosyal، hukuki planlar ve dini üzerinde gayrimenkul satışı gerçeğini gösteriyor، hemde ekonominin faaliyeti zorlukları karşı karşıya olduğu odaklandı، bu zorluklarından kurtarabilmek için bir yol oluşturarak، devletin emlak piyasasını kontrol etmesini ve ekonominin performansı iyileştirmesini bir çözüm oluşturdu. Ayrıca، çalışmanın içinde faaliyet yasal ve dini düzenlemeyi ayarlayarak ve karşılaştığı yasal zorlukları ele almaya odaklanarak، ve sonunda ilişkin satış sözleşmesi için bir model sağlanmak . Bu faaliyeti için uygun yasal ve dini uygun bir satiş sözleşmesini göstermiştir"
