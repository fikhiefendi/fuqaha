abstract: "İslam ülkelerinde özellikle kapitalizmin dünya ekonomisini tesir altına almasıyla beraber, ekonomik sistemlerde faizli bankalar yerini almış ve kökleşmeye başlamıştır. Bu kökleşmeye ve hızlı büyümeye rağmen müslüman toplumlar özellikle hıristiyan toplumlar gibi faizin haram oluşunu bir kenara atmamıştır. Müslüman toplumların ellerinde bulunan tasarruflar yastık altı diye tabir edilen kayıt dışı ekonomik alanlarda kalmıştır. Bu sebepten dolayı ülkeler ihtiyaç duyduğu sermayeyi temin edebilmek için dış borca ihtiyaç duymuştur. Bu durum ise çoğunluğu müslüman toplumlardan oluşan ülkelerin dışa bağımlılığını artırmıştır. Bu çalışmada, Türkiye‟de faaliyet gösteren katılım bankaları ile geleneksel bankaların hem bankacılık hizmetleri yönünden hem de muhasebe uygulamaları açısından karşılaştırmasını yapmayı amaçlamıştır. Çalışma tarama modeli kullanılarak literatür taraması incelemesiyle gerçekleştirilmiştir. Tarama modeliyle, gözlem yapılıp katılım bankaları ile geleneksel bankacılık uygulamaları arasındaki ilişkiler tespit edilmiştir. Yapılan karşılaştırmalar sonucunda katılım bankaları ile geleneksel bankaların birbirlerine önemli ölçüde benzedikleri görülmektedir. Bu benzerliklerin önemli sebebi aynı mevzuata tabi olmalarından kaynaklanmaktadır. Temeldeki farklılıklar bu bankaların uygulanış şekli ve sistemlerinde farklılıkların olmasıdır."
