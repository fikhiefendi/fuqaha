abstract: "Bu araştırma XII. yüzyılda Mâverâünnehir bölgesinde yaşamış olan Mergînânî ve onun en önemli eseri olan el-Hidâye'nin muâmelat konularının örfe ve Âdet dâir hükümleri hakkındadır. Eserin bu bölümünde yer alan örf ve âdetle ilgili hükümler tezin ana konusunu oluşturmaktadır. Bu çalışma, bir giriş ve üç bölümden oluşmaktadır: Giriş kısmında konun önemi, sınırlandırılması, amacı, kaynak ve yöntemi hakkında genel bilgi verilmiştir. Birinci bölümünde Mergînânî'nin hayatı, hocaları, talebeleri, ilmi şahsiyeti, yaşadığı dönem ve el-Hidâye'nin şerhleri hakkındaki bilgiler genel olarak aktarılmıştır. İkinci bölümde, örf ve âdet kavramı üzerinde durulmuş, örfün kaynak olma değeri ve çeşitleri anlatılarak Hanefî mezhebinde örfün yeri konusuna ana hatlarıyla diğerlendirilmiştir. Üçüncü bölüm ise, tezin ana bölümünü oluşturmaktadır. Bu bölümde örf ve âdet ile ilgili konuları başlıklar halinde tasnif edilerek örf ve âdete dâir hükümler, konularına göre ele alınıp incelenmiştir."
