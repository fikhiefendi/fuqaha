abstract: "İslam hukuku,Şari'nin emirlerinin uygulanabilmesi konusunda dini hükümlerin tespitini yapan ve yorumlayan bir ilim dalıdır. İslam hukukçuları tarafından bu tespitler yapılırken bir takım metot ve prensipler geliştirilmiştir. İnsanların günlük hayatta sıkıntı ve meşakkâtle karşı karşıya kaldığı durumlardanasslarda işaret edilen çıkış yolları kullanılarak çözümler üretilmiştir. İşte bu çözüm yöntemlerinden biri de umûmü'l-belvâ ilkesidir. Bu kavram İslam hukuk literatüründe, insanların maruz kaldığı ve toplumda yaygın hale gelmiş olan sıkıntı ve meşakkâtler olarak tanımlanmaktadır. Dolayısıyla umûmü'l-belvâ, İslam hukukçularının fürû hükümlerde hafifletici sebep olarak sıkça kullandığı bir ilke haline gelmiştir. Çalışmamızda dini hükümlerin hafifletilmesinde bir yöntem olarak kabul edilen umûmü'l-belvâ'nın mahiyeti, meşruiyeti, şartları ve sebepleri, kolaylaştırdığı fürû-i fıkıh konuları örnekler verilerek değerlendirmeye çalışılmıştır."
