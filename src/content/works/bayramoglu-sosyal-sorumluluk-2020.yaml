abstract: "Borç ilişkisi her toplumda geçmişten günümüze var olan bir uygulamadır. Verilen borçtan beklenen kâr ya da menfaat sebebiyle faiz kavramı ortaya çıkmıştır. Faiz haksız kazanç türlerinden biridir ve İslam'da yasaklanmıştır. Faizli borç yerine karz-ı hasen tavsiye edilmiştir. Karz-ı hasen güzel borç demektir ve İslam hukukunda standart olarak alınan borcun misli ile iade edilmesini ifade etmektedir. Karz-ı hasenin hedefi Allah rızası için borç talep eden kişinin ihtiyacının faizsiz şekilde giderilmesidir. Karz-ı hasen borç verene bir kâr sağlamadığı için İslami finans kurumlarında faizsiz borç verme uygulamalarına sık rastlanmamaktadır. Türkiye'de faizsiz borç ilişkileri genellikle güvene dayalı ve gayriresmî şekilde kurulmaktadır. Resmî olan karz-ı hasen yapıları ise daha çok sivil toplum kuruluşları, vakıflar ve özel şirketlerde sadece bu yapıya üye olanlarla yürütülmektedir. Dünyada ise bazı ülkelerde karz-ı hasen yapılarının kurumsallaştığı görülmektedir. Çalışmanın amacı, bazı karz-ı hasen örneklerinin işleyişlerini inceleyerek, Türkiye'de karz-ı hasenin diğer ülkelerde olduğu gibi kurumsallaşmasının mümkün olup olmadığını araştırmaktır. Bu amaçla dünyadan dört resmî, Türkiye'den dört gayriresmî ve dört resmî örnek seçilmiştir. Gayriresmî örnekler, katılımcıları ile yapılan görüşmelerden elde edilen bilgilerle incelenmiştir. Diğer örnekler resmî internet sitelerinden ve uygulamaların yönetim kurulu başkanları ile yapılan mülakatlardan elde edilen bilgilerle ortaya koyulmuştur. Karz-ı hasen fonları, kuruluş tarihi, üye sayısı, fon kullandırma şartları, fonun sürdürülebilir olması için alınan önlemler gibi değerlendirmelere tabi tutulmuştur. Son olarak Türkiye'de karz-ı hasenin kurumsallaşması için önerilen bazı modellere yer verilmiştir."
