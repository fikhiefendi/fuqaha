abstract: "Takdîrî durumun ele alındığı bu tezde takdîrî durumun tarihsel süreçteki durumu, naslardaki görünümü, usul yöntemleriyle ilişkisi, mahiyeti, uygulama türleri ve bu uygulamaları gerekli kılan sebepler, çalışma kapsamında tetkik edilen ana konulardır. Bu doğrultuda Hanefî fıkıh ekolünün genel yaklaşımı, Kâsânî'ye ait Bedâiʽuʽs-sanâiʽ isimli eser odaklı olarak tespit edilmeye çalışılmıştır. Ancak olgunun mahiyet ve kapsamına ilişkin tespit ve değerlendirmelerde Bedâiʽ ile sınırlı kalınmamış başta temel naslar olmak üzere İmam Muhammed'in el-Asl'ından Mecelle'ye uzanan süreçte genel anlamda Hanefî ekolünü temsil eden fürû fıkıh eserlerine de müracaat edilmiştir. Takdîrî durum; ayet, hadis, sahabe uygulamaları ve fukaha ictihadlarında sıklıkla görülmesine rağmen bir teori olarak açıkça ortaya konulamamış, fıkıhtaki diğer kavram ve kurumlar kadar geliştirilememiştir. Şimdiye kadar Hanefîler dışında yapılan çalışmalarda takdîrî durumun mahiyet ve kapsamına ilişkin teorik çerçevenin tam olarak oluştuğu da söylenemez. Kâsânî odaklı Hanefî anlayışına göre takdîrî durumun tanımı, tasnifi, kapsamı ve usûl-i fıkıh ilmindeki yeri diğer ekol anlayışlarına nazaran bazı farklar taşır. Takdîrî durumun bir yöntem olarak büyük ölçüde istihsan kapsamında yer alması; olguda hâkim olan mantığın pek çok fıkıh kuralında ve asıl-bedel, bütün-parça, sebep-sonuç gibi çeşitli bağıntılarda kullanılması, kanaatimizce onun müstakil bir kavram olarak ele alınması ihtiyacını ötelemiştir. Takdîrî durum, şer'î bir hükmün uygulanması sürecinde Hanefîlerin sıklıkla başvurduğu bir ictihad yöntemidir. Bu yöntem, \"şer'î bir hükmün müteallakı olan mevcutlara ilişkin belirsizliklerin giderilmesi ve hükme konu olan şeye ilişkin gerçekteki durumun meşru gerekçeler uyarınca bulunduğundan farklı bir konumda değerlendirilmesi\" olarak tanımlanabilir. Buna göre takdîrî durum, bir mevcudun durumuna ve bir şeyi konumlandırmaya yönelik olarak iki kısımdan oluşur. Mevcudun durumuna yönelik takdirler, hükmün uygulanmasında rolü bulunan unsurların belirsizlikten arındırılmasını konu alır. Bir şeyi konumlandırmaya yönelik takdir uygulamaları ise, bir mevcudun madum ya da başka bir mevcut konumunda takdiri ve madum olan bir şeyin mevcut konumunda takdiri varyasyonlarından oluşur. Nass, acziyet, özür, zarûret, zorluk, ihtiyaç, ikrah, ihtiyat, bilginin kesinliği, kolaylaştırma, hukûkî istikrar ve sistemsel bütünlük, kamu düzeninin tesisi ve korunması takdîrî durum uygulamalarının temel gerekçeleridir. İstihsanın sıklıkla kullanımı, Hanefî ekolünün karakteristik bir özelliğidir. Konumlandırmaya yönelik takdir uygulamalarına sıkça başvurmanın da özellikle klasik dönem Hanefîlerinde karakteristik bir özellik olduğu görülmektedir. Kanaatimizce takdîrî durum uygulamaları dikkate alınarak, günümüz meselelerine yönelik daha hızlı ve pratik çözümler üretilebilir."
