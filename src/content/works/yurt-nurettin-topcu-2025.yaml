abstract: "Bir soğuk savaş dönemi düşünürü ve çağdaş Türk düşüncesinin en mühim isimlerinden biri olan Nurettin Topçu, ahlâk felsefesi uzmanı olarak iktisâdî yozlaşmaların tenkidini yaparak iktisadı ahlâkî bir okumaya tâbi tutmuştur. Bu bakımdan İslâm İktisadı disiplini ve bu alanın uzmanları böyle bir Türk münevverinin ahlâkî iktisadından istifade etmelidir. Günümüze kadarki çalışmalarda Nurettin Topçu pek çok alanda sıkı bir devlet müdâfaacısı olarak tavsif edilmiştir. Devlet, onun söz konusu iktisâdî tasavvurunun da nâzırı konumundadır. Fakat hangi alanlarda ne gibi düzenleyici-denetleyici rolü mevcuttur? Bu soru araştırmamızın temel problematiğini resmetmektedir. Diğer taraftan, son yıllarda konvansiyonel ekonomi uzmanlarının da ortaya koyduğu çalışmalar göstermiştir ki; iktisat ve ahlâk su götürmez bir biçimde yakın ilişki içerisindedir. Binaenaleyh Nurettin Topçu'nun, iktisadı ahlâk süzgecinden geçirmesi, bize bu ilişkide yeni bir perspektif kazandırabilir. Bu amaçları gerçekleştirebilmek için metot olarak nitel yöntem benimsenmiştir. Veri analiz aracı olarak betimsel analiz ve içerik analizi benimsenerek araştırmamın temel problematiği tahlil edilmiştir. Nihayetinde; Nurettin Topçu'nun iktisâdî sistem mekanizmasının onun ahlâk nizâmında gömülü bulunduğu tespit edilmiştir. Dahası, onun iktisâdî sistem tasavvurundaki devlet mekanizmasının, sekiz farklı alanda denetleyici-düzenleyici rol üstlendiği belirlenmiştir. Fakat bu 'iktisâdî devletçilik' vurgusunun konjonktürel olduğu, çalışmamın bir diğer mühim bulgusudur."
