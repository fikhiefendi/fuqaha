abstract: "“Usûl-i fıkıh Literatüründe Taklit Kavramının Analizi”adlı çalışmada, Allah'ı bilme, O'na iman etme ve diğer usûlü'd-dîn meselelerinde taklidin hükmü ve anılan konularda nazar ve istidlalde bulunmanın hükmü beyan edilerek usûlü'd-dîn ve fürû' alanında“taklit”konusu irdelenmektedir. Öte yandan tezimizde taklit yoluyla İslam'a giren mukallit kimselere mümin denilir mi denilmez mi konusu incelenmek suretiyle mukallit kimselerin imanı konusunun hükmü açıklanmaktadır. Avam kimseler ve içtihat derecesine ulaşmamış âlimlerin dinin fürû' meselelerinde müçtehitlerden fetva alarak onları taklit etmesi mi veya bizzat kendileri mi içtihat etmeleri vaciptir? Çalışmamızda tüm bu meseleler ilmî bir metotla ele alınmış olup konuyla ilgili mezheplerin görüşlerine kaynaklarına başvurarak tüme varım ile mezhepler arasında karşılaştırmalı ve objektif bir şekilde çözümleme yöntemi ile analiz edilmiş ve bunlardan delilleri güçlü olan görüş tercih edilmiştir. Çalışmanın amacını gerçekleştirmek için konunun tüm yönlerini kapsayacak uygun bir plan dâhilinde araştırmacının hareket etmesi gerekmektedir. Birinci bölümde taklidin tanımı, ortaya çıkışı, önemi, taklit ile ittiba' arasındaki farka değinilmiştir. İkinci bölümde usûlü'd-dîn alanında nazar ve taklidin hükmü, mukallidin imanı konusunun yansıra dinin fürû' alanında içtihat ve taklidin hükümleri irdelenmiştir. Yapılan araştırmalardan sonra ilim ehlinin usûlü'd-dîn meselelerinde ihtilaf ettiği sonucuna ulaşılmıştır. Bir grup ulama, usûlü'd-dîn meselelerinde taklit etmeyi vacip görerek mezkûr konularda mukallidin taklit yoluyla iman etmesinin sahih olduğunu düşünmektedir. Cumhur ulamasına göre ise avam veya müçtehid olan kimselerin usûlü'd-dîn meselelerinde taklit etmesini caiz görmez iken aynı cumhur ulaması mukallidin imanı noktasında ise ihtilaf etmiştir. Mutezile ekolüne göre usûlü'd-dîn meselelerinde mukkallidin imanı sahih değil iken Eş'arî ve Mâtürîdî ekolleri ise anılan durumda mukkallidin imanının sahih olduğunu ancak nazarı terk etmesi nedeniyle günahkâr olacağı konusunda ittifak etmiştir. Dinin fürû' meselelerinde bir grup ulama içtihat etmeyi vacip, taklit etmeyi caiz görmezken diğer bir takım âlim ise mezkûr meselelerde içtihat etmeyi caiz görmemektedir. Cübbâî sadece içtihat etmenin caiz olduğu fürû' meselelerinde taklit etmenin caiz olduğunu savunurken fukaha ve mütekellimin cumhuru ise avam olan kimsenin dinin tüm fürû' meselelerinde müçtehit olan kimseyi taklit etmesini vacip olduğunu savunmaktadır."
