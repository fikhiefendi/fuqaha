abstract: "Türkiye'de katılım bankaları ve katılım bankacılığına verilen önem son dönemde giderek artmaktadır. Dünyada 20. y.y.'ın ikinci yarısından sonra finansal sistemde kendisine yer bulan faizsiz bankacılık Türkiye'de de son 20 yılda giderek artan payı ile finansal sistemdeki yerini almaya başlamıştır. Buradan hareketle bu çalışmada Türkiye'de ve dünyada katılım bankacılığının gelişimi ve Türkiye'de panel veri analiz yöntemiyle 2010-2017 yılları arası 3'er aylık dönemlere ilişkin veriler kullanılarak katılım bankalarınn kullandırdığı fonların reel makroekonomik göstergeler üzerindeki ( ithalat, ihracat, faiz oranı, ekonomik büyüme, gayrisafi yurt içi hasıla, istihdam, hane halkı tüketim harcamaları ve yatırımlar) etkileri analiz edilmiştir. Analiz sonuçları göstermiştir ki katılım bankalarının kullandırdığı fonlar Türkiye ekonomisinin dış ticaretini, istihdamını, arz ve talep cephesine ilişkin göstergeleri pozitif yönde etkilemektedir."
