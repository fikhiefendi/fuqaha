abstract: "Bu tez; evlilikte, evlilik hayatını sürdürmeyi imkânsız kılacak bir takım problemlerin olması, kadınların başına gelebilecek maddi ve manevi zararla beraber evlilik hayatının devam etmesi ve evlilikten beklenen amaçların sona ermesi durumlarında kadınların boşanma ve ayrılmayı talep etme haklarını incelemektedir. Bunun yanı sıra boşanma gerçekleştikten sonra söz konusu olacak hakları da ele almaktadır. Tezde konular işlenirken dört mezhebin görüşlerinden bahsedilmiş ve ardından bu görüşler, 1959 tarihinde düzenlenmiş Irak Ahvâl-i Şahsiyye Kanunu ile mukayese edilmek suretiyle her meselenin sunumunda İstikrâya(Tümevarım) dayalı metot benimsenmiştir. Araştırmacı tezinde kadının; kocasında bulunan bir hastalık, evlilikten sonra gerçekleşen bir problem, geçimsizlik, hak ihlali ve araştırmada detayı verilen diğer bir takım kusurlar sebebiyle kocasından ayrılmayı talep edebileceği birçok nokta olduğu sonucuna varmıştır. İslam fıkhı bu noktaları kadınlara bir çıkış kapısı yapmış ve boşanma olması durumunda onlara maddî ve manevi bir takım haklar sağlamıştır. Ayrıca araştırmacı, evlilikte ortaya çıkan problemler karşısında kadın için daha iyi olanı mümkün kılacak; zarar, günah ve haksızlık olmadan ayrılma hakkını nasıl talep edeceğine dair birtakım fıkhî hükümlere ulaştığı gibi boşanmanın gerçekleşmesi durumunda haklarını talep edeceğine dair de bir takım hükümlere ulaşmıştır. Bunun yanında kadınların mevcut zor şartlardaki durumları göz önünde bulundurulmuş ve onlara gelebilecek zarar giderilmek istenmiştir. Bu da Irak Ahvâl-i Şahsiyye Kanununda yasal bir boşluğun olduğu ve hak sahibinin hakkını almasına mani olacak maddeler üzerinde, bazen dört İslam Hukukçusunun İcmâsı ile sabit bir hükme uygun, bazen de fıkıh ekollerinden birinin görüşüne uygun olan bazı düzenlemeler önerilerek yapılmıştır. Bunun sebebi ise Irak toplumu özelinde söz konusu olan şart ve durumların değişmesidir. Araştırmacı aynı zamanda, İcmâ' ile sabit olan veya realiteye uygun olup İslam Hukukçularından birinin görüşü ile sabit fıkhî bir hükme uygunluk arzeden ve bir takım düzenlemeler önermediği kanunları da açıklamıştır."
