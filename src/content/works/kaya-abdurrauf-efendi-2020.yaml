abstract: "1915-1927 yılları arasında Sivas Müftülüğü yapan Abdurraûf Efendi'nin 1926-1927 yılları arasında kayıt altına alınan ve Sivas Ziyabey yazma eserler kütüphanesinde bulunan fetva sicillerini konu edinen araştırmamız, dönemin fıkıh anlayışı hakkında vereceği fikir ve fıkha yapacağı mutevazı katkı yanında Cumhuriyet'in ilk yıllarındaki Sivas'ın ve Türkiye'nin dini, sosyal ve ahlaki hayatına ışık tutması bakımından da önem taşımaktadır. Bir giriş, iki bölüm ve eklerden oluşan çalışmamızın birinci bölümünde; Abdurraûf Efendi'nin hayatı ve Sivas'ın o dönemdeki çeşitli yönlerden durumu hakkında bilgi verilmiştir. İkinci bölümde, Abdurraûf Efendi'nin fetva defteri hakkında genel bilgilerin yanı sıra fetva, fetva eminliği vs. konularının tanımı, fetva defterinde sorulan soruların tarihlere, mahallelere, köylere göre tasnifi tablolar halinde verilmiştir. Ayrıca, fetva defterinde yer alan konuların fıkıh bablarına göre tesbiti yapılarak her konudan bir fetva aynen verilerek açıklanmıştır. Son olarak fetva defterinin İslam hukuku ve sosyal açıdan değerlendirilmesi yapılarak çıkarımlarda bulunulmuştur. Ekler kısmında ise, fetva defterinin latinizesi ve orijinal metninin fotofilmleri yer almaktadır. Abdurraûf Efendi'nin sözkonusu yılları kapsayan fetva defterinde mîras, nikah, talak vb. konularda toplamda 477 soru ve cevap yer almaktadır. Sivas'ın merkez mahallelerinden ve çevre köylerinden geldiği görülen sorulara Abdurrauf Efendi hanefi mezhebi içtihadına göre fetva vermiştir. Fetvalarının bazılarında Arapça açıklamalar veya iktibaslar yer almakta olup ardından İbrahim Halebi'nin Mülteka'l-Ebhur, Secâvendî'nin Sirâciyye, Çatalcalı Ali Efendi'nin Fetâvâyi Ali Efendi, Molla Hüsrev'in Dürerü'l-Hükkâm, Hasen b. Mansûr b. Mahmûd el-Özkendî'nin Fetâvâyi Kâdihan'ı gibi bazı klasik muteber Hanefi fıkıh ve fetva kitapları da kaynak olarak gösterilmiştir. Fetva defterinin yazılmaya başladığı dönemde henüz harf inkılabı gerçekleşmediğinden eserimizin tamamı Osmanlı Türkçe'si ile yazılmıştır. Bazı fetvalarda Arapça eserlerden nakiller yapılarak kaynağın ve yazarın ismi zikredilmiştir. Fetvaların ağırlıklı olarak miras, nikah, talak vs. konularında olduğu ve az sayıda da gayri müslimlerden gelen fetvalar olduğu dikkat çekmektedir."
