abstract: "Roma Hukuku, ulusal sınırlarını aşarak birçok hukuk sistemini etkilemiş, modern kanunlaştırmalara esas teşkil etmiştir. Roma hukukunun, modern hukukumuz bakımından etkisini en çok gösterdiği alan Borçlar Hukuku'dur. Borçlar hukukumuzda mevcut borç, sorumluluk, sözleşme gibi temel kavramlar, kurum ve kurallar Roma hukukuna dayanmaktadır. Çalışmamızın konusunu oluşturan vedia sözleşmesi Roma'da günlük hayatta geniş bir uygulama alanı bulmuş, bu özelliğiyle de Roma Borçlar Hukuku alanında önemli bir konuma sahip olmuştur.Türk hukukunda ise, eski dönemlerde vedia sözleşmesi gelişmiş bir sözleşme türü olarak yer almıştır. Fıkıh kitaplarının derlenmesi suretiyle hazırlanmış temel bir kanun olan Mecelle'nin Üçüncü Kitabı, Kitabul Emanat bölümünde 762 ve devamı maddelerinde ( m.762-803 ) ayrıntılı bir şekilde düzenlenmiştir. Vedia sözleşmesi Türk Borçlar Kanununun 19. babında vedia başlığı altında, 463-470 maddeleri arasında düzenlenmiştir. Aynı başlık altında yine vedia sözleşmesinin temel özelliklerini içeren fakat kendine has özellikleri olan; Yediemine Tevdi, Usulsüz Tevdi, Ardiye Mukavelesi, Otelciye Tevdi başlıkları altında düzenlenen sözleşmeler bulunmaktadır.Bu tezin amacı, Roma Hukuku'nda düzenlenen vedia ve vedia benzeri sözleşmeler ile Türk Hukukunda mevcut vedia ve vedia benzeri sözleşmeler hakkında genel nitelikte bilgi vermek, aynı sözleşme türü açısından iki hukuk sistemindeki benzerlik ve farklılıkları ortaya çıkarmaktır.Tez; giriş, dört bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde konunun tanıtımı yapılmakta, amacı, kapsamı ve işleniş sırası belirlenmektedir. Türk ve Roma Hukukunda sözleşme ve sözleşmeler sistemi başlıklı birinci bölümde; iki hukuk sistemine göre sözleşme tanımı yapılarak mevcut sözleşme sistemleri hakkında açıklamalar yapılmaktadır.Genel olarak Türk ve Roma hukukunda vedia sözleşmesi başlığı taşıyan ikinci bölümde; Türk ve Roma hukukunda vedia sözleşmesinin tanımı, özellikleri ve tarihi gelişimi hakkında açıklamalar yapılarak iki hukuk sistemindeki benzerlik ve farklılıklar ortaya konulmaktadır.Vedia sözleşmesinin hükümleri ve sona ermesi başlıklı üçüncü bölümde ise; her iki hukuk sisteminde, vedia alan kişinin hakları ve borçları, vedia verenin hakları ve borçları karşılaştırmalı olarak incelenerek vedia sözleşmesinin hangi koşullarda sona ereceği üzerinde durulmaktadır. Vedia benzeri sözleşmeler başlıklı dördüncü ve son bölümde; usulsüz tevdi sözleşmesi, yediemine tevdi sözleşmesi, otel, ahır ve garaj işletenlere tevdi sözleşmesi, ardiye sözleşmesi, zaruri vedia sözleşmesi çeşitli yönleriyle irdelenmektedir. Sonuç kısmında ise, bütün tez kapsamının kısa bir özeti yer almaktadır."
