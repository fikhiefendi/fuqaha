abstract: "Şevkânî'nin Fethu'l-Kadîr Tefsirinde Hz. Âişe'nin Rivayetleri isimli çalışmamız, bir giriş ve üç bölümden oluşmaktadır. Araştırmamızın giriş bölümünde, yapılan tezin önemi, amacı, yöntem ve kaynaları hakkında bilgi verilmiştir. Birinci bölümde kısaca Hz. Âişe'nin hayatından ve genel anlamda ilmi birikiminden detaylara girilmeden bahsedilmektedir. İkinci bölümde; Kur'an'ı Kuran'la tefsiri, Kur'an'ı sünnet'le tefsiri, ictihâdı, sebeb-i nüzûl bilgisi, kırâat ve nesh'le ilgili rivayetleri ele alınarak Hz.Âişe'nin tefsirci yönü ortaya konmaya çalışılmıştır. Üçüncü bölümde; Fethu'l-Kadîr tefsirinde, Hz. Âişe'nin fıkhî konularla ilgili rivayetleri, muamelatla ilgili rivayetleri, Hz. Peygamber'in hanımları ile ilgili rivayetleri, ahvâl-i şahsiyye ile ilgili rivayetleri, Fezâilü'l-Kur'an ile ilgili rivayetleri ve son bölümde ise tek başlık altında toplanamayacak çeşitli konular'a dair rivayetleri yer almaktadır. Yapılan araştırma sonunda Fethu'l-Kadîr tefsirinde Hz. Âişe'nin; yüz elli dört ayette, ikiyüz onaltı rivayeti olduğu tespit edilmiştir. Çalışmamızda bunların hepsi incelenerek farklılıklarına dikkat çekilmiştir. Hz. Âişe'nin Kur'an'ı Kerim'i tefsir etme metodu araştırılarak, onun tefsir alanına katkıları ve nasıl bir müfessir olduğu örneklerle açıklanmıştır."
