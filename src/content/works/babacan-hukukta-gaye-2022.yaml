abstract: "“Hukukun gayesi ne olmalıdır?”sorusuna her çağda farklı cevap verilmektedir. Bu farklılık üzerinde etkili olan hususlar, hukukçunun içinde bulunduğu toplumun dini, siyasi, sosyal, ekonomik ve kültürel yapısıyla birlikte hukukçunun bundan ne ölçüde etkilendiği meselesidir. Çalışma farklı yüzyıllarda ve farklı coğrafyalarda yaşayan fakat hukukun gayesini, maslahat/fayda ilkesi ile açıklayan İzz b. Abdüsselâm ve Jeremy Bentham'ın anlayışları üzerinden aktarılmıştır. Bu ilkeye bakış açıları arasındaki ortak ve farklı yönler dikkate alındığında hangi konularda uzlaşı sağladıkları ya da hangi konularda ihtilaf ettikleri ortaya konulmaya çalışılmıştır. Çalışmanın ilk bölümü çalışmaya konu olan hukukçuların söz konusu ilkeyi hukuk, din ve ahlâk açısından nasıl tanımladığının yanında insanın fıtri doğasının hukuk üzerindeki yansımasının nasıl olduğu üzerinde durmaktadır. İkinci bölümde ise hukuku ve hukukun gayesi tanımlarının arka planındaki düşünce sistematiğini hangi zemin üzerinde kurguladıkları açıklanmaya çalışılmıştır. Düşüncelerinin şekillenmesinde etkili olan unsurların genel çerçevesini hukukun biçimsel ve içeriksel boyutu ile hukukunun din ve ahlâkla olan ilişkisinin sonucu olarak görülebilecek hususlar ele alınmıştır."
