abstract: "Bu çalışma, Libya'da İslami bir menkul kıymetler borsası oluşturma olasılığını incelemekte ve bunun için gerekli temel unsurları belirlemektedir. Bu unsurlar arasında yasal ve düzenleyici çerçeve, şeriat uyumlu yönetişim ve uygun altyapı yer almaktadır. Çalışma, literatür taraması ve başarılı deneyimlerin incelenmesi gibi analitik-deskriptif bir yöntemin yanı sıra Libya piyasasında faaliyet gösteren ve işlem yapan 57 kişiyle yapılan anketleri kullanmıştır. Sonuçlar, Libya'nın İslami bir finans piyasası kurmak için orta düzeyde uygun bir ortama sahip olduğunu göstermektedir. Ayrıca, Libya'nın iş ortamı ile bu modelin desteklenebilirliği arasında pozitif bir ilişki olduğu belirtilmiştir. Çalışma, piyasanın yasal çerçevesi, şeriat uyumlu yönetişim ve şeriatla uyumlu finansal araçların varlığı gibi temel gerekliliklerin sağlandığını ortaya koymuştur. Araştırma, bu projenin başarısını sağlamak için altyapının güçlendirilmesi, ekonomik iklimin iyileştirilmesi ve global deneyimlerden faydalanılmasını önermiştir. Ayrıca, çıkar çatışmalarını azaltmak ve Libya'daki İslami finans piyasasının etkinliğini sağlamak amacıyla şeriat uyumlu yönetişim uygulamalarına ve uluslararası standartlara odaklanılmasını tavsiye etmiştir."
