abstract: "Kronik HCV infeksiyonu tüm dünyada olduğu gibi ülkemizde de önemli bir sağlık sorunudur. Kronik hepatit C (KHC) infeksiyonunda uzun dönemde siroz, karaciğer kanseri gelişme risklerinin ve mortalite oranının yüksek olması tedavi konusunda çalışmaların yoğun olarak devam etmesine yol açmıştır. Günümüzde pegile interferon-? (PEG İFN-a) ve ribavirin kombinasyonu KHC tedavisinde standart tedavi olarak kabul edilmekle birlikte, kombinasyon rejiminde PEG-İFN- ?-2a ile PEG-İFN- ?-2b `nin hangisinin tercih edilmesi gerektiği ile ilgili kimi zaman birbiriyle çelişen farklı çalışma sonuçları açıklanmaktadır.Çalışmamızın amacı KHC hastalarında, ribavirinle kombine edilmiş PEG İFN-?-2a ile ribavirinle kombine edilmiş PEG İFN-?-2b tedavisinin etkinliğini karşılaştırmak ve buna etki eden faktörleri irdelemekti. Çalışmaya KHC' li 100 hasta alındı. Çeşitli nedenlerle 13 hasta çalışma dışında bırakıldı. 10 hastanın verileri ise 48 ve/veya 72 haftalık takip ve tedavi sürelerini doldurmadığı için değerlendirmeye alınmadı. Basit sıralı yöntemle iki gruba ayrılan toplam 77 hastanın sonuçları değerlendirildi. Birinci grupta 40 hastaya 180 ?g/hafta SC PEG-İFN-?-2a ve ikiye bölünmüş dozda günlük 1000 mg( 75kg) ribavirin tedaviye cevap alınması durumunda 24(genotip2) veya 48 hafta(genotip 1) süreyle verildi. İkinci grupta ise 37 hastaya PEG-İFN-?-2b 1.5 ?g/kg/hafta SC ve ikiye bölünmüş dozda günlük 1000 mg( 75kg) ribavirin tedaviye cevap alınması durumunda 24(genotip2) veya 48 hafta(genotip 1) süreyle verildi. Bu iki tedavinin karaciğer fonksiyon testleri, virolojik göstergeler ve karaciğer histopatolojisi üzerine etkileri araştırıldı. PEG-İFN- ?-2a grubunda 3, PEG-İFN-?-2b grubunda ise 2 hastanın ilaç yan etkileri nedeniyle tedavisi kesildi. Gruplar arasında, hastaların demografik özellikleri (yaş, cinsiyet, ağırlık, vücut kitle indeksi vb.)ve tedavi başlangıcındaki nekroinflamasyon derecesi, fibrozis, viral yük, karaciğer60fonksiyon testleri ve hematolojik göstergeler bakımından anlamlı fark yoktu. Hastaların büyük kısmında bulaş parenteral yol ile olmuştu. Tüm hastalarda (n=77) viral genotip tayini yapıldı. 4 hastanın genotip 2a, 2 hastanın 1c ve yalnızca 1 hastanın genotip 4a ile infekte olduğu saptandı. Diğer 70 hastanın viral genotipi ise 1b idi (% 90.9). Tedavi süresince her iki grupta ALT değerlerinde birinci ayda belirgin bir düşme olduğu gözlendi. Bu düşüş tedavi sonuna kadar devam etti. Tedavi kesildikten sonra cevap elde edilen hastalarda ALT artışı saptanmadı. Beyaz küre ve hemoglobin ortalamalarında tedavi boyunca başlangıca göre anlamlı düşüş saptanırken trombosit düzeyi ortalamalarında genel olarak anlamlı değişiklik gözlenmedi. Her iki gruptaki hastaların tedavi sonu yanıt, kalıcı virolojik yanıt, yanıtsızlık, oranları benzerdi. Bu oranlar PEG-İFN-?-2a için sırasıyla % 50, % 40, % 5 iken; PEG-İFN-? -2b grubunda sırasıyla % 56.7, % 43, % 8.1 olarak bulundu. Tüm hasta grubu dikkate alındığında ise, ETR (tedavi sonu yanıt): % 53.2 ve SVR ( kalıcı virolojik yanıt): % 41.5 idi.Her iki grupta en sık görülen yan etkiler grip benzeri semptomlar, gastrointestinal sistemle ilişkili semptomlar, dermatolojik semptomlar, üst solunum yolu semptomları idi. Yan etkilerin görülme sıklığı açısından gruplar arasında anlamlı fark gözlenmedi.Bu veriler KHC'li hastalarda, PEG-İFN-alfa-2a veya PEG-İFN-alfa-2b `nin ribavirin ile birlikte verildiği tedavi rejimlerinde, PEG-İFN molekülleri arasında kalıcı viral yanıt elde etme ve tedavi etkinliği açısından anlamlı bir fark olmadığını göstermiştir. Her iki molekülde etkin ve güvenlidir."
