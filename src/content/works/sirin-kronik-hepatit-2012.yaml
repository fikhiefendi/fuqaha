title: "Kronik Hepatit C Tedavisinde Ribavirinle Kombinasyon Halinde Verilen Pegile İnterferon Alfa-2a veya Pegile İnterferon Alfa-2b Tedavi Rejimlerinin Etkinliği ve Tedavi Başarısını Etkileyen Faktörler"
titleTranslation: {"en": "The efficiency regimes which pegile interferon alfa 2a or pegile interferon alfa 2b in combination with ribavirin treatment and evaluating factors that affecting treatment success"}
