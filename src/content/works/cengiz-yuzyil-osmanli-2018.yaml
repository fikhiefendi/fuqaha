abstract: "Bu çalışma, XVI. yüzyıl Osmanlı fıkıh ve tasavvuf düşüncesine dair bir kesit sunmayı amaçlamaktadır. Bu kesitte, bahsi geçen asırda fetvalarıyla öne çıkan üç bilgin değerlendirilmiş, onların görüşlerinin Osmanlı düşüncesine tesiri ve tarihsel süreçteki konumu incelenmiştir. Tezde cevap aranan temel sorular şunlardır: XVI. yüzyıl Osmanlı düşüncesinde Çivizâde ve Birgivî üzerinden selefî bir zihniyetin varlığı iddia edilebilir mi? XVI. yüzyıl Osmanlı tasavvufî ve fıkhî düşüncesi, Çivizâde, Ebussu'ûd ve Birgivî vasıtasıyla nasıl bir teorik zeminde hangi münakaşalara sahne olmuştur? Öncelikle Osmanlı düşünce dünyasının büyük bir değişim ve dönüşüm geçirmesinde dâru'l-hadîslerin rolü gündeme alınmış ve buna götüren amillerin başında ise Osmanlı-Safevî mücadelesi olduğu tespit edilmiştir. Bu çerçevede ayet ve hadis merkezli sıkı sünnî yorumun, Safevîlerin batınî anlayışına karşı ortaya çıktığı değerlendirilmiştir. Bu refleks, sonraları yavaş yavaş medreseden irfanî tasavvufun uzaklaşımasına neden olmuştur. Dolayısıyla onun yerine ahlakî-zühdî tasavvuf yerleşmiş, vahdet-i vücud ise daha çok tekke çevresinde yaşatılmıştır. Tezde Selefî zihniyetin ne olduğu tartışmaya açılarak bazı araştırmalara konu edilen Çivizâde ve Birgivî'nin bu zihniyete mensubiyeti sorgulanmıştır. Ayrıca bu çalışmada XVI. asırda gündeme gelmiş olan para vakfı, mestler üzerine mesh, tegannî, sıla-ücret ayrımı ve kahve içmek gibi fıkhî; semâ devrân, raks ve vahdeti vücud gibi tasavvufî bazı ortak münakaşa konularına geniş yer verilmiştir. Bu üç bilginin ahlak-tasavvuf anlayışlarına temas edilmiş, irfanî veya ahlakî tasavvuf yorumlarına yer verilerek Kadızâdeliler'in Birgivî'yi sadece bir meşruiyet vasıtası olarak kullandıkları ifade edilmiştir."
