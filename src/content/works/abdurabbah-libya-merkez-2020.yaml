abstract: "LİBYA MERKEZ BANKASININ LİBYADAKİ İSLAMİ BANKACILIK İLE İLİŞKİSİ Fareed Abdulhamid Hamad Yüskek Lisans، İslam İktisadı ve Hukuku Tez Danışmanı: Pro. Dr. Hasan Gada Öğlu Ocak - 2020 – 102 Sayfa + x Bu çalışmanın amacı, Libya Merkez Bankası ile Libya'daki bankalar arasındaki ilişkinin niteliğini, nicel veya nitel kontrol araçları veya doğrudan denetim yoluyla ve ayrıca bankaların merkez bankası ile ilişkilerinde yaşadıkları sorunların bir ifadesini kullanarak belirlemektir. Merkez Bankası ve Yüksek Şeriat Kurulu tarafından Libya Merkez Bankası tarafından yayınlanan Şeriat standartları üzerine bir çalışma. Bu çalışmanın önemi, birçok ülkede Merkez Bankası Kanununun İslami bankaların misyon ve hedefleri için bir engel olduğu ve Libya'da faaliyet gösteren merkez bankası ile İslami bankalar arasındaki ilişkinin niteliğinin ve bu ilişkilerin İslami bankalar üzerindeki etkisini belirlemek için incelenmesi gerektiğidir. Çalışma, Libya Merkez Bankası ile Libya'da faaliyet gösteren bankalar arasındaki ilişkinin niteliğinin tanımını ve açıklamasını takip ederek, bu ilişkiyi değerlendirmenin yanı sıra, bankaların karşılaştığı sorunları araştırmak ve bunları çözmek için önerilen çözümler bulmaya çalışarak tümevarımsal tanımlayıcı analitik yaklaşıma dayanmıştır. Araştırma bir dizi bulgu ve öneri ile sona ermektedir."
