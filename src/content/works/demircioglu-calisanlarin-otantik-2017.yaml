abstract: "Bu araştırmanın amacı Otantik liderliğin, çalışanların örgütsel vatandaşlık davranışı ve örgütsel bağlılıklarıyla olan ilişkisini ortaya koymak; özel sektörde yer alan katılım banklarında çalışanların otantik liderlik algısının örgütsel vatandaşlık davranışı ve örgütsel bağlılıklarına olan etkisini tespit etmektir. Araştırmanın örneklemi çapı oluşturulurken Yamane'nin basit tesadüfî örneklem formülü kullanılmış olup çapı 300 kişi olarak belirlenmiştir. Veri toplama aracı olarak anket formu kullanılmıştır. Banka çalışanlarının oluşturduğu 3000 kişiden kolayla örnekleme yöntemi kullanılarak belirlenen 300 çalışana anket formu gönderilmiş olup 245 kişiden dönüş alınmıştır. Anket dört bölümden oluşmaktadır. Birinci bölümde demografik bilgilere yönelik sorulara ikinci bölümde Otantik liderlik hakkında sorulara üçüncü bölümde Örgütsel Vatandaşlık hakkında sorulara son bölümde ise örgütsel bağlılık hakkında sorulara yer verilmiştir. Elde edilen veriler istatistik paket programlarında Regresyon analizi, Anova, T testi yapısal eşitlik modeli kullanılarak analiz edilmiştir. Verilerin analizi sonucunda elde edilen bulgulara göre örgütsel bağlılık ile Otantik liderlik arasında istatistiksel olarak anlamlı ilişki bulunamamıştır. Örgütsel bağlılık ile örgütsel vatandaşlık arasında ve örgütsel vatandaşlık ile otantik liderlik arasındaki ilişki istatistiksel olarak anlamlı bulunmuştur. Otantik liderlik algısının örgütsel vatandaşlık davranışını olumlu yönde etkilediği tespitine ulaşılmıştır."
