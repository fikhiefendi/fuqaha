abstract: "Sigortacılık sektörü hızla genişleyen ve büyüyen bir finansal alan olup sigorta şirketlerinin üstlendikleri risklerin yönetimi ve paylaşımı açısından reasürans uygulamaları vazgeçilmez bir unsurdur. Hiçbir sigorta şirketi, üzerine aldığı riskleri tek başına taşıyamadığından, sektörün istikrarı için reasürans sistemi temel bir gereklilik hâline gelmiştir. Bu ihtiyaç katılım sigortacılığı için de geçerlidir. İslam hukuku esaslarına dayanan katılım sigortacılığı, konvansiyonel modele alternatif olarak adil risk paylaşımı ve dayanışma ilkesini öne çıkarırken, kendi yapısına uygun katılım reasürans (retekafül) sistemiyle desteklenmektedir. Böylece, katılım sigortacılığının sürdürülebilirliği ve güvenilirliği, retekafül kurumlarının gelişimiyle doğrudan ilişkilidir. Çalışmada, literatür taraması yapılmış ve nitel araştırma yöntemi kullanılmıştır. Bu çalışma, nitel araştırma kapsamında, alanında uzman akademisyen ve uygulamacılardan oluşan toplam 20 katılımcı ile yarı yapılandırılmış 29 soru temelinde görüşme tekniği kullanılarak yapılmıştır. Bu çalışma, katılım sigorta şirketlerinin reasürans işlemlerinde katılım reasürans (retekafül) imkanının azlığına ve bu konudaki sorunlara yönelik tespitler ve çözüm önerileri sunmaktadır. Çalışmada sunulan çözümler Türkiye'ye yönelik olduğu gibi, bunlardan bazıları Türkiye'nin yanı sıra küresel katılım sigortacılığına yönelik de çok önemli çözümlerdir. Çalışmada 14 adet bulgu teması tespit edilerek öncelikle analizleri yapılmıştır. Ardından her bir bulgu için gerek ülkeler nezdinde yapılan yasal düzenleme ve uygulama araştırmalarından elde edilen bilgiler, gerekse görüşmelerde katılımcıların görüş ve önerilerinden sağlanan çıktılarla birlikte değerlendirilerek hem mevzuata dair hem uygulamaya dair önemli somut çözümler sunulmuştur."
