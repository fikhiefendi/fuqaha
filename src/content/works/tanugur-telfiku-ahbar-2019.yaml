abstract: "Yüksek Lisans Tez çalışmamızın konusu olan Tahirü'l-Mevlevi'nin tercüme eseri, Kāzan, Bulgār ve Tatar Târîhi, Defter 1 ve Defter 2 başlıklarına sahip üç kitap, Murad Remzi tarafından yazılmış Telfîkü'l-ahbâr ve Telkîhü'l-âsâr fî Vakāyıʻi Kazan ve Bulgār ve Mülûkit-Tatar adlı eserin çevirisidir. Tahirü'l-Mevlevi, Kazan, Bulgar ve Tatarların tarihine dair yapılan çalışmalarda, batılı kaynakların ağırlıklı olduğunu ifade eder. Bu nedenle bu coğrafyanın tarihine, yine bu coğrafyada yetişmiş bir yazarın kaleminden çıkan bir eseri tercüme etmenin önemini vurgular. Murad Remzi, kendi tarihine ışık tutmak ve yetişen nesillere tarih bilincini kazandırmak için Telfîkü'l-ahbâr ve Telkîhü'l-âsâr fî Vakāyıʻi Kazan ve Bulgār ve Mülûki't-Tatar eserini kaleme aldığını belirtir. Yüksek Lisans Tezimiz, giriş, dört bölüm ve sonuçtan meydana gelmiştir. Giriş bölümünde eserin konusu, önemi, amacı, kapsamı ve yöntemine dair bilgiler, birinci bölümde eserin değerlendirilmesi, ikinci bölümde Tahirü'l-Mevlevi'nin (Tahir Olgun) biyografisi, üçüncü bölümde Murad Remzi'nin biyografisi, son bölümde eserin latinizesine yer verilecektir. Sonuç'ta ise, çalışmamız hakkında genel bir değer-len¬dirme yapılacaktır."
