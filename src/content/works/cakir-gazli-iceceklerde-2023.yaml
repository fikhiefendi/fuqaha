abstract: "Helal gıda konusunun en güncel konularından biri, gazlı içeceklerde etil alkol kullanılmasıdır. Bazı gazlı içeceklerde çeşitli nedenlerden dolayı etil alkol kullanılmaktadır. Örneğin, gazlı içeceklerde kullanılan esans, aroma ve yağ gibi gıda katkı maddeleri su içerisinde çözülmüyor. Bu gibi maddelerin su içersinde çözülebilmesi için yaygın olarak kullanılan etil alkoldür. Çalışmamızda belirlemiş olduğumuz gazlı içeceklerinin alkol analizi yapılıp, analiz sonuçlarına göre alkol kullanılmasıyla ilgili İslâm âlimlerinin görüş ve değerlendirmeleri ve ayrıca güncel biyokimya laboratuvar verileri baz alınarak konuya açıklık getirilmeye çalışılmıştır. Fıkıh literatüründe konuyla ilgili olarak özellikle 'istihlâk' kavramını bağdaştırılabilir. İstihlâk, az miktarda haram veya necis olan bir maddenin çok miktarda helal madde içerisinde yok olmasıdır. Asıl üzerinde durduğumuz konu, gazlı içeceklerde kullanılan az miktardaki etil alkolün, istihlâk teorisine göre değişime uğrayıp uğramadığıdır. Aynı zamanda etil alkol kullanılan gazlı içeceklerin fıkhî hükmü tespit edilmeye çalışılmıştır."
