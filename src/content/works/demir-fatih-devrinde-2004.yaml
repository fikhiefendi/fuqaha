abstract: "Osmanlı ilmiyesinin geçirdiği kuruluş-imparatorluk süreci içerisinde özellikle ikincisinde daha manîdar bir yer bulan Molla Hüsrev, kendisiyle ve eserleriyle ilgili belli sayıda bilimsel ya da popüler araştırmalara konu olmuş birisidir. O, devletin yaşadığı fetret devrfnde çocukluğunu ve gençliğinin bir kısmım geçirip, iyi bir tahsil görmek maksadıyla devletin merkezine yöneldi. Naklî ilimlerden fıkıh sahasında iyi bir tahsil yaptı. Hocası, müteahhirûn (Gazali dönemi sonrası) kelâmcılan içinde önemli yeri bulunan Sadeddin Taftazânî'nin talebesi Burhâneddin Haydar Herevî idi. O, bu sayede müteahhirûn' 'u tanıma imkanı buldu. Yalnız onunla yetinmeyip başka âlimlerden de okudu. Bu maksatla, Anadolu dışına çıkmasa da, buranın önemli merkezleri olan Edirne ve Bursa' da bulundu. Tedris görevine öncelik verip müderrislik yaptı. Bunun yanında kazâ'ya. da ulaştı. Bu sahada katettiği aşamalar, kadılık ve daha sonra kazaskerlik oldu. Tedris ile kazâ'yı birlikte yürütürken II. Mehmed onun tâlimi değiştirdi. Onunla Manisa'ya giderken başlayan ilişki, ömürlerinin sonuna kadar devam etti. Taltifler ise hadsiz boyutlara ulaştı. Neyse ki âlimimiz bütün yapılanların boş yere olmadığım ispatladı. Çok sayıda eser kaleme aldı. Öyle eserler ki, Dürer'i ve Mir 'âfıyla. fıkıh ve usûl ilmine önemli kazanımlar sağladı. Çok sayıda şerh, haşiye yazdı. Ama bu bir gelenekti. Onun Mutavvel Haşiyesi bu geleneğin ondaki başlangıcı idi. Daha sonra başkaları bunu takip etti. İlk telifi Mirkâftı. En ünlü eseri Dürer'i, engin bilimsel ve hayatî tecrübelerin zirvesindeyken meydana getirdi. O, eser yazmakla kalmadı, yeni görüşler ortaya atarak tartışma ortamları oluşturdu. Muasırı ulemâ ile ilmî diyaloglara girdi. Bütün bunlar, Molla Hüsrev'in özellikle bilim literatürüne girmesinde ve kalıcı olmasında etkili oldu."
