abstract: "Son yıllarda Türkiye'deki katılım bankacılığının büyüme performansı ve pazar payı sıkça tartışılmakta, mevcut katılım bankalarının büyüme performansı eleştiri konusu yapılmakta, pazar payının artırılmasına yönelik çeşitli görüş ve öneriler sunulmaktadır. Bu önerilerden biri de katılım bankalarının fon kullandırma yöntemlerinin değiştirilmesi ve geliştirilmesine yöneliktir. Bu çalışmanın amacı mevcut katılım bankacılığının fon kullandırım yöntemlerini incelemek, bu yöntemlerden ortaklığa dayalı fon kullandırım ürünleri olan mudarebe ve müşareke ürününün uygulama imkanlarını ve sorunlarını ortaya koymaktadır. Araştırmada yöntem olarak birinci aşamada literatür analizi kullanılmış, konuyla ilgili yerli ve yabancı yayınlar incelenmiş ve değerlendirilmiştir. İkinci olarak anket yöntemi kullanılmış, katılım bankaları çalışanları ve sektör ilgilileri ile Katılım Bankasıyla çalışan şirketler, iki ayrı ankette araştırma konusu yapılmıştır. Çalışmamızın literatüre katkısı, ortaklığa dayalı finansman yöntemlerinin mevcut katılım bankacılığı dışında yeni bir bankacılık modeli ile yapılmasına yönelik öneriyle birlikte hem katılım bankalarının hem de şirketlerin anket yöntemiyle aynı çalışmada ele alınmış olmasıdır. Bu çalışma sonucunda katılım bankacılığı sektöründe mevcut şartlarda ortaklığa dayalı fon kullandırım yöntemlerinin istenilen düzeyde gelişme gösteremeyeceği literatür çalışmaları ve anket sonuçlarıyla ortaya konulmuştur. Bu ürünlerin sağlıklı şekilde uygulanabilmesi için mevcut katılım bankacılığı modelinden ziyade yatırım bankacılığı modelinin daha uygun olduğu tespiti yapılmış ve bu çerçevede yeni bir bankacılık modeli önerisi getirilmiştir. Önerisini yaptığımız ve çalışmamızda detaylarını ortaya koyduğumuz ortaklığa dayalı yatırım bankacılığı (Ortak Yatırım Bankası) modeli, katılım bankalarına göre ortaklık finansmanı ürünlerini uygulama konusunda daha başarılı olacaktır. Bu yapı ortaklığa dayalı finansman modelinin uygulanmasında ortaya çıkan sorunlara önemli ölçüde çözüm getirerek, katılım bankacılığı ile birlikte katılım finans ekosisteminin tamamlayıcısı ve önemli bir ayağını teşkil edecektir."
