abstract: "Fıkıh literatüründe“usûl”(esaslar) dendiğinde bir taraftan İslam hukuk ilminin felsefî ve metodolojik esaslarını inceleyen“usûlü'l-fıkh”ın, diğer taraftan da fıkhî hükümlerin fikrî temellerine ve hedeflediği amaçlara yoğunlaşan ilke ve kurallar anlamındaki“kavâid”in anlaşılması gerekir. Bir kısmı doğrudan naslarda ifadesini bulmuş olan ve fıkıh âlimlerinin İslâm'ın ana kaynaklarının iyi anlaşılması uğrunda ortaya koydukları fikrî çabaların ürünleri olarak belirlenen fıkıh kâidelerinin özel biçimde incelenmesi fıkıh literatüründe önemli bir yazım türü oluşturmuştur. Birçoğu hukuk vecizesi şeklinde ifade edilen kâidelerin fıkıh düşüncesi ve uygulamasındaki yararları ve işlevi hakkında farklı değerlendirmeler yapılmıştır. Kavâidin işlevi, usûl ve fürû alanlarındaki çeşitleri ve kapsadığı cüz'î meseleler hakkında kaleme alınan kitaplar arasında eşbâh türü eserlerin önemli bir yeri vardır. Eşbâh edebiyatında telif edilen ilk ve en önemli eserlerden biri Tâcüddîn es-Sübkî'nin el-Eşbâh ve'n-nezâir'idir. Mezkûr eserin eşbâh edebiyatındaki yerinin, muhteva ve metodunun incelendiği bu çalışma, giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır."
