abstract: "Hüküm, Kur'ân ve sünnette var olan lafızlardan elde edilir. Ancak her dilde olduğu gibi dinin bu iki ana kaynağında var olan lafızların da farklı anlamlara gelmesi muhtemeldir. Bu da farklı anlamların doğmasına sebep olmaktadır. İşte beyân farklı anlamlara gelmesi muhtemel olan lafızların asıl maksatlarını tespit eder. Bizde bu amaca matuf olmak üzere Hanefi mezhebinde önemli bir yeri olan Fahrü'l-İslâm Pezdevî'nin usûl eserinde genişçe yer verdiği beyân anlayışını inceledik. Kısaca ifade etmek gerekirse; takrîr beyânı, kelamda mecaz ve tahsisin olmadığının beyânıdır. Tefsîr beyânı, mücmel, müşterek ve kinevi lafızları açıklayan beyândır. Tağyîr beyânı, sözün öncesinin gerektirdiğini ona bitişik olarak gelen bir başka söz ile değiştiğinin beyânıdır. Zaruret beyânı, söz ile olmayan bir beyandır. Tebdîl beyânı ise önceki hükmün geçerliliğinin bitip sonra gelen hükmün yürürlüğe girdiğinin beyânıdır. Çalışmamız bir giriş, üç bölüm ve bir sonuçtan müteşekkildir."
