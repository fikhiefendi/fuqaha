abstract: "Evrensel bir olgu olan düğün merasimi milletlere ve kültürlere göre değişiklik arz etse de hukuki boyutu olan bir kavramdır. Günümüz modern hukukunda düğünün nasıl yapılması gerektiğine dair kurallar olmakla beraber düğünde takıların hükmü konusunda da hukuki görüşler bulunmaktadır. En son çıkan Yargıtay kararlarına göre takılar damat ya da gelinden hangisine takıldı ise ona ait sayılarak boşanmada takıların paylaşımı konusunda bir hüküm vermiştir. İslam hukukunda iki şahit huzurunda yapılan nikâh akdi gerekli iken düğün merasimi yapılması daha çok kültüre bağlı bırakılmıştır. Özel bir merasim şart değilse de düğün merasimi yapılmasına izin vermiştir. Gerek İslam'ın ilk dönemlerinde gerekse Osmanlı döneminde bile çeşitli düğün merasimleri yapılmış ve bu merasimler o dönemin kültür ve örfüne göre şekillenmiştir. Günümüz düğün merasimlerinin hukuki bir çerçevesinin olup olmadığını ve bu hukuki çerçeve içinde yapılacak düğün merasimlerinin İslam hukuku ile benzeşip benzeşmediğini araştırma bu tezin amaçlarındandır. Ayrıca İslam hukuku ve modern hukuk açısından takıların hükmünü Yargıtay'ın verdiği son karar bağlamında karşılaştırmak bu tezin diğer amacını ve önemini ortaya koyar. İslam hukukunda ve geleneksel kültürde düğünde takılanların hepsi kadına takılır ve bu mihr şeklinde kabul edilir. Boşanma durumunda da kadının mihri geri alınmaz ve istenmez. Bu durumun İslam hukukunda istisnalarının olup olmadığının araştırılması ve günümüz Yargıtay kararlarının amacının ne olduğunu araştırmak ve ortaya koymak bu tezin amacı ve önemini içermektedir."
