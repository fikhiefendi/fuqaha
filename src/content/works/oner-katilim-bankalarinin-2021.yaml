abstract: "İslami finansın, varlık ve risk paylaşım temelli yapısıyla hem sistematik risklerin azaltılması hem de finansal sektör ile reel ekonomi arasında güçlü bir köprü kurulabilmesi açısından faizli bankacılık sistemine göre daha sağlam bir yapıya sahip olduğu bilinmektedir. Türkiye'de“katılım bankaları”şeklinde isimlendirilen bu bankaların gerçek ticarete dayanan finansman modellerine göre çalışması, bankacılık sektörünün muhtelif şoklarına karşı bu bankaları mevduat bankalarına göre daha dirençli hâle getirmektedir. Bahse konu olan şokların başında ise takibe düşen krediler gelmektedir. Takibe düşen krediler, bankaların kalitesini gösteren en önemli kalemlerdendir. Takipteki kredi oranlarının artması, bankaları ve reel sektörü olumsuz bir şekilde etkilemektedir. Bu noktada tezin amacı, Türkiye'de İslami prensiplere göre faaliyet yürüten katılım bankalarının takip oranlarını belirleyen faktörleri incelemek ve mevduat bankaları ile aralarındaki farkı tespit etmektir. Çalışmada, mevcut faktörler incelendikten sonra her iki banka türü karşılaştırılarak ekonometrik modeller ile analiz edilmektedir. Ayrıca 2008 global krizinin her iki banka türünü ne düzeyde etkilediği analizlerde yer almaktadır. Bu tezde; araştırmada elde edilen tespitler ışığında, Türkiye için kendi alanında yapılan en kapsamlı çalışmalar arasında yer alabilecek bir özellik taşıması için çaba sarf edilmiştir. Ayrıca çalışma ile İslami finans sahasında faaliyet gösteren katılım bankalarının en önemli sorununu teşkil eden kredi takip oranlarının belirleyicileri tespit edilmekte ve bu anlamda sektöre yeni bir perspektif sunulmaktadır."
