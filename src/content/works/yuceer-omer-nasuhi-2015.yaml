abstract: "Bu tez, son dönem İslam âlimlerinden Ömer Nasûhi Bilmen'in fıkıh ilmine dair yazmış olduğu“Hukûk-ı İslâmiyye ve Istılâhât-ı Fıkhıyye Kamusu”adlı eserinde kullandığı hadislerin sıhhat durumunu tespit etmek ve Bilmen'in hadisçiliğinin anlaşılmasına katkı sağlamak amacıyla hazırlanmıştır. Tahrîc çalışması olan tez, giriş ve iki bölümden oluşmaktadır. Tezin Giriş bölümünde konu, amaç ve yöntemden bahsedilmiş, Birinci Bölümde Ömer Nasûhi Bilmen'in hayatı, eserleri ve özellikle tahrîcini yaptığımız eserde geçen hadis ilmiyle ilgili görüşlerine yer verilmiştir. Tezin ikinci bölümünde, eserde geçen 334 adet hadisin tahrîcleri, araştırmanın yönteminde belirtilen tahrîc metotlarına göre yapılmış ve hadislerle ilgili sahih, hasen, zayıf, mevzû gibi verilen hükümler hakkında değerlendirmeler yapılmıştır. Çalışmanın son kısmında hadislerin sıhhat durumları ile ilgili istatiksel tablolar oluşturulmuş ve tezle ilgili genel bir değerlendirme yapılarak çalışma tamamlanmıştır."
