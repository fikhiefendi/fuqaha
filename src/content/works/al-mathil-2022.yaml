abstract: "Bu araştırma, H. Onuncu yüzyılda, MS. On altıncı yüzyılda Osmanlı devleti döneminde Istanbul'da yerleşmiş büyük alimlerinden biri olan Şeyh İbrahim b. Mustafa el-Halebi el-Medari tarafından yazılan eseri Tuhfetu'l-Ahyar ale'd-Durri'l Muhtar kitabının bir parçasını tahkik ve incelemesini sunmaktadır. Bu eser, fıkhın tüm bablarını ve bölümlerini içermesi ve müellifinin kitabını önemli bilgiler ve kaynaklarla zenginleştirmesi nedeniyle Hanefi fıkhının büyük önem taşıyan kitaplarından biri olarak kabul edilmektedir. Ayrıca bu kitap, ed-Dürrü'l-Muhtar'ın ilk haşiyesi ve onun şerhlerinin en önemlilerinden biri olarak sayılmaktadır. Ancak inceleme, yorumlama, basım ve yayın olarak gerekli ilgiyi görmemiştir. İlim ve âlimlerle dolu, kütüphanelerle, mekteplerle, üniversitelerle, ilim ve yayınevleriyle dolu, son yirmi yılda bilimsel ve öncü liderlik konumunu yeniden kazanmayı başaran İstanbul şehrinde bulunan Süleymaniye Kütüphanesi'nden eserin nüshalarını temin ettikten sonra, İstanbul Üniversitesi'nde bir grup öğrenci arkadaşlarımla birlikte bu kıymetli elyazmasını tahkik için bir araya gelmemizi Allah azze ve celle lütfuyla kolaylaştırmıştır. Bu araştırma, eserin Tuhfetu'l-Ahyar 'El-İstilad' Babından 'Keyfiyyetü'l-kismeh' Bölümüne Kadar olan bölümleri içermektedir. Bu çalışma da, eserin araştırmacı, çalıştığı kısmı merkeze alarak kitabı, yazarını ve yazarının yöntemini tanıtmıştır, ayrıca kitabın metni olan ed-Durrü'l-Muhtar kitabının yazarını ve onun da metni olan Tenvirü'l-Ebsar kitabını da tanıtmıştır. Ayrıca ismi geçen şeyh ve âlimlerin kısa biyografileri, kitabın müellifinin dayandığı kitap ve kaynaklarını zikredip araştırma metodolojisini beyanetmiştir. Son olarak sonuçları ve tavsiyeleri sunmuştur. Bu tezinin tahkikinde derin bir değerlendirme ve istişareden sonra iki yazma eser nüsha ile mukabele edilmiş ve bir asıl nüsha üzerine itimat edilmiştir. Allahu Tealadan, bu az gayretimi kusurlarla beraber kabul etmesini, tahkik yapan grubun bu yazma eseri tek bir kitap halinde hazırlayabilmelerini ve yayınlayıp üniversite, kütüphane, yayınevlerinde istifadeye sunabilmelerini niyaz ediyorum."
