abstract: "İslam hukukundaki temel hukuk prensipleri birçok çalışmaya konu olmuştur. Elinizdeki bu çalışmada dağınık halde ele alınan hukuk prensipleri bir araya getirilmiş olup borçlar hukuku için benimsenmiş temel prensiplerin Mebsût özelinde nasıl ele alındığı, hangi kavramlarla ifade edildiği değerlendirilmiştir. Nitekim borçlar hukuku için benimsenmiş temel ilkeler ile Mebsût'ta borçlar hukukunu ele alan bölümlerdeki temel yaklaşımlar benzerlik bakımından birbirleriyle paralellik göstermektedir. Prensip kelimesinin geçmişten günümüze kadar hangi kavramlarla ele alındığına da yer verilen çalışmada, modern hukuktaki borçlar nazariyesi ile kazuistik yöntemin benimsendiği İslam hukukundaki borçlar nazariyesi arasındaki farklılıklar mukayese edilmiştir."
