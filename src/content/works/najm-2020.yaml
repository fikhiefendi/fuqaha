abstract: "Bu, başlatmayı planladığım mesajın bir özeti olup, ibadet yerlerinin üç din üzerindeki toplum üzerindeki etkisinin karşılaştırmalı bir incelemesine dayanmaktadır. Bu çalışmayı seçmenin nedeni şuydu: Gerçeklerin çarpıtılması, cennet kitaplarının din adamları tarafından din adına ve ibadet yerleri adına kaprislerine ve ilgi alanlarına göre çarpıklığı ve değiştirilmesi nedeniyle insanların kendilerini kabul edebilmeleri ve kendileri için yerleştirdiklerini takip edebilmeleri için kutsallığı vardır. Çalışmanın amacı, insanların Yüce Tanrı'ya ibadet ettikleri ibadet yerlerinden ne ölçüde etkilendiğini bilmek ve bu rolün dini ve doktriner tarafın yanı sıra sosyo-ekonomik yönlere etkilerini tanıtmaktır. bireylerin ve toplumların hayatlarında ve din adamları ve sultanların, maddi ilerlemeleri ve etkileri ve onların tahakkümleri ne olursa olsun, Tanrı'nın göksel kitaplarına, peygamberlerine ve elçilerine atıfta bulunmak ve bunları göstermek gerekir. Bu çalışmadan sonra bu ibadetlerde ibadet yerlerinin birey üzerinde büyük bir etkisi olduğunu ve ibadet yerlerinin bireyin inancı üzerindeki etkisini vurguladığını ve hayatının gidişatını değiştirdiğini buldum."
