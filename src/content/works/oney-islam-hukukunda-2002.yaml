abstract: "ÖZET Tezimiz, biri giriş olmak üzere üç ana bölümden oluşmaktadır. Giriş bölümünde vesayet kurumunun tarihçesi, İslâm hukukundaki dayanakları ve İslâm hukuku sistemi içindeki yeri, diğer temsil kurumlan ile benzer ya da farklı yanları ortaya konmaktadır. Bu arada temsil konusunda kilit rol oynayan“ehliyet”kavramı da söz konusu edilerek, ehliyet bakımından insanların durumları, konunun gerektirdiği çerçevede ele alınmıştır. Birinci bölümde vesayet akdinin unsurları ile bunlara dair şartlar incelenmiştir. Bu cümleden olarak, kimlerin vasî olabilecekleri, kimlerin vasî tayin etmeye yetkili görüldükleri; hangi hususlarda vasî tayin edilebileceği söz konusu edilmiştir. Ayrıca, hakim tarafindan vasî tayin edilmesini gerekli kılan durumlar da bu bölümde işlenen konular arasındadır. İkinci, bir başka ifadeyle son bölümde ise, vesayet konusu olan tasarruflarla, bu konudaki davalar, şahitlikler, ihtilaflar ve vasiliğin sona ermesi incelenmeye çalışılmıştır. Tasarruflar kapsamında, terekeyle ilişkili olan Allah ve kul haklarının edası, vasiyetlerin tenfizi, ölenin teçhiz ve tekfini ile vasînin, vesayeti altında bulunan kısıtlı (kasır) adına alış-veriş yapmasının şartları, kısıtlının malını ticarî faaliyette kullanması ya da onun adına başkalarına kiralaması, kendi yerine vasî veya vekil tayin etmeye yetkili görülüp görülmediği gibi hususlar ve de kısıtlılık sona erince kısıtlının malını kendisine teslim etmesinin esaslan ele alınıyor. Yine, vasilerin birden fazla olması ya da vasînin tasarruflannı denetleyen nazır bulunması durumu da bu bölümde işleniyor. Tezimizin bir yönünü de 1875/61 numaralı Trabzon Şer'iye Sicili'ndeki vesayet konulu kayıtlar oluşturmaktadır. Ait oldukları dönemle ilgili uygulama örneği niteliği taşıyan kayıtlar, tez içinde ilgili kısımlarda işlenmiştir. Söz konusu kayıtlara ayrıca, tezin sonunda ek bir bölüm halinde yer verilmiştir. Bu bölümde toplam yirmi iki kayıt bulunmaktadır. Bu kayıtların on sekizi vesayet, ikisi kayyımlık ve ikisi de vasî üzerine nazır tayin edilmesi ile ilgilidir. vııı"
