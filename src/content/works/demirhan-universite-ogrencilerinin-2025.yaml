abstract: "Bu çalışmada Artvin Çoruh Üniversitesi öğrencilerinin Dijital Finansal Okuryazarlık (DFO) ile İslami Finansal Okuryazarlık (İFO) düzeyleri incelenmiştir. 2024-2025 eğitim öğretim yılı güz yarıyılında aktif ders kaydı yapan öğrencilere anket uygulanmış olup, 364 adet anket yanıtlandırılmıştır. Anket verileri SPSS programı aracılığıyla analiz edilmiş olup elde edilen bulgulara göre, öğrencilerin İFO düzeylerinde yalnızca yaş değişkenine göre anlamlı bir farklılık tespit edilmiştir. Diğer demografik değişkenlere göre ise anlamlı bir farklılık gözlemlenmemiş, öğrencilerin benzer düzeyde yanıtlar verdikleri görülmüştür. Çalışma aynı zamanda öğrencilere ait demografik bilgilere göre DFO düzeylerinin Dijital Finansal Hizmet ve Ürünler (DFHÜ) hakkında bilgi sahibi olma ve hizmet/ ürünleri kullanım durumlarına göre frekans ve yüzde dağılımları analiz edilmiştir. Analiz sonucunda, DFHÜ hakkında bilgi sahibi olma ve kullanma konusunda en çok tercih edilen hizmet ve ürünün“mobil bankacılık”olduğu görülmüştür. Bu ürün ve hizmetlerden en az“kitle fonlama”hakkında bilgi sahibi oldukları görülmüş olup, aynı zamanda“elektronik çek”kullanımının da en az olduğu sonucuna varılmıştır."
