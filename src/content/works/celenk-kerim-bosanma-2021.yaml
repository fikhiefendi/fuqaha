abstract: "Kur'an-ı Kerim, diğer konulara nispeten aile ahkâmına dair birçok hüküm vazetmiştir. Tarafların hak ve vazifelerinin yanında, aralarında vuku bulacak anlaşmazlıklara da müteaddit ayetlerde çözüm önerileri sunmuştur. Öyle ki bu sorunlar baş göstermeden birtakım tedbirler öngörerek ihtilafların aile içinden giderilmesini sağlamıştır. Aile içinde çözüm bulunamadığı takdirde aile büyüklerini ve ilgilileri devreye koyarak meselenin kaynağından halledilmesini temin etmiştir. Çağımızda aile içinde yaşanan problemlerin çözümü için eşlerin ekseriyetle mahkemeye müracaat ettikleri bilinen bir gerçektir. Son yıllarda aile içi anlaşmazlıkların çoğalmasıyla, yargının iş gücünün artması bir tarafa, bu durum uzun ve yorucu bir sürecin yaşanmasına da sebebiyet vermektedir. Ayrıca yargılama sürecinin uzaması tarafların çeşitli mağduriyetlerle karşılaşmalarına zemin hazırlamaktadır. Bu çalışmada, Kur'an-ı Kerim'de aile içi geçimsizliklerde alınan önlemleri bir bütün halinde sunarak konuya dair görüş beyan eden gerek klasik ve gerekse de çağdaş İslâm bilginlerinin meseleye yaklaşımları mezhepsel farklılıklarla birlikte incelenmeye çalışılmıştır. Mamafih yeri geldiğinde görüş ve kanaatlerimizi bildirerek konuya katkı sağlamak amaçlanmıştır."
