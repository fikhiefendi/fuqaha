abstract: "İslam literatüründe Kur'an'dan sonra ikinci kaynak olarak kabul edilen hadislerin anlaşılması üzerine birçok eser telif edilmiştir. Müslümanların amelî hayatları ile ilgili olan konuları kapsayan ahkâm hadisleriyle de ilgili olarak hadislerin anlaşılması ve onlardan çıkarılan hükümler üzerine kitaplar yazılmıştır. Çalışmada ele alınan İbn Şeddâd'ın Delâilü'l-Ahkâm adlı eseride bu kitaplar arasında yer almaktadır. Birinci bölümde İbn Şeddâd'ın hayatı anlatılacaktır. Musul ve Halep'te yaşamış olan İbn Şeddad'ın ilmi yaşantısı araştırılıp özellikle hadis alanına katkılarından bahsedilecektir. Delâilü'l-Ahkâm min Ehâdîsi'r-Resul Aleyhisselâm adlı eser kısaca tanıtılacak, İkinci bölümde ise, hadis edebiyatı ve genel hatlarıyla ahkâm hadislerinden kısaca bahsedilerek, müellifin eserde ifade ettiği yöntemlerine değinilmiş, eserdeki açıklamalar kategorize edilerek örnekler üzerinden metodu ortaya konulmuştur. Bu çalışma neticesinde Eyyubi devlet adamlarından Ebü'l-Mehâsim Bahâüddîn İbn Şeddâd ve Delâilü'l-Ahkâm isimli eserinin hadis edebiyatına katkısını ortaya koymak hedeflenmiş; ahkâm hadisleri literatürünün Gelişim dönem eserleri arasında olan eserde müellifin takip ettiği metot ortaya konulmuştur."
