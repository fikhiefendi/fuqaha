abstract: "Bu doktora tezi çalışmasında faizsiz finansal aracılığın faize alternatif olarak kullandığı kâr ve risk paylaşımı (mudarabe) yönteminin uygulamadaki en yaygın örneği olan mudarabe yatırım hesaplarında kâr paylaşımı incelenmiştir. Mudarabe yatırım hesaplarının işletilmesiyle elde edilen kârın paylaşılmasında kâr dağıtımı yönetimine başvurularak düzeltme yapıldığına dair literatürdeki çalışma ve tartışmalar yapılan alan çalışmasında ele alınmıştır. Yapılan alan araştırmasıyla mudarabe yatırım hesaplarında kâr dağıtımı yönetimi olgusunun tespiti ve bunun yanı sıra hangi faktörlerin kâr dağıtımı yönetimini etkilediğinin, dağıtılan kârın düzeltilmesinde kullanılan yöntemlerin keşfedilmesi amaçlanmıştır. Tez çalışması kapsamında gerçekleştirilen alan araştırması, Türkiye'de faaliyet gösteren altı katılım bankasında mudarabeye dayalı katılma hesaplarıyla toplanan fonların işletilmesi için geliştirilen katılma havuzlarının yönetiminde karar verici konumda olan veya bu havuzlara günlük yapılan kâr dağıtımı süreçlerinde görev alan farklı kademelerdeki yöneticilerle yapılan yarı yapılandırılmış mülakatlarla gerçekleştirilmiştir. Araştırma sonucuna göre, katılım bankaları katılma hesaplarına dağıtılan kârı belirlenen mevzuat çerçevesinde yönetmektedir. Alan araştırması bulgularına göre, katılım bankalarının katılma hesaplarına günlük kâr dağıtımı gerçekleştirmek için kullandığı katılma havuzu modelinin ve birim değer hesaplamasının; hesap sahiplerinin beklentileri ve faaliyette bulunulan piyasadaki rekabet koşulları dikkate alınarak geliştirildiği, katılma havuzu modelinin sistemsel yapısı gereği kâr dağıtımı yönetimine ihtiyaç duyulduğu tespit edilmiştir. Bunların yanı sıra katılma hesabı sahiplerinin piyasa koşullarında getiri beklentisi, kâr dağıtımı yönetimini etkileyen diğer önemli bir faktördür. Piyasa koşullarında getiri bekleyen katılma hesabı sahiplerinin, katılım bankacılığının işleyişine dair yeterli bilgiye sahip olmaması ve kâr dağıtımına ilişkin şeffaflığın yetersiz olması da kâr dağıtımı yönetimini etkilemektedir."
