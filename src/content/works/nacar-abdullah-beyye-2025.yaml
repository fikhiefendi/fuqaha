abstract: "Fıkhın Müslüman azınlıklar (Fıkhu'l-Ekalliyyât) özelinde yeniden yorumlanması, Müslümanların gayrimüslim toplumlarda karşılaştığı fıkhî ve sosyokültürel sorunlara çözüm üretmeyi hedefleyen disiplinlerarası bir alandır. Bu tez, Abdullah b. Beyye'nin güvenlik ve barış kavramları etrafında şekillenen fıkıh ve Fıkhu'l-Ekalliyyat anlayışını; bu anlayışın klasik fıkıh mirasıyla nasıl irtibatlandırıldığını ve modern siyasal bağlamlarda nasıl yeniden inşa edildiğini incelemektedir. Aslen Moritanyalı olan ve 1981 yılında Suudi Arabistan'a göç eden İbn Beyye, 1990'lı yıllardan itibaren uluslararası düzeyde etkili bir isim olarak öne çıkmıştır. 1980'lerin güvenlik eksenli Ortadoğu siyaseti, onun fıkhî düşüncesini derinden etkilemiş; bu etki, 1999'da yayımladığı ve güvenliği makâsıdü'ş-şerîa'nın bir parçası olarak ele aldığı Hitâbu'l-Emn fī'l-İslâm adlı eserinde açıkça görülmüştür. 11 Eylül saldırılarından sonra ise söyleminde dikkat çekici bir değişim yaşanmış; terör ve demokrasi karşıtlığı temelinde şekillenen el-İrhâb: et-Teşhîs ve'l-Hulûl (2007) adlı eseriyle bu yeni yönelimi somutlaştırmıştır. 2013 yılında Mısır'da Muhammed Mursî'ye karşı yapılan darbe sonrası, İslamcı çevrelerle yollarını ayırmış; Uluslararası Alimler Birliği'nden istifası, Birleşik Arap Emirlikleri'yle geliştireceği yeni siyasal ilişkilerin başlangıcı olmuştur. Bu çerçevede kurduğu“Müslüman Toplumlarda Barışı Teşvik Platformu”ve ardından gelen“Yeni Erdemliler İttifakı”, söyleminin güvenlikten barış merkezli bir çizgiye evrildiğini göstermektedir. 2016 yılında yayımlanan Marakeş Deklarasyonu ise, Ortadoğu'daki gayrimüslim azınlıkların haklarını savunarak bu dönüşümün en görünür çıktılarından biri olmuştur. İbn Beyye'nin yaklaşımı, tahkîku'l menât temelli, makâsıd-merkezli bir usûl anlayışına dayanır.“Fıhhu'l-Vâki'ʿ”ve“Fıkhu'l-Ekalliyyât”ı, mevcut külli fıkıh kaidelerinin modern toplumsal bağlamda yeniden yorumlanması olarak konumlandırır. Yeni kurallar icat etmek yerine, ref'u'l-harac, ʿumûmu'l-belvâ, zaman ve mekânın hükme etkisi gibi ilkeler aracılığıyla çözümler üretir. Dârulislam–dârulharb ayrımının günümüzde geçersizleştiğini savunan İbn Beyye, klasik zimmet sisteminin yerini modern vatandaşlık anlayışının aldığını ifade eder. Batı'daki başörtüsü yasaklarına karşı ise zaruret ilkesine dayanarak, başın“zaruret miktarınca”açılmasının caiz olduğunu belirtmektedir."
