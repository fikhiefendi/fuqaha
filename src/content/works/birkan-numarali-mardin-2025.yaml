abstract: "Bu çalışmanın konusu 214 numaralı Mardin Şer'iyye Sicil Defteri'nin transkripsiyon ve değerlendirilmesidir. Çalışma 214 numaralı Mardin Şer'iyye Sicil Defteri'nde 27 Zilhicce 1308/3 Ağustos 1891 ile 13 Cemaziyelevvel 1309/15 Aralık 1891 tarihleri arasında şer'iyye mahkemesine gelen daha çok aile, miras, vesayet, vekâlet, alım-satım ve tarla davalarını kapsamaktadır. Sicil defterinde Mardin'in mahalleleri, çarşıları, önemli vakıf yapıları, köyleri, nahiyeleri ve çevredeki yer adları hakkında önemli bilgiler bulunmaktadır. Transkripsiyonu yapılan defterde ayrıca ailevi problemler ve satış davalarına konu olmuş şehirde yaşayan aileler, evlerde kullanılan eşyalar ve kadınların mal varlıkları yer almaktadır. Bu çalışmanın amacı şehir tarihine önemli katkılar sağlayan mahkeme kayıtlarının transkripsiyonunun yapılarak araştırmacıların hizmetine sunulmasıdır. Böylece şehrin sosyal ve ekonomik yapısı, demografisi ve mekân gelişimi hakkında birincil kaynak olarak önemli bir katkı sunulmuş olacaktır."
