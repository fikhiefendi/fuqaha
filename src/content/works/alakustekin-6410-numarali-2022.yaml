abstract: "Osmanlı Türk kültürü, Türk hukuku, Türk siyasi ve sosyal hayatını aydınlatmada birinci elden kaynak olarak şüphesiz Şer'iyye Sicillerini gösterebiliriz. Bu münasebetle bu bilgiler ile sosyal tarih yazıcılığında katkıları son derece önem arz etmektedir. Tarihçiler, sicillere bakmadan mahalli olaylar, Osmanlı toplumunun yaşamları ve geçim tarzları hakkında sağlıklı bilgi ortaya çıkaramazlar. Çalışmamız Devlet Arşivlerine bağlı Osmanlı Arşivi'nde kayıtlı“6410 Numaralı Malatya Şer'iyye Sicili'nin (H.1313-1315/M.1897-1899) 1-145 Sayfalarının Transkripsiyonu ve Değerlendirilmesi”içerdiği belge çeşitleri ve konu muhtevalarını ana ilkelerine bağlı olacak şekilde ortaya koyduk. İlk önce çalışmamızdaki defterin her birini art arda numaralandırılarak toplamda 136 belgeyi transkripsiyon kurallarına bağlı kalarak Latin alfabesine çevirdik. Sonra belgelerin her birinin özetlerini çıkartarak bütünlüğü ile alakalı şekilde, konularına göre isimlendirerek muhtevası ve ulaşılan bilgileri dikkate alarak defteri bir bütün halinde incelemeye çalıştık. Çalışmamız giriş kısmında Osmanlı Şer'i Mahkemeleri ve görevlileri, ile ilgili bilgi verilmiştir. Çalışmamız beş bölümden oluşmaktadır. Birinci bölümde Şer'iyye Sicilleri, önemi ve belge çeşitleri; ikinci bölümde Malatya Tarihi, coğrafi konumu, şehrin mimari yapısı; üçüncü bölümde aile ve sosyal yapı, mehir, nikâh, boşanma, nafaka, vekâlet, vesayet, miras ve tereke hakkında bilgi yer almaktadır. Dördüncü bölümde ise belgelerin özeti ve belgede geçen Malatya'nın mahalle ve köy isimleri tablo halinde verilmiştir. Son olarak beşinci bölümde“6410 Numaralı Malatya Şer'iyye Sicili'nin (H.1313-1315/M.1897-1899) 1-145 Sayfalarının Transkripsiyonu ve Değerlendirilmesi”yapılmıştır. Şer'iyye Sicilleri'ni incelememiz konu çeşitliliği ve içeriğinin zenginliği bakımından gerek geçmişe dair bilgilerin ortaya çıkarılmasında gerekse günümüze ışık tutması açısından son derece önemli ve gereklidir."
