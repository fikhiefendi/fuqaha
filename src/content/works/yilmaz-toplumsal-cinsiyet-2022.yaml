abstract: "Kadın ve erkek cinsiyeti hem biyolojik hem de toplumsal olarak birbirinden farklıdır. Toplumsal farklılık rollerin paylaşımından kaynaklanır. Sosyo-kültürel ve ekonomik olarak yaşanan değişimler toplumsal cinsiyet kavramının ortaya çıkmasına sebep olmuştur. Biyolojik cinsiyet ve toplumsal cinsiyet birbirinden ayrıştırılmıştır. Cinsler arasında farklılığın ve eşitsizliğin ortadan kaldırılması dillendirilmiştir. Toplumda bir arada yaşayan kadın ve erkek arasındaki eşitsizliklere vurgu yapılmıştır. Bu eşitsizliklerin nedenleri arasında dinin olduğu iddia edilmiştir. İslâm dinine göre kadın ve erkek ayrı cinsiyette farklı yapıda yaratılmıştır. Hükümler verilirken insanın yaratıldığı cinsiyeti, yapısı, toplumun durumu ve hayatın gerekleri gözden uzak tutulmamış, kişilerin özel durumları dikkate alınmıştır. Bu nedenle bazı hükümlerde cinsiyet belirleyici olmuştur. Cinsiyet kaynaklı bu farklılık, ayrımcılık ve eşitsizlik olarak algılanmamıştır. Her iki cinsiyete de sorumluluklar verilmiş ve sonucunda da mükafaatlar vaad edilmiştir. Cinsiyetine bakılmaksızın iman eden her Müslüman, namaz, oruç, zekât, hac gibi farz ibadetleri yerine getirmede mükelleftir. Yani mükellef olma konusunda kadın ve erkek arasında herhangi bir cinsiyet farklılığı bulunmamaktadır. İbadetlerin ifâ edilmesinde de her iki cinsiyet arasında ibadetlerin özü itibariyle herhangi bir ayrım söz konusu değildir. İbadeti yerine getirirken yapılan hareketler, giyilen kıyafetler, ibadet mekânı her iki cinsiyettekilerin yapısı gereği değişiklik gösterebilmektedir. Bu durum kadınlar için herhangi bir ayrımcılık durumunu oluşturmamaktadır. İslâm aile hukukunda evlenme ve boşanma konusunda fıtrata uygun hükümler verilmiştir. Kadın ve erkek güçleri nispetinde hak ve sorumluluklara sahip olmuşlardır. İslâm miras hukukunda da nimet- külfet dengesi gözetilmiştir. Erkeklerin nafaka temini gibi maddi sorumluluklarından dolayı mirastan fazla pay almaları sağlanmıştır. Ceza hukukunda her iki cinsiyetin de canı, malı, namusu kutsal kabul edilmiştir. Bunlara yönelik işlenen suçların cinsiyet fark etmeksizin cezası verilmiştir. İslâm yargılama hukukunda kadınlar hakimlik ve şahitlik konusunda sorumlukları sınırlı tutulmuştur. İslâm hukukunda farklı olan bu hükümler cinsiyet odaklı değil nimet- külfet dengesi çerçevesinde verilmiş, hükümler eşitlik değil adâlet üzerine bina edilmiştir."
