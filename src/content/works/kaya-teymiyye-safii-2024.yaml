abstract: "Hanbelî geleneğin aykırı ve etkili isimlerinden İbn Teymiyye'nin kelamcılara yönelik metodik eleştirileri Eşarilerin tepkisine yol açmıştır. Bu doğrultuda erken dönemde İbn Teymiyye'ye karşı başını Şâfiî Eşarilerin çektiği reddiye geleneği oluşmuştur. Eşarilik-Hanbelilik çekişmesi, İbn Teymiyye karşıtlığını doğuran ve besleyen unsurların başında gelmektedir. Onun kelamcılara yönelik eleştirel tavrı ve sert üslubu ile taraftarlarının onu aşırı bir şekilde yüceltmesi bu karşıtlığı besleyen diğer faktörlerdendir. Kendisi Hanbelî geleneğe mensup olmakla birlikte henüz hayattayken İbn Teymiyye'nin ashabı şeklinde nitelenen bir taraftar kitlesinin oluşması ve muhaliflerinin eleştirilerinde İbn Teymiyyeci olarak nitelediği bu kesimin aşırı taassubundan yakınması reddiye geleneği açısından önemli veri sunmaktadır. Memlükler dönemi Mısır ve Şam'ında akide merkezli Eşarilik hâkim olduğu için İbn Teymiyye eleştirilerinin içeriği de buna göre şekillenmiştir. Reddiyelerin tamamına yakını fıkıh ve hadis içeriklidir. Bu husus, İbn Teymiyye reddiyelerinin felsefî boyutunun zayıf kalmasına neden olurken felsefî kelam üzerinden Eşariliği yoğun olarak eleştiren İbn Teymiyye'nin elini güçlendirmiştir. Şâfiî Eşarilerden Takıyyüddin es-Sübkî, İbn Teymiyye'ye farklı alanlarda yazdığı reddiyeleriyle; İhmîmî ise felsefî içerikli tek reddiye müellifi olarak ön plana çıkmıştır. İbn Teymiyye haberi sıfatlarda tevile karşı çıkarken, kabir ziyareti, tevessül, talak, cehennemin sonluluğu, kıdem meselelerinde ayet ve hadisleri tevil etmekten çekinmeyerek ilginç bir akılcılık örneği sergilemiştir. O, kabir ziyareti ve tevessüle dair kimi uygulamaları Şia ile ilişkilendirip bidat ehlinin uygulaması şeklinde mahkûm ederken fıkhî bir mesele olan şarta bağlı talakın geçerli olmadığı hususunda Şia'nın görüşünü benimsemekte herhangi bir sakınca görmemiştir. Bu durum onun inanç ve fıkha dair tercihlerinde farklı saiklerle hareket ettiğinin göstergesidir. İbn Teymiyye'nin farklı fıkhî tercihleri, taraftarları tarafından içtihatta ulaştığı yüksek seviyeye ile izah edilirken muhalifleri bunu bidatçilikteki aşırılığıyla izah etmişlerdir. İbn Teymiyye'nin farklı alanlarda eser telif etmesi, eklektik düşünce yapısı ve görüşlerinin dağınıklığı ona yönelik eleştirileri de çeşitlendirmiştir. O, talak konusunda Şia ve Zahiriler, cehennemin sonluluğunda Cehm b. Safvân, kıdem meselesinde filozoflar, haberi sıfatlar ve kelâmullah konusunda ise teşbih ve tecsim ehli gibi düşünmekle eleştirilmiştir. Kimi hususlarda ise hiçbir mezhep ve kişinin benimsemediği fikirleri ortaya atmakla tenkit edilmiştir."
