abstract: "Günümüzde İslâm hukukunun uygulanmadığı ülkelerde kadının resmî mahkemelerde boşanma talebiyle dava açması üzerine hâkimin boşamaya hükmetmesi hususu Müslümanlar açısından bazen sorun oluşturmaktadır. Bu çalışmada, kocasının rızası olmadan kadının tek taraflı şer'î olmayan mahkemeye başvurması neticesinde yargıcın boşamaya karar vermesinin şer'î hükme uygunluğu tespit edilmeye çalışılmıştır. Kâdı bulunmadığı durumlarda kâdı yerine geçecek hakemlerin kararları,fukahanın geliştirdiği yöntemler ile amel etmek hususu ve zaruret gibi nedenlerden ötürü İslâmî olmayan mahkemeye başvurmanın caiz olduğu durumlar irdelenmiştir. Şer'î kâdının bulunmadığı durumlarda hakemlere başvurmanın bir çözüm yolu olduğu belirtilmiştir. Bazı araştırmacıların hakemlere sınırsız çözüm rolünü yüklemeleri hususu deliller temelinde tartışılmıştır. Mezkûr problemin çözüme kavuşturulması için diğer bir yöntem olarak tarafların kâdının yokluğunda kâdı yerine geçecek İslâmî mercilere başvurulması gerektiği belirlenmiştir. Meselenin ictihadî boyutundan hareketle zaruret vb. sebeplerden dolayı beşerî hukuk sistemindeki boşamaları geçerli gören kesimin görüşüyle de amel edilebileceği kanaati hâsıl olmuştur. Öte yandan her görüş temsilcisinin delilleri ortaya konulmuş leh ve aleyhteki tüm görüşler değerlendirmeye tabi tutulmuştur. Şer'î yargının yokluğunda İslâmî mercilere başvurulması gerektiği hususu tercihe şayan görülmüş ve fukahanın klasik ve çağdaş fetvalarına yer verilerek tercih sebebi belirtilmiştir. Son olarak da kâdının yokluğunda kâdı yerine geçecek merciinin veya beşerî hukuk sisteminin boşamalarını geçerli olduğunu savunanlara göre kadının kaç talâkla kocasından boşandığı hususu tespit edilmiştir."
