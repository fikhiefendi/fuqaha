abstract: "Kadıların verdikleri ilam,hüccet ve cezalarla,görevleri gereği tuttukları çeşitli kayıtlan içeren defterlere şer'iyye sicilleri denir. Osmanlı devletinde İslam,hukuk kuralları geçerli olduğu için çalışmamızın ilk bölümünde Osmanlı adliye teşkilatının yapısı ve görevleri hakkında bilgi verilmiştir. Araştırma konumuz olan 452 numaralı Ebistan şer'iyye sicilleri H.1285/M.1868- 1869 yıllarına ait tereke kayıtlan, i'lam, vasi, vekalet ve nafaka hüccetlerini içermektedir. Araştırma konusu olan Elbistan'ın 452 numaralı Seriye Sicili; sırtı kahverengi meşin, satıhları kırmızı üzerine san puanlı, yırtık bez kaplı bir defter olup, hicri 1284- 1288, miladi 1868-1871 yıllannı kapsamaktadır. Milli Kütüphane'ye Adana Müzesi'nden gönderilmiştir. Bu tarihte Elbistan, Halep Vilayetine bağlı Maraş Sancağı'nın bir kazası idi. Araştırmamızda Elbistan'ın tarihi gelişimi hakkında da bilgi verilmiştir.Bu çalışmamızda H.1285/M1 868-1 869 tarihinde Elbistan ve çevresinde meydana gelen siyasi,ekonomik,sosyal,idari ve hukuki olaylan müslim ve gayrimüslim arasındaki ilişkileri şer'iyye siciline dayanarak açıklanmaya çalışılmıştır. Okuyucuya kolaylık sağlamak amacıyla belgeleri özetleri çıkartılıp daha sonra Osmanlıca metin transkripsiyonu verilmiştir. Defteri tanıtmak amacıyla ekler bölümüne 5 adet örnek belge fotokopisi de konulmuştur."
