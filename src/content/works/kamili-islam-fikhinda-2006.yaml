abstract: "TEMEL İSLAM BİLİMLERİ ANA BİLİM DALI İSLÂM HUKUKU BİLİM DALIİSLÂM FIKHINDA NAMAZ İBADETİ(Anlamı, Tarihçesi, Fert ve Toplum Üzerindeki Etkileri)Fahri KAMİLİ(Yüksek Lisans Tezi)ÖZETİslâm dininin temel ibadetlerinden biri namazdır. Namaz, kişi ile Allaharasındaki manevi bağları güçlendiren, ruh ile beden arasındaki dengeyi sağlayan vedolayısıyla bireyin günlük hayatını düzene sokan bir ibadettir.Namaz konusunda, daha önce bu kapsamda bir yüksek lisans tezinin yapılmamışolması, bu çalışmanın temel saikidir.Bu çalışma, bir giriş ve üç ana bölümden oluşur. Girişte, namazın anlam vemahiyeti, Kur'an, Sünnet ve Fıkıhta namaz ile diğer dinlerde ve İslâm öncesi Cahiliyedöneminde namaz konuları işlenmiştir. ?İslâm'da Namaz İbadeti? başlığını taşıyan ilkbölümde, İslâm'da namazın tarihçesi ve namaz çeşitleri ele alınmıştır. İkinci bölüm?İslam Fıkhında Namazın Kılınışı? başlığını taşır. Burada ferdi ve cemaatle kılınannamazlar, namaz kıldıracak kişide bulunması gereken özellikler gibi konular, farklıamelû mezheplerin görüşleri dikkate alınarak işlenmiştir. Son bölümde ise, namazın fertve toplum hayatı üzerindeki etkileri tespit edilmeye çalışılmıştır.Yazarı: Fahri KAMİLİTezin Adı: İslam Fıkhında Namaz İbadeti (Yüksek Lisans Tezi)Danışmanı: Prof. Dr. Yunus Vehbi YavuzSayfa Sayısı: XI+ 177."
