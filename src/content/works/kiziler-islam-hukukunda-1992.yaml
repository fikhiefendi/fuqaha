abstract: "Tarih boyunca insanlığın en çok ihtiyaç duyduğu şeylerin başında, adalet ve adaletin isabetli bir şekilde gerçekleşmesi için hukuk normlarının doğru olarak tatbik edilmesi olmuştur. Şüphesiz bu durum, İslam hukukunun da temel hedefleri arasında yer almıştır. Bu sebeple İslam hukuku, söz konusu hedefini gerçekleştirmek için hukukun şekilsel açıdan tatbik edilmesine yani muhakeme hukukuna ayrı ve özel önem vermiştir. Yüksek lisans tezi olarak hazırlanan bu çalışmada, adaletin gerçekleştiği yerler olan adliyelerde yürütülen muhakeme şekli, buralarda görev alan hakimler, savcılar ve diğer hukuk mensupları, taraf olarak mahkemeye müracaat eden davacı ve davalı ile şahitlerin muhakeme sırasında uymaları gereken şekil şartları incelenmiştir. Çalışma, giriş ve üç bölümden oluşmuştur. Giriş bölümünde; konunun önemi, sınırlandırılması ve takip edilen metot anlatılmıştır. Birinci bölümde; İslam hukukunda uygulanan muhakeme şeklinin mukayese edilebilmesi düşüncesiyle İslam öncesi hukuk sistemlerinden İran, Mısır, Hint, Roma, Yunan ve Cahiliye Araplarında yürütülen muhakeme şekillerine değinilmiştir. İkinci bölümde; devletin asli görevleri ile bu görevlerden yargının mahiyeti hakkında kısa bilgi verildikten sonra, muhakemeyi yürüten yargı kadrosu üzerinde durulmuştur. Şüphesiz önemi ve sonuçları bakımından hassas olan yargının geniş bir kadro ile yürütülmesi söz konusudur. Buradan hareketle muhakemede yer alan görevliler asıl ve yardımcıları olmak üzere bir tasnife gidilmiştir. Asıl görevlilerden hâkime öncelik ve ağırlık verilmiştir. Ayrıca bu bölümde, muhakemenin yapıldığı mekân ve zamana da yer verilmiştir. Üçüncü bölümde ise; muhakemede önemli unsurlar olan taraflar ile şahitler ele alınmıştır. Davacı ile davalının mahkemeye müracaatları, çağırılmaları, iddia ve savunmalarını yaparlarken uymaları gereken kurallar da bu bölümde incelenmiştir. Ayrıca şahitlerin muhakeme sırasın¬daki hal ve hareketleri ile mahkemenin onlar hakkında uygu-ladığı tezkiye (güvenlik soruşturması) de bu bölümde ele alınmıştır. Sonuç kısmında ise araştırma sırasında varılan kanaat ile genel bir değerlendirme yapılmıştır."
