abstract: "Bankacılık sektöründe temel finansal ihtiyaçların karşılanması bakımından iki önemli aktör olan katılım ve mevduat bankaları sunmuş oldukları finansal ürün ve hizmetlerde farklı çalışma yöntemlerini izlemektedirler. Toplumun ihtiyaçlarına benimsemiş oldukları farklı prensipler üzerinden çözüm üreten katılım ve mevduat bankalarının izlemiş oldukları yöntemlerin incelenmesi finansal sistemin daha iyi anlaşılmasına yardımcı olacaktır. Bu kapsamda bu çalışma ile katılım ve mevduat bankalarının çalışma prensipleri ve sektörel verilerinin karşılaştırmalı bir analizinin ortaya konması amaçlanmıştır. Nicel ve nitel araştırma yöntemlerinin bir arada kullanıldığı bu çalışmada, öncelikle konuyla ilgili detaylı bir doküman incelemesi yapılarak her iki bankacılık modeline ilişkin sektörel raporlar incelenmiş ve ardından Bankacılık Düzenleme ve Denetleme Kurumu (BDDK) ile Türkiye Katılım Bankaları Birliği (TKBB) tarafından yayımlanan sektörel veriler çeşitli tablo ve grafikler yardımıyla yorumlanmıştır. 2015-2023 dönemini kapsayan sektörel veriler, her iki banka türünün banka, şube ve personel sayıları, aktif büyüklükleri, toplanan ve kullandırılan fonlar, özkaynaklar ve net kârları üzerinden karşılaştırılmıştır. Çalışmadan elde edilen bulgulara göre, mevduat bankalarının sektördeki ağırlıklı payı azalırken katılım bankalarının payının artmakta olduğu ve bu alanda istihdam edilen personel sayısı, toplanan ve kullandırılan fonlar, aktif büyüklük, özkaynaklar ve net kârlar konusunda da istikrarlı bir artış kaydedildiği sonucuna ulaşılmıştır."
