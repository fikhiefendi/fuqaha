abstract: "Tarihsel olarak, gelişmekte olan ülkelerin ekonomik büyüme süreçlerinde geleneksel finans sisteminin beraberinde getirdiği birtakım kısıtlamalardan bahsetmek mümkündür. Bu bağlamda gelişmekte olan ülkelerin mevcut uluslararası finans sisteminde karşılaştığı döviz kuru dalgalanmaları, yüksek işlem maliyetleri ve dolar bağımlılığı gibi ortak sorunları, bu ülkeleri yeni çözüm arayışlarına itmektedir. Bununla birlikte, küresel finansal sistemin son dönemde geçirdiği dijitalleşmeye dayalı yoğun dönüşüm gerek devletler gerekse de ekonomik iş birliğine yönelik örgütler için çeşitli fırsatlar ve zorlukları beraberinde getirmektedir. Bu anlamda dijital dönüşüm, blokzincir teknolojisi ve kripto paralar gibi yenilikçi finansal araçlar ile ekonomik iş birliklerini güçlendirme potansiyeli taşırken, bu gibi yenilikçi finansal çözümlerden ekonomilerin nasıl fayda sağlayabileceklerini önemli bir araştırma alanı haline getirmektedir. Bu çalışmanın amacı, geleneksel finans sistemine alternatif olarak ortaya çıkan kripto varlık piyasaları kapsamında ortak kripto para kullanımının D-8 ülkeleri özelinde mümkün olup olmadığını incelemektir. Bu kapsamda çalışmada ortak kripto para kullanımına yönelik ekonomik, teknik ve politik ön gereksinimlerin neler olduğu ve üye ülkelerin buna ilişkin mevcut finansal altyapıları, düzenleyici çerçeveleri ve teknolojik hazırlık düzeyleri ele alınmaktadır. Çalışmada ayrıca, ortak kripto para kullanımının muhtemel avantajlarının yanı sıra, bu tür modern finansal araçların beraberinde getirebileceği olası riskler ve İslami finans prensipleriyle uyumluluğu irdelenmektedir. Çalışmada, D-8 özelinde tüm üyeleri aynı anda kapsayan tekil bir uygulama yaklaşımının kısa vadede gerçekçi görülmediği, bunun yerine kademeli, esnek ve çok katmanlı bir uygulama sürecinin benimsenmesinin faydalı olacağı sonucuna ulaşılmaktadır. Bu kapsamda altyapı ve düzenleyici çerçeveleri görece güçlü olan Malezya, Endonezya ve Türkiye'nin pilot bir uygulama ile ortak kripto para sistemine öncülük edebileceği, Nijerya'nın ise kısa vadede sürece teknik katkı sağlayabileceği öngörülmektedir. Buna karşılık kripto varlık piyasalarının erken gelişim aşamasında olduğu Mısır ve Pakistan'ın gözlemci statüsüyle kendi ulusal Merkez Bankaları vasıtasıyla uygulama süreçlerini ve düzenlemelerini netleştirmesi gerektiği görülmektedir. Ayrıca Bangladeş'in düzenleyici yasaklar kalkmadıkça ve İran'ın da uluslararası yaptırımlar nedeniyle kısa vadede resmî ortak para sistemi içerisinde değerlendirilemeyeceği de anlaşılmaktadır. Bu bağlamda fiziksel varlık temelli, merkezi denetime tabi, teknolojik altyapısı güçlü, İslami prensiplerle örtüşen, dışsal şoklar ve dalgalanmalara dirençli bir ortak kripto para sistemi gerek teşkilat içi gerekse de uluslararası ticareti destekleyerek ekonomik entegrasyonu artırabilecektir. Nihai olarak, hayata geçirilebilir bir ortak kripto para sistemi rezerv para birimlerinin küresel hegemonyasına karşı potansiyel bir alternatif sunarak, D-8 bloğunun finansal ve ekonomik sistemine önemli bir katkı sağlayabilecektir."
