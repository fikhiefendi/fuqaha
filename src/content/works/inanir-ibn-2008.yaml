abstract: "Ahmet İNANIR tarafından hazırlanan ?İbn Kemal'in Fetvaları IşığındaOsmanlı'da İslâm Hukuku? adlı bu tezde, İbn Kemal'in fetvalarındanhareketle XVI. yüzyılın ilk yarısında Osmanlı toplumunda aile, ticaret,arazi, vakıf ve ceza hukuku alanlarında karşılaşılan hukukî sorunlar veçözümleri incelenmiştir. Elde edilen verilerden hareketle bu dönemde İslâm hukukunun nasıl anlaşıldığı, uygulandığı tespit edilerek İbn Kemal'in Osmanlı hukukuna katkıları ortaya konulmaya çalışılmıştır.İbn Kemal'in fetvalarında Hanefî mezhebine sıkı sıkıya bağlı kalmaya özen gösterdiği anlaşılmaktadır. O, devraldığı zengin hukuk külliyâtı içinde bir meselede farklı görüşlerle karşılaştığında; zayıf da olsa devlet ve toplum maslahatına uygun görüşü tercih etmeye çalıştığı gözlenmiştir. İctihadlar arasından birini tercihte zorlandığı durumlarda fakihleri tasnif ederek maslahata uygun çözümü ortaya koyma yolunu tutmuştur. Hanefi mezhebi içinde uygun çözüm bulamadığı nadir durumlarda Şafiî kadısına yönlendirerek sorunu çözme yoluna gitmiştir.İbn Kemal, Şia'ya yönelik fetvalarıyla uygulamayı etkilemiş, Osmanlı sultanlarını Sünnîliğin temsilcisi olduğunu açıkça belirtmiştir. O, fetva ve risaleleriyle toplumun Sünnî çizgide kalmasına çaba göstermiştir. Ayrıca başta arazi ve para vakfıyla ilgili olmak üzere pek çok fetvası kendisinden sonraki uygulamayı etkilemiştir.Bu dönemde çıkarılmış pek çok kanunla İbn Kemal'in fetvaları arasında tespit ettiğimiz paralellik, onun Osmanlı hukukunun oluşumuna katkısının açık bir delili olarak görülebilir. Zira o, daha bu yüzyılda İslam hukukunun kanunlaştırılmasının ilk örneklerini ortaya koymayı başarmıştır.Kısaca İbn Kemal'in Türk-İslâm hukukuna katkısı klasiğin dışına çıkmadan yaşadığı dönemin sorunlarına Hanefi fıkhından devlet ve toplum maslahatına uygun pratikleri ortaya koyma şeklinde olduğu söylenebilir."
