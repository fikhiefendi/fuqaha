abstract: "Çalışmanın sınırları göz önünde bulundurulduğunda bu tezde çok fazla detaya girilmemekle birlikte“İhtiyar”adlı kitap özelinde İslâm hukukunun ibadat ve muamelat başlıkları altında mündemic bulunan aklî deliller mümkün mertebe ortaya konulmaya çalışılmıştır. Şer'i ilimleri tehsil ettiği halde bu ilimlere fazla vukufiyet sağlayamayanlar, nasları anlama hususunda oldukça kısır olup şeriatın“aklî muhakemeden”uzak olduğunu düşünürler. Bunun yanı sıra aklî delilleri, fakihlerin icma'ına, kıyasına ve şartlarına uygun olmaksızın kendi heva ve heveslerine göre oluşturduğunu düşünenler de vardır. Halbuki akıl, İslâm hukukunda hüküm çıkarma konusunda oldukça önemli bir konuma sahip olup gelişigüzel veya heva ve heveslere göre de kullanılmamıştır. Aklî delil, akıl sahiplerinin uğraştığı dakik mevzular ve ilimle uğraşanların vukufiyet kespettiği işlerdendir. Dolayısıyla bu tür konular alanda uzmanlaşmış ilim erbabı tarafından daha iyi anlaşılıp takdim edilebilir.“el-İhtiyâr”adlı eseri ile Mevsili bunun en güzel örneklerindendir. Zira kendisi ibadat ve muamelat konularında işaret ettiği akli delillerden hareketle aklın İslam hukuku açısından ne denli önemli olduğunu göstermektedir. Söz konusu eserinde Mevsili'nin birçok akli istidlal metodunu kullanması da bunu teyid etmektedir."
