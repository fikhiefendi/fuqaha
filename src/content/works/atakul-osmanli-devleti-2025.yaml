abstract: "Bu çalışmada, Osmanlı Devleti'nde harp ganimetlerinin hukuki statüsü ele alınmıştır. Tezde, harp neticesinde, düşmandan ganimet olarak elde edilen menkul mallar, araziler ve esirlerin hem İslam hukukundaki statüsü hem de Osmanlı Devleti'nde bu hükümlerin tatbikattaki tezahürü tetkik edilmektedir. Araştırmada, İslam hukuku kaynakları olan fıkıh ve fetva kitapları, Osmanlı Devleti'ne ait kronikler, fetva mecmuaları, kanunnameler, arşiv vesikaları temelinde tarihi hadiselerin hukuki cihetten tetkik edilmesi şeklinde bir usûl tercih edilmiştir. Osmanlı Devleti'nde harp ganimetlerine (menkul mallar, fethedilen araziler ve harp esirleri) dair tatbikatın; İslam hukukunda bilhassa Hanefî mezhebinin, ganimet iktisabı, taksimi, tenfîli, beşte birinin (humus) beytülmale tahsisi, fethedilen arazilerin hukukî statüleri ve esirlere dair hukukî muamele gibi temel esaslarına umûmiyetle mutabık olduğu tespit edilmiştir. Osmanlı Devleti'nde yağma, pençik, miri arazi gibi tatbikatların İslam ganimet hukukuna istinad ettiği anlaşılmıştır."
