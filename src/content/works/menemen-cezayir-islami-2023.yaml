abstract: "Müslümanlar konumu itibariyle farklı medeniyetlerin hâkimiyet kurmak istediği Cezayir'de 600'lü yıllardan itibaren hüküm sürmüştür. 1830'da Fransa'nın işgaliyle Cezayir'de sömürge faaliyetleri başlamıştır. İngiltere ile sömürge yarışı halinde olan Fransa'nın asıl amacı Cezayir'i kendilerine bağlı denizaşırı Hıristiyan topluluğa dönüştürüp Akdeniz ticaretinde söz sahibi olmaktır. Sömürge altındaki Cezayir'de her yönden mücadelesini sürdüren halk, ancak Temmuz 1962'de bağımsızlığını kazanabilmiştir. Bağımsızlıktan sonra beklediği refahı elde edemeyen Cezayir halkı bu defa da tek parti rejiminin dikta yönetimine muhalif tavır takınmıştır. İslamcı şahsiyetler tek parti yönetimine karşı muhalefet kanadında yer alarak siyasete girmiş ve kurdukları partilerle hem Batı asimilasyonuna hem de dikta yönetimine karşı çıkmıştır. İslâmî Selâmet Cephesi (Le Front Islamique Du Salut-FIS) de, XX. yüzyılın son 20 yılında aktivist bir ruhla Cezayir tarihinde adından söz ettiren dinî-siyasî yapılanma olarak karşımıza çıkmaktadır. Akademisyen Abbâs Medenî ve vaiz Ali Belhâc liderliğinde teşkilatlanan bu hareket, çağdaş dönemin sorunlarına çözüm için Kur'ân ve Sünnet ekseninde şeriat temelli bir İslâm devletine gereksinim olduğunu savunmaktadır."
