abstract: "Ekonomi yazınında para çarpanı kavramı ile anlatılan ve bankaların kredi kullandırarak kaydi para veya diğer bir ifadeyle banka parası oluşturdukları kısmi rezerv sistemi, modern finansal mimarinin temeli diyebileceğimiz günümüz bankacılık sisteminin çalışma mekanizmasını oluşturmaktadır. Yasal zorunluluklar için tutulan zorunlu rezervler ile ihtiyat için ve karlı yatırımlarda değerlendirmek üzere tutulan serbest rezervler saklanması gereken tüm mevduatın bir kısmını oluşturmakta, mevduatın kalan kısmı ise bankalarca kredi olarak kullandırılarak karşılıksız para üretilmektedir. Kısmi rezerv bankacılığı özü itibariyle finansal istikrarsızlıklara karşısında zayıf ve kırılgandır. Bu sistem, ticari bankaların ve merkez bankalarının gerektiğinde yeterli likiditeyi sağlayacaklarına dair güvene dayalı olarak yürümektedir. Kısmî rezerv sisteminin zayıf yapısı, ekonomik istikrarsızlıklarda oynadığı rol ve oluşturduğu sorunlar nedeniyle alternatif olarak tam rezerv bankacılığı akademik çevrelerde destek bulmuş ve bunun farklı modelleri geliştirilmiştir. Ancak, tam rezerv sisteminin uygulamaya konulması için gereken siyasi destek bulunamamıştır. Bu çalışmada, kısmi rezerv bankacılığının keşfedilmesiyle ekonomilerde ortaya çıkardığı ileri sürülen sorunlar irdelenmiş, tam rezerv bankacılığının uygulanabilirliği ve çözüm için ne kadar yeterli olduğu incelenmeye çalışılmış ve İslam iktisadı açısından her iki sistemin de uygunluk ve sakıncaları tartışılmıştır. Analiz aşamasında ajan temelli bir simülasyon modeli kullanılarak her iki bankacılık sisteminin ekonomik istikrar üzerindeki etkisi mukayese edilmiştir."
