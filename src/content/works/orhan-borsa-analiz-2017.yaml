abstract: "Gelişmekte olan dünyada, ekonomilere yön veren borsalar; işletmelerin ve yatırımcıların en çok tercih ettiği ve işlem gerçekleştirdiği ortamlar haline gelmiştir. Fakat, mevcut haliyle borsalardaki bir kısım işlemlerin ve spekülasyonların, İslâmi teamüllerle örtüşmemesi nedeniyle, borsadaki işlemlerin caiz olmadığı ifade edilmektedir. Bu nedenle İslâm ve iman esaslarına titizlikle riayet eden yatırımcılar ve işletmeler, borsadan uzak durmaktadırlar. Bu çalışmanın amacı dünya ekonomilerine yön veren borsalarda kullanılan ve borsaları cezbedici hale getiren analiz yöntemlerinin, İslâm ekonomisi enstrümanlarında uygulanabilirliğinin araştırılmasıdır. Keza İslâm ekonomisinin gelişmesi ve ilerlemesi için güçlü bir finansal yapıya sahip olması, bu mevzuda işletmelerin ve yatırımcıların bu alana yönelmesi büyük önem arz etmektedir. Ülkemizde menkul kıymetler borsasının henüz faal olmadığı 30-35 yıl öncesi dönemde, bazı dükkân ve mağazaların vitrininde, örneğin“Bursa Çimento Fabrikası hisse senedi alınır satılır”gibi ilânlarına rastlanırdı. Aynı fabrikanın hisse senetlerinin Eskişehir, Kütahya, Konya gibi şehirlerde benzer ilânlarla alım-satımının yapıldığı düşünülürse, birbirinden irtibatsız ve habersiz piyasalarda farklı fiyatların oluşması söz konusu olmaktadır. Bu hisse senedini alınca aynı ekonomik ürüne ortak olunmaktadır. Bir şehirde 100 liraya alınan hisse senedi başka şehirde 150 liraya alınabilmekteydi. Kısaca borsanın kurulması ile hisse senetlerinin ülke çapında hatta dünya çapındaki değeri standardize edilmiş oldu. Bu yönüyle borsaları, İslâm'ın“arz ve talep dengesine göre eşya fiyatlarının oluşması”ilkesini menkul değerlerde gerçekleştiren merkezler olarak değerlendirmek mümkündür. Yeter ki borsa spekülasyonlarına ve manipülasyonlarına fırsat verilmesin. Ancak burada İslâmî yönden ele alınması gereken, hisse senedi satışı yapılacak olan kuruluşun (şirketin) arka plandaki mal varlığı, üretimi ve pazarlaması meşru mu değil mi bu suâlin araştırılması gerekmektedir. Eğer şirketin kuruluşu ve üretimi meşru ise, hisse senedinin alım satımı da meşru olur. Günümüzde, şirket blançolarını izleyerek, hisse senedinin alım satımının meşru olmasının ölçü ve standardını izleyen ve bu gibi şirketlerin isimlerini belli (üç ay gibi) sürelerle güncelleyip yayınlayan kuruluşlar da vardır. Türkiye Katılım Bankalar Birliği (TKBB) ile irtibat kurulduğunuda bu bilgilere ulaşmak mümkündür. Bu nedenle borsanın meşru olup olmamasını tartışmak yerine orada alım satımı yapılan menkul kıymetlerin arka planda temsil ettiği yatırım ve üretimin meşru olup olmadığı veya hangi ölçüde meşru olduğunun ortaya konulması gerekir. Bu amaçla; menkul kıymetlerin arka planda temsil ettiği yatırım ve üretimin meşruiyetinin araştırılabilmesine imkan sağlayan ve borsada kullanılan analiz tekniklerinin çalışma prensipleri ayrıntılı olarak incelenmiş, İslâm ekonomisinin temel ilkeleri ışığında, İslâmi finans aracı sukukta uygulanabilirliği araştırılmıştır."
