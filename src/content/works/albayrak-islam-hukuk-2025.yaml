abstract: "İslam hukuku; muamelat ve ceza gibi alanlarda bireyin hayatını kuşatan bütün hükümleri inceleyen bir ilim dalıdır. Bu alanın öğretimini kolaylaştırmak amacıyla İslam hukukçuları çeşitli ilmi ve pedagojik yöntemler geliştirmiş, bu çerçevede fıkıh konularının manzum üslupla kaleme alınması önemli bir yer tutmuştur. Manzum fıkıh eserleri hem edebî hem ilmî yönüyle dikkat çeken, bilgilerin sözlü aktarımını kolaylaştıran metinlerdir. Bu çalışmanın amacı, hicrî onuncu asra kadar kaleme alınmış usûl ve fürû' ilimlerine dair manzumeleri tespit ederek, bu eserleri içerik, üslup ve edebî özellikleri bakımından değerlendirilmesidir. Eserlerin fıkıh ilmine katkıları ile literatürdeki yeri ortaya konmuş ve bu alandaki akademik boşluğun giderilmesi hedeflenmiştir. Bu araştırmanın birinci bölümünde, İslam hukukuyla edebiyat arasındaki ilişki incelenmiş; Nâzım şeklinde kaleme alınan eserlerin tanımı, önemi, başlıca özellikleri, ortaya çıkışı, İslam hukuku konularına göre tasnifi ve başvurulan kaynakları ele alınmıştır. Ardından usûl, fürû, miras ve muhtelif furû konularında manzum eserler gibi alanlarda telif edilen manzumelere dair genel bir giriş sunulmuştur. İkinci bölümde ise fıkıh usûlüne dair yazılmış 11 manzume değerlendirilmiş bu manzumeler mezheplere göre tasnif edilerek her bir mezhep içerisinde kronolojik sıraya göre düzenlenmiştir. Üçüncü bölümde ise fıkhın fürû alanında kaleme alınmış 35 manzume incelenmiş ve bu manzumeler üç ana gruba ayrılmıştır. Bunlar furuun bütününü ele alan fürû manzumeleri, sadece miras ilmine dair manzumeler ve fürun belli bir meselesine dair müstakil manzumelerdir. Bu araştırma sonucunda, usûl ve fürû' alanlarında kaleme alınmış 46 manzume tespit edilmiş; bu eserler, fıkhî mezheplerine ve yazılış tarihine göre kronolojik olarak sıralanmıştır. Bu çalışmada, ilgili manzumelerin fıkıh ve fıkıh usûlü ilimlerinin öğretimini kolaylaştırmadaki rolleri ve bu bağlamdaki etkileri incelenmiştir. Ayrıca çalışmada bazı manzumelerin veciz olması ve başlıklandırma tertibi gibi özellikleri sebebiyle İslam hukukçularının ilgisini çektiği, bu sebeple şerhlere ve tahkik çalışmalarına tabi tutulduğu, bazılarının ise ya anlatım zorluğu ya da yazarının şöhret kazanmaması sebebiyle ihmal edildiği ve mahtut olarak bırakıldığı ve kaybolmaya yüz tuttuğu görülmüştür."
