abstract: "ÖZET Toplumsal hareketliliğin oldukça yavaş olduğu bu devirde, herhangi bir şehrin bir yıllık tarihinin araştırılması, aslında o şehrin daha büyük bir zaman dilimi içerisindeki durumunu ortaya koymaya yardımcı olacaktır. Bu düşünce ile; 1145 / 1732 yılma ait olan 189 nolu seriye sicilinin aynen transkripsiyonu ve değerlendirmesiyle Manisa kazasının idarî, iktisadî ve sosyo-kültürel yapısı ortaya konulmaya çalışılmıştır. Sicilin bir yıl gibi kısa bir süreyi ihtiva etmesine rağmen kaza idaresi ve sosyal hayat hakkında özel ve kıymetli bilgiler sunmaktadır. Konu edindiğimiz tarihte Manisa'da görevli şahısların belirlenmesi ve bu şahıslara ait sosyal statünün belirtilmesinde önemli bilgilere ulaşılmıştır. Manisa halkının günlük yaşamına, mahkemeye intikal etmiş birçok olayların yardımıyla vâkıf olunmuştur. İnsanların ticarî ilişkileri sayesinde, günlük kullanılan eşyaların, bağ, dükkan ve ev gibi gayr-i menkullerin, ziraî alet ve hayvanların alım-satım ve fiyatları öğrenilmiştir. Çeşitli örf ve gelenekleri, hukukî uygulamaları, ailevî durumları hatta dünyayı algılayış açılarını hukukî bir metin olan mahkeme kayıtlarından çıkarmak ve kaza halkını tanımak mümkündür. Dolayısıyla bu çalışmada tüm veriler nicelik (rakamsal) ve niteliğiyle beraber sunulmaya çalışılmıştır."
