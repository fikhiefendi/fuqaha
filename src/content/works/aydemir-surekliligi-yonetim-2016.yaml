abstract: "Bu çalışmada iş sürekliliği yönetim sistemi ve bankacılık sektöründe iş sürekliliğinin nasıl uygulanabileceğine yönelik örnek bir model anlatılmaktadır. İş sürekliliği yönetim sisteminin amacı, kamu veya özel sektördeki tüm işletmelerde müşterilere yüksek kaliteli hizmeti kesintisiz olarak sunabilmek, işletmenin imajını korumaya, yasal yükümlülükleri yerine getirmeye ve müşterilerin ihtiyaçlarını karşılamaya en olumsuz koşullar altında dahi devam edebilmektir. İş sürekliliği yönetim sistemi, bilgi teknolojileri uygulamaları, çalışan, lokasyon, tedarikçi vb. diğer kaynakların yedeklenmesi ve alternatif çalışma yönteminin belirlenmesi çalışmalarını içermektedir. İş sürekliliğinin temelini oluşturan tanımlar, dünyada ve ülkemizde bu konudaki standartlar ve kanuni zorunluluklar incelenmiştir. Olası bir kesinti/afet durumunda mal ve can kaybını önlemek için gereksinim duyulan acil eylem yönetimi çalışmaları, olayın itibar etkisi, kamuoyu ve ilgili yasal otorite bilgilendirmelerinin nasıl yapılabileceğine yönelik çalışmalar kriz yönetimi konuları arasında incelenmiştir. Kritik faaliyetlerin belirlenmesi, IT sistemlerinin yedeklenmesi ve altyapı tasarımlarına yönelik çalışmalar iş etki analizi konuları arasında incelenmiştir."
