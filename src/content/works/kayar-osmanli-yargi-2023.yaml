abstract: "Nâib Osmanlı yargı teşkilatında görev alan kadı yardımcılarındandır. Kadıya vekaleten hukuk ve ceza davalarını görebilmiş, mahkeme dışında icra edilmesi gereken işlemleri yerine getirmiştir. İslam hukukunun teşekkül ettiği ilk dönemlerde nâiblik uygulaması ortaya çıkmıştır. İslam hukukunda kadıların nâib tayin edebilmesi velayet-i amme yetkisi çerçevesinde olup nâib devlet başkanının vekili olarak kabul edilmiştir. Osmanlı klasik dönem kanun düzenlemelerinde nâibler hakkında çeşitli hükümler mevcut olmuştur. 18. yüzyılda nâiblerin tayininde değişikliğe gidilmiş ve sınav sistemi getirilmiştir. 1838 yılı itibariyle o zamana kadar uygulanan kadıların görev yerlerine nâib göndermeyip bizzat gitmeleri politikası terk edilmiştir. Kadıların kendileri yerine nâibler tayin etmesi ve bu uygulamanın giderek yaygınlaşmasıyla Tanzimat dönemi itibariyle kadılar kavramsal olarak nâib şeklinde anılmıştır. 1855 Nüvvâb Hakkında Nizamname yalnızca nâibler hakkında bir düzenleme olmakla birlikte nüvvâb ile kastedilen şer'iye mahkemesi hakimleri olmuştur. Osmanlı uygulamasında farklı isimlerle anılan çok sayıda nâib mevcut olmuştur. Nâibler icra ettikleri görevler bakımından genel yetkili ve özel yetkili nâibler olmak üzere iki kategoriye ayrılmalıdır. Nâibler hukukun her alanına dair meselede görev alabilmiş, çeşitli idari işler yürütmüştür. Nâiblerin vermiş olduğu kararlar farklı makamlar aracılığıyla denetlenebilmiştir. Nâibler mahkemelerin boş kalmaması ve yargı işlerinin hızlı yürütülmesi bakımından faydalı olmuştur. Ancak mesleğe girenlerin niteliği, atama usulleri ve ekonomik sebeplerle zaman içerisinde kurumda yozlaşma meydana gelmiştir. 01.01.2013 tarihinde yürürlüğe giren 7413 sayılı Kanun'da yer alan hakim ve savcı yardımcılığına tarihimizdeki en yakın kurum nâibliktir. Nitekim söz konusu kanun hükümleri ile Tanzimat dönemi nâiblik kurumu hakkındaki düzenlemeler benzerlik göstermektedir."
