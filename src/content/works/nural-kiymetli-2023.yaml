abstract: "İnsanlık tarihinde, neredeyse toplumsal hayata geçildiği dönemlerle birlikte hayatımıza girmiş ve her çağda tüm insanları etkisi altına almış, günümüzde de her toplumda ve toplumların hemen her kesiminde yoğun bir şekilde ilgi gören altın, kıymetli madenler arasında da fark yaratıcı özellikleriyle insanın olduğu her yerde, her zaman diliminde ve hayatın çeşitli alanlarında kendine önemli bir yer bulmuştur. Altın tarihi serüveninde, yeri geldiğinde ekonomik alanda bir değişim aracı olarak kullanılmış kıymetli bir metal, yeri geldiğinde göz kamaştırıcı rengi ve kolay şekil alabilen yapısı nedeniyle takıların vazgeçilmez ana unsuru, dekorasyonun aranan materyali olmuştur. Özellikle de 20.yy'da ivmelenerek artan teknolojik gelişmeler ile bilimsel buluşlar ve yenilikler neticesinde altın, yeri geldiğinde kimyasal yapısının sağladığı avantajlarla, örneğin kusursuz iletken özelliği ile elektronik cihazlarda, korozyona karşı dirençli paslanmaz yapısı ile uzay sanayinde, sağlık ve diş sağlığı alanlarında, bunlarla beraber yüksek öz kütleli yansıtıcı özellikleri ile mühendislik ve nano teknoloji alanlarında her geçen gün daha fazla talep görmektedir. Tabi ki altının bu fiziksel, kimyasal ve mekanik özelliklerinin yanında tarih boyunca bir değişim aracı olarak kullanılması ve nakit özelliği ile genel kabul görmesi neticesinde sahip olduğu parasal değeri, altını yine diğer metallerden ayıran farklı bir konuma getirmiştir. Bu parasal genel kabul gören özelliği sayesinde, yeri geldiğinde para birimleri altına endekslenerek fiyatlanmış, yeri geldiğinde ekonomik dalgalanmalarda ve meydana gelen kriz dönemlerinde her daim insanlar tarafından sığınılabilecek güvenli bir liman olarak tercih edilmiştir. Taşıdığı tüm bu değer yaratan özellikleriyle doğru orantılı bir biçimde, altının ekonomik sistemlerde kullanımı da artarak çeşitlenmiş, para ve sermaye piyasalarında çeşitli enstrümanlarda kullanılır hale gelmiştir. Ortaya koyduğu güvenli liman algısı sayesinde altın, yalnızca tasarruf edilerek mücevher olarak ziynet formunda fiziken muhafaza edilen ya da çeşitli ağırlıktaki külçelerle bir köşede biriktirilen kıymetli bir metal olmanın ötesinde, artık yeri geldiğinde bankalarda hesapları açılmaya başlanmış, yeri geldiğinde altına dayalı yatırım fonları oluşturulmuş, borsalarda işlem gören fonlar ve altına dayalı kira sertifikaları ihraç edilmiş, yeri geldiğinde altın fonları, bonoları, sertifikaları, tahvilleri, hisse senetleri çıkarılarak finansal sistemde kullanımı her geçen gün artarak devam etmiştir. Bu çalışmada temel olarak, altının para ve sermaye piyasalarında kullanılmasının meydana getirdiği etkiler ile para ve sermaye piyasalarının geleceğinde maden ve para sistemi olarak altının rolünün ve öneminin derinlemesine ortaya konulması amaçlanmıştır. Bunun için ülke deneyimleri ve kapsamlı bir biçimde ilgili literatür araştırması yapılmış ayrıca bu minvalde nitel bir araştırma yöntemi olan derinlemesine mülakat yöntemi kullanılmak suretiyle elde edilen veriler toplanarak değerlendirilmiştir. Çalışmanın sonucunda toplanan bilgiler değerlendirilerek elde edilen tespitler neticesinde; altının finansal piyasalarda kullanılması ile hanehalklarının tasarruf oranlarını artıcı, tasarruf sahiplerine ek gelir sağlayıcı, yatırımcı tabanını genişletici, faiz hassasiyeti olan yatırımcılarda alternatif oluşturucu, finansal okur yazarlığı artırıcı, olumsuz fiyat dalgalanmalarına karşı değer koruyucu, ülke kur riskini ve bununla birlikte dış ticaret açığını azaltıcı, likiditeyi artırıcı ve para politikasında genişletici etkisine yönelik ilişkiler ortaya konmuştur."
