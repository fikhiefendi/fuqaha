abstract: "11 Mart 2020 tarihinde Covid-19 virüs yayılımının D.S.Ö tarafından pandemi ilan edilmesi ve Türkiye'de yine aynı tarihte ilk vakanın görülmesi ile birlikte, birçok kurum alternatif çalışma alanlarında personel çalıştırmaya başlamış ve bu süreç 2021 süresince de devam etmektedir. Bu süreçte Katılım Bankaları da alternatif çalışma alanlarını aktif olarak deneyimlemiştir. Teknoloji kabul modeli ile bu yeni alanların belirlenen kaygı ve iş yapış şekilleriyle birlikte tercih nedenleri, çalışanlar üzerindeki etkileri ölçümlenmek istenmektedir. Araştırma ülke genelindeki Katılım Bankalarında ofis veya şubede çalışanların üzerinden oluşturulan 411 örneklem üzerinden yürütülmüştür. Çalışmaya bulgularında, çalışanların evden-uzaktan çalışma gibi çalışma modelleriyle çalışma sistemine uyumlulukları ( mevcut iş yapma düzeni, mevcut iş yapma tekniği, teknolojik altyapı), zaman (tasarruf, hizmetin tam olması, çeviklik), algılanan davranışsal kontrolü ( kendine güven, yetki, yeterlilik) ve algılanan kullanım kolaylıkları (adaptasyon, kariyer, işverenin altyapı desteği, rahatlık) faktörlerinin , algılanan faydayı (konfor, pratiklik, verimlilik, performans artışı, planlı çalışma, maliyet azaltma, veri güvenliği ) olumlu etkilediği ortaya koyulmuştur. Ayrıca çalışanların evden-uzaktan çalışma gibi çalışma modelleriyle çalışma sistemi için kolaylaştırıcı koşullar ( işverenin kaynak yeterliliği, altyapı erişimi, iletişim araçları etkisi, teknik destek), endişe (sistem endişesi, verilerin korunması, sistem için erken öngörüsü, işi tam olarak yapamama, korkutuculuk), güven (veri güvenliği, bilgi gizliliği, yenilik önyargısı, genel güven) ve öz yeterlilik (rahat hissetme, sistem için bilgi yeterliliği, kendine güven) faktörlerinin, algılanan faydayı (konfor, pratiklik, verimlilik, performans artışı, planlı çalışma, maliyet azaltma, veri güvenliği ) olumsuz etkilediği ortaya koyulmuştur."
