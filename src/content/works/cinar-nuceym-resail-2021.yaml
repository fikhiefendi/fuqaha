abstract: "İslam hukuk tarihinde el-Eşbâh ve'n-nezâir adlı eseriyle Mecelle'nin yazımına kaynaklık ederek önemli bir yer tutan ve döneminin en çok tanınan Hanefî fakihlerinden biri olan İbn Nüceym'in birçok risâlesi bulunmaktadır. Bu risâlelerin yazmalar arasından tespit edilerek literatüre kazandırılması, İbn Nüceym'in gerek İslam Hukukunun gelişimine olan katkısını gerekse de dönemindeki fıkhî problemleri ve bu problemlerin çözümüne dair uyguladığı yöntemleri görebilmek adına önem arz etmektedir. İbn Nüceym, tez kapsamında incelemiş olduğumuz kırka yakın risâlenin mecmua halinde oğlu tarafından birleştirildiği er-Resâilü'z-Zeyniyye fi fıkhi'l-Hanefîyye adlı eserde gerek kişinin yapması ve yapmaması gerekenlere dair ilmihal konularında, gerekse vakıflar, vekâlet, eşya hukuku gibi ictimai konularda gerekse de talak, nikâh ve evlilik gibi aile hayatına dair konularda dönemindeki problemlere ilişkin görüşlerini kaleme almıştır. Tez kapsamında genel olarak bu önemli risâlelerin tanıtımı yapılmış, özel olarak da İbn Nüceym'in aile hukukuna ilişkin risâlelerinin tahkik ve tahlili yapılarak konuya bakış açısı değerlendirilmiştir."
