abstract: "Bu tezde, Muhammed Murtaza ez-Zebîdî'nin hayatı ve İtihâfü's-Sâdeti'l-Müttakîn bi Şerhi Esrâri İhyâi Ulûmi'd-Dîn eserindeki hadis anlayışı incelenmiştir. Tez, dört bölümden oluşmaktadır. Birinci bölümde, Zebîdî'nin yaşadığı dönem siyasi, sosyal, ilmi ve kültürel açıdan ele alınmış, yaşadığı dönemdeki ilmi ve kültürel gelişmeye nasıl katkıldı. Tez çalışmasının bir yönünün şahıs bazlı olması hasebiyle Zebîdî'nin hayatı, halk arasındaki konumu, ilmi seyahatleri, kendisinden ilim aldığı önemli hocaları, talebeleri ve farklı alanlarda yazdığı eserleri hakkında bilgi verilmiştir. Çalışmanın diğer yönü kitap temelli olduğu için öncelikle eser tanıtılmış, eserin yazılma zamanı, amacı, sebebi ve kaynakları üzerinde durulmuştur. Kitap; fıkıh, hadis, usul, tarih, edebiyat ve tefsire muhtevidir. Eser, şer'i ve lügavî ilimleri kapsamakta ve hadis tahricleri ile doludur. Sonra İhyau Ulumi'd-Dîn üzerine yazılmış diğer şerhleri zikretmektedir. İkinci bölümde, Zebîdî'nin hadis ilimlerindeki metodu ele alınmaktadır. Kitabında zikrettiği hadis ilimlerinin bazı türlerini belirtmekte, her tür için birkaç örnekle uygulama yapılmaktadır. Verilen örneklerden sonra, hadisler hakkında zikredilen tespitler münekkitlerin tespitleriyle mukayese edilmektedir. Üçüncü bölüm, Zebîdî'nin şerhinde zikrettiği tashih veya tenkit edilmiş râvilerin örneklerini içermektedir. Râviler hakkında verilen hükümleri tespit edip Zebîdî'nin hükmüyle uyumlu olup-olmadığı tespit edilmiş, nâkid imamların cerh ve ta'dil kurallarına tespitlerin ne derece uyduğu belirlenmiştir. Dördüncü bölümde ise, Zebîdî'nin sahîh ve zayıf hadisleri tashih ve ta'dif etme metodu, İbnü'l-Cevzî ve Iraki'ye hadislerin mevzu veya“la asle leh”olduğuna dair itirazları, Gazzâlî'yi savunması, kitabın farklı yerlerinde onun tespitlerini mazur görmesi ve şahitlerle tashih etmesi açıklanmıştır."
