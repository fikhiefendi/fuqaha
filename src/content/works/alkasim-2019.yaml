abstract: "Fıkıh Usûlünün din ilimleri arasındaki önemi bilinen bir konudur. Bu araştırmada Fıkıh Usûlünde üzerinde ittifak edilen delillerin dördüncü olarak kabul edilen Kıyas konusunu Osmanlı Şeyhülislamı Molla Fennarî eserinden yola çıkarak araştırılmaya çalışılmıştır. Kıyas konusu bütün Müslüman uleması nezdinde Kuran, Sünnet, İcmadan sonraki sırada yer alan delildir. Molla Fenarî'nin Fusûlü'l-Bedâî fi Usûli'ş-Şerai adlı eserinde Kıyas konusu üzerinde çokça durduğu görülmektedir. Mezkur kitabını 33 sene içerisinde kaleme alan müellifimiz, eserinde İslam Hukuku Metodolojisinde otorite kabul edilen ulemanın görüşlerini derlemiştir. Aynı şekilde bu eserindeki görüşleri memzuc metodunu kullanmıştır. Yine Molla Fennarî'nin İmam Pezdevî'nin başka ekole mensub olmasına rağmen ondan etkilendiğini de görmek mümkündür. Molla Fennarî'yi diğer Usûlü Fıkıh ulemasından farklı olduğu konu ise onun konulara önce tarifle başlaması, racih tarifi belirtmesi, ulemanın görüşlerini delilleriyle birlikte zikretmesi, ayrıca gerektiğinde onları eleştirmesi ve mezhepteki racih görüşü zikretmesi şeklinde söylenilebilir. Bir başka özelliği de onun kullandığı ibarelerle ilgilidir. Bazı durumlarda o kadar ağır, daha doğrusu bulmacalı ifadeler kullanması, bir çok ulema arasında tartışmalara ve metni anlamada durumun zorlaşmasına yol açmıştır. Aynı şekilde Kıyasın şartlarını Kıyasın rükünlerinden önde geldiğini, ancak illetle ilgili şartları illet konusu altında işlemesi, bu da olsa fukaha metodunun özelliğine istinaden yapılması, yine onun metodunu farklı kılan şeydir. Yine illetle ilgili tarifi, türleri, dereceleri, kısımları örnekleriyle birlikte zikrederek başkalardan kendisi farklı kılmıştır. Aynı şekilde fukaha metodunun aksine illeti Kıyas konusunun altında işlemeden illeti özel bir konu altında ele almıştır. Bu araştırmamız Kıyasla ilgili Molla Fennarî'nin görüşlerini detaylı bir şekilde ele almakla gerçekleştirilmiştir. Aynı şekilde İmam Fennarî'nin bu görüşlerine yapılan 23 civarındaki eleştirilere de yer verilmiştir."
