abstract: "Tez çalışması, 470 Numaralı Ahi Çelebi Mahkemesi Şer'iyye Sicili hakkında verilen bilgilerden oluşmaktadır. İstanbul, On altı asır boyunca birçok medeniyete ev sahipliği yapmış Avrupa, Asya, Afrika kıtalarının kesiştiği geniş bir bölgenin tartışmasız tek hâkimi olmuş ve bu süreçte dünya tarihini önemli derecede etkilemiştir. Osmanlı tarihi hakkında günümüze ışık tutacak ve araştırmacıları kesin bilgilere ulaştırabilecek yazılı kaynakların başında kadı sicilleri gelmektedir. Bu çalışmada M. (1877-1878), H. (1294-1295) tarihleri arasındaki Ahi Çelebi Mahkemesi 470 Numaralı Şer'iyye Sicilindeki hükümlerin transkripsiyonu ve değerlendirilmesi yapılarak yeni bilgilere ulaşılması amaçlanmıştır."
