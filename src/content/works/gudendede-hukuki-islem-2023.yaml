abstract: "İnsanın merak duygusu birçok teknolojiyi icat etmesinin önemli amillerinden biridir. Bu icatlardan bilgisayar hayli geç ortaya çıkmışsa da son bir asra adeta damga vurmuştur. Bilgisayar biliminin alt dalı yapay zekâ özellikle son otuz yılda önemli etkileri olan ve daha da olacağı öngörülen yeni bir alem olmuştur. Yapay zekânın mahiyeti onun sadece mühendislik alanında değil, felsefe ve hukuk gibi farklı alanlarda da tartışılmasına yol açmıştır. Hukuk doktrininde yapay zekânın kişiliği üzerine çeşitli tartışmalar başlamıştır. Ülkemizde son yıllarda bu alanda bilimsel toplantılar artmakla birlikte yurt dışında bu çalışmalara daha önceden başlanmış ve daha fazla mesafe alınmıştır. Hukukî kişilik ve ehliyet konusunda modern dönem borçlar hukuku ve İslam hukukunun verilerinin büyük ölçüde örtüştüğü görülür. Yapay zekâdan önümüzdeki yıllarda daha çok bahsedilecek ve İslam hukuku bağlamında da gerek eşya olarak gerek kişiliğinin imkânı cihetinden değerlendirme yapılması gerekecektir. Yapay zekânın özellikle hukukî kişilik bakımından konumlandırılması daha fazla önem arz etmektedir. Ayrıca yapay zekânın farklı tür ve derecelere göre sınıflandırılabilmesiyle, hukukî işlem ehliyeti hususunda da buna paralel sonuçlar üreteceği görünmektedir. Bu çalışmada sosyal bilim alanında yapay zekâ hakkında yazılmış kaynaklara ağırlıkla yer vererek yapay zekâ tanıtılacak, ilişkili olduğu bazı kavramlara da yer verilecek ve yapay zekânın hukukî işlem ehliyeti tartışmaya açılacaktır. Bunu yaparken de yapay zekânın hukukî işlem ehliyeti adına net bir sonuç ortaya koymak yerine veriler değerlendirilecek, buna göre oluşan farklı kanaatler incelenecek ve gerekiyorsa bunlar arasından tercih yapılacaktır."
