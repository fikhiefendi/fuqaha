abstract: "Osmanlı Devleti'nde, din, kültür ve eğitim alanlarıyla ilgilenen ilmiye teşkilatı, devlet ve toplum hayatında önemli bir konuma sahipti. Kadılar yargı görevini üstlenirken, müftüler fetva görevini, müderrisler ise öğretim görevlerini yerine getirmişlerdir. Bu çalışmada, Osmanlı Devleti'nin son döneminde yaşamış ve İzmit'te görev yapmış 9 ilmiye mensubunun Meşihat Arşivi'ndeki Sicill-i Ahval Dosyaları temel alınarak biyografileri çıkarılmıştır. Çalışmamızda ayrıca Cumhurbaşkanlığı Osmanlı Arşivi ve Cumhuriyet Arşivi başta olmak üzere Diyanet İşleri Başkanlığı Arşivi ve Kocaeli İl Müftülüğü Arşivi'nden de yararlanılmıştır. Arşiv kayıtları literatür, sözlü tarih çalışması ve saha araştırmasından (mezarlıklar) elde edilen bulgularla desteklenmiş ve böylece dokuz ilmiye mensubunun yaşamları, eğitim durumları, bürokrasideki pozisyonları, memurluk ve bürokratik kariyerleri detaylı olarak incelenmiştir."
