abstract: "ÖZETYazar : Ahmet AKINCIÜniversite : Uludağ ÜniversitesiAnabilim Dalı : Temel İslâm BilimleriBilim Dalı : İslam HukukuTezin Niteliği : Yüksek Lisans TeziSayfa Sayısı : X + 136Mezuniyet Tarihi : â¦. /â¦. / 2007Tez Danışman(lar)ı : Prof. Dr. Hamdi DÖNDÜRENİSLÂM HUKUKUNA GÖRE SAVAŞTA UYULACAK KURALLARSavaşlar, tarih boyu insanlık âleminin kaderini tayin eden önemli etkenlerdenbiri olmuştur. Bilinen birçok uygarlığın tarih sahnesine gelişi ve tarih sahnesindensilinmesi hep savaşlar yoluyla olmuştur.Tarihin birçok döneminde, bireysel ve toplumsal çıkarların ve dizginlenemeyenhırsların figüranı olarak şekillenen, doğal olarak da yakıp yıkmak ve insanlık onurunauymayan vahşice davranışlar olarak uygulanan savaş, İslâm'la farklı bir boyutkazanmıştır. İslâm'da savaş; ancak yeryüzünde kargaşanın, haksızlığın önlenmesi,Allah'ın davetinin önündeki engellerin kaldırılması ve meşru müdafaa gibi makulgerekçelere dayandırılmıştır. İslâm'da savaş, barışı sağlamak ve sağlamlaştırmak içinolunca, savaş sırasında gerek muharip güçlere, gerekse sivillerle karşı yapılacakmuamelelerin sınırları insanlık onurunu aşmayacak genel prensiplerle çizilmiştir.İslâm'ın öncelikli hedefi barış olduğu için, İslâm savaşı başlatan nedenlerden çok, barışısağlamlaştırmanın yollarını aramıştır. Dolayısıyla savaş ancak zaruret halinde yapılangeçici bir durum olarak kabul edilmiştir. Ancak, günümüzde savaşlar, ulusal çıkarlarahizmet eden, insan hakları ihlallerinin sıkça yapıldığı, kural tanımaz görüntülere sahneolmaktadır. Bütün teknolojik gelişmelere rağmen insanlık, insan onuruna yakışan birsavaş kültüründen oldukça uzaktır. Kabul edilen birçok uluslararası antlaşmaya rağmen,günümüz savaş hukukunun uygulanabilirliği hususunda ciddi problemler vardır.Sonuç olarak, ancak barışa hizmet eden ve insânû zaafiyetlerin şekillendirmediğiİslâmû savaş; bütün unsurları ile zaruret halinde başvurulan ve başından sonuna kadarseyri evrensel prensiplerle şekillenen bir zaruret mekanizmasıdır."
