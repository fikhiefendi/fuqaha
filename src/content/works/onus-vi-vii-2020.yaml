abstract: "Hicrî VI. asrın son yarısı ile VII. asrın ilk yarısında İslam coğrafyasındaki siyasî karışıklıklar ve yaklaşan Moğol tehlikesi ulemanın doğuya doğru göç etmesine ve Dımaşk ile Kahire'nin dört mezhebi de barındıran hareketli bir ilmî merkezi haline gelmesine sebebiyet vermiştir. Siyasî saiklerin yanında itikadî ve ilmî endişelerin de etkisiyle Dımaşk'a yerleşen Hanbelîlerin burada yürüttükleri ilmî faaliyetler ve fıkıh mesaisine dair değerlendirmeler mezhebin yeni bir evreye geçmesine zemin hazırlamıştır. Dımaşk'ın ilmî hayatında kendine yer edinmeye çalışan Hanbelî çevre burada birçok eğitim müessesi kurup telif faaliyetleri açısından yoğun bir mesai içine girerek mezhebin sonraki dönem çalışmalarına yön vermiştir. Bu dönemde İbn Kudâme ile temsil edilen çalışmalar, mezhebin teşekkülünden itibaren devam eden ve mezhebi diğer mezhep çevrelerinden ayıran en önemli özellik olan, en genel haliyle rivayet merkezli ve kelama mesafeli olarak nitelendirilebilecek ilim anlayışından uzaklaşmaya dair işaretlerin ortadan kaldırılmasını sağlamıştır. Ayrıca bu dönem, mezhebin teşekkülünden itibaren oluşan fıkhî mesailin yeniden değerlendirildiği bir dönem olmuştur. Bu mesail kapsamlı bir şekilde gözden geçirilmiş, farklı görüşler arasında seviye ve mahiyet farkına dair kavramlaştırmalar daha muhkem bir hal almıştır."
