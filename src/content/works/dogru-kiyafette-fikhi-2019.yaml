abstract: "Kıyâfet, insanlık tarihi kadar eski; insanın kimliği, onun sosyal, ekonomik, psikolojik vb. durumları hakkında ipuçları veren bir olgudur. Farklı bir anlatımla kıyafet kişiyi ve muhatablarını öncelikle psiko-sosyal ve ekonomik açıdan etkiler. Aile ve cemiyette bundan etkilenir. Bu bakımdan İslam fitrî yapıları başta olmak üzere kişilerin çeşitli durumlarına göre kıyafetlerine bir ölçü getirmiş; sınırlar koymuştur. Dini literatürde bu ölçü tesettür kavramı ile ifade edilir. Aslında dinin belirlediği bu ölçünün ötesinde kıyafetin fitrî, tabiî ve örfî tarafı da vardır. Bu bakımdan insan topluluklarının tabiî, örfî ve dini inanış ve anlayışlarına göre farklılık arzetse de her bir toplumda kıyafet vardır. Fıkhın belirlediği öncelikle dar ve şeffaf olmama ölçüsü bulunduğu takdirde kıyafette şekil şartı aranmaz. Dolayısıyla fıkıh temel ölçülerin bulunduğu örfî kıyafete de değer verir. Bu çerçevede kıyafetin asgari ölçüsü farzdır ve öncelikle bu ölçünün sağlanması esastır. Kıyafetin bir de ibadet hayatı ve çalışma hayatı ile merasimleri ilgilendiren yönü vardır. Fıkıh bilginleri kişinin dünya ve ahiret hayatını etkileyen kıyafet konusunu Kitap ve Sünnete dayalı olarak çeşitli vesilelerle ele almışlar; daha çok namazda“setr-i avret”ve günlük hayatta helaller ve haramlar olarak ifade edebileceğimiz“kerâhiyât ve istihsan”gibi bölümlerde incelemişlerdir. Konu ile ilgili özel çalışmalar da yapılmıştır ve hâlen devam etmektedir.“Kıyafette Fıkhî Ölçü”adlı bu yüksek lisans tezide -konuyu çeşitli yönleri ile- bu çerçevede derli toplu olarak inceleyen bir çalışmadır."
