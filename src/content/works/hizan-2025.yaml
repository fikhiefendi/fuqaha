abstract: "Muhammed b. Hasan eş-Şeybânî (131-189/748-805), fıkıh ilminde derinlemesine vukufuyla tanınan önemli bir fakih olarak ön plana çıkmıştır. İmam Ebû Hanîfe'nin (80-150/700-768) ilmî mirasını aktarmış, bu mirası yenilemiş ve içtihadıyla Hanefî mezhebine özgü görüşler geliştirmiştir. İmam Ebû Hanîfe'nin talebelerinden biri olan ve aynı zamanda ilmî seyrinde ona denk kabul edilen Ebû Yûsuf (113-182/731-798) gibi diğer Ebû Hanîfe talebeleri arasında yer almakla birlikte, eş-Şeybânî'nin öne çıkan bir yönü, Medine'nin imâmı Mâlik b. Enes'ten (93-179/712-795) ilim tahsil etmiş olması ve başka fakihlerden de istifade etmesidir. Onu diğer talebelerden ayıran bir diğer husus ise, hadisteki birikimidir. Bu yönü, özellikle“el-Âsâr”,“el-Muvaṭṭaʾ”ve“el-Ḥucce ʿalâ Ehli'l-Medîne”adlı eserlerinde açıkça görülmektedir. Bu çalışmanın amacı, İmam eş-Şeybânî'nin hadis ilmindeki yöntem ve yaklaşımlarını ele almak; onun hadis ilmine dair temel prensiplerini, türlerini ve bu birikimin fıkhî görüşleri üzerindeki etkilerini incelemektir. Bu çerçevede, öncelikle râvinin şahsı ve durumu ile ilgili ilimler üzerinde durulmuş; râvilerin isimleri, künyeleri, lakapları ile cerh ve ta'dil gibi konular detaylı olarak işlenmiştir. Ayrıca isnad ilmi bağlamında, rivayet şekilleri, senedlerin ali ve nazil dereceleri, sened zincirindeki ittisal veya kopukluklar gibi konular (örneğin mürsel, münkatıʿ, muallak, ve belâğ türleri) ve İmam'ın bunlara dair yaklaşımı incelenmiştir. Metinle ilgili olarak ise, rivayetin sahibine nispeti, mevkuf ve maktu' hadisleri ele alma biçimi, hadisin anlaşılması ve yorumlanması, hadislerin garîb lafızlarının açıklanması, vürûd sebepleri, nâsih-mensûh ilişkisi, ihtilaflı hadisler ve İmâm'ın hadisleri bablandırma yöntemi değerlendirilmiştir. Sened ve metin arasında ortak olan ilimlerde de; mutâbaʿat, şevâhid, mütevâtir-âhâd hadisler, farklı rivayetler arasındaki çelişki durumlarında hadislerin şâz, munker, zâidetü's-sika, muʿall gibi niteliklerle değerlendirilmesi ele alınmıştır. Araştırmacı, bu çalışmada İmam eş-Şeybânî'nin hadisçilikteki yöntemini ortaya koymak üzere istikrâî ve mukayeseli bir metot benimsemiş; onun râvî, sened, metin ve bunların ortak yönleriyle ilgili hadis ilimleri alanındaki yaklaşımını, klasik muhaddislerin yöntemleriyle karşılaştırmalı olarak incelemiştir. Sonuç olarak, İmam eş-Şeybânî'nin râvî isimlerinin tespiti, rivayet ettiği râvîlerin seçimi, şevâhid ve mutâbaʿat kullanımı, hadislerin birleştirilmesi ve bablandırılması gibi birçok alanda muhaddislerin yöntemine paralel bir çizgi izlediği görülmüştür. Bununla birlikte, râvî ve rivayetler arasında tercihte bulunması, metnin anlaşılmasıyla ilgili meselelerdeki yaklaşımları ve kopuk senedleri rivayet etme tarzı gibi yönleriyle kendine has bir metodoloji geliştirmiştir. Bu çalışma, İmâm eş-Şeybânî'deki hadisçilik sanatının farklı boyutlarını ele alan üç bölümden oluşmaktadır: Birinci bölümde râvîler ve sened açısından hadisçilik, İkinci bölümde metin açısından hadisçilik, Üçüncü bölümde ise sened ve metne birlikte temas eden ilimlerdeki hadisçilik anlayışı incelenmiştir."
