abstract: "Bu tez, Mâlikî mezhebinde tefrîk uygulamasının sebeplerini ve hükümlerini açıklayarak, Ürdün, Mısır ve Kuveyt Ahvâl-i Şahsiyye kanunlarının tefrîk ile ilgili maddelerinde Mâlikî mezhebinin konuyla ilgili görüşlerinin oranını tespit etmeye çalışmıştır. Bunun yanında bu tezde kanunlarda yer alan görüşlerin hangi mezhebe ait olduğuna açıklık getirilmeye çalışılmıştır. Tez giriş ve iki bölümden oluşmaktadır. Tezin giriş bölümünde konu, amaç, yöntem ve kavramsal çerçeveden bahsedilmiş, birinci bölümde Mâlikî mezhebinde tefrik sebepleri ve hükümlerine yer verilmiştir. Tefrîk sebeplerinde güncellenmesi gereken konuların mezhep kuralları çerçevesinde değerlendirilmesi yapılmıştır. Tezin ikinci bölümünde ise, Ürdün Ahvâl-i Şahsiyye kanununun tefrik ile ilgili maddeleri verilmiş, diğer iki kanuna atıf yapılarak Mâlikî mezhebinin görüşlerinin ne oranda yer aldığı izah edilmiştir. Tefrik ile ilgili maddelerde yer verilen görüşlerin Mâlikî mezhebi ile uyuşmadığı durumda hangi mezhebe ait olduğu tespit edilmeye çalışılmıştır."
