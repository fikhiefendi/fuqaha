abstract: "İslam hukukunda nafaka sorumluluğu, evlilik müddetince ve evlilik sonrası iddet süresince olmak üzere kocanın karısına karşı yerine getirmekle yükümlü olduğu bir görevdir. Tezimizde, özellikle boşama sonrası nafakanın üzerinde durulmaktadır. İslam hukukunda boşama sonrası nafaka müddeti, iddet ile sınırlandırıldığı için çalışmamızda iddet ve iddet müddetinin açıklanmasına yer verilmiştir. Türkiye'de yaşayan bizlerin hayatı, Medeni hukuk çerçevesinde şekillenmektedir. Bu tezde, her iki hukuk kuralını uygulayan insanların durumu göz ardı edilmedi. Nafaka kavramı Medeni hukuk ve İslam hukuku açısından değerlendirildi ve aralarındaki farklar ve benzerlikler ortaya kondu. Tezimizde başlıca; nafaka, mehir, maddi tazminat, manevî tazminat, iddet, bâin talâk, ricî talâk ve“sosyal devlet anlayışı”gibi kavramların açıklanmasına ve mukayese edilmesine yer verildi."
