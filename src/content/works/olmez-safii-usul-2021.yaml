abstract: "İmam Şâfiî'nin er-Risâle'si ile ilk olarak tedvin edilmeye başlanan fıkıh usûlü, zamanla mütekellimûn ve fukahâ olarak adlandırılan iki yönteme ayrılmıştır. Fukahâ metodu ağırlıklı olarak Hanefîlerin; mütekellimûn ise Şâfiîlerin kabul ettiği bir metot şeklinde literatürde yerini almıştır. Bu çalışmada, mütekellimûn metodunun Şâfiîlere; fukahâ metodunun ise Hanefilere ait olduğu ve daha sonraki süreçlerde bu yöntemin farklı mezhep müntesibi âlimler tarafından kullanıldığı iddiasının tartışmaya açık olduğu ileri sürülmüştür. Tezin asıl iddiası ise usûl yazımı mecrasında Hanefiler ile Şâfiîler arasında var olan muhalefetin bir benzerinin çoğunluğu Şâfiî olan Eş'arî usûlcüler ile fakîh Şâfiî usûlcüler arasında da söz konusu olduğudur. Araştırmada kelamcı usûlcülerden Bâkıllânî ve Cüveynî; Şâfiî usûlcülerden ise Şîrâzî ve Sem'ânî'nin görüşleri belirli örnekler çerçevesinde İbn Berhân ile karşılaştırılarak ele alınmıştır. Çağdaş Şâfiî âlimlerden olan Cüveynî Eş'arîlerin, Şîrâzî ise fakih Şâfiî usûlcülerin temsilcisi konumda olmuşlardır. İbn Berhân, söz konusu iki âlimin talebelerinden ders alması ve bu ayrımın olduğu zaman aralıklarında yaşaması sebebiyle seçilmiş ve konu onun usûl perspektifinden işlenmiştir. Ayrıca çalışmada İbn Berhân'ın kelamcı bir usûlcü olduğu kanaatine varılmıştır. Eş'arî ve Şâfiî usûlü ayrımı, Şâfiî usûlcülerin eserlerinden daha belirgin bir şekilde rastlanılmıştır. İbn Berhân'ın İmam Eş'arî ile İmam Şâfiî arasında ihtilaflı olan usûl meselelerin bazılarında Eş'arî usûlcülere katılmadığı ve Şâfiî usûlcüler ile İmam Şâfiî'nin görüşünü tercih ettiği tespit edilmiştir."
