abstract: "Bu tez, hicrî VIII. ve IX. yüzyıllarda Hanefî âlimlerinin Sünnet-i Nebeviyye'ye hizmet bağlamındaki ilmî gayretlerini ortaya koymayı amaçlamaktadır. Söz konusu dönemler, İslâmî ilimlerin muhtelif alanlarında, başta hadis ilmi olmak üzere ilmî faaliyetlerin belirgin bir şekilde yoğunlaştığı ve kurumsallaştığı safhalar arasında yer almaktadır. Çalışmada, Hanefî âlimlerinin hadis ilmine yönelik katkıları; kaleme aldıkları eserler, benimsedikleri ilmî yöntemler, sergiledikleri eleştirel tutumlar ve uygulamaya dönük ilmî faaliyetler çerçevesinde ele alınarak incelenmiştir. Bu çalışmada, hadis-i şerif ve ulûmü'l-hadîs alanında telif edilmiş başlıca eserler tanıtılmıştır. Bu bağlamda, özellikle tahrîc literatürüne ait çalışmalar ele alınmış olup Zeylaʿî'nin Naṣbü'r-râye adlı eseri, İbn Kutluboğa'nın Taḫrîcü eḥâdîs̱i'l-Pezdevî isimli çalışması ve İbnü't-Türkmânî'nin et-Tenbîh ʿale'l-eḥâdîs̱i'l-Hidâye ve'l-Ḫulâṣa isimli çalışması üzerinde durulmuştur. Bu tezde ayrıca, hadis şerhi literatürüne ait önemli eserler de ele alınmıştır. Bu çerçevede Bedreddin el-Aynî'nin ʿUmdetü'l-ḳārî adlı eseri ile yine kendisine ait olan el-Binâye fî şerḥi'l-Hidâye, Moğultay b. Kılıç'ın et-Telvîḥ fî şerḥi'l-Câmiʿi'ṣ-ṣaḥîḥ li'l-Buḫârî adlı çalışması ve el-Aynî'nin Nuḫabü'l-efkâr fî tenḳīḥi Mebâni'l-aḫbâr adlı eseri incelenmiştir. Bunun yanı sıra çalışmada, söz konusu âlimlerin ilelü'l-hadîs ile cerh ve taʿdîl ilimlerine yaptıkları katkılar da değerlendirilmiştir. Bu bağlamda rivayetlerin isnadları tahlil edilmiş, sahih ile zayıf rivayetler birbirinden ayırt edilmiş ve mezhebin usul kaideleri ile hadis ilminin esaslarıyla uyumlu biçimde rivayetler arasında tercihte bulunulmasına gösterilen titiz ilgi ortaya konulmuştur. Tezin ulaştığı temel sonuçlardan biri, Hanefî âlimlerinin hadis rivayetlerini yalnızca nakleden kimseler olmadığı; bilakis bu rivayetleri tenkit ve temyiz sürecine tâbi tuttukları, pek çok fıkhî içtihatlarını ise sağlam hadis usullerine dayandırdıklarıdır. Bu yaklaşım, onları Sünnet'ten uzak durmakla niteleyen yerleşik ve indirgemeci tasavvurun isabetli olmadığını ortaya koymaktadır. Nitekim Hanefî âlimlerin fıkıh ile hadis ilmini mezceden metodolojileri, nebevî nasların hüküm inşasında etkin bir biçimde kullanılmasına imkân sağlamış; bununla birlikte makâsıdü'ş-şerîa, uygulama alanları ve nasların muhtemel sonuçları dikkate alınarak yapılan bu değerlendirmeler, söz konusu âlimlerin hem metne hem de vakıaya yönelik derin bir ilmî idrak ve basiret sahibi olduklarını göstermiştir. Bu itibarla çalışma, hicrî VIII. ve IX. yüzyıllarda Hanefî âlimlerinin Sünnet-i Nebeviyye'ye hizmet sahasında ortaya koydukları ilmî gayretlerin, diğer mezheplere mensup âlimlerin çabalarından geri kalmadığını açık biçimde ortaya koymaktadır. Aksine bu gayretler; dirâyet ile rivâyeti, fıkıh ile hadis ilmini telif eden dengeli ve bütüncül bir metodolojiye dayanması bakımından temayüz etmektedir. Bu yönüyle söz konusu katkılar, İslâmî ilimlerin gelişim sürecinde mühim bir merhaleyi temsil etmektedir. Hanefî âlimlerinin bu ilimlerin ihyası, temellendirilmesi ve sistematik biçimde inşasındaki merkezî rollerini teyit etmektedir."
