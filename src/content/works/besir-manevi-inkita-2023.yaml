abstract: "Bu çalışmamızda Hanefî usûlcülerin haber-i vahidleri amel edilip edilmeme noktasında değerlendirmeye tabi tuttukları Manevî İnkıtâ kavramı, bu kapsamda değerlendirilen örneklerin Sünen-i Ebî Dâvûd özelinde tespiti ve Ebû Davûd'un, Mânevî İnkıtâ gerekçesiyle amel edilmeyen meselelere yaklaşımı tespit edilmeye çalışılmıştır. İslam hukukçularının asli malzemelerinden biri olması bakımından hadisler, Hz. Peygamber'in vefatından sonra büyük önem arz etmiştir. İslam hukukçularının karşılaştıkları meselelere karşı tavırlarını belirlemede temel faktörlerden biri olması sebebiyle, bu haberlerin kabul ve reddedilmesi hususunda birtakım prensipler meydana getirilmiştir. Sened ve metin tenkidi özelinde ortaya çıkan bu prensiplerin oluşmasında, İslam hukukçularının hukuki anlayışları ve hukuk mantığının, bulundukları çevrenin ve toplumun ciddi anlamda etkisi olmuştur. Hadislerin tenkidi ve başka birçok hususta ortaya konan bu prensipler doğrultusunda hukuk ekolleri oluşmaya başlamış, ilk dönemde hoca ve bölgeden kaynaklanan gruplaşmalar, daha sonraki dönemde metodolojik ayrışmaya evrilmiştir. Bahse gelen metodolojik ayrışmaların neticesinin belirgin bir şekilde görüldüğü meselelerden bir tanesi olan haber-i vâhidlerin kabulü noktasında Hanefî âlimler, bu haberlerin asıllara arz edilmesi şeklinde özetlenebilecek Manevî İnkıtâ kavramını ortaya koymuşlardır. İki bölüm şeklinde oluşturduğumuz tezimizin birinci bölümünde, Hanefi usûl kitapları çerçevesinde incelemeye çalıştığımız haber teorisi, manevî inkıtâ kavramıyla Hanefilerin konuya bakış açısı ve haber-i vâhidlerin Kur'ân'a, mârûf sünnete, umûmu'l-belvaya, Sahâbenin ihtilaf ettiği bir konuda o konuya dair var olan rivayetle ihticâcdan yüz çevirmesi şeklinde kategorize ettikleri 'asıllara' arz edilmesi üzerine ve bu asıllara muârız gözüken haberlere karşı hangi tutumda oldukları ortaya konmaya çalışılmıştır. İkinci bölümde ise süreç içerisinde Hanefî mezhebinin re'y eksenli fıkhî anlayışına reaksiyon olma özeliği taşıyan ehl-i hadisin, ehl-i hadis özelinde de Ebû Dâvûd'un hangi gerekçelerle Sünen'ini telif ettiği üzerine durulmuştur. Son olarak Hanefî usul ve furû kitaplarından tespit ettiğimiz manevi inkıta gerekçesiyle amel edilmeyen rivayetler ve konular, Ebû Dâvûd'un Sünen'i özelinde tespit edilmiş ve Ehl-i Re'y'e tepkisel bir yaklaşım ortaya koyan Ebû Dâvûd'un, bu meseleler özelinde hangi görüşte olduğu tespit edilmeye çalışılmıştır."
