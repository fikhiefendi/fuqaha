abstract: "Modernizm, insanların gelişmişlik düzeyi, hayat tarzı ve sosyal ilişkilerini etkilediği gibi kültürel alanın en önemli unsuru olan ilmî disiplinleri de derinden etkilemektedir. Bu kapsamda Batı'da reform hareketlerinin dinî anlayışın yeniden inşasına öncülük ettiği söylenebilir. Aynı süreç Doğu toplumlarında tecdid, ıslah ve öze dönüş gibi kavramların daha fazla işlenmesine zemin hazırlamıştır. Kültürel çalışmalar bağlamında farklı disiplinlerin felsefe ile anılmasının giderek yaygınlık kazanması da bu kapsamda değerlendirilebilir. Bu bağlamda din, hukuk ve tarih felsefesi gibi yeni disiplinlerden söz edilebilir. Ancak yeni tabirlerin kullanılmasına meşruiyet sağlayan klasik ve köklü tabirlerin varlığı bütünlük arz eden bir sürecin yansıması mahiyetindedir. Dolayısıyla 21. yüzyıla kadar İslâm hukuk felsefesi formundaki tâbirlere rastlanılmaması gelenekte aynı manayı yansıtan kavramların olmadığı anlamına gelmemektedir. Bu açıdan İslâm hukuk tarihinde makāsıd, gaye, illet ve hikmet gibi kavramlar söz konusudur. Günümüzde bu kavramların tamamını ifade etmek üzere İslâm hukuk felsefesi tâbiri yaygınlaşmıştır. Muhammed Mustafâvî Felsefetü'l-fıkh, Nazariyyâtü'l-hükmi ve'd-devle ve el-Usûlü'l âmme li-nizâmi't-teşrî' gibi eserlerinde söz konusu gerçekleri dikkate alarak süreci değişik açılardan kendine özgü bir yöntemle izah etmeye çalışmaktadır. Onun yönteminde ictihad ve fıkıh dilinin önemli bir yer işgal ettiği izahtan varestedir. Bu bağlamda makâsıd ve maslahat çerçevesinde fıkhın İslâm hukukuna, İslâm hukukunun İslâm hukuk felsefesine evrilmesi önemli dinamikler barındırmaktadır. Çalışmamızda söz konusu evrilme süreçleriyle Mustafavî'nin fıkıh usulüne dair modern yaklaşımlarına değinilecektir."
