abstract: "İslâm Aile Hukukunda Mehir adlı bu Yüksek Lisans tezinde Aile Hukukunun bir bölümü ele alınmıştır. Ailenin oluşmasında ilk basamağı teşkil eden nikah akdinin bir takım hukuki sonuçları vardır. Bu hukuki sonuçların bir kısmı taraflara mali sorumluluklar yüklemektedir. Mehir, nafaka, mesken, müt'a ve miras şeklinde sıralanan bu mali sorumluluklardan sadece Mehir inceleme sahası olarak ele alınmıştır. Evliliğin hemen başlamasıyla birlikte ortaya çıkan böyle bir hakkın, kadına, çocuklara ve topluma neler kazandırdığı üzerinde durulmuştur. Kadına nikah akdinin neticesinde ödenen bu miktarın bir satış bedeli olmadığı ortadadır. Bunun bir güvence ve teselli olması, kadına ihtiyaçlarını karşılamada bir destek olması yönü daha makul olanıdır. İslâm öncesi Arap toplumunda ve tarihte yerini almış başka toplumlarda da buna benzer uygulamaların olduğu kaynaklarda yer almaktadır. Günümüz Türkiye'sinin bazı bölgelerinde halen devam etmekte olan ve eski Türklerde 'kaim' olarak isimlendirilen uygulamanın devamı mahiyetindeki başlık parasının Mehire benzer yönleri vardır. Ama bu mehir değildir. Bu çalışmada mehir konusu üç ana bölümde ele alınmıştır. Birinci bölüm evlilikle ilgili tarif ve tarihçesinin incelendiği bölümdür. İkinci bölüm, mehrin hükmünün, hikmetinin ve ölçülerinin yer aldığı bölümdür. Son bölümde ise mehir konusunda taraflar arasında ortaya çıkan ihtilaflar ele alınmış ve bunların hukuki mahiyetleri işlenmiştir. Daha çok Hanefi mezhebi esas alındığı için bazı yerlerde diğer mezheplerin görüşlerine yer verilmemiş, ihtiyaç hissedilen yerlerde mukayese yapılmıştır."
