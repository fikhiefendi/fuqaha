abstract: "İslami ilimlere eserleriyle büyük bir katkıda bulunan İbn Hacer el-Heytemî'nin hayatı iki aşamadan oluşmaktadır. Hayatının birinci aşamasını Memlûkler'in hâkimiyeti altında Mısır'da geçirmiştir. Burada dünyaya gelmiş, çocukluğunu ve gençliğini burada geçirmiştir. İlk ilmi tahsilini de burada almıştır. İlk İslami üniversite olarak kabul edilen Câmiu'l-Ezher'de eğitim görmüştür. Burada birçok değerli âlimin tedrisinden geçmiştir. Bunların başında Şeyhulislam Kadı Zekeriyya el-Ensârî, Abdulhak b. Muhammed ez-Zeynî es-Sunbâtî ve Şihâbuddîn Ahmed b. es-Sâiğ gelmektedir. Daha Mısır'da iken ilmi icazet almış ve 20 yaşından itibaren fetva vermeye başlamıştır. Hayatının ikinci aşaması ise Osmanlıların hâkimiyetinde olan Hicaz bölgesinde mukaddes belde olan Mekke şehrinde geçmiştir. Mescid-i Haram'da dersler vermiş ve İslami ilimlerde birçok talebeye yetiştirmiştir. Bu vesileyle şöhreti İslam beldelerinde yayılmış ve bu beldelerden birçok öğrenci kendisinden ders almak için Mekke şehrine akın etmişlerdir. Fıkıh ve akaid alanında birçok fetva vermiştir. Bu alanlarda verdiği fetvalar itibar görmüş ve amel edilmiştir. O dönemin sorunlarına çözüm adına birçok değerli eseri kaleme alarak Müslümanların istifadesine sunmuştur. İtikad'ta İmam Eşari'ye, amelde ise İmam Şâfiî'ye tabi olmuştur. Bunun için itikadi görüşleri İmam Eşari'nin, fıkhi görüşleri de İmam Şâfiî'nin görüşleri doğrultusunda olmuştur. Tasavvufi düşüncenin zirvede olduğu bir dönemde yaşadığı, aynı zamanda eğitim aldığı hocalarının tasavvuf ehli olmalarından dolayı sûfi olarak yetişmiştir. Zamanla tasavvufun asli istikametini kaybetmeye başladığını görünce, asıl tasavvufun korunması adına çok çaba sarf etmiş ve toplumu yanlış tasavvufi düşünceden muhafaza etmek için birçok eser yazmıştır. Bir taraftan da Sünni akideyi tehdit eden Şia'ya karşı büyük bir mücadele vermiştir. Şafiî fıkhının gelişmesi ve daha iyi bir şekilde istifade edilmesi için kendinden önceki Şâfiî âlimlerinin kaleme aldığı bazı eserlere şerh yaparak daha da istifade edilecek hale getirmiş ve bunun yanında Şâfiî fıkhı üzerine birçok müstakil eser yazmıştır. Ortaya koyduğu görüşler, verdiği fetvalar ve yazdığı eserlerle Şâfiî fıkhına damga vurmuştur. Yazdığı bu eserlerin her biri birbirinden kıymetlidir ve hala istifade edilmeye devam edilmektedir. Yazdığı eserlerinin birçoğu akademik tez konusu olabilecek kapasitede ve zenginliktedir. Hazırladığımız bu tez çalışmasıyla amacımız İbn Hacer el-Heytemî'nin ilmi kişiliğine ve yazdığı eserlere dikkatleri çekmek, fıkıh ilmi adına bıraktığı ilmi mirasın daha fazla akademik çalışmalara konu olmasını sağlamak, aynı zamanda İbn Hacer el-Heytemî'nin usûl ve fürû' ilmi açısından Şâfiî fıkhındaki yerini ve fıkıhtaki mertebesini de belirlemeye çalışmaktır."
