abstract: "Bu tezin amacı XIX. yüzyıl divan şairlerinden Fetvâemînizâde Gâlib Zühdî'nin Dîvân metnini tespit ederek metnin şekil ve muhteva bakımından incelemesini sunmak ve Mevlevî bir şair olan Gâlib Zühdî'nin hayatı ve edebî anlayışı hakkında bilgi vermektir. Bu amaç doğrultusunda öncelikle, müellif hattı ile yazılmış olan Dîvân'ın metni ortaya çıkarılmaya çalışıldı, şairin hayatı, mahlası, dil ve üslûb özellikleri ele alındı. Bunu izleyen inceleme aşamasında, Dîvân önce şekil özellikleri bakımından incelendi ve nazım türleri tespit edilerek tanıtıldı. Ardından muhteva özelliklerine geçildi, bu kısımda dinî-tasavvufî unsurların, sosyal hayatın ve mitolojik unsurların Dîvân'daki akislerine değinildi, sevgili ve aşığa ait unsurların işlenişine yer verildi. Daha sonra Dîvân'daki nazireler üzerinden Gâlib Zühdî'nin başta Şeyh Gâlib olmak üzere hangi şairlerden ve ne surette etkilendiği tespit edilmeye çalışıldı ve bu bağlamda nazireleri ve nazire anlayışı değerlendirildi. Son bölümde ise nüsha tavsifi yapılarak müellifin yazmadaki imla özellikleri aktarıldı. Ayrıca, müellif elinden çıkmış olan Dîvân'da rastlanılan şairin şiir yazım sürecine dair bazı tespitlere değinildi."
