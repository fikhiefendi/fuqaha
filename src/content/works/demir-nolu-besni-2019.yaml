abstract: "193 nolu Besni Şer'iyye Sicilleri 1904-1910(1911) yıllarını kapsamaktadır. Transkripsiyonu ve araştırması yapılan çalışmada Müslim ve Gayr-i Müslim ahali arasındaki ilişkilere bakıldığında aralarında bir problem olmadığı görülmüştür. Araştırma konusunda zamanın şartlarına göre ,Besni'de yetişen tarım ürünleri ve yapılan miras taksimleri ile günlük kullanılan ev eşyalarının tespiti yapılmıştır. Bir diğer önemli konu ise Besni'den Yemen'e asker sevki olduğunu ve ve bu askerlerin kimler olduğu,ikametgahlarını ve Yemen'e sevk tarihleri belgelerde tespit edilmiştir .Miras,vasi,vekillik gibi konuların ağırlıklı olduğu çalışmada dönemin sosyal ve kültürel durumu hakkında bilgiler aktarılmaya çalışılmıştır."
