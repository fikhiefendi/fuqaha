abstract: "Osmanlı Devleti'nin mahkeme kayıtları olan Sicil defteri, Osmanlı Devleti'nin son beş yüz yılı hakkında bilgileri içeren tarihi kaynaklardan biridir. Sicil defterleri genellikle Osmanlı Devleti'nin vilayetlerinde tutulur ve kadılar tarafından kaleme alınırdı. Son derece düzenli yapıları olup, çeşitli belge türlerini içerirdi. Trabzon vilayetine ait olan 2032-218 No'lu Sicil Defteri, miladi olarak 1879-1880 yılları arşı mahkeme kayıtları içermektedir. Bu kayıtları Osmanlıcadan Türkçe'ye transkribsiyonu başta olmak üzere, Sicil Defteri'nde olan belge türleri ve özellikleri ile 2032-218 No'lu defterin değerlendirilmesi tazminin konusunu oluşturmaktadır. Değerlendirme Trabzon un sosyal, ekonomik, dini, siyasi ve kültürel yönlerini ortaya koyar niteliktedir. Yapılan değerlendirmelerde, Trabzon la ilgili olarak, sosyal yapısının işleyişinin düzenli olduğu, devletin azınlık statüsündeki halklara her bakımdan iyi davrandığı, bölgenin nüfus bakımından o güne ait verileri ve kadın-erkek arasındaki ilişkisi sanıldığından daha iyi olduğu tespit edilmiştir. Ekonomik yapıyla ilgili olarak, Trabzon'un normalden daha iyi bir seviyede olduğu, kullanılan paraların eskiye göre değerini kaybettiği ve bazı türlerinin tedavülden kaldırıldığı, ancak yine de hayat standardının iyi olduğu gözlemlenmiştir. Dini hayatla ilgili olarak hoşgörü ortamının oluşturulmuş olduğu ve dinleri arasında samimi diyalogların yaşandığı ve hatta azınlık statüsündeki insanların az da olsa İslam Dinine geçtikleri sonucuna ulaşılmıştır. Siyasi durumun ise ülkenin genel durumu göz önüne alınarak pek parlak olmadığı; ancak kültürel zenginliğin var olduğu, ancak birbirine zararı vermedikleri ve arasındaki ilişkinin boyutları çok ileri düzeyde olduğu çıkarılan diğer sonuçlar arasındadır."
