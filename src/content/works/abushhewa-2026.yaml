abstract: "Bu çalışma, İslami finansman araçlarının maruz kaldığı riskleri açıklamayı ve bunların 2009–2023 dönemi boyunca Suudi İslami bankalarının kârlılığı üzerindeki etkisini incelemeyi amaçlamaktadır. Araştırmada, istatistiksel analiz araçları ve ekonomik ölçüm modelleri (Panel Veri Modelleri) kullanılmış ve bu bankaların risk yönetimi mekanizmalarını açıklamak için literatür incelenmiştir. Çalışma, tanımlayıcı, analitik ve tümevarımsal yöntemleri benimsemiştir. Bulgular, incelenen bankaların performansında kayda değer bir iyileşme ve iyi düzeyde kârlılık sağladığını göstermektedir; bu durum, bankaların risk yönetimindeki etkinliğini yansıtmaktadır. İslami bankacılık finansman araçlarının maruz kaldığı risklerin kârlılık üzerindeki etkisini (varlık kârlılığı oranı ile ölçülen) değerlendirmek için riskler, özel riskler ve piyasa riskleri olarak iki ana kategoriye ayrılmıştır. Analiz sonuçları, kredi ve likidite risklerinin kârlılık üzerinde olumlu etkisi olduğunu, operasyonel risklerin ise anlamlı bir etkisinin bulunmadığını göstermiştir. Piyasa riskleri açısından ise döviz kurları ve menkul kıymet fiyatlarının olumlu, enflasyonun ise olumsuz etkisi olduğu; faiz oranları ve ekonomik büyümenin (GSYİH) kârlılık üzerinde anlamlı etkisinin olmadığı belirlenmiştir. Araştırma ayrıca, bu bankaların risklerle başa çıkmada etkili mekanizmalar olarak modern araçlar ve bütünleşik politikalar kullandığını ortaya koymaktadır."
