abstract: "İslami finans, bankacılık faaliyetlerinin İslam dini kuralları çerçevesinde yürütülmesi olarak tanımlanabilmektedir. Katılım bankalarının ortaya çıkış nedeni faizi reddeden kesimlerin ellerindeki fonlarını ekonomiden çekmesidir. Bu durum ekonomideki dengeyi olumsuz yönde etkilediği için yeni bir bankacılık arayışını ortaya çıkarmıştır. Türkiye'de ve dünyada katılım bankacılığı farklı zamanlarda gelişme göstermiştir. Türkiye'de katılım bankacılığı statüsünde altı adet banka hizmetlerini sürdürmektedir. Türkiye'de faaliyetlerini sürdüren katılım bankaları faturasız yapılan işlemlerden kaçındığı için devletin vergi gelirlerini ve milli geliri arttırmaktadır. Dünya'da ise 1975 yılında kurulan İslami Kalkınma Bankası katılım bankacılığı alanında bir dönüm noktası olmuştur. Malezya katılım bankacılığında önemli bir konuma sahiptir. Türkiye'nin 2025 yılında ulaşması beklenen finansal büyüklükler bulunmaktadır. 5 yıl sonra katılım bankalarının aktif büyüklüğünün %15 olması beklenmektedir. Bu çalışmada Türkiye'de katılım bankacılığının bankacılık sektörü içerisindeki yeri, fon toplama ve fon kullandırma yöntemleri, katılım bankalarının 2025 yılında ulaşabileceği finansal büyüklüklerin ve katılım bankalarının geleceğinin incelenmesi amaçlanmıştır."
