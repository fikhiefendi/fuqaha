abstract: "Ebû Ca'fer et-Tahâvî, (v. 321/933), erken dönem Hanefî fakîhlerindendir. Mezhepte müçtehit seviyesine ulaşmış olan Tahâvî, sadece fıkıh alanında değil aynı zamanda akide ve hadis alanında da kıymetli eserler telif etmiştir. Gençlik yıllarına kadar Şâfiî mezhebine müntesip olmuş, İmam Şâfiî'nin (v. 204/820) de talebelerinden olan, dayısı Müzenî'den (v. 264/877) Şâfiî fıkhını öğrenmiştir. Tahâvî, Mısır'a atanan Hanefî kadıların da ders halkalarına katılmıştır. Böylece iki mezhebi kıyaslama imkânı bulmuş ve bir süre sonra Hanefî mezhebine geçme kararı almıştır. Hanefî mezhep imamlarına da, bazı fıkhî meselelerin hükmünde muhalefet ederek farklı kanaatler ortaya koymuştur. Çalışmamızın konusu, İmam Tahâvî'nin (v. 321/933) Hanefî mezhebinin kurucu imamı Ebû Hanife (v. 150/767) ile öğrencileri ve aynı zamanda mezhebin ilk nâkilleri olan İmam Ebû Yusuf (v. 182/798) ve İmam Muhamed'e (v. 189/804) muhalefet ettiği fıkhî görüşlerini tespit etmektir. Çalışmamız iki bölüme ayrılmıştır. Birinci bölümde Tahâvî'nin hayatı, ilmi kişiliği ve eserleri ile yaşadığı dönemde Mısır'ın siyasî, sosyal ve ilmî durumu hakkında bilgiler sunulmuştur. Tahâvî'nin Şâfiî mezhebinden ayrılma sebepleri ve Hanefî mezhep imamlarına muhalefet nedenleri ilk bölümde incelemeye çalıştığımız diğer hususlar olmuştur. İkinci bölümde ise; farz, vacip, sünnet, mekrûh ve haram kavramlarının ilk dönem kullanımları ile ilgili kısa bilgi ve örneklerden sonra fıkıh kitaplarının tertibine uygun olarak, Tahâvî'nin Hanefî imamlardan farklı bir kanaate vardığı ihtilaflı meseleler, maddeler halinde ele alınmıştır. ANAHTAR KELİMELER: Tahâvî, Hanefî mezhep imamları, Hanefî fakîhler, Şâfiî, ihtilaf, farz, vacip, sünnet, mekruh."
