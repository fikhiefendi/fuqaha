abstract: "Bankacılık sektörü riskleri; dar anlamda, kredi riski, likidite riski, faiz oranı riski, döviz kuru riski, piyasa riski ve operasyonel risklerdir. Süre gelen ekonomik gelişmeler, bütünleşen uluslararası piyasalar, mali küreselleşme belirsizliği artırmış ve değişen dünya koşulları ile birlikte ihtiyaçlar ve eksiklikler görülmüş; gerek personel, gerekse de teknolojik ve sistem kaynaklı gelişen operasyonel risklerin artan önemi anlaşılmıştır. Buna yönelik Basel düzenlemeleri ile birlikte operasyonel risklerin ölçümüne yönelik kalitatif ve kantitatif yaklaşımlar geliştirilmiş ve detaylandırılmıştır. Diğer taraftan, gerek fon toplama yöntemleriyle, gerekse de fon kullandırma yöntemleriyle konvansiyonel bankacılıktan ayrışan katılım bankacılığı (İslâmi bankacılık), hem ülkemizde hem de dünyada gelişmekte, reel ekonomiyi finanse ederek krizlere karşı daha dirençli yapıyı oluşturmaktadır. Buna karşılık kendine özgü riskler de barındıran katılım bankacılığında operasyonel riskler de yadsınamayacak boyuttadır. Bu çalışmanın amacı operasyonel riskleri katılım bankacılığı özelinde ele almak ve geleneksel bankacılıktan farklarını incelemektir."
