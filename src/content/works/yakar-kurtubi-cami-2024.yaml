abstract: "Kur'ân-ı Kerim' de ibadet, ahlak ve muamelata dair birçok hüküm bulunmaktadır. İslâm'ı kabul edenler için bütün bu hükümler bağlayıcı ve yerine getirilmesi gereklidir. İlgili unsurların Kur'ân içerisinden tespit edilmesi ve bir kategoriye tâbi tutulması; muhatabın emirleri anlaması ve tatbik etmesi açısından son derece önemlidir. Çalışmamızda Kurtubî'nin el-Câmiʿ li-ahkâmi'l-Kurʾân adlı tefsirindeki ibadete dair açıklamalarını ve yorumlarını ele almaya çalıştık. Kurtubî'nin tefsiri ahkâm alanında yapılmış en önemli çalışmalardan biri olarak değerlendirilmektedir. İçerisinde kıraat alanından âyetlerin ahkâmına kadar detaylı bilgiler bulunmaktadır. Diğer taraftan ibâdet, Müslümanlar için son derece önemlidir. Kur'ân'da ibâdete dair birçok âyet bulunmakta, bu âyetlerin bir bütün olarak değerlendirilmesi önem arzetmektedir. Çalışmamızda ibâdetin fıkhi boyutu yanında manevi yönünede temas etmeye çalıştık. Aktardığımız bilgiler gösteriyor ki ibadetlerin anlam, amaç ve ruhani boyutu zahiri boyutuna anlam katmakta ve ibadet edende vicdan ve duyarlılık oluşturmaktadır. Kurtubî ve tefsiri her yönüyle incelemeye tâbi tutulacak hususiyetler barındırmaktadır. Müfessir, ders aldığı hocalar, bıraktığı eserler değerlendirildiğinde Kurtubî fikirlerine önem verilmesi gereken âlimlerdendir. En tanınmış eseri diyebileceğimiz el-Câmi' li-ahkâmi'l-Kur'ân adlı tefsiri de Kur'ân'ın hüküm yönünü ön plana çıkarması açısından dikkatleri üzerine çekmektedir. Saydığımız bu özelliklere bir de ibâdet hayatının Müslümanlar için önemi eklenince çalışmamızın ehemmiyeti anlaşılır hale gelecektir. Çalışmamızın belki de en önemli kısmı çok hacimli bir eser olan el-Câmi' li-ahkâmi'l-Kurʾân adlı tefsirin ibâdete dair değerlendirmelerini bir araya getirmek olacaktır. Böylece hem konulara hem de konular hakkındaki değerlendirmelere ulaşma imkânı kolaylaşacaktır. Yaptığımız bu çalışmada Kurtubî'nin ibadet hayatıyla ilgili yorumlarını, değerlendirmelerini ele almaya çalıştık. Konular üzerindeki değerlendirmelerin doğru bir şekilde yapılabilmesi için yeri geldiğinde farklı görüş ve yorumlarla konuyu destekledik. Amacımız; Kur'ân'ın ibâdet hayatına dair emirlerini Kurtubî'nin bakış açısıyla anlamaya çalışmaktır. Bunun yanında şunu da belirtmemiz gerekir ki çalışmamız esnasında ele aldığımız konuların her biri başlı başına bir çalışma yapılabilecek alanlardır. İslâmın ilmi mirasının ne kadar geniş olduğunu gösteren bu durum, yeri geldiğinde Kurtubî'nin yorumlarıyla iktifa etmemizi mecburi kılmıştır. Tezimizi iki ana bölüme ayırdık. Birinci bölümde, ibadet kavramıyla ilgili genel bir değerlendirmede bulunduktan sonra bedeni ibâdetler hakkında Kurtubî'nin yorumlarını aktardık. İkinci bölümde ise Kurtubî'nin mali ibâdetler hakkındaki görüşlerini ele aldık. Çalışmamız literal tarama yöntemiyle yazılmıştır. Kurtubî'nin görüşlerinin esas alındığı tezimizde, müfessirin farklı görüşleri de zikretmesinden dolayı, yeri geldiğince görüşler hakkında yorumlarda bulunulmaya çalışılmıştır."
