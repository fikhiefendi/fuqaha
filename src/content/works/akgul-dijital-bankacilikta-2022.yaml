abstract: "Dijitalleşmenin her geçen gün geliştiği günümüzde bankacılık sektörü de bu gelişmelerden yararlanmaktadır. Bu çalışmada gelişen dijital bankacılığın yeni bir uygulama alanı olan Uzaktan Müşteri Edinimi sürecini incelenmiştir. Uzaktan Müşteri Edinimi sürecine ilişkin verilere içerik analizi yöntemi kullanılarak ulaşılmıştır. Çalışmanın ilk kısmında genel bankacılık uygulamaları, bankacılık kavramı, gelişim süreci ve banka türleri üzerinde durulmuştur. İkinci kısımda ise dijital bankacılık, kullanım alanları gibi konular çalışılmıştır. Bahsi geçen konular hakkında TBB, BDDK ve sektördeki bankaların süreçleri ve çalışmaları incelenmiştir. Üçüncü bölümde Uzaktan Müşteri Edinimi sürecinin uygulama şekli araştırılmıştır. Farklı ülkelerdeki örnekler incelenerek çalışmaya eklenmiştir. Bugün Türkiye'de BDDK'nın konu ile alakalı yayımlamış olduğu yönerge bankalara kılavuzluk etmektedir. Çalışmanın son kısmında Albaraka Türk Katılım Bankası'nda Uzaktan Müşteri Edinimi süreci değerlendirilmiştir. Sürece ilişkin veriler Albaraka Türk Katılım Bankası'na ait faaliyet raporları ve resmi sitesinde yer alan verilerden derlenmiştir. Uzaktan Müşteri Edinimi, dijital bankacılığın geldiği noktayı göstermesi açısından bankacılık sektöründe önemli bir kilometre taşıdır. Bu neden le çalışmada Uzaktan Müşteri Edinimi sürecine ilişkin müşteri talep verileri kullanılmıştır. Verileri sayısal olarak analiz edilmiş ve sonuçlar bu çalışmada detaylı olarak açıklanmıştır."
