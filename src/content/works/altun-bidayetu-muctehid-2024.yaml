abstract: "Bu çalışmada, İslam filozofu ve Mâlikî fakihi İbn Rüşd'ün (ö. 595/1198) mezhepler arası karşılaştırmalı fıkıh kitabı olan“Bidâyetü'l-müctehîd ve nihâyetü'l-muktesîd”isimli eserinin Kitabu'n-nikâh bölümünde, Mâlikî ve Hanefî mezhepleri arasındaki ihtilafların tespit ve incelenmesi gerçekleştirilmiştir. Bu ihtilafların tespit edilmesi, müellifin eserinde her iki mezhep arasında ihtilaflı olduğunu iddia ettiği görüşlerin, gerçekten de o mezheplere ait olduğu ya da o konunun iki mezhep arasında ihtilaflı bir konu olup olmadığı açısından önem arz etmektedir. Yine mezhep müctehitlerinin, fıkhî meselelere yaklaşırken İslam hukukunun asli ve ferî kaynaklarını nasıl kullandıklarının tetkik edilmesi, kendilerine mahsus usul ve yöntemlerinin tespit edilmesi bakımından önemlidir. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı ve araştırmanın literatür özeti hakkında bilgi verilmiştir. Çalışmamızın birinci bölümünde; nikâh akdinin dini mükellefiyeti, akdin üzerine kurulduğu rükünler, nikâh akdinde veli, şahit ve evlilik engelleri gibi nikâh akdinden önceki ihtilaflar tespit edilip, Mâlikî ve Hanefî mezheplerinin kaynaklarında gerekçeleriyle birlikte tetkik edilmiştir. İkinci bölümde ise; nikâh akdinin feshedilmesini gerektiren sebepler, evlilik hakları ve yasak evlilikler gibi nikâh akdinden sonraki ihtilaflar tespit edilip, her iki mezhebin kaynaklarında gerekçeleriyle birlikte ele alınmıştır. Bunun yanı sıra önemli konularda, günümüzde kendisiyle fetva verilen mezhebin görüşü gerekçesiyle birlikte açıklanmıştır."
