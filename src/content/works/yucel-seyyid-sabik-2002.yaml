abstract: "87 7. ÖZET Araştırmamızın konusunu oluşturan“Fıkhü's-Sünne ”adlı eser, telif edildiği yörenin ve İslam dünyasının içinde bulunduğu durum göz önüne alınarak kaleme alınmıştır. Amacı fıkhî çözümlerde genişlik oluşturmak olan eser, içtihat, taklit ve telfik gibi kavramlara vurgu yapmış; fıkıh tarihi dönemlerinden, taklit ve duraklama devriyle birlikte ortaya çıkan taassup ve taklitten, müslüman toplumu arındırmayı bunu yaparken de, kolaylaştırıcı ve genişletici bir yaklaşım sergilemeye çalışmıştır. Eser fıkhî çözümlerde, sıkıntıdan kurtarıcı yöntemiyle öne çıkmış olup, yöresinin insanlarına olduğu kadar, dünya Müslümanlarına da rehber olmayı hedeflemiştir. Yazarın ulaşmaya çalıştığı hedefi gerçekleştirebilmek için telif ettiği eserinin yöntemi her ne kadar tarafımızca tutarlı bulunmasa da, söz konusu eser, geniş kitlelere ulaşmış ve bir çok dünya diline tercüme edilmiştir. Çalışmamızda içtihat, taklit, telfik, mezhep, fıkhu'l-hadis, fıkhu's-sünne ve ehl-i hadis kavramları ile Seyyid Sabık ve Fıkhu's-Sünne adlı eserinin öne çıkan özellikleri ve yöntem önerileri üzerinde durduk. Ayrıca eserin metodolojik analizini, İslâm Hukuku kaynakları bağlamında yazarın hadis yöntemi de dikkate alarak ortaya koymaya çalıştık. Müellif özellikle hadis yöntemi hususunda tutarlılık sergileyememiştir. Yazar klasik fıkıh usulü yaklaşımında olduğu gibi, örf ve maslahata vurgu yapmış, birçok hükmün maslahat yönüne işaret ederken, naklin olmadığı bazı konularda çözümü maslahat ve örfte aramıştır. Yazar klasik fıkıh usulcülerinin yaklaşımında olduğu gibi, icmaya muhalefet eden görüşe itibar olunmayacağı kanaatindedir. Kıyas konusunda mutedil eserciler gibi tutum sergileyen müellif, sahabe kavlinin, Hz. Peygamber' in uygulamasıyla çelişmemesi ve aksine bir delil olmaması durumunda delil olacağını düşünmektedir. Eser yönteminde aksaklıklar gösterse de, taassup ve taklidi kaldırmak gibi hedefle rine ulaşacak adımlar atmıştır."
