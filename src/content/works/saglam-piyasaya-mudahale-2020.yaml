abstract: "Piyasa, günümüzde her ne kadar somut ve gözlemlenebilir bir iktisat kavramı olarak ele alınsa da piyasa kabulleri ve varsayımları bir dünya görüşü, metafizik ve ahlaki bir takım temeller üzerine inşa olmaktadır. Dolayısıyla piyasaların işleyişi hiçbir zaman bu değerlerden bağımsız şekillenmemiştir. Bu noktada unutmamak gerekir ki insanlık tarihinde ahlak, metafizik, değer gibi kavramlara yüklenen anlamlar da çeşitlilik göstermiştir. Tezimiz piyasa (pazar) ve ahlak kavramlarının klasik İslam düşüncesi ve liberal iktisat düşüncesi kapsamında mahiyetini karşılaştırmayı, bu sayede ontolojik ve epistemolojik düzeyde yer alan farklılıkları ortaya koymayı amaçlamaktadır. Bu minvalde birinci bölümde klasik İslam düşüncesinin ilk tecrübesi Hz. Peygamber ve Hulefâ-yi Râşidîn dönemi ile son tecrübesi olarak kabul ettiğimiz Osmanlı Devleti tecrübeleri ışığında piyasa ve ahlakın mahiyeti ile birlikte piyasaya müdahalenin ahlakiliği ele alınmıştır. İkinci bölümde benzer bir yöntem liberal iktisat düşüncesi için gerçekleştirilmiştir. Özellikle ahlakilik bağlamında eleştirileri üzerine çeken liberal iktisat düşüncesinin kendisini bir ahlak teorisi olarak inşa etmesi bu noktada önemlidir. Son olarak üçüncü bölümde günümüz piyasa kavramının nasıl bir dönüşüm geçirdiği ve ahlakın bu dönüşümde nerede konumlandığı küreselleşme, finansallaşma, teknoloji, üretim, ihtiyaçlar ve çok uluslu şirketler bağlamında ele alınmıştır. Pratikte benzerlikleri olsa dahi ontolojik zeminde birbirinden ayrılan İslam iktisat ve liberal iktisat düşüncelerinin bu farklılıkları değerli olup, günümüz piyasa tartışmalarında bu farklılıkları gözden kaçırmak İslam iktisadı çalışmaları altında farklı bir zemin üzerine inşa olmuş liberal piyasanın işleyişine destek verme tehlikesini barındırmaktadır."
