abstract: "Bu çalışmada emzirmenin İslam dinindeki önemi, İslam hukukundaki hüküm ve uygulamaları, sütannelik kurumu, modern tıp verileri ile süt bankacılığına ilişkin güncel meseleler bütüncül bir yaklaşımla değerlendirilmiştir. Üç bölümden oluşan çalışmanın ilk bölümünde, modern tıpta anne sütü ve emzirmenin önemi ile bu sürecin anne ve bebek sağlığı üzerindeki biyolojik ve psikolojik etkileri ele alınmıştır. Ardından emzirmenin İslam hukukundaki yeri değerlendirilmiş, doğumun sonuçlarıyla bağlantılı olarak nesebin sübutu, hıdâne ve nafaka gibi meselelere değinilmiştir. İlk bölümde çalışmanın özgün yönlerinden biri olarak anne sütü ve emzirme konusu hem modern tıbbî veriler hem de İslam hukuku perspektifiyle incelenmiş; iki yaklaşım arasındaki ortak ve farklı noktalar ortaya konmuştur. İkinci bölümde, emziren kişi açısından öz anne ve sütanneye ilişkin hükümlere yer verilmiştir. Öz annenin emzirmesiyle ilgili fıkhî görüşler, annenin hukuken emzirme yükümlülüğü olup olmadığı, emzirme ücretiyle ilgili hükümler ve mezhepler arasındaki farklılıklar karşılaştırmalı olarak ele alınmıştır. Ayrıca sütannelik kurumu, sütannelik akdi ve öz anne ile sütanne arasında öncelik gibi konular da değerlendirilmiştir. Üçüncü bölümde emzirmenin bir sonucu olarak ortaya çıkan süt akrabalığı konusu ele alınmıştır. Bu bağlamda süt hısımlığının oluşma şartları, daimî evlilik engeli doğuran durumlar, süt hısımlığı sebebiyle evlenmeleri haram olan akrabalar ve süt hısımlığının ispat yolları incelenmiştir. Ayrıca, güncel bir tartışma alanı olan süt bankacılığı konusu fıkhî açıdan değerlendirilmiş; zaruret halleri çerçevesinde ortaya konulan farklı görüşler analiz edilmiştir"
