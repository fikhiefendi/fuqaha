abstract: "Bu çalışma, klasik dönem İslam ceza hukukunun ahkâm tefsiri bağlamında nasıl yorumlandığını, Hanefî âlim el-Cessâs (ö. 370/981)'ın“Ahkâmü'l-Kur'ân”ı ile Mâlikî âlim el-Kurtubî (ö. 671/ 1273)'nin“el-Câmi' li-ahkâmi'l-Kur'ân”eserleri üzerinden mukayeseli bir şekilde incelemektedir. Çalışmada özellikle zina, kazf, sirkat, hırâbe ve bağy gibi temel ceza hukukuna konu olan suçlar ele alınmış, bu suçlara dair ahkâm âyetlerinin iki farklı mezhep ve tefsir geleneği bağlamında nasıl yorumlandığı analiz edilmiştir. Cessâs'ın Hanefî metodolojisi çerçevesinde aklî delilleri öne çıkaran sistematik yaklaşımı ile Kurtubî'nin daha hikmet odaklı, bağlamsal ve mezhepler arası görüşlere açık yorum yöntemi karşılaştırmalı olarak değerlendirilmiştir. Çalışma, metinler arası karşılaştırmalı analiz yoluyla müfessirlerin ceza hukukuna dair yorumlarını sistematik biçimde incelemektedir. Bu yöntem sayesinde iki müfessirin yalnızca fıkhî yorumları değil, aynı zamanda yaşadıkları dönemin sosyal, siyasî ve ilmî bağlamlarının tefsirlerine etkisi de göz önünde bulundurulmuştur. Zina, kazf, hırsızlık, hirâbe ve bağy gibi had suçlarının yanı sıra kısas, diyet ve tazir cezalarıyla ilgili âyetlere yaklaşımları karşılaştırılmış, aralarındaki yorum farkları ortaya konulmuştur.Çalışmada hamr (içki) ve irtidat (dinden dönme) gibi suçlar ise kapsam dışı bırakılmıştır. Bunun temel gerekçesi, bu suçlara dair Kur'ân-ı Kerim'de yer alan hükümlerin doğrudan ve açık hükümlerle değil, dolaylı atıflar veya sünnet temelli uygulamalar üzerinden şekillenmiş olmasıdır. Bu nedenle, çalışma ceza hukukunun doğrudan ahkâm âyetleriyle düzenlenmiş suçlarıyla sınırlandırılmıştır. Çalışmamız, klasik dönem tefsir geleneğinde ceza hukukunun nasıl yorumlandığını ortaya koyarken, mezhepler arası yaklaşım farklarının yöntemsel ve içeriksel düzeydeki yansımalarını da tespit etmektedir. Cessâs'ın normatif-fıkhî içtihat yöntemi ile Kurtubî'nin daha kapsayıcı ve bağlamsal yaklaşımı arasındaki farklar, yalnızca tarihsel bir karşılaştırma sunmamakta, aynı zamanda günümüz İslam hukuk düşüncesine katkı sağlayacak zengin bir metodolojik perspektif de sunmaktadır."
