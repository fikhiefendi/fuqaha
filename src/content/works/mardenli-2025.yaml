abstract: "Bu çalışma, Hicrî dördüncü yüzyılda Arap dili fıkhına dair öne çıkan eserlerdeki belâgat boyutlarını inceleme ve analiz etme amacıyla yapılmıştır. Ele alınan başlıca eserler şunlardır: Ebu'l-Feth Osman b. Cinnî'nin el-Hasâis, Ebu'l-Hüseyin Ahmed b. Fâris'in es-Sâhibî fî Fıkhi'l-Luğa ve Süneni'l-'Arab fî Kelâmihâ, ve Ebu Mansur Abdülmelik es-Seâlibî'nin Fıkhu'l-Luğa ve Sırru'l-Arabiyye adlı eserleri. Bu çalışmanın önemi, genellikle sözlükbilimsel ve dilbilgisel meselelerle ilişkilendirilen bu eserlerin, aynı zamanda belâgat ilmine dair önemli konuları barındırdığını ortaya koymasında yatmaktadır. Araştırma; betimleyici, çözümleyici ve tümevarımsal bir yöntem benimsemiş, söz konusu üç eserdeki belâgat ilmi ile ilgili meseleleri tarihî ve karşılaştırmalı bir çerçevede takip ederek ele almıştır. Tezin temel amacı, bu dilsel eserlerin yalnızca fıkhu'l-luğa meselelerini derleyen metinler olmadığını, aynı zamanda sistematik belâgat anlayışının ortaya çıkmasına bir zemin oluşturduğunu ispat etmektir. Her üç yazarın, belâgat ilmini kavramsal bir disiplin olarak kurmamış olsalar da, eserlerine serpiştirdikleri teorik ve uygulamalı pasajlarla beşinci yüzyılda Abdülkâhir el-Cürcânî başta olmak üzere sonraki âlimler için önemli kavramların yolunu açtıkları görülmektedir. Tez; bir giriş ve beş bölümden oluşmaktadır. Giriş bölümünde kuramsal çerçeve yer verilmiştir. Birinci bölümde hicrî dördüncü yüzyılda belâgat; ikinci bölümde aynı yüzyılda fıkhu'l-luğa konusu ele alınmıştır. Üçüncü bölüm, İbn Cinnî'nin el-Hasâis adlı eseri üzerine detaylı bir inceleme sunmuştur. Dördüncü bölümde ise İbn Fâris'in es-Sâhibî adlı eseri incelenmiş, beşinci ve son bölümde ise Seâlibî'nin Fıkhu'l-Luğa ve Sırru'l-Arabiyye adlı eseri detaylı olarak değerlendirilmiştir. Her kitap, ayrı ayrı ele alınarak içerdiği belâgat ilmiyle alakalı yönler sistemli biçimde analiz edilmiş, üslup ve örnekler çözümleyici bir yaklaşımla değerlendirilmiştir. Tezin sonunda araştırma bulgularına dayalı uygulamalı bir bölüm sunulmuş olmasının yanı sıra genel sonuçlar ve önerilerle çalışma tamamlanmıştır. Bu çalışma, yukarıda zikri geçen klasik metinler yeterince incelendiği takdirde belâgat ilmiyle ilgili önemli unsurları içerdiği görülecektir. Bunun yanı sıra modern dilbilimsel ve belâgat araştırmalarının bu zengin mirasa yeniden yönelmesi gerektiğini vurgulamıştır. Ayrıca Arap belâgatının canlı yapısını ve çağdaş teorilerin birçoğunun klasik köklere dayandığını göstererek, onu durağan ve tükenmiş gören yaklaşımların aksine yeni bakış açıları sunmuştur. Bu bağlamda, söz konusu âlimlerin kullandığı çözümleyici yöntemlerden, özellikle Arapçayı yabancı dil olarak öğretme alanında da yararlanılabileceği sonucuna varılmıştır."
