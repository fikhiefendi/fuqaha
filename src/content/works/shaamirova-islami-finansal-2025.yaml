abstract: "Çağımız finans dünyasında yeni bir sistem gibi algılanan İslami finans esasen Müslüman dünyasında orta çağlardan beri uygulanmaktadır. İlkeleri arasında reel varlığa dayalı olma, karşılıklı risk ve kâr paylaşımı, adalet ve işlemlerde hakkaniyet yer almaktadır. İslami finans kuruluşlarının mevcut ürünleri uygulamalarına ve yeni finansal ürünleri geliştirilmesi için İslami danışma kurullarından onay almaları gerekmektedir. Bununla birlikte, mevcut ürün geliştirme uygulamaları temel ve yasal düzeylerde ikilemlerle karşı karşıyadır ve bazıları İslami finans ürünlerinin İslam hukukunun özüne ve ruhuna değinmeden geleneksel finansal ürünleri taklit ettiğini savunmaktadır. Bu görüş sahiplerine göre İslami finans ürünlerinin geliştirilmesi ve mühendislik süreci, bugün egemenliği olan konvansiyonel finansal sisteme ve yasal çerçeveye uyma ihtiyacından etkilenmektedir. Bu durum, İslami finans ürünlerini geliştirme süreçlerinin yeterince incelenmemesine yol açmıştır. Bu nedenle, bu çalışma İslami Finans Kuruluşlarının (İFK'lar) yeni ürünler tasarlamak ve geliştirmek için kullandıkları faktörleri ve metodolojileri araştırmaktadır. İFK'ların finansal mühendislik ve ürün geliştirme süreçlerini yönlendirmek için dini standartları yapılarına nasıl dahil ettiklerini incelemektedir. Araştırmada, İslami finans sektöründeki kilit isimlerle yapılan anket ve mülakatları içeren karma bir yöntem kullanılmıştır. Veriler Sosyal Bilimler için İstatistik Paketi (SPSS) ve Moment Yapı Analizi (AMOS) yazılımı kullanılarak analiz edilmiştir. Bulgular, İslami finans çerçevesinde bir ürün için sağlam bir yapı oluşturmanın üç temel hususu ele almanın çok önemli olduğunu göstermektedir: biçim, içerik ve uygulama. Çalışma ayrıca Şeriata uygun bir ürün ile Şeriata dayalı bir ürün arasındaki ayrımın yanlışlığına ve Şeriata uygunluk eksikliğine dikkat çekmektedir. Araştırma, düzenleyicilere, politika yapıcılara, Şeriat Kurullarına ve İFK'ların ürün geliştirme ekiplerine ilave tavsiyeler sunmaktadır."
