abstract: "Hukuk felsefesi tarihinde Tabii hukuk düşüncesinin ağırlıklı bir yeri vardır. Bu çalışmada pozitif hukuku canlı, dinamik tutan Tabii hukuk düşüncesiyle İslam hukukunun zaman ve zemine göre elastikiyetini sağlayan içtihad prensipleri (Tali deliller) mukayese ediliyor. Konuda mutabakat sağlansın diye ilk önce hukuk, amaçlarıyla tanıtılmaya çalışılmış, daha sonra Tarihi seyir içinde Tabii hukuk verilmiştir. İslam hukununun gayesi, Tali delillerin yerli yerine konulması açısından önemli olduğundan ikinci bölümün hemen gişinde bu konu işlenmeye çalışılmış; konunun bütünlüğünü sağlayacağı için Hüsün, Kubuh, Fıtrat, Akıl işlenmiş ve bir değerlendirme yapılarak çalışma bitirilmiştir."
