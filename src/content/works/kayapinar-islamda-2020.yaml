abstract: "Bankalar günümüzdeki iktisadî hayatın en temel kurumları haline gelmiştir. Mevduat bankalarının işlemlerine konu olan faizin hükmü hakkında büyük oranda ittifak sağlanmıştır. Ancak katılım bankalarının özellikle fon kullandırma yöntemleri üzerinde bazı tartışma ve tereddütler mevcuttur. Bu çalışmada katılım bankalarının fon toplama ve kullandırma yöntemlerinin İslam hukukuna uygun olup olmadığı incelenmiştir. Çalışmanın giriş kısmında tezin amacı, önemi, kapsamı, metodu ve kaynakları ele alınmıştır. Bu kısımda ayrıca genel bir bakış açısı oluşturmak amacıyla, faiz ile ilgili leh ve aleyhteki görüş ve yaklaşımlar özet olarak sunulmuştur. Tezin birinci bölümünde çalışmada kullanılan kavramların çerçevesi tespit edilmiş, akabinde ribâ yasağının daha iyi anlaşılabilmesi amacıyla, cahiliye döneminin iktisadî uygulamaları incelenmiştir. Daha sonra ribâyı yasaklayan naslar ele alınmış ve ribâ yasağının keyfiyeti üzerinde durulmuştur. Ardından fıkhın sistematik hale getirildiği müçtehit imamlar döneminde tespit edilen ribâ hakkındaki kaideler ele alınmıştır. Bu bölümün sonunda ise günümüz katılım bankaları için önemli bir referans kaynağı olan para vakıfları ve konumuzla ilgili uygulamaları incelemeye tâbi tutulmuştur. Tezin ikinci bölümünde katılım bankalarının fon toplama ve kullandırma yöntemleri incelenmiştir. Söz konusu uygulamaların tespit edilmesi amacıyla bankaların resmi sitelerindeki sözleşmeler esas alınmıştır. Çalışmanın son bölümünde ise katılım bankalarının söz konusu uygulamaları, İslam iktisat düşüncesinin temel kaideleri açısından bütüncül olarak ele alınmıştır. Çalışmanın sonunda ise ulaşılan sonuçların ifade edildiği bir değerlendirme bölümüne yer verilmiştir."
