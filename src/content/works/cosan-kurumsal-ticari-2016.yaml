abstract: "ÖZET KURUMSAL VE TİCARİ BANKACILIK AÇISINDAN KATILIM BANKALARININ ETKİNLİĞİNİN ÖLÇÜLMESİ : TÜRKİYE ÖRNEĞİ Fon arz ve talep edenleri buluşturan finansal sistem, bu etkileşimin devamlılığını sağlama hususunda dinamik bir yapıya sahiptir. Türkiye'de 2005 yılında katılım bankalarına dönüştürülen faizsiz finans kurumları, konvansiyonel bankalar ile eşit haklara sahip olarak sektörde pay almaya başlamıştır. Bu tez çalışması, Türkiye'de faizsiz finans kurumlarının kuruluş aşamalarını göstermeyi, bankaların genel müdürlük ve şube segmentasyonu hususunda bilgi vermeyi, 2011 den 2015 yılına kadar olan dönemde Türkiye'de Kurumsal ve Ticari Bankacılık alanında katılım bankalarında yaşanan gelişmeleri ölçmeyi amaçlamaktadır. Tez üç bölümden oluşmakta olup, ilk bölümde faizsiz finans sisteminin argümanları, sistemin ortaya çıkışı, Dünya'daki ve Türkiye'deki gelişimi hususu anlatılmaya çalışılmıştır. İkinci bölümde Türkiye'de firmaların segmentasyonu hususunda detaylı bilgilere yer verilmiş olup, KOBİ, Kurumsal ve Ticari firmaların belirlenme kriterleri anlatılmaya çalışılmıştır. Üçüncü bölümde katılım bankalarının Kurumsal ve Ticari Bankacılık alanında 2011-2015 yılları arasında bilançolarında yaşanan gelişmeler literatur tarama ve veri toplama yöntemi ile ölçülmeye çalışılmıştır. İncelenen 2011-2015 yılları arasında Kurumsal ve Ticari Krediler alanında katılım bankacılığının payı yıldan yıla azalmaktadır. Sektöre giriş yapan kamu katılım bankalarının bu durumu tersine çevrilebileceği öngörüsü ile beraber, Katılım Bankalarının kurumsal ve ticari krediler alanında payını arttırıp, aktif rakamını büyüterek bankacılık sektöründe payını arttırmayı hedeflemektedir. Kriz döneminde katılım bankalarının kendi iç dinamikleri ile ayakta kalması konvansiyel bankalara göre farklılık göstermesi, kurumsal ve ticari krediler alanında uzun dönemde büyük kazanımlar elde edeceği beklentisini güçlendirmektedir."
