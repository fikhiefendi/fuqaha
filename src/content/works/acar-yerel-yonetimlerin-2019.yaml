abstract: "Günümüzde yerel yönetimlerin üzerine yüklenen altyapı yatırımlarının mevcut bütçeler ile sürdürülebilmesi ve mevcut konvansiyonel borç sistemi ile yönetilebilmesi oldukça zor, planlanan yatırımların yerine getirilmesi ise neredeyse imkânsızdır. Mevcut finansal yapılarını yönetmekte zorlanan yerel yönetimlerin gelecekte bu yatırımları gerçekleştirebilmek için hangi kaynakları kullanacakları ise tamamıyla muammadır. Bu çalışmanın amacı; bir taraftan altyapı yatırımlarına finansman kaynağı arayışında olan yerel yönetimlere alternatif bir kaynak sunmak, diğer taraftan gelişen islami bankacılık piyasalarında yeni yeni yer bulmaya çalışan ülkemiz islami bankacılık ürünlerine yeni, güvenilir ve yatırım yapılabilir ürünler ortaya koymaktır. Sukuk, her ne kadar geçmişten günümüze kadar devletlerin ve özel teşebbüslerin islami finans kaynağı olarak öne çıksa da, gelecekte yerel yönetimlerin vazifesi olan yatırımların finansmanında kaynak olarak kullanılacağı çok açıktır. Çalışma kapsamında kuramsal bilgi alanında sukukun tarihi, gelişimi ve türleri ile ilgili literatür taraması yapılarak, dünya sukuk piyasaları, sukuk kullanım alanları, ihraç yöntemleri ve sukuk piyasalarının ülkesel bazda özellikleri incelenmiştir. Somut bilgiler ışığında sukukun yerel yönetimlerin altyapı yatırımlarına uygulanabilir türleri hakkında modeller geliştirilmiştir. Ülkemizde islami bankacılık alanında uygulanan mevzuatın eksiklikleri tespit edilmeye çalışılarak, sukuk piyasalarının gelişimi ve dünya sukuk piyasaları ile denkleştirilmesi için yapılması gerekenler tespit edilmeye çalışılmıştır."
