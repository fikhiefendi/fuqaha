abstract: "Çalışmamızda islam hukukunun dinamik yapısını oluşturan ve güncelliğini hep koruyan ictihad konusu, değişik yönleriyle ele alınmaktadır. Birinci bölümde Fahrettin er-Râzî'nin hayatı, eserleri ve İslam düşüncesindeki yeri ele alınmış, İkinci bölümde Usûlde ictihad bağlamında ictihad'ın tanımı, mana ve şümulü, Gazali ve Şatıbi'ye göre ictihad için gerekli şartlar üzerinde durulmuş, Üçüncü bölümde ise Fahrettin er-Râzî'nin ictihad ve müctehid kavramlarıyla ilgili görüşlerine yer verilmektedir. Bu bölümde ayrıca er-Râzî'nin, Hz. Peygamber'in ictihad yapıp-yapmadığı ile ilgili argümanlarına yer verilmiş, musavvibe ve muhattie ehlinin görüşleri ele alınmaktadır. Bu çalışmada Fahrettin er-Râzî'nin ictihada farklı yaklaşım tarzı ele alınmakta ve bu konudaki değişik İslam âlimlerinin ictihad ve müctehid kavramlarıyla ilgili benzer veya farklı düşünceleri tahlil edilmektedir. İşte Fahrettin er-Râzî de bu eserinde Gazalinin el-Mustasfa'sını esas alarak tenkitçi bir yaklaşım tarzıyla bizlere üslup çeşitliliğini göster-mektedir."
