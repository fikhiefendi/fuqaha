abstract: "Aydın oğulları döneminde Tire'de yaşamış ve Fıkıh ve Usulü Fıkıh alanında önemli eserler vermiş olan İbn Melek'in Fıkıh alanında yazmış olduğu \"Şerhu Mecmaʿi'l-bahreyn\" eseri Türkiye'de 200 den fazla yazması olduğu halde üzerinde çalışılmamış önemli bir eserdir. Bu çalışmada İbn Melek ve İbn Saati ve eserleri hakkında bilgi verilecek, İbn Melek'in şerhinde istifade ettiği kaynaklar ve yöntemi üzerinde değinildikten sonra eserin tahkiki yapılacaktır."
