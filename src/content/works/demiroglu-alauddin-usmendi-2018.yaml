abstract: "Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde Üsmendî'nin hayatı ve eserleri ele alınmış Ṭarîḳatü'l-ḫilâf fi'l-fıḳh beyne'l-e'immeti'l-eslâf isimli eseri tanıtılmıştır. İkinci bölümde ise Üsmendî'den önceki ileri gelen bazı usûlcülerin istidlâl tanımlarına ve eserlerinde yer verdikleri istidlâl türlerine değinilmiş, Üsmendî'nin Ṭarîḳatü'lḫilâf'ta kullandığı istidlâl türleri tespit edilmeye çalışılmıştır. Üçüncü bölümde ise Ṭarîḳatü'l-ḫilâf'ta tartışılan konular içinden dört örnek seçilmiş ve bunlar, Ṭarîḳatü'lḫilâf'taki işleniş şekli ve kullanılan istidlâl çeşitleri açısından Cessâs'ın Şerḥu muḫtaṣari'ṭ-Ṭaḥâvî ve Serahsî'nin el-Mebsûṭ adlı eserleriyle mukayese edilmiştir."
