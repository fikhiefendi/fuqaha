abstract: "İslam, bilindiği üzere bin dört yüz yıldan fazla bir zamandır dünyanın farklı farklı birçok coğrafyasında kendisine tabi milyarlarca insanın benimsemiş olduğu semavi bir dindir. Sistem olarak ibadetleri, yasakları, meşru şeyleri, mübadeleyi, insan ilişkilerini, devletler hukukunu vb. birçok alanı düzenleyen bir takım prensiplere sahiptir. Dolayısıyla ekonomik hayatı kapsayan yaptırımlarıyla bu denli geniş bir insan kitlesini, yaklaşık bin beş yüz yıl gibi büyük bir zaman zarfında etkileyen bir dinin, paradigmik yapısını anlamak; tarihsel, sosyolojik ve iktisadi açıdan önem arzetmektedir. İşte bu çalışmada mezkur arzu ve ihtiyaçtan kaynaklı olarak İslam?ın ekonomiyle ilgili hükümlerinin, yine ekonomik hayatın iki önemli yapı taşı olan emek ve sermaye olgularıyla ilişkisi incelenmiştir. Emek ve sermaye konuları incelenmeye başlanmadan önce İslam?ın ekonomik hayatla ilgili bir takım prensipleri açıklanmış, konuyla ilgili çalışmalardan örnekler verilmiş ve diğer ekonomik sistemlerle arasındaki farklar kritiğe tabi tutulmuştur. Daha sonra ise İslam?ın emek ve sermayeyle ilişkili önemli hükümleri hakkında bilgi verilmeye çalışılmış, modern zamanda bu pratiklerin uygulanış şekillerinden örnekler sunulmuştur. Bu çalışmada konu ile ilgili genel olarak kabul görmüş İslami prensipler ve uygulamalar, Kur?an ve Hadis gibi ana kaynaklardaki varlıklarıyla sadece nakledilmeye çalışılmış; ayıca bunlar hakkında mutlak olarak ispat etme ve delil gösterme yoluna gidilmemiştir."
