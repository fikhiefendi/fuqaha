abstract: "İzmîrî Mevlânâ Mehmed'in Şerhu'l-Eşbâh ve'n-nezâir isimli eseri ve kaynaklarını konu edinen bu çalışma, iki bölümden ve sonuç kısmından oluşmaktadır. Birinci bölümde, el-Eşbâh ve'n-nezâir'in müellifi Zeynüddîn İbn Nüceym ve şârihi İzmîrî Mevlânâ Mehmed'in hayatı ve eserleri konu edilmektedir. İkinci bölümde ise, İzmîrî'nin Şerhu'l-Eşbâh ve'n-nezâir isimli eseri ele alınarak, eserde geçen kaynaklar sıralanmıştır. Şerhte atıfta bulunulduğu tespit edilen kaynaklar hakkında bilgiler verilmiş ve okuyucuya kolaylık sağlaması amacıyla veriler tablo halinde istifadeye sunulmuştur."
