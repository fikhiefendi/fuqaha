abstract: "Emir bi'l-ma'rûf ve nehiy ani'l-münker (İyiliği emretmek ve kötülükten alıkoymak/sakındırmak) İslam'ın küllî kaidelerindendir. Bu çalışmada söz konusu prensibin bir parçası olan münkeri nehyetmenin hükmü ve münker ile mücadele etmenin hukukî boyutu incelenmektedir. Nitel araştırma yöntemiyle yapılan bu çalışmada problemi belirlemek ve kavramsal çerçeveyi oluşturmak oldukça önemlidir. Çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, kapsamı ve amacı belirlenmekte olup başvurulan yöntemler açıklanmaktadır. Ardından konunun önemine binaen çalışmanın literatürde nasıl bir konumda olacağı açıklanmaktadır. Birinci bölümde münker terimi ve onunla ilgili diğer kavramların detaylı bir şekilde analizi yapılmaktadır. İkinci bölümde ise münker ile mücadele etmenin hükmü ve hukukî çerçevesinin betimlemesi yapılmaktadır. Bu kapsamda öncelikle münkerle mücadele hakkındaki kadim ve çağdaş görüşlerin tespiti yapılarak mukayese imkanı sunulmaktadır. Münkerle mücadele hakkındaki kavramların analizi ve konunun hükmünün tespiti ile oluşturulan sağlam zemin üzerine son aşamada hukuki çerçevesi çizilmektedir. Bu noktada öncelikle bununla yükümlü olanlar tespit edilmekte, ardından münkerle mücadele yöntemleri detaylı bir şekilde analiz edilmektedir. Böylece günümüzde birey ve toplum olarak münker ile mücadele noktasında neler yapılabileceği, sorumlulukların neler olduğu fıkıh ilmi açısından ortaya konulmaktadır. Çağımızda bir yandan münker olarak değerlendirilen bazı meselelerde İslam adına fiilî müdahalede bulunulduğu görülmektedir. Diğer yandan İslamî değerlere açıkça yapılan saldırılar karşısında nasıl bir tavır gösterilmesi gerektiği hususunda kafa karışıklığı yaşanmaktadır. Meselenin fıkhî boyutu ile ilgili böyle bir boşluğun olması bu konuda akademik bir çalışmanın yapılmasının önemini ortaya koymaktadır."
