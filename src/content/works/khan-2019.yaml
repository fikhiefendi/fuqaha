abstract: "Bilindiği üzere katılım bankaları ve faizsiz finans kuruluşları, geleneksel bankacılığın uyguladığı faizli kredilere alternatif olarak murabaha işlemine başvurmaktadır. Katılım bankaları kuruldukları günden itibaren iç ve dış ticarette alabildiğine geniş bir çerçevede bu işlemi uygulamaktadır. Katılım bankalarının, gerek İslam ülkelerinde gerekse hariçteki diğer ülkelerde önemli bir halk desteğine kavuştukları gözlenmektedir. Birçok banka murabaha sisteminin -sahip olduğu esnek yapı ve şer'î ilkelere uygunluk sebebiyle- hem bankacılığın hem de müşteri kitlesinin ihtiyaçlarını karşıladığını düşünmektedir. Bankacılık sektörünü, ticari faaliyetlerde murabahayı tercihe sevkeden amil de budur. Bizi konuya araştırmaya sevkeden“murabahanın faizli kredilerden farklı olup olmadığı”hususudur. Bu soruya verilecek cevabın müsbet olması halinde murabahayı bankacılıktan ayıran temel hususların neler olduğu sorusunu cevaplamaya çalıştık. İşte elimizdeki çalışma bu soruların cevabını bulmaya yöneliktir. Çalışmamız bu güne kadar Arapça, İngilizce, Farsça ve Urduca konuya dair yapılmış çalışmaların objektif ve dakik bir biçimde icelenmesine dayanmaktadır. Mezhep ve fıkhî görüşlerin sunumunda, genel manadaki murabahanın şartlarında, murabahanın geçmişi ve çağımızdaki uygulama şekilleri hakkında ve klasik fıkıh kaynaklarında günümüz murabaha sistemine ilham kaynağı olabilecek açıklamaların aktarımında tüme varım (istikrâ) yöntemine başvurmaya çalıştık. Bunun yanısıra delillerin sunumunda ve murabaha-faizli kredi işlemlerinin mukayesesinde tahlili ve diyalektik bir yöntem takip etmeye çalıştık."
