abstract: "Fıkhın olgunlaşma sürecinde tabiîn âlimlerinin rolü büyüktür. Onlar İslam dinine ait tüm bilgileri sahabeden dikkatle almış, geliştirmiş ve tebe-i tabiîn'e nakletmişlerdir. Böylece Rasûlullâh (s.a.) ve sahabeden gelen tüm bilgilerin sağlam bir şekilde bir sonraki nesle intikalini sağlayarak İslam'a ait bilgilerin yazılı hale getirilmesinde büyük rolleri olmuş ve neticede dinimizin aslı, gelişim süreci zarar görmemiştir.Sahâbe ve Tabiîn döneminde kitap telif etme düşüncesi henüz gelişmemişti. Bu dönemlerde hafıza en önemli ilim aktarma aracıdır. Bir âlimin üstünlüğü onun ezberlediklerinin fazlalığı ve onları koruyabilmesi ile açığa çıkmaktadır. Bu bağlamda Katâde b. Diâme'nin önemi açıktır. Çünkü o, kendi döneminde bir âlimde olması gerekli önemli bir özellik olan güçlü hafızaya tam anlamıyla sahiptir.Bu çalışmada Katâde b. Diâme'nin hayatını, onun fıkha dair ulaştığı rivayetlerini, fıkhî görüşlerini derlemeye çalıştık. Böylelikle Katâde'ye ve onun fıkıh ilmindeki birikimine dikkat çekmek istedik."
