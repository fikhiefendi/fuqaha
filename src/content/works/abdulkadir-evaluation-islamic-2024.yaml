abstract: "İslami Bankacılık, finansal işlemler yaparken İslam hukuku ilkelerine bağlı kalan bir bankacılık sistemidir. İslami bankacılık sisteminin ana hedefi, bir yandan hem hane halkına hem de topluma fayda sağlayan finansal hizmetler sunarken aynı zamanda bir taraftan İslami ahlak kurallarına uymaktır. İslami bankacılık işlemleri, 2013 yılında Etiyopya'da pencere tabanlı faizsiz hizmetlerle başlarken 2020 yılında tam teşekküllü bankacılık hizmetleri haline gelmiştir. Bu çalışma, özellikle yeni kurulan İslami bankacılık sistemleri olmak üzere Etiyopya'da ortaya çıkan İslami bankacılık deneyimlerini ele almayı amaçlamaktadır. Bu çalışma aynı zamanda, söz konusu bankaların genel performansını, onların gelecek perspektifini ve karşılaştıkları önemli fırsatlar ve zorlukları ele alacaktır. Bu çalışmaya veri toplamak amacıyla Etiyopya'nın Jigjiga şehri sakinlerine, İslam Bankacılık alanında akadamisyenler ve uzmanların yanı sıra kamuoyundan oluşan bir çevrimçi anket dağıtıldı. Söz konusu ankete 98 kişi katılmıştır. Yapılan çalışmanın ana sonuçları, halkın yeni kurulan İslami banka hizmetlerine büyük büyük ölçüde duyduğunu ve bu bankaların ülkenin ekonomik kalkınmasında önemli rol oynayabildiğini göstermektedir. Araştırma sonuçları aynı zamanda, yeni kurulan İslami bankaların müşterilerine iyi hizmet sunduğunu ve ülkede finansal katılımı geliştirebileceklerini göstermektedir. Çalışmanın başka bir sonucu da bu bankaların şeffaflık eksikliği, kamu bilinci eksikliği, kalifiye eleman eksikliği ve düzenlemelere ilişkin zorluklar gibi konulara karşı mücadele ettiklerini ortaya koymaktadır. Araştırma sonuçları, Etiyopya'da İslami bankacılık sektörünün, özellikle de yeni kurulan bankaların, bazı zorluklarla karşılaşsalar da – ki bu da her yeni sektör için normaldir- şimdiye kadar genel olarak etkin bir performans gösterdiklerini ortaya koymaktadır. Böylece, Etiyopya'daki karar vericilerin ülkedeki finansal istikrara ve ekonomik refaha katkı sağlama potansiyeline sahip, yeni ortaya çıkan finansal sektörleri desteklemeleri gerektiği ortaya çıkmıştır."
