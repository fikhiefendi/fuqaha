abstract: "Yatırımcıların nasıl davrandıklarını tam olarak anlamadan piyasaların nasıl çalıştığını anlamak zordur. Etik ve dini taahhütler, sosyal, çevresel ve yönetişim konularının yatırım analizine entegrasyonu ile yatırımcıların ekonomik davranışları üzerinde büyük bir etki yaratabilir. Bu nedenle, bu çalışma, şeriat uyumlu bir yatırımın etik ve dini yatırımların bir alt kümesi olarak finansal olmayan yönünün yatırımcı davranışını ve sonuç olarak Malezya bağlamındaki finansal piyasaları nasıl etkileyebileceği sorusunu ele almaya çalışmaktadır. İlk olarak bu çalışma, 2000-2015 döneminde Şer'i uyumlu menkul kıymetler listesindeki değişikliklerin hisse senedi fiyatı ve işlem hacmi üzerindeki etkisini araştırdı. Çalışma, kısa ve uzun vadede Şer'i uyumlu hisse senedi listesi duyurusunun hisse senedi alım satım hacmi ve fiyatı üzerindeki etkilerini analiz etmek için olay çalışması metodolojisinin bir parçası olarak piyasa modelini kullanmaktadır. Bulgumuz, İslami kurumsal ve Müslüman bireysel yatırımcılarının uzun vadede halka yeni arz edilmemiş hisse senetlerinde talebin artırdığını ve anormal getiriler ve işlem hacminde kalıcı bir artışa neden olduğunu göstermektedir. Öte yandan, listeden çıkarılan hisse senetlerini satma baskısı negatif anormal getiri ve kısa vadede işlem hacminde artışa neden oluyor. Ancak, Malezya Borsası'nda halka arz sırasında düşük fiyatlandırma geniş çapta belgelenmiştir. Sonuç olarak, halka arz olmuş Şer'i uyumlu hisse senetlerinin önemli bir fiyat artışı söz konusudur ve ticaretin ilk günlerinde işlem hacmini azaldığı için Şer'i uyumluluğun finansal etkisini analiz etmek daha zordur. Bu bulgular, Şer'i uyumlu menkul kıymetlerin finansal olmayan yönünün dini bilinçli yatırımcıların davranışlarını etkilediğini ve Malezya Borsası'nda piyasa anormalliklerine yol açtığını göstermektedir. İkinci olarak bu çalışma Malezya'daki İslami ve konvansiyonel fonların akış-getiri ilişkisini analiz etmektedir. Çalışmamız İslami ve konvansiyonel fonlara para akışının etkenlerini analiz için random effect modelini kullanarak Panel Veri analizini benimsemiştir. Çalışma, İslami fonlara gelen para akışın, geleneksel fon akışlarına göre pozitif gecikmeli getirilere daha duyarlı olduğunu ortaya koymaktadır. Ortalama fon getirisinin negatif olduğu göz önüne alındığında, İslami fonlar hala sermaye girişlerinden yararlanırken, konvansiyonel fonlardan para çıkışları vardır. Daha sonra bu çalışma Ramazan ayının Malezya'daki İslami ve konvansiyonel fon akışı-performans ilişkisi üzerindeki etkisini inceledi. Ramazan ayında konvansiyonel fonların fon çıkışlarının artarken, İslami bir fonun içine veya dışına para akış yönünü etkilemediğini görüyoruz. Çalışma aynı zamanda farklı finansal getiri gruplarının para akışları üzerindeki etkisini inceliyor ve İslami fonların üst ve alt performanslarının geleneksel muadillerine göre daha büyük para akışları çektiği sonucuna varıyor. Bu bulgular, İslami fon yatırımcılarının, Şer'i uyumlu finansal varlıklara yatırım yapmaktan finansal olmayan fayda sağladıklarını göstermektedir. Bu nedenle, geleneksel fon yatırımcılarına kıyasla daha sadıktırlar. Üçüncü olarka bu çalışma analist öneri revizyonlarının etkisini Malezya Borsası'ndaki Şer'i uyumlu olan ve olmayan hisse senedi fiyatları üzerindeki incelemektedir. Çalışmamız 2005- 2016 dönemi boyunca analiz önerisi yükseltilmiş ve indirgenmiş hisse senetlerinin hem kısa hem de uzun vadeli performansını analiz etmek için olay çalışması metodolojisi ve piyasa modelini kullanmaktadır. Çalışmamız tuttan-alıma eklenen hisse senetlerinin pozitif anormal getirilere sahip olduğunu gösterirken tuttan-satışa ve alımdan-tuta revize edilen hisselerin kısa ve uzun vadede negatif anormal getirilere sahip olduğunu bulmuştur. Bu bulgu analistlerin tavsiye revizyonlarının değerli bilgiler taşıdığını göstermektedir. İkinci olarak, çalışmamız analistlerin önerilerinin finansal tablo duyuruları ile alakalı ve alakasız olmaksızın çeşitli zaman dilimlerinde fiyat tepkileri üzerinde yaptığı etkisini incelemiştir. Sonuç olarak finansal tablo duyurularının analistlerin tavsiye revizyonlarını tetikleyebildiğini gösteriyor çünkü yatırımcılar, analistlerin finansal tablo duyuruları ile alakalı olarak yapılan tavsiye revizyonlarının hisse fiyatlarında güçlü bir şekilde tepki vermesine sebep olduğunu bulduk. Son fakat en önemlisi, çalışmamız analistlerin öneri revizyonlarının Şer'i uyumlu olan ve olmayan hisse senedi performanslarındaki farkının göz ardı edilebilir seviyede olduğunu göstermektedir. Bu bulgu, analistlerin Şer'i uyumlu şirketlere yönelik öneri revizyonlarının, Şer'i uyumlu olmayan hisse senetleri için herhangi bir ek yatırım değerine sahip olmadığını göstermektedir. Geniş anlamda, bu tez, Şer'i uyumlu yatırımın finansal olmayan yönünün yatırımcıların davranışını nasıl etkilediğini ve Malezya finans piyasalarında piyasa anormalliklerine yol açtığını daha farklı açılardan göstermiştir. İslami finans kurumlarının müşterilerinin geleneksel muadillerinden farklı davrandıklarını, çünkü Şer'i uyumlu finansal varlıklara yatırım yapmaktan ek fayda elde ettiklerini gösteriyor. Son olarak tez, Şer'i uyumlululuğun finansal olmayan bir bilgi olmasına rağmen, İslami finans kurumlarına ve ürünlerine genellikle finansal değer katabileceği sonucuna varmaktadır."
