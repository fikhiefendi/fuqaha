abstract: "Şer'iyye sicilleri, Osmanlı Devleti'nin askeri, hukuki, iktisadi, dini ve idari müesseseleri gibi alanlarında önemli bilgiler ihtiva etmektedir. Tarihi araştırmalarda önemli bir yere sahip olan ve bölgenin toplumsal yaşantısı hakkında ilgili verileri içinde barındıran şer'iyye sicilleri bu sebeple birinci elden kaynaklar konumundadır. Şehir tarihçileri için önemli bir yere sahip olan şer'iyye sicillerinde, köy ve mahalle isimleri; ticarî, cezaî ve her türlü hukukî kararlar; halkın geçim tarzı, ekonomik ve sosyal yaşamı ile ilgili bütün ayrıntılar bu defterlerde geniş bir biçimde yer almaktadır. Transkripsiyon ve değerlendirmesi yapılan 182 Numaralı Besni Şer'iyye Sicili 120 sayfa olup (R.1317-1323 / M.1901-1907) yılları arasını kapsamaktadır. Ayrıca deftere başka bir defterden eklendiği düşünülen 30 Teşrin-i Sani 1337 (M. 30 Aralık 1921) tarihli bir de tereke belgesi yer almaktadır. Belgelerin geneli evlenme-boşanma, nafaka, miras, alacak-verecek, borç tahsili, haksız gasp, hırsızlık, mülk satışı gibi davalardan ve nikâh akdinden oluşmaktadır. Dolayısıyla 182 Numaralı Besni Şer'iyye Sicilinin transkripsiyonu ve değerlendirmesi ile Besni'nin (R.1317-1323 / M.1901- 1907) yılları arasındaki siyasi, sosyal, ekonomik, idari, mali ve hukuki durumuna ilişkin somut bilgilere ulaşılmıştır."
