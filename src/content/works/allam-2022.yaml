abstract: "Bu çalışma Günümüz Müslüman Devletlerinde Zekât Kurumunun Unsurlarını ele almıştır. Zekâtın niteliğini, meşruiyeti ve birey ve toplum için olan önemine; Zekât kurumunun niteliğine, önemine ve bağımsızlığına odaklanmıştır. Peygamber efendimiz (SAV) döneminden bu yana dört halife dönemi, Emevî, Abbâsî ve Osmanlı hilafetleri üzerinden İslam tarihindeki zekât kurumunu ele alıp günümüz İslam devletlerindeki bu Kurumunun gerçeğini incelenmiştir. Ve bu çalışmada günümüz İslam dünyasındaki herhangi bir devlet için zekât kurumunun ihtiyaç duyduğu Unsurları odaklı şekilde çalışılmıştır. Bu unsurların ilki, kurumun çalışmasını yöneten kanuni yasanın olmasıdır. Ardından muhasebe ve mali unsurlar sonra idari unsurlar ve son olarak kurumun medya Unsurları yer almaktadır. Çalışmada ortaya atılan konuları analiz ederek çalışmanın konusu ile ilgili birim ve parçaları takip ederek tümevarımsal ve betimsel metotlar kullanılmıştır. Çalışma ayrıca zekât kurumunun, görevini en iyi şekilde yerine getirebilmesi ve bulunması gereken unsurlara ulaşmak için bu bilgileri analiz etmek ve düzenlemek için analitik ve tümdengelimsel bir yaklaşım kullanılmıştır."
