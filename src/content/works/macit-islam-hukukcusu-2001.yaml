abstract: "Son dönem Osmanlı alim ve aydınlarından birisidir. Bir çok ilim dalında kendini yetiştirmiştir ve büyük bir ilmî birikime sahiptir. Hakkında çok çalışma yapılmıştır. Yapılan taramalarda onun İslam hukukçuluğu yönünü ortaya koyan kapsamlı bir çalışma olmadığı görülmüştür. Halbuki onun kendini yetiştirdiği ilim dallarından birisi de İslam hukuku sahasıdır. İslam hukukunu usûl, turu, tarih ve hikmet yönleriyle incelemiş, bu yönlerini ele alan kitaplar, makaleler yazmış ve bunları Darülfünunda ders olarak okutmuştur. Aynca İslam hukuku metodolojisinin Önemli bir dalım teşkil eden ve unutulmaya yüz tutmuş olan İJm-i Hilaf m Osmanlı medreselerinde okutulmasına ön ayak olmuştur. Bu çalışma Onun İslam hukukçuluğu kimliğini ortaya koymayı amaçlamaktadır. Çalışmamızda, İzmirli'nin yetişmesine katkı sağlamış olan ortam, aileden başlayarak ele alınmıştır. Hayatı, eserleri zikredildikten sonra özellikle fikhî eserleri üzerinde durulmuş, ilmî ve fikrî yapısı ortaya konulmaya çalışılmıştır. İslam hukukundaki yerini işlerken onun hem usûl-ü fıkıh, hem de turu fikıh yönleri incelenmiş, usûl ve turu ile ilgili bazı konulan değerlendirişi ele alınmıştır. izmirli'nin İslam hukukuyla ilgili yazdıkları incelenmiş, bu sahada geniş bir müktesebata sahip olduğu görülmüştür. Daha çok fıkıh usulüyle ilgili konulan ele aldığı tespit edilmiştir. Zira bu eserlerinin ve makalelerinin önemli bir kısmı fıkıh usulüyle ilgilidir. Ancak furu filanla ilgili konulan da yazmıştır. İslam hukukuyla ilgili eserlerini ve makalelerini kaleme alırken, başta Kur'an ve sünnet olmak üzere muteber fikıh kitaplarından istifâde eden İzmirli'nin son dönem Osmanlı fukahası arasında önemli bir yeri olduğunu söylemek gerekir."
