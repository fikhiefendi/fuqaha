abstract: "Çalışmamızda, günümüzde müntesibi kalmamakla birlikte, İslâm Hukuk tarihinde önemli bir yeri olan ve kendine özgü görüş ve kanaatleriyle yaşadığı dönemde mezhep kurmuş bir büyük İslâm âliminin hayatını ve ceza hukukuna dair görüşlerini incelemeye çalıştık.Süfyân-i Sevrî hicrî 97 yılında Kûfe'de doğmuş ve 163 yılında Basra'da vefat etmiştir. Daha küçük yaşlardan itibaren ilme olan düşkünlüğü annesinin dikkatini çekmiş ve annesinin teşvik ve telkinleriyle ilmî hayatı başlamıştır. Bundan sonra çeşitli İslâm beldelerine yolculuklar düzenlemiş ve her gittiği yerde oralardaki ilim halkalarına dâhil olmuştur. Kıvrak zekâ ve ilim hayatındaki bu yükseliş kısa zamanda onu insanlar nazarında saygın bir konuma yükseltmiştir. Halife Mansur zamanına kadar, Süfyân-i Sevrî devamlı ilimle meşgul olmuş, siyasî idare ile menasebeti olmamıştır. Ancak Mansur, ona kadılık teklif edince o, bu teklifi reddetmiş ve bunun sonucunda da siyasî idarenin takibe maruz kalmış ve nihâyet memleketi Kûfe'den kaçmak zorunda kalmıştır. Ekonomik durumu zaman zaman açlık seviyesine varacak kadar kötü olmasına rağmen halifelerin maddi yardımlarını kabul etmemiştir.Süfyân'ın ceza hukukuna dair görüşleri temelde, re'y ağırlıklı Irak ekolüyle paralellik göstermektedir. Ancak zaman zaman re'y ekolünün görüşlerine tezat hadis ağırlıklı Hicaz ekolünün görüşlerine benzer kanaatleri de bulunmaktadır. Bunun başlıca sebebi ise her iki merkezde de çok uzun süre yaşaması olarak gösterilebilir."
