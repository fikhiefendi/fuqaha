abstract: "İslâm hukukunda Hırâbe Suçunun Mahiyeti ve Hukukî Sonuçları ile ilgili bu çalışma bir giriş, iki bölüm ve sonuç kısmından meydana gelmektedir.Giriş kısmında ?Genel Bilgiler? başlığı altında konunun önemi, sınırlandırılması, sunulması ve kullanılan kaynakların değerlendirilmesi hakkında genel bilgiler verilmiştir.Birinci bölümde hırâbe suçunun mahiyeti, hukuki dayanağı ve hırâbe suçunun unsurları; hırâbe suçunun gerçekleşmesi için aranan şartlar, yolları kesenlere ait, yolları kesilenlere ait, mala ait ve yol kesme olayının geçtiği yere ait şartlar açıklanmıştır.İkinci bölümde ise muhâribe uygulanacak ceza ve cezada göz önünde bulundurulacak kriterler açıklandıktan sonra hırâbe suçunun ispat vasıtaları ve hırâbe suçunun cezasını düşüren durumlar değerlendirilmiştir.Sonuç bölümünde ise genel bir değerlendirme yapılarak ulaşılan netice belirtilmiştir."
