abstract: "“Son dönem İslam Hukukçularından Mustafa Zerkā'nın Fıkhî Tercihleri”adlı çalışmamız, Hanefî fakihlerden Zerkā'nın hayatını, ilmî kişiliğini, fetva yöntemini ve fetva alanındaki tercihlerini analiz ederek değerlendirmeyi hedeflemektedir. Zerkā fikir, yöntem, fetva ve tercihleriyle son dönem fakihleri ve ilim dünyası üzerinde önemli bir etki bırakan muasır İslam hukukçularındandır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde Mustafa Zerkā'nın hayatı, ilmi kişiliği ve fetva yöntemi ele alınmış; ikinci bölümde ibadetler alanındaki tercihleri, son bölümde ise aile ve borçlar hukuku alanındaki tercihleri ele alınmıştır. Her bir konudaki tercihi diğer mezheplerin konuya yaklaşımı çerçevesinde ele alınarak delil açısından analiz edilmiş ve Zerkā'nın tercihi çağdaş İslam Hukukçularının konuyla ilgili tercihleriyle de mukayese edilmiştir. Fetva alanında ve fıkhi tercihlerinde genellikle dört mezhebin sınırları içinde kalmıştır. Fetvâ alanındaki tercihleri geleneksel anlayış ile modern anlayışı mezcetme yönüyle temayüz ettiğinden çağdaşlarının dikkatini çekmiş, bu konuda kendisini savunanların yanında eleştirenler de olmuştur. Mustafa Zerkā kendisine sorulan sorulara klasik fıkıh mirasında ikna edici bir cevap bulması halinde bu cevabı aktarmakla yetinmiştir. Kendisi Hanefî mezhebine mensup olmakla birlikte mezhep taassubundan uzak durmuş ve ihtiyaca cevap verebilecek diğer mezhep görüşlerinden de yararlanmıştır. Mezhep içtihatları içinde bir cevap bulamadığında yeni içtihatlarıyla meseleyi çözmeye çalışmıştır. Zerkā tercih ve içtihatlarını temellendirirken toplumun maslahatını, meşakkati giderme, kolaylık ilkesi, küllî kâideler ve istişâre gibi yöntemleri takib etmiştir."
