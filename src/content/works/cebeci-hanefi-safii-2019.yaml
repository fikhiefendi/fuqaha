abstract: "Çalışmamız İmam Suyûtî ve İbn Nuceym'in el-Eşbâh ve'n-Nezâir adlı eserlerinde Hanefî ve Şâfiî mezheplerinin ittifak ettikleri küllî kâidelerin tespiti, açıklanmaları ve furû'' fıkha yansımalarını örneklerle ortaya koymayı hedeflemektedir. Tezimiz iki ana bölümden oluşmaktadır. Birinci bölümde, İmam Suyûtî ve İbn Nuceym'in hayatları, eserleri ve özel olarak da çalışmamızın ana kaynakları olan el-Eşbâh ve'n-Nezâir adlı eserlerinin tanıtımları, özellikleri ve karşılaştırmaları ele alınmıştır. İkinci bölümü ise iki kısma ayırdık. Birinci kısımda küllî kâide ve ilgili kavramların açıklanması, küllî kâidenin kaynakları, tedvin, kavramlaşma ve gelişme süreçleri, özellikleri, hüccet değerleri ve faydaları üzerinde durulmuştur. İkinci kısımda ise öncelikle, başta Hanefî ve Şâfiî mezhepleri olmak üzere bütün fıkıh mezheplerinin ittifak ettikleri beş ana küllî kâideyi, ardından özel olarak Hanefî ve Şâfiî mezheplerinin ittifak ettikleri küllî kâideleri tespit edip açıklamaya çalıştık. Tespit ettiğimiz kâidelerde öncelikle kâidenin farklı versiyonu varsa bunu vermeye çalıştık. Ayrıca bu kâidelerden Mecelle'de kanunlaştırılmış olanları varsa buna dikkat çektik. Ardında kâidenin açıklamasını, varsa kaynaklarını, furû'' fıkha yansımalarını ve de istisnâi örneklerini vermeye özen gösterdik. Kâidenin furû'' fıkha yansıması hususunda her iki mezhep, ilgili meselede müttefik iseler aynı örneği verdik. Ne var ki ihtilaf söz konusu ise farklı örnekler verdik. Çalışmamızı, başta Hanefî ve Şâfiî mezheplerinin ittifak ettiği küllî kâidelerin yanı sıra bütün mezheplerin ittifak etmiş olduğu beş ana küllî kâideyi mukâyeseli olarak ortaya koyduğu için“Mukâyeseli Küllî Kâide”; aynı anda küllî kâide literatürünü hemen hemen her yönüyle ele aldığı için de,“Küllî Kâide Literatürü”çalışması olarak nitelemek mümkündür."
