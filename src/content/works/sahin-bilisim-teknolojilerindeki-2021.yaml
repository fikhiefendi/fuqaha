abstract: "Araştırmanın amacı, bilişim teknolojilerindeki gelişmelerin katılım bankacılığı bankacılık hizmetlerine etkisiyle ilgili çalışan görüşlerini tespit etmektir. Bu amaç doğrultusunda araştırmada nitel yöntem kullanılmıştır. Nitel yöntemler arasında olan görüşme tekniği, katılım bankaları banka çalışanlarına uygulanmıştır. Örneklemin belirlenmesinde tesadüfi örneklem yöntemi kullanılmıştır. Katılım bankalarında çalışmakta olan 30 gönüllü katılımcı, araştırmanın örneklemini oluşturmaktadır. Katılımcılara uygulanan yarı yapılandırılmış görüşme sorularının analizinde içerik analizi kullanılmış olup katılımcı cevapları çözümlenmiştir. Araştırmada, katılım bankalarının bilişim teknolojilerinden yararlanma durumu, yeterli olmakla beraber geliştirilmeye ihtiyaç duyulduğu sonucuna ulaşılmıştır. Banka çalışanlarının bilişim teknolojilerini kullanırken kendilerini yeterli gördükleri ancak bazı konularda eğitim gereksinimleri bulunduğu belirlenmiştir. Katılım bankalarının kuruluş ilkelerinin herhangi bir değişikliğe ya da uyarlamaya gidilmeden uygulandığı sonucu tespit edilmiştir. Araştırmanın sonucuna göre katılım bankalarının teknolojik yenilere uyum sürecini hızlandırması, bu süreç içerisinde ihtiyaç duyulan eğitim desteğinin ve bilişim teknolojilerinde alt yapı güçlendirmesinin yapılması gerektiği öneri olarak sunulmuştur."
