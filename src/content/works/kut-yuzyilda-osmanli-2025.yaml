abstract: "Bu tezde şeyhülislamlığın genel olarak tarihi, siyasi ve teorik kökenleri ile birlikte 16. yüzyıl özelinde şeyhülislamlık makamının kurumsallaşması, şeriat ve siyaset eksenindeki tezahürü incelenmiştir. Şeyhülislamlar Osmanlı devlet teşkilatı içerisinde fetva verme vazifesini üstlenerek her bir dönemin şartları çerçevesinde özellikle 16. yüzyıldan itibaren etkin rol oynamışlardır. Bu doğrultuda şeyhülislam fetvasının siyasi ve tarihi alandaki temel özellikleri ile mezhep bağlamında fetvaya etki eden unsurlar açıklanmış, padişah ve şeyhülislam ilişkileri irdelenerek Yavuz Sultan Selim ve Kanuni Sultan Süleyman dönemi özelinde sosyo-siyasi ve fıkhi-içtihadi açılardan seçme fetva örnekleri ile 16. yüzyılda Osmanlı devlet teşkilatındaki şeyhülislamın konumu yansıtılmaya çalışılmıştır."
