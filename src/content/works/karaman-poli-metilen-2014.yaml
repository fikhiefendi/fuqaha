abstract: "Bu çalışmada camsı karbon elektrot metilen mavisinin elektropolimerizasyonu ile modifiye edilmiştir. Elektropolimerizasyon ribavirin içeren ortamda yapılarak ribavirin molekülünün iletken polimer film içerisinde moleküler baskılanması yapılmıştır. Poli(Metilen mavisi) ve ribavirin baskılanmış poli(Metilen mavisi) modifiye elektrotların elektrokimyasal özellikleri dönüşümlü voltametri, elektrokimyasal empedans spektroskopisi ve potansiyometri teknikleri kullanılarak incelenmiştir. Ribavirin çözeltilerinde ribavirin baskılanmış modifiye elektrodun empedans spektrumunun ve potansiyelinin değiştiği belirlenmiştir. Modifiye elektrodun ribavirine karşı potansiyometrik cevabı doğrusal olup sensör olarak kullanılabileceği gösterilmiştir."
