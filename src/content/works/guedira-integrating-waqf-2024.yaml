abstract: "Osmanlı döneminde vakıfların başarısı, devletin bu kurumu kamu mallarının sağlanmasına yönelik politika stratejilerine ustaca entegre etmesiyle yakından ilişkiliydi. Osmanlı devletinin çöküşünün ardından çok sayıda vakıf kurumu özelleştirme sürecine girmiş, bu da vakıflar ile çağdaş kamu politikası geliştirme stratejileri arasında uzun süreli bir kopukluğa neden olmuştur. Mevcut literatür, Osmanlı İmparatorluğu'nda vakıfların rolünü yeniden ele almış olsa da, o dönemdeki en iyi vakıf uygulamalarının modern Türkiye'de kamu malları ve hizmetleri sağlamaya yönelik politika stratejileriyle entegrasyonunu ağırlıklı olarak göz ardı etmiştir. Bu çalışma, literatürün eleştirel bir taraması, yayınlanmış belgelerin içerik analizi ve alandaki sekiz uzmanlarla yarı yapılandırılmış görüşmeler de dahil olmak üzere nitel araştırma yöntemlerini kullanarak bu araştırma boşluğunu ele almayı amaçlamaktadır. Çalışmanın bulguları ve analizi, Türkiye'nin kamu mal ve hizmetlerini sunarken karşılaştığı zorluklara ışık tutmaktadır. Ayrıca araştırma, Osmanlıların vakıfları kamu mallarına yönelik politika stratejileriyle nasıl başarılı bir şekilde bütünleştirdiğini incelemektedir. Çalışma, bu Osmanlı vakıf uygulamalarının modern Türkiye için sonuçlarını araştırmakta ve kamu mallarının güvence altına alınmasındaki mevcut sorunları ve zorlukları ele almak için içgörüler sunmaktadır. Nihayetinde, araştırma sonuçlarının, kamu mallarının sağlanması alanında politika yapıcılar tarafından dikkate alınması gereken önemli unsurlar sunması beklenmektedir."
