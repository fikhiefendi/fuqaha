abstract: "Bu çalışma, Fahreddin er-Râzî'nin bilgi teorisi çerçevesinde mütevâtir haber anlayışını konu edinmektedir. Râzî'nin kelâm, mantık ve fıkıh usûlü eserlerinde yer alan tartışmalar temel alınarak, onun mütevâtir bilgisinin değeri, mahiyeti, niteliği; mütevâtir haberin şartları ve karînelerle ilişkisine dair görüşleri incelenmiştir. Araştırmada, el-Mahsûl ve Nihâyetü'l-Ukûl başta olmak üzere Râzî'nin çeşitli ilimlere dair eserleri esas alınmış; ayrıca Cessâs, Bâkıllânî, Kadı Abdülcebbâr, Ebü'l-Hüseyin el-Basrî, Cüveynî ve Gazzâlî gibi önceki kelamcı usûlcülerin yaklaşımlarıyla karşılaştırmalı bir analiz yapılmıştır. Râzî'ye göre mütevâtir bilgisiyle ilgili en fazla üzerinde durulması gereken husus, onun nazarî çıkarıma dayanmayan, aracısız olarak meydana gelen zorunlu bir bilgi türü olduğudur. Râzî, mütevâtir haberin nesnel zeminini, haberin kesin bilgi meydana getirme sürecindeki değişmezlik ve haberi işiten kişide meydana gelen mütevâtir bilgisinin kendisinde arayan Bâkıllânî ve Kadı Abdülcebbâr'dan ayrılarak bu nesnel zemini âdetin sürekli ve düzenli işleyişi ilkesine bağlar. Bu anlayışıyla Cessâs'a yakın duran Râzî, mütevâtir haberin kesinliğini tecrübe bilgisiyle temellendirmeme ve zorunlu bilginin herhangi bir öncüle dayanmaması gerektiği vurgusuyla ondan farklılaşır. Mütevâtir bilgisinin mahiyeti, mütevâtir haberin karînelerle ilişkisi vb. birçok meselede Cüveynî-Gazzâlî çizgisini takip eden Râzî, mütevâtir bilgisinin niteliği meselesinde onlardan ayrılır. Tahkik metodunu kullanması ise meseleleri ele alış tarzını ve odak noktasını önceki âlimlerden belirgin biçimde farklı kılar. Çalışma, Râzî'nin mütevâtir haber teorisini, hem klasik usûl geleneği içerisindeki sürekliliği hem de özgün katkıları bakımından ortaya koymayı amaçlamaktadır. Bu bağlamda Râzî'nin epistemolojisinde mütevâtir bilgisinin niteliği, bu niteliğin mahiyeti, bu konularda benimsenen yaklaşıma bağlı olarak mütevâtir haberin şartları, karînelerle ilişkisi gibi meselelerdeki görüşleri tahlil edilmiştir."
