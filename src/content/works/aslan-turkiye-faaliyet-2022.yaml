abstract: "Dünya üzerindeki birçok ülkede de hızla gelişmekte olan katılım bankacılığı, ülkemizde büyümesine devam etmektedir. Son yıllarda devletin de katılım bankaları kurarak sektöre girmesi neticesinde sektöre olan güven artmış ve bu durum da büyümenin hızlanmasını sağlamıştır. Bu kuruluşlar faizi finansın dışında tutarak islami usullere göre bankacılık yapmaya çalışmaktadırlar. Bu sisteme ihtiyaç duyulmasına ilişkin birçok neden olmakla birlikte öncelikli olarak bahsedilebilecek husus, insanların faize karşı olan hassasiyetleri ve birikimlerini faiz ile değerlendirmek istememeleridir. Her sektörde olduğu gibi bankacılık sektöründe de yoğun rekabet ortamında üstünlük sağlayabilmek, fark oluşturabilmek için bilgi ve teknolojinin en iyi şekilde kullanılmasının yanı sıra hizmet kalitesini artırmak ve müşterilerin memnuniyetini sağlamak önem arz etmektedir. Bu çalışmada, katılım bankalarının müşterilerinin hizmet kalitesi algılarının ve memnuniyet seviyelerinin müşterilerin demografik özelliklerine göre farklılık gösterip göstermediğinin belirlenmesi amaçlanmıştır. Çalışma neticesinde katılım bankası müşterilerinin hizmet kalitesi algılarının ve memnuniyetlerinin bazı demografik özelliklerdeki değişimlere paralel olarak farklılaştığı sonucuna ulaşılmıştır."
