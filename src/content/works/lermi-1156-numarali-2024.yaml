abstract: "Şer'iyye Sicilleri, Osmanlı devleti döneminde kadılar tarafından tutulan hukukî ve idarî hususlarla ilgili kayıt defterleridir. Büyük bir kısmı kadıların görmüş olduğu dava kayıtlarını da içeren bu defterler, Osmanlı toplumunun gündelik yaşamına, sosyal ve ekonomik yapısına, hukuk sistemine dair önemli bilgiler içerirler. Bu bağlamda Düzce Şer'iyye Sicilleri de yerel tarih çalışmaları için önemli katkılar sunma potansiyeline sahiptirler. Bugüne kadar yeterli derecede ilgiye mazhar olmamış olan 33 adet Düzce Şer'iyye Sicili'nden sadece 1153 ve 1165 numaralı Siciller yüksek lisans tezi olarak incelenmiştir. Bu çalışmada, Kastamonu vilayeti Bolu sancağı Düzce kazasında vazife yapan kadı nâibi tarafından tutulan 1313-1316/1895-1898 yıllarıyla ilgili 1156 numaralı Şer'iyye Sicili ele alınmış, dönemin Düzce'sine dair vermiş olduğu bilgiler tespit edilmiştir. 1156 numaralı Sicil içerisinde emlak, arazi, miras, tereke, nafaka, mehir, nikâh, boşanma, alacak ve borç gibi konularda açılmış ya da açılacak davalarda vekil/avukat tayinine dair 105 kayıt yer almaktadır. Bu kayıtlar içinde yer alan malumat üzerinden 1895-1898 Düzce'sinin mahalleleri, köyleri ve idarî yapısı, şahıslar, isimler ve ünvanlar bağlamında dinî ve kültürel durumu ve Düzce'ye yapılan göçlerin menşei ve Düzce'deki yerleşim bilimleri ale alınmaya çalışılmıştır. Düzce Şer'iyye Sicillerinin içeriğine ve konularına dair bir tahminde bulunmaya imkân veren bu çalışma, aynı zamanda gelecek çalışmalar için de bir rehber olma iddiasındadır."
