abstract: "Fıkıh mezhepleri arasındaki ihtilafları konu edinen ilim dalına ilm-i hilâf denilmektedir. Hilâf ilmi, fıkıh literatürünün çokça eseri bünyesinde barındıran alt dallarından biridir. İlgili eserler hilâfiyât literatürünü oluşturma noktasında ortaklık barındırırken muhteva ve metot bakımından birbirlerinden ayrışabilmektedir. Bu ayrışmalar kimi zaman eserin kaleme alınma gerekçesi, kimi zaman müellifin mensup olduğu mezhep, kimi zaman müellifin yaşadığı ve birikimini aktardığı coğrafya gibi sebeplerden kaynaklanmaktadır. Hilâf ilmine dair eserler incelendiğinde farklı mezheplere mensup olmalarına rağmen benzer üslupla kitap kaleme alan âlimler tespit edilebileceği gibi, aynı mezhebe mensup olup farklılaşan eserler telif eden âlimlerin olduğu da görülmektedir. Nitekim bu tezin konusu Hanefî mezhebinin çağdaş iki fakîhi Ebû Zeyd ed-Debûsî (v. 430/1039) ve Ebü'l-Hüseyn el-Kudûrî'nin (v.428/1037) el-Esrâr ve et-Tecrîd adlı eserlerindeki muhteva ve metot farklılığıdır. Bu çalışmanın konusunu teşkil eden iki eserin hacmî büyüklükleri sebebiyle sınırlandırılması elzem olup, bu bağlamda ibadet bahisleri arasından zekât bahsi seçilmiştir. Çalışma kapsamında el-Esrâr ve et-Tecrîd'in yazılış amaçları, tasnifleri, zekât bölümlerinin muhtevaları, metotları ve kaynakları tespit edilerek mukayese edilmiştir. Bu mukayese sonucunda eserlerin türleri ve yazılış amaçları aynı olsa da eserler arasında muhteva, metot ve kaynak bakımından kayda değer bir farklılık olduğu görülmüştür."
