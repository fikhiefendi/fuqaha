abstract: "Bu çalışma temel olarak imtiyazlı Yap-İşlet-Devret projeleri ve sukuk yöntemi ile ilgili olup, uygulanmaya başlandığı dönem XIX. yüzyıl ortalarına kadar uzanan Yap-İşlet-Devret projeleri ve bunların finansman yöntemleri incelenmiş, bu inceleme yapılırken tarihsel süreç içerisindeki gelişime ve hem eski dönemlerdeki hem de günümüz dünyasındaki farklı uygulama örneklerine yer verilmiştir. Ayrıca XX. yüzyıl sonlarında ortaya çıkan ve sukuk olarak adlandırılan finansman uygulamaları araştırılmış ve bunların Yap-İşlet-Devret projelerinde ve de özellikle kamusal projelerde birlikte uygulanma olanakları ve bunun sağlayabileceği avantajlar üzerinde durulmuştur."
