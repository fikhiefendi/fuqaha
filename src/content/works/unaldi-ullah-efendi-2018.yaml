abstract: "Sun'ullah Efendi 960/1553 yılında İstanbulda doğmuştur. Babası Kanuni Sultan Süleyman dönemi kazaskerlerinden İskilipli Molla Cafer Çelebi'dir. Müderrislik ve kadılık yapan Sun'ullah Efendi 1008/1599 senesinde şeyhülislamlığa başlamıştır. Görevinin ilk iki dönemi III. Mehmed, üçüncü ve dördüncü dönemi ise I. Ahmed devrine denk gelmektedir. Çeşitli sebeplerle dört defa azledilerek tekraren göreve getirilmesiyle tarihe geçmiştir. Dördüncü ve son azlinden sonra inzivaya çekilmiş ve 1020/1611 yılında hacca gitmiştir. Hacc dönüşünden kısa bir süre sonra 1021/1612 senesinde İstanbul'da vefat etmiştir. Eserimiz Fetâvâ-yı Sun'ullah Efendi de 16. yüzyıla ait bir fetva mecmuasıdır. Mecmuada Sun'ullah Efendi'ye arz edilen ve onun tarafından cevaplanan fetvalar derlenmiştir. Eserin farklı yerlerde nüshaları mevcuttur ancak bizim esas aldığımız nüsha Süleymaniye Kütüphanesi'nde bulunan nüshadır. Eser içerisindeki fetvalar konusuna göre farklı bablara ayrılmıştır. Babların sistematiği klasik fıkıh sistematiğine uygundur. Kitabu't-tahâre ile başlayıp Kitabu'l-vesâyâ ile son bulmaktadır. Sun'ullah Efendi sorulara genellikle kısa cevaplar vermiştir. Eserdeki cevapların büyük bir kısmını tek kelimelik cevaplar oluşturmaktadır. Gerekli gördüğü yerlerde ise bazen uzun bazen kısa açıklamalar yapmıştır. Eserde nakil yoktur ancak Sun'ullah Efendi'nin nadiren de olsa alim veya mezhep imamlarına atıfta bulunduğunu söylemek mümkündür. Eserde Sun'ullah Efendi genel olarak net cevaplar vermiştir. Farklı görüşlere atıfla fetva verdiğinde ise genellikle tercihini belli eden ibareler kullanmıştır. Tercihte bulunmadığında ise meseleyi bazen hakimin bazen de sultanın takdirine bırakmıştır. Mecmuamızda Sun'ullah Efendi'ye ait 1017 fetva bulunmaktadır. Toplamda 79 varaktan oluşan eserimizde Sun'ullah Efendi'nin fetvaları 76. varakta son bulmaktadır. Diğer varaklarda ise mârûzât bölümü mevcuttur."
