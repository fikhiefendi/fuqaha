abstract: "Tezin araştırma konusu, Türk Borçlar Kanunu'nun 116. maddesinde düzenlenen, yardımcı kişilerin fiillerinden sorumluluk kurumuna ilişkindir. Tez kapsamında, bu sorumluluğun ve sorumsuzluk anlaşmalarının şartları ile, tartışmalı hususlar ele alınacaktır. Kaynak İsviçre Borçlar Kanunu (özellikle md. 101“Haftung für Hilfspersonen”) ve Alman Medeni Kanunu (özellikle paragraf 278“Verantwortlichkeit des Schuldners für Dritte”) ile, tartışmalı hususlarda doktrin görüşleri ve Yargı kararları incelenecektir. Roma Hukuku ve buna bağlı olan kölelik gibi kavramlardan, geleceğe dair Yapay Zeka ve Robotlar'a kadar, geniş bir perspektifte inceleme yapılacaktır. Gerekli noktalarda, İsviçre ve Almanya başta olmak üzere Avusturya, İtalya, Fransa, Portekiz, Hollanda gibi çeşitli ülke kanunları karşılaştırılacak ve hatta Roma hukuku metinleri, maximleri, UNIDROIT/PICC-DCFR-PECL-CISG-CESL gibi uluslararası çalışmalara ve Mecelle gibi kaynaklara da atıflar yapılacaktır. Özellikle çok sayıda ve özgün örnek verilecektir."
