abstract: "İsmâil b. Sinân (ö. 1048/1638) İstanbul'da müderrislik ve Sivas'ta müftülük yapmış, Mültekâ'ya Ferâid isminde şerh yazmış bir alimdir. Ferâid, Mültekâ'nın ibarelerini ve kullanımı yaygın olmayan kelimelerini açıklamakla birlikte Halebî'nin tercihlerinin delillerini açıklamıştır. Bununla birlikte bazen kendisi tercihte bulunmuş bazen de Mültekâ'nın metnini eleştirmiştir. Ferâid'in bir diğer önemli yönü ise, bir ibarenin ya da hükmün açıklanması için birkaç eserden aldığı pasajları kompoze etme başarısıdır. Bu özellikleri sebebiyle, hacimli bir şerh olan Ferâid'in, Mültekâ'nın önemli şerhlerinden biri olduğu söylenebilir. Bu tezde öncelikle Halebî'nin ve İsmâil b. Sinân'ın hayatı ve eserleri incelenip, Mültekâ ve Ferâidu Mülteka'l-ebhur'un müellife aidiyeti, yazılış sırası ve tarihi, yazılış nedeni, muhtevası, bazı imlâ özellikleri ve kullandığı kısaltmalar, önemi, konuların işleniş tarzı ve sistematiği, kaynakları, fıkıh literatüründeki yeri, Ferâid'de kendisinden istifade edilen kaynaklarla Ferâid'den sonraki kitaplarda Ferâid'e yapılan atıflar tespit edilerek incelenmeye çalışılmıştır. İsmâil b. Sinân'ın Mültekâ'nın tercihlerininin dayandığı delilleri açıklarken izlediği yöntem ortaya koyulmaya çalışılmıştır. Ferâid'in Hanefî kaynakları kullanmasının yanında diğer mezheplere atıfların çok olması sebebiyle bu atıflardan örnekler verilerek incelenmiştir. Ferâid'deki küllî kâideler tespit edilerek bir kısmı örneklerle incelenmiştir. Ferâid nüshaları incelenerek tahkikte esas alınan nüshalar ve tahkikte izlenilen metod açıklanmıştır. Son olarak Ferâid'in Kitâbu't-tahâre ile Kitâbu'l-i'tâk arası tahkikli metni oluşturulmuştur. Anahtar Kelimeler: Fıkıh, Halebî, Mültekâ, Sivasî, Ferâid."
