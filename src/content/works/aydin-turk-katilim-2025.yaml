abstract: "Bankalar, finansal sistemin etkin bir şekilde işlemesinde ve sürdürülebilir bir ekonomik modelin oluşturulmasında hayati bir rol oynamakta, bu da performanslarının analitik yöntemler kullanılarak sistematik bir şekilde değerlendirilmesini gerektirmektedir. Bu araştırmada Türk katılım bankacılığı sektörünün performansının etkinlik ve verimlilik göstergelerine dayalı olarak analiz edilmesi amaçlanmıştır. Analiz için 10 değerlendirme kriteri belirlenmiştir. Bu kriterlerden beşi etkinlik performansını kalan beşi ise verimlilik performansını ölçmeye yöneliktir. Analiz aşamasında kriter ağırlıkları belirlemek ve alternatif yılları değerlendirmek için hibrit bir karar verme aracı önerilmiştir. Önerilen hibrit bir karar verme çerçevesi LOgarithmic Percentage Change-driven Objective Weighting (LOPCOW), Modified Standard Deviation (MSD) ve Measurement of alternatives and ranking according to COmpromise solution (MARCOS) algoritmalarını içermektedir. Önerilen karar çerçevesinin uygulamasının ilk aşamasında LOPCOW ve MSD metotları kullanılarak verimlilik ve etkinlik göstergelerinin objektif ağırlık değerleri hesaplanmıştır. İkinci aşamada ise MARCOS metodu kullanılarak Türk katılım bankacılığı endüstrisinin son 10 yıllık performansı sıralanmıştır. LOPCOW ve MSD tekniklerinin entegre edilmesi ile ulaşılan ağırlıklandırma sonuçları 2015-2024 dönemi için Türk katılım bankacılığı sektörünün etkinlik ve verimlilik performansı üzerinde etkisi en fazla olan üç kriterin sırasıyla brüt takipteki alacakların toplam nakdi kredilere oranı, dönem net kârı ya da zararının ortalama özkaynaklara oranı ve dönem net kârı ya da zararının ortalama toplam aktiflere oranı olduğunu ortaya koymaktadır. MARCOS sıralama sonuçları ise Türk katılım bankacılığı sektörünün etkinlik ve verimlilik düzeyi açısından en başarılı olduğu yılın 2023 olduğunu göstermektedir. Elde edilen sıralama sonuçlarına göre genel olarak katılım bankacılığını sektörünün etkinlik ve verimlilik performansının yıllar itibariyle artma eğiliminde olduğunu göstermektedir"
