abstract: "Kentsel toprakta malikin hiçbir çabası olmadan meydana gelen ve yalnızca kamuya ve topluma izafe edilebilecek değer artışlarını ifade eden kentsel toprak rantının doğurduğu zararların tespit edilmesi, bu zararları gidermek için vergi türlerinin rantları vergilemede ne denli etkili olabileceğinin tartışılması ve kentsel toprak rantının vergilendirilmesinin iktisadi etkilerinin ortaya konulması amaçlarıyla –Türkiye ekseninde- ele alınan bu çalışma, rantların kamuya kazandırılması sorununa yönelik bir çözüm getirmeye çalışmaktadır. Bu kapsamda rantların; kaynakların üretken olmayan sektörlere akmasına, balon ekonomilerinin oluşmasına, kamu hizmetlerinin maliyetlerinin artmasına, dar gelirlilerin konaklama maliyetlerinin artmasına, güçlü bir rantiyer sınıfın oluşmasına ve doğal çevrede tahribata neden olabileceği ancak ideal bir rant vergisiyle bu sayılan hususların bertaraf edilebileceği anlaşılmaktadır. Ayrıca, rantların vergilendirilmesi, bahsi geçen olumsuzlukları yok etmenin yanında kamuya gelir sağlama, iktisadi büyümeye etki etme, gelir dağılımında adaleti sağlama ve toprak piyasasındaki spekülasyon/enflasyon sorunlarını azaltma yönünde de katkı sağlayacaktır."
