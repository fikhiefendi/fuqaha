abstract: "II. A ÖZET YÜKSEK LİSANS TEZİ İSLÂM HUKUKUNA GÖRE BORÇLUNUN SORUMLULUĞU Mustafa BİLMİŞ Danışman : Prof. Dr. Mustafa BAKTIR 1999-Sayfa: 121 Jüri: Prof. Dr. Mustafa BAKTUl Bu tezin konusu“İslam Hukukuna Göre Borçlunun Sorumluluğu”dur. Tez giriş ve iki bölümden oluşmaktadır. Girişte, borç ve sorumluluk arasındaki münasebetin tarihî sürecini ve Hammurabi Kanunu, Roma Hukuku, Cahiliyye Devrinde ve Türk Hukuku'na göre borçlunun sorumluluğunu inceledik. Birinci bölümde“borç”,“borçlu”ve“sorumluluk”kavramlarını ele aldık.“Sorumluluk kavramının”iki anlamını tesbit ettik. İkinci bölümde İslam Hukukuna göre borçlunun sorumluluğunu araştırmaya çalıştık. Sonuç olarak İslam hukukunda, borçlunun sorumluluğunun malvarlığı ile olduğunu ve ödeme zamanına göre uygun tedbirlerin alınması gerektiğini müşahede ettik."
