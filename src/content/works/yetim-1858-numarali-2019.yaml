abstract: "Bu çalışmada, 1858 Numaralı Trabzon Şer῾iyye Sicili'nin transkripsiyon ve değerlendirilmesi yapılarak genelde Osmanlı Tarihi ve özelde Trabzon Tarihi çalışmalarına katkı sağlamak amaçlanmıştır. Çalışmanın ana konusunu meydana getiren sicil defteri H. 1102-1104/ M. 1691- 1693 yılları arasındaki kayıtlardan oluşmaktadır. Bu kayıtlar sosyal, ekonomik, kültürel, iktisadi ve hukuki açılardan bilgiler vermektedir.“1858 Numaralı Trabzon Şer῾iyye Sicili'nin Transkripsiyon ve Değerlendirilmesi (H. 1102- 1104/ M. 1691-1693)”adlı bu çalışma iki bölümden oluşmaktadır. Giriş bölümünde tezin amacı ve yöntemi kısaca belirtilmiştir. Daha sonra Trabzon Tarihi ve defterin kayıt altına alındığı yıllardaki Osmanlı Tarihi hakkında bilgi verilmiştir. Birinci bölümde Trabzon Şer῾iyye Sicili kullanılarak yapılan çalışmaların detaylı bir listesi bulunmaktadır. Bu kısımda Trabzon kadı sicilleri kullanılarak yazılan kitap, makale ve doktora tezlerinin isimleri ile yüksek lisans tez çalışmaları belirtilmiştir. İkinci bölüm ise üç ana başlıktan oluşmaktadır. Öncelikle sicilin genel özellikleri hakkında bilgi verilmiştir. Daha sonra defter içerisinde bulunan kayıtlar konularına göre tasnif edilmiş ve tek tek değerlendirilmiştir. Son olarak defter içerisindeki idari taksimat, mesleklerin analizi, kayıtlarda geçen önemli kişilerin isimleri ve şehirde bulunan önemli yapılar tek tek belirtilmiştir. Çalışmanın ekler kısmında ise 1858 numaralı Trabzon Şer῾iyye Sicili'nin transkripsiyon edilmiş kısmı bulunmaktadır."
