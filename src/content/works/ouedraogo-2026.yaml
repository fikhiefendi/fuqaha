abstract: "Bu tez, kürtajın hükmüne ilişkin kapsamlı bir inceleme sunmaktadır. Kürtaj meselesi, ceninin erken gelişim evrelerinde doğrudan yaşam hakkıyla bağlantılı olması sebebiyle fıkhî, ahlâkî ve hukuki açıdan son derece önemli bir problem alanı teşkil etmektedir. Araştırmanın önemi, bu hassas meseleye dair açık, tutarlı ve uygulanabilir bir şer'i ve hukuki çerçevenin belirlenmesine duyulan ihtiyaçtan kaynaklanmaktadır. Çalışmanın temel amacı, İslam hukukunda kürtajın hükmünü ayrıntılı biçimde ortaya koymak ve ceninin farklı gelişim aşamalarında kürtajın caizliği veya yasaklanmasını belirleyen ölçütleri açıklığa kavuşturmaktır. Ayrıca bu araştırma, kürtaj etrafında ortaya çıkan yeni ve karmaşık meseleleri ele alması konusundaki öncü fakihlerin rolünü vurgulamayı hedeflemektedir. Bu bağlamda, fakihlerin dayandıkları şer'i deliller ve genel maksatlar (gayeler) ayrıntılı olarak analiz edilmiştir. Tezin pratik amaçlarından biri de kürtajın yanlış ve güvenlikten uzak biçimlerde uygulanmasının doğurabileceği ciddi tehlikelere dikkat çekmektir. Özellikle ilaçların rastgele kullanımından kaynaklanan riskler ortaya konmuş ve toplumun, şer'iatın yalnızca zaruret kapsamında müsaade edilen durumlar dışında bu uygulamadan kaçınması gerektiği vurgulanmıştır. Araştırmacı, çalışmada betimsel-mukayeseli yöntemi temel metodolojik çerçeve olarak benimsemiştir. Ayrıca kürtaj konusuna ilişkin şer'î metinleri ve farklı mezheplerden fakihlerin görüşlerini incelemek üzere istikrâî (indüktif- tümevarım) yöntem kullanılmıştır. Özellikle ceninin yaratılış evreleri bağlamında bu yöntem yoğun biçimde uygulanmıştır. Mukayeseli yöntem aracılığıyla ruh üflenmeden önce kürtajın caizliği hususunda farklı fıkhî görüşler karşılaştırılmış; ardından genel fıkhî yaklaşım, Burkina Fasso hukukunu temsil Eden modern yasal düzenlemelerle mukayese edilmiştir. Çalışmada terminolojik ayrımlara da özel bir önem verilmiştir. Fıkhî literatürde kürtajın“iskât”ve“tarh”gibi kavramlarla ifade edildiği, buna karşılık tıbbî terminolojide gebelik ürünlerinin 20. Haftadan önce rahimden çıkması şeklinde daha dar bir tanımla ele alındığı ortaya konmuştur. Araştırma bulguları, fakihlerin cenine ruh üflenmesinden (dört ayın tamamlanmasından) sonra kürtajı kesin bir şekilde haram Kabul ettiklerini göstermektedir. Bu aşamada kürtaj, korunması gereken bir Cana yönelik saldırı olarak değerlendirilmiştir. Bununla birlikte, gebeliğin ilk kırk günü sonrasında ve hatta öncesinde kürtaj, yalnızca zaruret derecesinde kesin bir şer'î gerekçe bulunduğunda caiz görülmektedir. Örneğin, annenin hayatını tehdit eden kesin bir tehlikenin varlığı halinde“iki zarardan daha hafif olanını tercih etme”kaidesi uygulanarak kürtaja izin verilebilmektedir. Hukuki açıdan yapılan karşılaştırma, kürtajın tarihsel süreçte hiçbir zaman geniş kabul görmediğini ortaya koymuştur. Burkina Fasso hukukunda yasaklama ilkesine uygunluk göstermekte; kürtaj yalnızca sınırlı ve istisnai durumlarda, annenin hayatını ciddi tehlikeden kurtarmak amacıyla veya tecavüz ve ensest vakalarında mağdurun zorlayıcı koşullarını dikkate alarak izin verilmektedir. Çalışma ayrıca, kürtajın özellikle güvenli olmayan veya yasal olmayan yollarla gerçekleştirildiğinde her yıl binlerce Anne ve ceninin ölümüne yol açtığını vurgulamaktadır. Bu durum, şer'î ve hukuki ölçütlere bağlı kalınması yönündeki çağrıları daha da güçlendirmektedir. Sonuç olarak, bu tez İslam hukukunu temsil Eden dinî referans ile Burkina Faso yasalarını temsil Eden hukuki yaklaşım arasında kürtaj konusuna dair derinlemesine bir analiz ve kapsamlı bir karşılaştırma sunmaktadır. Her iki yaklaşımda da ceninin korunması ortak ilke olarak öne çıkmaktadır. Bu çalışma, fıkhî ve hukuki literatürü zenginleştirmekte ve araştırmacılar ile kanun koyuculara, canın ve toplumun korunmasına hizmet edecek şekilde hükümlerin yasalaştırılması için yeni ufuklar açmaktadır."
