abstract: "Bu tez çalışmasında, klasik Osmanlı ilmihal geleneğinin erken dönem ürünlerinden biri olan Abdurrahmân b. Yûsuf Aksarâyî'nin İmâdü'l-İslâm adlı eseri hem içerik analizi hem de metin aktarımı yönüyle ele alınmıştır. Hanefî mezhebi esas alınarak kaleme alınmış olan bu eser, yalnızca dinî hükümleri aktaran bir ilmihal metni olmanın ötesinde, Osmanlı toplumunun inanç yapısını, ibadet anlayışını ve din eğitimiyle kurduğu ilişkiyi yansıtan önemli bir kaynak hüviyeti taşımaktadır. Bu yönüyle çalışma, yalnızca belirli bölümleri Latin harflerine aktarmaya yönelik teknik bir çabanın ötesine geçerek, söz konusu metni ilmî, fıkhî ve tarihî açılardan çok yönlü biçimde değerlendirme amacı taşımaktadır. Çalışma iki temel bölümden oluşmaktadır. İlk bölümde, eserin ilmihal yazım geleneği içindeki yeri, dilsel yapısı, kaynak kullanımı ve mezhebî yaklaşımı analiz edilmiştir. Bu süreçte hem klasik Hanefî literatürle hem de çağdaşı ilmihallerle karşılaştırmalı değerlendirmelere yer verilerek eserin ait olduğu ilmî zemin daha net ortaya konulmaya çalışılmıştır. İkinci bölümde ise“İman”ve“Namaz”bölümleri, klasik metnin orijinal yapısına ve diline sadık kalınarak transliterasyon yöntemiyle Latin harflerine aktarılmış; metnin anlaşılabilirliğini artırmak amacıyla açıklayıcı dipnotlar ve sınırlı düzeyde sadeleştirici müdahalelerde bulunulmuştur. Transliterasyon sürecinde, metnin filolojik bütünlüğünü koruma hassasiyeti ön planda tutulmuş; açıklamalar ise metne doğrudan müdahale etmeksizin okuyucunun anlam dünyasına katkı sunacak şekilde kurgulanmıştır. Bu çalışmada, yalnızca bir ilmihal metninin aktarımı değil, aynı zamanda bu tür klasik metinlerin günümüz fıkıh eğitimi bağlamında nasıl yeniden ele alınabileceği sorusu da temel bir araştırma ekseni olarak gözetilmiştir. Eserin kavramsal düzeyi, mezhebî tutarlılığı, halkla kurduğu dilsel ilişki ve dinî bilgiyi öğretme biçimi gibi yönler üzerinden çok katmanlı bir analiz gerçekleştirilmiş; ilmihal metinlerinin birer tarihsel bellek unsuru ve pedagojik araç olarak nasıl değerlendirilebileceği ortaya konulmuştur."
