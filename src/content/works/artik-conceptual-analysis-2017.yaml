abstract: "Bu çalışma, İslam ontolojisinin ve epistemolojisinin benzersiz normatif ilkesi içinde İslami fayda fonksiyonunun bileşenlerini keşfetmeye yönelik bir girişimdir. Bu çaba içinde, İslami fayda fonksiyonu geleneksel fıkıh bilgisinin ötesine geçen aksiyomatik bir yaklaşım ile inşa edilen İslami ahlaki ekonomi içinde ele alınmaktadır; bu da daha esnek işlevsel araçlar sağlar ve toplumsal iyiliği elde etmek için kullanılır. Bu araştırma, yıkıcı analiz yöntemiyle nitel araştırma temelinde inşa edilmiştir. Bu çaba arkasındaki temel öneri ise, neoklasik teorik fayda formalizasyonunun bireylerin sokaktaki günlük davranışlarını zorunlu olarak yansıtmadığı ve bu nedenle bireysel yaşamın normatif yönünün de bir fayda anlayışı ve fayda fonksiyonu oluştururken dikkate alınması gerektiği yönündedir. Bu nedenle, İslami fayda fonksiyonu, bireylerin öz çıkarlarını maksimize etmek yerine, dünya ve ahirette kurtuluşu (falah) elde etmek için ihsani (iyilik) sosyal sermayeyi genişleterek öz çıkarlarını ve kamu çıkarlarını aynı anda optimize ettikleri İslami değer sisteminin normatif prensiplerine dayanmaktadır. Bu nedenle, bu çalışmanın temel katkısı, hukuki bir yaklaşım yerine İslami fayda fonksiyonunu inşa etmek için İslami Ahlaki Ekonomi aksiyomatik bir yaklaşım benimsemesidir."
