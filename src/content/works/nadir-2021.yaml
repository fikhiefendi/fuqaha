abstract: "Bu proje ki ( plastik güzellik ameliyatları ve islim ilminde onların hükmü) adı altında sunulmuştur, çalışıyordur ki güncel ve çok konuşulan bir konuyu ki onun şeriat hükmü hakkında sorular soruluyor, audınlatsınlar ve onun hükümlerini açıklasınlar ve onun izinli konularını şerh etsinler. Onun izinlisi bu şekildedir: tedavi olarak olan şey, ve plastik cerrahi kişiyi psikolojik olarak cemiyette baskıya sokan bir zararı veya yarayı hasta için gidermektir ve onun yapım koşulları aşağıdaki gibidir: Doktorun yeteneği ve bilginliği, hastanın izni, ameliyatın faydalı olması, tedavide fazlaya kaçmamak, önemli olması, ve diğer şartlar ve hükümler ki bilim adamları onları belirtiyorlar. Karşı taraftaysa şeriat bakımından yasak ve haram olan şeyleri açıklamıştır ki onlardan biri güzellik ameliyatıdır ki sadece eğer güzellik hedefi ile yapılırsa, şeriat veya sosyal bakımdan bir itibarlı ihtiyaç yoktursa ve Allah'ın yarattığını değiştirirse. Kaş almak, benek, cinsiyet değişimi, kendini diğerine benzetmek ve bu işler gibi kandırıcı işleri yapmak ki bazı insanlar bunlara yakalanmışlardır. Bu araştırma doktorlar ve hastalar için bazı sonuçlara ve tavsiyelere gelip çıkmıştır ki şeriat yolundan plastik ve güzellik ameliyatı yapıyorlar ve yaptıkları zaman şeriat neyi yasaklamışsa ondan uzak duruyorlar. Bu araştırma ilim ve bilim delillerine dayanmıştır ve onlarla ilgili hükümleri açıklamıştır ki her biri hakkında da tavsiyeler sunmuştur."
