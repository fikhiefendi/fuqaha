abstract: "İslâm tarihinde müçtehit imamlar tarafından hadislerin değerlendirilip yorumlanması hususunda farklı farklı metodlar ortaya konmuştur. Bu farklılıklar, Hz. Peygamber (s.a.v) döneminden itibaren varlığını hissettiren ehl-i hadis ve ehl-i rey yaklaşımlarıdır. Bu farklı metodlar neticesinde her iki ekol zaman zaman birbirlerini sünnete muhalif olmakla itham etmişlerdir. Muhammed Şeybânî'nin hemen her meseleyi hadis ve âsâr çevçevesinde istidlalde bulunması kendisinin muhaddis fakih kimliğini de ayrıca ortaya koymuştur. Bazı konularda Şeybânî'nin, Kûfeli hocalarından farklı olarak rivâyetlere bağlı kalması, onun ehl-i hadisle olan sıkı temasının bir ektisi olarak görülür. Bu sebeplerden dolayı Şeybânî'yi; ''geçiş dönemi âlimi'', bazıları da; ''ehl-i hadis ile ehl-i rey ekollerini mezc eden âlim'' olarak kabul etmişlerdir. Çalışmamızda bu dönemlerin ehl-i hadis ve ehl-i rey çerçevesinde ihtilaf nedenlerine kısmen değinilmiş, sonra da iki ekol arasında yaklaşım ve etkileşimin öncüsü sayılan Muhammed Şeybânî'nin Muvatta nüshasından hareketle onun hadis ve sünnet konusundaki görüş ve değerlendirmeleri, hocası Mâlik hakkındaki bazı tenkitleri çerçevesinde ortaya konmaya çalışılmıştır. Nitekim her iki imâmın da farklı iki bölgede yetişmiş olmalarına ve birinin ehl-i hadise diğerinin de ehl-i reye mensubiyetine rağmen sünnetin tespitine, istidlal ve tenkit yöntemlerine bakıldığında aralarında büyük benzerliklerin olduğu görülür. Kısaca Şeybânî'ye göre sünnet; İslam beldelerindeki önceki fâkihler arasında yaygın olan ve amel edilen şeylerdir. Mâlik'e göre sünnet ise; Medîne'deki yaygın amel ve orada yaşayan âlimlerin ittifaklarıdır. İmam Malik'in“amel-i ehl-i Medîne”,“Bizde üzerinde ittifak edilmiş amel”,“İnsanların uygulaması”,“Bilinegelen uygulama”vb. ifadelerle tanımladığı uygulama da ona göre önemli ölçüde bu anlamda sünneti içermektedir. Ancak bu nitelikteki uygulamalarla toplumdaki örf ve adetlerin karıştırılması tehlikesi her zaman mevcut olduğundan genel sünnet tanımının daha açık bir hale getirilmesine ihtiyaç duyulmuştur. Şeybânî sünnet malzemesinin tespitinde, gittikçe artan oranda dini nitelikli sünnet ve yerel örf ve adetlerle karışmış sünnetleri birbirinden ayırma çabasına girdiğini gösteren bu çalışmamız; Muvatta gibi meşhur bir eser bağlamında, Şeybânî'nin ortaya koydukları usûl ve istidlal yönetemlerini bir nebze de olsa ortaya koymak ve Muvatta'ın en meşhur nüshası olan Yahâ b. Yahyâ el-Leysî nüshasıyla karşılaştırma ve zevâidlerini belirtme açısından önem arzetmektedir."
