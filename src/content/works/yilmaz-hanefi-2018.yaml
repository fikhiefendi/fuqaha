abstract: "İslâm hukukunda yoruma açık zannî deliller üzerinde gerçekleştirilen ictihad, aklî bir faaliyet olması bakımından farklı bakış açılarının ve neticede fıkhî ihtilâfların gün yüzüne çıkmasına neden olmuştur. Fıkhî delillerin ilki olan Kur'ân, bünyesinde barındırdığı hukukî niteliğe sahip zannî naslarla bu ihtilâfların kaynaklarından birini oluşturmaktadır. Ahkâm âyetleri çerçevesinde Hanefî ve Şâfiî mezhepleri arasında gerçekleşen fıkhî ihtilâfları konu alan bu çalışma, giriş ve sonuç bölümleri haricinde iki bölümden oluşmaktadır. Birinci bölümde, fıkhî ihtilâfların kavramsal çerçevesi ortaya konmuş, tarihi seyir içerisinde bu kavramla ilgili teşekkül eden diğer kavramlara ve genel olarak fıkhî ihtilâfların sebeplerine değinilmiştir. İkinci bölümde ise fıkhî ihtilâflara esas teşkil eden sebepler, ahkâm âyetleri özelinde ele alınmış ve bu sebeplerin yol açtığı görüş ayrılıklarının mahiyeti, belirli konular çerçevesinde incelenmiştir. Sonuç olarak Kur'ân-ı Kerîm'deki fıkhî ihtilâfların, lafız yapısı itibariyle var olan zannîlik ve ictihada açık naslardan hüküm istinbat etmede takip edilen usûlî farklılığa dayalı olarak meydana geldiği tespit edilmiştir."
