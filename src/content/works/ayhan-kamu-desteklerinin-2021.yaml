abstract: "Dünyadaki ekonomik sistem faize bağlı olarak hareket etmektedir. İslam inancı faizi yasakladığından faize duyarlı sektörler faizsiz finansmanı ve bankacılık ürünlerini tercih etmektedir. Şu anda ülkemizde faizsiz bankacılık kurumları bulunmaktadır. Ancak ülkemizde katılım bankacılığının tarihi çok eski değildir ve esas olarak 1980'lerden sonra kurulmaya başlamıştır. Katılım bankaları yavaş yavaş finansal sisteme entegre edilmeye başlamıştır. Günümüzde, Türk bankacılık sektöründeki katılım bankacılığının payı yüzde altıyı aşmış durumdadır (TKBB, 2020, s. 57-63). Ancak bu oran yeterli görülmemektedir. Hükümet, İslami bankacılığın Türk finans sektöründeki ağırlığını artırmak amacıyla bu alana girme kararı almış ve bu yönde halkın katılımı için üç adet katılım bankası kurmuştur. Hükümet tarafından“Öncelikli Dönüşüm Programı”kapsamında alınan karar gereği, banka mevduatı ile birlikte kamu kesiminde de katılım bankalarınca destek vermeye karar verilmiştir. Katılım bankacılığı son zamanlarda oldukça yaygın hale gelen, sunmuş olduğu ürünler ile toplumlar tarafından sıklıkla başvurulan ve her geçen gün daha fazla müşteriye ulaşarak gelişimini sürdüren bir bankacılık türü haline gelmiştir. Bu çalışmada materyal olarak birincil verilerden yararlanılmaktadır ve alan taraması yönteminden anket uygulaması yoluyla, TRB1 bölgesinde yaşayan KOBİ yöneticilerinin, kamu desteklerinin katılım bankacılığı aracılığıyla verilmesi hakkındaki algılarını belirlemek amaçlanmıştır. Çalışmada kategorik değişkenler için frekans ve yüzde; ifadeler için frekans ve yüzde ile ortalama değerleri hesaplanmıştır. Analizlerde Mann Whitney testi, Kruskal Wallis testi ve Faktör analizi kullanılmıştır. Faktör analizinde elde edilen anket sonuçlarına göre iki faktöre ulaşılmıştır. Birinci faktöre kamu destekleri hakkında bilgi düzeyi ve ikinci faktöre katılım bankaları aracılığıyla verilme durumu başlıkları verilmiştir. Mann Whitney ve Kruskal Wallis testinden elde edilen analiz sonuçlarına göre; ifadelere ait katılımın anketin yapıldığı il, gelir düzeyi, yaş, çalışılan banka türü ve kamu desteklerinden faydalanma durumu açısından incelenmesinde tüm sorulara verilen cevaplar arasında anlamlı farklılıklar saptanmıştır. Sağlanan desteklerin faizli bankalar tarafından verilmesinden dolayı esnafların kamu desteklerini tercih etmekten kaçındıkları ve kamu destekleri hakkında yeterince bilgi sahibi olmadıkları görülmektedir. Kamu desteklerinin katılım bankaları aracılığıyla da verilmesi durumunda desteklerden daha fazla yararlanılacağı anlaşılmaktadır."
