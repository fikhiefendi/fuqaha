abstract: "Körfez bölgesinde petrolün keşfi, akabinde 1973 yılında yaşanan petrol krizi sonucu petrol fiyatlarının bir anda üç katına çıkması petro-dolar olarak tabir edilen sermaye akışına neden olmuş ve bu durum petrol ihraççısı olan Arap ülkelerinin ellerinde büyük sermaye birikimlerine yol açmıştır (Öztürk & Saygin, 2017, s. 3). Bu sermaye birikimi İslami Bankacılığı teşvik etmiş ve 1975 yılında kurulan ilk ticari İslami banka olan Dubai İslam Bankası ile bankacılık alanında başlayan İslami finans günümüzde bankacılık, tekafül ve İslami sermaye piyasaları ile 3.1 trilyon ABD doları büyüklük (Katılım Finans Strateji Belgesi, 2022, s. 29) seviyesine erişmiştir. Bu çalışmada, Türkiye'de hizmet veren portföy yönetim şirketlerinde şer'i yönetişim yapısının ne durumda olduğu ve yasaların şer'i yönetişimi ne düzeyde zorunlu tuttuğunun bir resminin çekilmesi ve sonrasında Türkiye'deki şer'i risklerin belirlenip bunların en düşük seviyeye çekilmesi için neler yapılması gerekliliği konusunda öneriler verilmesi amaçlanmıştır. İslami sermaye piyasaları ve bu piyasaların en çok tercih edilen yatırım araçları incelenmiştir. İslami endeksler bağlamında hisse senetleri, sukuk ve yatırım fonlarına detaylı bir şekilde değinilmiştir. İslami sermaye piyasalarının önemli aktörü olan İslami portföy yönetim şirketleri şer'i yönetişim bağlamında ele alınıp, Türkiye ve Malezya'da şer'i yönetişim sistemleri kıyaslanmıştır. Hem Türkiye hem de Malezya şer'i yönetişim yapıları yasal düzenlemeler incelenerek değerlendirilmiş, ortak yanlar ve farklılıklar şer'i yönetişim bağlamında detaylandırılmıştır. Bu kıyas sonucunda Türkiye'nin İslami portföy yönetimi şirketlerine yönelik bir düzenlemesi bulunmadığı ve İslami kurallara uygun fon yöneten portföy yönetim şirketlerinin şer'i yönetişim yapılarında eksiklikleri bulunduğu tespit edilmiştir ve bu eksikliklerin nasıl giderilebileceğine dair öneriler sunulmuştur. Şer'i yönetişim yapısında meydana gelen eksikliklerin oluşturduğu şer'i riskler değerlendirilmiş ve bu risklerin en aza indirgenmesi için gerekli mekanizmalar tartışılmış ve riskleri düşük seviyede tutmak için atılması gereken adımlar anlatılmıştır."
