abstract: "Bu araştırmanın amacı finans piyasalarında en hızlı şekilde büyüyen enstrümanlardan biri olan sukuk ihracının Türkiye'deki uygulamalarını incelemek ve uygulanabilirliği üzerine yorumlar getirmektir. Sonuçlar göstermiştir ki İslami finans sisteminin hacmi 4 trilyon Amerikan doları büyüklüğe ulaşmış durumdadır. Bu anlamda sukukun, İslami finans ürünlerinin başını çeken, günümüzde ihraçlarında hızlı bir artış olan bir İslami tahvil olarak nitelendirilmesi söz konusudur. Gerçekten de günümüzde yalnızca Müslüman ülkelerin değil, Müslüman olmayan ülkelerin de sukuk ihraçlarının hızlı bir biçimde yaygınlaştığı görülmektedir. Ülkemizde ise faizsiz bankacılık ilkesi dahilinde yapılan uygulamaların 1984'den itibaren“Özel finans kurumu”adıyla faaliyete başlayan katılım bankalarıyla başladığını söylemek mümkündür. 2003'de körfez ülkelerinden doğrudan yatırıma yönelik sermaye akışını sağlamak amacı ile kiralanmış varlığa dayalı bir sukuk türü olan icare sukuk ihracının yapılabilmesi için gereken yasal altyapı oluşturulmuştur. Ancak ülkemizdeki ilk sukuk uygulamasını Kuveyt Türk Katılım Bankası A.Ş 2010 yılında gerçekleştirmiştir. Ülkemizde sukuk uygulamalarının artması ile şüphesiz TL cinsinden yapılacak ihraçların ekonomide faize hassas bazı atıl fonların uzun vadeli kaynağa dönüşmesi sağlanacaktır. Bunun yanında sukuk ihracının TL bazında olması İstanbul'un finans merkezi olma durumunu güçlendirerek Londra ve Lüksemburg borsalarının yanında yurt dışı ihraçlar tarafından dikkate alınan kuvvetli bir borsa alternatifi olmasına imkân sağlayacaktır. Fakat ülkemizde sukukun kapsamı oldukça kısıtlıdır ve bu anlamda genişletilmelidir."
