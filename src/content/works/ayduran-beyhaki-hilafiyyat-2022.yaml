abstract: "Beyhakî, el-Hilâfiyyat adlı eserinde Hanefî ve Şâfiîlerin ihtilaf ettikleri meselelere dair hadisleri bir araya getirmiştir. Söz konusu hadisleri sened ve metin açısından değerlendiren Beyhakî, Şâfiîlerin kullandıkları hadislerin sıhhatine vurgu yaparken Hanefîlerin istidlalde bulundukları hadislerin amele elverişli olmadıklarını göstermeye çalışmıştır. Bu araştırmada, Hanefîleri“hadisten anlamayan”ve“kendi mezhebine göre rivayet eden”gibi sözlerle itham eden Beyhakî'nin ilgili kitabındaki tenkitler tespit edilmiş ve ayrı başlıklar altında değerlendirilmiştir. Ayrıca araştırmanın ilk bölümünde farklı açılardan ele alınan eserin, hilâf literatüründeki yeri ortaya konmaya çalışılmıştır."
