abstract: "Bu çalışmada, Mâlikî mezhebinde ikincil bir İslam Hukuku kaynağı olan istihsân kavramı, Süleyman el-Bâcî (Endelüs âlimi) özelinde incelenmiştir. Çalışma aşağıdaki gibi düzenlenmiştir: Giriş bölümünde Bâcî'nin hayatı ve ilmi şahsiyeti ele alınmıştır. Onun künyesi hakkındaki farklı rivâyetler dikkate alınarak kendisinin fıkıh usülü ilmindeki yeri, hocaları, talebeleri ve bıraktığı eserleri üzerinden tesbit edilmeye çalışılmıştır. Birinci bölüm 'İstihsân kavramı ve mahiyeti' olarak adlandırmıştır. Bu bölümde, istihsânın genel tanımı ve istihsânın taşıdığı diğer anlamlar sunulmuştur. Ardından, istihsânın usûl literatüründeki ıstılâhî tanımlarına değinilmiştir. İstihsânın ıstılâhî tanımlarını verirken, diğer mezheblerden farklı İslam Hukukçularının tanımlarını da ele alınmıştır. Bunun ardından, istihsân düşüncesinin tarihi gelişimi irdelenmiştir. Bu bağlamda istihsânın gerçek ruhunun Hz. peygamber döneminde ortaya çıktığı, dört Halife döneminde de bu ruhun hâkim olduğu anlaşılmıştır. İstihsân kavramının gelişim tarihinden sonra, Mâlikî mezhebinde istihsân kavramı incelenmiştir. Bâci'nin istihsân tanımı ile diğer usulcülerin tanımlarının mukayesesi yapılmıştır. İkinci bölümde; Bâcî ve Mâlikî fakihlerin istihsânı kabul etmeyenlere verdikleri cevaplar ve istihsânın hücciyeti, Bâcî'ye göre 'İstihsânın iki çeşidi', istihsân-sedd-i zerâ'i' ilişkisi, istihsân-kıyâs ilişkisi ve istihsânın örf, maslahat, ref'u'l-ezâ ve zarûret kavramları ile ilişkisi ele alınmıştır. Üçüncü bölümde, Bâcî'nın istihsânın örnekleri ve genel modern mısaller yer almaktadır. Tezimiz, araştırmanın sonuç bölümü ile bitmektedir."
