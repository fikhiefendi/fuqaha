abstract: "ÖZET?SEYYİD BEY VE USÛL-İ FIKHA BAKIŞI? Bahattin ERGÜLSeyyid Bey, Osmanlı Devleti'nin son dönemi ve Cumhuriyet'in ilk yıllarındayaşamış bir ilim ve siyaset adamıdır. Halifeliğin kaldırılması sürecinde yaşanantartışmalarda, halifeliğin kaldırılması görüşünü desteklemiş ve karşı çıkanlarıngerekçelerini zayıflatan malÃ»m meclis konuşmasıyla meşhur olmuştur. Bu gün bileSeyyid Bey, halifeliğin kaldırılışıyla birlikte hatırlanmaktadır.Hâlbuki Seyyid Bey, önemli bir ilim adamıdır. UsÃ»l-i fıkıh alanında, ?UsÃ»l-i FıkıhDersleri I ,II?, ?Medhal? ve ?UsÃ»l-i Fıkıh Dersleri Mebâhisinden İrade-Kaza ve Kader?adında çok önemli eserleri vardır.Seyyid Bey, ictihad ve taklid üzerinde durur. İctihad kapısının kapandığıanlayışının kesinlikle doğru olmadığını, ictihadın devam ettiğini savunur. Ayrıca bazıkonularda ictihad ehliyetini taşıyan kişilerin o konularda ictihad edebileceğigörüşündedir. Makâsıd-ı Şâri' ( Allah teâlânın hüküm koyarken gözettiği hedefler)konusuna dikkatleri çeken Şâtıbû'nin görüşlerini takdir ederek bu konu üzerindeyoğunlaşmak gerektiğine işaret eder.Talidin yanlış algılandığını, taassuba dönüştüğünü söyler. Fert ve toplum açısındantaklidin farklı değerlendirilmesi gerektiğini savunur. Özellikle kanunlaştırmaçalışmalarında, toplumun ihtiyaçlarının ön planda tutulup, mezheplerin görüşlerindenazamû ölçüde istifade edilmesi gerektiğini söyler. Mecelle'nin, toplumun ihtiyaçlarınatam olarak cevap veremeyecek durumda olmasını da bu eksikliğe bağlar.Seyyid Bey'in farklı görüşlerinin tamamını ?Medhal? ve ? UsÃ»l-i Fıkıh DersleriMebahisinde İrade- Kaza ve Kader? adlı eserlerinde bulmak mümkündür. Hem ilimadamı, hem de siyasetçi olması açısından Seyyid Bey'in bu eserleri oldukça önemlidir."
