abstract: "SONUÇ 1. ÖZET : Araştırma, erkek ve kadının örtmesi gereken uzuvlarını ve örtünmede kullanacağı elbisenin ölçü ve tarzını dini açıdan ele almaktadır. İslam'ın erkek ve kadın vücudunda örtülmesini talep ettiği kısma avret denilir. Avretin sınırları erkeğe göre değişmez boyutta iken, kadın açısından diğer kadınlara, erkeklere, akrabaya ve yabancılara karşı farklılık arzetmektedir. Örtünmenin gaye ve hikmetleri temel kaynaklarda açıklanmıştır. Örtünme emrinin fert ve toplum yararına bir takım maslahatların korunmasına yönelik olduğu görülmektedir. Erkek ve kadın elbisesinde bulunması öngörülen müşterek Özellikler yanında her cinsin kendi elbisesine ait farklı nitelikler de bulunmaktadır. Elbisenin toplum ahlak ve huzurunu bozmayan bir görünüm arzetmesi, kadın ve erkeğin kendi cinsine has kıyafeti benimsemesi ve kıyafet tarzında gayri müslimlere benzemekten sakınılması, erkek ve kadın elbisesindeki müşterek özelliklerdir. Erkekten istenen kıyafet biçiminin temiz, düzgün, hoş görünümlü ve orta halli olması esas alınmıştır. Bunun yanında gurur ve büyüklenmeye götüren giyimden sakındırılmış; ayrıca toplumdaki ihtiyaç sahibi fertlerin gönlünü incitecek aşırı lüks ve süslü elbise tavsiye edilmemiştir. Kadın, evinde giyinme ve süslenme konusunda serbest bir statüye sahiptir. Ancak cinselliğini eve hasretmesinin bir gereği olarak kadının dış elbisesinin kapalı tarzda ve süs mahiyeti arz eden görünümden uzak olması öngörülmüştür. 181"
titleTranslation: {"en": "Private parts in İslam"}
