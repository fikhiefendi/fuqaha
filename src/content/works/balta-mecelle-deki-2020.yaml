abstract: "Osmanlı'da kanun metni olarak uygulanan Mecelle, gerek uygulandığı dönem içerisinde gerek daha sonraki dönemlerde daima temel başvuru kaynaklarından olmuştur. Bizler de bunu göz önüne alarak çalışmamızda Mecelle'ye dikkat çekmenin yanı sıra sosyal hayatta birçok yerde karşılaşılan hibe konusunun temel kaideleri hakkında da bilgi verilmiştir. Bu doğrultuda çalışmamızın ilk kısmında hibe konusunu detaylandırılarak önemine dikkat çekilmiştir. Daha sonraki kısımda ise Mecelle'nin önemi ve özelliklerinden bahsedilerek hibe maddelerine yer verilmiştir. Çalışmamızda son olarak Mecelle'nin“Kitabü'l-Hibe”kısmındaki maddeler ile Hanefi mezhebinin muteber metinleri olan Mütûn-i Erbaa'daki hibe bölümlerinin bir karşılaştırılması yapılmıştır."
