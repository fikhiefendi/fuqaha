abstract: "Bu çalışma, devletin yatırım haritasının benimsenmesinde temsil edilen yeni bir öneriyi, uygulamayı benimseyen ülkelerde ekonomik planlama için bütünleşik bir model olarak sunmayı amaçlamaktadır. Uygulanabilir ve bu ülkelerin ekonomilerinde, hükümetlerin, finansal piyasaların, sivil toplumun ve özel sektörün katılımıyla, makroekonomik açıdan olumlu değişiklikler getiren uygun sayıda üretken projenin seçilmesinde büyük radikal dönüşümler gerçekleştirme yeteneğine sahiptir. göstergeleri, gerçek üretken reel ekonominin faaliyetlerine odaklanarak ve zararlı olanlardan uzaklaşarak, gerekli ekonomik gücünü inşa etmeye ve prestij ve dokunulmazlık unsurlarını tatmin etmeye çalışan sürdürülebilir ekonomik kalkınma hedeflerine ulaşmak için (toksik) finansal ekonomi. Çalışma probleminin parçalara ayrılmasında, yatırım haritasının doğru bir tanımının olmaması, bu modelin kısmi görünümü, bu modelin kısmi görünümü gibi detayların ve değişkenlerin analiz edilmesinde tümevarım-tümdengelim ve betimsel-analitik yaklaşım izlenmiştir. entegre bir deneyimin izlenememesi, bu başarılı modelin boyutlarının açıklığa kavuşturulması ve Influencer'ların çalışılmasında karşılaştırmalı yaklaşımın izlenmesi ve önerilen modeli nicel modelle karşılaştırarak diğerleriyle karşılaştırma. Çalışma,“yatırım haritası”teriminin yeni bir tanımına ulaştı ve bileşenlerini, unsurlarını, kelime dağarcığını ve gereksinimlerini açıkladı ve yatırım haritasının çizilmesi, formüle edilmesi ve sütunlarını ve bileşenlerini tamamlamak için gerekli idari yapı için uygun kurumsal çerçeveyi önerdi. ve uygulanması için gerekli kararları ve prosedürleri alır. Ayrıca,“devletin yatırım haritasının karlılık katsayısı”ve bunun gerekli yatırım hacmiyle ters ilişkisi olan yeni bir tanım getirdi ve aynı zamanda, ihtiyaç duyulan fonların transferini kolaylaştıran bir İslami elektronik banka kurma önerisini sundu. finansman haritası projeleri ve diğer bir öneri, yurt dışındaki işçiler için birikimlerini bu projelerde kullanan bir banka kurulması, fonların yatırım imkânı ile zekat ve vakıf fonlarının kontrollere riayet edilmesi şartıyla. Çalışma ayrıca şirketlerin yatırım haritasının uygulanmasında ana araç olduğunu ve şirket liderlerinin haritanın başarısı için gerekli kritik unsur olduğunu doğruladı."
