abstract: "Bu çalışmanın amacı Türk katılım bankacılığı sektöründe 2018-2022 yılları arasında faaliyet gösteren katılım bankalarının karlılığı üzerinde etkili olan içsel ve dışsal faktörleri panel veri analizi yöntemi ile incelemektir. Bağımlı değişken olarak aktif kârlılığı ve özkaynak kârlılığı olmak üzere iki ayrı model kullanılmıştır. Banka büyüklüğünün yanı sıra finansal oran göstergeleri değişkenleri olan bankaya özgü değişkenler, ve ekonomik dışsal değişkenler kullanılarak toplamda dokuz adet değişken modele dâhil edilmiştir. Çalışmanın sonunda Türk katılım bankacılığı sektöründe kârlılığa etki eden faktörler Bahreyn katılım bankacılığı sektöründe kârlılığa etki eden faktörler ile karşılaştırılmıştır. Panel veri analizi Eviews programı yardımıyla yapılmış ve sonuçlara ulaşılmıştır. Panel veri analizi sonucunda Türk katılım bankalarının aktif kârlılığını banka büyüklüğü, likidite oranı, enflasyon oranı ve GSMH büyüme oranının etkilediği; özkaynak kârlılığı değişkenini ise likidite oranı, sermaye yeterlılığı oranı ve GSMH büyüme oranının etkilediği bulunmuştur. Bahreyn katılım bankalarında ise aktif kârlılığını kullandırılan fonların oranı, toplam aktiflerin GSMH'na oranı ve enflasyon oranının etkilediği; özkaynak kârlılığını kullandırılan fonların oranı ve enflasyon oranının da etkilediği görülmüştür."
