abstract: "Bu tez, kalkınma politikası tasarımının yoksulluğun azaltılması üzerindeki etkilerini, seçilmiş bazı Sahra Altı Afrika ülkeleri bağlamında; ekonomik, kurumsal ve sosyo-etik refah belirleyicilerinin etkileşimi üzerinden incelemektedir. Çalışmada, kişi başı gelir (GSYH) artışı, doğrudan yabancı yatırım (DYY), eğitim, sağlık harcamaları, işsizlik, yolsuzluk, gelir eşitsizliği, vergi adaleti, adalet ve toplumsal dayanışma gibi değişkenlerin yoksulluk üzerindeki etkileri analiz edilmektedir. Araştırma, belirli bir dönemi kapsayan dengeli panel veri seti kullanmakta olup, hem kesit hem de zaman boyutundaki farklılıkları yakalayabilmek amacıyla Havuzlanmış En Küçük Kareler (POLS), Sabit Etkiler (FE) ve Rasgele Etkiler (RE) modellerinden yararlanılmıştır. Hausman spesifikasyon testi gibi model tanı testleri, Sabit Etkiler modelinin en uygun tahminleyici olduğunu ortaya koymuş; bu da ülkelere özgü yapısal ve kurumsal özelliklerin yoksulluk dinamiklerinin şekillenmesinde belirleyici rol oynadığını göstermiştir. Ampirik bulgular, ekonomik büyümenin, eğitimin ve sağlık harcamalarının; beşerî sermayeyi güçlendirerek, üretkenliği artırarak ve hane refahını yükselterek yoksulluğun azaltılmasına anlamlı biçimde katkı sunduğunu göstermektedir. Buna karşılık, işsizlik, yolsuzluk ve gelir eşitsizliği kapsayıcı kalkınmanın önünde sürekli engel oluşturmaktadır. Ayrıca, adalet ve toplumsal dayanışmayı yansıtan göstergelerin yoksulluğun azaltılması üzerinde anlamlı bir etkiye sahip olduğu tespit edilmiş; bu durum, etik yönetişim, adil kurumsal düzenlemeler ve toplumsal uyumun önemini vurgulamaktadır. Söz konusu sonuçlar, maddi zenginliğin yanı sıra ahlaki liderlik, hesap verebilir yönetim ve kolektif toplumsal sorumluluğu öne çıkaran İbn Haldun'un çok boyutlu kalkınma çerçevesiyle örtüşmekte ve bu çerçeveyi genişletmektedir. Tez, Sahra Altı Afrika'da sürdürülebilir yoksulluk azaltımının ekonomik reformlarla sosyal yatırımların ve kurumsal dönüşümün bütüncül bir strateji çerçevesinde birleştirilmesini gerektirdiği sonucuna varmaktadır. Ana akım iktisat teorisini İbn Haldun'un normatif yaklaşımıyla buluşturan bu çalışma, yoksulluk azaltımını hem ekonomik hem de ahlaki bir görev olarak yeniden konumlandıran özgün bir analitik katkı sunmaktadır. Bulgular, kapsayıcı büyüme ve uzun vadeli toplumsal istikrarı hedefleyen hükümetler, bölgesel kuruluşlar ve kalkınma ortakları için politika önerileri geliştirmektedir."
