abstract: "İslam hukukundaki değişim kavramının incelendiği tezimizde; tegayyür (değişim) kavramının mahiyeti, alanı, zorunluluğu ve değişimi gerektiren nedenler üzerinde durulmuştur. Daha sonra değişime gidilen fıkhî meselelerdeki maslahat ve fukaha tarafından verilen fetvaların toplumsal arka planı irdelenmeye çalışılmıştır. Tegayyür kavramı iki şeyin birbirine mukayese edilmesi durumunda sonrakinin öncesine nispetle değişme durumudur. Bu değişime birçok nedenden dolayı gidilebilir. En etkin nedenin ise örf olduğu ifade edilebilir. Bizim de tezimizde esas alarak mukayese ettiğimiz iki eser Hanefî mezhebinin müteahhir dönem kaynaklarından Ebü'l-Berakât en-Nesefî'nin, Kenzü'd-dekâik adlı eseri üzerine yazılan iki şerh olup, bu şerhler Zeylaî'nin, Tebyinü'l-hakâikşerhu Kenzid'd-dekâik'ıile İbn Nüceym'in, el-Bahru'r-râikşerhu Kenzid'd-dekâik'ıdır. Bu iki eserin telifleri arasında geçen 200 yılı aşkın bir süre içerisinde Mısır coğrafyasında ne gibi bir değişimin olduğu füru eserleri etrafında işlenmeye çalışılmıştır. Bu yapılırken de her iki kitapta aynı meselede“zamanımızda”,“şimdiki zamanda”şeklinde geçen ifadeleri esas alarak karşılaştırma yapılmış ve değişen hükümler tespit edilmeye çalışılmıştır"
