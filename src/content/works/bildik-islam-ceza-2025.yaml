abstract: "Osmanlı Tanzimat öncesi dönemde hukuk sistemi, şer'i ve örfi hukuk olmak üzere iki temele dayandırılmıştır. İslâm hukuku ile tayin edilmiş suçlar ve cezaların yanı sıra zamana ve duruma göre ihtiyaç duyuldukça hukuk alanındaki boşluktan istifade edilerek adaletin ve kamu düzeninin sağlanması için örfi hukuk kuralları da belirlenmiştir. Tanzimat sonrasında ise ıslahat hareketleri kapsamında pek çok alanda, özellikle adliye teşkilatıyla ilgili hususlarda önemli düzenlemeler yapılarak yeni kavramlar ve yeni usuller ortaya konulmuştur. 25 Haziran 1879 tarihli Usûl-i Muhâkemât-ı Cezâiyye Kânun-ı Muvakkati de adlî alanda yapılan yenilik çalışmaları neticesinde yürürlüğe konulan usul kanunlarından bir tanesidir. Bu çalışmada ceza muhakemesi usulünün genel kavramlarının ve tarihçesinin verilmesinin ardından mahkemeyi harekete geçirme süreci olan kovuşturma evresi; Osmanlı devletinin ilk modern ve sistematik ceza usul kanunu olma özelliğini taşıyan ve günümüz yargılama usulüne de temel teşkil eden Usûl-i Muhâkemât-ı Cezâiyye Kânun-ı Muvakkati örnekliğinde incelenmiştir. Kanunnamenin şerhleri ile bu kanunnameye ilişkin müstakil çalışmalar incelenmiş olup, yargılama sürecinin akabindeki istinaf ve temyiz aşamaları, ayrı uzmanlık gerektiren hususlar olduğundan ve tezin kapsamını aşacağından araştırma alanı dışında bırakılmıştır. Kovuşturma evresi ile ilgili kanun maddeleri Türk Ceza Muhakemesi Kanunu ile karşılaştırmalı verilmekle birlikte yer yer Tanzimat öncesi dönemdeki usule dair kısa bilgiler de verilmiştir. Yapılan karşılaştırmalar sonucunda Usûl-i Muhâkemât-ı Cezâiyye Kânun-ı Muvakkati'nin kovuşturma evresine dair maddelerinin klasik dönem Osmanlı ceza muhakemesi usulü ile kısmen, günümüz ceza muhakemesi usulü ile de büyük oranda benzerlikler içerdiği görülmüştür. Ayrıca kanunnamenin yürürlükte olduğu döneme ait arşiv belgelerinin incelenmesi sonucunda da yürürlükte kaldığı süre zarfında gereğince uygulanmaya çalışıldığı gözlemlenmiştir."
