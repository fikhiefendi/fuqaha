abstract: "Aile her dönemde bireylerin ve toplumların vazgeçemediği önemli bir müessese olagelmiştir. Hukuken evlenmelerinde bir engel bulunmayan erkekle kadının evlenerek kurmuş oldukları bu kurum, toplumsal ahlâkın muhafazasında da büyük bir rol oynamaktadır. Nitekim toplumsal barış ya da kargaşa ve çözülmelerle -toplumun en küçük yapıtaşı olan- aile yapısının sağlamlığı veya zayıflığı arasında doğrudan bir ilişki bulunmaktadır. Millî ve manevî değerlerin muhafaza edilip sonraki nesillere aktarılmasında da aile müessesesinin pozisyonu önemlidir. Aile kurumu inşa edilirken inanan bireylerin kiminle evlenip kiminle evlenemeyeceği hususunda dinlerin önemli ölçüde belirleyici etkisi bulunmaktadır. Semavi dinler -Yahudilik, Hıristiyanlık, İslam- temel olarak mensuplarının farklı dinden -hatta bazı mezhepler aynı dine mensup olup farklı mezhepten- biriyle evlenmelerine hoş bakmamakta; hatta yasak kapsamında değerlendirmektedir. Bu hususta İslam'ın geniş ve teferruatlı bir alan tanıdığı aile hukukunda, bilhassa evlilik mevzusunda pek çok kaideler ve hükümler bulunmaktadır. İslam hukukunda evliliğe dair hükümlerde din farkı geçici evlilik engelleri arasında zikredilmektedir. Müslüman bir kimsenin kendi dinine mensup olmayan biriyle -Müslüman olmadıkça- evliliği söz konusu olamamaktadır. Fakat Şâri', Müslüman erkeğin iffetli ehl-i kitap bir kadınla evliliğini bu genel kaideden istisna etmiş ve aile kurmaları hususunda bu kimseleri serbest bırakmıştır. Müslüman kadının farklı dine mensup erkekle evlenmesi ise icmâen yasak kabul edilmektedir. Kur'an ve sünnet çerçevesinde incelendiğinde Yahudi ve Hıristiyanları içine alan ehl-i kitaptan bir kadınla Müslüman bir erkeğin evlenmesi aile hayatına yansıyacak bazı olumsuzlukları barındırmaktadır. Dinler arası karma evlilik yapan kişilerin farklı kültürlerde ve farklı din esasları üzerine yetişmiş olmaları, dünyaya gelen çocuklara hangi din eğitiminin verileceği ve aralarında oluşacak iletişimsizlikten kaynaklı birtakım sıkıntı ve problemlerin doğmasına yol açabilmektedir. Bu durum ise başta aile olmak üzere toplumu derin bir şekilde etkileyebilmektedir."
