abstract: "Bu çalışmada çocuk üzerindeki velayet yetkisi ve bir tür velayet olarak kabul edilen hadâne yetkisi İslam hukuku çerçevesinde ele alınmıştır. Velayet, hukuki olarak reşit kabul edilen bir kimsenin, tam ehliyetsiz veya ehliyeti nakıs başka bir kişinin şahıs ve mallarıyla ilgili işlerini yürütme yetkisidir. Hadâne kavramı genellikle“Çocuğun bakım ve terbiyesi”anlamında kullanılan bir kavram olup; belli şartları taşıyan ve çocuğun yakını kabul edilen yetkili bir kişinin, kendi gereksinimlerini karşılayamayacak çağdaki çocuğa, belirli bir süre bakma, terbiyesi ve eğitimi ile ilgilenme sorumluluğunu almasıdır. Çalışmamızda velayet ve hadâne yetkilerinin kapsamı ve bu yetkilerle ilişkili olan hak ve sorumluluklar incelenirken, İslam hukuk sistemi mezheplerinden Hanefi, Şafii, Maliki ve Hanbeli mezhepleri temel alınmıştır. İlgili durumlarda diğer hukuk sistemlerine de zaman zaman değinilmiştir. İslam hukukunda hadâne hakkının öncelikle anneye ait olduğu konusunda fikir birliği vardır fakat belli bir dönemden sonra çocuğun velayetinin babaya geçmesi söz konusudur. Aynı zamanda çocuğun nafaka sorumluluğu da babaya aittir. Böyle bir durumda çocuk üzerinde ortak yetkilerin bulunması söz konusudur. İslam hukukunda çocuk üzerinde müşterek velayet durumu ele alınmamıştır fakat bu konuda“yetki alanı paylaşımlı müşterek velayet”şeklinde bir düzenleme üzerinde çalışılması ve velayet yetkisinin anne baba tarafından paylaşılması, çocuğun iki ebeveynin sorumluluğunda olması bakımından, çocuğun menfaatine olacaktır. Gerek hadâne gerekse velayet yetkisinin kullanılmasında nihaî amaç çocuğun menfaati ve haklarının korunması aynı zamanda mümkün olduğunca ebeveynlerin mağdur edilmemesidir. Bu nedenle zamanın şartlarına göre velayet ve hadâne konusunda ihtiyaçlar doğrultusunda düzenlemeler yapılması faydalı olacaktır."
