abstract: "Bu çalışmada bankacılık sektörü genel olarak araştırılmış olup, Türkiye'deki katılım bankacılığı sektörünün gelişimi, kamu ve özel sermayeli katılım bankaları ve bunların son dönemdeki finansal verileri detaylı olarak incelenmiştir. Bu veriler ışığında Türkiye'deki kamu ve özel sermayeli katılım bankalarının finansal durumlarının gelişimi irdelenmiştir. İslami finans sektörü olarak tanınan katılım bankacılığı sistemi, bankacılık sistemine yeni ve farklı bir bakış açısı getirmiştir. Türkiye'de 2015 yılı itibariyle kamu sermayeli katılım bankalarının ortaya çıkması, katılım bankacılığı sektöründe bir gelişim yaşanmasına neden olmuştur. Bu bağlamda bu çalışmada, Türkiye bankacılık sektöründeki kamu ve özel sermayeli katılım bankalarının 2017-2021 yıllarını kapsayan gelişimleri incelenmiştir. Bu süreç içerisinde özel sermayeli katılım bankaları ön planda olsa da zaman içerisinde kamu sermayeli katılım bankalarının ciddi bir gelişim gösterdiği görülmüştür."
