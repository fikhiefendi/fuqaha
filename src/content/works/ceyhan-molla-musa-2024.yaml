abstract: "ÖZET YÜKSEK LİSANS TEZİ MOLLA MUSA CELÂLİ ( 1938-2021) VE HADİS ÇALIŞMALARI Abdulkadir Ceyhan Tez Danışmanı: Doç. Dr. Sedat YILDIRIM 2024 sayfa: (XVII+215) Jüri: Prof. Dr. Mehmet Salih GECİT Jüri: Doç. Dr. Sedat YILDIRIM Jüri: Doç. Dr. Mehmet Seyid GECİT Doğu Anadolu'nun yetiştirdiği önemli âlimlerden biri olan Molla Musa Celâli, bölgede medreseler kurarak ve sayısız eser kaleme alarak İslami ilimlerin yaygınlaşmasına büyük katkı sağlamıştır. Özellikle Kürt ve Türk halkına hitap eden çalışmalarıyla bu coğrafyada İslam bilincini canlı tutmuştur. Muhtelif alanlarda birçok eser telif eden el-Celâli, içinde yaşamış olduğu toplum üzerinde derin izler bırakmış ve bırakmayada devam etmektedir. Nitekim o, şeriatın zahirine sıkı sıkıya bağlı kalmış ve eserlerini bu minvalde kaleme almıştır. İşte bizde buradan yola çıkarak el-Celâli'nin hadis alanında kaleme aldığı ve çalışmamızın konusunu teşkil eden“Mecmuâtu'l-Ulum”,“Mecmuâtu'l-Mekâsid”ve“Hadis İnkârcılarına Reddiyeler”adlı kitaplarının içeriğini sizlere anlatacağız. Çalışmamızda, el-Celâli'nin veciz üslûbunun ve özverili gayretinin mahsülü olan bu eserler titizlikle çözümlenerek tahlil edilmiştir. Giriş, üç bölüm ve sonuçtan oluşan araştırmamızda müellifimiz hakkında bilgi verilmiş, eserleri etraflıca izah edilmiş, eserin içeriği diğer hadis kaynaklarından yararlanılarak desteklenmiştir. Bu çalışma yapılarak Molla Musa Celâli'nin hadis anlayışı, hadis problemlerine karşı etkili sunumu gözler önüne serilmiştir."
