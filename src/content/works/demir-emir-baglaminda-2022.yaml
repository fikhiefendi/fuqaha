abstract: "On Emir, Yahudiliğe göre Tanrı'nın kendisi tarafından yazıldığı ve Hz. Mûsâ'nın aracılıyla İsrailoğullarına verilmiş en önemli emirlerdir. Öyle ki, Yahudiler On Emri okurken saygıdan dolayı ayağa kalkmaktadırlar. Çünkü bu emirler Yahudi şeriatında bulunan 613 emrin özeti mahiyetindedir. Bu çalışmada Tevrat'ta bulunan On Emir ve yasak Yahudilerin ana kaynağı olan Talmud ve Tevrat esas alınarak objektif bir şekilde tespit edilmeye çalışılmıştır. Ayrıca bu emirlerin Yahudi kaynaklarına dayanılarak yer yer yorumlar da yapılmıştır. On Emrin Kur'ân'daki karşılığını tespit edebilmek için de Kur'ân-ı Kerim'e başvurularak tespit edilmeye de çalışılmış, yine Sünnet ve tefsir kaynaklarına dayanılarak yer yer yorumlar yapılmıştır. Ayrıca bu On Emir'in Yahudi geleneğinde ve İslâm geleneğinde nasıl telakki edildiği konusu da karşılaştırmalı bir şekilde ele alınmaya çalışılmıştır."
