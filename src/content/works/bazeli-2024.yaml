abstract: "Bu çalışma, ekonomik ve sosyal kalkınmanın sağlanmasında ve yoksulluk ile işsizliğin azaltılmasında finansal kapsayıcılığın önemini ele almıştır. Çalışma, İslami bankaların finansal hizmetlere erişimi kolaylaştırmada izledikleri mekanizmaları anlamak ve özellikle Al-Kuraimi İslami Mikrofinans Bankası olmak üzere İslami bankaların Yemen'de finansal kapsayıcılığı teşvik etmedeki ana rolünü değerlendirmeyi amaçlamıştır. Çalışma, araştırma konusunu analiz etmek için betimleyici ve tümdengelimli bir yaklaşım izlemiş ve seçilen örneklemden bilgi toplamak için anket kullanmıştır. Çalışma, İslami bankaların finansal hizmetlere erişimi kolaylaştırdığı ve şeffaflık, adalet ve uygun finansmanla karakterize edilen hizmetler sunarak bu hizmetlerin kullanımını teşvik ettiği sonucuna varmıştır. Ayrıca, çalışma İslami bankaların, bankacılık hizmetlerini sunmada kalite standartlarına bağlılıklarıyla finansal hizmetlerin kalitesini artırmaya katkıda bulunduğunu belirtmiştir. Çalışma, Yemen hükümetinin finansal kapsayıcılığı destekleme rolünü güçlendirmesi için ulusal bir strateji geliştirmesi, destekleyici altyapı ve yasal çerçeve sağlaması, Bankacılık Araştırmaları Enstitüsü ve Merkez Bankası arasında finansal eğitim planı hazırlamak için iş birliği yapması ve İslami bankaların hizmetlerini genişletmek ve toplumun tüm kesimlerine ulaşmak için koordinasyon sağlaması, özellikle düşük gelirli insanlar, gençler ve kadınlara odaklanılması gerektiğini önermiştir."
