abstract: "Çalışmada,“İslam Hukukunda Kişilik Bağlamında Yapay Zekâ Sorunu”konu edilmiştir. Bu kapsamda yapay zekâ sorunu farklı yönleriyle üç bölümde ele alınmıştır. Bunlar; yapay zekânın insan beyni ile münasebeti, tanımı, kısımları ve Felsefî alt yapısının incelenmesidir. Aslında yapay zekâ bir algoritmadır. Algoritmanın en büyük benzeşim gösterilmeye çalışıldığı alan ise insan beynidir (zihin modellemesi). Bu sebeple yapay zekâya neden ihtiyaç duyulduğu ve neden hukukî alt yapısı sorun edildiğine çözüm aranmıştır. İslam hukukunda kişilik bağlamında yapay zekânın değerlendirilmesinin bir ihtiyaç olduğu kabul edilerek, yapay zekânın insan şahsiyetine etki eden faktörlerle kıyaslaması yapılmıştır. Yapay zekâya insan görünümlü robot formlu bir bedende hukukî bir kişilik verilmesi temel sorun kabul edilerek; ruh, irade, akıl ve fıtrat (fıtrata bağlı transhümanite ve yapay zekâ ve neslin devamı problemi açısından yapay zekâ ile evliliğin İslam Aile Hukuku açısından ortaya koyduğu asılların merkezinde tartışılması) bağlamında değerlendirilmiştir. Yapay zekâ hukukunun gelişmekte olduğu göz önüne alınarak İslam ceza hukukunda yapay zekânın değer sorunu ve hukuk norm bazlı açıklamalar yapılmıştır. Ayıca yapay zekânın cezaî ehliyetine bağlı işlenen suçlar ve bu suçların cezalandırılmasında nasıl bir yol ortaya konulması gerektiği ifade edilmiştir. Bu anlamda özellikle kusursuz sorumluluk eksenli yapay zekânın neden olduğu suçlarda yapay zekâyı üreten, programlayan ve kullananın sorumlu tutulmaları gerektiği öne sürülerek muhtemel tehlikelere işaret edilmiştir. Özellikle yapay zekânın eşya statüsü önerisinin İslam Hukuku açısından en uygun değerlendirme olacağı önerisi getirilmektedir."
