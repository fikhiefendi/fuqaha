abstract: "Bu tez, bir Giriş ve iki Bölümden oluşmaktadır. Giriş bölümünde Ebû Yûsuf'un nesebi, ilmî yönü, hocaları, öğrencileri ve eserleri hakkında bilgiler yer almaktadır. Tezin birinci bölümü, istihsânın genel anlamda usûl-i fıkıhtaki yeri hakkında bilgi vermektedir. İstihsânın lügavî ve ıstılâhî anlamları ele alınırken Hanefî mezhebi yanında Şâfi'î, Mâlikî ve Hanbelî mezheplerinin görüşlerine de yer verilmiştir. Bu bölümde ayrıca Ebû Yûsuf'un istihsânın meşruiyeti konusundaki görüşleri aktarılmıştır. İkinci bölüm, Hanefî literatürü esas alınarak Ebû Yûsuf'un yaptığı istihsânların dayanakları tespit edilmeye çalışılmıştır. Bu literatür incelemesinde ẓāhiru'r-rivāye eserler temel alınmıştır. Nitekim ẓāhiru'r-rivāye eserlerde Ebû Yûsuf'un istihsânla ilgili görüşleri veciz bir şekilde yer almaktadır. Bu eserlerde Ebû Yusuf tarafından gerçekleştirilen istihsânların vechi, yani hangi sebepten dolayı olduğu ise net olarak belirtilmemektedir. Bundan ötürü literatür incelemesi, daha sonra yazılan eserlere de uzanmıştır. Nitekim bu eserlerde Ebû Yûsuf'un yaptığı istihsânlarla ilgili daha açıklayıcı bilgi verilmektedir. Bu istihsânların hangi sebebten veya dayanaktan dolayı olduğu açık bir şekilde izah edilerek nass, örf, maslahat, zaruret, icmâ' veyahut hâfî kıyâs olduğuna dair bilgi verilmektedir. İkinci bölümde nass, icmâ', örf, zaruret gibi bilinen istihsân sebeblerinin yanı sıra Ebû Yûsuf'un kolaylık (tevessu'), toplumsal ihtiyaç, ihtiyât, muhafaza (sıyâne), zorluğu kaldırma (ref'u'l-harâc), bireysel ve kamusal yarar sağlama (celbu'l-menfa'a) ve bireysel ve kamusal zararı bertaraf etme (def'u'd-darar) kavramları esas alarak gerçekleştirmiş olduğu istihsân örnekleri geniş bir şekilde ele alınmıştır. Ayrıca Ebû Yûsuf'un istihsân ile amel etmesi mümkünken kıyâsı tercih ettiği durumlar ile ilgili pek çok örneğe yer verilmiştir. Bu bölümde Ebû Yûsuf'un esas aldığı istihsân dayanakları ile klasik Hanefî kaynaklarındaki belirtilen çeşitli istihsân dayanakları arasındaki farklılaşma üzerinde durulmuş ve bunun nedenlerine dair çeşitli değerlendirmeler yapılmıştır. Böylece Ebû Hanîfe, İmam Muhammed ve Ebû Yûsuf'un istihsân anlayışlarının farklı olmasına etkileyen sebepler ortaya konmuştur. Son olarak da üç imamın müşterek bir şekilde gerçekleştirdiği bazı istihsân örnekleri zikredilmiştir."
