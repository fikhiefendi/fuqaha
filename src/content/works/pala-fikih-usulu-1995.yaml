abstract: "Bu tez, hukukun ve onun göstergeleri olan hukuk kurallarının en önemli unsuru olan emrin (pozitif ve negatif versiyonuyla/emir ve nehiy) yorumunu konu edinmektedir. Tez, klasik fıkıh usulünde emrin yorumlanış biçimini incelemek ve modern hukukla mukayesesini yapmakla sınırlıdır. Tez, bir giriş, üç bölüm ve sonuçtan oluşmaktadır. Girişte, tezin önemi ve amacı anlatılmış, planı ve yöntemi izah edilerek kaynaklar tanıtılmaya çalışılmıştır. Birinci bölümde, kavram tahlili yapılmış, bu bağlamda emir ve nehyin tanımlan yapılarak, emir ve nehiyle ilişkili görülen kavramlar tanıtılmaya çalışılmıştır. Ayrıca emrin tanımında öne çıkan mesele olarak emirde irade problemi incelenmiş ve bir sonuca ulaşılmıştır. İkinci bölümde, İslam hukukunun temel iki kaynağını Kur' ân ve Sünnette yer alan emirlerin yorumunda önemli yer işgal eden emir sigasının mucebi (gereği, delalet ettiği anlam) konusu incelenmiş, emrin tekrara ve fevriyete delaleti ile, emir hüsün-kubuh ilişkisi, emir hüküm ilişkisi, negatif emir (nehiy) fesat ilişkisi gibi meseleler ve emrin muhatapları ve edası konulan işlenmiştir. Üçüncü bölümde, emrin yorumunun hukuki etkileri seçili birkaç örnekle izah edilmiş ve emrin modern hukuktaki“emir”kavramıyla mukayesesi yapılarak, İslam hukuku açısından, modern hukukta olduğu gibi hukuk kurallarının emredici-yedek şeklinde ayırmanın mümkün olup olmadığı araştırılmıştır. Bu ayrım, hukuk kurallarının bağlayıcılığı, isimli-isimsiz akitler ve akit hürriyeti konularında temel hareket notasıdır. Sonuç kısmı, tezde tespit edilen bulgular ve sonuçlan içermektedir. Burada yer alan en önemli sonuçlardan birisi, modern hukukta var olan emredici-yedek ayrımının İslam hukuku açısından da mümkün olduğudur."
