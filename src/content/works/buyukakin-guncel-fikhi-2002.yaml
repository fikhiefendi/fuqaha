abstract: "ÖZET İslam tarihinin ilk dönemlerinden günümüze bireyler dini konulardaki problemlerini, fıkhi kaideler içinde çözmek için fakihlere müracaat etmişlerdir. İlk etapta bireysel olarak başlayan bu faaliyet daha sonra kurumsal bir nitelik kazanarak fetva müessessinin oluşmasına sebep olmuştur. İslam dininin mantık çizgisini koruma ve fıkıh kaidelerinin problemleri çözmede yeterli olup olmadığım kontrol vazifesini fetva kurumu yerine getirmiştir. Günümüzde de bireyler hayatlarım dini kurallara göre düzenlemek için fakihlere bir takım sorular yöneltmektedirler. Bu çalışma fetva kurumunun geçmişteki rolü ile günümüzdeki rolü arasındaki benzer ve farklı noktalan tespit etmek, bireylerin hangi alanlarda fetvaya daha çok ihtiyaç duyduklarım saptamak, ve ortaya çıkan problemleri tespit etmek için hazırlanmıştır. Çalışmanın ilk bölümünde fetvanın kavramsal çerçevesi ve tarihsel gelişimine yer verilmektedir, ikinci bölümde ise, fetvaya konu olan soruların analizi yapılmaya çalışılmaktadır. Sorular din, akaid, fıkıh usulü, ibadetler, haram ve helaller, ukubat, muamelat, hukuki ve ticari hayat, sosyal hayat ve güncel olmak üzere sekiz bölümde incelenmektedir. Üçüncü bölümde ise ikinci bölümde elde edilen bulguların değerlendirilmesine yer verilmektedir. Bu bölümde ilk olarak, bireylerin sordukları sorulara yol açan faktörler tespit edilmeye çalışılmaktadır. Daha sonra fetva konularının değişmesine sebep olan etkenler incelenmektedir. Sonda da bulgulardan hareketle dinleyici profili, halkın din konusundaki öncelikli sorunları ve fetva kurumunun güncel problemleri tartışılmış ve gerekli çalışmalara değinilmiştir. iii"
