abstract: "Günümüzde genellikle fıkıh usûlüne iki önemli işlev yüklenmektedir. Bunlardan ilki, şer'î delillerden yeni hükümler elde etme, ikincisi var olan hükümlerin tutarlılığını ortaya koymadır. Fıkıh usûlüne bu iki işlevin yüklenmesi, fıkhın furûu ile usûlü arasında dinamik bir ilişkinin olması gerektiği düşüncesine dayanmaktadır. Bu düşünceye göre fıkhî hükümlerin fıkıh usûlü teorilerine uygun olarak elde edilmesi gerektiği gibi, fıkıh usûlü teorilerinin de mevcut fıkhî hükümlere uygun olarak kurgulanması gerekmektedir. Bu çalışmada kıyâsın en önemli unsuru olan illetin tespitine ilişkin ortaya atılan te'sîr teorisi bakımından fıkıh-usûl ilişkisi inceleme konusu edilmektedir. Te'sîr teorisi ilk defa kurgulanırken esas olarak selefin uygulamaları ve mevcut fıkhî hükümler dikkate alınmış olsa da teorinin gelişimine yön veren kelâmî tartışmalar da bulunmaktadır. Bu hususta fukahâ ve mutekellimîn geleneğine mensup usûlcülerin yaklaşımları arasında herhangi bir farklılık bulunmamaktadır. Hatta usûlcülerin çoğunluğunun, hanefîlerin aksine, mevcut uygulamaları teorik çerçevenin içerisine alıp onların meşruiyetini koruyan bir yaklaşıma sahip oldukları görülmektedir. Zira ed-Debûsî ile birlikte hanefîler, illet tespitini te'sîrle sınırlı tutan teoriyi benimseyerek, hicrî dördüncü ve beşinci yüzyıl fıkıh literatüründe yaygın olarak kullanılan tardî nitelikteki kıyâsları mümkün olduğunca fıkıh literatüründen çıkarmışlardır. Diğer mezhepler teorik olarak illet tespitini te'sîrle sınırlı tutmadıkları halde, ed-Debûsî ile başlayan eğilim onların fıkıh literatüründe de kaçınılmaz olarak bir dönüşüm başlatmıştır. Bir diğer ifadeyle hanefî teori, genel fıkıh düşüncesini değişime zorlamıştır. Te'sîr teorisinin, bu yönüyle, fıkıh düşüncesini inşa eden ve literatürü şekillendiren bir işlev gördüğü anlaşılmaktadır."
