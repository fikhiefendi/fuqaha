abstract: "Ebû Hanife'ye kadar re'y düşüncesi bireysel olarak kullanılır. O, Hocalarının uyguladığı akli yöntemleri sistemleştirerek, talebeleriyle beraber geliştirir ve hayatında tatbik eder. Kur'ân ve sünnet bütünlüğüne önem verir. Hadis kaynağı olarak öncelikle fakih hocalarının silsile yolunu benimser ve bu yolla gelen hadislere öncelik tanır. Sahâbe görüşlerinden dilediğini seçer, tâbiîn görüşlerini cerh ve tâdil ederek, onların görüşüyle kendi bakış açışını eşit görür. Talebeleriyle re'y metodunu geliştirerek, farazî olaylara da tatbik eder. Ebu Hânîfe re'y yöntemini dînin amelî konularına uygular. Bununla birlikte itikat meselelerinde görüşlerini insanlara aktarır. Kıyas ve istihsan'ı açık nassın bulunduğu konularda kullanmadığı gibi bunların olmadığı durumlarda nassların umumuna aykırı düşmemek kaydıyla insanlara dinin kolaylık yollarını göstermek amacıyla kullanır. Ebû Hanîfe'nin îtikadî ve ameli konulardaki te'vil yöntemine dair görüşleri Mâturîdî mezhebi yoluyla birçok kültürel alana ve coğrafyaya yayılarak benimsenir. Tez'de öncelikle Ebu Hanîfe'nin din anlayışı ortaya konulacak sonra bu anlayış çerçevesinde re'y metodunun kullanımı incelenecektir."
