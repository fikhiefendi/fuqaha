abstract: "İslami bankacılık sistemi işleyişi bakımından ekonomik krizlerden en az etkilenen sistemlerdir. Bu ise İslami bankacılığın sisteminde kullanılan yöntemler ile gerçekleşmiştir. Bu yöntemlerden biri olan finansal kiralama yatırımcıların daha uygun maliyetlerde ihtiyaç duyduğu varlık yararlanmasını sağlamaktadır. Finansal kiralamada sadece kiracı değil aynı zamanda kiralayanında pek çok avantajı bulunmaktadır. Finansal kiralama farklı kurumlarca uygulanmasına rağmen en fazla uygulanan yer faizsiz bankacılık olarak da tanımlanan katılım bankalarında uygulanmaktadır. Katılım bankalarında ciddi bir işleyiş payına sahip olan finansal kiralama daha fazla talep oluşturulabilir. Bu talebi oluşturmak için finansal kiralama sisteminin avantajları işleyişi artırmaktadır. Fakat bazı noktalarda sistemin işleyişinde problemler ortaya çıkmaktadır. Türkiye'de katılım bankacılığının yöntemlerinin konu edildiği bu çalışmanın amacı katılım bankaları nezdinde finansal kiralama yönteminin sektördeki yerini belirlemeye çalışmak ve buna yönelik katılım bankası çalışanlarının görüşlerini anlamlandırmaktır. Bu kapsamda yapılan araştırmaya katılım bankalarında çalışan 10 katılımcıya yarı yapılandırılmış görüşme soruları iletilmiştir. 5'i demografik olmak üzere 10 sorudan oluşan formdan elde edilen veriler nitel araştırma yöntemleri çerçevesinde incelenmiş betimsel olarak değerlendirilmiştir. Katılımcıların ifadelerinden finansal kiralamayı anlamlandırmak, finansal kiralamanın avantajları, dezavantajları, riskleri ile finansal kiralamanın katkıları ve öneriler şeklinde temalar belirlenmiştir. Katılımcıların finansal kiralama uygulamasına katılım bankalarının kuruluş dayanağı olarak görülen İslami hassasiyetleri göz ardı ederek profesyonel bir bakış açısıyla yaklaştıkları belirlenirken; avantajlar noktasında birbiriyle örtüşen ifadelere yer verdikleri dezavantajlı noktalar açısından ayrıştıkları saptanmıştır."
