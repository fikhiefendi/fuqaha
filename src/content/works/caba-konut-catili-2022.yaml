abstract: "Genel olarak kira sözleşmeleri günlük hayatımızda ve iş yaşantımızda hukuki olarak pek çok soruna yol açan sözleşme türlerinden olmakla, kira sözleşmelerinin sona erme halleri de sıkça karşılaştığımız kira sözleşmesi problemlerinden biridir. Hal böyle olduğundan kira sözleşmelerinin kiralayan tarafından ihtiyaç sebebi ile kira sözleşmesinin sona erdirilmesi, üzerinde durulması gereken önemli bir uyuşmazlıktır. Bu bağlamda tez konumuz günlük yaşantımızda da sıkça karşımıza çıkan, Türk Borçlar Kanunu'nda '' Konut ve Çatılı İşyeri Kiralarında Sözleşmenin Sona Ermesi'' başlığı altında kiraya verenden kaynaklanan nedenlerle kira sözleşmesinin sona ermesi hallerinden biri olan ''kiralananın kiraya verenin ihtiyacı nedeniyle'' tahliyesi (TBK m. 350/1) ve devamında ''yeni malikin gereksinimi'' (TBK m.351) nedeniyle tahliyesidir. Çalışmamızın birinci bölümünde; 6098 sayılı Türk Borçlar Kanunu'nun 350/1. maddesinde düzenlenen konut ve çatılı işyeri ihtiyacı sebebine dayanan tahliye davası başlığı altında konut ve işyeri ihtiyacı nedeniyle kira sözleşmesinin sona erdirilmesi, ikinci bölümünde Türk Borçlar Kanunu'nun 351. Maddesinde düzenlenen yeni malikin konut ve işyeri ihtiyacı nedeniyle kira sözleşmesinin sona erdirilmesi ve son bölüm olan üçüncü bölümde ise konut veya işyeri ihtiyacı sebebine dayanan kira sözleşmesinin sona erdirilmesinin sonuçları mevzuat, doktrin ve yargı kararları irdelenerek açıklanmaya çalışılacaktır."
