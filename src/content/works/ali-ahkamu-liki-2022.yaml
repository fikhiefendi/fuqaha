abstract: "Bu tezin konusu, İslam hukukunda boşama tasarrufunun şarta bağlanmsına dair hükümlerin tespitidir. Bu konu, özellikle boşanmaların arttığı ve yaygınlaştığı asrımızda önemlidir. Tezimiz bir giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu amaçları kaynakları ve problem durumu ile ilgili bilgi verilmiştir. Birinci bölümde talak hükümlerine dair genel bilgiler tespit edilerek değerlendirilmiştir. İkinci bölümde ise klasik ve modern çalışmalardan istifade edilerek, talakı talikin çeşitleri ve neticeleri ele alınmıştır. Çalışmada prensip olarak dört sünni mezhep çerçevesinde kalmakla beraber az da olsa yürürülükte olan dört sünni mezhebin dışına da çıkılmıştır. Çalışmada, tercihe şayan görüşe ulaşabilmek için alimlerin görüş ve delilleri sunulurken tahlil yöntemi kullanılmıştır."
