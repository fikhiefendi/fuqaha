abstract: "İslam medeniyetinin en temel özelliği ve dayanağı ilim geleneğine sahip olmasıdır. Tarihte alanında söz sahibi alimlerin gün yüzüne çıkmamış değerli eserleri vardır. Bu eserler ilim, kültür ve medeniyet değerlerimizin daha iyi anlaşılmasında bize ışık tutarlar. Osmanlı'nın yükselme devri alimlerinden Mahmut b. Süleyman el-Kefevî'nin“Ketâʾibü aʿlâmi'l-aḫyâr min fuḳahâʾi meẕhebi'n-Nuʿmâni'l-muḫtâr”isimli eseri alanında yazılmış ve ilim erbabınca takdir görmüş eserlerden biridir. Hanefî hukukçularının kronolojik biyografilerini konu edinen Ketâîb, hukuk tarihini ilk insan ve ilk peygamber Adem (as)'dan başlatarak sadece Hanefî hukuk tarihi değil insanlık hukuk tarihi özelliği taşımaktadır. Bu çalışmada ağırlıklı olarak Mâverâünnehir/Buhârâ hukukçularının yoğun olduğu bölüm ele alındığı için tezin adı“Kefevî'nin Ketâib'i Çerçevesinde Hanefî Mezhebinin Buhârâ Dönemi”şeklinde belirlenmiştir. Çalışmada öncelikle Kefevî ve eseri Ketâîb hakkında bilgi verilmiş sonrasında Buhârâ/Mâverâünnehir bölgesinde yaşayan fakihler merkeze alınarak, onlar üzerinden bir takım hukuki ve toplumsal tahliller yapılmaya çalışılmıştır. Aynı şekilde bu çalışmada fakihlerin görüşleri ve ürettikleri çözümlerden hareketle, ilgili dönemde Hanefî mezhebinin toplumsal sorunlara bakışı tahlil edilmiştir. Eser; dönemin ilmi seviyesi ve meselelere bakışı hakkında ciddi veriler sunmakta, günümüz ilim adamları için geçmiş ile bugün arasında mukayese imkânı sağlamaktadır."
