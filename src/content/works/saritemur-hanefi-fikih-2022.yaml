abstract: "İslam Hukuku, mükelleflerin gerek bireysel, gerek toplumsal çerçevede karşılaştıkları problemlere şer'î açıdan çözüm getirirken dinin korumayı hedeflediği bazı gayeleri ve temel prensipleri göz önünde bulundurur. Fıkıhta şer'i hüküm çıkarmanın en bariz yöntemi olan içtihat da temelde şeriatın maksatlarından müstağni düşünülemez. Bu faaliyeti gerçekleştiren müçtehidler İslamın ilk dönemlerinden beri hukuki uygulamalarda edindikleri usûlde belli başlı birtakım gayeleri göz önünde bulundurmuşlar ve mükelleflerin maslahatlarını, bunun da üzerinde şeriatın maksatlarını gerçekleştirmeyi önemsemişlerdir. İslâm hukukunda Makâsıdu'ş-şerîa olarak literatüre giren bu alanda dinin korumayı hedeflediği gayeler istikra usûlüyle belirlenmiş ve bundan sonra fıkhî çözüm üretmede önemli bir rol üstlenmişlerdir. Makâsıd içinde korunması gereken zorunlu gayeler kapsamında değerlendirilen hıfzu'n-nefs yani canın korunması, pek çok fıkhi meselenin çözümünde temel alınan önemli bir ilke olmasına karşın, bu ilkenin müstakil bir şekilde araştırılması geri planda kalmıştır. Bununla birlikte gerek klasik fıkıh eserlerinde gerekse bugün yapılan güncel çalışmalarda canın korunması ilkesine dair sınırları belli bir tanımlama veya tarifin de yapılmadığını görüyoruz. Bu noktada belki de mezhepler çapında ayrı ayrı çalışmaların yapılması ve canın korunmasıyla ilgili mezhep görüşleri göz önünde bulundurularak farklı tanım önerilerinin sunulması gerekecektir. Bizim bu çalışmadaki amacımız Hanefî mezhebini esas alarak canın korunması prensibini kavramsal çerçevede araştırmak, bu prensibin fıkhi meselelerde edindiği yeri tespit etmek, benzer terim ve kavramlarla ilişkisini açıklığa kavuşturmak ve neticede Hanefî mezhebi özelinde canın korunması ilkesini tanımlamaya çalışmaktır. İki ana bölümden meydana gelen tezimizin birinci bölümünde hıfzu'n-nefs kavramının yerleşik bir yer edindiği makâsıd teorisini ve bu teori içinde hıfzu'n-nefsi değerlendirecek, ikinci bölümde ise bu kavramla birlikte klasik Hanefî fıkhında canın korunmasını karşılayan diğer kavramları fıkhi meseleler çerçevesinde değerlendirerek uygun bir tanıma ulaşamaya çalışacağız."
