abstract: "Bankacılık sektörüyle karşılaştırıldığında oldukça kısa bir geçmişe sahip olan özel finans kurumlan, mali sektördeki gelişmelere de bağlı olarak önemli denebilecek bir konuma gelmiştir. Para ticareti yerine, mali ticaretine dayalı işlemlerin esas alındığı bu kurumların çalışma prensipleri açısından incelenmesi, hem Türk bankacılık sistemi hem de reel ekonomi için ne tür yenilikleri sunduğunu ortaya çıkaracaktır. Sermayenin uluslararasılaşmasının da etkisiyle, uluslararası mali piyasada daha yakından incelemeye alman bu kurumlar kalkınmakta olan ülkelere de yeni imkanlar sunmakta ve uluslararası sermayenin ülke kalkınmasında önemli görevler üstlenecektir. Bu çalışma ile ÖFK'lann temel ilkeleri ve faaliyetleri ortaya konulmaya çalışacak ve performansları irdelenecektir. ABSTRACT Although it has a short history comperative with banking system, private financial institutions have been taken important position with respect to the development of financial sector. The study of examination the operational principles of these institutions, wich take as subject basicly commodity transactions and operations, instead of money transaction, will shov the new passibilities for the Turkish Banking System and the real sector. We believe that these institutions which are closely examined in the international capital markets because of the effect of internationalization of capital, offer new possibilities for developing countries and also, will help for contributions of international capital for the development of these countries İn the study we try to examine the basic principles and the activities of these private financial institutions and also to appraise their performance. Ill"
