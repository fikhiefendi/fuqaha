abstract: "Tüm insanlığa gönderilen Kur'ân'ın Arap dilinde nazil olması öncelikle onun Arap dili çerçevesinde anlaşılmasını gerekli kılmaktadır. Bunun içindir ki daha ilk dönemlerden itibaren dilbilimsel tefsirler ortaya çıkmıştır. Kur'ân'ın başka dillere tercüme edilip edilemeyeceği yönündeki tartışmalar bir tarafa onun ana dili Arapça olmayanlar tarafından anlaşılabilmesi için bir gerekliliktir. Kur'ân'ı çevirmek içinse iyi bir Arapça bilgisine ihtiyaç duyulduğu kadar, iyi bir Kur'ân bilgisine de ihtiyaç vardır. Ayrıca kaynak dili hedef dile, doğru bir şekilde aktarmak, iki dili de çok iyi bilmeyi gerektirir. Kur'ân'ın mesajını muhatap kitleye iletme iddiası taşıyan her meal öncelikle kelime ve kavramları doğru çevirmelidir.“Fıkhın Terimleştirdiği Kur'ân Kelimelerinin Meâllerde Türkçeye Çeviri Sorunu”konulu Yüksek Lisans tezimizle özellikle fıkıh İlmi'nin kavramlaştırmış olduğu kelimelerin Türkçe Meâllere nasıl yansıdığı ve bu konuda ele alınacak meâllerde varsa yapılan hataların neler olduğu tefsirlerden yararlanılırak ortaya konulmaya çalışılmıştır."
