abstract: "Bu çalışma İslami bankalar için Bankacılık Sektörü Kırılganlık Endeksleri'ne dayalı Erken Uyarı Sistemlerini incelemektedir. Bu amaçla, 2008-2018 dönemine ait 12 ülkedeki 81 İslami bankadan verileri kullanılarak, İslami bankalar için çeşitli Bankacılık Sektörü Kırılganlık Endeksleri oluşturulmuş ve İslami bankacılık krizleri için yüksek tahmin gücü sonuçları üretecek Erken Uyarı Sistemi modelleri tespit edilmiştir. Erken Uyarı Sistemi modellerinin tahmin performansını iyileştirmek için önemli bankacılık risk faktörleri ve bu faktörleri ölçmek için kullanılan değişkenler belirlenerek İslami bankalar için sağlam bir Bankacılık Sektörü Kırılganlık Endeksi tanımı oluşturulmuştur. Bankacılık Sektörü Kırılganlık Endeksi tanımlarının Erken Uyarı Sistemi modellerinin tahmin gücü üzerindeki etkisi çeşitli endeksler oluşturarak incelenmiştir. Bankacılık Sektörü Kırılganlık Endeksi tanımları, hem İslami bankaların maruz kaldığı risk faktörleri hem de bu risk faktörlerini ölçmek için kullanılan değişkenler açısından farklılık göstermektedir. Sonuçlarımız, farklı Bankacılık Sektörü Kırılganlık Endeksi tanımlarının İslami bankaların maruz kalacağı bankacılık krizleri açısından farklı öncü göstergeleri belirlediğini ortaya koymaktadır. İslami bankalar için Erken Uyarı Sisteminin tahmin gücü, Bankacılık Sektörü Kırılganlık Endeksi tanımına oldukça duyarlıdır."
