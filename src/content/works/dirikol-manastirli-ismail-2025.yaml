abstract: "Tanzimat döneminde başlayan hukukî yenileşme sürecinin bir sonucu olarak 1878 yılında kurulan Mekteb-i Hukuk, klasik Osmanlı medrese sisteminden farklı bir eğitim anlayışı benimsemiştir. 1896 yılında bu kurumun müfredatına Kitâbü'n-Nikâh dersi eklenmiş, bu dersi Süleyman Sırrı Efendi ve daha sonra 1917 tarihli Hukuk-ı Aile Kararnâmesi'ni hazırlayan komisyonda yer alacak olan Mahmud Esad Seydişehrî okutmuştur. Manastırlı İsmail Hakkı ise bu kurumda doğrudan nikâh dersini vermemekle birlikte fıkıh dersi hocalığı yapmış ve nikâh dersinin müfredata eklendiği dönemde Vesâilü'l-Felâh fî Mesâili'n-Nikâh adlı mecelle üslubuna sahip ilk aile hukuku eserini kaleme almıştır. Bu çalışmanın temel amacı, Manastırlı İsmail Hakkı'nın nikâh ve talâk konularına dair kaleme aldığı bu önemli eserinin transkripsiyon yoluyla literatüre kazandırılmasıdır. Çalışmanın bir diğer amacı ise, 1917 tarihli Hukuk-ı Aile Kararnâmesi'nde ihtiyaç ve zaruret gerekçesiyle Hanefî mezhebi dışından benimsenen hükümlerin, Kararnâme'den önce telif edilen eserlerde ne ölçüde yer bulduğunu; ayrıca farklı mezheplerden hüküm alma gerekliliğinin dönemin ilmî çevrelerinde tartışılıp tartışılmadığını ortaya koymaktır. Bu bağlamda, Manastırlı İsmail Hakkı'nın Vesâilü'l-Felâh fî Mesâili'n-Nikâh adlı eseri merkezî kaynak olarak ele alınmış; çalışmanın kapsamını genişletmek ve geçerliliğini artırmak amacıyla Mahmud Esad Seydişehrî ile Süleyman Sırrı Efendi'nin ilgili eserleri de Hukuk-ı Aile Kararnâmesi ile karşılaştırmaya dâhil edilmiştir. Ayrıca, bu çalışma ile Osmanlı Devleti'nin son döneminde Hanefî mezhebine bağlılığın hem ilmî eserlerde hem de hukukî uygulamalarda ne ölçüde sürdüğünün tespit edilmesi de amaçlanmaktadır."
