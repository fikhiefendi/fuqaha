abstract: "Osmanlı şehirlerinde kadılar tarafından tutulan ve mahkeme kayıtlarını ihtiva eden defterlere Kadı Sicilleri denir. Bu siciller, Osmanlı toplumunun ekonomik, askeri ve kültürel yapısının araştırılmasında birinci dereceden öneme sahip belgelerdir. Sahip oldukları zengin muhteva dolayısıyla şehir tarihi hakkında yapılan birçok çalışmanın ana kaynağını oluşturmaktadırlar. Kadı Sicilleri'nin ana kaynak olarak kullanıldığı bu çalışmada 1600-1620 yılları arasında Trabzon'da yaşanan asayiş olayları değerlendirilmiştir. Gerek toplum içerisinde münferit olarak gerekse de grup halinde yaşanan olaylar değerlendirilmek suretiyle, bir Osmanlı şehri olan Trabzon örneği üzerinden Osmanlı toplumunun içerisinde bulunduğu durum gösterilmeye çalışılmıştır. Çalışma üç bölümden oluşmaktadır. Birinci bölümde İslam ceza hukuku incelenmiştir. Bu bölümde İslam hukukunda suç ve cezanın mahiyeti hakkında bilgi verilerek had, kısas ve tazir cezası gerektiren suçlar incelenmiştir. İkinci bölümde Osmanlı hukukunun şer'i ve örfi yönü, Şer'iyye mahkemeleri ve bu mahkemelerde davaların nasıl görüldüğüne dair bilgiler verilmiştir. Üçüncü ve son bölümde ise kuruluşundan 17. yüzyılın ilk yarısına kadar Trabzon'un siyasi tarihi hakkında bilgi verildikten sonra, toplum içerisinde gerek münferit gerekse de grup halinde görünen ve şehirdeki asayiş ve güvenliği etkileyen olaylar incelenmiştir"
