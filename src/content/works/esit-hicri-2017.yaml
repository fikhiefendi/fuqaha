abstract: "Şâfi'î fıḳıh usulünün gelişimi, hicri III. yüzyılda Şâfi'î ve onun ilk nesil öğrencilerinin çalışmaları ile başlamıştır. İlk nesil Şâfi'îler, Şâfi'î'nin düşüncesini iḫtiṣar etme, savunma ve farklı ilmi disiplinlere aktarma suretiyle Şâfi'î fıḳıh uṣûlünün fikrî gelişiminde etkili olmuşlardır. İlk nesil Şâfi'îlerin öğrencileri olan Dört Muḥammed (Ebû Ca'fer et-Taberî, Ebû 'Abdillâh el-Mervezî, İbn Ḫuzeyme, İbnu'l-Munẕir) gerek fikrî gerekse de coğrafi olarak Şâfi'î fıkıh uṣûlünün gelişimini sürdürmüşlerdir. Hicri IV. yüzyılda 'Irâḳ bölgesine aktarılan Şâfi'î fıḳıh uṣûlü buradaki kelâmî ve felsefî hareketlerden etkilenmiştir. 'Irâḳ bölgesinde müstakil uṣûl metinleri dışında er-Risâle şerhleri üretilmiştir. Günümüze ulaşan uṣûl metinleri, 'Irâḳ bölgesindeki fıḳıh uṣûlünün kavramsal ve içeriksel olarak geliştiğini göstermektedir. Hicri IV. yüzyılda ehl-i ḥadîå tarafından Ḫorâsân bölgesine aktarılan Şâfi'î fıḳıh uṣûlü rivayet eksenli bir gelişim göstermiştir. 'Irâḳ bölgesinde başlayan Eş'arîlik kısa sürede Ḫorâsân Şâfi'îleri tarafından karşılık bulmuştur. Bu durum Eş'arî ve Şâfi'î'nin farklılaşan fıkıh uṣûlü görüşleri etrafında fikrî bir krizin oluşmasına ve bu krizin V./XI. yüz yıl boyunca sürmesine zemin hazırlamıştır. Şâfi'î'nin öğrencilerinin başlattığı Şâfi'î uṣûl düşüncesinin alanını genişletmesi Ḫorâsân bölgesinde devam etmiştir. Ḫorâsân bölgesindeki ehl-i ḥadîå Şâfi'î'nin teorisini savunmak, temellendirmek ve güncel tutmak için ḥadîå tasniflerinde bulunmuştur. Ehl-i ḥadîå bununla da yetinmeyerek Ḫorâsân'da Şâfi'î'nin er-Risâle'sine dair ilk şerḥ çalışmalarında da bulunmuşlardır. Ḫorâsânlı Eş'arî-Şâfi'îler ise, metin düzeyinde Şâfi'î fıḳıh uṣûlü literatürüne katkı sağlamışlardır. Horâsân'daki Şâfi'î fıḳıh uṣûlü fikirsel olarak da gelişim kaydetmiştir."
