abstract: "Bu çalışma, İbn Haldun ve Niccolò Machiavelli'nin siyasal düşüncelerindeki iktidar tasavvurlarını ve düşünürlerin siyasal iktidarın dizginlenmesine dair görüşlerini karşılaştırmalı olarak incelemektedir. Siyasal iktidarın kurulumunda reel-politiğe ve güç siyasetine yönelik benzer yaklaşımlara sahip olmaları, İbn Haldun ve Machiavelli'nin politik düşüncelerinin doğu despotizmi ve mutlakiyetçi yönetimle nitelendirilmesine neden olmuştur. Siyasi düşünce tarihi üzerine yapılan kuramsal çalışmamızda, kamu düzeni ve istikrar için siyasal iktidarın zorunluluğu kadar, iktidarın yozlaştırıcı karakteri nedeniyle politik gücün; ortak iyi (kamu yararı/maslahat), siyasal katılım, karma anayasa, mülkiyet hakları, doğal hukuk, herkes için geçerli ilahi ve beşeri yasalar, adalet ve genel ahlak ilkeleriyle dizginlenmesine yönelik kadim entelektüel çaba ve kavramların, benzer biçimde İbn Haldun ve Machiavelli'nin eserlerinde de işlendiği gözlemlenmiştir. Orta Çağ politik geleneğiyle benzer önermeler taşıyan İbn Haldun'un siyasal düşüncesinde iktidarın dizginlenmesi, iyi, adil ve meşru yönetim anlayışı bağlamında değerlendirilerek bunların; herkes için geçerli olan ilahi ve siyasi yasalar, Muhammedi sünnet, maslahat (kamu yararı) makâsıdü'ş-şerîa, adalet ilkesi, mülkiyet dokunulmazlığı, yaşam hakkı, angaryanın reddi, halkın refah ve mutluluğu, koşullu itaat, toplumsal norm ve ahlak kurallarından oluştuğu anlaşılmaktadır. Antik Yunan ve Roma döneminden ilham alan Machiavelli'nin siyasal düşüncesinde ise iktidarın dizginlenmesi, istikrar ve topluluk özgürlüğü bağlamında yorumlanmış ve bunların; pozitif yasalar, karma hükümet şekli, mülkiyet, yaşam hakkı ve ortak iyi anlayışından geliştirildiği anlaşılmaktadır."
