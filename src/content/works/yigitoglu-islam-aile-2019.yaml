abstract: "Tarihten günümüze, dünyanın birçok coğrafyasında hak kavramının kaynağı ve mahiyeti hep tartışılan bir konu olmuştur. Çünkü insan için en önemli hususlardan biri olan hakkın uygulanmasında hep sorunlar yaşandığı gözlenmiştir. Zira insanlar tarafından meydana getirilen kanunların hak tespitinde kifayetsiz kaldığı ve bunların uygulamasında yine tarafların adil davranamadığı ortaya çıkmıştır. İnsan hakları, onu en iyi tanıyan Yaratıcısı tarafından tam olarak belirlenmiştir. Toplumlara gönderilen peygamberler kendi kavimlerine hakkın hakiki mahiyetini anlatsa da dinlerin tahrif edilmesiyle insanlık bu hakikatten uzaklaşmıştır. İslam ile birlikte bu kavram esas tanımına kavuşmuştur. Böylelikle, hiçbir mağduriyet oluşmayacak şekilde hak kavramı, tanımını ve mahiyetini bulmuştur.“İslam Aile Hukuku'nda Kadının Hak ve Sorumlulukları”başlığı ile ele alınan bu çalışma, İslam aile hukukunda kadına ait hak ve sorumlulukları dengeli bir şekilde belirlemeyi çalışmıştır. Ayrıca Medeni Kanun'da yer alan bazı hususlar İslam Hukuku ile karşılaştırılarak birtakım farklar ile benzerlikler genel bir çerçevede sunulmuştur. Dört bölüme ayrılarak ele alınan bu çalışmanın birinci bölümünde hak ve sorumluluk kavramlarının sözlük, terim anlamları ele alınarak, Kur'an-ı Kerim ve Hadislerdeki manaları, ile bu kavramların ortaya çıkışı anlatılmaya çalışılmıştır. İkinci bölümde kadının evlilik öncesindeki hak ve sorumlulukları incelenmiştir. Üçüncü bölümde kadının evlilikteki hak ve sorumluluklarından olan Hüsn-i Muamele, Mehir, Nafaka, Cinsel İlişki, Çocuk sahibi olma, Eğitim, Seyahat vb. gibi hususlar örneklerle zikredilmiştir. Nihai kısım olan dördüncü bölümde kadının evlilik sonrasındaki yani boşanmayla ilgili hak ve sorumluluklarının yanında evliliğin vefatla bitmesi neticesindeki hak ve sorumluluktan bahsedilmiştir. İslam hukukunda hak kavramının genellikle tek başına ele alınmayarak sorumluluklar ile birlikte zikredildiği anlatılmaya çalışılmıştır. Çünkü hak kelimesinin, yükümlülük ve sorumluluk anlamı taşıması bu iki mefhumun iç içe girmiş kavramlar olduğunu göstermektedir. Ayet ve hadislerde belirtilen Allah hakkı, anne-baba hakkı gibi ifadeler aslında kişinin sorumluluklarını bildirmektedir. Böylelikle hak ve yükümlülüklerin karşılıklı olduğu ortaya çıkmaktadır."
