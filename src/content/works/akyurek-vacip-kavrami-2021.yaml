abstract: "Çalışmada Cessâs'ınel-Fusûl ve Ahkâmu'l-Kur'ân'ındavâcip bağlamında usûl-fürû tutarlılığı araştırılmıştır. Genelde telif edilen usûl eserleri ve fürû kitaplarının tutarlılık noktasında eksik olduğu iddia edilir. Bu çalışmada usûl ve fürûa dair iki eserde vâcibe dair yer alan bilgiler sunulmuş, bilgiler usûl-fürû bağlamında mukayese edilerek değerlendirmeye tâbi tutulmuştur. Araştırma üç bölümden teşekkül etmekte olup; birinci bölüm Cessâs'ın hayatı ve eserlerini, ikinci bölüm; genel olarakvâcip kavramını ve el-Fusûl'devâcip kavramını, üçüncü bölüm ise Ahkâmu'l-Kur'ân'davâcibi ve el-Fusûl ve Ahkâmu'l-Kur'ân'daki verilerin usûl-fürû tutarlılık analizini kapsamaktadır. el-Fusûl veAhkâmu'l-Kur'an'da yer alan; sünnetten kaynaklanan vâcipler, emir-vücûb ilişkisi, müvessâ, muvakkat ve muhayyer vâcip gibi konulara ilişkin verilerin birbirine muvâfık olduğu, eserler arasında tutarlılığın bulunduğu, doğrudan ya da dolaylı biçimde çelişki olarak nitelendirilebilecek bir durumun bulunmadığı görülmektedir. Cessâs'ınel-Fusûl ve Ahkâmu'l-Kur'ân'ındavâcipbağlamında usûl-fürû tutarlılığı isabetli biçimde yansıtıldığı tespit edilmiştir."
