abstract: "Ekonomik faaliyetler, toplumda insan ilişkilerinin bir parçası olduğundan toplumların bu faaliyetlerini doğrudan ya da dolaylı olarak etkileyen siyasi, dini, kültürel ve ahlaki boyutu incelenmelidir. İktisadi olayların kültürel değerlerle desteklenmesi ile toplumsal refah düzeyinin maksimuma ulaşmasının ilişkisi sebebiyle, bu çalışmada, Geleneksel iktisat teorilerinin gelişmesinde rol oynayan toplumsal nedenler topluca araştırılmış ve iktisadi düşüncenin gelişiminde önemli yer tutan iktisadi faaliyetlerin tarihi yine topluca incelenmiştir. Bu incelemenin gayesi iktisadi düşünce tarihinin ya da iktisat teorisinin gelişiminin ayrıntısını ortaya koymaktan ziyade teorilerin arkasındaki zihniyetlerin etkilerini ve zihniyet değişimlerinin sonuçlarının incelenmesidir. Çalışmada, Geleneksel iktisadi doktrinlerin zihniyet yapısının etkisinin tarihsel araştırması eski uygarlıkları içerirken, yerleşik iktisadın gelişimine katkıda bulunan alanlar, güncel iktisat literatürüne kadar bazı örneklerle ortaya konmuştur.“Neoklasik doktrine nispeten dayandığı esasları gevşetilmiş”Yeni iktisatta, yerleşik iktisattan daha yoğun matematik ve kurgusal modeller kullanılmaktadır. Bu nedenle, bu çalışma, yerleşik veya yeni olsun,“gerçekleri yansıtmayan ve sorunlara çözüm üretemez hale gelmiş olan iktisadı”,“Geleneksel İktisat”olarak nitelendirmiştir. Bunda İktisat Teorisinin fazlasıyla transdisipliner bir alan haline gelmesinin de bir payı vardır. Çalışmada, çeşitli bilim dallarında yaşanan gelişmelerin İktisat Teorisine yansımaları hakkında kısaca bilgi verilmiştir. Geleneksel iktisat teorisinin zihniyet esaslarının ağırlıklı olarak Batı'nın dünya görüşünü yansıtmasının çalışmanın bütünlüğüne ilişkin nedenlerine değinilmiştir. Geleneksel iktisadi zihniyetin teşkil ettiği sistemlerin yanlış varsayımlarından temizlenmesi gerektiği ve iktisadi tercihleri yapan, faaliyetleri gerçekleştiren“insan”kabulünün gözden geçirilmesinin iktiza ettiğine değinilmiştir. İktisat teorilerinin bazını oluşturan yapının, Batı dünyasının ekonomik ve sosyal gelişimi anlaşılmadan analiz edilmesi zordur. Çünkü Geleneksel iktisat teorileri Batı'nın iktisadi sorunlarına çözüm arayışından ibarettir. Atılgan'ın ifade ettiği gibi, günümüzde Batının yaşadığı ekonomik çıkmaz devam etmektedir. Greenspan'in“birisi insan doğasını değiştirmek için bir yol bulmazsa başka krizler de göreceğiz”ifadesini dile getiren İşler, Greenspan'in krizlerde insan doğasından başka ortak hiçbir nokta bulunmadığını söylediğini ifade etmiştir. Batı ekonomileri aşırı tüketim ve israf üzerine kurulu bir yapıya sahiptir. Çünkü hâkim olan zihniyet“çoğu aza tercih eden”,“kendi menfaatini her şeyin üstünde tutan”bir homo sapiens'i kabul ettiği için“itidalli olma”hali mümkün değildir. Materyalist ve Liberal Felsefenin güç aldığı“Evrimci kabul”e dayanan Geleneksel iktisadi zihniyete göre bir“Homo Sapiens iktisadi ortamda bir Homo Economicus'tur”. Çalışmada, Ahiret inancını inkâr edecek homo economicus'un tüm hedefinin azami ve peşin dünyevi menfaat olacağına dair açıklama yapılmıştır. Homo economicus aksiyomlarının geçerliliği üzerine literatürde genel olarak yapılan eleştiriler çalışmanın ilgili bölümlerinde verilmiştir. Aksiyomların geçerliliği, her üç Ortadoğu dini-Musevilik, Hıristiyanlık ve İslam- açısından ayrıca analiz edilmiştir.“Geleneksel iktisat literatürü, bağlı olduğu varsayımların geçerliliğini sorgulamakta ve teorilerin gerçekleri açıklamadığının farkına varmaktadır. Ancak genel olarak literatür, sorunu kökten halletmemekte ısrarlı olduğundan varsayımlarını, ”sorunlu“, ”sınırlı“, ”güçlü/güçsüz“ gibi adlandırmalarla gevşetmekten öteye gidememektedir. Kazgan, iktisadi zihniyetin insan davranışları ile ilgili varsayımları Doğal Kanun felsefesine dayanan ve insan aklı ile kainatın kanunlarının bulunabileceği görüşünü kabul eden, iktisadi liberalizm felsefesinin ürünü olduğunu ifade etmiştir. Salt akılcılık ve deneycilikten etkilenen iktisadi liberal görüşe dayanarak iktisatçılar, kendi duyuları ve mantıklarını kullanarak saptadıkları gözlemleri, insan davranışları ile ilgili varsayımlar yapıp, gerçekleri hangi ölçüde açıkladığı belirsiz teoriler kurarak, evrenselliğini iddia etmişlerdir. Kazgan'ın deyişiyle, varsayımların gerçekleri yansıtması konusunda araştırma yapılmazsa iktisatçılar istedikleri varsayımları yapabilirler. ”Tabii ve Toplumsal Kanunların evrenselliği“ iddiasının iktisada yansıması ”gerçekte evrensel olan Semavi dinlerin iktisadi doktrinlerine“ karşıt alternatif olarak getirilmiş bir görünüme sahiptir. Bu görüşün iktisat teorisine yansıması aslında bu çalışmada homo economicus aksiyomlarının analiz edilmesinde de görülebileceği gibi birtakım ”ifade edilmeyen ya da gizlenmiş aksiyomlar“ içermektedir. Çalışmada İşler'in açıkladığı ”gizli varsayımlar“a yer verilmiştir. Ancak çalışmanın bütünlüğü göz önüne alındığında ”gizlenmiş aksiyomlar“dan kasıt İşler'in mantıksal bütünlük ile çıkarmış olduğu ”gizli varsayımlar“ ile ilgili değildir. Bu çalışmanın bütününe müteallik öne sürülen aksiyomlar ”ifade edilmeyen aksiyomlar“ olarak adlandırılabilir. Geleneksel iktisat teorisinin kabulüne göre iktisadi insanın aksiyomlarından özellikle birbirini gerektiren ve bütünleşen ”doyumsuzluk“, ”bencillik“ ve ”rasyonellik\" in bir arada gerektirdiği iktisadi tercih ve davranış biçimi Ortadoğu dinlerinin iktisadi doktrinlerinin kabul ettiği insan görüşüne ters düşmektedir. Homo economicus varsayımı ağırlıklı olarak Batı'nın zihniyetine dayalı esaslardan güç almaktadır. Bu zihniyetin fiiliyata geçtiği ve etkin olduğu coğrafyalarda ciddi ekonomik ve sosyal krizler yaşanmakta ve sorunun kaynağı kavranamamakla birlikte çözüm getirmeyen hafif modifiye olmuş alternatifler üretilmektedir. Sorunun çözümü ile ilgili öneri ve Geleneksel sistemdeki yanlışlıklar ve bulgular tezin ilgili bölümlerinde ve ayrıca Sonuç bölümünde açıklanmıştır."
