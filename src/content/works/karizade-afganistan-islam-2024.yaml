abstract: "VII. yüzyılda bugünkü Afganistan'ın da içinde bulunduğu Horasan bölgesinin İslamiyet'le tanışmasıyla beraber o dönemde mevcut olan dinlerin yerini İslam dini ve uygulanan hukuk sistemlerin yerini İslam hukuku almıştır. İslam dünyasında mezheplerin oluşmasıyla beraber Afganistan bölgesinde Hanefî fıkhı yaygınlık kazanmıştır. Hanefî fıkhı hem yargı hem fetvada önemli rol oynamıştır. Sultan Mahmud Gazneli döneminden itibaren mahkemelerde kullanılmak üzere fetva türü eserler, tedvin edilip kanunlaştırılmaya başlansa da özellikle aile hukuku alanında reformsal kanunlaştırma hareketi Emanullah Han döneminde (1919-1929) başlatılmış ve Nizâmnâme-i Nikâh adıyla reformsal kanun çıkartılmıştır. Emanullah Han sonrası aile hukuku alanında 1977 yılına kadar çıkartılan kanunların muhtevası dar ve Hanefi mezhebine bağlı kanunlardır. 1977 yılında Hanefi mezhebine ağırlıklı olarak yer vermekle beraber diğer İslami mezhep ve görüşlere de yer veren Afgan Medeni Kanunu çıkartılmıştır. Söz konusu kanun, yürürlüğe girdiği tarihten itibaren Afganistan yönetiminin Taliban tarafından ele geçirilinceye kadar (2021) yürürlükte kalmıştır. Taliban döneminde Afgan Medeni Kanunu'nun resmi olarak yürürlükten kaldırıldığı ilan edilmese de mahkemelerde şuan sadece Hanefi fıkhı uygulanmaktadır."
