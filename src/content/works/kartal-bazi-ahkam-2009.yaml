abstract: "Muhammed Abduh (1849?1905), XIX. Asırda yetişen İslâm âleminin ünlü simalarındanbiridir. Abduh çağın meselelerini değerlendirirken yaptığı yorumlarla kendinden sonra gelen birçokçağdaş İslam âlimini de etkilemiş bir şahsiyettir. Bu özelliğinden dolayı biz de çağımızda tartışılanbirçok İslami konuya ışık tutacağı ümidiyle onun hayatını ve bazı fıkhı mevzulara yaklaşımınıincelemeyi uygun bulduk.Onun fikirlerinin perde arkasını bize gösterir niyetiyle tezimizin giriş kısmında hayatını elealdıktan sonra I. Bölümde Müslümanların batı karşısında bu kadar geri kalışlarının asıl sebebi olarakgördüğü atalar dinine körü kürüne bağlanıp dinin aslından uzak kalmalarını ifade için kullandığıgeleneği taklit etme ve içtihat mevzusuna yaklaşımını inceledik. İkinci bölümde ise batıyla yüzleşmesonrası sıkça tartışılan fıkhî konulardan bazılarını ela alarak Abduh'un bu konulardaki yaklaşımını vekendinden sonraki birçok İslam âlimini etkileyen görüşlerini ele almaya çalıştık.Müslümanların XIX. Yüzyıldan beri batı karşısında kendi konumlarını gözden geçirmesürecinde tartışılan konular bir tezin alanına sığmayacak kadar geniş olduğundan en çok tartışılankonulardan sadece bazılarını ela almak suretiyle konumuzu sınırlandırmak zorunda kaldık."
