abstract: "İcma; dinin anlaşılması ve sabitelerinin belirlenmesi noktasında oldukça önemli fonksiyonlara sahip, İslam Hukuku'nun temel delillerindendir. İcmanın şer'i bir delil olduğu konusunda tam bir görüş birliğinden söz edilebilir. Bununla birlikte; fakihlerin icma tanımları, icmanın gerçekleşme şartları, vuku bulup bulmadığı gibi çeşitli meseleler üzerinde oldukça ayrıntılı ve tartışmalı görüşler yer almaktadır. Bu araştırmada, Serahsi'nin el-Mebsut adlı eserinin kitabu'l-büyû' bölümünden tespit ettiğimiz icma kavramları incelenecektir. Bu amaç doğrultusunda, öncelikle klasik usul eserlerinde yer alan icmanın tanım ve mahiyeti hakkında genel bilgilere yer verilmiştir. El-Mebsut adlı eserde yer alan icma kavramları tespit edilerek bunlar klasik metinlerle karşılaştırılmıştır. Bu aşamada Hanefi mezhebinin usul ve füru eserlerinden faydalanılmıştır. Sonuç olarak; klasik usul eserlerinde yer alan icma tanımlarıyla füru eserlerinde geçen icma lafızlarının birbirine mutabık olduğu tespit edilmiştir."
