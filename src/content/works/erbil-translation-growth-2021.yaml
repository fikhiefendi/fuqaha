abstract: "On altıncı yüzyıl, Avrasya'da önemli siyasi, sosyal, entelektüel, dinî, bürokratik ve askerî yeniliklere ve dönüşümlere sahne olan kritik bir zaman dilimidir. Osmanlılar da bu dönemde arşiv ve kayıt tutma uygulamalarındaki ilerlemeler örneğinde görülebileceği gibi yukarıda belirtilen alanların çoğunda radikal değişimler yaşadılar. Bu değişim örneklerinin belki de en önemlisi, mistik beklentilere dayalı evrensel egemenlik iddialarının azalmasından sonra hukuka artan vurgunun gözlemlenmesidir. Osmanlı siyaset düşüncesinin bu tür bağlamsal değişikliklere üslup ve dilinin düzenlenmesi ve yeni söylemler geliştirilmesi ile yanıt vermesi beklenmektedir. Nitekim, böylesi bir cevap on altıncı yüzyıl Osmanlı siyaset literatüründe fıkhi-hukuki vurgunun artmasında gözlemlenebilir. Bu tez, Osmanlı fıkhi-siyasi düşüncesinin temsilcisi sayılabilecek birincil kaynakları bir bağlam içerisine oturtmakta ve bu vurgunun on altıncı yüzyıl boyunca nasıl ve neden yaygınlaştığı sorusunu ele almaktadır. Bu olguyu anlamak üzere, vurgunun gözlemlenebileceği kaynakları veya türleri incelemekte; dönemin daha geniş dinî, siyasi ve entelektüel bağlamlarını göz önüne almakta; ve 1516-1517'deki Osmanlı fetihlerini takiben Osmanlı-Arap karşılaşmasının kültürel ve entelektüel boyutlarına, özellikle Memluk fıkhi-siyasi risalelerinin Osmanlı çevirilerine odaklanmaktadır. İncelemeye konu olan risaleler ise Tarsūsī'ye (ö. 1357) ait Tuhfetü't-Türk ve Hayrbeytî'ye ait ed-Dürretü'l-Garrā başlıklı eserlerin üç adet on altıncı yüzyıl Osmanlı çevirileridir."
