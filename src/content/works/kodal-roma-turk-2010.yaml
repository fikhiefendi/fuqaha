abstract: "Tez çalışmamızın konusu olan kira sözleşmesi,Türk Hukuk Sisteminde kullanma veyararlanma hakkı veren sözleşmeler grubuna girmekte olup rızai nitelikte birsözleşmedir.Roma Hukuku'nda kira sözleşmesi, locatio conductio sözleşmeleri kapsamındalocatio conductio rei adı altında düzenlenmiş olup niteliği ve unsurları yönünden busözleşmenin Türk Borçlar Kanunu'ndaki kira sözleşmesine ilişkin düzenlemelerin temelinioluşturduğu kabul edilmektedir.Türk Borçlar Hukuku'muzda kira sözleşmesinin konusunu taşınır mallar,taşınmazlar,haklar ve ekonomik değerler oluşturur.Roma Hukuku'nda kira sözleşmesinin konusunu taşınırlar, taşınmazlar, evler,odalar,ayrıca Türk Borçlar Hukuku'ndan farklı olarak köleler oluştururdu.Roma Hukuku'nda da kira sözleşmesi, rızai nitelik taşıyan bir sözleşme olarak kabuledilmekteydi.Sözleşmenin kurulmuş sayılması için karşılıklı ve birbirine uygun rızalarınaçıklanması yeterli idi.Borçlar Kanunu'muzda düzenleniş şekli itibariyle kira sözleşmesi ivazlı birsözleşmedir.Kiralayan bir şeyin kullanılmasını kiracıya terk ederken kiracı da bu şeyikullanma karşılığında bir ücret ödemektedir. Kiracının ödediği bu ücrete kira parası veyadiğer bir deyişle kira bedeli denmektedir.Roma Hukuku'nda da Türk Hukuku'nda olduğu gibi kira sözleşmesinin ivazlı birsözleşme olması esası benimsenmişti. Taraflardan kiracı (conductor) her zaman bir ücret(merces) ödemekte, diğer taraf kiraya veren(locator) ise bir şeyin kullanılmasını teminetmekteydi. Kiracının ödemekle mükellef olduğu ücrete merces denirdi.Türk Borçlar Hukuku'nda kira sözleşmesi tam iki tarafa borç yükleyen sözleşmeniteliğindedir.Bu sözleşmeyle kiralayanın ,kiralananı sözleşmede öngörülen kullanmayaelverişli durumda teslim ve muhafaza borcu,kiralananı sözleşme süresince öngörülenkullanmaya elverişli bulundurma borcu,ayıba karşı tekeffül borcu,zapta karşı tekeffül borcuve kiralananın vergi ve giderlerini ödeme borçlarına karşılık kiracının da kiralananıkullanması karşılığında kira parasını ödeme kiralananı özenle ve tahsis amacına uygunolarak kullanma, aynı bina içinde oturanlara saygı gösterme, kiralananın iyi bir durumdamuhafazası için özen gösterme ve gereken ihbarları yapma, kiralananda zorunlu tamiratınyapılmasına ve kiralananın gezilmesine müsaade etme kiralananı kira sözleşmesinin sonundageri verme gibi borçları bulunmaktadır.Roma Hukuku'nda da kira sözleşmesi, tam iki tarafa borç yükleyen bir iyiniyet sözleşmesi niteliğindedir.Kiraya veren(locator) kira konusu şeyi karşı tarafa(conductor)sözleşmeye uygun olarak vermeye ve sözleşme boyunca kiralananı kira sözleşmesineuygun şekilde tutmaya mecburdu. Diğer bir anlatımla kiralayan kira konusu şeyi kirayauygun olarak kullanılacak şekilde vermek ve bu şekilde tutmak zorundaydı. Eğer kiracı busorumluluğunu yerine getirmezse ve bilerek iyi niyetli davranmazsa , kiralayan sözleşmedendoğan yükümlülüklerinden dolayı tazminat ödemek zorunda kalırdı.Buna karşılıkkiracı(conductor) ise kira ücretini ödemeli, kiralanan şeyi ancak kira sözleşmesinde belirlenentarz ve ölçüde ve kiralanana zarar vermeden kullanmalı, kiralayanın (locator) rızasınıalmadan kiralanan şeyin asli şeklini bozacak veya değiştirecek herhangi bir değişiklikyapmamalı idi.Roma Hukuku'nda da kiraya verenin (locator) en önemli hakkı kira ücretinitalep etme hakkıdır Ayrıca yine Borçlar Kanunu'muzdaki hapis hakkına benzer şekildeödenecek olan kira bedelinin teminatı olarak kiralanan mala kiracının(conductor) getirdiğieşyalar üzerinde kanuni rehin hakkı da vardı.Kira sözleşmenin sona ermesi ise hukukumuzda Türk Borçlar Hukukuhükümlerine göre olabileceği gibi özel düzenleme olan 6570 sayılı Taşınmaz KiralarıHakkındaki Kanun'un hükümlerine göre de olabilir.Aynıca taşınmazın belediye teşkilatı bulunan yerlerde veya belediye teşkilatıolmasa dahi iskele, liman ve istasyonlarda bulunması durumunda uygulama alanı bulan 6570Sayılı Gayrimenkul Kiraları Kanunu'nun 7. maddesine göre de kiralayan kendisinin,eşininveya çocuklarının konut veya işyeri ihtiyacının bulunması, kiralanan taşınmazın yeniden inşaedilmesi veya imar amaçlı ve esaslı olmak şartıyla tamir,tevsi veya tadil edilmesi sebeplerinedayanarak,kira sözleşmesi devam ederken kiralananı iktisap eden yeni malikin ise konut veyaişyeri ihtiyacı ile Borçlar Kanunu'nda belirtilen diğer şartların da bulunması halinde kirasözleşmesi sona erdirilebileceği gibi kiracının kira sözleşmesi yapılmadan önce yazılı olaraktahliye taahhüdünde bulunduğu halde kiralanandan çıkmaması, kiracının aynı kira dönemiiçinde kira parasını ödememesi nedeniyle iki haklı ihtar çekilmiş olması, kiracının veyaeşinin aynı şehir veya belediye hudutları içinde oturabileceği konutu olması durumlarındaBorçlar Kanunu'nda belirtilen diğer şartlara da uymak suretiyle kira sözleşmesini sonaerdirebilirRoma'da M.S 214 yılında İmparator Caracalla yayınladığı bir emirname ile kirabedelini muntazam ödeyen kiracının mal sahibi tarafından sebepsiz olarak çıkartılamayacağıkabul edildi. Bu düzenleme kiracıyı (conductor) koruyan bir düzenleme idi.Iustinianus yenimalik veya mal sahibine, taşınmaz malı bizzat kullanmak zorunda olduğunu ispat ederek veyaevi tamir ettirecek ise veya kiracı kiralanan malı fena kullanıyorsa çıkartma hakkını tanıdı.Bu düzenlemeler yukarda bahsettiğimiz 6570 Sayılı Kanun'un 7. maddesinde sayılan kiracıyıtahliye sebepleri ile büyük oranda benzerlik göstermekte idi. Roma Hukuku'nda kirasözleşmesinde(locatio conductio rei) taraflar borçlarını yerine getirdiği durumdasözleşmesinin tarafı olan şahsın kişiliğinin dikkate alınması söz konusu olmadığındantaraflardan birini ölümü halinde kira sözleşmesi sona ermezdi."
