abstract: "Bu çalışma toplumun sınırlarında yaşayan marjinallerin yasadışı eylemlerinden hareketle Osmanlı toplumuna farklı bir açıdan bakmayı amaçlamaktadır. Suç konusu toplumsal, ekonomik ve idari yaşamı etkileyen suçlar olmak üzere üç ana başlık altında incelenmiştir. Ceza konusu ise ayrı bir bölüm olarak ele alınmıştır. Araştırmanın ana kaynağını şer'iyye sicilleri ve mühimme defterleri oluşturmaktadır. Bilindiği üzere şer'iyye sicilleri taşradaki kadı mahkemesinde tutulan dava kayıtlarını ihtiva eder. Mühimme defterleri ise bir anlamda temyiz mahkemesi olarak da çalışan Divan-ı Hümayun kayıtlarını içerir. İlaveten II. Mehmed (1451-1481) devrinden itibaren klasik dönemde padişahlar tarafından yapılmış kanunnameler, şeyhülislamlara ait fetvalar, zamanın müşahitleri tarafından kaleme alınmış seyahatnameler, kronikler, eski yazmalar yararlanılan kaynaklar arasında yer almaktadır. Bütün bunların yanında modern araştırmacılar tarafından hazırlanmış gerek Türkçe gerekse İngilizce araştırma-inceleme eserlerden de istifade edilmiştir. Bu çalışmada şer'iyye sicilleri ve mühimme defterlerindeki asayişi bozan olaylar üzerinden Osmanlı toplumunda yaşanan suçlar, cezalar ve cezalandırma yöntemleri ele alınmıştır. Osmanlı toplumu bugüne kadar pek çok araştırmada farklı boyutlarla irdelenmiştir. Osmanlı'da esnaf kesimi, köylüler, Osmanlı ailesinin yapısı, Osmanlı insanının sosyo-ekonomik durumu, Osmanlı kadını farklı açılardan ele alınmıştır. Ancak suçluların tarihi hukukçuların bakış açısına terk edilmiştir. Bu bağlamda çalışmanın temel amacı bir taraftan suçluların tarihini yazarken öte taraftan Osmanlı toplumunu daha anlaşılır kılabilmektir."
