abstract: "İnsan hürriyeti problemi, düşünce tarihi boyunca tartışılan konular arasında yer almaktadır. Düşünce tarihinde Cebriyye ekolü hariç, insan hürriyetini yok sayan bir düşünceye rastlanmaz. Ebu Mansur Maturidi (v.333/944) ve İmamu'l-Haremeyn el-Cüveyni (v.478/1085) de insan hürriyeti probleminin çözümüne yönelik kendilerine özgü görüşleri vardır. Bu araştırmanın amacı, bu problem hakkında sorunu aşabileceğimiz bir noktada bulunmamızı temin edecek yeterli delillere sahip olduğumuzu göstermektir. Türk İslam dünyasının yetiştirdiği düşünürlerden İmam Maturidi, geçmişten günümüze üzerinde düşünülen ve tartışılan bir konu olan insan hürriyeti sorununu, günümüze ışık tutacak şekilde özgün ve akılcı bir tarzda ele alarak açıklamıştır. İmamu'l-Haremeyn el-Cüveyni, insan hürriyeti konusunda kendisini sorgulayarak fikir değişikli yoluna gitmiştir. Cüveyni, insan hürriyeti meselesinde önce mensubu olduğu Eş'ari mezhebinin görüşlerini benimser. Kitabu'l-İrşad ve Luma'u'l-Edille isimli eserlerinde insanın kudretinin ve iradesinin eylemleri üzerinde etkisinin olmadığını açıkça ifade eder. Ancak, Akidetü'n-Nizamiyye adlı eserinde İnsan hürriyeti konusunda öncekiki görüşlerinden vaz geçerek, bir fikir değişikliğine gider. Cüveyni, bu esrinde, insanın hür bir varlık olduğunu, kudretinin ve iradesinin eylemleri üzerinde etkili olduğunu ve bu şekilde inanmanın Tevhid Akidesinin bir rüknü olduğunu ifade ederek aksi düşüncenin ise şeriatı ibtal etme anlamına geleceğini ifade eder. Anahtar Keliıneler: Maturidi, Cüveyni, insan hürriyeti, insan fiilleri, irade, kesb, kader"
