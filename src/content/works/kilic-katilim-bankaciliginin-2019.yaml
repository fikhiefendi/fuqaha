abstract: "Faiz temelinde faaliyet gösteren ticari bankaların aksine, İslami usullere göre faaliyet gösteren katılım bankaları konu edinen bu çalışmanın amacı; katılım bankalarının Türk bankacılık sektöründeki yeri ve Türk finansal sistemine katkısının incelenmesidir. Katlım bankalarının finansal sisteme katkılarının tespit edilebilmesi için veri toplama tekniği olarak“BDDK”“TKBB”ve“TÜİK”tarafından yayınlanan ikincil veriler kullanılmıştır. Katılım bankacılığının Türk Finansal Sistemindeki yeri ve katkılarının incelendiğinde katılım bankacılığının henüz yeteri büyüklüğe ulaşamadığı bununla birlikte finansal sistemde önemli bir alternatif olduğu görülmektedir. katılım bankalarının finansal sisteme olan katkısının tam olarak belirlenebilmesi için, katılım bankalarının ve“TKBB”nin işlemler hakkında daha geniş bilgiler vermesi bir zorunluluktur. Güncel olarak paylaşılan bilgiler katılım bankacılığının finansal sisteme olan katkısını açıklamakta yeterli olamamaktadır."
