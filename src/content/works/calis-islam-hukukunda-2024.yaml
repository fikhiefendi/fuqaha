abstract: "Tabiatı itibariyle sosyal bir varlık olan insan, hayatın her alanında diğer insanlarla iletişim halindedir. Yazılı, sözlü ve fiili olmak üzere çeşitli yollarla gerçekleşen bu iletişim biçimlerinin hukuki sonuç doğurabilmesi, karşılıklı rızanın ortaya konulması şartına bağlıdır. Rızanın dışavurum şekilleri ise farklılık göstermektedir. Burada önemli olan kişinin içteki rızayı tereddüde mahal bırakmayacak şekilde ortaya koymasıdır. Bu olmadan herhangi bir şekilde hukuki hüküm tesisi mümkün değildir. Sözlü veya yazılı bir beyan olmaksızın yalnızca davranışla hukuki işlem tesisinin mümkün olup olmayacağı hususu öteden beri fukahânın gündeminde olmuş, mesele fıkıh literatüründe ayrıntılı olarak tartışılmıştır. Çağdaş dönemde ise konu oldukça yeni ve farklı boyutlar kazanmıştır. Özellikle konunun güncel açılımlarının varlığı, bu meselenin araştırma konusu olarak belirlenmesinde etkili olmuştur. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte konunun önemi, amacı, sınırları ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde, teâtînin hukuki niteliğinin iyi kavranmasına katkı sunacağı öngörüsüyle kavramsal çerçeve ortaya konulmuş, teâtînin benzer kavramlarla olan ilişkisine temas edilmiş ve hukuki niteliği itibariyle teâtî konusu ele alınmıştır. İkinci bölümde, dört fıkıh mezhebi eksen alınmak suretiyle klasik fıkıh doktrininde teâtî konusundaki tavırlar ve hükümler tespit edilmiş, ardından modern dönemde ortaya çıkan teâtî açılımlarına temas edilmiştir. Nihayet bu çalışma neticesinde oluşan tespit ve kanaatler, sonuç kısmında ifade edilmiştir"
