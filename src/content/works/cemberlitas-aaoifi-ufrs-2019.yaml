abstract: "İslami finans sistemine dair ilk uygulamalar 1963'te başlamıştır. Bu sistemle ilgili olarak çıkarılan enstrümanların uygulanmasına dair çalışmalar ise 1980'den sonra dünya çapında oldukça artmıştır. Finansman işlemlerini faizsiz bir şekilde yürütmeyi talep edenlerin ihtiyaçları üzerine birçok faizsiz ürün geliştirilmiştir. Bu ürünlerin bir kısmı esasında İslam dininin ilk dönemlerinde de kısmi olarak da uygulanmaktaydı. Günümüzde bu ürünler geliştirilerek birçok ülkede olduğu gibi Türkiye'de de uygulanma imkânı bulmuştur. Birçok İslam ülkesinde“İslami Bankacılık”adıyla hizmet veren bu kuruluşlar Türkiye'de ise 2005 yılından itibaren“Katılım Bankacılığı”adı altında işlemlerini yürütmektedir. Katılım bankalarının kullandığı yöntemlerden biri olan teverruk, uygulamada“nakit para bulma”anlamına gelmektedir. Katılım bankaları müşterilerine nakit ihtiyacı duyduklarında teverruk yöntemi ile nakit fon kullandırmaktadırlar. Benzer şekilde müşterilerin daha önce kullandıkları ve ödeyemez duruma gelen finansman borçlarını yapılandırma amaçlı olarak da teverruk kullandırmaktadırlar. Teverruk modeli Türkiye'de henüz çok yeni bir ürün olup 2019 yılı itibariyle Türkiye'de faaliyet gösteren beş katılım bankasından üç tanesi tarafından kullanılmaktadır. Çalışmamızda farklı katılım bankaları yetkilileriyle mülakat yapılmıştır. Bu minvalde Türkiye'de faaliyet gösteren ve teverruk işlemlerini yapan üç katılım bankasının muhasebe birim uzmanlarının görüşlerine yer verilmiştir. Gerçekleştirilen görüşmelerde esasen teverruk işlemlerinin AAOIFI muhasebe standartlarına ve UFRS standartlarına göre raporlamasının nasıl yapıldığına ve kayıtlardaki farklılığın neler olduğuna yönelik cevaplar aranmıştır. Çalışma, teverruk işlemlerinin muhasebeleştirilmesi ve raporlanmasına dair kayıtlar ile sonuçlandırılmıştır."
