abstract: "Çalışmamız Ahmed b. Süleyman el-Ervâdî'nin hayatı, eserleri ve tasavvufî görüşleri hakkındadır. Mevlânâ Hâlid-i Bağdadi'nin sonucu halifesi olan Ervâdî, yüz yirmiden fazla eser telif etmiş, çok sayıda talebe yetiştirmiş ve aynı zamanda Trablusşam müftülüğü yapmıştır. Ervâdî, Hâlidiliğin başta İstanbul ve Anadolu olmak üzere dünyanın birçok yerine yayılmasına vesile olan Ahmed Ziyâeddîn Gümüşhânevî'nin hocasıdır. Ervâdî, eserlerinde dört mezhep imamının görüşleri doğrultusunda şeriata bağlı bir hayat sürmeyi özellikle vurgulamıştır. Her fırsatta Devlet-İ Âliyye-yi Osmaniyye'ye muhabbetini belirtmiş ve devletin bekâsı için dua etmiştir. Ervâdî çok sayıda tarikattan icazet almış, Ekberî düşünceyle yakından ilgilenmiş, vahdet-i vücud ile ilgili izahlarda bulunmuştur."
