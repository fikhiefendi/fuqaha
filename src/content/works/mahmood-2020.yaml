abstract: "İslam'da Hulefâ-i Râşidîn dönemindeki yargı, bu araştırmanın önemi yargının bir ülkeyi ayakta tutan en önemli şartlardan biri olmasıdır. Hulefâ-yi Râşidîn döneminde usul, fıkıh ve uygulama yönünden yargı ve hâkimlerin nasıl yönetileceğini, o dönemdeki yargı ve hâkimlerin idaresini şimdiki zaman ile karşılaştırmayı bu çalışmada göstermek istedik. Araştırmanın en öne çıkan sonuçları arasında şunlar yer almaktadır: Hulefâ-i Râşidîn dönemindeki yargı, Yüce Allah'ın istediği gibi meşru, adil ve eşit temeller üzerine inşa edilmiştir, Toplumlara haklarını garanti eder ve yasaklardan korur. Araştırma ayrıca İslami dönemde Hulefâ-i Râşidîn yargı idaresi ve hâkimlerin üzerine inşa edildiği temel kuralları da ortaya koymaktadır. Bu çalışma Hulefâ-i Râşidîn dönemindeki her halifenin dönemine ait kazâ ile ilgili bilgileri açıklığa kavuşturmuştur. Temyiz ilkesinin benimsenmesini, idari otoritenin adli otoriteden ayrılmasını açıklığa kavuşturarak, o dönemde yargıyı yönetme yaklaşımı meselelerinde Ömer b. Hattab'ın hilafet dönemini araştırdık, yargı için ana kaynakların Kur'an-ı Kerim ve Sünnet olduğunu belirttik. Araştırma ayrıca, Hulefâ-i Râşidîn ve yargıçların bazı davaları icma, kıyas ve İslam'da ilim ve fazilet sahiplerinin yargı emsalleri ilkesine dayanarak çözmek için nasıl çalışmış oldukları da gösterilmiştir. Kuran ve Sünnette açık bir metnin bulunmaması durumunda, övgüye değer görüşün Şura Meclisinden sonra alındığı durumlarda, söz konusu emirde belirtilen ana ve yan kaynakların hiçbiriyle çelişmemek kaydıyla. Hulefâ-i Râşidînin, yargı yönetiminde ve yargıç seçimlerinde çok uğraştılar, iyiliklerine ve İslam'ın hükümleri ve onun şeriat bilimlerine ilişkin bilgilerine güvenerek, o dönemin en önemli hâkimlerinden ve hükmettikleri topraklardan söz ettiler. Muhtesip ve mezalim, o dönemin yargı yönetiminin en önemli sonuçlarından biri olarak ele alındı. Bunun nedeni, yargı ile birçok resmi ve nesnel yönden yakın ilişkileri olması, yargıç, muhtesip ve şikâyet sahibinin çalışmalarının bir açıklamasının olması, onları birleştiren, koalisyondan ve ihtilaftan ayıran şeyin bir açıklamasıdır. Araştırmada ayrıca kaynak, biçim ve içerik yönünden Hulefâ-i Râşidîn dönemi ve çağdaş yargı kurumlarının en önemli temelleri ve yargıçları, analiz ve örneklerle ele alındı."
