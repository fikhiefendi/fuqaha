abstract: "Çalışmamızın amacı Tasarruf Finans sistem ve uygulamalarının İslâm iktisadı ve hukuku açısından uygun olup olmadığını tespit etmektir. Çağlar boyunca insanlar çeşitli ihtiyaçlarını karşılamak için kendi öz kaynakları dışında da finansal kaynak-lara ihtiyaç duymuştur. Günümüzde de bu durum değişmemiştir. İnsanlar ev, araba gibi ihtiyaçlarını ya konvansiyonel yöntemlerle ya da faizsiz yöntemlerle karşılaya-bilmektedirler. Tasarruf finansman şirketleri de faiz ve vade farkı gibi maliyetlere katlanılmadan ev, araba gibi emtiaların satın alınabilmesini sağlamaktadırlar. Tezi-mizin araştırdığı sorular bağlamında iki temel hipotezi bulunmaktadır: 1. Tasarruf Finans sisteminin mevcut haliyle, İslâm hukuku açısından birtakım hata, kusur ve aksaklıkları bulunmaktadır. 2. Sektörün sağlıklı bir temele oturtulması ve bir İslâmî finans yöntemi olarak ortaya konması açısından İslâm hukuku doktrinleri temel alınarak işleyiş ve sözleş-meleri düzenlenmelidir. Söz konusu araştırma, zikredilen iki hipoteze de tatmin edici cevap verecektir. Zira tasarruf finans, kökleri itibari ile oldukça eski olsa da kurumsallık ve yaygınlık ka-zanmaya başlaması oldukça yeni sayılır."
