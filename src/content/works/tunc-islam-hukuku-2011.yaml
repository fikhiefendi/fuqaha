abstract: "Hukukun gayelerinden biri sosyal hayattaki olaylara çözümler getirerek bu alandaki düzeni sağlamaktır. Taşınır malların kiralanması da toplumsal hayatta sıkça karşılaşılan olaylardandır. Bu açıdan kira ile ilgili düzenlemeleri yapmak da hukukun alanına girmektedir. Sözleşmelerde tarafların haklarının koruma altına alınması ve birinin diğerine herhangi bir haksızlık yapmasının önlenmesi için hukukî düzenlemelerin yapılması kaçınılmazdır. Gelişen ve değişen günümüz dünyasında teknolojinin de etkisiyle daha önce karşılaşılmayan taşınabilir mallar ve bunlarla ilgili değişik kiralama şekilleri ortaya çıkmıştır. Çalışmamızda, mülkiyetine sahip olma yerine menfaatinden yararlanmanın daha çok tercih edildiği günümüzde, alanla ilgili hukukî belirlemeler yapma amacına yönelik olacağından hem bilimsel anlamda hem de sosyal yaşamdaki uygulamalarla ilgili derli toplu bilgi sunulmaya çalışılmıştır."
