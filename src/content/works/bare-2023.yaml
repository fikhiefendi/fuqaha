abstract: "Kadınlar konusu ve onunla ilişkili birçok konu uluslararası arenada oldukça ilgi görüyor, hatta uluslararası kurumlar kadınların ve kadın haklarının korunması için bu konuda konferanslar düzenlemeye başladılar, ancak bu anlaşmalar batılı ülkeler tarafından yapılmaktadır ve İslam hukukuna aykırı temel ve esaslara dayanmamaktadır. Birleşmiş Milletler tarafından kadınları her türlü şiddet ve ayrımcılığa karşı korumak için kurulan -CEDAW Sözleşmesi- bu anlaşmaların başında gelmektedir. Bu nedenle İslam İş birliği Teşkilatı, İslam şeriat hukukuna dayalı bir anlaşma oluşturmaya çalışmıştır ve Müslüman toplumların örf ve değerlerine uygun olarak İİT ülkelerinde kadınların gelişmesi ve ilerlemesi için bir eylem planı oluşturmuş ve buna“OPAAW Planı”adını vermiştir. Bu çalışma,“OPAAW Planı'nını ve temel dayanaklarını tanıtmayı ve İslam İş birliği Teşkilatı'nın üye devletlerde kadınların statüsünü iyileştirme çabalarına ve bu plan hükümlerinin yasal dayanağına ışık tutmayı amaçlamıştır. Böylece bu planın, İslam hukuku kurallarıyla ne derece uyuştuğunu göstermektedir. Bu çalışma tanımlayıcı, tümevarımcı ve karşılaştırmalı yönteme dayanmaktadır. Çalışma, İslam hukuku daha kapsamlı ve genel olmasına rağmen, ”OPAAW Planı“ hükümlerinin genel olarak İslam'ın kadınlara tanıdığı haklarla uyumlu olduğu sonucuna varmıştır. Üstelik İslam hukuku kadın haklarının korunması ile sınırlı kalmamış; aksine, hakları olduğu gibi sorumluluklarının da olduğunu belirtmiştir. Bu ”OPAAW Planı'nın değinmediği bir konudur. Çalışma,“OPAAW planı”ve bu planın hukuki dayanağı hakkında daha geniş bir çalışma yapılmasını, aileyi ilgilendiren uluslararası anlaşmaların değerlendirilmesini ve Müslüman toplumlar tarafından ne ölçüde onaylandığının görülmesini önermektedir."
