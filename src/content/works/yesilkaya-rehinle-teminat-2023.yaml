abstract: "Kefalet sözleşmesi kişisel bir teminat sözleşmesidir. Kefil tek taraflı olarak şahsen borç altına girdiğinden kanun koyucu tarafından kefilin korunmasına önem verilmiş ve Türk Borçlar Kanunu'nuda özel olarak düzenlenmiştir. Bu çalışmanın amaçlarından biri kefalet sözleşmesini, geçerlilik şartlarını, türlerini, sona ermesini ve diğer hukuki ilişkilerden farklarını açıklamaktır. Kefalet sözleşmesi TBK md. 581 hükmünde tanımlanmıştır. Kefalet sözleşmesi kefil ile alacaklı arasında yapılır. Asıl borçlu sözleşmenin tarafı değildir. Kefilin, kefil olabilmesi için asıl borçlunun rızası gerekmemektedir. Ancak asıl borç olmadan kefalet borcu olmaz. Kefalet sözleşmesinin geçerlilik şartları; geçerli bir borcun bulunması, geçerli bir kefalet sözleşmesi olması, sözleşmenin yazılı şekilde yapılmış olması ve kefilin sorumlu olduğu miktarın net olarak belli olması şeklinde sıralanabilir. Kefalet türleri TBK'nın 585 – 588. Maddelerinde açıklanmış olup, adi-müteselsil-birlikte kefalet ile kefile kefalet ve rücua kefalet şeklinde düzenlenmiştir. Kefalet sözleşmesinin en doğal sona erme sebebi asıl borcun sona ermesidir. Asıl borç herhangi bir sebeple sona ererse kefalet borcu da sona erer. Çalışmamızın amaçlarından bir diğeri, rehin hakkı ve bir rehin türü olan ipoteği açıklamaktır. Aynî güvenceyi oluşturan malvarlığı paraya çevrilmek suretiyle elde edilen alacağın bu meblağdan tahsili ile borç ifa edilmiş sayılır. Hukukumuzda borcun ifasını sağlayan ve malvarlığını paraya çevirme yetkisi veren aynî teminata rehin denir. Rehin, taşınır ve taşınmaz rehni olmak üzere ikiye ayırılır. Taşınmaz rehni ise“ipotek”ile birlikte,“ipotekli borç senedi”ve“irad senedi”olmak üzere üç adet güvenceden oluşmaktadır. Taşınır rehni, Türk Medenin Kanunu'nun 939-953'ncü maddeleri arasında düzenlenmiştir. Taşınmaz rehninden farklı olarak genel hükümlere yer verilmemiştir. Taşınmaz rehni ise Medeni Kanunun 850-938'inci maddeleri arasında düzenlenmiştir. Taşınmaz rehninde, Medeni Kanunun 850-880'inci maddeleri genel hüküm niteliğindedir. Taşınır rehninden farklı olarak; taşınmaz rehninde sabit bir sicil sistemi mevcut olup aynı zamanda bunun tedavül fonskiyonu da bulunmaktadır. İpotek sınırlı ayni haktır, sınırlı aynî hak ise sahibine geniş yetkilerden sadece bir veya bir kaçını kullanabilme yetkisi verir. İpotek hakkı sahibi, malikin bütün haklarını kullanabilecek durumda değildir. Çalışmada, ipotek; kanun hükümleri çerçevesinde, konuya ilişkin öğreti görüşlerinin de yer aldığı ve Yargıtay kararları ile birlikte onun yansıması olan uygulamaya ilişkin sorunlar dikkate alınarak ve karşılaştırma yapılarak inceleme altına alınmıştır."
