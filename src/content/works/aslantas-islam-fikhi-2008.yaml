abstract: "Adlî Tıp; Tıp İlmi içerisinden doğmuş, insan vücudu ile ilgili hukukî problemleri aydınlatmaya çalışan bir bilimdir. Kendi içerisinde birçok bölüme ayrılır. Adlî Tıp; insan vücuduna yönelik eylemler neticesinde oluşan basit sıyrıklardan ölüme kadar her türlü olayı aydınlatmaya çalışmaktadır.Adlî Tıp, şüphe arz eden tüm olayları (ölümle sonuçlanan veya sonuçlanmayan) aydınlatmaya çalışmaktadır. Olay ölümle sonuçlanmış ise ölüm mekanizması, ölüm şekli, ölüm zamanı ve ölümden sonra vücutta meydana gelen değişiklikleri incelemektedir. Delilleri tespit etmek için gerekli inceleme, laboratuar tetkikleri ve otopsi yapmaktadır. Ayrıca yaralama, zehirlenme, asfiksi (solunum yokluğu), kazalar (iş, trafik, düşme vb) gibi olaylar sonucunda vücutta ne tür etkiler bıraktığını inceler. Şayet bu tür olaylarda ölüm meydana gelmiş ise ölüm sebebini ve olayının orjinini (kaza-intihar-cinayet) aydınlatmaya çalışır. Yine gebe kadına karşı yapılmış eylemler, çocuk ölümleri ve ölü doğum konularında çalışmalar yapar. Nesebi belli olmayan çocukların baba veya annelerini tespit etmeye yönelik inceleme yapar. Bu konuların yanı sıra alkol ve bağımlılık yapan maddeleri tespite çalışır. Tecavüz olaylarında zanlı kişilerin suçlu olup olmadıklarını belirlemek için incelemeler yapmaktadır. Doku ve organ nakli konularında görüş bildirirken, organ ticaretinin engellenmesi, mağdur kişilerin vücudunda meydana gelen zararı tespit eder.İslam Hukuku'nda davaları ispat etmek için şahitlik, ikrar, yemin ve karineler gibi yöntemlerden yararlanılmaktadır. Ayrıca özel ihtisas gerektiren konularla ilgili davaları aydınlatmak için bu konularda bilgi sahibi kişilerin başvurulmaktadır. Bu sayede bu tür davalar daha kolay bir şekilde sonuçlandırılabilmekte ve daha isabetli ve adalete uygun hükümler verilebilmektedir.İslam Hukuku içerisinde yer alan insan vücudu ile alâkalı ve Adlî Tıp Bilimi'nin inceleme yaptığı tüm konularda bir bilirkişilik müessesesi olarak yararlanılabilecektir. Böylece bu tür olaylarla ilgili davaların daha kolay ve daha isabetli bir şekilde çözüme kavuşturulmalarında Adlî Tıp'ın yapacağı incelemeler neticesinde elde edeceği veriler İslam hukukçularına yardımcı olabilecektir."
