abstract: "Bu tezde, para olaylarında para borçlarının nasıl ödeneceğine ilişkin hususlar ele alınmaktadır. Bu çerçevede paranın yürürlükten kaldırılması olan kesâd, piyasada bulunmaması olan inkıtâ ve değer değişimleri olan raḥs, ġalā, tağşiş, enflasyon, deflasyon, devalüasyon ve revalüasyon olaylarının para borçlarındaki ödemeye etkisi İslâm hukuku açısından incelenmiştir. Klasik ve modern dönem fıkıh ve iktisat literatüründeki para ve para olaylarındaki esaslar, problemler ve görüşler, fıkıh ve iktisat perspektifiyle teorik ve tarihsel gelişim çerçevesinde değerlendirilmiştir. Klasik döneme dair yapılan araştırmada kesâd, inkıtâ, raḥs ve ġalā sebebiyle hilkaten paralarda inkıtâ hali hariç genellikle misle; ıstılahî paralarda genel görüş olmamakla birlikte müftâbih görüş olarak tüm hallerde kıymete itibar edildiği görülmüştür. Modern dönemde yeni bir şey olan banknotların ve iktisat literatürüne ait kavramlar olan enflasyon, deflasyon, devalüasyon ve revalüasyonun İslâm hukukuna göre sistematik olarak temellendirilemediği, dolayısıyla başta enflasyonda olmak üzere kâğıt para borçlarının ödenmesindeki yaklaşımların tutarlılık arz etmediği gözlemlenmiştir. Bu bağlamda banknotların İslâm hukukuna göre ıstılahî olarak değer ölçüsü niteliği taşıdığı, tedavüle sürülüş şekline göre hükme tâbi olması gerektiği ve diğer paralardan farklı şekilde kâğıt para olarak müstakil bir para olduğu tespit edilmiş; enflasyon ve deflasyonun klasik fıkıh literatüründeki raḥs ve ġalānın bir çeşidi, devalüasyon ve revalüasyonun tağşişin kendisi olduğu gözlemlenmiştir. Sonuç olarak bu çalışma, temsili mahiyette tedavüle sürülen kağıt paraların hilkaten para hükmünde olmasıyla kesâd ve inkıtâ hallerinde kıymete; enflasyon ve deflasyonda misle; itibari olarak tedavüle sürülen kâğıt paraların ise ıstılahî para hükmünde olmasıyla tüm hallerde mutlak olarak kıymete itibar edilmesinin literatürde ve uygulamada görülen farklı yorum ve çözüm arayışları içerisinde öne çıkan bir yaklaşım olabileceğini temellendirmektedir."
