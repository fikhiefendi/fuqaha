abstract: "İnsan, sosyal bir varlıktır. Toplumun fertleri arasında anlaşmazlıkların ve hak ihlallerinin olması doğaldır. Bireylerin kendi aralarındaki problemleri çözememesi durumunda dava, mahkemeye intikal eder. Mahkeme, davayı hükme bağlarken mevcut delilleri dikkate alacaktır. Hâkim, öncelikli olarak davacı ve davalının ortaya koyacakları delilleri, dava konusuna ilişkin bilgi ve bulguları dikkate alacaktır. Deliller, davacı açısından bakıldığında iddiasını ispatlamasına yarayan vasıtalar; hâkim açısından bakıldığında hükmünün dayanağı ve sebebidir. Klasik İslam hukukçularının çoğunluğu objektifliği ve kanuniliği sağlama, zan ve tahmine dayalı hüküm vermeyi önleme gibi düşüncelerle muhakeme hukuku açısından ispat vasıtalarını belli sayı ve türle sınırlandırma yönünde görüş beyan etmişlerdir. Bazı İslam hukukçuları ise muhakeme esnasında adaleti sağlayacak her kat'i delilin ispat vasıtası olarak kullanılabilmesinden yana tavır takınmıştır. Ancak bazı davalarda olayı açıklığa kavuşturacak açık deliller bulunmayabilir. Bu durumda hâkim, karinelerle hüküm verecektir. Bu çalışmada İslâm muhâkeme hukukunda karinelerin ispat değeri ortaya konulmaya çalışılmıştır. Çalışmada öncelikle karine ve karine çeşitleri ele alınmış, akabinde karinelerin ispat değeri hadler ve kısas açısından ayrı ayrı ortaya konulmuştur. Karinelerin muhakeme hukukundaki durumu incelenirken İslam'ın ilk dönemlerinde var olan karinelerden günümüze doğru bir sıralama takip edilmiştir. Bu bağlamda çalışmada tıp ilminin ve teknolojinin sunmuş olduğu delil değerlendirme yöntemlerine de yer verilmiştir."
