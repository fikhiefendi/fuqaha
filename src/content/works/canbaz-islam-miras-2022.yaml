abstract: "Bu çalışmada, İslam miras hukuku içerisinde“zevi'l-erhâm”denilen akraba grubunun mirasa hak sahibi olup olmaması noktasındaki görüşler ve bu görüşleri destekleyen deliller ele alınmıştır. Zevi'l-erhâm konusunda Kur'an-ı Kerim'de hüküm niteliğinde bir ayet yoktur. Âlimlerin çoğu, akrabanın vefat edene diğer Müslümanlardan daha yakın olduğunu vurgulayan ayetleri ve Peygamberimizin uygulamalarını da delil kabul ederek bu grubun mirasa daha layık olduğu yönünde ittifak etmişlerdir. Buradan hareketle çalışmanın birinci bölümünde, miras hukukunun tanımı, terike üzerinde hak sahibi olan varisler, miras hukukunda meseleler ve ayet ve hadislerle sabit olan ashâb-ı ferâizin hisseleri ayrıntıya girmeden öz bir şekilde anlatılmıştır. Bu hisseler, örnek problemlerle açıklanma gereği duymaksızın sadece kimlerin hangi durumda ne oranda mirastan pay alabilecekleri belirtilmek maksadıyla açıklanmıştır. İkinci bölümde ise zevi'l-erhâmın sözlük ve terim anlamından başlayarak bu mirasçıların kimler olduklarından, Hz. Peygamber (s.a.v.) zamanında böyle bir gruba miras verilip verilmediğinden, bu grubun mirasçılığını kimlerin kabul edip kimlerin etmediğinden gerekçeleriyle bahsedilmiştir. Çalışmada özel olarak zevi'l-erhâm'ın mirasçılığını kabul edenlerin görüşleri ele alınmış, kabul etmeyenler azınlıkta olduğu için bu grubun uygulamaları sadece bilgi amaçlı zikredilmiştir. Ehl-i karâbe ve ehl-i rahim arasındaki miras paylaşımının daha iyi anlaşılması için çalışmanın sonuna bir tablo eklenmiştir. Değerlendirmeler sonucunda da mirası almaya en layık olan grubun ehl-i karâbe (yakın akrabalar) olduğu sonucuna ulaşılmıştır."
