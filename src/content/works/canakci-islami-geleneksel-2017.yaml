abstract: "Bu çalışmanın amacı refahın arttırılmasına giden yolda önemli görev üstlenen bankacılık sisteminin, bir alternatifi olarak değil tamamlayıcısı sıfatıyla katkı sağlayan İslami Bankacılığın, günümüz geleneksel bankacılık sistemiyle olan ilişkisini, gerek sektör gerekse finansal sistem içerisinde açıklamak ve farkındalık sağlamaktır. Aynı zamanda çalışmanın işlevsellik açısından literatüre ve ilgililere katkısı sunması için İslami ve geleneksel bankaların likidite risklerini etkileyen bankaya özgü faktörler ile makroekonomik değişkenlerin belirlenmesi ampirik bir çalışma ile de analiz edilmiştir. Analiz 12 ülkeden seçilen İslami ve geleneksel bankadan oluşan örnekleme ile yapılmıştır."
