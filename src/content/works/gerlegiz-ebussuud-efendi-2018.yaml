abstract: "“Ebussuûd Efendi'nin Kur'ân'ı Kur'ân'la Tefsiri”isimli bu çalışma; giriş, dört bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, yapılan çalışmanın konusu, önemi, amacı, yöntemi ve kaynakları ile Ebussuûd Efendi'nin hayatı, ilmi şahsiyeti ve eserleri ele alınmıştır. Birinci bölümde, Ebussuûd Efendi'nin, Kur'ân'ı Kur'ân'la tefsir ederken anlamsal ilişki kurduğu unsurlar ve bunların özellikleri üzerinde durulmuş, yani Ebussuûd Efendi'nin ayetler arasında anlamsal ilişki kurduğu kelime (isim, fiil, edat) ve cümle gibi unsurlardan ve bu unsurları belirlerken dikkate aldığı benzerlik, özdeşlik, türdeşlik, eş anlamlılık, zıt anlamlılık, eş seslilik, anlamı teyit etme ve anlamsal içiçelik gibi özelliklerden söz edilmiştir. İkinci bölümde, Ebussuûd Efendi'nin, Kur'ân'ı Kur'ân'la tefsirinde kullandığı, uzlaştırma, mucmeli beyan, müphemâtı açıklama, tahsis, takyid, nesh, örneklendirme, gerekçelendirme, anlamı netleştirme, görüşünü destekleme, hükmü açıklama, dolaylı katkı sağlama, zorlamalı ilişkilendirme, ayetleri ilişkilendirme, mantık yürütme ve maksudu belirleme gibi açıklama biçimleri işlenmiştir. Üçüncü bölümde ise Ebussuûd Efendi'nin Kur'ân'ı Kur'ân'la tefsir ederken yardımcı unsur olarak kullandığı, sarf, nahiv, belagat, arap dilindeki kullanım özellikleri, kıraat farklılıkları, esbâb-ı nüzul ve siyak-sibak konularına yer verilmiştir. Sonuç kısmında da araştırma neticesinde ulaşılan veriler aktarılmıştır."
