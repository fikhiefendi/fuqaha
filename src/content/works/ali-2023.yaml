abstract: "Bu çalışma, İslam hukukundaki üretim faaliyetini ve üretim faaliyetlerinin üretimin büyümesini ve gelişmesini teşvik etmede önemli bir rol oynadığı, ancak ekonomi politikalarının artan yatırımları teşvik eden bir ekonomik iklimin sağlanmasına yardımcı olduğu çağdaş ekonomik uygulamalara ışık tutmayı amaçlamaktadır. Bu araştırmada İslam hukukunun üretime ve gelişime önem vermesinden, insanları maddi ve beşeri enerjilere dikkat etmeye teşvik ettiğinden ve hepsini üretim için seferber ettiğinden, doğadan maksimum fayda sağlayarak üretimi geliştirmeye önem verdiğinden bahsettik. Üretim teriminin de diğer ekonomik terimler gibi gelişimini ve ekonomik görüş ve fikirlerin gelişimi doğrultusunda gelişim sağladığını ifade ettik. Nitekim Orta Çağ'da tarım ve önemli el sanatları yoluyla ihtiyaçların karşılanması sınırlı olmuştur. Üretimin, maddî veya manevî bir fayda üretmeyi veya artırmayı amaçlayan organize bir ekonomik faaliyet olduğuna dikkat çektik. Daha sonra İslam hukukunun üretime teşvik ettiğini ve kendini tamamen ibadete verme ile tembellik ve gevşeklik sebebiyle olsa bile çalışmamayı yasakladığını açıkladık. Çünkü kâinattaki nimetlerin herhangi bir kısmının ortaya çıkarılması, hukuktaki ekonomik doktrinin bireylere ve topluma yüklediği temel bir hedeftir. Ayrıca İslam hukukunun, kendisiyle hedeflerine ulaşmak için üretime yönelik koymuş olduğu kural ve kaideler ile üretimin verimliliğini artırmak için geliştirdiği yollardan bahsettik. Bu kurallardan en önemlileri şunlardır: Temel kurallar ve ekonomik kurallar. Üretimin öncelikleri önce insanın zarurî ihtiyaçlarının karşılanmasıyla, sonra haciyât olarak ifade edilen mallarla ve son olarak da tansînî hizmetleriyle başlar. Bu nedenle İslam'da üretim süreci, İslam hukukunun belirlediği maslahat sırasına göre düzenlenmiş kurallara göre yürütülmektedir. Ayrıca İslam hukuku gölgesinde üretimin hedeflerinden, yeniden yapılanmayı gerçekleştirmekten ve mutluluğu sağlamak ile her insan için yeterli ölçüde geçim sınırından çıkmaktan bahsettik. Çünkü bu, kapsamlı bir gelişmeyi gerçekleştirmek için birey, toplum, topluluk ve devlet üzerindeki dini bir görevdir. Tarımsal üretimden, öneminden, amaçlarından ve gelişmelerinden, çiftliklerde üretilen tüm bitkisel veya hayvansal ürünlerden, bunların nelerden oluştuğundan bahsettik ve bunu bitkisel ve hayvansal ürünlerin üretimi için üretim birimlerindeki toprak ve insan kaynağından yararlanma bilimi, sanatı, endüstrisi veya mesleği olarak tanımladık. Tarımsal üretim, yeryüzünde uygarlık var olduğundan beri var olmuştur. Tarımsal üretim, dünyadaki en önemli ve kapsamlı ekonomik faaliyetlerden biri olmuştur ve hala da öyledir. Aynı zamanda insanların hayatta kalmasını sağlamak için gerekli olan en önemli temel faktörlerden biridir. Onun ekonomik boyutu, politik boyutu ve sosyal boyutu olmak üzere birçok boyutu vardır: Ayrıca, tarım devriminin rolünü ve sanayi devrimi ile gelişimini ve tarımda üretimi artırmak, nicel ve nitel olarak çok büyük ölçüde geliştirmek için uygulanmasını açıkladık. Daha sonra Batı dünyası ile Arap dünyasındaki endüstriyel üretimi ve on dokuzuncu ve yirminci yüzyıllarda ortaya çıkışını inceledik. Onu farklı kılan en önemli şey makinelerin ve büyük fabrikaların ortaya çıkması ve bazen işçilerden vazgeçilmesiydi. Hayvansal üretimin kapsamlılığı, hayvanlar, sığırlar, kuşlar, balıklar ya da bunun dışında insanların ya kendisinden ya ürünlerinden ya da hayvan olarak yaratılışlarından fayda sağladıkları bütün canlı hayvanlar tarımsal gelirin ve dolaysısıyla devletin milli gelirinin arttırılmasında önemli bir rol oynar. Bu da onu ülkelerin ekonomik kalkınmasının bir ölçüsü yapar. Daha sonra madenler kavramını, onunla ilgili şeri hükümleri, konuyla alakalı âlimlerin görüşlerini ve madenlerin çıkarıldığı yerleri sunduk. Bu bağlamda şunları ifade ettik: Madenler üç çeşittir: Altın ve gümüş gibi katı, eriyen ve ateşle yumuşayan madenler, kireç gibi erimeyen ve ateşle yumuşamayan madenler, su gibi sert olmayan madenler. Zirai ekonomi ilminin dallarından biri olan su kaynaklarının önemini beyan ettik. Ki bu ilim tarım ekonomisinin temel kural ve teorilerinden yola çıkarak toplumun bütün fertlerinin yararına uygun olan su kaynaklarının önemini, su kaynaklarının miktarlarının artırılmasını, kalitesinin iyileştirilmesi ve yönetim verimliliğinin yükseltilmesi konusunu araştırmaktadır. Üretim faaliyetinde bilimsel üretimin önemini ve İslam hukukundaki önemini ortaya koyduk, âlimlerin ve fakihlerin bu konudaki ifadelerine değindik. Ayrıca bunun İnsan aklının şimdiye kadar üstlendiği en zor ve en güzel faaliyet olduğuna işaret ettik. Bu hayat sanatı, gelişim ve kalkınmayı sağlamak için bir tür kutsal cihattır. Ayrıca, teknoloji teriminden, İslam hukukundaki önem ve rolünden ve toplumdaki gelişiminin öneminden, mal ve hizmetlerin üretim ve geliştirilmesinde doğal ve beşeri kaynaklardan istifade etmekten, bu ilmi zaman ve emekten tasarruf sağlamak gayesiyle üretimi geliştirmek için kullanmaktan"
