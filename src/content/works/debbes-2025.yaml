abstract: "Depremler, insanlık tarihi boyunca gözlemlenen kozmik olaylardan biridir ve İslam fıkhı, insan hayatı üzerindeki derin etkilerinden dolayı bu olaya özel bir önem atfetmiştir. Bu çalışmanın önemi, depremlerle ilgili fıkhî hükümlerin incelenmesinde yatmakta olup, İslamî ilkeler çerçevesinde bu tür afetlerle nasıl başa çıkılabileceğine dair kapsamlı ve bütüncül bir şer'î bakış açısı sunmayı hedeflemektedir. Araştırma, İslam âlimlerinin ortaya koyduğu naslar ve fıkhî kaideler çerçevesinde, farklı zaman ve mekânlara uygun hükümlerin nasıl istinbat edilebileceğini ortaya koymayı amaçlamaktadır. Bu bağlamda çalışma, tanımlayıcı-analitik yöntem ile klasik fıkıh mezheplerinin görüşlerini karşılaştırmalı ve tümevarımsal bir yaklaşımla ele almıştır. Çalışma dört ana bölümden oluşmaktadır: Birinci bölümde, deprem zamanlarında ibadetlerle (namaz, zekât, oruç, hac) ilgili hükümler ele alınmış,“meşakkat teysiri celbeder”ve“zorluk giderilir”gibi temel kaideler esas alınmıştır. İkinci bölümde, muameleler (alışveriş, kira vb.) konuları değerlendirilmiş ve“zarar giderilir”gibi kurallara dayanılarak sözleşmelerin feshi ve stokçuluğun yasaklanması gibi hususlar işlenmiştir. Üçüncü bölümde, aile hukukuna dair konular (nesep, kefalet, kayıp kişilerin durumu) ele alınmış;“kesinlik şüphe ile ortadan kalkmaz”gibi kaideler çerçevesinde hükümlere yer verilmiştir. Dördüncü bölüm ise, devletin deprem öncesi, sırası ve sonrasındaki sorumluluklarına ayrılmış; can güvenliğini sağlama, zarar görenlerin tazmini ve gerektiğinde gayrimüslimlerden yardım alma gibi konular ele alınmıştır. Sonuç olarak çalışma, İslam şeriatının kapsamlı, esnek ve her zaman ve mekâna uygun hükümler ortaya koyabildiğini; genel kaideler yoluyla yeni gelişen olaylara da cevap verebildiğini ortaya koymaktadır."
