abstract: "Bu çalışmamızda, islâm hukuku kaynaklarında yer alan, tazminatla ilgili hukukî metinleri güncelleştirmeyi amaçladık. Kısaca çalışmamız, sorumluluk, haksız fiil nazariyesi, maddî ve manevî zarar ile maddî ve manevî tazminat konularını kapsamaktadır. İslâm hukukunun, günümüz önemli hukukî problemlerinden olan, tazminat konusunda içerdiği hükümleri mümkün olduğu kadar güncelleştirmeye çaba sarfettik. Türk hukuk sistemiyle yaptığımız mukayeselerle de tazminat sahasında ortaya konulabilecek meseleleri değerlendirmeye çalıştık. İlahî menşeli olan islâm hukukunun, teknoloji çağının sonuçlan olan değişik şekillerdeki maddî ve manevî zararları tazmin etmede dayanak olabilecek nitelikte geniş kapsamlı hukukî normlara sahip olduğu sonucuna vardık."
