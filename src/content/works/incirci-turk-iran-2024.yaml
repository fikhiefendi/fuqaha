abstract: "Türk ve İran hukuklarında evlenme konusunu ele alan bu yüksek lisans tezi, her iki ülkenin hukuk sistemlerinde evlenme akdi kavramının nasıl düzenlendiğini ve uygulandığını analiz etmeyi amaçlamaktadır. Türkiye'de Medeni Kanun'a göre gerçekleştirilen evlenme akdi ile İran'da İslam hukuku ve yerel kanunlar çerçevesinde düzenlenen evlenme akdi arasındaki benzerlikler ve farklılıklar incelenecektir"
