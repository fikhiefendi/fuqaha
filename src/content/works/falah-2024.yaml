abstract: "Bu araştırma, Ebu't-Tayyib el-Sindî'nin (ö. 1145)“Kurretü'l-Enzâr Ala Şerhi Tenvîri'l-Ebsâr”adlı kitabını konu almaktadır. Hanefi fıkhının bölümlerini kapsamlı bir şekilde ele alan bir eserdir. Bu çalışmada,“Kitâbu's-Salât”bölümünden“İdrâkü'l-Ferîza”babına kadar olan kısmı üzerinde durulmuştur. Yazma eseri, Hanefi fıkıhçılarının birçoğunun görüşlerini içerdiği için ilmi değeriyle bilinmektedir. Hanefi mezhebinin temel kitaplarına, nadir bulunanlarına ve hatta kaybolmuş pek çok fıkıh kaynağına atıfta bulunması, bu değerli şerhe ayrı bir önem katmaktadır. Çalışmada, yazarın kişisel ve ilmi biyografisi tanımlayıcı ve tarihsel bir yöntemle incelenmiş, eserin metnini tahkik ederken de metin eleştirisi yöntemi izlenmiştir. Araştırmanın sonucunda Ebu't-Tayyib el-Sindî'nin, terâcim kitaplarında biyografileri yeterince yapılmamış alimler arasında yer aldığı tespit edilmiştir. Ancak yazdığı eserlerdeki yöntem ve metoduna bakıldığında, ilmi kişiliği, namı, fıkıh ve diğer ilimlere olan hakimiyeti hakkında şüpheye yer vermemektedir. Yazdığı bu eser fıkıh, hadis, dil ve diğer alanlara dair zengin bir bilgi içermektedir ve yazarın bilgeliği özellikle Hanefi fıkhının dallarındaki birikimini göstermektedir. Her meseleyi sahibine isnat eder, ya onun görüşüne katıldığını belirtir ya da Kur'an ve Sünnet'ten delillere dayanarak onun görüşünü reddeder. Kadının sesinin avret olmadığını tercih etmesi bunun örneğidir. Kitabında Hanefi mezhebiyle sınırlı kalmamış, Şafii ve Hanbeli gibi diğer mezheplere de yer vermesi fıkıh alanında birikim sahibi olduğunu da göstermektedir. Bu da kitabını namaz konusuyla ilgili fıkhî tercihleri bakımından kendisinden sonra gelenler için önemli bir referans haline getirmiştir. Yine kitabında pek çok dil nüktelerine, nahiv kurallarına önem vermiş, sözlüklere ve garibul'-alfâz eserlerine de yer vermiştir. El-Sindî hadis alanında da söz sahibidir. Eserinde sahih hadislere itimat etmesine rağmen birkaç yerde zayıf hadislere de değinmiştir."
