abstract: "Ebü'l-Berekât en-Nesefî, es-Siğnâkî, Abdülaziz el-Buhârî ve Emir Kâtip el-İtkânî gibi önemli âlimlerin üzerine şerhler yazdığı, uzun süre ders kitabı olarak okutulan, Hanefî usûl-i fıkıh ilminde muhtasar eserler alanında önemli bir yeri bulunan el-Müntehab fî usûli'l-mezheb, Hüsamüddîn el-Ahsîkesî tarafından kaleme alınmıştır. Yaşadığı çağ göz önüne alındığında, müellifin eserini zor şartlar altında Moğolların İslam devletini işgal ettiği bir zamanda yazdığı görülmektedir. Eser incelendiğinde bazı farklılıklar olmakla birlikte Pezdevî'nin el-Usûl'ünün muhtasarı olduğu anlaşılmaktadır. Emir ve nehyin lafızlardan sonra zikredilmesi, hurûfu'l-meânînin eserin sonuna alınması ve ictihad konusuna girilmemesi örnek olarak gösterilebilir. Eserinde aslî kaynaklardan olan Kitab, sünnet, icmâ ve kıyas bahislerinin yanında istihsan, şer'u men kablenâ gibi fer'i kaynaklara ve şer'î hükümlere de değinen müellif, bunlarla ilgili tanım, örnekleme ve açıklamalarda bulunmuştur. Müellif, Ebû Hanife ve İmam Şâfiî başta olmak üzere Hanefî âlimlerin de görüşlerine yer vermiştir. İhtilaflı konularda özellikle İmam Şâfiî'ye çokça atıfta bulunmuştur. Hanefî mezhebinde en çok görüşlerinden yararlandığı âlim ise İmam Muhammed olmuştur. Eserinde mana bakımından lafızları dörtlü taksim sistematiğine göre ele alan Ahsîkesî, bu açıdan Pezdevî'nin geleneğini devam ettirmiştir. Türkiye başta olmak üzere çeşitli ülkelerin kütüphanelerinde çok sayıda yazmasının bulunmasının, eserin şöhretini ve etki alanını ortaya koyduğu söylenebilir."
