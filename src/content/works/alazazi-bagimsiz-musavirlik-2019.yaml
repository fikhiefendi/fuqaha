abstract: "“ Bağımsız Şer'î Müşâvirlik ve Kurumlar İçin Önemi ”Bu çalışma İslam ekonomisine göre faaliyet göstermek isteyen bir şirketin takip edilmesi ve gereken en uygun konuma ulaşabilmesi ve kendisine İslami bir şirket adının verilebilmesi için bağımsız bir hukuk müşavirliği çerçevesinde ilerlemeyi amaçlamıştır. Fetva ve Şeriat Denetleme Komiteleri işin baskısı ve yayınlanan Fetvanın uygunsuzluğu da dahil olarak birçok zorlukla karşılaşmaları bununla birlikte üyelerine yönelik yapılan aşırı baskı nedeniyle daha az etkili olmaları göz önünde bulundurulduğunda bu duruma alternatif çözüm bulunup önerilen şeriat danışmanının temsilci olarak İslam hukukunun nasıl uygulanacağıyla ilgili bilgi sahibi olması gereken şirketlere meşru yönü ile yasal öneride bulunması gerektiğini İslam ekonomisinin en önemli konularından biridir. Önceki çalışma ve araştırmalara istinaden Şeriat denetiminin bankalardaki rolünü ve İslam ekonomisine göre faaliyet gösteren şirketlerde hukuk danışmanlığı mesleği çalışmasının konusuna değinilmemiştir. Böylece، meşru hukuk müşaviri olarak bu alanda bir uzman araştırmacı، bilimsel bilgi birikimini، düşünce ve zihinsel yaratıcılığı، sunumu، kodlaması ve sonuçlara ulaşmadaki olumlu rolünü tavsiyelerde bulunmayı amaçlamaktadır. Araştırmacı، İslami ekonomisine uygun olarak faaliyet göstermek isteyen her şirket için harici hukuk danışmanlık mesleğinin öncelikli olarak benimsenmesini tavsiye eder. Böylece، İslami Mali Kurumlar Muhasebe ve Denetim Kurumu (AAIOFI) tarafından yayınlanan standartlara göre Şeriatı referans göstererek yasal inceleme yapar ve başvuru hakkında yasal görüş bildirir. Bütünlüğü ve şeffaflığı sağlamak için bir denetleme personeli atanmasını uygundur. Bu durumda، çalışanın bir iç hukuk denetçisi olarak atanmasını veya Şeriat Denetiminin işlevleri için daha fazla bir şey yapmasını engellemez. Anahtar Kelimeleri: Şeriat Danışmanlığı, İslami Ekonomi Şirketleri, Şeriat müşaviri Mesleği."
