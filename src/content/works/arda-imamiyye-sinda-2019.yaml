abstract: "İmamiyye denilince akla Hz. Ali gelir. Hz. Ali'ye bağlı olan, O'na sevgide ileri gidenler Şia olarak adlandırılacağı gibi, özellikle Hz. Ali'yi ve O'nun dinî/siyasi kimliğini kullanarak bir yerlere gelebilme gayretinde olanlar da bu gruba dahil edilebilir. Şiîler teşekkül sürecini biraz daha gerilere götürerek Hz. Peygamber döneminden itibaren var olduklarını iddia etmişlerdir. Şia'nın tüm alt kolları gibi İmamiyye'de de imamet meselesi inanç esaslarındandır. İmamiyye'yi İmamiyye yapan en önemli konu imamet anlayışıdır. İmameti nübüvvet kadar, hatta daha elzem gören İmamiyye'ye göre imamların takip ettikleri yol peygamberin yoludur. Hz. Peygamber (s.a.s.), insanlığın hidayeti için Allah tarafından gönderilmiş bir elçidir. Ancak bir kul olan Hz. Peygamber (s.a.s.)'in vefatı sonrasında da Allah'ın lutfu gereği insanların hidayeti için onlara yol gösterecek kimselerin varlığı daima olmak zorundadır. Hz. Peygamber (s.a.s.)'den sonra insanlara, şeriati açıklayacak onların hidayet üzere kalmaları için çabalayacak olanlar tıpkı peygamberler gibi Allah tarafından seçilmiş olan imamlardır. İmamiyye bu inancıyla imameti nübüvvetin bir devamı olarak kabul etmiştir. Onlar, inanç sistemlerini bu anlayış üzerine bina etmiş ve geliştirmişlerdir. İmamiyye'yi diğer mezheplerden farklı kılan bu inançlarını çıkardığımızda onların diğer mezheplerden çok farkının olmadığı görülecektir. Yüksek lisans tezi olarak hazırladığımız bu çalışmamızda ilk olarak konumuzla alakalı belli başlı kavramları açıklamaya çalıştık. Daha sonra Şia mezhebi içerisinde ortaya çıkan ana kollar olan Zeydiyye ve İsmailîlik'ten kısaca bahsettik. Son bölümde çalışmamızın ana konusunu oluşturan İmamiyye'de nübüvvet ve imamet ilişkisini öncelikle kendi kaynakları doğrultusunda ortaya koymaya çalıştık ve oniki imamın hayatlarını genel hatlarıyla anlatmaya gayret gösterdik."
