abstract: "ktisadi bir konu olan fiyat oluşumu kelâm eserlerinde Allah'ın ve insanların fiilleri bağlamında ele alınmıştır. Fiyat konusu iktisat tarihi boyunca değer kavramıyla birlikte değerlendirilmiş ve iktisadi doktrinleri birbirinden ayıran temel bir faktör olmuştur. Çalışmamızda öncelikle fiyat ve fiyat ile ilgili kavramlar ele alınmıştır. Daha sonra fiyat kavramının nasslardaki işlenişine değinilmiş, ilgili ayet ve hadisler verilerek gerekli değerlendirilmeler yapılmıştır. Kelâmda konuya dair mezheplerin görüşleri ele alınmış ve kelâmcıların anlayışlarına yer verilmiştir. Daha sonra modern iktisadın ekoller bazında fiyat oluşumuna dair görüşleri ele alınarak konu modern iktisatçıların ve kelâmcıların görüşlerinin mukayese edilmesi suretiyle değerlendirilmiştir. Bu çalışmada iktisadi bir mesele olan fiyatın kelâmcılar tarafından incelenmesinin ardındaki esas unsurun ne olduğu sorgulanmış ve onların fiyat oluşumuna yaklaşımı ile modern iktisadın yaklaşımı arasındaki benzerlik ve farklılıkların tespit edilmesi hedeflenmiştir. Sonuç olarak kelâmcıların bu konuyu ele almalarının temel sebebi olarak iktisadi hayatın asıl koordine edicisini tespit etmeye yönelik olduğu görülmüştür. Bunu yaparken de küllî ve cüz'î irade arasındaki ilişkiyi anlama noktasında kendi aralarında lugavî bazı ihtilafların ortaya çıktığı tespit edilmiştir. Ayrıca modern iktisat ile kelâmcılarda iktisadın ardında ortak bir ulûhiyet vurgusunun olduğu ortaya konmuştur. Ancak modern iktisadın sekülerleşme çabaları dolayısıyla ulûhiyet vurgusunu açıkça ifade etmeyip başkaca soyut kavramlar üreterek açıklamaya çalıştığı tespit edilmiştir."
