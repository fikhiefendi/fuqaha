abstract: "Osmanlı Devleti, 1299 yılında Osman Bey tarafından kurulmuş ve 1922'ye kadar varlığını sürdürmüştür. 600 yılı aşkın sürede üç kıtada geniş bir coğrafyada hüküm süren Osmanlı Devleti, siyasi, ekonomik ve kültürel açıdan etkili olmuş; Türk – İslam geleneği üzerine hüküm anlayışı benimsemiştir. Osmanlı İmparatorluğu'nun önemi, stratejik merkezi konumundan ve Batı Avrupa ile Asya arasında bir köprü rolü oynamasından kaynaklanmaktadır. Hem Doğu hem de Batı medeniyetlerinden etkilenmiş ve etkilenmiştir. Osmanlı Şer'iye defterleri sadece hukuk tarihi açısından değil aynı zamanda Osmanlı Devleti'nin sosyal, siyasi, ekonomik ve kültürel tarihi açısından da son derece önemli bir bilgi kaynağıdır. Bu çalışmada 206 numaralı Üsküdar Kadı Sicili incelenerek, Osmanlı Devleti'nin idari ve hukuk sistemini özellikle Üsküdar Kadı sicilleri üzerinden inceleyerek, dönemin ekonomik ve sosyal yapısının anlaşılmasına katkı sağlamayı amaçlamaktadır."
