abstract: "Bu çalışma, Şeriat Mudaraba kavramına, meşruiyetinin delillerine ve esaslarına ışık tutmayı ve Yatırım fonlarında Şeriat Mudaraba'nın uygulanmasına ilişkin Şeriat esaslarını, fon yöneticisi ile katılımcıları arasındaki sözleşmeye dayalı ilişki açısından açıklamayı amaçlamaktadır, Fonun faaliyetlerinin yatırım alanları açısından değerlendirilmesi ve fonun kullanımına ilişkin en önemli engel ve risklere ışık tutulması amaçlanmaktadır. Yatırım fonları ve riskten korunma mekanizmalarında Şeriat Mudaraba. Bu çalışmada, çalışmanın probleminin temsil ettiği ana soruyu cevaplamak amacıyla, Çalışmanın alt sorularını yanıtlamak için bilimsel araştırma literatürü aracılığıyla betimsel analitik yöntem kullanılmıştır, ABD DOLAR BAZLI AL-RAJİHİ MUDAREBA EMTİA FONU, Cinsinden çalışma modelini değerlendirin, Mali tablolarını analiz ederek ve bu modelin güçlü ve zayıf yönlerini belirterek, yatırım fonlarında spekülasyonun kullanımının geliştirilmesinde bundan faydalanmak. Çalışmada çok sayıda sonuç ve öneriye ulaşılmış olup bunlardan en önemlileri şunlardır: Fonların çoğu, geleneksel bankaları yönetme anlayışıyla yönetilmekte ve gerçek yatırımlara girmenin alternatifi olarak finansal aracılık rolünü üstlenerek faaliyet göstermektedir. risklere karşı oldukça muhafazakar bir yatırım ortamı. Harici bir yürütme otoritesi tarafından desteklenen bağımsız bir Şeriat denetim organı aracılığıyla geliştirilecektir. Çalışma, kapalı yatırım fonlarındaki reel yatırımlara erişim yoluyla tasarrufların harekete geçirilmesi, ticari işlemlerin kolaylaştırılması ve karların dağıtılması yoluyla Şeriat Mudaraba'nın kullanımının geliştirilmesine yönelik bir öneri sunularak sonuçlandırılmıştır."
