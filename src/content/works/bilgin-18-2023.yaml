abstract: "Son dönem Osmanlı fakihlerinden biri olan Hâdimî, modern dönemin öncesinde ve ictihad-taklid tartışmalarının yoğunlaşmaya başladığı bir zaman diliminde yaşamıştır. Söz konusu dönem Osmanlı Devleti'nin siyasî, iktisadî ve içtimaî yönden sıkıntı içinde olduğu XVIII. asra tekabül etmektedir. Kahve, tütün, raks, istihlâf ve îne usûlü ticaret gibi güncel konularla ilgili tartışmaların sürdüğü bu asırda fakılar ve sofular mücadelesi de tamamen gündem dışı kalmış değildir. Hâdimî'nin bu manada yaptığı en önemli hizmet, zâhiri ve bâtînî ilimlerde birçok eser ortaya koymasıdır. İhtilaflı konulara yaklaşımındaki derinliğin yanı sıra özellikle Kadızâdeliler ve Sivâsîler arasındaki tartışmalarda mutasavvıfların kullandığı delilleri yeniden yorumlaması, sözü edilen gruplar arasındaki gerginliklere yeni bir boyut kazandırma çabası açısından oldukça önemlidir. Bazı mutasavvıfların sınırları zorlayan sübjektif yorumlarına karşı fakihlerin kavillerine muârız olan nassların kullanılmaması gerektiğine dâir vurguyu ve tartışmanın mezhep yapısı içinde sürdürülmesinin gerekliliğine yönelik ifadelerini de bu stratejik yaklaşımın bir sonucu saymak mümkündür. Bu çerçevede denilebilir ki hem eserlerinin niteliği hem de ilmî kudreti bakımından Hâdimî yaşadığı çevre ve dönemi aşan bir etkiye sahiptir. Bu kapsamda tezin giriş ve üç bölümden oluşması planlanmıştır. Araştırmanın amaç, kapsam ve yönteminin anlatıldığı giriş kısmından sonra birinci bölümde Hâdimî'nin hayatı, eserleri ve ilmi kişiliğine dâir bilgilere yer verilmiştir. İkinci bölümde ise Hâdimî'de fıkhî meseleler ele alınmış ve onun fıkhî meselelere yaklaşımında bir fakih olarak takip ettiği yöntem ve usûl üzerinde yoğunlaşılmıştır. Üçüncü ve aynı zamanda son bölümde Hâdimî'nin fıkhî meselelere yaklaşımında yararlandığı kaynakların tespit ve analiziyle birlikte genel bir değerlendirmesine yer verilmiştir. Çalışma süresince ulaşılan neticeler ise sonuç kısmında özetlenmiştir."
