abstract: "Bu çalışma, Filistin Arazi Kurumu'nun el değiştiren mülkiyet işlemlerini belgeleme ve muhafaza etme sürecinde karşılaştığı zorlukları ele almayı amaçlamaktadır. Bu süreç, İslam hukukunun temel gereklerinden biri olan malın korunması bağlamında büyük önem taşımaktadır. Çalışmada mevcut uygulamalar, İslami ekonomik ilkeler doğrultusunda—mülkiyetin korunması, adalet ve şeffaflığın sağlanması, hak ihlalleri ve manipülasyonların önlenmesi gibi esaslar çerçevesinde—analiz edilmekte ve geliştirilmektedir. Araştırma, betimsel ve analitik yöntemle literatür, raporlar ve önceki çalışmalar ışığında yürütülmüş; aynı zamanda mevcut sistem ve uygulamaların analizine yönelik vaka çalışması yöntemi de kullanılmıştır. Bu analizler doğrultusunda mevcut prosedürler değerlendirilmiş ve geliştirilmiş, sonrasında eksikliklerin giderilmesi ve faydanın maksimize edilmesi amacıyla blokzincir teknolojisinin uygulanmasına ilişkin önerilen bir model (akış şeması) sunulmuştur. Araştırmanın sonuçları, blokzincir teknolojisinin şeffaflık, güvenilirlik ve mülkiyet haklarının korunmasını güçlendirme potansiyeline sahip olduğunu ortaya koymuştur. Ayrıca işlem hızının artırılması, operasyonel kapasitenin geliştirilmesi ve karmaşık Filistin bağlamında mülkiyetle ilgili ihtilafların ve çelişkili iddiaların çözümüne katkı sağladığı görülmüştür. Bu durum, çalışmanın sonuçlarına yerel düzeyde önemli bir uygulama boyutu kazandırmaktadır. Başlıca öneriler arasında: blokzincir teknolojisinin kamu sektöründe uygulanmasını destekleyecek yasal düzenlemelerin geliştirilmesi ve yürürlüğe konulması; farklı kurumları bir araya getiren ulusal düzeyde bütünleşik bir elektronik platformun oluşturulması; mülkiyet verilerinin ve malik haklarının korunması, verilerin sürekliliğinin sağlanması ve mevcut siyasi ve idari zorluklar karşısında veri kaybı ya da tahribatının önlenmesi amacıyla coğrafi olarak dağıtılmış merkeziyetsiz bir dijital kayıt sisteminin kurulması yer almaktadır."
