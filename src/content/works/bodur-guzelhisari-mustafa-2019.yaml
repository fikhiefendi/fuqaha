abstract: "Bu çalışmada, Osmanlı âlimlerinden Güzelhisârî Mustafa Efendi'nin itikadî görüşleri ve Tuhfetü'n-Nebî adlı Fıkh-ı Ekber şerhi konu edilmektedir. Güzelhisârî Mustafa Efendi, Aydın Güzelhisarı vilayetine bağlı Denizli sancağının Buldan nahiyesinde doğmuştur. Güzelhisârî Mustafa Efendi, Hanefi fakihi ve mutasavvıftır. Fıkıh ve akaide dair günümüze ulaşmış şerh ve haşiyeleri bulunmaktadır. Bu araştırmaya konu edilen Tuhfetü'n-Nebî adlı eser, Ebû Hanîfe'nin Fıkh-ı Ekber adlı risâlesi üzerine Güzelhisârî Mustafa Efendi tarafından yazılan Osmanlıca bir şerhtir. Bu çalışma; giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, yöntemi ve kaynakları belirtilmiştir. Birinci bölümde Güzelhisârî Mustafa Efendi'nin yaşadığı sosyokültürel çevre, hayatı ve eserleri hakkında bilgi verilmiştir. İkinci bölümde Tuhfetü'n-Nebî'nin günümüze ulaşmış sekiz adet nüshası tanıtılmış ve Osmanlıca metin, latin harfleri ile yazılarak değerlendilirmiştir. Üçüncü bölümde Tuhfetü'n-Nebî risâlesi asıl kaynak olarak belirlenerek Güzelhisârî Mustafa Efendi'nin itikadî görüşleri ele alınmıştır. İtikadî görüşleri; iman anlayışı, Allah'a iman, peygamberlere iman, ahirete iman ve diğer meseleler olmak üzere beş başlıkta değerlendirilmiştir. Sonuç bölümünde ise Güzelhisârî Mustafa Efendi'nin kelâm anlayışı hakkında genel bir değerlendirme yapılmıştır."
