abstract: "İslam düşüncesinin önde gelen isimlerinden olan İmâm Şâfiî (ö. 204/820), hadis ve fıkıh ilimlerinin ikisine de hâiz olan önemli bir şahsiyettir. İmam Şâfiî, hem Medine ekolünden hem de Irak ekolünden istifade etmiştir. O'nun 'Hadis sahih olursa, o benim mezhebimdir' şeklindeki ifadesi meşhur olmuştur. Bazı âlimler sahih olarak kabul ettikleri veya sadece sahih hadislerin yer aldığı eserlerdeki bütün hadislerle amel etmişlerdir. Bazı âlimler ise amel edilen bütün sahih hadislerin İmâm Şâfiî'nin sözünün zahirine uygun olduğunu düşünerek bu hadislerle amel edildiğini düşenerek, sahih hadislerden bir kısmında, şeriatın genel kurallarına uygun olmayan durumların varlığını veya insanlar arasında yaygın olan örfi kurallara bir muhalefet olduğunu fark etmiş ve bütün hadislere ihtiyatlı yaklaşmıştır. Çalışmamız, İmam Şâfiî'ye göre bir hadisin sahih olmasının onunla amel edilmesine yeteceğine dair düşünceyi ele almayı, İmam Şâfiî'nin ifadesinin sınırlarınının bilinmesi ve bu ifadeyle amel edilebilmesi için âlimlerin koyduğu gerekli şart ve kuralların farkında olunmasının yanı sıra İmam Şâfiî'nin bazı sahih hadislerle amel etmemesinin nedenlerinin tespit edilmesi üzerine tesis edilmiştir. Ayrıca Şâfiî âlimlerin kitaplarında, Şâfiî ulemanın geçerli olduğunu düşünerek amel ettiği zayıf hadisler de vardır. Bu çalışmadaki amacımız Şâfiî âlimlerin söz konusu zayıf hadislerle amel edip etmemelerinin gerekçelerini ortaya koymaktır. Elde edilen bulgulara göre Şâfiîler, illet, daha güçlü bir delil, icmaa aykırı veya mensuh olması, kişiye özel durumların olması veya hadisin tevil edilmesi sebebiyle bazı sahih hadislerle amel etmemişlerdir. Buna karşılık icmaa ve Kur'ân'ın zahirine uygun olması, sahih bir hadisin umumuna dahil olması, kıyasa uygun ve sahabi kavline veya fiiline uygun olması ayrıca mürsel, mutabaât veya şevahidle takviye edilmesi son olarak ise ihtiyat gerekçesiyle bazı zayıf hadislerle amel ettikleri anlaşılmıştır. Çalışma sözü edilen amaçlar doğrultusunda üç ana başlığa ayrıldı. İlk kısım Şâfiîlerin hadislerin kabul ve reddine dair genel yaklaşımları, ikinci kısım zahiren sahih olmasına rağmen Şâfiîlerin bu hadislerle amel etmeme nedenleri ve sahih olmasına rağmen Şâfiîlerin te'vil etmelerinden dolayı amel etmedikleri hadisleri, üçüncü kısım ise Şâfiîlerin amel ettiği zayıf hadisler ve bu hadislerle amel etmelerinin nedenleri inceleme konusu yapılmıştır."
