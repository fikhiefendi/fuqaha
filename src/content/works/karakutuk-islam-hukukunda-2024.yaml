abstract: "İslâm hukuk ilmi, hayatın her alanını kapsayan uygulanabilir hükümlere sahiptir. Bu hükümlerin dünya işlerine taalluk eden yönü bulunduğu gibi ahiret hayatını ilgilendiren yönü de bulunmaktadır. Su hem dünya hem de ahiret yönü olan en değerli hazinemizdir. Hayatın her anında önemini hissettiğimiz, varlığının kıymeti bilinmeyen bu yaratılışın mayası ve yaşam sıvısının yokluğu, ölümle eşdeğer bir anlam ifade etmektedir. İslâm hukuk ilmi içerisinde suyun kullanımı ve korunması ile ilgili hükümlerin, büyük bir önemi bulunmaktadır. Kur'ân-ı Kerîm'de üzerinde sıklıkla durulmuş, Allah Resûlü'nün (s.a.v.) sünneti içerisinde ise yüksek seviyede bir önem taşımaktadır. Günümüzde gelişen teknolojiyle beraber, suyun hayatımızdaki önemi daha da artmıştır. Suya olan talebin artması, beraberinde birçok yaşamsal ve hukukî meselenin de ortaya çıkmasına sebep olmaktadır. Bu problemlerin başında ise her geçen gün temiz ve kullanılabilir suya erişimin zorlaşması gelmektedir. Dünyanın çeşitli yerlerinde; su kaynaklarının kısıtlı olması, kuraklık, küresel ısınma ve daha birçok sebepten dolayı 1,1 milyardan fazla insanın temiz içme suyuna ulaşamamaktadır. 2,6 milyardan fazla insan, temizlik için ihtiyaç duyulan suya erişememektedir. Her yıl, 2 milyondan fazla insan temiz suya erişememe ya da susuzluğa bağlı sebeplerden dolayı hayatını kaybetmektedir. İslâm; her şeyden önce insan hayatını öncelemekte, onu tehlikeye düşürecek yolları kapatmakta ve ona büyük değer vermektedir. Bu anlamda insan hayatı ile yakından ilgisi olan suların kullanımı, korunması ve paylaşımı ile ilgili evrensel ilkeler ortaya koyarak bunu gerçekleştirmeyi hedeflemekte ve bizlere sorumluluklar yüklemektedir."
