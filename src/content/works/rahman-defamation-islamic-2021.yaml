abstract: "Hakaret, başkalarının itibar veya saygınlığını zedeleyebilecek nitelikteki açığa vurulmuş aşağılamadır. Şerefe karşı işlenen bu suçun ciddiyeti o kadar ağırdır ki; sadece İslam hukukunda değil, dünyadaki diğer tüm hukuk sistemlerinde ceza gerektiren bir suç olarak kabul edilmektedir. Bu tez; İslam, Malezya ve Türkiye'de hakaret suçunu oluşturan temel unsurları yöneten ilkelerin benzerliklerini ve farklılıklarını incelemeyi, analiz etmeyi ve karşılaştırmayı amaçlamaktadır. Bu üç hukuk sisteminin, mukayeseli çalışmaya konu olan temel konuları şunları içermektedir: Hakaret suçuna yönelik hukuk veya yürürlükteki kanunların kaynaklarına ilişkin temel meseleler, hakaret tanımları, hakaretin kategorileri, hakaretin unsurları, hakaret suçunun işlenebileceği şekiller, hakaret suçuna yönelik var olan savunmalar, hakaret suçu cezaları ve ilgili üç hukuk sisteminde siber hakaret."
