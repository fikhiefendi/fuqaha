abstract: "Bu tez çalışmasında; Türkiye'de bankacılık sisteminde katılım bankalarının tercih sebeplerinin neler olabileceği üzerinde durulmuştur. Katılım bankalarının tercih sebeplerinin sadece faiz hassasiyeti değil, müşteri memnuniyeti, kârlılık, ürün ve hizmet kalitesi, yönetici ve personel davranışları gibi faktörlerin incelenerek ortaya koyması amaçlanmıştır. Çalışmanın uygulama kısmında araştırmanın amacı, kapsamı, araştırmanın modeli ve hipotezleri, kullanılan ölçüm araçları, kullanılan istatistiki analizler ve analiz bulguları verilmiştir. Anket farklı katılım bankalarının 430 müşterisine uygulanmıştır. Uygulanan anket sonuçları SPSS 22.0 paket programı ile analiz edilmiştir. Analiz sonuçları, tablolar halinde yorumlanmış ve sonuçlara ulaşılmaya çalışılmıştır."
