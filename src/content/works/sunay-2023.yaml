abstract: "Bankacılık hizmetlerinin kalitesinin ölçülmesi, günümüzde önemli konulardan biri kabul edilir. Zira bilindiği üzere hizmet kalitesi, ekonomik yönden çok önemli bir durum olmuştur. Bu sadece seçkin hizmet sunumundaki role indirgenemez. Aynı zamanda bu çalışma hizmet sunumunun gerçek performansıyla Yemen'deki İslami ve Ticari Bankalardan bu hususta beklenen performansı karşılaştırmaya çalışmaktadır. Kuşkusuz özellikle Yemen'in içinde bulunduğu koşullar altında bankacılık hizmetlerinin kalitesini ölçmek son derece bir durumdur. Bu sebeple İslami bankalara, geleneksel bankalara ve müşterilerine dağıtıldı çözüm analizi için istatiksel analiz kullanıldı. Sonra gerek müşterilerin ve gerekse banka içerisinde çalışan görevlilerin görüşleri değerlendirilecektir. Dolayısıyla hizmetle ilgili müşterilerin beklentileriyle kendilerine sunulan gerçek hizmet arasındaki farkları ölçmek için kullanıldı SERVQUAL kalite ölçümü kullanılacaktır. Bu da“Hizmet Kalitesi”(Service Quality) kelimesinin kısaltılmış hali kabul edilir. Aynı şekilde bu ölçek, hizmeti değerlendirmesi için sunulan bir dizi boyut ve kriterlere dayanmaktadır. Hizmetin değerlendirmesi ise hazırlık, altyapı, ekipman ve buna ek olarak itimat, güven, hızlı yanıt, önem verme gibi somut maddi yönler aracılığıyla olacaktır. Aynı şekilde sonuçlar, hizmetlerin kalitesi ve beklenen hizmetlerin boyutlarıyla müşteri memnuniyeti arasında ilişki olduğunu ortaya koymuştur. Hizmetlerin kalitesi ve beklenen hizmetlerin boyutları artıkça müşterilerin memnuniyeti artmaktadır. Ulaşılan sonuçlara dayanarak araştırma, müşteri beklentileri ve arzularıyla reel olarak sunulan kalite düzeyi arasında boşluğu daraltmaya odaklanmayı önermektedir. Buna ek olarak reklam ve tanıtım esnasında hizmetlerin kalitesi hususunda farklı yönlere odaklaşmayı ve daha fazla müşteri çekebilmek için yeni araçlar yaratmayı önermektedir."
