abstract: "Kur'anve Hz. Peygamber'insünneti, asırlarboyuncabütünİslamiilimlerekaynaklıketmiştir.Hz. Peygamber hayattayken insanlarmerakettiklerihususlarıonasorarbaşkabirşeyeihtiyaçduymazlardı.Hicri ilk asırlardasahabenin de vefat etmesi ile rivayet ilmi, pekçoksahada, bilhassa da insanların fıkhi ihtiyaçlarının giderilebilmesinde zaruri bir ihtiyaç haline gelmiştir.Bu çalışmamızda hicri ikinci asırda yaşamış fakihlerin, rivayetleri nasıl ele aldıklarını ve hadis rivayetleriyle ilgili kavramların oluşmasında hadisçiler üzerindeki etkilerini göstermeye çalıştık. Çalışmamız bir giriş ve iki bölümden oluşmaktadır.Birincibölümde h. ikinci asırda yaşamış fakihlerin eserlerini inceleyerek hadis usulü kavramlarının oluşmasında katkısı olan verileri ortaya çıkarmaya çalıştık. Çalışmamızda fıkıh âlimlerinden EbuHanife, yakın öğrencileri, Malik veŞafii'nin eserlerini ele almakla yetindik. İkincibölümde, birinci bölümde ortaya çıkardığımız verilerden hareketle, fakihlerin kullandığı hadisle ilgili kavramları hadisçilerin kullanımı ile mukayese ederek aralarındaki farklılıklara ve fakihlerin bu alanda hadisçiler üzerindeki etkilerine değindik."
