abstract: "Bu çalışma, 4./10. asırda Ehl-i hadîs ve Ehl-i re'y ekollerinin hadis ve fıkıh merkezli konularda karşılıklı ilişkilerine odaklanmaktadır. Özellikle dönemin birincil kaynaklarından elde edilen veriler üzerinden belirlenen temalar etrafında söz konusu iki ekolün birbirlerine yönelttikleri tenkitler, aralarında yaşanan tartışmalar ve bunların etkileri çalışmanın konusunu teşkil etmektedir. Gerek Ehl-i hadîs gerekse Ehl-i re'y'in 4./10. asırda, birbirlerinin düşüncesi, gündemi ve kaynaklarıyla yoğun bir ilişki içine girdiği, zayıf ve kuvvetli noktalarından haberdar olduğu ve etkileşimin bu ölçüde canlılığını koruduğu görülmektedir. Çalışmanın neticesinde Ehl-i hadîs'in, Ehl-i re'y'e karşı eleştirilerinin onların düşünce yapılarında birtakım değişimlere sebep olduğu ileri sürülebilir. Bu bağlamda Ehl-i hadîs'in, Hanefîlerin kurucu imamına yönelttiği tenkitler karşılığında Ebû Hanîfe biyografilerinin yeniden yazıldığı tespit edilmiştir. Ayrıca Ebû Hanîfe'nin hadis ilmindeki durumu hakkındaki tartışmalara binaen Ehl-i hadis'in tenkit, Ehl-i re'y'in ise müdafaa amacıyla imamın hadislerini müsned adı altında bir araya getirmiş olabileceği iddia edilmiştir. Öte yandan yine Ehl-i hadîs tarafından dillendirilen re'yi hadislere takdim etme iddiasının etkisiyle Hanefî fıkhının hadis temellerini bir araya getiren ve hadis-fetva uzlaşısı sağlamaya çalışan telif türlerinin ortaya çıktığı saptanmıştır. Karşı taraftan bakıldığında ise Ehl-i re'y'in eleştirilerinin Ehl-i hadîs'te birtakım yeniliklere sebebiyet verdiği gözlemlenmektedir. Tefakkuh eksikliği etrafında yoğunlaşan bu tenkitlerin, Ehl-i hadîs'e ait literatürün bir kısmının şekillenmesinde başlıca etkenlerden biri olduğu sonucuna varılmıştır. Bu etkinin izleri ilk hadis usûlü eserleri, hadis kaynakları ve şerh kitaplarında takip edilebilir."
