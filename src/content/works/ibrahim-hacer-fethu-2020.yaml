abstract: "Çalışmada İbn Hacer'in Hanefîler'e yaklaşımını öğrenmek üzere Hanefî ve Şafiîler'in aynı görüşü savunduğu meseleler ve farklı görüşleri benimsediği konular ele alınmıştır. İhtilaflı meselelerde genelde taassup gösteren İbn Hacer, Hanefîler'in delillerini zikretmemekte, yahut eksik sunmakta, sahih deliller bulunduğu halde onların kanaatlerini tamamen zayıflatabilmektedir. Taassubu genelde gizli bir tarzda gerçekleştiren İbn Hacer'in İmam Tahâvî gibi Hanefî Mezhebinin müstakil bir imamını hedef alması da mümkündür. İbn Hacer'in Hanefî mezhebine karşı hoşgörüsüzlüğünün nedeni, mezhepler arası köklü anlaşmazlıklardan, Mısır'daki ilmi tartışmalardan kaynaklanmaktadır. Bazı âlimler İbn Hacer'i taassupla suçlamıştır. Öte yandan İbn Hacer Fetḥu'l-bârî adlı eserinde Hanefî ve Şafiî mezhepleri arasındaki tüm ihtilaflı konularda Hanefî mezhebine karşı taassup göstermemektedir. İbn Hacer, Vitir namazı gibi meselelerde iki grubun delillerini tarafsız bir şekilde sunmaktadır. Bununla birlikte İbn Hacer'in Hanefî mezhebine karşı taassubu tartışmalı ictihadi meselelerde çeşitli biçimlere sahiptir. İbn Hacer'in, taassubu dil açısından değerlendirilen istinas/izin meselesinde olduğu gibi fıkhi konular dışında da gerçekleşebilmektedir."
