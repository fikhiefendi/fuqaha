abstract: "Osmanlı Devleti, kendisinden önceki İslam devletlerinden tevarüs ettiği Şeyhülislâmlığı bir müessese haline getirmiştir. 1826'da Yeniçeri Ocağının kaldırılmasıyla devletin kuruluşundan itibaren var olan Şeyhülislâmlık yeni, sabit ve müstakil bir alana taşınmıştır. Tanzimatla birlikte devletin diğer kurumlarına paralel olarak Şeyhülislâmlık, devletin bürokratik yapısında yerini almış ve sistematik bir şekilde örgütlenmiştir. Tarihi süreçte dinî, hukuki ve eğitim alanındaki birimleri ile bir külliye halini alan ve günümüzün Diyanet İşleri Başkanlığı, Adalet Bakanlığı ve Milli Eğitim Bakanlığı'nın görevlerini yürütmüş olan Şeyhülislâmlık, devlet yapısındaki değişiklikler neticesinde görev, yetki ve sorumluluklarının bir kısmını yeni kurulan nezaretlere bırakmıştır. Şeyhülislâmlığın bulunduğu mekân 1924 yılından itibaren İstanbul Müftülüğü, İstanbul Kız Lisesi ve İstanbul Üniversitesi Botanik Enstitüsü'ne ev sahipliği yapmıştır. Tezimizde Şeyhülislâmlık belgeleri ışığında Şeyhülislâmlık'taki Fetvâhâne-i Âlî, Anadolu ve Rumeli Kazaskerliği, İstanbul Kadılığı, Nakîbü'l-eşrâflık, Mektûbi Kalemi, Evrak Odası/Evrak Müdüriyeti, Dosya ve İstatistik Kalemi, Muhasebe-i İlmiye, Sicill-i Ahvâl İdaresi, Memûrîn Kalemi Müdüriyeti, Meclis-i Tedkîkât-ı Şer'iyye, Emvâl-i Eytâm Müdüriyeti, Beytü'l-mâl Müdüriyeti, İlmiye Tekâüd Sandığı, Meclis-i İntihâb-ı Hükkâm, Evkâf-ı Hümâyûn Müfettişliği Mahkemesi, Meclis-i Meşâyih, Tedkîk-i Mesâhif ve Müellefât-ı Şer'iyye Meclisi, Ders Vekâleti ve Meclis-i Mesâlih-i Talebe, Meclis-i İmtihan-ı Kur'a, Sicillât-ı Şer'iyye Dâiresi, Şûrâ-yı İlmiyye ve Encümen-i Islâhât-ı İlmiyye, Mecelle-i Ahkâm-ı Adliye Cemiyeti, Cerîde-i İlmiye Müdüriyeti, Dârü'lHikmeti'l-İslamiyye, Bâb-ı Fetvâ Camisi ve Bâb-ı Fetvâ Tabâbeti birimlerinin kuruluşu, işleyişi, yetki ve hizmet alanı, görevlileri, ilmiye bürokrasisindeki işlevi, Şeyhülislâmlık içerisindeki konumu, görevlilerinin ilmi kariyerleri, arşiv kaynakları ve teşkilat şeması ele alınmıştır."
