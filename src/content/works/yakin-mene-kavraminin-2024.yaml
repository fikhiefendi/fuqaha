abstract: "Fiziksel güç, insan hayatında kullanıldığı yerlere göre farklı sınırlamalar içerir. Devlet erkinin, vatandaşları nezdinde ve diğer devletler arasında egemenliğini kazandıran güç, etki alanı bakımından daha geniş çaplı bir gücü ifade eder. Bir suç failinde bulunması gereken güç ise yerine göre bu denli büyük bir gücü gerektirmez. Yerine göre içeriği değişen bu güç, İslam hukuk literatüründe ele alınırken mene'a kavramıyla ifade edilmiştir. Müellifler, bu kavram hakkında net olarak herhangi bir tasnif ya da sınırlama faaliyetine gitmemiş, ilgili bölümlerde değinmekle yetinmiştir. Bu sebeple bu çalışmada normal bir fiziksel gücün aksine caydırıcı, hükmedici ve tehdit ettiği şeyi yerine getirebilen bir gücü temsil eden mene'a kavramının kullanım yerleri genel hatlarıyla belirlenmiş; İslam hukukçularının koyduğu genel ilkeler çerçevesinde mene'anın yansıma şekli ve yerlerine netlik kazandırılmaya çalışılmıştır. Bu gücün, yerine göre suç faillerinde bazen devletin tüm güvenlik güçlerini organize olarak harekete geçirmeye sebep olduğu; bazen de kişinin mağdur tarafın çekindiği bir kişi dahi olmasının yeterli olduğu tespit edilmiştir. Mene'anın, maddi unsur olarak bulunduğu suçları, açıktan işlenen ve toplum güvenliğini tehdit eden suçlar kategorisinde değerlendirilmesine sebep olduğu sonucuna ulaşıldı. Bu değişimler ışığında cana ve mala yönelik işlenen suçlar itibara alındığında mene'anın hırâbe suçunu bu suçlardan ayırt eden maddi unsur olduğu kanısına varıldı. Klasik fıkıh literatüründe ikrah gibi konular içerisinde fetva değişimine sebep olduğu kanısından hareketle günümüzde teknolojik imkânların gelişmesi ve suç şekillerinin artmasıyla suç faillerinde aranan caydırıcı gücün teknolojik araçlarla daha kolay elde edilebildiği düşüncesine varıldı."
