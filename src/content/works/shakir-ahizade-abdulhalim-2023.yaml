abstract: "Bu yazma eseri, Cuma namazı konusunda yazılan en kapsamlı risâlelerinden biridir. Yazar, eserin isminin verilme sebebini ve faziletlerini zikretmiş ve onu ilk Cuma namazını kılan kişiden bahsetmiştir. Daha sonra, Cuma namazının farz oluşu Kuran, Sünnet ve ümmetin icmâi ile sabit olmasını, bu günün faziletleri, Cuma namazını kılınması gerek şehrin sınırı ve şartları, Hanefi mezhebinde Cuma namazından sonra öğle namazını kılınması hususunda detaylı bilgiler vermiştir. Bu risâle, Hanefi mezhebinin Cuma namazı meseleleri ve Cuma namazı kılınması gerek şehrin şartları konusundaki sözlerinin çoğunu ele almıştır. Yazar, geniş şekilde İbn Ghanem elMakdisî'nin Nûru'ş-şem‛ati fi zuhri'l-cum‛a adlı eserine dayanmış, bu eser aracılığıyla, âlimlerin bahsi geçen konu hakkındaki görüşlerinin çoğunu aktarmaya çalışmıştır. Yazar, bu risâlede Cuma namazından sonra dört rekât vakit namazın kılınmasının caiz olduğu görüşünü tercih etmiş ve haram olduğunu söyleyenlerin sözlerine de değinmiştir. Araştırmacı ise, yazma eserin nüshalarını toplayıp incelemeye çalışmıştır. Bu nüshaları karşılaştırdıktan sonra bilimsel tahkik kuralları dikkate almak mevcut nüshayı istinsah etmiştir. Araştırmacı, nüshada geçen Kur'an ayetlerini Mushaf'ta olduğu gibi yeniden yazmış, hadislerin tahrici de yapmıştır. Eserde gen özel isimlerin biyografisini yapmış, alıntıların kaynaklarını da zikretmiştir. Eserde yer alan terim ve garip kelimelerin manalarını da açıklamıştır. Yazarın kişiliği, ilmi hayatı hakkında bilgi vermiş, kaleme aldığı yazma eserin adı, müellife nisbet edilmesi, kaynakları ve yazarın bu eserde benimsediği metodundan bahsetmiştir. Çalışmasının sonunda elde edilen sonuçlar ise şu şekildedir:  Yazar, yazma eserinde sunmuş olduğu farlı münakaşa ve görüşlerde kendine özgü bir üslup izlemiştir. Diğer mezheplerin konuyla ilgili bütün görüşlerini toplamış, aralarında Hanefi mezhebinin görüşünü ilmi ve objektif bir üslupla tartışmıştır.  Bu eserde, sunmuş olduğu meseleler ve yapmış olduğu münakaşalar vasıtasıyla Şeyh, çok olduğu apaçıktır.  Şeyh, mensup olduğu mezhebin âlimlerinden ve kitaplarından bilgi aktarması, bu mezhepte söz sahibinin olduğu göstergesidir.  Elimizdeki bu yazma eseri, cuma namazı hakkında yazılan en önde gelen eserlerden biridir ve bu, konunun sunumunda açıkça görülmektedir.  Bu eser Cuma namazı konusuyla alakalı bir referanstır. Bilgili bilgisiz herkese ondan yararlanabilmektedir. Pek çok bibliyograf, yazara ait kitapları atfında hata yapmıştır; Ahî Zâde ismini taşıyan birçok yazarın eserleri ile Ahî Zâde (Abdul Halim Efendi)'in eserlerini karıştırmıştır. Öneriler Fıkıh ilmi meselelerini ele alan kitaplara özen gösterilmeli, bu meseleleri açık ve net bir şekilde izah edilmelidir ki bilmek isteyenler kolayca erişebilsin. Fıkıh mezheplerinin eserlerine sahip çıkılmalı, onları kütüphane raflarından kaldırılmalıdır, çünkü amelî hükümlerle ilgilenen fıkıh meseleleri milletin hayatıdır."
