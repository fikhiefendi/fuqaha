abstract: "İnsanın ilk yaratılışından bu yana kadın, erkekle birlikte var olmuş ve insanlık tarihi boyunca da hayatın her alanında hep birlikte ve omuz omuza hareket etmişlerdir. Kadın her daim erkeğin yanında kaim olmuş, onunla birlikte çalışmış, çabalamıştır. Bununla beraber“kadın”olgusu bir polemik unsuru olarak da gündemdeki yerini korumuş, varlığı, yaşam amacı, sosyal hayattaki konumu, dini literatürdeki yeri gibi daha birçok alanda üzerine tartışmalar yapılarak hükümler verilmiştir. Nihayet İslam'ın gelişi ile kadın, hak ettiği konuma ulaşmıştır. Asırlardır aslında her daim çalışan, ancak son yıllarda çalışmasının şekli ücretli çalışmaya evrilen kadının üzerine çok konuşulmuş ve üzerine olumlu olumsuz birçok görüş beyan edilmiştir. Bu konuların başında kadının hakları, sorumlulukları, aile içindeki ve dışındaki konumu, sosyal hayatta var olması, ücretle bir işte çalışması gibi pek çok başlık yer almaktadır. Bu çalışmanın amacı varoluşsal serüveninde kadının, çalışması ile ilgili uzun yıllardır devam edegelen tartışmaları Hz. Peygamber dönemi örnekliği ışığında ele alarak günümüzde çalışma hayatı içinde herhangi bir sebeple olan, olmak isteyen, olmak zorunda kalan kadının durumunu, hususiyetle aile içindeki hakları ve sorumlulukları bağlamına vurgu yaparak temellendirmeye çalışmaktır. Bir kadın bakış açısıyla meselenin ele alınması, çalışan kadına ve onu istihdam edenlere farkındalık oluşturabilecek bir perspektif sunabilir ise, bu çalışma amacına ulaşmış olacaktır. Araştırmada literatür taraması yapılarak konu ile doğrudan ve dolaylı olarak ilgili kaynaklar belirlenmiştir. Konunun temellendirilmesinde hem klasik kaynaklardan, hem de günümüz modern kaynaklarından istifade edilmiştir."
