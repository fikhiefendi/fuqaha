abstract: "Son zamanlarda teknolojik ve tıbbi gelişmeler, insan ömrünün uzatılmasına katkıda bulunmuştur. Ancak, bu gelişmeler etik, sosyal ve dini açılardan çözülmesi gereken sorunları da beraberinde getirmiştir. İslam dini açısından cevaplanmasi gereken sorunlar, İslam hukuku tarafından çözümlenmiştir; özellikle de tıbbi sorunlar, yeni bir alan olan İslami biyoetik tarafından çözülmeye başlanmıştır. İslami biyoetik kavramı, 1980'lerden bu yana kullanılmaya başlanmıştır - o zamana kadar İslam hukukçuları, mevcut İslam hukuku kurallarını ve tıp uzmanlarından elde edilebilen bilgileri kullanarak hukuki-etik kurallar formüle etmişlerdir. Tıp uzmanları, sağlık politikasi yapıcıları, sosyal bilimciler, tarihçiler ve İslam çalışmaları uzmanları, tıbbi etik konularında bilgi vermektedir. Bu bilgiler, İslam Hukuku alimlerinin fetvalarını bilgilendirmek için kullanılmaktadır. Günümüzde insanlar, hayatlarının sona ermesi konusunda bir karar alma hakkına sahip olduklarını düşünmektedir. İnsanlar tıbben canlandırılma şansına sahip olsalar da, bazıları kişisel, sosyal veya dini motivasyonlar nedeniyle bunu reddedebilir. Bazen tedavi faydasız olduğunda, bir doktorun önerisiyle hayatın sona ermesi kararı almak mümkündür. Bu nedenle, hayatın sona ermesi kararları, hem etik hem de İslam açısından çözülmesi gereken sorunları beraberinde getirmektedir. Bu sorunlardan biri,“Yeniden Canlandırma Yapılmaması”veya“Resüsite etmeyin”(Do not Resuscitate DNR) talimatlarıdır. DNR, bir kişinin nefes alması veya kalbi herhangi bir nedenle durduğunda hastaya tedavi yöntemlerinin uygulanmayacağı anlamına gelen bir karardır. Bu karar, ya kişinin sağlıklıyken imzaladığı vasiyetname nedeniyle ya da doktorun çaresiz bir durumda tedavi için herhangi bir müdahalede bulunamaması durumunda alınır. Bu çalışmada, İslami Biyoetik perspektifinden DNR talimatlarının durumu ve uygulanabilirliği araştırılacak ve özellikle Sünni bakış açısından İslam'da DNR talimatlarının caiz olup olmadığını açıklamak için kullanılan fetvalar incelenmiştir. Ayrıca, DNR'nin aslında hastanın tedaviyi reddetmesi olduğu göz önüne alındığında, İslam'da tıbbi tedavi arayışına dair hükümler geniş bir şekilde ele alınmıştır."
