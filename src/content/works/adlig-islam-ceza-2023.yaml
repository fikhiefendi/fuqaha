abstract: "Hata, İslam Hukuk teorisinde yer alan ehliyet arızalarındandır. Hatanın bir ehliyet arızası olarak kabul görmesi, şahısların hukuki eylemlerinde hata yapmaları durumunda mazeretli görülerek cezalarının hafifletilmesine olanak sağlar. Bahsi geçen hukuki terimin önemi, kişilerin yanlışlıkla ya da bilmeksizin yaptıkları hatalı eylemlerden doğan hukuki sorunları ele almasından kaynaklanır. Hata, İslam Hukuk sistemi içinde bir çeşit affedilme veya cezaî müeyyideyi hafifletme vesilesidir. Bu nedenle, hata kavramı İslam Hukuku içinde özel bir öneme sahiptir ve yetkili hukuk mercilerinin adaleti sağlamasında önemli rol oynayan bir mekanizma olarak kabul görür. Hatanın hukuki sonuçlarının incelenmesi, İslam Ceza Hukuku ile günümüz Türk Ceza Hukuku arasındaki benzerlikleri ve farklılıkları anlamak için de önemlidir. Bu şekilde, hukuki eylemlerde hata kavramının ele alınış şekli ve hatanın etkileri daha iyi anlaşılabilir. Amacımız da tam olarak İslam Ceza Hukukunda hata kavramını konu edinmek ve bu sayede İslam Ceza Hukukundaki ve günümüz Türk Ceza Hukukundaki hata sistematiğini karşılaştırarak, İslam Ceza Hukukunda hatanın yeri ve önemini anlamaktır. Çalışmamız, araştırmanın konusuna, amacına, önemine, yöntemine ve literatürüne temas eden bir girişin ardından üç bölüm ve bir sonuçtan oluşmaktadır. İslam Ceza Hukuku ve Hata Kavramının Mahiyeti başlığını taşıyan birinci bölümde; İslam Ceza Hukuku'na yönelik genel bilgilere, hata kavramının analizine, Kur'ân'da ve Sünnet'te hata kavramına, hata ile ilişkili olan kavramlara yer verilmiştir. İkinci bölümde İslam Ceza Hukukunda Suçlara Öngörülen Cezalar ve Hatanın Etkisi başlığının altında; İslam Ceza Hukukunda suçlara karşılık verilen cezalara ve hatanın cezalar üzerindeki etkilerine değinilmiştir. Üçüncü bölümde günümüz Türk Ceza Hukukundaki hata sistematiğine ve hatanın hukukî sonuçlarına yer verilmiştir."
