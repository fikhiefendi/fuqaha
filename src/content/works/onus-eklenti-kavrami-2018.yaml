abstract: "Çalışmamızın konusunu Türk Medenî Kanunu'nda düzenlenen eklenti kavramı ve bir eşyanın eklenti niteliğini kazanmasına bağlanan hukukî sonuçlar oluşturmaktadır. Çalışmamızda ilk planda Türk Medenî Kanunu'nda genel, soyut ve belirsiz bir biçimde tanımlanan eklenti kavramının nasıl anlaşılması gerektiği ve bir eşyanın eklenti niteliğini kazanması için gerekli olan şartların nelerden oluştuğu detaylı bir şekilde araştırılmıştır. Sonrasında ise bir eşyanın eklenti niteliğini kazanması sonucunda ortaya hangi hukukî sonuçların çıkacağı detaylı olarak incelenmiştir. Çalışmamız dört bölümünden oluşmaktadır. İlk bölümde eklenti kavramının düzenlenme amacı, eklenti kavramının tanımı ve eklenti kavramının tanımlandığı kanun hükmünün hukukî niteliği açıklanmıştır. İkinci bölümde eklentinin şartları ve eklenti sayılmayan eşyalar incelenmiştir. Üçüncü bölümde eklenti kavramının diğer benzer kavramlardan farklarına yer verilmiştir. Son bölümde ise bir eşyanın eklenti niteliğini kazanmasına bağlanan hukukî sonuçlar ve eklenti niteliğinin sona ermesi incelenmiştir. Çalışmamızda konumuz ile ilgili Türk Hukuku'nda yer alan tüm kaynaklar tüketilmeye çalışılmıştır. Ayrıca eklenti kavramına ilişkin Almanca kaynaklardan da yararlanılmıştır. Konuya ilişkin Yargıtay ve İsviçre Federal Mahkemesi kararlarına da mümkün olduğu ölçüde yer verilmiştir."
