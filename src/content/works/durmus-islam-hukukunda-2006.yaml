abstract: "Sözlükte; saymak, sayılan seyin miktarı, adet anlamına gelen iddet kelimesi, slâm hukukunda; evliligin herhangi bir nedenle sona ermesi durumunda kadının yeni bir evlilik yapabilmek için beklemek zorunda oldugu süreyi ifade eder. Bütün toplumlarda bulunan iddet (bekleme süresi) uygulaması, slâm hukukunda daha genis olarak ele alınmıstır. Çünkü iddet kavramı, Kur'ân ve hadis kaynaklarında çok ayrıntılı biçimde islenmistir. Bu süre, evlenme yasagı, mesken, nafaka, nesep, miras gibi birçok hak ve yükümlülük için ölçü kabul edilmektedir. Bu nedenle konuyla ilgili kapsamlı bir hukuk literatürü olusmustur. ddet konusu, fıkıh literatüründe evliligin sona ermesinin neticelerinden biri olarak ?iddet? alt baslıgı altında (Bâbu'l-dde) veya müstakil bir bölüm halinde (Kitâbu'lidde) islenmistir."
