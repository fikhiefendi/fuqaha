abstract: "Şafiî mezhebi ve Şafiî fıkıh külliyatındaki konumundan dolayı“el-Envâr lî a'mâli'l-ebrar”kitabı üzerinde birden fazla haşiye yazılmıştır. Muhakkik ve araştırmacılar söz konusu haşiyeleri tahkik etmişlerdir.“Haşiyetü'l-Kümserî bi hâmişi'l-Envâr”ve“Haşiyetü'l-hâc İbrahîm bi-hamişi'l-Envâr”da Envâr üzerinde yazılmış haşiyelerdendir. Şafiî fıkhında yazılan bir eser de -ki bu da son eser olmayacaktır-“Hâşiyetü'l-Molâ Muhammed el-Kerdî 'ala'l-Envâr”dır. Ancak şu ana kadar bu esere hizmet ederek onu tahkik eden olmamıştır. Bingöl Üniversitesi'ndeki öğrenimim aşamasında ve Doç. Dr. İbrahim ÖZDEMİR'in yönlendirmesi sonucunda ilâhî hikmet, bu mahtut esere hizmet etmemi ve ortaya çıkarmamı nasip etti. Bu çalışma projesi temelde iki ana bölüme ayrılmıştır. Birinci bölüm araştırma ikinci bölüm ise tahkik, giriş, sonuç ve kaynakçadan oluşur. Giriş kısmı tez projesi, konuyu seçmenin nedeni, konunun önemi, haşiye ile ilgili çalışmalar ve tahkik esnasında yüz yüze kaldığımız zorlukları kapsar. Birinci bölüm araştırma kısmından oluşur. Bu kısım, Mola Muhammed'in hayatı ve çağı hakkındaki bilgileri ihtiva eden bir girişten ibarettir. Bu kısım iki konudan oluşmaktadır. Birinci kısım yazarın ismi, doğumu, künyesi, şeyhleri, öğrencileri, çağdaşları, ilmi konumu, eserleri ve vefatından söz eder. İkinci kısım ise mezkûr haşiyeyi tanıtır. Haşiyenin unvanı, müellife nispeti, müellifin haşiyede izlediği yöntemi, tahkikte esas alınan nüshaları ve tahkik esnasında yardımcı olan kaynakları kapsar. İkinci bölüm tahkikle ilgilidir. O da tahkik ettiğimiz konuları ihtiva eder. Bunlar da“icâre”,“cu'âle”,“ihyâü'l-mevât”,“vasiyet”,“visâyet”, ve“îda'”kitaplarıdır. Müellif, şerh esnasında Envâr ve diğer fıkhî kitaplarda olduğu gibi eseri konu, kısım ve bölümlere ayırmak suretiyle ilmi ve akademik bir yöntem takip etmemiştir."
