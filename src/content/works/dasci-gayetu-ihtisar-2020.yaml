abstract: "Tezimiz Şâfiî mezhebine ait Gâyetü'l-ihtisâr ile el-Yâkutu'n-Nefîs adlı iki eserin muhteva ve üslup açısından mukayesesini konu edinmektedir. Tespit edebildiğimiz kadarıyla her iki eser arasında; yer verilen konular, konuların sıralanışı, izah tarzı vb. hususlarda birtakım farklılıklar bulunmaktadır. Şöyle ki: Gâyetü'l-ihtisâr'da kısa bir eser olması hasebiyle fıkhî konuların detayına yer verilmediği gibi konuların alt başlıklarına da tafsilî olarak değinilmemiş ve fıkhî hükümler mücmel olarak beyan edilmiştir. el-Yâkutu'n-Nefîs'te ise her konunun başında bahsedilen kavramların sözlük ve terim anlamları verildikten sonra alt başlıklar zikredilmektedir. Her konuya ait rükün, şart ve hükümler hakkında detaylı bilgiler verilmektedir. İbadetler dışındaki hemen her konuyla alakalı rükünler ve her bir rükne ait şartlar ve hükümler birer alt başlık halinde detaylı olarak zikredilmekte ve genelde konular örneklerle birlikte izah edilmektedir. Her iki eserde de birkaç konu dışında hükümlerin dayandığı delillere yer verilmemiş ve zikredilen konular Şâfîî fıkıh eserlerine uygun bir biçimde sıralanmıştır."
