abstract: "Tezde ötanazi, yaşama hakkı bağlamında ele alınmıştır. Ötanazinin tanımı ve kapsamı belirtildikten sonra çeşitleri ile birlikte detaylıca bilgi verilmiştir. Ötanazi hakkındaki tartışmalara yer verilmiştir. Ötanaziyi destekleyen ve reddeden görüşlerden bahsedilmiştir. Ötanazinin İslâm Hukuku açısından sonuçlarına yer verilmiştir. Başlıca ötanazi çeşitlerinin değerlendirilmesi yapılmıştır. Tez giriş ve iki bölümden oluşmaktadır. Giriş kısmında, tezin içeriği ve hazırlanması ile ilgili bilgiler verilirken birinci bölümde kavramsal çerçeve ve tartışmalar, ikinci bölümünde ise yaşama hakkı ve hukuki sonuçlarına yer verilmiştir."
