abstract: "Ebussu'udEfendi,16. Yüzyılın en önemli şeyhülislamnlarındandır. Onun şöhreti tüm islam alemince bilinmektedir. Biz bu çalışmamızda Ebussu'ud Efendi'nin hayatı, eserleri ve o dönemin kültür hayatı hakkında bilgiler vererek onun tasavvuf ve sufiler hakkındaki düşüncelerine yer verdik. Bunu yaparken de onun şeyhülislam olarak sufiler ve tasavvuf hakkında vermiş olduğu fetvaları göz önüne aldık. Ayrıca kendi dönemindeki sufilerle olan ilişkileri de değerlendirdik. SAonuç olarakŞeyhülislam Ebussu'ud Efendi'nin tasavvufun esaslarına karşı bir tavrı olmadığını ancak vermiş olduğu fetvalardan sufilerin uygulamalardaki hatarına karşı çıktığı anlaşıldı. Böylece Ebussu'ud Efendi bir fakih ve şeyhülislam olmasına rağmen tasavvufi yönü ağırlıklı bir kişi olarak ta karşımıza çıkmaktadır. O, tasavvufun şekilden çok ruhu üzerinde durmuş ve peygamberimizin sünnetine uygun olarak yaşama gayretinde olduğu görülmüştür."
