abstract: "Bu tez çalışmasında, (Hicrî: 1232-1233/ Milâdî: 1816-1818) yıllarına ait“22 Numaralı Tokat Şer'iyye Sicil Defteri”nin içerisindeki belgelerin özetleri hazırlanılarak, defterde yer alan belgeler ışığında söz konusu dönemde Tokat'ın idari ve sosyo-ekonomik yapısı üzerinde durulmuştur. Çalışmamız dört bölümden oluşmaktadır. Birinci bölümde Osmanlı yargı sistemi, mahkemeler, mahkemede görevli memurlar, şer'iyye sicillerinin tanımı ve muhtevâsı hakkında açıklamalara yer verilerek, sicillerin günümüzdeki durumu ve sicillerle ilgili çalışmalara değinilmiştir. İkinci bölümde, şer'iyye sicilleri içirisinde bulunan belge türleri hakkında bilgiler verilip, 22 Numaralı Tokat Şer'iyye Sicil Defterinde yer alan kayıtların tasnifi yapılmıştır. Üçüncü bölümde, Defterdeki belgelerden yararlanılarak (Hicrî: 1232-1233/ Milâdî: 1816-1818) yıllarında Tokat'ın sosyal, ekonomik ve idâri yapısı hakkındaelde edilen veriler üzerinde durulmuştur. Dördüncü ve son bölümde ise; 22 Numaralı Tokat Şer'iyye Sicili'nde yer alan belgelerin özetlerine yer verilmiştir."
