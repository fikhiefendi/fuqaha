abstract: "Bu tezde, Rusya'daki resmi İslami kurumların özellikleri incelenecektir. 2. Katerina'dan başlayarak, Rusya Müslüman tebaasına karşı din merkezli bir yaklaşım geliştirmiştir. Bu doğrultuda, Orenburg Mahkeme-i Şeriyesi 1788 yılında ulemanın devlet tarafından istihdamını getirmiş ve benzer kurumlardan Sovyetler Birliği ve Rusya Federasyonu tarafından da istifade edilegelmiştir. Bu tezde, birincil ve ikincil kaynaklar değerlendirilerek 2. Katerina'nın başlangıçtaki politika değişikliğinin yol açtığı bir dizi sonuç tespit edilmiştir. Bu politika değişikliğinin etkileri, Orenburg Mahkeme-i Şeriyesi'nin kuruluşundan günümüze kadar Müslümanların devletle ilişkilerindeki ortak dinamikleri üzerinden görülmüştür. Birinci olarak, devlet tarafından beklendiği ve umulduğu üzere, ulemanın bürokrasiye dahil edilmesi Müslümanların yaşadıkları bölgelerdeki düzene katkıda bulunmuştur. İkinci olarak, devlet daima yönetimin amaçlarına yakın bulduğu alimlere destek verirken, kendi toplumunun çıkarlarını önceleyen alimler ile şiddetle mücadele etmiştir. Üçüncü olarak, devletin baskısı arttıkça Müslümanlar devlet kontrolünün dışında kalan İslami kurumlara daha fazla yönelmişlerdir."
