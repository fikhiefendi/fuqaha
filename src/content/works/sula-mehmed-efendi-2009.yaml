abstract: "M?rz?z?de Mehmed S?lim Efendi ve Sel?metu'l-ins?n f? muh?fazati'l-lis?n adlı eseriXVIII. yüzyıl Osmanlı dönemi seçkin Arap dili âlimi ve şâiri Şeyhulislâm M?rz? Mustafa Efendi'nin oğlu M?rz?z?de Mehmed S?lim Efendi'nin hayatı ve eserleri ile onun Sel?metu'l-ins?n f? muh?fazati'l-lis?n isimli eserinin edisyon kritiğini konu alan bu çalışma, giriş ve üç bölümden oluşmaktadır.Girişte, Sel?metu'l-ins?n f? muh?fazati'l-lis?n fikhu'l-luga türü bir eser olduğu için, XVIII. yüzyılın başlarına kadar fıkhu'l-luğa'nın tarihi gelişimi üzerinde durulmuş ve bu kategoriye dâhil olan eserlerden tespit edilebilenlerin tanıtımı yapılmıştır.Birinci bölümde müellifin hayatı anlatılmış ve tarafımızdan ilk defa tespit edilenler ile birlikte eserleri incelenmiştir.İkinci bölümde Selâmetu'l-insân f? muhâfazati'l-lisân'nın muhteva, tertip, metot ve kaynak yönünden tahili yapılmış ve tespit edilebilen nüshaları hakkında bilgi verilmiştir.Üçüncü bölümde ise tahkiki yapılan ve çalışmamızın ana konusunu teşkil eden Selâmetu'l-insân f? muhâfa?ati'l-lisân'nin metni sunulmuştur."
