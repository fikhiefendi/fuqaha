abstract: "Bu çalışma, Emevi ve Abbasi halifeliklerini kapsayan, Hicri 41'den Hicri 247'ye (661-861) kadar olan İslami arazi vergisi sistemi olan haraç tahsilatını incelemektedir. Araştırma, bu iki hanedanlık dönemindeki haracın idari uygulamalarını, etkinliğini ve sosyo-politik etkilerini karşılaştırarak haraç tahsilat sistemlerindeki farklılıkları ve benzerlikleri vurgulamaktadır. Kapsamlı bir literatür incelemesi ve karşılaştırmalı tarihsel analiz de dahil olmak üzere nitel metodoloji kullanan bu çalışma, hangi halifeliğin haraç tahsilatına daha verimli ve eşitlikçi bir yaklaşım uyguladığını değerlendirmektedir. Bulgular, Emevi yönetiminin Abbasiler dönemine kıyasla daha fazla tekdüzelik, verimlilik ve daha düşük yolsuzluk seviyeleri gösterdiğini ortaya koymaktadır. Ancak her iki halifelik de haraç ödeyenlere karşı eşitsizlik ve sert uygulamalar sergilemiş ve bu da çeşitli kamu hoşnutsuzluklarına yol açmıştır. Abbasiler dönemi, kısmen eşitsiz bölgesel politikalar ve yaygın yolsuzluk nedeniyle vergilendirmeyle ilgili daha önemli siyasi huzursuzluklarla karşı karşıya kalmıştır. Emevi sistemi, daha önceki İslam devletinin daha basit, tekdüze haraç ilkelerine benzese de, hiçbir halifelik gerginliklerden tamamen kaçamamıştır. Bu araştırma, haraç uygulamalarının karşılaştırmalı bir analizini sağlayarak İslam ekonomi tarihindeki kritik bir boşluğu kapatmaktadır. Çağdaş yönetim için pratik öneriler sunmakta, eşit vergi politikaları, titiz denetim ve huzursuzluğu önlemek için kamuoyunun katılımını vurgulamaktadır. Gelecekteki çalışmalar, haracın kırsal ekonomiler ve siyasi istikrar üzerindeki etkisini ve Müslüman çoğunluklu ülkelerdeki modern mali çerçevelerle ilişkisini araştırmak için teşvik edilmektedir"
