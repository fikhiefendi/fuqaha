abstract: "Bu çalışma, İran'ın iç ve dış politikasını dini kıstaslara göre şekillendirdiği gerçeği ile bu gerçeğin etkilerinin izdüşümlerini ortaya çıkarmayı ve elde edilen bulguların İran halkı için ne anlam ifade ettiğini ortaya koymayı amaçlamaktadır. Çalışmanın temel hipotezine göre İran'ın Ortadoğu'da taraf olmaktan uzaklaşması ve içte refah ve özgürlüğü artırıcı önlemleri alması hem İran halkının özgürleşmesine fayda sağlayacak hem de İran devletinin uluslararası sisteme daha fazla uyum sağlamasına sebep olacaktır. Çalışmada içerik analizi ve literatür taraması nitel yöntemleri kullanılmıştır. Bu bağlamda çalışmada rejim taraftarı olan Rehber ve diğer önemli dini liderler ile rejime karşı veya reform isteyen dini-fikri liderlerin rejim ve dış politika ile ilgili dini-fıkhi söylemlerinin analizi yapılmıştır. Ardından bu söylemlerin Suriye Savaşı örneğindeki izdüşümleri incelenmiştir. Bununla birlikte genellikle dini yönetim tarafından şekillendirilen dış politika sonucu ortaya çıkan mevcut durum İran'ın ekonomik ve siyasi ilişkilerindeki kazanım ve tehditleri de etkilediği için çalışmada ayrıca İran'ın ticari, askeri, kültürel alanlardaki ekonomik resmi ortaya konmuştur. Sonuç olarak İran'ın genel olarak dış politikasında batıya yaklaşacak adımları atması, Suriye Savaşı'nda ki politikasını bırakarak Suriye'den askeri kuvvetlerini çekmesi gerektiği tavsiye edilmiştir. Böylelikle İran'ın Suriye politikası özelinde harcadığı imkân ve kabiliyetlerini halkının özgürlük ve refahı için kullanmalıdır. Ancak bu tedbirleri aldığı takdirde İran kendi“kutsal”rejimini koruyabilecektir."
