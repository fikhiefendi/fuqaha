abstract: "İslam Hukuku'na göre, ilk insandan başlayıp günümüze kadar devam eden hatta ahirette de devam edecek olan iki ibadetten birisi evliliktir. Bu sebeple, insan neslinin ve toplum düzeninin korunması için olduğu kadar; zayıf durumda olan kadın ve çocuğun korunması için de aile müessesesinin muhafaza edilmesi gerekir. Ancak, ailenin temelini oluşturan eşler; kimi zaman evlilik birliğinden doğan yükümlülüklerini yerine getirmeyebilir veya evlilik birliğine ilişkin önemli bir konuda uyuşmazlık yaşayabilir ve böyle durumlar eşler arasında geçimsizliğe yol açabilir. Bu halde, eşlerin maslahatı, çocukların korunması ve toplum düzeninin muhafaza edilmesi için evlilik birliğinin korunması gerekir. Şu kadarı var ki, eşlerin geçimsizliğini gidermek için uygulanacak olan evlilik birliğini koruyucu tedbirlerin sonuç vermesi için aile hukukunun diğer hukuk dallarına göre farklılıkları tespit edilmeli ve aile hukukunun niteliklerine uygun bir çözüm yolu düzenlenmelidir. Bundan dolayı aile birliğinin devamlılığını, zayıf durumda olan kadın ve çocuğun korunmasını, ailenin ahlaki esaslarını, eşlerin evlilik birliğinden doğan karşılıklı yükümlülüklerini ve ailenin devlet otoritesinin dışında bulunan ve kişilerin özel hayatları ile alakalı bir alan olduğunu merkeze alınan bir çözüm yolunun uygulanması sonucunda eşlerin geçimsizliğini giderme ve evlilik birliğini koruma ihtimali daha kuvvetlidir. İslam aile hukukunda evlilik birliğini koruma amacı ile düzenlenen tahkim yolu ise; aile hukukunun niteliklerine uygun, Asr-ı Saadet'te ve Osmanlı Devleti'nde uygulanmış ve sonuç vermiş bir uyuşmazlık çözüm yoludur. Bu çalışmada öncelikle, fıkıh kaynaklarında sulh akdine benzetilen bir uyuşmazlık çözüm yolu olan tahkim kurumu sistematik olarak incelenmiş daha sonra tahkim kurumunun aile hukukundaki uygulaması incelenerek beş aşama halinde tasnif edilmiştir."
