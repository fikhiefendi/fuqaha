abstract: "Osmanlı fikir ve pratiğinin uzun süre ayakta kalmasını ve devletin 600 yıl yaşamasını sağlayan temel etken ?Adalet mülkün temelidir? düsturudur. Osmanlı Devleti, klasik döneminden dağılma dönemine kadar adalet kurumuna ayrı bir önem vermiştir. Devletin her yerinde kurulan mahkemeler adaleti tesis ederken, tutulan mahkeme kayıtları araştırmacılara önemli ufuklar açmıştır. Tarihçinin şer'i sicil kayıtlarından edindiği ham bilgiler, ülkenin sosyal ve ekonomik hayatı kadar yerelin tarihi hakkında da bilgi vermektedir. Konya ilimizin Seydişehir ilçesinde de, kadılar tarafından 12 adet defter tutulmuştur. Araştırma konumuz Seydişehir Şer'iyye Sicillerinden 235 no'lu şer'i sicil kayıtlarıdır. 235 numaralı Seydişehir şer'i sicil defterinde 67 adet kaydedilen konu bulunmaktadır. Sicil kayıtları Tanzimat sonrası küçük bir Osmanlı kazası olan Seydişehir insanının 1890-1892 yılları arsında yaşadığı olayları geleceğe taşımaktadır. Seydişehir sicilleri ile ilgili araştırmamızda, kadınların hukuksal mücadeleleri, azınlıklarla olan münasebetler, dönemin ekonomik koşulları, aile kurumu, miras işleri vekillikler hakkında önemli bilgilere ulaşılmıştır."
