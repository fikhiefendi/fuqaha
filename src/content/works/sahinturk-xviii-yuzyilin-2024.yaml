abstract: "Bu yüksek lisans tez çalışmasında 2 numaralı Tokat Şer'iyye Sicilinde yer alan gayrimüslimlerle ilgili hükümlerin transkripsiyonu yapılarak, hükümler çerçevesinde 1795-1797 yılları arasında mahkemeye konu olan gayrimüslim davaları incelenmiştir. Gayrimüslimlerle ilgili hüccet ve tereke kayıtlarının ele alındığı bu çalışmada Tokat gayrimüslimlerinin ekonomik, sosyal ve kültürel yapısı üzerinde durulmuştur. Terekelerde yer alan eşyaların dağılımı üzerinden gayrimüslimlerin ekonomik, sosyal ve kültürel yapıları ortaya konulmaya çalışılmıştır. Gayrimüslim toplumun Osmanlı toplum yapısı içerisindeki durumuna dair Tokat özelinde, 2 Numaralı Tokat Şer'iyye Sicili merkeze alınarak değerlendirilmelerde bulunulmuştur. Tereke kayıtlarından gayrimüslimlerin sosyal ve ekonomik hayatlarına dair çıkarımlar yapılarak, 1795-1797 yılları arasına dair gayrimüslim toplumun Tokat'taki konumu belirlenmeye çalışılmıştır. Belirtilen yıl aralığında Tokat'ta yaşayan gayrimüslim toplumun iş sahaları, icra ettikleri meslekler belirlenmiş ve bu mesleklerin dağılımları gösterilerek Tokat ekonomisindeki gayrimüslim toplumunun hareketliliği saptanmaya çalışılmıştır. Gayrimüslimlerin kullandıkları sahip oldukları eşyalar, hane ve bağlar yine bu tereke kayıtlarından tespit edilerek bu kayıtlar grafikler haline değerlendirilmeye tabi tutulmuştur. Bunun yanında gayrimüslimlerin ticaretle olan bağlantıları da değerlendirmeye tabi tutulmuştur. Tokat'ın Anadolu'nun kadim yol güzergahları üzerinde bulunuyor olması tarih boyunca Tokat'ın ticaret anlamında haraketli bir şehir olmasını da beraberinde getirmiştir. Bu bağlamda Tokat'ta yaşayan gayrimüslimlerin bu ticari hareketliliğin neresinde bulunduğu tespit edilmeye çalışılmıştır. Tokat'ta bulunan hanlar ve bu hanlarla olan gayrimüslimlerin ilişkileri tespit edilmiştir. Gayrimüslimlerin özellikle kumaşçılık, boyacılık, dericilik gibi meslek kolları ile ilişkili olduğu tespit edilerek, bu meslekleri icra eden gayrimüslim toplumla Müslümanların ticari ilişkilerinin boyutları da ifade edilmiştir. Bununla beraber terekelerin değeri üzerinden gayrimüslimlerin ekonomik durumu ve zenginliklerine dair tespitlerde bulunulmuştur. Ayrıca gayrimüslimlerin Müslüman toplumla olan ilişkileri birbirleriyle olan davalar kapsamında ve kurmuş oldukları ticari ilişkiler bağlamında incelenmiştir."
