abstract: "Bu çalışmada, Memlükler döneminde meşhur bir Şâfiî fıkıh usûlü eseri olan Cem'u'l-Cevâmi' etrafında şekillenen şerh ve hâşiye literatürü bağlamında Şâfiî fıkıh usûlü tartışmalarının seyri incelenmektedir. Mevcut araştırmalarda, Cem'u'l-Cevâmi'in Şâfiî usûlünün müteahhir dönemindeki etkisi farklı yönleriyle incelenmiş olmakla birlikte, şerh ve hâşiyeler üzerinden belirli usûl tartışmalarının ele alınış biçimini merkeze alan çalışmaların sınırlı olduğu görülmektedir. Bu çalışmanın amacı, Cem'u'l-Cevâmi'i merkeze alarak fıkıh usûlü tartışmalarının şerh ve hâşiye literatüründe ele alınış biçimini incelemek ve bu tartışmaların Şâfiî usûl düşüncesi içerisindeki konumuna dair bir değerlendirme sunmaktır. Cem'u'l-Cevâmi'in usûl tartışmaları üzerindeki etkisini izlemeye imkan veren şerh ve hâşiyelerle sınırlandırılan araştırmada, metinler arası ilişkiler, itiraz-cevap örüntüleri ve kavramsal sınırlar dikkate alınarak karşılaştırmalı bir değerlendirme yöntemi takip edilmiştir. Ele alınan metinlerde usulcü, fakih ve müctehid kavramları etrafında yürütülen tartışmaların yalnızca basit bir tanım ihtilafı çerçevesinde ele alınmadığı, bunun yanı sıra usûl ilminin mahiyeti, bilgi değeri ve ilmî otoriteyle ilişkili meseleler bağlamında anlam kazandığı görülmüştür. Yine bu çalışma çerçevesinde emir meselesine ilişkin tartışmaların kelâmî kabullerle irtibatlı olduğu ve bu kabullerin usûl tartışmalarının çerçevesini belirlediği tespit edilmiştir. Fıkıh literatüründe özel bir yeri bulunan şerh ve hâşiyelerin kavramsal tartışmaların derinleşmesine katkı sağladığı, usûl meselelerinin ele alınış biçimini açıklayıcı ve yönlendirici bir işlev üstlendiği, hatta kavramsallaşma sürecini tamamlayıcı bir rol oynadığı görülmüştür. Bu yönüyle şerh ve hâşiye literatürünün müteahhir dönem Şâfiî usûlünde kavramsal tartışmaların yürütülme biçimini anlamada önemli bir imkan sunduğu söylenebilir."
