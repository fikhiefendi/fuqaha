abstract: "İslâm hukukunun temeli Kur'ân-ı Kerîm ve Hz. Peygamberin (sav) sünnetidir. Bu iki temel kaynak, hukukî hayatı tanzim etmeye yardımcı ana kaide ve usulleri belirlemekle yetinmiştir. Bu kaynaklarda hükmü bulunmayan meselelerin hükme bağlanması yine bu iki kaynaktan içtihat ile tespit edilmiştir. İçtihat faaliyetleri, çoğunlukla lafzın delaletinin tespiti veya kıyas faaliyeti üzerinden yürütülmüşse de kimi zaman bu yöntemler çıkan yeni meselelere cevap verememiştir. Bu bağlamda İslâm hukukçuları yeni içtihat metotları arayışına girmiştir. Bu arayışların sonucu olarak Hanefî mezhebi, yerleşik kuralın çıkmaza girdiği yahut hakkaniyet ilkesinin işlevselliğini yitirdiği durumlarda;“özel gerekçelerle açık kıyastan, genel ve yerleşik kuraldan ayrılıp olayın ruhuna uygun çözüm bulma metodunu ifade eden şer'î delil”şeklinde tanımlanabilecek istihsân yöntemini keşfetmişlerdir. İstihsân yönteminin ilk kullanıcıları tarafından tanımlanmamış olması; onun İslâm hukuk tarihinde ciddi şekilde tartışılmasına sebep olmuştur. Sonraki dönem Hanefî usûlcüler, istihsânı savunma gayesiyle yoğun çaba sarf etmişlerdir. Bu anlamda Hanefî usûlcülerinden Cessâs'ın çalışmalarının incelenmesi gerektiği bir gerçektir."
