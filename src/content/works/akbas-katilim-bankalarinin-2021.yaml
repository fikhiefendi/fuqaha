abstract: "Türkiye'de, faizsiz bankacılık uygulamalarına“özel finans kurumları”ismi ile 1985 yılında başlanılmıştır. 1999 yılında bankalar Kanunu kapsamına alınan ÖFK 2005 yılına gelindiğinde faaliyetlerine katılım bankacılığı adıyla devam etmiştir. Katılım bankalarının sadece faiz hassasiyetine sahip olan ekonomik aktörlerin ötesinde bir kitleye ulaşması ve mevcut finans piyasasında daha büyük bir yer edinmesi geleneksel bankalar ile yaşayacağı rekabet ile belirlenecektir. Katılım bankalarının geleneksel bankalar ile rekabeti ise sadece kâr odaklı olarak ekonomik alanda değil, sosyal ve çevresel alanda da gerçekleşmektedir. İşletmelerin uzun vadeli ve kalıcı değer yaratmak amacıyla ekonomik, çevresel ve sosyal faktörleri, şirket faaliyetlerine ve karar mekanizmalarına uyarlaması kurumsal sürdürülebilirlik olarak adlandırılmaktadır. Bu tez çalışmasında katılım bankalarının kurumsal sürdürülebilirliklerinin belirleyicisi olan finansal performans göstergeleri incelenmiştir. Bu amaçla Türkiye'de faaliyette bulunan 5 katılım bankasının 2015-2020 yıllarını kapsayan 30 banka/yıl verisi kullanılmıştır. Panel Veri Yöntemi ile yapılan analiz sonucunda, katılım bankalarının kurumsal sürdürülebilirlikleri üzerinde en yüksek etkiye sahip olan finansal performans oranı ters yönlü bir ilişki saptanan Vergi öncesi kârın aktiflere oranıdır. İstatistiki açıdan ters yönlü bir ilişki bulunması nedeniyle oran arttıkça katılım bankalarının kurumsal sürdürülebilirlik uygulamaları azalmaktadır. Ayrıca katılım bankalarının kurumsal sürdürülebilirlikleri ile aktif kaynak kârlılığı arasında istatistiki açıdan anlamlı ve pozitif yönlü bir ilişki bulunmaktadır. Çalışmada kontrol değişkeni olarak yer alan katılım bankalarının büyüklüğü ile kurumsal sürdürülebilirlik arasında da anlamlı ve pozitif bir ilişki belirlenmiştir."
