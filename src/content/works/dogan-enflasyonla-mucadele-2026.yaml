abstract: "Tasarrufa Dayalı Faizsiz Finansman (TDFF) sistemi, bireylerin faizsiz finansman yöntemleriyle konut ve taşıt edinmesine imkân tanıyan, dayanışma esasına dayalı alternatif bir finansman modelidir. Artan faiz oranları, krediye erişim güçlükleri ve gelir dağılımındaki dengesizlikler sonucunda toplumda faizsiz finansman arayışları hız kazanmış, bu durum TDFF sistemine olan ilgiyi belirgin şekilde artırmıştır. Ancak sistemin denetimsiz biçimde genişlemesi, finansal güven ortamını zedelemiş ve devletin 6361 sayılı Finansal Kiralama, Faktoring, Finansman ve Tasarruf Finansman Şirketleri Kanunu ile yasal bir zemin sağlanmıştır. Bu çalışmanın temel amacı, TDFF sisteminin enflasyonla mücadelede bir politika aracı olarak kullanılabilirliğini incelemektir. Araştırmada nitel yöntem benimsenmiş, katılımcı görüşmelerindeki ses kayıtları taranarak elde edilmiştir. Bulgular, sistemin özellikle düşük ve orta gelir gruplarında tasarruf bilincini geliştirdiğini, lüks tüketimi azalttığını ve finansal okuryazarlığı güçlendirdiğini göstermektedir. Ayrıca Venezuela ve Arjantin gibi enflasyonist ekonomiler ile Almanya ve Çin gibi istikrarlı ekonomiler karşılaştırılarak, TDFF'nin makroekonomik istikrar üzerindeki potansiyel etkisi analiz edilmiştir. Sonuç olarak, TDFF sisteminin yalnızca mikro düzeyde tasarruf davranışlarını dönüştürmekle kalmayıp, makro düzeyde fiyat istikrarına da dolaylı katkı sağlayabileceği tespit edilmiştir. Bu nedenle sistem, doğru yasal çerçeve ve denetim mekanizmalarıyla desteklendiğinde, enflasyonla mücadelede tamamlayıcı bir araç olarak kullanılabilir niteliktedir."
