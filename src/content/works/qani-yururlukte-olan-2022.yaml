abstract: "Afganistan'da, hukuki çalışmaların en önemlileri, Şah Emanullah Han (1919-1929) saltanatı sırasında yapılmıştır. Söz konusu dönemde, birçok alanda reform ve yenilikler ile birlikte 70'e yakın nizamname çıkartılmıştır. Akabinde, zikredilen hukuki çalışmalar bazı duraklamalara uğramıştır. Daha sonra kanunlaştırma süreci hızlandırılmış ve yaklaşık elli yıldır yürürlükte olan Afganistan Medeni Kanunu hazırlanmıştır. Bahsi geçen medeni kanunun taslağı Zahir Şah (1933-1973) döneminde hazırlanmış ve cumhuriyet döneminin başında yürürlüğe girmiştir. Bu medeni kanun ortaya çıkmadan önce hukuki sahada diğer fetva eserlerinin yanında Mecelle-i Ahkâm-ı Adliye'nin kullanıldığı bilinmektedir. Üstelik 1957 ve 1958 tarihli usulnamelere göre kadılar birçok konuda sadece Mecelle ile amel etmekle yükümlü kılınmıştır. Bu kanunu hazırlayanlar tarafından kaynaklar arasında en çok Mecelle'ye ve Yeni Mısır Medeni Kanunu'na ağırlık verilmiştir. Mecelle, Osmanlı Devleti'nin resmi kanunlarından biridir. 1918'den sonra Osmanlı Devleti'nden ayrılan devletlerde, kabul edilen yeni kanunlarla birlikte Mecelle hükümleri de cari olmuştur. Bu ülkelerde Mecelle, modern laik mahkemelerce de medeni kanun olarak tatbik edilmiştir. Fakat Lübnan'da 1932, Suriye'de 1949 ve Irak'ta 1953 yılında yeni medeni kanunlar Mecelle'nin yerine geçmiştir. Afganistan, Osmanlı'dan ayrılan bir devlet olmamasına rağmen 1971'den itibaren modern medeni kanunun ortaya çıkmasına dek Mecelle yürüklükte kalmıştır. Dünyanın her tarafında kanunlaştırma çabaları devam ederken 1962 yılında Afgan ve Mısır hukukçuları, Türkiye ve Mısır gibi bazı ülkeleri örnek alarak Afgan Medeni Kanununu oluşturmaya başlamışlardır. Bu çalışmada, öncelikle Afganistan Medeni Kanunu'nun büyû' bölümü Farsça'dan Türkçeye tercüme edilmiştir. Bu esnada konu taraması yapılarak dizin oluşturulmuştur. Ardından Afganistan Medeni Kanunu'nun ana kaynakları tesbit edilmeye çalışılmıştır. Bu kanunun taslağı ile ilgili Afgan hukukçulara ve Afganistan'daki kütüphanelere ve ilgili kurumlara başvuru yapılmıştır. Nihayet büyû' bölümünde yer alan tüm maddelerin kaynağı birer birer tahlil edilmiştir."
