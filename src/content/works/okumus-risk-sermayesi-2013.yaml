abstract: "Faizin olmadığı bir sistemde girişimcinin finanse edilmesi konusu ilgi çekicidir. Günümüzde üzerinde durulan bir konu, KOBİ?lere risk sermayesi sağlanmasıdır. Mudaraba ve muşaraka küçük ölçekli işletmeleri ve uzun vadeli projeleri finanse etmek amacıyla tasarlanmış uzun vadeli finansal araçlardır. Özellikle Risk Sermayesi finansmanının mudarabanın modern bir örneği olduğunu söylebiliriz. Risk sermayesinin, Katılım bankacılığının finansman modeli olan Mudaraba ile önemli benzerlikleri bulunduğu ve bu model bir yandan küçük sermayelerin bir araya getirilerek büyük teşebbüslerin kurulmasını, desteklenmesini sağlayacak ve diğer yandan sosyo ekonomik ahengi temin edecek temel bir mekanizma olarak karşımıza çıkmaktadır. Mudaraba finansmanının işlerliği sayesinde; Katılım bankacılığı teoride esas çalışma alanlarını oluşturan yatırım bankacılığı fonksiyonunu yerine getirmiş olacaktır. Diğer yandan, faizsiz finansal kurumlarla risk sermayesi şirketlerinin aynı ilkeler doğrultusunda faaliyet gösterdiği ve faizsiz finansal kurumların mudaraba yöntemini uyguladıkları ölçüde risk sermayesi şirketlerine benzemekte olduğu görülmektedir.Son yıllarda ülkemizde mali piyasalardaki gelişmelerin sonucu olarak dünya ekonomilerinde yoğun bir şekilde uygulanmakta olan risk sermayesi sistemi, yatırımlar için faizsiz ve uzun vadeli fon sağlayabilme kolaylığı nedeniyle yeni bir finansman yöntemi olarak ülkemiz gündemindedir. Ülkemizde kurulmuş olan Katılım Bankaları Felsefeleri gereği risk sermayesi yatırımlarına yönlendirilebilecek kuruluşlardır. Bu bankaların mudaraba ve muşaraka ortaklıkları çerçevesinde risk sermayesi fonları oluşturmalarını özendirici düzenlemeler yapılabilir."
