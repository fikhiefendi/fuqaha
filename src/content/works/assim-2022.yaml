abstract: "Bu araştırmada Şemseddin Muhammed Ebu Hâmid El-mısrî'nin (ö. hicri 896'dan sonra) tefsiri ele alınmakta, tefsirde bulunan El-kehf ve Meryem surelerinin inceleme ve tahkiki yapılmaktadır. Araştırma sayesinde İslam kütüphanesi yeni bir yazma eserle zenginleştirilmiş olacaktır. Tahkik çalışması metinlere belli bir teorik perspektif ile yaklaşılarak yapılacaktır. Nüshalar birbirleriyle karşılaştırılacak, yorumlanacak ve sağlaması yapılacaktır. Ayrıca tefsirin müellifi ve yaşadığı çağın şafi`î önderi olan Şemseddin El-mısrî El-makdisî Eş-şâfi`î tanıtılacaktır. Yine müellifin tefsir metodu ve çalışmasındaki üslubu hakkında malumat verilecektir. Araştırmanın problemi müellifin El-kehf ve Meryem surelerinde dile getirdiği bazı farklı tefsir, fıkıh ve hadis görüşlerinin uzlaştırılması konusudur. Bu görüşlerin çoğunu teyit etmek ve onlar üzerindeki kapalılık ve belirsizliği gidermek için görüşün alındığı kaynaklara müracaat etmek gerekmiştir. Bu özellikle ashâb-ı kehf ve Hz. Meryem kıssaları hakkında çokça kullanılan isrâiliyat haberlerinde vardır. Yazmalar, kaybolmuş veya yazma halinde bekleyen kitaplarda yer alan ve bilinmeyen bilgi kaynaklarını bize ulaştırması bakımından önemli bir ihtiyacı karşılamaktadırlar. Ayrıca yazmalar delil/edille kitaplarından adını duyduğumuz, artık var olmayan değerli ve nadir kaynaklardaki bilgilere ulaşmamızı sağlarlar. Yine bu eserler yeni anlamlar ifade eden çeşitli tefsir görüşlerini ve açıklayıcı sözleri de bize sunarlar. Ayet-i kerimelerin önceki tefsirlerinde yer alan bazı tartışmalı konuları çözerler. Araştırmada metin tahkik çalışması yapılmıştır. Eserin tahkik yapılmaya uygun özelliklere sahip bir nüshası diğer nüshalarıyla karşılaştırılmış ve tahkik faaliyetinin bilinen kurallarına uygun şekilde çalışılmıştır. Eserin müellifinin tefsir metodu ve üslûbu açıklanırken; onun garîb kelimeleri tefsiri, bu kelimelerin kökenleri hakkında söyledikleri, ayetin mücmel anlamını açıklaması, müfessirlerin ayetin anlamı etrafındaki tartışmaları, bu tartışmalardaki filoloji, gramer ve belagata dair unsurları hakkında malumat verilmiştir."
