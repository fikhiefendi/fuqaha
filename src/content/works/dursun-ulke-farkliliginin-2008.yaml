abstract: "İslam hukukuna göre dünya temelde, dâru'l-İslam ve dâru'l-harb olarak ikiye ayrılır. Bu ikisinin de kendi içinde bölümleri vardır. İki dârın aralarında da hükümlerin uygulanmasında çeşitli farklılıklar bulunmaktadır.Bütün âlimler, İslam ceza hukukunun dâru'l-harpte uygulanamayacağı kanaatindedir. Hanefi âlimler ise daru'l-harbde işlenen suçlara dâru'l-İslam'da da ceza verilemeyeceği görüşündedirler. Şâfiî, Malikî, Hanbelî âlimler ise daru'l-harbde işlenen bir suçun daru'l-İslam'da ispatı halinde ceza uygulanması gerektiği kanaatindedirler. Bunun haricinde Ebu Hanife ve Muhammed eş-Şeybani, daru'l-İslam'da yapılması kabul edilmeyen bazı alımsatım akitleri ile faizli akitlerin ve kumar oynamanın, harbîlerle olmak şartıyla, caiz olduğu fetvasını vermişlerdir. Diğer mezhep imamları ve Ebu Yusuf ise müslümanların İslam hukuku ile her yerde yükümlü olduğunu ifade ederek bu hususların dâru'l-harbde de haram olduğunu söylemişlerdir."
