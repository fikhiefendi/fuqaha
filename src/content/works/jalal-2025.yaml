abstract: "İnsanlık hayatı, para ve paranın kullanımıyla doğrudan ilişkilidir ve bu ilişki, hayatın tüm alanlarını etkilemektedir. Bu çalışma, bazı bankacılık hizmetleri ve finansal işlemleri ele alarak bunların fıkhî (İslami hukuki) nitelendirmesini ortaya koymayı, fakihlerin ve fıkıh meclislerinin bu konudaki görüşlerini değerlendirmeyi ve toplumda bu işlemlerle ilgili oluşan belirsizlikleri açıklığa kavuşturmayı amaçlamaktadır. Araştırma, özellikle Erbil'de faaliyet gösteren Cihan İslami Yatırım ve Finans Bankası özelinde yürütülmüş; bankanın işleyişi, sunduğu hizmet türleri ve bu hizmetlerin şer'î açıdan uygunluğu incelenmiştir. Günümüzde bankalarda, hatta zaman zaman İslami bankalarda dahi, farklı isim ve uygulamalar altında faizli işlemlerin yürütülmesi toplumda ciddi bir endişe kaynağı oluşturmaktadır. Kredi kullanımı, borçlanma, mevduat işlemleri ve benzeri bankacılık faaliyetlerinde faiz veya başka haram unsurların bulunup bulunmadığına dair şüpheler, özellikle vatandaşlar nezdinde güven sorununa yol açmaktadır. Bu bağlamda, konut yapımı için verilen devlet destekli krediler gibi uygulamalar hakkında farklı fetvaların bulunması, konunun ilmî bir yaklaşımla ele alınmasını gerekli kılmıştır. Bu çalışmanın önemi, İslami bankalardaki bankacılık hizmetlerinin unsurlarını Cihan İslami Yatırım ve Finans Bankası örneği üzerinden ortaya koyması, bankacılık hizmetlerinin temel özelliklerini açıklaması ve İslami finans sistemine bağlılığın gerekliliğini vurgulamasıdır. Araştırma, bankanın sunduğu murabaha işlemleri, kart hizmetleri, teminat mektupları ve benzeri uygulamaların, sözleşme yapıları ve uygulama mekanizmaları bakımından İslam şeriatının ilke ve kurallarına uygun olduğu varsayımına dayanmaktadır. Bu çerçevede, İslami bankacılık uygulamalarına ilişkin çeşitli şer'î fetvalar değerlendirilmiştir. Bu alanda daha önce yapılmış çalışmalar bulunmakla birlikte, Cihan İslami Yatırım ve Finans Bankası'nda yürütülen hizmetleri doğrudan ele alan müstakil bir çalışmanın bulunmaması, bu araştırmayı özgün kılmaktadır. Çalışma sonucunda, söz konusu bankanın kuruluşundan itibaren İslami finans ilkeleri doğrultusunda faaliyet gösterdiği tespit edilmiştir. Bununla birlikte, İslami bankalardaki bankacılık hizmetlerinin henüz müşterilerin beklediği seviyeye tam olarak ulaşamadığı, bu durumun bazı belirsizliklere yol açtığı ve toplumda temkinli bir yaklaşımın oluşmasına neden olduğu görülmüştür. Bu bağlamda, İslami bankacılık uygulamalarına duyulan güvenin artırılması amacıyla çeşitli öneriler geliştirilmiştir. Öncelikle, bankacılık hizmetlerinde şeffaflık ve açıklığın artırılması, toplumun özellikle yoksul ve orta gelirli kesimlerine daha fazla hitap edilmesi gerektiği vurgulanmaktadır. Ayrıca bankaların, yayınlar ve medya araçları yoluyla sundukları hizmetleri kamuoyuna daha etkin biçimde tanıtmaları önem arz etmektedir. Mevcut ekonomik şartlar dikkate alındığında, yoksul kesimlerin desteklenmesi amacıyla bankaların kârlarının bir kısmından fedakârlık yapmalarının sosyal sorumluluk açısından gerekli olduğu değerlendirilmektedir. Bunun yanı sıra, faizli işlemlerden kesinlikle kaçınılması, bu yollarla kazanç sağlama arayışına girilmemesi ve tüm şer'î ilke, esas ve kurallara titizlikle riayet edilmesi gerektiği vurgulanmaktadır. Araştırmada ayrıca, İslami bankalar başta olmak üzere diğer finans kuruluşlarıyla iş birliği ve koordinasyonun artırılması, helal ve haram konularında ilmî çalışmaların yapılması için âlimler ve uzmanlarla ortak çalışmalar yürütülmesi önerilmektedir. İlim talebeleri ve gençlere yönelik kurs ve seminerlerin düzenlenmesi, alanında uzman kişiler tarafından verilen eğitimlerle özellikle ekonomik konularda İslami bilinç ve kültürün yaygınlaştırılması önemli görülmektedir. Bankacılık hizmetlerinin nicelik ve nitelik bakımından geliştirilmesi, küresel mali ve ekonomik gelişmelerin gerisinde kalınmaması ve çalışmada sunulan fıkhî ve mali analizler doğrultusunda ürün ve hizmetlerin sürekli iyileştirilmesi gerekmektedir. Son olarak, Irak Merkez Bankası'ndan denetleyici talimatların şer'î ilkelere uygun şekilde düzenlenmesinin desteklenmesi, şer'î denetim kurumlarından ise gözetim ve iç denetim sistemlerini geliştirmeleri beklenmektedir"
