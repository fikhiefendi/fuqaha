abstract: "İslam hukuku ve Irak hukukunda boşanmanın eşlere yansıyan etkileri konusu, Irak medeni hukukunun oluşturulmasına ve fıkhi görüşlerde ihtilaflı konuların anlaşılmasına katkı sağlayan temel araştırmalardan biri olarak kabul edilmektedir. Araştırma, evlilik akdinin sona ermesinden sonra boşanmanın eşler üzerindeki mali ve mali olmayan etkilerini ele almaktadır. Araştırmacı, konunun ilmi boyutunun çıkarımını yaparak ve Irak medeni hukukunun bu konuyla ilgili maddelerine atıfla çıkarımda bulunarak tümevarımsal yaklaşımı izlemiştir. Aryıca konuyla ilgili problemleri inceleyerek, analiz ederek ve tartışarak analitik yaklaşımı, fakihlerin çalışmanın konusuyla ilgili söyledikleri arasında bir karşılaştırma yoluyla da karşılaştırmalı yaklaşımı kullanmıştır. Çalışma, Irak medeni hukukunun benimsediği hükümleri ve İslam hukuku ile medeni hukukun içtihatları arasındaki ihtilaf ve ittifak noktalarını vurgulamıştır. Araştırmacının vardığı sonuçlardan bazıları şunlardır: Irak hukuku, birkaç hüküm dışında medeni hukuk konularında İslam hukukuna muhalef etmemiş bilakis onda genel olarak İslam hukuku havası hakim olmuştur. Fakat şu kadar var ki Irak medeni hukuku tek bir mezhep benimsememiş aksine mezhepler arasında gidip gelmiş ve bazı görüşleri bazılarına tercih etmiştir. Buna rağmen mezheplerin itimad edilen görüşlerinin dışına da çıkmamıştır. Yasama sistemi her zaman kamu yararını gözeterek hareket etmeyi amaç edinmiştir. İlgili hukuk sisteminin İslam hukukuna muhalefet ettiği az sayıda konulardan biri ise; kocası tarafından onay verilmesi halinde boşanmanın kadın tarafından da olabileceğine imkan sağlaması ve boşanan kadının başka bir adamla evlenmesi halinde bile hidânenin (hadâne) devam ettiğine hükmetmesidir."
