abstract: "Bu çalışmada, toplumun temel kurumlarından olan dinin, modern dünyada, sekülerleşme olgusuna karşın kendini modern çağın beraberinde getirdiği araçlarla yeniden nasıl var ettiği anlaşılmaya çalışılmıştır. Bu çalışmanın ana temasını, yaşadığımız çağda sekülerleşme süreciyle beraber dinin gündelik hayattan çekileceği iddialarına rağmen, kendini yeniden üretebildiği düşüncesi oluşturmaktadır. İslam dini, içinde barındırdığı evrensellik iddiası ve kolaylaştırma ilkesiyle beraber değişimlere adapte olabilmektedir. Bu özelliğinden dolayı, düşünümsel bir modernlik karşısında düşünümsel ve kendini yeniden üretebilen bir din görmekteyiz. Bununla birlikte, küreselleşme, kentleşme, sekülerleşme süreçleriyle ve teknolojik gelişmelerle birlikte internet kullanımının yaygınlaşması ibadetlerde birtakım değişimler meydana getirmiştir. Dinsel bireyciliğin yaygınlaşması, dinin büyü bozumuna uğraması, ibadetlerin toplumsal işlevlerinde değişme veya zayıflamanın görülmesi ve dinin araçsallaşması görülen değişimlerden bazılarıdır. Bu çalışmada, dini pratiklerden olan kurban, zekât, fitre ve bağış gibi mali ibadetler ele alınmıştır. Bu ibadetlerin, çeşitli kurumlar veya online ödeme yöntemleriyle gerçekleştirilmesi, dini pratiklerin yeniden üretimi bağlamında anlaşılmaya çalışılmıştır. Çalışmanın alan araştırması kısmında ise kır-kent ve cinsiyet farkı gözetilmek kaydıyla 20 kişiyle nitel araştırma yöntemlerinden olan derinlemesine görüşmeler gerçekleştirilmiştir. Bu bağlamda elde edilen veriler, mali ibadetlerdeki değişimler ve mali ibadetlerin yeniden üretimi açısından çalışmada öne sürülen teorik bilgiler ışığında analiz edilmiştir."
