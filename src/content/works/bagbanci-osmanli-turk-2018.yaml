abstract: "Bu tezin amacı, İslam hukukunda evlenme engelleri arasında yer alan süt akrabalığının Osmanlı ve Türk hukukunda yer alıp almadığını incelemektir. Bu konuya ilişkin Osmanlı hukuku incelemesinde fetvalar, şer'iyye sicilleri ve 1917 tarihli Hukuk-i Aile Kararnamesi'nden yararlanılmıştır. Bu konuya ilişkin Türk hukuku incelemesinde ise tasarı halinde kalan ve kabul edilen Medeni Kanunlardan yararlanılmıştır. Osmanlı hukukunda, süt akrabalığı konusunda İslam hukuku hükümleri geçerliliğini devam ettirmiştir. Buna bağlı olarak Osmanlı hukukunda da süt akrabalığı evlenme engelidir. Türk hukukunda ise 743 sayılı Türk Medeni Kanunu'na kadar yapılmış olan Medeni Kanun Tasarılarında süt akrabalığı evlenme engeli kabul edilmiştir. Ancak 743 sayılı Türk Medeni Kanunu'nun Resmi Gazete'de yer alan metninde m. 92 ve m. 112'de süt akrabalığı evlenme engeli kabul edilmiş; fakat aynı yıl kabul edilen 818 sayılı Borçlar Kanunu'na eklenen“Hata-Sevap”cetveli ile bu maddelerdeki süt akrabalığı ile ilgili hükümler kaldırılmıştır."
