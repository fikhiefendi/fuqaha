abstract: "Bu çalışma, Kur'an-ı Kerimdeki ahkâm âyetlerinin belirlenmesi ve bunların hukuk dalları içerisinde değerlendirilmesinden oluşmaktadır. Özelikle kamu ve özel hukuk dallarının içerisindeki başlıklar dikkate alınarak incelenmiştir. Günümüz tüketim çağında herşeyin olduğu gibi bilginin de çok çabuk tüketildiğini bilmekteyiz. Bu sebepten geniş ve detaylı bilgiler yerine daha özet ve hızlı bilgiler ön plana çıkmaktadır. Fakat bu çalışmada asıl gayemiz nüzûl sebeplerinden çok, hüküm bildiren âyetlerin incelenmesidir. Bu aşamada kamu ve özel hukukuna ait âyetler konu başlıklarına uygun olarak düzenlenmiştir. Kaynak olarak Ahkâm'ul Kur'an eserlerine başvurulmuştur. Hukuk konularını belirlemede ise klasik fıkıh kitaplarından faydalanılmıştır. Bina aleyh toplu halde bulunan âyet ve sebeb-i nüzûlleri başlıklarla sistematik hale getirilmiştir. Çalışmamız iki ana kısımdan oluşmaktadır. İlk kısımda kamu hukuku incelenmiştir. Bu bölümün içerisinde anayasa, mali ve ceza hukukunda ayetler belirlenip aktarılmıştır. İkinci bölümde ise özel hukuk başlığı altında, aile, miras, eşya ve borçlaar hukukundaki ayetler belirlenmiştir."
