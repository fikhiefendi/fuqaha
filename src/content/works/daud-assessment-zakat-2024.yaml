abstract: "Bu makalenin ana hedefi, Bangsamoro topluluğu içindeki Zekat farkındalık düzeylerini değerlendirmektir, özellikle de Müslüman Mindanao'daki Bangsamoro Özerk Bölgesi (BARMM) vurgulanmaktadır. İslam'da temel bir görev olan Zekat, belirlenmiş hayır kurumlarına tahsis edilen bir servet yüzdesini içerir, Kutsal Kur'an'da belirtildiği gibi. Önemi rağmen, az gelişmiş ekonomilerdeki anlayış düzeyi belirsizdir. Bu araştırma, Bangsamoro nüfusu arasındaki Zekat farkındalığını ölçmeyi ve BARMM bölgesindeki erkeklerle kadınlar arasındaki farklılıkları araştırmayı amaçlamaktadır. Çalışma, Zekat farkındalığı üzerine üç temel kategoriyi odak noktası olarak belirlemektedir: Zekat'ı bir İslam kurumu olarak anlama, çeşitli formlarını tanıma ve Zekat'ın farklı yararlanıcılarıyla tanışma. Araştırma, bir amaçlı örnekleme tekniği kullanarak bir anket soru formunu dağıtmak için genişletilen bir kar topu etkisi yoluyla 224 bireyden alınan yanıtlarla sonuçlanan bir anket soru formunu dağıttı. Bulgular, bölgedeki Zekat farkındalık düzeylerinde dikkate değer bir artışı göstermektedir, hatta yaygın yoksulluk ve sınırlı eğitim erişimi karşısında. Araştırma, yeni kurulan bölgesel hükümetin bu yaygın farkındalığı güçlü bir Zekat yönetimi çerçevesi oluşturarak, toplama süreçlerini düzenleyerek ve adil bir şekilde dağıtımı sağlayarak kullanma fırsatını vurgular. Bu çabalar, bireysel katkılardan öteye geçen toplumsal faydalar sağlama potansiyeline sahiptir. Çalışma, mevcut farkındalığı kullanma potansiyelini vurgular ve Bangsamoro topluluğu içinde toplumsal refahı önemli ölçüde etkileyebilecek etkili Zekat sistemlerini kurma olasılığını belirtir."
