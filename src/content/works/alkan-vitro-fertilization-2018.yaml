abstract: "Bu çalışma,“İn-vitro Fertilizasyon ve Embriyo Transferi (IVF-ET) İslam İnancı ve Biyoetik Açısından”başlığını taşımakta olup bir giriş, üç bölüm ve bir sonuç kısmından oluşmaktadır. İnsan varoluşunun yardımcı üreme teknolojileriyle ilişkisini ele almakta ve bu uygulamaların İslamî bakış açısından ortaya çıkardığı etik ve teolojik soruları incelemektedir. Birinci bölüm, kısırlık nedenlerini, yardımcı üreme teknolojilerinin gelişimini ve sınıflandırmasını, ayrıca bu uygulamaların İslam hukukundaki ahlaki boyutlarını değerlendirmektedir. İkinci bölümde, tüp bebekler ve dondurulmuş embriyoların İslam hukukundaki hukuki ve biyoetik statüsü ele alınmakta; ayrıca ebeveynlik, nesep ve çocukların İslam düşüncesindeki manevi değeri analiz edilmektedir. Üçüncü bölüm ise Sünni ve Şii alimler tarafından verilen teolojik yorumlara ve fetvalara odaklanmakta, bu fetvaları ve gerekçelerini karşılaştırmalı olarak incelemektedir. Metodolojik olarak çalışma, metin incelemesine ve karşılaştırmalı analize dayalı nitel bir yaklaşım benimsemektedir. İslam hukukunun birincil ve yetkin kaynakları, klasik ve modern fetvalar ile Arapça ve İngilizce akademik literatür eleştirel bir şekilde incelenmiş; İslam hukukunun modern biyomedikal gelişmelere nasıl yaklaştığı ve nasıl yanıt verdiği değerlendirilmiştir. Çalışma, IVF-ET'ye yönelik çeşitli İslamî etik ve hukuki yaklaşımları özetleyerek, İslam fıkhının çağdaş biyoetik meselelerle nasıl etkileşim kurabileceğini ve bu meseleleri temel ilkeler doğrultusunda nasıl ele alabileceğini vurgulamaktadır."
