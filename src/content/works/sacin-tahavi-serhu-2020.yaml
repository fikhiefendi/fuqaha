abstract: "Önceleri Şafiî mezhebine mensupken sonraları Hanefî mezhebine tabi olan Tahâvî, kendisini nispet ettiği Hanefi mezhebinin imamlarından farklı ictihadlarda bulunan özgün bir âlimdir. Bir giriş ve iki bölümden oluşan bu çalışmanın birinci bölümünde Tahâvî'nin hayatı, ilmî kişiliği, mezhep içindeki konumu ve yaşadığı dönemin siyasî ve ilmî durumu ele alınmıştır. İkinci bölümde ise Tahâvî'nin, hakkında ihtilaf olan çeşitli konuları delilleriyle tartışıp sonunda kendisinin daha isabetli gördüğü görüşlerini ortaya koyduğu Şerhu meâni'l-âsâr adlı eseri tetkik edilerek Tahâvî'nin Hanefî mezhebinin imamları olan Ebû Hanife, Ebû Yusuf ve İmam Muhammed'in üçüne birden muhalefet edip aynı konuda farklı bir görüş belirttiği fıkhî görüşleri ele alınmıştır. Böylece Tahâvî'nin meselelerde hangi delillere dayanarak ve hangi bakış açısıyla Hanefî imamlardan ayrıldığı ortaya konulmuştur. Ayrıca Tahâvî'nin söz konusu eserde Hanefî imamlara atfettiği görüşlerin onlara aidiyetinin tespiti için Hanefî mezhebinin muteber kaynaklarından o mesele hakkında imamların görüşleri tespit edilmeye çalışılmıştır."
