abstract: "Hemen hemen her toplumda, suç ve ceza türleri farklı olsa da insanları korumak adına suçluların cezalandırıldığı görülmektedir. Bu cezaların insanların kişiliklerini zedelemeden, onurunu kırmadan vuku bulması esastır. İnsanı insan yapan değerleri korumak için kaynağını; ilahi bir kudretten ve hüküm koyucu, açıklayıcı, teyit edici yönleriyle sünnetten alan İslam ceza hukuku, insanları her açıdan koruyan hükümleri barındırmaktadır. Araştırmanın birinci bölümünde öncelikle insan onuru terimi ve insan onuru anlamına gelen“hak, şeref haysiyet, ırz, izzet, tekrim, takvim, halife”kavramları açıklanmıştır. Akabinde insan onuru kavramının tarihi arka planı çerçevesinde genel olarak İslam ile diğer medeniyetlerin cezalarında insan onurunun ne kadar gözetildiği veya gözetilmediği üzerinde durulmuş ve kıyaslama yapılmıştır. İkinci bölümde ise İslam ceza hukukunda suç ve ceza tanımları yapılmış, suç ve ceza ilkelerinden hareketle insan onuru kavramı başta Kur'an ve Sünnet olmak üzere diğer deliller ışığında ele alınmıştır. Daha sonra cezaların amaçları bağlamında insan onuruna değinilmiştir. Son olarak cezaların çeşitleri başlığı altında ayrıntılı bir şekilde İslam Ceza hukukunda her bir ceza ve bu cezanın insan onuru üzerindeki etkisine yer verilmiştir. Bu araştırma neticesinde İslam Ceza Hukukunda cezalandırma yönteminin hem mağdur hem de suçlu tarafından iki yönlü olarak insan onurunu koruma amacına matuf olduğu tespit edilmiştir. Ayrıca araştırma sadece ceza alanının bir kısmını kapsadığından; bu konu çerçevesinde daha kapsamlı yeni araştırmaların yapılması da gerekli görülmüştür. Anahtar Kelimeler; Suç, Ceza, İnsan, İnsan Onuru"
