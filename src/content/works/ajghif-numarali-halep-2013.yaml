abstract: "Üzerinde çalışma yaptığımız 6 Numaralı Halep Şer?iye Sicili Şam?da Merkez-i Vesâik-i Tarihiyye?de bulunmaktadır ve 995-999/1587-1591 tarihleri arasına aittir. Toplam 362 sayfa ve 1512 adet belgeden oluşan 6 numaralı sicilin ilk 100 sayfasındaki 476 adet belge üzerinde çalışılmıştır. 7 adedi Osmanlıca diğerleri Arapça olan belgelerin transkripsiyon ve tercümesi yapıldıktan sonra belgelerde yer alan bilgiler ana hatları ile değerlendirilmiştir. Şer?iye Sicilleri özellikle yerel tarih ve toplumsal ilişkiler açısından tarihimizin en önemli kaynaklarından birisidir. Bu çerçevede incelemiş olduğumuz Şer?iye Sicilinde Halep halkının gündelik yaşamı, vakıflar, borç alacak ilişkileri, evlenme boşanma işlemleri, mehir, nafaka, köle satışı, köle azadı, çeşitli ticari işlemler, gayrimenkul satışları ve kiraları, vekalet işlemleri ve sair konularla ilgili çok sayıda belge yer almaktadır. Halep?teki 16?sı zürri, 22?si hayri vakıfla ilgili işlemlere ait bilgiler incelemiş olduğumuz kayıtlarda yer almaktadır. İslam hukukçuları arasında en tartışmalı konulardan olan vakıfların gayrimenkullerinin tebdili konusunda Halep?te zarurete binaen değişiklik yapılabildiği görülmektedir. 1-6 osmani arasında ücret alan mütevelliler gerektiğinde değiştirilmektedir. Halep?te evler 5-40 dinar arasında kiraya verilirken en düşük fiyatla satılan ev 17 dinar, en yüksek fiyatla satılan ev 815 dinara alıcı bulmuştur. Köle ve cariyeler 40-130 dinar aralığında satılırken pek çok köle ve cariye sevap kazanmak arzusu ve mükatebe yoluyla azat edilmişlerdir. Halep?te mehir ve nafaka konusuna çok önem verilmektedir. Ölen kadının mirasçıları, kocasının ödemediği mehiri dahi kocasından talep etmektedirler. Mehir miktarları 15 dinar ile 125 dinar arasında değişmektedir. Peşin ödenen mehr-i muaccel ile genellikle sonradan ödenen mehr-i müeccelin ortalamasının 54 dinar olduğu hesaplanmıştır."
