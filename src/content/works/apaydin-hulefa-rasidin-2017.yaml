abstract: "Hulefâ-i Râşidîn dönemi İslam toplumunun ekonomik anlamda oldukça güçlendiği bir dönemdir. Bu ekonomik güçlenmenin temelinde ise dönemin fetih hareketleri belirleyici bir etkiye sahiptir. Bu ekonomik güçlenmenin; ülkenin kalkınması, imar ve iskânı ve insanların refah içinde yaşaması gibi olumlu etkileri yanında bir takım olumsuz etkileri de olmuştur. Ne yazık ki her toplumda olduğu gibi o günkü İslam toplumunda da bu zenginleşme bir takım fitne ve fesat hareketlerine sahne olmuştur. Bu fitne ve fesat hareketi ise, zenginleşen İslam toplumunda siyâsi, ideolojik ve kabîlevî bir takım etkenler altına gizlenmesine rağmen temelini ekonomik nedenlerin oluşturduğuna inandığımız bir harekettir. Hz. Ebûbekir döneminin hem kısa sürmesi hem de Hz. Peygamber'in yaşamına yakın bir dönem olması, Hz. Ömer'in ise adaletli ve dirayetli yönetimi sayesinde bu iki dönemde kayda değer bir olumsuzluk yaşanmamıştır. Özellikle Hz. Osman dönemine gelindiği zaman, bir anda zenginleşen bazı kabileler ve şahıslar bu zenginliğin sorumluluğunu taşıyamaz hale gelip de dünyevileşme hareketleri baş gösterince Ebû Zer gibi şahıslar ortaya çıkıp İslam ümmetini uyarı görevini üstlenmeye çalışmışlardır. Hz. Ali dönemi ise artık iplerin iyice koptuğu, İslam ümmeti arasında fiilen ve fikren çatışmaların yaşandığı bir dönem olmuştur."
