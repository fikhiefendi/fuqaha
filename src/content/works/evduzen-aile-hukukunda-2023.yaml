abstract: "XX. Yüzyılda Fas'ın bağımsızlığını kazanmasıyla birlikte aile hukuku alanında kanunlaştırma faaliyeti başlamıştır. İlk olarak 1957 yılında Mâlikî mezhebinin hükümleri kanun formunda düzenlenerek Müdevvenetü'l ahvâli'ş-şahsiyye ismi ile bir aile kanunu hazırlanmıştır. Ancak bu kanun halkın beklentilerini karşılamayınca 2004 yılında yeni aile kanunu olan Müdevvenetü'l-üsra yürürlüğe girmiştir. Müdevvenetü'l-üsra'da aile hukukuna ilişkin konularda kadın ve erkeklerin eşitliğini esas alan bir dizi değişiklik yapılmıştır. Cinsiyet eşitsizliğinin açık bir şekilde görülmesi sebebiyle en çok tartışılan mesele boşanma olmuştur. Bu hususta kadın-erkek eşitliğini sağlamak amacıyla Müdevvenetü'l-üsra'ya boşanmayla ilgili bir dizi yenilik yapılmakla birlikte iki yeni boşanma türü daha eklenmiştir. Söz konusu yeni boşanma türlerinden biri olan şikâk, kadınlara herhangi bir sebep göstermeden kolay bir şekilde boşanma imkânı tanımıştır. Başlangıçta kadınlara yönelik olarak getirilen bu boşanma türü, prosedür ve bazı haklar edinilmesi bakımından da avantaj sağlaması nedeniyle erkekler tarafından da çokça başvurulan bir tür olmuş ve Fas'ta boşanmanın seyrini değiştirmiştir. Bu yeniliklerin hem Mâliki mezhebi'nin hükümleri hem de evrensel ilkeler ışığında yapıldığı ifade edilse de klasik yorumların dışına çıkılmış ve İslâmın hükümlerine aykırı hükümler verilmiştir."
