abstract: "Müslüman bir mükellefin dünya ve ahiret mutluluğunu elde edebilmesi için bilmesi gereken“emirler”ve“nehiyler”, fıkıh usûlü eserlerinde gerek dünya ve gerekse ahiret hayatı açısından ele alınmaktadır. Zira bu konular, kişinin hem bireysel davranışlarını, hem de diğer insanlarla ilişkilerini düzenlemesi bakımından dünya hayatını ilişkindir. Aynı zamanda kişinin mükâfatı elde etmesi/cezayı hak etmesi bakımından da ahiret hayatını ilgilendirmektedir. Bu çalışmamız, söz konusu iki kavramdan biri olan“nehy”in delâleti ve furû fıkha dair yansımalarını, Hanefî ve Şâfiî mezhepleri örnekliğinde konu edinmektedir. Nehyin delâleti meselesi, İslam'ın ilk dönemlerinden itibaren işlenen konu olması nedeniyle, çalışmamızda, bu konu, fıkıh usûlü alanında tedvin edilmiş ilk eserlerden itibaren ele alınmaktadır. Ayrıca mezheplerin temel görüşlerini yansıtması bakımından, söz konusu mezheplerde önemli yere sahip İslam hukukçularının konuya ilişkin görüşleri incelenmektedir. Çalışmamızın birinci bölümünde nehiy kavramı tanımlanmakta ve nehiyle ilgili bazı meseleler kısaca ele alınmaktadır. İkinci bölümde Hanefî ve Şâfiî mezheplerine mensup İslam hukukçularının nehyin delâleti konusundaki görüşleri sunulmaktadır. Üçüncü bölümde ise, çalışmamız furû fıkıh alanından verilen örnekler bağlamında, Hanefî ve Şâfiî mezhebine mensup İslam hukukçularının benimsedikleri görüşler ile tatbik edilen furû fıkıh arasında uyumun var olup olmadığını konu edinmektedir."
