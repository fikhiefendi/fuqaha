abstract: "Bu çalışmamızda klasik dönem âlimlerinden birinin İslam iktisadı alanına dair görüşlerinin günümüz iktisadî ve finansal konularının fıkhî çözümlemesini yaparken ne derece etkin olabileceği hususunu ele almaya çalıştık. Bu bağlamda hicri yedince asırda yaşamış olup Mâlikî fıkhının önde gelen âlimlerinden, orijinal yaklaşımları ile öne çıkan İmam Şehâbeddin el-Karâfî'yi (ö. 684/1285) esas aldık. Karâfî'nin kaleme aldığı“el-Furûk”adlı eserindeki malî-iktisadî konular bütünlüklü olarak değerlendirildiğinde mezhepler arası farklılıkların derli toplu ve objektif bir biçimde aktarıldığı ve ilgili konulara olan vukufiyetinden bu alanda geniş bir bilgi birikimine sahip olduğu görülmektedir. Bu çalışma çerçevesinde Karâfî'nin el-Furûk adlı eserinden yola çıkılarak onun finansal işlemlere ilişkin konuları derli toplu ele alındıktan sonra günümüzde İslam bankalarında yaygın olarak kullanılan belli başlı mali işlemlerle alakası kurulabilecek bazı öne çıkan hukuki konular ele alınmaya çalışılmıştır. Bu amaçla bu araştırmada Karâfî'nin fıkhî görüşlerinin diğer mezhep imamlarıyla mukayesesiyle birlikte çağdaş hukukçuların fikirleriyle de karşılaştırılması yapılmıştır. Böylelikle Karâfî'nin bu konulara ilişkin görüşleri netleştirilmeye çalışılmış, ona ait fıkhî yaklaşımı diğerlerinden ayıran noktalar tespit edilmiş, yaptığı fıkhî çıkarımların etki ve gücü ile zihni anlayışının kuvvet ve genişliği ortaya konulmaya çalışılmıştır. Çalışmamız, iktisadî ve finansal işlemlerin temelini oluşturan ve katılım bankacılığının da pratikteki işlemlerini teşkil eden akitleri merkeze almaktadır. Öncelikle Karâfî'nin el-Furuk adlı eserinde akitlere yönelik tarif, tespit, temellendirme ve tasnifleri tespit edilmiştir. Çalışmanın bölümlerini oluştururken Karâfî'deki taksim esas alınarak akitler; bedelli, teberru ve dayanışma akitleri olmak üzere üç kategoride incelenmiştir. Her bir bölüme ilişkin Karâfî'nin görüşleri tespit edilirken klasik dönemde gerek Karâfî'nin de mensubu bulunduğu Mâlikî mezhebinin gerekse diğer mezheplerin konuya nasıl yaklaştıkları göz önünde bulundurulmuştur. Bir bütün olarak bakıldığında bu çalışmamız, klasik dönemde yaşamış bir âlimin görüşlerinin, günümüz fıkhî-iktisadî meselelerinin hükmünü belirlemede yol gösterici özelliğini yitirmediğini, fıkıh mirasımızın organik ve canlı yapısının devam ettiğini ortaya koymaktadır."
