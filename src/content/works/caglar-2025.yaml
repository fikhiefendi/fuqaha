abstract: "Bu çalışma, modern ıslahçı ekol mensuplarının usûl-i fıkıh ilminin geliştirilmesi ve yenilenmesi doğrultusunda ortaya koydukları çabaları incelemeyi ve değerlendirmeyi amaçlamaktadır. Araştırmanın bulguları, ıslahçıların geleneksel usûl-i fıkıh anlayışından bazı meselelerde farklı bir yaklaşım benimsediklerini ortaya koymaktadır. Bu farklılaşmalar arasında, sünnetin delil alanının daraltılması, icmâa zannî bir hücciyet atfedilerek onun daha çok kolektif ictihad mahiyetinde değerlendirilmesi ve ictihad ile müctehidin şartlarında kolaylaştırmaya gidilmesi gibi hususlar yer almaktadır. Bununla birlikte, modern ıslahçılar birçok meselede önceki âlimler tarafından benimsenmiş olan yerleşik görüşlerle örtüşen kanaatler de sergilemişlerdir. Öte yandan, modern fikrî yönelimlerden olan makasıd ilmi, tarihselcilik metodu ve bilginin İslamileştirilmesi projesi gibi yönelimler her ne kadar kökenlerini ıslahçı ekolden almış olsalar da bu ekolden farklı metodolojiler benimsemişlerdir ve geleneksel usûl-i fıkha belirgin bir önem atfetmemişlerdir. Bu yönelimler güçlü bir teorik söyleme sahip olmalarına rağmen, usûl-i fıkıh sahasında uygulamaya yönelik kalıcı ve etkili bir ıslah metodolojisi ortaya koyma konusunda başarı gösterememişlerdir. Bu çalışmada, modern ıslahçı ekolün usûl-i fıkıhtaki konumu ve bu konuma dair görüşleri ortaya koymak amacıyla betimleyici, tümevarımsal, tahlilî ve mukayeseli yöntemler birlikte kullanılmıştır. Araştırmacı, usûl-i fıkıh alanında meydana gelen modern dönüşümlerin daha sağlıklı anlaşılabilmesi ve bu dönüşümlere katkı sunan yeni metodolojilerin, hem İslam hukuk teorisinin genel yapısına hem de özel olarak usûl-i fıkıh ilminin gelişimine etkilerinin tespit edilebilmesi için, farklı usûlî ekollerin ve düşünsel yönelimlerin derinlemesine incelenmesini tavsiye etmektedir."
