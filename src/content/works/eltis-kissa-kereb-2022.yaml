abstract: "Türklerin İslamiyet'e girişinden sonra destani anlatıların konu bakımından cenk-name gazâvat-name türüne evrildiği gözlemlenmektedir. Hikâye edilen konular, genellikle fetih için gidilen yerlerde İslam askerlerinin kahramanlıkları ve din uğruna yapılan savaşların içeriği şeklinde olmaya başlamıştır. Bu türden hikâyelerde öne çıkan başkahramanın yiğit, cesur bir savaşçı olması anlatının konusu bakımından gayet doğaldır. Anadolu'da çok rağbet gören Hz. Ali cenk-namelerini Battal-name, Danişmend-name Saltuk-name gibi eserler takip etmiştir. Üzerinde çalıştığımız yazma, İstanbul Büyükşehir Belediyesi Atatürk Kitaplığı Nadir Eserler Bölümü'nde MC_YZ_K.000274 numarasına kayıtlı olan Kıssa-ı Kereb-i Gâzî veya Hikâye-i Muhammed Hanefî adını taşımakta olup adı geçen destani eserlere dahil edilebilir. Eserin kahramanları, Hz. Ali'nin Havle bint Ca'fer el-Hanefiyye'den olan oğlu Muhammed Hanefî ve Çorum Hıdırlık Tepesin'de türbesi bulunan sahabeden kahraman bir savaşçı olan“Amr bin Ma'di Kereb”Kereb-i Gâzî'dir. Destan/hikâyede Kereb-i Gâzî'nin ve Muhammed Hanefî'nin kahramanlıkları eş değer bir seyir izlemektedir. Mağrip diyarına gelen İslam ordusunun başında Muhammed Hanefî vardır, Kereb-i Gâzî ise onun en güçlü komutanı rolündedir. Adının Kıssa-ı Kereb-i Gâzî veya Hikâye-i Muhammed Hanefî olduğundan da anlaşılacağı gibi eser bir bakıma halk hikâyesi özelliği gösterirken bazı yönleriyle de destani unsurlar barındırmaktadır. Kereb-i Gâzî, fiziki özellikleri bakımından Oğuz Kağan'a benzerken Yemenli olmasına rağmen halkın muhayyilesinde“alp”tipini devam ettirmekte, diğer taraftan Türklerin İslamiyet'e girmesiyle ortaya çıkan alp-eren kimliğini de adında olduğu gibi“Kereb-i Gâzî”ortaya koymaktadır. Kereb-i Gâzî'nin, Hank-ı İshak adlı bir atının olması da onu Türk destan kahramanlarına yaklaştırmakta ve hikâyenin destan özelliği taşıdığını göstermektedir. Bu da eserin tam olarak destan mı hikâye mi ya da gazavat-name mi olduğunu belirlemekte işimizi zorlaştırmaktadır. Bu nedenle biz bu çalışmada genellikle destan/hikâye şeklinde ikili bir kullanımı tercih ettik. Eseri konusu bakımından kahramanlık hikâyesi olarak nitelendirmek heralde yanlış olmayacaktır."
