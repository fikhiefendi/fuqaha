abstract: "Bu çalışmada 16. Asır Osmanlı ulemasından Şeyhülislam Kemâl Paşazâde'nin (ö. 940/1534) usûl-i fıkıh ilmi alanında telif ettiği Şerhu Tağyîri't-Tenkîh eserinin başlangıcından et-Taksîmu's-Sânî kısmına kadar olan bölüm tahkik edilmiştir. Kemal Paşazâde'nin söz konusu eseri Ubeydullāh b. Mes'ûd Sadruşşerîa'nın (ö. 747/1346) Tenkīhu'l-Usûl isimli usûl kitabı üzerine telif edilmiş bir eserdir. Çalışmamızın temel konusunu Kemal Paşazâde'nin eserinin tanıtımı ve eserin yukarıda belitilen kısmının tahkiki oluşturmaktadır. Çalışmanın birinci bölümünde Şerhu Tağyîri't-Tenkîh içerik ve uslüp yönüyle incelenmiş, tahkikte esas alınan nüshaların tanıtımı yapılmıştır; ikinci bölümde ise eserin tahkik edilen bölümü yer almaktadır."
