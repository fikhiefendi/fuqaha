abstract: "Yardımcı üreme teknikleri bireylere, evlat sahibi olma arzularının karşılanamaması durumunda meydana gelen sorunları gidermeye yönelik yöntemler sunmaktadır. Aile ve neslin devamını sağlamayı amaçlayarak ailelerin mutluluğuna katkıda bulunan bu yöntemler, biyoteknolojinin ilerlemesiyle birlikte toplumlar arasında geniş bir kabul görmüş olsa da İslam hukuku açısından bazı sorunları gündeme getirmiştir. Bu çalışma yardımcı üreme tekniklerinin İslam hukukundaki yerini ele alarak literatürde var olan boşlukları ve bu alandaki eksiklikleri doldurmayı hedeflemektedir. İslam hukuku perspektifinden yardımcı üreme tekniklerini inceleyen çalışma, literatür ve konu taraması yöntemlerini kullanarak dinî ve hukuki analiz gerçekleştirmiştir. Çalışmanın sınırlamaları, konuyla ilgili güncel tıp bilimi, hukuki gelişmeler ve dinî fetvaları içermekte olup, bu sınırlamalar sonuçların genel geçerliliğini etkileyebilir.“İslam Hukukunda Yardımcı Üreme Teknikleri”başlığı altında sunulan tez, giriş, iki bölüm ve sonuç bölümünden oluşmaktadır. İlk bölümde yardımcı üreme tekniklerinin hangileri olduğu ve tercih nedenleri, yapay döllenme ve çeşitleri gibi konular açıklanmış, ikinci bölümde ise İslam hukuku açısından yardımcı üreme tekniklerine genel bir bakış sunulmuştur. Bu çalışma, yardımcı üreme teknikleri konusundaki belli başlı bazı fetva ve görüşleri analiz ederek bu alandaki önemli bir boşluğu doldurmayı amaçlamaktadır."
