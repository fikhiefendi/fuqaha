abstract: "Türkçe herkesin kullandığı bir dil olduğu için hep edebi metinler üzerinden çalışmalar yapmaktansa edebi metinlerin dışındaki metinlerin de değerli olduklarını bilmek ve onların da incelenmesini gerekli görmek gerekir. Bu sebeple çalışmada incelenecek metin olarak Mecelle-i Ahkâm-ı Adliyye seçilmiştir. Bu çalışmayla söz konusu eserin hem çeviri yazısı hem günümüz Türkçesine çevirisi hem de incelenmesi ilk defa aynı eserde toplanmıştır. Bu da Türk dili alanında yararlı bir kaynak oluştuğunu göstermektedir. Osmanlı Devleti'nde Tanzimat Dönemi'ne kadar Medeni Kanun olarak nitelendirilebilecek herhangi bir yazılı kanun bulunmamaktaydı. Bir durum karşısında yazılı olmayan şeri kanunlar uygulanmaktaydı. Şeri kanun olarak da Hanefi mezhebine dahil olan içtihadler kullanılmaktaydı. Bunların yanında fetva mecmuları da davaların çözümünde başvurulan kaynaklardı. Bu fetva mecmuları her ne kadar yazılı kaynaklar olsa da bir bütün olarak yazılı bir Medeni Kanun olarak adlandırılamazdı. Bu durum karmaşık bir davanın çözüme kavuşturulmasında yeterli olmuyordu. Çünkü herhangi bir davada ticaretle alakalı bir durum olduğunda söz konusu kaynakların yanında ticari hükümlere de ihtiyaç duyuluyordu. O dönemde hali hazırda bulunan Ticaret Kānunnâme-i Hümâyunu bazı ticari konuları barındırmadığından ticaret mahkemeleri işlevini yerine getiremiyordu. Tüm bu eksiklikleri gidermek için kanun adamları yetiştirilmeye çalışılsa da bu girişim zaman alacağından yeni bir Medeni Kanun oluşturulmasına karar verilmiştir. Ahmed Cevdet Paşa ve heyeti Mecelle-i Ahkâm-ı Adliyye'nin hazırlanmasında bulunmuşlar ve bu kanun bir mukaddime ve 16 kitap olacak şekilde hazırlanıp yürürlüğe konmuştur. Her kitap kendi içinde bablara ve her bab da kendi içinde fasıllara ayrılmıştır. Belli bir süre yürürlükte kalan Mecelle daha sonra yürürlükten kaldırılmıştır."
