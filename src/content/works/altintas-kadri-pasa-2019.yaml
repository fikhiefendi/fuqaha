abstract: "Bu çalışma, Muhammed Kadri Paşa'nın“Tatbîku mâ vücide fi'l-Kanûni'l-medenî muvâfıkan li-mezhebi Ebî Hanîfe”isimli eserini tahkik etmek suretiyle ilim camiasına kazandırmayı amaçlamaktadır. Müellifin yaşadığı 19. yüzyıl, Mısır'da siyasî, sosyal ve kültürel olarak çok çalkantılı bir döneme tekabül etmektedir. Fransız tesirinin her alanda bariz bir şekilde hissedildiği bu yüzyılda yapılan kanunlaştırma faaliyetleri de bu etkileşimden payını almıştır. Dönemin idarecilerinin talimatıyla kaleme alınan ve tahkikini yaptığımız bu eser, Fransız Medenî Kanunun, İslam Hukukuna uygunluğunu konu edinmektedir. Mısır'da Avrupâî tarzda eğitim vermesi için kurulan ve batı kaynaklarının tercümesi asıl vazifesi olan“Medresetü'l-Elsün”ün amacına uygun hizmet verdiğinin en önemli göstergesi Muhammed Kadri Paşa'dır."
