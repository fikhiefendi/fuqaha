abstract: "Ahmet b. Muhammed el-Kudûrî (ö.428/1037), Hanefî Mezhebinde iz bırakmış önemli fakihlerinden biridir. Hanefilerce temel muhtasar metinlerden sayılan ve el-Kitap olarak bilinen Kudûrî Muhtasarı, üzerinde birçok şerhler yazılmış, eğitim ve öğretimde gündemde kalarak günümüze kadar ulaşmıştır. Muhammed b. Hüseyin b. Muhammed Hâherzâde el-Buhârî (ö. 483/1090) de Kudûrî üzerine değerli çalışmalar yapmış bir Hanefi fakihidir. Hâherzâde'nin Kudûrî muhtasarı üzerine yazdığı eserlerden biri de“Müşkilâtü'l-Kudûrî”adlı mahtut eserdir. Hâherzâde bu çalışmasında Kudûrî metninde gördüğü problemli ve anlaşılması zor olan ifadeleri ve kelimeleri çözmeye çalışmış ve metinde geçen kavramların sözlük ve ıstılah manalarını zikrederek tarif etmiş ve şer'î delilleri serdederek konuyla ilgili farklı görüşlere eserinde yer vermek suretiyle bu kitabı meydana getirmiştir. Biz bu çalmamızda tespit ettiğimiz yazma nüshalardan yararlanarak Müşkilâtü'l-Kudûrî'nin Taharet, Namaz, Zekât, Oruç ve Hac bölümlerini yazma nüshaları esas alarak karşılaştırmak suretiyle tahkik ederek doğru metnini ortaya çıkarmaya çalıştık. Bu çalışmamız üç bölümden oluşmaktadır. Birinci Bölümde: Ahmet el-Kudûrî ve Hâherzâde el-Buhari'nin hayatları ve ilmi kişilikleri hakkında bilgi verilmiştir. İkinci Bölümde: Kitabın genel tanıtımı yapılmıştır. Burada, önce kitabın ismi ve müellife aidiyeti, kitabın özellikleri ve müellifin takip ettiği yöntemini anlattık. Tespit edebildiğimiz ve tahkike esas aldığımız nüshalardan dört tanesi ve çalışmamızda kullandığımız yöntem hakkında bilgi vererek varak sayısına göre konu fihristini yaptık. Üçüncü Bölümde: Tahkikte esas aldığımız nüshaları karşılaştırmak suretiyle ortaya çıkardığımız tahkikli metin yer almaktadır."
