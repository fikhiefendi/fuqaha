abstract: "Hadis, İslam'ın ikinci temel kaynağıdır. Ancak Hz. Peygamber'in döneminden tedvin dönemine kadar gelen süreçte bunu korumak için her dönemde gerekli tedbirler alınmasına rağmen sahih hadis ve uydurma hadisler birbirine karıştırılmıştır. Bunun önünü kesmek için Muhaddisler müstakil eserler kaleme almışlardır. Bundan ötürü her hadisin tespiti ve dolayısıyla sıhhat derecesinin tespiti son derece önemlidir. Bu çalışmada Bangladeşli Hadis ve Fıkıh Âlimi Müftü Seyyîd Muhammed Amîmü'l-İhsân el-Bereketî'nin“Fıkhu's-Sünen ve'l-Âsâr Edilletü's-Sâdâti'l-Ehnâf”adlı eserindeki hadislerin tahrîc ve değerlendirilmesi ele alınmıştır. Çalışmamız bir giriş ve iki ana kısımdan oluşmaktadır. Birinci bölümde öncelikle Müftü Seyyîd Muhammed Amîmü'l-İhsân el-Bereketî'nin hayatına, ilmî kişiliğine ve onun çalışmalarına değinmiş olacağız. İkinci bölümde ise,“Fıkhu's-Sünen ve'l-Âsâr Edilletü's-Sâdâti'l-Ehnâf”kitabı hakkında önemli bilgiler verip daha sonra bu eserin Nikâh ve Talâk bölümlerinde geçen hadisleri tespit edip kaynak taraması yaparak sıhhat durumuna göre sınıflandırma yaptıktan sonra genel bir değerlendirme ile çalışmamızı nihayete erdirmiş olacağız. Ayrıca rivayetler hakkında sahih, hasen ve zayıf gibi hükümlere yer verilmiştir."
