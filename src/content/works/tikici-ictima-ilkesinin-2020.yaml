abstract: "Fıkhî mezhepler, içtima ilkesini kapsamlı bir şekilde kullanmışlardır. İçtima, sebebin tekrar etmesine bağlı olarak hükmün tekrar etmesi kuralından istisna edilmesi suretiyle, birçok sebebin tek bir hükme bağlanmasıdır. Bu çalışma, içtima ilkesinin Hanefî ve Şâfiî mezhepleri bağlamında mukayesesini kapsamaktadır. Çalışmamız, iki bölümden oluşmaktadır. Giriş bölümünde çalışmamızın konusu, amacı, önemi ve temel başvuru kaynakları yer almaktadır. Birinci bölümde içtima ilkesinin sözlük anlamı, terim anlamı, içtima ile ilgili kavramlar ve içtima ilkesinin dayanakları bulunmaktadır. İkinci bölümde ise, Hanefî ve Şâfiî fakihlerin, kendi ekollerince belirledikleri ve geliştirdikleri fıkhî kurallara bağlı olarak içtima ilkesini ibâdât, muâmelât ve ukûbât alanlarında nasıl uyguladıklarının mukayesesi yer almaktadır. Hanefiler, daha çok ibadet ile alakalı olmayan fakat ibadete vesile olan fiillerde içtima ilkesini tercih etmişlerdir. İbadet olan fiillerde ise, istihsân kuralı gereği içtimayı tercih etmişlerdir. Şâfiîler ise, hem ibadet olan hem de ibadete vesile olan fiillerde herhangi bir ayrım gözetmeksizin, içtima ilkesini tercih etmişlerdir. Bu çalışmamızda, özellikle Hanefi ve Şafiî mezheplerinin içtima ilkesini uyguladıkları alanları, kaynaklarından tespit ederek, delilleri ile birlikte belirtmeye çalıştık. Ayrıca bu mezheplerin, içtima ilkesini uyguladıkları alanları ve delillerine dayanarak, tercih edilen görüşleri açıklamaya gayret ettik. Bu çalışmamızı, Hanefi ve Şafii mezheplerinin temel kaynakları başta olmak üzere, konumuz ile ilgili son dönemde yazılmış olan diğer eserlerden de istifade ederek hazırladık."
