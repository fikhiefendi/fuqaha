abstract: "Osmanlı ceza hukukunun tarihi serüvenini daha iyi anlama ve yorumlamaya katkı sağlayan bu çalışma, 16. asırda yaşayan ve ilmiye sınıfının önemli temsilcilerinden biri olan Fenârî ailesine mensup Mahmûd b. Pîr Mehmed'in hayatını, eserlerini ve telif etmiş olduğu ta'zîr risâlesini konu edinmektedir. Yapılan araştırmada, Fenârî ailesine dair klasik ve güncel çalışmalarda görülen farklılık ve hatalar üzerinde durulmuş, gerek Arapça gerekse de Osmanlıca yazılan tabâkat ve terâcim kitaplarından istifade edilerek Fenâr nisbesinin nereye ait olduğu irdelenmiş ve Fenârîzâdeler hakkında bilgi verilerek bir soyağacı çalışması ortaya konmuştur. Bunun yanında Mahmûd el-Fenârî'nin telif etmiş olduğu ta'zîr risâlesi tahkik edilip muhtevası incelenmiş, müellifin mukaddime kısmında bahsettiği, yaşadığı döneme ait müşâhede edilen hukukî ve ahlakî çöküntüler üzerinde durulmuş ve çalışmanın sonunda Mahmûd el-Fenârî'nin bu risâlesi ile yine aynı asırda yaşayan Şeyhülislam Çivizâde Muhyiddin Efendi tarafından telif edilen ta'zîr risâlesi birbiriyle karşılaştırılmıştır."
