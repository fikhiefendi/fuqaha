abstract: "Çalışmada, Türkiye'de faaliyetlerini sürdüren mevduat bankaları ile katılım bankalarının mevduat/katılım fonu ve kredilendirme bakımından sağladıkları faydaları karşılaştırmalı olarak ekonometrik modellerle analiz ederek, Türk Bankacılık Sektörünün piyasa etkinliği incelenmektedir. İkili bankacılık sistemine sahip ülke örnekleri incelenmekle birlikte, İslam hukukuna dayalı olarak faaliyetlerini sürdürmesi gereken faizsiz bankacılık sistemi ve mevduat bankacılığı uygulamalarının farklılıkları, ürünleri, katılım bankalarının risk yönetimi ele alınmaktadır. Çalışma bildiğimiz kadarıyla Türkiye için bu alanda yapılan ilk çalışma özelliği taşımaktadır. Mevduat ve katılım bankalarının aktif kalitesine, likiditeye, sermaye yapısına, karlılığa ve kaldıraçlara ilişkin çeşitli finansal sağlamlık göstergeleri finansal rasyo analizi kullanılarak karşılaştırmalı olarak incelenmiştir. Ocak 2005-Aralık 2015 dönemi için aylık veri kullanılarak mevduat bankalarının dağıttığı ortalama faiz oranları ile katılım bankalarının dağıttığı ortalama kar payı oranları Monte Carlo simülasyonu ile karşılaştırılmıştır. Analiz sonucunda istatistiki olarak anlamlı seviyede mevduat bankalarının 0,49 puan daha yüksek bir getiri sağladığı bulunmuştur. Haziran 2010-Aralık 2015 dönemi için konut kredilerinden alınan faizler ve kar payları ortalamaları Monte Carlo simülasyonu ile karşılaştırılmıştır. Analiz sonucunda istatistik olarak anlamlı seviyede mevduat bankalarının 0,92 puan daha düşük maliyet ile fon sağladığı gözlenmiştir. Ticari kredilerden alınan faiz ve kar payı oranları karşılaştırılmış, katılım bankalarının istatistiki olarak anlamlı seviyede 0,72 puan daha düşük maliyet ile fonlama yaptığı görülmüştür. Ocak 2005-Aralık 2015 dönemi için banka gruplarının ortalama aktif karlılığı, ortalama özkaynak karlılığı ve ortalama net faiz/kar payı marjı regresyon analizi ile karşılaştırılmıştır. Analizde makroekonomik göstergeler, likidite göstergeleri, para arzı göstergeleri, aktif kalitesi göstergeleri bağımsız değişken olarak kullanılmıştır. Regresyon analizi sonuçlarına göre iki banka grubunu karşılaştıran göstergelerinde istatistiki olarak anlamlı bir fark bulunmamıştır."
