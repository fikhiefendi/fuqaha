abstract: "Bu çalışmada Mu?tezile ve Eş?arî mezhepleriyle fıkıhçıların büyük günah problemi hakkındaki görüşleri yer almaktadır. Büyük günahlar Kur?an?da ve hadiste şiddetli tehdit ifadeleriyle sakındırılan eylemlerdir. Bunun yanısıra insanın kendisine, toplumun huzur ve mutluluğuna zarar veren fiil ve davranışlardır. Fert, aile ve toplumun inanç yapısını etkileyen eylemler büyük günahları tanımamızda başlıca ölçütlerdir. Kelâmcılar büyük günah meselesini iman konusu kapsamında ele almaktadırlar. Bunun sebebi ise kelâmın doğuşunu hazırlayan Müslümanların birbirlerini öldürme olaylarıdır. Fıkıhçılar ise konuyu hukukî sonuçlar bağlamında incelemektedirler. Fıkıhçılar ve kelâmcılar arasındaki ayrıcı özellik şöyledir: Kelâmcılar büyük günah sahibinin ahirete ait durumunu sorgulamaktadırlar. Fıkıhçılar ise büyük günah işleyenin sadece dünyaya ait durumuyla ilgilenmektedir. Fıkıhçılar ve Kelâmcılar arasındaki birleştirici unsur ise: Her iki yaklaşımın büyük günahların maslahat ve hikmet esasına göre yasak edilmiş olduğunu kabul etmeleridir. Günahların yasaklanma hikmetleri anlaşıldığı ölçüde günahlara girmenin hem dînen hem de dünyevî birçok zararlarından korunmuş olunur. Böyle bir kimse dinin tasvip ettiği birey olur. Böyle bireylerden oluşan toplum ise Kur?an?ın tabiriyle en hayırlı bir ümmet olma yolunda ilerler."
