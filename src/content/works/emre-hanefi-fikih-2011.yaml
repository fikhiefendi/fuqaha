abstract: "İslam toplumunun kurmuş olduğu medeniyet ortamında yoğun ilmi gelişmeler sonucunda İslam fıkhının klasik kaynakları ortaya çıkmıştır. Kuruluş devri aşamasından sonra ortaya çıkan bu temel kaynakların bir kısmını muhtasar metinler, bir kısmını da şerh ve haşiyeler oluşturmaktadır. Fakihler, klasik kaynaklarda sosyal olayları Kur'an ve sünnet nassları ışığında çözümlemeye ve düzenlemeye çalışırken akli deliller olarak külli kaidelere ve kural niteliğindeki dâbıtlara oldukça önem vermişlerdir. Bu klasik muhtasar metinlerden birisi de Kudûri'nin Muhtasar'ını esas alarak altıncı asırda Alauddin es-Semerkandî (539/1144) tarafından telif edilen Tuhfetü'l-Fukahâ adlı eserdir.Bu eserde var olan külli kaideleri ve yorumlarını ortaya çıkarmak için ?Hanefi Fıkıh Bilgini Semerkandi'nin Tuhfetu'l-Fukahâ Adlı Eserinde Külli Kaideler? isimli tezimizi üç bölümden müteşekkil hazırladık.Birinci bölümde Semerkandî'nin hayatı, ilmi kişiliği ve Tuhfetu'l-Fukahâ adlı eseri hakkında genel bilgi verdik.İkinci bölümde ise tezimizin çerçevesini oluşturan ?külli kaide? kavramını klasik ve modern tartışmaları da göz önüne alarak inceledik. Külli kaide kavramının kaynaklık değerine, literatürdeki yerine dönemsel olarak işaret ettik.Üçüncü bölümde ise Tuhfetu'l-Fukahâ'da lafız olarak yer alan ve İslam hukuku makasıd ve felsefesini yansıtan üçyüz yirmi beş kadar külli kaideyi, müellifin yaptığı yorumlar doğrultusunda açıklamaya çalıştık."
