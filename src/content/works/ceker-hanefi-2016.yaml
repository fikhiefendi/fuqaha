abstract: "Hanefi mezhebi özelinde biyografi yazımının ele alındığı bu çalışmada, Hanefi biyografi yazıcılığının ürünleri olan biyografik eserler üzerinden bir gelenek değerlendirmesi yapılmıştır. Bu amaçla yaptığımız çalışma bir giriş, dört bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde öncelikle çalışmanın önemi ve amacı üzerinde durulmuş, kapsamı belirlenmiş ve bu konuya yakın çalışmalara yer verilmiştir. Birinci bölüm, biyografi üzerine olup biyografi kavramı, biyografinin İslam medeniyetindeki karşılığı olabilecek yazım türleri, biyografik bilgi içeren diğer eserler, İslam medeniyetinde biyografinin tarihi, biyografi yazımının önemi, sebepleri, kaynakları, içerik unsurları, yazarı ve edebi üslubu gibi konuların yanı sıra çeşitli kriterlere göre biyografi çeşitleri bu bölümde ele alınmıştır. İkinci bölüm Hanefi biyografi geleneğinin ilk örneklerini teşkil eden, mezhep kurucusu Ebû Hanîfe hakkında yazılmış şahsi biyografi eserleri hakkında olup 41 eser ve yazarı hakkında bilgi verilmiştir. Üçüncü bölüm, Hanefi biyografi geleneğinin en önemli eserleri olan biyografi derlemelerine özeldir. Bu kapsamda 27 eser; yazarı, içeriği, kapsamı, sistematiği, kaynakları vb. açılardan incelenmiştir. Son bölümde, öncelikle Hanefi biyografi geleneğinde eser yazım sebepleri konusu incelenmiş; ardından Hanefi biyografi yazıcılığının tarihsel seyri ve bölgelere göre biyografi yazımının durumu ele alınmıştır. Araştırma neticesinde elde edilen bulguların ve bu alanda yapılabilecek çalışmaların yer aldığı \"Sonuç\" bölümü ile çalışma sona ermiştir. Anahtar Kelimeler: Biyografi, Biyografi geleneği, Hanefi mezhebi, Ebû Hanîfe, Siret,Menakıb, Tabakat, Teracim, Ahbar."
