abstract: "Kur'ân, muhataplarının hayatını tanzim için indirilmiş ilahi kurallar bütünüdür. Müslümanlar ibadetlerini ve günlük hayattaki işlerini bu kurallar çerçevesinde düzenlemeye çalışır. Bu düzene yönelik kuralların daha iyi anlaşılması için özellikle ibâdet, muamelât ve ukûbât konularını içeren âyetleri açıklayan ahkâm tefsirleri vardır. Hz. Resûl'ün vefatından yaklaşık 100 yıl sonra ilk olarak Mukâtil b. Süleyman (ö. 150/767) Tefsîrü'l-ḫamsi mie âye mine'l-Ḳurʾân adlı ahkâm tefsirini kaleme almıştır. Devam eden süreçte Cessâs (ö. 370/917), İbnü'l-Arabî (ö. 543/1148) ve Kurtubî (ö. 671/1273) gibi müfessirler Ahkâmü'l-Kur'ân ismiyle tefsirler yazmıştır. Bu çalışmanın amacı, son dönemde Türkçe yazılan ahkâm tefsirlerinden biri olan Hamdi Döndüren'in Ahkamü'l-Kur'ân, Kur'ân'ı Kerîm ve Fıkhî Tefsîri isimli eserinin metodolojik olarak incelemektir. Bu doğrultuda çalışmada hem en son yazılan bu ahkâm tefsiri, hem de aynı esere kaynaklık eden ahkâm tefsirleri genel hatlarıyla ele alınmaktadır. Müfessir, yalnızca ahkâm âyetlerini ele almamış, aynı zamanda çoğu ahkâm tefsirlerinden farklı olarak Kur'ân'ı baştan sona tetkik etmiştir. Böylece çalışmasında Kur'ân'da belirtilen hükümlerin bir bütünlük içerisinde ele alınması, çalışmasının daha geniş kitlelere ulaşmasını kolaylaştırmıştır."
