abstract: "Değişen zamanla beraber gelişen teknolojik imkânlar sayesinde sosyal medya mecraları, insanların hayatlarına dâhil olmuş ve hayatlarının bir parçası haline gelmiştir. Bu dâhil oluş, kullanıcı konumunda olan şahsın hak ve sorumlulukları ile ilgili meseleleri de gündeme getirmiştir. Bu durum, şahsiyet haklarını, sosyal medya ekseninde tartışıp bu bağlamda hakların korunma altına alınması için çözüm yollarının üretilmesini gerektirmektedir. Biz bu çalışmamız ile öncelikle şahsı ve şahsiyet haklarını, internetin keşfinden sonra kullanım alanı bulan sosyal medyanın ortaya çıkış sürecini, gelişimini, özelliklerini, sağladığı kolaylıkları ele alarak genel anlamda sosyal medya araçlarını tanıtmaya çalışıp bu mecralarda karşılaşılan şahsiyet hakkı ihlalleri ve korunma yollarını açıklamaya çalışacağız. Sonrasında ise şahısların, sanal âlem üzerindeki içerik paylaşımlarını ve bu paylaşımların şahsiyeti oluşturan maddi, manevi ve ekonomik değerleri üzerindeki etkisini İslam hukuku açısından değerlendirmeye çalışacağız. Bu bağlamda şahsın kamusal, özel ve sır hayat alanı sınırlarının nasıl olması gerektiği üzerinde durmaya çalışacağız."
