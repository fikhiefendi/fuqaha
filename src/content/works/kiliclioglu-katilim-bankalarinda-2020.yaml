abstract: "Çalışmada sorunlu kredilerin tasfiyesi için katılım bankalarının uyguladıkları işlemler incelenmiştir. Çalışmanın amacı, katılım bankalarının sorunlu kredileri etkin bir şekilde yönetmek için uygulanan politikaları tanıtmak ve bu politikalar ile sorunlu kredilerin nasıl tasfiye edilebileceğini ortaya koymaktır. Çalışmanın ilk bölümünde İslami finans kavramı ve kuralları incelenmiştir. Çalışmanın ikinci bölümde Katılım Bankacılığı ve ürünleri hakkında detaylı bilgi verilmiştir. Ardından sorunlu krediler tanımlanmış, ortaya çıkış sebepleri ve sonuçları detaylı olarak paylaşılmıştır. Sorunlu kredilerin yasal mevzuatı, muhasebesi ve katılım bankalarının sorunlu kredileri hakkında bilgi verilmiştir. Çalışmanın son bölümünde ise, sorunlu kredilerin tasfiye yöntemleri aktarılmıştır. Bu çalışmada, katılım bankalarının sorunlu kredileri yönetme performansı geleneksel bankalar ile karşılaştırılmış ve katılım bankaları için sorunlu kredilerin etkin bir şekilde yönetilmesi ve tasfiyesi için yol gösterici bir kaynak oluşturması hedeflenmiştir."
