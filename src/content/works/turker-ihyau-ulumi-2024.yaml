abstract: "İmam Gazzâlî'nin İslami ilimlerde yetkin olduğu su götürmez bir gerçektir. Mensubu olduğu Şafiî mezhebinde de haklı bir şöhrete sahiptir. Burada çalışmamızın amacı İmam Gazzâlî'nin mensubu olduğu Şafiî mezhebinin genel kabul gören görüşlerine ne derece mutabık kaldığını ve bu mezhebin görüşlerinden farklı düşündüğü hususların neler olduğunu tespit etmek olacaktır. Başta temizlik ile ilgili meseleler ele alınmıştır. Ardından namaz, zekât, oruç ve hac ibadetiyle ilgili meseleler karşılaştırmalı bir şekilde incelenmiştir. Yer yer farklılıklar belirtilerek ihtilaflı meseleler tespit edilmiştir. Son kısımda ise belli başlı ihtilaflar özet bir şekilde sunularak bir sonuca varılmıştır."
