abstract: "Sosyal medya platformları, insanların günlük deneyimlerini ve hatta özel hayatlarının bir kısmını paylaştıkları sanal alanlar hâline gelmiştir. Müslümanların eylemleri ile ilgilenen bir disiplin olan fıkıh, sosyal hayatın farklı boyutlarına dair hükümlere sahip olduğu gibi, dijital ortamlardaki faaliyetlere yönelik hükümler geliştirmiştir. Bu nedenle, yalnızca gündelik pratikler değil; sosyal, dinî ve ekonomik faaliyetlerin de yürütüldüğü bu platformların fıkhî açıdan değerlendirilmesi ve konuyla ilgili hükümlerinin belirlenmesi gerekmektedir. Günümüzde ortaya çıkan fıkhî meselelerde ise, ictihat etme ve hüküm verme konusunda otorite kabul edilen fetva kurullarının görüşleri, fıkhi bakış açısının ortaya konmasında önem arzetmektedir. Amerika Müslüman Fakihler Meclisi (AMJA), Din İşleri Yüksek Kurulu, Uluslararası İslam Fıkıh Akademisi Konseyi (IIFA), Endonezya Alimler Birliği (MUI), Hindistan Fıkıh Akademisi, Ürdün Fetva Dairesi (FDJ) ve İslam Fıkıh Akademisi (IFC) gibi dünyanın farklı bölgelerinden önde gelen fetva kurulları, sosyal medya kullanımına dair çeşitli yaklaşımlar içeren fetvalar yayımlamışlardır. Bu çalışma, sosyal medyanın 21. yüzyılın sonlarında ortaya çıkışıyla birlikte, söz konusu fetva kurullarının sosyal medya olgusuna nasıl yaklaştığını incelemektedir. Özellikle, sosyal medya kullanımının İslami ilkeler çerçevesinde nasıl analiz edildiğini ve bu fetvaların hangi kaynaklara ve temellere dayandırıldığını araştırmaktadır. Böylece çalışma, insanların günlük yaşamlarında karşılaştıkları güncel bir meselenin karşılaştırmalı analizini sunmakta ve İslam'ın bu konudaki yaklaşımına ışık tutmaktadır. Ayrıca, sosyalmedyayla ilgili bazı meseleler ele alınmış olsa da bazı sosyal medya faaliyetleri hakkında hâlen İslami bir görüşün bulunmadığına da dikkat çekmektedir. Bu kapsamda çalışmada, nitel bir araştırma yöntemi benimsenmiş; içerik analizi tekniği kullanılarak sosyal medya ile ilgili fetvalar detaylı ve karşılaştırmalı bir biçimde incelenmiştir. Mevcut araştırma, fıkıh ile çağdaş dijital platformlar arasındaki ilişkiye dair İslam âlimlerinin yaklaşımlarını ortaya koyarak sosyal medya ve fıkıh arasındaki ilişkinin daha iyi anlaşılmasına katkı sunmayı amaçlamaktadır. Ayrıca, İslam ile teknolojik gelişmeler arasındaki ilişki üzerine gelecekte yapılacak araştırmalara zemin hazırlamayı hedeflemektedir."
