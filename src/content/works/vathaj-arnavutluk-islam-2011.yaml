abstract: "Bu çalışmada, Arnavutluk Miras Hukuku ile İslâm Miras Hukuku mukayeseli olarak ele alınmaktadır.Çalışma, giriş, üç bölüm ve sonuçtan oluşmaktadır.Birinci bölümde, Miras Hukukun mahiyeti, tarihte ve günümüzde bulunan miras sistemleri, Arnavutluk ve İslâm Miras Hukuku'nun kısa bir değerlendirilmesi yapılmıştır.İkinci bölümde, Arnavutluk ve İslâm Miras Hukuku'nun benzerlikleri ve farklılıkları tespit edilerek, mirasın rükünleri, sebepleri, mirasçı olma şartları ve mirasa engel olabilecek durumlara yer verilmiştir.Üçüncü bölümde, mirasın taksimi ve taksim türleri, taksimin iptalini gerektirecek durumlar, mirastaki vasiyetin konumu ve evlat edinme, erkeğin kadından fazla hisse alması gibi konular iki hukuk sistemi açısından karşılaştırılmalı olarak ele alınmaya çalışılmıştır"
