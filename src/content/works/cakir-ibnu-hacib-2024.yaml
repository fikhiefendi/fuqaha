abstract: "Yaşadıkları dönemde âlimler tarafından takdir edilen İbnü'l-Hâcib ve İbn Mâlik nahivle alakalı çok kıymetli eserler kaleme almışlardır, talebe yetiştirmişlerdir yeni kural ve kaideler getirmişlerdir ve eserleri medreselerin başucu kaynağı olmuştur. Her iki âlimin eserleri üzerinde araştırma yapmak büyük önem arzetmektedir. Günümüz Arap dünyasında, İbnü'l-Hâcib ve İbn Mâlik ile ilgili pek çok tez ve makale çalışması varken, ülkemizde yeterli düzeyde akademik çalışma bulunmamaktadır. Ayrıca nahvin en önemli bölümü merfû'âtla alakalı İbnü'l-Hâcib ve İbn Mâlik'în eserleri üzerine herhangi bir akademik çalışma yapılmaması araştırmayı özgün kılmaktadır. Bu araştırmanın amacı İbnü'l-Hâcib ve İbn Mâlik'in merfû'ât konusu özelinde, kullandıkları naklî ve akli delilleri tespit etmek, aralarında var olan ihtilâfları göstermek, Basralılara ve Kûfelilere yönelik eleştiri, tercih ve nakillerini ortaya koymak, dilcilerin görüşlerine yaptıkları tenkit, tercih ve nakilleri sistematik bir şekilde bir araya getirmek, merfû'âtın ana unsurlarına dair görüş, tercih ve tenkitleri detaylı bir şekilde ifade etmek ve yapılan araştırmanın tamamı hakkında bir değerlendirmede bulunulması amaçlanmıştır."
