abstract: "ÖZET DOKTORA TEZİ İBN TEYMİYYE'NİN MECMÛ'Ü FETÂVAÂSINDA EHLİ BİD'AT FIRKALARINA BAKIŞI Muhammet YAZICI Danışman: Prof. Dr. EmruIIah YÜKSEL 1998 - Sayfa: XV+417 Jüri : Prof Dr. EmruIIah YÜKSEL Bizim bu tezdeki temel amacımız, İbn Teymiyye'nin hayatını, düşüncelerini ve öğretilerini tarafsız bir anlayışla ortaya koymaktır. Öncelikle biz onun İslam-dışı yenilikler ve bid'atlere karşı İslam'ı koruma esasına dayanan katıksız İslam hedefi ve idealeri uğruna çekmiş olduğu acılı ve çileli hayatını inceledik. Daha sonra İbn Teymiyye hakkında ön yargısız ve tarafsız bilgi sahibi olmak için bizzat kendi eserlerini inceledik. Bunun yanında biz, İbn Teymiyye'nin bid'at hakkında sadece eleştirildiği değil, aynı zamanda desteklendiği noktaları da belirttik. Bütün bu çalışmalar sonucu ortaya çıkmıştır ki, bazı İslâm düşünürlerinin söylediği gibi, İbn Teymiyye, ne bir zındıktır ne de kâfirdir. Fakat o, -doğruları ve yanlışları ile- Cehmiye, Rafıza ve bazen Eş'arîler ile mücadele eden, İslâm'ın Asr-ı saadet zamanındaki gibi katıksız ve sade olmasını savunan kendine özgü bir İslâm düşünürüdür."
