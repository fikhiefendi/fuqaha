abstract: "Bu çalışma, Ebû Mansûr el-Mâturîdî'nin (öl. 333/944) Teʾvîlâtü'l-Ḳurʾân ve Fahreddin er-Râzî'nin (öl. 606/1210) Mefâtîḥu'l-ġayb (et-Tefsîrü'l-kebîr) adlı tefsirlerinde yer alan ceza hukukuna dair ahkâm âyetlerini fıkhî açıdan karşılaştırmalı olarak incelemeyi amaçlamaktadır. Araştırmanın temel amacı, iki müfessirin nasla belirlenmiş ceza hükümlerine yaklaşım biçimlerini tespit etmek, delil kullanımlarını ve yorum metotlarını ortaya koymak, ayrıca fıkhî mukayese yöntemiyle benzerlik ve farklılıkları değerlendirmektir. Çalışma yalnızca Kur'ân'da ceza hukukuna dair ve nasla belirlenmiş hükümlerle sınırlıdır. Bu kapsamda hırsızlık, hırâbe (eşkıyalık-yol kesme-terör), kısas, zina ve kazf (zina iftirası) suçlarına ilişkin âyetler ele alınmıştır. Her iki müfessirin eserleri ana kaynak olarak kullanılmış, ayrıca klasik fıkıh literatürü ve Hanefî ile Şâfiî mezheplerinin temel hükümleriyle destek sağlanmıştır. Analiz, her bir âyet bağlamında müfessirlerin yorumlarını, delil tercihlerinin fıkhî temellerini ve mezhep çizgisinin etkilerini ortaya koyacak şekilde tasarlanmıştır. Bu yöntem, Mâturîdî ve Râzî'nin fıkhî düşünce çerçevesinde tefsir metinlerini nasıl değerlendirdiğini sistemli bir biçimde incelemeyi sağlamaktadır. Mâturîdî ve Râzî'nin ilmî kişilikleri, eserleri ve tefsir metotları dikkate alınarak eserlerinde yer alan ceza hukuku âyetleri, fıkhî bakış açısıyla mukayeseli olarak ele alınmış ve yorumlarda izledikleri metodoloji ayrıntılı biçimde incelenmiştir. Çalışma, söz konusu âyetlerin fıkhî açıdan sistematik bir biçimde değerlendirilmesine imkân sağlayarak, İslam ceza hukuku âyetlerine yaklaşımları bağlamında Mâturîdî ve Râzî'nin metodolojisinin anlaşılmasına katkıda bulunmaktadır."
