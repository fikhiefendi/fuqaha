abstract: "Yahudilerin Süleyman Mabedi, Hristiyanların Kıyamet Kilisesi, Müslümanların Mescid-i Aksâ'sı gibi mekanlarıyla semavi dinlerin ortak mukaddesi olan Kudüs, günümüzün tarihi ve önemli dini merkezlerinden biridir. Diğer semavi dinlerde olduğu gibi İslam'da da birçok önemli hadiselerin öznesi konumundadır. Bu yönüyle dikkate alındığında İslam nezdindeki konumunun ne olduğu, bu konumun neden ve nereden kaynaklandığı, İslam'ın iki farklı yorumu olarak ortaya çıkan Şiî ve Sünnî yaklaşımın bakışının nasıl olduğu gibi sorular önem arz etmektedir. Özellikle günümüzde Kudüs'ün bulunduğu durum gerek Sünnî gerekse Şiî yaklaşımın mensupları tarafından dikkatle takip edildiği ve kimi zaman her iki taraf tarafından bölgedeki direnişin desteklendiği de göz önüne alındığında, bu soru daha da önem kazanmaktadır. Bu sebeple tezde, Kudüs'ün değeri hakkında iki yaklaşımında temel kaynaklarından olan hadisler incelenecek, yer alan rivayetlere karşılaştırmalı olarak değerlendirilecek ve her iki yaklaşımın Kudüs'e verdiği değerin temelleri aranarak bir değer araştırması yapılacaktır."
