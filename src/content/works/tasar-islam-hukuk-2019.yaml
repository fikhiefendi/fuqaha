abstract: "“İslam Hukuk Tarihinde Eytam Sandıkları (Kurumsallaşma Süreci)”adlı bu çalışma giriş ve iki bölümden oluşmaktadır. Tezin giriş kısmında araştırmanın amacı, konusu ve önemine ilişkin bilgiler yer almaktadır. Ayrıca başvurulan kaynaklar tanıtılmış olup bu alanda yapılan çalışmalar belirtilmiştir. Birinci bölümde İslam'ın yetime verdiği değeri açıkça belirten Kur'ân ayetlerinden hareketle yetim haklarının korunması konusunda ortaya koyulan prensipler ele alınmış ve yetimlerin himaye edilmesine ilişkin örnekler gösterilmeye çalışılmıştır. Ayrıca Osmanlı Devleti'nde yetimler için kurulmuş olan müesseseler hakkında bilgi verilmiştir. İkinci Bölümde ise konuyla ilgili terimler ve kavramlar açıklanmış olup Osmanlı döneminde yetim malları hakkında yapılan işlemler detaylı olarak anlatılmaya çalışılmıştır. Bu bölümde Eytam İdaresi ve Sandıklarının kurulma süreci, teşkilat yapısı, görevlileri ve çalışma usulü hakkındaki detaylı bilgiler nizamnameler temelinde ele alınmış ve incelenmiştir. Yetim mallarının işletilmesi ve Eytam Sandıkları hakkında varılan genel kanaat sonuç kısmında bulunmaktadır."
