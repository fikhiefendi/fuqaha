abstract: "Bu çalışmanın inceleme konusu muhsan kavramıdır. Fıkıh literatüründeki yeri itibariyle muhsan kavramı, meşrû bir evliliğin nasıl olması gerektiğinin ilkelerini ve şartlarını göstermesi bakımından Kitabu'n-Nikâh başlığıyla aile hukukunun; zina ve kazf suçlarına verilecek cezada belirleyici olması bakımından ise Kitabu'l-Hudûd başlığıyla ceza hukukunun konuları arasında yer almıştır. Bu bakımdan muhsan kavramının hem aile hem de ceza hukukunu ilgilendiren bir öneme sahip olmasının yanı sıra kavramın mahiyeti, şartları ve hukukî sonuçları fukahânın tartıştığı temel meseleleri teşkil etmiştir. Bu yönden fukahânın tartıştığı temel meselelere dair doğru sonuçlara ulaşabilmek amacıyla literatür taraması ve karşılaştırmalı analiz yönteminden faydalanılarak kavram hakkında mezheplerin görüşleri mukayeseli olarak ele alınmıştır. Çalışma sonucunda muhsan kavramının mahiyet itibariyle recm ihsanı ve kazf ihsanı şeklinde iki tanımının bulunduğu belirlenmiş; bu iki tanım içerisinde recm ihsanının evli kimselerde aranan şartları; kazf ihsanının ise ister evli ister bekar olsun kişiyi iffetli kılan şartları ihtiva ettiği tespit edilmiştir. Kavramın mahiyeti noktasındaki tartışmaların ise recm ihsanının şartları konusunda meydana geldiği anlaşılmış ve bu şartların mezheplere göre muhtelif şekillerde zikredildiği görülmüştür. Bununla birlikte aile hukukunda muhsan kavramının, recm ihsanının şartlarından müteşekkil olduğu belirlenmiş; recm ihsanındaki şartların evlilik içerisinde tamamlanmış olmasıyla eşlerin muhsan vasfını kazanacağı ve bu vasfın sonradan meydana gelen durumlarla sâkıt olabileceği tespit edilmiştir. Aile hukukunda eşlerin muhsan olma durumlarının tespitindeki gayenin ise esasen zina eden evli kimseye recm cezasını gerektirmesi bakımından ceza hukukuna temel teşkil ettiği görülmüştür. Ceza hukukunda ise muhsan kavramının iki farklı sonucu olduğu belirlenmiş; buna göre recm ihsanının şartlarını sağlayan evli bir kimsenin zina suçu işlemesi hâlinde recm cezasının, kazf ihsanının şartlarını sağlayan bir kimseye zina isnadında bulunulması hâlinde ise iftirada bulunan kimseye kazf cezasının gerekli olduğu tespit edilmiştir. Bu açıdan çalışmanın sonuçları, bundan sonraki çalışmalara temel oluşturma ve bilhassa muhsan kavramının aile hukuku yönünden ele alınmasına zemin hazırlama noktasında katkı sağlayacağı temenni edilmektedir."
