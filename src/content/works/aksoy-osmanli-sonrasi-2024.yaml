abstract: "Dört asır boyunca Osmanlı İmparatorluğu idaresi altında olan ve Bilâdüşşam toprakları olarak adlandırılan; Suriye, Ürdün, Lübnan ve Filistin mıntıkasında Osmanlı hukuk sistemi tatbik edilmiştir. Yazarlar, Osmanlı hukuk sistemini iki ana döneme ayırmışlardır. Kuruluşundan Tanzimat dönemine kadar şeriat kuralları, örf ve padişah fermanlarıyla yönetilen birinci dönem ile Tanzimat'tan Cumhuriyet'in ilanına kadar ki şer'iyye ve nizâmiye mahkemeleri şeklinde karma hukuk sisteminin hâkim olduğu ikinci dönem. Osmanlı hâkimiyeti sonrasında Filistin topraklarının tamamında belli bir süre aile hukuku alanında Osmanlı Hukûk-ı Âile Kararnâmesi yürürlükte kalmıştır. İngilizlerin bölgeyi işgal etmesi ve akabinde dünyanın farklı coğrafyalarından getirilen yahudilerin bölgeye yerleştirilmesiyle beraber 1947 yılında İsrail Devleti kurulmuş, bunun sonucunda Filistin halkının genel hukuk sisteminde de değişikler olmuştur. Ancak aile hukuku alanında geçmişten gelen şer'î uygulamalarının sınırlı sayıda maddeleri hariç geri kalanında herhangi bir değişikliğe gidilmemiştir. Günümüz Filistin topraklarında üç ayrı aile kanunu mevcut olup bölgede yaşayan müslümanlar, yaşadığı bölgeye göre ayrı şer'î aile hukukuna tâbidir. Batı Şeria bölgesinde 1976 tarihli“Kânûnu'l-ahvâli'ş-şahsiyye”, Gazze bölgesinde Mısır“Kânûnu hûkûki'l-aile”yürürlüktedir. Bölgenin geri kalan kısmında ise İsrail yasalarına ters düşmediği sürece Osmanlı Hukûk-ı Âile Kararnâmesi ile Muhammed Kadri Paşa'nın“el-Ahkâmu'ş-şer'iyye fi'l-ahvâli'ş-şahsiyye”adlı eseri şer'î mahkemeler tarafından uygulanmaktadır."
