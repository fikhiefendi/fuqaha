abstract: "iÖZETİSLAM HUKUKU KAYNAKLARINDA EVLİLİKTE DENKLİK MESELESİ VEGÜNÜMÜZ TÜRK TOPLUMUNDAKİ YANSIMASILatife ÇAKIRYüksek Lisans Tezi, Temel İslam Bilimleri Anabilim DalıDanışman : Prof. Dr. Nasi ASLANKasım 2006, 102 sayfaBu araştırmada İslam Hukuku'nda yer bulan denklik, özel terimiyle ?kefâet? vegünümüz Türk toplumundaki yansımaları, yani bu toplumda eş seçiminde denkliğeçalışılmıştır. Çalışmada, İslam Hukuku'nda denklikverilen önem araştırılmayakavramının ne anlam ifade ettiği, İslam hukukçularının ve mezheplerin denkliğeyaklaşımının yanı sıra günümüz toplumunda evlilik, eş seçimi ve aile konularına dakuramsal olarak yer verilmiş olmakla birlikte, yapılan anket çalışmasıyla günümüzbayanlarının denkliğe yaklaşımlarının ne yönde olduğu tespit edilmeye çalışılmıştır.Erkeğin, soy, İslam'a giriş, dindarlık, meslek, hürriyet, mal ve fizikû-ruhûkusurlardan uzak olması gibi hususlarda evleneceği kadınla eşit veya ondan daha üstünolması gerektiğini ifade eden ?kefâet?, İslam hukukçularının çoğunluğunca kabul edilenve kadının menfaatini koruma amacıyla oluşturulan bir unsur olarakdeğerlendirilmektedir. Bu doğrultuda denkliğin olmaması halinde kadına veya velûlerinenikahı feshetme hakkının da verilmiş olduğu görülmektedir.Günümüz kadınının (küçük bir örneklem de olsa) denklik unsurlarına önemverme düzeyleri ve değişen şartlarla birlikte denklik ile ilgili yeni şartlar öngörüpöngermedikleri, denk olmamaktan ötürü eşleriyle problem yaşayıp yaşamadıkları vegünümüzde denkliğin aranılıp aranılmaması ile ilgili düşünceleri de araştırmada tespitedilmeye çalışılan diğer bir husustur."
