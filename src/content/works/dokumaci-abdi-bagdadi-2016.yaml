abstract: "İbn Abdilhak el-Bağdadi'nin Usul Anlayışı adlı tezimizde, dört mezhep üzerine eğitim veren Mustansıriye medresesinde, Hanbeli mezhebi üzerine fıkıh usulü ve fıkıh dersleri vermiş olan Safiyyuddin Abdulmü'min İbn Abdilhak el-Bağdâdî'nin telif etmiş olduğu Kavaidu'l Usûl ve Meâkidu'l Fusûl adlı eseri çerçevesinde fıkıh usulü'ne dair görüşlerini tespit etmeye çalıştık. Çalışmamızı giriş ve dört bölümden oluşturduk. Giriş kısmında araştırmanın önemi, araştırma yöntemi ve araştırmanın sınırlarını açıkladık. Birinci bölümde ibn Abdilhak el-Bağdâdî'nin hayatı, hocaları, talebeleri ve eserlerini anlattıktan sonra tezimizin konusu olan Kavaidu'l Usûl ve Meâkidu'l Fusûl'ün el yazma nüshası ve bugüne kadar yapılan baskılarından söz ettik. İkinci bölümde hükümler ve delilleri, üçüncü bölümde fıkıh usulündeki lafzi konuları, müellifin işlediği sıraya göre ele aldık. Müellifin bu konularla ilgili tanımını verdikten sonra gerek kendi mezhebinden gerekse de diğer mezheplerden olan fıkıh usulü alanında eser vermiş alimlerin görüşleri ile karşılaştırarak zaman zaman değerlendirmelerde bulunduk. Dördüncü bölümde ise müellifin fıkıh usulüne dair öne çıkan yönlerini, kendi mezhebinden ve mütekelliminden olan diğer usûlcülere muhalefet ettiği hususlar ve fukaha yöntemi ile müttefik olduğu hususlar olmak üzere iki başlık altında, maddeler halinde verdik."
