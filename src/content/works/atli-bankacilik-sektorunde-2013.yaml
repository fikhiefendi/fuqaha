abstract: "Son yıllarda bilgi ve iletişim teknolojilerinde yaşanan hızlı değişmeler ekonomik, toplumsal ve siyasal doğrultuda çok boyutlu değişim-dönüşüm sürecini başlatmış, toplumların tüm kesimlerinde, bilgisayar kullanımı çağın gereği olduğunu ortaya çıkarmaktadır. Küreselleşen ekonomilerde, rekabet üstünlüğü ve toplumsal refahın sağlanmasında elektronik ticaret ve elektronik pazarlama stratejik bir önem kazanmıştır.Hem ulusal hem de uluslararası forumlarda en çok tartışılan konuların başında elektronik ticaret kavramı gelmektedir. Bilgi ve iletişim teknolojilerinde yaşanan değişim ve küreselleşme akımları, daha önce öngörülmeyen imkânlar sunması bu kavramın gelişmesinin önemli nedenlerindendir. Gelecekte ancak bilgi toplumu haline gelmeyi başarabilmiş ülkelerin küresel süreçte söz ve karar sahibi olabileceği, dolayısıyla elektronik ticaretin üstünlük sağlayacağı ve refah toplumu olmaya devam edeceği ileri sürülmektedir. Dünyanın gelişmiş ekonomilerinin son yıllarda beklentilerin üzerinde büyüme gerçekleştirmesinin arkasında yatan temel etkenlerden bazıları; ekonomilerin bilgi ve iletişim teknolojilerinde ulaştıkları seviye, bilgisayarın birçok sektörde yaygın kullanılmasıdır.Bu sektörlerin başında bankacılık sektörü gelmektedir. Sektör yapısı itibariyle elektronik kanalların kullanımı hem bankanın hem de müşterinin lehine maksimum düzeyde fayda yaratması yadsınamaz bir gerçektir. Ülkelerin ekonomik ve sosyal gelişmeleri ile doğrudan ilgili olan ve teknolojik gelişmeleri en yakınında olan bankacılık sektörün bu gelişim ve değişimlere hızla ayak uydurma zorunluluğu vardır. Orta çağ İtalya?sında Sokak köşelerinde, seyyar tezgahlarda para değiştiriliciliği ile başlayan bankacılık küreselleşme ve Dünya ticaret hacminin genişlemesi ile ülke sınırları dışına taşarak farklı bankacılık kavramlarının ortaya çıkmasına neden olmuştur. Yeni çağda seyyar tezgahlardan çıkarak ticaretin yoğun olduğu bölgelerde şubeler aracılığı ile müşterilerine hizmet götüren bankacılık sektörü 1980?lerden sonra teknolojinin hızla gelişmesine bağlı olarak bankaların faaliyetlerini gelişen teknolojilerdeki elektronik kanallara taşımasına neden olmuştur.Çalışmamız dört bölümden oluşmaktadır, birinci bölümde; internetin tanımı, elektronik ticaretin tanımı, gelişimi, Dünya?da ve Türkiye?deki yeri konuları kavramsal boyutta açıklanmaya çalışılmıştır. İkinci bölümde ise E-pazarlama, E- pazarlama yöntemleri, E-Pazarlamanın ekonomilere etkisi ve E-pazarlama uygulamaları konuları açıklanmış, üçüncü bölümde bankacılık tanımı, banka türleri, bankalarda elektronik pazarlama kanalları, bankalarda elektronik pazarlama karması elemanları incelenmiş, son bölümde genel olarak uygulama kısmını oluşturmaktadır."
