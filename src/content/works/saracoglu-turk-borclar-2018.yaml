abstract: "Yapı malikinin sorumluluğu, 6098 Sayılı Türk Borçlar Kanunu'nun 69. maddesinde düzenlenmiş bulunmaktadır. TBK m. 69 hükmünde bina ve yapı eserlerinin neden olduğu zararlara ilişkin intifa ve oturma hakkı sahipleri için de sorumluluk getirilmiş ne var ki madde başlığı yapı malikinin sorumluluğu olarak belirlenmiştir. Her ne kadar konunun sınırlarını çizmekte yetersiz kalsa da kanun koyucunun terminolojik tercihine sadık kalmak amacıyla bu çalışmada da“yapı malikinin sorumluluğu”terimi tercih edilmiştir. Yapı malikinin sorumluluğu, kusura dayalı olmayan bir sorumluluktur. Kanun koyucu tarafından kusursuz sorumluluk türlerinden özen sorumluluğunun alt başlıkları arasında düzenlenmiştir. Ancak doktrinde bu sorumluluğun türü ve dayandığı esas/esaslar hususunda farklı görüşler mevcuttur. Bu itibarla çalışmamızın ilk bölümünde, yapı malikinin sorumluluğunun hukuki nitelendirmesi yapılmıştır. Hukuki nitelendirmenin yanında yine sorumluluğun hukuk düzenindeki yerini saptamak amacıyla tarihsel gelişim, ekonomik analiz ve benzer sorumluluklardan farklara da yer verilmiştir. Yapı malikinin sorumluluğunun doğabilmesi için sorumluluğa has birtakım özel şartlar ile haksız fiil sorumluluğunun genel şartları olarak zarar ve nedensellik bağından söz etmek gerekir. Çalışmamızın ikinci bölümünde bu unsurlar detaylı bir biçimde açıklanmıştır. Son bölümde ise yapı malikinin sorumluluğunun sonuçları ele alınmıştır."
