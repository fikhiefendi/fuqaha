abstract: "Bu çalışma, sosyal bir olgu olarak vergi adaletini anlamaya ve erken dönem İslâm vergi sisteminde uygulanan vergilerin çağdaş toplumların vergi adaleti ihtiyacını karşılayıp karşılamadığını tespit etmeye yöneliktir. Çalışma giriş, sonuç ve dört bölümden müteşekkildir. Birinci bölümde çalışmanın amacı ve önemi, kapsam ve sınırlılıkları ile tezin ana çerçevesini oluşturan sosyal bir olgu olarak vergi adaleti ve verginin sosyal fonksiyonu tartışılmıştır. İkinci bölümde, katılımcı demokratik toplumların doğrudan ya da dolaylı olarak belirlediği ve vergi konunlarında tezahür eden, maliye bilim insanları tarafından teorileştirilen, çağdaş vergi adaleti teorileri yer almaktadır. Üçüncü bölümde İslâm vergi sistemi içerisinde yer alan vergilerin uygulanacağı coğrafî bölgenin tespiti ve bu vergilerin tahsil edileceği vergi mükelleflerinin tam olarak anlaşılması için İslâm'da ülkelerin ve kişilerin sınıflandırılmasına yer verilmiştir. Dördüncü bölümde ise erken dönem islam toplumunda uygulanan vergilerin günümüz modern toplumların vergi adaleti bekletisine ne denli cevap verebileceği çağdaş vergi adaleti teorileri çerçevesinde değerlendirilmiştir. Sonuç olarak, yapılan karşılaştırmalar neticesinde edinilen nihâî bulgulara geniş bir şeklide yer verilerek tarışılmış, erken dönem İslâm vergi sisteminde uygulanan vergilerin günümüz vergi adaleti anlayışına geniş ölçüde cevap verdiği tespit edilmiştir."
