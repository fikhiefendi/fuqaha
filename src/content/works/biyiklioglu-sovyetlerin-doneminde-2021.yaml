abstract: "Sovyet Müslümanlarının Dinî İdaresi tarafından Ufa'da yayınlanan İslam Mecellesi dergisi (1924-1928), hem yayımlandığı dönem hem de Sovyet hükûmeti ile Müslüman halk arasında bir köprü vazifesi görmesi açısından önemli bir kaynaktır ve derginin tamamını kapsayan yerli veya yabancı bir çalışma mevcut değildir. Çalışmamızın esasını teşkil eden bu dergi, Sovyetler Birliği'nin henüz başında, geçiş dönemi denilebilecek bir zaman aralığında yayımlanmıştır. Ana kadrosunda Tatar-Başkurt ulemasının önde gelen isimlerinin bulunduğu dergide; İslam dininin zamanevî yorumu, kadın hakları, dinî eğitim, Sovyet hükûmetinin dine ve din adamlarına ilişkin duyuruları, vaaz metinleri, çağdaş İslam Dünyası'nın sorunları ve bazı dinî meseleler işlenmiştir. Dergi, Bolşeviklerin İslam'a dair siyasetlerini ve Sovyet Müslümanlarının ve ulemanın bu dönemdeki hayatta kalma mücadelesini yansıtması bakımından önemlidir. Bu çalışmada, dergideki bütün yazılar analiz edilip analitik özetleri yapıldı. Dergi yazarlarının biyografileri ile fikirleri, yaklaşımları tespit edilmeye çalışıldı. Dergideki yazıların içerikleri tahlil edilerek, derginin çıktığı süre içinde Tatar-Başkurt ulemasının durumu, fikirleri, Sovyet hükûmetiyle uzlaşma çabalarının ortaya konulması amaçlandı. Bu çalışmada görüldü ki Sovyetler bu geçiş dönemi zarfında Müslümanlara karşı geçici bazı tavizler vermiş (bu derginin çıkabilmesi de buna dâhildir), Sovyet sistemini yerleştirmek için tedricî bir yol izlemiş fakat 1928 yılı başında dergi âni bir şekilde sonlandırılmış ve hükûmet (diğer Müslüman halklara uyguladığı siyasetle paralel olarak) bu tarihten itibaren Müslümanlara karşı sert bir siyaset takip etmiştir."
