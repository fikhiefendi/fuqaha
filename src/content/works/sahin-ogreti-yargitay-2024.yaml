abstract: "Bu çalışma, İslam hukuku kökenli bir kavram olan mehir sözleşmesinin Türk Medeni Hukuku çerçevesinde hukuki niteliğini analiz etmeyi amaçlamaktadır. Mehir, evlilik akdi sırasında kocanın karısına verdiği veya vermeyi taahhüt ettiği belirli bir miktar para veya mal olup, Kur'an tarafından zorunlu kılınmıştır ve kadınlara ekonomik güvence sağlamak ve boşanmayı zorlaştırmak amacıyla uygulanmaktadır. Ancak, Türk Medeni Kanunu'nda mehir ile ilgili açık hükümlerin yer almaması, mehir sözleşmelerine ilişkin uyuşmazlıklarda farklı yargı yorumlarına ve kararlara yol açmaktadır. Bu çalışma, mehir sözleşmelerinin hukuki durumunu anlamak için doktrinsel görüşler ve Yargıtay kararlarını incelemektedir. Araştırma, mehir sözleşmelerinin aile hukuku mu yoksa borçlar hukuku kapsamında bir yükümlülük mü olduğu konusuna odaklanmaktadır. Bu perspektifleri keşfederek, çalışmanın amacı, mehir sözleşmelerinin hukuki statüsünü netleştirmek ve ilgili uyuşmazlıkların tutarlı bir şekilde çözülmesine yönelik öneriler sunmaktır. Bu analiz, sadece hukuk uygulayıcıları için değil, aynı zamanda mehir sözleşmelerinin modern hukuk sistemleri çerçevesinde kadın haklarını koruma ve ekonomik güvence sağlama amacına hizmet etmesini sağlamak için de kritik öneme sahiptir."
