abstract: "Osmanlıda müderrislik, kadılık, kazaskerlik ve Şeyhülislâmlık gibi ilmiye sınıfının tüm kademelerinde görev yapmış olan Şeyhülislâm Ankaravî Mehmed Emin Efendi'nin doğduğu şehir olan Ankara'da tesis ettiği vakfın, sosyal ve ekonomik yönden toplum hayatına katkısını ortaya koymaya çalıştık. Çalışmada ana kaynak olarak Şeyhülislâm Ankravî Mehmed Emin Efendi Vakfiyesi, Ankara Şer'iyye Sicilleri, Ankara Hurûfât Defterleri ile arşiv belgeleri kullanılmıştır. Genel kabuller çerçevesinde Ankaravî Vakfiyesi ve Ankara Şer'iyye Sicilleri ile Hurûfât Defterleri'nin çalışmamıza konu olan kısımları transkribe edilmiştir. Ayrıca, Vakfın kuruluşundan Cumhuriyet dönemine kadar geçen süreçte vakıf belgeleri incelenerek, vakfın yaklaşık 237 yıllık geçmişi değerlendirilmeye çalışılmıştır. Tez; giriş, dört bölüm ve sonuçtan oluşmaktadır. Girişte yapılan araştırmalar ve tez hakkında ve Osmanlı Duraklama Dönemi siyasî, ilmiye sınıfı, Vakıf müessesesi ile Ankara siyasî durumu hakkında bilgi verilmektedir. Birinci bölümde Şeyhülislâm Ankaravî Mehmed Emin Efendi'nin hayatı, eserleri, ilmî kişiliğinden bahsedilmektedir. İkinci bölümde Ankâravi Vakfiyesi, üçüncü bölümde vakfın kuruluşu ve kurumları, dördüncü bölümde vakfın yönetim ve denetimi, gelir kaynakları ve giderleri ile günümüzdeki durumu incelenmektedir. Sonuçta ise genel değerlendirme yer almaktadır."
