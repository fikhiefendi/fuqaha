abstract: "Osmanlı'nın son dönemlerinde tedvin edilen Mecelle-i Ahkâm-ı Adliyye isimli hukuk kitabının büyük bölümü muâmelat bahisleriyle alakalıdır. Bunlardan bir tanesi de Hanefi mezhebinde teorisi gelişen bey' bi'l-vefâ akdidir. Son dönem hukukçularından Mehmed Said Bey Ahkâmu'l-bey' bi'l-vefâ risalesinde Mecelle'de zikredilen bey' bi'l-vefâ maddeleri arasında bir çelişki olduğunu belirtir. Bu maddeleri Hanefi mezhebi etrafında değerlendirerek açıklar ve hukuki neticesine dair bir görüş tercihinde bulunur. Bu çalışmada bir çeşit Mecelle eleştirisi olarak değerlendirilen söz konusu risale o dönemde kaleme alınmış Mecelle'ye yönelik eleştiri ve tadiller kapsamında incelenmiştir. Ayrıca Hanefi mezhebinde teşekkül eden bey' bi'l-vefâ akdinin teorisine dair genel bir bilgi sunulmuş ve akdin hukuki niteliği hakkında iddia edilen görüşler değerlendirilmiştir. Son olarak ise, Ahkâmu'l-bey' bi'l-vefâ risalesi müellifin eseri kaleme alış gerekçesi, yapısı, kaynaklar vd. birtakım başlıklar altında analiz edilerek esere dair genel bir bilgi sunulmuştur."
