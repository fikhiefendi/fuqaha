abstract: "Çalışma, giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümü, Taberî'nin hayatı, ilmi kişiliği ve eserleri ile tefsir anlayışı ve“Câmiu'l-beyan an te'vili âyi'l-Kur'an”adlı tefsirinin genel özelliklerini içermektedir. Birinci bölüm çalışmanın konusu olan mezkûr tefsirde ibadetler, aile hukuku, muâmelat, suç ve cezalar, savaşa dair meseleler ve haram ve helaller başlıkları altında ahkâm ayetlerine yaklaşımları ve müellifin görüşlerini ihtiva etmektedir. Ayrıca bu bölümde müellifin görüşleri, mezhep imamlarının görüşleriyle mukayese edilmiş ve bölüm sonuna bu mukayesenin sonucunu yansıtan ve uyum oranını ortaya koyan tablo eklenmiştir. İkinci bölüm ise Taberî'nin ahkâm ayetlerinin tefsirinde benimsemiş olduğu görüşlerin tercih sebeplerini içermektedir. Geçmişten günümüze büyük ilgi görmüş olan Câmiu'l-beyan adlı bu tefsir hem rivayet hem de dirayet yönüne sahip güzide bir eserdir. Eserin müellifi Taberî, tefsir, fıkıh, tarih ve hadis gibi ilim dallarında söz sahibi olan ender âlimlerden biridir. Kendi adına nisbet edilen bir mezhebin de kurucusu olarak kabul edilen Taberî'nin, ahkâm ayetlerini yorumlama biçimi ve gözettiği kriterler önem arz etmektedir. Müellifin tefsirinde ahkâm ayetlerine bir fakihten ziyade bir müfessir olarak yaklaştığı görülmektedir. Zira ahkâm ayetlerine yaklaşım ve açıklama tarzının, eserin bütünlüğünden farklılık göstermediği anlaşılmaktadır. Zira diğer ayetlerin yorumunda olduğu gibi ahkâm ayetlerinin izahında da Hz. Peygamber, sahâbe ve tâbiûn'dan bolca rivayetlere yer vermekte ve kendi tercihlerini ortaya koymaktadır. Mezhep sahibi İmâmların görüşlerine ise yok denecek kadar az atıfta bulunduğu ve ayetlerde değinilmeyen fıkhî konulara başka kitaplarına atıfta bulunarak tefsirinde yer vermediği de müşahede edilmektedir. Taberî'nin tercihlerinde ayetin zâhiri, umum ve mutlak oluşu, Rasûlüllah'tan gelen sahih haber, ümmetin icmâsı, Kur'an ve ayet bütünlüğü, Arapların kullanımı gibi sebepler belirleyici olmaktadır. Tefsirinde fıkhî görüşlerini ortaya koyarken herhangi bir mezhebe bağlılı gündeme getirmeyen Taberî'nin görüşlerinin büyük bir kısmının, Hanefî mezhebinden ziyade eskiden müntesibi olduğu Şafiî mezhebine muvafık olduğu söylenebilir."
