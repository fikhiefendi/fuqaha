abstract: "Çalışma, sözleşmelerin arasındaki farklılıkların beyan edilmesini ve hükümlerin açıklamasını ile birlikte askıya alınması, eklenmesi ve devam ettirmesi üzere zamanlama yapılmasını amaçlanmaktadır. Çalışma Tümevarımcı, tanımlayıcı ve analitik yaklaşımı takip etmiştir. Çalışma sonuçları Fakihlerin yorum ek hüküm sözleşme zamanı ilgili mutlak bir yasaklama yada mutlak caiz görmedi aksine şeriat delillerine istinaden belirli koşullar gösterdi buna göre her sözleşmenin farklı bir hükümü vardır Genel görüş mülkiyet sözleşmelerin askıya alınması yada eklenmesini caiz olmadığını söyledi, ancak koşullu sağladığı durumda bazı sözleşmeleri istisna ettiler örneğin kefalet sözleşmesi. Sözleşmelerin zamanlaması konusuna gelince Fâkihlerin zamanın bir parçası olan sözleşmelerin zamanlama yapılmasını koşul koydular kira sözleşmesi gibi ancak mülkiyetten çıkmalı olan sözleşmelerin zamanlaması kesinlikle Kabul edilmemektedir bunun nedeni mülkiyetin sonsuz ve devamlı satış sözleşmeleri gibi, bazı sözleşlemeler ise hem geçişi hemde mutlak olabil vekâlet sözleşmeleri gibi bunu ilgili fakihlerin hükümleri vardır"
