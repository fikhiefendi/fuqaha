abstract: "Bu yüksek lisans tezi, Sovyetler Birliği'nin dağılmasından (1991) günümüze uzanan süreçte Kazakistan'daki dinî alanın yeniden yapılanışını tarihsel ve sosyolojik bir bakış açısıyla ele almaktadır. Çalışma, 8. yüzyıldan itibaren kök salan HanefîMâtürîdî geleneğini; günümüzde Selefî, Diyobendî, Tebliğ, Nurcu, Gülen, Süleymancı ve Kurancı çizgiler gibi çağdaş akımlarla karşılaştırmalı biçimde inceleyerek süreklilik ve kırılma noktalarını ortaya koyar. Tezin temel amacı, bu akımların ortaya çıkış nedenlerini, yayılma stratejilerini ve Kazak toplumunun dinî kimliği üzerindeki etkilerini analiz etmektir. Ayrıca devletin“güvenlik-hoşgörü dengesi”ne dayalı politikalarının dinî çoğulculuğa yansımaları değerlendirilir. Din sosyolojisi, dinî modernleşme ve radikalizm literatüründen yararlanılarak çok katmanlı bir kuramsal çerçeve kurulmuştur. Çalışmada nitel araştırma yöntemleri kullanılmış; kapsamlı literatür taraması, resmî doküman incelemesi, sınırlı yarı-yapılandırılmış mülakatlar ve içerik analizi bir arada yürütülmüştür. Böylece Selefî-Vehhâbî ideolojilerin yükselişi, YesevîNakşibendî tasavvufî mirasın dönüşümü ve Türkiye menşeli cemaatlerin eğitim temelli faaliyetleri bütüncül bir çatı altında değerlendirilmiştir. Sonuç olarak tez, Kazakistan'daki din-devlet-toplum ilişkilerini güncel veriler ışığında yeniden yorumlayarak radikalizmle mücadele, geleneksel tasavvufun korunması ve dinî çoğulculuğun kurumsallaştırılması konularında literatüre ve politika yapıcılarına yönelik kapsamlı bir değerlendirme sunmaktadır."
