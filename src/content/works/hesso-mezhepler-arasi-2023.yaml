abstract: "Bilimsel bir disiplin olan İslam hukukunun, sistem ve amacına uygun olarak işlevsel olması, bilimsel ilkelere bağlı olmasını gerektirir. Bunun için bütün fıkhı çalışmalarda hukuk bilim ilişkisinin doğru şekilde kurgulanması önemlidir. Bilimsel ölçülere göre bütün fıkhı çalışmalar sistem bütünlüğü ve yöntemsel tutarlılık çerçevesinde ele alınmalıdır. Bu açıdan hukuki çalışmalarda ele alınan bir konunun tek başına değerlendirilmesi eksik ve yanlış olur. Onun için ele alınan bir konu ilgili kavramlarla birlikte değerlendirilmelidir. İslam hukukunun dinamik dönemlerinde her müçtehit akabinde de her mezhep kendi sistem bütünlüğü ve yöntemsel tutarlılık içerisinde fıkhı üretme başarısını ve sürekliliğini göstermiştir. Bu dinamizm kaybolunca mezheplerin sistem bütünlükleri dikkate alınmadan, gelenekte olmayan bir takım yeni hüküm üretme mekanizmaları devreye girmiştir. Bu yeni mekanizmalar üzerinde de bir birliktelik sağlanamamıştır. Bu hukuk üretim yollarından birisi daha önce üretilen fıkhı hükümlerin üretildikleri zaman dikkate alınmadan yeni meselelerin çözümü için kullanılma şekli olan telfik anlayışıdır. Bu anlayış hem fıkhı üretiminin ileriye dönük değil geriye dönük çözümlere müracaat etmesi hem de mezheplerin sistem bütünlüklerinin ve yöntemsel tutarlılıklarının ortadan kalkması sonucunu doğurmuştur."
