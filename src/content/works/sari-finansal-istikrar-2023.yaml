abstract: "Bilindiği üzere, katılım bankaları faizsizlik prensibini esas almakta ve hem kullandıkları finansal araçlar hem de izledikleri bankacılık yöntemleri açısından geleneksel bankacılık sisteminden ayrılmaktadırlar. Faizsizlik bankacılık sisteminin mevcut olduğu ülkelerin birçoğunda geleneksel bankalar ile birlikte faaliyet sürdürdüğü görülmektedir. Dolayısıyla söz konusu ülkelerdeki mevcut bankacılık sistemi ikili bir yapı göstermekte bu durum ise finansal istikrarın sağlanmasına yönelik olarak yapılan finansal regülasyon politikalarına yönelik tartışmaları beraberinde getirmektedir. Bu doğrultuda çalışmanın temel hareket noktası, katılım bankaları ile geleneksel bankaların birlikte yer aldığı Türk Bankacılık Sistemi'nde ki işleyişin, finansal istikrar ve finansal regülasyon kavramları bağlamında incelenerek, mevcut yapı içerisinde eksiklikler olup olmadığının saptanması ve elde edilen çıktılar doğrultusunda politika önerilerinde bulunulmasıdır. Araştırmada, Türkiye'de faaliyette bulunan katılım bankaları ve geleneksel bankalara ait verilerden (2010Ç2-2022Ç3) hareket edilerek, çalışmaya dâhil edilen bankaların finansal istikrarı ile finansal regülasyonu arasındaki ilişkinin saptanması amaçlanmaktadır. Bu doğrultuda, bankacılık sektörünün finansal istikrarı için Z-Skoru hesaplanacak, finansal regülasyon değişkenleri olarak ise aktif kalitesi, sermaye yeterlilik standart rasyosu, kaldıraç ve yabancı net pozisyon oranı kullanılcaktır. Araştırmada ampirik method olarak temel alınan analiz ARDL'dir. Bu bağlamda teste yönelik tüm öncül testlere araştırmada yer verilmektedir."
