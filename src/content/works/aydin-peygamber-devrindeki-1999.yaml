abstract: "Günümüzde tüzelkişilerin gelişmesine paralel olarak tüzelkişilik hukuku da gelişmiştir. Tüzelkişiler her zaman var olmuşlardır. Ancak bunlarla ilgili gelişmiş hukuki düzenlemelerin tarihi yeni sayılır. Gerçek kişilerin bir gayeyi gerçekleştirmek için bir araya gelerek veya bir gayeye mal tahsis ederek veyahut da kamu otoritesinin kanun çıkararak kurmasıyla oluşan, bir görüşe göre farazî, diğer bir görüşe, göre de sosyal bir varlık olarak ortaya çıkan oluşumlara hukuk düzeni kişilik tanımıştır. Dolayısıyla gerçek kişiler gibi hak ve fiil ehliyetlerine sahip kabul edilmişlerdir. Her devirde var olduğuna inandığımız bu oluşumların, dünyaya yeni bir düzen getiren Peygamberimiz (s.a.v.) in devrinde nasıl tanındığını ve bu oluşumlara ehliyet açısından nasıl yaklaşıldığını, o devri yüksek lisans tezi çerçevesinde inceleyerek tespite çalıştık. Gördük ki, Peygamberimiz (s.a.v.) in doğup büyüdüğü, Peygamberliğini ilan ettiği Mekke'de toplum yapısında kurumlar, mal ve kişi toplulukları önemli bir yer tutmaktadır. Bunların bir çoğu İslami devirde de tanınmıştır. Mesela Mekke ve Kabe idaresiyle ilgili Sikaye; Rifade; Eşnak; Sifare, Nedve, İfade, Hazinü'1-Mal... gibi idari kurumlarla, Hilfu'l-Fudul; Hilfu's-Salah, Hilfıi'l-Mutayyibin... vs. sivil örgütler oluşturulmuş ve kamu oyu bu kurumların varlıklarını ve gayelerini tanımıştır. Ayrıca ticaret hayatı da gelişmiş bulunduğundan bazı şirketlere, mesela mudarabe ortaklığına rastlamıştır. Bunlar kamu oyu nezdinde müstakil birer kişilik olarak algılanmaktadır. Peygamberimiz (s.a.v.) in Medine devrine gelince, orada kurulan devletin yazılı hukuka dayandığını görüyoruz. Değişik ırk ve dinlere mensup insanlar toplanarak anayasa statüsünde bir sözleşme kabul etmişlerdir. Bu sözleşme, hukuki bir metin olarak, devleti meydana getiren grupları bir takım haklar ve mükellefiyetlere ehil kılmıştır. Yine bu sözleşme, askeri, adli, mali vs. kurumların oluşumuna dayanak teşkil etmiştir. Vahyolunan Kur'an ayetleri ve Peygamberimiz (s.a.v.) in uygulamalarının da tüzelkişi benzeri bir çok kurumun meydana getirilmesine, özellikle devlet ve yasama, yürütme ve IXyargı gibi devletin çatısını oluşturan kurumların meydana getirilmesine ve vakıflar gibi bir çok hayır kurumlarının oluşumuna kaynak olmuştur. Ayrıca Beytü'1-Mal ve onun varidatıyla ilgili kurumsal düzenlemeler Kur'an'da görülmektedir. Bazı Kur'an ayetleri, günümüzdeki sivil toplum örgütleri ve derneklerle paralellik arz eden oluşumları teşvik etmektedir. Bütün bu açıklamalardan anlaşılıyor ki, Peygamberimiz (s.a.v.) devrinde gerek toplum örfünde, gerek Medine sözleşmesi gibi bir hukuk metninde ve gerekse Kur'an ve Hadis gibi hukuk kaynaklarında gerçek kişilerden başka farazî bir varlığa sahip oluşumların mevcudiyetini tanıma ve onları zimmete ehil sayma temayülü ve hatta uygulaması vardır. HÜKMİ ŞAHIS, İTİBARİ ŞAHIS, HUKUKİ KİŞİ gibi, bugünkü manada tüzel kişiyi ifade eden tabirler kullanılmamış olsa bile uygulamada kişi olarak görüldükleri söylenebilir. X"
