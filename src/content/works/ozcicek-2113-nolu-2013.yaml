abstract: "Şer`iyye sicilleri, muhteviyat olarak hayli kapsamlı olup Osmanlı Devleti?nin hem mahkeme kayıtlarının hem de merkezin taşra ile yapmış olduğu her türlü yazışma nüshalarının kaydının tutulduğu defterlerdir. Tezimizin konusunu ihtiva eden 2113 Nolu Safranbolu Şer`iyye Sicili Transkripsiyonu H.1218-1222/M.1803-1807 yıllarına ait olup buranın yerel tarihine hayli önemli bilgiler sunmaktadır. Fermân ve buyuruldu sûretleri, ekmek ve et narhı, kasaplık yapma izni, ev satışı, arsa ve dükkân satışı, mülk alım-satımı, miras taksimi, miras davası, bir zimmînin terekesi, boşanma davası, darp davası, safran hırsızlığı, koğuculuk davası, nâmus ve katl davası, gasp ve katl olayı, nâmus ve hırsızlık davası, yağma ve gasp olayı ve bunların araştırılması, haksız kazanç ve zenginlik davası, tarla ihlâli, eşkıya takibi ve âsîlerin dağıtılmasını bahsetmekle birlikte kazalarda yapılan harcamalar, kazalardan alınan vergiler, askerî ihtiyaçlar ve bunun giderilmesi için gönderilen emirler, kazalarda bulunan memurların azli, yeni tayinler ve kendilerine yapılan harcamalar başlıca mevzusu geçen hususlardır."
