abstract: "Bu çalışma, elektronik ticaretin İslam'daki yerini belirleme gayesiyle hazırlanmıştır. Bu bakımdan, öncelikle İslam'da ticaretin ana kurallarına değinilmiş ve bu kurallar elektronik ticaret uygulamaları ile karşılaştırılmaya çalışılmıştır.Çalışma bir giriş, iki bölüm bir sonuçtan oluşmaktadır. Giriş bölümünde; İslam Hukuku açısından akitler, akdin unsurları, akitlerin yapılış şekilleri gibi asıl konuya temel teşkil edecek bilgiler öz olarak verilmiştir.Birinci bölümde; gaipler arasında yapılan akitler, vahiy döneminde gaipler arası akit uygulamaları, gaipler arası akitte icap ve kabulün, akit meclisinin, kabzın, semenin ödenmesinin nasıl olacağı ve elektronik ortamda yapılan uygulamaların bunlarla uyuşup uyuşmadığı anlatılmıştır.İkinci bölümde ; günümüzde elektronik ortamda yapılan akitler, özellikle satım akdi ve sarf akitleri, bunların yapılış şekilleri ve bunların hükümleri ilk iki bölümde verilen bilgiler ışığında değerlendirilmiş ve İslam Hukuku açısından bir sonuca bağlanmaya çalışılmıştır.Anahtar Kelimeler; akit, elektronik, internet, güvenlik."
