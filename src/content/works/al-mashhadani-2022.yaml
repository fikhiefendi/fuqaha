abstract: "İmam Ahmed İbn Abdülcevad el-Kayati'ye ait“Fetava eş-Şeyh Halife es-Sefti”isimli el yazması eser Şafi fıkhında fetvalardan bahseden en geniş kitap ve telifler arasında kabul edilir. Şöyle ki, müellif bu eserden önce telif edilen kitapların çoğundan istifade etmiş bazılarına da itirazlar dile getirmiştir. Müellif fıkhi meselelerin çoğu hakkında konuşmuştur. Kendi hocasının görüşünü dile getirmiş, kaynaklarında, tabi olduğu metoda ve bu bağlamda yer alan şerhlere dayanmıştır. Müellif aynı zamanda ele aldığı mevzuda Hanefilerin görüşlerini aktarmayı da ihmal etmemiştir. Meseleleri Şafi fıkhının baplarına göre kaleme almıştır. Ardından kendi asrında yeni ortaya çıkan kahve, sigara gibi şeyler hakkında konuşmuştur. Biz bu çalışmamızda, eseri ilmi bir şekilde tahkik etmeye çalıştık. Müellif ve hayatı hakkında bir araştırma hazırladık. Burada isminden, nesebinden, ailesinden, hocalarından, ilmi hayatından ve ülkesini savunmada takındığı tutumlardan bahsettik. Keza müellifin hocası Halife es-Sefti'den de kısaca bahsettik. Ardından itimat ettiğimiz nüshayı, el yazmasının ismi ve müellifine nispetinin gerçekliği ve müellifin kaynakları konusunu belirttik. Ayrıca bu çalışmada benimsediğimiz metottan da bahsettik. Son olarak da tezin sonuç kısmında ulaştığımız en önemli sonuçlar ve tavsiyeleri ifade ettik."
