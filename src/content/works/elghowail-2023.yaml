abstract: "Çalışma, gelişimsel projelerin finansmanındaki İslami tahvillerin (sukuk) rolünü ve büyük projelerin finansmanı, istihdam oranlarının artırılması ve ekonomik büyümenin teşvik edilmesi yoluyla Türkiye'nin ekonomik gelişiminde önemli bir rol oynadığını tartışmaktadır. İstanbul tüneli ve havalimanı projeleri gibi birçok gelişimsel proje İslami tahviller kullanılarak Türkiye'de uygulanmıştır. Türk hükümeti, hem kamu hem de özel finansmanda İslami tahvillerin kullanımını teşvik etmek için çalışmaktadır ve ülkede finansal istikrarı iyileştirmeyi ve sürdürülebilir ekonomik büyümeyi sağlamayı hedeflemektedir. İndüktif ve betimsel analitik yöntemlerin kullanıldığı bir veri analizi destekli analitik bir çalışma, finansmanında İslami tahvillerin kullanımını etkileyen faktörleri ve Türkiye'de ekonomik gelişimi teşvik etmedeki rolünü analiz etmek için yapılmıştır. Çalışma, İslami tahvillerin faizden kaçınma ve sözleşmelerde şeffaflık ve adil davranışı teşvik eden kiralama tabanlı model gibi benzersiz özellikleri nedeniyle bankacılık ve sigortacılık sektörleri de dahil olmak üzere çeşitli sektörlerden yatırımları çekme yeteneğine sahip olduğunu ortaya koymaktadır. Çalışma, Türkiye'de İslami tahvillerin kullanımını desteklemek için yasal ve düzenleyici bir çerçeve ile altyapının geliştirilmesini önermektedir. Ayrıca sürdürülebilir ekonomik gelişmeyi sağlamak için İslami tahvillerin gayrimenkul ve altyapı finansmanında kullanılması ve Türk hükümetinin İslami tahvillerin geliştirilmesindeki rolünün artırılması çağrısında bulunmaktadır."
