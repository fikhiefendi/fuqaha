abstract: "Yüce Allah insanoğlunu ahsen-i takvim suretinde yaratıp imtihan için dünyaya göndermiştir. Kendisine halife olarak seçtiği insanı dünyada kendi başına bırakmamış, ebedî mutluluğun yolunu göstermeleri için onlara yine kendi içlerinden elçiler göndermiştir. Tebliğ vazifesini yerine getirirken karşılaştıkları güçlüklere karşı onlara mucizelerle destek sağlamıştır. Son peygamber olarak gönderdiği Hz. Muhammed'e (s.a.s) de sorumlulukları yanında bazı ayrıcalıklar da vermiştir. Bu üstünlük ve faziletlere ait Kur'an'da ve Sünnette pek çok deliller bulunmaktadır. Hz. Peygamber (s.a.s) de hadislerinde, bazı fiillerin sadece kendine mahsus olduğunu bildirmiştir. Hz. Peygamber'e (s.a.s) has olan bu üstünlüklere İslam âlimleri“hasâis”ismini vermişlerdir. Bu üstünlükler hadis, siyer ve şemâil kitaplarında ayrıntılı olarak anlatılmıştır. Bu çalışmamızda önemli İslam fıkıh kaynaklarından olan ve ahkâm âyetlerinde referans gösterilen Ebu Bekir Ahmed b. Ali er-Râzî el-Cessâs'ın Ahkâmu'l-Kur'an tefsirindeki Hasâisu'n-Nebî ile ilgili âyetleri tespit ettik. Bu tespit ettiğimiz âyetleri diğer müfessirlerin yorumlarıyla mukayese yaparak Hz. Muhammed'e (s.a.s) özel olan bu hükümlerin hikmetini belirledik. Tezimizde Ebû Bekir el-Cessâs'ın Ahkâmu'l-Kur'an özelinde Hz. Peygamber'e (s.a.s) özgü hüküm içeren âyetlerin mukayeseli değerlendirmesi ele alındı. Üç ana bölüm olarak hazırladığımız tezimizin birinci bölümünde Cessâs'ın hayatı, yaşadığı dönem, şahsiyeti, ilmî kişiliği, hocaları, öğrencileri ve eserleri hakkında bilgi verildi. Tezimizin ana konusunu oluşturan Ahkâmu'l-Kur'an isimli eserin özelliklerinden, kaynaklarından, âyetleri tefsir ederken Cessâs'ın izlediği yoldan bahsedildi. İkinci bölümde hasâisle ilgili bilgi verildi. Hasâisle yakın ilgisi olan delâil, fezâil, mu'cizât ve şemâil kavramları açıklandı. Hasâisin ortaya çıkışı, hasâisle ilgili eserlerden bahsedilerek hasâis müelliflerince gruplandırılan Hz. Peygamber'e (s.a.s) has olan İlahî hükümlere yer verildi. Tezimizin esas kısmını teşkil eden üçüncü bölümde ise, Hz. Peygamber'e (s.a.s) has kılınan âyetlerden Cessâs'ın Ahkâmu'l-Kur'an tefsirine aldığı âyetler tespit edilerek sadece bu âyetler tefsir edildi. Hz. Peygamber'in (s.a.s) hilm sahibi insanlarla meşveret etmesi, Hz. Peygamber (s.a.s) içlerindeyken bir topluluğa azap edilmemesi, ganimetlerin taksimi, teheccüd namazı, Hz. Peygamber'e (s.a.s) saygı gösterilmesi, tahyir, eşlerinin amellerinin iki katıyla karşılık bulacağı, Hz. Peygamber'e (s.a.s) helal kılınan kadınlar, eşleri arasında taksimatta hür olması, başka kadınlarla evlenmesinin yasaklanması, kötülüğü en uygun şekilde bertaraf etmesi konuları önce Cessâs'ın Ahkâmu'l-Kur'an tefsirinden, sonra da diğer tefsir kitaplarından incelendi. Zaman zaman Hz. Peygamber (s.a.s) hakkında yapılan farklı yorumlamalara ve yanlış düşüncelere bu âyetlerle cevap verildi. Hz. Peygamber'in (s.a.s) daha doğru tanınmasına çalışıldı."
