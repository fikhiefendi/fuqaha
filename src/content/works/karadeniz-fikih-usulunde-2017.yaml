abstract: "Teklîfî hüküm çeşitlerinden biri olan haram kavramı kendi içinde lizâtihî ve ligayrihî olmak üzere ikiye ayrılmaktadır. Tezin konusu olan haram ligayrihî kavramının teklîfî hüküm ifade eden bir terim olarak kullanılmaya başlanması usûl literatüründe geç bir döneme rastlamaktadır. Bununla beraber haram ligayrihî kavramı ile ilgili net bir tarif yapılmadığı da altı çizilmesi gereken bir noktadır. Bu çalışmanın birinci bölümünde haram ligayrihî kavramının doğuşu ve gelişimi ile usûl eserlerinde ne şekilde ve hangi yönlerden ele alındığı ortaya konulmuştur. İkinci bölümde ise kavramın tarifinden hareketle usûl eserlerinde bu başlık altında verilen örneklerin gerçekten haram ligayrihî olup olmadığı ve bu örneklerin hukukî sonuçları tespit edilmeye çalışılmıştır. Ayrıca haram ligayrihî ile doğrudan ilintili olan nehiy-fesâd ilişkisi üzerinde durulmuş ve bu bağlamda kavramın hukukî neticesi olarak ifade edilen sıhhat, butlân ve fesâd kavramları irdelenmiştir. Netice itibariyle sonuç bölümünde gerek kavramın tarihi gelişimi gerekse konu ile ilgili ortaya konulan diğer bilgilerden hareketle ulaşılan sonuçlar kaydedilmiştir."
