abstract: "Toplumsal bir varlık olan insanların birbirleriyle ilişkilerinde yaşadığı uyuşmazlıkları çözüme kavuşturmak, tüm hukuk sistemlerinin ilk meselesidir. İnsanlar yaşadıkları hukukî uyuşmazlıkları çözmek için yargı mercileri olan mahkemelere başvurur. Günümüzde mahkeme süreçlerinin ağır işleyişi, sonucun istenilen zamanda elde edilememesi, maliyetli oluşu ve yaşanılan mağduriyetlerin giderilememesi gibi nedenler insanları, mahkemeler haricinde maliyeti yüksek olmayan, kolay ve hızlı çözümler üretebilen alternatif uyuşmazlık yöntemlerine yöneltmektedir. Bahsedilen bu alternatif uyuşmazlık yöntemlerinden bir tanesi de günümüzde onarıcı adalet kavramı çerçevesinde gelişen ve kullanımı günbegün artan arabuluculuk ve uzlaştırma sistemidir. Hukukî anlaşmazlık yaşayan tarafları bir araya getirmek suretiyle tarafların rızaları doğrultusunda kendilerine üçüncü kişilerce verilen tavsiye, telkin ve destekle uyuşmazlığın çözüme kavuşturulduğu bu süreç Osmanlı hukuk sisteminde muslihûn adlı sistemle başarıyla yıllarca faaliyet göstermiştir. Kendine has usul ve yöntemle uyuşmazlık davalarında taraflar arasında barışı tesis edici bir vazife gören muslihûn mekanizması Osmanlı hukukunda birçok davayı sulh ile çözümlemiştir. Osmanlı mahkemelerinde davaları karara bağlayan kadının yanı sıra azımsanamayacak sayıda uyuşmazlığın muslihûn tavassutuyla çözüldüğü, Osmanlı kadı sicilleri belgeleri kayıtlarında mevcuttur. Muslihûn insanlar arasındaki süregelen hukukî sorunları hukûkullah ve ibâdullah dengesini dikkate alarak onarıcı bir çözümle tarafları uzlaşmaya davet eden sulh odaklı bir sistemdir. Osmanlı hukukunda yıllarca uygulanan bu sistemde, davalarda ilgililerin rızası alınarak, düşük maliyetlerle uyuşmazlıklar sulh ile neticelendirilmiştir. İslâm ceza hukuku davalarında incelediğimiz muslihûn, Osmanlı'da anlaşmazlıkların çözümü, uyuşmazlık yaşayan taraflar arasında barışın tesisi gibi işlevleriyle toplumsal barışa giden yolda yüzyıllar boyu aktif görev almıştır. Bunun yanı sıra muslihûn, dava taraflarıyla kurduğu diyaloglar neticesinde tarafların da rızasını alarak adil ve hakkaniyetli neticeler elde etmek suretiyle toplumda adaletin sağlanmasına vesile olmuştur."
