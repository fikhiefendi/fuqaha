abstract: "Elimizdeki eser, İbnü'l-Irâkî'ye ait olup, et-Tevessütu'l-mahmud fi şerhi Ebu Daûd adıyla bilinmektedir. Söz konusu eser, iki ciltten ibarettir ve her ikisi de çok hacimlidir. İkinci cilt (Salat) kısmını içermektedir. İbnü'l-Irâkî şerhinin birinci cildinde Tahâret bölümünden sadece (91) hadisin şerhini yapmıştır. Biz kendisinin ve diğer mühaddislerin değerlendirmelerine başvurarak, şerhe konu olan hadislerden (62)'sinin sahih, (16)'sının hasen, (13)'nün zayıf olduğunu tesbit ettik. İbnü'l-Irâkî'nin şerhte istişhad için kullandığı hadislerin toplam sayısı (359)'dur. Biz istişhad ettiği hadisler içerisinden (178)'inin sahih, (30)'unun hasen, (142)'sinin zayıf ve (9)'unun da mevzu olduğunu tesbit ettik. Eser, Hadis ışığında fıkhi meseleler ve bunlarla alakalı konuları ihtiva etmektedir. Muellif ilk önce hadisin senedini metniyle birlikte zikretmiş daha sonra garib kelimeleri ve diğer hükümleri açıklamış, küçük alt başlıklarda metni parçalayıp şerh ile birleştirmiş ve hadisi genel olak garib kelimelerini açıklarken şerhetmiştir. Şerh esnasında bütün gayretini sarfettiği Hadis, Fıkıh ve dil bilgisi nevinden kapsamlı bilgiler aktardığı görülmektedir. Bunların yanısıra İbnü'l-Iraki, senetlerinde geçen râvilerle ilgili bilgileri, lâkab ve künyelerle kimlerin kastedildiği, hadislerin vürûduna dair bilgileri, luğavi anlamda kelime açıklamaları, irab durumları, nasih, mensuh, te'vili, mezhep görüşleri ve ihtilafları, mekan isimlerinin açıklamaları, senetlerdeki muttasıl veya munkati olmalarından yola çıkarak hadislerin sıhhat ve zaaf durumları gibi, hadisin metin ve isnadla ilgili yardımcı olabilecek her konuyu açıklamıştır. Ayrıca hadislerden fıkhi ve lugavi istinbatlarda bulunmuştur. Elimizdeki bu birinci cildin şerhi yaklaşık İbnü'l-Irâkî'nin (15) senesini almıştır. (19) yaşında iken başlamış ve (34) yaşına kadar sadece elimizdeki birinci cilt üzerinde çalışmıştır. Bu şerh tamamlanmamış bir çalışmadır."
