abstract: "Bu çalışmada Ebussuûd Efendi'nin İrşâdü'l-ʿAkli's-Selîm İlâ Mezâya'l-Kitâbi'l-Kerîm isimli tefsirindeki hadislerin (Fatiha ve Bakara Suresi örneği) tahric ve değerlendirilmesi yapılmıştır. Ebussuûd Efendi yaşadığı dönemde Şeyhülislâmlık yapan, ilmi çalışmalarıyla adından söz ettiren ve fetvaları ile devrine damga vuran büyük bir şahsiyettir. Böyle birisinin yazdığı tefsir de ilim câmiâsında değer ve itibar görmüştür. Bir döneme damgasını vuran bir alim olması ve eserin üzerine herhangi bir tahric çalışması yapılmaması bizi bu çalışmaya sevk etmiştir. Bu sebeple bu eserin Fâtiha ve Bakara Sûresindeki (1. Cildindeki) rivâyetler incelenmiştir. Giriş bölümünde araştırmanın önemi, amacı araştırmada takip edilen metod, Ebussuûd Efendi'nin hayatı, ilmi kişiliği ve eserleri zikredilmiştir. İlk bölümde Fâtiha Sûresinde yer alan rivâyetlerin tahrici, ikinci bölümde Bakara Sûresindeki rivâyetlerin tahrici ve sıhhat değerlendirmesi yapılmıştır. Bölüm sonlarında ise rivâyetlerin kritiği yapılmış Ebussuûd Efendi'nin hadis kullanım metodu üzerinde durulmuştur."
