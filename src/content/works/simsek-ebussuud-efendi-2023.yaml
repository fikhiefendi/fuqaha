title: "Ebussuûd Efendi'nin İrşâdü'l-ʿakli's-Selîm İlâ Mezâya'l-Kitâbi'l-Kerîm İsimli Tefsirindeki Hadislerin Tahric ve Değerlendirilmesi (Fâtiha ve Bakara Sureleri Örneği)"
