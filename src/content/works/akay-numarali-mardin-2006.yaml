abstract: "Ser`iyye sicilleri yerel tarih arastırmalarında son derece önemli yer tutmaktadır. Tez konumuz olan 201 nolu Mardin Ser'iyye Sicili de Mardin'in yerel, sivil, sosyal ve ekonomik yapısını son derece ayrıntılı bir sekilde bizlere ulastıran essiz bir kaynaktır. Tez çalısmamızda öncelikle Mardin sehrinin genel tarih ve cografi özelliklerini ele aldık. Daha sonra sehrin ser'iyye sicilini inceledigimizden dolayı slam hukuku ve Osmanlı devlet geleneginde varolan ser'iyye mahkemelerini ve bu mahkeme kayıtlarının önemi üzerinde durduk. Bir sonraki asamada da 201 nolu Mardin Ser'iyye Sicili'nin metin transkripsiyonunu gerçeklestirdik. Metnin okunmasından ve yazılmasından sonra en önemli kısım olan degerlendirme bölümüne geçtik. Mardin sehrinin yogunluklu olarak 1840- 1850' lı yıllarına denk gelen bu dönemlerinde sehrin mahallelerini, sosyal yapısını, bina ve evlerin sekil ve mimarisini, ekonomik istigal alanlarını, dönemin fiyat listelerini, sehirde yasayan dini grupları ve bunlar arasındaki sosyal münasebetleri, miras ve veraset gibi medeni hukuku olusturan konuları, vergi, iltizam, masraf listeleri gibi yönetim unsurlarını, tereke defterlerini, diyet, nafaka, hapis cezası, ihtida vb. gibi hukuki islemleri söz konusu sicil vasıtasıyla ortaya çıkartabilmekteyiz. Aynı sekilde Mardin ve çevresindeki bölgenin idarecileri ve ileri gelenlerini köy, kasaba, mezra ve asiretlerini defter incelemesinden çıkartabilmekteyiz. 201 nolu Mardin Ser'iyye Sicil defterini konu edinen yüksek lisans tezimizin bölge tarihi arastırmalarına önemli bir katkı saglayacak olmasıyla beraber yeni arastırmalara da vesile olması, çalısmanın neticeye ulasacagının kanıtı olacaktır."
