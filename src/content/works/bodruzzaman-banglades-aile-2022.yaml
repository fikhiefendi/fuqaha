abstract: "İslam hukuku hayatın tamamını kuşatır. Böylece var olan her sorunun bir çözümünün İslam hukukunda olduğu söylenebilir. Bu araştırmada; insan hayatında en önemli yere sahip olan aile le ilgili Bangladeş kanunlarında yapılan hukuki düzenlemeler İslam hukuku açısından incelenmeye çalışılmıştır. Evliliğin temel amacı, hayat boyunca ailenin saadet, mutluluk içinde yaşaması ve neslin devamıdır. Ama farklı sebeplerle de olsa bazı durumlarda koca ve karı arasında sorunlar ortaya çıkar. Bu yüzden boşanma, İslam'da evlilik problemlerinin çözüm yollarından birisi olarak kabul edilmiştir. Bangladeş dünyanın en büyük Müslüman ülkelerinden biri olduğu için, bu ülkenin Müslüman Aile kanunlarının da özellikle İslam Hukukuna uygun olması gerekir. Ancak ne yazık ki, ülkenin Müslüman Aile Kanunlarında akademik olarak ele alınması gereken tartışmalı bazı konular bulunmaktadır. Bu tez çalışmasında, 1872 yılı ile 1961 yılları arasında yürürlüğe konulan kanunlardan oluşan ve bizim“Bangladeş Medenî Kânunu”olarak isimlendirdiğimiz metinlerde nikah ve boşanma ile ilgili meseleleri, boşanma sebepleri gibi konular dört fıkıh mezhebinin görüşleriyle ve bazı modern İslâm devletlerinin yürürlükte olan“ahvâl-i şahsiyye”(Şeriat hukuku) kânunlarıyla mukayeseli olarak ele alınmaya çalışılmıştır. Bu çalışmada boşanma kurumunun tamamını değil onun fıkıh öğretisinde tartışmalı ve buna bağlı olarak ilgili modern İslâm hukuku kânunlaştırmalarında da farklılıklar arzeden yargı yoluyla boşanma sebepleri mukayeseli olarak ele alınmaktadır. Çalışmada aile hukuku ile ilgili hususlar birkaç başlık altında ele alınıp mezheplere göre değerlendirilmiş olup bu tezde bulunanların dışında konumuzla alakalı çalışılabilecek başka alanlar da vardır. Bu sebeple bazı konulara yer verilmeyerek gelecekte bu konuda çalışmak isteyen araştırmacılar için bırakılmıştır. Aslında nikah ve talak konusunda Bangladeş Medeni Kanunu açısından fıkhî-tatbikî çalışmalar olmadığı için kavramlarının halk kesimince iyice ve ayrıntılı olarak anlaşılması mümkün olmamıştır. Bu çalışmayla Bangladeş Medeni Kanununda özellikle Müslüman toplum nezdindeki bazı yanlış anlaşılmalar tespit edilmeye gayret edilmiştir."
