abstract: "Günümüz dünyasında Müslüman nüfusun yaklaşık üçte biri bulundukları ülkelerde azınlık konumundadır. Bu çalışmada İslam hukukuna benzerliği ile bilinen Anglo-Sakson hukuk sistemini benimseyen ülkelerden İngiltere, Amerika Birleşik Devletleri, Kanada ve Avustralya'da yaşayan Müslüman azınlıkların karşılaştıkları hukuki sorunların çözümlenmesinde İslam hukukunu esas almak istemeleri sonucunda yaşanan tartışmalar incelenmiştir. Ayrıca tezde İslam hukuku uygulamalarının \"birden fazla hukuk düzeninin birlikte varlığı\" anlamına gelen çok hukukluluk bağlamında değerlendirilmesi sorusuna da cevap aranmıştır. Anglo-Sakson hukukunda yargı sisteminin yükünü hafifletmek, zamandan ve iktisadî açıdan tasarruf etmek gibi sebeplerle ilk aşamada tahkimin tercih edilmesi, seçili ülkelerde İslam hukukunun uygulanmasını kolaylaştırmaktadır. Dört ülkenin de resmî kanunlarından bazıları İslam hukukuna riayet edilmesine imkân sağlamaktadır. Bu ülkelerde yaşayan Müslüman azınlıklar, hukuki anlaşmazlıklarını kurumlar vasıtasıyla ya da izin verilen ölçüde resmî yargı sisteminde çözmeye çalışmaktadır. Ancak Müslüman azınlıkların resmî yollarla anlaşmazlıklarını çözmeye çalışırken karşılarına çıkan en büyük problem Müslüman olmayan yargıçların velayet yetkisi ve resmî hukuk sistemi çalışanlarının İslam hukukunu yeterince bilmemesidir. Diğer yönden çalışmamızda Müslüman azınlıklara karşı hoşgörülü yaklaşımın arkasında samimi bir insan hakları temelli yaklaşım mı yoksa pragmatik bir yaklaşımla söz konusu devletlerin sadece kendi çıkarlarını koruma amaçlarının mı yer aldığı incelenmiştir."
titleTranslation: {"en": "Debates on Islamic law in countries adopting the Anglo-Saxon legal system in the context of legal pluralism"}
