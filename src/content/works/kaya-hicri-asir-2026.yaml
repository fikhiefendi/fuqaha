abstract: "Bu çalışmada, Hicrî beşinci asrın Hanefî fakihi Saymerî ile Şâfiî fakihi Şîrâzî'nin usûl anlayışları mukayeseli olarak incelenmiştir. Çalışmada her iki müellif arasındaki usûlî ihtilafın sebepleri üzerinde durulmuştur. Mezhep âlimleri, kendi görüşlerinin haklılığını temellendirmek amacıyla hilâf türünde eserler telif etmiş olup, söz konusu eserler metodolojideki ayrışmanın ipuçlarına dair önemli veriler sunmaktadır. Nitekim bir usûl kaidesindeki ihtilafın, fürû-ı fıkıhta onlarca meselenin hükmünü etkileyebildiği görülmektedir. Bu çerçevede ihtilaf ile metodolojik ayrışma arasında umum-husus ilişkisi bulunduğu anlaşılmaktadır. Her ihtilaf usûlde ayrışmaya yol açmayabilir; ancak her usûl ayrışmasının derin ihtilaflara sebep olduğu tespit edilmiştir. Usûl ilminde ihtilafa konu olan meseleler ayrıntılı bir şekilde ele alınarak metodolojik ayrışmaya yol açan saikler incelenmiştir. Bu bağlamda Şîrâzî'nin usûlî görüşleri, usûl ve fürû alanında telif ettiği birçok eser dikkate alınarak tespit edilmiştir. Saymerî'nin kanaatleri ise ilgili alandaki tek eseri olan Mesâʾilü'l-ḫilâf fî uṣûli'l-fıḳh adlı çalışması üzerinden belirlenmiştir. Ayrıca her iki müellifin eserlerinin yanı sıra Hicrî beşinci asrın diğer usûl âlimlerinin görüşlerine de yer verilmiştir. Çalışma üç temel bölümden oluşmaktadır. Birinci bölümde Saymerî ve Şîrâzî'nin hayatları ile kendilerine nisbet edilen eserler ele alınmış; dönemin ilmî ve siyasî arka planına kısaca değinilmiştir. İkinci bölümde usûlî ihtilafın yoğunlaştığı elfâz bahsi kapsamında umum-husus, emir-nehiy, mutlak-mukayyed, müşterek lafız, beyan ve nesih teorileri incelenmiştir. Üçüncü bölümde ise Kur'ân, Sünnet, icmâ, kıyas ve içtihat konuları değerlendirilmiştir."
