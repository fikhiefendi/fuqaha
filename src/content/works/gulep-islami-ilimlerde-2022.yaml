abstract: "Dünyada İslâm ümmeti kadar, Peygamber'inin ağzından dökülen her sözü ve onun sergilemiş olduğu her türlü tutum ve davranışı sonraki nesillere aktaran ve bunu yapabilmek için binlerce ciltlik kitaplarla literatür oluşturan başka bir ümmet olmamıştır. Yapılan bu araştırmada da dinin ana kaynaklarından olan sünnetin temel İslâm bilimleri bağlamındaki tanımlarına ve sünnete yaklaşımlarına yer verilecektir. Bu araştırmanın amacı, her ilmin kendi ihtiyacına binaen ve kendi zaviyesinde sünnet tanımı yaptığını tespit ederek ihtilafların sünnet tanımına yaklaşımlardan kaynaklandığını gösterebilmektir. Çalışmada araştırma yöntemi olarak literatür tarama ve doküman inceleme kullanılmıştır. Her bölümün literatürüne ait eserler incelenmiş gerekli fişlemeler yapılmıştır. Neticesinde bu fişler ilimî disiplin içerisinde bir araya getirilmiş, kompoze edilmiş, sentez ve analizlerde bulunulmuş, bazı değerlendirmeler ve tespitler elde edilmiştir. Araştırma altı bölümden oluşmaktadır. Girişte araştırmanın konusu amacı yöntemi ve kaynakları hakkında bilgiler sunulmuştur. Birinci bölümde sünnet kelimesinin sözlük ve lugat mânaları ile ilk dönemdeki kullanımına, ikinci bölümde hadisçilerin, üçüncü bölümde ise tefsircilerin, sünnet anlayışına yer verilmektedir. Dördüncü bölümde ise fıkıh usulcüleri ile birlikte fıkıhçıların ve fıkhî mezheplerin sünnet anlayışına değinilmiştir. Beşinci bölümde kelâmcıların ve önemli kelâm ekollerinin sünnet yaklaşımları, son bölümde ise mutasavvıfların sünnet telakkileri değerlendirilmiştir. Sonuç bölümünde sünnetin farklı tanımları ortaya konulmuştur."
