abstract: "Bu çalışma, Yemenin İslami bankalarında elektronik bankacılık mekanizmalarının gerçeğini bilmek, ve bu bankalarda elektronik bankacılığın gelişmesi için mekanizmaları, ve Yemenin İslami bankalarında bankacılık gelişimini engelleyen nedenleri ve engelleri öğrenmek, ve e-bankacılığın Şeriate uygun yasal parametreleri açıklamak, ve Yemenin İslami bankalarının sunmakta olduğu elektronik bankacılık hizmetlerine ışık tutmak ve gelişmesi için olanaklar amaçlanmıştır. Bu hedeflere ulaşmak için araştırmacı, edebiyat teorisini ve önceki çalışmaları gözden geçirdi, ana verileri toplamak için iki anket tasarımı hazırladı, birincisi Yemen İslami bankalarının müşterilerine yönelik, (300) adedi dağıtıldı ve geri alınanlardan (230) adedi analiz için uygun görüldü. Böylece anketin (% 77)'si geri alınmış oldu. İkinci anket ise bankalarda çalışanlara yönelikti. (120) adedi dağıtıldı ve bunun (93) adedi analize uygun görüldü. yani (% 77.5)'si geri alınmış oldu. Bu anketlerin ışığında Sosyal ve İnsani Bilimler programının istatistiksel paketi (SPSS16) kullanılarak veri toplaması ve analizlerinin yapılması ve hipotezlerin test edilmesi yapıldı. Ayrıca farklı istatistik yöntemleriyle; çiftler. Yüzdeler, ortalamalar, regresyon analizi, korelasyon ve tek tarafli kontrast hesaplamaları yapıldı. Bu çalışma ile Yemen'de İslami bankalarında, elektronik bankacılığının şimdiki durumunda elektronik bankacılığın avantajları olumlu bir etkisi olduğuna tespit edilmiştir. Ayrıca, orada e-bankacılığın başarısı ile iletişim ve elektriğin altyapısıyle, güvenlik, ve yasal mevzuat faktörleri arasında bir ilişki olduğunu, ve bu imkanları sağlamak için en başta devlet kurumlarının çalışması gerekmektedir. Çünkü genel ekonomi üzerindeki yansıtmaları olumlu bir etkiye sahiptir. Sonuçların analizi ile Yemen İslami bankaları iletişim ve bilgi teknolojisi alanında altyapı sıkıntısı muzdarip olduğunu göstermektedir, ve bu İslami bankalarda vatandaşların çoğu elektronik hizmetlerine isteksiz olmasına neden olmaktadır. Araştırmacı öğrenci, Yemen Merkez Bankasının, elektronik bankacılık mevzuatının gelişmesi için gerekli yasal adımları atması gerektiğini, ve Türk bankacılığından örnek alarak, elektronik bankacılıkta başarılı deneyimleri uygulamak için sistematik olarak çalışmasını önermektedir. Bilindiği gibi bunların bankacılık sektöründe bankacılık risklerinin azaltılmasına etkisi ve Yemen bankacılık sektöründe krizlerin olmasına tesirleri vardır. Bununla birlikte, müşterilerin elektronik bankacılıkta daha geniş bir şekilde yanaşmalarına mani olan engelleri anlamak ve ilgi göstermek gerekmektedir. Bunların yanı sıra müşterilerin mevcut ve gelecekteki ihtiyaçları araştırmak ve bu konuda onların önerilerini ve sorunlarını dinlemek. Araştırmacı Yemen elektronik bankacılık ve uygulanabilirliği konusunda daha fazla araştırmalarının yapılmasını ve elektronik bankacılık alanında Türk deneyiminin ilhamına odaklanması ve Yemende tatbik edilmesinin imkanlarının araştırılmasını tavsiye etmektedir."
