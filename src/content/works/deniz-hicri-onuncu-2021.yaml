abstract: "Bu çalışmamızda hicrî onuncu asırda yaşamış olan beş müfessiri seçip, içerisinde bulundukları dönem, hayatları, tefsir ve diğer alanlara dair yazmış oldukları eserleri ve tefsir metotları incelenmiştir. Dönemin tefsir anlayışı ve metodu hakkında fikir edinmek amacıyla Bakara sûresinden seçilen bazı konular söz konusu müfessirler nezdinde nasıl ele alındığı ortaya konmuştur."
