abstract: "Bu çalışmada Ebu'l Berakât Nesefî'nin (710/1310) usûl-i fıkha dair Menâr adlı eseri üzerine yazdığı şerh olan Fethu'l-ġaffâr (Mişkâtu'l-envâr) kitabı esas alınarak İslam fıkhının gelişim sürecinde önemli şahsiyetlerden biri olan Zeynuddîn İbn Nüceym el-Mısrî'nin (970/1563), ictihad, kıyas ve istihsan hakkındaki görüşlerinin ortaya konması amaçlanmıştır. İbn Nüceym, özellikle el-Eşbâh ve'n-nezaîr adlı kitabıyla kendisinden sonraki dönemi ve İslam fıkhının taknin (kanunlaştırma) evresini derinden etkilemiştir. Bu yüzden fıkhın hem tartışmalı hem de işlevsel tarafı olan ictihad, kıyas ve istihsana dair fikirlerinin ortaya konması literatüre önemli bir katkı sunacaktır."
