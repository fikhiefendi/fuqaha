abstract: "Sosyal medya sitelerinin popülaritesi ve internet kullanıcılarına sunduğu hizmet çeşitliliği her geçen gün artmaktadır. Bu artışın bir sonucu olarak, sosyal medya hem müşteriler hem de firmalar için önemli bir konu haline gelmiştir. Tüketicilerin sosyal medya paylaşımları, satın alma karar sürecini etkilemektedir. Firmalar; müşteri potansiyelinden faydalanabilmek, satın alma karar sürecini kendi lehlerine sonuçlandırabilmek ve satış sonrası müşteri memnuniyetini maksimize edebilmek amaçlarıyla sosyal medyada yer almaya başlamışlardır. Bu bağlamda sosyal medya kullanımı bankacılık sektörü için de büyük önem arz etmektedir. Bu çalışmada Türkiye'deki mevduat ve katılım bankalarının sosyal medya kullanımı incelenmiştir. Bankalar tarafından en çok 6 farklı sosyal medya sitesi kullanıldığı; en çok Facebook ve Twitter sitelerinin tercih edildiği tespit edilmiştir. Banka Facebook sayfalarının popülerlik, etkileşim ve içerik değerlendirmesine yer verilmiştir. Çalışma ile oluşturulan Facebook Değerlendirme Endeksi neticesinde Türkiye'deki mevduat ve katılım bankalarının 2015 yılı endeks değeri 39,61 olarak hesaplanmıştır."
