abstract: "Bu araştırma, İslam hukuku (şeriat) ile örf arasındaki bağlantının analizine dayanarak kişisel ve sosyal meselelerinin çağdaş Suudi ve İran hukuk yaklaşımlarında nasıl ele alındığını belirtmektedir. Bu tezdeki ana amaç örf ile yasal metin otoritesi arasındaki etkileşimi vurgulamak ve genel olarak sosyal ilişkilere özel olarak evliliğe ait olan şeriat hükümleri için analitik bir çerçevesi geliştirmektir. Bu çalışma Suudi-Hanbeli ve İranlı-Caferi alimlerin örfün şeriattaki statüsüne yönelik yaklaşımlarını üç ayrı kategoride karşılaştırmaktadır: metodolojik bakış açısı (klasik ve çağdaş), alimlerin şer'i fikirleri (fetvalar) ve mahkeme hakimlerinin kararları (ahkam). Aynı zamanda bu araştırma, alimlerin ve hukukçuların doğrudan veya dolaylı örfü kullanma yoluyla şeriat sistemlerindeki farklı uygulamalara götüren yolları örneklerle açıklar. Bunun yanı sıra bu çalışma, hukuki bir terim olarak örf mefhumunun öncelendirilmesi yoluyla şeriattaki düzenlemelerinin ne derece değiştirildiğini veya sürdürüldüğünü de inceler. Ulemanın (din alimleri) örfi uygulamalara yönelik tutumu hem klasik Hanbeli hem de Caferi mezheplerinin şer'i alanda örfün geçerliliğini onayladığını gösterir. Bu hem örfün doğrudan kullanımını hem de rasyonel açıklamalar veya ikincil hukuki ilkeler yoluyla ondan faydalanmanın manipüle edilmesini içerir. Bu araştırma, iki ülke arasındaki hukuki görüşlerin ve mahkeme kararlarının çeşitliliğini karşılaştırmaktadır. Aynı zamanda araştırma örfün yarı bağımsız statüde şer'i bir hukuk terimi olarak ya da çeşitli şer'i ilkelere bağlı ikincil kaynak biçiminde kullanımına özel bir vurgu yapar. Son iki bölüm, hukuki uygulamalardaki çeşitliliği ve farklılığı Suudi Arabistan ve İran'ın yerleşik örfi uygulamaları ile ilişkilendirir; bu da kişisel meselelerle ilgili konularda iki ülke arasındaki fetva ve ahkamın karmaşıklığı ve tutarsızlığı için sebep teşkil eder. Örfün şer'i ilkelerin yanı sıra hukuki bir araç olarak düşünülmesi her iki devletin siyasi politikalarını dini olarak kabul edilebilir terminolojide çerçevelendirmelerine imkan tanır. Bu da özellikle devlet otoritesinin ifası yoluyla ulusal dini kimliklerin üretilmesi hakkında fikir verir. Teorinin pratiğe dönüştürülmesinden kaynaklanan belirsizlik, iki devletin yasal sistemlerindeki ayrıklıkları ve farklılıkları makul bir şekilde açıklamaya yardımcı olur ve bu aynı zamanda Suudi Arabistan ve İran'da yasal bir metodoloji bulunmadığı yönündeki ithama da cevap üretir. Bununla birlikte, bu tez, örf enstrümanı aracılığıyla bir uzlaşma sağlamaya çalışır ve iki ülke arasındaki hukuki uygulamalardaki farklılıkları metodoloji eksikliğiyle açıklamaktan kaçınır. Çağdaş Suudi ve İran hukuk sistemlerinde örfün bir hukuk mefhumu olarak kapsamlı ve detaylı analizi alandaki gayretli akademisyenlerin ilgisini çekerek, onları örfün rolüne ilişkin daha fazla bilimsel araştırmaya yapmaya teşvik etmesi beklenir. Mevcut olan bu çalışma, yetkili hakimlerin bölgesel örften şeriat tabanlı mahkemelerde nasıl istifade ettiklerini ve bunun yollarını anlama konusundaki çabaları derinleştirmeye çalışan daha fazla araştırma ile tamamlanmalıdır."
