abstract: "İslâm Hukukunda Fetvâ Ehliyeti'nin ele alındığı bu çalışmada, fetvânın kavramsal çerçevesi, ilişkili olduğu kavramlar, unsurları, tarihsel süreci, fetvâ ehliyeti ve müftünün tabakaları, taklit, mukallit müftünün ehliyet şartları ve telfîk ile ilgili hükümleri incelenmiştir. Mezhep imamlarının bu konuyla ilgili görüşleri, mukayeseli ve objektif bir şekilde verilmeye çalışılmış ve delil olarak Kur'ân ve sünnete dayandıkları görülmüştür. Araştırmanın sonucunda Kur'ân ve sünnette fetvâ kavramı, farklı türevlerde kullanıldığı ve bu kullanımların fetvâ kavramının anlamına da yansıdığı görülmüştür. Fetvâ verme görevini üstlenecek şahısta Hz. Peygamber'den günümüze kadarki tarihsel süreçte, belli bir ehliyet ve liyakatin bulunmasının zorunlu görüldüğü tespit edilmiştir. Ancak herkesin mutlak müçtehit olma imkânına sahip olmadığından bu durum farklı görüşler arasında tercihte bulunma ve kimin görüşüyle fetvâ verme gibi problemleri ortaya çıkarmıştır. Bu tür problemlerin çözüme kavuşturması fakihleri, fetvâ verecek kimseleri belli kategorilere ayırma mecburiyetinde bırakmıştır."
