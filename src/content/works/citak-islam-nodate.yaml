abstract: "Bu çalışma, Borsa İstanbul katılım endeksinde yer alan şirketlerde gayrimeşru gelirlerin arındırılması sürecini İslam iktisadı perspektifinden ele almakta ve mevcut yöntemlerin yatırımcılar açısından yeterliliğini incelemektedir. Çalışmanın temel amacı, arındırma uygulamalarının teorik temellerini ortaya koymak, mevcut yöntemlerin zayıf yönlerini tespit etmek ve yatırımcıların karşılaştığı sorunlara çözüm sunabilecek merkezi bir hesaplama sistemi önermektir. Bu kapsamda, önerilen modelin uygulanabilirliğini ve gerekliliğini bilimsel olarak test edebilmek amacıyla karma yöntem araştırma desenine başvurulmuştur. Bu yaklaşım, hem geniş bir örneklem üzerinden genellenebilir nicel veriler elde etmeyi hem de bu verilerin arka planını nitel olarak derinlemesine analiz etmeyi mümkün kılmıştır. Nicel veriler, 479 yatırımcının katılımıyla çevrim içi anket yoluyla toplanmış; katılımcıların arındırma konusundaki bilgi düzeylerinin yanı sıra, bu bilgiyi uygulamaya dönüştürme sürecinde karşılaştıkları zorluklar, deneyimleri ve önerilen sisteme yönelik tutumları ölçülmüştür. Elde edilen veriler, katılımcı yanıtlarını özetlemek ve altta yatan örüntüleri belirlemek amacıyla SPSS programı kullanılarak betimsel istatistikler, frekans analizi ve çapraz tablolar yoluyla analiz edilmiştir. Nitel veriler ise, amaçlı örnekleme yöntemiyle belirlenen 10 yatırımcıyla yapılan yarı yapılandırılmış mülakatlarla elde edilmiş ve içerik analiziyle değerlendirilmiştir. Bulgular, yatırımcıların arındırma kavramına genel olarak aşina olduklarını ancak uygulamada hesaplamaya dair bilgi eksiklikleri, yöntem karmaşası ve rehber yetersizliği nedeniyle sorun yaşadıklarını göstermektedir. Mevcut sistemin bireysel yatırımcılara ağır bir sorumluluk yüklediği; buna karşılık önerilen merkezi hesaplama sisteminin süreçleri kolaylaştıracağı ve güvenilirliği artıracağı yönünde güçlü bir beklenti olduğu tespit edilmiştir. Bu doğrultuda, arındırma işlemlerinin standardize edilmesini ve yatırımcı yükümlülüğünü azaltacak şekilde merkezi bir yapıya kavuşturulmasını öneren bir sistem geliştirilmiştir. Bu çalışma, arındırma uygulamalarının iyileştirilmesine yönelik önerileriyle, katılım endeksine uygun yatırım süreçlerinin geliştirilmesine katkı sağlamaktadır."
