abstract: "Son teknoloji kavramını tanımlama ,ve büyümeyi etkileyen faktörleri tanımlama amaçlı mevcut çalışma,Filistin İslam Bankası'ndaki gerçekliğini tanımlamak ve başvurusunun bu bankadaki müşterileri çekme üzerindeki etkisini belirlemek;Ayrıca, Filistin İslam bankalarının ve geleneksel bankaların teknoloji uygulaması arasındaki farkı vurgulama,Bu iki metodolojiyi izledi: Endüktif ve açıklayıcı analiz ,Çalışma aracı“Tanımlama”, 80 Filistin İslam Bankası müşterisinin örneğine uygulandı Gazze'de.Çalışmanın sonuçları, finerinin müşteri çekme konusunda olumlu bir rol oynadığını ortaya koymuştur bankalarda İslamı.İslam Bankası'ndaki deneyimleri aracılığıyla finansal teknoloji hizmetlerine olan talebi artırdı.Filistin İslam bankalarında finteknoloji gerçeği Filistin İslam Bankası'nın müşterilerinin kimlik belirleme alanlarına verdiği yanıtlar gösterilmiştir: Filistin İslam Bankası'nın finteknoloji hizmetleri ortalama bir hesapla (3.51) ve önemli bir onayla geldi. Filistin İslam Bankası'nın müşteri deneyimi ortalama bir hesapla (3.93) ve önemli bir onayla geldi.Sonuçlar, Filistin İslam bankalarıyla geleneksel bankalar arasında bir fark olduğunu da gösterdi Müşteri çekme konusunda son teknolojiye uygulandığında,Çalışma, personelin müşterilerin taleplerini nasıl karşılayacakları ve önerilerini nasıl okuyacakları konusunda eğitilmesini tavsiye etti;Çünkü bu, e-finans hizmetlerinin kalitesini ve cazibesini etkileyecektir."
