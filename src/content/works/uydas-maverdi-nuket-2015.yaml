abstract: "Kur'ân-ı Kerîm nâzil olmaya başladığı günden itibaren daha iyi anlaşılmak amacıyla üzerinde birçok çalışmanın yapıldığı bir kitap olmuştur. Kur'ân İlimleri de, Kur'ân'ın anlaşılmasına yardımcı olan ilimlerdir. Mâverdî de eserinde oldukça anlaşılır ve açık bir şekilde Kur'ân-ı Kerîm'i baştan sona tefsir etmiş müfessirlerdendir. Bu çalışmada Mâverdî'nin Kur'ân İlimlerine bakışı ve tefsirinde bu ilimleri işleyiş tarzı ele alınıp değerlendirilmiştir. Çalışmanın temel amacı, Mâverdî'nin eserinde Kur'ân İlimlerine ne ölçüde yer verdiğini tespit etmek ve onun bu konu ile ilgili düşüncelerini analiz ederek ortaya koymaktır. Bu amaçla öncelikle Kur'ân ilimleri ile ilgili bir çalışma yapılmıştır. Daha sonra yapılan araştırmanın ışığında Mâverdî'nin tefsiri baştan sona titizlikle okunmuştur. Bu esnada müfessirin eserinde yer verdiği Kur'ân ilimleri tespit edilmiştir. Elde edilen veriler konu başlıkları altında toplandıktan sonra mezkûr konu başlıkları dört bölümde değerlendirilmiştir. Giriş bölümünde temel esaslar ve çalışmanın metodunun özet bir biçimde verildiği bu çalışma, bir sonuç ve kaynakça ile son bulmaktadır."
