abstract: "ÖZ İSLAM İKTİSADINDA FAYDA KAVRAMI FATMA BETÜL SOYYİĞİT Geleneksel iktisatta fayda, bireylerin bir mal ya da hizmeti tüketmekle elde ettikleri tatmin duygusunu ifade eder. Rasyonel karar veren tüketicinin, bütçesinin sınırları dahilinde kendisine en yüksek faydayı sağlayan ürün kombinasyonunu tercih ettiği kabul edilir. Bu yaklaşımın İslam iktisadının temel kaynakları, ilkeleri ve amaçlarıyla çelişen yönleri vardır. Bu nedenle bütünleşik bilgi anlayışı içinde İslam dininin önerdiği davranış normları ışığında bir fayda modeli geliştirmek niyetiyle bu çalışma yapılmıştır. Çalışma, kapsamlı literatür analizine dayanan teorik nitelikli bir araştırmadır. Yapılan teorik analizler sonucu İslami standartlara uygun bir fayda modeli geliştirilmesi amaçlanmıştır. İslam iktisadında fayda kavramı insanın hayattaki ana gayesi ile ilişkili olarak ele alınır; bireysel faydanın yanında toplumsal refahın yükseltilmesi, dini gayelerin gerçekleştirilmesi, çevrenin korunarak gelecek nesillere aktarılması da fayda kapsamına dahil edilir. Bu anlayışla kişinin ihtiyaçlarını tatmin edici bir seviyede karşılayan tüketim seviyesinin belirlenmesi önemlidir. İslam iktisadında tüketimin artması her zaman için daha yüksek fayda anlamına gelmez. Çalışma, İslam iktisadında optimum tüketim seviyesinin belirlenmesi konusunda İslam dininin önerdiği davranış normlarını ve fayda optimizasyonunu sınırlandıran faktörleri analiz etmektedir. Ayrıca günümüzde davranışsal iktisat ve sürdürülebilir ekonominin geleneksel fayda teorisine karşı geliştirdikleri yaklaşımların İslam iktisadından yararlanabilecekleri yönleri ortaya koymaktadır. Çalışmanın İslam iktisadında fayda kavramına ait teorik bir çerçeve oluşturulmasına katkıda bulunması ümit edilmektedir."
