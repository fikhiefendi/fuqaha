abstract: "Tarih boyunca var olan devletler, fertler arası birlik ve düzen adına, adı hukuk olmasa da kısmen hukukun görevini yerine getiren kural, töre v.b yapılar oluşturarak hukuksal bir düzen sağlamaya çalışmıştır. Zaman içinde bu kurallar gelişmiş ve nihayetinde de yazılı hale getirilerek günümüze kadar gelmelerine olanak tanınmıştır. Hukukun uygulanması ve toplumun dirlik-düzenini sağlamakla, diğer birçok görevden sorumlu olduğu gibi, devletin kendisi sorumluydu. Osmanlı devletinin kuruluşundan yıkılışına kadar geçen süre boyunca hukuk, toplumsal anlamda vazgeçilmez bir alanı teşkil etmiş ve etkisini her alanda hissetmeye çalışmıştır. Osmanlı devletinde hukuki yapı Tanzimat dönemine kadar genel mahkemeler niteliğinde olan Şeriat Mahkemelerinin yeniden yapılanma dönemi olan Tanzimat dönemi ile birlikte yetkileri kısıtlanmaya çalışılarak, Laik karakter taşıyan mahkeme türlerinin girmesi sonucu Osmanlı devletinde hukukun uygulanma birimi olan mahkemeler çeşitlendirilmiştir. Günümüz yerel tarih araştırmalarında ön plana çıkan Şerʿiyye Sicilleri tarih araştırmalarında birinci elden kaynak olarak karşımıza çıkmaktadır. Osmanlı Devleti'nde şehrin önde gelen yöneticisi konumunda olan kadıların tutmuş olduğu bu kayıtlar, tarihi malzeme açısından zengin arşiv kaynakları arasında sayılmaktadır. Kadı sicilleri, evlenme-boşanma, nafaka, miras, kavga-cinayet, alacak-verecek, vakıf gibi sosyal ve ekonomik meselelerin kaydedildiği defterler olarak, ait oldukları dönemi birebir yansıtan belge çeşidine sahiptirler. Bu tez çalışması 216/1 Numaralı Urfa Şerʿiyye Sicili'nde bulunan belgelere dayanarak şekillenmiştir. Bu sicillerin incelenmesiyle Urfa şehrinin yakınçağ tarihine katkı sağlanması amaçlanmıştır. Buna ek olarak bünyesinde farklı milletleri kendi çatısı altında barındıran Osmanlı Devleti, adlî ve idarî kurumlara gereken önemi vererek idarede adaleti esas almış ve esas aldığı adaleti sağlamaya çalıştığı görülmektedir. Osmanlı Devleti'nin adlî yapıda göstermiş olduğu önem ve hassasiyet Urfa Şer'iyye sicillerindeki kayıt sisteminde de kendisini göstermektedir. Bu tez çalışması 216 numaralı Urfa Şer'iyye Sicili'nin birinci yarısındaki Sayfalar ile ilgilidir. Bu çalışmanın amacı, söz konusu defterde 1-240 Sayfaları arasındaki belgelerin transkripsiyon ve değerlendirmesini yapmak ve böylelikle Osmanlı döneminde mahkemelerin işleyişi, mahkemelerde görülen davalar, Urfa şehrinin sosyo-kültürel ve ekonomik yaşantısına çeşitli açılardan ışık tutmaya çalışmaktır."
