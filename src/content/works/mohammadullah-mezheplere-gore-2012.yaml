abstract: "İslam dinine mensup olmayanlar İslam'ın kadınlara hiçbir hakkı tanımadığını, özellikle onlara velâyet hakkı vermediğini iddia etmektedirler. Yine erkeklerin kadınları zorla ve kendi istemediği şahıslar ile evlendirdiğini, kadınların da velisinin izni olmadan evlenemediklerini, aynı şekilde kadının kendi kız çocuklarını evlendiremediğini ve İslam'ın kadınları erkekler ile ezdirdiğini ve onlara zulüm ettirdiğini iddia etmekte ve insanların kafalarını karıştırmaktadırlar.Erkekler fiziki bakımdan güçlü olarak yaratıldığından ağır ve mesuliyetli işlerden onlar sorumlu tutulmuştur; buna karşın kadınlar fiziki bakımdan erkeğe nazaran daha güçsüz olduğundan ve fıtraten ince, nazik olduğundan daha kolay ve mesuliyeti az olan işlerden ise kadınlar sorumlu tutulmuştur. Yani her ikisinin fıtratına uygun bir şekilde görev dağılımı yapılmıştır.İşte zor ve sorumluluk isteyen işlerden bir tanesi velayettir. Bundan dolayı bu iş erkeklere verilmiştir, yoksa İslam aleyhtarlarının iddia ettikleri gibi kadın bu haktan mahrum edilmemiş; aksine onlara bir nevi torpil geçilmiştir ve onlara kolaylık sağlanmıştır.Bizim bu araştırmada yapacağımız iş, bu konuya açıklık getirmek, iyice anlaşılmasını sağlamak, bu konudaki olumsuz fikirleri değerlendirmek olacaktır.Kadın velisinin izni olmadan hem evlenebilir, hem de kendi kız çocuklarını asabeden sonra evlendirebilir, yani velayet hakkına sahip olabilir. Fakat dediğimiz gibi evlilik ağır ve sorumluluk isteyen bir sözleşmedir. Bu ağır yük paylaşıldıkça hafifleşecektir. Bu açıdan bakıldığında bu tür sözleşmeler yapılırken velilerin izni de çok önemlidir. Çünkü veliler her zaman velisi olduğu kızların problemlerini kendi problemleri ile eşdeğer tutmakta, onun haklarını, menfaatlerini koruyan bir konumda bulunmaktadır. Bunun için kızların velileri ile istişare etmeleri, onların tecrübelerinden faydalanmaları gerekmektedir.Kızların dengi ve emsali mehri ile evlenmek istediklerinde velilerin de onlara yardımcı olmaları gerekmektedir. Her iki taraf da İslam'ın evlilik konusunda gözettiği en temel hedef olan kalıcılık ve mutluluk esasını göz önünde bulundurmalıdırlar."
