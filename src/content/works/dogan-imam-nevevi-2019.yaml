abstract: "Müslümanların, rablerine karşı taşıdıkları kulluk bilinci ve diğer insanlarla olan münasebetlerinin netice ve yansımalarından olan ibadet, muamelât ve ukubât'ın (cezalar) işlendiği ilim dalına Fıkıh denmiştir. Fıkıh ilminin üzerine bina edildiği temel esası oluşturan ise Kur'ân, Sünnet, İcmâ ve Kıyastır. İnsanların yaratılış tabiatındaki farklılık ve yaşam içerisinde edindikleri bilgi ve tecrübe çeşitliliği sebebiyle asıl kaynaklardan aynı ölçüde yararlanması doğal olarak mümkün olmamıştır. Ancak tarih boyunca birinci kaynaklardan yararlanan ve diğer insanlara rehberlik eden âlimler sürekli var olmuştur. Bu âlimlerin hepsi kaynaklardan aynı ölçüde istifade edebilmiş değildir. Kimileri tam anlamıyla bağımsız yararlanırken kimileri de diğer âlimlerin ortaya koyduğu usûl ve belirlemiş olduğu kaide ve kurallara bağlı kalarak yararlanabilmiştir. Bu da âlim derecelerini ya da çalışmamızda ifade ettiğimiz gibi müftî tabakalarını ortaya çıkarmıştır. Bahsi geçen âlimlerden fetva usûl ve âdâbına uygun yararlanabilmek için müftî ve müsteftî arasında gerçekleşen iftâ olayının anlaşılması ve müftî tabakalarının bilinmesi gerekmektedir. Ayrıca bu alanda bizlere rehberlik etmiş önderlerin tanınması da büyük bir önem arz etmektedir."
