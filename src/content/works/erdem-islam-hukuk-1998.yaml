abstract: "V ÖZET İslâm Hukuku insanların ihtiyaçlarını ve meşru maslahatlarını devamlı gözeten, her çağa cevap verecek bir kabiliyet ve elastikiyete sahiptir. Her bilim dalında olduğu gibi, İslâm Hukukunda da tarihi bir süreç söz konusudur. İslâm Hukukunun tarihi seyri hiç şüphesiz Hz. Peygambere vahyin gelmesiyle başlayıp, günümüze kadar ışık tutmuş ve kıyamete kadar da insanlığın ihtiyaçlarına cevap vermeye devam edecektir. İslâm Hukuku alanında telif edilen eserlerin hukuk dünyasına kazandın İması, hem diğer hukuklarla bu hukuk arasında bir mukayese imkanı doğuracak, hem de bu hukukun zenginliğinin ortaya çıkmasına katkıda bulunacaktır. Üzerinde çalıştığımız Burhaneddin İbrahim Halebi XV. asrın sonlarıyla XVI. asrın ilk yarısında yaşamış bir Osmanlı hukukçusudur. İslâmî ilimlerin hemen her dalında söz sahibi olan müellifin fıkıh sahasında yazmış olduğu“Mültekâ”adlı eseri daha sonraki bilim adamlarına kolaylık sağlayacak niteliktedir. Dönemin özellikleri göz önünde bulundurularak ele alman eser muhtasar olması hasebiyle medreselerde ders kitabı olarak okutulmuş, kadı ve müftülerin temel müracaat kitabı olması yönüyle de yarı resmî bir hukuk kitabı hüvviyeti kazanmıştır. Eserin bu derece meşhur olması nedeniyle, batı dillerinde İslâm Hukuku üzerine yapılan ilk etütler Mültekâ ve onun şerhlerine dayanmaktadır. Eser telif edildiğinden beri defalarca basılmış, üzerine birçok şerh ve haşiye yazılmıştır. İslâm kültürünün zenginliğinin ortaya çıkarılması amacıyla bu ve benzeri eserlerin gün yüzüne çıkarılması önem arz etmektedir. Bu tür çalışmaların tarihî ve ilmî bir çok gerçeğe ışık tutacağı kanaatindeyiz."
