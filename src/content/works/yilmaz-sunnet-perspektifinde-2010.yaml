abstract: "Aile kurumu, bütün toplumlarda olduğu gibi İslam toplumunda da önemli bir yere sahiptir. Taraflar bir araya gelerek hukuki ve dini boyutu olan bir akit oluştururlar. Böylece bir hayatı paylaşmak için karşılıklı söz verirler.Kur'an ve sünnet endeksli bir anlayışla oluşturulan bu akit, taraflara bazı sorumluluklar ve haklar yükler. Bunları yerine getirirken taraflar akdin öncesinde ve sonrasında bazı hususlara dikkat etmek zorundadırlar. Yoksa evlilikte hedeflenen sonuç yerine gelmemiş olur. Bu yüzden Kur'an'da ve sünnette, evliliğin devam etmesi ve sürekli bir akit olması için gerekli olan tedbirler alınmış, taraflara da böyle bir bakış açısı verilmeye çalışılmıştır. Aile içerisinde bunlara dikkat edildiği sürece, böyle ailelerden oluşan mutlu bir toplum tesis edilmiş olur."
