abstract: "Bu tez çalışmasında; 5411 Sayılı Bankacılık Kanunundaki karşılıklara (kredi karşılıkları) ait bankacılık ve vergi mevzuatında yer alan kanuni ve idari düzenlemelere yer verilmiştir. Kredi karşılıklarına ilişkin her iki mevzuatta yer alan düzenlemelerin kıyaslanması neticesinde, bankaların vergisel uygulamalarını etkileyen tartışmalı hususların olduğu tespit edilmiştir. Vergilendirmenin temel ilkleri, normlar hiyerarşisi ve bankacılık sektörünün işlemleri göz önünde bulundurularak uygulamaların yerindeliği değerlendirilmiştir. Kredi karşılıklarının muhasebeleştirilmesi aşamasında ise; muhasebe standartlarında ve tek düzen hesap planında yer alan düzenlemelere değinilmiş, özel ve genel karşılıkların ticari kar-mali kar kavramları için ifade ettiği önem üzerinde durulmuş, mali ve finansal tablolar oluşturulurken ticari kardan mali kara geçiş aşamasında izlenmesi gereken adımlar izah edilmiş ve örneklendirilmiştir. Konunun bankacılık sektöründe nasıl uygulanması gerektiği yönünde öneriler oluşturulmuştur. Sonuç olarak; katılım bankacılığı ve geleneksel bankacılık ayrımı gözetmeksizin, genel karşılık tutarlarının kanunen kabul edilmeyen gider olarak kurumlar vergisi matrahına ilave edilmesi, özel karşılık tutarlarının ise kurumlar vergisi matrahının tespitinde gider olarak dikkate alınması gerekmektedir."
