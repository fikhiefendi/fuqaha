abstract: "Özellikle son yıllarda önemli ölçüde gelişme gösteren ve bankacılık sektöründe gittikçe büyümekte olan bir yere sahip olan katılım bankacılığı, verdiği hizmetler açısından konvansiyonel bankacılıkla eşit düzeye yaklaşmıştır. Bu çalışmada, finansal sistemdeki işlerlik bakımından çok önemli bir yere sahip olan katılım bankalarının ortaya çıkış süreci ve bugüne dek geçirdiği dönüşümler bağlamında müşteri şikâyetleri ele alınmıştır. 2012 ve 2020 yılları arası verilerinin ele alındığı çalışmada, söz konusu yıllarda katılım bankalarındaki ve konvansiyonel bankalardaki müşteri şikâyetleri miktar ve şikâyet sebepleri bakımından karşılaştırılmaktadır. Elde edilen sonuçlara göre Geleneksel bankalar ve katılım bankaları karşılaştırıldığında, katılım bankalarına kıyasla geleneksel bankacılıktaki yenilikçi faaliyetlerin müşteri memnuniyetini daha fazla etkilediği görülmektedir. Buradan da anlaşılacağı gibi geleneksel bankalardaki gibi katılım bankalarının müşteri memnuniyetini sağlayabilmesi için yenilikçi faaliyetlere ağırlık vermesi gerekmektedir. Geleneksel bankaların ve katılım bankalarının müşteri memnuniyeti saptanmasında etkili olan unsurlar arasında benzer unsurların mevcut olduğu bilinmektedir. Buna göre müşterilere aktarılması gereken güven, müşteriye bireysel hizmetler sunulması vb. konularda katılım bankaları da geleneksel bankalarla benzer düzeyde memnuniyet elde edebilmektedir. Geleneksel bankalar yapısal olarak müşteri memnuniyeti ve müşterilerle ilişkiler çerçevesinde girişimlerin sürdürülmesi, kârın artması gibi konular öne çıkmıştır. Bu özellikleri ile geleneksel bankalar, müşterilerinin memnuniyetini sağlayabilmekte ve bunu sürdürülebilir hale getirebilmektedir."
