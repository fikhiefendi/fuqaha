abstract: "Günümüzde yaşanan bilimsel, teknolojik, iktisadî ve kültürel gelişmeler, klasik fıkıh literatüründe doğrudan karşılığı bulunmayan birçok yeni meseleyi gündeme getirmiştir. Bu çalışma, modern dönemde karşılaşılan fıkhî problemlerin çözümünde küllî kaidelerin rolünü, muâmelât alanı üzerinden ele almakta ve bu kaidelerin hem teorik hem de pratik işlevselliğini kapsamlı şekilde analiz etmektedir. Faizli işlemler, sigorta türleri, yatırım fonları, dijital akitler, fikir ve sanat eserlerinin korsan satışı, ödünç alınan malın iade masrafı, organize ters teverruk, pos cihazı kullanımı, enflasyon farkı, kıdem tazminatı, trafik kazaları ve online alışveriş gibi konular, modern dönemin öncelikli fıkhî sorunları arasında yer almaktadır. Bu çalışma, söz konusu problemlerin çözümünde“Zarar izâle olunur”,“Âdet muhakkemdir”,“Ukûdda itibar makâsıd ve me'âniyedir, elfaz ve mebâniye değildir”,“Zaruretler memnu olanı mubah kılar”,“Def-'i mefâsid celb-i menâfi'den evlâdır”ve“Zarar-ı âmmı def' içün zarar-ı hâs tercih edilir”gibi küllî kaidelerin nasıl işlevsel hale geldiğini örnek olaylar ve güncel uygulamalar üzerinden incelemiştir. Tezde ayrıca tarihselci, gelenekselci, çağdaş selefî, akademik ve makasıtçı yaklaşımlar çerçevesinde modern dönemde fıkhî meselelerin ele alınış biçimleri değerlendirilmiş, ictihad kurumunun yeniden işlerlik kazanmasının gerekli olup olmadığı ele alınmıştır. Fetva'da bireysel ve kurumsal faaliyetlerin önemi vurgulanarak, Din İşleri Yüksek Kurulu, İslâm Fıkıh Akademisi, Avrupa Fetva ve Araştırma Konseyi gibi yapılar örnek verilmiştir. Küllî kaidelerin tarihî gelişimi, klasik ve modern fıkıhtaki yeri, özellikle Mecelle-i Ahkâm-ı Adliyye'deki uygulamaları üzerinden de değerlendirilmiş, bu kaidelerin sadece teorik değil aynı zamanda hukukî metinlere dönüşebilen, sistematik ve kurumsal bir mahiyet taşıdığı ortaya konmuştur. Sonuç olarak bu çalışma, küllî kaidelerin çağın meselelerine hitap edebilen dinamik, evrensel ve sürdürülebilir bir fıkhî çözüm aracı olduğunu ortaya koymakta ve İslâm hukukunun günümüz dünyasında da canlılığını koruyan kapsayıcı bir sistem olduğunu göstermektedir. Kaidelerin meselelerin çözümünde destekleyici bir mahiyet taşıdığı, ancak bazı araştırmacıların bunları esas delil gibi değerlendirerek doğrudan hükme ulaştıkları görülmektedir."
