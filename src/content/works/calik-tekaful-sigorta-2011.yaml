abstract: "Sigortacılık ilk insanlardan günümüze kadar tarihin her döneminde insanlık için çok önemli bir müessese olmuştur. Sigorta Sistemi, İnsanların yoğun emekleri sonucu sahip oldukları kıymetli varlıklarını beklenmedik kazalar sonucu kaybetmeleri durumunda oluşabilecek sosyo ekonomik çöküntüleri önleyen önemli bir sistemdir.Tekâfül Sigorta sistemi ise günümüzde özellikle faizsiz bankacılığın geliştiği ülkeler başta olmak üzere dünya genelinde hızla yaygınlaşmaktadır. Tekâfül Sigorta Sisteminin, ülkemizdeki Katılım bankalarının yapmış oldukları faizsiz bankacılık hizmetleri göz önünde bulundurulduğunda son yıllarda faizsiz bankacılık ürünlerindeki çeşitlendirme çabaları da göz önünde bulundurularak ülkemizde uygulanabilecek bir sistem olduğu görülmektedir.Çalışmada ülkemizdeki Katılım Bankalarının faizsiz ürün çeşitlendirme çabalarına ek olarak katılım bankası müşterilerinin veya sigortacılık sistemine dini kaygılardan dolayı uygun bakmayan kişilerin ihtiyaçları göz önünde bulundurularak, Tekâfül Sigorta sisteminin ülkemizde uygulanabilirliği araştırılmıştır. Katılım Bankalarının son yıllarda meydana gelen hızlı büyümeleri şube, personel, mevduat artışlarının yanı sıra kredi rakamlarında da ciddi artışlara sebebiyet vermiştir. Katılım Bankalarının öncelikli olarak kendi kredilerinin sigorta ihtiyaçlarını karşılamak üzere oluşturulabilecek Tekâfül Sigorta şirketlerinin katılım bankalarına sağlayacağı birçok fayda olduğu tespit edilmiştir. Ülkemizde bu noktada var olan bir ihtiyaç analizi niteliğindeki bu çalışma ile hem katılım bankalarına bir yeni ve verimli bir ürün, hem de sigortacılık sistemimizin gelişmesi için sigortacılık sistemi ile çalışmayan kişilere bir alternatif önerilmiştir."
