abstract: "Ülkemizde faizsiz bankacılık uygulamaları ilk olarak özel finans kurumları adıyla 1985 yılında faaliyete başlamıştır. Katılım bankacılığı ismini aldığı 2005 yılına kadar genel anlamda hakkında çok fazla bilgi sahibi olunmasa da gerekli yasal düzenlemeler ve denetim boşluklarının giderilmiş olması bakımlarından diğer bankalara alternatif olma yönünde ciddi adımlar atılmıştır. Ancak günümüzde bu kurumların daha etkili ve verimli bir şekilde varlık gösterebilmeleri için toplumu bu kurumlar hakkında daha iyi tanıtmak ve bilgilendirmek gerekmektedir. Türkiye'deki katılım bankalarının ürün ve hizmetlerinin niçin tercih edildiğine dair yapılan akademik çalışmaların sayısı oldukça çoktur. Ancak, müşterilerin katılım bankacılığı tercih nedenleri üzerine araştırma yapılmamıştır. Dolayısıyla bu çalışmada kamu kaynaklı ve özel sermayeli katılım bankalarının tercih nedenlerinin, hizmet kalitesi, faaliyetleri gibi faktörler içerisinde dağılımı incelenerek belirlenmesi amaçlanmıştır. Araştırma, amacı ile paralel olarak, müşterilerin katılım bankacılığı tercih nedenleri üzerinde çalışılması gereken bir kavramdır. Bu davranışa etki eden etkenler belirlenmeye çalışılmıştır. Tüketiciyi müşterilerin katılım bankacılığı tercihlerine neden olan etmenlerin ortaya konulması adına büyük bir önem arz etmektedir. Araştırmaya katılım sağlayan 383 katılımcının sorulara verdikleri cevaplar ışığında sağlanan verilerin istatistik paket programı olan SPSS 23.0 yardımıyla analizi yapılmıştır. Gerek katılımcıların demografik özellikleri gerekse müşterilerin katılım bankacılığı tercih nedenlerine ilişkin frekans tabloları oluşturulmuş ve genel eğilim tespit edilmeye çalışılmıştır. Araştırmaya ait yirmi farklı hipotez oluşturulmuştur. Bu hipotez testlerinin sonuçlarına ulaşabilmek için iki seçeneğe sahip bağımsız değişken ile bir bağımlı değişken arasında anlamlı bir farklılık bulunup bulunmadığını analiz edebilmemize yardımcı olan bağımsız tek taraflı t-testi uygulanmıştır. İkiden fazla seçeneğe sahip bağımsız değişken ile bir bağımlı değişken arasında anlamlı bir farklılık bulunup bulunmadığını analiz edebilmemize yardımcı olan ANOVA uygulanmıştır. Araştırmadan elde edilen sonuçlar; Katılım bankacılığının prensip ve işleyişini bilmiyorum diyenler katılım bankacılığının prensip ve işleyişini kısmen biliyorum diyenlere göre katılım bankaları faaliyetlerine yönelik düşüncelere daha az katılmaktadır. Eğitim düzeyine göre katılımcıların katılım bankacılığı işleyiş süreciyle ilgili bilgi düzeyi açısından anlamlı bir farklılık bulunmamaktadır. Dini vecibelerini tamamıyla yerine getirenler cevap vermek istemiyorum diyenlere göre katılım bankacılığı işleyiş süreciyle ilgili bilgi düzeyi daha yüksektir."
