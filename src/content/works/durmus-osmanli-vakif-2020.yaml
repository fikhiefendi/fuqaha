abstract: "Mukâtaa kavramı, Osmanlı toplumunda farklı anlamlarda kullanıldığı gibi vakıf hukukunda da farklı uygulamaları ifade etmek için kullanılmaktadır. Ancak bu çalışmada ele alınan mukâtaa, vakıf arsanın, üzerine hakk-ı karâr şartı ve mülkiyeti şahsına ait olmak kaydıyla bina yapmak veya ağaç dikmek isteyen kimseye kiralanmasını ifade eden bir tür uzun süreli kira akdidir. Bu akit sonucu yıllık olarak alınan kira bedeline mukâtaanın yanı sıra icâre-i zemîn veya mukâtaa-i zemîn de denilmektedir. Osmanlı döneminde mukâtaa olarak adlandırılan bu uygulamaya fıkıh kitaplarında ise hikr denilmektedir. Çalışmanın amacı fıkıh kitapları, fetva mecmuaları ve şer'iyye sicillerindeki bilgilerden hareketle mukâtaa akdinin, 16. ve 17. yüzyıl Osmanlı merî hukukundaki yerinin ve hukuki sonuçlarının ortaya konulmasıdır. Böylece Osmanlı vakıf hukukunda vakıf mülklerin kiralanması hususundaki önemli bir boşluğun doldurulması hedeflenmektedir. Çalışmada daha ziyade ziraate elverişli olmayan vakıf veya mîrî arazilerin birtakım şartlar çerçevesinde mukâtaa ile kiraya verildiği sonucuna ulaşılmıştır. Böylece zaruret ve ihtiyaç saikıyla ortaya çıkan mukâtaa akdi, vakıflara atıl haldeki arsalarını değerlendirmek suretiyle hizmetlerini sürdürme imkânı sağlarken bir yandan da şehrin imarı noktasında önemli bir rol oynamıştır. Buna ilaveten mukâtaa akdi, vakıf arsa veya mülklerin kiralanması hususunda vakıflar açısından daha avantajlı olan icâreteyn uygulamasına zemin hazırlaması açısından da önem arz etmektedir. Mukâtaa akdi neticesinde kiracı, vakıf arsada ihdâs ettiği mülklerde kayd-ı hayat tasarruf hakkına sahip olur, mukâtaasını ödediği müddetçe mütevelli tasarrufuna müdahale edemez. Yine bu hak sebebiyle kiracı arsadaki mülklerinde satma, vakfetme, hibe etme, başkasına kiralama gibi tasarruflarda bulunabilir, vefat ettiğinde ise bu mülkler vârislerine intikal eder. Buna karşın mütevelli, ecr-i misil kirayı alma, mahlûl kalan arsayı yeniden kiraya verme, bazı durumlarda akdi feshetme, izinsiz tasarrufa mani olma, mukâtaalı mülkün satılması durumunda vakıf için bir miktar para alma, araziden çıkan madenleri alma gibi önemli haklara sahip olur."
