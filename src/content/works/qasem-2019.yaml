abstract: "Bu tez, Yemen Cumhuriyeti'nde Ahvali-i şahsiyye kanununun bölümlerinden biri olan nikah akdi kanununun maddelerini araştırmayı, kanun maddelerinin Islam hukuku ve onun tatbiki kısımlarıyla (füru' ile)ne derece örtüştüğünü ve Islam mezheplerinden hangisinin bu kanunu en çok etkilediğini araştırmayı hedeflemiştir. Bu analiz yapılmadan önce, kanunlaştırılmasından itibaren Yemen Kanunu ve maddeleri, Kuzey ve Güney Yemen kanunları ile de karşılaştırılması yapılarak, bilimsel yöntemlerle incelenmiştir. Tezin vardığı sonuçlar kanun maddelerinden hiçbirinin Islam Hukuku ve onun ruhuyla ters düşmediği, Yemen'de kanun koyucu otoritenin belirli bir mezhebe bağlı kalmayıp, aksine mezheplerin ittifak ettiği görüşleri veya insanlara en kolay ve en uygun olduğunu düşündüğü mezhep görüşünü almayı tercih ettiğidir. Tezin ulaştığı neticelerden biri de birçok kanun maddesinin, özellikle de evlilikle ilgili hususları da içinde barındıran sosyal hayata ilişkin kanun maddelerinin yeniden gözden geçirilmesi gerektiğidir. Sosyal hayata ilişkin bu kanunlar Yemen toplumunun ürünü olup Yemen Kanunu tarafından iyileştirilmemiştir ve toplumdaki mevcut birçok sorunun çözüme kavuşmasını sağlayacak bir gözden geçirmeye ihtiyaç duymaktadır."
