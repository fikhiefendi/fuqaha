abstract: "İnsanoğlunun dini emir ve yasaklara muhatap olması, takatinin üstünde bir yük ile mükellef tutulması demek olmayıp bilakis kişilerin takat ve görev ifa edebilirliği ile eş orantılı bir niteliği haizdir. Dini mükellefiyet şartlarını haiz olmayanların sorumlu tutulmamaları, bu şartları sonradan kaybedenlerin mükellefiyetten muafiyetleri, zor şartlar altında olup dini yükümlülüğü tam olarak ifa etmek hususunda zorlanacak kimseler lehine ekstra bir takım kolaylıkların ruhsat olarak tanınmış olması da bunun kanıtıdır. Biz bu çalışmamızda, normal şartlar altında insan ile yaratıcı arasında olması gereken taabbudî ilişkinin, yolculuk gibi anormal şartlar altında yapılabilir seviyeye indirgenmiş olması ile ilgili tezahürlerini ve bunların günümüz şartlarında da geçerliliğini ispat ve izah etmeye çalıştık."
