abstract: "Tez bir giriş, dört ana bölüm ve sonuçtan oluşmaktadır.Girişte araştırmanın konusu ve önemi, amacı, metodu, kaynakları, plan hakkında bilgi verilmiştir. Yine girişte tezde kullanılan ve ayrıca Tahâvî'nin kullandığı belli başlı kavramlar açıklanmaya çalışılmıştır.I. Bölümde Tahâvî'nin Hayatı, İlmî Gelişimi ve Eserleri ele alınmaya çalışılmıştır. Bu bölümde Tahâvî'nin haytatı, eserleri ve bu eserleri arasında Akîdetu't-Tahâvî, Şerhu Meâni'l-Âsâr'ı ve Şerhu Müşkili'l-Âsâr'ı hakkında bilgi verilmiş, hakkındaki değerlendirmelere atıfta bulunulmuştur.II. Bölümde Tahâvî'nin hadis- sünnet anlayışına ve hadis ilmi ile ilgili önemli bazı konulara dair yaklaşımlarına değinilmiştir.III. Bölümde Tahâvî'nin hadis tenkidi ele alınmıştır. Tahâvî'nin isnad ve metin bakımından hadisleri tenkidi ve ayrıca Tahâvî'nin hadis değerlendirmelerine karşı yapılan tenkitler ortaya konmaya çalışılmıştır.IV. Bölümde Tahâvî'de hadis yorumu ve yöntemi başlığı altında hadisler arasındaki ihtilaf ve tearuzu giderme yöntemleri, nesh hakkındaki görüşleri, hadisleri anlama ve yorumlamada kullandığı birtakım ölçütler ele alınmaya çalışılmıştır. Ayrıca bu bölümde ihtilâfu'l-hadis alanında ortaya konan çalışmalar ve Tahâvî'nin çalışmaları birlikte değerlendirilmiştir. Yine bu bölümde Tahâvî'nin hadis yorum ve tevil tarzından örnekler sunulmuş, örnek bab incelemesi ortaya konulmuştur.Tez Tahâvî'nin hadis tevil ve yorumlama yönteminin değerlendirilmesi ve sonuç bölümü ile tamamlanmıştır.Sonuç olarak Tahâvî'nin hadislerin anlaşılmasını başlıca ilke edinen ve bu uğurda özellikle tevil yöntemine müracaat edip bu yöntemi oldukça başarılı bir biçimde uygulayan bir ilim adamı olduğu görülmektedir. Tahâvî, hadislere farklı zaviyelerden bakarken kendine özgü değerlendirme ve açılımlarda bulunmaktadır. Tahâvî'nin hadis tenkidi daha ziyade hadisleri anlama, onları anlaşılır kılma ve müşkil hususları giderme odaklıdır."
