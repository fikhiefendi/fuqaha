abstract: "Îne akdi, güncel literatürde kredi temin etmek ya da kâr sağlamak amacıyla vadeli olarak satılan bir malın peşin para karşılığında daha düşük bir bedelle geri satın alınması şeklinde tanımlanan bir işlemdir. İslam hukukçuları muamele-i şer'iyye ve teverruk gibi adlarla da kullanılan bu işlemin hükmü hakkında ihtilafa düşmüşlerdir. Bu tez, söz konusu akdin hükmünü ve mahiyetini ortaya koymak adına, hicrî ilk yıllardan Osmanlı'ya kadar olan dönemde, Hanefî fıkıh eserlerinde meselenin nasıl ele alındığına yer vermiştir. Hem satılan bir şeyin ilk fiyatından daha azına satılması meselesi hakkındaki tartışmalar hem de îne akdine dair yapılan açıklamalar incelenmiştir. Îne akdinin mezhep oluşumunun henüz tamamlanmadığı erken dönemde ve Osmanlı'ya kadarki sonraki dönemde ne şekilde algılandığı tespit edilmeye çalışılmıştır. Ayrıca mahiyet itibariyle aynı gözükseler de müellifler tarafından farklı konular olarak sunulan geri satış işlemleri ile îne akdi arasındaki ilişki ortaya koyulmaya çalışılmıştır."
