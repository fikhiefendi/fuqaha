abstract: "Bu çalışmanın amacı, İslam ülkelerinde faaliyet gösteren katılım bankalarının performanslarının karşılaştırılması ve performansları üzerinde etkili olan faktörlerin araştırılmasıdır. Bunun için, Malezya, Suudi Arabistan, Katar, Kuveyt, İran, Birleşik Arap Emirlikleri ve Türkiye ülkelerinin 2011-2015 dönemine ait yıllık verileri kullanılarak analiz yapılmıştır. Yöntem olarak, Veri Zarflama Analizi (VZA), Oran Analizi ve Panel Veri Analizi kullanılmıştır. Veri olarak ise, Veri Zarflama Analizi için girdi değişkenleri olarak; toplanan fonlar, duran varlıklar, özkaynaklar ve personel giderleri, çıktı değişkenleri olarak; kullandırılan fonlar ve diğer getirili aktifler kullanılmıştır. Oran Analizi için, kârlılık oranları, likidite oranları ve risk ve ödeme gücü oranları, Panel Veri Analizi için ise, bağımlı değişken olarak Veri Zarflama Analizi sonucunda elde edilen başarı skorları, bağımsız değişken olarak ise aktif kârlılık oranı, özsermaye kârlılık oranı, kredi mevduat oranı ve borç oranı kullanılmıştır. Yapılan VZA sonucunda; Malezya ve İran'ın tüm yıllarda etkin olduğu, Katar ve Türkiye'nin ise tüm yıllarda etkinlikten uzak olduğu görülmüştür. Ülkelerin verimliliğine bakılırsa; Katar, Türkiye ve Malezya'nın genel olarak verimliliklerini artırdığı Kuveyt, İran ve Birleşik Arap Emirlikleri'nin genel olarak verimliliklerini azalttığı görülmüştür. Yapılan oran analizi sonucunda; en yüksek kârlılığa Suudi Arabistan'ın, en düşük kârlılığa ise Kuveyt'in sahip olduğu, en yüksek likiditeye Türkiye'nin, en düşük likiditeye ise Malezya'nın sahip olduğu, en yüksek riske İran ve Malezya'nın, en düşük riske ise Katar'ın sahip olduğu görülmüştür. Son olarak yapılan panel veri analizi sonucunda; katılım bankalarının performansları üzerinde aktif kârlılık oranı ve borç oranının pozitif yönde, özsermaye kârlılık oranı ve kredi mevduat oranının ise negatif yönde etkili olduğu görülmüştür."
