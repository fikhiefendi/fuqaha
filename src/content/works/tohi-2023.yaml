abstract: "Bu araştırma, Abdülmelik bin Ali bin Ebi el-Muna el-Babi el-Halebi'nin bir nüshasını ele almakta ve müellifin bu bölümle ilgili hükümleri toplamayı amaçladığı Tasavvuf kitabının inceleme ve incelemesini içermektedir. Bu nedenle, hukuki yönlerini açıklığa kavuşturmak için Şafii mezhebinin hükümlerine dayanır ve bazı dallarında Şafii mezhebinin hükümleri ile fakihlerin tüm imamları tarafından zikredilenler arasında karşılık gelebilir. Metinsel hükümler veya zihinsel deliller üzerine ve El-Halabi temizlik hakkında konuştu ve sözün temellerini, şartlarını ve sonuçlarını ayrıntılı olarak açıkladı ve teyemmüm, abdest, abdest, çorap veya atel üzerine mesh, hayız bölümlerinden nakletti. Şafii fıkıh kaynaklarına göre Dolayısıyla bu nüsha, Şafii fıkhının önemli bir bölümünü ele almış ve ilgili hükümleri, şartları ve sonuçları açıklığa kavuşturmuştur. Fikrî ve diğer nakiller, araştırmalar ve müfettişlerin kalemleri tarafından gözden kaçırıldıktan sonra araştırılmaya değer olan şeydi ve H. 9. ve 10. yüzyıllarda tanık olunan ansiklopedik bilimlerle bağlantılı iyi bir kültürü öne çıkaran şeydi."
