abstract: "Osmanlı devletinin sosyal ve ekonomik durumu hakkında yerel tarih açısından bilgi sahibi olmamıza yardımcı olan Şer'iyye Sicilleri defterleri araştırmacıların başvurduğu en önemli kaynaklardan birisidir. Tereke defterlerinden yola çıkarak halkın hangi mesleği icra ettiklerini ve geçimlerini sağlayabilmeleri için tarım, hayvancılık ve nakliye vesaire ile uğraşmışlardır. İnsanların eşyalarını temin etmeki bir yerden başka bir yere seyehat etmek veya yüklerini taşımada kolaylık sağlaması amacıyla binek hayvanlardan yararlanmışlardır. Bu nedenle binek hayvanlar sosyal ve ekonomik hayatta en önemli ulaşım araçları durumundadır. Ölen kişilerin menkul ve ğayrimenkullerinin malları kadılar aracılığıyla varislere teslim edilmeleri ve hangi coğrafi bölgelerde yaşadıklarını öğrenmemizde bir fikir sahibi olmamıza imkân sağlıyor. Çalışmamızın ana kaynağı Şer'iyye Sicilidir. 167 numaralı Şer'iyye Sicilleri defterleri Edirne'nin 1174-1175/ 1760-1761 yılları arasında meydana gelen gelişmeleri kapsamaktadır. Osmanlı devletinde kadı, naip, kassam, vakıf, miras, Osmanlı millet sistemi gibi konular hakkında bilgiler verilmiştir."
