abstract: "Güvenlik tehlikesiz olmak demektir. Güvenlik tedbirleri suçlara karşı toplumu korumak amacıyla alman yasaklayıcı önlemlerdir. Bunlar tüm insanlık için gerekli ve zaruridir. Yaşama hakkı her insanın tabiî hakkıdır. Kişiler ve devlet organları şahsın varlığına ve hürriyetine dokunmamakdırlar. Onun maddi ve manevi şahsiyetinin gelişmesine ve hürriyetine müdahale etmemelidirler. İnsanın maddi ve manevi hayatının dokunulmazlığı konusunda ilk hatıra gelen yaşama hakkıdır. Hiç kimse haksız yere diğerini öldüremez. İnsan öldürmek bir cinayettir. Dünyaya gelmiş bir inşam öldürmeye cinayet denir. Öldürme çeşitleri; kasten öldürme, kasta benzer öldürme, hataen öldürme, hataen öldürmeye benzer öldürme, tesebbüben öldürme olmak üzere beş kısma ayrılır. Öldürme ile ilgili hükümler; kısas, diyet, keffaret, günah ve mirastan mahrum etmektir. İnsanın gönlünün meylettiği ve ihtiyaç anında kullanılmak üzere biriktirilen her türlü şeye mal denir. İslâm hukuku özel mülkiyet hakkını tanımıştır. Çünkü mülkiyet fitrîdir. Fakat çalışma ve gayretlerin farklı olması sebebiyle insanlar, servet ve mal bakımından eşit değillerdir. Mülkiyet hakkı diğer haklar gibi sınırlıdır. Mülkiyet, İslâm dininin cevaz verdiği çalışma, miras, ticaret gibi meşru bir yoldan elde edilmiş olmalıdır. Hırsızlık, kumar, gasp, ihtikar, tefecilik gibi İslâm'ın helal saymadığı bir yoldan mülk edinmek caiz değildir. Aynı zamanda israf ve karaborsacılık da yasaklanmıştır. Buna karşılık ticaret, ziraat, zanaat vb. yollarla mal elde etmek teşvik edilmiş, miras ve vasıyyet, zekat ve sadaka gibi müesseseler yerleştirilmiştir. Diğer taraftan işgal ve emeğin tarifi yapılmış, toprak ve maden mülkiyetinin kazanılması ve kullanılması belli kurallara bağlanmıştır. Can ve mal güvenliği İslâm'ın korumayı hedeflediği beş temel esastan ikisidir ve temel insan hakkı olarak saydığı bu iki sahayı korumak için belli kurallar ve sınırlar koymuştur."
