abstract: "Mülkiyet hakkı, hak sahiplerinin sayısı bakımından bireysel mülkiyet ve birlikte mülkiyet olmak üzere ikiye ayrılır. Türk Medenî Kanunu'nda paylı mülkiyet ve elbirliği mülkiyeti olmak üzere iki tür birlikte mülkiyet hâli öngörülmüştür. TMK m. 701/f. 1 uyarınca elbirliği mülkiyeti, kanun ya da kanunda öngörülen sözleşmeler uyarınca oluşan topluluk dolayısıyla mallara birlikte mâlik olanların mülkiyetidir. TMK m. 702/f. 1'e göre ortakların hakları ve yükümlülükleri, topluluğu doğuran kanun veya sözleşme hükümleri ile belirlenir. TMK m. 702/f. 4'e göre elbirliği mülkiyetine tâbi bir eşyanın korunmasını ortaklardan her biri sağlayabilir. Elbirliği mülkiyetinde eşyanın kullanılmasının ve korunmasının incelendiği bu çalışmada sırasıyla elbirliği mülkiyetinin tarihçesi, yapısı, görünüm şekilleri, elbirliği mülkiyeti doğuran her bir hukukî ilişki bakımından mâliklerin eşyayı kullanma düzeni ve eşyanın korunmasına yönelik her bir elbirliği ile mâlikin sahip olduğu imkânlar ele alınmıştır."
