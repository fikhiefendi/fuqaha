abstract: "ÖZETNAMAZ VAKİTLERİ VE NAMAZLARIN BİRLEŞTİRİLMESİTez, bir giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında, namaz hakkındatemel bilgiler verilmiştir.Birinci bölümde, namaz vakitleri konusu, Kuran, sünnet ve mezhepler ışığındadetaylı bir şekilde ele alınmıştır. Özellikle tezin Kuran'ı ilgilendiren bölümünde anatefsir kaynaklarından mümkün mertebe istifade edilmiştir. Hadisleri incelerkense dokuzana hadis kitabı baz alınmıştır.Konunun mezhepler açısından ele alınmasında ise; farz, vacip ve sünnetnamazların vakitleri tek tek belirtilmiştir. Konuyla alakalı olarak, her bir mezhebe aitbirkaç temel kaynaktan yararlanılmıştır.Tezin ikinci bölümünü teşkil eden `namazların birleştirilme' konusu incelenirkende aynı yöntem takip edilmiştir. Bu bölümde özellikle hadislerin tekrarlarındankaçınılmış, bunun yerine hadislerle ilgili yorumlara ve mezheplerin görüşlerine yerverilmiştir.NamazZamanBirleştirmeMezhepIABSTRACTTIMES OF PRAY AND COMBINATION OF SALATThis thesis has an entrance and two main chapters. In the entrance, is given somefundemental information about the basics of pray (Salat).In the first chapter, times of pray (Salat) were studied in detail in the light ofQuran, Hadith and the Islamic Sects, especially, referring main references ofinterpretation of Quran as much as possible. As for the studying the hadiths, nine hadithbooks was regarded.Times of prays (which are fard, vacib and sunne) have been determined, one byone, according to the five sects of Islam. While studying this chapter, for each sect,certain fundemental sources were used.In the second and last chapter, the matter of the combination of salat (cem-i salat)was searched in the same method. However, it was avoided to repeat the hadiths asmuch as possible.SalatTimeCombinationSectII"
