abstract: "İnsanın hayatı, sahip olduğu en değerli şeydir ve bedeninin güvenliği, yaşamının temelini oluşturur. İnsan, topluma karşı görevini yerine getirebilmesi için güçlü bir bedene ve sağlam organlara sahip olmalıdır. Ancak terör eylemleri, her patlamada onlarca insanın hayatını kaybetmesine neden olurken, yaralananlar ise tam veya kısmi sakatlık yaşamaktadır. Bunun yanı sıra, terör eylemleri kamuya ve özel mülklere de zarar vermektedir. Bu nedenle, terör eylemlerinden zarar görenlerin tazminat alma konusundaki önemi, İslam hukuku ve mevzuatında hem iç hukukta hem de uluslararası düzeyde önemli bir yer tutması şaşırtıcı değildir. Bir terör suçu (terör eylemi) meydana geldiğinde bilinen bir gerçektir ki iki hak ortaya çıkar. İlk hak, devletin suçu işleyen kişiye yüklediği kamu hakkıdır, yani ceza hakkıdır. İkinci hak ise özel haktır ve zarar görenin veya suçun mağduru olanın tazminat talep etme hakkını içerir. Bu hak, terör eylemlerinden zarar görenlerin bu tür davalar için tazminat taleplerini mahkemelerde iddia etme yasağıyla sınırlıdır. Bu, çoğu ülkenin ve Irak'ın da dahil olduğu çoğunluğun yasalarının bir duruşudur. Bu durumda terör eylemlerinin mağdurlarının dava açan ve davada taraf olarak konumlandırılmaları engellenmektedir. Daha önce tazminatın ne olduğunu ve terör eylemlerinde uygulanan yöntemlerini açıkladık ve bunlar“maddi ve manevi tazminat”olarak adlandırdık ve fark ettik ki çoğu yasa, terör eylemlerinin kurbanlarına tazminat ödenmesini öngörmektedir. Ayrıca, bu çalışma analitik yönteme dayanarak sunulan fikrin analiz edilmesi ve uygun görüşlerin ışığında tartışılması üzerine yapılmıştır. Bu analizler, konuyla ilgili yasal metinlere dayandırılarak değerlendirilmiştir. Bu bağlamda, 2009 yılında değiştirilen 20 sayılı yasaya dikkat çekilmiş ve bu yasaların devlet tarafından terör mağdurlarının tazminatını ele alıp almadığı ve bu tazminatın tam veya kısmi olup olmadığı incelenmiştir. Araştırmacı, terörün zarar gören tarafının, maruz kaldığı zararın telafisi için sadece hukuki sorumluluk kuralları tarafından belirlenen sorumlu şahsın önünde başka bir seçeneği olmadığı sonucuna vardı. Zarar gören, zararları tek başına taşımalıdır ve toplum, zararların telafisiyle ilgili bir rol oynamamaktadır. Aynı şekilde, zarar görenin hata veya kusuru kanıtlayamaması durumunda veya sorumlu kişi maddi olarak yetersiz durumdaysa, zararların telafisi yalnızca zarar gören ve sorumlu arasındaki ilişkiye sınırlıdır."
