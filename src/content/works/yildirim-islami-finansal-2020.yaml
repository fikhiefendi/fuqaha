abstract: "Bireyler, işletmeler ve finansal işlemler yapan kurum ve kuruluşlar finansal kararlar alırken, alternatifler arasından verimli olacak tercihler yapabilmeleri finansal okuryazarlık düzeyleriyle ilişkilidir. Finansal okuryazarlık; finansal kavram ve işlemler hakkında bilgi sahibi olmayı ve bu bilgiyi finansal kararlar alırken etkin bir şekilde kullanabilme yeteneği olarak ifade edilebilir. İslami finansal okuryazarlık ise İslami finansal ürün ve hizmetler hakkında bilgi sahibi olmayı ve finansal işlemler yaparken İslami kuralların bilincinde olmayı ifade eder. Faiz hassasiyeti olan bireyler, İslami finans kurumları ve İslami finansal araçlar konusunda yeterince bilgi sahibi olmadığından dolayı tasarruflarını finansal sistemlerin dışında değerlendirmektedirler. Bu noktada bireylerin, İslami finansal okuryazarlık düzeylerinin tespit edilerek, İslami finansal ürün ve hizmetlerle ilgili farkındalık oluşturulması, hem faiz sorunun etkisini azaltmaya hem de tasarrufların ekonomiye kazandırılmasına katkı sağlayacaktır. Çalışmanın amacı, Tokat Gaziosmanpaşa Üniversitesi bünyesinde çalışan akademik ve idari personelin İslami finansal okuryazarlık düzeylerini belirlemektir. Çalışma, İslami finansal okuryazarlık konusuyla ilgili yapılmış çalışmaların sayısının az olması ve İslami finansal okuryazarlık konusuyla ilgili akademik ve idari personel üzerine yapılan ilk çalışma olması bakımından literatüre önemli katkılar sağlayacaktır. Tokat Gaziosmanpaşa Üniversitesi akademik ve idari personelin İslami finansal okuryazarlık düzeylerini belirlemek için anket yönteminden yararlanılmıştır. Bu çalışmanın evrenini, Tokat Gaziosmanpaşa Üniversitesi bünyesinde çalışan 1255 akademik ve 950 idari personel olmak üzere toplam 2205 personel oluşturmaktadır. Örneklem ise, kota örnekleme yöntemine göre belirlenen 363 personelden oluşmaktadır. Belirlenen personellerin 151'i idari, 212'si akademik personeldir. Yapılan analiz sonuçlarına göre finansal araç bilgi düzeyi ile cinsiyet arasında anlamlı farklılık oluşmuş ve erkeklerin kadınlara göre finansal araçlar konusunda daha bilgili oldukları sonucuna ulaşılmıştır. İslami finansal okuryazarlık düzeyi ile cinsiyet, medeni durum, yaş, eğitim durumu ve gelir aralığı demografik faktörleri arasında anlamlı farklılık oluşmamıştır. Son olarak Tokat Gaziosmanpaşa Üniversitesi akademik ve idari personelinin İslami finansal okuryazarlık düzeyi oldukça düşük olarak belirlenmiştir."
