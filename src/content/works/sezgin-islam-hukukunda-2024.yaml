abstract: "Bu çalışmada, İslâm hukukunda evlenme engeli olarak sıhriyet incelenmiştir. Tez, giriş, üç bölüm ve sonuçtan oluşmaktadır. Girişte, konun yazılış amacı, konunun yazılmasındaki yöntem, konuyla ilgili yapılmış çalışmalar, evlilik kavramı ve evliliğin tarihçesi aktarılmıştır. Çalışmanın birinci bölümünde“İslâm hukukunda evlenme engelleri”, ikinci bölümde“İslâm hukukunda evlenme engeli olarak sıhriyet”, üçüncü bölümde ise“sıhriyet sebebiyle ortaya çıkan sonuçlar”incelenmiştir. Konular işlenirken ilk olarak kavramların İslâm hukukunda hangi anlama geldiği, oluşan bu mana farklılığının konuya etkisi, elde edilen hükmün doğurduğu toplumsal sonuçlar ele alınmıştır. Çalışmamızda konular incelenirken mezheplerin temel kaynakları üzerinde durulup bu mezheplerin hükümleri ve bu hükümlerin delilleri zikredilip değerlendirilmiştir. Sonuç kısmında sıhriyeti oluşturan etkenlerin neticeleri üzerinde durulmuş ve vardığımız neticeyi belirterek çalışma tamamlanmıştır."
