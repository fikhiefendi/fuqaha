abstract: "“İslâm Hukukunda Kadınların Mahremsiz Olarak Hac ve Umre İbadeti”başlıklı çalışma klasik ve modern dönem arasında kadınların mahrem olmadan yaptıkları yolculukların fıkhi hükmüne dair farklı görüşleri değerlendirmeyi amaçlamaktadır. Günümüzde Müslümanlar arasında kadınların mahremi olmadan yaptıkları yolculuğun fıkhî hükmü hâlâ tartışılmaya devam ediyor. Bu mesele klasik fıkıh literatüründe de tartışılmıştır. Kimi fakihler seyahat güvenliği varsa kadınlar için mahremsiz yapılan yolculuğu caiz görmüş, kimisi ise güvenlik olsun olmasın cevaz vermemiştir. Bu farklı görüşlerin her birinin kendi açısından birtakım dayanakları bulunmaktadır. Bu bağlamda klasik fıkıh kitaplarında kadınların hac ve umre ibadetini eda etmesi konusunda da farklı tartışmalar yer almaktadır. Kimi eserlere göre mahremi olmayan kadınların yolculuk yapması ve hac-umre ibadetini yerine getirmesi caiz görülmemişken kimi kaynaklarda bu konuda sessiz kalınmıştır. Günümüzde ulaşım imkânlarının gelişmesi ve yol güvenliği de dikkate alınarak bu konunun farklı değerlendirmelere tabi tutulduğu görülmektedir. Biz de tezimizde bu konuyu araştırıp sonuçları ortaya çıkarmaya çalışacağız. Kur'ân-ı Kerîm'de, kadınların tek başlarına mahremi olmadan yolculuk etmemeleri gerektiğine dair hüküm içeren herhangi bir ayet bulunmamaktadır. Ancak Hz. Peygamber'in bize bıraktığı önemli bir miras olan sünnete gelince, kadınların mahremsiz olarak yolculukları, bu arada hac ve umre seferleri hakkında rivayet edilen hadisler, kesin yasaklama ya da kesin izin verilmesini mümkün kılacak açıklıkta değildir. İşte bu farklı hadislerden dolayı fıkıh âlimlerinin görüşleri de birbirinden farklı olmuştur. Burada konu üç yolculuk türü üzerinden incelenecektir. Bunlar herhangi bir uzun mesafeli yolculuk, hac yolculuğu ve umre yolculuğudur."
