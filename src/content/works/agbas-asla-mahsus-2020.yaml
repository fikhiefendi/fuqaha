abstract: "Tezimizde fıkıh usûlünde kıyasın şartları arasında zikredilen“asla mahsus olan hüküm üzerine kıyas yapılmaması”şartı ve bunun fürû-i fıkha yansımaları incelenmiştir. Tezimiz bir giriş ve üç bölümden oluşmaktadır. Tezimizin giriş bölümünde araştırmanın amacı, konusu, önemi, yararlanılan kaynak ve yöntemler hakkında bilgi verilmiştir. Birinci bölümde kıyasın tarifi, ana hatlarıyla çeşitleri, rükünleri ve şartları ele alınmıştır. İkinci bölümde hükmün asla mahsus olması kavramı ve fıkıh usûlcülerinin kıyasın bir şartı olarak“aslın hükmünün asla mahsus olmaması”şartına yaklaşımları incelenmiştir. Bir hükmün asla mahsus olduğu tespit edilirken usulcülerin kullandıkları yöntemler ve verilen örnekler ele alınmıştır. Üçüncü bölümde ise asla mahsus olduğu ileri sürülen başlıca hükümler ayrıntılı olarak incelenerek araştırma konumuz olan usûl kuralının fürû-i fıkha yansımaları tespit edilmeye çalışılmıştır. Sonuç olarak fakihlerin ve usulcülerin şerʻî kıyasın geçerlilik şartlarından birisi olarak aslın hükmünün asla mahsus olmaması şartını genel olarak kabul ettikleri, bu şartın fürû-i fıkıhtaki pek çok meseleye yansımasının olduğu tespit edilmiştir. Onun için fakihler belirli kişilere, yerlere, zamanlara, durumlara ve nesnelere özgü olduğunu tespit ettikleri hükümlere başka meseleleri kıyas yapmaktan kaçınmışlardır. Bununla birlikte aslın hükmünün ona özgü olup olmadığını tespit ederken içtihat farklılıklarının bulunduğu ve bu sebeple söz konusu şartın bazı meselelerde uygulanmasında farklı sonuçlara ulaşıldığı ve ihtilaf edildiği görülmüştür."
