abstract: "Türk-İslâm devletlerinde uygulanan kardeş katli, İslâm ceza hukuku açısından meşruiyeti hâlen tartışılan önemli bir konudur. Tarihçiler tarafından siyasi bağlamda ele alınan bu mesele, hukukî yönden ise yeterince incelenmemiştir. Bu çalışma, kardeş katlinin tarihsel arka planını dikkate alarak uygulamanın İslâm hukuku çerçevesindeki dayanaklarını analiz etmektedir. Dönemin âlimlerinin görüşleri değerlendirilmiş; ayrıca Mecelle hükümleri üzerinden konunun fıkhî temelleri araştırılmıştır. Araştırma, hanedan içi çatışmaları tasvir etmekten ziyade, mezheplerin kardeş katline ilişkin yaklaşımlarını belirleyip bu yaklaşımların hukukî tahlilini yapmayı amaçlamaktadır. Osmanlı örneği başta olmak üzere Türk-İslâm devletlerindeki uygulamalar incelenmiş; Karahanlı, Gazneli ve Büyük Selçuklu devletlerinde kardeş katline rastlanmazken, ilk örneğin Anadolu Selçuklu döneminde ortaya çıktığı tespit edilmiştir. Çalışmanın önemi, Türk-İslâm devletlerindeki veraset usulleri ve iktidar mücadelelerinin İslâm hukuku ışığında değerlendirilmesine imkân tanımasından kaynaklanmaktadır. Ulemanın konuya dair tutumlarının incelenmesi hem literatüre özgün katkılar sunmakta hem de İslâm hukuku perspektifinden tarihî süreçlerin daha doğru anlaşılmasına yardımcı olmaktadır."
