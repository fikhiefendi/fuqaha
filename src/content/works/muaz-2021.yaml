abstract: "Bu tezimde, Hanefi mezhebi ile ilgili önemli konuları ele aldım. İmam Ebu Hanife ve Kadı Ebu Yusuf'un tercümesine bir giriş sunarak başladım ve Kadı Ebu Yusuf'un mezhep ve fıkıhçı tabakalarındaki ilmi yeri ve derecesini beyan ederek bitirmek için ilmi hayatından ayrıntılı bir şekilde bahsettim. Ebu Yusuf'un kadıların kadısı olması ve hüküm vermede büyük yeri olması nedeniyle imamıyla hüküm konusundaki ihtilafları büyük iz bıraktı; işte beni bu bölümü seçmeye sevk eden de buydu ki, İmam Ebu Hanife'nin ihtilafa düştüğü meseleler tezime konu olsun. Böylece her meselenin kaynağını gösterip ihtilaf konusunu belirttim ve sonrasında o mesele hakkında mezhebin en tercih edilen görüşünün açıklamasıyla diğer mezhep imamlarının görüşlerini ele aldım. Daha sonra bu dönemin insanlarının durumları için uygun ve tercih edilen görüşün açıklamasının ve -bunları ilişkilendirmek mümkünse- yargı hükümleri mecmuasının esas maddeleriyle görüş ve delilleri ilişkilendirerek bitirmek için görüşlerin ve anlaşmazlıkların delillerini sundum. Ardından sunulan mesele hakkında 3 mezhepteki ağır basan görüşleri mezhep imamlarının dayandığı delil hakkında ihtilafa düşüldüyse delilleriyle birlikte zikrederek açıkladım. Her konuyu esas olarak ihtilafın etkisini açıklığa kavuşturup tatbik ederek sonlandırdım."
