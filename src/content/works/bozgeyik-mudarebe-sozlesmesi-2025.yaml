abstract: "Ticarî faaliyette bulunmak üzere taraflardan birinin sermaye, diğerinin ise emeğini ortaya koyduğu ve elde edilen kârın paylaşılmasını amaçlayan mudarebe sözleşmesi; tarihte olduğu gibi günümüzde de farklı alanlarda ve farklı görünümleriyle kullanılmaya devam etmektedir. Türkiye'de hukuk biliminin hem fıkıhtan hem de kıta Avrupası sisteminden etkilenmiş olan ikili yapısı dikkate alındığında, hukukî müesselerin derinlikli biçimde anlaşılabilmesi için her iki hukuk sahasını beraberce göz önünde bulundurmak gerektiği aşikârdır. Bu inceleme sırasında hukuk sistemlerinin birleştikleri ve ayrıştıkları noktaların ihmal edilmemesi de ayrıca önem arz etmektedir. Tezde mudarebe sözleşmesinin hukukî niteliği, benzer kurumlarla ilişkisi, mudarebeye uygulanacak hükümler, günümüz mudarebe uygulamalarına dair meseleler ve diğer hususlar Hanefî mezhebini merkeze yerleştiren ve kıta sistemi ile bağlantı noktalarını dikkate alan bir yöntemle ele alınmaya çalışılmıştır."
