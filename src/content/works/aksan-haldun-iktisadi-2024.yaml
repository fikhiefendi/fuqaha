abstract: "''İbn Haldun'un İktisadi Görüşleri'' adlı tez çalışmamız İbn Haldun'un genel görüşleri ve iktisadi görüşlerini kapsayan iki ana bölümden oluşmaktadır. Birinci bölümde, İbn Haldun'un hayatı, ilmi şahsiyeti, eserleri ve genel düşünce yapısının temelini oluşturan umrân ilmi, asabiyet, bedevîlik ve hadarîlik kavramları incelenmiştir. İbn Haldun'un fikirlerinin oluşmasına etki eden durumlar ve deneyimlerine dikkat çekilmiş ve disiplinler arası bir yaklaşımla ifade ettiği iktisadi görüşlerine, bu görüşler arasındaki ilişkiye bu kavramlar ekseninde dikkat çekilmiştir. İkinci bölümde ise İbn Haldun'un iktisadi alandaki görüşleri çerçevesinde iktisadi faaliyetlerin insan açısından zorunluluğu, mülkiyet, emek, kazanç yolları, rızık, devletin ticari hayattaki görevleri, vergi, kalkınma, enflasyon, piyasa ve pazar konuları ele alınmıştır. İlgili iktisadi konular ayet ve hadisler çerçevesinde değerlendirilmiş, bu konuların İbn Haldun'un düşünce yapısındaki durumuna temas edilmiş ve modern iktisatçıların görüşleri ile karşılaştırılarak ortaya sunduğu fikirler analiz edilmiştir. Güncel problemler dikkate alınarak neden sonuç ilişkisi içerisinde bu problemlerin temeline inilmiş ve İbn Haldun'un sunmuş olduğu çözüm önerileri belirtilmiştir."
