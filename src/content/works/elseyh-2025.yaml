abstract: "Bu çalışma, insan boyutunu Kuran ve tefsir perspektifleriyle kesiştiren ve İslam'ın bakıma ve adalete muhtaç bir grup (yetim) için duyduğu duyarlılığı yansıtan“ictimâî ve fıkhî Tefsirlerde Yetim”konusunu karşılaştırmalı tematik bir çalışma olarak ele almaktadır. Çalışma, Kuran'da“yetim”teriminin anlamlarını aydınlatmayı, terimin geçtiği bağlamları incelemeyi, objektif, analitik ve karşılaştırmalı bir metodolojiyle sosyal ve fıkhî boyutlarını analiz etmeyi amaçlamaktadır. Araştırma iki ana bölüme ayrılmıştır: İlk bölümde teorik çerçeve, temel tanımlar, yetim teriminin Kuran'da geçtiği yerler ve anlamları ele alınmaktadır. İkinci bölümde yetimlerle ilgili ayetlerin sosyal ve fıkhî yönleri tartışılmakta, yetimlerin temel hakları ve onlara sağlanan bakım tematik bir şekilde incelenmekte ve bu yönler fıkhî ve sosyal bakışla yapılan yorumlar ışığında analiz edilmektedir. Çalışma, yetimleri gözetmenin Kuran'ın hukûkî ve ahlakî yapısında merkezi rolü üstlenmekte olması gibi çeşitli bulgularla son bulmaktadır. Ayrıca, yetimlere karşı toplumun görevini doğru bir şekilde anlamak için fıkhî ve ictimâî yorumların birlikte ele alınmasının önemini vurgulamaktadır. Dahası, çalışma, iyilik, bakım, adalet ve merhamet kavramlarının yetimlere ilişkin Kuran'ın amaçlarını anlamak için temel anahtarlar olduğuna işaret etmektedir."
