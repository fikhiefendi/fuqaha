abstract: "Bu araştırma, Mâlikî mezhebinin Mağribli son büyük fakihlerinden İmâm Mâzerî'nin (ö.536/1141), Mâlikî mezhebinde yeni bir dönemin başlatıcısı kabul edilen Îzâhu'l-mahsûl min Burhâni'l-usûl adlı usul eserini konu almaktadır. Araştırmada hedeflenen ana amaç, İmâmü'l-Harameyn el-Cüveynî'nin (ö.478/1085) el-Burhân'ının icmâ bahsine kadar şerhi olan Îzâhu'l-mahsûl'ü tanıtmak ve eserde yer alan“umum-husus”bölümü çerçevesinde eserin usul ilmindeki yerini tespit etmektir. Bu amaç doğrultusunda tezde, Mâzerî'nin Îzâhu'l-mahsûl'de yer verdiği umum-husus görüşleri, Cüveynî'nin el-Burhân'ı ile mukayese edilerek aktarılmıştır. Daha sonra eserin usul ilmindeki yeri, Mâzerî'nin“umum-husus”bölümü çerçevesinde takip ettiği konu tasnifi ve metodunun belirlenmesi ve istifade ettiği kaynaklar ve kendisinden istifade eden kaynakların tespit edilmesi suretiyle tezde ortaya koyulmuştur. Elde edilen sonuca göre Îzâhu'l-mahsûl usul ilmine, mütekellimin usul metodunun sistematikleşmesi hususunda katkı sağlamıştır. Zira bu eser mütekellimin metodla kaleme alınan ilk eserlerden biri olan el-Burhân'ın şerhidir. Bununla birlikte Mâzerî'nin ana kaynaklarından birinin Bâkıllânî'nin et-Takrîb'i olduğu tespit edilmiştir. Mâzerî, her ne kadar Bâkıllânî'nin adını zikretmese de umum-husus konusunda zikrettiği görüşlerini, et-Takrib'den aldığı tezde ilgili bölümlerde ortaya koyulmuştur. Bu anlamıyla Îzâhu'l-mahsûl, mütekellimin metodla kaleme alınan el-Burhân ve et-Takrîb arasında bir ilişki kurarak mütekellimin usulünde tartışılan meselelerin daha sistematik hâle gelmesine katkı sağlamış ve sonraki eserlere kaynaklık etmiştir."
