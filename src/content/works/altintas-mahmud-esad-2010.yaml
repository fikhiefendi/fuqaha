abstract: "Mahmud Esad Seydişehrî, Osmanlı Devleti'nin son yarım asrında yaşamış önemli bir kişidir. Hukuk-ı Aile Kararnamesi'ni hazırlayan komisyona başkanlık etmiştir. İslam tarihi, hadis, dinler tarihi, fıkıhla ilgili çok sayıda kitap yazmıştır. Islah, tecdid, banka, sigorta, ictihad kapısı gibi on dokuzuncu yüzyılın önemli tartışma konularında fikirlerini ortaya koymuştur. Fıkıh düşüncesi eklektik bir yapıya sahiptir."
