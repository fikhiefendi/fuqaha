abstract: "Şeâir, genel hatlarıyla İslâm dininde alâmet-i fârika olarak ifade edilen itikâdî esaslar, Yüce Allah'a yaklaşmak ve O'nun rızasını kazanmak amacıyla yapılan ibadetler, mukaddes mekan ve zamanlardır. Bu kavrama bazı fıkıh alimlerince özel bir önem verilmiş ve farklı bir statü tanınmıştır. Zira şeâire tazim, Kur'ân-ı Kerîm'in bildirmesiyle kalplerin takvalı olmasından kaynaklanır ve şeâir Müslüman olma ve Müslüman kalma bilincini canlı tutar. Bu itibarla şeâirin doğru anlaşılması ve bilinmesi çok önemlidir. Şeâir, başlangıçtan günümüze kadar hassaten tefsir ve fıkıh başta olmak üzere farklı ilim dallarında çeşitli açılardan ele alınmıştır. Son zamanlarda bu alandaki çalışmalar da daha çok sembol kavramı üzerine yoğunlaşmaktadır. Ne var ki -tespit edilebildiği kadarıyla- ülkemizde onun mahiyeti, örnekleri ve terki halinde uygulanacak cezaî müeyyidelerinin fıkhî açıdan incelendiğine dair müstakil bir çalışma bulunamamıştır. Bu sebeple başta hac, kurban, ezan, kamet, cemaatle namaz ve revâtip sünnetler gibi şeâirden sayılan meseleler olmak üzere konu ile ilgili bir tezin hazırlanmasına ihtiyaç duyulmuştur. Bu tez ile dinî şiârların tespit edilmesi; onlara hürmet gösterilmesi ve saygısızlıktan kaçınılmasına katkı sağlanması hedeflenmiştir."
