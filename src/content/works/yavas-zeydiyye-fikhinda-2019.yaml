abstract: "fakihlerinden Ebü'l-Hüseyn Ahmed b. Ebî Bekr el-Kudûrî'nin Muhtasar adlı eserinin“siyer”bölümlerinin çeşitli yönlerden karşılaştırılması suretiyle, bu iki mezhep arasındaki benzerlik ve farklılıkları ortaya çıkarmayı amaçlamaktadır. Çalışma bir giriş ve üç bölümden oluşmaktadır. Girişte, araştırmanın konusu ve amacı, sınırları, metodu, literatür ve İslâm devletler hukukuna dair genel bilgiler verilmiştir. Birinci bölümde çalışmaya konu edilen Tecrîd ve Muhtasar'ın müellifleri, Zeydiyye ve Hanefî mezhebinin başka bazı öncü imamları, bu iki mezhebe ait önemli bazı eserler ve mezheplerin yayıldıkları bölgeler hakkında bilgi verilmiştir. İkinci bölümde Tecrîd ve Muhtasar şekil, etkilendiği kaynaklar, dil ve üslup bakımından karşılaştırılmıştır. Üçüncü bölümde ise Tecrîd esas alınarak iki eserin“siyer”bölümlerinin mukayesesi yapılmıştır."
