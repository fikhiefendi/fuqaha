abstract: "Bu çalışmada Türkiye'de ve Körfez İşbirliği Konseyi (KİK)'ne üye ülkelerdeki katılım bankalarının 2016-2019 yılları arasındaki finansal performans ve etkinlik skorlarının belirlenmesi ve karşılaştırılması amaçlanmaktadır. Bu kapsamda bankalara ait finansal veriler ilgili yıllardaki bilanço ve gelir tablosundan elde edilmiştir. Elde edilen veriler, finansal performansların belirlenmesi için TOPSIS yöntemiyle, finansal etkinlik skorlarının belirlenmesi için ise Veri Zarflama Analizi kullanılarak analiz edilmiştir. Veri zarflama analizi yapılırken çıktı maksimizasyonu esas alınmıştır. TOPSIS yönteminde kullanılacak ağırlık değerleri ise entropi ağırlık yöntemi kullanılarak hesaplanmıştır. Performans analizi sonuçlarına göre, Türkiye'de yer alan katılım bankalarından Kuveyt Türk'ün 2018 yılı hariç diğer yıllarda ilk sırada yer aldığı ve bunun aksine Albaraka Türk'ün ise son iki yılda performans sıralamasında en son sıraya gerilediği tespit edilmiştir. Ülkeler arası finansal performans karşılaştırmasına ilişkin sonuçlar incelendiğinde ise, Birleşik Arap Emirlikleri'nin 2018 yılı hariç diğer üç yılda ilk sırada yer aldığı tespit edilmiştir. 2018 yılında performans sıralamasında ilk sırada Umman yer almıştır. Türkiye'nin bu performans sıralamasında 2016 yılında ikinci sırada olduğu; diğer üç yılda ise üçüncü sırada olduğu görülmüştür. Bahreyn'in ise performans sıralamasında son sıralarda (6. veya 7.) yer aldığı tespit edilmiştir. Bankaların etkinlik analizi sonuçlarına göre ise, 2016 ve 2018 yıllarında sadece tüm ülkelerin teknik etkinlik skorunun 1,00 olduğu yani etkin olduğu bulunmuştur. 2017 yılında ise Katar hariç diğer ülkelerin teknik etkinlik skorları 1,00 olduğu için etkin olduğu tespit edilmiştir. Bu sonuçların aksine 2019 yılında sadece Kuveyt ve Birleşik Arap Emirlikleri'ndeki katılım bankalarının etkin olduğu görülmüştür."
