abstract: "“Osmanlı Dönemi Fetva Mecmualarında Ceninle İlgili Hükümler”adlı çalışmamız, 17-19. yüzyıl Osmanlı hukukuna ait temsil gücü yüksek bazı fetva mecmualarının incelenerek ceninle ilgili fetvaları tespit ve tahlil amacıyla yapılan bir çalışmadır. Tezimiz, bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde, ceninin anne karnındaki oluşumunun hukuki açıdan önemi belirtilip nasslar ve tıbbi veriler ışığında açıklanmaktadır. İkinci bölümde ise, Osmanlı fetva literatüründen ceninin yaşam, nesep, miras, vasiyet ve vakıfla ilgili hakları, ıskât-ı cenin ve ceninin iddet ile ilişkisi konuları incelenmiştir. Son olarak, çalışmanın değerlendirilmesi yapılmış olup gerekli fetvaların güncel halleri zikredilmiştir. Anahtar Kelimeler İslam Hukuku, Osmanlı Fetva Mecmuaları, Cenin, Çocuk Düşürme"
