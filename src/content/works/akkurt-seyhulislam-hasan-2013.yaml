abstract: "1876 yılı Osmanlı Tarihi literatürüne üç padişah yılı olarak geçmiştir. Sultan Abdülaziz 30 Mayıs 1876?da, Sultan Beşinci Murad ise 31 Ağustos 1876?da Şeyhülislam fetvası ile tahtlarından indirilmişlerdir. Her iki padişahın da hal? fetvasını imzalayan kişi Şeyhülislam sıfatıyla Hasan Hayrullah Efendi?dir. Serasker Hüseyin Avni Paşa?nın liderliğinde gerçekleştirilen 30 Mayıs 1876 askeri darbesinin etkisi kısa sürmüştür. Sultan İkinci Abdülhamid, 27 Haziran 1881?de kurulan Yıldız Mahkemesinde 30 Mayıs 1876 askeri darbesinde rolü olanlarla hukuk önünde hesaplaşmış, Hasan Hayrullah Efendi mahkemede yargılanmadığı halde suçlu bulunarak diğer mahkûmlarla birlikte Tâif Kışlasında hapsedilmiş ve 18 yıl kaldığı hapiste vefât etmiştir. Siyasi tarih alanında biyografik çalışmaların tarih ilmine katkıları şüphesiz çok önemlidir. Hasan Hayrullah Efendi, modern anlamdaki askeri darbelerin ilki sayılan 30 Mayıs 1876 darbesine Şeyhülislam olarak destek vermiştir. O dönem siyasetine etki etmiş ve vazifesi esnasındaki siyasi faaliyetleri, gerçekleştirilen darbeyi incelerken daha geniş bir çerçeveden bakmamızı sağlayacaktır. Araştırmanın bütününde tarih araştırmalarında modern metotlar kullanılarak konu tarafsız bir görüşle incelenmeye çalışılmıştır."
