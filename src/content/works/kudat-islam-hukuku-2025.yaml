abstract: "Vakıflar toplumun dinî, içtimâî, kültürel hizmetlerini karşılama ve diğer hayır işleri yapma gibi belirli amaçlara hizmet etmek üzere kurulmaktadır. Bu vakıfların sermayesi işletilerek şartnamede belirlenen amaçlar doğrultusunda sarf edilmektedir. Vakıf mallarının değerlendirilmesinde farklı yol ve yöntemler mevcuttur. Para vakıflarından oluşan vakıf sermayesinin işletilmesinde, söz konusu farklı yöntemlerin daha belirgin ortaya çıktığını görmekteyiz. Son zamanlarda para vakıfları, sosyal sermaye, yatay kalkınma ve yoksullukla mücadele gibi faaliyet ve organizasyonlara örnek teşkil edebileceği düşüncesinden hareketle büyük ilgiye mazhar olmakta ve değişik açılardan bilimsel araştırmalara konu edilmektedir. Türkiye özelinde, mirası devralınan Osmanlı tecrübesinde hukukî, içtimâî ve iktisâdî hayatta muazzam bir yelpazeye sahip olan para vakıfları, günümüzde birçok alanda büyük etki yapma potansiyeline sahiptir. Çalışmada para vakıfların işletilmesinde ortaklık türlerinin tespit ve tahlili yapılmakta, bu alanda kaleme alınan çalışmaları analiz etmek için tanımlayıcı analitik yaklaşım benimsenmektedir. Bu bağlamda İslâm hukukunun belirlediği sınır ve şartlar çerçevesinde vakıf sermayelerinin, şirketleşme yoluyla uygun bir şekilde kullanma konusundaki bazı pratik deneyimler de gözden geçirilmiştir. Bu yöntem aracılığıyla vakıf sermayesinin toplum yararına üretim, yatırım ve ticaret gibi projelere kanalize edilerek ihtiyaç duyulan mal ve hizmetleri temin eden projelerinin finansman sorununa bir çözüm olabileceği sonucuna varılmaktadır. Bu nedenle para vakıfları kendi başına finansman sağlayamayan sektörlerin bu fondan yararlanmak suretiyle mal ve hizmetlerin üretiminde, müspet yönde ivme sağlanabilir. Kâr amacı gütmeyen ve kamu ile özel teşebbüs yanında üçüncü sektör olarak yer alan bu organizasyonlar, gerçek fizibilite çalışmalarına dayanarak doğru bir şekilde üretim ve hizmet sektörüne kanalize edilirse, sürdürülebilir kalkınmaya, iktisadî, içtimâî ve çevre gibi birçok alanda müspet etki yapacaktır. Araştırma, hukukî altyapının uyumlaştırılması ve iktisadî şartların sağlanması halinde, para vakıf fonlarının şirketleşme yoluyla değerlendirilmesini mümkün görmektedir."
