abstract: "Bu tez, 14. yüzyılda yaşamış Mâlikî hukukçu İbn Ferhûn'un siyâset-i şer'iyye nazariyesi hakkındaki konumunu tespit etmek amacıyla hazırlanmıştır. Bu tespit yapılırken tezimize esas teşkil eden Tebsıratü'l-hükkâm fî usûli'l-akzıye ve menâhici'l-ahkâm adlı eser üzerinde örneklem metodu kullanılarak müellifin siyâset-i şer'iyye kavramını nasıl ele alıp değerlendirdiği ortaya konulmuştur. Bu bağlamda müellifin başlık düzenine bağlı kalınmış, müellifin iktibas yaptığı kaynakların ulaşılabilir olanlarına gidilerek müellifin değerlendirmelerindeki özgünlüğünün boyutu tespite çalışılmıştır. Bu amaç doğrultusunda çalışma bir giriş ile üç bölümden oluşmaktadır. Birinci bölüm, İbn Ferhûn dönemi siyasî ve sosyal yapı ile müellifin hayatı ve eserleri; ikinci bölüm, siyâset-i şer'iyyenin kavramsal çerçevesi içerisinde siyâset-i şer'iyyenin meşrûiyyeti, dayanakları, tezahürleri ve siyâset-i şer'iyye ekseninde oluşan kurumsal yapılar; üçüncü bölüm ise İbn Ferhûn'da siyâset-i şer'iyye nazariyesi başlığı altında siyasetin konumu, siyasetle hüküm yetkisi ve taraflar ile örnek hükümler bağlamında siyâset-i şer'iyye şeklindeki başlıklarından oluşmaktadır."
