abstract: "Faizsiz bankacılık sistemine dini nedenler, ekonomik nedenler, sosyal nedenler, politik nedenlerden dolayı ihtiyaç olabilir. Faizin mikro ve makroekonomiye olumsuz etkileri nedeniyle faiz oranlarının yüksek olmaması hep arzu edilir. Politik olarak inanç temelli yönetim biçimini tercih etmiş devletler faizli bir sistemden kaçınmak için faizsiz bankacılık sistemine ihtiyaç duyabilirler. Katılım bankaları veya İslami finans kuruluşları her ne kadar faizsiz bir model hedefleseler de sonuçta bir bedel talep etmeden borç verememekte ve bir bedel ödemeden mevduat toplayamamaktadırlar. Katılım bankaları adı faizsiz bankacılık olsa da uygulamada tam faizsiz bir sistem gibi çalışamamaktadır. Bu nedenle kâr amacı taşımayan faizsiz bir bankacılık“sosyal bankacılık”modeli üzerinde çalışılmıştır. Bu çalışma yapılırken bankacılık ve katılım bankacılığının günümüze kadar geldiği bilgi birikiminden yararlanılmıştır. Türkiye'de faaliyet gösteren mevduat bankaları ve katılım bankalarının kesintisiz 16 yıllık verileri üzerine bir dizi istatistiksel analizler yapılmıştır. Faiz kavramı içerisinde bulunan bankanın kâr beklentileri, faaliyet giderleri ve riskleri ayrı ayrı analiz edilmiştir. Bu analizlerde ağırlıkla karlılığı etkileyen faktörler ve faiz oranlarını etkileyen faktörler üzerinde durulmuştur. Böylece faizi zorunlu kılan etmenler ve faiz oranlarına etkileri araştırılmıştır. Bu analizlerden yola çıkarak kâr amacı olmayan faizsiz bir banka modeli önerilmiştir. Bu sistemin çalışabilmesi için öncelikle zekât fonunun bulunması, sosyal bankacılık için yasal mevzuatın izin vermesi, bankanın çalışma usul ve esaslarının bir üst kurul tarafından düzenlenmesi, yetkilendirilmesi, faaliyet izni verilmesi ve denetlenmesi gerekmektedir. Çalışma tamamen faizsiz bir banka modeli üzerine bir çalışma olması nedeniyle diğer çalışmalardan ayrılmaktadır. Ancak faizsiz bir bankanın faizsiz ekonomik sistem içerisinde ve ekonomik sistemin bu modelini destekleyecek unsurlarla donatıldığında mümkün olabileceğini de unutmamak gerekmektedir. Anahtar Kelimeler; faizsiz bankacılık, faizin tarihçesi, karz-ı hasen, riba, sosyal bankacılık"
