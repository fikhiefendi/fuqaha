abstract: "İslam hukukunda ortaya konan hata nazariyesi, bir taraftan kişinin gerçek iradesini ihmal etmemeye diğer taraftan da hukuki işlemlerde güven ve istikrarı sağlamaya yönelik tedbirler getirmektedir.Hata, çağdaş literatürde ?Galat? terimiyle ifade edilmektedir. İslâm hukukunda konu edilen hata teorisinin mahiyeti ile Türk hukukundaki hatanın mahiyeti bazı noktalarda önemli farklar barındırmaktadır.Hata teorisi konusunda İslam hukukunun en önemli özelliği, akit nazariyesi esas alınarak temellendirilmesidir. Hatanın, akdin kurucu unsurları, inikat, sıhhat ve bağlayıcılık şartlarından birisinin veya bir kısmının bulunmaması sonucunu doğurduğu hallerde hata etkili olmakta, değilse itibara alınmamaktadır.?İslâm Borçlar Hukukunda Hata? isimli tezimiz, ?Giriş? ve ?Sonuç? kısımları hariç üç bölümden oluşmaktadır. Birinci bölümde, çalışmamıza temel teşkil etmesi için hukuki işlem, irade beyanı ve irade ile beyan arasında meydana gelen uyuşmazlık halleri ele alınmıştır.İkinci bölümde hatanın tanımı, hata-galat ilişkisi, hata ile ilişkili kavramlar, borçlar hukuku dışında hata halleri, hatanın hukuk sistemlerindeki yeri ve çeşitleri üzerinde durulmuştur.Üçüncü bölümde ise hatanın hukukî sonuçları ile hataya itibar edilen ve edilmeyen haller irdelenmiştir."
