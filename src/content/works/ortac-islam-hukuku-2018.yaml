abstract: "İslamiyet, diğer sistemlerin aksine, ortaya çıktığı günden beri içerisinde birçok insan hakkını barındırmış ve bu hakları en asli kaynakları olan Kur'an-ı Kerim ve hadis-i şerifler ile güvence altına almıştır. İslam dini, genel olarak tüm insanlığa haklarını bahşettiği gibi, özel olarak anne-babaya ve çocuklara da haklarını bahşetmiştir. Bu haklar, aynı zamanda birer sorumluluktur. Şöyle ki, çocukların hakkı olan şeyler, aynı zamanda anne-babaların çocuklarına karşı sorumluluklarıdır. Veya anne-babaların hakları, çocukların anne-babalarına karşı sorumluluklarıdır. Çalışmamızın giriş bölümünde insan hakları kavramına, bu kavramın tarihi sürecine ve İslam'daki insan haklarına temas ettikten sonra, İslam'ın anne-babalar ile çocuklara vermiş olduğu değere değindik. Birinci bölümde anne-babaların, çocuklarına karşı sorumluluklarına yani çocukların haklarına değindikten sonra, ikinci bölümde anne-babaların haklarını/çocukların anne-babalarına sorumluluklarını ele aldık. Bu haklar ile sorumlulukları diyanî ve kazaî şeklinde ikiye ayırdık. Son bölümünde de çalışmamız neticesinde vardığımız sonuçları özetle aktardık."
