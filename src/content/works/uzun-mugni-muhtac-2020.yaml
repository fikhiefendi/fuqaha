abstract: "İslam hukukunun gelişmesinde fakihler arasındaki ihtilafların rolü büyük olmuştur. İhtilaflar açısında usûl ve füru üzerine yapılan incelemelere bakıldığında bu ilimin muntazam arka planı görülmektedir. Bizde buradan hareketle Ebû Hanîfe'nin görüşlerine yer veren Muğni'l-Muhtâc adlı eser üzerine çalışmayı düşündük. Eserde yüz on dört noktada Ebû Hanîfe'nin adının doğrudan ya da dolaylı olarak zikredildiği yerleri tespit ettik. Muğni'l-Muhtâc kitabının tamamını kapsayan bu yüz on dört madde hemen hemen kitabın bütün konu başlıkları altında dağılmış durumdadır. Çalışmamız, giriş dışında Ebû Hanîfe'nin görüşlerinin incelendiği üç bölümden oluşmaktadır. Bu bölümlerde Ebû Hanîfe'ye ait görüşleri inceledikten sonra Hanefî kaynaklarındaki yerlerini tespit ettik. Gerekli gördüğümüz yerlerde ayrıntılı açıklamalar yaptık. Sonuç bölümünde ise çalışmamıza dair elde ettiğimiz sonuçları ve değerlendirmeleri belirttik. Ayrıca benzer çalışmaların ortak sonuçlarını da ayrıntılı bir şekilde sonuç bölümüne ekledik. Bunlara ek olarak taranan kaynak sayısının fazla olması ise Hanefî kaynakları hakkında bilgi sahibi olunmasını katkısı sağlayacaktır."
