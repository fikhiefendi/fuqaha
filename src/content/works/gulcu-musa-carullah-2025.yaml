abstract: "Mûsâ Cârullah Bigiyef, içtihat ve maslahat anlayışıyla dikkatleri üzerine çekmiş bir alimdir. O bu yönüyle ve özellikle kutup bölgelerinde ibadet vakitlerinin belirlenmesiyle ilgili görüşleri açısından incelenmeye değer bulunmuştur. Cârullah'ın, nassların ruhuna bağlı kalırken, maslahat ilkesine dayalı pratik ve adil çözümler önermesi, İslam hukukunun esneklik ve güncellik kazanmasına katkı sağlamıştır. Bu tezde, Cârullah'ın İslam hukuk geleneğine bağlı kalmakla birlikte, çağının toplumsal ve coğrafi şartlarına uyum sağlayan yenilikçi içtihat yaklaşımı analiz edilmiştir. Aynı zamanda Cârullah'ın fıkıh ve usul literatürüne getirdiği eleştiriler, taklide karşı tavrı, içtihadın zarureti ve maslahatı bağımsız bir delil olarak değerlendirmesinden de söz edilmiştir. Kutup bölgelerinde namaz ve oruç gibi ibadetlerin ifasında karşılaşılan yeni problemler, Cârullah'ın teorik yaklaşımının pratikteki yansımaları açısından ele alınmıştır. Bu çalışmalar, Cârullah'ın temel eserleri ile ilgili klasik ve güncel kaynaklar karşılaştırmalı yöntemle incelenerek, görüşlerinin İslam hukuku içerisindeki özgün yeri ortaya konulmuştur. Cârullah'ın içtihat ve maslahat anlayışı, dinamik, uygulanabilir ve çağdaş ihtiyaçlara cevap verebilen bir model sunduğu söylenebilir."
