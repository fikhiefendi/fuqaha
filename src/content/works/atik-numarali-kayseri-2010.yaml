abstract: "Osmanlı tarihinin temel kaynaklarından olan Şer'iyye Sicilleri dava tutanakları olmanın yanı sıra yazıldığı dönemin sosyal, siyasi, iktisadi, dini bütün yönlerini yansıtan tarihi kaynaklardır. İşte bu sebeple çalışmış olduğumuz Kayseri Şer'iyye Sicilli'nde bulunan 235 adet belge günümüz Türkçesi'ne çevrilip değerlendirilmesi yapılmıştır.Çalışmamızın başında Osmanlı hukuku hakkında ana hatlarıyla bilgi verilip, Şer'iyye Sicillerinin ortaya çıkışı, tarihi gelişimi, önemi ve kapsadığı belgeleri ele alıp izah etmeye çalıştık. Belgeler transkribe edilirken dil yapısı bozulmadan günümüz harflerine aktarılmıştır.Aynı şekilde belgeler türlerine göre sınıflandırılmıştır.Bir başka bölümde ise belgeler alım-satım, miras-tereke, evlenme-boşanma, vâsi tayini gibi konularına göre sınıflandırılmıştır. Müslimler ile birlikte yaşayan gayr-i müslimler için bir asimile politikası uygulanmamış, kendi dinlerini muhafaza etmiş ve genel itibariyle de müslimlerle ilişkilerinin iyi olduğu tespit edilmiştir.Değerlendirme bölümünde ise belgeler; idâri, içtimâi ve iktisâdi yönden değerlendirilmiştir. Tezin sonunda yer alan ekler kısmında teze konu olan sicilin orjinali fotokopi yoluyla çoğaltılmış, bir nüshası verilmiştir.Tüm bu çalışmalar sonucunda, Kayseri'nin dolayısıyla Osmanlı Devleti'nin idâri, sosyal ve ekonomik yönden H.1085-M.1674 yıllarına ışık tutabilecek bilgiler elde edilmiştir."
