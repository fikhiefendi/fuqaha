abstract: "Naslar, sayı bakımından sınırlı olduğu için, değişken ve sınırsız olayları miktarca kuşatamamaktadır. Bu durumun sonucunda fıkhî alanda oluşan boşluğu doldurma rolünü de ictihad faaliyeti üstlenmiştir. Dokuzuncu asrın önemli âlimi İmam Süyûtî, bu faaliyeti hayatının merkezine koymuş ve kendisine yöntem olarak belirlemiştir. O, ictihad konusunun önemine işaret etmek için üç eser kaleme almıştır. Bu üç eser ise;“Takrîru'l-istinâd fî teysîri'l-ictihâd”,“er-Red ʿalâ men aḫlede ile'l-arż ve cehile enne'l-ictihâde fî külli ʿaṣrin farż”ve“İrşâdü'l-mühtedîn ilâ nusrati'l-müctehidîn”dir. Süyûtî ictihad risâlelerinde ictihadın farz-ı kifâye olan dinî bir yükümlülük olduğunu dile getirir. Hiçbir zaman diliminin bu görevi yerine getirecek müctehidlerden yoksun olmayacağını ifade eder. Ayrıca konuya dair ısrar ve değerlendirmelerinde özellikle Şâfiî mezhebine mensup âlimlerin görüşlerini delil olarak madde madde sıralamıştır. Çalışmanın amacı Süyûtî'nin ictihada yaklaşım tarzının ortaya konulmasıdır. Çalışmada Süyûtî'nin hayatı, ictihada dair yazmış olduğu üç risâlesi ekseninde ictihada bakışı ve ictihadı temellendirmesi ele alınmıştır. Ayrıca ictihad bağlamında değindiği bazı meselelere de yer verilmiştir."
