abstract: "Bu tezde Federal Almanya Cumhuriyeti'nde bulunan iki büyük Müslüman derneğinin üyeleri üzerinde nasıl bir din algısı inşa ettikleri karşılaştırmalı olarak çalışılmıştır. Araştırmamıza konu olan iki dernekten birisi Diyanet İşleri Türk İslam Birliği, diğeri ise İslam Toplumu Millî Görüş'tür. Araştırmanın temel kavramı olan“din”in katılımcılar için ne anlama geldiği, varlık sebebi, hayatlarındaki konumu ve dinlerinin en beğendikleri yönü karşılaştırmalı olarak ortaya konulmuştur. Katılımcıların Müslüman bir bireyin nasıl olması gerektiği yönündeki fikirleri, Kur'an ve Sünneti nasıl tarif edip anladıkları ve hayatlarına geçirdikleri, dini konularda hangi hocaları ve eserleri takip ettikleri, din ve siyaset ilişkisini nasıl değerlendirdikleri, dinde kadın erkek ilişkisi konusunda ne düşündükleri, din genelinde kader konusunu nasıl anladıkları, geçmiş fetvalarla ilgili düşünceleri ve farklı bir dine mensup olan bireylerle dostluk kurmak ve evlenmek konusundaki düşünceleri ele alınmıştır. Bu çalışma temel olarak dört bölümden oluşmaktadır. Araştırmacı giriş bölümünde araştırmanın problemini, amacını, önemini ve araştırma ile ilgili araştırmaları, kapsamını ve sınırlılıklarını tanımlamıştır. Araştırmacı bu bölümde çalışmasındaki konumunu da açıklamıştır. Yine bu çalışmanın yöntemi, deseni ve verirleri toplamadaki araçları giriş bölümünde detaylı bir şekilde belirtilmiştir. Çalışmanın birinci bölümü kavramsal çerçeveden oluşmaktadır. Bu bölüm altında araştırmacı göç ve göçün sebeplerini, din ve dindarlığı, dinin ilişki içinde bulunduğu siyaset, mezhep, kültür, zihniyet ve kimlik konularını ele almıştır. Kavramsal çerçeve çizilirken çalışmaya konu olan iki dernekte her boyutuyla aktarılmıştır. Araştırmacı çalışmanın ikinci bölümünde bulgularını analiz ederek okuyucularına sunmuştur. Katılımcıların araştırma sorularına verdikleri cevaplar derneklere göre ayrı ayrı belirtilerek her başlığın altında bir karşılaştırma yapılmıştır. Sonuç kısmındaysa araştırmacı bulgularını toplamış genel bir analiz yaparak çalışmasını tamamlamıştır."
