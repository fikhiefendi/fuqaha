abstract: "Bu çalışma, 18. yüzyıl Osmanlı ilim dünyasının âlimlerinden biri olan ve kaynaklarda“Göğsügür”lakabıyla da maruf Erzurumlu Lütfullah Efendi'nin (ö. 1202/1787) hayatını, ilmî kişiliğini ve tecvid ilmi sahasında kaleme aldığı Risâle fî ilmi't-tecvîd adlı eserini konu edinmektedir. Araştırmanın temel amacı, kütüphane arşivlerinde yazma hâlde bulunan bu eseri gün yüzüne çıkararak ilmî bir tahkik süzgecinden geçirmek ve eğitim geleneğine yeniden kazandırmaktır. Çalışmanın merkezinde yer alan metin, Süleymaniye Kütüphanesi'nde muhafaza edilen ve bizzat müellif hattıyla günümüze ulaştığı için yüksek ilmî kıymete sahip olan yedi varaklık bir nüshadır. Çalışma kapsamında söz konusu eser öncelikle bilgisayar ortamına aktarılmış; metinde geçen ayet, hadis ve şahıs bilgileri tespit edilip kaynaklandırılarak eserin tahkiki gerçekleştirilmiştir. İncelemeler neticesinde müellifin, eserin telifinde her ne kadar İbnü'l-Cezerî'nin etkisinde kalsa da“fevaid”başlığı altında sunduğu şahsi mülahazaları ve farklı kıraat imamlarının rivayetlerine yer vermesiyle tecvid ilmine dair özgün ve derinlikli bir perspektif sunduğu görülmüştür. Araştırmanın bir diğer aşamasında ise Lütfullah Efendi'nin Arapça olarak akademik bir üslupla kaleme aldığı bu risâle; Anadolu coğrafyasında asırlardır en yaygın eğitim materyali olarak okutulan, daha sade dilli Karabaş Tecvidi ile muhteva, yöntem ve eğitim materyali olma özellikleri bağlamında karşılaştırmalı bir analize tabi tutulmuştur. Yapılan bu değerlendirmeler sonucunda, Lütfullah Efendi'nin eserinin yalnızca temel tecvid kurallarını ihtiva etmekle kalmadığı, aynı zamanda ileri seviye tecvid ve kıraat eğitimi için son derece uygun, akademik bir yapı sergilediği tespit edilmiştir. Nihayetinde bu tez çalışması; Osmanlı dönemi tecvid literatürüne ışık tutmakta, unutulmuş bir yazma eseri ilim dünyasına tanıtmakta ve tecvid ilminin teorik zemini ile pratik uygulaması arasındaki tarihsel gelişimi somut verilerle ortaya koymaktadır."
