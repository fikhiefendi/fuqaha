abstract: "Ülkemizde son yıllarda cinsel suç oranlarında ciddi bir artış olmuştur. Bu artışın nedenlerine ilişkin birçok varsayım ileri sürülmüştür. Bu varsayımların doğruluğu tartışmalıdır. Ancak asıl olan bu varsayımların doğruluğundan ziyade bu suçluların iyileştirilmesinde/topluma kazandırılmasında nasıl bir yol izleneceğidir. Tezde, yaşadığımız döneme has olmayan, cinsel suç artışlarına din sosyolojisi perspektifinden bakılacak ve cinsel suçlar sosyal fıkıh açısından analiz edilecektir. Bu amaçla peygamber mesajlarının evrenselliğinden yola çıkılarak, peygamberi çözüm yollarının bilimsel alana taşınması ve bir metodolojiye ulaşılması hedeflenmiştir. Tez kapsamında Hz. Âdem, Hz. Yusuf, Hz. Lut, Hz. İsa ve Hz. Muhammed'in (s.a.v.) kıssalarına yer verilecektir. Tezde ele alınan kıssalar kronolojik sıraya göre işlenmiştir. Farklı bölgelerde ve farklı zamanlarda yaşayan peygamberlerin, kendi dönemlerindeki cinsel suçlara müdahale yönteminde küçük farklılıklar olmasına karşın ağırlıklı olarak benzer yöntemler kullanıldığı görülmüştür. Bu yöntemi dört aşamaya ayırmak mümkündür. Birinci aşamada cinsel suçu önlemeye yönelik tedbirler alınmıştır. İkinci aşamada suçun ortaya çıkması ve faillerin itirafta bulunması durumunda suç ve suçlu ile ilgili çok ayrıntılı bir araştırma ve yargılama yapılmıştır. Üçüncü aşamada infaz gerçekleşmiştir. İnfazda başta kararı veren hâkim ve şahitlerle birlikte bir grup Müslüman'ın bulunması sağlanarak cezaların caydırıcılığı sağlanmıştır. Dördüncü aşamada ise hem fail, hem de toplum için normal yaşama dönme sürecidir. Peygamberi müdahale yöntemlerinde elde edilen bulgularda: Cezanın bir amaç değil, araç olarak kullanıldığı; önleyici tedbirler alınarak zinaya giden yolların kapatıldığı; zina itirafında bulunan faillerin öncelikle tövbeye yönlendirilerek suçları ile yüzleşmelerinin sağlandığı ve günahların örtülmesi esas alındığı; insan merkezli bir hukuk sistemi uygulandığı; dini hükümlerin bir yaşam biçimi olarak bütün halinde uygulanmasının esas alındığı görülmüştür. Peygamberi müdahale yöntemleri ve Nur Suresi'ndeki 'zinaya yaklaşmayın' ayeti gereği bilimsel yöntemlerden faydalanılarak cinsel eğitim programı oluşturulabilir. Zira cinsel suça/zinaya giden yolları bilmeden bu yolları kapatmak pek mümkün görünmemektedir."
