abstract: "Bu çalışmada, Hanefî âlim Ebû Bekir Muhammed b. İbrâhim el-Hasîrî'nin (ö. 500/1107)“el-Hâvî fi'l-Fetâvâ”adlı eserinin son kısmında yer verdiği mezhepler hakkındaki fetvalar konu edilmiştir. Fıkıh kitaplarındaki fetvalar daha sonraki dönemlerde yazılan eserlere de etki etmiştir. Bu bakımdan Hanefî literatürde önemli bir yere sahip olan Hasîrî'nin bu eseri örnek olarak ele alınmıştır. Çalışmanın girişinde; araştırmanın konusu, amacı, yöntemi ve kaynakları ele alınmıştır. Birinci bölümde Hasîrî'nin yaşadığı dönemde siyâsî durum, hayatı, eserleri ve özel olarak“el-Hâvî fi'l-Fetâvâ”adlı eseri, ayrıca tahkikte yararlandığımız nüshalara yer verilmiştir. İkinci bölümde Hasîrî'nin mezheplere bakışı ele alınırken Ehl-i Sünnet olarak daha çok kendi mezhebi Mâtürîdîlik ve haklarında fetvalar bulunan Mu'tezile, Rafıza, Havâric, Mürcie, Karâmita ve Cehmiyye mezheplerine bakışı konu edilmiştir. Üçüncü bölümde ise el-Hâvî fi'l-fetâvâ adlı eserinin mezhepler hakkında fetvaları içeren son kısmının tahkikli neşrine yer verilmiştir."
