abstract: "Tarih, geçmişte yaşamış toplumların siyasî, sosyal, ekonomik ve kültürel yönlerini belge ve bulgular aracılığıyla inceleyen bir disiplindir. Bu bağlamda özelikle arşiv belgeleri, Osmanlı Devleti'nin tarihini aydınlatabilmek adına önem taşımaktadır. Bu arşiv belgeleri içerisinde Eyalet Ahkâm Defterleri, bir bölgenin yerel tarihini idarî, sosyal, ekonomik vs. açılardan öğrenmek ve tahlil edebilmek bakımından önemli bir kaynak teşkil ettiği görülmektedir. Bu defterler, taşra teşkilatına dair merkezden gönderilen hükümlerin kaydedildiği resmî kayıtlar olup söz konusu dönemin yerel sorunları, uygulamalar ve toplumsal yapı hakkında doğrudan bilgileri sunmaktadır. Aynı zamanda Osmanlı hukuk sisteminin pratikteki yansımalarını göstererek, merkezdeki hukuk düzeninin taşrada nasıl uygulandığına dair bilgiler sunmaktadır. Tez çalışmasına konu olan 1746-1747 yıllarına tarihlenen, 3 Numaralı Karaman Ahkâm Defteri'nde (s. 1-96) eşkıyalık, gasp, yağma, vergi, vakıf, miras ve aile hukuku meseleleri hakkında taşrada yapının nasıl işlediği gözler önüne serilmektedir. Bu bilgilere doğru bir şekilde ulaşabilmek ve sonrasında yapılacak bilimsel değerlendirmeler için defterin Osmanlı Türkçesi'nden günümüz Türkçesi'ne düzgün bir çevirisinin yapılması gerekmektedir. Bu süreçte kelimelerin hatalı okuması gibi kusurlar, metinlerde anlam kaymasına neden olabileceği gibi tarihî yorumların yanlış yapılmasına sebebiyet verebilmektedir. Bundan ötürü kaynak güvenirliği açısından çeviri yazının aslına uygun biçimde gerçekleştirilmesi önem arz etmektedir. Çeviri yazısı üzerine yapılan çalışmalar, sadece Osmanlı Türkçesi'ne hâkim olmanın dışında dönemin dil ve kavram dünyasına hâkim olmayı gerektiren bir süreçtir. Bu çalışmada arşiv belgelerinin günümüz Türkçesine aktarılarak yerel ve genel tarih çalışmalarına katkı vereceği düşünülmektedir. Ayrıca Osmanlı hukuku, Dîvân-ı Hümâyûn, Mühimme ve Ahkâm Defterleri ile Karaman Eyaleti'nin idarî ve toplumsal yapısı konularına da değinilmiştir."
