abstract: "Şeriat hukuku, hakimlerin her türlü dürüstlük, bütünlük ve tarafsızlık içinde kendilerine sunulan ihtilaflar üzerine Yüce Allah'ın hükümlerini yerine getirme görevlerini yerine getirmelerini sağlamak için kurallar koymuştur, bu kuralların Aynısı pozitif yasalarda da geçerlidir. Yargının tarafsız, ve adil bir şekilde işlemesi için sayısız hüküm geliştirmiştir. Yargılama usülü ve belirsiz veya hakkında nas bulunmayan konularda yargıcın rolü ile yine hükümler geliştirmiştir. Yargıcın rolü pozitif hukuk ve şeriat hukuku karşılaştırması kapsamında ele alacağım önemli kounulardan bir tanesidir. Çünkü hakimin tarafsızlık ve tarafsızlık ilkesinin eylemlerini temsil eder ve aynı zamanda hakimin bağımsızlığına müdahale etmemesini ve hakimi zayıflatan ve görevlerini yerine getirmedeki rolünü etkileyen kötü niyetli iddialardan korunmasını sağlar. Bu çalışma, pozitif hukuk ve şeriat hukuku karşılaştırması kapsamında hakkında nas bulunmayan konularda yargıcın rolü, Yargı kararlarında sebep ve etkileri incelenecek. Hakkında nas bulunmayan konularda yargıcın rolü, Adaletin tecellesi ve yasalarının korunması için elzemdir. Bu çalışma sayesinde hakimlerin rolünün, hakimlerin usullerindeki kusur, Nas eksikliği veya belirsizlik nedeniyle hakimlerin oynadığı rolün bir tanımı olduğu anlaşılmaktadır. Bu, yargıcın kendi yargı alanı için içtihat yapmasının önemini göstermektedir. Bu çalışmada Yargıcın rolü pozitif hukuk ve şeriat hukuku karşılaştırması kapsamında Hakimin içtihattaki rolü ve tüm bireylere adalet sağlama rolü ve kendisine sunulan davalarda tarafsızlığının kapsamı incelenmiş ve hakkında nas bulunmayan ve belirisz konularda hakimin rolü ve diğer organlardan bağımsızlığının uygun tanımı yapılmaya gayret edilmiştir. İlk bölümde şeriat hukuku ve pozitif hukukta yargı ve yargıyla ilgili kavramlar karşılaştırması yapılmıştır. Ve Yargının, adaleti sağlamadaki rolü ve haklarının gerçekleştirilmesi, hakimlerin görevlerini yerine getirme görev ve yeterlilikleri ile yargının yargı işlerine yönelik görev ve sorumluluklarının sona ermesi ele alınmıştır. İkinci bölümde Davaların İslam hukuku ve adli hukukta, mahkemelerden önce hakların kurulması, adli işlemlerin özü, unsurları, nedenleri, türleri incelenmiştir. Bunların yanı sıra İslam hukuku ve pozitif hukuk mahkemeleri incelenmiş ve dava kavramı davanın mahiyeti, davanın kalkma üsulu, ve mahkeme önünde ispat yolları, avukatlar ve mahkeme görevlileri gibi hakimin yardımcıları ele alınmıştır Üçüncü bölümde hakkında nas bulunmayan konularda hakimin rolü, belirsiz veya hakkında hüküm bulunmayan hakimin yargı içtihadı ve şeriat hukuku ve pozitif hukukta hakimin rolüyle ilgili konular ele alınmıştır."
