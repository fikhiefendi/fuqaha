abstract: "Hanefî mezhebinde yazıldığı dönemden itibaren rağbet gören Haskefî'nin ed Dürrü'l-muhtâr isimli eserinin mezhep içi tercih ilkeleri ile uyumunun inceleneceği bu çalışma, giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde konunun önemi, amacı, yöntemi ve kaynakları ele alınmıştır. Birinci bölümde, üzerine çalışma yaptığımız eser olan ed-Dürrü'l-muhtâr ve müellifi Haskefî'nin üzerinde durulmuştur. İkinci bölümde, Hanefî mezhebi içerisinde yerleşmiş olan tercih usûlü ilkeleri üzerinde öz bir şekilde durulmuş ve üçüncü bölümde meselelerin değerlendirilmesinde dikkat çekilecek somut tercih ilkeleri belirlenmiştir. Üçüncü bölümde, ed-Dürrü'l-muhtâr'ın tahâretle ilgili bahisleri, mezhebin muteber kaynakları ile mukayese edilerek ikinci bölümde belirlenen tercih ilkeleri ekseninde incelenmiştir Sonuç başlığı altında ise araştırmanın sonuçları ortaya konularak bir tablo ile Haskefî'nin mezhebin makbul görüşünün dışına çıkmasının gerekçeleri belirtilmiştir."
