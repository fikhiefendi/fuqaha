abstract: "Tezinin konusu olan Manisa kazasına ait 167 numaralı Şer'iye Sicili'nin orijinali, Cumhurbaşkanlığı Devlet Arşivleri Başkanlığı Osmanlı Arşivi'nde; mikrofilme alınmış nüshası ise İstanbul'daki İslam Araştırmaları Merkezi'nde muhafaza edilmektedir. Katalogta 128 sayfadan oluşan sicilin, H. 1111-1113 [M. 1700-1702] yılları arasındaki dönemi kapsadığı belirtilmiştir. Çalışma, üç bölümden oluşmaktadır. Birinci bölümde, Manisa kazasına ait şer'iye sicilleri ile bu sicillerle ilgili yapılmış çalışmalar ve çalışmamızın konusu olan sicilin genel durumu ayrıntılı bir şekilde aktarılmıştır. Bunun yanı sıra sicilde yer alan belgelerin türlerine ve konularına göre tasnifi ile belgelerin özetlerine yer verilmiştir. İkinci bölümde, 167 numaralı Manisa Şer'iyye Sicili'nin genel bir değerlendirilmesi yapılmış ve 1698-1710 yılları arasındaki kazaya ilişkin bilgiler tasnif edilmiştir. Son bölümde ise basit transkripsiyon yöntemi kullanılarak, defterin tamamının çeviriyazı metni verilmiştir."
