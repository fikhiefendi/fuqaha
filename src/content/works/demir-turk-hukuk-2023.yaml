abstract: "Bu çalışma, suç şüphesi bulunan kimsenin yargı kararı olmadan suçlu sayılamayacağı anlamına gelen ve ceza yargılaması konusunda önemli evrensel hukuk ilkelerinden olan masumiyet karinesinin Türk hukuk tarihi bağlamında ele alınışını ve klasik dönem Osmanlı hukuku çerçevesinde incelenmesini konu edinmektedir. Bu çerçevede, öncelikle masumiyet karinesinin teorik altyapısı incelenmiş, karinenin unsurları, karine kavramının günümüzde doktrindeki tanımı, unsurları ve meydana gelişi, kadim hukuk sistemlerindeki görünümü ve kavranılışı günümüz hukuk sistematiği bağlamında incelenerek aktarılmıştır. Akabinde, teorik çerçevenin pratiğe yansıması olan klasik dönem Osmanlı uygulaması ele alınmıştır. Çalışmada yararlanılmış olan kaynaklar; İstanbul kadı sicilleri, mühimme defterleri, fetva kitapları, Hanefi mezhebine göre yazılmış olan klasik fıkıh kitaplarıdır. Yapılan çalışmada toplumsal hayatın özelliklerine göre hukuk pratiğinde gelişen ilkelerin farklı adlandırılmalarla günümüz evrensel hukuk ilkelerinin oluşumuna temel olduğu sonucuna varılmıştır. İlke, günümüz uluslararası mevzuatında düzenlenmiş ve devamında da Türkiye Cumhuriyeti'nde anayasal düzeyde ele alınmıştır. Klasik dönem Osmanlı uygulamasında masuniyet-i şer'iyye ilkesi, uygulamada kadı kararı olmadan herhangi bir şüphelinin suçlu sıfatını haiz olamayacağı prensibiyle ilişkilendirilmiştir. Kendisine suç isnat edilmiş kimse hakkında ceza yargılaması boyunca lehine haklar ve uygulamalar olduğu ifade edilebilir. Bu çalışma, modern hukukta masumiyet karinesini ve onun kavramsal olarak gelişimini temel almış ve karşılaştırmalı olarak modern hukuk öncesinde ceza yargılamasında sanık lehine olan uygulamaları incelemiştir. Çalışmanın sınırlandırılabilmesi açısından seçilen klasik dönem Osmanlı hukuku pratiği ise masumiyet karinesiyle ilişkilendirilebilecek sanık lehine uygulamalar incelenerek ortaya çıkarılmıştır."
