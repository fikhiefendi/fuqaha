abstract: "Fetihlerin artması ve İslam dininin hızla yayılmaya başlaması sonucunda farklı insan grupları ve kültürlerle karşılaşılması kaçınılmaz olmuştur. Buna ek olarak da sosyal hayatta meydana gelen problemlere çözüm arayışı ve bu arayış sonucu ortaya çıkan yorum farklılıkları meselelerin daha pratik şekilde hükme bağlanmasını elzem hale getirmiştir. Tam bu noktada da küllî kâideler ve prensipler devreye girmiştir. Bu kâideler ilk dönemlerde asıl kavramıyla ifade edilirken sonraki dönemlerde ise asıl kavramı daha şümullü hale getirilerek kâidenin yansıra delil, dâbıta vb. manalarda kullanılmaya başlanmıştır. Çalışmanın birinci bölümünde nitel araştırma yöntemi kullanılarak“asıl”kavramının ilk dönemlerde nasıl kullanıldığı ve bu kavramla ilişkilendirilen diğer terimler incelenmiştir. İkinci bölümünde veri toplama ve mukayese yöntemi kullanılarak“asıl”kavramının sonraki dönemlerde hangi anlamlarda kullanıldığı ele alınmış, üçüncü bölümde de aynı yöntem kullanılarak çeşitli eserlerde yer alan asılların mukayesesi yapılarak Hanefi mezhebine dair alışveriş bahsindeki asılların tespitine odaklanılmıştır. Bu analizler, kavramın tarihsel gelişiminin ve fıkhî uygulamalardaki rolünün derinlemesine anlaşılmasına olanak sağlamış, asılların sonraki dönem eserlerde daha sık kullanıldığını ve kavâid ilminin belirli bir seviyeye geldiğini göstermiştir."
