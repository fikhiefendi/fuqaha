abstract: "VI ÖZET“Klasik Dönem Osmanlı Toplumunda Boşanma Bağlamında Osmanlı Sosyal Tarihinin Lise Ders Kitaplarında İncelenmesi”Yahya ARAZ Çalışmanın iki ana amacı bulunmaktadır; Bu amaçlardan birincisi Klasik Donem Osmanlı Toplumunda boşanmanın nasıl meydana geldiğinin ortaya çıkartılmasıdır. Genel olarak yapılan çalışmalarda Osmanlı'da kadının arka planda kaldığı, haklarını arayamadığı, erkeklerin ağır baskısına maruz kaldığı, erkeklerin İslam Hukuku çerçevesinde“sınırsız”boşanma haklarına sahip olduğu iddia edilmektedir. Bu çalışma bu iddiaların çoğunun on yargılı olduğunu göstermektedir. Kadının haklarını gerektiğinde savunabilen, erkeğe karşı dirençsiz olmadığı, toplumun“aktif* bir üyesi olduğu kaynaklar ışığında elde edilen sonuçlar olmuştur. Özellikle maddi sebeplerden dolayı erkeklerin eşlerini istedikleri gibi boşayamadıkları, bu yüzden erkeklerin İslam Hukukundan kaynaklanan ”sınırsız\" diye nitelendirilen boşanma haklarının toplumsal bazda fazla bir anlam ifade etmediği söylenebilir. Bunun dışında karşılıklı anlaşma yoluyla gerçekleşen boşanmaların daha yoğun olduğu ifade edilebilir. Bu tür bir boşanmada kadın erkek üzerindeki mehir ve nafaka gibi maddi alacaklarından vazgeçmiştir. Çalışmanın ikinci amacını kaynaklar üzerinde yapılan araştırmalar neticesinde ortaya çıkan verilerin lise tarih ders kitaplarındaki sosyal tarih başlıkları altında işlenen konularla karşılaştırılması oluşturmaktadır. Ders kitaplarının önemli bir kısmı siyasi ve askeri gelişmelere ayrılmış durumdadır. Sosyal tarih başlıkları altında işlenen konular içerisinde kadın çok az oranda yer almaktadır. Verilen bilgiler ise Osmanlı Toplumunun çok kültürlülüğünü ve değişimlerini yansıtmaktan oldukça uzaktır. Bakıldığında, tarih dersvu kitaplarının kadın konusundaki bu yoksunluğunun en önemli sebeplerinden birisinin de, bu konularda, akademik anlamdaki çalışmaların yetersizliği olduğu görülecektir. Bu çalışma Seriye Sicilleri ve Şeyhülislam Fetvalarını temel alarak yapılmıştır. Seriye sicilleri, fetva, Osmanlı Toplumu, kadın, boşanma, evlilik, İslam Hukuku, tarih ders kitapları çalışmanın anahtar kelime veya kavramlarını oluşturmuştur."
