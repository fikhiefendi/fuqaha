abstract: "Fıkhî mezhepler sadece, kuruluşu ve ortaya çıkışı kendilerine nispet edilen imamlar tarafından meydana getirilmemiştir. Bilakis her imamın öğrencileri vasıtasıyla mezhepler ilk nüvelerini oluşturmuş, gelişmiş ve oluşumunu tamamlamıştır. Dolayısıyla mezhepler kolektif bir çalışmanın ürünü olmuştur. Yaygın fıkhî mezheplerden biri olan Hanefî mezhebi de aynı şekilde teşekkül etmiştir. Hanefî mezhebi fıkıh eserlerinde görüş ve rivayetlerine sıkça yer verilen fakihlerden biri de Hasan b. Ziyâd'dır. Bu tezde, Ebû Hanîfe'nin yetiştirdiği müçtehitlerden olan ve mezhebin temellerinin atıldığı dönemde yaşayan Hasan b. Ziyâd'ın -hayatı, eserleri ve Hanefî mezhebinde tercih hiyerarşisi ele alındıktan sonra- görüş ve rivayetleri üzerinden Hanefî mezhebindeki konumu tespit edilmeye çalışılmıştır. Hasan b. Ziyâd'ın fürû kaynaklarında zikredilen rivayetleri, görüşlerinden oldukça fazla olup en çok rivayette bulunduğu kimselerin başında hocası Ebû Hanîfe gelmiştir. Onun mezhepte tercih edilen ve diğer imamlarla ittifak ettiği birçok görüş ve rivayeti olduğu görülmüştür. Bununla beraber tercih edilmeyen görüş ve rivayetleri de olmuştur. Bunlardan bir kısmı mezhep birikimini artırmış ve meşâyıhın tercihte bulunabileceği seçenekler olarak elini rahatlatmıştır. Bir kısmı da mezhepte çok fazla dikkate alınmamış sadece mezhep kaynaklarında yer bulmuştur. Hasan b. Ziyâd, içtihatlarında insanların maslahatına uygun, menfaati sağlayıp zararı def edecek, olası zararları engelleyecek hükümleri ön planda tutmuştur. Bundan dolayı onun görüş ve hükümlerinin şekillenmesinde özellikle istihsan, örf ve istishâbın belirleyici bir rolü olmuştur. Netice olarak Hasan b. Ziyâd, Hanefî mezhebinde en az Züfer b. Hüzeyl kadar önemlidir. Hasan b. Ziyâd, mezhep birikiminin aktarılması ve gelişmesinde kritik konuma sahip, zaman zaman mezhebin genel ilkelerinin dışına çıkan müçtehit bir fakihtir. Onun kurucu Hanefî imamlar içerisinde teorik olarak Ebû Hanîfe, Ebû Yûsuf, Muhammed b. Hasan ve Züfer b. Hüzeyl'den sonra beşinci sırada yer aldığı sonucuna varılmıştır."
