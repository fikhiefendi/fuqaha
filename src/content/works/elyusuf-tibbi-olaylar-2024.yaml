abstract: "Bu araştırma, tıbbi sorunların fıkıh kuralları ile ilişkisini ve İslam hukukunun amaçlarını ele almaktadır. Bu bağlamda, tıbbi sorunların fıkhi önemine, Şeriat prensiplerine ve bu konularla ilgili esaslara değinilmektedir. Ardından, bu tıbbi meselelerin fıkhi kaideler ve İslam hukukunun maksatları ile ilişkili uygulamaları incelenmektedir. Bu tıbbi-fıkhi meseleler, dinin beş temel değeri ve bunlarla ilişkili diğer kurallara göre sınıflandırılacak, ayrıca İslam hukukunun korunmasını önerdiği külli ilkeler doğrultusunda açıklanacaktır. Bu araştırmada usuller ve kurallara uygun olarak ilim ehlinin sözlerine dayanılmıştır. Tıbbi-fıkhi meseleler, öncekilerin fıkhıyla ve çağın gelişmelerini takip eden köklü fıkhi kurallarla ayrı ve izole değildir. Bilinmelidir ki tıbbi olaylardan ve tıbbi yeniliklerden doğan çağdaş fıkhi meseleler, eski meselelerle kıyas edilerek temel bir ilkeye bağlı bir görüş ortaya çıkarmak için değerlendirilmeli, gerçeğe ve çağa açık bir yaklaşımı içermelidir. Bu da, İslam hukukunun esnekliğini göstermekte, her zaman ve her yer için geçerli ve faydalı olduğunu ortaya koymaktadır. Bu tıbbi meselelerle ilişkilendirilen fıkıh ilminin temel prensipler arasında; Zaruretler haram olan şeyleri, helal kılar, zaruret miktarı kadar tahsis edilir, Geleneklere (Örf) hüküm verirken itibar edilir, ameller gayelerine göre değerlendirilir, zarar vermek ve zarara zararla karşılık vermek yoktur, güçlük kolaylık getirir. İslam Hukukunun maksatları arasında; Zaruriyyat, Haciyyat ve Tahsiniyyat (Zaruri, haci ve tahsini maslahatlar) bulunur. İlk olarak; Zaruriyyat: İnsanların hayatlarını idame edebilmesi için korunması gereken şeyler bütünüdür. Eğer bu Zaruriyyat ortadan kalkarsa, bozulma ve kaos meydana gelir, yaşam düzeninde dengesizlik oluşur. Bu İslâm'ın beş temel değeri olan Zaruriyyat şunlardır (zarûriyyât-ı hamse): din, can, akıl, nesil ve mal. İkinci olarak; Haciyyat: İnsanların hayatlarında kolaylık ve refah elde etmeleri için ihtiyaç duydukları şeylerdir. Eğer bunlardan yoksun kalınırsa, hayat düzeni bozulmaz, ancak insanlar sıkıntı ve zorluk çekerler. Bu nedenle, din zorluklar durumunda kolaylık sağlamıştır. Acil bir durumda meytenin (leşin) yenmesi veya seyahat eden oruçlunun Ramazan ayında orucunu bozması ya da evlilik hayatının devamının mümkün olmadığı durumlarda boşanmanın hükme bağlanmış olması gibi durumlar Haciyyat'a örnek olarak verilebilir. viii Üçüncü olarak; Tahsiniyyat: Bu, iyi alışkanlıklar ve güzel ahlakla ilgili olup bu tür şeyler olmazsa, insanların hayatları doğru, ahlaki yoldan sapar. Bu tahsini maslahatların arasında; beden ve giysinin temizliği, setr-i avret (vücudun dinen örtünmesi gereken yerlerin örtünmesi) ve bir kişinin (din) kardeşinin yaptığı satış üzerine satış yapmasının yasaklanması gibi ilkeler bulunur. Zira İslam hukukunun gayelerine dair faydaların bazıları şunlardır: - Şeriatın doğru ve detaylı bir şekilde anlaşılması. - Kuran ve hadis metinlerinin derinlemesine incelenmesi. - Şer'an hükmü bulunmayan çağdaş sorunlara şer'i çözümler bulunması. - İnsanların dinî ve dünyevî hayatlarında kolaylık sağlanması. - Müçtehitlerin, fetva verenlerin ve kadıların düşünsel süreçlerinin düzenlenmesi ve geliştirilmesi. Bu kapsamda, âlimlerin görüşlerine ve fıkıh mezheplerine dayanılarak, meselelerin yorumlanması, feri kaidelerin asli kaidelere bağlanması, hükmü ile ilgili nass bulunmayan meselelerin hükmüne kıyas yoluyla ulaşılması ve farklılıkların dikkate alınması gibi ilkeler benimsenmiştir. Bununla birlikte, çağdaş tıbbi-fıkhi meselelerin hükümleri araştırmak için zikredilen temellerden yararlanılarak, fıkhi kuralların açıklanması ve derlenmesi yoluna gidilmiştir. Bu tez, ana fıkhi kuralların ve İslam hukukunun amaçlarının tıbbi meseleler üzerindeki etkisini içermekte; bunu, fakihlerin görüşlerini ve beyanlarını inceleyerek, bahis konusu sorunları ve hususları beyan ederken fıkhi kuralları uygulayarak ve şeriatın gayelerini dikkate alarak gerçekleştirmektedir. Bu ciddi meselelerin, insanlığın genel çerçevede mutluluğunu sağlamak, insan onuru ile hayatını korumak, insanın bu dünyada etkin bir unsur olmasını teşvik etmek ve Allah'ın ona emanet ettiği dünyayı imar etmek için çaba göstermek, İslam şeriatının temel amacıyla doğrudan ilişkilidir. Araştırmanın sonunda, elde edilen en önemli bulgular ve bu önemli konunun kapsamlı bir şekilde incelenmesine katkıda bulunabilecek öneriler ile tavsiyeler belirtilmiştir."
