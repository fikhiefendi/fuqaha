abstract: "Osmanlı dönemindeki şer'iyye sicilleri, genellikle o dönemi anlama konusunda en önemli bilgi kaynaklarından biri olarak kabul edilir.Tezimizin konusu, 18 numaralı Kırşehir şer`iyye sicilidir. Tezde öncelikle Osmanlı hukuk sistemi ve şer`iyye sicilleri hakkında kısa bilgiler verilmiş, daha sonra sicildeki davaların özetleri, ardından sicilin transkripsiyonu ve son bölümde de davaların konularına göre değerlendirmesi yapılmıştır. Sicilin orijinal metni de tezin sonuna eklenmiştir.Tezin amacı, Osmanlı döneminde resmi olarak yürürlükte olan İslâm hukukunun nasıl uygulandığının, farklı din ve ırktan insanların bir arada yaşadığı bir toplumda insanlar arasında vuku bulan davalar neticelendirilirken İslâm hukukunun nasıl işletildiğinin ve İslâm hukukuna aykırı herhangi bir uygulamanın olup olmadığının belirlenmesidir.Bu sicilde; vekâlet, velâyet, vesâyet, verâset, aile hukuku (nikâh, talak, iddet, nafaka vs.), vakıf, lukata, ru'yet-i hilâl gibi konularda farklı dava örnekleri mevcuttur."
