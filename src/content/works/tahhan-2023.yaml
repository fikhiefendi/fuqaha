abstract: "Bu araştırma Abd al-Malik bin Ali bin Ebi al-Muna al-Babi al-Halabi'nin (ö. Anaokulu ve Müfredatta olmayanların kısa bir özeti) konusunu ele almaktadır. Şafii hükümleri üzerinde durmaktadır. hukuk fakültesi, yasal yönlerini açıklığa kavuşturmak için. Bazı dallarında, Şâfiî mezhebinin hükümleri ile fakihlerin bütün imamlarının nasî hükümlere veya aklî delillere dayanarak zikrettikleri şeyler ile haraç arasında örtüşebilir ve sözü onun içinde detaylandırabilir. temeller, koşullar ve sonuçlar. Ve Şafii fıkhının kaynaklarına dayanarak teyemmüm, abdest, kıraat, çorap veya atel üzerine mesh ve hayız ile ilgili bölümler Yazar, fıkıh malzemesini sadeleştirmede iyi bir bilimsel yöntem izlemiştir. kendi açıklaması ve belirsiz ya da açıklanmaya muhtaç gördüğü hususlara ilişkin yorumları ve araştırmacının ulaştığı sonuçlar arasında: Abdülmelik el-Babi el-Halabi'nin anaokulunda ve müfredatında olmayanların bir özeti İmam'ın el-Şafi'i doktrininden alınan şerefli hadisler, güzel çıkarımlar, mantıksal alıntılar ve ayrıntılı fıkıh hükümleri ve Osmanlı döneminin ansiklopedik bilimlerle ilişkili iyi bir kültürü vurgulayan bazı dilsel ve lügatsel yorumlara yer verdi. gücünün zirvesinde tanık oldu ve derleyiciler H. 10. yüzyılda onu takip etti. El-Halabi yazarı, fıkıh malzemesini basitleştirmede iyi bir bilimsel yaklaşım izledi, bu nedenle meseleleri ortaya koymaya ve içlerindeki fıkıh hadislerinin çokluğunu açıklamaya çalıştı, ancak bunları nadiren kendi açıklamasıyla ekledi ve muğlak veya muğlak olduğunu düşündüğü şeyler hakkında yorumlar yaptı. açıklamaya muhtaç."
