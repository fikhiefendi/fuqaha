abstract: "Serahsi'nin ?el-Mebsut?undaki Hadis Metin Tenkitlerinin Tahlili (XVI-XXX. Cüzler) isimli bu tez, Erciyes Üniversitesi Sosyal Bilimler Enstitüsü'ne Yüksek Lisans Tezi olarak sunulmuş olup, bir giriş, iki ana bölüm ve bir sonuçtan oluşmaktadır.Giriş bölümünün ilk kısmında tezin konusu, yöntemi ve kullanılan kaynaklar belirtilmiş olup ikinci kısmında ise Serahsî'nin hayatı, eserleri, ilmî kişiliği hakkında kısa bilgi verilmiştir.Birinci bölümde, genel olarak metin tenkidinden ve Serahsî'nin ?Usul? adlı eserinde ortaya koymuş olduğu metin tenkidi anlayışından bahsedilmiştir.İkinci bölümde ise el-Mebsut'un XVI ?XXX. Cüzleri arasında yaptığımız taramada bulmuş olduğumuz on yedi metin tenkidi örneğine yer verilmiştir. Serahsî bu tenkitlerden ikisini Kuran'ın sarih hükümlerine, üçünü icmaya, ikisini umum belva kriterine, birini akla, bir tanesini de sahabe fetvasına aykırı olduğu gerekçesiyle yapmıştır. Dört hadisi sahih olmadığı için, dört hadisi de başka sahih hadislerle çelişkili bulduğu için tenkit etmiştir.Tez bir sonuç ve bibliyografya ile sona ermektedir."
