abstract: "Tezimiz imam Suyuti'ye ait olan ve ferâiz (miras ) ilmi ile ilgiliŞerhu'r-Rahabiye adlı eserin tahkikidir. er-Rahabiye, Muhammed b.Ali er-Rahabi'nin (ö.h. 577) yazdığı ve 186 beyitten oluşanferâiz ilmi hakkında manzum bir şiir kitabıdır. Bu manzum eseri, İmam Suyuti'nin de (ö. h. 911) aralarında bulunduğu birçok âlim şerhetmiştir. Ferâiz İlmi, (miras hususunda) kimin varis olup olamayacağı, miras düşen kişilerin payını, bunlarla ilgili haklarıve bundan sonraki süreçte gözetilmesi gereken şeylerle ilgili kuralları belirleyen bir ilim dalıdır. Bu tez, bu ilmin tüm kısımlarını ve izahatlarını uygulamalı örneklerle açıklar."
