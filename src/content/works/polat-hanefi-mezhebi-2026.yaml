abstract: "Toplumun var olduğu her yerde, bu toplumu düzen içinde tutacak hukuk kuralları varlık göstermiştir. Hukuk sistemlerini incelediğimizde, bunların temel aldığı iki ana kaynağın öne çıktığı görülmektedir: Bunlardan ilki, ilahi iradeye dayanan, vahiy temelli hukuk düzeni; diğeri ise insan aklı ve tecrübesiyle şekillenen beşerî hukuk sistemidir. Her iki sistemde de nihai amaç, toplumsal düzeni sağlamak, bireylerin haklarını güvence altına almak ve kamu vicdanını tatmin edecek adalet ilkesini gerçekleştirmektir. Bu bağlamda, insanların haklarını savunabileceği deliller tarih boyunca varlığını sürdürmüştür. Çalışmamızda tarihsel süreçteki yaygınlığı ve uygulamadaki belirleyici fonksiyonu sebebiyle ispat faaliyetinin en çok başvurulan unsurlarından biri olan şahitlik müessesesi incelenmiştir. Giriş ve sonuç bölümleri dışında üç ana bölümden oluşan çalışmanın amacı, şahitliğin hem Hanefi mezhebinde hem de modern Türk hukuk sisteminde nasıl konumlandığını ortaya koymak ve iki sistem arasındaki farklılaşmayı mukayeseli bir yaklaşımla incelemektir."
