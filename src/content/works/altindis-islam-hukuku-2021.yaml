abstract: "Akitler, toplumsal hayatın vazgeçilmez unsurlarından biri olup sosyal hayatta kurulan hukuki ilişkilerin pek çoğu akitlere dayanmaktadır. Bu sebeple tarih boyunca tüm hukuki sistemler, borçlar hukukunun temelini oluşturan akitlere ilişkin düzenlemeler getirmiştir. Hukuk sistemleri akitlerin kuruluş biçimi, geçerliliği ve hükümleri gibi temel konularda düzenleme yapılmasını önemsemiştir. Bu anlamda önemli bir yere sahip olan akitlerin kuruluşu, hukuk sistemlerinde muhtelif düzenlemelere tabi tutulmuştur. Düzenlemelerde söz konusu olan farklılıklar, akdin geçerliliğini ve hükmünü etkilediği için hukuk sistemlerinin akdin kuruluşuna dair düzenlemelerinde bulunan benzerlik ve farklılıkların ortaya konması önem arz etmektedir. Bu sebeple çalışmamızda, İslam hukuku ve İngiliz hukuku sistemlerinde akitlerin kuruluşunun mukayesesi konu edinilmiştir. Çalışmada akitlerin kuruluşunda gerekli olan unsurlar ele alınmış, irade beyanının gereklilikleri detaylıca izah edilmiş ve hukuk sistemlerinin akdin kuruluşuna yaklaşımları mukayese edilmiştir. Şekli benzerlikten ziyade işlev ve içerik bakımından birbirine benzer olan başlıklar mukayese tabi tutulmuştur. Dolayısıyla mukayesede; işlevsel denklik ilkesi esas alınarak irade beyanının akitlerle ilişkisi, iradenin varlığı ile beyan edilmesi arasındaki ilişki, icabın tespiti, irade beyanının iletilmesi ve iletilme biçimleri, gaipler arası akit, icabı sona erdiren sebepler, irade beyanlarının varlığını sürdürmesi, tek taraflı sözleşmelerde irade beyanı incelenmiştir."
