abstract: "Arap Grameri ve Belagatinin Taharet Konusunda Fıkhî Tercihlere Tesiri: Nahiv ve belagat bilimleri dinî bilimlerden, bunlardan biri de fıkıhtır, nitekim nahiv ve belagat çalışmaları sırasında fıkıhçılar ve metotları bundan etkilenmiştir. Bu çalışma, bir yandan nahiv ve belagat diğer yandan fıkıh biliminin verimli şekilde kaynaşmasını araştırmayı ele almaktadır. Çalışılan konunun tabiatı, bu araştırmayı bir giriş, iki bölüm bir sonuç bir de araştırmamda başvurduğum kaynaklar olmak üzere ele alınmasını gerektirmiştir. Giriş; çalışmanın başlangıç kısmını ele almıştır. Burada, bu konuyu seçmemin sebepleri, araştırmanın amacı, önemi, sorunları ve biraz da nahiv ve belagat bilimlerinin oluşumu ve gelişmesi, fıkıh ve tefsir bilimleriyle ilişkilerini ele aldım. Bu ilişkileri açıklayan uygulamalı bazı örnekleri de sunmayı ihmal etmedim. Birinci Bölüm: Nahiv kurallarından etkilenen bir kısım fıkıh meselelerini içermektedir. Burada harflerin manaları, çeşitleri hakkında teorik bir çalışma yaptık; fıkıhçıların ve nahivcilerin üzerinde birleşikleri konuları tercih ettik. Bu araştırmada ele aldığımız harfler şunlardır: (الى) Sonucu bildirmek amacıyla kullanılan bir atıf edatı, başka anlamlarda da kullanılabilmektedir. ((الباء Bir harf-i cerdir (çekim harfidir) birden fazla manası bulunmaktadır, çoğu kez mananın aslından sayılan bitişik bir harftir. (الواو) Bir bağlaç edatıdır, anlamı ise genel bir bağlaçtır. Ancak deliller onun abdest sırasında sıralamaya uyulmasını tercih etmeyi sağlayan bir harf olduğunu gösterir. (مِن) Bir harf-i cerdir (çekim harfidir), pek çok manası bulunmaktadır, bunların çoğu da manaların aslı olan amaca ulaşılmasıdır. (اللام) Bir harf-i cerdir (çekim harfidir), pek çok manası bulunmaktadır. Bu manaların aslı da zamandır. Yani; onları iddet zamanlarında boşayın, gibi. (لولا) Kendisinden sonra gelen iki cümle de olumlu ise, olumsuzluğuna işaret eden bir harftir. (أي) Cümle içerisinde pek çok yerde geçen bir isimdir, daha çok koşul ve soru edatı şeklinde kullanılır. Koşul olarak kullanıldığında genelleme anlamında kullanılır. İkinci Bölüm ise; Belagat kurallarından etkilenen fıkhî meseleleri araştırmaları içermektedir. Bu uygulamalı meseleleri teorik meseleler dönüştürmeyi ele almaktadır. Bu çalışma esnasında; fıkıhçılar ve dilcilerin üzerinde birleştikleri, mecazın anlamı, çeşitleri pek çok fıkhî meselelerin oluşumundaki rolünü tercih ederek ele aldım. Zira Kur'an-ı Kerim en güçlü ve açık ifadelerle anlatılmalıdır. Araştırmanın bu bölüm, sonuçlar, tavsiyeler ve araştırmanın birinci ve tali kaynakları ile sonuçlanmaktadır. Enahtarlar: Taharet, Akli delili, Nakli delili, tercih."
