abstract: "Bu çalışma, aile hukukunun kanunlaştırılması sürecini Meşihat ile Adliye Nezareti arasındaki yetki mücadelesi çerçevesinde ele almaktadır. Her iki kurum aile hukuku alanını kendisi tedvin etmek istemiştir. Bu bağlamda 1914 yılında Şeyhülislam Hayri Efendi'nin öncülüğünde Fetvahanede Kitâbü'n-Nikâh, Kitâbü't-Talâk ve Kitâbü'n-Nafakât adlı eserlerin hazırlanmasına başlanmıştır. Ayrıca, kadının belirli şartlarda mahkemeye başvurarak boşanabilmesini mümkün kılan iki fetva padişahın iradesiyle yürürlüğe konulmuştur. Bu gelişmeler, Meşihatın aile hukuku alanında tedvin faaliyetlerine aktif bir şekilde katıldığını göstermektedir. Ancak bu faaliyetler, İttihat ve Terakki'nin önde gelenleri tarafından yasama yetkisine müdahale olarak değerlendirilmiş; artan baskılar neticesinde Hayri Efendi istifa etmiş ve bu çalışmalar tamamlanamamıştır. Bunun ardından 1916 yılında Adliyeye bağlı bir komisyon kurulmuş ve Hukuk-ı Aile Kararnamesi (HAK) bu komisyon tarafından hazırlanmıştır. Kararnamenin muhtevası, bu kurumsal yön değişikliğinin yalnızca idarî bir yeniden yapılanma olmadığını, aynı zamanda hukuk yapımında yön ve yöntem bakımından köklü bir dönüşümü ifade ettiğini göstermektedir. Çalışma, HAK'ın hazırlanmasında Avrupa Hukukuna müracaat edildiğini, bu bağlamda çoğunlukla İsviçre Medeni Kanunu'nun ve nadiren Alman Medeni Kanunu'nun tercih edildiğini, bu yolla HAK'ın Avrupa hukukundan etkilendiğini tespit etmiştir. Öte yandan bu etkilenmenin resepsiyon/iktibas şeklinde olmayıp Avrupa kanunlarında yer alan ve dönemin genel eğilimlerini yansıtan evlilikte yaş sınırı ve çocuk evliliğinin yasaklanması gibi hükümlerin fıkıh ile uyum gözetilerek ve farklı müçtehitlerin görüşleriyle temellendirilerek HAK'a dahil edildiğini göstermektedir. Bu yönüyle HAK, 1926 Türk Medeni Kanunu'ndan farklı olarak Mecelle gibi özgün bir kanun olmuştur. Meşihatın hukuki yetkilerinin Adliyeye devredilmesi ve bu yetki devrinin bir sonucu olarak ortaya çıkan HAK literatürde yaygın biçimde“hukukun sekülerleşmesi”olarak değerlendirilse de, 1926'ya kadar yapılan bütün medeni kanun düzenlemelerinin İslam hukukuna dayandığı dikkate alındığında bu bakış açısını kabul etmek güçtür. Bu nedenle bu çalışma Meşihat ile Adliye Nezareti arasındaki söz konusu yetki mücadelesini ve bu mücadelenin sonunda şeyhülislamlığın hukuki yetkilerinin geçici olarak Adliye Nezaretine devredilmesini sekülerleşmenin değil yargıda birlik ve kuvvetler ayrılığı gibi modern devlet anlayışına uygun kurumsallaşma çabasının bir sonucu olarak ele almaktadır."
