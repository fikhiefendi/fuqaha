abstract: "ÖZET HAMMAD, Muhammed Alem, \"Hâkim Şehid el-Mervezî ve Ceza Hukuku ile İlgili Görüşleri\" (Hadd Cezaları Bağlamında), Doktora Tezi, Danışmanlar: Prof. Dr. Şamil DAĞCI. XIII-113,s. Ek-1: 25, EK-2; 26, s. Hâkim Şehid el-Mervezî (ö. 334/ 945) Samanoğullan döneminde yaşamış önemli bir ilim ve devlet adamıdır. Bizim bu çalışmamız iki bölüm ve iki ekten oluşmaktadır. Giriş, tez konusunun önemi, sınırlandırılması ve sunulması hakkında bilgi içermektedir. Birinci bölüm hayatını ve eserlerini, ikinci bölüm \"el-Kafî fi-Furui'l-Hanefiyye\" adlı eserinin hudud bölümünün değerlendirilmesini içermektedir. Sonuç bölümü ise çalışmada nihai bilgileri içermektedir. EK-I'e hudud bölümünün Arapça metni, EK-IVye ise haritalar ve Cetveller eklenmiştir. Bir Hanefi fakihi olan Hâkim Şehîd el-Mervezi'nin, fıkıh ile ilgili, kaynaklarda adı geçen yedi eseri tespit edilmiştir. Müellifin \"el-Kafî\" isimli eseri dışındaki diğer eserleri günümüze kadar ulaşamamıştır. Hâkim Şehîd el-Mervezî, üzerinde çalıştığımız \"el-Kafî\" adlı eserinde, furuî meselelerle ilgili olarak İmam Muhammed'in (Ö.189/805) \"Zahiru'r-Rivaye\" veya \"Mesâilu'l- Usul\" olarak anılan eserlerini birleştirip tekrarları çıkararak konuları fıkıh bablarına göre tanzim etmiştir. Biz çalışmamızda Hâkim Şehîd el-Mervezî'nin \"el-Kafî\" adlı eserinden sadece Hudud bölümünden ceza hukuku ile ilgili görüşlerini değerlendirmeye çalıştık. 102"
