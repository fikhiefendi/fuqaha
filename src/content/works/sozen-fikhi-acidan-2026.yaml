abstract: "Çocukluk dönemi, kişinin zihin ve gönül dünyasının şekillendiği ve değerlerinin temellerinin atıldığı en önemli dönemdir. Bu dönemde kazanılan maddi ve manevi kabiliyetler hem bireysel gelişimi hem de toplumun geleceğini doğrudan etkilemektedir. Bu sebeple çocukların İslâmi, insani ve ahlaki değerlerle yetiştirilmesi büyük önem arz etmektedir. Allah'ın bir emaneti olan çocukların sağlıklı ve donanımlı bireyler olarak yetiştirilmeleri ise uzun ve sorumluluk gerektiren bir süreçtir. Bu süreçte ailelerin yanı sıra eğitimciler ve toplumun tüm kesimleri önemli rol üstlenirken, özellikle çocukların ibadet eğitimlerinin doğru şekilde verilmesi ve ibadetlerle ilişkilerinin fıkhî açıdan sağlıklı biçimde anlaşılması büyük bir gereklilik olarak öne çıkmaktadır. Bu çalışmada, İslâm fıkhı açısından çocuğun ibadet yükümlülüğü ve yerine getirdiği ibadetlerinin geçerliliği ele alınmakta; özellikle temyiz dönemindeki çocukların ibadetlerine dair fıkhî bir çerçeve sunulması amaçlanmaktadır. Ayrıca çalışma, çocukların dini gelişimine katkı sağlamayı ve aileler ile din eğitimi kurumları için farkındalık oluşturmayı hedeflemektedir. Çalışmanın birinci bölümünde çocuğun tanımı, çocukluk dönemleri ve bu dönemlerin fıkhî karşılıkları ele alınarak ehliyet konusu sistematik biçimde incelenmiş, temyiz dönemindeki çocukların bazı filleri fıkhî açıdan değerlendirilmiştir. İkinci bölümde ise çocuğun iman ve ibadet yükümlülüğü konuları mezhepler arası karşılaştırmalı olarak ele alınmış; mümeyyiz çocuğun imanının geçerliliği genel olarak kabul edilmiştir. Genel anlamda çocuğun buluğa ermeden ibadetle yükümlü sayılmadığı, ancak yaptığı ibadetlerin geçerli olup hem kendisine hem de onu yetiştiren kişilere sevap kazandırdığı ifade edilmiştir."
