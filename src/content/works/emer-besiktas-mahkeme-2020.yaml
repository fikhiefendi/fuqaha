abstract: "Osmanlı toplumunu layıkıyla anlamanın yolu o toplumu oluşturan tüm unsurları tanıyıp anlamadan geçmektedir. Osmanlı coğrafyasında ciddi bir nüfusa sahip olan gayrimüslimleri farklı veçheleriyle ele almadan toplumun gerçek yapısının ortaya çıkması mümkün değildir. 1552-1609 yılları arasındaki yarım asırlık bir dönemin ele alındığı bu tezin asıl amacı gayrimüslimlerin muhtelif yönlerini Beşiktaş mahkeme kayıtlarına yansımış davaları çerçevesinde ele alarak incelemektir. Bu çalışmanın ana gövdesini birçok alanda olduğu gibi özellikle toplumsal hayat için zengin veriler sunan şer'iyye sicilleri oluşturmakla birlikte ele alınan dönemin arşiv belgeleri, fetvalar ve seyahatnameler gibi birincil çalışmalardan da yararlanılmıştır. Tüm bu kaynaklar ile yapılmak istenen ele alınan dönemdeki Beşiktaşlı gayrimüslimlerin profilini ortaya koyabilmektir. Bu çalışma, gayrimüslimlerin meskûn oldukları yerler, isimleri, meslekleri, maddi kültürleri, gündelik hayatları, aile yaşamları, hukuk sistemi içindeki yerleri, şer'i mahkemeye ne gibi anlamlar yükledikleri, gayrimüslimlerin kendi aralarında, Müslümanlarla ve devletle olan ilişkileri, gayrimüslimlerin Müslümanlar ve devlet nezdindeki konumları gibi meseleler üzerinden XVI. yüzyılın ikinci yarısında Beşiktaş ve tevabiinde gayrimüslim olarak yaşamanın neye tekabül ettiğini anlamaya çalışmaktadır. Bölge olarak Beşiktaş'ın seçilme nedeni, farklı etnik kimliklere sahip Rum, Ermeni, Yahudi ve Frenklerin Beşiktaş ve havalisinde meskûn olmalarıdır. On altıncı yüzyılın ikinci yarısına yoğunlaşan bu tez ile gerek gayrimüslimlerin gerekse Beşiktaş'ın daha net bir resminin çıkarılması amaçlanmıştır. Beşiktaş mahkeme kayıtlarına yansıyan demografik, mimari, ictimai ve coğrafi bilgileri ışığında Beşiktaş tarihine de mütevazi bir katkıda bulunulmuştur."
