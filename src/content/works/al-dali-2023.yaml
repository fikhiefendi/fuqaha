abstract: "Bu çalışma, toplumda daha az şanslı gruplara fon sağlanmasını ifade eden ve servetin adil bir şekilde dağıtılmasına yol açan İslami sosyal finansın teorik köklerine odaklanmaktadır. Çalışmanın teorik bölümünde, hayır ve kâr esaslı İslami sosyal finansman yöntemlerinin belirlenmesi, pratik bölümünde ise bu yöntemlerin uygulanması ve Yemen'deki ekonomik güçlendirmeye katkılarının boyutunun doğrulanması hedeflenmektedir. Çalışmanın hedefine ulaşmak için, İslami sosyal finans kavramı ve yöntemleri fıkhi açıdan incelenmiş, bu yöntemlerin meşruiyetini doğrulamak için tümevarımsal bir yaklaşım kullanılmıştır. Çalışmanın pratik boyutunda ise bu fonların ekonomik güçlendirmeye ne ölçüde katkıda bulunduğunu ortaya çıkarmak için İslami sosyal finansmandan istifade edenlere dağıtılan anketler aracılığıyla nicel yöntemler kullanılarak analitik bir yaklaşım izlenmiştir. Çalışmada İslami sosyal finansman yöntemlerinin çoğunun Yemen'de farklı oranlarda uygulandığı, ayrıca bu yöntemlerin, bu fonlardan yararlananların varlıklarını artırmaya katkıda bulunduğu ve onlara daha fazla beceri ve tecrübe kazandırmaya çalıştığı, bunun da ekonomik güçlenme şanslarına yardımcı olduğu sonuçlarına ulaşılmıştır. Çalışma, Yemen'deki vakıf ve zekât kurumlarının, finansman planlarında toplumun en fazla sayıda yoksul kesimini içine almaları için rollerini etkinleştirmelerini ve kalkınma programlarını güncellemelerini tavsiye etmektedir."
