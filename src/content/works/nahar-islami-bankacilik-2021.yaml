abstract: "Bu çalışmanın amacı, Güneydoğu Asya (Malezya) ve Güney Asya (Bangladesh) bölgesindeki İslami finans sektörüne ilişkin önemli değişikliklerin incelenmesidir. Bu tez, Güneydoğu Asya bölgesindeki İslami finans ürünleri, piyasa gelişmeleri ve eğilimleri, İslami bankacılık alanında karşılaşılan sorunlar, gibi meseleleri anlamak isteyen okuyucular için yararlı olacaktır. İslami bankacılık ve finans, küresel İslami ekonomik sistemin bir parçasıdır; Şeriat'ın temel emir ve değerleri etrafında, yasaklanan faaliyetleri göz önünde bulundurarak sosyal adaleteve moral ekonomisine dayanır. Bu çerçevede, söz konusu ülkelerdeki İslami finans olgusunun gerçekliği ele alınmıştır. Çalışmanın ilk bölümünde İslam iktisadı ve finansının araştırma alanına değinilmiştir. İslami iktasadı çerçevesinde çalışan sektörlere yer verilmiş ve İslami finansın finansal ürünleri detaylı bir şekilde açıklanmıştır. İkinci bölümde İslami bankacılığın tarihsel gelişimine yer verilmiştir. Üçüncü bölümde Malezya ve Bagladeş'teki durum incelenmiştir. İslami bankacılık ve finans alanlarındaki yaşanan gelişmelerini hem stratejilerini hem de büyümesini göstermektedir. Bu amaçla, her ülkeden iki İslami bankanın (Bangladeş İslami Bankası ve Bank İslam Malezya Berhad) bir örneği analiz kullanılarak seçilmiştir. Ayrıca, Bangladeşdeki İslami finans endüstrisinin geleceğinin kurumsal, akademik ve sosyal süreci de detaylandırılmıştır. Bu çalışma, İslami finans endüstrisinin geleceği için atılması gereken önemli adımları tespit ederek sona ermektedir."
