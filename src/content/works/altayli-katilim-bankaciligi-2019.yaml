abstract: "Bu çalışmanın amacı; kamu sermayeli katılım bankalarının özel sermayeli katılım bankalarının gerisinde kalması üzerinde etkili olan faktör ve değişkenleri analiz etmektir. Karma yöntemin kullanıldığı bu araştırmada araştırma verileri, literatür taraması-ikincil kaynaklar ile mülakatlardan elde edilmiştir. Mülakatlar, yarı yapılandırılmış görüşme tekniğiyle, hali hazırda özel ve kamu sermayeli katılım bankalarında çalışan 12 orta/üst düzey yönetici ve ticari segment firma ortaklarından seçilmiş12 kişi ile gerçekleştirilmiştir. İkincil kaynaklar ile mülakatlardan elde edilen bulgular karşılaştırmalı analiz tekniğiyle incelenmiş ve çözüm önerileri ortaya konulmaya çalışılmıştır. Çalışma sonuçları gelinen aşamada, kamu katılım bankalarının; hızlı büyüme sağladıklarını, büyüme sürecinde tabana yaygın ve ortalama büyüklük hacmine sahip olmak ve bireysel ve ticari müşteri kazanımına odaklanmaktan ziyade, tabana yaygın olmayan yüksek hacimli fon toplama ve kullandırma faaliyetlerinde bulunduklarını, özel sermayeli katılım bankaları müşterilerinin ana hedef olarak belirlenmesi nedeniyle sektör dışından ilave müşteri kazanma oranlarının düşük olduğunu ve kısa vadeli bilanço ve karlılığa odaklanılarak orta/uzun vadede sürdürülebilir büyüme hedefinden ve karlılıktan uzaklaştıklarını işaret etmektedir. Hal böyle olunca, kamu katılım bankalarının mevcut stratejiler ile faaliyetlerine devam etmeleri durumunda kuruluş amaçlarına ve beklenen büyüme hedeflerine ulaşmada zorluklar yaşamaları muhtemeldir. Katılım bankacılığının farklı bir bakış açısı ile ve karşılaştırmalı bir biçimde analiz edildiği bu çalışmanın ilgili literatüre katkı sağlamanın yanı sıra sektörün istikrarlı büyümesine vebu suretle Türkiye ekonomisine katkı sağlayabileceği değerlendirilmektedir."
