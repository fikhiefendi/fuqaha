abstract: "Hayat, maddi ve manevî bütün yönleriyle beraber bütünlük oluşturan insanın sahip olduğu en önemli değerdir. İslâm insan hayatına çok büyük önem vermiştir. İnsanın yaşaması ve yaşatılması İslâm dininin temel gayelerinden biri olarak benimsenmiştir Bu sebeple İslâm hukukunda canın korunması, dinin, malın, neslin ve aklın korunması gibi, İslâm dininin gerçekleştirmeyi hedeflediği diğer temel gayelerden daha önce gelmektedir. Çünkü bu hakların hepsinin temelini yaşam hakkı oluşturmakta ve diğer haklar bunun üzerine bina edilmektedir. Zira hayat hakkına sahip olamayan kişinin diğer temel hak ve hürriyetlerinden bahsetmek mümkün gözükmemektedir. İslam hukukunda insan, kendisine emanet olarak verilen hayatı muhafaza etmekle yükümlüdür. Bu sebeple kendi sağlığını tehlikeye sokacak şeylerden kaçınmalı, koruyucu tedbirler almalı ve hastalandığı zaman da tedavi olmalıdır. İslam hukukuna göre, insan hayatı kutsal ve dokunulmaz olduğu için, ötanazi intihardan farksız kabul edilmiştir. Çünkü İslâm hukuku açısından şartlar ne olursa olsun, kişinin isteyerek hayatını sonlandırması“intihar”olarak değerlendirilir. Bu bağlamda bu çalışmada günümüzde İslâm hukukunun insan hayatına verdiği değer incelenmiş ve insan yaşamı üzerinde var olan tasarruf hakkının klasik İslâm kaynaklarına göre sınırlarının çizilmesi hedeflenmiştir."
