abstract: "Bu çalışma, Bursa İnebey Yazma Eser Kütüphanesi'nde bulunan fıkıh ilmi ile ilgili yazma risâlelerin tespiti, konulara göre tasnifi ve önem arz eden bazı risâlelerin tahlili yapılarak gün yüzüne çıkarılmasını amaçlamaktadır. Kütüphanede bulunan fıkıh ile ilgili eserlerin yeteri kadar bilinmemesi ve gerektiği kadar istifade edilmemesi bu çalışmada ana sâik olmuştur. Çalışmamız giriş ve üç bölümden oluşmaktadır. Birinci bölümde, Kütüphane'de bulunan yazma fıkıh risâleleri, müellifi belli olan ve olmayanlar şeklinde ele alınmıştır. Müellifi belli olanlardan vefat tarihleri bilinenler kronolojik bir sıra gözetmek kaydıyla incelenmiştir. Risâleler bu bölümde teknik ve muhteva bakımından tanıtılmıştır. Matbûları bulunanlar tespit edilmiş, matbûları bulunmayanların ise başka kütüphanelerdeki farklı nüshaları kaydedilmiştir. İkinci bölümde, tespit edilen risâleler fıkıh disiplini alt konularına göre tasnif edilmiştir. Sayısal bulgular tablo haline getirilmiştir. Bazı açılardan analiz ve değerlendirmeler yapılmıştır. Üçüncü bölümde ise önemli birtakım özellikler çerçevesinde beş risâle ayrıntılı olarak tanıtılmıştır."
