abstract: "Amelî yönden mükellefin leh ve aleyhine dair hükümler kapsamında yer alan ve genel olarak insan hayatının idâmesi için temel ihtiyaçların temini şeklinde ifade edilen nafaka, aile ve toplum hayatının en önemli müessesesidir. Bu müessesenin hukuki sebeplerini oluşturan nikâh, hısımlık ve mülkiyet nafakası“İslâm Hukukunda Nafaka”başlığı altında araştırmamızın konusunu teşkil etmektedir. Bu bağlamdan hareketle nafakanın nikâh, akrabalık ve mülkiyet biçimindeki hukuki sebepleri tüm yönleriyle irdelenmeye çalışılmıştır. Bu çalışmada genel olarak İslam'a göre nafaka tarihinin ilk olarak Hz. Âdem (a.s.) ile başladığı, her toplumun bir birinden farklı uygulamalara yer verdiği görülmüştür. Nafaka kapsamına; tedavi, hekim harcamaları ile çocukları evlendirme masraflarının dâhil edilmesi gerektiği, nafaka sorumluluğunun kocaya ait olduğu, eşinin çalışmasına izin veren kocanın hizmetçi tutmamışsa ev işlerinde ona yardım etmesinin tavsiye edildiği tespit edilmiştir. Öte taraftan eşin nafakasının kocaya vucubiyeti noktasında sadece nikâh akdinin yeterli olmadığı, kadına verilecek nafakada kocanın durumuna itibar edilmesi gerektiği tespit edilmiştir. Evlilik ve iddet nafakasından sonra hısımlık ve mülkiyet nafakalarının yanı sıra mülkiyet nafakasına dair önemli hükümlerin günümüze ışık tutacak nitelikte olduğu görülmüştür. Ayrıca İslâm hukukunun konuya dair genel hüküm ve ilkeler vaz' ettiğini ve bunların ortaya çıkabilecek muhtemel problemlere çözüm getirebilecek nitelikte oldukları kanaati hâsıl olmuştur."
