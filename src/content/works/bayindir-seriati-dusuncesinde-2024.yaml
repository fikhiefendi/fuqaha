abstract: "1933-1977 yılları arasında yaşamış olan Ali Şerîatî, İslâm ve Batı medeniyetini yakından tanıma fırsatı bulmuş, kendine özgü bakış açısı, cesur söylemleri ve bilimsel olarak da liyâkati sayesinde geniş kitlelere etki etmeyi başarmış bir düşünce insanıdır. Şerîatî, insanın dünyada yaşadığı anlam arayışına yönelik din temelli çözüm yolları bulmaya çalışmıştır. Çünkü din ve insan karşılıklı olarak ilişki içindedir. İnsan eğer doğru bir şekilde tanınırsa özündeki din duygusuna ulaşılacaktır. Din de insanla birlikte anlam kazanmaktadır. Biz de çalışmamızda Şerîatî'nin din ve insan hakkındaki görüşlerini kelâmî ve felsefî temellerini inceleyerek ele almaya çalıştık. Şerîatî hakkında daha önce bu açıdan bir çalışma olmaması nedeniyle literatüre katkı sağlamak düşüncesi amaçlarımızdan biridir. Çalışmamızda kaynak taraması, içerik analizi ve karşılaştırma yöntemleri uygulanarak Şerîatî'nin öncelikle nasıl bir din tasavvuruna sahip olduğu ortaya konmuştur. Tevhid temelli bir din anlayışını hayatın tüm alanlarını kapsayan bir dünyagörüşü olarak ele alan Şerîatî, görüşlerini temellendirirken çağdaşı olan bazı düşünürlerden de faydalanmıştır. Ayrıca içinden gelmiş olduğu Fârisî kültürün izlerini de görmek mümkündür. İkinci bölümde ise Şerîatî'nin insanın tanımı, anlamı, misyonu, tarihi, boyutları, zayıflıkları ve de sınırlarını nasıl ortaya koyduğu incelenmiştir. Bu sayede insanın özüne ulaşılarak tevhid temelli din duygusuna ulaşılabilecektir. Son olarak da insanın dünyada yaşadığı ıstırap ve yabancılaşma duygusunun sonucu olan anlam arayışı ele alınmıştır. Şerîatî insanın bu anlam arayışına“Tevhidî Dünyagörüşü, Öze Dönüş, Sanat, Aktivasyon, Aydın Olma”başlıklarından oluşan bazı çözüm yolları sunmuştur. Bu çözüm yollarının dinden bağımsız bir şekilde değerlendirilmesi mümkün değildir. Çünkü din insanın bütün ihtiyaçlarına cevap verebilecek nitelikte yetkin bir ideolojiye sahiptir. Son olarak denilebilir ki Şerîatî, gelenekçi İslâm anlayışına aykırı olması, ayrıca düşünmeye ve eleştirmeye verdiği önemle bilinmektedir. Kendisinin Batı'nın insan tasavvuruna karşılık İslâmî özle beslenen bir insan algısı oluşturma çabası görülmektedir. Bu insan anlayışının temelini de bilinçli ve eyleme dönük muvahhid bir Müslüman oluşturmaktadır."
