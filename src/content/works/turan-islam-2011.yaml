abstract: "“İslam Hukukunda Karine”isimli çalışmamız, giriş, üç bölüm ve sonuçtan oluşmaktadır.Girişte araştırmanın amacı, önemi, planı, metodu ve kaynakları hakkında bilgiler verilmiştir. Birinci bölümde, karineye benzer kavramlar ele alınarak bu kavramlarla karinenin benzer ve farklı yönleri ortaya konulmaya çalışılmış ve karinenin daha iyi anlaşılması amaçlanmıştır.Karine, İslam Hukukunda en çok Fıkıh Usûlü ve Muhakeme Hukukunda ele alınmaktadır. Bu yüzden çalışmamızda karine, fıkhın bu iki alanı açısından ayrı iki bölüm olarak işlenmiştir. Bu sebeple ikinci bölümde,“Fıkıh Usûlünde Karine”başlığı altında, şer'î hükümlerin ortaya çıkarılmasında önemli bir yardımcı unsur olan ve usûlcüler tarafından çoğunlukla delil manasında kullanılan karinenin fıkıh usûlündeki yeri ve önemi ortaya konulmaya çalışılmıştır.“İslam Muhakeme Usûlünde Karine”başlığı altındaki üçüncü bölümde ise, muhakeme faaliyeti içerisinde hâkimim hüküm verirken faydalandığı delillerden ve hüküm sebeplerinden birisi, yani bir ispat vasıtası olarak karine tanıtılmaya çalışılmıştır. Bu bölümde, günümüz hukuku açısından da karine ele alınmış ve karinenin bir ispat vasıtası olarak değeri hakkında İslam âlimleri arasındaki farklı görüşler ortaya konulmaya çalışılmıştır. Ayrıca, İslam Hukukunda ceza ve hukuk davalarında karinenin delil değeri araştırılmış ve günümüzde bilimsel yöntemler ile elde edilen karinelerin İslam Hukuku açısından değerlendirilmesi yapılmıştır.Sonuç olarak ise, elde edilen bilgi ve bulgular değerlendirilmiştir."
