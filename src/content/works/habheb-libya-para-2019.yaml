abstract: "Bu çalışma Libya Merkez Bankası'nın 1956 yılında kurulduğundan beri 2017 yılının sonuna kadar Libya ekonomisinde meydana gelen değişiklikler ve gelişmeler aracılığıyla Libya'daki para politikasının performansını ve araçlarının etkinliğini ele almaktadır. Bu değişiklikler ve gelişmeler de çoğu zaman petrol fiyatlarındaki gelişmelerden kaynaklanmıştır. Dolayısıyla bankacılık ve parasal göstergelere ve sonunda ülkenin parasal politikalarına yansımıştır. Bu çalışmanın konusu olarak bu ekonomik değişiklikler ve gelişmeler ışığında para politikasının nasıl yürütüldüğünü incelemektedir. Bu çalışma, Libya ekonomisinde meydana gelen yerel ve uluslararası ekonomik değişiklikler ve sorunların etkileri Libya para politikasının performansını çoğu zaman olumsuz etkilediği sonucuna vardı. Zira reeskont oranı aracının bu çalışmanın bazı dönemlerinde likidite fazlalığının yaşadığı değişikliklerden dolayı banka kredisi üzerinde önemli bir etkisi olmamıştır. ekonomi akışını kontrol eden finansal politikasına çoğu zaman bağlı kalmıştır ki bu da nakit fazlalığına yol açmıştır. Buna ilaveten Libya Merkez Bankası'nın para politikasının parametreleri ve hedefleri Libya Merkez Bankası'nın para politikası, petrol gelirleri sayesinde Libya net olmadıkları için Libya ekonomisinde para politikasının araçları ile hedeflenen değişkenler arasında etkileşmemeye sebeb."
