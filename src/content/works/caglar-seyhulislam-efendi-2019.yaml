abstract: "Bu tez XVI. yüzyıl Osmanlı şeyhülislâmlarından olan Sa'di Çelebi'nin Fetvâ Mecmûası'nın günümüz Türkçesine çevrilmesini, onun fetva verirken izlediği metodu, en çok kullanmış olduğu kaynakları ve bu dönemde en çok karşılaşılan problemleri açıklamayı amaçlamaktadır. Araştırma, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, yöntemi açıklanmıştır. Birinci bölümde, Sa'di Çelebi'nin hayatı ve eserleri kısaca tanıtılmıştır. İkinci bölümde, Sa'di Çelebi'nin fetvaları klasik fıkıh baplarına göre tasnif edilmiş ve bu meyanda Kuduri'nin el-muhtasar'ı nazarı itibara alınmıştır. Eserde bulunan kapalı kısımlar, günümüz Türkçesiyle anlaşılabilir hale getirilmiştir. Arapça olan fetvaların tercüme ve açıklamaları yapılmıştır. Ayrıca fetvalar tahlil edilerek, Hanefi mezhebinin klasik kaynaklarından ilgili fetvaların karşılığı bulunmuştur. Son bölümde ise, Sa'di Çelebi'nin fetvalarının tamamı, orijinal diline bağlı kalınarak latinize edilmiş ve günümüz insanının istifadesine sunulmuştur."
