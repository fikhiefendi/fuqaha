abstract: "Dünya tarihinde çok büyük izler bırakmış olan Osmanlı Devleti'nin siyasi, askeri, iktisâdî, hukûkî, bürokrasi, dinî ve sosyal hayatı ile ilgili konularının aydınlatılmasında en önemli arşiv kaynaklarından biri şer'iyye sicilleridir. XV. yüzyıldan XX. yüzyıla kadar mahkeme kayıtlarının yer aldığı bu siciller, kadı veya nâib tarafından tutulurdu. Diyarbakır eyâletine bağlı olan Harput kazâsına ait 368 Nolu Şer'iyye Sicili H.1074-1075 (M.1663-1664) yıllarını ihtiva etmesi hasebiyle Padişah IV. Mehmed ve Sadrazam Köprülü Fâzıl Ahmed Paşa dönemine denk gelmektedir. Çalışmaya konu olan defterin ilk 80 sayfalık kısmı üzerinde durulmuştur. Tezin ilk bölümünde Harput'un tarihi, şer'îyye mahkemeleri ve görevlileri ile şer'îyye sicillerinin önemi ve içerdiği belge türlerinden bahsedilmiştir. İkinci bölümde belge özetleri çıkarılıp belgeler, konularına göre tasnif edilmiştir. Üçüncü bölümde belgelerin değerlendirmesi ve dördüncü bölümde ise transkripsiyonu yapılmıştır. Çalışmada sicilden elde edilen veriler ışığında; 1663-1664 yıllarında Harput kazâsının iktisâdî, hukûkî, idarî, dinî, sosyal ve kültürel hayatı hakkında önemli bilgiler sunulmuştur. Bu çalışmayla Harput şehir tarihini aydınlatmak ve yapılacak olan diğer şehir tarihi araştırmalarına katkı sağlamak amaçlanmıştır."
