abstract: "Sosyal değişim tarih boyunca bütün toplumların tecrübe ettiği bir olgudur. Bununla birlikte değişme karşısında sosyal düzenin istikrarını temin edecek bir kurallar topluluğuna da ihtiyaç duyulur. Hukuk gibi dinde toplumda istikrarın ve sağlıklı değişimin öncelikli kaynağıdırİslam hukuku insan toplumlarının realiteleriyle yakından ilgilidir. Zamanımızın hızlı ve geniş çaplı sosyal değişim ortamında bir müçtehidin biyolojik, bilimsel, sosyolojik ve ekonomik vs. verileri bilmesi gerektiğide şüphe yoktur. İçtihad sadece teorik bir süreç değildir. İslam Hukuk Usulünde en başından beri hüküm çıkarma yöntemleri ile sosyal değişim olgusu arasında var olan ilişki unutulmamalıdır."
