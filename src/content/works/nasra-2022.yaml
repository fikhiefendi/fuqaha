abstract: "Bu inceleme, yaşam hakkı ve konut hakkı alanındaki fıkhî kaidelerin etki ve rolünü, bu haklar hususundaki fıkhî kaidelerden nasıl istifade edileceğini göstermeyi ve aynı şekilde bunun bazı uygulama ve örneklerini açıklamayı hedeflemektedir. İnceleme, tüm bu konuları, fıkhî kaideler kavramını, yaşam hakkı ve konut hakkı hususundaki insan hakları kavramını, fıkhî kaidelerin bu haklarla olan ilgi ve bağlantısını açıklamak suretiyle ele almaktadır. Araştırmacı, bunu gerçekleştirmek için çeşitli yöntemler kullanmıştır. Bu yöntemler şunlardır: tümevarımcı yöntem, betimsel analitik yöntem ve karşılaştırmalı yöntem. Böylece burada, bu iki hakla ilgili en önemli çağdaş meseleler, onlar üzerindeki tartışmalar, fıkhî kaideler ışığında onlara getirilen çözümler ve bu kaidelerin tikel konulara nasıl uyarlanıp tatbik edileceği incelenmiştir. Bu çalışmayla tüm bu meseleler incelenip analiz edilmiş, fıkıh alimlerinin bu husustaki delil ve sözleri sunulup tartışılmış, ayrıca bu meselelerin uluslararası hukuk ve insan hakları sözleşmesiyle de karşılaştırılması yapılmıştır."
