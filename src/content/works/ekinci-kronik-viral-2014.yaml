abstract: "AMAÇ: Kronik viral hepatit C tanısı ile takip edilmiş hastaların tedavi başarılarının ve tedavi başarısına etki eden faktörlerin incelenmesi. YÖNTEM: Bu retrospektif çalışma; ˙İstanbul Medeniyet Üniversitesi Göztepe Eğitim ve Araştırma Hastanesi, Enfeksiyon Hastalıkları ve Gastroenteroloji ˘ polikliniklerinde kronik viral hepatit C tanısı ile takip edilmiş hastaların dosyaları taranarak yapıldı. Hastaların yaşı, cinsiyeti, hepatomegali ya da splenomegali varlığı, eşlik eden hastalıklar, komplikasyonlar, tedavi protokolleri ve tedavi yan etkileri incelendi. BULGULAR: Çalışmaya 418 hasta dahil edildi. Hastaların yaş ortalaması 48.4 (SD:11.3; min:27-max:76) yıl olup, %40.4'ü (n=169) erkek, %59.6'sı (n=249) kadın idi. Toplam 50 hastada (%12) hepatomegali, 45'inde (%10.8) splenomegali saptandı. Hastaların %13.4'ünde (n=56) diyabet, %5.3'ünde (n=22) tiroid fonksiyon bozukluğu, %1.4'ünde (n=6) diyabet ve tiroid fonksiyon bozukluğu mevcut iken, %79.9'unda (n=334) bu hastalıklar saptanmadı. Toplam 4 hastada (%1) hepatoselüler karsinom, 29 hastada (%6.9) siroz, 33'ünde (%7.9) ise ilaç yan etkisi gelişti. Hastaların 4'ü ribavirin, 32'si klasik interferon, 13'ü pegile interferon, 69'u klasik interferon ile ribavirin, 297'si pegile interferon ile ribavirin, 3'ü klasik interferon, ribavirin ve pegile interferon tedavisi aldı. Tedavilerin alan hastaların 12'sinde (%2.9)“tedavi altında alevlenme”, 14'ünde (%3.3)“kısmi yanıt”, 89'unda (%21.3)“nüks”, 124'ünde (%29.7)“tam yanıtsızlık”, 179'unda (%42.8) ise“kalıcı viral yanıt”gelişti. Tedaviye en iyi yanıt pegile interferon artı ribavirin ile alındı. Tekli istatistik kıyaslamalarda genç yaş, splenomegali olmaması ve siroz olmaması tedaviye yanıtı anlamlı olarak artırırken, çoklu analizde sadece kombine tedavi kalıcı viral yanıt alınmasında etkili bağımsız değişken olarak bulunmuştur. SONUÇ: Bu çalışma kombine tedavi almanın kalıcı viral yanıt açısından anlamlı olduğunu göstermektedir. En yüksek kalıcı viral yanıt pegile interferon ile ribavirin kombinasyonu alan hastalar arasında görülmüştür."
