abstract: "Eş'arîlik, ortaya çıktığı dönem itibariyle İslam düşüncesini etkilemiş önemli bir mezheptir. Bu mezhebin oluşum sürecinde Ebû Bekir el-Bâkıllânî, İmâmü'l-Haremeyn el-Cüveynî, Gazzâlî gibi pek çok önemli âlim bulunmaktadır. Oluşum süreci itibariyle bu mezhebin fıkıh usûlüne katkılarını, kelâmî tartışmaların da odağında bulunan ta'lîle dayalı kıyas meselesi üzerinden gözlemlemek mümkündür. Bu çalışmada, böyle bir gözlem amaçlanarak kıyas konusu, söz konusu süreç ve bu sürece katkı sağlayan âlimlerin eserleri çerçevesinde ele alınmıştır. Bu bağlamda kıyasın tanımı, meşruiyeti ve naslardan kıyas yoluyla hüküm çıkarılırken vuku bulan illete dair belli başlı meselelere yer verilmiştir. Meselelerin daha iyi anlaşılması için süreç içerisinde yer alan tartışmaların, Mu'tezile başta olmak üzere muhâliflerin görüşleriyle birlikte ele alınmasına önem verilmiştir."
