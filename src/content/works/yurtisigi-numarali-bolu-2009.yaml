abstract: "Osmanlı Devleti, Türk Tarihi ve kültürü içinde çok önemli bir yere sahiptir. İslam hukukunu hukuk sistemi olarak kabul eden bu Türk devletinin en önemli yargı organı, şer'i mahkemelerdir. Bu mahkemeler Osmanlı Devleti'nin muhtelif devirlerindeki hukuki, iktisadi, dini, askeri, idari ve sosyal müesseseleri hakkında bizlere çok değerli belgeler bırakmıştır. Kanun hâkimiyetine büyük önem veren Osmanlı Devletinde mahkemelerde verilen kararlar, günü gününe sicile geçirilmiş, noterlik işleri, şahıs, zaman ve yer göstererek işlenmiştir. Bu titizlikten dolayı, Şer'iyye Sicilleri içtimai ve iktisadi hayat konusunda çok önemli birer kaynaktır.XIX. Yüzyılın çalkantılı olayları, Osmanlı topraklarının tümünü yangın gibi sararken, bu olaylar Anadolu'yu İstanbul'a bağlayan önemli yolların güzergâhında bulunan Bolu şehrini de etkilemiştir. Bu koşullar altında, Bolu'nun yönetim, kent, köy, aile, hukuk, ekonomi, yaşam tarzı vb. bütün idari ve sosyal hayatının nasıl olduğunu, bu durumun halkın günlük hayatına etkisini veya etkisizliğini, 979 Numaralı Şer'iyye Sicilini kullanarak, tezimizde yansıtmaya ve tespit etmeye çalıştık.Tezimizin temeli, Milli Kütüphane Başkanlığı'nda bulunan 979 demirbaş numaralı Bolu Şer'iyye Sicil Defteri'dir. Adı geçen defter, 49 varak olup, 175 vesikayı ihtiva etmektedir. Bu vesikalar, her türde içtimai ve iktisadi meselelerle, muhtelif konularda devlet merkezi ile taşra arasında yapılan yazışmalar ile mahkemede tutulmuş kayıtlardan oluşmaktadır. Vesikalar kayıt altına alındığı dönemin yazı dili ile yazılmıştır.Çalışma konusu olarak seçtiğimiz 979 numaralı Bolu Şer'iyye Sicil Defteri, H. 1295- 1296/ M. 1878- 1879 yıllarına ait, Bolu ve çevresinde hukuka intikal etmiş mahkeme kayıtlarını ihtiva eder. Özellikle bu dönemi seçmemizin nedeni, Bolu ile ilgili olarak bu yılları aydınlatan kaynak çalışmalarının yetersiz olmasıdır. Tez çalışmamızla, Bolu ve Osmanlı tarihi açısından önemli ve yeni bilgilere ulaşmaya çalıştık.Sicil incelenirken önce, belgeleri okuma çalışması yapılmış, okuma sırasında yanlış okunan ya da anlaşılamayan kelimeler için ilgili kaynaklar kullanılarak hata en aza indirilmeye çalışılmıştır. Okunamayan kelimelerin yerine, orijinal metindeki kelimeleri yazılmış olup, okunduğu halde tam emin olunamayan kelimeler (?) işareti ile ifade edilmiştir.Tezimizin I. Bölümünde, Bolu'nun ilkçağlardan Cumhuriyet dönemine kadar olan siyasi tarihi açıklanarak, hangi medeniyetlere ev sahipliği yaptığından, Şer'i Hukuk ve Şer'iyye Mahkemeleri ile Şer'iyye Sicillerinden ayrıntılı olarak bahsedilmiştir. II. Bölümde Bolu'nun o dönemlerdeki idari taksimatı, yönetimi ve idari kadrosu incelenmiştir. III. Bölümde de Bolu'nun sosyal ve ekonomik hayatına ilişkin sicilimizdeki bulgular değerlendirilerek, tespitler yapılmıştır. İncelediğimiz dönemde Bolu'nun dini ve etnik yapısı, folklorik yapısı, aile hayatı, miras ve ceza hukukuna ilişkin uygulamalar, sicilimizin bize verdiği bilgilere göre değerlendirilmiştir. IV. Bölümde ise, kaynağın orijinalini ve özünü görebilmemiz açısından, 979 Numaralı Şer'iyye Sicilimizin transkripsiyonunu yaptık."
