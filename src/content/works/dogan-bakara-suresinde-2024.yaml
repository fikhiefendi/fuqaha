abstract: "Kur'ân, muhataplarına geçmişte yaşamış toplulukların başından geçen olayları ilâhî mesaja uygun bir formda pasajlar halinde sunmaktadır. Bu pasajlarla İslâm toplumuna insanlık tarihi boyunca vahyin indirildiği toplumlarda vahye tabi olan ve vahyin karşısında duranların var olduğu anlatılmaktadır. İnsanların yaptıkları bu tercihlerin neticelerinin olduğu vurgulanmakta ve inananların çektikleri cefalar örneklendirilerek Kur'ân'a tabi olanların çektikleri sıkıntılar sebebiyle Müslümanlar teselli edilmektedir. Muhataplara yaşanmış gerçek olaylar anlatılarak vahyin karşısında olan toplulukların cezaya çarptırıldıkları, inananların çektikleri sıkıntıların ise büyük mükafatlar ile ödüllendirileceği belirtilmektedir. Kıssalar Kur'ân'ın dörtte birinden fazlasını teşkil etmektedir. İslâm âlimleri, Kur'ân'ın önemli bir bölümünü kapsayan kıssalardan İslam hukukuna ve İslâm akaidine dair hükümler çıkarmıştırlar. Kıssalardan hüküm istinbât edilirken çoğunlukla kıssa âyetlerinin tâlî delil olarak ele alındığı konuyla ilgili nas var ise önceliğin bu âyet ve hadislere verildiği görülmektedir. Konu ile alakalı nassın bulunmadığı durumlarda kıssa âyetlerinin aslî delil olarak ele alındığı da görülmektedir. İslâmî ilimlerin teşekkül sürecinden bu yana kıssalardan istinbât edilen hükümleri ele alan müstakil bir çalışma bulunmamaktadır. Bu durum kıssaların fıkhî yönünün geri planda kalmasına sebebiyet vermektedir. Çalışmada Bakara sûresinde anlatılan Kur'ân kıssalarından istinbât edilen fıkhî hükümler, ahkâm tefsirleri ve İslâm hukuku kitaplarında tespit edilmeye çalışılmıştır. Bu çalışmayla kıssaların İslâm hukukundaki yerinin açığa çıkarılması ve kıssalardan elde edilen hükümlerin bir araya toplanması amaçlanmaktadır."
