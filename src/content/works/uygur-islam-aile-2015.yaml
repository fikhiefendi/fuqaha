abstract: "İslâm aile hukukunda hakemlik, aile birliğinin devamlılığı açısından önemli bir kurumdur. Ailevî problemlerin yoğun şekilde yaşandığı günümüzde bu kurumun etkin bir şekilde hayata geçirilmesi önem arz etmektedir. Bu çalışma, hakemlik konusunun geçmişten günümüze nasıl işlendiğinin tespitini ve bu konuda Nisâ sûresinin 35. âyeti esas alınarak ailevî ihtilâfların çözümü noktasında oluşturulan bir model önerisini kapsamaktadır. Tezimizde önce hakemlik kurumunun ortaya çıkışı ve aile hakemliğiyle ilgili temel kavramlar ele alınmıştır. Daha sonra Nisâ sûresi 35. âyetin tefsirlerde ele alınışı aktarılmış ve Hz. Peygamber ile sahâbe dönemindeki hakemlik uygulamaları hakkında örnekler verilmiştir. Fıkıhta meşhur mezheplerin konuya dair görüşlerine değinilmiş, konunun Osmanlı dönemindeki uygulaması ve çağdaş çalışmalardaki durumu incelenmiştir. Ayrıca Doğu ve Batı ülkelerindeki yürürlükte olan mevzuata dair örnekler verilmesinin yanı sıra ülkemizdeki gelişmelere de değinilmiştir. Sonuçta, toplumsal bir probleme ilgili âyet ışığında çözüm bulunmaya çalışılmış ve eşlerin ailelerinden seçilecek hakemlerin sürece müdahil olmasının gerekliliğinin tespiti yapılmıştır. Bu kapsamda, öngörülen hakemlik müessesesinin günümüzdeki mevcut aile mahkemelerinde de etkin kılınmasının ve ayrıca hâlihazırda mahkemelerde görev yapan uzmanlar yanında İslâm aile hukuku uzmanı ve/veya dinî manevî danışman/rehberden de yararlanılmasının faydalı olacağı kanaatine varılmıştır."
