abstract: "577 yılında dünyaya gelen İbnü's-Salâh, birçok farklı alanda uzmanlaşmış olsa da daha çok muhaddis kimliğiyle ön plana çıkmıştır. O, hem fetvalarıyla hem de fetva usûlü ve âdâbına dair kaleme aldığı eseriyle kendisinden sonraki âlimleri etkilemiştir. Özellikle fetva âdâbı literatürüne kazandırdığı Edebü'l-müftî ve'l-müsteftî isimli eserinin fetva âdâbı alanında bıraktığı etki bizi İbnü's-Salâh'ın fıkhî yönünü araştırmaya teşvik etmiştir. Onun fıkhî yönünü ele aldığımız bu çalışmada, muhaddis kimliğinin gerek fetvalarına gerekse fetva âdâbına tesirini de belirgin hâle getirmeye gayret ettik. Araştırmamız giriş ve üç ana bölümden oluşmaktadır. Giriş kısmında araştırma hakkında genel bilgilere yer verildi. Birinci bölümde müellifin hayatı ve eserleri incelenmiştir. Çalışmamızın ikinci bölümü İbnü's-Salâh'ın Edebü'l-müftî ve'l-müsteftî adlı eseri etrafında şekillenmiştir. Dolayısıyla bu bölümde fetvayla ilgili genel kavramsal bir çerçeve çizilerek İbnü's-Salâh'ın fetva âdâbına dair belirlediği ilkeler ortaya konulmuştur. Son bölümde ise İbnü's-Salâh'ın eserlerinden seçtiğimiz bazı fıkhî görüşlerine yer verilmiş, aklî ve naklî delillerden hüküm istinbât etme keyfiyetine dair bazı örnekler sunulmuştur. Bununla birlikte hadisçiliğinin fıkhî yönüne etkisi tespit edilmeye çalışılmıştır."
