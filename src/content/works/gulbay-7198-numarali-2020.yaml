abstract: "Osmanlı Devleti'nin önemli yapısal ve toplumsal birikimlerini yansıtan ve Türk milletinin önemli bir hafızasını teşkil eden şer'iyye sicilleri, zengin muhtevâ husûsiyetiyle muhtelif birçok konuda başvurulması gereken önemli bir kaynak niteliğindedir. Ayrıca devletin pratikteki uygulamalarını yansıtmasının yanı sıra şehir tarihlerine vukûfiyette ve toplum yapılarının tedkikinde araştırmacılara geniş perspektif kazandırmakta ve sosyo-kültürel tarih çalışmalarının müracaat ettiği temel kaynaklardan biri olmaktadır. Osmanlı dönemindeki Rize toplumunun içtimâî, iktisâdî ve dinî yapısıyla alakalı geniş bilgilere ulaşmak ve bu bilgileri tedkik ve tahlil etmek maksadıyla yaptığımız bu çalışmamızda, Hicrî 2 Zilhicce 1270 ile 23 Şevvâl sene 1273 (Mîlâdî 26 Ağustos 1854 ile 16 Haziran 1857) tarihleri arasındaki kayıtları ihtiva eden 7198 numaralı Rize Şer'iyye Sicili Defteri'ne müracaat edilmiş ve sicilde, toplumun birçok yönünü vaz' eden 552 adet hüküm mercek altına alınmıştır. Bahsedilen bu hükmelerden, Rize'nin aile hayatı, şehir yapısı, iktisâdî ahvâli, dinî yaşantısına dâir birçok malûmât elde edilmiş ve elde edilen bilgiler, içtimâî hayat, iktisâdî hayat ve dinî hayat başlıkları altında detaylandırılmak sûretiyle çalışmamıza işlenmiştir."
