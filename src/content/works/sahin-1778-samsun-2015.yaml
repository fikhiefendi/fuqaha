abstract: "Ortaya koymaya çalıştığımız yüksek lisans tezimizde 19. yüzyılın son çeyreğine ait 1778/24 numaralı Samsun Şer'iyye Sicili'nin ilk elli varağı günümüz harflerine çevrilerek defterde bulunan bilgiler ışığında o dönemde Samsun'da mevcut olan toplumsal, ekonomik ve kültürel yapı değerlendirilmeye çalışılmıştır. Giriş kısmında araştırmamızın amacı, önemi, kapsamı ve yöntemi üzerinde durulmuştur. Yine Samsun Şer'iyye Sicillerine dair genel bilgiler verilerek Şer'iyye Sicillerinin içeriği ve önemi aktarılmaya çalışılmıştır. Ayrıca, Osmanlı Devleti'nde mevcut bulunan adli teşkilatlar ve bu teşkilatlar bünyesinde yer alan yetkililer irdelenerek kurum ve kişiler hakkında gerekli bilgiler ortaya konmuştur. Adli teşkilatın en önemli yetkili kişisi olarak özellikle Kadı ve Kadı'nın özellikleri, Kadı yardımcıları olarak Naibler, Muhzırlar, Katipler ve Kassâmlar hakkında bilgi ve değerlendirmeler ortaya konmuştur. Kadıların tuttuğu kayıtlar olarak İ'lâm, Hüccet, Tereke, Vakfiye, Ma'ruz ve Mürasele; başka makamlardan gönderilip de sicillere giren belgeler olarak da Ferman, Berat, Tezkire ve Temessükler hakkında bilgi verilmiştir. Tüm bu bilgilerin ardından 1778/24 numaralı Samsun Şer'iyye Sicil Defteri'nin ilk elli varağının tanıtımı yapılmıştır. Çalışmamızın ikinci bölümünü 1778//24 numaralı Samsun Şer'iyye Sicil Defteri'nin ilk elli varağının Osmanlıca metninin günümüz harflerine transkripsiyonu oluşturmaktadır. Üçüncü bölümde ise incelediğimiz Samsun Şer'iyye Sicillerine dair değerlendirmeler yapılmıştır. Samsun'daki meslek grupları; sosyal, dini ve etnik yapı; kültürel ve iktisadi hayat üzerine veriler üzerinden değerlendirmeler gerçekleştirilmiştir. Son olarak ise sicil hakkında genel bir değerlendirme gerçekleştirilerek sonuç bölümüyle çalışmamız bitirilmiştir."
