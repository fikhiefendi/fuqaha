abstract: "Hz. Peygamber'in (s) vefatının ardından yaşanan Hilafet tartışmaları Müslümanlar arasında ilk fırkalaşmanın temellerini oluşturmuştur. Haricilik, hilafet tartışmalarının neden olduğu siyasi mücadelelerin en yoğun yaşandığı dönemde radikal dini görüşlerle ortaya çıkarak yaşananlara teolojik bir boyut kazandırmıştır. Hariciler bütün siyasi faaliyetleri akide ekseninde değerlendirdikleri için farklı siyasi görüşleri akidevi bir farklılık olarak telakki etmişlerdir. Haricilerle bazı ortak yönleri bulunan ve 18. yüzyılda Arabistan'da ortaya çıkan Vehhabiler ilk olarak Necid bölgesinde faaliyetlerde bulunmuş daha sonra İslam dininin en kutsal bölgesi olan Hicaz topraklarına hükmetmişlerdir. Vehhabilik, dini konularda getirmiş oldukları yeni yorumlar ile çok tartışılmıştır. Vehhabiler yoğun faaliyetler sonucunda İslam dünyasının farklı coğrafyalarında taraftar kazanmışlardır. Bu çalışmada biri İslam mezhepleri tarihinde ilk ortaya çıkan fırka olarak kabul edilen Haricilik ile günümüze nispeten daha yakın bir tarihte ortaya çıkan Vehhabilik hareketinin her açıdan mukayesesi yapılmaya çalışılmıştır. Tekfir, şiddet ve ötekileştirme ile özdeşleşen biri klasik diğeri ise modern döneme ait iki fırka siyasi, sosyolojik ve teolojik olarak mukayese edilmiştir. Aynı coğrafya ve sosyokültürel ortam içerisinde ortaya çıkan bu iki fırkanın benzer fikir ve eylemler geliştirdikleri görülmüştür. Kendinden olmayanın doğal düşman olarak görüldüğü bu sosyokültürel atmosferin bir sonucu olarak iki fırkanın da tepkisel ve şiddet yanlısı bir tutum sergilediği tespit edilmiştir."
