abstract: "Bu tez konusu ters istisna' (istisna' el makus) akitlerinin ki bu akit türü modern akitlerden sayılmaktadır.Günümüz bankaları arasından Dubai İslam bankası ve Ebu Zabi bankasının uyguladığı bu akdi tanıtıp problemlerini ve ihtiyaç olma nedenini ve şeriata uygunluğunu incelemek için ele alınmıştır.Aynı zamanda yakın akidleri karşılaştırarak diğerlerinden farklı kılan özelliklerini tezde gösterdik. Tezin projesi aşağıda ki gibidir; Giriş, İçerisinde istisna' ve İstisna' makus olan İslami finans yöntemlerini ele alır.Birinci bölümde İstisna'nın tanımı ve İstisna' makusun tanımını ayrıntılı bir şekilde ele alır.İkinci bölümde Günümüz ictihad ışığında istisna' i makusu ve bankalarda işleyişini ele alır.Üçüncü bölümde İstisna'i makusun finans yöntemleri ile karşılaştırılmasıyla beraber günümüze olan güncellemesinin nasıl olması gerektiğini ve problemleri sonuçlanma yöntemleri bakımından ele alır. Sonuç bölümünde ise bulgu ve sonuçları irdeledik. Bu tez çalışmasının sonucunda bu akit türünin caiz olduğu noktasına ulaşılmış olup, iki ayrı caiz olan akdin ; müva'zi istis'na ve zimmette vasıflandırılmış icare akitlerinin bileşimi ile olur.Bu yöntemlerin cevaz noktalarınada değinerek bu konuya cevaben yazılmış şeriata aykırı oluduğu ileri sürülen mütekaddimun ve müteaahirun fıkıhçıların ve çağdaş fıkıhçıların görüşleri doğrultusunda ve İslam fıkıh mecmuasının görüşlerine ek olarak akdin meşru sayılması için bazı koşulları öne sürdük. Aynı zamanda bazı öneriler sunduk ki yeni akid türlerine uygunluğunu yakalayabilsin diye. Muhakkak ki başarı Allah (C.C) 'nun rızasıyladır. Bu şekilde finans akitlerinde ayrıntılı olarak,tanımından, gelişim evrelerine ,özelliklerinden önemine ve finansörlerin ve finans edilmeyi bekleyen proje sahiplerinin durumlarını bu tezimizde elimden gelen şeriat yönünden bu tür akitlerin yönünden hükümlerininn caizlik yönünden hükmüne ulaşmak için çalıştık.Fıkıh mecmualarında bu konunun irdelenmemiş olmasıda dikkate şayandır.Bu akittede de bulunması gereken şart ve dapt unsurlarına değindik. İstisnai makusun ve günümüz akitleri arasında bazı yönleri açısından ; hüküm ve özellikleri açısından irdeledik.Sonuç olarak bu akit türünün caiz olduğuna ulaşıldığını ve finanse bireylerin birden çok probremlerine cevap niteliğini taşımaktadır. Bazı şartlara cevap vermesi özelliği ve şüpheli durumlarla beraber itiraz durumlarını akdin geçerliliğini koruması ile ilgili yeni akitleri serd ettik.Yeni açıklamarda bulunduğumuz bu yeni akid türündeki tezimizdeki amacımız problemler cevap niteliği taşımasıdır.Kısacası tezimizde bunlardan bahsetmiş bulunmaktayız."
