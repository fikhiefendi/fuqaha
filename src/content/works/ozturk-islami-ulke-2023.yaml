abstract: "Bu çalışmada İslami Ülke Endeksleri ve Borsa İstanbul (BİST) Katılım Endeksleri arasındaki nedensellik ve endeksler arasındaki volatilite yayılımı incelenmiştir. Bu kapsamda İslami Ülke Endeksleri olarak, Bahrain all Share(BAX), Dubai genel (DFMGI), QE All Shares (QEAS), MSM 30(MSX30), Premier Market- Market Cap Weighted PR (BKP),endeksleri seçilmiştir. BİST Katılım Endeksleri olarak BİST100, BİST50, BİST30, KATILIM30, KATILIM50, KATILIM100, TÜM KATILIM100 endekslerinin 01.02.2015-11.03.2022 tarihleri arasındaki günlük getiri serileri kullanılarak endeksler arasındaki nedensellik ilişkisi Fourer Toda Yamamato testi ile incelenmiştir. Diğer taraftan endeksler arasındaki volatilite yayılımı Hafner Herwatz testi ile incelenmiştir. Çalışmanın sonucunda İslami Ülke Endekslerinden Borsa İstanbul Endekslerine doğru nedensellik ilişkisinin var olduğu tespit edilmiştir. Aynı şekilde İslami Ülke Endekslerinden Borsa İstanbul Endekslerine doğru volatilte yayılımının varlığı tespit edilmiştir. Bu kapsamda İslami Ülke Endekslerinin Borsa İstanbul Endekslerine yatırım yapmayı düşünen yatırımcılar için öncü bir gösterge olarak kullanılabileceği ön görülmektedir. Bu çalışma portföy yatırımcılarına, politika uygulayıcılarına ve kurumsal yatırımcılara önemli bilgiler sunmaktadır."
