abstract: "Bu çalışma, deneyime ilişkin konuların ayrıntılarının yanı sıra uzmanlık konusuna ilişkin bazı hukuki ve hukuki konuların ve yeni bilimsel yöntemlerin izlenmesine dayanan analitik ve uygulamalı bir yaklaşımla karakterize edilmiştir. Olay mahallinde bilirkişilerin görev ve sorumluluklarına göre atanmalarından başlayarak, hakim ve dava taraflarının teknik bilirkişilik ile ilişkisinden, yargının tarihsel sunumu ile konunun çözümlenmesine yönelik nihai işlemlere kadar. Araştırmanın konusunu ve amacını, konunun önemini ve soruşturma araçlarının geliştirilmesi ve suçları tespit etmek için yeni araçların kullanımına uygun başlığın seçilmesinin nedenlerini tartıştığımız bir giriş ve önceki deneyimle ilgili çalışmalar ve bunları diğerlerinden ayıran özellikler, araştırmamızı yazarken güvendiğimiz ve yararlandığımız en önemli referanslar ve çalışmaya yaklaşımımız. Deneyim ve cezai delille bağlantısı ve uzmanlık çalışmasının mahiyetindeki hukuki ve çeşitli teorilerden hukukî kavramı farklı kılan unsurların neler olduğunu ve ayrıca Bilirkişilerin nasıl görevlendirileceğini ve bilirkişinin misyonunun uyarlanmasından, bilirkişinin özelliklerinden bahsettik. ve tecrübe ve diğer kavramlardan farkı, ispattaki rollerinin önemi ve meşruiyeti, ayrıca hukuk ve ceza davalarında uzmanlık türleri ve ardından uluslararası ve iç tahkimdeki deneyim ve uzmanları sınıflandırdık ve bu konuda konuştuk. içtihat ve hukukta bilirkişide bulunması gereken uygunluk Hak ve görevleri, bilirkişi raporunun tartışılması, gerçekliği ve ispat değeri ve hâkimin mahkemelerde bu raporlara bağlılığının derecesidir. Bu önsözü, şeylerden ve insanlardan çıkarsanan ispat vasıtaları hakkında bir konuşma izledi ve üç bölümden oluşuyor, birincisi: Bilimsel araçların ispattaki otoritesinin beyanı ve bu tür delillerde hâkimin kanaatinin ölçüsü. ve ikincisinde modern araçların ikna gücü, yani hakimin yetkisi ve takdiri ve bu araçları değerlendirmesi ve karar üçüncüsü elektronik delillerle cezai ispat tecrübesi, elektronik delil elde etmenin hukuki açıdan hukukiliği. müfettiş, cihazın yeri, arama nedeni ve maddi olmayan nesnelerde dijital delil arama konusundaki yasal konumudur. Bir sonraki bölümde, olay yerinin ve olay mahallinin, olayların fotoğraf veya videolarla belgelenmesi ve ardından kayıt altına alınması veya kaza mahallinin planlanması ve olay yerindeki eski eserlerle nasıl başa çıkılacağı hakkında konuştuk ve ardından polisin rolünden bahsettik. Uzmanlar, parmak izi, ayak gibi her türlü parmak izinin kalkması gibi bu etkileri kaza mahallinde incelemeye başlar ve olay mahallindeki bu izlerin sonuncusu daha sonra sıvılarla nasıl başa çıkılacağından bahseder. Dördüncü bölümde, failin suç işlerken kullandığı yerlerin, nesnelerin, malzemelerin ve makinelerin tespiti, ardından belge, belge ve hatların incelenmesi, eşleştirilmesi ve sahtecilikle nasıl mücadele edileceği konusunda uzmanın rolünü anlattık. Bir yanda para ve menkul kıymetler ve bunların uzman uzmanlar tarafından tespit edilmesi, diğer yanda silah, araba ve cam izlerine ve silah, mermi, zarf izleri de dahil olmak üzere toz ve bilgi suçlarına ve bunların nerede tespit edileceğine değindik. Suçlu kir izlerinden geliyor. Beşinci ve son bölümde ise bazı maddi ve manevi konuların incelenmesi ve ortaya çıkarılmasında doktorların rolünden, zehir suçları, tecavüz, ceset diseksiyonu, dayak ve kürtajın etkileri, yangın suçları gibi maddi olaylardan bahsettik. İntihar vakalarının tespiti, failin yaşının tespiti ve diğer konular. Sonrasında ise şu şekilde bazı sonuçlara ve önerilere ulaştığımız sonuçla mesajımızı sonlandırdık: Sonuç olarak, Kanun koyucu, cinayet, yağma veya soygun gibi çeşitli suçlarda olay mahallerinin fotoğraflanması, tıbbi cihaz kullanımı gibi güvenilir delillerin ortaya çıkarılması için modern ve gelişmiş bilimsel araçların kullanılmasında hâkimin yeterli miktarda menfaat ve menfaat elde etmesine izin vermiştir. Delil elde etmede ispat yöntemlerinin çokluğu ve bunlardan biri de müphem gerçeğe ulaşmak için bilirkişilerin kullanılmasıdır ki bu da kanun koyucunun delili değerlendirmede hâkimden bilirkişi rolünü olumlu ve etkili bir şekilde beyan etmesini ve talep etmesini sağlamıştır. Teknik veya bilimsel nitelikteki davalarda gerekli raporları mahkemelere sunarak birçok suçun ispatında ve teşhirinde bilirkişinin, doktorun, mühendisin, bilim adamının veya her neyse, rolü önemsiz değildir. Durumunda yardım, reddedilemez. Bilimsel köklere bağlı olması ve sağlam bir süreç olması nedeniyle özellikle genetik parmak izi olmak üzere parmak izi alanında bilirkişi raporlarından elde edilen bilgiler doğrudur. Öneri olarak ise, Çeşitli konularda ve davalarda bilirkişiliğin önemi ve gerçeğe ulaşmadaki rolü hakkında bilgi sahibi olmak için karakollarda, soruşturma hâkimlerinde ve müfettişlerde sorumlu pozisyonda bulunan ceza soruşturmasına yetkin kişileri dâhil edin. Bilirkişi delil alanında, özellikle de suç teşkil edenlerle ilgili olarak araştırma yapar."
