abstract: "İnsanın sosyal bir varlık olduğu bilinmektedir. Bundan dolayı insani ilişkilerde çatışmalar ve sıkıntılar ortaya çıkmaktadır. İşte hukuk burada devreye girmekte ve bu anlaşmazlıkları çözmeye çalışmaktadır. İslam hukukunun, esas gayelerinden birinin de insanlar arasında vuku bulan bu ihtilafları çözmek olduğu söylenebilir. Bu temel hedef fıkhın ibadet kısmında da belirmektedir. Birçok fıkhi hükme kaynaklık teşkil etme ehemmiyetine haiz olan külli kaidelerden,“ihtilafların çözümlenmesi”kuralı da bahsettiğimiz temel gayenin doğrultusunda ortaya çıkmıştır. Fikri düzeyde ihtilaf meşru hatta matlup iken, ortak noktada buluşma imkânına rağmen hükümlerin farklılaşması ve bu farklılıklardan ileri gelen uygulamaların çeşitliliği, hukuk pratiğini zorlamaktadır. Bu sebeple mezheplerin teşekkül ve tekâmül süreçlerinde ve sonrasında mevcut birtakım ihtilafların çözümlenmesi arayışına girilmiş, bu noktada mezheplerin farklı uygulamaları gözetilerek ilgili hükümlerin uzlaştırılması yoluna gidilmiştir. Netice olarak bulunan bu çözüm bir kural halini almış, birçok fıkhi ahkâmı bünyesinde bulunduran ve müçtehide kolaylık sağlamada temayüz eden“külli kaidelerin”arasına girmiştir. Bu çalışma ihtilafların gözetilip çözülmesi yönündeki külli kaidenin, Şafii mezhebinin ibadetler bölümündeki pratiğini ele almaktadır. Çalışmada öncelikle kuralın tanımı, şartları ve hücciyyeti işlenmiştir. Daha sonra Şafii mezhebinin fıkıh kitaplarındaki ibadet bölümünde kuralın icrası ortaya konulmuş, bilahare araştırmacının tercihi beyan edilmiştir. Son olarak da çalışmanın elde ettiği bazı sonuçlar serdedilmiştir. Anahtar Kelimler; Fıkıh, Şafii, İbadetler, Külli Kaideler, İhtilaf, Çözüm"
