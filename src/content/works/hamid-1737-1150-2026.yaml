abstract: "Bu çalışma Abdullah b. Ömer b. Osman el-Hanefî Mestçîzâde'nin Nâsırüddîn Beyzâvî'nin Tefsîri üzerine kaleme aldığı haşiyenin (536/b varaktan 576/b. varağa kadar) tahkik ve tahlilini içermeketedir. Tahkikini yaptığımız haşiyenin bu kısmı Kur'n-ı Kerîm'de yer alan Enfâl Sûresi'nin 14. âyetinden Tevbe Sûresi'nin 2. âyetine kadar olan kısmın tefsirini kapsamaktadır. . Bu hâşiye, Nâsırüddîn el-Beyzâvî'nin diğer şerhlerinde eksik bırakılan yahut yeterince ele alınmayan meseleleri tamamlaması bakımından önemli bir boşluğu doldurmakta ayrıca tefsirin ince meselelerini ilmî kaideler, hadis usûlüne dair prensipler, dil ve edebiyat meseleleri ile tenkit mahiyetindeki değerlendirmelerle mezceden ansiklopedik bir muhteva ortaya koymaktadır. Eserde ayrıca müellifin, Nâsırüddîn el-Beyzâvî, Zemahşerî gibi diğer âlimlere yönelik istidrâk ve tenkitleri de içermektedir. Çalışmanın önemini artıran bir diğer husus ise müellif Mestçîzâde'nin ilmî konumudur. Nitekim kendisi, İstanbul'daki Sahn-ı Semân medreselerinde müderrislik yapmış, döneminin önde gelen Hanefî âlimlerinden birisidir. Ayrıca Haremeyn kadılığı görevinde bulunmuştur. Bunun yanında tefsir, hadis, fıkıh ve dil ilimleri başta olmak üzere birçok sahada temayüz etmiş çok yönlü bir âlimdir. Hâşiyenin tahkikinde Türkiye'de bulunan iki yazma nüsha esas alınmıştır. Araştırmada, Nasîrüddîn el-Beyzâvî ile şârih Mestçîzâde'nin hayatlarının ele alındığı bölümlerde betimsel ve tarihsel yöntem takip edilmiştir. Tahkik kısmında ise karşılaştırma, mukabele ve ilmî tahkik metodu uygulanmış, metin yazma nüshalardan aktarılmış, nüshalar arası farklılıklar dipnotlarda gösterilmiş ve nakledilen görüşler ile metinler asli kaynaklarına nispet edilmiştir. Çalışmada birtakım önemli sonuçlara ulaşılmıştır. Bunların başında, şârih Mestçîzâde'nin, Nasîrüddîn el-Beyzâvî'nin tefsirinde açıklamaya ihtiyaç duyulan müşkil meseleleri titizlikle seçmesi, bu konularda şârih ve müfessirlerin görüşlerini nakletmesi, ardından bunları tahlil ve tenkit süzgecinden geçirerek değerlendirmesi gelmektedir. Ayrıca sahâbe ve tâbiîn neslinden gelen sahih rivayetlere önem vermiş, bununla beraber hadis tenkidi ve rivayet metodolojisine dair ilmî hassasiyet göstermiş, zayıf haberleri ve yalnızca şahsî görüşe dayanan yorumları reddetmiştir. Mestçîzâde'nin yöntemi açık ve doğrudan bir tenkit üslubuyla öne çıkmaktadır. Bu bağlamda Zemahşerî, Nâsırüddîn el-Beyzâvî ve diğer müfessirlerin görüşlerini tartışmış, ayetlerdeki ince anlamları, belâgat inceliklerini ve ilmî nükteleri ortaya koymuştur. Müellifin ilmî tercihleri arasında, ehl-i sünnet'in“masum kimsenin elem görmesinin câiz olduğu ve bunun karşılığında telafinin vacip olmadığı”yönündeki görüşünü benimsemesi dikkat çekmektedir. Bunun yanında,“muvâdaa(mütareke) ayetinin”hükmünün muhkem olduğunu, uygulanmasının ise devlet başkanının ictihadına bağlı bulunduğunu tercih etmiştir. Aynı şekilde Hz. Peygamber (sav)'in ictihadda bulunmasının câiz olduğu, ancak hata üzere bırakılmayacağı görüşünü de benimsemiştir. Ayrıca savaş yapılmaksızın dârülharpten elde edilen mallar konusunda Hanefîler ile Şâfiîler arasındaki ihtilafa temas etmiştir. Buna göre Hanefîlerin bunu ganimet kapsamına dahil etmediğini, Şâfiîlerin ise sahih kabul edilen görüşe göre ganimet saydığını aktarmıştır. Ancak müellif, bu iki görüşten herhangi birini açık biçimde tercih etmemiştir. Genel itibarıyla söz konusu hâşiye, zengin ilmî muhtevası, müellifinin geniş birikimi ve sağlam ilmî yetkinliğini yansıtan kıymetli bir eser niteliğindedir."
