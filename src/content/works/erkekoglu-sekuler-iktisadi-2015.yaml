abstract: "Bir toplumda sosyal adalet ve sosyal dayanışma amaçlandığı takdirde, toplumu oluşturan birimlerin tamamının maddi ve manevi ihtiyaçlarının karşılanması ve garanti altına alınması gereklidir. Toplumsal saadet ya da refah kavramından“sadece maddi mutluluk”algılandığı takdirde, manevi ihtiyaçların iktisadi sorunlara dâhil edilmediği anlaşılmaktadır. Bu durumda refah kavramı yalnızca“maddi zevklerin tatmini”nden ibarettir. Uluslararası iktisat,“yalnız kendisine hep daha fazlasını elde etmek için yaşayan insanların zevklerinin ve hazlarının toplamının artışının sağlanması”na odaklanmaktadır. Toplumsal refah seviyesindeki artışı“daha fazla tüketebilmek”olarak algılayan Geleneksel iktisadi zihniyet, Avrupa Aydınlanması esaslarına dayanmaktadır. Aydınlanma düşüncesine bağlı“kendi kendine işleyen piyasalar”, iktisadi ilişkilerde“insan doğasının”egoist davranış ilkesine dayandığı fikri savunur.“Seküler”esaslara dayanan ve egoist bireylerden oluşan“doğal düzen”de toplumun mutluluğu yerine önce bireysel mutluluk amaç edinildiği“ için, ”yalnızca merhametsiz, acımasız, dinsiz, gaddar ve maddi güç sahibi bireylerin mutluluğu“ gaye edinilecektir ki bu bireylerin mutlulukları birbirleriyle çatışabilmektedir. Egoist ve çıkarcı bireylerden oluşan ”doğal düzen“ esasına dayalı bir toplumda dünyevi ve uhrevi saadeti temin etmek mümkün değildir. ”Batı'lı zihniyete dayanan iktisadın egoist davranış motifi ve Allah inancı yerine insan aklını merkez yapan dünya görüşü“, Ortadoğu-İslâm toplumunun ”Âhiret inancı gereği iktisadi yaşamının dayanışmacı anlayışı“ ile çelişmektedir. Liberal sisteme dayalı iktisadın zihniyet temellerinde, düzenin Tanrısal olmadığı, sistemin merkezinin kişisel menfaat olduğu kabul edilmiştir. Hayatın iktisadi alanında amaç, en çok ve en özgür biçimde kişisel menfaat elde etmektir. Toplumsal yaşamın ”doğal oyun düzeni“ olduğu, her karar vericinin maksimum menfaat sağlamayı arzuladığı, egoist davranışın rekabet neticesini ”doğal“ olarak ortaya çıkardığı, egoizmin geliştirilmesinin faydalı olduğu ve iktisadi karar verici birimlere mutluluk getireceği inancı, İslami zihniyet esaslarına dayalı iktisat öğretisine aykırıdır. Geleneksel iktisadın ”seküler zihniyet esasları“ Darwinci zihniyete ve Pantheist inanca dayanması gerekçesiyle ”seküler iktisadi bireyin“, ”güçlünün zayıfı ezdiği bir mücadele olan iktisadi hayatta, dinsiz, gaddar ve acımasızca davranış göstererek, hiçbir engel tanımadan, her türlü kutsal değeri ezip geçerek, dünyevi menfaatine ulaşmayı kendisine bir amaç edinmesi“ nin mümkün olmadığı ispat edilemez. ”Her birimin bencilce ve rasyonelce davranarak yalnızca kendine maksimum çıkar sağlayan alternatifi tercih ettiğinde toplumun maksimum refaha ulaşacağı“na dair ”ideal ve maksimum refah sağlayıcı doğal düzen“ çelişkilidir. İktisadi aktörlerin başkalarının durumlarına kayıtsız kalarak yalnızca kendi çıkarları doğrultusunda hareket etmelerinin neticesi gayr-i ahlaki bir tavır sayılabilir. Bu zihniyet esasları pratikte, tabiat-perest ve materyalist felsefeye dayanmaktadır. Bu nedenlerle, Ortadoğu-İslâm toplumunun zihniyet esasları, Batı zihniyet esaslarına dayalı ”seküler iktisadi anlayış“a uymamaktadır. İnsanın kâinattaki hedefi sadece kendi dünyevi mutluluğunu sağlamak olmadığı”için,“seküler iktisadi insan”ın nitelikleri, Kur'an hakikatlerine göre tarif edilen insanın en ehemmiyetli gayesinin manasına aykırı olduğu görülebilir. Bununla birlikte, İslami kuralların hükmündeki iktisadi düzende gerçekleşebilecek bir“toplumsal saadet ve refahın”başka hiçbir sistemde mümkün olmadığı anlaşılmaktadır. Yöntemine bakılmaksızın, iktisadi aktiviteler,“insanlığın gereği olan merhamet kavramına zıt düşen egoizm, hırs ve menfaatçilik esaslarına bağlı faiz müessesesine dayalı bir rejimde işlemektedir. Bir diğerine tepki olarak ortaya çıkan İktisat ekolleri, ahlaki kaideleri esas tutan ve adalet kavramını gerçekleştiren bir öğreti izlememişlerdir. İslâm'ın öğretisine aykırı olan ”gücün hak doğurduğu“ görüşüne bağlı tabiat-perest ve maddeci zihniyet, iktisadi birimlerin maddesel faydacı esasa bağlı olarak, ”rasyonel davranışlar sonucunda toplamlı veya makro seviyede toplumsal oluşumlarını“ açıklamaya yönelmiştir. Buna göre, toplumsal yaşamın iktisadi alanının en büyük mutluluğa, en çok hazza ve tatmine ve maddi çıkarlara erişmek amacında birbirilerinden mümkün olduğu kadar çok menfaat elde etmek isteyen iktisadi karar vericilerden meydana geldiği anlayışı hakimdir. Ancak İslâmi zihniyette, maddesel menfaat uğruna her şeyin feda edilmesi kabul edilebilir bir anlayış değildir. Semavi dinler insanlara huzur, düzen, dünyevi ve uhrevi hayatı için saadeti temin eden ilkeler, esaslar getirmiştir. Semavi dinlere göre, toplumda egoist ve merhametsiz davranışlarla her birimin kendi iktisadi başarısının peşinde olması aykırı bir görüştür. Bu demektir ki, ”egoizm ve menfaatçilik, bilinç sahibi olanların bütünlüğüne, birliğine engeldir“. Buna göre, İslami yaşamda iktisadi davranışın ve motivasyonunun, İslami toplumun iktisadi saadetinin tanımının, İslami prensiplere uygun uluslararası iktisadi ilişkilerin hedefinin, uluslararası boyutta ekonomik bütünleşmenin temellerinin ve hedeflerinin ”Seküler iktisad“ın doktrinine ve varsayımlarına göre açıklanması anlamsız ve çelişkili olacaktır. Ortadoğu-İslam Toplumunda iktisadi zihniyet kaidelerine bağlı bir sistem oluşturulması bir ”gereklilik“tir. Bu ”gereklilik“ İslami kaidelere uygun bir ekonomik entegrasyon modeli ile somut bir çözüm haline gelebilir. ”Sadece azami dünyevi zevk alma amacıyla iktisadi işlem“, Ortadoğu ve İslam Âlemi için umumun gayesini ve saadetini temin edemez. Orta Doğu-İslam dünyasının bir kaynaşma içerisinde olması, ekonomik bütünleşmeye doğru gitmesi için, Batılı zihniyet esaslarına talip olması çelişkilidir. Bütünleşmenin en önemli sebebi din ve ümmet anlayışıdır. Ortadoğu-İslam toplumu için ”ekonomik entegrasyon“ tercihi, entegrasyondaki ülkeler ve İslam Dünyası için ”en iyi strateji\" olacaktır. Bütünleşen ekonomilerin idare edilmesi gereği ve her ülkenin farklı olanaklara sahip olması gereği, aralarında muamelatta zulümler, aldatmalar olmaması için Şer'i hükümlerin ve Sünnet'in belirleyici olması zorunludur. Bundan dolayı, İslami ekonomik bütünleşmede en önemli esaslar faiz müessesesinin olmaması ve zekât müessesesinin olmasıdır. Toplumsal yaşamda dayanışma, sadaka, hıllet olmalıdır."
