abstract: "İslam hukuku sanık hakları ve güvenliği konusunda kararlı bir tutum sergilemiş ve ceza usul kurallarıyla bu tutumu desteklemiştir. İslam dininin en başından beri insanlara tanımış olduğu haklar modern hukukta çok sonraları kabul görmüş ve uygulama zemini bulmuştur. Bu haklardan biri olan ve İslam hukukunda“Berâet-i zimmet asıldır”şeklinde vücut bulan masumiyet karinesi on dört asırdan beri bilinmekte ve titizlikle uygulanmaktadır. Yakın bir zamana kadar modern hukukta sanık suçlu muamelesi görmekte ve hakları ihlal edilmekteydi. İslam hukuku ise insanlara potansiyel suçlu gözüyle bakmamakta ve kişinin suçluluğunu ispatlamaktan ziyade suçsuzluğunu ortaya koymaya çalışmaktadır. Bizim amacımız insan haklarına saygının bir sonucu olarak kabul edilen ve adil yargılanmanın önemli bir ilkesi olan masumiyet karinesinin İslam ceza hukukundaki durumunu ortaya koymaktır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Girişte çalışmamızın konusu, amacı, kapsamı ve yöntemi ele alınmıştır. Birinci bölümde masumiyet karinesi kavramı, konumuz açısından temel teşkil etmeleri sebebiyle suç ve ceza kavramları, dâva ve yargılama usulü konuları incelenmiştir. İkinci bölümde ise masumiyet karinesinin sonuçları, ilgili olduğu haklar ve modern hukuktaki tarihi seyri ele alınmıştır. Ayrıca masumiyet karinesi kapsamında ispat vasıtalarına yer verilmiştir."
