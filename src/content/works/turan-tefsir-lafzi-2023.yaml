abstract: "İslami ilimler içerisinde doğrudan Kur'ân'ın anlaşılması ve yorumlanmasını konu edinen ilim tefsirdir. Tefsir, çok erken dönemde gelişip tedvin edilmesi, geniş bir literatürünün ve ricalinin (müfessirler) bulunması gibi açılardan bir ilim olarak kabul edilmiştir. Ancak İslam ilim ve düşünce tarihinin ilerleyen dönemlerinde yeni gelişmelere paralel olarak ilim anlayışında birtakım değişimler meydana gelmiştir. Artık bir ilmin, müdevven bir ilim olarak kabul edilmesi için tek başına onun bir konusunun ve onun etrafında oluşan meselelerinin bulunması yeterli görülmemiştir. Meselelerin tasdik ve tahkik edilebilmesi için, diğer bir ifadeyle meselelerin kendilerine göre incelenebileceği birtakım kaidelerinin de bulunması şart koşulmuştur. Bu bağlamda tefsirin nasıl bir ilim olduğunu tartışan ve ileri sürdüğü iddialarla sonraki süreçte de etkili olan ilk müfessirin Molla Fenârî (ö. 834/1431) olduğu ifade edilebilir. Ona göre bir birikimin ilim olarak adlandırılabilmesi için konu ve meselelerinin yanı sıra kaidelerinin de bulunması icap etmektedir. Ancak o, tefsirin yeterli düzeyde kaidesinin bulunmadığını düşünmektedir. Buna göre de tefsir için ilim tabirinin hakiki anlamda kullanılmasının uygun olmadığı sonucuna varmaktadır. Molla Fenârî'nin, istisnai olarak zikrettiği kaidelerin ise ağırlıklı olarak lafzî kaidelerden meydana geldiği anlaşılmaktadır. Ancak, tefsiri ilimle nitelemeye yetmeyecek kadar az olduğu ileri sürülen bu kaidelerin tefsirlere bakıldığında çok sayıda örneği bulunduğu görülmektedir. Bu sebeple tezde, bir rivayet tefsiri olan Taberî'nin (ö.310/923) Câmiu'l-Beyân'ın da ve bir dirayet tefsiri olan Mâtürîdî'nin (ö.333/944) Te'vîlâtü'l Kur'ân'ın'da lafzî kaidelerin durumunu araştıracağız. Bu kaideleri kaynakları, bağlayıcılıkları, istisnaları, kullanılma sıklığı ve çeşitliliği gibi açılardan mukayeseli bir şekilde inceleyeceğiz. Tezde, Taberî ve Mâtürîdî tefsirleri örnekleminde yapılacak araştırmanın sonuçlarının ve bu kaidelere dair bulguların, genelde tefsir için de ilim kavramının kullanılıp kullanılamayacağı tartışması özelde ise Molla Fenârî'nin mezkûr görüş ve iddialarının yeniden sorgulanması açısından önemli bir işlev göreceği umulmaktadır. Diğer yandan bu konu doğrudan tefsir usulüyle de ilişkili olduğundan dolayı, özellikle günümüzde tefsirin usulü konusundaki tartışmalara ve bu husustaki araştırmalara da lafzî kaidelerin varlığı ve tefsirdeki işlevleri gibi açılardan katkı sağlayıcı olacaktır."
