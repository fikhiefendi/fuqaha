abstract: "Alacak hakkı bir borç ilişkisi kapsamında borçlunun alacaklı karşısında yerine getirmesi gereken yükümlülüğün, alacaklı açısından tezahür ediş biçimidir. Aynî haklarla birlikte malvarlığı sahasının en önemli bileşenini oluşturan alacak hakkı fıkıh literatüründe genellikle milk kapsamında ele alınmakta ve yükümlülüğün türüne göre deyn, vâcib, iltizam gibi kavramlarla ifade edilmektedir. İslam hukuku borç ve mutalebe kavramlarının arasını net bir şekilde ayırmakta, bu sayede borçluyu alacaklının tahakkümünden belirli ölçüde azade kılarak objektif bir borç telakkisini benimsemektedir. İslam hukukçularının kelam ilmine ait kabulleri parça borçları konusunda etkili olmuş, bu durum özellikle de mülkiyetin nakli şeklinde gerçekleşen parça borçlarından söz etmeyi zorlaştırmıştır. İşgörme şeklinde gerçekleşen yapma borçlarının pek çok örneğine fıkıh eserlerinde rastlamak mümkünse de yapmama borçlarına ilke olarak yalnızca diğer olumlu edimler kapsamındaki yan yükümlülükler şeklinde yer verilmektedir. Alacağın nakli konusunda İslam hukukçuları arasında farklı içtihatlar bulunsa da ticari toplumların yaygınlaşmasıyla birlikte alacağın üçüncü kişilere temlikine izin veren fakihlerin görüşlerinin gittikçe kabule şayan hale geldiği görülmektedir."
