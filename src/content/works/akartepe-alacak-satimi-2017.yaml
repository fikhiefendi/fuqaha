abstract: "Borca dayalı yürütülen ekonomik faaliyetlerin bir sonucu olarak zaman zaman alacağın satımı gündeme gelmektedir. Alacak satımını konu edinen uygulamalardan biri de varlık yönetim şirketleridir. Alacak satımı konusunu varlık yönetim şirketleri örnekliğinde el alan bu çalışma üç bölümden oluşmaktadır. İlk bölümde alacak satımı uygulamalarının fıkhî yönüne temas edilmiştir. Bu bölümde, fıkhî değerlendirmeler yapılırken Hanefi mezhebi esas alınmıştır. Ancak karşılaşılan farklı ülke uygulamalarında, alacak satımı işlemine diğer mezheplere dayanılarak izin verildiği görülünce konu hakkında diğer mezheplerin görüşlerine de yer verilmiştir. İkinci bölümde varlık yönetim şirketlerinin ortaya çıkış sebeplerine, tarihi gelişimine, yürüttüğü faaliyetlere yer verilmiştir. Çalışmanın sınırları gereği varlık yönetim şirketlerinin bütün faaliyetlerine değil sadece alacak satımı bağlamında değerlendirilebilecek olan sorunlu alacakların satın alınması, satılması ve yeniden yapılandırılması konularına yer verilmiştir. Bu bölümde varlık yönetim şirketlerinin uygulamaları herhangi bir değerlendirme yapılmaksızın ele alınmıştır. Üçüncü bölümde, ilk bölümde ortaya konulan, mezheplerin alacak satımına dair görüşleri çerçevesinde varlık yönetim şirketlerinin faaliyetleri değerlendirilmiştir."
