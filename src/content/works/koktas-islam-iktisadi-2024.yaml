abstract: "Bu çalışma, çağdaş İslam iktisadı ve finansı alanında önemli bir yere sahip olan Muhammed Taki Osmani'nin hayatını, ilmî çalışmalarını ve özellikle İslam finansına yaptığı katkıları ele almaktadır. İslam dünyasında geniş bir çevrede tanınmasına rağmen, Türkiye'de Osmani'nin görüşleri ve çalışmaları üzerine yeterince bilgi ve malumat bulunmamaktadır. Bu bağlamda çalışma, Osmani'nin İslami finansa dair teorik yaklaşımlarını ve pratik çözümlerini, usuli bir çerçeve içinde incelemektedir. Araştırma, onun İslam hukuku ve finansına ilişkin görüşlerinin yanı sıra, fetva anlayışı ve çağdaş meselelerdeki çözüm önerilerini analiz etmektedir. Çalışma, Muhammed Taki Osmani'nin özellikle iktisadi sistemler, faizsiz finans modelleri, İslami yatırım fonları, ve çağdaş finansal krizlere dair çözüm önerilerini incelemiştir. Aynı zamanda, onun fıkhî yaklaşımlarını ve İslam hukukuna dayalı çözümleme yöntemini, fetvaları üzerinden değerlendirmeyi amaçlamaktadır. Modern finansal sistemlerin temel dinamikleri ile İslam finansının ilkeleri arasındaki ilişki de bu bağlamda ele alınması hedeflenmiştir. Araştırmada, İslam iktisadı ve finansı alanındaki temel meseleler, Osmani'nin metodolojisi çerçevesinde yeniden yorumlanarak literatüre mütevazı bir katkı sunulması hedeflenmiştir."
