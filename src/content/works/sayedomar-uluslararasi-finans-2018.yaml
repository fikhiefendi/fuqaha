abstract: "Bu çalışmada, uluslararası borçlama ve fonlama ile ilgili olup, Arap ve islam ülkelerinin ekonomileri üzerindeki etkisi kapsamlı bir şekilde ele almaktadır. Çalışma, uluslararası kredilerin ve borçların tanımı ve hedeflerinden başlayarak, uluslararası finans ve kredilendirmede en önde gelen kurumların tanıtımı ve borç verme işlemleri kapsamında kabul edilen uluslararası koşullar ele almasından geçerek, borçlu ülkelerin, politik, ekonomik ve sosyal yönleri gibi üzerindeki kredi stratejilerinin etkileri hakkında bilgi ve fikir vermesiyle ulaşılmaktadır. Uluslararası borçların, gelişmekte olan ülkelerin ekonomileri üzerindeki etkisi, krediler ve borçlar alanında uluslararası başarılı veya başarısızlık deneyimler, özellikle Türkiye ve Mısır üzerinde odaklanmasıyla da ele alınacaktır. Çalışmada, islam ülkelerinin uluslararası kredi ve borçlanma mekanizmalarına dayanarak sürdürülebilir kalkınma arayışlarında ortaya atılan akademik düzeyde ekonomik bilgi ve fikirler tartışılmıştır. Bu kredilerin hem devlet düzeyinde hem de çeşitli ekonomik örgüt ve kurumları seviyesinde, aynı zamanda kredilerin orta vedalı ve uzun vedalı da şekilleri tartışılmıştır. Çalışmada, çok önemli bir araştırma sorununu olan uluslararası kredilere artan bağımlılığın tüm biçimlerindeki etkileri ile ilgili temel sorunlara çözüm bulmak amacıyla çalışılmıştır. Bu fonlar ve krediler daha çok Arap ve İslam ülkelerinin, finansman boşluk açıklarını doldurmak, ve ekonomik ve sosyal alanda sürdürülebilir kalkınma sağlamak için kendi çizdiği projeler ve kalkınma programları fonlamak amacıyla almaktadır. Çalışma, uluslararası finansın teorik temellerini ve pratik prensiplerini, özellikle de uluslararası fınans ve borç verme kurumları aracılığıyla alınan kredileri analiz etmiştir. Bu kredileri, Arap ve islam ülkerinin ekonomilerine getirdiği ağır yük ve yükümlülükler, fınans ve finansal yönetiminin kavramları karıştırmadan incelenmiştir. Çalışma, uluslararası krediler olgusunu incelemek, uluslararası finansman ve borç verme kurumlarının yapısını incelemek, çalışma mekanizmalarını ve bu kredilerin onaylanma koşullarını ve bu kredilerin ekonomik açıdan özellikle Arap ve islam ülkelerinin üzerindeki etkilerini incelemek için uygun bir yaklaşım yöntemleri V kullanarak örneklem çalışmasını yapılmıştır. Bu bağlamda birbirlerine ekonomikları farklı olan Mısır ve Türkiye durumlarına odaklanmıştır. Çalışmanın önemini bir çok noktada vurgulamakta, en önemlisi, uluslararası finansın ekonomik boyutlarını, politik dışındakı boyutlar, özellikle ekonomik ve sosyal olanın boyutlarla bütünleştirici bir bağlamda analiz eder, böylece çağdaş uluslararası ekonominin en önemli sütunlarından birinin analizine tutarlı bir katkı oluşturan bütüncül bir vizyonu temsil ederler. Çalışma, uluslar ve ülkeler için ağır yük getiren, siyasi şartlar üzerinde sağlanan uluslararası fonları ve borçlar, kalkınmanın ana geçidi olarak görenlerin hazır vasıfların tarifelerinin tünelinden kurtulmaya yönelik bir girişimdir. Bu hazır tarifelerin Uluslararası Para Fonu(IMF) ve Dünya Bankası gibi uluslararası kapitalist kurumlar tarafından, uluslararası ekonominin lokomotifine entegre edilmeleri için ve büyük ülkelerin kendi çıkarları ve siyasi şartları koymak için zayıf uluslar ve ülkelere uygulanmaktadır. Araştırma, uluslararası finanslarının gerçekliğini, Arap ve İslam ülkelerinin ekonomileri üzerindeki etkilerinin analiz etmeyi ve önemli uluslararası finansal kuruluşlarla en önemli olan başarılı ya da başarısız deneyimleri gözden geçirmeyi amaçlamaktadır. Bu bağlamda özellikle ekonomik liberalizmin simgesi olan ve özellikle Amerika Birleşik Devletleri gibi büyük güçlerin aracı olarak kullanılan, gelişmekte olan ülkelerin her düzeyde kararlarına el koymak için kullanılan IMF ve Dünya Bankası incelenecektir. Çalışmada, 10 bölümleri içerisinde uluslararası finans kavramının tanımı, önemi, uluslararası finans ihtiyacının nedenleri, gelişme aşamaları, uluslararası finans kaynakları, uluslararası finans kurumlarının politikalarının analizi ve uluslararası kredilerin Arap bölgesi ekonomileri üzerindeki etkisi gibi önemli konuları kapsamıştır. Araştırmada gelişmekte olan ülkelerin dış borç krizinin yanı sıra, uluslararası finans ve kredi deneyimlerinde başarı ve başarısızlıklar gözden geçirmek, özellikle Arap ve İslam ülkelerinin başarı ve başarısızlık deneyimlerinde krediler ve borçlar sorununu analiz edilmesiyle tahsis edilmektedir. Araştırma daha sonra İslamın makasıtlarına göre İslam iktisadı ile uluslararası krediler arasındaki ilişkileri v arasındaki çatışma ve problemlerin çözmeye yönelik, analizler yapılmaktadır. Çalışma, daha sonra, her düzeyde kredilerin uluslararası deneyimlerinden yararlanarak bir İslam vizyonuyla güvenli uluslararası kalkınma kredilerine yönelik vizyonunu sunmaktadır. Çalışma, sonuç olarak Batı Hükümetlerinin ve uluslararası finans kurumlarının borç sorununa yönelik tedavi edici reçetelerinin, gelişmekte olan ülkelerde sıklıkla tersine dönmüş olması gerçeğine dayanan bir dizi sonuçla sonuçlanmıştır. Ve dış borçluluğun VI Arap ve İslam ülkeleri üzerindeki feci etkileri, birçoğu borç veren büyük ülkelerine tabi olma halına dönüşmüştür. Çalışma ayrıca, bu bağlamda uluslararası deneyimlerine istinaden, gelişmekte olan ülkelerin ekonomik kalkınmalarına ulaşabilmak için kredilere ve borçlara güvenebileceğine farz eden uluslararası finans kurumlarının teorisinin başarısızlığını kanıtladığını da vurgulamaktadır. Bunun nedeni ise gelişmekte olan ülkelerin kredi avantajlarını artırmaya, olumsuz etkilerini ise azaltmaya yönelik kredi stratejisin etkin bir şekilde yöneten bir idari stratejisi bulunmamaktadır. Bunu da gerçekleştirilebilmek için etkili kurumların varlığı, ayrıntılı veriler tabanları, eğitimli insan kaynakları, gelişmiş idari kurumlar, gelişmiş vergi sistemleri, seçilmiş hükümetler ve bağımsız yasal kurumlar bulunması gerekmektedir. Çalışma, bu yukarıdaki zikr edilen sistemi sağlanmadan hibelerin, kredilerin ve uluslararası finansmanın fonları, bu kredilerin faturasını ödeyecek insanlar şimdiki ve gelecek nesillerin için bir felaket olmaya devam edeceğini kesinleştirmiştir. Çalışma, gelişmekte olan ülkelerin ekonomilerini bağlayan uluslararası kredilerden kurtulmaya yönelik bir dizi öneride bulunmuştur. En önemlisi ekonomik karar alma sürecindeki yapısal sorunları çözmek için Arap ve İslam ülkelerinde sürdürülebilir kalkınma çalışmalarını modernize edilmesi ve geliştirilmesidir. Aynı zamanda Arap ve İslam ülkelerinde sürdürülebilir kalkınma stratejilerinde“kalkınma verimliliği”elde etmek için çaba göstermektedir. Bu da, sürdürülebilir kalkınma çalışmaları için birleşik bir Arap-İslam sisteminin kurulmsıyla ve islami vakıflar ve kaynaklardan yararlanarak sürdürülebilir kalkınma finansman ihtyaçlarını sağlamak ve boşluk finansmanları doldurmak ile gerçekleştirilmektedir. Çalışma ayrıca, dış borçlanma baskısından kurtulmakta başarılı olan Türkiyenin deneyiminden yararlanılması önerilmektedir. Bu başarı, uluslararası ekonomik sistemin araç ve mekanizmalarının entegrasyonu ile ortaya çıkan yararları içe yönlendirmeye yoluyla gerçekleştirmiştir. Arap-İslami ekonomik entegrasyonu, Arap ve İslami halkların ulusal güvenlik sisteminin ayrılmaz bir parçası olduğu için, bu çalışma, zengin arap ve müslüman ülkelerinin desteğiyle kapsamlı bir strateji paketi ile bir“İslami Marshall”projesinin başlatılmasını önermektedir. Bu projenin aracılığıyla ve İslami Kalkıma Bankasının tecrübesinden yararlanarak fakir Arap ve Müslüman ülkelerinde sürdürülebilir kalkınma finansman ihtiyaçlarını karşılamakta yardımcı olacaktır."
