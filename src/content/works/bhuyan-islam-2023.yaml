abstract: "Boşanma, evliliğin yasal sorumluluklarının iptali veya yeniden düzenlenmesi, ülke veya dinin hukuk sistemi çerçevesinde karı koca arasındaki evlilik bağlarının kesilmesidir. Kısaca boşanma, evlilik ilişkisini sona erdirme sürecidir. Dünyanın çoğu dininde boşanmayla ilgili yasalar vardır. İslam'da boşanmaya izin verilir ve çeşitli biçimler alabilmektedir; bazıları koca (Talak), bazıları karısı (Hul') ve bazıları da mahkeme (Tefrik) tarafından başlatılmaktadır. Yahudilikte, Tevrat'a göre, sadece kadının zina etmesi nedeniyle boşama caizdir. Ancak Halahah (modern Yahudi hukuku), zinanın yanı sıra zülm etmek, terk etmek gibi belirli koşullar altında boşanmaya izin vermektedir. Yahudilikte, kocanın karısına mahkeme tarafından hazırlanan bir boşanma belgesi (Get) vermesiyle boşanma gerçekleşmektedir. Hıristiyanlıkta boşanmaya farklı bir şekilde bakılmaktadır. Katolik kilisesi boşanma yerine evliliğin feshi (iptal) ve fiziksel ayrılığa izin verirken, Ortodoks ve Protestan kiliseleri zina, irtidat, yasadışı evlilik gibi belirli koşullar altında boşanmaya izin vermektedir. Hinduizm bu dinlerden farklıdır. Dini metinlere göre evlilik, Hinduizm'de kutsal bir ayin olduğundan, bu bağ bir kez kabul edildikten sonra her iki tarafça da hayatları boyunca sürdürülmelidir. Bu nedenle, Hindu kutsal metinlerinde diğer dinler gibi boşanma için özel bir hüküm bulunmamaktadır. Bununla birlikte, 1955'ten önce kastlar arasında bazı boşanma biçimleri bulunabilmektedir. Nitekim, 1955 yılında Hindu Evlilik Yasası'nın (Hindu Marriage Act, 1955) onaylanmasından sonra, Hinduizm'de belirli sebep ve koşullar altında boşanmaya izin verilmektedir. Bu araştırma, İslam'daki boşanma hukuku ile Yahudilik, Hristiyanlık ve Hinduizm'deki boşanma hukuklarını karşılaştırmalı bir çalışma ile ortaya koymayı amaçlamaktadır. Bu bağlamda, çalışmamız üç bölümden oluşmaktadır. Birinci bölümde İslam'da boşamaya ilişkin hükümler ele alınmıştır. İkinci bölüm, Yahudilik, Hristiyanlık ve Hinduizmdeki boşanma hukuklarını incelemektedir. Üçüncü ve son bölüm, bu dört dinin boşanmayla ilgili hukuklarının karşılaştırmalı bir tartışmasını sunmaktadır."
