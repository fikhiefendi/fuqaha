abstract: "Dini ilimler, kişinin uğruna çabalayabileceği en üstün değerlerdendir. Bu ilimler, kişiyi en yüce mertebelere ulaştırır. İlim erbabı için uğraşılar arasında en büyük kıymete sahip olan ise fıkıh ilmidir. Cenab-ı Hakk'ın furû'-i fıkha dair meselelerde ulemânın ihtilafını onlara geniş bir rahmet kılması O'nun bu ümmete olan merhametindendir. İslâm tarihinde İslâm fıkhı alanında birçok değerli âlim ortaya çıkmıştır. Bunlardan birisi de ömrünü bu uğurda adayan Şâfi'î fakihlerinden Ebû İshâk İbrâhîm b. Ahmed el-Mervezî'dir. Fıkıh ilmine katkılarıyla ön plana çıkan Mervezî, usûl ve furû'a ait kıymetli birçok eser telif etmiştir. Bu çalışmada İmâm Mervezî'nin Mâverdî'nin el-Hâvî el-kebîr adlı eserinde yer alan aile hukukuna dair görüşleri ele alınmıştır. Bu bağlamda öncelikle İmâm Mervezî'nin hayatı ve ilmi kişiliği tanıtılmış ve onun Şafii mezhebindeki konumu ortaya konmuştur. Ardından el-Hâvî'l-Kebîr adlı eserde yer alan aile hukukuna dair görüşleri tespit edilmiştir. Her başlık altında ilgili görüşlere yer verildikten sonra tercih edilen görüş, delilleriyle ortaya konulmuştur. Çalışma neticesinde Şâfi'î mezhebi'nin önde gelen isimlerinden olan Mervezî'nin fıkhî görüşlerinin bazen mezhebin görüşüne uygun, bazen özgün, bazen de diğer mezheplere uygun olduğu görülmüştür. Dolayısıyla Mervezî'nin kör taklite değil, daha çok istidlal ve nazara dayanarak içtihatta bulunduğu anlaşılmıştır."
