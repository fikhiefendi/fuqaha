abstract: "Sermaye piyasalarında gün geçtikçe daha fazla İslami ürün ihraç olunmakta ve bu ürünlerin işlem hacmi zamanla artmaktadır. Borsalarda artan İslami ürün çeşitliliğinin yanında, gerçek anlamda el değiştirme işlemi olan takas işlemi ise borsalardan farklı kurumlarda yapılmaktadır. Takas kurumları Sermaye Piyasalarındaki Borsa platformlarında gerçekleşen işlemlerin takasını gerçekleştirmekle sorumlu kurumlardır. Türkiye'deki Sermaye Piyasalarında Borsa İstanbul işlem platformu, Takasbank ise takas platformudur. Takasbank, takas hizmetinin yanında Borsa İstanbul'daki bazı piyasalarda Merkezi Karşı Taraf (MKT) hizmeti de vermektedir. Bu tezde uluslararası finans düzenine göre sermaye piyasalarında gerçekleşen takas işlemlerinin ve sunulan Merkezi Karşı Taraf(MKT) hizmetinin detayları anlatılacaktır. Türkiye uygulamasını görmek adına Takasbank ve faaliyetlerinden bahsedilecektir. Takas ve MKT hizmetlerinin İslami yönden uygunluğu incelenecek ve Borsa İstanbul'un en önemli finansal piyasalarındaki takas ve MKT hizmetleri anlatılacaktır."
