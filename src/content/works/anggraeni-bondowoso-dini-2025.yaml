abstract: "2019 tarihli 16 Sayılı Kanun, kız çocuklar için asgari evlenme yaşını 16'dan, hem kız hem de erkek çocuklar için 19'a değiştirmektedir. Ancak, bu hüküm mutlak değildir çünkü kanun, küçüklerin evlendirilmesi Dini Mahkeme'ye reş için istisna talebinde bulunarak evlenmelerine izin vermektedir. Bondowoso Dini Mahkemesi'nin SIPP (Sistem Informasi Penelusuran Perkara) verilerine göre, 2020 yılında küçüklerin evlendirilmesi davalarının sayısı 1.077'ye ulaşmış, 2022'de 718 davaya düşmüştür. 2024'ün başlarında 210 davaya düşmüştür. Önceki yüksek rakamlar ve bu keskin düşüş göz önüne alındığında, bu rakamların azalmasına neden olan çeşitli faktörleri bilinmesi gerekmektedir. Ayrıca, hakimlerin küçüklerin evlendirilmesi taleplerini kabul ederken dikkate aldıkları hususları ve küçüklerin evlendirilmesi ardındaki temel faktörleri bilmek önemlidir. Bu faktörler, Bondowoso Dini Mahkemesi'ndeki küçüklerin evlendirilmesi davalarını anlayan bilgi sahipleriyle yapılan gözlemler ve doğrudan görüşmeler yoluyla elde edilen verilerle nitel bir yaklaşımla incelenebilmektedir. Bu araştırmanın sonuçları, 2024 yılında küçüklerin evlendirilmesine ilişkin uygulamalarının giderek daha katı hale geldiğini tespit etmiştir. Bondowoso İlçe Hükümeti ile Bondowoso Dini Mahkemesi arasında imzalanan Mutabakat Zaptı (MoU) ve İş Birliği Protokolleri (PKS), küçüklerin evlendirilmesinin davalarının keskin bir şekilde azalmasına önemli ölçüde katkıda bulunmaktadır Küçüklerin evlendirilmesi talepleri onaylarken acil nedenler veya çocuğun yüksek menfaati, hâkimlerin bu tür talepleri kabul etmesinde dikkate aldıkları hususlardır. Kültür gelenekler, özellikle nişan gelenekleri, Bondowoso'da küçüklerin evlenmesini yönlendiren başlıca faktör olmaya devam etmektedir."
