abstract: "Bu tez genel olarak giriş, üç bölüm ve sonuç bölümlerinden oluşmaktadır. Giriş bölümü; araştırmaya giriş, konunun önemi, araştırmanın amacı, konuyla ilgili önceki çalışmalar, araştırmanın yöntemi başlıklarını içermektedir. Birinci bölüm ise“meâlâtü'lefâl”fiillerin sonuçları“ kaidesinin tarifini, onun hüccet oluşunun izahını, alimlerin bu kaideyle delil getirme konusundaki görüş ayrılıklarını, sonuçlarına göre eylemlerin çeşitlerini içermektedir. Ayrıca fiilerin sonuçları kaidesinin kapsamına giren ”seddi zerâi“, ”hiyel“ve”mürââtü'l-hilâf\" (meşrû bir gerekçeye dayanılarak karşı görüşün dikkate alınması) gibi prensipler dile getirilmektedir. İkinci bölüm; nikah akdinin tarifi, meşruiyetinin delilleri, hikmetleri, nişana dair hükümlerin izahı ve nişanlılık meselesine dair güncel problemlerdeniletişim araçlarıyla nişanlanma, nişan yüzüğü, nişanlı ile konuşma, onunla beraber dışarı çıkma, nişanlı ile halvet, nişanlılıkta tıbbi muayene gibi meselelerin incelemesini içermektedir. Bununla beraber bu bölümde evliliğin ve evlilik hukukunun gereklilikleri işlenmektedir. Üçüncü bölümde bey' (alış-veriş) akdinin tarifi, meşruiyetinin delilleri, hükümleri, şartları, insanların ona duydukları zaruri ihtiyacın izahı, meşruiyetinin hikmeti, bazı faizli alış-veriş türlerinin izahı, olgunlaşmadan önce meyvenin satılması, selem akdi, şartları meşruiyetinin hikmeti, selem akdinin bey'u'l-istisnâ'dan ve bey'u'l-madûm'dan farkı, günümüz finans kuruluşlarında selem akdinin uygulama alanları ile kurallarının izahı gibi konular işlenmektedir. Sonuç başlığının altında ise araştırma sonucunda ulaşılan en önemli sonuçlar zikredilmektedir."
