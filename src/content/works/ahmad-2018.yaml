abstract: "Son zamanlarda ekonomi, Türkiye, Kudüs ve vakıflar meselesi Müslümanlar, Gayri Müslimler nezdinde ve genel olarak tüm dünyada giderek artan bir öneme sahiptir. İşte bu tezde bütün bu konuları içeren;“Kudüs'teki Osmanlı Vakıfları ve Kudüs Halkına İktisadi Etkileri”başlıklı çalışmada toplanmıştır. İslam'da vakıfların önemi; Osmanlı İmparatorluğu ve günümüzdeki Türkiye Cumhuriyeti Devleti'nin vakıflara verdiği önem; Osmanlı İmparatorluğu'nun tarih ve medeniyete verdiği değeri gözler önüne sermiştir. Ayrıca bütün bu örnekler Osmanlı İmparatorluğu'nun hilafeti zamanındaki Kudüs-ü Şerif'ten seçilmiştir. Çünkü Kudüs halkı her ne kadar Osmanlı İmparatorluğu'na bağlı oldukları için Türk olarak kabul edilse de aslında onlar Arap'tır ve Türk olmayan toplumlara da hizmet ettiğinin işaretidir. Bu çalışmada Kudüslülerin ekonomik hayatını desteklemeye yönelik hizmet veren farklı vakıflara örnekler verilmiştir. Mesela: Ayni ve nakdi yardım yapan vakıflar; eğitimi destekleyen vakıflar; arazi, bina, su yolları gibi hizmetlerin yapılması konusunda destek veren Müslümanların yaptıkları vakıfların yanı sıra Kudüs'teki bazı Gayri Müslim vakıflara da yer verilmiştir. Ayrıca bu çalışmada çok önemli başka meselelere de değinilmiştir. Mesela, bugün işgalci İsrail'in bu vakıflara nasıl el koyup Yahudileştirdiğini; bunlardan bazılarını hizmet binası veya ticari amaçlarla kullandığını; bazılarını da İslam'da haram olarak kabul edilen yerlere dönüştürdüğünü ve bütün bunların faşist İsrail kanunları ve mahkemelerinin aldığı karara dayanarak yaptığını ortaya koymuştur. Bu tez çalışması belgelere dayalı araştırma yöntemi ile hazırlanmış ve verilen bütün bilgiler kaynaklara dayandırılarak yazılmıştır. Ayrıca araştırmacı,“Araştırma Metodolojisi”yöntemi ile bahsedilen konular hakkında o zamanın Kudüs ortamını derinlemesine incelemiş, bu bilgileri teyit etmek için yerinde inceleme yapmak üzere bugün Kudüs'te bulunan vakıf ve kurumlara ziyaretler gerçekleştirmiştir. Çalışmanın son kısmında ise bu çalışmada ortaya çıkarılan faydalı sonuçlara yer verilmiştir. İslam Ümmetinin tez çalışmasına konu olan alanlarda yeniden eski ihtişamlı ve izzetli günlerine geri dönmesi temennileri ile sonlandırılmıştır."
