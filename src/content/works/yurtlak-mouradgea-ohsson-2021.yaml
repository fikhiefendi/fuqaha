abstract: "XVIII. yüzyıl, birkaç edebî akıma şahit olmuştur. Bunlardan biri İslam dünyasına hayranlık duyan Oryantalizm akımıdır. Dönemin İslam dünyasının temsilcisi konumunda olan Osmanlı İmparatorluğu, Oryantalistler için büyük bir çalışma alanı olmuştur. Bu minvalde pek çok çalışma ortaya çıkmış olup bunlardan birisi de Osmanlı-Ermeni kökenli meşhur İsveçli siyasetçi Mouradgea d'Ohsson'un“Osmanlı İmparatorluğu'nun Genel Tablosu”adlı eseridir. D'Ohsson bu eserde Osmanlı devletinin genel tarihini, siyaset ve hukuku anlayışını, yerleşik örf ve adetleri gibi çeşitli konuları ele almaktadır. Çalışmamız d'Ohsson'un adı geçen eseri üzerine olup bu bağlamda kitabın kaynaklarını, önemini ve etkisini göstermeye gayret edeceğiz. Ayrıca eserin bazı bölümlerini ve özellikle nikah bölümünü inceleyecek, yazarın ele aldığı konular hakkındaki görüş ve düşüncelerini de ele alıp değerlendireceğiz."
