abstract: "TEZ ÖZETİ Î7 Numaralı Şer'iyye Sicilinde Kırşehir ekonomik, askerî, sosyal ve kültürel hayat 17 Numaralı Kırşehir Şer'iyye sicili ana kaynak olarak kullanılmıştır. 7. Cemaziye'î Âhir sene 1324 Hicri ve 15 Temmuz sene 1322 Rûmî (30 Temmuz 1906) tarihi ile başlayıp, iki yılı ihtiva eden 202 sayfa sicil'in transkribi yapılarak değerlendirilmiştir. 133 dava sonuçlanmış (Biz da'valara belge numarası vererek kullanımını kolaylaştırdık) ve şu ana konularda tasnifi yapılmıştır; 1-Askerî, miras hakkında33 adet belge 2-Evlenme-boşanma, nafaka30 adet belge 3-Miras ve vasî tayin etme27 adet belge 4-Hırsızlık ve zayi olan mallar20 adet belge 5-Vakıf ve sosyal müesseseler7 adet 'belge 6-Evlat edinme4 adet belge 7-Cinayet, adam öldürme3 adet belge 8-Askerî3 adet belge 9-Gayr-i menkûl saüşı,4 adet belge 10-Ticaret2 adet belge Gerek bu değerlendirmelerden, gerekse diğer kaynaklardan istifade edilerek Kırşehir Tarihi hakkında faydalanılacak kaynak eser vücuda getirilmiş ve Kırşehir'in; ekonomik, askerî, sosyal, kültürel, dinî yaşantıları, örf ve adetleri, gelenek ve görenekleri hakkında mazide kalan bilgileri gün ışığına çıkartılmıştır. Kırşehir'de yaşayan Ermeni Milleti hakkında bir çok bilgide Ermeni mezalimini savunan kimselere karşı güzel bir cevaptır.1906-1908 Yıllarını ihtiva eden şer'iyye sicilinde Kırşehir Vilayeti'ne ait olan olaylar şahitler üzerinde kayıda geçirilmiş, Kırşehir ve Türk tarihi açısından önemli olayların günümüze aktarılmasını sağlamıştır. İki yıllık bir sicilin vermiş olduğu bilgiler Kırşehir tarihinin bir bölümünü ancak aydınlatmaya yeter. Kırşehir'in diğer sicillerinin de ilmin hizmetine sunulması ile zincirin halkaları tamamlanmış olacaktır. Bu tez yerli ve yabancı bilim adamlarının ve özellikle Kırşehir ve Anadolu üzerinde araştırma yapan bilim adamlarının baş vuracakları kaynak eser niteliğindedir. 17 Numaralı Kırşehir Şer'iyye Sicili (1324-1326; 1906-1908), Kırşehir Vilayeti üzerinde araştırma yapan bilim adamlarına kaynak, Kırşehir halkının yaşantılarını ortaya koymak, coğrafi yer isimleri ve onomastik bilgi vermek, dönemin ekonomik, sosyal, askerî, kültürel konularında bilgi vermek, Arşivlerde yokolmaya bırakılmış kıymetli millî hazinemizi gün ışığına çıkarmak maksadıyla tez olarak seçilmiştir. Giriş kısmında. Kadılık Müessesesi ve Şer'iyye Mahkemeleri hakkında genel bir bilgi ve Kırşehir'in kısa tarihçesi hakkında kısa bilgi verilmektedir. Değerlendirme kısmı altı bölümden oluşmaktadır; Birinci bölümde. 17 numaralı 1322 tarihli Kırşehri Şer'iyye Sicili'nin tanıtılması ve değerlendirilmesi yapılmıştır. İkinci bölümde. Kırşehir'in ekonomik hayatı hakkında bilgi verilmiştir. Üçüncü bölümde, dönem askerî açıdan ele alınmıştır. Dördfıncti bölümde. Kırşehir'de yaşayan halkın sosyal yapısı ele alınmıştır. Besinci bölümde. Kırşehir'in kültür hayatı ve Kırşehir'de yaşamış tarihi şahsiyetler ele alınmıştır. Altıncı bölümde, şer'iyye sicilinin îranskribi yer almakadır. Transkribi yapılan sicilden daha kolay istifade edilebilmesi için da'valar belge numarası ile numaraianmıştır. Her bir belge bir makale niteliği taşımaktadır. Yine sicilden yararlanmayı kolaylaştırmak gayesiyle, bölüm sonuna indeks konulmuştur. Altıncı bölümden sonra sonuç kısmına yer verilmiştir. ı Şer'iyye Sicilleri, islâm hukuku, Kırşehir tarihi ile ilgili yararlandığım ve bu konuda yararlanılacak eserler kaynakça kısmında hizmete sunulmuştur. Ekler kısmında ise, transkribini yaptığımız orjinal belgelerden on adedi (değişik konular seçilerek) örnek olarak verilmiştir."
