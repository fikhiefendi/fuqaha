abstract: "Osmanlı hukuku ``şer?î nâslara ve ülu?l-emr?? denilen devlet başkanının şeriata aykırı olmayacak şekilde çıkardığı kanunlara dayanır. Şer?iyye sicillerinde de hem şer?î hem de örfi hukukun uygulamalarını görmek mümkündür. Siciller, şer?î mahkemelerde kadılar tarafından tarih sırası ile tutulurdu. Bu kayıtlar içerisinde ilâm, hüccet, mürâsele gibi belgeler yanında devlet merkezinden gönderilen fermanlar, hükümler, emirler ve tebliğatlar yer alırdı. Şer?iyye sicillerindeki kayıtlar hakların güvence altına alınmasının teminatıdır ve bu kayıtlar yerel tarihçilik açısından çok önemlidir. Şer?iyye sicillerinden yola çıkarak şehir tarihî ile ilgili pek çok mesele çözüme kavuşturulabilmiştir. Şer?iyye sicilleri, söz konusu dönemin askerî, siyasî, ekonomik, sosyal, kültürel ve hukukî durumunu yansıtır. Şer?iyye sicilleri, dönemi anlamamız için tarihî kaynakların en önemlilerinden biridir. Bu çalışmada, ?418 Numaralı Manisa Şer?iyye Sicil Defteri? incelenmiştir. Defter Manisa?ya bağlı Kula kazasına aittir. Kula kazasına ait ayrı sicil kataloğu bulunmadığından bu kazanın sicilleri Manisa şer?iyye sicilleri içerisinde yer almıştır. Osmanlının son dönemlerinde şer?iyye defterleri dava konusuna göre tutulmuştur. İncelediğimiz bu defter de Kula kazasına ait vekâlet defteri olarak tutulmuştur. Çalışmamız, giriş ve dört bölümden oluşmaktadır. Giriş kısmında Kula kazasının coğrafi ve tarihî durumu ele alınmaktadır. Birinci bölümde Osmanlı hukuku ve mahkemeleri hakkında genel bilgi verilmiştir. İkinci bölümde sicil defterinin transkribi, üçüncüsünde belge özetleri, dördüncü bölümde sicilin genel değerlendirmesi yapılmıştır. Çalışma bir Sonuç ve Kaynakça ile son bulmaktadır."
