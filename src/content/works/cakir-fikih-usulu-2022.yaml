abstract: "İslâmî bilgi kaynağının en önemli malzemelerinden biri haberdir. Kur'an ve Hz. Peygamber'in (s) sözleri sonraki kuşaklara haber vasıtasıyla ulaştığından, İslâm âlimleri erken dönemlerden itibaren bu konuya temas etmişlerdir. Esas itibarıyla ilim elde etme vasıtası olarak haberin bilgi değeriyle ilgili araştırmalar daha çok kelâmcıların sahasına girmektedir. Ancak onlar haberin bizatihi kendisiyle değil, bilgi değeriyle meşgul olmuşlardır. Hadis ve fıkıh usûlü disiplinleri de çeşitli boyutlarıyla haberi incelemektedirler. Özellikle hicrî ilk iki asırda haber ve hadis kelimelerinin birbirinin yerine kullanıldığı, bu bakımdan hadisçilerin haber kavramına fazlasıyla yer verdiği görülmektedir. Fakat hadisçiler, haberin bilgi değerinden ziyade aktarım faaliyetlerine yönelmektedirler. Fıkıh usûlcüleri ise haberi,“ahbâr”ya da“sünnet”adını verdikleri bölümler altında inceleyerek haber kuramı inşa etmişlerdir. Usûlcüler, haber kuramında hem kelâmcılar gibi haberin bilgi değerine hem de hadisçiler gibi hadis ve sünnet meselelerine temas etmektedirler. Bu bakımdan çalışmamızda fıkıh usûlü eserlerinin ilgili bölümleri mukayeseli bir biçimde incelenmiştir. Bu çalışma, hicrî beşinci asır usûlcülerinin haber kuramlarının mukayeseli bir incelemesidir. Çalışmada haberin epistemik değeri ve bilgi sistemi içerisindeki yeri tetkik edilecektir. Aynı zamanda usûl eserlerinin işlevleri baz alınacak ve haber teorilerinin bunlara uygunluğu gün yüzüne çıkartılacak, usûlcülerin hadis ve sünnete dair görüşleri bu çerçevede tahlil edilecektir. Çalışmamız bir giriş, üç ana bölüm ve sonuçtan oluşmaktadır. Birinci bölüm bilgi nazariyesine ayrılmış olup, burada bilginin mahiyeti, imkânı ve kaynaklarına değinilecektir. Birinci bölümün sonunda bilginin kaynaklarından olan haberle ilgili kısa bir bilgi verildikten sonra, V/XI. asır usûl eserlerinin haber teorilerine tahsis edilen ikinci bölüme geçilecektir. Üçüncü bölümde ilgili haber teorilerinin mukayeseli bir değerlendirmesi yapılacaktır. Sonuç kısmında ise haber nazariyelerinin muhtevaları ile usûl eserlerinin işleviyle ilgili iddiaların ne kadar gerçeği yansıttığına temas edilecektir. Çalışma, araştırma kapsamında incelenen eserlerin künye bilgileri ve ekleriyle tamamlanacaktır."
