abstract: "Finans sektöründe paranın işletilme yöntemlerinin İslâmî açıdan helâllik tartışması çokça yapılıyorken, sermaye olarak nitelenen bu paranın veyahut malların oluşumu, birikimi ve yapısına yönelik tartışma ve araştırma çok azdır. Biriken sermayenin nasıl kullanılması gerektiği hususu ilâhiyatçıların ve İslâmî finans ile ilgilenen akademisyenlerin temel tartışma konularından biri olmasına rağmen, sermayenin birikme yöntemi ve yapısı maalesef gerekli araştırmalardan yoksun kalmıştır. Oysa en az sermayenin işletilmesi ve kullanılması kadar, sermayenin oluşumu da üzerinde önemle durulması gereken bir husustur. Bu noktada İslâm iktisadı çalışmalarında uygulama, teorinin önüne geçmiştir. Bu tezde, İslâm'ın sermaye kavramına bakışı, İslâm'daki sermaye oluşum yöntemleri ve bu sermayenin yapısı araştırılmıştır. İslâm ekonomisinin temel kaynakları incelenmiş ve Kur'an-ı Kerim, Sünnet-i Seniyye, müçtehit imamların görüşleri, İslâm ulemasının görüşleri gibi kaynaklar irdelenerek İslâm'ın sermayeye bakışı, İslâm'da ve İslâm ekonomisinde sermayenin ve sermaye birikiminin yeri ve önemi gerek kurumsal gerekse de finansal çerçevede anlaşılmaya çalışılmıştır. Ayrıca modern iktisat ekolleri ile İslâm iktisat zihniyetinin sermaye kavramına bakışı mukayese edilmiştir. Osmanlı'da sermaye oluşumuna etkisi olan para vakıflarının birincil kaynaklar da göz önüne alınarak incelenmesi çalışmanın literatüre özgün bir katkısı olarak kabul edilebilir. Bu vakıfların günümüzde sermaye oluşumuna katkı sağlamaları, bu kurumların tekrar ekonomik sisteme dâhil edilmesi ve katılım bankalarına entegrasyonu konusunda para vakfı fonu önerisi yapılmıştır. Bu fon önerisine ek olarak Türkiye için oluşturulacak Hac ve Zekât fonunun etkileri de analiz edilmiştir. Bu üç temel fon toplama önerisinin dünyadaki örnekleri de incelenmiş ve sermaye oluşumu ile birikimi için Türkiye'de yapılması gereken diğer temel politika ve uygulamalardan bahsedilmiştir. Ayrıca tezin temel önerilerini desteklemek üzere insanların para vakfı fonu, zekât fonu ve hac fonuna yaklaşımlarını analiz etmek üzere 738 kişi üzerinde yapılan anketin bulguları tartışılarak önerilerde bulunulmuştur."
