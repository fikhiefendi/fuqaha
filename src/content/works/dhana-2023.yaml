abstract: "Bu çalışma, bankacılık pazarlamasının Libya Devleti'ndeki İslami bankaların ürünlerini sunma ve geliştirmedeki rolünü açıklığa kavuşturmayı amaçlamakta olup, incelenen İslami bankaların promosyon stratejilerinde ve pazarlama karmasına göre temsil edilen bankacılık pazarlamasını Bilimsel ve şeriat metodolojisine ve pazarlama bilgi sistemlerine göre benimsemeleri ve ürünlerinin yaşam aşamalarının takibi ve bunun Libya Devletinde İslami banka ürünlerinin tanıtılmasına ve geliştirilmesine ve müşterilerin bunlara ilişkin farkındalığına ve güvenine etkisi amaçlanmıştır. Anket veri toplamak için bir araç olarak kullanılmış olup, sonuçlara ulaşmak için istatistiksel araçlar ve yöntemler kullanılmıştır. Çalışmadan birkaç sonuca varılmıştır, bunlardan öne çıkanlar: Pazarlama bilgi ve çalışmalarında bariz bir zafiyet olduğu gibi bunlar için gerekli mali ödeneklerin ayrılmaması da söz konusudur. Libya Devleti'nde İslami banka ürünlerinin çeşitliliği konusunda da büyük bir zafiyet var ve bu bankaların ürünleri hakkında müşterilerden çok sayıda sorular bulunmaktadır"
