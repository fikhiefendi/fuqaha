abstract: "ÖZET Yüksek Lisans Tezi 565 Numaralı Karahisar-ı Sahib Şer'iyye Sicili Kürşat ÇELİK Fırat Üniversitesi Sosyal Bilimler Enstitüsü Tarih Bölümü 2004, Sayfa:VII+284 Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de Şer'iyye Sicilleridir. Ait oldukları dönem ve yer hakkında oldukça önemli bilgiler veren Şer'iyye Sicillerinden faydalanma konusu bugün için belli başına bir problem olmaktadır. Bu durum ise sicillerden faydalanma konusunu belirli bir metoda bağlı kılmayı zaruri hale getirmektedir. Bizde bu önemli kaynaklardan biri olan 565 Numaralı Karahisar-ı Sahib Şer'iyye Sicilini çalışmamıza konu edindik. Bu metinlerden yola çıkarak yaptığımız değerlendirmede Karahisar-ı Sahibin bu dönemde idari, siyasi, askeri, iktisadi ve sosyal yapıları üzerinde durduk."
