abstract: "Erken dönem İslam düşüncesinde tasavvuf ve fıkhın temas ettiği ortak alanların tespiti, sünnî tasavvuf anlayışının oluşumunu anlamak açısından önem arz etmektedir. Bu ortak alanda yüksek bir temsile sahip olan İmam Şâfi'î'nin tasavvuf ilminin gelişimindeki rolü düşünüldüğünden daha fazladır. Bu nedenle bu çalışmada Şâfi'î biyografisi hakkında, erken dönem tasavvuf tabakâtı arasında en geniş muhtevaya sahip olan Hilyetü'l-Evliyâ merkeze alınarak tasavvuf düşüncesindeki yeri analiz edilmiş, Şâfi'î'nin tasavvufî literatürde ne şekilde tasavvur edildiği ve bu tasavvurun hangi kriterler üzerine inşa edildiği ortaya konulmuştur. Dini bilimlerin henüz ayrışmadığı erken dönemde fıkhî, kelâmî ve tasavvufî meselelerin arasındaki geçişkenlikler, Şâfi'î portresi üzerinden ele alınmıştır. Çalışmanın odağında Hilyetü'lEvliyâ olmak üzere erken dönem tabakât ve menâkıb literatüründe yer alan biyografik ve menkıbevî bilgiler, metin merkezli nitel araştırma yöntemiyle incelenmiştir. Elde edilen bulgular ikincil kaynakların yorumları eşliğinde analiz edilmiştir. Şâfi'î'nin sünnete ittibâsı, bid'atlere karşı tavrı, İslami ilimlerin yanı sıra tasavvuf ilminin gelişimine katkısı, onun Hilyetü'l-Evliyâ'da ahlâkî bir figür olarak öne çıkarılmasını başlıca nedenleri gibi görünmektedir. Bu doğrultuda Şâfi'î'nin sünnî tasavvuf anlayışının oluşumuna katkısını tespit etmek ve bunun tarihsel akış içinde izini sürmek çalışmanın amaçlarından biri olmuştur. İmam Şâfi'î'nin bid'at, velayet, peygambere ittibâ konularına yaklaşımı ve nassa dayalı ilmî usulünün, tasavvuf ilminin usulüyle ortak bir zeminde kesiştiğini göstermektedir. Dolayısıyla Şâfi'î'nin tasavvuf ilmine etkisi dinî bir otorite olmasının ötesinde epistemik ve metodolojik düzeyde bir katkı olarak okunmalıdır."
