abstract: "Bu araştırmanın amacı, İslamî Finans Sektörünün Ekonomik Kalkınmadaki Rolü göstermektedır. Birçok müslüman ülke azgelişmiş durumdadır. İslam'ın dinî ve sosyolojik ideolojisini bu ülkelerde kalkınma noktasında, ahlaki ve etik değişim gerçekleştirmek ve kurumlar kurmak için hayli faydalı bir biçimde kullanmaktadır. İslam, Hristiyan ve Yahudi teolojilere benzer bir biçimde faize mani olma konusunda bize bir şeyler söylüyor ve bu konudaki yegâne dinamik dindir. Ama aynı zamanda İslam karşılıklı ve kapsamlı ticaret ve finansman tarzları açısından önemli imkânlar sunuyor. Bu imkânlara diğer herhangi bir dinde veya sosyal düzende bu denli kolay ve eksiksiz bir izahına rastlamak mümkün değildir. Toplam Faktör Verimliliği (TFV) denilen, kolektif verimlilik için geliştirilmiş modern kavram İslam içinde kullanılmakta, İslam materyalist ekonominin bencilliği ve bireyciliğinden uzak durmaktadır. Batılı kimi akademisyenler İslamî bankacılığın kullanımını ekonomik kalkınma için daha faydalı görmekte, kimileri de İslam'ı müslüman ülkelerin kalkınması önünde bir tehdit ve engel olarak değerlendirmektedir. Umarız bu çalışma ilgili çalışma sahasına yeni, kıymetli bir teorik katkı sunarak faydalı olacaktır. Anahtar Kelimler: İslami, Finans, Ekonomik, Kalkınma, Rol."
