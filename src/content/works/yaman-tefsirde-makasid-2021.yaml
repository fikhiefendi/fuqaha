abstract: "Bu çalışma, maḳāṣıd mevzusunda öne çıkan isimlerin tefsire yansıyan öznel yaklaşımlarını ve bu bakış açılarının arka planında yatan temel amilleri ortaya koymaya çalışmaktadır. İki bölümden oluşan araştırmanın birinci bölümünde ilk olarak öznellik ve nesnellikle ilgili kavramsal çerçeve ortaya konulmuş, ardından Batı ve İslam düşüncesinde öznellik ve nesnelliğin tarihsel gelişimleri ile yorumda öznelliğe sebep olan temel etmenler ele alınmıştır. Çalışmanın ikinci bölümünde ise, maḳāṣıd ile ilgili temel kavramlardan bahsedildikten sonra maḳāṣıd yaklaşımlarındaki öznelliğin tefsire etkisi incelenmiştir. Bu bağlamda ilk olarak Şāṭıbī'nin ummīlik teorisi ve bunun ilmî tefsirle ilgili yaklaşımına etkisi sunulmuş, sonrasında ise bu hususla ilgili İbn 'Āşūr'un Şāṭıbī'ye olan eleştirisi ortaya konulmuştur. İlk muhatapların ummī bir topluluk olup, Kur'an'ın onların idrak ve seviyelerine göre bir hitapta bulunduğunu bildiren Şāṭıbī, o dönemdeki Arapların bilgisi dışında herhangi bir şeyin Kur'an'da bulunmadığından yola çıkarak ilmî tefsiri reddetmektedir. İbn 'Āşūr ise bu tefsir ekolünü takip ederek tefsirinin mukaddimesinde Şāṭıbī'ye altı madde halinde bir tenkit sunmaktadır. Çalışmamızda daha sonra Faḍlur Raḥman'ın, Şāṭıbī'nin fikirlerine dayandırarak geliştirdiği tarihselci bir bakış açısına sahip olan Kur'an'ı anlama metodundan bahsedilmiştir. Faḍlur Raḥman'ın, Betti'nin romantik hermeneutik yaklaşımından etkilenerek geliştirdiği iki aşamadan oluşan tefsir metodu, ilk aşamada kendisini temel aldığını öne sürdüğü Şāṭıbī'nin fikirleriyle örtüşmesine karşın, ikinci aşamada farklılık arz etmektedir. Zira kullīlerin evrensel, cuz'īlerin ise tarihsel olduğunu savunan Faḍlur Raḥman'ın aksine Şāṭıbī böyle bir tutumu hatalı bulmaktadır. Bu bölümün üçüncü konusunu ise ḥikmetle ta'līl hususundaki tartışmalar oluşturmaktadır. Ḥikmetle ta'līli kabul edenler, etmeyenler ve şarta bağlayanlar olmak üzere üçe ayrılan ulemanın yaklaşımları, mevzuyla ilgili en geniş izahı veren isimler olan Cuveynī, Ġazzālī, Rāzī ve Āmidī'nin ortaya koyduğu fikirler dahilinde işlenmiştir. Tezin sonuç kısmında ise çalışmada ulaşılan sonuçlara dair genel bir değerlendirme yapılmıştır."
