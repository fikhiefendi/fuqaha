abstract: "Anlaşmazlık ve uyuşmazlıkları ifade eden şikâk kavramının anlam sahasına, aile hukuku bağlamında değerlendirildiğinde eşler arasında meydana gelen geçimsizlikleri dâhil etmek mümkündür. Bu çalışmada aile birliğinin sarsılmasına ve çoğunlukla boşanmalara sebebiyet veren, Nisâ suresinin 35. ayetinde zikredilen şikâk kavramı, bütün yönleriyle ele alındıktan sonra kavramın sadece eşler arasındaki geçimsizliğe has anlamı üzerinde duruldu ve çalışmanın genelinde kavramın şiddetli geçimsizlik anlamı tercih edildi. Ardından şiddetli geçimsizlik sayılabilecek hususlar ve bu durumların hangi ölçüde ayrılığa sebebiyet verdiği ve hukuki neticeleri ele alındı. Hukuk-i Aile Kararnâmesinin konuyla ilgili düzenlemelerine ve bazı İslam ülkelerinin kanunlarında konuyla ilgili yer alan düzenlemelere yer verildi. Son olarak ülkemizde uygulanan Türk Medenî Kanunu'nda yer alan şiddetli geçimsizlikle ilgili boşanmalar ile mukayese edildi."
