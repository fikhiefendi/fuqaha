abstract: "Yapmış olduğum bu tez çalışmasında günümüzde İslami değerlere önem veren bireylerin birikimlerini değerlendirmek için tercih seçeneği olan Katılım Bankalarının Türkiye'deki uygulamalarından bahsedilmiştir. Katılım Bankalarının tarihi, ürünleri anlatılmaya çalışılmıştır. Katılım Bankalarının Türkiye' de bankacılık sektöründeki yeri belirli finansal tablolarla açıklanmaya çalışılarak Türkiye'de faaliyet gösteren diğer mevduat bankalarıyla karşılaştırılmıştır. İlgili karşılaştırma sonucu Katılım Bankalarının Türk Bankacılık sistemindeki yeri bulunmaya çalışılmıştır. Katılım Bankalarının mevduat bankalarıyla rekabet edebilmesi için önerilerde bulunulmuştur."
