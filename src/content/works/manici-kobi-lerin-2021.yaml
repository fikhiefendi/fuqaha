abstract: "KOBİ'lerin çalışmayı tercih ettikleri bankaları nasıl seçtikleri bilim insanları ve bankaların üst yönetimleri tarafından daima merak edilmiştir. Literatürde yapılan araştırmalara bakıldığında; bankaların daha çok müşteriye ulaşmasında ve mevcut olan müşterileri tutundurma çabalarında etkili faktörlerin neler olduğunun zaman zaman incelendiği görülmüştür. 1980'li yıllarda Türk Bankacılık ve Finans sektörüne giren Katılım Bankacılığı da bu noktada önemli bir konu başlığı olmuştur. Katılım bankacılığı bireyler ve KOBİ'ler için faizli bankalara alternatif kurumlardır. Katılım bankaları ile çalışmayı tercih eden işletmeler; faizli bankalar ile çalışmayan, fakat mevcut olan birikimlerini değerlendirmek ve aynı zamanda finansmana ihtiyaç duyan kuruluşlardır. Bu çalışmada 517 KOBİ dikkate alınmış ve anket yöntemi ile ihtiyaç duyulan veriler toplanmıştır. Toplanan 517 anketten 467 tanesinin analize uygun olduğu tespit edildikten sonra KOBİ'lerin katılım bankacılığı tercihini etkileyen faktörler ve katılım bankacılığı terim ve hizmetleri konusundaki bilgi, farkındalık ve algı düzeyleri araştırılmıştır. Çalışmanın uygulama bölümünde faktör analizi, bağımsız gruplar t testi ve tek yönlü ANOVA testlerinden faydalanılmıştır. Çalışma sonucunda KOBİ'lerin katılım bankacılığı tercihleri üzerinde din faktörünün ve katılım bankalarının ulaşılabilir olmasının önemli birer etken oldukları tespit edilmiştir. Aynı zamanda katılım bankalarının ürün ve hizmetlerini müşterilerine daha yalın bir dille anlatmasının gerekliliği gözlemlenmiştir."
