abstract: "Bu tez, fıkhın yeni ortaya çıkan konularından biri olarak kabul edilen her türlü dijital para birimleri ve kullanım yöntemleriyle ilgili fıkhi hükümleri ve içtihatları beyan etmeyi hedeflemektedir. Müslümanların haram para tedavülüne düşmemesi için güncel fıkıh ilminin konularından biri haline gelen bu problemin çözümlerinin açıklanması gerekmektedir. Çalışmanın amacına ulaşmak için fıkıh kitaplarını araştırırken; fıkhî hükümlere ulaşmak için tümevarım yöntemiyle fetvalar bir araya getirilirken ve makaâsıdu'ş-şerîa prensiplerini dijital para kullanımıyla ilgili hükümlerle irtibatlandırılırken betimleyici, istinbâtî ve analitik yöntem kullanılmıştır. Araştırmada şu sonuçlara varılmıştır: İslam hukuku parayı net bir şekilde tanımlamış, fayda sağlayan ve zararı önleyen kriter ve yasalar koymuştur. Dijital para, yeni bir para çeşidi olup, meşruiyeti ve yasal şartları hakkında ekonomistler ihtilaf etmiştir. Fakihler dijital parayı ve özelliklerini araştırmış, şer'î paranın bazı şartlarını taşımayan müstakil bir para birimi olarak kabul etmiştir. Bu sebeple bazı fakihler dijital para kullanmayı haram kabul etmiş, diğerleri ise insanların aldatmasını ve cehaletini önlemek için kriterlerin araştırılmasını önermiştir. Toplumun genel kabulü, kıyemi ve maddi dayanıklılık, göreceli kıtlık, bölünme ve parçalanabilme, taşınma, kullanım ve tanımlama kolaylığı olanları caiz, olmayanları haram kabul etmişlerdir. Dijital parayla ticaretinin caiz olması, bankaların denetim ve düzenlemelerine bağlıdır. Bütün bunlar kara parayı aklamayı önlemek içindir. Bitkoinin bazı avantajları olmakla birlikte yaygın kullanımdan ötürü hatası daha çok sakıncalıdır. Artış ise bitkoinin maddi değerinin karşılığı değildir. Bundan ötürü Türkiye Diyanet İşleri Başkanlığı, Filistin ve Mısır Fetva Dairesi bitkoini caiz görmezken; cemaatten ayrılan bazı ferdi fetvalara göre ise caizdir."
