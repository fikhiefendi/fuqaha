abstract: "Furûk, hicri IV. yüzyıldan itibaren müstakil eserlerin kaleme alındığı, benzer görünen kavram, kâide ve meseleler arasındaki farkların incelendiği İslam hukukunda bir yazım türüdür. Fıkıh ve usul kitaplarında işlenen konular, furûk yazımında farklı bir gaye ve üslupla tekrar ele alınmış; benzer görünen ancak farklı hüküm alan kavramların, kâidelerin ve meselelerin, mukayese usulüyle farklılaşma gerekçeleri delillendirilmiştir. Giriş ve iki ana bölümden oluşan bu çalışmanın giriş bölümünde, araştırmanın içeriğine kısaca değinilerek Türkiye'de ve yurtdışında fıkhî furûk yazımı üzerine yapılan çalışmalara yer verilmiştir. Birinci bölümünde, bir yazım türü olarak furûk incelenerek bu alanda ortaya çıkan literatürün bir listesi sunulmuştur. İkinci bölümünde ise, furûk eserleri bey' akdi özelinde incelenerek bu yazım türünde neler yapıldığı ve bu yazım türünün hangi gayeyle kaleme alındığı tespit edilmeye çalışılmıştır."
