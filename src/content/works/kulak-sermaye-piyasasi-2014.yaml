abstract: "Kira sertifikası ülkemizde çok yeni bir kavramdır. İlk düzenlemesi 2010 senesinde yapılan ve bir tür ile sınırlı tutulan kira sertifikası, 2013 senesinde yürürlüğe giren 6362 sayılı kanun ve akabinde çıkarılan tebliğ ile çeşitliliği beşe çıkarılmıştır. Çalışmamız içerisinde sermaye piyasası araçlarına değinildikten sonra kira sertifikası türleri hukukî açıdan ele alınmıştır. Ayrıca mevzuatımızda mevcut benzer sözleşme türleri ile ilişkilerine de değinilmiştir. Tezimizin amacı, yeni bir kavram olan kira sertifikalarından doğabilecek hukukî uyuşmazlıklara uygulanacak ulusal mevzuatın belirlenmesine yol göstermektir."
