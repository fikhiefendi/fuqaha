abstract: "Finans sektörünün temel aktörleri bankalar ve borsalardır. Katılım bankacılığı, klasik bankacılık işlevlerini, İslami hukuka uygun olarak kar ve zarara katılmak yöntemiyle faizden uzak tutarak yatırımcılarını ekonomik hayata kazandırmaktadır. Ülkeler ekonomilerini daha güçlü hale getirmek ve sürdürülebilirlik kazandırmak için finans merkezleri oluşturma çabası içerisine girmişlerdir. Türkiye de, İstanbul'un finans merkezi olması konusunda güçlü bir irade ortaya koymuştur. İstanbul'un Finans merkezi olması birçok finansal alana pozitif katkı yapacağı gibi katılım bankacılığına da pozitif katkı yapacaktır. Otuz yıldan beri Türkiye'de varlıklarını sürdüren Katılım bankaları bankacılık sektöründe belli bir oranın üzerinde pay alamamışlardır. İstanbul Finans merkezi katılım bankacılığının sektör içindeki payını artıracaktır. Bu çalışmanın amacı, İstanbul'un Finans Merkezi olması sürecinde katılım bankacılığı geleceğinin projeksiyonunu yapmak ve bu sürece karşılıklı olarak katkılarını belirlemektir. İstanbul'un finans merkezi olabilme potansiyeli, İstanbul Finans Merkezinin (İFM) yasal temel, hukuki yapı ve yapılabilirliği araştırıldı. Katılım bankacılığının mevcut durumu ortaya kondu. Katılım bankacılığı büyüme göstergeleri ile çeşitli ulusal ekonomik göstergeler arasındaki ilişkiler korelasyon ve regresyon analiz yöntemleri kullanılarak belirlendi. Göstergeleri hızla büyüme gösteren ve ulusal ekonomiye katkı sunan katılım bankacılığının İFM ye İFM nin de katılım Bankacılığına karşılıklı katkı yapacağı düşünülmektedir."
