abstract: "Dünyada yaşanan yeni gelişmeler finansal piyasalarda birçok ihtiyacın oluşmasına neden olmuştur. Dünyada yaygın olan konvansiyonel bankacılık sitemi gelişme gösterse de faiz hassasiyeti olan yatırımcıları piyasalara çekecek ürünler sunamamıştır. Katılım bankalarının kurulması ile yatırımcılar faizsiz finansman ürünlerini tanımış ve işlem yapmaya başlamışlardır. Bu ürünler arasında dünya piyasalarında en çok işlem gören ise sukuktur. Dünyada sukuk ihracı başlarda sadece katılım bankaları tarafından ihraç edilse de yatırım portföyünü genişletmek ve riski azaltmak için konvansiyonel bankalar tarafından da ihraç edilmektedir. Türkiye'de katılım bankacılığının son yıllarda yaygınlaşması sukuk ihracına olumlu yönde etki etmiştir. Türkiye piyasalarında“kira sertifikası”adı ile işlem görmektedir. Bu çalışma ile sukukun detaylı olarak yapısı ve işleyişi ele alınmıştır. Türkiye ve dünya piyasalarındaki yeri incelenerek çeşitli sorunlar tespit edilmiş olup öneriler sunulmuştur."
