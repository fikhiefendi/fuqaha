abstract: "Tezin giriş bölümünde, araştırmanın konusu, kapsamı, amacı, yöntemi ve önemi açıklandı; ardından Mecelle-i Ahkâm-ı Adliyye ve“Zarar ve mukâbele bi'z-zarar yoktur (19. md.)”küllî kâidesi ile alakalı kâideler hakkında bilgi verildi. İkinci bölümde, tezde esas alınan Mecelle 19. maddenin Arapçasında geçen kelimelerin manası ve zarar çeşitleri hakkında bilgi verildi; kâidenin, Kur'ân ve Sünnet'teki delilleri açıklandı. Üçüncü bölümde,“Zarar ve mukâbele bi'z-zarar yoktur (19. md.)”küllî kâidesi, Mevsılî'nin el-İhtiyâr adlı fıkıh kitabını merkeze alarak Merginânî'nin el-Hidâye, Kudûrî'nin el-Muhtasar, Serahsî'nin el-Mebsût adlı eserlerinde zararla ilgili meselelerin geçtiği yerler esas alınarak İslâm hukukunda uygulama örnekleri; alışveriş, şüf'a, icare, kısmet, hacr, hibe, âriye, şirb, gasp, talâk, siyer, diyetler, vasiyet konu başlıkları altında ele alınarak incelendi. Sonuç bölümünde, çalışmamızın kaynağını oluşturan kâidenin,“Zarar verme ve zarar görme (ve zarara zararla karşılık verme) yoktur.”hadisinden yola çıkılarak hazırlandığı sonucuna ulaşılmıştır. Ayrıca fıkıh kurallarından biri olarak kabul edilen bu hadis ile Müslümanların hayatlarının her alanında önem vermeleri gereken bir duruma dikkat çekilmektedir. Çünkü İslâm, adalet ve itidal üzerine kuruludur. Bu bağlamda dinimiz insanların birbirine zarar vermesini yasaklamıştır. Buna göre, ele aldığımız kuralın ilk kısmı başkalarına zarar vermeyi, ikinci kısmı ise zarar karşısında zararla misilleme yapılmasını yasaklamaktadır. Bu yasağa rağmen, zarara uğrayanlar, intikam almak için zarar vermemeli, mağduriyetin giderilmesi için yetkili mercilere başvurmalıdır."
