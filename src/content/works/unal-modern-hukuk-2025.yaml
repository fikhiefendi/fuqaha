abstract: "Çalışma, sadâkat yükümlülüğünü hem İslâm hukuku hem de pozitif hukuk perspektifinden incelemiş, modern hukukun“sadâkat yükümlülüğü”olarak tanımladığı bu mükellefiyetin İslâm aile hukukundaki köklerini ve görünümlerini ortaya koyma amacıyla yazılmıştır. İslâm aile hukukunun temel prensipleri (birlik, süreklilik, adalet, hakkaniyet) ve çeşitli ahkâm rivayetleri ışığında sadâkat yükümlülüğü konusundaki dağınık bilgiyi sistematik bir çatı altında toplamasıyla özgün bir katkı sağlamayı hedeflemiştir. Çalışma, sadâkatin filolojik ve semantik tahlilinden başlayarak, Josiah Royce ve Gabriel Marcel gibi düşünürlerin sadâkat yaklaşımlarını değerlendirmiş, sadâkati yalnızca ahlaki bir erdem olmaktan çıkarıp hukukî bir kavram olarak temellendirmiştir. Araştırma, sadâkat yükümlülüğünü cinsel, duygusal, ekonomik ve fiziksel sadâkat görünümleri altında kategorize ederek, bu görünümlerin her birini örneklerle açıklamıştır. Sadâkat yükümlülüğünün nişanlılık, evlilik birliği süreci, ayrılık kararı ve boşanma süreci gibi farklı zaman dilimlerindeki kapsamı detaylı bir şekilde incelenmiştir. Sadâkat yükümlülüğünün ihlâlinin tespiti ve bu durumda ortaya çıkan hukukî sonuçlar, nişanın bozulmasından boşanmaya, miras hakkının sonlanmasından tazminat davalarına kadar geniş bir yelpazede ele alınmıştır. Çalışma, aile hukukunda kastın ve iç saiklerin önemini vurgulayarak, sadâkatsiz davranışların hukukî sonuçları için kusurun belirlenmesinde derinlemesine bir analiz sunmaktadır. Tezin, İslâm hukukunun“zarûrât-ı hamse”(beş temel maslahat) ilkesi bağlamında, sadâkatsizliğin maddi ve manevi zararlarının tazminini ele alması, günümüz ihtiyaçlarına fıkhi bir cevap niteliğindedir. Ayrıca çalışma, pozitif hukuk ile İslam hukuku arasındaki örtüşen ve ayrışan noktaları mukayeseli bir biçimde sunmakta, bununla her iki hukuk sisteminin de insanlığın ortak sorunlarına çözüm arayışındaki paralelliğini göstermeye çalışmaktadır. Araştırma, nitel bilgi toplama yöntemlerinden yazılı doküman incelemesine dayanmaktadır. Literatür taramasından elde edilen veriler bütüncül bir bakış açısıyla metin analizine tâbi tutularak değerlendirilmiştir. Çalışma, akademik disiplinler arası bir yaklaşımın ürünü olarak, teorik bilgiyi pratik hayattaki karşılıklarıyla birleştirerek, hem güncel hukukî sorunlara ışık tutmakta hem de İslam hukukunun çağdaş meselelere adaptasyon kabiliyetini ortaya koymaktadır. Bu haliyle tez, aile hukuku alanındaki literatüre katkı sağlamakta ve sadâkat yükümlülüğü konusunda gelecek çalışmalara zemin hazırlamaktadır."
