abstract: "Osmanlı Hukukçusu Ebussuûd Efendi ve Fetvâları? başlığı ile yapılan bu çalışmada, Ebussuûd Efendi'nin hayatı, kişiliği ve eserleri üzerinde durulmuş, fetvâları yazma eser kütüphanelerinden tespit edilen eserler zemininde incelenmiştir. Bu eserlerde yer alan fetvâlar fetvâ şukkaları, müstakil derlemeler, muhtelif eserlerin metin ya da kenar kayıtlar şeklinde tasnif edilerek ele alınmış, kaynakların her birinden örnekler sunulmuştur. Kaynak kullanımında müstakil mecmûalardan Velî b. Yusuf, Sinan b. Ramazan derlemeleri ile Süleymaniye Kütüphanesi İsmihan Sultan koleksiyonunda bulunan iki mecmû esas alınmış, diğer mecmûalarda yer alan meselelere de atıflarda bulunulmuştur. İlgili kaynaklarda yer alan konular hakkında istatistik tespitler yapılarak Ebussuûd Efendi dönemi problemleri hakkında kısa da olsa bilgi verilmiştir. İtikadi ve tasavvufî fetvâları tasnif edilerek tanıtılmış, fıkhî meseleler ise fıkıh ve fetvâ usûlü açısından detaylı olarak tahlil edilmiştir."
