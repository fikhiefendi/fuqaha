abstract: "Devletlerin ceza kanunlarının uygulanma sınır ve kapsamını belirleyen ceza hukuku konusuna ceza kanunlarının yer itibariyle uygulanması denir. İslâm hukukçuları bu konuda üç farklı görüş ileri sürmüşlerdir. Hanefî hukukçular, İslâm ceza hükümlerinin yalnızca İslâm ülkesinde uygulanabileceğini savunmuşlardır. Onlara göre İslâm ceza hükümlerinin muhatabı da yalnızca Müslümanlar ve zimmîlerdir. Müste'menlere kısas suçları ve bazı kişi hakları dışında, İslâmî hükümler uygulanmaz. Hanefîlerden Ebû Yusuf'u mezhebinin görüşünden ayıran tek nokta, onun İslâm ülkesinde suç işlemiş müste'menleri istisna etmemesidir. Cumhûr'a göre dârulharbin dârulislâmdan bir farkı yoktur. Dârulislâmda suç sayılan bir fiil dârulharpte de suç kabul edilir. Cumhûr,İslâm ceza hukuku hükümlerininİslâm beldesinde mutlak olarak herkese uygulanması gerektiğini savunmuştur. Yabancı ülkede ise yalnızca İslâm devleti vatandaşları (Müslümanlar ve zimmîler) İslâm ceza hukuku hükümlerine karşı sorumludurlar."
