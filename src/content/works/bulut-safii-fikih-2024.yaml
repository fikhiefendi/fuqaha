abstract: "Ümmetin müctehitlerinin bir konu üzerinde ittifak etmesi demek olan icmâ, İslam dininin sabitelerinden olup hükme kaynak olma cihetiyle oldukça kuvvetli bir dayanaktır. Diğer mezheplerde olduğu gibi Şâfiî mezhebi de görüşlerini meşru bir zemine oturtmak için icmâya oldukça önem vermiş, hüküm çıkarmada onu dikkate almıştır. Çalışmada, Şâfiî mezhebinin aile hukukundaki icmâlarını araştırırken bunların mezhepler arası kabul gören ümmetin icmâsı mı yoksa mezhep içi âlimlerin ittifakı mı olup olmadığını tespit etmek için, Şâfiîlerin aile hukukuna dair icmâ var dediği konular, diğer mezheplerin (Hanefî, Mâlikî ve Hanbelî) klasik fıkıh kaynaklarına başvurularak incelemeye alınmış ve tahkik edilmeye çalışılmıştır. Her mezhebin kendi bünyesindeki birincil kaynaklar araştırmamızda evvelîyetle tercih ettiğimiz dayanaklarımız olmakla birlikte, ihtiyaç duyuldukça yakın zaman âlimlerinin eserlerine de zaman zaman yer verilmiştir. Yapılan incelemeler göstermiştir ki Şâfiîlerin, icmâ diye bahsettiği bazı noktalar, mezhep içi ittifak olarak ortaya çıkmaktadır. Çalışmamızda Şafiîlerin aile hukukuyla ilgili üzerinde icmâ mevcut dedikleri 83 mesele tespit edilmiş olup, bu meselelerin 61 tanesinde diğer mezhepler de Şafiîlerle aynı görüşü savunmakta, 22 tanesinde ise muhalefet ettikleri görülmektedir. Bu tespitleri yaparken mezheplerin öne sürdüğü delillere de çalışmamızda yer vermeye gayret gösterdik. Bu çalışmamızdan önce, Şâfiîlerin aile hukuku alanında var dedikleri icmâların tahkikinin yapılmamış olması ve bu iddia edilen icmâların dört meşhur mezhebin kaynaklarına müracat edilerek mezhepler arası bir mukayeseye de tabi tutulmamış olması çalışmamızı özgün ve önemli kılmaktadır. Her ne kadar çalışmada asıl maksat aile hukukuyla ilgili icmâları tespit etmek olsa da araştırma boyunca birçok konuya temas edilmiş ve bu sayede okuyucunun temas edilen konuların icmâ edilen fıkhi hükümler olması açısından da bilgi sahibi olması tarafımızca tâli hedef olarak belirlenmiştir."
