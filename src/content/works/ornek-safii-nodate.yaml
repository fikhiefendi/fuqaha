abstract: "Tahrîc, bir mezhebe bağlı kalarak hareket eden âlimin, kendi imamının usûl anlayışı ve fürû fıkha dair müktesebatını merkeze alarak fıkhî bilgi üretmeye yönelik faaliyeti olarak tanımlanabilir. Mezhep imamının ifadelerini açıklamak, yorumlamak, fıkhî meseleleri daha önce mezhep imamı tarafından hükme bağlanan meselelere kıyas etmek veya onun usûl ve kaideleri vasıtasıyla çözümler getirmek vb. pek çok işlem ilgili faaliyetin kapsamı altındadır. Tahrîc, mezhep imamlarının ilk talebelerinden başlayarak devam eden yüzyıllar boyunca mezhep içi hareketliliğin en etkin faaliyetlerinden biri olmuştur. Bu çalışma, tahrîcin Şâfiî mezhebindeki serüvenine odaklanmaktadır. Çalışma üç bölümden oluşmaktadır. İlk bölümde Şâfiî'nin vefatından hicrî dördüncü asrın ortalarına kadar geçen sürede yaşamış olan Şâfiî fakihlerin günümüze intikal eden eserlerinden yola çıkılarak tahrîcin bir kavram olarak ortaya çıkışı, kazandığı anlamlar ve mahiyeti üzerinde durulmuştur. İkinci bölümde tahrîcin tanımı, kısımları, kapsamı, meşruiyetine dair mezhep içi tartışmalar vb. konular ele alınarak tahrîce dair teorik bir çerçeve çizilmeye çalışılmıştır. Son bölümde ise tahrîcin meseleleri tefrî' etmek, Şâfiî'nin hükme bağladığı meselelerin asıl ve illetlerini tespit etmek, Şâfiî'ye muhalefet etmek ve aynı mesele hakkında birbiriyle çelişen görüşler beyan etmesinden kaynaklanan sorunları çözmek gibi bazı fonksiyonları incelenmiştir."
