abstract: "Musharakah finansmanı, İslami finansman formüllerinin en önemli türlerinden biri olarak kabul edilmektedir. Bu, İslami bankaların müşterilerini finanse etmek için geleneksel bankalarda kullanılan faiz oranları yerine güvenebilecekleri uygun alternatiflerden biridir. Ancak, İslami bankaların finansman listeleri aksini göstermektedir. Katılım finansmanı formülü, toplam finansmanın sadece küçük bir yüzdesini temsil etmektedir. İslami bankaların büyük bir kısmı Murabaha'ya yönelmektedir. Bu nedenle, araştırma problemi, İslami bankaların musharakah finansmanını kullanırken karşılaştığı zorluklardır. Tez, musharakah'ın kullanımının önündeki gerçek engelleri belirlemeyi amaçlamaktadır. Çalışma, tezin İslami bankalar ve musharakah formülleri ile ilgili teorik yönünü sunmak için tanımlayıcı bir yaklaşıma dayanmaktadır. Uygulamalı bölümde ise çalışmanın sonuçlarını sunmak için analitik bir yaklaşım kullanılmaktadır. Bu, çalışma örneği olarak seçilen Libya bankalarında anket aracı ve bireysel görüşmelerin kullanılmasıyla gerçekleştirilir. Bunlar: jumhouria, wahda, north africa, national commercial ve sahara'dır. Anketler, jamovi programı kullanılarak istatistiksel olarak analiz edilirken, görüşmelerin en önemli sonuçları çıkarılarak açıklayıcı olarak analiz edilmiştir."
