abstract: "Bu çalışma,“Çağdaş Türk Ceza Hukukunda Ta'zir Benzeri Cezaların İslam Hukuku Açısından Değerlendirilmesi”hususunu ele almaktadır. İslam Hukukunda ta'zîr cezaları, had, kısas ve diyet gibi Kur'an ve Sünnetle belirlenmiş ceza türlerinin dışında kalan, hâkimin takdirine dayalı cezalardır. Tezde öncelikle İslam ceza hukukunun temel esasları çerçevesinde ta'zîr kavramı detaylı olarak ele alınmış; bu çerçevede ceza türleri arasındaki farklar, ta'zîrin tarihsel gelişimi ve İslam hukuk ekollerine göre farklı yorumları incelenmiştir. Ardından Çağdaş Türk Ceza Hukuku'ndaki benzer uygulamalar analiz edilmiş ve hâkimin ceza tayinindeki takdir yetkisi ile İslam hukukundaki ta'zîr anlayışı arasındaki benzerlikler ve farklılıklar değerlendirilmiştir. Bu bağlamda çalışmada hem normatif hem de mukayeseli bir yöntem kullanılmış, ta'zîr benzeri uygulamaların Çağdaş Türk Ceza Hukuku sisteminde meşruiyeti, işlevi ve sınırları tartışılmıştır. Sonuç olarak, ta'zîr kavramının İslam Hukuku'nda olduğu gibi belirli ilkeler çerçevesinde hâkime geniş bir takdir yetkisi sunduğu, ancak Çağdaş Türk Ceza Hukuku'nda bu yetkinin anayasal ve yasal denetime tabi olduğu tespit edilmiştir. Çalışma, İslam Hukuku ile Çağdaş Türk Ceza Hukuku arasında ceza adaleti açısından bir köprü kurmayı hedeflenmiştir. Böylece interdispliner olarak gelecek çalışmalara bir perspektif oluşturmaya çalışılmıştır."
