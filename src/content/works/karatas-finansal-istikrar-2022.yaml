abstract: "Finansal istikrar arayışı, modern makroekonomik politikaların en önemli amacı haline gelmiştir. Özellikle 2008 Küresel Finans Krizi, kredi riskini yönetebilme bağlamında bankacılık sektörüne vurgu yaparak finansal istikrarı anlamanın önemini vurgulamıştır. Bankalar bu bağlamda finansal sistemin en önemli aracı kurumu konumundadırlar. Bankacılık sektörünün güncel görünümünde iki bankacılık kesimi öne çıkmaktadır: konvansiyonel bankacılık ve katılım bankacılığı. Dünya ekonomileri için finansal sistemin başarısı finansal istikrara bağlıdır. Bu sebeple söz konusu iki bankacılık kesiminin finansal istikrar açısından mukayese edilmesi önemli hale gelmiştir. Bu amaç doğrultusunda bu çalışmada, öncelikli olarak Türk bankacılık sektöründe birlikte faaliyet gösteren konvansiyonel bankacılık sektörü ile katılım bankacılığı sektörü kredi riski açısından analiz edilmiştir. Analiz 2005:M1-2020:M6 dönemine ait aylık veriler ile gerçekleştirilmiştir. Modellemede literatüre bağlı kalınarak bağımlı değişkenler, sektörel bazda olmak üzere her iki bankacılık kesimi için de takipteki krediler oranı olarak seçilmiştir. Bağımsız değişkenler olarak ise faiz oranları, tüketici güven endeksi, petrol fiyatları, işsizlik oranları, dolar cinsinden aylık asgari ücret, döviz volatilitesi ve reel döviz kuru tercih edilmiştir. Daha sonra Körfez Arap Ülkeleri İş Birliği Konseyi (KİK)'ne dahil olan Bahreyn, Birleşik Arap Emirlikleri, Katar, Suudi Arabistan ve Kuveyt bankacılık sektörü için yıllık veriler kullanılarak kredi riski modellemeleri yapılmıştır. KİK ülkeleri için yapılan modellemelerde de literatüre bağlı kalınarak bağımlı değişkenler olarak; sektörel bazda olmak üzere her iki bankacılık kesimi için takipteki krediler oranı seçilmiştir. Bağımsız değişkenler olarak ise gayrisafi yurt içi hasıla büyüme oranı, işsizlik oranı, enflasyon oranı, reel döviz kuru ve petrol fiyatları tercih edilmiştir. İlgili modellemeler, değişkenler arasında eşbütünleşme ve nedensellik ilişkisini tespit etmek amacıyla kurulmuştur. Buna göre Türkiye, Birleşik Arap Emirlikleri, Suudi Arabistan ve Kuveyt bankacılık sektörleri için AARDL Sınır Testi ile eşbütünleşme analizi gerçekleştirilmiştir. Ayrıca analize dahil edilen tüm ülkelerde Granger Nedensellik Testi analizi yapılmıştır. Çalışma sonucunda iki önemli sonuca ulaşılmıştır. Buna göre makro iktisadi değişkenler, ülkeler ve iki bankacılık kesimi itibariyle takipteki kredileri açıklama gücüne sahiptir. İkinci sonuca göre ise konvansiyonel bankaların sorunlu kredileri katılım bankalarına kıyasla göreli olarak makro iktisadi değişkenlerdeki değişimlere daha duyarlıdır."
