abstract: "Dünya genelinde birçok hukuk sisteminde yer alan hakkaniyet ilkesinin mahiyeti ve kapsamı birçok bilimsel tartışamaya konu olmuştur. Bu tartışmalardan birisi de hâkimin takdir yetkisi kavramının hakkaniyet ilkesi ile olan ilişkisidir. Bu ilişki temelinde İslam hukukunda hakkaniyet ilkesinin varlığı/yokluğu ile ilgili bu çalışma, bir giriş ile üç bölüm ve sonuç kısmından meydana gelmektedir. Giriş kısmında konunun önemi, sınırlandırılması, sunulması ve kullanılan kaynakların değerlendirilmesi hakkında bilgi verilmiştir. Konunun anlaşılmasına yönelik genel bilgileri içeren birinci bölümde nitel araştırma yöntemi kullanılarak konuyla ilgili kavramlar açıklanmaya çalışılmıştır. Hakkaniyet ilkesi ile ilgili kavramlar elde edilen veriler ışığında tetkik edilmiş, genel hukuk literatüründe hakkaniyet ile ilgili bilgilere ve hakkaniyet çeşitlerine yer verilmiştir. İkinci bölümde hakkaniyetin bir çeşidi olarak kabul edilen hâkimin takdir yetkisi, teorik anlamda açıklanmaya çalışılmıştır. İslâm ceza hukukunda ağırlıklı olmak üzere hâkimin takdir yetkisinin mahiyeti, sınırı ve usul hukuku açısından değerlendirmesine yer verilmiştir. Üçüncü bölümde ise yine aynı şekilde veri toplama yöntemi ve mukayese yöntemi ile İslam ceza hukuku içinde XVI-XVIII. yüzyıllar arası Osmanlı dönemine ait hâkimin takdir yetkisi kullanılarak verilen mahkeme kararlarına yer verilmiş, hakkaniyet ilkesi bağlamında tahlilleri yapılmıştır."
