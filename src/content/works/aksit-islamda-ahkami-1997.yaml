abstract: "ÖZET İslam dininin insan sağlığına verdiği önem yaygın bilinen bir gerçektir. Tıp ilmine İbni Sina gibi nice İslam hekimlerinin unutulmaz katkıları olmuştur. Modern diş hekimliği uygulamaları çok hızlı değişim göstermektedir. Bu sanatın uygulanmasında bazı hukuki problemler ortaya çıkmaktadır. İslam hukukunda değişen tıp tekniklerine uygulanabilecek ana prensipler vardır. Bu çalışmada, zikredilen ana prensipler ışığında, günümüz diş hekimliği uygulamalarına fikhi çözümler getirilmeye çalışılmıştır. Diş hekimliği sanatının icra yöntemleri değişse de, diş hekimlerinin sorumluluğu içerik yönünden fazla değişim göstermemektedir. İslam dininde ödenmesi güç para cezalarıyla insan sağlığına verilebilecek zararların önlenmesi öngörülmüştür. Bu durum insan sağlığına ve haysiyetine verilen önemi vurgulamaktadır. Günümüz koruyucu hekimlik anlayışının ulaştığı neticelerden sonra, İslam'ın ağız sağlığına verdiği önemin kıymeti daha iyi anlaşılmaktadır. vii"
