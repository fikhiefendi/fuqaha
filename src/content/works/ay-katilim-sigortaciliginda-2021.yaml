abstract: "Konvansiyonel sigortacılık sistemine alternatif bir sigorta olarak katılım sigortacılığı (tekâfül) ortaya çıkmış ve günümüzde giderek yaygınlık kazanmıştır. Önemi artan ve uygulaması giderek yaygınlaşan katılım sigortacılığı gelişme potansiyeli yüksek bir sektör olup, katılım sigortacılığının mevcut finansal sistemde payını arttırma ve sisteme entegre olma sürecinde gerekli kurumsal, hukuksal ve yapısal sorunların giderilmesi ve ihtiyaçların karşılanması önem arz etmekte, bu amaçla önemli adımların atılması ve düzenlemelere gidilmesi gerekmektedir. Bu maksatla çalışmada literatürde yeterince incelenmemiş bir konu olan katılım sigortacılığında artan bakiye hususu incelenmeye çalışılmıştır. Katılım sigortacılığında katılımcıların havuzunda poliçe dönemi sonunda ortaya çıkan ve artan bakiye adı verilen bakiyenin değerlendirilmesi durumu tartışılan bir konu olarak karşımıza çıkmaktadır. Her katılım sigortası şirketi artan bakiyenin değerlendirilmesine dair yönetmelikte yer alan yöntemlerden birini seçip -söz konusu yöntem hakkında müşterilerini bilgilendirmek koşulu ile- uygulayabilmektedir. Bu çalışma kapsamında katılım sigortacılığı ve artan bakiye uygulamalarına dair bilgi ve detaylar yer almaktadır. Bu çalışmanın amacı; artan bakiyenin değerlendirilmesi ile ilgili örnek ülke uygulamalarını da ele alarak artan bakiyenin katılımcılara dağıtılması, bir sonraki poliçe dönemi için ihtiyat olarak ayrılması ya da bağış olarak ilgili kurumlara hibe edilmesi gibi mevcut uygulamaların ışığında ülkelerdeki katılım sigortalarının artan bakiyeyi değerlendirme yöntemlerini ortaya koymaktır. Ayrıca, ülkemizde katılım sigortacılığı yapan şirketlerin artan bakiye uygulamalarına ve bu uygulamaların ekonomik ve finansal etkilerine dikkat çekilmesi amaçlanmıştır. Bu çalışmanın, artan bakiyenin dağıtılmasına ilişkin yaygın olarak kullanılan yöntemler ile konuya dair ülkemizdeki mevcut uygulamaların ekonomik ve finansal etkileri göz önünde bulundurularak artan bakiyenin en etkili değerlendirilme yöntemini belirlemede yardımcı kaynak olarak kullanılabilmesi hedeflenmiştir."
