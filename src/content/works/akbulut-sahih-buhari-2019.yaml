abstract: "Buhârî, hadisçi kimliğinin yanı sıra el-Câmi'u's-sahîh isimli eserinde gerek oluşturduğu konu başlıkları itibariyle gerekse başlıklar altında yaptığı taktîler itibariyle, fıkhî anlamda da son derece yetkin bir musanniftir. Genel anlamda Buhârî'nin fıkhı üzerine yapılmış çalışmalar bulunmasına karşın, ahkâm konularında kıssalardan istidlâlde bulunarak elde ettiği hükümler üzerine müstakil bir çalışma yapılmadığı görülmektedir. Bu çalışmada, öncelikle kıssalardan hüküm istidlâlinin Buhârî'ye has bir uygulama olup olmadığını tespit amacıyla Resûlüllah'tan itibaren sahabe ve tabiûnu da içerisine alacak şekilde sonrasında Ma'mer b. Râşid, İmam Mâlik, Abdürrezzâk es-San'ânî ve İbn Ebî Şeybe gibi musanniflere gelinceye dek kıssalardan hüküm istidlâli niteliğinde görülen örneklerden bir kaçı tespit edilerek sunulmuştur. Bu anlamda kıssadan istidlâlde bulunarak hüküm verme uygulamasının Resûlüllah'tan itibaren var olduğu tespit edilmiştir. Buhârî'nin ahkâm konularında istidlâlde bulunduğunu tespit ettiğimiz yirmi bir kıssanın sadece iki tanesinde Abdürrezzâk ve İbn Ebî Şeybe ile ortak, birinde Ma'mer b. Raşid'le, birinde İmam Mâlik'le, birinde Abdürrezzak es-San'ânî, bir diğerinde de İbn Ebî Şeybe ile aynı kıssadan aynı istidlâllerde bulunduğu görülmüştür. Buradan hareketle de Buhârî'nin kıssadan istidlâlde bulunma anlamında kendisinden öncekilerden çok fazla etkilenmediği sonucuna varılmıştır. Araştırmanın asıl konusunu içeren üçüncü bölümde ise Buhârî'nin ahkâm konularında kıssalardan hüküm istidlâline yönelik el-Câmi'u's-sahîh içerisinde bulunan yirmi bir kıssadan elde ettiği otuz dokuz hüküm açıklanmıştır. Buhârî'nin bir kıssadan en fazla altı hüküm elde ettiği görülmüştür. Son olarak da Buhârî'nin kıssalardan hüküm istidlâli bağlamında kendisinden sonra gelen Kütüb-i sitte müelliflerini etkileyip etkilemediği konusunda değerlendirmelerde bulunulmuştur. Nesâî'nin sekiz kıssadan çıkardığı hüküm itibariyle Buhârî'den en çok etkilenen müellif olduğu, Müslim'in de dört kıssadan çıkardığı hüküm açısından Buhârî'yle istidlâllerinin benzediği tespit edilmiştir. Netice itibariyle Buhârî öncesinde kıssadan hüküm istidlâli uygulamasının varlığı ancak Buhârî'nin bunu kendisinden öncekilere kıyasla çok daha etkin bir tarzda kullandığı ve sonrasında gelen müellifleri de bu manada etkilediği tespit edilmiştir."
