abstract: "Kur'ân-ı Kerim, kolay okunması ve anlaşılması amacıyla farklı lehçelerde nâzil olmuş ve bu yönüyle de diğer kutsal kitaplarda olmayan bir özelliğe sahip olmuştur. Lehçe farklılıklarından meydana gelen kırâat ihtilafları, kırâat ilminde önemli bir yer teşkil etmiştir. Bu durum kırâat ilminde, lafızların okunma keyfiyeti ve manaya etkisi gibi konularda da farklı görüşlerin ortaya çıkmasına sebep olmuştur. Ümmet için bir kolaylık ve genişlik olan kırâat farklılıkları ve farklılıkların temelini oluşturan yedi harf meselesi hakkında geçmişten günümüze kadar birçok farklı görüş ortaya atılmıştır. Farklı lehçelerin okunma durumları, kırâat rivâyetleri ve okumaların tefsire etkisi gibi konularda çalışmalar yapılmış ve bu konularda müstakil eserler verilmiştir. Hicri 4. asırda yaşamış olan Mekkî b. Ebî Tâlib, bu alanda ilk çalışma yapan müelliflerdendir. Mekkî, Kur'ân ilimleri alanında geniş ilmî birikime sahip olmakla birlikte diğer İslâmî ilimler noktasında da çok yönlü bir âlimdir. Kırâat, tefsir, fıkıh, hadis, lügat ve tecvid gibi her dalda söz ve eser sahibi olan müellif, özellikle kendisinden önce kırâat ilmine dair nakledilen bilgilerin toparlanıp sistemli hale gelmesinde ve kendisinden sonrakilere aktarılma noktasında önemli bir rol oynamıştır. Çalışmada esas alınan Mekkî'nin el-Hidâye ilâ bulûgi'n-nihâye isimli eseri, ağırlıklı olarak tefsir kitabı olmakla birlikte içinde kırâat, i'rab, fıkıh, nesh gibi Kur'ân ilimlerini barındıran hacimli bir eserdir. Bu çalışmada el-Hidâye üzerinden Mekkî'nin kırâat anlayışını, kırâatları kullanma keyfiyetini ortaya çıkarmak ve naklettiği kırâatların tefsirle irtbatı temelinde kırâat – tefsir ilişkisini ortaya koymak amaçlanmaktadır. Bu itibarla kırâat ilmine ve el-Hidâye'nin içeriğine dair genel bilgiler verildikten sonra Mekkî'nin kırâat ilmindeki yeri ve kırâatları işleyiş tarzı incelenerek, kırâatları kullanımı ve yüklediği anlamlar, kırâat ve tefsir bağlamında mukayeseli olarak örnekleriyle işlenmiştir."
