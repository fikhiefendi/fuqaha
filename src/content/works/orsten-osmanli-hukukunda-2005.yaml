abstract: "Fetvâ, Türk hukuk tarihinde İslâm dininin benimsenmesiyle varolmuş önemli birhukuksal kurumdur. İslâmiyet'in ilk dönemlerinden itibaren, toplum hayatında ve hukukdüzeninde etkili olmuştur. Osmanlı Devleti'nde de fetvâ, önemli işlevler yerine getirmiş vehalkın önemli başvuru kaynaklarından biri haline gelmiştir. Bu çalışma, Osmanlı hukukundafetvânın yeri, etkileri ve önemine ilişkindir.Çalışmanın birinci bölümünde fetvânın tanımı, hukuki niteliği, tarihsel gelişim sürecive genel şekil ve usul özellikleri açıklanmıştır.İkinci bölümde Osmanlı hukukunda fetvânın rolü, çeşitli yönlerden incelenmiştir.Şeyhülislâm, atanma ve azledilme usulü, görevleri, padişahı denetlemesi, örfû hukuka etkilerive Divan-ı Hümayun ile ilişkisi bakımından detaylı olarak açıklanmıştır.İkinci olarak, Osmanlı İmparatorluğu'nda fetvâ verme sürecinin kurumsallaşmışgörünümü olan Fetvâhâne ve Fetvâhâne'nin en önemli görevlisi olan Fetvâ Eminiincelenmiştir. Bu açıklamaların ardından, fetvâ ile yargı fonksiyonu arasındaki ilişki ve fetvâderlemeleri açıklanmıştır.Üçüncü bölüm, Osmanlı İmparatorluğu'nda hukuk uygulamasında fetvânın konumuhakkındadır. İnceleme kolaylığı için bu bölüm, kamu hukuku ve özel hukuk olarak ikikısımda sınıflandırılmıştır. Ceza hukuku, aile hukuku ve vakıf hukuku açıklanırken, ?Fetâvâ-yı Âli Efendi?deki çeşitli fetvâlardan yararlanılmıştır."
