abstract: "Yakın tarihimizde önemli hizmetler ifâ etmiş, ilmî mirasımızın taşıyıcı ve yorumlayıcısı durumundaki şahsiyetler hakkında çok az çalışmalar yapılmıştır. Ali Haydar Efendi, islâm Hukuku ve Mecelle'nin künhüne vâkıf olabilmek için eserleri tetkik edilmesi gereken şahsiyetlerin en başında yer alır. Bu sebeple böyle bir çalışmaya ihtiyaç duyulmuştur. Yapılan bu çalışma, bir giriş ve üç bölümden meydana gelmektedir. Giriş kısmında dönemin en belirgin hukuk gelişmeli özet olarak sunulmuştur. Birinci bölümde, Ali Haydar Efendi'nin hayatı ve ailesi incelenmiş, bulunduğu devlet hizmetleri ele alınmıştır. İkinci bölümde, ilmî şahsiyeti ve Osmanlı kanunlaştırma çalışmaları içindeki yeri incelenmiştir. Çünkü, Osmanlı Nafaka Kanunu taslağının bizzat kendisi tarafindan hazırlanmış olması onun ilmî birikimine işaret etmektedir. Nafaka kanunu taslağı Kitâbu 'n-Nafakût ve Mecelle' de yer almayan istihkak konusunda telif ettiği Risâletu 7 İstihkak, kananlaştırma çalışmalarının örnekleridir. Üçüncü bölümde ise eserleri tanıtılmıştır. Eserlerinin İslâm hukuku tahsilinde önemli katkıları olduğu hiç şüphesizdir. Özellikle Dureru'l Hukkâm'ın Mecelle'nin tedrisinde belirgin bir yeri vardır. Bu bölümde, aynca makalelerinin neşredildiği Ceride-i Adliye'nin sayı numaraları ve tarihleri verilmiştir. Bu çalışmanın sonuç bölümünden sonra konumuzu teşkil eden şahsiyetin nüfus kayıt sureti ve yazma eserlerinden bazı varak örnekleri sunulmuştur. Tezin sonunda araştırmanın kaynaklar listesi yer almaktadır. ıx"
