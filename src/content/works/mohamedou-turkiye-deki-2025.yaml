abstract: "Bu tez, Türkiye'de sunulan İslam iktisadı ve finansı lisansüstü programlarının, ülkede öğrenim gören uluslararası öğrencilerin bakış açısıyla değerlendirilmesini amaçlamaktadır. Son yıllarda Türkiye, İslam iktisadı ve finansı alanında uluslararası bir önem kazanmış ve bu alanda lisansüstü eğitim olanakları sunmaya başlamıştır. Ancak, söz konusu programların uluslararası öğrenciler tarafından nasıl algılandığı ve katılımcıların eğitimin kalitesi, içeriği ve öğretim yöntemlerine ilişkin görüşleri daha önce sistematik olarak araştırılmamıştır. Bu çalışma, Türkiye'deki farklı üniversitelerde İslam iktisadı ve finansı lisansüstü programlarına devam eden uluslararası öğrencilerin deneyimlerini anlamak ve değerlendirmek amacıyla nicel araştırma yöntemlerini kullanacaktır. Araştırma, farklı ülkelerden öğrencilerin katılımıyla yürütülecek anketler aracılığıyla, öğrencilerin programlarla ilgili memnuniyet düzeylerini ve algılarını kapsamlı bir şekilde ortaya koymayı hedeflemektedir."
