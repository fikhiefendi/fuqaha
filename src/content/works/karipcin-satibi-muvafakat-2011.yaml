abstract: "Bu çalışma, Endülüs'ün meşhur alimlerinden Ebu İshak eş-Şatıbi'nin (ö. 790/1388) ?el-Muvafakat? çerçevesinde hadis ve sünnet anlayışını tespit amacıyla hazırlanmıştır.Çalışma, bir giriş ve dört bölümden oluşmaktadır. Giriş kısmında, çalışmanın konusu, amacı, önemi, yöntemi ve kaynaklarından bahsedilmiştir.Birinci Bölüm'de, eş-Şatıbi'nin hadis ve sünnet anlayışına büyük etkisi sebebiyle, onun içinde yetişmiş olduğu Endülüs, tarihi arka planıyla tanıtılmıştır.İkinci Bölüm'de, yine eş-Şatıbi'nin düşünce sistemini oluşturan temel unsurları daha iyi anlayabilmek için, onun hayatı, hocaları, talebeleri, eserleri ve ilmi şahsiyeti incelenmiştir.Üçüncü Bölüm, eş-Şatıbi'nin hadis ve sünnet anlayışını oluşturan temel kavram ve unsurlara ayrılarak, bu konudaki fikirleri sistematik ve bütüncül olarak sunulmaya çalışılmıştır.Dördüncü Bölüm'de, eş-Şatıbi'nin hadis ve sünnet anlayışında önemli bir yeri olan sünnetin Kitab'la ilişkisi incelenmiştir. Sonuç kısmında ise, araştırma ile ulaşılan bilgilere yer verilmiştir."
