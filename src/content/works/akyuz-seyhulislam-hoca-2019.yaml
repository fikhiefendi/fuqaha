abstract: "XVI. yy Osmanlı şeyhülislâmlarından biri olan Hoca Sâdeddin Efendi, 1536'da Kanuni Sultan Süleyman zamanında İstanbul'da dünyaya gelmiş ve saray merkezli iyi bir tahsil görmüştür. Hoca Sâdeddin Efendi'nin önemli bir ilim adamı olması ile birlikte padişah hocası olması bazı zamanlarda idarede etkili olmasına imkan sağlamıştır. Sâdeddin Efendi 1598'de Üçüncü Mehmed döneminde şeyhülislâm olmuş, 1599 yılında da vefat etmiştir. Hoca Sâdeddin Efendi'nin şeyhülislâmlığı sırasında verdiği fetvalardan oluşan Fetva Mecmuası'nın tespit edebildiğimiz tek nüshası vardır. Mecmua'da kimi zaman sonraki dönem şeyhülislâmlarına ait fetvalara yer verilmiş olması, Mecmua'nın Hoca Sâdeddin Efendi'nin vefatından sonra oluşturulduğunu göstermektedir. Bununla birlikte Mecmua'nın müstensihi bilinmemektedir. Fetva Mecmuası'nda yer alan“Kitâbü'l-kerâhiyye ve'l-istihsân”bölümünde yemin, nikah, talak, ilim, mahkeme, mali muamelat, gayr-i Müslimlerle ilişkiler gibi pek çok konu bulunmaktadır. Bölüm konularının geniş kapsamlı olması döneminin siyasi, ictimai, askeri, ekonomik vb. özelliklerine ışık tutmaktadır. Ayrıca Mecmua'nın ilgili bahsinin daha önceki asırlarda oluşturulan muteber fetva kitaplarındaki fetvalarla mukayesesi, farklı dönemlerde benzer konularda verilen fetvalardaki benzerlik ile zamanın değişmesiyle fetvadaki değişimi göstermesi açısından önem arz etmektedir."
