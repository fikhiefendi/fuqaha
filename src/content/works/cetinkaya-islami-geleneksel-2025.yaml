abstract: "Bu çalışma, çevresel, sosyal ve yönetişim (ESG) faktörlerinin İslami ve geleneksel bankacılığın finansal performansı üzerindeki etkisini karşılaştırmalı olarak incelemektedir. Çalışmanın temel hareket noktası, maliyet-gelir oranı ve risk-getiri dengesi gibi geleneksel verimlilik göstergelerinin, sürdürülebilirlik odaklı küresel ekonomide bankaların dayanıklılığını, paydaş güvenini ve kurumsal meşruiyetini açıklamakta yetersiz kalmakta olduğudur. Bu doğrultuda, ESG kriterlerinin bankaların performansını değerlendirmede daha bütüncül bir yaklaşım sunup sunmadığı araştırılmaktadır. Ayrıca, İslami bankalar açısından ESG uygulamalarının ölçülebilir avantajlar sağlayıp sağlamadığı ve Şer'i esaslara dayalı yükümlülüklerin bu süreci nasıl etkilediği tartışılmaktadır. Belirtilen araştırma sorularını yanıtlamak amacıyla hipotez temelli bir araştırma tasarımı benimsenmiştir. Bu kapsamda dinamik panel Sistem Genelleştirilmiş Momentler Yöntemi (Sistem-GMM) uygulanmaktadır. Çalışmada kullanılan veri seti, 2015–2023 dönemini kapsamakta ve dokuz ülkeden 118 bankaya ait verileri içermektedir. Bu durum, metodolojik tutarlılığın korunmasına ve uluslararası karşılaştırmaların yapılabilmesine olanak sağlamaktadır. Ayrıca, Arellano-Bond AR (1) ve AR (2) testleriyle Sargan ve Hansen geçerlilik testleriyle, kurulan modellerin ve kullanılan araçların güvenilirliğini doğrulanmıştır. Bulgular, ESG performansının bankaların finansal performansı üzerinde güçlü ve olumlu etkiler oluşturduğunu göstermektedir. Geleneksel bankalarda çevresel performans ve ESG açıklamalarının en belirleyici unsurlar olduğu buna karşın sosyal boyutun daha sınırlı bir etkiye sahip olduğu ve yönetişim faktörünün kısa vadede zayıf kaldığı tespit edilmiştir. İslami bankalarda ise çevresel, sosyal, yönetişim ve genel ESG performanslarının hem Varlık Getirisi (ROA) hem de Özsermaye Getirisi (ROE) üzerinde daha istikrarlı ve güçlü etkiler gösterdiği bulunmuştur. Bu durum, İslami finansın yapısal olarak ESG ilkeleriyle uyumlu bir çerçeve sunduğunu ortaya koymaktadır. Elde edilen sonuçlar, ESG'nin yalnızca bir ölçüm aracı değil aynı zamanda etik değerleri ve sürdürülebilirlik ilkelerini finansal performansla bütünleştiren bir paradigma dönüşümü olduğunu göstermektedir."
