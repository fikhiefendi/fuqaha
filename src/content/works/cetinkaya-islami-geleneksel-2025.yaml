title: "İslami ve Geleneksel Bankaların Finansal Performansı Üzerinde Çevresel, Sosyal ve Yönetişim (ESG) Faktörlerinin Etkisi: Dinamik Panel Veri Analizi ile Uluslararası Bir Karşılaştırma"
