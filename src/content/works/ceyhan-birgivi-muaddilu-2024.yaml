abstract: "Bu çalışma, İmâm Birgivî'nin namazdaki ta'dîl-i erkâna gösterilen ihmakarlığa ve gevşekliğe bir tepki amacıyla ele almış olduğu risâle olan Mu'addilü's-salât ve Niğdevî'nin Muvazzihu'l-Mu'addil Şerhu Mu'addilü's-salât ve Ebû'l-Hasan es-Sindî'nin Menhelü'l-hüdât adlı şerhleri çerçevesinde taʻdîl-i erkân hususunu ele almayı hedeflemektedir. Birgivî'nin avam ve havası ilgilendiren bu risâlesi, Hanefî mezhebinin taʻdîl-i erkân hakkındaki görüşlerini, tercihlerini ve muhtelif kavillerini içermektedir. 18. dönem alimlerinden Hanefî fakihi Niğdevî ve muâsırı Ebû'l-Hasen es-Sindî, alanında önemli bir boşluğu dolduran bu küçük hacimli risâleye şerh yazarak mezhebin tercih edilen görüşünü, farklı kavillerini kavme ve celsedeki taʻdîl-i erkânın hükmünü delilleriyle birlikte dile getirmişlerdir. Bu çalışmanın yazılmasındaki temel hedef, İmâm Birgivî'nin kıymetli risâlesinin yalnızca fürû fıkıh açısından değerlendirilmesi olmayıp, bu risâle ve şerhlerin İslâm hukuk metodolojisi açısından tahlil edilip değerlendirmeye tabi tutulmasıdır. Hanefî fakihi olan Muvazihu'l-Mu'addil şârihi Niğdevî, bu risâlenin daha iyi anlaşılması adına sarf, nahiv, belagât, akaid ve fıkıh usûlu konularına yer vermiş ve itmi'nâna dair geniş bir şerh kaleme almıştır. Niğdevî'nin namazdaki taʻdîl-i erkâna dair âyet ve hadisler ortaya koyarak meseleyi hem fürû hem de usûl açısından değerlendirmeye tabi tutması bu çalışmanın ana hedefini oluşturmuştur. Fâkih ve muhaddis bir alim olan Ebü'l-Hasen Sindî'de, itmi'nânla ilgili görüşlerini ortaya koymak adına Menhelü'l-Hüdât isimli risâleyi kaleme almış ve mezheb içerisindeki farz ve vâcip hükümleri, meşhur ve âhad haberin şartları üzerinden tahlil ederek izah etme yoluna gitmiştir. Rükû ve secdede taʻdîl-i erkânı yerine getirmenin farz olduğunu benimseyen Sindi, hem mezhepteki müftâ bih olan kavilden hem de İmam Birgivî'nin benimsediği görüşden farklı bir sonuca varmıştır. Niğdevî'nin Muvazzihu'l-Mu'addil'i ve Ebû'l-Hasen es-Sindî'nin Menhelü'l-hüdât'ı, taʻdîl-i erkânla alakalı bu küçük risâlenin geniş bir açıdan ele alınması ve meseleye ışık tutması açısından kıymeti büyük iki şerh olduğu söylenebilir."
