abstract: "Bu çalışma bankacılık sektörünün ekonomik büyüme üzerindeki etkisini katılım bankacılığı ve konvansiyonel bankacılık özelinde tespit etmek amacıyla yapılmıştır. Çalışmanın ilk bölümünde bankacılık sistemi incelenmektedir. Bankacılığın teorik temeli, tarihsel gelişimi ve temel fonksiyonları açıklanacaktır. Bunun karşında kar – zarar ve faizsizlik esasına dayanan ve çalışmanın ana konusunu oluşturan Katılım Bankacılığı sistemi ikinci bölümde yakın plana alınmakta, bu sistemin dayandığı temel ilkeler, fon toplama ve kullandırma yöntemleri ve kendisini karşısında konumlandırdığı olgu olan faiz mefhumu incelenmektedir. Çalışmanın üçüncü bölümünde bankacılığın büyüme ile olan ilişkilerine bakılarak, bu konuda yapılmış olan ampirik literatür özetlenmiştir. İktisat literatüründe sıkça tartışılan“finansal gelişme mi ekonomik büyümeye etki eder yoksa ekonomik büyüme mi finansal gelişmeyi tetikler?”sorularına cevaben ortaya konan Talep Takipli, Arz Öncüllü Hipotez ve çift yönlü nedensellik kavramlarına değinilmiştir. Bu bağlamda Katılım Bankacılığı ve geleneksel bankacılık sistemleri ile ilgili dünyada yapılmış çalışmalar incelenecek, varılan sonuçlar özetlenecek ve Türkiye'de bu bankacılık türlerinin ekonomik büyümeye ne gibi katkılar sunduğu yahut sunabileceği niteliksel olarak anlatılmaya çalışılacaktır. Aynı zamanda bu konuda yapılan diğer ampirik çalışmalara ait araştırma metodolojileri tablo yardımıyla tasnif edilmiştir. Çalışmanın son bölümünde ise Türkiye'de Katılım Bankacılığının ve Konvansiyonel bankacılığın çeyrek dönemlik verileri ile özel sektöre kullandırdığı kredilerin iktisadi büyüme üzerindeki etkileri ekonometrik modellerle analiz edilmiştir. Çıkan sonuçlara göre politika önerileri üretilmiş ve yapılacak olan diğer çalışmalar için fikirler beyan edilmiştir."
