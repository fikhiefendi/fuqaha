abstract: "Osmanlı tarihinin ana kaynakları arasında olan şer'iyye sicilleri diğer adıyla kadı sicilleri, kadılar tarafından tutulan defterlerdir. Bu siciller sayesinde Osmanlı Devleti idaresindeki bir şehrin sosyal, siyasi, iktisadȋ, askerȋ vs. tarihi ile ilgili önemli bilgiler elde edilir. Birinci elden kaynak olan kadı sicilleri incelenmeden Osmanlı'nın sosyal, siyasi, iktisadi, askeri, adli vs. durumu hakkında araştırma yapmak çok mümkün değildir.“37 Numaralı Ayntab Şer'iyye Sicili'nin Transkripsiyonu ve Değerlendirilmesi (H.1098-1100/ M.1686-1689. s. 98-190)”isimli tezimizde 98 - 190 sayfa aralığının transkripsiyonu yapılmış ve tespit edilen 209 belgenin özeti çıkartılarak konulara göre değerlendirilmesi yapılmıştır. Özellikle Gaziantep şehir tarihinin aydınlatılmasına ve daha sonra şehir tarihi çalışan araştırmacılara önemli katkılar sağlayacaktır."
