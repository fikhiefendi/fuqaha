abstract: "Aile, toplumun en temel birimi ve yetişecek yeni neslin ilk eğitimini aldığı ortamdır. Evlilikle birlikte kadın ve erkek için bazı hak ve sorumluluklar doğmaktadır. Kanun koyucular, bu hak ve sorumluluklar hakkında yasal düzenlemeler yapmışlardır. İslam hukukunun temel kaynakları olan Kur'ân-ı Kerim ve sünnet ile fıkıh kitaplarında da bu konuda ayrıntılı düzenlemeler bulunmaktadır. Osmanlı Devleti'nde Tanzimat Dönemi sonrasında İslam hukukunun kaynakları ve âlimlerin ictihadları esas alınarak Osmanlı Hukûk-ı Âile Kararnâmesi (HAK) hazırlanmıştır. Evlenme ve boşanma konularını içeren Kararnâme bu özellikte hazırlanan ilk kanundur. Cumhuriyetin ilanı sonrasında hukuk alanında köklü değişiklikler yapılmıştır; bu çerçevede HAK yerine İsviçre Medeni Kanunu yürürlüğe konulmuş ve bu kanun esas alınarak zamanla Türk Medeni Kanunu (TMK) geliştirilmiştir. HAK ile TMK'nın evlilikle ilgili hükümleri arasındaki benzerlikler ile farklılıkları ortaya koymak üzere yaptığımız bu çalışmada her iki kanunun büyük ölçüde benzerlik gösterdiği tespit edilmiştir. Bununla birlikte mehir, nafaka ve evlatlık gibi konularda önemli farklılıkların olduğu görülmüştür."
