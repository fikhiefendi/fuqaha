abstract: "Fukaha, şer'î nasların Şârî'in muradına muvafık surette anlaşılmasını temin edecek muhkem kâideler tayin etmişlerdir. Bu kâideler çoğu zaman soyut ve teorik nitelikte olduğundan mahiyetleri tam olarak kavranılamamaktadır. Bunun için bu kâidelerin tatbikî surette görülmeleri büyük önem arzetmektedir. Usûlî kâidelerin tatbikinin müşahede edilebileceği eserlerin başında ahkâm hadislerinin şerhleri gelmektedir. Ahkâm hadis şerhi literatürünün en güzide ve zikrettiğimiz hedefe hizmet eden misallerinden birisi İbn Dakīkul'îd'in İḥkâmü'l aḥkâm şerḥu ʿUmdeti'l-aḥkâm adlı eseridir. Çalışmamızda bahsettiğimiz probleme bir çözüm sunmak gayesiyle nasların tefsirinde esas alınan kâide ve esasları 'hadis-i şeriflerin şer'î hükme delâletleri' cihetiyle sınırlandırmak üzere teorik ve pratik olarak ele aldık. Çalışmanın teori kısmında hadis-i şeriflerden hüküm istinbatının şartlarından biri olan 'hükme delâletinin açık olması' şartı çerçevesinde bu husustaki usûlî meseleleri özet halde sunduk. Pratik kısmında ise İḥkâmü'l-aḥkâm şerḥu ʿUmdeti'l-aḥkâm üzerinden teori kısmında ele aldığımız soyut haldeki usûlî meselelerin müşahhas ve tatbikî suretlerini ortaya koymaya çalıştık. Çalışmanın hedeflerinden biri de İslam ulemasının fıkhî istinbatta esas aldıkları yöntemin derinlik ve metenâtini göstermek ve bu yönteme vâkıf olmadan fıkhî istinbatın yapılamayacağını okuyucuya hissettirmektir. Ayrıca İbn Dakīkul'îd'in ele alınan usûl konularına dair görüş ve tercihlerini tespitte çalışmanın amaçları arasındadır."
