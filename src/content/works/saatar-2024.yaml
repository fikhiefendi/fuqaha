abstract: "Bu çalışma, İslam ekonomisinde üçüncü sektör kavramını ve onun ayırt edici özelliklerini İslam ekonomik sistemi ve bileşenleri çerçevesinde tanıtmayı ve üçüncü sektörün ekonomik, sosyal, politik ve kalkınma açısından rolünü netleştirmeyi amaçlamaktadır. Yemen'de üçüncü sektörün gerçekliğini, finansman kaynaklarını ve karşılaştığı en önemli engelleri analiz ederek, üçüncü sektörün katkı sağlamadaki rolünü açıklamaktadır. Çalışmada Yemen'de gerçekleşecek yeniden yapılanmada, genel olarak üçüncü sektörü, bileşenlerini ve özelliklerini, özel olarak ise Yemen'deki üçüncü sektörü incelemek için tümevarımsal yaklaşım, Yemen'deki üçüncü sektörün gerçekliğini ve en önemli kısmını açıklığa kavuşturmak için tanımlayıcı yaklaşım kullanılmıştır. Ayrıca önemli sorunlar, Finansman kaynakları, üçüncü sektör gerçeği röportajlar ve Yemen'de faaliyet gösteren yerel ve uluslararası kuruluşların raporları ve Birleşmiş Milletler'in küresel raporları aracılığıyla analiz edilmesiyle, Yemen'deki sektör hakkında birçok sonuca ulaşılmıştır. Bunlardan en önemlileri: Üçüncü sektör ise kar amacı gütmeyen bir sektör olan sosyal sektördür. Aynı zamanda hür iradeyle kurulmuş olup hukuken tüzel kişilik olarak kabul edilmiştir. Üçüncü sektörün bileşenleri yalnızca hayır kurumları ve derneklerle sınırlı olmayıp, siyasi partiler, sendikalar, araştırma ve çalışma merkezleri ve kurumları da içermektedir. Yemen'deki üçüncü sektör kuruluşları kaynak sıkıntısı çekmekte olup, artan ihtiyaçlar ışığında, ağırlıklı olarak uluslararası kuruluşların desteğine ve bireylerden gelen bağışlara güvenmektedirler. Yemen'deki üçüncü sektör kuruluşları güvenlik engelleriyle karşı karşıya kalırken, üyeleri öldürülürken ve tutuklanırken ve ofisleri yağmalanıp kapatılırken, çoğu proje ve program yardım yönüne odaklandığından kimlik ve sosyal doku güçlendiriliyor ve aralarında ulusal güçlenme zayıflığı ortaya çıkıyor. Yemen'deki üçüncü sektör kuruluşları altyapının restorasyonuna katkıda bulunmaktadır. Bazı üçüncü sektör kuruluşları her alanda projelerin yeniden yapılandırılmasına katkıda bulunarak devlet kurumlarının geliştirilmesine ve idari kadroların yetiştirilmesine katkıda bulunurken, bazı kuruluşlar da yeni ortaya çıkan üçüncü sektör kuruluşlarının rehabilite edilmesine katkıda bulunuyor."
