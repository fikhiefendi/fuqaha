abstract: "Küresel ekonomideki karmaşıklık göz önüne alındığında, güçlü bir bankacılık sistemi ve finansal altyapı, ekonominin sürdürülebilir büyümesi ve istikrarı için hayati öneme sahiptir. Bankacılık sistemi, tasarrufları değerlendirerek ekonomiye likidite sağlamakta, kredi imkânı sunarak işletmelerin büyümesini ve bireylerin ihtiyaçlarını karşılamayı desteklemektedir. Katılım bankacılığı, özelde İslam dünyasında genelde ise tüm dünyada giderek ilgi gören ve finans sektöründeki payı giderek artış göstermektedir. Dolayısıyla katılım bankalarının cazip yönlerinin ve farklı yönlerinin hedef kitleye doğru aktarılması ve toplum tarafından geri dönüşlerinin doğru değerlendirilmesi gerekmektedir. Yapılan taramalar sonucunda bu konu ile ilgili yurt içinde yapılan araştırmaların çok sınırlı olduğu ve toplum tarafından bilinirliğinin ve farkındalığının yetersiz olduğu sonucuna ulaşılmıştır. Bu araştırma katılım bankacılığı ile ilgili farkındalığın arttırılmasına katkı sağlaması önemli çıktıları arasında yer almaktadır. Araştırmada eğitim örgütleri çalışanlarının katılım bankacılığı faaliyetlerine bakış açılarının genel algı, hizmet kalitesi algısı ve finansal algı boyutlarında tespit edilmesi, ikinci olarak; genel algı boyutunun, hizmet kalitesi algısı ve finansal algı boyutu üzerinde etkisinin olup olmadığı ortaya konulması, üçüncü olarak; genel algı, hizmet kalitesi algısı ve finansal algı arasındaki ilişkinin tespit edilmesi amaçlanmıştır. Araştırma verileri anket yöntemi ile elde edilmiştir. Anket formu bu araştırma kapsamında hazırlanmış olup pilot çalışma ile ölçeğin geçerlilik ve güvenirliliği tespit edilmiştir. Anket formu demografik değişkenler, genel algı boyutu, hizmet kalitesi algısı boyutu ve finansal algı boyutu olmak üzere dört bölümden oluşmaktadır. Araştırma verileri Bingöl il sınırları içinde görev yapan 395 öğretmenden kolayda örneklem yöntemi ile elde edilmiştir. Araştırma kapsamında yapılan analizler neticesinde genel algı boyutunun, hizmet kalitesi algısı ve finansal algı boyutu üzerinde pozitif yönde anlamlı bir etkisinin olduğu tespit edilmiştir. Genel algı boyutu, hizmet kalitesi algısı ve finansal algı boyutları arasında pozitif yönde anlamlı bir ilişki olduğu tespit edilmiştir."
