abstract: "IX. yüzyılda genelde İslam, özelde ise fıkıh düşüncesinin donuklaşma ve gerileme sürecine girdiği şeklinde baskın bir kanaat bulunmaktadır. Bu düşünce büyük ölçüde İslam'ın temel kaynaklarının makâsıdî (teleolojik) olmaktan ziyade lafzî (literal) bir yoruma tabi tutulmasıyla doğrudan ilişkilendirilmiştir. Bu bağlamda geleneğe hâkim olan lafzî yorum yaklaşımının, İslam dünyasının geride kalmasına neden olduğu iddia edilmiş, makâsıdî yoruma ise sık vurgu yapılarak ön plana çıkarılmıştır. Bu sâikle modern dönemde bazı araştırmacılar gâî yorumu bir çıkış yolu olarak görmüş, bu yöntemi içtihatta merkeze alarak lafzî yorumun/beyan içtihadının bir tarafa konulması gerektiğini ifade etmişlerdir. Bunlar kısaca usul ilminin bir kenara bırakılmasını, nass ile makâsıdın çatışması durumunda ise makâsıdın tercih edilmesi gerektiğini savunmuşlardır. Ancak bu düşüncenin birçok içtihadî ve hukukî probleme sebebiyet vereceğinden bu içtihat yönteminin delil değerini ve ilkelerini belirleme gereği doğmuştur. Buna binaen tezde, makâsıd içtihadının delil değeri, problemleri ve makâsıd içtihadının ilke ve sınırları tespit edilmeye çalışılmıştır. Neticede makâsıdın gayri mansûs meselelerde delil olduğu, bu yöntemle içtihat edilebileceği, ancak zaptı sağlanmadığı takdirde İslam hukukunun formel ve normatif yapısına zarar vereceği, makasıd içtihadının bir takım ilke ve sınırlarının bulunduğu görülmüştür. Bu çalışmanın birinci bölümünde makâsıdın, tarihi serüvenine, dayandığı temel kavramlara ve kısımlarına değinilmiştir. İkinci bölümde içtihat yöntemleri, makâsıd içtihadının delil değeri ve ilkeler belirlenmeden başvurulan içtihadın doğuracağı hukuki problemler ele alınmıştır. Üçüncü bölümde ise içtihat/yorum ilkeleri, makâsıd içtihadını sınırlayan deliller, bu yöntemin genel ve özel ilkeleri konularına göre incelenmeye çalışılmıştır."
