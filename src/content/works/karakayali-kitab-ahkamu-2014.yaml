abstract: "Merkezî Oğuz Türkçesi döneminde kaleme alınan Türkçe eserlerde en çok işlenen konuların başında dinî-ahlakî muhtevalı olanlar gelir. Çalışmamıza konu olan“Ahkâmü'l-Akâyid”adlı eser de XV. yüzyılın son çeyreğinde halk için yazılmış bir fıkıh kitabıdır. Çalışmamızda söz konusu eserin 180b-247. varaklarının Dilbilgisi İncelemesi, Çeviri yazılı Metni, Metnin Türkiye Türkçesine Aktarımı, Dizin ve Tıpkıbasımı yapılacaktır. Eserin tespit edebildiğimiz tek nüshası Revan 648 kayıt numarası ile Topkapı Sarayı Yazma Eserler Kütüphanesi'nde yer almaktadır. Söz konusu eser üzerinde ilk çalışma Mimar Sinan Güzel Sanatlar Üniversitesi Eski Türk Dili Lisansüstü öğrencisi Kürşat KARTAL tarafından 2014 yılında Lisansüstü tezi olarak sunulmuştur."
