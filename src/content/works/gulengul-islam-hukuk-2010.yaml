abstract: "Temel İslam Bilimleri'nin ve özellikle İslam Hukuku'nun temel kaynaklarından olan Kitap ve Sünnet'in rivayet yoluyla bize ulaşmış olması, bu ilimlerin ?haber? konusuna özel olarak eğilmesine ve bu ilimlere özgü bir ?haber felsefesi?nin inşa edilmesine neden olmuştur. İçtihat kapısının kapandığı iddia edilen dönemlere kadarki süreç içerisinde İslam Hukuku'nun nasıl bir dinamizm kazandığının tespit edilmesi, büyük ölçüde fukahanın ortaya koymuş olduğu haber anlayışının incelenmesine bağlıdır.Bu çalışmada; İslamî ilimler açısından genelde haberlerin, özelde haber-i vahidlerin bilgi değeri ile uygulama değeri, kabulüne etki eden unsurlar, hangi şartlarda ve hangi koşullarda delil kabul edildiği; kölenin, kafirin, fasığın, âdilin, meçhul ravinin, sabinin ve heva sahibi olan bir kişinin verdiği haberlerin İslam Hukuku'ndaki değeri ve sonuçları anlatılmaya çalışılmıştır."
