abstract: "Bu çalışma, Etiyopya'daki İslami finans düzenlemelerine ilişkin konuları incelemektedir. Nitel bir yöntem kullanılarak, ülkedeki İslami finans mevzuatı ve mevcut düzenleyici çerçeveler ile İslami finans kuruluşlarının karşılaştığı zorluklar araştırılmıştır. Çalışmada, İslami bankacılık sisteminde görev yapan yönetici ve uygulayıcılar, şeriat kurulu üyeleri ve ülke mevzuatına hâkim hukukçular dahil olmak üzere 10 katılımcıyla yarı yapılandırılmış mülakatlar gerçekleştirilmiştir. Sonuçlar, İslami finansın kendine özgü özelliklerine uygun kapsamlı ve sağlam bir düzenleyici çerçevenin acilen oluşturulması gerektiğini ortaya koymaktadır. Şeriat uyumunun sağlanması için düzenleyici yönetişimin iyileştirilmesi hayati önem taşımaktadır. Ayrıca, ampirik bulgularımız, İslami finans kuruluşlarını denetlemek üzere Etiyopya Ulusal Bankası bünyesinde ayrı bir denetim organı kurulmasının gerekliliğini vurgulamaktadır. Son olarak, çalışma, İslami finans alanında nitelikli profesyonellerin ve şeriat alimlerinin rolünün önemini ortaya koymaktadır. İslami finans eğitiminin üniversitelere entegre edilmesi, düzenleyiciler, alimler ve bankacılık profesyonelleri için kapasite geliştirmeyi destekleyecektir."
