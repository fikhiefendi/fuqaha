abstract: "Vekâlet akdi, fıkıh açısından, bir kişinin başka birine kendi adına işlem yapma yetkisi veren hukuki bir sözleşmedir. Kişinin kendi tasarruflarını gerçek-leştirirken tecrübesizlik, bilgi eksikliği, zaman kısıtlılığı gibi sebeplerle işlerini başkasına devretme ihtiyacı doğabilir. Bu durumda, vekâlet sözleşmesi aracılı-ğıyla işin ifasını belirlediği vekilden talep eder. Sözleşme gereği, vekil ve müvekkil arasında bir borç ilişkisi oluşur. Bu tezin amacı, İslam hukukunda vekâlet sözleşmeleri hakkında bilgi verdikten sonra H. 1326/ M. 1908 yılında İzmir Kâdılığı tarafından tanzim edilen 94 Numaralı Şer'iye Sicilinde yer alan vekâlet sözleşmelerini fıkıh sistematiği açısından değerlendirmektir. Çalışmamız üç bölümden oluşmaktadır. İlk bölümde, İslam hukuku açı-sından vekâlet akdinin tanımı, meşruiyeti, rükünleri, şartları, hükümleri ve ta-rafların yükümlülüklerinden bahsedilerek vekâlet konusunun sınırları belir-lenmiştir. İkinci bölümde, Şer'iye Sicilleri ve İzmir 94 Numaralı Şer'iye Sicili hakkında bilgiler sunulmuş ve tezimizin konusu olan sicil tanıtılmıştır. Sicil def-terinde ağırlıklı olarak yer alan vekâlet kayıtları özetlenmiş ve konunun anlaşıl-masına katkı sağlamak amacıyla değerlendirilmiştir. Üçüncü bölümde ise, 94 Numaralı sicilin Latin harflerine çevrilmiş metni sunulmuştur."
