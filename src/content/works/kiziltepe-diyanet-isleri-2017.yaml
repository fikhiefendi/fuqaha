abstract: "Dünyada son elli yılda yaşanan global finansal krizler faizli bankacılık sistemini sorgulanır hale getirmiş, altarnetif arayışlar içerisinde bulunan ülkeleri de daha sağlam olan katılım bankacılığını gündemlerine almalarını sağlamıştır. Tüm ilahi dinlerin tahrif edilmemiş genel prensipleri ile örtüşen ve özellikle İslam dininin yasaklamış olduğu faizden uzak kalarak, üretime ve ülke ekonomisine büyük katkısı olan katılım bankalarının geleneksel finansal sistem içerisindeki yerlerini korumaları, aynı zamanda özellikle Müslüman halkın yoğun olarak yaşadığı yerlerde daha da büyümeleri gerekmektedir. Nüfusunun %99'u Müslüman olan Türkiye'de bu konuda temel görevi“İslam Dininin inançları, ibadet ve ahlak esasları ile ilgili işleri yürütmek, din konusunda toplumu aydınlatmak…”(TBMM 1965) misyonu çerçevesinde toplumun çok geniş bir kesimine hitap eden, gerektiğinde onları yönlendirebilen Diyanet İşleri Başkanlığı üstlenmiştir. Faizsiz bir sitemin oluşması ve sürdürülmesinde de halkla iç içe olan Diyanet personelinin etkisi çok önemlidir. İslam ekonomisi ve faiz konusunda gerekli bilgi donanımına ve hassasiyete sahip olan Diyanet personelinin faizsiz bir sitemin tesisinde büyük bir etkisi olacaktır. Ülkemizde katılım bankalarının hizmetlerini ve ürünlerini tercih etmelerini etkileyen faktörleri araştırmaya yönelik yapılan bilimsel çalışmalar oldukça çoktur. Ancak, toplumun büyük çoğunluğunca değer verilen ve rol model olarak örnek alınan din adamlarının İslam Ekonomisi ve Katılım Bankacılığı algısına ve faiz hassasiyetine dair yapılan akademik çalışmaların sayısı ise yok denecek kadar azdır. İşte bu çalışmanın amacı literatüre bir miktar da olsa katkıda bulunmaktır. Bu hedefe ulaşmak için katılım bankaları ve faiz hakkında verilecek genel bilgiden sonra Diyanet personelinden Sakarya İlinde görev yapanlar arasından örnek kütle alınmıştır. Örnek kütleye anket tekniği uygulanarak veri toplanmıştır. Toplanan veriye açıklayıcı faktör analizi uygulanmıştır. Dördüncü bölümde bu analizin sonuçlarına yer verilmiştir."
