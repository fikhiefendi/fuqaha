abstract: "Şer'iyye Sicilleri, Osmanlı şer'i mahkemelerinde kadılar tarafından görülen davaların kayıt altına alınmasıyla oluşturulan defterlerdir. Bu defterlerde yer alan belgeler içerik bakımından oldukça zengindir. İ'lâm, marûz, mürâsele, hüccet, ferman, buyruldu, mektup ve tezkire gibi farklı türde vesikalar sicillerde kayıtlıdır. Dolayısıyla şer'iyye sicilleri, Osmanlı tarih araştırmalarında başvurulan temel kaynaklar arasında yer almaktadır. Şehir tarihleri incelenirken ana kaynak niteliği taşıyan bu siciller, 15. yüzyılın ilk yarısından 20. yüzyılın ilk çeyreğine kadar tutulmuştur. Bu çalışma, 1864-1874 yıllarını kapsayan 95 Numaralı Amasya Şer'iyye Sicili'nin transkripsiyonunu esas almıştır. Sicilin incelenmesiyle, Amasya'nın söz konusu dönemindeki idarî, içtimaî, kültürel ve malî yapısına ilişkin bilgilerde elde edilmiştir. Özellikle borç ve alacak davaları, miras ilişkileri, eşler arasındaki mali haklar ve sulh uygulamaları üzerinden dönemin hukukî ve sosyal işleyişine dair önemli veriler ortaya konmuştur. 95 Numaralı Amasya Şer'iyye Sicili (H.1283-1290 / M.1866-1874, sayfa: 308-382), transkripsiyon, tahlil ve tasnif yöntemleriyle değerlendirilmiş; dönemin hukukî süreç, toplumsal ilişkileri ve mali uygulamaları hakkında kapsamlı bir değerlendirme yapılmıştır."
