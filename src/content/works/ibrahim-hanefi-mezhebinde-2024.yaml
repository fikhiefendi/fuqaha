abstract: "İslâm hukukuna göre vesâyet, fiil ehliyeti olmayan veya eksik olan kişilerin haklarını ve çıkarlarını koruma amacı taşıyan bir kurumdur. Bu, özellikle küçük çocuklar veya akıl hastalığı nedeniyle fiil ehliyeti bulunmayan bireyler için geçerlidir. Bu çalışma, İslâm hukukundaki vesâyet kavramını Hanefî mezhebi perspektifinden derinlemesine incelemeyi amaçlamaktadır. Bu kapsamda Hanefî fıkıh kaynaklarına odaklanılmıştır. Klasik ve modern literatürde var olan önemli ve muteber eserlerin incelenmesiyle vesâyetin kavramsal çerçevesi daha net bir şekilde ortaya konulmuştur. Çalışmamız giriş ve üç bölümden oluşmaktadır. Çalışmanın ilk bölümünde vesâyet kavramının tanımıyla başlanmış, ardından vesâyetin diğer hukuki tasarruflarla ilişkisi, önemi, amacı ve meşruiyeti üzerinde durulmuştur. İkinci bölümde vesâyetin unsurları ve şartları detaylı bir şekilde açıklanmış ve incelenmiştir. Üçüncü ve son bölümde ise vasî'nin tasarruf yetkisi, sorumluluğu, vesâyeti gerektiren sebepler ve vesâyetin sona ermesi gibi konular ele alınarak, vesâyetin işleyişi ve sonlanma süreçleri detaylı bir şekilde incelenmiştir. Eldeki çalışmada Hanefî fıkhının vesâyet konusundaki yaklaşımlarının detaylı bir analizi yapılmıştır. Hanefî mezhebi âlimlerinin vesâyet konusundaki görüşleri titizlikle karşılaştırılmış ve ortak noktalar ile farklılıklar vurgulanmıştır. Bu karşılaştırma ve analiz, Hanefî mezhebinin vesâyet konusundaki genel eğilimlerini ve hukuki yaklaşımlarını daha derinlemesine anlamamıza olanak sağlamaktadır."
