abstract: "Bâkillâni fıkıh ilmindeki başarısıyla devlet adamlığı ile usûl konusundaki birçok görüşleriyle günümüze kadar etkilerini sürdürmüş önemli İslâm âlimlerinden biridir. Bâkıllânî, Ebu Musa Al Eşari`nin ölümünden sonra Eşari Mezhebi'nin sistematize edilmesindeki önemli katkıları sebebiyle sadece fıkıh disiplini bakımından değil kelam ilmi açısından da mümtaz İslam âlimleri arasında yer almıştir. Hatta bu durum dikkate alındığında onun kelamcılık yönünün fıkıhçılık yönüne ağır bastığını rahatlıkla ifade etmek mümkündür. Bâkillâni'nin döneminde uyguladığı yöntemler halen Eş'ari mezhebi tarafından uygulanmaktadır. Ancak Bâkillâni'nin İslâm Hukuku'nun Nassa Dayanmayan Kaynakları? hakkındaki görüşlerine yoğunlaşmamız sebebiyle Tezimizde Onun Usûl-i fıkıh ile ilgili görüşlerinin analizine ağırlık verilmiştir. Tezimiz üç bölümden oluşmaktadır. Birinci bölümde Bâkillâ'nin hayatı ve onun eserleri tanıtılmaya çalışılmıştır. Bâkillâni'nin fıkıh usulü ve fıkıhla ilgili birçok önemli eserleri olmasına rağmen bu yönüyle pek bilinmemektedir. Ayrıca bu konu ile bağlantılı olarak O'nun hocaları ve öğrencileri hakkında da bilgiler vermeye çalıştım.Tezimizin İkinci bölümde İslâm hukuku açısından önce kaynak kavramı hakkında genelş bir giriş yapılmış, bunun arkasından İslam hukukunun nassa dayanan delillerini oluşturması bakımından Kuran-ı Kerim, sünnet üzernde yoğunlaşmaya gayret edilmiştir.Tezimizin üçüncü bölümde İslâm hukukunun nassa dayanmayan kaynakları ve Bâkillâni'nin bu konuyla ilgili görüşleri değerlendirilmeye çalışılmıştır."
