abstract: "Tez çalışmamız Osmanlı son dönem kanunlaştırma faaliyetleriyle ortaya çıkan, II.Meşrutiyet dönemi fıkıh alanındaki tartışmaların ana konularından birini oluşturan diyanet ve kaza kavramları üzerinde yoğunlaşır. Tezimiz giriş ve iki bölüm halinde ele alınır. Giriş bölümü tez konumuzun önemi, tezin konusunun sınırlandırılması, sunumu ve tez araştırmasında izlenen metod ve yöntem hakkında bilgi verir, kaynaklara değinir. Birinci bölümde 'Kaza' ve 'Diyanet' kavramsal düzeyde, klasik fıkıh ve usul kaynaklarında yer aldığı şekliyle incelenir, tez konumuz çerçevesinde bazı ayrıntılara yer verilir. Bu bölümde başlıkla ilişkili hüküm teorisi ve fetva konuları ele alınır. İkinci bölüm, II. Meşrutiyet ve önceki dönem siyasi yapılanması tarihi arkaplanıyla birlikte ele alınarak diyanet-kaza ayrım sürecine yer verilir. II.Meşrutiyet dönemi kodifikasyon faliyetleriyle başlayan tartışmaların şekillendirdiği fıkhi yenileşme hareketlerine değinilir. Bu çerçevede düşünce dünyasının tanındık isimlerinin bu yenileşme hareketleriyle ortaya koyduğu metinler, diyanet ve kaza kavramıyla sınırlı tutulur. Ziya Gökalp, Halim Sabit, Mustafa Şeref, Mansurizade Said ve İzmirli İsmail Hakkı'nın kaleme aldığı diyanet ve kaza kavramlarını incelediği mecmualarda yayınlanan makaleleri mukayeseli bir şekilde analiz edilir."
