abstract: "Ahkâm tefsirleri, Kurân-ı Kerîm'de hüküm bildiren ayetleri açıklayan, İslam hukuku açısından önemli bir yere sahip olan eserlerdir. Bu çalışmada, hicri dördüncü yüzyılda yaşamış olan Hanefi fakihi Ebû Bekr el-Cessâs'ın, Ahkâmu'l Kur'ân adlı eserinde nikâhla ilgili ayetlere yaklaşımı ve bazı tercihleri ele alınmaktadır. Bu çalışma üç ana bölümden oluşmaktadır. Birinci bölümde Cessâs'ın yaşadığı dönemdeki siyasi, sosyal, ilmi ve kültürel durum ile birlikte, Cessâs'ın hayatı, ilmi kişiliği, kendisini yetiştiren hocaları, yetiştirdiği talebeleri ve eserleri ile ilgili bilgiler verilmektedir. Çalışmanın ikinci bölümünde ise, İslam Aile Hukukunun temel konularından olan nikâh konusu ana hatlarıyla ele alınmakta, Hanefi mezhebinin görüşleri temelinde yeri geldikçe diğer mezheplerin de görüşleri belirtilerek aktarılmaktadır. Çalışmanın esasını oluşturan üçüncü bölüm ise, Cessâs'ın Ahkâmu'l Kur'ân adlı eserinde ele aldığı nikâhla ilgili bazı meselelerdeki tercih ve yorumlarından oluşmaktadır. Bu bölümde müellifin nikâh akdini konu alan ayetler ile ilgili yorumları, yaptığı yorumlama işinde takip ettiği yöntem, ayetlerden hukukî sonuçlar çıkarma noktasında izlediği usûl ve ele alınan konularla ilgili görüşleri işlenmektedir. Ayrıca müellifin, ele alınan konu ile ilgili görüşleri, diğer bazı müctehid ve imamların görüş ve ictihadları ile karşılaştırılmaktadır."
