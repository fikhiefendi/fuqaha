abstract: "Yüce yaratıcı insanı yeryüzünde bedeniyle var etmiş ve bedenini kendisine bir süreliğine emanet etmiştir. Bu emanet süresi içerisinde bedenin kişi üzerinde hakları, kişinin de hem bu hakka dayalı olarak hem de tercihe bağlı olarak tasarrufları bulunmaktadır. Bedenin kişi üzerindeki haklarından biri ibadetin başı olan temizliğe dayalı bakımı ve bunun bedenî olan boyutudur. Kişisel bakım, tırnak, saç, sakal, vücut kılları gibi hem vücudumuzda çeşitli fonksiyonları olan hem de vücudun bir atığı olarak değerlendirilebilecek unsurlarla ilgili fıkhi kurallar bulunmaktadır. Günümüzde vücut temizliğiyle ilgili yeni uygulamaların ortaya çıkması yeni değerlendirmeleri gerekli kılmaktadır. Öte yandan sağlık teknolojisindeki yeni imkânlarla vücudun dış görünüşü üzerinde önemli müdahaleler yapılabilmektedir. Bu müdahalelerin fıkhi meşruiyeti tartışılmakta ve farklı değerlendirmelere konu olmaktadır. Beden temizliği ve beden üzerinde icra edilen estetik müdahaleler bu araştırmada İslam fıkhı açısından incelenecek ve değerlendirilmeye çalışılacaktır."
