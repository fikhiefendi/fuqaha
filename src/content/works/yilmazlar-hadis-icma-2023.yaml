abstract: "Şer'î deliller sıralamasında Kur'ân ve sünnetten sonra gelen icmâ, otoritesini İslâm ümmetinin dalâlet üzerinde birleşmeyeceği prensibinden almaktadır. Kur'ân'ın Mushaf haline getirilmesinde ve ashâbın sünnetten olan herhangi bir şeyi zâyi etmemesinde güçlü bir otoritesi bulunmaktadır. Bu tez icmâın, tarihsel süreçteki değişimini ve gelişimini göz önünde bulundurarak, sünnetin bir kısmını oluşturan hadisler üzerindeki etkisini ve fonksiyonunu tespit etmeyi amaçlamaktadır. Bu amaca matuf olarak çalışmanın konusu, İcmâın tarihsel sürecini, hadis-icma ilişkisini ve icmâa muhalif olduğu iddia edilen rivâyetleri ihtivâ etmektedir. Hemen hemen bütün İslâmî ilimler, icmâın güçlü otoritesinden yararlanmıştır. Klasik hadis usûlü ilminde icmâ müstakil olarak yer almamaktadır. Bununla birlikte hadis ilminin şerh, nâsih ve mensûh, ilel, cerh-ta'dîl ve mevzu hadis gibi pek çok alt dalında icmâa baş vurulmuştur. İcmâ, Hz. Peygamber'in (s.a.s.) vefatından sonra ilk asırlardan itibaren kimi zaman amel kavramıyla kesişerek hadislerin kabul ve reddinde etkili olmuştur. İcmâın bu etkisinin hadis ilminin gelişen sürecinde ne kadar devam ettiği; muhaddislerin ve fakîhlerin icmâın bu fonksiyonlarından ne ölçüde yararlandığı bu araştırmanın cevaplamaya çalıştığı sorulardır. Araştırmanın diğer bir sorusu, âlimlerin bir hadisi hangi koşullarda icmâa muhalif olarak değerlendirdikleri ve bunun neticesinde nasıl bir metod uyguladıklarını tespit etmektir. Ağırlıklı olarak hadisçi ve fakîhlerin yöntemleri yer almakla birlikte değerlendirilen icmâa muhalif hadis örneklerinden dolayı müfessirlerin ve kelâmcıların görüşlerine de yer verilmiştir. Araştırmanın ve soruların neticesinde, icmâın teoride ve pratikte farklı değerlendirildiği ortaya çıkmış; klasik hadis usûlünde yeri bulunmamakla birlikte kimi hadisçilerin uygulamalarında yer aldığı görülmüştür."
