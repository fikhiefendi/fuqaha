abstract: "Bu çalışmada temel amaç Türkiye'deki katılım bankacılığı kredi hacimlerinin geleneksel bankacılık kredi hacimlerine oranı ile ekonomik büyüme arasındaki nedensellik ilişkisinin incelenmesidir. Bu kapsamda 2005Q1-2020Q1 dönemlerini içeren çeyrek periyotlu katılım ve geleneksel bankacılık kredi hacimleri ile ekonomik büyümeyi temsilen Gayri Safi Yurt İçi Hâsıla verileri kullanılmıştır. Bu amaçla oluşturulan değişkenlerin tanımsal istatistikleri incelendiğinde serilerde yapısal kırılma bulgusu elde edilmiştir. Dolayısıyla yapısal kırılma sayısını tespiti için Bai-Perron Yapısal Kırılma testi uygulanmıştır. Test sonucunda elde edilen bulgulara göre serilerde iki yapısal kırılma tespit edildiğinden ikili kırılmalara müsaade eden Lee-Strazicich Birim Kök Testine yönenilmiştir. LS testi sonucunda ulaşılan bulgular dikkate alınarak tespit edilen birim kök yapısına uygun Toda-Yamamoto nedensellik testi uygulanmıştır. Yapılan Toda-Yamamoto nedensellik testi sonuçlarına göre katılım bankacılığı kredi hacimlerinin geleneksel bankacılık kredi hacimleri içinde payından ekonomik büyümeye doğru tek yönlü nedensellik ilişkisi tespit edilmiştir."
