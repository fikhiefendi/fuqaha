abstract: "16. Asır Osmanlı Dönemi Fetvalarında İmamlarla İlgili Hukuki Sorunlar ve Çözümleri adlı bu tezde imamların imâmetle ilgili görevleri, yetki ve sorumlulukları, devlet ve toplum hayatındaki yeri ve önemi fetva mecmualarından hareketle incelenmiştir. İmamda aranan şartlar ve imamlıkta liyakat şartları mezheplerin görüşlerinden yararlanılarak hükümlerin, durum ve şartlara göre nasıl yorumlandığı ifade edilmiştir. Fetvalar, imamların görevleri, sorumlulukları ve toplumsal konumları hakkında rehberlik sağlayan önemli kaynaklardandır. Araştırmada 16. asır şeyhülislâmlarından özellikle İbn Kemal (ö. 940/1534) ve Ebussuûd Efendi'nin (ö. 982/1574) fetvalarından konuyla ilgili iki yüze yakın fetva tespit edilerek imamların imâmetle ilgili durumları ve karşılaştıkları dini, hukuki, siyasi ve iktisadi sorunlar ortaya konulmaya çalışılmıştır. İmamların insan olmaları sebebiyle kendisi, görevi ve muhatap olduğu kişilerden kaynaklı hataları, kusurları ve eksiklikleri fetvalarda geçmektedir. Bu fetvalar kendi içinde tasnif edilerek onların ibadet, liyakat, aile, ceza, ticaret, vakıf, tasavvuf vb. alanlarıyla ilgili tutumları değerlendirilerek imam ve imâmet konusu anlaşılmaya çalışılmıştır. Şeyhülislâmlar fetvalara genellikle Hanefî mezhebine göre cevap vermiş, farklı durumlarla karşılaştıklarında ise diğer mezhepler ve maslahata uygun görüşü tercih etmişlerdir."
