abstract: "İktâ, bir gayrimenkulün rakabesi veya siyasi otoriteye ait bir hakkının kamu otoritesi tarafından şahıslara temliki olarak tarif edilebilir. Tarihi süreç içerisinde iktâ, iktâya konu olan nesnenin rakabesinin temliki; beytülmâlin, arazi üzerinde alacaklı olduğu verginin temliki ve beytülmâle ait gayrimenkulün menfaatinin temliki gibi farklı anlamlar ihtiva etmiştir. Memlükler döneminde iktâ, beytülmâle ait bir arazinin askerî sınıftan bir şahsa, zirai üretimde kullanılan akitler yoluyla gelir getiren işlemlere konu ederek faydalanacağı (istiğlâl) şekilde tahsis edilmesi anlamına geliyordu. Erken Memlükler döneminde Şâm bölgesinde iktâ arazileri hakkında ortaya çıkan bir tartışma üzerine askerlerin iktâlarını icâre, müzâraa gibi akitlerle işletmelerinin hukukî durumu fakihlerin gündemindeki yerini uzun bir süre korudu. Fakihlerin yeni bir mesele olarak karşılarında bulunan bu konu hakkındaki katkıları, onların dönemin iktâ pratiği hakkındaki tasavvurları yanında fıkha bakışları ve fıkhî üretim biçimine dair önemli ipuçları içermektedir. Hanefî mezhebi özelinde yapılmış bu çalışmada dönemin Hanefî fakihlerinin bu tartışmaya katkılarıyla iktâ ile ilgili diğer fetvâları üzerinden iktâ tasavvurlarını ve“Memlük Hanefîleri”olarak isimlendirdiğim dönem Hanefîliğinin yapısı, fıkhî değişimi yönetim biçim ve özellikleri ortaya konmaya çalışılmıştır. Bunun için ilk bölümde Memlükler dönemi Hanefîliğinin tarihi süreci ve özellikleri, ikinci bölümde fıkhî boyutları göz önünde tutularak iktânın tarihî süreci ve Memlük iktâ pratiği ve üçüncü bölümde Memlük Hanefîlerinin arazi mülkiyeti ve Memlük iktâsına dair yorum ve değerlendirmeleri incelenmiştir."
