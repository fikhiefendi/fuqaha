abstract: "En güncel haliyle 1990'lı yılların başında ülkemizde kurulmaya başlanmış tasarruf fi-nansman şirketleri uzunca bir süre kendine has yasal düzenlemelerden ari bir biçimde varlığını sürdürmüştür. Süregelen dönemde bu şirketlerin sayısı oldukça artmış bunun-la doğru orantılı olarak birçok müşteri mağduriyetleri meydana gelmiştir. Ülkemizdeki kuruluş felsefesi itibarıyla İslami finans sistemine uygun olarak müşterilerine faizsiz finansman sağlamayı amaçlayan bu sistem, kısaca kişilerin kolektif olarak birikim yapmaları ve bu birikimler sayesinde yine bu kişilerin finansmana ulaşmalarını sağla-yan bir yapı olarak karşımıza çıkar. 07.03.2021 tarihi itibarıyla yasal düzenlemeye ka-vuşan ve“tasarruf finansman”adıyla karşımıza çıkan bu sistemin temelini teşkil eden“tasarruf finansman sözleşmesi”, hem muhteviyatı hem de günümüzde birçok kişinin faizsiz finansman araçları sunan bu sözleşmeyi tercih etmesi sebebiyle çalışmamızın konusunu oluşturmuş ve adını vermiştir. Bu kapsamda çalışmamızda tasarruf finans-man sisteminin tarihçesi, İslam Hukuku açısından değerlendirmesi, tasarruf finansman kavramı, sistemin uygulamadaki durumu olumlu ve olumsuz yönleri ile ele alınmıştır. Ayrıca çalışmamızda tasarruf finansman sözleşmesi tüm yönleriyle detaylıca incelenmiş ve bu sözleşmenin benzeri sözleşmelerden farkları ortaya konulmuştur. Son olarak ise tasarruf finansman sözleşmesinin sona ermesi ve buna bağlanan sonuçları detaylıca ele alınmıştır."
