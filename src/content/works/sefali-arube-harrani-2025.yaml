abstract: "Hadis ilmi, İslam düşüncesinin temel yapı taşlarından biri olarak Müslüman toplumların dinî, ahlâkî ve sosyal hayatının şekillenmesinde önemli bir rol oynamıştır. Hadis rivayetlerinin güvenilir biçimde nesilden nesile aktarılması ve hadis metinlerinin titizlikle değerlendirilmesi, İslam geleneğinde ilmî bir disiplinin oluşmasını sağlamıştır. Bu ilim sahasının en önemli isimlerinden biri de hicrî III. asırda yaşamış olan Ebû Arûbe Hüseyn b. Muhammed b. Mevdûd el-Harrânî'dir. Bu tez çalışmasında, Ebû Arûbe el-Harrânî'nin hayatı, ilmî şahsiyeti ve hadis ilmine yaptığı katkılar ele alınmıştır. Ebû Arûbe'nin hadis rivayet yöntemleri, isnad zincirlerine verdiği önem, râvî değerlendirmelerindeki titizliği ve kullandığı eda lafızları incelenmiştir. Ayrıca eserleri üzerinden döneminin hadis anlayışı değerlendirilerek, onun hadis ilmine getirdiği yenilik ve metodolojik yaklaşımlar ortaya konulmuştur. Araştırma kapsamında klasik hadis kaynaklarının yanı sıra modern akademik çalışmalar da detaylı olarak taranmış, böylece Ebû Arûbe'nin hayatı, ilmî kişiliği ve hadis ilmindeki yeri incelenmiştir. Ebû Arûbe'nin hadis alanında olduğu kadar, ricâl, cerh ve ta'dîl, fıkıh ve kelâm ilimlerindeki birikimine de yer verilerek, çok yönlü bir âlim olduğu görülmektedir. Onun hadis rivayetindeki titizliği ve râvî değerlendirmelerindeki titizliği, günümüze ulaşan eserlerinden örneklerle ayrıntılı biçimde tahlil edilmiştir. Sonuç olarak Ebû Arûbe'nin hadis ilmine yaptığı katkıların sadece kendi dönemini değil, sonraki nesilleri de derinden etkilediği görülmüştür. Tez çalışması, Ebû Arûbe'nin ilmî kişiliğini, metodolojik yaklaşımlarını ve İslam ilmî mirasına katkılarını akademik bir yaklaşımla sunarak, hadis alanındaki çalışmalara yeni bir perspektif kazandırmayı amaçlamaktadır."
