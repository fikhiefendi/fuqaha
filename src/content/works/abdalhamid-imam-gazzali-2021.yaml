abstract: "Bilindiği gibi fıkıh usûlünde yer alan konularda istinbat esasdır. İmam Gazzâli Tahsînü'l-Meâhiz adlı kitabında fıkıh usûlünün birçok türünde ve alanında çok sayıda usûli görüşleri ele almıştır. Onun bu ele alışı, bu görüşlerin uygulanması ve istidlal yönteminin açıklanması anlamına gelmektedir. Bu durum da bu konunun önemini göstermektedir. Özellikle İmam Gazzâlî'nin fıkıh usûlü alanında muteber imamlardan birisi olması çalışma konusunun, bahsi geçen bu usûlî görüşlerini bir araya getirerek bunlar aracılığıyla istidlâl yöntemini açıklama şeklinde olmasınına karar verilmiştir. Çalışma alanı sadece bahsi geçen kitabın muâmelat bölümü ile sınırlı tutulmuş ve çalışmanan başlığı;“İmam Gazzâlî'nin Tahsînü'l-Meâhiz Kitabı Mâli Muâmelât Bölümünde Yer Alan Usûli Görüşleri”olarak seçilmiştir. Çalışma giriş, beş ana bölüm ve bunların alt başlıkları ile sonuç bölümünden oluşmuştur. Birinci bölümde fıkıh ve usûl kavramları açıklanmış, imam Gazzâlî ve kitabı Tahsînü'l-Meâhiz tanıtılmıştır. Geri kalan bölümlerde ise Gazzâli'nin Tahsînü'l-Meâhiz Kitabı Muâmelât Bölümünde Yer Alan ve sayısı yirmiye ulaşan usûl görüşlerinden ve uygulamalarından bahsedilmiştir. Bunlar şu başlıklar altında ele alınmıştır: 1- İttifak edilen delillerle alakalı usûl görüşleri, 2- İhtilaf edilen delillerle ilgili usûl görüşleri, 3- Dilsel usûl kâideleri ile ilgili usûl görüşleri, 4-Teâruz ve tercih ile ilgili usûl görüşleri. Bu alt başlıkların her birisi dörü kısımda ele alınmıştır: a) Meselenin anlamı, b) Tahsînü'l-Meâhiz kitabında yer alan fıkhi mesele c) Gazzâli'nin bahse konu usûli mesele ile ilgili metni, d) Tartışma ve çıkarım. Çalışma, araştırmacının ulaştığı en önemli sonuçların yer aldığı sonuç ve öneriler bölümü ile tamamlanmıştır."
