abstract: "Bu çalışmada; İslam düşünce tarihinde özellikle de fıkıh ve hadis alanlarında otorite kazanmış bir şahsiyet olan İmam Nevevi'nin -çeşitli eserlerinden derlediğimiz- Kur'an yaklaşımının genel çerçevesi çizilmiştir. Giriş bölümünde çalışmanın önem, amaç ve metodu kısaca açıklanmıştır. Birinci bölümdeyse öncelikle imamın yaşadığı dönemin; siyasi, sosyal ve kültürel özellikleri belirtilmiş, bilahare hayatı ve kendine özgü özellikleri; uyarıcı kişiliğine vurguda bulunularak zikredilmiştir. İkinci bölümde, ilk olarak Nevevi'nin rivayet yönü öne çıkan kelami ve fıkhi Kur'an okumaları ele alınmıştır. Usul çerçevesinde yer alabilecek kabulleri, Kur'an tarihine dair kanaatleri, hadisleri Kur'an'la yorumuyla, lügate dair değerlendirmeleri de yaklaşımındaki dirayet yönleri üst başlığı altında işlenmiştir. Kur'an'a bir ibadet ve ahlaki eğitim kitabı olarak yaklaşımıysa, taabbudi ve ahlaki içerikli yaklaşım başlığı altında daha çok düşünürümüzün iki meşhur eserinden yola çıkılarak oluşturulmuştur. Son olarak onun Kur'an öğretimine -artık unutulmaya yüz tutmuş bir yaklaşım tarzı olan- adab eksenli yaklaşımı, düşünürün o konuyla ilintili eserinden özetlenilerek aktarılmıştır."
