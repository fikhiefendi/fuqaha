abstract: "Bu çalışmada araştırmacı, İslam hukuku çerçevesinde bankacılık işlemlerini kontrol etmeyi amaçlayan İslami finans sektörüne ve ilgili Şeriat denetim standartlarına ışık tutmakta, daha sonra araştırmacı, fıkhî ve siyasi kurallara ve kontrollere dayalı olarak İslam hukukunun bu standartlar üzerindeki etkisinin boyutunu, ve sabitliğini, bekasını, sürekliliğini ve istikrarını nasıl sağlayabileceğini göstermeye çalışır. Araştırmacı ilk bölümde başlığın kelime dağarcığını tanımlayarak ve kelime dağarcığı arasındaki ilişkiyi göstererek, onu geçerliliğini destekleyici deliller sağlar, belirtilmesi kaçınılmaz olan farklılıkların bazı yönlerini detaylandırarak başlar, böylece kendisinden istenileni sağlayan kapsamlı bir birim haline gelir. İkinci, üçüncü ve dördüncü bölümlerde araştırmacı, standartların kavramı ve bunlarla ne kastedildiği ve yasal, idari veya davranışsal konulardan neleri ele aldıkları ile ilgili standartların üç bölüme ayrılmasını benimser. Araştırmacı, uygunluk, bağımsızlık, sorumluluk, merkezilik, tutarlılık, gizlilik ile şeffaflık arasındaki denge ve tam zamanlı çalışmaya adanmış gibi Şeriat standartlardan bahseder. ve bunların ne anlama geldiğini ve uygulamalarının en önemli koşullarını ve onun Şeriat kökenini gösterir, ve ardından fıkhî ve siyasi kural ve kontrolleri bunların standart üzerindeki etkilerini ve bunun en önemli uygulamalarını açıklar. Son bölümde araştırmacı, bu standartların uygulanmasında karşılaşılan en önemli zorlukları ve engelleri belirterek, pratik gerçeklikten meşruiyet standartlarına ışık tutuyor. İyileştirilmesi ve geliştirilmesi gereken en önemli eksiklikleri ve kusurları araştırmaya çalışmanın yanı sıra. Ulaşmaya geldiği ideal imaja ulaşmak için bu standartlara estetik bir dokunuş katabilecek bazı geliştirme yönleri veya pratik uygulamalı mekanizmalar önerir."
