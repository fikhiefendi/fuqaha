abstract: "Lehv Arapça bir kelimedir ve kapsam olarak oyun ve eğlenceyi içerir. ?Kişiyi ilgilendiği bir şeyden alıkoyan her şey? diye tanımlayabileceğimiz lehv, düğün, merasim, musiki, kumar olan-olmayan oyunlar, bedelli-bedelsiz oyunlar, atıcılık, binicilik, güreş ve bunlar gibi birçok oyun ve eğlence türünü bünyesinde barındırır.Hz. Peygamber (sav) zamanında pek yaygın olmayan lehv, günümüze yaklaştıkça hem çeşitlilik göstermiş hem de devlet eliyle destek görerek bir sektör haline gelmiştir. İslam hukuku alimleri bu konuda farklı görüşler ileri sürmüşlerdir. Genel olarak meşru bir amaca hizmet eden lehv mübah, kişiyi aslî görevlerinden alıkoyan ve günaha sevk eden lehv ise haram kabul edilmiştir. Bu anlamda mûsikî konusu da çok tartışılmakla birlikte belli kriterlerle mübah kabul edilmiştir.Anahtar Kelimeler; İslam Hukuku, Lehv, Oyun, Eğlence."
