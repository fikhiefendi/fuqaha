abstract: "Esitlik kavramına farklı bir bakıs açısıyla yaklasan slam hukuku, bu kavramınaltını kendine özgü ifadelerle doldurmustur. Esitlikten ziyade adalet prensibi üzerindeduran bu yaklasım, temel haklarda bütün insanları esit görürken, farklı yetenek vekabiliyetlerden kaynaklanan farklılasmayı da göz ardı etmemistir. Bu baglamda temelgaye hak edene hakkını teslimdir.Bazen bu hakkın tesliminde esitligi bozan unsurlar ortaya çıkmaktadır. Bunlar,cinsiyet, akıl, bilgi, sıhhat veya din ayrılıgı gibi faktörlerden kaynaklanabilir. Ortayaçıkan bu engellerde esitligi bozmak bir esitsizlik olabilir. Ancak her esitsizlikadaletsizlik degildir."
