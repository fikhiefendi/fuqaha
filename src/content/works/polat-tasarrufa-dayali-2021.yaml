abstract: "Bu çalışmada faizli kredi kuruluşlarına bir alternatif olarak sunulan tasarrufa dayalı faizsiz finansman sistemlerini, Hanefi mezhebinin temel esasları ve akit yapıları çerçevesinde inceledik. Tasarrufa dayalı finansman modellerinin, finans piyasasına getirdiği yeni önerilerin uygulanabilirliğini ve katılımcıya sunduğu avantajları göstermeye çalıştık. Bu kapsamda ülkemizde uygulanan ilgili sistemlerin fıkhi tahlilini yaparak mezhep esasları ve yapısal akit şartları bağlamında mevcut akitlerin bütün koşullarını en ince ayrıntısına kadar değerlendirdik. Bu noktada özellikle mevcut sistem sözleşmelerinde, katılımcıya sunulan anlaşma koşullarının görünür taraflarından öteye, sistemi ayakta tutan hileli esasları ve hatta bazı noktalarda üstü örtülü olarak katılımcıyı aldatmaya yönelik uygulamaları tespit ettik. Nitekim mevcut sistemlerde Hanefi mezhebi açısından var olan yapısal bozukluklara, fasid koşullara, mezheb içerisinde akitlerin sıhhat ve fesat normlarına ve fasid akitlerin faiz niteliği taşıdığı esasına vurgu yaptık. Bu çalışmada ticari bir uygulamanın ve bir akdin, hukuki zeminini ve meşruiyet sahasını, özellikle İslam hukuku ilkelerine bağlı kalarak içtihadî bir zeminde illî/nedensel bir bakış açısıyla tahlil ettik ve öneri sunduk. Nitekim Hanefi mezhebinin oluşum normlarına bağlı kalarak takdirî fıkıh yöntemi ile mevcut akit yapısının, mezhep esaslarına tam bir mutabakat çerçevesinde caiz olması için şirket-i milk modelini oluşturduk. Bu çabamızla, günden güne gelişen ve değişen ticari sistemlerin, mezhep esaslarına bağlı kalınarak tahlil edilebileceğini ve olası durumlarda işlevsel ve uygulanabilir bir alternatif oluşturulabileceğini; hem temel naslara ve mezhep normlarına bağlı kalması gereken İslam hukukçularının hem de ticari piyasa aktörlerinin değerlendirmesine sunduk. Bu çalışmamızla, geliştiridiğimiz şirket-i milk siteminin akit yapısını, organizasyon işleyişini, yapısal esas şartlarını, akdi esaslardaki mütabak metnini, fesih koşullarını ve ardından ilgili akdin tali uygulamalarını bütün ayrıntılarıyla kaleme aldık."
