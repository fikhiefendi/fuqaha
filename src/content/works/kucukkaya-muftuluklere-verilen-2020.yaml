abstract: "Neslin devamını sağlayan aile müessesesinin kuruluşu nikâh akdiyle gerçekleşir. Geçmişten günümüze kadar bütün hukuk sistemlerinde evlilikler akidle kurulur. Evlilik sözleşmesi hususunda hukuk sistemleri arasında farklılıklar her dönem mevcuttu. İslâm hukukunda her akid gibi nikâh akdi için de belli unsurlar ve şartlar belirlenmiştir. İslâm hukukunda nikâh akdi, evlenmelerine engel bulunmayan erkek ve kadının kendi iradelerini açıklamalarıyla gerçekleşir. Nikâh akdinin unsurları taraflar ve onların evlilik isteklerini açıklamalarını ifade eden irade beyanıdır. Nikâh için gerekli şartların sağlanması gerekir. Aksi takdirde nikâhın geçerliliği hususunda sorunlar ortaya çıkmaktadır. Mer'î hukuka göre ise evlenme evlendirme memuru önünde irade açıklamasıyla gerçekleşir. Evlenme için mer'î hukukta da belirli şartlar vardır. Söz konusu şartların sağlanamaması durumunda evlilik yok hükmünde kabul edilir. 25.04.2006 Tarih ve 5490 Sayılı Nüfus Hizmetleri Kanunu'nda 19.10.2017 tarih ve 7039 Sayılı Kanun'la yapılan değişiklik sonrası İçişleri Bakanlığının ilgili oluru ile il ve ilçe Müftüleri de evlendirme memurları arasına dahil edilmiştir. İlgili yasalar çerçevesinde Müftülere verilen evlendirme yetkisi incelendiğinde, asıl görevi, İslam Dininin inanç, ibadet ve ahlak esasları ile ilgili işleri yürütmek, din konusunda toplumu aydınlatmak ve ibadet yerlerini yönetmek olan Müftülerin birtakım problemlerle karşı karşıya geleceği öngörülmektedir. Çalışmamızda ilgili yasa değişikliği ile müftülere verilen evlendirme memurluğu görevinin yol açacağı problemler dile getirildi."
