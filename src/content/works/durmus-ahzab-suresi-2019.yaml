abstract: "Bu çalışmada Cessâs ve İbnu'l-Arabî'nin Ahkâmu'l-Kur'ân'larındaki Ahzâb sûresi tefsirleri incelenmiştir. Çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, usulü ve kaynakları yanında Ahzâb sûresinin mahiyeti hakkında bilgiler verilmiştir. Birinci bölümde gerek müfessirlerin ve gerekse de çalışmanın daha iyi anlaşılmasına katkı sağlayacağı düşünüldüğünden müfessirlerin hayatları, eserleri ve tefsir metotları ele alınmıştır. İkinci bölümde Ahzâb sûresinde usûl-i din içinde yer alan Allâh'ın ve Hz. Peygamber'in verdiği hükmün değeri ve Hz. Peygamber'e salât etmenin dindeki yeri konuları iki başlık altında ilgili âyet veya âyet grubu verildikten sonra öncelikle Cessâs'ın daha sonra da İbnu'l-Arabî'nin Ahkâmu'l-Kur'ân isimli eserlerinden incelenmiştir. İnceleme sonunda iki müfessirin tefsirleriyle ilgili özet mukayeselere yer verilmiştir. Üçüncü bölümde Ahzâb sûresinde ahvâl-i şahsiye içinde yer alan; zıhâr, tebennî, Hz. Peygamber'in eşleriyle evlenmenin yasak oluşu, tahyir, Hz. Peygamber'in eşlerinin amellerinin iki katıyla karşılık bulacağı, Hz. Peygamber'in eşlerinin sorumlulukları, Hz Peygamber'e has hükümler, Hz. Peygamber'in eşleri arasında taksimden muaf olması, Hz. Peygamber'e başka kadınlarla evlenmesinin yasaklanması, Hz. Peygamber'in eşlerinin ve mü'minlerin sorumlulukları, zifâftan önce boşama ve örtünme konuları yukardaki metod üzere ele alınmıştır. Sonuç bölümünde ise yapılan incelemeler sonunda ele alınan konuların ve müfessirlerin değerlendirilmesi yapılmış ve yeni bir araştırma konusu teklifinde bulunulmuştur."
