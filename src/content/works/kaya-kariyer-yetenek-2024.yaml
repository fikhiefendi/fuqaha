abstract: "Bu araştırmanın amacı, katılım bankacılığı sektöründeki kariyer ve yetenek yönetimi uygulamalarının çalışan memnuniyeti ve performansı üzerindeki etkilerini ortaya koymaya çalışmaktır. Kesitsel nitelikteki bu çalışmada nicel araştırma yöntemleri kullanılmış ve 2023 yılında katılım bankacılığı çalışanlarının katılımı ile gerçekleştirilmiştir. 397 çalışan üzerinden analizler yapılmıştır. Veri toplama aracı olarak anket tekniği kullanılmış ve Yetenek Yönetimi, Kariyer Yönetimi, Çalışan Memnuniyeti ve Çalışan Performansı Ölçeği kullanılmıştır. Araştırmanın yapıldığı ana kütledeki demografik dağılımı göstermek ve ham verilerin özetini sunmak amacıyla frekans tablolarına yer verilmiştir. Anket formunun güvenirliğini değerlendirmek için Cronbach Alpha analizi kullanılmıştır. Ayrıca değişkenlerin normal dağılımını değerlendirmek için Tek Örnek Kolmogorov-Smirnov testi kullanılmış; ikili gruplar arasında bir farklılık olup olmadığını belirlemek için Mann-Whitney U testi kullanılmış ve iki veya daha fazla değişken grup arasında bir ilişkinin var olup olmadığını belirlemek için Kruskall Wallis H testi kullanılmıştır. Ayrıca değişkenler arasında ilişkinin hangi yönde ve hangi derecede olduğunu belirlemek amacıyla nonparametrik testlerden olan Spearman korelasyon testi ile analiz edilmiştir. Analizler, IBM SPSS For Windows 25 paket programı ile gerçekleştirilmiştir. Verilerin sonuçlarına bakıldığında çalışanların yetenek ve kariyer yönetimi algılarının, çalışan memnuniyeti ve performansı arasında olumlu ve pozitif yönde bir yönelik ilişki olduğu hipotezleri desteklenmiştir."
