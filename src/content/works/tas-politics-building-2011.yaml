abstract: "Bu çalışma, 28 Şubat süreci örneğinde hegemonya ve özne ilişkisini imcelemeyi amaçlamaktadır. Süreç, 1995 genel seçimleri sonrası Refah Partisi'ni (RP) iktidara getiren Türkiye'nin toplumsal ve siyasal yapısını yeniden şekillendirme adına askeri bürokrasinin uzun soluklu projesini yansıtmaktadır. Bu çerçevede ordunun laikliği yeniden tesis için hangi mekanizmaları kullandığı ve bu sürece dindar grupların nasıl tepki verdikleri ele alınacaktır.Kuramsal altyapısında Gramsci'nin iktidar yaklaşımını takip eden bu tez, hegemonya çalışmalarının baskı ya da direniş, dahil etme ya da yıkma gibi ikili karşıtlıkların ötesine geçmesi gerektiğini savunmaktadır. Bunun yerine madun öznenin sergileyebileceği pek çok tepki bulunduğu, bu ?Sağkalım stratejileri?nin çıkış, itaat, liminal direniş ve şiddeti içerdiği ifade edilmektedir.Türkiye'nin ?postmodern darbe?sini bir hegemonya projesi olarak değerlendiren bu tez, ordunun ülkedeki siyasal, ekonomik ve sosyal dokusunu yeniden şekillendirmede kullandığı rızaya ve şiddete dayalı araçlarını incelemektedir. Dindar madun grupların tepkisi ise üç örnek olay incelemesiyle ele alınmaktadır. Bunlar; sırasıyla siyasal, ekonomik ve sosyo-kültürel alanlara karşılık gelecek şekilde Milli Görüş Hareketi, İslam bankacılığına özel referansla İslami sermaye ve son olarak İslamcı protest müziktir.28 Şubat süreci Türk siyasetinin bir köşe taşı haline gelmiş, sonraki yıllarda siyasal oluşum ve gruplaşmaları belirlemiştir. Bu tez, küreselleşme ve Batılı değerlerin benimsenmesinin, dindar madun gruplar için bir sağkalım stratejisi olduğunu savunmaktadır. 28 Şubat süreci sonrası, yeni İslamcılar daha Batı yanlısı liberal bir yaklaşım benimserken, laikçiler daha devlet merkezli ve toplumcu bir siyaset anlayışına kaydılar."
