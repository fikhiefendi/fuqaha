abstract: "Bu tezde, İslam hukukunda kadının ailedeki ekonomik rolü, klasik ve modern dönem yaklaşımlarından hareketle ortaya koyulmaya çalışılmıştır. Tezin problematiğini, kadının ekonomik faaliyetlerde bulunmak zorunda olup olmadığı meselesi oluşturmaktadır. Bu problematik çerçevesinde klasik ve modern dönemdeki yaklaşımlar teorik ve pratik düzlemde incelenmiştir. Bu inceleme sonucunda klasik dönemde konuya, daha çok eşlerin hak ve sorumlulukları açısından yaklaşıldığı görülmüştür. Bu bakımından konu genel olarak ihtiyaç ve zarûret kapsamında değerlendirilmiştir. Modern dönemde ise meseleye, daha çok kadınının ekonomik faaliyetlerde bulunmasına, ailenin ve toplumun maslahatı açısından yaklaşıldığı görülmüştür. Sonuç olarak her iki dönemde de kadının ailedeki ekonomik rolünün, ekonomik faaliyetlerde bulunmak zorunda olup olmadığı açısından değerlendirildiği ve zorunluluk ifade etmese bile çeşitli ekonomik faaliyetler yoluyla aile ekonomisine katkıda bulunması durumunun dikkate alındığı ve tartışmaların da bu çerçevede ortaya çıktığı tespit edilmiştir."
