abstract: "Bu tez çalışmasının amacı Türk bankacılık sektöründe faaliyet bulunan ticari bankalar, kamu bankaları ve katılım bankalarının TV reklamlarını içerik analizi yöntemiyle inceleyerek, reklamda kullanılan çekicilik unsuru, tercih edilen mekân, işlenen tema, yansıtılan duygu, reklam motivasyonu, bankacılık hizmetinin türü bakımından bankalar arasında farklılıkların olup olmadığını ortaya koymaktır. Araştırmada nitel araştırma yöntemlerinden yazılı ve görsel doküman incelemesi yöntemi kullanılmıştır. Araştırmanın kapsamı; iki ticari banka, iki kamu bankası ve iki katılım bankasının 2020 yılı içinde yayımladığı toplam (89) TV reklam filmiyle sınırlı tutulmuştur. İncelemeye alınan altı banka amaçlı örnekleme yöntemlerinden ölçüt örnekleme ile belirlenmiş olup elde edilen metin verileri ve görsel veriler MAXQDA-20 analiz yazılım programıyla analiz edilmiştir. Araştırma sonucunda ticari bankaların dışsal motivasyon araçlarını, kamu ve katılım bankalarının ise içsel motivasyon araçlarını daha fazla kullandıkları tespit edilmiştir. Ticari bankalar mizah çekicilik unsuru ile teknoloji temasını kullanırken kamu ve katılım bankaları yansıtma çekicilik unsuru ile destek ve dayanışma temalarını kullanmaktadır. Ayrıca ticari bankalar ve katılım bankalarının reklam mekânı olarak“ev”i, kamu bankalarının ise“işyerini”yoğun kullandıkları görülmektedir. Reklamı yapılan hizmet türü açısından ise ticari bankaların mobil bankacılık ve internet bankacılığı hizmetlerini; kamu bankalarının kurumsal tanıtımı; katılım bankalarının ise banka kredisi hizmetlerini reklamlarında daha fazla vurguladıkları bulgusuna ulaşılmıştır. Her üç banka türünün de değer teması olarak“birlik ve beraberliği”, izleyiciye yansıtılan duygu olarak ise“mutluluk”duygusunu öne çıkardıkları araştırmada elde edilen diğer bulgulardır. Araştırma üç farklı banka grubunun bir yıllık tüm TV reklamlarını, yedi farklı temaya göre ikili ve üçlü karşılaştırmaya tabi tutarak, benzerlik ve farklılıkları ortaya koyması yönüyle literatüre katkı sağlamaktadır."
