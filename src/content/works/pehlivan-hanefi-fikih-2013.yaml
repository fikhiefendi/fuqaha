abstract: "Hanefî fıkıh usûlünde tek tip bir kıyasa aykırılık düşüncesinden söz etmek mümkün değildir. Doğrusu Hanefî usûlcüleri arasında bu konuda üç temel yaklaşım vardır. Şöyle ki, Ebü?l-Hasen el-Kerhî, kıyasa aykırılığı, genel kurala aykırılıkla açıklamaktadır. Kerhî?nin bu açıklamasına katılmayan Ebû Zeyd ed-Debûsî, bu noktada, akla aykırılığı ön planda tutmaktadır. Alâüddîn es-Semerkandî ise, her iki usûlcüyü de tenkit ederek, şeriatta kıyasa aykırılık düşüncesine temelden karşı çıkmaktadır. Serahsî, Pezdevî, Buhârî, Sadruşşerîa, Molla Fenârî, Molla Hüsrev ve İbn-i Hümâm gibi, Hanefî mezhe-binin önde gelen diğer usûlcülerinin kıyasa aykırılık düşünceleri de, nihayetinde, bu üç temel yaklaşımdan birine dayanmaktadır. Anahtar Kelimler : Kıyasa Aykırılık, Genel Kural, ?stisnaî Hüküm, ?llet, Akıl, Dü?ünce"
