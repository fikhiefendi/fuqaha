abstract: "İbrâhim en-Nehaî 47/667-96/714 yılları arasında Kûfe'de yaşamış tâbiîn âlimlerinden biridir. Her ne kadar tefsir, hadis ve kıraât gibi ilimlerde bilgi sahibi olsa da o, fetva ve ictihadlarının çokluğuyla fıkıh ilminde öne çıkmıştır. Nehaî, kendisinden önceki âlimlerden aldığı ilmi, bir râvi olarak aktarmamış, bir müctehid olarak geliştirip zenginleştirmiş ve o şekilde ilim talibi kimselere aktarmıştır. O, soru ve sorunlara çözüm üretirken nasın yanında re'ye de olabildiğince geniş yer vermiş, bundan dolayı Kûfe re'y ekolünün kurucusu kabul edilmiştir. Nehaî aynı zamanda Hanefî mezhebinin Hz. Peygamber'e uzanan ilim halkasında önemli bir konuma sahiptir. Bu anlamda o, başta Ebû Hanîfe olmak üzere Hanefî imamlarının rivayet, görüş ve düşüncelerine değer verdiği, eserlerinde sıkça ismine atıfta bulundukları bir âlim olmuştur. Bu çalışmada Nehaî'nin hayatı, yaşadığı dönem, usul anlayışı, fıkhının karakteristik yapısı, Hanefî mezhebinin kurucu imamları olan Ebû Hanîfe, Ebû Yûsuf ve İmam Muhammed ile ilmi münasebeti ele alınarak değerlendirilmiş, bir de söz konusu imamlar ve genel olarak Hanefîlerle mukayeseli olarak görüşleri ele alınmıştır."
