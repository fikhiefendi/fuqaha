abstract: "Sektörel bakımdan bankacılık; sağlam bir finansal sistemde kullanılan en önemli araçtır. Katılım bankacılığı ise bankacılık sektörü içinde payı olan ve zamanla artış gösteren türüdür. Ülkemizde ise bankacılık 1847 yılında İstanbul Bankası ismiyle iki banker tarafından yapılan bir oluşumla başlamıştır. Ülkemizde katılım bankacılığı ise 1983 yılında çıkartılan bir kararname ile ''özel finans kurumu'' adı ile gündeme gelmiş,1985 yılında Albaraka Türk Katılım Bankası ve Faysal Finans Bankasının faaliyete girmesi ile başlamıştır. Çalışmamızda ise bankacılığın ve katılım bankacılığının hem dünyada hem de ülkemizdeki tarihsel gelişimini görmekteyiz. Ayrıca katılım bankacılığının işleyiş, prensip ve yöntemlerine de değinilmektedir. Etkinlik analizinde kullanılan yöntemler ve literatürde kullanılan çalışmalar da bulunmaktadır. Son olarak örnek model Türkiye Finans Katılım Bankası faaliyet raporuna ait aktif toplamı, kullandırılan fonlar, toplanan fonlar, net kâr payı gelirleri, ödenmiş sermaye, net dönem kârı, öz kaynaklar, şube ve çalışan sayısı verilerinin son on yıllık (2009-2018) verileri kullanılarak bankanın performans değerlendirmesi yapılmıştır. Performans değerlendirmesi yapılırken Veri Zarflama Analiz (VZA) yöntemi ve Gri İlişkisel Analiz (GİA) yöntemi kullanılmıştır. Ayrıca bu yıllara ait bilgiler kullanılarak Trend Analizi yöntemi de yapılmış ve grafiksel verilere de ulaşılmıştır. Ayrıca analiz sonucunda 2009-2018 yılları arasında Türkiye Finans Katılım Bankası'nın etkin performans gösterdiği tespit edilmiştir."
