abstract: "Kavâid edebiyatı, fer'i konulardaki hüküm birliğini ifade eden veciz terkiplerden müteşekkil birçok kaideyi barındırmaktadır. Tez çalışmasında da Mecelle'nin 99. Md. olan“Kim bir şeyi vaktinden evvel isti'cal eylerse mahrumiyetle muâteb olur”kaidesinin fıkhî olarak etkileri aile hukuku ve feraiz bağlamında ele alınmıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın amaç ve sınırlılıkları, yöntemi, kaynaklarına, kavâid-i külliyenin içerik ve tanıtımına dair genel bir bilgi sunulmuştur. Birinci bölümde aceleciliğin Kur'an ve sünnetteki yeri ve psikolojik durumu ele alınmış sonrasında kaidedeki terimlerin kavramsal çerçevesi incelenmiştir. Kaidenin Kur'an ve sünnetteki dayandığı veriler toplanarak kavâid-i külliyedeki çeşitli kullanımları ortaya koyulmaya çalışılmıştır. Hukuki perspektiften arkasındaki makasıtlar açıklanmıştır. Kaidenin ilişkili olduğu kavram ve diğer maddeler sunularak kaidenin istisnalarına yer verilmiştir. İkinci bölümde ise kaidenin nikah ve talak ve ferâiz bahislerindeki örnekleri incelenmiştir. Çalışmamız, ulaştığımız neticeleri oluşturan sonuç bölümüyle noktalanmıştır. İslam Hukuku, Acelecilik, Aile hukuku, Miras Hukuku, Mecelle"
