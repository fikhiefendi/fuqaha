abstract: "Mevcut küresel ekonomik sistemdeki son gelişmeler, finansın temelini oluşturmaktadır. İslam finansmanı da dahil olmak üzere ekonomik küreselleşmeye yönelik ortaya çıkan eğilimler, küresel finans sektörünün daha açık ve çeşitli hale gelmesini sağlayan çağdaş finans endüstrisini desteklemektedir. Son zamanlarda, İslami bankacılık ve finans endüstrisi, küresel ekonominin giderek daha önemli bir bileşeni olarak gelişmekte ve cazip hale gelmektedir. Günümüzde, dünya çapında yaklaşık seksen ülke İslami bankacılık ve finans faaliyetlerine başlamıştır, bu da İslami bankacılık ve finansın hem İslami hem de İslami olmayan ülkelerde kabul gördüğü anlamına gelmektedir. Bu çalışma, Orta Asya ülkelerinde İslami bankacılık ve finansın büyümesini engelleyen yasal zorluklarla ilgili karmaşık ve birbiriyle bağlantılı konuları değerlendirmek ve Orta Asya ülkelerinin İslami bankacılık sistemini uygularken karşılaştıkları ekonomik sorunları ve zorlukları değerlendirmek amacıyla yapılmıştır. Ayrıca, Orta Asya ülkelerinde İslami bankacılığın uygulanması sırasında ortaya çıkan Şeriat ile ilgili sorunları ve zorlukları da incelemek amaçlanmıştır. Bu çalışma, seçilmiş Orta Asya ülkelerinde (Kazakistan, Kırgızistan, Tacikistan ve Özebistan) hukuki zorlukları, ekonomik endişeleri ve Şeriat konularını ve zorluklarını incelemek için nitel yöntemi kullanmıştır. Çalışma, Orta Asya ülkelerinin yasal sorunları, ekonomik bağlamı ve şeriat zorluklarını dikkate alarak İslami bankacılığın farklı boyutlarına ilişkin verileri toplamak için görüşme ve belge yöntemini kullanmıştır. Araştırma için kullanılan veri analizi yöntemi tematik ve betimsel analizdir. Çalışmanın bulguları, Kazakistan'ın yasal ve düzenleyici önlemlerin ve AIFC'nin uygulanmasına yönelik bir çaba gösterdiğini, ancak hiçbir ülkenin sektördeki potansiyel yasal sorunları ve zorlukları çözebilecek özel kanunların çıkarılması, yasa değişiklikleri ve özel bir şeriat mahkemesinin kurulmasını içeren etkili yasal stratejiler uygulamadığını ortaya koymaktadır. Benzer şekilde, Orta Asya ülkeleri, bölgede ayrı bir İslami bankacılık kanununun gelişmesine yol açabilecek yeni kanunların yürürlüğe girmesini sağlayacak herhangi bir tasarıyı henüz kabul etmemiştir. Bulgular ayrıca, bölgedeki Şeriat yönetimi ve düzenleyici çerçevelerin, bu ülkelerde yeterli Şeriat yönetimi kurmak için gerekli hizmetleri ve kuralları henüz göstermediğini ortaya koymaktadır. Ek olarak, veriler, bölgedeki merkez bankaları tarafından bankalar için Şeriat komitelerinin kurulması, Şeriat uyumu, Şeriat tutarlılığı ve Şeriat yönetimi çerçevesinin oluşturulması gerektiğini ortaya koymaktadır. Özellikle, bölgenin İslami bankacılık ve finans sektöründe hala tamamlamakta tereddüt ettiği ekonomik ve Şeriat ile ilgili konularda. Bu nedenle, çalışma, bölgede İslami bankacılık faaliyetlerinin başarılı bir şekilde geliştirilmesi için uygulanması gereken bazı öneriler sunmaktadır. Çalışma ayrıca, yakın gelecekte yapılacak çalışmaların, yasal ve düzenleyici konular, ekonomik konular ve İslami bankacılığın karşı karşıya olduğu şeriat zorluklarına ayrı ayrı odaklanması gerektiğini önermektedir."
