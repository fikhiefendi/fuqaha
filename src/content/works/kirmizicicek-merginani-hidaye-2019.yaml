abstract: "Çalışmaya konu olan Merğinânî'nin el-Hidâye adlı eserinde İslam Aile Hukuku ile ilgili Hanefî ve Şâfiî fakihlerinin ihtilaf gerekçeleri ortaya çıkarılmaya çalışılmıştır. Bu bölümde Nikâh akdi konusunda 32, Süt emme konusunda 5, Boşanma konusunda 34 ve Aile hukuku ile ilgili hadler konusunda 4 olmak üzere toplamda 75 meselede Hanefî ve Şâfiî fakihleri arasında ihtilaf olduğu tespit edilmiştir. Çalışma bir giriş ve iki bölümden meydana gelmektedir. Giriş bölümünde araştırmanın önemi, amacı, yöntemi, literatür özeti ve müellifin hayatı kısaca tanıtılmıştır. Birinci bölümde“Evlenme ve Süt emme”konusundaki“Hanefî-Şâfiî İhtilafları”; İkinci bölümde ise“Boşama ve Aile Hukuku ile ilgili Hadler”konusundaki ihtilaflar belirlenip diğer Hanefî ve Şâfiî kaynaklar yardımıyla gerekçeleri ortaya çıkarılmaya çalışılmıştır"
