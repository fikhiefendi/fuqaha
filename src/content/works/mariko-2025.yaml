abstract: "Bu çalışma, Mali Cumhuriyeti'nde vakıfların geliştirilmesi ve güçlendirilmesi konusunu ele almakta ve çağın değişimlerine ve gelişmelerine uygun çağdaş İslami finansman yöntemleri kullanılarak vakıf yatırımlarının uygulanması yoluyla bu hedefe ulaşmayı amaçlamaktadır. Çalışmanın amacı, vakıf yatırımı kavramını açıklamak, hedeflerini ve şer'i (İslami) esaslarını ortaya koymak, vakıf yatırım alanlarını ve çağdaş deneyimlerini vurgulamak, ayrıca Mali'deki vakıfların mevcut durumunu analiz etmek ve vakıf yatırımı mekanizmalarının uygulanmasıyla ilgili zorluklar ve fırsatları keşfetmektir. Araştırmada, vakıf yatırımının kavramsal çerçevesi, hedefleri ve şer'i esasları ile çağdaş deneyimlerin sunumu için betimleyici yöntem benimsenmiş; anket sonuçları ve ilgili raporların analizi yoluyla analitik yöntem kullanılmıştır. Amaç, yatırım fırsatları ve karşılaşılan zorlukları belirlemek ve Mali'deki vakıf ve hayır kurumları için uygun yatırım modelleri sunmaktır. Araştırma, mevcut zorlukların giderilmesi ve vakıf kaynaklarının yönetimi ve yatırımı için gerekli idari becerilerin geliştirilmesi şartıyla, Mali'deki başarılı yatırım modellerinden faydalanma konusunda umut verici bir potansiyel olduğunu ortaya koymuştur. Ayrıca, mülkiyet devriyle sona eren ortaklık (müşareke), mülkiyet devriyle sona eren kira (icâre), vakıf fonları, yatırım sertifikaları ve paralel selem gibi şeriata uygun yatırım araçlarının, Mali'de sürdürülebilir bir vakıf kalkınması için en etkili mekanizmalar arasında olduğu sonucuna varılmıştır."
