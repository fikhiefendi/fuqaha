abstract: "Bu çalışmanın temel amacı, hukukun en önemli yardımcılarından olan bilirkişilik kavramını, önemini, tarihi gelişimini ve uygulamalarını ele almaktır. Bilirkişilik kavramının bilmek ile doğrudan ilişkili olması bu çalışmanın ilim/bilim-bilgi zemininde incelenmesi gerekliliğini ortaya koymaktadır. Çalışmanın birinci bölümünde bilirkişiliğin kavramsal çerçevesi üzerinde durulmuştur. Buna bağlı olarak İslam hukuk tarihinde bilirkişilik kavramına karşılık gelen“ehl-i vukuf”terimi ve buna benzer pek çok terim tespit edilmeye çalışılmıştır. Bunun yanında bilirkişiliğin tarihi gelişimi ele alınarak gerek Batı hukuk tarihinde gerekse İslam hukuk tarihindeki varlığı kronolojik olarak ele alınıp incelenmeye çalışılmıştır. İkinci bölümde bilirkişilik ile ilgili fıkhî uygulamalar birtakım örneklerle birlikte ele alınmıştır. Özellikle bilirkişilik kavramının özellikleri ile örtüşen fakat doğrudan bilirkişi olarak isimlendirilmeyen bazı meslek grupları ve görevliler tespit edilerek yaptıkları bilirkişilik faaliyetleri incelenmeye çalışılmıştır. Bilirkişiliğin, kaynaklarda doğrudan bir başlık olarak yer almaması konu bağlamında tespit edilen meslek gruplarını ve faaliyetlerini sunmak bu çalışmanın alana katkı sunması bakımından önem arz etmektedir. Çalışmanın üçüncü bölümünde ise bilirkişilik ve hukuki niteliği, İslam hukuku ve modern hukuk açısından mukayeseli bir şekilde ele alınmıştır. Yapılan bu çalışmaların neticesinde bilirkişiliğin hukukun tatbikinde adalet ve hakkaniyeti sağlamak amacını gerçekleştirmek açısından son derece önemli olduğu ve İslam hukuk tarihinin her döneminde kaynaklarda kendisine farklı suretlerde yer bulduğu tespit edilmiştir."
