abstract: "“348 Numaralı Tarsus Şerʻiyye Sicili'nin Transkripsiyon ve Değerlendirilmesi”başlığıyla şerʻiyye sicillerinin önemi ve mâhiyeti kronolojik sıralamaya tâbi' tutularak ele alınmış ve şer'iyye sicilleri açıklanmıştır. Şerʻiyye sicilleri, Osmanlı Devleti'nin hukukî yapısında önemli bir yere sahiptir. Şer'iyye sicilleri ayrıca, yazıldığı dönemde-ki toplumun dini, kültürü, ekonomik gibi pek çok alan hakkında bilgi sağlamaktadır. Çalışmada Tarsus hakkında bilgi verilmiştir. Osmanlı Devleti'nin hukukî yapısı ve konuya bağlı başlıklar bulunmaktadır. Şerʻiyye sicilleri ile ilgili açıklamalar verilmiştir. 348 Numaralı Tarsus Şer'iyye Sicili'nin özet tablosu belirtilmiştir. 348 Numaralı Tar-sus Şerʻiyye Sicili ele alınarak transkripsiyonu yapılmıştır. Transkripsiyonda; sicillerin sayfa numaraları, hüküm numaraları ve sicillerin yazıldığı tarihler verilmiştir. Transk-ripsiyonu yapılan sicillerin vermiş olduğu bilgiler dâhilinde değerlendirme bölümünde sicillerin değerlendirmesi tablolar ile belirtilerek ele alınmıştır. Ayrıca sicillere bağlı olarak sosyal hayat, ekonomik hayat ve yer isimleri gibi konulara değinilmiştir."
