abstract: "Bu çalışmada İslam ceza hukukunda şahıslara karşı işlenen öldürme ve müessir fiiller neticesinde meydana gelen diyet cezası ve İslam'da âkile sistemi her yönüyle işlenilmeye çalışılmıştır. Çalışma iki bölümden oluşmaktadır. Konu birinci bölümde iki temel başlık altında incelenmiş, birinci başlıkta diyetin mahiyeti, tarihçesi, miktarı, hangi mallarla ödendiği, mağdurun cinsiyetinin diyete tesiri, hakimin diyet taktiri ve diyeti düşüren durumlar işlenmiştir. İkinci başlıkta ise azalara karşı işlenen müessir fiiller neticesinde meydana gelen uzvun izalesi veya fonksiyon kaybı ya da yaralanması durumunda ödenmesi gereken diyet miktarları beyan edilmiştir. İkinci bölümde İslam'da âkile sistemi ele alınmış, âkilenin mahiyeti, meşruluğu, tarihi gelişimi, kimlerden oluştuğu ve günümüzde âkile fertlerinin nasıl değerlendirilmesi gerektiği konuları ele alınmıştır."
