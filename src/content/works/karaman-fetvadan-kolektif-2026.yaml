abstract: "Modern çağın karmaşık sosyoekonomik ve teknolojik meydan okumalarının geleneksel fetvâ usulünün sınırlarını zorladığı müşahede edilmektedir. Fıkhî meselelerin önceden tecrübe edilmediği şekilde çok boyutlu ve disiplinlerarası bir nitelik kazanması iftâ faaliyetini yapısal anlamda etkilemiştir. Bu süreçte fetvâ verme ameliyesi, münferit bir müftînin şahsından ziyade muhtelif disiplinlerden uzmanların da bulunduğu kurullar bünyesinde icra edilmeye başlanmıştır. Bunun yanında, şahsî fetvâ taleplerine kurumsal müracaatların da eklenmesiyle müsteftî profili tüzel kişilikleri kapsayacak şekilde genişlemiştir. Söz konusu gelişmelerle birlikte klasik fetvâ metinlerinin yerini giderek kanun maddelerini andıran kurumsal karar formları almıştır. Bu doğrultuda çalışma, çağdaş fetva kurullarının küresel düzeyde en önemli temsilcilerinden olan Uluslararası İslam Fıkıh Akademisi'nin genel yapısını ele almaktadır. Araştırmada ayrıca Uluslararası İslam Düşünce Enstitüsü'nün fetva talepleri merkeze alınarak modern fetvâ müessesesinin yapısındaki kurumsal dönüşüm ve karar süreçleri analiz edilmektedir. Son tahlilde iftâ sürecinde görülen bu yapısal dönüşüm, fıkhî otoriteyi muhafaza etme kaygısı ile değişen sosyopolitik şartlara intibak sağlama arayışı arasındaki çok katmanlı ilişkinin bir tezahürü olarak değerlendirilebilir."
