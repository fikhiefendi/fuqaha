abstract: "Bu tezde, İbn Abdülhâdî'nin (ö. 744/1343) Tenkîḥu't-Taḥkīk fî Ehâdîsi't-Taʿlīk adlı eserinin“Kitâbu't-Tahâre”bölümünde yer alan rivayetler incelenmiştir. Çalışma, iki ana bölümden oluşmaktadır. İlk bölümde müellifin hayatı, ilmî kişiliği, hocaları ve talebeleri ele alınmış; hadis ilmindeki yeri ve ilmî çevresi klasik kaynaklar ışığında ortaya konmuştur. Ayrıca onun hadis anlayışının temel özellikleri ve hadis-fıkıh ilişkisine bakışı genel hatlarıyla değerlendirilmiştir. İkinci bölümde, İbn Abdülhâdî'nin“Kitâbu't-Tahâre”bölümündeki rivayetleri sened ve metin açısından nasıl ele aldığı irdelenmiştir. İki kulle hadisi, köpek ve yırtıcı hayvanların artığı, kedinin artığı, nebîz ile taharet ve meyte derisinin tabaklanması gibi tahâret meselelerine dair rivayetler üzerinde durulmuş; bu rivayetlerin sened yapısı, râvîlerin cerh–taʿdîl durumları ve metinlerdeki farklılıklar tespit edilmiştir. Rivayetlerin fıkhî hükümlerle bağlantısı da incelenmiş ve dönemin hadis-fıkıh ilişkisinin anlaşılmasına katkı sağlanmıştır. Bu bağlamda çalışma, İbn Abdülhâdî'nin hadis metodolojisini daha yakından tanıtmayı ve tahâret konularına dair rivayetlerin ilmî açıdan nasıl değerlendirildiğini ortaya koymayı amaçlamaktadır."
