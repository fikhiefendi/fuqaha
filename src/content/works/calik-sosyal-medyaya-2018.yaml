abstract: "Sosyal medya gün geçtikçe insanların yaşamlarında önemli bir yer edinmeye başlamıştır. Gelişen teknolojik imkânlar ve sosyal medya araçlarının çeşitlenmesi kişilerin sosyal medya araçlarını kullanım alışkanlığını kaçınılmaz kılmıştır. Bu ise beraberinde bazı fıkhî meselelerin yeniden gündeme gelerek sosyal medya ekseninde tartışılmasını ve bu doktrinden hareketle çözüm yolları üretilmesini gerektirmiştir. Biz bu çalışmamız ile internetin keşfiyle birlikte kullanım alanı bulan sosyal medyanın ortaya çıkış süreci, gelişimi, özellikleri ve geleneksel medyaya kıyasla kullanıcılarına sağladığı kolaylıkları ele alarak genel anlamda sosyal medya araçlarını tanımaya çalışacağız. Sonrasında ise sosyal medya kullanıcılarının sosyal medya araçları üzerindeki tasarruflarından hareketle sanal âlem üzerinde ne tür içerik paylaşımlarında bulundukları ve bu içeriklerin İslam hukuku açısından nasıl değerlendirilmesi gerektiğini ortaya koymaya çalışacağız. Bu eksende öncelikle sosyal medya üzerinde şahitlik konusuna yer verilmiştir. Ardından kullanıcıların sosyal medyadaki bilgi paylaşım yöntemleri gruplandırılarak fıkhî açıdan değerlendirilmeye çalışılmıştır. Sosyal medya kullanımının sebep olduğu sorunlar ise kullanıcıların iradeleri dâhilinde gerçekleşen ve iradeleri dâhilinde gerçekleşmeyen fıkıh ihlalleri olarak isimlendirilerek mahremiyet ve halvet kavramları merkezinde ele alınmıştır."
