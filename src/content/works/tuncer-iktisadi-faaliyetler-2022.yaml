abstract: "Bir din olarak İslam'ın iktisadi boyutunu iktisat ilminin kendi dili ile anlamak, İslam dininin temel kaynağı olan Kur'an'ın muhtevası ve ruhunu anlamak açısından da önemlidir. Bu bakımdan, iktisadi faaliyetler içerisinde İslami kavramlar olan riba ve rehin kavramlarının irdelenmesi oldukça değerlidir. Borç kavramı da iktisadi faaliyetler içerisinde kaçınılamayacak bir uygulama olarak yerini alan kavramlardandır. Aslı itibari ile bir borç olan riba kavramı, İslam dininde önemli yaptırımları olan bir konudur. Riba yapılış şekli ile farklılıklar arz edebilir ve borç türlerinden biri olarak izin verilmiş bir uygulama olan rehin kavramıyla ilintilidir. Neticede dinsel kavramlarla iktisadi kavramların ne düzeyde aynı şeyi ifade ettiğini iktisadi açıdan değerlendirmek önemlidir. Tezin konusunu da birer borç işlemi olan riba ve rehin uygulamaları oluşturmaktadır. Burada borçlanmadaki faiz kavramı ya da dini anlamdaki riba kavramına dikkat çekerek riba ile faizin aynı kavramlar olup olmadığı ve rehin ile ilişkisini ortaya koymak amaçlanmıştır. Buna göre, iktisadi faaliyetler çerçevesinde borç, kredi ve riba (faiz) kavramları küme mantığı içerisinde değerlendirildiğinde, birbirleriyle ilişki içerisinde olduğu ve borcun genel kümeyi oluşturduğu söylenebilir. Çünkü kredi bir borç ilişkisinden doğar ve ortada bir borç olmadığında kredi ilişkisinin varlığından söz etmek mümkün değildir. Borç burada kurucu unsurdur. Dolayısıyla ribadan (faizle aynı anlamda kullanıldığında) söz etmek için de borç-kredi ilişkisinin kurulması gerekir. Faiz ise kredi ilişkisinin varlık şartıdır. Her ne kadar riba ile faiz kavramlarının farklı kavramlar olduğu yönünde görüşler bulunsa da aslında riba ile faiz aynı anlamda kullanılan kavramlardır. Riba (faiz), İslamiyette ve diğer semavi dinlerde açık bir şekilde yasaklanmıştır. Ancak enflasyonist bir ortamda paranın satın alma gücü düşmektedir. Bu durumda bir taraftan riba yasağı ile borç alan korunurken, diğer taraftan verilen borç satın alma gücünü koruyamadığı için borç veren aleyhine bir durum ortaya çıkmaktadır. Bu bağlamda satın alma gücünü telafi edecek şekilde enflasyon farkı ödemesi yapılmasının riba kavramının kapsamı dışında değerlendirilmesi gerekmektedir. Bu durumun“faiz”adı altında değerlendirilmemesi, zaten ödenmesi gereken bir değer olarak faizden başka bir kavram ile ifade edilmesi gerektiği ileri sürülebilir. Diğer yandan İslam hukuku açısından riba ve rehin asıl itibarıyla farklı uygulamalar olup, sadece vadeli işlem olma yönünden benzerliği olsa da, rehinde borçlu borcunu ödeyemediğinde borca eklenen bir fazlalık olmaması gerekmektedir. Çünkü alacaklı rehne konu malı sattırarak malın bedeli üzerinden alacağını almaktadır. Genel olarak, ribanın haram ve aynı şekilde rehnin caiz olduğu konusunda ihtilafın bulunmadığı, ancak bazı durumlarda rehnin ribaya yol açabileceği söylenebilir."
