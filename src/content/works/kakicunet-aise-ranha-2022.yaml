abstract: "Hazreti Aişe r.anha'nın fıkhın inşasında belirgin bir rolü bulunmaktadır. Zira kendisi daha gençlik dönemindeyken ve tüm algıları açıkken Allah resulü sallallahu aleyhi ve selleme eşlik etmiş, ondan Kuran ve hadis almıştır. Allah resulü sallallahu aleyhi ve sellem fetva soranların en özel konularında bile onun yanında fetva verirdi. Peygamber sallallahu aleyhi ve sellem vefat ettikten sonra Sahabe ve Tabiin uleması fetva sormak için kendisine müracaat etmişlerdir. Hazreti Aişe r.anha'nın ilmi İslam ümmeti için servet sayılmaktadır. Hazreti Aişe, muteber fıkıh mezheplerinin dayandığı bazı hükümlerin kaynağı konumundadır. Elimizdeki araştırmamızda okuyucu, İmamı Şafii mezhebi üzerinden Ahvali Şahsiye konusu ile ilgili olarak Hazreti Aişe'nin Nikah babındaki rivayetler, içtihat ve görülerinin etkisini anlayacaktır. Çalışmamız iki bölüme ayrılmıştır. Birinci bölümde Hazreti Aişe tarafından aktarılan ve Şafi imamlarınca kitaplarında delil alınarak üzerine şeri hükümler düzenlenen nakil ve rivayetleri dile getirdim. Bu bölümde rivayetlere ek olarak sadece bilinmesi ve açıklanması kaçınılmaz olan bazı konulara değinerek, rivayetleri aktarmakla yetindim. Öte yandan Şafii mezhebinin görüşlerine aykırı düşen bazı rivayetler de getirerek, mezhep imamlarının görüşlerini karşılaştırdım. Ayrıca konuları tamamlamak adına Şafii kitaplarında yer bulamayan bazı rivayetleri de aktardım. Ancak burada temelde Şafii mezhebinin kitaplarında geçen rivayetlerle yetinmeyi hedefledim. Şunu da belirtmek gerekir ki, hadis alimleri tarafından konu ile ilgili yapılan rivayetlerin büyük çoğunluğu, ya aynı metne yada hafif değişikliklere sahip metinlere dayanmaktadır. İkinci bölümde ise bu rivayetleri nikah babı ile ilgili bölümlere ayırdım. Bu rivayetlerin tamamını aktarmadan, belirli bölümlerine odaklanarak açıklamaya ve detaylandırmaya çalıştım. Nikah akdi, geçerli nikah akdinin tarifi, geçersiz nikah akdi türleri, nikah akdi ile ilgi hükümler, haram sayılan kadınlar, nişanlılık, mehir, nafaka, cinsel ilişki ile ilgili hümkümler, nikahın feshi ile ilgili hükümler ve çok eşlilik ile ilgili hükümler araştırma konumun kapsamında yer aldı. Bununla birlikte daha faydalı ve konuyu tamamlayıcı olacağını düşündüğümüz için, genelde fıkıh kitaplarında bulunmayan;“Hazreti Aişe'dan rivayet edildiği üzere Peygamber sallallahu aleyhi ve sellem'in evinden alıntılanan eş olma adabı”başlıklı konuyu ekledim. İkinci bölümün ardından gelen kapanış bölümünde ise araştırma sonuçlarına ve tez sonucunda verdiğim öne çıkan fikirlere yer verdim. Hazreti Aişe'nin rivayetleri tüm nikah konularını kapsamadığından ve yine tüm bu rivayetler tek bir kaynakta bulunmayıp, çeşitli kaynaklara dayandığından kaynakça bölümünde birkaç kaynağı dikkate aldım. Buna göre kaynaklarım arasında Nevevi, Sübki ve Mutii'nin el-Mecmu ve Gazali'nin el-Vesit gibi kitaplarım yer almaktadır. Ayrıca okuyucuya kolaylık sağlamak adına modern fıkıh kitabı metodolojisi uyguladım. Özetle araştırmamızın konusu Hazreti Aişe'nin Şaffi mezhebine etkisi, İmamı Şafii ve Şafii ve diğer mezhep imamlarının bu rivayetlerden çıkardıkları hükümlerin açıklanmasıdır. Başarı Allah'tandır. Başta ve sonra şükrümüz onadır"
