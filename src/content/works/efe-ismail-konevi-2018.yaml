abstract: "Hüsn-kubh, Kelâm ve Usūl-i Fıkhın ortak meselelerindendir. İslâm fırkalarının birçok konudaki görüşleri, bu meselede durdukları yere göre şekillenmektedir. Bundan dolayı hüsn-kubh meselesi oldukça çetin nazarî tartışmalara konu olmuştur. Sadruşşerî'a'nın Tavzīh adlı eserinin hüsn-kubh ile ilgili bölümü, bu konudaki en özgün teliflerdendir. Bu çalışma, İsmail Konevî Efendi'nin Tavzīh'teki bu bölüm üzerine kaleme aldığı Hâşiye 'ale'l-mukaddimâti'l-erba' isimli risalenin tahkik ve tahlilini konu edinmektedir."
