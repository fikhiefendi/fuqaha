abstract: "İslami Şeriat, kapsamlılığı ve her zaman ve mekan için esnekliği ile karakterize edilmiştir ve onu toplumun istikrarını koruyan en önemli güvence temellerinden biri haline getiren kontroller ve kurallar içerir. Bu açıdan bakıldığında, Suriye'de yaşananlar ve tecavüz suçunun daha önce hiç görülmemiş bir şekilde yaygınlaşması ve zinanın artık bir suç olarak nitelendirilmemesinden dolayı hem İslam hukukunda hem de Suriye devleti hukukunda suçun kaynağını, failin hükmünü ve mağdurun haklarını araştırmak zorunda kaldık. Bu araştırmada hem İslam hukukunda hem 2011 senesinde 1 sayılı kanun hükmünde kararname ile değiştirilen Suriye kanunda suç olarak sayılan tecavüz suçunu ele aldık. Islam fıkhının suça bakışı ile Suriye hukukunun suça bakışı arasındaki farkları açıklamayı amaçladık. Araştırma, İslam hukukunda tecavüz suçu kavramını ortaya koymuş ve zina suçu ile karşılaştırmıştır, ve tecavüz suçunun unsurlarının bilinmesi, şartları ve delilleri ile tecavüzcüye verilecek cezanın beyanı ve tecavüzcünün cezasının açıklığa kavuşturulması, fıkhî görüşteki farklılıklardan sonra özellikle suçun mahiyeti ve zina veya muharabe cezasına ne ölçüde bağlandığına bakılması, çünkü eski fakihler suçun unsurlarını zina suçu hükümleri içinde tartışmışlar, çünkü bu suçta tecavüzcü zina etmiş sayılıyor, suça teşebbüs hakkındaki hükmün bilinmesi, failin cezasının düşürülmesinin sebepleri ve mağdurun haklarını açıklığa kavuşturulması konularını açıklamıştır."
