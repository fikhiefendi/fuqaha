abstract: "Teknoloji, sağlamış olduğu imkanlar vasıtasıyla insanları pek çok açıdan etkileyen bir yapıya sahiptir. Sanayi Devrimi itibariyle gelişim gösteren modern teknolojiyle söz konusu etki farklı seviyelere ulaşmış ve günümüz insanının dünya tasavvuru, geçmiştekinden farklılaşmıştır. Küreselleşme olgusu da dünya tasavvurundaki değişimin bir tezahürüdür. Dünya tasavvurundaki değişim; bireyi, dolayısıyla toplumsal yapıyı dönüştürmektedir. Toplumsal durumun bir ifadesi olan örf de doğal olarak bu değişimden etkilenmektedir. Örf, haddi zatında değişken bir yapıya sahip olmakla beraber, teknolojinin söz konusu etkisiyle modern öncesi örfünden farklı bir mahiyete kavuşmuştur. Bu durum ise örf anlayışının değişimini doğurmuştur. Teknolojinin etkisiyle oluşan değişimler silsilesinden Müslümanların da etkilenmesi, bu durumun örfe etki etmesi ve örfün de fıkhın tali kaynaklarından olması nedeniyle söz konusu değişimin tespit edildiği yer de fetvalardır. Bu nedenle çalışmada, günümüz fetva kurullarının kararları incelenerek örf ve örf anlayışındaki değişimin tespit edilmesi amaçlanmıştır. Bu bağlamda öncelikle teknolojinin mahiyeti ve topluma etkisi incelenmiş, daha sonra küreselleşme olgusuyla arasındaki ilişki ele alınmıştır. Teknoloji-küreselleşme ilişkisi belirtildikten sonra fıkıh kaynaklarındaki örf anlayışı incelenmiş, daha sonra küreselleşmenin etkisiyle günümüzdeki örf anlayışındaki değişim teorik çerçevede ortaya konulmuştur. Son olarak söz konusu teorinin uygulamadaki tespiti için günümüz fetva kurullarından AAOIFI (Accounting and Auditing Organization for Islamic Financial Institutions), Mecmau'l-Fıkhi'l-İslâmî ed-Düvelî ve Ürdün Umumi Fetva Dairesi'nin murabahada maliyete eklenebilen masraflar ve hükmî kabz yöntemleriyle ilgili kararları incelenmiştir."
