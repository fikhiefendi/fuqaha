abstract: "Araştırmanın temel amacı, Ziraat Katılım Bankası'nın sosyal medyada verdiği reklamların güvenilirliğinin marka değeri, marka aşkı ve marka güveni üzerine olan etkisinin incelenmesidir. Bu çalışmanın evrenini Ziraat Katılım Bankası'nın sosyal medya reklamları ile karşılaşanlar oluşturmuştur. Çalışmanın örneklemine, kartopu örnekleme yöntemiyle ulaşılmıştır. Çalışmada sosyal medya reklamlarının güvenilirliğinin marka güvenini, marka aşkını ve marka değerini nasıl etkilediğini tespit edebilmek amacıyla, marka güvenine, marka değerine ve marka aşkına yönelik beşli Likert ölçeği şeklinde meydana getirilmiştir. Çalışmanın değişkenleri göz önüne alınarak, literatürdeki ölçeklerden faydalanılmıştır. Veriler çevrimiçi anket yoluyla toplanmıştır. Çalışmanın araştırma bölümü için 251 yetişkinden veri toplanmıştır. Elde edilen veriler yapısal eşitlik modellemesi ile analiz edilmiştir. Araştırma sonucunda sosyal medya reklamlarına güvenin marka değeri üzerinde anlamlı etkisinin olmadığı görülmüştür. Sosyal medya reklamlarına güvenin marka aşkı üzerinde olumlu ve anlamlı bir etkisinin olduğu anlaşılmıştır. Benzer şekilde sosyal medya reklamlarına güvenin marka güveni üzerinde olumlu ve anlamlı bir etkisinin olduğu anlaşılmıştır. Marka aşkının marka değeri üzerinde olumlu ve anlamlı bir etkisinin olduğu anlaşılmıştır. Ancak marka güveninin marka değeri üzerinde anlamlı bir etkisinin olmadığı görülmüştür."
