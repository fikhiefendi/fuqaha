abstract: "Osmanlı İmparatorluğu, 19. yüzyılın sonlarına kadar büyük ölçüde İslam şeriatına dayalı bir hukuk sistemiyle yönetilmiştir. Ancak, Batı'dan gelen etkiler, imparatorluğun iç ve dış problemleri, ekonomik sıkıntılar ve askeri yenilgiler, Osmanlı'da köklü reformlar yapma gerekliliğini doğurmuştur. Bu bağlamda, Osmanlı'da şeriat temelli hukuk sisteminden modern hukuk sistemine geçiş süreci, Tanzimat Fermanı (1839) ile başlayıp, 19. yüzyılın sonlarına kadar çeşitli adımlarla şekillenmiştir. Tanzimat Dönemi'yle birlikte hukukta modernleşme çabaları, idarî ve toplumsal yapıyı dönüştüren reformlarla paralel ilerlemiştir. Bu süreçte, özellikle“Medeni Kanun”gibi modern düzenlemelerle, halkın farklı dini inançları gözetmeden, devletin tüm vatandaşlarına eşit bir şekilde hizmet vermesi amaçlanmıştır. Ancak, şeriatın hâkim olduğu bir toplumda bu dönüşüm, hem dini hem de toplumsal açıdan güçlü tepkilere yol açmıştır. Osmanlı'da, modernleşme sürecinin en belirgin tepkileri, dini otoritelerden ve muhafazakâr kesimlerden gelmiştir. Hatta, bazı gruplar, bu reformların İslam'a aykırı olduğunu savunmuş ve padişah yönetimine karşı direniş göstermiştir. Bu tezde, Osmanlı'daki hukuk reformları, modernleşme süreci, hukuki dönüşümün toplum üzerindeki etkileri ve bu dönüşüme karşı gösterilen tepkiler incelenmiştir. Bu süreç, Osmanlı toplumunun din ve hukuk anlayışındaki evrimi, modernleşme ile gelen toplumsal değişimleri ve seküler hukukun toplumdaki yeri gibi önemli kavramlar üzerinden analiz edilmiştir. Ayrıca, Osmanlı'dan Cumhuriyet'e geçişte hukuk sistemindeki dönüşümün izleri de tartışılmaktadır."
