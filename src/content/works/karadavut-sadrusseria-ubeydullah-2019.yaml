abstract: "Sadrüşşeria Ubeydullah b. Mes'ud, Buhara'da yaşamış, Hanefî ekolüne mensup bir âlimidir. Kelâm, fıkıh, usul, mantık ve felsefe gibi alanlarda zamanının en önemli şahsiyetlerinden biri olan Sadrüşşeria, naklî ve aklî ilimlerde önemli bir yere sahiptir. Moğol istilasından sonra harabeye dönen Buhara'nın yeniden ilim merkezi olmasında ve Hanefîliğin günümüze kadar gelmesinde etkili olmuştur. Sadrüşşeria'nın İslamî ilimlerin birçok dalında yazdığı eserleri, öğrencileri vasıtasıyla İslam dünyasına yayılmış ve Osmanlı medreselerinde de okutulmuştur. Sadrüşşeria, aklın işlevselliği üzerinde durarak akıl ile nakil arasında mutedil bir yol tercih etmiştir. Ona göre, iman-amel, mükâfat-ceza, cebir-irade açısından kişinin sorumluluğundan bahsedebilmek için“teklifi mâ lâ yutak”ın güç yetirilebilir olması gerekir. O, yükümlülüğün şartı olarak ilimle birlikte kudreti de şart koşmuştur. Sadrüşşeria bu meyanda, ilim, irade ve kudret gibi kelâmî üç konu üzerinde durmuştur. Ona göre tekliften bahsedebilmek için mükellefin ne ile sorumlu olduğunu bilmesi, fiile niyetinin olması, sorumlu tutulduğu fiili yerine getirebilecek güce sahip olması gerekir."
