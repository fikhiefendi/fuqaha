abstract: "Devrimden sonra“Velâyet-i Fakîh”anlayışıyla varlık bulan dinî bir liderliğin, mutlak otoritesi ve Şiî inanışa mahsus dinî kurallarla yönetilmeye başlanan İran, Şiî kitlelerin hâmisi rolünü üstlenmiştir. İtikadî bir ayrılığa dönüşmeden önce siyasî meşruiyete dair bir uyuşmazlıktan ibaret olan Şiî-Sünnî ayrılığı bu devrimden fazlasıyla etkilenmiştir. Bu çalışmada, 1979 yılında gerçekleşen İran İslâm Devrimi'nin dayandığı dinî ve kültürel dinamikler ve yürüttüğü yayılma politikaları“tarihsel sosyolojik”bir yaklaşımla ve uluslararası ilişkiler perspektifi bağlamında incelenmektedir. Bu çalışmanın ışığında tezimizin ana bulgusunu şu şekilde özetlemek mümkündür: İran -başlangıçta ve siyaseten- tüm Müslümanları desteklemek suretiyle kuşatıcı bir rol oynayacağını ilân etmiş, ancak ağırlıklı olarak Şiî grupları desteklemiş, bu yapıları askerî ve iktisadî birer güç haline getirerek Şîa mezhebini dış siyasette araçsallaştırmıştır. Söylemsel düzeyde idealist ve ümmetçi görünen İran'ın diğer dış politika tercihleri gibi vekâlet savaşı politikalarının da ana eksenini Fars ve Şiî kimliğinin birleşiminden oluşan ulus-devlet çıkarlarını gerçekleştirme ve güvenlik kaygılarını giderme amacı oluşturmaktadır. Çalışmada İran İslâm Cumhuriyeti'nin tutunum ideolojisi olarak gördüğü Şiîliğin geçirdiği dinî ve siyasî dönüşüme, bu geleneğin devrime etkisine ve devrim sonrası İran'ın politikalarını belirleyen temel aktör ve faktörlere, ihtiyaç duyulduğu oranda değinilmiştir. Çalışmada İran'ın yaşam alanı olarak gördüğü Irak, Suriye, Lübnan ve Yemen'e dönük bu yayılma siyasetinde kullandığı yöntem, söylem ve araçlar, üzerinden 40 yıl geçen İslâm Devrimi'nin muhtelif evreleriyle bağlantılı olarak ele alınmıştır. Bu bağlamda İran'ın vekâlet savaşlarında kullandığı yöntem ve söylemler incelenmiş, bu dört ülkede günümüzde bu çalışmaların ne derece başarılı olduğu araştırılmıştır."
