abstract: "15. yy. ortalarından itibaren giderek artan bir şekilde cihanşümul bir imparatorluğa dönüşen Osmanlı Devleti, 1530'lardan sonra artık yeni topraklar fethetmektense mevcut hakimiyet alanı üzerinde güçlü bir merkezî yönetim kurmaya ağırlık verdi. Klasik dönemde diğer tüm imparatorluklar gibi Osmanlı devlet maliyesinin ana gelir kaynağını da toprak vergileri oluşturuyordu ve bu nedenle merkezî yönetimin iktidarını güçlendirmesi, tarım topraklarının doğru ve adil bir şekilde vergilendirilmesine ve vergilerin eksiksiz bir şekilde toplanmasına bağlıydı. Anadolu ve Rumeli'de tarım toprakları kategorik olarak miri statüdeydi ama pratikte söz konusu toprakları özel mülk olarak görme eğiliminde olan reayanın ve yeterli hukukî formasyona sahip olmayan taşra kâdılarının neden olduğu bazı önemli sorunlar vardı ve görünüşe göre bu sorunlar toprakların miri statüsünü tehdit eden bir seviyeye ulaşmıştı. Bu dönemde bir yandan merkezî yönetim söz konusu sorunların üstesinden gelmek için birtakım idari tedbirleri yürürlüğe koyarken, diğer yandan Osmanlı uleması tarım topraklarının miri statüsünü temellendirmek ve sultan, tımar sahipleri ve reayanın bu topraklarla ilişkilerinin hukukî niteliğini açıklamak için yoğun bir çaba içerisine girdi. İşte ulemanın bu yorum çabasına odaklanan elinizdeki çalışma, Osmanlı klasik döneminin son asrında kanun-şeriat ilişkisini tarım topraklarının mülkiyeti sorunu üzerinden ele almaktadır."
