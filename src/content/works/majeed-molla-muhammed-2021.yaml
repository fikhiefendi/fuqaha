abstract: "Bu çalışmanın amacı, alimlerin el yazması eserlerini tahkik etmek suretiyle tarihin tozlu karanlık raflarından gün yüzüne çıkarmak, böylece İslam kültür ve mirasına hayat vermektir. Araştırmamız Yusuf el-Erdebîlî'nin“el-Envâr li-aʿmâli'l-ebrâr”isimli serine, Molla Muhammed el-Geredî tarafından yazılan haşiyenin“taharet ve cenaze bablarını”tahkik etmektedir. Müellif bu iki kısımda taharet ve cenaze namazıyla ilgili fıkhi hükümleri şerhetmektedir. Tahkik ettiğimiz el yazması kitap, geçmişte ilmi icazet almak isteyen öğrencilere fakih ve alimler tarafından medreselerde ders olarak okutulmuştur. Buna ek olarak mescit ilim halkalarında fıkıh ders kitabı olarak okutulmuştur. Fakihler bu kitaba“Envâr'ul-kebîr”adını vermiştir. Kitabın daha kolay anlamasını sağlamak üzere, bu kitaba birçok ilmi açıdan büyük bir değere sahip olan şerh ve haşiyeler yazılmıştır. Envâr kitabı üzerine yazılan haşiyelerinde başında Haşiyetu Şîrvani ve Haşiyetu Hac İbrahim gelmektedir. Bizim ele aldığımız haşiye ise Molla Muhammed el-Geredî'nin Envar kitabına yazdığı haşiyedir. Ele aldığımız haşiyenin birçok mahtut nüshası bulunmaktadır. Öncelikle (A) nüshasını baştan sona okunmuş ve bilgisayar ortamına aktarılmıştır. Daha sonra tahkikin (B) nüshasıyla karşılaştırılmış ve nüshalar arasında tespit edilen farkları dipnotta belirtilmiştir. Araştırmamız dirase ve tahkik olmak üzere iki kısımdan oluşmaktadır. Dirase bölümünde (Molla Muhammed el-Geredî'nin) adı, nesebi, lakabı, künyesi, ailesi, aşireti, eserleri, ilmi hayatı, haşiyedeki metodu ve kullandığı kaynaklar ana hatlarıyla açıklanmıştır. Tahkik kısmı ise çalışmanın temelini oluşturan mahtût haşiyenin tahkikine ayırılmıştır. Haşiyedeki metinler tahkik edilmiş, ayet-hadis tahricleri yapılmış, müellifin fıkhi görüşleri klasik fıkıh kaynaklarıyla ilişkilendirilmiş ve haşiyede geçen simgeler, şahıs ve yer isimleri tercüme edilmiştir. Yazarın taharet ve cenaze kitaplarının tahkikinde yararlandığı kaynaklara ulaşılmış ve araştırma boyunca elde edilen bulgular sonuç kısmında ortaya konulmuştur."
