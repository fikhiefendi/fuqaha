abstract: "Bu tez çalışmasında Eski Anadolu Türkçesi dönemine ait Kitâb-ı Güzîde adlı eser ele alınmıştır. Adı geçen eser; XII. yüzyılda yaşadığı bilinen fıkıh alimi Ebû Nasr bin Tahir bin Muhammed es-Serahsî tarafından kaleme alınmış, hakkında fazla bilgi sahibi olmadığımız Muhammed bin Balî tarafından da, metinde kendisinin 'rûşen Türkîce' olarak adlandırdığı Anadolu Türkçesine aktarılmıştır. Muhammed bin Bâlî eserin başında; Ebû Nasr bin Tahir bin Muhammed es-Serahsî'nin kaleme aldığı eserin her bir sözünün çok kıymetli olduğunu, ancak bozuk ve düzensiz bir şekilde yazıldığını, kendisinin de okuyan herkesin kolaylıkla anlaması için daha açık bir dile çevirdiğini ifade etmiştir. Muhammed bin Bâlî eserin orijinal dilini 'olga-bolga', çevirdiği dili de 'fasıh ve rûşen' ifadeleriyle tanımlamıştır. Eser, Eski Anadolu Türkçesi ile yazılmış en eski din kitaplarından biri olması özelliğiyle dikkate değerdir. Bu tez çalışması beş ana bölümden oluşmaktadır. Giriş bölümünde eser ve yazarı tanıtılmış, eserin nüshaları hakkında bilgi verilmiş, metinde geçen bâblar ve ayetler dizin biçiminde verilmiştir. İkinci bölüm olan Dil İncelemesi, metnin dil özelliklerinin ayrıntılı olarak verildiği bölümdür. Üçüncü bölüm olan Metin bölümü, metnin transkripsiyonunun ve metin içindeki düzeltmelerin dipnot olarak verildiği bölümdür. Dördüncü bölüm yani Dizin/Sözlük bölümünde, metinde geçen her bir sözcüğün kökeni, anlamı ve aldığı eklerle birlikte hangi sayfanın hangi satırında geçtiği ortaya konulmuştur. Metinde geçen özel isimler Özel İsimler Dizini başlığı altında verilmiştir. Beşinci ve son bölüm olan Sonuç bölümünde ise çalışmanın sonucunda ortaya çıkan bulgular ve görüşler belirtilmiştir."
