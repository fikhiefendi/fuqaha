abstract: "Hicrî dördüncü asırda yaşayan Ebü'l-Leys es-Semerkandî, ondan sonraki gelecek nesiller için ehemmiyetli bir eseri kaleme almıştır. Tefsîru'l Kur'âni'l-Kerîm isimli bu eser, tefsir sahasna önemli katkılarda bulunmuştur. Zira Ebü'l-Leys bu tefsirde hem akli hem de nakli delilleri toplayarak Kur'ân-ı Kerîm'i anlama ve anlatma açısından kayda değer bir gayret göstermiştir. Semerkandî ayetleri tefsir ederken sadece görüşlerini sunmakla yetinmez, kendisinden önceki müfessirlerin görüşlerinden de yararlanır. Dolayısıyla Semerkandî'nin tefsirinde nakil anlayışı önemli ölçüde varlığını göstermektedir. Nitekim Semerkandî, kendisinden önceki müfessirlerin görüşlerini“Mücâhid veya Mukâtil de şöyel demiştir”diyerek eserine almıştır. Ebü'l-Leys es-Semerkandî tefsirinde en çok sözlerini nakletiği müfessirlerin arasında Mukâtil b. Süleyman bulunmaktadır. Zira Tefsîru'l-Kur'âni'l-Kerîm isimli eserinde Mukâtil'e ait 500'den fazla rivayet bulunmaktadır. Semerkandî'nin Mukâtil'den bu kadar fazla nakilde bulunmasanın nedenlerinden biri, onun eserinin Kur'ân-ı Kerîm'i baştan sona izah eden ilk tam tefsir olmasıdır. Bir diğer nedeni yazıldığı dönemin vahiy dönemine yakın olması sebebiyle sahabe ve tabiinden gelen rivayetleri toplamış olmasıdır. Ayrıca Mukâtil'in b. Süleyman ile Ebü'l-Leys es-Semerkandî'nin yaşadıkları beldelerin birbirine yakın olması, nakil şartlarının zorluluğunu kısmen hafiflettiği söylenebilir. Semerkandî, Mukâtil b. Süleyman'dan nakilde bulunurken tek alan ile yetinmemiştir. Zira o Kur'an'da geçen inanç, ibadet, ahlak ve ahkâm gibi konulara dair ayetleri açıklarken ondan nakilde bulunduğu gibi nüzul sebeplerini tespit ederken de ondan istifade etmiştir. Ebü'l-Leys es-Semerkandî Mukâtil b. Süleyman'dan nakilde bulurken rivayetlerin hepsini birebir aynıyla aktarmamıştır. Kimi zaman bu rivayetleri kısaltarak, kimi zaman da ona bir takım ilaveler ekleyerek aktarmıştır. Bazen de rivayetin manasın değiştirmeden onu farklı lafızlarla ifade ederek aktarmıştır. Bütün bunlar bize gösteriyor ki Ebü'l-Leys es-Semerkandî Mukâtil b. Süleyman'dan rivayetleri aktarırken hepsinde aynı yöntemi kullanmamıştır. Bundan hareketle çalışmamızın birinci bölümünde iki müfessirin hayatları, yaşadıkları dönem, kaleme aldıkları eserler ve her ikisinin tefsir sahasına kazandırmış oldukları birikimden bahsettik. İkinci bölümde ise Ebü'l-Leys es-Semerkandî'nin Tefsîr'l Kur'âni'l-Kerîm adlı tefsirindeki Mukâtil b. Süleyman'ın rivayetlerini Mukâtil'in tefsirindeki rivayetler ile karşılaştırmaya çalıştık. Semerkandî'nin Mukâtil'den nakilde bulunurken kullandığı her yöntem için ayrı bir tablo oluşturduk. Buna göre bu rivayetleri kıssaltılarak aktarılanlar, ilave edilerek aktarılanlar, manası aynı olup lafzı farklı olanlar, hem manası hem lafzı farklı olanlar, birebir aynı olanlar ve karşılığı olmayanlar şeklinde nakledilen rivayetleri müstakil tablolar hâlinde gösterdik. Yaptığımız mukayese sonucunda Semerkandî'nin naklettiği Mukâtil rivayetlerinin en az altıda beş gibi büyük bir orana tekabül eden kısmının Mukâtil'in tefsirindekilerle örtüştüğünü tespit ettik. Bu da Semerkandî'nin nakil konusunda güvenilir bir müfessir olduğu anlamına gelmektedir."
