title: "Ebü'l-leys es-Semerkandî'nin Tefsîru'Kkur'âni'l-Kerîm Adlı Eserindeki Mukâtil B. Süleyman Rivayetlerinin Mukâtil'in Kendi Tefsirindekilerle Mukayesesi"
