abstract: "Osmanlı Devleti'nin ve Osmanlı toplumunun idari, iktisadi ve sosyo-kültürel hayatı hakkında ilk elden bilgi veren temel kaynaklardan birisi de şer'îyye sicilleridir. Şer'î hükümler esas olmakla birlikte örfi uygulamaların da yer aldığı bu defterler kaza adı verilen merkezlerde görevlendirilen kadılar tarafından tutulmuşlardır. Merkezden gönderilen emirlerin yanı sıra mahallinde cereyan eden her türden alım–satım, anlaşmazlık, evlenme-boşanma, miras, vasi nasbı, komşuluk ilişkileri vs. konularda son derece kıymetli bilgiler aksettirmektedir. Transkripsiyonunu yapmak ve değerlendirmek üzere seçtiğimiz defter, H. 1203-1204 (M. 1788-1789) tarihleri arasındaki kayıtları kapsamaktadır. Çalışmamızda ilk olarak İçindekiler, Kısaltmalar ve Listesi verildikten sonra Ankara'nın coğrafi vaziyetine ve kısa tarihi geçmişine odaklanılmış, ardından transkripsiyonda takip ettiğimiz usul belirtilmiştir. Yine bu Giriş bölümünde şer'îyye sicilleri hakkında genel ve kısa bir bilgi verildikten sonra Ankara Şer'îyye Sicilleri üzerine yapılmış tezlerden söz edilmiştir. Birinci bölümde 179 Numaralı Ankara Şer'îyye sicilinin transkripsiyonu yapılmıştır. İkinci Bölüm, transkripsiyonu yapılan sicilde yer alan belgelerin değerlendirilmesine, bizlere ne gibi bilgiler sunduğuna ayrılmıştır. Yine bu bölümde sicilde yer alan belgelerin türleri hakkında da bilgi verilmiştir. Sonuç ve Kaynaklar verildikten sonra Ekler kısmında belge özetleri çıkarılmış, böylelikle araştırmacıların kısa yoldan faydalanmasının önü açılmıştır. Yine bu kısımda baş tarafta listesi verilen Tablolar yer almıştır. Tablolarda Ankara Sancağı yöneticilerinin, mahallelerinin, kaza ve nahiyelerinin, en sonunda da köylerinin isimleri verilmiştir."
