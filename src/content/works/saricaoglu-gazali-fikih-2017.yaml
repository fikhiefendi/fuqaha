abstract: "“Gazali'in Fıkıh Düşüncesinde Tasavvuf”adlı bu çalışmamızda ilk olarak kelâm, fıkıh, tasavvuf ve felsefede derin bilgilere sahip olan Gazali'nin hayatı, eserleri ve ilmi kişiliği hakkında kısa ve özlü bilgiler verilmiştir. İkinci bölümde çalışma yaptığı her ilme birkaç yönden katkısı olan bu büyük âlimin, fıkıh ilmine yeni bir bakış açısı getirerek fıkıh-tasavvuf ilişkisini ne şekilde yorumladığı anlatılmaya çalışılmıştır. Yine bu bölümde Gazali'in fıkhî hükümlerin salt görünür taraflarından ziyade, derûnî manalarına dikkat edilmesi gerektiği tezini niçin savunduğu ve hangi açılardan fıkıh ile tasavvufu barıştıran kişi olarak görüldüğü üzerinde durulmuştur. Son bölümde ise, Gazali'in bütün hukuk sistemlerinde var olan hükümlerin dışa dönüklüğü (zâhir) yanında, İslam hukuk sisteminin ayrılmaz bir parçası olarak kabul ettiği hükümlerin içsel (bâtınî) boyutunun, ibadetleri durağanlıktan ne şekilde koruduğu, sade ve anlamsız hareketler bütünü olmaktan hangi bâtınî vasıflarla çıkardığı üzerinde durulmuştur. Onu iyi tanımak, eserlerini iyi tahlil etmek, gerek fıkıhçılığını değerlendirmede gerekse mutasavvıflığını değerlendirme konusunda bizlere çok yardımcı olacaktır."
