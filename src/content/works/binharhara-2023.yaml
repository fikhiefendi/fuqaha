abstract: "Bankalar, bireylerin ve şirketlerin birikimlerinin yatırıma dönüşmesini temsil etmesi nedeniyle ekonominin bel kemiği olarak kabul edilmektedir. İslami bankalar, İslami Şeriat hükümleriyle uyumlu mudarabe ve diğerleri gibi finansal faaliyetler ve İslami finansman formülleri sağlayarak faaliyet göstermektedir. işlemleri İslami Şeriata göre kontrol edin. Çalışma, Suudi Kalkınma Bankası ve Omani Nizwa Bank'ta temsil edilen çalışma topluluğunun teorik tarafında tümevarımcı ve tümdengelimli yaklaşımı, pratik tarafında ise betimleyici ve analitik yaklaşımı takip etti ve burada mudarabe sözleşmelerinin biçimlerini gösterdi. iki banka ve mudarabe sözleşmesinde AAOIFI Şeriat standartlarını ne ölçüde uyguladıkları. Çalışma, bazı resmi gözlemlerle birlikte, Suudi Alinma Bank ve Omani Nizwa Bank'ın Mudaraba sözleşmelerde, özellikle Standart 13 ve Standart 40'ta genel olarak Şeriat standartları“AAOIFI”uyarınca faaliyet gösterdiği sonucuna varmıştır. Çalışma, Şeriat Bankaları Komitesi'ne, özellikle Şeriat standartları altında disipline edilen dijital gelişime paralel olarak İslami bankaların performansını geliştirmesi ve topluma hizmet etmek için daha fazla tasarruf çekmesi için performans geliştirmesini tavsiye etti."
