abstract: "Dünyada giderek artan küreselleşme, yerel pazarları daha fazla rekabete açık hale getirmiş bunun yanında bilgi teknolojileri ile birlikte daha da bilinçlenen tüketiciler de her bir işletme ve sektörün müşteri odaklı bireysel pazarlama yaklaşımını benimsemeye zorlamıştır. Bu sektörlerden biri de bankacılık sektörü olup, faizsiz bankacılık prensibini benimseyen katılım bankaları, dünyada genel geçerli klasik bankacılık sistemi ile rekabet edebilmek için de bireysel pazarlama uygulamalarına ihtiyaç duymuştur. Ancak sistemin farklı oluşu, elbette katılım bankalarının da çok daha farklı bireysel pazarlama yaklaşımı benimsemesini gerektirmiştir. Bankacılık sisteminin iktisadi ve iktisadi olmayan her alandaki etkisi dikkate alındığında etkili bir pazarlama yaklaşımı, katılım bankaları için büyük önem arz etmektedir. Bu amaçla bu çalışmada katılım bankalarının bireysel pazarlama stratejileri ve uygulamaları, müşteri kitlesinin özellikleri ve rekabet koşulları dahilinde analiz edilmiştir. Sonuçlar göstermektedir ki, katılım bankaları, bireysel pazarlama faaliyetlerini hedef pazarın özelliklerine ve müşteri gruplarının farklı tercihlerine göre revize ederek rekabet avantajı yaratabilecektir. En önemlisi de din vb. nedenlerden çok, getiri olanakları nedeniyle katılım bankaları tercih edilmektedir. Türkiye?deki katılım bankalarının ise bireysel pazarlama yaklaşımında, rekabet koşullarının zorlaması nedeniyle, bireysel pazarlama stratejilerini dünyadaki emsallerine göre daha başarılı yürüttüğü sonucuna ulaşılmıştır."
