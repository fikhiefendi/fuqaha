abstract: "İslam Hukukunda nevâzil, havâdis ve vâkıât türü eserler mezhep imamlarından sonra ortaya çıkan yeni meseleleri ele alır. Günümüzde ise yeni fıkhî problemleri ifade eder. Vâkıât türü eserler fıkhî birikimi barındıran eserlerdir. Bu tür eserlerin bir kısmı matbu halde bulunmasına karşın maalesef büyük bir kısmı elyazma halinde kütüphanelerde beklemektedir. Doktora çalışması olarak tahkik ettiğimiz es-Sadruşşehîd'in Kitâbü'l-Vâkıât'ı da VI./XII. asırda kalem alınmıştır. Bu eser sonraki dönemlerde Hanefî literatürünün önemli kaynaklarından birisini oluşturmuştur. Araştırmamız giriş, üç bölüm, sonuç ve bibliyografyadan oluşmaktadır. Birinci bölümde es-Sadruşşehîd'in biyografisi ve eserlerine yer verilmiştir. İkinci bölümde \"Kitâbü'l-Vâkıât ile ilgili tetkiklere yer verilmiştir. Bu bağlamda kitabın müellife aidiyeti, telif amacı, konusu, muhtevası, kaynakları, eserin telifinde takip edilen yöntem, kütüphane nüshaları, tahkik çalışmamızda tercih edilen nüshalar ve tavsifleri anlatılmıştır. Üçüncü bölümde tahkikte takip edilen metot ve tahkikli metinde kullanılan işaretler hakkında bilgi verilmiştir. Bu çalışmadan elde edilen bulgular sonuçta anlatılarak ileride yapılacak çalışmalarla ilgili bir kısım tavsiyelerle sona ermiştir. Anahtar Kelimeler: Buhârî. es-Sadruşşehid, İbn Maze, Kitabü'l-Vakıât, Nevazil, Ömer b. Abdilaziz, Tahkik ve Değerlendirme, Vakıât."
