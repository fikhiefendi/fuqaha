abstract: "Bu tezde, İslam ve Batı'da insan haklarının tartışmalı zemini sorununu ele almaktayız. İnsan haklarının küresel ahlaki tartışmalarımızın merkezinde yer aldığı bir çağda yaşarken, insan hakları Avrupa merkezli etik ve antropolojilerdeki önyargıları nedeniyle sorgulanmaktadır. Aynı zamanda insan hakları yirminci yüzyılda sekülerleştirildi ve herhangi bir felsefi alternatifle desteklenmeden tarihsel teolojik temellerinden koparıldı. Bu durum modern insan haklarını felsefi açıdan temelsiz bırakmış ve bir gerekçelendirme teorisine ihtiyacını doğurmuştur. Mevcut“insan hakları krizi”, özellikle Hıristiyan ve Yahudi etiğinde insan haklarının felsefi temelleri üzerine yeni çalışmaları teşvik etmiştir. İslam hukuk geleneği bu tartışmanın dışında kalmıştır. İslam ve insan hakları üzerine yapılan araştırmalar neredeyse sadece“çatışma anlatısına”odaklanmakta ve klasik İslam hukuku (fıkıh) ve hukuk felsefesi (usûlü'l-fıkh) ile derin bir ilişki kurmamaktadır. Hem oryantalistler hem de insan hakları hukukçuları İslam'ın insan hakları kavramına sahip olmadığını ve yalnızca“ödev temelli bir sistem”olduğunu iddia etmişlerdir. Bu tez, hukuki oryantalizmin indirgemeciliğinin ötesine geçmekte ve İslam hukukuna, çağdaş felsefi tartışmalara değerli katkılarda bulunabilecek bir hukuki-felsefi gelenek olarak söylemsel açıdan yaklaşmaktadır. Karşılaştırmalı hukuk çalışmaları ve kavramsal tarih (Begriffsgeschichte) çerçeveleri aracılığıyla bu tez, ortaçağ ve erken modern İslam ve Batı'daki modern öncesi insan hakları söylemlerinin izini sürmektedir. Bunu yaparken, insan haklarının nasıl kavramsallaştırıldığını, gerekçelendirildiğini ve temellendirildiğini ve bunların bugünkü ahlaki kaygılarımıza nasıl hitap edebileceğini araştırmaktayız."
