abstract: "Bu çalışmada, Mecelle-i Ahkâm-ı Adliyye'nin küllî kâidelerinin (kavâid-i fıkhiyye) hadis literatüründeki kaynakları incelenmektedir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde, kavâid-i fıkhiyye kavramı ele alınıp anlamı belirlenmeye ve ayrıca kavramın oluşum süreci incelenmeye çalışılmıştır. Daha sonra sünnetin ne anlama geldiği ve İslâm dininin ikinci kaynağı olarak değeri üzerinde durulmuş ve sünnet ile fıkıh arasındaki ilişki ele alınmıştır. Yine Osmanlı Devleti'nin Mecelle öncesindeki hukukî yapısı ve bu devletin ilk medenî kanun metni olarak Mecelle'nin nitelikleri üzerinde de durulmuş ve Mecelle'nin tedvin çalışmalarına katkı sunmuş olan âlimler hakkında bilgi verilmiştir. İkinci bölümde, Mecelle'nin küllî kâideleri konularına göre kendi içinde bir tasnife tabi tutulmuş ve neticede doksan dokuz küllî kâidenin tamamının yirmi iki temel konu başlığı altında sıralanabileceği görülmüştür. Daha sonra küllî kâideler, derlenmiş oldukları fıkıh kaynakları açısından araştırılmış ve bulundukları yerler belirlenmiştir. Ayrıca belli başlı bazı şerhlerden istifade edilerek bu kâidelerin anlamları da tespit edilmiştir. Son olarak da başta Kütüb-i Sitte olmak üzere Câmi', Sünen, Müsned ve Musannef türündeki temel hadis kaynakları esas alınarak küllî kaidelerin hadis literatüründeki temelleri belirlenmeye çalışılmıştır."
