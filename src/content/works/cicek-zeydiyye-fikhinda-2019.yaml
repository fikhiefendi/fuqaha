abstract: "Zeydiyye ve Hanefî fıkhının nikâhla ilgili hükümlerini konu edinmiş olan bu çalışmada iki mezhep arasındaki hüküm benzerlikleri ve farklılıkları tespit edilmeye çalışılmıştır. Çalışmada aynı dönemde yazılmış olmaları ve ait oldukları mezhebin temel başvuru kaynakları arasında yer almaları bakımından Zeydiyye fıkhını temsîlen Müeyyed-Billâh Ahmed b. Hüseyin b. Hârûn'a ait Tecrîd, Hanefî fıkhını temsîlen de Ahmed el-Kudûrî'ye ait olan Muhtasar'ın nikâh bölümleri incelenmiştir. Üç bölümden oluşan bu araştırmanın birinci bölümünde iki mezhep fıkhının gösterdiği tarihî gelişmeler, mukayesede esas alınan eserler ve müellifleri hakkında bilgi verilmiştir. İkinci bölümde, esas alınan eserler“kitabu'n-nikâh”özelinde şekil, metot ve üslup bakımından karşılaştırılmıştır. Üçüncü bölümde ise bu iki eserin nikâhla ilgili hükümleri mukayese edilmiştir. Eserlerin şekil ve metot bakımından benzer olduğu, üslup bakımından ise Muhtasar'ın daha özlü olduğu tespit edilmiştir. Nikâha dair hükümlerde ise iki mezhebin birbirine yakın olduğu ancak azımsanmayacak ölçüde farklılıklarının da bulunduğu görülmüştür."
