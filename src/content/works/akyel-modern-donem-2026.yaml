abstract: "Bu çalışma, modern dönem İslam hukuk düşüncesinin iki önemli temsilcisi olan Mısırlı Muhammed el-Hudarî Beg (ö. 1927) ve Osmanlı hukukçusu Muhammed Seyyid Bey'in (ö. 1925) fıkıh usulü anlayışlarını karşılaştırmalı bir perspektifle ele almaktadır. Araştırmanın temel amacı, her iki müellifin hüküm ve içtihat nazariyelerinden hareketle fıkıh usulü anlayışını ortaya koymak ve böylece modern dönem usul düşüncesindeki dönüşümü tespit etmektir. Tezin birinci bölümünde, müelliflerin usul ilminin tarihini dönemlendirme biçimleri ve ele alış tarzları incelenmiş ve fıkıh usulünün mahiyet ve gayesine ilişkin değerlendirmeleri tetkik edilmiştir. Hüküm nazariyesi bölümünde, Seyyid Bey'in irade hürriyetini ve hikmet-i teşrîʿ ilkesini hukuk sisteminin merkezine yerleştirerek rasyonalist bir vizyon geliştirdiği görülmüştür. Hudarî Beg ise bu tartışmalara pratik-fıkhî sonuçları bağlamında daha teknik ve metodolojik bir çerçevede yaklaşmıştır. Son bölümde ele alınan içtihat ve taklit anlayışlarında, Seyyid Bey'in fıkıh ile şeriatı birbirinden ayırarak, içtihadî hükümleri ilahî hükümden ziyade beşerî bir yorum olarak konumlandırdığı tespit edilmiştir. Bu durum, modern kanunlaştırma hareketleri karşısında fıkıh usulüne toplumsal ve hukuki bir meşruiyet sağlama misyonu yüklediğini göstermektedir. Neticede her iki müellifin de makâsıd düşüncesinden etkilendiği ancak Hudarî Beg'in fıkıh usulünü teknik bir disiplin olarak ele alırken Seyyid Bey'in toplumsal dönüşümü hedefleyen dinamik bir hukuk felsefesi olarak yorumlama çabasını içerisine girdiği sonucuna ulaşılmıştır."
