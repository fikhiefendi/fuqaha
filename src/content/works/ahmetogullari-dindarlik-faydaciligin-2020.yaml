abstract: "Bu araştırmanın temel amacı, katılım banka müşterilerinin faizsiz finansal ürünleri satın alma davranışlarında dindarlığın ve faydacılığın doğrudan ve dolaylı etkileşimlerini keşfedici ve doğrulayıcı analiz yöntemleriyle tespit etmek ve bu ilişkilerden yola çıkarak doğrulayıcı karakterli modeller geliştirmektir. Bunun yanı sıra kuşakların farklılıklarını incelemektir. Araştırma evrenini; Türkiye Katılım Bankaları Birliği kapsamında yer alan İstanbul ilinde faaliyet gösteren özel katılım bankalarının müşterileri oluşturmaktadır. Nicel araştırma yönteminin (nicel araştırma deseni) kullanıldığı araştırmada, veriler çevrimiçi (online) anket tekniği ile toplanmıştır. Değerlendirmeye alınan ve verilerin analizinde kullanılan toplam anket sayısı 395'tir. Araştırmada kullanılan başlıca istatistiksel analizler; betimleyici istatistikler, keşfedici faktör analizi, regresyon analizi, farklılık testleri, doğrulayıcı faktör analizi ve yol (path) analizi şeklindedir. Verilerin analizinde SPSS 18.0 ve AMOS 21 paket programları kullanılmıştır. Araştırmanın doğrulayıcı karakterli analiz sonuçlarına göre; katılım banka müşterilerinin dindarlık eğilimlerini en iyi düzeyde temsil eden dindarlık boyutu, dini bilgi değişkenidir. Müşterilerin faydacılık algılarını en iyi temsil eden boyut, algılanan kullanışlılık değişkenidir. Son olarak müşterilerin satın alma davranışlarını en iyi temsil eden boyut ise, satın alma niyeti değişkenidir. Araştırma modelinde yer alan değişkenlere dönük doğrudan ilişkiler kapsamında; müşterilerin dindarlık eğilimlerinin (İnanç-uygulama-bilgi-deneyime dayalı sonuç) satın alma davranışları (satın alma tutumu, niyeti ve gerçek satın alma) üzerinde anlamlı bir etkisi olmamıştır. Öte yandan faydacılık algılarından algılanan kullanışlılık değişkeninin, katılım banka müşterilerinin satın alma davranışlarının tüm boyutları üzerinde (satın alma tutumu-niyeti-gerçek satın alma) pozitif yönde ve anlamlı düzeyde güçlü şekilde etkisi olduğu tespit edilmiştir. Faydacılık değişkenlerinden algılanan finansal maliyet değişkeninin ise, satın alma davranışlarından satın alma tutumu ve gerçek satın alma davranışı üzerinde anlamlı düzeyde ve negatif yönde bir etkisi gözlenmiştir. Katılım bankalarının müşterilerinin algıladıkları faydacılık düzeylerinden algılanan kullanışlılık değişkeni, dindarlık eğilimlerinin tamamı (inanç-uygulama-bilgi-deneyime dayalı sonuç) üzerinde anlamlı düzeyde ve pozitif yönde etkisi doğrulanmıştır. Faydacılık algılarından finansal maliyet algıları, dindarlık eğilimlerinin tamamı (inanç-uygulama-bilgi-deneyime dayalı sonuç) üzerinde anlamlı düzeyde ve negatif yönlü bir etkiye sahiptir. Bir diğer faydacılık algısı olan algılanan güvenilirlik değişkeninin, dindarlık boyutlarının tamamı (inanç-uygulama-bilgi-deneyime dayalı sonuç) üzerinde anlamlı ve negatif yönde etkisi gözlenmiştir. Son olarak satın alma tutumunun, satın alma niyeti üzerinde; niyetin ise gerçek satın alma değişkeni üzerinde anlamlı düzeyde ve pozitif yönlü etkisi olduğu tespit edilmiştir. En nihayetinde, X ve Y kuşağının her biri incelenen değişkenler açısından anlamlı farklıklara sahip oldukları gözlenmiştir."
