abstract: "Bu çalışmada, Hanefî usulcü ve fakihlerin eserlerini istikrâ yöntemiyle inceledik ve“Hayru'n-nâsi karnî”hadisi olarak bilinen“Hayırlılık Hadisi”nin delil olarak kullanımını tespit etmeye ve usul teorileri ile fıkhî uygulamalardaki etkisini ortaya koymaya çalıştık. Hayırlılık hadisi, ulemanın hususi ilgisine mazhar olan meşhur hadislerden biridir. Bununla birlikte, bu hadisin usul ve fıkıh ilimleri açısından, özellikle Hanefî mezhebi içinde nasıl kullanıldığına dair, usûlcülerin ve fakihlerin nasıl istidlalde bulunduklarını ortaya koyan ve teorilerinin inşasındaki etkisini açıklayan müstakil bir çalışma yapılmış değildir. Söz konusu hadis İslâmî ilim geleneğinde yer almaktadır. Öte yandan, Hanefî ulemasının usûl ve furu'da nasıl kullandığını takip etmek,“faziletli üç nesil”bağlamındaki tutumlarıyla ilgili önemli metodolojik işaretler ortaya koymaktadır. Ayrıca bu durum, Hanefîlerin hadise dayandıklarını ve birçok hüküm ve sonuçta kendilerine has bir yaklaşım sergilediklerini de teyit edecektir. Böylelikle çalışmamız, bu mühim meseleyi de bir veçhesiyle ortaya koyan bir araştırma hüviyetini de haizdir. Çalışmayı üç bölüme ayırdık: (i) İlk olarak, başlıkta yer alan temel kavramların analiz edildiği bir giriş bölümüyle başlandı. Böylelikle araştırmadaki temel ıstılahların kavramsal çerçevesi açık hale getirildi. (ii) İkinci bölümde ise,“hayırlılık hadisi”bağlamında hadis ilimleri açısından bir inceleme yaptık. Bu kapsamda hadisin tahricini, tevatür ettiğinin ispatını, lafızlarını ve rivayetlerini ele aldık. Ayrıca hadiste, hüküm konu olan umumi delaletler de ortaya konuldu. Böylece, hadisin istidlallere konu edilmeden önce sübutunu ispata ve delaletini doğru şekilde tespit etmeye gayret gösterdik. (iii) Araştırmanın üçüncü bölümünde ise -ki bu bölüm tezin gayesini ihtiva etmektedir- Hanefî ulemasının bu hadisle istidlalde bulundukları usûlî ve fıkhî meseleler incelenmiş; her bir örnekte meselenin aslı ve hadisin delil olarak kullanıldığı vecih açıklanmış, ayrıca bu istidlal türleri kurucu, destekleyici ve zımnî metodololer atıf şeklinde tasnif edilmiştir."
