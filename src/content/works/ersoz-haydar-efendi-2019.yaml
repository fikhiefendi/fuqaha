abstract: "Ali Haydar Efendi, Osmanlı Devleti'nin son yılları ile Cumhuriyet'in ilk yıllarında yaşamış önemli bir hukukçudur. İslâm hukuku mirasımızın taşıyıcısı ve yorumlayıcısı olarak,“Dürerü'l-Hükkâm Şerhu Mecelleti'l-Ahkâm adlı eseriyle Mecelle'yi şerh etmiş ve bu alanda yakın tarihimizde önemli hizmetler icra etmiştir. Ali Haydar Efendi, Dürerü'l-Hükkâm Şerhu Mecelleti'l-Ahkâm adlı eseriyle Mecelle'yi şerh etmekle kalmamış, ayrıca Mecelle'nin değinmediği hukuksal alanları tamamlamayı ve örneklendirmeler yapmak suretiyle somutlaştırmayı hedeflemiştir. Tezimiz, giriş, üç bölüm ve sonuçtan meydana gelmektedir. Girişte tezin adı, konusu, amacı, önemi, kapsam ve sınırı ile yöntem ve kaynakları ele alınmıştır. Birinci Bölümde; ”Ali Haydar Efendi ve Yaşadığı Dönem“ başlığı altında Ali Haydar Efendi'nin hayatı, ilmi kişiliği ve eserleri ile yaşadığı dönemin hukuki ve siyasi yapısı hakkında bilgiler verilmiştir. İkinci Bölümde, ”Ali Haydar Efendi ve Fıkıh Usulü“ başlığı altında; ”Ali Haydar Efendi ve Fıkıh“, ”Ali Haydar Efendi ve Şer'i Deliller“ konuları ele alınmıştır. Bu bölüm, tezimizin ana gövdesini oluşturmaktadır. Üçüncü bölümde ise; ”Ali Haydar Efendi ve Fıkhi Görüşleri“ başlığı altında ”Ali Haydar Efendi ve İctihad“, ”Ali Haydar Efendi ve Feraiz“, ”Ali Haydar Efendi ve Mefkud“, ve ”Ali Haydar Efendi ve Nafakat\" konuları ele alınmıştır."
