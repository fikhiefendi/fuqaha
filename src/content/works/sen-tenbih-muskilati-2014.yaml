abstract: "Hanefî fıkhının temsil gücü yüksek en önemli metinleri arasında kuşkusuz Mergînânî'nin (593/1197), el-Hidâye adlı eseri ayrıcalıklı bir yere sahiptir. Bu eser, yazıldığı dönemden itibaren büyük ilgi görmüş, eser üzerinde şerh, haşiye, ihtisar tarzında pek çok çalışma yapılmıştır. Hicrî 8.yüzyılda Şam bölgesinde yaşamış olan İbn Ebü'l-İz el-Hanefî (792/1390) Hanefî bir aileye mensup olup atalarının büyük çoğunluğu Şam'da bu mezhebin kadılığını yapmıştır. İbn Ebü'l-İz'in kendisi de Mısır ve Şam'da bir müddet Hanefî kadısı olarak görev yapmıştır. İbn Teymiyye (728/1328) başta olmak üzere mezhep dışındaki âlimlerin görüşlerinden de etkilenen İbn Ebü'l-İz, taklide karşı çıkıp ictihadî yaklaşımı benimsemiş bir âlim olup, bu yaklaşımını Hanefîliğin temel eserlerinden el-Hidâye'ye yönelttiği eleştirilerde de öne çıkarmıştır. İbn Ebü'l-İz, et-Tenbîh alâmüşkilâti'l-Hidâye adlı eserinde kimi zaman doğrudan el-Hidâye'ye yönelik kimi zamanda da Hanefî mezhebinin yerleşik ictihadlarına da bir takım eleştiriler yöneltmiş bulunmaktadır. Tamamen el-Hidâye üzerine yapılan eleştirileri ihtiva eden bir eser olması sebebiyle et-Tenbîh alâ müşkilâti'l-Hidâye adlı kitap büyük önem arz etmektedir. Bu çalışmamızda İbn Ebü'l-İz'in el-Hidâye'ye yönelik usulî itirazlarına yer verildiği gibi, el-Hidâye'yenin furû yönüne ilişkin itirazlarına da temas edilmiş ve bu itirazlar sistematik bir bütünlük içinde incelenmeye çalışılmıştır."
