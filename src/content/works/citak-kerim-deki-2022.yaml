abstract: "Kur'ân-ı Kerim'deki fıkhî hükümlerin evrenselliği veya tarihselliği konusu günümüzde İslam hukuku alanında yapılan en önemli tartışma konularından biridir. Her ne kadar tarihsel-eleştiri yöntemi Batı'da oluşmuş ve İslami kaynaklara ilk defa oryantalistler tarafından uygulanmış ise de bu mesele İslami ilimlerde çok erken dönemlerden itibaren farklı isimler ve yöntemler altında tartışılmaya başlanmıştır (mesela, sebebi nüzul, kıyas, istihsan, istislah vb.). Tezimizde tarih biliminin araştırma yöntemlerinden olan kaynak tarama/araştırma, tenkit, tasnif, tahlil ve tasvir yöntemleri kullanılarak tarihsel-eleştiri yönteminin Batı'daki oluşum nedeni, süreci, Kitab-ı Mukaddes üzerindeki uygulanma aşamaları, ona yöneltilen eleştiriler ve İslami kaynaklara uygulanış biçimi gösterilmiştir. Daha sonra İslam düşünce tarihinde evrensellik ve tarihsellik konusunda ortaya çıkan üç temel yaklaşım delilleriyle birlikte ortaya konulmuştur. Bunlar Kur'ân-ı Kerim'deki hukuki hükümleri bütün olarak evrensel gören, bütünüyle tarihsel olarak değerlendiren ve Kur'ân'ın içinde hem evrensel hem de tarihsel hükümlerin olduğunu kabul ederek bunları birbirinden ayırmak adına bir yöntem öneren görüşlerdir. Tezde bu yaklaşımlardan her birinin Kur'ân-ı Kerim'deki had ve kısas cezalarına uygulanması halinde ortaya çıkacak sonuçlar saptanmaya çalışılmıştır. Bu durumda evrenselci yaklaşıma göre Kur'ân'daki had ve kısas cezalarının bütünüyle evrensel olduğu, ikinci yaklaşıma göre ilgili hükümlerin tümüyle tarihsel olduğu ve üçüncü yaklaşıma göre ise söz konusu ahkamın genel olarak evrensel kabul edildiği tespit edilmiştir. Tezde fıkhî hükümlerin bütünüyle evrensellik veya tarihselliğini savunan ilk iki görüşün bazı çelişki ve çıkmazları tenkit edilirken son yaklaşım sahibinin önerdiği yöntemin ise yalnızca Kur'ân-ı Kerim'in ceza hukukuyla ilgili hükümleri üzerinde değil, diğer hukuk alanlarında da uygulanarak doğru sonuçlar elde edilebilecek bir yöntem olduğu belirtilmiştir."
