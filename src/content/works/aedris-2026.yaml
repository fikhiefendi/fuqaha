abstract: "İslami bankacılık sektörü, özellikle blok zinciri (blockchain) teknolojisine dayalı akıllı sözleşmelerin ortaya çıkmasıyla birlikte, dijital gelişmelerin etkisiyle niteliksel bir dönüşüm yaşamaktadır. Bu durum, söz konusu uygulamaların bankacılık faaliyetlerinin verimliliği üzerindeki etkisinin incelenmesini gerekli kılmaktadır. Bu çalışma, Birleşik Arap Emirlikleri'ndeki İslami bankalarda akıllı sözleşmelerin bankacılık performansının verimliliğini artırmadaki rolünü ortaya koymayı; akıllı sözleşmelerin mahiyetini ve potansiyelini açıklamayı; ayrıca İslami bankacılık sektörünün gelişimi ile operasyonel verimlilik arasındaki ilişkide aracı değişken olarak üstlendiği rolü ölçmeyi amaçlamaktadır. Çalışmada betimsel-analitik yöntem benimsenmiş, hipotezler test edilmiş ve değişkenler arasındaki istatistiksel ilişkiler modellenmiştir. Elde edilen bulgular, akıllı sözleşmelerin bankacılık verimliliği üzerinde doğrudan ve olumlu bir etkiye sahip olduğunu göstermiştir. Ayrıca, akıllı sözleşmelerin İslami bankacılık sektörünün gelişimi ile operasyonel verimlilik arasındaki ilişkiyi güçlendiren bir aracı değişken olduğu tespit edilmiştir. Bulgular aynı zamanda Birleşik Arap Emirlikleri'ndeki bankacılık ortamının bu teknolojilerin uygulanmasına hazır olduğunu ortaya koymuştur. Çalışma; dijital altyapının sürekli olarak geliştirilmesini, akıllı sözleşmelerin uygulama alanlarının genişletilmesini, uzmanlaşmış eğitim programlarının desteklenmesini, düzenleyici ve yasal çerçevelerin güncellenmesini ve finansal teknoloji şirketleriyle iş birliklerinin güçlendirilmesini önermektedir."
