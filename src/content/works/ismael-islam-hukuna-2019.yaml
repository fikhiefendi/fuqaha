abstract: "Şüphesiz hukuk nezdinde insanın hayatıyla ilgili durum; yaşadığı kesin olan, öldüğü kesin olan ve mefkûd/ gâip/yitik olan yani hayatta olup olmadığı tam bilinmeyen şeklinde üç kısma ayrılır. Araştırmamız, üçüncü durumdaki yani herhangi bir nedenle kendisinden haber alınamayan dolayısıyla hayatı veya ölümü hakkında kesin bir bilgi bulunmayan insanın hukuktaki durumunu ele almaktadır. Hukuk literatüründe bu kimseye mefkûd denir. Mefkûdun durumu, Irak anayasası dâhil olmak üzere pozitif hukuklarda büyük önem taşımaktadır. Ancak tüm bunlardan önce İslam hukuku bu meselenin üzerinde durmuş ve önemine vurgu yapmıştır. Mefkûdu; izine rastlanmayan, kendisinden haber alınamayan ve hayatta olup olmadığı bilinmeyen kişi şeklinde tarif etmeleri mezhep imamlarının konuya verdikleri önemi göstermektedir. Irak anayasası bu tanımdan esinlenerek mefkûdu“sağ olup olmadığı bilinmeyen kayıp kişi”şeklinde tarif etmiştir. Zaten Irak anayasası bu meseleyle ilgili birçok hükmünü İslam hukukundan almıştır. Araştırmamız, söz konusu meseleyi İslam hukuku ve Irak anayasası açısından ele almıştır. İslam hukuku ve Irak anayasasında kayıp kişiyle ilgili hükümler belirtilerek dört Sünnî mezhep ile Şiʻanın imâmiyye mezhebinin görüşleri arasında tercih yapılmıştır. Ayrıca hem kayıp kişi hem de ailesi ve malı ile ilgili hükümler belirlenmiştir. Çalışmada, mezhep imamlarının mefkûd/kayıp kimseyle ilgili hükümlerinde düştükleri ihtilaflar incelenmiştir. Çünkü bu konu özellikle günümüzde kayıp olaylarının sıklıkla yaşanması sebebiyle daha çok önem arz etmektedir. Çalışmamız; önsöz, giriş ve iki ana bölümden oluşmaktadır. Önsözde; araştırmanın konusu, önemi, hedefleri, önceki çalışmalar ve metoduna değinilmiştir. Giriş bölümünde; mefkûd kavramının sözlük ve terim anlamları ele alınmış ve bu kavram ile“esir”ve“gâip”kavramları arasındaki farka değinilmiştir. Ayrıca kaybın iki kısma ayrıldığını, bunlardan birinde kaybolanın zahiren selamet olduğu diğerinde ise zahiren helak olduğu kabul edildiği fakat her iki durumun da mefkûdun ortaya çıkmasıyla ya da ölümüyle sonuçlandığı belirtilmiştir. Birinci bölümde: İslam hukuku ile Irak anayasasında mefkûd kişinin hükümleri ele alınmıştır. İslam hukukuna göre, kayıp haberi mahkemeye sunulduğu andan itibaren kişi“mefkûd”kabul edilir ve bu durum kişinin ehliyetini etkileyip onun“kısıtlı kişi”sayılmasına sebep olur. Bu konuda Irak anayasası da İslam hukukuna uymuştur. Mefkûd kişinin ölmüş kabul edilebilmesi için hâkim bir zaman belirler ve bu süre zarfında bulunmadığı takdirde ölümüne hükmeder. Bu sürenin ne kadar olması gerektiği hususunda ise mezhep imamları arasında ihtilaf vardır. Bazıları ortalama yaşam süresini esas almış, bazıları bu süreyi birkaç sene ile sınırlandırmış diğer bazıları ise bununla ilgili kararı hâkimin inisiyatifine bırakmıştır. Araştırmamızda; konuyla ilgili kararı hâkimin inisiyatifine veren görüş tercih edilmiştir. Irak anayasasında ise; mefkûdun normal şartlarda kaybolması durumunda dört yıl, ancak ölüm tehlikesinin bulunduğu şartlarda kaybolması durumunda ise iki yıl bekleme süresi belirlenmiştir. Ayrıca mefkûd kişin eşiyle ilgili hükümler de bu bölümde ele alınmıştır. Çünkü nikâh konusunda da, mefkûdun yaşamına veya ölümüne kesin hüküm verilinceye kadar eşinin bir süre beklemesi gerekir. Ancak bu süre konusunda da mezhepler arasında ihtilaf bulunmaktadır ve her mezhep kaybın durumuna göre bekleme süresi belirlemiştir. Irak anayasası bu konuda Hanbelî mezhebine uymuştur. Bütün mezhepler, bekleme sürecinde eşinin nafaka hakkına sahip olduğu konusunda görüş birliği içerisindedirler. Irak anayasası da bu konuda mezheplerin görüşünü benimsemiştir. Fakat nafakanın olmaması durumunda kadının kayıp kocadan boşanma yetkisine sahip olup olmaması hususunda imamlar ihtilaf etmiştir. Hanefî ve İmamiyye mezhepleri bu durumda kadına boşanma hakkını vermezken, Mâlikî ve Hanbelî mezhepleri kadına bu hakkı vermişlerdir. Irak anayasası da bu hususta kadına bu hakkı tanımıştır. Evlilik ilişkisine olan ihtiyacı nedeniyle kadının kayıp olan kocasından boşanma hakkının olup olmaması konusunda mezhepler arasında ihtilaf bulunmaktadır. Şafiî, Hanefî ve İmamiyye mezhepleri kadına bu hakkı vermezken, Mâlikî ve Hanbelî mezhepleri ona bu hakkı vermişlerdir. Irak anayasası ise bu hususta net bir görüş belirtmemiştir. Mefkûd kimsenin nerede olduğu bilinmediği için, eşinin boşanma hakkına sahip olup olmadığı konusunda da mezhepler arasında farklı görüşler vardır. Hanefî, Şafiî ve İmamiyye mezheplerine göre kadın bu hakka sahip değildir. Fakat Mâlikî ve Hanbelî mezheplerine göre onun bu hakkı vardır. Irak anayasası ise, bu konuda Şafiî, Mâlikî ve İmamiyye mezheplerine uyarak sırf nerde olduğu bilinmediği için kadının Mefkûd kocasından boşanma hakkına sahip olmadığına karar vermiştir. Mefkûd koca hakkında ölüm hükmü verildikten sonra eşinin, tıpkı kocası ölmüş kadın gibi iddet beklemesi gerekir. Bu konuda İslam hukuku ile Irak anayasası arasında görüş birliği vardır. Mefkûd kişinin diğer akrabaları ile ilgili hükümler de bu bölümde ele alınmıştır. Bakmakla yükümlü olduğu kişilerin nafakalarının mefkûdun malından ödenmesi gerektiği hususunda İslam hukuku ile Irak anayasası arasında ihtilaf yoktur. Ayrıca mefkûd kişi ehliyeti kısıtlı olduğu için kayıp olduğu sürece, sahip olduğu bütün yetkilerini kaybeder. Yine bu bölümde mefkûdun malıyla ilgili hükümlere de değinilmiştir. Kaybolmadan önce tayin ettiği vekilinin veya kaybolduktan sonra hâkimin tayin ettiği vekilin mefkûd kişinin malında nasıl tasarruf etmesi gerektiği, mefkûdun vasiyeti ve mirası gibi konular da ele alınmıştır. İkinci bölümde: ölümüne yönelik hüküm verildikten sonra mefkûdun ortaya çıkması durumuyla ilgili hükümler üzerinde durulmuştur. Çünkü bu durumda, ölmüş kabul edildiği için kendisiyle ilgili verilen bütün hükümler düşer ve bütün hukuki hakları kendisine iade edilir. Zira kesin bilgi, şüphe üzerine verilen hükümleri ortadan kaldırır. Bu durumda hâlâ başkasıyla evlenmemesi veya evlenmiş ancak cinsel münasebet olmaması şartıyla kendisinden ayrılan eşinin geri dönmesini talep etme hakkına sahip olur. Fakat yeni kocanın, mefkûdun yaşadığından habersiz olması şartıyla kadınla cinsel ilişki yaşaması durumunda eski kocanın eşinin dönmesini talep etme hakkı düşer. Bu hususta mezhep âlimleri arasında ihtilaf bulunmamaktadır. Ancak Irak anayasası kaybolup sonra dönen kocaya değil yeni kocaya hak tanımıştır. Mefkûd kişi geri döndüğünde mallarını geri isteme hakkına sahiptir. Varislere verildikten sonra harcanan veya telef olan mallar hariç bütün malları kendisine iade edilir. Harcanan malların durumu ise mezhepler arasında ihtilafa neden olmuştur. Ancak Irak anayasası, nafaka için tüketilen mallar hariç diğer bütün malların geri verilmesine hükmetmiştir. Irak mahkemelerinde yaşananları bilmek için; mefkûd kişi, ailesi, malları ve geri dönüşü ile ilgili bazı örnekler ve adli kararlar bölümün sonunda zikredilmiştir. Sonuç bölümünde ise, araştırmada konuyla ilgili varılan en önemli noktalar aktarılmıştır."
