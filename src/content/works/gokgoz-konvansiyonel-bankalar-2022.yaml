abstract: "İşletmelerin finansal yeterliliği, dış ticaret yapabilmesini etkileyen önemli hususlardandır. İşletmeler, ithal edeceği mal ve hizmetlerin bedelini ödeyebilmek veya ihraç edeceği malların üretimi esnasında ortaya çıkan maliyetleri karşılamak için finansmana ihtiyaç duyarlar. Firmalar, ihtiyacı olan finansman için özkaynaklarının yetersizliğinden ya da maliyet açısından yabancı kaynaklara yönelebilirler. Yabancı kaynakların temini ise çoğu durumda bankalardan sağlanır. Bankalar, finansman sağlamanın yanı sıra dış ticaret işlemi yapan işletmelerin teslim ve ödemelerine aracı rol üstlenirler. Türkiye'de 1985 yılında faaliyetlerine başlayan katılım bankaları faizsizlik prensibiyle faaliyetlerini sürdürmekte ve bu bakımdan konvansiyonel bankalardan ayrışmaktadır. Riba ve faizle ilgili tartışmalar artmakta ve iki banka türünün farklı açılardan karşılaştırılmasına ilişkin literatür çoğalmaktadır. Ancak konvansiyonel ve katılım bankalarının dış ticaret işlemlerindeki rolüne ilişkin çalışmaların az sayıda oluşu konunun bu kapsamda incelenmesini önemli hale getirmektedir. Bu önemle, dış ticaret işlemlerinin konvansiyonel ve katılım bankaları açısından karşılaştırılması, elde edilen bulgularla düzenleyici otoritelere öneriler sunulması ve literatüre katkı sağlanması amaçlanmıştır. Çalışma kapsamında konvansiyonel ve katılım bankaları açısından dış ticaret işlemlerinin karşılaştırılması içerik analizi ile yapılmıştır. Analiz sonucunda dış ticaret teslim ve ödeme şekillerinin iki banka türü arasındaki uygulamasının genel anlamda aynı olduğu, temel farklılıkların şekilsel yönden olduğu ve dış ticaret finansman yöntemlerinin de genel anlamda aynı olduğu tespit edilmiştir. Dış ticaret finansman yöntemlerinden bazılarının bankaların yalnızca birinde uygulanabildiği ve ortak finansman yöntemlerinin banka uygulamalarındaki farklılıklarının vade, limit, döviz cinsi ve maliyet olduğu gözlenmiştir."
