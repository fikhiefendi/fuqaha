abstract: "Şüf'a hakkı; bir akde konu olan, satılmış bir taşınmazın aynı bedelle ve satıcının rızasına bakılmaksızın mülk edinilmesidir. Fakat bunun gerçekleşebilmesi için paydaşlık, komşuluk ve irtifak gibi birtakım sebeplerin varlığı gerekmektedir. Hakkın kullanılabilmesi için gereken ise geçerli bir satışın olmasıdır. Şüf'a hakkı Türk Hukuku'nda 'önalım' kavramıyla ifade edilir. Paydaşlıktan doğan yasal önalım hakkı ve sözleşmeden doğan önalım hakkı olmak üzere iki başlıkta incelenir. Önalım hakkı, Türk hukukuna kıyasla İslâm hukukunda çok daha geniş bir kapsama sahip olsa da özü itibariyle amacı yabancıdan gelebilecek zararın önlenmesi ve ferdi mülkiyetin yaygınlaştırılmasıdır."
