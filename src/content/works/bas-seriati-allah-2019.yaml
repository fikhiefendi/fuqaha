abstract: "Ali Şeriati, XX. yy sonlarında yaşamış, İslam dünyasının yetiştirdiği önemli bir sosyolog ve mütefekkirdir. Her ne kadar birçok eseri, çeşitli yerlerde verdiği konferansların yazıya dökülmesiyle oluşsa da, çok sayıda eseri mevcuttur. Ali Şeriati‟nin tüm eserlerini; insan, toplum ve din başlıkları altında toplayabiliriz. Sadece kendi toplumunu ya da İslam toplumlarını değil, tüm insanlığı eleştiriye tabi tutup, hangi kriterlerle ve ölçülerle hareket etmek gerektiği konusunda kafa yormuştur. „‟Kendisi Olmayan İnsan‟‟ adlı eserinde insanın kendine yabancılaşmasını son derece keskin ve net bir biçimde ele almıştır. Biz de Müslümanların, Allah‟ın insan ve toplum ile ilişkisini değerlendirmelerine katkı amaçlı bu çalışmayı yaptık. Çalışmamızın tümü, Ali Şeriati‟nin konu hakkındaki düşünce ve değerlendirmelerinden oluşmaktadır."
