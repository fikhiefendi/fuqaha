abstract: "Bu çalışma, Türkiye'de 2003 yılında faaliyete geçen Bireysel Emeklilik Sistemi (BES) içerisinde, faiz hassasiyeti olan bireylerin sisteme dahil edilmesini sağlayan faizsiz fonların gelişimini ve katılımcı tercihleri üzerindeki etkilerini incelemektedir. Sosyal güvenlik sistemlerinin demografik değişimler nedeniyle yaşadığı mali zorluklar, bireysel tasarrufa dayalı tamamlayıcı emeklilik modellerini zorunlu hale getirmiştir. Türkiye gibi muhafazakar tasarruf eğilimlerinin güçlü olduğu bir ülkede, sistemin başarısı finansal kapsayıcılığın sağlanmasına bağlıdır. Çalışmada, 2013 yılındaki Devlet Katkısı reformu ve 2017'de yürürlüğe giren Otomatik Katılım Sistemi (OKS) ile birlikte faizsiz fonların pazar payındaki değişimler veriler ışığında analiz edilmiştir. Araştırma sonucunda, faizsiz fonların başlangıçta oldukça düşük olan payının, 2025 yılı sonu itibarıyla toplam BES fonları içerisinde %40 bandına yaklaştığı görülmüştür. Özellikle altına dayalı fonlara olan yoğun ilgi,“yastık altı”olarak tabir edilen kayıt dışı birikimlerin sisteme kazandırılmasında faizsiz seçeneklerin kritik bir rol oynadığını doğrulamaktadır. Ayrıca, faizsiz fon tercih eden katılımcıların sistemde kalma eğiliminin daha yüksek olduğu ve bu fonların uzun vadede enflasyonun üzerinde getiri sağlayarak başarılı bir performans sergilediği saptanmıştır. Sonuç olarak, faizsiz enstrümanların çeşitlendirilmesi ve bu alanda faaliyet gösteren şirket sayısının artırılması, hem finansal derinliğin artması hem de ulusal tasarruf oranlarının yükselmesi açısından stratejik öneme sahiptir."
