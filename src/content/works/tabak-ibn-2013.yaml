abstract: "İbn Teymiyye ve İbn Kayyim Hanbelî mezhebinin yetiştirdiği önemli kişilerdendir. Dönemlerinde birçok kişi ve ekollere önemli tenkitler yöneltmişlerdir. Ehl-i hadis ekolüne mensup olan İbn Teymiyye ve öğrencisi İbn Kayyim ehl-i re?y ekolünün temsilcileri olan Hanefîleri birçok farklı konuda eleştirmişlerdir. Çalışmamız namaz konusunda dile getirdikleri tenkitleri ele almaktadır. Örnek olarak tercih edilen namaz konusundan önce usul düşünceleri (metodolojik yaklaşımlar) ele alınarak; Kur?ân-ı Kerim ve sünnet ile ilgili bazı konular ile ikincil delillerden bazıları incelenerek ihtilafa sebep olan noktalar tespit edilmeye çalışılmıştır. Bunun yanında yine fıkıh usulü ilminde önemli yere sahip; ictihad (müctehid), taklid (mukallid), bid'at, ibadet, adet, müdaveme, mezheb, ve ihtilaf gibi bazı temel kavramlar incelenmiştir. Böylelikle örnek olarak seçilen namaz konusunda görülen ihtilaf ve yapılan tenkitlerin belli kural ve prensiplere göre yapıldığı ifade edilmeye çalışılmıştır. Anahtar Kelimeler : İbn Teymiyye, İbn Kayyim, Hanefiler, Tenkitler"
addedAt: 2026-09-24
