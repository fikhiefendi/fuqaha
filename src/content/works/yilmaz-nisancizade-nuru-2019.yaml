abstract: "On yedinci yüzyılda yaşamış bir Osmanlı fakihi olan Nişancızâde, Şeyh Bedreddin'in muamelat ve yargılama hukukuna dair olan ve gayr-i resmi bir kanun olarak uzun yıllar mahkemelerde kullanılan eseri Câmi'u'l Fusûleyn'i ıslah etme amacıyla Nûru'l-'Ayn fi Islâhi Câmi'u'l Fusûleyn'i kaleme almıştır. Bu tez, Nûru'l-'Ayn ile Câmi'u'l Fusûleyn'in 7-11. fasıllarının mukayesesi ile ilk eserin zikredilen fasıllarının tahlilini içermektedir. Yapılan mukayese ve tahlil, esas itibarıyla Nişancızâde'nin tasarruflarının tespitine yöneliktir. Çalışmamız iki bölümden oluşmaktadır. İlk bölümde fasılların muhtevası hakkında bilgi verilmiş, iki eser arasındaki üslup ve telif tarzından kaynaklanan farklılıklar ele alınmıştır. Ayrıca Nişancızâde'nin tercih ve tenkitleri ile Nûru'l-'Ayn'a eklediği ya da dahil etmediği mesele ve görüşlere yer verilmiştir. İkinci bölümde müellif hatlı iki yazma nüsha esas alınarak bu fasıllar tahkik edilmiştir."
