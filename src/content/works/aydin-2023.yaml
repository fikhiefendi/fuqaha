abstract: "İslam hukukunda özgürlük sorumluluk ve teklifin konusu olduğundan dolayı hukukî hükümler ona bağlıdır. bu insan ırkının düşünme ve seçim hakkı olmayan diğer tüm yaratıklar üzerindeki onurudur. Öylelikle özgürlük bir müslüman toplum inşa etmede ve onu şüphelerin, yabancı ithal terimlerin ve sapkın ideolojilerin etkisinden kurtarmada büyük etkiye sahiptir. Bu araştırma ile öncelikle İslami özgürlüğün doğru kavramlarına abartmadan ve ihmal etmeksızın yaklaşmanın Yanı sıra, özgürlük düşüncesinin türleri ve düzenleyici kontrolleri ile İslam hukukunda temel bir kriter olduğunu dile getirmek ve aynı zamanda onun genel olarak İslam dünyası ,özellikle Doğu Türkistan'da fikrî, sosyal ve siyasî alanlarda İslami kavramların geliştirilmesinde olumlu etkilere sahip olduğunu ortaya koymaktır."
