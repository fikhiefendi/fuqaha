abstract: "Dünyadaki yoksul insan sayısının artış göstermesi, toplumların yeterli bir seviyedeki eğitim ve sağlık imkanlarından mahrum olması, cinsiyet eşitsizliklerinin oluşması ve küresel ısınmaya bağlı olarak gerçekleşen çevresel sorunların artış göstermesi gibi temel sorunlar, Birleşmiş Milletler çatısı altındaki devletleri 'Sürdürülebilirlik' adı altında kalkınma programları oluşturmaya teşvik etmiştir. Bu kapsamda finansal, sosyal ve çevresel hedefler başta olmak üzere, 2030 yılına kadar ulaşılması amaçlanan 'Sürdürülebilir Kalkınma' hedefleri belirlenmiştir. Katılım bankacılığı sistemi de sürdürülebilir kalkınmanın gerçekleştirilmesinde potansiyel bir role sahip olup, kendi değer ve prensipleri doğrultusunda finansal kapsayıcılığın gelişmesini, toplumsal fayda esaslı finansmanları ve çevre dostu faaliyetleri desteklemektedir. Bu doğrultuda Türkiye'deki katılım bankalarının sürdürülebilirlik faaliyetleri mercek altına alınarak, doküman analizi ve derinlemesine mülakat tekniklerinin de yardımı ile hem sosyal ve çevresel fayda için, hem de katılım bankacılığının gelişmesi için atılması gereken adımlara vurgu yapılmıştır. Özellikle 'Yeşil Sukuk' ve 'Mikro Kredi' gibi enstrümanlar ile ürün yelpazesinin genişletilmesi, Birleşmiş Milletler Çevre Programı (UNEP) gibi uluslararası kurumlar ile ortaklıklar gerçekleştirilmesi, sosyal sorumluluk projelerinin sistematik bir şekilde yürütülmesi, özkaynak finansmanının ön plana çıkartılması, iklim değişikliğine pozitif etki oluşturmak amacı ile kredi politikalarının revize edilmesi ve müşteri odaklılık ilkesinin baz alınması en önemli sürdürülebilirlik adımları arasında yer almaktadır. Sürdürülebilirlik faaliyetlerini kurum stratejisi olarak benimseyen firmaların, kamuoyu nezdindeki itibar ve prestijlerindeki artışın yanı sıra ürün ve hizmet yelpazesinin genişlemesi ile birlikte işlem kârlılıklarının artması da sürdürülebilirlik faaliyetlerinin pozitif çıktıları arasında yer almaktadır."
