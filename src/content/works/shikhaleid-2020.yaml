abstract: "Çalışmada, Vakıf fonları ve Vakıflar nezdinde zengin olan Gazze Şeridi'ne yapılan yatırımlar ile vakıf mallarının niteliği ve ekonomik kalkınmanın sağlanmasında oynadığı rol, Vakıf fonlarının yatırımlarının kontrolleri ve şeriatın yatırımdaki kastı gösterilerek yatırımlara ışık tutulması amaçlanmış ve son olarak bu çalışma Gazze Şeridi'nde Vakıf fonlarının uygulama ve yatırım biçimlerini incelemeyi hedeflemiştir. Bu hedeflere ulaşmak ve araştırmanın hipotezini doğrulamak için araştırmacı tanımlayıcı analitik yöntemi kullanmıştır. Çalışma şu sonuca varmıştır: Gazze Şeridindeki Vakıf mülkleri, topraklara, İslami ve tarihi alanlara ve sabit nesnelere bölünmüştür. Vakıf ve Diyanet İşleri Bakanlığı'na ait Mülkiyet Müdürlüğü aracılığıyla yönetilmektedir. Çalışma, Gazze Şeridindeki bağışların yasalarının, Osmanlı döneminde Muhammed Qadri Paşa'nın adalet ve adalet yasasından ilham aldığını ortaya koymuştur. İngiliz yasalarına ve Mısır yasalarına ek olarak, Vakıf ile ilgili hiçbir Filistin yasası ve yasal hüküm bulunmamaktadır. Öte yandan, Gazze Şeridi'nde Vakıflara yatırım yapma şekilleri değişti. Bunun başında 'Normal İcarah' yöntemi gelmektedir ve bu bölgede en yaygın olan yöntem olmakla beraber Vakıflar müdürlüğünde de kullanılmaktadır. Bir yeni yöntem de 'İcarah Muntahah Bittamleek' olarak isimlendirilmektedir ve bu da sektördeki öncülerinden daha az yaygındır. Vakıflar Bakanlığı, beş ildeki müdürlükleri aracılığıyla Gazze'deki Şeriat Mahkemesinin onayından sonra Vakfın görünür menfaati olması durumunda faaliyetlerini yürütmek için bir finansman kaynağı olarak nakde çevirme yöntemine dayanması şeklinde değişiklik yapmıştır."
