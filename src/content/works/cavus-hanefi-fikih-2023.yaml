abstract: "Okumakta olduğunuz çalışma, Osmanlı coğrafyası ve bu coğrafya dışında telif edilen otuz yedi Hanefî usul eserinin“Ahbâr/Sünnet”adlı bölümlerinin tarihi seyir içerisinde değişiminin görülmesi amaçlanmıştır. Araştırma yapılan konuya dair mevcut literatürdeki çalışmalar göz önüne alındığında kitap, şahıs, coğrafya veya dönemler esas alınarak monografik bir şekilde yapıldığı ve böylece bütüncül bir çerçeve çizemediği görülmektedir. Bu durumun tarihi seyir içerisindeki değişim açısından tatmin edici neticeler sunmadığı düşünülerek daha geniş kapsamlı ve panoramik olarak incelenmesi uygun görülmüştür. Yapılan araştırmalar neticesinde eserlerin ilgili bölümlerindeki konular ve konular içerisindeki taksimlerin farklı olduğu gözlemlenmesi temel problem olarak kabul edilmiş ve bu gözlem sonucundaki farklılıklar somut hâle getirilmek istenmiştir. İncelenmesine karar verilen eserlerin ilgili bölümleri detaylıca tahlil edilerek panoramik şemalar çıkartılmış ve birbirleri ile mukayese edilmesiyle Osmanlı uleması üzerinde etkisi olan usul eserleri tespit edilmiştir. Birbirleriyle irtibatlı olduğu saptanan eserlerin birbirlerinden istifade ettikleri noktalardan da bahsedilerek Hanefi usul eserlerindeki“Ahbâr/Sünnet”bölümleri özelinde Hanefî usul düşüncesine dair birtakım sonuçlar elde edilmeye çalışılmıştır."
