abstract: "Kefâet (denklik) konusu, İslâm Aile Hukukunun ilgi alanına giren ve evlilik öncesinde dikkate alınması gereken önemli bir konudur. İslâm hukuku aile hayatıyla ilgili prensipler koyarken, aile hayatının kalıcılığını sağlayacak eşler arasındaki uyumun önemine dikkat çekmiştir. Söz konusu uyum ise evlenecek kişiler arasında nesep (soy), baba ve dedenin müslüman olması, dindarlık, hürriyet, meslek, mal ve zenginliğin bulunması, fizikî kusurların bulunmaması gibi bir çok hususlarda denkliğin olması ile gerçekleşmektedir. Bu özelliklem İslâm hukukçuları tarafından evlilikten beklenen neticelerin meydana gelmesinde olumlu rol oynayacağı düşünülmektedir. Araştırma için seçilen bu konu hakkında daha önce akademik anlamda herhangi bir çalışmanın yapılmamış olması, bu konunun belli bir uyum ve sistematik içersinde ele alınmasında bir takım zorluklan da beraberinde getirmiştir. Bu çalışmada öncelikli olarak, evlilik ve kefâet kavramlarıyla ilgili bilgiler verilerek, kefâetin İslâm hukukundaki yeri ve önemine değinilmiştir. Yine burada bir alt başlık altında semavî dinlerde ve Cahiliye dönemindeki kefâet anlayışından bahsedilmiştir. Daha sonra çalışmanın temeli olarak ele alınan kefâetin hukukî dayanağı, kefâetin şart koşulduğu alanlar ve İslâm hukukçularının kefâet hakkındaki görüşleri delilleri ile birlikle ele alınmıştır. Ayrıca kefâetin kadında değil erkekte aranması gerektiğinin altı çizilmiş ve genel olarak İslâm hukukunda kefâetin mahiyeti üzerinde durulmuştur. Kefâetle ilgili hükümlerden bahsedilirken kefâeti şart koşma zamanı, yetkisi ve kefâetin bulunmamasının doğuracağı hukukî sorunlar anlatılmaya çalışılmıştır. Son bölümde Osmanlı Aile Hukuku Kararnamesinde, XX. Yüzyıl İslâm Aile Hukuku Kodları nda, Medeni Hukuk1 ta ve günümüzde eş seçimi ve kefâetin durumu belirlenmeye çalışılmıştır. Sonuçta ise erkek ve kadın arasında kadın aleyhine olacak şekilde açık bir denksizliğin bulunması halinde bundan her iki tarafın da rahatsız ve mağdur olacağı, bu tür bir evliliğin yürüme şansının çok az olduğu, bu sebeple aile içi ihtilafları ortaya çıktıktan sonra önlemek yerine başlangıçta buna imkân vermemek gerektiği düşüncesiyle eşler arasında kefâetin bulunmasının gerekliliği vurgulanmıştır. Ayrıca evlilik hayatında istikrann olması ve evliliğin amacına ulaşılabilmesi; yani eşlerin huzur ve mutluluk içinde yaşayabilmeleri için araları nda kefâet bulunmasının önemli olduğu belirtilmiştir."
