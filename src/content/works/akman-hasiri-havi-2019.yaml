abstract: "Bu çalışma, Ebû Bekr Muhammed b. İbrahîm el-Hasîrî'nin“el-Hâvî fi'l-Fürû”adlı eserinin,“ibadetler”bölümünün edisyon kritiği, yani tahkikli neşrini konu edinmiştir. Tezin amacı, bu eserin müellifini ve eserlerini tanıtmak ve ilgili eserin yazma nüshaları arasında karşılaştırmalar yaparak“ibadetler”bölümünü orjinaline en yakın haline ulaşmaktır. Tez araştırmanın konusu, amacı, önemi, yöntemi ve kaynaklarını ele alındığı giriş, müellifin hayatı ve eserleri ve“el-Hâvî fi'l-Fürû”adlı eserin müellife aidiyetinin ve kaynaklarının, ayrıca tahkik yönteminin incelendiği birinci bölüm ve“ibadetler”bölümünün tahkikli neşrine yer verilen ikinci bölümden oluşmaktadır. Eserin Süleymaniye Kütüphanesi Carullah Bölümü 627 nolu nüshası, okunarak tashih edildiği için tahkikte asıl nüsha olarak belirlendi."
