abstract: "Müşareke Sukuku, İslam hukukunda bilinen Müşareke (ortaklık) akdi esasına göre verilir ve bu akdin tüm hükümlerine ve kurallarına tabidir. Müşareke Sukuku, İslami finansman araçlarının en önemlilerinden birisi kabul edili. Çünkü ülkeler ve finans kurumları bu senetleri, bir kuruluş için tek başına finansmanı güç büyük projeleri finanse edebilmek için ihrac ederler. Yukarıdakilere dayanarak, bu çalışma ihrac, kar dağıtımı, geri ödeme ve tedavül yolları ve piyasaya sürme araçlarının izahına atıfta bulunarak, tanıma, mahiyetini, türlerini, özelliklerini, diğer mali evraklarla aralarındaki temel farkları açıklama itibarıyla Müşareke Sukunun net ve kapsamlı bir resmini oluşturmayı amaçlamaktadır. Çalışma aynı zamanda, kar ve zararların dağıtımı, geri alınması, tedavül ve piyasaya sürmeyle ilgili meselelerin kurallarını ve düzenlemelerini açıklığa kavuşturmak suretiyle, Müşareke Sukuku ile igili fıkhi hükümlerin incelenmesini içermektedir. Ayrıca, katılım sertifikalarıyla projelerin finansmanı için tekliflerde bulunma yanında, Sudan deneyiminin gözden geçirilmesine atıfta bulunmuştur. Çalışma, Müşareke Sukukunu çıkarılması sürecinin, önemli bir ekonomik faaliyet ve projeleri finanse etmek için likidite yokluğunda fonları çekmek ve harekete geçirmek için etkili bir araç olduğu sonucuna varmıştır. Ancak, bu konuda yasal kuralların olması gerekir, bu nedenle ancak Hukuk Komitesinin onayından sonra sertifikaların ihracının yapılması gerekir."
