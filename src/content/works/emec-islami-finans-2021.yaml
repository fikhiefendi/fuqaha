abstract: "İstikrarlı ve sürdürülebilir bir ekonomik büyümenin sağlanabilmesi, ülkelerin temel makro iktisadi hedeflerinden birini oluşturmaktadır. Bu hedef doğrultusunda uygulanan politikalar arasında, ekonomik büyümenin belirleyicilerinden finansal gelişmişlik düzeyini artırmaya yönelik uygulamalar da bulunmaktadır. Özellikle az gelişmiş ve gelişmekte olan ülkelerde finansal piyasaların iyi işlemediğinin bir göstergesi olan tasarruf açığı sorununu giderebilmek için“yastıkaltı”olarak nitelendirilen atıl durumdaki fonların reel ekonomiye kazandırılmasına yönelik politikalar uygulanmaktadır. Bilhassa Müslüman nüfusun yoğun olduğu ülkelerde fonların atıl durumda olmasının önemli bir nedeni olarak dini gerekçelerle karar birimlerinin geleneksel finans sistemine mesafeli olduklarına dair tartışmalar bulunmaktadır. Bu tartışmalar ışığında, ülke ekonomilerinde politika yapıcıları tarafından geleneksel finans sistemine alternatif olarak son yıllarda İslami finans sisteminin geliştirilmesine yönelik politikalara başvurulmaktadır. Bu noktadan hareketle çalışmada, son yıllarda önemi giderek artan ve daha fazla ülkede uygulama alanı bulan İslami finans sistemi konu edinilmekte ve İslami finans gelişimi ile ekonomik büyüme arasındaki ilişkinin ampirik açıdan incelenmesi amaçlanmaktadır. Bu amaçla çalışmada, dünya genelinde en fazla İslami finans varlıklarına sahip olduğu belirlenen 40 ülkede, İslami finans gelişimi ile ekonomik büyüme arasındaki ilişkiler, panel veri analiz metodolojisi izlenilerek ekonometrik açıdan incelenmektedir. Çalışmada, İslami finans gelişiminin ekonomik büyüme üzerindeki etkilerini incelemek üzere Cobb-Douglas üretim fonksiyonunun genişletilmesine dayalı olarak tanımlanan ekonometrik modeller, yatay kesit bağımlılığını dikkate alan panel veri analizi kapsamında ve 2012-2018 dönemi için analiz edilmektedir. Analiz sonuçlarına göre; örneklemi oluşturan 40 ülkede, inceleme döneminde İslami finans gelişimi ekonomik büyümeyi pozitif ve istatistiki açıdan anlamlı bir şekilde etkilemektedir. Örneklemdeki ülkelerde İslami finans gelişiminin ekonomik büyümeyi olumlu bir şekilde etkilediğini gösteren bu sonuçlar, istikrarlı ve sürdürülebilir ekonomik büyümenin sağlanabilmesine yönelik olarak ülkelerin izleyebileceği politikalar arasında İslami finans piyasalarının geliştirilmesine dair politikaların da bulunabileceğini ortaya koymaktadır."
