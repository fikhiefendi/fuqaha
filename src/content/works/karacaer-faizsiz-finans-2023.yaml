abstract: "Faizsiz finans sisteminin doğası gereği FFK'ların tüm faaliyetlerinin fıkhi ilke ve kurallar çerçevesinde yürütülmesinin gerekmesi, geleneksel kurumsal yönetişim anlayışından farklı özgün bir fıkhi yönetişim sisteminin geliştirilmesi ihtiyacı ile sonuçlanmıştır. Bu çalışma; fıkhi yönetişimin kavramsal çerçevesi ile fıkhi yönetişim sürecinin açıklandığı, farklı ülkelerin uygulamalarının karşılaştırmalı olarak incelendiği ve Türkiye'deki fıkhi yönetişim düzenlemelerinin değerlendirildiği üç ana bölümden oluşmaktadır. Çalışma i) Fıkhi Yönetişime Yönelik Yaklaşımlar, ii) Danışma Komitesinin Rolleri, iii) Danışma Komitesi Üyelerinin Nitelikleri, iv) Operasyonel Prosedürler ve vi) Fıkhi Yönetişimin Gelişimine Yönelik Görüş ve Öneriler olmak üzere altı üst başlıktan oluşan bir yaklaşımla Türkiye'deki fıkhi yönetişim uygulamalarını araştırmakta ve analiz etmektedir. Bu amaçla nitel araştırma yönteminin bir parçası olarak sektörde fıkhi yönetişim alanında yer alan katılımcılarla yarı yapılandırılmış görüşmeler gerçekleştirilmiştir. Çalışmanın bulguları belirlenen alanlarda fıkhi yönetişim uygulamalarında bir takım zayıflık ve eksiklikler olduğunu ortaya koymaktadır. Son olarak teorik ve ampirik analizlere dayalı olarak, fıkhi yönetişim sistemini geliştirmek amacıyla önerilerde bulunulmaktadır."
