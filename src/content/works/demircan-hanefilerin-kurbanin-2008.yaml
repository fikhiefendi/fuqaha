abstract: "Bu araştırmamızı bir bütün olarak ele aldığımız zaman kurban ibadetinin Hz. Âdem'den beri süre gelen bir ibadet olduğunu görürüz. Nitekim Hz. Âdem'in oğulları olan Habil ve Kabil'in kurbanları hakkında yüce kitabımız Kur'an-ı Kerim'de bir takım bilgilere ulaşmak mümkündür. Bundan dolayı kurban ibadetinin Hz. Âdem'den bu yana ilahi kaynaklı bir ibadet olduğunun su götürmez bir gerçeği yansıttığını ifade etmemiz gerekmektedir.Ancak ilk insanlardan bu yana varlığını sürdüren kurban ibadeti Hz. İbrahim'in oğlunu Allah'a kurban etmek istemesi ve İslam dininin Kur'an-ı Kerim ve Hz. Muhammed (s.a.v.) vasıtasıyla insanlara Allah katındaki tek din olarak tebliğ edilmesinden sonra yeni bir ivme kazanmıştır. İslam fakihleri de kurban ibadetinin İslam'ın bölünmez bir parçası olduğu hususunda ittifak etmişlerdir. Sadece kurbanın hükmünün vacip mi yoksa sünnet mi olduğu hususunda ihtilafa düşmüşlerdir. Burada Hanefilerin başını çektiği bir grup İslam fakihi mükellefiyet şartlarını taşıyan herkese kurbanın vacip olduğunu ileri sürerlerken bu iddialarını Kur'an ve Sünnetten delillerle desteklemeye çalışmışlardır. Cumhur olarak adlandırdığımız İslam fakihlerinin çoğunluğu ise kurbanla ilgili ileri sürülen delillerin kurbanın vücubiyetine delalet etmediğini dolayısıyla kurban ibadetinin vacip değil sünnet olduğunu ancak; terk edilmemesi gereken bir sünnet olduğunu ileri sürmüşlerdir.Biz bu çalışmamızın birinci bölümünde kurbana tarihsel açıdan yaklaşarak İslâm öncesi kurban ibâdetini ele aldık. Çalışmamızın ikinci bölümünde ise, Hazreti Âdem'den buyana varlığını sürdüren kurban ibâdetinin İslâm'ın Cenab-ı Hakk tarafından tek din olarak gönderilişinden sonra nasıl bir sürece girdiğini ve İslâm literatüründeki yerini inceledik. Çalışmamızın üçüncü bölümünde ise, Hanefi mezhebinde kurban mükellefiyetini değindik. Çalışmamızın dördüncü ve son bölümünde ise, Hanefiler'de farz-vâcip ayrımı ve Hanefiler'in kurbanın vücûbiyetiyle ilgili delillerini ele aldık ve bu delillerin değerlendirilmesiyle çalışmamızı bitirdik.Bu çalışma neticesinde şunu da ifade etmeliyiz ki, Hanefiler'in ve Cumhur'un Kur'an ve sünnetten getirdikleri deliller dikkatli bir şekilde incelendiği zaman her iki tarafın fakihlerinin de sağlam deliller ışığında hareket ettiklerini ve vacip-sünnet ayrımında sadece lafzî bir ayrıma gittiklerini görmekteyiz. Netice itibariyle Hanefi fakihlerin ileri sürdükleri deliller ışığında kurbanın vücubiyetine hükmetmeleri Cumhurun görüşüne muhalefet etmemektedir. Dolayısıyla kurbanın vacip olduğu görüşü isabetli bir görüştür denilebilir."
