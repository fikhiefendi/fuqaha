abstract: "Teklifî hükümlerden olan vâcip kavramı, delilleri kesin olmamasından dolayı, Hanefî mezhebince farzdan ayrı bir konuma yerleştirilmiştir. Farz, Şâri'in kesin delillerle, yapılmasını istediği hükümdür. Vâcip ise yapılması istenmekle beraber, hakkındaki deliller zannî olan hükümlerdir. Bu sebepten dolayı, vâcibin yapılması konusundaki hassasiyet, farza göre daha alt bir seviyede tutulmuş ve vâcibin inkârı farzın inkârının aksine küfrü gerektiren bir durum olarak kabul edilmemiştir. Vâcip ile farz arasındaki farklılıklar, ibadetler alanına da yansımış, delilin kesin olup olmamasına bağlı olarak, Hanefî mezhebinde vâcip olarak kabul edilen bir ibadet, diğer mezheplerde farz veya sünnet olarak kabul edilmiştir. Bir ibadetin farz, vâcip veya sünnet kabul edilmesi, öncelikle, usûl açısından incelenmesi gereken bir olgudur. İslam hukukunda hükümlerin tespiti, doğrudan delillerin tespitiyle mümkün olmaktadır. Farz ile vâcip arasındaki fark, pratik alanda değil, teorik ve teolojik alanlardaki yansımalarda ortaya çıkan bir durumdur. Farzın terki ile vâcibin terk ve tehiri meselesi ameli alanda müessir olsa da bizim burada kastettiğimiz fer'i farklılık değil, teorik farklılığın neticesi ile alakalıdır."
