abstract: "Geçmiş uygarlıkların neredeyse tümünde ve İslam topluluklarında kölelik sistemi uygulanmıştır. Bu minvalde kölelik sistemi 19. yüzyılın ikinci yarısına kadar İslam Hukuku ile ilintili olarak Osmanlı imparatorluğunda da kendine yer bulmuştur. Şer'iyye sicilleri kölelik sistemi ve kölelerin Osmanlı toplum hayatındaki yerine dair epeyce zengin malzeme ihtiva etmektedir. Bu tezde şeri'yye sicillerine bağlı olarak XVII. yüzyılın ilk yarısında Trabzon Eyaletinde köleler çalışılmıştır. Bu tezde 1826/1827/1828/1829/1830 numaralı Trabzon Şeriyye sicilleri ana kaynak olarak kullanılmıştır. Bu siciller Hicri 1038-1054 ve miladi 1628-1644 yılları arasındaki kayıtları ihtiva etmektedir. Tez üç bölümden oluşmaktadır. Birinci bölümde köleliğin tarihi üzerinde durulmuştur. İkinci bölümde 17. Yüzyılın ilk yarısında Trabzon'da köleliğin durumu üzerinde durulmuştur. Son bölümde ise kölelikle ilgili kayıtlar değişik başlıklar altında gruplandırılarak belirtilen yıllar içinde kölelerin toplum hayatındaki yerine ışık tutulmaya çalışılmıştır."
