abstract: "İslâm'ın ilkelerine ve nassa aykırı olmayan örf ve âdete fıkhî sonucun belirlenmesinde itibar edilmiştir. Ancak bu durum fıkhî yazım türleri içinde farklı şekillerde tezahür etmiştir. Hüküm istinbat metotlarının ele alındığı usûl eserlerinde örf ve âdet delil olarak doğrudan ele alınmazken, fürû' eserlerinde örf ve âdete sıklıkla müracaat edildiği bilinmektedir. Ayrıca bu kavramların herhangi bir ayrıma tabi tutulmaksızın bazen birbiri yerine bazen de müstakil olarak kullanılmış olması, onların hukuki hükümdeki rollerini ayırt etmeyi güçleştirmekte ve fıkıh literatüründe ifade ettiği anlamların yeterince açıklığa kavuşturulmadan ele alınmasına neden olmaktadır. Bu tezde, fıkıh literatürü içinde özel yazım türleri olarak kabul edilen furûk ve kavâid eserlerinde örf ve âdetin tuttuğu yer ve nasıl kullanıldığı özel olarak incelenmiş olup, araştırmada bu literatürün hicrî V-X. asırlar arasında telif edilen örnekleri esas alınmıştır. Bir giriş ve iki bölümden oluşan araştırmanın giriş bölümünde araştırmanın önemi, amacı, sınırı, yöntemi ve kaynakları hakkında açıklamalar yapılmış, akabinde furûk ve kavâid kavramları kısaca tahlil edilmiştir. Birinci bölümde örf ve âdetin fıkıh literatüründeki yeri genel olarak ele alınmış ve teorik bir zemin oluşturulmaya çalışılmıştır. İkinci bölümde belirli kriterler çerçevesinde esas alınan furûk ve kavâid eserlerinde örf ve âdetin anlam, metot ve muhteva bakımından incelemesi yapılmıştır."
