abstract: "Horasan Şâfiîliğini ve bu ekolün bir takipçisi olan Râfiî (ö. 623/1226) ve fıkhî faaliyetini incelediğimiz bu çalışmamız giriş, üç bölüm, sonuç ve eklerden oluşmuştur. Giriş kısmında araştırmanın önemi ve kapsamı, başlıca kaynakları ve konu ile ilgili yapılmış çalışmalar hakkında bilgi verilmiştir. Birinci bölümde Şâfiî mezhebinin yayılma sürecinde öne çıkan merkezler, mezhebe dair bazı bilgiler ve mezhep içi alt ekolleşmeye yer verilmiştir. İkinci bölümde Horasan'ın coğrafi ve siyasi yapısı, Şâfiî mezhebinin Horasan'a girişi, Horasan Şâfiîliğinin önde gelen isimleri, literatür ve Horasan ekolü ile Irak ekolünün birleştirilme faaliyeti ele alınmıştır. Üçüncü bölümde Râfiî'nin hayatı, eserleri ve ilmî kişiliği ile birlikte hem Horasan Şâfiîliği hem de mezhebin geneli açısından fıkhî faaliyeti üzerinde durulmuştur. Sonuç kısmında çalışmamız neticesinde ulaşılan tespitler ortaya konulmuştur. Ekler kısmında ise harita ve tablolara yer verilmiştir. Anahtar Kelimeler: Şâfiî mezhebi, Horasan, Irak, Mezhep içi ekolleşme, Râfiî"
