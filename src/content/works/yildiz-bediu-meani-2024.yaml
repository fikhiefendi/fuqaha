abstract: "Çalışmamızda h. VI.-VII. Yüzyıllarda yaşamış olan Ebû Muhammed Yunus b. Yusuf eş-Şeybânî'nin (ö. 619/1222) el-Akidetü'ş-Şeybâniyye adlı manzum eseri üzerine h. IX. Yüzyılda yaşamış olan İbn Kâdî Aclûn'un (ö. 876/1472) Bedîu'l-Meânî fî Şerhi Akîdeti'ş-Şeybânî adıyla şerh ettiği eserin tahkik ve tahlili yapılmıştır. Çalışmamız giriş, iki bölüm ve eserin tahkikli neşri kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı ve yönteminden bahsedilmektedir. Birinci bölümde müelliflerin hayatları, eserleri ve ilmi şahsiyetleri hakkında bilgi verilmektedir. Çalışmamızın ikinci bölümünde Bedîu'l-Meânî adlı eserin adı, müellife nispeti, nüshalarının tanıtımı ve muhtevasına değinilip tahkikte takip edilen usul ve yönteme yer verilmektedir."
