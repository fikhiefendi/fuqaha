abstract: "Ahkâm tefsirleri, Kur'an'ın hüküm bildiren ayetlerinin açıklamasını yapan tefsirlerdir. Sahabe, vahyin indirilişinden itibaren anlamadığı ayetleri Hz. Peygamber'e sormuştur. İşte bu anlama faaliyeti Ahkâm tefsirinin temellerini oluşturmaktadır.Çalışmamız giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Tezimizde Cessâs, Herrâsî ve İbn Arabî'nin tefsirlerinin mukayesesi yapılmaktadır. Giriş bölümünde Kur'an'ın ihtiva ettiği konular belirtilerek, Ahkâm tefsirinin bağımsız olarak tedvin edildiği ifade edilmiştir. Ayrıca Ahkâm tefsirinin gelişimi ve bazı ahkâm tefsirlerinin tanıtımını yapılmıştır.Birinci bölümde Cessâs, Herrâsî ve İbn Arabî'nin tefsir, hadis, fıkıh, dil ve diğer faydalandıkları kaynaklar verilerek, müfessirlerin kullandıkları tefsir metotlarına ve muhkem, müteşabih, nasih, mensuh gibi usul konularına yaklaşımları gözler önüne serilmiştir.İkinci bölümde müfessirlerin hüküm çıkarmada dayandıkları Kur'an, sünnet, icma, kıyas gibi kaynakları ve bu kaynaklara yaklaşımları işlenmiştir. Bu bölümde ayrıca müfessirlerin diğer mezheplere yaklaşımları da ifade edilmiştir.Sonuçta Ahkâm tefsirlerinde gördüğümüz bazı problemleri açıkladık."
