abstract: "Bu tez, klasik İslam mantık tarihinin iki önemli ismi olan İbn Sînâ'nın Dânişnâme-i Alâî ile Gazzâlî'nin Makâsıdü'l Felâsife adlı eserlerinin mantık bölümlerini karşılaştırmaktadır. Böylesi bir inceleme tarzını problem olarak almamızın sebebi, iki esere dair benzerlikler konusunda ileri sürülmüş iddialardır. Modern zamanlarda ileri sürülen bu iddialar, Makâsıdü'l Felâsife'nin Dânişnâme-i Alâî'nin çevirisi veya yorumlanmış hali olduğu noktasındadır. Ancak bu iddialar, tekil bazı konularla sınırlı kaldığı için ciddi bir fikir oluşturmamaktadır. Bu nedenle bu iddiaların kesinlik kazanması veya yanlışlanabilmesi için söz konusu metinlerin kapsamlı bir şekilde karşılaştırılması gerekmektedir. Biz de söz konusu eserlerin mantık bölümlerini karşılaştırmaya çalıştık. Bu karşılaştırma, dört bölümle şekillenmiştir. Bunlar; kavramlar mantığı, önermeler mantığı, akıl yürütmeler mantığı ve kıyasın maddeleri durumunda olan beş sanattır. Her bir bölümün konusu alt başlıklarla, detaylı bir şekilde incelenmektedir. Her bir alt başlık içinde öncelikle Dânişnâme-i Alâî'nin görüşleri ele alınmıştır. Ardından Makâsıdü'l Felâsife'nin görüşleri, konulara dair benzerlik ve farklılıklara işaret edilerek incelenmiştir. Her bir konunun sonunda çarpıcı benzerlik ve çok az da olsa farklılıklara dikkat çekilmiştir. Böyelelikle mantık bölümüne dair yaptığımız karşılaştırma sonucunda Gazzâlî'nin, Dânişnâme-i Alâî'ye bakarak metnini yazdığı fikrine vardık. Metinlerin kapsamına göre düşünüldüğünde, çok az yerler hariç, Makâsıdü'l Felâsife'nin büyük oranda tercümeyi andıracak veya tercümeye yaklaştıracak bir tarza sahip olduğu fikri oluşmaktadır."
