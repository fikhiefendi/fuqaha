abstract: "İslâm Aile Hukukunda“mîsâgan galîza”olarak tanımlanan evlilik akdi ve bu akdin sonlandırılması diğer hukuk alanlarına göre ayrı bir önem arz etmektedir. Nasslarda evlilik akdi ve bunun getirdiği mali sorumluluklar ile boşanma ve sonrasında tarafların yükümlülüklerine yer verilmiştir. İslâm aile hukukunda boşanmanın mali sonuçları kadına tanınan nafaka (iddet nafakası) hakkı, tazminat, süknâ (mesken) hakkı, tamamının veya bir bölümünün müeccel olması durumunda mehir hakkı, boşamanın maraz-ı mevt (ölüm hastalığı) halinde yapılması durumunda miras hakkı ve müt'a hakkından oluşmaktadır. Boşanmanın mali sonuçlarını oluşturan bu başlıklar içerisinde boşanma nafakası ve tazminatı günümüz hukuk sistemlerinin güncel sorunlarını da oluşturması açısından ayrı bir öneme sahiptir. İslâm hukuku boşanma sonrası nafaka sorumluluğunun süresi, kapsamı ve nafaka yükümlüsü kişiler hususunda getirdiği sistem ile günümüz hukuk sistemlerinde yer alan boşanma sonrası nafaka sorumluluğu ve süresi hususundaki güncel sorunlara önemli bir çözüm yolu sunmaktadır. Boşanma sonrası tazminat klasik fıkıh kaynaklarında müstakil bir başlık altında yer almasa da temel hukuk ilkeleri ve makasıd teorisi boşanma tazminatının İslâm hukukuna yabancı bir kavram olmadığını göstermektedir. Bu temel prensipler dikkate alındığında maddi ve manevi zarara uğrayan kusursuz eşin zararlarının tazmini İslâm hukuku açısından ehemmiyet arz etmektedir. Evliliğin sona ermesi durumunda nafaka ve boşanma tazminatı gibi mali sorumlulukların yanı sıra kadının belirli süre barınma ihtiyacını temin yükümlülüğü, müt'a ve mehir gibi ekonomik yükümlülükler boşanma sonrası kadının temel ihtiyaçlarının karşılanması ve hayatını idame ettirmesi için önemli bir kolaylık sağlamaktadır. Tezimizin temel konularını teşkil eden boşanma hukukunun (özellikle evliliğin sona ermesi sebebiyle karşılaşılan) mali konular analiz edilerek değerlendirilmeye çalışılmıştır."
