abstract: "İstanbul Müftülüğü Şer'iyye Sicilleri Arşivi'nde bulunan ve Kısmet-i Askeriye Mahkemesi'ne ait olan 876 numaralı sicil, 72 varaktan oluşmakta ve H. 1224-1225 (M. 1809-1811) tarihlerinde tutulmuş 117 muhasebe kaydını içermektedir. Bu tez çalışması iki bölümden oluşmakta ilk bölümünde zikredilen sicilden elde edilen verilerle Tanzimat öncesi dönemde Osmanlı toplumundaki yetimlere yönelik uygulamalar ve kassamlık sistemi incelenmektedir. İkinci kısım ise bahsi geçen sicilin transkripsiyonunu içermektedir. İncelenen sicil, Osmanlı toplumunda askerî veya reaya gruplarına mensup ebeveynlerini kaybetmiş yetimlerin muhasebe kayıtlarından oluşturmaktadır. Bu sebeple çalışmanın odak noktasını da Osmanlılarda yetimlerin himayesine yönelik uygulamalar oluşturmuş ve bu çerçevede değerlendirmeler yapılmıştır. Bu tezde yetimlerin ve mallarının yönetiminin büyük oranda hayatta olan diğer aile üyeleri arasından atanan vasîlere emanet edildiği görülmüştür. Yetim çocukların malları vasîleri tarafından nafaka harcamalarını karşılamak ve mal varlığını korumak amacıyla yönetilmiştir. Uygulamanın hem yetime ait olan nakit paraların borç verilerek işletilmesiyle hem de gayrimenkullerin kiralanması ile gerçekleştirildiği görülmüştür. Elde edilen gelirlerle yetimlerin nafakalarının karşılanması başta olmak üzere, yetimlerin tasarrufunda bulunan vakıf gayrimenkullerin tamir ve masraflarının yapılması, çocukların eğitim harcamalarından bayramlık alımlarına kadar çeşitli giderlerin temin edildiği görülmüştür. Yetimin malı, yaygın olarak borç verilerek nemalandırılmış, elde edilen gelirler ile masrafları karşılanmış, muhasebe dönemi sonunda kalan para vasîler tarafından yeni borç talep edenlere verilmek üzere bezzazistan sandıklarında muhafaza edilmiş, reşit olunca kendilerine teslim edilmiştir. Rüştü mahkeme önünde onaylanan yetime mallarının tamamı teslim edilmekteydi. Reşit oluncaya kadar geçen süreç içinde vasiler marifetiyle yapılan işlem ve uygulamalar, çalışmanın konusu olan sicilde kayıtlı 131 muhasebe defterinden hareketle incelenmiş, yetimlere ait mal varlıklarının muhasebe öncesi ve sonrası durumlarını gösterecek şekilde tablolaştırılmıştır. Muhasebe verilerine dayalı olarak yetimlere bağlanan ortalama nafaka miktarları, mal varlıkları ve muhasebe süreleri tespit edilebilmiştir. Yine sicil verilerinin incelenmesi ve grafikleştirilmesi ile vasî atama türleri, yeni vasî atanma sebepleri gibi hususlara dair veriler elde edilmiş iki örnek vak'anın ayrıntılı anlatımı ile yetimler için tutulan muhasebe kayıtlarının bir tasviri yapılmıştır."
