abstract: "İslam hukuku müktesebatı içerisinde Mecellenin ilk yüz maddesi külli kaideler olarak bilinmektedir. Bu noktada tüm konular için genel geçer olarak serdedilen kurallara, kavâid, tek bir konuda geçerli olanlara ise davâbıt denilmektedir. İslam Hukuku alanında eğitim gören ve bu alanda lisansüstü çalışmalar yapan herkes, fıkha bütüncül olarak bakabilme noktasında külli kaidelerin öneminin farkındadır. Külli kaideler, İslam Hukuku alanında çalışma yapan kişiler için pek çok konuda kılavuz mahiyetindedir. Ne var ki bu alanda yapılan çalışmalar genel olarak yüzeysel kalmakta, yalnızca bu kaidelerin ezberlenmesi ile yetinilmektedir. Hak Dini Kur'an Dili Tefsiri, müellifin tefsir ilmindeki yetkinliğini tartışmasız şekilde ortaya koyduğu gibi fıkıh ilmindeki yetkinliğini de ortaya koyan pek çok argümanı içerisinde barındırmaktadır. Özellikle bazı fıkhî kâideler ile ayetler arasında kurmuş olduğu bağlantılar oldukça dikkat çekicidir. Fıkhî kâideler üzerine yazılmış olan eserlerde pek çoğuna rastlamanın mümkün olmadığı bu bağlantıların uzun ve derin bir tefekkür sonucu ortaya çıktığı aşikardır. Bu noktada Hak Dini Kur'an Dili tefsiri üzerine yapmış olduğumuz mütalaalarda Elmalılı'nın kavâid ve davâbıt yaklaşımı dikkatimizi celbetmiştir. Zira kaideler ile ayetler arasında ilk bakışta akla gelmeyecek ilginç bağlantılar kurmakta, kaidelerin neşet etmiş olduğu delilleri ortaya koymaktadır. İnce ve uzun bir tefekkür sürecinin meyvesi olan bu yaklaşımın gün yüzüne çıkarılması külli kaidelerin ve fıkhî temellerinin anlaşılması noktasında önem arz etmektedir."
