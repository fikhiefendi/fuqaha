abstract: "Araştırma, Muhammed bin Muhammed bin Muhammed Mohiuddin Mevlana Zadeh Al-Hanafi Al-'nin Şems Suresi'nin başından Alak Suresi'nin sonuna kadar yaptığı önemli tefsirlerden biri olan“Hanefi Tefsiri”ni ele almaktadır. Osmanlı döneminin en önemli müfessirlerinden biri olan vefat eden (H. 927) Buhari Al-Barada'i ve müellif bu sureyi tefsirinde izlemiştir. âyetlerinin, kelimelerinin ve harflerinin sayısı hakkında, üçüncüsü nüzulüne dair, dördüncüsü tefsiri hakkında, beşincisi de onunla ilgili olarak ve hadisin tefsiri ile hadisin tefsirini birbirine karıştırmaya dayalı bir metoda tabi olmak. Tasavvufî tefsir ve tefsirdeki önemi, hicri birinci asırdan kendi devrine kadar uzanan tefsir akımını destekleyen söz ve görüşlerden ve yeni çıkarımlardan ve müellifin haberinde dayandığı önemli kaynaklardan kaynaklanmaktadır. Araştırma sorunu da bu haberlerde ve özellikle sûrelerin fazileti ile ilgili hadisler bakımından sahihliklerinin, emniyetlerinin veya zayıflıklarının tasdik edilmesinde ve bazı âyetlerin tefsirle orantılı olmayan tefsirlerine dayalı olarak açıklanmasında da yatmaktadır. Araştırma üç bölüme ayrılmıştır.Araştırmacı birinci bölümde yaşamı incelemiştir. İkinci bölümde yazarın yaklaşımı, nüshanın tanımı ve dayandığı nüshaların açıklamaları ele alınmış, üçüncü bölümde ise araştırmacının yazarın bıraktığı en yakın şekle getirmeye çalıştığı doğrulanmış metin yer almıştır. bazı kelimeleri"
