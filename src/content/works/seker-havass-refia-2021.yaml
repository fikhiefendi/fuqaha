abstract: "Bu çalışmada XVIII. yüzyılın ilk çeyreğinde Havâss-ı Refîa (Eyüp)'da yaşayan Seyyidlerin sosyal-toplumsal ve ekonomik hayattaki rolleri ele alınmıştır. Osmanlı Devleti'nin başkenti olan İstanbul'un en önemli kaza merkezlerinden biri olan Eyüp'teki seyyidlerin yaşam tarzlarına dair sosyal, toplumsal ve ekonomik alana bir katkı sağlamak amaçlanmıştır. Yine amacımız Eyüp'te 1702-1714 yıllarında mahkeme kayıtlarında yer alan seyyidlerin bahsedilen rollerine dair var olan boşluğu bir nebze de olsa doldurmaktır. İstanbul Müftülüğü Arşivi'nden temin ettiğimiz 16 adet Şer'iyye Sicilleri defterleri incelenmiş ve seyyidlerin yer aldığı davalar belirlenip konularına göre sınıflandırılarak bu çalışmamız şekillenmiştir. 1702-1714 yılları arasında Eyüp şer'iyye sicilleri kayıtlarına yansıyan aile, nafaka, tereke, mülk-arazi, hibe, cinayet, darp, kefalet, vekâlet, rehin, su yolu, hüccet, vb. gibi daha pek çok konuda seyyidlerin davalardaki rolleri ve o dönemdeki sosyal, toplumsal ve ekonomik hayattaki varlıklarına dair bilgiler kayıtlara yansıyan örneklerle verilmiştir. Bu tez çalışması Giriş ve 3 Bölümden oluşmaktadır.“Giriş”bölümünde mahkeme kayıtlarının tutulduğu Şer'iyye sicilleri, Eyüp kazası ve Eyüp Kadılığı hakkında bilgi verilmiştir. Birinci bölümde“Osmanlı'da Seyyidler ve Şerifler”başlığı altında, Seyyid, Şerif, Seyyidlerin Osmanlı toplumundaki rolleri ve Nakibü'l-Eşraflık Kurumu hakkında genel bir bilgi verilmiştir. İkinci bölümde“Sosyal ve Toplumsal Hayatta Eyüp'teki Seyyidler”başlığı altında, boşanma, nafaka, mihr, dini rolleri, tereke ve su keşif hücceti davaları gibi konular ele alınmıştır. Üçüncü bölümde“Eyüplü Seyyidler ve Ekonomik Hayattaki Rolleri”başlığı altında su yolu davaları, beytülmal adına el konulan mallar, rehin bırakma, mülk arazi davaları, alacak talepleri, kefalet senetleri, hibe vb. gibi konular başta olmak üzere birçok dava incelenmiştir."
