abstract: "Sivaslı kadı müşaviri Muhammed Sürûrî, İslam hukuku alanında eserler telif eden bir fıkıh alimidir. Ahkâmu't-Talâk, aile hukukunda önemli bir yer tutan boşanma mevzusunu içermesi bakımından yazarın en önemli eserleri arasında görünmektedir. Hukuk-u Aile Kararnamesi, Osmanlı Devleti tarafından yasalaştırılan ilk aile kararnamesidir. Kısa bir süre yürürlükte kalmasına rağmen hem Osmanlı devletinde hem de Osmanlı'ya bağlı devletlerde önemli bir etki bırakmıştır. Üzerine birçok çalışmanın yapıldığı bu kararname ile Ahkâmu't-Talâk adlı eseri, tezimizde mukayese edilmiştir. Girişte tezin konusu, önemi, amacı, yöntemi ve konuyla ilgili kaynaklarla ile birlikte çalışmaya katkı sağlayacağını düşündüğümüz çeşitli kavramlara değindik. Birinci bölümde Osmanlı hukukuna, ikinci bölümde müelliflerimizden Muhammed Sürûrî'nin hayatı ile eserlerine ve Hukûk-ı Âile Kararnamesi hakkında bilgilere yer verdik. Üçüncü bölümde eserlerimizin sistematik açıdan mukayesesini gerçekleştirdik. Eserde bulunan ortak ve farklı konuları birer başlık altında inceleyerek benzerlikleri ve farklılıkları ortaya koymaya çalıştık. Sonuç bölümünde eserlerin mukayesesiyle ulaştığımız hususları ifade ettik."
