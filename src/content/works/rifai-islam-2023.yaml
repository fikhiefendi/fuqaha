abstract: "Çağımızda borca dayalı işlemler ciddi anlamda artmış ve görmezden gelinmesi imkânsız bir gerçeklik halini almıştır. Öyle ki, çoğu kimse ya borçlu ya da alacaklı bir vaziyete gelmiştir. Aynı durum ticarî kuruluşlar için de geçerlidir. Bu araştırmanın problemi, şirket borçlarının sermaye üzerinde nasıl bir etkiye sahip olduğudur. Zira şirketler, ticâri faaliyetlerini yürütmek üzere çoğu zaman borçlanmak suretiyle dış finansman sağlama yoluna gitmektedirler. Daha da ötesi sırf borca dayalı işlemlerde bulunmak üzere kurulmuş olan veya sermayesi salt borçtan müteşekkil olan şirketler de mevcuttur. Bu çalışmada sermaye kavramı, sermaye türleri, borç kavramı, borç türleri, İslam hukuku açısından caiz olan borçlanma çeşitleri ve borcun şirketlerin sermayeleri üzerindeki etkileri ele alınmıştır. Bu manada öncelikle borçlanmanın hükmü ortaya konulmaya çalışılmış, kimi borçlanma türlerinin caiz olmadığı, kimisinin caiz olduğu beyân edilmiştir. Bununla birlikte borç satışından söz edilmiş ve birçok formunun bulunduğu izah edilerek bazısının İslam hukuku açısından caiz olduğu, bazısının caiz olmadığı açıklığa kavuşturulmuştur. Tezin asıl konusunu teşkil eden borcun şirket sermayeleri üzerindeki etkisi incelenirken, borcun hisse alım satımına etkisi ve ortak giriş çıkışına etkisi gibi temel hususların yanı sıra manevî varlıkların sermayeye etkisi, değersiz alacakların sermayeye etkisi, sermaye güvenliği ve iflasın sermayeye etkisi gibi konular ele alınmıştır. Bunlar ele alınırken de özellikle sermayeye dair zekât konularına temas edilmiştir. Çalışmada varılan en önemli sonuçlardan biri, aşırı borçlanmanın yüksek oranda olumsuz etkilere sahip olduğu, bu nedenle borçlanmanın belirli kural ve sınırlar dâhilinde yapılması gerektiğidir."
