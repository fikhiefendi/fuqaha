abstract: "Bu araştırmada İslam fıkhına göre necasetin yiyecek ve içeceklere etkisi incelenmiştir. Araştırmada dört mezhebin konuya bakışı karşılaştırmalı olarak analiz edilmiş, güncel bu mesele hususunda Kur'ân, sünnet ve diğer teşri kaynaklarına dayanarak tercih edilen görüşün tespitine çalışılmıştır. Yiyecek ve içecekler büyük küçük herkesin ihtiyaç hissettiği, bilinmesi gereken önemli bir konudur. Özellikle yiyecek ve içeceklerin çoğaldığı günümüzde bu konuyla ilgili hükümlerin bilinmesi önemlidir. Aynı şekilde mükelleflerin necaseti, sebeplerini ve konuyla ilgili diğer hususları bilmesi İslam dinin önemli meselelerinden biri olarak kabul edilir. Araştırmada nasların, yiyecek ve içeceklere necasetin tesiriyle ilgili diğer görüşlerin bulunması, analiz edilmesi, makasıdü'ş-şerîa ve günümüz asrının ruhuna uygun görüşün ortaya çıkarılmasında analitik tümevarım yöntemi kullanılmıştır. Araştırma neticesinde tespit edilen sonuçların önemlileri şunlardır: Haşereleri yemek örneğinde olduğu gibi İslâm'ın necis kabul ettiği her şey, insan fıtratına aykırıdır. Şeriat çoğunluğu dikkate almıştır. Bir şehrin sakinlerinin çoğunluğunun kestiği yeniliyorsa bu beldede ve oradan et ithal eden yerlerde asıl olan kesilen hayvanın etinin yemenin meşru olmasıdır. Aynı şekilde zorda kalmış kişinin insan nesli için çok kıymetli olan nefsi koruma gayesiyle haram olan şeylerden istifade etmesi de meşrudur. Zararlı olduğu kesin olarak ispatlanmadıkça, bazı hayvansal ve bitkisel katkı maddeleri katılmış gıda bileşiklerini de yemek caizdir. Domuz eti gibi haram olan hayvanın bir parçasının karıştığı bileşenler ise değişip dönüşümü kesinleşmediği müddetçe yenilmesi caiz değildir."
