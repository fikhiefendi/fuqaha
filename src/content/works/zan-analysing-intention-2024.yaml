abstract: "Bu çalışma, Promosyon Kampanyaları (PK), Tutum (T), Öznel Normlar (ÖN), Algılanan Davranışsal Kontrol (ADK), Tasarruf Güdüleri (TG) ve Dindarlığın (D) aile tekafül planları satın alma niyeti üzerindeki doğrudan etkilerini analiz etmektedir. Planlı Davranış Teorisi (TPB) modelini kullanarak 18 yaş ve üzeri Malezyalı Müslüman arasında aile tekafül planları satın alma niyetine yönelik aracılık etkilerinin ve moderatör rolünün yanı sıra. Çalışmada çok SmartPLS (v.4) kullanılarak PLS-SEM'den faydalanılmıştır. Toplam 302 geçerli yanıt alınmış ve tüm bulgular bu örneklem büyüklüğüne dayalı olarak raporlanmıştır. Bulgular, incelenen sekiz doğrudan etkiden beşinin anlamlı etkilere sahip olduğu sonucuna varmıştır. tutum ve tasarruf güdüleri tam aracılık görevi görürken, Dindarlık tasarruf güdüleri ile aile tekafül planları satın alma niyeti arasındaki ilişkiyi hafifletmektedir. Bu çalışma, tekafül sağlayıcılarının müşteri hizmetlerini iyileştirebileceğini, toplum liderleriyle işbirliği yapabileceğini ve aile tekafül planlarına yönelik olumlu tutumlar geliştirmek için pazarlama kampanyalarını stratejik olarak tasarlayabileceğini, böylece katılımı teşvik edebileceğini ve finansal güvenliği artırabileceğini göstermektedir. Buna paralel olarak, politika yapıcılara eğitim kampanyaları yürütmeleri, sosyal ağları güçlendirmeleri ve Tekafül ürünlerinin tanıtımında şeffaflık ve doğruluğu sağlamak için promosyonlar düzenlemeleri tavsiye edilmektedir."
