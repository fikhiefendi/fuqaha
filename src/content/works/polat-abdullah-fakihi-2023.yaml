abstract: "Bu çalışmada, Abdullah el-Fâkihî'nin (d. 899-1493/ö. 972-1564) Mucîbu'n-nidâ ilâ şerḥi Ḳaṭri'n-nedâ adlı eserinde istişhâd ettiği beyitler tahlil edilmiştir. Bu çalışma, giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, problemi, amacı, metodu, önemi ve kaynaklarına değinilmiştir. Birinci bölümde İbn Hişâm el-Ensârî ile el-Fâkihî'nin hayatları, ilmî şahsiyetleri ve eserlerine değinilmiştir. İkinci bölümde el-Fâkihî'nin Mucîbu'n-nidâ ilâ şerḥi Ḳaṭri'n-nedâ adlı eserin genel özellikleri, muhtevası ve eserinde kullandığı metoda değinilmiş ve İbn Hişâm el-Ensârî ile el-Fâkihî'nin şerhleri mukayese edilmiştir. Üçüncü bölümde ise Mucîbu'n-nidâ adlı eserde yer alan iki yüz yirmi yedi beyit tercüme edilerek istişhâdları tahlil edilmiştir."
