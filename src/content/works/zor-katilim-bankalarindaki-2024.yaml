abstract: "Günümüz finansal sisteminde bankaların temel görevi fon fazlası olanlarla fon ihtiyacı olanları buluşturmaktır. Fon ihtiyacı olanlar konvansiyonel bankalardan kredi yoluyla bu ihtiyaçlarını gidermektedir. Ancak bu ihtiyacın kredi yoluyla giderilmesinin fiyatı ise faizle belirlenmektedir. Bankalar faizle kredi vererek fon ihtiyacı duyanların ihtiyaçlarını karşılarken elde ettikleri faizle hem kendilerine hem de birikimlerini bankalara yatıran mudilere artı gelir sağlamaktadır. Bankacılık sisteminin diğer oyuncusu katılım bankalarında ise fon ihtiyacı faizsizlik prensibi çerçevesinde müşterilere sunulan çeşitli finansman yöntemleri ile giderilir. Katılım bankalarının finansman yöntemleri ile elde ettiği artı değer ise kâr olarak değerlendirilmektedir. Bu çalışma katılım bankalarının finansman geri ödemelerini İslam hukuku perspektifinde incelemektedir. Katılım bankalarının, murabaha, leasing gibi borçlandırmaya dayalı kullandırdıkları finansmanlarda konvansiyonel bankaların anüiteye dayalı faiz hesaplamalarını kullanarak geri ödeme planı oluşturdukları saptanmıştır. Bunun sonucunda katılım bankaları da konvansiyonel bankaların kredi faizini önceden tahsil edip anapara ödemesini ötelediği gibi finansman kârlarının ödenen ilk taksitlerde ağırlığını arttırarak vadesi henüz gelmemiş kârın tahsilatını yaptıkları gözlemlenmiştir. Çalışmada bu husus, İslam hukukundaki vade ve kâr ilişkisi çerçevesinde klasik ve modern görüşler esas alınarak analiz edilmiştir. Araştırma bulguları, katılım bankalarının finansman geri ödeme planlarını konvansiyonel finansa benzer şekilde oluşturmasının İslam hukukundaki vade ve kâr düşüncesiyle uyumlu olmadığını göstermektedir. Elde edilen bulgular neticesinde katılım bankalarının kullandırdıkları finansmanlara dair İslam hukukuna uygun olacak şekilde geri ödeme planları önerilmiştir. Önerilen geri ödeme planlarının İslam hukukuna uygunluğunun yanı sıra banka ve müşteri bazlı değerlendirmeleri avantajlı ve dezavantajlı yönleriyle yapılmıştır. Alternatif geri ödeme planlarının sunulmasının amacı ülkemizde bankacılık sektöründe büyümeye ve gelişmeye devam eden katılım bankalarının faizsizlik prensibi çerçevesinde finansman geri ödemesini gerçekleştirmesidir."
