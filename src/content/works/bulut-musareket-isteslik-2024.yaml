abstract: "ÖZ Müşâreket fiillerini içeren kelimelerin sosyal yönden incelenmesinin hedeflendiği bu çalışma iki temel bölümden oluşmaktadır. İlk bölümde müşâreket bildiren müfâ'ale ve tefâ'ul bâblarının temel özellikleri ve dile kattığı anlamlar dildeki örnekleri ile ele alınmıştır. İkinci bölümde ise Kur'ân-ı Kerim'de müşâreket bildiren kelimeler başlıklar halinde gruplandırılmış, söz konusu kalıpların ayetlere kattığı anlam incelikleri tefsir kaynaklarına müracaat edilerek tespit edilmiş ve sonrasında bu ayetlerin toplumsal mesajları içtimaî tefsirlerden istifade edilerek incelenmiştir. Bu araştırmalar sonucunda belirtmek gerekir ki, müşâreket ifade eden kelime ve ifadelerle Kur'an, toplumsal problemlerin çözümünde önemli bir rol üstlenmektedir. Zira Kur'an, inanan bireylere ve topluma, ortak sorumluluklar yükleyen ifadelerle hitap etmektedir. İnanan bireyler, bu dinî ve sosyal sorumlulukları yerine getirdikçe, toplumda barış ve huzurun sağlanmasına katkıda bulunacak ve toplumun bütünlüğü ile istikrarı daha kolay bir şekilde korunacaktır. Bu noktadan hareketle Kur'ân-ı Kerim tefsir ve tercümelerinde fiil bâbları esas alan ve bâbların dile kazandırdığı anlam ilgilerine, incelik ve nüktelerine değinen kapsamlı bir araştırmanın olmaması sebebiyle, ilgiye mazhar olan konunun 'Din Sosyolojisi' gibi başka disiplinler açısından da müsait olduğu ifade edilebilir. Ayrıca işteş kalıpların Kur'ân'da, hitap ifadelerinde tercih edilmesi, tefsir ilminin başka alanları için de inceleme konusu olabilir. Seçilen çalışmanın Kur'an tefsir ve tercümelerinde metodolojik olarak mevcut çalışmalardan farklı, özgün bir katkı sunacağı düşüncesindeyiz."
