abstract: "ÖZET Bu çalışma, din görevlilerinin İslami finans sistemine yönelik algı ve tutumlarını derinlemesine incelemek amacıyla gerçekleştirilmiştir. Modern finansal sistem içerisinde alternatif bir konumda yer alan İslami finans, faizsiz yapısı ve etik temelli yaklaşımıyla son yıllarda hem teorik hem de pratik düzlemde Türkiye'de hızla gelişmektedir. Din hizmetleri alanında görev yapan bireylerin bu sistem hakkındaki farkındalık, bilgi düzeyi, tutum ve yönelimleri ise hem finansal okuryazarlığın geliştirilmesi hem de toplumsal bilincin artırılması açısından önemli bir rol üstlenmektedir. Bu bağlamda araştırmanın temel problemi, Burdur ilinde görev yapan din görevlilerinin İslami finans sistemine dair algı, tutum ve bilgi düzeylerinin mevcut durumunu ortaya koymak ve bu çerçevede politika önerileri geliştirmektir. Araştırmada nitel durum çalışması yöntemi benimsenmiştir. Amaçlı örnekleme yoluyla belirlenen katılımcı grubunu Burdur il merkezinde ve ilçelerinde görev yapan din görevlileri oluşturmaktadır. Veriler, yarı yapılandırılmış görüşme formları aracılığıyla toplanmıştır. Elde edilen nitel veriler, metin madenciliği teknikleriyle desteklenerek TF–IDF ağırlıklandırması, tematik analiz ve içerik çözümlemesi yöntemleri kullanılarak değerlendirilmiştir. Bu analizler sayesinde din görevlilerinin finansal kavramlara yönelik dil kullanımları, temel temalar ve tekrar eden kavramsal örüntüler sistematik bir biçimde ortaya konmuştur. Araştırma sonucunda katılımcıların İslami finans sistemine yönelik genel olarak olumlu tutuma sahip oldukları, ancak kavramsal bilgi düzeylerinin sınırlı olduğu tespit edilmiştir. Katılım bankacılığı dair yüzeysel bir bilgiye sahip oldukları ortaya konmuş olup aynı zamanda ürün çeşitliliği, işleyiş mekanizmaları ve yatırım araçlarına ilişkin bilgi eksiklikleri dikkat çekmiştir. Bununla birlikte din görevlilerinin, toplumsal bilgilendirme süreçlerinde aktif rol üstlenmeye istekli oldukları belirlenmiş fakat din görevlilerinin yeterli donanım sahip olmadıkları ortaya konmuştur. Bu sonuçlar, İslami finansın toplumsal düzeyde yaygınlaşması için din görevlilerinin eğitiminin ve bilgilendirilmesinin önemini vurgulamaktadır. Bu tez, İslam iktisadı ve finans alanında din görevlilerinin konumuna odaklanarak literatürdeki önemli bir boşluğu doldurmayı amaçlamakta; yerel düzeydeki durum analizine dayalı özgün veriler sunmaktadır. Elde edilen bulgular hem akademik çalışmalara katkı sağlayacak hem de politika yapıcılar için yol gösterici nitelikte öneriler içermektedir."
