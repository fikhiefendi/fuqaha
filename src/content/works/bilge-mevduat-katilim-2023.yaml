abstract: "Çalışmada 2016Q1- 2020Q4 döneminde mevduat ve katılım bankalarının finansal performansını belirleyen banka içi faktörlerin panel veri analizi ile ortaya çıkarılması amaçlanmıştır. Bu doğrultuda bankacılık sektöründe işleyişi, mevzuatı ve hitap ettiği müşteri yapısı farklı olan iki farklı banka grubunda finansal performansı etkileyen faktörler karşılaştırılabilecektir. Çalışmada bağımlı değişken olan finansal performans aktif karlılık ve özsermaye karlılığı ile ölçülmüştür. Bağımsız değişkenler ise aktif büyüklüğü, banka yaşı, kredi kalitesi, sermaye yeterliliği ve operasyonel etkinlik olarak belirlenmiştir. Gerçekleştirilen analizler sonucunda, mevduat bankalarında banka yaşı ve kredi kalitesi değişkenleri ile aktif karlılık arasında istatistiksel olarak anlamlı ve negatif yönlü, aktif büyüklüğü, likidite ve sermaye yeterliliği değişkenleri ile aktif karlılık arasında istatistiksel olarak anlamlı ve pozitif yönlü bir ilişki tespit edilmiştir. Ek olarak, banka yaşı ile özsermaye karlılığı arasında istatistiksel olarak anlamlı ve negatif yönlü aktif büyüklüğü, likidite ve sermaye yeterliliği değişkenleri ile özsermaye karlılığı arasında istatistiksel olarak anlamlı ve pozitif yönlü bir ilişki tespit edilmiştir. Katılım bankalarına ilişkin gerçekleştirilen analizler sonucunda ise kredi kalitesi değişkeni ile aktif karlılık arasında istatistiksel olarak anlamlı ve negatif yönlü, aktif büyüklüğü, sermaye yeterliliği ve operasyonel etkinlik değişkenleri ile aktif karlılık arasında istatistiksel olarak anlamlı ve pozitif yönlü bir ilişki tespit edilmiştir. Ayrıca aktif büyüklüğü, likidite ve operasyonel etkinlik değişkenleri ile özsermaye karlılığı arasında istatistiksel olarak anlamlı ve pozitif yönlü bir ilişki tespit edilmiştir. Bulgular bir bütün olarak değerlendirildiğinde, mevduat bankalarının finansal performanslarını etkileyen banka içi faktörler ile katılım bankalarının finansal performanslarını etkileyen banka içi faktörlerin büyük oranda benzerlik gösterdiği söylenebilir."
