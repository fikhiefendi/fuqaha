abstract: "Bu çalışma, hicri XII–XIII. yüzyıllarda yaşamış olan Şevkânî'nin hayatını ve Fethu'l-Kadîr adlı tefsirinde sarf ve nahiv ilimlerine dair yaptığı açıklamaları ele almaktadır. Eserde, Şevkânî'nin dilsel çözümlemelere yaklaşımı, önceki gramer otoritelerine atıfları ve sergilediği tercih ve değerlendirmeler tahlil edilmiştir. Şevkânî, San'a'da doğmuş ve birçok âlimden farklı olarak ilim yolculuğuna çıkmaksızın hayatını doğduğu şehirde sürdürmüştür. Arap dili ve tefsir başta olmak üzere çeşitli İslami ilimlerde derin bir birikime sahip olan Şevkânî, özellikle Kur'ân tefsiri alanında kaleme aldığı Fethu'l-Kadîr el-Câmi' beyne Fenneyi'r-Rivâye ve'd-Dirâye min 'İlmi't-Tefsir adlı eseri, hem rivâyet hem dirâyet yöntemlerini bir araya getirmesi açısından dikkat çekicidir. Tefsiri, sadece dini içerik açısından değil, aynı zamanda Arap dili ve grameriyle ilgili ayrıntılı açıklamalarıyla da önem arz etmektedir. Şevkânî, âyetlerin dilsel tahlilinde sarf, nahiv, lugat ve belâgat gibi alanlardan yoğun biçimde istifade etmiştir. Bu yönüyle eseri, hem tefsir hem de dil çalışmaları için önemli bir başvuru kaynağı konumundadır. Şevkânî, tefsirinde sadece dilsel çözümlemelerle yetinmemiş, aynı zamanda gramatik farklılıkların anlam üzerindeki etkisini de irdelemiştir. Özellikle lafızların i'râbına dair tercih ettiği görüşlerde, tercihinin âyetin genel anlam bütünlüğüne nasıl katkı sağladığını açıklamaya özen göstermiştir. Böylece dil bilgisel yorumları kuru bir biçimde aktarmaktan ziyade, onları tefsir bağlamında işlevsel bir düzlemde konumlandırmıştır. Ayrıca dil bilgisiyle ilgili konuları, fıkıh ve hadis gibi diğer İslami ilimlerle ilişkilendirerek açıklamaya çalışmıştır. Şevkânî'nin tefsiri, sadece dil bilgisi kurallarını aktarmakla kalmamış, aynı zamanda dilin Kur'an'daki anlam derinliğine nasıl hizmet ettiğini de göstermeye çalışmıştır. Müellifin eserde benimsediği metod, Arapça'nın Kur'an yorumunda nasıl bir araç olduğunu ortaya koyarak, tefsirle dil ilimleri arasındaki güçlü ilişkiyi gözler önüne sermektedir. Anahtar Kelimeler Şevkânî, Fethu'l-Kadîr, Tefsir Sarf, Nahiv"
