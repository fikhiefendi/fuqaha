abstract: "Bu çalışmada, İslam hukukunun teorik boyutu ile Osmanlı uygulaması arasındaki ilişkinin araştırılması hedeflenmiştir. Çalışma, 1200-1203/1786-1789 yılları arasında İstanbul Bâb Mahkemesi'nde görülen muhâlea davaları ile sınırlanmıştır. Muhâlea, eşlerin karşılıklı anlaşmaları ile evliliği sonlandırmalarını ifade eder ve bu boşanma çeşidi, incelenen mahkeme ve dönem bağlamında evliliği sonlandırmak amacıyla en fazla başvurulan yöntemdir. Çalışmada, klasik fıkıh kitapları ve Osmanlı fetva metinleri ile mahkeme kayıtlarının karşılaştırmalı olarak incelemeye konu edilmesi metodu benimsenmiştir. Çalışma sonucunda, teorik metinler ile tarihsel malzeme arasında sıkı bir birliktelik ve uyumun olduğu gözlemlenmiştir."
