abstract: "Bütün fıkıh ekolleri metin ve sened yönünden kabul şartlarını taşıyan hadislerle amel etmenin gereği hususunda ittifak etmişlerdir. Malum olduğu gibi Peygamberin (s.a.v) sünneti islam hukukunun ikinci temel ve geniş kaynağını oluşturmaktadır. Fukahânın aralarında ihtilaf ettikleri problemler çoktur. Bunlardan bazıları usül (yöntem) bakımından hem fikir olmakla beraber bu genel husustan çıkarılacak fetva ya da uygulama hükümleri açısından farklı sonuçlar çıkarmışlardır. Ancak temel problemler ya da farklılıklar daha çok usül (metodoloji) konularında olmuştur. Metodolojide farklılıklar olduğu müddetçe çıkarılan hükümler konusunda fikir birliği olması ya da birinin tercih edilmesi mümkün değildir. Bunun için öncelikle usül yaklaşımında metodolojik konular önce ele alınmalı bunlar karşılaştırma yapılmalıdır. Üzerinde çalışma ve tahkik yapacağımız bölüm Hanefilerin sünnetin dindeki yeri ve hüküm çıkarılması ile ilgili hadis metodolojisini incelemektedir ki bu konuda günümüzdeki birçok araştırmacılar farklı anlayışlara yönelmiş ve hatalı sonuçlar çıkarılmıştır. Bu araştırmacılardan bir çoğu Hanefilerin sünnet anlayışını incelerken hadis ulemasının hadis usulü konusundaki prensip ve ölçülerine göre değerlendirmeye çalışmışları sebebiyle büyük hatalı anlayışa sebep olmuştur. Evet bazı konularda istidlal yöntemi onların imdadına yetişebilir. Ancak hadis usulü prensipleri üzerine çıkarılmış konularda aradaki bu ihtilafı nasıl çözülebilir. Beni bu konuyu araştırmaya sevk eden hedeflerin en mühimleri şunlardır: 1. Hanefi imamlarından birinin bu şerhi vasıtasıyla Peygamberin (s.a.v) sünneti hususunda hanefilerin usüllerinin anlaşılmasını kolaylaştırmak. Bu şerh hanefi usül kitaplarının en mühimlerinden alınmıştır. 2. Hadis ıstılahları hususunda şafii kaynaklarına ve diğerlerine mürâcaat eden, usûlün bir olduğunu ya da bu babda hanefilerin rivayetlerinin az olduğunu iddia edenler için mütevazı cevap vermek. 3. Yeni meseleler hakkında hanefilerin görüşlerini tahkik etmek ve tezi zenginleştirmek için mütakaddiminden bazı nakil ve görüşleri ortaya koymak. İbareleri kolaylaştırmakla birlikte onlardan gelenleri nakil yönünden özetlemek ve dikkatli bir tetkikten sonra onların görüşlerini açıklamak. 4. Osmanlı hilafeti döneminde müftü olan bir alimin kitaplarından birinin tahkikiyle hanefi ekolü zenginleşecektir. Şöyle ki onun döneminde hanefi mezhebi gelişmiştir."
