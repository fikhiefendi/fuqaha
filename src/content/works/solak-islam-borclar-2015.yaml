abstract: "İslam hukukunda yasaklanan akitler yasağa sebep teşkil eden unsura göre farklı hukuki sonuçlarla ilişkilendirilmiştir. Bu nedenle İslam hukukçuları akitleri, hukuki hükmü açısından sahih-bâtıl veya sahih-fâsid-bâtıl şeklinde farklı sınıflandırmalara tabi tutmuşlardır. Araştırma konumuz olan mekruh satım akitlerinin hukuki hükmünü tespit edebilmek için sahih-fâsid-bâtıl ayrımındaki konumunun belirlenmesi gerekir. Araştırmamızda bu konuya eğilerek mekruh satım uygulamalarını diğer yasaklanan satım işlemleriyle ilişkilendirdik. Bu konuda Hanefîler'in ve diğer fıkhî oluşumların fıkhın felsefesine yönelik benimsediği tutumlar ve bu akitlere verdikleri hükümler arasında bağlantı kurmaya çalıştık. Araştırmamızı giriş ve iki bölüm şeklinde gerçekleştirip giriş bölümünde konunun teorik alt yapısını oluşturmayı amaçladık. Birinci bölümde mekruh kavramını inceledik. İkinci bölümde mekruh satım uygulamalarını sınıflandırarak Hanefî doktrini başta olmak üzere İslam Hukuk mezheplerinin bu akitler konusundaki tutumuna dikkat çektik. Sonuç kısmında araştırma sebebiyle zihnimizde oluşan kanaati ifade ederek konuları maddeler halinde güncelleştirmeye gayret ettik. Anahtar kelimler: İslam Borçler Hukuku, akit, icâre."
