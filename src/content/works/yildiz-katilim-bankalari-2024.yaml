abstract: "2005 yılında 5411 sayılı Bankacılık Kanunu kapsamında Türk bankacılık sektörüne dâhil edilen Katılım Bankaları, faizsiz finansman prensibiyle İslami esaslara uygun faaliyet göstermektedir. 2015 yılında kamu katılım bankalarının sektöre katılması, Katılım Bankacılığı sektöründe sansasyonel etki oluşturmuş ve bankacılık sektöründe Katılım Bankaları pazar payını arttırmıştır. Bu çalışma, 2005:Q4-2024:Q1 dönemlerine ait Katılım Bankacılığı'nın kredi ve toplanan fon verileriyle ekonomik büyüme değişkeni olarak GSYİH verilerini analiz ederek, Katılım Bankaları'nın Türkiye'nin ekonomik büyümesi üzerindeki etkisini incelemeyi amaçlamaktadır. Bu ilişkinin varlığının tespit edilebilmesi amacıyla değişkenler arasındaki eşbütünleşme ilişkisi için ARDL (Auto-Regressive Distributed Lag) Sınır Testi ve ardından nedensellik ilişkisi için Toda Yamamoto Nedensellik Testi uygulanmıştır. Araştırmanın metodolojisinde, ARDL Sınır Testi, Katılım Bankacılığı değişkenleriyle ekonomik büyüme arasındaki uzun dönemli ilişkinin belirlenmesi amacıyla kullanılmaktadır. Bu test, değişkenlerin eşbütünleşik olup olmadığını belirlemek için uygulanmaktadır. Ardından Katılım Bankacılığı değişkenleriyle GSYİH arasındaki nedensellik ilişkisini araştırmak amacıyla Toda-Yamamoto nedensellik testi uygulanmıştır. Bu test değişkenler arasındaki nedensellik ilişkisinin yönünü ve niteliğini belirlemeye yardımcı olmaktadır. Yapılan araştırma neticesinde, ARDL Sınır Testi sonuçları, Katılım Bankaları'ndan sağlanan kredi ve fonların uzun vadede ekonomik büyüme üzerinde önemli ölçüde olumlu etki yarattığını göstermektedir. Bu durum Katılım Bankacılığı faaliyetlerinin zamanla sürdürülebilir ekonomik büyümeye katkı sağladığını göstermektedir. Toda-Yamamoto Nedensellik Testi bulgularına göre, Katılım Bankaları'nın kullandırdığı kredilerle GSYİH arasında çift yönlü bir nedensellik ilişkisi görülmektedir. Bu, kredilerin hem ekonomik büyümeyi teşvik edebildiğini hem de ekonomik büyümenin kredi talebini arttırabildiğini göstermektedir. Ayrıca, katılım bankalarının topladığı fonlardan GSYİH'ye doğru tek yönlü bir nedensellik tespit edilmesi, fon birikiminin ekonomik büyümeyi olumsuz etkileyebileceğini göstermektedir. Son olarak krediden fonlara doğru tek yönlü bir nedensellik ilişkisinin tespit edilmesi, Katılım Bankaları tarafından kredi kullandırımının toplanan fon miktarını etkilediğini düşündürmektedir. Sonuç olarak, Katılım Bankaları, finansman faaliyetleri aracılığıyla Türkiye'nin ekonomik büyümesine önemli katkılarda bulunmaktadır. Çalışmanın bulguları, Katılım Bankalarının Türkiye'deki ekonomik büyüme dinamiklerine etkisinin daha iyi anlaşılmasına katkıda bulunacağı ifade edilebilir. Anahtar Sözcükler Katılım Bankacılığı, Ekonomik Büyüme, ARDL Sınır Testi, Toda Yamamoto, Eşbütünleşme"
