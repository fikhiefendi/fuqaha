abstract: "Abdurrahman Cezîrî (v. 1882-1941) modern dönemde yaşamış İslamî ilimlerde isminden bahsedilen Mısırlı âlimlerindendir. Hanefi olmasına rağmen karşılaştırmalı bir fıkıh eseri kaleme alacak kadar dört amelî mezhebe vâkıftır. Bu çalışma Cezîrî'nin bir fıkıh âlimi olarak rivayetlere yaklaşımını ve dört mezhebe göre karşılaştırmalı olarak kaleme aldığı“el-Fıkh ale'l-mezâhibi'l-erbaa”adlı eserinin rivayet açısından güvenilirliğini tespit etmek adına kaleme alınmıştır. Çalışmada öncelikle Nikâh bölümü özelinde rivayetler incelenmiş; akabinde Cezîrî'nin rivayete bakışı ve rivayeti kullanma mantığı üzerinde durulmuştur. Yer yer de konu üzerinde mevcut fıkhî ihtilaflarla birlikte mesele değerlendirilmiştir. Genel olarak Cezîrî'nin bir hukukçu olmasına rağmen eserinde hemen her konuda ayetle birlikte rivayet kullandığı söylenebilir. Özellikle sahih hadislere olan itimadına dikkat çekmekte fayda vardır. Kimi hadis yorumlama ve açıklamaları da oldukça önem arz etmektedir. Kullandığı rivayetlerin geneli sahih ve muteber hadis külliyatlarında mevcut, sıhhat dereceleri yüksek hadisler olduğu söylenebilir."
