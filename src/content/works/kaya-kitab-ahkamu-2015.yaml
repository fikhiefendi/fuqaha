abstract: "Yüksek Lisans tezi olarak üzerinde çalıştığımız Dervíş Muģammed bin Melik Aģmed bin Melik Maģmūd'un Kitāb-ı Aģkāmü'l-'Aķayid adlı fıkıh eseri, Batı Türkçesi'nin ilk dönemi olarak kabul edilen Merkezi Oğuz Türkçesi Dönemi'nin tipik bir örneğidir. Öğretici bir fıkıh eseri olması sebebiyle islamın kaideleri ile beş şartı -tevhid, namaz, oruç, zekat, hac- üzerinde durulmuştur. Halkı bilgilendirmek amacıyla ayet, hadis, latîfe ve hikâyelerden de yararlanılarak anlatım zenginleştirilmiştir. Türkçe kelimelerin yoğunluğu dikkat çeker. Eserin tamamı 246 varaktır, biz yüksek lisans tezi olarak 51b-115a sayfalarını çalıştık. Metnin dil özellikleri incelenirken, gerek yazım gerek ses ve şekil bilgisi bölümlerinde Doğu Türklük sahasına ait hususiyetler gözden kaçmamıştır. Bu durum ise bize, 13. yy itibariyle tamamen birbirinden bağımsız ve ayrı olarak düşünülen Batı ve Doğu Türklük sahalarının ortak ve güçlü bir kökten gelmeleri sebebiyle aslında tamamen ayrıştırılamayacağını ve benzerlik gösterebileceğini, oluşan farklılıkların dilin organik yapısının doğal bir getirisi olduğunu gösterir."
