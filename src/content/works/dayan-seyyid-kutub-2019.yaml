abstract: "Kur'ân-i Kerim ayetleri, itikad, ahkâm ve geçmiş peygamberler ile ümmetlerin kıssaları olmak üzere temelde üç hususu ele almıştır. Ahkâm ayetleri de fıkhî bir ayrıma tabi tutularak kendi içerisinde üç kısma ayrılmıştır. Bunlar: ibadât, muâmelât ve ukûbât ile ilgili ayetlerdir. İslam tarihi boyunca Kur'ân üzerine rivayet ve dirayet gibi farklı metotlar ile çeşitli tefsir faaliyetleri yürütülmüş olup kimisi Kur'ân'ın tüm ayetlerini ele almışken kimisi de sadece ahkâm ayetlerinin üzerinde durmuştur. Bu çalışmalardan birisi de XX. yy'da Mısır'da yaşayıp Müslümanları etkilemeyi başarmış önemli bir mütefekkir olan Seyyid Kutub'un edebi-içtimaı metot ile kaleme almış olduğu Fî Zılâli'l-Kur'ân adlı tefsiridir. Bu çalışmada Seyyid Kutub'un hayatına değinildikten sonra onun, adı geçen eseri bağlamında ahkâm ayetlerine bakış açısı ve açıklama yöntemi ele alınarak bu ayetleri nasıl değerlendirdiğinin yanı sıra mezheplere yaklaşımı incelenmiştir. Seyyid Kutub, tefsirinde tümüyle belli bir mezhebin etkisi altında kalmamıştır. Zira o, ahkâm ayetlerini tefsir ederken bazen mezheplerin görüşünü naklederek bunlardan birisini benimsemiş bazen de hiçbir mezhebin görüşünü benimsemediğini ifade ederek kendisi farklı bir görüş ileri sürmüştür. Ancak birçok yerde meselenin fıkhî tafsilatına girmemiş, detaylı bilgi için okuyucuyu fıkıh eserlerine yönlendirmiştir. Bununla beraber ahkâm ile ilgili ayetlerin fıkhî açıklamalarını yaptığı yerlerde de sadece fıkhî boyutu ele almamış, aynı zamanda bu ayetlerden çıkarılabilecek mesajlara da temas etmiştir."
