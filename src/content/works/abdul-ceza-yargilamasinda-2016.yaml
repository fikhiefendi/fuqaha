abstract: "Yargılama konusu ve ispat vasıtaları, adalete ulaşmak ve ihtilafları ortadan kaldırmak için izlenmesi gereken en nihai yol olduğu için bunların her alanda kullanılması gerekir. Ayrıca ispat, bir hukuk normunun uygulanması ve kendisine sonuç bağlanan olumlu veya olumsuz olayın somut olarak gerçekleşmiş bulunmasına bağlı olduğu için de bazı karîneler ve ipuçlarına bağlılık gösterebilmektedir. Zira ispatta ortaya çıkan sorunlara ilişkin bilimsel ve ilmi bir şekilde cevap verebilmek ancak ispat metodunu ve onun bir alt başlığı olan karîneleri çok iyi bilmekle mümkün olabilmektedir. Bu nedenle biz de ele aldığımız bu çalışmamızda karinelerle ilgili olan ispat, ispat türleri, ispatın konusu ve ispat mercileri gibi bazı mühim kavramlar üzerinde durmaya çalıştık. Ayrıca karine kavramı, karine çeşitleri ve gerek Irak kanununun gerekse şer'î makamda bulunan fakihlerin bu konulara yaklaşımını karşılıklı olarak anlatmaya çalışıp bazı değerlendirme ve mukayeseler de bulunduk."
