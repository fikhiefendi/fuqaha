abstract: "Hukuk, toplumun düzenini ve devamını sağlamak için emredici, yasaklayıcı ve izin verici nitelikte birtakım kurallar koyar. Bu kuralların ihlali durumunda ise suç kavramı ortaya çıkar. Hukuka aykırı bir fiil olan suç, başkasının hakkını ihlal eden ve ceza normu tarafından yasaklanan bir eylemdir. Bu durumda hukuk, varlığını korumak için ceza müeyyidesi uygular. Ceza, insanın var olduğu her dönemde varlığını sürdürmüştür. Hatta merkezi bir otoritenin olmadığı dönemlerde bile suç mağdurunun kendisi, ailesi veya kabilesi tarafından suçlu cezalandırılmıştır. Devlet otoritesinin sağlanmasıyla birlikte bu yetki sistematik bir hale dönüştürülerek uygulanmıştır. Bu sistematik hale getirme ise cezada bazı unsurların ve özelliklerin bulunmasını gerekli kılmıştır. İslam hukuku da en başından beri cezada bulunması gerekli olan unsurların varlığını kabul etmiş ve bu unsurların bir tanesinin eksik olması durumunda dahi cezai işlemde bulunmamıştır. Bunun yanında cezalardaki özellikleri göz önünde bulundurarak suçluya en uygun ve onu ıslah edici cezayı belirlemiştir. Bunu yaparken de cezalandırmanın caydırıcı, hızlı ve dengeli olmasını öngörmüştür."
