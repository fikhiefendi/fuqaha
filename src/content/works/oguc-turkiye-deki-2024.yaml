abstract: "İslâm dini her konuda olduğu gibi Müslümanların finansal iş ve işlemlerinde de dinen meşru şekilde hareket etmesini gerekli kılmaktadır. İslamî açıdan meşru bir yatırım aracı olma misyonu taşıyan katılım yatırım fonlarının da bu doğrultuda tüm süreçlerini fıkhî ilkeler çerçevesinde kurgulaması gerekmektedir. Bu çalışmada, gerçekleştirilen her türlü iş ve işleme yönelik düzenleme ve denetleme faaliyeti yürüterek katılım yatırım fonlarının fıkhî yükümlülüklerini eksiksiz bir şekilde yerine getirmesinde son derece önemli bir faktör olan fıkhî yönetişim sisteminin etkinlik ve verimliliği Türkiye özelinde ele alınmaktadır. Çalışmanın temel amacı, Türkiye'deki katılım yatırım fonlarının fıkhî yönetişim sisteminde herhangi bir eksikliğin bulunup bulunmadığının değerlendirilmesi ve mevcutsa söz konusu eksikliğin giderilmesine yönelik birtakım düzeltici önerilerin sunulmasıdır. Bu çalışma, Türkiye'de katılım esaslı yatırım fonları için optimal bir fıkhî yönetişim çerçevesi çizmek suretiyle hem katılım yatırım fonu yatırımcıları tarafından gerçekleştirilen yatırımın hem de katılım yatırım fonu kurup yöneten portföy yönetim şirketlerinin tüm iş ve işlemlerinin fıkhî meşruiyetine katkı sağladığı için önem arz etmektedir."
