abstract: "Evlenme, sürekli bir hayat ortaklığı yaratmak üzere belirli şartları taşıyan erkek ve kadının hukuken geçerli şekilde birleşmesini ifade eder. Evlenme akdinin geçerli bir şekilde meydana gelmesi için, olumlu bazı koşulların bulunması ve olumsuz bazı koşulların da bulunmaması zorunlu olmaktadır.Bu tezde evliliğin muteber sayılabilmesi için bulunmaması gereken koşullar İslam hukuku ve Türk medeni hukuku açısından mukayeseli olarak incelenmiştir. Tez iki ana bölümden oluşmaktadır. Birinci bölümde gerek islam hukuku gerekse Türk medeni hukuku açısından sürekli evlenme engelleri ve sonuçları ele alınmıştır. İslam hukukuna göre sürekli evlenme engelleri kan hısımlığından, sıhrî hısımlıktan ve süt hısımlığından meydana gelmektedir. Medeni hukukta ise hısımlıktan (kan-sıhriyyet-evlatlık), önceki evlilikten ve akıl hastalığından doğmaktadır. İkinci bölümde ise geçici evlenme engelleri ve sonuçları incelenmiştir. Buna göre İslam hukukunda geçici evlenme engeli meydana getiren sebepler din farklılığı, boşanma, dört evlilik, sıhri hısımlık, mülkiyet ilişkisi, iddet, ihramlı olmak, lian ve zinadır. Medeni hukuka göre geçici evlenme engelleri ise yasal bekleme müddeti ve bulaşıcı hastalıklardır."
