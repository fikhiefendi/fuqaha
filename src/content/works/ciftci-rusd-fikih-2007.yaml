abstract: "Bu tezde ?slam Hukuk usûlünde önemli bir yer isgal eden lafızlardan ?manaya delaletinin sekli bakımından lafızlar? konusu ele alınmıstır. Konunun teorik alt yapısını olusturmak için Hanefîlerin basını çektiği Hanefiyyûn/fukahâ metodunun konuya yaklasımıyla; Sâfiî fakihlerinin öncülük ettiği ve cumhur olarak isimlendirilen Mütekellimûn ulemanın yapmıs olduğu tasniften hareketle mefhumun delaleti alt baslığında ele alınacak olan mefhûmu'l-muhâlefe /delîlü'l-hıtâb konusu merkeze alınmıstır. Bunu yaparken Mâlikî müctehidlerinden Endülüslü ?bn Rüsd el-Hafîd'in (595/1198) Bidâyetül Müctehid ve Nihayetül Muktesid isimli eserini temel alarak; delîlü'l-hıtâb terimiyle karsılamıs olduğu bu içeriğin pratiğe/uygulamaya yansıması olarak kabul edebileceğimiz furuu çözümlemelerine yer verilmistir. Sonuç bölümünde ise ?bn Rüsd el-Hafîd'in delîlü'l-hıtâb ile yapmıs olduğu bu istidlallerin değerlendirilmesi yapılarak, bu alanda yeni bir yaklasım ortaya koyup koymadığı, eğer varsa bunun nasıl bir yaklasım olduğu tesbit edilmeye çalısılmıstır."
