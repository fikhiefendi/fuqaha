abstract: "Sermaye yapısı, en genel tanımıyla bir şirketin faaliyetlerini sürdürebilmesi için gereksinim duyduğu borç ve özkaynak nitelikli finansal kaynakların bileşimini ifade etmektedir. Şirket değerini maksimize etmek ve finansman maliyetini minimize etmek amacıyla oluşturulan en uygun borç/özkaynak dengesi, finans literatüründe rasyonel karar alma süreçlerinin esas odak noktasını teşkil etmektedir. Bu bakış açısıyla geliştirilen konvansiyonel sermaye yapısı teorileri, finansal karar vericilere, en uygun finansman yapısını oluşturmada teorik çerçeveler sunmaktadır. Bu çalışmada, İslami finans ilkeleri çerçevesinde faaliyetlerini yürüten şirketlerin finansman yapısını açıklamaya yardımcı olacak ve konvansiyonel sermaye yapısı teorilerine alternatif niteliğinde bir“İslami Finansman Yapısı Teorisi”önerilmektedir. Önerilen teoride, faizsiz borçlanma esas alınarak faizsiz finansman yapısı bileşenleri hiyerarşik bir düzende tanımlanmaktadır. Buna ek olarak, minimum vekâlet problemi, minimum asimetrik bilgi sorunu, dengeli borçlanma düzeyi ve İslami finans rasyonalitesi temel unsurları esas alınarak en uygun faizsiz finansman yapısının mümkün olabileceği ileri sürülmektedir. Ayrıca çalışmada önerilen teori varsayımlarının ve teorik çerçevenin uygulamadaki yansımalarını tespit etmek amacıyla, nitel araştırma yöntemlerinden derinlemesine görüşme tekniği kullanılarak Türkiye ve Özbekistan'dan toplamda 12 İslami şirket sahibiyle yüzyüze ve çevrimiçi görüşmeler gerçekleştirilmiştir. Elde edilen veriler, MAXQDA 2020 Pro nitel veri analiz programı aracılığıyla betimsel ve tematik analize tabi tutulmuştur. Analiz neticesinde; İslami şirketlerin; finansman yapısını oluştururken göz önünde bulundurdukları unsurların, önerilen teoride ileri sürülen temel aksiyomlar ve varsayımlarla çok büyük ölçüde örtüştüğü tespit edilmiştir. İslami şirketlerin en uygun finansman yapısını belirleyen aksiyomları ortaya koyan bu çalışma, mevcut literatüre metodolojik ve kuramsal açıdan önemli bir katkı sağlamanın yanı sıra, gelecekte bu alanda yapılacak olan akademik araştırmalara ışık tutacak özgün bir temel teşkil etmektedir."
