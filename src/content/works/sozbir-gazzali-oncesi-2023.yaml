abstract: "İslâm dininde, pek çok âyetle ve başta Cibril Hadisi olmak üzere çok sayıda hadis ile bildirilen başlıca ibadet namazdır. Namazda hedeflenen, Allah ile kalbî buluşmayı sağlayabilmek ve“miraç”dediğimiz ruhani boyutu yaşayabilmektir. Bu boyut rükünlerdeki huşû, münacat, ta'zim, müşahede gibi haller ile sağlanır. İslam'da inanç ve ibadet sisteminin zâhir ve bâtın boyutları vardır. Namaz ibadetinin fıkıh hudutları içinde maddi yönü olduğu gibi, iç manalarını ve esrarını ifade eden kalbi yönü de vardır. Sufiler namazın zâhiri boyutuna anlam veren bâtini/kalbî boyutuyla ilgilenmişlerdir. Allah'a kulluğu daha iyi anlayabilmek için bütün ibadetlerde olduğu gibi namazın da şekli ve ruhâni boyutunu beraber yorumlamışlardır. İçinde bulundukları meşreb, hal ve makamlara göre namazın şartlarına ve rükünlerine manalar vermişlerdir. Tasavvuf geleneği içinde, sufîlerin namaz ibadetini yorumlamaları, Allah ile manevi yakınlıklarının ilahi tecellileri olarak anlaşılmıştır. Tezimizde daha çok Gazzâli ve ilk dönem müellif sufîlerin namazın beden ve kalp boyutu hakkındaki algıları aktarılmıştır. Çalışmamızda giriş, üç ana bölüm ve sonuç bölümü bulunmaktadır. Giriş bölümünde konunun amacı, kapsamı, yöntemleri, önemi ve kaynakları belirtilmiştir. Birinci bölümde namazın kavramsal mahiyeti, Kur'ân ve Hadisler'deki ifadeleri ve namazın tarihsel sürecine yer verilmiştir. İkinci bölümde, tasavvuf ilmine kaynak teşkil eden müellif sufîlerin eserlerinde müstakil olarak ifade ettikleri namaz görüşleri detaylı bir şekilde anlatılmıştır. Üçüncü bölümde, Gazzâli'nin İhya isimli eserinden hareketle namazın sırları, namazda kalb huzuru ve huşû tasavvuf kavramları ile açıklanmıştır."
