abstract: "Bu çalışmada Osmanlı Devleti zamanında yapışmış olan Fıkh-ı Ekber tercümeleri ve on yedinci yüzyıl Osmanlı ulemâsından Ali el-Hibrî'nin kaleme almış olduğu Fıkh-ı Ekber Tercümesi adlı eseri incelenerek Osmanlı'da Fıkh-ı Ekber'e olan bakış açısı tahlil edilmeye çalışılmıştır. Ebû Hanîfe'ye bir takım kanallar vasıtası ile nisbet edilen risâleleler arasında oğlu Hammad kanalıyla gelen kısa bir akāid risâlesi olan Fıkh-ı Ekber, Osmanlı ûleması nezdinde büyük bir ilgiye mahzar olmuş ve Fıkh-ı Ekber şerh, manzume, tercüme gibi sayısız çalışmaya konu olmuştur. Osmanlı Devleti bünyesinde, tercüme faaliyetlerinin revaçta olmasıyla birlikte on yedinci yüzyıl da Fıkh-ı Ekber'i Türkçe'ye çevirme faaliyetleri de hız kazanmıştır. Bu noktada çalışmamızın birinci bölümünde Fıkh-ı Ekber üzerine yapılan şerhler, tercümeler ve manzumeler incelenerek Osmanlı ulemâsının Fıkh-ı Ekber'e bakışı anlamdırılmaya çalışılmıştır. Bir risâleyi doğru bir şekilde incelemek evvela müellifin, yaşadığı coğrafyayı, zamanı, ilmi, fikri ve sosyal ortamını tanımayı gerektirmektedir. Bu noktadan hareketle çalışmamızın ikinci ve ana bölümünde ise, Ali el-Hibrî ve kaleme almış olduğu Fıkh-ı Ekber Tercümesi isimli eseri yer alacaktır. Ali el-Hibrî'nin bu eseri tercüme bir eser olmasının yanında Ali el-Kārî 'nin şerhi ile yer yer uyumlu olmasından mütevellit incelemelerde diğer şerh ve tercümelerle kıyas yoluna gidilerek tercüme, şerh ve şerhli tercümenin Osmanlı ilim dünyasındaki konumu Ali el-Hibrî'nin eseri bağlamında tahlil edilmeye çalışılmıştır. Ali el-Hibrî'nin kelâmi bir kaygıdan ziyade bir akāid şerhi mesabesinde yazmış olduğu bu eserinde mutasavvıf kimliğinin izleri görülmüş olsa da eserin tamamında sûfî bakış açısının hâkim olmadığı vurgulanmalıdır. Çalışmamızın sonuç kısmında ise elde ettiğimiz malumat özet bir şekilde ifade edilmiştir."
