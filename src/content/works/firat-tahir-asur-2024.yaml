abstract: "Tâhir b. Âşûr son dönem âlimlerinin en önemlilerinden biridir. En meşhur eseri et-Tahrîr ve't-Tenvîr isimli 30 ciltlik Kur'an tefsiridir. Bu çalışmamızda Tâhir b. Âşûr'un Kur'an-ı Kerim'in hukuk ayetleri üzerine yaptığı tefsirlerini sistematik olarak inceleyeceğiz. Kendine özgü tarzla izlediği metotları ve kullandığı kaynakları, bu kaynaklarda yer alan bilgilerle aynı fikirde olduğu veya farklı düşündüğü konuları aktarıp çalışmamızın sonucunda konulara olan yaklaşımını açıklığa kavuşturmaya çalışacağız. Çalışma; giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde Tâhir b. Âşûr'un hayatını, yaşadığı dönemdeki İslam dünyasının ve Mağrib coğrafyasının durumunu; birinci bölümde, Tâhir b. Âşûr'un hayatı, hocaları, ilmî şahsiyeti ve eserlerini; ikinci bölümde ise Tâhir b. Âşûr'un tefsirinde ahkâm ayetlerine yaklaşımlarını, üçüncü bölümde ise muamelat hükümlerini inceledim. Tâhir b. Âşûr açıklamalarında kendisinden önce yazılan tefsirlerden yararlanmıştır. İbn Âşûr'un bu tefsiri hem rivayet hem de dirayet yönünden seçkin bir eserdir. İbn Âşûr, ahkâm ayetlerini ehl-i sünnetin amelî mezheplerinin görüşleri çerçevesinde açıklarken ehl-i sünnet dışı görüşleride yer yer eleştirmiştir. İbn Âşûr'un tercihlerinde Kuran ve ayet bütünlüğü, Arapların kullanımı, ayetin zahir anlamı, umum ve mutlak oluşu, Rasûlullah'tan gelen sahih rivayetler, ümmetin icması gibi sebepler belirleyici olmaktadır."
