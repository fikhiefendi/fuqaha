abstract: "Bu araştırma,“Abbâdî'nin Hayatı ve Hâşiyetu Ale”L-'Ubâb Adlı Eserinin Tahkiki- Fıkhî Tahlili: Taharat Bölümü\"ni konu olarak ele almaktadır. Onun içtihatları diğer fıkıh kitaplarında da incelenmiştir. Hâşiyesinde faydalandığı dil, gramer, belâgat, tefsir, usûl ve akaid gibi pek çok ilmin âlimi olan İbn Kāsım el-Abbâdî'nin ilmî statüsünün araştırmadaki önemi açıkça görülmüştür. Ayrıca Safiyyüddin el-Müzecced'e ait olan Kitâbü'l-ʿUbâb müellifin kendisinden önce gelip geçmiş olan önde gelen Mâverdî, Râfiî, Nevevî ve İbnü'l-Mukrî gibi Şâfiî âlimlerinin bulgularının bir özetini topladığı fıkıh metinlerinden biridir. Araştırmacı, çalışmasıyla birçok hedefe ulaşmıştır: Bunlardan en önemlisi mahtûtun el-Abbâdî'ye olan nispetinin ve başlığın doğrulanmasıdır. Ayrıca el-Abbâdî'nin Kitâbü'l-ʿUbâb hâşiyesinde ve diğer kitaplarında ortaya koyduğu yeni görüşlerinin yanı sıra; özelde tahâret meselelerinde, genel olarak ise diğer fıkıh meselelerinde kendi içtihatları ve görüşleri ile kendisinden sonra gelenler üzerinde bıraktığı fıkhî etkidir. Araştırma iki bölüme ayrılmıştır: Birinci bölüm el-Müzecced ve el-Abbâdî'nin hayatlarının ele alındığı, mahtûtun ve yazarın yönteminin tanıtıldığı çalışma bölümüdür. İkinci bölüm ise incelenen nassın ve araştırmanın sonucunun yer aldığı tahkik bölümüdür. Araştırmacı her bölüme uygun bir yaklaşım izlemiştir. Çalışma bölümünde niteleme ve analiz yoluyla kabul edilebilir sonuçlara ulaşmak için niceteleyici analitik yöntem takip edilmiştir. Tahkîk bölümünde ise bu sanatın ehli tarafından bilinen belirli kaidelere dayanan metinsel tahkik etme yöntemi izlenmiştir. Araştırmanın ulaştığı en önemli sonuçlar arasında araştırmacının, yayınların içerikleri ile ilgili kitapları inceledikten sonra hâşiyenin yazara atfedildiğinin ve el-Abbâdî'nin seçkin bir fıkıh düşüncesine sahip olduğunun teyit edilmesi yer almıştır. Bu, sadece rivayetle yetinmemek, meselelerde içtihat etmek ve sonraki Şâfiîlerin görüşlerine başvurmak gibi hükümler üzerindeki kıyas açıkça ortaya çıkmıştır. Ayrıca talebeleri üzerinde belirgin bir etki bırakmıştır ki onun hakkındaki rivayetlerinden ve onun sözlerinden hüküm çıkarmalarındaki muhakemelerinden de anlaşılmıştır."
