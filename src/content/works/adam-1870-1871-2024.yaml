abstract: "Toplumun en küçük yapı taşı olan aile kurumu insanlık tarihi kadar eskidir. Bu kurum farklı dönemlerde, değişik coğrafyalarda toplumun dini, sosyal, kültürel ve iktisadi yapılarına göre farklılık göstermiştir. Neslin devamını sağlayacak olan aile kurumunun oluşması nikah akdi ile gerçekleşir. Nikah akitlerine dair, hukuk sistemleri arasında farklılıklar her dönem mevcuttur. Nikah akdi için İslam hukukunda belli unsur ve şartlar belirlenmiştir. Bu çalışma 18 yy. başlarında Osmanlı Devleti'nin en önemli kaza merkezlerinden biri olan Trabzon'da ailenin oluşum sürecini adımlarından biri olan, nikah kayıtlarını içermektedir. Bu kayıtlar kadılar tarafından verilen hükümlerin yazılmış olduğu şeriye sicillerinden elde edilmiştir. Bu siciller birinci elden kaynak hükmünde olup, çalışma konumuzu içeren ailenin kurulma aşaması ve yapısı bağlamından dolayı bizim için önem arz etmektedir. Çalışmamızda Trabzon şeriye sicillerine kayıt edilmiş olan 1119-1124(1707-1712) Yılları arasına kapsayan 5 yıllık nikah kayıtları incelenerek, öncelikle bu kayıtlardaki kişiler, katılma durumları, mehir miktarları, medeni halleri ve nikah tarihlerini sırasıyla yazılmıştır. Daha sonra bu nikahlara katılan kişilerin medeni durumlarına, katılma durumlarına, mehir oranına ve ünvanlarına göre sayısal verilerin ardından analizleri tespiti yapılmıştır. Ardından Müslim Gayr-ı Müslim nikahlarının isimlerinin tespiti yapılmıştır. Bu verilerle Trabzon'a ait sosyal ekonomik ve sosyo- kültürel yapısı hakkında bilgiler ortaya çıkmaktadır."
