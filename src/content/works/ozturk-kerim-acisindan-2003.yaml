abstract: "Bu çalışmada Kur'an'ın, tarihselci yöntemlerle anlaşılmasını öneren düşünceler Kur' an' in özellikleri dikkate alınarak incelendi. Araştırma üç ana bölümden meydana geldi. Birinci bölümde, tarihselcilikle ilgili kavramlar, olayların zaman boyutunu oluşturması açısından tarih ve tarih üzerine gelişen felsefeler incelendi. Kısaca belirtilecek olursa tarih felsefeleri ve bu felsefelerden doğan tarihselci yöntem ortaya konulmaya çalışıldı. Tarihselci yöntem ve tarih felsefeleri ele alınırken eleştirmek yerine bu felsefelerin birbirine yönelttiği eleştirileri aktarmakla yetinildi. Bu bölümün amacı, Kur'an'nm tarihselci yöntemle okunması nasıl olabilir? sorusunu, yöntemi açıklayarak cevap vermekle sınırlı tutuldu. ikinci bölüm de Kur'an'ın tarihselliği ve bazı özellikleri incelendi. Bu bölümde cevabı aranan temel soru şu idi: Kur' an yedinci asrın ürünü olabilir mi? Yedinci asır düşüncesi ve kültürel vasatı Kur' an' ı ortaya çıkartacak durumda mıydı? Tezin başlangıçtaki hipotezi bu soruya olumsuz cevap vermeyi öngörüyordu. Bu sebeple Kur'an'ın vahiy edilmiş olması gibi insan yönü de bu bölümde incelendi. Ayrıca, ilk muhataplarım ne kadar dikkate aldığını anlamak için sebeb-i nüzul konusu ve nesh konusuda bu bölümde incelendi. Üçüncü bölümde tarihselciliği önerenler ve tarihselciliğe karşı çıkanların görüşlerine yer verildi. Tarihselciliği öneren, Fazlur Rahman daha yakından incelendi. Özellikle Kur'an'ı anlamaya yönelik teori geliştirmiş olduğundan daha özel bir yer tuttu. Ayrıca tarihselliği insan açısından ele alan iki görüş incelendi. Yedullah Kazmî'nin iman temelli bir felsefe geliştirme çabası farklı bir bakış açısı ile yaklaştığı için Fazlur Rahman' a karşı bir görüş olarak yer aldı."
