abstract: "?İslam Hukukunda Boşa(n)mada Şahit Bulundurma Zorunluluğu?, İslam AileHukukunda ne kadar önemli ve gerekli olduğu konusu üzerinde durulan ve farklıyaklaşımlarla incelenen bir konudur. Gerek kocanın ve gerekse boşama yetkisi alankadının boşaması sırasında şahit bulundurması gerekli midir? Ya da şahit bulundurmakboşamanın geçerlilik şartı mıdır, yoksa şahitsiz boşama geçerli midir? İslâm Hukukundagenel olarak kocanın irade beyanını sözlü ve yazılı olarak nikâhlı eşine yöneltmesininyeterli olduğu kabul edildiği için, ayrıca şahidin bulunmasına gerek olmaksızın boşamageçerli sayılmıştır. Özellikle bu görüşü benimseyenler Ehl-i Sünnete mensup olanlardır.Bu durumda İslam Hukukunda çoğunluğu oluşturan görüşe göre, boşamada şahitbulundurmak şart değildir. Ancak şahit bulundurma, eşlerin daha sonra dönüşü inkâretmesi durumunda bir ispat kolaylığı sağlayacağı için, uygulanması güzel olandavranışlardan sayılmıştır. Buna karşın Şâfiî iki görüşünden birinde; ilk nikahta şahitvacip olduğu gibi, ric'î boşamada da şahit bulundurmayı gerekli görmüştür. Caferîleregöre ise iki adil şahidin huzurunda yapılmayan boşama geçerli sayılmamıştır. Bu görüşüZahirîler de vurgulamaktadır. Boşamanın şahitli oluşu, boşanmadan dönme ve boşanmairadelerinden doğan pek çok hakkın korunmasını sağlamak ve ispatını kolaylaştırmakgibi pratik yararı bulunan ve sonuçlar doğuran usûle ilişkin bir uygulamadır. Özellikleboşanmış kadının haklarını koruyucu özelliklere sahiptir. Nitekim Osmanlı Hukukmevzuatında ve uygulanmasında, özellikle boşanmaların resmî kayıtlara geçmesinisağlayıcı gelişmeler olmuştur. Tanzimat öncesi dönemde, daha çok boşayan koca, bazende boşanan kadın, durumunu mahkeme kayıtlarına geçirtmiştir. Daha sonrakidüzenlemeler, evlenmeler gibi, boşanmaların da imamlar ve ruhanî reislerce, nüfusidaresine bildirilmesini zorunlu kılmıştır. Hukuk-ı Aile Kararnâmesi ise, boşamadurumunda kocanın `boşama kararını' hâkime beyan etme zorunluluğunu getirmiştir.Bütün bu gelişmelerden maksat, boşama sonucunda doğacak hakların yerinegetirilmesini sağlamaktır. Boşamada şahit bulundurma, söz konusu hakların ispat aracıolması bakımından önemli bir ?hukûkî prosedür? olarak değerlendirilmelidir."
