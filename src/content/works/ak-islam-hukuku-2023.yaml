abstract: "Kur'an-ı Kerim insanın, Allah'ın yeryüzündeki halifesi ve yaratılmışların en şereflisi olduğunu bildirmekte ve İslam dinindeki konumunu belirlemektedir. İnsanların hayatları, beden bütünlüğü, hürriyetleri ve mahremiyetleri, şeref ve itibarları dinen ve hukuken korunmuştur. İslam dini, insanların kişilik haklarını oluşturan bu unsurları belirli emir ve yasaklarla koruma altına almış, ihlali durumunda hem uhrevi hem de dünyevi müeyyideler öngörmüştür. Hukuken öngörülen müeyyideler; kısas, diyet, kazf haddi gibi naslar tarafından belirlenen yaptırımlar olabildiği gibi; hakkında nass bulunmayan hususlardan hâkimin takdirine bırakılmış tazir cezaları da verilebilmektedir. Bunlar; suçluyu uslandırma maksadıyla dayak, hapis, kınama, sürgün, teşhir veya mal ödetmek suretiyle verilen tazir cezalarıdır. Sosyal medya platformlarının herkesin elinin altında olması, bilinçsizce kötü niyetli kimselerin bu platformları kullanmasıyla çok fazla hak ihlalleri meydana gelmektedir. Bu platformlar üzerinden yapılan paylaşımlar, güvenlik zafiyeti, bilişim suçları nedeniyle bireylerin ruh sağlığının bozulması, mal varlığına ve manevi varlığına karşı saldırıların yapılması ile kişilik hak ihlalleri meydana gelmektedir. Bu saldırılar platformların doğası gereği geniş yankı uyandırmakta, her zamankinden daha fazla meydana gelmektedir. Sosyal medya platformlarının yeterli denetime tabi tutulmaması, çok sayıda kişinin kolayca erişim sağlayabilmesi, bilinçsiz kullanıcıların bulunması, sosyal medyanın teknik özellikleri ve sınır aşan doğası nedeniyle işlenen suçların tanımlanması, ispatı ve hangi yaptırımın uygulanacağı hususunda sıkıntılar yaşanmaktadır. Öte yandan eşref-i mahlûkât olarak nitelendirilen insanın haklarının korunması İslam hukuku açısından büyük öneme haizdir. Bu zorluklara rağmen hangi platform üzerinden olursa olsun bir saldırı söz konusu ise bunun tespit edilmesi ve hangi yaptırımın uygulanacağının belirlenmesi zorunluluk arz etmektedir."
