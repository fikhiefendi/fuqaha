abstract: "Dinin aslî unsurlarından olan ibâdetler, Allah Teâlâ'ya iman edip Müslüman olan herkesin yerine getirmesi gereken kural ve emirlerdir. İbadetlerde mükellef olma konusu; ibâdetin mahiyeti ve amacına, bir ibâdeti yerine getirmesi istenen kimsenin güç, imkân ve sorumluluklarına göre sınıflandırılmıştır. Mükellefin bir ibâdeti yaparken ona vücûbiyet yüklenmesi, vücûbiyeti yerine getirirken yapılan ibâdetin sıhhati ve edâ edilişi konularındaki fıkıh ulemasının ihtilafları, söz konusu sınıflandırmanın sebeplerindendir. Ayrıca bu sınıfları teşkil eden vücûb şartları, sıhhat şartları, edâ şartları hususunda mezhepler açısından ibâdetler bağlamında bazı ayrımlar söz konusudur. Sözgelimi, Hac ibâdetinde“sağlıklı olmak”şartı Ebû Hanîfe ve İmam Mâlik'e göre vücûb; Ebû Yusuf, İmam Muhammed, İmam Şâfiî, Ahmet b. Hanbel'e göre ise haccın edâsının şartıdır. Bu konuda ihtilafın meydana gelmesine; mezhep imamlarının ibâdetlerin vakti konusunda, kavramlara yükledikleri anlamlar ve kabul ettikleri delillerin farklı olması gibi etkenler sebep olmuştur."
