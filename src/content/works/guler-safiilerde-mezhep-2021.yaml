abstract: "Şâfiî mezhebinde mezhep içi tercih işleyişini konu edinen bu çalışma giriş, sonuç ve üç bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu, amacı, kaynakları ve yöntemi ele alınmıştır. Bunun yanı sıra çalışmayla ilgili olan gerek Türkçe gerekse Arapça literatür hakkında detaylı bilgiler verilmeye çalışılmıştır. Mezhep içi tercihin mahiyetini ortaya koymayı hedefleyen birinci bölümde öncelikle mezhep içi tercihin tanımı, çeşitleri, başlangıcı ve sürekliliği incelenmiştir. Daha sonra ise tercihin unsurları, konusu, amacı ile tercih sebepleri ve diğer fıkhî istidlâl yöntemleriyle olan ilişkisi irdelenmiştir. İkinci bölümde mezhep içi tercihin gerekliliği ve râcih görüşün bağlayıcılığı meselesi müçtehit müftî, mukallid müftî ve müsteftî açısından ayrı ayrı incelenerek konunun daha iyi anlaşılması amaçlanmıştır. Üçüncü bölümde mezhep içi tercih usûlünün mahiyeti; konusu, gayesi ve muhatabı çerçevesinde ele alınmıştır. Özellikle bu usûlün konusu içerisinde yer alan şahıs ve eser merkezli tercih ilkeleri ayrı bir öneme sahiptir. Zira şahıs merkezli tercihte başta İmam Şâfiî'nin farklı kavilleri ile mezhebe mensup diğer müçtehitlerin farklı görüşleri arasında uygulanacak tercih kriterleri önem arz etmektedir. Eser merkezli tercih ilkelerinde de aynı durum söz konusudur. Çalışmanın sonuç kısmında ise ulaşılan tespitler ortaya konmuştur. Anahtar Kelimeler: Şâfiî Mezhebi, Tercih, Mezhep İçi Tercih, Mezhep İçi Tercih Usûlü"
