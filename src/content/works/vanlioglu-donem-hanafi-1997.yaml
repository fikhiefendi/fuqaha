abstract: "Bu kitap Debûsî'nln usulü fıkha dair olan ve asırlarca kendinden sonraki kaynaklara ışık tutan eseridir. İslâm Hukuk Tarihçileri bu eserin müellif merhuma aidiyeti konusunda ittifak etmişlerdir. Maverâünnehr fukahasının vazgeçilmez kaynağı olan bu kitab, Serahsî ve Pezdevî gibi seçkin usulculerin de temel kaynağı olmuştur. Kitabın özellikleri 1) Fukaha mesleğine göre yazılmıştır. 2) Müellifi bir Türk olmasına rağmen dili son derece sadedir. Akıcı bir üslûba sahiptir. 3) Mükemmel bir sistemle yazılmıştır, öyleki onun sistemi daha sonraki eserlere esas teşkil etmiştir. 4) Müellifin hukuka çok yönlü bakışı sebebiyle mukayeseli bir usul kitabı olmuştur. 5) Diğer usulü fıkıh kitaplarının hiç işlemediği konulan işlemiştir. 6) Deliller bahsi başka kaynağa ihtiyaç bırakmayacak derecede mükemmeldir. 7) Kıyas bahsi en geniş ve en sistemli bir şekilde işlenmiştir. 8) Son bölümler ilham, taklîd v.b. konulara ayrılmış ve Tevhîd İlmine ait bazı konular da usulü fıkıh da değerlendirilmiştir. Müellif merhum kitabının başında güzel bir öğüt ve nasihattan sonra bu kitabı niçin telif ettiğini şu cümlelerle ifade ediyor:“ Şüphesiz bu ilmin şerefini gördüğümde, onun nurunun da insanın kalbinde ateşin ağacın içinde gizlendiği gibi gizlendiğini gördüm. Baktım ki insanları hidayete ulaştıran hüccetleri inceleyen himmet sahipleri müstesna, bu nura kimse el uzatamaz. Çoğu insanlar onu hisleriyle almışlar ve alırken kaybetmişlerdir. Bu nuru, geçmiş ulemaya benzerim ümidiyle, (hüccetleri açıklayarak) harekete geçirmek (parlatmak) için geçmiş alimlere tabi olmayı gerekli gördüm, sonra bu nuru (mürekkep yakıtıyla) kitapların sayfalarında hakkıyla tutuşturayım istedim. Allah (C.C.) 'dan yardım isteyerek - ki güç ve kudret ancak O'na aittir- gayem hidayet kitabını (arapça metin 3jİO$JI o\\sS”^y3) kuvvetlendirmek, batılda ısrardan kaçınmak, (kulluk) imtihanını oluşturan dört delili ortaya çıkarmak, görenlerin çoğunun dilleri tutulacak tarzda bazısını bazısından ayıracak tarifleri beyan etmektir\"108. 108 Bkz. Arapça metin, s. 7. 40"
