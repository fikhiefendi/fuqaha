abstract: "İslam'da belli zenginliği olan Müslümanlara farz olan zekâtın sosyal ve ekonomik başta olmak üzere maddi-manevi önemli işlevleri bulunmaktadır. Zekât ile benzer ve farklı yönleri olan verginin de çeşitli katkıları olmaktadır. Öte yandan zekâtın verilebildiği gruplar vardır. Bu gruplar genel manada“muhtaçlık”ve özelde maddi muhtaçlıklar ile ilgilidir. Verginin tahsili sonrasında da maddi yönden muhtaç olanlara yönelik sosyal yardımlar yapılabilmektedir. Bu çerçevede, vergi yoluyla verilen sosyal yardımlar ile zekâtın verilebildiği grupların kesiştiği yerlerde benzerliklerin olduğu varsayılarak, tezin temel sorunsalı, Türkiye'de vergilerle finanse edilen muhtaç durumda olanlara yönelik (Aile ve Sosyal Hizmetler Bakanlığı özelinde) yapılan sosyal yardım kalemleri ile zekât verilebilen gruplar arasındaki kesişme yerlerinin neler olduğu ve bunlara yönelik neler yapılabildiği veya yapılabileceğidir. Bu sorunsalı incelemek için de literatüre dayalı bir nitel bir yöntem izlenmektedir. Bu kapsamda tez üç ana bölümden oluşmaktadır. Birinci bölüm zekât ve vergi ile ilgili kavramsal çerçeve sunmaktadır. İkinci bölümde zekâtı verilebildiği gruplar ana hatları ile açıklanmaktadır. Tezin üçüncü ve son bölümü, vergiler ile finanse edilen sosyal yardımlar ile zekâtın kesiştiği yerler, Türkiye ölçeğinde ortaya konmaktadır. Anahtar kalemeler: Zekât, vergi, sosyal yardım, yoksulluk, Aile ve Sosyal Hizmetler Bakanlığı."
