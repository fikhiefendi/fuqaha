abstract: "ÖZET Sünnet, İslam Hukuku'nun Kur'an'dan sonra ikinci kaynağı konumundadır. Bundan ötürü hem hadislerin aslına uygun bir şekilde nakledilmesi hem de doğru bir şekilde anlaşılması zaruridir. Hadislerin doğru anlaşılmasına büyük bir katkı sunan şerhler, erken dönemlerden itibaren hadis âlimlerinin gayretlerini teksif ettikleri önemli alanlardan biri olmuştur. Bunun bir sonucu olarak, birçok şerh yazılmıştır. Keşmîrî ve Mübârekpûrî, Tirmizî'nin Sünen isimli eseri üzerine şerh yazan müelliflerdendir. Günümüzden bir asır önce yaşamış Keşmîrî Hanefî, Mübârekpûrî ise Selefî ekolüne mensuptur. Keşmîrî ve Mübârekpûrî'nin eserlerini Hanefî ve Selefî prensipleri açısından karşılaştırmayı konu edinen bu tez, giriş ve üç bölümden oluşmaktadır. Giriş bölümünde konu, kaynaklar ve motot belirlenmiştir. Birinci bölümde Hanefîlik- Selefîlik olgusu ile Hanefî ve Selefî prensipleri üzerinde durulmuştur. Bu bağlamda Hanefî ve Selefîlerin kurucuları kabul edilen ehl-i re'y ve ehl-i hadise de değinilmiştir. İkinci bölümde sened ve metin tenkit kriterleri açısından her iki şerh karşılaştırılmıştır. Üçüncü bölümde ise her iki şerhin karşılaştırması, Hanefî ve Selefî prensipleri ışığında yapılmıştır. Bu çerçevede Keşmîrî ve Mübârekpûrî'nin bağlı oldukları ekolün prensiplerine ne kadar uydukları irdelenmiştir. Bu bölümlerde elde edilen bilgiler ışığında da sonuç bölümü oluşturulmuştur."
