abstract: "İbnü'l-Hümâm, hicrî dokuzuncu yüzyılda yaşamış olan önemli bir Hanefî fıkıh âlimidir. Mezheplerin kurumsallaşması ve tercih ehli tarafından amel edilecek görüşlerin tesbit edilmesinden sonra yaşamış olmasına rağmen yaptığı özgün tercihleriyle temâyüz etmiştir. Ortaya koyduğu tercihlerin bir bölümünde mezhep çizgisini tamamen terk ederek diğer mezheplere meyletmiş veya da mezhebi ile diğer mezhep arasında bir denge sağlamak adına bir birine zıt iki hüküm arasında ara bir hükmü tercih etme yoluna gitmiştir. Mezhep disiplinine bağlı kalmanın önemli olduğu bir dönemde ortaya koyduğu tercihler herkesin dikkatini çekmiş savunucuları olduğu gibi eleştirenleri de olmuştur. Müellifin en önemli eserlerinden biri de, şüphesiz, Merğînânî'nin (593/1197) el-Hidâye adlı eserinin şerhi niteliğinde olan Fethu'l-Kadîr'dir. İşte bu çalışmada İbnü'l-Hümâm'ın söz konusu eserinde ortaya koyduğu özgün tercihlerin tesbitine yer verilmiş, konu tertibine uygun bir şekilde bu tercihleri zikredilmiştir."
