abstract: "Bu çalışmada ana hatlarıyla borcun başka bir mahalde ödenmesini ifade eden süftece uygulaması ele alınmış ve İslam hukuku açısından incelenmiştir. Süftece uygulaması, borç verenin yoldaki olası riskleri ve transfer maliyetlerini borçluya yükleme gayesi ihtimali nedeniyle ilk dönem fıkıh âlimleri tarafından tasvip edilmemiştir. Sonraki dönem fıkıh âlimleri ise bu tür bir uygulamanın genel olarak şart koşulmaksızın yalnızca muhataba iyilik amacıyla yapılması durumunda caiz olduğunu ifade etmişlerdir. Çalışmamızda süftecenin kavramsal çerçevesi, meşruiyet tartışmaları, süftecenin unsurları ve uygulanması araştırılmıştır. Tezimiz bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında süftece ile ilgili yüzeysel bilgiler paylaşılmış, ticaretteki konumuna değinilmiş ve bu konu ile ilgili yapılan bazı çalışmalar zikredilmiştir. Birinci bölümde ise süftece kelimesinin üzerinde durulmuş, ilişkili bazı terimler ele alınmış ve konu ile ilgili meşruiyet tartışmalarına yer verilmiştir. İkinci bölümde ise süftece, unsurları ve uygulanması açısından ele alınmış, tarihî tecrübeye yer verilmiş ve bazı özel hükümleri aktarılmıştır. Kişisel değerlendirmelerimizin yer aldığı bir sonuç ile çalışmamız sonlandırılmıştır."
