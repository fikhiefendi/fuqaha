abstract: "Bu tez çalışması, Sünen-i Ebî Dâvûd'da İmam Şâfiî'nin görüşlerine muhalif olarak yer alan rivayetleri konu edinmektedir. Hadis literatüründe önemli bir yer tutan söz konusu eserin; tahâret, namaz, zekât, oruç, hac ve kurban gibi ibadete dair çeşitli bölümleri bağlamında İmam Şâfiî'nin görüşleriyle uyuşmayan rivayetlerin ortaya konulup incelenmesi araştırmanın temel amacını oluşturmaktadır. Araştırma, rivayetlerin isnad ve metin analizini içeren nitel bir yöntemle yürütülmüş, İmam Şâfiî'nin görüşleri, delilleri ve rivayetlere yönelik yaklaşımı detaylı bir şekilde ele alınmıştır. Sünen-i Ebî Dâvûd'a yazılan klasik şerhler, Şâfiî mezhebi âlimlerinin eserleri ve diğer temel hadis kaynakları bu değerlendirmelerde başvurulan önemli kaynaklardır. Tezin bulguları, İmam Şâfiî'nin rivayetlere yaklaşımındaki metodolojik derinliği ve rivayetler arasındaki ihtilafların çözümünde ortaya koyduğu sistematik anlayışı gözler önüne sermektedir. Çalışma, hadis ve fıkıh ilimleri arasındaki ilişkiye katkı sağlamakla birlikte, İmam Şâfiî'nin rivayetlere yönelik farklı yorumlarını anlamaya yönelik yeni perspektifler sunmaktadır. Ayrıca, Sünen-i Ebî Dâvûd üzerine yapılan sınırlı akademik çalışmalara önemli bir katkı sunarak bu eserin daha detaylı analizine zemin hazırlamaktadır. Bu çalışma, hadis ve fıkıh literatüründe İmam Şâfiî ve Ebû Dâvûd gibi iki önemli şahsiyeti bir araya getirerek literatürdeki önemli bir boşluğu doldurmakta ve her iki ilim dalının karşılıklı etkileşimini daha iyi anlamamızı sağlamaktadır."
