abstract: "Müslümanlar için zekâtın verilmesi ilahi bir emirdir. Zekât, ihtiyaç sahibi zümrelere zaruri ihtiyaçlarını karşılamaları için verilen maddi imkanlarla yapılan bir ibadet ve ekonomik destektir. Diyanet İşleri Başkanlığı tarafından yayımlanan zekât ile ilgili hutbelerin toplumun zekât verme eğilimi üzerindeki etkisi bu tezin temel araştırma sorusunu teşkil etmektedir. Tez çalışmasında karma yöntem kullanılmıştır. İlk olarak Diyanet İşleri Başkanlığı'nın 2011-2024 yılları arasında zekât ile ilgili yayımladığı hutbeler içerik analizine tabi tutulmuştur. İçerik analizi sonuçlarına göre zekât konulu hutbelerin, sadece dini bilinci değil; aynı zamanda toplumsal duyarlılığı, dayanışmayı ve sosyal adalet duygusunu da vurguladığı tespit edilmiştir. İkinci olarak nicel istatistiksel analizler kullanılarak aralık 2024 ile mart 2025 tarihleri arasında çevrimiçi anket uygulanmıştır. Veri toplarken kolayda örnekleme yöntemi kullanılmıştır. Cuma ve bayram namazlarına gitme ve camide hutbeyi dikkatle dinleme sıklığı arttıkça zekâtın verilmesiyle toplumsal dayanışmanın artacağına olan inancın arttığı gözlemlenmiştir. Bireylerin zekât verme eğilimlerinin yalnızca ekonomik durum ya da meslekle açıklanamayacağı tespit edilmiş, zekât verme davranışının bireyin dini hassasiyeti ve ibadet bilinciyle daha yakından ilişkili olduğu görülmüştür. Analiz sonuçları dindarlığın zekât verme eğilimini doğrudan etkilediğini göstermektedir. Cuma ve bayram namazlarına gitme ile hutbeyi dikkatle dinlemenin, dindarlık ve zekât verme eğilimi arasındaki ilişkide aracı bir rol oynadığını ve istatistiksel olarak anlamlı bir şekilde zekât verme eğilimini arttırdığı tespit edilmiştir. Genel itibariyle zekât verme eğiliminin demografik etkilerden ziyade doğrudan dindarlıkla ilişkili olduğu; zekât ile ilgili hutbelerin bu eğilimi artırdığı ve zekâtın Allah'a (cc) yakınlaştıran niteliğinin ışığında toplumsal dayanışma ve sosyal adalet boyutlarına dair algıları da olumlu derecede etkilediği sonucuna varılmıştır. Türkçe literatürde Diyanet İşleri Başkanlığı'nın yayımladığı hutbelerde zekat üzerine yapılan aramalarda bu konu üzerine benzer çalışmalar olmakla birlikte gerek karma yöntem gerekse çalışılan konu itibariyle henüz bir akademik çalışma yapılmamış olduğu tespit edilmiştir. Konu özgün bir çalışma alanını teşkil etmektedir. Konunun çıktılarının literatüre önemli bir katkı sunması beklenmektedir."
