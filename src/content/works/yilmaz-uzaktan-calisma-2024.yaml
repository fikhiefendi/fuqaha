abstract: "Teknolojik gelişmeler ve pandemi gibi zorunlu durumlar nedeniyle yeni iş modelleri ve bu iş modellerine göre yeni yönetim anlayışları geliştirmek gerekmektedir. Uzaktan çalışma da yeni bir yönetim anlayışı gerektiren iş modellerinden biridir. Uzaktan çalışma ortamı bankalara maliyetleri düşürme, çalışan bağlılığı, yetenekleri elde tutma ve yetenek kazanımı bakımından avantajlar sağlayabilmektedir. Özellikle pazarda rekabetçi avantajı kazanmak isteyen katılım bankalarının uzaktan çalışma ortamına entegre olabilmeleri için çalışanların tutum ve algılarının en az işletmelerin belirleyecekleri yönetim anlayışı ve uygulamalar kadar önem kazanmaktadır. Bu çalışmanın amacı katılım bankalarındaki çalışanların uzaktan çalışma tutumları ve dönüşümcü liderlik algılarının örgütsel bağlılık üzerindeki etkisini birlikte incelemektir. Bu anlamda uzaktan çalışma tutumu, dönüşümcü liderlik ve örgütsel bağlılık ilişkilerini ayrı ayrı inceleyen literatüre katkı sunulmaktadır. Bu çalışma için nicel araştırma dizaynı benimsenmiştir. Araştırmanın verileri, Türkiye'deki katılım bankalarında çalışan 520 kişiden rastgele örnekleme yöntemi ve çevrimiçi anket tekniğiyle toplanmıştır. Çalışanlardan 61 tanesi sadece ofis ortamında çalıştıkları için doldurdukları anketler kapsam dışı bırakılmıştır. Araştırmadaki veriler yapısal eşitlik modellemesi kullanılarak AMOS 23 programı ile analiz edilmiştir. Araştırmanın bulguları, katılım bankası çalışanlarının uzaktan çalışma tutumu ve dönüşümcü liderlik algılarının örgütsel bağlılık üzerinde pozitif ve anlamlı yönde etkilediği sonucuna ulaşılmıştır."
