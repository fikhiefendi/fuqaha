abstract: "Kuruluşlarından bu yana, İslâm devletleri önemli sayıdaki gayrimüslim tebaasını ihtivâ etmiştir. İslâm devletlerinin gayrimüslimlerin durumunu düzenleme tarzları da bu tezin ana konusunu teşkil etmektedir. Bir İslâm devleti olan ve çok sayıda gayrimüslim tebaası bulunan Osmanlı İmparatorluğu'nun hukukî sistemi seleflerinden farklılık göstermekteydi. İslâm hukuku dışında, İmparatorluğu'nun hukukî mevzuatı Sultan tarafından devletin pragmatik gerekçelerine hizmet etmek üzere çıkarılan `örfî kanunlarına da dayanmaktaydı. Şerî`at ile sultanî kanunların karşılıklı ilişkisi ve onların gayrimüslimlerin durumuna olan etkileri İslâm hukukunun temsilcileri olan müftüler ve şeyhülislâmlar tarafından çıkarılan bir hukukî belge olan fetvâlar ve hükümetin yasaları olan kânûnlar ve kânûnnâmeler örneğinde incelenecektir. Devletin hukukî mevzuatı genellikle siyasî gerekçeleri gözetmekteydi ve bu durum bazen gayrimüslimlerin lehine olabildiği gibi, tam tersine, onların durumunu vi kötüleştirebiliyordu. Diğer taraftan, şerî`at, gayrimüslimlere ayrıcalıklı olmayan bir statü öngörürken, onların temel haklarını güvence altına alıyordu. İşbu çalışmanın alanı, zaman zaman komşu bölgelere atıfta bulunmakla beraber, Bosna eyâleti ile sınırlıdır. Bosna'nın bir sınır bölgesi olması ve sıkça meydana gelen savaşlar genel olarak cemiyeti derinden etkilemiştir. Duruma bağlı olarak, Bosna'daki gayrimüslimlerin konumu değişkenlik göstermiş ve kimi zaman şerî`atın öngördüğünün üstünde, kimi zaman da altında seyretmiştir."
