abstract: "Bu çalışmamızda Hanefî mezhebinde çok değerli ve muteber olan, kendisine şerh ve haşiyelerin yazıldığı el-Hidâye Şerhu Bidâyeti'l-Mubtedî' de İmam Şâfiî'ye nispet edilen görüşlerin muâmelât bölümünün Şâfiî kaynaklarda tahlil ve tespitini yapmaya gayret ettik. Tez çalışmamızı iki ana başlık altında ele aldık; birinci bölümde muâmelâtın özel hukukunu teşkil eden satım sözleşmesi, (bûyu') sarf, havale, kefâle, vekâlet, vedîa, âriyet, gasp icâre, vasiyet şuf'a, me'zûn, hacr, kısmet, musâkât, rehin, lukata, ikrâh, da'vâ, sulh ve hibe bahislerini, ikinci bölümde ise, kamu hukukunun içerisinde yer alan, edebu'l-kâdî, hırsızlık, meâkil, cinâyât, ikrâr, siyer, vakıf, şahitlik, diyât ve hudûd bahislerini işlemeye çalıştık. Konuları ele alırken, ilk kısımda el-Hidâye'de, İmam Şâfiî'ye atfedilen görüşleri, ikinci kısımdaysa bu görüşlerin Şâfiî kaynaklarla karşılaştırılması şeklinde işlemeye gayret ettik. el-Hidâye'de geçen ve İmam Şâfiî'nin görüşlerine muhalif olan meseleleri el-Hidâye üzerine yazılan şerhlerden; Bâbertî'nin el-Î'nâye'si, Aynî'nin el-Binâye'si İbnu'l-Humâm'ın Fethu'l-Kadîr'ini inceleyip, isabetsiz meseleleri ve sebeplerini tahkik etmeye gayret ettik. Bununla beraber Şâfiî kaynaklarından el-Umm'u, Müzenî'nin Muhtasar'ını, Şîrâzî'nin el-Muhhezzeb ve et-Tenbih'ini, Mâverdî'nin el-Hâvi'l-Kebîr'ini, Cüveynî'nin Nihâetu'l-Matlab'ını inceleyip konuyla alakalı en net ve kısa ifadeleri çalışmamıza almaya çalıştık. Eğer kaynaklarda bir ihtilaf söz konusuysa ihtilaflara değinmeye gayret ettik. Ayrıca her konuyu kendi içinde inceleyip tahlil etmeye ve ihtilaflara değinmeye gayret gösterdik."
