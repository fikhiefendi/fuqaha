abstract: "Yoksulluk, insanlığın var olduğu zamandan beri yaşanmaktadır. Yoksulluğun önlenmesi için birçok uluslararası ve ulusal kurum ve kuruluş bir takım politikalar uygulanmış ve uygulamaktadır. Yoksulluğun neden kaynaklandığı ülkelere göre değişebildiği gibi bireylerin yoksulluğu algılayış biçimlerine göre de değişmektedir. Çalışmada iktisadi ve İslami bir yaklaşım çerçevesinde yoksulluk ve yoksullukla mücadele açıklanmaya çalışılmıştır. İktisadın rasyonel, bireysel çıkarı düşünen bir anlayışına karşılık İslam dininin yardımlaşmayı ve bireysel çıkar yerine toplumu düşünen bir anlayışa sahip olmasının yoksulluğun önlenmesinde daha etkili olabileceği anlayışı dikkat çekmektedir. Bu durum Homo Economicus ve Homo Islamicus varsayımlarının karşıtlığı içinde yoksullukla mücadeleyi farklılaştırabilmektedir. İslami yaklaşım çerçevesinde Kur'an-ı Kerim ve sünnette birçok yerde yoksul, kimsesiz ve ihtiyaç sahibi kimselerin gözetilerek yoksulluğun olabildiğince ortadan kaldırılmasına yönelik bir yaklaşım vurgulanmaktadır. İslam dini yoksulluğu önlemek amacıyla birçok uygulamada bulunmaktadır. Bu uygulamalardan biri zekât ve sadaka vermektir. Zekât, zengin kesimin mal varlığından alınıp yoksul kesime aktarılmasıyla gerçekleşmektedir. Sadaka da kişinin kendi istediğiyle yoksul kesimin ihtiyaçlarını gidermek için maddi yardımda bulunmasıdır. Her ikisinde de amaç yoksul kesimin ihtiyaçlarını karşılamak olmaktadır. Kişinin çalışıp bir gelir elde etmesi de yoksulluğun önlenmesinde önemli bir yere sahip olmaktadır. Faiz de yoksulluğa neden olarak yoksul ile zengin arasındaki açığı artırdığı için yasaklanmıştır. Çalışmada yoksullukla mücadele konusunda hali hazırda izlenen iktisadi sistemin uygulamadaki yetersizliğine karşılık İslam dininin yol gösterdiği uygulamalarının etkinlik sağlayıp sağlamayacağı vurgulanmış, çalışma Kur'an ve sünnetten yararlanarak belgesel kaynak tarama yöntemi kullanılarak hazırlanmıştır."
