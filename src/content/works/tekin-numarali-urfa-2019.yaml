abstract: "Osmanlı hukuk yapısının ortaya çıkarılmasında en önemli belge türleri şer'iyye sicilleridir. Şer'iyye sicilleri kadılar tarafından görev aldıkları bölgelerde görülen davalar ile merkezden gelen hükümlerin kaydedildiği defterlerdir. Kadılar görev aldıkları bölgelerde devletin hukuki kurallarına bağlı olarak çeşitli konularda hüküm verme yetkisine sahipti. Yargı görevlerinin yanında ayrıca devletin bazı idari, beledi, mali ve mülki görevlerini de icra etmekle yükümlüydüler. Kadıların yetki alanları dönemin şartlarına göre değişebilmekteydi. Bazı dönemlerde Padişahlar bazı yetkileri farklı kurumlara devretmiştir. Bu durumda Kadıların yetki alanları daralmıştır. Çalışmamız olan 219 Numaralı Urfa Şer'iyye Sicili'nin kaydedildiği dönem de her alanda olduğu gibi hukuki alanda da değişimlerin yaşandığı Tanzimat sonrası döneme denk gelmiştir. Çalışmamızın amacı çalışma konumuz olan 219 Numaralı Urfa Şer'iyye Sicili'nin tamamının transkripsiyonunu ve değerlendirmesini yapmaktır. Çalışmamızın giriş kısmında şer'i mahkemelerin önemi ve işleyişinin anlaşılabilmesi için Osmanlı Devleti'nin hukuk sistemi ve kadılık kurumunun görevleri ve tarih içerisinde uğradığı değişimlerden bahsedilmiştir. Çalışma konumuz olan şer'iyye defterinin yazıldığı 1893-1895 yıllar Tanzimat sonrası döneme denk geldiğinden bu dönemde hukuk alanındaki değişimler ve bu değişimlerin kadılık kurumuna yansımaları da ele alınmıştır. Daha sonra sicil defterimizde yer alan davalar incelenerek o dönem Urfa'da mahkemelerin işleyişi, görülen davalar ve bunların içeriğine dayalı olarak şehrin sosyal, kültürel ve ekonomik yapısı ortaya çıkarılmaya çalışılmıştır. Bu davalarda yer alan kişilerin sadece Müslüman erkekler olmadığı kadınların ve gayrimüslimlerin de davacı ya da davalı konumda olduğu tespit edilmiştir. Davalar ile ilgili değerlendirme ve analiz yapıldıktan sonra çalışmamızın ana konusu olan sicillerin transkripsiyon kısmına yer verilmiştir. Sonuç olarak da yapılan çalışma ile ilgili genel bir değerlendirme ve çıkarım yapılmıştır."
