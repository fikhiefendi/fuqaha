abstract: "Bu çalışmada, Hanefî fıkıh literatürünün önemli eserlerinden Cessâs'ın Şerḥu Muḫtaṣari'ṭ-Ṭaḥâvî, Kudûrî'nin et-Tecrîd ve Debûsî'nin el-Esrâr adlı eserleri esas alınarak ihtilaflı fıkhî meselelerin temellendirilme yöntemleri incelenmiştir. Çalışmanın temel amacı, söz konusu eserlerde müelliflerin mezhep içi ve mezhepler arası ihtilafları ele alırken hangi delillere başvurduklarını, bu delilleri nasıl kullandıklarını ve hüküm istinbatında hangi yöntemleri öne çıkardıklarını tespit etmektir. Bu yönüyle çalışma, klasik Hanefî fıkıh eserlerinin delil, istidlâl ve mezhep içi etkileşim bakımından daha sağlıklı anlaşılmasına katkı sunmayı hedeflemektedir. Giriş ve sonuç bölümleri dışında üç ana bölümden oluşan çalışmanın birinci bölümünde araştırmaya konu olan eserler ve müellifleri hakkında genel bilgiler verilmiştir. İkinci bölümde seçilen örnek meseleler üzerinden bu eserlerdeki temellendirme yöntemleri analiz edilmiştir. Üçüncü bölümde ise müelliflerin delil kullanımı, istidlâl tarzı ve hüküm istinbatında öne çıkan yönleri karşılaştırmalı olarak değerlendirilmiştir. Çalışmada nitel araştırma yöntemlerinden doküman analizi esas alınmış ve elde edilen veriler mukayeseli analiz yöntemiyle değerlendirilmiştir. Mukayese, özellikle müelliflerin meseleleri ele alış tarzı, delil tercihleri, mezhep içi ihtilaflara yaklaşımları ve karşı görüşleri temellendirme şekilleri üzerinden yapılmıştır. Araştırma sonucunda Cessâs'ın mezhep içi ihtilaflarda çoğunlukla Ebû Hanîfe'nin görüşünü tercih ettiği ve bu tercihi naklî ve aklî delillerle temellendirdiği görülmüştür. Ayrıca Cessâs'ın, özellikle İmam Şâfiî'nin görüş, itiraz ve eleştirilerine geniş şekilde yer vererek bunlara cevap üretmeye çalıştığı tespit edilmiştir. Naklî delillerin kullanımı ve aklî istidlâl bakımından Şerhu Muhtasari't-Tahâvî'nin et Tecrîd üzerinde belirgin bir etkisinin bulunduğu anlaşılmaktadır. Bu etkinin oluşmasında müelliflerin Irak Hanefî ekolüne mensubiyeti ve aynı ilmî muhitte bulunmaları etkili görünmektedir. Buna karşılık aynı etki düzeyi el-Esrâr'da daha sınırlı şekilde gözlemlenmektedir."
