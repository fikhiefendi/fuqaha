abstract: "Modernleşmenin etkisiyle Kur'an araştırmalarında meydana gelen yöntem tartışmalarında klasik yorum yöntemlerine yönelik eleştiriler yoğunluk kazanmıştır. Bu eleştiriler içinde klasik tefsirlerin lafızcı ve parçacı olmakla okuyucuyu Kur'an'ın maksatlarından uzaklaştırdığı ana tema olarak yer almaktadır. Bu bağlamda günümüz Kur'an yorumcuları, Kur'an'ın makâsıdını aramaya ve Kur'an yorumunda makâsıdı esas almaya yönelmişlerdir. Makâsıd konusunda yapılan çalışmalarda makâsıdî yönelişin sebepleri üzerinde durulmadığı görülmüştür. Bu sebeple çalışma, günümüz Kur'an araştırmalarında Kur'an'ın makâsıdını esas alan yorumcuların tarihsel ve sosyal bağlamlarında önceki dönemlere göre daha yüksek bir vurguyla klasik bir kavram olan makâsıda atıfta bulunmalarının sebepleri, hangi motivasyonlarla bu yönelişin gerçekleştiği, müelliflerin söylemlerinde Makâsıd-ı Kur'an'ın hangi pozisyonda yer aldığı ve makâsıdın hangi işlevi gördüğü sorularına cevap arama amacındadır. Kur'an'a makâsıdî yaklaşım ve bu yönelişin sebepleri, modern dönemin şartları göz önünde bulundurularak anlaşılmaya ve tespit edilmeye çalışılmıştır. Çalışmada, modern dönemde ortaya çıkan makâsıdî yaklaşımın sosyal bağlamının yanı sıra teorik ve pratik çerçevesinin aydınlatılması amaçlanmıştır. Modern dönem Kur'an araştırmalarında ortaya çıkan makâsıdî yaklaşım, modernleşme ile gündeme gelen yorum krizini Kur'an'ın makâsıdı üzerinden giderme amacını taşımaktadır."
