abstract: "Bizi yaratan, İslam'a hidayet eden, yolumuzu ilim ve irfanla aydınlatan Allah'a zatına yakışır bir şekilde hamd olsun. Salât ve selam, seçilen peygamberimiz, efendimiz ve dostumuz Hz. Muhammed, onun âl ve ashabı ile kıyamet gününe kadar onlara iyi bir şekilde tabi olanların üzerinde olsun. İslam fıkhı ve İslam kültürüne ait her hangi bir mahtûtu tahkik etmenin önemi kimseye meçhul değildir. Bize intikal eden mahtût miras, büyük bir mirastır. Bütün ilim dallarında mahtûtların insan medeniyetindeki büyük ağırlığı vardır. Saygı ve takdiri hak eden ümmetler, miras ve ilimlerini koruyanlardır. Bununla birlikte miras, geleceğin inşasında birçok fayda sunmaktadır. Tezimiz, genelde İslam fıkhı özelde ise Şafiî fıkhında yazılmış İslâmî bir mahtût eseri ele almaktadır. O da Yusuf el-Erdebîlî'ye ait“el-Envâr lî a'mâli'l-ebrâr”isimli kitabın şerhidir. Çünkü bu kitabı Kürt âlim Molâ Muhammed el-Gerdî şerh etmiş ve“Hâşiyetü Molâ Muhammed el-Gerdî 'alâ'l-envâr”“ olarak isimlendirmiştir. Bu kitaptan bana ayrılan ve tahkik etmeye çalıştığımız kısım, ”vakf“, ”hibe“, ”lükata“, ”lâkît“, ”fey“ ve ”ganimet“ kısımlarını kapsamaktadır. Mütevazı çalışmamız, İslam hukuku ve usûlünde yüksek lisans diplomasını almak amacıyla Bingöl Üniversitesi Sosyal Bilimler Enstitüsü Temel İslam Bilimleri Bölümü İslam Hukuku anabilim dalına sunulmuştur. Çalışmamız, doğası gereği giriş, inceleme ve tahkik olmak üzere iki bölüm, sonuç ve kaynakçaya ayrılmıştır. Önsöz, kitabın metodu, bu konuyu seçmenin nedeni ve önemi, kitapla ilgili yapılan çalışmaları ve son olarak da tezin metodunu içermektedir. Birinci bölüm inceleme olup iki kısımdan oluşmaktadır. Birincisinde yazarın hayatı, eserleri, söz konusu eserde izlediği metodoloji ve eserin kaynaklarından bir nebze söz ettik. İkinci kısımda ise tahkikte yapacaklarımı, kitabın ismi, müellife nispeti ve mahtûtun vasıflarını zikrettik. İkinci bölüm ise tahkik edilmiş metinden oluşmaktadır. ”Vakf“, ”hibe“, ”lükta“, ”lâkît“, ”fey“ ve ”ganimet“ kısımlarını kapsamaktadır. Şarih, Envâr şerhini bölüm ve kısımlara ayırmamaktadır. Bu nedenle biz de asıl metin olan Envâr'ı esas alarak çalışmamızı kısımlara ayırmaya çalıştık. Eserin metnini iyice kavradık. Mahtûtun ikinci nüshasını da elde ettik. Her iki nüshayı karşılaştırdık. Aralarında farklar oldukça azdır. Başka bir nüsha daha bulmaya çalıştık ancak elde edemedik. Asıl nüshayı ana nüsha olarak isimlendirerek dipnotta ”أ“ harfi ile simgeledik. İkinci nüshayı ise ”ب\" harfi ile simgeledik. Ayrıca iki nüshada yer alan bütün ayetlerin yerlerini, hadis ve âlimlerin sözlerinin kaynaklarını gösterdik. Geçen isimlerin biyografisini verdik. Her iki nüsha arasında karşılaştırma yaptık. Sonuç kısmında ise çalışmamızda ulaştığımız önemli bazı sonuçları verdik."
