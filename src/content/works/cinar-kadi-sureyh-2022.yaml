abstract: "Tezde İslam'ın ilk kadılarından olan Kadı Şüreyh'in Hayatı, Fıkıhçılığı ve Muhakeme Usûlü açısından konumu incelenmektedir. Kadı Şüreyh'in yaşamının bilinmesi ile genel anlamda İslam çerçevesinde hareket ettiği görülen bir hakim örneği ortaya konmuş olacaktır. Tez, Giriş, Üç Bölüm ve Sonuçtan oluşmakadır. Tezin birinci bölümünde Kadı Şüreyh'in yaşadığı dönemin siyasi, sosyal ve ilmi çevresi tanıtılarak Kadı Şüreyh'in yaşamı, Müslüman oluşu, hocaları, öğrencileri ve ilim dalları ile ilgili rivayetler aktarılmış, vefatı hakkında bilgi verilmiştir. İkinci bölümde Kadı Şüreyh'in yargı-siyaset bağlamında duruşu, Şia ve müsteşriklerin kendisine yönelik yaklaşımı ele alınarak fıkıhçılığı, Hanefi mezhebindeki konumu, usulde takib ettiği yöntem, fetva vermesi ve fürû fıkha dair bazı hüküm ve görüşleri ele alınmıştır. Üçüncü bölümde Kadı Şüreyh'in Muhakeme usulündeki yeri, mahkeme salonu ve mahkemede görev yapan kimseler, dava ile dava sürecinin nasıl yürütüldüğü, ispat vasıtaları ve hükmün infazı ele alınmıştır. Sonuç bölümünde ise tezle ilgili genel bir değerlendirmeden sonra yapılan tespitlere ve neticelere yer verilmiştir."
