abstract: "İslam iktisadı, dinin temel kaynakları olan Kur'an-ı Kerim ve Hz. Muhammed'in Sünnet' i doğrultusunda iktisadi faaliyetleri ele alan bir bilimdir. Bu bağlamda dini temeller üzerine dayalı olan bu bilim dalında önemli olan mevzulardan birisi de helal kazanç konusudur. Nitekim ayetlerde ve hadislerde helal olanı yeme ve içme, helalden kazanma ve meşru yerlerde harcamaya yönelik emir ve öğütler bulunmaktadır. Bu çerçeve de İslam'da helal, hakkında herhangi bir yasak bulunmayan eylem ve durumları ifade eden bir kavram olurken haram ise işlenmesi yasak olan fiil ve durumları ifade eden bir kavram olmaktadır. Bu çalışmanın amacı, İslam iktisadının perspektifinden Aksaray ilinde helal gıda sertifika sahibi yedi işletme ile yarı yapılandırılmış mülakat tekniğini esas alarak görüşmeler gerçekleştirmektir. Bu çalışma çerçevesinde işletmelerin helal gıda sertifikasına ihtiyaç duyma nedenleri, sertifikanın firmalara ve müşterilere sağladığı katkılar ve işletmelerin, helal sertifika süreçlerinde (alım aşaması ve denetlenme aşaması) hangi sorunlarla karşılaştıkları ele alınmıştır. Yapılan araştırma sonucunda sertifika sahibi işletme yetkilileri, sertifikayı tercih etme de esas neden olarak üretilen ürünün, helalliğini ve güvenirliğini kanıtlamak olarak belirttikleri tespit edilmişken sertifikanın, işletmelere sağladığı katkılar açısından ise temelde ticari yönden ve marka güvenirliğine yönelik katkılar sağladığı, müşteriler açısından da temelde güven tesisi yönünden katkı sağladığı sonucu elde edilmiştir."
