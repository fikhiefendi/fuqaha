abstract: "slâm Hukuku'nun ana kaynakları olan Kur'ân ve Sünnet'in, Hz. Peygaber'den sonra sürekli gelisen ve degisen slâm toplumunun hukukî problemlerine çözüm getirmek üzere slâm âlimleri tarafından yorumlanmasıyla zengin bir hukuk düsüncesi ortaya çıkmıstır. Süphesiz bu zenginligin slam toplumunun yararına olması, degisik iç ve dıs faktörlerin etkisiyle ekollesen ve mezhepler halinde farklılasan slâm Hukuku'nun ana ilkelerinin ve kaynak birliginin korunmasına baglıdır. Kur'an'ın metni hususunda bütün slâm hukukçuları ittifak halinde iken, Sünnet'in muhtevasındaki ihtilaf her iki kaynagın yorumlanmasında birbirine karsıt görüslerin çogalmasıyla önemli bir problem haline gelmistir. Bu problemin çözülmesi yönündeki çalısmalara önemli bir katkı saglayabilecegi umuduyla, fıkıh mezheplerinin olusum sürecinin baslangıç döneminde yasayan Zeyd b. Ali (ö. 122/740) ve onun fıkhî görüslerinin toplandıgı el-Mecmû'ul-fıkhî adlı eser tez konusu olarak seçilmistir. Tezin giris bölümünde, Zeyd b. Ali ve eseri konusundaki farklı kanaatler ortaya konmus; I. bölümde yasadıgı dönem, hayatı, siyâsî ve ilmî kisiligi, II. bölümde eserin mahiyeti, müellife nispeti ve muhtevası incelenmis, III. bölümde de eserin bilimsel degerinin ve slâm hukuk düsüncesine katkı yönlerinin ortaya konulmasına çalısılmıstır. Bu arastırma sonunda rivayet ilmi açısından bütünüyle ona nispeti tartısmadan uzak olmasa da eserde ortaya konulan Zeyd b. Ali'nin slâm hukuk düsüncesinin, slâm hukukunun kaynak birliginin korunması ve slâm fıkıh mezheplerinin birbirine yaklastırılması çalısmaları açısından önemli bir yeri oldugu kanaati ortaya çıkmıstır. Zira bu eserin muhtevası hem Zeydîler tarafından benimsenmistir, hem de onda büyük çogunlugu dört mezhep fıkhı ile uyumlu hükümler yanında Ca'feriyye fıkhı ile uyumlu hükümler bulunmaktadır. Hz. Ali'nin fıkıh anlayısını yansıtan eserdeki merfû ve mevkûf rivayetler hem Sünnî hem de Siî kaynaklarca dogrulanabilen rivayetlerdir."
