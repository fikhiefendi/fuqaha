abstract: "Tez çalışmasında ülke bazlı ve küresel finansal faktörlerin gelişmekte olan (BRIC) ve gelişmiş (G7) ülkelerinin geleneksel ve İslami borsa getirileri üzerindeki etkileri araştırılmaktadır. BRIC ülkeleri için 26 Mart 2015 - 31 Mart 2021, G7 ülkeleri için 27 Temmuz 2015 - 31 Mart 2021 arasındaki günlük verileri kullanarak yeni moment kantil regresyon (MMQR) yöntemi uygulanmıştır. İlk makale, BRIC ve G7 ülkelerinde ülke bazlı ve küresel faktörlerin geleneksel hisse senedi getirileri üzerindeki etkilerini moment kantil yaklaşımı yöntemi kullanılarak araştırılmaktadır. Çalışma, ülke bazlı ve küresel faktörlerin, BRIC ve G7'de ayı, normal ve boğa gibi farklı piyasa koşullarında geleneksel borsa getirisi üzerinde önemli etkiye sahip olduğunu ortaya koymaktadır. Bulgular ayrıca hisse senedi piyasası getirilerinin ülke bazlı ve küresel finansal faktörlerden asimetrik olarak etkilendiğini göstermektedir. İkinci makale, BRIC ve G7 ülkelerinde ülke bazlı ve küresel faktörlerin İslami hisse senedi getirileri üzerindeki etkilerini MMQR yaklaşımını kullanarak değerlendirmektedir. Bulgular, farklı pazar aşamalarında ülke grupları arasında çeşitlendirme faydalarının olduğunu göstermektedir. Bulguların sonuçları, uluslararası yatırımcılar, piyasa oyuncuları, politika yapıcılar ve parasal otoriteler için, özellikle yurt içi ve uluslararası ekonomilerin ve finansal piyasaların istikrarını korumaktan sorumlu olan kişiler için önemli çıkarımlara sahiptir."
