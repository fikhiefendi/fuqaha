abstract: "Bu tez, 15. yüzyıl Fâkih ve Sûfilerinin önde gelen isimlerinden biri olan Abdulvehhâb eş-Şa'rânî'nin hayatını, eserlerini ve onun Fıkıh ve Fıkıh usûlüne katkılarını ele almaktadır. Yaşadığı dönemde Mısır'da Memlükler hüküm sürüyorlardı. eş-Şa'rânî, ülkenin siyasi, ekonomik ve sosyal durumun zayıfladığı bir dönem olan Mısır Memlüklarının son döneminde yaşamıştır. Küçük yaşta anne ve babasını kaybeden eş-Şa'rânî, büyük meşakkatlerle eğitimini tamamlamıştır. Fıkıh, Tasavvuf, Kelâm, Hadis, Biyoğrafi, Gramer, Coğrafya, Etnoğrafya ve Tarih gibi alanlarda söz sahibi olacak kadar eğitim almıştır. Araştırmamızda eş-Şa'rânî'nin fıkıh usulüne dair yaklaşımını Mizânu'l-Kubrâ isimli eseri bağlamında ele aldık. eş-Şa'rânî, bu eserinde bir taraftan mezheplerin temel dayanaklarının aynı kaynaklar olduğu gerçeğinden yola çıkarak bir konuda birden fazla doğru olabileceğini ortaya koymaya çalışmış diğer taraftan farklı bir öneriyi dile getirmiştir. Bu öneriye göre insanlar temelde inanç ve beden bakımından iki gruba ayrılmıştır. Dini hassasiyeti ve bünyesi güçlü olan kişiler için teşdîd kavramı kullanılmış, İnancı ve bedeni zayıf olanlar için de tahfif kavramı kullanılmıştır. Tüm fıkhi meseleler de bu iki temel kavram üzerine bina edilmeye çalışılmıştır. Bu çalışmada, ilave olarak, hem eski hem de modern dönemde fıkıh alanında yazılmış ilgili kaynaklardan ihtiyaca göre faydalanılmış ve referans olarak verilmiştir."
