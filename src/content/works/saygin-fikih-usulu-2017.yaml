abstract: "Fıkıh usulü, meseleci (kazuistik) bir özelliğe sahip olan fıkıh ilmini, küllî ve mücerret/soyut kâidelerle ifade edip, onu normatif bir bilim dalı haline getirerek tenkit ve münâzara yöntemini de öğretmiştir. Bu tenkitçi bakış açısı her şeyden önce fıkıh usulünün tedvinini etkilemiştir. Bu bağlamda tümdengelim (dedüksüyon), tümevarım (istikra-endüksüyon) ve bu iki yöntemin mezc edilmesinden oluşan metodlarla birçok eser kaleme alınmıştır. Değişik sonuçları doğuran farklı usûlî metodların kullanılması neticesinde, usûlde“cedel olgusu”ortaya çıkmıştır. Cedel ilmi, farklı açılardan olaylara bakma perspektifini kazandırmakta ve farklı ihtimalleri ortaya atma özelliğini bahşetmektedir. Bu da yapılan hataları görüp tashih etme ve farklı fikirler arasında tercihte bulunup en doğru sonuca ulaşma yeteneğini vermektedir. Bu şekilde varılan sonuçlar, usûlün de nihaî hedefi olan nâzır/müctehid-cedelciyi tatmin ettiği gibi münâzır/cedeldeki muhatabı da ikna ve/veya ilzam etmektedir. Böylece fıkıh usulü ve cedel disiplinleri arasında nazarî ve amelî boyutta münasebet oluşmaktadır. Bu münasebetin nazarî boyutu kavramsal, temellendirme ve diyalektik üslûp ekseninde şekillenmektedir. Söz konusu münasebetin amelî boyutu ise asıl ve ma'kûlu'l-asıl etrafında öbeklenen deliller ile istidlâl ve tercih çerçevesinde belirlenmektedir. Fıkıh usulü, söz konusu delillerin her birini ortaya koyup istidlâl sırasındaki hiyerarşiyi gösterirken cedel, aynı delillerin hüccet oluşuna ve o delilleri işleme sokma biçimlerine yöneltilen itirazları ele almakta ve bu itirazları bertaraf etme yöntemini göstemektedir. Cedelin anılan işlevi fıkıh usulünün iki sac ağından birini oluşturmaktadır."
