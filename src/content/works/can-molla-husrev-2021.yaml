title: "Molla Hüsrev'in Mir'âtü'l-Usûl'ü ile Zekiyyüddîn Şa'bân'ın Usûlü'l-Fıkh'ının Şer'î Deliller Bağlamında Karşılaştırılması"
titleTranslation: {"en": "Comparison of Molla Hüsrev's Mir'âtü'l-Usûl and Zekiyyüddîn Şa'bân's Usûlü'l-Fiqh in context of religious evidences"}
