abstract: "Bu tezde fıkıh usulü alanında yazılmış olan biri klasik diğeri modern iki eserin şer'î deliller özelinde üslup, yöntem, içerik ve özellikleri açısından karşılaştırması yapılmıştır. Eserlerden birisi klasik fıkıh usûlünün özelliklerini ve derinliğini yansıtan, Molla Hüsrev tarafından yazılmış olan“Mir'âtü'l-usûl”adlı eserdir. Diğeri XX. yüzyılın ilk yarısından itibaren farklı ve modern tarzda kaleme alınan eserlerden biri olan, Zekiyyüddîn Şa'bân tarafından kaleme alınan“Usûlü'l-fıkh”adlı metindir. Bu eserler dönemlerinin eğitim kurumlarında uzun süre okutulmuş ve okutulmakta olan kendilerinden önceki zengin müktesebatı özetlemiş önemli eserlerdir. Araştırma ve incelenme neticesinde eserlerin kendi dönemlerinin genel özelliklerini taşıdığı, Mir'âtü'l-usûl'ün Hanefî imamlarının görüşlerini esas alan“fukaha yöntemi”ile kaleme alındığı ve belli yönlerden de memzûc metodun özelliklerini yansıttığı tespit edilmiştir. Usûlü'l-fıkh'ın ise bütün mezheplerin görüşlerine yer vererek ve aralarında tercihte bulunarak mezhepsel kaygı taşımadan, güncel ve anlaşılır bir üslupla kaleme alındığı görülmüştür. Yüksek lisans tezi kapsamını aşmamak düşüncesiyle her iki eserin sadece şer'î delillerle ilgili bölümleri ele alınmıştır. Şer'î delilleri Molla Hüsrev Kitap, Sünnet, icma ve kıyas şeklinde dört, Zekiyyüddîn Şa'bân Kitap, Sünnet, icma, kıyas, mesâlih-i mürsele, istihsan, örf, sedd-i zerâi', şer'u men kablenâ, sahâbî kavli ve istishâb şeklinde onbir başlık altında ele almıştır. Her iki eserin de konuları pek çok yönden ortak birbirine parelel olmakla birlikte farklılıklarının da olduğu tespit edilmiştir. Eserlerde kullanılan örneklerin zengin olduğu ve birçok konuda aynı örneklerin kullanıldığı da dikkat çekmiştir."
