abstract: "Bu çalışmada, insanoğlunun cennette başlayıp dünyada devam eden hayat yolculuğunun en önemli kesiti olan aile hayatında, erkeğin mâli yükümlülüklerinin aile içi şiddetle ilişkisi araştırılmıştır. Aile kurumunu tüm aşamalarında etkileyen birçok faktör mevcuttur. Dini değerler, örf ve âdetler, sosyal çevre, uygulanan yasalar, eğitim durumu ve ekonomik şartlar bu faktörlerden bazılarıdır. Aileyi etkileyen bu etmenler aileye olumlu katkılar sunsa da zaman zaman aile içi şiddete de neden olmaktadır. Aile içi şiddet üzerine yapılan çalışmalar“Aile içi şiddet”,“Eşler arası şiddet”,“Ailede çocuklara yönelik şiddet”,“Kadına karşı şiddet”ve“Kadın cinayetleri”gibi farklı başlıklarda ele alınmaktadır. Ekonomik hayata dair yaşanan sıkıntıların aile içi şiddete etkilerini araştırdığımız çalışmamız bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Çalışmanın giriş kısmında araştırmanın amacı, önemi, yöntemi ve problem durumu ile ilgili bilgi verilmektedir. Birinci bölümde genel hatları ile ailenin tanımı, önemi ve türlerine yer verilmektedir. Bu bağlamda Kur'ân-ı Kerîm'de ve Hz. Peygamber (s.a.v.)'in hayatında aileye dair hükümlerde ele alınmıştır. Ayrıca şiddetin tanımı, türleri ve nedenleri ile birlikte şiddet olaylarına İslâm hukukunun bakışı ve güncel hukuk sistemindeki karşılıkları ele alınmıştır. İkinci bölümde ise İslâm hukukunda evlilikle beraber başlayan erkeğin mâli sorumluluklarının tanımı, delilleri, miktarı, çeşitleri ve şiddete etkileri ele alınmıştır. Sonuç bölümünde ise aile içi şiddete sebep olabilecek davranışların önüne geçebilmek adına bireylerin ve kanun koyucunun alması gereken tedbirler İslâm hukuku açısından değerlendirilmiş ve birtakım öneriler sunulmuştur."
