abstract: "Talâk ve yemn, İslam hukukunun öneml konularındandır. Talâk, nkah bağını ortadan kaldırarak ale brlğn sonlandırılmasıdır. Yemn se Allah'ın adı anılarak söylenen söze kuvvet kazandırmaktır. Talâk ve yemn ayrı ayrı hukukî şlemler olarak gerçekleşebldğ gb bu k kavram brlkte de hukuk sonuç doğurablmektedr. Şöyle k, şartlı talâk, zıhâr, lâ ve lân br yönüyle talâk şlev görürken aynı zaman da yemn ntelğ de taşımaktadır. Ancak fukahâ arasında bu konuda br ttfaktan söz etmek mümkün değldr. Şartlı talâkın geçerl lğnn yanında yemn olup olmadığı, talâkın alt başlıklarından olan lâ, zıhâr ve lânın doğurduğu sonuçlar tbaryle yemne olan benzerlkler hususunda fâkhler tarafından farklı görüşler ortaya konulmuştur. Bu çalışmada söz konusu ht laflar serdedlerek yemn le talâk arasındak münasebet ortaya konulacaktır. Ancak konu sadece bu k kavram arasındak münasebet bağlamıyla sınırlandırılacaktır. Şartlı talâk cumhur tarafından talâk kabul edlmekle brlkte bu türden br talâkın yok hükmünde olduğunu savunanlar da olmuştur. Dğer taraftan bazı âlmler se böyle br tasarrufun talâk değl yemn olduğunu söylemşlerdr. Zıhârın doğurduğu kefaret mükellefyet sebebyle yemne benzedğ, lânın se aslen br yemn olmasına karşın doğurduğu sonuç tbar le talâk olduğu söyleneblr. Lân sonucunda talâk meydana geleceğ ttfakla kabul edlmekle beraber bunun talâkın hang türü altında değerlendrleceğ konusunda ht laf edlmştr. Ntel araştırma yöntemnn kullanıldığı bu çalışmada metn analz teknğ uygulanmıştır. Atıf veya alıntı yapılan kaynağı belrtmek çn İSNAD atıf sstemnn knc versyonu kullanılmıştır. Eser ve şahıs smlernn yazımında DİA maddelerndek yazım esas alınmıştır."
