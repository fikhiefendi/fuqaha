abstract: "Küçük-orta ölçekli işletmeler (KOBİ'ler) Mali ekonomisinde büyük bir yer almaktadır, ancak işlerini geliştirmek için finansal kuruluşlardan fon alma konusunda büyük zorluklarla karşılaşmaktadırlar. Bu nedenle KOBİ'lerin fonlara kolayca ulaşmasını sağlayacak alternatif bir modele ihtiyacı vardır. Bu araştırma İslami Kitle Fonlaması Mikrofinans modelini geleneksel modellere alternatif bir model olarak önermektedir. Bu model, KOBİ'lerin finansman sorunlarını ele alarak fonlara erişmelerini ve işletmelerini genişletip geliştirmelerini sağlamayı amaçlamaktadır. Araştırmanın amacına ulaşması için mülakat ve anketten yararlanılmıştır. Anket, KOBİ'lerin finansman erişilebilirliği açısından karşılaştıkları zorlukları ve mikro-finans ve kitle fonlaması kullanma niyetlerini keşfetmek için kullanılmıştır. Veri 386 katılımcıdan toplanmış ve veriyi tanımlayıcı olarak analiz etmek için Stata kullanılmıştır. Öte yandan, modelin Mali'deki KOBİ'lerin finansmanına uygunluğu ve uygulanabilirliği açısından uzmanlarla mülakatlar yapılmıştır. Mülakat verisi tematik olarak analiz edilmiştir. Tanımlayıcı sonuçlar, Mali'deki KOBİ'lerin teminat eksikliği, yüksek faiz oranı, İslam'da faiz yasağı, bankalarla ilişkilerin olmaması, sicil kaydı ve iş planları nedeniyle fon başvurusu yapmaktan vazgeçtiklerini göstermiştir. Ayrıca, KOBİ'lerin çoğuna göre, yüksek faiz oranı, teminat, bankalarla ilişki eksikliği, uzun kredi işlem süresi, yetersiz kredi belgeleri, iş planları ve sicil kayıtları nedeniyle finansal aracılardan fonlara erişim zordur. İlaveten, Mali'deki KOBİ'ler tarafından mikro-finans ve kitle fonlaması kabul edilmektedir. Dolayısıyla, İslami Kitle Fonlaması Mikro-finans modelini kullanmaya hazırdırlar. Mülakat bulguları, İslami Kitle Fonlaması Mikro-finans modelinin Mali'deki KOBİ'lerin finansmanı için uygun ve uygulanabilir olduğunu ortaya koymaktadır. Tüm uzmanlar, İslami Kitle Fonlaması Mikro-finans modelinin KOBİ'lerin fonlara erişmesi için uygun olduğunu onaylamıştır. Ek olarak, mikro-finanslar kurumlaının finansman faaliyetlerini genişletmelerini sağlar."
