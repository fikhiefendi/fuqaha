abstract: "slam Fıkhı'nda ehliyet arızalarının ibadetlere etkisi fıkıh usulü ve fur'û fıkıh kaynaklarında dagınık bir sekilde ele alınmıs, ve bu alanda ihtiyaca cevap verir mahiyette bir çalısma, eser ortaya konmamıstır. Bu çalısmamızın amacı da mevcut olan bu eksikligi gidermek, konu ile ilgili derli toplu bir çalısma ortaya koymaktır. Bu yapılırken de öncelikle, ehliyet arızaları semâvî ve müktesebe seklinde olmak üzere iki ana bölüm altında ele alınmıstır. Semâvî Arızaların ibadetlere etkisi baslıgı altında; akıl hastalıgı, bunama, bayılma, uyku, hastalık, küçüklük, unutma, ölüm, ay hali, lohusalık gibi haller islenmistir. Mükteseb Arızaların ibadetlere etkisi baslıgı altında ise sarhosluk, sefihlik, yolculuk, cehalet, hata ve gayr-i ciddî davranmak gibi haller incelenmistir. Semâvî ve mükteseb arızalar vücûb ehliyetini kaldırmamakta ancak, edâ ehliyeti açısından birtakım özel durumları ortaya çıkarmaktadır. Ayrıca, ehliyet arızalarının hepsinin de ibadetleri aynı derecede etkilemedigi görülmektedir. Çalısmamızda da ehliyet arızalarının ibadetlere ne derecede etki ettigi ortaya konmustur."
