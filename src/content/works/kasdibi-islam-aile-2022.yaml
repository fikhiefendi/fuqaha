abstract: "Bu araştırma İslam aile hukukunda aile arabuluculuğu uygulamalarının günümüz aile problemlerine ne gibi çözümler üretebileceğini ortay koymak amacıyla hazırlanmıştır. Araştırmada Kur'an ve Sünnet'te yer alan arabuculuk konusundaki hüküm ve uygulamaları içeren âyet ve hadislere yer verilmiş, Müslüman toplumlarda arabuluculuğun işleyiş süreci ve uygulanışı ele alınarak günümüz şartlarında uygulanabilirliği tartışılmıştır Araştırmada, eşler arasında şiddetli geçimsizlik, hakem, tahkim ve sulh gibi arabuluculuk konusunu ilgilendiren kavramlar incelendikten sonra İslam aile hukukundaki aile hakemliği uygulaması, hakemlerin seçilme usulü, hakemlerin görev ve yetkileri, hakem olabilme şartları, hakemliğin sona ermesi, adli yargı ve tahkim arasındaki farklar, Hukûk-ı Aile Kararnâmesi'ndeki arabuluculuğa ait düzenlemeler, bazı İslam ülkelerindeki aile hakemliği uygulamaları ve günümüzde özellikle başta Avrupa ülkeleri olmak üzere arabuluculuk uygulamalarının neler olduğu tartışılmıştır. Ayrıca aile hakemliği konusunda Batı'daki ve Türk hukuk sistemindeki uygulamalar ile İslam aile hukukundaki uygulamalar arasındaki benzer ve farklı yönler mukayese edilmiş ve Türk hukukundaki arabuluculuk uygulamalarının sorunlu noktaları tespit edildikten sonra İslam hukukundaki aile hakemliği müessesesinin günümüze intibak sorunlarının neler olduğu tartışılmıştır. Araştırma nitel ve nicel araştırma yöntemlerinin birlikte kullanıldığı karma modele sahip bir araştırmadır. Araştırmada öncelikle aile arabuluculuğu konusu nitel araştırma yöntemlerinde en sık kullanılan analiz yöntemi olan doküman analizi yöntemiyle incelenmiş ve tartışılmıştır. Daha sonra nicel araştırma yönteminde en sık kullanılan veri toplama aracı olan anket tekniği kullanılarak toplanan veriler SPSS programı ile analiz edilerek Türk toplumunda eşler arasında ortaya çıkan sorunlar ve çözüm yolları ile ilgili düşüncelerin neler olduğu empirik verilerle ortaya konulmaya çalışılmıştır. Araştırma sonucunda, İslam hukuk geleneğinde başarılı bir şekilde uygulanmış olan Aile Hakemliği uygulamasının, günümüz aile uyuşmazlıklarını çözebilecek nitelikte olduğu tespiti yapılmıştır. Ayrıca, özellikle Batı toplumlarında aile uyuşmazlıklarının çözümü noktasında benzer uygulamaların çoktan başlamış olduğu tespiti yapılmış ve farklı ülkelerdeki uygulamalardan örnekler verilmiştir."
