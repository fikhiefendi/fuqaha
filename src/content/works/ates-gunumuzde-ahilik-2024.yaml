abstract: "Ahilik, uzun yıllar boyunca Anadolu'nun ticaret hayatını düzenleyen önemli bir kurum olarak öne çıkmıştır. Ahilik, ekonomik, sosyal, kültürel ve ahlaki etkileriyle dikkat çekerek, ticareti sadece maddi kazançlarla sınırlı tutmayıp, toplumun tamamını kapsayan bir iş etiği ve dayanışma kültürü oluşturmuştur. Günümüz küresel ticaretinde yaşanan etik problemler, Ahilik geleneğinin yeniden ele alınmasını gerektirmektedir. Mudurnu, Ahilik geleneğini yaşatma amacını güden önemli ilçelerden biridir. 2015 yılında, Mudurnu UNESCO'nun Dünya Mirası Geçici Listesi'ne“Mudurnu Tarihi Ahi Kenti: Ahiliğin Tanıkları (Bolu)”olarak dahil edilmiştir. Bu çalışmanın amacı, Mudurnu'da devam eden Ahilik Teşkilatının günümüzde ne kadar yaşatıldığını araştırmaktır. Çalışma kapsamında Mudurnu'da sanatkarlık yapan 9 esnafla görüşülmüştür. Esnaflarla mülakat tekniği kullanılarak yüz yüze görüşmeler yapılmış, ayrıca görüşmeler sırasında dükkanlarda gözlem tekniğinden de faydalanılmıştır. Çalışma grubunda 2 kadın, 7 erkek olmak üzere 9 esnaf bulunmaktadır. Çalışmada yarı yapılandırılmış mülakat tekniğinden faydalanılmış, kaydedilen görüşmeler, deşifre edilerek ATLAS.ti 8 programına aktarılmıştır. Daha sonra veriler, tema grupları oluşturularak içerik analizi yöntemiyle analiz edilmiştir. Yapılan araştırma sonucunda, Ahilik geleneğinin Mudurnu'daki ticaret ortamında hala etkili olduğu, ancak bazı değişikliklerin meydana geldiği belirlenmiştir. Geçmişe kıyasla azalmış olmasına rağmen, Ahilik anlayışının ve ritüellerinin ilçede sürdürüldüğü tespit edilmiştir. Bu ritüellerin en somut göstergesi, her hafta düzenlenen esnaf duasıdır. Esnaf duasının 8 asırdır aralıksız bir şekilde ilçede devam ettiği gözlemlenmektedir. Görüşülen esnafların hala Ahilik prensiplerine göre ticaret yaptıkları anlaşılmaktadır. Ancak, usta-çırak ilişkisinin azalması, Ahilik geleneğinin yeni nesillere aktarılmasını olumsuz yönde etkilemiştir. Bu çalışma, Mudurnu'daki Ahilik geleneğinin günümüzdeki durumunu değerlendirerek literatüre özgün bir katkı sağlamaktadır."
