abstract: "Hak Dini Kur'an Dili Tefsiri yazılması esnasındaki yararlanılan ilimlerin çeşitliliği, konuları ele alış şekli, yazarının hükümler hakkındaki görüşlerini ortaya koyuş şekli gibi özellikleri bakımından incelenmeye ve üzerinde çalışmalar yapılmaya değer bir eserdir.Hak Dini Kur'an Dili Tefsirini İslam Hukuku alanında, kadınlarla ilgili olan hükümleri Elmalılı'nın ele alış biçimiyle incelemeye tâbi tuttuk.Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde, Elmalılı'nın hayatı ve eserlerinden bahsederek, Hak Dini Kur'an Dili tefsirinin analizi yapılmıştır. İkinci bölümde, kadınlarla ilgili olan ibadet hükümleri ve üçüncü bölümde de kadınlarla ilgili olan muamelat hükümleri açıklanmıştır.Elmalılı Muhammed Hamdi Yazır, kadınlarla ilgili olan hükümlerin açıklamalarını, ayette geçen konu ile ilgili olan kelimelerin tanımlamalarını yaparak, hükmün gelmesine sebep olan bir olay varsa o olay hakkında bilgi vererek, mezhepler arasındaki varsa ihtilaflardan da bahsederek, görüşlerini Hanefi fıkhından yana kullanarak yapmıştır."
