abstract: "Şehirleşmenin beraberinde getirdiği sonuçlardan biri de kat mülkiyetinin yaygınlaşmasıdır. Tamamlanmış bir yapının kat, daire, iş bürosu, dükkân, mağaza, mahzen, depo gibi bölümlerinden ayrı ayrı ve başlı başına kullanılmaya elverişli olanları üzerinde, o gayrimenkulün maliki veya ortak malikleri tarafından, 634 sayılı Kat Mülkiyeti Kanunu hükümlerine göre, bağımsız mülkiyet hakları kurulabilir. Bu çerçevede, bağımsız mülkiyet hakkına sahip olanlar, birlikte yaşamak zorunda oldukları diğer maliklere karşı bazı borç ve yükümlülükler ile yüklenir. Nitekim özel bir mülkiyet türü olan kat mülkiyeti, bu bağlamda birlikte yaşamak zorunda olanların hukukunu da teşekkül ettirmiştir. Gerek bağımsız bölümlerin gerek ortak yerlerin kullanımı hususundaki uyuşmazlıklara sıklıkla karşılaşılmaktadır. Söz konusu uyuşmazlıkların çözümü noktasında hâkimin müdahalesi bazen kaçınılmazdır. Çalışmamızın konusunu oluşturan“hâkimin müdahalesi”, 634 sayılı Kat Mülkiyeti Kanunu m. 33'te düzenlenmiştir. İlgili hüküm gereğince, kat maliklerinden birinin yahut onun katından kira akdine, oturma hakkına veya başka bir sebebe dayanarak devamlı surette faydalanan kimsenin, borç ve yükümlerini yerine getirmemesi yüzünden zarar gören kat maliki veya kat malikleri, ana taşınmazın bulunduğu yerin sulh mahkemesine başvurarak hâkimin müdahalesini isteyebilir."
