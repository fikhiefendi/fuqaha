abstract: "Osmanlı Devleti'nin tarihi gelişimi incelenirken başvurulan arşiv belgeleri önemli kaynaklardır. Şer'iyye Sicilleri, Osmanlı Devleti'nin siyasi, askeri, hukuki, ekonomik, sosyal ve kültürel alanlarındaki verileri içeren önemli arşiv kaynakları arasında yer almaktadır. Araştırma konumuzu oluşturan ve M.1873-1875 (H.1290-1292) tarih aralığını kapsayan 203 Numaralı Besni (Behisni) kazasına ait Şer'iyye Sicili, 90 sayfa olup (boş sayfalar mevcut), 186 belgeden (birkaç belgenin numarası bulunmamaktadır) oluşmuştur. İncelenen belgeler de önemli siyasi ya da askeri olayların olmaması bölgenin güvenli bir ortam olduğunu göstermiştir. Bölge halkının ana geçim kaynakları tarım, hayvancılık ve ticaret olmuştur. Belgeler de rastladığımız diğer bir konu ise kadınların toplumdaki yeridir. Sicillerdeki belgelerde kadınlarla ilgili bilgiler mevcut olup dönemin şartlarına göre değerlendirmeler yapılmıştır. Belgeler genel olarak vasilik, veraset, terekeler, izinnameler, ilam, tahrirat belgeleri ve hüccet belgelerinden oluşmuştur. Araştırma konumuz olan 203 No'lu Şer'iyye Sicili'nin transkripsiyonu ve değerlendirilmesidir. Bu vesileyle, M.1873-1875 (H.1290-1292) yılları arasındaki Besni kazasının idari, hukuki, ekonomik, sosyal ve kültürel durumlarına ilişkin kayıtlara ulaşılmış; bu bilgiler doğrultusunda somut değerlendirmeler yapılmıştır."
