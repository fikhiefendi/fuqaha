abstract: "?İslam Hukukunda Rüşvet Suçu ve Hukuki Sonuçları? isimli çalışmamız birgiriş ve üç bölümden oluşmaktadır.Giriş bölümünde çalışmamızın amacı ve konusunu belirterek konununsunumunda takip ettiğimiz yönteme değindik ve araştırmamız esnasındayararlandığımız kaynaklar hakkında bilgiler verdik.Araştırma konumuzun ceza hukuku kapsamında yer alması sebebiyletezimizin birinci bölümünde İslam hukukunda suç ve ceza kavramlarını ele alarakhukuki mahiyetleri hakkında kısa bilgiler sunmaya çalıştık.Çalışmamızda temel teşkil eden ikinci bölümde ise, araştırma konumuz olanrüşvet kavramını ele alarak rüşvetin sözlük anlamını ve menşeini ve bir İslam hukukuterimi olarak ne şekilde tanımlandığını, tanımların analizini vermek suretiyleaçıklamaya çalıştık. Ayrıca rüşvet suçunun İslam hukuku açısından hukuki mahiyetiniele alarak fiilin suç kabul edilmesiyle korunan hukuki yarar, suçun failleri vemağdurları, suçun unsurları ve özel görünüş şekilleri hakkında açıklayıcı bilgilersunmaya çalıştık. Bunun yanında oluşum şekillerini göz önüne alarak rüşvet suçunu,yargı teşkilatında ve yargı teşkilatı dışında gerçekleşen boyutuyla ele alıp incelemeyeçalıştık. Ayrıca rüşvetle hukuki açıdan yakın özellikler taşıyan hediye kavramına vehediyeleşmenin hukuki mahiyetine değinerek hediyenin rüşvet hükmünü aldığıdurumları ve hediyeleşme sırasında tarafların hukuki durumu hakkında açıklayıcıbilgiler sunmaya çalıştık.Son bölümde ise suç irtikâbıyla oluşan hukuki sonuçlara yani suça öngörülenhukuki yaptırıma değindik ve suçun önlenmesi için alınabilecek bir takım önlemleribelirterek konumuzu tamamladık."
