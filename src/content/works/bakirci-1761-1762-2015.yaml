abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından biri Şer'iyye Sicilleri'dir. Bu belgeler, ait oldukları dönem ve yer hakkında oldukça kıymetli bilgiler ihtiva etmektedir. Bu çalışmamız, Türk tarihi ve kültürü açısından büyük bir önem taşıyan Şer'iyye Sicillerinden H.1175-1176/M.1761-1762 tarihlerini kapsayan GAZİANTEP'te tutulan şer'î mahkeme kayıtlarını içermektedir. Toplam 140 sayfadan oluşan bu Sicil defterinde 384 adet hukuki ve 29 adet de idari içerikli toplam 413 adet belge bulunmaktadır. Bu defter ışığında dönemin Gaziantep'inin idari, sosyal, kültürel, ekonomik durumu ortaya konulmaya çalışılmıştır. Transkripsiyonu yapılan belgeler tasnif ve tenkit edilerek değerlendirmeye tabi tutulmuştur. Transkripsiyonu yapılan belgelerin içerikleri, diplomatik özellikleri, hicri ve miladi tarihleri kısa belge özetleri ile birlikte her belge için ayrı bir tablo içerisinde sunularak okuyucuya kolaylık sağlanmaya çalışılmıştır"
