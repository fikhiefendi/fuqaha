abstract: "Tez çalışmamız, Osmanlı'dan Cumhuriyet'e geçiş döneminde her iki dönemin zorluklarına şahitlik eden ve ilim dünyasının önemli simalarından biri olan Şeyh Muhammed Kâzım'ın hayatı, ilmî kişiliği ve eserleri üzerine yapılmıştır. Şeyh Muhammed Kâzım, yaşadığı dönemde sahip olduğu ilmî birikim ve yetiştirdiği talebelerle dikkat çekmiş, özellikle fıkıh alanındaki çalışmalarıyla öne çıkmıştır. Tezin ana eksenini, müellifin“Cevâhirü'l-ʿulûmi'l-Kâzımiye”adlı eserinin fıkıh bölümü oluşturmaktadır. Bu bölümde yer alan fetvalar detaylı şekilde incelenmiş, fetvaların dayandığı klasik fıkıh kaynakları tespit edilmiştir. Çalışmanın ilk bölümünde Şeyh Muhammed Kâzım'ın biyografisi ele alınmış, eğitim hayatı, hocaları, ilmî çevresi ve eserleri hakkında bilgi verilmiştir. Bu bağlamda onun yaşadığı dönemin ilmî atmosferi de göz önünde bulundurularak, şahsiyetinin fıkıh ilmindeki yeri değerlendirilmeye çalışılmıştır. İkinci bölümde“Cevâhirü'l-ʿulûmi'l-Kâzımiye”adlı eserin fıkıh bölümüne ağırlık verilmiştir. Bu bölümde öncelikle müellifin fıkıh ve usul anlayışı ile fetva metodu genel hatlarıyla ortaya konmuştur. Müellifin eserinde yer alan fetvalar sistematik bir şekilde tasnif edilmekle beraber, eserdeki fıkhî görüşleri; ibâdât, mu'âmelât ve müteferrik meseleler olmak üzere üç ana başlık altında sistematik bir şekilde incelenmiştir. Her bir fetvanın hangi fıkıh meselesine dair olduğu ve dayandığı kaynaklar belirlenmiştir. Kaynaklar arasında Hanefî mezhebine ait bazı klasik fıkıh metinleri de yer almaktadır. Bu tez, Şeyh Muhammed Kâzım gibi önemli bir âlimin ilmî mirasını ve fıkhî görüşlerini gün yüzüne çıkarmayı hedeflemektedir."
