abstract: "İnsanların yaratılış gayesi Allah Teâlâ'ya ibadet etmektir. İbadet ise Yüce Allah'ın azameti karşısında derin bir saygıyla boyun eğmektir. Dinimizin emrettiği her bir ibadetin kendine göre rükünleri, şartları ve sünnetleri vardır. Nasslarla belirlenen kriterlere göre eda edilmeyen bir ibadet sahih kabul edilemez. Tüm ibadetlerde gerekli olan en önemli kriter hiç şüphesiz niyet olarak kabul edilir. Zira niyet ibadetlerin aslı ve ruhu olarak addedilir. Çünkü halis bir niyet olmayınca yapılan ameller ve ibadetlerin tamamı manevi açıdan değersiz kalır. Niyete bu kadar önem atfedilmesi üzerine biz de bu çalışmamızda \"İslam İbadet Fıkhında Niyet ve Hükümlere Etkisi\" başlığı altında konuyu araştırdık. Yaptığımız çalışmanın birinci bölümünde niyetin anlam alanı üzerinde durarak ve niyetin tüm bileşenlerini (kasıt, ihlâs, irade, ihtiyar, azim) bu başlık altında ele aldık. Özellikle bu kavramların semantik tahlilini yaparak ve niyetle olan ilişkilerini ortaya koyduk. Ayrıca nasslar açısından niyet, niyetin kısımları, niyeti iptal eden durumlar, niyetin yeri ve niyet-amel ilişkisine de değindik. Bu başlık altında nasslar tarafından niyete büyük bir ehemmiyet verildiğini, niyetsiz hiçbir ibadetin geçerli olmadığını ortaya koyduk. Gerekli şartları taşımayan bir niyetin geçersiz olduğunu ve niyetin yerinin kalp olduğunu bu bölümde ele aldık. İkinci bölümde ise, ibadetlerde (namaz, oruç, hac, zekât, kurban, yeminler, kefaretler, cihat) niyetin hükmü, vakti, şekli ve niyette teşrik gibi konuları inceledik. Niyetin varlığını bazı fakihler şart bazıları ise rükün olarak kabul etmiş, niyetin vakti, şekli ve niyette teşrik gibi konularda ise ihtilafa düşmüşlerdir. Biz de bu konularda mevcut olan ihtilafları ve fakihleri bu ihtilaflara sevk eden sebepleri değerlendirerek çıkarsamalarda bulunduk. Anahtar Kelimeler : Niyet, amel, ihlâs, ibadet fıkhı, hüküm. Sayfa sayısı : 273 Tez Danışmanı : Doç. Dr. Mehmet Selim ASLAN"
