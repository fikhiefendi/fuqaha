abstract: "Kırâat ihtilafları usûl ve ferş olmak üzere iki açıdan değerlendirilmektedir.“Usûl farklılıkları”, kırâat imamının bir yöntem dâhilinde, kendine mahsus bir okuyuş tarzı ile telaffuzda belli bir usûl takip ederek gerçekleştirdiği okuyuşlardır. Manada önemli bir değişikliğe sebep olmayan bu ihtilaflar, mahallî şive ve ağızların ses özellikleriyle ilgilidir.“Ferşî okumalar”ise usûl ihtilaflarının aksine, kıyas kabul etmeyen kırâat farklılıklarıdır. Bunlar manayı bazen farklı hükme sebep olacak derece etkilemektedir. Gayet geniş olan kırâat birikimi içinde hukuka etki eden kırâat vecihleri sayısal olarak az bir yekûn tutmaktadır. Mütevâtir, sahih kırâatler ve bazı mezheplere göre şâz kırâatler fıkhî bir konunun başka bir hükme bağlanmasına doğrudan etki edebildiği gibi diğer hüküm kaynaklarından elde edilen delilleri tekit ya da teyit etmede kaynak olarak kullanılmaktadır. Özellikle Hanefîler ve Hanbelîler kırâatleri hüküm kaynağı olarak kullanmakta öne çıkmaktadır. Müfessirler, kırâat birikimini manaya tesiri bakımından kullandıkları gibi özellikle ahkâma ağırlık verdikleri çalışmalarında hükme tesiri de konu etmişlerdir. Kur'ân-ı Kerîm'in tefsirinde rivâyet ve dirayeti bir arada kullanan müfessirlerden biri olan Kurtubî, tefsirinde ahkâma fazlaca yer vermiştir. Onun tefsiri kırâat, fıkıh ve usûlü fıkıh gibi açılardan ele alınmış, bu hususlarda eser birtakım araştırmacılar tarafından irdelenmiştir. Lakin çalışmamızda daha spesifik olarak Kurtubî'nin tefsirinde, kırâatin hükme tesirine dair açıklamalarını, eleştirilerini ve tercihlerini ortaya koymak için kırâatin hükme tesirinin bulunduğu âyetler seçildi. Tezimizde Kurtubî'nin, el-Câmi' li Ahkâmi'l-Kur'ân adlı tefsirinde sahih kırâatler ile şâz okuyuşların ahkâm âyetlerinin yorumuna etkisi ele alınacaktır. Bu kapsamda çalışmada önce kırâat ilmi konularına değinilmiş, hükme tesir eden kırâat farklılıkları bulunan âyetler tespit edilmiş ve bu ihtilafların fıkhî hükümlere yansıması incelenmiştir."
