abstract: "Bu tez, ?İrşâdü'l-akli's-selîm ilâ mezâya'l-Kitâbi'l-Kerîm? adlı eseriyle Ebussuûd Efendi'yi tanıtmayı, tefsirindeki tutumunu ve ahkâm ayetlerine yaklaşım tarzını tespit etmeyi amaçlamaktadır.Tezimizin yazım aşamasında Ebussuûd Efendi'nin söz konusu tefsirinin Arapça aslından ve Ali Akın'ın Türkçe tercümesinden karşılaştırmalı olarak istifade ettik.Tezimiz, üç bölümden oluşmaktadır. Birinci bölümde, Ebussuûd Efendi'nin hayatını, şahsiyetini ve eserlerini tanıtmayı amaçladık. İkinci bölümde, Ebussuûd Efendi'nin tefsirinin yazılışı ve genel özellikleri üzerinde durarak, tefsirini, dirayet ve rivayet yönünden incelenmeye çalışılıp ayrıca tefsirinin kaynaklarına değindik.Tezimizin ana gövdesini oluşturan üçüncü bölümde, Ebussuûd Efendi'nin ahkâm ayetlerine getirdiği yorumları daha iyi gözlemleyebilmek için konu başlıklarına ayırıp bu bağlamda ibadetlere, aile hukukuna, ceza hukukuna, ticaret hukukuna ve çeşitli meselelere getirmiş olduğu yorumlara değinmeye çalıştık."
