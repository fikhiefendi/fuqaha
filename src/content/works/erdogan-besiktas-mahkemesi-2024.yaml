abstract: "Osmanlı arşivinin önemli bir bölümünü oluşturan şer'iyye sicilleri, en başta genel tarih olmak üzere tarih disiplinin çeşitli alanları için vazgeçilmez bir kaynaktır. Oldukça zengin bir muhtevaya sahip olan şer'iyye sicilleri, Osmanlı devletinin siyasi, içtimai, hukuki, iktisadi ve askeri yapısına dair birincil elden kaynak olmaları sebebiyle büyük bir ehemmiyeti haizdir. Özellikle tarih ilminin salt siyasi anlatıdan sıyrılarak toplumların içtimai yaşantısına yönelmesi, sicillere olan rağbetin artmasını sağlamıştır. Bu minvalde sayısız çalışma ortaya konulmuştur. Bununla birlikte mazi ile hâl arasında adeta köprü vazifesi gören bu kıymetli tarihi mirasın bugün hala araştırılmaya ihtiyacı vardır. Nitekim elimizde mevcut bulunan sicillerin tamamı incelenmiş değildir. Bu açıdan yapılacak yeni çalışmaların, alanı zenginleştirmekle birlikte, tarih disiplinine çok yönlü katkıda bulunacağı muhakkaktır. Çalışma Beşiktaş mahkemesine ait hicri 1314-1315 yıllarını kapsayan 196 numaralı sicilin transkripsiyon ve değerlendirmesinden oluşmaktadır. Üç bölümden oluşan çalışmanın, birinci bölümünde Osmanlı hukuk sistemi ve bu sistemin bir parçası olan şer'iyye sicilleri genel hatlarıyla tanıtılmaya çalışılmış, ikinci bölüm, metin transkripsiyonuna ayrılırken, üçüncü bölümde defterde yer alan hükümler çeşitli yönleriyle tahlil edilmiştir. Çalışmamız XIX. yüzyılın sonunda Beşiktaş'ın sosyal ve ekonomik yönlerini tespit etmeyi hedeflemenin yanında, I. Meşrutiyet sonrası II. Abdülhamid döneminde genel itibariyle Osmanlı toplumu hakkında fikir sahibi olma amacına da matuftur. Yapılan araştırmalar neticesinde Beşiktaş'a dair semt tarihi bazındaki çalışmaların oldukça yetersiz kaldığı görülmüştür. Bu açıdan çalışmanın Beşiktaş semt tarihi araştırmaları için de mütevazi bir katkı olması temenni edilmektedir."
