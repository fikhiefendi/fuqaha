abstract: "Yirminci yüzyılın ortasından itibaren İslami finansal ürünler hızlı bir şekilde yaygınlık göstermeye başlamıştır. Geleneksel finansal ürünlere alternatif olarak ve İslam hukukçularının tasvip ettiği bu ürünler müslüman coğrafyada cazip bir hâl almıştır. Katılım bankacılığının hızla yayılmasının ardından, alternatif bir islami sigortacılık sisteminin de oluşması elzem olarak görülmüş ve geleneksel sigortacılık sistemine alternatif olarak katılım sigortacılığı (tekafül) sistemi kurulmuştur. 1979'da Sudan, 1984 yılında Malezya'da katılım sigorta şirketlerinin kurulmasının ardından, Suudi Arabistan ve Ortadoğu ülkelerinde sistemin yaygınlaşmasıyla birlikte islam coğrafyasında bir katılım sigortacılığı pazarı oluşmuştur. Hâlihazırda küresel çapta 33 ülkede 200'ün üzerinde katılım sigorta şirketi bulunmaktadır ve 2020 yılı itibariyle bu şirketlerin pazar payı 40 milyar dolar seviyesindedir. Ülkemizde ise 2009 yılında ilk katılım sigorta şirketi faaliyete başlamıştır. Günümüz itibariyle 12 şirket aktif olarak faaliyetini yürütmektedir. 2019 yılı sonu itibariyle pazar payı 3,5 milyar TL'ye ulaşarak, sigortacılık sektörünün toplam pazar payının % 5'ine tekabül etmektedir. Katılım sigortacılığının giderek artan önemi ve bu alanda yeterli akademik çalışmanın olmaması bu çalışmanın yapılmasının ana nedenlerinden biridir. Çalışmada, bireylerin katılım sigortacılığını tercih sebeplerinin araştırılması amaçlanmıştır. Bu bağlamda ilk olarak katılım sigortacılığı açıklanarak konunun kavramsal çerçevesi ortaya konulmuştur. Katılım sigortacılığına olan ihtiyaç ve katılım sigortacılığının temel çalışma ilkeleri, katılım sigortacılığının tarihi, modelleri, geleneksel sigortacılık ile katılım sigortacılığı arasındaki farklar hakkında bilgi verilerek, ülkemizde ve dünyada katılım sigortacılığının genel durumu hakkında bilgi verilmiştir. Çalışmanın ikinci bölümünde bireylerin katılım sigortacılığını tercih etme nedenleri belirlenmeye çalışılmıştır. Bu kapsamda çalışmada kullanılan analiz tekniği olan, çok kriterli karar verme yöntemlerinden AHP tekniği hakkında genel bilgi verilmiş; AHP tekniğinin çalışma şekli, avantajları ve çalışmada AHP tekniğinin kullanılma nedeni üzerinde durulmuştur. Çalışmanın amacı doğrultusunda rastgele seçilmiş olan mevcut ve potansiyel katılım sigortacılığı müşterileri, AHP tekniğinden faydalanılarak çalışmaya dâhil edilmiş ve neden katılım sigortacılığını tercih ettikleri araştırılmıştır. Araştırmadan elde edilen veriler AHP tekniğiyle analiz edilmiştir. Araştırmanın sonucunda elde edilen verilerin ışığında mevcut ve potansiyel katılım sigortacılığı müşterilerinin büyük bir çoğunluğunun (% 63,2) islami hassasiyetler sebebiyle katılım sigortacılığını tercih ettikleri sonucuna varılmıştır. Poliçenin fiyatı, satış kanalına olan yakınlık ve şirketin güvenilirliği hususlarının ise birbirine yakın sonuçlar göstererek katılım sigortacılığı müşterileri üzerinde, poliçe satın alma sebepleri arasında ikincil planda kaldığı görülmüştür."
