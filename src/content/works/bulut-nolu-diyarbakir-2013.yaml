abstract: "Şer'iye sicilleri, Osmanlı Devletinin hukuki kayıtlarını ihtiva eden birinci elden kaynaklardır. Osmanlı tarihinin kültürel hayatına dair çok çeşitli bilgiler içermektedirler.bu çalışmada; Diyarbekir Eyaletinde bulunan Amid kazasına(Diyarbakır)ait ve XIX. yüzyılın başlarında (1217-1218/1803-1804)Amid mahkemesinde görülen davaları konunun edinen meselelerin kaydedildiği ve günümüzde Milli Kütüphane de 356 numara ile kayıtlı bulunan Diyarbakır Şer'iye sicilinin transkripsonunu ve değerlendirmesi yapılmıştır. bu çalışma giriş ve üç bölümden oluşmaktadır. giriş bölümünde şer'i mahkemeler ve şer'iye sicillerinin ne olduğu ile sicillerde bulunan belge türleri hakkında bilgiler verilmiştir. birinci bölümde , Osmanlı öncesi ve sonrası Diyarbakır tarihi hakkında kısa bir bilgi verilmiştir. ikinci bölümde 356 no lu şer'iye sicilinin transkipsiyonu yapılmış ve özeti hazırlanıştır. üçüncü bölümde ise söz konusu defterde geçen bilgiler tahlil edilerek burada geçen hususların değerlendirilmesi yapılmıştır."
