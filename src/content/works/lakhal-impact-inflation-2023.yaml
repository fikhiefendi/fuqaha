abstract: "Bankacılık sektörü, finansal piyasaların yetersiz olduğu ve hatta bazen hiç bulunmadığı gelişmekte olan ülkelerin finansal sistemlerinde hayati bir rol oynamaktadır. Mevduat bankaları grubunun Türk bankacılık sektöründe baskın bir rol oynadığını söylemek mümkündür. Türkiye Bankalar Birliği'nin istatistiklerine göre, mevduat bankalarının toplam aktifleri Eylül 2022 itibariyle yaklaşık 645 409 Milyon $'a ulaşmıştır. Bankacılık sektöründe bankalar, yüksek rekabet ortamında müşterilerine en iyi hizmeti sunmaya çalışırken aynı zamanda maliyetleri düşürmeye ve kârlarını artırmaya çalışmaktadır. Bankalar da kar elde etmeyi amaçlayan diğer ticari işletmeler gibidir. Bu bağlamda, bankaların kârlılık performansı, banka yönetiminin başarısını göstermektedir. Türk bankacılık sektöründe faaliyet gösteren bankalar, daha yüksek bir kârlılık seviyesine ulaşmak istiyorlarsa, finansal ve fiziksel sermayelerini kullanmalıdırlar. Sağlam ve verimli çalışan bir bankacılık sistemi olmadan ekonomi sorunsuz ve verimli çalışamaz. Etkin olmayan bankalar daha risklidir ve başarısız olma olasılıkları daha yüksektir. Teorik kavramsallaştırmaları ve operasyonel farklılıkları nedeniyle İslami (katılım) bankaları ve konvansiyonel (mevduat) bankalar finansal olarak farklı performans gösterebilirler. Günümüzde faizsiz bankacılık sistemi sadece İslam ülkelerinde değil, özellikle İngiltere ve ABD gibi finans sektörlerinin son derece gelişmiş olduğu ülkelerde de gözle görülür bir şekilde gelişmiştir. Dünyanın önemli bankaları, Ortadoğu'daki atıl petrodolarları kendi stoklarına faizsiz bankacılık bölümleri açarak dahil etmektedir. Bu araştırma, Türkiye'deki katılım bankaları ve mevduat bankalarının kârlılığı üzerinde enflasyonun etkisini bir yabancı katılım bankası (Kuveyt Türk Katılım Bankası), bir kamu mevduat bankası (Ziraat Bankası) ve bir özel mevduat bankası (AK Bank) örnekleminde analiz etmeyi ve karşılaştırmayı amaçlamaktadır. Dolayısıyla bu çalışma, enflasyon gibi makroekonomik bir faktörün 2018'den 2022'ye kadar olan dönemde (beş yıl) Türkiye'deki iki banka türünün karlılığını nasıl etkilediğini incelemeyi amaçlamaktadır. Çalışmada bankaların karlılık ölçütleri olarak Aktif Karlılığı (ROA) ve Özkaynak Karlılığı (ROE) kullanılmıştır. Çalışmanın sonuçları, iki oran ile enflasyon arasında özellikle 2022 yılında anlamlı ve pozitif bir ilişki olduğunu göstermektedir. 2021 yılında Ziraat Bankası'nın sadece ROA ve ROE'si enflasyonla negatif ve anlamlı bir ilişki içindedir. Pandemi yılında (2020) üç bankanın ROA'sı enflasyonla negatif ve anlamlı bir ilişki içindedir."
