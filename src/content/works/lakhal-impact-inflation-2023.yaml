title: "The İmpact of İnflation on Profitability of Banks in the Turkish Banking System. A Comparative Study on 3 Different Bank Types; Ziraat Bankası (Deposit Public Bank), Akbank (Deposit Private Bank) and Kuveyt Türk Katılım Bankası (Participation Bank)"
