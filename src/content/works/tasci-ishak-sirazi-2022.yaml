abstract: "Ebû İshâk eş-Şîrâzî, (ö. 476/1083) İslâm fıkıh geleneğinde adı geçen önemli şahsiyetlerden biridir. Gerek yaptığı çalışmalar gerek İslâm fıkıh geleneğine sağladığı katkılardan dolayı önemli bir İslâm alimi olarak kabul edilmektedir. Şafiî mezhebinin önde gelen isimlerinden biri olan Şîrâzî, yaşadığı dönemde daha çok öğretim ve te'lif hizmetleri ile uğraşmıştır. Kendi döneminde yaptığı içtihatlarda önemli kararların alınmasını sağlamış, ve yaşadığı dönemde fıkhi bakımdan birçok zor meselenin çözülmesine katkı sunmuştur. Şîrâzî, ilmi kişiliğiyle yaşadığı dönemde adından söz ettirmeyi başarmış ve İslâm fıkıh geleneği bağlamında hem İslam hukuku hem de İslâm Fıkıh Usûlü alanında önemli eserler vermiştir. Şîrâzî'nin ortaya çıkardığı eserler birçok çalışmaya konu olmakla birlikte, İslâm hukuku ve İslâm fıkıh usulü ile ilgili eserleri, klasik dönem İslâm fıkıh geleneği için önemli bir müracaat kaynağı olarak kabul edilmektedir. Bu çalışma kapsamında, Şîrâzî'nin hayatını ele alarak eserleri hakkında çalışma yürüttük. Kendi devrinde hangi İslâm düşünürleri ile fikri ve ilmi bir iletişimde bulunduğunun araştırmasını yaptık. Araştırmamızda Şîrâzî'nin nesih anlayışını ele almaya çalışarak Şîrâzî'nin nesih kavramına yüklediği anlamı, nesh'in sınırını, bu konuda kedisine yapılan itirazları, onun bu itirazlara verdiği cevapları, bizatihi kendisinin yazdığı Fıkıh Usûlü eserlerinden faydalanarak irdeledik. Şîrâzî'nin nesih konusundaki görüşlerini ortaya koymak için öncelikli olarak kendisinin yazmış olduğu eserlerini esas alarak konuyu inceledik. Ayrıca bu konuyla ilgili yazılmış diğer eserleri de inceleyerek metin analizi yöntemiyle konuyu detaylandırdık. Bu sebeple önceki ve sonraki alimlerin nesih anlayışı ile Şîrâzî'nin bu konudaki görüşlerini İslam fıkıh geleneği metodolojisi çerçevesinde esas alarak ortaya koymaya çalıştık."
