abstract: "Sözleşme serbestisi ilkesi en genel anlamda tarafların, sözleşmenin konu ve içeriğini serbestçe belirleyebilmesidir. Fakat her ne kadar böyle bir serbestinin varlığı tartışmasız olsa da, gerek Türk hukuku gerekse Irak hukukunda tarafların sözleşme konusunu belirleme durumuna bazı kısıtlamalar getirmiştir. Bu doğrultuda çalışmanın temel amacı, Türk ve Irak hukukunda sözleşme serbestisi ilkesi ve sınırlarını karşılaştırılmalı olarak belirlemektir. Türk ve Irak hukuk sistemleri, aynı temelden, yani Roma hukuku kaynaklıdır. Türk Medeni Kanunu İsviçre'den, Irak Medeni Kanunu ise Mısır'dan alınmıştır. Ayrıca Irak kanun koyucusu kanunun yapım aşamasında İslam hukuku ve Batı doktrini arasında bağdaştırıcı bir orta yol izlemiştir. Türk Medeni Kanunu ve Irak Medeni Kanunu içerisinde Mecelle'den alınmış birçok ortak hüküm mavcuttur. Irak hukuk sisteminde Medeni Kanun'dan bağımsız ayrı bir Borçlar Kanunu bulunmamaktadır. Sözleşmeleri düzenleyen hükümler açısından ise, Irak ve Türk kanunları birçok noktada ortak düzenlemeler taşımaktadır."
