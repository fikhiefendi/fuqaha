abstract: "Sovyet Sosyalist Cumhuriyetler Birliğinden ayrılarak 1991 yılında bağımsızlık aldığı günden bu yana Kazakistanlılar bin yılı aşkın süreyle mensubu oldukları İslam'a yeniden bir dönüş, yöneliş ve arayış içindedirler. Sovyetler Birliği dönemi sonrasında kendini gösteren bu arayışlar bazı hatalı fikirleri de beraberinde getirmiştir. Onun için ailedeki anlaşmazlıklar ve boşanmaların çoğalması, çok evliliğe müsaade etmeyen mevcut yasalar toplum için bazı sorunları beraberinde getirmiştir. Ayrıca gerekli olan metodoloji ve usûl çerçevesinde bir arayış ve anlam çalışması yapılamadığı için dinin bazı hükümlerini yanlış anlayanlar veya kendi arzu ve mevcut düşünce yapısına göre yorumlayan kişiler ortaya çıkmıştır. Bunun neticesinde medeni kanun bizim için uygun değil diyerek sadece imam nikâhı ile evlenen ve boşanan vatandaşların yanısıra \"talak\" sonucu sokağa bırakılan kadınların sayısı artmaktadır. Sadece resmi nikâh ile evliliğe devam etmenin eksik veya yanlış olduğunu zannederek tekrar imam nikâhı kıyanlar da çoğalmaktadır. Bu ve benzeri sebeplerden ötürü İslâm hukukundaki evlenme ve boşanma hükümlerinin medeni kanunla ilişkisi bağlamında ele alınmasına ihtiyaç duyulmaktadır. Bir başka ifadeyle bu durum İslâm hukukunda yer alan aile, evlilik, boşanma, çocukların bakımı ve velayeti gibi meselelerin hükümlerini Kazak Medeni Kanunu'ndaki hükümler ile birlikte değerlendirip mukayeseli olarak çalışmaya bizi sevketmiştir. Şüphesiz aile konusunun boyutları hem geniş hem çoktur. Biz bu çalışmamızda İslâm'dan önce Kazak toplumundaki aile hukuku uygulamalarına ve bu hususlarda İslâm'ın Kazak toplumundaki örf ve uygulamaları verdik. Ayrıca Kazak topraklarında yetişen İslâm âlimlerinin eserlerinde aile hakkındaki söyledikleri sözler, evlenme, aile içi sorumluluklar, boşanma ve sonrasındaki bazı hukuki işlemler üzerinde durulmuştur."
