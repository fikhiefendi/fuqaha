abstract: "Mecelle 60. madde yani“Kelamın imali ihmalinden evladır, bu mümkün olmazsa kelam ihmal edilir”kaidesi pek çok şeyin temelini teşkil eder. Çünkü insanlar birbiri ile olan ilişkilerinde çeşitli vasıtaları kullanmakla beraber çoğunlukla sözlü olarak iletişim kurmaktadırlar. Kişilerin ağzından çıkan sözlerin muhakkak bir mana ve maksadı vardır. Hal böyle iken söylenen ifadeleri manasız ve boş konuşma olarak telakki etmek dinen ve aklen imkânsızdır."
