abstract: "Tezin amacı, Ürdün bankacılık sisteminde geleneksel ve İslami bankalar arasında iki yönlü bir karşılaştırma yapmaktır: verimlilik ve risk. Bu tezin önemi, İslami bankalar ile konvansiyonel bankaların verimlilikleri ve riskleri hakkında karşılaştırılmasına ilişkin ampirik çalışmaların olmamasından ve bankacılık sistemlerini geliştirmek için İslami ve geleneksel bankacılık üzerine literatürün oluşturulmasına katılmasından kaynaklanmaktadır. Tez örnekleri, 2007/2008 küresel mali krizi dönemini kapsayan 2006-2020 dönemine ait dengesizlikler panel verilerini içermektedir. Sonuçlar, Ürdün bankacılık sistemindeki karlılık performansı, etkinlik ve riskin, Ürdün bankacılık sistemindeki geleneksel bankaların performansının İslami bankalardan daha karlı olduğunu ve geleneksel bankaların Ürdün bankacılık sistemindeki İslami bankalardan daha riskli olduğunu göstermektedir. Son olarak, küresel finansal kriz (2007-2009) sırasında, konvansiyonel ve İslami bankalarda karlılık önemli ölçüde azalırken Riskler önemli ölçüde artmıştır. İslami ve konvansiyonel bankaların risk yönetimi araçlarını geliştirmeye yönlendirilmesi, İslami bankaların kârlılıklarını artırmak için kullanılmamış kâr fırsatlarından yararlanmaları gerektiği, gelecekte İslami bankaların sayısını artırmak için sayısının artırılması gerektiğini belirtmekte fayda var. Konvansiyonel bankalarla rekabet halindeyken, konvansiyonel bankaların karlılığı artırmak için kapitalizasyonlarını artırmaları gerekirken, küçük bankalar büyük bankaların avantajından yararlanmak için birleşme olasılıklarını değerlendirmelidir."
