abstract: "Bu çalışma, Libya devletinde bütçe açığının İslami finansman araçlarıyla nasıl finanse edilebileceğini ele almaktadır. Araştırma, bütçe açığını İslami hükümlerle uyumlu araç ve mekanizmalar yoluyla finanse etmeyi amaçlayan meşru finansman alternatiflerine odaklanmaktadır. Bu araçlar, şeriat otoriteleri tarafından onaylanmakta ve yerel mevzuatla düzenlenmektedir. Ayrıca çalışma, Libya'daki kamu finansmanı politikalarını, bütçe finansmanını düzenleyen yasaları, İslami fıkıhta yer alan finansman yöntemlerini ve Libya mevzuatında yer alan düzenlemeleri irdelemektedir. Çalışma, bütçe açığının İslami finansman araçlarıyla kapatılması konusunda uluslararası deneyimleri incelemekte ve bu deneyimlerden Libya bağlamında yararlanma olanaklarını ortaya koymaktadır. Libya'daki bütçe açığını finanse etmek için şeriatla uyumlu finansman yöntemlerine dayalı önerilen bir model sunulmaktadır. Çalışmanın sonuçları, mevcut geleneksel faizli finansman yöntemlerinin kamu borç yükünü artırdığını, oysa İslami finansman yöntemlerinin daha sürdürülebilir çözümler sunarak finansal riskleri azaltabileceğini ve ekonomik istikrarı destekleyebileceğini göstermektedir. Çalışma, Libya'daki finansal ve ekonomik gerçekliği tanımlamak ve İslami finansman araçlarının uygulanabilirliğini ve etkilerini analiz etmek için betimleyici ve analitik yöntemleri kullanmaktadır. Çalışma, Libya'da İslami Sukuk Kanunu'nun hızlıca yürürlüğe konulması ve bu finansman modelinin başarısını garanti altına alacak yasal ve kurumsal altyapının sağlanması gerektiğini önermektedir."
