abstract: "İlmihal kavramı bütün Müslümanların bilmekle yükümlü oldukları zarurî dinî bilgileri ifade etmektedir. Bu ihtiyacı karşılamak için birçok alim tarafından eserler kaleme alınmıştır. Söz konusu alanda yazılan Türkçe eserler“ilmihal”olarak isimlendirilir. Bu eserlerden biri de 17. Yüzyılda Ebu'l-Bekâ el-Kefevî tarafından yazılan Tuhfetü'ş-Şâhân adlı ilmihaldir. Bu çalışmada Tuhfetü'ş-Şâhân'ın Hanefî ilmihal geleneğindeki yeri, kendisinden önce telif edilen başlıca ilmihaller dikkate alınarak tespit edilmeye çalışılmış, ilk olarak müellifin hayatı, eserleri ve ilmî kişiliği ele alınmış, ardından ilmihal kavramı ve ilmihal geleneği incelenmiş, son olarak da Tuhfetü'ş-Şâhân'ın muhtevası analiz edilerek ilmihal geleneği içindeki yeri ortaya konmaya çalışılmıştır."
