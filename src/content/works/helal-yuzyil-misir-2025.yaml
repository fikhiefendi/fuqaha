abstract: "20. yüzyılda kanunlaştırma hareketlerinin gerçekleştiği önemli yerlerin başında Mısır gelmektedir. Mısır'ın köklü bir hukukî yapıya sahip olan Osmanlı Devleti'nden ayrılması ve Fransız ile İngiliz hakimiyetine girmesiyle birlikte hukuk sisteminde de birçok hususta değişim söz konusu olmuştur. Bu tezde de 20. yüzyılda değişime maruz kalan Mısır hukuk sistemi ve Mısır'daki kanunlaştırma hareketleri ele alınmıştır. Çalışmada, 19. yüzyılın başlarından 20. yüzyılın ortalarına kadar uzanan süreçte Kavalalı Mehmed Ali Paşa ve ailesinin hukuk alanındaki faaliyetleri incelenmiştir. Araştırmada, bu dönemde Mısır'daki yargı sisteminin yapısı ele alınmış, söz konusu dönemde hazırlanan temel yasalar şekil ve içerik açısından değerlendirilmiş ve bu yasaların kaynaklarının İslam hukuku ile ilişkisi ortaya konulmuştur. Ayrıca, Mısır'ın hukuk sistemine geniş anlamda etki eden unsurlar incelenerek Fransız ve İngiliz sömürge yönetimlerinin yasama, yargı, hukuk eğitimi ve hukuk uygulama kurumları üzerindeki etkileri analiz edilmiştir. Çalışmada, Mısır'daki kanunlaştırma sürecine etki eden kurumlar, İslam hukukunun kanunlaştırılması yönünde yürütülen çabalar ve 20. yüzyıldaki kanunlaştırma hareketlerinde rol oynayan önemli isimler değerlendirilmiştir. Tez, İslam hukukunun Mısır'da uygulanmasına yönelik girişimlerin başarısız olmasının ardındaki temel sorunları da ele alarak bu sürecin karşılaştığı engelleri ve nedenlerini kapsamlı bir şekilde analiz etmiştir."
