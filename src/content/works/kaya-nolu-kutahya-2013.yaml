abstract: "Şer`iyye sicilleri; mahkeme kayıtlarını ihtivâ eden Osmanlı Tarihi açısından günümüze kadar ulaşmış elimizde bulunan önemli kaynaklardır. Bunlar dönemin dilini, yaşam tarzını, örf ve âdetlerini, yargı sistemini, hukuk anlayışını, kadıların içtihadlarını, ekonomik, sosyal ve siyasî yaşamı irdelemek ve sorgulamak açısından elimizde bulunan çok önemli birinci el tarihi kaynak niteligindedir. Şer?iyye sicillerinin önemli olan diğer bir özelliği de yerel nitelik taşımalarıdır. Nitekim herhangi bir bölgeye ait siyasi, sosyal, kültürel ve ekonomik araştırma yapanlar için ilk başvurulacak kayıtlar arasında Şer`iyye Sicilleri yer almaktadır.Osmanlı Devlet teşkilatı içinde önemli bir yer tutan kadı ve mahkemeler tarafından tutulan bu siciller XV. asrın yarısından baslayarak, XX. asrın ilk çeyregine kadar uzun bir zaman dilimi içinde en azından 472 yıllık Osmanlı Devleti?nin tarihini, iktisadî, siyasî, sosyal ve hukukî hayatını yakından ilgilendirmekte ve kısaca Türk kültür ve tarihinin temel kaynaklarının basında gelmektedir."
