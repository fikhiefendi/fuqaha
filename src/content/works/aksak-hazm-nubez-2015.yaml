abstract: "Bu çalışma, Zahiri Mezhebi'nin önemli bir temsilcisi olan İbn Hazm (ö. 456/1064) tarafından yazılmış, fıkıh usulü konularını ihtiva eden en-Nübez adlı eserin tahlilidir. Asıl adı Alî b. Ahmed b. Saîd b. Hazm el-Endelüsî olan İbn Hazm, fıkıh usulü konularını içeren el-İhkam adlı hacimli eserinden sonra usul konularının daha kolay anlaşılması için en-Nübez adlı eserini yazmıştır. Bu eserdeki tahlil çalışmamızı, Serahsî'nin el-Usul adlı eseri ve Gazalî'nin el-Mustasfa adlı eseri ile karşılaştırmalı olarak ele aldık. Çalışmamız giriş, üç ana bölüm ve sonuç olmak üzere beş bölümden oluşmaktadır. Girişte konunun kapsamı önemi ve işleniş yöntemi; birinci bölümde İbn Hazm'ın kısa biyografisi ile eserlerini ele alarak çalışmamızın omurgasını oluşturan en-Nübez'in tanıtımına daha fazla yer ayırdık. en-Nübez'in alt başlıkları olan İcmâ', Sünnet, Nesih, Akli Delilleri ve İçtihat-Taklid meselelerini ikinci bölümde; yazarın ayrıntıya girmeden incelediği farklı meselelerini ise üçüncü bölümde irdeledik. İkinci bölümdeki konular ile ilgili İbn Hazm'ın görüşlerini Serahsî ve Gazalî ile karşılaştırdık. Üçüncü bölümde ise çalışmamızın kapsamını ve amacını aşacağı için böyle bir karşılaştırma yapmadık. Sonuç bölümünde ise incelediğimiz konunun genel değerlendirmesini ve İbn Hazm'ın fıkıh usulü görüşleri ile ilgili ulaştığımız neticelere değindik. Zahirî anlayışa sahip olan İbn Hazm'ın görüşleri ile karşılaştırdığımız diğer iki usulcü olan Gazalî ve Serahsî arasındaki benzerlikleri ve farklılıkları değerlendirdik."
