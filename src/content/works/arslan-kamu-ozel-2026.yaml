abstract: "Tez, İslâm hukukunda kamu hukuku-özel hukuk ayrımını Allah-kul hakları ve çeşitli kurumlar bağlamında konu edinmekte olup birey-toplum ve otorite ilişkilerini dikkate alarak iki farklı hukuk sistemi arasındaki benzerlik ve farklılıkları ortaya koymaktadır. Giriş, üç bölüm ve sonuçtan oluşan tezin giriş kısmında konuya alt yapı sağlayacağı düşüncesiyle genel bir çerçeve sunulmuştur. Birinci bölümde kamu ve birey kavramlarının tarihi ve teorik temelleri ele alınarak hem felsefî hem de hukukî anlamlarındaki dönüşüm incelenmiştir. İkinci bölümde kamu hukuku ve özel hukukun İslâm hukukunda karşılıkları bağlamında Allah-kul hakkı kavramlarına odaklanılmış öncelikle dört mezhep özelinde kavram takibi yapılmış devamında Allah hakkı ve kul hakkıyla kastedilmek istenen anlam detaylı açıklanmış ve çeşitlerine değinilmiştir. Ardından iki hukuk sistemini sağlıklı bir şekilde karşılaştırmak adına kamu yararı-maslahat, kamu politikası-siyâset-i şer'iyye, velayet gibi pek çok kavram ve kuruma yer verilmiştir. Bunun yanı sıra İslâm siyâset düşüncesindeki tehzîbü'l-ahlâk, tedbîrü'l-menzil ve tedbîrü'l-müdün şeklinde ortaya konulan tasnifle Batı düşüncesindeki ahlâk, aile ve devlet anlayışına dair görüşler haklar özelinde ele alınmıştır. Üçüncü bölümde teorinin pratiğe yansımalarına odaklanılarak kamu hukuku-özel hukuk ayrımının imkanına ilişkin tartışmalar, ayrımı kabul eden, reddeden ve bulanıklaştığını savunanların argümanları ve İslâm hukukunda kamu hukuku-özel hukuk ayrımına dair görüşler aktarılmıştır. Tüm bunların ardından İslâm hukukunda Allah-kul hakkı ayrımının sonuçları örneklerle somutlaştırılarak izah edilmiştir."
