abstract: "Fıtrat, Yüce Allah tarafından insana verilen özgün bir durumu; onun beden ve ruh yapısı ile yaratılıştan gelen tabiî özelliklerini ifade eder. Özellikle son yüz yılda teknolojinin gelişmesi ve buna bağlı olarak tıbbî teknolojinin ilerlemesiyle birlikte, başta estetik ve cinsiyet olmak üzere çeşitli alanlarda insan fıtratına yönelik müdahaleler çok artmıştır. Bu durum etik ve hukukî açıdan önemli tartışmaları beraberinde getirmiş; fıtrata müdahale uygulamalarının meşruiyeti fıkhî kriterler ışığında da tartışılmıştır. Fıkıh literatüründe bu konu daha çok fıtrat ve maslahata göre ele alınıp, genellikle faydalı olanın elde edilmesi, zararların önlenmesi ve mahremiyete özen gösterilmesi çerçevesinde yeri geldikçe tartışılmış ve çözüm yolları üretilmeye çalışılmıştır. Dolayısıyla klasik kaynaklarımızda fıtrata müdahale konusunun müstakil bir mesele olarak incelenmesine ihtiyaç duyulmamıştır. Son zamanlarda konu ile ilgili problemler çeşitlenip artınca çok sayıda ilgili akademik çalışma yapılmıştır. Ancak tespit edebildiğimiz kadarıyla, konuyu çeşitli yönleriyle fıtrat-maslahat çerçevesinde ele alan ve hassaten fıtratı koruma tedbirlerini bir bölüm halinde öne çıkaran müstakil bir çalışma bulunamadığından -konunun önemine binâen-“İslâm Hukuku Açısından İnsan Fıtratına Müdahale”adıyla bu yüksek lisans tezi hazırlanmıştır. Bu çalışma, İslâm hukuku açısından insan fıtratına müdahalelerin güncel değerlendirilmesine yönelik akademik bir katkı sunmayı hedeflemektedir."
