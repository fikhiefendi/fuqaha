abstract: "Arap yarımadasının büyük ve güçlü kabilelerinden biri olan Bekir b. Vail kabilesi İslam öncesi dönemde, sınırında yaşadığı Sasani İmparatorluğu tarafından zaman zaman istilalarla maruz kalmıştır. Bedevi Arap kabilelerinin genel özelliklerini taşıyan ve ağırlıklı olarak geçimlerini hayvancılık ile sağlayan kabile, çoğu zaman otlak ihtiyacı nedeniyle çevre kabileler ile de mücadele içine girmiştir. Yaşadığı bu tecrübeler sayesinde savaşçılık yönü gelişen Bekir b. Vail kabilesi, Zû-kar savaşında Araplar tarafından yenilmez kabul edilen Sasanileri mağlup ederek Arap tarihine adlarını yazdırmışlardır. Hicri 9. yılda Müslüman olan kabile İslam ordusunun Sasanilere karşı yaptığı mücadelelerde en ön safta bulunmuş, İslam dininin Irak, İran, Cezire ve Horasan'a yayılmasında büyük katkı sağlamıştır. Müslümanların Sasanilere karşı elde ettiği başarılarda Irak cephesi ordu komutanı ve Şeyban kolunun lideri Müsenna b. Harise'nin önemli bir yeri vardır. İslami dönemde fetihlerde gösterdikleri yararlılıklara rağmen klasik bedevi kültürün etkisiyle otoriteyi kabulde zorlanan kabile mensupları, zaman zaman çeşitli isyan hareketlerinde bulunmuşlardır. Hz. Ebu Bekir dönemi Ridde olayları ile Hz. Ali, Emevi ve Abbasi devirlerindeki harici isyanlarında ön planda yer almışlardır. Ayrıca İslam tarihinde yetiştirdiği birçok komutan, vali ve ilim adamıyla adından söz ettiren kabile, Abbasiler döneminde Şirvanşâhlar adıyla bir devlet de kurmuştur."
