abstract: "Bu çalışmada, İslâm siyaset düşüncesinde“din ve dünya riyâseti”olarak idealleştirilen hilâfet kurumunun, siyasî istikrar ve nüfuzunu yitirdiği, hâkimiyet alanının son derece daraldığı ve Şiî bir hanedanın vesâyeti altına girdiği bir dönemde kaleme alınan Ebü'l-Hasen el-Mâverdî'nin (ö. 450/1058) el-Ahkâmü's-sultâniyye'si ile İmâmü'l-Haremeyn el-Cüveynî'ye (ö. 478/1085) ait el-Gıyâsî'nin imâmet bahisleri mukayese edilmiştir. Tez, giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Giriş'te tezin konusu, yöntemi ve kaynakları tanıtılmıştır. Birinci Bölüm'de ilk olarak Mâverdî ile Cüveynî'nin yaşadıkları dönemin siyasî, fikrî ve kültürel koşulları tasvir edilmiş, ardından dönemin siyaset adamlarıyla olan münasebetleri incelenmiştir. Bu bölüm kapsamında müelliflerin hayatları ve ilmî kişilikleri hakkında da genel bilgiler verilmiş ve son olarak müelliflerin eserleri tanıtılmıştır. Bunlardan el-Ahkâmü's-sultâniyye ile el-Gıyâsî kapsamlı bir şekilde tanıtılmış, bunlar dışında muhtevasında siyasete ilişkin meselelerin yer aldığı diğer eserlere ise kısaca değinilmiştir. İkinci Bölüm'de imâmet bahsi esas alınarak iki eser siyasî-fıkhî ahkâm açısından mukayese edilmiştir. Bu çerçevede, imâmetin tanımından imamın görev ve sorumluluklarına kadar imâmet konusunun temel problemleri Mâverdî ile Cüveynî'nin görüşleri ışığında incelenmiştir. Müelliflerin belli bir konudaki görüşlerine geçmeden önce konuya intikali kolaylaştırması maksadıyla teorik bir çerçeve kazandırılmaya çalışılmış, konu etrafında klasik literatürde cereyan eden tartışmalara kısaca değinilmiştir. Bu bölümün sonunda Cüveynî tarafından el-Ahkâmü's-sultâniyye çerçevesinde Mâverdî'ye yöneltilen eleştirilere yer verilmiş, ileri sürülen eleştiriler tutarlılık açısından değerlendirilmiştir. Sonuç Bölümü'nde iki müellif arasında yapılan mukayese doğrultusunda genel bir değerlendirme yapılmıştır."
