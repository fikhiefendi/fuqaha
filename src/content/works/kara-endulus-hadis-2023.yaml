abstract: "Yaklaşık sekiz asır boyunca İslam hâkimiyeti altında kalan Endülüs coğrafyasında yoğun hadis şerh faaliyetlerini görmek mümkündür. Hattâbî'nin, Buhârî'nin ve Ebû Dâvûd'un eserlerine yazdığı şerhleri hariç tutarsak hadis şerhleri ilk önce Endülüs'te yazılmıştır. Dolayısıyla çalışmamızda Endülüs hadis şerhçiliğinin hangi nedenlerle ortaya çıkıp geliştiğini ve diğer coğrafyalardaki şerhler üzerindeki etkisini ele almayı amaçladık. Çalışmada veri toplama ve analiz yöntemini kullandık, konuyu ise hicrî üçüncü ve altıncı asırlar arasıyla sınırlandırdık. Çalışmada vardığımız sonuçlara değinecek olursak Endülüs'te hadis şerh faaliyetlerinin ilk olarak Muvatta' üzerine yazılan garîbü'l-hadîs çalışmalarıyla başladığını söyleyebiliriz. Mâlikîlik mezhebinin etkisiyle Endülüs'te Muvatta' üzerine yazılan şerh faaliyetleri diğer asırlarda da devam etmiştir. Muvatta'dan sonra bu coğrafyaya giren Buhârî ve Müslim'in Sahîh'leri ile Tirmizî'nin Sünen'i de burada şerh edilmiştir. Hicrî beşinci asıra kadar yazılan şerhler hacimli olmayıp daha çok kelime ve fıkıh ağırlıklı şerhler olmuştur. Endülüslü şârihler, fıkhî konularda zaman zaman mensubu oldukları Mâlikî mezhebi doğrultusunda görüş beyan etmişlerdir. Ancak Endülüslü Mâlikî âlimlerin zaman içerisinde ehl-i hadis anlayışına yakınlaşmaları sonucunda fıkhî hükümlerde hadisleri de dikkate almaya başlamışlardır. Bundan dolayı onlar, gerek müctehid âlimlerin gerekse itikâdî fırkaların hadise muhalif gözüken görüşlerini tenkit etmişlerdir. Endülüs hadis şerhlerinin diğer coğraflardaki hadis şerhlerine etkisinin bariz olduğunu söyleyebiliriz. Zira birçok şârih kaynağını belirterek Endülüslü şârihlerden nakiller yapmıştır."
