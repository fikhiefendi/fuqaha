abstract: "İslam siyaset düşüncesi çalışmaları son zamanlarda kazandığı ivme sayesinde birçok farklı açılardan makale, kitap ve tez konusu olmuştur. Bilhassa fıkıh ile yoğun ilişkisi bulunan bu yeni alan bugünkü Müslümanların meselelerine ışık tutabilecek büyük bir öneme sahiptir. Geçmiş ve bugün ile yapılacak mukayeseli çalışmalar ve bilhassa batı akademisinde daha çok yer edinmiş şahıs bazlı siyaset felsefesi çalışmaları önem arz etmektedir. Bu tezin biri teorik diğeri pratik olmak üzere iki aşaması bulunmaktadır. Böylelikle İbn Abdüsselam üzerinden bir fıkıh eserinden nasıl siyaset nazariyesi elde edileceğini ve bu siyaset nazariyesinin gerçek hayattaki siyasi ve içtimai meselelerde nasıl tezahür edeceğini araştırmaktadır. Bu itibarla bu tez merkezine iki eseri almaktadır. Bunlardan birincisi el-Kavâidü'l Kübrâ''dır. el-Kavâidü'l Kübrâ'dan, eser boyunca farklı vesilelerle ele alınan siyasete dair meselelerden yeknesak bir siyaset felsefesi elde edilmeye çalışılmıştır. Bunun yanında maslahat ve mefsedet merkezli bir fıkıh anlayışının siyaset nazariyesine olan etkisi de gösterilmeye gayret edilmiştir. Diğer eser ise Kitâbu'l Fetâvâ'dır. Fetvalarının derlendiği bu eser üzerinden el-Kavâidü'l Kübrâ eserinden elde edilen siyaset felsefesine İbn Abdüsselam'ın ne kadar sadık kaldığı araştırılmıştır. Bunun yanında İbn Abdüsselam'ın muteber tarih kaynaklarında birçok kez bahsi geçen fetvaları da tezde incelenmiştir. Tez içinde ayrıca bazı güncel meseleler ele alınmış ve geçmişteki meselelerin bugünkü tezahürleri de incelenmiştir. Bunun yanında İslam hukukunun bugünkü sair hukuklarla mukayesesi yapılmış ve meselelere daha geniş açılardan bakma imkânı sağlanmıştır."
