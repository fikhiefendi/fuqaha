abstract: "Öğretmenler, toplumun her kesimi tarafından örnek alınan, bilgi ve deneyimlerinden istifade edinilen, toplumu etkileyebilen ve saygı duyulan bir meslek grubudur. Din Kültürü ve Ahlak Bilgisi ile İmam Hatip Lisesi meslek dersleri öğretmenleri eğitim ve öğretim sisteminin içerisinde bir bütünün en önemli unsurlarından biri olduğu gibi din eğitimi ve öğretiminde de etkin role sahiptirler. Bu çalışmanın amacı, Sakarya İl MEM bünyesindeki ortaokul ve liselerde din eğitimi veren DKAB ile İHL meslek dersleri öğretmenlerinin faiz ve vade farkı bilgisini, faize karşı tutum ve davranışlarını, katılım bankalarıyla ilgili bilgi ve algı düzeylerini ve katılım bankalarını kullanım düzeylerini tespit etmektir. Anket çalışmasının evrenini Sakarya il Milli Eğitim Müdürlüğüne bağlı ortaokul ve liselerde din eğitimi veren toplam 774 DKAB ile İHL meslek dersleri öğretmenleri oluşturmaktadır. Çalışmanın örneklemi ise araştırma kapsamında yapılan ankete katılan 315 DKAB ile İHL meslek dersleri öğretmenleridir. Örneklemin belirlenmesinde olasılık hesabı bulunmayan örnekleme tekniklerinden“kolayda örnekleme”metodu kullanılmıştır. Elde edilen sonuçlara göre DKAB ile İHL meslek dersleri öğretmenlerinin faiz bilgisinin düşük olmasına karşın vade farkı bilgisinin yüksek olduğu tespit edilmiştir. Katılımcıların Katılım bankası ve İslami finans hakkındaki bilgi düzey algıları yüksektir. Öğretmenler katılım bankasındaki finansal işlemler hakkında sahip oldukları bilgi düzeyinin düşük olduğu görülmüştür. Bunun yanında öğretmenler tasarruflarını değerlendirmek istediğinde ve finansman kullanmak istediğinde katılım bankalarını tercih ettikleri sonucuna ulaşılmıştır."
