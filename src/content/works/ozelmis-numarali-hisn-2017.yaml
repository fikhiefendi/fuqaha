abstract: "Osmanlı Devleti'nin en önemli yargı organı Şerʻi mahkemelerdir. Padişah yargı yetkisini Kadılar vasıtasıyla kullanırdı. Kadıların hükümlerinin yer aldığı belgelere Şerʻiye Sicili denir. Bu siciller Türk tarihini, iktisadını ve Türk siyasi, sosyal ve hukuki hayatını yakından ilgilendirmekle birlikte Türk kültür ve tarihinin temel kaynaklarının başında gelmektedir. Bu belgeler dil, din, renk, ırk farkı gözetilmeksizin bütün halkla ilgili olayları ve bu olaylarla ilgili mahkeme kararlarını ve idari düzenlemeleri içerir. Bu çalışma 271 numaralı Hısn-ı Mansur (Adıyaman) H.1326/ M. 1908/1909 Kadı sicilinin transkripsiyon ve değerlendirilmesidir. Çalışmamızın başında Kadılık Kurumu, ortaya çıkışı, Kadıların görevleri, yargılama şekli, Şerʻiye Sicilleri ile ilgili bilgi verip, incelediğimiz 271 numaralı Adıyaman Kadı siciline dayanarak Adıyaman'ın sosyo-ekonomik durumu hakkında bilgi vermeye çalıştık."
