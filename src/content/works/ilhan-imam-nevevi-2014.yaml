abstract: "Bu tezimizde İmâm Nevevî'nin hayatını ve Minhâcü't-Tâlibîn adlı eserini inceledik. Tezimiz üç bölümden oluşmaktadır. Birinci bölümde Nevevî'nin hayatını, hocalarını, talebelerini ve eserlerini ele aldık. İkinci bölümde el-Minhâc eserindeki metoda, eser üzerine yapılmış çalışmalara ve eser hakkında ulemanın görüşlerine yer verdik. Üçüncü bölümde tezimizin asıl konusu olan Nevevî'nin el-Minhâc eserindeki tercihlerini işledik. Konuları ibadet, muamelat ve ukubat şeklinde ele aldık. Her bir konuya ait meselelerdeki tercihleri inceledik. Öncelikle meseleler hakkında mezhebin genel yaklaşımını verdikten sonra Râfiî ve Nevevî'nin mesele hakkındaki tercihlerine yer verdik. Özellikle Nevevî'nin meseledeki tercih sebebini, tercihte bulunurken hangi delilerle dayandığını tespit etmeye çalıştık. Bu tespitimizi yaparken Nevevî'nin diğer eserlerine de müracaat ettik.Nevevî el-Minhâc eserinde kendine has bir terminoloji ortaya koymuştur. Konular hakkında kanaatini belirtirken bunu açıkça ifade etmiştir. Nevevî'nin konular hakkındaki tercihleri Şâfiî mezhebinin tercihi olmuştur. Nevevînin tercihlerinde birçok faktör etkili olmuştur."
