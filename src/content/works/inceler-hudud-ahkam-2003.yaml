abstract: "Tahkikini yaptığımız bu kitap, XV. asırda yaşamış büyük alim Musannifek'e aittir. Söz konusu kitabın yazıldığı dönemlerde bütün Fıkıh kitapları genelde şekil ve muhteva yönünden birbirine benzemektedir. El-Hudud ve'l-AHkam adlı kitap da aynı usulle yazılmış olmasına rağmen bazı yönlerden farklılıklar içermektedir. Zira eserin şekli Fıkıh, içeriği ise Usûl-u Fıkıh gibidir. Bununla birlikte klasik kitaplarda konular uzun olmasına karşın, bu kitapta konuları özet olarak bulmak mümkündür. Zaten kitabın hacmi de konuların uzun uzun işlenmesine müsait değildir. El-Hudud ve'l-Ahkam'da dikkat çeken bir diğer nokta da diğer Fıkıh kitaplarında mutlaka bulunan Ferâiz ve Siyer gibi bazı konuları ele almamış olmasıdır. Yazarın takip ettiği metoda baktığımızda ise onun konuları ilk önce lügat anlamıyla, sonra da ıstılah! açıdan açıklamış olduğunu görürüz. O, meseleleri sadece açıklamakla lraİTTiflTnış zaman zaman kendi görüşünü de beyan etmiştir. Ayrıca konuların sebep ve şartlarım belirtmiş, diğer taraftan ihtilaflı konularda ise tercih edilen görüşü ortaya koymuştur. Musannifek, Hanefî Mezhebine mensup bir ilim adamıdır. Ancak eserinde bazı konularda Şafiî ve Mâhküerden de görüş almıştır."
