abstract: "Zekât İslâm'ın beş temel esasından biri olan Allah tarafından dinen zengin olan Müslümanlara emredilen, erdemli bir kulluğun gerekleri arasında sayılan, kulun Rabbine olan bağlılığını ortaya koyan, Kur'anı- Kerim ve Sünnet ile şartları ve çerçevesi belirlenen mali bir ibadettir. Zekât en genel anlamıyla, malı nisab miktarına ulaşmış bir Müslümanın sahip olduğu maddi varlık sebebiyle belirlenmiş kimselere vermekle yükümlü olduğu malı ifade etmektedir. Zekât ekonomik hayata yön veren yoksulluğun önlenmesinde, gelir gider dengesinin sağlanmasında ve eşitsizliğin ortadan kalkmasında yardımcı olan bir kurumdur. Zekât sayesinde toplumdaki en büyük sorun olan yoksulluk sorunun çözümlenmesi oldukça başarılı adımlar atılabilmektedir. Zekât zengin olandan alıp ihtiyacı olana veren, iktisadi dengeyi sağlamaya çalışan bir ibadettir. Kur'an-ı Kerim ve Sünnette insanın ruhunu temizleyeceği ve malını arttıracağı vurgulanmaktadır. Dolayısıyla bu konu bireyin ve toplumun refahı için önem arz etmektedir. Sosyo-ekonomik problemlerin çözümünde büyük rol oynadığı için çok iyi bu ibadetin anlaşılması gerekmektedir. Tüm bunlar ışığında çalışmanın amacı zekât ibadeti hakkında derinlemesine araştırma yapıp yoksulluğu önlemedeki rolüyle ilgili bilgi sahibi olmaktır. İslâm'ın temel şartları içerisinde yer alan zekâtın doğru anlaşılıp doğru uygulanması açısından yeniden ele alınması gerektiği inancı bizi bu çalışmaya sevk etmiştir. Sosyal yardımlaşma ve dayanışma açısından çok mühim bir kurum olmakla birlikte günümüzde gereken önemi görmemektedir. İnsanlar tarafından zekât ibadetinin daha iyi anlaşılması kişileri zekât vermeye, yardımlaşma ve dayanışma konusunda olumlu adımlar atmaya sevk edecektir. Çalışmamızın konusu yoksulluk sorunun incelenmesi ve zekât kurumunun yoksulluğu önlemedeki rolünü ele alınmasıdır. Bunun yanında, MÜSİAD gibi Türkiye'deki önemli iş adamları derneğinin üyelerinin zekât kurumunun yoksullukla mücadelesine katkısı imkân ve fırsatlarına bakışı analiz edilmiştir. Araştırmanın çalışma grubu MÜSİAD üyeleridir. Araştırmada nitel araştırma yöntemlerinden biri olan mülakat (görüşme) tekniği kullanılmıştır. Çalışma zekâtın ana hatlarıyla çerçevelendirebileceğimiz zekâtın önemi, tarihçesi, zekât verilecek mallar, zekâtın farz olmasının şartları, zekâtın istihdama ve üretime katkısı, MÜSİAD üyeleriyle yapılan mülakat görüşmelerinden bulgularla zenginleştirilip amacına hizmet edecek şekilde tasarlanmıştır. Çalışma dahilinde yapılan mülakat görüşmelerinde MÜSİAD üyelerinin Türkiye'de zekât potansiyelinin çok yüksek olduğu, zekâtın yoksullukla mücadelede büyük bir rol oynadığı ve bu ibadet yerine getirildiği takdirde yoksulluk sorununu büyük oranda çözeceği sonucuna ulaşılmıştır."
