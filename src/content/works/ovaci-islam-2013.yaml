abstract: "İslam Hukuk Metodolojisinde Aklın Teşrii Rolü(Usûl-ü Pezdevî ve el-Mustasfâ Örneğinde Hüsün-Kubuh) diye isimlendirilen bu araştırma giriş ve iki bölüm ile sonuçtan oluşmaktadır.Girişte hüsün-kubuh konusunun mahiyeti, amaç ve kapsamı ile eserlerinin örneğinde konuyu incelediğimiz müelliflerin hayatı ve eserleri hakkında kısaca bilgi verildi.Birinci bölümde, toplumsal düzende iyi-kötüyü belirleyen kurallar, İslam hukukunun diğer hukuk sistemleriyle farklılığı, meşruiyet ve kaynağı, İslam hukukunda mükellefiyet, İslam hukukunda hâkim meselesi, hüsün-kubhun mânâları ve kelâmda hüsün kubuh ile yakın tarihteki hüsün-kubuh tartışmaları araştırıldı.İkinci bölümde Usûl-ü Pezdevî ve el-Mustasfâ örneğinde hüsün-kubuh konusu incelendi. Bu bölümün ilk kısmında İmam Pezdevî'ye göre memûrunbih ve menhiyyünanhın hüsün-kubuh açısından taksimi ile Usûl-u Pezdevî örneğinde hüsün-kubuh akıl ilişkisi araştırıldı. İkinci kısımda ise el-Mustasfâ örneğinde İmam Gazzâlî'nin hüsün-kubuh hakkındaki görüşleri ile hüsün-kubuh akıl ilişkisi araştırıldı.Sonuç kısmında elde edilen bilgi ve bulgular değerlendirildi."
