abstract: "Ticaret hayatının büyük kısmını oluşturan borç ilişkilerinin güven temelinde sürdürülebilmesi için temînât hukukunda aynî temînât vasıtalarına sıklıkla müracaat edilmektedir. İslâm hukukunda borç ilişkilerinde alacak haklarının güvence altına alınması için ele alınan aynî temînât vasıtaları rehin, hakku'l-haps, ipotek ve bey' bi'l-vefâdır. Üçüncü bir kişi veya kişilerin zimmetine ilişkin olan şahsî temînâtlardan daha sonra ortaya çıkan aynî temînât vasıtaları, temînât hukukunun son merhalesini oluşturmaktadır. İslâm hukukunda aynî temînât vasıtaları, bir taraftan alacaklının haklarını güvenceye alırken diğer taraftan ihtiyaç duyulan kredinin daha kolay temin edilmesini sağlar. Karmaşık bir yapıda olan borç ilişkilerinde hak kayıplarının önlenmesi için aynî temînât vasıtaları önemli bir işlevi icra etmektedir. Alacak haklarının nitelik ve nicelik bakımından eksiksiz bir şekilde geri ödenmesi aynî temînât vasıtalarıyla mümkün hale gelebilmektedir. Bu çalışma İslâm hukukunda alacak haklarının güvence altına alınmasını sağlayan ve mahiyeti itibariyle bir aynla ilişkili olan aynî temînât vasıtalarını incelemeyi amaçlamaktadır. Çalışmanın konusu, dört büyük mezhebin literatürü ve diğer hukuk sistemlerinin aynî temînât vasıtalarıyla ilgili hukukî düzenlemeleri dikkate alınarak mukayeseli bir şekilde ele alındı"
