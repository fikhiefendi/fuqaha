abstract: "Bu çalışma siyâsetnâme, erken inşâ literatürü, ahkâm-ı sultâniyye ve siyâset-i şer'iyye eserlerinin mezâlime dair tasavvurlarını ele almayı ve özellikle mezâlimi bir yargı müessesesi olarak gören ve ona hukukî bir zemin oluşturan ahkâm-ı sultâniyye ve siyâset-i şer'iyye eserlerinin mezâlime yönelik teorik yaklaşımlarını ortaya koymayı hedeflemektedir. Buna göre siyâsetnâmeler, mezâlimi yöneticinin halkın şikayetlerini dinlediği özel bir oturum ve yöneticinin adaletinin bir tezahürü olarak tavsif ederken erken inşâ ve ahkâm-ı sultâniyye literatürü, yargı müesseseleri arasında bir ayrıma giderek mezâlimi, yetki sahası ve dava ispat yöntemleri bakımından kadı mahkemesinden farklılaşan özel yetkili bir mahkeme şeklinde konumlandırmıştır. Siyâset-i şer'iyye müellifleri ise kapsayıcı bir şer'î yargı tasavvuru geliştirerek nihayetinde mezâlim yetkisini kadı mahkemesine devretmişlerdir. Bu çalışma, mezâlimin teorik ve hukukî boyutuna yer veren metinlerde mezâlimin şer'î çerçevesinin korunduğunu, bununla birlikte onu ele alan müelliflerin, önceki metinlerin yaklaşımlarını değerlendirdiğini, eleştirdiğini, mezâlimin yetki sahası ve dava ispat yöntemleri konusunda farklı yaklaşımlar geliştirerek bu konudaki teorik ve hukukî çerçeveyi dönüştürdüklerini ileri sürmektedir. Anahtar Kelimeler: Mezâlim, Siyaset, Ahkâm-ı sultâniyye, Siyâset-i şer'iyye, Siyâsetnâme, Yargı Müesseseleri"
titleTranslation: {"en": "The theory of mazālim in islamic law and political thought"}
