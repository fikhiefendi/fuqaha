abstract: "Toplumun en küçük ama en önemli yapı taşı olan aile, hem aile fertleri hem de toplum için vazgeçilmez bir kurumdur. Bu önemine binaen İslam hukukunda aile müessesesinin kurulumu ve sona ermesi için taraflarda birtakım şartlar aranmaktadır. Taraflarda bulunması gereken şartlardan biri de ehliyettir. Hak ve sorumlulukların sübutu için kişilerde zaruri olarak bulunması gereken ehliyet vasfını ortadan kaldıran bazı semavi (gayri iradî) ve müktesep (iradî) arızalar vardır. Müktesep arızalardan biri olan sarhoşluğun evliliğin kurulumu ve sona erdirilmesindeki rolünün ne olduğu İslam hukukçuları arasında tartışma konusu olmuştur. Konu halen güncelliğini korumaktadır. Bu nedenle yapılan çalışmada sarhoşun İslam aile hukukundaki tasarrufları ele alınmıştır. Çalışma giriş, üç bölüm ve sonuçtan oluşmaktadır. Girişte araştırmanın önemi ve amacı, yöntemi ve kaynakları, kapsamı ve sınırlılıkları ele alınmıştır. Birinci bölümde“İslam Aile Hukukunda Genel Hükümler”ana başlığı altında aile kavramı ve ailenin önemi, evlilik akdi (nikâh), evliliğin sona ermesi gibi konular incelenmiştir. İkinci bölümde ise“Sarhoşluk ve Kişi Ehliyetine Etkisi”ana başlığı altında sarhoşluk, sarhoşluğun ehliyete tesiri konularına değinilmiştir. Üçüncü bölümde ise dört mezhep çerçevesinde sarhoşun İslam aile hukuku alanındaki tasarruflarının fıkhi hükmü ele alınmıştır. Bununla birlikte konuyla ilgili çağdaş yaklaşımlarda sarhoşun tasarruflarına ve bugünkü hukuk düzenlerinde sarhoş/sarhoşluk konusuna yer verilmiştir."
