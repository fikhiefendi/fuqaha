abstract: "Bu çalışmanın temel amacı, Türkiye'deki İslami bankacılık sektörünün orta gelir tuzağının önlenmesindeki rolünü incelemektir. Çalışmanın amaçlarına ulaşması için, İslami bankacılık sisteminin ana temellerinin (tasarruf, yatırım ve ekonomik büyüme üzerindeki) olası etkilerinin teorik temelde incelenmesi ve İslami bankacılık sektörünün (2007-2017) yılları arasında finansal verilerini analiz etmesi benimsenmiştir. Yapılan analiz sonucu, İslami bankacılık ekonomik büyüme oranlarına anlamlı bir pozitif etki göstermektedir. İslami bankacılık geleneksel bankacılığın yerine geçmez tamamlayıcı durumdadır. Orta gelir tuzağının önlenmesi için İslami bankacılık tek başına yeterli değildir."
