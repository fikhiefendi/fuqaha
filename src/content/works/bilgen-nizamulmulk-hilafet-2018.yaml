abstract: "Toplumun vazgeçilmez bir parçası olan devlet yapısının fikrî oluşumu, iktidarın kurumsallaşması ile ilgilidir. Siyasal iktidar modelleri, toplumların sosyal ve tarihsel şartlarına göre şekil alır. İslam siyaset tarihinde iktidar kurumu hilafet müessesi ile temsil edilmiştir. Hilafet konusu, İslam tarihinin çeşitli dönemlerinde büyük fikir ayrılıklarına ve tartışmalara konu olmuştur. Bu fikir ayrılıklarına sebep olan husus, kimin halife olacağı yani kimin halife olmaya daha layık olduğudur. Dolayısıyla hilâfet konusunda üzerinde durulması gereken nokta halife olacak bir liderde hangi özelliklerin bulunması gerektiği sorusudur. Hilafet üzerine çok sayıda eser kaleme alınmıştır. Bu eserlerden biri de Cüveynî'nin Gıyâsü'l-Ümem'idir. Cüveynî, hilafeti sadece teorik bir konu olarak ele almamış, pratiği değerlendirerek teori üretmeye çalışmıştır. Bu da kendisini, zamanın fakihlerinden ayıran önemli bir husus olmuştur. Cüveynî eserinde, bizim 'yeni ve zarurî bir halife' olarak ifade ettiğimiz bir halife adayı belirlemiştir. Ve bu kişi, en kısa sürede hilafet makamına geçerek, Müslümanlara liderlik yapması gerektiği çağrısında bulunmuştur. Bu aday, tezimize konu olan, Selçuklu Devleti veziri Nizâmülmülk'tür. Bu çalışmada Nizâmülmülk'ün; Cüveynî'nin yapmış olduğu bu çağrıya karşı nasıl bir tavır sergilediği, kendisinin izlemiş olduğu hakimiyet politikaları ve bu politikaların ne anlam ifade ettiği sorularının yanıtı incelenmiştir."
