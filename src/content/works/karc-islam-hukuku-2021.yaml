abstract: "İslam Hukuku ve Uluslararası Hukuka Göre Mülteci Hakları\" adlı çalışmamız bir giriş kısmı ile üç bölümden oluşmaktadır. Birinci bölümde iltica ve mülteci kavramları ile mülteciyi ağırlamanın fazileti ve ekonomiye etkileri üzerinde durulmuştur. İkinci bölümde, Klasik fıkıh kaynaklarında iltica ve mültecilerle ilgili hükümler hakkında değerlendirmeler yapılmıştır. Üçüncü bölümde, islam hukuku ile uluslararası hukukta mültecilerinin hak ve sorumlukları ele alınmış olup akabinde mültecilerinin islam hukukunda ve uluslararası yasalarda hak ve sorumlulukları arasında karşılaştırma yapılmıştır. Akabinde de Uluslararası Yasalara Göre Mültecilerin Toplum İle Entegrasyonu ile ilgili açıklamalar yapılmıştır. Yaptığımız çalışmada şu sonuca ulaşılmıştır: mültecilik ve sığınma insanlık tarihi kadar eski bir olgudur. Ancak kavrama olarak son yüzyılda ortaya çıkmıştır. Bu yüzden İslâm hukukunda bu kavram doğrudan karşılığı bulunmamaktadır. Mülteci statüsüne oldukça yakın olan Kur'an ve Sünnetten elde ettiği bazı kavramları mevcuttur. Eman müessesesi mültecilik ve göçme kavramlarının ilk şeklidir. Bu müessese gereğince, korumaya ihtiyacı olan, göç etmeye zorlanmış herkese dini ya da ırkı dikkate alınmaksızın eman verilmelidir."
