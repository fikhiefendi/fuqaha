abstract: "İnsanlık tarihinin başlangıcına kadar uzanan ödünçleşme, ilk anda kişiler arasıolurken daha sonraları kurumlaşmış ve bankaların bir fonksiyonu, hatta en önemli birfonksiyonu halini almıştır.Bugünkü bankacılık müessesesinin temelleri, paranın ûcâdıyla atılmıştır. lkdönemlerde insanlığa hizmet maksadıyla ortaya çıkan bankalar, daha sonraları bütündinlerce yasaklanmış olan fâizi bünyelerine almakla asıl maksatlarındanuzaklaşmışlardır.Geleneksel bankaların faizle iştigal etmeleri Müslümanları alternatif faizsizbanka modelleri araştırmaya sevk etmiştir. Dünya genelinde 1955'li yıllarda ortayaatılan bu fikir planı 1960'lı yıllarda uygulamaya geçmiştir. slam dünyasındaki bugelişmeler Türkiye'de de etkisini göstermiş ilk Özel Finans Kurumu 1983 yılındakurulmuştur.Özel Finans Kurumları, diğer bankalar gibi fon toplama ve fon kullandırmafaaliyetleri yapmaktadırlar. Özel Finans Kurumları söz konusu bu işlemleri slamişartlara uygun, özellikle ticari faaliyetlerde bulunarak, kendine has yöntemlerle faizebulaşmadan gerçekleştirmektedirler.Bu tür faizsiz bankacılık işlemi yapan kurumların kurulmasıyla faizlibankalardan uzak duran Müslüman halkın elinde atıl halde bulunan paralarekonomiye kazandırılmaktadır."
