abstract: "Hz. Peygamberin vefatından sonra Hz. Ali ve Ehl-i Beytini halifelik (imamet) için enlayık kisi olarak gören ve onu nass ve tayinle ?mesru? halife kabul eden; ondan sonrakihalifelerin de onun soyundan gelmesi gerektigine inanan toplulukların müsterek adı olan Sia,Keysaniyye, Zeydiyye, mamiyye, Gulat (Asırılar) ve smailiyye olmak üzere 5 fırkayaayrılmıstır. Caferilik mamiyye Siasının fıkıh mezhebidir.Türkiye'de Müslümanların büyük bir bölümü Sünni iken, Caferilerin Sii bir inancasahip olmaları, onların toplumun genis bir kesimi tarafından farklı bir sosyal grup olarakalgılanmalarına sebep olmaktadır.Sosyal bütünlesme açısından bakıldıgında Caferleri Türk toplumu ile bütünlestiren vefarklılasmasına sebep olan faktörler vardır. Ortak tarih, ortak cografya, milli birlik, dini birlik,kültürel birlik ve evlilik sosyal bütünlesmeye olumlu etki yapan faktörler olarak dikkatçekerken, mezhep farklılıgı, mabed farklılıgı, Caferilerin kendi mezheplerine din egitimiimkanı bulunmaması ve dini muamelattaki farklılıklar vb. unsurlar sosyal farklılasmaya sebepolan faktörler olarak dikkat çekmektedir."
