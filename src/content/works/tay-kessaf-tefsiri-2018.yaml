abstract: "İlmî bir kişiliğe sahip olan Zemahşerî, kendisinden sonrakileri etkilemeyi başarmış, nadir şahsiyetlerdendir. Arap diline olan hâkimiyeti sayesinde Kur'ân'ı anlayabilme ve tefsir edebilme noktasında müfessirler arasındaki yerini almıştır. Bu çalışma Zemahşerî'nin (v.748/1321) ahkâm âyetleri açısından el-Keşşâf an Hakaiki Gavamidi't-Tenzil ve Uyuni'l-Akavil fi Vucuhi't-Te'viladlı tefsirindeki görüşlerinin tespiti ve tahlilini içermektedir. Dirâyet metoduna göre yazdığı tefsirinde rivâyetlere de yer veren Zemahşerî, âyetleri dil ve belagat kaideleriyle eski Arap şiirleri ışığında tefsir etmektedir. Müellif ahkâm âyetlerinde daha çok mensubu olduğu Hanefi mezhebine uygun hükümler çıkarmaya çalışmış; diğer mezheplere ait görüşleri de vermeye çalışmıştır. Zemahşerî, eserinde Mutezile mezhebinin ilkelerine uygun olan âyetleri muhkem; aykırı olan âyetleri ise müteşabih saymıştır. Üç bölümden oluşan bu çalışma birinci bölümünde Zemahşerî'nin hayatı, ilmi kişiliği, eserleri ve Mutezili görüşleri hakkında bilgi verilmiştir. İkinci bölümde fıkhî tefsir hareketi, ahkâm âyet sayısı, tasnifi gibi hususlarla ilgili bilgiler verilmiştir. Bu bölünde ahkâm konusu ile ilgili genel bilgi verilerek üçüncü bölümün anlaşılmasına katkı sağlayacağı düşüncesiyle bir hazırlık çalışması yapılmıştır. Üçüncü bölümde ise Zemahşerî'nin taharet, namaz oruç, aile hukuku, savaş, suç ve ceza gibi ahkâma taalluk eden kavram ve konularla ilgili görüş ve yorumlarına yer verilmiştir. Üçüncü bölümde Zemahşerî, ahkâm âyetleri tefsirini dil bilgisine dayalı olarak yaptığı, hüküm ifâde eden âyetlerle ilgili tercihlerini ortaya koyarken başta tabi olduğu Hanefi mezhebi olmak üzere diğer mezhep görüşlerini de tercih ettiği ve kimi yerde ise kendi görüşünü ifâde ettiği görülmüştür. Bu üç bölüm sonunda vardığımız sonuca göre Zemahşerî'nin ahkâma dair tefsiri genelde tabi olduğu Hanefi mezhebine, özelde ise tabi olduğu mutezile mezhebine muvafıktır. Ancak bazı âyetlerin tefsirinde mezhebinin görüşünü tercih etmediği yerler de olmuştur."
