abstract: "Teverruk akdi, güncel literatürde nakit temin etmek amacıyla vadeli olarak yüksek fiyata satın alınan bir malın, alındığı fiyattan daha düşük bir bedelle satıcının dışında başka bir kimseye peşin olarak satılması şeklinde tanımlanan bir işlemdir. İslam hukukçuları bu işlemin hükmü hakkında ihtilaf etmişlerdir. Bu bağlamda tezimizde öncelikle teverruk kavramıyla ilgili tespit edilen konulara ve teverrukun finansman sağlayan akitler içindeki konumuna yer verilmiştir. Ardından klasik dönemdeki fakihlerin teverruka yaklaşımları ele alınmış ve dört mezhebin teverruk hakkındaki görüşleri incelenmiştir. Daha sonra da teverrukun günümüz uygulama örneklerinden hareketle konunun modern kaynaklardaki işlenişine ve muasır fakihlerin bu çerçevede ortaya koydukları görüşlere değinilmiştir. Konu hakkındaki hem klasik hem de güncel fıkhi tartışmalar ele alınarak bu tartışmaların dayandığı temel nedenler incelenmiştir. Ayrıca günümüzde faizsiz finans sektöründe kullanılmakta olan teverrukun uygulama örnekleri üzerinden fıkhi değerlendirmelerde bulunularak konunun İslam hukukundaki hükmü tespit edilmeye çalışılmıştır."
