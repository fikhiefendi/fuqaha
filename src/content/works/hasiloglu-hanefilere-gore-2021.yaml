abstract: "İslam hukuku günlük hayata ilişkin tüm sahalarda birtakım düzenlemeler getirmiştir. Böylece ferdin hak ve yükümlülüklerini bilmesini sağlamıştır. Kişinin, rabbiyle ve toplumla ilişkilerini düzenleyen İslâm Hukukunun en önemli konularından birisi de aile hukukudur. Aile hukukunun temeli ise nikah akdi ile başlar. Nikah akdi ile eşler birbirine karşı İslam'ın kendilerine yüklediği sorumlulukları yerine getireceklerine dair bir söz verir. Nikah ile birbirinin haklarını koruyacaklarına dair sözleşen karı-koca bu evlilikten doğacak çocukların da haklarını korumakla emrolunmuştur. Çünkü İslam sadece karı kocanın haklarını değil evliliğin meyvesi olan çocukların da haklarını muhafaza etmiştir. İslam hukukunun çizdiği sınırlar bazı durumlarda bireyler için tercihe bırakılmışken bazı durumlarda zorunluluk olarak bildirilmiştir. Elbette bu uygulamaların hepsinde temel amaç evlilik müessesinin mutlu ve huzurlu bir şekilde sürdürülmesidir."
