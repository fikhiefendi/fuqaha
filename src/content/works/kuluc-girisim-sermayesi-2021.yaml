abstract: "Bu çalışma Girişim Sermayesi Yatırım Ortaklıklarının finansman yöntemlerini İslam hukuku bağlamında tartışmaktadır. Ele alınan finansman yöntemleri temelde hisse alımı ve hisseye dönüştürülebilir tahvil alımı şeklindedir. Söz konusu finansman yöntemlerine tezin iki ana bölümünde yer verilirken, tarafların fıkhî durumu ayrı bir bölümde incelenmiştir. Araştırma, tartışma ve mukayese yöntemlerinin kullanıldığı çalışmanın birinci bölümünde girişim sermayesi ile melek yatırımcı kavramı ve tarihsel gelişimi; yatırım aşamaları ve yatırımdan çıkış stratejileri incelenmiştir. İkinci bölümde ise hisse alımıyla yapılan finansman irdelenmiştir. Hisse senedi türlerinin açıklandığı bu bölümde ayrıca hisse senetlerinin fıkhî değerlendirmelerine yer verilmiştir. Hisseye dönüştürülebilir tahvillerin ele alınıp tartışıldığı üçüncü bölümde ise bu tahvillerin mahiyeti, yatırımcısı ve ihraççısı açısından olumlu ve olumsuz olabilecek yönlerine değinilmiştir. Taraflar arasındaki ilişkinin fıkhî tahlili dördüncü bölümde yapılmıştır. Yine bu bölümde hisse alımıyla yapılan finansmanın değerlendirilebilmesi için İslam hukukundaki inan ortaklığı ve mudârebe akdine yer verilmiştir. Literatürde girişim sermayesi ve mudârebe akdi arasında benzerlik kurulduğu görülmüştür. Bu benzerliğin Türkiye uygulamasıyla ne kadar uyumlu olduğu tartışılmıştır. İslam hukuku açısından hisseye dönüştürülebilir tahviller karz akdi bağlamında ele alınmıştır. Girişim sermayesi uygulamasında pay sahipliği sözleşmesinin atipikliği nedeniyle, İslam hukuku açısından belli bir akit altında değerlendirilmesinin mümkün olmayacağı kanaatine varılmıştır."
