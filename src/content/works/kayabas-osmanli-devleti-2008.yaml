abstract: "?Osmanlı Devleti'nde Tanzimat Döneminde Cemiyetler Hukukunun Gelişimi? başlıklı çalışmada Osmanlı Devleti'nde dernekler hukuku alanındaki gelişim incelenecek ve yasal düzenlemeden önceki durum hukuki, siyasal ve toplumsal yansımalarıyla tartışılacaktır. Tanzimat Fermanı'nın ilanından sonra örnekleri görülmeye başlayan derneklerin hukuksal açıdan tanınma aşamaları etraflıca incelenecektir. Ayrıca çalışmada Batı kaynaklı bir kurum olan dernek ile Türk-İslam toplumunda var olan dernek benzeri kurumların da ortak ve farklı yanları üzerinde durulmuştur.Çalışmanın birinci bölümü tanım, teori ve tarihsel gelişime ayrılmıştır. Modern hukukta dernek kavramı, derneğin de bir özel hukuk tüzel kişisi olmasından hareketle, tüzel kişi kavramı, tüzel kişi teorisi, kamu ve dernek harici özel hukuk tüzel kişileri konuya açıklık getirecek ve destekleyecek kadarıyla incelenecek ve teori temellendirilmeye çalışılacaktır. İkinci bölümde Tanzimat Dönemi'nde Osmanlı Devleti'nde hukuksal açıdan dernekler ve dernek çeşitleri incelenmiştir. Bu inceleme esnasında dönemin önemli siyasal ve hukuksal gelişmeleri ile dernekleşme süreci ayrı ayrı başlıklar altında değerlendirilmemiştir. Özellikle Tanzimat Dönemi öncesi gelişmeler ve dönemi hazırlayan süreç ve modern derneklere temel olacak örgütler bir arada zaman akışına uyularak birlikte tüketilmiştir. Çalışmanın üçüncü ve son bölümünde ise öncelikle döneme ve dernek tarihine yön veren İttihat ve Terakki Cemiyeti'nden bahsedilmiş, söz konusu Cemiyet'in kanundan önce nasıl kurulduğu, sonrasında nasıl yasallaştığı ve bir süre sonra da ?fırka? halini alması örneğinden hareketle derneklerin gelişimi araştırılacak ve Cemiyetler Kanunu'nun kabul edilmesi ve hükümleri incelenecektir."
