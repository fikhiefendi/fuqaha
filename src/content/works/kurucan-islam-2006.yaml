abstract: "ÖZETDOKTORA TEZİİSLAM HUKUKUNDA DÜŞÜNCE ÖZGÜRLÜĞÜAhmet KURUCANDanışman: Prof. Dr. Hamza AKTAN2006-SAYFA: lX + 163Jüri: Prof. Dr. Hamza AKTANProf. Dr. H. İbrahim ACARProf. Dr. Vahdettin BAŞCIProf. Dr. Beşir GÖZÜBENLİProf. Dr. Nihat DALGINBu tezde İslam Hukukunda Düşünce Özgürlüğü konusu incelendi. Çalışma birgiriş ve iki bölümden oluştu. Girişte düşünce ve özgürlük kavramları tanımlandı vedüşünce özgürlüğünün tarihsel gelişimi özetlendi.Birinci bölümde düşünce özgürlüğü, Kur'an ve sünnet esas alınaraktemellendirildi. Konuyla ilgili hulafa-i raşidin uygulamasından örnekler verildi. Ayrıcaİslam hukuk doktrininde önemli bir kavram olan ictihad, düşünce özgürlüğüperspektifinden değerlendirildi.İkinci bölümde düşünce özgürlüğünün dini ve hukuki boyutları tartışıldı. Dinûboyutta, aktüel önemi büyük olan tebliğ ve cihad konuları düşünce özgürlüğübağlamında incelendi. Hukukû boyutta ise, din ve vicdan özgürlüğüne aykırı olaraknitelenen irtidad meselesi detaylı olarak araştırıldı. Ayrıca, eleştiri ile hakaretin ayrı ayrıdeğerlendirilmesine vurgu yapıldı ve hakaretin ceza hukuku boyutuna temas edildi.Sonuçta ise, ulaştığımız kanaatler belirtildi."
