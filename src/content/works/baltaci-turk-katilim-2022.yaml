abstract: "Küresel ekonomide faize dayalı ekonomik sistemlerin zayıfladığı sıklıkla savunulmaktadır. Bu zayıflığın kanıtı olarak da küresel ekonomik krizler gösterilmektedir. Bu krizler sonucunda ulusal ekonomilerin ağır yara aldığı ve zayıfladığı görülmektedir. Emek dâhil edilmeden paradan para kazanarak döngü sağlayan klasik ekonomik sistemin krizlerde etkisiz kaldığı görülmektedir. Bu nedenle de zenginler daha çok zenginleşmiştir. Ekonomisi geri kalan ülkelerin ise daha çok fakirleştiği görülmüştür. İslam iktisadı fikri ise İslam'ın ortaya çıktığı yıllara, İslam devletlerinin zengin ve güçlü olduğu çağlara dayanmaktadır. Temel felsefesi de emeğe dayalı faizsiz ekonomik modeller yürütmek, sosyal hayata ve piyasaya en etkin ve verimli şekilde mal ve hizmet sunmaktır. Günümüzde ise katılım bankaları ve finans kurumları, konvansiyonel sisteme karşı bu temel argümanı savunmaktadır. Bu metotla piyasada değişiklik yapmayı öngörmektedirler. Araştırmada, neo-klasik anlayış ve ekonomik krizlerin nedeni olarak görülen konvansiyonel bankacılık sistemine güçlü bir alternatif olarak katılım temelli finans ekonomisinin ürün ve hedefleri açıklanmıştır. Gelişmekte olan ülkeler baz alınarak Türkiye ekonomisine potansiyel etkileri açıklanmaya çalışılmıştır. Türkiye ekonomisinde katılım bankalarının yıllar içindeki gelişimi değerlendirilmiştir. Tez çalışmasında, bu sistemlerin ülkemizin makroekonomik sorunlarına çözümler üretmesinde ne tür ciddi faydalar sağlayacağı açıklanmaktadır. Bununla birlikte, İslam iktisat sisteminin büyüyüp gelişmesine katkı sağlayacak metotları açıklamayı hedeflemektedir. Bu metotların neo-klasik piyasaya doğru bir biçimde dâhil edilmesi öngörülmektedir. Çalışmamıza katılım bankacılığının işleyişinden yola çıkılarak finansal veriler ve bulgular göz önünde bulundurulmaya çalışılmıştır. Gelişmekte olan benzer ülkelerin katılım bankacılığında geldiği konum örnek alınarak Türkiye ekonomisinde de katılım bankalarının oynayabileceği roller projekte edilmektedir. Bu çalışma ile tarihi geçmişe dayanan ancak neo-klasik sistemde henüz yer bulan ve gelişmeye de oldukça meyilli bu yeni finans türü teorik olarak açıklanmaya çalışılmıştır. İslami finansın neo-klasik ekonomiye adapte oluşu ve gelecekteki hedefleri analiz edilerek açıklanmaya çalışılmıştır. Elde edilen bulgular ve veriler çerçevesinde katılım bankalarının makro hedefleri analiz edilmiştir. Böylece henüz çok yeni olan fakat tarihi gelişimi geçmişe dayanan bu kadim ekonomik model hakkında günümüz dünyasına adaptasyonu ve potansiyel makro getirilerinin açıklanması hedeflenmiştir. Bu adaptasyon sonucunda Türkiye ekonomisine sağlayacağı makro katkılar açıklanmıştır. Türkiye ekonomisinde oluşabilecek yeni ve güçlü alternatif yöntem analiz edilmiştir."
