title: "Hanefî Mezhebine Göre Satım Akdinde Mülkiyetin İntikaline İlişkin Hükümlerin Borçlanma ve Tasarruf İşlemlerinin Birliği ve Ayrılığı İlkeleri Açısından Değerlendirilmesi"
