abstract: "Hukuk sistemleri satım akdinde mülkiyetin intikaline ilişkin farklı yaklaşımlar benimsemiştir. Kara Avrupası hukuk çevresinde bu konu, borçlanma ve tasarruf işlemlerinin birliği ve ayrılığı ilkeleri çerçevesinde ele alınmıştır. Fıkıh literatüründe ise belli sınırlılıkları olmakla birlikte yaygın kanaate göre mülkiyetin intikali için satım akdinin kurulması yeterli görülmüş, akde ilave olarak akid konusunun teslim ve tesellümü şart koşulmamıştır. Ancak dikkatli bir şekilde incelendiğinde salt akid ile intikal eden mülkiyetin mahiyeti teslim ve kabz sorasındaki mülkiyetin mahiyeti ile aynı derecede kabul edilmediği görülmektedir. Bu çalışmada,“satım akdinin hükmü”olarak ifade edilen mülkiyetin intikali ve akid sonrasında kabza bağlı olarak mülkiyetin kazandığı mahiyet Hanefî mezhebi özelinde inceleme konusu yapılmıştır. Kabzın mülkiyetin intikaline etkisi, mülkiyetin intikalini engelleyen ve mülkiyeti ortadan kaldıran durumlar yine satım akdinin hükmü bağlamında ele alınmıştır. Klasik fürû-i fıkıh eserleri başta olmak üzere çağdaş İslam hukuku eserlerinden ve modern hukukta konuyla ilgili benzer kavram ve tasniflerden faydalanarak satım akdinin hukukî sonuçlarının ortaya konması amaçlanmıştır. Çalışma neticesinde satım akdinde birlik veya ayrılık ilkelerinden birisinin benimsenmesinin mülkiyetin intikali için öne sürülen şartların esnek ya da katı olmasına doğrudan etki ettiğine ulaşılmıştır. Buradan hareketle modern hukuk sistemlerinde ortaya çıkan ilkelere göre Hanefî hukukçuların bu konudaki görüşleri tespit edilmeye çalışılmıştır."
