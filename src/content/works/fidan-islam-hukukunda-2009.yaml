abstract: "Savaş sonunda galip tarafın esir alması tarihi bir realite olarak önümüzde durması münasebetiyle, biz bu çalışmamızda bu tarihi gerçekliğin İslâm Hukukundaki tarihi gelişimi üzerinde durmaya çalıştık.Birinci bölümünde, giriş, esir kelimesinin lügat ve ıstılahi anlamı ve genel olarak kölelik hukuku üzerinde durulduİkinci bölümde, İslâm'dan önceki toplumlarda, özellikle Eski Yunanlılar ve Romalılar, İslâm öncesi Arapların esirlere yaptıkları muameleler ve İslâm öncesi ve sonrası Türklerin esirlere yaptığı muameleler anlatıldı.Üçüncü bölümde, genel olarak İslâm da esir hakkında bilgi verildikten sonra Hz. Muhammed (s.a.s) ve Hz. Ebû Bekir ile Hz. Ömer devrinde esirler, İslâm hukukuna göre esir alınması, esirlere uygulanacak hükümler, Müslüman, mürte, asi ve Ehli Kitap savaş esirlerinin hukuku üzerinde duruldu. ."
