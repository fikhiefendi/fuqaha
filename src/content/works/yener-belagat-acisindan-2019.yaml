abstract: "Mahmûd b. Ahmed Bedruddîn Aynî 1360 tarihinde eski adı Ayıntâb olan bugünkü adı Gaziantep şehrinde doğdu. Doğduğu yere nisbetle Aynî lakabıyla tanınmıştır. Küçük yaşlarda eğitim ve öğretime başlamış, farklı bölgelere ilmî seyahatler yapmıştır. Kudüs'te tanıştığı hocası Seyrâmî ile Kahire'ye gitmiş ve orada tasavvufa intisap etmiştir. Daha sonra tamamen yerleştiği Kahire'de dönemin önemli hocalarından ilim tahsiline devam etmiş; tarih, hadis, Arap dili belâgatı, fıkıh gibi alanlarda söz sahibi olmuştur. Yaşadığı Memlukler döneminde devletin çeşitli kademelerinde idarî, siyasî ve ilmî görevlerde bulunmuştur. Bunların içinde Kahire muhtesipliği, evkaf nazırlığı ve çeşitli medreselerde yürüttüğü müderrislik görevleri önemli bir yer tutar. Aynî, Umdetu'l-Kârî'yi 1417 yılında yazmaya başlamış, 1443 yılında bitirmiştir. Eserinde pek çok kaynaktan istifade etmiştir. Söz konusu kaynakların veya müelliflerinin isimlerini çoğunlukla belirtmiş, bazen de isim vermeden nakillerde bulunmuştur. Sahîh-i Buhârî'nin şerhleri arasında önemli bir yere sahip olan bu eser lügat, sarf, nahiv, belâgat, fıkıh, ricâl bilgisi gibi konular açısından da oldukça zengindir. Aynî, Hz. Peygamber'in hadislerinin Arapça olmasından ötürü bu dile bütün yönleri ile vakıf olmayanın hadis ilminden uzak olduğunu düşünmektedir. Bu nedenle o, eserinde hadisleri her yönüyle incelemeye tabi tutmuştur. Şerhinde aklî ve naklî metodu dengelemeye çalışmış, mukaddimesinde belirlediği şerh yöntemini eserin tamamında takip etmiştir. İlmi üslûbu gereği konuları bölümlere ayırmış, kolay anlaşılması için sayılara başvurmuş, sade ve akıcı bir dil kullanmıştır. Edebi üslubu gereği teşbih, istiare, şiir ve tekrarlara başvurmuştur. Böylece Umdetu'l-Kârî, ifadesinin güzelliği, ricale dair verdiği bilgiler, hadislerin fıkhî ahkâm açısından değerlendirilmesi gibi özellikleri ile diğer şerhlerden üstün kabul edilmiştir."
