abstract: "XVII. yüzyıl âlimlerinden Aydın müftüsü Hacı Emîrzâde fıkıh, kelam, tefsir, hadis gibi pek çok alanda risaleler kaleme almıştır. Bilhassa fıkha dair risaleleri yaşadığı dönemin sorunlarını ve kendisinin fıkhî bilgisini yansıtmaktadır. Hacı Emîrzâde müftülük görevi sebebiyle kendisine yöneltilen sorulara verdiği cevapların bir kısmını kaleme aldığı risalelerinde kalıcı hale getirmiştir. Konuları ele alırken Hanefî mezhebinin belli başlı kaynaklarına müracaat etmiş, görüş ve delilleri tartışmış, görüşler arasında tercihlerde bulunmuş ve gerektiğinde kendi kanaatini belirtmiştir. Bu çalışma ile Osmanlı taşrasında yetişmiş sayısız âlimden birinin ilim ve kültür mirasımıza katkısının gün ışığına çıkarılması amaçlanmıştır."
