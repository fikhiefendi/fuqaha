abstract: "Bu çalışma, İslami vakıf amaçlarını İslami finansman mekanizmalarıyla birleştiren modern bir araç olarak vakıf sukukunu inceleyip, dayandığı hukuki temelleri ve İslami hukukta vakıf kurallarına ne ölçüde uyduğunu açıklamaya çalışmaktaktadır. Bunun yanında, bu araçların çağdaş sosyal ve ekonomik kalkınmayı desteklemedeki rolünü vurgulamayı amaçlamaktadır. Çalışmada, Endonezya'nın CWLS sukuk modeli değerlendirilip Malezya ve Birleşik Arap Emirlikleri'nin deneyimleriyle karşılaştırılması yoluyla, bu ülkelerdeki düzenleyici otoriteleri ve uygulama mekanizmalarını analiz eden karşılaştırmalı bir analitik yaklaşım benimsenmiştir. Çalışma neticesinde yasal temelde benzerlikler olduğu, ancak kurumsal ve düzenleyici otoriteler seviyesinde ise farklılıklar bulunduğu görülmüştür. Çalışma, vakıf sukuklarının vakfın rolünü güçlendirmek için umut verici bir araç olduğu, ancak toplumsal farkındalık, mevzuat ve yönetişim ile ilgili zorluklarla karşı karşıya olduğu sonucuna da varmıştır. Araştırma, bu aracın sürdürülebilir kalkınmaya etkili bir şekilde katkıda bulunabilmesi için yasal ve kurumsal ortamın geliştirilmesi noktasında birtakım alternatifler önermektedir."
