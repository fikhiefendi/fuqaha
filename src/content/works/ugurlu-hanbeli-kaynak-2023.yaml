abstract: "“Hanbelî Kaynak Metinlerde Zayıf Hadis Algısı”adlı çalışmamızda Hanbelî Mezhebi âlimlerinin zayıf hadise yaklaşımını özellikle hadis usûlü ve mezhebin fıkıh usûlü kitaplarından ilk kaynaklar arasında sayılan bazı eserlerden tespit etmeye gayret edildi. Çalışmamız giriş ve üç bölümden oluşmaktadır: Giriş bölümünde, araştırmanın konusu, amacı, metodu ve kaynakları hakkında bilgiler yer almaktadır. Birinci bölümde mezhebin imamı Ahmed b. Hanbel'in şahsiyeti ve ilmi kişiliği ile ilgili bilgiler aktarılmaktadır. Daha sonra mezhebin imamı üzerinde oldukça yıpratıcı etki bırakan mihne olgusu kısaca ele alınmıştır. İkinci bölümde Hanbelî Mezhebi ile ilgili bazı mülahazalarla birlikte temel eserleri tanıtıldı. Ayrıca Hanbelî Mezhebine ait temel metinlerden hareketle Mesâil ve fıkıh usulü alanında gerekli istifadelerde bulunulmuştur. Üçüncü bölümde; Hanbelî düşüncesinde zayıf hadis algısı üzerinde duruldu. Bunu yaparken de mezhebin birincil kaynak eserlerinden faydalanmaya gayret edildi. Son olarak ise zayıf hadisle amel meselesi ele alınmıştır."
