abstract: "ÖZET ALİ KÜÇÜK'ÜN BESÂİRU'L KUR'ÂN ADLI TEFSİRİ VE AHKÂM ÂYETLERİNE YAKLAŞIMI KAYA, Yakup Yüksek Lisans, Temel İslam Bilimleri Ana Bilim Dalı Danışman: Doç. Dr. Mehmet BAĞIŞ Ağustos 2024, 104 Sayfa Tarih boyunca birçok tefsir telif edilmiştir. Başta rivayet ve dirayet tefsir yöntemiyle yazılan bu tefsirlerin kimisi sadece Kur'ân'ın tüm âyetleri, kimisi de ahkâm âyetleri gibi belli konular ele alınarak yapılmıştır. Kur'ân'ı tefsir eden eserlerden biri de Ali Küçük'ün yazmış olduğu Besâiru'l-Kur'ân adlı eserdir. Bu çalışmada öncelikle Ali Küçük'ün hayatı, sonrasında Besâiru'l-Kur'ân adlı tefsirin telif şekli, içeriği, ahkâm âyetlerine yaklaşımı, tefsir bakış açısı ve âyetleri açıklama yöntemi ele alınmış, ardından ahkâm âyetlerinin açıklanmasında mezheplere yaklaşımı incelenmiştir. Ali Küçük, ahkâm âyetlerini tefsir ederken mezheplerden birinin görüşünü tercih etmiş bunu gerekçeleriyle izah etmiştir. Bazen de hiçbir mezhebin görüşünü tercih etmeden kendi görüşünü açıklamıştır. Yine kimi zaman ihtilaflı herhangi bir konuda, konunun detaylarına girmeden fıkhî kitaplara yönlendirmiştir. Müfessir fıkhî konularda açıklama yaparken genel olarak ihtilaflardan kaçındığı görülmektedir. Müellif ayrıca, Kur'ân'a yaklaşım ve ondan nasıl istifade edilebileceğine dair şartları; onun yavaş okunması, gece okuma alışkanlığı ve tefekkür gibi başlıklar altında ele almıştır. Araştırılan konular belirli kategoriler altında toplanmış ve bu bağlamda müellifin düşünce yapısı ve yorumları ortaya konulmuştur. Besâiru'l-Kur'ân tefsirinde, âyetlerin mesajlarına odaklanılmış ve uzun tartışmalara yer verilmemiştir. Tefsirde klasik ve yeni bilgiler harmanlanarak herkesin okuyup istifade edebileceği yalın bir üslup tercih edilmiştir. Ali Küçük, tefsirinde kendi bakış açısıyla sınırlı kalmayıp önceki İslam âlimlerinin ve fakihlerinin birikimlerinden faydalanarak geniş bir perspektif sunmaya çalışmıştır."
