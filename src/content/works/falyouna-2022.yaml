abstract: "İlk Hanefi Usülcülerinin eserlerinde makâsıd konusu ile ilgili fikirler yer almaktadır. Ancak bu konudaki yazılar. Bildiğimiz makasıd kavramından daha farklı ifadelerle ele alınmıştır. Bu tezimizde makasıd kavramının manasını ve fıkıh usulü ile irtibatını bu kavramın köklerini, tarihi gelişimini, Hz. Peygamber döneminden başlayarak Raşid Halifeler ile dört fıkıh mezhebin kaynaklarına kadar dayandığı belirtilmiştir. Buradan hareketle Hanefi Mezhebinin ilk usül kaynaklarında makasıd anlayışı ile ilgili fikir ve düşüncelerin tespiti hususunda ilmi bir çalışma ortaya konmaya çalışılmıştır. Dört büyük mezhebin ilki Hanifi mezhebinin müntesibi olan Cessas, Debusi, Serahsi ve Pezedvi gibi usül alimlerinin telif ettikleri usül eserleri esas alınarak Hanefi Mezhebinin makasıd anlayışını ilim dünyasına sunmayı hedefledik. Bu çalışma yapılarak Hanefi Mezhebinin makasıd tasavvuru usül bağlamında ortaya çıkarmaya çalışılmıştır. Başka Maliki Mezhebi fakihleri olmak üzere Şafii ve Hanabeli Usülcüleri, makâsıd kavramını Zarûriyyât, Hâciyyât ve Tahsîniyyât şeklinde detaylandırarak İslamın başta İman olmak üzere Dinin, canın, aklın, neslin ve malın korunmasını esas alan bu beş hedefi gerçekleştirmeyi amaçladığı vurgulamışlardır. Ardından bu mevzu hakkında çeşiti örnekler vermişlerdir. Ayrıca usülcüler, bazı fıkhi meselelerinin çözümünde mubah alanlarda eylemlerin yapılmasına müsaade edilmesinin \"menfaatlerin celbi ve zararların defi\" anlayışına dayandığını bildirmişlerdir. Aynı zamanda bu tez çalışması, akli kanıtlar ve makâsıd ile bazı fıkhi hükümleri belirleyerek, makâsıd yöntemi ile bazı meseleleri netleştirip bazısıyla da eşitleyerek makâsıd anlayışının Hanefi Mezhebinde bazı hususlara ışık tuttuğu ortaya konmuştur. Ayrıca bu tezle Hanefi Usulündeki lafızların delaletleri ile makasıd anlayışını da ele alarak konu ile ilgili hususlar işlenmiştir. Üçüncü kısımda müşterek lafızla ilgili makâsıd fikri üzerinde durulmuş ve dördüncü kısımda ise emir ve nehiydeki makâsıd anlayışı ve onun kapsamına giren ruhsat, azimet ve nesihle ilgili hususlar ele alınmıştır."
