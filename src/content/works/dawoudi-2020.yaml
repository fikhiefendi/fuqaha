abstract: "Yargı yoluyla gerçekleşen boşamalar, -özellikle günümüzde- üzerinde durulması gereken bir konudur. Çünkü evlilik hayatının istikrarı, İslam'ın üzerinde durduğu önemli gayelerdendir. Zira aile, toplumun inşası ve devamı için temel bir unsurdur. Evlilik ise doğurma, çoğalma ve aile hayatının oluşturulması ve sürdürülmesi için çok önemli bir müessesedir. Öyle ki, İslam hukuku eşler arasındaki birlikteliği sürekli hale getirmek ve garanti altına almak için çok ince hükümler vaz etmiştir. Nikâh, aile hayatının sürekli olması üzerine ikame edilen bir akittir. İslam eşlere birbirlerine güzel muamelede bulunmayı emretmiş, erkeklere ve kadınlara hayrı tavsiye etmiştir. Kadına kocasının evini, malını ve çocuklarını gıyabında korumasını emretmiştir. Aile ile ilgili hükümlere baktığımızda bu hükümlerin, aile fertlerinin ihtiyaç duyacağı her şeyi kapsadığını görmekteyiz. Evliliğin sürdürülmesi bazen yarardan çok zararların ortaya çıkmasına neden olabilir. Malum olduğu üzere İslam dini insanın fıtrat ve tabiatına uygundur. Bundan dolayı İslam dini, eşler arasındaki ilişkinin sürdürülmesini zorlaştıracak geçimsizlik, tartışma ve nefret gibi durumları dikkate almıştır. Çalışmamıza bir önsöz ve girişle başladık. Araştırmayı beş bölüm ve bir sonuca ayırdık. Her bölüm birkaç meseleyi içermektedir. Giriş bölümünde konunun önemini birkaç noktada özetledik. Bu konuyu seçme nedenini belirtip, yargı yoluyla gerçekleşen boşama hakkında daha önce yapılan çalışmaları ortaya koyduk. Çalışmada takip edeceğimiz metot hakkında da bilgi verdik. Birinci bölümde yargı yoluyla boşamanın anlamı, meşruiyeti ve şartları üzerinde durduk. Daha sonra yargı yoluyla vuku bulan, talak, fesih ve infisah sözcükleri arasındaki ilişki üzerinde durduk. İkinci bölümde geçimsizlik, kadının nafakasını sağlamama gibi sebeplerle gerçekleşen boşamaları inceledik. Üçüncü bölümde kocanın hapsedilmesi veya fakir olmasından dolayı nafakayı sağlayamaması gibi gayri ihtiyari zararlar üzerinde durduk. Dördüncü bölümde her iki eş arasında boşamayı caiz kılan hastalık ve ayıplar konusuna değindik. Bu kapsamda boşamayı mubah kılan ayıpların şartları ve fakihlerin konu hakkındaki görüşlerini ele aldık. Beşinci bölümde ise eşlerden birinin dinden dönmesi veya Müslüman olmasından dolayı gerçekleşen boşamayı ve irtidâddan dolayı vuku bulan boşamanın çeşitlerini açıkladık. Her iv bölümün sonunda konuyla alakalı Irak Medeni Kanunu'nda bulunan maddeleri yazdık ve bunları İslam hukukunun konuyla ilgili hükümleriyle karşılaştırdık. Araştırmanın sonunda da araştırma sırasında edindiğimiz neticeleri sonuç kısmında belirttik. Bunun akabinde de araştırmamızda müracaat ettiğimiz kaynakları zikrettik. Bu alanda küçük bir çalışma ortaya koyduktan sonra bu çalışmanın kabul ve güzel bulunmasını ümit ediyoruz. Tabiki çalışmamız sırasında benden hiçbir yardımını esirgemeyen ve beni bu yolda doğruya ileten değerli danışman hocam Doç. Dr. Mehmet Selim ASLAN'a yardımlarından dolayı teşekkür ederim. Yine aynı şekilde yardımlarını benden esirgemeyen kıymetli hocam Heymen Balyesânî'ye de şükranlarımı bir borç bilirim. Aynı şekilde çalışmamız esnasında bana yardımları dokunan tüm hocalarıma teşekkür ederim"
