abstract: "Tanzimat Fermanı'nın 1839'da ilan edilmesi ile Osmanlı Devleti'nde birçok alanda yeni düzenlemeler yapılmıştır. Hukuk ve eğitim bu alanların başında gelmektedir. Eski hukuk sisteminin devamı ile birlikte, yeni kanunlaştırma hareketleri başlamış ve batıdaki örneklerine benzeyen Nizamiye Mahkemeleri kurulmuştur. Hem şeri mahkemelerde görev yapan kadıların daha iyi ve standart bir eğitim almalarını sağlamak, hem de nizamiye mahkemelerinde çalışacak, şeri hukukla birlikte hukuk bilgisine ve mevzuattaki kanunlara vakıf kadılar yetiştirmek amacıyla İstanbul'da kadılara özel bir ihtisas okulu kurulmasına karar verilmiştir. 1855 yılında bu amaçla Muallimhâne-i Nüvvâb kurulmuş, okul 1885'de Mekteb-i Nüvvâb'a, 1908'de Mekteb-i Kudât'a ve nihayet 1909'da da son ve en meşhur hali olan Medresetü'l-Kudat'a dönüşmüş, okulun eğitim sistemi de yaklaşık yetmiş yılı bulan bu süre boyunca değişip, yetkinleşmiştir. Okulun eğitiminde fıkıh ilmi hep ön planda tutulmuş, gerek okula giriş, gerek sınıf geçme ve gerek mezuniyet imtihanlarında başarılı olmanın en önemli şartı fıkıh derslerinde başarılı olmak olarak belirlenmiştir. Bununla birlikte bir çok hukuk dersleri ile çeşitli yazı ve uygulama dersleri de okul müfredatında yer almıştır. Medresetü'l-Kudât kuruluşundan itibaren binden fazla mezun vermiş, bunlar Osmanlı Devleti'nin dört bir tarafında görev almış ve aralarından birçok önemli kişiler yetişmiştir. Osmanlı Devleti'nin bu ilk ve tek kadı okulu 1924'de medreselerin kapatılması ile birlikte kapatılmıştır."
