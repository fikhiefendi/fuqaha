abstract: "17. Yüzyıl Balıkesir Şer'iye Sicillerine göre kadınlar, tıpkı erkekler gibi bizzat veya vekilleri aracılığıyla mahkemeye müracaat edebiliyor, şikayette bulunabiliyor ve hakkını arayabiliyordu. Kadınlar boşanma, malî veya adlî konularda“davacı”oluyor ve hatta kocalarını, anne-babalarını, çocuklarını ve diğer akrabalarını dahi dava edebiliyorlardı. Mahallî mahkemede hakkını alamayınca üst mahkemeye (Divân-ı Hümâyûn) müracaat etmekten çekinmiyorlardı. Kadınlar mahkemeye sadece davacı olmak için değil, alım-satım veya hibe işlemlerini tescil ettirmek için de gidiyordu. Yıllardır kayıp olan kocasının öldüğünü tespit ettirip yeniden evlenebilme imkanı buluyordu. Her tür işlem için kendisine vekil tayin ediyor veya kendisi çocuğu için vasi veya veli tayin edebiliyordu. Bu işlemleri sicillere kaydettiriyordu, Kocalarından, babalarından veya erkek kardeşlerinden bağımsız olarak mülk sahibi olabilen kadınlar onları dilediği gibi satabiliyor, köle- cariye satın alabiliyordu. Miras, mihr, vakıf görevi, kira gibi yollarla kendisine gelir sağlıyor, az da olsa bazı iş kollarında çalışıyordu. Onlar ekonomiye“alıcı”dan çok“satıcı”olarak katkıda bulunuyorlardı. Ailede önemli bir yeri bulunan kadın genellikle ev işleriyle uğraşıyor. Aile dışındaki sosyal ve iktisadî faaliyetlere erkekler kadar katılmıyorlardı. Hayır kurumlarına bağışta bulunan kadınlar, sevap kazanmak için çoğu kez köle ve cariyeleri azat ediyorlardı. Gayr-ı müslim kadınlar da temel hak ve hürriyetler açısından diğerlerinden farklı değildi. Cariyeler ise, hür kadınlar kadar haklara sahip olmasalar da sonunda çoğunun hürriyetine kavuştuğu görülüyor."
