abstract: "Afganistan topraklarına İslâm'ın girmesiyle birlikte geleneksel hukuk ve İslâm öncesi bölgede hâkim dinlerin yerini İslâm dini ve İslâm hukuku almıştır. O günden itibaren halk arasındaki anlaşmazlıkların çözülmesi için genelde İslâm hukuku, özelde ise Hanefi mezhebine göre hareket edilmiştir. Diğer İslâm ülkelerinde olduğu gibi Afganistan'da da ilk dönemlerde müftüler ve kadılara müracaat edilerek hukuki ve adli sorunlar halledilmeye çalışılmıştır. Medeni hukukla ilgili Afganistan'ın farklı dönemlerinde, devrin hâkimleri tarafından gerek nizamnâme, gerek usulnâme adında bazen de şah fermanları gibi çeşitli isimlerde yasalar çıkartılmıştır. Emîr Abdurahman Han (1880-1901) devrinde Esâsü'l-Kudât'la başlayan Medeni Kanun şeklindeki yasa çıkarma geleneği, Emânullah Han (1919-1929) devrinde biraz daha geliştirilmiş, hem Medeni Kanun hem Ceza Kanunu ahkâmını içeren Temessüku'l-Kudâti'l-Emâniyye isminde bir nizamnâme, Hanefi mezhebi esas alınarak hazırlanmıştır. Afganistan tarihinde ilk defa 1977 yılında geniş kapsamlı bir Medeni Kanun hazırlanıp yürürlüğe girmiştir. Muhammed Zahir Şah (1933-1973) döneminde taslağı hazırlanan ve Davud Han (1973-1978) iktidarının son dönemlerinde incelendikten sonra yürürlüğe konulan bu kanun, zaman içinde bazı değişikliklere uğramakla beraber, Kanun-ı Medeni Afganistan adı altında halen yürürlüktedir. Bu çalışmanın temel hedefi söz konusu Afganistan Medeni Kanunu'nun ikinci babından itibaren başlayıp 133 maddeyi kapsayan Kitâbü'l- İcârat kısmının (1322-1455 md.) kaynaklarını tespit etmeye yöneliktir. Bunun yanı sıra ilk bölümde Osmanlı hukuku ve Mecelle'ye dair genel bilgi verilmiştir. Afganistan'da kanunlaştırma faaliyetleri, Afganistan Medeni Kanunu'nun tarihçesi ve muhtevasından da kısaca bahsedilmektedir."
