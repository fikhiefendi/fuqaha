abstract: "düzen lgmel ere katılan ve iç hukuklarında bu şekilde düzenleme yapan ülkeler ile, diğerleri arasında uygulama farklılıkları doğmuştur. Bu farklı uygulama nedeniyle, donatan veya gemi işletme müteahhidi durumunda olmayan ve bu nedenle de, bu ülkelerin hukuklarına göre sınırlı sorumluluğu tanınmayan alt taşıyanların <çarterer' lerin) bu sınırlı sorumluluktan fiilen yararlanmasını sağlamak için“taşıyanın kimliği”“Identity of carrier”klozu kullanılmıştır. Klozun geçerliği konusunda, çeşitli hukuk sistemlerinde, tartışmaların hala sürmekte olduğu gözlenmektedir. Amerikan Yargı Kararlarında, bunun, sorumluluktan kurtulmayı amaçlayan bir kloz olarak yorumlanabilmesi hal inde, geçersiz olacağına karar verildiği, bazı Kanada Yargı Kararlarının da bu görüşü takip ettiği anlaşılmaktadır. Türk Hukuku açısından, konişmentoya bu klozu koyan taşıyanın, bu konuda donatan tarafından yetkili kılınması ve konişmentonun da kimin adına tanzim edildiğinin mücerret konişmento içeriğinden anlaşılması ve yükle ilgililerin durumunun daha kötü bir duruma düşürülmemesi gibi, gerekleri yerine getiren, bir“Identity of carrier”klozunun, geçeri i olacağı ve emredici kurallara aykırı olmayacağı kanaatine varılmaktadır. Üst taşıyanın alt taşıtana karşı ileri sürebileceği haklar ve alt taşıtanın üst taşıyana karşı sorumlu tutulabileceği hallerle ilgili olarak, Türk Hukukunda, konuya donatanın kanuni rehin hakkı açısından bakılmaktadır. Bu hakkın doğumu için, yükün maliki ile navlun ve bağlılarının borçlusunun aynı şahıs olması bir şart değildir. Üst taşıyan konumundaki donatanın, üst taşıtandan olan alacaklarından dolayı, kendisine borçlu bulunmayan alt taşıtan veya başka birine ait yük üzerinde de rehin hakkı mevcuttur. Bunun için de taşıyanın TTK 1069/f.l kapsamında bir alacağının mevcut olması, taşıyanın yüke ziliyet bulunması ve yükün yükletenin mülkiyetinde veya taşıyan ziliyetliği elde ettiği anda yükletenin malik veya tasarrufa yetkili olduğu hususunda iyi niyet sahibi olması gibi şartların mevcudiyeti yeterli bulunmaktadır. Bu konuda, yabancı hukuklarda farklı sonuçlara varıldığı görülmektedir. Rehin hakkı konusunda Amerikan Hukukunda“action in rem”davası söz konusu olurken, İngiliz Hukukunda bunun akdi rehin hakkı olarak nitelendirildiği ve yorumun da buna göre yapıldığı anlaşılmaktadır. Alt taşımada düzenlenen konişmentoda açıkça veya atıfta bulunmak sureti ile üst navlun sözleşmesindeki“lien”klozunun yer alması halinde, üst taşıyanın yük üzerinde, bu yükün sahibi üst taşıtan olsun olmasın, akdi rehin hakkının doğduğu görülmektedir.Bu konuda, kanaatimizce, üst taşıyanların bu haklarını güvenceye almak üzere, uluslararası taşımalarla ilgili alt navlun sözleşmelerinde düzenlenen konişmentolara,üst taşıyan donatanın rehin hakkının mevcut olacağına ve bu hakkın yük kime ait olursa olsun doğacağına, bunun alt ve daha alt navlunları da kapsayacağına ilişkin hükümler konması veya üst navlun sözleşmelerinde bu yolda yer alacak hükümlere atıf yapılmasının sağlanması gerekli görülmektedir. Ayrıca,üst navlun sözleşmesi ile üst taşıtan/alt taşıyana verilecek yetkilerde, bu hususun açıkça belirtilmesinin de, bu konuda ileride doğabilecek hukuki sorunların çözümünde yararlı olacağı düşünülmektedir. Kanaatimizce, ülkemiz acısından, konu ile ilgili tartışmaların, (bir bölümünün de olsa) sona erdirilebilmesini teminen İ9?6 Londra sözleşmesinin Türkiye'de yürürlüğünün sağlanması veya bu mümkün görülemediği taktirde, inceleme konumuz ile ilgili olarak bu sözleşmede yer alan hüküm paralelinde iç hukukumuzda yeni düzenlemelerin bir an önce yapılması, gerekmektedir.düzen lgmel ere katılan ve iç hukuklarında bu şekilde düzenleme yapan ülkeler ile, diğerleri arasında uygulama farklılıkları doğmuştur. Bu farklı uygulama nedeniyle, donatan veya gemi işletme müteahhidi durumunda olmayan ve bu nedenle de, bu ülkelerin hukuklarına göre sınırlı sorumluluğu tanınmayan alt taşıyanların <çarterer' lerin) bu sınırlı sorumluluktan fiilen yararlanmasını sağlamak için“taşıyan