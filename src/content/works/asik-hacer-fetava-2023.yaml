abstract: "Bu çalışma İbn Hacer'in el-Fetâvâ el-Kübrâ isimli eserinden yola çıkarak müetahhirûn dönem Şâfiî fakihleri arasında tartışılan birtakım meselelerin tahlilini, el-Fetâvâ'ya kaynaklık eden Şâfiî fakihlerinin ve eserlerinin tespitini konu edinmektedir. Eserden seçilen meseleler tahlil edilirken, İbn Hacer'in fetvâlara yanıt verirken fetvânın hükmüne kaynaklık eden isimlere ve eserlere atıfta bulunduğu gibi mesele hakkında bir şekilde görüşü bulunan diğer alimlere de atıf yaptığı tespit edilmiştir. İbn Hacer atıfta bulunduğu görüşleri, bizzat sahiplerinin ağzından veya metinler üzerinden aktarırken kimi meselelerde atıfta bulunduğu isim ve eserleri kendi şerhleri üzerinden nakletmektedir. Meseleler tahlil edilirken ibadet ve muamelata ilişkin fetvâlar ile eserin yazıldığı dönemin ayırıcı özelliklerini yansıtan vakıf, bid'at ve ilmi yaşantıya dair fetvâlar incelenmiştir. İbn Hacer'in fetvâ verirken meseleye yaklaşım tarzı ve metin üslûbunun, atıfta bulunduğu ve kaynak olarak kullandığı diğer fetvâ eserlerinden farklılık arz ettiği tespit edilmiştir. İbn Hacer'in eser boyunca yaptığı atıflar Şâfiî mezhebinin kurucu imamı İmam Şâfiî'den (ö. 204/820) başlayarak hocası Şehâbeddîn er-Remlî'ye (ö. 957/1550) kadar uzanmaktadır. Yapılan birçok isim atfında atıfta bulunulan âlimin sadece konu ile ilgili görüşlerinin zikredilmesi ile yetinilmiş, çok az ismin görüşü fetvâların hükmüne kaynaklık etmiştir. İbn Hacer'in fetvâların tümünde en çok atıf yapıp esas aldığı ismin Nevevî ve eseri el-Mecmû' olduğu tespit edilmiştir. el-Fetâvâ'da ağırlıklı olarak müteahhirûn ulemaya ve eserlerine atıfta bulunulmaktadır. Atıfta bulunulan eserlerin sayıca çoğunluğunu şerh ve haşiye türünden eserler oluşturmaktadır. Bunun yanında müteahhirûn dönemden önce atıfta bulunulan isim ve eserler ise göz ardı edilmeyecek sayıdadır. Bu bağlamda el-Fetâvâ, Nevevî ve Rafiî öncesi eserlerin müteahhirûn döneme ne ölçüde kaynaklık ettiği hususunda bizlere rehberlik etmektedir."
