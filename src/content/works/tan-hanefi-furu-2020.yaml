abstract: "Benc, afyon ve haşiş, kullanımları çok eski tarihlere uzanan uyuşturucu özelliğe sahip bitkilerdir. Bu bitkiler, günümüzde olduğu gibi daha önceki dönemlerde de tedavi amaçlı kullanımları yanı sıra kötü amaçlara alet edilerek kullanılıp suiistimal edilmiştir. İnsanlar tarafından sarhoş olmak, istemedikleri düşüncelerden uzaklaşmak, acıyı azaltmak, farklı âlemlere gitmek, dindarlığını arttırmak gibi çok çeşitli sebeplerle kullanılagelen bu maddelerin suiistimalinin Müslüman coğrafyada yaygın bir hal alışı hicrî altıncı yüzyıl civarına tekabül eder. Bu maddelerin suiistimalinin topluma zarar verici bir hal alması gibi çeşitli sebepler fukahânın meseleyi ferdî kullanımdan ziyade toplumsal neticelerini de dikkate alarak yeniden hükümlendirmelerine sebep olmuştur. Hanefî fakihlerin bu mesele hakkındaki tavırları belirli bir noktada karar ettikten sonra Osmanlı şeyhülislamlarından İbn Kemal, vermiş olduğu birtakım fetvalar sebebiyle bu maddeler etrafında bir tartışmanın fitilini ateşlemiştir. Tespit edilebildiği kadarıyla İstanbul ve çevresi dışında çok fazla akis bulmayan bu tartışma Ebussuud'un doğrudan İbn Kemal'i hedef alan fetvalarıyla sona ermiş gözükmektedir. Söz konusu süreçte kimi âlimler bu maddelerin hükümlerini konu alan müstakil risaleler kaleme almıştır. Bu çalışmada, fakihlerin bu maddeler hakkında takındıkları fıkhî tavır, hicrî on birinci yüzyılın başına kadarki Hanefî mezhebi furû fıkıh metinleri ve bu konudaki müstakil risaleler üzerinden incelenmeye çalışılmıştır."
