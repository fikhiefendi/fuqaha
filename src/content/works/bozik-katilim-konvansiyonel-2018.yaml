abstract: "Sanayi Devrimi sonrası türetilen iktisadi büyüme kavramı özellikle Türkiye gibi gelişmekte olan ülkelerin iktisadi kalkınması için son derece önemlidir. Gelişmekte olan ülkeler için kurumların, özgürlük ve hukuk düzenlerinin gelişme aşamasında olması iktisadi büyüme gibi pek çok alanla doğrudan etki temasına sahip bir kavramı daha da önemli hale getirmiştir. İktisadi büyüme olgusuna Türkiye özelinden bakılan bu çalışmada bankacılık kurumu ve iktisadi büyüme incelenmiş, katılım bankaları ve konvansiyonel bankalar olmak üzere daha spesifik bir açıdan yaklaşılmıştır. 2006 – 2017 yılları arası çeyrek dönemlik veriler kullanılarak iktisadi büyümeyi temsilen Gayrı Safi Yurtiçi Hasıla verileri ile bankaların finansal sisteme olan etkilerini ölçmek için konvansiyonel ve katılım bankalarının kredi hacim verileri kullanılmıştır. Adf birim kök testi ile durağanlıkları sınanan serilerin Zivot – Andrews testi ile yapısal kırılma noktaları belirlenmiştir. Johansen eşbütünleşme testi uygulanan değişkenler arasında uzun dönemde eşbütünleşme ilişkisine dair izlere rastlanmamıştır. Granger nedensellik testi ile nedensellik ilişkileri test edilen değişkenlerin aralarında uzun dönemde hem tek yönlü hem de iki yönlü nedensellik ilişkisine rastlanmamıştır."
