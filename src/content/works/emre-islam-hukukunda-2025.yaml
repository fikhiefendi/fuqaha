abstract: "İslâm hukukunda boşanma, aile kurumunda ortaya çıkan sorunların çözüm yollarının sonuncusu olarak kabul edilen sosyal bir olgudur. Bu tabii yaklaşım ilgili naslar incelendiğinde açıkça görülmektedir. Zira İslâm ilke olarak aile kurumunun istikrarını esas almış, bu amaç doğrultusunda boşanmaya karşı aileyi koruyucu tedbirler geliştirmiştir. Boşanma ise yalnızca zaruri durumlarda başvurulması gereken bir çözüm olarak değerlendirilmiştir. Günümüzde boşanmanın olumsuz etkileri yalnızca karı koca arasındaki ilişkiyle sınırlı kalmayıp geniş aile çevresine ve toplumsal yapıya da yansımaktadır. Sosyal ilişkiler bağlamında her tasarrufun olduğu gibi boşanmanın da naslarda belirtildiği üzere bir usulü ve ahlaki çerçevesi bulunmaktadır. Kur'ân ve sünnet bu konuda açık hükümler ortaya koymuş olsa da günümüzde bireyler arasında boşanma süreci ve sonrasında doğan hükümlere dair bilgi eksikliği ve kargaşa oldukça fazladır. Bu nedenle boşanmanın bireylere ve topluma verdiği zararların endişesi yerine hakların muhafazasını destekleyen Kur'ân ayetlerinin aşılamış olduğu bilinç düzeyinin artırılması gerekmektedir. Bu bilincin yerleşmesi hâlinde boşanma süreci, aile ve toplum açısından huzur ve güveni temin eden bir işlev üstlenebilir. Bu bağlamda Kur'ân ve sünnetin öngörmüş olduğu aile kurumunu koruyucu tedbirler ve boşanma olgusu, çalışmamızın temel konusunu oluşturmaktadır. Çalışmada aile birliğinin devamlılığını sağlamak adına nasların sunduğu tedbirler incelenmiş, zorunlu hâllerde boşanmanın Kur'ân ve sünnetin belirlediği usul ve ahlaki ilkeler çerçevesinde gerçekleştirilmesi gerektiği vurgulanmıştır. Ayrıca İslâm hukuk literatüründe yer alan talâk çeşitleri başlıklar hâlinde ele alınmış, klasik ve modern döneme ait görüş ve yaklaşımlara da yer verilmiştir. Nitekim İslâm'ın aileyi korumak adına almış olduğu tedbirlerin ve boşanma usulünün detaylı biçimde bilinmesi, sağlıklı bir aile yapısının ve güçlü bir toplumun inşası açısından büyük önem arz etmektedir."
