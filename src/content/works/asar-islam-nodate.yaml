abstract: "Ticari hayattaki problemlerden biri haksız rekabettir. Pozitif hukukta rakip, tedarikçi ve müşteri ilişkilerini etkileyecek olan her türlü aldatıcı ve dürüstlük kuralına aykırı ticari uygulama ve davranış haksız rekabet olarak görülmektedir. İslam hukukunda da ticari hayatı olumsuz etkileyecek olan haksız uygulamalar hoş karşılanmamaktadır. Klasik dönem fıkıh kaynaklarında haksız rekabet konusu müstakil bir başlık altında ele alınmamışsa da pozitif hukukta yer alan kötüleme, gizleme, karaborsacılık, iltibas vb. haksız rekabet çeşitleri muhtevaları itibariyle İslam hukuku açısından da suç olarak kabul edilmiştir. Bu çalışmada ticari hayatta rekabet, rekabet hakkı ve korunması, haksız rekabetin tarihsel süreci hem pozitif hem de İslam hukuku açısından ele alınmıştır. Haksız rekabet suçunun unsurları; kanuni unsur, maddi unsur, manevi unsur ve hukuka aykırılık olup haksız rekabet çeşitleri; kötüleme, gizleme, gerçekdışı ve yanıltıcı açıklamalarda bulunma, karaborsacılık, fiyat kızıştırma, yıkıcı fiyatlandırma, iltibas, aldatıcı ve karşılaştırmalı reklamlar, üretim ve iş sırlarının ele geçirilmesi, müşterileri başkalarıyla yaptıkları sözleşmelere aykırı davranmaya yöneltmek ve ithalatta haksız rekabet yapmak şeklinde sıralanmaktadır. Haksız rekabetin söz konusu unsurları ve çeşitleri gerek pozitif hukuk gerekse İslam hukuku açısından karşılaştırmalı olarak işlenmiştir. Haksız rekabeti önlemeye yönelik kurumlar tarihten günümüze; hisbe, lonca, zabıta teşkilatları ile esnaf ve sanatkâr odaları, borsa birlikleri ve rekabet kurulu şeklindedir. Pozitif hukukta ve İslam hukukunda haksız rekabet mağduruna dava açma ve tazminat isteme hakkı tanınmış olup söz konusu suçun cezası olarak hapis, adli para, faaliyet izninin iptali ya da müsadere ön görülmüştür."
