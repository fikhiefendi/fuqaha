abstract: "Çalışmada Salih Akdemir tarafından hazırlanan Son Çağrı Kur'an adlı çalışma, çeviri teknikleri ve çeviribilim yaklaşımları açısından incelenmiştir. Çalışmanın amacı, söz konusu çevirinin Kur'ân çevirisi literatürü içerisindeki yerini belirlemek, benimsenen metodolojik çerçeveyi ortaya koymak ve kullanılan çeviri stratejilerini değerlendirmek olarak belirlenmiştir. Araştırmada nitel araştırma yöntemi benimsenmiş; sûre sırasına göre ilerlemek yerine belirli temalar ve kavramsal alanlar çerçevesinde metin incelemesine dayalı mukayeseli bir analiz gerçekleştirilmiştir. İnceleme sürecinde, belirlenen kavramlar ve âyetler; klasik tefsirler, çağdaş tefsir literatürü ve diğer Türkçe meâllerle karşılaştırmalı olarak ele alınmıştır. Yapılan inceleme sonucunda, müellifin Cumhuriyet dönemi meâllerinde yaygın olarak görülen lafzî çeviri anlayışından ziyade anlamı ve bağlamı merkeze alan bir yaklaşım benimsediği; modern çeviribilim kuramları ile eleştirel-felsefî hermenötik yaklaşımın birleştiği işlevselci bir zeminde hareket ettiği görülmüştür. Çeviri metodolojisinin oluşumunda çağdaş dilbilimsel ve işlevselci çeviri yaklaşımları önemli bir rol oynamıştır. Çeviriyi anlamın yeniden yorumlanmasını içeren ilmî bir süreç olarak gören müellif, geleneksel lafzî çeviri anlayışından uzaklaşarak anlam merkezli, bağlam duyarlı ve bütüncül bir yaklaşım benimsemiştir. Bu doğrultuda, nüzûl dönemi Arapçasını esas alarak artsüremli ve eşsüremli semantik çözümlemeler yapmış; kelimelerin kök anlamlarını belirlemek amacıyla klasik Arapça sözlüklerin yanı sıra Sâmî dil ailesine ait diğer dillerle karşılaştırmalı incelemeler yürütmüştür. Ayrıca, âyetlerin anlaşılmasında iç ve dış bağlamı gözeterek sûre bütünlüğünü ve vahiy sürecini dikkate alan bütüncül bir okuma önermiş; bu süreçte önceki vahiy metinlerinden de ihtiyatlı biçimde yararlanmıştır. Müellifin bütüncül ve semantik yaklaşıma rağmen, yapılan incelemelerde bazı âyetlerin çevirisinde yer yer lafzî aktarım anlayışına başvurulduğu, kırâat farklılıklarının, dilbilgisel unsurların ve söz sanatlarının çeviri sürecini zorlaştırdığı tespit edilmiştir. Özellikle eş anlamlı kelimelerin yanlış tercih edilmesi, bazı kavramların açıklayıcı dipnotlarla desteklenmeden literal verilmesi, deyimsel ifadelerin doğrudan aktarılması ve teşbîh, kinaye, müşâkele, iltifât gibi belâgat unsurlarının göz ardı edilmesi gibi durumların yer yer anlam daralmalarına, anlam kaymalarına, belirsizliklere veya bağlamdan kopuk yorumlara yol açabildiği iv görülmüştür. Bu durum, eserin her alanda aynı düzeyde isabetli bir anlam aktarımı sunamadığını ve kimi bölümlerinin eleştirel değerlendirmeye açık olduğunu göstermiştir. Neticede Son Çağrı Kur'an adlı meâl, yalnızca klasik meâl geleneğini tekrar eden bir çalışma olmayıp, semantik derinliği ve yöntem bilincini öne çıkaran metodolojik bir çeviri modeli sunmuştur. Çeviride lafzî sadakat ile anlam merkezli yorum arasında akademik bir denge kurmaya çalışan bu özgün eser, getirdiği alternatif bakış açısıyla literatürdeki önemli bir boşluğu doldurmuştur. Çalışma, Kur'ân çevirilerinde semantik analizin tek başına yeterli olmadığını; metnin tarihsel, teolojik ve sosyolojik boyutlarını da içeren çok disiplinli ve kapsamlı araştırmaların arttırılması gerektiğini ortaya koymuştur."
