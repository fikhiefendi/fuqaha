abstract: "İnsanlık, tarih boyunca salgın hastalık gibi birçok olağanüstü durumla karşı karşıya kalmış ve karşılaşılan bu olaylar büyük tahribatlara yol açmıştır. Bu afetler ekonomik, siyasi, sosyal vb. alanları etkilediği gibi dinî ve hukukî alanı da çok yakından etkilemiş ve ulemâyı birtakım tedbirlere ve hükümlere başvurmaya sevketmiştir. Günümüzde de Çin'in Vuhan eyaletinde ateş, öksürük vb. belirtilerle ortaya çıkan Koronavirüs (Covid-19) salgını ile birlikte geçmiş dönemlerde olduğu gibi yetkililer tarafından bir dizi önlem alınmış, din adamları ve fetva kurulları salgının ortaya çıkarmış olduğu birçok meseleyi dinî perspektiften ele alarak, Kur'an ve sünnet ışığında fetvalar vermişlerdir. Bu çalışmamızda öncelikle İslâm tarihinin ilk dönemleri ve Osmanlı döneminde ortaya çıkmış belli başlı salgın hastalıklara yer verilmiştir. Toplumu nasıl ve ne derecede etkilediği, dinî yönden salgın karşısında nasıl tavır takınıldığı ve ne tür hüküm ve içtihatlarda bulunulduğu, kaynaklara dayalı olarak, ibadet ve muâmelât özelinde ortaya konmaya çalışılmıştır. Son olarak karşılaştığımız ve birçok kişinin ölümüne sebep olan koronavirüs salgını sürecinde Fıkhın önemli bir bölümünü teşkil eden ibadet ve muâmelât alanın, bu durumdan ne derece etkilendiği ve hükümlerdeki değişim durumu ortaya konmuştur. Covid-19 salgını ile birlikte ortaya çıkan bazı meselelerde fetva ihtiyacı hâsıl olmuş, uluslararası alanda faaliyet gösteren fetva kurulları ve din adamları, virüsün yayılımını engellemek ve bulaşı önlemek için fetvalar yayımlamışlardır. Bununla birlikte fetva kurullarının ve din adamlarının bu konudaki görüşlerine yer verilerek, topluma yön veren fıkhın bu salgın karşısında nasıl rol oynadığı ve tavır aldığı, ibadet ve muâmelât konuları ekseninde aktarılmış, çıkarımlarda bulunularak, ortaya çıkan sorunlara çözüm önerileri sunulmuştur."
