abstract: "Nikâhta velayetle ilgili rivayetler ve değeri'ni çalışmamıza konu edinmiş bulunmaktayız. Nikâhta velayetle ilgili rivayetlerin lâfız farklılıklarıyla birlikte Ebû Musa, Hz. Aişe, İbn Abbas, İbn Ömer, İmran b. Husayn, Abdullah b. Mesud, Ebû Hureyre, Ebû Umâme, Cabir b. Abdullah, Semüre İbn Cündeb, Berâ b. Âzib ve Hz. Ali'den nakledildiğini tespit ettik. Buna rağmen gerek geçmişte gerekse günümüzde bazı ilim adamları konuyla ilgili rivayetlerin sıhhatine itiraz etmişlerdir. Buna binaen kısa bir giriş ve iki bölümden oluşan bir çalışma hazırladık. Birinci bölümde `kavramsal çerçeve' genel başlığı altında; velayetin tanımı, çeşitleri, şartları ve değer kavramı üzerinde durulmuştur. İkinci bölümde; `konuyla ilgili rivayetlere genel bakış, hadîslerin tahriçleri, zikredildikleri bâb başlıkları, sahabîlere göre dağılımı ve fıkhî yansımaları' incelenmiştir. Her bir sahabîden gelen rivayetlerin tarikleri, isnad şemaları, rical, lafız ve mana tetkikleri ardından değerlendirilmesi yapılmıştır. Bu çalışmada nikâhta velayetle ilgili hadîsler, bütün tarikleriyle birlikte incelenmiş ve sıhhatleri hakkındaki düşüncelere yer verilmiştir. Konuyla ilgili rivayetler üzerinde erken dönem kanaatleri gözönünde bulundurularak hadîslerin merfû olma yönündeki fikirlerin daha ağırlık kazandığı sonucuna ulaşılmıştır."
