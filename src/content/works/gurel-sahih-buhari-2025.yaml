abstract: "Toplumun dinî hayatına yön veren fıkıh ilmi, Buhârî'nin de ilgi duyduğu bilim dallarından biri olmuştur. Sahih hadisleri toplamanın yanı sıra, âyetlerden ve hadislerden fıkhî hükümleri çıkarma girişiminde bulunmuştur. Bunu özellikle eserinde seçtiği bab başlıklarıyla kendisine has bir şekilde okuyucularına sunmuştur. Buhârî'nin fıkhî birikimini, el-Câmiu's-sahîh'te yer alan bab başlıklarının küllî ve fıkhî kaidelerle olan bağlantısını ortaya koymak amacıyla bu konu ele alınmıştır. Tez, bir giriş ve üç bölümden oluşacak şekilde planlanmıştır. Giriş bölümünde, araştırmanın konusu, önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Buhârî'nin hayatına, ilmî şahsiyetine, hoca ve talebelerine, ilmî yolculuklarına, fıkıh ve hadis ilmindeki yerine, eserlerine, el-Câmiu's-sahîh adlı eserine değinilmiştir. İkinci bölümde ise kaide kavramı, kaide ile ilgili diğer kavramlar, kaidelerin kısımları hakkında bilgi verilmiştir. Tezin ana bölümünü oluşturan üçüncü bölümde ise Buhârî'nin el-Câmiu's-sahîh'inde yer alan bab başlıkları incelenerek ve diğer kaynaklar taranarak bazı fıkhî ve küllî kaidelere ulaşılmıştır. Buhârî bab başlıklarında fıkhî, küllî kaideleri kullanması ya da bu kaidelere işaret etmesi, Buhârî'nin fıkıh anlayışının şekillenmesine ve fıkhî hükümlerin tespit edilmesine zemin hazırlamıştır. Onun fıkhî görüşü ve konuya yaklaşımı, kendine özgü bir nitelik taşıyarak dikkat çekmiştir."
