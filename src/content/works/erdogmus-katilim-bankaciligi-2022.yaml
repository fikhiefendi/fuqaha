abstract: "Bu çalışmada, Katılım bankacılığının 1960'lı yıllarda dini nedenlerden ötürü ortaya çıkarıldığını ve günümüze kadar varlığını sürdürerek ekonomiye sağlamış olduğu katkıları ile göstermiş olduğu gelişmelerine yer verilmiştir. Sonrasında Katılım bankacılığının kullanmış olduğu birçok finansman modelleri içerisinde şuan en çok kullanılan modeli olan Sukuk ve çeşitlerine değinilmiştir. Sukuk'un Dünya ve Türkiye açısından değerlendirmeleri yapılmıştır. Dünya ve Türkiye ekonomisine yıllara göre sağlamış olduğu katkılara yer verilmiştir. Son olarak da Sukukun sağlamış olduğu avantajlar ve dezavantajlar değerlendirilmiştir."
