abstract: "Bu çalışma, Kuveyt Türk Katılım Bankası'nda uygulanan finansal murabaha sözleşmesi ile İslami Finans Kuruluşlara Yönelik Muhasebe ve Denetim Kurumu (AAOIFI) tarafından hazırlanan standart arasındaki benzerlikleri ve farklılıkları ortaya koymayı amaçlamaktadır. Çalışmanın amacına ulaşmak için, çalışma hakkında çeşitli veriler toplamayı, ardından bunları sınıflandırmayı, analiz etmeyi ve görüntülemeyi amaçlayan tanımlayıcı analitik yaklaşım izlenmiştir. Çalışmada aynı zamanda AAOIFI'nin Murabaha standardının Kuveyt Türk Katılım Bankası'nın ilgili uygulamaları ile mukayesesine yönelik karşılaştırmalı yaklaşım da takip edilmiştir. AAOIFI standartları ile Kuveyt Türk uygulamaları karşılaştırıldığında, ikisi arasında birtakım farklılıkların söz konusu olduğu sonucuna varılmıştır. Bunlardan en önemlisi bağlayıcı vaattir. Kuveyt Türk uygulamalarına göre murabahada bağlayıcı vaadin mevcudiyeti şarttır. Oysa AAOIFI standartlarında her iki taraf (kurum ve müşteri) için bağlayıcı bir ilişkinin olmasına izin verilmediği belirtilmektedir. Cezai şarta gelince AAOIFI standartlarına göre, müşterinin ödemeyi geciktirmesi durumunda bankanın ceza olarak kendi hesabına herhangi bir kesintide bulunması söz konusu değildir. Kuveyt Türk Katılım Bankası'nın ilgili kararına göre ise, finans kurumunun enflasyon oranı ve maliyet değeri kadar bir ceza uygulaması mümkündür. Uygulama ile standart arasında diğer farklar da bulunmaktadır. Çalışmada katılım bankalarının, AAOIFI tarafından hazırlanan ilgili faizsiz finans standartlarını dikkate alarak, finansal murabaha işlemlerini yeniden gözden geçirmeleri önerilmiştir."
