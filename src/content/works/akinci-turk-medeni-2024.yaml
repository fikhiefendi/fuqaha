abstract: "İstihkak davası, malikin mülkiyet hakkını koruyabilmesi için Türk Medenî Kanunu m. 683/II'de düzenlenmiş olan iki dava türünden biridir. Mülkiyet hakkının varlığı ve kullanılması kadar korunması da önem arz eder. Zira hakkı koruyamıyor olduktan sonra, bunun sadece var olması bir anlam ifade etmez. Bu sebeple, devlet rejimlerini dahi etkileyen mülkiyet hakkının nasıl korunacağına ilişkin her hukuk sisteminde cevabın bulunması gerekir. Türk Medeni Kanunu'nda mülkiyet hakkının korunması kapsamında istihkak davası düzenlenmiş olmakla beraber, Türk Hukuku öğretisinde buna ilişkin kapsamlı bir çalışma ile karşılaşılmamıştır. Bu durum, konunun doktora tezi olarak çalışılmasının Türk Hukuku'na katkı sağlayacağı fikrini uyandırmış ve tez konusu olarak istihkak davası seçilmiştir. Kanundaki düzenleme istihkak“davası”şeklinde olduğundan, tezin adı da buna uygun olarak belirlenmiştir. Öte yandan, meseleyi“dava”ile sınırlandırarak usul hukuku boyutuna itmenin doğru olmayacağı kanaatine ulaşılmıştır. Bu sebeple, çalışmamızda hem istihkak davasını hem de davaya gerek olmaksızın kendiliğinden mevcut olan ve öne sürülebilen geniş anlamdaki istihkak talebini birlikte içine alan bir“istihkak olgusu”çatısı meydana getirilmiştir. Birinci bölümde istihkak olgusuna ilişkin teorik değerlendirmelere yer verilmiştir. İkinci bölümde ise istihkak davasına ilişkin bilgilendirmeler ve davanın ilgili diğer davalarla karşılaştırılması meseleleri ele alınmıştır. Üçüncü ve son bölümde, haksız zilyedin iade yükümlülüğünün kapsamı gibi istihkak talebinin sonuçlarına ilişkin hususlar ile talebin sona ermesi veya şekil değiştirmesi konuları incelenmiştir. Tüm bu konular ele alınırken yerli ve yabancı yüksek mahkeme kararlarından da yararlanılarak, uygulamadaki eksiklik ve sorunlara çözüm üretilmeye çalışılmıştır."
