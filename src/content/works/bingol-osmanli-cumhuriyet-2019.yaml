abstract: "Aile bir toplumun en küçük ve en temel birimidir. Bir toplumun gelişmesi veya çöküşü aile kültürünün yapısıyla eşdeğerdir. Osmanlı Devleti'nin ekonomik, askeri ve toplumsal açıdan gerilemeye başladığı devirlerde aile kültürünün de bozulduğu bilinmektedir. Zira Batı'nın üstünlüğünü kabul eden Osmanlı Devleti'nin birçok alanda yenilikler yapması ile birlikte aile ve kadın konusunda da önemli değişimler yaşanmıştır. Aile modernleşmeye başlamış, özellikle II. Meşrutiyet döneminde kadınlar evden çıkarak eğitim ve iş alanında yer alarak gözle görülür bir biçimde kadın hareketi yaygınlaşmıştır. Eski ve kadim bir geleneğe sahip olan Antalya şehri çok kültürlü bir yapı barındırdığı için Osmanlı Devleti ve Türkiye Cumhuriyeti döneminde aile kültürü bakımından oldukça zengindir. Osmanlı Devleti'nde 1900 yılların başlarında Antalya'da birçok farklı millet bir arada yaşamaktaydı. Bunlar Müslümanlar, Rumlar, Ermeniler, Yahudiler ve Kıptilerdi. Bu cemaatler bir arada saygı ve hoşgörü içerisinde kendi aile kültürlerini yaşatarak gelecek nesillere aktarmışlardır. Osmanlı döneminde aile hukuku alanında Mecelle Kanunu uygulanmaktaydı. Osmanlı döneminde Antalya'da aile hayatına oldukça büyük özen gösterilmiş, evlilikler ve boşanmalar kanun nazarında yapılmaya çalışılmıştır. Antalya kent ve kır yöresinde biraz farklılaşmalar olmakla birlikte Anadolu'nun ortak kültürünü taşıdığı söylenebilir. Cumhuriyetin ilanı ile birlikte Antalya'daki aile yaşamı Türk kültürünün özelliklerini muhafaza edip, dünya kültürüyle ortak bir sentez oluşturup varlığını devam ettirmiştir. 1926 yılında Medeni Kanunu'nun kabulü ile birlikte kadın ve erkek aile hukukunda eşitlenmiş, sağlıklı bir yapıya kavuşmuştur. Cumhuriyet devrinde Antalya'da aile kültürüne son derece ehemmiyet verilmiş, bu kültür toplum ve devlet kurumları tarafından desteklenmiştir. Atatürk ilke ve inkılâpları tüm şehirde hızla kabul görerek aile yapılanmasında yerini almıştır. Ataerkil bir kültürün hakim olduğu Antalya'da özellikle kadınlar inkılâplarla her anlamda korunarak toplumda güçlü bir şekilde var edilmeye çalışılmıştır. Kadınların eğitim ve iş alanında ön plana çıktığı, şehirdeki toplantılara, balolara, etkinliklere ailece katılımın desteklendiği görülmektedir."
