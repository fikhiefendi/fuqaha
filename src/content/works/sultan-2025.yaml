abstract: "Kur'an-ı Kerim'deki Adalet Kanunu, en önemli kanunlardan biri olarak kabul edilmektedir; çünkü bu, adalet ve hakkaniyetin sağlanmasında temel bir unsur oluşturur. Kur'an, sosyal, ekonomik ve siyasi ilişkileri düzenleyen yönergeler ve kurallar içerir ve tam adaletin sağlanabilmesi için toplumlarda dürüst bireylerin bulunmasının önemine işaret eder. Kur'an'daki adalet kanununu incelediğimizde, İslam'ın adalet ve hakkaniyet konusundaki öğretilerini derinlemesine anlamayı amaçlıyoruz. Ayrıca, adaletli ve dengeli toplumlar inşa etmek için pratik dersler ve yönlendirmeler çıkarma amacındayız. Bu araştırmanın amacı, Kur'an-ı Kerim'in bir hukuk kaynağı olarak rolünü keşfetmek, İslam'daki adalet kanununun kavramlarını ve ilkelerini analiz etmek ve sonra bunun nasıl uygulandığını, Kur'an'daki hikayeler aracılığıyla açıklamaktır. Ayrıca, adalet kanununun İslami ve medeni hukukları şekillendirmedeki etkisini inceleyerek, adalet ilkelerine dayanan önemli kanunları araştırıyoruz. İlgili ayetler üzerinden yapılan bu analizde, adalet ve hukukla ilgili kavramlar; hak, hakkaniyet, eşitlik, servet dağılımı ve insan hakları ele alınmıştır. Araştırma sonuçları, Kur'an-ı Kerim'in adaletle ilgili kapsamlı bir model sunduğunu göstermektedir; çünkü tüm meselelerde hak, hakkaniyet ve eşitliği vurgulamaktadır. Bireylerin ve toplumların haklarını korumaya teşvik eder. Araştırmanın bulguları, Kur'an'da adaletin önemini ve bunun Peygamberimizin ve sahabelerinin hayatındaki uygulamalarını ortaya koymakta, ayrıca modern İslam toplumlarında uygulamada karşılaşılan zorluklara dikkat çekmektedir. Bu bulgulara dayanarak, Kur'an-ı Kerim'in anlaşılması ve yorumlanmasının adalet kanununun ve İslami hukukun uygulanmasını destekleyecek şekilde güçlendirilmesi, adalet ve hakkaniyet ilkelerinin tüm alanlarda anlaşılması ve uygulanması gerektiği, bağımsız ve dürüst bir yargı sisteminin geliştirilmesi ve hukuk sistemlerinin İslami değerlerle uyumlu hale getirilmesi için entelektüel etkileşimin teşvik edilmesi gerekliliği vurgulanmaktadır."
