abstract: "Osmanlı fıkıh düşüncesinin çeşitlilik, derinlik ve zenginliğinin en açık şekilde görülüp takip edilebileceği sahalardan birisi ve belki de en önceliklisi tarafların görüşlerini yazıya döktüğü ve böylelikle belli bir literatürün oluştuğu tartışmalı ilmî meselelerdir. Bu noktadan hareket eden doktora çalışmamız, para vakfının meşruiyet, bağlayıcılık ve tesciline ilişkin olarak 16. yüzyılda yoğunlaşan tartışmaları ilmî ve fıkhî boyutlarıyla incelemeye yöneliktir. Kanaatimizce paranın vakfedilmesi meselesi 16. yüzyıl Osmanlı ilmiyesinin önüne hâlen yeniliğini devam ettiren bir problem (nâzile) olarak gelmiş, meşruiyet ve bağlayıcılık hususları Hanefî mezhebi ve Mâverâünnehir fıkıh geleneği çerçevesinde temellendirilmeye veya reddedilmeye çalışılmıştır. Bu süreçte, genel olarak mezhebin muteber metinlerindeki hâkim anlatı ile teâruf ve hâcet-i nâs gibi toplumsal dinamikler arasında denge kurma, hukuki süreklilik ve tutarlılığı koruma arayışı, özelde ise mezhebin kurucu imamlarının otoritesine dayanma ve bir şekilde nakillerle irtibatlı kalma çabası öne çıkmıştır. Öte yandan benzer ilim ve kültür çevrelerinden isimler arasındaki yaklaşım farklılıkları, sadece Osmanlı ilmiyesinin fıkıh yapma ve çözüm üretme kabiliyetleri açısından değil, ilmiye ile siyasi otorite ilişkisi açısından da dikkat çekici özellikler sergilemiştir. Bu genel bakışı yansıtacak şekilde planladığımız tezimizin giriş bölümünde para vakfı tartışmalarına giden süreç ve tartışmaların bağlamı üzerinde durulmuştur. Birinci bölümde para vakfının cevazını savunan yaklaşımlar (İbn Kemâl, Fenârîzâde, Sofyalı Bâlî ve Ebussuûd'un metinleri ile para vakfına izin veren ferman), ikinci bölümde ise para vakfının cevazına karşı çıkan yaklaşımlar (meçhul müellif, Çivizâde ve Birgivî'nin metinleri) kendi bütünlükleri içinde ele alınıp ayrıntılı olarak incelenmiş ve metinler arası irtibat, benzerlik ve farklılıklar belirginleştirilmeye çalışılmıştır. Üçüncü bölüm ise para vakfı hakkındaki yaklaşımlara dair ilk iki bölümde tespit edilen hususların, temsil kabiliyeti yüksek olan çeşitli başlıklar üzerinden, mukayeseli olarak değerlendirilmesine yöneliktir."
