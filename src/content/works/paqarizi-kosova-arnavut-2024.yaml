abstract: "Kosova Arnavut Toplumundaki Nikâh Uygulamalarını İslam hukuku Açısından Tahlili\" konulu tez çalışmamızda Kosova'daki nikâh uygulamaları İslam hukuku ile kıyaslanarak araştırma yapılıp ele alınmıştır. Kosova toplumunun büyük ekseriyetinin Müslüman olması hasebiyle din kaynaklı tesirler hayatın her alanını etkilediği gibi evlilik ve düğün uygulamalarında da topluma yön vermiştir. Dolayısıyla bu çalışmamızda geçmişten günümüze Kosova Arnavut toplumundaki nikâh uygulamaları İslam hukuku açısından kıyaslama yapılarak nikâh öncesi, nikâh, düğün ve evlilikle ilgili birçok uygulamalar ele alınıp bunlarda yerel örfün ve İslam dinînin etkisi ortaya çıkarılmaya çalışılmıştır. Günümüzdeki nikâh uygulamaları birçok etkenden dolayı modern çağa ayak uydurmak zorunda kalınmasına rağmen dinî hassasiyetler de korunmaya devam etmektedir. Hâlen düğünden önce veya düğün sonunda ya dinî nikâh kıyılmakta veya en azından cami imamı davet edilerek nikâh duası yapılmaktadır."
