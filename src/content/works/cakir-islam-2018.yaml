abstract: "Tarihten günümüze toplumsal ihtiyaçlara paralel olarak ortaya çıkmış çeşitli finansman yöntemleri mevcuttur. İslamiyet'le birlikte yeniden şekillenen iktisadi hayat, tevarüs edilen finansal sistemin kurallarının da tekrar gözden geçirilmesini gerekli kılmıştır. İslam'da iktisadi faaliyetlerin ilahi ölçüler içerisinde yürütülmesinin dini bir gereklilik oluşu ve buna bağlı olarak ortaya çıkan hesap düşüncesi, finansman arayışında olan müslüman bireyleri daima meşru bir zemin bulmaya sevk etmiştir. Bu araştırmada konu edinilen teverruk ve buna bağlı finansman yöntemleri de esasen böyle bir çabanın sonucudur. Teverruk işlemlerini İslam hukuku perspektifinden ele alan bu çalışmada, geçmişten günümüze alternatif bir finansman modeli olması düşüncesiyle başvurulmakta olan bir uygulamanın meşru temelleri açısından sorgulanması amaçlanmaktadır. Üç bölümden oluşan bu çalışmada; konunun kavramsal analizi ve klasik bireysel teverruk uygulamaları, günümüz katılım bankacılığı sektöründe başvurulmakta olan organize şekilleri, teverruk temelli bazı modern finansman yöntemleri ve buna bağlı olarak sürdürülmekte olan alternatif model arayışları ele alınmaktadır."
