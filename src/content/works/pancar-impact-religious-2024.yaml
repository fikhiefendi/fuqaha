abstract: "Bu çalışma, dini yatırımcıların paya dayalı kitle fonlamanın başarısı üzerindeki etkisini incelemektedir. Çeşitli ampirik araştırma teknikleri ve istatistiksel yazılımların bir arada kullanıldığı bu çalışma, Türkiye'de Fonbulucu Paya Dayalı Kitle Fonlama Platformu'nda 2021-2023 yılları arasında başarıyla finanse edilen 85 kampanyadan elde edilen verileri analiz etmektedir. Finanse edilen kampanyaların Şeriat uyum faaliyetlerinin paya dayalı kitle fonlama kampanyası üzerindeki etkisine ilişkin hipotezler formüle edilmektedir. İslami değer, yatırımcı sayısı, fonlama hedefi, ortalama ve maksimum yatırım, kitlesel fonlama başarısını etkileyen değişkenler olarak belirlenerek paya dayalı kitle fonlama başarısıyla ilişkilendirilerek analiz edilmiştir. Bu çalışma, dini yatırımcı davranışını temsil eden İslami değerin, anlatı filtrelemesine ve Şeriat uyumluluğuna dayalı olarak paya dayalı kitle fonlama projelerinin başarısını etkileyip etkilemediğini araştırmaktadır. Araştırmanın bulguları, İslami değerin kampanya başarısını önemli ölçüde ve olumlu yönde etkilediği sonucunu gösteriyor."
