abstract: "Artık, ülkelerin diğer ülkelerle ticari faaliyet içerisine girmeden hayatta kalabilmesi mümkün değildir. İhracat ve ithalat dış ticaretin iki unsurudur. Neredeyse tüm gelişmekte olan ülkeler için dış rezervlerin ana kaynağı ihracattır. Bu çalışmanın ana amacı, İslami finansal araçlar, bu alandaki son gelişmeler ve dünyadaki bazı İslami ihracat finansmanı örneklerine odaklanarak ihracatı İslami finans yardımıyla artırmaktır. Bu çalışmada kullanılan metodoloji, tanımlayıcı bir yaklaşım olup, bunu bazı dış ticaret finansmanı örnekleri izlemektedir. Çalışmada ayrıca, İslami finansın devletlerin ihracat performansını nasıl artırıp iyileştirebileceğini açıklığa kavuşturmak için tümevarım metodolojisi kullanılmıştır. Faizsiz finansman kaynaklı ihracat verilerinin eksikliğinden dolayı, ampirik veya analitik bir yaklaşım izlenememiştir. Bu çalışmada, konvansiyonel yöntemlerin dışında olan ve faizle faaliyet göstermek istemeyen ve / veya gerekli sermayesi bulunmayan ihracatçı şirketler için halihazırda mevcut olan faizsiz finansal yöntemler incelenmekte ve Türkiye için politika önerileri yapılmaktadır. Bu çerçevede öncelikle; ihracatın önemine, finansman şekillerine ve literatür taramasına yer verilmiş, sonrasında ise faizsiz finansmanın gerekliliği üzerinde durulmuştur. Son olarak, ihracat aşamasında faizsiz finansman metodları ve örnekleri tartışılmıştır. Çalışma ile, İslami finansın ihracat finansmanında kullanım potansiyelinden oldukça uzak olduğu sonucuna varılmıştır. İhracat aşamasında faizsiz finansman bilançosu incelenirken, literatür araştırması sırasında İslami ihracatın finansmanına odaklanan neredeyse hiçbir çalışma olmadığı tespit edilmiştir. Halihazırda mevcut olan çalışmaların çoğu ya İslami bankalarla ya da iç ticaret ile ilgili olup, ihracat finansmanına özel çalışmalar yok denecek kadar azdır. Bu durum, ihracatın faizsiz finansmanı hususunun daha fazla araştırmaya ihtiyaç duyduğunu ve acilen geliştirilmesi gereken bir alan olduğunu ortaya koymaktadır. Çalışma sonucunda, ihracatın faizsiz finansmanı örneklerine baktığımızda, uluslararası kuruluşların çok önemli bir role sahip olduğu ortaya çıkmıştır. Faizsiz finans faaliyetlerinin tamamına yakını doğrudan veya dolaylı olarak uluslararası kuruluşların yardımıyla gerçekleştirilmektedir."
