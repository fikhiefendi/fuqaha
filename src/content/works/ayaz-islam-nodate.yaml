abstract: "Çocuğun hak ve sorumlulukları meselesi, İslam hukuk düşüncesinde yalnızca bireysel hakların korunması bağlamında değil, aynı zamanda toplumsal düzenin temini açısından da merkezi bir yer işgal etmektedir. Anne karnındayken cenine tanınan haklar ile doğum sonrası çocuğa tanınan haklar ve çocuğun yaşına uygun olarak ona verilen sorumluluklar, çocuğun yararını korumayı hedeflemiştir. İslam hukukuna göre çocuk, çeşitli haklara sahip olmakla birlikte aynı zamanda belirli ölçüde sorumluluk sahibi bir bireydir. Buna göre İslam hukuku, çocuk haklarına geniş şekilde yer verdiği gibi çocuğun bulunduğu çocukluk evresi, gelişim düzeyi ve algılama yetisini de dikkate alarak, çocuğa üstlenebileceği hukuki sorumluluklar da vermiştir. İslam hukukunda bülûğ öncesi çocuk hakları ve sorumlulukları adlı bu çalışma, önsöz, giriş, iki bölüm ve sonuç kısmından meydana gelmiştir. Giriş bölümünde; araştırmanın konusu ve amacı, araştırmanın yöntemi, araştırmanın kaynakları, çocuk hakları tarihçesi, modern dönemde çocuk hakları ve çocukluk evreleri konularına yer verilmiştir. Birinci bölümde; İslam hukukunda çocukluk dönemi evreleri, cenine tanınan haklar ile doğum sonrası çocuk hakları konuları ele alınmıştır. İkinci bölümde; ehliyet kavramı, ehliyet türleri incelenmiş ve İslam hukukunda bülûğ öncesi çocuk sorumlulukları konusu incelenerek detaylandırılmıştır. Sonuç olarak, İslam hukuk sisteminde çocuğa tanınan haklar ile çocuğa verilen sorumlulukların, çocuğun bireysel gelişimini desteklediği ve çocuğun toplumsal sorumluluk bilinciyle yetişmesini teşvik ettiği vurgulanmıştır."
