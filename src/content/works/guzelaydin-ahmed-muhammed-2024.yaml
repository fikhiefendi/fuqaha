abstract: "Şuayb el-Arnaûd ve Ahmed Muhammed Şâkir'in Müsned tahkikleri, Ahmed b. Hanbel'in Müsned'indeki hadislerin hükmünü öğrenmek isteyenlerin ilk başvurduğu kaynaklar arasındadır. Ancak iki tahkikte hadis senedlerine verilen hükümler arasında ciddi farklar olduğu görülmektedir. Bu çalışmada mezkûr farklılıkların sebepleri ve oranları analiz edilmiştir. İki muhakkikin ortak olarak %54 oranında hadisin senedinin sahihliğine, %11 oranında zayıflığına hüküm verdikleri, %35 oranındaki hadisin senedinde de farklı kanaatte oldukları görülmüştür. Farklı kanaatte oldukları senedlerin çoğunda Ahmed Şâkir'in sahih, Arnaûd'un zayıf hükmü verdiği tespit edilmiştir. Bu veriler ışığında hem Ahmed Şâkir ve Şuayb el-Arnaûd'un tahkik metotları hakkında fikir edinilmiş, hem hadislere farklı hüküm vermeye etki eden sebepler görülmüş hem de bir nevi hadiste ictihâd faaliyetinin modern dönemdeki örneği incelenmiştir."
