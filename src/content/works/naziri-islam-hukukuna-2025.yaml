abstract: "İslam hukukuna göre Faizin haram kılınmasının Hikmetleri. Faizin anlamı İnsanlık tarihi kadar eski olan bir kavrım'dır, Mukeddes İsalm din tarafından faiz haram ve yasaklanmıştır. Ama alım-satım meşru görulmuştur. Bu meselenin anlaşılması amacı ile çalışmamızda Birinci olarak faiz kavramın değinilmiştir. Faizi dirinden anlamk adına İslam dininin birinci ve ikinci kaynağı kur'an-ı kerim ve efendimiz aleyhisselam'ın mübarek sünnetinde faiz kavramlarına mezheplerce açıklanmış ve sonucunda faizin ne tür bir eylem olduğu dikkete alınmıştır. Çalışmamızın İkinci Bölümünde Faizin Hikmetleri hakkında izah edilmiştir. Ve hamde çalışmamızın Üçüncü Bölümünde ise Bey' Sarf, Faiz ve kâr kavramları arasındaki benzerlik ve ayrışı noktalarına değinilmiştir. Sonuc olsrak faizi İslami perspektifden gözler önüne almayı hedeflemektedir."
