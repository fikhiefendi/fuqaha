abstract: "İslam kültür tarihi süresince uzun soluklu tartışmalar ve fikri çatışmalar, toplumların hem dini hem de fikri anlamda yönlendirilmesine sebep olmuştur. Bu süre zarfında gruplaşmaların getirdiği ayrışmalar kaçınılmaz olmuştur. İslam alimlerinin naslara farklı yaklaşımı, ilmi araştırmaların seyrinde belirleyici olmuştur. Bu sebeple hadis ilminde Hicaz ve Irak merkezli olarak ortaya çıkan ve daha sonraları ehl-i hadis ve ehl-i re'y olarak adlandırılan iki yaklaşım tarzı ortaya çıkmıştır. Ehl-i hadis olarak bilinen Şâfiîler; naslara literal yaklaşma, hadislerin lafızlarını merkeze alıp mana ve maksatlarına tam anlamıyla vakıf olmama gibi konularda eleştirildikleri ve re'ye çok az başvurdukları iddiası ilmi çevreler tarafından bilinmektedir. Ehl-i re'y tarafını temsil eden Hanefîler ise; sünnete muhalefet etmek, re'yi esere tercih etmek, zayıf hadislerle amel etmemek gibi hususlarda eleştirilmişlerdir. Bir de re'ye çokça başvurdukları için hadislere gereken değeri vermedikleri gibi konular üzerinden ağır ithamlara maruz kalmışlardır. Eser-re'y tartışması, her daim canlılığını korumuş olup, mihne sürecinden sonra artarak devam etmiştir. Bu çalışmada eser – re'y bağlamında el-Hidâye ile el-Mühezzeb adlı eserlerin tahâret bahsinde geçen rivâyetler nicelik ve nitelik olarak tetkik edilmek suretiyle hem Hanefîler hem de Şâfiîler hakkında ileri sürülen iddiaların somut karşılıklarının olup olmadığı ortaya konulmuştur."
