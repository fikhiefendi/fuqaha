abstract: "Bu tez Islâm Hukuku'nda kadının çocugun bakım ve yetistirilmesindeki hak ve sorumluluklarını, günümüzdeki degisimleri ve farklı bakıs açılarını da göz önünde tutarak belirlemeyi amaçlamaktadır. Arastırma; bir giris ve üç bölümden olusmaktadır. Giris bölümünde kadının eski Yunan'dan Islâmiyet'in dogusuna kadarki asamada toplumsal konumuna yer verilmistir. Birinci bölümde, kadının hamilelik döneminde kendisi ve çocuguyla ilgili olarak hak ve sorumluluklarından söz edilmistir. Ikinci bölümde kadının dogum ve emzirme dönemindeki hak ve sorumlulukları ortaya konmustur. Üçüncü bölümde, çocugun gayr-i mümeyyiz dönemindeki bakım ve terbiyesinde kadının hak ve sorumlulukları belirtilmistir."
