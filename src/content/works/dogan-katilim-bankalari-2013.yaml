abstract: "Tezin amacı, katılım bankaları ile ticari bankaların performanslarını CAMELS analizi ile incelemek, performansları arasındaki farkları tespit etmek ve bu farkların neden oluştuğunu saptamaya çalışmaktır. Böylece faizsiz finansmanın en önemli unsurlarından olan katılım bankalarının mevcut ve gelecekteki durumu hakkında çeşitli değerlendirmeler yapılabilecektir. Çalışmanın birinci bölümünde, katılım bankaları kavramı ve katılım bankalarının tarihi süreci hakkında bilgi verilmiş, temel özelliklerine değinilmiş ve fon kullandırma, fon sağlama yöntemleri ve bu yöntemlerin ticari bankalardaki yöntemlerden farkları detaylı bir şekilde ele alınmıştır. Daha sonra performans kavramı geniş bir şekilde açıklanmıştır. Performans analizi ile ilgili kavramlar ve performans analiz yaklaşımları incelenmiştir. CAMELS analizi hakkında bilgi aktarılıp, CAMELS Analizinin bileşenleri sınıflandırılmış ve her birleşenin içerisinde kullanılan oranlar gösterilmiştir.Tezin ikinci bölümünde, Dünya?da ki İslami bankaların ve Türkiye?de ki katılım bankalarının performansı ile ilgili yapılmış olan çalışmalar incelenmiş ve bu çalışmalar hakkında bilgiler verilmiştir.Tezin üçüncü bölümünde, Türkiye?de faaliyet gösteren çalışma prensipleri tamamen farklı olan fakat aynı ekonominin içerisinde benzer gereksinimleri karşılayan ve aynı kanunla çalışan katılım bankaları ile ticari bankanın 2006-2011 yılları arasındaki ortalama performansları CAMELS analizi ile karşılaştırılmıştır. 2006 yılı sonrası dönemin esas alınmış olmasının nedeni, bu tarih itibariyle, katılım bankalarının mevzuatında yapılan köklü değişikliklerdir. Analizde 28 oran kullanılmıştır.97Tezin sonuç bölümünde ise analiz sonucunda elde edilen bilgiler paylaşılmıştır. Buna göre katılım bankalarının piyasa risklerine karşı duyarlılığının ticari bankalara göre daha yüksek olduğu ve katılım bankalarının kriz döneminden daha az etkilendiği ortaya çıkmıştır. Bu durum karşılaştırması yapılan bankaların çalışma prensiplerinin farklı olmasına bağlanabilir. Bununla birlikte katılım bankalarının likidite durumunda ve yönetim kalitesinde ise ticari bankaların gerisinde olduğu tespit edilmiştir. Ticari bankaların yaklaşık %4?ü kadar bir büyüklüğe sahip olan katılım bankalarının likit aktifler kaleminde sakıntı yaşadığı görülmüştür.Anahtar Sözcükler1. Katılım Bankası2. Faizsiz Bankacılık3. İslami Bankacılık4. Performans Analizi5. CAMELS analiz"
