abstract: "Osmanlı hukuk sistemi İslam hukuku ve özelde Hanefi ekolü uygulamalarıyla öne çıkmıştır. Bu uygulamalar dikkatli bir biçimde kayıt altına alınmıştır. Çalışmamızda bir Anadolu kenti olan Çorum'un 19. yy. Şer'iyye sicilleri temel alınarak İslam aile hukuku bakımından incelemesi yapılmıştır. Bir anlamda teorideki İslam hukukunun pratikte nasıl hayat bulduğu tespit edilmiştir. Temel kaynak olarak 1255-1290/1840-1874 yılları arası Çorum Şer'iyye Sicilleri ve fıkıh eserleri kullanılmıştır. Öncelikle siciller birkaç yönden tanıtılarak önemi vurgulanmış, davalar sınırlar dâhilinde konularına göre tasnif edilmiş ve Osmanlı toplumunda ve hususiyetle Çorum ölçeğinde İslam hukukuna bağlı kalınan noktalar ile farklı uygulamalar tespit edilmeye çalışılmıştır."
