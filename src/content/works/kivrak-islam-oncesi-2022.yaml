abstract: "Türkler milattan önceki çağlardan beridir teşkilatlı bir devlet, ordu ve toplum yapısına sahiptir. Türkler, kültürel anlayışları ile şekillenen ve Türk toplumunda meydana gelen sorunlara çözüm olarak sözlü geleneklerle şekillenmiş hukuk kuralları belirlemişlerdi. İslamiyet öncesi Türk devletlerinde yazılı olmayan töre adı verilen bu hukuk kuralları, Türk devletlerinin ve toplumunun temelini oluşturmaktadır. Töre, devletin işleyişini belirleyen idari hükümler içermekteydi. Kağanlık kurumu, kurultay, hiyerarşik yapı, orun ve ülüş sistemi gibi konularda belirleyici hükümlere sahipti. İdari yapıya dair hükümler, kurultay adlı mecliste karara bağlanırdı. İdari teşkilat kuralları yine kurultayda alınan kararlarla değiştirilmekteydi. Devleti yöneten kağanlar, hukuk kuralları ile sınırlandırılmaktadır. Keyfi hareket eden kağanlar, töreye karşı geldikleri gerekçesiyle yönetme hakkını kaybederdi. Töre, savaş hukuku ve emir-komuta zincirini düzenleyen hükümleri de belirlemektedir. Emirlere itaatsizlik etmek, görevi ihmal gibi emir-komuta zincirini bozucu davranışlar cezalandırılmaktaydı. Bozkır hayatı, savaşta başarısızlığın sonucunun ağır olmasına sebep olduğundan savaşı kaybedenler ağır şekilde cezalandırılırdı. Töre kuralları, sosyal hayatı ilgilendiren konularda da düzenlemeler içermekteydi. Evlenme âdetleri, aile hukuku, miras paylaşımı, kölelik hukuku ve kadının Türk toplumundaki konumu töre hükümleri ile belirlenmekte ve korunmaktaydı. Töre, sosyal hayatı ve toplumsal düzeni korumayı amaçlayan hükümleri ile bir aile hukukudur. Aile düzenini bozmaya ve Türk kadınına yönelik fiil ve davranışlar ağır şekilde cezalandırılmaktaydı. Töre, Türk toplumunda meydana gelen anlaşmazlıklara çözüm getiren, toplum ve devlet düzenini bozarak suç teşkil eden fiil ve davranışları cezalandırmaya yönelik kuralları da içinde barındırmaktaydı. Zina, hırsızlık, adam öldürme, vatana ihanet, isyan, sodomi (oğlancılık, eşcinsel ilişki) ve töreye uymamak gibi suçlara verilecek cezaları belirleyen hükümler ihtiva etmesi bakımından bir ceza hukuku niteliği taşımaktadır. Türk toplumunun kültürü, aile yapısı, gelenek ve görenekleri yaşayan canlı bir Türk ceza hukuku yaratmaktaydı. Töre toplum düzenini sağlamayı, toplumun huzur ve refahını temin etmeyi amaçladığından cezalar ağır ve ibret verici olmaktaydı. Özellikle devlete karşı hareketler ve toplumu bozucu davranışlar halkın gözü önünde cezalandırılmaktaydı ki bu cezalandırma caydırıcı bir etki yapmıştır. Bu nedenle İslam öncesi Türklerde suç oranı da oldukça düşüktü. İslam dininin kabul edilmesiyle birlikte, Türkler törede değişiklikler meydana getirdiler. Türk hukukuna Kur'an hükümlerinin girmesi ile ceza hukukunda ukubat denilen İslam ceza hükümleri dâhil edildi. Hükümdarlar, İslam dininin hükümdarlara sağladığı bazı haklar ve İslam hukukunun belirlemediği alanlar da Türk örf ve âdet hukukunu uygulamaya devam etmektedir. İslam hukukunun belirlemiş olduğu konularda da töre hükümlerini tatbik etmekteydiler. Hırsızlık veya cinsellikle ilgili cezalar İslam ceza hukukunda belirlenmiş olmasına rağmen bu suçları Türk-İslam devletleri örf ve âdet hukukuna göre cezalandırmıştır. Zina yapan bir kimse şer'i hukuka göre recm (taşlanma) cezası ile cezalandırılırken Türk-İslam devletleri işkenceli ölüm cezası uygulanmıştır. Cezalar halkın gözü önünde uygulanmaktadır."
