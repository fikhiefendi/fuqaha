abstract: "Tezimiz, giriş, üç bölüm ve sonuç kısmından oluşmaktadır.Giriş bölümünde icâre akdinin önemi, sınırlandırılması ve konunun sunumu yapıldı.Birinci bölümde konu ile ilgili kavramlar, icâre akdinin meşruiyetinin; kitap ve sünnete dayandığı, icâre akdinin hikmeti, icâre akdinin rükünleri; taraflar, icâp ve kabul, menfaat ve ücret kavramlarını açıklanarak icârenin kısımları, icâre akdinin sıhhat şartları, zimmetteki icârenin şartları anlatıldı.İkinci böülümde icâre akdinin feshini, Ehl-i Sünnet'in dört mezhebine göre değerlendirerek günümüz hukuk sisteminde konu hakkıda bilgi verdik.Üçüncü bölümde ise, Kuran-ı Kerim öğretimi için ücret almak, sütanne kiralamak, dokumacı, terzi, boyacı ve bunlar gibi sanatkârların ücretle tutulması, hava parası, leasing (finansal kiralama) kavramlarının tanımı, şartları ve İslam hukukunda geçerliliği hakkında kısaca bilgi verdik. Ayrıca işçinin tazminat ödemesi, icâre müddetinin açıklanması, menfaat mahallinin izahatı, kiralanan maldan faydalanma kaidesi konuları hakkında bilgi verdik."
