abstract: "Fıkıh eğitimi, İslâm hukukunun nesilden nesile aktarılmasında ve bireylerin ibadet ile toplumsal hayata ilişkin davranışlarının şekillenmesinde temel bir işlev üstlenmekte olup bilinçli bir dinî yaşamın oluşumunda merkezî bir konuma sahiptir. Bu araştırmanın temel amacı, Millî Eğitim Bakanlığı tarafından Anadolu İmam Hatip Lisesi ortaöğretim kurumlarında okutulan 10. sınıf Fıkıh ders kitabında yer alan bilgilerin ilmî doğruluğunu, klasik fıkıh literatürüyle tutarlılığını ve pedagojik açıdan öğrenci seviyesine uygunluğunu tespit etmek ve bu değerlendirmeler ışığında kitabın mevcut durumunu sistematik biçimde ortaya koymaktır. Çalışmada ayrıca, klasik kaynaklarda yer alan tanım ve hükümler bütününün günümüz öğrencilerinin düzeyine uygun biçimde nasıl anlamlı ve öğretilebilir bir yapıya indirgenebileceği sorusu da ele alınmıştır. Araştırma, nitel araştırma yöntemleri doğrultusunda yürütülmüş olup esas itibarıyla doküman incelemesi ve karşılaştırmalı analiz tekniklerine dayanmaktadır. Bu çerçevede AİHL 10. sınıf Fıkıh ders kitabı merkeze alınmış; ilgili konu başlıkları, ünite kazanımları ile tanım ve açıklamalar klasik fıkıh literatürü ışığında sistematik bir incelemeye tabi tutulmuştur. Elde edilen veriler içerik analizi yöntemiyle çözümlenmiş; kavramsal uyum, ilmî tutarlılık ve pedagojik anlatım boyutları ekseninde değerlendirilmiştir. Bu bağlamda elde edilen bulgular, ders kitabındaki temel kavram ve içeriklerin büyük ölçüde klasik fıkıh literatürüyle uyumlu biçimde yansıtıldığını ortaya koymaktadır. Bununla birlikte, bazı başlıklarda tercih edilen kavramsal indirgeme ve pedagojik sadeleştirmelerin, ilmî geleneğe bağlılık bakımından zayıflamalara yol açtığı görülmüştür. Bu değerlendirmeler doğrultusunda, ders kitabında yer alan bazı konuların yeniden gözden geçirilmesi, kimi başlıkların kapsamdan çıkarılması ve bazı yönlerinin ise geliştirilmesi gerektiği sonucuna ulaşılmıştır."
