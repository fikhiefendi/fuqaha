abstract: "17. yüzyıl fıkıh alimlerinden Çatalcalı Ali Efendi, üç Osmanlı Sultanı döneminde memuriyetler üstlenmiş ve 1632'den 1692 yılındaki vefatına dek süren 60 yıllık bir dönemde ifta makamında sayısız vakaya şahitlik etmiştir. Sultan 2. Süleyman, Sultan 4.Mehmed ve Sultan 2.Ahmed'in hükümdarlıkları süresince, kadılık ve şeyhülislamlık da dahil olmak üzere çeşitli meşihat görevlerinde bulunan Çatalcalı Ali Efendi hem ulema hem de avam tarafından farklı konularda başvurulan önemli bir şahsiyet haline gelmiştir. Çatalcalı Ali Efendi'nin“Fetâvâ-yı Âli”adlı eseri, görevlerinin etkisini ve fetvalarının muteberliğini yansıtan, döneminin ve sonrasının meşihat kadroları arasında temel bir referans kaynağı olarak değerlendirilen bir fıkıh kitabıdır. Bu çalışma, özellikle saray erkanının hizmetlerinde kullanılan kul ve kölelerin dışında, avam arasındaki yansımaları, toplum içindeki yerleşimi, hangi hizmetler için kimlerin kullanıldığı, bu hiyerarşik düzenin nasıl sağlandığı ve şer'i sınırlar çerçevesindeki kanunların bu konudaki yerini detaylı bir şekilde incelemeyi amaçlamaktadır. 17. yüzyıl Osmanlı sosyal yapısında sınıfsal düzen hakkında bilgiler sunacak olan bu çalışma, Fetâvâ-yı Âli Efendi'deki fetvalardan yararlanarak bu hiyerarşinin toplum üzerindeki yansımalarını ortaya koymayı hedeflemektedir."
