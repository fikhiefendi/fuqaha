abstract: "ÖZETŞer`iyye sicilleri, şehir tarihi araştırmalarında sosyal ve hukukî hayatının aydınlatılmasında birincil kaynaklardır. Bu siciller sayesinde o zamanda yaşamış toplumun hayatı ile ilgili önemli bilgiler elde etmekteyiz.Üzerinde çalıştığımız Üsküdar Kadılığı 420 Numaralı Şer`iyye Sicili Defteri Osmanlı'nın önemli merkezlerinden biri olan Üsküdar'ın 18. yüzyıldaki sosyal, siyasî, hukukî, iktisadî ve tarihinin tanınmasında birincil kaynaklardandır.Bu sicil defteri; alacak tahsili ve borç ikrarı, boşanma ve nafaka, darb, yaralama ve hakaret vb. davalarla ilgili olup toplam 461 belgeden oluşmaktadır.Tezimiz giriş kısmı ve metin transkripsiyonu olmak üzere iki kısımdan oluşmaktadır. Giriş kısmında, şer`iyye mahkemelerinin kısaca tarihleri ve görevlileri, şer`iyye sicilleri ve bu sicillerde bulunan belge çeşitleri ve şer`iyye sicillerinin önemlerine dair kısa açıklamalar yapılmıştır. Yine bu bölümde üzerinde çalıştığımız defterin tanıtımı yapılmış ve defterde yer alan köy ve mahalle isimleri verilmiştir.Giriş kısmından sonra orijinal metnin transkripsiyonu verilmiş ve sonunda sonuç ve bibliyografya verilerek çalışma bitirilmiştir."
