abstract: "Bu çalışmanın amacı, bankacılık sistemi ile ilgili temel kavramların açıklanmasından sonra, Türkiye'de ve Dünya'da bankacılık sisteminin tarihi gelişimi ve seyrinin incelenerek; faizsiz bankacılık sisteminin Türkiye ve Dünya genelinde yansımalarının açıklanması ve İsveç'te faaliyet gösteren JAK Medlems Bank'ın tarihçesi ile faaliyetlerinin incelenmesi ve Türkiye'de uygulanabilirliğinin derinlemesine mülakat yöntemiyle analiz edilmesidir. Çalışma üç bölümden oluşmaktadır. Birinci bölümde bankacılık sistemi ile ilgili temel kavramlar açıklanmış ve Türkiye'de ve Dünya'da bankacılık sistemi hakkında bilgilendirmelerde bulunulmuştur. İkinci bölümde, faizsiz bankacılığın doğuşu ve gelişimi hakkında bilgi verilmiş ve katılım bankacılığının Türkiye'de ve Dünya'da yansımaları incelenmiştir. Çalışmanın üçüncü ve son bölümünde ise, JAK Medlems Bank'ın tarihçesi ile faaliyetleri incelenerek, Türkiye'de uygulanabilirliği, derinlemesine mülakat yöntemiyle incelenmiştir. Sonuç bölümünde öneriler dile getirilmiştir. Çalışmanın amacına uygun olarak uzman kişiler ile mülakatlar yapılmış, bu kişilere kritik sorular yöneltilerek onların görüşleri çalışmaya eklenmiştir. Çalışmada literatür çalışması ve derinlemesine mülakat yöntemi kullanılmıştır."
