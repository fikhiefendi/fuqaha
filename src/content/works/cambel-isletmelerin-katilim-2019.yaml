abstract: "'Faizsiz Bankacılık' olarak bilinen ve günümüzde finans sektöründe hızla gelişen katılım bankacılığı uygulamalarının ilk örnekleri M.Ö. 2000'li yıllara kadar dayanmaktadır. Tarihsel süreç içerinde çeşitli aşamalardan geçerek bugünkü konumuna ulaşmıştır. Modern anlamda dünyadaki katılım bankacılığının ilk örnekleri 1960'lı yıllarda Mısır'da görülmüştür. Türkiye'de ise ilk olarak 1983 yılında çıkan Kanun Hükmünde Kararname ile 'Özel Finans Kurumu' olarak faaliyet göstermeye başlamışlardır. 5411 sayılı Bankacılık Kanunu'nda yapılan değişiklikle 2005 yılında 'Katılım Bankası' olarak diğer ticari bankalar ile aynı kanuni haklara sahip olmuşlardır. Katılım Bankacılığı dünyadaki payını her geçen gün arttırmaktadır. Dünyada büyük bankalar arasında yer alan Citibank ve HSCB başta olmak üzere birçok ticari bankanın faizsiz bankacılık işlemleri yapmak üzere kendi bünyelerinde birimler açtıkları görülmektedir. Dünyada da popülaritesi artmaya devam eden katılım bankacılığının bireyler açısından tercih nedenleri üzerine birçok çalışma yakın dönemde yapılmaya başlamıştır. Fakat işletmelerin tercih nedenlerini tespite yönelik araştırmalar sınırlı sayıdadır. Bu çalışmamızda; Türkiye'deki işletmelerin katılım bankalarını tercih etme nedenlerinin tespit edilmesi amaçlanmıştır. Bu doğrultuda; Bolu ilindeki işletmelerin katılım bankaları ile çalışma nedenlerini etkileyen faktörleri tespit etmek için 225 işletme yetkilisine (sahipleri, ortakları veya finans müdürlerine) anket uygulanmış ve SPSS 22 programı yardımıyla veriler analiz edilmiştir. Araştırmada, istatistiksel sonuçların ve örneklem bilgilerinin sayısal gösterimle özetlenebilmesi için betimleyici analiz, geliştirilen ölçeğin geçerlilik ve güvenilirliğini ölçebilmek için faktör analizi, ölçümü yapılan değişkenlerin farklılığını ölçebilmek için t- testi, bağımlı ve bağımsız değişken arasındaki ilişkilerin derecesini ölçebilmek için Pearson korelasyon analizi uygulanmıştır. Oluşturulan hipotezin testi ve katılım bankası tercihlerini etkileyen faktörlerin demografik değişkenlere göre (bağımsız değişken) farklılık gösterip göstermediğinin tespiti için varyans analizleri yapılmıştır. Elde edilen varyans analizleri sonucunda farklılık bulunması halinde, elde edilen farklılığa hangi değişkelerin neden olduğunun tespiti için tukey testi uygulanmıştır. Elde edilen bulgulara göre işletme yetkililerinin katılım bankacılığı tercihini en çok etkileyen etmenlerin ''Faizsizlik prensibi, İslami hassasiyetler ve şube personeli ile yakın ilişkiler'' olduğu dikkat çekmektedir. Katılım bankalarının şube yoğunluğunun az olması da önemli düzeyde etkin görünmektedir. Dini ve hümanist değerlerden taviz verilmemesi, şube personelinin rotasyonla veya tayinlerle çok sık değiştirilmemesi ve faizsizlik ilkesine sıkı sıkıya bağlanılması mevcut müşterilerin korunmasına yönelik öneri olarak sunulmuştur. Yeni müşteri kazanımlarında da özellikle mevduat bankaları ile rekabet edebilmek için güçlü enstrümanların geliştirilmesi, kısa süreli finansman desteklerinin arttırılması ve pazarlama faaliyetlerine önem verilmesi öneri olarak sunulmuştur."
