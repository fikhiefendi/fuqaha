abstract: "Bu çalışmada İslam devletinin tesis edildiği ilk yüzyıl içerisinde hâkimiyeti altına alıp yönettiği bölgelerde tatbik ettiği arazi hukuku, klasik kaynaklar çerçevesinde günümüz hukuk sistemlerinden ve kaynaklarından da yararlanarak sistematik bir şekilde incelenmiş ve İslam arazi hukukunun temel yapısını ortaya çıkarmak hedeflenmiştir. Arazi hukuku toprak hakkında konulan hüküm ve kaideler olup devlet sınırları dâhilindeki arazilerin mülkiyetini ve kullanılmasını düzenleyen hukuk dalıdır. Modern hukuk sistemlerinde arazi hukukunun yeterince işlenmesine ve kapsam alanının net olarak belirlenmesine karşın İslam hukuku klasik literatüründe arazi hukuku dağınık şekilde ele alınmış, modern çalışmalarda yeteri kadar incelenmemiş ve birçok problem sonuca kavuşturulamamıştır. Bu çalışmada İslam arazi hukukunun oluşumu, Hz. Peygamber ve hulefâ-i râşidîn dönemlerinde fethedilen araziler ve bu arazilerde tatbik edilen uygulamalar çerçevesinde, Roma İmparatorluğu, Sâsânî İmparatorluğu ve İslam'dan önce Arap Yarımadası'ndaki arazi hukuku uygulamaları göz önünde bulundurularak, teorik ve pratik bilgiler doğrultusunda tarihsel gelişimiyle hukuk perspektifinde incelenmiştir. Sonuç olarak Kur'an-ı Kerim'de arazi hukukunun oluşumu ve olgunlaşması bağlamında açık şekilde bilgilerin yer almadığı, İslam arazi hukukunun tekevvün ve tekâmülünün Hz. Peygamber ve ondan sonra gelen halifelerin uygulamaları çerçevesinde, hicri ilk asırda var olan çevre devletlerin hukuk sistemlerinden de etkilenerek oluştuğu gözlemlenmiştir. Ayrıca İslam devletinde fethedilen arazilerin zamanın siyasi, iktisadi, dini ve sosyal durumuna göre, Müslüman halkın maslahatına en uygun şekilde hükme tâbi olması gerektiği ve bu hükümlerin bölgelere ve devirlere göre farklılık gösterdiği tespit edilmiştir."
