abstract: "Şer'i hukukun teşekkülünde kavaid-i fıkhiyye'nin tesiri büyüktür. Fukahanın kelamından kavaid'in istihracı ,tedrisi ve yine kavaid üzerinden furuatın temellendirilmesi ve tatbik edilmesi,büyük önem arzetmesinin yanında kazandırdığı fıkıh araştırma melekesi,inceliklerin idrak edilmesi, teşri mekasıdının ta'yin edilip anlaşılması ve müçtehid imamların zihinsel kabiliyetlerini ve üstün çalışmalarını ortaya koyar. Kavaid, zevabt , ve akli olguların çalıştırılması ve fıkhın oluşumu için büyük bir servettir. Bu konu üzerinde alimlerin hayli müellafatı mevcuttur. İmam merğinani'nin Hidaye kitabı meselenin talili ve tevcihi yönü ile Hanefi mezhebinin en kuvvetli ve faydalı metni olup tam bir kavaid ve zavabit hazinesidir. Bu çalışmamda İ.merğinani'nin sarahaten veya işareten temas ettiği kavaidi ve zevabıtı Kitab'ul buyu'dan istihraç ettim. Her kavaidi akli ve nakli meaniyi imkan nispetinde şerh ettikten sonra , mukaddime, temhid ve üç fasıl olmak üzere toplam üç kısma ayırdım . Mukaddime, risalenin mevzusunu, seçme sebebi ve takip ettiğim usulü, içermektedir. Temhid kısmı ise İmam Merginani'nin biyografyası ve hidaye kitabının tanıtımı hakkında olup iki bahistir. Geri kalan üç kısım ise; Birinci fasıl ;kaide, dabıt ve benzer kelimelerin manaları aralarında ki farklar , neş'eti ve üzerinden geçen merhaleler . İkinci fasıl ; kaidelerin alfabetik sırası , delilleri ve terettüp eden furuat , Üçüncü fasıl ise ; Zevabit-i fıkhıyye'yi alfabetik sırasını ,delillerini ve terettüb eden fur'uatı içermektedir. Sonra önemli görmüş olduğum konulara işaret ederek risaleyi bitirdim. Araştırmacıların kolaylıkla konulara ulaşabilmesi için umumi bir fihrist ekledim. Rabbime Hamd ettikten sonra yalova üniversitesinde fıkıh ve usülü fıkıh ile meşgul bütün üstatlarıma sonsuz teşekkürlerimi arz eder ve özellikle bana vaktini ayıran kıymetli müşfik müşrifim PEHLÜL DÜZENLİ hocama ve TEMİM ELHELVANİ hocama en derin teşekkürlerimi sunarım."
