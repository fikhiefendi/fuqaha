abstract: "Hicrî V. asır İslâmî ilimlerin diğer dalları için olduğu gibi fıkıh usûlü için de bir dönüm noktası olmuş, birçok önemli eser telif edilmiş ve mütekaddimûn dönemi sona ererek müteahhirûn dönemi başlamıştır. Fıkıh tarihinde böylesine önem arz eden hicrî V. asırda yaşamış Şâfiî mezhebine mensup iki müçtehit olan İmâmü'l-Haremeyn el-Cüveynî (ö.478/1085) ve Ebü'l-Muzaffer es-Sem'ânî (ö.489/1096) fıkıh metodolojisi açısından birbirlerinden farklı tarzları yansıtmışlardır. Aynı fıkıh mezhebine mensup oldukları halde usûl anlayışlarında iki ayrı yaklaşım benimseyip usûlî meseleleri farklı metotlarla değerlendirmeye tabi tutmuşlardır. Cüveynî usûl-i fıkıh alanındaki meşhur eseri el-Burhân fî usûli'l-fıkh'ı Şâfiî mezhebinin genel tercihi olan mütekellimûn metodu ile kaleme alırken Sem'ânî ise Kavâtı'u'l-edille fi'l-usûl'ün mukaddimesinde de belirttiği üzere usûl-i fıkıh alanındaki bu eserini fukahâ metoduna bağlı kalarak yazmıştır.“Cüveynî ve Sem'ânî'nin Usûl Anlayışlarının Mukayesesi (Nesih Konusu Örneği)”isimli bu tezde Şâfiî mezhebinin mühim simâlarından olan bu iki müçtehidin usûl anlayışları, el-Burhân ve Kavâtı'u'l-edille isimli eserleri üzerinden, fıkıh tarihi boyunca hakkında birçok farklı görüş serdedilen nesih konusu özelinde mukayese edilecektir. Bu mukayese çalışması fıkıh usûlü literatüründe fukahâ metodunun“Hanefî metodu”, mütekellimûn metodunun ise“Şâfiî metodu”olarak anılması genel kanısını değerlendirmeye açacaktır."
