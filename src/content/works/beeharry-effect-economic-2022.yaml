abstract: "Ekonomik küreselleşme, malların, hizmetlerin, sermayenin, finansın, emeğin ve bilgi birikiminin serbest akışına izin vermek için ticaret engellerini kaldırarak ekonomiyi serbestleştirme ve kuralsızlaştırma sürecidir. Literatürde, küreselleşme kavramını ve küreselleşmenin ekonomik etkilerini inceleyen çok sayıda çalışma bulunmakta olup, ada ülkelerini konu alan araştırmaların kısıtlı kaldığı görülmektedir. Özellikle Hint Okyanusu adalarını inceleyen çalışma sayısı oldukça yetersizdir. Bu bağlamda çalışma, GSYİH, dış ticaret, Doğrudan Yabancı Yatırım (DYY), işgücü ve mali yardımları inceleyerek 1980-2020 dönemi için Hint Okyanusu adalarında ekonomik küreselleşmenin etkilerini analiz etmeyi amaçlamaktadır. Küreselleşme kavramını ekonomik, politik, ve kültürel küreselleşme olarak sınıflandırmak mümkündür. Yatırıma dayalı ekonomik küreselleşme kavramı gelişen teknolojiyle birlikte önce ticarete dayalı küreselleşmeye ve sonrasında teknolojiye dayalı küreselleşmeye dönüşmüştür. Devlet politikalarındaki değişiklikler, uluslararası anlaşmalarla ticaret birliklerinin oluşturulması, ikili anlaşmaların uygulanması, teknolojinin ve yeni üretim tekniklerinin geliştirilmesi gibi etkenler ekonomik küreselleşmeyi beraberinde getirmektedir. Bu küreselleşme süreci bilgi yayılımı, bilgi edinimi ve birikimi yoluyla ülkelerin büyümelerini teşvik etmektedir. Küreselleşmenin ülkeler üzerindeki etkileri birbirinden farklıdır. Gelişmiş ülkeler, teknolojiye kolay erişimleri olduğu için küreselleşmeden daha fazla yararlanmaktadır. Ancak, En Az Gelişmiş Ülkeler (EAGÜ) ara ürünlerini satın almak için gelişmiş ülkelere bağımlı olmak zorunda kalmaktadır. Bu durum dengesiz bir ticari ilişkiye neden olmakta ve EAGÜ nün ekonomik gelişimini olumsuz etkilemektedir. Ayrıca bu ülkeler, OECD ülkeleri için 11 saate kıyasla ortalama 65,4 saat sürebilen daha uzun sınır denetimi gibi engellerle karşı karşıyadır. Aynı şekilde, liman altyapısı gelişmemiş ve dolayısıyla daha az gemi barındırmaktadır. Bu olumsuzluklara karşın ada ülkeleri ittifaklar kurarak ve e-ticareti teşvik ederek küreselleşme sürecinde etkin olmaya çalışmaktadır. Bu ekonomik küreselleşme sürecinde en önemli iki bileşen uluslararası ticaret ve doğrudan yabancı yatırımlardır. Ekonomik küreselleşmenin bileşenlerinden biri olan uluslararası ticaret kavramı 16. yüzyılda Merkantilizm ile başlamıştır. Uluslararası serbest ticaretin, belirli koşullar altında, ülkeler için önemli refah artışları sağlayacağı varsayımı ile ülkelerin doğal ve kazanılmış üstünlükleri dikkate alan“Mutlak Üstünlükler Teorisi”,“Karşılaştırmalı Üstünlükler Teorisi”,“Faktör Donanımı Teorisi”, gibi teoriler geliştirilmiştir. Daha sonrasında ise bu teoriler ülkelerin coğrafya konuları, uzmanlaşma alanları ve demografik özellikler gibi faktörleri dikkate alan yeni ticaret teorileri oluşturulmuştur. Ülkeler uluslararası ticarete katılarak, teknolojik transferi kolaylaştırarak ve getirileri artırarak üretkenliklerini ve işbölümünü geliştireceklerdir. Ayrıca yönetsel yetenek, teknolojik bilgi ve girişimcilik kazandırılabilir. Dış pazarların daha iyi anlaşılması ve daha verimli bir üretim süreci ile firmalar uluslararası pazarda daha etkin rekabet edebileceklerdir. Ayrıca sürekli eğitim yatırımı ile insan sermayesi teknolojik ilerlemeyi daha hızlı kavrayabilecektir. Hint Okyanusu'ndaki ticaretin gelişimi Avrupa emperyalizminin hâkimiyetiyle beraber köle ticareti ve deniz korsancılığının artmasıyla açıklanabilmektedir. Hint Okyanusu birçok doğal kaynağa ve dünya ticaretinin yapıldığı yedi boğazdan üçü olan Malakka Boğazı, Hürmüz Boğazı ve Bab-ul-Mendeb Boğazı sahiptir. DYY, sermayenin bir ülkeden diğerine hareketinin yanı sıra bilgi ve teknolojik uzmanlığınının paylaşımı olarak tanımlanır. Mikro ekonomik DYY teoriler, firmaya özgü faktörleri dikkate alarak eklektik paradigma teorisi benimseyen yatırımları geliştirmeye odaklanan teorileri içermektedir. Makroekonomik DYY teorileri ise ülkeye özgü faktörleri dikkate almaktadır. DYY, ülkelerin yeterli üretim faktörü kapasitelerine sahip olduğunda dış ticaretin teşvik edilmesiy büyümeyi olumlu etkilemektedir. Adalar, stratejik konumları ve sahip oldukları doğal kaynaklar nedeniyle doğrudan yabancı yatırımlar için caziptir. Özellikle coğrafi konum açısından en önemli sektörü turizm sektörüdür. Dolayısıyla adayı ziyaret etmek isteyen turist sayısındaki artışın sürekliliği artan talebi karşılamaya yönelik otel yatırımlarının artmasına neden olmaktadır. Hint Okyanusu adalarına yapılan yabancı yatırımlar özellikle birkaç ülke üzerinde yoğunlaşmaktadır. Örneğin Hindistan askeri ve sağlık sektörlerine yatırım yapmakta ve ayrıca ticaret ittifakları kurmaktadır. Çin ise yoğunluklu olarak inşaat sektörüne yatırım yaptığı, ve İslami bankacılık, petrol ve telekomünikasyon sektörlerinde ise Arap ülkelerin hakim olduğu görülmektedir. Çalışmada incelenmiş olan adaları, Hint Okyanusu'nun batı ve doğu adaları olarak 6 ana ada ülkesi olarak sınıflandırılmak mümkündür. Doğu bölgesi, önemli bir ekonomik etkiye sahip olamayacak kadar küçük adalardan oluşmaktadır (Sri Lanka hariç). Batı bölgesi ise değerli kaynaklara sahip ve ekonomik olarak gelişen adalardan oluşmakta olup Komorlar, Madagaskar, Maldivler, Moritus ve Seyşeller Adaları'nı içermektedir. Komor Adası, 2007 yılında ticareti serbestleştirmeye başlamıştır. Buna rağmen ana sektörleri olan tarım, turizm ve balıkçılık istenilen ve beklenen düzeyde gelişim sağlayamamıştır. Ülke ekonomisi ağırlıklı olarak dış yardımlara bağlı olup 2010 yılında Yüksek Borçlu Yoksul Ülke olarak belirlenmiştir. Madagaskar ise 1980'lerin ortalarında serbest dış ticaret politikasını uygulamaya başladı. Uluslararası ticareti teşvik etmek için e-ticareti tanıttı ve liman altyapısını geliştirdi. Ancak, ülkede yaşanan siyasi istikrarsızlıklar ekonominin büyümesini olumsuz etkilemiştir. Maldivler, stratejik ortaklarla ticaret ittifakları kurarak yoğun ticari serbestleşmeyi teşvik etmektedir. Ancak enflasyon ve finansal kriz ticareti olumsuz etkilerken, DYY girişleri artma eğilimindedir. Moritus, iki ülke arasında mal ve hizmet alışverişini teşvik edecek ikili bir ticaret politikasını teşvik ederek ticaretin serbestleştirilmesine ve yatırıma büyük ölçüde destek vermektedir. Bununla birlikte DTÖ, COMESA ve SADC gibi çeşitli ticaret bloklarına katılarak ve daha düşük bir vergi oranı sağlayarak ihracat için mal üretimini teşvik eden bir ihracat bölgesi oluşturmaktadır. Seyşeller, serbest ticaret bölgeleri oluşturarak, dış ticaretin artmasına yönelik kanunlar çıkararak dış ticareti teşvik etmektedir. Bütün bu olumlu yaklaşımlarına karşın adaya oaln DYY girişlerinin seviyesi oldukça yetersiz kalmaktadır. Sri Lanka ise ekonomide ciddi bir bozulmaya neden olan çeşitli siyasi darbeler ve doğal felaketlerden zarar görmektedir. Çalışmada, küreselleşmenin büyüme üzerindeki etkisini değerlendirmekten ve değişkenler arasında nedensel bir ilişki olup olmadığı amprik olarak araştırılmıştır. Ampirik çerçevede, analizde neo-klasik büyüme modeli kullanılmış olup bağımlı değişken olarak GSYİH ve bağımsız değişkenler; DYY, ticari açıklık, nüfus ve finansal yardımlar olarak belirlenmiştir. Çalışmada, öncelikle değişkenlerin durağanlığını belirlemek için birinci ve ikinci nesil birim kök testlerini kullanılmıştır. Yatay kesit bağımsızlık testi, birinci nesil birim kök testlerinin daha verimli olduğunu göstermektedir. Analizin diğer aşamasında, değişkenler arasında uzun dönemli bir ilişki olup olmadığını araştırmak için panel eş bütünleşme testi kullanılmıştır. Ardından, bağımsız değişkenlerin bağımlı değişken üzerindeki etkisini belirlemek için nedensellik testleri gerçekleştirilmiştir. Analiz bulguları, homojen bir nedensellik olduğunu, GSYİH'nın dış ticareti, DYY ve nüfusu etkilediğini göstermektedir; aynı şekilde, mali yardımların da nüfusu etkilediği görülmektedir. Dolayısıyla daha eğitimli bir nüfusun daha üretken olacağı ve yabancıların karlı bir ülkeye yatırım yapmaya daha istekli olabileceklerini söylemek mümkündür. Heterojen nedensellik sonuçlarında ise dış ticaretin hem GSYİH'yi hem de ticaret yardımı etkilediği, sırasıyla DYY ve nüfusu etkilediği sonucuna ulaşılmıştır. Böylebir durumda ithal ikamesi politikasının ihracatı teşvik politikasından daha etkili olacağını söylemek mümkündür. Bu analizlerin yanısıra her ülke için nedensellik testleri yapılmıştır. Analiz sonuçlarına göre Komorlar adası için nüfusun GSYİH, DYY ve yardımları etkilediğini görülmektedir. Ayrıca yardımların GSYİH ve DYY'yi etkilediği ve GSYİH'nın DYY'yi etkilediği sonucuna ulaşılmıştır. Madagaskar için dış ticaret, nüfusu ve yardımları etkilemekte; yardımlar DYY'yi ve nüfusu etkilemektedir. Maldivler için GSYİH, DYY ve dış ticareti etkilemekte ve DYY'nin ayrıca dış ticareti etkilediği sonucuna ulaşılmıştır. Moritus için sadece dış ticaret DYY'yi etkilemektedir. Seyşeller için GSYİH yardımları etkilediği ve nüfusun DYY'yi etkilediği görülmektedir. Son olarak ise Sri Lanka için dış ticaret GSYİH'yi ve yardımları etkilediği ve GSYİH'nın da yardımları etkilediği sonucuna ulaşılmıştır. Analiz bulguları değerlendirildiğinde ada ülkeler için uygulamasının etkili olacağı düşünülen bazı öneriler yapmak mümkündür. Örneğin Komor Adaları için, kredi olanaklarına erişimi olan ve ülke nüfusunun eğitim seviyesinin arttırlmasına yönelik çabaların arttırılması ve iş kurmak için güvenli bir ortamın sağlaması ülke ekonomisini olumlu etkileyeceği söylemek mümkündür. Madagaskar'ın, tarife dışı engellerini azaltması KOBİ'leri desteklemesi ve çalışanlarına becerilerini geliştirmeleri için eğitim olanakları sağlaması önerilmektedir. Maldivler ise yabancı yatırımın önündeki engelleri azaltarak ve yeniliği teşvik ederek aktif yabancı katılımı teşvik etmesi ekonomi için büyük katkılar sağlayabilir. Moritus adasının daha fazla araştırma kurumu kurarak ar-ge çalışmalarına önem vermesi yeni ve yaratıcı fikirleri teşvik etmekte büyük rol oynayacaktır. Seyşeller ada ülkesinde ise bankalarının sağlamlığının iyileştirilmesi, iş kurma maliyetlerinin düşürülmesi ve teknolojik bilgi birikiminin arttırılmasıyla ekonomik büyümeye katkı sağlanabilinir. Son olarak, Sri Lanka ticaret engellerini azaltmaya, finansal sistemi iyileştirmeye ve işgücü hareketliliğini kolaylaştırmaya yönelik politikalar oluşturması ülkenin büyümesi için önemli adımlar olacaktır."
