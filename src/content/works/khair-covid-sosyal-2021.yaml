abstract: "II. Dünya savaşından bu yana yaşanan en büyük kriz olan COVİD-19, milyonlarca insanın ölümüne ve dünya ekonomisinde dikkate değer bir sarsıntıya neden olmuştur. Bu ekonomik ve sosyal kriz hükümetler için büyük zorluklara neden olduğu için bu çalışmada, COVİD-19 krizi ile birlikte ortaya çıkan önemli sorunlar ele alınmıştır. Öncelikle bu salgının sağlık sistemi ve sosyal etkileri üzerinde durulmuştur. Ancak salgının kontrol edilmesine yönelik olarak bütün ekonomilerin başvurduğu seçeneklerden biri olan kapanmanın ekonomiler üzerinde, üretimin düşmesi ve işsizliğin artması başta olmak üzere olumsuz etkileri olmuştur. Kapanmanın insanların yaşamsal varlığını korumaktır. Ancak bu kapanmaların ekonomiler üzerinde olumsuz etkileri olduğu bilinmektedir. Kapanmaların iktisadi olarak en fayda maliyet analizi farklı yöntemler ile analiz edilmiştir. Aynı zamanda İslam dinin bu tür salgınlar durumunda nasıl bir yaklaşımda bulunduğu ortaya konulmuş ve konveksiyonel yöntemlerle karşılaştırılacak şekilde analiz edilmiştir. Araştırmanın odaklarında birini oluşturmuştur. Kovid-19 başta sağlık olmak üzere kamu harcamalarının hızla artmasına neden olmuştur. Bir yandan ekonomilerin daralması ve dolayısıyla düşün vergi gelirlerine karşın kamunun ekonomileri desteklemek üzere çeşitli destek paketleri nedeni ile önemli düzeyde harcamalarının artması nedeni ile kamu açıkları yükselmiştir. Artan kamu açıklarının finansmanı için borçlanma ve para politikalarına başvurulmuştur. Salgının neden olduğu sorunlarla mücadele etmek için kamu kesimini başvurduğu konveksiyonel politika seçenekleri ile İslam ekonomisinin salgının neden olduğu ekonomik sorunlarla mücadele etmek için önerdiği politika seçenekleri analiz edilmiştir. İslam ekonomilerin tarihsel bu tür olağan dışı durumlarla mücadelede ne tür seçeneklere başvurulduğuna ilişkin tarihsel tecrübeler analiz edilmiştir."
