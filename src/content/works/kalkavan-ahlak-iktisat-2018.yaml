title: "Ahlak ve İktisat İlişkisi Temelinde İslam Ahlak Değerlerinin İktisadi Davranışa Olan Etkileri: Kazanma ve Harcama Konularında İş Dünyası Üzerine Ampirik Bir İnceleme"
