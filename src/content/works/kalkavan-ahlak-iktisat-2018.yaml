abstract: "İslam dindarlığı, ahlaki değerler ve bireyin iktisadi davranışları arasındaki ilişkiyi araştıran bu çalışma, genel kapsamda teorik bölüm ve uygulama-analiz bölümü olarak iki kısımdan oluşmaktadır. Teorik bölümde din-ahlak-iktisat ilişkisi birey ve toplum açısından tarihten bugüne incelenirken, uygulama bölümünde İslam ahlakının Müslüman bireyin iktisadi davranışına olan etkisi teorik bölümdeki araştırma dahilinde hazırlanan ampirik bir çalışmayla analiz edilmiştir. Bu araştırmada yöntem olarak; nicel ilişkisel (correlational) araştırma türü uygulanmış, anket (survey) yöntemi kullanılmak suretiyle veriler toplanmıştır. Bu şekilde iş adamlarının dini tutum ve değerleri, iktisadi tutum ve davranışları arasındaki ilişkiler araştırma modeline uygun şekilde incelenmiştir. Araştırmanın evreni iktisadi faaliyetini İstanbul'da yapan İTO'ya kayıtlı işletme sahibi olan iş insanlarıdır ve buna göre 478 geçerli örneklem sayısına ulaşılmıştır. Üzerinde çalışılan olguyu (fenomeni) ve faktörler arası ilişkiyi köklerine inerek daha iyi anlamak için regresyondaki etkilerin işleyiş mekanizmasını veya aracılık eden koşulları ortaya koymak gerekir.“Dindarlık, Kazanma/Harcama üzerinde nasıl etki gösterir?”sorusuna ancak aracı değişken (mediator) olarak kavramsallaştırılan, bağımsız değişkenin bağımlı değişken üzerindeki etkisini başka bir ilişki üzerinden açıklayan mekanizmanın analizi ile cevap vermek mümkündür. Çalışmanın amacına uygun olarak araştırma modellerinde; İslam Dindarlığı bağımsız değişken, İslam İktisat Değerleri ve İktisadi Rasyonalite faktörleri aracı (mediator) değişkenler, Kazanma ve Harcama bağımlı değişkenler olarak tasarlanmıştır. Din-ahlak-iktisat ilişkisi temelinde inşa edilmiş bu araştırmayla, nasıl sorusu ile girişimcilerin iktisadi tutum ve davranışları tanımlanmaya, neden sorusu ile de anlamlandırılmaya çalışıldı. Araştırmanın önemli bulgusu: Müslüman bir girişimcinin dindarlığının, kazanma (İslam'a uygun) davranışı üzerinde doğrudan anlamlı etkisinin zayıf olduğu, ancak bireyin İslam İktisat Değerlerini benimsemesi ve İktisadi Rasyonalite yaklaşımına karşıt olmasıyla birlikte güçlü bir anlam kazandığı tespit edilmiştir."
