abstract: "Bu çalışmada, rivayet tefsiri yöntemi, İmâm Taberî'nin Câmiʿu'l-beyân'ında ve İmâm Süyûtî'nin ed-Dürrü'l-mens̱ûr'unda Nûr Sûresi tefsirleri ekseninde mukayeseli-analitik bir yaklaşımla ele alınmaktadır. Araştırmanın amacı, her iki müfessirin nakledilen rivayetleri sunma ve kullanma yöntemlerini ortaya koymak; rivayetlerin nicelikleri, kaynakları, tevsîk edilmesi (sıhhatinin kontrol edilmesi) ve tefsir yöntemleri bakımından farklılıklarını belirginleştirmektir. Çalışmada, Nûr Sûresi'ne dair hadis ve âsârın izi sürülmekte; müfessirlerin isnad kullanımı, rivayet tenkidi ve aynı ayet hakkında farklı rivayetleri ele alış yöntemleri karşılaştırılmaktadır. Araştırmada, iki müfessirin ilmî birikimlerini ve kaynaklarının tarihsel bağlamını tetkik etmek amacıyla deskriptif (betimsel) ve tarihî metotlarla desteklenen mukayeseli-analitik yöntem esas alınmıştır. Elde edilen sonuçlar, İmam Taberî'nin tevsîk ve tenkitte daha titiz davrandığını ve ekseriyetle rivayetler arasında bir tercihte bulunduğunu göstermektedir. Buna karşın İmam Süyûtî'nin genellikle eleştirel bir yorumda veya tercihte bulunmaksızın mümkün olan en fazla sayıda rivayeti toplamaya yöneldiği görülmüştür. Bu çalışmada, Kur'ân-ı Kerîm tefsirinde köklü bir yöntem olan rivayet tefsirinin daha iyi anlaşılmasına katkı sağlanmakta ve tefsir ilminde mukayeseli çalışmaların ilmî değerine dikkat çekilmektedir. Araştırmada, klasik tefsir kitaplarında yer alan rivayetler üzerine çalışmaların sürdürülmesinin gerekliliği ve bu rivayetlerin, İslâm tefsir mirasına ilmî bir hassasiyetle hizmet edecek şekilde eleştirel bir tahkike tâbi tutulmasının zarureti vurgulanmaktadır."
