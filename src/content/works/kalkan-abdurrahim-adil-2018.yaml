abstract: "Bu çalışmamız, Hanefî fakihlerinden İbrahim el-Halebî'nin (ö. 956/1549) Mülteka'l-Ebhur isimli eseri üzerine Abdurrahîm el-Mar'aşî'nin (ö. 1149/1736) yaptığı Mu'âdil isimli şerhin edisyon kritiği ve değerlendirmesi üzerinedir. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın amacı, kapsamı ve yönteminden bahsedilmektedir. Birinci bölümde; Hanefî fıkhının istidlâl yöntemi ve literatürü ile Mülteka'l-Ebhur; temel aldığı eserler, önem ve özellikleri ile şerh ve tercümeleri bağlamında tanıtılmaktadır. Şerh faaliyetlerinin Hanefî fıkhına etkisi anlatılmakta, Mu'âdil şârihi Abdurrahîm el-Mar'aşî; hayatı, ilmî kişiliği ve eserleri ile tanıtılmakta, Mu'âdil şerhinin Hanefî fıkıh literatürü içindeki önemi, muhtevası, özellikleri, konularının işleniş tarzı ve faydalandığı kaynaklardan bahsedilmektedir. İkinci bölümde; Hanefî mezhebi içindeki görüşler hiyerarşisi, mezhep içi tercihler ve bu tercihler için kullanılan fetva lafızları ile Mültekâ'daki tercihlerle Mu'âdil'deki tercihlerin mukayesesi ele alınmaktadır. Üçüncü bölüm de ise; Mu'âdil'in edisyon kritiği, asıl nüshanın mukayese edildiği diğer nüshaların tanıtımı ve tahkikte izlenecek yol ve yöntem anlatılmaya çalışılmaktadır."
