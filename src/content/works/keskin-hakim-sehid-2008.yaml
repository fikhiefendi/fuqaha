abstract: "el-Hâkîm eş-Şehîd el-Mervezî'nin telif ettiği el-Kâfî adlı eser, Hanefî mezhebinin önde gelen isimlerinden İmam Muhammed'in (ö.189/804) ?el-Asl (el-Mebsut), el-Câmiu's-Sağir, el-Câmiu'l-Kebir? adıyla bilinen eserlerinin, tekrarlarının çıkartılması ve fıkıh bablarına göre tanzim edilmesi sûretiyle telif etmiş olduğu muhtasar bir çalışmadır. Eser, özellikle Hanefî fıkhının fürû meselelerine ait konuları içermektedir.Eserin, Kitâbu's-salât bölümüyle başlamış olması onun klasik fıkıh anlayışındaki tasniflerden farklı bir tasnif anlayışıyla kaleme alındığını göstermektedir. Öyle ki klasik fıkıh kitaplarında konular genelde Taharet bölümüyle başlamaktadır.Eserde müellif, konunun okuyucu tarafından anlaşılabilmesi için sade ve kolay bir üslup ele almış, bir muhtasar çalışması olması hasebiyle de konuları anlatırken fazla detaya inmeden daha öz bir şekilde okuyucuya aktarmaya çalışmıştır.Müellif, eserde geçen kavramların tanımlarına yer vermemiş, konular hakkında hükümleri belirtirken genelde Hanefî mezhebinin önde gelen isimlerinden İmâm-ı Âzam (ö.150/767), Ebû Yusuf (ö.182/798) ve İmam Muhammed'in (ö.189/804) görüş farlılıklarını belirtmekle birlikte bazen kendi görüşüne ve döneminin önde gelen hukukçularının görüşlerine de yer vermiştir.Kitabın müellif nüshası günümüze kadar ulaşmamıştır. Tespit ettiğimiz en eski nüshalardan biri Süleymaniye Kütüphanesi'nde bulunan Molla Çelebi nüshasıdır. Kitap, değişik zamanlarda şerh edilmiş olmasına rağmen günümüze kadar ulaşan en meşhur şerhi Serahsî'nin (ö.483/1090) el-Mebsut adlı eseridir.Bizim çalışmamız, eserin ilk konusunu teşkil eden Kitâbu's-salât bölümüdür. Bu çalışmamızda müellifin hayatı, yaşadığı dönem ve eserleri hakkında bilgi verdikten sonra en eski nüshayı esas alarak dört farklı nüshadan müellifin el-Kâfî adlı eserinin Kitâbu's-salât bölümünün tahkikini yaparak aslına en uygun metni oluşturmaya çalıştık."
