abstract: "Çalışmada nişanlanma müessesesi Osmanlı hukuku çerçevesinde ele alınmıştır.“Nâmzed”kavramı ile ifade edilen nişanlanmanın, Osmanlı'da önemsenen bir olgu olduğu anlaşılmaktadır. Bununla birlikte konuya ilişkin çalışmaların azınlıkta olduğu gözlemlenmektedir. Çalışmada İslâm hukuku çerçevesinde fıkıh kitapları, fetva mecmuaları taranmış, ayrıca konunun örfi boyutu nedeniyle Osmanlı'daki hukukî düzenlemeler incelenmiştir. Çalışmada müessese odaklı bir yöntem izlendiğinden Osmanlı dönemi bütüncül bir perspektifle ele alınmıştır. Bu kapsamda Osmanlı'da nişanlanmanın Tanzimat öncesi ve sonrası dönemde hukuk kaynaklarında yer aldığı görülmektedir. Bu durum, devletin nişanlanmaya verdiği önemi ortaya koymaktadır. Bununla birlikte hükümlerdeki farklılık, dönemsel bir bakış açısı farklılığını göstermektedir. Osmanlı hukukunda nişanlanma çerçevesinde dikkat çeken bir diğer husus, nişanlanmaya ilişkin anlaşmazlıklarda kızların şikâyet ve taleplerinin dikkate alınmasıdır. Bu çerçevede genellikle kızların istedikleri kişilerle evlenmelerine izin verilmiştir. Sicillere yansıyan uyuşmazlıkların genellikle nişanın bozulmasına ilişkin olduğu gözlemlenen bir diğer husustur. Bu durum, hukuk sistemlerinin toplumlardaki uyuşmazlık ve aksaklıklarla ilgilendiklerini göstermektedir."
