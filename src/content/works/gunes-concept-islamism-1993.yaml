abstract: "ÖZ ZÎYA GÖKALP SOSYOLOJİSİNDE İSLAMCILIK KAVRAMI GÜNEŞ, Tacettin Yüksek Lisans Tezi, Sosyoloji Anabilim Dalı Tez Yöneticisi: Doç. Dr. Kayhan MUTLU Eylül, 1993, 81 sayfa. Bu çalışma Ziya Gökalp sosyolojisinde en geniş anlamıyla islamcılık kavramının analitik bir değerlendirmesini; İslamcılık kavramının, Ziya Gökalp sosyolojisinin diğer iki ögesiyle, yani Batıcılık ve Türkçülükle ilişkisi bağlamında hedeflemektedir. Bu öğeler arasında İslamcılık İslâm'ın tüm siyasi ve toplumsal kurallarından sıyrılmış saf ahlakî bir dinin temsili olarak tasarlanmaktadır. Örf kavramıyla Gökalp, Batıcılık ve Türkçülüğün idealleriyle uzlaşabilen ahlakî bir dine ulaşmaya çalışır. Böylece Gökalp'in sosyolojisinde İslamcılık, Türkçülük ve Batıcılık modern Türk Ulusunun sosyal gerçekliğinin tamamlayıcı parçaları haline gelirler. Örf kavramı hakkındaki özgür] formülasyonuyla Gökalp, İslâm modernizminin bir prototipi olarak görülebilir. Onun fıkhın olanaklarını özlâ bir şekilde kullanışı İslâm modernistleriyle bazı paralellikler arzedebilir. bu çalışma da, böylece, Türk tarihi içinde lslâ«n modernizminin izini süfen bir girişimi temsil etmeJcye çalışmaktadır."
