abstract: "İslâm ceza hukukunda ihtiyat ilkesi şüpheye düşüren şeyi terk edip şüpheye düşürmeyen şeye yönelterek hem suçun sabit olması hem de suçluya haksızlık yapılmaması açısından önemli bir fıkıh kaidesidir. Suçların Allah hakkı ve kul hakkı olarak ayrılması sonucunda bu kaide özellikle Allah haklarına tekabül eden had cezalarında kendisini göstermektedir. Elinizdeki bu çalışma bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde ihtiyat kavramının etimolojik tartışmalarına değinilmiş ve bu ilkenin ceza hukuku açısından gerekliliği incelenmiştir. Ayrıca bu ilkenin fıkıh literatürü içerisindeki gelişiminden ve türlerinden bahsedilmiştir. Bununla birlikte suçların Allah hakları ve kul hakları tasnifinde ihtiyat ilkesinin nasıl bir etkisi olduğu konusu da ele alınmıştır. Tezin ikinci bölümünde had cezaları takdir edilen suçlardan zina, hırsızlık, sekr, kazif, hirâbe ve bağy mevzularında cezanın ihtiyaten düşürülme sebepleri incelenmiştir. Çalışmamızın sonucunda ihtiyat ilkesinden hareketle cezaların uygulanmasına mâni olan gerekçeler şüphe, ortaklık, şahitlikten dönüş, ikrardan dönüş, zaman aşımı, tövbe ve af şeklinde tespit edilmiştir. Araştırmamızda Hanefi mezhebi esas alınmıştır. Bununla beraber gerekli görülen bazı önemli hususlarda diğer mezheplerle mukayese yapılmıştır."
