abstract: "Hz. Âişe (r. anha), Hz. Peygamber (s.a.s.)'in yanında yetişmiş, dini konuların pek çok alanında temayüz etmiş ve edindiği bu bilgileri sonraki nesillere aktarmada önemli bir rol üstlenmiş kadın sahabîlerdendir. Sahabe neslinin önemli fakihlerinden birisi olan Hz. Âişe, farklı alanlarda birçok ilmi kendisinde toplayan bir müçtehidedir. Fıkha olan vukûfiyetinden dolayı fakihlerin görüşüne sık sık başvurduğu önemli şahsiyetlerden biri olmuştur. Hz. Âişe kendisine sorulan sorulara verdiği cevaplarla ve ortaya koyduğu fıkhî görüşleri ile yaşadığı zamandaki birçok meseleye ışık tuttuğu gibi sonraki dönemlerde de ortaya çıkan pek çok fıkhî konuda mezhep imamlarının başvurduğu bir kaynak olmuştur. Bu tezde Hz. Âişe'nin aile hukuku alanındaki içtihatları tespit edilerek bu içtihatların Hanefî mezhebindeki etkileri incelenmiştir. Bu etkiyi tespit edebilmek için Mâlikî Şafiî ve Hanbelî mezheplerinin görüşlerine de konuyla alakalı boyutuyla kısaca yer verilmiştir. Tezimiz bir giriş üç bölümden oluşmaktadır. Birinci bölümünde Hz. Âişe'nin nikâhla ilgili içtihatları ikinci bölümünde talak ile ilgili içtihatları üçüncü bölümde ise aile hukukuyla alakalı diğer içtihatları ele alınarak Hanefî mezhebi temelinde diğer üç fıkhî mezhebe yansıması incelenmiştir. Sonuç bölümünde Hanefî mezhebi Hz. Âişe'nin konuyla alakalı görüşlerini dikkate aldığı gibi pek çok konuda farklı düşündüğü sonucuna ulaşılmıştır."
