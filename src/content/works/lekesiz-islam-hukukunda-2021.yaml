abstract: "Her alanda temel hak ve özgürlükleri gözeten İslam hukuku, rehin akdi vasıtasıyla alacakları güvence altına almış ve bu doğrultuda düzenlemeler getirmiştir. Ticari hayatın canlı olduğu her yerde ihtiyaç duyulan bir teminat yöntemi olan rehin akdi, özellikle iktisadi yatırım araçlarının gelişmesiyle sıkça başvurulan bir yöntem olarak önümüze çıkmaktadır. Rehin akdi, gayrimenkullerin rehinini ifade eden ipotek işlemiyle birbirine yakın işlemlerdir. Ancak ipotek işlemi kökü itibariyle İslam hukukundan değildir ve beşeri hukuk sisteminde yer almaktadır. Bu durum bazı sorunları beraberinde getirmektedir. Söz gelimi İslam hukukundaki rehin akdinden farklı olarak ipotekte kabz için tescilin yeterli görülmesi birçok farklı hükmün açığa çıkmasına neden olmaktadır. Çalışmada rehin akdi ve ipotek işlemi genel anlamda incelenmiş, rehin akdinin en önemli unsurlarından olan kabz meselesi mezheplerin bakış açıları ve amaçları doğrultusunda işlenmiştir. Konunun temel özelliklerinden olan kabz meselesi ve rehin olarak verilen malın kullanımına dair hükümler ve ihtilaflar bütüncül bir bakışla ele alınmıştır. Bunların yanında rehin akdine benzeyen satış türleri de ele alınmış, söz konusu akit ve işlemlerle rehin arasındaki ilişki incelenmiştir. Fıkhın dinamik yapısının ayrılmaz unsuru olan örf ve teamüller de değerlendirilerek kabz işlemiyle hedeflenen teminat gayesini tescil işleminin sağladığı gözlemlenmiştir. Öyle ki, tescil işlemi vasıtasıyla teminat altına alınmış mal borçluya daha rahat ödeme imkânı sağlayacağı öngörülmekle beraber rehin alan tarafa yüklenen tazmin sorumluluğu ve külfeti böylece en az seviyede tutulmuş olur. Rehin verilmiş malda mülkiyeti giderici tasarrufta bulunmak rehin akdini tamamen iptal ederken ipotek işleminde tescil dolayısıyla rehin verilen malın başka birinin mülkiyetinde bulunması teminat vasfını gidermemektedir. İpotek işleminin resmi bir takım şekil ve şartlar etrafında kurulması alacaklının teminat gayesini daha fazla güçlendirici nitelik taşımaktadır. İpotek işlemi her ne kadar şekil ve bazı şartlar bakımından karşılıksız fazlalıklara ve meşru olmayan bazı uygulamalara müsait olsa da rehin akdi ve kabz işlemiyle amaçlanan hedeflerde birleştiği gözlenmiştir."
