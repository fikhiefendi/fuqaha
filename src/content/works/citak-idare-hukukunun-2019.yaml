abstract: "Yargısal içtihat, tikel-somut uyuşmazlık ile tümel-soyut kuralın tetâbuk etmediği yahut böyle bir kuralın hiç bulunmadığı hâllerde ortaya çıkan ve salt dedüksiyonun ötesinde, yargıca özgü zihinsel çabanın ürünü olan yargı kararıdır. Belli bir hukuk alanında yargısal içtihatların kurucu, kanunların (yazılı kuralların) ise tamamlayıcı konumda bulunması durumuna içtihadîlik denir. İçtihadîliğe emsâl karar doktrininin (stare decisis) eklenmesi hâlinde, Anglo-Sakson sisteminde görülen içtihat hukuku ortaya çıkar. Kıta Avrupası koşullarında gelişen Fransız ve Türk idare hukuku, içtihadî olmakla beraber, içtihat hukuku değildir. İdarî yargıç, hüküm verirken kullandığı öncüllerin muhtevasını (hukukun genel ilkelerini, idarenin sorumluluğuna ilişkin kuralları ve maddî vakıaların tavsifini mümkün kılan kavram setini) bizzat, içtihat yoluyla var etmiştir. İdarî yargıcı içtihat üretmeye sevk eden sebepler; yargı ayrılığının meşrulaştırılması (idarî olanın belirlenmesi) sorunu, Code civil'in (Medenî Kanun – Borçlar Kanunu) ekarte edilmesi, idarî kanunların yetersizliği / değişkenliği ve idarenin denetimi olgusunun siyasîliğidir. Hukukun varlık gayesi, statik değerler (güvenlik, düzen, öngörülebilirlik) ile dinamik değerler (hakkaniyet, değişim, özgünlük) arasındaki dengeyi sağlamaktır. İçtihadîlik bir yandan idare hukukuna esneklik, süreklilik ve intibak kabiliyeti kazandırırken, öte yandan hukukî güvenlik ve belirliliği tehdit eden ciddî sakıncalar doğurmaktadır. Fransa'da Conseil d'État ve doktrin, söz konusu mahzurların giderilmesi için muhtelif çözüm önerileri üzerine kafa yormaktadır. Türk idare hukuku camiası da içtihadîliği kendinde iyi bir özellik gibi görmekten vaz geçip, nötr bir vakıa olarak yeniden ele almalı ve değerler dengesini koruma yolunda, benzer bir arayış içerisine girmelidir."
