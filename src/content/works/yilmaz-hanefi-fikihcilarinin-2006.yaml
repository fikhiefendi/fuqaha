abstract: "Hanefi fıkıhçıları, ahkâm konusunda ortaya koydukları usul muvacehesindeSahih-i Buhâri'de olmasına rağmen bazı hadislerle amel etmemişlerdir. Tezimiz bukonunun araştırılmasına yönelik bir çalışmadır.Tezimiz bir giriş, iki bölüm, sonuç ve değerlendirmeden oluşmaktadır. Girişbölümünde, araştırmanın konusu ve önemi üzerinde durulmuş; kaynaklarındeğerlendirilmesi yapılmıştır. Hanefi mezhebi ve genel özellikleri, Reyciler ve Reytaraftarları ve Sahih-i Buhâri hakkında da temel bilgiler verilmiştir. Birincibölümde Hanefi fıkıhçılarının hadisleri değerlendirirken ileri sürdükleri şartları veBuhâri'den ahkâm hadislerini almama nedenleri açıklanmıştır. İkinci bölümde,Buhâri'de geçmesine rağmen Hanefilerin delil olarak almadıkları hususlar tespitedilmiş, Hanefilerin kendi delilleri ortaya konmaya çalışılmıştır. Bu amaçla,ibadetler konusunda yirmi dört, muamelatta yirmi, ceza hukuku konusunda yedi vedeğişik diğer meselelerle ilgili sekiz olmak üzere toplam elli dokuz tane hadistespit edilmiştir. Sonuç bölümünde ahkâm konusundaki Hanefilerin görüşlerinintemellerinin neler olduğu ve hadisleri tercih ve tefsir ederken dikkate aldıklarıunsurlara yer verilmiştir."
