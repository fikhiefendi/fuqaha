abstract: "Osmanlı dönemi hukuk anlayışını ve müellefatını/literatürünü tanımaya yönelik çalışmalar son zamanlarda artmış, ancak alan henüz yeterince aydınlatılamamıştır. Özellikle Osmanlı Hanefîliğinin mahiyeti ve sınırlarının belirlenmesi noktalarında birçok problem halen araştırılmayı beklemektedir. Bu araştırmada, İslam hukukunun belli bir dönemde ve coğrafyada uygulayıcısı olan Osmanlı devletinin hukûkî yapısını anlamaya yönelik olarak“müftâ bih”kavramı, bu hukukun bir temsilcisi sayılabilecek Atâullah Mehmed Efendi'nin Mecmûa-i Atâiyye adlı eseri çerçevesinde ele alınmıştır. Araştırma giriş, üç bölüm ve sonuçtan müteşekkildir. Birinci bölümde Şeyhülislâm Atâullah Mehmed Efendi'nin hayatı ve Mecmûa-i Atâiyye adlı eseri üzerinde durulmuş, tezin üçüncü bölümüne ön hazırlık mahiyetinde özellikle şer'iyye sicilleri merkezli yapılan çalışmalar doğrultusunda XVII ve XVIII. yüzyıllar Osmanlı aile yapısı hakkında bilgiler aktarılmıştır. İkinci bölümde müftâ bih kavramı Osmanlı öncesi ve sonrası şeklinde bir ayrım ile incelenerek kavramın mahiyeti belirlenmeye çalışılmıştır. Üçüncü bölümde Şeyhülislâm Atâullah Mehmed Efendi'nin Mecmûa-i Atâiyye'sinde nikah ve talak konuları ele alınmış ve burada nakledilen konulardan hâmişlerde râcih görüşe işaret eden kayıtlar aracılığı ile müftâ bih görüşler belirlenmiştir. Belirlenen bu görüşler ve tercih gerekçeleri perspektifinde Osmanlı'da müfâ bih görüşün daha çok kişiler ve eserler üzerinden şekillendiği, buna zaman zaman bazı hukûkî gerekçelerin de dahil olduğu sonuçlarına varılmıştır. Tespit edilen müftâ bih hükümler Osmanlı döneminde temel başvuru kaynaklarından Molla Hüsrev'in Düreru'l-Hukkâm Şerhu Gureri'l-Ahkâm adlı eseri ile mukayese edilerek hukûkî süreklilik irdelenmeye çalışılmıştır. Bu mukayese sonucu iki müellifin genellikle aynı tercihleri benimsedikleri; hükümlerin gerekçelendirilmesi, meselelerin detaylandırılması noktalarında ise küçük farklılıkların ortaya çıktığı görülmüştür."
