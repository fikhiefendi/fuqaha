abstract: "Bu çalışmada Molla Hüsrev'in Mir'âtü'l-Usûl adlı eserinden hareketle onun delil anlayışını tespit etmeye çalıştık. Molla Hüsrev'den önce yaşamış Hanefi usulcüleri, onun döneminde yaşayan ve ondan sonra yaşamış olan usulcülerin eserlerinden hareketle karşılaştırmalı olarak ele aldık. Müellifin bu eserler içerisinde en çok etkilendiği eser, Hanefi usulcü Pezdevî'nin, Uṣûlü'l-Pezdevî adlı eseri ile Sadreşşerîa'nin Tenḳīḥu'l-uṣûl adlı eseridir. Molla Hüsrev'in delilanlayışını ele aldığımız bu çalışmayı giriş ve iki ana bölüm şeklinde oluşturduk. Giriş kısmında müellifin hayatı, tahsili ve ilmi hayatı, fıkıh ve fıkıh usulüne dair eserlerine yer verdik. Birinci bölümü“Molla Hüsrev'in Delil Teorisi”şeklinde başlıklandırıp bu kısımda usul anlayışını tespit noktasında Kitap, Sünnet, bu ikisi arasındaki müşterek bahisler ve İcmâ deliline yer vermeye çalıştık. Tezimizin ikinci bölümünü,“Lafzî Mebhasler”başlığı altında oluşturduk. Bu kısmı, dilde konulduğu anlam itibariyle,anlamın açıklılığı kapalılığı itibariyle, anlama deâletin şekli itibariyle ve konulduğu anlamda kullanılıp kullanılmaması itibariyle dört başlık ve bunların alt başlıklarına ayırarak çalışmamızı neticelendirdik."
