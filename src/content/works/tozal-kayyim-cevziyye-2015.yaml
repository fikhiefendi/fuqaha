abstract: "Bu tez çalışmasında İbn Kayyim'in muhakeme usulüne dair görüşlerini tespit etmeye çalıştık. Tezimizin ilk bölümünde İbn Kayyim'in hayatını, ilmi şahsiyetini, yetiştiği ortamı ve eserlerini açıkladık. İkinci bölümde kadı, kadıda aranan nitelikler, davacı ve davalının nitelikleri, dava çeşitleri ve davada aranan şartlar hakkında genel bir bilgi verdik. Bununla birlikte kadı ve dava kelimelerinin terim ve sözlük anlamlarını da izah ettik. Üçüncü bölümde ispat yükünü ve ispat vasıtalarını açıkladık. İkrar, şahitlik, yemin, kasâme, liân, karine, kur'a, hâkimin şahsi bilgisi olmak üzere ispat vasıtalarını gerekli detaylarıyla birlikte açıklamaya çalıştık. Dördüncü bölümde ise bilirkişi, keşif, sorgulama teknikleri, iz bilimi gibi vasıtalarla delillerin toplanması mevzularına değindik. Ardından da toplanan bu delillerin değerlendirilmesi hakkında genel bir bilgi verdik. Zikrettiğimiz bu bölümlerde İbn Kayyim'in görüşleri hakkında bilgi vermekle beraber mezheplerin görüşlerini de izah ettik. Bu sayede okuyuculara muhakeme usulü konularındaki farklı görüşleri mukayese etme fırsatı vermeyi amaçladık."
