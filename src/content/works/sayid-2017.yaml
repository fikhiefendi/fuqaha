abstract: "Peygamberin sağlık eğitimi, bireyin sağlığını koruma yönünde hayatının her alanında karşılaştığı problemler esnasında kişinin yönlendirilmesi açısından İslam fıkhında önemli bir yer kapsamaktadır. Bu açıdan çalışmada Peygamberin sağlığa ve sağlığın korunmasına dair hadisleri baz alınmıştır. Çalışmama fıkhın temizlik metoduna uygun bir plan dâhilinde başladım. Şöyle ki birinci bölümde sağlık eğitimi kavramının sözlük ve terim manalarına yer verdim. Daha sonra Peygamberin sağlık eğitiminin toplum sağlığını korunmasındaki rolünü ve önemini açıkladım. Ardından sünnette bulunan eğitim modellerine ve toplumun bu yöntemleri algılama şekline ve sünnetin sağlık eğitimindeki hedeflerine yer verdim. Bu bağlamda sünnetlerde ve ayetlerde insanın beden ve çevre temizliğine dair görüşleri inceledim. Konu ile ilgili hadislerin tahricinin yanı sıra muhatabın ve mütekellimin söz konusu rivayetleri anlama yöntemlerine değindim. Ayrıca toplumun sağlık eğitiminde önemli bir yer tutan su, taş, toprak gibi temizlikte kullanılan araçları ve yararlanma yöntemlerini açıkladım. Akabinde bireyin bedensel temizlik eğitimi ile ruh sağlığını korumada veya kazanılmasında sünnete uygun sağlık tedbirlerini izah ettim. Ardından bireyin günlük yaşamında sağlığına zarar vermeyecek beslenme alışkanlığına, kullanacağı besin maddelerine ve Peygamberin besin maddelerinden yararlanma kültürüne yer verdim. Ayrıca Peygamberin hastalıklara karşı çaresizlere ümit aşılayan tedavi önerilerini de açıkladım. Nihayetinde yapılan bu çalışmanın Peygamberin konu hakkındaki hadislerinin derlenmesine ve ilgili ayetlerle desteklenmesine ayrıca okuyucunun yaralanmasına vesile olmasını temenni ederim. Anaktar kelimeler: Sağlık eğitiminde peygamberin metodu, Sünnette sağlık kültürü, Sünnette psikolojik rahatlık"
