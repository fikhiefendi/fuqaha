abstract: "Bu çalışma 1917 yılında kabul edilen Osmanlı Hukuk-ı Aile Kararnamesi (HAK) ile 1976 yılında kabul edilen ve 2001'de 82 sayılı kanunla bazı maddeleri değiştirilerek yeniden düzenlenen Ürdün Ahvâl-i Şahsiye Kanunu (ÜAŞK) arasında bir karşılaştırma niteliği taşımaktadır. 187 maddeden oluşan ÜAŞK'nun 73 maddesi, 22'sinin harfiyen ve 51'inin ise bazı ilave, çıkarma ve düzenlemelerle olmak üzeri doğrudan 156 maddeden oluşan HAK'nden tercüme edilmiştir. ÜAŞK'nda bulunan 12 maddenin, ele aldığı konu ve hemen hemen aynı hükümleri ifade eden metinleri bakımından HAK'nde benzerlerinin bulunduğunu tespit ettik. İki kanun arasında başka bir benzerlik yönü olarak, ÜAŞK'nun 183. maddesinin, kanunda açıkça hükme bağlanılmamış konularda HAK'nin esas aldığı Hanefi Mezhebi içindeki tercih edilen görüşün esas alınması gerektiğini hükme bağlaması sayılabilir.Söz konusu benzerliklerin yanında iki kanun arasında elbette bazı farklılıklar da bulunmaktadır. Bu farklılıkların iki çeşit olarak tespiti mümkündür:1) iki kanunun aynı konuda farklı hükümler getirmesidir, bunu 6 maddede görebiliriz. 2) iki kanundan her birinin diğerinde yer almayan bir meseleyi hükme bağlaması olup, bu her iki kanun açısından da geçerli açık bir özelliktir. HAK, Ehl-i kitap ile ilgili 46 adet madde içermekle birlikte, ÜAŞK bunların hiçbirine yer vermemiştir. HAK'nde ÜAŞK'unda bulunmayan ayrıca 7 madde daha vardır. ÜAŞK açısından baktığımızda ise bu kanunda HAK'nde bulunmayan 92 adet madde vardır. Diğer taraftan iki kanunun iç sistematikleri ve konu tasnifleri birbirinden farklıdır.Bu şekilde çalışmamızda iki kanun arasındaki benzerlik ve farklılıkları ortaya koymuş, iki kanun arasında görülen farklılıklarda bu farklılığın arkasında yatabilecek fıkhi gerekçeleri tartışmış ve ÜAŞK'nun tüm maddeleriyle HAK'nin gayrimüslimlerle ilgili maddeleri dışındaki maddelerini, orijinal fıkıh kitaplarını kullanarak şerh etmiş bulunuyoruz."
