abstract: "Zekât verilecek yerler bağlamında“fî sebîlillâh”isimli tezimiz giriş ve sonuç bölümleri hariç olmak üzere iki bölümden oluşmaktadır. Birinci bölümde; Zekât'ın kavramsal analizi yapılmış ve zekât verilecek sınıflar ana hatlarıyla incelenmiştir. İkinci bölümde ise; Zekât verilecek yerlerden biri olan“fî sebîlillâh”sınıfının kavramsal analizi, tefsirlerde bu kavramın nasıl değerlendirildiği, hadislerde hangi anlamlarda kullanıldığı, fıkıh mezheplerinin bu kavramın kapsamı ve sınırları konusundaki düşünceleri ve son olarak muâsır âlimlerin ve zekât kanunu hazırlamış bazı ülkelerin bu kavrama ilişkin çağdaş yaklaşımlar ele alınmıştır. Sonuç bölümünde ise araştırmamız sonucu elde ettiğimiz neticeyi özetledik."
