abstract: "Bu çalışmada Hz. Peygamber (s.a.s.) tarafından belirlenen zekât nisabları ve zekâtın temel prensiplerinden çıkarılabilecek vergi ilkeleri ele alınmıştır. İslâm'ın beş temel esasından biri olan zekât, bireyle toplum arasındaki ilişkiyi sağlayan en güçlü bağdır. Zekâtın farz olması için birtakım şartları vardır ki bunlardan biri de nisabtır. Nisab zekâtla mükellef olmak için sahip olunması gereken asgari mal miktarını ifade eder. Hz. Peygamber (s.a.s.), kendi toplumunda var olan temel mal varlıkları ve gelirler için birtakım nisablar belirlemiştir ki bunlar o dönemin zenginlik ölçüleri olarak kabul edilmiştir. Bu miktarda mal veya geliri olanlar zengin sayılarak zekât mükellefi kabul edilmiş, bu miktarın altında mal veya gelire sahip olanlar ise yoksul kabul edilerek zekâttan muaf tutulmuştur. Hz. Peygamber (s.a.s.) tarafından belirlenen bu nisabların özellikle de parasal servet nisabının geçen zaman sürecinde geçerliliğini koruyup koruyamadığı tartışılmakta ve günümüzde yeni bir nisab belirlenmesi ile ilgili birtakım öneriler gündeme getirilmektedir. Belirlenen nisab türlerinin ortalamasının esas alınması, gümüş ya da altının esas alınması, hayvansal servetin esas alınması ve gelir dağılımının esas alınması gündeme gelen başlıca önerilerdir. Ayrıca İslâm devletinde nassa dayalı olan sadaka, zekât, cizye, haraç, fey ve ganimet gibi gelirlerin kamu harcamalarını karşılayamaması durumunda, alınacak ilave vergilerin hangi esaslar çerçevesinde belirlenmesi gerektiği cevabı aranan önemli bir sorudur. Çalışmada, Hz. Peygamber (s.a.s.) tarafından belirlenen nisabların devlet başkanlığı sıfatı ile belirlendiği sonucuna varılmış, şartların zorlaması durumunda söz konusu nisabların ulü'l-emr/kamu otoritesi tarafından değiştirilebileceği ilkesel olarak savunulmuştur. Ancak İslâm dünyasının mevcut hâli dikkate alındığında bu nisabların değiştirilmesi ile ilgili tartışmaların faydadan çok ciddi zararlara yol açabileceği kanaatine varılmıştır. Bununla birlikte parasal ve ticari servet için esas kabul edilen 200 dirhem gümüşün günümüzde söz konusu servet türleri için nisab sayılamayacağı kanaatine varılarak gündemdeki alternatif öneriler arasında o dönemde de bedel olarak belirlenen 20 koyun değerinin esas alınması tercih edilmiştir. Nassa dayalı gelirlerin kamu harcamalarını karşılayamaması durumunda konulacak ilave vergilerin zekâtın temel prensipleri çerçevesinde belirlenmesi önerilmiştir. Anahtar Kelimeler: Matrah, Nisab, Oran, Sadaka, Vergi, Zekât,"
