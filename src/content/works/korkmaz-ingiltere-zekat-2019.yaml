abstract: "Zekât ibadeti, ayetlerde namaz ile birlikte zikredilen temel ibadetlerden biridir. Zekât, İslam'ın bir parçası olduğu kadar, Müslüman toplumlarda fakirlikle mücadele ve insanların refah düzeyini dengelemede toplumsal bir role sahiptir. Bu bağlamda, klasik zekât uygulamaları da nasslardan hareketle Hz. Peygamber dönemi ve İslam geleneğindeki uygulamalara bakılarak şekillendirilmiştir. İslam'ın ortaya çıkışından günümüze kadar, Müslümanların zekâtın toplanılması, dağıtılması ve kimlerin alıp kimlerin vermesi gerektiği hususlarındaki sorularına klasik zekât uygulamaları yanıtlar bulmaya çalışmıştır. Ancak günümüzde Müslümanların gayrimüslim ülkelerde büyük gruplar halinde yaşamaları, güncel fıkıh problemleri çerçevesinde zekâtın yeni alanlara mevzu olmasına sebep olmuştur. Zekâtın şeffaf ve güvenilir bir şekilde toplanıp hak sahiplerine dağıtılması gibi meselelerin devlet tarafından çözüme kavuşturulmadığı ülkelerde, bu ihtiyacın vakıflar ve dernekler tarafından karşılanmasını gerektirmiştir. Bu problemlere binaen bu tezde, İngiltere'de, dinî-sosyal boyutlarıyla zekâtın yönetilmesi hususuyla ilgilenen Ulusal Zekât Vakfı ve İslamî Yardım Derneği gibi iki köklü müessese üzerinden, kurumların zekât uygulamalarını açıklamak ve klasik zekât doktrini ile mukayese ederek eleştirel bir bakış açısıyla İngiltere'deki Müslümanların zekât ile ilgili sorunlarına nasıl çözümler bulmaya çalıştıklarını ortaya koymak hedeflenmektedir."
