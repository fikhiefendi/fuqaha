abstract: "Hidâye müellifi Ebü'l-Hasen Burhânüddîn Alî b. Ebî Bekr b. Abdilcelîl el-Mergînânî (v. 593/1197), Mâverâünnehir bölgesinde yetişmiş meşhur Hanefi âlimidir. Mergînânî'nin“el-Hidâye şerhu Bidâyeti'l-mübtedî”adlı eseri, Hanefî fıkhının en tanınmış ve muteber metinlerinden biridir. Mergînânî'nin bu eserinde icmâ' lafzıyla ifade edilen konular tesbit edilmiştir. Bu konuların İslam hukuk terimi olan icmâ' ile ilişkisi ele alınmıştır. Giriş ve sonuç bölümleri hariç iki bölümden oluşan çalışmamızın giriş bölümünde, Hidâye müellifi Mergînânî'nin hayatı, hocaları, ilmi kişiliği ve eserleri tanıtılmış, ardından İslam hukukunun kaynaklarından olan icmâ' hakkında kısa bilgiler sunulmuştur. Birinci bölümde, 'icmâ' lafzı kullanılarak ifade edilen konular ortaya konmuştur, ikinci bölümde de 'ittifak' terimi kullanılarak zikredilen konulara yer verilmiştir."
