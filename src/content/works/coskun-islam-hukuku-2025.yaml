abstract: "Son yüzyılda yaygınlaşan nüfus artışı, devletlerin dini, siyasi, ekonomik ve sosyal özelliklerine bağlı olarak miktarın artırılması, azaltılması veya sürdürülen iyileştirme amacıyla uygulanan politikalardır. Doğum kontrolü ise gebeliği geçici veya kalıcı olarak önlemek için kullanılan yöntem ve yöntemlerin genel adıdır. Doğum kontrolünün temel amacı, artan insan düzeninin belirli bir düzeyde sınırlanmasıdır. Nüfus planlaması ve doğum kontrolünün detaylı bir şekilde ele alındığı bu çalışma giriş ve üç bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu ve amacı, kapsamı, yöntemi ve sınırlılıkları ele alınmıştır. Birinci bölümde nüfus planlaması terimi üzerinde durulmuş tanımı ve tarihçesi anlatılmıştır. İkinci bölümde doğum kontrolü teriminin tanımı, tarihçesi ve geçmişten günümüze uygulanan doğum kontrol yöntemleri üzerinde durulmuştur. Üçüncü bölümde ise doğum kontrolü ve nüfus planlamasının İslam hukuku açısından değerlendirilmesi yapılmış, destekleyenlerin ve karşı çıkanların görüşlerine ve delillerine yer verilmiştir. Yine bu bölümde doğum kontrolü için uygulanan yöntemlerin de İslam Hukuku açısından değerlendirilmesine yer verilmiştir."
