abstract: "Bu tezin amacı, Muhammed b. Semâa'nın (ö. 233/847) hocası Muhammed b. Hasan eş-Şeybânî'den (ö. 189/804) naklettiği er-Rakiyyât ismiyle bilinen görüşlerinin Hanefî kitaplarından derlenip bir araya getirilmesidir. Araştırmanın önemi, müellifin ilmî konumundan kaynaklanmaktadır. Zira Şeybânî, Hanefî mezhebinin önemli müçtehid imamlarından biridir. Zâhiru'r-rivâye dışında kalan diğer eserler gibi Rakiyyât'ın da ilmi kıymeti inkâr edilemez. Zira kitap Hanefî mezhebindeki fetvaları içermektedir. Üstelik bu rivayetler, kendisiyle istişhâd edip onlara dayanan Hanefî alimlerinin büyük ilgi ve alakasını çekmiştir. Araştırmada Şeybânî ve İbn Semâa'nın şahsî ve ilmî hayatları yazılırken betimleyici tarihsel yöntem kullanılmıştır. Hanefî kitaplarında yer alan Rakiyyât'la ilgili rivayetlerin derlenip, bir araya getirilmesi, mükerrer olan fetvaların atılması ve rivayetlerin fıkıh konularına göre taksiminde analitik tümevarım yöntemi tercih edilmiştir. Rivayetlerin birbirleriyle uyumu ihtilafı ve rivayetler arasında tercih yapılmasında karşılaştırma yöntemi kullanılmıştır. Araştırmada ulaşılan neticelerden önemlileri şunlardır. Hanefî âlimler, Rakiyyât'da bulunan konulara kitaplarında değinmiş, konuyla ilgiyi bilgiyi Rakiyyât'tan aktarmış, bu hususlara önem vermiştir. Nâtifî, İbn Mâze, Ebu'l-Leys es-Semerkandî, Kudûrî ve Serahsî bu alimlerdendir. Rakiyyât isimli eser, günümüze ulaşamasa da içerdiği bilgiler, Hanefî âlimlerin kitapları aracılığıyla bilinmektedir."
