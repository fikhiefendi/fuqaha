abstract: "İslam hukukunda genel bir prensip olarak konusu mevcut olmayan bir akit sahih değildir. Fakat selem konusu mevcut olmayan bir akidin yapılamıyacağı şeklindeki İslam hukuku kuralına istisna olarak Şerîat'ta caiz kılınmıştır. Bu nedenle de bu akdin sahih olması için bir takım özel şartlarının bulunması gerekmektedir.?Tûsî ve Serahsî'nin el-Mebsût'ları Örneğinde Ca`ferî ve Hanefî Mezheplerine Göre Selem Akdi? adlı bu çalışmamızda insanların ihtiyaçlarına binaen caiz kılınan selem akdi bu iki mezhebin görüşleri görüşleri doğrultusunda incelenmeğe tabi tutulmuştur.Tezimiz giriş kısmı ve üç bölümden oluşmaktadır. Giriş kısmında araştırmanın önemi, amacı, yöntem ve kaynakları gibi başlıklar kısaca ele alınmıştır.Birinci bölümde Tûsî (ö. 460/1067) ve Serahsî (ö. 483/1090)'nin adı, nesebi, hayatı, tahsili, eserleri ve yaşadıkları dönem gibi başlıkları incelenmeğe çalıştık.İkinci bölümde genel bey` (satım) akdi ve bu akdin bir alt türünü oluşturan selem akdi hakkında genel bilgiler verilmiştir.Araştırmamızın son bölümünü oluşturan üçüncü bölümde ise Tûsî ve Serahsî'nin el-Mebsût adlı eserleri örneğinde Ca`ferî ve Hanefî mezheplerinin selem muamelesi ile ilgili görüşlerine yer verilmiş ve bazı değerlendirmelerde bulunulmuştur. Daha sonra ise sonuç kısmı ve kullanılan kaynakların listesi verilerek araştırma tamamlanmıştır."
