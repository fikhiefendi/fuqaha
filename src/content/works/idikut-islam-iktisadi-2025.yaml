abstract: "Bu çalışma, Çin'de 1980 sonrası dönemde İslam iktisadı ve İslami bankacılık alanında gerçekleşen kuramsal ve uygulamalı gelişmeleri tarihsel süreklilik içinde incelemektedir. Tez, iki ana bölümden oluşmaktadır: İlk bölümde, 1980–2024 yılları arasında Çin'de yazılmış yaklaşık 150 akademik çalışma kronolojik ve tematik olarak analiz edilerek, İslam iktisadına dair teorik yaklaşımlar, etik ilkeler ve küresel entegrasyon tartışmaları değerlendirilmiştir. İkinci bölümde ise Çin'deki İslami bankacılık tecrübesi üç dönem halinde sınıflandırılarak; Hong Kong ve Ningxia örnekleri üzerinden somut uygulamalar, kurumsallaşma süreçleri ve regülasyon çerçevesi karşılaştırmalı biçimde incelenmiştir. Çalışma, Çin'deki İslam iktisadı ve bankacılığı literatürünün sadece kavramsal değil, aynı zamanda politik, kurumsal ve küresel stratejilerle iç içe geliştiğini ortaya koymaktadır. Bununla birlikte, mevcut uygulamaların sınırlı kaldığı ve yapısal zorluklarla karşılaştığı vurgulanmaktadır. Tez, İslam hukuku temelli finansal sistemlerin Çin gibi kapitalist olmayan bir ülkede ne ölçüde karşılık bulabildiğini analiz ederken; bu sistemlerin, özellikle Kuşak ve Yol Girişimi bağlamında stratejik bir alternatif olarak yeniden yapılandırılabileceğini ileri sürmektedir. Bu yönüyle çalışma, Çin'de İslam ekonomisi literatürüne metodolojik katkı sunmakta ve gelecekteki araştırmalara disiplinlerarası bir zemin oluşturmaktadır."
