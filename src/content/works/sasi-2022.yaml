abstract: "Bu çalışma, Arap ülkelerindeki zekat müessesesi gerçeğini tanıyarak ve bu farizanın bu ülkelerin ekonomilerine katkıda bulunabileceği olumlu etkileri açıklayarak bazı Arap ülkelerinde kurumsal uygulama yoluyla zekatın ekonomik rolünü değerlendirmeyi amaçlamıştır. Amaçlarına ulaşmak için bu çalışma; Zaman serileri, kesit verileri ve panel veri metodolojisi için birim kök testlerinden oluşan istatistiksel yöntemler ve ekonomik ölçüm araçlarını kullanan nicel analiz yaklaşımına ek olarak konuyla ilgili literatürü izlemek ve incelemek için tümevarım yöntemini ve zekat gerçeğinin kurumsal uygulamada sunulmasında ve ekonomik rolünün boyutunun analiz edilmesinde analitik betimleyici yaklaşımı takip etmiştir. Çalışma şu sonuca varmıştır: kurumsal uygulama yoluyla zekat yükümlülüğünün, incelenen ülkelerde enflasyon oranlarını kontrol ederek ekonomik istikrarın sağlanmasına katkıda bulunmadığı, aksine, sonraki yıl enflasyon oranlarının yükselmesine katkıda bulunduğu ve zekat kurumundaki zekat tahsilatları artmaya devam ederse, bu yükseliş eğilimi yıldan yıla devam edeceği sonucuna varmıştır. Ayrıca zekat yükümlülüğüne ilişkin bazı makroekonomik değişkenler ve göstergeler üzerinde kurumsal uygulama yoluyla zekat yükümlülüğünün oynadığı ekonomik rolün boyutunda bir eksiklik bulunmasına ek olarak zekat yükümlülüğü, gelir dağılımındaki eşitsizlik oranları üzerinde çok küçük de olsa olumsuz bir etkiye sahiptir. Bu, Zekatın çıkarılması gereken her türlü maldan toplanamamasına ve düzenleyici yasaları uygulamadaki esnekliğe ek olarak, devletin denetimine bağlı kurumlara olan güvenin kaybolması sonucu, o ülkelerde Zekat müessesesi tarafından açıklanan zekat gelirlerinin ekonomik faaliyetin büyüklüğü ve gerçekliğine kıyasla düşük hacimli olmasına bağlanabilir. /"
