abstract: "Bu tez Prof. Dr. Mustafa ez-Zülemî'nin (ö. 1924) fıkıh usulü ilmine ilişkin çeşitli kitaplarında ele aldığı nesih konusu çerçevesinde neshin mefhumu ve hükümlerini açıklamayı hedeflemektedir. Bu çalışmanın önemi, nesih meselesini ve âlimlerin nesih etrafında dönen tartışmalarını ele almasından ileri gelmektedir. İmam Şâfiî'nin usul alanındaki Risâle'sini yazmasından sonra günümüze kadar neshi kabul edenler ve etmeyenler arasında ihtilaflar meydana gelmiştir. Mustafa ez-Zülemî, modern dönemdeki fıkıh usulünde -özellikle nesih meselesinde- payı olan âlimlerdendir. Zira o, kendi görüş ve eleştirilerinden bağımsız bir şekilde sadece nakil yapmakla yetinmemektedir. Bu çalışma onun et-Tibyân fi'n-Nesh ve el-Ahtâü'l-Usûliyye fî Cem'i'l-Cevâmi' kitabıyla sınırlandırılmıştır. Araştırmacı Şeyh ez-Zülemî'nin biyografisini ve ilmi eserlerini tetkik ederken tarihsel niteleme yöntemini, usulcülerin neshe ilişkin görüşlerini sunarken ve sonrasında bunları ez-Zülemî'nin görüşüyle karşılaştırırken de karşılaştırmalı analitik niteleme yöntemini izlemektedir. Araştırma bir takım sonuçlarla sona ermektedir. Ez-Zülemî neshi topluca ve tafsili olarak reddetmemektedir. Âlimlerin kabul ettikleri ve bu konuda yazdıkları nesih türünü kabul etmemektedir. O, nesih için başka şartlar vazetmiş, birçok âlimin nesih diye isimlendirdiği şeylerin asılda tahsis olduğunu iddia etmiştir. Bu araştırmadan elde ettiğimiz sonuca göre ez--Zülemî'nin neshe bakış açısının, bazılarının sandığı gibi bir inkârcı ve muhalefet görüşü olmadığı; aksine onun, neshi anlama konusunda selefin yöntemi üzere gitmeyi istediği anlaşılmaktadır. Nitekim onlar neshi müteahhirûnun kabul ettiği gibi sadece hükmün kaldırılması değil ya hükmün kaldırılması, ya âmmın tahsisi veya mutlakın takyidi yahut da mücmelin beyanı olarak kabul etmektedirler."
