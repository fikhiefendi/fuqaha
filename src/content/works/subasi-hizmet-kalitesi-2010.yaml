abstract: "Ürünün hizmet olduğu bankacılık sektöründe hizmetin müşteriler tarafından nasıl algılandığının bilinmesi çok önemlidir. Bundan dolayı bankalar hizmet kalitesini sürekli ölçmek ve memnuniyetsizlikleri ortadan kaldırmak durumundadır. Bu bağlamda bankalar müşteri memnuniyetini sağlayarak kuruma karşı güven oluşturmak ve müşteri sadakati oluşturmak durumundadırlar. Bankalar sunduğu hizmetlerle bir marka olmakta ve kurum imajını oluşturmaktadır. Bu çalışma, faizsiz bankacılık hizmeti sunan Katılım Bankasının ticari ve kurumsal müşterilerinin ilgili kurumun sağlamış olduğu hizmetlerdeki memnuniyetlerini sorgulanmış, kurum imajının müşteriler üzerindeki etkisini araştırmış ve hizmet kalitesi boyutları, banka imajı ve kuruma duyulan güvenin müşteri sadakatine etkilerini ortaya koymaya çalışmıştır."
