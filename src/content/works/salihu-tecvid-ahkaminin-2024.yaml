abstract: "Çalışma, tecvid ilminin tarihsel gelişimi, Hz. Peygamber döneminden itibaren nasıl şekillendiği ve modern dönemdeki durumunu ele alır. Tecvid kurallarının isimlendirilmesi ve bu kuralların uygulanma nedenleri üzerine odaklanır. Ayrıca, harflerin sıfatları, sâkin nûn ve tenvin ile ilgili kurallar, medlerin ahkâmı, sekte ve vakıf kuralları gibi konular detaylı bir şekilde açıklanmıştır. Bu kuralların hem teorik hem de pratik yönleri tarihsel süreçte değerlendirilmiş, erken dönem ve modern dönem alimlerin görüşleri ile desteklenmiştir. Bu tez, tecv'd ilminin temel kavramlarını ve tarihsel arka planını anlamak isteyenlere rehberlik etmeyi amaçlamaktadır. Tecvid ilmi, Kur'an-ı Kerim'in doğru ve güzel bir şekilde okunmasını sağlayan bir disiplin olarak Hz. Peygamber döneminden günümüze kadar gelişimini sürdürmüştür. Bu tez, tecvid kurallarının tarihsel arka planını ve bu kuralların isimlendirilme nedenlerini detaylı bir şekilde incelemektedir. Hz. Peygamber döneminde tecvid kuralları uygulamalı olarak aktarılmış, sahabe ve tâbiîn dönemlerinde de bu ilim nesilden nesile devam ettirilmiştir. Erken dönemde yazılı hale getirilen eserler, tecvid ilminin sistemleşmesinde önemli rol oynamıştır. Tezde, harflerin mahreçleri ve sıfatları, sâkin nûn ve tenvinin kuralları, med ahkâmları, sekte, idğam ve vakıf gibi konular detaylı şekilde ele alınmış, bu kuralların hem teorik hem de pratik yönleri tartışılmıştır. Çalışma ayrıca, erken dönem ve modern dönem âlimlerin görüşlerini de inceleyerek tecvid ilminin tarihsel gelişim çizgisini ortaya koymaktadır. Bu bağlamda, tecvid kurallarının uygulanma nedenleri açıklanmıştır. Tezin temel hedefi, tecvid ilmini tarihsel ve kavramsal açıdan derinlemesine anlamak isteyen araştırmacılara ve öğrencilere kaynak sağlamaktır. Böylece, bu ilmin tarih boyunca oynadığı önemli rolün daha iyi anlaşılması sağlanmaktadır."
