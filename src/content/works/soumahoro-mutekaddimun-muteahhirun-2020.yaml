abstract: "“Mütekaddimûn ve Müteahhirûn Dönemi Müfessirlerinin Ortaya Koydukları Tefsir Kurallarının Mukayesesi”adlı bu çalışma iki bölümden oluşmaktadır. Birinci bölümde tez konusuna ilişkin temel tanımlamalar ve değerlendirmesini yapacağımız konularla alakalı farklı görüşler ele alınmaktadır. İkinci bölümde ise Taberî ve Âlûsî'nin bakış açılarına göre tefsir kaidelerinin uygulanma keyfiyeti ortaya konulmaktadır. Bu çalışmada her iki müfessirin, Kur'an ayetlerini tefsir kaideleri temelinde yorumlamaları, söz konusu tefsir kaidelerini kabul eden diğer bazı müfessirlerin de teyidiyle birlikte değerlendirilmektedir. Teyitlere ise karşılaştırma yapıldıktan sonra yer verilmekte ve böylelikle Taberî ve Âlûsî'nin bu alandaki bilimsel kudret ve yetkinlikleri de isbat edilmiş olunmaktadır. Yanı sıra, tefsir kaidelerinin her bir müfessir için vazgeçilmez derecede öneme haiz olduğu da net biçimde ortaya çıkmış olacaktır. Bu çalışmayla ayrıca yapılmak istenilen, tefsir kaidelerinin Arap Dili, nahvi ve belâgatı gibi pek çok ilimden yararlanılarak oluşturulduğunu tespit etmenin yanı sıra, her bir tefsirin, tefsir kaideleri açısından kendine has meziyetleri olduğunu ve bazı tefsir kaideleri Fıkıh Usulü ağırlıklı olurken, diğer bazılarının da kıraat ilmi ya da makâsıd ilmi gibi daha farklı ilimleri merkeze alarak oluştuğunu ortaya koymaktır."
