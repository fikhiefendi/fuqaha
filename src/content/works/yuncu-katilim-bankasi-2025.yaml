abstract: "İslami finans denildiğinde aklımıza ilk olarak faizsiz bir sistem gelmektedir. Bu sistem; faiz yasağı başta olmak üzere, ticareti caiz işlemlere ve yatırımlarda belirli etik ilkelere ve esaslara uymayı gerekli kılmaktadır. Faiz hassasiyeti olan bireylerin ve ticaret yapan kurumların finansal ihtiyaçları karşılanırken ekonomik faaliyetlerin adaletli olması gerekmektedir. Çünkü İslami finansın temel prensipleri bulunmaktadır. Bunlar; faiz yasağı, risk paylaşımı, garar yasağı, etik kurallara uyum, varlığa dayalı işlemler, adalet ve eşitliktir. Burada yer alan etik kavramı alkol, kumar vb. ürünlerin ticaretinin yasak olmasını da içerisine almaktadır. İslami finansın temel araç ve yöntemleri bulunmaktadır. Bu yöntemler; murabaha, icâre, mudarebe, müşareke, selem, istisna ve teverruktur. Teverruk işlemi organize ve bireysel teverruk olarak ikiye ayrılabilir. Organize teverruk yöntemine, katılım bankası müşterisinin bankasına olan borcunu yeniden yapılandırılmak ve katılım bankalarına likidite sağlamak amacıyla kullanımına izin verilmiştir. Bu alanda kullanılan yöntemlere ve uygulanan operasyonlara katılım bankası çalışanlarının da katkısı önemlidir. Bu açıdan personellerin yaklaşımları konunun değerlendirilmesine katkı sağlayacaktır. Bu konuların detaylıca incelenmesi sayesinde İslami ilke ve esaslara uygun yeni yöntemlerin de ortaya çıkması muhtemeldir. Bu tür gelişmelerin personeller tarafından bilinirliği piyasadaki yeni modellemeler için zemin hazırlayacaktır. Bu araştırma, katılım bankası çalışanlarının teverruk uygulamaları hakkındaki bilgi düzeylerini ve algılarını incelemeyi amaçlamaktadır. Nitel araştırma yöntemiyle yürütülen bu çalışma, mülakat katılımcılarının teverruk işlemleri hakkında sahip oldukları bilgi seviyelerini, uygulama süreçlerini, fıkhi görüşlerini ve potansiyel gelişmelerle ilgili bakış açılarını ortaya koymayı hedeflemiştir. Araştırmada, bankacılık sektöründe uzun yıllar görev yapmış olan katılımcılarla yapılan derinlemesine görüşmeler yoluyla veri toplanmıştır. Toplanan veriler, yedi ana tema çerçevesinde analiz edilmiştir: (1) Katılımcıların teverruk işlemleriyle ilgili genel bilgileri, (2) bankada yapılan teverruk işlemleri hakkındaki görüşler, (3) klasik teverruk hakkındaki görüşler, (4) Türkiye'de teverruk borsasının kurulmasına yönelik görüşler, (5) organize teverruk işlemleri ve fıkhi sorunları, (6) konu hakkındaki AAOIFI ve TKBB standartları hakkındaki bilgi seviyesi, (7) global bir teverruk platformu kurma fikirleri. Araştırma sonuçları; katılımcıların çoğunun teverruk işlemleri hakkında sınırlı bilgiye sahip olduğunu, özellikle organize teverruk ve fıkhi sorunlar hakkında belirsizlikler yaşadığını ortaya koymuştur. Ayrıca, Türkiye'de kurulacak bir teverruk borsasının sektöre katkı sağlayabileceği görüşü baskın olsa da bu platformun kurulması sürecinde bazı zorlukların ortaya çıkabileceği ifade edilmiştir. Çalışma, katılım bankası çalışanlarının teverruk uygulamaları ve ilgili düzenlemeler konusunda daha fazla eğitim ve bilgilendirmeye ihtiyaç duyduğunu ve sektördeki bilgi eksikliklerinin giderilmesi gerektiğini vurgulamaktadır. Ayrıca, teverruk uygulamalarına dair fıkhi değerlendirmelerin önemi de bir diğer önemli bulgu olarak öne çıkmaktadır. Bu araştırma, teverruk uygulamalarıyla ilgili bilgi eksikliklerini giderme ve katılım bankacılığı alanında daha etkili uygulamalar geliştirme noktasında önemli bir temel sunmaktadır."
