abstract: "Tezde genel olarak Hanefîlerce kabul edilen hadis ve kıyas telakkisine dair usuli bilgiler verilip, Hanefî mezhebindeki kıyas uygulamasının bazı hadislerin reddine sebep olup olmadığı, reddediliyorsa buna sebep olan diğer gerekçelerin bulunması hedeflenmiştir.Bu bağlamda Hanefî kaynaklarına göre haber-i vâhidin Kur'ân, sünnet, umumû belva, sahabe uygulamaları ve kıyasa arzı işlenmiştir. Örneklerle kıyasın haber-i vâhide ve haber-i vâhidin kıyasa takdim edildiği kabul edilen hadisler incelenmiştir."
