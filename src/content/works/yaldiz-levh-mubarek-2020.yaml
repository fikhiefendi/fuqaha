abstract: "Bu çalışmada Konya Bölge Yazma Eserler Kütüphanesi 15 Hk 1032 numarada kayıtlı Levh-i Mübârek isimli eser incelenmiştir. Levh-i Mübârek, fıkıh konulu bir eserdir. Eserde fıkıh ilminin ibâdât (namaz kılmak, oruç tutmak, zekât vermek, hacca gitmek, dinin emir ve yasaklarını yaymak) bahsi ele alınmaktadır. Çalışmada eser transkripsiyonlu olarak Latin harflerine aktarılmış; eserdeki dil bilgisi hususiyetleri yazım, ses bilgisi ve şekil bilgisi başlıkları altında incelenmiştir. Dizin başlığı altında ise eserin söz varlığı verilmiştir. Levh-i Mübârek'te Osmanlı Türkçesine geçiş dönemi dil özellikleri yanı sıra Eski Anadolu Türkçesinin karakteristik gramer yapıları ve söz varlığından örnekleri de görmek mümkün olmuştur. Bu çalışmayla hem Eski Anadolu Türkçesiyle ilgili yapılan çalışmalara bir yenisini daha eklemek hem de Osmanlı Türkçesine geçiş döneminin anlaşılmasına katkı sağlamak amaçlanmıştır. Anahtar Kelimeler Levh-i Mübârek, Eski Oğuz Türkçesi, Osmanlı Türkçesine Geçiş Dönemi, Fıkıh"
