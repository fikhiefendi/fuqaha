abstract: "Hz. Peygamber zamanında Müslümanlar, hükmünü öğrenmek istedikleri meseleleri bizzat ona arz ediyorlardı. Onun vefatından sonra ise meseleler, dini iyi bilen ve birbirlerinden farklı şehirlerde bulunan sahâbîlere danışılmıştır. Bu durum zamanla, bu sahâbîler etrafında farklı ekollerin doğuşuna zemin hazırlamıştır. Söz gelimi İbn Mes'ûd'un etrafında Kûfe rey medresesi, İbn Abbâs ve İbn Ömer'in etrafında ise Medîne medresesi oluşmaya başlamıştır. Sahâbîlerden sonra o şehirlerde yetişen âlimler de onların fıkıh usûlünü devam ettirmişlerdir.“İbadetler bağlamında Abdullah b. Mes'ûd'un Ebû Hanîfe'ye Etkisi”isimli tezimiz iki bölümden oluşmaktadır. Birinci bölümde,fıkhî arka planını anlamak için İbn Mes'ûd'un hayatı incelenmiştir. İkinci bölümde ise, abdest, namaz, oruç, zekât ve hac konularında İbn Mes'ûd'un görüşlerinin, kendisinden birkaç nesil sonra Kûfe medresesinin temsilcisi olan Ebû Hanîfe üzerindeki etkisi incelenmiş ve ikisi arasında ne oranda bir farklılık olduğu tespit edilmeye çalışılmıştır. Sonuç olarak, iki âlim arasında yaklaşık üçte bir oranında farklılık olduğu görülmüştür."
