abstract: "Bu çalışma İslam fıkhında yemin konusunu ele almaktadır. Bu bağlamda yeminin lügat ve kavramsal çerçevesi, yakın kavramlarla ilişkisi, risalet öncesi ve sonrasında kullanım şekilleri ve gelişim süreci ortaya konulmaya çalışılmıştır. Çalışmanın esas bölümünde ise öncelikle Allah adına yapılan yeminler konusu olmak üzere, her biri ayrı birer başlık altında incelenen yemin ile ilgili İslâm fıkhındaki bütün konular, hayattaki kullanım alanlarıyla beraber bir bütün halinde sunulmuştur"
