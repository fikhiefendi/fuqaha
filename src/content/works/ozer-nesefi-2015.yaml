abstract: "Ebü'l Berekât en-Nesefî'nin (710/1310) El- Musaffâ'sının Fıkıh Tarihindeki Yeri ve Edisyon Kritiği Bu çalışma giriş, üç bölüm, sonuç ve el-Musaffâ'nın tenkitli metin kısımlarından oluşmaktadır. el-Musaffâ, ilm-i hilafla ilgili bir çalışma olduğu için girişte hilâfiyâta dair bilgilere ve eserlere yer verildi, şerh olduğu için de şerh ve şerh çeşitleri açıklandı. el-Musaffâ, Ebü'l-Berekât en-Nesefî tarafından Ebu Hafs en-Nesefî'nin el-Manzûme fi'l-Hilâfiyyat adlı eseri üzerine yapılmış bir şerhtir. Hanefi mezhebi içindeki ve Hanefiler ile Maliki ve Şafîî mezhepleri arasındaki görüş ayrılıklarından bahsetmektedir. Kitap on bölümden oluşmaktadır ve tertibi klasik fıkıh kitaplarının tertibi gibidir. Ebu Hafs en-Nesefi ve Ebü'l Berekât en-Nesefî'nin hayatları, hocaları, yaşadıkları dönemler ve eserleri hakkında bilgi verilmiştir. Ayrıca Ebü'l Berekât en-Nesefî'nin kitapları üzerine yapılan çalışmalar, eserlerinin yazmalarının bulunduğu kütüphaneler ve numaraları ayrıntılı olarak ele alınmıştır. Bu çalışmada, el-Musaffâ'nın yazmaları tanıtıldı, nüshalar arasındaki farklılıklar gösterildi, kendinden önce referans aldığı kaynaklar ve atıf sayıları belirtildi. Ayrıca kendinden sonraki dönemde yazılan eserlere etkileri üzerinde duruldu, kitaplar ve konuları belirtildi. el-Musaffâ'ya yapılan atıflar ve Ebü'l-Berekât en-Nesefî'nin tercih ettiği görüşlerin sonraki eser sahipleri tarafından da tercih edilmesi kitabın önemini göstermektedir. Bu çalışma yazıldığı günden bu güne başka teliflere kaynaklık etmiş kıymetli bir kitaptır. Anahtar Kelimeler: Nesefi, Musaffa, Hilafiyyat, Şerh, El-Manzume, Edisyon Kritik"
