abstract: "Bu tez; hukukun oluşum ve gelişimi hakkında, hukukun genel tarihi seyrini ve esas meşguliyet konusu olan ilişkinin hukuki niteliğini tespit faaliyetini dikkate alan, yeni bir açıklama modeli ortaya koymak iddiasındadır. Böylece İslam hukuku, Roma hukuku gibi hukuk sistemleri arasında daha nitelikli bir karşılaştırma zemini kurmak ve ilişkinin hukuki niteliğini tespit faaliyetini merkeze alan bir hukuk düşüncesinin geliştirilmesine katkı sunmak hedeflenmiştir. Bu amaçla; önce felsefe tarihinden ödünç alınan biçim kavramı marifetiyle hukukun oluşumu veya biçim kazanması açıklanmıştır. Daha sonra hukukun oluşum katmanları veya hukuki biçimin seviyeleri ele alınmış, bu seviyeler arasındaki ilişki açıklanmıştır. Hukukun oluşum ve gelişim seyri hakkındaki açıklama modeli oluşturulduktan sonra, bu model Hanefî-Osmanlı hukuk tecrübesine uygulanmıştır. Bu çerçevede Hanefî mezhebinin teşekkülü ve mezhebin Osmanlı Devleti'ndeki uygulaması; tartışmalı hukuki meselelerin değerlendirilmesi suretiyle ele alınmıştır. Çalışmanın neticesinde fıkhın oluşumu ile hukukun biçim kazanması hakkındaki açıklama arasında uygunluk bulunduğu tespit edilmiştir. Bunun yanında hukuki biçimin seviyeleri ve bu seviyeler arasındaki ilişki; Hanefî mezhebi, tahric ve tercih faaliyeti ile ulaşılan görüşler (fetvalar) ve bu görüşlerin hukuk uygulamasını yönlendirmesi (müftâ bih) üzerinden takip edilebilmektedir. Böylece hukukun oluşum ve gelişimi hakkında oluşturulmuş olan açıklama modeli, Hanefî-Osmanlı hukuku vasıtasıyla test edilmiştir. Bu temel bulgular yanında; İslam hukukunu diğer hukuk sistemlerinden ayıran temel özellik, ehl-i re'y – ehl-i hadis ayrımının ilkesi, ictihad kapısının kapanması olgusunun anlamı ve bu olgunun Osmanlı fakihleri tarafından nasıl algılandığı hakkında literatüre katkı sağlayabilecek bazı sonuçlara ulaşılmıştır."
