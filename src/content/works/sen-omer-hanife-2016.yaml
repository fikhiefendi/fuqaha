abstract: "(ŞEN, Medine, Hz. Ömer'in Ebû Hanîfe'nin Fıkhına Etkisi, Yüksek Lisans Tezi, Isparta, 2016) Hz. Peygamber (s.a.v.)'in rüyalarıyla ilmine işaret edilmiş olan Hz. Ömer (r.a.)'in ve İmam-ı Azam olarak şöhret bulan Ebû Hanîfe Nu'mân b. Sâbit b. Zûta b.Mah'ın fur'û fıkha ve fıkıh usûlüne olan katkıları, çözümsüz görünen meseleler için, Kur'an ve Sünnet ışığında akıl süzgecinden geçirip ortaya koydukları çareler takdire şayandır ve tüm Müslümanların kabulüdür. Hz. Ömer'in ve Ebû Hanîfe'nin hayatları, karakteristik özellikleri, uygulamalarında ölçü aldıkları prensipler açısından dikkat çekici bir benzerliğe sahiptir. Bu benzerliklerin paralelinde bir şey daha vardır ki o da, Ebû Hanîfe'nin ictihad sistematiğinin oluşumunda Hz. Ömer'in mühim bir etkiye sahip olmasıdır. Usûlde, Hz. Ömer'in Ebû Hanîfe'yi etkilemesinin pek çok sebepleri vardır. Hz. Ömer'in İslâm Hukuku'nun öncülüğünü yapmış olması göz önünde bulundurularak, değerli iki fakihin özellikle hüküm istinbatındaki yöntemleri açısından aynı zemin üzerinde olmaları sadece Hz. Ömer ile değil, aynı zamanda Ebû Hanîfe ile de ilgilidir."
