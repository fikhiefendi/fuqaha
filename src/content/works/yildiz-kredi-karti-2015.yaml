abstract: "Kredi kartı uygulaması son yüzyılda ortaya çıkmış ve konunun fıkhî durumuyla alakalı birçok farklı görüş ileri sürülmüştür. Bu çalışma, kredi kartı sisteminde yer alan taraflardan biri olan banka ile üye işyeri arasındaki ilişkinin fıkhî durumunu incelemektedir. Önce kredi kartının tanımı, tarihçesi ve çeşitleri zikredilmiş, ardından üye işyeri sözleşmesinin genel bir tasviri yapılmıştır. Üye işyeri sözleşmesinin hukuki niteliğiyle ilgili modern hukukçuların ve fukahanın görüşleri zikredildikten sonra bunlar değerlendirilmiş ve delilleri tetkik edilmiştir. Ayrıca sözleşmeden doğan karşılıklı hak ve sorumluluklar da fıkhî açıdan değerlendirmeye tabi tutulmuştur. Sonuç olarak, üye işyeri sözleşmesinin birkaç akitten mürekkep yeni bir akit türü olduğu tespit edilmiş ve bunun, klasik akit türlerinden birinin kapsamına girdiğiyle alakalı görüşler isabetli bulunmamıştır. Ayrıca sözleşme maddelerinden dinin temel ilkelerine aykırı olanlar tespit edilmiş ve sözleşmeden doğan hak ve sorumluluklar da bu açıdan incelenmiştir. Genel itibariyle, içerisinde faiz maddesi barındırmayan sözleşmelerin fıkhî açıdan ciddi sakıncalar taşımadığı sonucuna varılmıştır."
