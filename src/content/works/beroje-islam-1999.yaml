abstract: "ÖZET DOKTORA TEZİ İSLÂM CEZA MUHAKEMESİ HUKUKUNDA BEYYİNE KÜLFETİ ve İSPATA HAKİM ESASLAR Sahip BEROJE Danışman: Prof. Dr. Hamza AKTAN Erzurum - 1999. Sayfa: 342 Jüri: Prof. Dr. Hamza AKTAN“İslâm Ceza Muhakemesi Hukukunda Beyyine Külfeti ve İspata Hakim Esaslar”isimli tezimiz dört bölümden oluşmaktadır. Birinci Bölümde önce Beyyine, Beyyine Külfeti ve İspat kavranılan işlenmiştir. Tarihi gelişimi içerisinde belli başlı hukuk sistemlerinin ceza muhakemesindeki ispat olayına bakışı kısaca verilmiştir. Bundan sonra Kur'an ve Sünnet naslannda beyyine külfeti ve ispata hakim kılınması gereken esaslar araştırılmıştır. Beyyine külfetine esas teşkil eden naslann fıkıh literatüründe nasıl anlaşıldığı verildikten sonra, mesele ceza muhakemesinin karakteri açısından irdelenmeye çalışılmıştır. İkinci bölümde Muhakeme kavramı, ceza muhakemesi hukukunun gayesi, delil sistemleri ve bu hukukun üzerinde konsensüse varılmış bulunan temel ilkeler açısından İslâm Ceza Muhakemesi Hukukuna hakim kılınması gereken ispat esasları ele alınmıştır. Bu bölümdeki konunun daha iyi anlaşılması için, bazı konular önce günümüz ceza muhakemesi hukukunda ele alındığı şekliyle verilmiştir. Bundan sonra İslâm Ceza Muhakemesi Hukuku açısından meseleye kaynaklık eden naslar ve ictihadlar ile ceza muhakemesi hukukunda bu konuda hakim olan esasların neler olabileceği, hangi noktalarda günümüz ceza muhakemesi hukuku ile örtüştüğü, hangi noktalarda ayrıldığı tespit edilmeye çalışılmıştır. Üçüncü bölümde, İslâm Ceza Muhakemesi Hukukunda ispatta baş vurulabilecek deliller incelenmiştir. Özellikle ceza davaları açısından bu delillerin ispat değeri üzerinde durulmuştur. Klasik anlayışa göre kabul edilen delillerin dışında kalan delillerin de ispatta kullanılıp kullanılamayacağı, kullanılabilecekse hangi şartlarla kullanılabileceği ile ilgili farklı görüşler, naslann gayesi (makasıd-ı şerîa) ve günümüz hukuk anlayışı açısından ele alınmaya çalışılmıştır. Dördüncü bölümde ise, ispat faaliyetinde ceza muhakemesi hukukuna yardımcı olan kriminalistik (iz bilimi), adlî tıp, sorgu taktik ve teknikleri gibi ilimlerin ispat açısından önemi, bu bilim ve tekniklerle ne şekilde delil toplanabileceği teknik detaylara girilmeden verilmiştir. Nihayet suçun ispatı için muhakeme süreci boyunca toplanan delillerin nasıl değerlendirileceği, birbirini tutmayan deliller arasındaki çelişkinin (tearuz) giderilmesi hususlan incelenmiş ve nihâî hüküm safhasına kadar izlenmesi gereken esaslara yer verilerek konu bitirilmiştir."
