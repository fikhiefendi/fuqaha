abstract: "Kamu malları, sadece bir şahsın veya bazı şahısların mülkiyetinde olmayan, herkesin malı olan ve ondan yararlanma hususunda herkesin eşit olduğu şeylerdir. Buna örnek olarak cami, okul, yol, park, kamu araçları, uçak ve gemi gibi sivil hükümetin tesisleri, kamu yerleri, su ve elektrik gibi vatandaşların maslahatı için devletin inşa ettiği araç gereçler verilebilir. Genel olarak korunma mekanizması ile ilgili İslam hukukunda esas alınan naslar ve kaideler, kamu mallarının korunması ve onlara her hangi bir zararın verilmemesine kaynaklık teşkil etmektedir. Korunması açısından kamu malları, İslam hukukunda büyük bir öneme haizdir. Cami, yol, köprü, okul, hastane, arkeolojik alan, müze, saldırı durumunda veya silahlı çatışmalar esnasında söz konusu yerlerden alınan veya çalınan şeyler, korunması gereken kamu mallarındadır. Ayrıca ister küçük olsun ister büyük olsun, ister insanlar doğrudan ondan yararlansınlar ister yararlanmasınlar kamu mallarına zarar veren her hangi eylem, onu tamamen bozma hükmündedir. Kamu malları, uluslar arası kültürel ilişkilerde en fazla önem verilen alanlar arasında yer almaktadır. Bunlar aynı zamanda“kültürel varlıkların korunması”adı altında uluslararası himaye altındadır. Kültürel varlıklar, medeniyet ve milli kültürün ana unsurlarındandır. Ancak aslı, tarihi ve geleneksel ortamı hakkında mümkün olan bir kısım malumat elde edildikten sonra kültürel varlıkların değeri söz konusu olur. Başka bir ifade ile kültürel varlıklar, askeri amaçları taşımayan tesisler ve sivil nesnelerdir. Dolayısıyla fabrika, mühendislik yapılar, köprüler, çiftlikler, hastahaneler, ibadet yerleri ve okul gibi genel olarak sivil amaçlar taşıyan yapısı, konumu, amacı ve kullanımı bakımından aktif bir şekilde askeri amaçları olmayan nesnelerdir."
