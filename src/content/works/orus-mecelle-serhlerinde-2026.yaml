abstract: "Zarûret ilkesi, hukuk düzenlerinin olağanüstü durumlar karşısında esneklik kazanmasını sağlayan ve kuralların katı uygulanmasının doğurabileceği mağduriyetleri önlemeyi amaçlayan temel prensiplerden biridir. İnsan hayatını ve toplumsal düzeni tehdit eden istisnaî şartlar karşısında hukuk sistemleri, zarûret gerekçesiyle bazı yasakların geçici olarak uygulanmamasına imkân tanımış ve bireyin korunmasını esas alan düzenlemeler geliştirmiştir. İslâm hukukunda ise zarûret, yalnızca bir kolaylık ilkesi değil, şer'î hükümlerin maksadını koruyan merkezî bir hukuk teorisi olarak kabul edilmiştir. Bu yönüyle zarûret ile hukuk kuralları arasındaki ilişki, tarihsel süreç boyunca canlılığını korumuş ve Mecelle-i Ahkâm-ı Adliyye'de sistematik bir yapıya kavuşturulmuştur. Şâri'/kanun koyucu, mükellefin korunmasını esas alan bu hukukî ve sosyal gerçekliği dikkate alarak, zarûret hâllerinde hükümlerin tatbikine dair ayrıntılı ilkeler belirlemiştir. Bu çerçevede İslâm hukukçuları da zarûretin mahiyeti, sınırları ve uygulanma şartları konusunda kapsamlı değerlendirmeler yapmış, bu ilkenin keyfî bir istisna hâline gelmesini engelleyecek şekilde disiplinli bir hukuk kuralı çerçevesinde ele alınmasını sağlamışlardır. Böylece zarûret, belirli şartlara bağlı ve denetlenebilir bir ilke olarak hukuk sistemine dâhil edilmiştir. Bu çalışma, zarûret ilkesinin İslâm hukukundaki görünümünü Mecelle-i Ahkâm-ı Adliyye bağlamında ve özellikle şerh geleneği çerçevesinde incelemeyi amaçlamaktadır. Giriş bölümünde zarûret kavramının teorik çerçevesi çizilmiş, Kur'ân ve Sünnet'teki temelleri, uygulama alanları ve hükümlere etkisi ele alınmıştır. Birinci bölümde Mecelle'nin tanımı ve mahiyeti ile hazırlanış süreci ve Osmanlı hukuk tarihindeki yeri kısaca değerlendirilmiş, tez kapsamında istifade edilen şerhler tanıtılarak bu literatürün ilmî niteliği açıklanmıştır. İkinci bölümde zarûret kavramı, tanımı, şer'î dayanakları, amel etme şartları ve hukukî sonuçları bakımından ele alınmıştır. Üçüncü ve son bölümde ise zarûretle doğrudan ilişkili olduğu tespit edilen Mecelle maddeleri, Ali Haydar Efendi, Hacı Reşid Paşa, Âtıf Bey, Mes'ud Efendi, Ömer Hilmi Efendi, Ahmed Şükrü Bey, Süleyman Hasbi Efendi ve Bosnalı Ali Ulvi'nin şerhleri esas alınarak incelenmiş, bu şerhler günümüz Türkçesine aktarılmış ve karşılaştırmalı olarak tahlil edilmiştir. Elde edilen bulgular sonuç kısmında bütüncül bir değerlendirmeye tâbi tutulmuştur. Çalışmada ayrıca zarûret ilkesinin modern hukuk sistemleriyle irtibatı kurulmuş, zorunluluk hâli, hukuka uygunluk sebepleri ve istisnaî düzenlemeler bakımından Mecelle hükümleriyle çağdaş hukuk anlayışı arasındaki benzerlikler ortaya konulmuştur. Böylece zarûret ilkesinin sadece tarihsel bir fıkıh kuralı olmadığı aynı zamanda günümüz hukuk düşüncesine katkı sunan evrensel bir hukuk ilkesi niteliği taşıdığı gösterilmeye çalışılmıştır."
