abstract: "Haber-i vâhid, fıkhî meselelerin çözüme kavuşturulmasında mezhepler tarafından bazı şartlar ve yöntemler çerçevesinde delil olarak kullanılmıĢtır. Fıkhî meseleler üzerinde yapılan incelemelerde hem yöntemlerin hem de nasıl kullanıldığının tespiti mümkün olmakla birlikte nazarî arkaplanın da anlaşılması sağlanacaktır. Hanefî fıkhı incelendiğinde kendilerine özgü şart ve yöntemlerin başında haberi vâhidin sened açısından sağlam olması, Kur‟ân‟ın umumuna, mutlakına, meşhur habere, umûmü‟l-belvâya, selefin uygulamasına aykırı olmaması ve râvinin rivayetinin aksine davranış sergilememesi gelmektedir. Hanefîler, haber-i vâhidin icmâ, kıyas ve istihsan delilleriyle olan ilişkisinde kendi yöntemlerini geliştirmişlerdir. Şki haber-i vâhidin te‟âruzunu gidermek için öncelikle nesh, sonra iki haberden birini tercih, daha sonra cem ve tevfik, son olarak da tesakut yöntemini kullanmıĢlardır. Çalışmada Hanefî mezhebi temel alınarak namaz bölümündeki fıkhî meseleler, haber-i vâhid ile ilgili ileri sürülen Ģartlar ve kullanılan yöntemlerle ilişkilendirilerek tasnif edilmiş ve değerlendirilmiştir."
