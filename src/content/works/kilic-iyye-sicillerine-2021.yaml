abstract: "Bu çalıĢmada Devlet ArĢivleri BaĢkanlığı Osmanlı ArĢivi (BOA)‟nde MeĢihat ġer‟iyye Sicili Defterleri (MġH.SSC.d) fonunda bulunan 6864, 6920, 6916, 6913, 6874 numaralı XIX. yüzyıla ait Mardin Ģer‟iyye sicillerikaynak olarak kullanılmak suretiyle XIX. yüzyılda Mardin kadınının sosyal ve ekonomik hayat içerisindeki genel profilini çizmeyiamaçlamıĢtır. Kadınların aile içindeki rolleri, sosyal, ekonomik ve hukuk alanlarındaki hakları ve bunları ne oranda kullanabildikleri değerlendirilmiĢ, bu bağlamda kadınlar; aile, evlilik, niĢan, nikah, mehir, çok eĢlilik, boĢanma, nafaka, miras, vesayet baĢlıkları ile incelenmiĢtir. Mardin kadınının sosyal ve ekonomik yönü ise; mülk alım-satımı, mülk anlaĢmazlığı, alacak-verecek, vakıf, vekâlet, Ģahitlik, katl-yaralama, zina-tecavüz, gasp gibi baĢlıklarda değerlendirmeye tabi tutulmuĢtur. Bu aĢamada Mardin‟de Müslüman ve gayrimüslim kadınlar arası komĢuluk iliĢkileri ve gayrimüslim kadınların ihtida etmesi hususu üzerinde de durulmuĢtur. Sonuç olarak; Ģer‟î mahkeme kayıtları, kadınların birbirinden farklı konularda mahkemeye baĢvurup davalı veya davacı statüsünde irade beyanında bulunduklarını göstermiĢtir. XIX. yüzyıl Mardin kadını; din ve devletin kendisine tanıdığı haklarınfarkındadır ve bu hakları ihtiyaç duyduğunda ya da bir problem ile karĢılaĢtığındakullanmaktan geri durmamıĢtır. Kadınlar bazı durumlarda resmî iĢ ve iĢlemlerini bizzat kendi iradeleriyle temsil ederek bazı durumlarda ise vekil tayin ederek halletmiĢlerdir. Kadınlarla ilgili bilgi edinmeye çalıĢtığımız Mardin ġer‟iyyeSicilleri; XIX. yüzyıl Mardin Ģehrinin sosyal, ekonomik, hukuki yönleri ile birlikte diğer Ģehirlerde yaĢayan Osmanlı kadınlarına dair de bir izlenim oluĢturmuĢtur."
