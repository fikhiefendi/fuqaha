abstract: "İslami bankacılık, açık ve etik bir çerçeveye bağlılığı ile küçük işletmelerin büyümesini ve gelişmesini teşvik etme noktasında hayati bir rol oynamaktadır. İslam toplulukları içinde ve dışında risk paylaşımı ittifakları ve girişimciliği teşvik ederek, İslami bankalar alternatif finansal modellere erişimi kolaylaştırarak, önemli bir rol oynamaktadır. Bu çalışma, mevcut ve potansiyel yatırımcılara değerli öneriler sunmayı amaçlamaktadır; ekonominin, vatandaşların yaşam standartlarının, rekabetin ve verimliliğin artırılması için bu ihmal edilen sektöre odaklanmanın önemini vurgulamaktadır. Politika ve kurumsal altyapıların oluşturulması yoluyla, hükümet, özellikle Maliye Bakanlığı, İslami bankacılık alt sektöründeki küçük işletmelerin büyümesini kolaylaştıracak bir rol oynamaktır.Bu çalışmanın temel amacı, Somali'nin Hargeisa şehrinde İslami bankacılığın küçük işletme performansı üzerindeki etkisini incelemekti. Veri, küçük ölçekli işletme sahipleri ve üç ticari bankadan toplandı. Veri toplama aracı olarak anket kullanıldı ve veri analizinde Sosyal Bilimler İçin İstatistiksel Paket (SPSS) kullanıldı. Ayrıca veri sunumu için frekans/yüzde, regresyon ve katsayılarkullanıldı. Çalışmanın örneklemi 129 katılımcıdan oluşmaktadır. Araştırmanın bulguları, İslami Bankacılık ve Küçük İşletme Performansı arasında güçlü bir pozitif ilişki olduğunu gösterdi. R, İslami Bankacılık ve Küçük İşletme Performansı arasındaki korelasyonu gösterir. R= .811, İslami Bankaların Ürünleri ve Küçük İşletme arasında yüksek pozitif bir ilişki olduğunu göstermektedir. Bu, İslami bankaların finansal, memnuniyet ve performans gibi üç değişkenin durumu iyileştikçe arttığını göstermektedir. Çalışmanın genel bulgusu, özellikle Hargeisa'da, Somali'deki işletmelerin İslami bankacılık ürünlerine artan bir ihtiyacı olduğunu göstermektedir çünkü bu, onlara mal ve hizmetlerinin müşteri tabanını genişletrime ve daha iyi büyüme firsati sunmaktadır."
