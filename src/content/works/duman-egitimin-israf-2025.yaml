abstract: "Bu çalışma, israfın bireysel ve toplumsal etkilerini ele alarak, eğitim yoluyla bireylerde israf farkındalığı oluşturulup oluşturulamayacağını araştırmıştır. İstanbul'da üniversite öğrenimi gören öğrencilerden oluşan 40 kişilik bir örneklem grubuyla yarı deneysel bir yöntem uygulanmıştır. Doğru verilere ulaşmak için tüm katılımcıların israf farkındalıklarının benzer düzeyde olması gerekmektedir. Bu amaçla homojenlik testi yapılmış ve farkındalıklarının benzer düzeyde olduğu saptanmıştır. Katılımcılar, deney ve kontrol grubu olmak üzere ikiye ayrılmış; deney grubuna israf konusunda bilinç kazandırmayı amaçlayan eğitim verilmiş, her iki gruba da eğitim öncesi anket uygulanmıştır. Deney grubuna eğitimden sonra tekrar anket soruları sorularak eğitimden önceki ve sonraki yanıtları karşılaştırılmış. Araştırmaya derinlik kazandırması amacıyla katılımcılara açık uçlu sorular sorularak derinlemesine analiz yapılmıştır. Araştırma sürecinde hem nicel hem de nitel veri toplama teknikleri kullanılmış; nicel veriler Likert tipi ölçeklerle, nitel veriler ise açık uçlu sorularla elde edilmiştir. Elde edilen veriler, içerik analizi ve istatistiksel yöntemlerle değerlendirilmiştir. Eğitim öncesi ve sonrası sonuçlar karşılaştırılarak farkındalık, tutum ve davranış düzeylerinde meydana gelen değişiklikler analiz edilmiştir. Sonuçlar, israf eğitiminin bireylerin farkındalık düzeyini anlamlı biçimde artırdığını, tutumlarında olumlu yönde değişiklikler meydana getirdiğini ve israfı azaltmaya yönelik davranışlara yönelttiklerini ortaya koymuştur. Eğitim alan grubun israf konusundaki duyarlılığı artmış, günlük yaşamlarındaki tüketim alışkanlıklarında daha bilinçli tercihler yaptıkları gözlemlenmiştir. Bu çalışma, kısa süreli bir eğitimin dahi bireylerin israfla ilgili tutumlarını değiştirmede etkili olabileceğini göstermiş ve benzer farkındalık eğitimlerinin yaygınlaştırılması gerektiğini vurgulamıştır."
