abstract: "Bir kimse, sadece yetiştiği asrı değil; o asra rengini veren hadiseleri ve fikirleri de temsil eder. Söz konusu şayet, bir âlimin fıkhî görüşleri ise bu durum, dönemin sosyal vakıalarını, hukuk sistemini ve ilmî atmosferini yakından tanımayı gerektiren bir durum arz edecektir. Çünkü ictimâî hayat ile yakından bağlantısı olan fıkıh sadece ibadet hayatımızı tanzim eden ameliyelerle; yani ferdin Allah Teâlâ ile arasında olan münasebetle sınırlı kalmaz; ferdin diğerleri ve toplumla olan ilişkilerini de yakından takip eder. Buradan hareketle Leknevî, her ne kadar 18. yüzyıla tanıklık eden bir şahsiyet olsa da, onu sadece kendi zamanındaki hadiselerle değerlendirmek, hakkında kayda değer bir bilgi sahibi olmak için yeterli olmayacaktır. Dolayısıyla Leknevî'nin hayatı, ilmî kişiliği ve fıkıh ilmindeki yerinin konu edinildiği çalışmamızda onu yaşamıyla olduğu kadar yazdıklarıyla da ele almaya; günümüzde tazeliğini koruyan birçok meseleye bakışını görebilmeye ve eserlerinde kendini bize aksettirdiği kadarıyla tanımaya çalıştık. Çalışmamız, biri sonuç olmak üzere üç bölümden müteşekkildir. Giriş bölümü tezin konusu, amacı, yöntemi ve sınırlandırılmasına dair şekilsel ve teknik incelemeleri; ilk bölüm yaşadığı dönem ile alakalı araştırmaları, hayatını ve eserlerini ihtiva ederken; ikinci bölüm fıkıh ilmindeki yeri, risaleleri ve muhtelif konulara dair fikirlerini içermektedir."
