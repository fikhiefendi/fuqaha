abstract: "Bu çalışmamızda; Allah Resûlü'nün (s.a.v.) sahâbîlerinden ve üç şairinden ikincisi olan Hz. Ka'b b. Mâlik'in hayatı ve günümüze ulaşan rivayetleri ele alınmıştır. Hz. Ka'b b. Mâlik, hicretten yaklaşık yirmi yedi (27) yıl önce Medine'de dünyaya geldi. Medine halkı arasında İslâm dinine ilk girenlerden oldu. Hz. Ka'b, İslâm tarihinde büyük bir öneme sahip olan İkinci Akabe Biatı'na katılmıştır. Hz. Ka'b, İslâm dininin Medine'de yayılması için büyük gayret sarf etmiştir. O, Allah Resûlü'nün katıldığı savaşlardan Bedir ve Tebûk hariç bütün savaşlara katılmıştır. Çalışmamızın temel hedefi, söz konusu sahâbînin kişiliğini, rivâyetlerini ve tabiîn ravilerini ve onlarla olan rivayet ilişkilerini tespit edip kaynaklardan istifade ederek ortaya koymaktır. Çalışmamız iki bölümden oluşmaktadır. Çalışmanın birinci bölümünde; Ka'b b. Mâlik'in kimliği, kişiliği, hayatı, vefâtı ve Hz. Peygamber (s.a.v.) ile olan münasebeti; tabakât, ricâl, tarih ve siyer kitaplarından istifade edilerek tespit edilmeye çalışılmıştır. Çalışmanın ikinci bölümünde ise; Ka'b b. Mâlik'in râvilerini ve Allah Resûlü'nden naklettiği hadisler ve bu hadislerin Kütüb-i Tis'a'daki dağılımı ele alınmıştır. Bu doğrultuda Hz. Ka'b'a ait hadislerin metinleri yazılarak tercümeleri yapıldıktan sonra senet ve metin açısında incelenip tahriçleri yapılmıştır. Daha sonra da söz konusu hadislerin senetlerinde geçen râviler cerh ve ta'dil kitaplarından incelenip haklarında kısaca bilgi verilmiştir. Buna ilaveten rivâyetlerin diğer tariklerinde geçen sened ve metin farklılıkları ilgili hadislerin değerlendirme kısmında tespit edilmiştir. İlgili sahâbînin Kütüb-i Tis'a'da geçen kaynaklarına göre toplam rivâyet sayısı tekrarlarıyla birlikte 102 adet olup Kütüb-i Tis'a'daki dağılımı şöyledir: Buhârî'de 16, Müslim'de 11, Ebû Dâvud'da 10, Tirmîzî'de 4, Nesâî'de 11, İbn Mâce'de 7, Muvatta'da 1, Dârimî'de 7, Ahmed b. Hanbel'in Müsned'inde ise tekrarlarıyla beraber 35'dir. Böylece Kâ'b b. Mâlik'in en çok Rivâyeti Ahmet b. Hanbel'in Müsned'inde geçerken an az rivâyetî ise İmam Malik'in Muvatta'sında yer almaktadır. Hz. Ka'b b. Mâlik, hicretten yaklaşık yirmi yedi (27) yıl önce Medine'de dünyaya geldi. Medine ahalisi içerisinde İslâm dinine ilk girenlerden oldu. Hz. Ka'b, İslâm tarihinde büyük bir öneme sahip olan İkinci Akabe Biatı'na katılmıştır. İslâm dininin Medine'de yayılması için büyük gayret sarfetmiştir. O, Allah Resûlü'nün katıldığı savaşlardan Bedir ve Tebûk hariç bütün savaşlara iştirak etmiştir."
