abstract: "Ekonomide vadelerine göre ayrılan temel iki finansal piyasa bulunmaktadır. Para ve Sermaye Piyasaları olarak adlandırılan pazarda fonlama maliyetleri ve fonlama yöntemleri açısından farklılıklar bulunmaktadır. Bu piyasaların işlevleri ve işleyişleri farklılıklar göstermekte ve ekonomiye etkileri farklı boyutlarda olmaktadır. Giriş bölümünden sonra, ikinci bölümde bu iki temel piyasanın farklılıkları, işlevleri ve işleyişleri incelenmiştir. Fonlama yöntemleri ve piyasalar hakkında bilgiler verilmiştir. Fonlamaların şirketler üzerindeki maliyetleri incelenmiştir. Üçüncü bölümde, ilk ortaya çıktığı andan itibaren özellikle de 2008 finansal krizinden sonra sürdürülebilir bir büyüme yaşayan İslamî Finansın dünyada ve ülkemizde gelişimi, temel prensipleri ve fonlama yöntemleri araştırılmış ve analiz edilmiştir. Dördüncü ve son bölümde, İslamî usullere uygun bir borsanın kurulmasının gereksinimleri ve dünyada örnekleri ve benzerleri olup olmadığı incelenmiştir. Böyle bir borsa kurulması durumunda olası etkiler incelenmiştir. Borsaya kote olacak şirketlerin hangi şartları taşımaları gerektiği ve dünyada henüz bir örneği bulunmayan böyle bir borsanın piyasaları üzerine analiz yapılmıştır. Sonuç olarak böyle bir borsa kurulması durumunda ülke ekonomisi ve bölgesel etkilerinin sonuçları çıkarılmıştır."
