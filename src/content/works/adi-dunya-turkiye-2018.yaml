abstract: "İslamî finans, faizden kaçınan Müslümanların yatırım ve tasarruf ihtiyacı duyulması için her zaman yeni bir yönetim oluşturmaktadır. Böylece sukuk (kira sertifikaları), İslamî finans buluşanlarından ürünü ve katılım bankaların araçlarından biridir. Sukuk, eş değeri, şeri ilkelere dayanması, varlığın mülkiyeti hakkı vermesi ve kâr – zarar ortaklığına dayanması sertifikadır. Sukuk, devletler ihtiyaçları karşılaması, projeler finanse etmesi ve likitide sağlanması hisse senetleri ve borç tahvilları yerine bir araçtır. Sukuk, köken olarak Malezya'da başlamış ve tüm dünyaya yayınlamıştır. Türkiye'de ise 2010 yılında ilk sukuk ihracı gerçekleştirmiş ve sukuk piyasası hızlı bir şekilde gelişmektedir. Ayrıca sukukun güçlü bir şekilde ihraç edilmesi sebebiyle, finansal piyasaların gelişmesinde ve etkinleştirilmesinde rol oynamaktadır."
