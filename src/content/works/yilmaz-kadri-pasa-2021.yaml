abstract: "Bu çalışma, 19. yüzyıl Mısır'ında kanunlaştırma alanındaki çalışmalarıyla tanınan ve bürokratik olarak önemli vazifelerde bulunan Muhammed Kadri Paşa'nın (ö. 1888) İslâm aile hukuku alanında ilk kanunlaştırma teşebbüsü olan el-Ahkâmü'ş-şer'iyye fî'l-ahvâli'ş-şahsiyye (AŞ) adlı eseri ile Osmanlı Devleti'nde Tanzimat sonrasındaki kanunlaştırma faaliyetlerinin son halkası sayılan ve İslâm aile hukukunda ilk kanun metni kabul edilen 1917 tarihli Hukûk-ı Âile Kararnâmesi'nin (HAK) mukayesesi üzerine binâ edilmiştir. Mezkûr iki metnin, aile hukuku konularını içermesi ve muhtevalarının kapsamlı olması hasebiyle söz konusu mukayese,“nikâh”bahsi özelinde gerçekleştirilmiştir. Araştırma iki ana bölümden oluşmaktadır. Birinci bölümde; önce 19. yüzyılda Mısır'daki kanunlaştırma hareketlerinin oluşumunu etkileyen faktörler, AŞ'nin müellifi Muhammed Kadri Paşa ve zikredilen eseri hakkında bilgi verilmiştir. Ardından mukayeseye konu olan HAK'nin içeriğinden ve özelliklerinden bahsedilmiştir. Bölüm sonunda ise yazıldıkları dönem, metot, sistematik yapı ve muhteva açısından bu iki metnin karşılaştırması yapılmıştır. Çalışmanın esasını oluşturan ikinci bölümde; Kadri Paşa'nın nikâh bölümünde yer verdiği konular çerçevesinde AŞ ve HAK'de mukayeseye uygun maddeler tespit edilerek bunların ayrıntılı değerlendirmesi yapılmıştır. Bölüm içerisinde yer alan başlıklarda konuyla ilgili giriş bilgileri verildikten sonra ayrıntılı karşılaştırma tabloları sunulmuş, devamında ise söz konusu metinlerdeki maddelerin mukayese ve değerlendirmeleri bu tablolardan hareketle gerçekleştirilmiştir."
