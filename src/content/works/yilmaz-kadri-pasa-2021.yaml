title: "Kadri Paşa'nın (Ö. 1888) el-Ahkâmü'ş-şer'iyye'si ile Hukûk-ı Aile Kararnâmesi'nin Nikâh Bölümü Çerçevesinde Mukayesesi"
titleTranslation: {"en": "The comparison between Muhammed Gadri Pasha's (d.1888) al-Ahkām al-shar'iyyah and the Ottoman Law of Family Rights within the framework of nikāh (marriage)"}
