abstract: "Hamd alemlerin rabbi olan allah'adır, ve Peygamberlerin Efendisine, ailesine ve yoldaşlarına, barış ve nimetler olsun . Bu mesaj (abdest mekruhatlari, dört mezheb arasındaki karşılaştırmalı bir içtihat çalışmasıdır), bir giriş ve giriş bölümünden önce gelen iki bölüm içermektedir ve araştırmanın ana sonuçlarını özetleyen bir özetle mühürlenmiştir . Önsöz, iğrenme kavramı ve egemen kavramına ve onunla ilgili ifadelere ve terimlere ışık tutar . Birinci bölümde olduğu gibi, suyun kullanımı, kafirlerin ve kıyafetlerinin, misivaakın ve boğazın işleyişine dair kararın ve verimli bir ağacın altında ve durgun suda ihtiyaçların karşılanması kararını gösterir . İkinci bölümde ise, uzuv ve sulak içme suyu içme kararı, oruç tutan kişi için durulama, teneffüs etme ve durgun su ile yıkama kararı verilmiştir . Sonuç: Araştırmadaki en önemli bulgulardan bahsetmiştim"
