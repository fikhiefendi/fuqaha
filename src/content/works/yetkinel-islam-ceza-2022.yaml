abstract: "Tarih boyunca ortaya çıkmış olan hukuk sistemlerinin temel amacı insan hak ve hürriyetlerini korumak, bu hakları belirli kanunlarla güvence altına almak, toplumsal huzur, güvenlik ve refahı sağlamak ve bunların ihlâli neticesinde gerekli yaptırımları uygulamak olmuştur. İslam ceza hukukunda da cezalar had, kısas-diyet ve ta'zîr suçları olarak belirli sınıflandırmalara tabi tutulmuştur. Bu suç ve cezaların uygulanması noktasında kadın ve erkeğe, yaşanılan olayın türü ve şekline göre bazen aynı, bazende farklı cezalar verilmiştir. Biz, temelde dinî bir hukuk sistemi olan İslâm ceza hukukunu ve bu sistemin hukuksal sürecini, yaptırımlarını, cezalarını Kur'an ve sünnet temelinde, belirli mezhepleri esas alarak, onlar üzerinden kadın özelinde inceledik. Çalışmamızda suç ve ceza türleri ayrı ayrı başlıklandırılmış, kavramları açıklanarak tanımlanmış, suç ve cezaya konu olacak durumda ki yaşanılan olaylar değerlendirilerek, mezhepler üzerinden farklılıklar ele alınıp, kadınlara verilen cezalar incelenmiştir."
