abstract: "Bu çalışma da Makroekonomik değişkenlerin Katılım bankacılığının aktif büyüklüğüne etkisi incelenmektir. İslami finans aracı olan katılım bankalarının aktif büyüklüğü ile makroekonomik değişkenlerden; bankacılık sektörü aktif büyüklüğü, döviz kuru, GSYİH ve doğrudan yabancı sermaye yatırımları arasındaki karşılıklı ilişkiyi tespit etmek amacıyla çeşitli analiz yöntemleri uygulanmıştır. Veriler E-views programı aracılığıyla EKK testi ve granger nedensellik yöntemler ile analiz edilmiştir. EKK testi sonuçlarına göre Bankacılık sektörünün aktif büyüklüğündeki 1 puanlık değişim Katılım bankacılığı aktif büyüklüğünde 0.81 puanlık bir artışa neden olmaktadır. Doğrudan yabancı sermaye yatırımlarındaki 1 puanlık artış katılım bankalarının aktif büyüklüğünde 0.004 puanlık bir artışa neden olmaktadır. Döviz kurundaki artış katılım bankaları aktif büyüklüğüne negatif etkide bulunurken, GSYİH'nın K.B. aktif büyüklüğüne pozitif katkı da bulunmakla beraber katsayılar istatistiki açıdan anlamlı bulunmamaktadır. Granger nedensellik analizi sonucuna göre Bankacılık sektörü aktif büyüklüğünden Katılım bankacılığı aktif büyüklüğüne doğru % 10 ve Katılım bankacılığı aktif büyüklüğünden GSYİH ya doğru % 5'lik önem düzeyinde tek yönlü nedensellik ilişkisi bulunduğu sonucuna varılmıştır."
