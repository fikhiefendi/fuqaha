abstract: "Günümüzde iletişim ve ulaşım teknolojisindeki gelişmeler sayesinde ülkeler arasındaki sınırlar kalkmıştır. Değişen ve artan tüketim ihtiyaçları, döviz kullanımının serbest olması ve kambiyo kontrollerinin de kaldırılması ile sadece yurtiçindeki üreticiler değil aynı zamanda yurtdışındaki üreticiler tarafından karşılanmaktadır. Dış ticaret firmaları, özellikle ihracat firmalarının ihraç ettikleri ürünlerin bedelini tahsil etmeleri uzun sürdüğü düşünülürse, varlıklarını devam ettirebilmek için belli dönemlerde finansal desteğe ihtiyaç duyarlar. Katılım bankalarının faaliyetleri fon toplama ve fon kullandırma üzerine kuruludur. Toplanan fonlar, finansman ihtiyacında olan tüzel ve gerçek kişilere katılım bankacılığı prensiplerine uygun bir şekilde kullandırılır. Bu çalışmanın amacı; faizsiz bankacılık prensiplerine uygun finansman yöntemleri ile dış ticaret işlemlerinde kullanılan ödeme yöntemlerini birlikte inceleyerek Türkiye'deki katılım bankaları tarafından kullanılmayan bir dış ticaret finansman ürünü oluşturmaktır. Bu çalışmada mevcut literatürdeki dış ticaret ödeme türleri ve katılım bankaları tarafından uygulanan fon kullandırma yöntemleri ve ITFC tarafından kullanılan finansman yöntemi incelenmiştir."
