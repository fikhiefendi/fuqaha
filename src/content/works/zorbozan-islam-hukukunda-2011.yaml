abstract: "Kişinin lehine olan haklarını ve aleyhine olan sorumluluklarını bilmesi anlamına gelen İslam Hukuku açısından ?hak? kavramı, hukukun en temel kavramlarından biridir. İslam hukuk usulünde hak kavramı, şeri hükümler konusu incelenirken ele alınır. Hak kavramı ile ilgili en temel ayrım, Allah ve kul hakkı şeklindeki ayrımdır. Kul hakları, kulların yetki ve menfaatlerini ifadelendirirken, Allah hakları daha çok kulların yükümlülüklerini ifade eder. Bundan dolayı Allah hakları, kamu menfaati ve düzeniyle ilgli hükümleri; kul hakları ise daha çok fertlerin şahsî ve medenî ilişkilerini kapsar. Nitekim Hz Peygamber (sav) ?Allah'ın kullar üzerindeki hakkı, onların Allah'a ibadet etmeleri ve ona şirk koşmamalarıdır. Kulların da Allah üzerindeki hakkı, Allah'ın ona şirk koşmayan kuluna azab etmemesidir.? buyurmaktadır.Allah hakları, İslam hukukunda pozitif hukuka oranla daha geniş olup ibadetleri de içermketedir. Çünkü bunların icra edilmesiyle bir yandan Allh'a karşı görevler yerine getirilirken bir yandan da vicdanlar disiplin altına alınmaktadır. Ve bu disiplin ile kamunun zararına olan ve düzenini bozan şeylerden kullar alıkonulmaktadır. ?Şüphesiz ki namaz insanı kötü şeylerden alıkoymaktadır?? ayeti de buna işaret etmektedir.Hak kavramının analiz edilmesi, özel hukukun esasını oluşturan medeni hukukun omurgasının da ortaya çıkmasını temin edecektir. Bu düşüncelerle konu tespitinde bulunup hazırlamaya çalıştığımız araştırmamızda genelde hak kavramı, özelde Allah hakkı-kul hakkı kavramlarını örnekleriyle anlatmaya çalıştık."
