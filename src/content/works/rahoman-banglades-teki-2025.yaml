abstract: "Bu tez, mikrofinans ve İslami mikrofinans sistemlerinin yapısını, işleyişini ve etkilerini analiz ederek, Bangladeş'teki yasal düzenleme çerçevesine yönelik Hindistan ve Pakistan ile karşılaştırmalı bir değerlendirme sunmayı amaçlamaktadır. Bangladeş, mikrofinansın küresel çapta yayılmasında önemli bir rol oynamış olup, özellikle Grameen Bank modeli ile mikrofinans uygulamalarını büyük bir başarıyla hayata geçirmiştir. Son yıllarda, İslami mikrofinans hem Bangladeş'te hem de diğer ülkelerde geleneksel mikrofinansa alternatif olarak sosyo-ekonomik kalkınmaya önemli katkılarda bulunmuştur. İslami mikrofinansın bu yapısı, özellikle yoksullara yönelik fırsatlar sunmaktadır. Bangladeş'te mikrofinans dört aşamada gelişim göstermiştir: deney ve yenilik, kurumsallaşma, büyüme ve olgunluk. Bu süreçte kırsal kalkınma, kadınların güçlendirilmesi ve yoksullukla mücadelede önemli başarılar elde edilmiştir. Çalışmada, Bangladeş Mikrofinans Düzenleme Kurumu (MRA) çerçevesinde mevcut yasal düzenlemeler analiz edilmiştir. Ayrıca, Bangladeş'teki düzenleyici çerçeve Hindistan ve Pakistan ile kıyaslanarak değerlendirilmiştir. Buna göre Bangladeş'te geleneksel mikrofinansa yönelik kapsamlı bir düzenleme yapısı mevcutken İslami mikrofinans açısından sınırlı bir yapı söz konusudur. Diğer yandan Hindistan'da geleneksel mikrofinans daha üst seviyede gelişmişken Pakistan'da ise İslami mikrofinansa yönelik düzenleme daha kapsamlıdır."
