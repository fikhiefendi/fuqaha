abstract: "İslâm Dini, evlenip yuva kurmayı insan için fıtrî bir ihtiyaç olarak görmüştür. Bunun yanında ailenin kuruluşu, idame ettirilmesi ve gerektiğinde sonlandırılması konusunda da birtakım kurallar koymuş, tavsiyelerde bulunuştur. Evlilik hayatında karı-koca arasında çıkabilecek sıkıntı ve problemlerin sağlıklı bir şekilde çözüme kavuşturulması için gerekli yol ve yöntemleri göstermiştir. Son seçenek olarak taraflara boşanma hakkı da tanımıştır; boşanma konusu İslam aile hukukunun temel meselelerinden biri olarak değerlendirilmektedir. İslâm hukukuna göre evli bir erkekte bulunduğunda kadına boşanma hakkı/tefrîk muhayyerliği veren bir takım kusur veya hastalıklar vardır. Ancak bu kusur ve hastalıkların neler olabileceği, kadının bu kusur veya hastalıklardan birisine müptela olmuş kocasından ayrılmak isterse hangi yol ve şartlarla boşanabileceği bu boşanmanın mahiyetinin ne olacağı ve ne gibi sonuçlar doğuracağı meselelerine ilişkin konuların çoğunluğunda dört mezhep imamları çoğunlukla ittifak etmekle birlikte bir kısmında farklı görüşler beyan etmişlerdir. Fukahâ genel olarak, erkekteki problemin evlilik öncesinde kadından gizlenmesi ya da evliliği çekilmez kılması durumunda kadına hâkim kararıyla boşanma hakkının tanınması konusunda ittifak etmişlerdir. Kadına bu hakkı verebilecek olan kusur ve hastalıkları ise cinsel ilişkiye mâni olan hastalıklar (iktidarsızlık, burukluk ve penisin cinsel ilişkiye mâni olacak kadar kesik ya da küçük olması vs.); tiksinti veren veya bulaşıcı olan hastalıklar (akıl hastalıkları, cüzzam, alaca vs.) şeklinde kategorilere ayırmışlardır. Cumhurun görüşünden farklı olarak Hanefilerden İmam Muhammed dışındakiler, cinsel ilişkiye mâni olan kusurlar dışındaki diğer hastalıkların kadına boşanma hakkı vermediğini söylemişlerdir."
