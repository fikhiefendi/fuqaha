abstract: "Bu konunun araştırma konusu olarak seçilmesinin en önemli nedenlerinden birisi eşe karşı isyan etme olgusunun Ġslam toplumu içerisinde giderek kötü bir hal almasıdır. Bu durum ailelerin parçalanmasına ve çocukların kaybedilmesine ve nihayetinde boşanma ile sonuçlanacak nefret ve küskünlüğe yol açar. Eşlerin başkaldırmasının sebeplerinden biri de eşlerin hak ve görevlerini bilmemeleridir. Bunun nedeni ise Kur'an ve sünnetten uzaklık ve ailelerin dağılması problemleriyle uğraşan Batı'nın Ġslam toplumu üzerindeki tesiridir. Çalışmada bu olgunun sebepleri, tezahürleri ve bunların hukuki veya sosyal açıdan sonuçları üzerinde durulmuştur. Çünkü aile, toplumun temel yapı taşı ve gücünü aldığı temel direğidir. Çalışma giriş, önsöz, iki ana bölüm ve sonuç kısımlarına ayrılmıştır. Giriş bölümünde, bireyin ve grubun hayatında ailenin öneminden, kendini muhafaza etmenin ve günaha düşmekten korunmanın yollarından bahsedilmektedir. Ayrıca evlilik ve neslin çoğalmasının önemi, itaatsizliğin evlilik yaşamının huzurunu bozan ve onu çöküşle tehdit eden bir hastalık olmasının ciddiyeti üzerinde durulmuştur. Çalışmanın birinci bölümünde Ġslam'ın aileyi inşa eden temel kurallarından, öneminden, kocanın hakkından, iyi ikili ilişkilerden, onun hükümlerinden ve müslümanca bir ev inşa etmede itaatin etkisinden bahsedilmiştir. Ġkinci bölümünde itaatsizliğin 11 mahiyetini anlatılıp iki konuya ayrılmıştır. Birincisi itaatsizliğin tanımı ve itaatsizliğin hükmüdür. Ġkincisi ise itaatsizliğin görünümleri ve itaatsizliğin sebepleridir. Tezin üçüncü bölümü iki temel konudan oluşmakta olup, bunlardan birincisi iki mevzuyu içermektedir. Birincisi itaatsizliğin araçlarını, ikincisi ise itaatsizliğin uygulamalarını ele almaktadır. Ġkinci temel konuda ise ilk başlık altında kadının itaatsizliğinin etkisi, ikinci başlık altında ise Irak"
