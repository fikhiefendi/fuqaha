abstract: "4. Sanayi devrimini tetikleyen teknolojiler, üretim kapasitesini artırırken maliyetleri de en aza indirecek şekilde büyümeyi artırmayı hedeflemektedir. Daha az girdiyle daha fazla ve daha kaliteli ürün elde etmek için hammaddenin yanında istihdam ve iş gücünün maliyetleri de büyümenin önünde çözülmesi gereken, yeniden yapılandırılmaya ihtiyaç duyulan bir sorun haline gelmiştir. Rutine dayalı vasıfsız iş gücü dijitalleşmeyle birlikte dönüşmeye başlamış, 4. Sanayi devrimiyle birlikte mevcut iş süreçleri ve iş tanımları mercek altına alınmıştır. Mevcut iş gücü ise daha vasıflı alanlarda istihdam edilmeye başlanmış ve son sanayi devriminin ihtiyaç duyduğu yetkinlikleri kazanmaya maruz bırakılmıştır. Ortaya çıkan yeni yetkinlikler bazı sektörler için yıkıcı etkilere neden olurken, bazı sektörler için fırsat olarak görülmektedir. Bu çalışmanın amacı dijital dönüşümün dinamiklerinden bir tanesi olarak ortaya çıkan robotik süreç otomasyonu hakkında yeni bilgiler sağlanmasıdır. Daha spesifik olarak robotik süreç otomasyonlarının Katılım Bankacılığı Sistemin'deki uygulama alanlarının incelenmiş, süreç otomasyonun kazanımları ölçülmüş ve alışılagelmiş iş yapış şekilleri ile kıyaslanmıştır. Bu kıyaslama ile birlikte robotik otomasyona tabi tutulmuş, daha önceden manuel olarak çalışanlar tarafından yapılan bankacılık süreçlerinin, zaman ve maliyetleri ölçülmüş, sonuçlar karşılaştırılmış ve elde edilen kazanımların sayısallaştırılması hedeflemiştir."
