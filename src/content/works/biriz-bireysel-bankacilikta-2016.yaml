abstract: "Bu tezde Bireysel Bankacılıkta Geri Ödenmeyen Krediler sorunu hakkında bilgi verilerek uygun çözüm ve öneriler getirilmesi hedeflenmektedir. Bankaların ve kredi kurumlarının bilinen fonksiyonlarının yanında en önemli işlevlerinden biri kredilendirmedir. Banka ve kredi kurumlarının uygulayacağı etkin bir kredilendirme faaliyeti , ülke ekonomisini canlandıracak ve yatırımları arttıracak ve bu da büyümeyi sağlayacaktır. Geri ödenmeyen krediler sorunu bankalarının vazgeçilmez sorunlarındandır ve her geçen gün kritik boyutlara ulaşma ihtimali bulunmaktadır. Kredilerin düzenli pazarlanması için bir ülkenin güçlü bir kredi politikasına sahip olmasına sahip olması gerekir. Daha az riskli, kısa vadeli ve en verimli yerlere kredi verilmesi gereklidir. Karşılaşılabilecek sorunlara önceden çözüm üretebilme yöntemlerini ve sorun çıkmışsa nasıl önlem alınacağı konusunda ayrıntılı bilgi vermesi açısından önemlidir. Çalışmada, katılım bankacılığını tanıma, kredi türleri, kredi tahsis öncesi süreç, kredi tahsis süreci, kredi tahsisinin gerçekleştirilmesi, kredilerin izlenmesi, kredi sorunlarının oluşumunu etkileyen nedenler, sorunlar için çözüm yolları, sorunlu kredilerin irdelenerek çözüm yolları hakkında okuyucuya bilgi verilmesi hedeflenmektedir."
