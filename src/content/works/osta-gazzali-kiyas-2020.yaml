abstract: "Kıyasın meşruiyetinin temellendirilmesi bağlamında illeti bilme yolları, usulcüler arasında tartışmalı olan konulardan biridir. İma ve tenbih yöntemi ise usulcülerinin çoğunluğunun kabul ettiği illeti bilme yollarındandır. Bu tezin amacı ima ve tenbih yönteminin Gazzâlî'nin kıyas anlayışındaki yerini tespit etmektir. Araştırmada genel anlamda tespit, tasnif, tasvir yöntemi kullanılmakla birlikte belge tarama, tahlil yöntemleri de kullanılmıştır. Hem klasik kaynaklardan hem de güncel makale, tez, kitap gibi kaynaklardan faydalanılmıştır. Tez üç ana bölümden oluşmaktadır. İlk bölümde Gazzâlî'nin kıyas anlayışının ayrıntıya girilmeden çerçevesi çizilmiştir. İkinci bölümde konuya giriş mahiyetinde nasların ta'lîli problemi, ima ve tenbihin mahiyeti incelenmiştir. Daha sonra Gazzâlî dönemi ve Gazzâlî öncesi dönemdeki usulcülerin konu ile ilgili görüşleri ortaya konmuştur. Üçüncü bölüm tezin ana kısmını oluşturmaktadır. Bu bölümde Gazzâlî'nin illeti bilme yollarına bakışı ve bu yollardan ima ve tenbih metodu hakkındaki görüşleri tafsilatıyla incelenmiştir."
