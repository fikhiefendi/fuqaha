abstract: "Şer'iyye sicilleri Osmanlı Devleti'nin mahkeme kayıtlarından oluşan birinci eldenkaynaklardır. Bu belgeler yıllık olarak mahkemeye intikal eden siyasû, sosyal, hukukû vebenzeri konuları içerir. İncelediğimiz defter 42/1769 numaralı Samsun'a ait bir defterdir.Çalışma giriş haricinde iki bölümünden oluşmaktadır. Girişte şer'iyye sicilleriyle ilgili genelbilgiler verilmiştir. Ayrıca incelenen defterin genel durumu ve kısa bir Samsun tarihine yerverilmiştir.Birinci bölümde defterin transkripsiyonu yapılmıştır. Ancak transkripsiyonun yanısıra, defterde yer alan kayıtlar tek tek numaralanarak konularına göre başlıklar halindeayrılmıştır. Bu bağlamda veraset, alım-satım, evlenme-boşanma, hırsızlık gibi siyasû, sosyalve ekonomik bir çok konu başlıklar halinde belirlenmiş okuyucunun bilgisine sunulmuştur.İkinci bölümde ise defterde yer alan kayıtlar genel bir değerlendirmeye tabitutulmuştur. Defterde çok sayıda evlenme, boşanma, alım-satım davaları, veraset davaları,kişisel davalar, hırsızlık olayları gibi konular yer almıştır. Bu konular defterde yer alankayıtlar çerçevesinde değerlendirilmiştir. Ayrıca okuyucunun karşılaştırma yapabilmesi içinokunan özgün metin çalışmanın sonuna ek olarak verilmiştir."
