abstract: "ÖZET İcma kavramı İslam hukuk metodolojisi içinde önemli bir yere sahiptir. İcma, temel kaynaklar (Kitap ve Sünnet) tarafından düzenlenmeyen bir meseleyi çözüme kavuşturmada ilk başvurulan kaynak sayılmaktadır. Cessas'ın El-Fusûl Fi'l-Usûl adlı eserinin ilk usul eserlerinden olması da konunun önemini arttırmaktadır. Bu çalışmamızda Cessas'ın icmâ anlayışı ile birlikte ilk dönemlerdeki usul görüşlerinin niteliğini de anlamaya çalıştık. Temel başvuru kaynağımızın klasik usul eserlerinden biri olması nedeniyle, çağdaş usul eserlerine çok fazla müracaat etmedik. Konunun uzamaması için usul alimlerinin icmâ ile ilgili yaptığı tartışmalarm detaylarına da değinmedik. Konunun daha iyi anlaşılabilmesi için Cessas'ın yaşadığı dönemin ve icmâ kavramının içerdiği konuların genel çerçeveyle verilmesini uygun bulduk. Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde, Cessas'ın yaşadığı dönemi ve yetiştiği çevreyi siyasi, sosyal ve ilmî faaliyetler açısından inceledik. İkinci bölümde ise, icmâ hakkında genel bilgilere yer vererek daha sonraki bölümün anlaşılmasını kolaylaştırmaya çalıştık. Üçüncü bölümde de, Cessas'ın icmâ kavramı ile ilgili görüşlerim ve bu konuyu ele alış biçimini çeşitli kategorilere ayırarak ele aldık. Böylelikle Cessas'ın usul ilmine yapmış olduğu katkıları, icmâ kavramının ortaya çıkış sürecini, icmâm tarihsel gelişimim, oluşum şartlarım ve icmâ ile ilgili başlıca tartışmaların boyutlarını ortaya koymaya çalıştık. VI"
