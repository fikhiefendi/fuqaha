abstract: "Osmanlı Devleti, İslam hukuk sistemi olan şer'i hukuku uygulamış, dolayısıyla da bu hukuk sisteminin en önemli yargı organı şer'i mahkemeler olmuştur. Bu mahkemelerde kayda alınmış olan Şer'iyye Sicilleri, Osmanlı Tarihi araştırmaları bakımından vazgeçilmez kaynaklar konumundadır. Dava tutanaklarının yanı sıra, idari birimlerin beledi işleri, noter kayıtları, merkezi idarenin yerel konularla ilgili gönderdiği bazı talimatnameler de bu sicillerin konuları arasına girmektedir. Bizim incelemiş olduğumuz 187 numaralı Sivas Şer'iyye sicili son dönem sicillerden olup, mahkemelerin dava konularına göre ayrılmasının ardından daha çok dava vekili atamalarıyla ilgili vekâletnamelerin bulunduğu bir defterdir. Bununla birlikte defterde miras ve mülk paylaşımı, evlenme, boşanma, alım-satım işlemleri, borç, vakıflar vb. konulara dair bilgiler bulunmaktadır. Bu belgeler ışığında dönemin Sivas şehrine dair sosyo-ekonomik, idari ve hukuki bilgilere ulaşmak mümkündür."
