abstract: "İnsanın, isteyerek veya istemeyerek diğer insanlara zarar vermesi mümkündür. Hukuk sistemleri tarafından insanların verdikleri zararın giderilmesi gayesi güdülmüştür. Bu amaçla Türk hukukunda“sorumluluk”, İslam hukukunda ise“damân”kavramı, üzerinde durulan önemli bir konu olmuştur. Hukuk sistemleri damânın/sorumluluğun sebepleri ve unsurları gibi temel konularda düzenleme yapmayı önemsemişlerdir. Bu anlamda“akdî sorumluluk”veya İslam hukukunda“damânü'l-akd”olarak ifade edilen sebep önemli bir yere sahiptir. İslam hukukunda bu konu akidlerin tazmin bakımından ayrımına göre şekillenmiştir. Tazmin yükümlülüğü bakımından emanet akidleri, damân akidlerinden farklı olduğu için önem arz etmektedir. Emanet akitlerinde emanet malı teslim alan kişinin malın telefi halinde tazminle sorumlu olması için teaddî ve taksîr olarak ifade edilen davranışlarda bulunması gerekmektedir. Bu tez vedîa ve âriyet akdi bağlamında emanet akidlerinde akid konusu malın tazmin edilmesine sebep olan durumları konu edinmiştir. Çalışmada ilk olarak emanet akidlerinin tazmin açısından konumu belirlenmiştir. Bu amaçla damânın tanımı, sebepleri ve unsurları mukayeseli şekilde sunulmuştur. İkinci bölümde ise vedîa ve âriyet akidlerinde akid konusu malın tazmin edilme sebepleri detaylı olarak incelenmiştir."
