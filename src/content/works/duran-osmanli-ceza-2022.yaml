abstract: "Adil yargılanmanın gerekliliği insan hakları fikrinin temeline dayanmaktadır. Evrensel nitelik kazanan adil yargılanma hakkının yok olması yahut ihlal edilmesi durumunda diğer tüm haklar da büyük tehlike ile karşı karşıya kalabilecektir. Gerçekten suçlu olan biri için bile adil yargılama yapılması insan haklarının bir gereğidir. Bu hak günümüz modern hukuktaki halini alana kadar çeşitli tarihi süreçlerden geçmiştir. Osmanlı Devleti'nde adaletin tecellisi her zaman önemsenmiştir. Çünkü İslam Hukukunu esas alan Osmanlı Hukukunda dini inançları gereği, adaletle hükmetmek ve zulme karşı durmak her zaman önemli meseleler olmuştur. Türk Ceza Hukukunda var olan ve yazılı metinlerimizle güvence altına alınan adil yargılanmanın ilkeleri Osmanlı Devleti'nde de uygulanmıştır. Bu ilkelere göre kişilerin bağımsız ve tarafsız mahkemelerde hak arama özgürlükleri mevcuttur. Yargılamalar aleni olmalı ve hak kayıplarına sebep olmamak için makul süre içerisinde tamamlanmalıdır. Yargılama sırasında şüpheli veya sanık,“masumiyet karinesinden”ve“şüpheden sanık yararlanır ilkesinden”yararlanmalıdır. İnsan hakları fikrinin doğuşundan itibaren adil yargılanma hakkı devletlerin gündeminde olmuştur. Osmanlı Devleti'nde de mevcut olan bu hak, Türk Ceza Hukuku açısından Türkiye'nin de taraf olduğu uluslararası sözleşmelerle güvence altına alınmıştır."
