abstract: "Geçmişten günümüze devletler, gelirlerini büyük oranda vergilerle sağlamaktadır. Bununla birlikte sosyal yaşamın desteklenmesi ve muhtaç insanların ihtiyaçlarının karşılanması için de vergi alınmaktadır. Türkiye'de elde edilen gelir ve gider dengesini gösteren bütçe kalemleri içerisinde vergilerin büyük bir payı vardır. İşte bu tezin amacı, bütçe gelir-gider dengesini sağlayacak yeni bir ekonomik sistem olan AED'deki vergilendirme sistemi ile Türkiye'nin bütçe gelir-gider dengesini sağlayacak yeni önermelerde bulunmak ve mevcut sistemlerde vergi gelirleri içerisinde yer alan dolaylı vergilerin neden olduğu gelir dağılımındaki adaletsizliği ortadan kaldırmaktır. AED ekonomik sistemi ile günümüzde tartışmalara açık olan İslam Ekonomisi konusuna getirilmeye çalışılmıştır. Bütçe dengesini sağlamak ve gelir dağılımındaki adaletsizliği gidermek amacıyla elde edilen vergiler içerisinde en büyük paya sahip olan dolaylı vergilerin neden olduğu olumsuzlukların üzerinde durulmuştur. Bütçe gelirleri içerisinde yer alan vergi gelirlerinin nasıl ve ne şekilde elde edilmesi gerektiği hususları bu çalışmada incelenmiş olup özellikle Türkiye'de mevcut gelir dağılımındaki adaletsizliğe neden olan dolaylı vergiler ve faizin olumsuz yönleri belirtilerek sorunlara çözüm yolları sunulmaktadır."
