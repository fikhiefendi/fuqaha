abstract: "Bu tez, Emir Padişah olarak tanınan ve hicri 9. asrın alimlerinden sayılan Muhammed Emin el-Hüseyni'nin hadis mustalahına yönelik kaleme aldığı eserinin tahkikini kapsamaktadır. Kuşkusuz hadis mustalahı, önemli şer'i ilimlerden birini oluşturmaktadır. Hadis ilmi merdud rivayetler ile merfu, mevkuf veya maktu olan hadislerin sahihlik derecelerini ayırt edebildiğimiz için büyük bir öneme sahiptir. Eserimiz, Iraki'nin et-Tebsıra ve't-tezkire adlı şerhinin özetidir. Padişah, bu kitabı eserin amacına uygun olarak özetlemiş ve esere göz atmak isteyen kişilerin uzun ciltlere bakmasına gerek kalmaksızın bir özetini sunmuştur. Bu alandaki öneminden dolayı araştırma dahilinde eserin el yazması nüshaları araştırılmıştır. Bu araştırma sonucunda eserin okunur bir şekilde kaleme alınmış ve sadece ufak tefek hatalar barındıran iki tam el yazması nüshasına erişilmiştir. Tahkik işleminde bu iki nüshadan biri esas alınıp diğeri ihtiyaç duyulduğunda başvurulmak üzere kullanılmıştır. Tahkik ve yorumlama işleminde ise metin iki kısma ayrılmıştır: İnceleme kısmı olan birinci kısımda el-Irakiden, İbnü's-Salah ve Emir Padişah'tan bahsedilmiştir. İsimleri, doğum tarihleri, ortaya çıkışları, en önemli öğrencileri, eserleri ve ilmi konumları belirtilmiştir. Ardından tahkik konusu olan eser tanıtılıp, yazara nispet edilmesi ve yazarın yöntemi açıklanmıştır. Eserin içeriğine uygun olan ismin“Muhtasar şerhi et-Tebsıra ve't-tezkire”olduğu belirtilmiştir. Tahkikte esas alınan el yazması nüshalar nitelenip, her nüshanın özellikleri ve bu nüshaların örnekleriyle birlikte (ş) nüshasının esas alınma sebebi belirtilmiştir. İkinci kısım ise tahkik ve yorum kısmıdır. Esas alınan el yazması nüsha ile eserin metni kopyalanmıştır. Ardından ikinci nüsha ile karşılaştırma yapılıp, haşiyedeki iki nüsha arasındaki farklar tespit edilmiştir. Ayrıca metne okuyucunun karıştırmadan anlamasını kolaylaştıracak yeterli ölçüde hareke konmuştur. Kur'an ayetleri, hadisler, sahabe ve tabiin sözleri çıkarılmıştır. Metni anlamada etkisi olan alimlerin biyografisine değinilmiştir. Mümkün olduğu kadar kaynaklara başvurularak sözlerin doğruluğu ispat edilmiştir. Yeterli miktarda kaynak bulunarak açıklama ve izaha ihtiyaç duyulan kısımlar açıklanmıştır."
