abstract: "Gelişmiş ve gelişmekte olan tüm ülkelerin finansal durumlarını gösteren en önemli göstergelerden bir tanesi bankacılık göstergeleridir. Bankacılık sektörünün işleyişini bozulması ülkelerin ekonomilerinin bozulmasına ve piyasadaki nakit akış dengesinin bozulmasına yol açmaktadır. Finansal göstergeleri zayıf bankaların iflas etmesi sonucunda ekonomi, bankacılık sektörü, yatırımcılar ve halk büyük zararlar görmektedir. Bu nedenden ötürü bankaların performanslarının değerlendirilmesi ve gerektiğinde önlem alınması önemli bir konudur. Performansları değerlendirilip takip edilen bankaların finansal durumlarının bilinmesi, gerektiğinde önlem alınmasına yardımcı olmaktadır. Bu sayede hem ekonomi hem de yatırımcılar risklerini dengeleyebilmektedir. Özellikle 2001 Türkiye ve 2008 global krizinde yaşananlar ve iflas eden bankalar, bankaların performanslarının değerlendirilmesi konusunun önemini göstermektedir. Bu araştırmanın amacı bankacılık sektörünün büyük kısmını oluşturan mevduat ve katılım bankalarının performanslarının çok kriterli karar verme yöntemine göre karşılaştırılmasıdır. Çok kriterli karar verme yöntemi, verilen kararlara birden fazla etki eden kriter söz konusu olduğunda kullanılmaktadır. Araştırma kapsamında çok kriterli karar verme yöntemlerinden TOPSIS (Technique for Order Preference by Similarity to Ideal Solution) ve VIKOR (Vise Kriterijumska Optimizacija I Kompromisno Resenje) yöntemi kullanılmıştır. Bu yöntemler yardımıyla mevduat ve katılım bankalarının son beş yıldaki finansal performansları değerlendirilmiş ve sonuçlar karşılaştırılmıştır."
