abstract: "217 ÖZET İslâmiyet hem bir din, hem de bir hukuk sistemidir. Hz. Muhammed bu dinin peygamberi ve yeni kurulan İslâm Devleti'nin yöneticisidir. İslâm Hukuku'nda egemenlik Tann'ya ait olduğu için Hz. Peygamber egemenlik hakkının doğrudan sahibi değildir. O, olsa olsa Tann'mn yeryüzündeki elçisidir. Hz. Peygamber'den sonra başa geçen halifeler ise O 'nun bir tür halefi oldukları için egemenlik hakkına doğrudan asla sahip değildirler. İlk dört halife zamanında halifeler seçimle iş basma geldikleri halde, Emevîler'den itibaren halifelik babadan oğla geçmeye başlamış, ay m durum Abbasîler döneminde de sürmüştür. Bu dönemde Bizans ve Sasanî hükümdarlarının mutlak egemenliklerinden etkilenen halifeler kendilerini Tann'mn yeryüzündeki gölgesi olarak görmüşlerdir. Bir süre sonra dünyevî otoriteleri azalan Abbasî halifelerinin, kurulan İslâm devleti hükümdarlarma devletlerini yönetme hakkım vermeye başladıkları görülmektedir. Büyük Selçuklu Devleti'nin hükümdarları da Halife'den bu yetkiyi almışlar, ama daha sonra ülkelerini tıpkı bir eski Türk kağanı gibi yönetmişlerdir. Şu halde, Türkler eski egemenlik anlayışlarını İslâm esaslarıyla bağdaştırmışlardır. Aym durum Büyük Selçuklular'dan sonra kurulan Anadolu Selçukluları ve bu devletten sonra açılan Anadolu Beylikleri Dönemi için de geçerlidir. Hükümdarların eski Türk egemenlik anlayışına bağlı olarak ülkelerini ailelerinin erkek üyeleri arasında pay etmeleri, devletin kısa sürede çökmesine zemin hazırlamış, bu süreç güçlü hükümdarlar sırasında bir süre geciktirilebilmiştir. Aslında Osmanlı Devleti'nde de eski Türk egemenlik anlayışının bir süre devam ettiği anlaşılmaktadır. Fakat Osmanlılar zaman içinde padişahların otoritelerinin mutlak hale dönüşmesi ve tahta geçme usulünde belirli dönemlerde belirli sistemlerin uygulanabilmesi sayesinde ayakta kalmayı başarabilmişlerdir. Türkler'in eski egemenlik anlayışlarım İslâmiyet'i seçtikten sonra bırakmamalarının temel sebebi, İslâm Kamu Hukuku'ndaki büyük boşluklardır. Osmanlı Devleti'nde II. Mahmut döneminden itibaren egemenlik anlayışında önemli gelişmeler olmuştur. Bu Padişah zamanında ayanların kendisine zorla kabul ettirmek istedikleri“Sened-i İttifak”, padişahın egemenliğini sınırlamaya yönelik bir218 Kamu Hukuku belgesidir. II. Mahmut dönemini takiben Osmanlı Devleti'nde yeni bir dönem açılmıştır:“Tanzimat Dönemi ”Bu dönemde çıkarılan“Tanzimat”ve“Islahat”fermanları ile temel hak ve özgürlükler güvence altına alınmış, Devlet anayasal düzene doğru yol almaya başlamıştır. Nitekim, 1876'da Türkler' in ilk anayasası“Kanun-i Esasî”kabul edilmiş, bu Anayasa ile devletin hukukî statüsü belgelenmiştir; ancak bu Anayasa ile padişahın yetkilerinde hiçbir kısıtlama yapılamamış, onun mutlak yetkileri aynen tanınmıştır. 1909'da ise Anayasa ciddî biçimde değişikliğe uğratılmış, Osmanlı Devleti'nde ilk kez gerçek anlamda parlamenter rejim kurulmuştur. Ancak bu dönemde bile egemenliğin gerçek sahibine (ulusa) ait olduğuna dair bir hüküm yer almamaktadır. Egemenliğin ulusa verilmesi için Türkiye Cumhuriyeti'nin kurulması beklenmiştir."
