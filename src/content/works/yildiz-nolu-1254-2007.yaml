abstract: "Bu çalısma Tokat'ın 50 no'lu Ser'iye Sicilinin Transkripsiyonu ve degerlendirmesinden olusmaktadır. 50 numaralı Tokat Ser'iye Sicili H.1254/M.1838-39 tarihleri arasındaki Tokat mahkeme kayıtlarını içermektedir. Sicilin içinde buyruldu, tereke kayıtları, (kisinin ölümünden kalan her türlü varlıgı) vasi tayini, vakfiye ve çesitli konular vardır. Defter 80 sahife ve 40 varaktır. Sicillerin yazılısında yazı tarzı fazla degismemistir. 1838-1839 yılları arasında kullanılan lakaplar, giyecek ve ev esyaları ile Tokat'a baglı kaza, nahiye, köy ve mahalle adları tespit edilmistir. Sicildeki kayıtlara bakıldıgında Tokat'ta müslüman ve gayr-i müslim halk iç içe yasadıkları, farklı meslek gruplarının olması ve özellikle Tokat'taki tarım ürünlerinin Sivas sancagı ve Samsun iskelesine gönderilmesi, tarımın Tokat ekonomisinde önemli bir yeri oldugunu göstermektedir. Pek çok iç ve dıs mesele ile ugrasan Osmanlı'daki siyasi olaylara ser'iye sicilinde deginilmistir. Özellikle farklı inanç gruplarının bir arada yasadıgı Tokat'ta, halkın olaylardan etkilenmemesi ya da olaylardan uzak kalması kayda deger bir olaydır. Çalısmamızda 1838-1839 yıllarında Tokat'ın sosyal hayatı dısında, o yıllarda ki ekonomik durumu hakkında genel bir degerlendirme yapılmıstır. Ayrıca tez çalısmamızın sonuna çalısma konumuz olan sicil defterindeki belgelerin Osmanlıca orijinal kayıtlarının fotokopisi de eklenmistir."
