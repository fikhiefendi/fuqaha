abstract: "Hamd alemlerin Rabbi olan Allah'a aittir. Allah'ın salât ve selâmı Muhammed'e (s.a.v), onun ailesine ve bütün ashâbının üzerine olsun.“İmam Ahmed Mezhebi Üzerine İslam Hukukunun Kanunlaştırılması”projesi,“İslam Araştırma Akademisi”altında Ezher alimlerinden oluşan komite tarafından derlenmiştir. Toplam dört ciltten oluşan bu proje muamelat, cinayat ve kada bölümlerini maddeler halinde içermektedir. Bu çalışma ise“İmam Ahmed Mezhebi Üzerine İslam Hukukunun Kanunlaştırılması”projesi içerisindeki 572. maddesinden“Müsabaka Babı sonundan”591. maddesine“Âriyet Babı sonuna kadar”uygulamalı karşılaştırmalı İslam hukuku çalışmasıdır. Çalışmanın genel konsepti, Hanbeli literatüründeki Keşşâfü'l-ḳınâ adlı kitabın klasik metninden yola çıkılarak Komite tarafından kanunlaştırılan maddeleri ele alarak değerlendirmek ve buna bağlı fıkhi mevzuları karşılaştırmalı İslam hukukuna göre incelemektir. Bu çalışmanın ilk 20 bölümünde müsabaka ve ariyet ile ilgili maddeleri ele alarak; madde metnini, maddenin şerhini, şeri delilini ve madde hakkındaki fıkhi meseleleri zikrettim. Son bölümde ise güncel uygulamalarla değerlendirdim. Tezimin sonunda ise meseleleri üç kısımda değerlendirdim. Birincisi, dört mezhebin ittifak ettiği meseleler. İkincisi, Şafii ve Hanbeli mezhebin ittifak ettiği meseleler. Üçüncüsü ise mezheplerin ihtilaf ettiği ve benim açımdan râcih olan meseleler. Allah azze ve celleden başarılar dilerim."
