abstract: "Rekabetin ve değişimin keskin olduğu dünya ekonomisinde yeniliklere ve gelişimlere karşı esnek olabilen KOBİ'lerin etkinliği her geçen gün artmaktadır. Önemli bir ekonomik aktör olan KOBİ'lerin en büyük sorunsalı kaynak yetersizliğidir. Bu noktada yaşanan finansman sorunlarına alternatif bir çözüm olabilecek Risk Sermayesi modeli ön plana çıkmaktadır. Bu çalışmada KOBİ'lerin finansmanında Risk Sermayesi modelinin uygulanabilirliğinin test edilmesi amaçlanmıştır. Bu amaca uygun olarak oluşturulan modelin geçerliliği 69'u bireysel 178'i firma olmak üzere toplam 247 katılımcıya anket yapılarak analiz edilmiştir. Çalışmaya dahil olan katılımcıların çoğunluğu Risk Sermayesini tanımasına rağmen, sınırlı sayıda katılımcının Risk Sermayesi ile finanse olduğu ya da Risk Sermayesi uygulamasına dahil olduğu anlaşılmıştır. Firma katılımcıları kendi iç işlerine karışmayan bir model olması durumunda, bireysel katılımcılar ise vadenin kısa olması durumunda Risk Sermayesi modelini kullanabileceklerini belirtmişlerdir. Elde edilen bulgular ışığında Türkiye'de az tercih edilen Risk Sermayesinin yeterli derecede tanıtılması ve yatırımcı profilinin gelişmesi ile daha aktif kullanılabileceği öngörülmektedir."
