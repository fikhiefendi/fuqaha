abstract: "Çalışma, Hanefî fakihlerden Ebû Abdullah Muhyiddin Muhammed b. Süleyman el-Kâfiyeci'ye (ö. 879/1474) ait“Hulâsatü'l-akvâl fî hadîsi inneme'l-aʻmâlü bi'n-niyyât”adlı eseri tahkik ve değerlendirmeyi hedeflemiştir. Müellif, kitabını üç bölüm halinde ele almıştır. İlk bölümde, hadisçilerin kullandığı bazı terimlere yer verilmiştir. İkinci bölümde, öncelikle“Ameller niyetlere göredir”hadisinin belâgat ve nahiv bakımından durumunu ele almış, ardından bu hadisten çıkan bazı fıkhi hükümler ile fakihlerin bu konudaki ihtilaflarına yer vermiştir. Bu anlamda müellif, yalnızca Hanefî ve Şâfiî mezhebine mensup fakihlerin görüşlerini vermekle yetinmiştir. Çalışmasının son bölümünde ise müellif, hadisin sözlük manalarına dair değerlendirmeler yapmıştır. Müellif (r.h.) bu kitabında, 'Sen …. dersen, ben de ….. derim' şeklinde soru ve cevap tarzında bir üslup takip etmiştir. Kitabında, herhangi bir mezhep veya görüşte taassup göstermemiştir. Mensubu olduğu Hanefî mezhebine aykırı da olsa, doğru olduğunu düşündüğü şeyi ifade etmekten geri durmamıştır. Bu değerli el yazma eserin tahkiki sırasında karşılaştığımız en büyük zorluk, müellifin kitabında müracaat ettiği kaynakların birçoğunu belirtmemiş olmasıydı. Bu anlamda müellifin bu kitabında yüz elliden fazla kaynak kullandığını tespit ettik."
