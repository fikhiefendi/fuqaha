abstract: "Çileli bir hayat sürdüğü anlaşılan Abdussettâr Efendi, Kırım savaşı (1853-1856) sebebiyle eğitim hayatına Kırım'dan sonra İstanbul, Kayseri ve tekrar İstanbul'da devam etmiş, ardından devletin çeşitli kademelerinde görev almış, aynı zamanda müderrislik de yapmıştır. Abdussettâr Efendi Osmanlı'nın son döneminde yaşamış, adı fazla duyulmayan ama başarısı ve eserleri ile döneminde bilinen, takdir edilen ve bugün de bilinmesi gereken Kırım'da doğup İstanbul'da yetişen bir ilim adamıdır. Abdussettâr Efendi, naiplik ve kadılık da yapmış, mesleğinin zirvesine ulaşmış fakat genç yaşta vefat etmiştir. Abdussettâr Efendi, Mecelle-i Ahkâm-ı Adliyye muharrirlerinden birisidir. Mekteb-i Nüvvab'da aynı adla dersini de okuttuğu bu esere şerh yazmaya başlamış fakat bitirmeye ömrü kifayet etmemiştir. Mecelle derslerini okuttuğu dönemde bu dersi öğrencilere sevdirmek ve dersi anlamalarına katkı sağlamak üzere Medhal-i Fıkıh adlı muhtasar bir risale yazmıştır. Abdussettâr Efendi'nin bu eseri, o dönemde yazılan ilk medhal-i fıkıh edebiyatı türlerinden biridir. Daha sonra çeşitli ilim adamları tarafından bu edebiyat üzerine öğrencilere yönelik kapsamlı ve yoğun çalışmalar yapılmıştır. Abdussettâr Efendi'nin“Medhal-i Fıkıh”İsimli Eserindeki Metodu adlı bu çalışmamızda medhal edebiyatı, Abdussettâr Efendi'nin hayatı ve muhtasar yazdığı Medhal-i Fıkıh isimli eseri incelenmiştir. Tezimiz giriş, birinci ve ikinci bölümden oluşmaktadır. Giriş bölümünde Abdussettâr Efendi'nin hayatı ve eserleri, tarihî ve resmi vesikalara dayandırılarak ortaya konulmuş ve eserleri kısaca değerlendirilmiştir. Yine bu bölümde aldığı unvan ve nişanları ile yaşadığı döneme kısaca değinilmiştir. Birinci bölümde fıkhın ve medhal-i fıkhın tanımı yapılmıştır. Yine bu bölümde medhal edebiyatının doğuşu ve bu alanda yazılan eserlere değinilmiştir. Aynı zamanda eserlerin ortak yönleri ortaya konulmuştur. İkinci bölümde Abdussettâr Efendi'nin Medhal-i Fıkıh risalesi incelenmiş, metot ve sistematiği üzerinde durulmuştur. Yine bu bölümde yazar hakkındaki bazı değerlendirmelere yer verilmiş ve sonuç bölümünde ise bir değerlendirme yapılmıştır. Başbakanlık Osmanlı Arşivi başta olmak üzere çeşitli yazma eserler kütüphanelerinden elde edilen resmi vesikaların ve orijinal eserlerin bazı nüshalarının fotoğrafları bibliyografyadan önce sunulmuştur. Eserin tamamı da bibliyografyadan sonra ekte sunulmuştur."
