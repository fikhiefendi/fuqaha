abstract: "Bu el yazması, Cuma namazı ve bununla ilgili hükümlerden bahseden en kapsamlı el yazmalarından biridir. Müellif mektubunda Cuma namazından sonra öğle namazının hükmünü açıklayarak, en büyük imam ve iki sahabeden başlayıp mezhep büyük âlimlerinden geçerek Hanefi alimlerinin bu konudaki sözlerini zikretti. Cuma gününün farzını, yerine getirilmesinin şartlarını ve Cuma ibadetlerin şartlarını, hutbin hükümlerini, vazifelerini ve sünnetlerinden bahsetti. Bu konuda diğer mezhep ifadelerine de değindi, Sonra Cuma gününün faziletlerinden, icabet saatinden, bunda zikredilen hadislerden ve bu büyük mübarek günde zikredilen bütün farz, sünnet ve faziletlerden bahsetmeye devam etti. Daha sonra ezan, kamet ve Müslümanları namaza davet etmek için bir slogan olarak benimsenmesine dair hadislerden, ezan hakkının hükümlerinden ve müezzinle ilgili hükümlerden bahsetti. Sözlerini Peygamber Efendimiz (Sallâllâhu Aleyhi ve Sellem)in müezzinlerinin isimlerini zikrederek bitirdi. Eserin okuyan, meseleleri, ikazları ve yararları sunması ve ilim adamlarından aldığı geniş delillerle, müellifin görüşünü ifade ederken bilgili ve kuvvetli olduğunu görür. El yazması üzerindeki çalışmama gelince, yazar hakkında bir inceleme yaptım, ardından metin, metodolojisi, adı, yazarın kaynakları ve ardından incelenen metinde benimsediğim el yazmaları hakkında bir inceleme de yaptım. İncelenen metne gelince, tüm bulunan nüshaları topladım, sonra nüshayı ele aldım ve iyice inceledim, sonra başka bir nüsha ile karşılaştırma yaptım ve kenar boşluğundaki farklılıkları araştırdım ve Ayetleri ve her ayeti sureye ve ayete, her Hadisi Hadis kaynağına göre ayarlayıp bilinenler dışında alimlerin metlerini çevirerek her sözün kaynağına kadar ilişkilendirdim."
