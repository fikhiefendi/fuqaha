abstract: "ÖZET Bu tez giriş ve iki bölümden oluşmaktadır. Giriş bölümünde, araştırmanın konusu ve önemi, amacı, yöntemi, Şevkânî'nin hayatı ve“Fethu'l-Kadîr”adlı tefsirinde takip ettiği metod anlatıldı. Birinci bölümde, Şevkânî'nin esbâb-ı nüzul anlayışı değerlendirildi. Onun sebeb-i nüzul rivayetlerini verirken kullandığı metod örneklerle açıklandı. Şevkânî'nin bu metodu; sebeb-i nüzul rivayetlerinde kaynakları kullanması, isnâdları kullanma şekli ve kullandığı sığalar olarak üç başlık altında ele alındı. Müfessirin, sebeb-i nüzul rivayetlerini rivayet ve âyet açısından tefsirinde, nerede ve nasıl ele aldığı örneklerle anlatıldı. Yine rivayetleri verirken değindiği diğer konular ortaya kondu. Son olarak, Şevkânî'nin sebeb-i nüzul rivayetlerini nasıl değerlendirdiği anlatılmaya çalışıldı. İkinci bölümde, Şevkânî'nin esbâb-ı nüzul anlayışı eleştirel bir yaklaşımla değerlendirildi. Bu eleştirel yaklaşım alt başlıklar halinde örneklerle açıklandı. Tez bir değerlendirme ile son bulmaktadır. IV"
