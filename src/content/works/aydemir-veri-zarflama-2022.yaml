abstract: "Genel itibarla bankalar, paranın daha güvenli bir şekilde muhafaza edilmesi, kredi kullanımı ve diğer geleneksel bankacılık hizmetlerini sunan kuruluşlardır. Tüm dünyada bankacılık sistemi esas olarak faize dayalı bir yapı üzerine kurulmuştur. İslam'da faizin haram olması nedeniyle, dini hassasiyeti yüksek olan bireyler faizli bankacılıktan kaçınmayı tercih etmektedirler. Dolaysıyla tüm dünyada ve Türkiye'de İslami finans kuruluşlarının kurulması konusunda adımlar atılmıştır. 1980 sonrası Türkiye'de faizsiz sistem esaslı çalışan finansal kuruluşlar kurulmuş ve 2006 itibari ile katılım bankaları olarak isimlendirilmiştir. Finansal performansın ölçülmesi adına etkinlik değerlendirmesi birçok sektörde olduğu gibi bankacılıkta da oldukça sık kullanılmaktadır. Bu çalışmada Türkiye'de hizmet veren mevduat ve katılım bankalarının ne ölçüde etkin çalıştıklarına yönelik yapılmış olup iki banka türü etkinlik anlamında karşılaştırılmıştır. Bankacılık alanındaki güncel veriler kullanılarak yeni bir analiz yapılmıştır. Bankalar veri zarflama analizi (VZA) programı ile analiz edilmiştir. Bu çalışmada etkinlik analizi ölçümü yapmak için“Veri Zarflama Analizi”yöntemi tercih edilmiştir. Veri Zarflama Analizi, etkinlik ölçümlerinde çok girdi ve çıktı ile analiz yapma fırsatı veren bir analiz modelidir. Analizlerde 2016-2020 yılları arasında aralıksız faaliyet gösteren katılım ve mevduat bankalarının verileri kullanılmıştır. Bu kapsamda 4 katılım ve 15 mevduat olmak üzere 19 banka (karar verme birimi) ile 3 girdi ve 3 çıktı kullanılmıştır. Katılım bankalarının etkin banka sayısı açısından başarı derecesi; BCC modeline göre %90 iken CCR modeline göre %80 oranını olduğu belirlenmiştir. Buna karşın mevduat bankalarına etkin banka sayısı açısından başarı derecesi; BCC modeline göre 5 yıllık etkin değerlerin ortalaması %70,67 iken CCR modelinde ise %46,66 olarak tespit edilmiştir. Analiz değerlendirmesi sonucunda, katılım bankalarının mevduat bankalarına oranla daha etkin olduğu görülmüştür."
