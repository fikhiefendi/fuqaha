abstract: "Bu çalışma, İslâm'ın beş temel esasından biri olan zekâtın, özellikle günümüz ekonomik yapısında önemli bir yer tutan borç ve alacaklar üzerindeki etkisini ele almaktadır. Zekât, dinen zenginlik ölçüsü kabul edilen bir miktarda (nisab) mala sahip olan kimselerin, Allah (c.c.) rızası için belirli kişilere vermesi gereken malî bir yükümlülüktür. Zekâtın farz olabilmesi için malların nisab miktarına ulaşması, artıcı (nâmî) nitelikte olması, üzerinden bir yıl geçmiş bulunması ve aslî ihtiyaçların dışında yer alması gerekmektedir. Bu şartlara ek olarak, kişinin borçsuz olması da zekât yükümlülüğü açısından önem arz etmektedir. Zekât bağlamında borç kavramı izafî bir nitelik taşımaktadır. Aslî ihtiyaçların karşılanmasına yönelik borçlarla ticarî büyümeyi hedefleyen borçlar, fıkhî açıdan aynı şekilde değerlendirilmemiştir. Borcun oluşum sebeplerindeki farklılıklar ile bu hususa dair rivayetlerin çeşitliliği, mezheplerin borcun zekâta engel olup olmayacağı yönünde farklı görüşler benimsemelerine neden olmuştur. Ayrıca, borç kavramı yapısı gereği bir alacaklıyı da zorunlu olarak içermekte olup, borcun mevcut olduğu her durumda bir alacaklıdan da söz etmek mümkündür. Bu bağlamda çalışma, alacak ve borçların zekâta etkisini klasik fıkıh geleneği çerçevesinde incelemeyi amaçlamaktadır. Farklı fıkhî ekollerin konuya yaklaşımları karşılaştırılacak, bu yaklaşımlarda kültürel veya yorumsal farklılıkların bulunup bulunmadığı tespit edilmeye çalışılacaktır. Ayrıca, modern ticarî ilişkilerde ortaya çıkan yeni borç ve alacak türlerinin, klasik dönemdeki uygulamalarla olan benzerlik ve farklılıkları da değerlendirme konusu yapılacaktır. Çalışmanın sonucunda, borcun zekât yükümlülüğünü ortadan kaldırıp kaldırmayacağı konusunda mezhepler arasında önemli görüş ayrılıklarının bulunduğu tespit edilmiştir. Ayrıca, klasik fıkıh literatüründe yer almayan modern borç türlerinin, özellikle kredi, leasing ve tahvil gibi araçların, zekât mükellefiyeti üzerindeki etkisinin değerlendirilmesinde yorum farklılıkları gözlemlenmiştir. Bu bağlamda, klasik hükümlerin günümüz ekonomik yapısına doğrudan uygulanmasında çeşitli zorluklar bulunduğu ve içtihadî yorumlara ihtiyaç duyulduğu sonucuna varılmıştır."
