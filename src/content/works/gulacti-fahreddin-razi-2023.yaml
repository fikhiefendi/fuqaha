abstract: "Hicri altıncı yüzyılın ortasıyla yedinci yüzyılın başlarında yaşayan Fahreddîn er-Râzî, (ö. 606/1210) özellikle İslâmî ilimler disiplinine ciddi katkıları olmuştur. Daha çok kelâm, felsefe, mantık ve fıkıh usûlü alanlarında eser kaleme alan Râzî,İslâmî ilimler alanında yazdığı eser ve fikirleriyle döneminin ve sonraki nesillerin en etkili simalarından biri olmuştur. Özellikle Râzî'yi ön plana çıkaran husus tahkik metodunu geliştirmesi olmuştur. Yani meseleleri delillendirerek ele alıp zayıf olan bazı düşünceleri daha güçlü bir duruma getirmiş ve yeni bir düşünce inşa etmeye çalışmıştır. Kavram çalışmasının bir örneğini oluşturacak şekilde Fahreddîn er-Râzî'nin kıyas anlayışında münâsebe kavramı tezin konusu olarak belirlenmiştir. Münâsebe kavramı, Râzî'nin kıyas ve maslahat düşüncesinde köprü görevi görmesi hasebiyle üzerinde çalışılmayı hak etmektedir. Bu çalışma giriş ve iki bölümden oluşmuş olup birinci bölümde, Râzî'nin hayatı, eserleri, fıkıh usûlüne bakışı ve usûlcülerin münâsebe kavramına yönelik yaklaşımları ele alınacaktır. Tezin ana konusunu oluşturan ikinci bölümde ise Râzî'nin münâsebe kavramına bakışı, münâsebenin kısımları ve bu kısımların tercih hiyerarşisi yer alacaktır. Münâsebe konusu ile bağlantılı olduğu için maslahat-ı mürsele konusu da ele alınacaktır. Râzî, münâsib vasfın kısımlarını üç farklı açıdan taksime tabi tutmakta ve illeti belirleme yollarını belirli bir hiyerarşiye tabi tutarak aklî/ictihâdî olarak illeti tespit yolları arasında en güçlü metodun münâsebe olduğunu ifade etmektedir. Râzî'ye göre münâsebe yönteminin geçerliliğini sağlayan iki husus vardır. Bunlardan biri Allah'ın (c.c.) hüküm ve fiillerinin insanların faydasına olmasıdır. İkincisi ise insan aklının buradaki maslahatı tespit edebilecek düzeyde olmasıdır."
