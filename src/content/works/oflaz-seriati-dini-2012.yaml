abstract: "Ali Şeriati, İranlı Müslüman sosyolog, düşünür ve yazar; özellikle din sosyolojisi ve çağdaş İslam düşüncesi üzerine eserler vermiş bir kişidir. Biz bu çalışmamızda Ali Şeriati'nin dini ve siyasi görüşlerini ortaya koyarken içinde bulunduğu ortamın dini, siyasi sosyal ve kültürel farklılıklarını da göz önüne alarak hareket etmeye çalıştık.Çalışmamızda Şeriati'nin dini ve siyasi görüşlerini ortaya koyabilmek için öncelikle onun itikadi, fıkhi, dini ve siyasi görüşlerini ortaya koyarak incelemeye çalıştık. Onun görüşleri arasındaki, Allah, ibadet, tevhit, Kur'an, nübüvvet, içtihat, İran dinleri ve İslam hakkındaki düşüncesini ortaya koymaya çalıştık.Şeriati'nin mezhep anlayışında ise öncelikle Şiiliğe ve Sünniliğe bakış acısını ortaya koymaya çalıştık. Daha sonra ise Şiiliği, Ali Şiası ve Savefi Şiası ayırımına tabi tutarak aralarındaki farkları incelemeye çalıştık. Şeriati hareketinin özelliklerini ortaya koyarak, bu hareketin öze dönüş çağrısını incelemeye çalıştık. Ayrıca onun İslam düşüncesindeki yerini ve Şeriati'nin İslam dünyasına etkilerini ele alarak çalışmamızı tamamladık."
