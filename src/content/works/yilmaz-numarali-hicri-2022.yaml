abstract: "İnsanların ibadetlerini yerine getirmeleri için en kutsal mekânlar hiç şüphesiz mâbedlerdir. Müslümanlar için kutsal sayılan mekânlar cami, mescid iken kiliseler, Hristiyanların dinlerini özgürce gerçekleştirebilecekleri mekânlardır. Osmanlı Devleti, 600 yılı aşkın sürede farklı etnik grupları bünyesinde toplamayı başarmış, himayesi altındaki topraklarda yaşayan gayrimüslimlere dil, din, ibadet özgürlüğü sağlamış, fethettiği yerlerdeki mabedlerin korumasını üstlenmiştir. Osmanlı yöneticileri ve devlet adamları Müslüman halkın gayrimüslim vatandaşlar ile refah ve sükûnet içerisinde yaşaması için kilise ve sinagoglarla ilgili problemleri yakından takip etmiş, yapım ve onarımına ilişkin düzenlemelere belirli kurallar çerçevesinde müsaade edilmiştir. Islahat fermanına kadar yeni kiliselerin inşası yasaktı, mevcut olanların da tamiri aslına uygun biçimde sultanın iznine bağlı olarak yapılabiliyordu. Onarım esnasında ise yapıların genişletilmesi ve yapıya herhangi bir yeni şeyler eklenmesi yasaktı. Sultanların izin belgesine rastlanmayan, sonradan inşası yapılan birçok kilise vardır ve bunların zamanla meşrulaştığını görmekteyiz. Osmanlı'daki kiliselerin bir kısmı varlığını korurken bir kısmı tahrip olmuştur. Var olan kiliselerin tamiri ise İslam hukuku ve Osmanlı politikası gereği ibadet özgürlüğü ve hoşgörü çerçevesinde yapılara dokunulmamış hatta gerekli izinler ile tamir ve termimi sağlanmıştır. Bu çalışmada İslam hukuku ve Osmanlı hukukuna bağlı kalarak kiliselerin tamir ve termimini inceleyeceğiz. Hangi şartlarda ve ne sebeple kilise onarımı yapıldığına dair bilgiler elde edeceğiz. Ayrıca onarımlarla alakalı bazı arşiv örneklerine yer vererek Osmanlı hoşgörüsünü değerlendireceğiz."
