abstract: "Bu tez tüm dünya çapında gelişen İslami bankacılığın doğasını açıklamak için yazılmıştır. İlk olarak, İslami bankacılığın tarihi ve gelişimine ilişkin ve bu bankaların kullandığı enstrümanlara ilişkin bilgiler sunulacak, devam eden bölümde islami bankacılığın gelişimi, etkinliği karlılığı ve istikrarına yönelik çalışmalar yapan literatüre yer verilecek, son bölümde ise Türkiye'de faaliyet gösteren 28 geleneksel mevduat bankası ve İslami bankanın performans kıyaslaması yapılacaktır. Çalışmada 2010-2012 dönemleri arasında her iki grup banka için karlılık, likidite, sermaye yeterliliği gibi rasyolar analiz edilmiş, iki grubun performansları arasında fark olup olmadığını değerlendirmek için t-testleri kullanılmıştır. Sonuçlara göre İslami bankalar, vadettikleri istikrar fonksiyonunu yerine getirememekte, bunu yüksek kredi portföyleri ile de kanıtlamaktadır. Aktif Karlılığı ve Özsermaye karlılığı bu grup için daha yüksek olsa da geleneksel mevduat bankalarından daha riskli durumdadırlar."
