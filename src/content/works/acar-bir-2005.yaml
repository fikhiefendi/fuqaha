abstract: "?Bir İctihad Kaynağı Olarak Kur'an Kıssaları? adlı bu çalışma, Kur'an'daki kıssaayetlerinin lafız ve manalarını hukukû bakımdan ele almaktadır.İslam Hukukunun temel kaynağı Kur'an'dır. Kıssalar da onun önemli bir bölümünüteşkil etmektedir. Bu kıssalar, sadece tarihû bilgiler mi ihtiva ederler, yoksa, onlarda birtakım hukukû hatırlatmalar (telmih) ve dolayısıyla hukukû mesajlar da bulunmaktamıdır? Ayrıca, birinci derecede önceki toplumları muhatap alan bu kıssalardan, diğerinsanlar nasıl ve ne şekilde istifade edebilirler? İşte, bu araştırmada kıssaların bu yönüele alınmış ve onlardan hukuk alanında istifade etmenin ilke ve yöntemleri tespitedilmeye çalışılmıştır.Kur'an, her sahada olduğu gibi, hukukû sahada da, hem bireysel hem de toplumsalmesajlar içeren bir kitaptır. Bu mesajların farklı dönemlerdeki toplumlara bir çokkatkı sağlayacağı muhakkaktır. Bir etkili anlatım tarzı olan Kur'an kıssalarındaki bukatkıları ve değerleri bazı yöntem ve tekniklerle yeni nesillere aktarmak mümkündür.Kur'an kıssalarında, tarihte yaşanmış tüm ayrıntılar yerine, sadece insanlığaanlatılmasında fayda bulunan kısımlarının anlatılması, kıssaların en büyüközelliklerinden biridir. Hangi kıssanın hangi kısmının, hangi surede ne kadar, hangivurguda ve hangi kelimelerle aktarılacağının seçimi ve tercihinin Allah'a ait olduğundaşüphe yoktur. İyi incelendiğinde Allah'ın bu tercihlerinde de hukukû bakımdan nicefaydalar, insanlığın lehine nice hikmetler olduğu görülecektir.Sonuç olarak, İslam alimlerinin ekseriyeti; gerekli esaslara riayet edilmek şartıylaKur'an'ın bir parçası olan kıssalardan hukuk alanında da istifade edilebileceği veonların ictihad kaynağı olabilecekleri kanaatindedirler."
