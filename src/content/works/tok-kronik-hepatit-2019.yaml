title: "Kronik Hepatit C Hastalarında Sofosbuvir/ledipasvir ± Ribavirin ile Paritaprevir/ombitasvir/ritonavir ± Dasabuvir ± Ribavirin Tedavilerinin Etkinlik ve Güvenilirliğinin Karşılaştırılması"
titleTranslation: {"en": "Comparison of the efficiency and reliability of sofosbuvir / ledipasvir ± ribavirine and paritaprevir / ombitasvir / ritonavir ± dasabuvir ± ribavirine in chronic hepatitis c patients"}
