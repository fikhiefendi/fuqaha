abstract: "Giriş ve Amaç: Kronik hepatit C (KHC) enfeksiyonunun tedavisinde pegile interferon (Peg-IFN) ve ribavirin (RBV) uzun yıllar kullanılmıştır. Günümüzde yeni geliştirilen direkt etkili antiviral (DEA) ajanlar ile KHC tedavisinde %95'i aşan kalıcı virolojik yanıt oranlarına ulaşılmıştır. Bu çalışmada ülkemizde kullanım onayı alan Paritaprevir/ ritonavir/ Ombitasvir ± Dasabuvir (PTV/RTV/OBV ± DSV) ve Sofosbuvir/Ledipasvir (SOF/LDP) içeren tedavi rejimlerin etkinliğinin ve güvenirliğinin araştırılması amaçlanmıştır. Gereç ve Yöntem: Çalışma retrospektif olarak planlandı. 2016-2018 yılları arasında Erciyes Üniversitesi Tıp Fakültesi Hastanesi Enfeksiyon Hastalıkları ve Klinik Mikrobiyoloji Anabilim Dalı KHC tanısı ile takip edilen, PTV/RTV/OBV±DSV±RBV ve SOF+LDP±RBV tedavi kombinasyonlarını alan olgular çalışmaya dahil edildi. Hastalara Sosyal Güvenlik Kurumu Sağlık Uygulama Tebliği kuralları ve güncel rehberlere uygun olarak tedavi rejimlerinden birisi uygulandı. Hastaların tedavi öncesinde, tedavi sürecinde ve tedavi sonrasında biyokimyasal, moleküler parametrelerine bakıldı. Tedavi rejimleri ve hasta genotiplerine göre tedavi yanıtları karşılaştırıldı. Tedavi yan etkileri değerlendirildi. Bulgular: Çalışmaya toplam 112 hasta dahil edildi. Hastaların 10'u genotip 1a, 71'i genotip 1b, 31'i genotip 4 idi. 30 hastaya SOF / LDP ± RBV rejimi; 82 hastaya da PTV / RTV / OBV ± DSV ± RBV rejimi verildi. Genotip 1 ve 4 hastalarda her iki tedavi rejimi arasında etkinlik açısından anlamlı fark saptanmadı (p>0,9999). PTV/RTV/OBV ± DSV ± RBV tedavi grubunda %100 KVY elde edildi. SOF /LDP ± RBV tedavi grubunda %96.6 KVY elde edildi. Tedavi altında hastaların aspartat aminotrensferaz (AST) ve alanin aminotransferaz (ALT) değerlerinde anlamlı düşme saptandı. Hastaların %15.9'unda tedavi kesmeyi gerektirmeyecek yan etkiler gözlendi. Yan etkiler nedeniyle PTV/RTV/OBV + DSV tedavisi alan bir olguda tedavinin kesildiği görüldü. Her iki tedavi de iyi tolere edildi ve güvenilir bulundu. Sonuç: Kronik hepatit C hastalarında, PTV/RTV/OBV ± DSV ve SOF/LDP tedavileri, etkin ve güvenilir tedaviler olup yüksek KVY oranlarına sahiptirler."
