abstract: "Bu araştırmada çocuğun ceza ehliyeti, İslam hukuku ve Türk hukuku açısından mukayeseli olarak incelenmiştir. Araştırmamız üç bölümden oluşmaktadır. Birinci bölümde, İslam hukukunda ehliyet türleri ele alınarak öncelikle vücup ehliyeti ve eda ehliyeti kavramsal açıdan detaylı biçimde açıklanmıştır. Ardından çocukların gelişim evrelerinin bu ehliyet türleri üzerindeki etkileri değerlendirilmiş ve özellikle cezai ehliyet bağlamında gelişim dönemlerinin hukuki sonuçlarına değinilmiştir. Son olarak ise; İslam ceza hukukunda suç türlerine göre ön görülen yaptırımlar incelenmiş ve bu yaptırımların çocuklar açısından nasıl uygulandığı ortaya konulmuştur. İkinci bölümde, Türk hukukunda ehliyet türleri incelenmiş; özellikle Türk Ceza Hukukunda çocuğun yaş gruplarına göre cezai ehliyeti sistematik biçimde ele alınmıştır. Devamında ise; suç türleri bazında Türk Ceza Hukukunda ön görülen yaptırımlar değerlendirilmiş ve bu cezaların çocuk failler açısından nasıl uygulandığı detaylı şekilde analiz edilmiştir. Üçüncü bölümde İslam hukuku ile Türk hukukunda çocuğun ceza ehliyeti ve suçlara ilişkin olarak çocuklara uygulanan cezalar karşılaştırmalı olarak ele alınmıştır. Bu kapsamda, İslam hukukunda çocuklara had ve kısas gibi ağır bedeni yaptırımların uygulanmadığı; bunun yerine gelişim dönemleri dikkate alınarak ta'zîr cezalarının tercih edildiği ancak uygulamada mezhepler arasında görüş ayrılıklarının bulunduğu tespit edilmiştir. Türk Ceza Hukuku açısından ise; çocuklara yaş evrelerine göre hapis cezalarının indirimli olarak uygulandığı ayrıca suçun niteliği ve çocuğun yararı gözetilerek koruyucu ve eğitici tedbirlerin benimsendiği sonucuna ulaşılmıştır."
