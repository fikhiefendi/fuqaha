abstract: "İslam Hukuk Metodolojisi'nin önemli konularından olan lafızların taksîminde Mütekellimîn usûlcülerin bazı hususlarda görüş ayrılıkları bulunmaktadır. Bu fikir ayrılıklarının arka planını anlama isteği, tezimizin konusu olan mefhûmu'l-muhâlefeyi inceleme konusu yapmamızın başlıca sebebidir. Bu bağlamda tezimizin amacı, özellikle ilk dönem İslam hukuk usûlcülerinin konuya dair görüşlerini incelemek suretiyle söz konusu kavramın fakihler tarafından nasıl anlaşıldığını ortaya koymaktır. Tezimizde öncelikle usûlcüler tarafından mefhûmu'l-muhâlefenin hangi sınıflandırma içerisinde yer aldığında değindik. Daha sonra mefhûmu'l-muhâlefenin nasıl anlaşılıp tanımlandığı, onu kabul edenlerin delillerine ve onu reddedenlerin gerekçelerine yer verdik. Sonrasında mefhûmu'l-muhâlefenin delil olarak kabul edilmesi için gerekli şartlar ile onun bazı çeşitlerine, tercih sıralamasına ve âmmı tahsîs edip edemeyeceğine yer verdik. Bu şekilde mefhûmu'l-muhâlefe konusunu ilk dönem usûle dair yazılan eserleri temel alarak, bu konuda farklı mezheplerin görüşlerini gün yüzüne çıkarmakta ve konuya dair genel bir porte çizmiş olmaktayız."
