abstract: "İslam hukukunun önemli konularından ve modern araştırma alanlarından biri olan kanun koyma yetkisi konusu hakkında çok sayıda araştırma ve kaynak mevcuttur. Aynı şekilde finansal konularda zorda kalanlar için İslam fıkhı açısından çıkış yollarına dair yapılmış bazı çalışmaların varlığına şahit olmaktayız. Bireyin maruz kaldığı zor durumlara karşı çıkış yollarını ele alan çalışmaların yeterli olmadığını görünce konuyu boşanma hukukuyla sınırlandırarak bu çalışmayı yapmak istedim. Bu çalışmada Hile-i şer᾽iyye olarak da bilinen konu hakkındaki kaynaklar derlenip görüş ayrılıkları ve temelleri tespit edilmiştir. Hile-i şer᾽iyye᾽nin ortaya çıkış tarihi ve fıkıhçıların geçerliliği için belirledikleri kurallar ele alınmıştır. Ayrıca İbn Kayyim ve Şâtıbî᾽nin hile-i şer᾽iyye taksimi de incelenmiştir. Çalışmada talâk olgusunun İslam hukuku ve modern hukuktaki tanımı ve çeşitleri ele alınmış, boşanmaya dair yapılan yeminlerde bireyin fıkıh açısından sorumluluğuna çare teşkil edecek yorumlara dair örnekler sunulmuştur. Verilen örneklerde de görüldüğü gibi insan yaptığı yeminlerde Hile-i şer᾽iyye vasıtasıyla fıkhi açısından sorumluluktan kurtulabilmektedir. Bu çalışma neticesinde elde edilen bulgular, sonuç kısmında zikredilmiştir."
