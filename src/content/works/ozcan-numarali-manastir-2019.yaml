abstract: "Şer'iyye sicilleri Osmanlı Devleti'nin sosyal ve ekonomik hayatını ortaya çıkarması bakımından önemli belgelerdir. Belgeler arasında Osmanlı Devleti'ni genel olarak ilgilendiren alım-satım, borç, miras, nafaka, mehir, tayin, görev tevcihi, gasp, yaralama, adam öldürme, para, ticaret ve vergi gibi konular yer alır. Bu çalışmada M. 1640-1654 yıllarını kapsayan 8 numaralı Manastır şer'iyye sicilinin 65-120 varakları arası trankripsiyonu yapılarak Manastır'ın sosyal, kültürel, siyasi ve ekonomik yapısının tespit edilmesi amaçlanmıştır. Ayrıca bölgedeki görevli kadıların sorunlara nasıl bir çözüm getirdiği ve konuların ele alınış biçimlerine yanıt verilmeye çalışılmıştır. Yapılan incelemede ortaya çıkan konular oldukça farklılık göstermektedir. 8 numaralı Manastır şer'iyye sicilinin ikinci kısmını oluşturan 65-120 varakları arasında konular alım-satım, borç, miras, nafaka, mehir, gasp, atama, görev tevcihleri gibi meselelerdir. Söz konusu bu meseleler bölgenin sosyo-kültürel ve ekonomik yapısını ortaya koymakla birlikte Osmanlı Devleti'nin idari ve adli yapısını da ortaya koymaktadır. Çalışmada gerek defterdeki belgelerden gerekse diğer kaynaklardan faydalanılarak Manastır hakkında yapılacak başka araştırmalara katkı sağlayacağı düşünülmektedir."
