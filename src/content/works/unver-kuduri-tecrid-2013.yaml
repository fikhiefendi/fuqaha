abstract: "Hicrî IV. asır âlimlerinden olan ve Irak?ta Hanefî mezhebinin riyasetine yükselen olan Kudûrî, kolay ve akıcı bir dile sahip olan eseri Tecrîd?de, Hanefî ve Şâfiî mezhepleri arasındaki ihtilâflı meseleleri müdellel bir şekilde ele almış, Şâfiî mezhebine olan vukufiyetini ortaya koymuştur. Delillerinin kritiğini yapmış, nassları farklı açılardan değerlendirmiş, konularla ilgili görüşleri açıklarken farklı yöntemlere de başvurmuş; böylece mezhepler arası ihtilâfların neden ve nasıl ortaya çıktığına dair önemli mülahazalar sunmuştur. Kitâbü?n-nikâh bahsinde nasslara dayalı ihtilâflar, sübûta ve delâlete dair olmak üzere temelde ikili bir taksime tabi tutulmuştur. Rivayet malzemesi hakkındaki sübûta dair ihtilâflar, rivayetlerin senedinin ittisaline ve aktarılan sözlerin kime ait olduğuna yöneliktir. Delâlete dair ihtilâflar ise beşli bir taksimata sahiptir. Buna göre nasslarda yer alan lafızların vaz?ına, manaya mefhum ve delâletine, teviline, kapsamına ve gramatik açıdan farklı yorumlanmasına dair ihtilâflar, nassların delâletiyle ilgili ihtilâfların temelini oluşturmaktadır. Eserde bunların her birinde cedel metodu kullanılarak delillerin münakaşası yapılmakta ve Hanefî mezhebinin görüşleri savunulmaktadır."
