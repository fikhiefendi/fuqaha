abstract: "Bu araştırma,“İslam hukukunda avcılık ve hayvan kesiminde kullanılan aletler”ile ilgilidir. Bu araştırmayla temel, önemli ve gizli soruya bir yanıt bulmaya çalıştım: Doğru kesim yöntemi nedir, kullanılan aletler nelerdir ve yanlış kesim nedir. Bu araştırma üç bölüme dayanmaktadır: ilk bölüm, İslam hukukunda kesim ve avcılıkta İslami emirler, şeriatta kurban kavramı, hayvan kesim türleri, kurbanlık hayvan, kurban etme koşulları, mazarratları ve faydaları, yeni helal kesim yöntemleri. Elektrik, çekiç, balta, tüfek ve silahla kesim ve bu konuda İslam hukukunun görüşü gibi. İkinci bölüm, İslam hukukunda kurbanın derisinin yüzülmesi, kurbanın Kitap Ehli'nin gözünde hükmü, katliam yöntemleri ve kesimin iğrençlikleri, avlanmanın tanımı ve hükmü ile ilgili İslami emirler hakkındadır. Hanefi mezhebinde avlanabilecek av araçları ve hayvanlar. Üçüncü bölüm ise İslam hukukunda avcılıkta kullanılan aletler ve kuralları ile kesim ve deri yüzme hakkındadır. Vardığım sonuçlardan biri, helal kesim aletinin hayvanın durumuna ve türüne uygun olması, hayvanın canlı ve sancıya tutulmasına dikkat etmemiz gerektiğidir. Helal kesim koşulları göz önüne alındığında, hayvanı kesmek için acil araçların kullanılması caizdir. Ve eğer et Müslüman olmayan ülkelerden ithal ediliyorsa, kesiminin hukuka uygun olduğu ispatlanmadıkça, onu kestiren Kitap Ehli'nden olsa bile yenmesi caiz değildir. Bununla birlikte,Yahudileri ve Hıristiyanları kastediyoruz ve eğer ikisi dışındalarsa, oybirliği ile caiz değildir. Araştırmamı bir dizi tavsiyeyle bitirdim. Bu tavsiyelerin en önemlisi mezbahaları izlemek ve et ve hayvansal ürünleri ihraç eden şirketleri ve ülkeleri kontrol etmek için üyeleri din ve tıp bilginlerinden oluşan uzman bir kurumun oluşturulmasıdır. Anahtar Kelimeler (Keywords in Turkish): aletler, kesme ve soyma, özellikler."
