abstract: "Hazırlanmış olan tezin amacı, küçük çocukların evlendirilmesi meselesinin Hanefî mezhebi ve Şafiî mezhep imamları açısından nasıl değerlendirildiğini incelemektir. Yapılan bu çalışmanın giriş bölümünde araştırmanın konusu, amacı ve öneminden bahsedilmiş, takip edilen metot ve kullanılan kaynaklar hakkında bilgiler verilmiştir. Birinci bölümde; kanun, nikâh, küçüklük, muhayyerlik ve temyiz kavramları açıklanmıştır. İkinci bölümde, birinci bölümde bahsedilen kavramlar, Hanefi mezhebinde nasıl değerlendirildiği ayrıntılı bir şekilde ele alınmıştır ve araştırmanın konusu ayetler ve hadisler ışığında incelenmiştir. Üçüncü bölümde kavramların Şafiî mezhebi tarafından nasıl değerlendirildiği ve konuya bakış açıları ele alınmıştır. Dördüncü bölümde küçük çocukların evlendirilmesine karşı çıkan İslâm düşünürlerinin görüşleri ele alınmıştır. Sonuç bölümünde genel bir değerlendirme yapılarak araştırma tamamlanmıştır."
