abstract: "İslâmî ilimler alanında etkin bir şahsiyet olan İmam en-Nesefî᾽nin bir çok eseri ve bu eserler üzerine yapılmış bir çok şerh çalışmaları mevcuttur. Önemli bir şahsiyet olan en-Nesefî᾽nin anlaşılması, eserlerinin bilinmesine bağlıdır. en-Nesefî᾽nin Kenzu᾽d-dekâik adlı eserine yapılmış en önemli şerhlerden biri de eş-Şilbî tarafından yapılan Tecrîdu᾽l-fevâid adlı eserdir. Alanında önemli bir yer tutan bu eser maalesef günümüze dek ilmi neşri yapılmaksızın yazma eser olarak kalmıştır. Kölenin azad edilmesi ve ilgili konuları ihtiva eden bu eserin tahkik edilerek ilim dünyasına kazandırılmasının önemli olduğu kanaatindeyiz. Bu öneme dayanarak çalışmamızda Hanefî fıkhında önemli bir yeri olan Şeyh Şehabeddin'in“Tecridu'l-fevaidi'r-Rekaik fî şerhi Kenzi'd-dekaik”adlı eserin tahkik edilmesi tercih edilmiştir. Çalıma; giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Girişte konunun önemi ve tercih edilme nedenlerine değinildiği gibi konu hakkındaki çalışmalar hakkında da bilgi verilmiştir. Ayrıca yazarın yaşadığı dönem ve coğrafyada siyasî ve kültürel çevre de ele alınmıştır. Birinci bölümde İmam Nesefi'nin ilmî şahsiyetinin yanı eserleri, etkilendiği isimler ve Şeyh Şehabeddin'in hayatı, ilmî kişiliği ve yaşadığı dönemin siyasî ve kültürel durumu ele alınmıştır. Ayrıca söz konusu şahsiyetlerin etkilendiği ve etkilediği ekol ve şahıslar da aktarılmıştır. İkinci bölümde elimizde mevcut el yazmanın tanımı yapılmış, yazara aidiyeti irdelenmiştir. Ayrıca eserin tahkikli metni de verilmiştir. Çalışma neticesinde varılan neticeler ve öneriler ise sonuç kısmında maddeler halinde beyan edilmiştir. Son olarak da çalışmada kullanılan kaynakların listesi alfabetik olarak verilmiştir."
