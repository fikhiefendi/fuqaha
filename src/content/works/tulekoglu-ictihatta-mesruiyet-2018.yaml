abstract: "İslam hukukunda hükme ulaşma usûlü olarak ictihad kavramı ve kapsamı üzerinde bazı tartışmalar vardır. Bu tartışmanın izlerine ilk nesil sahâbeden itibaren rastlanır. Ancak fıkıh usulünde tartışmanın ortaya çıktığı esas nokta ictihadda re'y kullanımı ve ictihadın meşru hali olarak sunulan kıyas teorisidir. Bu tartışmanın bir sonucu olarak kıyasın meşru olduğunu savunan fıkıh âlimleri Kur'ân ve sünnetten dayanaklar getirerek teorilerinin meşru olduğunu ispatlamaya çalışmışlardır. Fıkıh âlimleri bu kapsamda Muâz b. Cebel'den nakledilen hadisi de delil olarak kullanmışlardır. Hadisi dayanak olarak kullanan fıkıh âlimleri bu hadisi delil olmaya elverişli kabul etse de hadisin senedi hakkında hadis âlimlerinin eleştirileri vardır. Hadis âlimleri senedinde yer alan ashâb-ı Muâz ve Hâris b. Amr'ın meçhul olması; isnadındaki kopukluk gibi sebeplerle hadisi zayıf kabul etseler de, fıkıh âlimleri bu rivayetin makbul olduğunu iddia etmiştir. Söz konusu Muâz hadisini delil olarak kullanan fıkıh âlimleri, hadis âlimlerinin bu eleştirilerine karşı bazı cevaplar vermişlerdir. Bu cevapların başında bu hadisin metninin kabul ile karşılandığı (telakki bi'l kabul) iddiası gelmektedir. Bu çalışmada Muâz hadisi sened ve metin açısından incelenmiş ve sıhhati tespit edilmiştir. Ayrıca fıkıh âlimlerinin bu hadisi tarihten günümüze delil olarak kullandığı konular tespit edilmiştir. Bu çalışma neticesinde Muâz hadisinin sened açısından zayıf bir hadis olsa da metnini destekleyen haberlerin bulunması sebebiyle hasen ve makbul mertebesine yükseldiği ortaya çıkmıştır."
