abstract: "İslam dininin hukuk sistemi olan fıkıh, ilk kez uygulanmaya başlandığı toplumlarda, İslam'ın değerler yelpazesine göre gerçekleşecek olan değişimin temel düzenleyici faktörüdür. Temel ilkeler açısından ilahi kaynaklı olan fıkıhta, hükümlerin toplumsal gerçekliğe uygun bir şekil alabilmesi için fakihlere maksatlı olarak geniş bir alan bırakılmıştır. Fıkhın bu beşeri yönü, onu toplumsal değişimle karşılıklı aktif bir etkileşim içerisine sokmuştur. Toplumsal değişimin fıkha, fıkhın toplumsal değişime etkisi, sosyolojik bağlamda ele alındığında, İslam'ın sosyal hayata yansımalarının anlaşılabilmesi, Müslümanların yaşam tarzlarının yorumlanabilmesi, fıkhî hükümlerin inşasında toplumsal gerçekliğin ne derece dikkate alındığının bilinmesi, toplumsal değişimde fıkhın etkilerinin neler olduğunun tespit edilmesi kolaylaşacaktır. Toplumsal değişim ve fıkhın birbirlerine etkilerini incelediğimiz çalışmamızda, günümüz akademisyenleri tarafından hazırlanan Türkiye Diyanet Vakfı İslam Ansiklopedisi örneklem olarak belirlenmiştir. Fıkha ilişkin tespit edilen 1372 maddenin eserler ve şahıslar dışında kalan 660 tanesi, aile, ekonomi, siyaset, suç ve tıp-sağlık ana başlıkları altında tasnif edilerek; belgesel gözlem yöntemi kullanılarak incelenmiştir. Sonuç olarak fıkıh, toplumsal değişimin kimi zaman tetikleyici, kimi zaman yavaşlatıcı unsuru olmuş; kimi zaman da toplumsal değişimi engelleyen bir faktöre dönüşmüştür. Diğer yandan toplumsal gerçeklik, fıkhın inşa sürecinde dikkate alınmış; toplumsal değişim ve ihtiyaçlar çerçevesinde fıkhî hükümler tekrar yorumlanarak güncellenmiştir. Bu güncel yapısıyla fıkıh, günümüz cari hukuk sistemlerine referans olma özelliğini bünyesinde taşımaya devam etmektedir. Ayrıca fıkhın sosyolojik bir değerlendirmeye tabi tutulması, hem hukuk hem de fıkıh alanında yürütülen akademik çalışmalara yeni bir bakış açısı kazandıracaktır."
