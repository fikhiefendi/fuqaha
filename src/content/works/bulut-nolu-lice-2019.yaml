abstract: "Şer'iyye sicilleri, Osmanlı Devleti'nin siyasi, sosyal, idari, ekonomik vb. kayıtlarını ihtiva eden birinci elden kaynaklar olup çok çeşitli bilgiler içermektedir. Genel itibariyle giriş ve üç bölümden oluşmaktadır. Bu çalışmada; Diyarbakır Eyaletinde bulunan Lice kazâsına ait XIX. Yüzyılın başlarında (1327-1329/1909-1911) Lice mahke-mesinde görülen davaları konu edinen meselelerin kaydedildiği ve günümüzde Milli Kütüp-hane'de yer alan 335 numara ile kayıtlı bulunan Diyarbakır Şer'iyye sicilinin transkripsiyonunu ve değerlendirilmesini içermektedir. Giriş bölümünde şer'i mahkemeler ve şer'iyye sicillerinin ne olduğu belge türleri hak-kında bilgiler verilmiştir. Birinci bölümde Osmanlı öncesi ve sonrası Diyarbakır tarihi hakkında kısa bilgi veril-miştir. Ayrıca Lice ilçesinin Antik dönemlerden Osmanlı hâkimiyetine kaadar geçen tarihi hakkında bilgi verilip Lice'de yer alan tarihi yapılara kısaca değinilmiştir. İkinci bölümde, 335 numaralı şer'iyye sicilinin transkripsiyonu yapılmış ve bunun özeti hazırlanmıştır. Özetler belgelerin transkripsiyonlarının başında kalınlaştırılarak verilmiştir. Üçüncü bölümde ise, söz konusu defterde geçen bilgiler tahlil edilerek burada geçen hu-susların değerlendirilmesi yapılmıştır. Anahtar Kelimeler Osmanlı Devleti, Diyarbakır, Lice, Kadı, Şer'iyye Sicili"
