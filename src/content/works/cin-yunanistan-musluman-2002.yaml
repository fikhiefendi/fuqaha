abstract: "ÖZET 2 Temmuz 1881 tarihli İstanbul Andlaşması, 14 Kasım 1913 tarihli Atina Andlaşması, 10 Ağustos 1920 tarihli Yunanistan'daki Azınlıkların Korunmasına Dair Sevr Andlaşması, 24 Temmuz 1923 tarihli Lozan Banş Andlaşması Yunanistan'daki Türk azınlığın hukuki statüsünü tanzim eden en önemli andlaşmalardır. Bu andlaşmalar, Yunanistan'ı Müslüman Türkler dışında diğer azınlıklar bakımından da yükümlülükler altına sokmuş ve bu yükümlülükler gereği, Yunan iç hukukunda yasal düzenlemeler yapılmıştır. Söz konusu yasal düzenlemelerin konumuz açısından en önemlisi 1920 tarih ve 2345 sayılı yasadır. Bu yasa, 24 Aralık 1990 tarihinde Yunan Hükümet Gazetesinin 182 sayılı nüshasında yayınlanarak, yürürürlüğe giren Cumhurbaşkanlığı Kararnamesi ile yürürlükten kaldırılmıştır. 1920 tarih ve 2345 sayılı yasa yürürlükte kaldığı müddetçe, Başmüftülük ile ilgili hükümleri Yunan yönetimi tarafından hiçbir zaman uygulamaya konulmamıştır. Diğer taraftan 1920 tarih ve 2345 sayılı yasanın Müftülerin Müslüman Türk azınlık tarafından serbest seçim yöntemiyle belirlenmesini öngören hükümleri de Yunan yönetimi tarafından uygulanmamıştır. Diğer taraftan da Yunanistan, imzalayıp, onayladığı andlaşmalarla üstlendiği yükümlülükleri yerine getirmeyerek, ahde vefa (pacta sunt servanda) gibi evrensel ilkeleri ihlâl etmiş ve böylece devlet olarak güvenilirliğini kaybetmiştir. Yunanistan'ın 1981 yılında Avrupa Birliği üyesi olması bu tutumunda herhangi bir değişiklik yaratmamış, aksine daha katı, oldu bittilerle dolu keyfi bir siyaset devreye sokmuştur. O kadar ki, yapılan haksızlıklar ve hukuka aykırı uygulamalar karşısında, Batı Trakya Müslüman Türklerinin din ve vicdan özgürlüklerinin ihlâlleri ile bu konudaki mağduriyetleri daha da artmıştır. Avrupa Birliği üyesi Yunanistan'da, Müslüman Türklerin kendi anadillerinde eğitim ve öğretim yapacak anaokullarına, ilköğretim ve lise açmalarına kesinlikle izin verilmemektedir. Demokrasi, özgürlük, insan hakları, uluslararası hukuk ve hukuk devleti ilkelerini ağzından düşürmeyen Avrupa Birliği üyesi Yunanistan, bütün bu ilkelerin tersini uygulamaktadır. Yunanistan, sadece Müslümanların din ve vicdan Vözgürlüklerini ihlâl etmekle kalmamakta, Hristiyanlığın Katolik ve Protestan mezheplerinin ve diğer dinlerin din ve vicdan özgürlüklerini de ihlâl etmektedir. Özellikle Avrupa Birliği üyesi bir devlette, bu ihlâllerin yaşanması ve diğer üye devletler ile Avrupa Birliği kurum ve kuruluşların bu uygulamaları ve ihlâlleri görmemezlikten gelmeleri, çifte standart uygulamaları da ayrıca üzerinde düşünülmesi gereken bir olgudur. VI"
