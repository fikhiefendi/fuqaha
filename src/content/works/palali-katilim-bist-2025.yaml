abstract: "Finans dünyasının değişen ve gelişen yapısı, portföy yapılarını da etkilemekte ve daha başarılı planlamalar için analiz ve değerlendirmeler gerekmektedir. Bu çalışma, BİST 30 ve Katılım 30 Endekslerinin Aralık 2021 – Mayıs 2025 dönemindeki günlük getiri ve volatilite yapılarını, pandemi (1 Aralık 2021 – 5 Mayıs 2023) ve pandemi sonrası (6 Mayıs 2023 – 26 Mayıs 2025) alt dönemlerinde karşılaştırmalı olarak incelemektedir. BİST 30 ve Katılım 30 endekslerinin pandemi dönemi ve pandemi sonrası dönemdeki günlük getirileri ve riskleri karşılaştırılmıştır. Öncelikle her iki endeksin günlük getirileri hesaplanmış ve ortalamaları incelenmiştir. Yapılan analizlerde, pandemi dönemi ile pandemi sonrası dönem arasında endekslerin ortalama getirileri açısından genel olarak çok büyük farklılıklar bulunmadığı görülmüştür. Yani her iki endeks de yatırımcıya benzer düzeyde kazanç sağlamıştır. Ancak risk açısından farklı bir sonuç ortaya çıkmıştır. Standart sapmaya dayalı olarak yapılan hesaplamalarda BİST 30 endeksinin hem pandemi döneminde hem de pandemi sonrasında Katılım 30 endeksine göre daha yüksek oynaklığa sahip olduğu görülmüştür. Bu da BİST 30'un daha dalgalı bir yapıya sahip olduğunu ve yatırımcı açısından daha fazla risk içerdiğini göstermektedir. Katılım 30 endeksinin ise görece daha istikrarlı bir seyir izlediği söylenebilir. Yapılan Mann-Whitney U testi sonuçları da bu bulguları desteklemiştir. Bazı aylarda, özellikle pandemi döneminde, endekslerin getirilerinde pozitiften negatife veya negatiften pozitife doğru değişimler gözlenmiştir. Fakat bu değişimler sürekli bir şekilde aynı yönde olmamıştır. Genel olarak bakıldığında, getiriler açısından anlamlı bir fark çıkmazken, risk açısından BİST 30'un Katılım 30'a göre daha yüksek oynaklığa sahip olduğu istatistiksel olarak da doğrulanmıştır. Bu açıdan Katılım 30 endeksinin daha düşük bir volatilite ile İslami finans temelinde uygun yatırım imkânı sunduğunu göstermektir."
