abstract: "'Fukahânın Ebû Hureyre Rivâyetlerine Bakışı' başlıklı tezimiz iki bölümde ele alınmıştır. Birinci bölümde Ebû Hureyre'nin hayatı tüm yönleriyle değil de iksâru'l-hadis yönüyle ele alınmaya çalışılmıştır. Zira Ebû Hureyre İslam'ın son yıllarında ve yaklaşık dört yıl gibi bir süre Rasûlullah (s.a.s) ile beraber bulunabilme şerefine nail olmuşken kendisinden daha kıdemli ashâbdan daha fazla hadis naklettiği tarihi bir vakıa olarak kitaplarımızda yerini almıştır. İşte bu noktadan hareketle onun ne zaman Müslüman olduğu, Rasûlullah (s.a.s) ile ilk kez ne zaman karşılaştığı, ona mülâzemeti, üstlendiği önemli görevler, çok hadis nakletmesinden mütevellit ashâb-ı Rasûl'ün ona ve rivâyetlerine yaklaşımları, onu tenkit ve taltifleri, onun Suffe ehlinden olması, kendisinden hadis tahammül eden talebeleri gibi konulara bu bölümde yer verilmiştir. Tüm bunlar ikinci bölümde ele alınacak olan Fukahânın Ebû Hureyre ve rivâyetlerine bakışlarını ortaya koyacak ana mihver ve sınırları belirlemek için yapılmıştır. İkinci bölüm, 'Usûl-i fıkıh kitaplarında Ebû Hureyre rivâyetleri' ve 'Fıkıh kitaplarında Ebû Hureyre rivâyetleri' olmak üzere iki ana başlıkta ele alınmıştır. 'Usul-u fıkıh kitaplarında Ebû Hureyre rivâyetleri' başlığı altında Hanefî mezhebi usûlcülerinden altısı, Mâlikî mezhebi usûlcülerinden üçü, Şâfiî mezhebi usûlcülerinden dördü ve Hanbelî mezhebi usûlcülerinden ikisine yer verilerek ele alınmış ve her fakihin bakışı müstakil olarak ele alınarak en sonunda da genel bir değerlendirmeyle tüm mezhep ulemâsının görüşleri ayrıca ele alınmıştır. 'Fıkıh kitaplarında Ebû Hureyre rivâyetleri' başlığı altında Hanefî mezhebi için el-Mebsût, Mâlikî mezhebi için el-Müdevvene, Şâfiî mezhebi için el-Mühezzeb ve Hanbelî mezhebi için el-Muğnî eserleri esas alınarak bu mezheplerin Ebû Hureyre ve rivâyetlerine bakış açıları ortaya konulmaya çalışılarak genel bir değerlendirme yapılmıştır."
