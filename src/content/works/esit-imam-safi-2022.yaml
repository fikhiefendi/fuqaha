abstract: "Rasûlullâh'ın (sav) söz ve fiillerine dair haberlerin nakliyle başlayan hadis tarihinin günümüze değin en temel problemi nakledilen bu haberlerin kaynağa aidiyeti (sübût) meselesi olmuştur. Bu problemin çözümü adına sahabe neslinden itibaren hem râvî hem de mervîlere dair çeşitli kurallar konulmuş ve zaman içerisinde bu kurallar usûlcüler tarafından önce farklı eserlerin içerisinde dağınık biçimde daha sonraları ise müstakil eserler halinde muntazaman kaydedilmiştir. Bir fakih olarak İmâm eş-Şâfi'î (150/767-204/820), müstakil hadis usûlü eserleri öncesinde usûle dair konuları genişçe ele alması ve Hanefî, Mâlikî ve diğer 2/8. asır gelenekleriyle etkileşim halinde olması yönüyle kurucu bir rol oynamıştır. Bu çalışma, hadis usûlü özelinde onun katkı ve etkisini tespit etmek üzere tasarlanmış ve yürütülmüştür. Bu doğrultuda çalışmada öncelikle eş-Şâfi'î'nin eserlerinden yararlanılarak onun usûl, haber ve hadis anlayışı ortaya konulmaya çalışılmış, akabinde erken dönem hadis usûlü müelliflerinden er-Râmhurmuzî'nin (ö. 360/971) el-Muhaddisu'l-Fâsıl, el-Hâkim en-Nîsâbûrî'nin (ö. 405/1014) Maʿrife ve el-Hatîb el-Bağdâdî'nin (ö. 463/1071) el-Kifâye adlı eserleri incelenerek etkisi tespit edilmeye çalışılmıştır. Çalışmanın sonucunda ise eş-Şâfi'î'nin erken dönem usûl eserleri üzerindeki özgün etkisinin ricâl, hadis ilimleri ve hadis ıstılahlarından ziyade haber-i vâhidin kabul şartları ve delil değeri hakkındaki görüş ve tutumuyla olduğu görülmüştür."
