abstract: "Ümmi Sinânzâde ismiyle meşhur Şeyh Hasan b Ahmet'in el-Mecâlisü's-Sinâniyye isimli tefsiri, hicri on birinci asrın meşhur tefsirlerindendir. Müellif, Fâtiha suresinden Zuhruf suresine kadar seçtiği bazı ayetleri 170 den fazla mecliste (bölümde) tefsir etmiştir. Bu araştırma, Âl-i İmran, Nîsâ, Mâide, En'âm, A'râf, Enfâl, Yunus ve Hûd surelerinden müteşekkil 31 ile 60. meclisler arasını kapsamaktadır. Müellifin eserini oluştururken, tefsir, hadis, dil ve tasavvuf kitaplarındaki bilgileri bir araya getirmesi eserin önemini attırmıştır. Garib kelimelerin manası, beyanı, delalet ettikleri hususların tespit edilmesi ve mümtaz bir üslupla sunulması da eserin önemini artıran hususlardandır. Müellif eserini her meclis sonunda verdiği nasihatlerle zenginleştirmiştir. Müellifin nasihat ve öğüt vermediği bir meclis bulunmamaktadır. Araştırmada müellifin biyografisi ve ilmi durumu ortaya konulurken tarihsel betimleyici yöntem kullanılmıştır. Nüshaların karşılaştırılması, farklılıkların tespiti, nakledilen bilgilerin asli kaynaklardaki yerlerinin gösterilmesi gibi Tahkik ve talikle ilgili konularda ise ilmi tahkik metodu kullanılmıştır. Araştırmada şu sonuçlara ulaşılmıştır: Eserde en çok Ebüssuûd'un tefsiri ve Sehâvî'nin el-Kavlü'l-bedî isimli eserinden nakil yapılmıştır. Eserde vaaz ve irşad üslubu hakimdir. Bu sebeple eser sufi tefsirleri içerisinde zikredilebilir. Eserin bütün meclislerinin sonu okuyucuya nasihatle bitmektedir. Müellif eserine aldığı hadislerin sahîh olmasını önemsememiştir. Bu sebeple eserde bolca hadis yanında metrûk ve zayıf hikayelerde yer almaktadır. Müellif rivâyetin konuyla ilgili olmasını dikkate almış, rivâyetlerin sıhhatleriyle ilgilenmemiştir. Eserde her meclisin sonunda Mevlâna Celaleddin-i Rûmî'den bir beyit yer almaktadır."
