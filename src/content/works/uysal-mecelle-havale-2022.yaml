abstract: "Mecelle'nin dördüncü kitabında düzenlenen havale akdi, temelde borcun naklinin İslam hukuku ve devamında Osmanlı uygulamasında karşımıza çıkan şeklidir. İsviçre / Türk hukukundaki havale usulü ile yapılan ancak nitelik itibariyle Roma / Fransız hukukundaki borç havalesi gibi bir taahhüt havalesi niteliği taşıyan havale kurumu, bu çalışmada İslam hukukunun birincil kaynakları ışığında ele alınmış, Mecelle kapsamında kanunlaştırılan hükümleri de ayrıca incelenmiştir. Osmanlı hukuku özellikle XVI. yüzyıldan itibaren Hanefi mezhebi içerisinde baskın olarak kabul edilen hukuki görüşlere dayanmaktadır. Ancak Mecelle'nin havale kitabında birkaç hususta bu baskın görüşlerden ziyade mezhepte ikincil konumda olan bazı görüşler tercih edilmiştir. Tercih edilen bu görüşler ile birlikte bazı noktalarda klasik dönem Osmanlı uygulamasından ayrılan Mecelle, tedvin ettiği maddelerin yürürlüğe girmesi ile birlikte uygulanacak hukuk bakımından havale kurumunun sınırlarını da belirlemiştir. Bu nedenle tezimiz, genel olarak İslam hukukunda kabul edilen havale akdinin Mecelle düzenlemesi ile sınırlı tutulmuştur. Bununla birlikte gerek Roma ve diğer Avrupa hukukları, gerek İslam hukukunda Hanefi mezhebi dışında kalan diğer fıkıh mezhepleri tarafından benimsenen havale usulleri ve hükümleri de incelenerek konuya karşılaştırmalı bir bakış sağlanmaya çalışılmıştır."
