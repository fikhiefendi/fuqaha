abstract: "Ekonomi biliminin temel kavramlarından biri homo economicustur. Alanın dayandığı insan anlayışını oluşturan bu kavramın özellikleri ise şunlardır; fayda ençoklaştırma, rasyonel olma ve metodolojik bireycilik. Homo economicus disiplinin tarihi gelişimi içerisinde önemli bir rol oynamaktadır. Dolayısıyla ekonomi bilimi içerisindeki heterodoks okullar tarafından eleştiriye tabi tutulmuştur. Bu okullardan birisi de İslam ekonomisidir. Homo economicusun karşısına alternatif olarak homo islamicus konulmaktadır. Fakat ayrıntılı bir inceleme sonucunda görülecektir ki; homo islamicusun homo economicustan ciddi farklılıkları bulunmamaktadır. Homo economicusa yapılacak meydan okumanın ontolojik bir düzlem içerisinde gerçekleşmesi gerekmektedir. Nurettin Topçu anti-kapitalist duruşu nedeni ile bu konuda başvurulacak isim olarak belirlenmiştir. Çalışmanın temel kaynakları Topçu'nun eserleri olmuştur. İlk olarak yapılan Topçu'nun metinlerinde homo economicus kavramına yapılan doğrudan atıfları tespit etmek olmuştur. Sonrasında ise kavramın bileşenleri ayrı ayrı incelenmiştir. Homo economicus, Topçu tarafından kazanan insan olarak tanımlanmaktadır. Ayrıca kamil insanın ortaya çıkışını engelleyen özellikler barındırması nedeni ile eleştirilmektedir. Ona göre, insanların fayda ençoklaştırma adına kararlar alması ahlaki değildir. Çünkü iyi ile kötü, haz ve fayda tarafından belirlenemez. Akıl ise hesap yapmaya indirgenemeyeceğinden rasyonel tutum da kabul edilmemektedir. Topçu birey meselesine önem vermesine rağmen, metodolojik bireyciliği uç noktalara gittiği için eleştirmiştir. Homo economicusun karşısına konulacak ideal insanın tespiti için Topçu'nun temel kavramları ele alınmıştır. Hareket-irade-isyan olarak belirlenen kavramların etrafında bir insan tiplemesi ortaya çıkarılmıştır. Entelektüel tarih yöntemi gereği bu kavramlar ele alınırken Topçu'nun düşünce dünyasına etki eden isimler de incelenmiştir. Hareket felsefesi ve vahdet-i vücud düşüncesi gerekli olan ontolojik zemini sunmaktadır. İsyan ahlakı ise aksiyolojinin ortaya çıkarılmasında önemli bir rol oynamaktadır."
