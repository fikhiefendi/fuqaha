abstract: "Safevî İran'ının kurulması Şia mezhebi açısından bir dönüm noktası olmuştur. İlk Safevî hükümdarı Şah İsmail (ö. 930/1524), ilk olarak devletin resmi mezhebini İsnâaşeriyye Şia'sı olarak belirlemiştir. Şah İsmail, mezhebi taassup çerçevesinde katı bir teşeyyu' politikası yürütmüştür ve İran'da çoğunluğu Sünni olan toplumu kısa sürede Şiîleştirmeyi çalıştı. Şiîleştirme politikası içerisinde hiç şüphe yok ki ulemanın rolü çokça fazladır. Ancak o dönem bölgede mevcut Şiî ulemanın yetersiz olduğu görülecektir. Dolayısıyla Cebel-i Amil ile Bahreyn gibi öne çıkan Şiî ilim merkezlerinden ulema arayışına gidilmiştir. Bu bölgelerden öne çıkan ise Cebel-i Amil olmuştur. Cebel-i Amil ise Şia'nın dış etkenlerden uzak kalarak geliştiği bir bölgede, Usûliyye ekolünün öncüsü konumunda olmuştur. Bu ekol metot olarak Safevîlerin ihtiyacını karşılayacak durumdaydı. Doğal olarak bölge ulemasına resmi davet gönderilmiştir. Öncü ulema olan Ali el-Kerekî (ö. 940/1534), resmi davete icap ederek İran'a gelmiş ve bu yolculukta geride kalanlara öncülük etmiştir. Cuma namazı, içtihat ve birçok konuda Safevî yönetiminin kararlarını fetvalarıyla meşrulaştırmıştır. Dolayısıyla kendisinden sonra gelecek ulemanın konumunu da güçlendirmiştir. Cebel-i Âmil'den gelen ulema başta Şeyhülislamlık olmak üzere pek çok mevki ve maddi yüksek kazançlar elde etmiştir. Aynı şekilde Safevî yönetimi Âmilî ulemanın etkisinin yer aldığı ulema sınıfı ile çoğunluğu Sünnî olan toplumu kısa bir sürede Şiîleştirmeyi başarabilmiştir. Netice itibariyle bu tezimizde İran'daki Şiîleştirme programında Âmili ulemanın etkisi, onların bu yöndeki meşrulaştırıcı fetvaları ve Safevî yönetimindeki elde ettikleri imkanlar tetkik edilmiştir."
