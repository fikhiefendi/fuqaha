abstract: "Bu tez, erken dönem Hanefî fıkhında dârülislâm-dârülharp ayrımını hukuk, mekân ve egemenlik ilişkisi çerçevesinde incelemektedir. Çalışmanın temel iddiası, bu ayrımın öncelikle Müslüman ve gayrimüslim coğrafyalar arasında siyasi ya da ideolojik bir tasnif olarak değil, hukuki hükümlerin hangi alanda cari olduğunu, yargı yetkisinin nerede işlediğini, can ve mal dokunulmazlığının hangi şartlarda korunduğunu ve sınır geçişlerinin ne tür sonuçlar doğurduğunu belirleyen bir hukuki mekanizma olarak anlaşılması gerektiğidir. Bu bakımdan tez, dâr ayrımını savaş veya barış eksenli bir devletler hukuku meselesinin ötesinde konumlandırarak, erken Hanefî fıkhında hukuk düzeninin mekânsal işleyişini kuran temel bir çerçeve biçiminde ele almaktadır. Araştırma esas olarak Ebû Hanîfe'nin öğrenci halkasına ve özellikle Ebû Yûsuf ile İmam Muhammed eş-Şeybânî'nin metinlerine dayanmaktadır. Çalışmada başta el-Asl olmak üzere Şeybânî ve Ebû Yûsuf'un mevcut diğer kitapları incelenmiştir. Yöntem bakımından çalışma, yalnızca siyer bahisleriyle sınırlı kalmayıp metinlerin bütüncül olarak okunmasıyla statü, mülkiyet, güvenlik ve hukuki geçiş durumlarıyla ilgili bölümlerin tespitine dayanmaktadır. Bu çerçevede tezin teorik omurgasını üç temel kavram oluşturmaktadır: Ahkâmın cereyânı (hükümlerin icra edilmesi), ismet (hukuki koruma) ve ihrâz (fiili el koymayla mülkiyet edinme). Tez, bu üç kavram üzerinden dâr ayrımının din ve aidiyet, hürriyet, cinsiyet ve meslek kategorilerindeki müslim, harbî, müste'men, hür-köle, erkek-kadın, imam-asker gibi statüler ile; emân, harp, ihtidâ, ticaret ve luhûk gibi sınır geçişi durumlarında nasıl işlediğini ortaya koymaktadır. Sonuç olarak çalışma, erken dönem Hanefî fıkhında dâr ayrımının sabit bir ülke ayrımının ötesinde; yargı, hukuki koruma, mülkiyet ve hukuki statüleri düzenleyen dinamik bir hukuki matris olduğunu savunmaktadır."
