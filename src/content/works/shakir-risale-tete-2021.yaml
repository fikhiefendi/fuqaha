abstract: "Bu çalışmada, 15 ve 16. yüzyıllarda yaşamış, İbn Bilâl'in,“Risâle tete'allaku bi-kelâmi'l-Beyzâvî fî tercîhâtihî beyne'l-Hanefiyye ve'ş-Şâfi'iyye”adlı eserin tahkiki yapılmıştır. Bu çerçevede müellifin hayatı, ilmi kişiliği ve eserleri tanıtılmaya çalışılmıştır. Çalışma, giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı ve kullanılan yöntemle ilgili bilgi verilmiştir. Birinci bölümde müellifin hayatı, ilmi kişiliği ve yaşadığı döneme dair bilgiler sunulmuştur. İkinci bölümüde eserin genel bir tanıtımına yer verilmiştir. Bu bölümde ayrıca eserin ismi, müellife aidiyeti, nüshanın özellikleri, muhtevası ve önemi gibi çeşitli konulara değinilmiştir. Üçüncü bölümde Türkiye'de ve İslâm âleminde kullanılan tahkik yöntemlerine istinat edilerek adı geçen eserin tahkik çalışması yapılmıştır. Çalışmamızda İslâm Araştırmaları Merkezi'nin (İSAM) tahkik konusunda belirlediği kurallar dikkate alınmıştır. Sonuç bölümünde ise yapılan tahkik çalışmasından elde edilen sonuçlar özetlenmiştir."
