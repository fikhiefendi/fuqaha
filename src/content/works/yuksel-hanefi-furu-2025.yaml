abstract: "Bu çalışma, Hanefi fürû fıkıh kitaplarında el-Mesâilü'ş-Şettâ bölümlerinin işlevi, sistematik yapısı, neden yazıldığı ve hukuki dinamikler içindeki rolünü ele almaktadır. el-Mesâilü'ş-Şettâ, fıkıh literatüründe ana başlıklar altında incelenemeyen, belirli bir kategoriye girmeyen ve istisnai durumları içeren meselelerin toplandığı bölümleri ifade etmektedir. Araştırmada, Hanefi mezhebine ait temel fürû fıkıh kitapları incelenerek bu bölümlerin neden oluşturulduğu, nasıl isimlendirildiği, hangi meseleleri içerdiği, müellifin meselelere nasıl çözüm ürettiği ve İslam hukukundaki yeri analiz edilmiştir. Çalışma kapsamında, el-Câmiʿu's-Ṣaġīr, Muḫtaṣarü't-Taḥâvî, el-Mebsûṭ, el-Hidâye, el-İḫtiyâr , Mecmaʿu'l-Baḥreyn, Gurer ve Dürer, Mülteḳā'l-Ebḥur ve Reddü'l-Muḥtâr ʿalâ'd-Dürrü'l-Muḫtâr eserlerinde yer alan el-Mesâilü'ş-Şettâ bahisleri incelenmiştir. Tezde el-Mesâilü'ş-Şettâ kavramının tanımı yapılarak literatürde eksik kalan kısımlar netleştirilmiş ve bu kavramın sistematik bir biçimde incelenmesine katkı sağlamıştır. Bu kitaplarda çeşitli meselelerin ortak ve ayrışan yönleri ortaya konulmuştur. Bu bölümler, hukukun esnekliği ve değişen toplumsal ihtiyaçlara uyum sağlamanın öneminin Hanefi mezhebinde önemli bir yer tuttuğunu göstermektedir. Ayrıca, Hanbeli ve Şafii mezheplerinde de benzer bölümlerin bulunduğu tespit edilmiş, bu yöntemin yalnıza Hanefi mezhebine özgü olmadığı ortaya çıkmıştır. Araştırmanın temel bulguları arasında, el-Mesâilü'ş-Şettâ'nın yalnızca istisnai meseleleri değil, aynı zamanda mezhep içindeki içtihatları derleyerek hukukun güncellenmesine katkı sağladığı yer almaktadır."
