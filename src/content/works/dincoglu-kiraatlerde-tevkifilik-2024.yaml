abstract: "Bu çalışmanın amacı, kıraatlerin ne kadar tevkîfî olup olmadığını tespit etmektir. Bu bağlamda tevkîfî teriminin semantik tahlili yapılmış, kavramlaşma süreci, \"tevkîfî olmanın ölçütleri, bu kavramın kıraat ilmine girişi ve kullanımı tespit edilmiştir. Tevkîfî kavramının zıddı ictihadî terimidir. Kıraat kavramının tercih ve tahyîr ile de ilişkisi tespit edilmiştir. Tevkîfî olmanın temel ölçütü, konunun vahiy, mütevatir sünnet veya sahih sünnet ile tespit edilmiş olması ve aklen belirlenememesidir. Buna göre bütün gaybî ve taabbudî konular tevkîfîdir. Sahih ve makbul görülen kıraatlerin tevkîfîliği, Hz. Peygambere dayanan sahih bir isnat ile Mushaflardan birine uygun olmasına bağlıdır. Kıraatlerin tevkîfî olup olmadığı, kıraatlerin vahiy, Kur'an ve mütevatir kavramlarıyla ne kadar özdeş kabul edilip edilmemesiyle doğrudan ilişkilidir. Sahih kıraatlerin tamamının Kur'an ile aynı ve mütevatir kabul edilmesi, beraberinde cevaplanması imkânsız teolojik ve ilmi soru(n)lar getirecektir. Bu nedenle kıraatlerin kısmen tevkîfî kısmen ictihadî olduğunu kabul etmek, daha tutarlı olacaktır. Bu tutarlılık kıraat ilminde olduğu gibi, islamî ilimler arasında da bir uyum olacaktır. Bu çalışmada lehçesel olan kıraat farklılıklarından çoğunun ictihadî, lehçesel olmayanların ise tevkifi olduğu görülmüştür. Taabbudî konuların delillerinin mütevatir olup olmaması, ibadetlerin tevkîfîliğine engel olmadığı gibi, kıraatlerin ve hüccetlerinin mütevatir olup olmaması da kıraatlerin tevkîfîliğine engel değildir. Kur'an ve kıraatlerin kısmen ayrı kısmen de aynı şeyler olduğundan, kıraatlerin mütevatir olmaması, Kur'an'ın mütevatirliğine engel değildir. İbadet edilmesi uygun olan kıraatler, sahih ve tevkîfi olanlardır."
