abstract: "Bu tez, İmam Gazzâlî'nin bilgi teorisinde ilme giden iki yolu araştırır: İktisab ve ilham. İmam Gazzâlî'nin düşüncesinde, bu iki yol iki bilgi alanıyla, sırasıyla“zâhirî ilim”ve“bâtinî ilim”ile ilgilidir. Şeriatın (vahiy) ve hakikatin zâhirî ilmi, duyuların ve aklın iktisabı ile elde edilirken, bâtınî ilim ilahî olarak bahşedilen ilham ile elde edilmektedir. İmam Gazzâlî, zâhirî ilmi şer'î ilimlerin aslî alanı olarak belirlerken, bâtınî ilim ise daha yaygın olarak tasavvuf olarak adlandırılan“ilm-i mükâşefe”nin alanıdır. Bu tezin esas odak noktası, İmam Gazzâlî'nin terminolojisini uygulamak ve hadisin tarihî-tecrübî yolu, kelâmın aklî yolu, fıkhın tarihî, deneysel ve aklî üç ayrı epistemik yolu şeklinde sınıflandırdığımız, şer'î ilimlerde kullanılan bilgi iktisâbının yöntemlerini araştırmaktır. Bu tez aynı zamanda İslam düşüncesinde dördüncü büyük epistemik yolu olarak sınıflandırdığımız İmam Gazzâlî'nin ilm-i mukâşefe formülasyonundaki ilhâmın mahiyetini ve vasıtalarını da incelemektedir. Bu tez nihai olarak, İmam Gazzâlî'nin, iki bilgi biçimiyle -zâhirî ilim ve bâtınî ilim ile- ilgili olan bilgiye giden iki ayrı yolu—iktisab ve ilhamı—tanımlayıp takdir ederken, bunun insan için mümkün olan tüm bilgi ve kesinliğin en yüksek formlarını oluşturan mukâşefenin ilahî armağanları aracılığıyla doğrudan insanın kalp-ruhuna verilen bâtın bilgisi olduğunu iddia eder (hakk-ı yakîn). Böyle bir yakîn, tevhidin müşâhadesine tekabül eder ve bize göre İmam Gazzâlî'nin düşüncesinde gerçek bir anlatılamazlık durumunu temsil eder."
