abstract: "Dünyada İslami bankacılık, Türkiye'de ise katılım bankacılığı olarak adlandırılan bankacılık sektörü, faaliyet göstermeye başladığı 1960'lı yıllardan günümüze kadar büyümesini istikrarlı bir şekilde devam ettirmiştir. 2021 yılında yaklaşık 2,8 trilyon $ büyüklüğe sahip olan küresel faizsiz bankacılık varlıklarının %9,5'ine sahip olan Malezya sektör içerisinde önemli bir konumda bulunmaktadır. Küresel faizsiz bankacılık varlıklarının yaklaşık %2'sine sahip olan Türkiye'de ise 2015 yılından itibaren kamu katılım bankalarının da sektöre girmesi ile büyüme hızı ivme kazanmıştır. Türkiye'deki bankacılık sektöründen yaklaşık %8 pay alan ve bu payı 2025 yılında %15'e yükseltmeyi hedefleyen faizsiz bankacılık sektöründeki kurumlar, bu hedefe ulaşmak için finansal ürünler geliştirmeye ve yeni yatırımlar yapmaya devam etmektedirler. Bu çalışma Türkiye'deki faizsiz bankacılık sektörünün karşılaştığı problemleri tespit etmek ve faizsiz bankacılığın gelişmesi için atılması gereken adımları elde edilen bulgular çerçevesinde ortaya koymayı amaçlamaktadır. Bu kapsamda Türkiye ile Malezya'daki faizsiz bankacılık sektörleri hem finansal performans hem de finansal ürünler açısından karşılaştırılmıştır. Finansal performans ölçümünde TOPSIS ve Veri Zarflama Analizi (VZA) yöntemleri kullanılmıştır. 2013 ile 2021 yılları arasındaki veriler ile yapılan TOPSIS analizi sonuçlarına göre; 2016, 2020 ve 2021 yıllarında Malezya'daki; diğer yıllarda ise Türkiye'deki faizsiz bankacılık sektörlerinin finansal performansları daha yüksek çıkmıştır. Faizsiz bankacılık sektörlerinin etkinliklerinin belirlenmesi amacıyla yapılan VZA sonucunda ise analize dahil edilen Malezya'daki bankalardan bir tanesi dışındaki tüm faizsiz bankaların etkin oldukları, Türkiye'den analize dahil edilen bankaların tamamının ise etkin olmadıkları sonucuna varılmıştır. Çalışmada ayrıca faizsiz bankacılık sektörlerinde yer alan finansal ürünler ve uygulamalar karşılaştırılmış ve ülkeler açısından benzerlikler ve farklılıklar ortaya konmuştur."
