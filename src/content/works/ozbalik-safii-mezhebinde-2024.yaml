abstract: "Tarih boyunca toplumlar aileler halinde yaşamışlardır. Aileye dayanmayan hiçbir topluluk yoktur. Her toplum aile hayatını düzenlemek için çeşitli kurallar uygulamışlardır. İslam dini nazil olduğunda içinde bulunulan şartları göz önüne almış, o dönemki Arap toplumunun iyi olan örf ve adetlerini kabul etmiş, kötü olan uygulamalarını da kaldırmıştır. İslam, aileye çok büyük önem vermiştir. Yüzden fazla ayette aile hayatıyla ilgili vurgu vardır. Aynı şekilde sünnette aile hayatıyla ilgili pekçok örneklik vardır. Ailenin kurulması için nikaha ihtiyaç vardır. Dini ilimlerin kitaplara geçirildiği ilk dönemlerden itibaren genelde nikah konuları ibadetlerden hemen sonra işlenmiştir. Bu da nikahın taşıdığı önemin bir göstergesi olsa gerektir. Nikahın şartları, farzları ve gereklilikleri fıkıh kitaplarımızda detaylıca işlenmiştir. Bunun amacı ortaya çıkacak sorunları en aza indirmektir ve aile kurumunun sağlam bir temele oturmasını sağlamaktır. Biz de ükemizde en çok mensubu bulunan iki mezhep olan Hanefî ve Şafiî mezhebine göre karşılaştırmalı olarak nikah konusunu ele aldık.Çünkü aile hayatının düzenliliği nikah ve evlilikle ilgili kurallarının ve amaçlarının daha iyi bilinmesiyle mümkündür.Her iki mezhep arasında var olan farklılıkları ve benzerlikleri görme imkanımız olacak. Bunun yanında diğer iki sünni mezhep olan Malikî ve Hanbelî mezheplerinin de görüşlerine başvurulmuştur. Böylece bu çalışmanın bu alanda mütevazi bir katkı sunacağına inanıyoruz"
