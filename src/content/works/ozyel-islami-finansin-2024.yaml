abstract: "Ülkelerin makroekonomik hedeflerinden biri sürdürülebilir ve güvenilir ekonomik büyümedir. Bu amaçla finansal kalkınmanın arttırılması için politikalar uygulanmakta, özellikle gelişmekte ve az gelişmiş ülkelerdeki tasarruf açığı sorununa çözüm aranmaktadır. Ayrıca, İslam ülkelerinde finansal kaynakların kullanılmamasının sebebi olarak dini nedenler ve geleneksel finansal sistemden uzaklık gösterilmektedir. Son yıllarda bu tartışmalar doğrultusunda, bazı ülkeler İslami finans sistemini geliştirme yoluna gitmiş ve bu sistemin ekonomik büyüme üzerindeki etkilerini araştırmaya başlamışlardır. Bu çalışma, 13 İslam ülkesinde (Sudan, Suudi Arabistan, Brunei, Kuveyt, Malezya, Nijerya, Bangladeş, Birleşik Arap Emirlikleri, Ürdün, Pakistan, Umman, Endonezya ve Türkiye) İslami finansın ekonomik büyümeye etkisini panel veri analizi yöntemiyle incelemektedir. 2013-2021 dönemini kapsayan analizde, İslami finansın gelişimini ifade eden net gelir değişkeni ile gayrisafi sermaye oluşumu ve doğrudan yabancı yatırımlar değişkenlerinin ekonomik büyüme etkileri değerlendirilmektedir. Bulgular, İslami finansın bu ülkelerde ekonomik büyümeyi olumlu ve istatistiksel olarak anlamlı şekilde etkilediğini göstermektedir. Politika yapıcılar, sürdürülebilir ekonomik büyümeyi teşvik etmek için İslami finans piyasalarının gelişimini destekleyici politikalar izleyebilirler."
