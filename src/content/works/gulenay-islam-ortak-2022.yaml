abstract: "Bu çalışmada ilk olarak Türkiye'nin de dahil olduğu İslam İşbirliği Teşkilatı (İİT) üye ülkeleri arasından seçili toplam 23 ülkenin bir bütün olarak ve 4 ayrı gruplama halinde dış ticaret verileri çekim modeli kullanılarak analiz edilmiştir. Sonrasında bu ülkelerin bir Ortak Pazar oluşumuna gitmeleri halinde oluşumun ticaret oluşturucu bir etkiye sahip olup olmayacağının tespit edilebilmesi için çekim modeline Stokastik Sınır Analizi tahminlemesi uygulanarak dış ticaret verimlilikleri ölçümlenmiş ve ülke gruplarının kullanılmayan ticari potansiyelleri elde edilmiştir. Elde edilen sonuçlara göre 23 ülke bir bütün olarak anlamlı sonuç verirken bir Ortak Pazar oluşumuna gitmeleri halinde mevcut dış ticaret hacimlerinin %62 üzerine çıkacakları sonucuna varılmıştır. Ek olarak ülke alt gruplamalarından 13 ülkelik bir yapıya sahip Karma Ülke Grubu da anlamlı bir sonuç vererek Ortak Pazar oluşumuna bu grupla gidilmesi halinde mevcut ticaret hacimlerinin %59 üzerine çıkacakları sonucu elde edilmiştir. Türkiye'de literatürde Stokastik Sınır Analizini Çekim modeline uygulayarak etkinlik skorları elde eden sınırlı sayıda çalışma olmakla beraber, bu çalışma İslam Ortak Pazarı'nın ticaret saptırıcı etki oluşturmadan optimum ülke gruplamasını belirlemek amacıyla İİT üyesi ülkelere bu yöntemi uygulayan ilk çalışma olma özelliğini taşımaktadır. Bu çalışmanın yapılma amacı Türkiye'nin geniş bir perspektifte Ortak Pazar opsiyonlarını İİT ülkeleri çerçevesinde belirleyerek gelecekte oluşabilecek Ortak Pazar girişimlerine bir referans noktası oluşturmaktır"
