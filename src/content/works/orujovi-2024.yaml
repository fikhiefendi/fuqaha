abstract: "Tez konusu: Seyfeddin el-Ebherî'nin ibn Hâcib'in muhtasarının şerhu'l-Adud Haşiyesi, Müellefi İmam Seyfeddin Ahmed el-Ebharî el-Şâfiîdir (ö. 800). Tezim bu haşiyenin bir bölümünün tahkik ve incelenmesidir (48. levhadan 97. levhaya). Bu tezin gayesi: Bu haşiyenin önemini ve ehemmiyetini ortaya koymaktır. Zira bu haşiyeyi diğer haşiyelerden ayıran husus, onun şârihin lafızlarını düzeltmesi zapt etmesi ve kapalı kalan manalarını açıklamasıdır. Zira haşiye sahibi şârihin talebelirindendir. Yine şerhe yapılan itirazları ve bu itirazların cevaplarını zikretmesi bu haşiyenin önemli özelliklerinden birisidir. Yazılmasından sonra döneminin en önemli usul kaynaklarından birisi olması da onu diğer haşiyelerden ayırmıştır. Zira bir kendisinden önceki birçok kaynağı barındırmasıyla adeta bir usul fıkıh ansiklopedisi gibi olmuştur. Yukarıda zikredilen bu sebepler bizi bu kitabı tahkik etmeye sevk etmiştir. Özellikle de kitabın dünyadaki en iyi, en eski ve değerli nüshalarını Türkiye'de bulmamız ve âlimlerin özellikle de Şafiî âlimleri için özel bir yere sahip olması kitabın tahkik edilmesinde önemli bir rol oynamıştır. Umulur ki bu çalışmamız ile haşiye yeni haliyle tekrar gün yüzüne çıkar ve istifade edilir hale gelir."
