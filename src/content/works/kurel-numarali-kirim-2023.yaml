abstract: "Adli ve mülki birçok görevi uhdesinde barındıran Bahçesaray kadısı, davaları Kadı Sicili adı verilen defterlere kaydettirerek muhtelif konular hakkında bilgi sahibi olmamızı sağlamıştır. Bu defterler sayesinde; halkın gündelik yaşayışı, şehrin etnik ve dini yapısı, yiyecek-giyecek fiyatları ve bunların isimleri, şehirdeki cami, medrese, mahalle, kasaba, kaza, köy, vakıf ve çeşitli mevkilerin adları, şehirde yaşanan asayiş sorunları hakkında bilgiyi, aile üyeleri arasında yaşanan sorunlar ile şehir halkının aralarında yaşanan problemler vb. hususlar hakkında bilgi sahibi olmaktayız. Son derece mühim bulgular elde edebildiğimiz bu defterlerden biri olan ve 36 Numaralı Kırım Hanlığı Kadı Sicili'nin Transkripsiyon ve Değerlendirilmesi (H.1113-1118 /M.1701-1706) adını verdiğimiz yüksek lisans tezimizdeki bazı kayıtlardan elde ettiğimiz mühim hususlardan bazıları şöyledir: Kırım Hanı Selim Giray Han H.1113 senesinde Bahçesaray kadısına gönderdiği yarlıkta, şehirde yaşayan gayrimüslimlerin nişan taşımasını istemiş ve H.1114 yılında Selim Giray Han'ın şehrin ekmekçilerine olan borcu mahkeme huzurunda eda edilmiştir. Defterdeki dava kayıtlarında davacı ve davalı tarafın ikamet ettiği yerler belirtilmiş ve böylece Bahçesaray'da Müslüman ve gayrimüslimlerin hangi mahallelerde yaşadıkları ile bu mahallelerin hangi kazaya bağlı olduğu hakkında bilgiler elde edilmiştir. Sicilde yer alan terekeler sayesinde gayrimüslim erkek ve kadınların da şer'i mahkemelere başvurduğu müşahede edilmiş ve bunların servetleri ile Müslümanların servetleri hakkında yorum yapabileceğimiz kayıtlara ulaşılmıştır. Bahçesaray'da kullanılan tartı birimleri ve para birimlerinin neler olduğu ile şehirde ekilip biçilen ürünlerin isimleri yanında, yiyecek içecek ürünleri için belirlenen narh kayıtları hakkında bilgiler elde edilmiştir. Defterdeki kayıtlarda bazı makam ve mevki sahipleri hakkında bilgiler verilmiş buna göre Kırım'daki Darbhâne-i Âmire Emini H. 1114 yılında Moşi adlı bir Yahudi iken, H. 1113 senesinde Kilâr-ı Âmire Kâtibi'nin Abdülveli Efendi olduğu tespit edilmiştir. Etnik ve dini yapısı farklılık gösteren Bahçesaray'da din değiştirip Müslüman olanların varlığıyla ilgili kayıtlar ile, para vakıflarının isimleri ve bu vakıflarından kimlerin ne kadar borç aldığı, Kabartay'a bağlı bir köyde bulunan Hacı Giray Han Sarayı'nın varlığı hakkında bilgiler defterde mevcuttur. Yukarıdaki örneklerden anlaşıldığı üzere Kadı Sicilleri muhtevası çok geniş kayıtları ihtiva edip bir şehrin etnik, idari, dini yapısı ile kültürel ve ekonomik yönlerini ortaya çıkaran birinci elden kaynaklardır. Biz bu çalışmada 36 numaralı Kırım Hanlığı Kadı Sicili'nin transkripsiyon ve değerlendirmesini yaparak, Hanlık merkezi Bahçesaray'ın XVIII. yüzyılın hemen başlarında 1701-1706 yılları arasında muhtelif konulardaki kayıtlarını gün yüzüne çıkarıp bahsi geçen dönemdeki durumu bir nebzede olsa aydınlatmayı amaçladık."
