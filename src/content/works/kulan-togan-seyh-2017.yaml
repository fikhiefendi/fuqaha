abstract: "Bu çalışmada, neşredilmiş bir eseri dışında hakkında herhangi bir araştırma yapılmamış, 15. yüzyılda Memlükler döneminde yaşamış, politik ve ilmi yönünün yanı sıra sufî bir âlim olan Togan Şeyh el-Eşrefî'nin siyaset-i şer'iyye anlayışı incelenmektedir. Togan Şeyh'in siyaset-i şer'iyye düşüncesi, bu alana dair yazdığı el-Burhân fî fadli's-sultân, Menhecü's-sülûk fî siretî'l-mülûk, el-Mukaddimetü's-sultâniyye fi's-siyaseti'ş-şer'iyye eserlerinin yazma nüshaları esas alınarak, İslam hukukunun teşekkülünden Memlükler döneminin sonlarına kadar kaleme alınmış siyaset-i şer'iyye ve ahkamu's-sultaniyye literatürünün temel metinleriyle mukayeseli bir biçimde bu metinlerle aralarındaki benzer ve farklı yönler tespit edilerek ele alınmaktadır. Memlüklerin çoğulcu yapısına uygun olarak dört mezhebe göre siyaset-i şer'iyye yazma iddiasıyla yola çıkan müellifin çabaları tetkik ve tenkit edilerek ortaya konulmaktadır."
