abstract: "Dünya genelinde devlet hazineleri uygun koşullarda borçlanabilmek, muhtemel borç krizlerine karşı önlem alabilmek ve borçlarını sürdürebilmek için borç yönetimine önem vermektedir. Borç yönetimi, borçlanma yapılırken risk ve maliyet unsurları hesaba katılarak stratejik bir biçimde hareket edilmesidir. Devlet hazineleri her ne kadar en düşük faiz oranından ve minimum risk seviyesinden borçlanmayı hedeflesede faizli borçlanma, ekonomide yer alan birçok makro iktisadi değişkeni borcun anapara ve faizinin ödenmesi aşamasında olumsuz etkilemektedir. İslam'da faiz yasağı iktisadi sistemin temel unsurlarından biri olduğu için, İslam iktisadı devlet hazineleri tarafından gerçekleştirilen faizli borçlanmayı uygun görmemektedir. İslam iktisadının hedeflediği iktisadi düzen; üretim ve ticaret merkezli, ortaklığa ve risk paylaşımına dayalı, sürdürülebilir bir büyüme ve gelir dağılımında adaleti esas alan bir yaklaşım olduğu için faizli borçlanmanın faiz yükü nedeniyle söz konusu makro iktisadi değişkenlere zarar vermesi İslam iktisadı perspektifinden olumsuz olarak değerlendirilmektedir. Ayrıca, İslam iktisadında kumar, garar (aşırı belirsizlik) ve spekülasyon gibi yasaklar olması nedeniyle devlet hazinelerinin borç yönetimi kapsamında gerçekleştirdiği swap (takas), forward (standart olmayan vadeli işlem sözleşmeleri), futures (standart vadeli işlem sözleşmeleri) ve opsiyon (seçme haklı vadeli işlem sözleşmeleri) gibi işlemlere İslam iktisadı konvansiyonel iktisattan farklı bir perspektifle yaklaşmaktadır. Literatürde devlet hazinelerinin borç yönetimi işlemlerini İslam iktisadı perspektifinden değerlendiren bu kapsamda bir çalışma bulunmamaktadır. Bu çalışmanın temel amacı; devlet hazinelerince gerçekleştirilen faizli borçlanmanın faiz yükü nedeniyle makroekonomiye verdiği zararları ortaya koymak ve İslam iktisadıyla uyumlu faizsiz finansman yöntemlerinin geliştirilmesine katkı sağlamaktır. Bu amaç doğrultusunda çalışmada, hazine borç yönetim işlemleri İslam iktisadı perspektifinden değerlendirilmekte ve borç faiz ödemelerinin makro iktisadi değişkenlerle uzun dönem ilişkisi ekonometrik olarak analiz edilmektedir. Bu ekonometrik çalışmayla borç faiz ödemelerinin makro iktisadi değişkenlere etkisi Türkiye örnekleminde ampirik olarak ortaya koyulmaktadır. Çalışma kapsamında, Türkiye'de borç faiz ödemelerinin makro iktisadi değişkenlere etkisi 1989-2019 dönemi için incelenmektedir. Borç faiz ödemeleri ile makro iktisadi değişkenler arasındaki uzun dönem eşbütünleşme ilişkisi ARDL Sınır Testi yaklaşımı ile tahmin edilmektedir. Çalışmada 3 ayrı regresyon modeli kurulmuş olup, uygulanan testler sonucunda, regresyon modellerinde yer alan değişkenler arasında uzun dönemde eşbütünleşme ilişkisi tespit edilmiştir. Model tahmin sonuçlarına göre borç faiz ödemeleri gelir dağılımını, dış borç faiz ödemeleri cari açığı ve iç borç faiz ödemeleri ekonomik büyümeyi negatif etkilemektedir. Yani faizli borçlanma faiz yükü nedeniyle Türk ekonomisine zarar vermektedir. Çalışma kapsamında, İslam iktisadıyla uyumlu faizsiz finansman yöntemlerine dünyadaki uygulama örneklerini içerecek şekilde (Malezya, Bangladeş, Sudan, Bahreyn ve Maldivler) yer verilmekte olup, bu yöntemlerden hareketle Türk Hazinesi için faizsiz finansman yöntemleri önerilmektedir. Ayrıca çalışmada, faizsiz finansmanın faizli borçlanmaya göre ekonomiye sağlayacağı avantajlar bilimsel çalışmalar çerçevesinde ortaya koyulmaktadır. Çalışma kapsamında, faizsiz finansman aracı kamu yatırım sertifikalarıyla faizli borçlanma aracı devlet tahvillerinin ekonomiye etkileri 2009 (2.çeyrek)-2016 (4.çeyrek) dönemi için Malezya örnekleminde karşılaştırılmakta ve ekonometrik analizde değişkenler arasındaki uzun dönem eşbütünleşme ilişkisi ARDL Sınır Testi yaklaşımı ile tahmin edilmektedir. Çalışmada 4 ayrı regresyon modeli kurulmuş olup, uygulanan testler sonucunda, regresyon modellerinde yer alan değişkenler arasında uzun dönemde eşbütünleşme ilişkisi tespit edilmiştir. Model tahmin sonuçlarına göre Malezya devleti tarafından ihraç edilen faizsiz finansman aracı kamu yatırım sertifikalarının enflasyona negatif etki ve ekonomik büyümeye pozitif etki açısından faizli borçlanma aracı devlet tahvillerine göre ekonomiye daha fazla katkı sağladığı tespit edilmiştir. Literatürde daha önce Malezya örnekleminde kamu yatırım sertifikaları ile devlet tahvillerini bu çalışmada olduğu şekilde karşılaştıran bir çalışmaya rastlanılmamıştır. Çalışmanın sonuç ve öneriler kısmında model sonuçlarına ilave olarak, çalışmanın bütünlüğü kapsamında borçlanma, borç yönetimi ve İslami iktisadı perspektifine ilişkin detaylı değerlendirmeler ve öneriler sunulmuştur."
