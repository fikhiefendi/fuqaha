abstract: "Bu araştırma 131 numaralı Gaziantep Şer'iye Sicilinin transkripsiyonunu ve o dönem Gaziantep'in siyasi, sosyal, iktisadi ve kültürel değerlendirmesinin yapıldığı bir çalışmadır. Şer'iye Sicilleri Osmanlı tarihi için zengin bir veri tabanı oluşturmaktadır. Çünkü Osmanlı idari yapısında kadıların geniş yetki ve sorumlulukları vardır. Bu durum, incelediğimiz sicilde de karşılaştığımız gibi asayiş, vergi tahsili, esnaf davaları, insanlar arası her türlü anlaşmazlıklar, miras, evlilik, vakıf gibi çeşitli konu başlıklarını içeren belgelerin Şer'iye sicillerine kaydedilmesini gerektirmiştir. Çalıştığımız sicilin belgeleri çoğunlukla 1781, 1782 yıllarına aittir. Ağırlıklı belge türü ise terekedir. Bu terekeler üzerinden, 18. yüzyıl Antep toplumunun kişisel zenginlikleri, ev şekilleri ve döşemeleri, kılık-kıyafet ve mutfak kültürleri gibi gündelik hayat bilgilerine ulaştık. Gerek vakfetme gerekse bir vakıfta hizmet alma isteği ile mahkemeye yapılan başvuruların yoğunluğundan vakıfların Antep halkı için önemini tespit ettik. Özellikle sicilin sonlarında yer alan vergi tahsiline ilişkin buyrulduları inceleyerek Antep'in vergi yükünü anlamaya çalıştık. Çalışmadan faydalanmayı kolaylaştırmak için, belgelerin sayfa, tür, hicri-miladi takvim ve özetlerini tablo şeklinde gösterdik."
