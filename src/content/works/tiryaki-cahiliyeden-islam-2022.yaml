abstract: "Bu çalışmamızda hac ibadetinin Cahiliye ve Hz. Peygamber dönemlerinde uygulanış şeklini inceleyerek, Hz. Peygamber'in bu ibadet üzerinde yaptığı ve yapmadığı değişiklikleri ele aldık. Çalışmamızın ilk bölümünde Cahiliye döneminde hac ibadetinin uygulanışı konu edilmektedir. Cahiliye dönemi, İslâm öncesi döneme verilen isimdir. Bu dönem, oldukça eski bir tarihi ifade ettiğinden, en doğru bilgilere ulaşabilmek için öncelikle konu hakkındaki ayetler ve hadislerle birlikte İslâm tarihi müktesebatımızın kadîm eserlerine müracaat ettik. Çalışmamızın ikinci bölümünde, Hz. Peygamber'in bu ibadeti nasıl yerine getirdiğini ve hac ibadeti üzerinde gerçekleştirdiği değişiklikleri yine hadis ve siyer kaynaklarımızdan yaralanarak tespit etmeye çalıştık. Hz. Peygamber, İslâm'ın ahkâmını ümmetine öğretmiştir. Bunu yaparken de İslâm'ın her bir parçasını tevhid temelleri üzerine oturtmuştur. Cahiliyeden kalan pagan kültürüne ait her bir kalıntıyı, büyük bir titizlikle temizlemiştir. Tevhid akidesinin İslâm'ın ana gövdesini oluşturan bir hakikat olduğunu, Hz. Peygamber'in hac ibadeti üzerinde yapmış olduğu değişikliklerden rahatlıkla görebilmekteyiz. Ayrıntılı bilgiler çalışmamızın içerisinde verildiği için, mükerrer ifadelerden kaçınmak adına burada aynı meselelere değinmedik."
