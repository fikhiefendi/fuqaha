abstract: "Bu tezin konusu iki değerli imam Cessâs ve Kiyâ el-Herrâsî arasında Maide Suresi'ndeki ahkam ayetlerinin tefsiri temelinde bir mukayese yapılmasıdır. İnceleme ve karşılaştırma amacı doğrultusunda her iki imamın hayatı da ayrı bir bölümde ele alınmış, onların itikâdî ve amelî mezhepleri ve ilmî derecelerine değinilmiş, ayrıca hocaları ve öğrencileri mümkün olduğu ölçüde tespit edilmiştir. İki müfessirin bıraktığı eserler kısaca izah edilmiş, müelliflerin yazdıkları arasında tefsirlerin önemi vurgulanmıştır. Tefsirlerin her biri tanıtılmış, bariz vasıfları, göze çarpan şekil ve muhteva özellikleri belirtilmiştir. Ardından çalışmanın asıl maksadına uygun olarak Maide Suresi'ndeki ahkam ayetleri bakımından iki tefsir arasında karşılaştırma yapılmıştır. Anılan suredeki ahkam ayetlerinin çokluğundan dolayı incelemenin çerçevesi hükümler çıkardığı beş ayet ile sınırlı tutulmuştur. Müfessirlerin sözleri ayrı bir başlıkta değerlendirilmiş ve ilgili alimin mezhebindeki diğer alimlerin görüşlerine de yer verilmiştir. Böylelikle anlatılan fıkıh konusuna ilişkin eksiksiz bir çerçeve sunulması istenmiştir. Değişik görüşlerin açıklanmasının ardından güvenilir hadis alimlerince aktarılan ve sahih kabul edilen hadisler temelinde ve fakihlerin sözleri ışığında birtakım fıkhi tercihler kaydedilmiştir. İncelenen ahkam ayetleri bağlamında kitaplarda bulunan rivayetlerin tahrici gerçekleştirilmiş, muhtelif varyantlara atıf yapılmıştır. Araştırmamızda her iki tefsirde de geçen hadis literatürünün tahkik ve araştırmaya tabi tutulmasının yararlı olacağı anlaşılmıştır. Cessâs'a ait tefsirin çok farklı fıkhi görüşler ve muhaliflere verilen birtakım cevaplarla büyük bir hacim kazandığı ve kısaltılmaya ihtiyaç duyduğu sonucuna ulaşılmıştır. Öte yandan el-Keyaheresi'nin tefsirinde geçen rivayetlerin senetsiz olarak aktarıldığı, muhakkikin hadisleri sadece kitaplara atfettiği ve numara ve bap başlığının bildirilmediği gözlemlenmiştir. Dolayısıyla bilgilerin yeniden tahkik edilerek hadislerin kaynaklarına daha teknik ve detaylı bir atıf biçimiyle verilmesinin gerektiği saptanmıştır. Araştırmamız“sonuç ve tavsiyeler”kısmı ile bitmiştir."
