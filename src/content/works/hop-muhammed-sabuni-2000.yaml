abstract: "TÜRKÇE ÖZETİ“Muhammed Ali es-Sâbûnî ve Ravâiu'l-Beyân Tefsîru Âyâti'l-Ahkâm mine'l-Kur'ân'ı”isimli bu tez çalışmamızda, çağımız İslâm dünyasının meşhur tefsircilerinden ve aynı zamanda îslâm Hukuk Profesörü Sâbûnî'yi (d. 1348/1930) ve Türkçe“Beyân Harikaları, Kur'ân-ı Kerim'in Ahkâm Âyetleri Tefsiri”anlamına gelen“Ravâiu'l-Beyân Tefsîru Âyâti'l-Ahkâm mine'l-Kur'an”fıkhî tefsirini akademik olarak pekçok açıdan inceleyip araştırmayı ve elde ettiğimiz bilgiler ışığında onu ve eserini daha detaylı olarak tanıyıp tanıtmayı hedefledik. Tezimiz bir giriş ve iki ana bölümden meydana gelmektedir. Giriş bölümünde: Fıkhî tefsirlerin tarihî seyri genel bir yaklaşımla ele alınmıştır. Başlangıçtan günümüze eseri ve müellifi bilinen fıkhî tefsirler, bir şema halinde verilmiştir. Tefsir ekollerinin de şeması çizilmiş ve bu ekoller içinde fıkhî tefsirlerin yeri gösterilmiştir. Birinci Bölüm'de: Muhammed Ali Sâbûnî'nin Hayatı, Şahsiyeti ve Eserleri üzerinde durulmuştur. Tefsir ve Kur'ân İlimleri ile alakalı 9 te'lif, 7 de tahkik ve ihtisarını yaptığı eser kısaca tanıtılmıştır. 16 adet olan te' lifleri de ilim dallarına göre zikredilmiştir. Ayrıca Sâbûnî'nin fıkıhçılığı ve yetişmiş olduğu asır içindeki yeri üzerinde de durulmuş; ilim ve irşad faaliyetlerine de değinilmiştir. İkinci Bölüm'de: Sâbûnî'nin Ravâiu'l-Beyân Tefsîru Âyâti'l-Ahkâm mine'l-Kur'ân isimli ahkam tefsiri ele alınmıştır. İçindeki konular bir şema şekline getirilmiştir. Eserin tefsir metodu, tasnif biçimi, kaynaklan, dirayet ve rivayet yönü, dil ve üslûbu, klasik tefsirlerle mukayesesi ve fıkhî tefsirler içindeki konumu ana başlıklar halinde incelenmiştir. Yapılan araştırma ve incelemeler ışığında ulaşılan neticeler, tezin bitimindeki sonuç bölümünde müfessir ve tefsiri olmak üzere iki kısımda maddeler halinde verilmiştir. Son olarak belirtilmelidir ki:“Sâbûnî'nin Hayatı, Eserleri, İlmî kişiliği ve Ravâiu'l- Beyân'ı”üzerinde yapılmış olan bu çalışma, bilebildiğimiz kadarıyla kendisi ve eseri hakkında Türkiye'de hazırlanan ilk müstakil tez çalışması olma özelliğine de sahip bulunmaktadır. IX"
