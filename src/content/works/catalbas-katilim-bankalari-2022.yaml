abstract: "2019 yılının sonunda Çin'in Wuhan kentinde ortaya çıkan Covid-19 sosyal medyanın da gücüyle dünya gündemini belirler hale gelmiştir. Vaka ve ölüm sayıları ile kısa sürede küresel bir kriz haline gelen salgın nedeniyle ülkeler sınırlarını kapatarak bir dizi kısıtlamalara başvurmuşlardır. Covid-19 krizinin benzersiz bir özelliği, dünya ekonomisinin çoğunu aşağı yukarı aynı anda etkilemesi olmuştur. Belirsizlikle beraber sürecin sosyolojik ve ekonomik boyutu tahmin edilenden çok daha büyük bir hal almıştır. Sokağa çıkma yasakları, karantinalar, yurtiçi ve yurtdışı uçuşların durdurulması gibi belki de son yıllarda hiç görülmemiş bir şekilde her ülke kendi kabuğuna çekilmiştir. Tedarik zincirinin bozulmasıyla beraber dış ticaret ve bankacılık sektörleri de salgından en fazla etkilenen alanların başında gelmiştir. Çalışmanın amacı Covid-19'un katılım bankaları dış ticaret işlemleri üzerindeki etkilerini nitel bir yöntem olan mülakat yöntemi ile ele almaktır. Katılım bankaları dış ticaret birim yöneticileri ile yapılan görüşmeler sonrasında değerlendirme yapmaya imkân sağlayan bilgiler elde edilmiştir. Yapılan değerlendirme sonucunda sürecin ortaya çıkardığı olumlu ve olumsuz etkilere vurgu yapılmıştır. Özellikle finans sektöründeki teknolojik gelişmeler ve dijitalleşme konularının katılım bankaları dış ticaret işlemlerinin geleceği ve sürdürülebilirliği açısından önemli unsurlar olduğu sonucu ortaya çıkmaktadır."
