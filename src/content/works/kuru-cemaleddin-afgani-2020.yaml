abstract: "Cemâleddîn Afgânî, öne sürdüğü farklı düşünceleri ile döneminde çok tartışılan bir insandır. Bu yönü ile sonraki yıllarda da birçok araştırmacının nazar-ı dikkatini celp etmiş; hakkında kitaplar, makaleler kaleme alınmıştır. Döneminde çok tartışılan ve tabulara dokunmuş olan Afgânî, ölümünden sonra da İslam dünyasında birçok düşünürün ya rehberi ya da tam karşısındaki adam olmuştur. Onun hakkında bilgi veren kaynaklar, temelde ikiye ayrılmıştır. Bir kısmı, onun en yakınında bulunan, talebeleri ve yakın arkadaşlarından alınan bilgilerdir. Onlar Afgânî'yi, her anlamda eşi benzeri bulunmaz, Afganistan doğumlu, Hanefi mezhebine mensup bir şeyh olarak anlatmıştır. İlerleyen yıllarda, bunlara bazı Osmanlı Türk aydınları da dâhil olmuştur. Özellikle onun, milliyetçilik konusundaki düşünceleri, tek adamlığa olan itirazı, meşrutiyete olan olumlu bakışı ve içtihat konusundaki ezberleri bozması, Müslüman Türk aydınlarına her daim mihmandar olmuştur. Jön Türkler başta olmak üzere Mehmet Âkif, Mehmet Emin Yurdakul, Abdullah Cevdet, Mehmet Şemseddin Günaltay, Ahmet Ağaoğlu, Behiç Erkin gibi önemli fikir insanları üzerinde derin tesirler bırakmıştır. Afgânî ve saydığımız Osmanlı aydınlarından bir kısmını bir araya getiren sebeplerden biri II. Abdülhamid düşmanlığıdır. Onun ihtiyatlı, takipçi ve onlara göre istibdatçı yönetim anlayışına muhalefetlerinde, Afgânî onlar için önemli bir lider olmuştur. Afgânî'nin karşıtı olan grup ise, Afgânî'nin doğum yeri, mensup olduğu aile ve bağlı olduğuna inandıkları mezhepten yola çıkarak onu eleştirmişlerdir. Doğum yerinin İran, mezhebinin ise Şia olduğu iddiası üzerinden eleştiriler yapmışlardır. Özellikle içtihat kapısı konusundaki düşünceleri, aklı esas alan fikir dünyasının tehlike arz etmesi ve Mutezile mezhebi konusundaki görüşleri eleştirilere neden olmuştur. Yüzyıllar boyunca özgür yaşamış ama ilerleyen yıllarda Rus esareti altında kimlik kaybı yaşamaya başlayan Kazanlı Müslüman Türkler, yaşanan bu erozyonu engellemek için çözüm yolları aramaya başlamışlardır. Onlara göre yaşanan bu buhranlı dönemleri aşmanın bir yolu vardı. O da millî benliği canlandırmaktı. Bu düşünceye sahip başlıca Kazanlı Türk aydınları, Yusuf Akçura, Rızâeddîn bin Fahreddin, Musa Carullah, İsmail Bey Gaspıralı'dır. Bu önemli fikir insanları, Afgânî'nin elli yedi yılı bulan hayatında, içinde Rusya'nın da bulunduğu seyahatlerini ve fikirlerini yakından takip etmiştir. Afgânî'nin, Türk milliyetçiliği ve Kur'an-ı Kerim ile hadislerin günümüz şartlarına göre yorumlanması konusundaki düşünceleri, onlar tarafından Rusya'da yaşayan Müslüman Türkler için çözüm reçetesi olarak görülmüştür. Yazmış oldukları kitaplarda, çıkardıkları gazetelerde ve konuşmalarında, Kazanlı Türklerin millî benliklerini kaybetmemeleri için çok çaba sarf etmişlerdir. Bu çabada fikri anlamda Cemâleddîn Afgânî, faydalandıkları önemli bir şahsiyet olmuştur."
