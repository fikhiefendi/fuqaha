abstract: "Toplumsal yaşamın sürekliliği için gerekli olan kanun ve yasalar düzenin sağlanmasında devletlere yardımcı olmaktadır. Süreç içerisinde yaşam şartlarının ve değerlerin değişimiyle yasa ve kanunların da yenilenmesi ve değişmesi gerekir. Sabit kalan kanun ve yasalar eskiden düzeni sağlar konumdayken artık haksızlıklara sebebiyet verebilir. Bu durumda bireyler daha yüce yasa için haksızlıklara neden olan mevcut yasaya uymamak suretiyle sivil itaatsizlik eylemini gerçekleştirirler. Adaletin gerçekleşmesi, hak ve hürriyetlerin kazanılmasında önemli rolü olan sivil itaatsizlik, hukuk değerlerinin içerdiği ulvi değerler uğruna şiddetsiz, kamuya açık, adaletsizliklere karşı sistemde haksızlığa sebebiyet veren kanunların yerine getirilmemesidir. Toplumsal düzenin sağlanmasında, istikrara kavuşmasında ve medeniyetlerin gelişiminde etkili olan sivil itaatsizlik hukuka sadakat, ahlakî değerler ve ulvî duygular etrafında şekillenir. Bu konuda siyaset, hukuk, sosyoloji vb. alanlarda çalışma yapılmasına rağmen Temel İslam bilimlerinde yeteri düzeyde bir çalışma bulunmamaktadır. Araştırmamızda literatürdeki bu eksikliğin giderilmesi amaçlanmıştır. Çalışma süresinde karşılaştırma, analiz, sentez gibi nitel araştırma yöntemleri kullanılmıştır. Bu çalışmada sivil itaatsizlik kavramsal olarak ele alınmış, kavrama öncülük eden Henry David Thoreau, Gandhi, Martin Luther King gibi kişilerin gerçekleştirdikleri eylemler ve teorisyenlerin görüşleri sunulmuştur. Ayrıca İslam siyasetinde sivil itaatsizlik, birey devlet ilişkisi, İslam'da muhalefet hakkı vb. konular izah edilmiş ve İslam hukukunda öne çıkan Ebû Zer, Ebû Hanîfe, Ahmed b. Hanbel, Serahsî gibi tarihi şahsiyetler sivil itaatsizlik kavramı bağlamında incelenmeye çalışılmıştır. Araştırmamızın sonucunda ortaya çıkmıştır ki sivil itaatsizlik, Batı'da kanun ve yasalara karşı vuku bulurken, İslam siyasetinde uygulama ve sosyal yaşantıya yönelik gerçekleştirmiştir."
