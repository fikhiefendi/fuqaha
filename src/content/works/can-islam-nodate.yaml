abstract: "Ülkemizde 1980'li yıllara kadar belli bir inanç kesimine mensup insanların faizli işlemlerden kaçınmaları, ticaretin riskini göze almamaları, Türk Lirasının o dönem Amerikan Doları ve Alman Markı karşısında değer kaybetmesi gibi nedenlerle birikimlerini altın ve döviz cinsinden ellerinde tutma eğilimleri göstermiş ve bu eğilim ciddi miktarda nakdin piyasaya sürülmeden yastıkaltı tabir edilecek bir şekilde atıl durmasına sebep olmuştur. Bu durum üzerine zikredilen çekinceye sahip insanların atıl durumdaki birikimlerinin ekonomiye asgari risk ile kazandırılması amacıyla Özel Finans Kurumları kurulmuş, daha sonra bu kurumlar Katılım Bankası adını alarak 9537 sayılı Bankacılık Kanununa tabi olarak Bankacılık Düzenleme ve Denetleme Kurulununun yetki alanına girmiştir. Katılım Bankalarının konvansiyonel bankalarla rekabet edebilmeleri için bankacılık faaliyetlerini geliştirmeleri gerekmiş, bu amaçla özellikle Malezya ve Körfez Ülkelerinde uygulanan İslami Bankacılık enstrümanları ülkemizde de uygulanmaya başlanmıştır. Bu enstrumanlardan biri ve muhtemelen en kompleks yapıda olanı ise ülkemizde Kira Sertifikası olarak bilinen sukuktur. Bu enstruman içerdiği çok taraflı yapısı, birden çok sözleşme içermesi, devlet tarafından bir çok imtiyazı haiz bir şekilde düzenlenmiş olmaları itibariyle incelemeye değer bir düzenleme olarak dikkat çekmektedir. Bu çalışmada sukuk enstrumanının oluşturulmasında rol alan tarafları, ilişkileri, sözleşmeleri, imtiyazları, bu ilişki, mesuliyet ve hakların İslam Hukuku temel ilkelerine uygunluklarının denetimi, ilgili Kira Sertifikaları Tebliği'nin hukuki ve fıkhi açıdan değerlendirilmesi yapılmaktadır. Bu çalışma neticesinde hem yürürlükte olan Kira Sertifikaları Tebliği'nin hem de fiili uygulamanın ciddi bir şekilde İslam Hukuku temel ilkelerine aykırı olduğu tesbit edilmiş, bu aykırılıklar nedenleri ile detaylı olarak ortaya konmuştur. Sonuç kısmında ise tesbit edilen bu aykırılıkların düzeltilerek sukuk enstrumanının İslam Hukuku temel ilkelerine uygun hale gelmesi yapılması gereken düzenlemeler belirtilmiştir."
