abstract: "Tez çalışmamızın amacı, bankalarda hizmet içi eğitim uygulamalarının ayrıntılı olarak ortaya konularak, elde edilen veriler ışığında hizmet içi eğitim uygulamalarının iyileştirilmesi için önerilerde bulunmaktır. Bu doğrultuda Türkiye Finans Katılım Bankası bünyesinde verilen hizmet içi eğitim etkinliğinin değerlendirilmesi yöntemleri ve uygulamalarının neler olduğu incelenmiştir.Çalışma, ilk iki bölüm teorik ve son bölüm uygulama olmak üzere üç temel kısımdan oluşmaktadır. Teorik kısmın birinci bölümünde; genel olarak, bankacılık sistemleri ve sınıflandırılması konuları anlatılmış, teorik kısmın ikinci bölümünde; genel olarak, hizmet içi eğitim kavramı ve kapsamı konuları anlatılmıştır. Uygulama kısmı olan üçüncü bölümde ise, Türkiye Finans Katılım Bankası'nda uygulanan hizmet içi eğitim uygulamalarına yer verilmiştir. Genel olarak elde edilen bulgular, Türkiye Finans Katılım Bankasında hizmet içi eğitimlerin etkin ve düzenli bir şekilde yapıldığın ortaya koymaktadır.Tez çalışmamız son olarak, Türkiye Finans Katılım Bankası'nda uygulanan hizmet içi eğitim uygulamalarına ilişkin elde edilen bulgular ışığında sonuç ve önerilerin sıralanması ile tamamlanmıştır."
