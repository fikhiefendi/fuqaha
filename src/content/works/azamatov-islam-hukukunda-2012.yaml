abstract: "`İslam Hukukunda Fiilî Sünnet'in Vahiy İle İlişkisi' adıyla hazırlamış olduğum bu çalışma bir Giriş ve iki Bölümden oluşmaktadır.Giriş bölümü: I. Konunun Önemi, II. Konunun Sınırlandırılması, III. Konunun Kavramsal Çerçevesi, IV. Konunun Sunulması, V. Konunun Araştırılmasında Takip edilen Yöntem ve VI, Konu İle İlgili Kaynakların Değerlendirilmesi gibi tez ile ilgili teknik konuları içermektedir.Birinci Bölüm Vahiy, Sünnet ve Fiilî Sünnet kavramlarının sözlük ve terim anlamları ve çeşitleri hakkındaki bilgileri içermektedir. Bununla beraber bu Bölüm içerisinde Vahiy ?Sünnet ilişkisi ve Sünnet'in temellendirilmesi ile ilgili görüşlerin değerlendirilmesine yer verilmiştir.İkinci Bölüm ise Kur'ân, hadîs ve icmâ' bağlamında şer'î delîl olarak Sünnet'in temellendirilmesini ve Fiilî Sünnet'in Vahiy ile ilişkisi yollarının tespit ve analizini içermektedir."
