abstract: "bu araştırmanın amacı; ünlü Fıkıh mezheplerinden Malikilik ve en ünlü Kelam mezheplerinden Eş'arilik'in en meşhur âlimlerinin farklı inanç meselelerindeki söylemlerini göstererek aralarındaki inanç ilişkilerini tanımaktır. Bu araştırmanın amaçlarını gerçekleştirmek için niteleyici karşılaştırmacı metot kullanılmıştır. Araştırma, giriş ve sonuç bölümleri ile iki ana bölümden müteşekkildir. Giriş bölümü, çalışmanın metodu, kaynakları ve ilgili kavramları kapsamaktadır. Birinci bölümde ise İmam Malik ve İmam Eş'ari'nin özgeçmişleri ile bu mezheplerin tarihi serencamı ele alınmıştır. İkinci bölüm kendi içinde dört ana bölüme ayrılmıştır. İkinci bölümün birinci kısmında Allah'ın adları, sıfatları ve görmesi, kaza ve kadere iman bahisleri incelenmiştir; ikinci başlık altında peygamberlik kavramının mukayesesi yapılmıştır; üçüncü başlık altında kabir azabı, haşr, mizan, sırat, cennet ve cehennem gibi kavramlar ve bunlarla ilgili iki mezhep âlimlerinin görüşleri benzerlik ve farklılıkları ile ele alınmıştır. İkinci bölümün dördüncü ve son kısmında ise iman, imamet kavramları ile Malikî ve Eş'arî âlimlerin bidat, bidat ehli ve tasavvufa karşı takındıkları tavır mevzubahis edilmiştir. Araştırmanın sonuçlarını kısaca şöyle özetleyebiliriz: Malikilerin ya Eş'arilerin deyişleri ile zengin eserleri ya da Eş'arilerin âlimlerinin çabalarını destekleyen fetvaları ile Eş'ari olmayan Malikilerin Eş'arileri desteklemesidir. İmam Eş'ari'nin, Allah'ın kendine ispat ettiklerini ispat etme ve kendinden reddettiklerini reddetme konusunda açıklamalı bir şekilde diğer mezhepler (Malik) ve Ehl-i Sünnet gibi deyişleri ile uyuşmaktadır. İki mezhep arasındaki ilişkiler iyi değildi. İlahiyat bölümünde, özellikle sıfatlar konusunda, Eş'ariler, Malikilerden daha iyi tevil yaparlardı. Allah'ı görmek konusunda ihtilaf olmuşlardır, çünkü Eş'arilere göre Allah'ı görmek hiçbir yöne hiçbir yere bağlı değildir, Malikiler ise bunun tam tersini söylemektedirler. Deyişleri denk geldiği en önemli inanç meselelerden imamlık meselesi, bidat ehline takındıkları tutum ve onları yermek, zühtte rağbet etmek ve bidat olan sufiliği bırakmada anlaştılar. Eş'arilerin en büyük âlimlerinin itidale dönmesi mezheplerin birbirine yaklaşmalarına katkıda bulunmaktadır. Araştırmanın sonuçlarına göre birkaç tavsiye sunulabilir. En önemlisi, Akademik ilgili makamları fıkıh ve kelam mezheplerinin arasındaki ilişkiler diye seminerler ve v bilimsel konferanslar yapmaya ve her mezhebin tarihini detaylı bir şekilde anlatmaya davet etmekte, camilerin hocalarına ise Kur'an-ı Kerim ile yan yana inanç meseleleri içeren metinleri, çocuklar tekrar ederek hafızalarında daha kalıcı olacağı için çocuklara ezberletmelerini tavsiye etmektedir."
