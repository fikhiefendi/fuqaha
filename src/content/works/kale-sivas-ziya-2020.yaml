abstract: "Sivas Ziya Bey Kütüphanesi'ndeki fıkıh ile ilgili yazma eserleri konu edinen bu çalışma iki bölümden oluşmaktadır. Birinci bölümde kütüphanedeki fıkıh yazmaları müellifleri ile birlikte tanıtılmıştır. Eserler müelliflerin vefât tarihlerine göre tasnif edildikten sonra, her bir müellif hakkında kısaca bilgi verilmiştir. Ardından müellifîn kütüphanedeki eseri, teknik özellikleri ve muhtevaları açısından incelenmiştir. Ayrıca incelenen kitapların Türkiye'deki diğer kütüphanelerde bulunan yazma nüshaları tespit edilmeye çalışılmıştır. İkinci bölümde eserler türlerine göre tasnif edildikten sonra matbûları bulunan ve bulunmayan yazma eserler belirlenmiş, bunlar özellikleri, müellifleri ve muhtevaları açısından değerlendirilmeye çalışılmıştır."
