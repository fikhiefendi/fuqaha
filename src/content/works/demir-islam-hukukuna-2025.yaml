abstract: "Müslümanlar, Allah'ın rızasına nail olabilmek ve Hz. Peygamber'in tavsiyelerine uyabilmek için farz ibadetlerin edası ile beraber nafile ibadetleri de en iyi şekilde ifa etme çabasına girmektedirler. Nafile ibadetlerden bazıları ile ilgili geniş kapsamlı ve bütüncül çalışmalar yapılmış olmakla beraber bazı ibadetler konusunda yeterli seviyede kapsamlı çalışmalar yapılmadığı görülmektedir. Bahsi geçen konulardan bir tanesi de şevval ayında tutulan nafile oruçtur. Müslümanlar, şevval orucuna önem vermekle birlikte bu orucun sünnetteki yeri ile ilgili derli toplu bir çalışmanın bulunmaması birtakım karmaşalara sebep olmaktadır. Bir kısım fukahanın şevval orucunun mekruh olduğu yönünde beyanlarda bulunması, diğer bir kısmın ise nafile oruçlar arasında yer aldığını dile getirmesi çalışmamıza zemin hazırlamıştır. Çalışmada özellikle ilk dönem kaynaklarından yararlanarak Hz. Peygamber'in konu ile ilgili hadislerini, mezhep imam ve fukahasının görüşlerini bir araya getirdik. Bununla birlikte ihtilaflı hususları ayrı başlıklar halinde ele alarak derinlemesine irdelemeye çalıştık. Tartışmalı hususlar arasında şevval orucunun senedinin sıhhati, mekruh görülen sıyâmu'd-dehre benzetilmesi, nafile oruç olduğu halde farz izlenimi vermesi, İmâm Mâlik (ö. 179/796) ile Ebû Hanîfe'nin (ö. 150/767) bu orucun mekruh olduğuna dair görüşleri ile sayısal anlamda bir yıllık sevaba denk getirilme çabası yer almaktadır. Çalışma, hem şevval orucunun sünnetteki yeri hususunda okuyuculara konu ile ilgili bütüncül bilgi ve bulgulara ulaşmaları fırsatını vermek, hem de akıllarda soru işareti barındıran hususları gözler önüne sererek konuyu analiz etme fırsatını hedeflemektedir. Şevval orucu hakkında aktarılan birçok rivayetin bulunduğu ve bu rivayet zincirleri arasında zayıf rivayetlerin yanında senedi sahih olan rivayetin de bulunduğu tespit edilmiştir. İbn Rüşd'ün (ö. 520/1126) haber verdiğine göre İmâm Mâlik'in bizzat kendisinin şevval orucunu tuttuğunu öğrenmekteyiz. İmâm Mâlik'in mekruh hükmünü vermek konusundaki amacının, halkın kendisine olan itimadının avam tabakayı bidate götüreceği endişesi olduğu anlaşılmıştır. Sıyâmu'd-dehrin mekruh olarak değerlendirilmesinin bu orucu tutacak kimseye oluşturacağı cefa ve eziyetin rol oynadığı görülmüştür. Şevval orucunda sıyâmu'd-dehrde bulunan cefa ve eziyetin olmaması bilakis bu eziyeti bertaraf etmek amacıyla Hz. Peygamber tarafından tavsiye edildiği anlaşılmıştır."
