abstract: "Hamdi Yazır Elmalı'da 1878 yılında doğmuştur. İlk eğitimini Elmalı'da alan Hamdi Yazır, daha sonra İstanbul'a gitmiş ve orada Kayserili Hamdi Efendiden icazet alarak eğitimini tamamlamıştır. Mekteb-i nüvvabı birincilikle bitiren Hamdi Yazır, çeşitli memurluklarda bulunmuş, farklı düzeyde medreselerde mantık, felsefe, hukuk, hukuk usulü ve evkaf dersleri vermiştir. Antalya mebusu olarak meclis-i mebusana giren Hamdi Yazır, Ferit Paşa hükümetinde Evkaf Nazırlığında bulunmuş, vakıflar hakkında bir de kitap telif etmiştir. Hayatının her döneminde öğrencileri ve kitaplarıyla iç içe olan ve araştırmaktan yılmayan, derin düşüncelerden zevk alan Hamdi Yazır, 1942 yılında İstanbul'da vefat etmiştir.Kazandığı ilmî birikim ve tecrübe ile hayatının son döneminde kaleme aldığı ?Hak Dini Kur'an Dili? adlı tefsir çalışması edebiyettan/belağattan felsefeye/kelama, hadisten fıkha, İslam tarihine, mezhepler tarihine, sosyolojiye varıncaya kadar bir çok ilim dalını havidir. Doğru metotla ve disiplinli çalışıldığı takdirde fıkhın her çağın ihtiyaçlarını karşılayabileceğini savunan Hamdi Yazır, yeri geldiği zaman tefsirinde kendi özel düşüncesini söylemekten çekinmemiştir. Ona göre ayetler hem hale hem de istikbale bakar. Yeter ki ayetleri doğru anlayacak ve olayların illet ve sebebini, kanunlarını doğru tespit edecek ilim ehli olsun. Yalnız her ne pahasına olursa olsun ?Asrın idrakine söyletmeliyiz Kur'an-ı? düşüncesine son derece karşıdır. Her teceddüdün tekamül anlamına gelmeyeceğini çok iyi bilen merhum, muhkem nasslar karşısında içtihadın toplumu helake sürükleyici bir felaket olacağını hatırlatmıştır. Biz de bu nakıs çalışmamızda merhumun görüş ve düşüncelerini belirlemeye say ve gayret ettik."
