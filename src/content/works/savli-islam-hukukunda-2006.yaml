abstract: "87İSLÂM HUKUKUNDA ZİRAÃ ÜRÜNLERİN ZEKÂTIMedeni ŞAVLIYüzüncü Yıl ÜniversitesiSosyal Bilimler Enstitüsü Temel İslâm Bilimleri Anabilim DalıTez Yöneticisi: Yrd. Doç. Dr. Sahip BEROJE88 Sayfa-2006ÖZETBu çalışma İslâm hukukunda farz bir ibadet olan zekâtın bir bölümünü teşkileden ziraû ürünlerin zekâtını içermektedir. Tezimiz bir giriş ve iki bölümdenmeydana gelmektedir. Girişte konunun amacı ve önemi üzerinde durulmuştur.Birinci bölümde zekât ibadeti ile ilgili genel bilgiler ele alındı. Zekâtınfarziyeti, teşrû tarihi, sosyal yardımlaşma açısından önemi, ahlâki yönü ve zekâtınolabilmesi için gerekli olan şartlar bu başlık altında incelendi. Ayrıca bu başlıkaltında zekât ibadetinin farklı açılardan önemine değinildi.İkinci bölümde ise asıl konumuz olan ziraû ürünlerin zekâtı detaylı olarakverilmeye çalışıldı. İlk olarak konu ile ilgili vârid olan nasslar ortaya konuldu.Ardından İslâm âlimlerinin bu nasslara karşı yaklaşımları ve konu ile ilgili bakışaçıları ele alınmıştır. Konu klasik dört büyük mezhebin dışında ayrıca konu hakkındaşahsi olarak görüş beyan eden İslâm hukukçularının da düşüncelerine yer verildi.Ayrıca konu hakkında serddedilen farklı görüşler ve bu görüşleri desteklemek içingetirilen deliller ortaya konuldu.En son Doğu Anadolu bölgesindeki ziraû ürünlerin zekâtının tatbikâtına kısacadeğinilerek, yerleşik halkın ziraû ürünlerin zekâtını verirken, hangi problemleriyaşadıkları tespit edilmeye çalışılmış ve çözüm önerileri sunulmuştur."
