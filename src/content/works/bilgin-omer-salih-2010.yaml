abstract: "Fetvâ, İslâm hukukunda önemli bir yeri olan, ilahî kaynaklara istinaden söylenen ve şer'î bir meselenin hükmünü ortaya koyan beyandır. Osmanlı toplumundaki müslüman bireylerin zihinlerinde oluşan kimi şüpheleri ve bireyler arasındaki karmaşaları gidermek için uzman kişilerce verilen hüküm mahiyetindeki fetvâlar da muhtelif zamanlarda bir mecmua kompozisyonu içerisinde ilgililerin faydasına sunulmuştur. Ancak bu mecmualar, maalesef üzerinde pek çalışılmamış bir alana aittirler. 18. yüzyılda da fetvâ mecmualarının önemli örneklerine rastlanmaktadır. Bu çalışmamızda Ömer bin Sâlih el-Kırımî'nin 1143/1730 yılından 1159/1746 yılına kadar 16 yıllık müsevvidlik görevi süresince topladığı fetvâlardan derlenen Tuhfetü'l-Fetâvâ adlı mecmuası şekil ve içerik açısından incelenmeye çalışılacaktır."
