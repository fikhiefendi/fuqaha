abstract: "ÖZETYüksek lisans tezi141 NUMARALI GAZİANTEP ŞER'İYYE SİCİLİAYNUR GEÇKİLFırat Üniversitesi Sosyal Bilimler Enstitüsü Tarih Bölümü2006: S.VI+343Tezimiz 141 Numaralı Gaziantep Şer'iyye sicilidir. Sicil Hicri 1234-1236/Miladi 1828-2821 Yıllarını kapsamaktadır. Bu dönemde Ayıntâb Halep Eyaletinebağlıdır.Çalışmamızda; Osmanlı Devleti'nde Kadılık ve Şer'iyye Sicili ile ilgili bilgiverdikten sonra, sicil içindeki belgeleri tasnif ettik ve belgelerin özetleri iletranskripsiyonu ve kısa bir değerlendirmesini yaptık.Ayıntâb Kazasında en yetkili kişinin Kadı olduğunu gördük. Şehirde bunundışında müftü, yeniçeri serdarı bulunmaktaydı.İktisadi yapının gelir-gider dengelerine göre vergilerin toplanmış ve sancakmasraflarının kayıtları düzenli bir şekilde yapılmıştır."
