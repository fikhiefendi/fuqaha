abstract: "ÖZET Delîl anlayışı Câferî usûl alimleri tarafından değişik şekillerde yorumlanmıştır. H.V. asırda dinin sadece ahbâr yoluyla anlaşılabileceğini ileri sürerek akla ve aklî yorumlara hayat hakkı tanımayan Ahbârîlere karşı bir hareket olarak ortaya çıkan Usûlilerin delillere bakış açılarının da farklı oluşlarının nedenleri araştırılarak ortaya koyulmaya çalışılmıştır. Câferî usûl alimlerinden Şeyh M üf id, Şerif Murtazâ ve Şeyh Tûsî'ni örnek alarak H. V.-Vı. asırdaUsûlî ekolün delîl anlayışı değerlendirmeye tabi tutulmuştur. Bu arada muasırları olan Sünnî usûl ulemasının delîl hakkındaki görüşleri ile mukayese edilmeye çalışılmıştır. Hem Sünnî hem de Şiî usûlcüleri tarafından hücciyyeti kabul edilen Kitap, Sünnet, Icmâ, delîllerinin yanışı ra Sünnî usûlcülerinin delîl olarak kabul ettikleri mesâlihi mürsele, istihsan, örf, sahabi kavli gibi delillere Şiî usûlcülerin bakış açıları anlatılmıştır. Ayrıca Câferî usûlcülerini“Akıl”kavramına yükledikleri anlamlar Sünnî usûlcülerinin yükledikleri anlamlanla karşılaştırılmıştır. Bu görüşleri temellendirebilmek için Giriş kısmında delîl kavramı hem Sünnî hem de Câferî usûlüne göre anlatılmaya çalışıldı. Daha sonra ise Câferî usûl alimlerinin delîl anlayışı ortaya koyuldu. Birinci bölümde Fıkıh usûlünün aslî kaynakları olan Kitap, Sünnet, icmâ ve Akıl Carerî usûlcüleri tarafından değerlendirilerek Sünnî usûlcülerin bu delillere bakış açıları ile mukayese edilmiştir. İkinci bölümde ise Câferî fıkıh usûlünün fer'î kaynakları olan Istishab, 106Siret, Berâet, İhtiyat usûlcüler tarafından ışıklandırılmış ve Sünnî usûlcülerin kabul ettikleri fer'î delîller Câferî usûlcüler tarafından değerlendirilmiştir. Bütün bu bilgilerin ve karşılaştırmaların sonucu h.V.-VI. asrın Câferî fıkıh usûlünün oluşması açısından önem arz ettiği ve bu asırlarda Câferî fıkhı olgunluk ve kemal dönemine girdiğidir. Bu asırlarda Şiî fukaha“Kur'an-i Kerimde değişiklik yapılmıştır”iddiası temelli ortadan kaldırılmış ve Kur'an-i Kerim'de hiç bir değişiklik yapılmadığı konusunda görüş birliğine gelmişlerdir.Zaten Sünnî ve Şiî toplumu arasındaki farklılığınesasını teşkil eden ehl-i beytin ve Masum İmamların söz ve rivayetlerine verilen önem Sünnet anlayışında kendini göstermektedir. Şöyleki Sünnî fukaha güvenilirliği şüphe götürmez her râvînin rivayetini kabul ederken, Şiî fukahaya göre bir rivayet Masumlardan nakledilirse sıhhati sözkonusu olabilir Icmâ ise sadece Masumun kavlini keşfetmesi açısından delîldir. Nitekim Sünnî fıkıh usûlünü Şiî usûlüne aktarmış ilk alim sayılan Tûsî sayesinde İcmâ'ın çerçevesi genişledi ve ilk defa olarak Tûsî tarafından Icmânın her asırda geçerli olabileceği ortaya çıktı, çünkü o, imamın her asırda toplumda mevcut olduğu kanaatindedir. Akıl delîl hüviyetine bu asırlarda kavuştu. Şöyleki h.V. asrın evvellerinde hükme ulaştıran bir vasıta olarak zîkr edlse de, asrın sonlarına doğru müstakil ve bağımsız bir delîl haline geldi. Hakkında nassın bulunmadığı yerde aslî delîllerin de bulunmaması halinde“istishab”,“siret”,“berâet”,“ihtiyat”gibi uygulama ilkeleri devreye sokan Câferî usûlcülere göre Sünnî usûlcülerin fer'î delîl olarak kabul ettikleri delîller ya muteber değiller, ya da Kitap, Sünnet ve Akıl gibi aslî delîllerin çerçevesine girmektedirler. 107"
