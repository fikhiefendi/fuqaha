abstract: "Bu çalışma, Sovyetler sonrası dönemde Merkez Rusya'da İslam hukuku öğretimini, tarihsel bağlamı, kurumsal gelişimi ve eğitim programlarını dikkate alarak incelemektedir. Çalışmada, İslami eğitimin ötekileştirildiği ve birkaç dini kurumla sınırlı kaldığı Sovyet döneminden, dini eğitimin yeniden canlandığı ve programların oluşturulduğu Sovyet sonrası döneme kadar İslam hukukunun farklı gelişim aşamaları karşılaştırılmaktadır. Rusya'da modern bir Müslüman eğitim altyapısının oluşturulmasına özel önem verilmektedir. Rusya İslam Enstitüsü ve Bulgaristan İslam Akademisi gibi eğitim merkezlerinin lisans ve yüksek lisans programlarının karşılaştırmalı bir incelenmesi, ders yapısı, Hanefi hukuk geleneğine yapılan vurgu, teorik ve uygulamalı bileşenlerin oranı ve İslam hukuku ile ilgili disiplinlerin öğretilmesine yönelik yaklaşımlardaki farklılıkları göstermektedir. Modern Rusya'da İslam hukuku kavramının oluşumunda Müslüman elitlerin rolü de ele alınmaktadır. Ülke içinde ve dışında eğitim almış uzmanların eğitim programlarının içeriği ve organizasyonu üzerindeki etkisi vurgulanmaktadır. Araştırma, Sovyet sonrası Merkez Rusya'da İslam hukuku öğretiminin üç faktörün kesişiminde geliştiğini vurgulamaktadır: Sovyetlerin din karşıtı politikasının mirası, yerel dini girişimler ve uluslararası İslami eğitim merkezlerinin etkisi. Çalışmada İslam hukukunun sadece kaybolan gelenekleri geri kazanmakla kalmadığı, aynı zamanda yükseköğretim sistemi içinde yeni bir akademik boyut kazandığı, dini çevrelerde hukuk kültürünü güçlendirdiği sonucuna varılmıştır. Bu hususların incelenmesi, eğitim sistemi geliştirme sürecinde karşılaşılan sorunların ve zorlukların belirlenmesine yardımcı olacaktır."
