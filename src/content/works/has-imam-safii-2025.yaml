abstract: "İmâm Şâfiî, hem İslâm hukûkunda hem de edebiyât ve şiir alanında da önemli bir şahsiyettir. Kendisiyle ilgili yapılan araştırmaların çoğu fıkıhtaki yönünü dikkate almaktadır ama edebî kişiliğine ihmalkâr davranmaktadır. Arap gramercileri ve edebiyâtçıları tarafından kendisinden hep övgüyle söz edilir. Şiirlerinde ele aldığı konuları toplumun tüm kısımlarına aktarır. Bu durumun altında yatan sebep, şiirlerinde anlaşılır ve yalın bir dil kullanmış olmasıdır. Ḳur'ân, edebiyât, hadîs ve dil eğitiminin te'sîri şiirlerinde net olarak hissedilmektedir. Şiirlerini oluştururken kelime seçiminde hassas davranır ve okyucusunu şiirlerindeki anlam katmanlarına doğru çeker. İmâm Şâfiî'nin şiirlerindeki konular geniş bir yelpazeye sahiptir. Şiirlerinde ele aldığı konular; yaşam tecrübeleri, inanç, ahlâk, öğüt, ilim, tasavvuf gibi birbirinden farklı alanları kapsar. Bu farklı alanlar hem toplum hem de insan için sanat anlayışını içşelleştirdiğini bize göstermektedir. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde; İmâm Şâfiî'nin ilmî hayatı ile edebî kişiliği ve eserleri ele alınmaktadır. İkinci bölümde; dîvânının tanıtımı ve konu yapısının incelenmesi, üçüncü bölümde ise dîvânın edebî yönden incelenmesi çalışmaya dâhil olmaktadır. İmâm Şâfiî'nin dîvânından seçilen şiirlerin, belâgat ilimleri açısından tahlîlleri yapılmaktadır. Yani bu çalışmada İmâm Şâfiî'nin şiirlerindeki edebî sanatları analiz ederek belâgat ilmini, bu ilmi oluşturan me'ânî, beyân ve bedî' ilimlerini tanımak ve bu ilimlerin konularını uygulamalı olarak gösterme amaçları yer almaktadır. Söz konusu çalışma, literatür ve kaynak tarama yöntemlerinden oluşmaktadır. Dîvândan seçilen şiirlerin edebî analizleri, çözümleme yolları belâgat ilmiyle alâkalı kaynaklar dikkate alınarak yapılmaktadır. Çalışmanın sonunda hem İmâm Şâfiî'nin ilmî hayatı, edebî kişiliği, eserleri, dîvânı hakkında bilgi sahibi olunmakta hem de şiirlerinde kullanmış olduğu çeşitli edebî sanatların neler olduğu ve uygulamalarının nasıl yapıldığı yer almaktadır."
