abstract: "Çalışmanın amacı; faizsizlik yapısına uygun araçlar geliştiren katılım bankalarının, murabaha işlemlerine muhasebe nasıl uygulanır sorusuna cevap aramaktır. Bu amaç doğrultusunda Kamu Gözetim Kurumu (KGK) tarafından yayımlanan Faizsiz Finans Muhasebe Standardı (FFMS)-28“Murabaha ve Diğer Vadeli Satışlar”ve mevcut düzenlemeler ile yapılan muhasebe kayıtları nitel araştırma yöntemi ile karşılaştırılmıştır. Türkiye'de kullanılan murabaha sisteminin uygulanabilirliği ile ilgili çalışmaların yeni olması sebebiyle, yapılan karşılaştırmanın ve katılım bankaları tekdüzen hesap planında önerilen yeni hesapların literatüre katkı sağlamasının önemli olduğu düşünülmektedir. Sonuç olarak FFMS-28 ilk kez stok kavramından ve alıcının finansal tablolarından bahsetmiştir ve katılım bankalarının bu değişiklikleri önerilen hesaplar ile nasıl muhasebeleştirecekleri anlatılmıştır. Mevcut uygulamada Türkiye muhasebe standartlarına göre murabaha konusu varlık, alındığındaki maliyet fiyatı kadar borçlanıp, kar pay tutarı ve alınan vergiler ayrı kaydedilmiştir. FFMS'e de murabaha konusu varlık önce stok hesaplarına alınarak, müşteri kredi hesabıyla borçlandırılmış, ardından satış işlemi yapılarak, elde edilen fark (kar payı) düzenleyici bir hesap olan ertelenmiş kar hesaplarında gösterilmiştir."
