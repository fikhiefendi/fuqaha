abstract: "Manastır şehri, tarihte dinî bir merkez olmasının yanı sıra canlı bir ekonomiye ve ticari faaliyetlere sahipti. Osmanlı Devleti'nin idaresine girdikten sonra da bu önemini koruyarak, ticaret yolları canladırılmış ve nüfusu artırılmıştır. Rumeli'nin sol kol kazalarından birisi olan Manastır, fetihlerde askeri bir üs olarak kullanılmış, coğrafi konumu ve zengin kaynakları dolayısıyla sefer sırasında Osmanlı ordusunun ihtiyaç duyduğu lojistik kaynakların önemli bir kısmını karşılamıştır. Osmanlı Devleti sefer kararı aldığında, yapılacak seferin hazırlıklarına başlanması ve ordunun ihtiyaçlarının temini için kazalarda bulunan kadılara bazı emirler göndermekteydi. Gönderilen bu emirler de kadı tarafından hukuki dava kayıtlarının bulunduğu sicil defterlerine kaydedilmekteydi. Bu çalışmada 25 Nolu Manastır Şer'iyye Sicilinin transkripsiyonu ve değerlendirilmesi yapılarak şehrin idarî, hukukî, ekonomik ve sosyal yapısına dair bilgiler verilmiştir. Manastır'ın hukukî ve sosyal yapısı vesayet, boşanma, nafaka gibi dava kayıtlarından, ekonomik durumu alım-satım ve veraset kayıtlarından, idarî yapısı ise ferman, beraat gibi belge suretlerinden yararlanılarak değerlendirilmiştir. Ayrıca Manastır'ın II. Viyana Seferi sırasında orduya lojistik destek sağladığı defterde bulunan cizye, mevkufat ve tevzi kayıtlarından anlaşılmaktadır. Yine II. Viyana Seferi'nin hemen ardından yeni bir sefer hazırlığı başlatılmış ve bu sefer sırasında da Manastır'ın lojistik kaynak sağladığı defterdeki kayıtlarda mevcuttur. Defterin değerlendirilmesi bu kayıtlarda bulunan bilgiler ve Manastır hakkında bilgi içeren diğer kaynaklardan faydalanılarak yapılmıştır."
