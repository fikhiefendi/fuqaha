abstract: "Bütün fıkhi mezhepler, İslam hukukunun kaynakları olarak en başta Kur'an ve Sünnet'i kabul ederler. Bu iki kaynakta bir meseleyi çözüme kavuşturacak bir nass yoksa, aklı devreye sokarlar. Kur'an ve Sünnet'in dışındaki bütün kaynaklar aklın ürünüdür. Kıyasın bütün mezheplerce İslam hukukunun kaynaklarından biri olarak kabul edildiği bir gerçektir. Fakat ceza hukukunda kıyasa kısmen başvurulmuştur. Bütün suç ve cezaların Kur' an' da belirtilmesinin mümkün olmadığına göre, başlangıçta kıyasa başvurularak birtakım cezaların tesbit edilmesi gerekiyordu. Bu tesbit işini müctehid hukukçular yapmaktaydılar. Bunun için kıyasa başvurmak, mahkemede hakime keyfi yargılama fırsatı vermek anlamına gelmez. Dolayısıyla“Kanunilik”prensibine ters değildir. Zira İslam ceza hukukunda suç ve cezaların kanuniliği esastır. İslam ceza hukukunda suç ve cezalarda kıyası Hanefiler dışındaki mezhepler kabul etmektedirler. Hanefiler, ceza ile ilgili, gerek kısas ve diyet cezası gerektiren hususlar, gerekse haddler ve keffaretler, miktarları Sâri' tarafından tayin ve takdir edilen ibadetler nevinden sayarak bu hususlarda kıyasa başvurmamışlardır. Şâfiîler ise, genel olarak ictihad anlamı verdikleri için kıyası her alanda kullanmışlardır."
