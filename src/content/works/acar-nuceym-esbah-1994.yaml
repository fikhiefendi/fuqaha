abstract: "ÖZET Çalışmamız temelde iki bölümden oluşmaktadır. Birinci bölümde İbn Nüceym'in hayatı, eserleri, şahiyeti ve hukukî yönü ele alınmıştır. İkinci bölüm ise İbn Nüceym'in el-Eşbâh ve'n-Nezâir adlı eserini tanıtım ve tahlilden oluşur. Eseri incelerken en son baskı olan, İbn Abidin hasiyeşiyle birlikte 1983 yılında Şam'da yapılan baskısını esas aldık. el-Eşbâh yedi bölümden oluşmaktadır. Birinci bölüm: Kaideler (kavâid), ikinci bölüm: İstisna ve dâbıtlar, üçüncü bölüm: Cem ve fark, dördüncü bölüm: Bilmeceler (elgaz), beşinci bölüm: Hileler (hıyel), altıncı bölüm: Farklar (furûk), yedinci bölüm: Hikaye ve yazışmalar (müraselât). Esirin birinci bölümünü incelerken kaideleri, Subkî ve Suyûtî'nin aynı isimdeki eserlerinin ilgili bölümleri ve Mecelle'nin ilgili maddeleri ile karşılaştırarak vermeye çalıştık. Yedinci bölüm dışında, diğer bölümlerde, konular ilgili bab başlıkları altında incelenmesine rağmen, başlıkla çok az ilgili, farazi ve nâdir rastlanan konulara da değindiği için, biz bunların tamamını değil, ancak güncelliğini koruyan meseleler ile önemli gördüklerimizi ele aldık. 2Z"
