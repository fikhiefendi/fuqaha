abstract: "İmam Mâturidî'nin günümüze kadar gelen önemli eserinden biri Te'vîlâtu'l-Kur'ân tefsiridir. İmam Mâturidî, dirayet tefsirine örnek teşkil eden bu eserinde, tefsir ve tevil arasında ayrım yaparak, ayetlerin işaret edeceği muhtemel manalara dair aklî yorumlara yer vermiş ve yorumlarını ayetle, hadisle, sahabe sözleriyle vb. destekleyerek tefsir ilmi açısından zengin bir eser meydana getirmiştir. İmam Mâturidî, Te'vîlâtu'l-Kur'ân tefsirinde, kurucusu olduğu Mâturidîyye akâidi ile ilgili kelamî konulara dair açıklamalarda bulunur. Mû'tezile başta olmak üzere çeşitli İslamî fırkalar, bazı dinler, inançlar ve felsefî görüşleri naklederek, kelâm kitaplarında üzerinde durulmayan birçok konuyu tefsirinde ele alıp tartışmaya açar. Dolayısıyla tefsir kitabı olan Te'vîlâtu'l-Kur'ân, İmam Mâturidî'ye ait birçok kelami görüşlere, bu görüşlerin naklî ve aklî delillerle ispat edilmesi yönündeki büyük çabalara ve muhalif görüşlere yapılan reddiye ve eleştirilere ulaşmak açısından yoğun malzeme barındırır. İmam Mâturidî, Te'vîlâtu'l-Kur'ân tefsirinde konu ile ilgili farklı mezhep veya farklı mezheplere mensup imamların görüşlerine yer verir ve akıl-vahiy çizgisi ışığında yapılan yorum ve kanaatleri eleştirerek kendine ait kelamî görüşleri ispatlamaya çalışır. İmam Mâturidî, fıkhi alanda İmam-ı Âzam Ebu Hanife'ye ve Ebu Hanife'nin kurduğu Hanefî mezhebine son derece bağlı bir fâkih olmakla birlikte, Hanefî mezhebinin usûl ve furû' bütün konularına vakıf olarak bulunduğu coğrafyada mezhebin sıkı bir savunucusu ve temsilcisidir. Bu tezde, Te'vîlâtu'l-Kur'ân tefsirinde, İmam Mâturidî'nin fıkhî ve kelamî düşünce sistemi esas alınarak, fıkıh ve kelâm alanlarında muarızlarına yönelttiği eleştiriler ve eleştirilerde kullandığı metod üzerinde durulacaktır. Çalışmanın konusu tefsirin yanı sıra, fıkıh ve kelâm disiplinleri ile alakalı olduğundan, tefsir, fıkıh ve kelâm sahalarına ait kaynaklardan istifade edilmiştir. Çalışma üç bölümden oluşup ilk bölümde, İmam Mâturidî'nin hayatı, yaşadığı coğrafyada dinî ve siyasî durum, ilmî şahsiyeti ve eserlerine dair bilgi verilecektir. İkinci bölümde, İmam Mâturidî'nin mensubu olduğu Hanefî mezhebi usûl yöntemine dayanarak yaptığı içtihatlara ve bu içtihatların ispatlanmasına yönelik delil ve açıklamalarına yer verilecektir. Aynı zamanda muhtelif mezheplere yönelik yaptığı eleştiriler ve bu eleştirilerde kullandığı metod üzerinde durulacaktır. Son bölümde ise İmam Mâturidî'nin birçok ayetin tefsirinde yer verdiği kelamî görüşleri ve çeşitli mezhep ve fırkalara yaptığı reddiye ve eleştirileri ele alınacaktır."
