abstract: "İslâm dini yetimlerin haklarının her daim korunup gözetilmesini emretmiştir. Osmanlı Devleti'nde halkın çoğunluğu ve devlet yöneticileri İslâm dinine mensuptur. Bu mensubiyet yetimler ve onların haklarının muhafazası hususunda Osmanlı Devleti tarihi boyunca görülen hassasiyetin temel sebebidir. Bu muhafaza Tanzimat Fermanı'na kadar vakıflar aracılığıyla sağlanmıştır. Bundan sonraki dönemde ise devletin kendi eliyle oluşturduğu yetimhaneler ve yetimler için tesis edilen eğitim kurumlarıyla resmi bir hüviyet kazanmıştır. Yetimlerin bakım ve terbiyesi dışında, 1268/1851 senesinde birdiğer önemli husus olan yetim mallarının muhafaza ve arttırımı için Emvâl-i Eytâm Nezareti kurulmuştur. Nezâretin işleyiş ve yönetimi Şeyhülislamlık'ın ve Padişah'ın onayıyla çıkarılan“Eytâm Nizamnamesidir”başlıklı nizamnamede düzenlenmiştir. İlk nizamnameden sonra yetim mallarının işletimiyle ilgili başka nizamnameler, zeyl ve tadiller çıkarılmıştır. Bunların en kapsamlı olanı 1324/1906 senesinde“Umûm Emvâl-i Eytâmın Sûret-i İdâresi Hakkında Ta'dîlen Kaleme Alınan Nizamnâme”başlığıyla çıkarılmış olanıdır. Bu tez çalışmasında 1324/1906 seneli eytam nizamnamesi fıkıh ilmi ile mukayeseli olarak ele alınmıştır. Bu esas konu ile bağlantılı olarak yetim haklarının muhafazasının tarihsel süreci ve yetim mallarıyla ilgili önceki nizamnameler ile 1324/1906 tarihli düzenlemenin tanıtılması; son nizamnamenin maddelerinin transkripsiyonu ve günümüz Türkçesiyle anlaşılır biçimde yazımına da tezde yer verilmiştir."
