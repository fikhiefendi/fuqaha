abstract: "İslâm'ın ilk yıllarında, bulundukları bölgelerin ekvatora yakın olması sebebi ile beş vakit namazın alametlerini kolaylıkla tespit edebilen Müslümanlar, zamanla İslâm'ın vakit alametlerinin geç veya eksik oluştuğu ya da hiç tespit edilemediği kuzey kutbuna doğru yayılması ile birlikte özellikle yatsı vakti tayini problemi ile karşılaştı. Bu arada hadislerde zikri geçen yatsı namazının vakti için giriş alameti sayılan şafağın kırmızı mı veya beyaz mı olduğu hususunda fakihler arasında yaşanan ihtilaf Doğu ve Güneydoğu Anadolu'da pratik hayata farklı bir şekilde yansımıştır. Örneğin yıl boyu Güneşin batışından 1 saat 10 dakika gibi sabit bir süreden sonra kırmızı şafağın battığı şeklindeki coğrafi gerçeklerden uzak pratik bir uygulamanın dini temeli bulunmamaktadır. Yine namazın vücubunda vaktin girişinin mi yoksa Allah'ın“Namaz kılın”buyruğunun mu esas alınacağı hususu bir diğer ihtilafı teşkil etmektedir. Bunun neticesinde namazın vücub sebebi sayılan vaktin oluşmadığı yer ve zamanlarda yatsı namazının kılınamayacağı şeklinde pratik hayata yansımıştır. Ancak bir şeyin alametinin olmaması o şeyin olmadığı anlamına gelmez. Şafağın batmadığı yerlerde dahi yatsı namazın farz olduğuna dair mevcut deliller içerisinde en önemlisi Allah'ın (c.c.) beş vakit namazı kullarına farz kılması ve bu namazların edasını emretmiş olmasıdır. Bu sebeple bu tür yer ve zamanlarda namazın takdirle kılınması gerekmektedir."
