abstract: "Bu tez, dört bölümden oluşmaktadır. Birinci bölümde, gönüllü vazgeçme kurumunun tarihi gelişimi, vazgeçmeyi açıklayan teoriler ve mukayeseli hukuk bakımından incelenmiştir. Gönüllü vazgeçmenin ilk çıkış noktası, Roma Hukuku'nda, İslam Hukuku'nda uygulaması, tarihi süreçte tasarılarda geçirmiş olduğu değişimler ve cezasızlığı sağlayıcı avantajını açıklayan teoriler incelenmiştir. Bu teorilerden olan ve vazgeçmeyi açıklayan ve benimsediğimiz görüş olan kombinasyon teorisi açıklanmıştır. Nihayet, mukayeseli hukukla bu bölüm sona ermektedir. İkinci bölüm, gönüllü vazgeçmenin unsurlarının izah edilmesine ayrılmıştır. Gönüllü vazgeçmenin şartları, gönüllü vazgeçmenin bulunduğu ve bulunmadığı durumlar Alman Federal Yüksek Mahkemesi ve Türk yargı kararları ile zenginleştirilmiş ve teoriler eşliğinde açıklanarak nihayetlendirilmiştir. Üçüncü bölüm, gönüllü vazgeçme kurumunun suça iştirak noktasında incelenmesine ilişkindir. 5237 sayılı TCK m. 41 düzenlemesinin esaslarının ayrıntılı olarak açıklandığı bu bölüm, suç ortakları bakımından vazgeçmenin incelenmesiyle tamamlanmıştır. Dördüncü bölüm ise, gönüllü vazgeçmenin maddi ceza hukukunda görünümü ve özel durumlara ayrılmıştır. Bu bölümde, ihmali suçlarda gönüllü vazgeçme, neticesi sebebiyle ağırlaşmış suçlarda gönüllü vazgeçme gibi suç türlerinde vazgeçme kurumunun uygulanabilirliği tartışılmıştır. Sistemimizde olmayan öngörülü vazgeçme ve nitelikli teşebbüs kavramları açıklanmış ve vazgeçmeyle ilişkili özel durumlara yer verilerek çalışma sona erdirilmiştir."
