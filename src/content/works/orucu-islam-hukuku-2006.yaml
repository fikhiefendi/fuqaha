abstract: "Bu çalışma, ana hatlarıyla iki nokta üzerinde yoğunlaşmaktadır.Birincisi İslam'da aile kurumun oluşmasında ilk adım olan nikâh ve evliliktir.Bütün hukuk sistemlerinde bu yer almakla beraber İslam hukukunda nikâhhukuki bir akit olmaktan öte kutsal bir yapıya bürünmüştür.Aile insanoğlunun içinde doğup büyüdüğü, ilk eğitimini aldığı en küçüksosyal yapıdır. Toplumun çekirdeğini oluşturur. Toplumun yapıtaşı olan bukurum içerisinde kadın ise son derece önemli bir yere sahiptir. Çünkütoplumu doğuran ve yoğuran kişidir.Tarih içerisinde evliliklere baktığımızda ise kadının durumu ve konumubize aile kurumu hakkında yeterli bilgiyi vermektedir. Bu açıdan bakıldığındaİslam'ın aile müessesesine ve kadına verdiği değer kendiliğinden ortayaçıkmaktadır. Çünkü İslam'ın hedefi insanlara hem dünyada hem de ahirettemutluluk vermektir. Nikâh konusu da tamamen kadının haksızlığauğramaması üzerine kuruludur.Fakat İslam'ın bu hassasiyetinin yanlış anlaşılıp, yanlış uygulanması,günümüzde insanlara bazı sıkıntılar yaşatmaktadır. Bir diğer nokta olarak elealdığımız bu durum ? Resmi ve medeni nikâh formları? başlığıyla, yaşananörneklerle ortaya konulmuştur."
