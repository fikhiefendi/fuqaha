abstract: "Osmanlı Devleti'nin sınırları içerisinde bulunan yerleşim yerlerinde tutulmuş olan şer'iyye sicilleri, toplum yapısının ve bölge yaşantısının anlaşılması hususunda oldukça mühim kayıtlardır. 1516 tarihinde Osmanlı Devleti topraklarına katılmış olan Ayıntâb'da da şer'iyye sicil kayıtları bulunmaktadır. Hazırlanan tez kapsamında çalışmak maksadı ile Ayıntâb'daki kayıtlardan XVI. Yüzyılın ikinci yarısında olanları tercih edilmiştir. Üzerinde çalışılmış olan altı adet defter içerisinden, suç işleme ya da suç işlendiğini iddia etme sebebiyle tutulmuş olan kayıtlardan istifade edilmiştir. Osmanlı Devleti'nin temel aldığı İslam hukuku içerisinde, işlenmiş olan suçlara karşı verilen cezalar, belirli şartlara bağlı kalarak belirlenmiştir. Suçlar genel manası ile hadd cezası gerektiren suçlar, kısas ve diyet cezası gerektiren suçlar, ta'zir cezası gerektiren suçlar olarak ayrılmıştır. Hadd cezaları hududları kesin olarak belirlenmiş ve Allah hakkı için, kısas ve diyet cezaları kasten ya da hataen öldürme ya da yaralama suçlarında kimselerin birbirlerinden haklarını almaları için, ta'zir cezaları ise kesin bir ceza belirlenmemiş suçlar için uygulanan cezalardır. İslam hukukunda ayrımı yapılmış olan bu cezaların uygulandığı suçlar, üzerinde çalışılmış defterler içerisinden seçilip başlıklar halinde sınıflandırılarak değerlendirilmiş ve olabildiğince izah edilmeye çalışılmıştır. Bu değerlendirme ile XVI. Yüzyılın ikinci yarısında Ayıntâb'da işlenen suçlar bir nebze olsun anlaşılmaya çalışılmıştır. Bu dönem içerisinde aile ve toplum yaşamında karşılaşılan olaylar ve bunların yine aile ve toplum üzerine yansımaları incelenerek alana ufak da olsa bir katkı sağlanmaya uğraşılmıştır."
