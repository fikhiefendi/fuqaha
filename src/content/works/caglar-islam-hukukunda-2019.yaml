abstract: "Alışverişlerde verilen bedellerden birinin ismi olan semen kavramının inceleneceği bu çalışma bir giriş, üç bölüm ve bir sonuç kısmından oluşmaktadır. İlk bölümde semenin akit içindeki yeri, şartları ve ilişkili olduğu kavramlar ele alınmıştır. İkinci bölümde akit çeşitlerinde semenin konumu ve şartlarındaki değişiklikler açıklanmaya çalışılmıştır. Bu minvalde klasik kaynaklarda bey' çeşidi olarak ifade edilen temel akit çeşitleri açıklandıktan sonra semen eksenli bir incelemeye tabi tutulmuştur. Son bölümde ise semenin verilme aşamasında tabi olduğu şartlar, paranın değerinde oluşan değişiklikler, teslimden önce semende tasarruf ve semende oluşacak zararlar gibi semene ait hükümler araştırmaya konu edilmiştir. Sonuç kısmında ise çalışmada tespit edilen özelliklerden önemli kısımlar topluca ele alınarak çalışma sonlandırılmıştır."
