abstract: "Bu çalışmada, Türkiye bankacılık sektörünün finansal yapısı ile katılım bankacılığının sektör içindeki konumu Haziran 2025 dönemi verileri esas alınarak incelenmiştir. Analizde bankacılık sektörü; aktif büyüklükleri, fon toplama ve kullandırma yapısı, kârlılık, sermaye yeterliliği, likidite ve risk göstergeleri çerçevesinde ele alınmış; katılım bankacılığı hem sektör geneli hem de banka bazında değerlendirilmiştir. Çalışmada Bankacılık Düzenleme ve Denetleme Kurumu ile Türkiye Katılım Bankaları Birliği tarafından yayımlanan resmi istatistiklerden yararlanılmıştır. Bulgular, Türkiye bankacılık sektöründe mevduat bankalarının aktif büyüklükler ve fonlama yapısı açısından ağırlıklı konumunu sürdürdüğünü, katılım bankalarının ise görece sınırlı bir paya sahip olmakla birlikte istikrarlı bir büyüme eğilimi sergilediğini göstermektedir. Katılım bankacılığı kapsamında aktif büyüklüklerin, toplanan fonların ve kullandırılan fonların belirli bankalar etrafında yoğunlaştığı; özellikle kamu destekli katılım bankalarının ölçek büyümesine önemli katkı sağladığı tespit edilmiştir. Özel sermayeli katılım bankalarının orta ölçekli bir yapı sergilediği, dijital katılım bankalarının ise henüz sınırlı hacimlerle faaliyet gösterdiği belirlenmiştir. Likidite karşılama oranları ve sermaye yeterliliği göstergeleri incelendiğinde, katılım bankalarının yasal asgari sınırların üzerinde değerlere sahip olduğu ve finansal dayanıklılık açısından güçlü bir görünüm sunduğu görülmektedir. Kârlılık göstergeleri, özellikle son yıllarda katılım bankalarının özkaynak kârlılığının sektör ortalamasıyla uyumlu seyrettiğini ve bazı dönemlerde bu ortalamanın üzerine çıktığını ortaya koymaktadır. Takipteki alacak oranlarının görece düşük seviyelerde gerçekleşmesi, kredi riskinin kontrollü biçimde yönetildiğine işaret etmektedir. Elde edilen bulgular, katılım bankacılığının Türkiye bankacılık sistemi içinde tamamlayıcı bir finansman kanalı olarak konumlandığını, reel sektör finansmanına katkı sunduğunu ve finansal istikrar çerçevesiyle uyumlu bir gelişim gösterdiğini ortaya koymaktadır. Ölçek büyüklüğü, kurumsal kapasite ve ürün çeşitliliğindeki artışın, katılım bankacılığının sektör içindeki görünürlüğünü ve etkinliğini artırdığı anlaşılmaktadır."
