abstract: "Küresel ekonominin gelişimi ile birlikte finans sektörü de ciddi bir gelişim ve dönüşüm yaşamakta; zaman içinde, yeni ihtiyaçlar doğurmakta ve yeni finansal piyasa araçlarına zemin hazırlamaktadır. Diğer yandan, İslam ülkelerinde de, kadim İslam Ekonomisi anlayışı varlığını sürdürmekle beraber, Neo-liberal politikaların ürünü konvansiyonel finansal piyasaların giderek artan etkisi de bir gerçektir. Borç ve faize dayalı konvansiyonel finansal piyasalara alternatif olabilecek İslami finans, dünya finans piyasalarındaki artan popülaritesine paralel olarak Türkiye'de de hızlı bir gelişim göstermektedir. Ancak, İslami finans sektörünün gelişimini belirleyen önemli unsurlardan biri de mevcut hukuk sisteminin ve yasaların, İslam hukuk kurallarına uygulanabilirliğidir. Bu çalışma, öncelikle İslami finansın Türkiye ve dünyadaki gelişimi; Türk Hukuku'ndaki kanun, tüzük ve yönetmelikler doğrultusunda, İslami finans ile ilgili düzenlemeleri açıklamaya çalışmaktadır. Çalışmanın amacı, Türkiye'de İslami finans uygulamalarında eksik kalan konuları belirleyip; kanun koyucu tarafından düzenleme yapılması sürecine yardımcı olmak, mevcut düzenlemelerin uygulamada meydana getirdiği sorunları ortaya koymak ve tamamen veya kısmen değiştirilmesi sürecine katkıda bulunmaktır."
