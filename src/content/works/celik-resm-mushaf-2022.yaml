abstract: "Son ilâhi kitap olan Kur'ân-ı Kerim, nüzulünden itibaren bizzat Hz. Peygamber tarafından vahiy kâtiplerine yazdırılarak koruma altına alınmıştır. Hz. Ebu Bekir döneminde ise dağınık şekilde olan vahiy metinleri iki kapak arasında bir araya getirilerek cem edilmiştir. Kur'ân-ı Kerim alanında yapılan en önemli faaliyet kuşkusuz Hz. Osman zamanında yapılan istinsah faaliyeti olmuştur. Bizzat Hz. Osman'ın denetim ve kontrolünde yürütülen istinsah faaliyeti neticesinde vahiy metinleri Mushaf ismi verilen kitap şeklini almış ve çeşitli nüshalar istinsah edilmiştir. Bu ciddi çalışma neticesinde ümmet arasında çıkan kırat tartışmaları bertaraf edilmiş ve birlik sağlanmıştır, aynı zamanda da Hz. Peygamber'e nispet edilen kırâat farklılıkları da bu nüshalarda muhafaza edilmiştir. Ancak söz konusu olan bu kırâat farklılıkları manayı bozacak veya değiştirecek bir farklılık olmayıp sadece okumayı kolaylaştırmak adına bazı imlâ farklılıklarıyla sınırlıdır. Mushafların şahsına münhasır olan bu imlâ farklılıkları ilk dönem Müslümanlar arasında tartışma konusu olmazken, hicrî II. asır sonrası hız kazanan dil çalışmaları ve imlâ kurallarının da sistematize edilmesi neticesinde bazı alimler tarafından irdelenmiş ve çeşitli gerekçeler öne sürülmüştür. Örneğin; Arap yazısının yetersizliğine, dilsel mülahazalara, kâtip hatasına, batini ve gizli sırlar olduğuna dair tasavvurlar öne sürülmüştür. Mushaf'ın kendisine has hattı ve imlâsındaki bu farklılıklar alimler arasında genel olarak üç görüş etrafında toplandığı söylenebilir. İşte tezimize konu olan bu üç görüş, resm'ül-mushaf'ın ictihadî veya tevkifî olma meselesi ve orta yolu tutan alimlerin görüşleridir. Tezimin araştırma konusu olan bu düşünceleri ele alırken bu alanda yazılmış ve öne çıkmış gerekli kaynaklar detaylı bir şekilde incelenip genelde dilin ve özelde Arap yazısının menşeî ve imlâ yapısı detaylı bir şekilde ele alınıp incelenmiş ve bu tasavvurları savunan alimlerin gerekçeleri incelenerek konuya farklı bir perspektif kazandırılmak istenmiştir."
