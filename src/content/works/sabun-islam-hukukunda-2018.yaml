abstract: "'İslam Hukukunda İntihar Eylemleri' başlıklı tez çalışmasında kişinin cihad etmek gayesiyle kendi hayatına son vermesi ve saldırı esnasında yakınlarında bulunanları kendisi ile birlikte öldürmesinin İslam Hukukundaki yeri incelenmiş, bu konuda ortaya konan görüşler ve delilleri ele alınarak tarafların konuya yaklaşımları ve ortaya koydukları yöntemler işlenmiştir. Çalışmada ilk olarak, intihar eylemleri psikolojik, sosyolojik ve siyasi açıdan ele alınarak araştırma konusu olan problemin doğru tespit edilmesi amaçlanmıştır. İkinci aşamada eylemler hakkında ortaya konan görüşler ve dayandırıldıkları deliller ele alınarak varsayılan meşruiyet zemini değerlendirilmiştir. Son olarak intihar saldırılarının İslam Hukuku bağlamında değerlendirilmesi yapılmıştır. İntihar eylemlerinin bazı durumlarda terör eylemlerine dönüşmesi ve saldırılarda birçok masum sivilin ölmesi ister istemez İslam ve terör kavramlarını zihinlerde yaklaştırmakta, bu da İslam hakkında bir önyargı oluşturmaktadır. Bu sebepten intihar saldırılarının meşruiyeti meselesinin şer'î açıdan netliğe kavuşturulması gerekmektedir. Çalışmada bu hususa katkı yapmak hedeflenmiştir. İntihar saldırıları hakkında sağlıklı bir hükme varabilmek için eylemler, gerekçeleri, kullanılan yöntemler, olası sonuçları ile birlikte değerlendirilmeli, gerçekleştiği zaman ve zamanın getirdiği konjonktürel değişiklikler dikkate alınmalıdır. Konuyu şer'î açıdan değerlendirirken ortaya konan delillerin sıhhati kadar var olan delillerin bağlamından koparılmadan doğru yorumlanması, İslam Savaş Hukuku prensipleri çerçevesinde ele alınması gerekmektedir. Anahtar Kelimeler İntihar eylemleri, intihar saldırıları, cihad, intihar, İslam Hukuku, İslam Savaş Hukuku, terör"
