abstract: "İslam Hukuku kaynakla rından biri olan icmâ', usulcüler arasında tartışmalı bir konudur. Serahsî, Hanefi fıkıh anlayışını sistemli birşekilde sunan ilk alimlerdendir. İcmâ' ile ilgili tartışmalarda bulunup, yapılan itirazlara cevaplar vermiştir. Serahsî, icmâ'ı, Kurbân ve Sünnetten sonra İslam Hukuku kaynağı olarak üçüncü sırada kabul eder. İcmâ' mümkündür ve Kur\"ân ve Sünnet gibi geçerlidir. Ancak Serahsî'nin diğer alimlerin aksinej icmâ' ın oluşumu konusunda daha esnek ve gerçekçi davrandığı dikkati çekmektedir. Medeni hukukta içtihadı birleştirme kararları bazı yönleriyle icmâ'a benzemektedir. Üst mahkemelerin almış olduğu içtihadı birleştirme kararlan, adli organları bağlar. İçtihadı birleştirme kararlarına itiraz edilemez."
