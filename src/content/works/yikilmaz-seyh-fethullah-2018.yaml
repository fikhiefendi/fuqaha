abstract: "Şeyh Fethullah el-Verkânisî, yaşadığı dönemde ilmi ile -özellikle fıkıh alanında- temayüz etmiş, bunun yanında tasavvuf/tarîkat alanında da ciddi çalışmaları olmuş ve sadece yaşadığı çevrede değil İslam âleminin birçok bölgesinde tanınmış bir şahsiyettir. Buna rağmen bu güne kadar onunla ilgili bir akademik çalışma yapılmamıştır. Sadece hayatı ile ilgili kısa bilgilere yer veren bazı çalışmalar olmuştur. Bu çalışmamızın amacı, Verkânisî'nin hayatı ve ilmî kişiliği ile ilgili bilgileri bir araya getirmek, yakın tarihte yaşamış olan bu önemli şahsiyetin tanınmasını sağlamak ve konu ile ilgilenen araştırmacılara katkı sağlamaktır. Bu çalışmada Verkânisî'nin kısa hayatı, ilmî kişiliği ve yazılı olarak elimize ulaşabilen fetvâları üzerinde durulmuştur."
