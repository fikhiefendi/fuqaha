abstract: "Bu araştırmanın amacı, Filistin'deki İslami bankalarda dijital dönüşümün mevcut durumunu, ayrıca mevcut fırsatları ve siber güvenlik zorluklarını ortaya koymaktır. Araştırmanın amaçlarına ulaşmak için araştırmacı karma yöntemi (nicel ve nitel) kullanmıştır. Bu kapsamda, Filistin'deki İslami bankalarda farklı bölümler, İdari birimlerdeki genel işleyiş ve pozisyonlarla ilgili çevrimiçi bir anket yapıldı. Ayrıca, teknik personel ile karşılaştırmalar gerçekleştirildi. Sonuçlar, Filistin'deki İslami bankalarda dijital dönüşüm ilkelerinin uygulanma düzeyinin önemli ölçüde daha yüksek olduğunu göstermiştir. Sonuçlar ayrıca, dijital dönüşümün bu kurumlara sunabileceği fırsatların çok umut verici göründüğünü de ortaya koymuştur. Çalışma ayrıca, İslami bankalarda siber güvenliğin etkinleştirilmesi için gereken şartların nispeten yüksek olduğunu, uygulanmasındaki zorlukların ise orta ila yüksek düzeyde olduğunu göstermiştir. Filistin'deki İslami bankalar çeşitli zorluklarla karşı karşıyadır; bunların en önemlisi İsrail işgali ve İsrail Merkez Bankası'nın bu bankalara yönelik politikalarıdır. Çalışmada, İslami bankalardaki çalışanlara siber güvenliği artırmayı ve modern teknolojilerle başa çıkma becerilerini geliştirmeyi amaçlayan eğitim kursları verilmesi gerektiği tavsiye edildi."
