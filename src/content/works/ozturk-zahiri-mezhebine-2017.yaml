abstract: "İnsanın haysiyet ve şerefini koymuş olduğu kurallarla koruma altına alan İslâm dini, onun; canına, malına ve ırzına yapılacak saldırıları büyük günahlardan saymış ve bunlara karşı işlenecek suçları engellemek adına bir takım müeyyideler getirmiştir. Mala yönelik suçlar arasında yer alan hırsızlık eylemi İslâm ceza hukukunda had suçları içerisinde yer almakta olup bu suçu işleyen faile el kesme cezası öngörülmektedir. Ancak İslâm hukukçuları bu suçun oluşumu ve cezanın uygulanması için; suçun konusu olan mal, bu malın bulunduğu mahal, suçun icrası ve eylemi gerçekleştiren kişi ile ilgili birtakım şartlar aramışlar ve bazı hususlarda farklı görüşler ortaya koymuşlardır. İslâm hukuk tarihinde nasların zahirlerindeki hükümlerle yetinmeyi ilke edinen tek yaklaşım olan Zâhirî mezhebi fıkıhta re'ye ne ölçüde yer verilmesi gerektiği konusunda ortaya çıkan ayrışmada re'y/kıyas karşıtlığının vardığı nihâî noktayı temsil etmektedir. Bu mezhebin zahirciliği, şer'î hükümlerin elde edilmesinde nasların yalnızca lafız anlamları ile yetinmeleri anlamına gelir. Zâhirîlerin bu özellikleri hırsızlık suçuna yaklaşımlarında net bir şekilde görülmektedir. Çünkü onlar hırsızlık suçu ile ilgili âyetin zahiriyle yetinmektedirler. Bu sebeple de hırsızlıkta malın yakın akrabadan, devlet hazinesinden veya korunaklı alandan çalınmış olması vb. durumlarında diğer mezheplerden farklı olarak hırsıza had cezasının uygulanması gerektiği görüşünü savunmuşlardır Zâhirî mezhebine göre hırsızlık haddinin teşekkülü adını vermiş olduğumuz bu çalışmada hırsızlık suçunu, bu suçun İslâm ceza hukukundaki yerini ve oluşum şartlarını Zahirîlerin görüşleri çerçevesinde diğer mezheplerle mukayese yaparak ele aldık. Tezimiz bir giriş ve iki bölümden oluşmaktadır. Girişte Zâhirî mezhebi hakkında genel bir bilgi verip fıkıh usulüne dair görüşlerine, önde gelen temsilcilerine ve bunların eserlerine kısaca değindik. Birinci bölümde hırsızlık eyleminin daha iyi anlaşılması amacı ile suç ve ceza kavramlarının tanımı ile bunların unsurlarını bu konuyla alakalı yapılmış çağdaş eserlerden istifade ederek açıklamaya çalıştık. İkinci bölümde Zâhirî mezhebine göre, hırsızlık suçunun tanımını, unsurlarını, tespitini ve hükmünü diğer mezheplerle mukayese ederek açıklamaya gayret ettik."
