abstract: "İslami bankacılık olarak adlandırılan faizsiz bankacılık mali sektör içinde klasik bankaların yerine getirdiği tüm işlevlerin yanında finansal kiralama, sigortacılık, takas gibi diğer ticari Faaliyetleri de yerine getirmektedirler. Diğer bir ifade ile faizsiz bankacılık sisteminde İslamî bankalar kendi prensipleri ile ters düşmeyen hemen hemen klasik bankaların yaptığı tüm işlemleri yerine getirmektedirler. Bu tür bankacılığın temel amacı; faizsiz finansman esasları çerçevesinde, faiz hassasiyeti olan kesimlerin yastık altında kalan atıl sermayelerini, milli ekonomiye kazandırmaktır."
