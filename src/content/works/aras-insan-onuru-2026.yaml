abstract: "Yirminci yüzyılın ikinci yarısından itibaren modern tıp hızla gelişmiştir. Bu süreç insan bedeni, üreme süreçleri ve ölüm üzerindeki teknik kontrolü artırırken klasik fıkıh literatüründe doğrudan karşılığı bulunmayan yeni biyoetik meseleleri beraberinde getirmiştir. Bu çalışma; ötanazi, organ ve doku nakli, taşıyıcı annelik, klonlama/kök hücre uygulamaları ve süt bankacılığı olmak üzere beş güncel biyoetik meseleyi İslam hukuku açısından incelemektedir. Tezin amacı insan onuru kavramını bu meselelerin ortak değerlendirme ekseni olarak konumlandırmaktır. Araştırmada klasik fıkıh kaynakları, uluslararası biyotıp belgeleri ve Türk hukuku tezin temel veri kümesini oluşturmaktadır. Bu kapsamda çağdaş fetva kurullarından Mecmau'l-Fıkhi'l-İslâmî ed-Düvelî ile Diyanet İşleri Başkanlığı Din İşleri Yüksek Kurulu kararları birlikte incelenmiştir. Araştırmanın temel bulgusu şudur: İslam hukukunun çağdaş biyoetik meselelere ürettiği çözümler salt şekli kurallarından ibaret değildir. Bu çözümler, temelini Kur'ânî mükerremlik ilkesinden alan fıtrî bir insan onuru anlayışına dayanmaktadır. Modern hukukun insan onurunu akıl yetisi veya yaşam kalitesi gibi kapasite temelli ölçütlerle değerlendiren yaklaşımına karşılık İslam hukuku, insanı salt yaratılışı sebebiyle değerli kabul etmektedir. Bu temel fark, incelenen her meselede şer'i hükümlere doğrudan yansımaktadır. Ötanazide hayatın korunması ile tıbbî beyhûdelik kavramı sınırı belirlerken organ naklinde emanet bilinci ile maslahat dengesi belirleyici olmaktadır. Taşıyıcı annelikte hıfz-ı neseb ilkesi nesep karışıklığı sebebiyle temel sınırı çizmekte, süt bankacılığında ise hıfz-ı nesl ilkesi süt akrabalığının korunması bağlamında öne çıkmaktadır. Klonlama tartışmasında ise fıtrata müdahale yasağı insan onurunun korunmasında belirleyici unsurdur. Sonuç olarak tez, klasik fıkıh ile modern biyoetik arasındaki ilişkinin tek yönlü bir uyarlama olmadığını göstermektedir. İnsan onuru ekseninde kurulacak ortak bir kavramsal çerçeve, klasik fıkıh mirasının çağdaş meselelere taşınmasında ve İslam hukukunun uluslararası biyoetik tartışmalarıyla diyaloğunda yön gösterici işlev üstlenmektedir."
