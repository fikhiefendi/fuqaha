abstract: "Bu çalışmada, İslam hukukundaki ta'likî şartların siğası ve onun çağdaş bankacılık ve bazı klasik akitlere olan etkisi ele alınmıştır. Fıkhî nitelikleri ve bazı zayıf siğalarla ilgili mevcut olan bazı problemler tespit edilerek yerine alternatif bir şekilde bir çözüm ortaya koymaya çalışılmıştır. Çalışmada, akitlerle ilişkine olan kural ve kaidelerden hareket edilerek ta'likî şartlar ortaya koyulmuştur ki; bu yolla bankacılıkta uygulanan akit ve muamelerle ilgili olan sorunlar ortadan kaldırılabilir. Çağdaş muamelelerin çoğunda ta'likî şartların altının çizilmesi gereken büyük bir yere sahip olduğunu, ta'likin şartla bağlı olduğunu ve daima şartla beraber gerçekleştirileceğini ifade etmek gerekmektedir. Çalışmamız giriş, üç bölüm, sonuç ve bazı eklerden oluşmaktadır: Birinci bölümde, ta'likî şartların tanımı, meşruiyeti ve İslam hukukundaki yeri, sıhhat şartları, ta'likî şartların türleri, ta'likî şartların diğer alakalı terimlerle alakası ve ta'likî şartlarla ilgili olan fıkhî kaideler etraflıca açıklanması yer almaktadır. İkinci bölüm iki ana alt başlıktan oluşmaktadır: Birinci alt başlık altında, akdin tanımı, siğa ve etkiler açısından türleri üzerinde durulmuştur. Öncelikle akit genel olarak dörde ayrılmıştır: Müneccez akitler, Mukayyed akitler, Muzâf akitler ve Muallak akitler. Akitlerin her birinden kısaca bahsedilerek muallak akdin hükmü, İslam hukukçularının konuya ilişkin tartışmaları ve şartların gerçekleşmesi durumunda akdin bağlayıcı güçleri detaylı bir şekilde ele alınmıştır. İkinci alt başlıkta, şarta bağlı olan akitlerin bazı klasik örnekleri üzerine durulmuştur. Binaenaleyh yukarıda geçen akitlerde halk arasında yaygın olan iki akitten bahsedilmiştir: Birincisi bey' bi'l-vefâ. Bu bey', tanımlanarak fayda ve zararları açıklanmıştır. İkincisi bey' bi-şarti't-tecrübe. Bu bey' de tanımlanarak gayesi, İslam hukukçularına göre belirli müddeti açıklanmıştır. Ayrıca bu akitlerin sağlam nitelikleri, şeriat ve kanuna göre hükümleri ve en önemli etkileri de ifade edilmiştir. Üçüncü ve son bölüm, bankacılıkta uygulanan ve bazı tartışma ve problemleri içeren akitlerin gelişmesi üzerine olan ta'likî şartların bariz etkilerinin beyan edilmesine tahsis edilmiştir. Söz konusu problemler tespit edilerek şer'î alternatif ortaya koyularak çözüm yolu aranmıştır. İslamî bankacılıkta ilk uygulanan akitler üzerine özellikle bireysel finansta modern murâbaha ve icâre müntehiye bi't-temlik akdi üzerine durulmaya çalışılmıştır. Bu bölüm, söz konusu ta'likî şartın siğası ile ilgili iki önergeyi ihtiva etmektedir: Birinci önerge, modern murâbaha akdinin muallak bey'in siğası üzerine meydan gelmesidir. Örneği, günümüz İslam hukukçularının tartışmalı bağlayıcı vaadin niteliklerini ortaya koymaları ve vaad ile ilgili olan problemlerden sakınmak için buna modern murâbaha akdinde istifade edilmesini gerekli duymaları. İkinci önerge, hükümleri farklı olan iki akdin (bey' ve icâre) tek yer ve tek zamanda ortaya çıkan şüpheyi gidermek için icâre müntehiye bi't-temliğe sağlam ve şer'î bir çıkış yolun meydana gelmesi; ki bu ta'likî şarta binaen ortaya çıkabilir. Böylece bu iki akdin önemli mefhumları ve temel meseleleri detaylıca açıklanmıştır. Sonra bu akitlerle ilgili mevcut olan problemler ve İslam hukukçularının tartışmaları ele alınmıştır. Ayrıca bey' ve hibenin şarta talik etmenin hükmü ve modern murâbaha ve icâre müntehiye bi't-temlikte sunulan önerge (Ta'likî Şartlar) ile ilgili günümüz bilim adamlarının görüşleri, ta'likî şartların siğasının bu iki akdin gelişmesi için şer'î alternatif sunmak için etkileri , ilgili problemlerin çözümü için rolü ve yukarıdaki önerileri açıklayan bazı tatbiki ekler ve şer'î fetvalara başvurularak açıklanmıştır."
