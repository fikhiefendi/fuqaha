abstract: "Seyahatnâmeler, evrensel nitelikteki eserlerdendir. Hem İslam dünyasında hem de diğer kültürlerde bu meyanda çalışmalar yapıldığı görülmektedir. Müslüman seyyahlar bu alanda ziyadesiyle varlık göstermişlerdir. Onlardan ilk akla gelen isim, ülkemizin bir değeri olarak Evliya Çelebi ve Seyahatnâmesi'dir. Ancak Faslı İbn Battûta ondan daha geniş bir coğrafya ve bilgi birikimine sahiptir. Biz de tezimizde İbn Battûta ve eserindeki hadisleri konu edindik. İslam coğrafyasının her bir kesiminde, belki ismi hadis-sünnet olarak bilinmeyen uygulama ve davranışlarla bezenmiş bir hayatın olduğu muhakkaktır. Seyahatnâmeler gibi içinde hadislerden birçok bilginin olduğu çalışmaların incelenmesi, o döneme ait malumatlardan bizi haberdar etmesi açısından önem arzetmektedir. Tezimizde, İbn Battûta'nın Seyahatnâme adlı eserinde geçen hadis kültürüne dair bilgilerin tespiti ve hadis ilmi açısından değerlendirilmesi amaçlanmıştır. Gerek seyahatnâme temelli bilgilendirmelerde gerekse literatür araştırmasında ve hadislerin tahricinde Seyahatnâme sınırları içinde kalınmıştır. İbn Battûta'nın hayatı, kitabını anlama açısından önem arz etmektedir. En başta İbn Battûta'nın hadislere hangi pencereden yaklaştığını tespit etmek için fayda sağlamıştır. Ayrıca hadis değerlendirme ve yorumlama metotlarının tespiti yine hayatının ayrıntılarını bilmekle mümkün olmuştur. Kitapta yer verilen 68 hadisin 48'inin senedin sonu bakımından merfû ve sıhhat bakımından 49'unun sahîh olması dikkat çekmektedir. Her iki sonuç, onun hadis ilmi ile ilgili altyapısının belli bir birikime sahip olduğuna işaret etmektedir. Kitapta 4 mevzû rivayetin olmasına gelince, İbn Battûta'nın uydurma rivayetlere yer vermesini, daha çok mana boyutuna ağırlık vererek kabul ettiği sonucuyla değerlendirmek mümkündür."
