abstract: "Zekat, iktisadî hayatın önemli konularından birisidir. Bu öneminden dolayı da Kur'an'da sıkça zikredilmiştir. Kur'an'da zekattan genel olarak bahsedilmekte olup zekata tabi mallar ayrıntılı bir şekilde açıklanmadığı gibi nisabı hakkında da hiçbir malumat bulunmamaktadır. Zekat nisabı ile ilgili bütün ölçüler hadis kaynaklıdır. Asgari zenginlik sının olarak kabul edilen bu ölçüler, Hz. Peygamber döneminde birbirine denkti ve değer olarak o dönemde normal bir ailenin bir yıllık geçim miktarına tekabül etmekteydi. Bu ölçüler, iktisadî hayatı tarım ve hayvancılığa dayanan toplumlarda uzun yıllar uygulamaya esas alınmıştır. Bu dönemlerdeki iktisadî hayat, vahyin indiği dönemle aşağı yukarı aynı olduğu için nisablarla ilgili önemli bir problem yaşanmamıştır. Sanayi devrimi ile birlikte tarım ve hayvancılık sanayi öncesi toplumlarda ifade ettiği anlamı yitirmiştir. Tarımın yerini sanayinin almasıyla birlikte tarım ve hayvancılık, iktisadî hayatın yegane dayanağı olmaktan çıkıp ikinci sıraya düşmüştür. Bu durum tarım toplumunun iktisadî yapısı dikkate alınarak belirlenen nisablann değerinde bir takım problemlerin ortaya çıkmasına neden olmuştur. Gelinen noktada belirtilen nisablar, zenginlik için bir ölçü olmaktan çıkmıştır. Zekatın nisabı hakkında Kur'an'da hiçbir malumat olmamakla birlikte değişmezliğine dair herhangi bir işaret de mevcut değildir. Bu duruma göre zekatın ruhunu yansıtması bakımından normal bir ailenin bir yıllık geçimi için gerekli olan miktar dikkate alınarak her toplum kendi iktisadî yapısına göre zenginlik için bir ölçü belirleyebilecektir."
