abstract: "Bu tez, fıkıh kavramı ve onun Mecelle formundaki tezahürü ile eleştirel bir şekilde ilgilenir. İnsan çıkmazları metin biçiminde ifade edildiğinde sorunlar ortaya çıkar. Bu konuda fıkıh, Batı'da kavramsallaştırıldığı şekliyle hukuktan daha mı iyidir? Bir fıkıh metni kod olarak alındığında fıkıh paradigması daha mı kötü yönde değişir? Mecelle, tarihin kritik bir noktasında bulunan ilginç bir vakayı sunuyor. Başlangıçta, kavramsal ve felsefi temellerinde fıkhın Batı hukuk paradigmasıyla nasıl karşılaştırıldığını eleştirel bir şekilde araştırıyorum. Daha sonra Mecelle'yi çevreleyen tarihsel koşulların bir paradigma değişikliğini mi yoksa fıkıh geleneğinde bir kırılmayı mı temsil ettiğine dair en uygun soruyu ele alıyorum ve birincisinin temelsiz olduğunu, ikincisinin ise öyle göründüğünü savunuyorum. 4. Bölüm'de, Mecelle'nın yapımını çevreleyen ve onun özü ve biçimi hakkında daha incelikli bir resim sağlayan bazı tarihsel tartışmaları inceliyorum. 5. Bölümde, kanunlaştırma kavramını ele alıyorum ve bu gelişmeyi tetikleyen zorunlulukları araştırıyorum. Bir fıkıh paradigmasının içerdiği buyruklar farklı olduğundan, aynı metnin, modern kanunlaştırma anlayışlarının yaygın olduğu koşullarda ortaya konması durumunda, muhtemelen fıkhın yozlaşmasını göstereceği sonucuna varıyorum. 6-7. Bölümler, fıkıh ve hukukun daha derin bir felsefi karşılaştırmasını ele alıyor, burada bir“boşluk”kavramına değiniyor ve fıkhın ifa edilebilirlikten ziyade keşfe dayalı olduğunu onaylayan fıkıh paradigmasında iki durumda nasıl meydana geldiğini gösteriyorum. Daha sonra, Mecelle gibi bir fıkıh metninin kanunlaştırılmasının, bu paradigmaya uygun olmayan bir roller konfigürasyonu dayatarak fıkıh paradigmasını karıştırdığı sonucuna vararak bu kavramları daha da araştırıyorum."
