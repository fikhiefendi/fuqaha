abstract: "Bu çalışma, İslami finans ürünlerinde fiyatlanma süreci ve bu süreçte kullanılan mekanizmaların araştırılmasını ve analizini ele almaktadır. Aynı zamanda İslami bankalardaki uygulamaları aracılığıyla müşareke mütenakısa ürününün fıkhî bir incelemesidir. Bu çalışmanın temel amacı, İslami finansal ürünlerin fiyatlandırılmasında kullanılan mekanizmaları, özellikle finansal ürünler olmak üzere İslami finansal ürünlerin fiyatlandırılmasına yönelik genel standartları açıklamaktır. Aynı zamanda bu ürünlerin fiyatlanması ile tefeci faiz oranı arasındaki ilişkiyi belirlemektir. Çalışma, tüme varım ve analitik olmak üzere iki yönteme dayanmaktadır. Tüme varım yöntemi, fakihlerin ve İslami iktisatçılarının fiyatlandırma sürecine ilişkin sözlerini ve İslami bankalarda müşareke mütenakısa ürünü için onaylanan uygulamaları takip etmektedir. Analitik yaklaşım ise, fiyatlama konusu ve mekanizmaları hakkında ortaya çıkan fıkhî ve ekonomik görüşleri ve müşareke mütenakısa ürününde fiyatlama sürecini değerlendirmektedir. Bu çalışmada ulaşılan sonuçlardan en önemlisi, İslami bankaların fiyatlamalarının birçoğunda hâlâ tefeci faiz indeksine bağlı olmalarıdır. İslami finans için özel bir indeks bulunmamaktadır. İslama finansta fiyatlama süreci hâlâ net değildir ve bu sürecin daha çok açıklığa kavuşturulması gerekmektedir. Özellikle müşareke mütenakısa ürünü çok fazla çeşitli uygulamalara sahip olduğu için bir fiyatlandırma mekanizması bulunmasını engellemektedir."
