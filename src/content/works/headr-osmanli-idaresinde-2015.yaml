abstract: "Bu araştırma 1800 ve 1850 yılları arasında Şam Vilayeti'nin ekonomik durumu ile ilgilidir. Bu dönemde Şam'ın, üç farklı dönemin özelliklerini taşıdığını görmekteyiz. İlk dönem (1800-1831); Osmanlı fütuhatı ile başlayan Osmanlının geleneksel egemenlik dönemidir. Bu dönemde Şam, yabancıların her türlü etkisine kapalı kalmayı başarmıştı. O dönemde Şam Vilayeti bir Osmanlı vilayeti olmuştu. Şeriat temeline dayanan Osmanlı kanunları uygulanıyordu ve Osmanlı egemenliği çok etkiliydi. Böylece Şam, Avrupalılara karşı kapalı bir alan haline gelmişti. Bu dönemde vergiler, ticaret, fiyatlar incelenerek Şam'ın ekonomik yapısı ve halkın yaşam seviyesi ortaya konulmaya çalışılmıştır. İkinci dönem (1832-1840); Mehmet Ali Paşa'nın egemen olduğu dönemdir. Bu dönemde Şam Vilayeti'ne Mehmet Ali Paşa ve oğlu İbrahim Paşa hükmetmiştir. Yönetim ve ekonomi ile tarım sektörünü (dut ekimi) ve eğitimi etkileyen bir takım reformlar yapılmışsa da, Mehmet Ali Paşa hükümranlığı, Şam halkı ve Osmanlı Devleti için bir felaket olmuştur. İbrahim Paşa'nın Şam'a girmelerine izin verdiği konsoloslar aracılığı ile Avrupa'nın Şam Vilayeti'ne müdahalenin başlangıcı olarak kabul edilmişti. Sonuçta Fransa ve İngiltere'nin eline düşmesine yol açmıştır. Bu durum halk üzerinde olumsuz bir tepki yaratmıştı. Çünkü Avrupalıların Şam'a girmesiyle beraber, yerel halk ticarette olumsuz yönde etkilenmiştir. Üçüncü dönem (1840 – 1850) İbrahim Paşa sonrası dönem, Avrupalıların Şam üzerindeki kontrol dönemidir. Çünkü Mehmet Ali Paşa'nın ilerlemesine karşı Osmanlı Devleti Fransa, İngiltere ve Rusya'dan yardım almıştı. Bunun karşılığında ise tavizler vermek zorunda kaldı. Böylece, Şam ve Asitana'da bulunan konsoloslar devletin kurumlarına, okullarına ve yasalarına müdahale ederek, kontrol altında tutmaya başlamışlardır. İngiltere ve Fransa (1856 Islahat Fermanı) aracılığı ile Osmanlı Devleti'ne İslam hukuku ile bağdaşmayan kendi hukuk ve yasalarını dayatmak istemişlerdir. Bu durum özellikle Şam'da padişahın halk nezdindeki imajını sarsmıştır, saltanat ferman ve emirlerine karşı gelmeye sevk etmiştir."
