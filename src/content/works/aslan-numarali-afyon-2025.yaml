abstract: "Şer'îyye sicilleri tarihin ana kaynaklarından bir tanesidir. İçerdiği belge çeşitliliği ve zenginliği bakımından tarih araştırmacılarının dikkatini çekmiştir. Tarihi bir vak'ayı ya da bir sorunu çözmek için ipucu aranan vazgeçilmez kaynaklar arasında yer almıştır. 500 numaralı Afyon Karahisâr-ı Sâhip Şer'iyye Sicili Defteri, dönemin sosyal, hukuki ve ekonomik yapısına ışık tutan zengin kayıtlar içermektedir. Belgelerde yer alan davalar, taraflar arasındaki ilişkileri ve mahkemenin rolünü ayrıntılı olarak ortaya koymaktadır. Ayrıca sicil, bölgedeki esnaf faaliyetlerinden aile meselelerine kadar geniş bir yelpazede veri sağlamaktadır. İncelenen kayıtlar, Osmanlı vilayetlerinde şer'î düzenin işleyişi hakkında önemli ipuçları sunmaktadır. Hazırlamış olduğumuz bu yüksek lisans tezi H.1054-1055 / M. 1644-1645 yıllarına ait 500 numaralı Afyon Karahisâr-ı Sâhip Şer'îyye Sicili'nin günümüz Türkçesine çevrilerek tanıtılması ve içinde yer alan belgelerin konu ve muhteva bakımından değerlendirilmesinden oluşmaktadır. Bu süreçte belgeye sadık kalıp sistematik bir çözümleme yaparak doküman analizi yöntemini de kullanmak suretiyle verileri bilimsel araştırmaya kazandırdık. Böylece hem tarihî metnin araştırmacıların kullanımına açılmasını sağladık hem de dönemin sosyal, hukukî ve idarî yapısına dair verilerin sağlıklı bir biçimde değerlendirilmesine imkân sunduk. Ortaya çıkan bu çalışma ile şehir tarihçiliğine bir nebze de olsa katkı sağladığımızı düşünüyoruz."
