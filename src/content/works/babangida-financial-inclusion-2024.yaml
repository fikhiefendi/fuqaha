abstract: "Bu tez, Gana'daki kırsal bankacılık operasyonlarında İslami finans ilkelerini uygulamaya koymanın zorluklarını ve fırsatlarını incelemektedir. Kırsal alanlardaki KOBİ'lerin finansal katılımını artırmak için organizasyonel ve işlevsel bir mimari önermektedir. Çalışmada, Ulusal Finansal Erişimi Geliştirme Politikası ve Dijital Finansal Hizmet Stratejisi de dahil olmak üzere çok sayıda veri kaynağı ve politika belgesinin analizi yoluyla, erişim, kullanım, kullanılabilirlik, engeller, İslami finans algıları ve İslami finans tercihleri dahil olmak üzere temel odak alanlarını ortaya konmaktadır. Çalışmanın bulguları, mobil para sektöründe önemli ilerlemeler kaydedildiğini ancak mobil para hesaplarının normal banka hesaplarına dönüştürülmesine ihtiyaç duyulduğunu göstermektedir. Çalışmada, banka hesabı olmayan nüfusa ulaşmada şube genişletmenin, mobil para aracılarının ve dijital araçların önemi vurgulanmaktadır. Cinsiyet, eğitim, coğrafi konum, yüksek faiz ödemeleri, teminat sağlanması ve uygun kimlik bilgilerinin bulunmaması gibi finansal katılımın önündeki engeller tespit edilmiştir. Finansal katılımı artırmak için, KOBİ'lerin hisse senetlerinin daha küçük birimlerde alım satımı için ikincil bir pazarın geliştirilmesinin yanı sıra dijital ürünlerin ve acente bankacılığının kullanılması önerilmektedir. Hükümete, elektronik işlem vergisinin getirilmesi konusunda dikkatli davranması ve finansal eğitim girişimlerini yoğunlaştırması çağrısında bulunulmaktadır. Çalışmada mobil para aracılarının güvenliği vurgulanmakta ve müşterileri dolandırıcılardan korumak için siber güvenlik önlemleri alınması önerilmektedir. Çalışma, kırsal bölgelerdeki ve gecekondu bölgelerindeki savunmasız bireyler için ikinci kademe Müşterinizi Tanıyın (KYC) politikasının uygulanmasını ve yerel kanaat önderlerinin hesap başvurularının garanti altına alınmasını önermektedir. Kredi kullanılabilirliği ve maliyeti de KOBİ'ler için temel kısıtlamalar olarak tanımlanmaktadır. Ayrıca, kredi yönetimini ve dağıtımını iyileştirmek için KOBİ'leri, hükümeti ve bağışçı desteğini içeren konsolide bir yaklaşım önerilmektedir. Tez, KOBİ'lerin karşılaştığı zorlukları ele almak ve Gana'da finansal katılımı teşvik etmek için politika önerileri sunmaktadır. Önerilen girişimler, kredi yönetimindeki darboğazları azaltmayı, yeni kurulan şirketler için sürdürülebilir finansman kaynakları sağlamayı ve finansal kurumlar, KOBİ'ler ve hükümet arasındaki işbirliğini geliştirmeyi amaçlamaktadır. Bu tavsiyelerin uygulanmasının olumlu sonuçlar vermesi ve Gana'nın ekonomik kalkınmasına katkı sağlaması beklenmektedir."
