abstract: "Şâfiî mezhebinin önemli kaynaklarından, imam Şâfiî'nin Müsned adlı eserine yapılmış şerhlerden olan Şerhu'l Müsned Şâfiî mezhebi kaynakları içinde önemli bir yer tutmaktadır. Şerhu'l-Müsned'i telif eden İmam Râfiî ilmi sahalarda daha çok fakih kimliğiyle tanınmaktadır. Biz bu eserde onun fakih kimliğinin yanında muhaddis ve şârih kimliğinin fakih olması kadar ön planda olduğunu ortaya koymaya çalışacağız. Râfiî eserinde hadis ilminin inceliklerini rivayetler çerçevesinde ele alıp işlemektedir. Râfiî Müsned'te yer alan rivayetlerin sıhhat açısından değerlendirmesini yapmış ve hadisleri meşhur hadis kaynaklarından rivayetlerle destekleyerek hadislerin muteber sahih rivayetler olduğunu ortaya koymaya çalışmıştır. Ayrıca rivayetlerin künhüne vakıf olmak ve Şârî'nin rivayetlerdeki maksadını anlamak için fıkhi istinbat metotlarını kullanmaktadır. Râfiî sened ve metin açısından rivayetlerin tahlilini yapmaktadır. Sened tahlilinde râvîleri detaylı bir şekilde cerh-ta'dil yöntemlerini kullanarak tespit etmektedir. Rivayetlerin sened ve metninde bilinmeyen kelimeleri tahlil etmekte ve gerekli açıklamaları yapmaktadır."
