abstract: "Mahmûd b. Süleyman el-Kefevî'nin Ketâib adlı eserinin Şemsüleimme Halvânî ile başlayıp Fahrüddîn Kâdıhân'a kadar olan 7-10. Ketîbelerinin tahkikini yaptığımız bu çalışma tarihsel olarak Hanefî Mezhebi'nin etki otoritesinin Mâverâünnehir'e kaydığı ve Mâverâünnehir ekolünün teşekkül etmeye başladığı bir buçuk asırlık ilk dönemine rastlamaktadır. Bazı değerlendirmelere göre çalıştığımız biyografilerden ilki olan Şemsüleimme Halvânî ile birlikte mezhebin müteahhirûn dönemi başlamaktadır. Çalışmamızın dirase kısmı 4 bölüme ayrılmıştır. Birinci bölümde müellifin ve eserin tanıtımı konu edilmiştir. İkinci bölüm eserin en önemli özelliklerinden biri olan ilmî silsilelerin eserin metodolojisine etkisi örnek silsile incelemeleri ile tablo ve şemalarla desteklenerek incelenmiştir. Üçüncü bölümün başında çalışmanın Mâverâünnehir havzası ile ilişkisi kurulmuş ardından 7-10. Ketîbelerde işlenen biyografiler dinamik bir metotla ortak özelliklerine göre kategorileştirilerek tanıtılmıştır. Dördüncü bölümde ise biyografileri işlenen fakihlerin ürettikleri eserler ile biyografilerinde yer alan fetva örneği ve fıkhi görüşlerin zikredilme sebeplerine değinilmiştir. İşlenen konular çerçevesinde eserin içerik ve metodu açısından detaylı tanıtımı ile Mâverâünnehir Hanefî ekolünün teşekkül döneminin ortaya konulması amaçlanmıştır."
