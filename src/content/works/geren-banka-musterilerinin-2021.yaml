abstract: "Katılım bankacılığı, temelinde İslam dininin yasaklamış olması sebebiyle faizsizlik prensibine dayanmakta ve İslami Bankacılık olarak da adlandırılmaktadır. Faizsiz işlemlere yönelik çalışan ve reel sektöre dayanan bir finansal sistem barındırdığından adil, sosyal ve ahlaki boyutları bulunmaktadır. Bu yönüyle sadece İslam dünyasında değil, dünyanın bütününde uygulanabilir bir sistem olduğunu vurgulamak gerekir. Faiz gelirinden uzak durmak isteyenlerin atıl durumda bulunan fonları hem genel ekonomi açısından hem de tasarruf sahipleri açısından bir kayıptır. Bu kayıpları önlemek ve yabancı ülke fonlarını ülkemize çekebilmek amacıyla katılım bankaları kurulmuştur. Bu kapsamda ülkemizde Özel Finans Kurumları (ÖFK)'nın kurulabilmesi için 1983 yılında faaliyet izni verilmiştir. Yasal zemin hazırlandıktan sonra Türkiye'de ilk olarak 1984 yılında kurulan Albaraka Türk Özel Finans Kurumu 1985 yılında faaliyete geçmiştir. Rekabetin yoğun yaşandığı bankacılık sektöründe müşteri algısı, güven, bilinirlik, finansal bilgi düzeyi banka tercihlerinde önemli rol oynamaktadır. Katılım bankaları da pazar paylarını artırmak için mevcut portföylerini koruyarak yeni müşteriler kazanmayı hedeflemektedir. Mevcut ve potansiyel müşterilerin katılım bankacılığı hakkındaki düşüncelerini ve banka tercih nedenlerini öğrenerek etkin ve verimli stratejiler geliştirilebilmektedir. Bu çalışmanın amacı Samsun ilindeki banka müşterilerinin katılım bankacılığı hakkındaki algılarını, demografik sorularla birlikte 16 maddeden oluşan bir anket uygulaması ile ölçmektir. Aynı zamanda katılım bankası ve konvansiyonel banka müşterilerinin katılım bankacılığı ve konvansiyonel bankacılıkla ilgili finansal bilgi düzeyleri, hangi bankalarla daha yoğun çalıştığı, banka tercih sebepleri, katılım ve konvansiyonel bankacılık arasındaki farklılıkları bilip bilmedikleri, faizsiz bankacılıkla ilgili düşünceleri hakkında bilgi sahibi olmaktır. Bu çalışmada 28 hipotez kurulmuş olup 4 farklı analiz uygulanmıştır. Bunlar güvenilirlik analizi, faktör analizi, karşılaştırma analizi ve korelasyon analizidir. Analizler sonucunda katılım bankacılığı algısının düşük olduğu, yeterince bilinmediği gözlenmiştir. Katılımcılarının bir kısmının katılım bankalarını ve uygulamalarını ve konvansiyonel bankalardan farkını bilmediği anlaşılmıştır. Bunun yanında konvansiyonel banka müşterilerinin de bankacılık ürünlerinden yeteri derecede bilgi sahibi olmadığı da yapılan tespitler arasındadır."
