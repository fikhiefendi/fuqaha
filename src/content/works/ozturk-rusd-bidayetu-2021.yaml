abstract: "Bu çalışmada, İbn Rüşd'ün Bidâyetü'l-müctehid ve nihâyetü'l-müktesid adlı eserinin oruç kitabında yer alan hadisler Muhtelifü'l-hadîs açısından inceleme konusu yapılmıştır. Bu çerçevede on yedi farklı mesele ele alınmıştır. İbn Rüşd'ün söz konusu meselelerle ilgili birbirine zıt manada getirmiş olduğu rivayetler ve bu rivayetlerle ilgili vermiş olduğu bilgiler değerlendirilmiştir. Rivayetler incelenirken, temel hadis kaynakları, hadis şerh eserleri ve müdellel (delillendirilmiş) fıkıh eserleri kaynak olarak kullanılmıştır. Tez çalışmamızda nitel araştırma yöntemleri kullanılmış olup muhtelifü'l-hadîs kapsamına giren hadisler tespit edilmiştir. Sonrasında ilgili hadisler, dökümantasyon yöntemiyle kayıt altına alınmıştır. Elde edilen veriler analiz yöntemiyle incelenerek bir sonuca ulaşılmaya çalışılmıştır."
