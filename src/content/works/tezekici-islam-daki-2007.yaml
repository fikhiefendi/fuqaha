abstract: "Bu tez İslamdaki temel ibadetlerin ahlâkî boyutunu incelemeyi hedeflemektedir. İslam'da ibadetlerin çok geniş bir konu olması nedeniyle, araştırmanın sıhhati açısından çalışma temel ibadetler olan namaz, oruç, zekât ve hacla sınırlandırılmıştır. İslamın beş temel prensibi burada her yönüyle anlatılmamıştır. Buna bu safhada gerek olmadığı gibi imkan da yoktur. Burada sadece İslâm'daki bu temel ibadetlerin ahlâkî yönüne ağırlık verilmiştir. Bunu yaparken tabiatıyla bu prensiplerin tariflerine de işaret edilmiştir. Araştırma, altı bölümden oluşmaktadır. Birinci bölümde araştırmanın amacı, konusu, önemi hakkında bilgi verilirken ikinci bölümde ibadet ve ahlâk hakkında kısaca bilgi verilmiştir. Üçüncü bölümde namaz ibadetinin tanımı, önemi, etkisi, muhtevası ve ahlâkî boyutu ele alınmış, namazın vicdan, tevbe, şükür-vefa, sabır, diğerkâmlık, alçakgönüllülük ve doğruluk dürüstlük ilişkisi ortaya konulmuştur. Dördüncü bölümde, zekât; beşinci bölümde oruç; altıncı bölümde hacc ve ahlâkî boyutu üzerinde durulmuştur."
