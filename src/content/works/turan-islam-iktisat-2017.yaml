abstract: "Zekât İslam'ın ana esaslarından biri olarak kurumsal bir uygulamaya sahiptir. Tarihte zekât uygulamaları çeşitli evrelerden geçmiş ve zaman zaman ihmal edilmiştir. Günümüzde bir kısım İslam ülkeleri zekât uygulamalarını kendi içyapılarına göre yeniden düzenlemişlerdir. Zekâtın devlet eliyle yürütülmesi gereken bir uygulama olması ve iktisadın konusu olmasından dolayı iktisat politikaları altında ele alınmalıdır. Bu çalışmada zekâtın kurumsallaşması İslam iktisat siyaseti açısından incelenmiştir. İslam'ın iktisat politikalarına, zekâtın ahkâmına, zekâtın tarihine ve mevcut uygulamalara değinildikten sonra İslam iktisat siyaseti açısından zekâtın kurumsallaşması“zekât politikası”ile kavramsallaştırılmıştır. Zekât politikasının temel amacı Allah'ın emrini yerine getirerek adil bir dünya inşa etmektir. Zekât politikasının en büyük aracı ise bir zekât kurumudur. Dünya küresel gelir ve servet eşitsizliği krizinde olduğu için zekât politikasının uygulanması zaruri bir ihtiyaç haline gelmiştir. Geleneksel iktisadın adil bölüşüm politikasızlığına karşın İslam iktisadı zekât politikasını adil bölüşüm için en müessir çare olarak sunmaktadır."
