abstract: "Temel yaşam gereksinimlerinden biri olan uyku, bilinci doğrudan etkileyen bir durum olduğu için ehliyet arızalarından sayılmış ve gerek fıkhın usûl dalında gerekse fürû dalında üzerinde önemle durulmuştur. Dilimizde İslam Hukuku alanında yapılan çalışmalarda, uyku ile ilgili konulara farklı bahislerde dağınık olarak değinilmiştir. Uykunun hükümlere etkisine dair derli toplu Türkçe bir çalışma bulunmamaktadır. Bu tez, bilinç basamaklarından biri olan uykuyla ilgili hükümleri, çeşitli fıkıh kaynaklarından derleyerek bir araya getirmek, farklı görüşleri karşılaştırmak ve belirli bir düzen içinde günümüz insanına sunmak amacıyla yapılmış bir çalışmadır. İslam hukukuna göre ehliyet arızalarından sayılan uyku, kural olarak kişiden dini ve hukuki sorumluluğu kaldırır. Çünkü din ve hukuk, bilinçli ve irade sahibi kimseyi muhatap alır. Bu prensibe göre, uyuyanın Allah'a karşı sorumluluğu olmamalıdır. Aynı şekilde cezai yaptırımlar noktasında ayrıcalıklı olması beklenir. Buna karşılık uyuyan kimse, kul haklarından yani başkalarına verdiği maddi zarardan sorumlu tutulur. Örneğin kişinin uykusunda yuvarlanıp bir başkasının malına zarar vermesi durumunda o malın tazmini gerekmektedir. Yine uyuyan kimse, uykusundaki hareketiyle birinin v ölümüne yol açarsa, diyet denilen maddi tazminatı ödemekle mükelleftir. İslam hukukunda üçüncü şahsın uykusu da ele alınmış ve değerlendirilmiştir. Eşlerin yanında bulunan kimsenin uyuyor olmasının sahih halvetin oluşmasına mâni olup olmadığının tartışılması buna bir örnektir. Tezimiz üç bölüme ayrılmıştır. Birinci bölümde uyku ve ehliyet kavramları açıklanmıştır. İkinci bölümde, uykunun ibâdâta etkisi genel başlığı altında özellikle uykunun taharet, namaz, oruç, hac, kurban ve yeminlere etkisi ele alınmıştır. Üçüncü bölümde ise, uykunun muamelat, münâkehât ve ukûbâta etkisi genel başlığı altında, alışverişte muhayyerlik, ikrar, nikâh, boşanma, süt emzirme, başkasının malına veya canına zarar verme konuları üzerinde durulmuştur. Ayrıca modern hukukta uyumanın yasak olduğu durumlar ve uyurgezerlik konularına yer verilmiştir."
