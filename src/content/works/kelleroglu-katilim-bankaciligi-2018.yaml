abstract: "İslam dininde faizin yasak olması; müslüman ülkelerde alternatif bir bankacılık sisteminin kurulmasını gerekli kılmıştır. Geleneksel bankalara alternatif kuruluşların olmayışı, tasarrufların altın, döviz ve gayrimenkul gibi banka dışı yollara kaymasına ve kaynakların atıl kalmasına neden olmuştur. Bu bağlamda, faizsizlik prensibine göre işleyen, halkın elindeki tasarrufları ekonomi içerisine kanalize ederek, ülke kalkınması için ihtiyaç duyulan sermayeye ek kaynak sağlayan finansal kuruluşlar hem Türkiye hem de diğer İslam ülkelerinde kurulmaya başlanmıştır. Faizsiz Bankacılık, İslami Bankacılık veya Türkiye'de kullanılan ismiyle Katılım Bankacılığı; dini sebeplerle faizden uzak kalmak isteyen kişilerin, finansman ihtiyaçlarını karşılamaları, tasarruflarını değerlendirmeleri ve modern bankacılık hizmetlerinden yararlanmaları amacıyla, faizle çalışan geleneksel bankalara alternatif olarak kurulan finansal kuruluşlardır. Günümüzde İslam ülkeleri ile birlikte tüm dünya ülkelerinde hızla yaygınlaşan ve büyüme trendi gösteren Katılım Bankacılığı, kamusal sermayeli Ziraat Katılım ve Vakıf Katılım Bankalarının da Türk Finans sektörüne girmesiyle birlikte, sektörün büyüme hızı artmış ve geleneksel bankalarla rekabet edebilir bir seviyeye gelmiştir. Şu an itibarıyla;Albaraka Türk, Kuveyt Türk, Türkiye Finans, Ziraat Katılım ve Vakıf Katılım olmak üzere beş farklı finansal kuruluş faizsiz bankacılık faaliyetlerine devam etmekte olup, yakın bir gelecekte sektöre farklı finansal oyuncuların girmesi beklenmektedir."
