abstract: "Bu çalışmada, İmam İbn Cüzey el-Kelbî'nin ahkâm âyetlerini tefsir etme yönteminin analiz edilmesi amaçlanmaktadır. Bu amaç doğrultusunda, onun bu âyetleri ele alırken uyguladığı adımlar ve kullandığı yöntem incelenerek yaptığı çalışma ayrıntılı olarak ele alınmıştır. Kanaatimizce, ahkâm âyetlerinin fıkıh âlimleri için hüküm istinbatında temel referans olması nedeniyle, müfessirlerin ahkâm âyetlerine dair yöntemlerinin iyi anlaşılması gerekmektedir. Araştırmanın değeri bu nokta-i nazardan takdir edilmelidir. Bu araştırma, İbn Cüzey'in ahkâm âyetlerindeki yöntemini ve Endülüs okulundaki yerini ortaya koymayı, tefsir ve fıkıh ilmine olan katkılarını ve bu iki alandaki eserlerini açıklamayı hedeflemektedir. Bu araştırma, İbn Cüzey'in Endülüs tefsir okuluna mensup bir Maliki fakihi olarak ahkâm âyetlerinde yer alan fıkhi meseleleri ele alış biçimini incelemesi bakımından önemlidir. Bu amaç doğrultusunda çalışmada, temelde bilimsel malzemeyi takip etme ve toplamaya dayanan tümevarım yöntemi kullanılmıştır. Bu yöntemle, öncelikle“et-Teshîl Li'Ulûmi't-tenzîl”adlı eserinde yer alan ahkâm ayetleri incelenmiş, ardından İbn Cüzey'in ahkâm ayetlerini yorumlamada kullandığı yöntemi kavramak için analitik yönteme başvurulmuştur."
