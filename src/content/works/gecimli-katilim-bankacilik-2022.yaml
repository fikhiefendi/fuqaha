abstract: "Sürdürülebilirlik, gelişen teknoloji ve buna bağlı olarak artan endüstriyel faaliyetler sonucunda çevreye yönelik kaygıların artması ile ortaya çıkan bir kavramdır. Gelecek nesillere yaşanabilir ve sürdürülebilir bir dünya bırakılması için sürdürülebilirlik, önemini her geçen gün artırmaktadır. Bu çalışmada, Türkiye'de faaliyet gösteren altı katılım bankasının raporlarında sürdürülebilirlikle ilgili faaliyet ve yaklaşımların belirlenmesi amaçlanmıştır. İçerik analizi yöntemiyle raporlar incelenmiş, Birleşmiş Milletler'in sürdürülebilirlik hedefleri kriter olarak kullanılmıştır. Çalışma sonucunda Türkiye'deki katılım bankalarının sürdürülebilirlik konusundaki faaliyetlerinin hangi BM hedefleri ile uyumlu olduğu ortaya konulmuştur."
