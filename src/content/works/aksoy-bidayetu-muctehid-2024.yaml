abstract: "İbn Rüşd, aile geleneğini sürdürerek Malikî mezhebiyle ilgilenmiş ve kadılık yapmıştır. Kadılık yapmasından fıkhî bilgisinin de oldukça geniş ve derin olduğunu anladığımız İbn Rüşd'ün günümüze ulaşan fıkıh eseri Bidâyetü'l-Müctehid ve Nihâyetü'l-Muktesid'dir. Bu eser karşılaştırmalı bir İslâm hukuku eseri olup İbn Rüşd'ün fıkıh usulü anlayışına dair bazı yorumlamalar yapmamıza da imkân tanımaktadır. Bu çalışmada dikkatimizi vereceğimiz kısım icmâ'a dair hükümlerdir. Bidayetü'l- Müctehid ve Bihâyetü'l-Muktesid eserinde İbn Rüşd'ün hakkında icmâ' olduğunu iddia ettiği hükümleri analiz edip, İbn Rüşd'ün icmâ' edilen konulara yaklaşımını ve bu konulardaki değerlendirmelerini inceleyeceğiz. Bu değerlendirmeler ışığında İbn Rüşd'ün icmâ' anlayışını tespit edeceğiz. İbn Rüşd'ün icmâ' teorisi yaklaşımını daha net anlaşılmasını sağlamanın yanında icmâ iddiası taşıyan hükümlerin diğer mezheplerde sağlaması yapılarak icmâ'ın gerçekleşip gerçekleşmediği de çalışmanın amaçları arasındadır."
