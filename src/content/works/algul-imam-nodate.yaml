abstract: "Bu çalışma, aile hukukuna dair meselelerde İmam Muhammed b. el-Hasan eş-Şeybânî'nin benimsediği usûlî ve içtihadî ilkeleri tespit etmeyi hedeflemektedir. Söz konusu tespitler, Şeyhayn ile ihtilaf ettiği konular merkeze alınarak gerçekleştirilmiş; böylece kendine özgü yöntem ve yaklaşımların daha belirgin şekilde ortaya konulması amaçlanmıştır. Çalışma giriş ve iki bölümden oluşmaktadır. Birinci bölümde, İmam Muhammed ile Şeyhayn'ın ihtilaf ettiği aile hukuku konuları tek tek ele alınmış; tarafların görüşleri, delilleri ve dayandıkları gerekçeler sistematik biçimde incelenmiştir. Ayrıca her bir meselede Hanefî mezhebinde müftâ bih kabul edilen görüş ile diğer üç sünnî mezhebin tercih ettiği hükümler tespit edilmeye çalışılmıştır. İkinci bölümde ise, birinci bölümde ortaya konulan veriler esas alınarak İmam Muhammed'in Şeyhayn'dan ayrıldığı noktalarda etkili olan saikler değerlendirilmiş ve onun aile hukukuna dair içtihatlarında gözettiği ilkeler belirlenmeye çalışılmıştır. Bu bağlamda özellikle, hadisi kıyasa önceleme, lafzın zahirini alma, ihtiyatlı olanı tercih etme ve fukahanın ihtilafını dikkate alma ilkelerinin içtihatlarında belirgin rol oynadığı görülür. Söz konusu ilkelerin tespitinin ardından, birinci bölümde ele alınan ihtilaflı meseleler günümüz Türkiye'sinin şartları bağlamında yeniden değerlendirilmiş; bu meseleler hakkında bugün nasıl hüküm verilebileceği meselesi ele alınmıştır. Çalışmanın sonunda ise, tespit edilen ilkeler ışığında, İmam Muhammed'in günümüzde aynı konulara nasıl hükmedebileceğine dair öngörülere yer verilmiştir."
