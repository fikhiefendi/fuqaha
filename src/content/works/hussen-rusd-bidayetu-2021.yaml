abstract: "Bu çalışma, Mâlikî mezhebinde etkileyen büyük alimlerden biri olan İbn Rüşd'ün hakkında bir araştırma yapmayı amaçlanır. Bundan dolayı onun eseri olan 'Bidayetü'l müctehid – Kitâbü`l-Hac'ta Mâlikîler namına aktardığı görüşler, Mâlikî mezhebinde tercih edilen görüşler ile uyumluluğunu göstermek için bahsettiği meseleleri araştırıldı. Öyle ise tercih edilen görüşlere varmak için, konumuz olan meseleler Mâlikî kitaplarda taraması yapıldı. Bu araştırma giriş, ön hazırlık, iki ana bölüm ve sonsözden oluşmaktadır. Ön hazırlık bölümü de üç konusu vardır. Sırası ile İbn Rüşd'ün biyografisi, onun eseri olan Bidayetü'l müctehid kitabı tanıtımı, Mâlikî mezhebi tanıtımı ve gelişim aşmalarıdır. Birinci ana bölüm ise, hac ve umre meseleleri, haccın kime farz kılındığı, haccın zamanı ve türlerini içerir. Bu bölümde toplam on bir mesele vardır. İkinci ana bölüm ise ihram şartları, ihram esnasında yasaklanan elbise, koku ve fiiller gibi ihram ile ilgili meseleleri araştırıldı. Bu bölümdeki meselelerin sayısı on beştir. Ayrıca her meseleye dair kısa bir açıklama ve bütün mezheplerdeki meseleye dair ihtilafı içeren bir bölüm bulunduruldu. Ardından İbn Rüşd'ün kitabında aktardığı görüşü sunup Mâlikî kitaplardan Mâlikî İmamların görüşü ile uyumluluğu araştırıldı. Son olarak, bu araştırmanın sonucunu göstermekle araştırma sonlandırıldı."
