abstract: "Kuran-ı Kerim'in Yüce Allah tarafından insanlara rablerini nasıl tanıyacaklarını ve ona nasıl kulluk edeceklerini gösteren bir hidayet kaynağı olarak gönderilmiş olması, onu okumayı, anlamayı ve davranışları ona göre düzenlemeyi gerektirmektedir. Kuran-ı Kerim'in dili Arapçadır. Her dil gibi o da değişim ve gelişim göstermiştir. Kuran-ı Kerim kullandığı kelime ve kavramlara yeni anlamlar yükleyerek onları özel bir konuma taşımıştır. Böylece Kur'an yeni bir düşünce tarzı ve yeni bir hayat modeli getirmiştir. Kuran-ı Kerim indirilişinin ilk zamanlarında tezekki kavramını kullanmış, insanları bu eylemi gerçekleştirmeye davet etmiştir. Daha sonraki aşamalar“tezekki”nin bir alt kavramı olarak onu bina etme görevi görmüşlerdir. Dolayısıyla“tezekki”bazı temel kavramların oluşturduğu bir üst kavramdır. Felah-iflah eylemi ile sık sık beraber kullanılan“tezekki”kavramı dünya hayatını anlamlandırarak, ebedi olan ahiret hayatında kurtuluşu hedef almıştır. Kendi nefsini tezkiye etmeyen, onu ihmal ve itlâf eden insanı sonsuz hayatta hasret, nedamet ve ebedi hüsran beklemektedir. Zamanla her kavram kendine özgü bir anlayışla ele alınırken kişinin ferdi hayatıyla bu denli alakalı olan tezekki kavramı arka planda kalmıştır. Böylece fikri yapı parçalanmış, asıl kavram da bağlamından uzak elemanlarla izah edilmeye başlamıştır. Biz çalışmamızda“tezekki”nin dil ve istılahi anlamlarından hareketle insan hayatının neresinde ve nasıl yer aldığını tespit etmeye çalıştık. Bu çalışmanın,“tezekki”kavramının biraz daha ön plana çıkmasına ve önemli saydığımız bir konunun daha iyi anlaşılmısına katkı sağlayacağını ümit etmekteyiz."
