abstract: "Katılım bankalarının unvanlarındaki katılım kelimesi kar ve zarara katılma prensibine dayalı bir bankacılık sistemi olduğunu vurgulamaktadır. Katılım bankalarının ayırt edici özelliklerinin başında faize yer vermemeleri gelmektedir. Yani bu bankalar elindeki kaynaklara faiz ödemezler. Yapılacak her yatırım İslam çerçevesi içinde olacağından ahlaki ve insani değerlere saygılı olarak yapılmaktadır. Katılım bankaları bir malın ve hizmetin değerini ahlaki yönden ülke ekonomisi ve müşterilerinin çıkarlarını gözettikten sonra değerlendirerek finansman sağlamaktadır. Katılım bankacılığının daha ileriye taşınması, tüm bankacılık sektöründeki payının artırılması, yeni nesil ve çağın gereklerine uygun çözüm ortağı olabilmesi için müşterilerinin beklenti, görüş ve tercih önceliklerini dikkate alması gerekmektedir. Bu çalışma katılım bankalarının müşterileri tarafından tercih edilme nedenleri ve memnuniyet düzeylerini anlayabilmek üzere yapılmıştır. Araştırma Trabzon ilinde faaliyet gösteren Katılım Bankaları müşterilerine anket çalışması uygulanarak yapılmıştır. Araştırma sonucunda müşterilerin; banka personelinin tutum ve davranışları, servis/hizmet kalitesi, güvenilirlik, banka personelinin ilgi ve beceri düzeyi, faizsizlik prensibi nedenlerden dolayı katılım bankalarını tercih ettikleri sonucu ortaya çıkmıştır."
