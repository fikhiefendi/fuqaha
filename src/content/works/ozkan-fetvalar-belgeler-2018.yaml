abstract: "Bu çalışmada 16. yüzyılda Kuzeybatı İran'da ortaya çıkan ve Anadolu'daki taraftar kitlesini çok kısa bir sürede oldukça başarılı bir şekilde artırmayı başaran Şii-Safevi dini-politik hareketi ile Sünni-Osmanlı merkezi yönetimi arasındaki çatışmanın nedenleri arşiv belgeleri üzerinden tahlil edilmiştir. Çalışmamızda görüleceği üzere Osmanlı belgelerinde hem Safeviler hem de Anadolu'daki Türkmen zümreler Kızılbaş olarak adlandırılmıştır. Konu ile ilgili ülkemizde ve dünyanın farklı yerlerinde birçok çalışma yapılmış, çok sayıda eser ortaya konulmuştur. Ancak bu çalışmaların istisnaları olmakla beraber geneli, ideolojik olarak ve birazda günümüz değer ve yargılarıyla Kızılbaşlığın ezilen halkın, Sünniliğin ise ezen ve sömüren yöneticilerin din anlayışı olduğu tezini savunmaktadır. Ortaya konan çalışmaların birçoğunda Osmanlıların dini alandaki hassasiyeti ve meseleye bakışı onların gözünden irdelenmemiş konu siyasi, ekonomik ve sosyal açılardan tahlil edilmekle yetinilmiştir. Ancak bu çalışmada Kızılbaşlık meselesine herşeyden önce Osmanlı gözüyle bakılmaya çalışılmıştır. Yine bu çalışmada Osmanlının Ehl-i Sünnete muhalif olan görüşlere karşı neden bu kadar tavizsiz olduğu ve bu tepkisinin altında yatan nedenlerin neler olduğu sorgulanmıştır. 16. yüzyılın hemen başlarında patlak veren Kızılbaşlık hadisesi karşısında üretilen fetva, risale vb. kaynak eserlerde niçin bu kadar sert tepkiler verildiği Osmanlı ilmi, zihni ve resmi ideolojisinin kökenleri üzerinden teker teker irdelenerek sorgulanmış hadisenin nedenleri bir bütün olarak resmedilmeye çalışılmıştır."
