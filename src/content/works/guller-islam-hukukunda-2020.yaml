abstract: "“Çocuk işçiliği”çocukları eğitimlerinden alıkoyan ve onların maddi ve manevi varlıklarına zarar veren ve toplumların geleceğini karartan sosyal bir olgudur. Öte yandan günümüz çocuk hukukunda çocuğun çalışmasına, mesleki formasyon ve kabiliyetleri geliştirmesi bakımından olumlu bakılmakta ve“çalışan çocuk”kapsamında ele alınmaktadır. İslam Hukukunda“neslin muhafazası”ilkesi doğrultusunda nafaka sorumlusu olan kişiler belirlenerek, çocuğun geçimi teminat altına alınmış ve çocuğun eğitimine engel olacak işçilik faaliyetleri yasaklanmıştır. Bununla birlikte, temel eğitim kapsamında görülen mesleki bilgi edinebilmesi ve gelecekteki sorumluluklarına hazırlanabilmesi için iş hayatında rol verilebileceği, belli kayıtlarla kabul edilmiştir. Çocuğun iş hayatında istihdam edilmesi veli veya vasilerin gözetimi altında olması şartıyla meşru görülmüştür. Belirli koşullar ve kayıtlarla çalışması kabul edilen çocuğun istismar ve ihmaline yol açabilecek su-i istimaller yasaklanmıştır. Bizzat Hz. Peygamber (s.a.v.) tarafından çocuğa bazı yetiştirici sorumluluklar veril-miş, Osmanlı uygulamasında da ahilik teşkilatı bünyesinde çocuk, eğitimi için çalıştırılmıştır. Hatta çocuğun ibadet, ceza, aile, hukuki ve mali olmak üzere bütün işlemlerinde tam ehliyet sahibi olabilmesi ve çocukluk döneminin tamamen sona erebilmesi için gerekli görülen reşit olma vasfını kazanmasında, çalışma hayatında lehine olan işlemleri gerçekleştirebiliyor olması, bir ölçü olarak kabul edilmiştir. Böylelikle İslam Hukuku uygulamasında çocuk işçiliği, çocuğu eğitiminden alıkoyan değil, çocuğun gelişimine katkı sağlayan bir eğitim süreci olarak ortaya çıkmıştır."
