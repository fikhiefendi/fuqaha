abstract: "Osmanlı Devleti'nde merkezî yönetim ile taşra arasındaki ilişkilerin ve adalet mekanizmasının işleyişinin anlaşılmasında ahkâm defterleri önemli bir kaynak niteliği taşımaktadır. Bu defterler, toplumda ortaya çıkan hukuki, idarî ve ekonomik sorunların merkezî otoriteye intikalini ve bu sorunlara getirilen çözümleri yansıtması bakımından dikkat çekicidir. Bu çalışmada, IV Numaralı Maraş Ahkâm Defteri'nde yer alan ve Malatya'ya gönderilen hükümler transkribe edilerek içerik bakımından değerlendirilmiştir. Araştırmanın temel amacı, söz konusu hükümler aracılığıyla Malatya ve çevresinin XIX. yüzyılın ilk yarısındaki sosyo-ekonomik ve idarî yapısını ortaya koymaktır. Araştırmada nitel araştırma yöntemi benimsenmiş olup, arşiv belgelerinin transkripsiyonu gerçekleştirilmiş ve elde edilen veriler içerik analizi yöntemiyle incelenmiştir. İncelenen hükümler; eşkıyalık ve gasp olayları, vergi meseleleri, miras davaları, vakıf meseleleri, alacak-verecek ilişkileri, toprak ve mülkiyet ihtilafları ile diğer idarî ve sosyal konular şeklinde sınıflandırılmıştır. Elde edilen bulgular, bölgede en sık karşılaşılan problemlerin vergi tahsilinde yaşanan aksaklıklar, haksız vergi talepleri ve toprak gelirlerine yapılan müdahaleler olduğunu göstermektedir. Bunun yanı sıra eşkıyalık faaliyetleri, vakıf gelirlerinin yönetimi, miras paylaşımı ve bireyler arası ekonomik anlaşmazlıklar da önemli yer tutmaktadır. İncelenen hükümler, Osmanlı Devleti'nde halkın şikâyetlerini merkezî yönetime iletebildiğini ve bu şikâyetlerin hukuki çerçevede değerlendirilerek çözüme kavuşturulduğunu ortaya koymaktadır. Bu yönüyle çalışma, IV Numaralı Maraş Ahkâm Defteri'nin transkripsiyonunu sağlayarak literatüre katkı sunmakta ve Osmanlı taşra yönetimi ile hukuk sistemine dair önemli veriler ortaya koymaktadır. Ayrıca, ahkâm defterlerinin Osmanlı sosyal ve ekonomik tarihinin anlaşılmasında temel kaynaklar arasında yer aldığı bir kez daha teyit edilmektedir."
