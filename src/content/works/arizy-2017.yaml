abstract: "Bu karşılaştırmalı usul araştırması İbn Sübkî'nin Cemʻu'l-Cevâmiʻ adlı eserinde bulunan ve ez-Zelmî tarafından usûl hataları olarak görülen on dört usûlî görüşü tartışmaktadır. Birinci bölümde araştırmamızın konusu olan her iki âlimin hayatını inceledik ve onların ilmî yetkinliklerini ve ilimlerdeki uzmanlıkları bilmek adına kitaplarından bir nebze sunduk. İkinci bölümün İslam fıkıh tanımıyla ilgili olan birinci başlığında fıkhın şer'i hükümlerin toplamı olduğunu sadece onları bilmekten ibaret olmadığını ispat ettik. (İbn Sübkî'nin hicrî VIII. asırdan önce seçtiği tanım kendi dönemine göre sahih bir tanımdır) İbn Sübkî'nin şer'i hüküm tanımının kapsayıcı olmadığını delillendirdik. Çünkü İbn Sübkî tanımda“teklif”sözcüğünü zikretmiş fakat“vazʻ”sözcüğünü zikretmemiştir. Ayrıca el-Zelmî'nin azîmet ve ruhsat konusunda zikretmiş olduğu tebdîl sözcüğü tağyîr sözcüğünden daha sahihtir. ez-Zelmî'nin İbn Subkî'nin el-âm tarifine yapmış olduğu itirazın yerinde olduğu tespit ettik. Çünkü âm sözcüğü hem aklî hem de örfi âmı kapsamaktadır. Aynı şekilde tahsîsin âmın değil de âm hükmünün bazı efradına kasrından ibaret olduğu tespit ettik. İbn Sübkî'nin“Mutezile aklı hakem kılmıştır”sözünün hatalı olduğunu da tespit ettik. Çünkü Mutezile Allah'ın dışında hiç kimseyi hakem kılmamaktadır. Üçüncü bölüm İbn Sübkî'nin eserinde zikretmediği geçmiş şeriatların neshini ele almaktadır. ez-Zelmî'nin Kur'an'ın ahad sünnetle nesih olunmayacağının ve mütevatir hadisle de böyle bir şeyin vaki olmadığının delillerini ispat ettik. Yine ez-Zelmî'nin şer'i hükümler, içerisinde haberi hükümleri barındırmaktadır dolayısıyla şer'i hükümlerin mutlak olarak nesh edilebilir sözü doğru değildir görüşünü ve ayrıca İbn Sübkî'nin Kur'an'ın kıyas ile nesh edilebilir sözünün yanlışlığını da ispat ettik. Mensûh bakımından Kur'an'ın nesh kısımları meselesi ele alınmış ve orada ez-Zelmî'nin mensûhun hazfedilmesi şartıyla Kur'an'ın Kur'an ile sadece tilavet ve hüküm açısından nesh edilebilir görüşünün sıhhatini tespit ettik. Aynı şekilde ez-Zelmî'nin makîs ve makîsun aleyh arasındaki müşterek illet daima eşit değildir sözünün de doğruluğunu ispat ettik. Çünkü hüküm illetinin makîste daha kuvvetli bazen de daha zayıf olması caizdir. Yine İbn Sübkî'ye muhalif olarak öldürmeye zorlanan kişinin mükellef sayıldığını tespit ettik. Sonuç olarak bu meseleleri farklı görüşler ve usûl ekolleri arasında karşılaştırmalı olarak incelediğimizde ez-Zelmi'nin söz konusu bütün itirazlarında haklı olduğunu gördük."
