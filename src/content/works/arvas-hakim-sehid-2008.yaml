abstract: "el-Hâkim eş-Şehîd el-Mervezî (ö. 334/945), Sâmâniler (m. 819-1005) zamanında yaşamış, Buhâra kadılığı yapmış ardından Sâmâni veziri olmuştur. Bu vazifede iken isyan eden askerler tarafından şehit edilmiştir. Birçok eser yazmakla beraber günümüze ulaşan tek eseri ve çalışmamızın da konusunu teşkil eden eseri el-Kâfî'dir.Müellif, eserini İmam Muhammed'in (ö. 189/804) ?Zâhiru'r-rivâye? veya ?Mesâilu'l-usûl? kabul edilen eserlerini birleştirip, tekrarlarını çıkararak, konuları fıkıh bablarına göre yeniden tanzim ederek tasnif etmiştir. el-Kâfî, İmam Muhammed'in eserlerinden sonra mezhepte asıl kabul edilmiş ve sonraki eserlerin kendisine dayandığı bir eser olmuştur.Müellif, Zâhiru'r-rivâye eserler yanında Nevâdirden olan eser ve kavilleri de eserine almıştır. Muhtasar bir çalışma olan el-Kâfî'de konular sade ve anlaşılır bir üslupla sunulmuş, meseleler detaylı ele alınmamıştır.el-Kâfî, sahip olduğu şöhrete rağmen halen matbu edilmemiş, birçok nüshası ile kütüphanelerde mevcut bulunmaktadır. Oldukça kapsamlı olan bu eseri tek bir çalışma ile tahkik etmenin zorluğundan dolayı biz çalışmamızı bu eserin zekât, savm, hayz ve menâsik bölümlerinin tahkikini yapmakla sınırladık. Aynı zamanda çalışmamızda müellifin hayatı ve eserleri hakkında da bilgi verdik.Tahkikimizde, müellif nüshasına en yakın metni oluşturmayı amaçladık. Müellif nüshası günümüze ulaşmadığı için bizde tespit ettiğimiz en eski dört nüshayı çalışmamız için belirledik. Tercihli metodu kullanarak nüshalar arasındaki farklılıklardan metne en uygun olanı tercih ettik. Nüshalardaki farklılıkları da belirlediğimiz remizlerle dipnotlarda gösterdik. Aynı zamanda metinde geçen hadis ve şahıslarla ilgili tahrici de dipnotlarda belirttik."
