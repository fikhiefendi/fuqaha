abstract: "Finansal piyasalarda yer alan her bir yatırımcının fikir, inanç ve beklentisi aynı değildir. Bir yatırımcı için uygun görülen bir finansal enstrüman, başka bir yatırımcının değerleriyle çelişebilir. Bu nedenle, faiz hassasiyeti taşıyan yatırımcılara finansal hizmet sunmak ve âtıl fonları finansal sisteme kazandırmak amacıyla faizsiz finans sistemi geliştirilmiştir. Temelini kâr ve zarar paylaşımı esasına dayandıran faizsiz finans sistemi, finansal işlemlerinin hiçbir aşamasında faiz unsuruna yer vermemektedir. İslami Finansal Hizmetler Kurulu'nun (IFSB) 2025 yılında yayımladığı istikrar raporuna göre, küresel İslami finans hizmetleri sektörü 2005 yılında yaklaşık 700 milyar dolar düzeyindeyken, 2025 yılı itibarıyla 3,88 trilyon dolara ulaşmış ve mevcut eğilimin devam etmesi hâlinde 2026 yılında yaklaşık 5,9 trilyon dolara ulaşması öngörülmektedir. Faizsiz finans sisteminde en önemli rolü katılım bankaları üstlenmektedir. Varlık temelli ve risk paylaşımına dayalı yapıları sayesinde katılım bankaları, teorik olarak finansal şoklara karşı daha dayanıklı kabul edilmektedir. Ancak literatürde bu iddiayı destekleyen borsa temelli ampirik bulgular sınırlı olup mevcut çalışmalar genellikle muhasebe temelli performans göstergeleri üzerinden yürütülmüştür. Ayrıca, çoğu çalışma tek bir ülke veya kriz dönemine odaklandığından, faizsiz finans sisteminin dayanıklılık performansı farklı coğrafyalar ve kriz türleri açısından kapsamlı biçimde test edilmemiştir. Bu çalışma, söz konusu boşluğu doldurmayı amaçlayarak çoklu ülke ve ardışık kriz dönemlerini birlikte ele alan ilk kapsamlı ampirik araştırmalardan biri olma özelliğini taşımaktadır. Bu çalışmanın amacı, faizsiz finans sisteminin dayanıklılık iddiasını çoklu ülke ve kriz perspektifinden ampirik olarak incelemektir. Bu kapsamda Türkiye, Suudi Arabistan, Bahreyn, Malezya, Kuveyt, Katar, Birleşik Arap Emirlikleri ve Ürdün borsalarında işlem gören ve verilerine kesintisiz olarak ulaşılabilen ticari bankalar ile katılım bankaları günlük hisse senedi kapanış fiyatları üzerinden analiz edilmiştir. 2008 Krizi, Suriye Krizi, 2014 Petrol Krizi, Pandemi Krizi, Rusya-Ukrayna Krizi, Orta Doğu bağlamında İsrail-Filistin ve İsrail-İran Krizi olmak üzere toplam yedi kriz, kriz öncesi, kriz dönemi ve kriz sonrası olmak üzere üç aşamada değerlendirilmiştir. Ayrıca, ilgili bankaların krizlerin tamamında borsada işlem görüyor olması temel bir sınırlılık olarak kabul edilmiştir. Çalışmada, değişen varyansın varlığını test etmek için ARCH-LM testi, yapısal kırılma tarihlerini belirlemek amacıyla ICSS testi uygulanmıştır. Ardından, tespit edilen kırılma tarihleri kukla değişkenler olarak GARCH (1,1) modeline dâhil edilmiştir. Böylece yalnızca istatistiksel olarak anlamlı kırılma noktaları dikkate alınarak modelleme süreci yürütülmüştür. Tüm testler ve modelleme süreci“R Studio”yazılımı kullanılarak gerçekleştirilmiştir. Elde edilen bulgular, incelenen ülkelerdeki ticari ve katılım bankalarının volatilite dinamikleri açısından benzer bir yapıya sahip olduğunu göstermektedir. Tüm ülkelerde geçmiş şoklar ve önceki döneme ait volatilitenin mevcut oynaklık üzerinde güçlü bir etkiye sahip olduğu tespit edilmiştir. Karşılaştırmalı olarak, ticari bankaların şoklara duyarlılığının katılım bankalarına göre daha yüksek, buna karşın volatilite kalıcılığının daha düşük olduğu görülmüştür. Katılım bankalarında ise şokların etkisi başlangıçta daha sınırlı olmakla birlikte, oynaklığın sistemde daha uzun süre devam etme eğiliminde olduğu sonucuna ulaşılmıştır. Bu bulgular, faizsiz finans sisteminin teorik olarak öne sürdüğü dayanıklılık iddiasını belirli koşullar altında desteklemekte ve finansal istikrarın sağlanmasında katılım bankalarının tamamlayıcı bir rol üstlenebileceğine işaret etmektedir. Elde edilen bulguların, yatırımcılar, portföy yöneticileri, finansal kurumlar ve politika yapıcılar açısından özellikle kriz dönemlerinde risk yönetimi süreçlerinde yararlanılabilecek değerli bir kaynak oluşturmasının yanı sıra, finansal istikrarın korunması ve gelecekteki olası krizlere karşı daha dirençli bir sistemin inşasında politika ve düzenlemelere katkı sağlaması beklenmektedir. Bu yönüyle çalışma, hem literatüre kuramsal katkı sağlamakta hem de politika yapıcılar için uygulamaya dönük çıkarımlar sunmaktadır."
