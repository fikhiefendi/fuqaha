abstract: "Hanbelî Mezhebi'nin kurucu mamı olan Ahmed b. Hanbel (d. 241/855) hadis ilminin yanı sıra fıkıh ilmi ile de mesgul olmus ve birçok meselede fetva vermistir. Ne var ki sahsından ve görüslerini nakleden râvilerden kaynaklanan bazı sebeplerden dolayı bize kendisinden aynı mesele hakkında iki, üç, dört ve hatta bes farklı görüs nakledilmistir. Çalısmamızı kendisi ile sınırlı tuttugumuz, bn Kudâme'ye (d. 620/1223) ait olan ?el-Mugnî ala Muhtasari'l-Hırakî? isimli eser Hanbeli Mezhebi'nin temel kaynakları arasındadır. Çalısmamız bir giris ve dört bölümden olusmaktadır. Giris bölümünde, Ahmed b. Hanbel-bn Kudâme'nin hayatları, eserleri, ilmî kisilikleri ve ?el-Mugnî? isimli eser hakkında bilgi verilmistir. Birinci bölümde, Ahmed b. Hanbel'den aynı mesele hakkında gelen iki'li rivâyetler, kinci bölümde, Ahmed b. Hanbel'den aynı mesele hakkında gelen üç'lü rivâyetler, Üçüncü bölümde, Ahmed b. Hanbel'den aynı mesele hakkında gelen dört'lü rivâyetler, Dördüncü bölümde, Ahmed b. Hanbel'den aynı mesele hakkında gelen bes'li rivâyetler, konu baslıklarına göre tespit edilmistir."
