abstract: "Bu tez çalışmasının ilk bölümünde şer'iyye sicilleri ile Harput şer'iyye sicilleri hakkında bilgiler verildi. Tezin ikinci bölümünde 49 adet idari nitelikli vesika, 64 adet iktisadi ve mali vesika, 54 adet sosyal nitelikli vesika ve 37 adet askeri nitelikli vesikanın kısa özetleri verildi. Son bölümde ise bu vesikaların transkripsiyonları yapıldı."
