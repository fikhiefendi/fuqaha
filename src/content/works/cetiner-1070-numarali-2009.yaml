abstract: "Bu çalışmada TD 1070 Numaralı Edir ne Evkaf Defter i esas alınarak Edirnemerkezde bulunan mahalleler ve bu mahallelerde bulunan vakıflar incelenmiştir. İlkve son sayfalarında eksik olan bu defterde kayıtlı, Edirne merkeze ait yüz on mahalleve bu mahallelerde bulunan iki bin yüz adet vakıf tespit edilmiştir. Çalışmanın içeriğişu şekilde oluşturulmuştur:Giriş bölümünde kısaca Edirne'nin tarihi anlatıldıktan sonra çalışmanınkaynağı olan TD 1070 Numaralı Evkaf Defteri 'nin tanıtımı yapılmıştır.Birinci bölümde Edirne'nin topografik yapısı ve şehrin gelişmesi hakkındabilgi verilmiştir. Ayrıca incelenen defterde kayıtlı olan, Edirne merkezdeki nahiyelerve bu nahiyede bulunan mahalleler verilmiştir.İkinci bölüm çalışmanın esasını teşkil etmektedir. Bu bölümde kısa bir girişve değerlendirmenin ardından incelenen defterde, hangi mahallede ne kadar vakıfvardır? Vakıfların türü nedir? Vakıfların ne kadar nakit parası vardır? Vakıflarınyıllık gelirleri ne kadardır? Vakfiye tarihleri nedir? gibi soruların cevaplarına kolaycaulaşılması için veriler tablolaştırılmıştır.Üçüncü bölümde defterde bulunan önemli olduğu tespit edilebilen vakıfkurucuları hakkında kısaca bilgi verilmiştir. Daha sonra vakıf kurucularının sosyalstatüsü hakkında değerlendirilmeler yapılmıştır. Bu bölümün devamında Edirne'debulunan vakıfların teşkilatı ve yönetimi hakkında bilgi verilmiştir.Dördüncü bölümde çalışmada yer alan vakıfların iktisadi yönü incelenmiştir.Vakıfların gayrimenkul ve ribâ gelirleri etraflıca incelenmiştir. Vakıflarda çalışangörevliler için yapılan harcamalar ve ortaya konmuştur. Devamında da vakıf giderlerihakkında bilgi verilmiştir.Beşinci bölümde incelenen defterde bulunan vakıfların hizmetlerine göredağılımı incelenmiştir. Burada dini hizmetler, eğitim hizmetleri, beledi ve sosyalhizmetler ile evlatlık vakıflar ele alınmıştır.Sonuç bölümünde de Edirne şehrinin Türkler tarafından fethinden itibaren XVI.yüzyılın sonlarına kadar kurulmuş olan vakıfların şehrin büyümesindeki etkisiincelenmiştir. Mahallelerde vakıfların sosyal hayat üzerindeki etkisi gösterilmiştir."
