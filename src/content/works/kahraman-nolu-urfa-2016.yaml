abstract: "Bu çalışmada 214 Numaralı Urfa Şer'iyye Sicili'nin bazı sayfaları ele alınarak M.1870-1871 tarihleri arasında Urfa şehrinin sosyal, ekonomik ve kültürel hayatının tespit edilmesi amaçlanmıştır.Bu çalışma, Müslim ve Gayri Müslimlerin on mahallede komşu olduklarını, ticari ortaklık kurduklarını, birbirlerinden alış veriş yaptıklarını, hoşgörülü bir ortamda beraber yaşadıklarını göstermiştir. Ekonomik hayatın tarım ve hayvancılığa dayandığı, insanların hizmet sektöründe yoğunlaştığı, ticaret ile uğraşanların ise daha çok hayvansal ve tarımsal ürünleri alıp sattıkları tespit edilmiştir. O dönemdeki meydan, sokak, mahalle, cami ve medrese adlarının bir kısmının günümüze kadar geldiği, bir kısmının ise yok olduğu yâda zamanla isimlerinin değiştiği belirlenmiştir. Gündelik hayatta kullanılan eşyaların çoğunun bakır, tahta ve hayvansal ürünlerden imal edildiği görülmüştür."
