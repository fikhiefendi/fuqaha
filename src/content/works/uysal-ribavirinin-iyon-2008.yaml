abstract: "Bu çalışmada, geniş spektrumlu bir antiviral ilaç olan ribavirinin miktar tayini için, iyon çifti ekstraksiyonuna dayanan yeni bir vizibl spektrofotometrik yöntem geliştirildi. Geliştirilen yöntemde karşıt iyon olarak sülfonftalein grubu boyar maddelerden bromtimol mavisi kullanıldı. Reaksiyonun kantitatif olarak yürümesi ve ekstraksiyon için optimum koşulların saptanması amacıyla, pH nın etkisi, uygun ekstraksiyon çözücüsü ve belirteç miktarı araştırıldı. Geliştirilen yöntemde pH 4,4 asetat tamponu ile çalışıldığında maksimum absorbans elde edildi. Reaksiyonun tamamlanması için 5 kat belirteç fazlasının yeterli olduğu ve diklormetanın ektraksiyon için en uygun çözücü olduğu saptandı. Yöntemde ilaç çözeltisi, asetat pH 4,4 tamponunda bromtimol mavisi çözeltisi ile muamele edildi ve oluşan iyon çifti diklormetan ile ekstre edildi. Sarı renkli diklormetan çözeltisinin absorbansı 411 nm dalgaboyunda aynı koşullarda hazırlanmış boş denemeye karşı ölçüldü. Job un sürekli değişim yöntemiyle, ribavirinin belirteç ile 1:1 mol oranında iyon çifti oluşturduğu gözlendi. Oluşan iyon çiftinin karanlıkta ve oda sıcaklığında 24 saat hemen hemen kararlı kaldığı saptandı. Absorbans ile ribavirin konsantrasyonu arasındaki ilişkinin 4-20 µg/mL konsantrasyon aralığında doğrusal olduğu saptandı. Ölçü eğrisine ait regresyon denklemi A=0,0524C?0,0424 (r=0,9992) dır. Geliştirilen yöntem ribavirinin kapsüllerdeki analizine başarı ile uygulandı ve elde edilen sonuçlar, daha önce yayınlanmış bir vizibl spektrofotometrik yöntem sonuçları ile Student-t ve Fischer-F testleri uygulanarak istatistiksel olarak kıyaslandı. %95 olasılık düzeyinde ortalamalar ve standart sapmalar yönünden önemli bir fark olmadığı görüldü. Yöntem doğruluk, kesinlik ve geri kazanım yönünden de valide edildi. Sonuç olarak, geliştirilen yöntem kolay, hassas ve tekrarlanabilir olup, ribavirinin rutin analizlerinde güvenle kullanılabilir."
