abstract: "Günümüzde altyapı projelerinde genel olarak kamu finansmanı, kurumsal finansman ve proje finansmanı olmak üzere üç finansman yöntemi kullanılmaktadır. Kamu finansmanı, bir devletin kalkınma bütçesi çerçevesinde ve devletin kaynaklarından yapılırken, altyapı projelerinin özel sektöre devredilmesiyle birlikte kurumsal finansman ve proje finansmanı yöntemlerinden söz edilir. Kurumsal veya proje finansmanında öz sermaye, tahvil ve kredi gibi finansman araçları kullanılmaktadır. Ancak Afganistan gibi az gelişmiş ülkelerde her üç yöntemi de neredeyse sonuçlanmamaktadır. Çünkü devletin kaynakları, normal bütçe giderlerine bile yetmezken, özel sektörün potansiyeli, büyük ölçekli altyapı projelerinin finansmanında yetersiz kalmaktadır. Ayrıca tahvil ihracı için yerel organize sermaye piyasası da bulunmamaktadır. Öte yandan dini hassasiyetlerden dolayı konvansiyonel finansman araçları, potansiyel sermaye piyasasından dışlanmaktadır. Afganistan'ın bütçesi yıllardır dış yardımlara bağlı kalmıştır. Bu yardım fonları, çoğunlukla sınırlı olup altyapı finansmanında kullanılmamıştır. Örneğin, 2001 yılından bu yana uluslararası toplumun mali yardımlarından yararlanan Afganistan, altyapı geliştirilmesinde başarısız kalmıştır. Özellikle enerji, ulaşım, eğitim ve sağlık sektörlerinde büyük boşluklarla karşı karşıya kalmıştır. Donörlerin finansman yöntemlerine ve hedef sektörüne bakılırsa, bahsedilen kaynakların finansörün kendi menfaatine yönelik yapılmış olduğu ve ülkedeki altyapı projelerinde kısıtlı olarak kullanıldığı anlaşılmaktadır. Üstelik Afgan toplumun dini değerleri, konvansiyonel finansman yöntemlerinin kullanılmasını engellemektedir. Dolayısıyla toplumun kültürel değerleriyle çelişmeyen, ülkenin altyapısını geliştirebilen ve sosyal refahı sağlayabilen alternatif bir finansman yolunun izlenmesi gerekmektedir. Bu yol ancak İslami finans sisteminde bulunabilmekte ve İslami bono olarak adlandırılan sukuk, alternatif ve uygulanabilir bir yöntem olarak önerilmektedir. Ancak altyapının farklı sınıfları, maliyeti ve sukuk modellerinin çeşitliliği, avantajları ve dezavantajlarına bakıldığında uygulanabilirliği de bir ülkeden diğer ülkeye göre farklılık göstermektedir. Dolayısıyla bu çalışmanın amacı, Afganistan altyapı projelerinin finansmanı için uygulanabilir sukuk modeli önermesidir. Bu araştırmada Afganistan altyapı projelerinin finansmanında sukuk modellerinin uygulanabilirliği ele alınmış ve ülkenin altyapı durumuna göre uygulanabilir modeller önerilmiştir. Sonuç olarak ilk etapta ülkedeki küçük ve orta kapasiteli ekonomik altyapı projeleri için müşâreke, mudârebe ve murabaha sukuk modelleri, büyük ölçekli projeleri için icâre sukuk modeli, sosyal altyapı projeleri için istisna ve vekâlet modelleri ve düşük maliyetli projeleri için hibrid sukuk modeli önerilmiştir. Araştırmada, sosyal bilimlerde en çok kullanılan nitel araştırma yöntemine dayalı durum çalışması yaklaşımı tercih edilmiştir. Bununla birlikte, veri toplama yöntemi olarak döküman incelemesi kullanılmıştır."
