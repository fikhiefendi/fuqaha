abstract: "Bu çalışma, İslam Bankası'nın çalışanları veya temsilcileri tarafından işlenen ekonomik suçlardaki sorumluluğunu, İslami içtihatlar ve Libya hukukunun ele aldığı bilgiler üzerinden inceler, ve bu çalışmanın sonucu, İslam Bankası'nın yasalarca kendilerine tanınan tüzel kişiliğe sahip olması, eylemlerini yasallaştırması, hak edinmesi ve yükümlülükler üstlenmesi ve bağımsız mali bütünlüğü olması nedeniyle, bu bankanın işlediği suçlar ve kabahatler için cezai sorumluluk alması ve aynı zamanda kendi mali bütünlüğünün yükümlülüklerini taşıması gerektiği belirtilmektedir. Astlarından biri tarafından, astlarının işlerinden dolayı takipçisinin sorumluluğuna dayanarak, astının işinin sınırlarını aşmaması ve davranışının, gerçek kişiyi yasal veya hukuki suçtan sorumlu tutmanın yanı sıra bankanın menfaatine ulaşmayı amaçladığı ve bu nedenle sorumluluğun aralarında paylaşılması şartıyla, adına işlenen bu tür suçların cezası."
