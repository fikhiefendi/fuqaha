abstract: "ÖZET KLASİK HANEFİ FIKIH USULÜNDE LAFIZ ANLAM İLİŞKİSİ BAKIMINDAN ZAHİR VE NASS Dinin iki temel kaynağı olan kitap ve sünnetin lafızlardan oluşması ve hükümlerin bu kaynaklardan elde edilmesi fıkıh usulü eserlerinde lafız ve mana ile ilgili açıklamaların geniş yer tutmasına sebep olmuştur. Hanefi fıkıh usulü eserlerinde lafız ve mana ile ilgili olarak yapılan bu açıklamaların bir kısmını tanıtma imkanı vereceğim düşünerek zahir ve nass lafızları ele aldık. Tezimizde klasik Hanefi fıkıh usulcülerinin açıklık ve kapalılık yönünden lafızlar arasında ele aldıkları zahir ve nass lafızların, klasik Hanefi fıkıh usulünde ne anlam ifade ettiklerini, lafız-anlam ilişkisi bakımından ele alacağız. Zahir ve nass lafızların mahiyeti ile ilgili açıklamalarımızda, bu lafızların te'vil, tahsis ve nesih ihtimalleri hakkında fıkıh usulü eserlerinde yapılan ilgili açıklamalara yer vereceğiz. Aynı zamanda genel olarak usul eserleri içerisinde zahir ve nass lafızlar hakkında yapılan açıklamalarda ortaya çıkan farklılıkları anlaşılmasının hangi safhalarda geçtiğini, zahir ve nass lafızların terimleşme süreçleri ile ilgili açıklamalarımız içerisinde ele alacağız. Konumuz ile ilgili araştırmamızın sonucunda klasik Hanefi fıkıh usulü eserlerinde zahir lafzın, sıygasıyla, derin düşünmeye gerek kalmaksızın anlaşılan manayı ifade etmek için kullanıldığını, nass lafzın ise lafızdan sıyga itibarı ile değil, konuşanın kast ettiği mananın kendisinde anlaşılabildiği lafzı ifade etmek kullanıldığını tespit ettik. Ayrıca klasik Hanefi fıkıh usulcülerinin zahir ve nass lafız ayrımında zahir lafzın asıl manası için sevkolunmamış olmayan nass lafzın ise asıl manası için sevk olunmuş olan lafız olması şartlarına itibar etmediklerini, bunun sonucunda da bu lafızların aykırılığım değil, tedahülünü benimsediklerini ve nass lafzın zahir lafızdan, zahir lafzin ise nass lafızdan infiradım mümkün görmediklerini ortaya koyduk. Araştırmamızdan elde ettiğimiz diğer bir sonuç ise kimi Hanefi fıkıh usulcülerinin zahir ve nass lafızları ibarenin delaleti kapsamında ele aldıkları, kimi usulcülerin ise nass lafzı ibarenin, zahir lafzı ise işaretin delaleti kapsamında ele aldıklarıdır."
