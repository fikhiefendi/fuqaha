abstract: "Bu çalışmada; İslam hukukunda akitlerin kendiliğinden sona ermesini ifade eden infisah teorisinin ilke ve esasları ele alınmıştır. Sözleşmelerin sona erme yollarından biri olan“infisah”kavramı, teorik ve uygulamalı yönleriyle incelemeye çalışılmıştır. Sözleşmelerin infisahı, taraflardan bağımsız olarak sözleşmenin kendiliğinden sona ermesi anlamına gelmekte olup, bu durum genellikle beklenmeyen hal ve mücbir sebeplerden kaynaklanmaktadır. Tezimiz giriş ve sonuç kısımları dışında üç bölümden oluşmaktadır. Birinci bölümde öncelikle akit kavramı üzerinde durulmuş daha sonra infisah kavramının tanıtımı ile ilişkisi olan kavramlar üzerinde durulmuştur. Bu bölümde ayrıca infisahın meşruiyeti, hukuki altyapısı ve şartları oluşturulmaya çalışılmıştır. İkinci bölümde ise infisahın sebepleri;“nikâh akdinde infisah sebepleri”ile \"borçlar hukukunda infisah sebepleri olmak üzere iki ana başlık altında incelenmiştir. Nikâh akdinin infisah sebeplerini din ve ülke farkı, sütkardeş, hürmet-i musahare, kadının evlendikten sonra başkasından hamile olduğunun ortaya çıkması ile fiziksel kusurlar gibi etmenler oluştururken, borçlar hukukunda ise malın helak olması, gasp, şufa hakkı, ölüm, irtidat ve iflas gibi etmenler oluşturmuştur. Ayrıca yeri geldikçe pozitif hukukla mukayeseli mukayeseli olarak incelenmiştir. Üçüncü bölümde ise infisahın akitler üzerinde meydana getirdiği sonuçlar üzerinde durulmuştur. Söz konusu bölümde infisahın nikâh akdi özelinde doğurduğu sonuçları, mehir, iddet, iddet nafakası ve sükna alt başlıkları altında incelenmiştir. Borçlar hukuku alanında ise infisahın, istinadi ve iktisari sonuç doğurması hususlarına değinilmiştir. Çalışmamız infisahın hükmünün açıklanması ile neticelendirilmiştir. Netice itibariyle sözleşmelerin infisahı; nikâh akdinde akdin kendiliğinden sona ermesini ifade ederken, borçlar hukukunda ise borçluyu borcundan kurtaran bir sebep olarak görünüm arz etmiştir."
