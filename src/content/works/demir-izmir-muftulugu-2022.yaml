abstract: "İnsanoğlunun huzurlu, mutlu, sıcak bir yuva kurması ve neslinin devam etmesi için evlenmesi İslam dinine göre meşru bir yol, Hz. Peygamber (s.a.v)'in en önemli sünnetlerindendir. Bunun içindir ki İslam toplumları evlenmeye büyük önem vermişler ve aileyi önemli bir kurum olarak kabul etmişlerdir. Ailenin sağlam temeller üzerine inşa edilmesi ve sağlam nesiller yetiştirilmesi İslam'ın önem verdiği meselelerdendir. İslam aile hukuku evlilik öncesi nişanlılık dönemi, nikâh, talâk (boşama) ve evliliğin sonuçları gibi bölümlerden oluşmaktadır. Çalışmamız da İzmir İl Müftülüğü fetva hattına gelen talâk ile ilgili soruları tahlil ettik. Soruların ihtiva ettiği konuları ve kavramları işledikten sonra her bir konuyu İslam hukuku kaynaklarından inceleyerek tahlil ettik."
