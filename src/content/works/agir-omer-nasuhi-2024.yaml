abstract: "Bu çalışmada, Ömer Nasuhi Bilmen ve Mehmet Sait Şimşek'in müteşâbih ve nesh konularına yaklaşımları mukayese edilerek incelenmiştir. Müteşâbih ve Nesih problemleri asırlardır tartışılan ve ne oldukları hususunda üzerinde uzlaşılamayan iki önemli meseledir. Kur'ân'daki mesajları doğru anlama çabasına giren her birey bu meselelerle karşılaşmıştır. Bu çalışma da Kur'ân'ı doğru anlama gayretinin bir neticesidir. Müteşâbih ve nesh hususlarını farklı pencerelerden bakarak ele almak, konuları daha da dikkat çekici hale getirmektedir. Bu sebeple, birbirine yakın dönemlerde yaşamış, biri gelenekçi diğeri çağdaş iki müfessirin görüşlerinden hareketle mevzu izah edilmiştir. Bu müfessirleri yakından tanımak için birinci bölümde hayatları ve ilmi şahsiyetleri hakkında bilgi verilmiştir. Çalışmanın temel kavramları olan müteşâbih ve nesih kavramları hakkında tarih boyunca çeşitli tanımlar yapılmıştır. Bu tanımların bir kısmı birbirine yakın içeriklerden oluşurken bazıları da tamamen birbirinden alakasız olmuştur. Bu sebeple ikinci bölümde müteşâbih ve nesih kavramlarının neyi ifade ettiği izah edilmiş ve tarihsel süreçleri ele alınmıştır. Ayrıca müteşâbih konusunu yakından ilgilendiren muhkem ve te'vil kavramları açıklanmıştır. Nesih konusunda ise, neshi kabul edenlerin delilleri tek tek belirtilerek izah edilmiş, bunun karşılığında neshi kabul etmeyenlerin de bu delillere itirazları ayrı ayrı açıklanmıştır. Son bölümde ise, öncelikle Bilmen ve Şimşek'in müteşâbih yaklaşımları tespit edilerek mukayese edilmiştir. Bu mukayese, Kur'ân'da müteşâbih olarak kabul edilen âyetler üzerinden çeşitli örneklerle yapılmıştır. Bunun akabinde Bilmen ve Şimşek'in nesih anlayışları tespit edilmiş ve bu anlayışlarının mukayesesi yapılmıştır. Bu mukayese de, aynı şekilde Kur'ân'daki âyetler çerçevesinde yapılmıştır. Bu âyetlerden üç tanesi neshe delil olarak getirilen âyetlerdir. Bunun dışında ayrıca, mensuh olduğu iddia edilen birkaç âyet üzerinden de mukayese yapılmıştır. Sonuç kısmında ise, ele alınan problemler hakkında oluşan kanaatimiz belirtilmiştir."
