abstract: "Tarih boyunca İslam düşüncesine fikirleriyle ve eserleriyle katkı sunmuş pek çok isim teşeyyu' suçlamalarına maruz kalmış, bu yolla itibarları zedelenmeye çalışılmıştır. Muhammed b. Cerir et-Taberî (310/923) de bu isimlerden biridir. Taberî'nin bu ithamlara maruz kalmasının arkasında dönemin sosyo-politik ortamının yanı sıra Hanbelîler ve Zahirîler'in mezhep taassubu ve kişisel hasımlıklar vardır. Bu tez Taberî hakkındaki söz konusu iddialara kaynaklık eden bilgileri inceleyerek ona yönelik Şiîlik ithamının tarihsel olarak ne kadar yerinde olduğunu tartışmakta ve bu ithamın sağlam temellere sahip olup olmadığını incelemektedir."
