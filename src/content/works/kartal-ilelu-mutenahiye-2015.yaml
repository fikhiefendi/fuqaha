abstract: "Hicri altıncı asrın en önemli Ġslâm âlimlerinden biri olan Ebu'l-Ferec Ġbnu'lCevzî, fıkıh, tefsir, hadis, coğrafya, tıp, vaaz ve ahlâk gibi çok farklı alanlarda, 380'i aĢkın eser telif etmiĢtir. Bağdat'ta doğan müellif, hadis hıfzı hususunda Hâfız olarak kabul edilmiĢtir. Hadis alanında yazmıĢ olduğu eserlerden ikisi çok dikkat çekmiĢ; olumlu ve olumsuz tenkîtler almıĢtır. Ġbnu'l-Cevzî, Kitabu'l-Mevzûât'ta uydurma rivayetleri, el-İlelu'lMütenâhiye'de ise kendileri ile ihticâc olunmayan çok zayıf, vâhî rivayetleri bir araya getirdiğini belirtmektedir. Müellif, eserlerindeki hatalar ve çeliĢkiler ile ravi ve rivayetlerin değerlendirmesinde müteĢeddit davranmasından dolayı Ġslâm âlimleri tarafından eleĢtirilmiĢtir. Buna rağmen müellif, bu iki kitabında genel olarak baĢarılıdır. el-İlel'de, ravi ve rivayetlerin değerlendirmesinde müellifin uygulamıĢ olduğu cerh ve ta'dîl metodu tezin konusunu teĢkil etmektedir. Ġbnu'l- Cevzî, eserinde geleneksel hadis tenkîdi sistemine sâdık kalmakla beraber ravi ve rivayetlerin değerlendirmesinde müteĢeddit davranmıĢtır. Ġbnu'l- Cevzî, çoğunlukla rivayetlerin farklı tariklerini bir araya getirmiĢ ve bunları bütüncül bir bakıĢ açısıyla tahlîl etmiĢtir. Ravi ve rivayetlerin tenkîdinde kendisinden önceki hadis münekkitlerinin değerlendirmelerini esas almaktadır."
