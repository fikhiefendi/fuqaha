abstract: "Kamulaştırma, İdare ve Anayasa Hukuku'nun temel konuları arasında yer almaktadır. Küreselleşme ile birlikte yabancı yatırımcıların faaliyetlerini gerçekleştirmek için yatırım yaptığı ülkelerdeki taşınmazlara ihtiyaç duyduklarında, kamulaştırmaya başvurulacaktır. Hal böyle olmakla birlikte kamulaştırma işlemiyle bireyin gerek Anayasada gerekse yasalarda güvenceye bağlanan en temel haklarından biri olan mülkiyet hakkına müdahale edilecektir. Bu nedenle kamulaştırmanın ön koşulu olan kamu yararı ile bireyin kamulaştırmaya konu taşınmaza malik olmasından kaynaklı bireysel yarar arasında bir denge gözetilmelidir.Kamulaştırmayla ilgili konularda ortaya çıkan tereddütlerin giderilmesi önem arz ettiğinden, mevzuatta ortaya çıkacak tereddütler yasal düzenlemeler ile giderilmeli böylece mülkiyet hakkı asgari düzeyde ihlal edilmelidir.Çalışmamızın amacı, İdare ve Anayasa Hukuku'nun temel konularından biri olan kamulaştırmayı, 2942 sayılı Kamulaştırma Kanunu ile 1982 Anayasası'nda 2001 yılında yapılan köklü değişiklikler çevresinde tezimizin konusu kamulaştırmada malikin hakları ve yükümlülükleriyle bağlantılı olarak incelemek; tartışmalı konuları ortaya koymak, değerlendirmek ve bir nebze olsun çözüme yönelik görüşleri ortaya koyabilmektir.Anahtar Sözcükler1.Kamulaştırma2.Kamu Yararı3.Bedel Tespiti ve Tescil Davası4.Hak5.Yükümlülük"
