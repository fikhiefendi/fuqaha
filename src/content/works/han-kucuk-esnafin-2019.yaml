abstract: "Bu çalışmanın amacı Katılım Bankası müşterileri olan küçük esnafların ve Katılım Bankası müşterisi olmayan küçük esnafların Katılım Bankası algılarını ölçmeye yöneliktir. Veriler anketler aracılığı ile toplanmıştır. Anketler Trabzon ve Erzurum illerinde 2018 yılı Nisan –Temmuz aylarını kapsayacak şekilde dört ay içerisinde yapılmıştır. Verileri işlemek amacıyla Tanımlayıcı İstatistlikler, Mann Whitney U Testi ve Kruskall Wall H testi kullanılmıştır. Araştırma sonucunda gerek Katılım Bankası müşterisi olan esnaflar gerekse Katılım Bankası müşterisi olmayan küçük esnaflar Katılım Bankalarının faizsiz bankacılık faaliyetlerini gerçekleştirdiklerine yönelik şüpheleri olduklarını belirtmişlerdir. Ayrıca Katılım bankalarına yatırılan mevduatın 100.000 TL'lik kısmının TMSF garantisi kapsamına alınması ve Kamuya ait Katılım bankalarının açılmasının her iki katılımcı grup tarafından olumlu karşılanmış ve Katılım Bankalarına olan güvenin artmasını sağlamıştır. Ayrıca Katılım bankaları ile çalışan ve çalışmayan esnaf gruplarının Katılım Bankalarının yeteri kadar tanıtımının yapılmadığı konusunda hem fikir oldukları gözlenmiştir. Katılım bankası müşterisi olan ve olmayan esnafların tüm sorulara vermiş oldukları cevaplar açısından demografik değişkenler bakımından farklılıklar olduğu bu çalışma aracılığıyla elde edilen bir diğer sonuçtur."
