abstract: "Tezimizde girişim sermayesi şirketlerinin ortaklık yapısı ve faaliyetleri İslam hukuku açısından değerlendirilmeye çalışılmıştır. Tezimiz dört bölüm ve sonuçtan oluşmaktadır. Birinci bölümde araştırmanın amacı konusu, önemi ve yöntemi hakkında bilgi verilmiştir. İkinci bölümde girişim sermayesi şirketlerinin kuruluşu, sermaye ve ortaklık yapısı ve faaliyetleri hakkında genel bilgiler, üçüncü bölümde İslam hukukunda şirketler hakkında genel bilgiler, dördüncü bölümde ise girişim sermayesi şirketlerinin uygulama ve faaliyetleri İslam hukuku bakımından değerlendirilmeye çalışılmıştır. Tezimizi hazırlarken borsada işlem gören ve özellikle katılım endeksi kriterlerine uyan girişim sermayesi şirketlerini incelemeye çalıştık. Bu şirketleri incelerken şirketlerin esas sözleşmeleri, resmî siteleri ve Kamuoyu Aydınlatma Platformunun sitesindeki bilgilerden yararlandık. Aktif bir şekilde faaliyet gösteren bazı girişim sermayesi ve girişimci şirketlerle görüşmeler gerçekleştirdik. Araştırma ve görüşmelerimiz neticesinde İslam hukukuna uygun olan ve olmayan durumları tespit etmeye çalıştık. Sonuç bölümünde de araştırmamız esnasında elde ettiğimiz sonuçları zikrettik ve çeşitli önerilerde bulunduk."
