abstract: "Ömer Nasuhî Bilmen'in Usûlî Görüşleri ve Furû Fıkıhtaki Yansımaları Bu araştırma büyük İslam âlimi Ömer Nasuhi Bilmen'in“Hukûk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kâmusu”ile“Büyük İslam İlmihali”adlı eserlerine dayalı olarak onun fıkıh usulü alanındaki görüşlerini ve bunların furû fıkıh alanındaki yansımalarını konu edinmektedir. Bu tez, Bilmen'in usulî görüşlerinin furû fıkıhta nasıl etkili olduğunu açıklamayı ve bu etkileşimi diğer mezhep görüşleriyle karşılaştırmalı olarak incelemeyi amaçlamaktadır. Tezin giriş bölümü Bilmen'in eğitim hayatı, görevleri, eserleri ve özellikle“Hukûk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kâmusu”ve“Büyük İslam İlmihali”adlı kitaplarının genel tanıtımı ve bu iki kitabın kaynaklarını içermektedir. Birinci bölüm, Bilmen'in Kitap, Sünnet, İcma, Kıyas ve Örf başlıklarında İslam Hukukun kaynakları (edille-i şer'iyye) hakkındaki görüşlerini ve bu görüşlerinin bazı furû fıkıh meselelerindeki yansımalarını içermektedir. İkinci bölüm ise, Bilmen'in fıkıh usulünün temel konularından lafız bahisleri hakkındaki görüşleri ve âmm, hâss, emir, nehiy, mutlak, mukayyed, müşterek, müevvel, zâhir, müşkil gibi alt başlıklarda bu görüşlerin yine bazı furû fıkıh meselelerindeki etkilerini konu edinmektedir. Araştırmamız, büyük İslam âlimi Bilmen'in fıkıh ve fıkıh usulü ilimlerinde gösterdiği büyük çabayı ve bu çabanın önemli sonuçlarını tespit bağlamında mütevazı bir katkı sunmaya çalışmaktadır. Nitekim Bilmen, başta fıkıh olmak üzere, İslâmî ilimlerin birçok dalında son derece önemli eserler telif ederek son devrin ilim mirasına büyük katkı sunmuştur. Ancak şu hususta belirtilmelidir ki, Bilmen'in ilmî kişiliği ve fıkhi görüşleri hakkında daha fazla bilgi edinmek için bu araştırmadan daha kapsamlı araştırmalar yapılmasına ihtiyaç bulunmaktadır. Zira bıraktığı eserler ve ilmi miras çok daha fazlasını hak etmektedir."
