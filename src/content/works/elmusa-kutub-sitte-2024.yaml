abstract: "Fıtrat, temel anlam itibariyle İslâm'ın emirleri ve nehiyleridir. İslâm, fıtrat dinidir. Nitekim Allah da (c.c.) kullarını fıtrat üzere olmaya çağırmış, insanın yaratılışında köklü kılınan her fıtri işe tabi olmayı emretmiştir. İnsan, selim tabiatıyla hem yaratılıştaki hem de ahlaki vasıfta olan kemâlâtı sevmeye meyleder. Allah, selim fıtrata sahip insanı, kemal ve cemali istemeye meyli olacak surette yaratmıştır. Bununla beraber insan belirli bir sosyal çevrede doğduğundan, yaratılıştan sahip olduğu selim fıtrat üzerinde öncelikli tesir mezkûr çevreye ait olur. Nitekim Ebû Hüreyre'den (r.a.) rivayet edilen hadis-i şerifte Rasûlüllâh (s.a.v.) şöyle buyurur:“Her doğan, İslâm fıtratı üzerine doğar. Sonra, anne-babası onu Hristiyan, Yahudi veya Mecusi yapar…”. Allah'ın (c.c.) fıtratı sünnet-i ilahi niteliğinde olup iptali yahut alternatifi kabul etmez. Tesir ve tağyirden ise söz edilebilir. Allah (c.c.) ayet-i kerimede şöyle buyurur:“O halde sen hanif olarak bütün varlığınla dine, Allah insanları hangi fıtrat üzere yaratmışsa ona yönel! Allah'ın yaratmasında değişme olmaz. İşte doğru din budur...”. Bu fıtrat, vicdanidir ve kalbe dair olup ruhu marifetullah, muhabbetullah ve Allah'ı her şeye tercih edebilme -i'sar- ile arındırır. Dahası, bu fıtrat, ameli olup bedeni temizler. Her iki hususta ahenkli, birbirine destek verici ve birbirini güçlendiricidir. Sünnet-i seniyye, bu selim fıtratı birtakım hususlara yönlendirmiş ve Müslüman ferdi güzelleştirmeye çalıştığı sabit esaslardan biri olarak kabul etmiştir. Fıtrat hususunda mervi olan tekrarsız rivayetlerin adedi 400, farklı varyant ve senetleriyle itibara alındığında ise tekrarlı olarak 920'ye ulaşmaktadır. Bu durum, fıtratın selametini muhafaza etmek için insanın hayatın her cephesinde fıtratını terbiye etmesi, muhtelif tesir ve bozucu unsurlardan koruması gerekmektedir. İşte İslâm şeriatı ve sünnet-i Nebevi tam da bunun için, insanı hem zahiren hem de batınen disiplinize etmek için gönderilmiştir. Selim fıtratın kabul ettiği şey, insan nefsine de hoş gelir ve kalpler onu güzel görür, bu“maruf”kategorisine girer. Aksine, selim nefislerin reddettiği, nefret ettiği şeyler ise“münker”kategorisine girer. Nitekim Allah ayet-i kerimede şöyle buyurur:“Fakat Allah, size imanı sevdirmiş ve onu gönüllerinize güzel göstermiş; inkârı, fasıklığı ve (İslâm'ın emirlerine) karşı çıkmayı da çirkin göstermiştir”. Bu hususta İslâm'ın fıtratla tam bir uyum içerisinde olan tek din olduğunu tekit etmektedir. İnsan tabiatı, unutmak ve hırs göstermek gibi hususlara muhatap olduğundan Allah peygamberleri uyarıcı ve müjdeleyici olmaları, fıtratın selametini iade etme vazifelerini ifa etmeleri için göndermiştir. Bu selim fıtratın selametini korumak hususunda insanlar farklı mertebe sahibidirler. Allah'ın bir meleke olarak insana lütfettiği, insanın da ilimle, marifetle güçlendirip tecrübelerle beslediği akıl üstünlüğü, fıtratın selameti hususunda büyük rol oynar. Bunu düşünmeyi ve onu doğru bir şekilde ifa etmeyi sağlar. Bu çalışma, fıtrat mefhumunu, sünnetlerini, kitap ve sünnette varit olan delillerini ve hadislerin tahricini ele almaktadır. Bunun yanında içerisinde bulunduğumuz, batı yahut doğu taklitçiliğinin galebe çaldığı, fıtratın selim menhecinden sapmaya muhatap olduğu, uyulmaması gereken inançlara uyulduğu bir zaman diliminde fıtratın tağyire uğrama sebeplerini, nasıl tedavi edilebileceğini ele almaktadır. Şüphesiz bu sapkınlıkların ıslahı ancak yaratılıştan gelen selim fıtrata dönüşle mümkün olabilecektir."
