abstract: "Islah, tecdid, ictihad ve taklit gibi konulardaki görüşleriyle meşhur son dönem İslam hukukçularından biri olan Mahmûd Şeltût'un hayatı, eserleri ve fıkıh düşüncesinin incelendiği bu çalışma giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın konu, önem, kapsam, gaye ve kaynaklarından bahsedilmiştir. Birinci bölümde Şeltût'un yaşadığı dönemin siyasi, sosyal ve dini durumu hakkında bilgi verilmiştir. Ayrıca onun hayatı, ilmî tahsili ve eserleri üzerinde durulmuştur. İkinci bölümünde Mahmûd Şeltût'un usûl-i fıkıh kapsamındaki meseleler arasında bulunan şer'î delillere dair bakış açısı, Kur'ân, sünnet, icmâ, kıyas gibi delillere yaklaşımı ile ictihad, taklit ve ulemanın ihtilaf sebepleri konularındaki düşünceleri üzerinde durulmuştur. Çalışmanın son bölümde ise Şeltût'un genel olarak fürû-i fıkıh meselelerine dair yaklaşımı, sorulan sorulara verdiği fetvâları, tercihleri ve ictihadları ele alınıp ilgili düşünceleri sebebiyle İslâm hukuk tarihinde durduğu konum üzerinde durulmuştur. Sonuç kısmında ise araştırma neticesinde elde edilen bilgiler maddeler halinde serdedilmiştir."
