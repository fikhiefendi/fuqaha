abstract: "'İslami Finans' , 'İslami Bankacılık' veya 'Faizsiz Bankacılık' olarak tanımlanmakta olan 'Katılım Bankacılığı' Konvensiyonel bankacılığa seçenek olarak ortaklık esası ile kar ve zarara katılma esasına dayalı 'faizsizlik prensibi' çerçevesinde farklı bir sistem olarak finans sektörü içerisinde hizmet vermektedir. Son 40 yılda bankacılık sisteminin bir parçası olan Katılım Bankacılığı, özellikle atıl fonların ekonomiye kazandırılması noktasında önemli rol üstlenmektedir. Bu doğrultuda katılım bankacılığı sistemi ile çalışan müşteri sayısında da önemli artışlar meydana gelmektedir. Bu nedenle bu çalışmada, katılım bankalarının küçük işletmeler tarafından tercih edilme nedenlerinin tespiti ve bu nedenlerin memnuniyet üzerindeki etkisinin araştırılması amaçlanmıştır. Bu amaçla Kastamonu ilinde faaliyet göstermekte olan 172 küçük ölçekli işletmeden anket ile veri toplanmıştır. Yapılan analizler neticesinde katılım bankacılığını tercih etme nedenlerinin müşteri memnuniyetini anlamlı olarak etkilediği bulgusuna ulaşılmıştır."
