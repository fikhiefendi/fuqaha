abstract: "Bu çalışmanın konusu“Risâle fi'l-Hisâb ve'l-Cebr ve'l-Mukâbele”adlı matematik eserinin, müellif nüshasına en yakın halini elde ederek Arapça imla kurallarıyla ifade etmek ve eseri Türkçeye çevirip üzerinde matematiksel bir değerlendirme yapmaktır. Hicri 8. yüzyılda (Miladi 14. yüzyıl) yaşamış Ebu'l-Alâ Bihiştî el-İsferâyinî'ye ait olan risale, çeşitli kütüphanelerde birçok nüshası olmasına rağmen bugüne dek literatüre kazandırılmamıştır.“Mâ lâ budde lil-fakîh min el-hisâb”adıyla da bilinen eser, iki makaleden oluşan bir hesâb kitabıdır. Eserin, fakihler için yazılmış bir hesap kitabı olması matematik kültürü açısından dikkat çekici bir özelliktir. Müellifin, cebir kitaplarının içeriğinde karşılaşılan kök alma, yüksek dereceden denklemler, altı denklem formundan mukterenât kısmı ve geometrik çözümlemeler gibi unsurlara söz konusu eser çerçevesinde değinmediği belirlenmiştir. Buradan hareketle eserin, fakihlerin karşılaştıkları cebir problemlerini basit bir şekilde çözmelerini sağlayan bir rehber kitap olarak, alandaki temel bir ihtiyacı karşılamaya yönelik tasarlandığı sonucuna varılmıştır. Bu yazım tarzının İslam matematik bilimleri tarihinde başlı başına bir alt tür olarak sınıflandırılabileceği düşünülmektedir."
