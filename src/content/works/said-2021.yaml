abstract: "Bu çalışma, bilimsel vakfin bilimi teşvik etmenin, bilimin yayılması ve ulusun ilerlemesi üzerindeki etkisini keşfetmenin en önemli yolu olarak, devam eden Sadaqah'ın pratik bir uygulaması olduğunu göz önünde bulundurarak önemini göstermeyi amaçlamaktadır. Ayrıca, insan sosyal dayanışmasının en iyi yollarından biri olup, önemini ve tanımını, meşruluğunu ve bunların değerini, sütunlarını, formüllerini, koşullarını, Antik İslam tarihinin tüm modelleriyle İslam dünyasındaki tarihini yazıyor ve ele almakta Hem İslami hem de Batı dünyalarında modern bir çağda. En belirgin özelliklerini ve engellerini belirlerken, onun İslam ekonomisini desteklemede oynadığı rolü belirtmeye çalışırız. Buna ek olarak, iyi seçilmiş yöneticilere olan ihtiyacı vurgulayarak eğitim sürecini desteklemede ve sürdürmesinde de net bir etkisi vardır. Bu genellikle modern yöntemlere uygun olarak ve İslam hukuku öğretileriyle çelişmeyen bir şekilde gerçekleşir. Tüm bunlar bilimsel, yasal, idari ve finansal uzmanlık gerektiren kişilerin yardımıyla yapılır Son olarak da, genelikle vadi kurumlarının çalışmalarını düzenleyen yasalar, yasalar ve düzenlemeler ile özellikle de hem içe dönük endüktif yaklaşım hem de karşılaştırmalı açıklayıcı yaklaşımın kullanıldığı eğitim Vakp kurumlarının düzenlenmesi gerekiyor. Çalışmanın sonuçlarından biri de bilimsel vakfi kurumlarının, kaliteli eğitim sağlamasının en önemli nedenlerinden biri olması ve Devlet ve eğitimli insanlar üzerindeki yükü azaltırken, bu kurumlara bağımsızlık sağlamasıydı."
