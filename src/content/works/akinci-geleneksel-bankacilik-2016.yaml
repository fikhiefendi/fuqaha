abstract: "Genel bir tanımlama yapılmak istenirse banka; mevduat kabul edip, kabul edilen bu mevduatı yararlı olacak bir biçimde kredi işlemlerinde kullanma hedefi ile kurulan ticari müesseselerdir. Dünyadaki bankacılığın temelleri ortaçağda kiliselerin kutsal topraklara yapılan seyahatlerde hacı adaylarının kıymetli eşyalarını korumak amacıyla ortaya çıkmıştır. Türkiye'de bankacılık sistemi ise 1847 yılında kurulan Bank Der-Saadet İstanbul Bankası ile faaliyete başlamıştır. Türkiye'deki ve dünyadaki bankacılık sisteminde zamanla meydana gelen gelişmeler küresel ekonomik sistemle beraber entegre olmuş bir şekilde düzenlenmektedir. Söz konusu düzenlenme ve değişim, içinde bulunulan zamana göre bankacılık ürünlerindeki değişmelere ve farklılaşmalara yol açmaktadır. Zamanla değişen bireysel ve kurumsal segment bazındaki farklılaşmalar bankacılık sektöründe yeni ürün yelpazelerini de beraberinde getirmektedir. Farklılaşan piyasalara entegre edilmek istenilen bankacılık ürünlerine ilişkin riskli noktalara, bu ürünlerin gelişiminde yer alan içsel ve dışsal faktörlere, birbirleri ile kıyaslandığında avantajlı ve dezavantajlı noktalara, ürünlerin geliştirilmesi önündeki engellere ve ürünlerin nasıl geliştirilebileceğine bu çalışmamızda yer verilecektir"
