abstract: "İnsanoğlunun yaratıldığı ilk günden itibaren en önemli ihtiyacı, beslenmedir. Diğer canlılar gibi beslenme, dolayısıyla gıda maddeleri insan için en hayati önem arz eden tabii ve temel ihtiyaçların başında yer almaktadır. Bu kadar önem arz eden gıda konusunda birçok bilimsel çalışma yapılmıştır ve yapılmaya devam etmektedir. Bu arada gıda konusu ilahi olsun beşerî olsun tüm dinlerin ilgi alanına girmiştir. Doğal olarak beslenmenin kaynağı, elde edilme şekli, tüketilmesi, beden ve ruh sağlığına etkileri kamu hakkını ve sosyal düzeni ilgilendiren bir konu olması hasebiyle İslam dininin ilgi alanı olmuştur. Kur'an, kâinatta var olan nimetlerin insanın istifadesine sunulduğunu birçok ayette zikretmiştir. Helal ve haram konusunda itidalli bir yol izleyen Kur'an, geniş bir helal dairesi çizerek bu nimetlerden haram olanları sınırlamıştır. İnsanlar bu geniş serbestlikle beraber helal ve haram hassasiyetinde titiz olmalarını da istemektedir. Kur'an'da gıdaların haram kılınırken, Yahudilikte olduğu kadar katı bir tutum olmamakla birlikte, Hristiyanlıktaki gibi her şeyi mubah gören bir anlayış da kabul edilmez. Zaruret halinde haram gıdaları helal kılan ayetlerde bile insanlar, haddi aşmama noktasında uyarılır. Bu durum helal ve haram konusunda hassasiyet gösterilmesinin önemini ortaya koymaktadır. Helal ve haramların tespitinde, nass, taabbudîlik, temiz-necis olma, boğazlama şekli, israf ve kamu zararı, zarûret, fayda-zarar gibi bazı ilkeler benimsenmiştir. Bu tezimizde helallerin ve haramların tespitinde, fayda-zarar ilkelerini tefsir literatürü açısından inceleyeceğiz. Tezimiz bir giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde helal ve haram kavramlarının tarifini açıkladık. İkinci bölümde Kur'an'a göre helal ve haram konusuna, diğer dinlerdeki helal ve haram kavramlarına, ilkelerine ve bu dinlerin haram kılma yetkilerine ve hikmetlerine değindik. Üçüncü bölümde helal ve haramın tespitinde fayda-zarar ilkeleri konusunu tefsir literatürü bağlamında ayrıntılı bir şekilde inceledik. Ayrıca haram kılmanın hikmetleri nelerdir? Diğer dinlerde haram uygulaması var mıdır? Tefsir literatürü bağlamında fayda-zarar ilkeleri nelerdir? gibi sorulara cevap aradık."
