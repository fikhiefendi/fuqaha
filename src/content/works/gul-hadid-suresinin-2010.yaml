abstract: "Hadid suresi, içerisinde inanç, muamelat ve ahlak ilkeleri bulunan bir kısmı Mekke çoğunluğu Medine döneminde inmiş bir suredir. Sure içerisinde Allah'ın evrendeki egemenliği ve bazı sıfatları, infak, iman, nifak, huşu, dünya-ahiret dengesi, kader, cimrilik, adalet, Hıristiyanlardaki ruhbanlık ve demir madeninin ilahi bir lütuf olarak insanların emrine verilişi, takva gibi önemli konular yer almaktadır. Bu çalışmamız Hadid suresinin günümüze ışık tutan mesajlarla dolu ayetlerini araştırmaya yöneliktir. Bu yönüyle, yapılacak olan genel veya konulu tefsir çalışmaları için yardımcı olacak mahiyettedir."
