abstract: "Bu araştırma üç bölümden oluşmaktadır. İlk bölümde bankacılık sektörüne genel bir bakış yapılmıştır. İkinci bölümde Türkiye'de bulunan Katılım Bankaları ve Türkiye ekonomisine etkileri teorik olarak araştırılmıştır. Son bölüm de ise Türkiye'de faaliyet gösteren Katılım Bankaları'nın reel sektöre verdikleri kredilerin ekonomik büyüme üzerindeki etkisini; 2005 yılı ilk çeyreğinden 2017 yılı ilk çeyreğine kadar olan dönemi kapsayacak şekilde, üçer aylık (çeyreklik) veriler kullanılarak ekonometrik analizler ve testler yapılmıştır. Bu çalışmada ADF ve PP birim kök testleri ile durağanlık sınaması yapılmıştır. Johansen eşbütünleşme ve Granger nedensellik analizleri gerçekleştirilmiştir. Son olarak Granger nedensellik testi ile Katılım Bankaları kredilerinden GSYİH'a doğru tek yönlü ve pozitif bir nedensellik bulunmuştur. Kalkınma ve Yatırım Bankaları ile GSYİH'a doğru tek yönlü ve pozitif nedensellikten söz edilirken, Mevduat Bankalarından GSYİH'a doğru çift yönlü ve pozitif bir nedensellik söz konusu olduğu görülmüştür."
