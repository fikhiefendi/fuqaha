abstract: "Araştırmamızda kitap, sünnet ve kıyasın yanında icmâın da islâm hukukunun ana kaynaklarından biri olduğu, şer'î hükümleri ispatlamasındaki yeri ve önemi aktarılmıştır. Ayrıca neshin mahiyeti, kısımları, şer'î hükümler arasında nesih olup olmadığı gibi tezimizle alakalı konulara da değinilmiştir. Çalışmamızda, islâm hukuku ana kaynaklarından biri olan icmâın, diğer şer'î delillerle neshi ve bu delilleri neshetmesinin olanağı ele alınmıştır. İcmâın neshini câiz görmeyenlerin kimler olduğu ve görüşlerine dair sundukları delillerin neler olduğu aktarılıp değerlendirilmiştir. Aynı şekilde icmâın neshini ve icmâ ile neshi câiz görenlerin kimler olduğu ve bu görüşlerine dair sundukları deliller aktarılıp değerlendirilmiştir. İcmâın neshi ve icmâ ile nesih konusundaki görüşlerin, hangi konularda birleştikleri ve hangi konularda ayrıştıklarının tespiti de yapılmaya çalışılmıştır. Araştırma neticesinde, icmâın neshi ve icmâ ile neshin câiz olmaması görüşünde olanların delillerinin daha kuvvetli olduğu, bu sebeple icmâın neshinin ve icmâ ile neshin mutlak anlamda câiz olmaması görüşünün daha güçlü olduğu kanaatine varılmıştır."
