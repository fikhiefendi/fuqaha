abstract: "Hicri 456 yılında vefat eden İbn Hazm, Zâhirî mezhebinin günümüze ulaşmasını sağlayan âlimdir. Bu âlimin fıkıhta en önemli eseri, el-Muhallâ bi'l-Âsâr' adlı eseridir. İbn Hazm söz konusu eserde, Zâhirî mezhebinin görüşlerinin yanı sıra diğer dört mezhebin ve günümüze ulaşmayan birçok mezhep imâmının görüşlerine de yer vermiştir. Bu çalışmada İbn Hazm'ın el-Muhallâ adlı eserinde nikâh, Talâk ve muhâlea ile ilgili konularda İmâm Şâfiî'ye nispet ettiği görüşlerini Şâfiî fıkıh kaynaklardan tespit ve tahkik edilmiştir. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde İbn Hazm'ın hayatı, hocaları, talebeleri, eserleri ele alınarak daha sonra el-Muhallâ ile ilgili malumatlar verilmiştir. İkinci bölümde ise İbn Hazm'ın el-Muhallâ isimli eserinde nikâh, talâk ve muhâlea konularında İmâm Şâfiî'ye nispet ettiği yetmiş yedi görüş tespit edilmiştir. Bu görüşlerin tahkiki yapılmıştır. Bunlardan altmış yedi tanesi isabetli, on tanesi ise hatalı olarak nakledildiği tarafımızdan tespit edilmiştir."
