abstract: "Osmanlı Devleti'nin tarih sahnesinden ayrılıp Türkiye Cumhuriyeti'nin kurulması ile beraber harf inkılâbı yapılmış, ilerleyen zaman içerisinde yeni nesiller Osmanlı Devleti'nin arşiv ve kütüphanelerindeki yazılı vesikalardan istifade etmekte güçlük çekmeye başlamıştır. Böylece Osmanlı alfabesi ile kayıt altına alınmış vesikaların Latin alfabesine çevrilmesi ihtiyacı doğmuştur.?1495 Numaralı Şer`iyye Sicili Defterine Göre Rize'nin Ekonomik ve Sosyal Hayatı? başlığı altında yaptığımız bu tez çalışmamızın amacı, söz konusu sicilin günümüz Türkçesine çevrilmesi ve sicilde yer alan kayıtların değerlendirilmesiyle Rize'nin sosyal ve ekonomik hayatına dair sağlam bilgilere ulaşılmasıdır.Çalışmamız giriş ve iki bölümden meydana gelmektedir. Giriş kısmında bugünkü Rize ilinin tarihin ilk dönemlerinden cumhuriyet dönemine gelinceye kadar genel tarihinden, Osmanlı Devleti'nde yargı sisteminin önemli unsurlarından biri olan şer`iyye mahkemeleriyle bu mahkemelerdeki görevliler ve yargılama usûlünden, şer`iyye sicillerinin muhtevası, önemi ve bu sicillerdeki belge çeşitlerinden söz edilmiştir.Birinci bölümde, sicildeki dava zabıtlarından yola çıkarak Rize'nin sosyal, ekonomik ve dînî hayatı tahlil edilmeye çalışılmıştır. Üç ana başlık altında ele alınan bu bölümde Rize toplumunun temelini oluşturan aileden, Rize'nin fizikî ve mimarî yapısından, Rize halkının günlük hayatta kullandığı çeşitli elbise ve eşyadan, toplumdaki Müslim-gayr-i Müslim ilişkilerinden, Rize'de kullanılan isim, ünvan ve lakaplardan, Rize'deki çeşitli ekonomik faaliyetlerle Rize halkının geçim kaynaklarından, miras işlemlerinden, vakıf müessesesi ve bu müessesenin işleyişinden söz edilmiştir. İkinci bölümde 1495 numaralı Rize Şer`iyye Sicili'nin transkripsiyonu verilmiştir."
