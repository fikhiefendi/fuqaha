abstract: "Osmanlı tarih yazımında birinci elden kaynaklar olan şer'iyye sicilleri, Osmanlı şehirlerinin sosyal, iktisadî, idarî ve hukukî yapısının anlaşılmasında büyük önem taşır. Kadılar tarafından tutulan bu defterler, yalnızca mahkeme kararlarını değil, aynı zamanda dönemin toplum düzenini, halkın gündelik yaşantısını ve devletle halk arasındaki ilişkileri de yansıtan çok yönlü belgelerdir. Bu çalışmada, 98 numaralı Ayntab Şer'iyye Sicili'nin 231–301. sayfaları arasındaki belgeler esas alınarak, H.1154–1155 / M.1741–1742 yıllarına ait mahkeme kayıtları transkribe edilmiş ve değerlendirilmiştir. Değerlendirme kısmında bulunan belge içerikleri; ceza davaları, aile ve miras uyuşmazlıkları, kamu güvenliğine ilişkin vakalar, idari tayinler ve vakıf işlemleri gibi başlıklar etrafında sınıflandırılmıştır. Böylece, 18. yüzyılın ortalarında Ayıntab şehrinin sosyal düzeni, hukukî uygulamaları ve taşra teşkilatının işleyişi hakkında detaylı bilgiler elde edilmiştir. Şer'iyye sicillerinde yer alan kayıtlar, dönemin günlük yaşamına, adalet sistemine ve devlet-halk ilişkilerine dair somut örnekler sunmaktadır."
