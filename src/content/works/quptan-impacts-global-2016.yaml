abstract: "Bu çalışma teorik ve uygulama olmak üze iki kısımdan oluşmaktadır. Teorik kısımda faizsiz finans sisteminin literatür araştırması ve genel olarak klasik bankacılıkla farkları ve küresel krizin etkileri açıklanmıştır. Uygulama kısmında hem klasik bankacılık sisteminin hem de faizsiz bankacılık sisteminin küresel kriz döneminde göstermiş olduğu performansı analiz etmek için değişik oranlar kullanılmıştır. Oran analizi kapsamında karlılık, etkinlik piyasa oranları ve sermaye yapısının ölçen oranlar kullanılmıştır. Daha sonra çalışmada performans etkinliğini ölçmek için toplam 2005-2009 yılları için karlılık, toplam giderler, toplam varlıklar, öz kaynaklar gibi değişik göstergeler kullanılmıştır. Ayrıca bankaların faaliyetlerindeki büyümeyi ölçmek için ortalama yıllık büyüme oranları aynı dönemler için hesaplanmıştır. Çalışmada istatistiksel olarak faizsiz finans kesimiyle klasik bankacılık arasında finansal göstergeler karşılaştırıldığında bir ilişki olup olmadığı da test edilmiştir. Sonuç olarak bu çalışmada tüm bankalara çalışma dönemi için stres testi analizi yapılarak bankaların şoklara dayanıklı olup olmadıkları analiz edilmiştir. Bu sayede bankaların verilen şok öncesi ve şok sonrası performansı analiz edilmiştir."
