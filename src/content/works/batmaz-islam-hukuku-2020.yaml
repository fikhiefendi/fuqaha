abstract: "Bu çalışmada 16. Yüzyılda bir Osmanlı kadısı olan Resul b. Salih el-Aydınî tarafından telif edilen el-Fetâvâ'l-adliyye konu edinilmiştir. Müellif eserini dönemin hükümdarı Kanuni Sultan Süleyman'ın kadılara Hanefi mezhebinde hâkim olan görüşle hüküm vermelerini emretmesi üzerine hazırladığını belirtmiştir. Eser müellifinin tabiriyle İslam beldelerinde yaygın olan fıkıh kitaplarından Hanefi mezhebinde müftâ bih/hâkim olan görüşlerin bir araya getirilmesiyle oluşmuştur. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte fetva kavramı ve İslam-Osmanlı hukukundaki yeri ve işlevi ortaya konmaya çalışılmıştır. Birinci bölümde müellif ve eser tanıtılmıştır. Eserin yazma nüshaları, hakkında yapılan çalışmalar, içeriği ve kaynakları tespit edilmiştir. İkinci bölümde ise el-Fetâvâ'l-adliyye'nin hem genel olarak hem de bazı fetvaları özelinde tahlili yapılmıştır. Sonuçta ise İslam-Osmanlı hukukunun 16. Yüzyıl kaynaklarından biri olan el-Fetâvâ'l-adliyye'nin tanıtılması ve tahlili suretiyle yapılan bu çalışmada varılan tespitlere yer verilmiştir."
