abstract: "Bu tez, yerel tarih çalışmalarında ve Osmanlı hukuku, şer'i mahkemeler, kadılık kurumu gibi konuları ele alan diğer çalışmalarda ana kaynak niteliği taşıyan şer'iyye sicillerinden biri olan, 171 numaralı Kastamonu şer'iyye Sicili'nin trankripsiyonu üzerine yapılmıştır. Sicil içerisinde mahkeme kayıtları ve belgelerden sosyal, kültürel, toplumsal, hukuki, idari ve iktisâdi bilgiler elde edilmeye çalışılmıştır. Nitekim çalıĢmanın amacı tam da bu konularda yapılacak araştırmalara hizmet etmektir. 171 numaralı sicil içerisindeki belgelerin en doğru biçimde transkripsiyonu yapılmaya çalışılmış, açık ve net bir düzen oluşturularak, kargaşadan uzak bir şekilde bu tezde yazıya dökülmüştür. Çalışmanın en son bölümünde ise bu belgelerden yararlanılarak genel bir çerçeve oluşturalarak, sicilin çeviri aşamasında elde edilen tecrübeler araştırmalarla paylaşılmıştır."
