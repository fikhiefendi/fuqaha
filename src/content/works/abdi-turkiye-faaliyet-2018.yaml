abstract: "ÖZET Faize karşı hassasiyeti yüksek olan Müslüman toplumların atıl fonlarını ekonomiye kazandırmak amacıyla kurulan İslami Bankalar, günümüzde hem Müslüman hem de Müslüman olmayan toplumlara hizmet verebilecek konuma gelmişlerdir. Dengeli bir finans sistemi kurarak toplumların sosyal ve ekonomik hedeflerine ulaşmasını sağlamayı amaçlayan İslami Bankalar, Asya, Afrika ülkelerinde ve Batılı ülkelerde faaliyetlerini başarıyla sürdürmektedirler. İslami Bankaların çok kısa süre içinde yayılmasını kolaylaştıran neden, faiz alıp vermeden toplumlar arasındaki ekonomik uçurumu kapatma ilkesi için uğraş vermeleridir. Türkiye'de İslami Bankalar, 1983 yılında çıkarılan yasa gereği“Özel Finans Kurumları”adıyla kurulmuştur. 2001 yılında Özel Finans Kurumları, Bankalar Kanunu'na tabi olarak ticari bankalarla eşit haklara sahip olmuşlardır. 2005 yılında yapılan son değişiklik ile Özel Finans Kurumları ismi, İslami Bankacılık işlemlerini anlatmakta yetersiz kaldığı için“Katılım Bankaları”olarak değiştirilmiştir. İslami Bankalar diğer finans kurumları gibi fon talep edenler ile fon arz edenler arasında aracılık yapan kurumlardır. Finans kurumları arasında artan rekabet nedeniyle kurumların faaliyetlerini etkin ve verimli bir şekilde sürdürmeleri zorunluluk halini almıştır. İslami bankalar da bu rekabet ortamında başarılı bir şekilde faaliyetlerini sürdürmek zorundadırlar. Bu nedenle İslami Bankaların etkinlik ve verimlilik analizlerinin yapılması önem taşımaktadır. Bu çalışmada, Türkiye'de faaliyet gösteren İslami Bankaları'nın 2007 – 2016 yılları arasındaki etkinlik ve verimlilik oranları temel alınarak Çok Kriterli Karar Verme Yöntemleri'nden Bulanık TOPSİS ve Shannon Entropi yöntemlerine göre performans sıralamasının yapılması hedeflenmiştir. Söz konusu dönemde aralıksız faaliyette bulunan Albaraka Türk, Türkiye Finans ve Kuveyt Türk Katılım Bankaları incelemeye alınmıştır. Ziraat Katılım Bankası 2015 yılında ve Vakıf Katılım Bankası 2016 yılında faaliyete başladıkları için analize alınamamışlardır. Anahtar Kelimeleri: İslami Bankacılık, Katılım Bankaları, Sukuk, Bulanık TOPSİS Yöntemi, Shannon Entropi."
