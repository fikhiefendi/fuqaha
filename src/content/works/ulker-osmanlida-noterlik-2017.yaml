abstract: "İnsanlar yazının icadından bu yana hukuki ilişkilerinde yazılı belgeleri kullanmışlardır. Yazılı belge hem insanlar arasında uyuşmazlıkların çıkmasını önler, hem de uyuşmazlık çıktıktan sonra haklı olan tarafın tespitinde yardımcı olur. Yazının taklit edilebilmesi ve değiştirilebilmesi nedeniyle yazılı belge konusunda ek tedbirler alınmıştır. Bu noktada bugün noter olarak isimlendirdiğimiz özel görevliler ortaya çıkmıştır. İslam hukukunun ilk dönemlerinden itibaren yazı hukuki muamelelerde aktif olarak kullanılmıştır. Kuran'da belirli süreli sözleşmelerin yazıya geçirilmesi kuvvetle tavsiye edilmiş, Hz. Peygamber'de birçok muamelesinde yazıyı kullanmıştır. Abbasiler döneminde hukuki işlemlerde belge düzenleme ilmi olan“şurût ilmi”ortaya çıkmıştır. Selçuklularda da uygulama alanı bulan noterlik kurumları, onlardan Osmanlılara geçmiştir. Osmanlılarda klasik dönemde kadılar noterlik görevini yerine getirmişleridir. Osmanlı yargı teşkilatı küçük idari birimlere kadar uzanan bir yapıya sahiptir. Böylece halk kolayca kadıya ulaşarak noterlik işlemlerini yaptırabiliyordu. Kadı bu işlemleri şer'iye sicillerine kaydediyordu. Bu defterlerden 15.yy. dan sonra tutulanlar günümüze kadar ulaşmıştır. Defterler incelediğinde kayıtların çoğunun noterlik işlemi olduğu görülmektedir. Tanzimat döneminde birçok noterlik yetkisini yeni kurulan müesseseler lehine kaybeden kadı, tamamen kaldırılıncaya kadar kişiler hukukuna ilişkin bazı işlemlerde noterlik görevi yapmaya devam etmiştir. Tanzimat döneminde hukuk alanında yapılan yeniliklerden biri de noterlik kurumunda yapılmıştır. Öncelikle kaymakam ve yerel idarecilere bazı muameleleri tescil etme görevi verilmiş, daha sonra başta ticari alanda uzmanlık gerektiren tescil işlemleri olmak üzere noterlik işlemleri yapmak üzere ticaret deavi kalemleri kurulmuştur. Bazı vilayetlerde kurulan bu bürolar zamanla ihtiyaca cevap veremez hale gelmiştir. 1879 yılında yayımlanan Mukâvelât Muharrirleri Nizamnamesi ile tüm ülke genelinde her bidayet(sulh) mahkemesi dâhilinde en az bir görevli mukâvelât muharriri olarak tayin edilmiştir. Bu kurumunda bazı eksiklik ve aksaklıklarının görülmesi üzerine 1913 yılında Kâtib-i Adl Kanun-ı Muvakkati ile Osmanlı noterlik sisteminde köklü değişiklikler yapılmıştır. Daha önce devlet memuru olan noter yeni düzenleme ile kamu görevi ifa eden bağımsız görevlilerdir. Sınavla belirlenecek olan Katib-i adller kendi tuttukları bürolarda noterlik görevi ifa etmişlerdir. Noterlik kamu düzenini ilgilendiren bir meslek olduğu için yasal düzenlemelerle, bu alanda yaşanan ihlallerle ilgili hukuki ve cezai sorumluluk düzenlenmiştir. Bu çalışmada bugüne kadar pek eser verilmeyen Osmanlı noterlik tarihine ilişkin değerli verilere ulaşılmış, önemli bir hukuk kurumunun milli tarihimizdeki yeri tespit edilmiştir. Ayrıca günümüzde batıdan geldiği iddia edilen noterlik kurumunun İslam ve Osmanlı hukukunda kendine özgü isimlerle var olduğu tespit edilmiştir."
