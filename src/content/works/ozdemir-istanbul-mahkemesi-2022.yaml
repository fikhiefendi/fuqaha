abstract: "Osmanlı Devleti'nin hukuk sisteminin nasıl işlediğini göstermesinin yanı sıra tarihini de idari, hukuki, mali vb. açılardan aydınlatması bakımından benzersiz bir kaynak değeri taşıyan şer'iyye sicilleri Osmanlı Tarihi ile ilgili araştırma yapanların mutlaka müracaat etmesi gereken arşiv belgelerinin başında gelmektedir. Bu tez çalışmasında H. 1127 / M. 1715 tarihli İstanbul Bâb Mahkemesi 108 numaralı Şer'iyye Sicili'nin transkripsiyonu ve değerlendirilmesi yapılmıştır. Defter boyutları 42x15 cm'dir. 84 varaktan meydana gelen bu sicilde toplamda 417 hüküm yer almaktadır. Bu defter nafaka, mehir, miras, boşama-boşanma, satış, alacak, sulh, vasi tayini, veraset gibi konuları içermektedir ve defterdeki tüm hükümlerin transkripsiyonu yapılmış özetleri çıkarılmıştır. Sicilde yer alan davalar, kayıt altına alındığı dönemin hukuk tarihi, kültürel tarih, ekonomik tarih, şehir tarihi, mimari tarih; Osmanlı toplum yapısı ve aile yapısına dair önemli detaylar verirken, Müslüman ve gayrimüslim halk arasındaki ilişki hakkında farklı açılardan fikir sahibi olmamıza imkân sağlamaktadır. Tüm yönleriyle incelenmeye çalışılan İstanbul Bâb Mahkemesi 108 numaralı Şer'iyye Sicili disiplinler arası çalışmaların istifadesine sunulmuştur. Bu tez çalışmasında incelenen hükümler, yalnızca tarih ve hukuk tarihi alanındaki çalışmacıların değil; sosyoloji, psikoloji, ekonomi, askeri tarih, sanat tarihi, mimarlık tarihi gibi alanlarda çalışanların da istifade edeceği kayıtlar olması hasebiyle bahsi geçen alanlarda çalışma yapanlar için başvurulabilir bir kaynak haline gelmiştir."
