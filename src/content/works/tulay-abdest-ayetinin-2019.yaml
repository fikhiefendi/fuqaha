abstract: "Abdest âyetinin anlaşılmasında edatların önemli bir yeri vardır. Zira edatların farklı tanımlanması, farklı mana yüklenmesinden dolayı abdest ile ilgili mevzuların hükmünü birebir etkilemiş, muhtelif görüşlerin ortaya çıkmasına hatta mezhepler arasında ciddi tartışmaların yaşanmasına neden olmuştur. Bu açıdan, konunun tam olarak açıklığa kavuşturulması yolunda daha doğru bir yaklaşım ortaya koymak için edatların iyi anlaşılması, öncelikle Kur'ân-ı Kerîm'de ne şekilde geçtiği, Arapların edatları nasıl ve hangi manalarda kullandıklarının bilinmesi gerekmektedir. Abdest âyetinde toplam 21 edat (harf) geçmektedir. Bu çalışmada, âyette geçen edatların her birini Arap Dilinde kullanıldığı tüm manaları ile ele aldık. Nahiv âlimleri ile beraber kırâat imamlarının, müfessirlerin ve fakihlerin de görüşlerine önemli ölçüde yer verdik. Âlimlerin edatlar hakkındaki görüşlerini değerlendirerek, abdest âyetinde geçen edatların hangi manalara delalet ettiği tespitlerine yer verdik. Bu bağlamda, mevzumuz ile ilgili yapılan bütün tartışmalara nedenleriyle beraber değindik."
