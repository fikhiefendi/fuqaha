abstract: "Alâeddin Esved, Osmanlı Devleti'nin ilk medresesi olan İznik Medresesi'nin üçüncü müderrisi olarak görev yapmış ve Osmanlı muhitinde fıkıh ilmine dâir eserleri ilk olarak o kaleme almıştır. Müderrislik yaptığı uzun yıllar içerisinde aralarında Şeyhulislamlık yapmış Molla Fenâri gibi bir ilim erbâbını, önemli bir devlet adamı ve kumandan olan Çandarlı Halil Hayreddin Paşa'yı ve Arap diline dair telif ettiği eserlerle şöhret bulan oğlu Hasan Paşa gibi şahsiyetleri yetiştirmiştir. Osmanlı telif geleneğinin –en azından fıkıh ile ilgili olarak- Alâeddin Esved ile başladığını söylemek mümkündür. Alâeddin Esved tedris faaliyetlerinin yanında tamamı şerh türü olan eserler yazmıştır. Bu çalışma, kuruluş devri Osmanlı ulemasından önemli bir şahsiyet olan Alâeddin Ali b. Ömer el-Esved'in (v. 800/1397) el-'İnâye fî şerhi'l-Vikâye adlı eserini merkeze alarak hayatını, kişiliğini ve ilmi mirasını araştırmayı hedeflemektedir. Bu çalışma giriş ve dört bölümden oluşmaktadır. Girişte, araştırmanın amacı, kapsamı ve yöntemi anlatılmıştır. Birinci bölümde Alâeddin Esved'in hayatı, eserleri ve ilmî kişiliği hakkında bilgi verilmiştir. İkinci bölümde müellifin el-'İnâye fî şerhi'l-Vikâye adlı eserinin kaynakları tanıtılmıştır. Üçüncü bölümde el-'İnâye fî şerhi'l-Vikâye'nin mutevâ tahlili yapılarak Alâeddin Esved'in şerh yöntemi çok yönlü olarak ele alınmıştır. Dördüncü bölümde ise müellifin tercih yöntemi tahlil edilmiştir. Her bölümün sonunda değerlendirmeler yapılmış ve çalışmadan elde edilen neticeler de sonuç kısmında özetlenmiştir. Anahtar Kelimeler: Alâeddin Esved, Hanefî Fıkhı, el-'İnâye fî şerhi'l-Vikâye, Medrese, İznik"
