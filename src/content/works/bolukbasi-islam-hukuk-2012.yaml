abstract: "İstihsan metodu kıyasın aşırılığını önlemek için başvurulan bir metoddur. Özellikle Hanefiler, birçok meselenin çözümünde bu metoda başvurmuşlar ve bu metodun sistemleşmesine öncülük etmişlerdir. Malikiler de karşılaştıkları bazı meselelerin çözümünde istihsan metodunu kullanmakla beraber, istihsanı müstakil bir delil olarak görmeyip onu maslahat-ı mürselenin bir cüz'i olarak değerlendirmişlerdir. İmam Şafii başta olmak üzere diğer Şafii hukukçular ve İbn Hazm istihsanı delilsiz zevke göre fetva vermek olarak değerlendirerek, istihsana göre fetva veren hukukçuları ağır bir dille eleştirmişlerdir. Sonraki dönem Hanefi imamlarının çabalarıyla istihsanın gerçek mahiyeti anlaşılmış ve İslam hukukçuları arasındaki ihtilaf da büyük ölçüde sona ermiştir."
