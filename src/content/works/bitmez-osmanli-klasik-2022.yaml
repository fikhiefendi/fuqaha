abstract: "Çalışmamız, Osmanlı klasik dönem fıkhî meselelerini kendi zamanının tarihçilerinin gözüyle tespit etmek, bunların arka planını irdelemek ve İslam hukuku açısından tespit etmek amacıyla hazırlanmıştır. Yaşadıkları dönemi yazılı olarak aktararak bilgi kaynaklığı yapan vakanüvisler, canlı şahit olmaları ve olayların topluma yansımalarını tespit etmeleri açısından büyük önem arz etmektedir. Bugünden geçmişe sağlıklı bir bakış açısı kazanabilmek ve önyargılardan kurtulabilmek açısından vakanüvislerin eserlerini ele almak bir zorunluluk haline gelmiştir. Çalışmamızın ilk bölümünde Osmanlı klasik dönemini farklı zaman dilimlerini sağlıklı olarak temsil edebilecek bir şekilde vakanüvislere ait eserlerden seçmeler yaptık. Sonrasında bu eserleri baştan sona taramak suretiyle İslam hukuku meselesi olabilecek tespitleri derledik. İkinci bölümde bu meseleler hakkında İslam hukuku uzmanlarının değerlendirmelerine ve şahsî kanaatlerimize yer verdik. Çalışmamızın birinci bölümünde tarama modeli, ikinci bölümünde ise nitel araştırma yöntemi kullanılmıştır. Bu çalışma ile vakanüvis kayıtları ve eserleri taranarak İslam hukukuna ait meselelerin tarihçilerin gözüyle nasıl görüldüğü ortaya konmuştur. Ayrıca bu çalışmada sadece tespitle yetinilmemiş, konunun uzmanları tarafından söz konusu dönemde ortaya çıkan meselelere ilişkin yapılan değerlendirmeler de ele alınmış ve döneme ait sağlıklı bir tablo ortaya çıkmasına gayret edilmiştir. Bu vesileyle söz konusu döneme ilişkin ortaya konan bazı hatalı ve eksik değerlendirmelerin tekrar gözden geçirilmesine imkân sağlanmış olmaktadır."
