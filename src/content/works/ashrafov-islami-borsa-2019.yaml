abstract: "İslam dininde faizin ve geleneksel finansta olan bazı araçların yasak olması nedeniyle dini hasassiyeti yüksek olan Müslümanlar sahip oldukları sermayeyi bu araçlarda kullanamamaktadır. Bu nedenle 70'li yıllarda İslami finans sistemi ortaya çıkmıştır. İslami finans kendisinde faiz ve belirsizlik içeren her türlü işlemleri yasaklamıştır. İslami finans İslami bankacılık ve İslami Sermaye Piyasaları olarak iki kola ayrılmıştır. İslami bankacılığın kendine has kurallarına uygun fon toplama ve fon kullandırma yöntemleri vardır. İslami sermaye piyasaları İslam dinine uyumlu hisse senetleri ve finansal araçların işlem görmesini sağlamaktadır. Son dönemlerde yaşanan global finansal krizlerin İslami finansa sınırlı etkisi nedeniyle genel yatırımcı kitlesinin İslami yatırım araçlarına ilgisi artırmıştır. Bunun nedeni olarak da İslami finansın faizden ve belirsizlikten az etkilenmesi gösterilmektedir. Bu çalışmada, ABD, Hindistan, Türkiye, Malezya, Japonya, Hindistan'da işlem gören 6 çift İslami ve geleneksel borsa endekslerinin performanslarının birbiriyle karşılaştırılması amaçlanmıştır. Endekslerin performansını değerlendirmek için performans değerlendirme ölçütü olarak, Sharpe rasyosu, Treynor oranı ve Jensen Alfa ölçütü kullanılmıştır."
