abstract: "Bu çalışma, Memlûk Devleti döneminde yaşamış olan tarihçi ve düşünür Ahmed b. Ali el-Makrîzî'nin (ö. 845/1442) iktisadî krizlere dair analizlerini incelemekte ve bu krizlerin sebepleri ile çözüm önerilerini sistematik bir çerçevede ele almaktadır. Makrîzî, yaşadığı dönemde Mısır'da ortaya çıkan ağır ekonomik buhranları gözlemlemiş, bunların nedenlerini tahlil etmiş ve çözüm yolları önermiştir. Bu yönüyle, yalnızca bir tarihçi değil, aynı zamanda iktisadî düşünceye katkı sunan bir mütefekkir olarak değerlendirilmiştir. Tezde, Makrîzî'nin para ve enflasyonla ilgili görüşleri Para Miktarı Teorisi, Gresham Yasası ve Altın Standardı gibi modern iktisat yaklaşımlarıyla karşılaştırılmıştır. Ayrıca, üretim faktörleri (emek, sermaye, toprak), tüketim ve tasarruf davranışları, gelir ve servet dağılımı gibi iktisadî krizleri etkileyen unsurlar da Makrîzî'nin perspektifinden detaylı biçimde analiz edilmiştir. Bunun yanı sıra, toplumun farklı kesimlerinin kriz dönemlerinden nasıl etkilendiği ve Makrîzî'nin önerdiği para ve maliye politikaları da değerlendirilmiştir. Araştırmada, klasik İslam iktisadının temel kavramları ile Makrîzî'nin düşünceleri arasında bağ kurulmuş, onun çözüm önerilerinin hem döneminin şartlarıyla uyumlu olduğu hem de modern iktisat literatüründe karşılık bulabilecek nitelikler taşıdığı ortaya konulmuştur. Bu yönüyle çalışma, hem İslam iktisat düşüncesi tarihi açısından hem de iktisadî krizlerle ilgili klasik dönem yaklaşımlarının anlaşılması bakımından katkı sağlamayı hedeflemektedir."
