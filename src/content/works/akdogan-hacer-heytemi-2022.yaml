abstract: "Allah'ın yeryüzünde halifesi olması hasebiyle insanoğlunun görevleri peygamberler vasıtasıyla beyan edilmiştir. Müslümanın görev ve sorumluluklarıda başta Kur'an ve sünnet olmak üzere icma, kıyas ve diğer edille-i şer'îyye ile belirtilmiştir. Söz konusu şer'î delilleri anlamak ve hüküm çıkarmak herkesin yapabileceği bir şey olmadığından dolayı insanlara rehberlik edecek âlimler hep var olmuştur. Bu âlimlerden biri Memlük Devletinin son dönemi ve Osmanlıların ilk döneminde yaşayan İbn Hacer el-Heytemî'dir. Heytemî'nin doğumu, gençliği ve ilim tahsili Mısır'da geçmiştir. Kendisi birçok eser kaleme almış velud bir müelliftir. Eserleri, hem yaşadığı döneme hem de sonraki dönemlere kılavuzluk etmiştir. Heytemî, Şâfiî mezhebinde Şeyhayn olarak bilinen Nevevî ve Râfiî'den sonra muteber ve seçkin fakihlerden biri olarak kabul edilmektedir. Şâfiî fıkıh ekolünün bıraktığı fıkhî mirası artırarak devam etmeye çalışan Heytemî'nin şahsı, bu ekol içerisindeilmî olgunluk ve metodolojik yetkinlik için örnek bir model ve pratik bir rehberdir. Bu çalışma, fıkhî yönü güçlü olan bir aliminfetva açısından öncülüğünü açığa çıkarma girişimidir. Bu çerçevede Heytemî'nin kendisine sorulan sorulara vermiş olduğu fetvaların yöntem ve metodunu inceledik. Kendisine yöneltilen sorulara cevap verirken nasıl bir yöntemi takip ettiğini ve hangi kaynaklardan yararlandığını tespit etmeye çalıştık."
