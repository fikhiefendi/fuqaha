abstract: "Mansurizade, Osmanlı İmparatorluğunun son devrinde yaşamış hukuk ve siyaset adamıdır. Şer'î cevâz ve siyasi otorite ile ilgili görüşleriyle dikkatleri üzerine çekmiştir. Bu görüşler, aynı zamanda Osmanlı imparatorluğundaki şer'î cevâz algısına da ışık tutmaktadır.Dönemin şer'î cevaz algısını anlamak için, Mansurizade'nin cevaz algısı bize yardımcı olmaktadır. Bu sebeple biz, çalışmamızda Mansurizade'nin cevaz algısını ortaya koymaya çalıştık. Öncelikle İslam hukukundaki cevaz algısını ortaya koyduk. Sonra Mansurizadenin eserlerini tarayarak konuyla alakalı makalelerini tespit ettik. Sonra bu makaleleri tahlil ederek mansurizadenin şer'î cevâz algısını belirledik.Çalışmamız bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Girişte tarihi arka planı verdik. Birinci bölümde kavram tahlili yaparak, İslam hukukundaki cevâz algısından kesitler sunduk. İkinci bölümde Osmanlı imparatorluğunda mecelleden sonraki şer'î cevâz algısıyla ilgili örnekler verdik. Son olarak Mansurizade'nin şer'î cevâz algısını ortaya koyduk. Sonuç kısmında çalışmanın genel bir değerlendirmesini yaparak çalışmamızı tamamladık."
