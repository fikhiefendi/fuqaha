abstract: "Sağlık sektöründeki büyük gelişmeler ister istemez dini alanı da etkilemektedir. Cerrahi operasyon ve türü ne olursa olsun organ nakli gerektiren çağdaş hastalıklar konusunda yapılan araştırmalar da bu gelişmelerden bir tanesidir. Bu araştırmada bu yeni gelişmelerin dini hükümleri tespit edilmeye çalışmıştır. Çünkü \"Tedavi olmaya bakınız Ey Allah'ın kulları! Zira Allah, yaşlılık dışında verdiği her bir hastalığın şifasını da yaratmıştır\" manasındaki hadis, gerek tıbbî gerek alternatif tıp gerekse de cerrahi ameliyatlarla her yolu deneyerek tedavi olmanın gerekliliğini ifade etmektedir. Bu durum organ nakli konusundaki yeni keşiflerin de, İslam hukuku perspektifinden değerlendirilmesini gerektirmektedir. Organı alınacak kişinin ölüm vaktinin belirlenmesi, beyin ölümü ve organ naklini hesaba katarak insanın yaşam ünitesinden çıkarılması gibi meselelerin dini boyutları açıklanmıştır. Araştırmada, İslam hukukuna göre organ nakli konusunda yeni ortaya çıkan \"domuzdan organ nakli, rahim ve sperm nakilleri, taşıyıcı annelik, nakli caiz olan ve olmayan organlar gibi hususlar ele alınarak bu konuda ortaya atılan görüşlerden tercihe şayan olanlar\" ın tespiti yapılmıştır. İslam hukuku ve tıp arasında bir mukayese yapılarak çağdaş tıp anlayışının dini alt yapısı ortaya konulmaya çalışılmıştır. Ayrıca şeri hükümleri istinbat etmek için tıbbi gelişmelerin ve kullanılan mekanizmaların İslam hukuku perspektifinden değerlendirilmesi de araştırmanın konuları arasındadır. Makâsıd maksatlı içtihadın çağdaş meselelerin çözümündeki önemi, bunların organ nakli alanında kaydedilen gelişmelere tatbik edilmesi ve şeri hukuk nazarından bunların kabulü, reddi veya belli şartlar getirilmesi gibi hususlardan da istifade edilerek, ölü veya canlı insandan veya helal olana ve olmayan hayvanlardan organ nakli konusunda İslam hukukuna göre değerlendirmeler yapılmıştır."
