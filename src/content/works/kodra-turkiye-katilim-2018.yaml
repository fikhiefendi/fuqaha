abstract: "Günümüz dünyasında bir ihtiyaç haline gelen bir ekonomik yaklaşım söz konusudur. İslami bankacılık alanında yapılan çalışmalarla bu ihtiyaçlara cevaplar aranmaktadır. Bu çalışmalar da ekonominin birçok alanında yapılmaktadır. Ama Finans kısmında da bu konular ele alınarak ayrı bir önem arz etmektedir. Finans içerisinde de birinci sırada bankacılık sistemi karşımıza çıkmaktadır. Türkiye'de finansı oluşturan ögeler arasında bankacılığın payı % 60 'tır. İslam ekonomisine bankacılığı da dâhil ettiğimizde çok ivmeli bir ilerleyiş görülebilmektedir. Türkiye'de hâlihazırda özel ve devlet olmak üzere bu konularda yapılan teşebbüsler vardır. Tezimde bütün bu gelişmelere, uygulamanın İslami bankacılık sisteminin metotlarına, politikalarına, ekonomik yaklaşımları üzerine yoğunlaştım. Dünya'da da bu alana büyük ölçüde rağbet edildiği görülmektedir. Bu konuya ilgi duyan ülkeler arasında İngiltere gibi Müslüman olmayan devletler de mevcuttur. Müslüman ülkeler bu alandaki potansiyelini kullanarak çok farklı adımlar atabilirler. Böylece İslam ekonomisini ve katılım bankacılığını iyi anlamaya ve verimli bir şekilde uygulamaya ihtiyacımız vardır."
