abstract: "İslam ümmetini hayırlı olarak nitelendirmek büyük bir ibrettir ve Kuran Kerimde reşit bir yoldur. Bu çalışma, hayır kavramını tüm türleri, dalları ve durumlarını açıklamak etrafında dönmektedir, daha sonra ümmet üzerine erdemini ve ümmettin üzerine kurulduğu temeller ve bileşenleri beyan etmiştir, derin tarihi ile öne çıkan bu milletin ve karışıklık veya belirsizlik içermeyen net asaletinin özelliklerini belirtmiştir, bu milletin başlangıcından günümüze kadar, yaşadığı tüm felaketlere rağmen İslam'ın doğru öğretilerinden ve peygamberden yararlandığı için asaletini, kimliğini ve prestijini korumuştur, böylece bu ümmettin her birey, Allah'tan uzaklaşmanın karanlığında kaybolmuş insanlık arasında Allah'a davet etme ve İslam'ın öğretilerini yayma sorumluluğunu hissetmeye başladı, yük ağır emanet yücedir. Ama sonuçta Allah'ın bu dini galip edeceği inancı, herkesi bu dine hizmet etmek için elinden geldiği kadar çaba sarf etmeye yöneltmiştir. Bu çalışma, ümmettin bağlı kaldığı semavi kitaplarının (Kuran Kerim) en erdemlinin hayırlığına işaret etmektedir, erdemliğini ve öğrenmesinin erdemliğini beyan etmiştir ve tüm yaşamın ana yasası olduğunu belirtmiştir. Bu yolda, hem selef hem de halef Müslümanlar, Allah'ın Kitabında bildirilmiş olan hayırları ve Peygamber Efendimiz'in meşhur hadislerini örnek aldılar, ta ki söz ve fiilde peygamberin siyerinde yüksek fener olana kadar, zira o bizim örnek aldığımız kişidir, ayrıca çalışma erdemleri, ahlakı ve ailesi, arkadaşları, düşmanları ve genel olarak insanlarla iyi ilişkilerinin bir göstergesi ile onun yardımseverliğine atıfta bulundu, bu hayırlık tabiienin nefislerinde, hayatlarında ve ahlaklarında devam etmiştir, ta ki kendilerinden sonrakiler için imanda, ilimde ve amelde bir delil oluncaya kadar, kıyamet kopana kadar müminlerin hayırlığı beyn edilmiştir. Bu araştırma hayırlığı tüm türleri, durumları, yolları ve amaçlarını beyan etmiştir, tüm bunlar Müslümanın dininin hakikatine dair kavrayışı içindir. Anahtar Kelimleler : Tefsir, Wasatiye, Kavram, Ümmet, Kapsam, Adalet, Beriye, Hayriye"
