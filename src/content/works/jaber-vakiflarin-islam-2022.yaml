abstract: "İslam ülkelerinin medeniyet inşası ve kalkınmasında, toplumun çeşitli ihtiyaçlarının karşılanmasında ve insanların geneli için faydalı programların desteklenmesinde vakıfların büyük bir etkisi vardır. İslam tarihi, Peygamber Efendimizin (sav) döneminden günümüze kadar Müslümanların faydasına hizmet eden vakıf tecrübeleriyle doludur. MeşruiyetiniKur'ân, Sünnet ve İcma'dan alan vakıflar; camiler, okullar, kütüphaneler, yetimhaneler, hastaneler kurmakla yetinmemiş, hatta hayvanları ve çevreyi korumak için müesseseler kurmuşlardır. Hayır işlerini ve kalkınmayı desteklemek için inşa edilen bu vakıflara ait kayıtlar ve belgeler buna şahitlik yapmaktadır. Vakıf sistemi, sosyal yapının güçlendirilmesi konusunda büyük etkiye sahip olan çeşitli aktivitelerle, kurumlarla ve projelerle sıkı bir irtibat halindedir.Ayrıca vakıf sistemi; arazi, gayrimenkul ve üretim araçları gibi muhtelif servet türlerini, bunun yanı sıra dinî, iktisadi ve ictimai hayatın çeşitli alanlarını kapsayacak şekilde geniş bir yelpazeye sahiptir. Arap ve İslam toplumlarının ilerlemesinde ve gelişmesinde, ayrıca iktisadi kalkınmaya katkıda bulunan modern mevzuatın ortaya çıkmasında büyük önem taşıyan eğitim, bilgi ve bilimsel araştırma alanlarını destekleme konusunda vakıfların büyük bir etkisi bulunmaktadır. Araştırmanın önemi, vakıfların İslam iktisadı araştırmacıları nezdinde büyük bir yere sahip olmasından kaynaklanmaktadır. Zira vakıflar, eğitimi, sağlığı ve bilimsel ilerlemeyi destekleyerek iktisadi kalkınma üzerinde önemli bir rolesahiptir. Ayrıca tarım, sanayi ve ticaret sektörlerinin gelişmesine, toplumun üretim kapasitesinin artmasına ve istihdam düzeyinin yükselmesine, devlet üzerindeki yüklerin hafifletilmesine ve daha pek çok konuda katkısağlamışlardır. Bu nedenle vakıf sistemi, İslam ülkelerindeki ekonomilerin gelişmesinde ve diğer milletlere nazaran temayüz etmesinde büyük etkisi olan ve olmaya devam eden sistemlerden biridir. Bunların yanı sıra, İslam ülkelerinin geri kalmışlık tezahürlerinden mustarip olmaları, vakıfları, İslam toplumlarına hizmet edecek şekilde iktisadi kalkınmayı destekleme konusunda daha büyük bir role sahip olmaları yönünde onları zorlamaktadır. Bütün bunlar, konunun İslam Hukuku açısından ele alınarak incelenmesini gerekli kılmıştır. Buradan hareketle konuyu \"Vakıfların İslam İktisadının Gelişmesindeki Etkisi\" başlığı altında inceledik. Tez bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında araştırmanın amacı, önemi, metodu ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde vakıf kavramı, vakfın meşruiyeti, rükünleri, tarihi, türleri, fonksiyonları ve karşılaştığı sorunlar ele alınmıştır. İkinci bölümde vakıfların iktisadi hayatın gelişmesine etkisi, iktisadi fonksiyonları, vakıf yatırımları ve destekleri, finansman temini ve ortaklık, vakıf işletmeleri, vakıfların eğitime katkısı ve sosyal hayattaki rolü gibi konular üzerinde durulmuştur. Sonuç bölümünde ise araştırma boyunca elde edilen bulgular özetlenerek önerilere yer verilmiştir. Böylece vakıfların İslam iktisadına etkisinin olup olmadığı, varsa nasıl bir etkisinin olduğu ve nasıl bir katkı sağladığı temel kaynaklar ışığında tespit edilmiş oldu. Araştırma neticesinde vakıfların, muhtelif rolleriyle, etki alanlarıyla ve yatırımlarıyla toplum ve birey üzerinde olduğu kadar iktisat üzerinde de olumlu ve önemli bir etkiye sahip olduğu ortaya çıkmıştır. Bizlere düşen, vakıfların toplum içindeki rolünü tıpkı önceki dönemlerde olduğu gibi, hatta daha iyi bir şekilde ihya etmek ve devam ettirmektir. Anahtar Sözcükler: Vakıf, İslam Hukuku, İktisat, Yatırım, İşletme."
