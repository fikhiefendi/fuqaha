abstract: "Genel olarak şer'î bir hükmün daha sonra gelen şer'î bir hükümle yürürlükten kaldırılması şeklinde tanımlanan nesih farklı disiplinler tarafından ele alınarak araştırmaya konu olan önemli kavramlardan biridir. Müslümanlar arasında neshin aklen câiz şer'an vaki olduğu hakkında şâz sayılabilecek bazı kimseler istisna tutulursa ittifak vardır. Kur'an ve sünnet naslarını en doğru şekilde anlamak, zahirde birbiriyle çelişkili gibi görünen nasların telifi, doğru hükümlere ulaşmak, yürürlükte olan hükümlerle yürürlükte olmayanların tespitini yapmak gibi meselelerle ilişkisi sebebiyle fıkıh usûlü ilmi için de konu olan nesih kavramı, mahiyeti ve içeriği açısından usûl âlimleri arasında çok tartışılmıştır. Bu çalışmada Mu'tezile'nin önde gelen temsilcilerinden biri olan Ebu'l-Hüseyin el-Basrî'nin mütekellim metoduna göre yazılan el-Mu`temed adlı usûl eserinden hareketle onun neshin tanımı, mahiyeti, neshin imkânı, vaki olması, Kur'an'daki nesih çeşitleri, birbirini neshedip edemeyen deliller gibi nesihle ilgili hususlardaki görüşleri tespit edilmeye ve Basrî'nin kendine özgü tercihleri ve kanaatleri ortaya konulmaya çalışılmıştır"
