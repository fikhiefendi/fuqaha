abstract: "Tez giriş, dört bölüm ve sonuç kısmından oluşmaktadır.Girişte tezin ana çerçevesi ve metodu ortaya konmuştur.Birinci bölümde, benimseme, zorla benimsetme, bir hukuki olgunun aktarılması ile kanunlaştırma kavramının genel çerçevesi ele alınmıştır.İkinci bölümde, genel hukuk tarihindeki başlıca kanunlaştırma faaliyetleri ele alınmıştır. Hammurabi Kanunlaştırması, Manou Kanunu, Bochoris Kanunu, Dracon Kanunu, Solon Kanunu, On iki Levha Kanunu, Corpus Juris Civilis, Tang Hanedanlığı Kanunu, Qing Hanedanlığı Kanunu, Cengiz Han Yasası, Prusya Genel Memleket Kanunu, Fransız Kanunlaştırması, Avusturya Kanunlaştırması, Hollanda Kanunlaştırması, Alman Kanunlaştırması, Rusya Kanunlaştırması ve İsviçre Kanunlaştırması üzerinde durulmuştur.Üçüncü bölümde, örneklerini genel hukuk tarihinde gördüğümüz tarzda müstakil bir kanunlaştırmanın İslam hukuk tarihinde meydana gelmediği üzerinde durulmuştur. İslâm hukukunun ilahi kaynaklı bir hukuk sistemi olması ve içtihat düşüncesine dayalı olması nedeniyle meydana gelen kanunlaştırmalar şeklî kanunlaştırma kapsamında mütalaa edilmiştir.Dördüncü bölümde ise İslâm hukuk tarihinde ortaya çıkan şeklî kanunlaştırma faaliyetleri incelenmiştir. Bu bağlamda Emevîler, Abbasiler, Selçuklular ve Osmanlı Dönemi kanunlaştırma faaliyetleri ile son dönem İslâm ülkelerinde yapılan hukukun İslâmileştirilmesi çalışmaları ele alınmıştır."
