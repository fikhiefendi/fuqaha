abstract: "Araştırmamda İslam hukuk tarihinde önde gelen Hanefi alimlerden biri olan Muhammed b. Şüca es-Selci'nin fıkıh ilmi ile ilgili görüşlerini tespit etmek ve diğer mezheplerin görüşleri ile mukayesesi üzerinde çalıştım. Muhammed b. Şüca es-Selci'nin hayatı ve eserleri hakkındaki bilgiler toplanmış, düzenlenmiş, doğrusu ile yanlışını belirtilmiştir. Müellifin yaşadığı dönem siyasi, sosyal ve ilmi açıdan inceleyerek bu durumdan ne kadar etkilendiği belirlenmeye çalışılmıştır. Eserleri, ders aldığı hocaları ve yetiştirdiği öğrencileri tanıtılmıştır. Müellifin görüş belirttiği fıkhi meseleler derlenip uygun şekilde başlıklandırılmıştır. Görüşlerini kabul edenler belirtilmiştir. Ayrıca diğer mezheplerin görüşleri ve delilleri belirtilip tartışmaya açılmış ve kendi görüşümüz belirtilmiştir. Sonuçta Muhammed b. Şüca es-Selci'nin takva ve ibadet ehli bir alim olduğu, içtihat ve tercih melekesine sahip bir müçtehit olduğu ortaya konulmuştur."
