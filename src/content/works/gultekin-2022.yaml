abstract: "Bu çalışma, birçok ülkede onaylanan ve yine çoğunun onu gerçekleştirmek için uygulamalara başladığı 'Sürdürülebilir Kalkınma' gibi güncel bir konuyu ele almaktadır. Çalışmanın ikinci yönü de İslami finansın sürdürülebilir kalkınmadaki durumu ve İslam hukukunun amaçlarına yani makasıdı şeriaya uygunluğudur. Aynı zamanda Malezya İslami bankacılık uygulamalarını baz alan fıkhi ve makasıdi bir çalışmadır. Bu çalışmanın temel amacı, İslami finansın sürdürülebilir kalkınmaya ve Şeriat'ın amaçlarına gerçekleştirmedeki etkisini bulmak ve Malezya İslami bankacılık sektöründe sürdürülebilir kalkınmanın gerçekleştirilmesinde İslami finans yöntemlerinin kullanılması yoluyla Şeriat'ın amaçlarının ne ölçüde gözetildiğini göstermektir. Çalışma, tümevarımsal (istikrai) yaklaşım ve analitik yaklaşım olmak üzere iki temel metodu esas almıştır. Tümevarımsal yaklaşım, sürdürülebilir kalkınma konusu ve bunun İslami finansla ilişkisi ve İslam hukukunun amaç ve gayeleri ile uyumluluğu konusunda İslam iktisadı ilim adamlarının, hukukçuların ve uzmanların sözlerini ve görüşlerini ele alır. Analitik yaklaşım ise elde edilen klasik fıkhi materyaller ile Malezya İslami bankacılık sektöründe, İslami finans ile ilgili otoritelerden toplanan bilimsel ve fıkhi materyalleri ve yayınlanmış istatistikleri tartışmak ve konuyla ilgili en doğru sonuca ulaşmak ve bunları sınıflandırmak için kullanılmıştır. Çalışma sonucundan ulaşılan sonuçlar arasında en önemlilerinden bazıları; Malezya İslami bankalarının sürdürülebilir kalkınmayı sağlamak için İslami finansı etkin biçimde kullandığı, ancak şeri yöntemler yoluyla beş temel maksattan olan dinin korunması ve neslin korunması amacına ulaşmak için daha fazla özen göstermeye ihtiyaç duymaktadır. Bunun yanında ilgili bankalar kendilerine daha fazla kar getiren ürün ve projelere odaklanmış olup, bankaların yıllık faaliyet raporlarından alınan bilgilere göre banka finansmanının dağılımında bu durum açıkça görülmektedir. Ayrıca Malezya İslami bankaları, banka finansmanlarını şeri yöntemler aracılığıyla tahsis ederken Malezya toplumunun ihtiyaçlarını dikkate almalıdır. Çünkü bur şeri yöntemler (siğalar) yoksulluğun ve açlığın ortadan kaldırılması, insanların ekonomik durumlarının iyileştirilmesi, eğitim kalitesinin yükseltilmesi, insana yakışır bir yaşam ortamının oluşturulması konusunda dünyanın en iyi deneyimlerinden biridir."
