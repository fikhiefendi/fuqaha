abstract: "Şerî deliller arasında ikinci sırada yer alması yönüyle Sünnet dinin kaynakları içerisinde alternatifi olmayan bir konuma sahiptir. Bu önemine binaen, dar anlamıyla Sünnet'in sözlü malzemesini ifade eden hadislere hiçbir fıkhî mezhepte olmadığı gibi Hanefî mezhebinde de bigâne kalınmamış, fıkhî meselelerin çözüme kavuşturulmasında hadisler birinci derecede etkili olmuştur. Bu çalışmada farklı dönem ve coğrafyada yaşamış dört Hanefî fakihin eserleri merkeze alınmıştır. Bunlar Şeybânî'nin Kitâbü'l-Asl, Tahâvî'nin Şerhu meâni'l-âsâr, Cessâs'ın Şerhu muhtasaru't-Tahâvî ve Serahsî'nin el-Mebsût adlı eserleridir. Birinci bölümde öncelikle Hanefî mezhebinde icâre akdine dair teknik bilgiler Hanefî kaynaklarından yararlanılarak ana hatlarıyla sunulmuştur. Daha sonra bu dört eser özelinde icâre akdiyle ilgili fıkhî meselelerde ihticâc edilen rivayet malzemesi ve adı geçen fakihlerin söz konusu rivayetlere yaklaşım biçimi, onlara getirdikleri yorumlar tespit edilmiştir. Tespit edilen rivayetler ikinci bölümde öncelikle bazı açılardan rivayet ilmine yönelik değerlendirilmiştir. Böylelikle Hanefî fakihlerin ihticâc ettikleri rivayetlerin hangi hadis mecmualarında geçtiği, metin açısından rivayetler arası benzerlik durumuna dair mukayese imkanı sunulmuş, Hanefî fakihlerin ihticâc ettikleri rivayetleri tahammül ve edâ ettikleri kişilerin cerh ve ta'dîl âlimleri nezdindeki değerleri tespit edilmiştir. Daha sonra bu rivayetler bazı açılardan Hanefî haber teorisindeki kriterler üzerinden değerlendirilmiştir."
