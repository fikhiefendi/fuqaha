abstract: "Bu el yazması,“Tahmisu'l-Kasaidi'l-Veteriyye”nin enfes bir şerhi olup bu kasideler yüce peygambere duyulan büyük muhabbetin ifadesi olarak karşımıza çıkmaktadır. Yine bu kasidelerde peygamberin şemaili, ahlakı, doğuştan gelen özellikleri ve huyları dile getirilmektedir. Veteriye'nin müellifi derin bir manevi nefesi olan mutasavvıf vaiz Muhammed bin Ebu Bekr bin Reşid el Bağdadî olup ondan sonra gelen Muhammesin müellifi olan Muhammed bin Abdulaziz bin Abdulmelik bin Şaban el-Verrâk bin el-Muezzin gelmiş, bu sıfatların yanı sıra bu şemaili keyifli ince bir üslupla geliştirmiştir. Veteriye'de ve Tahmisinde Mustafa'nın haberleri, Muhammed'in sıfatları ve Peygamber'in şemailinden değerli değersiz, doğru yanlış, güvenilir güvenilmez birçok şey yer almış, özellikle de sözü çok edilmiş olan gaip ile ilgili konulara yer verilmiştir. - Veteriyye'yi Ali bin Sultan Muhammed el Karî el Mekkî el Hanfî olan Ali el Karî ço güzel bir şekilde şerh etmiştir. Çünkü Karî, her zamanki gibi şiiri ayıklama, araştırma ve inceleme yoluna giderek ulaşabildiği nüshaların yanı sıra doğru ile yanlış arasında karşılaştırma yapmaya gayret etmiştir. Böylece doğru olanlarını tespit ettikten sonra geri kalan yalan yanlış nüshaları belirleyerek bunun nedenlerinden söz etmiş, yapılan tahrifat ve değişiklikleri açıklamıştır. - Biz araştırmamızda en iyi el yazması nüshalarını kullandık. Laleli Kütüphanesi'nde bulunan ve araştırmada (L) simgesiyle gösterilen ana nüshayı Aşir Efendi Kütüphanesi'nde bulunan ve araştırmada (A) simgesiyle gösterilen ikinci nüshayla ve Lala İsmail Kütüphanesinde bulunan ve (S) simgesiyle gösterilen üçüncü nüshayla karşılaştırdım. Daha sonra nüshalar arasındaki farkları haşiyede kaydetme yoluna gittim. - Ana nüshanın sayfa numaralarını metin içerisinde yazarak sayfa numarasıyla başladım. Daha sonra tablonun sağ yüzüne geçerek (A) simgesiyle gösterdim. Tablonun sol yüzünü ise (B) simgesiyle gösterdim. - Kur'an ayetlerini kaydedip hadis-i şerifleri çıkardıktan sonra rivayet edilmiş eserleri belirleyip söylenmiş sözleri sahiplerine dayandırma yoluna gittim. Bu arada yabancı kelimeleri sözlüklerde bulup anlamlarını belirleme yoluna gittim. Aynı şekilde el yazmasında isimleri geçen kimselerin hayat hikayelerine yer verdim. - Yine müellif ile ilgili bir yazı yazmak suretiyle hayatının en önemli yönlerini ele aldım. Özellikle hakkında çok yanlış yapılan doğum yılı üzerinde durdum. Hicri 930 olarak verilen doğum yılı gerçek doğum yılı olup kendisi Hicrî onuncu yüzyıl başlarında doğmuştur. - Faydalandığım kaynakları müelliflerinin ölüm tarihlerine göre sıralamaya özen gösterdim. - Aynı şekilde el yazması ile ilgili bir konu yazarak söz konusu el yazmasının dikkat çeken dil, dilbilgisi ve benzeri diğer konularla ilgili özelliklerini ele aldım. Araştırma çerçevesinde ayrıca el yazması nüshalar ile ilgili ayrıntılı bilgiler vererek izlemiş olduğum araştırma yöntemini anlattım. Böylece çalışmamı, öneri ve sonuçlara yer verdiğim bir sonuç bölümüyle bitirmiş oldum. - Benim bu el yazması nüsha ile ilgili olarak vardığım en önemli sonuç, Ali el Karî'nin bu el yazması için herhangi bir isim belirlemediği, nüshalarda bu el yazması ile ilgili olarak mevcut isimlerin ise askında nasihler tarafından konulmuş isimler olduğu şeklindedir."
