abstract: "Finans sektörü içerisinde son yıllarda Türkiye ve dünya genelinde hızla büyüyen katılım bankaları faizsiz finansman ilkelerini benimsemekte ve İslami finans prensiplerine dayanarak faaliyetlerini sürdürmektedir. Katılım bankaları yalnızca bireyler için değil işletmeler için de cazip bir alternatif haline gelmiştir. Bu bağlamda bu bankaların işletmeler tarafından nasıl algılandığını ve tercih edilme nedenlerini anlamak kritik öneme sahiptir. Bu çalışmanın amacı işletmelerin katılım bankalarına yönelik algılarını ve tercih nedenlerini belirlemektir. Çalışmada işletmelerin katılım bankalarını neden tercih ettikleri, bu bankaların sunduğu finansal hizmetlere yönelik algıları ve işletmelerin bu bankalardan beklentilerinin neler olduğu üzerine yoğunlaşılmıştır. Bu amaçla verilerin toplanmasında nitel araştırma desenlerinden örnek olay modeli benimsenerek amaçlı örnekleme yöntemi ile belirlenen 9 kurumsal işletme yöneticisi ile yüz yüze görüşmeler gerçekleştirilmiştir. Elde edilen veriler Maxqda paket programı ile analiz edilmiştir. Araştırma sonucunda işletmelerin katılım bankalarına ilişkin algılarının düşük bilgi düzeylerinin de yalnızca kullandıkları ürün ve hizmetlerle sınırlı olduğu tespit edilmiştir. İşletmelerin katılım bankacılığı tercih nedenleri ise çalışma prensibi, dini faktörler, ekonomik faktörler, bireysel faktörler ve referans grupları olarak sıralanmıştır. Bu çalışmada literatürden farklı olarak işletmelerin algı ve tercih nedenlerine özgü yeni temalar ortaya çıkmıştır. Bunlar sırasıyla; çalışma prensibi faktörü içerisinde yer alan kullanılan fonların doğrudan ticarete yönelik olması, ticareti teşvik etmesi, yapılan işlemlerin reel ticaretle ülke ekonomisine katkı sağlaması temaları. Dini faktörler içerisinde yer alan ticarette dini hassasiyetin olması, işletmelere bereket ve karlılık katması ve fetva kararlarının olması temaları. Ekonomik faktörler içerisinde yer alan katılım bankalarının işletmelerin makine ve hammadde yatırımında ve büyüme ihtiyacında kullanılması, işletmelerin finansal yapısının güçlenmesine katkı sağlaması ve limit şartları ve fiyatlandırmalar temalarıdır."
