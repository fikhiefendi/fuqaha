abstract: "Tezin ana konusunu Diyanet İşleri Başkanlığı tarafından kurulan komisyon üyelerince telif edilen Hadislerle İslam eserinde âile hukuku açısından ahkâm hadislerinin değerlendirilmesi oluşturmaktadır. Bu yüzden çalışmada âile hukuku ile ilgili konulara genel manada yer verilmiştir. Ardından Hadislerle İslam'da zikredilen âile hukuku ile ilgili hadislere dair yorumlar, tahliller ve tercihler incelenmiştir. Komisyonun ortaya koymuş olduğu tercihler hangi hadislere dayanmaktadır bu husus tespit edilmeye çalışılmıştır. Bu çalışma iki bölümden oluşmaktadır. İlk bölümde genel anlamda âile hukukunun neyi ifade ettiği konu edilmiştir. Sonrasında evlilik öncesi evreler yani kız isteme, nişanlanma vb. konular işlenmiştir. Ayrıca nikâh ve nikâhla ilintili hususlar ele alınmıştır. İlgili bölümde evlilik çeşitlerine, kadının nikâh akdiyle hak ettiği mehre ve nafakaya, nikâhın hükmüne ve kaç kişiyle evlenilebileceğine değinilmiştir. İkinci bölümde ise boşanma ve boşanmadan doğan sonuçlar etraflıca incelenmiştir."
