abstract: "Filozoflar, kelâmcılar, tasavvufçular ve fıkıhçılar hikmet kavramıyla ilgilenmişler ve bu kavramı kendi ilmi disiplinleri açısından değerlendirmeye çalışmışlardır. Hikmet kavramı değişik açılardan tanımlanmıştır. Lügat manasından hareketle yapılan tanımlara baktığımızda hikmet, bazen isabetli bir söz, bazen yerli yerinde bir davranış, bazen eşyanın hakikatini bilmek, bazen hakta isabet etmek, bazen ise bir kimsenin söz, fiil ve davranışlarının tamamında yerli yerinde hareket etmesi anlamlarına gelir. Yapılan tanımlardan ortaya çıkan ortak sonuç, hikmetin eşyanın hakikatini bilmek şeklindeki tanımıdır. Fıkıh usûlünde hikmet, hükümlerin illet ve sebeplerine bağlanması açısından bir maslahatın sağlanması ve bir mefsedetin giderilmesidir. İslâm hukukçularının geneli açık ve munzabıt olmayan hikmetlerle ta'lîlde bulunmayı kabul etmemişlerdir. Şeriatın vâcip kıldığı hususlar hikmeti bilinip bilinmeme durumuna göre ise üç kısımdır: Yalnız teabbudî olanlar: Cemerât'a taş atılması gibi. Teabbudî olmayıp tamamen makul olanlar: İnsanlara olan borcunu ödeme ve gasp ettiği malı iade etmesi gibi. Hem ma'kûl hem de teabbudî yönü olanlar: Zekât ve hacc bu kabilden bir ibadettir. Bir maslahatın sağlanması veya bir mefsedetin giderilmesi açısından hikmet ise üç temel prensipte mütalaa edilmiştir: Birincisi zaruriyyat, ikincisi haciyyat, üçüncüsü tahsiniyyattır. Allah'ın kullarına emrettiği ibadetlerin illetleri değil ancak hikmetleri bilinebilir. Bu nedenle biz kullar olarak ibadetlerde mümkün mertebe bu hikmetleri tespit etmeye çalışmalıyız. Çünkü ibadetlerin hikmetlerini bilmek kişiyi ibadetlere imtisale ve Allah'a bağlılığa daha çok sevk eder."
