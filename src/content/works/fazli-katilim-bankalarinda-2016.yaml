abstract: "Bu tez çalışmasında Türkiye'de oldukça yeni olan katılım bankalarının aktif-pasif yapılarının analiz edilmesi ve aktif-pasif yönetimleri ile ilgili ayrıntılı bir değerlendirme yapılması amaçlanmıştır. Bunun için ilgili banka grubunun 2010-2014 periyoduna ait finansal tablo verilerinden faydalanılmıştır. Kullanılan finansal verilerin önemli bölümü Katılım Bankaları Birliği'nin internet sayfasından, tamamlayıcı bazı bilgiler de ilgili bankaların faaliyet raporlarından sağlanmıştır. Katılım bankaları‚ faizsiz işlem esasına göre yapılandırılmaya çalışılan finansal kurumlardır. Bu nedenle kendilerine özgü işlem süreçleri, sözleşme türleri, enstrümanlar geliştirmeye çalışmaktadırlar. Bu durumun geleneksel bankalarla aynı finansal piyasalarda beraber faaliyet gösteren katılım bankalarının, aktif-pasif ve risk yapılarında farklılaşmalara yol açacağı açıktır. Çalışmada da öncelikle bu yapıların kavramsal açıklamaları yapılmış, daha sonra çalışma örneğindeki bankaların aktif-pasif yönetimleri ile ilgili performansları oran analizi yöntemi kullanılarak karşılaştırmalı olarak ortaya konmuştur. Çalışmada yapılan analizlerde hem sektöre hem de katılım bankalarının kendilerine ait önemli bulgular elde edilmiştir. Öne çıkan bulgulara bakılacak olursa; incelenen dönem içinde katılım bankaları, asgari sermaye yeterliliği oranlarını BDDK'nun belirlemiş olduğu standart değerin üzerinde tutmayı başarabilmişlerdir. Likidite oranlarına bakıldığında Asya Katılım Bankası'nın genelde sektör ortalamalarının altında kaldığı görülmüştür. Sektörel olarak değerlendirme yapıldığında ise likidite derecesinin zaman içerisinde yükseldiğini söylemek mümkündür.Takipteki krediler açısından, incelenen dönemde Asya Katılım Bankası bu sefer sektörel ortalamanın altında kalmıştır. Katılım bankalarının varlıklarının en önemli kısmının verdikleri kredilerden oluştuğu düşünülecek olursa bu durum, kredi riski açısından olumlu olarak değerlendirilebilir.Özellikle 2013 yılından itibaren incelenen katılım bankalarının verdikleri kredilerde ve özkaynak tutarlarında azalmalar olduğu ve bu durumun kârlılıklarını olumsuz yönde etkilediği anlaşılmıştır.Ayrıca 2013 ve 2014 yıllarında katılım bankalarının şube sayılarında ciddi artışlar olmasına rağmen bunun kârlılığa önemli bir katkısı olmadığı görülmektedir. Bu durum verimlilikle ilgili soru işaretleri oluşturmaktadır.İncelenen katılım bankalarının döviz pozisyonu oranlarının değerleri genelde dalgalı seyirler izlemişlerdir. Bu seyir şekli, geleneksel bankalar gibi katılım bankalarının döviz kuru riski yönetimine çok önem vermesi gerektiğini ortaya koymuştur. Türev finansal araç kullanımına bakıldığında ise, katılım bankalarının bu araçları çok tercih etmedikleri anlaşılmıştır. Bu konuda Kuveyt Türk Katılım Bankası'nın öncülük ettiği görülmüştür. Sonuçta çalışma kapsamında yapılan araştırma ve analizler, aktif-pasif yönetimi ve risk yapısı açısından katılım bankalarının geleneksel bankalara benzeyen birçok yönü olduğunu, aynı zamanda kendilerine özgü çok önemli farklılıklar da taşıdıklarını ortaya koymuştur."
