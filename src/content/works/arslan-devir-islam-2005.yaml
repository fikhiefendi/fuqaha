abstract: "ÖZETİLK DEVİR İSLAM CEZA HUKUKUNDA HADD CEZALARININ İNFAZIİslam hukukunda mahkemece verilen ceza hükmünün infazı, ?hadd?, ?kısas-diyet? ve ?ta'zir? şeklinde ele alınır.Tezimizi işlerken, cezalar, hadd cezaları, infaz kavramı, hadd cezaları veinfazı ile infaz yerleri konularını sırasıyla ele alarak hadd cezalarının infazıhakkında topluca bir bilgiye ulaşmaya çalıştık.İslâm hukukunda cezalar suçlara göre farklılık arz eder. Hadd cezaları;miktarı ve sınırları daha önceden Allah tarafından taktir olunmuş, yüce yaratıcınınkulları üzerindeki bir hakkı olarak algılanmıştır. Hadd cezalarını gerektiren suçlarınsayıları sınırlıdır ve nass ile sabittir.İnfaza başlayabilmek için mahkeme kararının kesinleşmesi gerekir. İslamhukukunda suçun sübutunu sağlayan ıspat yolları, kararın kesinleşmesi manasıtaşıdığından, bunları İslam ceza hukukunda infazın şartı olarak tespit ettik.Yine cezanın infazının meşruiyyet şartları arasında infazın kanuniliği,şahsiliği ve umumiliği kavramlarını tespit ettik.İslam ceza hukukunda bazı cezaların infazının şartlı olarak ertelenmesimümkündür.Hz. Peygamber ?s.a.v? dönemindeki infazın gerçekleştirildiği yerlerin, sabitbir infaz mekanı değil de, duruma ve şartlara göre değişkenliği bulunan yerlerolduğu kanısına vardık."
