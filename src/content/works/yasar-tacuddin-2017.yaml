abstract: "Çalışmamızın konusu Memlûkler devletinde idârî ve adlî birçok vazifeyi deruhte eden, dönemin önemli medreselerinde müderrislik yaparak çok sayıda âlim yetiştiren ve usûl ilminde fukahâ ve mütekellimîn metotlarının sentezlendiği memzûc metodun en güzel örneğini veren Şâfiî âlim Tacüddîn es-Sübkî'nin hayatı, eserleri ve usûl düşüncesini kapsamaktadır. Çok yönlü bir âlim olan Sübkî başta tarih, fıkıh ve hadis olmak üzere İslâmî ilimlerin birçok alanında birbirinden değerli çeşitli eserler telif etmiştir. Ancak O'nun, İslâm medeniyetinde esas iz bırakan yönü usul alanındaki çalışmalarıdır. Bu bağlamda çalışmamızda Sübkî'nin gerek düşünce ve fikir açısından gerekse usûl eserlerindeki metot açısından hangi usûlcülerden etkilendiği, usûl eserlerinin yazımında izlediği metot, kendisinden sonraki usûlcülere etkisi, başta Cemʽu'l-Cevâmiʽ olmak üzere eserlerinin fıkıh tarihindeki yeri gibi hususlar tezde ele alınmış başlıca konulardandır. Ayrıca Sübkî'nin eserleri kendisinden önceki usûlcülerin eserleriyle mukayese edilerek Sübkî'nin orijinalitesi ortaya konmaya çalışılmıştır. Sübkî'nin el-Minhâc ve Muhtasar isinli metinlere yazmış olduğu el-İbhâc ve Raf'u'l-Hâcib isimli şerhlerinin bu metinler üzerine diğer müellifler tarafından yazılmış şerhlerden farklı olan yanları belirtilmiştir. Aynı şekilde diğer muhtasar metinlerden farklı olarak Cemʽu'l-Cevâmiʽde izlemiş olduğu üslup ve metodu da ortaya konulmuştur. Ayrıca Şâfiî mezhebine mensup olmakla birlikte usul düşüncesinde Şâfiî usulcülere muhalif olduğu konular da işlenmiştir."
