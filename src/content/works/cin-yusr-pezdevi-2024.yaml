abstract: "Bu çalışma, Hanefî-Mâtürîdî kelamcısı Ebü'l-Yüsr Muhammed el-Pezdevî'nin (421-493/1030-1100) Usûlü'd-Dîn adlı eserinde ele aldığı mezhepleri konu edinmektedir. Pezdevî yazdığı eserlerle, yetiştirdiği öğrencilerle Hanefî-Mâtürîdî kelamının şekillenmesine önemli katkılarda bulunmuştur. Usûlü'd-Dîn adlı eseri mezhepler hakkında farklı ve detaylı bilgiler vermektedir. Bu açıdan Pezdevî Mezhepler Tarihi alanında incelenmeyi hak etmektedir. Çalışma giriş ve üç bölümden oluşmaktadır. Birinci bölümde Pezdevî'nin yaşadığı dönem ve coğrafya, hayatı, eserleri, Usûlü'd-Dîn'in kaynakları ve Pezdevî'nin mezhebi kimliği ele alınmıştır. İkinci bölümde Pezdevî'nin Ehl-i Sünnet'e bakışı, Eş'arîlik, Küllâbiyye ve Ehl-i Hadîs gibi fırkalara yaklaşımı değerlendirilmiştir. Üçüncü bölümde Pezdevî'nin ehl-i bid'at saydığı; Mu'tezile/Kaderiyye, Şîa/Râfiza, Hâricîler, Cebriyye, Mürcie, Mücessime/Müşebbihe ve Sûfî fırkalar incelenmiştir."
