abstract: "Bu çalışmanın amacı, Ürdün Merkez Bankası'nın Ürdün bankacılık sisteminde kadınların ve çocukların ekonomik güçlendirilmesine katkı sağlama rolünü açıklamaktır. Çalışmada, Ürdün Merkez Bankası tarafından kadınların ve çocukların ekonomik güçlendirilmesini desteklemek amacıyla geliştirilen stratejiler ve düzenleyici yasalar incelenmiştir. Ayrıca çalışmada, kadınların ve çocukların ekonomik güçlendirilmesi kavramı ve ortaya çıkışı, Ürdün bankacılık sisteminde Ürdün Merkez Bankası'nın bu stratejileri benimseme rolü, İslam ekonomik sistemi açısından kadınların ve çocukların ekonomik güçlendirilmesinin İslami bir değerlendirmesi yapılmıştır. Çalışmada, Peygamberimiz ve sahabe döneminde kadınların ve çocukların ekonomik olarak güçlendirilmesine değinilmiştir. Bu araştırma, betimsel analitik bir çalışma olup, çalışmada elde edilen en önemli sonuçlar şunlardır: Ürdün bankacılık sisteminde kadınlar ve çocuklar için bankacılık hizmetleri ve finansal ürünlerin sunulmasında gelişmeler kaydedilmiş olsa da, Ürdün toplumundaki birçok kadın ve çocuk bu hizmetlerden haberdar değildir. Çalışma, çocuklara erken yaşlardan itibaren İslami finansal farkındalığın kazandırılması ve Ürdün bankacılık sisteminin kadınlar ve çocuklar için bankacılık hizmetleri ve finansal ürünler sunma çabalarını yoğunlaştırması ve bu hizmetlere uygun maliyetlerle ulaşılmasını sağlaması gerektiğini önermektedir."
