abstract: "İnsanın olduğu yerde uyuşmazlıkların olması kaçınılmazdır. Bu ihtilafların kaosa dönüşmeden çözülmesi ancak yargı yoluyla muhakemeyle mümkündür. İslâm Muhakeme Hukuku kişiler arası olsun kişiyle devlet arasında olsun meydana gelen anlaşmazlıkların nasıl çözüleceğini bildiren hukuk dalıdır. Muhakeme sayesinde hakikat ortaya çıkacak, hak sahibine iade edilecek ve adalet tecelli edecektir. Adaletin tecellisi ise İslâmın gözettiği temel gayelerden biridir. Tezimiz bir giriş ve üç bülümden oluşmaktadır. Giriş kısmında konunun içeriğine, takip edilen yöntem ve kaynaklarına değinilmiştir. Birinci bölümde kadı, mahkeme, muhakeme/dava, hüküm gibi muhakeme hukukunun ana unsurları irdelenmiştir. İkinci bölümde İslam muhakeme hukukunun kurumsallaşmasına katkı sunan kaynaklar ele alınmış, bunlar dış ve iç kaynaklar şeklinde değerlendirilmiştir. Dış kaynaklar noktasında İslamın geldiği tarihte mevcut bazı hukuk sistemlerinin kurumsal açıdan İslam muhakeme hukukuna etkisi araştırılmıştır. İç kaynaklar olarak Hz. Peygamberle başlayıp Osmanlıya kadar geçen sürede ortaya çıkan kurumsal katkılar incelenmiştir. Üçüncü bölümde birinci bölümde ifadesini bulan temel unsurların gelişim süreci ele alınmıştır. Bu bölümde kurumsallaşmanın insan ve mekân faktörü, kurumsal faaliyetin/muhakemenin sistematik ilkeleri ve muhakemenin başlangıcından sonuna kadar devam eden dava süreci tahlil edilmiştir."
