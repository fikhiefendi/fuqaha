abstract: "Ekonomik gelişme, modern dönemde hemen tüm toplumların temel hedefi olmuştur. Tüm toplumlar ülkelerinde kişi başına düşen milli geliri arttırmak için yoğun çaba içerisine girmişlerdir. Sosyo-ekonomik gelişme ise ekonomik gelişme kadar cazip olmamış, özellikle sosyal gelişme ekonomik gelişmenin çok gerisinde kalmıştır. Bunun başlıca nedeni kapitalist hatta sosyalist sistemlerin toplumlarının değerlerinden, ahlak ve dini düşüncelerinden geniş ölçüde koparak salt ekonomik başarıya endekslenmiş olmalarıdır. Oysa Max Weber'in ısrarla vurguladığı gibi toplumun zihniyeti ve dini dünya görüşünün ekonomik gelişmesinde önemli bir yeri vardır. Yaşadığımız çağda iktisatçıların büyük ekseriyetinin sosyal değerleri modellerine dâhil ederek analiz etmekten kaçındıkları görülmektedir. Ana akım iktisatçıların çoğu dini değer ve ahlaktan arındırılmış bir 'fayda' ve 'çıkar maksimizasyonunu' ulaşılması gereken tek ana hedef olarak almaktadırlar. Weber'in sık sık vurguladığı gibi böyle bir rasyonelleşmenin sonucu 'anlam kaybı', 'özgürlük kaybı' ve 'yeni-putperestlik' olmaktadır. Bu çalışmada ilk olarak Weber'de rasyonalite ve çeşitleri üzerinde durulacak, büyük dinlerin rasyonelleşmeye katkıları ele alınacak ve izleyen bahiste de Weber'in kapitalizm ve araç-rasyonellik bağlamında İslâm hakkındaki görüşleri incelenecektir. Bu kontekste İslâm hukuku, İslâm'da kadı adaleti, İslâm'da kapitalizmin gelişmemesi, İslâm iktisat ahlâkı gibi konular gündeme alınacak ve en sonunda da bir 'Türk Weber'i' olarak nitelendirilen ünlü iktisatçı-sosyolog Sabri Ülgener'in Weber'in görüşlerine karşı geliştirdiği argümanlar verilmeye çalışılacaktır."
