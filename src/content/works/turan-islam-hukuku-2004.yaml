abstract: "VI ÖZET YÜKSEK LİSANS TEZİ İSLAM HUKUKU AÇISINDAN USULSÜZ VEDİA M. Fatih TURAN Danışman : Prof. Dr. Mustafa BAKTTR 2004-Sayfa :X+129 Jüri : Prof. Dr. Mustafa BAKTER : Prof. Dr. Beşir GÖZÜBENLİ : Doç. Dr. Mustafa TİFTİK Bu çalışmamızda modern hukukta isimli akitler içerisinde yer alan usulsüz vedia akdi tanıtılarak, îslam kültüründe bu akdin uygulamalarının ve tıkın kitaplarında bu akde temel teşkil edebilecek görüşlerin var olup olmadığı araştırılmıştır. İslam hukukunda ismen geçmeyen bu akdin uygulamalarda var olduğu, îslam hukukunun akit mantığına aykırı her hangi bir özelliğinin olmadığı ve fıkıh kitaplarında misli vediamn kullanılması ile ilgili bilgilerin usulsüz vedia ile örtüştüğü görülmektedir. İslam hukuku açısından isimsiz akitler grubunda sayılabilecek bu akde, misli malm kullanılması özelliğinden dolayı bazıları karz demişler, bazıları da istisnai vedia, nakıs vedia gibi isimler vermişlerdir. Sonuç olarak, bu akdin İslam hukuku kaynaklarında ismen yer almasa da uygulamalarda mevcut olduğunu ve İslam hukuku akit mantığına aykırı bir yönünün olmadığım görmüş bulunmaktayız."
