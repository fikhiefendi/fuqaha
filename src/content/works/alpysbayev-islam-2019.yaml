abstract: "Nikâh birlikteliğinde tarafların karşılıklı ilişkileri önemli bir yere sahiptir. Bu nedenle aile hukukunun en temel konularından birini, eşlerin karşılıklı ilişkilerini düzenleyen hükümler oluşturur. Eşlerin karşılıklı hak ve sorumlulukları, nikâh akdi, usulüne uygun olarak gerçekleştiği andan itibaren meydana gelir. Bu hak ve sorumluluklardan bir kısmı kişisel bir kısmı da malî özellik taşımaktadır. Fakihlerin nikâhı muâvazalı bir akit olarak kabul etmeleri, başka bir deyişle nikâhı kocanın kadının cinsel menfaatlerine malik olması, mehri de bunun karşılığı olarak görmeleri, onları eşler arasındaki ilişkiyi bazı konularda evliliğe ilişkin Kur'ânî ilkelere göre değil muâvazalı akdin kurallarıyla düzenlemeye sevk etmiştir. Kur'ân-ı Kerîm'de karı-kocanın birbiriyle kaynaşan, ünsiyet kuran, hayatı paylaşan eşler olarak isimlendirilmesinden, nikâhın amaçlarının her iki taraf için de ortak olmasından hareketle nikâhın klasik tanımı ve eşlerin yetkileriyle ilgili olup muâvazalı akdin kuralları gereği düzenlen hükümlerin, nikâhın temel ilkelerine uygun düşecek şekilde yeniden düzenlenmesi gerektiği kanaatine varılmıştır."
