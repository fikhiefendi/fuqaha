abstract: "“Serahsî'nin el-Mebsût İsimli Eseri Özelinde Namaz İbadetine Dair Hanefî İmamlarının Görüş Ayrılıkları ve Gerekçeleri”isimli çalışmamız bir giriş, iki bölüm, özet ve sonuçtan oluşmaktadır. Tezimizin giriş bölümünde konunun önemi, amacı, sınırları ile araştırmanın yöntemi ve kaynakları belirtilmiştir. Yine bu bölümde Mâverau'n-Nehir bölgesinin önde gelen fakihlerinden Serahsî'nin hayatı ve ilmi şahsiyeti, yaşadığı dönem ve zindan hayatı, eserleri ve çalışmamıza kaynaklık eden el-Mebsût isimli eser hakkında bilgi verilmiştir. Birinci bölümde el-Mebsût isimli eseri merkeze alınarak Serahsî'nin ibadet fıkhı bağlamındaki tercihleri ve tercihlerin gerekçeleri tespit edilmeye çalışılmış,“Namazın Şartları ve Namaz Çeşitleri ile İlgili İhtilaflar”başlığı altında derli toplu bir bilgi sunulmaya gayret edilmiştir. Tespit edilen her bir ihtilaf için bir başlık konulmuş, bu başlıklar mümkün olduğu kadar genel ifadelerle belirtilmeye çalışılmıştır. Tespit ettiğimiz görüş farklılıkları Hanefî mezhebindeki diğer kaynaklardan da istifade edilerek açıklanmıştır. İkinci bölümün başlığı“Namazın Edası ile İlgili İhtilaflar”olup işleyiş olarak yine birinci bölümdeki yöntem uygulanmıştır. Bununla birlikte ihtiyaç görülen yerlerde de kısa değerlendirmeler yapılmıştır. Son olarak sonuç kısmında çalışmamız sonucunda elde ettiğimiz, görüş farklılıklarına sebep olan unsurlardan bahsedilmiş, Serahsî'nin hangi konuda hangi imamın görüşünü benimsediği, hangisini tercih etmediğine dair örnekler verilmiş, böylece Serahsî'nin fıkhî tavrı ortaya koyulmaya çalışılarak Hanefî mezhebi içerisindeki konumuna değinilmiştir."
