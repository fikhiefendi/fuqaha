abstract: "Bu çalışma, İslam bilginleri halkasından biri olan ve çok yönlülüğüyle tanınan İbn Haldun'un İslam hukukuna dair fikirlerini tespit etmektedir. Tarih ve sosyoloji ilimlerinin önemli şahsiyetlerinden kabul edilen İbn Haldun'un kurmuş olduğu ?umran ilmi? içerisinde, İslam hukukunun yeri hiç şüphesiz ki çok önemlidir.Yıllarca kadılık yapmış, siyasî hayatın birçok makamında yer edinmiş ve o dönemdeki İslam devletlerinin neredeyse tamamını gezmiş biri olan İbn Haldun'un bu sayede kazanmış olduğu birikimlerini fıkıh dâhil ele aldığı bütün konulara yansıttığını görmekteyiz. Doğrudan bir fıkıh kitabı yazmasa da İslam hukukunun birçok alanına sunduğu katkı takdire şayandır.Bu çalışma İbn Haldun'un usul-i fıkıh görüşleri ile birtakım furû' ve ayrıca mekâsıd, hilafiyyât gibi konulardaki fikirlerini ele almaktadır. İbn Haldun kendine özgü yorum ve bakış açısıyla İslam hukukunda o döneme kadar çok fazla dile getirilmeyen konulara temas etmiş, İslam hukuk ekollerinin ortaya çıkış nedenleri ve farklı bölgelere dağılışının sosyolojik, kültürel, coğrafî, siyasî birçok etkeni üzerinde durmuştur. İslam hukuk tarihini kısa ve özlü bir şekilde ele alan İbn Haldun'un ayrıca hilafet konusundaki fikirleri de İslam hukuku açısından kayda değerdir."
