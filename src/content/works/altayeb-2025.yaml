abstract: "Bu tez,“Çağdaş Mali Muamelât Alanında Şafii Mezhebinin Katkısı”başlığını taşımakta olup, AAOIFI adlı kuruluşun muhasebe ve denetim standartları çerçevesinde İslami finans kurumlarına yönelik Faizsiz Finans Standartları'nda çağdaş fakihlerin yalnızca Şâfiî mezhebinin içtihatlarına ne ölçüde başvurduklarını incelemeyi amaçlamaktadır. Araştırmanın ulaştığı sonuçlara göre, Faizsiz Finans Standartları sadece dört meselede Şâfiî mezhebinin içtihatlarına tek başına dayanmaktadır: Borçlunun kendi iflasını talep etme hakkı; vekilin her iki taraf adına akit yapabilmesi; ayıplı mal için muhayyerlik hakkının derhal mi yoksa gecikmeli olarak mı kullanılacağı; ve Şâfiî'nin el-Ümm adlı eserinde ilk şeklini zikrettiği, satın alma emriyle yapılan murâbaha akdinin temel fikri. Bunlara ek olarak, Şâfiî kaynaklarına dayalı olarak Malezya Menkul Kıymetler Şer'i Danışma Kurulu'nun benimsediği ve Malezya'daki İslami bankacılık sektörünün gelişiminde önemli rol oynayan“îne satışı”uygulaması da incelenmiştir. Araştırmanın giriş bölümünde Şâfiî mezhebinin tanıtımı, kaynakları ve tarihsel gelişim aşamaları ele alınmıştır. Ardından, Şâfiî mezhebinde finansal işlemleri düzenleyen bazı temel ilkeler toplanmaya çalışılmıştır. Bu ilkeler; ribâ teorisi, akitlerin esasları, belirsizlik (garar) teorisi, akitlerin zâhire göre hükme bağlanması ve akitlerde fesat ile butlân ayrımıdır. Araştırmanın uygulamalı kısmında öncelikle İslami Finans Kurumları için Muhasebe ve Denetim Organizasyonu (AAOIFI) tanıtılmış, ardından Şâfiî mezhebinin tek başına esas alındığı meseleler belirlenmiştir. Ayrıca, Faizsiz Finans Standartlarında hüküm belirleme yöntemine dair çalışmada türetilen bazı prensipler kaydedilmiş ve diğer üç fıkıh mezhebine (Hanefî, Mâlikî, Hanbelî) dayalı olarak benimsenen bazı hükümlere örnekler verilmiştir. Son olarak, îne satışının tanımı yapılmış; Şâfiî kaynaklarının tarihsel gelişiminin incelenmesiyle, mezhep imamından geç dönem Şâfiî âlimlerine kadar bu konu hakkındaki hükmün nasıl evrildiği ortaya konmuş ve araştırma, Malezya'nın îne satışı konusundaki deneyimine dair kısa bir değerlendirme ile sona ermiştir."
