abstract: "Nafaka müessesesinin, Osmanlı Devleti'nde nasıl işlediğini gösteren tam bir kanun kitabı niteliğinde olan“Kitabu'n-Nafakat”adlı eserin, günümüz Medeni Hukukunda, nafaka kanun maddeleriyle mukayeseli olarak incelenmesini amaçladığımız bu çalışmamızda, bir giriş ve arkasından“Nafakayla İlgili Genel Maddeler”,“Osmanlı Hukukunun Kaynakları ve İşleyişi”,“Telif-i Mesâil Kurumunun Ortaya Çıkışı ve Ortaya çıkmasının Sebepleri”ve“Kitabu'n-Nafakat'ta Nafaka ile Günümüz Medeni Hukukunda, Nafaka'nın Karşılaştırılması”şeklinde dört bölüm bulunmaktadır. Giriş bölümünde, çalışmamızın amacı, metodu ve faydalandığımız kaynaklar üzerinde durduk. Birinci bölümünde, tüm hukuk sistemlerinde önemli bir yeri olan ve İslâm hukukunda da derinden incelen ve çözümler bulunan nafaka konusunu İslâm hukukunda ana hatlarıyla incelemeye çalıştık. İkinci bölümde Osmanlı döneminde nafaka konusunu incelemeye tabi tuttuğumuz için Osmanlı hukuk sisteminin nasıl işlediğini ve aslında Temelde İslam hukuku kaynaklı bir hukuk sisteminin geçerli olduğunu göstermeye çalıştık. Üçüncü bölümde de çalışmamızın inceleme konusu olan“Kitabû'n-Nafakat”adlı eserin ortaya çıkışında rol alan kurum ve bu kurumun çalışmaları araştırılmış ve bu eserin ortaya çıkış aşamaları ve özellikleri üzerinde durulmuştur. Son bölümümüz olan dördüncü bölümde, Günümüzde Nafaka konusunun geçtiği kanun maddelerinin“Kitabu'n-Nafakat”adlı eserdeki kanun maddeleriyle mukayesesi yapılarak incelenmiştir. Sonuç olarak bu iki dönem kanun maddeleri arasındaki benzerliklere ve farklılıklara ayrı ayrı değindik."
