abstract: "Bu tez, Hz. Peygamber ile Enes b. Mâlik arasındaki ilişkiyi çocuk eğitimi bakımından ele almaktadır. Araştırma boyunca dokümantasyon ve belgesel yöntem metoduna yer verilmiştir. Hadislerin tespitinde Ahmed b. Hanbel'in Müsned'inde Enes b. Mâlik başlığı altında bulunan 2170 hadis taranmıştır. Araştırmada pedagojik terminoloji de dikkate alınarak Hz. Peygamber'in çocuklara âdâb-ı muâşeret öğretiminde takip ettiği yöntem incelenmiştir Tezde Hz. Peygamber'in terbiye metodu; çocuk ve ergenlere yaklaşımının yanısıra başta Sahâbe-i Kirâm olmak üzere yetişkin bireylerle münasebetleri çerçevesinde çok boyutlu olarak ele alınmaya çalışılmıştır. Âdâb-ı muâşeret içeren örnek olaylar, Hz. Peygamber'le birlikteliği çocukluk ve ergenlik dönemlerine tekabül eden Enes b. Mâlik'in gözünden ve kendisindeki yansımaları çerçevesinde ele alınmıştır. Zira Enes b. Mâlik'in Hz. Peygamber ile birlikteliği“eğitim çağı”denen bir dönemle başlayıp,“erken, orta ve ileri ergenlik dönemlerini de içine alacak biçimde on yıl sürmüştür. Enes b. Mâlik'in okuma yazma bilmesi ve gözlemlerini güçlü bir şekilde aktarabilme kabiliyeti Hz. Peygamber'le geçirdiği her bir anı ”çocuk eğitimi\" açısından değerli kılmaktadır."
