abstract: "Türkiye'de bankacılık ve finans, günümüze kadar sürekli olarak krizlere maruz kalmış ve birçok krize de sebep olmuştur. 2001 yılındaki küresel krizde Türkiye'deki bankalar, ülke ekonomisini uzun bir süre sıkıntıya sokmuştur. Krizde Türkiye çeşitli yönlerde etkilenmiş, daha sonra bankacılık yeniden yapılanmaya ve toparlanmaya başlamıştır. Bu süreçte bankacılık ve finans alanında çeşitli düzenlemelere gidilmiş. Teknolojik, hukuksal, yönetim ve idari alanlarda birçok düzenlemeler yapılmıştır. Yapılan düzenlemeler akabinde bankacılık pozitif olarak ilerlemiş ve kâra geçmiştir. (Duramaz S, Erol İ, 2018) Bununla beraber, konvansiyonel bankaların yanı sıra katılım bankacılığı da yeniden yapılanmıştır. Faiz hassasiyetine önem veren katılım bankacılığı“tüm bankacılık işlemlerini yapan, kâra ve zarara katılmayı benimseyen ve buna göre fonları toplayan ticari işler, ortaklık kurulması ve kiralama modelleri gibi yöntemlerle finansman sağlayan bir bankacılık sistemidir.”olarak tanımlanmaktadır (TKBB,2021). Katılım bankacılığı alanında da çeşitli düzenlemeler ve iyileştirme çalışmaları yapılmıştır. Birçok ülkede bireylerin banka seçiminde etkili olan sebeplerin araştırılması hususunda birçok araştırma ve çalışma yapılırken ülkemizde bu konudaki yapılan araştırmaların yetersiz olduğu tespit edilmiştir. Bankacılık ve finans alanında hizmet almak isteyenlerin katılım bankacılığı faaliyetlerine yönelik istek, tavır ve alışkanlıklarının tespit edilmesi, faizsiz finans sisteminin gelişmesi açısından önem arz etmektedir. (Toraman vd. 2015) Bu araştırmanın amacı; Müşterilerin katılım bankacılığını tercih etme nedenlerinde demografik özelliklere göre anlamlı farklılıklar olup olmadığının ve hangi demografik özelliklerin tercihlerde daha etkili olduğunun tespit edilmesidir. Araştırma kapsamında 6 hipotez geliştirilmiş olup, yapılan analizler sonucunda; hizmet kalitesi faktörlerinde anlamlı farklılıklar bulunmuştur. Elde edilen bulgulara göre bir takım öneriler geliştirilmiştir."
