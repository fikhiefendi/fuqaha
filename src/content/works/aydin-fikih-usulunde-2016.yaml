abstract: "Fıkıh usûlü bilginleri teklifî hükümlerin taksiminde dolayısıyla“mendûb”un anlamlandırılma ve derecelendirilmesinde genel olar iki gruba ayrılırlar. Bunlardan, mütekellimin metodunu benimseyenler teklifi hükümleri vâcib, mendûb, mubah, mekruh ve haram şeklinde beş kısma ayırmışlardır. Fukahâ (Hanefî) metodunu esas alan usulcüler ise yapılması istenen fiilin delilinin katî veya zannî oluşunu dikkate alarak farz ve vâcibi iki ayrı hüküm saymışlardır. Ayrıca onlar özellikle Hz. Peygamber (s.a.s.)'in farz ve vâcip olmaksızın herhangi bir şeyi devamlı, ara-sıra ya da nadiren yapması sebebiyle yapılanların hükmünü aynı derece görmemişler ve sünnet ile mendûbu farklı tanımlamışlardır. Böylece onlar teklifi hükümleri, farz, vâcib, sünnet, nâfile (mendûb/müstehab), mubah, mekruh ve haram şeklinde yediye taksim etmişlerdir. Görüldüğü üzere her iki metodu esas alan usulcülerin taksiminde de mendûb teklîfi hükümlerden bir hükümdür. Ancak mütekelliminden olan usulcüler kısaca zannî bir delil ile kesin ve bağlayıcı olmayan bir tarzda istenen şeyleri“mendûb”hükmü ile nitelendirmişler ve sünnet ve müstehab gibi kavramları aynı anlamda kullanmışlardır. Fukahâ metodunu benimseyenler ise“sünnet”e ayrı bir önem vermiş ve onu mendûb kavramından daha üst bir derecede değerlendirmişlerdir. Ayrıca onlar taksimlerinde mendûb ve müstehab gibi kavramlar yerine genellikle“nâfile”kavramını kullanmışlardır. Şer'i hükümlerin teklifi hüküm kısmından bir hüküm olan ve genel olarak zannî bir delil ile kesin ve bağlayıcı olmayan tarzda yapılması istenen şey anlamındaki mendûbun, anlamlandırılma ve derecelendirilmesinde dolayısıyla fıkhın furûunda kullanılmasında fıkıh usulü meslekleri ve mezhepler arası ihtilaflar ve mezhep içi farklılıklar vardır."
