abstract: "DIŞ GOÇ, SOSYO-KULTUREL DEĞİŞME VE DİN ALMANYA'DA KÖLN BÖLGESİNDE DİNİ YETKİLİLERCE VERİLEN FETVALAR BAĞLAMINDA TÜRK İŞÇİLERİNİN DİNİ YAŞAYIŞLARI ÜZERİNE BİR DİN SOSYOLOJİSİ ARAŞTIRMASI ÖZET Tarihsel olarak dünyadaki sistemli göç hareketlerinin başlangıcını, Amerika Kıtası' nın keşfini izleyen yıllara kadar indirmek mümkündür. Bu göç hareketlerinde ekonomik zaruretlerin yanısıra coğrafî, doğal ve hatta askeri nedenlerin de ağırlığı hissedilmiştir. Günümüzdeki göçlerin ana nedeni ise büyük oranda ekonomik gerekçelere dayanır. Türkiye'den dışarıya düzenli işçi göçü -ki dış göçün %80'i F. Almanya'ya olmuştur 1961-1975 yılları arasında yaklaşık 805.000 işçi, İş ve İşçi Bulma Kurumu (İİBK) aracılığı ile yurtdışında çalışmaya gönderildi. 1973ün sonundan bu yana konuk işçi alımının durdurulduğu, Almanya'da başlangıçta belli bir süre için gelen göçmen işçiler, ailelerin birleşmesi ve yeni kuşakların orada büyüyüp yetişmeleri nedeniyle yeni yurtlarına yerleşme eğiliminde olmuşlardır. Bu olgu, toplumsal yaşamı önemli ölçüde etkilemiştir.Göçle birlikte göçmen işçilerin sosyo-kültürel sorunlarının yanında dinsel sosyal alanda da sorunlar ve ihtiyaçlar ortaya çıkmıştır. Almanya ilk defa bu derece yoğunlukta İslam ve onun mensuplarıyla yüzyüze gelmiştir. Bu amaç doğrultusunda 2000 yılından önce görevlilerde de bu bölgelerde istenen fetvalar çeşitli kaynaklardan derlenmiş, 2000 yılından sonrakiler ise bir doküman arşivi oluşturularak iki buçuk sene boyunca biraraya getirilerek arşiv oluşturulmuştur. Bu iki malzemenin yanı sıra son olarak bir anket ile topluluğun demografik bilgilerine, inanç, ibadet ve ahlak gibi konularda kanaat ve tutumlarına ulaşılmaya çalışılmıştır. Ulaşılan veriler yapısal-fonksiyonel analize tabii tutulmuştur.Buna göre deneklerin büyük çoğunluğunun camiye devam ettikleri ve dinsel problemlerini bu kurum aracılığı ile çözmeye çalıştıkları gözlemlenmiştir. Almanya'da caminin fonksiyonları itibariyla Türkiye'de anlaşılan cami imajından daha farklı bir şekilde algılandığı söylenebilir. Bu durumda çalışmamızın temelini oturttuğumuz caminin Almanya'da yaşayan Türk topluluğu için vazgeçilmez önemi bir kere daha ortaya çıkmış olmaktadır."
