abstract: "Bu çalışmamızda, İslam modernistlerinin nass ile belirlenmiş olan; şefaat, faiz, kadının mirası, tesettürü, şahidliği, kısas konusu, hırsızın elinin kesilmesi, evli zinakarın recm edilmesi konularındaki iddialarının, Kutsal Kitap'lar, Kur'an, sünnet, icma, çerçevesinde eleştirel bir gözle tahlil etmeye çalıştık. Öncelikle modernistler tarafından ileri sürülen İslami cezaların insan onuru ve insan haklarıyla bağdaşmayacak nitelikte ilkel, zalimane ve işkence içerdiği yönündeki iddiaları ile bu iddialara verilen cevaplara yer verilmiştir. Bu iddialara cevap verirken ilk kaynaklara ulaşmaya çalıştık. Bu kaynaklara ulaşamadığımız takdirde, sonraki kaynaklara ulaşarak bu iddialara eleştirel cevap verme amacımız çalışmamızın esas gayesini taşımaktadır. Bu çalışmamız çerçevesinde; şefaat konusunu ve konu üzerindeki olumlu ve olumsuz eleştireleri ile faiz konusu modernistlerin güncel yorumlarına eleştirel cevabımızla beraber, kadın konusu, cezalar konusu hakkındaki modernistlerin hükmün tarihsel çerçevesi içinde değerlendirmelerine eleştirel bir şekilde cevap vermeye çalıştık. Biz, bu çalışmamızın giriş bölümünde, konunun amacı ve yöntemini belirtikten sonra birinci bölümde; modernizm, hermenötik, ve tarihsellik kavramını inceledikten sonra modernistlerin temel düşüncelerini eleştirel bir bakış açısıyla ele aldık. İkinci bölümde; Kur'an'ın evrenselliğini, onun nasıl anlaşılması ve yorumlanması gerektiğini inceledik. Üçüncü bölümde ise; şefaat ile modernistlerin tarihsel olduğunu iddia ettikleri konular olan, faiz, kadının tesettürü, kadının mirası, kadının şahidliği ile kısas, evli zinakarın recm edilmesi ve hırsızın elinin kesilmesi konularında Modernistlerin iddialarına eleştirel cevabımızla beraber, modernistlerin iddialarına dayanak yaptıkları Hz. Ömer'in uygulamalarını işleyip modernistlerin iddialarının temelsiz olduğunu nass, çerçevesinde belirtmeye çalıştık."
