abstract: "İnsanın kendisini, rolünü, hayatı ve kainatı doğru okuma, anlama ve anlamlandırma çabasında Hanefi-Maturidi anlayışa göre aklına en büyük yardımcı olarak gönderilen kitap ve peygamberin doğru anlaşılmasında ana İslami akım olan Sünni, Hanefi-Maturidi anlayışın siyasi ve iktisadi düşüncemize etki ve katkılarını araştırdık. Bu çerçevede insanların bir arada yaşmalarının sonucu olan siyasi ve idari eylem, kural ve kurumların, ihtiyaçların karşılanması gereğinin sonucu olan iktisadi eylem, kural ve kurumların doğal yapısını öncelikle Kur'an ve Sünnetteki doğal haliyle ele aldık. Kur'an'ı ve Peygamber'i inisiyatif alarak ve içtihat yeteneğini kullanarak anlayan ve uygulayanların, aynı zamanda Hanefi-Maturdi anlayışın da sahabe içindeki öncüsü sayılan Hz. Ömer'in özellikle siyasi ve ekonomik hayata dair anlayış ve uygulamaları inceledik. Adeta bir usta çırak ilişkisi içerisinde Hz. Ömer'in Talebesi Abdullah b. Mes'ud'dan kendi talebelerine onlardan da Ebu Hanife ve talebelerine bu anlayışın nasıl intikal ettiğini, hukukun, siyasi ve ekonomik hayatın ve bu alandaki ahlak ve erdemin inşasında nasıl bir metodoloji, görüş ve duruş geliştirdiklerini, gerektiğinde bedel ödeyerek günümüze kadar örnek olacak bir anlayışı nasıl canlı tutup taşıdıklarını tespit etmeye çalıştık. Onların bozulan itikadi zemini düzelterek yeniden kurdukları hukuki, siyasi ve ekonomik anlayışı eserleriyle ve örnekleriyle ele aldık. Hilafet merkezi Bağdat ve yakın çevresindeki bozulma ve kargaşa Ebu Hanife ve öğrencilerinin geliştirdiği anlayışın Semerkand havzası ve Maveraünnehir bölgesinde İmam Maturdi ve talebeleri ile yeni bir hüviyet kazanmasını, bozulan akıl-vahiy dengesinin yeniden kurulmasını, karmaşık hale gele gelen bilgi kaynaklarının kargaşadan arındırılmasını, böylece akıl-vahiy dengesi içinde doğru bilgiye dayalı yeni bir anlayışın kurulup geliştirilmesini zaruri hale getirdi. Bu çerçevede özellikle İmam Maturidi'nin hem bir kelam alimi, hem bir hukukçu, hem de dirayetli bir müfessir olarak iktisadi ve siyasi anlayışımıza doğrudan veya dolaylı bir şekilde etki eden görüşlerini analiz ettik. Esas amacının tefekkür ve istidlalin önünü açmak olduğunu ve doğruyu bulmanın ve anlamanın ancak bu şekilde mümkün olacağını vurgulayan İmam Maturidi'nin çizgisinden ilerleyerek çağdaş bazı sorunlar üzerinde tefekkür ve istidlalde bulunan ilim adamı, aydın ve mütefekkirlerin görüşlerine, arayışlarına da yer vererek günümüzde yaşanan siyasi çalkantı, mezhep çatışmaları, özgürlük, geri kalmışlık, faiz, kredi, vergilendirme konuları hakkındaki yaklaşımları değerlendirdik. Bütün bunları yaparken Ebu Hanife ve Maturidi'in mevaliden sayılması veya Türk olması nedeniyle Arap karşıtı veya Türk tipi Müslümanlık gibi faztezi sayılabilecek yaklaşımlara sıcak bakmadık. Zira bu iki büyük insanın açtığı çığır, geliştirdiği düşünce, görüş ve duruşun millileştirilmesinden çok evrenselleştirilmesi gerektiği sonucuna vardık."
