abstract: "Bu araştırma, illet'e delâlet etme yollarını kat'i ve zanni illet'ine delâlet etme yollarına taksim etmeyle ilgilidir, öyleki geçmiş ve son dönemde ki usul alimleri asıl ve fer'in arasında ki ilişki, ona delil getirme ve taksim etme araştırmasına önem veriyorlar, fakat alimler onu nas illet'ine diğeri içtihat illet'ine veya sarih illet'ine ve diğeri tahriç etme illet'ine taksim etmede bölümlere ayırmışlardır, fakat bu araştırma, illet'i kat'i veya zanni sabitliğin dercesine göre taksim ediyor, bu taksim (illet) yollarının tabiatı için en uygun olanı ve ilim öğrencisi için en faydalı olanıdır, bu araştırma bu itibara göre (illet'in) yollarını tartışan ilmî bir tez olarak yeni bir örnek sayılır, bu araştırma bir başlangıç, iki temel konu ve bir hatime(sonuç) araştırmasından oluşmaktadır. Başlangıç niteliğinde olan araştırma kıyasın rükünleri ve şartlarını zikretmekle (genel) bir bakışı ele alıyor, sonra birinci konu: İllet'tin tanımını, şartlarını, kat'i illet'e delâlet etme yollarına ve ona örnekler getirmeyi kapsıyor, ikinci konu: Kat'i dereceye ulaşmayan ve zanni derecede kalan illet'ine delâlet etme yollarını, ve ona delil getirmeyide kapsıyor, sonra (kitabın) hatimesi ve en önemli neticeler/sonuçlar."
