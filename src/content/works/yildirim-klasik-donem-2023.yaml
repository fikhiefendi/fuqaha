abstract: "Osmanlı hukukunda şeyhülislâmlık kurumunun müstesna bir yeri vardır. Şeyhülislâmlık kurumunun kıymeti hukuki, siyasi ve toplumsal işlevinden ileri gelir. Kurumun işlevi, tarihsel ve siyasi kökeniyle yakından ilgilidir. Bu nedenle tezin birinci bölümü, şeyhülislâmlığın tarihsel ve siyasi kökenini irdelemeye hasredildi. İrdeleme faaliyeti,“fetva”kavramı ekseninde yapıldı. İkinci bölümde, öncelikle klasik dönemle sınırlı olmak üzere şeyhülislâmlık hakkında bilgilere yer verildi. Daha sonra, Şeyhülislâm Zenbilli Ali Cemâlî Efendi'nin hayatına, şeyhülislâm oluncaya değin yaşadıklarına tezle ilgisi ölçüsünde değinildi. Son bölümde ise, Zenbilli Ali Cemâlî Efendi dönemiyle sınırlandırılarak, şeyhülislâm fetvası, siyasi veçhesiyle ele alındı. Bu doğrultuda“Kızılbaşlık”hakkında şeyhülislâmın tutumu tetkik edildi. Esasen siyasi ve dinî otorite arasındaki gerilimin tezahürü ve şeyhülislâmlığın bu gerilim karşısındaki kurumsal konumunu tetkik etmek tezin ana gayesidir."
