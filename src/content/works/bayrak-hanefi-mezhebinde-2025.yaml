abstract: "Fıkıh literatüründe kadınlardan gelen kanlar hayız, nifâs ve istihâze olmak üzere üç kısımda ele alınmıştır. Hayız, kadınlarda ergenlikle birlikte başlayan ve belirli periyotlarla görülen tabii bir haldir. Kadınların doğum sonrasında yaşadığı kanama da nifâs olarak adlandırılmaktadır. Fukaha ilk defa hayız veya nifâs olan kadını“mübtedie”, düzenli âdeti olanı“mu'tâde”ve kanaması kesilen kadını da“âyise”olarak tanımlamıştır. İki hayız arasında ve nifâs ile hayız arasında muteber bir temizlik döneminin bulunması gerekir. Fakihler hayız, nifâs ve temizlik halleri için asgari ve âzami süreleri naslardan hareketle belirlemiştir. Hanefîler'e göre hayzın en azı üç, en çoğu on gündür. Nifâsın en az süresinde sınır bulunmamakla birlikte en çoğu 40 gün olarak belirlenmiştir. Temizliğin ise en azı 15 gün olup çoğunda sınır bulunmamaktadır. Hayız, nifâs ve temizlik dönemleri her bir kadında ve neredeyse her döngüde farklı şekilde gözlemlenir. Dönemsel olarak kanamanın renginde ya da hayız, nifâs ve temizliğin süresinde birtakım faktörlere bağlı olarak değişiklikler yaşanabilmektedir. Yaşanan bu değişimler sahih ölçüler içinde kalması kaydıyla doğal kabul edilir. Ancak kanamanın hayızda on gün, nifâsda 40 günden fazla sürmesi veya temizliğin 15 günden eksik olması; istimrâr yani devamlı kanama olarak adlandırılır ve bu durumda intikal kaideleri geçerli olur. İntikal kaideleri uygulandığında kadının mu'tâd hayız, nifâs ve temizlik süreleri dışında kalan istihâze günleri netlik kazanır. Bu durum kadının mu'tâdını bilmesini gerektirir. İstihâze halinde hayız ve nifâsta geçerli olan ibadet ve cinsî münasebet yasakları söz konusu değildir. Farklı hükmî sonuçları bulunan hayız, nifâs ile istihâze hallerinin doğru şekilde birbirlerinden ayırt edilebilmesi adına kadınların mu'tâd sürelerini düzenli olarak tespit etmeleri fukaha tarafından vâcip görülmüştür. Namaz ve oruç gibi devamlılığı olan farz ibadetler göz önünde bulundurulduğunda Hanefî mezhebinin ictihadları, özellikle istimrâr haline yönelik çözümleri kadınlara pratikte kolaylıklar sağlar."
