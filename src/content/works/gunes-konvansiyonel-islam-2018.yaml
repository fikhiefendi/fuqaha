abstract: "Günümüzde ve çağımızda devlet kavramı, devletin yetki ve görevi ne olması gerektiği hususunda düşünüp, çözüm bulunması eski çağlara kadar uzanmaktadır. Devlet, gerek sosyal hayatımızda gerekse siyaset ve ekonomi hayatımızdan ayrılmayan bir parçadır. Tarihsel süreç içerisinde yaşayan sosyoekonomik değişim ve gelişimlere bağlı olarak devletin fonksiyon ve işlevleri de değişmiştir. Gerek Batıya göre, gerekse İslam'a göre, devlet her zaman, her çağda, her yerde hep var olmuştur ve var olacaktır. İslam düşünürlerin ve batı düşünürlerin düşüncelerini dikkate alınarak devletin ekonomideki yeri araştırılmıştır. Merkantilistler korumacı devleti, fizyokratlar doğal düzeni savunmuştur. Klasik iktisatçılar devletin ekonomiye müdahale etmemesini savunurken, Keynesyenler müdahaleci-sosyal refah devletini savunmaktadır. Neoliberal yaklaşımlar, devletin ekonomik rolünü azaltmak için büyük emek ve çaba harcamaktadır. İslam düşünürü İbn-i Haldun'a göre ekonomide Pazar devlettir. Ancak meşru yoldan elde edilen mülk ve servete devletçe el uzatılmamalıdır. Gazali ise, insanlar kendi kendine yeterli olmayacağı için devletin gerekliliğini tanımlamıştır. İbni Teymiyye, çeşitli mesleklerin halkın ihtiyaca göre teşkilatlandırılması devlete düştüğünü savunmuştur. İktisadi faaliyetlerin, İslam'ın ahlaki, sosyal ilkeleri ışığında cereyan etmesini sağlamak için, devlet her türlü yetkiye sahiptir. Maverdi ise devletin bazı alanlara müdahale edilmemesine yanadır. Bu çalışmamızda, Merkantilizmden günümüze, İslami ve İktisadi yaklaşımlar ve görüşler çerçevesinde devletin ekonomiye karışması veya karışmaması, karışacak ise ne gibi şart ve koşullar içinde olması gerektiği incelenmiştir."
