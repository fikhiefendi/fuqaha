abstract: "Hz. Ömer, 2. Halife olmasının ötesinde İslam Hukuk tarihinin önde gelen şahsiyetlerindendir. Bunun birden fazla sebebi olmakla beraber, onun \"kamu hukuku naslarını zaman ve mekân bağlamında yorumlama\" metodolojisi diğer tüm sebepleri geride bırakacak niteliktedir. Hz. Peygamber'in (a.s.) vefatından sonra yeni fetihlerle bir yandan sınırları genişleyen İslam Devleti, diğer taraftan nüfusunun artmasıyla birlikte yeni kültür ve anlayışlarla yüzyüze kalmıştır. Bunun tabiî bir sonucu olarak müslümanlar, daha önce duymadıkları, bilmedikleri hatta düşünmedikleri hukukî sorunlarla karşı karşıya gelmişlerdir. İşte bu dönemde devlet başkanı olan Hz. Ömer, aynı zamanda hukukçu kişiliği ile bahsi geçen sorunlara dirayet ve cesaretle eğilmiş, geniş açılı hukuk perspektifiyle sorunlara hukukî çözümler üretilmiştir. Hz. Ömer'in takip etmiş olduğu, \"kamu hukuku naslarını anlama ve yorumlama metodolojisi\" günümüz açısından da önem arz ettiği için çalışma konusu olarak seçilmiştir."
