abstract: "İstanbul müftülüğünün Osmanlı hukuk sistemindeki merkezi rolüne yönelik ilk işaretler 15. yüzyılın son çeyreğinde görülmekle birlikte bu rolün kurumsal anlamda kendisini göstermesi 16. yüzyılın başlarına rastlar. Müftülüğün resmi yükselişine paralel şekilde müftü fetvaları da bu yıllarda kadı sicillerinde yerini almaya başlamıştır. Bu araştırmanın temel amacı fetvaya atıfta bulunulan dava kayıtlarının sayısı ve içeriğinden hareketle Ebussuûd (1545) öncesinde fetva kurumu ile yargı teşkilatı (kazâ) arasındaki ilişkinin boyutlarını açıklamaktır. Bu kapsamda, dönemin çeşitli mahkemelerine ait kırktan fazla kadı sicilindeki fetvalı dava kayıtları tespit edilmiştir. Elde edilen bu veriler kronoloji, mekan (coğrafya) ve müftü gibi kıstaslar üzerinden analize tabi tutulmuştur. Bu ölçütlerin fetvalı dava miktarında ve kadıların fetvaya yaklaşımında yol açmış olabileceği düşünülen muhtemel etkiler ölçülmeye çalışılmıştır. Temel bir gösterge kabul edilen fetvalı davaların miktarı, dönemin siyasi gelişmeleriyle birlikte değerlendirilerek müftülüğün Osmanlı hukuk sistemi içindeki konumuna ve rolüne yönelik bir okuma gerçekleştirilmiştir. Bu bağlamda ulaşılan sonuçlara göre, bir fetvadan söz eden ilk sicil kaydı 1515'te Üsküdar mahkemesinde oluşturulmuştur. Bu yıllar aynı zamanda merkez (İstanbul) müftülüğünün Osmanlı hukuk sistemindeki rolünün ve bürokratik konumunun belirginleştiği tarihlerdir. Sonraki süreçte bu tür kayıtların sayısı müftülerin biyografileri ve dönemin siyasi-idari gelişmeleriyle paralel dalgalanmalar yaşamış; 1530'larda zirveye ulaşmasını takip eden yıllarda gözle görülür bir düşüş kaydetmiştir. Ayrıca müftü ve fetvanın mahkemeler üzerindeki etkinliğinin genişlemesi, merkezden çevreye, küçükten büyüğe şeklinde özetlenebilecek bir doğrultuda gerçekleşmiştir. Böyle olmakla birlikte fetvanın dava sonuçları üzerindeki hukuki etkisinde ve kadıların müftü fetvalarına yaklaşımında dönem içerisinde bir farklılaşma yaşanmamış, dava kararları ilgili fetvanın içeriğiyle uyumlu şekilde tezahür etmiştir."
