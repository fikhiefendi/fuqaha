abstract: "Kripto paralara ilişkin fıkhi değerlendirmeler yapılmıştır. Artık genel çerçeve çizilmiştir. Ancak alanda konuyla ilgili fetva ve görüşleri detaylı olarak inceleyen yeterli çalışma bulunmamaktadır. Bu noktada tezimiz literatürdeki bu boşluğu doldurmayı amaçlamaktadır. Bu konuda dile getirilen fetva ve görüşlerin detaylı bir şekilde incelenmesi, bu görüşlerin delillerinin incelenmesi, bu delillere verilen cevapların değerlendirilmesi, böylece görüşlerin güçlü ve zayıf yönlerinin tespit edilmesi ve delillerin sağlamlığının belirlenmesi, alanda bundan sonra yapılacak çalışmalara sağlam bir zemin hazırlayacaktır. Bu amaçla kripto paralara ilişkin fetva ve görüşler toplanmış ve yirmi tanesi seçilmiştir. Daha sonra seçilen bu fetvalar üzerinden tümevarım yöntemi kullanılarak sonuçlar elde edilmiştir. Elde edilen genel sonuçlar bu konuda üç temel yaklaşım olduğunu göstermektedir. Bunlardan ilki kripto paraları caiz görmeyen yaklaşım, kripto paraları caiz gören yaklaşım ve sonuncusu ise kripto paraların fıkhî hükmünü ortaya koymak için daha fazla araştırma yapılması gerektiği yönündeki yaklaşımdır. Bu çalışmada araştırmacı bu üç yaklaşımın delillerini ve bu delillere verilen cevapları ele almaya çalışmıştır. Ayrıca bu yirmi görüşün fıkhî analizi yapılmaya çalışılmış, bu analiz neticesinde elde edilen bulgulara değinilmiş ve konuya ilişkin mütevazı bazı önerilerde bulunulmuştur."
