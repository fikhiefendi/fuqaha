abstract: "Bu çalışmada, 8 Numaralı Şâm-ı Şerîf Ahkâm Defteri'ndeki hicrî 1259-1266 (m. 1843-1850) yıllarını kapsayan toplam 225 hüküm, günümüz harflerine çevrilerek tahlil edilmiştir. Daha sonra Osmanlı diplomatik ilmi açısından defterin şeklî hususiyetleri ve tertip tarzı ele alınmıştır.İstanbul'dan, Şam eyâletinin yanısıra, Sayda, Trablusşam, Kudüs, Nablus, Gazze, Mekke ve Medine gibi beldelere gönderilen hükümler çerçevesinde, merkezin taşraya bakışı ele alınmaya çalışılmıştır. Merkezin mahallî idare ile münasebetleri, Tanzimat'ın getirdiği merkeziyetçi eğilimlerin taşradaki yansımaları ve ayrıca seyyidlerin, gayr-ı müslimlerin ve mahallî seçkinlerin münasebetleri, mevcut hükümler dâhilinde değerlendirilmiştir. Bilâdü'ş-Şâm'ın coğrafî konumu ve tarihçesine kısaca değinilen eserde, Osmanlı dönemindeki idarî taksimat ele alınmış, daha sonra ise hükümler tasnif edilmiştir. Hükümlerin şikâyet konularına göre tahlilinin yapıldığı kısımda, hükümler muhtevalarına göre; vergi meseleleri, borç-alacak meseleleri, miras meseleleri, haksız fiillerle alakalı meseleler ve diğer meseleler olmak üzere beş alt başlıkta incelenmiştir. Bölgede yer alan vakıflar da hükümler çerçevesinde incelenmiştir. İncelenen hükümler günümüz harflerine aktarılarak özetleriyle beraber tezde yer almıştır."
