abstract: "Hanefî Usulcülerinden Kadı Ebû Zeyd ed-Debûsî'nin Kıyas Nazariyesi (Takvimü'l-Edille Adlı Eseri Çerçevesinde) adlı bu çalışmamızda Fukaha metodunun günümüze ulaşan ikinci usûl eseri olan Takvimü'ledille'de Debûsî'nin kıyas hakkındaki görüşleri ve kendisine yöneltilen itirazlar beraber verilmeye çalışılmıştır. Tezin giriş bölümünde Debûsî'nin yaşadığı dönem, hayatı, eserleri ile Hz. Peygamber döneminden başlayarak geniş anlamda kullanılan re'yin kıyas formatına dönüştürülme aşamaları incelenmiştir. Birinci bölümde Debûsî'nin, Takvimü'l-edille'de kıyas konusunu işlerken kavramlara yüklediği manayı, kıyasın sahih olması için gerekli olan şartları, kıyasın üzerine bina edildiği illetin anlamını, etkisini ve onun te'sirine engel olan halleri nasıl ele aldığını tespit etmeye çalıştık. Bu tespit yapılırken Hanefi doktirinin ilk eserlerinden olan Cessas'ın (ö. 370/981) \"el-Fusûl fi'l Usûl? adlı eseri ile Debûsî'nin te'sir ettiği Serahsî ve Pezdevî'nin Usûllerinden farklı olan yönleri, bu esere tenkit olarak yazılan Ebu'l-Muzaffer Sem'ânî'nin ?Kavâtıu'l-Edille fi'l-Usûl? adlı eseri ile, Gazzâlî'nin ?Şifaü'l-Ğalil? eserinde verilen cevaplar ortaya konmaya çalışılmıştır. İkinci bölümde ise illetlere yönelik itirazlar, illetlerin tercihi ve illetlerle ilişkisi bulunan sebep, şart ve alâmet kavramları üzerinde durulmuştur. Debûsî merkezli yaptığımız bu çalışmada ulaştığımız sonuç; nassın manasını genişletme anlamına gelen kıyası, subjektif değerlendirmelerden kurtarabilmek için kıyas ve illet hakkında birtakım teorik şartların ileri sürüldüğü tespit edilmiştir. Ayrıca konu, giderek İslam Hukuku Metodolojisinden Cedel ilmine doğru bir kayma göstermiştir. Böylece kıyasın hem alanı daralmış hem de işlevsiz hale gelmeye başlamıştır."
