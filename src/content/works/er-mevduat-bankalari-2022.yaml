abstract: "Asimetrik bilgi teorisinin, sigorta, sağlık, tüketim, siyaset, medya alanlarını etkilediği gibi, özellikle ülke ekonomisine katkı sağlayan bankacılık alanında da etkili olduğu görülmektedir. Bu çalışmanın amacı, asimetrik bilgi kriterlerinin Türkiye'de faaliyet gösteren mevduat bankaları ile katılım bankalarının finansal performansları üzerindeki etkilerini ampirik olarak incelemektir. Ayrıca bu çalışmada, bu iki banka türünün bilançoları ile asimetrik bilgi teorisi değişkenleri arasında bir ilişki olup olmadığı analiz edilmekte ve karşılaştırılmaktadır. Çalışmada, katılım bankaları ile mevduat bankalarının 2013-2019 yılları arasındaki verileri araştırmanın örneklemini oluşturmuştur. Banka seçiminde kalkınma ve yatırım bankaları kapsam dışı bırakılmıştır. Çalışmanın ampirik uygulamasında korelasyon, regresyon ve panel veri analizi yöntemleri tercih edilmiştir. Analizler, bankacılık sektöründe yer alan tüm bankaların yanında katılım bankaları ve mevduat bankaları için de ayrı ayrı uygulanmıştır. Çalışmada bankaların bilanço göstergeleri olan sermaye/toplam varlık ve likidite/toplam varlık oranları bağımlı değişken, asimetrik bilgi teorisine göre banka bilançoları üzerindeki etkisi olduğu düşünülen tüketici güven endeksi, reel kesim güven endeksi ve BIST-100 endeksi ise bağımsız değişken olarak ele alınmıştır. Araştırma sonucuna göre, katılım bankaları ile mevduat bankalarının sermaye/varlık ve likidite/varlık oranları ile tüketici güven, reel güven ve BIST-100 endeksi arasındaki ilişki düzeyleri zamana ve konjonktürel gelişmelere göre farklılık gösterdiği tespit edilmiştir. Ayrıca, asimetrik bilgi teorisinin değişkenlerinin bu iki bankacılık türü üzerinde etkisi olduğu görülmüştür. Asimetrik bilgi teorisi çerçevesinde katılım bankaları ile mevduat bankalarına yönelik çalışmaların sınırlı olmasından dolayı bu araştırmanın literatüre ve özellikle katılım bankacılığının gelişimine katkı sağlaması beklenmektedir."
