abstract: "Kur'ân-ı Kerîm'in lafzi açıdan ihtilâfa müsait muhtevası, fıkhî ihtilâfların bir sonucu olan mezheplerin meşruiyetinin bir delilidir. Ahkâm âyetlerinde bulunan ve farklı hükümlerin ortaya çıkmasına zemin hazırlayan zannîlik, dinin esasını teşkil eden nasların tabiatının bir gereği olarak, fıkhî mezheplerin oluştuğunu göstermiştir. Mezheplerin görüşlerinde zıtlık mevcut olsa dahi dayandıkları usûlî arka plan çerçevesinde değerlendirildiğinde tutarlı bir sürecin ürünü oldukları ve bütünlük arz ettikleri söylenebilir. Klasik dönemde mezhep sistematiğine dayanan Kur'ân-ı Kerîm'in yorumlanmasında ihtilâflar zuhur etmiş olsa da bunlar ferdi olmaktan çok kurumsal bir yapıda ortaya çıkıp sağlam bir usûlî zemine oturtulduğundan dindeki öz dinamiklerle tutarlılık içerisinde olmuştur. Bu minvalde yapılan Kur'ân-ı Kerîm yorumu neticesinde farklı sonuçlar ulaşılsa da bu yorumlar Müslüman toplumda bir saygınlık kazanmıştır. Ortaya çıkan ihtilâflar tefrika olarak görülmemiş, aksine ameli nitelikte alternatif uygulamaların kaynağı görülerek bu yönüyle rahmet olarak nitelendirilmiştir. Özellikle ameli meselelerde Kur'ân-ı Kerîm'in doğru yorumlanabilmesi Müslümanların kahir ekseriyetinin hemfikir olduğu konulardan biridir. Bu faaliyet oturmuş bir usûlî zeminde yapılmadığı taktirde ise her Kur'ân-ı Kerîm yorumcusu münferit bir anlayışla harekete edeceğinden amelî boyutta Kur'ân-ı Kerîm birleştirmeden daha çok Müslümanların ayrışmalarına hatta sapmalarına yol açacaktır. Bu anlamda Kur'ân-ı Kerîm'in yorumunda tutarlılığın sağlanması ancak usûl-i fıkıh yönteminin takibi sayesinde mümkün olacağı için günümüzde Kur'ân tefsirinde uygulanacak ilk yöntem olması gerektiği söylenebilir. İslâmın'ın ilk dönemlerinden beri ictihada açık alanlarda kavrayış farklılığı ve nasların ihtimalli yapısı gibi nedenlerle farklı görüşler ortaya çıkmıştır. Bu husus hem Hz. Peygamber'in (s.a.s.) hayatta olduğu dönemde hem de vefatından sonra sahâbenin fıkhî istinbatında kendini göstermiştir. Özellikle hicri ikinci asırdan itibaren Kur'ân'daki ahkâm âyetlerinin anlaşılmasına yönelik telif edilen ahkâmü'l-Kur'ân eserleri, Kur'ân nassının hukuka yönelik tarafını açıklamaktadır. Müctehidler makâsıd-ı şerîa esasları çerçevesinde ve usûl-i fıkhın oluşturduğu teorik zemin üzerinde ahkâm ayetlerini yorumlamışlardır. Bu bağlamda bu çalışmada fıkhî dönemler içerisinde o dönemin fıkhî durumu aktarılmış, dönemleri içerisinde ahkâmü'l-Kur'ân eserleri tanıtılmaya çalışılmış, Hanefî, Şâfiî ve Mâlikî mezheplerine ait başucu eser olarak kabul edilen teliflerin üç tanesi yöntem ve kaynakları açısından araştırılmış ve Nisâ sûresi özelinde oluşan ihtilâfların usûl-i fıkh açısından incelenmesi yapılmıştır."
