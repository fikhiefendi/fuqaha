abstract: "Bâlîzâde Mustafa Efendi, IV. Mehmed döneminde dokuzuncu şeyhülislam olarak altı ay görev yapmıştır. Dönemin siyasi çalkantıları sonucu sadrazam Köprülü Mehmed Paşa'nın kararlarına uyum sağlayamadığı gerekçesiyle azledilmiştir. Kendisi hanefî fıkhına dair birçok eser yazmış, dönemin meşhur kitaplarını toplumun daha iyi anlaması için emek vermiş bir zattır. Hanefî fıkhına dair hacimli eserler yazmakla kalmamış, belagat, hadis usulü, tefsir alanlarında da eserler kaleme almıştır. Araştırma Bâlîzâde Mustafa Efendi'nin ilmi şahsiyetini ve eserlerini tanıtma amacı taşımaktadır. Tez içerisinde, Bâlîzâde'nin görev yaptığı dönemin anlaşılması amacıyla, IV. Mehmed döneminin siyasi, iktisadî ve dini meselelerinden bahsedilmektedir. Devamında şeyhülislamlık makamının Osmanlı Devleti'ne kadarki süreci ve Osmanlı Devleti'ndeki görevleri ele alınmaktadır. Araştırmanın merkezinde Bâlîzâde'nin eserleri ve fetvâları olması hasebiyle öncelikle eserleri tanıtılarak, incelemeler sonucu ortaya çıkan değerlendirmelerden bahsedilmektedir. Aynı zamanda Bâlîzâde'ye isnad edilen ancak incelemeler sonucu ona ait olmadığını tespit ettiğimiz eserlere de yer verilmektedir. Devamında el-Fetâvâ olarak isimlendirilen fetvâlarının transkript hali sunulmaktadır. Fetvâlarından okunması zor ve açıklanmaya ihtiyaç olanlar Hanefî kaynaklar özelinde açıklanmaktadır. Anahtar Kelimer: Osmanlı Devleti, Şeyhülislam, Bâlîzâde Mustafa Efendi, Fetvâ."
