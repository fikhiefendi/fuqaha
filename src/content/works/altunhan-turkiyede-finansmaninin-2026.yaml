abstract: "Bu çalışma, İslam dininin ibadetlerinden biri olan hac görevini yerine getirmek isteyen bireyler için İslami finansal araçlar kullanılarak nasıl bir birikim çözümü sunulabileceğini incelemektedir. İslam dünyasında ekonomik zorluklar nedeniyle hac gibi maliyetli ibadetlerin yerine getirilmesinde yaşanan sıkıntılara çözüm olarak İslami bankacılık faaliyetleri çerçevesinde sukuk kullanımı önerilmektedir. Türkiye'de Katılım Bankacılığı olarak bilinen İslami bankacılık sistemi, faizsiz finansman ilkesine dayanmaktadır. Sukuk, belirli bir mal, hizmet, proje veya yatırım varlıkları üzerinde eşit değerdeki hisseleri temsil eden sertifikalar olup, menkul kıymetleştirme olarak kabul edilmektedir. Bu araç, yatırımcılara sabit getiri sağlayan ortaklığa dayalı ticari işlemleri kapsamaktadır. Çalışmada Sukuk Yoluyla Hac Birikim Hesabı adıyla bir model önerisinde bulunulmuştur. Modelde, hac için kayıtlı olan müşteriler, Katılım Bankası ve Diyanet İşleri Başkanlığı arasında oluşturulan mutabakatla bir katılım hesabı açarak fonlarını biriktirmektedirler. Bu birikimler, sukuk üzerinden değerlendirilerek müşterilere sabit bir getiri de sağlamaktadır. İslami finansal araçların kullanımıyla hac görevini yerine getirmek isteyen bireyler için sürdürülebilir ve dini kurallara uygun bir finansal birikim çözümü sunulmaktadır."
