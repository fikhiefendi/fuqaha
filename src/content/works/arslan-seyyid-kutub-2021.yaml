abstract: "Araştırmamız Seyyid Kutub'un İslam hukuku alanındaki sosyolojik tespitlerinin analiz ve değerlendirmesini hedeflemektedir. Bu kapsamda araştırmamız Kutub'un İslam hukuku alanındaki tezlerini ele almakta; ibadet, muâmelât ve ukubât alanındaki bazı örneklemlerden hareketle fıkhi perspektifini, fakihlerin yaklaşımıyla mukayese etmektedir. İslam hukukunu sosyolojik bir perspektifle değerlendiren Kutub, İslam hukukunun tarihi olarak geçirdiği evreler, temel özellikleri, sosyolojik açıdan uygulanabilirliği ve diğer hukuklarla mukayesesi konusunda önemli tezler ortaya koymuştur. Kutub'a göre İslam hukukunun toplumda hayat bulması ve gelişip yaşaması ancak rabbani bir yöntemle mümkündür. Çünkü Mekke ve Medine dönemi, vahyin önderliğinde bu rabbani metodun tecelli ettiği en güzel örnektir. Bunun için ilk önce iman konusunun anlatılması ve inanan bir toplumun oluşturulması şarttır. Doğal olarak bu toplum, inandıklarını fiili hayatta yaşamaya başlayınca İslami hükümler ortaya çıkar. Bu araştırmamızda Seyyid Kutub'un İslam hukuku alanındaki tezlerini analiz ederek değerlendirmeye çalışılmıştır. Birinci bölümde Kutub'un hayatı, eserleri ve yaşadığı dönemin sosyal, kültürel, ekonomik ve siyasi durumunu ele alınmış, ikinci bölümde ise İslam hukukunun toplumda uygulanabilirliği ve İslam hukuk düşüncesi ve buna dair analizlerini değerlendirilmiştır. Üçüncü bölümde ise ibadet, muâmelât ve ukubât alanına dair İslam hukukunun bazı hükümlerini nasıl analiz ettiğini ele alarak konuyla ilgili tercih ve yorumlarına yer vermeye çalışılmıştır."
