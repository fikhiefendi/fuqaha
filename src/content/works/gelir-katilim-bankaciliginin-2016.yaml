abstract: "ÖZET KATILIM BANKACILIĞININ ALGILANMASINDA İŞLEYİŞ SİSTEMİNİN ETKİSİ Yasemin GELİR Süleyman Demirel Üniversitesi, İşletme Bölümü, Yüksek Lisans Tezi, 165 Sayfa, Ocak 2016 Danışman: Doç. Dr. Ahmet Hüsrev Eroğlu Ülkemizde faizsiz bankacılık uygulamaları ilk olarak özel finans kurumları adıyla 1985 yılında faaliyete başlamıştır. Katılım bankacılığı ismini aldığı 2005 yılına kadar genel anlamda hakkında çok fazla bilgi sahibi olunmasa da gerekli yasal düzenlemeler ve denetim boşluklarının giderilmiş olması bakımlarından diğer bankalara alternatif olma yönünde ciddi adımlar atılmıştır. Ancak günümüzde bu kurumların daha etkili ve verimli bir şekilde varlık gösterebilmeleri için toplumu bu kurumlar hakkında daha iyi tanıtmak ve bilgilendirmek gerekmektedir. Katılım bankacılığının diğer klasik bankalardan farklı olduğunun özellikle işleyiş sisteminin kişiler tarafından bilinirliğinin düşük olduğu düşüncesiyle bu araştırma yapılmak istenmiştir. Katılım bankacılığı işleyiş sisteminin bilinirliliğinin artmasıyla katılımcıların bu bankalara olan talepleri artacak önyargıları ise azalacaktır. Bu araştırma, katılım bankacılığının ürün ve hizmetlerini kullanan ve kullanmayan katılımcıların, katılım bankacılığı işleyiş sistemi süreci ile ilgili bilgi düzeylerini ölçmek ve bilgi düzeyleri ile cinsiyet, yaş, eğitim, meslek ve gelir grupları arasında herhangi bir farklılık olup olmadığını ortaya koymak amacıyla gerçekleştirilmiştir. Araştırmada ayrıca katılımcıların, katılım bankacılığını hangi sebeplerden dolayı tercih ettikleri ya da etmedikleri ve bu bankaların katılımcıların beklentilerini karşıladığı ya da karşılayabileceğine ilişkin inanışları belirlenmeye çalışılmıştır. Amaç doğrultusunda hazırlanan anket formu; Isparta ili merkezinde ikamet eden, katılım bankalarının ürün ve hizmetlerini kullanan ve kullanmayan katılımcıları kapsayan toplam 470 kişiye uygulanmıştır. Araştırma sonucunda; katılım bankacılığı işleyiş sistemi bilgi düzeylerine ilişkin olarak katılım bankacılığını kullananlar ile kullanmayanlar arasında, cinsiyetler, yaş, eğitim, meslek ve gelir grupları arasında istatistiksel açıdan anlamlı farklılıklar ortaya çıkmıştır. Katılım bankacılığı ürün ve hizmetlerini kullananların kullanmayanlara kıyasla daha bilgili olduğu görülmüştür. Genel olarak baktığımızda katılım bankacığının bilinirliliğinin düşük olduğu dolayısıyla katılımcıların bu bankalara olan algılarının zayıf olduğu görülmüştür. Ayrıca katılım bankacılığının tercih edilmesinde bu bankaların faizsiz çalışmaları, tercih edilmemesinde ise bu bankaların yeterince tanınmaması önemli bir etken olmuştur."
