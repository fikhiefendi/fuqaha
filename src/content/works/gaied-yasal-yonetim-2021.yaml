abstract: "Tezin problemi, bu metodun mahiyetinin bilinmesi ve Libya'nın hali hazırdaki durumuna uygulanmasında saklıdır. Konumuz, Müslümanların birliğini sağlamayı üstlenmesi, meşru otoritenin yokluğunda müztarip olmamaları, onların yararına olan şeyleri sağlama ve kötülükleri onlardan gidermede metodun açıklığa kavuşmasında ve teorik kavramlar ile bilimsel tatbikin bir örnekte uygulanmasının sonucunun bilinmesi açısından çok önemlidir. Bu örnek tekrarlayan bir durum gibi olan Libya örneğidir. İşte araştırmacı bunları üç bölümde ele almaya çalışmıştır. Birinci bölüm tezin konusunu problemini önemini hedeflerini sınırlarını içeriğini ve konu hakkındaki yapılmış çalışmaları açıklayan giriş bölümüdür. İkinci bölümde tez başlığı hakkında mevcut olan terimlerin anlamlarına açıklık getirilmeye ve kavramlaşt ırılmaya çalışılmıştır. Takdir metodu, Faydaların takdiri, Amme yararları, İdarenin olmayışı ve Şer'i idare olmak üzere beş alt kısımdan oluşur. Üçüncü bölüm yararların takdir edilme metodu ve bir örnek olarak Libya'nın incelenip ele alınmasıdır. Takdir metoduna olan ihtiyaç, Bunun kaideleri, Metodu uygulayacak bilimsel yöntem ve Libya'nın incelenmesi ve bununla ilişkili şeylerin ortaya konmasını ele alan dört alt bölümden oluşmaktadır. Tez araştırmacının ulaştığı sonuçları serdederek biter; burada araştırmacı şunları beyan eder: amme yararlarının takdir edilme metodunun bütün idarelerin olmadığı zaman Libya örneği uygunluğu, bu durumun yöntem ile bazen uyum sağlayıp bazen zıt olduğu, bu takdir metoduna yaklaşıp uzaklaşmaktan kaynaklanan sonuçlar hali hazırda Libya da devam etmektedir. Araştırmacı tavsiyelerini bu durumla ilişkilendirmiştir."
