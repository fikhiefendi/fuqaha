abstract: "İslâm hukuku, insanların dünya ve ahiret maslahatlarını sağlamayı kendisine gâye edinmiştir. Bu amacı doğrultusunda gelişen sedd-i zerâi deliliyle, dinin yasakladğı ve maslahatı dışında saydığı bir davranışa götüren, ona ulaştıran vesileyi de engellemiştir.Bu çalışmanın amacı, İslâm hukukunda sedd-i zerâi delilinin, kendisinde bir kötülük bulunmadığı halde fesâda yol açmasından endişe edilen uygulamaları geçersiz kılmasını göstermektir. ?Kötülüklerin engellenmesi? manasına gelen sedd-i zerâi, İslâm hukukunda geniş bir alanda uygulanmıştır. İslâm hukukunda mezhep imamları tarafından, genel olarak kabul görmüştür. Mâlikî, Hanbelî ve Hanefîler, sedd-i zerâi'yi bir delil olarak kabul etmişler ve buna göre hüküm bina etmişlerdir. Şâfiîlerin ise bu delili zayıf kabul etmelerine rağmen onu kullandıkları görülmektedir. Bu prensibin İslâm hukukçuları tarafından genel kabul görmesi, bunun üzerine hüküm bina edilmesi maslahatı kazandıran bir durumdur.Tez, giriş ve beş bölümden meydana gelmektedir. Girişte; zerîa kavramı, çeşitleri, İslâm usul hukukundaki yeri ve önemi üzerinde durulmıuştur. I. Bölüm'de ibadetle ilgili zerîa uygulamaları verilerek konu örneklerle açıklanmaya çalışılmıştır. II. Bölümde ise muâmelatla ilgili alışveriş, şüf'a, riba, selem konularında zerîa örnekleri açıklanmıştır. III. Bölüm ceza hukuku ile ilgili zerîa"
