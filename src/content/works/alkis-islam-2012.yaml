abstract: "Tüketicinin korunması, evrenselliğini ve güncelliğini hiçbir zaman kaybetmeyen yaşamsal öneme sahip bir konudur. Tüketici hakları olarak, temel ihtiyaçların karşılanması hakkı, güvenlik hakkı, bilgi edinme hakkı, seçme hakkı, temsil edilme hakkı, tazmin edilme hakkı, şikâyet hakkı ve muhayyerlik hakkı bulunmaktadır. Tüketici haklarının esas itibariyle, kul hakkı ve malî haklar içerisinde mütalaa edilmesi mümkündür. Tüketicinin korunması için her şeyden önce tüketicinin eğitimi, bilgilendirilmesi ve temsil edilmesi gereklidir. Tüketiciyi koruma çabaları içinde en önemli hususları hiç kuşkusuz üretimde standardizasyonun ve kalitenin sağlanması, ölçü ve tartı kontrolü, çarşı ve pazarların düzenlenmesi ve denetlenmesi oluşturmaktadır. Çarşı ve pazarların denetlenmesi için Hz. Peygamber ve Hz. Ömer dönemlerinde erkek ve kadınlardan oluşan görevliler tayin edilmiştir. İslâm, adalet, doğruluk ve hakkaniyet ilkeleri ile kartel ve tekel oluşumuna karşı çıkarak ihtikârı yasaklamış ve böylece tüketicileri, fiyatlar karşısında korumayı hedeflemiştir. İslâm hukuku, tüketicilerin aldatılmasına karşı çıkarak muhayyerlik haklarıyla kusurlu mala karşı tüketicilerin korunmasını sağlamış ve tüketicilere aldanma ve kusurlu mal sebebiyle akdi bozma hakkı tanımıştır.Hz. Peygamber'den bugüne kadar tüketicinin korunmasında rol üstlenen bir takım kurumlar bulunmaktadır. Bunların ilki, varlığı Hz. Peygamber dönemine dayanan hisbe teşkilatıdır. Hisbe teşkilatı tüketicinin korunmasının pratik bir uygulamasıdır. Selçuklu ve Osmanlı toplumlarında sivil toplum kuruluşu olarak ortaya çıkan Ahîlik kurumu ile esnaf teşkilatı olan Loncalar da, İslâmî ahlâk ilkeleri doğrultusunda kaliteli mal ve hizmet üretimini sağlayarak tüketicinin korunmasında asırlarca önemli rol üstlenmiştir."
