abstract: "Bu çalışma, çeşitli toplumlarda ve kimi kalıplaşmış düşüncelerde; kadının hor ve hâkir görülmesine, ikinci plana atılmış olmasına, sosyal faaliyetlere katılımının kısıtlanmaya çalışılmasına ve tüm bunların dini kaynaklara dayandırılma yaklaşımına karşı, İslam dininin kadına verdiği hak ve sorumluluklarının yeniden incelenmesi üzerine hazırlanmış bir çalışmadır. Kadının statüsünün İslam ile irtifa kazandığı ortadadır. İslam dini kadını, İslam'ın helal kıldığı hiçbir şeyden mahrum etmemiştir. Gerek sosyal içerikli ibadetlere katılımına gerekse kamusal yahut özel sektörde iş hayatında yer almasına mâni olmamıştır. Hz. Peygamber dönemi ve sonrasında ticaretle meşgul olan, siyasetle ilgilenen, sanatla ve fenni ilimlerle ün kazanmış kadın şahsiyetlerin varlığı bilinmektedir. Çağımızın teknoloji çağı olması ve sürekli bir değişim ve gelişim içerisinde olmamız hasebiyle birtakım hükümlerin yeniden ele alınması kaçınılmazdır. Kadının hak ve sorumluluklarının ve yapmakta serbest bırakıldığı hususların da yeniden incelenmesi ve kadına hakkı olan saygı ve değerin verilmesi gerekmektedir. Çalışmamız; kadının yaratılışı, tarihi süreç içerisinde toplumların kadına bakış açısı, kadının eşine, çocuklarına, çevresine karşı ve toplumsal sorumlulukları, kadının maddi ve manevi hakları üzerine değerlendirmeler çerçevesinde gerçekleştirilmeye çalışılmıştır."
