abstract: "Sürdürülebilirlik, insanların çevreye olan negatif etkileri konusunda uyarı niteliğinde ortaya çıkan ve son dönemlerde daha fazla önem kazanmaya başlayan bir kavramdır. Kavramsal çerçevesi 1970'lere dayanan sürdürülebilirlik anlayışı, bu alanda çalışmalar yürüten uluslararası girişimlerin çabaları ile dünya genelinde farkındalık kazanmaya başlamıştır. Küresel iletişim imkanlarındaki ilerlemelerin de yardımı ile gün geçtikçe daha büyük kitleleri etkisi altına almaya başlayan bu anlayış, kurumları faaliyetlerinde ekonomik, sosyal ve çevresel etkileri daha fazla dikkate almaya zorlamaktadır. Bu zorunluluk sürdürülebilirlik anlayışının ekonomik sisteme entegrasyonuna olan gereksinimi ve talebi de arttırmış ve finansal sistemde bu talepleri karşılamaya yönelik ürünler geliştirilmesini sağlamıştır. Bu bağlamda, çalışmanın amacı sürdürülebilirlik anlayışını İslami finansal ilkeler bağlamında ele almak suretiyle, İslami finansal kurumların sürdürülebilirlik alanındaki mevcut durumlarını ortaya koymak ve bu alanda gelişim ihtiyacı olan konularla ilgili farkındalığı arttırmaktır.Üç bölümden oluşan bu çalışmanın ilk bölümünde sürdürülebilirlik anlayışının gelişimi ve günümüz ekonomik sistemindeki yeri hakkında bilgiler verilmiştir. İkinci bölümünde ise öncelikle sürdürülebilirlik anlayışının İslami finansal ilkeler açısından uygunluğu değerlendirilmiş, ardından İslami finansal kurumların sürdürülebilirlik alanındaki uygulamaları incelenmiştir. Çalışmanın son bölümünde ise Türkiye'de, İslami finansal sistemde en büyük paya sahip olan, katılım bankalarının kurumsal müşterilerinin sürdürülebilirlik alanındaki yaklaşımlarını ve mevcut uygulamalarını ortaya koyan ampirik bir araştırmaya yer verilmiştir.Sonuç olarak, sürdürülebilirliğin ekonomik, sosyal ve çevresel alanlarda ortaya koyduğu temel hedefler olan toplumsal eşitlik, adaletli gelir dağılımı, kaynakların geri dönülemez şekilde tüketilmesinin engellenmesi, çevrenin ve tüm canlıların korunması gibi hedeflerin İslami finansal uygulamaların da dayanağı olan İslami prensiplerle örtüştüğü ancak İslami finansal kurumların söz konusu prensipleri uygulamaya geçirme noktasında kaydettikleri ilerlemelerin oldukça sınırlı kaldığı görülmüştür. Bununla birlikte, katılım bankalarının kurumsal müşterileri üzerine yapılan ampirik uygulamanın istatistiksel sonuçları ise katılım bankaları kurumsal müşterilerinin sürdürülebilirlik anlayışını iş yapış şekilleri ile ilişkili algılıyor olmasına rağmen iş süreçlerine entegre etme noktasında oldukça yetersiz kaldıklarını göstermiştir."
