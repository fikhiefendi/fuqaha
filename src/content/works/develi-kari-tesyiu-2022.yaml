abstract: "Hicri dördüncü asırda mezheplerin büyük oranda teşekkülünü tamamlamasıyla beraber alimler arasında, tek bir mezhebe bağlılığın gerekliliği konusunda tartışmalar yaşanmıştır. Özellikle Hanefî ve Şafiî alimler arasında gerçekleşen bu tartışmalar daha sonra müstakil çalışmalara konu olmuştur. Şafiî alim Cüveynî'nin (ö. 478/1085) kaleme aldığı Muğîsü'l-halk fî tercîhi'l-kavli'l-hakk isimli eser de konuyla ilgili tartışmaları yönlendirici bir etkiye sahip olması bakımından bu çalışmaların önemli örneklerinden biridir. Cüveynî bu eserinde; Şafiî mezhebinin diğer mezheplerden üstün olduğunu iddia etmiş, diğer mezhep imamlarıyla ilgili ağır eleştirilerde bulunmuş, sonraki devirlerde müellifin bu iddia ve eleştirilerine cevap niteliğinde eserler telif edilmiştir. Bu eserlerden birisi de Ali el-Kârî'nin (ö. 1014/1605) Teşyîʿu fukahâi'l-Hanefiyye li-teşnîʿi süfehâi'ş-Şâfiiyye isimli risalesidir. Bu çalışmada mezkûr eserin tahkik ve tahlili gerçekleştirilmiş ve bu bağlamda Muğîs isimli eserdeki iddiaları tenkit etmeye yönelik Hanefî alimler tarafından kaleme alınan eserlerin karşılaştırılması yapılmıştır. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde Ali el-Kârî'nin yaşadığı dönem, hayatı ve ilmî şahsiyetiyle ilgili bilgiler yer almaktadır. İkinci bölüm eserin tahlili ve benzer eserlerle karşılaştırılmasına ayrılmıştır. Son bölümde ise araştırmamıza konu olan risalenin tahkikli metnine yer verilmiştir."
