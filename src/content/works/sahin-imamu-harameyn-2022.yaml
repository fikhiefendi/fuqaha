abstract: "Neshin, ilk asırlardan beri tartışıla gelen bir konu olduğu malumdur. Bu konuyu usûl âlimleri detaylı bir şekilde aklen ve naklen değerlendirip tartışmışlardır. Ayrıca bu konu hadis ve tefsir ilimlerinde de zikredilip tartışılmıştır. Ancak nesh konusuyla ilgilenen asıl ilim dalı fıkıh usûlüdür. Âlimler, nesh konusuna vâkıf olmayan kişiyi fakîh saymamışlardır. Usûl eserlerinde de müçtehit olmanın şartlarından birisi nâsih ve mensûhun bilinmesi olduğu zikredilmiştir. Dinler ve mezhepler arasında tartışılan nesh konusunun mahiyetine vâkıf olmak şer'î, itikâdî ve daha birçok açılardan önem taşımaktadır. Zira İmâm-ı Âzam Ebû Hanîfe Nu'mân b. Sâbit (ö. 150/767) mensûh bir hükümle fetva vermek veya amel etmek sapıklık (dalâlet) olduğunu ifade etmiştir. Bu bağlamda âlimler, bu konuya önem atfetmiş, hassas davranmış, etraflıca değerlendirip inkarcılarına eleştiri ve cevaplar yazmışlardır. Çıkan ve çıkabilecek her türlü tartışma ve iddiaya karşı en temel şey, neshin mahiyetini bilip onu güçlü bir şekilde savunmaktadır. Dolayısıyla âlimlerin başta sözlük anlamını daha sonra şer'î anlamı üzerine yoğunlaştıkları görülmektedir. Bunun sonucunda nesh kavramı da zamanla daralmış daha sonra mezhepler arasında mahiyetinin anlaşılmasında ihtilaflar oluşmuştur. Örneğin Şâfiî âlimleri neshin ilk hükmün iptali olduğunu kabul ederken Hanefî âlimleri hükmün süresinin beyânı olduğunu kabul etmektedirler. Böylece nesh konusunun ilk tartışılan meselelerinden birisi onun ref' veya beyân oluşu meselesi olmaktadır. Daha sonra neshin nerelerde ve hangi şartlarla gerçekleşebileceği tartışılmıştır."
