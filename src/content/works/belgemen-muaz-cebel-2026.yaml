abstract: "Muâz b. Cebel'in fıkhî yönü gerek Hz. Peygamber döneminde gerekse Hz. Peygamber döneminden sonra sahâbe arasında bilinen bir durumdur. Nitekim Muâz b. Cebel, Hz. Ebû Bekir'in istişare ettiği kişiler arasında yer almıştır. Hz. Ömer de fıkhî konularda sorusu olanları ona yönlendirmiş ve onu Şam bölgesine ilim öğretmek üzere görevlendirmiştir. Ancak onun fıkıh birikimi ve mezheplerin fürû literatürlerindeki etkileri akademik bir çalışma konusu yapılmamıştır. Bu çalışmada Muâz b. Cebel'in Hanefî fürû fıkhındaki tesirinin ibadetler başta olmak üzere fürû fıkıh konularının incelenmesi ve analizi yapılarak tespit edilmesi amaçlanmıştır. Bizzat Hz. Peygamber tarafından“Ümmetin helâl ve haramı en iyi bilen kişisi”olarak ve“Kur'an'ın kendisinden alınacağı dört kişiden birisi”olarak belirtilen, Hz. Peygamber hayattayken, namaza geç katılanların (mesbûk) durumunda olduğu üzere, ictihad eden ve bizzat Hz. Peygamber tarafından Yemen'e kadılık, elçilik, muallimlik ve zekât memurlarından zekatları toplamak gibi görevleri ifa etmek üzere görevlendirilen Muâz b. Cebel'in fıkhî yönünün tespitine katkı sunması bakımından fıkıh tarihi ve fürû fıkıh alanlarındaki bir boşluğun doldurulma gayesi temel hareket noktasıdır. Muâz b. Cebel; ibadet, muâmelât, aile hukuku, ceza, miras ve savaş hukuku alanları da dahil olmak üzere fürû fıkhın hemen her alanında rivayette bulunmuş, bazı konularda ise bizzat ictihad etmiş ve ictihadı Hz. Peygamber tarafından onaylanmıştır. Bu çalışmada bu ictihad ve rivayetlerden ibadetler başta olmak üzere, muamelat, aile hukuku ve ceza hukukunda yer verilen rivayetler ve Hanefî fıkhına etkileri incelenmiştir. Buna göre; cemaatle namazın kısa tutulması, mesbûkun namazı, nâfile kılan bir imama farz kılan bir cemaatin uyması, namazların yaz ve kış mevsimlerine bağlı olarak erken veya geç kılınması, vitir namazının hükmü; zekâtın farziyeti, kimlere verilebileceği, nisap miktarları, başka bir beldeye taşınması, öşürün mahiyeti ve hangi mallardan alınacağı, müzâraanın cevazı, mevat arazinin ihyası, rehnin ziyadesi, iddetlerin tedahülü, maraz-ı mevtte nikah, hamile kadının recmi vb. konularda Hanefî fıkhında Muâz b. Cebel'in ictihad ve rivayetlerine başvurulmuştur. Ayrıca çalışmada Muâz b. Cebel'in rivayet ve ictihadlarının ekseriyetinin onun uygulamalarına dayandığı tespit edilmiş ve bu durum onun Yemen görevi ile ilişkilendirilmiştir. Bir diğer tespit ise Hanefî mezhebinde yer verilen bütün Muâz rivayetlerinin doğrudan uygulamaya esas kabul edilmeyip bazılarının tevil edilerek kullanıldığıdır."
