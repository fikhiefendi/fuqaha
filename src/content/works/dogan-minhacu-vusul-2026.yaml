abstract: "Fıkıh usulü geleneğinde teklîfî hükümler kategorisinde yer alan vâcip kavramı etrafında pek çok mesele tartışılmıştır. Bu meselelerden biri de mukaddimetü'l-vâcip diye bilinen, vâcip olan fiilin yerine getirilmesinin ancak kendisiyle mümkün olduğu sebep veya şartların da vâcip olup olmadığı meselesidir. Bu çalışma söz konusu meseleyi, usûl literatüründe önemli bir yerde duran Nâsıruddîn Abdullah b. Ömer el-Beyzâvî'nin(ö. 691/1292) Minhâcü'l-vüsûl ilâ 'ilmi'l-usûl metni ve metnin şerhleri bağlamında ele almaktadır. Çalışma; mukaddimetü'l-vâcibin unsurları olan mukaddime, sebep, şart ve vâcip kavramlarının analizini yapmakta; meselenin Beyzâvî'ye kadar yaşamış usûlcüler tarafından işleniş biçimlerini, kısmen mukayeseli olarak incelemektedir. Bu bağlamda Beyzâvî'nin konu ile alâkalı tercihleri, istidlâl tarzı, meseledeki ihtilafın lafzîliği ve meselenin fürûya yansıması gibi hususlar şerh ve hâşiyeler üzerinden takip edilmiştir. Bunun yanında mesele, sebep-şart kavramlarının dereceli yapısı, mukaddimetü'l-vâcibin vâcip çeşitleriyle birlikte ele alınması ve meselenin temellendirilmesinde hüsün-kubuh problemi başlıkları altında değerlendirilmiştir."
