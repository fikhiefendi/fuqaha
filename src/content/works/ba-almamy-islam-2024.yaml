abstract: "Araştırmamızın amacı, Batı Afrika'nın Fouta Tooro bölgesinde kurulan Almamy devleti'nin iktisadi politikalarını İslam iktisadı açısından değerlendirmektedir. 18. yüzyılda kurulan bu devlet, iktisadi politikalarıyla İslamî değerlere dayalı bir toplumsal düzen kurmayı amaçlamıştır. Bu politikaların, temel olarak bir sosyal adalet projesi çerçevesinde bölgedeki insanların hayatlarını her yönüyle kapsayacak mahiyette olduğu görülmektedir. Tezimizde halkın sosyal hayatını düzenlemek ve ekonomik durumunu iyileştirmek için nelerin nasıl yapıldığına ışık tutmayı amaçladık. Bu itibarla öncelikle bölgenin tarihi ve tarihte rol oynamış önemli şahsiyetler çerçevesinde, o dönem bölgede yaşayan Müslümanların sosyal, kültürel ve ekonomik hayatları incelenmiş olmaktadır. Genel anlamda bu devletin, toplumun ekonomik strüktürünü sistematik bir şekilde inşa edip adaleti sağlayacak kurumları kurmak; ticaret, tarım, balıkçılık ve hayvancılık gibi ekonomik faaliyetlerin İslam hukukunun öngördüğü şekilde yürütülmesini sağlamayı amaçladığı görülmektedir. Ayrıca halk arasındaki yoksulluk ve ekonomik zorlukları hafifletmek ve refahın yayılmasını sağlamak üzere bazı kurum ve hukuki düzenlemeler yapılmıştır. Sonuç olarak bu çalışmada, söz konusu ekonomik politikaların İslam iktisat ilmi açısından değerlendirilmesi yapılmaya çalışılmıştır."
