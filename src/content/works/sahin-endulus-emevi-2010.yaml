abstract: "Din, dil, ırk, milliyet ve kültür ayrımının yoğun olarak yaşandığı bir coğrafyada 736 yıl süren bir egemenlik, çağını aşan bir medeniyete nasıl ulaştı, barışı ve adaleti nasıl sağladı? Bu medeniyet inkişafının gizemli kapılarından birinin anahtarı danışmanlar meclisi sistemiydi. Emîr/halife, vezir, kadi'l-cemâa, kadı ve halk, bir sorunları olduğunda yanlarında son derece olgun konunun uzmanı bir hukukçu bulabiliyorlardı. Hukuk öylesine gelişmişti ki mahkeme kâtipleri bile sahalarında uzman birer hukukçuydu. Devlet başkanı, devleti ilgilendiren dâhilî ve haricî her türlü sorunu hukukçulardan müteşekkil danışmanlarıyla karara bağlıyor, onların hukuka uygun görmediği tasarruflarda bulunamıyordu. Hâkimler duruşmaya dört uzman hukukçuyla giriyor, hâkimin karar veremediği davalar Kâdi'l-cemâa tarafından Hukukçular Konseyi toplantısına getiriliyordu. Hukukçular konseyi her biri kendi sahasında uzman, çok yönlü, olgun, salih, akıllı, tecrübeli, ilim ve takva sahibi insanlardan oluşuyordu. Müşavirler Meclisi adı verilen bu konsey halkın arasına karışıyor, onların sorunlarına çare oluyor, eğitim veriyor, halk hâkimlerden şikâyetçi olduklarında duruma el koyuyordu. Müşavirler üst düzey bir kamu görevlisi olarak devlet erkânı nezdinde de oldukça önemli bir konuma sahiptiler. Bu konumları onları toplumun barış ve adalet içinde yaşamasının bel kemiği haline getiriyordu."
