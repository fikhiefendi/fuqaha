abstract: "Eşcinsellik, toplumsal değerlerin ve ahlakın sapmasına neden olduğu için birey ve toplum için büyük tehlikeler oluşturmakta ve cinayet, alkolizm, uyuşturucu kullanımı, nefret ile şiddet kullanmak ve başkalarına saldırmak da dahil her türlü suçu artırmaktadır. Bu araştırmada takip edilen yöntem, İslam hukuku ile pozitif hukuktaki suç ve ceza hukuku metinlerini analitik olarak incelemek ve ardından İslam Hukuku ile Irak Ceza Hukukunu karşılaştırmaktır. Araştırma, Irak'taki ceza mevzuatının İslam hukuk ilkelerine uyumlu ve çelişik yanlarının ortaya konulması ile İslam hukuku ve Irak Ceza Kanunu'ndaki eşcinsellik suçunun tespitini amaçlamaktadır. Ayrıca çalışmada eşcinselliğin gelişiminin en önemli nedenlerinin, tehlikelerinin ve tedavi yöntemlerinin de izah edilmesi hedeflenmektedir. Bu araştırma bir giriş bölümü ve iki ana bölümden oluşmaktadır. Giriş bölümünde eşcinselliğin ne olduğu, çeşitleri ve toplumlardaki yayılma sebepleri anlatılmıştır. Birinci bölümde İslam hukuku ve Irak Ceza Kanunu'ndaki eşcinsellik suçlarının türleri anlatılmıştır. İkinci bölümde, araştırmanın yazımında faydalanılan kaynak ve referanslardan bahsedilerek İslam hukuku ve Irak hukukunda eşcinsellik suçlarının ispat yöntemlerine değinilmektedir. Son olarak, araştırmada ulaşılan şu sonuçlar zikredilmektedir; İslam temiz ve iffetli bir dindir, O insanlara namusun muhafazası ile ırzın savunulmasını salıklar. İslam hukuku, toplumun fertleri arasındaki ilişkileri düzenleyen ve insanı koruyan kanunların en geniş olanıdır. Eşcinsellik ise bütün çeşitleriyle yaratılıştan sapma ve selim fıtrattan çıkıp uzaklaşmaktır. Bununla beraber o toplum binasının yıkılışına sebep olur. Allah (c.c) fıtri cinselliğin doyurulması için tek bir yolu meşru kılmıştır. O da hayatın ve insan neslinin devam etmesinin garantisi olan meşru evliliktir."
