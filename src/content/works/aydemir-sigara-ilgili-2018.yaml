abstract: "Sigara İle İlgili Yazılmış Risalalerin İslam Hukuku Açısından Değerlendirilmesi konulu çalışmamız üç bölümden oluşturuldu. İlk bölümde tütün ve ondan üretilen sigara tanıtıldı. Tütün ve sigaranın tarihi serüveni ele alınarak tezimizin amacına uygun bir zemin oluşturulmaya çalışıldı. İkinci bölümde sigara hakkında İslam âleminde meşhur olan klasik diyebileceğimiz günümüzde de sigara hakkındaki tartışmalarda kendilerine referans olarak atıf yapılan çeşitli dönemlerde kaleme alınmış risâleler ele alındı. Bu risaleleri tanıtarak öncelikle sigaranın dini hükmüne dair müelliflerin görüşlerine yer verildi. Çalışmamızdaki risâleler sigaranın helalliğini savunanlar, haramlığını iddia edenler, tarafsız kalanlar ve farklı yönlerine değinenler olmak üzere dört kısımda değerlendirildi. Bu eserleri yazan müellifler hakkında kısa bilgilere yer verildi. Üçüncü bölümde risalelerde sigaranın haramlığı hakkında dayanak olarak gösterilen gerekçe ve sebepler ele alındı."
