abstract: "Bu tezin hazırlanmasında gözetilen amaç Mecelle'nin külli kaidelerini Kur'an-ı Kerim ayetleriyle temellendirmektir. Bu amaçla öncelikle Mecelle'nin tanıtımı yapılmış, akabinde külli kaidelerle ilgili ansiklopedik bilgilere yer verilmiştir. Daha sonra Mecelle'nin külli kaideleri incelenmiş ve asıl konuya girişte bir hazırlık aşaması ortaya koyma yoluna gidilmiştir.Çalışmanın ana bölümünde gözetilen maksat belli ölçüde yerine getirilmiştir. Buna göre Mecelle'nin külli kaidelerinin sanılandan daha fazla bir oranda ayetlerle ilişki-lendirilebildiği ortaya konmuştur. Böylece bir hüküm koymada külli kaidelerin delil olup olamayacağı tartışmasına belli bir oranda katkı sağlanmış olmaktadır.Çalışma sonucunda kaidelerle ayetlerin doğrudan ilişkili olduğu görülmüştür. Çünkü kaideler ile ayetleri ilişkilendirmede derin bağlantılar kurma ihtiyacı hissedil-memiş, konuyla ilgilenenlerin kabul edeceği yorumlar yapılarak külli kaideler ilgili ayetler ile desteklenmiştir."
