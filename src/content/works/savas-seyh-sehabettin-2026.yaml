abstract: "Çalışma hem İslam Hukuku hem de Osmanlı ilim geleneğinde ribâ meselesini ele almış; Muhammed b. Ahmed'in Osmanlıca Ribâ Risalesi ile Kemâlpaşazâde'nin Arapça Ribâ Risalesini karşılaştırmalı olarak incelemeyi amaçlamıştır. Ribâ yasağı, İslâm hukukunun temel hükümlerinden biri olarak tarih boyunca farklı ilmî çevreler tarafından tartışılmış; bu tartışmalar zamanla çeşitli risaleler, fetvalar ve ilmî eserler aracılığıyla yazılı kültüre yansımıştır. Çalışmada, söz konusu iki risalenin içerikleri, biçimsel yapıları, üslupları, kavramsal çerçeveleri, delillendirme biçimleri ve toplumsal arka planları arasındaki benzerlik ve farklılıkların fıkhi açıdan değerlendirilmesi amaçlanmıştır. Aynı zamanda bu eserlerin, kaleme alındıkları dönemin iktisadî ve sosyal yapısına dair sundukları dolaylı bilgiler ile İslâm Hukuku açısından taşıdıkları ilmî değerin ortaya konulması hedeflenmiştir. Yapılan inceleme sonucunda, Muhammed b. Ahmed'in risalesinde daha çok pratik yönün ve halkı irşad edici üslubun öne çıktığı; Kemâlpaşazâde'nin eserinde ise sistematik ve kaide merkezli bir yaklaşımın belirgin olduğu görülmüştür. Her iki risale öncelikle tam metin çeviri yoluyla günümüz Türkçesine aktarılmış, ardından metin çözümlemesi ve karşılaştırmalı analiz yapılmıştır. Muhammed b. Ahmed'in eseri, Osmanlıca nüsha üzerinden; Kemâlpaşazâde'nin eseri ise Arapça nüsha üzerinden değerlendirilmiştir. Çalışmanın sonucunda, her iki eserin de ribâ yasağını Hanefî fıkıh geleneği çerçevesinde ele aldığı; içerik ve konuyu değerlendirme açısından farklılıklar olduğunu görülmüştür. Muhammed b. Ahmed halkı ribâ tehlikesine karşı uyarmayı amaçlamış ve konuyu tüm uygulama alanlarıyla ele almıştır. Kemalpaşazâde ilmî sistematiğe bağlı kalarak meseleyi fıkhî kaideler çerçevesinde detaylandırmıştır. Bu durum, Osmanlı ilim çevrelerinde aynı meseleye farklı yaklaşımların bir arada bulunabildiğini göstermektedir. Araştırma, yalnızca iki risale arasındaki mukayeseyi değil, aynı zamanda Osmanlı düşünce dünyasında ribâ konusunun toplumsal ve ilmî boyutlarını anlamak açısından da önem arz etmektedir. Ayrıca bu çalışma, ribâ risalelerinin hem fıkıh tarihi hem de Osmanlı iktisat tarihi açısından önemli birer kaynak niteliğinde olduğunu ortaya koymuştur."
