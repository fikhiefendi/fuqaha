abstract: "Bu tezin konusu 19. yüzyıl Niğde ili Bor Kasabası müftülerinin Meşihat-ı İslamiyye ile olan ilişkileridir. Bu çalışmada bilimsel araştırma yöntemlerinden nitel araştırma yöntemi kullanılmıştır. Nitel araştırma yöntemlerinden doküman incelemesi yapılmıştır. Doküman incelemesi sırasında Başbakanlık Osmanlı Arşivi mahiyetinde elde edilen bulgular üzerinden tümevarım sağlanmıştır. Ortaya çıkarılan tümevarım ile de bulguların betimsel analizi yapılmıştır. Bu hususta kadı sicillerinden yararlanılmıştır. Öyleki kadı sicilleri Osmanlı sosyal ve idari hayatının en mühim kaynaklarından biridir. Kadı sicilinde müftülere aid izler tespit edilmeye çalışılmıştır. Bununla birlikte çalışmamızda birincil kaynak olarak Bor müftüleri hakkında Meşihâte gelen şikâyetler incelenmiştir. Bu anlamda elde edilen bilgilerle Bor kasabasının şer'i idâre kadrosu ve bu kadroya başvurulan davalar hakkında bir tablo ortaya konulmuştur. Bu tablolar 19. yüzyılda görev alan Bor müftülerinin ailesi ve tayin süreçleri hakkında elde edilen bulgularla desteklenmiştir. Böylelikle 19. yüzyıla gelindiğinde Bor kasabasında müftülerin nüfuziyetini koruyamadığı bu sebeple adlî olaylara karıştıkları ve ulemâ ile münakaşâ içerisinde oldukları açığa çıkmıştır."
