abstract: "Kurumsal sosyal sorumluluk; işletmenin sosyal, çevresel ve insani boyutta taşıması gereken sorumluluklara yönelik kurumsal olarak geliştirdiği ve yürüttüğü faaliyetlerdir. Bu faaliyetler, tüketici gözünde işletme imajını yansıtmak ve pekiştirmek üzere kurgulanmakta ve uzun dönemli stratejiler olarak planlanmaktadır. Programların başarılı olabilmesi için önemli olan nokta; sürdürülebilirliğinin sağlanması ve işletme vizyonu ile paralel olmasıdır. Ancak bu doğrultuda güvenilir ve gerçekçi bulunan programlar, başarılı yürütülmeleri ve sonlandırılmaları durumunda işletme için rekabet gücü sağlayan bir araç haline gelmektedir. Katılım bankaları, gerek işleyişi gerekse tüketici profili bakımından özellikli bankalardır. İslami kurallar çerçevesinde bir finansal işleyişe sahip bankaların bu hassasiyeti, etkisini kurumsal imaj ve marka stratejilerinde de göstermektedir. Bu bakımdan katılım bankaları tarafından yürütülen sosyal sorumluluk programlarının da genel perspektifleri ile uyumlu olmaları ve hedef kitlesinde gerekli farkındalığı sağlamaları beklenmektedir. Çalışmamızda Türkiye Finans, Albaraka Türk ve Kuveyt Türk katılım bankalarının gerçekleştirdikleri kurumsal sosyal sorumluluk programlarına yönelik tüketicilerinin farkındalık düzeyleri ölçülmüş ve bu faktörlerin tüketici nezdinde markaya duyulan güven ve farkındalığa etkisi araştırılmıştır. 259 kişi ile yapılan anket çalışmasının sonuçları, IBM SPSS istatistik paket programı kullanılarak; ortalama ve standart sapma gibi tanımlayıcı analizlere tabi tutulmuştur. Student t-testi, varyans analizi (ANOVA) ve bunların parametrik analizler sonucunda; Türkiye Finans, Albaraka Türk Katılım bankaları için marka bilinilirliğinin bir kısmının sosyal sorumluluk projeleri ile açıklanabileceğini göstermiştir. Kuveyt Türk Katılım bankası için sosyal sorumluluk projelerinin marka bilinilirliğini etkilemediği sonucuna ulaşılmıştır."
