abstract: "Bu tezde Kanunî Sultan Süleyman devrinde 1534-1539 yılları arasında şeyhülislamlık yapmış olan Saʻdi (Sadullah) Çelebi'nin (ö. 1539) verdiği imzalı fetvalarının toplandığı iki mecmua incelenmiştir. Bu mecmular orijinal fetvalardan oluşan yapışdırma türündedir. Diğer yapışdırma fetva mecmualarında birden fazla şeyhülislamın fetvaları toplanmışken bu iki mecmuada sadece Saʻdi Çelebi'nin fetvaları yer almaktadır. Fetva mecmuaları iki yönüyle incelenmiştir. İlk olarak Saʻdi Çelebi'nin orijinal fetvalarının unsurları fetva diplomatikası açısından tahlil edilmiştir. Bunun sonucunda 16. yüzyılın ilk yarısında fetva makamında uzmanlaşmış görevlilerin bulunduğuna ve fetva bürokrasisinin yoğun olduğuna dikkat çekilmiştir. Ardından yapışdırma fetva mecmualarının nasıl ve neden düzenlendiği ile kimler tarafından okunduğu soruları etrafında 16. yüzyılda icra ettikleri fonksiyon anlaşılmaya çalışılmıştır. Mecmuadaki fetvaların aslî unsurlarının yanı sıra üzerlerinde yer alan okuyucu notlarından yola çıkılarak mecmualarının düzenlenme amacının, uygulamaya dönük bir niyetle kazâ veya iftâ görevlilerinin yararlandıkları bir kaynak oluşturmak olabileceğine dikkat çekilmiştir."
