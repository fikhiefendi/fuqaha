abstract: "10./16. yüzyıl Osmanlısında mahkeme kararlarında esas alınacak hukuk kurallarıyla ilgili sultan tarafından çeşitli düzenlemelerin yapıldığı görülür. Bu çalışma, genelde Maruzat adı verilen mecmualarda derlenen söz konusu düzenlemeler üzerinden sultanın Hanefi/Osmanlı hukukunun gelişimindeki rolünün ne olduğu sorusunu ve bu soruyla bağlantılı olarak 10./16. yüzyıl Osmanlı hukukçularının Hanefi mezhebinin hiyerarşik yapısını ve şeyhülislamlar başta olmak üzere Osmanlı hukukçularının ve onların hukuki ürünlerinin bu yapıdaki yerini nasıl algıladıkları sorusunu incelemektedir. Çalışmada, 10./16. yüzyıl Osmanlı hukukçularının içtihat kapısının kapandığı söylemini benimsemelerinin yanı sıra bir hukuki görüşü mezhebin esah/otoriter görüşü haline getirme anlamında tercih yetkisini daha çok 8./14. yüzyıl öncesinde Maveraünnehir, Horasan ve Harezm bölgelerinde yaşayan Hanefi otoriteleri ifade eden meşayihe ait kabul ettikleri ve buna bağlı olarak esah/otoriter görüşleri dönemin hukukçuları üzerinden değil meşayih üzerinden tanımladıkları; içtihat ve tercih ehli hukukçuların artık mevcut olmadığı söyleminin yol açtığı boşluğu ise sultan/merkezi otorite üzerinden doldurdukları, böylece sultanın içtihat ve tercih ehli hukukçularını işlevini üstelenerek Hanefi/Osmanlı hukukunun gelişimine katkı sağladığı iddia edilmektedir."
