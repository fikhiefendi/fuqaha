abstract: "Çalışmamızda insan hayatının ayrılmaz bir parçası olan meşakkatin mahiyeti, sebepleri, meşakkatin giderilmesi için İslâm'ın sunduğu çözüm yolları ve meşakkatin başlıca hukuki sonuçları ele alınmıştır. Bu bağlamda daha yoğun olarak meşakkatin muâmelât boyutunda hilâfu'l-kıyâs olarak caiz olan bey' çeşitleri tespit edilmiş ve meşakkat yönleri incelenmiştir. Tez konusu çalışılırken herhangi bir mezhebin görüşlerine bağlı kalınmamış, mezheplerin genel olarak meşakkatin kaldırılması noktasındaki görüşlerine değinilmeye çalışılmıştır. Çalışmamız üç bölümden meydana gelmektedir. İlk bölümde meşakkat ve yakın anlamda kullanılan kavramlar incelenerek meşakkatin mahiyeti hakkında bilgi verilmiş ve sebepleri tespit edilerek insan hayatına etkilerine değinilmiştir. Tezimizin ikinci bölümünde meşakkatin kaldırılmasına etki eden küllî kâideler tespit edilerek insan hayatına yansımaları değerlendirilmiştir. Çalışmamızın son bölümünde ise meşakkatin önemli görülen hukuki sonuçları ele alınmıştır. Bu bağlamda meşakkatin kaldırılması noktasında kıyas dışı caiz olan bey' çeşitleri tespit edilmiş ve meşakkat yönleri incelenmiştir. Ayrıca meşakkatin kaldırılmasında etkili olduğunu düşündüğümüz kıyasen caiz olan bazı bey' çeşitlerine de değinilmiştir. Çalışmamızda İslâm'ın maddî ve manevî meşakkat noktasında mükelleflere kolaylık sağlayarak onları içine düştükleri sıkıntıdan kurtarmayı hedeflediği sonucuna ulaşılmıştır. Fakat meşakkatler ve bireylerin o meşakkatlere verecekleri tepkiler farklılık arz edeceği için İslâm hukukunda meşakkatin aşamalı olarak kaldırılması esas alınmıştır. Aynı şekilde, asıl itibarıyla caiz olmayan bazı durumlar insanların ihtiyacına binaen caiz kabul edilerek meşakkatin kaldırılması asıl gaye olarak benimsenmiştir."
