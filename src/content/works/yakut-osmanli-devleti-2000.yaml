abstract: "ÖZET İslâmiyet'in ortaya çıkışı ile birlikte doğan ve müftüler tarafından yürütülen fetva verme görevi.şeyhülislâmlık makamının Osmanlı Devleti'nin merkez örgütü içerisinde yer alan bir organ olarak ortaya çıkıp bu görevi üstlenişine kadar, örgütsel bir eylem olmaktan çok bağımsız bir mekanizma olarak işlev görmüştür. Fatih Sultan Mehmed'in yönetimde izlediği merkezileşme politikası sırasında bağımsız bir organ olarak devlet teşkilâtı içerisinde yapılanan şeyhülislâmlık makamı, başlangıçta sadece fetva verme görevini üstlenmiş olmasına rağmen, XVI. yüzyıldan itibaren ilmiye teşkilâtının başına geçerek ulemanın atama ve azil işlerinin yanında, şer'i mahkemeler, medreseler ve talebe-i ulûmla ilgili işlere de nezâret etmiştir. II. Mahmud döneminde, şeyhülislâmlık makamı ve bu makama bağlı çalışan çeşitli memurların topluca Ağakapısı binasına taşınmaları ve Meşihat'ı ilgilendiren bütün işlerin bu binadan yürütülmesi birimin kurumsallaşması yönünde önemli bir adım olmuştur. Yine bu dönemde Meclis-i Vükelâ'nın teşkil edilip, şeyhülislâmın daimi üye olarak bu meclis içerisinde yerini alması, onun siyasî hayat içerisinde oynadığı rolün devamlı hale gelmesine bir zemin hazırlamıştır. Tanzimat'la birlikte her alanda olduğu gibi adalet ve eğitim alanlarında da Batı tarzında kurumlar oluşturulmuştur. Oluşturulan bu kurumlara karşın mevcut geleneksel kurumların başındaki konumlarını devam ettiren şeyhülislâmlar, Meclis-i Vükelâ üyesi olmaları nedeni ile siyasî alandaki yetkilerini de sürdürmüşlerdir. Bu dönemde Meşihat Dairesi içerisinde açılan meclislerin sayıca artması kurumsallaşma sürecinin hızlanması ile doğrudan orantılıdır.II. Abdülhamid'in iktidarı sırasında şeyhülislâmlık makamı üzerindeki devlet kontrolü arttırılmış, şeyhülislâmın elinde bulundurduğu fetva yetkisinden ve ulema üzerindeki etkisinden çekinen padişah sadece çok güvendiği kimseleri bu makama getirmeye başlamıştır. II. Abdülhamid, izlediği İslamcı politika doğrultusunda, din işlerinin devlet eliyle idaresinde önemli rol oynayan Meşihat Makamı içerisinde de dini yayınların denetimi, Kur'an-ı Kerim'in basımının kontrolü gibi işlerle ilgilenen organları oluşturmuştur. II. Meşrutiyet'in ilânını takip eden yıllarda İttihad ve Terakki Cemiyeti'nin dinin ve dinî kurumların devlet yönetimi içerisinde yeniden yapılanmasına yönelik izlediği politikalar doğrultusunda Meşihat Dairesi yeniden şekillendirilmeye ve yapılandırılma ya çalışılmıştır. Bu amaçla Meşihat'ın diyanet işleri dışındaki diğer görevlerine son verilmiş, fakat dinin devlet işlerinden soyutlanması konusunda tam anlamı ile başarıya ulaşılamamıştır. Şeyhülislâmların siyaset sahnesi içerisinde doğrudan rol oynamaya başlamaları ve dinî kimlikleri kadar siyasî bir kimlikte taşımaları İttihadçıların amaçlanan noktaya ulaşmalarını engellemiştir. I. Dünya Savaşı'nm sonlarında İttihad ve Terakki Partisi'nin siyasî gücünü yitirmesi ile birlikte savunduğu fikirler ve uygulamaya koyduğu düşüncelerde de geri adımlar atılmış, bu bağlamda Meşihat Dairesi'nin elinden alınan adlî yetkileri iade edilmiş ve şeyhülislâmlık, Ankara Hükümeti'nin 1 Kasım 1922 tarihinde Osmanlı Devleti 'ne bağlı bütün kurumları ilgasına kadar varlığını sürdürmüştür."
