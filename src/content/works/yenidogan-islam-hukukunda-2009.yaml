abstract: "Bu çalışmanın amacı, İslam hukukunda küçüklerin evlendirilmesinin hukukî dayanak ve felsefesini ortaya koymaktır. Ayrıca problemin geçmiş ve günümüzdeki diğer hukuk sistemlerindeki yerine değinmek suretiyle, meselenin daha iyi anlaşılması hedeflenmiştir. Araştırmalarımız sonucunda, eski hukuk sistemlerinin çoğunda küçüklerin evlendirilmesi uygulamasının var olduğu görülmüştür. Buna bağlı olarak küçüklerin velileri tarafından evlendirilmesinin, İslam hukukuna özgü bir problem olmadığı söylenebilir.Küçüklerin evlendirilmesi konusu İslam hukukçuları arasında tartışılmış, sonuçta küçüklerin evlendirilmesini muteber kabul edenler ve etmeyenler şeklinde iki temel görüş ortaya çıkmıştır. İslam hukukçularının çoğunluğu, evliliğin muteberliğini buluğ şartına bağlamadıkları için, velileri tarafından evlendirilen küçüklerin nikâhlarını geçerli kabul etmişlerdir. Aksi görüştekiler ise küçüklerin nikâha ihtiyaçları olmadığı için, onların evlendirilmesinin muteber olmadığını ileri sürmüşlerdir. Her ne kadar İslam hukukçularının çoğunluğu, küçüklerin evlendirilmesini muteber kabul etmişse de İmam Şafiî'nin dul küçüğün, İbn Hazm'ın da küçük erkeğin ve dul küçüğün evlendirilmelerinde farklı görüşleri bulunmaktadır. Öte yandan İslam hukukçularının küçüklerin buluğa erişinceye ya da fizikî olgunluğa ulaşıncaya kadar fiilî evlilik hayatı yaşamalarını kabul etmemiş olmaları, onların nazarında küçüklerin evliliğinin, fiilî değil, hukukî evlilik olduğu anlayışının benimsendiğinin bir işaretidir.Hanefîler, çok geniş bir veli grubuna küçükleri evlendirme yetkisi vermiştir. Ancak bunun suiistimallere neden olabileceğini kabul etmiş olmalılar ki, küçükler için buluğdan sonra buluğ muhayyerliği hakkını kabul etmişlerdir. Baba ve dede dışındaki herhangi bir velinin evlendirmiş olduğu küçüklerin buluğa erdikten sonra evliliği kabul ya da reddedebilme hakkı olarak tanımlayabileceğimiz ?buluğ muhayyerliği hakkı? Hanefî doktrininde küçüklerin evlendirilmesi konusunda geniş tutulan veli grubunu daraltmış olmaktadır.Küçüklerin evlendirilebileceğine dair Kitap'ta açık bir nass bulunmamaktadır. Aksine Kitap'ta, evliliğin bir dönemi olduğundan bahseden ayet gereği evliliğin bir çağı bulunmaktadır. Bu da buluğ devresidir. Dolayısıyla kişiler ancak buluğa erdikten sonra evlenebilirler ya da evlendirilebilirler. Bu nedenle küçüklerin evlendirilmesini kabul etmek, bizce nassî açıdan isabetli bir görüş olarak görülmemektedir. Esas itibariyle, bu yöndeki uygulamalarda örf ve âdetin önemli ölçüde etkin olduğu söylenebilir."
