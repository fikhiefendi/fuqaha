abstract: "Osmanlı Devleti'nde Divan-ı Hümayun'da tutulan defterler arasında Bâb-ı Âsafi katoloğuna kayıtlı olan 1649-1653 yılları arasındaki Şikâyet Defterlerini kapsayan bu çalışmada söz konusu dönemin hukuk ve adalet anlayışının gün yüzüne çıkarılması amaçlanmıştır. Bu sebeple halkın ya da idarecilerin hangi konularda şikâyetlerinin olduğu tespit edilerek Osmanlı devletinde özellikle adalet alanında aksayan yönlerin belirlenmesine çalışılmıştır. Hiç şüphesiz söz konusu belgelerden elde edilen sonuçlar dönemin hukuk işleyişini anlamak açısından önemlidir.Çalışma dört bölümden oluşmaktadır. Birinci Bölümde XVI. ve XVII. yüzyıllarda Osmanlı Devleti'nin sosyal, siyasi, iktisadi ve idari yapısı hakkında bilgiler verilmiştir. İkinci Bölümde Osmanlı Devleti'nin hukuki yapısı incelenmiş ve mahkemelerin işleyişi hakkında bilgiler verilmiştir. Çalışmanın Üçüncü Bölümü ise Divan-ı Hümayun'a ulaştırılan şikâyetlerin tasnifinin yapıldığı bölümdür. Söz konusu şikâyetler ?Şikâyet Edilenler? ve ?Şikâyet Edenler? olarak iki kısımda tahlil edilmiştir. Bu ayrımda özellikle hangi kurum veya görevliden daha fazla şikâyet edildiği, bu şikâyetlerin çoğunlukla kimler tarafından yapıldığının ortaya çıkarılması amaçlanmış ve söz konusu tasnifler tablo ve grafiklerle desteklenmiştir. Son bölümünde ise ?Şikâyet Konuları? başlığı altında en fazla hangi konunun şikâyet konusu olduğu tespit edilmeye çalışılmıştır. Divan-ı Hümayun'dan idarecilere gönderilen söz konusu hükümlerin sonundaki ceza ve ikazlara da yer verilmiş ve bunlar ?Şikâyetlerin Hukuki Sonuçları? başlığı altında ayrıca tahlil edilmiştir."
