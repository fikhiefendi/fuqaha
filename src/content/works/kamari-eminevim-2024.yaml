abstract: "Bu çalışma, Türkiye'deki tasarruf finansman sistemi yürüten şirketlerin ne olduğunu ve neden rağbet edildiğini açıklamayı amaçlamaktadır. Bu şirketler, bireyler arasında elbirliği ve yardımlaşmayı hedef alarak, faiz veya bankacılık işlemlerine başvurmadan ev, araba veya iş yeri satın almalarına nasıl yardımcı olduklarına araştırmayı amaçlamaktadır. Öncelikle Tasarruf finansman sistemi ve sonrasında sistemin yasal düzenlemeleri tanıtılmıştır. Türkiyede bu sistemin öncüsü olan (Eminevim) şirketi seçilerek şirkete ait bilgiler, tarihsel gelişimi, çalışma yöntemleri paylaşılmıştır. Çalışmanın bir diğer bölümünde, İslami finans kavramını ve uygulama araçlarını açıklayarak, katılım bankalarının uygulaması irdelenmiştir. Türkiye'deki tasarruf finansman sistemiyle ilgili farklı fıkhi görüşler sunulmuş, analiz edilmiş ve seçilmiş olan eminevim şirketinin fıkhi boyutlarına değinilmeya çalışmıştır. Çalışma, bu şirketlerin katılımcılarla olan ilişkilerinde ücretli vekâlet ilkelerini uyguladığını, Çekilişli finansmanlarında Katılımcılar arasındaki ilişkinin müşareke-i mütenakısa, çekilişsiz finansmanlarında ise mudarabe yöntemine dayandığını ortaya koymuştur."
