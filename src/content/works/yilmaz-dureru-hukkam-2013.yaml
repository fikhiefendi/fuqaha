abstract: "Mecelle şerhlerinden biri olan Dürerü'l Hükkâm Şerh-i Mecelleti'l-Ahkâm adlı eserin (762.-832.) maddeleri arasını konu alan bu tez dört ana bölümden oluşmaktadır. Birinci bölümde Ali Haydar Efendi'nin hayatı ele alınmış ve hukukî etkileri incelenmiştir. İkinci bölümde hem Dürerü'l-Hükkâm hem de kitabın tezimize konu olan bölümünde müellifin atıfta bulunduğu kaynaklarla alakalı bilgilere yer verilmiştir. Tezimizin esas konusu olan üçüncü bölüme gelince burada Dürerü'l-Hükkâm'ın ?kitâbu'l-emânât? bölümünün transliterasyonu yapılmıştır. Son bölümde ise kitâbu'l-emânât bölümünde geçen fıkhî ıstılahların kısa izahına yer verilmiştir."
