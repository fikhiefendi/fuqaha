abstract: "İnsanoğlunun ahlak-iktisat ilişkisi, son birkaç yüzyıl içerisinde kazanç dürtüsünün ön planda olması ve kapitalizmin ortaya çıkardığı sosyal sorunlar ile kopma noktasına gelmiştir. Bu ekonomik sistemler, bireyle birlikte toplumun kalkınacağını öne sürse de, sosyal hayattaki denge unsurunun bozulmasına ve toplumun kalkınması yerine eşitsizlik, adaletsizlik, kıtlık ve savaş gibi büyük toplumsal sorunların ortaya çıkmasına neden olmuştur. Son yıllarda yaşanan ekonomik buhranlar, özellikle 2008 global ekonomik krizi ile kamuoyunda bankacılık sektörüne duyulan güven ciddi derecede zarara uğramıştır. Bunun sonucunda hem Batı'da hem de Doğu'da sosyal dayanışma, yardımlaşma, sürdürülebilirlik ve çevre duyarlılığının tartışıldığı yeni alternatif ekonomik sistem arayışı başlamıştır. Batılı gelişmiş ülkeler, bankacılık sektörü için“sosyal finans”ve“etik bankacılık”kavramlarını ve uygulamalarını ortaya çıkarmış, Doğu'da ise İslami finansın sürdürülebilirliğe ve sosyal hayata katkısı ile İslami bankacılığın gelişmesi adına çalışmalar ön plana çıkarılmıştır. Tezin amacı, gelişmiş ülkelerin sosyal sorumluluk ve etik bankacılık faaliyetleri olarak tanımladıkları uygulamaları, Türkiye'de bankacılık sektörü açısından değerlendirmektir. Ayrıca İslami bankacılık ya da Türkiye'deki adıyla“Katılım Bankacılığı”nın etik bankalar ile arasındaki benzerlikleri ortaya koymaktır. Bu çalışmada, Türkiye'de etik bankacılık alanında nicel verilere dayanan ilk kapsamlı çalışma yapılmıştır. Bununla birlikte Türkiye'deki katılım bankalarının finansal verileri üzerinden etik bankacılıkla ilgili benzerlikleri ve konvansiyonel bankalardan farklı bir iş modeline sahip oldukları tespit edilmiş, amaçlarının kârlılık değil sosyal finansa hizmet etmek olduğu ortaya konmuştur."
