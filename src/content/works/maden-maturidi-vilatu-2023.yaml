abstract: "Bu çalışma, maḳāṣıd düşüncesinin oluşmasında Māturīdī'nin katkısının olup olmadığını, onun fikirlerinin maḳāṣıdī yöntem karşısındaki durumunu ve Te'vīlātu'l-Ḳur'ān'ın ġāī yorum özelliklerini ortaya koymaya çalışmaktadır. Bilginin kaynakları arasında akla önemli bir alan açan, düşüncesinin merkezine hikmeti yerleştiren, te'vīli meşru bir zemine oturtarak nasların hayatın akışına paralel yorumlanmasının önünü açan Māturīdī'nin fikir yapısı, maḳāṣıd düşüncesiyle uyum arz etmektedir. Özellikle, kıyas metodunun tıkandığı durumlar için geliştirilen istiḥsān metoduna yaklaşımı ve nesḫ hakkındaki düşünceleri, onun şerʿī maksatlara ne kadar çok önem verdiğini göstermesi açısından dikkat çekicidir. Māturīdī; bağlayıcılığı açısından sünneti farklı kategorilerde ele almakta, bir sözde asıl olanın lafız değil mana olduğunu defalarca vurgulamakta ve nasları anlarken onların hangi tarihsel koşulda ortaya çıktığını dikkate almaktadır. Onun ifadeleri arasında, dinin korumayı hedeflediği beş esasa dair açıklamalara da rastlanmaktadır. Bütün bunlar, maḳāṣıd düşüncesinin oluşmasında Māturīdī'nin katkısı olduğunu göstermektedir. Te'vīlātu'l-Ḳur'ān'da şerʿī hükümlerin hem genel hem de özel maksatlarına dair açıklamalara yer verilmiştir. Māturīdī, fıkhî hükümleri izah ederken, onların hikmet ve maksatlarına mutlaka yer vermekte, Allah'ın bir şeyi kullarına niçin emretmiş ya da yasaklamış olabileceğine dair derin izahlara girişmektedir. Onun açıklamalarından yola çıkarak dinin aile hukuku, borçlar hukuku, ceza hukuku ve devletler hukukuyla ilgili düzenlemelerindeki ana maksatların neler olduğu tespit edilebilmektedir. Bir nassı anlayıp ondan hüküm çıkarırken; nassın teşrīʿ amacını, ortaya çıktığı tarihsel koşulları ve dinin ana ilkelerini dikkate alma prensibine dayanan maḳāṣıd ictihadına dair pratik örneklere Te'vīlātu'l-Ḳur'ān'da rastlanmaktadır. Ayrıca Māturīdī'nin bazı ayetlere yaklaşımından yola çıkarak maḳāṣıd ictihadının hangi durumlarda mümkün olmadığına dair fikir edinmek mümkündür. Māturīdī, tefsirinde pek çok ayetin nüzul maksadını sorgulamakta, ayetlerin ġāī yorumlarına değinmektedir. Maḳāṣıdī bir tefsirde bulunması gereken birçok özellik onun tefsirinde yer almaktadır. Bu yönüyle Te'vīlātu'l-Ḳur'ān'ı ilk maḳāṣıdī tefsirlerden biri olarak nitelemek mümkündür. Özetle Māturīdī, gerek fıkıh gerekse tefsir sahasında ġāī yorumun önünü açmış, maḳāṣıd düşüncesinin doğması için gereken fikrî altyapıyı oluşturmuş ve bu düşüncenin pratik örneklerine tefsirinde yer vermiştir."
