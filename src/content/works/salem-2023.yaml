abstract: "Çalışma, İslami bankaların Libya'daki rolünü ve etkisini, toplam kalite yönetimi ve teknolojik inovasyon üzerindeki etkisini deneysel bir çalışma yoluyla inceledi. Çalışmanın amacı, Libya'daki İslami bankalarda teknolojik inovasyonu artırmak için toplam kalite yönetimi araçlarının kullanımının önemini belirlemektir. Çalışma, toplam kalite yönetiminin uygulanmasının Libya'daki İslami bankaların politika ve prosedürlerini iyileştirmeye katkıda bulunduğunu, böylece ülkedeki İslami bankacılık hizmetlerinin verimliliğini ve etkinliğini artırdığını ortaya koymuştur. Çalışma, hedeflerine ulaşmak için tümevarımsal ve açıklayıcı-analitik yöntemleri kullanmıştır. Toplam kalite yönetimi tekniklerinin ve uygulamalarının Libya'daki İslami bankalarda benimsenmesinin bankacılık işlemlerini kolaylaştırdığını, müşteri memnuniyetini artırdığını ve yeni müşteriler çektiğini gösteren önemli sonuçlar elde etmiştir. Çalışma ayrıca dijital teknolojilerin bankaların verimliliğini artırdığını, operasyonel maliyetleri azalttığını ve finansal başarı elde etmeye katkıda bulunduğunu vurgulamıştır. Çalışma, kalite iyileştirme planlarının bilimsel ve pratik olarak uygulanmasını, çalışanlara sürekli eğitim sağlanmasını ve yenilik ve sürekli gelişim kültürünün teşvik edilmesini önermiştir. Ayrıca, iyileştirme planlarının uygulanması ve sonuçların izlenerek gelecekteki gelişim fırsatlarının belirlenmesi için gerekli kaynakların ayrılmasının önemini vurgulamıştır."
