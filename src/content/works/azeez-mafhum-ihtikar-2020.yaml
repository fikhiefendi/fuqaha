abstract: "Bu araştırmanın konusu“İslam Hukuku ve Irak Hukuku açısından Karaborsacılık”tır. Çalışmamız üç bölümden teşekkül etmiştir: Birinci bölümde“ ihtikar / kara borsa”kavramının İslam hukuku, Irak meri kanunları ve İktisat bilimi açısından mahiyeti itibariyle tanıtılmış, kara borsa olgusunun ortaya çıkışı hakkında bilgi verilmişve bu“İhtikar”kavramıyla anlam yakınlığı bulunan“Depolama”,“Kesad”ve“Biriktirme”gibi kavramlar tanıtılmıştır. İkinci bölümde İslam Hukukçuları arasında haram olan ihtikarın şartları çerçevesindeki ihtilaflar, zamanımızdaki kara borsacılığın şekil ve çeşitleri, kara borsacılığın yayılma sebepleri ve sosyal ve iktisadi neticeleri hakkında bilgi verilmiştir. Üçüncü bölümde ise evvela İslam Hukukunda kara borsacılığın hükmü ele alınmıştır. Daha sonra, bazı büyük fakihlerin konu hakkındaki görüşleri delilleriyle birlikte incelenerek Irak yasalarıyla karşılaştırılmıştır. Ayrıca İslam Hukuku ve Irak Yasalarının kara borsacılıkla mücadele için öngrördüğü tedbirler mukayeseli olarak incelenmiştir. Sonuç bölümünde ise çalışmada ulaştığımız önemli sonuçlar ve önerilere yer verilmiştir."
