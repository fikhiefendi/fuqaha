abstract: "Şura ve demokrasi üzerinde çokça konuşulan, tartışılan, mukayesesi yapılan iki yönetim şeklidir. Şura en doğru karara ulaşmak için müzakere ve kamuoyu yoklamaya dayalı İslamî bir sistemdir.Demokrasi ise halka veya temsilcilerine güç ve egemenlik vermek gibi çeşitli ilkelere dayanan Batılı bir sistemdir. Araştırma bu iki sistem arasında bir karşılaştırmaya dayanmaktadır. Karşılaştırma sonucunda bu iki sistem arasında çeşitli açılardan uyum, benzerlik ve farklılıklar olduğu görülmektedir.İkisi arasındaki uyum ve benzerlik yönetimde tekelleşmeyi önlemek, devletin ve halkın işlerini yürütmek ve kamu yararını sağlamaya çalışmaktır. Farklılık ise her ikisinin kökeni, kaynağı, amaçları ile özgürlük ve eşitlik gibi bazı önemli ilkelerin ele alınmasındadır.Bu benzerlik ve farklılık araştırmacılar arasında farklı görüşlerin, tartışmaların oluşmasına sebep olmaktadır.Her iki sistemin özü, kuralları, ilkeleri ve hedeflerinin ortak olduğu ve aralarındaki farkların birbirine denk düşmeyecek kadar derin olduğu şeklinde uç görüşte olanlar bulunduğu gibi iki sistemin birçok konuda bir araya gelebileceğini ve bir kaç konuda ayrılabileceğini kabul edenler de vardır."
