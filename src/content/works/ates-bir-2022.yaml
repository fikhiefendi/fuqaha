abstract: "Tarihi süreç içerisinde çeşitli mezhepler ortaya çıkmış ve ümmet içerisinde dört mezhep istikrar bulmuştur. Bu mezheplerden biri de Hanefî mezhebidir. Bu mezhep içerisinde çeşitli meselelerde mezhep içi fakihler tarafından mezhep imamına ya da mezhebe muhalif farklı görüşler ortaya konmuştur. Bu muhalefetin mahiyetinin ve gerekçelerinin ortaya konması önem arz etmektedir. Bu bağlamda son dönem fakihlerinden Leknevî, mezhep içi ihtilafa örnek olarak ele alınmıştır. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde mezhep kavramı, Hanefî mezhebinin teşekkülü, mezhep imamları, ictihad ve çeşitleri, tahrîc, tercih, mezhep içi ihtilafın gerekçeleri ve tarihi seyri, mezhep içi ihtilafa örnek olarak bazı isimler ele alınacaktır. İkinci bölümde, Leknevî'nin hayatı, eserleri, fakihliği, mezhep ve ictihad hakkında görüşleri, bazı fıkhî görüşleri, eserlerinde takip ettiği metod ve kullandığı kaynaklar üzerinde durulacaktır. Üçüncü bölümde ise, tespit edebildiğimiz kadarıyla Leknevî'nin mezhep imamının ya da mezhebin resmi görüşüne muhalif düştüğünü belirlediğimiz bazı furû meselelerle ilgili görüşleri ele alınacaktır. Anahtar Kavramlar: Mezhep, İhtilaf, Muhalefet, İctihad, Tahrîc, Kurucu İmam, Ebû Hanife, İmâmeyn, Meşâyih, Leknevî."
