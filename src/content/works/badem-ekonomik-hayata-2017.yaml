abstract: "Vahiy sürecinin önemli meselelerinden olan iktisat ilminin gelişimi de diğer meselelerde olduğu gibi vahyin ışığında olmuştur. Bu sebepten dolayı Kur'an'da belirtilen rızık, servet, çalışma, emek, ticaret, zekât, infak, ganimet, israf, faiz, karz-ı hasen, iddihar gibi konularda temel esaslar İktisat yolculuğumuzda biz insanlara yol gösterici birer rehberdir. Bu meseleler değişen ve gelişen iktisadi hayat içerisinde modern iktisat ile kıyaslanıp güncellenme zorunluluğunu dayatarak yeni bir yaşam rotası çizmeyi zorunlu kılar. İktisadi meselelerin Kur'an ışığında ele alınmasının en olumlu yanı diğer pozitivist kanunların gücünün yetmediği ahlaki kaideleri de bünyesinde barındırmasıdır. Kur'an, çalışma zorunluluğu, faizsiz düzen, adil gelir dağılımı, sosyal adalet, mülkiyet hakkı, zekât gibi dışa dönük kaideleri zorunlu olarak ihdas ettiği gibi; İnfak, karz-ı hasen, sosyal yardımlaşma, başkalarını da düşünme gibi içe dönük yaptırımları da teşvik eder. Sonuç olarak dünyayı daha yaşanabilir hale getirerek uhrevî yolculuğumuzda Allah rızasını elde etmenin yollarını kolaylaştırır."
