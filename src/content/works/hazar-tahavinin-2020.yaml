abstract: "Bu çalışma, Tahâvî'nin usûl anlayışını konu edinmektedir. Teşekkül devrindeki usûl-i fıkıh hakkında yeterli bilgiye sahip değiliz. Hicrî üçüncü asrın sonu ile dördüncü asrın başında yaşamış olan Tahâvî'nin usûl-i fıkıh görüşleri, bu dönemi aydınlatmak açısından, İslam hukuk tarihi bağlamında da önemlidir. Birinci bölümde Tahâvî'nin lafızlara ilişkin görüşlerine yer verilmiştir. Âmm-hâs, zâhir-bâtın, emir-nehiy, muhkem-müteşâbih, nâsih-mensûh gibi temel lafız çeşitlerini ele alan Tahâvî'nin kendi yaşadığı dönemdeki tartışma ve konularla yetindiği görülmektedir. İkinci bölümde Tahâvî'nin değindiği şer'î deliller sırasıyla ele alınmıştır. Kur'an, Sünnet, sahabe kavli, icmâ, kıyas, nazar, istihsân, istishâb, örf delilleri incelenmiştir. Tahâvî'de lafızlar konusunda olduğu gibi, şer'î delillerde de kavramlaşma öncesinin özellikleri görülmektedir. Usûl-i fıkhın teşekkül dönemi olması, tüm kavram ve terimlerin bulunmamasının ya da bu kavramların bildiğimiz anlamda kullanılmamasının sebebidir. Bu dönemde yer verilen kavramlarda tam bir terimleşme söz konusu değildir. Kavramlar yarı teknik anlamda kullanılmış, bugün bildiğimiz şekliyle ıstılâhî anlamlarına henüz ulaşmamıştır. Tezin sonuç bölümünde Tahâvî'nin Hanefî usûlündeki yeri ortaya konulmaya çalışılmıştır. Yaşadığı dönemde usûl-i fıkıh ile füru-i fıkıh içiçe olan Tahâvî'nin usûl-i fıkha dair müstakil bir eseri bulunmamaktadır. Ancak onun, Hanefî fıkıh usûlü birikiminin sonraki döneme taşınmasında ve kavram ve konuların sistematize edilmesinde önemli bir rol oynadığı görülmektedir."
