abstract: "Osmanlı İmparatorluğunda şehir ve toplum hayatının belirleyici kurumlarından biri olan vakıflar; devletin ekonomik ve siyasi olarak zirvesini yaşadığı 16. yüzyıldan dağılma sürecine girdiği 20. yüzyıla kadarki süreçte giderek azalan önemine karşın önemli sosyal, kültürel ve ekonomik yaşam alanlarında devlet kontrolünde fakat çoğunlukla devlete yardımcı bir rol üstlenmiştir. Kurulan vakıfların hayratları olan cami, medrese, imaret, çeşme, zaviye, han ve hamam gibi yapılar sayesinde toplum yaşamını dinamize eden çok önemli kurumlar haline gelmiştir. 16. yüzyıldan itibaren kurulan vakıfların idaresi mütevelliler eliyle yapılmış, devletin geniş topraklara sahip olması vakıfların denetimi hususunda bazı güçlükler yaşanmasına sebep olmuştur. 18. Asırda ise idarelerinde sorun yaşanan vakıflar aynı zamanda hem vakıf sahipleri hem de devlet tarafından önemli bir gelir kapısı olarak görülmeye başlamıştır. Osmanlı Devleti'nde vakıf sistemi devletin yaşadığı siyasi koşulların belirleyici olduğu ekonomik ve sosyal düzene göre değişim göstermiş, devletin gelir kapılarında sorun yaşandığında vakıfların işlerliğinde de sorunlar yaşandığı görülmüştür. Osmanlı vakıf sistemi içinde önemli ve işler bir konumda olan Maraş vakıfları arşiv belgeleri ışığında ele alınmış yaşadığı tarihsel dönüşüm ve değişimin izleri döneme ait vakfiyelerin ve şeriye sicillerinin yetersizliği nedeniyle kısmi bir incelemeye tabi tutulmuştur. Osmanlı'dan Cumhuriyet Türkiye'sine kadar mevcut 85 vakfiye ve arşiv kaynakları üzerinden ele alınan Maraş Vakıfları, Osmanlı vakıflarının genel tablosunu ortaya koyması açısından oldukça önem taşımaktadır. Cumhuriyet dönemi Maraş vakıfları ise Osmanlı'dan intikal eden vakıfların durumu, arşiv belgeleri, gazete ve vakıflar üzerine yapılan çalışmalar temel alınarak değerlendirilmiştir. Bu fikirle ve kısıtlı kaynakla ele alınan bu çalışmada, bir yandan Osmanlı Vakıf sistemi, yerel bir örneklem üzerinden ele alınmakta diğer yandan bir taşra kenti olan Maraş'ta vakıf sisteminin işlerliği, tarihsel süreçte yaşadığı değişim, dönüşüm veya bozulmalar, bu vakıfların idari, mülki, hukuki, mali, dini ve toplumsal açılardan sürecin devlet ve toplum üzerindeki etkileri görülmektedir. Bu açıdan vakıfların devletin güçlü ve zayıf dönemlerinde yaşadığı önemli düşüş ve çıkışlar ele alınmaktadır. Bu noktada çalışma Maraş vakıf geleneğinin Osmanlı öncesinden başlayan tarihsel boyutuna ışık tutmakta vakıfların genel işleyişinden hareketle mevcut kayıtlardan çok daha fazla vakfa sahip olabileceği fikrini savunmaktadır. Çalışmada temel olarak arşiv belgeleri ve literatür kaynakları kullanılmıştır."
