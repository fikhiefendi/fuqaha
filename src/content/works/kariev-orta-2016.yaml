abstract: "Tarihte Orta Asya Türk Hanlık'ları olarak bilinen Buhara Hanlığı ve Hive Hanlığı arasında Hokand Hanlığı da yer alıyordu. Bu topraklarda tarihte \"Orta Asya Ekolü\" adıyla İslâm Hukuku alanında birçok ulemâ yetişmiş ve alanla ilgili pek kıymetli eser telif edilmiştir. Buhara Hanlığı ile Hive Hanlığı'nın yargı teşkilâtı ile ilgili araştırmalar yapılmış, Hokand Hanlığı yargı teşkilâtı konusu ise henüz çalışılmamış ve bu konudaki eksiklik giderilmesi gerekiyordu. Tezimiz önsöz, kısaltmalar, içindekiler, üç bölüm, sonuç, kaynakça ve ekler kısmından oluşmaktadır. Giriş kısmında araştırmanın amacı, sınırlandırılması, yöntemi ve kaynakları yer alırken, birinci bölümde Hokand Hanlığı'nın siyasî tarihi, idarî, sosyokültürel, etnik yapısı, ekonomik durumu, eğitim politikası ve dinî durum konuları işlenmiştir. İkinci bölümde ise Çarlık Rusya'nın Hokand Hanlığı'nı işgal süreci, işgal gerekçeleri ve onun altındaki asıl amaçlar, işgalci hükümetin hanlığın eğitim, sosyal, kültürel ve yargı alanında yaptığı yenilikçi hareketler araştırılmıştır. Üçüncü bölümde de Hanlık'taki şerî mahkemeler ve biy mahkemelerinin yapısı, işleyişi, verdiği kararlar incelenmiş ve işgal sürecinde şerî mahkemeler ve biy mahkemelerinin ilga süreci ele alınmıştır. Anahtar Kelimeler : Hokand Hanlığı, Rus İşgali,Şerî Mahkemeler, Biy Mahkemeleri."
titleTranslation: {"en": "Islamic judicial system and its operation in Central Asia (The periods of 1709-1865 Khanate of Kokand and 1865-1928 Russian operation)"}
