abstract: "Bu çalışma Osmanlı Devleti'nin son dönem ulemalarından olan Şeyh Alâuddîn el-Ohinî'nin (1881-1949) fıkıh ilmi alanında yazmış olduğu manzum bir eser olan Celâu'l-Ayn adlı eserinin tahkikidir. Araştırmamızı genel çerçevede Türkçe ve Arapça olmak üzere iki kısımda ele aldık. Türkçe kısmı giriş ve üç bölümden teşekkül etmektedir. Birinci bölümde müellifin hayatını ve eserlerini incelerken, ikinci bölümde tahkik ve tahlilini hedeflediğimiz Celâu'l-Ayn eseriyle ilgili genel ve temel bilgilere yer verdik. Üçüncü bölümde ise eserin yazma nüshaları ve tahkikte takip edilen yöntem ve metot hakkında bilgi verdik. Son olarak tezimizin Arapça kısmında ise farklı nüshalarını karşılaştırarak eserin Arapça tahkikli metnine yer verdik."
