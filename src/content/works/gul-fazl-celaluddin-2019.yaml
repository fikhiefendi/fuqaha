abstract: "Bu çalışma, 15. yüzyıl İslâm ilimlerinin her dalında eser vermiş olan Suyûtî'nin hayatını, eserlerini, ondan önceki âlimlerin mantık aleyhine eleştirilerini ve onun, mantık hakkında yazdığı eserleri ele almaktadır. Yaşadığı dönemde Mısır'da Memlükler hüküm sürüyordu. Suyûtî, ülkenin siyasi, ekonomik ve sosyal durumunun zayıfladığı bir dönemde yaşamıştır. Yaptığımız kaynak taramasında Suyûtî'nin tefsir, hadis, fıkıh, kelam, dil, edebiyat ve tarih alanında söz sahibi olacak kadar büyük bir âlim olduğu anlaşılmıştır. Bu alanlarda yüzlerce eser telif etmiştir. Ayrıca mantık alanında Savnü'l-mantık ve'l-kelâm ve el-Kavlü'l maşrik fi'tahrim'il- mantık isimli iki eser yazmış olup e-Hâvî li'l-fetâvâ adlı eserinde ise mantık aleyhine fetva vermiştir. Çalışmamızın birinci bölümünde Suyûtî'nin hayatı, hocaları, talebeleri ve eserleri hakkında bilgi verilmiştir. İkinci bölümde Suyûtî öncesi âlimlerin mantık ilmi hakkındaki görüşleri incelenmeye çalışılmıştır. Üçüncü bölümde ise Suyûtî'nin mantığın hangi konularını eleştirdiği ve fetvasında mantık ilmi hakkındaki görüşlerini ele alınmıştır."
