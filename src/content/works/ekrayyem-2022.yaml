abstract: "Tüketim, İslam'ın bakış açısına göre insanın ihtiyaçlarını karşılamak için ürün ve hizmetleri kullanmasıdır. İslam'daki tüketim tanımı, dünyevî menfaatlerle sınırlı kalmayıp, ahiret menfaatini (Maslahat) de elde etmek için yapılan iş ve işlemleri düzenlemektedir. Bu çalışmada, İslam'ın güçlü bir yapıya sahip bir toplum inşa etmek için koruduğu menfaatin (Maslahat) temelleri üzerinde durulmaktadır. Tüketim, dünyadaki ekonomik sistemlerde olduğundan farklı olarak İslam ekonomik sisteminde özel bir öneme sahiptir. Bu nedenle, bu kavram ayrıntılı olarak çalışılmalıdır. Çalışma üç bölüme ayrılmıştır ve her bölümde araştırma konusunun belirli bir kısmı ele alınmıştır. Birinci bölüm; Makāsıdü'ş-Şerîa, Maslahat ve Tüketimin tanımı gibi araştırma konusuyla ilgili bir dizi tanım içermektedir. Aynı zamanda bu terimlerin araştırmada kullanılma amacına da yer verilmiştir. Bu bölümde ayrıca Makāsıdü'ş- Şerîanın ekonomik sistemler üzerindeki etkisi, bu etkinin amacı ve Makāsıdın kurallarının uygulanması durumunda elde edilebilecek sonuçlar da anlatılmaktadır. İkinci bölümde İslam açısından tüketimin önemi ele alınmıştır. Bu sırada tüketmenin insanda Allah'ın yaratmış olduğu doğuştan gelen bir davranış olduğu, hayatın ve ibadetin zaruretlerinden biri olduğu, mükâfat veya ceza sebeplerinden biri olduğu vurgulanmıştır. Aynı zamanda Malları kaybolmaya veya yanlış kullanıma karşı korumanın gerekliliğinden söz edilip tüketim kavramında temel malzeme olan paranın İslam hukukundaki önemi de incelenmiştir. Daha sonra İslam felsefesinde beş Makasid'dan bahsedilerek Hifzu'l-mal maksadı ve tüm insanların hayatında sosyal güvenliği sağlamadaki rolü detaylı bir şekilde araştırılmıştır. Üçüncü bölümde İslam felsefesinde tüketim hedefleri ve şeriatın Müslüman tüketici için koyduğu kriterler ele alınmıştır. Yani Müslümanın tüketimi, Müslüman olmayanın tüketimi gibi olmamalıdır. Bu bölümde Müslüman tüketim davranışlarında mübah ve haram ile mükafat ve ceza ilkeleri üzerinde durulmuştur. Aynı zamanda paranın zarar görmemesi ve Allah'ın azabından kurtulması için harcamalarda ölçülü olma (İtidal) ilkesi de ele alınmıştır. Son olarak İslam hukuku çerçevesinde kamu yararının sağlanması yaklaşımına açıklık getirilmiştir."
