abstract: "İslami Finansın henüz uygulanmadığı çoğunluğu Müslüman olan Özbekistan'da, Nisan 2022'de onaylanan Mikrofinansman faaliyeti kanununda İslami Mikrofinanstan bahsedilmektedir. Ancak İslami Mikrofinans faaliyetlerinin pratik gelişiminin henüz gözlemlenmemesi, ilerleme konusunda belirsizlik yaratmaktadır. Bu, Özbekistan'daki İslami Mikrofinansın mevcut zorluklarını ve beklentilerini analiz etmeye teşvik eden tezin bir araştırma problemi haline geldi. Verilerin analizinde hem nitel hem de nicel araştırma yöntemlerini birleştiren karma yöntem kullanılmaktadır. Veriler, 715 yanıtın yer aldığı kamuoyu anketini ve ilgili 10 uzmanla yapılan görüşmeleri içermektedir. Araştırmalar, Özbekistan'da İslami Mikrofinansın uygulanmasında şu tür zorlukların olduğunu ortaya koymaktadır: (1) İslami Mikrofinansa ilişkin özel düzenlemenin gelişiminin belirsiz durumu; (2) Hükümetin şeffaflık veya ilgi eksikliği; (3) İslami Mikrofinans Ekosistemi'nin kurulması görevi; (4) Vergilendirmeyle ilgili kaygılar; (5) İnsanların okuryazarlığının düşük olması; (6) Uzman eksikliği. Bununla birlikte, yoksulluk, insanların Şeriat bilincinin olgunlaşması, talebin artması ve İslami mikrofinansın uygulanmasına yönelik sürecin başlamış olması gibi temel gerçekler, Özbekistan'da İslami mikrofinansın parlak geleceğine zemin hazırlamaktadır. Araştırmacının mütevazı görüşüne dayanarak, bu makalenin Özbekistan'daki İslami mikrofinansın zorluklarını ve geleceklerini ayrıntılı analiziyle incelemede öncü olduğu kabul ediliyor ve literatürdeki boşluğu doldurarak büyük değere katkıda bulunuyor."
