abstract: "Hz. Peygamber'in vefatından sonra, kızı Hz. Fâtıma babasının mîrâsını istemek üzere Halife Hz. Ebû Bekir'in yanına gitmiş ve Hz. Ebû Bekir ona Hz. Peygamber'in:“Biz Peygamberler topluluğu mîrâs bırakmayız. Bizim bıraktığımız sadakadır.”sözünü işittiğini söyleyerek Hz. Fâtıma'yı geri çevirmiştir. Bu konu ile ilgili çeşitli rivâyetler gelmiş ve âlimler arasında farklı görüşler ileri sürenler olmuştur. Ayrıca Peygamberlerin mîrâs bırakıp bırakamayacağı meselesi de gündeme gelmiş ve konu ile ilgili âyetler üzerinde de yorumlar yapılmıştır. Mezhepler arasında Hz. Fâtıma'ya mîrâs verilmesi gerektiğini savunan Şii âlimleri ve Peygamberlerin mîrâs bırakmayacağını savunan Ehl-i Sünnet âlimleri konuya dikkat çeken deliller getirmişlerdir. Ayrıca mezhepler arasında mutedil görüş belirten âlimler de bulunmaktadır. Yine konu üzerine yorum yapmanın sakıncalı olduğuna ve bir görüş belirtmekten uzak kalınması gerektiğine inananlar da olmuştur."
