abstract: "Ekonomilerde geleneksel bankacılık sistemine alternatif olarak faizsizlik esasına göre faaliyet gösteren İslami bankaların gelişim ve derinliklerinin artmasıyla birlikte zamanla finansal piyasalardan daha fazla pay almaya başlamışlardır. Bu durum faizsizlik esasına göre faaliyet gösteren İslami bankaların gelişiminin gelir dağılımına olan etkisinin incelenmesi gereksinimini ortaya çıkarmakla beraber literatürde bu tür çalışmalar yok denecek kadar azdır. Bu çalışmada ilk bölümde bankacılığın ve İslami bankacılığın tarihi gelişimi ile İslami bankacılığın ortaya çıkmasındaki temel etkenlere değinilmiştir. İkinci bölümde gelir ve gelir dağılımı kavramları açıklanmış ve gelir eşitsizliğinde kullanılan yöntemlere temas edilmiştir. Üçüncü bölüm literatür çalışmasının ve ekonometrik analizin yapıldığı bölümdür. Bu bölümde İslami bankacılık gelişiminin gelir dağılımı üzerindeki etkisi Malezya özelinde ARDL sınır testi yöntemi ile 2001-2019 dönemi için incelenmektedir. Çalışmanın ekonometrik bulgularına göre kişi başına düşen milli gelir ekonomik gelişmenin ilk dönemlerinde gelir dağılımı eşitsizliğini azaltırken ekonomik gelişmenin ilerleyen safhalarında gelir eşitsizliğini artırmaktadır. Bu çalışmanın da esas motivasyon kaynağını oluşturan, İslami bankacılık gelişiminin gelir dağılımı ilişkisine bakıldığı zaman, Malezya açısından incelenen dönemde ortalama olarak İslami bankalar tarafından özel sektöre verilen kredi hacminde meydana gelen %1'lik bir artışın gelir eşitsizliğini yine ortalama olarak %0,036 oranında azaltarak, gelir dağılımındaki adaletin sağlanması noktasında olumlu katkı yaptığı tespit edilmiştir. Çalışmada analizlerden elde edilen tespitler sonucunda hem İslami bankacılık sektörüne hem de kamu otoritelerine bazı politika önerileri sunulmaktadır. Bu doğrultuda gelir dağılımındaki adaletin sağlanmasında olumlu katkı yapan İslami bankacılık sisteminin doğru tanıtılması, geliştirilmesi ve derinleştirilmesi tavsiye edilmektedir. Ayrıca kamu otoritelerinin İslami bankacılığın gelişmesinde ve derinleşmesinde etkin bir rol alındığı takdirde Malezya örneğinde görülebileceği üzere İslami finansın hızlı bir gelişim gösterebileceği ve bu durumun gelir eşitsizliğini azaltmada önemli bir rol oynayabileceği ifade edilmektedir."
