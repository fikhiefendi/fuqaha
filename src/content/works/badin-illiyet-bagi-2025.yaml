abstract: "Bu çalışma, sorumluluk hukukunun temel unsurlarından biri olan illiyet bağı kavramını özellikle borçlar hukuku bağlamında incelemektedir. Toplumsal düzenin tesisi ve kişisel hakların korunması açısından hukukun üstlendiği rol çerçevesinde bir fiil ile ortaya çıkan zarar arasındaki nedensellik ilişkisinin yani illiyet bağının tespiti hukukî sorumluluğun doğmasında belirleyici bir ölçüt olarak değerlendirilmiştir. Çalışmada akdî ve akit dışı sorumluluk ayrımı temelinde illiyet bağının nasıl kurulduğu, hangi durumlarda kesildiği ve bu bağın hukukî sonuçlara etkisi analiz edilmiştir. Ayrıca illiyet bağının tarihsel gelişimi, kavramsal çerçevesi ve sistematik konumu ortaya konulmuştur. Özellikle birden fazla sebebin aynı zarara neden olduğu durumlarda aslî sebebin tespiti ve sorumluluğun kime ait olduğunun belirlenmesi çalışmanın odak noktalarından biridir. Bunun yanı sıra mücbir sebep, zarar görenin veya üçüncü kişinin fiili gibi illiyet bağını kesen durumlar ayrıntılı şekilde incelenmiş; fiil, kusur ve hukuka aykırılık unsurlarının illiyet bağıyla ilişkisi değerlendirilmiştir."
