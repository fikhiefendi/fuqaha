abstract: "Terim olarak“denk olma”,“eşit olma”ve“benzerlik”manalarına gelen kefaet; ıstılah olarak evlilikte erkeğin sosyal, kültürel, psikolojik ve ahlâki değerler açısından kadına denk olmasıdır. İslâm aile hukukunun temel gayesi evlilik birliğinin devam etmesi ve eşlerin mutlu ve huzurlu olmasıdır. Bunun içinde İslâmiyet gerekli alt yapıyı hazırlamıştır. İlk bakışta kadın erkek eşitliğine aykırı gibi görünen kefaet (denk olma), ömür boyu devam edecek olan ailenin huzur ve mutluluğu içindir. Böylelikle din, nesep, hürriyet, mal, ayıplardan selamette olmak, sanat ve servet gibi toplumda muteber olan şeylerde eşlerden, kocanın bir takım üstün meziyetlere sahip olması istenmiştir. Bu ise psikolojik yapı itibarı ile hassas ve ince ruhlu olan kadının toplumda iyi konumda olan sosyal mevkinin korunması, rencide edilmemesi ve gururunun korunması için erkeğin yukarıda sayılan özelliklerde kadın ve ailesinden daha üstün bir seviyede bulunmasını gerektirmiştir. Nikah akdinin bağlayıcı şartlarından sayılmamakla beraber, İslâm hukukçuları tarafmdan genelde bir gereklilik olarak değerlendirilen kefaet, nikahta kadın ve velisi tarafmdan aranmıştır. İslâm hukukçuları, zorlama altında yapılan evlilik işlemlerinde kadın hakkının korunması için yapılan akdin feshedilebileceğine hükmetmişlerdir. Aile hayatının birlikte devamının eşler arasındaki kefaete riayetten geçtiği görülmüştür. Özellikle ahlâki ve toplumca kabul gören sahih örfi kurallara riayet edilmeyerek yapılan evlenmelerin genellikle sonunda boşanma ile neticelendiği görülmüştür. Mahkemelerde boşanmalara sebebiyet veren“imtizaçsızlık”, kefaetin ne kadar önemli olduğunu göstermektedir. Bununla beraber aile birliğinin devamını arzulayan eşler, evlilik sonrası ortaya çıkan ekonomik, sosyal ve kültürel problemlerin, kefaeti etkisiz hale getirmesini dikkate almadıkları görülmüştür."
