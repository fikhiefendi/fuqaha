abstract: "6098 sayılı Türk Borçlar Kanunu'nun yürürlüğe girmesiyle birlikte 818 sayılı Borçlar Kanunu için egemen olan“satım kirayı bozar”ilkesi yerini“satım kirayı bozmaz”ilkesine bırakmıştır. Bu ilkenin temelini oluşturan TBK. m. 310 hükmüne göre, kira sözleşmesinin kurulmasından sonra kiralanan herhangi bir sebeple el değiştirirse yeni malik kira sözleşmesine taraf olur. Tezimiz üç bölümden oluşmaktadır. Birinci bölümde konu eski dönem Türk Hukuku ve mehaz İsviçre Borçlar Kanunu kapsamında incelenmiştir. İkinci bölümde kiralananın el değiştirmesi, kiralanan üzerinde sınırlı ayni hak kurulması ve kiracılık hakkının tapu siciline şerh verilmesi ayrıntılı olarak ele alınıp incelenmiştir. Üçüncü ve son bölümde ise konut ve çatılı işyeri kiralarında yeni malikin gereksinim nedeniyle kira sözleşmesini fesih hakkı incelenmiştir."
