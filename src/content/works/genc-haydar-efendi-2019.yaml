abstract: "İslâm Hukuku'nun medenî hukuk alanında ilk kanunlaştırma örneği Mecelle'dir. Mecelle yalnız ülkemizde değil, Tunus, Irak, İsrail, Fas, gibi birçok ülkenin de medenî hukukunun oluşmasında ilham kaynağı olmuştur. İşte bundan dolayı anlaşılabilmesi için Mecelle üzerine birçok şerh yazılmıştır. Çalışmamızın konusunu oluşturan Ali Haydar Efendi 'nin“Dürerü'l- Hükkâm Şerh-i Mecelleti'l-Ahkâm”adlı eseri de Mecelle'nin en önemli şerhlerinden birisidir. Çalışmamızın“Dürerü'l-Hükkâm”adlı eserin“Hacr”bahsi ile alâkalı bilgileri içeren (941-949, 957-1007) maddelerinin kaynaklarının tesbit ve tahkîkinden oluşmaktadır. Kaynakların tesbit ve tahkikini yapmadan önce ilgilenenlerin metinden faydalanmalarını kolaylaştırmak amacıyla metni latinize ettik. Bunu yaparken mümkün olduğunca metnin aslına sâdık kalmaya özen gösterdik. Tezimiz giriş, birinci, ikinci bölüm ve sonuçdan oluşmaktadır. Çalışmamızın amacı“Hacr”bölümün kaynaklarının tahkik çalışmasını yaparak İslâm hukukçularının ve İslâm hukukuyla ilgilenenlerin bu eserden faydalanmalarını kolaylaştırmaktadır."
