abstract: "Şüphesiz ki Kur'an'ı Kerim'i manalarını bilme ve açıklama görevi sadece Resulüllah Sallallahu aleyhi ve Sellem'e yüklenmiş bir görev değildir. Bilakis bu sorumluluk O'nun ashabına da yüklenmiş bir sorumluluktur. Allah Azze ve Celle Resulü'ne indirilen şeyleri açıklamasını emretmiştir. Bize de bu mukaddes kitabın ayetlerini derince düşünmemizi, lafızlarını, anlamlarını ve derin maksatlarını belleyerek fehmetmeyi emretmiştir. İşte bu lafızlardan biri de Kur'ân-ı Hakîm'de genişçe bahsedilen ve birçok ayetin ihtiva ettiği rüya kelimesidir. Bütün rüyalar kendine özel bir yorum şekline muhtaçtır. Birçok manayı ihtiva eden bir ilim dalı olan“rüya tabiri ilmi”Kur'ân ve Sünnet'te ayrı bir konuma sahiptir. Ayrıca bu ilmin şer'î kurallara ve Kur'ânî yöntemlere muhtaç olduğu da açıkça anlaşılmaktadır. Öte yandan Allah vergisi olan firaset olgusu da bu ilim için olmazsa olmazlardandır. Bununla birlikte rüyayı tabir eden âlimlerin bu alandaki yorum şekilleri değişiklik arz eder. Araştırmamız, işârî tefsir yöntemi doğrultusunda rüya ile ilgili ayetleri, delaletleri ve maksatları ile birlikte ele almakta; ayetlerde yer alan her müfessirin metodolojisine atıfta bulunarak, işârî manaların etkilerini ve farklılıklarını ortaya koymaktadır. Bu bağlamda araştırmamız, Kur'ân metinlerine daha derin ve zengin bir okuma sunmayı, zahiri anlam ile işârî anlamları birleştirerek anlamayı ve istinbat yapmayı amaçlamaktadır."
