abstract: "Bu tezin konusu, İslami hukukun düzenlenmesi ve hükümlerinin çağdaş yaşamda uygulamaya hazır yasal makaleler biçiminde düzenlenmesi ve daha sonraki yüzyıllarda, Osmanlı, Mısır ve diğer ülkeler bir protesto hareketi ile paralel projeler arasında çeşitli yasal projeler başlatmak için yarışmışlardır. Adalet Bakanı Bay Kadri Paşa, Allah'ın kendisine merhamet etmesine ve üç projede: biri medeni hukukta, ikincisi kişisel davalarda ve üçüncüsü İmam Ebu Hanifa el-Nu'man'ın doktrinindeki ve hükümetin sorunlarını ve vakfını gidermeye çalıştığı hükümlerinde hüküm sürüyor. Kadri Paşa projesi, Arap ülkelerindeki resmi vakıf yasalarının yürürlüğe girmesinden, bundan faydalanan ve bundan etkilenene kadar öncü olmuştur. Çalışmada yasallaştırma için tarihsel ve tarife çerçevesinin dört bölümü, yazarın ve kitabının tanımı, bilimsel ve yasal değerinin önemi, içeriğin ve kaynakların analizi ve son olarak kitabın değerlendirilmesi ve dezavantajlarının ve avantajlarının incelenmesi ve izleyen yasalar üzerindeki etkisi ele alınmıştır. Araştırma, bu önemli yasal projeye ışık tutmaya çalışan bir dizi bilimsel bulgunun yanı sıra, hukukun eksikliklerini gidermek ve mükemmelliği başarmak ve bugün ülkeye bilimsel olarak fayda sağlamak için hizmetini de içeren bir dizi pratik önerilerde bulundu. İslam Vakıf, özellikle örgütlenmişse ve sorunlarının hükümlerinin kodlanması yoluyla ele alındığında, toplum ve yardım sektörüne büyük hizmetler sunmaktadır."
