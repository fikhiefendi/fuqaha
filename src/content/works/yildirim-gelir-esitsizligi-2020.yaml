abstract: "Bu çalışmada insanlığın temel sosyo-ekonomik sorunlarından biri olan gelir eşitsizliğinin nedenleri ve sonuçları tarihsel ve karşılaştırmalı bakış açısıyla ele alınmıştır. Gelir eşitsizliği, nedenleri ve sonuçları açısından çok boyutlu karmaşık bir sosyo-ekonomik sorundur. Önde gelen uzmanlar ve araştırmacılar gelir eşitsizliğinin piyasa koşullarına bırakılamayacağını ve devletin bu konuda eşitsizliği önlemek adına etkin bir rol alması gerektiğini iddia etmektedirler. Küreselleşmenin yoğun baskısı altında olan devletler gelir eşitsizliğini önlemek adına halen çok sayıda araca sahiptir. Avrupa Birliği gelir adaleti açısından nispeten daha iyi durumda olmakla beraber gelir eşitsizliği burada da tırmanmaktadır. Diğer yandan İslam İşbirliği Teşkilatı'nda gelir eşitsizliği kimi ülkelerde azalma göstermekle birlikte Avrupa Birliği ile kıyaslandığında eşitsizliğin halen yüksek seviyelerde olduğu görülmektedir. Ayrıca Avrupa Birliği için düzenli ve güvenilir veri elde etme imkanı bulunurken İslam İşbirliği Teşkilatı için aynı durum söz konusu değildir."
