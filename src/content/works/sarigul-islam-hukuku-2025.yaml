abstract: "İslâm hukukunda muhayyerlikler önemli bir konuma sahiptir. İnsanlığın temel ihtiyaçlarından hareketle gelişim gösteren hukuk normlarının incelenmesi küllî hukuk aklına katkı mahiyetindedir. Bu minvalde çalışmamızda satım akdindeki şart muhayyerliği, görme muhayyerliği ve ayıp muhayyerliği incelenmiştir. İçerisinde bulunduğumuz Anadolu coğrafyasında Hanefi ve Şafii mezhepleri yaygındır. Coğrafyamızdaki güncel hayata temas etmesi kaygısı güderek çalışmamızda Hanefi ve Şafii mezhepleri dikkate alınmıştır. Sınır belirlemek adına incelemelerimizde söz konusu iki mezhebin klasik kaynakları esas alınarak incelenmiştir. Yalnızca mezheplerin nihai görüşleri değil, aynı zamanda dayandıkları metodolojik yaklaşımlar ve naslara karşı tutumları da mukayeseli olarak değerlendirilmiştir. Ayrıca, İslâm hukukunda çalışmamıza konu olan meselelerin Türk Hukuku'ndaki karşılıkları araştırılmış; benzer nitelikteki düzenlemeler tespit edilerek ilgili bölümlerde Türk Hukuku'na da yer verilmiş ve İslâm hukuku ile karşılaştırmaları yapılmıştır."
