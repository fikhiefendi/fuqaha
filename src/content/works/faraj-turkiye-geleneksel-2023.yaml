abstract: "Bu çalışmanın amacı, Türkiye'de faaliyet gösteren geleneksel ve katılım bankalarının mevduatlarının belirleyicilerini ortaya koymak ve her iki sistemdeki mevduatların istikrarını karşılaştırmaktır. 2005'in birinci çeyreğinden 2020'nin dördüncü çeyreğine kadar olan dönemine ilişkin yıllık verilere uygulanan Türk parasal mevduatının yapısal bir modeli tasarlanmıştır. Bu model,log lineer formdaki (OLS) sıradan en küçük kâre ve (ARDL) kullanılarak tahminde bulunulmuştur. Chow testi değerleri, katılım bankalarındaki vadesiz ve vadeli mevduatların geleneksel bankalardaki vadesiz ve vadeli mevduatlardan daha istikrarlı olduğunu göstermektedir. Ayrıca bulgular, parasal taban ile geleneksel mevduatlar arasında parasal taban ve katılım mevduatlar arasındakinden daha güçlü bir ilişki bulunduğunu göstermiştir. Ampirik sonuçlar, banka mevduatı büyümesinin, Türk parasal mevduatının korunması ve geliştirilmesi için önemli olan geleneksel mevduatlar, katılım mevduatlar üzerinde reel gayri safi yurtiçi hasıladaki değişikliklerden ve katılım bankalarındaki tasarruflar ve yatırımlar için kâr payındaki değişikliklerden etkilendiğini göstermektedir. Ayrıca, faiz oranındaki değişimlerin de geleneksel banka mevduatlarının büyüme ve gelişmesinde zayıf bir etkisi olduğu kaydedilmiştir."
