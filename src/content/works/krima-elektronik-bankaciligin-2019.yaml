abstract: "Bu çalışmanın amacı; E-bankacılık kavramı, işlemler, türleri, özellikleri, başarılı kılma ayrıcalıkları, başarısını engelleyen engelleri tanımak, E-bankacılığın çeşitleri, özelliklerini tanımak ve klasik diğer bankalarla karşılaştırmaktır. Bu araştırmanın kapsamında; oluşumu itibarıyla Libya'da faaliyet gösteren İslami bankaların E-bankacılığa ve sunulan E-bankacılık işlemlerine ışık tutularak ülkedeki bankacılık işlemi ülkenin bel kemiği sayıldığından ve hem sosyal hem de ekonomik açıdan önemli olduğundan, ülkenin kalkınmasını destekleyen bir faktör olduğundan dolayı Libya'daki bankalar, İslami bankacılığa göre gelişmişliği incelenmiştir. İstenilen bilgilere ulaşmak için; Libya'da faaliyet gösteren İslami bankaların mudileri, banka görevlileri ve benzeri olmak üzere farklı araç ve gereç kullanılmıştır. İncelenen kesit düzenli bir şekilde ele alınarak cinsiyetleri, yaşları, eğitim seviyeleri ve mesleklerine göre incelenmiştir. İncelenen kesit 200 kişiden oluşmaktadır. Yapılan çalışmanın sonunda; Libya'da faaliyet gösteren İslami bankalardaki E-bankacılığın geliştirilmesi için gerekli çözümlerin bulunması için tavsiyelere önerilerle sona ermiştir."
