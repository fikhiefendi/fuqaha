abstract: "Bu çalışmada, Hanefî Fakihlerden İmam Tâcüşşerîa Ömer b. Ahmed el-Mahbûbî'nin ‎Nihâyetü'l-kifâye li-dirâyeti'l-Hidâye isimli eserinin Nikah ve Talak bölümleri tahkik edilip ‎incelenmiştir. Söz konusu eser, el-Hidâye'nin en eski ikinci şerhi olup Mergînânî'nin“el-‎Hidâye şerhu bidâyeti'l-mübtedî”adlı eserinin“Kavlühû”tarzında bir şerhidir. Eserin, ‎Buhâra şehri ilim ve siyasetinde ön plana çıkan Orta Asya Sadrüddinzâde Mahbûbî ‎Hanefî fukahâ ailesi hakkında bazı bilinmeyen bilgileri de içermesi yönüyle tahkiki önem ‎kazanmaktadır. ‎ Dünya kütüphanelerinde tespit edebildiğimiz kadarıyla 36 farklı nüshası olup Türkiye ‎kütüphanelerinde 30 farklı nüshası vardır. Konumuza dahil olan kısımlar, birinci cildin ‎Türkiye Kütüphanelerindeki 21, yurtdışındaki 2 nüsha olmak üzere 23 nüshasından 4 ‎adediyle karşılaştırılarak tahkik edilmiştir. Asıl nüshamız, istinsah tarihi 762/1360‎ yılı olan ‎Fatih Millet Kütüphanesi Feyzullah Efendi Koleksiyonu ‎Nüshasıdır. Bu nüsha müellifin ‎imla ettirdiği nüsha ile mukabele edilerek istinsah edilmiştir. Anadolu'daki en eski ‎nüshaları istinsah eden Yahyâ b. Muhammed b. Muhammed el-Anberî el-Hüseynî eş-Şerîf ‎el-Bağdâdî istinsah etmiştir. Müstensihin diğer istinsah ettiği mukabele nüshamız, ‎‎714/1314 tarihli İzmir Milli Kütüphanesi Nüshasıdır. Diğer mukabele nüshalarımız; ikisi de ‎Süleymaniye Kütüphanesi farklı koleksiyonlarında bulunan 713/1313 tarihli Fatih ve ‎‎912/1507 tarihli Kadızade Mehmed Efendi'dir. ‎ Tacüşşerîa, açık bir üslupla yazdığı eserinde el-Hidâye'den kavlühû diye zikrederek aldığı ‎bazı kapalı cümleleri, ayrıntılı olarak şerh etmiştir. Hanefî mezhebinin kendinden önceki, ‎kendi çağındaki ve bazen delilleriyle vardığı tercihlerini“ve 'aleyhi'l-fetvâ/fetva onun ‎üzerinedir”,“ve bihi yüftâ/onunla fetva verilir”,“ve bihi ne'huzu/biz onu alırız”,“ve ‎aleyhi'l-i'timad/ona itimad edilir”vb. ibarelerle ifade etmiştir. ‎ Çalışmamızda dipnotlarda; müellifin metinde zikrettiği âyet ve hadislerin tahrîci yapılmış, ‎zikredilen yer, şahıs, kişi isimleri ve şiirler hakkında bilgi verilerek ekte indeks olarak da ‎verilmiştir. Dirâse/tanıtım-değerlendirme kısmında İSNAD atıf kuralları, İSAM tahkikli ‎neşir kılavuzu esasları kullanılmıştır. ‎"
