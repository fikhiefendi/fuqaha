abstract: "İslam hukukuna göre kadın ve erkeklerin aynı ortamı paylaşmaları durumunda uymaları gereken kurallar bulunmaktadır. Çalışmamızda, İslam hukuk kurallarına göre kadınların ve erkeklerin bir araya geldiklerinde onlara tanınan haklar ele alınmıştır. Kadın ve erkeklerin bir arada bulundukları ortamlarda İslam hukukunun kadın ve erkeklere tanımış olduğu genişlikleri ve sınırlamaları tespit etmek amacıyla bu konuyu tercih ettik. Bu konuda birkaç kitap çalışması varsa da, akademik bir tez olarak daha önce ele alınmış bir konu değildir. Çalışmamızın kapsamını kadınların erkeklerle bir arada bulunmaları (ihtilât) ve kadınların kamusal alanda alabilecekleri vazifeler özelinde sınırlandırdık. Bu çalışmada konuyla ilgili başta ayetler ve hadisler olmak üzere, fıkıh kaynaklarında ifade edilen görüşlerin bir tasnifi yapılmıştır. Böylece“kadın ve erkek ihtilâtı'nın”sınırları ortaya konulmaya çalışılmıştır. Çalışmanın giriş kısmında kadın ve erkek cinsiyetleri arasındaki farklara değinilmiş ve İslam Hukukunda kadın ve erkeklerin iki farklı cins olarak değerlendirildiğine vurgu yapılmıştır. Birinci bölümde ilgili rivayetlerden hareketle“ihtilât”kelimesinin kavramsal çerçevesi açıklanmış ve benzer kavramlarla ilişkisine dair açıklamalar yapılmıştır. Ayrıca kadınlar ve erkeklerin bir arada bulundukları ortamlarda tesettür ve mahremiyetle ilgili konular irdelenmiştir. İkinci bölümde ise“kamusal alan”ve“özel alan”ayrımına dikkat çekilmiş, konu ile ilgili ayet ve hadisler değerlendirilmiştir. Kadınların kamusal alanda alabilecekleri görevler başlıklar halinde değerlendirilmiştir. İlk dönem İslam hukukçularının konu başlıkları ile görüşleri aktarılmış ve bu görüşler özetlenmeye çalışılmıştır. Kadınların kamusal bir alanda vazife almalarının esas olarak yasaklanmadığı fakat kadınların vazifelerini yerine getirirken tesettür ve mahremiyete uygun davranmaları gerektiği sonucuna varılmıştır. Aynı zamanda kadınların haysiyet ve kişiliklerine zarar verici görevlerden uzak durmaları ve İslam hukukunun emir ve yasaklarını çiğneyecek bir vazifede çalışmaması gerektiği ortaya konulmuştur."
