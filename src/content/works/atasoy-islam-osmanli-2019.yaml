abstract: "Temeli Hz. Peygamberin uygulamasına dayanan hidâne; sekiz, dokuz yaşına kadar ki küçük çocukların ve istisnaen ergen olan akıl hastalarının bakım, terbiye, eğitim ve himayesini kapsayan, İslam hukukuna has bir kavramdır. Günümüz hukukunun aksine İslam hukuku velayet kavramını tek olarak ele almamış ve kısımlara ayırmıştır. Malda ve şahısta velayet kısımlarından şahısta velayetin önemli bir kısmını ise“hidâne”teşkil etmektedir. İslam hukukunda bu ayrımın yapılmasında temel sebep çocuğun, çok önemli bir dönem olan küçüklük çağını anne şefkatinden mahrum olarak geçirmemesini sağlamaktır. Evlilik devam ettiği sürece hidâne kavramı ortaya çıkmamaktadır. Çünkü; anne ve baba bu görevi müşterek olarak ifa etmek zorundadır. Bir şekilde anne ve babanın ayrılması ile çocuk, bakıma muhtaç ve savunmasız olduğu dönemde de şefkat, bakım ve terbiye gibi önemli ihtiyaçları sekteye uğramamalıdır. Anne ve babanın ayrılması veya ölümleri halinde masum ve ilgiye muhtaç çocukların bu süreci en az zararla atlatmaları için İslam hukukunda küçüklerin bakımını kapsayan hidâne kavramı düzenlenmiştir. Bu yetki anneye ve daha sonra diğer kadınlara verilmiştir. Maddi bakım olarak da ifade edebileceğimiz hidâne hakkı, genellikle evde çocukla ilgilenecek vakte sahip ve şefkat duygusu erkeklerden daha fazla olan anneye verilmekle beraber çocuğu koruma, nafakasını karşılama, mallarını yönetme gibi hususlarda ise baba yetkili kılınmıştır. Nitekim bir süreç ile mukayyet olan hidâne hakkı, bu hak için belirlenen süre tamamlandığında çocuğun velisine teslim edilmesini gerektirir. Hidâne kavramı çok önemli yetkileri kapsamakla beraber çocuk üzerinde asıl veli olan babanın, velayet yetkilerini koruduğunu göz ardı etmemek gerekir."
