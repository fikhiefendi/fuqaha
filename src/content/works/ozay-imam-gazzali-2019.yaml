abstract: "Çalışmamızın konusu İmam Gazzâlî'de fesadüzzaman Olgusu ve Hükümlere Etkisi'dir. Çalışmamızda yer verdiğimiz ilk bölümü genel olarak İmâm Gazzâlî'ye ayırdık. Bunun için de ilk önce onun yaşadığı yüzyılı, doğup yetiştiği coğrafyayı tüm yönleriyle tanımanın da önemli olduğunu düşündük. Sonrasında Gazzâlî'nin hayatını tüm yönleriyle ele almaya, hocalarını, eserlerini yakından tanımaya, düşünce dünyasını ise tüm incelikleriyle anlamaya çalıştık. Tezimizde üzerinde en çok durduğumuz kavram fesadüzzaman ifadesidir. Kavramın tarihsel süreçte ilk olarak ne zaman ve nasıl kullanım alanı bulduğunu araştırıp, bu kavramın hukukî düzenlemelere etkisini birçok örnekle açıklamaya çalıştık. Çalışmamızın sonlarına doğru ise fesadüzzaman kavramını İmam Gazzâlî'yle ilişkilendirip kullanım alanlarına dair verdiği örnekleri irdelemeye gayret gösterdik. Son olarak da Gazzâlî'nin fesadüzzaman gerekçesiyle verdiği hükümleri analiz etmeye çalıştık."
