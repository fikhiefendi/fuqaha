abstract: "Muhyiddin İbn Arabî, ibadetlere genel olarak külli bir bakış açısıyla bakar. İbadetleri ele alırken zahir-batın, şekil-hakikat ilişkisi kurar. Bu şekilde ibadetlerden külli bir marifet çıkartır. İbadetleri Allahİnsan ilişkisi bağlamında ele alır. En önemli eserlerinden olan Fütuhat-ı Mekkiyye'sinde, ibadetleri tüm boyutlarıyla ele almıştır. Bu sebeple eğer ibadetlerin derûnîboyutunu ele almak isteyen bir araştırmacı için Fütuhat-ı Mekkiyye en çok incelenmeye değer eserlerden biridir. Abdest temizlik demektir. Ancak sadece bir organ temizliği değil, mutlak Hakikati, idrak ve varlığın derinliğini müşahede edebilmek için, gerekli ruhsal ve zihinsel hazırlığın vesilesidir. Abdest manevi anlamda tövbedir. Genelde bütün ibadetlere hazırlık, bu çalışmada da namaza hazırlık olması bakımından ele alınmıştır. Namaz, İslam dininde en temel ibadettir. İbadet denilince akla ilk gelendir. İnsanın Allah'la olan ilişkisini düzenler, güçlendirir ve insanı diri tutar. İnsanın Allah'la olan bağının canlı olmasını sağlayan, her an Allah'ın huzurunda olunduğu şuuru veren ilahi emirdir. İbadetlerden gaye Allah'ı tanımak suretiyle insanın Allah'la olan ilişkisini kuvvetlendirmek ise bu hususta en güçlü ibadet namazdır. İnsan namazla yeryüzüne niçin geldiğini, Allah ile bağını, bütün varlıklar içerisindeki yerini öğrenir. Bu çalışmada Allah'ın abdest ve namaz ibadetini emretmekle murâd ettiği en kapsamlı gaye ve hikmetin anlaşılması amaçlanmıştır. Kaynak olarak Şeyh-i Ekber olması sebebiyle, İbn Arabî'nin Fütuhat-ı Mekkiyye isimli eseri seçilmiştir. İnsanın dünyaya gelmesindeki amaç Allah'ı bilmek, tanımaksa bunun yolu da ibadetlerden geçiyorsa, namaz ibadeti bu konuda en çok incelenmesi gereken ibadettir. Namazını diriltebilen bireyler kendini diriltmiş olur. Kendini diriltmiş bireyler de diri bir toplumu oluşturur. Bu düzlemde İbn Arabî'nin çağlar öncesinden ışık tutmaya çalıştığı şekilde namaz insanın yeryüzünde halife olarak yaratılmış olmasının idrakini sağlayan asıl ibadettir. Günümüzde ibadet hayatıyla ilgili metafizik boyuta dikkat çekmek bu çalışmanın amacıdır."
