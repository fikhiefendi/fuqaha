abstract: "“İslam Hukukunda Hükümlere Etkisi Bakımından Mal Kavramı”olarak adlandırılan bu çalışma, gündelik hayatın içerisinde sıkça karşımıza gelen, hayatımızı kolaylaştıran, amaçlarımıza ulaştıracak bütün vasıtaların temelini teşkil eden şeylerin, kavramsal yönüne dikkat çekmek için hazırlanmıştır. Neredeyse bütün hukuk sistemlerinde üzerinde hukuki muamele kurulan bu temel şeylerin, İslam hukukundaki yeri üzerinde yoğunlaşılmış, özellikle borçlar hukuku ve eşya hukuku alanlarındaki ele alınma şekli irdelenmeye çalışılmıştır. İki bölümden oluşan bu çalışmanın ilk bölümünde 'mal' kavramının tanımlamaları üzerinde durulmuş ve farklı bilimsel alanlarda kavrama yüklenen anlamlar ortaya konulmaya çalışılmıştır. İkinci bölümde ise, ilk bölümde ele alınan tanımlamaların neticesi olarak ortaya çıkan hukuki muameleler, yapılacak hukuki muamelelerde muamelenin mahalli konumunda bulunan şeyin nasıl kullanıldığının anlaşılması ve yapılan hukuki düzenlemelerin ne olabileceği ortaya konulmuştur. Özellikle İslam hukuk biliminde, mal kavramının diğer hukuk bilimlerinden farklı olarak değerlendirilen yönleri nelerdir? Sorusuna cevap bulabilmek amacıyla, çalışmanın yoğunluğu İslam hukuk kaynaklarına teksif edilmiştir. İslam hukukunun teşekkül döneminde, yazılmış olan eserler ve onların şerhlerinde araştırmaya konu kavram, o zamanın ihtiyacına karşılık gelecek nitelikte belli başlı örnekler ile sınırlandırılmış olduğu gözlenmiştir. Özellikle mal ile beraber zikredilen tekavvüm, muhrez, muhterem gibi kavramlar üzerinde yapılan tartışmalar aktarılmaya çalışılmış ve bu kavramların anlaşılması gerektiği, günümüz şartlarında bu ihtiyacın zarureti, nazar-ı dikkate sunulmuştur. İslam hukuku ile meri hukuk ekollerinin, kavramsal yaklaşımları karşılaştırılmış, elverdiğince detaylandırmaya çalışılmıştır. Konu birçok alanı ilgilendirdiğinden dolayı, ulaşılabilen kaynaklardan gerekli izahatlar eklenmeye çalışılmış fakat konunun amacından sapmaması gayesiyle mal kavramı ile doğrudan ilişkili olan hukuki düzenlemelerin aktarılmasıyla iktifa edilmiştir."
