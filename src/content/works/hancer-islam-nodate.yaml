abstract: "Toplumsal yapının muhafaza edilmesi ve neslin korunması için toplumun temel dinamiklerinden birisi olan aile kurumu, İslâm hukukunun önem atfettiği müesseselerden biridir. Ne var ki ailenin varlığını koruması ve aile kurumunun devamı için bu kurumu oluşturan kadın ve erkek arasındaki uyuşmazlıkların aile üyelerinin tamamını etkileyen olumsuz sonuçları bulunmaktadır. Karı-koca arasındaki uyuşmazlıkların nedenleri ve şekli geçmişe göre değişime uğramış, farklı bir boyut kazanmıştır. Günümüzde karı-koca arasındaki uyuşmazlıkları çözüme kavuşturmak üzere hem hukuki düzenlemeler yapılmakta hem de özel kurum ve kuruluşlarca alternâtifler sunulmaktadır. Bununla birlikte toplumun temel taşı olan aileyi oluşturan karı-koca arasındaki uyuşmazlıkların her geçen gün farklı nedenlerle arttığı görülmektedir. Bu durum alınan tedbirlerin yeterli olmadığına işaret etmektedir. Her hukuk sistemi kendi dinamiklerine uygun olarak düzenlemeler yaparak bu uyuşmazlıkları çözmeye çalışmaktadır. Bu kapsamda çalışmada geçmişten günümüze uyuşmazlıkların farklı medeniyetlerde yargı dışı yöntemlerle nasıl çözümlendiği üzerinde durulmuş, İslâm hukukunda karı-koca arası uyuşmazlık sebebi olarak görülen hususlar ile mer‟î hukukta uyuşmazlık olarak görülen hususlar ele alınmıştır. Ayrıca günümüz Türkiye‟sinde, farklı kurum ve kuruluşların yaptığı araştırmalardan da istifade edilerek karı-koca arası uyuşmazlığın nedenleri tespit edilmeye çalışılmıştır. Ayrıca İslâm hukukunun karı-koca arasındaki uyuşmazlıklara yönelik çözüm önerileri sunulmuştur. Bu çerçevede tahkîm, sulh ve muhâlea uygulamalarının uyuşmazlıkları gidermedeki katkıları ve neticeye bağlamadaki rolü üzerinde durularak teklifler sunulmuştur."
