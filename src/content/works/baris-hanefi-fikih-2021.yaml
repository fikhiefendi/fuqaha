abstract: "Teklifî hüküm çeşitlerinden olan farz ve vâcip terimlerinin eş anlamlı olup olmadığı meselesi hem Hanefî mezhebi hem de diğer mezheplerin fıkıh usulü kitaplarında çokça tartışılan konulardan biridir. Hanefîler iki terimin eş anlamlı olmadığını, ayrı manalara delâlet ettiğini ve farklı neticeler doğurduğunu ifade ederken cumhur, farz ve vâcibin birbirinin yerine kullanılan eş anlamlı iki terim olduğunu savunmuştur. Neticede bu görüş farklılığı fıkhî ihtilaflara ve tartışmalara yol açmış ve neredeyse tüm usul ve fürû kitaplarında bu meseleye mutlaka temas edilmiştir. Hanefîler'in farz ve vâcip terimlerini farklı değerlendirmeleri meseleye yüzeysel olarak bakıldığında basit bir görünüm arz etse de konu bütüncül olarak ele alındığında girift ve karmaşık bir hal almaktadır. Bu nedenle ortaya konulan ayırım birçok mezhep müntesibi tarafından tam olarak anlaşılamamış ve farklı iddialar öne sürülmüştür. Kimi zaman da Hanefîler'in kavramları kullanırken kendi içlerinde tutarlı olmadıklarına ve birbirleriyle çeliştiklerine dair eleştiriler yöneltilmiştir. Çalışmamızda Hanefîler merkeze alınmakla birlikte karşı görüş sahiplerinin de meseleyi nasıl ele aldıkları ve Hanefîler'e ne tür eleştiriler yönelttikleri incelenmiştir. Özellikle Hanefîler'in tutarsızlığına yönelik eleştirilere ve problematik görünüm arz eden meselelere cevap aranmış ve Hanefî fıkıh kitapları bu doğrultuda tetkik edilmiştir. Önemine binaen tartışmanın lafzî veya mânevî olduğuna yönelik iddialar da ele alınmış ve bu iddialar detaylı olarak izah edilmeye çalışılmıştır."
