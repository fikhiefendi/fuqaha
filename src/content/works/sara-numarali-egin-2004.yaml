abstract: "ÖZET Yüksek Lisans Tezi 8 Numaralı Eğin Şer'iyye Sicili Serhat SARA Fırat Üniversitesi Sosyal Bilimler Enstitüsü Tarih Bölümü 2004, Sayfa: 322 Hazırlamış olduğumuz 8 Numaralı Eğin Şer'iyye Sicili H. 1264-1273 (M. 1847- 1857) yıllan arasındaki belgeleri kapsamaktadır. Bu dönemde Eğin, Harput Eyaleti'ne tabi bir Kaza'dır. Bu çalışmamızda Kadılık ve Şer'iyye Sicilleri hakkında bilgi verdikten sonra belgelerin özetini ve transkripsiyonlarını verdik. En son kısımda ise kısaca değerlendirmesini yaptık."
