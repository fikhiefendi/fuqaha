abstract: "Emevî idaresinin merkezî otoriteyi güçlendirme yönündeki politikaları, özellikle kadılık kurumu ve fetva süreçleri aracılığıyla ilmî sahaya ve ulemâya nüfuz etme teşebbüslerini beraberinde getirmiştir. Bununla birlikte, söz konusu müdahaleci ortam, fıkhın siyasal iktidarın bir uzantısına dönüşmesini engelleyen eleştirel bir bilinç zemininin oluşmasına katkı sağlamıştır. Nitekim âlimler, dinî bilginin meşruiyet kaynağının siyasal otorite değil, nass ve sahîh ictihad esasları olduğunu vurgulayarak ilmî otoritenin sınırlarını daha belirgin hâle getirmişlerdir. Bu çalışmada, fıkhın teşekkül sürecinde Emevî siyâseti karşısında İslâm âlimleri ve özellikle Ebû Hanîfe'nin (ö. 150/767) tutumları ele alınmıştır. Özellikle Kûfe merkezli fıkıh çevreleri, ehl-i re'y ve ehl-i hadis ayrışmasının arka planı, şehirlerdeki ilmî yapılanmalar ve fukahânın siyâsal otorite karşısındaki konumu ayrıntılı biçimde ele alınmıştır. Bu bağlamda Ebû Hanîfe'nin re'y metodunu sistemleştirmesi, yönetime karşı bağımsız tavrı, siyâsal baskılara rağmen ilmî faaliyetlerine devam etmesi ve öğrencileri aracılığıyla düşüncesini kurumsallaştırması önemli bir yer tutmaktadır. Ebû Hanîfe'nin, Emevî siyâsetinin oluşturduğu baskıcı ortamda akılcı yaklaşımı, deliller arası denge arayışı ve adâlet merkezli tutumuyla dikkat çekmiş; bu özellikler mezhebin sonraki dönemlerde devlet hukukunun temel referansı hâline gelmesine zemin hazırlamıştır. Sonuç olarak çalışma, Emevî siyâsetinin fıkhı araçsallaştırma çabalarının olduğunu; ancak bu müdahaleci ortamın zamanla Ebû Hanîfe'nin metodolojik derinliğini, ilmî bağımsızlığını ve sistematik yapısını güçlendirdiğini ortaya koymaktadır. Bu yönüyle Emevîler Dönemi, hem siyâsî baskıların hem de ilmî canlılığın bir arada yaşandığı, mezheplerin şekillendiği kritik bir zaman dilimidir."
