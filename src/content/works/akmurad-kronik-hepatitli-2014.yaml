abstract: "Giriş Bu tez çalışmasında kronik C hepatitli hastalarda Pegile interferon + Ribavirin kombinasyonu ilet edavide kalıcı yanıt üzerinde etkili faktörler retrospektif olarak araştırılmıştır. Hastalar ve Yöntem Çalışmaya Pegile interferon + Ribavirin kombinasyonu ile tedavi alarak öngörülen tedavi süresini tamamlamış olan 113 Genotip 1, 10 Genotip 1 dışı kronik C hepatiti olgusu dahil edilmiştir. Hastaların tedavi öncesi HCV RNA seviyeleri, BMI, ALT düzeyi, HAİ ve Fibrozis düzeyleri, lipitseviyeleri, US inceleme ile yağlanma olup olmadığı virüs veya konağa ait faktörler ile tedaviye yanıt arasındaki ilişkiler araştırılmıştır. Verilerin analizinde chi-square veya Fisher's testi, sürekli değişkenlerin analizinde Student's t testi, normal dağılım göstermeyen veriler için Mann-WhitneyU testi kullanılmıştır. Bulgular Genotip 2 ve 3 ile enfekte 10 hastanın 8'inde kalıcı virolojik yanıt yalınmış olup bu grupta tedavi öncesi viral veya konak faktörlerinin kalıcı yanıt ile ilişkisi saptanamamıştır. Genotip 1 virüsileenfekte olan 113 hastadan 83'ünde EVY (+) olup(%73), 30 hastada (%27) EVY alınamamıştır. EVY (+) hastalarda HCV RNA düzeyi 1731274±3105106 olup EVY (-) hastalardan 2897496±6117134 daha düşük bulunmuştur (p=0.038). HCV RNA'nın 600 000 IU/ml üzerinde veya altında olması da EVY anlamlı ilişki göstermektedir(p=0.013). Hastaların yaşı, cinsiyeti BMI, ALT düzeyi, karaciğer yağlanması olup olmadığı EVY ve kalıcı yanıt üzerinde etkili görünmektedir. Sonuç Genotip1 Kronik C hepatitinin Pegileinterferon+Ribavirin tedavisinde başlangıç RNA düzeyi kalıcı yanıtı belirlemekte etkili bir faktör olarak bulunmuştur. HCV RNA'nın 600 000 IU/ml'den az olması yanıt olasılığını artırmaktadır."
