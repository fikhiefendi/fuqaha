abstract: "Bu çalışma, mevcut çevresel ve sosyoekonomik krizlerin, küresel ısınma, iklim değişiklikleri, yoksulluk ve eşitsizlik gibi sorunların temelinde derin bir ahlaki kriz olduğunu savunmaktadır. Dinler gezegenin korunması konusunda endişeler taşısa da, çevresel sorunların çoğunun doğal güçlerden değil, insan ahlaksızlığından kaynaklandığı belirtilmektedir. Çalışma, nitel bir yaklaşımı benimseyerek belge analizi ve vaka çalışmaları yöntemlerini kullanmıştır. İslamî değerlere dayalı bir sürdürülebilir kalkınma çerçevesi ortaya konulmuş ve bu çerçeve, iyi bir yaşamın ve ilerlemenin temel unsurlarını kapsamlı şekilde analiz etmiştir. Adalet, sosyal sermaye, yolsuzluğun azaltılması ve yeryüzünün ıslahı gibi temel değerler, İslam kaynaklarında sıkça vurgulanan ve toplumlar üzerindeki olumlu etkileri nedeniyle ön plana çıkan unsurlardır. Çalışma, bu değerlerin toplumların kalkınma planlarına entegre edilmesi durumunda sürdürülebilir kalkınma hedeflerine daha etkili bir şekilde ulaşılabileceğini savunmaktadır. Bununla birlikte, kalkınma modelinin birey merkezli bir yaklaşımdan birey, toplum, doğa ve Yaratıcı arasındaki uyumlu ilişkileri esas alan bir modele kaydırılmasının, sürdürülebilir kalkınmanın etkinleştirilmesi ve insan medeniyetinin ilerlemesi açısından zorunlu olduğu vurgulanmıştır. Çalışma ayrıca, İslam medeniyetinin sürdürülebilir yaşam fikrini nasıl yeniden şekillendirdiğine dair“zühd”kavramına odaklanmıştır. Son olarak, çalışma, ekonomik verimlilik ve sosyal eşitliği başarılı bir şekilde birleştiren İskandinav refah modelini detaylı olarak incelemiştir. Bu model, kalkınma açısından üstün nitelikleri nedeniyle seçilmiş ve incelenmiştir."
