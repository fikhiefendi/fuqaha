abstract: "Tezimizde üç ayrı kısım yaptık: Giriş kısminde konunun amacı, yöntem ve kaynaklar, Üstrûşenin'nın hayati ve ilmi şahsiyeti burada zikre ettik. Birinci bölümü: Fıkıh ilminde ehliyet ve küçüklük, bunun altında üç alt başlık ayrılırdık burada vücub, edâ ve ibadet ehliyeti, cenin ve çocuğun ehliyeti, hacr ve kanuni temsilcilik, küçüklük devreleri burada zikre ettik. İkinci bölümü: fıkıh ilminde küçüklerin hak ve mükellefiyetleri, burada ceninin haklar, neseb, miras ve vasiyet, ayrıca çocuğun hakları, akıka ve yeni doğan çocuğa dair hükümler, nafaka, hadane, fitre, sünnet ve çocuğun dini, küçüklerin mükellefiyetleri, nafaka, kurban, zekât ve daman bu bölümünde zikre ettik."
