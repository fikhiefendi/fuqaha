abstract: "İslam hukuku geniş müktesebatıyla geçmişten günümüze ışık tutmaktadır. Bu büyük müktesebat içerisinde İslam hukukunun temel kaide ve yöntemleri ayrı bir önemi haizdir. Bu kaideler geçmişte yapılmış içtihat faaliyetlerinin anlaşılmasını kolaylaştırmaktır. Günümüzde ise yeni ortaya çıkan meseleler hakkında nasıl bir çıkış yolu izlenmesi gerektiği noktasında bizlere yardımcı olmaktadır. İslam Hukuk Usulünün temel kaide ve yöntemlerden biri olan istihsan, asli deliller kısmına mukabil olan fer'î deliller arasında değerlendirilmiştir. İstihsan nas, icma, maslahat ve örf gibi sebepler neticesinde meydana gelmektedir. Çalışmamızın konusu ise söz konusu sebeplerden örftür. Bu çalışmada Serahsî'nin el-Mebsût isimli eseri merkeze alınarak Hanefîlerin istihsana bakışı ortaya koyulmaya çalışılmıştır. Bununla beraber istihsan sebeplerine de değinilmiştir. İstihsan yönteminin kadim Hanefî uleması nezdinde ki durumu ile beraber istihsan ve örf ile alakalı el-Mebsût eseri merkezinde bir takım usul sorularına dair cevaplar bulunmaya çalışıldı. Örf sebebiyle istihsan uygulamaları ele alınarak bu uygulamalar üzerinden nasıl anlaşılıp nasıl uygulandığı tespit edilmeye gayret edildi. Kıyas ve istihsan konusunda bir arada verilen uygulamalarda kıyas gibi hüccet olduğu halde istihsanın zorunlu olarak uygulanma sebebi tespit etme çalışıldı. Örfün değişmesi durumunda örf sebebiyle istihsan uygulamalarında değişiklik konusunda örnekler üzerinden cevaplar bulunmaya çalışılmıştır. İstihsan uygulamasının keyfi bir durum olup olmadığı kıyas merkeze alınarak ortaya konulmaya çalışıldı. Bununla beraber Serahsî'nin kendi ifadeleri ile örf sebebiyle istihsan olan uygulamaların tamamı tespit edilmeye çalışıldı. Bu araştırmada örnekler üzerinden kaideye dair bilgiler elde edilmeye gayret gösterilmiştir."
