abstract: "Sadrüşşsehîd 12. yüzyılda Buhara'da yaşamış Hanefi mezhebine mensup zamanının ileri gelen fakihlerindendir. Başta klasik fıkıh sistematiğine göre kaleme almış olduğu Umdetü'l Müftü olmak üzere fıkıh alanında birçok eser ortaya koymuştur. Burhan Ailesine mensup olan müellifin soyunun Hz. Ömer'e dayandığı şeklinde rivayetler bulunmaktadır. Ortaçağda Türkistan'ın en önemli ilim ve kültür merkezlerinden biri olan Buhara bazı nüfuzlu ailelerin yönetimindeydi. Burhan ailesi de XI-XIII. Yüzyıllarda bu bölgede hüküm süren bir ulema ailesiydi. Ailenin ilk reisi sadr-ı kebir Numan-ı sani (ikinci Ebu Hanife) diye bilinen Abdülaziz b. Ömer b. Maze'dir. Akli ve nakli ilimlerde derinleşen Husameddin Ömer b. Abdülaziz, henüz babası hayattayken Horasan'ın tanınmış alimleri arasına girdi. Tanınmış alimlerle birçok münazaralara girip başarılar sağladı. Sonra şöhreti Mâverâünnehr'de yayıldı. Özellikle fıkıh ve münazara alanında üstün olduğu, devrin hükümdarlarının kendisine saygı gösterip tavsiyelerine göre hareket ettikleri rivayat edilmektedir. Katvan savaşında şehit düştüğü için buna nispetle kendisine şehit ünvanı verilerek 'Sadrüşşehîd, ayrıca büyük dedesine nispetle de 'İbn Maze' diye anılmıştır. Hanefi fıkhının Irak gibi ilim ve ticaret yönünden canlı, İslam dünyasının kuzeye ve doğuya açılan penceresi olması itibariyle de sosyokültürel ve etnik yönden oldukça renkli bir bölgede doğması, Irak'ın yanı sıra aynı niteliklere fazlasıyla sahip olan İran, Horosan ve Türkistan'da yayılmış ve gelişmiş olması mezhep fıkhının hakim çizgilerinin oluşmasında son derece etkili olmuştur. İslâm toplumunda ideal olan, her müslümanın günlük hayatında uygulayacağı hüküm ve kuralları dinin asıl kaynağından yani kur'an ve sünnetten öğrenmesi ise de bunun bütün fertler bakımından gerçekleşmesi mümkün değildir. Dil, ırk, renk ve ülke farkı gözetilmeksizin yeryüzündeki bütün insanlar ilahî vahye muhatap olup önce Allah'a iman etmek, sonra da O'nun peygamber aracılığıyla gönderdiği dini benimseyip onun emir ve yasaklarına uymakla yükümlüdür. Ancak insanların sahip oldukları kabiliyet ve imkanlar, onların dinî hüküm ve esaslara ayrıntılı şekilde vakıf olmalarına ve kendi hayatlarını buna göre düzenlemelerine imkan vermez. Bu sebeple kur'an-ı kerîm'de de işaret edildiği gibi her toplumda belli bir kesimin dinî ilimlerde ihtisaslaşması ve böylece dinin anlaşılması, yorumlanması, ferdi ve içtimaî hayatta insanlara yön verecek ilke ve hükümlerin onun aslî kaynaklarından çıkarılması işini üstlenmesi gereklidir.“Yiğit, Delikanlı”anlamındaki fetâ kelimesinden gelen fetva (fütyâ, çoğulu fetâvâ, fetâvî), sözlük anlamı olarak;“bir olayın hükmünü açıklayan veya hükmünü koyan, güçlükleri çözen kuvvetli cevap”anlamında kullanılmaktadır. Fıkıh terimi olarak“fakih bir kişinin sorulan fıkhî bir meseleye yazılı veya sözlü olarak verdiği cevap, ortaya koyduğu hüküm”demektir. Hz. Peygamber'in hadislerinde ve islâmiyetin ilk dönemlerinde fetva yerine daha çok fütyâ kelimesinin kullanıldığı, istiftâ, iftâ terimlerinin de yaygın bir kullanımının bulunduğu görülür. Ancak fetvanın, fıkıh literatüründe yer aldığı şekliyle fıkhî bir işlem ve kurumu ifade eden terim anlamını kazanması daha sonraki asırlarda gerçekleşmiştir. dört mezhebin fıkıh âlimleri, müctehid olan müftünîn Kur'an ve Sünnet'e dayanarak ictihad etmesi, müc¬tehid olmayanın ise bir müctehidin gö¬rüşünü aktararak fetva verebileceği ko¬nusunda görüş birliğine varmışlardır."
