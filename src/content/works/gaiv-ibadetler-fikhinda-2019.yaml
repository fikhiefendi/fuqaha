abstract: "Allah insanları kendini tanıyıp bilmesi ve kendine ibadet etmesi için yaratmıştır. Yaradılış gayesi olarak eda edilen ibadetlerde, bazen hata ve kusur işlemek bazen de ibadetleri yapmaktan aciz durumuna düşmek insan olmanın gereğidir. Bu durumlara karşılık Allah kullarına tevbe kapısı açmış, hata ve kusurlarını telafi edebilmeleri için mali ve bedeni bazı yaptırımlar, acizlikten dolayı ibadetlerini yerine getiremeyen kullarına da bedel mahiyetinde bazı ruhsat ve kolaylıklar tanımıştır. Çalışmamızın da konusu olan bu yaptırımlara İslam Hukukunda keffaret ve fidye denilmektedir. Bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde keffaret ve fidye kavramlarının semavi dinlerdeki yeri ve tarihsel süreci, geçmişten günümüze uygulanması ve son olarak bu iki fıkıh teriminin birbiriyle ilişkisi incelenmektedir. Birinci bölümde konu ile ilgili altyapı oluşturulmakta, keffaret ve fidye ile ilgili detaylı bilgi verilmektedir. Her iki kavramın sözlük ve ıstılah anlamları, çeşitleri, keffaret ve fidyeyi gerektiren durumlar, miktarları ve tasarruf yerleri ele alınmaktadır. Hükümleri konusunda Hanefi mezhebi görüşüne öncelik verilmekle birlikte Malikî, Şâfiî ve Hanbelî mezheplerinin görüşlerine de yer verilmektedir. İkinci bölümde ise tezin ana konusu olan keffaret ve fidye kelimelerinin ilişkisi incelenmekte, ikisinin benzediği ve ayrıldığı noktalar tespite çalışılmaktadır. Keffaret ve fidye gerektiren durumlar mukayeseli olarak ele alınmaktadır. Sonuç olarak keffaret ve fidye kelimelerinin birbiri ile olan bağlantıları tespit edilmeye çalışılmakta, her iki kavramı birbirinden ayıran ince nüans İslam fıkıh literatürü ışığında ortaya konulmaktadır."
