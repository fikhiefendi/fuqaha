abstract: "Nuh b. Mustafa (v. 1070/1660) 17. asırda Osmanlı Devletinde yetişen, fıkıh, kelam ve hadis gibi ilim dallarında pek çok eser yazmasına rağmen günümüzde kendisi ve eserleri hakkında çok fazla bilgi sahibi olmadığımız önemli alimlerden biridir.Bu çalışmamızda Nuh b. Mustafa'nın el-Kelimatü'ş-şerife adlı eserinin edisyon kritiğini yapmak suretiyle hem onun bir eserini gün yüzüne çıkarmayı hem de kendisi ve eserleri hakkında ayrıntılı bilgi vermeyi amaçladık.İki kısımdan oluşan çalışmamızın birinci yani dirase kısmı bir giriş ve iki bölümden oluşmaktadır. Bunu ikinci yani tahkik kısmı takip etmektedir.Birinci kısmın girişinde konunun amacı, önemi, faydalanılan kaynaklar ve müellifin yaşadığı dönemim ilmi durumu, birinci bölümde Nuh b. Mustafa'nın hayatı ve eserleri üzerinde durulmuştur. İkinci bölümde de edisyon kritiğini yaptığımız eserin ayrıntılı olarak tanıtımı yapılmıştır.İkinci kısımda ise el yazması halinde bulunan eserin üç farklı nüshasını karşılaştırmak suretiyle en doğru metin ortaya çıkarılmaya çalışılmış ve bu metin modern imla kurallarını da göz önünde bulundurarak bilgisayar ortamında kayda geçirilmiştir."
