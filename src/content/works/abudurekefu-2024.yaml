abstract: "Fıkhi içtihadın temeli, usul kaidelerine dayanmaktır; çünkü fıkhi nevaziller, şer'i hükümlerin çıkarılması için sağlam kurallara dayanmasından meşruiyetini alır. Bazı bilimsel araştırmalarda usule dayalı hataların olduğu gözlemlenmektedir. Bu hatalar ya usulde kabul edilmeyen delillere dayanma gibi metodolojik hatalar, ya da Kıyâs Ma'a'l-Fârık gibi şer'i delillerden hüküm çıkarma yöntemlerine aykırılık olan bilimsel ve objektif hatalardır. Çağdaş mali işlemlerde araştırmacıların istidlal yöntemlerini incelemek ve değerlendirmek, İslami kimliğinin gerekliliği kadar önemlidir. Çalışma, konuyla ilgili bilimsel araştırmalardaki araştırmacıların istidlal yöntemlerini gözlemlemeyi, çağdaş araştırmacıların konuyla ilgili en belirgin usuli hatalarını ortaya çıkarmayı ve bu hataların nedenlerini ve etkilerini analiz etmeyi amaçlamaktadır .Bu çalışmada kullanılan yöntemler şunlardır: Fasid fıkhi istidlallari gözlemlemek için tümevarım yöntemi, bunları sunmak için betimleyici yöntem, içtihad araçlarının kullanımının değerlendirilmesi için analitik yöntem ve fıkhi delillendirme yöntemlerini incelemek için eleştirel yöntem. Araştırma, metodolojik ve bilimsel-objektif olmak üzere altmıştan (60) fazla usuli hatalar tespit etmiş ve bunların seksenin (80) üzerinde çağdaş mali meseledeki etkisini incelemiştir. Araştırmacı, bilimsel araştırmaların usuli hatalardan, özellikle metodolojik hatalardan arındırılmış olduğundan emin olmak için gözden geçirilmesini önermektedir; çünkü metodolojik hata, bilimsel araştırmanın sonuçlarının tamamen kaybolmasına yol açabilir."
