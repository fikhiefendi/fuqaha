abstract: "İbn Mâlik eserleri ile Arap Diline katkısı olan âlimlerden birisidir. Yetiştirdiği öğrenciler ve telif ettiği eserler ile Arap Dili tarihinde haklı bir şöhrete sahip olan İbn Mâlik'in önemli eserlerinden birisi de Teshîlu'l-Fevâid ve Tekmîlu'l-Makâsid adlı eseridir. Çalışmamızın merkezinde bulunan bu eser Arap Dilinin nahiv ve sarf konularını içermektedir. Çalışmamız giriş bölümünün akabinde gelen iki bölümden meydana gelmektedir. Giriş bölümünde nahiv kelimesinin tarifi, Arap Dilinde nahiv çalışmalarını zorunlu kılan faktörler ve Arap Dili ekolleri ele alınmıştır. Girişten sonra gelen birinci bölümde İbn Mâlik'in hayatı, ilmi kişiliği, yetiştirdiği öğrenciler ve telif etmiş olduğu eserler, tabakât kitaplarından istifade edilerek detaylı bir şekilde açıklanmaya çalışılmıştır. Ayrıca bu bölümde hadisle istişhâd hususunda da önemli bir yere sahip olan İbn Mâlik'in hadisle istişhâdına işaret edilmektedir. Çalışmamızın asıl kısmı olan ikinci bölümde ise İbn Mâlik'in Teshîlu'l-Fevâid ve Tekmîlu'l-Makâsid adlı eserinde konuları ele alma metoduna, üslubuna, istişhâd ettiği kaynaklara ve eserinde yer verdiği nahivcilere ve lehçelere yer verilmiştir. Eserinde bahsettiği nahivcilere hangi konularda muhalefet ettiği, hangi konularda muvafakat ettiği tespit edilmiş, eserinde atıf yaptığı lehçeler ele alınmıştır."
