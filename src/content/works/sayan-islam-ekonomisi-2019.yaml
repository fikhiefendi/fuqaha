abstract: "Finansman ve risk yönetiminde bilgi ve bilginin üretimi bu çalışmanın temel konusudur. Bilgi düzeyi ekonomik birimlerin finansman faaliyetlerindeki kararlarını ve tercihlerini etkilemektedir. Ticaret, yatırım, finansman kararlarıyla ilgili iyi-kötü firma ve kaliteli-kalitesiz ürün ayrımının yapılabilmesi ancak doğru bilginin üretilmesiyle mümkün olur. Doğru bilginin üretilmesinde ise çalışmayı yapan uzmanın değer yargıları belirleyicidir. Faiz temelli ürünler ve bunları sağlayan kurumlar günümüz ekonomilerinde dış finansman konusunda baskın olan yapılardır. Ekonomik faaliyetlerini İslami finans ilkelerine göre gerçekleştirmek isteyen firmalar içinse faiz temelli finansal ürünler ve kurumlar kaçınılması gereken yanlış tercihlerdir. Bu firmaların karşılaştığı en önemli zorluk dış finansman ihtiyaçlarını karşılamak için faydalanabilecekleri finansal ürünlerin genellikle faiz temelli olmasıdır. Bununla ilişkili diğer bir sorun da devletin ekonomik kriz ortamında dış kaynak ihtiyacı olan iyi firmalara doğrudan fon sağlayacak finansal modelin ana akım ekonomik sistemlerde bulunmamasıdır. Mevcut finansal sistemde faiz temelli ürünler ve kurumlar aracılığıyla devlet firmalara dış finansman sağlayabilir. KOBİ'ler üretimin ve istihdamın önemli bir kısmını gerçekleştirir. KOBİ'lerin insan ve finansman kaynaklarına ulaşmakta yaşadıkları zorluklar sebebiyle doğru finansal ürünleri tercih etme konusundaki hatalı kararları veya imkansızlıkları bu firmaların özellikle finansal kriz ortamında iflas etmelerine sebep olur. Dış finansman ihtiyacı için faizli finansal ürünleri kullanmak kısa vadede çözüm sağlamış gibi gözükse bile orta ve uzun vade de hatalı bir karar olduğu anlaşılır. Geçmişte ve günümüzde yaşanan tecrübeler faiz temelli finansal sisteminin olumsuz sonuçlarını özellikle KOBİ'ler için defalarca göstermiştir. Aynı hatanın tekrarlanması durumunda gelecekte de firmaların faizli finansal sistemin yapısından kaynaklanan sorunlar yaşaması kaçınılmazdır. Ekonomik sorunların tekrar yaşanmaması için faizli işlemlerin olmadığı finansal modelin geliştirilmesi gereklidir. Bu çalışmada İslam ekonomisi ilkelerine göre faaliyet gerçekleştirmek ve faiz temelli finansal ürünlerden kaçınmak isteyen firmaların üretimlerini ve uluslararası ticaretlerini gerçekleştirmeleri sağlayacak bir model önerilmekte ve bu modelin nasıl çalışacağı uygulamalı vaka çalışmalarıyla gösterilmektedir."
