abstract: "“Yiyecek ve içeceklerde helallik-haramlık kriterleri”isimli bu tezin konusu yiyecek ve içeceklerin helal ya da haram olmalarını gerektiren ölçütlerin tespitidir. Araştırmamız, veri toplama ve analiz yöntemiyle yapılmıştır. Tez üç bölümden oluşmaktadır. Giriş bölümünde, helallik-haramlık kriterlerinin belirlenmesinde rolü olan helal, haram, tayyib, habis, husun ve kubh kavramları incelenmiştir. Bu bölümde helalin dinen yapılması serbest bırakılan, haramın yapılması kesin olarak yasaklanan fiiller ve nesneler olduğu ifade edilmiştir. Temiz, hoş ve lezzetli gibi anlamlara gelen tayyib kavramının helallikle ilişkili bir kavram olduğu, pis, kötü, iğrenç gibi anlamlara gelen habis kavramının da haramlıkla ilişkili bir kavram olduğu tespit edilmiştir. Husun ve kubh kavramlarıyla ilgili farklı görüşlere de temas edilmiştir. Bu noktada, eşyadaki güzellik ya da çirkinliğin ne anlama geldiği, bu güzellik ya da çirkinliği belirlemede aklın ve vahyin rolünün ne olacağı konusuna kısaca yer verilmiştir. Birinci bölümde, yiyecek ve içecekler, önce helal, haram ya da helal ve haramlığı tartışmalı oluşlarına göre sınıflandırılmıştır. Daha sonra ise haram, helal ya da tartışmalı olanlar kendi içlerinde hayvan, bitki ya da içeceklerden olması yönüyle gruplandırılmıştır. Bu bölümde haram olduğu ifade edilen yiyecek ve içeceklerin haramlık gerekçelerine de temas edilmiştir. Helal ya da haram olduğunda fakihler arasında tartışma bulunan yiyecek ve içecekler konusunda da ihtilaflar ve gerekçeler objektif olarak verilmiştir. İkinci bölümde; araştırma sürecince tespit ettiğimiz, helallik ve haramlık sebebi olduğuna kanaat getirdiğimiz ölçütleri değerlendirdik. Helallik kriterleri ve haramlık kriterleri olarak ayrı ayrı formüle ederek özgün bir hale getirdik. Helallik-haramlıkla ilgili benzer araştırmalarda tek tek nesnelerin hükümleri üzerinde durulmuştur. Bizim bu araştırmamızda ise genel ölçütler tespit etme çabası önplanda olmuştur. Bu yönüyle sonra yapılacak çalışmalara katkı sağlayabilecek öncü bir çalışma niteliğinde olmuştur."
