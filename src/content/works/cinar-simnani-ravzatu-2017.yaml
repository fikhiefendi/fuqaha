abstract: "Genelde yargı kurumunun, özelde ise kâdîların uyması gereken kuralları düzenleyen alana klasik İslam hukukunda edebü'l-kâdî/edebü'l-kazâ adı verilmiştir. Bu alanında geniş bir literatür oluşmuştur. Bu literatür alanında eser telif eden müelliflerden biri de V. hicri yüzyılda yaşamış Simnânî'dir. Bu çalışmada Hanefi edebü'l-kâdî literatürü de göz önünde bulundurularak Simnânî'nin Ravzatü'l-Kudât adlı eseri muhteva ve üslup açısından ele alınmış ve literatüre katkıları değerlendirilmiştir. Simnânî Ravzatü'l-Kudât'ta ele aldığı konuları (1) kâdî, (2) davacı, (3) davalı, (4) hükme ulaştıran yollar, (5) hakkında hüküm verilen hukuk konuları ve (6) kadılık velayeti veren ve verilenlerin tarihi şeklinde tasnif ederek bu alanda yeni bir üslup kullanmıştır. Ayrıca 'hakkında hüküm verilen hukuk konuları' başlıklı beşinci bölümünde fürû konularını klasik sistematikle, fakat dava bakış açısıyla tek tek ele almak suretiyle alana önemli bir katkı sağlamıştır. Kendisi kâdîlık görevinde bulunmamış olmakla beraber otuz yıl boyunca Abbasî hilafetinin merkezi Bağdat'ta kâdî'l-kudâtlık yapmış olan Dâmeğânî'nin (el-Kebîr) hem ilim hem kazâ meclislerinde uzun zaman bulunmuştur. Dâmeğânî'nin meclislerindeki gözlemlerine kitabında sıkça yer vermesi sebebiyle eserde hukuk tarihi açısından kayda değer bilgiler mevcuttur."
