abstract: "Çalışmamızda, H.1289?1290 (M.1872?1873) yıllarını içeren 103 Numaralı Gürün Şer'iyye Sicili incelenmiştir. Şer'iyye sicillerinin şehir tarihleri açısından taşıdığı önemden dolayı, çalışmış olduğum Gürün Şer'iyye Sicili'nde bulunan 191 adet belge basit transkripsiyon tekniği ile günümüz alfabesine çevrildikten sonra bir plan dahilinde tasnife tabi tutularak değerlendirilmiştir.Tez, giriş ve sonuç bölümü hariç üç ana bölümden oluşmuştur. Giriş bölümünde: Osmanlı hukukunun kaynakları, kadılık kurumu, şer'iyye mahkemeleri, şer'iyye sicilleri ve Gürün hakkında bilgi verilmiştir. I.Bölümde: Defterde bulunan belgelerin tamamının özetleri yapılmış. II. Bölümde: Basit transkribe tekniği ile yapılan, metin transkripsiyonu aslına sadık kalınarak, bu bölümde verilmiştir. III. Bölümde: Defterde bulunan belgeler, idari teşkilat, sosyal yapı ve iktisadi durum açısından değerlendirilmiştir.Sonuç kısmında ise çalışmadan ortaya çıkarılan neticeler genel olarak belirtilmiştir."
