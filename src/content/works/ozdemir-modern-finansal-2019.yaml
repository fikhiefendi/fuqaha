abstract: "Ekonomik sistemin en önemli yapı taşlarından biri olan finans sektöründe, sermaye piyasası araçlarının şekli toplumlara göre şekillenebilmektedir. Toplumun sosyal ve kültürel yapısına göre şekillenen bazı sermaye piyasası araçları, yeni bir yatırım alanı oluşturma amacı taşırlar. Son zamanlarda ise ülkemizde gündemde olan“kira sertifikası”diğer adıyla“sukuk”, yoğun ilgi görmektedir. Sukuk, İslam prensiplerine uygun olarak ticareti yapılan bir sermaye piyasası aracıdır. Ülkemize katılım bankalarının gelişimiyle sukukun önemi giderek artmıştır. Özellikle yüksek miktarlarda fon yaratmak amacıyla kullanılan sukuk, dünyanın birçok ülkesinde yeni değildir. Bu çalışmanın temel amacı, kira sertifikası olarak bilinen sukukun teorik ve hukuki olarak ülkemizde yeterli payı alıp almadığını ve SPK tebliğleri bağlamında geliştirilmesi gereken yönlerini ortaya koymaktır. Çalışmanın son bölümünde, sukukun muhasebeleştirilmesi ile ilgili uygulama yapılarak, sukukun muhasebe bilimi açısından nasıl kayıtlandırıldığı ortaya konmuştur."
