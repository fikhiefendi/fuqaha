abstract: "Tezde hukuk tarihimizin en tartışmalı konuları arasında sayılan ve krediyi temin vasıtalarından biri olarak hicrî 5. yüzyıldan (mîlâdî 11. yüzyıl) itibaren insanların ihtiyaçlarını gideren bey' bi'l-vefâ sözleşmeleri incelenmiştir. İki bölümden oluşan çalışmanın birinci bölümünde bey' bi'l-vefâ sözleşmeleri ile ilgili genel bilgi verildikten sonra sözleşmenin kuruluşu anlatılmıştır. İkinci bölümde ise sözleşmenin hukukî sonuçlarından, sona ermesinden ve delil, karine, süre, tecil vb. konulardan bahsedilmiştir. Çalışmanın amacı, sözleşmenin hukukî mahiyetini ortaya koymak ve sözleşmeye ilişkin fıkıh kitaplarından aktarılan bilgilerin uygulamada nasıl değerlendirildiğini görmektir. Bu sebeple tez boyunca sözleşmeye dair fıkıh kitaplarından aktarılan bütün bilgilerin izleri İstanbul Kadı Sicilleri Projesi kapsamında yer alan şer'iyye sicilleri üzerinden takip edilmiştir. Çalışmada genel itibariyle iki sonuca ulaşılmıştır: sözleşmenin fâizli bir işlem gibi değerlendirilmesinin önünde engeller olduğu ve uygulamanın, büyük oranda fıkıh kitaplarıyla paralellik arz ettiği, fakat yine de zaman zaman farklı görüşleri benimsediği."
