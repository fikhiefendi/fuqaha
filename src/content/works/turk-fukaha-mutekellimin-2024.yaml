abstract: "Bu çalışmamızda İslam hukuku alanında önemli bir yere sahip olan Ziyâde ala'n-nas ve Furû Fıkha Etkisi konularını, Fukahâ ve Mütekellimin metoduna göre derinlemesine incelemeyi amaçlamaktadır. Tez, üç bölümden oluşmakta olup, her bölümde belirli bir konu üzerinde yoğunlaşarak, bu kavramların anlaşılmasına katkıda bulunmayı hedeflemektedir. Birinci bölümde, nesih konusunu ele alarak, bu önemli hukuki ilkenin fukahâ ve mütekellimin ekollerine göre ne anlama geldiği, tarihsel gelişimi ve fıkhi uygulamalardaki yeri detaylı bir şekilde incelenmiştir. Bu çalışmamızda neshi incelememizin nedeni, usûlcüler, ziyade ala'n-nas meselesini nesih faslında işledikleri içindir; buna binaen ziyâde konusu daha iyi anlaşılması amaçlanmıştır. İkinci bölümde ise, Ziyade ala'n-nas meselesi üzerine usul alimlerinin görüşleri derinlemesine ele alınmıştır. Bu bölümde, fukahâ ve mütekellimin ekollerinin bu konuya yaklaşımını ve aralarındaki farklılıkları ortaya koyarak, okuyucuya zengin bir bakış açısı sunmayı arzulanmıştır. Son olarak, üçüncü bölümde, ziyâdenin furû fıkha etkisi incelenmiştir. Bu bağlamda, ziyâde kavramının fıkhi uygulamaları üzerindeki etkilerini, fıkıh literatüründeki yansımalarını ve hukuki sonuçlarını analiz ederek, konunun pratik boyutuna ışık tutmasını gaye edindik."
