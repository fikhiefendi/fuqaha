abstract: "Özen sorumluluğu, bir kişinin hakimiyeti altında bulunan kişiler, hayvanlar veya yapılar üzerindeki özen gösterme ödevini işaret eder. 6098 sayılı Türk Borçlar Kanunu'nda ikinci ayrımda haksız fiilden kaynaklanan borç ilişkilerinden kusursuz sorumluluk kapsamında ilişkin üç ayrı özen sorumluluğu hali düzenlenmiştir. Bu hallerden adam çalıştıranın sorumluluğunda, adam çalıştıranın çalışan üzerinde seçme, talimat verme ve denetim ile gözetiminde özen gösterme ödevi bulunmaktadır. Hayvan bulunduranın sorumluluğunda, hayvan bulunduranın fiili hakimiyet kurduğu hayvan üzerindeki bakım ve gözetim ödevi bulunmaktadır. Yapı malikinin sorumluluğunda ise yapı malikinin bina veya diğer yapı eserinin yapımından kaynaklanan bozukluk veya bakımından kaynaklanan eksiklik nedeniyle zararın gerçekleşmemesi için özen gösterme ödevi bulunmaktadır. Bu sorumluluk halleri kendi içerisinde de olağan özen sorumluluğu ve ağırlaştırılmış özen sorumluluğu olarak iki türe ayrılmıştır. Bu ayrım sorumluluğun doğmasını engellemek için kurtuluş kanıtı sunma imkanına göre şekillenmiştir. Buna göre, adam çalıştıranın sorumluluğu ile hayvan bulunduranın sorumluluğunda kurtuluş kanıtı sunma imkanı olduğu için olağan özen sorumluluğu olduğu kabul edilmişken yapı malikinin sorumluluğunda kurtuluş kanıtı sunma imkanı olmadığı için ağırlaştırılmış özen sorumluluğu olduğu öngörülmüştür."
