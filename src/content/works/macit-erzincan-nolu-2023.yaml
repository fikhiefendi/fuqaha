abstract: "Şer'iyye sicilleri, ait olduğu döneme pek çok yönüyle ışık tutması bakımından büyük bir öneme sahiptir. Hukuk tarihi araştırmalarında şer'iyye sicilleri temel kaynak niteliğinde olup sadece hukuki değil, iktisadi, beşerî ve sosyal olayların anlaşılması için de vazgeçilmezdir. Biz de hem geçmişi biraz daha anlamak hem de gelecekte yapılacak çalışmalara fayda sağlamak amacıyla Erzincan C55 Şer'iyye Sicili'nin 47-100. sayfaları-nın transkripsiyonunu yaparak İslam hukuku açısından değerlendirmeye çalışmak sure-tiyle bu alana katkı sağlamak istedik. Erzincan iline ait bilinen 4 adet şer'iyye sicili bu-lunmaktadır. Bizim üzerinde çalıştığımız defter ise“Erzincan C-55 Numaralı Şer'iyye Sicili”kapak ismiyle Ankara Milli Kütüphanesinin arşivinde kayıtlı olarak bulunmakta-dır. Araştırma konumuz giriş ve üç bölümden oluşmaktadır. Birinci bölümde şer'iyye mahkemeleri ve mahkeme görevlileri tanıtılmıştır. İkinci bölümde Erzincan'ın tarihi ve ''Erzincan C55 şer'iyye sicili'' defterinin genel tanıtımı yapıldıktan sonra şer'iyye sicille-ri ve özelliklerine değinilmiştir. Ardından çalıştığımız sayfa aralığındaki konu başlıkları hakkında bilgiler verilmiştir. Üçüncü bölümde ise belgelerin transkripsiyon metinlerine yer verilerek, sonuçta genel bir değerlendirme yapılmıştır."
