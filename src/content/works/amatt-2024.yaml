abstract: "Bu çalışma, vakıflar ile modern devlet arasındaki ilişkiyi ele almakta olup, bu kadim İslami kurumun önemini ve İslam toplumunun güç ve bağımsızlığındaki rolünü açıklamayı amaçlamaktadır. Çalışma, modern devletin vakıf yönetimindeki politikasını, modern öncesi İslam devleti ile karşılaştırarak İslam dönemlerindeki vakıf uygulamalarına ışık tutmayı hedeflemektedir. Daha sonra modern devletin ortaya çıkışı ve vakıf yönetiminde hukukileştirme sürecinin bu devletin vakıflar üzerindeki kontrolünü sağlamada nasıl bir köprü işlevi gördüğü tartışılmaktadır. Çalışma, devletin vakıf üzerindeki velayetinin şer'i temellerini, bu velayetin kapsamını ve hukuki dayanaklarını, özellikle Mısır'daki hukukileştirme modeli üzerinden incelemektedir. Mısır'daki vakıflar ve devletin bu kuruma yönelik politikaları, İslam dünyasındaki en önemli örneklerden biri olarak ele alınmıştır. Çalışmanın ulaştığı sonuçlardan biri, modern devletin vakıf yönetimindeki en önemli sorunlarının, devletin kamu politikalarının vakıf aleyhine bir baskı unsuru oluşturması ve bu durumun bireyleri yeni vakıflar kurmaktan caydırması olduğudur. Ayrıca, çalışmada vakıfla ilgili mevcut yasa ve düzenlemelerin kapsamlı değişikliklere ihtiyaç duyduğu ve hükümetlerin vakıfların toplumsal ve siyasal istikrar sağlama konusundaki önemini fark etmesi gerektiği vurgulanmıştır."
