abstract: "Bu tez, ilk dönem Hanefî mezhebi imamlarından İmam Züfer'in mezhebin kurucusu Ebû Hanîfe'ye muhalefet ettiği, özellikle ibadetler bölümündeki (tahâret, namaz, oruç, zekât ve hac konularında) fıkhî meseleleri incelemektedir. Araştırmanın amacı, bahse konu meseleleri ana kaynaklardan derleyip, Hanefî mezhebinin usûl kaideleri ve şer'î delilleri ışığında analitik ve mukayeseli bir şekilde incelemek; iki imam arasındaki görüş ayrılıklarının ilmî sebeplerini ortaya koymak ve her birinin tercih ve istidlal yöntemini açıklamaktır. Araştırmada betimleyici, analitik ve karşılaştırmalı yöntem benimsenmiştir. İmamların görüşleri mezhebin temel kaynaklarından takip edilerek, her birinin dayandığı deliller incelenmiş, ihtilaf noktaları ve bunların fıkhî sonuçları açıklanmıştır. Araştırmanın sonuçları, İmam Züfer'ın derin bir anlayış, güçlü bir istidlal kabiliyeti ve delile dayalı bağımsız bir içtihat yöntemine sahip olduğunu göstermektedir. Ayrıca, onun Ebû Hanîfe ile olan ihtilaflarının mezhep içinde ilmî bir zenginlik oluşturduğu ve Hanefî mezhebinin geniş bir içtihat ufkuna sahip olduğunu ortaya koymaktadır. Sonuç olarak, İmam Züfer'in görüşlerinin, sağlam içtihat ve istidlal esaslarına dayandığı; bu görüşlerin Hanefî fıkhının gelişimine ve genişlemesine önemli katkılar sağladığı belirlenmiştir. Çalışma, mezhep içindeki görüş ayrılıklarının bir çdezeelişki değil, fıkhî çeşitliliğin ve İslâm hukukunun esnekliğinin bir göstergesi olduğunu da vurgulamaktadır."
