abstract: "Afyonkararahisar-ı Sâhib 501 numaralı Şer'iyye Sicilini konu olan bu yüksek lisans tez çalışmasının amacı belgelerin Türkçe çevirisini yaparak sicilin içeriğini değerlendirmektir. Çalışmamız Hicri 1057, Miladi 1647 tarihine ait olup 149 belgedir. Sicilde alacak verecek, borç, veraset, arsa, vasi tayini, ahz-kabz türünde birçok belge bulunmaktadır. Bu belgeler 1647 yılı Afyonkarahisar'ın sosyo-ekonomik yapısı ve özellikle şahıs hukuku ile ilgili bilgiler sağlamaktadır. Çalışma giriş kısmı hariç üç ana bölümden oluşmaktadır. Birinci bölüm genel olarak şer'iyye sicilinden bahsedilmiş ve 501 numaralı Afyonkarahisar-ı Sâhib Şer'iyye Sicili tanıtılmıştır. İkinci ve üçüncü bölümde ise sicilin değerlendirilmesi yapılmış, defterin Türkçe çevirisi yapılıp daha iyi anlaşılabilmesi sicilinin bir kısım Osmanlıca metni ek olarak verilmiştir."
