abstract: "Günümüzde siyasî tarih araştırmalarının yanı sıra sosyal, kültürel ve iktisadî tarih araştırmaları da giderek hız kazanmış bulunmaktadır. Bu çalışmalar yapılırken, günümüze kadar arka planda kalan ve kültür tarihimizi aydınlatmada son derece önemli olan arşiv vesikaları da yavaş yavaş gün ışığına çıkarılmakta, bunlardan geniş ölçüde yararlanılmaktadır.Yapılan bu tez çalışmasının amacı 376 nolu Diyarbakır Şer`iyye Sicilinin değerlendirmesini yapıp bu belgeler ışığında Diyarbakır'ın o döneme ait sosyo-ekonomik, idarî, kültürel ve adlî yapısının incelenerek bölgenin tarihinin araştırılmasına katkıda bulunmaktır. Şer`iyye Mahkemeleri, Osmanlı Kuruluş-Tanzimat Dönemi arası tek kadılı yargılama usulüne dayalı, halka ait her türlü yargılamanın yapıldığı mahkemelerdir. Tanzimat sonrasında yapılan değişikliklerle Şer`iyye Mahkemeleri'nin yargılama yetkilerinin çoğu yeni açılan Ticaret ve Nizamiye mahkemelerine devredilmesiyle Şer`iyye Mahkemeleri'nin en önemli unsuru olan kadıların da önemi azalmıştır. Şer`iyye Sicilleri incelendiğinde, bu belgeler halkın hayat şartlarını, toplumsal ilişkilerini, kullanılan her türlü eşyayı, geçim kaynaklarını ve benzeri birçok önemli hususları ortaya koyduğundan, zengin bir kaynak oluşturmaktadır. Defterdeki 223 adet kaydın içeriğinde, tereke ve miras, vakfiye, hırsızlık, alacak-verecek, nafaka talepleri, hırsızlık ve kaybolma, su, nikah, emanet, diyet, mülkiyet gibi davalar bulunmaktadır."
