abstract: "Sulh kavramı Hanefi/Osmanlı hukukunda bir uyuşmazlık çözümü mekanizmasına işaret eder. Bu çalışma bu kavramı, Behcetü'l-fetâvâ ma`a'n-nukûl, Fetava-yı Abdurrahim ve Neticet'ül-fetâvâ me`an-nukul olmak üzere üç 18. yy. şeyhülislam mecmuası ışığında incelemeyi amaçlamaktadır. Bu çerçevede sulh kavramının Osmanlı hukukundaki yeri belirlenmeye çalışılmış, ve sulhun bireylerin mahkeme gibi hareket etmlerine olanak sağladığı iddia edilmiştir. Başka bir deyimle, dava tarafları kendi uyuşmazlıklarını çok iyi tanımlanmış prensipler çerçevesinde çözebilmektedirler. Sulhun bu özelliği ise onu, dava taraflarının uyuşmazlık çözümü sürecindeki kuralları belirlemede önemli rol aynadıkları müzakere ve arabuluculuktan ayırmaktadır. Bununla birlikte, 18. yy. şeyhülislamlarının hukukî görüşlerinin birbirileriyle çok tutarlılık arz etmesiyle birlikte, onların Osmanlı öncesi ve daha erken Osmanlı hukukçularıyla tamamen aynı görüşü paylaşmadıkları da gözlemlenmiştir. Bu ise `ictihâd kapısının kapanması' ve 18. yy. Osmanlı hukukundaki homojenleşme ve bütünleşme gibi daha genel tartışmalar için değerlendirilmesi faydalı bir gözlemdir."
