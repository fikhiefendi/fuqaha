abstract: "Hacamat veya tıbbî literatürdeki ismiyle kupa terapisi, vücudun belirli bir kısmına negatif basınç uygulama prensibiyle hayata geçirilen geleneksel bir tedavi yöntemidir. Hz. Peygamber'in (s.a.v.) de bu tedaviyi kendi üzerinde uygulatmış ve ashabından bazı kimselere de tavsiye etmiştir. Tezimiz bu konudaki rivayetler, günümüz uygulamaları ve modern tıbbın bulgularını ana eksenine alarak hacamat uygulamasının fıkhî hükmüne ulaşmayı amaçlamaktadır. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde hacamat kavramı, tarihçesi ve tıbbî yönü incelenmiştir. İkinci bölüm konu hakkındaki rivayetlere ayrılmıştır. Üçüncü ve son bölümde ise ilk iki bölüm ekseninde hacamatın fıkhî hükmü ve bu hükmün getirdiği sonuçlar incelenmiştir."
