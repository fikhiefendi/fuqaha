abstract: "Modern murabaha uygulamasının Katılım bankaları vasıtasıyla kullanılmasını İslam hukuku açısından değerlendiren bir çalışmadır. Modern ve klasik murabaha formları arasındaki farklılıkların, katılım bankaları üzerinden modern murabahanın daha iyi anlaşılması ve geliştirilmesi için önemli bir husus olduğunu vurgulamaktadır. Murabaha uygulamasının İslami finans ve katılım bankacılığı açısından önemli bir konu olduğu belirtilmektedir. Modern murabahanın faizsiz bir ekonomi modeli için ideal olduğunu ve bu modelin, konvansiyonel bankacılık sistemine bir alternatif olarak hizmet verebileceğini göstermektedir. Çalışma, Türkiye'deki katılım bankacılığı gelişimini hızlı bir şekilde sürdürürken, katılım bankacılığı etrafında dolaşan şüphe, tereddüt ve itirazların bilinçli veya bilinçsiz bir şekilde hızlıca yayıldığını belirtmektedir. Bu şüphe ve tereddütlerin genel anlamda bilgi eksikliğinden kaynaklandığına dikkat çekilmektedir. Çalışma, bu şüphe ve tereddütlerin dayanaksız olduğunu fıkhi deliller çerçevesinde izah etmektedir. Dosya, murabaha uygulamalarının fıkhi dayanaklarını ve delillerini detaylı bir şekilde işlemekte ve bu uygulamaların caizliği konusunda fıkhi dayanaklar sunmaktadır. Ayrıca, dosya, murabaha uygulamalarının günümüz şartlarına cevap verebilmesi için neler yapılması gerektiği konusunda öneriler sunmaktadır İslami prensiplere dayalı parasal işlemler hakkında daha fazla fıkhi bilgi ve anlayışa ihtiyaç olduğunu göstermektedir. Modern murabahanın uygulamasının bu alandaki potansiyelini daha iyi anlamak ve bu alanda daha fazla inovasyon yapabilmek için, katılım bankacılığı ve modern murabaha uygulamalarının daha iyi anlaşılması gerektiği vurgulanmaktadır."
