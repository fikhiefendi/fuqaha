abstract: "Bu araştırmanın amacı، Kur'an-ı Kerim'de yer alan hafifletme (tahfif) ve ruhsatlarla ilgili ahkam ayetleri üzerine müfessirlerin görüşlerini açıklayarak، ibadet، muamelat ve hatta cihat konusunda İslam'ın kolaylık ve esnekliğini öne çıkaran hükümlerle ilgili çıkarım yapmaktır. Öte yandan araştırma، hafifletme konusunu ifrat ve tefrite kaçmadan doğru konumuna getirmeyi amaçlamaktadır. İşte burada، bir yanda hafifletme ve ruhsat konusu ile diğer yanda ihmal ve çizilmiş sınırları koruyamama konusunun karıştırılmasıyla ifade edilebilecek çalışmanın problematiğine bir çözüm getirilmektedir. Zira bu çalışmada bu konuyu netleştirmek zaruri bir durum haline gelmişti. Araştırma tahfif ve ruhsatın ne demek olduğunu، ruhsatla amel etmenin şartlarını ve Kur'an'da ibadetlerde veya Müslümanların birbirleriyle ya da gayri müslimlerle ilişkilerinde var olan muamelatta tahfif ve ruhsata işaret eden ayetleri açıklamaktadır. Ayrıca cihatta ruhsatın hükümlerini açıklığa kavuşturmuş ve tahfif ilgili tüm ayetlerin etkisini ve meydana getireceği sonuçları beyan etmiştir. Bunu gerçekleştirebilmek için yazar öncelikle، ruhsat ayetlerini ve müfessirlerin sözlerini elde edebilmek için betimleyici ve tümevarımcı metotları، ardından da toplanan ayetlerin ayrıntılı analizini ve tasnifini yapabilmek adına betimleyici analitik yaklaşımı izlemiştir. Bunda da Kur'an'daki ruhsat ve hafifletme ayetleri hakkında kapsamlı ve açıklayıcı bir araştırma ihtiyacını doğuran araştırma eksikliğini kapatma hedefi güdülmüştür. Çünkü araştırmacının incelediği daha önceki çalışmalar konuyu tek bir araştırmada bütünüyle ele almamış، fakat konunun bazı parçaları çeşitli araştırmalarda yer almıştır. Çalışma bazı sonuçlara ulaşarak tamamlanmıştır. Bunlardan bazıları: Cenab-ı Allah'a farklı durum ve şartlarda kulluğun devamı. Zira tahfif bu devamlılığın var olmasını sağlayan etkenlerdendir. Mükelleflerin durumlarını dikkate alarak hafifletme ve kolaylaştırma şekillerini meşru hale getirilip ümmetin üstündeki darlığı gidermek. İlgili ayetlerde hükmün sakıt olması، hafifletilmesi veya tebdil edilmesi gibi tahfif ve ruhsatla ilgili biçimlerin çeşitliliği. Aynı şekilde، insanlar arasındaki ticari işlerde (muamelat) ve bir arada yaşamanın getirdiği durumlarda şeri hafifletmelere ve ister Müslümanların kendi aralarında، isterse de Müslümanlar ve gayri müslimler arasında olsun muamelat ile ilgili bazı durumlarda imtiyazlara verilen önem. Araştırma ayrıca meşru ruhsatların yine sadece ruhsat vesilesiyle meydana gelen kendine has hükümleri olduğu sonucuna da varmıştır. Zira ruhsat sadece gerektiğinde alınmasına izin verilen bir durum değil، bilakis onun vesilesi ile belli gayelere ulaşılan bir teşri durumudur."
