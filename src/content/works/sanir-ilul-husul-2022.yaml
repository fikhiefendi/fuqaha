abstract: "Yazma eser kütüphanelerinde bulunan ve gün yüzüne çıkarılmayı bekleyen İslâmî ilimler alanındaki Arapça eserler dikkate alındığında, tahkîk çalışmasının ne kadar önemli olduğu açıkça görülecektir. H. 9./M. 15. asırda yaşadığı tahmin edilen Ahmed b. Muhammed el-Kâzerûnî'ye ait olan, Delîlu'l-husûl fî şerhi Minhâci'l-vusûl ilâ ilmi'l-usûl adlı eser de gün yüzüne çıkarılmayı bekleyen önemli eserlerden biridir. Yapılan araştırma neticesinde bu eserin basıldığı veya akademik çalışmaya konu olduğu tespit edilmemiştir. Bundan dolayı adı geçen eser doktora tez çalışmamıza konu olmuştur. Kâzerûnî'nin Delîlu'l-husûl adlı eseri, telif edildiği asırdan günümüze kadar büyük bir teveccühe nâil olan Beydâvî'nin Minhâcu'l-vusûl ilâ ilmi'l-usûl adlı eserinin üzerine yazılan şerhlerden biridir. Söz konusu eserin tanıtımı ve tahkîki bu çalışma vasıtasıyla yapılmaya gayret edilmiştir. Bu vesileyle, müellifin hayatı ve eserlerinin yanı sıra, fıkıh usûlünun bazı konularındaki tercihleri hakkında bilgi verilmeye çalışılmıştır. Müellif, bu eserinde memzûc yöntemini kullanmıştır. Eserde, musannifin ve şârihin sözlerinin tek bir ağızdan çıkmışcasına iç içe ve birbirinden ayırt edilemediği görülmektedir. Çalışmamıza konu olan eser, Râzî'nin Mahsûl'üyle yapılan karşılaştırmada; Kâzerûnî'nin büyük oranda Mahsûl'den istifade ettiği söylenebilir. Bu bağlamda, fıkıh usûlünü kaynaklarından öğrenmek isteyenlere bir katkı sunacağı ümidiyle, çalışmamıza konu olan eserin tahkîkinin yapılması tercih edilmiştir."
