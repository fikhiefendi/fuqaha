abstract: "İslam Hukuk metodolojisinde haber-i vâhid ile ilgili tartışmalar İslam tarihinin ilk dönemlerinden itibaren başlamıştır. Haber-i vâhid, Sünnet'in çoğunu teşkil ettiğinden dolayı hüccet olup olmadığı ve kendisiyle amel edilip edilmeyeceği hususu daha da bir önem arz etmektedir. Daha genç yaşlarda hem hadis ekolü ile hem de re'y ekolü ile tanışan ve her iki ekolün de güçlü ve zayıf yanlarına muttali olan İmam Şâfiî, genelde Sünnet özelde de haber-i vâhide büyük bir önem vererek üzerinde durmuş, naklî ve aklî delillerle konuyu bir usul dairesinde tutarlı, somut ve objektif kriterlerle ele almıştır. İmam Şâfiî, senedi muttasıl ve sika râvilerce rivâyet edilen haber-i vâhidin hüccet olduğunu, Kur'an'daki bazı ayetlerin delaletlerine, rivâyet edilen haberlere, haberlerin delaletine, Hz. Peygamberin ve sahâbenin uygulamalarına dayandırmıştır. İmam Şâfiî; genelde Sünnet'i özelde de haber-i vâhidi reddedenlerin büyük bir hataya düştüklerini belirttikten sonra fakihlerin, haber-i vâhidin hüccet olduğu hususunda ittifak ettiklerini, ancak haber-i vâhidin kabul şartlarında ihtilafa düştüklerini belirtmiştir. Tezimiz giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş'te konunun önemini, amacını, konu ile ilgili kavramları, Birinci Bölümde kısaca İmam Şâfiî'nin hayatını, ilim yolculuğunu ve mezhebi hakkında bilgi verdik. İkinci Bölüm'de; haber-i vâhidin delil değeri ile ilgili tartışmaları, Üçüncü Bölüm'de ise İmam Şâfiî'nin haber-i vâhid ile ilgili görüşünü diğer mezheplerin görüşleriyle mukayeseli bir şekilde ele aldık. Sonuç kısmında ise İmam Şâfiî'nin, haber-i vâhidin delil değeri ile ilgili görüşlerinden yola çıkarak vardığımız sonuçları yazdık."
