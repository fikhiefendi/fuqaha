abstract: "Fıkıh usûlü ilmi, fıkhî hükümlerin istinbat yolu olduğu kadar fıkhî mezheplerin ana yaklaşımlarının anlaşılmasını sağlayan bir ilimdir. Fıkıh geleneğinde mezhepler arasındaki farklılıklar temelde usûl farklılığı ile açıklanır. Kurucu fakihlerin yazılı metne dökülmemiş olsa da kendilerine özgü bir usûlü olduğu kabul edilir. Bu durum adına Hanbelî mezhebi nispet edilen Ahmed b. Hanbel için de geçerlidir. Ancak o, fıkıh usûlüne dair eser telif etmediği için görüşleri mezhebin fıkıh kitaplarında dağınık bir şekilde yer almıştır. Hicri beşinci asrın ilk çeyreğine kadar devam eden bu durum, Ebû Ya'lâ'nın 428/1036 yılında telif ettiği el-Udde fî Usûli'l-Fıkh adlı eseriyle sona ermiştir. Elimizdeki çalışma el-Udde'yi esas alarak Hanbelî usûlünü ilk defa sistematik hale getiren Ebû Ya'lâ'nın usûlcülüğünü ortaya koymayı hedeflemektedir. Çalışmamız giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde konunun amacı, önemi, sınırı, yöntemi ve literatür taramasına dair bilgiler işlenmiştir. Birinci bölümde Ebû Ya'lâ'nın yaşadığı dönem ve özellikleri, hayatı, eğitimi, idarî görevleri, yetişmesine etki eden faktörler ve vefatı ile ilgili konular ele alınmıştır. İkinci bölümde Ebû Ya'lâ'nın mensubu olduğu Hanbelî mezhebi fıkhının teşekkül süreci, Ebû Ya'lâ öncesi Hanbelî fıkıh usûlünün durumu ve Ebû Ya'lâ'nın Hanbelî mezhebindeki konumu gibi meseleler irdelenmiştir. Üçüncü bölümde Ebû Ya'lâ'nın bir ilmi disiplin olarak fıkıh usûlüne yaklaşımı, usûlî görüşleri ve kullandığı lafzî delâlet yöntemi araştırılmıştır. Sonuç kısmında ise el-Udde bağlamında Ebû Ya'lâ'nın usûlcülüğüne dair bazı tespit ve değerlendirmelerde bulunulmuştur. Öte yandan çalışmamız, alanında ilk olması hasebiyle gerek ülkemizde gerekse İslam dünyasında bu güne kadar hakkında herhangi bir akademik çalışma yapılmamış olan Hanbelî fıkıh usûlü ile ilgili bilimsel araştırma yapmak isteyenlere yol gösterici olma niteliğini taşımaktadır. Anahtar Kelimeler: İslam Hukuku, Hanbelî Mezhebi, Fıkıh Usûlü, Ahmed b. Hanbel, Kadı Ebû Ya'lâ"
