abstract: "Çalışmamız, Ebü'l-Hasen Burhânüddîn Alî b. Ebî Bekr b. Abdilcelîl el-Ferganî el-Merg?nânî'nin (ö. 593/1197) kaleme aldığı el-Hidâye şer?u Bidâyeti'l-mübtedî isimli eser ile Ebü'l-Kâsım Abdülkerîm b. Muhammed b. Abdilkerîm el-Kazvînî er-Râfiî (ö. 623/1226) tarafından kaleme alınan el-Azîz fî Şer?i'l-Vecîz yani daha bilinen ismiyle eş-Şer?u'l-kebîr isimli eserlerde kullanılan za'fı şiddetli rivayetler, bu rivayetlerin zayıflığına rağmen delil olarak kullanılmasının muhtemel sebepleri ile bu rivayetlerin hadisi ilmi açısından değerlendirmesini konu edinmektedir.Araştırmamız, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi, yöntemi ve kaynakları açıklanmıştır. Çalışmamızın birinci bölümünde za'fı şiddetli rivayet kavramı ile ilgili malumatla birlikte za'fı şiddetli rivayetleri tespit yöntemi açıklanmıştır. İlk bölümün pratiğe yansıması olan ikinci bölüm ise ele aldığımız eserlerde geçen ve za'fının şiddetli olduğuna karar verdiğimiz rivayetlerden ve bu rivayetlerin hadis ilmi açısından değerlendirmelerinden oluşmaktadır."
