abstract: "Bu çalışmamızda, ondukuzuncu yüzyılda Yemen?in sayılı âlimlerinden biri olan Şevkânî?nin (1173-1250/1760-1834), 1223/1808 yılında başlayıp 1229/1814 yılında tamamladığı ?Fethü?l-kadîr? isimli tefsirindeki kaynaklarını ve metodunu incelemeye çalıştık.Çalışmamız bir giriş ve iki bölümden oluşmuştur. Giriş kısmında; çalışmamızın önemini, amacını ve metodunu açıkladık. Birinci bölümde; müellifimizin hayatını, ailesini, yetiştiği ortamı, ilmî şahsiyetini, hocalarını, talebelerini, çeşitli alanlardaki ilmî eserlerini ve kaynaklarını inceledik. Ve tefsirin mukaddimesi, yazılış gayesi ve özellikleri üzerinde durduk. İkinci bölümde ise tefsiri rivâyet, dirâyet ve Kur?ân ilimleri açısından inceledik. Neticede gördük ki Fethü?l-kadîr?de, Kur?ân?ın Kur?ân?la ve Sünnetle tefsirine öncelikle dikkat edilmiş; ayetlerdeki belâğî inceliklere yer verilmiştir. Tefsirde lügat, sarf ve nahiv konularına değinilmiş, kıraat noktasında bolca örnekler verilmiş; Fıkhî ve Kelâmî konular kendine has üslupla ele alınmıştır. Kaynaklar özenle seçilmiş; İslâm dünyasında muteber kabul edilen tefsirlerden nakiller yapılarak birçok görüş bir arada sunulmuştur. Kısacası bu eserle, tefsir sahasında kendisinden sonraki nesillere kalıcı ve oldukça zengin bir miras bırakılmıştır."
