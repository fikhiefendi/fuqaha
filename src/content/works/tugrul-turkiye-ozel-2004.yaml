abstract: "ÖZET Ülke ekonomisinin gelişmesi için çok önemli olan finansal gücün ülkemizde yeterli olmadığı bilinmektedir. Bunun önemli denenlerinden biri de dini yönden hassasiyeti bulunan vatandaşların faiz sistemli bankalarla çalışmak istememeleridir. Tasarruflarını bankalara yatırmak yerine çeşitli şekillerde atıl olarak ellerinde tutmaktadırlar. İşte bu vatandaşlar için alternatif olarak Özel Finans Kurumları ortaya çıkmıştır. Bunların birinci amaçları bu gibi vatandaşların ellerinde bulunan tasarruflarını ülke ekonomisine kazandırmak ve ülkenin sermaye açığını en asgariye indirmektir. Bu tür hassasiyeti bulunan vatandaşlar açısından da yararlı olmasını sağlamaktır. İkincisi de; daha çok komşumuz olan İslam ülkeleri ellerinde bulunan ve birikmiş olan döviz rezervlerini ülkeye taşımaktır. Petrol zengini olan bu ülkelerin Müslüman olması ve faiz sistemi ile çalışmak istememesinden dolayı dövizlerini ülke ekonomisine kazandırılması amaçlanmaktadır. Bu nedenle ülkemizde bulunan bu iki finans kurumu bir master tez çalışmasına konu olarak seçilmiştir. Bu iki kurum çok hassas olduğu için denetim açısından karşılaştırılmalı olarak ele alınmıştır. Bu tez çalışması üç bölümde değerlendirilmiştir. Birinci bölümde, Özel Finans Kurumu hakkında genel olarak bilgi verilmiştir. İkinci bölümde ise, bankalar hakkında genel bilgiler verilmiştir. Üçüncü ve son bölümde ise, bu iki kurumun denetim açısından değerlendirilmesi ve bir karşılaştırılması yapılmıştır."
