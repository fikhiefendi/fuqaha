abstract: "Fıkıh kitaplarımızda yer alan ve kendi devirlerinin is ve isçi anlayısının bir yansıması olarak kendisini gösteren ve zamanın sartlarına göre verilmis hükümlerden hareketle o devrin özelliklerini içeren uygulama ve cüzi hükümleri, tamamen farklı bir yapıya sahip günümüz isçi müessesesi ile ilgili zemine tasıyıp bunlardan bir sistem olusturma gibi yanlıs bir tutum içerisine girmek yerine, genel çerçeveden hareket etmek ve ?slam hukûkunun tesri sırasında benzer müesseseler karsısında aldığı tavrı takınmak gerekir. Buna göre yapılması gereken, mevcut haliyle isçilik kurumunu sosyal bir realite olarak kabullenmek ve isçilerin durumlarını iyilestirici önlemler almaktır. ?slam hukûku hem isverene uygun ve hem de isçiye uygun bir is ahlakının teminini hedeflemekte ve isçi ve isverenler arasında mücadele değil sevgi, kardeslik ve ahlakî esaslara göre hareket etmeyi öngörmektedir. ?slam dininde kisinin konumu ne olursa olsun, ister isçi isterse isveren olsun tüm insanlar, insan olmaları itibariyle esittir ve aralarında fark yoktur. ?sçi ve isveren bir sözlesmenin iki tarafı olarak kabul edilmekte ve hiçbir tarafın diğer taraftan üstün olmadığı beyan edilmektedir. ?slam hukûkunda hangi sekilde olursa olsun baskasına zarar vermek ve bu zarara zararla karsılık vermek yasaklanmıstır. Temel prensip, herkesin kendi davranısının sonucuna katlanması ve baskasının meydana getirdiği zararlardan sorumlu olmamasıdır. Ancak toplumda her sahada meydana gelen değismeler ve gelismeler sorumluluğun sınırlarını genisletmeyi gerekli hale getirmis ve temel prensipten istisnalar gittikçe artmıstır. ?nsanlar yanlarında çalıstırdıkları kisilerin meydana getirdikleri zararlardan sorumlu tutulmuslar ve zararın izâlesi anlayısına doğru bir temayül baslamıstır. ?slam hukûkunda, yardımcı sahsın yaptığı isle irtibatı bulunmayan ve isin gereği olmayan davranıslarından dolayı zarara sebebiyet vermesi durumunda isverenin sorumluluğu konusu ecîr-i hâssın sorumluluğu; isverenin, is kazası ve meslek hastalıklarından dolayı sorumluluğu ise ecîri müstereğin sorumluluğu kapsamında çözülecek bir konudur."
