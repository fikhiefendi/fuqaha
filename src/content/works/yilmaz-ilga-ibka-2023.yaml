abstract: "İslam Dini'nin ana kaynakları olan Kur'ân ve Sünnet, insan hayatı üzerinde pek çok düzenleme ve yenilik getirmiştir. Bu yeniliklerden birisi de aile kurumunun başlangıç safhası olan nikâh ve nikâh türleri ile ilgilidir. Cahiliye döneminde kadına değer vermeyen, toplum ahlakını bozan ve özellikle neslin geleceğini tehlikeye atan pek çok nikâh akdi bulunmaktaydı. Cahiliye toplumunda yaşayan insanların evlilik çerçevesindeki yaşayışlarına, âdetlerine, kültürlerine, düşünce ve tasavvurlarına baktığımızda İslam hukukunun bu hususta neleri tashih edip dönüştürdüğünü, neleri ilga ve ibkâ ettiğini gerekçeleri ile idrak ettiğimizde bu dinin kadına, ahlaka ve özellikle nesle verdiği değeri daha iyi anlamış olacağız. Hz. Âişe'den aktarılan bir rivayete göre Cahiliye devrinde dört çeşit nikâh olduğu bildirilse de o dönemde var olan on beş nikâh akdi tespit edilmiştir. Bu akidlerin büyük bir kısmı rivayetlere yansırken Haden, Bedel ve İştira nikâhına ait rivayetler, Kütüb-i Sitte de yer almamaktadır. Kur'ân-ı Kerîm bu nikâh akidlerinden bazılarına doğrudan değinmektedir. Vahiy ve sünnet, İslam Dini zuhur ettikten sonra, belirli bir vakit daha uygulanan bu akidleri, kadınlar için büyük zulüm ve haksızlık oluşturduğu gerekçesiyle çoğunluğunu ilga etmiştir. Genelde evlilik amacı gütmeyen ve sırf nefsanî arzuları tatmin etmek için yapılan bu birlikteliklerin ilga edilmesindeki temel sebeb, zina olmasından kaynaklansa da kadının alacak hakkı olan mehir, veraset, nafaka ve boşama gibi haklarından yoksun bırakılması, özgürlüğünün elinden alınması ve akidlerin anlaşmalı olması (süreli) gibi unsurlar da ilga edilmesindeki önemli diğer etkenlerdir. Bu etkenler, o dönemde kadın ve erkek arasında bir ayrım yapıldığını gözler önüne sermiştir. Tüm insanlığa hitap eden İslam Dini, cinsiyete bağlı üstünlüğü kabul etmemiş, kıymet gösterilmeyen ve erkeğin sahip olduğu pek çok haktan mahrum bırakılan kadınlara haklarını tanzim etmiştir."
