abstract: "Fıkıh ilminin irdelediği en önemli ve en geniş konular arasında finansal işlemlere ilişkin hükümler yer almaktadır. Âlimler, -geçmişten günümüze- söz konusu hükümlere metin, şerh, şiir ve düz yazı olarak en mükemmel bir şekilde ve biçimde hizmet ettiler. Bazıları o hükümleri müstakil bir şekilde kaleme alırken bazıları onları tüm fıkıh bölümlerini içeren kitapların kapsamında arz etti. Metin şeklinde telif edilen söz konusu kitaplardan biri de“muhtasar”olarak isimlendirilen el-Kudûrî'nin metnidir. Kitabın önemine binaen çok sayıda âlim tarafından şerh edilmiştir. Bu şerhlerden biri de İbn Ummi Veled (ö. 950) olarak bilenen Abdulevvel b. Hüseyn b. Hasan b. Hâmid er-Rûmî'ye ait Hadakü'l-'uyûn isimli şerhidir. Bu çalışmada söz konusu şerhteki mali muamelat bölümlerine dair edisyon kritiği yapılmaktadır. Çalışma, biri tetkik/inceleme; ikincisi ise tahkik/tenkit olmak üzere iki ana bölümden oluşmaktadır. Tetkik bölümünde el-Kudûrî ve metni kısaca tanıtılmış sonra Şerhu Hadaki'l-Uyun başta olmak üzere kaynaklarda hakkında yeterli malumat bulunmayan müellif Abdulevvel b. Hüseyn b. Hasan b. Hâmid hakkında ayrıntılı bilgilere yer verilmiştir. Daha sonra ise yazılı nüshalar ve sunumları mütalaa edilmiştir. Muhakkikin yazma metni bölümünde kitabın metin ve şerhi İslam Araştırmaları Merkezi'nin (İSAM) metin tahkiklerinde kullanılan yönteme göre sunulmuştur. Araştırmanın amacı, gözlerden ırak olan bu âlime ışık tutmak, Hanefî mezhebindeki konumunu beyan etmek, bu şerhin ilmi katkılarını ortaya koymak ve müellifin metinde hedeflediği tabloya en yakın resme ulaşmaktır."
