abstract: "Hükmi Şahsiyet kavramı, modern hukukun en önemli kurumlarından birisi olarak nitelendirilebilir. Zira hükmi şahsiyet; en öncelikli konusu \"şahıs\" olan hukukun, tarihi süreç içerisindeki tedrici tekamülünde en göze çarpan basanlarından/buluşlarından birisidir. Bu itibarla XX. Yüzyıl hukukçuları, hükmi şahsiyet esasını, hukukta modernite ve çağdaşlık ölçütü olarak kabul etmektedirler. Buna bağlı olarak bir kısım hukukçular, İslam Hukukunda \"hükmi şahsiyef'e yer verilmediği tezine bağlı olarak, modern çağda İslam Hukukunun işlerlik ve aktüalitesini yitirdiğini savunmaktadırlar. Bu görüşün savunucularına göre, kendi bünyesi içerisinde \"hükmi şahsiyet\" kavramına/olgusuna yer vermeyen bir hukuk sisteminin modern çağın icaplarına ayak uydurması mümkün değildir. Halbuki hükmi şahsiyet kavramı her ne kadar 1-2 asırlık bir geçmişe sahip ise de, hükmi şahsiyet düşüncesi (bunu andıran/bugünkü anlayışa uygun uygulamalar itibariyle) eskiden beri mevcuttur. Roma Hukukunun klasik dönemlerinde (M.Ö. V. Asır) bile, günümüzün hükmi şahsiyet esasına uygun teşekküllerin mevcudiyeti bilinmekteydi. Keza bu yönüyle İslam Hukuku da ortaya çıktığı ilk dönemden itibaren (7-8. Asır) hükmi şahsiyet fikrine sahipti ve bu bağlamda vakıf müessesesi bunun en belirgin bir örneği olarak zikredilebilir. Hatta 19. Yüzyılda batılıların hükmi şahsiyet kavramına ulaşmasında İslam'daki vakıf müessesesinin de tesiri olduğu söylenebilir. İşte bu araştırma İslamî doktrinler açısından hükmi şahsiyet kavramının ve düşüncesinin mahiyet ve niteliğini ortaya koymak üzere hazırlanmıştır. Öncelikle tarihi geçmişinde ve aynı zamanda günümüzde İslam Hukukunun hükmi şahsiyete karşı olmadığı, bilakis buna kendi sistemi içerisinde yer verdiği en somut örneklerle ortaya konulmaktadır."
