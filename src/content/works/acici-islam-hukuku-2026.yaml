abstract: "Bilişim teknolojisinde oluşan ivmelenme, insanın neredeyse her alanda hayatını dönüştürürken veri kavramını günümüz çağının değerli unsurlarından biri yapmıştır. Bu araştırmada sanal dünyanın temel öğesi olan dijital veri kavramı ekseninde yeniden yorumlanan mahremiyetin sınırları ile ilgili uygulamalar, güncel kanun ve yönetmelikler incelenmiş ardından fıkıh kaynakları üzerinden mukayeseli İslami perspektif ortaya konmuştur. İlk aşama olarak dijital ve veri kavramlarının bilişim alanı içerisinde tanımı yapılmıştır. Verinin, büyük veri ve veri madenciliği gibi işlemlerle nasıl kullanıldığı ortaya koyulmuştur. Ardından dijitalleşme sürecinin neticesinde gözetim toplumunun ortaya çıktığı günümüz dünyasında mahremiyet algısının geçirdiği tarihsel dönüşüm tahlil edilmiştir. Kişisel verilerin korunması için neşredilen modern mevzuatlar ve yasalar incelenerek güncel hukuki altyapı anlatılmıştır. Çalışmanın temelini oluşturan İslami bakış açısı kısmında ise dijital verinin İslam hukukundaki zemini oluşturulmuştur. Klasik fıkıhtaki mal, menfaat, mülkiyet ve hak konuları çerçevesinde dijital verinin değer taşıdığı ve mülkiyete konu olma vasfı kazandığı tespit edilmiştir. Bu bağlamda yine klasik fıkıhta yer alan fiziki mahremiyet ve malın koruma altına alınması (hırz) kavramları, dijital veri mahremiyetine uyarlanmıştır. Siber dünyadaki mahremiyet ve güvenlik ihlallerinin fıkhi ve cezai boyutları tahlil edilmiştir. Verinin sadece mal olmadığı, korunması gereken bir emanet niteliğinde olduğu vurgulanmıştır. Bu doğrultuda emanet olan dijital verinin güvenliği ve mahremiyeti için dengelerin sağlanması adına bireylerin, devlet hukuk sisteminin ve veri sorumlusu kuruluşların fıkhi hakları ve sorumlulukları belirlenmiştir."
