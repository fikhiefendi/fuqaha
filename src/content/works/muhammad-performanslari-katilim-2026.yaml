abstract: "Bu çalışma, Çevresel, Sosyal ve Yönetişim (ESG / Environmental, Social, and Governance) performansının bankaların finansal riski üzerindeki etkisini incelemekte olup, bu ilişkide Ortalama Aktif Kârlılığı (ROAA / Return on Average Assets) değişkenini bir düzenleyici değişken (moderating variable) olarak ele almaktadır. Araştırma örneklemi, Organisation of Islamic Cooperation (OIC) üyesi 12 ülkede faaliyet gösteren 31 İslami bankaya ait toplam 155 gözlemden oluşmaktadır. Finansal risk, kredi riski ve likidite riski olmak üzere iki boyutta ele alınmıştır. Kredi riski, Takipteki Krediler Oranı (NPL / Non-Performing Loans) ile; likidite riski ise Kredi–Mevduat Oranı (LTD / Loan-to-Deposit Ratio) ile ölçülmüştür. Çalışma, panel veri kullanılarak nicel bir yaklaşım benimsemekte ve heteroskedastisite ile otokorelasyon problemlerini gidermek amacıyla Genelleştirilmiş En Küçük Kareler (GLS / Generalized Least Squares) tahmin yöntemini uygulamaktadır. Bulgular, hem toplam ESG performansının hem de alt bileşenlerinin (çevresel, sosyal ve yönetişim) kredi ve likidite riskinde anlamlı bir azalışla ilişkili olduğunu göstermektedir. Daha yüksek ESG skorları, daha düşük NPL ve LTD oranları ile bağlantılıdır; bu durum, sürdürülebilirlik uygulamalarının etkili bir risk azaltma mekanizması olarak işlev gördüğünü ortaya koymaktadır. Bununla birlikte, düzenleyici analiz sonuçları, finansal performansın (ROAA) ESG ile finansal risk arasındaki negatif ilişkiyi zayıflattığını göstermektedir. Başka bir ifadeyle, kârlılık düzeyi arttıkça ESG'nin risk azaltıcı etkisi daha az belirgin hâle gelmektedir. Bu bulgu, ESG'nin etkinliğinin bankaların içsel teşvik yapıları ve kâr odaklı yönelimleri tarafından koşullandığını göstermektedir. Teorik açıdan çalışma, Paydaş Teorisi (Stakeholder Theory), Vekâlet Teorisi (Agency Theory) ve skimping hypothesis yaklaşımlarını bütünleştirerek ESG–risk ilişkisinin koşullu doğasını açıklamaya katkı sağlamaktadır. Bulgular, ESG'nin bankacılık sektöründe finansal istikrarı güçlendirdiğine dair ampirik kanıt sunmakla birlikte, bu etkinin kârlılık dinamiklerine bağlı olduğunu ortaya koymaktadır."
