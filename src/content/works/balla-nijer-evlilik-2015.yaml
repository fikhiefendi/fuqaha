abstract: "Müsüman aileye İslam şeriatı tarafından büyük ihtimam verildi.Rahmet ve sevgiye dayalı aile oluşturmaya İslam büyük önem verdi..Allahü teala buyurdu ki : (Ve onun Ayetlerinden olarak sizin için nefislerinizden zevceler yaratmıştır ki onunla sukun bulasınız ve sizin aranızda sevgi ve rahmet kıldı .Muhakkak ki bunda düşünen bir kavim için mutlaka ayetler vardır.) İslam koca seçimi için kaideler koyduğu gibi karı seçimi için de kaideler koydu.Yine karı ve koca için ikisi için de kurallar koydu.Aile bu ihtimamı hak ediyor.Aile, İslam toplumunda temel taşı teşkil eder.Aileyi korumak İslam toplumun gerekli unsurlarını korumak sayılır.İslamın aileye verdiği önem evliliği desteklemesi ile kendini gösterir.Nişanın ve evliliğin nasıl olacağı ,hatta karı kocanın boşandıktan sonra bile.İslam karı koca haklarına ihtimam gösterdi.Bunun için İslam alimleri ahvali şahsiye hakkında görüşlerini bildirmişlerdir.Nijer ahvaluşşahsiyye kanunlarını incelediğimizde bütün aile meselelerini kapsayıcı biçimde buldum lakin tafsilat ve şerh bakımından yoksun.Ahvalüşşahsiyyenin yeri ve önemi büyük olduğu için bu konuda yazı yazmama muvaffak kılması için Allaha dua ettim.Yazılmasında ilmi ve selim araştırma metodları ile uygun düşecek şekilde yol tuttum.Nijer kanunları ahvaluşşahsiyye kanunlarına uygun,konu hakkındaki kanun hükümlerine ve konunun gerektirdiği en kuvvetli delile uygun olarak , her mezhebin görüşünü asıl kitaplarından delilleri ile belirtip konuyu yorumlayıp uygun olan görüşü belirtim. Aile ilişkilsi gerçek kişi dediğmiz insanlar için daha doğdukları anda başlayan bir ilişkidir.Doğan çocuk, ister bir evlilik içi birleşmeden ister evli olmayan bir kadınla erkeğin birleşmesinden doğmuş olsun, bunun gerek anası, gerek babası ile hukukı ilişkisi söz konusu olur."
