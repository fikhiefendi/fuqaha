abstract: "Bu çalışma İstanbul Sebahattin Zaim üniversitesinde İslami ilimler programı yüksek lisans derecesi kazanmak için takdim edilmiş ilmi bir çalışmadır. Tez konumuzun başlığı Ebü'l-Sefâ Burhânüddîn İbrâhîm b. Mustafa el-Halebî'nin Tuhfetü'l-Ahyâr alâ Dürrü'l-muḫtâr eserinden \"talâkul merîz babından istîlâ babına kadar olan bölümün tahkik ve incelemesini teşkil etmektedir. Tuhfetü'l-Ahyâr, Muhammed b. Abdullah et-Timurtaşî'nin Tenvîrü'l-ebṣâr adlı eserine Haskefî'nin ed-Dürrü'l-muḫtâr adıyla yazdığı şerh üzerine yazılmış bir hâşiyedir. El-Halebî haşiyesinde kapalı ibareleri açıklamış, problemli yerlere notlar düşmüş, bazen tashih bazen beyan bazense tasvipte bulunmuştur. Halebî'nin bu haşiyesi bu kitap üzerine yazılmış haşiyelerin en önemlilerindendir. Arzu edilen amaca yönelik en faydalı, kabul gören bir düzene sahip, mümkün olduğunca doğru görüşler belirtilmiştir. Yazar, eserindeki itiraz tashih ve düzeltmelerde ulemaya karşı saygısını korumuştur. Tahkik edilen bölüme talâk kitabından bir miktar, ricat, îlâ, Hulu, zihar, li'ân, anin ve iddet bablarından ayrıca itk kitabından da bir bölüm ilave etmiştir. Çalışmamı iki ana bölüme ayırdım; Bir: inceleme İki: seçili bölümün tahkiki Tüm bunları inşallah yeri geldikçe açıklayacağım. Yüce Rabbimden takdim ettiğim çalışmamın bana fayda sağlamasını niyaz ediyorum. İmam el-Halebî'ye ilim ve ilim ehline sağladığı katkılardan ötürü mükafatların en hayırlısını bahşetmesini diliyorum. Rabbimden bu çalışmamı yazarın Murad ettiği incelikleri tespit ederek itmam etme konusunda yardım talep ediyorum. Rabbul âlemin her şeye gücü yeten ve her şeyin sahibidir."
