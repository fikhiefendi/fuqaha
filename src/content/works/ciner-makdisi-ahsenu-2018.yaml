abstract: "Bu tezde beşerî coğrafyanın ünlü eseri Ahsenü't-Tekâsîm fî Ma'rifeti'l-Ekâlîm, Şam ve Meşrik bölgelerinin bir kısmı ve Kirman bölgesi hariç Türkçe'ye terceme edildi. Ayrıca bu tezde Makdisî'nin kısaca, özellikle siyasî bakımdan yaklaşımı ve metodu açıklanmıştır. Makdisî mevcut tek bir siyasî yapının gerekliliğini aramaz. Kendisi hükümdarlar ile olan ilişkilerinde uyumlu biridir. Bunun sebebi İslam Dünyası'nda birleştirici gücün azalmasından dolayıdr. Makdisî, kendisini İslam Dünyası'ndaki dinî kurumlara ve ulemâya yaslamaktadır. Ana mezheplerin hepsinden önce fıkhın bütün müslüman memleketlerinde nasıl uygulandığınıve daha da önemlisi, bu durumun kutsal bir biçimde nasıl ön plana çıktığı ve planlandığını yani bir tür Pax Islamica anlayışını.gösterir. Bu klasik bir sünnî yaklaşımıdır. Dolayısıyla Andre Miquel'in“Makdisî'nin bir Şii dâîsi”olduğu iddiasını inandırıcı bulmayıp kanıtlarla açıklıyoruz. Makdisî'nin Hz. Ali'ye karşı olan sevgisini onun Hanefî ve sûfî olmasndan kaynaklandığını düşünüyoruz."
