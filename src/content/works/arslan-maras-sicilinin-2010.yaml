abstract: "Osmanlı Devleti kurulduğu andan itibaren adaleti kendisine ilke edinmiş ve adaletin uygulanma yeri olan mahkemelere büyük bir önem vermiştir. Şer?i hükümlerin uygulandığı şer?iye mahkemeleri ve kadılar adalet sisteminin temelini teşkil etmişlerdir. Kadılar sadece kadılık görevi yapmamışlar bulundukları yerde devletle her türlü yazışmayı yapmışlardır. Kadılar görevleri icabı yaptıkları yazışmaları kayda geçirmişlerdir ki bu kayıtlara şer?iye sicilleri adı verilmektedir. Şer?iye sicilleri ait oldukları bölgenin idarî-siyasî durumu, o bölgede yaşayan insanların geçim tarzları, kullandıkları eşyaları, birbirleriyle olan ilişkileri, ekonomik durumları vb. konular hakkında bilgiler veren önemli kaynaklardır. Kadılar şer`i ve hükmi muamelatta, kendilerine verilen beratta gösterilen vazifeleri görüp, Hanefi mezhebi üzerine karar verirlerdi. Araştırmamızın konusu olan Mar`aş'ın 229 No'lu Şer`iye Sicili, 1886?1887 senesini kapsamaktadır. Bu tarihte Mar`aş, Halep Vilayeti'ne bağlı bir sancaktır. 229 No'lu Mar`aş Şer`iye Sicili'nin 390?463. sahifeleri arasındaki kısım araştırma konumuzdur. 1886-1887'deki Maraş şehir tarihinin dini, hukuki, idari ve demografik yapısı hakkında ayrıntılı bilgiler bulunmaktadır. Belgelerde dikkat çeken bir husus gayrimüslim halk ile Müslüman teb`a ilişkilerinin iç içe geçmiş olduğudur. Bu durum Osmanlı Devleti'nin dinî yapısındaki farklı kesimlere adaletle hükmeden ve hoş gören tutumunu bir kez daha ortaya koymaktadır. Ayrıca demografik açıdan gayrimüslim kitlenin azımsanmayacak yoğunlukta olduğunu da ifade etmek gerekmektedir."
