abstract: "Bu eser Ebû Muhammed (Ebû Alî) Bedrüddîn Hasen b. Kâsım b. Abdillâh b. Alî el-Murâdî (ö. 749/1348)'nin, telifi İbn Mâlik et-Tâî (ö. 672/1274)'ye ait olan el-Elfiyye isimli manzumesine yazmış olduğu Tavzîhu'l-makasıd ve'l-mesâlik bi-şerhi Elfiyyeti İbn Mâlik isimli eser üzerinde incelemelerde bulunmayı amaçlamaktadır. Bu araştırmanın konusunu, Murâdî'nin şerhinin Arap dil bilimine olan katkıları ve diğer el-Elfiyye şerhlerinden hangi yönleriyle ayrıldığına dair değerlendirmeler oluşturmaktadır. Araştırmanın sınırlarını didaktik şiire dair malumatlar, İbn Mâlik ve Murâdî'nin telif etmiş olduğu eserler ve bu iki alim hakkında kaynaklarda geçen rivayetler oluşturmaktadır. Bu çerçevede elde edilen veriler analiz ve istikra metoduyla bir sonuca bağlanmıştır. Araştırmamız giriş, iki ayrı bölüm, sonuç ve kaynakça bölümlerinden oluşmaktadır. Araştırmada öncelikle Didaktik şiirin mahiyetinden ve gelişim sürecinden bahsedilmektedir. İkinci bölümde ise Murâdî'nin hayatı konu edilmiştir. Bu bağlamda ilk olarak yaşamış olduğu dönemin sosyal ve siyasî durumuyla alakalı bilgiler verilmiştir. Yine bu bağlamda kendisinin ilim serüvenine ve telif etmiş olduğu eserlere de temas edilmiştir. Sonrasında ise Tavzîhu'l-makâsıd ve'l-mesâlik'in muhtevası ve metodu incelenmiştir. Bu konuların yanı sıra Murâdî'nin İbn Mâlik'e yöneltmiş olduğu eleştiriler de konu edilmiştir. Araştırmamız esnasında Tavzîhu'l-makâsıd ve'l-mesâlik isimli eserin iki farklı tahkikli neşrinden yararlanılmıştır. Bu baskılar Prof. Dr. Abdurrahman Ali Süleyman ve Ahmed Mahmûd Azûr'un yayına hazırlamış olduğu baskılardır. Araştırmamız esnasında, manzum tarzda yazılan eserlerin Arap dili öğretimindeki yeri yadsınamaz konumu ve bu tarzdaki eserlerin medrese müfredatlarına yaptığı etkiye temas edilmiştir. Ayrıca Murâdî'nin İbn Mâlik'in eserleri üzerindeki vukufiyeti, konuların şerhi esnasında kullandığı müdellel üslup ve eleştirel kişiliği ile dile getirdiği itirazlara dair saptamalar yapılmıştır."
