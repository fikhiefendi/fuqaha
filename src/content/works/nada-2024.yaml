abstract: "Bu araştırma, İslam ve Hıristiyanlık arasındaki kader inancı öğretisini ve bunun ruhsal güvenliği sağlamaya etkisini karşılaştırmalı bir çalışma şeklinde açıklamayı amaçlamaktadır. Araştırmada İslam ve Hıristiyanlık'ın yanı sıra İslam'da ve Hıristiyanlık'ta kader kavramı, ruhsal denge ile kaza ve kadere iman öğretisi kavramları ortaya konulmaktadır. Daha sonra araştırmada her iki dindeki kaza ve kader inancı öğretisi ve iki grubun da bunu ispat eden delilleri ele alınmaktadır. İslam'da kaza ve kadere iman öğretisinin dereceleri ve mertebeleri de ele alınacaktır. Aynı zamanda araştırmada Hıristiyanlıktaki kader inancı öğretisinin özellikleri ele alınacak ve tezin son bölümünde hem İslam'da hem de Hıristiyanlıkta psikolojik güvenliğin sağlanması ile kader inancı doktrini arasındaki ilişki tartışılacak ve kadere inanıp inanmamanın doğurduğu sonuçlar açıklanacaktır. Araştırmacı çalışmasında yöntem olarak İslam'daki tevhid doktrini ile Hıristiyanlıktaki teslis doktrini ile ilgili metinlerin izini sürerek tümevarımsal, betimleyici yöntemi izlemiş. Daha sonra tanımlayıcı analitik yöntem, toplanan metinleri analiz edecek, bunlar üzerinde yorum yapacak ve öğrenilen dersleri çıkarmaya gayret gösterecektir. Çalışmadaki ana yöntem ise, araştırmacının her iki gruba göre kaza ve kader inancı öğretisinin kabulü ve reddi konusunu delilleri üzerinden iki inancı karşılaştırmaya çalışacağı karşılaştırma yöntemidir. Bunun ile, iki inancı bir arada ele alan araştırma eksikliğinin ve ilhadın yayılması olarak zikredilebilecek araştırma boşluğunu doldurma gayesi güdülmektedir. Araştırmacı ulaştığı sonuçlardan bazıları şunlardır: İslam'ın şeri anlamı, bu araştırmanın asıl maksadını ifade etmektedir. Tıpkı Hristiyanlık veya Hıristiyanların, tahrif etmedikleri, değiştirmedikleri, ya da Mesih'e ibadet etmedikleri sürece İslam'ın Mesih'in takipçilerini tanımlamak için kullandığı ifadeler olması gibi. Kaldı ki bunun aksi bir durumda onları küfür içerisinde olarak nitelendirmektedir. Müslümanlar arasında kader fikrinin açıklığını ve ona rızayı ispat eden deliller, Hıristiyan öğretisinin aksine, istikrarla çalışmaya ve ilerlemeye yardımcı olan tatmin edici ve açık delillerdir."
