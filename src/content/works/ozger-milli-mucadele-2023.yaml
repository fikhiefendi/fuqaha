abstract: "Bu çalışmanın amacı, Kırım'dan Amasya'ya göç eden bir ailenin çocuğu olan Abdurrahman Kâmil Efendi'nin hayatını, ilim dünyasına hizmetlerini ve Millî Mücadele'ye katkılarını ortaya koymaktır. Dönemin ileri gelen alimlerinden fıkıh, hadis, tefsir ve usul-i fıkıh gibi çeşitli ilimler öğrenerek tahsilini tamamlayan Abdurrahman Kâmil Efendi, Amasya Müftülüğü göreviyle milleti irşat etmeyi millî ve dini bir vazife olarak benimsemiş ve oğullarını da aynı anlayışla yetiştirmiştir. Amasya'da vaizlik, müftülük yapmış ve yazdığı eserlerle şehir halkının eğitim seviyesinin yükselmesine kıymetli katkılarda bulunmuştur. Abdurrahman Kâmil Efendi, dini rolünün yanı sıra Millî Mücadele döneminde Amasya Müdafaa-i Hukuk Cemiyeti'nin on yedi üyesi arasında yer almıştır. Ayrıca, Millî Mücadele'nin ilk vaazını vererek tarihimizde hayati bir rol üstlenen ulemadan Amasya Müftüsü Abdurrahman Kâmil Efendi, Millî Mücadele ruhunu halka aktararak Mustafa Kemal Paşa'ya destek vermiş ve düşmana karşı topyekûn bir direnişin başlatılmasında üstün bir gayret göstermiştir. Bu sayede hem Kurtuluş Savaşı'nın hem de Cumhuriyetin getirdiği yeniliklerin yanında yer alarak Millî Mücadele tarihimizde hayati bir rol üstlenen bir alim olarak yerini almıştır."
