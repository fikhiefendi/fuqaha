abstract: "Bu çalışma, Sahabe bilginleri halkasından biri olan ve çok yönlülüğüyle tanınan İbn Abbâs?ın İslam hukukuna dair fikirlerini tespit etmektedir. Tefsir ve Hadis ilimlerinin önemli şahsiyetlerinden biri olarak kabul edilen İbn Abbâs?ın, İslam hukukunda da yeri hiç şüphesiz ki çok önemlidir. Asr-ı Saadette yaşının küçük olmasın¬dan dolayı Rasulullah (s.a.v.)?ın hanesine rahatça girip çıkmış, dört halifenin ilim meclisinde bulunmuş olan İbn Abbâs?ın, bu sayede kazanmış olduğu birikimlerini fıkıh dâhil ele aldığı bütün konulara yansıttığını görmekteyiz. Doğrudan bir fıkıh kitabı yazmasa da İslam hukukunun birçok alanına sunduğu katkı takdire şayandır. Bu çalışma İbn Abbâs?ın, ilmî kişiliği ile Fıkhî görüşleri ve ayrıca hac ile ilgili furû?i fıkıh alanındaki fikirlerini ele almaktadır. İbn Abbâs kendine özgü yorum ve bakış açısıyla İslam hukukunun konularına temas etmiş, İslam hukuk ekollerinin ortaya çıkmasına zemin hazırlamıştır."
