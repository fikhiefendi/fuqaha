abstract: "Osmanlı Devleti'nin siyasî, hukuki, askerî ve ekonomik yapısını anlamak için incelenmesi gereken kaynakların başında şer'iye sicilleri gelmektedir. Şer'i Mahkemeye intikal eden bütün olayların ve dava kayıtlarının tutulduğu deftere şer'iye defterleri denilmektedir. Bu çalışmada Elbistan'ın geçmişten günümüze kadar olan süreçteki tarihi, Elbistan adı ve coğrafyası hakkında kısa bir değerlendirme yapıldı. 462 Numaralı Defter incelemesi neticesinde, 1890-1893 yılları arasında Maraş sancağının Elbistan Kazasındaki Bidayet Mahkemelerinin işleyişi ve kararların infaz süreci hakkında bir ön bilgi verilmiştir. Türklerin geçmişten günümüze kadar titizlikle üzerinde durduğu hukuk konusunun Osmanlı Devleti döneminde de büyük bir titizlilikle işlenildiği bu defterde de görülmektedir. Çalışmada usul olarak Elbistan tarihi ve bölgenin coğrafyası hakkında kısa bilgi verilerek, Osmanlı hukukunun genel yapısı hakkında da bilgilere yer verilmiştir. 462 numaralı Elbistan Şer'iye Sicili transkript ederek değerlendirildi. Belgelerin özetleriyle birlikte muhtevası olan cinayet, darp, borç gibi olaylar tespit edilerek bu olaylar üzerinden Osmanlı Dönemi'ndeki Elbistan'ın H 1306-1309/M 1890 - 1893 yılları arasındaki durumu değerlendirilmiştir."
