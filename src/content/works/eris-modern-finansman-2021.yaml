abstract: "1980'li yıllardan itibaren faizsiz finans veya İslami finans olarak adlandırılan finansman yöntemlerinde çok hızlı bir gelişme gözlenmiştir. Bu gelişmenin önde gelen faktörlerinden biri de hiç şüphesiz faizsiz veya İslami bono olarak da adlandırılan sukuktur. Bu çalışmada modern anlamdaki ilk örneklerine 20.yy sonlarında rastlanan sukukun benzeri enstrümanların İslam iktisat tarihinde de var olup olmadığı sorusuna cevap aranmıştır. Çalışmamızda bu soruya cevap bulabilmek için incelediğimiz İslam iktisat tarihindeki birçok farklı finansman temin yöntem ve uygulamalarında işlev ve yapı olarak sukuk ile benzerliklerin olduğunu tespit ettik. Bunlar arasında İslam iktisat tarihinde var olmuş sukuk ile aynı ismi taşıyan ve işlev olarak da benzerliklere sahip olan sak olarak adlandırılan enstrüman; vakıflar hukuku ve tarihinde kullanılan belli bazı finansman sağlama metotları; İslam borçlar hukukunda var olan ve sukukun yapılandırılmasında temel teşkil eden çeşitli sözleşme türleri; ve Osmanlı devletinin iç borçlanmada kaynak sağlamak için kullandığı bir mali araç olan esham gibi işleyiş şekilleri ve sukukun yapılandırılmasında temel oluşturmaları bakımından sukuka benzerlikleri ile öne çıkan birçok enstrüman ve uygulamaların olduğunu gördük."
