abstract: "Nevâzil, yeni ortaya çıkmış, mezhep imamlarından görüş nakledilmemiş yahut farazi meselelere meşâyıh tarafından verilen cevaplardan ve imamların ihtilaf ettiği konularda meşâyıhın tercihlerden müteşekkil mesâili ifade etmektedir. Meşâyıhın tahriç ve tercih mesâisinde bulunurken belirlediği ve hareket ettiği kriter ve yöntemler, mezhep içerisinde fıkhî bilgi üretmenin esaslarını belirlemiştir. Bu sebeple, Hanefî fıkıh eserlerinin ve fetvâ mecmûalarının başlıca kaynakları arasında olan nevâzil eserlerinin incelenmesi, mezhebin gelişimini ve yapısını anlamak açısından son derece mühimdir. Son dönemlerde, nevâzil eserlerine dair yapılan çalışmaların sayısında artış olsa da hâlâ bu alanın bakir olduğu söylenebilir. Bu tez, Hanefi fıkıh tarihi ve nevâzil edebiyatı açısından son derece önemli olan 6/12. asır Buhara'sında, İftihâruddin Tâhir b. Ahmed el-Buhârî tarafından telif edilmiş, Hulâsatü'l-fetâvâ ve el-Hulâsa isimleriyle meşhur, nevâzil eserinin, kaynaklarını ve literatürde kendisine yapılan atıflardan hareketle, Hanefî fıkıh literatüründeki yerini tespit etmeyi amaçlamaktadır. Eserin bazı bölümleri farklı çalışmalarda tahkik edilmiş olsa da hâlâ eserin çoğu tahkik edilmemiş ve eser ya da müellif üzerine kapsamlı bir çalışma yapılmamıştır. Yapılan incelemeler sonucunda, eserin müellifine ve dolayısıyla eserin telif tarihine dair klasik kaynaklarda yer alan malumatların yanlış olduğu sonucuna varılmıştır. Eserin, iki yüzü aşkını Türkiye'de olmak üzere dünya üzerinde üç yüz elliden fazla mahtût nüshası olduğu tespit edilmiştir. Kısmî tahkikleri ve bazı mahtût nüshaları dikkate alınarak yapılan çalışmada Hulâsatü'l-fetâvâ'da yaklaşık yüz esere atıf yapıldığı tespit edilmiştir. Literatürde kendisine atıf yapan altmışın üzerinde eser zikredilmiş, bu eserlerin yirmi yedisinde yapılan beş bine yakın atfın, eserlerin hangi bölümlerinde yapıldığı gösterilmiştir."
