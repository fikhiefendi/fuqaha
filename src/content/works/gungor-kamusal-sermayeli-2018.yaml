abstract: "Gelişen dünya ekonomisi beraberinde bankacılık faaliyetlerinin de gelişmesini ve büyümesini sağlamıştır. Dünyada faizsiz bankacılık ya da İslami bankacılık adıyla ifade edilen katılım bankaları; coğrafi konum ve dini hassasiyetler gereği ülkemizde son 30-40 yıldır varlığını sürdürmekte olan bir bankacılık türüdür. Atıl fonların sisteme kazandırılması ve İslam coğrafyasındaki sermaye fazlasının ülke ekonomisine kazandırılmasını sağlamak adına faaliyette bulunan katılım bankaları, son zamanlarda devletin de desteğiyle birlikte bankacılık sektöründe önemli bir konuma sahip olmuştur. Pazar payları %5 civarında olan katılım bankalarının 2023 hedefi %15'lik paya sahip olmaktır. 2017 sonu itibarıyla sektörde 3 adet özel sermayeli, 2 adet ise kamusal sermayeli katılım bankası faaliyette bulunmaktadır. Devlet desteğinin de etkisiyle birlikte katılım bankalarının hizmet kalitesinde meydana gelecek etkiler katılım bankalarının hedeflerine ulaşmasına önemli derecede katkıda bulunacaktır."
