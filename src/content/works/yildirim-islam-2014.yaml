abstract: "Toplumların gelişmişlik seviyeleri fertlerinin mutlulukları ile ölçülür. Bir toplumun mutluluk endeksi yükseldikçe o toplumun refah ve medeniyeti seviyesi yükselmiş olur. Bunun için toplumun bütün bireylerinin mutluluk seviyelerinin yükselmesi gerekir. Bu yüzden toplumların zayıf halkalarını oluşturan kesimlerin mutluluğu için bütün toplumun gayret göstermesi lazımdır. Hastalar toplumu oluşturan en zayıf halkalardan biridir. Bu kesimin mutlu olabilmesi ise haklarını eksiksiz elde etmeleri ile bir nebze olsun temin edilmiş olacaktır. Bu nedenle hasta hakları, toplumun gelişmişlik ve medeniyet seviyesini göstermesi açısından önemlidir. Bu haklar hasta lehine bütün topluma karşı dinen, ahlaken ve hukuken korunmuş haklardır. Bu tez hasta haklarının nelerden ibaret olduğunu İslam hukuku açısından ortaya koymayı hedeflemektedir. Anahtar Kelimeler: İslam Hukuku, Hasta, Hasta Hakları, Temel Hak ve Hürriyetler, İnsan Hakları."
