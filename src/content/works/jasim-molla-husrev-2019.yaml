abstract: "Bu mütevâzi çalışmamda incelemesini ve tahkikini yaptığım Molla Hüsrev'in Beydavî'nin Envârut-Tenzîl ve Esrârut-Te'vîl adlı tefsirine ait Hâşiye alâ Envârut-Tenzîl ve Esrârut-Te'vîl diye isimlendirdiği yazma eserinin Fatiha suresi ile Bakara suresinin 5. Ayetine kadar olan kısımları yer almaktadır. Molla Hüsrev, İmam Beydavî'nin tefsirini okuyucunun anlamasını kolaylaştıracak şekilde basit bir şerhle açıklamıştır. Hâşiyenin kıraat, dil, nahiv, usul, kelam ve benzeri ilimleri içermesi dikkate değerdir. Bu sebeple Molla Hüsrev'in ilimlerin birçoğunda yetenekli olduğu görülmektedir. Tahkikte üç yazma nüshayı esas aldım ve İslamî Araştırmalar Merkezi'nin (İSAM) tahkik yöntemini izledim. Her bir nüshayı diğer yazma nüshalardan ayırt etmek için simgeledim. Şöyle ki birinci nüshayı müellifin nüshasıyla örtüşmesi, hâmiş ve hareke hatası bakımından az olması sebebiyle asıl nüsha olarak tercih ettim ve onu ي harfi ile diğer iki nüshayı ise ح ve م rumuzlarıyla simgeledim. Diğer iki nüshalardan metin harekelemesinde yararlandım. Kuran ayetlerini resm-i mushaf hattına göre yazdım ve tahricini yaptım. Bunun yanı sıra yazma metinlerinin İmam Beydavî'nin tefsirine uygunluğunu kontrol ettim ve karşılaştırmada kaynak olarak aldım. Aynı şekilde Hadis-i Şerifleri ve alıntıları ana kaynaklardan tahriç ettim. Âlimlerin sözlerini bulabildiğim kadarıyla kaynaklarına nispet ettim. İmam Molla Hüsrev'in Haşiyesinde bahsettiği şahısların tanıtılması okuyucu gerektiği zaman müracaat diye meşhur biyografi kitaplarından özetle aktardım. Aynı şekilde eserde geçen anlamı kapalı bazı kelimeleri okuyucuya kolaylık olsun diye o alanla ilgili kitaplara başvurarak açıkladım. Tahkikimde modern basım metoduna uygun bir şekilde modern arapça imla kurallarını esas aldım."
