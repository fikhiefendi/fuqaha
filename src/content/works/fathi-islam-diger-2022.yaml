abstract: "İslamiyet; devleti, hayat tarzını düzenlemek, meşru gayeleri gerçekleştirmek, maddî ve manevî refahı sağlamak, inancı korumak ve yaymak için en yüce ve vazgeçilmez kurum olarak kabul edilir. Bu, ekonomik faaliyetin çeşitli yönlerini gerçekleştirmek için İslami Şeriat ile uyumlu olarak ve tam olarak kullanmak isteyen bireylerin ekonomik özgürlüğüne keyfilik veya önyargı olmadan, kamu yararına ulaşmak için onlar ve devlet arasındaki entegrasyon ve işbirliği temelinde yapılır. Bu İslami görüş, devlet müdahalesi ilkesi ve ekonomik faaliyetteki rolü açısından çeşitli insan yapımı kapitalizm ve sosyalizm sistemlerinden farklıdır. Bireylerin ekonomik özgürlüklerinin yanı sıra, ekonomik faaliyetlerinde bulunma ve bunları, ister kapitalist ister sosyalist olsun, bu ülkelerdeki mevcut sistemle tutarlı bir şekilde uyarlamaya çalışma özgürlüğü içindedir. Birinci bölümde İslam'da devletin ekonomik sürece müdahalesini ele aldım. İkinci bölüme gelince: Kapitalist sistemde ekonomik sürece devlet müdahalesini ele aldım. Ve üçüncü bölümde: Sosyalist sistemde ekonomik faaliyete devlet müdahalesini ele aldım. Elde ettiğimiz en önemli sonuçlar arasında: Bu çalışma aracılığıyla incelenenlerin uygulanmasında, İslami perspektiften ekonomik çözümler, bireyin ve toplumun çıkarını, ikisini de boşa harcamadan elde etmeye kadar uzanmaktadır. Bu sayede yalnızca bireyin çıkarına ulaşılabilen kapitalist çözümlerden olduğu gibi yalnızca toplumun çıkarına ulaşılan sosyalist çözümlerden de ayrılmaktadır. Bireyin menfaati ile toplumun menfaati arasındaki bu uzlaşmanın meyvesini, hem ekonomik özgürlük alanında hem de ekonomik faaliyette devlet müdahalesi alanında en önemli İslami iktisat ilkelerini bu çalışmada gördük. Şunu belirtmekte fayda var ki, İslam ekonomisini kapitalist veya sosyalist iktisatçılardan birine bağlamaya çalışmak ya da ekonomik özgürlüğün ve devletin ekonomik faaliyete müdahalesinin alanı olduğumu zannetmek büyük bir hatadır. En önemlisi, bireycilik (kapitalizm) ile kolektivizm (sosyalizm) arasındaki, her birinden bir taraf alan veya diğerinden alıntılanan bileşik bir ruh halidir ve şifayı garanti eden ve cemaate zarar verendir. Eğer iki çıkar birbiriyle çelişiyorsa, o zaman daha büyük zararı daha az zararla geri çevirmenin yasallığını benimseyerek toplumun çıkarlarını bireyin çıkarlarının önüne koyar. Eğer iki Müfşatan çatışırsa, en az zarar vererek en büyük zararı hesaba katmak gerekir. İktisadi özgürlük, İslam ekonomisinde, bireyin özgürlüğünün ilahi bir ardıllık ve ilahi bir hediye olduğu, Allah'ın kanun koyduğu ve hüküm sürdüğü yerde tesis edildiği gibi, bireyler bağlı olduğu sürece ihlal edilemeyecek bir kişisel hak olarak kabul edilir. Allah'ın emrettiği yerde kalkar, yasak olduğu yerde durur. ve ekonomik özgürlüğün İslami yaklaşımın sınırlarından uygulanmasındaki bu sapma, toplumun çıkarlarını tehdit edecektir. Bu da suiistimallerin sınırlandırılmasını ve bireysel ve toplu hakların güvence altına alınmasını gerektiriyor. Devletin müdahalesi, kamu yararının sağlanması ve müdahaleyi gerektiren ihtiyacın boyutu ile sınırlıdır."
