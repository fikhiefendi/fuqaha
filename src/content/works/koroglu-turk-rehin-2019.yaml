abstract: "Tüm ayni haklar arasında bir sıra düzeni mevcuttur. Taşınmaz rehninde de, taşınmazın paraya çevrilmesi ile, elde edilen bedelin tüm alacaklılara yetmemesi halinde, alacaklılar arasında menfaat çatışması meydana gelir. Her bir alacaklı, elde edilen bedelden alacağını tatmin etmek ister. Bu halde alacaklılar arasında bir sıra belirlenmelidir. Sıranın belirlenmesi noktasında hukuk düzenlerince iki sistem öngörülmüştür. Bunlardan ilki ilerleme sistemidir. İlerleme sistemine göre, ön sırada bulunan alacaklı tatmin edildikten sonra arkadaki ipotekler otomatik olarak boş dereceye ilerler. Bu sistem ipoteğin, teminat amacını öne çıkarmaktadır. Ancak malikin boş derecede yeniden rehin tesis etmesini engellemektedir. Dolayısıyla ipoteğin tedavül işlevi geri planda kalmaktadır. Hukuk düzenlerince öngörülen diğer bir sistem ise sabit dereceler sistemidir. Kanun koyucu da hukukumuzda rehinli alacaklılar arasında sabit dereceler sistemini benimsemiştir. Bu sisteme göre, taşınmaz, her biri değer ifade eden birden çok farazî değere bölünmüştür. Taşınmaz üzerindeki her bir derece bağımsızdır. Bu sistem ile ön sırada bulunan alacaklılardan biri tatmin edildiğinde, sıradaki alacaklı kendiliğinden boş dereceye ilerleyemez. Malik boş dereceyi yeniden tedavüle koyabilir. Sabit dereceler sisteminin katı bir şekilde uygulanması özellikle alacaklılar yönünden olumsuz sonuçlar doğurmaktadır. Bu sebeple kanun koyucu sabit dereceler sistemine birtakım istisnalar getirmiştir. Bunlardan ilki TMK m. 872 ve TMK m. 877-878'de öngörülen kanun doğan istisnalardır. TMK m. 872'ye göre, taşınmaz paraya çevrilirken ön sırada bulunan saklı derece, boş derece veya derece içerisinde bulunan kısmi borçlular hesaplanmayarak, sıradaki alacaklılar tatmin edilir. TMK m. 877-878'e göre ise, arazinin iyileştirilmesi sebebiyle değerinin artırılması halinde, iyileştirme masraflarını karşılayan kurum ve kuruluşlara ipotek hakkı tanınmıştır. Kanun koyucu kanundan doğan istisnaların yanında, tarafların bu yönde ilerleme sözleşmesi yapabilmesini de kabul etmiştir. Alacaklı ile malik arasında, sözleşme serbestisi ilkesi gereğince ilerleme hakkı tanınabilir. Bu ilerleme hakkı, ardarda olabileceği gibi atlama suretiyle de tanınabilir. ilerleme sözleşmesi ile malik, ön sırada bir derece boşaldığında alacaklıyı bu sıraya iletme borcu altına girer. Bu haliyle ilerleme sözleşmesi tek tarafa borç yükleyen bir sözleşmedir. Malikin ilerletme borcuna karşılık alacaklı tarafından da vadenin uzatılması, faizin düşürülmesi gibi borçlar altına girilebilir. Bu halde de iki tarafa borç yükleyen bir sözleşme doğar. Boş dereceye ilerleme sözleşmesi, asıl alacağa bağlı fer'î bir hak olduğundan rehin hakkının varlığına bağlıdır. Boş dereceye ilerleme sözleşmesi, rehin hakkında olduğu gibi resmi şekle tabidir. İlerleme hakkının şahsi hak olması özellikle alacaklılar lehine birtakım olumsuzlara sebep olmaktadır. Bunun bertaraf edilebilmesi için kanun koyucu boş derece ilerleme hakkının şerh edilebilmesini kabul etmiştir. şahsi hak olan ilerleme sözleşmesi, tapuya şerh edildiğinde hem eşyaya bağlı bir boş haline gelmekte hem de bu hak kuvvetlenmektedir. İlerleme hakkı şerh edildiği takdirde, üçüncü kişilerin iyiniyeti korunmaz. Boş derece meydana geldiğinde, boş dereceye kurulan rehin hakkı korunmaz. Taşınmaz maliki, taşınmazını devrettiği takdirde alacaklı, ilerleme hakkını yeni malike karşı da ileri sürebilir. Boş dereceye ilerleme hakkı, yabancı para üzerinden kurulmuş ipotekli alacaklılara da tanınabilir. Diğer yönden, Türk lirası üzerinden kurulan ipoteğin, yabancı para birimi ile belirlenmiş dereceye ilerlemesi de söz konusu olabilir. Bu halde ilerleme TMK m. 851/III'e göre, derecenin değeri ilerleme hakkı tanınmış alacağın para birimine dönüştürülmek suretiyle sağlanır."
