abstract: "Çalışmada parada sahtecilik suçu Osmanlı Ceza Hukuku bakımından ele alınmıştır. Tarihi sürece bakıldığında parada sahtecilik suçunun, Osmanlı Devleti'nin uğraştığı önemli meselelerden biri olduğu görülmektedir. Ancak literatürde çalışma konusu suçun Osmanlı'daki görünümünü salt ceza hukuku bağlamında ele alan bir çalışmaya rastlanılamamıştır. Bu boşluğu doldurmayı amaçlayan çalışmada, kavramsal bir bakış açısı benimsenmiş ve Osmanlı Hukuku bütünsel bir şekilde ele alınmıştır. Çalışmada kanunnameler, mühimme kayıtları, şer'iye sicilleri, fetva mecmuaları ve arşiv belgeleri gibi birinci el kaynakların kullanımına özen gösterilmiştir. Bunun yanı sıra öğretide yer alan çalışmalardan da istifade edilmiştir. Çalışma konusu suç, bir tazir suçudur ve bu kapsamda gerek klasik dönem, gerekse Tanzimat sonrası döneme ait kanunnamelerde kendine yer bulmuştur. Suçun ihlal ettiği değerin padişahlık hakkı, kamu düzeni ve devletin siyasi egemenliği olduğu görülmektedir. Genellikle taklit, kırpma, yaldızlama ve sahte parayı bilerek piyasaya sürme gibi fiillerle işlenen parada sahtecilik suçunun maddi konusunda dönemine göre değişiklikler yaşanmıştır. Bu kapsamda Tanzimat sonrası dönemde kâğıt paralar ve nikel sikkeler de parada sahtecilik suçunun maddi konusu kapsamına dahil edilmiştir. Suçun ihlal ettiği menfaatin büyüklüğü, soruşturmanın titizlikle yürütülmesini zorunlu kılmıştır. Özellikle Tanzimat'tan sonra failin yabancılığı yargılaması ve soruşturma aşaması bakımından birtakım farklılıklar doğurmuştur. Ayrıca ilgili suçun ispatı için pek çok ispat vasıtasına başvurulduğu görülmektedir. Tipik bir tazir suçu olan parada sahtecilik, klasik dönemde pek çok farklı yaptırıma tabi tutulmuş, Tanzimat sonrası dönemde ise kürek, pranga gibi hürriyeti bağlayıcı cezalarla cezalandırılmıştır. Ayrıca suçlunun sübjektif durumu, iştirak, tekerrür ve af cezalandırma sürecinde etkili olmuştur. Sonuç olarak ise parada sahtecilik suçunun ekonomik ve uluslararası ilişkiler boyutuyla birlikte ele alınması gerektiği ifade edilmiştir."
