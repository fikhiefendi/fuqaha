type: "tez-doktora"
title: "Kur'ân İlimleri Açısından Klâsik Dönem (El-Burhân-el-İtkân) ve Modern Dönem (Menâhil-Menhec) Eserlerinin Mukayesesi"
titleTranslation: {"en": "A comparative analysis of classical (Al-Burhān–al-Itqān) and modern (Al-Manāhil–al-Manhaj) works on Qur'anic sciences"}
authors: ["Göksu, Nazife"]
