abstract: "Bu araştırma, klasik dönemde Zerkeşî'nin el-Burhân'ı ve Süyûtî'nin el-İtkân'ı ile 20. yüzyılda Zürkânî'nin Menâhil'i ve Muhammed Ali Selâme'nin Menhec'ini esas alarak Kur'ân ilimleri çalışmalarının tarihî seyrini dönemsel olarak ele almaktadır. Böylece Kur'ân ilimlerinin tarihî seyrini klasik ve modern dönemler bağlamında karşılaştırmalı biçimde inceleyerek alandaki değişim ve süreklilikleri ortaya koymayı amaçlamaktadır. Her iki döneme ait eserler, öncelikle içerik, yöntem ve ele alınan konular bakımından kendi aralarında karşılaştırılmakta; ardından klasik ve modern dönemler esas alınarak dönemler arası mukayeseye tâbi tutulmaktadır. Klasik dönemde el-Burhân ile el-İtkân'ın birbirini tamamlayan iki temel telif olarak konumlandığı görülmekte, Zerkeşî'nin, dağınık hâlde bulunan Kur'ân ilimleri birikimini bütüncül ve sistematik bir çerçeve içinde ele alırken, Süyûtî'nin ise bu zemini esas alıp genişleterek daha kuşatıcı biçimde derlediği görülmektedir. Modern dönemde ise Menâhil, Kur'ân ilimlerinin sistematik bir şekilde işlenmesine önemli katkılar sunarken, Menhec'in ise nispeten daha az tanınmış olmasına rağmen özgün yaklaşımları ve yer verdiği konular bakımından dikkate değer olduğu öne çıkmaktadır. Bu bağlamda, modern dönemde her iki müellifin klasik dönemle kurduğu bağ ve modern döneme kazandırdığı yeni perspektifler ayrıntılı şekilde analiz edilmektedir. Ayrıca çalışmada her iki dönemde de önde gelen Kur'ân ilimleri eserlerinden bahsedilerek, 20. yüzyılda bu alanın gelişiminin tarihsel arka planı belirlenmektedir. Bu araştırmada, klasik dönemde inşa edilen ve bütüncül bir çerçevede sunulan Kur'ân ilimlerinin modern dönemde sistematik bir yapıda devam ettiği ve çağın anlayışına uygun bir üslupla yeniden sunularak daha işlevsel hale getirildiği görülmüştür. Klasik dönemde tasnif ve başlıklandırmaların içerikle oldukça uyumlu şekilde uzun ve ayrıntılı olduğu, modern dönemde ise kısa, fonksiyonel ve eğitim odaklı bir üslup benimsendiği gözlemlenmiştir. Klasik dönem eserlerinde konulara dair bilgilerin ayrıntılı biçimde derlendiği ansiklopedik bir derinlik bulunurken, modern dönem eserlerinde ilgili başlıklara daha sınırlı ölçüde yer verildiği ve Kur'ân'a yöneltilen eleştirilere karşı savunmacı bir üslubun öne çıktığı görülmektedir. Karşılaştırmalı yöntemle yürütülen incelemede, dokümantasyon ve içerik analizi gibi sosyal bilimlere özgü araştırma teknikleri kullanılmakta; böylece dönemin Kur'ân ilimleri yazımındaki metodolojik çeşitliliği ve literatüre olan katkıları akademik bir yaklaşımla değerlendirilmektedir. Bu çerçevede, klasik ve modern dönem arasında bir köprü kurularak klasik ve 20. yüzyıl Kur'ân ilimlerinin karakteristik özellikleri tespit edilmektedir."
