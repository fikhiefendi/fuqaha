abstract: "İslam'da faiz ve buna bağlı gelirlerin haram olması sonucunda, İslami tasarrufların değerlendirilmesi için geleneksel finans sitemine paralel olarak İslami yasakları göz önüne alan İslami finans piyasası gelişmiştir. İslami finans piyasasındaki finans araçlarında temel mantık faizsiz gelir elde etmektir. Her geçen gün gelişen İslami finans piyasalarında kullanılan finansman araçları mudarebe, müşarake, murabaha, icare, selem, istisna ve sukuk gibi farklı türlerde olabilmekle beraber en sık kullanılan İslami finansman aracı sukuk olarak karşımıza çıkmaktadır. Sukuk, temel olarak malın sahipliğini gösteren bir belge olarak nitelendirilmektedir. Sukuk ile varlıklar üzerinde mülkiyet hakkı elde edilmekte ve bu hak üzerinden gelir elde edilmektedir. Dünyada alternatif bir finans modeli olarak piyasadaki yerini alan sukukun ülkemizdeki kullanımında son yıllarda artış görülmektedir. Çalışmanın amacı sukuk hakkında bilgi vermenin yanında Türkiye ve dünyada sukuk uygulamalarını ortaya koymak, eleştirel olarak ele almak ve fıkhi açıdan sukuku incelemektir. Çalışma kapsamında İslami finansman araçlarından sukuk, türleri ve tarihçesi hakkında bilgi verilmiş, sukuk piyasasının dünya ve Türkiye'de gelişimi araştırılmış ve sukukun fıkhi boyutu ele alınmıştır. Çalışmalarla ortaya çıkan sonuçlarda araştırmacılar ve finans birimi yöneticileri için bilgiler sunulmaktadır."
