abstract: "“Şark Medreselerinde Şâfiî Fıkhının Öğretimi (Bitlis Örneği)”isimli bu tezimiz bir giriş ile dört bölümden meydana gelmektedir. Giriş bölümü konunun amacı, önemi, yöntemi, literatürü ve sınırlılıklarından oluşmaktadır. Birinci bölümde Şâfiî mezhebinin kurucu imamı olan Muhammed b. İdris eşŞâfiî'nin ilmi hayatı ele alındıktan sonra Şâfiî mezhebinin karakteristik özelliği ele alınacaktır. Son olarak da Şafiî mezhebinin Türkiye'deki dağılımı üzerinde durulacaktır. İkinci bölümde medresenin tanımı yapılarak sırasıyala Selçuklu, Osmanlı ve Şark medreselerinin tarihi serüveni üzerinde durulacaktır. Daha sonra Şark medreselerinde okutulan ilimler ve ders kitapları ele alınacaktır. Üçüncü bölümde Bitlis vilayetinin tarihi ele alındıktan sonra Bitlis vilayetinde geçmişten günümüze yapı olarak ulaşan İhlâsiye, Yusufiye, Şerefiyye ve İdrisiye medreseleri tarihsel ve yapısal olarak ele alınacaktır. Daha sonra Şark medreselerinin devamı mahiyetinde olup günümüzde eğitim öğretim faliyetine devam eden Norşin, Ohin, Ravza (İbadullah Camii) ve Medine Câmii medreselerinin geçmişten günümüze intikal serüvenleri ele alınacaktır. Dördüncü bölümde Bitlis medreselerinde Şâfiî fıkhının öğretiminde başvurulan kaynak kitaplar“Ğâyetü'l-İhtisâr, Hâşiyetü'l-Bâcurî 'alâ İbn Kâsım el-Gazzî, Fethu'l-Mu'in bi Şerhi Kurretü'l-Ayn bi Mühimmati'd-Din, Minhâcüt-Tâlibîn, Muğni'l-Muhtâc ilâ Ma'rifeti Me'ânî Elfâzi'l–Minhâc, Nihâyetü'l-Muhtâc ilâ Şerhi'l- Minhâc, Tuhfetü'l-Muhtâc bi-Şerhi'l-Minhâc, el-Envâr li A'mâli'l-Ebrâr, el-Vecîz fî Usûli'l-Fıkh ve Cem'u'l-Cevâmi' fî Usûli'l-Fıkh”ve Şâfiî fıkhının dışında okutulan fıkıh kitaları üzerinde durulacaktır. Daha sonra Bitlis medreselerinde Şâfiî fıkhının öğretiminde takip edilen metotlar ve bu medreselerde fıkıhla ilgili kullanılan kavramlar üzerinde durulacaktır. Bitlis medreselerinde Şâfiî fıkhının öğreniminde başvurulan kaynakların ve takip edilen metotların Şâfiî mezhebinin öğretimi hususundaki başarılarını böylece ortaya koymaya çalışacağız."
