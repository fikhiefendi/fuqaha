abstract: "Faiz, bütün semavi dinlerde yasaklanmış bir olgudur. Buna bağlı olarak inançlı insanlar, ekonomik düzende faizli işlemlere alternatif sistem arayışına girmişlerdir. Modern anlamda faizsiz bankacılık fikri 1960'larda Mısır ve Pakistan'da ortaya çıkmıştır. 1970'li yıllardan itibaren faizsiz bankacılık adımları atılmaya başlamıştır. Dünyada İslami bankacılık veya faizsiz bankacılık olarak nitelendirilen sisteme ülkemizde katılım bankacılığı denmektedir. Bu bankalar, 1984 yılında ülkemizde Özel Finans Kurumları adı altında faaliyet göstermeye başlamışlar ve 2005 yılından itibaren katılım bankaları adını almışlardır. Katılım bankaları, faizsiz çalışma esaslarına dayalı olarak kar ve zarara katılma esasına göre fon toplama ve kullandırma yöntemleri geliştirmişlerdir. Başlangıçta sadece Müslüman nüfusun yüksek olduğu ülkelerde faaliyete geçen faizsiz bankacılık uygulamaları, günümüzde dünya genelinde birçok ülkede önemini artırmış ve faaliyete başlamıştır. Bu çalışmada, katılım bankacılığının dünyada ve Türkiye'de nasıl bir gelişim gösterdiği incelenmiş, bu bankaların faizsiz çerçevede hangi fon toplama ve kullandırma yöntemlerini kullanarak faaliyet gösterdiği ifade edilmiştir. Buna bağlı olarak ülkemizde her geçen gün adından daha fazla söz ettiren katılım bankacılığının, ülke ekonomimize hangi konularda ne derece katkı sunduğu incelenmiştir. Katılım bankacılığının diğer ülkelerdeki faizsiz bankacılık çalışmalarıyla mukayesesi grafiklerle gösterilmiş, dünya ekonomisine neler vadettiği irdelenmiştir."
