abstract: "En genel anlamıyla ?belge düzenleme esaslarını inceleyen ilim? olarak tanımlayabileceğimiz şurût ilmi, İslam yargı hukukunun bir dalıdır. Hakların korunmasında önemli bir işlevi olan hukukî işlemlerin yazıya geçirilmesi, Kur'an-ı Kerim'de tavsiye edilmiş ve gerek Hz. Peygamber, gerekse sahabe tarafından uygulanmıştır. Söz konusu uygulama gelişerek hicrî üçüncü yüzyılın başında müstakil bir ilim haline gelmiş ve zamanla bu alanda geniş bir literatür oluşmuştur. Özellikle Endülüslü fıkıhçılar, hem uygulamada hem de doktrinde şurût ilmine büyük önem vermişlerdir. Bu konuda Endülüs'te pek çok eser yazılmıştır.Şurût ilmi, İslam hukuk teorisi ile pratiği arasındaki ilişkinin incelenebileceği malzemeyi barındırması sebebiyle Batılı araştırmacıların da ilgisini çekmiş, çeşitli incelemelere konu olmuştur.Bu çalışmada, genelde şurût ilminin mahiyeti, konusu, tarihçesi ve literatürü hakkında bilgi verilmiş, özelde ise Endülüs'te şurût ilminin konumu ve literatürü incelenmiştir."
