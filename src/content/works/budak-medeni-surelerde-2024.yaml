abstract: "İslam'ın sosyal ve ekonomik prensiplerini anlamak ve uygulamak için Kur'an'ın Medenî Sûre'lerinde yer alan infak ve zekât ile ilgili âyetlerin incelenmesi oldukça önemlidir. Bu nedenle bu tez çalışmasında Medenî Sûre'lerde yer alan infak ve zekât ile ilgili literatürler incelenip derlenmiştir. Bu bağlamda öncelikle çalışmanın giriş bölümünde araştırmanın konusu, önemi, amacı, kapsamı, sınırlılıkları ve yöntemi ile ilgili konular ele alınmıştır. Tezin birinci bölümünde 'infak', 'zekât' ve bunlar ile birlikte bu kelimelerin anlam çerçevesi içine giren 'sadaka' ve 'afv' kelimeleri kavramsal olarak incelenip açıklanmıştır. Ayrıca Mekkî sûrelerde geçen infak ve zekât lafızları da incelenip verilmiştir. Bununla beraber Medenî sûrelerin tespitinin nasıl yapıldığı ortaya konularak hicret öncesi Medine'deki sosyo-ekonomik durum ile ilgili literatürler incelenmiş ve tezde verilmiştir. Tezin ikinci bölümünde Medenî Suûrelerde infak kelimesinin geçtiği âyeti kerimeler kategorize edilip ilk dönem, orta dönem ve son dönem tefsirler çerçevesinde açıklanırken üçüncü bölümünde ise Medenî Sûrelerde zekât kelimesinin geçtiği âyeti kerimeler hitap zümresi çerçevesinde kategorize edilip ilk, orta ve son dönem tefsirlerine göre açıklanmıştır. Sonuç kısmında ise Mekkî Sûrelerde zekât ve infak ile Medenî sûrelerde zekât ve infak kısaca karşılaştırılmıştır."
