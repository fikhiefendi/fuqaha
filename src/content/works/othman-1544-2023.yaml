abstract: "Bu tez, Şeyh Şemseddin el-Kuhistânî'nin (ö. 950/1544) kitabının tahkik ve değerlendirilmesini amaçlamaktadır. Hicri 10. asır âlimlerinden olup Hanefi mezhebi fakihlerinden biridir. Müellif ismini tam olarak zikretmese de kitabına“Câmiu'l-mebânî Şerh-i Fıkhi'l-Keydânî”adını verdiği anlaşılmaktadır. Bu kitab namazın rükünleri, şartları, şekilleri ve kısımları dahil olmak üzere, namazla ilgili tüm konuların delilleriyle birlikte topladığı şerhidir. Hanefî fakihlerin, bir kısmı mevcut el yazması olan veya kaybolmuş kaynaklarından nakledilen pek çok görüşe yer vermektedir. Kitabın tahkikinde el yazması üç nüsha esas alınmıştır: İstanbul'daki Nuruosmaniye Kütüphanesi nüshası, Süleymaniye Kütüphanesi nüshası ve Fatih Kütüphanesi nüshası. Bu çalışmada İmam el-Keydânî ve Allame el-Kuhistânî'nin hayatı ve ilmi yönü tarihi kaynaklardan araştırılmıştır. El yazması nüshalar mukayese edilerek tahkik edilmiştir. Nüshalar arasındaki farklar, –kaynaklara dayandırılmak suretiyle– sözlerin tahrici ve metinde yer alan nasslarla birlikte dipnotta zikredilmiştir. Çalışmanın ulaştığı en önemli sonuçlardan biri, Keydânî'nin namaz hakkındaki mukaddimesinin Hanefi fıkhında yazılmış en önemli kısa metinlerden biri olduğudur. Bu eserin pek çok şerhi vardır. Bu şerhlerden birisi, biyografik kitaplarının da ifade ettiği gibi Keydânî'nin mukaddimesinin en iyi ve en kapsamlı şerhi kabul edilen Kuhistânî'nin şerhidir. Kuhistânî, alıntı yaptığı kitapların ve alimlerin isimlerini zikrettiği için, nakil ve kaynak göstermedeki hassasiyetiyle öne çıkmaktadır. Kaynak olarak İbn Mâzze'nin el-Muhîtu'l-burhânî, Serahsî'nin el-Mebsût, Bedruddîn el-'Aynî'nin el-Binâye fî şerhi'l-Hidâye gibi Hanefî fıkhının en temel kitaplarına dayanmaktadır. İmam el-Kuhistânî, ele aldığı konuların Kur'an ve Sünnet'ten delillerini aktarıp, delillerin tamamını belirtmeksizin sadece şahitlik yönünü zikrederek konuyu genişletmiştir. Kitap, (şerhe büyük bir ilmi değer katan) yazarın ilmi kişiliğini ve müstakil eserler ve şerhler olmak üzere Hanefi fıkıh kitaplarının çoğu hakkındaki geniş bilgisini yansıtmakta, aynı şekilde Şâfii gibi diğer mezhepler hakkındaki birikimini de ortaya koymaktadır. Kuhistânî, Keydânî'nin metnini sadece şerh etmemekte, bilakis konuyla ilgili iyi bir araştırma yapmakta ve fikri bağımsızlığını gösterecek şekilde Keydânî'nin sözlerine (anlamsal veya lafzî olarak) itiraz etmekte ve tartışmaktadır."
