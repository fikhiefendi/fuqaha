abstract: "103ÖZETTaklid, başkasının fikrini delilsiz olarak kabul etmektir. Tarihsel sürecebaktığımızda İslam Hukuk Tarihinde taklid düşüncesinin ne zaman ortayaçıktığı tartışmalıdır. Hz. Peygamber ve Hulafâ-yi Raşidin dönemlerinde böylebir düşünceden söz edemeyiz. Fakat hicri dördüncü yüzyıldan sonra, İslamcoğrafyasının siyasal bölünmesiyle, hukukçuların mezhebçilik düşüncesiylekendilerinden önceki liderlerine bağlılıkları ve onların bütün problemlerinçözümlerini bulduklarına inanarak icithad faaliyetlerinden vazgeçmeleri,taklidin kurumsallaşarak taassuba dönüşmesinde etkili olmuştur.İkinci dünya savaşı sonrasında, Müslüman toplumların özgürlüklerini eldeetmiş olmaları her alanda olduğu gibi, hukuk alanında da yeniden biryapılanmanın gerekli olduğu inancını ortaya çıkardı. Taklid genel olarak dinûdüşünceyi etkiledi. Özel olarak ta hukuk düşüncesinin gelişimini olumsuzyönde etkiledi. Bu yüzden taklid düşüncesine karşı mücadele edildi veictihad faaliyeti tekrar hayata konulmaya çalışıldı."
