abstract: "Osmanlı ulemasından Fudayl Çelebi gibi bazı âlimler tazmin sorumluluğuyla ilgili özel eser kaleme almak suretiyle Hanefi literatürüne önemli katkılarda bulunmuştur. Aynı şekilde şeyhülislamlar da tazminle ilgili verdikleri fetvalarla Hanefi geleneğini sürdürmüşlerdir. Bu çalışmanın birinci bölümünde Osmanlı âlimlerinin eserlerine de atıf yapılarak Hanefilerin genel tazmin sorumluluğu itlâf üzerinde yoğunlaşmak suretiyle ortaya konulduktan sonra ikinci bölümde bu tazmin sorumluluğuyla ilgili olan üç konu ele alınacaktır. Tesebbüb halinde damânla ilgili seçilen bu üç konu, Hanefilerin genel tazmin sorumluluğundan nasıl ve neden ayrıldıklarını ortaya koymaya yöneliktir. Bu üç konudan birincisi olan siâye meselesi, tamamen Hanefilerin tazmin sorumluluğundan ayrılmalarını göstermesi açısından önemlidir. Diğer iki konuda ise tamamen Hanefiler tazmin sorumluluğunu terk etmemiş, sadece bazı meselelerde zaman içerisinde buna aykırı hükümler vermişlerdir. Ayrıca bu çalışmanın amacı, üç meseleyle ilgili 17. yy şeyhülislamlarının verdikleri fetvalarla, Hanefi geleneği ne ölçüde ve nasıl sürdürdükleri ve mezhep içerisinde tartışılan hangi görüşleri esas aldıklarını göstermeye yöneliktir."
