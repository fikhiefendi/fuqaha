abstract: "Bu çalışmanın amacı, İslami finansmanın en hızlı büyüyen alanı olan ve faizsiz finansmanın gelişimi açısından da büyük önem taşıyan sukukun yapılandırılmış, alternatif bir finansman aracı olarak kamu ve özel proje finansmanında kullanımına ilişkin ilkeler ve yapılar ile pratik işlemsel konuların incelenmesidir. Bu amaçla, konuyla ilgili literatür ve mevzuat taraması yapılmış, genelde İslami finansman, özelde ise sukuk uygulamasının gelişimi incelenmiş ve uluslararası uygulamalar çerçevesinde, Türkiye mali piyasaları açısından proje finansmanı amacıyla sukuk uygulamasının etkinliği değerlendirilmiştir. Genişleyen varlık tabanı, güçlü performansı, ağırlıklı olarak dini hassasiyete sahip yatırımcıların ötesinde tüm yatırımcılar nezdinde öneminin artması, yeni ve mevcut pazarlarda faizsiz sigortacılık sisteminin artan potansiyeli, İslami fon yönetimi endüstrisinin güçlü potansiyeli ve kapsamlı İslami finansal altyapının gelişimi gibi bazı önemli gelişmeler neticesinde, küresel finansal sistemde faizsiz finansmanın önemi giderek artmaktadır. Proje finansmanının da faizsiz finansman kavramına ve felsefesine oldukça uygun bir fon kullanım alanı olduğu gerçeği düşünüldüğünde, kalkınma hedefleri ve makro ekonomik dengeler çerçevesinde, ihtiyaç duyulan finansman kaynaklarının çeşitlendirilmesi ve alternatif finansman kaynaklarına ve ürünlerine imkân tanınması amacıyla sukuk ya da kira sertifikası ihracının büyük önem arz ettiği düşünülmektedir. Konuya ilişkin yasal altyapının tamamlanması ve belirsizliklerin de ortadan kalkmasıyla önümüzdeki dönemde uluslararası piyasalara paralel olarak Türkiye mali piyasalarında da sukukun öneminin artması beklenmektedir."
