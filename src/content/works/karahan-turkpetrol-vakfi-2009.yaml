abstract: "Türk sanatının gelişmesi ve Türk sanat eserlerinin korunmasını esas gâye edinmiş olan Türkpetrol Vakfı, 1969'da A. Aydın Bolak'ın (1925?2004) girişimleri ile kurulmuş, 1978 senesinden îtibâren koleksiyonunu oluşturmaya başlamıştır. Türkpetrol Vakfı Koleksiyonu'ndaki Yazma Eserler ve Yazı Âletleri başlıklı tezimiz, beş ana bölümden oluşmaktadır. İlk üç bölümde, hat, tezhip, cild sanatı ve bu sanatlarda kullanılan âlet ve malzemeler ile ilgili genel bilgiler verilmiştir. IV. bölümde, koleksiyonda eseri olan ve adını belirleyebildiğimiz sanatkârlarla ilgili biyografik yazılara yer verilmiştir. V. Bölüm, katalog çalışmamızı içermektedir. Türkpetrol Vakfı Yazma Eser Koleksiyonu'nda; 71 aded eser vardır. Bunlardan 64 adedi kitap, 7 adedi murakkaadır. Kitaplar bölümünde 33 aded mushaf, 9 aded Kur'ân-ı Kerîm'den bâzı sûreler içeren kitaplar, 5 aded duâ mecmûası, 4 aded vakfiye, 2 aded Delâil-i Şerîf, 2 aded Fetvâ Mecmûası, 1 aded mushaf sayfası, 1 aded Mesnevî-i Şerîf, 1 aded Hümâyunnâme, 1 aded Bostân, 1 aded Gülistân, 1 aded K?dirî Evrâdı, 1 aded Muhammediye, 1 aded Kıraat İcâzetnâmesi vardır. Murakkaalar bölümünde 4 aded düz murakaa, 3 aded körüklü murakkaa mevcuttur. Türkpetrol Vakfı Koleksiyonu'ndaki Cildler ve Kitap Mahfazaları Kataloğu'nda 5 aded kitap kabı, 9 aded kitap mahfazası, 2 aded murakkaa kutusu ve 1 aded murakkaa kabı; Yazı Âletleri ve Cild Kalıpları Kataloğu'nda 108 aded yazı âlet ve malzemesi, 162 aded cild bezeme sanatında kullanılan âlet ve malzeme; Muhtelif Eserler Kataloğu'nda 1 aded ruganî tezhipli yay, 1 aded şemse cüzdan ve Hattat Sâmi Efendi'ye (1838?1912) âit ince marangozluk âletleri ve sigara takımı incelenmiştir. Bu çalışmada, tez konumuzun sınırları içinde olan eserler tek tek incelenmiş, eb'adı, ait oldukları dönem, imzâları okunabilenlerin sanatkârları, belirlenmiştir. Yazma eserler sayfa sayfa incelenmiş, istinsah yeri ve tarihi, varsa müellifi, dili, yazı cinsi, satır/sütun sayısı, varak sayısı, kâğıt ve mürekkep cinsi, bezemeli sayfaları tesbit edilmiştir. Bezemelerin yapıldıkları dönem, motif, desen ve renk anlayışı, kullanılan teknikler belirlenip değerlendirilmiştir. Kitap kaplarının malzemesi, bezemelerinde kullanılan teknikler de tesbit edilmiştir. Sonuç, kaynakça, fotoğraf listesi ve kısaltmalar, tezin en sonunda yer almaktadır."
