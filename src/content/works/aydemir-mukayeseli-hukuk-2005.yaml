abstract: "Ill ÖZET YÜKSEK LİSANS TEZİ MUKAYESELİ HUKUK AÇISINDAN HAVA PARASI ŞAHİN AYDEMİR Danışman: Prof. Dr. Beşir GÖZÜBENLİ 2005-Sayfa: VH+56=63 Jüri : Prof. Dr. Beşir GÖZÜBENLİ Prof. Dr. Davut YAYLALI Doç. Dr. Mustafa TİFTİK Günümüz ticari hayatında fiilen önemli bir yer işgal eden hava parasının İslam hukuku açısından da incelenmesinin faydalı olacağı kanaatindeyiz. Hava parası, İslam hukuku kaynaklarında genellikle“hulüv”terimi ile ifade edilmektedir. Pozitif hukukta yasaklanmış olan hava parası, İslam hukukunda ise, meşruiyeti asırlardır tartışılan bir konudur. Bu çalışmamızda, değişik uygulama şekilleri olan hava parası işleminin, şartlan oluşunca bir hak karşılığı olacağından genelde uygun görüldüğünü, şartlar gerçekleşmeyince, haksız ve sebepsiz bir kazanç olacağından uygun görülemeyeceğini tespit etmiş bulunmaktayız."
