abstract: "ÖZET Kur'an'ın ilahi son kitap olması ve bundan 1400 yıl önce inmiş olması beraberinde bazı sorulanda gündeme getirmiştir. Acaba her geçen gün biraz daha değişen toplumun şartlarına Kur'an nasıl uyum sağlayacaktır. Bizde biliyoruzki her gün yeni yeni problemler ve meseleler ortaya çıkmaktadır. Biz de bunun cevabını bulabilmek için (Kur'an Ahkamının Değişim Meselesi) adlı tezimizi hazırladık. Bu tezimiz; bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde, Kur'an'ın Hükümleri hakkında özet bir bilgi verdik. İkinci bölümde ise meseleyi“ Fıkıh Usulü”açısından ele aldık ve değişken olan ve olmayan hükümleri inceledik. İkinci bölümde ise, değişim hakkındaki farklı görüşleri zikrettik. Ve bunların içerisinden n uygun ve sağlam olanını tercih ettik. Üçüncü bölümde ise günümüzde değişilirliği tartışma konusu olan hükümleri inceledik. Bunlarda; Kadının Şehadeti, Kadının Miras Durumu, Hicab, İslam Ceza Hukuku v.b. gibi konulardır. Bunları delilleriyle birlikte inceledikten sonra, bu hükümlerin zamanın değişmesi ile birlikte değişmeyen hükümlerden olduğunu ortya koyduk. Çalışmamızı bir sonuç bölümü şle tamamladık. Burada da varmış olduğumuz neticeleri zikrettik."
