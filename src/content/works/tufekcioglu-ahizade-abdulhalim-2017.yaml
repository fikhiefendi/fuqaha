abstract: "Tahkikini yaptığımız eser, 16. Yüzyıl Osmanlı hukukunun, İslam hukukunu davalar konusunda ne kadar yansıttığını ortaya koyması açısından önemlidir. İlk bölümde, kaza faaliyetinde aktif rol oynamış bir fakih olan Ahizade Abdülhalim Efendi'nin hayatı ve eserleri anlatılmıştır. İkinci bölümde risalenin temel özellikleri ve muhtevası incelenmiş, üçüncü bölümde ise tahkiki yapılan eserin metni verilmiştir."
