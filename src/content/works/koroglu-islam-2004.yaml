abstract: "V ÖZET DOKTORA TEZİ İSLAM CEZA HUKUKUNDA ÖLÜM CEZASI VE İNFAZ USULLERİ Mehmet KÖROĞLU Danışman: Prof. Dr. Hamza AKTAN 2004-SAYFA : LX + 93 Jüri : Prof. Dr. Hamza AKTAN Prof. Dr. Beşir GÖZÜBENLİ Prof. Dr. Şamil DAĞCI İnsan sosyal bir varlıktır. Hayatını sürdürebilmek için başkaları ile ilişki kurma ihtiyacı onu toplu yaşamaya mecbur kılar. Toplu yaşamın doğal sonucu olarak kişiler arasında olumsuz bir takım ilişkilerin ve çıkar çatışmasının olması kaçınılmazdır. Bireyler arasındaki anlaşmazlık ve menfaat çatışmaları kişilerin birbirlerini öldürmelerine neden olabilecek bir boyut kazanabilir. İlk insan toplumundan bugüne, bütün dinler ve hukuk sistemleri, hatta örf - adetler/töreler cana kasta kadar varabilen suçlan önlemek üzere bir kısım cezai yaptırımlar getirmiştir. Ölüm cezası bu yaptırımlardan biri ve en ağındır. İslam dininde bu suça karşı cezai yaptırım olarak kısas hükmü konulmuştur. Kuran ve Hz. Peygamber'in sözleri ve uygulamalan kısası, suça denk/misil bir ceza olarak vazetmiştir. Ancak bu cezanın uygulamasını, öldürülen kişinin mirasçılarının isteğine bırakmıştır. Mirasçılar katil hakkında kısas talep edebilecekleri gibi, kısastan vazgeçip diyet de isteyebilirler. Hatta diyetten de vazgeçip katili affedebilirler. Böylece katil ile maktulün mirasçılan arasında düşmanlık duygularının giderilmesinin amaçlanmış olduğu söylenebilir. Velilerin kısas istemeleri durumunda, kısas cezası kazai kararın eklenmesi suretiyle yetkili organlarca infaz edilir. Kısasın infazında, insan onurunu rencide etmeyecek bir yöntem uygulanmasına özen gösterilir."
