abstract: "Bu tezde Hanefi usülcüler'in bir tenkit kriteri olarak geliştirdikleri umûmü'lbelvâ prensibi ve bu prensibi temel alarak amel etmedikleri rivayetler fıkhı açıdan değerlendirilmiştir. Bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın önemi, konusu, yöntemi, sınırı ve araştırmanın kaynakları verilmiştir. Birinci bölümde umûmü'l-belvâ kavramıı, umûmü'l-belvâya götüren sebepler, meşru olması, umûmü'l-belvânın şartları, ayrıca Hanefilerin umûmü'l-belvâyı kabul etmelerinin gerekçeleri, bu konuda dğer usulcülerin görüşleri ve Hanefilere yöneltilen eleştiriler ve bu eleştirilere verilen cevaplar yer almaktadır. Ikinci bölümde ise umûmü'l-belvâ prensibinden dolayı reddedilen rivayetler araştırılmış ve bunların fıkhi açıdan değerlendirilmesi çalışılmıştır. Rivayetlerin mezhep imamları tarafından kabul görünüp görülmeme dürümlarını gerekçeleri ile ele alınmıştır. Sonuç kısmında ise araştırma sürecinde elde edilen bilgiler ve tespitler özet olarak değerlendirilmiştir."
