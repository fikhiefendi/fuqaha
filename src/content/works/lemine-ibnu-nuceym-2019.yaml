abstract: "Bu araştırma, hicri 926-970 yılları arasında Mısır'da yaşamış ünlü bilgin Zeyn İbn Nüceym el-Hanefî'nin Lübbü'l-usûl adlı eserinin tahkik ve incelemesidir. İbn Nüceym Mısır'da doğmuş, hayatının tamamını da Mısır'da ve özellikle de“beldemiz”diye andığı Kahire'de geçirmiş, hem Mısır'ın yerli hocalarından hem de oraya dışarıdan gelen hocalardan ilim tahsil etmiştir. İbn Nüceym, zamanının Hanefi fakihleri arasında önde gelenlerden biri olarak kabul edilir. Ayrıca müellif, Hanefi mezhebinde el-Eşbâh ve'n-nezâ'ir türünde eser veren yazarların en tanınmış olanıdır. Bu araştırmanın konusu olan Lübbü'l-usûl adlı eser, ünlü Hanefi bilgini İbnü'l-Hümâm'a ait Hanefi ve Şafii usullerini bir araya getiren et-Tahrîr adlı fıkıh usulü eserinin muhtasarıdır. Bu muhtasar eser, bazı özellikleriyle öne çıkmaktadır. Bu özelliklerden bazıları şunlardır: Bu eser, İbnü'l-Hümâm ve İbn Nüceym gibi iki büyük âlimin çalışmalarını bir araya getirmektedir. İbn Nüceym bu eserinde genel olarak Hanefi usulünü yer vermekle yetinmiştir. Eserin aslı Şafii usulüne göre tertip edilmişken bu muhtasar hali Hanefi usulüne göre tertip edilmiştir. Bu eser, önce üzerinde ittifak edilmiş şer'î delilleri ayrıntılı bir şekilde ele almakta, sonra ihtilaflı delilleri zikretmekte ve bazı dilsel konuları da buna ilave etmektedir. Bu araştırma iki kısımdan oluşmaktadır. Birinci kısım, müellifin hayatını ayrıntılı bir şekilde ele alan bir incelemedir. Bu kısımda müellifin adı, nesebi, doğup büyüdüğü ortam, hocaları, zahitliği, ilmi kişiliği, öğrencileri, eserleri ve vefatı incelenmektedir. Ayrıca söz konusu muhtasar kitabın tanıtımı da yine bu kısımda ele alınmıştır. Bu kapsamda eserin adı, müellife nispeti, konusu, içeriği, önemi, kaynakları ve terimleri tanıtılmış, ayrıca bu eserin tahkikinde izlediğimiz yöntem ve bu esnada dayandığımız yazma eser nüshaları açıklanmıştır. İkinci kısım ise eserin tamamının tahkikinden oluşmaktadır. Bu tahkik, bütün farklılıklarda nüshalar arasında tercih yapma esasına dayanılarak oluşturulmuş, diğer farklılıklara dipnotlarda işaret edilmiştir. Tahkikte ayrıca zor ve kapalı kısımlar açıklanmış, nakillerin kaynakları verilmiş, hadis ve diğer rivayetlerin kaynaklardaki yerleri gösterilmiş, eserde geçen kişiler, mekânlar ve fırkalar tanıtılmış, eserdeki bağlam ve taksimatın açıkça görülebilmesi için başlıklar oluşturulmuş, en son da kaynakçaya ve fihriste yer verilmiştir."
