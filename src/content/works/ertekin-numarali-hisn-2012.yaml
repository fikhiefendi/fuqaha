abstract: "Osmanlı Devleti'nin en önemli yargı organı Şer`i Mahkemelerdir. Devletin muhtelif devirlerdeki hukukî, iktisadî, dinî, askerî ve idarî müesseseleri hakkında çok değerli bilgiler bu mahkemelerin defterlerinde bulunmaktadır. Bu belgeler din, dil, renk farkı gözetmeksizin bütün teb`a ile ilgili olayları ve bu olayları ilgilendiren mahkeme kararlarını ve idari düzenlemeleri ihtiva etmektedir.Bu çalışma 282 numaralı Hısn-ı Mansûr (Adıyaman) H. 1315/1316 M.1898/1899 Şer`iyye Sicilidir. Çalışmamızın başında Osmanlı hukuk sistemi ve Şer`iyye Sicillerinin tanımı, ortaya çıkışı, tarihi gelişimi, Şer`iyye Sicillerinin önemi ile 282 numaralı Adıyaman Şer`iyye Sicilini ana hatlarıyla ele alarak izah etmeye çalıştık.Çalışma da toplam 114 belgenin içerisinde darp, cerh, hırsızlık, ziraat ürünlerinin tahrip edilmesi, haneye tecavüz gibi konular bulunmaktadır. Bu davaların mahkemeye intikali ve mahkemenin nasıl karar verdiğini işlemektedir."
