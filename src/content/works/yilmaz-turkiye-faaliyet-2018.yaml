abstract: "Finansal sistem içindeki tasarruf sahipleri ve yatırımcılar arasında finansal aracılık fonksiyonunu üstlenen bankaların etkinlik düzeyleri, hem banka hissedarları ve diğer paydaşları hem de ülkenin sanayileşmesi ve ekonomik büyümesi için büyük önem taşımaktadır. Bu çalışmada Türk bankacılık sektöründe faaliyette bulunan 21 ticari ve 3 katılım bankasının 2010-2015 yıllarına ilişkin ekonomik girdi ve çıktı göstergeleri kullanılarak bankaların etkinliklerinin incelenmesi ve banka grupları bazında etkinliklerin karşılaştırılması amaçlanmıştır. Etkinlik ölçüm yöntemi olan Veri Zarflama Analizi (VZA) kullanıldığı çalışmada ekonomik girdi olarak mevduat (toplanan fonlar), özsermaye ve faiz dışı gider (kâr payı dışı gider) rasyoları; ekonomik çıktı olarak ise kredi ve alacaklar ile net faiz geliri (net kâr payı geliri) rasyoları kullanılmıştır. CCR etkinlik analizleri dikkate alındığında ticari bankalardan Alternatif Bank, Fibabank, ING Bank ve Ziraat Bankası genel olarak 6 yıllık dönemde etkin bulunurken, katılım bankalarından sadece Albaraka Türk 2010, 2014 ve 2015 yıllarında etkin bulunmuştur. Analiz sonuçları BCC etkinlik analizleri açısından değerlendirildiğinde ise Citibank ve HSBC bankaları dışında diğer tüm ticari bankalar en az bir yılda etkin bulunurken, katılım bankalarının etkinliğinde gözle görülür bir artış gözlenmiştir."
