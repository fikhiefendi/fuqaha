abstract: "İmam Mâtürîdî'nin kaleme aldığı kaydedilen usul eserleri günümüze kadar ulaşmamıştır. Ancak farklı disiplinlere dair zengin malzeme içeren tefsiri Te'vîlâtü'l-Kur'ân, fıkıh usulü açısından da çok önemli bir kaynaktır. İmam Mâtürîdî'nin bu eserinde kullandığı kavramlar ve tartıştığı meseleler usûl-i fıkhın orijinine ve kaynaklarına dair önemli veriler sağlayacak niteliktedir. Bu bakımdan fıkıh usulü tarihinin teşekkül döneminde yaşayan İmam Mâtürîdî'nin ilgilendiği fıkıh usulünün temel meselelerinden üç tanesi; beyan teorisi, nasların dilinin Allah'ın muradını ifade etmede taşıdığı hüccet değeri ve lafızların delaletiyle ilgili görüşleri bu çalışmada incelenecektir. İmam Mâtürîdî'nin dilin hüccet oluşu ve delaletiyle ilgili görüşlerinin ortaya koyulması, Mâverâünnehir'de gelişen erken dönem Hanefî usul düşüncesinin temel özelliklerini, etkin gruplarını ve tartışmalarını tespit etme ve bu dönemde hükümler ile naslar arasındaki bağlantının nasıl kurulduğunu göstermesi açısından büyük bir önem arz etmektedir."
