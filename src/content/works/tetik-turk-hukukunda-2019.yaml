abstract: "Kişiler bir devletin çatısı altında yaşayabilmek için bazı külfetlere katlanmak zorundadırlar. Bu külfetler vatandaş olmanın sağladığı nimetlerin karşılığını oluşturur. Bir düzen dahilinde güven içinde yaşama ve hizmetlerden faydalanma bu nimetlerin en temel olanlarıdır. Hayatın neredeyse her alanında geçerli bir kural haline geldiği gibi her menfaatin karşılığında bir külfet bulunmaktadır. Mecellenin 88. maddesinde ifade edildiği üzere“Külfet nimete ve nimet külfete göredir”. Hukuk devletinde, vatandaşlar arasında nimetler yönünden herhangi bir ayrım yapılamayacağı gibi katlanılan külfetler açısından da ayrım yapılamaz. Öğreti ve içtihatlarda kamu külfetleri karşısında eşitlik olarak formülleştirilen ilkenin uygulandığı alanlar incelendiğinde, ilkeye en fazla bayındırlık hizmetleri nedeniyle meydana gelen zararların tazmini konusunda başvurulduğu görülmektedir. Bununla birlikte bayındırlık hizmetleri haricinde sunulan diğer kamu hizmetlerinin doğal bir sonucu olarak meydana gelen zararlar ile hukuka uygun olarak tesis edilen idari işlemlerden dolayı meydana gelen özel ve olağan dışı zararların da, idari yargı mercileri tarafından ilke kapsamında tazmin edilmesine karar verildiği görülmektedir. İlke kapsamında tazmin edilecek zararların birel işlemden ya da düzenleyici işlemden kaynaklanmasının ise bir önemi bulunmamaktadır. Diğer bir ifadeyle hukuka uygun düzenleyici işlemlerden kaynaklanan özel ve olağan dışı zararlar da ilke kapsamında tazmin edilecektir. Bir adım daha ileri gidildiğinde ise günümüzde, kanunların uygulanmasından ve akdedilen milletlerarası andlaşmalardan dolayı devletin sorumluluğunun öğretide kabul edildiği ve bu alanda devletin sorumluluğu konusunun kamu külfetleri karşısında eşitlik ilkesiyle izah edildiği görülmektedir."
