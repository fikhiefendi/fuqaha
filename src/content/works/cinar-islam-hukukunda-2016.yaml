abstract: "Tez, Giriş (“İçerik ve Yöntem”), üç bölüm (Birinci Bölüm:“Mümeyyiz Kavramı ve Ehliyet Kavramı”, İkinci Bölüm:“Mümeyyiz Küçüğün İman ve İbâdet Yükümlülüğü”, Üçüncü Bölüm:“Mümeyyiz Küçüğün Hukuki Tasarrufları ve Ceza Hukukundaki Durumu”), Sonuç ve Bibliyografya'dan oluşmaktadır.Tezde ehliyet, ehliyetin çeşitleri, mümeyyiz küçüğün mahiyeti ve tasarrufları ele alınmıştır. Ehliyetin ve mümeyyizin mahiyeti, temyiz kudretinin tasarruflara etkisi ve bu tasarrufların hukukî sonuçları incelenmiştir. Temyiz kudretine sahip küçüğe izin verilmesiyle bâliğ gibi tam ehliyetli olduğu ve tasarruflarının büyük oranda geçerlilik kazandığı ortaya çıkmaktadır. Mezûn olmakla mümeyyiz küçüğün toplum hayatına daha iyi entegre olabileceği ve reşit olduktan sonraki döneme önceden hazırlanarak, sağlıklı bir birey olabileceği gözlemlenmiştir. Tezin birinci bölümünde ehliyetin mahiyeti ve çeşitleri üzerine İslam hukuku ve Medeni hukukça ortaya konulmuş tanım ve anlayışlar incelenmiştir. Ehliyetin kişilik hakları konusunda önemi ortaya konulmuş, mümeyyizin mahiyeti, küçüğün mümeyyizlik dönemi ve bu dönemin sınırları hakkında bilgi verilmiştir. İkinci bölümde mümeyyiz küçüğün iman ve ibadet konusunda tasarruflarının geçerliliği ve mükellef olup olmadığı incelenmiştir. Üçüncü bölümde ise mümeyyiz küçüğün aile, miras, borçlar hukuku alanındaki tasarruflarının geçerliliği ve ceza ehliyeti açısından durumu ortaya konulmuştur. Bunun yanı sıra mümeyyiz küçüğün ceza usûl hukuku açısından tasarrufları incelenmiştir."
