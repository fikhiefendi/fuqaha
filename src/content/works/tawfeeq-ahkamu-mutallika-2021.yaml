abstract: "Bu çalışmada, muasır bir problem olan estetik operasyonlara dair hükümler mukayeseli olarak inceleme konusu yapılmıştır. Çalışmada meşhur dört fıkıh mezhebi çerçevesinde İslam hukukunun bakış açısı ile günümüzdeki bazı Arap ve Batı ülkelerindeki kanuni düzenlemeler mukayeseli olarak ele almıştır. Çalışmamız üç bölüm halinde ele alınmıştır: Birinci bölümde öncelikle güzellik ameliyatlarının tarihi gelişimi ve günümüzde yaygınlaşmasının sebepleri üzerinde durulmuş, sonra ise İslam hukukçularının ve doktorların konuya dair terimleri açıklanmıştır. İkinci bölümde İslam hukukunun konuya bakışı ele alınmıştır. Burada İslam hukukçularının genel olarak tıbbi ameliyatlarla özel olarak ise güzellik ameliyatları ile ilgili görüşleri delilleri ile beraber incelenmiştir. Üçüncü bölümde ise güzellik ameliyatlarına dair kanuni düzenlemeler üzerinde durulmuştur. Bu bölümde öncelikle genel olarak tıbbi ameliyatın meşruiyet temelini teşkil eden nazariyelerden söz edilmiş daha sonra ise bazı çağdaş devletlerde bu konu ile ilgili kanuni düzenlemelere dikkat çekilmiştir. Ayrıca güzellik ameliyatlarında uyulması gereken ilkeler, görevler ve şartlar tespit edilmiştir. Çalışmamız araştırmanın sonuçları ve teklifleri ile son bulmaktadır."
