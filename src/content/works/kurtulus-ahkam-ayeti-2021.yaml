abstract: "İslâm düşüncesinde merkezî bir konumu haiz olan hüküm kavramı ile Kur'an-ı Kerim'in en küçük birimini ifade eden ayet terimlerinin bir araya gelmesi ile oluşan ahkâm ayeti kavramsallaştırması, -her ne kadar Kur'an'da yer alan her bir ayet itikâdî, amelî, ahlâkî vb. ilkelere mesnet teşkil edip hüküm ihtiva etse de- dinî ilimlerin müstakilleşmesi ile beraber hukuk alanının fıkıh ilmine özgülenmesi ve hüküm kavramının da hukukî veçhesinin baskın olması nedeniyle, doğrudan veya dolaylı olarak hukukî düzenleme içeren Kur'an nassını ifade eder hale gelmiştir. Teşrîde tedrîcilik, teklifte kolaylık, genel hükümlere ağırlık verme, maslahatı temel alma, birey-toplum ve dünya-ahiret dengesini gözetme ve evrensel tabiata sahip olma gibi özellikleri bünyesinde barındıran ahkâm ayetleri hem bizzat hukukî norm içermek hem de hukuk üretiminde kullanılan şer'î delillere veri temin etmek suretiyle fıkhî bilgiye kaynaklık etmişlerdir. Ahkâm ayetlerinin anlaşılması, analizi ve yorumlanması amacına matuf olarak meydana getirilen ahkâmu'l-Kur'an eserleri, Kur'an nassının hukuka dönük yüzünü açıklığa kavuşturma, mezhep görüşlerini temellendirme, kitap delilinin işlevselliğini vurgulayarak sâir şer'î delillerle münasebetini gösterme ve fıkhî hüküm istinbât etme bağlamında ahkâm ayetlerinin fukahâ nezdindeki epistemolojik değerini ortaya çıkarma gibi fonksiyonları da icra etmiştir. Bilhassa vahiy-hukuk irtibatının gözler önüne serilmesi noktasında önemli bir boşluğu dolduran fıkhî tefsirleri kaleme alan müellifler, tüm İslâmî ilimlerin birikimlerinden yararlanmakla beraber ahkâm ayetlerine ilişkin açıklamalarını, usûl-i fıkhın kendilerine temin ettiği teorik zemin üzerinde ve makâsıd-ı şerî'a ilkeleri çerçevesinde gerçekleştirmiştir."
