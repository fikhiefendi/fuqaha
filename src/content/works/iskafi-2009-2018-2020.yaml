abstract: "Bu çalışma Filistin İslam bankalarının performansını değerlendirmeyi amaçlıyor: Arap İslam Bankası ve Filistin İslam Bankası, 2009-2018 döneminin mali, ekonomik ve sosyal yönleri ve iki banka arasındaki yetkinliği eşit veya tercihe göre göstermek, Her iki banka için iki ayrı endeksin farklarını analiz etmek üzere T testini yaparak, istatistik programı SPSS dayalı olarak çalışmanın konusuyla ilgili göstergelerin ortalamasını hesaplayarak açıklayıcı istatistiksel analitik yaklaşımı kullanın. Çalışma, finansal açıdan birçok önemli sonuca ulaştı: Her Iki banka da her türlü mevduatı çekme becerisi açısından iyi bir pazarlama verimliliğine sahip ve bankacılık hizmetlerini müşterilere yakın bir şekilde yönetebiliyor ve pazarlayabiliyor, ayrıca, acil durum para çekme ve taahhütleri yerine getirme ile karşı karşıya kalabilecek iyi bir likidite pozisyonu ve bunun ekonomik açıdan da olduğu kanıtlanmıştır: Filistin İslami bankaları, Filistin bankacılık sektörünün toplam yüzdesi olarak hem mevduatlar, fonlar ve varlıklar için eşit verimlilikle iyi pazar payları elde edebilmiştir. Ve İslam bankalarının, kaynaklarını büyük oranda Murabaha satın alma emri formülüne ve sosyal açıdan kullanmalarına odaklandıkları ortaya koyuldu Çalışma, birkaç yıl içinde düşük kârlılık oranlarına yol açan ve gelecekte bu oranları tanıtan mevcut yatırım ve finansman politikalarının Yeniden Gözden Geçirilip Gözden Geçirilmesinin de aralarında bulunduğu bir dizi önemli öneriyi tamamladı. Yatırımların katılım, spekülasyon, pazarlık ve leasafiz gibi diğer İslami finans formüllerinin uygulanmasını etkinleştirme ve çeşitlendirme gibi yatırım formüllerine yönlendirilmesi tavsiye edilir. Çalışmada, teknolojik gelişmenin ve modern dijital bilgilerde akıllı sözleşmelerin mali kapsaymayı artırmak için İslami bankacılık ve finans hizmetlerinin sağlanmasında en üst düzeye çıkarılması tavsiye edildi."
