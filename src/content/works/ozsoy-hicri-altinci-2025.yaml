abstract: "Hanefî mezhebi, İslâm dünyasında geniş bir kabul görmüş ve dört büyük Sünnî mezhepten biri olarak tarihsel sürecini devam ettiren önemli bir fıkıh ekolüdür. Mezhebi sistematik bir yapıya kavuşturan İmam Ebû Hanîfe, hicrî II. asırda fıkıh alanında geliştirdiği yöntem ve görüşlerle önemli bir etki oluşturmuş, mezhebi zamanla İslâm dünyasında benimsenmiştir. Ancak, Hanefî mezhebi, hadisle ilgili yaklaşımı ve uygulamaları sebebiyle eleştirilere maruz kalmıştır. Özellikle ehl-i hadis anlayışının önde gelen temsilcileri tarafından, Hanefîler hadis ilminden uzak durmakla suçlanmış ve bu durum, mezhebin hadis ilmiyle olan ilişkisini zayıf bir noktada konumlandırmıştır. Oysa tarihsel süreç incelendiğinde, Hanefîlerin hadis ilmine dair önemli katkılarda bulunduğu ve bu alandan tamamen soyutlanmadığı anlaşılmaktadır. Bu çalışma, Hanefîlerin, hicrî VI. ve VII. asırlardan sonra hadis ilmine olan ilgilerinin arttığına dair görüşün aksine, onların hadis rivayeti, tedrisatı ve tasnif faaliyetlerine erken dönemde de önemli katkılar sunduklarını ortaya koymayı amaçlamakta ve özellikle Hanefîlerin hicrî VI. asra kadar hadis ilminde oynadıkları rolü incelemeyi hedeflemektedir. Bu bağlamda, elinizdeki çalışma vesilesiyle, Hanefîlerin hadis ilmiyle kurdukları güçlü ilişkileri, Hanefîlerin hadis ilminden bağımsız bir gelenek oluşturmadıkları, aksine bu ilimle sıkı bir bağ kurdukları, araştırmacılara sunulmuş olacaktır. Sonuç olarak, bu tez, Hanefî mezhebi hakkında mevcut algıların yeniden değerlendirilmesine katkı sağlamayı hedeflemekte ve onların hadisle ilişkisini doğru bir şekilde anlamamıza dair daha doğru bir perspektif kazanmamıza imkân sağlayacaktır."
