abstract: "Eyyûbî Devleti Mısır, Şam, Mezopotamya, Hicaz, Yemen ve Kuzey Afrika'da VI-VII. (XII-XIII) yüzyıllar arasında hüküm sürmüş bir devlettir. Tarih sahnesine çıktığı günden yıkılışına kadar; İslâm birliğini sağlamaya yönelik çabası ve Haçlılar'a karşı verdiği başarılı mücadelesi ile dikkat çekmiştir. Siyasî alandaki başarıları ilim ve kültür alanında da kendisini göstermiştir. Eyyûbî Devleti, fıkha ve fukahâya yaptıkları hizmetlerle fıkhın gelişmesine ve istikrar kazanmasına önemli katkılarda bulunmuştur. Bu çalışma, yaklaşık bir asır süren Eyyûbî hükümranlığı dönemindeki Mısır ve Şam coğrafyasında yaşayan fakihleri, onların fıkıh ilmine dair yazdıkları eserleri, fıkıh ilminin eğitim ve öğretiminin yapıldığı müesseseleri, bu müesseselerde okutulan ilimleri, bu dönemde yapılan ve fıkıh ilmini doğrudan ilgilendiren seyahatleri ve fakihlerin üstlendiği görevleri konu edinmiştir. Konuyla ilgili olduğu çerçevede dönemin fıkhî mezheplerinin genel durumu işlenmiş, mezheplerin birbirleriyle olan ilmî ve ictimâî münasebetleri, aralarındaki ilmî rekabet ve bu rekabetin topluma yansımaları da ele alınmıştır. Ayrıca bu dönemde görüşleri tartışılan fakihler ve fıkhî meselelerden öne çıkan bazı örnekler ele alınarak dönemin fıkıh anlayışına ve hareketliliğine dair bir çerçeve çizilmeye çalışılmıştır. Dönemin fıkıh literatürünün özellikleri klasik ve modern çalışmalar ışığında incelenerek fıkıh ilminin gelişimi üzerinde nasıl bir etki icra ettikleri aydınlatılmıştır."
