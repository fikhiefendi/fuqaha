abstract: "ÖZ Karadeniz kıyısında küçük bir kasaba görünümünde olan Tirebolu, Osmanlı döneminde Gümüşhane madenlerinin sevk edildiği bir iskele olarak önem kazanmış,“kasaba statüsünde”bir yerleşim yeridir. Bugüne kadar kazarım tarihi üzerine Prof. Dr. Faruk Sümer'in Tirebolu Tarihfvâm başka ilmî bir çalışma yapılmamış, ancak ulaşılamaması dolayısıyla burada Şer'iyye Sicilleri kullanılamamıştır. Yapılan çalışmalar ya folklor ağırlıklı, yada coğrafya ve halk ağzı ağırlıklı bitirme tezleridir. Tirebolu Şer'iyye Sicilleri üzerine yapılan iki yüksek lisans çalışmasında daha çok adî olayların ve tereke kayıtlarının bulunduğu derlerler seçilmiştir. Üzerinde bu çalışmayı meydana getirdiğimiz 1805 numaralı Şer'iyye Sicili İse Tirebolu'nun XVm. ve XDC. yüzyıldaki sosyal ve ekonomik durumunu önemli ölçüde aydınlatacak bilgileri ihtiva etmesi dolayısıyla değerli ve farklı özellikler taşımaktadır. Ayanlar ve voyvodalar devri Tirebolu'su, dönemin mahalli hanedanlarının kimlikleri, faaliyetleri, şehirde gelişen olaylar bîr Ölçüde metnini günümüz harflerine aktardığımız şer'iyye sicilinden izlenebilmektedir. Sonuç olarak, şehir tarihi çalışması için emsalsiz olan şer'iyye sicillerinden Tirebolu'ya ait olan 1805 numaralı defter şehrin sosyal ve ekonomik yapışım ortaya koyması açısından son derece önemlidir. ABSTRACT Tirebolu, a small Turkish town on the Black Sea coast, was an important port during the Ottoman period from which the mines of Gümüşhane were shipped to Istanbul. Until recent time, this town has remained out of the interest of historical study if we except one general history written by the late Prof. Faruk Sumer who had to ignore one of the most important local sources, namely the Registers of the local Sharia Court, as these were not available to scholars at that time. The present literature about this important Ottoman port depend mainly on ethnographic evidence narrating local folkways and usages. Though there are two MA dissertations covering the Sharia Court Registers of Tirebolu, these seem to be specialized only in criminal cases and estates. Our recent study focuses on the court register known as no. 1805 which include rich material about the socio-economic life of Tirebolu during the XVmth and XDCth centuries. The period of local decision-making, the identities and activities of native households and important events in the life of the town, can be tracked in some way due to this register of which we provide a modern transcription in this study."
