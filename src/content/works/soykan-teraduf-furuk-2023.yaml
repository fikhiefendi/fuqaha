abstract: "Arap dilinde müterâdif varsayılan kelimeler arasındaki nüanslara ve bu nüansların oluşturduğu literatüre el-Furûku'l-Lugaviyye denir. Nitekim dilsel kullanımda eş anlamlı/müterâdif olduğu varsayılan kelimeler arasında farklar keşfedilmiş böylece terâdüf düşüncesi karşısında furûk nazariyesi ortaya konulmuştur. İlk dönemlerde bu hususa dikkat çekilmekle yetinilirken sonraki dönemlerde temelleri atılmış ve bu alanda eserler telif edilmiştir. Bu eserlerin başında“Terâdüf ve Furûk Nazariyesi Bağlamında Ebû Hilâl el-Askerî ve el-Furûk fi'l-Luga Adlı Eseri”adlı bu çalışmada yer verdiğimiz Ebû Hilâl el-Askerî'nin (ö. 395) el-Furûk fi'l-Luga adlı eseri gelmektedir. Aynı zamanda çalışmamızda klasik ve modern dönemde terâdüf ve furûk düşüncesi hakkında görüş serdeden araştırmacılar ve eserlerine de yer verilmiştir. Çalışma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi, metodu ve kaynakları klasik ve modern kaynaklar başlıkları altında tespit edilmiştir. Birinci bölümde Ebû Hilâl'in hayatı, yaşadığı dönem ve eserlerine yer verilmiştir. İkinci bölümde furûk ve terâdüf düşüncesinin tanımı yapıldıktan sonra tarihsel arka plan, modern dönemde bu düşünceleri savunan âlimler ve görüşleri ele alınmış, üçüncü bölümde ise Ebû Hilâl'in“el-Furûk fi'l-Luga”adlı eserin metodu, muhteva ve şekline yer verildikten sonra eser içerdiği âyet, hadis ve emsâl açısından örneklerle ele alışmıştır. Çalışma esas olarak furûk ve terâdüf düşüncesini deskriptif yöntem ile inceleyerek klasik ve modern dönem üzerinden furûk ve terâdüf düşüncesini tanıtmak ve bu iki düşünce arasında karşılaştırma yapma imkânı sunmaktadır. Böylece çalışma, genel manada furûk nazariyesinin tahdit ve takdimine katkıda bulunmayı hedeflemektedir."
