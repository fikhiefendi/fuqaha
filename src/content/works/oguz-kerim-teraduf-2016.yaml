abstract: "Türkçeye eşanlamlılık olarak tercüme edilen Terâdüf, üzerinde çok tartışma yapılan konulardan biridir. Arapçanın ifade gücünü ve kelime zenginliğini gösteren Terâdüf, kabul ve red çerçevesinde incelenmiş ve kelimelerin farklı anlamlara geldiği noktasından ha-reket eden Furûk kavramı ortaya çıkmıştır. Furûk kavramının ortaya çıkışı ile birlikte Terâdüf ve Furûk birbirine zıt iki kavram olarak ele alınmış, dilciler Terâdüfü savunanlar ve Furûku savunanlar olmak üzere iki gruba ayrılmıştır.Dilde bir kavram olarak incelenen Terâdüf, Kur'ân-ı Kerîm'de tartışılırken, Kur'ân-ı Kerîm'in icazı merkez yapılarak tartışılmıştır. Terâdüfü reddedenler, Terâdüfün Kur'ân-ı Kerîm'de reddederken, her kelimenin ayrı bir anlamı olduğunu hiçbir kelimenin diğerinin yerine geçmeyeceğini söylemiş, Terâdüfü kabul etmenin bu icazı ortadan kaldıracağını iddia etmiştir. Hatta dilde Terâdüfü kabul edenlerden bazıları, bu endişeden dolayı Kur'ân-ı Kerîm'de Terâdüfü kabul etmemiştir. Fakat Furûk nasıl dilde bir gerçekse ise Terâdüf de aynı ölçüde bir realitedir. Aynı zamanda dil bir bütündür. Bazen bir kelimeyi ifade etmek için zıt anlam bile kullanılmaktadır. Kur'ân-ı Kerîm'de de Terâdüfün inkâr edilmesi yerine kelimeleri Terâdüf – Furûk birlikteliği ile ele almak hem dilde bir olgu olan Terâdüfün inkâr edilmemesine hem de müterâdif kelimeler arasındaki anlam farklarına dikkat etmeyi sağlayacaktır."
