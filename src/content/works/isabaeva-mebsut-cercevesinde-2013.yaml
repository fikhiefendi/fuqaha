abstract: "Serahsi (v. 483/1090)'nin günümüze kadar ulaşan en hacimli eserlerinden biri de el-Mebsut'tur. El-Mebsut Hanefi fıkhı yanında yer yer diğer itikadi mezheplerden de örnekler vererek konuya daha da açıklık getiren eserlerin ilki durumundadır. Aynı zamanda Serahsi'nin hapis yıllarını en iyi anlatılmaya ışık tutmaktadır. İmam Serahsi yetişdiği dönemin en iyi âlimlerinden olduğunu nitekim kendi hocası hayattayken onun lakabı olan Şemsu'l-Eimme İmamların Güneşi ona verildiğinden anlamak mümkündür. Yaklaşık on yedi yıllık hapis hayatında sonraki nesiller için eserler yazmıştır. El-Mebsût'ta yer yer gerekçesini göstererek eleştirmiş, sebebini açıklamış, varsa kendi fikrini beyan etmiştir. Serahsi'nin eleştirilerini tespit etmek için el-Mebsût eseri hızlı bir şekilde taranarak, ilgili bölümler sıralandı. Buna göre kurucu imamlar ve kurucu dışındaki imamlar olmak üzere ayrı ayrı bölümlere ayrıldı. Bazen açık ve net olarak isim verilirken bazen de Hanefi âlimlerimizin bir kısmı, mütekaddimun, müteahhirun örnekleriyle de karşılaştık. Tezimizde Hanefi fakihlerine yönelik eleştirileri el-Mebsût çerçevesinde değerlendirdik. Bununla el-Mebsût sadece Serahsi'nin şerh ettiği bir kitap değil aynı anda kendi fikirlerini de beyan eden bir eserdir sonucuna varmış bulunmaktayız. Anahtar Kelimeler Serahsî, el-Mebsût, Eleştiri"
