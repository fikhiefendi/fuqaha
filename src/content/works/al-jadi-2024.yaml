abstract: "Bu araştırma, Zeydi mezhebiyle Hanefi mezhebinin fıkhî etkileşimi karşılaştırmalı bir çalışmayla ele almayı amaçlamaktadır. Çalışmanın problemi, iki mezhep arasındaki uyumun ve farklılığın boyutunu ve bunun genel olarak İslam hukukuna etkisini ele almaktır. Ayrıca bu araştırma, iki düşünce ekolü arasındaki ortak içtihat ilkelerini açıklığa kavuşturmayı ve içtihatların çeşitli dallarında aralarında uyumun ortaya çıktığı uygulamalı modelleri analiz etmeyi amaçlamaktadır. Araştırmacı, bu çalışmada karşılaştırmalı yöntemi kullanmış olup, mezhepler arasındaki fıkhi argümanları karşılaştırmıştır. Aynı zamanda araştırmacı betimleyici ve analitik tümdengelim yöntemlerini kullanmış; her mezhebin temel ve ikincil kaynaklarındaki fıkhi metinleri analiz etmek için nicel ve nitel yöntemleri uygulamıştır. Verilerin doğruluğunu ve nesnelliğini sağlamak için modern veri toplama ve analiz teknikleri kullanılmıştır. Çalışma, üç ana bölümden oluşmaktadır: Birinci bölüm, iki mezhebin ortaya çıkışı ve ilk üç asırdaki tarihsel gelişimleri hakkında genel bir bakış sergiler. İkinci bölüm, mezhepler arasında ortak fıkhi istidlalleri ele alırken; üçüncü bölüm, Zeydi ve Hanefi mezhepleri arasında kesişimin görüldüğü muamelelerden, siyasi yönetim, cihat, ticaret, imamet gibi konular hakkındaki füru 'fıkıh meselelerinden örnekler getirecektir. Çalışmanın sonuç kısmında öne çıkan tespitler, iki mezhep arasındaki ortak içtihat esaslarını ortaya koyacak şekilde paylaşılacaktır. Çalışmada sunulan öneriler arasında çeşitli İslam mezhepleri arasındaki fıkıh diyaloğunun güçlendirilmesi ve benzerliklerin ortaya çıkarılması için karşılaştırmalı çalışmaların artırılması tavsiyesi yer almaktadır."
