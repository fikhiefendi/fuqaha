abstract: "Mekânların taşıdıkları fiziksel nitelikleriyle insan hayatına yön vermesi, dünya hayatına olan etki gücünün göstergesidir. İnsan bunun farkında olsun olmasın ya bulunduğu mekânın şartlarına göre şekillenir, ya kendi şartlarına uygun mekânlar seçer ya da ihtiyaçlarına göre bulunduğu mekânı şekillendirmeye çalışır. İnsan hayatının her alanına temayüz eden İslâm dini, Müslümanların yaşadıkları mekânları İslâm kimliğiyle inşâ etmiş, zamanla büyük bir medeniyet oluşturmuştur. Medeniyet inşâsında Müslüman kimliğini toplumsal hayatta var eden, koruyan ve belirli bir nizama sokan temel unsur da fıkıh olmuştur. Fıkıh kültürünü, toplumsal hayatta yaşanılır kılan yapılar, sosyal mekânlar ve bu mekânların inşâ ve denetiminde rol oynayan kurumlar olmuştur. Çoğunluğu vakıflarla kurulan, sosyal hizmeti amaçlayan sosyal mekânlar fıkhî prensipler ve yasaklar çerçevesinde yüzyıllar boyunca hizmet vermişlerdir. Araştırmamızın birinci bölümünde ilgili kavramların tanım ve kapsamlarından sonra İslâm medeniyet tarihinde kurulan sosyal mekânlar belirlenerek bu mekânların dayandığı kurumlar tespit edilmiştir. İkinci bölümünde ise tarihi birikimimizde tespit edilen sosyal mekânların inşâ ve kullanım prensiplerine değinilerek fıkhın yasaklarına yer verilmiştir. Bütün bu tespitlerin sonucunda sosyal mekânlardaki temel kamusal ve bireysel haklardan bahsedilerek, toplumsal hayatta sosyal mekânların fıkıh kültürü oluşmasında bireysel ve toplumsal kazanımları üzerine değerlendirme yapılmıştır."
