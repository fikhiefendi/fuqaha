abstract: "Sözleşmelerin sıhhatli bir şekilde kurulabilmeleri için dikkat edilmesi gereken pek çok husus vardır. Bu hususların en önemlileri sözleşmenin her iki tarafına ait şartlardır. Sözleşmenin tarafları ile ilgili şartlar kapsamında bir sözleşmede her iki tarafın aynı kişi tarafından temsil edilebilmesi gerek İslam Hukuku gerekse diğer hukuk sitemleri bakımından tartışmalı bir konudur. Zira tek bir kişinin aynı anda farklı iki veya daha fazla iradeyi temsil edebilmesi, o iradeler adına kendi kendine işlem yapabilmesi hukuki temellendirme açısından olduğu gibi sebep olabileceği çıkar çatışmaları açısından da birçok soru işareti barındırmaktadır. Bu çalışmada sözleşmenin her iki tarafını aynı kişinin temsil etmesi hususunda klasik ve modern dönem İslam hukukçularının görüşleri tespit edilmeye çalışılmıştır. Konu hakkında Hanefîler ve Şafiiler genel olarak yasaklayıcı bir yaklaşım sergilemişlerdir. Mâlikî ve Hanbelîler ise diğer iki mezhebe göre sözleşmenin her iki tarafını aynı kişinin temsil etmesine cevaz konusunda daha esnek davranmışlardır. Modern dönem İslam hukukçularının daha çok klasik mezhep görüşlerini incelediği ve bunlardan tercihlerde bulundukları görülmüştür. İslam hukuku dışındaki hukuk sistemlerinde konu, bazı açılardan İslam hukukuna benzer şekilde ele alınmış olsa da hukuki zeminde ciddi farklılıkların olduğu tespit edilmiştir. Konunun günümüzdeki uygulamalarına yönelik, İslam ülkelerinin medeni kanunları incelenmiştir. Bu konu İslami bankaların uygulamalarında zaman zaman yer bulmuştur. Bu nedenle konunun İslami bankalardaki uygulamasına dair görüşler ve Türkiye'deki yansımaları tespit edilmeye çalışılmıştır."
