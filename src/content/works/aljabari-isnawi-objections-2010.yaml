abstract: "İsnevi'nin Nihayetil Sul ala kitab elminhac isimli kitabının mukaddime ve birinci bölümünde bulunan itirazları. (Minhac el vusul ila ilm el usul) kitabı, İmamı Beydâvî nin (Allah ona rahmet etsin) mütekellim usul âlimlerin mezhebi üzere tasnif etmiş olduğu en önemli usul metinlerinden biridir. Bu kitap pek çok ilgi ve ihtimam görmüştür. Şerh edilmiş, nazım edilmiş ve haşiyeler yazılmıştır. Eskiden beri bu günümüze kadar ders kitabı olarak okutulmuş ve okutulmaktadır. Bize gelen şerhlerinden biri de Allame İsnevi'nin Nihayetül sul Şerhu minhacul usul isimli kitabıdır. Ve bu, meseleleri açıklama ve Beydâvî'nin görüşünü diğer Usul âlimlerinin görüşleriyle karşılaştırma ve diğer büyük faydalar bakımından Minhac'ın diğer açıklamalarını geride bırakan ayrıntılı bir açıklamadır. El-İsnevi, kitabında, öğretim programı kitabının doktrini bilmek için bir kaynak olarak kabul edilmesini veya öğretisinin doğruluğunu - yöntem arayışı açısından değil, materyal açısından - bir değerlendirme noktası haline getiren birçok itirazdan bahsetti. Çünkü el-İsnevi'nin Şerhi ne gelenler, müfredatın ibarelerini çözmek istediler, Ancak çok sayıda bulunan bu itirazlar kitabın kolayca anlaşılmasına engel teşkil ediyordu. Dolayısıyla bu itirazları incelemeye ihtiyaç vardı. Bu araştırma, El-Minhac kitabının giriş ve ilk kitabına ilişkin kitabında El isnevi'nin itirazlarını ve itirazın tam yerini ve bu itirazların yerine göre tasnifini ele almıştır. El isnevi'nin itirazlarının her birinde, özellikle konuyu müfredatın diğer müfessirlerinden ele alan, buna ilave yapmadan, örneğin itirazların alındığı konular ve buradaki itilafların münakaşası yukarda yapıldı. Burada İtirazlar incelenirken kullanılan terminoloji nin tarifi ile en önemli kaide ve kurallara tenbih vardır. Bu çalışmada ele alınan itiraz sayısı yüz yirmi üçe ulaştı ve şu şekilde dağıtıldı: Tariflere (tanımlara) otuz altı itiraz, Taksimlere on iki itiraz, İbarelere beş itiraz ve tasdiklere yapılan yetmiş itiraz. Muhalefet ve nakz arasında men olmayan bir şekilde dağıtılmıştır, çünkü böyle bir durumda başka türlü tasavvur edememiştir. İtirazların üçte birinin Beydâvî'nin kitabında çıkardığı delillere yöneltildiği ve bu araştırmada El İsnevi, Beydâvî'nin sözlerinden kastettiğini anlamadığı veya El-Beydâvî'nin sözlerinin aksine bir şekilde yönlendirildiği için olmuştur. İtirazların meydana geldiği hatalara gelince, itirazların çoğu yerinde değildir. El İsevi, itirazdan bahsettiğinde iddia etti ve El-İsnevi'nin yapmış olduğu itirazlarının muhalifleri, kabul edenlerden daha fazlaydı. Yaklaşık yüzde seksen üç ve dolayısıyla bu itirazların büyük çoğunluğu geçerli değildir, bu nedenle El Minhac el İsnevinin kendisine yaptığı itirazlardan kaynaklanan sıhhati konusundaki vehimler doğru değildir ve Aynı şekilde bu itirazlar çoğunlukla (tarife olup tarif olunana değil) veya (taksime olup taksim olunana değil) veya (Delil e olup delil getirilene değildir.) böyle olunca El-İsnevi nin, soru veya delilin bazı yönlerinde onunla aynı fikirde olmasa bile El-Beydavî ile aynı mezhepte olduğuna işaret vardır. Al-İsnevi'nin“Nihayet el-Sul”kitabında itiraz ettiği birçok konuda Beydavi ile aynı fikirde olduğu eltemhid kitabında görülmektedir. Yukarıda geçen bilgilere binaen El İsnevi nin Al-Minhac kitabına vaki olan itirazlarının çoğu kitabın seçilen bölümünde çözüme kavuşturuldu. El-Minhac Kitabı yapılan itirazlara rağmen aldığı çalışma ve inceleme için gördüğü ilgiyi hak eden bir kitap olduğunu görüyorum. Gerçekten de, bu araştırma bu kitaba daha fazla ilgi gösterilmesini gerektirmektedir ve açıklamaları ve ondan yararlanmanın kapsamını genişletmek, çünkü bu kitapta yer alan faydalar ince ifadelerle formüle edilmiştir. Son olarak, Allame el-İsnevî'nin itirazlarını ve ona sunulan çözümleri düşünen kişi, böyle bir âlimin, yapmış olduğu merdut itirazların çokluğu karşısında şaşırabilir. Buna verilecek cevap, belki de, el-İsnevi'nin bu itirazların çoğunu Minhac Kitabını okuttuğu sırada getirdi. Çünkü bu kitabı defalarca şerh ile açıklamasını yaptığı zikredildiği gibi, ve yine bunlar, tam bir araştırma yapılmadan ortaya çıkan ve bahsedilen itirazlardır. v belki de Nihayetül Sul kitabında bahsetmesi ve tahkik etmeden bırakması Talebelerini denemek ve onları eleştirel bakışa alıştırmak içindir. Çünkü bu itirazlardan bir itirazı araştırmak büyük bir faydadan yoksun olmadığı ve belki de öğrencileri için bir sınav ve onlar için bir öğreti olarak zikretmiş olacağından El-İsnevi mazur görülebilir. Bir kitabın şerhinde çok sayıda itiraz iyrad etmek âlimlerin âdeti değildir. Bilakis, talebeye Müfredat ve kelime dağarcığını açıklamaya yetecek birçok şerh vardır.- Allah ona merhamet etsin - oluşturulan ve incelenen itirazlardan bahsederek faydayı genişletmek istedi ve bunda şüphesiz öğrenciler için hiç inkâr edilemeyecek bir fayda var."
