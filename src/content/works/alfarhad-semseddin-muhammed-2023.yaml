abstract: "Bu tezde H. 896 yılında vefat eden Şemseddin el- Mısrî'ye ait Hadîd Süresinin Başından Mümtehine Süresinin Sonuna Kadar Devam Eden özel cüzün tahkiki yapılmıştır. Müellifin، meşhur müfessirlerin metotlarından Rivayet، Dirayet ve İşari tefsir olarak bilinen bu üç temel metodu bir araya getirerek oluşturduğu zengin ilmi metodu ve engin ilmî kültürü sayesinde tefsirinde Kıraat، Hadis، Dilsel ve Fıkhî konuları kapsayan pek çok konuyu ele almasından dolayı bu el yazması; ilmi değeri yüksek bir eserdir. Çünkü tefsiri; fıkıh، hadis، kıraat ve dili kapsayan çeşitli konuları içermektedir. Kitap، Kur'an ayetlerinin açıklanması hususunda müfessirlerin ve âlimlerin ifadeleri bakımından oldukça zengindir. Manalarının delalet ettiği noktaları açıklamakla birlikte onların okunma yollarını göstermek; belagat، sarf ve nahivle ilgili dilsel meseleleri zikretmek; özellikle Kuran ayetlerini karşılaştırırken kelimelerin hem sözlük anlamlarını verip hem de açıklamak müellif için büyük önem taşımaktadır. Araştırmacı، müellifin hayatı ve kişiliğini ele alırken açıklayıcı tarih metodunu kullanmıştır. Aynı şekilde müellifin zikretmediği ya da eksik bıraktığı meseleleri eleştirel yöntem kullanarak tamamlamıştır. Tahkik kısmında، eserleri karşılaştırıp şerhler arasındaki farkları ortaya çıkarıp; sahabe، tabiin، müfessirler، fakihler، muhaddisler ve dilcilere ait ifadelerin kaynaklarını dipnotlarda belirtirken de soruşturma ve yorum metodunu kullanmıştır. Bu çalışmanın en önemli bulguları şunlardır: Müellifin kendi ifadelerini، açıklamalarını ve çıkarımlarını desteklemek için –pek çok konuda onları referans aldığını belirtmeksizin- tıpkı Sibevehyî، el-Kesâî ve ez-Zeccâc gibi dilcilerin görüşleri gibi Kurtûbî ve Beyzâvî'nin eserlerinden de çokça alıntılar yapmıştır. Ayetlerin tefsirinin faydalarından bahsettiği gibi; lafızların، sözlük anlamlarına delaletlerini açıklaması ve onların arasındaki bağlama göre lafızların arasındaki delalet farklılıklarına işaret etmesi، Makdisî'nin tefsirini diğerlerinden ayırmakla birlikte، hadislerin sıhhatine bakmadan azımsanmayacak derecede zayıf hadisi kullanmıştır."
