abstract: "Bu tez çalışmasında, (H. 1310-1311/M. 1892-1893) yıllarına ait“1420 Numaralı Giresun Şer'iye Sicili Defterinin transkripsiyonu yapılarak, defterde yer alan kayıtlar ışığında adı geçen dönemde Giresun'daki idarî, sosyo-ekonomik, dinî ve kültürel yapı değerlendirilmeye çalışılmıştır. Çalışmamız giriş ile birlikte üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı ve önemi, araştırmanın temel kavramları, yöntem ve verilerin çözümlenmesi ele alınmıştır. İlk bölümde ”1420 Numaralı Giresun Şer'iye Sicili Defteri\"nin transkripsiyonlu metni yer almaktadır. İkinci bölümde ise, defteri oluşturan belgeler belirli bir plan çerçevesinde ayrı ayrı değerlendirilmiştir. 1892-1893 yıllarında Giresun şehrinin idarî, sosyo-ekonomik, dînî ve kültürel yapısı hakkında transkripsiyonu yapılan kayıtlardan istifade edilerek elde edilen bilgiler değerlendirilmiştir."
