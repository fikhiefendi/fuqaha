abstract: "Dünyada büyük bir gelişim sürecine giren faizsiz bankacılık prensiplerinin pratiğe aktarılması konusundaki girişimler, 1970'li yıllarda düşünce aşamasından çıkıp uygulama alanı bulmaya başlamıştır. 'Faizsiz Bankacılık' adı altında yaygınlaşan katılım bankaları, başlangıçta müslüman ülkelerde faaliyet gösterirken bugün tüm dünyada, tasarrufların değerlendirilmesi ihtiyacıyla gün geçtikçe önem Faizsiz/İslami Bankacılık ya da Katılım Bankacılığı dünya finans piyasasındaki payını gün geçtikçe arttırmaktadır. Bazı geleneksel bankaların, faizsiz bankacılık işlemleri yapmak üzere kendi bünyelerinde birimler açtıkları görülmektedir. Türkiye dışındaki faizsiz bankaların niçin tercih edildiğini araştıran birçok çalışma yapılmış olmasına rağmen Türkiye'deki katılım bankalarının niçin tercih edildiğine dair yapılan çalışma sayısı yok denecek kadar azdır. Bu çalışmanın hedefi; Türkiye'deki katılım bankalarının niçin tercih edildiğine ilişkin literatüre katkıda bulunmaktır. Bu amaçla; İstanbul ilindeki dört ayrı katılım bankasının müşterileri arasından örnek kütle seçilmiştir. 423 kişiden oluşan örnek kütle üzerinde anket tekniği uygulanarak veri toplanmıştır. Elde edilen verilere açıklayıcı faktör analizi uygulanmıştır. Bulgularımıza göre; katılımcıların katılım bankası tercihlerini etkileyen en önemli faktör“Katılım bankası ve faizsiz kurum olarak imaj ve popülaritesi”dir. Bu faktörün ardından, sırasıyla“dini hassasiyetlerimin yönlendirmesi”ve“banka çalışanlarının müşterilere karşı yaklaşımı”faktörleri gelmektedir."
