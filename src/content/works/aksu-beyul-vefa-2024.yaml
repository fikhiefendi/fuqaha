abstract: "Bu çalışma, İslam toplumunda finansman ihtiyacını karşılamak amacıyla kullanılan bey'u'l-vefâ akdini ele almaktadır. Tez, bey'u'l-vefâ akdinin erken dönem kaynaklarından hareketle tarihi süreçteki değişimini incelemeyi ve bu akitle ilgili bilginin gelişim sürecini ortaya koymayı amaçlamaktadır. Modern dönemde bey'u'l-vefâ eksenli çalışmalar genellikle konuyla ilgili erken dönem kaynaklara inmek yerine geç dönem Hanefî kaynaklarına bakarak akit hakkındaki çeşitli yorumlardan bahsetmişlerdir. Bu çalışmada erken dönem Hanefî kaynaklarından hareketle bey'u'l-vefâ akdinin Mâverâünnehir bölgesindeki hukuki mahiyetiyle alakalı değişimin temelde iki aşamadan oluştuğu iddia edilmektedir. Diğer yandan akdin uygulamalardaki son halini almasıyla birlikte hacmi artan hukuki sonuçlar tartışılmakta ve akdin gösterdiği değişim ve gelişim süreci ortaya konulmaktadır. Hanefî mezhebinde akdin ortaya çıkış tarihine odaklanan modern çalışmalar, genellikle hicri 5. asırda yoğunlaşmaktadır. Bu çalışma ise bey'u'l-vefâ akdinin terim olarak aynı ismi taşımasa da mefhum olarak hicri 3. ve 4. asır Hanefî kaynaklarında mevcut olduğunu ve akdin kökeninin daha eski bir tarihe dayandığını göstermeyi amaçlamaktadır."
