abstract: "Arapça, Kur'ân dili olması hasebiyle gerek Müslüman gerek gayrı müslimler arasında ehemmiyeti yüksek olan dillerdendir. Kur'ân'ın ve dini hükümlerin sahih bir şekilde anlaşılmasında büyük rolü vardır. Bundan dolayı, bu dil üzerine İslam'ın erken döneminden günümüze kadar, geniş çaplı inceleme ve araştırmalar yapılmıştır. Bu bağlamda, yapılan bu çalışmada Arap dilinin önemli konularından olan ve Nahiv ilminin alt başlıklarından birisi olan harfi cerler ele alınmış, Ebû Bekir el-Cessâs'ın Ahkâmu'l-Kur'ân adlı eserinde geçen, harfi cerlerin ahkâm ayetlerinde hükme olan etkileri incelenmiştir. Öncelikle Arap Dili ve Edebiyatı'nda harfi cerler hakkında temel özellikler, kullanıldığı anlamlar zikredilmiş, ardından ahkâm ayetlerindeki uygulamaları, Cessâs'ın Ahkâmu'l-Kur'ân adlı eseri çerçevesinde ele alınmıştır. Söz konusu harflerin manaya etkilerine yönelik önce Cessâs'ın görüşüne, daha sonra farklı müfessir ve fıkıh bilginlerinin düşüncelerine yer verilmiş ve sonunda genel değerlendirme yapılmıştır. Bu çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Birinci bölümde, harfi cerlerin Arap dilindeki yeri ve önemi, cümle içindeki kullanımları ve ifade ettiği anlamlar ele alınmıştır. İkinci bölümde, Ebû Bekir el-Cessâs hakkında genel bilgi verilmiş, Ahkâmu'l-Kur'ân adlı eseri ve harfi cerlerin ahkâm ayetlerinde manaya etkileri incelenmiştir. Sonuçta ise, çalışma neticesinde elde edilen temel hususlar zikredilmiştir."
