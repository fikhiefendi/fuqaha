abstract: "İslam hukukunda genel temayül Müslümanın gayrimüslimler arasında yaşamasının sakıncalı olduğu yönündedir. İslam devletinin merkezi gücünün zayıflamaya başlamasıyla Müslümanlar gayrimüslimlerin yönetimi altında yaşamak zorunda kalmışlardır. Bu durum dünya üzerinde ilk Müslüman azınlık kitlelerinin oluşumuna, böylece Müslüman azınlıkların fıkhi problemlerinin doğuşuna zemin hazırlamıştır. Özellikle son iki asırda siyasi ve iktisadi nedenlerle artan göçler çoğunluktan dil, ırk ve din bakımından ayrılan azınlıkların problemlerinin artmasına sebep olmuştur. Günümüzde Müslüman azınlıklar kişisel, siyasi, iktisadi ve sosyal haklarını ifâ noktasında birçok problemle karşılaşmaktadır. Haklara ilişkin bu problemlerin bir yönü meselenin İslam hukukundaki karşılığına, diğer yönü ise gayrimüslim devlet hukuku ile ilişkisine dayanır. Bu problemlerin çözümünde önceliğin İslam hukukuna göre Müslüman azınlıkların haklarının tespitine dayandığı kanaatimizden hareketle çalışmamızı bu konu üzerine tesis ettik. Zira Müslümanın gayrimüslim devletteki varlığının imkanı ve haklarının ifâsının İslam hukukundaki karşılığının tespiti günümüzde gayrimüslim devletlerde yaşayan Müslümanların haklarına ait fıkhi problemlerin çözümüne temel oluşturacaktır. Çalışmamızda modern hukuk ve İslam hukukunda azınlık ve Müslüman azınlık kavramlarının çerçevesini çizip, Müslüman azınlıkların oluşum-gelişim süreçlerini ve günümüzde Müslüman azınlıkların konumunu ortaya koyduk. Ardından Müslüman azınlıklar hukukunun temellendirmesini yaparak bu hukukun yeni bir fıkıh disiplini olduğunu tespit edip bu disiplinin temel ilkelerini belirledik. Bu bağlamda Müslüman azınlıkların fıkhi problemlerine çözüm üretirken korumacı hukuk refleksinin önemini ortaya çıkardık. Sonraki bölümde Kur'an-ı Kerim, Sünnet, İslam hukuk mirası, tarih bilimi ve modern hukuktan yararlanarak Müslüman azınlıkların seyahat, sığınma ve ikamet gibi haklarını inceleyip seyahat özgürlüğüne mutlak anlamda, ancak sığınma ve ikamet haklarına belli şartlarda sahip olduklarını belirledik. Müslüman azınlıkların gayrimüslim devlette vatandaşlık hakkı almalarının fayda ve zararlarından hareketle belli şartlar dahilinde; seçme-seçilme, kamuda-askeriyede görev alma gibi siyasi haklarının ancak Müslümanların yararına olacak şekilde kullanmanın mümkün olduğu sonucuna vardık. Müslüman azınlıkların inancını yaşama, eğitim alma, mülk edinme ve çalışma hakları gibi sosyal ve ekonomik haklarını bu haklara İslam hukukuna aykırı olmadığı sürece mutlak anlamda sahip olduklarını ortaya koyduk."
