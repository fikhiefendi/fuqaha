abstract: "Alemlere rahmet olarak gönderilen Hz. Muhammed'in (s.a.v.), Kur'ân'ı tefsir ve tebyîn etme görevini ömrünün sonuna kadar hakkıyla yerine getirdiği bilinmektedir. Son peygamberin vefatının ardından yaşanan fetihlerle birlikte ortaya çıkan toplum yapısı sonucunda dildeki bozulmaya paralel olarak dil çalışmalarının arttığı ve Kur'ân tefsirinde dilbilimsel tefsir akımının ortaya çıktığı görülmektedir. Aynı zamanda değişen toplum yapısına uygun yeni İslâmî hükümlerin oluşturulma ihtiyacı hasıl olmuştur. Buna bağlı olarak Kur'ân'ın ahkâm âyetlerinin incelendiği Ahkâmü'l-Kur'ân tefsirlerine yönelik çalışmalarda artış yaşandığı kayıtlarda yer almaktadır. Âlimlerin tefsir kitaplarını genellikle ustalık dönemlerinde yazdığı ve bu tefsirlerde tüm ilmî birikimlerini ortaya koyduğu görülmektedir. Bu bağlamda, hicrî 4. yüzyılda yaşayan Ebû Bekir el-Cessâs'ın yazdığı son eser olan Ahkâmü'l-Kur'ân tefsirinde yaptığı dilbilimsel izahlar dikkat çekmektedir. Onun dilbilimsel tefsirde hatırı sayılır bir birikime sahip olduğu, yaptığı dilbilimsel açıklamalardan anlaşılmaktadır. Bu araştırmada Cessâs'ın tefsirinde yaptığı dilbilimsel açıklamalar incelenmekte ve ahkâm eserinin dilbilimsel tefsir açısından önemi tespit edilmeye çalışılmaktadır."
