abstract: "Bu çalışma, katılıma dayalı İslami finansman ile finansal istikrarın yönetimi, finansal durumun esnekliğinin değerlendirilmesi ve bankaların krizler karşısındaki davranışları arasındaki ilişkiyi Türkiye'deki katılım bankacılığı bağlamında incelemeyi amaçlamaktadır. Çalışmada, İslami finans, örgütsel esneklik ve kurumsal acil durum teorilerine dayanan bileşik bir teorik model benimsenmiştir. Kısmi En Küçük Kareler Yapısal Eşitlik Modellemesi (PLS-SEM) yöntemi kullanılarak, İslami finansman, risk yönetimi, esneklik testleri, kurumsal istikrar ve kriz dönemlerinde bankacılık davranışlarını kapsayan bir ölçüm aracı geliştirilmiş ve bu araç, Türkiye'deki katılım bankalarının finans, strateji ve risk yönetimi birimlerinde görev yapan 318 katılımcıdan oluşan amaçlı bir örneklem üzerinde uygulanmıştır. Elde edilen sonuçlar, katılımcı İslami finansman ile finansal istikrar sistemi arasında anlamlı ve pozitif bir ilişki olduğunu göstermiştir. Ayrıca, risk yönetiminin kurumsal düzeyde esneklik değerlendirme kapasitesi üzerinde önemli bir etkisi olduğu tespit edilmiştir. Buna karşılık, İslami finansman ile esneklik testleri arasında ve bu testlerle kriz dönemlerindeki bankacılık davranışları arasında anlamlı bir ilişki bulunamamıştır. Çalışma, İslami finansman araçları ile karar alma sistemleri arasındaki entegrasyonun güçlendirilmesi, esneklik testlerinin sonuçlarının daha etkin kullanılması, ayrıca katılım bankalarında risk yönetim birimlerinin geliştirilmesi ve kriz müdahale ekiplerinin kurulmasının önemine dikkat çekmektedir."
