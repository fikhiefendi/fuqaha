abstract: "Safevi Devleti, kendisinden önceki İslâm ve Türk-İslâm devletlerinden tevârüs ettiği sadâret makamını, kendine özgün bir müessese haline getirmiştir. Sadâret makamı, devletin kuruluşu esnasında Şah I. İsmail tarafından ihdâs edilmiştir. Kısa süre içerisinde sadâret makamı, Safevi Devleti'nin bürokratik yapısında yerini almış ve sistematik bir şekilde örgütlenmiştir. Safevi Divan-ı Hümâyûnunda Safevi Şahı ve i'timadü'd devle makamından sonra Safevilerin üçüncü büyük makamı haline gelmiştir. Tarihi süreçte dinî, hukukî, kazaî, eğitim ve mevkûfât alanlarındaki birimleri ile bir makam ve külliye halini alan ve günümüz Türkiye Cumhuriyeti'nde Diyanet İşleri Başkanlığı, Adalet Bakanlığı, Milli Eğitim Bakanlığı ve Vakıflar Genel Müdürlüğünün görevlerini yürüten bir makam olmuştur. Belli zamanlarda Safevi Devleti içyapısındaki değişiklikler neticesinde görev, yetki ve sorumluluklarının bir kısmını itimadü'd devle, şeyhülislâm, kadı ve sair nezaretlere bırakmıştır. Safevi Devleti'nde sadâret makamındaki ilk değişim ve dönüşümler Şah I. Tahmasb döneminde yaşanmıştır. Şah I. Tahmasb'ın saltanatı yıllarında Şeyh Ali el-Kerekî el-Âmilî'nin şeyhülislâmlık makamına tayini ile birlikte sadâret makamı; siyasî, idarî, dinî ve hukukî alanlarda güç, kudret ve nüfuz kaybetmiştir. Şah II. İsmail ve Şah Muhammed Hüdabende saltanatları döneminde ise kaybettiği güç, kudret ve otoriteyi nispeten tekrardan kazanan sadâret makamı, Şah I. Abbas'ın saltanatı ile beraber köklü değişim ve dönüşümler geçirmiştir. Sadâret makamı, Şah I. Abbas'ın devlet teşkilatındaki ve börokratik yapıdaki ıslahat hareketlerinden en çok etkilenen makam ve kurumlardan biri olmuştur. Bu dönemde sadâret makamı, şeyhülislâmlık makamı karşısında Safevi hanedanının şer'î-kazaî ve ictimaî işlerini yürüten ve mevkufât kurumunun işleyişinden sorumlu bir makam haline gelmiştir. Şah I. Abbas'tan sonra tahta çıkan Safevi şahları döneminde sadâret makamı sürekli olarak güç, kudret ve otorite kaybetmiş ama buna rağmen Safevi Devleti'nin divan-ı hümâyûnunda resmi olarak varlığını devam ettirmiştir. Şah Sultan Hüseyin'in saltanatı döneminde ise mollabaşılık makamının kurulmasıyla birlikte dinî, kazaî ve hukukî bütün görevleri mollabaşılık makamının uhdesine geçmiş. Yine bu dönemde sadâret, sadece Mevkûfât-ı hasse ve Mevkûfât-ı amme işleriyle ilgilenen bir makam haline gelmiştir. 1722 yılında Safevi Devleti'nin yerel Afgan Hanedânları tarafından yıkılmasıyla beraber Safevi Devleti tarihe karışmıştır. Afgan ve Afşar Hanadenları döneminde İran coğrafyasında varlığını yitiren sadâret makamı, Zend Hanedanlığı ve Kaçar Hanedanlığı döneminde divani makam olarak tekrardan ihyâ edilip varlığını sürdürmüştür."
