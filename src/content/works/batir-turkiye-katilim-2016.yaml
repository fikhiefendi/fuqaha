abstract: "Son yıllarda hızlı büyüme kaydeden ve bankacılık sektörü içinde artan bir öneme sahip olan katılım bankacılığı konusu uluslararası akademik çalışmalarda sıklıkla yer almaya başlamıştır. Finansal sistemin işlerliği açısından büyük öneme sahip olan bankacılık sektörü ve katılım bankalarının kazandığı önem göz önüne alınarak, bu çalışma bankacılık sektörünü katılım bankaları ve konvansiyonel bankaları karşılaştırmak suretiyle ele almıştır. Çalışma, kullanılan veriler ve yöntem açısından birbirinden farklı iki analizden oluşmaktadır. Birinci analizde, 2005 yılı dördüncü çeyrek ile 2014 yılı birinci çeyrek arasındaki üçer aylık finansal veriler kullanılarak 29 konvansiyonel ve 4 katılım bankasının kârlılık belirleyicileri panel veri analizi ile analiz edilmiştir. İkinci analizde ise 2005 – 2013 yılları arasındaki yıllık veriler kullanılarak 27 konvansiyonel ve 4 katılım bankasının etkinlik seviyeleri veri zarflama analizi ile belirlenmiş, ardından Tobit regresyon modeli kullanılarak her iki banka türü için etkinlik skorlarına etki eden faktörler analiz edilmiştir. Sonuç olarak, gerek kârlılık belirleyicileri konusunda gerekse etkinlik analizi kapsamında katılım bankaları ve konvansiyonel bankaların birbirinden farklı sonuçları olduğu tespit edilmiştir."
