abstract: "Bu tez, İslam hukukunun önemli müesseselerinden biri olan süt akrabalığını, kavramsal, toplumsal ve hukuki boyutlarıyla ele almakta ve doğurduğu fıkhi, sosyal ve ahlaki sonuçları kapsamlı bir şekilde incelemektedir. Araştırmada, süt akrabalığının evlenme engeli ve mahremiyet hükümleri gibi temel sonuçları detaylı bir şekilde ele alınmış; bu bağlamda Hanefi, Şafii, Maliki ve Hanbeli mezhepleri başta olmak üzere klasik görüşler karşılaştırmalı bir şekilde değerlendirilmiştir. Bu karşılaştırmada, mezheplerin birbirinden farklı yaklaşımları ifade edildiği gibi bunların teorik ve pratik yansımaları ile problemler karşısındaki işlevselliği de ortaya konmuştur. Modern tıptaki gelişmeler ve toplumsal değişimlerden ortaya çıkan mesele ve problemler, süt akrabalığı bağlamında incelenmiştir. Hamilelik dışında süt oluşumu, kasıtsız şekilde süt akrabalığı oluşumu ve farklı inançlara mensup bireyler arasındaki durumlar, inceleme konusu olan meselelerden birkaçı olup hem klasik literatür hem de modern hukuki ve sosyal bağlamda analiz edilmiştir. Bu analizde mezheplerin çözüm sağlayan yaklaşımlarına yer verilmiş; bunun yanı sıra bazı görüşlerin sorunları derinleştirdiği alanlar da tespit edilmiştir. Bu bağlamda, hem teorik çözüm önerilerinin hem de bu önerilerin pratikteki uygulanabilirliğinin tartışılması, çalışmaya ayrı bir derinlik kazandırmıştır. Tezin temel amacı süt akrabalığına ilişkin gerek klasikte incelenmiş olan gerekse güncel değişimlerle ortaya çıkan sorunlara çözüm önerileri geliştirmektir. İslam hukukunun maslahat ilkesine dayalı, aile ve toplumun muhafazasını sağlayacak bir yöntem benimsenmiştir. Bunun yanı sıra, klasik ve modern yaklaşımlar arasında bir köprü kurularak, bu müessesenin günümüz İslami toplumlarındaki yeri ve etkisinin daha iyi anlaşılması hedeflenmiştir. Bu çalışma, toplumsal ve teknolojik gelişmelerin İslam hukukuna etkilerini göz önünde bulundurmakta, klasik fıkhi bilgiyi günümüz koşullarıyla harmanlayarak pratik ve uygulanabilir çözümler sunmayı amaçlamaktadır. Ayrıca süt akrabalığı kavramının sadece hukuki değil, aynı zamanda toplumsal ve etik boyutlarını da vurgulamayı hedeflemektedir."
