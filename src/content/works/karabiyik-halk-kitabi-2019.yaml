abstract: "Cenknâme türü halk kitapları, çok eski tarihlerden beri dünyanın farklı milletlerinde mevcuttur. Hem yazılı hem sözlü geleneğin kesişim noktasında bulunan ve halka yön veren önemli ürünlerdir. Bu tez bir giriş, iki bölüm, bir sonuç ve eklerden oluşmaktadır. Çalışmada ilk olarak kültür, halk kitapları gibi kavramlar üzerinde durulmuştur. Daha sonra halk kitapları ve özellikleri incelenmiş, çalışma hakkında genel bilgiler verilmiştir. Çalışmanın birinci bölümünde,“Muhammed Hanefi Hazretleri Cengi”başlıklı eser ile ilgili yapılmış çalışmalara yer verilmiş ve aynı zamanda eser, şekil ve muhteva bakımından incelenmiştir. Kısaca bu bölümde eserin halk kitabı olup olmadığı ortaya konmaya çalışılmıştır. Çalışmanın ikinci bölümünde ise“Muhammed Hanefi Hazretleri Cengi”adlı eser“Hāzā Kitâb-ı Muhammed Hanefî”,“Resimli Muhammed Hanefi Cengi”ve“Allah'ın Nimetleri ve İnsanlar”adlı eserlerle mukayese edilerek incelenmiştir."
