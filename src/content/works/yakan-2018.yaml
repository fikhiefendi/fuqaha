abstract: "Bu araştırmada Kur'ân'ın farklı kıraatlerinden kaynaklanan fıkhi ihtilaflar incelenmiş, kâriler arasında ihtilafa sebep olan ayetler üzerinde durulmuştur. Bu ayetlerle ilgili olarak Hanefî, Maliki, Şafiî, Hanbelî, Zâhirî, Zeydî, İmâmî ve İbâdî mezheplerinin görüşleri ele alınmıştır. Araştırmayı önemli kılan husus da kıraatlere dair ihtilafların fıkhî hükümlerdeki ihtilaflara etkisini ortaya koymasıdır. Bu araştırma, giriş ve iki bölümden oluşmaktadır. Giriş kısmında kıraatler ve çeşitleri üzerinde durulmuştur. Birinci bölümde ise on kıraat imamı tanıtılmış, sonra fakihlerin şaz kıraatlere dair fikirleri ve onların bunlardan hüküm çıkarmaya dair görüşleri açıklanmıştır. İkinci bölümde araştırmanın asıl konusuna geçilmiş, Bakara suresinden Mâide suresinin sonuna kadarki ahkam ayetlerinin nasıl okunacağı, bir meseledeki ihtilafın sebeplerinin anlaşılması için fakihlerin ve müfessirlerin ilgili ayetlerin kıraatine dair görüşleri ortaya konmuştur. Buna göre araştırma şu mevzuları içermiştir: İlk olarak“abdestte ayakları yıkama”meselesine dair ihtilaf incelenmiştir. İkinci olarak“kadınlara dokunma ve cinsi ilişkide bulunmada hangisinin temizlenmeyi gerektirdiği”ne dair fıkhî hükümdeki ihtilaf ele alınmıştır. Üçüncü olarak“suyun bulunmadığı durumlarda cünüplükten kurtulmak için teyemmüm etme”konusundaki görüşler tetkik edilmiştir. Dördüncü olarak“kaza orucunu peşpeşe tutma”meselesindeki fıkhi ihtilaflar incelenmiştir. Beşinci olarak“yemin bozmanın kefareti olan üç gün oruç tutma”konusunda fakihlerin, farklı kıraatler sebebiyle içine düştükleri fıkhi ihtilaflar ele alınmıştır. Araştırmanın son kısmında ise Nisâ suresinin başında yer alan“erham”kelimesi ile ilgili âlimlerin ihtilafı incelenmiştir."
