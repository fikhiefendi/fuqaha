abstract: "Çalışmamızda merhum Dr. Yusuf el-Karadâvî'de Fıkıh Tenkidi konusu incelenmiştir. İlgili konunun incelenmesi yapılırken el-Kardavî'nin fıkıh tenkidinin teorik zemini dikkate alınmıştır. Yine çalışmada özgünlük, itidal ve yenilenme boyutlarını gözeten, çağın değişen ihtiyaç ve zorunluluklarına cevap veren, aynı zamanda fıkıh, dâvet ve gerçekçi düşünceleri sunum tarzında birleştiren onun fıkhî ictihâdlarının bir kısmı ele alınmıştır. Çalışmada, el-Karadâvî'nin fıkhî görüşleri ve onun delil ve pratikleri alıntılanarak sunulurken tanımlayıcı, analitik, eleştirel ve tümevarımcı bir yaklaşım yolu izlenmiştir. Çalışma, el-Karadâvî'nin fıkhi ictihâdının, çok geniş hayat ve medeniyet alanlarını içinde barındırmakla erken dönem ictihâdlarından genişliği, kapsayıcılığı ve tecdid özelliğiyle ayırt edildiği, bununla birlikte dinî ilke ve kaidelere bağlı eleştirel fıkıh anlayışını benimsediği sonucuna varmıştır. el-Karadâvî, çeşitli eserleriyle, fakihlerin, üzerine ve fıkıh fetvalarını inşa ettikleri bazı ilkelerin sahih ilkeler, sabiteler ve ölçüler ışığında yeniden gözden geçirilmesi ve içtihat kapısının açılması çağrısında bulunmuş, böylece fıkıh mirasının yeniden değerlendirilmesine değerli katkılarda bulunmuştur. Başta Müslüman azınlıklar bağlamında çağdaş yaşamın gelişmelerini göz önünde bulundurarak pek çok sorunu çözen içtihat yenilenmesi ihtiyacına vurgu yapmıştır. Çalışma ayrıca genel olarak el-Karadâvî'nin fetva ve fıkıh yaklaşımının kuralları hakkında daha fazla araştırma yapılmasını ve çağdaş fıkıh meselelerini ve gelişmelerini çözmede onun fıkıh için geliştirmiş olduğu eleştirel çerçevenin çalışılmasını önermektedir."
