abstract: "Çalışma, İmam Şirazi'nin el-Lüma adlı kitabı ve İmam el-Cüveyni'nin el-Burhan kitabının kıyas bölümündeki müstakil içtihatlarına ek olarak kıyas babında ele aldığı bölüme usulcü yaklaşımı ve iki yaklaşım arasındaki ortaklık ve farklılıkları ortaya koyan usulcü metodolojilerini karşılaştırarak açıklamıştır. Bu çalışmayı diğer çalışmalardan ayıran nokta Şafiilerin başını çektiği usulcü bir ekole mensup iki imamın iki yaklaşımının karşılaştırılmasıdır. Karşılaştırmalı yöntemin yanı sıra tanımlayıcı, tümevarımsal ve analitik yöntemler kullanılmıştır. Araştırma bir giriş bölümü, iki ana bölüm ve bir sonuç bölümünden oluşmaktadır. Giriş bölümünde İmam Şirazi ve Cüveynî'nin bilimsel tercümeleri ve kitaplarının tanımı ele alınmıştır. Birinci bölüm, kıyas bölümünde İmam Şirazi ve Cüveynî'nin iki yaklaşımı arasında temel bir karşılaştırmayı, usulcü görüşleri akıl yürütme ile sunma ve aktarma biçimleri, anlaşmazlık konusunu açıklama, ifadeleri tartışma ve ihlal edenlere yanıt verme yolları ve görüşler için tercihlerini içermektedir. Son bölümde ise iki imamın kıyas, kıyasın aslı ve mahiyeti, kıyasın yetkisi ve çıkarımı, kıyasın bölümleri ve çeşitleri, kıyasın sebebini ispat etme yolları konularındaki görüşleri arasında karşılaştırma yapılmıştır. Bu çalışma sayesinde İmam Şirazi'nin, mantık ve teolojiye müdahale etmeden, kendisinden öncekileri takip ederek usulcü ekole daha fazla bağlı olduğu görülmüştür. O, usulcü bir bilgindir.Görüşlerinin ve usulcü tercihlerinin çoğunda Şafii düşünce ekolünden pek ayrılmayan bir bilim adamıdır. İmam Cüveynî ise çıkarımlarda bulunurken, akli ve kelami delillerin aracılığıyla usulcü fikirleri genişletmiştir. Bazen kendi ekolünün imamı Şafii ve hocası el-Bakıllani'nin fikirleriyle çelişmiştir. O, içtihat olarak, kelamcı olarak, usulcü olarak, özgür fikirli biri olarak, alışılagelmiş düşünce ekollerinin dışındadır. Ardından sonuç bölümü önemli sonuçları ve tavsiyeleri ifade etmiştir."
