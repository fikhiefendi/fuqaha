abstract: "Bu çalışma, 2011-2022 döneminde yerel para birimlerinin ABD dolarına sabitlenmesinin etkisini ve Körfez Arap ülkelerindeki para politikası üzerindeki etkisini analiz ederek Körfez İşbirliği Konseyi (KİK) ülkeleri için ABD'nin para politikasından bağımsız bir para politikası oluşturmanın uygulanabilirliğini incelemektedir. Çalışma, bu etkiyi üç ana eksende ölçmeye odaklanmaktadır: faiz oranları, döviz kurları ve Körfez merkez bankalarının parasal rezervleri. Çalışma, KİK ülkelerinde yerel para birimlerinin ABD dolarına sabitlenmesinin, ABD'deki faiz oranlarındaki değişikliklerin KİK ülkelerindeki faiz oranları üzerindeki etkisi açısından, bu ülkelerin para politikaları üzerinde bir etkisi olduğu sonucuna varmıştır. Ancak, KİK ülkelerinin yerel para birimlerini ABD dolarına sabitleyerek parasal istikrara yönelmeleri nedeniyle, para birimini bir döviz sepetine sabitleyen Kuveyt hariç, yerel para birimlerinin döviz kurları etkilenmemiştir. Çalışma ayrıca, parasal rezervlerin, ABD faiz oranlarındaki değişikliklerden etkilenmeden, öncelikle petrol gelirlerine bağlı olduğu sonucuna varmıştır. Çalışmada ayrıca İslam ekonomisi perspektifinden alternatif bir bakış açısı da ortaya konuldu."
