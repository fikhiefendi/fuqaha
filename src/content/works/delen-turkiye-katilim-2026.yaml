abstract: "Dijitalleşme, finans sektöründe hizmet sunum süreçlerini, müşteri ilişkilerini ve operasyonel faaliyetleri dönüştürerek bankacılık sektörünün rekabet yapısını yeniden şekillendiren stratejik bir unsur haline gelmiştir. Bilgi ve iletişim teknolojilerindeki hızlı gelişmeler doğrultusunda yaygınlaşan dijital bankacılık uygulamaları, bankaların operasyonel maliyetlerini azaltmalarına, hizmet kalitesini ve verimliliğini artırmalarına, müşteri deneyimini geliştirmelerine ve yeni müşteri segmentlerine ulaşmalarına önemli katkılar sağlamaktadır. Bu dönüşüm sürecinden etkilenen finansal alt sektörlerden biri de katılım bankacılığıdır. Özellikle Türkiye'de son yıllarda katılım bankalarının dijital dönüşüm yatırımlarına hız vermesi, dijitalleşmenin mali performans üzerindeki etkilerinin incelenmesini önemli bir araştırma konusu hâline getirmiştir. Bu çalışmanın amacı, Türkiye'de faaliyet gösteren katılım bankalarının dijitalleşme düzeyleri ile mali performans göstergeleri arasındaki ilişkiyi incelemek ve dijitalleşmenin finansal performans üzerindeki etkilerini ortaya koymaktır. Araştırma kapsamında Türkiye'de faaliyet gösteren katılım bankalarına ait 2021:09–2025:03 dönemini kapsayan aylık veriler kullanılmıştır. Çalışmada yer alan veriler, Türkiye Katılım Bankaları Birliği (TKBB), Bankacılık Düzenleme ve Denetleme Kurumu (BDDK) ve katılım bankalarının kamuya açık faaliyet raporlarından elde edilmiştir. Dijitalleşme düzeyini ölçmek amacıyla dijital bankacılık göstergelerinden hareketle Temel Bileşenler Analizi (PCA) yöntemiyle Katılım Bankaları Dijital Endeksi (KBDE) oluşturulmuştur. Mali performans göstergeleri olarak özkaynak kârlılığı (ROE) ve aktif kârlılığı (ROA) kullanılmıştır. Araştırma kapsamında katılım bankalarına ait dijital bankacılık göstergeleri ile mali performans verileri Augmented Autoregressive Distributed Lag (A-ARDL) sınır testi yaklaşımından aracılığıyla analiz edilmiştir. Elde edilen bulgular, değişkenler arasında uzun dönemli eşbütünleşme ilişkisinin bulunduğunu ve dijitalleşme ile mali performans arasında istatistiksel olarak anlamlı bir ilişkinin varlığını ortaya koymaktadır. Uzun dönem tahmin sonuçlarına göre aktif büyüklüğü ve ortalama kâr payı oranı hem özkaynak kârlılığı hem de aktif kârlılığı üzerinde pozitif ve istatistiksel olarak anlamlı etkilere sahiptir. Buna karşılık, dijitalleşme düzeyini temsil eden Katılım Bankaları Dijital Endeksi'nin her iki mali performans göstergesi üzerinde negatif ve istatistiksel olarak anlamlı etkiler oluşturmaktadır. Bu sonuç, katılım bankalarında dijital dönüşüm sürecinin ilk aşamalarında ortaya çıkan teknoloji yatırımları, altyapı harcamaları ve organizasyonel uyum maliyetlerinin kârlılık göstergeleri üzerinde baskı oluşturabildiğine işaret etmektedir. Bununla birlikte, kısa dönem analiz sonuçları dijitalleşmenin bazı dönemlerde pozitif etkiler üretebildiğini, dijital bankacılık uygulamalarının operasyonel verimliliği artırma, müşteri tabanını genişletme ve işlem hacimlerini yükseltme potansiyeline sahip olduğunu göstermektedir. Dolayısıyla dijitalleşmenin mali performans üzerindeki etkisinin doğrusal olmadığı; kısa dönemde maliyet baskıları nedeniyle olumsuz sonuçlar doğurabilmesine rağmen, dijital dönüşüm yatırımlarının etkin yönetilmesi hâlinde bankaların rekabet gücünü, kaynak kullanım etkinliğini ve finansal sürdürülebilirliğini destekleyebileceği değerlendirilmektedir."
