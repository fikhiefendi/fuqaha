abstract: "Elimizdeki bu çalışma İbn Ebû Zeyd el-Kayrevânî'nin usul konusundaki görüşlerini, fıkıh ve akide alanındaki kitapları aracıyla ortaya çıkarmayı amaçlamıştır. İstifade edilmesi amacıyla bu çalışmada gerek Mâlikî mezhebi ilim insanlarıyla ve gerek Hanefi, Şafii ve Hanbeli gibi diğer mezheplerin ilim insanlarıyla ittifak ve ihtilaf ettikleri noktalar ele alınıp incelenmiştir. Böylece, önde gelen ilim insanları arasında yer alması nedeniyle İbn Ebû Zeyd el-Kayrevânî'nin görüşleri, çalışmaları, fetvalarda izlediği yöntemleri ve usulî yönelişlerinin ortaya konulması hedeflenmiş ve bu usulleri güncel problemleri çözmede nasıl kullandığının öğrenilmesi amaçlanmıştır. Konu giriş bölümü ile birlikte beş başlık altında ele alınmıştır. Giriş bölümünde imam İbn Ebû Zeyd el-Kayrevânî'nin hayatı hakkında özet bilgi verilmiştir. Birinci bölümde imam İbn Ebû Zeyd el-Kayrevânî'nin teklifi ve vazi hükümler hakkındaki görüşleri ele alınmış ve teklifi ve şeri hükümlerin tanımlarına yer verilmiştir. İkinci başlık altında imam İbn Ebû Zeyd el-Kayrevânî'nin, hakkında ittifak ve ihtilaf edilen deliller hakkındaki görüşleri ele alınmıştır. Her bir delil ayrı bir başlıkaltında ele alınmıştır. Üçüncü başlık altında, mutlak, mukayyet, am, has, emir ve nehiy, mantuk ve mefhum lafızları hakkında imam İbn Ebû Zeyd el-Kayrevânî'nin görüşleri ele alınmıştır. Dördüncü başlık altında imam İbn Ebû Zeyd el-Kayrevânî'nin ictidad ve taklid konuları hakkında görüşleri ele alınmıştır. Beşinci ve son başlık altında imam İbn Ebû Zeyd el-Kayrevânî'nin usul kaideleri hakkında görüşleri ve usul kaideleri ile fıkıh kaideleri arasındaki farklar ele alınmıştır. Bunun yanında bu bölümde imam İbn Ebû Zeyd el-Kayrevânî'nin tercih ettiği fıkhi kaidelere uygulamalı örnekler sunmak için özel bir başlık ayrılmıştır. Çalışma, ulaşılan sonuçların kaleme alındığı sonuç bölümüyle tamamlanmıştır."
