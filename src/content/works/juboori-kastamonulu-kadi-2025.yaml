abstract: "Son yıllarda Osmanlı Türkçesiyle kaleme alınmış dinî içerikli mensur eserler hem dil tarihi hem de dinî kültür açısından dikkat çeken çalışma alanlarından biri hâline gelmiştir. Bu eserler yalnızca dönemlerinin dinî düşüncesini değil, aynı zamanda halkın anlayabileceği dilde yazıldıkları için Türkçenin din dili olarak kullanımını gözler önüne sermektedir. Bu tür metinler, söz varlığı, anlatım biçimi ve dil yapısı açısından dilin gelişimine ışık tutmakla kalmaz; aynı zamanda İslam ilim geleneği içerisinde Türkçenin kullanımı hakkında da önemli veriler sunar. Bu çalışmada, Hanefî fıkhının temel esaslarını halkın anlayabileceği bir üslupla aktaran Hedíyetü'l-İĥvān ve ʿAšíyetü'ŝ-Ŝıbyān adlı eser 17. yüzyıla ait fıkıh yazması ele alınmıştır. On bir farklı nüshası bulunan eserin en eski ve sağlam olan nüshası esas alınarak tenkitli metni oluşturulmuş; ayrıca yazmanın dil, imlâ, söz varlığı ve şekil özellikleri ayrıntılı biçimde incelenmiştir. Eser hem içerdiği fıkhî bilgiler hem de dil özellikleri açısından dönemin ilmî ve kültürel yapısını yansıtan önemli bir kaynaktır. Bu tez çalışması; Giriş, İnceleme, Tenkitli Metin, Dizin ve Sonuç olmak üzere beş ana bölümden oluşmaktadır. Giriş bölümünde dönem fıkıh yazmaları genel hatlarıyla ele alınmış; İnceleme bölümünde dil bilgisel çözümlemelere yer verilmiştir. Metin bölümünde Tenkitli Metin yapılmış; Dizin bölümünde metindeki kelimeler anlamları ve kökenleriyle sunulmuştur, Sonuç bölümünde ise eserin dil özelliklerini, dizini ve zengin söz varlığını değerlendirmiştir."
