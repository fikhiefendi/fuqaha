abstract: "Cihâd kavramı, İslâm'ın doğuşundan günümüze kadar, bünyesinde barındırdığı anlam çeşitliliğiyle hem tarihsel ve jeo-politik olarak hem kültürel ve teolojik olarak hem de disiplinler arası yaklaşım ve perspektiflere göre açıklanmaya—ve sıklıkla da (hegemonik ve jakoben tarzda) tarif edilmeye çalışılmıştır. Etimolojik katmanındaki“iyi, güzel, hak, doğru, vb. değerleri hem teoride hem de pratikte önce ve esas olarak öz benlikte gerçekleştirmek üzere ortaya konulan tüm çaba, gayret, uğraşı ve yoğunlaşma”yı ifade eden kavram, tarihsel şartlar ve kültürel konjonktürlere göre yeniden“inşa”edilme süreçlerine maruz kalır. Öyle ki; modern süreçlerden itibaren sosyal ve beşeri bilimlerin farklı alanlarında ele alınan—ve alınması gereken— bir kavram olarak karşımıza çıkmaktadır. Bu süreçlerde ulus devlet anlayışının kuşattığı çerçevelerde, postkolonyal durumun oluşturduğu jeo-politik konfigürasyonlarda, post/modern kültür politiğin flu kombinasyonlarında ve küreselleşme eko-politiğinin standartlaştırma arayışlarında cihâd kavramı yeniden inşa süreçlerine sokulur. Bu süreçlerde kavramın tanımı, işlevi ve hedefi yeni ve farklı uyarlamalar ile yeniden ortaya konulur. Cihâd kavramının, Müslüman toplumların tarihsel şartlar altındaki durumları göz önünde tutulduğunda savaş hukukuna ait bir terim olarak ele alındığı görülür. Buna bağlı olarak klasik dönemde Dârü'l-İslâm (“Barış Yurdu”) ve Dârü'l-Harb (“Savaş Yurdu”) diyalektik karşıtlığı ekseninde temellendirilen kavram, modern süreçlerde modernitenin dikotomik çerçevesine paralel olarak savunmacı (apolojetik) tutum ile neo-selefî ya/ ya da tavır ekseninde inşa sürecine girmiştir. Çalışmanın metodik sorusu şudur: Post/modern durumda, cihâd epistêmesi / fıkhı nasıl bir dönüşüm süreci içinde yeniden ele alınmakta ve inşa edilmektedir? Veya çağdaş cihâd nosyonunun yeniden inşası, geleneksel olana ve modern döneme post/modern bir reaksiyon mudur? Bu çalışmanın ana tezi, cihâd konseptinin post/modern görünümünün, klasik fıkıh geleneği ve modern dönemin anlayışlarına karşı bir reaksiyon olarak şekillendiği, bu süreçte cihâd kavramının toplumsal, siyasal ve teolojik düzeylerde yeniden anlamlandırılarak, geleneksel sınırlarının ötesine geçtiği ve farklı bir epistemik ve aksiyolojik boyut kazandığıdır."
