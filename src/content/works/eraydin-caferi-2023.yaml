abstract: "Bu çalışma Caʻferî fıkıh usûlünde Murtazâ el-Ensârî ekolünün delil anlayışını konu edinmektedir. Ekolün kurucusu olan Şeyh Murtazâ el-Ensârî (öl. 1281/1864), kendisinden bir önceki nesil âlimlerinin çabalarına da dayanarak Caʻferî fıkıh usûlünü ana karakterine bağlı kalmak suretiyle yeniden yapılandırmıştır. Ensârî'nin usûlü yeniden yapılandırma çabasının en yoğun ve görünür olduğu alan ise deliller bahsidir. Mükellefin psikolojik durumunu esas alarak ulaştığı bilgi değeri açısından delilleri hiyerarşik bir düzenlemeye tabi tutan Ensârî mantık ve felsefe kökenli terminolojiyi kullanarak bu alanda metot, kavramlar, teoriler ve meseleler düzeyinde bir dönüştürme sağlamış ve adeta klasik ile modern dönem arasında bir köprü görevi görmüştür. Onun deliller bahsi başta olmak üzere usûl ilmine dair ortaya koyduğu sağlam temeller, yine onun merciʻ-i mutlak olma avantajını kullanarak oluşturduğu ilmî ortamda yetişen müctehidler tarafından ana hatlarıyla benimsenmiş ve yeni katkılarla güçlendirilerek mezhebin hâkim usûl anlayışı konumuna yerleşmiştir. Tarihte ve günümüzde ciddi bir Müslüman kitlenin amelî mezhebi olan ve halen İran İslam Cumhuriyeti Devleti'nde hukukun dayanağını teşkil eden Caʻferî mezhebinin hâkim usûl anlayışını temsil eden Ensârî ekolünün ana hatlarıyla ilmî çevreler tarafından bilinmesi ve fıkıh usûlü ilminin merkezinde yer alan deliller hakkındaki yaklaşımlarının anlaşılması gerektiği düşüncesiyle yola çıkan çalışmamız, giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın önemi, amacı, yöntemi ve kaynakları ortaya konulmuştur. Birinci bölümde ekolün bağlı olduğu Caʻferî fıkhı ve söz konusu fıkhın dayandığı usûl ilmi genel hatlarıyla ortaya konulmuş, ardından Ensârî ekolü ve usûl anlayışı hakkında tanıtıcı bilgilere yer verilmiştir. İkinci bölümde Ensârî ekolünün delil anlayışının temelinde yer alan epistemolojik zemin irdelenmiştir. Üçüncü bölümde ise ekolün yeni bir epistemolojik zemine oturttuğu deliller hiyerarşisi izlenerek onun her bir delil hakkındaki yaklaşımı üzerinde durulmuştur. Sonuç bölümünde ise Ensârî başta olmak üzere ekol âlimlerinin, devraldıkları ilmî mirastan faydalanarak aklî ilkeler temelinde, yeni kavramlar, yeni meseleler ve yeni bir sistematikle Caʻferî mezebine özgün bir delil anlayışı ortaya koydukları, bu minvalde tahkîk yöntemi ile devraldıkları gelenekle hesaplaşarak daha önce yaygın olarak kabul edilen bazı delilleri yeniden temellendirdikleri, icmâ ve şöhret gibi özellikle füruʻ-i fıkıhta önemli bir boyutta işlevsel olan bazı delillerin hüccet olamayacağına hükmettikleri, akıl delilini hem şerʻî hüküm istinbâtı noktasında hem de bazı delilleri ispat noktasında daha önce olmadığı kadar işlevsel hale getirdikleri, usûl-i ameliyyeyi sistemleştirerek müctehidin konumunu güçlendirip fıkha geniş bir alan açtıkları ve bütün bunları yaparken de mezhebin ana karakterine bağlı kaldıkları kanaatine varılmıştır."
