abstract: "1980'li yıllarda Türk finans sistemine dahil olan ve konjoktürel etkileriyle beraber son zamanlarda önemli bir büyüme potansiyeli gösteren katılım bankaları, faiz hassasiyeti sebebi ile ekonomide değerlenemeyen atıl fonların reel ekonomiye dahil edilerek değerlenmesinde etkin bir rol oynamaktadır. Öncelikle İslam ülkelerinde faaliyet göstermeye başlayarak İslami usül ve esasları ilke olarak benimseyen katılım bankalarının esas ortaya çıkış noktası faizsizlik ilkesi olarak kabul edilmiştir. Kâr-zarar iştiraki vasıtasıyla ekonomiyi destekleyerek, kendi ekseninde gerçekleştirdiği faaliyetleri ise İslam Dini'nin emirlerine ve bu sayede faizsiz ya da İslami bankacılık şartlarına göre devam ettirmektedir. Uluslararası anlamda gelişme gösteren katılım bankaları, Türkiye'de de popülerlik kazanarak gelişimini sürdürmüştür. Yaşanan gelişim süreci içinde sermayenin uluslararası dolaşımındaki engellerin kalkarak piyasaların küreselleşmesi ve teknolojik gelişmelerin de etkisi ile risk unsuru finans sektörü içinde önem kazanmıştır. Özellikle 1970‟li yıllardan itibaren Bretton Woods sisteminin çökerek dalgalı kur sistemine geçilmesi ve petrol krizlerinin de ortaya çıkardığı fiyat dalgalanmalarında risklerin yönetimi ve belirsizliklerin yaratacağı kayıpların etkilerinden korunmak amacıyla türev ürünlerin kullanımı finansal sistemde etkin bir rol oynamıştır. Günümüzde ise 2019 yılından itibaren küresel bir boyut kazanan Covid-19 pandemisiyle birlikte oluşan belirsiz ortam ülke ekonomilerinde ve finans sektörü üzerinde kırılganlıkları oluşturarak, küresel piyasalarda dengesizlikleri doğurmuştur. Bu belirsiz sürecin akabinde ekonomik faaliyetlerin ve finansal sektörün karşılaşacağı risklerin yönetimi türev ürünler aracılığıyla gerçekleştirmiştir. Çalışmada finansal sistem içinde konvensiyonel bankacılığın yanısıra Dünya'da ve Türkiye'de önemli bir gelişme gösteren katılım bankacılığı ve katılım bankacılığında risk yönetiminde etkin bir rol oynayan türev ürünlerin kullanımı farklı boyutları ile incelenmiştir. Bu kapsamda tüm dünyayı etkileyen ve finansal kırılganlık yaratan Covid-19 pandemisinin ekonomik ve sosyal etkileri detaylı bir şekilde incelenerek reel piyasalara fon aktarımında etkin bir rol oynayan bankacılık sistemi ve özellikle katılım bankacılığı üzerindeki olumsuz etkileri ile risk yönetim sistemlerinden türev ürünlerin kullanımı üzerindeki etkileri detaylı bir şekilde incelenmiştir. Çalışmada katılım bankalarında türev ürünlerin kullanımı ve bu tür ürünlerin kullanımının özellikle ciddi risk unsuru oluşturan ve küresel boyutta etkili olan Covid-19 pandemisi ve sonrasında sistemin karşılaşacağı bu tür küresel risklere karşı etkin kullanılabilirliğinin değerlendirilmesi amaçlanmıştır."
