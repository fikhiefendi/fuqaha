abstract: "Şer'iyye Sicilleri, Osmanlı Devleti'nin merkez ve taşrada uyguladığı idari, siyasi ve içtimaî politikaları göstermek ve bölgelerdeki insan ilişkilerine şahit olmak için iyi belgelerdir. Bu nedenle siciller tarih, hukuk, askeri tarih, iktisadi ve kültür tarihi gibi kaynak olma özelliğini göstermektedir. 1155-1156(1742-1743) yıllarını kapsayan 56 Numaralı Konya Şer'iyye Sicilin'de bir hayli belge bulunmaktadır. Bu belgeler içerisinde fermânlar, beratlar, buyruldu, boşanma, darb ve hırsızlık davaları gibi belgeler bulunmakla birlikte, bu sicilde miras davaları, mülk satışları ve vasi tayini ile alakalı belgeler fazla yer işgal eder. 56 Numaralı Sicil çalışması giriş ve metin kısımlarından oluşmaktadır. Giriş bölümünde defterdeki belgeler konularına göre tasnif edilerek belge türleri ve muhtevaları hakkında bilgiler verilmiştir. Metin kısmında ise belgelerin transkripti yapılmış, belgedeki hicri tarihler miladi tarihe çevrilmiştir."
