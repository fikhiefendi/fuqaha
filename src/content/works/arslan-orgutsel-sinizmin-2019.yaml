abstract: "Küreselleşme ve teknolojinin hızlı gelişmesiyle birlikte artan rekabet örgütlerde insan faktörünü çok daha önemli hale getirmektedir. İnsanın örgütle alakalı davranışlarını bilimsel yöntemler kullanarak incelemek hızla değişen dünyada örgütlere önemli avantajlar sağlamaktadır. Örgütsel sinizm çalışanların çalıştığı örgüte yönelik olumsuz davranış ve tutumları olarak tanımlanmaktadır. Y kuşağı ise doğum aralıkları arasında net bir anlaşma olmamasına rağmen 1981-2000 yılları arasında doğmuş kişiler olarak ifade edilmektedir. İş hayatının en genç ve sayıca egemen nesli olan Y kuşağı tüm dünyada ağırlıklarını hissettirerek birçok işletmenin çalışma yöntemlerini yeniden gözden geçirmelerine neden olmaktadır. Bu araştırmanın amacı, örgütsel sinizmin Y kuşağı çalışanlarına etkilerini ortaya koymaktır. Araştırma ile ilgili anketlere, Türkiye'de faaliyet gösteren katılım bankalarında çalışan 202 Y kuşağı çalışanı katılmıştır. Anketlerde genel (kişilik) sinizm ve örgütsel sinizmle alakalı sorular bulunmaktadır. İşgörenlerin genel (kişilik) sinizmlerinin ölçülmesine yönelik Wrightsman'ın (1992) geliştirmiş olduğu ve 2007 yılında Türkçeye Erdost vd. tarafından çevrilen hayata bakış açılarının ölçülebilmesi için 10 soruyu kapsayan genel (kişilik) sinizm ölçeğinden faydalanılmıştır. İşgörenlerin örgütsel sinizmlerinin ölçülebilmesi amacıyla Brandes'in (1997) geliştirmiş olduğu ve 2007 yılında Erdost vd. tarafından Türkçeye çevrilen 14 soruyu kapsayan ölçekten faydalanılmıştır. Örgütsel sinizme ait ölçekte bilişsel, duyuşsal ve davranışsal boyutlar yer almaktadır. İstatistiksel analizler, SPSS istatistik programına girilen veriler ile ulaşılan sonuçlar vasıtasıyla yapılmıştır. Araştırmanın sonucunda, örgütsel sinizmin Y kuşağı çalışanlarına etkileri ortaya konmuştur."
