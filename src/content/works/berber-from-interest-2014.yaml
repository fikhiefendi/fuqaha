abstract: "Bu çalışmada Osmanlı Devleti'nin son döneminde ribanın durumu incelenmektedir. Bunun için de murabaha kavramı analiz edilerek Osmanlılar arasındaki kredi ilişkilerinin sosyal tarihi ortaya çıkarılmaya çalışılmıştır. Mezkur mevzuya değinen akademik çalışmalarda ribaya sadece iktisadi ya da fıkhi açılardan yaklaşıldığından ehemmiyet arz eden sosyal yansımalar göz ardı edilmiştir. Riba ya da günümüzde daha sık kullanıldığı itibarıyla faiz, İslam dininde yasaklanmış olduğu için Osmanlılar bazı fıkhi çarelere başvurmuşlardır. Böylelikle kredi işlemlerinden belirli bir miktar getiri elde edip, yasağı çiğnememiş oluyorlardı. Bu fıkhi çarelere daha çok yetim mallarının korunması ve vakıf paraların işletilmesi gibi ihya/hayır işlerine yönelik kredi ilişkilerinde başvuruluyordu. Tebaa arasındaki kredi ilişkilerine de aynı hassasiyetle yaklaşılıp bu uygulamaları kullanmaları istenmekteydi. Aynı zamanda bu kredi getirilerine bir sınır koyulmuştu. Osmanlılar yasak olan ribadan kaçınıp helal bir getiri olarak gördükleri bu fazlalığa murabaha demekteydi. Osmanlı sosyo-ekonomik yaşamındaki kredi ilişkilerini gözlemlemek için bu ilişkilerde kullanılan yöntemleri ve bunları uygulayan aktörleri tanımlamak gerekmektedir. İncelendiğinde görülüyor ki, literatürün aksine belirli bir tanınmış grup olarak tefeci sınıfı yoktur. Bunların her gruptan olabileceği; yalnızca sarraf, tüccar ya da gayrimüslim olmadıkları da anlaşılmıştır. Tefecilik davalarına baktığımızda ise devletin borçludan yana taraf tutarak, borç yükünü azaltmak için fahiş faizi düşürdükten sonra borcu uzun vadeli taksitlere böldüğünü görmekteyiz. Tefeciliğin yoğun olarak görüldüğü kırsal bölgelerde ise on dokuzuncu yüzyılın ikinci yarısıyla birlikte tefecilik karşıtı yeni uygulamalar görülmektedir. Öncelikle murabaha nizamnameleri ile kadimden beri yüzde on beş olan getiri oranı düşürülmüş ve uygun kredi dağıtmak amacıyla kooperatif/bankalaşma tecrübesi yaşanmıştır. Bu gelişmeler sosyal harmoniyi korumak ve iktisadi kalkınmayı başarılı kılmak için uygulanmışsa da gözükmektedir. Sonuç olarak gittikçe azalan şeriata uygunluk endişesiyle değişen riba algısı ile birlikte, sosyal hayatta tefecilerin aleti haline gelmiş murabaha kavramının doğrudan fahiş faiz olarak anılmasına sebep olmuştur. ribadan kaçınma"
