abstract: "Beşerî hayatı ilahi nizamla düzenleyen İslam hukukunun, teoriden pratiğe geçerek topluma yansıyan karşılığı fetvadır. Fetva, insanların yaşantılarını Allah hakkına ve kul hakkına riayet ederek düzenleyen hukuk sisteminin en önemli unsurlarından biridir. Bu sebeple sosyal bir varlık olan insan, yaşamını bir nizam içinde sürdürebilmesi için hukuka ve hukukun önemli bir unsuru olan fetvaya hayatının her aşamasında ihtiyaç duymuştur. Toplumun bu vazgeçilmez ihtiyacı, İslam tarihi boyunca Şeyhülislam, kadı ve müftü gibi fetva makamlarınca karşılanmıştır. Bu görevleri yerine getirenler, Osmanlı fetva literatürüne büyük katkılar sağlayacak çok sayıda fetva mecmuası kaleme almışlardır. Bu meyanda hazırlanan eserlerden biri de Hanya Müftüsü Velîzâde Mustafa Efendi'ye ait olan Fetâvâ-yı Velîzâde'dir. Görev yaptığı süre boyunca karşılaştığı meseleleri kayda alan Mustafa Efendi, hazırladığı eseriyle Osmanlı fetva geleneğini değerlendirme imkânı sunan önemli bir çalışma ortaya koymuştur. Fetva mecmuaları yalnızca bir fıkıh kitabı değil, yazıldığı dönem ve bölgenin hukuk anlayışını ortaya koyan tarihi birer vesikadır. Nitekim mezkûr eserler klasik bir fıkıh okumasından öteye geçilerek, kaleme alındığı bölgenin tarihiyle birlikte incelendiğinde birçok soruya cevap verir mahiyete sahiptirler. Zamana ve zemine göre fetvaların şekil alması neticesinde güncel fıkıh meselelerine çözüm üreten fetva mecmuaları, günümüz İslam hukukçularının çokça başvurduğu kaynaklardandır. Çalışmamızda konu edindiğimiz Fetâvâ-yı Velîzâde adlı eser de Rum ahalinin yoğunlukla yaşadığı Girit/Hanya bölgesinde kaleme alınmış ve Hristiyan kültürünün fetva makamlarına yansımalarına rastladığımız eserlerden biridir. El yazması olarak kütüphanede çalışılmayı bekleyen bu eserin tahkiki ile birlikte tahlili de yapılarak günümüz ilim dünyasının istifadesine sunulmuştur."
