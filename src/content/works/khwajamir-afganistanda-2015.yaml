abstract: "VII. asırda İslam dininin bugünkü Afganistan coğrafyasında yayılmaya başlamasıyla beraber, İslam'dan önce söz konusu coğrafyada mevcut olan dinlerin yerini İslam alırken o dinlere ait hukukun yerini de İslam hukuku almıştır. Afganistan'da ilk dönemlerde diğer İslam ülkelerinde olduğu gibi fıkıh kitapları ve fetva kitaplarına göre hüküm verilmiştir. 1921 yılında Afganistan tarihinde ilk defa ta'zîr cezası ile ilgili kanun çıkartılmış, 1976 yılına gelindiğinde ise daha kapsamlı bir ceza kanunu hazırlanıp yürürlüğü girmiş ve bu kanun zaman zaman revize edilerek günümüze kadar yürürlükte kalmaya devam etmiştir. Ceza hukukunun kanunlaştırılmasının başlamasından günümüze kadar çıkartılan bütün anayasalarda, hiçbir kanunun İslam dinine aykırı olamayacağı belirtilmiştir. Bu çalışmada bugünkü Afganistan'da İslam ceza hukukunun kanunlaştırma süreci, Afgan ceza hukukunun kaynakları ve günümüzde yürürlükte olan 1976 tarihli Afgan Ceza Kanununun kısaca muhtevası ele alınıp İslam hukukuyla uygunluğu değerlendirilecektir. Anahtar Kelimeler: Afganistan, Ceza hukuku, kanunlaştırma, Hanefi fıkhı, İslam hukuku."
