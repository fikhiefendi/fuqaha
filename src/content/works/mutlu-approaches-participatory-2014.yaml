abstract: "Bankacılık sektörü finansal sisteme finansal aracılık etmektedir. Katılım bankaları da bu finansal sektörde faizsiz finans sistemine aracılık etmektedir. Kar ve zarara katılma esasına göre çalışan ve risk paylaşımını öngören sistem, dünyada daha çok faizsiz bankacılık olarak bilinirken, ülkemizde katılım bankacılığı olarak bilinmektedir. Katılım bankacılığı, dünya genelinde“İslâm bankacılığı”olarak adlandırılmaktadır. Ayrıca“faizsiz bankacılık ”(interest-free banking) terimi de aynı anlamı yani katılım Bankacılğı teriminin farklı bir ifadesidir. Faizsiz bankacılık, İslâm bankacılığı ve katılım bankacılığı terimlerinin üçü de aynı sistemi ifade etmek üzere kullanılmaktadır. İsimdeki“katılım”sözcüğü yapılan bankacılık türünün kar ve zarara katılma prensibine dayalı bir bankacılık olduğunu ifade etmek için kullanılmaktadır. Faizsiz bankacılık modelini temel alan Katılım Bankaları, fon fazlası olan ekonomik birimlerden fon gereksinimi olan ekonomik birimlere finansal kaynakların faizsiz yöntemlerle aktarılması esasına dayanmaktadır. Müslüman toplumlarda dini hassasiyet taşıyan halk, faiz esasına göre çalısmaları nedeniyle finansal kurumlardan uzak durmuşlardır. Tasarruflarını ekonomiye aktarmayıp altın veya dövize yahut gayrimenkule yatırmışlardır. Bu durumda üretime katkı sağlamayan alanlara yöneldiği için atıl kalmışlardır. Bu bankacılık modeli inançlarına rağmen dinin getirdigi faiz yasağına uymaması sonuçlarını ortadan kaldıracak şekilde yeni bir alternatif finansal model olmustur. Bu kurumlar, İslâmi kesimin dini kurallara uygun bankacılık hizmetine olan ihtiyaçlarından doğmuş ve hızla gelişmişlerdir."
