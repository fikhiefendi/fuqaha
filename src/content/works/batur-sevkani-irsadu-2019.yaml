abstract: "Müçtehitlerin genel olarak üzerinde ittifak ettikleri şer'î kaynaklar kitap, sünnet, icma ve kıyas olmak üzere dörttür. Bu temel kaynaklardan birisi olan Sünnet'in bir kısmını teşkil eden ef'âlu'r-rasûl de, fıkıh usûlünun önemli konularından biridir. Dinî hükümlerin Kitap'tan sonra ikinci sırada gelen Sünnet'ten istinbat edilmeleri, bu konunun bilinmesinin nedenli gerekli olduğunu ortaya koymaktadır. Şer'î hükümlerde taklidi kabul etmeyip, içtihad yoluyla hükümleri belirlemeyi prensip edinen Şevkânî, diğer ilimlerde olduğu gibi fıkıh ve fıkıh usulü ilimlerinde de önemli bir farklılığa sahiptir. Bu farklılığı sergilediği alanlardan birisi de fıkıh usulü ile ilgili günümüze ulaşan“İrşâdü'l-fuhûl ilâ tahkiki'l-hak min 'ilmi'l-usûl”adlı eseridir. Memzûc metodla yazılmış yani mütekellim ve fukahâ usulünün herbirinden istifade edilerek kÂleme alınmış usûl kitaplarındandır. Tek cilt olarak basılan eserin 16 sayfası ef'âlu'r-rasûl konusuna ayrılmıştır. Tezimizde Şevkânî'nin usulü ile ilgili genel kanaatin yanında onun ef'âlü'r-rasûl hakkında görüşü verilmeye çalışılmıştır. Zira onun bu konudaki görüşleri günümüzde kendilerine selefi, neo selefi veya reformist diyen bazı anlayışlara ilham kaynağı olmaktadır. Tezimizde, Şevkânî'nin usulde mütekellimun ve fukahâ metodunu mezc eden“İrşâdü'l-fuhûl ilâ tahkiki'l-hak min 'ilmi'l-usûl”adlı eseri çerçevesinde ef'âlu'r-rasûl konusu işlenmektedir. Bu çerçevede memzûc usulle ef'âlu'r-rasûl kavramı, kısımları ve ilgili konular ele alınıp tahlil edilmeye çalışılmıştır. Çalışmamızda, genelde kavramlara yüklenen anlamlar ile ilgili farklı ekoller arasındaki ayrılıklar ve tartışmalar Şevkânî'nin bakış açısı ile tahlil edilip sunulmaktadır. Anahtar Sözcükler Şevkânî, Rasûl, Nebi, Ef'Âlu'r-Rasûl"
