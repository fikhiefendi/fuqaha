abstract: "Mevcut çalışmanın temel amacı, 2008 yılı I. Çeyrek 2016 Üçüncü çeyreğinde Türkiye'de faaliyet gösteren üç büyük katılım bankasının finansal tablolarını inceleyerek katılım bankalarının karlılık, faiz oranlarındaki değişimlerin arasındaki ilişkiyi analiz etmektir. Çalışmanın amaçlarına ulaşmak için panel veri analizi ve panel eşbütünleşme tahmini tekniği benimsenmiştir. Kao eşbütünleşme testlerinin sonuçları ilişkin göstergeler eşbütünleşiktir olduğunu göstermektedir. Ayrıca, faiz oranının kârlılık katsayısı FMOLS tarafından tahmin edilmiştir. Ampirik analiz faiz oranı değişiklikleri katılım bankalarının karlılık ile anlamlı pozitif ilişki olduğunu göstermektedir."
