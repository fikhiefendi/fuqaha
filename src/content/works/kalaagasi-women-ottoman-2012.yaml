abstract: "Bu çalışma Mahfil-i Şer'iyyat Mahkemesi 1 ve 30 nolu sicillerinde geçen yetmiş iki tane kadın davaları esas alanırak hazırlanmıştır. Öncelikle, davaların Arap alfabesinden Latin alfabesine çevirisi yapılmıştır. Daha sonra, Davacının veya davalının adı, oturduğu yer, dava nedeni, davanın özeti ve mahkeme kararı başlıkları esas alınarak tablosal bir çalışma yapılmıştır.Sicildeki davalar esas alınarak Osmanlı devletinde kadınların sahip oldukları hak ve özgürlükler değerlendilirilmeye çalışılmıştır. Kadınların Osmanlı Hukuk sisteminde, mahkemeye özgürce direkt kendileri veya vekil tain ederek rahatlıkla başvurdukları görülmektedir. Diğer taraftan, kadınların dava açtıkları insanların aralarında kan bağına sahip oldukları, baba, kardeş veya yakın akrabalarının olması dikkat çekici olarak karşımıza çıkmaktadır."
