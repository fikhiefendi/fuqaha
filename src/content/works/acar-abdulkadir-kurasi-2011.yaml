abstract: "Çalışmada ilim çevrelerinde şimdiye kadar daha ziyâde Hanefi âlimleri bibliyografı olarak tanınan Abdulkâdir Kuraşî (775/1373)'nin hadis ilmindeki yeri ve hadise dair el-İnâye bi ma'rifeti ehâdîsi'l-Hidâye adlı eseri konu edilmiştir. Kütüphânelerde yedi asırdır yazma hâlinde bekleyen el-İnâye'nin hadis ilimleri açısından değerini tespit etmek sûretiyle bir taraftan bu eserden ilim dünyasını haberdar etmek ve diğer taraftan da müellifin hadisçilik yönünün ortaya çıkarılması hedeflenmiştir. Araştırmada descriptif bir yöntem takip edilmiştir. Öncelikle Kuraşî'nin öğrenim hayatı ve eserlerinden yola çıkılarak hadis formasyonu araştırılmış ve daha sonra da el-İnâye adlı eseri hem şekil hem de muhtevâ açısından incelenerek aynı alandaki diğer iki çalışmayla mukayese edilmiştir.Öğrenim hayatının büyük bölümünü hadis ilimleriyle geçiren ve eserlerini de daha çok bu alanda telif eden Kuraşî'nin biyografî, ricâl ve fıkıh sahalarında da yetkin olduğu görünmektedir. Yarısı hadise dair olmak üzere yirmi civarındaki eserlerinin en hacimlilerinden olan el-İnâye, eksiksiz olarak günümüze intikal eden hem Hidâye hadisleriyle ilgili ve hem de genel olarak tek eser üzerine yapılan ilk tahrîc kitabı niteliğini haizdir. Bu eseri dolayısıyla Kuraşî, kendisinden sonra aynı konuda çalışma yapan çağdaşı Zeyla'î tarafından kıyasıya eleştiriye maruz kalmıştır. Hidâye'de yer alan hadislerin sadece sahîhini sakîminden ayırmayı amaçlayan ve bu rivâyetlerin hangi kaynaklarda bulunduklarından ziyâde nitelikleriyle ilgilenen el-İnâye, mezhebin rivâyete dayalı delillerini bütün yönleriyle ortaya koymaya çalışan Nasbu'r-râye'ye göre gerek muhtevâ ve gerekse sonuç açısından daha zayıftır."
