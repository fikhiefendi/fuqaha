abstract: "Bu çalışma, Avrupa Fetva ve Araştırma Konseyi tarafından verilen fetvaların Makâsıdü'ş-Şerîa bağlamında maslahat ve mefsedet kavramları açısından nasıl değerlendirildiğini incelemektedir. Araştırma, şeri hükümlerin çağdaş Avrupa toplumundaki Müslümanlar için uygulanabilirliğini analiz etmek amacıyla hem teorik hem de pratik yaklaşımlar içermektedir. Müslümanların karşı karşıya olduğu hukuki ve sosyal koşulları göz önünde bulundurarak, Konsey'in fetvalarında maslahat ve mefsedet dengesini nasıl sağladığına dair kapsamlı bir değerlendirme yapılmaktadır. Araştırma, betimsel ve analitik yöntemler kullanılarak Konsey'in fetva metodolojisinin anlaşılmasını sağlamayı, tarihsel çerçevede fetva mekanizmasının gelişimini incelemeyi ve tümevarımsal bir yaklaşımla maslahat-mefsedet dengesini nasıl kurduğunu ortaya çıkarmayı hedeflemektedir. Bunun yanı sıra, eleştirel bir değerlendirme yapılarak Konsey'in fetvalarının etkinliği incelenmekte ve iyileştirme önerileri sunulmaktadır. Sonuçlar, Konsey'in Avrupa'daki Müslümanların toplumsal gerçekliğini dikkate alarak fıkhî hükümleri uygulamakta hassas bir yaklaşım benimsediğini göstermektedir. Kadınlara yönelik fetvalarda hem İslam'ın temel prensipleri korunmuş hem de Avrupa'daki sosyal yaşamın gereklilikleri göz önünde bulundurularak kolaylaştırıcı hükümler sunulmuştur. Ayrıca, boşanma ve aile hukuku gibi konularda, Müslümanların haklarını koruyacak ve toplumdaki entegrasyonlarını kolaylaştıracak çözümler benimsenmiştir. Araştırma, Konsey'in maslahat ve mefsedet kavramlarını ele alış biçimine dair değerli geri bildirimler sağlayarak, fetva sürecinin daha sistematik ve kapsamlı bir şekilde geliştirilmesine katkıda bulunmayı amaçlamaktadır."
