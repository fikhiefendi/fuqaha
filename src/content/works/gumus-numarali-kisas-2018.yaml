abstract: "Bir kişinin canına kast ederek yaşamına son vermek ağır cezadır. Bu suçun hukuktaki cezası kısas etmektir. Kısas yapılamadığında fail bedenî ve maddî bir bedel ödemek zorunda kalmıştır. Osmanlı Devleti ceza hukukunda Tanzimat öncesinde ve sonrasında sıkça başvurulan cezalardan olmuştur. Tanzimat'ın ilanından sonra kısas cezaları için ayrı defterler tutulmaya başlanmıştır. Başbakanlık Osmanlı Arşivi'nden 989 Numaralı Divân-ı Hümâyûn Defterleri kataloğuna kayıtlı, kısas cezasını içeren 1840-1909 yıllarında tutulmuş 10 adet Nefy ve Kısas Defterleri bulunmaktadır. Osmanlı Arşivi'nden temin edilen H.1291-1327/M.1874-1909 tarihli 10 Numaralı Kısas Defteri Nizamiye Mahkemelerinin hükümlerini içermektedir. Çeşitli sebeplerle adam öldürme, eşkıyalık, ev kundaklama, etnik kargaşa, 31 Mart Vakası ve Adana-Ermeni Olaylarına dair hükümler mevcuttur. Bu suçlarda adam öldüren, toplum huzurunu bozmak isteyen ve devlete hainlik yapanlar kısas cezasına uğramıştır. Deftere intikal etmiş davalarda kısas cezasının yanında, kürek, kal'a-bendlik ve hapis cezaları da bulunmaktadır. Çalışmanın Osmanlı Devleti ceza hukuku tarihine ve sosyal durumu üzerine çalışmak isteyenlere fayda sağlayacağını temenni ederiz."
