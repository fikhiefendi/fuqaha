abstract: "Bu çalışmanın amacı, İslam hukukunda hak ve sorumluluk ilişkilerini; özel nitelikli kamu hakları, genel nitelikli kamu hakları ve hukuka aykırı fiilden doğan sorumluluk çerçevesinde ele almaktır.Tezin araştırma aşamasında, hak ve sorumluluk kavramlarının öncelikle Kuran ve Sünnet'teki yeri tespit edilmeye çalışılmıştır. İslam hukuku eserlerinden kavramlar ve aralarındaki ilişkiyi ele alan bölümler taranmıştır. Yapılan araştırma sonucunda elde edilen bulgular doğrultusunda, hakkın kaynakları, ilkeleri, sorumlulukla ilişkisinin önemi açısından Allah ve kul hakkı ayırımı işlenmiştir. Sorumluluğun tanımı, kaynakları ve kusura dayanan sorumluluğun unsurları ortaya konmuştur. Daha sonra kişisel kamu hakları, sosyal ve ekonomik haklar, siyasal haklar bağlamında hak ve sorumluluk ilişkisi üzerinde durulmuştur.Hak ve sorumlulukların içinde yaşanan sosyal ve ekonomik ortamlar ile kişinin içinde bulunduğu şartlardan etkilenerek genişleyip daralabildiği kanaatine ulaşılmıştır. Hakların kullanılmasında iyi niyetin esas alınması gerektiği ve hakların kötüye kullanılmasının İslam hukukunda sorumluluğu gerektirdiği için korunmadığı görülmüştür.İslam hukukunun kişinin kendi lehine doğan haklardan önce kendi aleyhine olarak başkası lehine doğan hakları öncelediği, bunun tabii sonucu olarak sorumluluğu önceleyen hukuk sistemleri arasında yer aldığı kanaatine varılmıştır."
