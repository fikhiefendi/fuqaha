abstract: "Mensur metin olarak kaleme alınmış bir fetva mecmuasına dayanarak yapılan bu çalışma Makedonya Ohri Şehir Arşivinde tasnife tabi tutulmamış olan ve 189 varaktan oluşan Fetâvâ-yı Üskübî Zihnî adlı eserin dil incelemesidir. İstanbul doğumlu olup görev yaptığı yere atfen Üskübî lakabı verilmiş olan Pir Muhammed'in (ö. 1611) Anadolu ve Rumeli'de çeşitli yerlerde nüshaları bulunan fetva mecmuasının Beypazarı kadısı olan oğlu Ahmed (ö. 1630) tarafından Muînü'l-müftî adıyla bir araya getirildiği düşünülmektedir. Muînü'l-müftî fi'l-cevâb ale'l-müsteftî, Fetâvâ-yı Üskübî, Fetâvâ Kör Müftî gibi adlarla anılan eser nüsha sayısının çokluğu nedeniyle döneminin fıkıh literatürünün önemli başvuru kaynağı olma özelliğine sahiptir. Yazmanın hatîmesinden bahse konu nüshanın Alî Halîfe bin Muhammed tarafından 1664 (H. 1074) istinsah edildiği anlaşılmaktadır. Eser, fıkhî meselelerle ilgili Türkçe sorulara“olur”,“câizdir”,“olmaz”veya“câiz değildir”şeklinde kısa cevaplardan oluşmuştur. Türkçe cevaplar, konuyla alakalı Arapça fıkıh kaynaklarından alıntılarla desteklenmiştir. Çalışmada Türkçe metnin transkripsiyonu yapılmış, Arapça metinle ilgili herhangi bir işlem yapılmamıştır. İnceleme, metin ve dizinden oluşan çalışmanın inceleme kısmında metnin imla ve dil özellikleri incelenmiş, dizin kısmında ise kelime, tamlama ve kelime öbeklerinin günümüz Türkçesi karşılıkları ile kelimelerin kökenleri verilmiştir. Ayrıca metin içerisinde geçen kişi ve eser adlarından oluşan kısa bir dizinde farklı kaynaklara dayanılarak kişi ve eserler hakkında bilgi verilmiştir."
