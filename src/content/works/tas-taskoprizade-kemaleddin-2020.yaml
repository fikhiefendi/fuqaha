abstract: "Merginânî'nin meşhur eseri el-Hidâye üzerine şerh, ihtisar ve hadis tahrici tarzında onlarca çalışma yapılmış olmasına rağmen, tecrid tarzı çalışmalara pek rastlanmamaktadır. Taşköprizâde Kemaleddin Efendi, el-Hidâye'yi illetlerinden arındırarak onun meselelerini derlemiş, ayrıca başka kaynaklardan ilavelerle bu meseleleri zenginleştirmiş ve fetva mecmuası formatında bir eser ortaya koymuştur. 'Uddetü Ashâbi'l-bidâyeti ve'n-nihâye fî tecridi mesâili'l-Hidâye' (el-Udde) diye isimlendirdiği bu eserde, kaynaklardaki muğlak ifadeleri kolaylaştırmış, gerekli gördüğü yerlerde önemli katkılarda bulunmuştur. Gençliğinden itibaren Osmanlı Devleti'ne bağlı önemli merkezlerde kadılık tecrübesi bulunan musannif, yaşadığı asrın problemleriyle ilgili konularda müstakil bölümler açmış ve dikkat çekici fetvalara imza atmıştır. Bu sebeple Taşköprizâde Kemaleddin Efendi tanıtılmayı, Udde Kitabı da yüzyıllardır bulunduğu kütüphanelerin tozlu raflarından kurtarılarak akademyanın hizmetine sunulmayı hak etmektedir."
