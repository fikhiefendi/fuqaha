abstract: "Devletin vergi toplama hakkını, belirli bir meblağ karşılığında bir şahsa devretmesi şeklinde özetlenebilecek iltizam, Osmanlı'da bir vergi tahsil yöntemi ve iç borçlanma usulü olarak kullanılmıştır. XVI. yüzyılın ortalarından itibaren devlet nakit ihtiyacını karşılamak için sıklıkla iltizam yöntemine başvurmuştur. Böylece iltizam merkezî hazine, timar ve vakıf olmak üzere Osmanlı malî sisteminin tamamında yaygın bir uygulama haline gelmiştir. Bu çalışma bugüne dek ikincil literatürde daha çok iktisâdî açıdan incelenen iltizamın, fıkhî boyutlarını ortaya koymaya çalışmaktadır. Bu amaçla tezde, Osmanlı fetva literatüründe tespit edilen iltizam fetvalarından hareketle, Osmanlı ulemasının iltizam uygulamasına yaklaşımları değerlendirilmektedir. XVI. – XIX. yüzyıllar arasında yaşamış hem merkez hem de kenar müftülerinin verdiği tezde incelenen iltizama fetvalarına dayanarak, Osmanlı ulemasının iltizamı şer'î olmayan bir sözleşme olarak gördükleri söylenebilir. Ulemanın verdiği fetvalarda iltizam, örfte kendisinden beklenen sonuçları şer'an doğurmadığı için ehl-i örfün, iltizam fetvalarına ve söz konusu fetvalara göre verilen mahkeme kararlarına direnç gösterdiği de fetvalara yansımıştır."
