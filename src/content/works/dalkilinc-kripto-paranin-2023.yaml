abstract: "Kripto paraların iktisâdî mâhiyeti ile ilgili tartışmalar, hâlihazırda devam etmektedir. Ancak kripto paraların fıkhî açıdan değerlendirilebilmesi için iktisâdî mâhiyetinin belirlenmesi elzemdir. Bu konuda yapılan çalışmaların çoğu, kripto paraların mâhiyetini paranın fonksiyonları açısından ele almış ve bunların para olarak kabul edilemeyeceği sonucuna ulaşmıştır. Bu noktada akla şu soru gelmektedir: Kripto paralar, para değilse nedir? Kripto paraların iktisâdî mâhiyetini belirleyebilmek için çalışmanın birinci bölümünde para konusuna genel olarak değinilmiş, kripto paranın tanımı, özellikleri, tarihî gelişimi, çeşitleri, yasal durumu ve alt yapısı (blok zincir) ele alınmıştır. İkinci bölümde kripto paraların fıkhen para ve mal olması değerlendirilmiştir. Üçüncü bölümde ise kripto paraların fıkhî hükümleriyle ilgili fetvâ kuruluşlarının ve muasır ilim adamlarının görüşleri işlendikten sonra bu varlıklarla ilgili ulaşılan fıkhî hükümler ortaya konulmuştur."
