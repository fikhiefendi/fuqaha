abstract: "Kadim dinlerden Hammurabi Kanunlarına kadar pek çok yerde geçen cenin ve ceninin hakları, günümüzde gelişen tıp bilimiyle beraber gündemdeki yerini korumaktadır. Tüp bebek merkezlerinde ihtiyaç fazlası haline gelerek imha edilmeyi bekleyen embriyolar ise henüz cenin dahi değildir. Bu çalışmada bilimsel araştırmalarda ve tedavi edici uygulamalarda kullanılma potansiyeli taşıması açısından oldukça cezbedici olan ihtiyaç fazlası embriyolara İslâm hukuku ve Türk hukuku açısından bakılarak ihtiyaç fazlası embriyoların hakları îzah edilmeye çalışıldı. Tezin ilk bölümünde embriyonun ne olduğu, sun'î embriyo elde etme teknikleri ve ihtiyaç fazlası embriyoların durumları incelendi. İkinci bölümde ihtiyaç fazlası embriyoların fıkhî, hukukî ve ahlâkî konumundan bahsedildi. Çalışmanın 3. bölümünde ise ihtiyaç fazlası embriyoların kullanım alanları incelenerek, ihtiyaç fazlası embriyoların bahsedilen alanlarda kullanılması hakkında fıkhî ve hukukî değerlendirmelerde bulunuldu."
