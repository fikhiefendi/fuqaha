abstract: "İmam Şâfiî'nin fikir hayatında değişiklikler olmuştur. Bu değişiklikler mezhep içerisinde“kadim mezheb”ve cedid mezheb\" olarak isimlendirilmiştir. Bu değişikliğe neden gidildiği ve değişikliğin boyutu tam olarak belirlenmiş değildir. Tezimizin amacı bu sorulara cevap bulmaktır. Yöntem olarak önce İmam Şâfiî'nin hayatını ele elıp, onun ilmî birikiminin oluşmasındaki amilleri ve daha sonra bunların bu değişimdeki etkilerini belirlemeye çalıştık. En son olarakta bu değişimin gerçekleştiği fıkhî görüşleri ele aldık. Sonuç olarak bu değişimin İmam Şâfiî'nin ilmi birikimi ve bu birikimin sonucu, hakkı arama çabası içerisinde olan bir kişinin yaptığı gibi yanlışı varsa vazgeçip doğru olanı benimseme olduğunu gördük. İmam Şâfiî'nin anlaşılması için, onun seyahatleri ve ilim elde ettiği kişilerin iyi bilinmesi gerektiğini, onun mezhebinin oluşmasındaki en önemli etkilerin bunlar olduğu bilinmelidir. Bu bağlamda İmam Şâfiî'nin fıkıh anlayışındaki değişim normal bir değişimdir. Hayatı boyunca doğru olanı arayan biri olarak sadece hakk olduğu düşünceyi savunmuş ve bunun sonucunda görüşlerinde bazı değişimler olmuştur."
