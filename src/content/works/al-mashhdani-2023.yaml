abstract: "Bu araştırmada Hanefî fakihi ve mutasavvıf alimlerden Yahya b. Abdullah Fahreddîn el-Ürdünî'nin (ö. 864) el-Fevâidü'l-leâlî isimli eserinin şikretler ile köle azadı bölümleri arası tahkik edilmiştir. Kitapta Hanefî fıkhı esas alınmıştır. Müellif fetvaları fıkhi konulara göre uygun başlıklar altına almış, muhtasar bir şekilde zikretmiştir. Eserde Hanefi fıkıh şerleri ile fetva kitaplarından istifade edilmiştir. İnsanların genelini ilgilendiren, her zaman ihtiyaçları olduğu için alimlere sorma gereği hissettikleri hususların zikredilmiş olması eserin önemi olarak ifade edilebilir. Buna ilaveten eserde Hanefi âlimlerin nadir ve garib konularla ilgili fetvalarına da yer verilmiştir. Araştırmacı, müellif Yahya er-Rûmî'nin hayatı, yaşadığı dönem ve dönemin önemli olaylarını aktarırken betimleyici analitik yöntemi kullanmıştır. Eserin yazılması, harekelenmesi, nüshaların karşılaştırılması, farklılıkların tespiti, nakledilen görüşlerin asli kaynaklardaki yerlerinin gösterilmesi hususlarında ise tahkik ve talik yöntemi kullanılmıştır. Araştırmada şu sonuçlara varılmıştır: Müellif eserinde Hanefi mezhebine dair yazılmış yüz civarında kitaptan alıntı yapmıştır. Bunlardan çoğu baskısı yapılmamış mahtut kitaplardır. Kitaplardan bazısı ise kayıptır. Müellif, fıkhî konuların aslını araştırırken aklî ve martıkî istidlalleri bolca kullanmıştır. Kur'ân ve hadis metinlerinden istişhâdı ise azdır. Eser istifadeyi kolaylaştıracak şekilde başlıklara ayrılmıştır. Müellif, nakledilen görüşlerden maslahat ve delile uygun olanını tercih etmede başarılıdır. Şirket, vakıf, nikah, talak, süt emme ve köle azadı konularında mütehassıs kişilerin ve hukukçuların istifade edebileceği birçok konuya eserde değinilmemiştir."
