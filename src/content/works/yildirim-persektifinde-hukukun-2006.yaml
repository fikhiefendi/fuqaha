abstract: "ÖZETAmacını insanlığın hidayeti olarak açıklayan Kur'ân-ı Kerim, bir inanç ve dinkitabıdır. Bununla birlikte o insana ve insanlığa bakışta, ahlâkû, hukukû ve içtûmâihükümler ihtiva eder. Evrenselliği gereği; manzum bir hukuk sistemi olmaktan ziyade,hukuk sistemi için bir kaynaktır. Bu kaynak; insan hakkına ve onun korunmasına veinsan hukukunun üstünlüğü konusuna getirdikleri ile yeni bir hukukun oluşmasınaimkân sunmuştur. Onun kaynaklık ettiği hukuka, slâm hukuku denir.Kur'ân'ın ilk inen ayetleri, toplumda bulduğu haksız uygulamaları ıslah etmeyikendisine hedef seçmiştir. Mazlumun, yetimin, kölenin, miskinin hakkını savunmuş,böylece toplumda sosyal adâletin tesisini amaçlamıştır. Bu sebepten dolayı zorba vekapitâlûst sermaye sahipleri Peygamber Hz. Muhammed'e ve Kur'ân-ı Kerim'e karşıcephe almışlardır.Hz. Peygambere gelen ilk ayetler çoğunlukla sosyal içerikli ve toplumun bireyselhakları üzerinde yoğunlaşmıştır. Bu ayetler sağlıklı, hukukun üstünlüğünü kabul edenbir toplum oluşturmuş ve toplum barışını yerleştirmeye gayret sarf etmiştir. Hukukunüstünlüğü konusunda esas mesele, toplum bireylerinin kendi haklarını kolaycabulabildiği ve halkı ile irtibat kurabilen devleti oluşturmaktır. O devletin yargısı veyasası adâletle doludur. Devlet meşruiyetini halk iradesinden veya kutsal vahiydenalabilir, bu önemli değildir, ancak kişilerin temel hak ve hürriyetlerinin güvence altınaalındığı devlet, hukuk devletidir. Kur'ân toplumun âdil idaresinin yine toplumuniradesiyle mümkün olacağını savunmuştur. Bunun için başta peygamberler vemü'minlere adâleti ayakta tutmaları görev olarak verilmiştir. Kur'ân-ı Kerim, devlettenvatandaşlarına adâlet, insan hakları ve temel hürriyetleri sunmasını ister.Modern hukukta hukuk devletinin oluşması için iki ayrı ilkeler vardır. Bunlar;içerikle ilgili prensipler, şeklû yönden prensipler. Kur'ân perspektifinden, hukuk devletiiçin gerekli şeklû prensipleri bulamayız. Fakat hukuk devleti için gerekli içerikle ilgiliprensipler modern hukukta olduğu gibi bu hukuk kaynağında da mevcuttur. Mesela,Modern hukukta Kuvvetler ayrılığı vardır. Kur'ân perspektifinde bu kuvvetlerin ayrıolması gibi bir şartı göremiyoruz. Modern hukukta yasama, yargı ve yürütme nedenayrıdır? Çünkü yargı, yürütme ve yasamanın baskısından korunmalıdır. Kur'ânperspektifinden baktığımızda buna ihtiyaç yoktur. Allah'ın vahyinde bildirilen292hükümler, hukuka kaynaklık edecek, genel ve evrensel özellikteki hükümlerdir. Nüzuldönemi için Hz. Peygamber Kur'ân'da bildirilmemiş tâlû meselelerde yasa yapan, dininemirlerinin uygulama alanında imkân bulabilmesi için Medine site devletindeyürütmede bulunan ve aynı zamanda ilk dönemlerde bizzat yargılama faaliyetindehâkimlik görevi yapan bir konumdadır. Hz. Peygamberin vefatı ile birlikte bukuvvetlerin ayrılması veya beraber yürütülmesi toplumun kültürel değişiminebırakılmıştır. Kur'ân'ın bu konudaki yaklaşımı ise yargının hem yasama veyürütmenin yargıya olumsuz baskısından hem de, yargının kendisi içinde meydanagelebilecek baskılardan yargıyı korumaya yönelik ilkeler koymuştur. slâm hukukundayargıya hiçbir şekilde baskı yapılamaz. Kur'ân zulmü, işkenceyi, başkasının hakkınatecavüzü ve karşı, yalan şahitlik ve hâkimlere rüşvet vermek gibi yargıya karşıişlenebilecek olumsuz davranışları da yasaklamıştır. Şeklû ilkelerde ise, slâmhukukunun da modern hukuka paralel başka prensipleri vardır. Modern hukuk, en iyidevlet sistemi olarak demokrasiyi, daha sonra çoğulcu demokrasiyi buldu. Bunakarşılık slâm hukukunda şÃ»râ vardı. slâmû şÃ»râ'da kamu iradesine sorulur ve böylecetoplumun bütün fertleri görüşleri ile devlet yönetimine katilmış olur. Bu demokrasidendaha iyidir.Günümüzde bazı bilim adamlarının insan haklarına aykırılığını iddia ettikleri birtakım konular vardır ki, aslında iddia edilen bu hususlar, insan haklarına aykırıolmadığı gibi, insan hakkını korumaktadırlar. Kur'ân'da geçen, kısas (adam öldürme),dişe diş (yaralamalar), mirasta kadının hakkı gibi konularda, Kur'ân'ın indiği döneminşartlarını doğru tahlil edememe ve kültürü doğru okuyamamadan kaynaklanan yanlışve taraflı bakış söz konusudur. Eğer biz Kur'ân'ı sağlıklı ve doğru bir şekildeanlayabilirsek, Kur'ân'ın her insana hakkını adâletle verdiğini görürüz. Kur'ân'ıninsan hakları konusunda hiçbir problemi yoktur."
