abstract: "Bu çalışmanın amacı KOBİ'lerin katılım bankaları ve katılım bankacılığı sistemi ile ilgili görüşlerini keşfetmektir. Araştırmada ilk olarak KOBİ'lerin üstünlükleri, zayıflıkları ve ülke ekonomileri için önemi açıklanmıştır. Ayrıca katılım bankacılığı sistemi, felsefesi ve sistemde kullanılan temel ürünler açıklanmıştır. Daha sonra sırasıyla Sudan bankacılık sistemi ve Türk bankacılık sistemi hakkında bilgi verilmiştir. Alan araştırması Isparta'da anket yardımıyla gerçekleştirilmiştir. Anketler Mart 2020 ile Ağustos 2020 tarihleri arasında gerçekleştirilmiştir. Anketlerin derlenmesi COVID-19 pandemisi nedeniyle uzun sürmüştür. Araştırma kapsamında toplanan anket verilerine öncelikle güvenilirlik analizi gerçekleştirilmiştir. Ardından sorulara verilen cevapların ortalamaları hesaplanmıştır. Daha sonra da demografik özelliklere göre katılımcılar arasında istatistiki olarak anlamlı fark olup olmadığı araştırılmıştır. Araştırma sonuçlarına göre katılımcıların en çok önemsediği konu maliyetlerdir. Katılımcılar, maliyetlerin uygun koşullarda olması durumunda katılım bankaları ile çalışabileceklerini ortaya koymuşlardır. Katılım bankalarının şube sayılarının yeterli düzeyde olmadığı düşünülmektedir. Ayrıca KOBİ yöneticileri katılım bankalarının geleneksel bankalara göre daha iyi fırsatlar sunabildiklerini belirtmiştir. Elde edilen sonuçlara göre katılım bankaları yeterince ürün ve hizmet tanıtımı yapmamaktadır ve KOBİ'lerin katılım bankaları ile çalışmasında İslami kurallara uygunluk temel gerekçe olarak görünmemektedir. Ayrıca demografik özelliklere göre alt gruplar arasında istatistiki olarak anlamlı farklar bulunmaktadır."
