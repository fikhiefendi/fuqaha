abstract: "Bu çalışmada, öncelikle hukuk-değer ilişkisinin İslâm hukuk normları açısından nasıl anlaşılması gerektiği; klasik usûl bilginlerinin olgu-değer, bilgi-değer ve normatiflik-değer ilişkisini nasıl anladıkları ve ahkâmın ta'lîli ile değer arasında ne tür bir ilişki kurdukları, normatif yapıların mahiyetleri itibariyle ne tür bir özellik taşıdığı sorunları incelenmektedir. Bu çalışmada ayrıca, hukukî değerin ne olduğu ve hak kavramıyla ne tür bir ilişki içinde olduğu, İslam ceza hukuku normları yoluyla korunması amaçlanan değerlerin nelerden ibaret olduğu ve Allah hakkı-kul hakkı ayrımının İslam ceza hukuku normları bakımından ne tür bir şekillendirici işleve sahip olduğu sorunları ele alınmaktadır.İslam hukuk normları bakımından hukuk-değer ilişkisinin, birbiriyle doğrudan ilişkili iki farklı yönü bulunmaktadır. Onlardan ilki, hüküm ile hükme konu olan davranışın hukuksal değeri arasındaki, ikincisi de hüküm ile hükmün sevkiyle korunması amaçlanan hukukî değer (hak) arasındaki ilişkidir.Klasik fıkıh usûlünde, davranışların değeri, genellikle husn-kubh terimleriyle ifade edilmektedir. Bir davranışın hukuksal değeri olarak husn vasfı, o davranışın övgü ve sevabı, kubh vasfı ise yergi ve cezayı gerektirici bir vasfıdır. Klasik fıkıh usûlü literatüründe husn-kubh sorunu, daha çok olgu-değer, bilgi-değer ve normatiflik-değer ilişkisi açısından tartışma konusu edilmektedir. Ayrıca, ahkâmın ta'lili ile hükme konu olan davranışın değersel niteliği arasında ne tür ilişki olduğu sorunu ile hükmün sevkindeki işlevi bakımından illetin nasıl tanımlanması gerektiği sorunu da yine, ağırlıklı olarak husn-kubh problemiyle ilişkilendirilerek ele alınmaktadır.İslam ceza hukuku bakımından hukuk-değer ilişkisinin ikinci yönünü ise, ceza normlarının sevki ile hukukî değerler arasındaki ilişki oluşturmaktadır. Ceza normları yoluyla korunması amaçlanan değerlerin tespitinde, Allah hakkına yüklenen anlam belirleyici olmaktadır. Son olarak İslam hukukunda hakların Allah hakkı ve kul hakkı biçimindeki ayrımı, suçun tanımından cezaların kısmen ya da tamamen düşürülmesini düzenleyen normlara kadar hemen tüm ceza ve ceza muhakemesi normları bakımından belirleyici bir işleve sahiptir."
