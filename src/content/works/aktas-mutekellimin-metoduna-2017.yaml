abstract: "'Mütekellimîn Metoduna Göre Yazılan Fıkıh Usûlü Eserlerinin Temel Özellikleri' adlı bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş kısmı, araştırmanın konusu, önemi, araştırmanın yöntemi ve konunun tarihi temelleri üzerinde durulmuştur. Birinci bölüm, mütekellimîn metodunun ana hatları üzerine ayrılmıştır. Bu başlıkta öncelikle mütekellimîn metodu müelliflerinin hangi mezheplere tabi oldukları, yazıkları eserlerde ne gibi bir amaç güttükleri, eserlerin hangi konuları alıp hangi konuları almadıkları ve yazılan eserlerde nasıl bir usûl inşa ettikleri üzerinde durulmuştur. İkinci bölüm, çalışmada esas alınan usûl eserlerinin karakteristik yapısına ayrılmıştır. Bölümün ilk başlığında esas alınan eserlerin genel özellikleri hakkında bilgi verilmiştir. İkinci başlığında ise eserlerde ele alınan konuların özellikleri ve müelliflerin konular hakkındaki düşüncelerine değinilmiştir. Daha sonraki başlıklarda esas alınan eserlerde konuların nasıl tasnif edildiği ve konuların nasıl işlenildiği üzerinde durulmuştur. Son başlıkta ise mütekellimîn metodu ile Fukahâ metodu arasında karşılaştırma yapılmıştır."
