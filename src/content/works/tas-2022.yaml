abstract: "İnsan mükellef olduğu zaman şer'i yükümlülükleri yerine getirmesi gerekir. Bu yükümlülükleri yerine getirirse sevap kazanır, getirmez ise cezalandırılır. İnsan bu yükümlülükleri yerine getirme esnasında kudretini aşan engellere maruz kalabilir; bu engeller nedeni ile yükümlülüklerin bir kısmını ya da tamamını yapamaz. Bu engeller içinde ikrah, insanın hür iradesiyle doğrudan ilişkili olduğu için en ön plana çıkmaktadır. Bu çalışmada, Hanefi fıkhında ikrahın ibadetlere etkisi, bu konuyla ilgili ana ilkeler ve bunların Müslüman azınlıklarda; Kelime'i şehadet, namaz, zekât, oruç ve hac gibi ibadetlerin uygulanmasında ortaya çıkan güncel problemlerden bahsedilmektedir."
