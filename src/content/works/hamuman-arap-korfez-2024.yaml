abstract: "Modern dönemde ortaya çıkan cezalandırma yöntemleri modernitenin beraberinde getirdiği insan haklarını esas alarak bedene müdahale ile yapılan cezalar yerine hapis cezasını öngörmüştür. Bu vesile ile yaygınlık kazanan hapishane cezasının cezanın asıl amacı olan ıslahı yerine getirmediği, tam aksine suçlular üzerinde olumsuz etkileri olduğu tespit edilmiştir. Farklı suçlara verilen aynı hapis cezasının amacını yerine getirememesi ona alternatif olacak ceza arayışını beraberinde getirmiştir. Bu cezalar hapishaneye alternatif olarak“Alternatif cezalar”olarak adlandırılmıştır. Batı'da birçok ülkede uygulanan bu cezalar yarım asırdan beri İslam dünyasında özellikle de Arap Körfez ülkelerinde yaygınlık göstermiştir. Bu tezde Körfez ülkeleri kanunlarında uygulanan alternatif cezaların kökeni, uygulama alanları ve uygulama şartları incelenmektedir. Uygulamanın, yanı sıra alternatif cezaların İslam hukukunda belirlenmemiş ve takdiri yetkililere bırakılmış olan ta'zir cezaları ile uygunluğu ve örtüşüp örtüşmediği belirlenecektir. Modern alternatif cezalar ile ta'zir cezaları karşılaştırılırken dönem farklılığı dikkate alınacak, günümüzün kavramları ile geçmişi okumak anlamına gelen anakronizm hatasından uzak durulacaktır. Tez İslam dünyasının bir cüzünü oluşturan Arap Körfez ülkelerinin kanunlarını ele alması bakımından önemlidir. Aynı zamanda Körfez ülkelerindeki alternatif cezaları İslam hukuku ile mukayeseli işleyen ilk çalışma olma özelliğini haizdir."
