abstract: "Bu Çalışma İslami sukuk, onun önemi, doğuşu, İslam hukukuna uygunluk görüşü ve çeşitlerini ortaya koymaktır. Malezya, Birleşik Arap Emirlikleri'nin tecrübelerini dikkate alarak Sukukun iktisadi önemi, ihraç edilen sukuk hacmi tespite çalışılmıştır. Ayrıca Tahvil ve çeşitleri, şeri durumları ve bu hususta ulemanın ve İslam Fıkıh Akademisinin görüşlerini beyan edilmiştir. Çalışmada, sukukun önemli bir yatırım aracı olduğu ve 2008 yılı dünya finans krizinden sonra likidite ve devletlerin genel bütçe açıklarını gidermede etkin bir araç olduğu sonucuna varılmıştır. Lakin sukukun bazı pratik uygulamalarında İslam hukukuna aykırılıklar tespit edilmiştir. Buna rağmen başta ülkenin kalkınması, gelişmesi ve yol, köprü, sağlık, enerji, hastane, okul v. gibi altyapı yatırımlarında Sukuk yönteminin değerlendirilmektedir. Fakat Sukuk ihracı yapan banka, kurum veya şirketlerin, İslam Fıkıh Akademilerinin belirledikleri ilkelere uygun hareket etmeleri ve itfaı dahil Sukuk ihraç süreçlerinin tamamının şeri denetime tabi olması gerekir."
