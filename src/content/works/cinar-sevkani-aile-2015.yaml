abstract: "Bu çalışmada, Yemenli din âlimi Muhammed b. Alî eş-Şevkânî'nin (v. 1250/1834), Mecdüddîn İbn Teymiyye tarafından (v. 652/1254) fıkıh bablarına göre tasnif edilmiş hadis kitabı“el-Müntekâ mine'l-ahbâri'l-Mustafâ”ya şerh olarak kaleme aldığı“Neylü'l-evtâr”adlı eseri, aile hukuku bağlamında incelenmiştir. Dört bölümden oluşan bu çalışmanın birinci bölümünde Şevkânî'nin hayatı ve ilmî kişiliği hakkında genel bilgiler verilmek suretiyle müellifin tanıtılması amaçlanmıştır. İkinci bölümde“nikâh ve hukukî sonuçları”ele alınmış, üçüncü bölümde ise“talâk ve hukukî sonuçlarına”değinilmiştir. Çalışma sonucunda Şevkânî'nin, aile hukuku alanındaki görüşleri tespit edilmiştir. Onun bu görüşlere ulaşmasında taklitten uzak ictihadla nasları aklî değerlendirmelere tabi tutarak diyalektik bir yöntem izlemesinin rolü büyüktür. Bu yöntemin bir yansıması olarak kimi zaman cumhura muvafakat etmiş; kimi zamanda onları eleştirerek muhalif görüş sahiplerine iştirak etmiştir. Öte yandan kendisine özgü bazı kanaatleri olduğu da görülmüştür."
