abstract: "Muhsan kavramı, Kur'ân-ı Kerîm'de anlam ve ifade bakımından farklı kullanımlar gözlemlemekle birlikte geçmişten günümüze İslam âlimlerinin ittifakta bulunduğu tanımlar ve hükümler çerçevesince literatüre eklenmiştir. Birbirinden farklı koşulların meydana gelmesi âlimlerin farklı görüşler sunmasına sebebiyet vermiştir. İslam'ın birincil metni (Kur'ân ve sünnet), iffet, haysiyet ve namus suçlarını (zina ve kazf) ve muhsan bir erkek veya kadının namusuyla ilgili her türlü eylem ve hükümleri ele almıştır. Buna ek olarak Hz. Peygamber (s.a.v.) döneminde meydana gelen bazı olaylara dair rivayetlerin var oluşu, bu kavramın derinlemesine incelenmesini gerekli kılan önemli bir unsur olmuştur. Bu çalışmada, muhsan kavramının isimlendirilmesi üzerinde durulduktan sonra ilgili ayet ve hadisler başta olmak üzere sahabe döneminden günümüze dek âlimlerin görüşleri esas alınarak öne sürülen şartlar ve hükümler incelenmekte olup muhsan kavramıyla bağlantılı olarak zina ve kazf meseleleri ele alınmaktadır. Tezimizin birinci bölümünde kelimenin sözlük ve terim anlamlarına, farklılık arz eden kullanımlarına, ek olarak benzer anlamlı kelime ve kavramlara verilmiştir. Farklı şekillerde yorumlanan bu kelimenin hangi anlamının tercih edildiği, buradaki farklılıkların sonuçları ve ilgili tartışmalar tespit edilmeye çalışılmıştır. Böylece kapsamı ortaya konan muhsan kavramının hangi bağlam ve şartlarda kullanıldığı açık hale getirilmiştir. Ardından bu veriler ışığında fıkıh âlimlerinin öne sürdüğü görüş ve hükümler sıralanmıştır. Bu bölümde ayrıca muhsan kavramıyla ilgili ayet ve hadisler incelenmiş olup, konunun din ve hukuk açısından önemine değinilmektedir. Bu konuda özel olarak iffet kavramına yapılan vurgu da çalışmamızda bir başlık olarak yer almaktadır. İkinci bölümde ise bu kavramın bazı suçların hükme bağlanmasında dikkat edilen bir unsur olarak İslam ceza hukukundaki yeri incelenmektedir. İslam hukuk sisteminde recm uygulaması çerçevesinde, muhsan kavramının dikkate alındığı gözlemlenmiş, çalışmada buradan doğan tartışma konuları (muhsan olma şartları, muhsanın korunması) serdedilmiştir. Benzer şekilde kazf suçunda da muhsan kavramını incelenmiştir. Muhsan kavramı hakkında daha fazla bilgi vermek için ayrıca zimmi ve müstemen kavramları da kısaca değerlendirilerek, İslam hukukunda muhsan aleyhine işlenen suçlar zimmî ve müste'men olma açısından ele alınmıştır."
