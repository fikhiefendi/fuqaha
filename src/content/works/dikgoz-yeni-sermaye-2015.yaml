abstract: "Dünya ekonomisin gelişmesi ve büyümesiyle birlikte yeni finansal ürünler piyasaya girmektedir. Piyasada birçok finansal araç bulunmaktaydı ancak faizsiz finansal araçlarda çok çeşitlilik bulunmamaktaydı ya da var olanlar piyasa ihtiyaçlarını karşılamamaktaydı. Bu ihtiyacı karşılamak, İslami kesimin fonlarını çekmek amacıyla finansal piyasalar yeni ürün arayışına girmiştir. Bu faizsiz finansal ürünler arasında en hızlı büyümeyi gösteren ürün sukuk olmuştur. Katılım bankacılığının kendi prensipleri gereği finansal piyasa araçlarından uzak durmayı gerektirdiğinden, sukuk gibi bir ürüne Türkiye piyasası ihtiyaç duymaktaydı. Bu ihtiyacın bir sonucu olarak; Sukuk Türkiye Piyasasında' da yeni bir ürün olarak işlem görmeye başlamıştır. SPK tarafından Kira Sertifikası olarak isimlendirilmiştir. Bu çalışma da Sukuk ürününü detaylı bir şekilde ele alınmış olup; yapısı, işleyişi ve muhasebeleştirilmesi anlatılmıştır. Sermaye piyasası ürünleri arasındaki yeri incelenmiş, ilişkisi hakkında yorumlar sunulmuştur. Detaylı muhasebe uygulamalarıyla muhasebeleştirilmesi konusu irdelenmiştir."
