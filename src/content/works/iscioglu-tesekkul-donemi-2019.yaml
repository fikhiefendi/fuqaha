abstract: "Kaffâl'in şeriat ve akıl arasındaki uyum ve ilişkiyi ortaya koymak üzere kaleme aldığı Mahâsinü'ş-Şerî'a adlı eseri, Makâsıd düşüncesinin erken teşekkül döneminden günümüze ulaşan önemli eserlerdendir. Eserde yer alan açıklamalar, hükümler ve gayeleri etrafında dönmektedir. Gaye, es-siyâsetü'l-fâdıla; hükümler, mahâsin ve amaç, maslahat kavramları etrafında şekillenerek mantıksal bir döngüyü ortaya koymaktadır. Bunun yanı sıra eser döneminin yaygın mezhebi olan İsmâilî mezhebinin Allah, nübüvvet, hüsün/kubuh vb. meselelerdeki görüşlerine de bir reddiye niteliği taşır. Makâsıd düşüncesinin teşekkül dönemi olarak isimlendirebileceğimiz Kaffâl-Şâtıbî arası beş asırlık dönemde Cüveynî, Gazzâlî ve İzzeddîn b. Abdüsselâm gibi birçok alim bu düşüncenin gelişmesine katkıda bulunmuşlardır. Bu katkılar genelde usûl ilmi içerisinde maslahat, 'illet, istidlâl, istihsan ve kıyas gibi başlıklar altında işlenmeye başlanmış daha sonraki dönemlerde müstakil bölüm ve eserlerle devam etmiştir."
