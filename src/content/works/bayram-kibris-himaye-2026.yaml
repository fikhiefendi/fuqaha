abstract: "Tez, İngiliz hâkimlerin Kıbrıs'ta İngiliz himaye devrinde (1878-1914) İslam-Osmanlı hukukunu anlama ve tatbik etmede gösterdikleri ilmi ve hukuki faaliyetleri incelemektedir. Çalışmada, bu faaliyetlerin analizi için Yüksek Mahkeme kararları ve bu mahkemede kanun metni olarak kullanılan Osmanlı ve İslam hukukuna dair tercüme ve telif eserler kullanılmıştır. Bu çerçevede tez, şu meseleleri araştırma konusu edinmiştir: İngiliz hâkimlerin İslam-Osmanlı hukukunu anlamada ve tatbikte izledikleri metot; Mecelle'yi anlamada kullandıkları tefsir metotları; Mecelle'yi, diğer İslam hukuk kaynaklarını ve Osmanlı kanunlarını yorumlamada Fransız ve İngiliz hukukunun kullanımı ve rolü; karma bir hukuk sisteminin oluşup oluşmadığı; başka bir hukuk sistemini anlama ve tatbikteki zorluklar ve sınırlar; İngiliz hukukçuların Mecelle ve diğer İslam hukukuna dair tercüme ve telif eserlerindeki terminoloji ve mana tutarlılığı; İngiliz hukukçuların kararlarında tercüme hukuk metinleri kullanmalarının verdikleri hükme tesiri; gayrimüslimin hâkimlik salahiyeti açısından İngiliz hâkimlerin kararlarının Kıbrıs'taki Müslümanları bağlayıcılığı. Tezin İslam-Osmanlı hukuku sahasında yaptığı katkı, farklı bir hukuk geleneğinde yetişmiş hukukçuların perspektifinden İslam-Osmanlı hukukunun, bilhassa Mecelle'nin tatbikinde izlenen metotlar ve karşılaşılan zorlukların analiz edilmesidir. Hukuk metodolojisi açısından ise bir hukuk sistemini tercüme kanun metinleri üzerinden tatbik etmenin sınırları, kanun metninin tefsir metotları ve bu metotların İslam hukukuyla uygunluğu gibi birçok problem üzerinde müşahhas tespitlere imkân vermesidir. Ayrıca mukayeseli hukuk perspektifiyle İngiliz hâkimlerin Yüksek Mahkeme kararlarında İslam-Osmanlı hukukuna yaptıkları tenkitler ve diğer hukuk sistemleri ile karşılaştırmalarının analiz de bu çalışmanın katkıları arasında yer almaktadır."
