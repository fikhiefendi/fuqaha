abstract: "Bu çalışmanın temel amacı, Somali'nin Mogadişu şehrinde faizsiz bankacılık hakkındaki beklentiler, fırsatlar ve İşletme zorlukları belirli kaynaklarla Deneysel olarak analiz etmektir. Çalışmada görsel inceleme tasarımı kullanılmış olup ve çalışım örnekleme Somali Mikrofinans çalışanları, ticari banka çalışanları, kamu çalışanlar, girişimciler ve diğerlerinden oluşmaktadır. Birincil veriler bir anket yardımı ile tabakalı örnekleme ve Basit rasgele örnekleme tekniği kullanılarak toplanmış ve Birincil veriler toplanırkan 185 anket üzerinden 165'i Çalışmada kullanılmıştır. Toplanan veriler önce istatistiksel olarak kodlanmış ve SPSS programı kullanılarak analiz edilmiş daha sonra sonuçlar frekans tablolarda ve şekillerde sunulmuştur. Veriler daha sonra, ortalama ve yüzdeler gibi açıklayıcı istatistikler bakımından analiz edilmiştir. Çalışma, bir taraftan işgücü, mevzuat, yasal çerçeve, sermaye ihtiyaçı gibi faktörler üzerinden faizsiz bankacılıkla ilgili farkındalık ve genel anlayışı sağlamali üzerine diğer taraftan ekonomik büyüme, yatırımcı ilgili ve yatırımların teşvik edilmesi gibi faizsiz bankaların gelecek potansiyeli üzerine odaklanır. Çalışma, bankalar için ilave kaynak, ilave yatırım fırsatları, banka müşterisi olmayanların finansal hizmetlere erişimi ve ilave istihdam olanakları aracılığı ile faizsiz bankacılığın ekonomide bir büyüme sağlayacığı şeklinde bir değerlendirme ortaya koyar. Bu hedefe sormada bir taraftan toplumda farkındalık yaratmalı, faizsiz bankacılık konusunda ilgili Personeli eğitiminli ve işlevsel pazarlama teknilkerini kullanmalı, diğer taraftan hukümet organları aracılığı ile Sharia ile uyumla bir şekilde yasal çerçeveyi oluşturmak gerekir."
