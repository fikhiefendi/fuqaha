abstract: "Modern İktisat düşüncesinin 16. yy' da sistemleşmeye başladığı bir gerçeklik olmakla birlikte bu alana dair birçok fikir ve düşünce çok daha önceleri ortaya konmuş ve insanlık tarihinde yerini almıştır. Hicri II. asırda yaşamış olan İmâm Muhammed b. Hasan b. eş-Şeybani'nin (ö. 189/805) İktisat mefkûresine öncülük etmiş isimlerin en önemlilerinden birisi olduğu düşünülmektedir. İktisat alanına dair özgün bir eseri olan ve ölmeden az bir zaman önce telif ettiği Kitabu'l-Kesb'in iktisadi düşünce açısından son derece önemli bir eser olduğunu düşünmekteyiz. Mikro İktisat alanına dair esaslar diyebileceğimiz konuların ifade edildiği bu eser, İslâm iktisat düşüncesinin temel kaynaklarından biri olma özelliğini taşımaktadır. Çalışmamızda İmâm Muhammed'in iktisadi açıdan ele alınabilecek düşüncelerini eseri bağlamında değerlendirerek açıklamaya çalıştık. Eserin müellife aidiyeti, eser üzerinde yapılan çalışmalar, eserinin iktisat ilmi açısından önemi ve onun iktisadi düşünceye katkısı olarak değerlendirilebilecek kazanç, üretim, tüketim, paylaşım konularındaki görüşlerini tespit etmeye çalıştık."
