abstract: "“Şer'iyye Sicilleri”, diğer adıyla“kadı divanı”olarak adlandırılan kadılar tarafından kaydedilen defterlerdir. Sicil defterleri içerikleri ve tutuldukları dönem itibariyle bir şehrin, sosyo-kültürel hayatı, siyasi-idari hayatı, ekonomisi ve askeri vs. durumları hakkında bilgiler verir. Şehir tarihi araştırmaları açısından birinci elden kaynak niteliğindedir. Bu nedenle Osmanlı Devlet'inde bir şehirin tarihi araştırılırken Şer'iyye sicilleri incelenmeden Osmanlı siyasi, sosyal, idari ve ekonomik durumu hakkında doğru bilgilere ulaşılamaz. 12 Nolu Şer'iyye Sicil'i toplam 398 sayfadan oluşmaktadır. Bu çalışmada ise 1-104 sayfaları incelenmiştir. Çalışılan sicil defteri ile 17.y.y.'da Ayıntab şehri hakkında bize birçok bilgi sunmaktadır."
