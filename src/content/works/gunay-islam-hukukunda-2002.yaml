abstract: "ÖZET Çalışmamızın giriş bölümünde iddetin lügat ve terim anlamlarım açıklayıp tarihteki uygulamalarından örnekler sunduk. Yahudilik, Hıristiyanlık ve İslam öncesi Araplardaki iddetin uygulamasını belirttik. Daha sonra tarihte uygulanan boşanma şekilleri hakkında kısa bir bilgi verip İslam hukukunda ve medeni hukukta evliliğin sona ermesi konusu çerçevesinde boşanmayı genel hatlarıyla ve iddetle ilgili bağlantıları göz önünde tutarak açıkladık. Boşanmanın sonuçlarını da genel olarak verdik. Birinci bölümde İslam hukukunda iddetin dayandığı delileri, iddetle ilgili özel durumları, tarihin uzun bir döneminde yürürlükte olan kölelikle ilgili hükümleri ve iddetin hikmetlerini de birinci bölümün İslam hukukunda iddet kısmında inceledik. Bundan sonra da birinci bölümün son kısmında medeni hukuktaki iddetle ilgili maddeleri inceleyip bir başka“bekleme”şekli olan ve günümüz hukuk sistemlerinin benimsediği“kazâî bekleme”yi açıkladık. ikinci bölümde iddetin taraflara ve topluma yüklediği birtakım sorumluluklar ve kazandırdığı haklar çerçevesinde iddetten doğan hak ve sorumlulukları inceledik. Bu süre içinde evliliğin haram oluşu, kadının mesken hakkının bulunması, nafakasının temini, nafakayı düşürücü durumlar, nesep, miras ve yas tutma İslam hukukunda iddetle ilgili hükümleri oluşturmaktadır. İkinci bölümün son kısmında ise medeni hukukta iddetin yeni bir evliliğe etkisi, nesep, miras ve nafaka konulan açıklanmıştır. Bu çalışmanın kaynaklarını, boşanma ve iddetle ilgili ayetlerin daha açık hale gelmesi için başvurulan tefsirler, tartışma konusu olan birtakım hadisler için yararlanılan şerhler, klasik fıkıh literatürümüzün bu konulara tahsis edilmiş“kitab”ve“bâb”ları, günümüzde İslam hukukuyla ilgili yapılmış çalışmaların“ahvâl-i şahsiyye”kitapları, fıkıh usûlü eserleri, medeni hukukun bir bölümünü oluşturan“aile hukuku”kitapları, hayız, doğum vb. konuları günümüz tıbbî verileri çerçevesinde açıklayan tıp kitapları, ansiklopediler ve tezler oluşturmaktadır."
