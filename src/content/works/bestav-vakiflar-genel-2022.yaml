abstract: "Medeniyetlere ışık tutan yazı, İslâm dini için de çok ehemmiyet arz eden bir husustur. Müslümanlar bildiklerini en güzel şekilde yazma ve süsleme arzusunu her dönemde gerçekleştirmişlerdir. Başta kutsal kitap Kurân-ı Kerim olmak üzere hadis, fıkıh, tıp, fen, tarih, edebiyat ve bunlar gibi birçok yazılı kaynak dönemlerinin tezyinat özellikleri ışığında tezhiplenmiştir. Tezhip sanatı 'altınlamak' anlamına gelen en önemli kitap sanatlarından biridir. İslâm tarihi boyunca yazılı kaynakların birçoğunda görülen tezhip sanatı, günümüze kadar gelişimini devam ettirmiştir. Özellikle Osmanlı İmparatorluğu dönemi her alanda en iyisi olduğu gibi, sanat alanında da geleneksel sanatlarımızın tarihine ışık tutmaktadır. Tezyini sanatların zirve yaptığı bu dönem, tezhip sanatı açısından da çok zengin bir birikimin sahibidir. Hemen hemen bütün yazılı mushaflar, edebi eserler, tarihi ve îlmi yazılı kaynaklar tezhip sanatını icra eden sanatkârların ellerinde bambaşka bir surete bürünmüştür. Yapılan arşiv çalışmaları ve vakıf araştırmaları sonucunda, vakıf kayıt defterlerinin de tezhiplenmiş olduğu bilgisine ulaşılmıştır. Vakıf kayıt defterleri, imkânların ve mal varlığının gönül rızası ile paylaşılmasını öngören vakıfların, yaptığı bütün icrâatleri, malum vakfa yapılan bağışları, vakf edilen taşınır ya da taşınmaz mülkleri, bu vakfiyelerden elde edilen gelirlerin, nerede ve ne için kullanıldığını ve buna benzer birçok bilginin yazılı olarak kayıt altına alındığı defterlerdir. Hatice Turhan vakıf sicil defterinde, Valide Sultan tarafından vakfedilen mallar, çevre ve civar kasabalardaki mülkler, bağış yapılan miktarlar ve kimler tarafından yapıldığı, başka şahıslar tarafından vakfedilen vakıf malları gibi birçok mülkün adı geçmektedir. Kadıların ve kazaskerlerin şahitliğinde yazılan vakıf defteri, döneminin tezyini unsurları ışığında tezhiplenmiştir."
