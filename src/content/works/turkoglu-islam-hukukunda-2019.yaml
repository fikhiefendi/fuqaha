abstract: "İslam hukukunda sanık hakları başlığı adı altında ele alınan bu çalışmada, sanık, şüpheli sanık farkı, sanığın tarihçesi, sanık hakları ve ilkeleriyle ilişkili meseleler incelenmiştir. Temelde İslam hukuku olmakla beraber konunun daha iyi anlaşılması adına yeri geldikçe ilgili kısım, modern hukukla mukayeseli bir şekilde ele alınmaya çalışılmıştır. Ayrıca herhangi bir mezhebin görüşüne bağlı kalınmaksızın mesele, etraflı bir biçimde incelenmeye çalışılmıştır. Araştırmanın sonucunda İslam hukukunda sanık haklarının hemen hemen bütün mezheplerde farklı konu başlıkları adı altında ele alındığı görülmüştür. Yapısı gereği modern hukukta mevcut olmayan bazı hakların İslam hukukundaki önemine değinilmiştir. Tespit edilen sanık hakları, sanığın tercihine sunulan ve sunulmayan şeklinde ele alınmıştır."
