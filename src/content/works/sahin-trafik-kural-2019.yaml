abstract: "Günümüz hukukunda ele alınan trafik kanunları kendine mahsus yönetmelikle yürütülmekte ve kural ihlalleri de bu kapsamda cezalandırılmaktadır. Bazı durumlarda özellikle yönetmeliği aşan hallerde, kişilerin ve toplum menfaatlerinin devreye girdiği durumlarda, cari hukuk sisteminin genel ve özel hükümlerinin icra alanı bulduğu muhakkaktır. Trafik kural ihlalleri sebebiyle maddi zararlarda maddi tazmin yoluna gidilebilirken cana ve beden bütünlüğüne zarar verilmesi hallerinde kişiler hem maddi cezaya hem de özgürlükten mahrum edilmek için hapis cezasına çarptırılabilmektedir. Son zamanlarda yapılan ceza artırımları sürücülerin kurallara daha titiz uymaları noktasında fayda sağlamaktaysa da denetimlerin eksik olduğu ya da denetimin yapılamadığı durumlarda vicdan, ahlak ve din olgularının zayıflığı gibi sair saikler sebebiyle sürücüler tarafından kural ihlalleri gerçekleştirilebilmektedir. İslam ceza hukuku bu noktada hem dini hem de şer'i olarak ortaya koymuş olduğu kurallar bütününe uyulması şartıyla kişileri her iki cihanda da selamete ulaştırmayı temin eder. Bu tezimizde trafikte sürücüler tarafından yapılan trafik ihlallerinin günümüz hukukundaki cezalarını ve İslam ceza hukukundaki karşılıklarını ele almaya gayret ettik. Bunu yaparken kazalarda ve ihlallerde en büyük etken olan irade faktörünü şematik hale getirerek meydana gelebilecek ihlal neticelerinin sebeplerini ortaya koymaya çabaladık. İhlalleri tek tek olmasa da trafik kural ihlallerinde meydana gelebilecek ihtimallere değinmek suretiyle kişilerin mesuliyetlerini İslam Ceza Hukuku açısından izah etmeye çalıştık. Oluşturulan şemalar kapsamında ihtiyaç halinde konulacak kuralların ve bu kuralların ihlalleri neticesinde ortaya çıkabilecek neticelerin İslam Ceza Hukuku'ndaki yerinin tespitini kolaylaştıracağı kanaatindeyiz. Netice olarak trafik kurallarının ve ihlalleri neticesinde ortaya çıkan durumların günümüz cari hukuk sistemiyle alakalı olduğu kadar İslam Ceza Hukuku'yla da yakından alakalı olduğunu ve hatta daha derin bir ilişkiye sahip olduğunu söyleyebiliriz."
