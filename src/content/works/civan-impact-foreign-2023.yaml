abstract: "Daha önce yapılan bazı çalışmalar gözden geçirildikten sonra, turizmin ve doğrudan yabancı yatırımın Türkiye'deki İslami bankaların kârları üzerindeki etkisinin yeterince ele alınmadığı belirlendi. Buna ek olarak, turizm ve doğrudan yabancı yatırım bir ülkenin toplam gelir kaynağının önemli bir bölümünü oluşturduğundan, konunun önemi ve ulaşmak istediği amaç nedeniyle daha fazla araştırmaya ihtiyaç duyduğu belirlenmiştir. Söz konusu etkinin niteliğini tespit etmek ve konunun sadece ekonomik yönüne değil, aynı zamanda ekonomik yönüne de fayda sağlayacak bazı çözümler önermeye çalışmak için söz konusu çalışmanın yürütülmesi Türkiye ekonomisi açısından önemlidir. edebî boyutunu geliştirmektir. Bu çalışma, bu iki fon kaynağının kullanımına ilişkin bazı ipuçları sağlamıştır. Bu çalışmanın temel amacı, doğrudan yabancı yatırım ve turizmin Türk İslami bankalarının karlılığını nasıl etkilediğine bakmaktır. Türk bankacılık sektöründe faaliyet gösteren altı İslami bankadan üçünün verileri, 2009-2020 dönemi için statik ve dinamik panel genelleştirilmiş momentler (GMM) tahmin yaklaşımları kullanılarak analiz edilmiştir. Çalışma, doğrudan yabancı yatırımın İslami bankaların kârlılığı üzerinde olumlu bir etkiye sahip olduğunu, turizmin ise İslami bankaların kârına olumsuz katkıda bulunduğunu göstermektedir. Çalışma, hükümetin finansal gelişmeyi artırmak için doğrudan yabancı yatırımları ve turizmi artırmaya odaklanması gerektiğini önermektedir."
