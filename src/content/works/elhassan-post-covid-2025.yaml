abstract: "COVID-19 salgını, dünya çapındaki finans piyasalarında benzeri görülmemiş şoklara yol açarak, çeşitli finansal araçların performansını ve dayanıklılığını değerlendirmek için benzersiz bir“doğal deney”yaratmıştır. Bu araştırma, Amerika Birleşik Devletleri (ABD) ve Malezya'daki konvansiyonel tahviller ve İslami tahvillerin (Sukuk) karşılaştırmalı bir çalışmasını sunarak, Ocak 2020 ile Aralık 2022 arasındaki dönemdeki performans dinamiklerini analiz etmektedir. Bu araştırma, dünyanın en büyük konvansiyonel tahvil piyasasına ev sahipliği yapan ABD ve İslami finans alanında önde gelen küresel liderlerden biri olan Malezya gibi farklı piyasa ortamlarında bu iki varlık sınıfı arasında geniş ölçekli, ülke düzeyinde karşılaştırmalı bir analiz yürüterek literatürdeki önemli bir boşluğu doldurmaktadır. Kantil regresyon ve sağlam en küçük kareler de dahil olmak üzere bir dizi regresyon spesifikasyonu kullanan tez, faiz oranlarının, piyasa oynaklığının (VIX ve OVIX) ve doğrudan COVID-19 sağlık şoklarının (vaka ve ölümler) hem Sukuk hem de konvansiyonel tahvillerin getirileri üzerindeki heterojen etkilerini ampirik olarak incelemektedir. Temel amaç, Sukuk'un teorik faydalarının, özellikle de varlığa dayalı yapısı ve risk paylaşım ilkelerinin, bu aşırı sistemik stres döneminde konvansiyonel tahvillere kıyasla piyasa duyarlılığı ve dayanıklılığında fark edilebilir farklılıklara dönüşüp dönüşmediğini tespit etmektir. Bulgular, farklı piyasa tepkilerini ortaya koymaktadır. ABD tahvil ve Sukuk piyasaları, ağırlıklı olarak faiz oranları ve piyasa oynaklığı gibi finansal piyasa değişkenlerinden etkilenmiş ve bu da piyasa odaklı bir tepkiyi vurgulamıştır. Buna karşılık, Malezya piyasaları, COVID-19 vaka ve ölümleriyle ölçüldüğünde, pandeminin doğrudan sağlık etkilerine karşı daha güçlü bir duyarlılık sergilemiş ve bu da sağlık krizi odaklı bir tepkiye işaret etmektedir. Çalışma, ayı, normal ve boğa piyasa koşullarındaki farklı tepkileri haritalamak için kantil regresyon kullanarak krizin farklı finansal araçlar üzerindeki etkisinin anlaşılmasına önemli akademik katkılar sunmaktadır. Ayrıca, yatırımcılara ve politika yapıcılara finansal istikrar, risk yönetimi ve konvansiyonel ve İslami finansın çeşitli ve çalkantılı ekonomik koşullarda yol almadaki farklı rolleri hakkında pratik bilgiler sunmaktadır."
