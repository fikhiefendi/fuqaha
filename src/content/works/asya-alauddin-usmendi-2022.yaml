abstract: "Bu çalışmada Mâverâünnehir fıkıh uleması arasında yer alan münazara, cedel ve hitabet yönüyle meşhur olan Hanefî fakihi ve kelâm âlimi Ebü'l-Feth el-Üsmendî es-Semerkandî'nin (ö. 552/1157) kıyas nazariyesi ele alınmaktadır. Çalışma giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde çalışmanın konusu ve önemi, amacı, sınırlılıkları ve kapsamı, yöntem ve kaynaklarından bahsedilmiştir. Birinci bölümde Üsmendî'nin hayatı ve ilmi kişiliği, yaşadığı dönem, ilmî durum, ilmi metodu ve bilgi teorisi, hocaları, öğrencileri ve eserleri tanıtılacaktır. İkinci bölümde hem genel olarak hem Üsmendî'nin görüşleri çerçevesinde kıyasın kavramsal çerçevesi ve mahiyeti, kıyasın ve kıyas ile ilişkisi bulunan kavramlar, kıyasın meşruiyeti, kaynak ve bilgi değeri, kıyasın unsurları, kıyasın çeşitleri gibi konulara değinilecektir. Üçüncü bölümde ise Üsmendî'nin kıyasa dayalı fıkhî görüşleri bağlamında muâmelât özelinde hâvale, selem, icâre akdi, velâyet ve akrabaların diyet ödemesi konuları ele alınacaktır. Sonuç bölümünde ise, çalışmada ortaya konulan tespitlere yer verilecektir."
