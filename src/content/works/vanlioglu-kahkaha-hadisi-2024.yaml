abstract: "Bu tezde Hanefî mezhebi hadis anlayışı, bu anlayışın sürekliliği ve değişimi tespit edilmeye çalışılmıştır. Bu tespit, örnek bir hadis üzerinden gerçekleştirilerek sadece teorik boyutta kalmamak hedeflenmiştir. İncelenen hadis, kahkaha hadisi olarak meşhur olan hadistir. Bu hadis, diğer mezhepler tarafından delil olabilecek kuvvete görülmemiş, ancak Hanefî âlimler tarafından delil olarak kullanılmıştır. İlgili hadis Hanefî âlimler nezdinde kıyasa aykırı olmasına karşın delil olarak kullanılmıştır. Hanefî mezhebi hadis anlayışını tespit için farklı çalışmalar olsa da konuyu bir hadis özelinde, âlimlerin yorumları üzerinden incelenmemesi yapılan çalışmaların teorik düzeyde kalmasına sebep olmuştur. Tezde, öncelikle kahkaha hadisinin geçtiği eserler ve ilgili bölümler tespit edilmiştir. Tespit edilen bu bilgiler, benzerlik durumuna göre başlıklandırılarak tasnif edilmiş ve bu tasnifte kronoloji dikkate alınmıştır. Böylece mezhebin hadis anlayışı ve süreç içerisindeki etkiler ve etkilenimler ortaya konulmaya çalışılmıştır. Son olarak, diğer mezheplerin kahkaha hadisi hakkındaki yorumları da tespit edilerek karşılaştırma yapılmış ve Hanefi âlimlerin ilgili hadisi anlama serencamı ortaya konulmaya çalışılmıştır."
