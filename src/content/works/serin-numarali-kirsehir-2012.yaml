abstract: "23 NUMURALI KIRŞEHİR ŞER'İYYE SİCİLİ (H.1328?1330)(M.1910?1912) (R. 1326?1328)Cemaleddin SERİNErciyes Üniversitesi, Sosyal Bilimler EnstitüsüYüksek Lisans Tezi, Nisan 2012Danışman: Prof. Dr. Sebahattin SAMURKISA ÖZETÇalıştığımız dönem (H.1328?1330) (M.1910?1912) yıllarına ait 23 Numaralı Kırşehir Şer'iyye Sicili'dir. Çalışmamızın başında şer'iyye sicillerinin ortaya çıkışı, Osmanlı Şer'iyye Sicillerinin tarihi gelişimi, şer'iyye sicillerinin önemi ve kapsadığı belgelerin konumuzla bağlantılı olması nedeniyle Osmanlı Devleti'nin hukuki yapısını şer'i ve örfi hukukunu ana hatlarıyla ele alarak izah etmeye çalıştık.Kırşehir'e ait şer'iyye sicillerinin incelenmesi ile mahalli tarihçilerin ihtiyaç duydukları malzeme, sayılabilir rakamlarla verilmektedir.Milattan önceki tarihlere kadar uzanan bir tarihin parçası olan Kırşehir en iyi dönemini Selçuklular döneminde yaşamıştır. Bir sınır kenti olması nedeniyle beylikler arasında sürekli yönetimi değişen bir şehir olmuştur. Osmanlılar döneminde ise güvenlik açısından huzurlu ancak gelişmesi durmuş bir sancak konumundadır.23 Numaralı Kırşehir Şer'iyye Sicili, 98 varak, 195 sahife, 403 adet belgeden oluşmaktadır. Sicillerin hepsinde de müslüman halkla gayrimüslim halk arasında (Ortodoks Rum ve Ermeniler) bir sorun yaşanmadığı mahkeme kayıtlarından anlaşılmaktadır."
