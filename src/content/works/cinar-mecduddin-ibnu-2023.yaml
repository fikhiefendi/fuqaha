abstract: "Bu tez çalışması, VII/XIII. asrın Büyük Selçuklu devri muhaddislerinden Mecdüddîn İbnü'l-Esîr el-Cezerî (öl.606/1210) ve onun İmâm eş-Şâfiî'nin Müsned'ine yazdığı eş-Şâfî fî şerhi müsnedi'ş-Şâfiî adlı eseri hakkındadır. Çalışma, giriş ve üç bölümden oluşmaktadır. Giriş kısmında tezin konusu, amacı, önemi, çalışmanın yöntemi, kavramsal çerçeve ve çalışmanın kaynakları hakkında bilgi verilmiştir. Birinci bölümde, İbnü'l-Esîr el-Cezerî'nin yaşadığı dönem siyasî, ictimaî, ilmî ve kültürel yönlerden incelenmiştir. Ayrıca hayatı, hocaları, öğrencileri Musul Atabeyliği'ndeki resmi görevi ve eserleri ele alınmıştır. İkinci bölümde, İmâm Şâfiî'nin Müsned'i tanıtılmış olup Müsned'in yazma ve basılı nüshaları, Müsned'teki hadîs sayısı, hadîslerin sıhhat dereceleri ve Müsned'e yapılan diğer şerhler tespit edilmiştir. İbnü'l-Esîr'in şerhte kaynak olarak kullandığı İslâmî ilimlere ait eser ve müellifleri tanıtılmıştır. Üçüncü bölümde, İbnü'l-Esîr'in şerh metodu ele alınmıştır. Şerhteki kelime ve kavram izahlarına, hadislerin senedleriyle ilgili açıklamalarına, râvilerin biyografilerine değinmesine, hadîslerden fıkhî hükümler çıkarmasına, Şâfiî mezhebi başta olmak üzere diğer mezheplerin fıkhî görüşlerine yer verilmiştir."
