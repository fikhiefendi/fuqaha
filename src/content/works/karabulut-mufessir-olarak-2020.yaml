abstract: "İbn Receb el-Hanbelî (ö. 795/1393), İslâmî ilimlerin birçok alanında söz sahibi olan çok yönlü bir ilim adamıdır. Hicrî VIII. asırda yaşayan İbn Receb, İslâm dünyasının ve Hanbelî mezhebinin önemli simalarından birisi olarak bilinmektedir. O, hadis başta olmak üzere fıkıh, kelâm, usûl ve tarih gibi birçok alanda eser yazan velûd bir müelliftir. Bu ilimlerin yanı sıra İbn Receb, tefsir alanında da söz sahibidir. Onun tefsirle ilgili kaleme aldığı müstakil eserleri birkaç kısa sûrenin açıklandığı küçük risâlelerden ibarettir. Biz onun tefsir konusundaki açıklamalarını ağırlıklı olarak diğer eserlerinde görmekteyiz. Ebû Muaz Târık b. Ivazillâh b. Muhammed tarafından İbn Receb'in elliye yakın eserinden tefsire dair açıklamaları bir araya getirilerek Ravâiu't-Tefsîr el-Câmi' li't-Tefsîri'l- İmam İbn Receb el-Hanbelî isimli bir tefsir oluşturulmuştur. İbn Receb el-Hanbelî'nin Kur'ân ilimleriyle ilgili müstakil bir eserinin olduğu bilinmemektedir. Ayrıca İbn Receb'in tefsir açıklamalarının bir araya getirilmesiyle oluşan Ravâiu't-tefsîr isimli eserin mukaddimesinde de“ulûmü'l-Kur'ân”la ilgili herhangi bir bilgi söz konusu değildir. Bu da önemli bir müfessir olan İbn Receb'in, Kur'ân ilimlerine dair görüşlerinin ne olduğu ve âyetleri tefsir ederken bu ilimleri nasıl kullandığı sorularını akla getirmektedir. Bu nedenle çalışmamızda İbn Receb'in hayatı, ilmî kişiliği ve tefsire dair görüşlerinin derlendiği Ravâiu't-tefsîr isimli eserin tanıtımına yer verilerek, Kur'ân ilimlerine olan yaklaşımının ortaya konulması hedeflenmektedir. Böylelikle elde edilen bulgulardan hareketle analiz ve sentez yoluyla Ravâiu't-tefsîr'de Kur'ân ilimlerinin işleniş tarzı ve eserin tefsir tarihindeki yeri ve önemi ortaya çıkarılmaya çalışılacaktır."
