abstract: "Tefsir çalışmalarına özellikle ilk dönem âlimlerinin görüşlerinin ve tefsirlerinin büyük katkıları olduğu aşikârdır. Bu büyük âlimlerden biri de tâbiîn müfessirlerinden Saîd b. Cübeyr'dir (ö. 94/713). Bu çalışmada Saîd b. Cübeyr'in hayatı, İslâmî ilimlere katkısı ve ahkâm âyetlerini tefsiri araştırılmış ve onun tefsir ilmindeki yeri tespit edilmiştir. Araştırmada hem Saîd b. Cübeyr'in kendi görüşleri hem hocası Abdullah b. Abbas'tan (ö. 68/687) naklettiği rivayetler zaman zaman da bazı tâbiîn müfessirlerinin rivayet ve görüşleri değerlendirilmiştir. Saîd b. Cübeyr, erken dönemde ilmi, yazı ile kayda alan nadir tâbiîn âlimlerinden biridir. Mushafü Saîd b. Cübeyr adıyla kendisine nispet edilen bir tefsir eseri de vardır. Onu ilmî konularda özel kılan sebeplerden biri de hem Hicaz hem de Irak ilim merkezinden istifade etmiş olmasıdır. Yirmili yaşlarına kadar Mekke'de kaldığı süre zarfında İbn Abbas'tan istifade eden İbn Cübeyr, hayatının bir kısmını idame ettirdiği Kûfe'de ise Abdullah b. Mes'ûd'un (ö. 32/652-53) talebelerinden istifade etmiştir. Aynı zamanda onun hocaları arasında Medineli Abdullah b. Ömer (ö. 73/693) de dikkat çekmektedir. Her üç ilim merkezinin de anlayışını kendisinde toplayan Saîd b. Cübeyr'in, ahkâm âyetleri ile ilgili çokça rivayeti bulunmaktadır. Âyetleri kendi döneminin tefsir geleneğine uygun yöntemlerle tefsir eden Saîd b. Cübeyr'in tefsir ilmine katkıları kendisinden sonrakilere büyük bir usûl ve örneklik teşkil etmiştir. Çalışmamızı, Saîd b. Cübeyr'in ahkâm âyetlerini tefsiri ile sınırlandırmamızın sebeplerinden biri de onun fıkıh alanındaki bu yetkinliğini ifade edebilmektir. Çalışmamız giriş bölümünden sonra iki bölümden müteşekkildir. İlk bölümde Saîd b. Cübeyr'in hayatı, ilmî kişiliği, hocaları-talebeleri, tâbiîn tefsirinin genel özellikleri, yaşadığı dönemin ilmî, siyasî, kültürel ve sosyal durumu, onun İslâmî ilimlere katkısı, tefsir ilmindeki yeri, kendisine nispet edilen tefsir eseri ve tefsirinin kaynakları yer almaktadır. İkinci bölümde ise ahkâm âyetlerinin tanımı, tasnifi ve erken dönemde fıkhî tefsir geleneğine temas edildikten sonra Saîd b. Cübeyr'in ahkâm âyetlerine ilişkin rivayetleri ibâdat, muâmelat ve ukûbat başlıklarında tasnif edilerek incelenmiştir. Onun rivayetlerinde ahkâm âyetlerine ne ölçüde yer verdiği ve ilgili konulardaki görüşleri ortaya konulmuştur."
