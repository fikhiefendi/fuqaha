abstract: "?dari tasarrufların yargı denetiminden bahsedebilmek için öncelikle yargının yürütmeden ayrı ve bağımsız olarak islemesi gerekir. Bu manada ilk dönemlerden itibaren kuvvetler ayrılığı ilkesinin izlerine rastlamak mümkündür. Hz Ömer döneminden itibaren yasama, yürütme ve yargı erklerinin ayrı ve bağımsız islemeye basladığı görülmektedir. ?darenin tüm islemlerinin yargı denetimine açık olması hukuk devleti anlayısının bir sonucu olarak kabul edilmektedir. Kurumun kaynağı konusundaki farklı yaklasımlar bir yana, idari tasarrufların yargısal denetiminin Mezalim kurumu tarafından gerçeklestirildiği görülmektedir. Bu kurumun, ilk dönemlerde, sistemin sadeliği nedeniyle yargı faaliyetlerinin dısında da bir takım görevleri ifa ettiği görülmektedir. ?lk dönemlerde basit bir yapıda islerken süreç içinde bir kurul olarak görev yapmaya baslamıstır. ?darenin yargısal yolla denetiminin sağlanmasının dısında, idarenin kamu oyu tarafından sürekli denetime tabi tutulduğu görülmektedir. Ayrıca sivil hukukçular olarak nitelendireceğimiz fakihlerin de idareyi denetlediği görülmektedir. ?dare, vatandasa verdiği mali zararı ödemekle yükümlüdür. Ancak, idare adına hareket eden personelin sahsi kusur yada hizmet kusurunun tespiti önemlidir. ?lk dönemlerde teorik olarak böyle bir ayırıma gidilmemesine rağmen tazminatların devlet bütçesinden karsılandığı görülmektedir."
