abstract: "Bu çalışma, Ebu't-Tayyip es-Sindi'nin (ö. 1145)“Kurretü'l-Enzâr Ala Şerhi Tenviru'l-Ebsaâr”adlı eserinin mukaddime ve babu't-tahare kısmını tahkik ve incelemeyi amaçlamaktadır. Çalışmanın önemi, şerh edilen kitabın öneminden kaynaklanmaktadır. Bu kitap, et-Tamirtâşî'nin (ö. 1004)“Tenviru'l-Absar”isimli kitabı şerh eden Hasekfi'nin (ö. 1070)“Şerhu Tenvir'ul-Absar”adlı eserinin şerhidir. Kendisi fakih ve meşhur bir usûlçu olup döneminin en önde gelen Hanefi alimlerinden biridir. Hanefi fıkhının fürunda en önemli ve mutemet kitaplarından biri olarak sayılmaktadır. Es-Sindî'nin şerhinin önemi, yazma eseri olması henüz tahkik edilmemesidir. Bu da ona büyük bir ilmi değer kazandırılmıştır. Araştırmacı, İmam Ebu't-Tayyib es-Sindi'nin biyografisi ve ilmi hayatını açıklarken tanımlayıcı yöntemi izlemiş, nüshaları karşılaştırırken ve aralarındaki farklılıkların tespitinde ise metin kritiği yöntemi izlemiştir. Araştırma esnasında iki nüshaya itimat edilmiştir. Metinlerde yer alan Kur'an ayetleri ve hadislerin tahrici yapılmış, es-Sindî'nin gündeme getirdiği fıkhî konular aydınlatıcı olması amacıyla yorumlanmıştır. Çalışmadan ortaya çıkan en dikkat çekici sonuçlardan biri, Es-Sindi'nin kitabında Hanefi fıkhında taharet meselelerine ilişkin birçok fetva açıklamasının yer alması ve yazarın Hanefi mezhebi konusunda mutaassıp olmayıp Şafii mezhebi gibi diğer mezheplerden de bilgi aktarmış olmasıdır.“Her imamın kendi içtihadında ve görüşünde bir sevap alır”demesi de bununa bir delildir. Es-Sindî sadece alimlerin sözlerini nakletmekle kalmamış, aynı zamanda bazen o sözleri arasında kişisel içtihadına göre tercihte bulunur, bazen de kendisinden önceki ileri gelen bir mezhebin alimlerine de itirazda bulunmuştur. Bir kadının cenâbetten temizlenirken saçlarının tamamını yıkamasının vacip olduğu meselesi konusunda İbnü'l-Hammam'a istidrak etmiştir. Bu nedenle, bu eser üslubun açıcılığı ve belirsizliğiyle, İslam hukukunun literatürüne büyük bir katkı sağladığı düşünülmektedir. Bu eser yazarın bilgi birikimini, ilmi kişiliği ve bağımsız düşünce sahip olduğunu göstermiştir."
