abstract: "Tefsir ilminde müstakil bir usûlün/metodolojinin bulunup bulunmadığı ve bununla bağlantılı olarak tefsir ilminin müstakil bir ilim olarak kabul edilip edilemeyeceği son dönemde çokça tartışılan bir konudur. İslâmî ilimler manzûmesinde tefsir faaliyeti için metodolojik bilgi sunan ulûmu'l-Kur'an/tefsir usûlü ile fıkıh usûlü alanları öne çıkmaktadır. Bu iki alanda ortak olarak ele alınan konulardan birisi nesih konusudur. Bu çalışmada Bedreddin ez-Zerkeşî'nin (ö. 794/1392) ulûmu'l-Kur'an alanında kaleme aldığı el-Burhân fî ulûmi'l-kur'ân isimli eseri ile fıkıh usûlünde kaleme aldığı el-Bahru'l-muhît fî usûli'l-fikh adlı eserlerindeki nesih bölümleri mukayese edilererk bu konu özelinde ulûmu'l-Kur'an ile fıkıh usûlü arasındaki ortaklıklar ve farklılıklar tespit edilmeye çalışılmıştır. Böylece ulûmu'l-Kur'an ile fıkıh usûlünün mahiyeti, kapsamı, sınırı ve işlevsel değeri hakkında önemli ipuçları elde edilmesi hedeflenmiştir."
