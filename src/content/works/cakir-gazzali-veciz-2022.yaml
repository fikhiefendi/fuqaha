abstract: "Gazzâlî İslâmî ilimlerin hemen her alanında yaptığı çalışmalarla gerek kendi döneminde gerekse sonraki dönemlerde büyük yankı uyandırmış önemli bir şahsiyettir. Onun fıkıh sahasındaki çalışmaları da alana büyük katkılar sağlamış, müntesibi olduğu Şâfiî ekolünü uzun süre etkisi altında bırakmıştır. Nitekim üzerinde çalıştığımız el-Vecîz adlı eseri Şâfiî medereselerinde birkaç asır okutulmuş ve mezhebin sonraki literatürünün temel referans kaynağı olmuştur. Yaptığımız bu çalışmada amacımız Gazzâlî'nin diğer ilimlere sağladığı katkıya nazaran günümüzde geri planda kalan fıkhî yönünü bir nebze öne çıkarmak ve bu bağlamda el-Vecîz'in Şâfiî fıkhındaki yerini tespit etmekti. Araştırmamız sonucunda Gazzâlî'nin hiç de geri plana bırakılmayacak fıkhî bir mesaisinin olduğu tespit edilmiştir. Nitekim Gazzâlî, hepsi günümüze ulaşmasa da yirmi fıkıh eseri telif etmiştir. Bu eserler içerisinde Şâfiî mezhebi'nin en önemli beş metni arasında gösterilen el-Vecîz'in mezhebe tespit edilen en önemli katkısı, kendinden önceki teliflerin ciddi manadaki girift tasnifini sistematize edip, konuları karmaşadan kurtarması ve kavranmasını kolay hale getirmiş olmasıdır. Muhtasar geleneğin bütün özelliklerini kendisinde barındıran bu eser, aynı zamanda hemen her meselede diğer mezheplerin görüşlerini de içerdiğinden karşılaştırmalı bir fıkıh metni olarak da kabul edilmelidir. el-Vecîz'in sonraki telifatta otorite kabul edilen eserlerin temel referans kaynağı olduğu da tespit edilmiştir. Nitekim örneklem alanımız çerçevesinde görebildiğimiz kadarıyla Nevevî'nin er-Ravdâ adlı eseri el-Vecîz'in gerek sistematik açıdan gerekse içerik olarak biraz daha detaylandırılmış açılımı niteliğindedir. Her ne kadar Râfiî'nin el-Muharrer'inin el-Vecîz'in şerhi olmayıp müstakil bir eser olduğu yönünde bir kanaat bizde hâsıl olsa da Nevevî'nin el-Minhâc'ını yazarken ihtisar için kullandığı üslup ve sistem el-Vecîz'in etkisini bariz bir biçimde hissettirmektedir. Bu da el-Vecîz'in Şâfiî mezhebindeki mühim konumunu göstermektedir."
