abstract: "Müslümanlarla Yahudiler İslam'ın ilk yıllarından itibaren, asırlarca iktisadi, siyasi ve sosyal olarak sıkı ilişki içerisinde olmuşlardır. Uzun bir süre aynı coğrafyayı, benzer kültürü ve dolayısıyla benzer örfü paylaşmışlardır. Her iki toplumun dinlerinin ilahi kaynaktan beslenmiş olması, İslam'ın Yahudiliği onaylayan ( Maide, 5/46-48, Ali İmran, 3/50) bir din olması, aralarında bazı müşterek unsurların ortaya çıkmasına sebep olmuştur. Hukuk da bunlardan önemli bir tanesidir.Aile hukukunda örfün, teamülün ve kültürün önemli bir yeri vardır. Bu yönden ele alınınca aile hukuku, İslam hukuk sistemi ile Yahudi hukuk sistemi arasındaki bağlantının kolayca tespit edilebildiği bir alandır. Çalışmamız yakın ilişki içerisinde bulunan bu iki toplumdaki nikah akdini, nikaha dair uygulamalarını ve iki hukuk arasında bulunan münasebeti konu edinmiştir.Çalışmanın girişinde İslam ve Yahudi aile hukukunun kaynaklarına yer verilmiştir.Birinci bölümde genel olarak nikâh olgusuna, nikâh öncesi işlemlere ve nikâh akdine, ayrıca Yahudi hukukunda nikâh akdinin önemli unsuru olan ketuba kavramına, nikâh türlerine ve cariyelerle evliliğe temas etmeye çalıştık.Çalışmanın ikinci bölümünde nikâh akdinde gerekli olan diğer unsurlara, karşılıklı rıza, şahitler, vekâlet, velayet, mehir ve düğün konularına genel olarak değindik.Üçüncü ve son bölümünde, akdin kendisinden bağımsız, ancak akdin geçerliliğini ve sıhhatini etkileyen evlilik engellerine ve evlilik ehliyetini araştırma konusu edindik.Sonuç olarak nikâh bağlamında İslam aile hukuku ile Yahudi aile hukuku münasebetini müşterek unsurlar ve farklılıklar çerçevesinde tespit etmeye çalıştık.Anahtar Kelimler: Nikâh, Nikâh Akdi, Ketuba"
