abstract: "Bu çalışmanın temel amacı katılım bankalarında ki şer'i yönetimi uygulayan danışma kurullarının davranışlarını kontrol etmek için önerilen bir davranış kuralları tasarlayarak Türkiye'deki Islami bankacılık endüstrisini geliştirmektir. Araştırmacı, Islami bankacılık Türkiye'de hızla büyüyen bir sektör olduğundan, katılım bankalarında ki şer'i yönetim ile ilgili düzenlemelerin bu sektörün büyümesine ayak uydurmak için yetersiz olduğunu düşünüyor. Çalışma tarafından araştırılan iyi ve iyi olmayan davranışları izlemek için dünya çapında ve özellikle Türkiye'deki katılım bankalarının şer'i yönetim çerçeveleri analiz ediliyor. Islami finansta Şer'i yönetim çerçevelerinin bir ülkeden diğerine değiştiği gözlemlenmiştir, bu nedenle uygulamada iyi davranışları belirlemek ve iyi olarak tanımlanmayan davranışları belirtmek gerekli görülmüştür. Araştırmacı, Türkiye'deki katılım bankalarından, Participation Banks Association of Türkiye'den ve diğer akademik çalışmalardan ikincil veriler toplamıştır. Çalışma, katılım bankalarında şer'i yönetim ile ilgili uluslararası ve yerel standartların analizine dayanıyor. Ayrıca araştırmacı, bu çalışmada önerilen puanlama yöntemini kullanarak Türkiye'de katılım bankalarında şer'i yönetimin pratikte uygulanmasını değerlendirmiş, iyi davranışları izlemiş ve Türkiye'de bankacılıkta şer'i yönetime uygunluğu değerlendirme sürecini yürütmüştür. Bu çalışmanın nihai çabası, katılım bankalarının değerlendirmesini ve katılım bankaları için varolan şer'i hükümlerine uygunluk derecesini dikkate alarak önerilen bir davranış kuralları geliştirmek, Islami bankacılık sektörünü iyileştirmek ve Islami finans için danışma kurullarının etik standartlarının geliştirilmesine katkıda bulunmaktır. Bu çalışma ayrıca Türkiye'de katılım bankacılığı sektörünün geliştirilmesine yönelik önerilerde bulunmuştur ki bunların en önemlisi düzenlemelerde öngörülen iyi davranışların etkinleştirilmesi ve bunların etkinlik ve yeterliliğinin korunması için ilave iyi davranışlarla güçlendirilmesidir."
