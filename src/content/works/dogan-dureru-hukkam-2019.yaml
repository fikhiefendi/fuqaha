abstract: "Bu tez, Ali Haydar Efendi'nin (ö. 1835/1935) Dürerü'l-Hükkâm Şerhu Mecelleti'l-Ahkâm adlı eseri esas alınarak yapılan bir çalışmadır. Dürerü'l-Hükkâm Osmanlı medeni hukuku sayılan Mecelle'nin en önemli şerhlerindendir. Çalısma iki bölümden oluşmaktadır. Birinci bölümde Ali Haydar Efendi'nin hayatı, ilmi şahsiyeti ve eserleri hakkında bilgi verilmiştir. Müellifin eseri kaleme alırken takip ettiği usûl üzerinde durulmuştur. Rehin kitabında (701-728. maddeler) geçen kaynaklar müellifleriyle birlikte tanıtılmıştır. Ayrıca Dürerü'l-Hükkâm ve bu eserin özellikle rehin kitabı ile ilgili genel bilgilere yer verilmiştir. Çalışmanın ikinci bölümünde ise Dürerü'l-Hükkâm'ın rehin kitabı latinize edilmiştir. Ayrıca bu şerhte yararlanılan eserler ve bazı yerlerde müellifine atıf yapılan kitaplar tarafımızdan tespit edilmiştir. Latinize çalışması sırasında metnin aslına sadık kalınmaya çalışılmıştır."
