abstract: "Yatırımların ve girişimlerin ülkelerin ekonomilerinin gelişmesi için ne kadar önem arz ettiği malumdur. Bundan dolayı bütün ülkeler gerekli çalışmalarını yapmakta olup yöneticiler kendi ülkelerinin kalkınması, gelişmesi ve diğer ülkelere karşı söz sahibi olabilmesi için her yönüyle girişimcileri desteklemektedirler. Girişimcilerin ve yatırımcıların ise bu süreçte en büyük problemleri elbette kaynak ve sermaye temindir. Bu probleme çözüm olarak devlet teşvikleri verilerek girişimcilerin hayata geçirmek istedikleri fikirler desteklenmektedir. Ülkemizde de birçok ülkede olduğu gibi yatırımcılara kaynak olabilecek finansal araçlar bulunmaktadır. Dünyada ve ülkemizde bulunan İslami finans kurumları geleneksel bankacılığa alternatif olabilecek yeni araçlara ihtiyaç duyarak çalışmalarına devam etmektedirler. Ülkemizde yapılan bu çalışmaların temel odak noktası Türkiye'de bilinirliği az olan bu araçların tanıtımını yaparak kullanım alanlarını genişletmektir. İslami Finans araçları, yeni iş fikrine sahip olan girişimcilerin ihtiyacı olan kaynakları İslami hassasiyetlere dikkat ederek temin noktasında önem arz etmektedir. Bu çalışmada İslami finans araçlarının girişimcilere finansman kaynağı olma noktasında etkisi araştırılmıştır. Çalışma Düzce Üniversitesi'nde öğrenim gören öğrenciler üzerinde gerçekleştirilmiştir. Araştırmada nicel araştırma yöntemi çerçevesinde anket tekniğinden yararlanarak veriler toplanmıştır. Araştırma sonuçlarına göre; İslami finans araçlarının girişimcilik niyeti üzerinde istatiksel olarak anlamlı etkisi olduğu tespit edilmiştir. Yine öğrencilerin girişimcilik niyeti ile gelir seviyeleri, eğitim düzeyleri ve girişimcilik eğitimleri arasında istatiksel olarak anlamlı farklılık tespit edilmiştir."
