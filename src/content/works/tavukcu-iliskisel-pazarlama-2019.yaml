abstract: "Teknolojinin hızla gelişmesi ve ekonomik sistemin küreselleşmesi sonucu ortaya çıkan yeni rekabet ortamı ile karşı karşıya kalan Türkiye'deki katılım bankacılığı sektörü, rakiplerinden farklılaşarak müşterilerinin güven ve sadakatini kazanmak için çeşitli yöntem ve stratejilere başvurmaktadır. Bu stratejilerin başında; insan ilişkilerine dayanan, müşteri istek ve ihtiyaçlarına cevap veren, müşteri memnuniyetini ve sadakatini maksimum düzeyde tutmayı amaçlayan ilişkisel pazarlama anlayışı gelmektedir. Araştırmada, Türk katılım bankacılığı sektöründeki ilişkisel pazarlama uygulamalarının müşteri sadakati, müşteri memnuniyeti ve müşterilerin tavsiye etme eğilimi üzerine etkisi incelenmektedir. Çalışma, bu konu üzerinde bilgi sahibi olmak isteyen araştırmacılara ve Türkiye'de katılım bankacılığı sektöründe faaliyet gösteren bankalara katkı sağlayacağı düşünülmektedir. Çalışma kapsamında Türkiye'deki katılım bankaları müşterisi olan 400 kişi ile anket çalışması gerçekleştirilmiş olup, elde edilen sonuçlar değerlendirilmiş ve katılım bankacılığı sektörü ile ilgili çıkarımlarda bulunulmuştur. ."
