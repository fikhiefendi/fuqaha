abstract: "Bu tez, Türkiye Katılım Bankaları Birliği bünyesinde 2018 yılında kurulan Merkezi Danışma Kurulu'nun (MDK), katılım bankacılığı sistemindeki fıkhi yönetişim yapısına etkilerini incelemek amacıyla hazırlanmıştır. Tez konusunun seçilmesinde, İslami finansın küresel ölçekte artan önemi, Türkiye'de faizsiz finans alanındaki kurumsallaşma ihtiyacı ve MDK'nın bu süreçteki merkezi rolü belirleyici olmuştur. Özellikle sektörde yaşanan fetva farklılıkları, fıkhi standart eksiklikleri ve denetim yapılarındaki dağınıklık, bu yapının işlevselliğini araştırmayı gerekli kılmıştır. Tez yazım sürecinde hem teorik hem de uygulamalı yöntemlerden yararlanılmıştır. İlk aşamada literatür taraması yapılarak İslami finans, katılım bankacılığı ve fıkhi yönetişim kavramları derinlemesine analiz edilmiştir. Ardından, Türkiye'deki MDK'nın yapısı ve işleyişi değerlendirilmiş, Malezya, Suudi Arabistan ve İran gibi ülkelerdeki merkezi danışma kurulları ile karşılaştırmalı olarak incelenmiştir. Uygulamalı bölümde ise, İslam ekonomisi ve finansı alanında uzman sekiz kişi ile derinlemesine görüşmeler gerçekleştirilmiş ve elde edilen nitel veriler SWOT analizi yöntemiyle değerlendirilmiştir. Tez boyunca elde edilen veriler ışığında, MDK'nın sektörel düzenleme ve fıkhi standartlaştırma açısından kritik bir rol üstlendiği ancak kararlarının bağlayıcılığı, kurumsal bağımsızlık ve şeffaflık gibi alanlarda gelişime açık yönleri bulunduğu tespit edilmiştir. Bu bağlamda çeşitli politika önerileri geliştirilmiş ve Türkiye'de faizsiz finansın kurumsallaşması sürecine katkı sağlayacak çözüm yolları önerilmiştir."
