abstract: "Bu çalışmada İş akitlerinde süre konusu, İslam Hukuku çerçevesinde icare akdi özelinde, Türk Borçlar Kanunu çerçevesinde de iş sözleşmeleri kapsamında ele alınarak bu akitlerde süre kavramı, sürenin önemi ve hukuki neticeleri incelenmiştir. Çalışma, giriş bölümü dahil olmak üzere toplamda üç bölümden oluşmaktadır. Giriş bölümünde konunun muhtevası, kapsamı ve önemi değerlendirilmiştir. İkinci bölümde icare akdi, icare akdinin tanımı, meşruiyeti ve ilgili temel kavramlar üzerinde durulmuştur. Ayrıca bu bölümde iş akitleri ve çeşitleri hem İslam hukukuna göre hem de Türk iş hukukuna göre detaylı olarak ele alınarak mukayese edilmeye çalışılmıştır. Üçüncü bölümde iş akdinde süre konusu İslam hukuku ve Türk iş hukuku çerçevesinde mukayese edilerek ele alınmıştır. Bu kapsamda iş akitlerinde süre, sürenin belirsizliği, akde olan etkisi ve hukuki neticeleri detaylı olarak incelenmiştir. Sonuç kısmında ise iş akitleri ve iş akitlerinde süre hakkında elde edilen analizler değerlendirilerek elde edilen sonuçlar ele alınmıştır."
