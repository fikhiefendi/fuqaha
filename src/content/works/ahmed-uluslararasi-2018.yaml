abstract: "İslam devletleriyle Müslüman olmayan devletler arasındaki mali sözleşmlerin hükülerinin bilinmesi hem genelde tüm Müslümanlar özelde Müslüman tücarlar açısından önem arz etmketedi. \"Uluslararası Mali Sözleşmeler Hükmü\" başlıklı tezimizde bir giriş üç bölümden oluşmaktadır. Tezimizde konular mukayeseli bir şekilde ele alınmıştır. Giriş bölümünde üç konu incilenmiş. İlk kısımda sözleşmenin ve sevrvetin tanımı ele alınmış. İkinci kısımda, İslam devleti, İslami olmayan devlet ve devlet mefhumu kavramları incelenmiş. Üçüncü olarak uluslararası ekonomik ilişkilerin ahlaki boyutu, İslam hukuku kurallarına uyma, mütekabiliyet ve en son uluslararası koşullar ilkesi dikkate alınarak, İslam'da uluslararası ekonomik ilişkileri düzenleyen hususlar tartışılmıştır. İkinci bölümde, faizli sözleşmenin tanımı, hükmü ve İslam devleti ile yabancı devlet arasındaki yapılana faizli sözleşmlerin hükmü ele alınmıştır. Üçüncü bölümde, borsanın tanımı, yönetişimi, bankalar arası para transferleri ile ilgili kurallar ve uluslararası döviz sözleşmeklerindeki tarihleme kuralı ele anmıştır. Uluslararası Hizmet Sözleşmelerinin ikinci bölümünde üç başlığa yer verilmiştir. Birinci başlık altında Uluslararası Hizmet Sözleşmelerde yönetilen krediye karşı banka faizi alma kararı ve IMF'den borçlanma kararı ele alınmştır. Ticaret Sigortaları Kanunu'nun ikinci bölümünde ise, sigorta sözleşmesinin tanımı, menşei, türleri ve kararı işlenmiştir. Elektronik sözleşmelerin üçüncü bölümünde, sözleşmelerin türleri, hükümleri, yazım yöntemi ve benzer araçlar için sözleşme kuralı, ve modern iletişim yöntemi üzerinde sözleşme kuralı ve internet sitelerinde yapılan sözleşmenin sona ermesi üzerinde yapılan sözleşmler incelenmiştir. Bu bölümde ayrıca uluslararası mali tazminat sözleşmelerinin hükümleri ele alınmıştır. İkinci bölümde kiraya sözleşmesi tartışılmıştır. Burada Kira sözleşmesinin yasallığı açıklanmış, akabinde genel olarak uluslararası kiralama sözleşmesinin kuralları ve kiraya veren ile yabancı kiracı arasındaki kira sözleşmesi ve yabancı kiralayan ile kiralayan arasındaki ilişki incelenmiştir. Ayrıca bir yabancıyı, kendi dinleriyle ilgili bir çalışma yapmaya ve yabancı için özel bir ücret de olsa Müslüman bir yabancının işe alınma kuralı ele alınmıştır. Üçüncü bölümde, Uluslararası Finans II Ajansı'nın (IFA) sözleşmesi hakkında Ajans sözleşmesini bilerek, meşruiyetini ve Uluslararası Finans Ajansı (IFA) sözleşmesinin yönetimini göstererek bunun nasıl olacağı hakkında incemeler yaptım. Dördüncü bölümde ise, uluslararası tedarik sözleşmesini inceledim. Burada tedarik sözleşmesinini esasları ve uluslararası tedarik sözleşmesinin nasıl sağlanacağı hakkında izahatlarda bulundum."
