abstract: "Ülkelerin aralarındaki ticari münasebetler iletişim, teknoloji ve ulaşım alternatiflerinin gelişmesiyle beraber artış göstermiştir. Ulusların genelde coğrafi konumları dolayısıyla barındırdıkları zenginliklerinin ticaretini konu edecek şekilde tanımlayabileceğimiz uluslararası ticaret faaliyetleri de kayda değer artış sergilemektedir. Bununla beraber ilgili uluslararası ticaretin finansmanına ilişkin karşılaşılan sorunlar finans çevreleri tarafından çalışma konusu olarak ele alınmaktadır. Özellikle az gelişmiş ve gelişmekte olan ülkeler uluslararası bankalar nezdinde taşıdıkları risk dolayısıyla ihtiyaç duyulan finansmana ulaşamamaktadırlar. Buradan hareketle mevcut finansal düzen ile alakalı belirgin bir değişiklik ihtiyacı söz konusu olmaktadır. Küreselleşme ile beraber belirli aralıklarla dünya genelinde yaşanan finansal krizler göstermektedir ki mevcut finansal düzen ihtiyaçlara cevap verememektedir. İslam dini tarafından kati suretle yasaklanan riba işlemlerine alternatif olacak şekilde hizmet sunma fikri ile kurulan katılım bankalarının bu süreçte daha aktif rol almaları gerekmektedir. Konvansiyonel bankaların mevcut uygulamalarını taklit etmeye gerek kalmayacak şekilde, İslam ekonomisi bünyesinde ilgili finansal sorunlara çözüm sağlayabilecek alanı ve imkânı ihtiva etmektedir. Bu çalışmada varlığa dayalı ve varlığa bağlı murabaha işlemleri açıklanarak İslami yapılandırılmış emtia finansmanına ilişkin hususlar açıklanmıştır. Özellikle varlığa bağlı murabaha uygulamalarının İslam ekonomisi esaslarına daha uygun gösterdiği ifade edilmiştir. İlaveten yapılan çalışmada katılım bankalarının mevcut uluslararası emtia finansmanına ilişkin farklı bir yaklaşım getirecek şekilde yeni bir işleyiş tavsiyesi önerilmiştir. Bu değişim neticesinde katılım bankalarının işleyişine yeni bir soluk getireceği ve böylelikle müşterilerine alternatif bir kazanç yolu açacağı düşünülmektedir."
