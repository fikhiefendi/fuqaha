abstract: "Araştırmanın amacı, katılım bankalarının fonksiyonlarını ve bu kurumların klasik bankalarla farklılıklarını incelemek ve kârını etkileyen faktörleri irdelemektir. Araştırmayla ilişkili literatür tarandıktan sonra, dört katılım bankasına ait bağımsız denetimden geçmiş mali tablolar kullanılarak analiz yapılmıştır. Etkinlik ölçümü için Veri Zarflama Analizi yöntemi kullanılmıştır.Katılım bankaları faiz unsuruna kendi bünyelerinde yer vermeseler de; piyasada oluşan faiz oranları katılım bankalarının fonlarını yatıracakları alanları etkilemektedir. Ülkemizde 2010 yılı sonu itibariyle 4 banka, 607 şube, 12.677 personele ulaşan katılım bankaları, aktif toplamı açısından bankacılık sektörünün %4,3'lük kısmını oluşturmaktadır. Şube başına yaklaşık 21 personel ile sektörün üzerinde bir yoğunlukta istihdam sağlamaktadır. Bu nedenle personel ve şube ile ilgili analizler sektörün altında gerçekleşmektedir. Katılım bankalarının sermaye yeterlilik oranları sektörden düşük; likidite yeterlilik oranları, dağıtılan kâr payı oranları ve etkinlik dereceleri sektörden yüksek olduğu ortaya çıkmıştır. Faizsiz bankacılık yapması, fon toplama ve kullandırma yöntemlerinin farklı olması, mal ve paranın atıl bekletilmemesi katılım bankalarının bütün işleyişini, dolayısıyla kârlılıklarını etkilemektedir."
