abstract: "Tezimizde son asırda yaşamış ve fıkıh sahasında pek çok çalışmaya imza atan Taha Câbir Alvânî'nin fıkıh anlayışı, özgünlükleri ve eksiklikleri, klasik ve modern fıkıh çalışmaları arasında nereye tekabül ettiği, fürû anlayışının usûl görüşlerine ne derece mutabık kaldığı gibi hususlar incelenmiştir. Birinci bölümde Alvânî'nin İslam düşüncesinde yenilenmenin teorik zeminini Bilginin İslamileştirilmesi ve pratik açıdan örneğini ise fıkhu'l-ekalliyat üzerinden inşa ettiği tespit edilerek bu konulardaki düşünceleri tarihi gelişim seyri içerisinde incelenmiştir. İkinci bölümde Alvânî'nin usûle dair görüşleri ele alınıp sistematik ve tutarlılık açısından değerlendirilmiş, klasik fıkıh geleneğinden ne ölçüde ayrıldığı tespit edilmiştir. Üçüncü bölümde Alvânî'nin füru fıkha dair bazı görüşleri klasik ve modern görüşlerle mukayeseli olarak ele alınmış, ayrıca füru görüşlerinin usûl anlayışıyla ne kadar tutarlı olduğu da incelenmiştir."
