abstract: "Bu çalışmanın amacı, tarihten beri var olan yoksulluğun nedenlerini, oluşumuna sebebiyet veren unsurları araştırmak ve bunlara karşı, Kur'ân ahlâkını çözüm önerisi olarak çeşitli yöntemlerle sunmaktır Bu eksen etrafında çalışma, giriş ve iki bölümden oluşmaktadır. Giriş kısmında; İslam'dan önceki ilahî dinlerin yoksulluğa bakış açılarından ve yoksulluğu doğuran akım ve sistemlerden ve bu sistemlerin üzerinde inşa edilmiş temel düşüncelerden, küreselleşmenin yoksulluk ile ilişkisinden bahsedilmektedir. Birinci bölümde, Kur'ân'da yoksulluk kavramı, Kur'ân'a göre insan ve sorumlulukları, mal ile münasebetleri, Kur'ânî modelin bakış açısıyla ele alınmaktadır. İkinci bölümde ise, İslam'ın yoksulluğa karşı sunduğu çözüm önerileri anlatılmaktadır. Sonuç olarak, insanın varoluşundan günümüze kadar, toplumlar arasında adaletsizlikler ve zulümler ortaya çıkmış ve bunun doğal sonucunda, birtakım sorunlarla beraber kitlesel ölümlere neden olan küresel yoksulluk da oluşmuştur. Böylece çok hızlı değişen modern dünyamızda, başta İslam toplumları olmak üzere bütün uluslar, içinde bulundukları bu kaotik durumdan çıkmak için bir durum tahlili yapmaları gerektiğini fark etmişlerdir. Bundan dolayı çıkış yolu olarak, Kur'ân'ın yoksulluğa karşı bakışını ve ona karşı çözüm önerilerini araştırmak, daha da önem arzetmektedir. Çalışmamızın ana konusunu da bu tema oluşturmaktadır."
