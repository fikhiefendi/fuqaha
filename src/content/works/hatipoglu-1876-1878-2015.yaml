abstract: "Çalışma 1776/22 numaralı ve 1876-1878 tarihlerini içeren Samsun Şer'i Mahkemesine ait şer'iyye sicil defterinin transkripsiyon ve tahlilidir. Defterdeki kayıtların tamamı terekelerden oluşmaktadır. Tez, giriş hariç iki bölümden oluşmaktadır. Giriş kısmında, araştırmanın problem ve önemi, veri toplama araçları, araştırmanın sınırlılıkları ile kullanılan yöntemler ve şer'i sicillerde geçen bazı belge türleri hakkında bilgi verilmiştir. Birinci bölümde 1876-1878 tarihli Samsun şer'iyye sicil defterinde geçen kayıtlardan yola çıkarak, Samsun'un 19. yüzyıl sonlarındaki sosyal, kültürel, ekonomik ve idari yönlerden değerlendirmesi yapılmıştır. Ancak çalışmamız sadece 1876-1878 tarihleri arasında tutulan 1776/22 nolu defterle sınırlı olduğu için kesin yargılara ulaşmak mümkün olmamaktadır. Çalışmanın ikinci bölümünde asıl metnin latin harflerine traskripsiyonu yapılmıştır. Transkripsiyon yapılırken kayıt başlarında içerikle ilgili kısa özet verilmiştir. Samsun'un 1876-1878 tarihleri arasındaki idari ve etnik yapısını, sosyal ve ekonomik hayatını şer'iyye sicilini merkeze alarak inceledik. Böylece Samsun'da farklı etnik unsurların bir arada yaşadıklarını, insanların geçim kaynağı olarak tarım ve hayvancılığın dışında ticaretle de uğraştıklarını gördük. Ayrıca şehrin ticaret yolu üzeride olması, ulusal ve uluslar arası bir limanının bulunması nedeniyle çevre şehirlerden Samsun'a göçlerin yaşandığını tesbit ettik."
