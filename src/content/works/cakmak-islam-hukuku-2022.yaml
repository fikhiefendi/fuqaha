abstract: "Otopsi, ölü cesedinin içinin açılarak incelenmesidir. Genelde otopsi; adlî otopsi, hastalıkla ilgili otopsi ve ilmî(tıbbî) otopsi olmak üzere üçe ayrılır. Günümüzde hastalıkların teşhisi ve tedavisi, tıp ilminin ilerlemesi ve şüpheli ölüm vakalarında ölüm sebebini aydınlatmak için otopsi oldukça önem arz etmektedir. Literatür tarama yöntemi kullanılan bu nitel çalışmada İslam hukukuna göre otopsinin caiz olup olmadığı klasik İslam kaynakları ışığında delilleriyle birlikte ortaya konmuştur. Fukahâ'nın otopsiyle karşılaştırılabilecek konularda verdiği fetvalar, İslam hukukunun delilleri ve İslam hukukunun küllî kâidelerine göre adaletin tecelli etmesi, hastalıkların teşhisi ve tedavisi için otopsi zaruret gereği caiz görülmüştür. Ancak kadavra otopsisinin caiz olabilmesi ise bazı şartlara bağlanmıştır. Bu çalışmada otopsiye cevaz vermeyenlerin görüşleri de zikredilmiş ve bu görüşlere yapılan itirazlara yer verilmiştir. Araştırmanın giriş bölümünde tez ile ilgili bilgilere yer verilmiştir. Araştırmanın birinci bölümünde otopsinin mahiyeti, tarihçesi, otopsiyle ilgili kavramlar ve otopsinin aşamalarından bahsedilmiştir. Araştırmanın ikinci bölümünde İslam hukukuna göre otopsinin hükmü, otopsinin caiz olduğu görüşü, otopsinin caiz olmadığı görüşü, otopsinin şartları ve cezaları, otopsinin faydaları, kadavranın satın alınması ve pozitif hukukta otopsiden bahsedilmiştir."
