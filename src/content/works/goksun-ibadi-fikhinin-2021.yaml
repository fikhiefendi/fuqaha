abstract: "Fitne dönemi sonrasında ortaya çıkan ve Hâricîlerin Ehl-i sünnete en yakın fırkası olarak bilinen İbâdiyye mezhebi gerek fiziksel uzaklığı gerek düşüncelerinin farklılığı dolayısıyla detaylı olarak araştırılmamıştır. İslam dünyasında yapılan çalışmalarda mezkûr mezhebin itikadî boyutu araştırma konusu olmuş; ancak fıkhî/amelî boyutu yeterince araştırılmamıştır. Halbuki İbâdiyye mezhebinde azımsanmayacak derecede geniş bir fürû fıkıh literatürü bulunmaktadır. Bu literatürün oluşumu mezhebin kurucu imamı Câbir b. Zeyd (v.93) ile İslam tarihinin erken dönemlerinde başlamıştır. Mezhep; Umman, Libya, Tunus, Cezayir, Zengibar gibi günümüz İslam coğrafyasının farklı yerlerinde varlığını devam ettirdiği için literatür oluşumu da günümüze kadar devam etmiş ve hali hazırda da devam etmektedir. Yukarıda zikrettiğimiz araştırma eksikliğinden ötürü, bu çalışmada öncelikle mezhebin günümüzdeki temsilcisi konumunda olan en çok Umman hakkında ve İbâdiyye mezhebinin doğuşu ile itikadi görüşleri hakkında bilgiler verilmiştir. Akabinde ise İbâdî fıkhını tanıtıcı bilgilere yer verilmiştir. Bu bağlamda önce İbâdî fıkhının kurucu isimleri, mezhebin fıkıh usulü anlayışı ve farklı fürû görüşleri ele alınmıştır. Müteakip bölümde ise İbâdiyye mezhebinin fıkhî boyutunun tarihsel süreçte geçirdiği merhaleler, her asırda yaşamış İbâdî fukaha ve onların kaleme aldıkları fıkıh eserleri incelenerek tespit edilmeye çalışılmıştır. Bu yöntemle hem İbâdî fıkıh literatürüne dair bilgiler edinilmiş hem de mezhebin fıkıh tarihi incelenerek İbâdî fıkhının teşekkül süreci ve bu süreçte etkili olan durumlar ortaya çıkartılmaya çalışılmıştır."
