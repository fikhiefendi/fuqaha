abstract: "Caferilik mezhebinin ortaya çıkışı ile ilgili olarak çeşitli tezler ortaya atılmaktadır. Bütün Şii mezheplerde hâkim olan ortak görüşe göre Hz. Ali halifeliğe nass ve tayin ile seçilmiştir ve imam kabul edilen kişiler masumdurlar. Hz. Ali oğulları Hz. Hasan ve Hz. Hüseyin ile sıralı 9 torunu ihtiva eden on iki kişi imam olarak anılmış ve bu döneme de“imamlar dönemi”olarak adlandırılmıştır. On ikinci imamın kaybolması sonrası başlayan küçük gaybet döneminde (874-941) ilk olarak mezhebin fikrî temelleri atılmış ve mezhep mensupları“İsnâaşeriyye veya İmâmiyye”olarak anılmaya başlanmışlardır. Görevlendirilen dördüncü sefirin vefatı ile beraber küçük gaybet dönemi bitmiş ve büyük gaybet dönemi (941) başlamıştır. Büyük gaybetin başlamasından günümüze kadar Caferilik mezhebi çeşitli gelişmeler kaydetmiştir. Mezhebin yaygın olarak bulunduğu İran topraklarına ve Bağdat'a hâkim olan hânedanların gelişmeler üzerinde ciddi tesirleri olmuştur. Özellikle Safevîler döneminde Ahbarî bir fıkıh anlayışı hâkim olmuştur. Mezhep, Caferilik olarak anılmaya ilk Afşar Hânedanı hükümdarı Nadir Şah dönemi ile başlanmıştır. Afşarlar döneminde mezhep sadece isim değişikliğine gitmemiş aynı zamanda Ahbarî fıkıh anlayışından Usulî fıkıh anlayışına da dönüşüm yaşanmıştır. Bu çalışmanın amacı yaşanan bu dönüşüm aşamasındaki Osmanlı-Afşar ilişkilerini mercek altına almak ve sürece katkılarını irdelemektir. Şöyle ki, Nadir Şah toplumdaki mezhebî dönüşüm arzusunu iyi etüt etmiş, teknik olarak hazırlık yapmış ve bu dönüşümde dış destek almak için Osmanlı Devleti'nin yardımına müracaat etmiştir. Dönüşümden murat edilen en önemli hususlar ise Caferilik'in hak mezhep olarak kabul edilmesi ve Mekke'de rükün verilmesi olmuştur. Yapılan diplomatik müzakerelerde Nadir Şah'ın Caferilik'i dönüştürme projesine istenilen düzeyde siyasi destek çıkmamıştır. Ancak 1743 senesinde Necef'de yapılan ve aralarında Osmanlı Devleti yöneticilerinin de görevlendirdiği Sünnî âlimlerin de katıldığı ilmi istişarelerden Nadir Şah'ın düşüncesine ilmi destek çıkmış ve uzlaşma metni toplam 43 âlim tarafından imzalanmıştır. Yakın tarih âlimlerinin meseleye benzer şekilde açıklamalar yapmaları ve el Ezher şeyhlerinden Mahmûd Şeltût'un 1 Ekim 1958 tarihinde Caferiliğin hak mezhep olduğuna dair fetva vermesi ve akabinde Ezher'de bir Caferî fıkıh kürsüsünün kurulması tartışmanın bir süre daha devam edeceğini gözler önüne sermektedir."
