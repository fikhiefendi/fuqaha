abstract: "Bu araştırma“İslam Devleti'nin Ekonomik Faaliyetlere Müdahalesi”konusunu içermektedir. Bu konu dört bölüm halinde ele alınmıştır. Birinci bölümde devlet kavramı, devletin İslam'daki faaliyet alanı, en belirgin görevleri ve otoritesi açıklanmıştır. Aynı zamanda İslam şeriatının devletteki üstünlük ve hâkimiyeti açıklanmıştır. Daha sonra İslam'ın ekonomik faaliyetlerini açıklayan, kaza ve hisbe yönünden görev organlarını belirten, müesseseleri ve yasama otoritelerini açıklayan ikinci bölüm gelmektedir. Bu bölüm iktisadi faaliyetlerin unsurları olan üretim, dağıtım, harcama ve stoklama mevzularını açıklamak suretiyle sonlanmaktadır. Üçüncü bölüm araştırmanın en önemli odaklarını tartışır. Devletin İslamî-iktisâdî faaliyetlere müdahalesini göz önünde bulundurarak konuyu ele alır. Aynı zamanda devletin müdahalesinin meşruiyetini araştırmakta ve İslâmî devletin ekonomiye müdahalesinin esaslarını ve gerekçelerinin yasal unsurlarını gerek ferdî gerekse toplumsal düzeyde göstermektedir. Dördüncü bölüm ise devletin mali yönden ekonomiye müdahalesini; kaynaklar, mâlî siyaset, mülkiyet piyasanın düzenlenmesi ve ekonomik faaliyetlerin planlanması vb. konularıın yardımıyla tartışır. Dolayısıyla bu araştırma, İslam'da devletin ekonomik faaliyetlere müdahalesine ışık tutan bir sonuca ulaşır, bu müdahalenin mekanizmasını ve onun ortaya koyduklarını açıklar. Ayrıca İslam devletinin ekonomik faaliyetlerde gözettiği ve önem verdiği ilkeleri özetler. Araştırmacı bu araştırması süresince İslam şeriatının esaslarına dayanarak“analitik tanımlayıcı”bir yöntem takip etmiştir. Yine araştırması esnasında konuyu Allah'ın razı olacağı ve insanların faydalanacağı şekilde ele almaya çalışmış ve bir takım netice ve tavsiyelerle araştırmasını sonlandırmıştır."
