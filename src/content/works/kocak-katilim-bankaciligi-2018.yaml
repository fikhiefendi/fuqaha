abstract: "Dünyaæ ekonomisininæ gelişimiæ ileæ birlikteæ finansæ sektörüæ veæ bankacılıkæ sektörüæ faaliyetleriæ heræ geçenæ günæ gelişmekteæ veæ yeniæ bankacılıkæ faaliyetleriæ ortayaæ çıkmaktadır.æ Dünyaæ finansæ piyasalarındaæ veæ bunaæ paralelæ olarakæ Türkiyeæ ekonomisiæ içerisindeæ sonæ 30-40æ yıllıkæ süreæ zarfındaæ ortayaæ çıkanæ veæ gelişiminiæ hızlaæ sürdürenæ biræ bankacılıkæ türüæ bulunmaktadır.æ Dünyadaæ İslamiæ bankacılıkæ veyaæ faizsizæ bankacılıkæ adıæ ileæ faaliyetleriniæ sürdürenæ buæ kuruluşlaræ Türkiye'deæ katılımæ bankacılığıæ adıæ ileæ faaliyetæ göstermektedirler.æ Dünyaæ ekonomikæ sistemiæ içerisindeæ kendineæ kısaæ zamandaæ önemliæ biræ yeræ edinenæ faizsizæ bankacılıkæ işlemlerindenæ Türkiyeæ gibiæ stratejikæ veæ siyasiæ olarakæ önemliæ biræ konumaæ sahipæ ülkeninæ uzakæ durmasıæ düşünülemezdi.æ Türkiyeæ finansæ piyasası,æ İslamæ coğrafyasındaæ toplananæ sermayeæ fazlasınıæ ülkeæ ekonomisineæ kazandırmakæ veæ içæ piyasadaæ atılæ fonlarınæ değerlendirilmesineæ olanakæ tanımakæ içinæ katılımæ bankacılığıæ faaliyetlerindeæ bulunmakæ durumundaydı.æ Sonæ 10æ yıllıkæ süreæ içerisindeæ katılımæ bankacılığıæ faaliyetlerineæ yönelikæ dahaæ fazlaæ yatırımæ yapıldığıæ veæ buæ sektörünæ gelişimineæ devletæ politikasıæ gereğiæ olarakæ önemæ verildiğiæ görülmektedir.æ Günümüzæ itibariyleæ katılımæ bankalarınınæ Türkiyeæ bankacılıkæ sektörüæ içerisindekiæ Pazaræ payıæ ortalamaæ %5'likæ biræ oranaæ sahiptir.æ Üçæ farklıæ özelæ sermayeliæ bankaæ veæ ikiæ devletæ sermayeliæ katılımæ bankasıæ ülkeæ ekonomisiæ içerisindeæ faaliyetæ göstermektedir.æ Ülkeæ ekonomisiæ içerisindeæ sonæ yıllardaæ yapılanæ atılımlarlaæ birlikteæ önemliæ biræ yeræ edinmeyeæ çalışanæ katılımæ bankalarının,æ bankaæ müşterileriæ gözündeæ yarattıklarıæ algıæ veæ bakışæ açısıæ katılımæ bankalarınıæ gelecekæ hedeflerineæ taşıyacakæ veæ istedikleriæ konumaæ gelmelerindeæ etkiliæ olacakæ enæ önemliæ faktördür."
