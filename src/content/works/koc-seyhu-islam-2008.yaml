abstract: "Bu tez 17. yy Osmanlı Şeyhulislamlarından olan Minkârizâde Yahya Efendi'nin aile hukukuyla ilgili fetvalarının bir bölümü olan boşanma konusuyla alakalı fetvalarını Türkçeye çevirme, verdiği dipnotların kaynak gösterdiği eserlerde olup olmadığını tespit etme, atıfta bulunduğu eserler ve müellifleri hakkında bilgi verme, fetva ve kaza arasındaki ilişki ve Osmanlıda Şeyhulislamlık kurumu konularını kapsamaktadır.Araştırma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı ve yöntemi açıklanacak. Birinci bölümde Şeyhulislam'ın hayatı, eserleri, fetva ve kaza arasındaki ilişki, Şeyhulislamlık, Osmanlıda Şeyhulislamlık konuları hakkında bilgi verilecek. İkinci bölümde fetvalar Türkçeye çevrilecek, Arapça dipnotlar tercüme edilecek ve eserde geçen kitap ve müellifleri hakkında bilgi verilecek. Üçüncü bölümde eser metin yazımı yönünden tahkik edilecek ve değerlendirme yapılacaktır. Sonuç bölümünde eser hakkında genel bir değerlendirme yapılacaktır."
