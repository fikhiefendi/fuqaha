abstract: "“Ecr ve Damân İctima' Etmez”kâidesi Mecelle'nin ilk yüz küllî kaidesi içinde 86. kâide olarak geçmektedir. İmam Muhammed'in el-Asl isimli eserinden derlenmiştir. Hanefi mezhebinin kâideleri arasında zikredilir. Ücret; icare akdinin rükünlerinden biri ve menfaatin bedelidir. Damân konusu ise fıkhın tüm alanlarında özellikle de borçlar hukuku ve yargılama hukuku alanlarında karşımıza çıkan temel konulardan birisidir. Kâidenin konu muhtevasına bakıldığı zaman mal, menfaat, kabz, fesh gibi birbirleri ile bağlantılı konuları içerdiğini görüyoruz. Kâidenin özünde ve mezheplerin ihtilafının temelinde menfaatin tazmin meselesi yer almaktadır. Mezhepler bu kâide üzerinde ihtilaf etmişler, Hanefi mezhebi bir tarafta diğer mezhepler bir tarafta yer almıştır. Bu ihtilafın sebepleri birden fazladır. Göze çarpan ilk ve belki de en önemli ayrım kanaatimizce kavramlara yüklenen tanım farklılıklarıdır. Hanefi nazariyesinde kâide hakkında verilen önceki içtihatlardan zamanın ve şartların gelişimine paralel olarak farklı içtihatlar geliştirilmiştir."
