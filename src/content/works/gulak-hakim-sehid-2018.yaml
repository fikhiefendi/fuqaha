abstract: "Hanefî mezheb imamlarının görüşlerinin nakli konusunda temel eserler, İmam Muhammed'in (v. 189/805) telif ettiği Zâhiru'r-rivâye eserleridir. Zâhiru'r-rivaye eserlerinden sonra en önemli eserlerden biri bunları bir araya getiren Mervezî'nin el-Kâfî adlı eseridir. Serahsî (v. 489/1090), İsbicâbî (v. 480/1087), Enbârî (v. 331/942) gibi âlimlerin bu esere şerhler yazmış olması, kaynaklardaki el-Kâfî'ye yapılan atıflar, tabakât ve tarih kitaplarındaki ifadeler de bunu açıkça bize göstermektedir. Ancak eser incelendiğinde Mervezî'nin Zâhiru'r-rivâye eserleri cem etmekle yetinmediği Nâdiru'r-rivâye eserlerden de çokça yararlandığı anlaşılmaktadır. el-Kâfî'nin bütün halinde tahkikli bir neşri yapılmamıştır. Bazı bölümleri lisansüstü tez çalışmaları kapsamında tahkik edilmiş günümüze kazandırılmaya çalışılmıştır. Bu çalışmada da önemine binaen Kitabu't-talâk bölümü tahkik edilmiştir. Tahkik çalışmamızda müellif nüshasının bulunmaması sebebiyle en eski tarihli nüsha esas alınmıştır, bu nüsha diğer üç nüsha ile karşılaştırılarak tahkikli metin ortaya çıkarılmaya çalışılmıştır. Tahkikte tercihli metod kullanılmış nüsha farklılıkları belirlenen rumuzlarla dipnotlarda verilmiştir."
