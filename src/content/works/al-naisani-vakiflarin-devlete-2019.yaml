abstract: "Bu tezin amacı; Vakıfların، devlete destek sunduğu alanları belirtmek ve devletin yaşadığı bütçe açığını kapatmadaki rolünü ayrıntılı bir şekilde açıklamaktır. Bu çalışmada; vakfın kavramı، meşruiyeti، temelleri، türleri، tüzel kişiliği، devletin onun üzerindeki velayeti، bu velayetin olumlu ve olumsuz etkileri açısından Onu devletle bağlayan ilişkinin niteliği izah edilirken eğitim ve sağlıktan ekonomi alanlarına kadar tarih boyunca vakıfların kalkınma alanlarında devlete sağlamış olduğu desteklerin rolü gözler önüne serilmiştir. Ayrıca devletin yaşadığı bütçe açığına karşı، açığı kapatma mekanizmasının çalışma metodu hakkında bilgiler verilmiştir. Bununla birlikte vakfın genel kavramı، ilkeleri، unsurları، bütçe açığı kavramı، bütçe açığı türleri ve bu sorunu çözmek için kullanılacak finans kaynakları türleri، bütçe açığı oluştuğunda direk veya dolaylı olmak üzere vakfın bu mali açığı kapatma mekanizmasıyla ilgili konular detaylı bir şekilde açığa kavuşturulmuştur. Tezin sonunda sonuç ve bir takım tavsiyelere yer verilmiştir."
