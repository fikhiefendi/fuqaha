abstract: "Bu çalışmanın konusu Allâme Ahmed bin Ömer ed-Derîrî el-Ganîmî eş- Şafiî'nin(ö.h.1151), Şeyhü'l-İslam Zekeriyâ e-Ensârî'nin (ö.h.926) azat etme meselesi ve hükümleri ile ilgili yazmış olduğu“el-Menhec”e Yapılan Son Şerh Olan“Fethu'l-Melik el- Barî”adlı eserinin tahkiki ve değerlendirmesinden oluşmaktadır. Bu eserin önemi; Şeyhü'l- İslam Zekeriyâ el-Ensârî'nin, Şafiî âlimlerinin temel kaynaklarından biri olup, en önemli muhtasar eserlerden olan“Menhecü't-Tullâb”kitabının bir bölümüne yazılmış olan şerhi içeriyor oluşundan kaynaklanmaktadır. Müellif bu eserde azat etme konusunu, sınırlarını, kurallarını ve hükümleri ile onunla ilgili diğer bölümlerde geçen örneğin vasiyet, nafakalar, rehin, mîras ve benzeri kavramları Şafiî mezhebine göre açıklamıştır. Eserde; konuyla ilgili büyük Şafiî âlimlerinin ifadelerini yer yer açıklamış yer yer itiraz etmiş ve yer yer o görüşleri kullanmayı tercih ederek; sahih aklî ve naklî deliller gösterip meseleyi farklı cihetlerden açıklayıp tartışmıştır. Bu çalışmanın araştırma bölümünde, Şeyh ed-Derîrî'nin hayatı, ilmî ve şahsî kişiliği incelenirken betimleyici-tarihsel yaklaşım izlenmiştir. Metnin analiz edildiği bölümde; metnin yazımı ve harekelendirilmesi, nüshaların karşılaştırılması ve farklarının tespit edilmesi, meselelerin geçtiği yerlerin ve ifadelerin kimlerden alındığının tespit edilmesi ve dipnotlarda belirtilmesinde inceleme, yorumlama ve araştırma-bilimsel metodu izlenmiştir. Bu çalışmadan çıkan sonuçlar şunlardır: Kitap, Şafiî mezhebine göre hazırlanmış olup, ayrıntılı fıkhî hükümler, mantıksal delillendirmeler, güzel çıkarımlar ve kıymetli yorumlar bakımından oldukça zengindir. Müellifin ilgili konuda yapılan itirazları ele alırken gösterdiği hassasiyet ve açıklamalarında yer alan dilbilimsel, gramer ve morfolojik yorumlar onun geniş kültürünü ve zengin bilgi birikimini göstermektedir. Ayrıca büyük bir ilmî değere sahip olan bu kitapta; ed-Derîrî fıkhi meselelerle ilgili lafızlardan aktarım yaparken insiyatif kullanmıştır. Bu nedenle, müellefin kastettiğini anlayabilmek için daha çok araştırmaya, incelemeye ve değerlendirmeye ihtiyaç bulunmaktadır."
