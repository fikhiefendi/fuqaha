abstract: "Başlığı:“Fıkhî Kaideler Işığında Hafifletici İstisnaî Haller ve Hükümleri”olan araştrmamızda olağanüstü ve istisnaî haller ile bunların fıkhî hükümlerin hafifletilmesine etkilerinin bir araya toplanması, açıklanması ve tüm alt konularına ilişkin toplayıcı ve dü-zenleyici fıkhî kaidelerin çıkarılması hususları ele alınmaktadır. Araştırma bir önsöz ve dört ana bölümden oluşmaktadır. Birinci Bölüm, fıkhî kai-deler ilmi hakkında kuramsal bir çalışma içermektedir. Bu bölümde, fıkhî kaidelerin mahi-yeti, delilleri, önemi, ortaya çıkışı, gelişimi, kaynakları, bu hususta alimlerin izledikleri yöntemler, ayırt edici özellikleri ve ilgili diğer kaideleri ele aldık. Ayrıca bunlarla istidlal ve ihticac konusunu tartıştık. İkinci Bölüm, istisnaî haller ve hükümler ile Şâri'in hafifletmelerini açıklamaktadır. Bu bölümde beş temel zaruretin korunması, meşakket ve zorluğun kaldırılması hakkında Şeriat'ın genel maksatlarını ele aldık. Böylelikle fert ve toplum ile alakalı istisnaî halleri tanımaya, bunların fıkhî hükümler üzerindeki etkilerini, hafifletme ve kolaylık sağlayan hafifletici hükümlerin gereklerini ve bu hükümlerin değişimini sağlayan kuralları açıklamaya yönelik bir giriş yapmış olduk. Üçüncü ve Dördüncü Bölüm, ilgili küllî fıkhî kaidelerin çıkarılması ve değerlendi-rilmesi ile olağanüstü istisnaî hallere ilişkin hafifletici hükümlerin çıkarılmasına ilişkin kuralları içermektedir. Aralarındaki bağları, açıklamalarını, bazı uygulamalarını ve kap-samlarına girmekten istisna edilen hususları belirtmek suretiyle bunları, alimlerin belirlediği gibi, fetva ve yargıya elverişli kanun maddeleri şeklinde bir mevzu olarak bir araya topladık ki alternatif hükümleri istinbat usûlü ve bu hallerin uygulama yöntemi açıklığa kavuşmuş olsun. Böylelikle istisnai haller ve fert, toplum ve ümmet düzeyinde etkileri yansıyan ve olağan hallere ilişkin şer'î hükümler için azimetlerden ruhsatlara dönüşüme neden olan zâfiyet ve acziyet halleri ortaya çıkmış oldu. Bu çalışma yoluyla, küllî fıkhî kaideler ile bağlantı kurarak, insan hayatını zorlaştıran sıkıntılı meseleler için yeni hükümler istinbat etmede temel teşkil etmek üzere, istisnaî hallere ve fer'î hükümlerine ilişkin tümevarımsal ilmi bir yönteme ulaşmayı amaçladık."
