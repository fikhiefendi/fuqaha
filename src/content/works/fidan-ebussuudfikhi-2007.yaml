abstract: "Bu çalışma ile Osmanlı fakihi Şeyhülislâm Ebüssuûd'un fıkhî meseleleri çözümündeki metodu tespit edilmiştir. O İslâm hukuk mezheplerinden Hanefî okulunun yetiştirdiği müctehid imamların görüşlerine ve terimlerine bağlı kalmıştır. Genel olarak onların geniş usul anlayışları Ebüssuûd tarafından sürdürülmüştür. Ebüssuûd, naklî metod, aklî metod, tercih metodu, ictihad metodu, maslahat metodu ve kolaylık metodunu uygulamıştır. Fetvalarında devlet sorumluluğu ve vicdânî sorumluluk taşıdığı gözlemlenmiştir."
