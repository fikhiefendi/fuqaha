abstract: "Bu araştırmanın amacı, İslâmi finans ilkeleri ışığında banka-dışı faizsiz bir finansman modeli olan Tasarrufa dayalı finans (TDF) sistemi için İslâmi finans ilkelerine uygun bir model tasarlamak ve önermektir. Bu çalışmada önce araştırmanın amacı ve önemi, araştırmanın sınırlılıkları belirtilmiş, literatür taraması yapılmış ve araştırmanın yöntemi üzerinde durulmuştur. Sonra TDF sistemi ve İslâmi finans sistemi incelenmiştir. Araştırmada TDF sisteminin İslâmi finans ilkelerine uymayan bir yönünün olmadığı görülmüştür. Yapılan araştırma ve çalışma sonucunda bu verilerden hareketle fıkhî görüşler etrafında TDF sistemi için İslâmi finans ilkelerine uygun bir finansal işleyiş modeli tasarlanmış ve öneride bulunulmuştur. Bu çalışmada, TDF sistemi hakkında bilgi edinmek, hali hazırda var olan bir durumu tespit etmek ve bulgulardan hareketle sistem için İslâmi finans ilkeleri çerçevesinde bir model önermek için içerik analizi yöntemi kullanılmıştır. Analiz boyutunu ön plana alan, iş modeli araştırmasına dayanan bu araştırmanın bilimsel çalışmalara katkı sağlayacağı düşünülmektedir."
