abstract: "İslâm tarihinin gelişim sürecinde ortaya çıkan fıkhî problemlerin çözümü ile ilgili birçok fıkıh âlimi, eserler kaleme almış ve böylece bir İslâm fıkhı geleneği oluşmuş-tur. Muhammed b. Hasan eş-Şeybanî, İmam Şâfiî, Serahsî, Merginânî, Nevevî, İb-nü'l-Hümâm, Molla Hüsrev, Kemalpaşazâde bu fıkıh geleneğinin günümüze taşın-masında önemli rol almışlardır. İslâm fıkhı farklı ekollerle gelişimini ve etkisini yüz-yıllar boyu sürdürmüş, her çağda bu fıkhî meselelere katkı sağlayan birçok fıkıh ali-mi yetişmiştir. Osmanlı döneminde yaşamış ve Aydın vilayetinin müftüsü olan Âlim Muhammed b. Hamza da bu alimler arasında yer alır. O, kendine has bir şekilde fıkhî konuları risâle şeklinde ele alan mümtaz âlimlerdendir. Aydınî'nin risâlelerinin incelenmesi, onun İslâm hukukunun gelişimine olan katkısını ve dönemindeki fıkhî problemlerin çözümüne dair uyguladığı yöntemleri görebilmek adına önem arz et-mektedir. Biz de bu noktadan hareketle Aydınî'nin risâlelerini incelemeye tabi tutup onun birikimini zamanımıza aktarmayı arzu ettik bu nedenle sekiz risâlesini inceleme konusu yaptık."
