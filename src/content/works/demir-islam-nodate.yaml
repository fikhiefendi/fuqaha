abstract: "Bu çalışmada gıdadan temizliğe, ilaçtan kozmetiğe hayatın hemen her alanındaki ürünlerde yaygın bir biçimde kullanılan maddeler arasında yer alan alkolün çeşitlerinin ve bunların kullanımının İslâm hukuku açısından değerlendirilmesi üzerinde durulmaktadır. Konunun seçilme nedeni, geniş bir yelpazeye sahip alkollerin hangi şart ve zeminde helâl, harâm ve şüpheli olduğunun net şekilde ortaya konularak duyarlı Müslümanların alkollere dair tavırlarına katkı sunmaktır. Çalışmada, nitel araştırmalarda yaygın olarak kullanılan yazılı dokümanların incelenmesi yöntemiyle ilgili meseleler tetkik edilmektedir. Alkollere dair meselelerde mihenk taşlarından biri Kur'ân-ı Kerîm'de geçen ve \"hamr\" olarak ifade edilen sarhoş edici içeceğin mahiyetinin net şekilde ortaya konulmasıdır. Ayrıca maddî necâset kategorisinde olup olmadığı hususu da konuya dair tartışmalarda önemli yapı taşlarından birini teşkil etmektedir. İlk dönemlerden itibaren hamrın necis olmadığı görüşünde olan fakîhlerin olması, konuyla ilgili etraflı tartışmaların yaşanmasında etkili bir unsur olarak ön plana çıkmaktadır. Çalışma bir giriş ve dört ana bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, amacı, önemi, problemi, yöntemi, sınırları, kaynakları ve konuyla ilgili daha önce yapılan çalışmalar ele alınmıştır. Birinci bölümde alkol kavramı, alkolün tarihçesi, alkollerin özellikleri, başlıca alkol çeşitleri ve dinlere göre alkolün durumu konuları üzerinde durulmuştur. İkinci bölümde alkollü içecekler konusu incelenmiştir. Bu çerçevede klasik fıkıh eserlerinde geçen hamr, nebîz, tılâ, seker, müselles, buhtûc, cumhûrî, nakî'u'z-zebîb, nebîzu'z-zebîb, nebîzu't-temr, bâzik, münassaf, fadîh, halitân, mizr, bit', ci'a, ğubeyrâ, fukkâ' içecekleri ile birlikte boza, şıra, kefir, kımız, bira, şarap, viski ve rakı gibi günümüzde etil alkol içerikli ürünlerin İslâm hukuku açısından değerlendirilmesi yapılmıştır. Üçüncü bölümde alkollere dair klasik meseleler tahlil edilmiştir. Bu bağlamda alkolün necâseti, nebîzle abdest alma, alkolün sirkeleşmesi/sirkeleştirilmesi, alkol içirilen hayvanların etleri, zaruret halinde alkol içilmesi, alkolün muhafazasında kullanılan kaplar, alkolün mal olarak değerlendirilip değerlendirilmeyeceği, alkolün satım akdine konu olması, hamr üreticisine hammadde satmak, alkolün icâre akdine konu olması, alkolün rehin akdine konu olması, alkolün tazmini, alkollü içecek içmenin cezası ve İslâm ceza hukuku sistematiğindeki yeri, alkol cezasının tespiti, sarhoşluk, nebîz ile hamr ayrımının ceza hukukuna yansıması, alkol içme suçunun tatbikatı esnasında ölen kişi, alkolü dört defa içmenin cezası, alkol cezasında tövbenin rolü, alkol tüketenlerin şâhitliği meseleleri İslâm hukuku açısından irdelenmiştir. Dördüncü bölümde alkollerle ilgili güncel fıkhî meseleler mütalaa edilmiştir. Bu kapsamda alkolle pişirilmiş yemekler, alkol meclisinde oturma, alkolle tedavi, alkolün temizlik ve dezenfektan ürünlerinde kullanımı, kozmetik ürünlerinde kullanımı, alkol satılan mekanlarda çalışma ve alışveriş yapma, alkol tespit yöntemlerinin İslâm ceza hukuku açısından kullanılması meseleleri İslâm hukuku kapsamında tetkik edilmiştir. Çalışma, araştırma sonucunda ulaşılan bulguların bulunduğu sonuç ile yararlanılan kaynakların yer aldığı bibliyografya bölümüyle sona ermiştir. Anahtar Kelimeler: İslâm Hukuku, Helâl Gıda, Helâl Ticâret, Helâl Kozmetik, Helâl Temizlik, Alkoller, Hamr, Nebîz."
