abstract: "Çalısmamızda bn Rüsd'ün hilaf kitabı niteliginde olan Bidâyetü'l-Müctehid adlı eserinde Ebû Hanife'ye ait olarak naklettigi görüsleri tahkik etmeye çalıstık. Tezimizde de bahsettigimiz üzere bir mezhebe mensub bir alimin baska bir mezhebin görüsünü naklederken bazı hatalara düstügü görülür. Bunların sebepleri arasında mezhebî taassub, objektif olamama, diger mezhebin ana kaynaklarına ulasamama, ıstılah farklılıgından dogan yanlıs anlasılmalar, herhangi bir kaynaga dayandırılmadan zihindeki kanaatle yetinme gibi durumlar sayılabilir. bn Rüsd'dün de eserinde mam Ebû Hanife'nin görüslerini verirken bazı hatalara düstügü görülür. Bu hatalar mezhebî taassub ve objektif olamamaktan kaynaklanmamaktadır. Bidâyetü'l-Müctehid'de mam Ebû Hanife'ye dair 974 görüs incelenmis olup, 94 hatalı görüs tespit edilmistir. Bunlar 1. bölümde Hadesten Taharet, Namaz, Oruç, 'tikaf, Hac, Cihad, Kurban, Sayd konularında ; 2. bölümde Nikah ve Talak, Zıhar konularında, 3. bölümde Büyu', Kırâd, care, Kısmet, vekalet, vedia, Feraiz ve Kitabet konularında; 4. bölümde Diyât, Sirkat, Cirah, Zina ve Akdiye konularındadır."
