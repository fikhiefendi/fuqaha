abstract: "İslam hukukunda yargı kararlarının tescili meselesi, ilk dönemlerden itibaren fukaha tarafından ele alınmış müstakil bir çalışma konusudur. Memlükler dönemine gelindiğinde, dört mezhepten kâdılkudât atanması sonucu yargı sisteminin çok mezhepli hale gelmesi, farklı mezhep mahkemelerinde alınan kararların nasıl diğer mahkemeleri de bağlayıcı hale getirileceği ve bu kararların nasıl tescil edileceğini gündeme getirmiştir. Bu bağlamda Memlükler döneminde tescilde kullanılan sıhhate hüküm ve mûcebe hüküm kavramları etrafında küçük çaplı bir literatür oluşmuştur. Bu çalışmada, öncelikle sıhhate hüküm ve mûcebe hüküm literatürünün ortaya çıkma gerekçeleri incelenmekte, literatürün kapsamı tespit edilmeye çalışılmaktadır. Devamında, Zeynüddin İbn Nüceym'in metinleri merkeze alınarak kavramların nasıl bir fıkhî istidlal mantığı içerisinde kullanıldığı ele alınmaktadır. Son olaraksa, bu kavramlarla tescil edilmiş Memlükler döneminden kalma hukuki vesikalar göz önüne alınarak, kavramların pratikte nasıl bir fonksiyona matuf olarak kullanılmış olabileceği değerlendirilmektedir."
