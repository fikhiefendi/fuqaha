abstract: "İbni Teymiyye fıkıh alanında bazı önemli meselelerde dört mezhepten ayrı görüşler ileri sürmüştür. Mecmu-ul Fetava ve Fetava-i-Kubra gibi kitaplarını, El Furu ve Zadül Mead gibi öğrencilerinin kitaplarını inceledim. Dört mezhepten ayrıldığı Aile ile ilgili fıkhi meseleleri tahlil edip not ettim. Sonra bu alandaki her mesele ile ilgili dört mezhebin ayrı ayrı mezhep ve meşhur görüşünü mutemed kitaplarından çıkarıp yazdım. Bir mezhepte birden fazla görüş olduğu durumlarda meşhur ve mutemed görüşe itimad ettim. Sonra Şeyh ül İslamın görüşlerini, her dört mezhebin görüşleri ile karşılaştırdım , delillerini açıkladım ve bana daha güçlü görünen görüşü tercih ettim. Çalışma, mukaddime, temhid, üç fasıl ve sonuç bölümlerinden oluşup bir dizi tavsiye ile sonlanmaktadır."
