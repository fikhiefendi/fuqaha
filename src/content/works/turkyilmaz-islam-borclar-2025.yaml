abstract: "“İslam Borçlar Hukukunda Akit Meclisi (Hanefi Mezhebi Örneği)”isimli bu çalışmanın amacı, Hanefî mezhebinin klasik literatüründe akit meclisiyle ilgili dağınık halde bulunan hükümleri bir araya getirerek akit meclisinin mahiyetini, şartlarını, sınırlarını ve hukuki sonuçlarını ortaya koyan bütüncül bir akit meclisi teorisi oluşturmaktır. Bu tür çalışmalara ihtiyaç olması, bu çalışmayı önemli kılmaktadır. Mali akitlerin benzer hükümlere tabi olması ve özellikle de meclis şartları bakımından ortak niteliklere sahip olması sebebiyle çalışmanın kapsamı borçlar hukuku alanıyla sınırlanmıştır. Ayrıca borçlar hukuku sahasına giren akitlerin bir hayli fazla olması ve bu akitlerin şartlarından meclisle ilişkili olanları tespit etme işleminde konunun önemli bir genişliğe evrilmesi, çalışmayı Hanefî mezhebiyle sınırlamayı gerekli kılmıştır. Veri toplama yöntemi olarak doküman incelemesi yöntemi kullanılan bu çalışmada nitel araştırma yöntemlerinden kuram oluşturma deseni kullanılmıştır. Bu bağlamda Hanefî klasiklerinde yer alan başta bey' olmak üzere kira ve rehin gibi toplam 22 akit taranarak bu akitlerin in'ikad, sıhhat, nefaz ve lüzum şartları arasından meclisle ilişkili olanlar tespit edilmiş, meclisin akitler üzerindeki etkisinden hareketle bir teori geliştirilmiştir. Bu teoriye göre akit meclisi bazen iki aşamalı bir süreci kapsamaktadır. Birinci aşama akdin in'ikadının sağlandığı ve bir bakıma akit meclisinin çekirdeğini oluşturan icapla kabul arasındaki süreçtir. İkinci aşama ise mecliste yerine getirilmesi gereken belirli sıhhat şartlarının yerine getirildiği ya da akdi fasit kılan bazı müfsit unsurların giderilerek akde yeniden sıhhat kazandırıldığı aşamadır. Ayrıca bu çalışmaya göre elde edilen veriler ışığında meclisle iltisakı bakımından akitler için yeni bir tasnifin yapılması mümkündür. Bu tasnife göre akitler, çoğunlukla bir sıhhat meclisinin bulunduğu, mübadele yapılması halinde sıhhat meclisinin bulunduğu, sıhhat meclisinin yalnızca tashih için bulunduğu ve sıhhat meclisinin bulunmadığı akitler olarak dört gruba ayrılabilir."
