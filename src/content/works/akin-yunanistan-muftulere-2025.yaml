abstract: "Tez, giriş ve sonuç kısmı dahil dört ana bölümden oluşmaktadır. Giriş kısmında genel olarak tezin konusu, önemi, amacı, yöntemi ve bazı önemli kaynakların tanıtımına yer verilmiştir. İkinci bölümde“Kavramsal Çerçeve”başlığı altında fetva ve kazâ kavramları alt başlıkları ile ele alınmış ve tarihi gelişimine yer verilmiştir. Üçüncü bölümde“Müftülere Tanınan Yetkiler Çerçevesinde Nikah Akdinin Tanzim ve Tescili”başlığı altında uluslararası antlaşmalar ve ulusal kanunlarda müftülere tanınan yetkiler çerçevesinde Yunanistan'da günümüzdeki uygulamalar İslâm hukuku açısından değerlendirilmiştir. Tez sonuç ve öneriler bölümü ile bitirilmiş, ekler kısmında arşivlerde yer alan ve günümüzde kullanılan belgelere yer verilmiştir. Çalışmanın temel amacı, Yunanistan'da müftülere tanınan yetkiler çerçevesinde nikaha dair hükümleri İslâm Hukukuyla mukayeseli bir şekilde incelemektir. Tarihi yönü Yunanistan'da dönemin Osmanlı ve Türkiye idareleri ile karşılıklı imza altına alınan uluslararası antlaşmalar ve Yunanistan'ın iç mevzuatı ile sınırlıdır. Burada yaşayan müslüman Türk azınlığın antlaşmalardan kaynaklanan haklarına rağmen yaşadıkları mağduriyetler tarihi olduğu kadar güncel bir problemdir. Araştırmanın söz konusu problemin çözümüne katkı sağlayacağına inanılmaktadır. Bu anlamda çalışmada hukuki mevzuatla güvence altına alınan müftülerin yetkilerinin ne kadarının uygulamaya yansıdığı ve konuyla ilgili yaşanan problemlerin neler olduğu tespit edilmeye çalışılmıştır. Çalışmada araştırma ve kaynak tarama modeli uygulanmıştır. Tarihi doküman ve kaynaklardan toplanan veriler, İslâm Hukuku çerçevesinde eleştirel bir gözle incelenerek konuyu anlamlı hale getirme yoluna gidilmiştir. Neticede müftülerin günümüzde önem arz eden tanzim, tescil, ilan, yaş sınırı gibi nikah ile ilgili uygulamaları Osmanlı'da merî Hukuk-ı Aile Kararnamesi ile benzeştiği görülmüştür. Müslüman Türk azınlığın hakları söz konusu olduğunda Yunanistan'da ciddi anayasa ihlalleri ortaya çıkmaktadır."
