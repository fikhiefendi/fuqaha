abstract: "İslam borçlar hukukundaki temel konulardan birisi olan garar, genel olarak akitlerdeki belirsizlik ve bilinmezlikleri ifade etmektedir. Tez çalışmamızda, garar yasağının naslardaki temelleri, fıkıh literatüründeki algılanma ve yorumlanma biçimi, garar teriminin gelişim süreci ve gararın akidlere etkisi ele alınmıştır. Çalışmamız bir giriş ve dört bölümden oluşmaktadır. Giriş kısmında konunun fıkıh ilmi içindeki yerine, sınırlandırılmasına, araştırmanın amaç ve yöntemi ile kaynaklarına dair bilgilere yer verilmiştir. Birinci bölümde garar teriminin kavramsal çerçevesi ortaya konulmuştur. Bu bölümde gararın anlamı ve tanımı, konuyla ilgili naslar, gararın mahiyeti, benzer terimlerle ilişkisi ve diğer hukuk sistemlerinde gararı ilgilendiren konular hakkındaki düzenlemelere yer verilmiştir. Bu bölümde, son olarak garar konusunun klasik literatürde ele alınış biçimi ve garar konusunda yapılan taksimlere giriş yapılmıştır. Çalışmanın ikinci bölümü satım akdinin sigasında garar, üçüncü bölümü ise mebi ve semende garar konularına tahsis edilmiştir. Çalışmamızın son bölümü olan dördüncü bölümde ise, gararın yasaklanmasındaki hikmet ile gararın satım akdi üzerindeki etkisi ve doğurduğu sonuçlar ele alınmıştır. Bu bölümde garar, akde etkisi açısından ele alınmış, gararın akdin sıhhatini etkilemesinin şartları ortaya konulmuş ve gararın hukukî sonuçları incelenmiştir. Çalışmamız, vardığımız neticeleri ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır."
