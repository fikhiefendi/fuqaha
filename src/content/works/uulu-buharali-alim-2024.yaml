abstract: "Ebû Ali el-Hüseyin b. Yahya ez-Zendevistî (ö. 382/992), IV/X. yüzyılda Mâverâünnehir bölgesinde Sâmânîler döneminde yaşamış ve Hanefî mezhebinin önemli bir alimidir. Ancak tabakât ve terâcim kaynak eserlerinde hak ettiği ilgiyi görmemiştir, bu nedenle elde bulunan eserlerde onun hayatıyla ilgili oldukça sınırlı bilgi bulunmaktadır. Zendevistî, döneminin önde gelen âlimlerinden eğitim almıştır. Klasik döneminin önemli isimlerinden biri olarak kabul edilir ve IV/X. yüzyılda ilmî hareketliliğin yaşandığı, medeniyetin merkezi olarak kabul edilen Buhara bölgesinde yaşamıştır. Fıkıh, tefsir, hadis, kelam ve tasavvuf alanlarında derin ilmî birikime sahiptir. Zendevistî, aynı şehirde 382/992 yılında vefat etmiştir. Onun kaleme aldığı birçok eseri arasından sadece üç tanesi günümüze kadar ulaşabilmiştir. Çalışmamızın temel odak noktasını oluşturan, onun en önemli eseri Ravzatü'l-Ulemâ adlı eserdir. Bu eser, Zendevistî'nin fıkıh, hikmet, Kur'an ayetleri ve hadislere dair meseleleri, sûfiyâne bir tarzda ele hacimli bir eseridir. Ayrıca dönemin gündemdeki konuları çerçevesinde, yaşadığı coğrafyada bulunan ve birtakım mezhepler tarafından savunulan bazı akaid konularını çoğu zaman görüş sahiplerini belirtmeden Hanefî-Mâtürîdî düşünceye göre ele almaktadır. Bu yüzden eser, Hanefîliğin yayıldığı coğrafyalardan olan Horasan ve Mâverâünnehir bölgesi düşünürleri ile ilgili oldukça önemli bilgileri içermektedir. Bu bağlamda Zendevistî'nin Ravzatü'l-Ulemâ adlı eseri, erken dönem Hanefî-Mâtürîdî geleneğinin oluşum süreci açısından son derece önemli bir kaynak durumundadır. Çalışmamız, Zendevistî'nin hayatını, ilmi kişiliğini, yaşadığı ortamı ve Ravzatü'l-Ulemâ adlı eseri tüm yönleriyle tanıtmayı amaçlamakta ve aynı eser çerçevesinde onun Hanefî-Mâtürîdî geleneğindeki yerini incelemektedir."
