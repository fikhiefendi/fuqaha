abstract: "Bu tezde, ilmihal kavramı ve son dönem Osmanlı ilmihalleri hakkında bilgi verdikten sonra, Osmanlının son döneminde kaleme alınan Mehmed Emin B. Hasan el-Ofi'nin Necatü'l-Mü'minîn, Mahmud Mesud'un Usûl-ü Akâidi İslâmiyyede İlm-i Hâl-i Kebîr ve Halim Sabit'in (Şibay) Amelî İlmihal isimli eserleri tanıtılarak değerlendirilmiştir. Tezimiz dört ana bölümden oluşmaktadır: Birinci bölümde, ilmihal kavramı, ilmihal bilgisinin önemi, gerekliliği, faydaları, ilmihal kitaplarının tarihî seyri ve son dönem Osmanlı ilmihal literatürü hakkında kısa ve genel bilgiler verilmiştir. Diğer üç bölümde ise sırası ile Oflu Mehmed Emin Efendi, Mahmud Mesud ve Halim Sabit'in hayatı, ilmî kişiliği ve eserlerinden bahsedildikten sonra Necâtü'l-mü'minîn, Usûl-i Akâid-i İslâmiyye'de İlm-i Hâl-i Kebîr ve Amelî İlmihal'in tanıtım ve değerlendirilmesi yapılmıştır."
