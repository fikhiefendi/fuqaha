abstract: "Son yıllarda küresel ekonomi, çevresel ve sosyal zorlukların yanı sıra kayda değer bir gerileme yaşadı. Birleşmiş Milletler gibi devlet kurumlarının ve kuruluşlarının yoksulluk, temiz suya erişim ve iklimin sürdürülebilirliği gibi konuları ele almaya yönelik ortak çabalarına rağmen, yoksulluk hala yaygın. Bu nedenle, ekonomik statüleri ne olursa olsun, finansal hizmetlerin herkes tarafından erişilebilir olmasını sağlamayı da içeren finansal katılımın teşvik edilmesine çok önemli bir ihtiyaç vardır. Finansal katılım, tasarruf hesapları, kredi, sigorta ve ödeme sistemleri gibi uygun fiyat ve uygunluğu amaçlayan çeşitli hizmetleri kapsar. Ekonomik zorluklara rağmen finansal teknolojideki, özellikle de fintech'teki ilerlemeler dikkat çekicidir. Fintech, finansal hizmetleri daha verimli ve kapsayıcı bir şekilde sunmak için teknolojiden yenilikçi bir şekilde yararlanıyor. Fintech'in potansiyelinin farkında olan dünya çapındaki araştırmacılar, özellikle gelişmekte olan ülkelerde finansal katılımı teşvik etmedeki rolünü araştırdılar. Bu çalışma, Birleşik Teknoloji Kabul ve Kullanım Teorisini (UTAUT2) çerçevesine dahil ederek fintech'in finansal katılımı nasıl artırabileceğini araştırıyor. Araştırma, dijital kullanıcılar arasında fintech'in benimsenmesini etkileyen çaba beklentisi, performans beklentisi, sosyal etki, kolaylaştırıcı koşullar, hedonik motivasyon, fiyat değeri ve alışkanlık gibi faktörleri inceliyor. Niceliksel bir metodoloji kullanan çalışma, çeşitli bir örneklemden veri toplamak, sağlamlık ve adalet sağlamak için web tabanlı anketler gerçekleştirdi. Smart PLS 4'te PLS-SEM kullanılarak 225 yanıtın analizi, fintech ile finansal katılım arasında önemli ilişkilerin yanı sıra çaba beklentisi, sosyal etki, kolaylaştırıcı koşullar, hedonik motivasyon ve alışkanlığın etkili rollerini ortaya çıkardı. Ancak performans beklentisi ve fiyat değerinin fintech'in benimsenmesi üzerindeki etkisinin önemsiz olduğu görüldü. Genel olarak bu araştırma, gelişmekte olan ülkelerde finansal katılımı teşvik etmek için yeni bir modele katkıda bulunarak bu alandaki mevcut literatürü zenginleştirmektedir."
