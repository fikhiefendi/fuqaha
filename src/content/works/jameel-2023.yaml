abstract: "Müminler, Allah'ın rızasını kazanmak ve O'nun gazabından korunmak için her zaman dinin kurallarına önem verirler. Kur'an-ı Kerim ve Sünnet'teki hükümler âm, hâs, mücme ve mufassal olmak üzere dörde ayrılır. Bu hükümlerin amacı, insanların dünya ve ahiret menfaatlerini düzenlemektir. Ancak Kur'an ve Sünnet nasları, insanların tüm şartlarını ve muâmelâtlarını içermemektedir. Çünkü zaman geçtikçe, önceki toplumların hayatında olmayan yeni muâmelât ve nevâziller sürekli meydana gelmektedir. Bu gerçek çağlar boyunca izlenmiştir. İslam fetihlerinin başlangıcından itibaren çok sayıda insan İslam dinine girmiştir. Bu yeni Müslümanlarla birlikte toplumla bir çok yeni mesele ortaya çıkmış ve daha önce bilinmeyen gelişmeler yaşanmıştır. Bütün bunlar, insanların hayatlarını düzenleyecek içtihat çerçevelerini gerektiriyordu. Bu çalışma, mâverâünnehir bölgesindeki İslam fıkıh tarihinde önemli bir kişiye odaklanmaktadır. Bu kişi İmam Ebi Leyis Samarkend'dir. Çalışma, bu imamın hayatını ve fıkhî görüşlerini tespit etmeyi amaçlamaktadır. Bu bağlamda nevâzil fıkhındaki görüşlerini de araştırmaktadır."
