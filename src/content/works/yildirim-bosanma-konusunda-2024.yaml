abstract: "Bu çalışmada boşanma ile ilgili merfu hadisler isnad ve metin analizi yapılarak incelenmiştir. Hadislerin tespitinde konularına göre tasnif edilmiş el-Kütübü't-tis'a eserlerinin teması boşanma olan bölümleri dikkate alınmıştır. Bu çerçevede hadisler ve ilgili oldukları meseleler; boşama zamanı, boşamada kullanılan ifadeler, eşlerin nitelikleri, boşanmada kadının etkin olması, liân, zıhâr, îlâ ve boşanma sonrası açılarından sınıflandırılarak araştırmaya konu edilmiştir. Fıkıh mezheplerinin meselelerle ilgili hadis temelli ihtilafları varsa onlar da tetkik edilmiştir. Bu araştırma ile boşanma konusundaki hadislerin el-Kütübü't-tis'a'da önemli bir yer tuttuğu görülmüştür. Bu konudaki hadislerin, ayetlerde olduğu gibi, boşanmanın güzellikle gerçekleşmesini sağlayacak esas ve kuralları barındırdığı ortaya çıkmıştır. Bu esas ve kurallarda eşlerden her ikisinin de gözetildiği müşahede edilmiştir. Boşanma konusundaki hadislerin zaman ve şartlar değişse bile Müslümanların hayatlarına ışık tutmaya devam edecek mahiyette oldukları anlaşılmıştır."
