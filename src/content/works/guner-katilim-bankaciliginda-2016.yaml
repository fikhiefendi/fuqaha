abstract: "Dünya'da faizsiz bankacılığın yaygınlaşması ile birlikte muhafazakâr müşteri kayıpları yaşayan ülkeler faizsiz bankacılığa yönelmeye başlamıştır. Türkiye'de 1980'li yıllarda faizsiz bankacılığa yönelmek istemiştir. Çünkü faizden hoşlanmayan müşterileri (tasarruf sahiplerini) kazanmak istemişlerdir. Faizsiz bankacılığı tercih eden tasarruf sahiplerinin fonları faizsiz bankaların olmamasından dolayı ülke ekonomisini olumsuz etkilemektedir. Bu olumsuzluğu ortadan kaldırmak adına ülkemizde faizsiz esasa göre çalışan Özel Finans Kurumlarının yasal çerçevesi 1983 yılında yürürlüğe girmiştir. Daha sonrasında sırasıyla teker teker diğer bankalar kurulmaya başlanmıştır. Özel finans kurumları adı 2005 yılında katılım bankaları olarak değiştirilmiştir. Bu çalışmamızda birinci bölümde banka, banka türleri, katılım bankalarına ve çeşitlerine değinilmiştir. İkinci bölümde ise değer kavramına, müşteri değeri kavramına ve özellikleri anlatılmıştır. Son bölümde ise Kütahya ilinde Kuveyt Türk katılım bankasında müşteri değeri üzerine anket çalışmasıyla katılım bankacılığında müşteri değerinin nasıl oluşturulacağına yönelik bir araştırma yapılmıştır."
