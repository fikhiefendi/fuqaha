abstract: "TEZ ÖZETİTEMEL İSLÂM BİLİMLERİ ANABİLİM DALIHADİS BİLİM DALIAMELÃ KONULARIN DAYANDIĞI HADİSLER AÇISINDAN MÂLİK-BUHÂRÃ MUKAYESESİEziz CUMAYEV(DOKTORA TEZİ)Hicri II ve III asırda İslâm coğrafyasında büyük hadis âlimleri yetişmiş vebunlar vasıtasıyla geniş bir hadis literatürü oluşmuştur. Bu âlimler arasında İmamMâlik ile Buhârû önemli bir yere sahiptir. İki imamın eserleri olan Muvatta ileSahûh-i Buhârû de hadis edebiyatında birinci dereceli hadis kitabı niteliğindedir.İmam Mâlik ile Buhârû'nin eserlerini tertip tarzlarında ve muhtevabelirlemelerinde yalnız devrin yazım teknikleri değil, onların içinde bulunduğusosyo-kültürel çevre ve benimsedikleri fıkhû anlayışlar da önemli rol oynamıştır.Nitekim İmam Mâlik Medine dışına çıkmamıştır ve oradaki insanlarınuygulamalarını da sünnet olarak değerlendirmiştir. Dolayısıyla o, Medine ehlininuygulamasını hadisleri seçerken tercih kriteri olarak ele almıştır. Buhârû isesünneti Hz. Peygamberin söz, fiil ve takrirleri diye tarif etmektedir. Bu anlayış ikiimam arasında önemli faklılıkların olmasına neden olmuştur. Ayrıca hadismetodolojisi açısından bakıldığında mürsel hadis İmam Mâlik'e göre zayıf hadiskategorisine girmemektedir. Buhârû ise bunun aksini düşünmektedir. Bunamukabil iki imam rical tenkidi ve hadis alma ve öğretme usulleri konusunda aynıgörüşü paylaşmışlardır. İki imam fıkıh metodolojisi açısından ele alındığında daonların bazı konularda faklı görüşleri savundukları görülmektedir. Özelliklehüküm istinbat etmedeki delillerinde farklılıkların olduğu görülmektedir. Buradaİmam Mâlik bir fakih gibi davranırken Buhârû hadisçi kimliğiyle meseleyeyaklaşmaktadır.Tezde bütün bu hususlar örnekleriyle ele alınarak, her iki imamın gerekhadis tekniği gerekse fıkıh yönünden birbirlerine paralel düşündükleri ve farklıgörüşler belirttikleri noktalar tespit edilmiş, böylece her iki imamın metotlarımukayeseli olarak değerlendirilmiştir.Danışman: Doç. Dr. Salih KARACABEY Sayfa Sayısı: 130"
