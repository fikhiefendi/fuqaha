abstract: "Osmanlı Devleti'nin Fatih Sultan Mehmet Han döneminde kadılık, müderrislik ve müftülük görevlerini icra etmiş Şeyhülislam Molla Hüsrev'in Hâşiye Alâ Envâri't-Tenzîl ve Esrâri't- Te'vîl adlı bu eseri, Beydavi'nin Envâri't-Tenzîl ve Esrâri't- Te'vîl adlı eserinde Fatiha suresinin tefsirinden bakara suresinin 142. ayetinin tefsirine kadar olan kısmı üzerine kaleme alınmış hâşiye türü bir eserdir. Molla Hüsrev'in bu eseri Beydavi Tefsiri'ne yazdığı şerh ve hâşiyelerin yanı sıra, aynı zamanda Kur'ân-ı Kerim, Arap dili ve belâgatı, kıraat ve diğer dini ilimlerden ele aldığı konuları da ihtiva etmektedir. Bu çalışma söz konusu yazma eserin bakara suresinin 5.ayetinden 27.ayetine kadar olan kısmın tefsir ilmi kapsamında edisyon kritiğidir. Kitaba ait yazma eserlerden tahkik kriterleri doğrultusunda seçilen 3 nüshanın mukayeseli metin tahkiki İSAM tahkik esaslarına uygun olarak yapılmıştır. Konya Yusufağa Kütüphanesi'nde yer alan ي harfiyle işaret ettiğimiz 1. nüsha, müellif nüshasıyla mukabele edilmiş bir nüsha olduğu için asıl nüsha olarak belirlenip seçilen diğer iki nüshayla mukâyese edilmiştir. Çalışmamız yapılan alıntı ve serd edilen görüşlerin asıl sahiplerine isnâd edilmesi, âyet ve hadislerin tahrîcinin yapılması, eserde geçen meşhur olamayan şahıs ve kitapların tanıtılması, şiir metinlerinin incelenmesi ve vezinlerinin tespit edilmesi, kelime ve ıstılahların bir kısmında o alanla ilgili kaynaklara başvurularak açıklama yapılması sûretiyle; okuyucuya kolaylık sağlayacak biçimde modern Arapça imlâ kurallarına da bağlı kalınarak mûtedil bir şekilde tasnif edilmiştir."
