abstract: "Bu çalışmada Tayland'da şeyhülislamlık müessesesi ve Şeyhülislam Aziz Phitakkumpol'un yayınladığı fetvalar ele alınmıştır. Bu amaçla araştırma bir giriş ve üç bölümden oluşmaktadır. Giriş babında çalışmanın unsurları ve tarihsel arka plan ele alınmış olup tezde işlenecek konuya bir hazırlık yapılmış ve Tayland'da Müslümanlar ile ilgili ön bilgi verilmiştir. Birinci bölüm'de Tayland'da şeyhülislamlık müessesesi ve şeyhülislamlar ele alınmıştır. İkinci ve Üçüncü Bölüm'de Tayland'da 1997 Tarihli Kanunun çıkarılmasından sonra şeyhülislamlık müessesesinin Şeyhülislam Aziz dönemindeki uygulamaları kapsamında fetva ile ilgili gelişmeler ve onun yayınlanan fetvaları incelenmiştir. Tayland kralı tarafından himaye edilen ve şeyhülislamlık müessesesi olarak bilinen“Samnak Chularajmontri”Tayland'da yaşayan Müslümanları temsil etmektedir. Bu kurum Tayland hükümetinde yapılan değişiklikten sonra (1932'den sonra) kurulmasına rağmen Tayland'da şeyhülislamlık görevinin 1600'lerden beri mevcut olduğu kaydedilmektedir.“Chularajmontri”veya Şeyhülislam, Taylandlı Müslümanlar arasında tanınan dini işlerde en yüksek yetkiye sahip devlet görevlisidir. Bugüne kadar şeyhülislamlık görevi yapan toplam 18 kişi bulunmaktadır. 1997 yılında şeyhülislamın temel görevlerini resmileştirmek için çıkarılan kanundan sonraki süreçte şeyhülislamlık makamı değişime uğramıştır. Bu kanunla göreve gelen iki şeyhülislam bulunmaktadır. Bunlardan biri olan Şeyhülislam Aziz Phitakkumpol kanunda belirtilen dört temel görevden biri olan dini konularda fetva verme işini sistematik hale getirmiştir. Ayrıca Şeyhülislam Aziz İbadat ve Muamelat ile ilgili meseleler üzerine toplam 47 fetva yayınlamış olup bu fetvaları toplayarak fetva kitabı olarak yayınlamıştır. Bundan dolayı Şeyhülislam Aziz en çok fetva veren ve ilk defa fetva kitabı yayınlayan şeyhülislamdır. Bu itibarla sözkonusu dönemde şeyhülislam olan Aziz Phitakkumpol fetva verme faaliyetinde geçmiş dönemdeki şeyhülislamlardan daha etkin olmuştur."
