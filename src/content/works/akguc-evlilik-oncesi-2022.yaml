abstract: "Nikâh ahvali şahsiye konuları arasında önemli bir yer tutmaktadır. Bu sebeple nikâhın öncüleri olarak kabul edilen nişanın İslam hukukundaki yeri, tarihsel süreci, toplumlar arasındaki farklılıklar ifade edilmiş ve sağlıklı bir nişan için gerekli tüm hususlara değinilmiştir. Ayrıca evlilik öncesi tarafların gerek iletişim araçları kullanılarak gerekse yüz yüze görüşmeleri ve bu konulara taalluk eden hususlar ele alınmıştır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Birinci bölümde nişan kavramı, toplumun ona bakış açısı ve hukuksal süreci işlenmiştir. İkinci bölümde ise genel olarak mahremiyet, evlenecek olan kadın ve erkeğin İslami usullere göre nasıl irtibat kuracakları, nasıl görüşecekleri, sosyal ve sanal ilişkileri işlenmiş ve son olarak evlilik öncesi tıbbi muayene, kan uyuşmazlığının tespiti ve hastalıkların yayılmasının önüne geçmek için yapılması gereken hususlar ele alınmış; tıbbi muayenenin faydaları ve zararlarına değerlendirilmiştir."
