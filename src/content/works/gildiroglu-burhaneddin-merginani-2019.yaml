abstract: "Miras konusu, diğer hukuk sistemleri gibi İslam Hukukunun da düzenlediği bir konudur. İslam Hukukunda bu konu ferâiz diye anılmaktadır. İslam hukukunda miras taksimi esas itibariyle naslara dayanmaktadır. Bununla birlikte diğer konularda olduğu gibi az olmakla birlikte miras konusunda da içtihada açık bazı konular mevcuttur. Bu konu ilk dönemlerden itibaren fıkıh kitapları içinde ele alınıp incelenmekle birlikte erken dönemlerde konuya ilişkin müstakil risaleler de yazılmıştır. Bu çalışmada meşhur Hanefî fakihi Burhâneddîn el-Merğinânî'nin Kitâb fi'l-ferâiz isimli eserinin edisyon kritiği, tercümesi ve değerlendirilmesi yapılmıştır. Risale esas itibariyle Merğinânî'nin hocalarından Osman b. Ali'ye aittir ve yazıldığı dönemde Ferâizü'l-Osmânî adıyla anılmaktadır. Merğinânî hocasına duyduğu saygıdan dolayı konuya ilişkin yeni bir eser yazmak yerine risalede bulunmayan bazı konuları eklemek ve değinilmeyen bazı bilgileri ilave etmek suretiyle ıslah etmeyi tercih etmiştir."
