abstract: "ÖZET Tezimiz bir giriş ve dört bölümden oluşmaktadır. Tezin giriş bölümünde hakkı sona erdiren belli başlı sebeplere özetle değindik. Bunu takip eden birinci bölümde; hak kelimesi üzerinde genişçe durduk. İkinci bölümde; hakkın düşmesi konusunu mezheplerin görüşleri ışığında açıkladık. Üçüncü bölümde; aile hukukunda hakkı sona erdiren amiller üzerinde durduk. Son bölümde ise; miras hukukunda hakkın düşmesi ve irtifak hakları konusunu mezheplerin görüşleri ışığında ele alıp inceledik."
