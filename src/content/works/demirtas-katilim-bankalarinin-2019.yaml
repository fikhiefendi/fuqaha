abstract: "Finansal sistemin en önemli kurumları olan bankaların tarihleri çok eskilere dayanmaktadır. Banka denilince mevduat toplayan ve ihtiyaç sahiplerine faiz karşılığı kredi kullandıran konvansiyonel bankalar ön plana çıkmaktadır. Son elli yılda dünyada faizsiz bankacılık denilen ve finansal faaliyetlerinde her türlü faize dayalı işlemi yasaklayan yeni bir bankacılık türü gelişmeye başlamıştır. Son yıllarda özellikle MENA bölgesi ve Müslüman nüfusun yoğun olarak yaşadığı Asya ülkelerinde hızla gelişmeye başlayan ve dünyada İslami banka olarak adlandırılan bu bankalar Türkiye'de katılım bankası olarak faaliyet göstermektedir. Literatürde konvansiyonel bankaların finansal performansı üzerine yapılan çok sayıda çalışma olmasına rağmen, katılım bankalarının finansal performansı üzerine yapılan çalışmalar görece kısıtlıdır. Katılım bankalarının finansal performansı üzerinde etkili olan faktörleri araştırmak amacıyla yapılan bu çalışmada öncelikle finansal sistem ve finansal kurum kavramları üzerinde durulmuş; dünyada İslami finansın gelişim süreci, İslami finansın dünyada güncel görünümü ve katılım bankacılığı ilkeleri ile işleyiş mekanizması açıklanmıştır. Çalışmada ayrıca, konuya ilişkin geniş bir literatür çalışması yapılmıştır. Çalışmada, dünyada ticari banka statüsünde faaliyet gösteren 14 ülkeden toplam 46 katılım bankasının 2008-2018 dönemini kapsayan veri seti üzerine panel veri analiz yöntemi uygulanmıştır. Performans ölçütleri olarak aktif karlılık oranı (ROA) ve özkaynak karlılık oranı (ROE) panel veri analizi yöntemiyle incelenmiştir. Ampirik çalışmalar sonucunda, bankaya özgü içsel değişkenlerden kar payı dışı giderlerin faaliyet gelirlerine oranı olarak tanımlanan etkinlik oranı (EFF) ve kredi kayıp karşılığının ortalama net kredilere oranı (LLP), hem ROA'yı hem de ROE'yi istatistiki olarak anlamlı ve negatif yönde etkilerken, kar payı dışı gelirlerin vergi öncesi gelir ve kar payı giderlerinin toplamına oranı olarak tanımlanan çeşitlilik oranı (DIV) ise, hem ROA'yı hem de ROE'yi istatistiki olarak anlamlı ve pozitif yönde etkilemiştir. Kredilerin mevduata oranı (LD) ve özkaynakların toplam aktiflere oranı olarak tanımlanan sermaye yeterliliği (CAP) ROA'yı istatistiki olarak anlamlı ve pozitif yönde etkilerken, ROE'yi istatistiki olarak anlamlı ve negatif yönde etkilemiştir. Aktif toplamının doğal logaritması olarak tanımlanan banka büyüklüğü (SIZE)'ın banka performansı üzerinde istatistiki olarak anlamlı bir etkisi bulunamamıştır. Makroekonomik değişkenlerden enflasyon oranı (INF) hem ROA hem de ROE'yi istatistiki olarak anlamlı ve pozitif yönde etkilerken, yıllık reel büyüme oranı (GDP)'nin banka performansı üzerinde anlamlı bir etkisinin olmadığı görülmüştür."
