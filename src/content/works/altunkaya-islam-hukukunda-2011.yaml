abstract: "Fıkıh külliyatı içerisinde aile hukukuyla ilgili olan bölümler en geniş alanı oluştur-maktadır. Fıkhi konuları baştan sona ele alan kitapların dışında da aile hukuku içerisine giren hususlar müstakil kitaplara konu edilmiştir. Aile hukukuyla bağlantılı konular, fıkhın gelişime en fazla açık olan bölümlerindendir. Alanın en tartışmalı konusu ise akdin niteliği etrafında yoğunlaşmaktadır. Bu durum, ?İslam Hukukunda Evlilik Akdinin Hukuki Niteli-ği?ni tez konusu olarak seçmemizin en temel gerekçesidir.Tezimizde, ilk olarak akit teorisi ve akdin bağlayıcılığı açıklandı. Sonra nikâh akdi, akit teorisine ve akdin bağlayıcılığı üzerine bina edildi.Daha sonra nikâh akdinin pratiği başlığı altında, nikâh'ın dini boyutu ve medeni nikâh akdi ile İslam'ın öngörmüş olduğu nikâh akdinin işlevsel benzerlikleri incelendi.Son olarak nikâh akdinin boyutunun tespiti yapıldı ve konu hakkında bazı önerilerde bulunuldu."
