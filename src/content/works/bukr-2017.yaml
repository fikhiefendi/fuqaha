abstract: "İslam hukukunda mahtût ilminin önemi bilinmektedir. Çünkü kültür ve ilim mirasını koruyan bir ümmet, uygarlık ve ilerlemeyi hakketmektedir. Bununla birlikte söz konusu miras, ümmetin geleceğini inşa etmede de katkı sunmaktadır. Çalışmamız, Yusuf İbn İbrahim el-Erdebîlî'ye ait Kitâbü'l-envâr isimli eserinin haşiyesi olan Hâşiye Molla Muhammed el-Gerdî' eserini tahkik ve incelemesine ilişkindir. Bingöl üniversitesi Sosyal Bilimler Enstitüsü Temel İslam Bilimleri Bölümü İslam Hukuku Ana Bilim dalına yüksek lisans tezi olarak sunulan çalışmamız, söz konusu eserin Kitâbü'n-nikâh bölümünden başlayarak Kitâbü'l-hal'i bolümünüm sonuna kadar tahkik etmektedir. Çalışmamız tez projesi, iki bölüm, sonuç ve kaynakçadan oluşmaktadır. Tez projesi kısmı giriş, konuyu seçmenin nedeni, çalışmanın amacı, konu ile ilgili diğer çalışmaları ve tahkikte izlediğim yöntemi içermektedir. Birinci bölüm, dört konuyu ihtiva etmektedir. Birinci konu, Kürt âlimlerinin Şafiî mezhebine hizmetini; ikincisi, Molla Muhammed el-Gerdî ve Yusuf el-Erdebîlî'nin hayatı; üçüncüsü, Molla Muhammed'in yararlandığı kaynakları; dördüncüsü ise tezde yer alan fıkhî kavramları ele aldık. Çalışmamızın ikinci bölümü, Hâşiye Molla Muhammed el-Gerdî tahkikini içermektedir. Tahkikte (أ) olarak simgelediğimiz biri asıl diğeri de (ب) olarak simgelediğimiz iki mahtût nüshayı esas almaktadır. Sonuç kısmında ise tahkik ve incelememizin en önemli bulgularını dile getirdik."
