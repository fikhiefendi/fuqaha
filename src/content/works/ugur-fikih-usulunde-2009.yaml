abstract: "Bir hadiste ?Allah'ın korusu? olarak nitelenen haramlar, mükelleflerin kesinlikle uzak durmaları ve asla içine düşmemeleri gereken alana işaret eder. Haramlardan sakınmak, fert ve toplumun, dünyevî ve uhrevî selâmeti açısından hayati öneme sahiptir. Bu açıdan, bir hüküm mertebesi olarak haramın mâhiyetinin bilinmesinin ehemmiyeti açıktır.Teklîfî bir hüküm olarak haramın ne olduğunu ve haram hükmüne nasıl ulaşılacağına ilişkin kuralları esas itibariyle fıkıh usulü ortaya koyar. Fıkıh usulü eserlerinde haram kavramının nasıl incelendiğini ve haramla ilgili hangi mesele ve tartışmalara yer verildiğini araştırdığımız bu çalışmamızın giriş bölümünde kısaca yasak olgusundan bahsettik. Birinci bölümde ise esas itibariyle haramın ne olduğunu ortaya koymaya çalıştık. Bunu yaparken önce haramla eş ya da yakın anlamda kullanılan kavramları inceledik. Daha sonra haram tarif ve taksimlerini incelemek suretiyle haramın mâhiyetini tespite çalıştık. Yine bu amaçla haramı diğer teklîfî hükümlerle mukâyese ettik. Çalışmamızın ikinci bölümünde ise temel olarak haramın menşeîni ve müctehidin haram hükmünü nasıl elde ettiğini araştırdık. Bunun için, haram kılmaya yetkili mercî meselesine ve bu konu etrafındaki bazı tartışmalara yer verdik. Daha sonra haram hükmünün naslarda beyan ediliş üsluplarını ve haramın hangi şerî delillerle sabit olabileceğini inceledik. Son olarak haram kılmanın hedef ve gerekçelerini ve haramla ilgili birtakım ilkeleri ele aldık."
