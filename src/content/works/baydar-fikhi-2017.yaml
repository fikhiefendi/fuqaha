abstract: "Ötanazi ve tedavinin esirgenmesi hayatın sonunda karşılaşılan en önemli problemlerden ikisini ifade eder. Güzel ölüm anlamına gelen ötanazi, tedavisi mümkün olmayan hastaların merhamet saiki ile öldürülmesidir. Tedavinin esirgenmesi ise beyhude tedavinin, ölümün gerçekleşeceği öngörüsü ile başlatılmaması veya sonlandırılmasına denir. Tıp alanında tahayyül ötesi gelişmeler sonucunda yoğun bir şekilde tartışılan bu iki konu dinî, felsefî, ahlakî, hukukî ve tıbbî boyutu ile disiplinler arası bir incelemeye ve küllî bir idrak ile çözümlenmeye ihtiyaç duyar. Ancak meselenin felsefi, hukukî ve etik veçhesi dünya genelinde birçok çalışmaya konu olmasına rağmen dini boyutu ihmal edilmektedir. Bu nedenle fıkhî açıdan ötanazi ve tedavinin esirgenmesini ele alan bu tez, meselenin diğer boyutlarına konu ile alakalı olduğu ölçüde değinmekle birlikte öncelikle dini değerlendirmeyi hedefler. Bu tezde insanın özerkliği, hayatın değeri, psiko-sosyal ve ekonomik nedenlerin etkisi karşısında yaşamın kutsallığı, öldürmenin günahı, intiharın yasaklığı, imtihan düşüncesi ve hayatın emanet olarak verildiği fikrinin nasıl konumlanacağı işlenmiştir. Dokunulamaz, devredilemez ve vazgeçilemez olan yaşam hakkı ile bu hakkın sahibi tarafından ihlali irdelenerek bireysel hak ve özgürlüğün, hür iradenin, onurun ve ölümün anlamı üzerinde durulmuştur. Daha sonra ötanazinin çeşitleri tek tek ele alınarak mağdurun rızası, tedavisiz bir hastalığının bulunması gibi konular fıkhın kendi iç dinamiklerinden hareketle tahlil edilmiştir."
