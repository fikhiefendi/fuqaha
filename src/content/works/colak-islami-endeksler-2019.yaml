abstract: "Küreselleşen dünyada hisse senetlerinin yer aldığı endekslerin, piyasalar üzerindeki doğrudan etkisi gerek yurtiçi gerekse de yurtdışı yatırımcılar açısından tasarrufların yönlendirilmesinde önem arz eder hale gelmiştir. Üç bölümden oluşan çalışmamın ilk bölümü endeks kavramı ağırlıklı yapıda olup, endekslerin sınıflandırılması, hesaplama yöntemleri, endekslerde işlem yapmanın avantajları ile endeks ve risk kavramlarını içermektedir. İkinci bölümde ana hatlarıyla Türkiye ve dünyadaki önemli İslami endekslere yer verilmiş olup, çalışmanın sınırları gereği endekse alınma kriterleri (faaliyet alanı kriteri ve finansal yapı kriterleri) ve endeks türleri konularına ağırlık verilmiştir. Üçüncü bölümde ise önceki bölümlerde ortaya konulan, endekslerin temelini oluşturan hisse senetlerinin ve hisse senetleri yatırımlarının ağırlıklı olarak genel kabul görmüş İslami kurallar çerçevesinde değerlendirilmesi yapılmıştır."
