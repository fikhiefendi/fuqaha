abstract: "Bu tezde Müslüman bireylerin başucu kitabı niteliğinde olan, inanç, ibadet ve ahlak alanlarında ve hemen herkesin günlük hayatta karşılaşılması muhtemel meselelere yönelik bilgileri içeren ilmihal çalışmalarını bazı hususlara dikkat çekerek incelemeye çalıştık. İki bölümden oluşan çalışmanın, birinci bölümünde ilmihal kavramını açıklayarak bu çalışmaların bilgi kaynaklarından bahsettik. Sonrasında ilmihal çalışmalarının çeşitlerine yer verip bu çalışmaları hacimlerine ve konularına göre ayırarak inceledik. İlgili bölümdeki ilmihal çeşitlerinin içeriği ile ilgili öz cümleler ile bilgiler verdik. Bir kaçı çalışmada da incelenen, cumhuriyet öncesi ve sonrasında yazılmış olan kadın ve aile ilmihallerini tespit ederek yazılma nedenleri üzerine durduk. Bu bölümde, yazarların bu çalışmaları inşa ederken görüşleri de dikkate alınmıştır. Ayrıca günümüz şartları ve müminlerin ihtiyaçları da göz önüne alınarak çalışmaların yazılış nedenlerini incelemeye çalıştık. İkinci bölümde ise tezimizde incelemiş olduğumuz eserlerde yer alan temel konuların içeriklerine yer verdik. İlmihallerde konuların nasıl işlendiği, görüş farklılıkları, kullanılan kaynaklar, şekil ve üslupları, eserlerin hacimleri gibi birçok açıdan karşılaştırmalarda bulunduk. Son olarak kadın ve aile ilmihallerine yönelik yapılan değerlendirme ve tenkitlere değindik. Bu kısımda tezimizde ismen belirtmiş olduğumuz ilmihal çalışmalarından yola çıkarak kendi bulgularımıza ve tekliflerimize de dikkat çektik."
