abstract: "Hiç şüphesiz küllî fıkıh kaideleri ilmi çok büyük ve önemli ilimlerdendir. Bu ilim sayesinde çok kısa kavram ve ibarelerle pek çok yerlere dağılmış bulunan ve ayrıntı barındıran meseleler bir araya getirilmiş ve toplanmıştır. Küllî kaideler, yoğunlaştırılmış fıkhî tabirlerden; yani İslam fıkıh metodolojisinde üzerinde ittifak edilmiş kavramlardan oluşmaktadır. Bunlar, çeşitli mezheplerin hüküm çıkarmada benimsedikleri bir yoldur ve meydana gelen yeni olaylar bunlara göre değerlendirilir. Böylece olaylarla alâkalı şerî çözüm yolları çıkarılmış olur. Bunlar ister ibadetlerle ilgili olsun isterse de diğer fıkıh meseleleri ile ilgili olsun durum değişmez. Bu ilim sayesinde müftüler ve ilim talebeleri aytıntılarda uzun araştırmalar yapmak zorunda kalmadan fıkhî hükümlere ulaşabilirler. Bu cümleden olarak ibadet konularındaki küllî fıkıh kaidelerini bulup ortaya çıkarmak çok büyük bir öneme sahiptir. Fıkıh konuları ile alâkalı hükümlere muttali olmak isteyen özellikle İslam fıkhı alanında uzman olmayan kimseler için çok ciddi bir kolaylık sağlayacaktır. Pek çok âlim bu ilmin ne kadar önemli ve faydalı olduğunu beyan etmişlerdir. Fakihler, fıkhî görüş ve yakşalımları farklı olmasına rağmen, arkalarında benzersiz bir fıkıh mirası bırakmışlardır. Onların kitaplarında fikhî görüş ve ictihadları ile küllî kaideleri bulmak mümkündür. Onlar bunu yaperken konuya göre bazen meseleyi ihtisar etmiş bazen de geniş tutmuşlardır. İşte bu kitaplardan biri de Kadı Zekeriyya el-Ensârî'nin (v. 926h) kaleme aldığı“Esne'l-Metâlib fî şerhi Ravdi'd-Tâlib”aldı eserdir. Kadı Zekeriyya el-Ensârî, şafii mezhebinin önemli âlimlerinden biri olup âdeta mezhebi omuzunda taşıyıp bakraklaştıran, şafii mezhebinin görüş ve düşüncelerini gece gündüz temellendiren, müşküllerini ortaya koyan ve bunlara çözüm yolları üreten bir isimdir. Müellif, bu kitabında ele aldığı konuları işlerken pek çok küllî kural ve kaidelerden bahsetmekte ve bunları fıkhî olaylara ve furûata uygulamaktadır. Bu küllî kaideler fakihin işini kolaylaştırdığı gibi onun fıkhî bakışının da derinlik kazanmasına imkân verir. Bu tezimizin/çalışmamızın konusu yukarıda bahsi geçen ve müellifinin pek çok kere fetvalarını dayandırdığı“Esne'l-Metâlib”kitabındaki“İbâdât”bölümlerinde yer alan küllî kaideleri bulup ortaya çıkarmak ve bunları bir araya getirme amacını taşımaktadır. Bu tez bir mukaddime, üç bölüm ve bir sonuçtan oluşmaktadır. Birinci bölümü müellifin hayatına ayırdım. İkinci bölümde ise fıkhî kaidelerin tanımı ile bu kavrama yakın olan ve benzerlik gösteren diğer kavramları ve aralarındaki farkları inceledim. Üçüncü bölümde ise küllî kaideleri çıkardım.Bu tezin yazılış amacı bu konularda uzman olmayan kimselerin hükümlere kolayca vâkıf olmalarını sağlamak için müellifin işaret ettiği küllî kaideleri bulup ortaya çıkarmaktır.Araştırmamın metodu ise şöyledir: Öncelikle“Esne'l-Metâlib”kitabındaki ibadetlerle ilgili bütün konuları dikkatlice okuyup oralarda bulunan küllî kaideleri tespit ettim. Sonra bunları açıkladım, örneklendirdim ve şafii mezhebinin temel eserlerine atıflar yaptım.Bu çalışman sonucunda gördüm ki küllî kaideler çok önemli bir ilimdir. Çünkü bu sayede çeşitli konularda dağınık hâlde bulunan fıkhî kural ve kaideler bir kaç kelime ve lafızdan oluşan bir kalıba sokulabilmektedir. Böylece hem bunları anlaması ve ezberlemesi kolaylaşmakta hem de ibadet konuları gibi insanların çok ihtiyacı olan ve sürekli soru sorulan ayrıntılı fıkhî konulara her seferinde müracaat etme ihtiyacını ortadan kaldırmaktadır."
