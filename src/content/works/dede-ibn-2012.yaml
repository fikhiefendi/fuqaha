abstract: "İbn Kudâme'nin el-Muğnî adlı eserinde fıkıh usûlünün kullanımını tespit etmeyi hedeflediğimiz bu çalışmamız, Giriş ve beş bölümden oluşmaktadır. Giriş bölümünde tezin önemi, amacı, yöntemi ve sınırlandırılması hakkında kısa bilgi verildikten sonra birinci bölümde müellif İbn Kudâme, hayatı, çeşitli ilim dallarına ait eserleri ve el-Muğnî tanıtılmıştır.İkinci bölümde Hanbelî usulcüler ve İbn Kudâme'ye göre İslâm hukukunun kaynakları anlatılarak, el-Muğnî'de kullanımına örnekler verilmiştir. Bu bağlamda, diğer fıkıh mezeplerinde bulunan aslî-fer'î delil ayrımına benzer şekilde İbn Kudâme'nin İslâm hukukunun kaynaklarını, üzerinde ittifak edilen ve hakkında ihtilâf edilen deliller olarak iki gruba ayırıp incelediği, ittifak edilen delillerden Kur'an, sünnet, icma ve ıstıshabı, ihtilaf edilen delillerden ise şer'u men kablenâ, sahabî kavli, istihsân ve maslahatı incelediği aktarılarak el-Muğnî'de kullanımlarına örnekler verilmiştir. Kıyasa ise ittifak edilen veya ihtilaf edilen deliller arasında yer vermemesine rağmen bir delil değeri vererek incelediği görülmektedir. Öte yandan İbn Kudâme'nin usul eseri Ravzatü'n-nâzır'da bir delil olarak incelememesine rağmen el-Muğnî'de en azından bir hukukî ilke olarak kullandığı örf ve âdet ile sedd-i zerâyî kavramlarını da içerik olarak kullandığını görmekteyiz.Üçüncü bölümde teklîfî hükümler, vaz'î hükümler ve teklif kavramı el-Muğnî'deki örnekleriyle birlikte anlatılmıştır. Dördüncü bölümde kelâm, nass, zâhir, mücmel, mübeyyen, emir, nehiy, mutlak, mukayyed vb. lafız bahisleri el-Muğnî'den örnekler verilerek anlatılmıştır. Beşinci bölümde ise İbn Kudâme'nin içtihat, taklit ve tercih anlayışı el-Muğnî'den bunu destekleyen örneklerle işlenmiştir. Tez sonuçların değerlendirilmesiyle sona ermektedir."
