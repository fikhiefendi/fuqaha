abstract: "Bu çalışmada sosyal medya üzerinden para kazanma konusu hukuki (fıkhı)ve etik açıdan ele alınmıştır. Bu çalışma bir giriş ve üç ana bölümden oluşmuştur. Giriş bölümünde araştırmanın başlığını oluşturan terimlerin tanımına ve bu başlıkla ilgili kelimelere değindim. Kazanmanın dil ve terminolojideki anlamını ve bu araştırmada yer alan sosyal iletişimin anlamını açıkladım. Kazanmak temel bir unsur olan mala dayandığı için malın dil ve hukuk terminolojisindeki anlamını açıkladım. Sonra malın mahiyetinden ve bölümlerinden bahsettim. Birinci bölümde İslam hukukunda kazancı, kazançla ilgili beş Şer'i hüküm ve kazancın meşru ve caiz olabilmesi için kazanç üzerinde uyulması gereken kontroller açısından ele aldım. Sonra İslam hukukunun para kazanma konusundaki maksat ve amaçlarını anlattım. İkinci bölümde ise sosyal paylaşım sitelerinden kazanç elde etme, bu siteler üzerinden kazanmanın içerdiği görseller ve sosyal paylaşım siteleri üzerinden kazanmanın birey, aile ve toplum üzerindeki ahlaki etkilerinden bahsettim. Üçüncü bölümde sosyal medya siteleri üzerinden para kazanmanın hukuki tanımına ve sosyal medya üzerinden sözleşme yapmanın mahiyetine değindim. Ayrıca sosyal medya sitelerinde görüntülenen ve kazanç elde edilen içeriğin niteliğini de anlattım. Araştırma son olarak sosyal paylaşım sitelerinden para kazanmanın hukuki hükmüne değinilerek sonlandırıldı."
