abstract: "Konvansiyonel finansın, baskın olarak bankacılık faaliyetleri üzerine konumlandırılması gibi hali hazırda İslami finans uygulamaları İslami bankacılık formatı üzerinden yürümektedir. İslami finansı bankacılık formatından çıkaracak, onu faiz oranlarına bağımlılıktan kurtaracak, borca dayalı finansmanın hakimiyetini azaltacak en önemli mekanizma ortaklık mekanizmasıdır. Ortaklık mekanizmasının en iyi gerçekleştirileceği alanlardan biri de hisse senedi piyasasıdır. Hisse senetleri bir şirketin ortaklık payını temsil etmekte, onun kârına ve zararına ortak olmayı ifade etmektedir. Borsalarda işlem gören, faaliyetleri meşru olan ve faize dayalı borçları belirli oranı aşmayan şirketlerin hisse senetlerinden oluşan İslami endeksler, ortaklığa dayalı finansın faiz oranlarından ne derecede bağımsız olacağı ve konvansiyonel finanstan ne derecede farklılaşacağını gösterecektir. Bu çalışmanın amacı İslami endekslerin faiz oranları ile olan ilişkisini tespit etmek ve bu endekslerin getiri ve volatilite performansını değerlendirmektir. Bu kapsamda Türkiye'de 2011 yılında yayınlanmaya başlayan Katılım Endeksi ampirik bir analize tabi tutulmuştur. Bu kapsamda Katılım Endeksi ile piyasa faiz oranları arasında; korelasyon analizi, eşbütünleşme testi ve nedensellik analizi yapılmıştır. Bu analizler yapılırken sonuçların daha iyi yorumlanması açısından aynı analizler BIST100 endeksi ile piyasa faiz oranları arasında da uygulanmıştır. BIST100 endeksinin seçilmiş olmasının nedeni bu endeksin Borsa İstanbul'un benchmark endeksi olması ve bu endekse alınan şirketlerin herhangi bir Şer'i eleme kriterine tabi tutulmamasıdır. Son olarak Katılım Endeksi, getiri oranı ve volatilite performansı bakımından BIST100 endeksiyle ve diğer bazı yatırım araçları ile karşılaştırılmıştır. Çalışmada şu sonuçlara ulaşılmıştır: • Korelasyon analizi sonucunda Katılım Endeksi ile piyasa faiz oranları arasında, BIST100 ve piyasa faiz oranları arasındaki korelasyondan daha düşük bir korelasyon tespit edilmiştir. • Eşbütünleşme testi sonuçlarına göre Katılım Endeksi ile piyasa faiz oranları arasında herhangi bir eşbütünleşme ilişkisine rastlanmazken BIST100 endeksi ile piyasa faiz oranları arasında eşbütünleşme ilişkisi tespit edilmiştir. • Nedensellik testi sonuçlarına göre Katılım Endeksi ile piyasa faiz oranları arasında herhangi bir nedensellik ilişkisine rastlanmazken BIST100 endeksi ile piyasa faiz oranları arasında nedensellik ilişkisi tespit edilmiştir"
