abstract: "Klasik Türk şiirinde insanın var oluşunu ve iç dünyasını anlamlandırmada derin izler bırakan zaman ve mekân, yalnızca dış âlemi değil; şairlerin hayal ve düşünce evrenlerini de yansıtan kurucu unsurlardır. Bu kavramlar, kimi zaman aşkın ve hikmetin zeminine dönüşürken kimi zaman fânilik ve bekânın şiirsel izdüşümüne ev sahipliği yapar. İşte bu çalışma, Taşlıcalı Yahyâ ve Şeyhülislam Yahyâ Bey'in şiirlerinde zaman ve mekânın nasıl tahayyül edildiğini ve estetik bir değer olarak nasıl şekillendiğini analiz etmeyi amaçlamaktadır. Her iki şairin divanlarında zaman kavramı, bireysel duyuş biçimleriyle dönemin zihniyet yapısı arasında kurulan ilişkiler çerçevesinde ele alınmış; zamanın döngüsel niteliği bağlamında dün, bugün, yarın gibi belirli zaman dilimlerinin yanı sıra ezel ve ebed kavramları üzerinden metafizik bir derinlik kazanmıştır. Ayrıca kozmik döngüler, güneşin devinimi ve mevsimsel dönüşümler, özellikle bahar teması etrafında aşk, diriliş ve yeniden doğuş imgeleriyle ilişkilendirilerek şiirde sembolik ve estetik bir derinlik kazanmıştır. Mekân ise yalnızca fiziksel çevreyi değil; şairin iç dünyası, sosyal çevresi ve kültürel referanslarıyla örülen çok katmanlı bir yapıyı temsil eder. Bu çok yönlü tasavvur tabiî, şehirsel veya uhrevî unsurlar aracılığıyla şekillenerek metne hem estetik hem de düşünsel bir derinlik kazandırır. Bu çalışmada, Taşlıcalı Yahyâ ve Şeyhülislam Yahyâ'nın divanlarında zaman ve mekân tasavvuru kapsamlı biçimde analiz edilmiş; bu kavramların yalnızca tematik unsurlar değil, klasik Türk şiirinin anlam dünyasını şekillendiren temel yapısal öğeler olduğu ortaya konmuştur. Zaman ve mekânın, şairlerin estetik yaklaşımlarını ve dönemin zihniyetini yansıtarak şiirin iç bütünlüğüne katkı sağladığı tespit edilmiş; ulaşılan sonuçların, klasik Türk şiiri üzerine yapılacak yapısal ve anlam merkezli çalışmalara yeni bir bakış açısı sunması amaçlanmıştır."
