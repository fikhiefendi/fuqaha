abstract: "Cumhuriyetin ilan edilmesiyle birlikte Türk bankacılık sektöründe, Konvansiyonel bankaların hizmet verdiği görülmektedir. Ancak, 1980'li yıllarda ekonomide serbestleşme hareketlerinin artmasıyla birlikte İslami bankacılık anlayışının da Finansal sisteme girmeye başladığı görülmüştür. İlk olarak, 1985 yılında faizsizlik prensibi ile kurulan Özel Finans Kurumları; Albaraka Türk ve Faisal Finans kurumları olmuştur. Ancak isim itibariyle bir bankayı çağrıştırmayan bu kurumlar, hem ulusal hem de uluslararası finans piyasalarında güvenilirlik, tanınabilirlik, işlem yapabilirlik gibi konularda farklı sorunlarla karşı karşıya kaldıkları için ilgili bankalara 2005 yılında çıkarılan Bankacılık Kanunu ile“Katılım Bankaları”ismi verilmiştir. 2023 Nisan ayı itibari ile Katılım bankacılığı sisteminde toplamda altı adet Katılım bankası yer almaktadır. Bu bankalardan üçü Özel sermaye ile kurulmuş diğer üçü de Kamusal sermaye ile kurulmuştur. Özel sermayeli katılım bankaları: Albaraka Türk, Türkiye Finans ve Kuveyt Türk bankalarıdır. Kamusal sermayeli katılım bankaları: Ziraat Katılım, Vakıf Katılım ve Türkiye Emlak bankalarıdır. 2022 yılı itibari ile Türk bankacılık sektörü içerisinde Katılım bankacılığının; toplam aktiflerinin sektör payı %8,3'tür. 2023 yılı mart ayı itibari ile Katılım bankacılığı sisteminin sermaye yeterlilik oranı %18,17 iken Konvansiyonel bankacılık sisteminin sermaye yeterlilik oranı %17,67'dir. Katılım bankacılığı sektöründe takipteki alacaklarının toplam nakdi kredilere oranı %1,22 iken Konvansiyonel bankacılık sektöründe %1,82'dir. Yabancı para net genel pozisyonu açısından Katılım bankacılığı sistemi uzun pozisyon da olup değeri 954,50'dir. Konvansiyonel bankacılık sistemi ise yine uzun pozisyonda hizmet vermekte ve 5.849,76 değerindedir. Bu çalışmada, Türkiye'de Katılım bankacılığı sisteminin gelişimine ve Türk bankacılık sistemi içerisinde yer alan Katılım bankaları ile Konvansiyonel bankaların; Sermaye yeterlilik rasyosu açısından, Takipteki alacakların Toplam nakdi kredilere oranı açısından ve Yabancı para net genel pozisyonu açısından mukayesesine yer verilmiştir."
