abstract: "Kuran ve Sünnet'te geçen mal kavramına sözlük anlamı dışında hukuki bir anlam yüklenmemiştir. Dilciler'de mal kelimesi için \"maruftur\" demekle yetinmişlerdir. İslam hukukçuları teknik mal tarifi yapmışlar, bir şeyin mal sayılmasında asıl unsurun şer'in muteber saydığı örftür, demişlerdir. Kuran ve Sünnet'te umumi manada mal olabilecek her şeyi kapsayan mal ve emval kavramları kullanılmıştır. Emval kavramı umumi manasıyla tüm malları ihtiva edecek şekilde kullanılmıştır. Kuran'ı Kerim'de azımsanamayacak kadar somut örneklerle belirtilen mal adları mevcuttur. Bunlar: Hayr, rızk, arad, enam, zinet, kenz, bidaa, meta, taam, ganimet, semer, zeheb-fidda gibi kavramlardır. Kuran'da mallar, demir, bakır gibi madenlerle; süt, yün gibi çeşitli hayvani ürünlerle ve hurma, nar, ekin gibi zirai mahsüllerle ifade edilmişlerdir. Yine bu malların çeşitli menfaatlerinden de yararlandığımız vurgulanmaktadır. Kuran ve Sünnet'te kullanılan malla ilgili kavramlar, zekât tarihini de ortaya koymaktadır. Diğer bir deyişle bu süreç, gönüllülükten mecburiliğe geçiştir. Fakihler mal kavramını, fıkhın tarihi tekâmül sürecinde, farklı şekillerde tarif etmişlerdir. Tarihi süreç içinde, mezhepler ekonomik ve sosyal değişime uygun olarak, mal tariflerinde değişikliklere gitmişlerdir. İslam Hukuku'na göre her devirde değişen zaman ve gelişen teknik sebebiyle yararlanma (intifa) ve edinme (temevvul) olabilecek yeni mallar, ictihat yolu ile hukuki muamelelerin konusu olabilecektir. Ayetlerde ön plana çıkan ana vurgulardan biri malın \"helal\" ve \"tayyib\" (temiz) olmasıdır. Mal şu şekilde tarif edilebilir: \"Mal, hukuken (şer'an) faydalanma (intifa), edinme ve sahip olmaya (temevvül ve temellük) mevzu olabilecek kıymet ifade eden, bütün eşya (ayn), menfaat ve haklardır.\" Zekât, Kuran'da belirttiği gibi, Allah'ın daha önceki ümmetlere farz kıldığı, aynı şekilde Müslümanlara da farz kılınmış ibadetlerden biridir. Bu durum vahiydeki silsileyi ve sürekliliği göstermektedir. Kuran bu sürece bütüncül bakmaktadır. Anahtar Kelimeler: Kuran, Sünnet, Zekât, Nisab, Mal."
