abstract: "Tarih boyunca savaşlar kaçınılmaz bir hal almıştır. Bu savaşlar sonucunda galip olan taraf, mağlup olan taraftan ele geçirdikleri menkul veya gayrimenkul mal varlıkları ve esirleri“ganimet”olarak almıştır. Câhiliye dönemindeki Araplarda kabile sistemine dayalı toplum yapısı ve çöl ikliminin zor şartları genelde ganimet almaya yönelik savaş ve baskınlara sebep olmuş ve bu savaş ve baskınlarda genel olarak ahlâkî bir kural veya adalet anlayışının da olmadığı görülmüştür. Ganimette en büyük payı kabile reisi komutan vasfıyla kendine almış, ganimetin geri kalanı ise rastgele dağıtılmıştır. İslâm gerek savaşta gerekse savaş sonrası ganimetlerin taksiminde belli kurallar getirerek toplumların veya devletlerin savaş anlayışlarına medeniyet getirmiştir. Allah Teâlâ âyet-i kerîmelerde ganimet ve taksimi ile alakalı hükümleri bildirmiş, Hz. Peygamber de bu hükümleri tatbik etmiştir. Bu tez çalışmasında, ganimet taksimiyle alakalı Kur'ân'da bildirilen hükümlerin Hz. Peygamber ve onun yolundan giden“Dört Halife”döneminde nasıl uygulandığı tespit ettik, böylece günümüzde ganimet taksiminde uyulması gereken kural ve düzenlemelerin nasıl olması gerektiği hakkında bir sonuca vardık."
