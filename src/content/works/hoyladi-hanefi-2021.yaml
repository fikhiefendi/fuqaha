abstract: "Hanefî mezhebi, ilk tezahürlerinin sahabe döneminde görüldüğü ve tâbiîn döneminde bir okula dönüşen re'y ekolünün Ebû Hanîfe ve öğrencileri öncülüğünde billurlaşması sürecinde teşekkül etmiştir. Ebû Hanîfe'nin ders halkasında ortaya koyduğu içtihat metodu ve farazî meselelerin tartışılması ve bunlardan elde edilen asılların yazılmasıyla, bir birikim oluşmuş ve bu birikim Ebû Yûsuf ve daha İmam Muhammed tarafından tasnif edilerek kitap haline getirilmiştir. İmam Muhammed, bu işlemi hocasının ilk defa ortaya koyduğu konu tertibi, kitâb ve bâb sistemine göre yapmıştır. Ebû Hanîfe'nin dünyanın farklı coğrafyalarından gelen öğrencileri de bulundukları şehirlerde tesis ettikleri ders halkalarında yüzlerce öğrenci yetiştirerek ve onun görüşlerini rivâyet ederek mezhebin teşekkülüne katkıda bulunmuşlardır. Öğrencileri Ebû Hanîfe'nin sadece fıkhî görüşlerini değil aynı zamanda itikadî görüşlerini de rivâyet etmişlerdir. Hicrî ikinci asırda özellikle Ebû Yûsuf'un kâdılkudât olmasıyla Hanefî düşünceye sahip olanların devletle olumlu ilişkiler geliştirmesi, mezhebin teşekkülüne olumlu katkılar sağlamıştır. Hicrî üçüncü ve dördüncü asırlarda Hanefî düşünceye sahip olanların tedris, telif ve rivâyet çalışmaları artarak devam etmiştir. Mezhep usûlünün tedvin çalışmaları İsa b. Ebân'la ivme kazarak devam etmiştir. Bununla birlikte özellikle usûl ve fürûda bölgeler arasında kısmî farklılıklar oluşmaya başlamıştır. Mezheplerin oluşumuyla ilgili farklı teoriler ileri sürülse de her mezhep kendine özel şartları çerçevesinde teşekkülünü tamamlamıştır. Hanefi mezhebinin teşekkülünü tamamladığı üç farklı gösterge ile anlaşılmaktadır. Bunlardan ilki, muhtasar ve şerh kitaplarının yazılmasıdır. İkincisi, usûl kitaplarının tedvin edilmesidir. Üçüncüsü ise nevâzil tarzı eserlerin kaleme alınmasıdır. Tüm bu çalışmalar, dördüncü asrın son çeyreğine girilmeden tamamlanmış ve mezhep teşekkül etmiştir."
