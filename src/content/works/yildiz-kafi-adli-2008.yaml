abstract: "Hanefi mezhebinin tedvininde en büyük rolü oynayan İmam Muhammed b. el-Hasan eş-Şeybani (ö.189/805) dir. İmam Muhammed, Irak fıkhını öğrenmekle kalmamış, Medine'ye de gitmiş ve İmam Malik'ten hadis ve Hicaz fıkhını da tahsil etmiştir. Kadılık görevinde de bulunan İmam Muhammed'in Hanefi ekolünün görüşlerini gelecek nesillere aktaran eserleri iki sınıfa ayrılır:1) Kendisinden güvenilir kişilerce rivayet edilen ve ?Zahir-i Rivaye? veya ?Mesailu'l-Usul? diye anılan eserleri. Bunlar: el-Asl (el-Mebsut), el-Cami'u'l-Kebir, el-Cami'u's-Sağir, es-Siyeru'l-Kebir, es-Siyeru's-Sağir ve ez-Ziyadat adlı eserlerdir.2) Daha az güvenilir yollarla nakledilen ve ?Gayr-i Zahir-i Rivaye? veya ?Mesailu'n-Nevadir? diye bilinen eserleri. Bunlar da: el-Keysaniyat, er-Rakkiyyat, el-Haruniyyat, el-Cürcaniyyat ve Ziyadatu'z-Ziyadat adlı eserleridir.El-Hâkim eş-Şehid diye anılan Ebu'l-Fazl el-Mervezi (ö.334/945), İmam Muhammed'in ?Zahir-i Rivaye? olarak bilinen bu altı kitabını el-Kâfi adı altında bir araya getirmiştir.Bu çalışmada Hanefi mezhebinin temel kaynaklarından biri sayılan el-Kâfi adlı eserin Nikâh bölümünün metni yazmalara dayanılarak ortaya konulmaya çalışıldı Tenkitli metin neşri yapmak için bu eseri seçmemizin sebebi bu eserin Hanefi mezhebinin kaynakları arasında önemli bir yerinin olmasıdır. Eserin tamamının edisyon kritiğini yapmak bu çalışmada mümkün olmadığından nikâh bölümünün tenkitli neşriyle yetinilmiştir.Çalışma iki ana kısımdan oluşmakta olup birinci kısımda Hanefi kurucu metinleri ve kişileri ile İmam Muhammed ve el-Mervezi'nin biyografileri hakkında bilgi verilmiştir. Ayrıca İmam Muhammed'in en önemli eseri olan al-Asl ile el-Kâfi arasında bir karşılaştırma yapılmıştır. Arapça olan ikinci kısım ise bazı İstanbul yazmalarına dayanılarak yapılmış bir tenkitli neşir çalışmasıdır."
