abstract: "Bu çalışmanın amacı, katılım bankalarında çalışanların İslam insanı (homoislamicus) davranışının incelenmesidir. İktisat biliminde insan, homoeconomicus olarak ifade edilmektedir. Homoeconomicus sadece kendi çıkarlarını kollayan bencil insandır. Oysa çalışma hayatında homoeconomicusların varlığı, iş ahlakının devamlılığını olumsuz bir şekilde etkilemiştir. Ahlaklı bir çalışma hayatı için homoislamicus davranış gösteren ahlaklı bireylere ihtiyaç vardır. Çalışmada, Sabahattin Zaim'in“Ekonomik Hayatta Müslüman İnsanın Tutum ve Davranışları”makalesinden yola çıkılarak“İslam İnsanı Davranışı (Homislamicus) Ölçeği”geliştirilmiştir. Ölçek, altı boyut (ikrazda bulunma, ücretli olarak çalışma, tüketim harcamalarında bulunma, gelir elde etme, ekip ruhuyla hareket etme ve helal kazanç) ve 40 sorudan oluşturulmuştur. Araştırmanın örneklemi Türkiye'nin farklı bölgelerinde çalışan, 293 katılım bankası personelidir. Anketlerle elde edilen veriler SPSS26 istatistik programında analiz edilmiştir. Tez çalışmasının sonucunda katılım bankası çalışanlarının, bulunduğu bölgelere, gelir düzeyine ve unvanlarına göre İslam insanı davranışlarında bazı farklılıklar olduğu tespit edilmiştir. Çalışmada, Türkiye'deki diğer bölgelere nazaran İç Anadolu, Karadeniz, Doğu Anadolu bölgesinde İslam insanı davranışı puanlarının daha yüksek olduğunu tespit edilmiştir. Diğer yandan gelir seviyesi en yüksek olan grupta, islam insanı davranış puanlarının en yüksek olduğu görülmüştür. Eğitim seviyesi, medeni hal ve yaş değişkenlerinin ise ekonomik faaliyetlerde islam insan davranışı puanlarını etkilemediği sonucuna ulaşılmıştır."
