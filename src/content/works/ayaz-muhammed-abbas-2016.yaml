abstract: "Eski Anadolu Türkçesiyle yazılmış“Manzûme-i Ferâ™iz”üzerine yapılan ve üç bölümden oluşan bu çalışmanın Giriş bölümünde; fıkıh ilminin bir dalı olan; ancak zamanla müstakil bir ilim dalı hâlini almış ferâ™iz ilmi, kaynakları ve ilgili kavramlar tanıtılmıştır. Hakkında herhangi bir bilgiye ulaşamadığımız bu eserin müellifi hakkında, eserden edinilen izlenimler verilmiş ve eserin konusu, kaynakları, telif sebebi, bölümleri, yazılış tarihi ve yeri, bazı dil ve üslup özellikleri, Kıpçak Türkçesi özellikleri ile eserdeki Arapça unsurlar, Farsça unsurlar, ebcet, nazım şekli, vezin, kafiye ve anlatım özellikleri üzerinde durulmuştur. İnceleme bölümünde ise eserin ses (fonetik) ve şekil (morfolojik) tahlilleri yapılarak dil özellikleri ortaya konulmuştur. Metin bölümünde eser transkripsiyon işaretleri kullanılarak Latin alfabesine aktarılmıştır. Yazı çevrimi sırasında yanlış yazıldığı veya vezin gereği yazımının değiştirildiği düşünülen kelimelerin düzeltilmiş şekilleri metin kısmına yazılarak orijinal şekli dipnotlarda belirtilmiştir. Dizin kısmında Metin bölümündeki anlam unsurlarının, gerek yalın gerekse çekimli şekilleriyle el yazması eserde nerede yer aldığı, anlamları ve kökenleri gösterilmiştir."
