abstract: "Bu tezde katılım bankacılığının sürdürülebilir finansman modelleri açısından değerlendirilmesi amaçlanmıştır. Çalışma, ilgili akademik yayınlar, sektörel raporlar ve güncel haber analizleri yazılı kaynakların taranmasına dayalı nitel bir araştırmadır. Katılım bankacılığı, faizsiz prensipleri, risk paylaşımı ve reel ekonomiye yönelimi gibi temel nitelikleriyle sürdürülebilir kalkınma hedeflerine ulaşılmasına potansiyel katkı sağlayabilir. Bununla birlikte sermaye yetersizliği, kaynak maliyetleri, dağıtım kanalı ve ürün çeşitliliği sınırlılıkları gibi çeşitli zorluklarla karşılaşmaktadır. Sürdürülebilir finans ise çevresel, sosyal ve yönetişimsel faktörleri finansal süreçlere entegre ederek daha eşitlikçi, kapsayıcı ve sürdürülebilir bir ekonomik sistemin gelişimini desteklemeyi hedefler. Literatür taraması, iki alan arasında güçlü kavramsal bağlar olduğunu ancak bu potansiyelin uygulamaya yansımasında zorluklar bulunduğunu göstermektedir. Kuveyt Türk Katılım Bankası örneği, bu kesişimin Türkiye'deki somut yansımalarını analiz etmektedir. Sonuçlar, katılım bankacılığı ve sürdürülebilir finans entegrasyonunun finans sektörünün sürdürülebilir dönüşümünde belirgin bir rol potansiyeli taşıdığını işaret etmektedir."
