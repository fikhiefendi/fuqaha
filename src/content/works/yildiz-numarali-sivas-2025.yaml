abstract: "Osmanlı hukuk sisteminin taşradaki temel uygulayıcı unsurlarından biri olan kadıların tuttuğu şer'iyye sicilleri, hem adlî hem idarî tarih açısından birincil kaynak niteliği taşımaktadır. Bu defterlerde sadece şahıslar arası hukuki işlemler değil; aynı zamanda merkezî yönetimin taşraya yönelik politikaları, fermanları, tayin ve sürgün emirleri gibi birçok konuda kayıtlar yer almaktadır. Bu çalışma, Osmanlı taşra adalet sistemine ışık tutan Sivas 11 Numaralı Şer'iyye Sicilini (H. 1233–1237 / M. 1818–1822) konu edinmektedir. Sicil, Tanzimat öncesi döneme ait olup kadı sicillerinin klasik yapısını yansıtmaktadır. Çalışmada yer alan belgeler, dönemin; sosyal, ekonomik siyasi, hukuki ve askerî uygulamaları anlamaya imkân vermektedir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş kısmında tezde takip ettiğimiz metot ve usulen bahsedilip dönemin tarihine kısaca yer verilmiştir. Birinci bölümde; Osmanlı hukuk sistemi, Şer'iyye sicilleri ve türleri, Sivas Şer'iyye sicilleri, Sivas 11. Şer'iyye Sicilinin konu ve türlerinin tasnifiyle değerlendirme yapılmıştır. İkinci bölümde, sicilde geçen belgelerin özeti yapılmıştır. Üçüncü bölümde ise Sivas 11. Şer'iyye Sicilindeki belgelerinin tamamının transkripsiyonu yapılmıştır."
