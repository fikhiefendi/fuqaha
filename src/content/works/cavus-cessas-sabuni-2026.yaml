abstract: "Bu çalışmada İslâm ticaret hukukunda yer alan temel kavram ve hükümlerin iki önemli ahkâm müfessiri olan Cessâs ve Sâbûnî özelinde mukayeseli olarak incelenmesi amaçlanmıştır. Araştırmada öncelikle İslâm ticaret hukukunun genel çerçevesi ele alınmış olup ticaretin meşruiyeti, kaynakları ve temel ilkeleri ortaya konulmuştur. Ardından Cessâs ve Sâbûnî'nin ayrı ayrı hayatları, ilmî kişilikleri ve eserleri tanıtılarak, özellikle ahkâm tefsirleri çerçevesinde ticaretle ilgili âyetlere yaklaşımları analiz edilmiştir. En son ise bu iki müfessirimizin yöntemlerini ve ticaretle ilgili âyetlere yaklaşımlarını mukayese edilmiştir. Çalışmada ticaret, akit, bey', ribâ ve karz gibi temel ticaret hukuku kavramları merkeze alınmıştır. Her iki müfessirin bu kavramlara dair yorumları ayrı ayrı incelenmiş ve mukayeseye tabi tutulmuştur. Müfessirlerin hüküm istinbat yöntemleri, kullandıkları deliller ve mezhep aidiyetlerinin yorumlarına etkisi değerlendirilmiştir. Elde edilen bulgulara göre, Cessâs'ın daha sistematik ve usûl merkezli bir yaklaşım benimsediği özellikle illet temelli değerlendirmelerle hüküm çıkarma sürecine önem verdiği görülmüştür. Buna karşılık Sâbûnî'nin daha sade, açıklayıcı ve ahlâkî boyutu ön plana çıkaran bir üslup tercih ettiği tespit edilmiştir. Her iki müfessirin temel ilkelerde büyük ölçüde benzer görüşler taşıdığı ancak kavramların detaylandırılması ve uygulanması noktasında farklılıklar ortaya koyduğu anlaşılmıştır."
