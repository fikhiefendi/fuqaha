abstract: "“Çeşitli bilim, sanat, meslek, spor dallarında kullanılan, bunlarla ilgili varlıkları, durumları, olayları karşılayan sözcük”olarak tanımlanan terim, bilim dallarını oluşturan en temel unsurlardan biridir. Arapça modern hukuk terimlerinin üzerinde çalışıldığı bu araştırmada; terim ve terminoloji kavramlarının tanımı ve içeriği hakkında bilgi verildikten sonra konu, batıda ve Arap dünyasında yapılan terminoloji faaliyetleri çerçevesinde değerlendirilerek; kişisel ve kurumsal faaliyetler olmak üzere iki alt başlıkta incelenmiştir. Terim türetme yöntemlerinden iştikâka dayalı terim türetme yöntemi esas alınmıştır. İştikâk-ı sağir, iştikâk-ı kebîr, iştikâk-ı ekber ve iştikâk-ı kubbâr yöntemlerinin kullanımları ile ilgili temel bilgiler aktarıldıktan sonra hukuk ve dil ilişkisine değinilmiştir. 1924'ten sonra Teşkilât-ı Esasiye Kanunu'nun yeni Türkçeye çevrilmesi gibi birtakım Türkçeleştirme çalışmaları yapılmasına rağmen güncel Türk hukuk terimlerinin büyük bir çoğunluğunu Arapça alıntı kelimelerin oluşturduğu ve bu alıntı kelimelerin Türk hukuk dilinde çeşitli anlam değişikliklerine uğradıkları tespitlerine varılarak, Arapçadan Türkçeye ve Türkçeden Arapçaya modern hukuk terimleri listesi oluşturulmuştur."
