abstract: "Vakıf, insan yaşamının çeşitli yönlerini tamamlayan ve onurlu bir yaşamı engelleyen her şeyden kurtaran bir İslami mali kuruluştur. Alimlerimiz ona büyük önem vermiş ve fakihlerimiz, illet ile hüküm arasındaki ilişkiye dayanan içtihat ve çıkarımlara ulaşmak için akıllarını kullanmışlardır. Bu bağlamda,“Vakıfların Doğal Afetlerle Mücadeledeki Rolü”başlıklı bu doktora tezi önem kazanmaktadır. Bu çalışma, vakfın salgınların etkilerini ele alma yöntemlerindeki rolü ile ilgili çağdaş fıkıh meselelerinden bir hedefi gerçekleştirmeye odaklanmıştır. Tarihin ve eski vakıf tecrübelerinin incelenmesi, Kur'an ayetleri, Peygamber'in sünneti, selef-i salihin'in eserleri ve konuyu yakından veya uzaktan ele alan yazılar ve araştırmalardan delil getirme yöntemleri kullanılmıştır . Bu nedenle, sosyal, ekonomik, eğitim ve sağlık alanlarında olsun, vakfın bu etkilerle mücadeledeki tarihi ve kültürel rolünün önemli yönleri sunulmuştur. Araştırma, salgınların tanımını, tarihini ve toplum üzerindeki etkilerini, meşruiyetlerini, türlerini ve alimlerin bu konudaki tutumlarını açıklamıştır. Daha sonra vakfın bu etkileri ele alma rolü sunulmuş ve araştırma, tarihsel çıkarımların analiz edilmesi yoluyla kolektif bir vakıf kurulmasını önererek sonuçlandırılmıştır. Bu, vakfın kuruluş amaçlarını gerçekleştirmek için etkili bir araç haline gelmiştir. Bu tezi hazırlarken karşılaştığım zorluklar arasında, konunun şeriatla ilgili olarak helal ve haram meseleleriyle ilişkili olması ve çağdaş içtihatlar gerektiren çağdaş fıkhi meselelerden biri olması nedeniyle hassasiyeti ve doğrudan konumla ilgili kaynakların yetersizliği bulunmaktaydı. Araştırmanın sonunda, vakfın ve günümüzde sıkça karşılaşılan salgınlarla olan ilişkisinin incelenmesi için kurumlar ve kuruluşlar oluşturulması gerekliliği gibi sonuçlara ve önerilere ulaşılmıştır ."
