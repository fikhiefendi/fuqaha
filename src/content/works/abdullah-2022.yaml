abstract: "Bu çalışmada, Hanefi fıkhının hayız, nifas ve istihazeye dair taharet hükümlerini içeren ve Muhammed b. Veli b. Resul el-Kırşehrî'ye ait olan Şerhu Zehri'l-Müteehhilîn isimli el yazması eserin iki nüshasını esas aldık. Yazma eserin ilk nüshasını, İzmir Kütüphanesi'nden, ikinci nüshasını ise Antalya'daki Tekelioğlu İl Halk Kütüphanesi'nden temin ettik. Diğerinden daha önce tedvin edilmiş olmasından dolayı ilk nüshayı orijinal nüsha olarak kabul ettik. Daha sonra mümkün mertebe daha doğru ve güvenilir bir nüshaya ulaşmak için ikinci nüshayla ilk nüshayı karşılaştırdık. Çalışmamızın ilk bölümünde elyazması eserin müellifini, eserin konusunu ve müellifin takip ettiği metodu ele aldık.El yazması eserde şerh edilen kitabın yazarını ele aldık. El yazması eserin başından, ortasından ve sonundan olmak üzere iki nüshaya da ait fotoğraflar eşliğinde ele aldığımız iki nüshayı tanıttık. Daha sonra çalışmamızda uyguladığımız tahkik metodundan bahsettik.Buradan hareketle çalışmamızın özünü oluşturan ikinci bölüme geçtik ve bu bölümde iki nüsha üzerinden eserin tahkikini gerçekleştirdik. Çalışmayı ulaştığımız sonuçları ifade ederek bitirdik. Bu sonuçların en önemlisi ise dini ilimler sahasında hizmet etme konusunda Türk ilim adamlarının rolünü tespit etmektir."
