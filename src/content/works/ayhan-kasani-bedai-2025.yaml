abstract: "Öteden beri ilim meclislerinde büyük ilgi gören ve okutulan Bedâiu's-Sanâi' fî Tertîbi'ş-Şerâi' adlı eser, taşıdığı ilmî değere uygun olarak yalnızca Hanefî mezhebine ait görüşleri değil, diğer mezheplere mensup âlimlerin görüşlerini de ele almakta ve değerlendirmektedir. Ancak, farklı mezheplere ait görüşlerin aktarımı sırasında müelliflerin doğrudan mezhebin temel kaynaklarına ulaşamaması, kavramsal karışıklıklar, istinsah hataları, bazı ifadeleri yanlış anlamaları veya hatalı değerlendirmeleri gibi nedenlerle bilgileri eksik veya hatalı nakletme riski bulunmaktadır. Bu durum, okuyucuyu ilgili mezhebin esas kaynaklarından doğrudan öğrenim yerine, farklı bir mezhebin eserinden alıntı yaparak öğrenme ve aktarma konusunda tereddüde düşürebilmektedir. Bu çerçevede, Kâsânî'nin eserinde, özellikle nikâh ve talâk konularında İmam Şâfiî'ye nispet edilen görüşlerin yeterince incelenmemiş olması ve bu görüşlerin gerçekten İmam Şâfiî'ye ait olduğunun teyidine duyulan ihtiyaç, çalışmamızın temel motivasyonunu oluşturmuştur. Bu doğrultuda, tümevarım yöntemi kullanılarak eserde yer alan veriler tespit edilmiş, betimsel analiz yöntemiyle her bir veri ayrıntılı bir şekilde ele alınmış ve karşılaştırmalı bir değerlendirme yapılmıştır. Yapılan incelemeler neticesinde, Kâsânî'nin İmam Şâfiî'ye nispet ettiği görüşlerin büyük çoğunluğunun isabetli olduğu tespit edilmiştir. Bununla birlikte, on (10) görüşte isabetli bir aktarımda bulunmadığı, yirmi (20) görüşte ise eksik veya dikkatsiz bir nakil yaptığı gözlemlenmiştir. Elde edilen bu bulgular ışığında, Kâsânî'nin görüşlerinin doğruluğu değerlendirilmiş ve İmam Şâfiî'nin sahih görüşlerinin eserde ne derece doğru aktarıldığı ortaya konulmuştur."
