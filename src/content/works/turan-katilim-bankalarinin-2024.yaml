abstract: "Bu çalışmada dini, sosyal, ekonomik ve politik gibi nedenlerden dolayı kurulmuş ve günümüzde giderek artan katılım bankalarının konvansiyonel bankalardan uygulama farklılıklarının farkındalığı ve bu bankaların tercihinde etkili olan faktörler Batman ili ölçeğinde belirlenmeye çalışılmıştır. Çalışma kapsamında 428 katılımcı üzerinden anket yöntemiyle veriler toplanmış ve analiz edilmiştir. Çalışmada en çarpıcı bulgu, katılımcılardan 87 kişinin (%20,3) her iki bankayı birbirinden ayırt edemediği olmuştur. Bu durum katılım bankaları ile ilgili farkındalık düzeyinin düşük olduğu şeklinde değerlendirilmiştir. Çalışmada ayrıca katılımcıların katılım bankalarına ilişkin dini açıdaki yargılarının genel anlamda olumlu olduğu görülmüştür. Ancak katılım bankalarının tercihinde sadece dini faktörlerin değil, ekonomik ve mali gibi diğer faktörlerin de bu bankaların tercihinde etkili olabileceği anlaşılmıştır. Katılım bankalarına ilişkin dini, ekonomik/mali ve genel anlamdaki yargıların ortalamalarının katılımcıların cinsiyet, yaş, eğitim, meslek ve gelir gibi bazı tanımlayıcı özelliklerine göre değişip değişmediği sınanmış ve bununla ilgili oluşturulan hipotezlerin çoğu reddedilmiştir. Yapılan korelasyon analizi sonucunda ise sadece eğitim ve gelir değişkenleri ile katılım bankalarına ilişkin ekonomik ve mali yargıların ortalaması (KBEO) arasında pozitif bir ilişki olduğu gözlenmiştir."
