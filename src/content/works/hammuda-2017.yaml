abstract: "Çalışmada Libya'nın Mâlikî mezhebine müntesip iki aliminin fetvalarında zikredilen hadis rivayetlerinin tahrici ve tahkiki yapılacaktır. Bu iki âlimden ilki Muhammed Kirriv diğeri ise Miftâh el-Lebîdî'dir. Her iki âlim de Libya'nın en önemli şehirlerinden biri olan, başkent Trablus'un 200 km. doğusunda Akdeniz kıyısında yer alan Misrata şehrinde doğmuş ve orada vefat etmiştir. Kirriv ve Lebîdî hicri XIV yüzyılın ikinci yarısı ve XV yüzyılın ilk çeyreğinde yaşamıştır. Her iki âlim de tedris, vaaz ve fetva ile uğraşarak ilim ile dolu bir hayat yaşamış bunun yanında insanlar arasındaki huzursuzluklardan kaynaklanan problemlerde arabuluculuk yapmışlardır. Dolayısıyla onların hem ilim alanında mümtaz bir konuma hem de insanlar nezdinde müstesna bir yere sahip olduklarını söylemek mümkündür. Kirriv ve Lebîdî, Libya'nın farklı pek çok ilim alanında mahir olan kadim âlimlerine örnek teşkil etmekte olup; tefsir, hadis, fıkıh, usûl, farklı alanları ile dil, mantık felsefe ve kelam ilimlerinde söz sahibidirler. Çalışmanın ana konusuna girmeden önce İslam'ın Libya topraklarına girmesinden bu iki âlimin yaşadığı çağa kadar Libya'da ilmi hayatın nasıl doğduğu ve geliştiğine dair bir giriş yapmak gerekmektedir. Böylelikle Libya'nın henüz çok erkek sayılabilecek bir dönemden itibaren İslamî ilimlerle olan bağı açığa çıkacak; hem de sahabe döneminden itibaren süregelen ilmi gelenek bu şekilde ortaya konulacaktır. Çalışmamız iki açıdan önemlidir. Birinci nedeni, çalışmada, âlimlerimizin hadis ve hadis ilimleri ile var olan sıkı bağı ortaya konulmuş olup, bu sayede onların, kendilerinden önce yaşamış âlimleri taklit etmekle yetinmediği, kitaplarında sadece fıkıh metin ve haşiyeleri ile uğraşmadıkları ve daha önemlisi sünnet ile aralarında bir mesafenin olmadığının tespit edilmesidir. İkincisi: Libya'nın yetiştirmiş olduğu iki güzide âlimin, kendi dönemlerinde insanların ihtiyaçlarına cevap veren fetvaları derlenip hadis ilim açısından tahlile tabi tutulmasıdır. Çalışmamızda, öncelikle genel hatlarıyla tarihi çerçevede Libya'ya İslam'ın girişi ve dolayısıyla Hadis ilminin takibi ile oluşan ilmî hayatın ilk temelleri ve öncü isimleri olan sahabe ve sonraki âlimler tespit edildi. Daha sonra özellikle tarih boyunca bu iki alime kadar bu topraklarda yetişen ilim adamlarından genel olarak bahsedildi ve tezimize konu olan iki âlimin; biyografisi ve ilmi hayatı izah edildi. Sonraki bölümde fetvalar ele alındı ve bu fetvalar hadis ilmi açısından çeşitli yönleriyle tahlile tabi tutuldu. Bu bağlamda hadis rivayetlerinin sahihlik ve zayıflık açısından dereceleri tespit edildi ve âlimlerin bu husustaki görüşlerine yer verildi. Böylelikle özellikle ilim dünyasına bu iki büyük âlimin hadis alanındaki hizmetlerini tanıtmış olduk."
