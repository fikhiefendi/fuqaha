abstract: "ÖZET YAŞAR, Yahya, İslam Ceza Hukukun'da Suça Teşebbüsün Mahiyeti Ve Hukuki Sonuçları, Yüksek Lisans Tezi, Danışman: Doç.Dr. Şamil DAĞCI, 91 s. İnsanların ortaya koymuş oldukları eylem ve Hareketler dış dünyada toplum ve bireyin zararına bir etki arz etmediği sürece hukukun müdahalesine maruz kalmamaktadır. İslam Ceza Hukukunda Hadd, Kısas ve gerektiren suça tam ceza verilebilmesi için suçun bütün unsurlarının gerçekleşmesi gerekmektedir. Suç unsurları tam olarak gerçekleşmeyen suça teşebbüs ta'zir cezasını gerektiren suçlara girmektedir. İslam Ceza Hukukunda suç teşkil edilebilecek eylemlere ceza tespitinde titiz davranılmış ve yargı alanına girmeyen bir takım hareketleri kişilerin vicdan ve dini duygulan harekete geçirmek suretiyle düzeltme metodu benimsenmiştir. Eğer bir suça teşebbüs edilmiş ise yani icrasına başlanılmış fakat tamamlanmamış bir eylem varsa, buna tamamlanmış suça oranla daha az ceza verilmesi genel suç politikası açısından benimsenmiş bir kuraldır."
