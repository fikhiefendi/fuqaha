abstract: "Bu çalışma, İslami delillerde gayrimüslimlerin siyasî haklarını tespit ve tahlil etmeyi ve bu hususta hukukçuların söz ve görüşlerini delillerin izahıyla birlikte incelemeyi amaçlamaktadır. Bu araştırma bir giriş bölümü, üç bölüm ve bir sonuç içermektedir: Giriş bölümünde, araştırmanın konusu ve amaçları tartışılmış olup, gayrimüslimlerin türleri ve İslam devletine katılımları hakkında bir açıklama ile hak kavramları, Asya ve gerçekleri hakkında bilgilendirici bilgiler verdik. Birinci bölümde: Gayrimüslimlerin siyasî haklarından ve İslam devletindeki teminatlarından bahsettik. İkinci bölümde: (oy kullanma, aday olma, parti kurma, ittifaklar, muhalefet ve hükümet işleri) dahil olmak üzere siyasi hakların türlerini İslam devletine katılım örnekleri ile konuştuk ve İslam'ın üzerinde konumlandırın. Üçüncü bölümde ise hakların özellikleri ve kontrolleri hakkında bilginlerin bu kontrollerin önemi ve bu kontrolleri gayrimüslimler tarafından ihlal edilmesinin hükmü hakkında görüşlerini açıklayarak konuştu. Gayrimüslimlerin bu hakların İslam devletinde anayasaya ve İslam devletinin kanunlarına uyduğu sürece meşruiyetinde özetlenebilecek ulaştığım en önemli bulgu ve önerilerle bu araştırmayı sonlandırdım."
