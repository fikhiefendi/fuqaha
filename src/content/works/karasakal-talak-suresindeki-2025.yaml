abstract: "Bu çalışmada Talâk Sûresinde geçen ahkâm âyetleri incelenerek aile hukukunda boşanmayla ilgili konulara ışık tutması amaçlanmıştır. Boşamayla ilgili bazı meselelere açıklık getiren çalışmamız giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş kısmında araştırmamızın konusu, amacı, önemi ve yöntemi ve talâkla ilgili daha önce yapılmış olan çalışmaların incelenerek literatüre dair bilgiler verilmektedir. Çalışmamızın birinci bölümünde talâkın tanımı, meşrûiyyeti, boşanma ile ilgili çeşitli hükümlere değindik. İkinci bölümde talâkın şekli, zamanı sünnete uygun olup olmamasına ve geri dönüşü olup olmamasına göre talâk çeşitleri ile ilgili bilgi verilmektedir. Üçüncü bölümde iddetin tanımı, mâhiyeti, meşrûiyeti, çeşitleri ve iddet süreleri ile ilgili konuları inceledik. Dördüncü bölümde iddetin sonuçları, iddet bekleyen kadının mesken ve nafakası ile boşamadan sonraki zamanda çocuğun bakımı üzerinde durduk. Çalışmamızda talâk sûresinin tefsirlerde nasıl incelendiğine bakılarak, ahkâm tefsirlerinde konuyla ilgili zikredilen bilgileri fıkıh kitaplarından tekrar bir incelemeye tabi tutarak genelde dört fıkıh mezhebinin görüşlerini, delilleriyle ortaya koymaya çalışılmıştır."
