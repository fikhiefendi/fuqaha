abstract: "Fıkıh, insan hayatını dini açıdan yaşanılabilir kılan nizamın, nahiv ise ilim sahasını tanzim edip düzene sokan disiplinin ismidir. Din olmadan insan hayatının kıymeti olmayacağı gibi dilin kaideleri de olmadan her hangi bir ilmi disiplinin değeri anlaşılmayacaktır. İşte bu açıdan ilimle iştigal eden her bir birey için her iki alan da vazgeçilmezdir. Bu çalışma, nahiv kaide ve kurallarının fıkhî ihtilaflardaki rolünü dört mezhep üzerinden incelemektedir. Böylece her iki disiplin arasındaki etkileşim masaya yatırılmakta, fıkıh ve usûlü için vazgeçilmez bir yere sahip olan gramerin, bu iki sahaya ne oranda tesir ettiği tespit edilerek örnekler üzerinden açıklanmaktadır. Araştırma, nahiv kurallarının fıkıh sahasına ve orada yaşanan ihtilaflara (özellikle de muamelatta) çok büyük etkisinin olduğunu ortaya koymaktadır. Bu etki çerçevesinde fıkha dair eserlerin büyük bir bölümünde dile dair konulara yer verildiği görülmektedir. Ayrıca İslam hukukunun, dil kurallarının olmadığı bir zeminde ayakta duramayacağı ve aslında bu durumun diğer tüm İslâmî disiplinler için de geçerli olduğunu göstermektedir."
