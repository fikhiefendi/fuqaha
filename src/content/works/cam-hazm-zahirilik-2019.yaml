abstract: "Gülten Çam, İbn Hazm'ın Zâhirîlik Anlayışı ve Mezhep Eleştirilerine Yansımaları, Yüksek Lisans Tezi, Danışman: Prof. Dr. Sönmez Kutlu, 152 s. Bu çalışma“İbn Hazm'ın Zâhirîlik Anlayışı ve Mezhep Eleştirilerine Yansımalarını”tespit etmek amacıyla hazırlanmıştır. Mezhepler tarihi açısından önemli bir yere sahip olan Zâhirîlik, nassların literal anlamını esas alarak İslam Mezhepleri üzerindeki etkisini her dönem hissettirmektedir. Çalışma içerik itibariyle bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın önemi, konusu, kaynakları ve metodu üzerinde durulurken,“Zâhirî Anlayışın Teşekkülü ve İbn Hazm”adlı birinci bölümde Zâhirîlik kavramının tesbiti, Zâhirîliğin ortaya çıkışı gibi konuların yanında, İbn Hazm'ın zâhirîliğini oluşturan unsurları daha iyi anlayabilmek adına, İbn Hazm'a kadar Endülüs'ün siyasi, toplumsal ve dini durumu ele alınmıştır. Ayrıca İbn Hazm'ın düşünce yapısını daha iyi anlayabilmek amacıyla onun hayatı, ilmi kişiliği, eserleri vb. konulara yer verilmiştir.“İbn Hazm'ın Zâhirîliğini Oluşturan Unsurlar”adlı ikinci bölümde, tezimizin son bölümünde bizlere kolaylık sağlaması adına“İbn Hazm'ın Zâhirîliğini Oluşturan Unsurlar”tesbit edilmiştir. Ayrıca bu bölümün ilerleyen kısımlarında, İbn Hazm'ın etkisindeki Endülüs Zâhirîleri ve Endülüs Zâhirîliğinin diğer mezhepler karşısındaki konumu tespit edilmiştir. Tezimizin asıl kısmını oluşturan“İbn Hazm'ın Zâhirîlik Anlayışı ve Mezhep Eleştirileri Üzerine Yansımaları”adlı üçüncü bölümde ise birinci ve ikinci bölümde yapmış olduğumuz tespitlerden yola çıkarak, İbn Hazm'ın Zâhirîlik anlayışının“Hâricî, Mu'tezile, Şia ve Mürcie”eleştirileri üzerine yansımaları tespit edilmiştir."
