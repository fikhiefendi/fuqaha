abstract: "Müteşâbih âyetler meselesi, Kur'ân'ın anlaşılması bağlamında ortaya çıkan konulardan biridir. Benzerlik, kapalılık ve çok ihtimallilik sebebiyle müteşâbih ifadelerin manalarının“açıkça bilinemez”veya“anlaşılmaz”olduğu söylemi ile Kur'ân'ın açık ve anlaşılır bir kitap olduğu söylemi görünürde birbiriyle çelişmektedir. Özellikle,“Allah'ın eli”ve“Allah'ın yüzü”gibi müteşâbih ifadelere yanlış anlamların yüklenmesi veya bu tür ifadelerin Kur'ân'a ve Sünnet'e aykırı te'vil edilmesi itikadî açıdan büyük sorun teşkil etmektedir. Öyle ki müteşâbih sorunu; mezhepler arasında çok ciddi tartışmalara ve derin görüş ayrılıklarına neden olmuştur. Bu çalışmada Mu'tezile ve Ehl-i sünnet'in önde gelen müfessirlerinden Zemahşerî ile Ebüssuûd Efendi'nin müteşâbih âyetlere yaklaşımlarını mukayeseli bir şekilde irdelemeye çalıştık. Netice itibariyle müteşâbih âyetlerin yorumunda iki müfessir arasındaki ihtilaflardan çoğunun lafzî olduğu; esasen bu konuda aralarında görüş ayrılığından ziyade ciddi manada benzerlikler bulunduğunu fark ettik. Ayrıca Zemahşerî'nin Mu'tezilî olduğu halde bazı âyetlerin yorumunda Ehl-i sünnet'in görüşlerini kısmen benimsediğini gördük. Bu bakımdan, Ehl-i sünnet câmiasında adet haline gelen Zemahşerî'yi salt eleştirmenin veya tamamen ötekileştirmenin en azından müteşâbih âyetler bağlamında doğru olmadığı kanaatine vardık. Bilakis, onun bu konuda Ehl-i sünnet'e yakın durduğunu ve görüşleri içinde istifade edilebilecek hususların bulunduğunu söylemek mümkündür ."
