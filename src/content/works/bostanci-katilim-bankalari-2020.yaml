abstract: "Küreselleşmenin ve teknolojinin hız kazanmasından bu yana finans sektörü ve sektör içinde bankacılık faaliyet ve çeşitleri büyük bir değişim, gelişim ve çeşitlenme göstermiştir. Bankacılık alanında görülen değişimlerden biri de geleneksel mevduat bankalarına alternatif olarak ortaya çıkan yeni bir banka türüdür. Dünyada İslami bankacılık ya da faizsiz bankacılık olarak da bilinen bu yeni banka türü, ülkemizde katılım bankacılığı adı ile faaliyette bulunmaktadırlar. Son yıllarda İslami bankalar, gerek Müslüman devlet ve toplumlarda, gerekse tüm dünyada giderek daha fazla dikkat çekmekte ve gelişme göstermektedirler. Gelişmekte olan ekonomisi, jeopolitik ve jeostratejik konumu itibariyle Türkiye de İslami bankacılık faaliyetlerine katılım bankaları olarak iştirak etmiştir. Türkiye'de, özellikle son yıllarda, katılım bankacılık sektörünün gelişmesi için daha fazla çaba gösterildiği ve çalışma yapıldığı görülmektedir. Diğer banka türlerinden farklı olarak İslami bankacılık ilkeleri doğrultusunda özel cari hesaplar ve katılma hesaplarında topladıkları fonları farklı usullerle değerlendiren katılım bankaları meydana gelen kâr ya da zararı tasarruf sahipleri ile paylaşmaktadırlar. Bu çalışmanın motivasyonunu, geleneksel mevduat bankalarıyla katılım bankalarının finansal performanslarının karşılaştırılarak durumlarının ortaya konması yatmaktadır. Çalışmada, katılım ve mevduat bankalarının varlık yapısı, likidite, etkinlik, kârlılık ve risk değerlemesi boyutları seçilmiş 16 finansal oranla karşılaştırmalı olarak analiz edilmektedir."
