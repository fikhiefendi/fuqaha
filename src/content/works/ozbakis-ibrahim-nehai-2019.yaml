abstract: "İbrahim en-Nehaî Irak'ta rey ekolünü varlık alanına çıkaran ilk fıkhî şahsiyettir. Nehaî, Alkame b. Kays aracılığıyla İbn Mes'ud'dan aldığı bilgileri ve görüşlerini öğrencilerine aktarmış, Ebû Hanîfe ise bu bilgileri, Nehaî'nin görüşlerini ve metodunu Nehaî'nin öğrencilerinden olan hocası Hammâd b. Ebî Süleyman'dan almıştır. Bu çalışmada İbrahim en-Nehai'nin Hanefî mezhebine olan etkisi araştırılmıştır. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde nikâh ikinci bölümde talak başlığı altında Nehaî'nin fıkhî görüşlerini aktararak dört mezhepte ihtilaf edilmiş meselelerde Hanefî mezhebinin görüşlerinin Nehaî'nin görüşleriyle uyumlu olup olmadığı, Hanefî mezhebinin görüşüyle Nehaî'nin görüşünün farklı olduğu meselelerde Nehaî'nin görüşünün hangi mezhebin görüşüyle benzer olduğu belirtilerek konular işlenmiştir. Aile hukuku ile ilgili ve dört mezhep arasında ihtilaflı ana başlıkları da içeren 45 meselede Hanefî mezhebinin görüşünün Nehaî'nin görüşüyle aynı olup 12 meselede Hanefî mezhebi ile Nehaî'nin görüşlerinin farklı olduğu sonucuna ulaşılmıştır."
