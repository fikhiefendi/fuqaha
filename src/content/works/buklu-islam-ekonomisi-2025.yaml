abstract: "Bu tez, İslam ekonomisi perspektifinden Merkez Bankası Dijital Para Birimi (MBDP)'nin kâğıt paraya alternatif olarak kullanılabilirliğini derinlemesine incelemekte ve bu süreçte karşılaşılan teorik ve pratik zorlukları ele almaktadır. Çalışma, İslami finans prensipleri ile dijital para birimlerinin uyumlu hale getirilmesi, bu süreçte teknolojik altyapıların ve ekonomik mekanizmaların nasıl entegre edilebileceği üzerinde durmaktadır. İslam hukukunun ticari işlemler üzerine kuralları ve dijital para sistemlerinin bu kurallarla uyumu, özellikle değişen piyasa koşulları altında nasıl işlev görebileceği ayrıntılı olarak incelenmiştir. Bu bağlamda, blok zinciri teknolojisinin İslami finansal işlemler üzerindeki etkileri, şeffaflık, hesap verebilirlik ve güvenlik gibi temel İslami değerlerle olan uyumu üzerinde yoğunlaşılmıştır. Tez, dijital paraların İslam iktisadı içerisinde etkin bir şekilde nasıl yer alabileceği, finansal istikrar ve sosyal adalet gibi İslami ekonomik hedeflere nasıl katkıda bulunabileceği sorularına cevap aramaktadır. Ayrıca, İslam ekonomisine özgü dinamikler çerçevesinde, dijital paranın getireceği yeniliklerin yasal ve etik boyutları tartışılmakta, bu yeni teknolojinin potansiyel fayda ve riskleri değerlendirilmekte ve ilgili politika önerileri geliştirilmektedir."
