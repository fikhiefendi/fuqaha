abstract: "Bu çalışma, hayatının büyük kısmı Osmanlı topraklarda geçirmiş olan ve Mülteka'l-ebhur, Halebî kebir ve Halebî sağır gibi kıymetli eserler ile tanınan Hanefî âlim İbrahim b. Muhammed el-Halebî'nin (ö.956/1549) günümüze ulaşmış ancak matbu olmayan el-Müntehab mine'l-Fetâva't-Tatarhaniyye adlı eserinin kaynaklarını tespit edip eserde görüşleri zikredilen müellifler hakkında bilgi vermeyi ve“Kitâbü'l-Büyû'”ile“Kitâbü'l-İcârât”bölümlerini tahlil etmeyi hedeflemektedir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde el-Müntehab mine'l-Fetâva't-Tatarhâniyye isimli eserin müellifi İbrahim b. Muhammed el-Halebî'nin hayatı, ilmi şahsiyeti ve onun bize ulaşan eserlerinin tanıtılmasına ayrılmıştır. Bu bölümde Halebî'nin el-Müntehab'ında kaynak olarak doğrudan başvurulan eserler ve müellifler tanıtılmıştır. Ayrıca eserde sadece görüşlerine atıf yapılan âlimler hakkında da bilgi verilmiştir. İkinci bölümde el-Müntehab ile el-Fetâva't-Tatarhâniyye'yi karşılaştırıp el-Müntehab'ın“Kitâbü'l-Büyû'”ve“Kitâbü'l-İcârât”kısımları tercüme edildi. Sonra Halebî'nin füru' fıkıhla ilgili meşhur eseri Mültekâ'l-ebhur'un“Kitâbü'l-Büyû'”ve“Kitâbü'l-İcârât”kısımları tanıtılmaya çalışıldı ve Mültekâ'nın tertibini esas alınarak el-Müntehab ile bu iki bölümü üzerine mukayese yapıldı."
