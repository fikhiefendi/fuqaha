abstract: "Bu araştırma, uluslararası hukuk ve İslam fıkhında mülteciler ve onların kanuni haklarını ele almaktadır. Ayrıca mültecilerin bu haklarından kanunların, anlaşmaların, dünya insan hakları örgütlerinin ortaya koyduğu uluslararası beyannamelerin ve İslam fıkhının öngördüğü şekilde yararlanıp yararlanmadıklarını da araştırmaktadır. Bu araştırma uluslararası hukuk ve İslam fıkhında var olan bütün kanun, doktrin ve hükümleri ve bunların bu önemli insani sorun karşısındaki konumlarını açıklamayı hedeflemektedir. Aynı şekilde yürürlükteki kanunların mültecilere uluslararası anlaşmaların ve beyannamelerin vaat ettiği hakları vermemelerine, devletlerin ve uluslararası sistemlerin mülteci hakları ve sorununu yeteri kadar önemsememelerinin ve bazen kendi çıkarları için onların haklarını görmezden gelmelerinin sebep olduğunun ortaya konması hedeflenmektedir. Ya da buna mültecilerin, yürürlükteki kanunlar ve İslam fıkhının belirlediği meşru haklarının tam olarak bilincinde olmamalarının sebep olduğu ortaya konmuştur. Ancak günümüzde mülteci sorunuyla başa çıkma yöntemi, devletlerin maddi, idari ve kanuni çeşitli engeller koyarak onların ülkelerine gelişini engelleme ya da onları, kendi ülkelerinde hâkim olan durum ne kadar emniyetsiz ve istikrarsız olsa da oraya dönmeye zorlama şekline dönüşmektedir. Bu çalışmanın ana hedefine ulaşmak için hak ve iltica kavramları, iltica etmeye yol açan sebepler ve iltica şartları açıklanmıştır. Uluslararası hukuk ve İslam fıkhının zorunlu kıldığı haklar ve sorumluluklar ile uluslararası düzeyde mülteci haklarının korunması ve bunun yolları ele alınmıştır. Ayrıca bu çalışmada mültecilerin uluslararası hukuktaki ve İslam hukukundaki yasal statüleri ile iltica talep eden kişiye kanun tarafından getirilen sınırlamalar açıklanmıştır. Uluslararası anlaşmaların ışığında mülteci haklarının korunması, uluslararası hukuk ve İslam hukukunda iltica hakkını belirleyen ilkeler izah edilmiştir. Uluslararası hukuk ve İslam fıkhında iltica çeşitleri ile ilticanın sona ermesi durumuna da değinilmiştir. Aynı şekilde uluslararası hukuk ile İslam fıkhı arasına mülteci hakları bağlamında ortaya çıkmış şüphe ve ihtilaflar ile 'kanun ve fıkıhta' ilticayı sona erdiren durumlar genel hatlarıyla izah edilmiştir."
