abstract: "Nesih konusu, İslâm âlimleri arasında asırlar boyunca tartışılmış ihtilaflı bir meseledir. Bu konu, bugün de en çok tartışılan konuların başında gelmektedir. Kanaatimizce ihtilaflı olan böyle bir konuda temel kaynaklara ne kadar inilirse çözüme yaklaşma imkanı o oranda artacaktır. Neshin gerçekleşme alanının fıkhın konusunu teşkil eden ?amelî şer'î hükümler? olması sebebiyle, klasik fıkıh usûlü eserleri de bu kaynakların başında gelmektedir. Bu bağlamda tezimizin amacı, Hanefî usûlünün köşe taşlarından biri olan h. 4. yy. âlimlerinden Cessâs özelinde klasik fıkıh usûlünde neshin teorik ve pratik bağlamda nasıl anlaşıldığının ortaya konulması olmaktadır.Tezimizde öncelikle Cessâs ve nesih konusuyla ilgili genel bilgileri içeren bir giriş yaptık. Daha sonra Cessâs'ın neshi nasıl anlayıp tanımladığı, neshin imkânı, aklî temelleri ve gerçekleşmesi konusundaki düşünceleri üzerinde durarak onun nesih anlayışının teorik çerçevesini ortaya koymaya çalıştık. Bunların yanı sıra, Cessâs'ın neshin gerçekleşmesi için belirlediği şartlara ve çatışma durumunda (teârudu'l-edille) nassların nasıl uzlaştırılacağı hususuyla yakından alakalı olarak, neshin nasıl tespit edileceğine dair sunduğu kurallara geniş ölçüde yer verdik. Daha sonra ise Cessâs'a göre nesih çeşitlerinden bahsederek, daha önce teorisi ortaya konan nesih meselesini pratik örneklerle destekleyerek anlatmaya çalıştık. Bu şekilde nesih konusunu, Hanefî usûlünde elimize ulaşan ilk eser olan Cessâs'ın el-Fusûl fi'l-Usûl adlı eseri ve yine aynı müellifin Ahkâmu'l-Kur'ân adlı eserleri temelinde ele alarak onun bu konudaki görüşlerini gün yüzüne çıkarmakta ve klasik usûl âlimlerinin nesih anlayışından bir kesit sunmuş olmaktayız."
