abstract: "İnsanlığın varoluşu ile başlayan çok evlilik tartışmaları her zaman ve zeminde tartışılmış, birden çok kadınla evlilik dini ve kültürel ideolojiler kapsamında toplumda uygulanmıştır. Osmanlı Devletinde de (Batılılaşma ve modernleşme kapsamında) sosyal, siyasal, kültürel vb. birçok alanda tartışmalar yapılarak toplumun sorunlarına çözümler aranmıştır. Sosyal meseleler içerisinde önemli bir yer işgal eden aile meselesi ve kadın meselesi(hakları) üzerinde özellikle durulmuş, bu da birçok tartışmayı berberinde getirmiştir. Çok eşlilik meselesi de bu dönemde en çok tartışılan meseleler arasında yerini almıştır. Tartışmalar, Tanzimat'la başlayarak, II. Meşrutiyet döneminde yoğunlaşmış ve üç fikir akımı olan İslamcılar, Batıcılar ve Türkçüler 'in görüşleri çerçevesinde ilerlemiştir."
