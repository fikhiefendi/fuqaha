abstract: "Günümüzde küresel rekabetin etkileri, işletmelerin tüm süreçlerine etki etmekte ve yeni çıkan yönetim anlayışlarını benimsemelerini zorunlu hale getirmektedir. Bilgi ve teknoloji alanındaki hızlı gelişmeler işletmelerin uzun soluklu rekabet avantajını olumsuz etkilemektedir. Yapılan tüm yatırım ve alınan önlemlere rağmen işletmelere özgü ürün ve servisler kopyalanıp sahtesi piyasaya sürülerek işletmeleri zor durumda bırakmaktadır. Bunun farkına varan işletmeler 20. Yüzyılın son çeyreğinden itibaren kopyalanamaz nitelikteki insan unsuruna yönelmişlerdir. Küresel rekabet ortamında insan kaynağı faktörünün ayırt edici gücü, insan kaynakları yönetiminde yeni bir yönetim felsefesini ortaya çıkartmıştır. Bu yönetim felsefesinin adı 'Yetenek Yönetimi'dir. Yetenek Yönetimi, insan kaynaklarına yeni rol ve sorumluluklar yükleyerek insan kaynağı yönetiminin yerine yeteneklerin yönetimi anlayışını benimsemektedir. Finans sektöründe insan kaynağı diğer sektörlere göre daha fazla önem arz etmektedir. Katılım bankaları, finans sektöründe faaliyet göstermektedir ve sektör yetenekli işgücüne bağımlı olan bir örgüt yapısına sahiptir. Sektörün, potansiyeli yüksek ve yetenekli çalışanlara sahip olması ve büyüme hedefi olan bu sektörde çalışanları elde tutabilmesi de oldukça önemlidir. Bununla birlikte ülkemizdeki katılım bankalarında yetenek yönetiminin benimsenmesi ve uygulanması ile ilgili çalışmalara rastlanılmamıştır. Hazırlanan tez çalışmasında; öncelikle insan kaynakları yönetimi, stratejik insan kaynakları yönetimi ve yetenek yönetimi süreci ile ilgili literatür incelenerek gerekli kavramlar açıklanmıştır. Daha sonra, faizsiz bankacılık sistemi hakkında bilgi verildikten sonra; katılım bankalarının insan kaynakları politikalarıyla ilgili bilgilere yer verilmiştir. Son olarak, Türkiye'de katılım bankacılığı sektöründe faaliyet gösteren 2 si devlet ve 3 ü özel sermayeli olan toplam 5 katılım bankasında, nitel araştırma yöntemlerinden derinlemesine mülakat tekniği kullanılarak veriler toplanmıştır. Mülakatlar yetenek yönetimi yaklaşımının uygulayıcısı ve denetleyicisi olan insan kaynakları departmanlarında görevli yöneticilerle gerçekleştirilmiştir. Araştırmadan elde edilen bulgulara göre; özel sermayeli bir banka hariç diğer 4 bankada yetenek yönetimi uygulamamalarının istenilen seviyenin altında olduğu tespit edilmiştir. Özel sermayeli katılım bankalarının yetenek yönetimi ve alt boyutlarından faydalanma düzeyi kamu sermayeli katılım bankalarının bir hayli üzerinde olduğu tespit edilmiştir."
