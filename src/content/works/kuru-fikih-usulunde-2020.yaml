abstract: "Fıkhın ana kaynakları Kur'ân-ı Kerîm ve Sünnettir. Arapça olan bu iki kaynağın metinlerini yorumlama üzerine İslam düşüncesinde ilk devirlerden itibaren yazılar yazılmıştır. Nass dediğimiz bu iki kaynağın doğru anlaşılması için her şeyden önce Arap dili kurallarının iyi bilinmesi gerekir. Bütün dillerde kelimeler arasında bağlar kuran ve cümlenin anlam yüküne etki eden harf ve edatlar mevcuttur. Özellikle kendisinden hüküm elde edilen kaynak metinlerin anlaşılmasında bu edatların önemli bir işlevi vardır. Arapça da hurûfu'l-meânî, Türkçe de edat olarak isimlendirilen kelime öbekleri İslam Hukukçularının hükümlere ulaşmasında önemli bir rol oynamaktadır. İstisna edatlarının fıkıh usûlündeki yeriyle alakalı bu tezimiz bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde tezin konusu, amacı, önemi ile araştırmanın kaynak ve yöntemleriyle ilgili bilgi verilmektedir. Birinci kısımda istisnanın kavramsal çerçevesi çizilmektedir. İstisnanın tanımı, edatları, kalıpları, şartları, türleri, fıkıh usûlünde bağlantılı olan âmm, hâs, tahsis, nesih, kasr gibi konular işlenmektedir. Ayrıca tahsis ile nesihten farkları, istisnanın delaleti, konunun literatürdeki yeri işlenmiştir. İkinci kısımda ise istisna konusunda usulcüler arasında hangi konularda tartışmalar yaşanmış, bu konularla ilgili görüşler ve delillere yer verilmiştir. Üçüncü kısımda ise ikinci kısımda yer alan tartışmaların furu' fıkha yansımaları anlatılmıştır. Sonuç kısmında ise fıkıh usûlünde ulaştığımız sonuç ve tespitlere yer vermeye çalıştık."
