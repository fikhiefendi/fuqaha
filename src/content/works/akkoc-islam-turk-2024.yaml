abstract: "İslam hukukunda rüşvet suçu ta'zir cezası gerektiren suçlar kapsamında değerlendirilmektedir. Rüşvet kavramının net bir biçimde değerlendirilebilmesi için terim anlamlarının zaman içinde geçirdiği anlam farklılıklarını gözetmek gerekmektedir. Rüşvet kavramı erken dönemde elde edilmesi gereken mutlak menfaat olarak algılanmıştır. Daha sonraki dönemlerde kapsamı daralan bu kavram, kanunda suç olarak tanımlanmıştır. Suç olarak kategorize edilen rüşvet artık en geniş biçimde mutlak olarak elde edilen menfaat tanımını, haksız olarak elde edilen kazanca bırakmıştır. Rüşvet kavramının suç olarak nitelendirilmesinin akabinde doğal olarak kanuni, maddi, manevi ve hukuka aykırılık unsuru olarak dörde ayrılan suçun unsurları incelenmiştir. Suç olarak tanımlanan bir fiilin dış dünyada tezahürü suçun özel görünüş biçimleri bölümlerinde ele alınır. Söz konusu çalışmamızda teşebbüs, iştirak ve içtima olarak tasnif edilen suçun özel görünüş biçimlerini karşılaştırmalı biçimde inceledik. Bir fiilin suç kapsamında değerlendirilmesi için bünyesinde yapılmasına veya yapılmamasına dair mutlak bir emir barındırması ve bir müeyyide ile destekleniyor olması gerekmektedir. Kaynak bakımından müeyyideden bahsedebilmek için bir kanun koyucunun tespiti gerekmektedir. Söz konusu kanun koyucunun vaz' ettiği hükümlerin ulaşıldığı kaynaklar bizi hükmün dayanak noktasına götürmektedir. Biz de bu çalışmada rüşvet suçunun karşılaştırmalı hukuk bağlamında -İslam hukuku ve Türk hukuku- hukuki dayanaklarını incelemeyi uygun gördük. Rüşvet suçu ile alakalı araştırmalar mevcuttur. Ancak biz bu çalışmayı yaparken iki hukuk disiplini bağlamında söz konusu suçun detaylı bir mukayesesine rastlamadık. Zaman zaman rüşvet suçunu tek bir hukuk disiplini bağlamında inceleyen araştırmacıların diğer hukuk disiplinlerine atıflarına rastlasak da detaylı bir biçimde mukayesesine rastlamadık. Biz de söz konusu rüşvet suçunu detaylı bir biçimde her konu başlığı altında mukayese etmeye gayret ettik."
