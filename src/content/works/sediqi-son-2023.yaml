abstract: "Bu araştırmada; Hint alt kıtasında 19. yüzyılda yaşamış, burada Ehl-i Hadisin kurucu âlimlerden biri sayılan Sıddık Hasan Han'ın hayatı ve fıkhî görüşleri incelenmeye gayret edilmiştir. Sıddîk Hasan Han'ın yazdığı eserler ve te'lif ettiği konular incelendiğinde onun çok yönlü bir âlim olduğu tespit edilmiştir. İslamî ilim dallarının birçok sahasında kıymetli eserler kaleme almış; bunlardan 74'ü Arapça, 45'i Farsça ve 103'ü Urduca olmak üzere toplam 222 adettir. Bunlardan 25 tanesinin henüz neşredilmediği tespit edilmiştir. Sıddîk Hasan Han'ın önemli eserlerinin çoğu derleme, ihtisar(özet) veya çeviridir. O, özellikle Şevkânî'nin eserlerini özetlemiştir. Bu sebeple kendisini eleştirenler hep bu yüzden eleştirmişlerdir. Eserlerinde İngilizlere karşı cihada teşvik etmek, Vehhâbi mezhebini yaymaya çalışmak ve hanımının başını örtmeye zorlamak gibi sebeplerle İngilizler onu merkezi hükümete şikayette bulunmuşlardır. Bunun neticesinde İngiliz hükümeti, verdiği Nevvâb gibi ünvan ve lakabları kendisinden geri almış ve bir sene sonra hükümete girmesini de engellemişlerdir. Sıddîk Hasan Han'ın te'lif ettiği eserlerinde ehl-i hadis olma anlayışının da bir gereği olarak genellikle selefin görüşlerini nakil konusunda daha çok hassasiyet gösterdiği, buna mukabil mezheplerden de bağımsız olarak kendisinin istinbat ettiği bazı şahsına münhasır kanaat ve fetvalarının bulunduğunu söylemek mümkündür. Hocası Şevkânî'nin bıraktığı yerden o da mezheplere karşı duruşu devam ettirmiş olup bazen şaz görüş sayılabilecek uç görüşler de serdetmiştir. Hasan Han, en çok Ahmed b. Hanbel, İbn Teymiyye, İbn Kayyım, İbn Hacer el-Askalânî, Şâh Veliyyullah ed-Dihlevî, San'ânî, Şevkânî gibi âlimlerin görüşlerinden etkilendiği tespit edilmiştir. İlmî dirayetiyle ahkâm tefsirinde fıkhî konulara da açıklık getirmeye çalışmış olan Hasan Han, te'lif ettiği tefsirinde ayetleri izah ederken, Zemahşerî, Ebusuud ve hocası Şevkanî gibi âlimlerde daha çok görüleceği üzere sarf ve nahiv ilimlerinden yararlanmış kelimelerin değişik durumlara göre kazandığı manayı ve vezinleri ile kaide ve prensiplerini yer yer zikir ve beyan ettiği müşahade edilir. Arapça'daki derinliğine güvenerek bazen bir ayetin irabı ile ilgili farklı görüşleri naklettikten sonra onlardan birini diğerine tercih edebilecek dirayeti de gösterir. Sarf ve nahiv ilminin yardımıyla ayet ve hadislerden hüküm elde etme çabasında iken nassların i'rabının hükme etkisini göstermek için uzun izahlar yaptığı görülür. Sıddîk Hasan Han, meselelerin çözümünü ilk nesillerde olduğu gibi doğrudan Kurâ'n ve Sünnete başvurarak çözüme kavuşacağını düşünmektedir. Kur'ân ve Sünnet dışında başka delilleri şer'î delil olarak kabul etmez. İcmâ' ve kıyası reddeder. Fakat bazı yerlerde icmâ', maslahat ve örf gibi bazı delillerden kendisi de istifade eder. Fıkhî mezheplerin dörtle sınırlandırılması anlayışına karşıdır ve İbn Huzeyme, Süfyân es-Sevrî ve Taberî gibi mezheplerin de sünnete uydukları açıdan en az dört mezhep kader muteber olduklarını söylemiştir. Fıkhî meselelerde imam Ebu Hânife'nin görüşlerinin başka görüşlere tercih edilmesini doğru bulmaz. Fakat bazen kendisinin de Hanefî mezhebinin görüşünü başka mezheplerin görüşüne tercih ettiği olmuştur. Sıddîk Hasan Han, mezhepleri eleştirirken imam Ebû Hanife dâhil mezhep imamlarını eleştiri dışında tutmaya çalışmıştır. Aynı şekilde mezheplerin meydana gelmesinde de mezhep imamlarının bunda bir sorumlulukları olmadığını savunur. Sıddîk Hasan Han kendisinin herhangi bir mezhebe bağlı olduğunu kesin bir dille reddeder. Fakat genel olarak baktığımızda Selefî-Hanbelî geleneğine hatta Zâhirî mezhebine daha yakın olduğu, eserlerinde de bu doğrultuda kanaat belirtiği söylenebilir. ANAHTAR KELİMELER: İslam hukuku, Sıddık Hasan Han, Hindistan, Fıkıh"
