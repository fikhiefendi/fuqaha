abstract: "Nassları anlama yöntemi olan fıkıh usûlü ile aklın işleyiş yöntemini gösteren mantık ilmi arasındaki ilişkinin ele alındığı bu çalışma, giriş ve sonuç kısmı haricinde üç bölümden oluşmaktadır. Girişte araştırmada kullanılan metodoloji ile hareket noktası olarak seçilen Molla Fenârî hakkında bilgi verilmiştir. Tezin ilk bölümü fıkıh usûlü ile mantık ilmi arasındaki ilişkinin tarihi seyrine ayrılmıştır. İkinci bölümde bu ilişki tanım nazariyesi ekseninde ele alınmıştır. Son bölüm ise her iki ilim dalı için ciddi öneme sahip kıyâs konusuna hasredilmiştir.Çalışmadan elde edilen neticeler ise sonuç kısmında özetlenmiştir."
