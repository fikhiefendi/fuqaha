abstract: "Bu çalışmanın amacı, Etiyopya'daki finansal dışlanmayla mücadelede İslami finansın rolünü araştırmaktır. Bu doğrultuda çalışmada, Etiyopyalı Müslümanların dini esaslı finansal dışlanmasının kapsamı ve niteliği incelenmiş ve mevcut faizsiz bankacılık pencere sistemlerine katılım düzeyleri değerlendirilmiştir. Araştırma sürecinde veri toplamak için, anket ve yarı yapılandırılmış mülakatı içeren karma yöntem kullanılmıştır. Anketler, Etiyopya Addis Ababa'da yer alan 321 katılımcıya dağıtılırken, yarı yapılandırılmış mülakatlar ise yüksek rütbeli banka memurlarıyla yapılmıştır. Elde edilen bulgular, ankete katılanların sırasıyla %94.4, %87.2 ve %69.2'sinin kredi, mikro finans ve sigortaya erişimi olmadığını göstermektedir. Ek olarak, ankete katılanların %62.9'u toplu konut gibi ev finans programını hiç kullanmamış olduğunu belirtmiş ve din faktörü konvansiyonel finansal hizmetlere erişmemesi için ana faktör olarak ortaya çıkmıştır. Ayrıca, araştırmaya katılanların % 67.9'unun konvansiyonel bankaların sunduğu faizsiz bankacılık penceresi ürünlerine ve hizmetlerine erişmedikleri tespit edilmiştir. Bu bulgu potansiyel olarak yeni tanıtılan faizsiz pencerenin Etiyopyalı Müslümanları finansal sisteme dahil etmediğini ve başarısızlığa uğradığı anlamına gelmektedir. Etiyopya'da tam teşekküllü Şeriat uyumlu bir finans kuruluşunun bulunmaması, Etiyopyalı Müslümanların ülke ekonomisine dahil edilememesinin nedenini oluşturmaktadır. Bu nedenle, Etiyopya hükümetinin Müslüman nüfusun finansal sisteme olan ilgisini uyandırmasının gecikmiş bir görev olduğu ifade edilebilir. Ek olarak bunlarla sınırlı olmamak üzere; faizsiz banka, sigorta ve mikrofinans kuruluşları da dahil olmak üzere tam teşekküllü faizsiz finansal kurumların kurulması da gerekmektedir."
