abstract: "110Özetİslam hukuku içerisinde nafaka yükümlülüğü taraflararasındaki hukuki münasebet esasına göre düzenlenmiştir. İnsanhayatının devamı için gerekli olan iaşe, giyim, mesken vb. gibikonularda giderlerin ifadelendirilmiş hali olan nafaka, eşlerarasındaki birlik ve beraberliğin devamında ve aile topluluğununhuzur ve mutluluğunda çok önemlidir.İslam hukuku evlilik nafakasının tek borçlusu olarak kocayımükellef kılarken, günümüz hukuku (Türk Medeni Kanunu) kadınerkek eşitliği bağlamında kadını da evin geçimine ortak etmiştir.İslam hukukunda kadının evlilik nafakasını hak etmesi içingeçerli bir nikâha sahip olması yeterlidir. Evlilik nafakasının sonaermesi de boşanmayladır.İslam hukukundaki diğer bir nafaka çeşidi de hısımlıknafakasıdır. Hısımlık nafakası müşterek bir asılda birleşen ve civarhısımlar arasında mevzubahistir. Bunlar; anne-baba, kardeşler,kaçıncı kuşaktan olursa olsun dede-nine, amca, dayı, teyze, halave bunların çocuklarıdır.Hısımlık nafakası hısımlar arasında zengin olan akrabanınfakir olan akrabaya vermiş olduğu karşılıksız yardımdır. Hısımlıknafakası herhangi bir şeyin bedeli olmayıp, ihtiyaç ve zarurethalinde verileceğinden muhtaç durumda olmayan akraba nafakaisteme hakkı olamaz. Bu sebeple hısımlık nafakası ihtiyaç vezarurete binaen alacaklısına verilir."
