abstract: "Bu çalışmada, havâle konusunun Hanefî fürû literatüründeki gelişimi ele alınarak tarihsel süreç içerisinde havâle konusu içerisindeki farklılıkların tespit edilmesi amaçlanmıştır. İki bölümden oluşan bu çalışma kapsamında; ilk bölümde havâle konusunun eserlerdeki konumu ve havâle konusu içerisinde eserlerde ele alınan temel meseleler ve ikinci bölümde ise havâle konusunun eserlerde ele alınış yöntemleri ortaya konulmuştur. Havâlenin ticâri hayatta borç problemine çözüm bulmak noktasında önemli bir yere sahip olması sebebiyle konu, bu mesele üzerinden incelenmiştir. Kaynak olarak el-Asl, Şerhu Muhtasari't-Tahâvî, el-Mebsût, Bedâiu's-sanâi', Tebyînü'l-hakâik, Reddü'l-muhtâr ve Hukûk-ı İslâmiyye ve Istılâhât-ı Fıkhiyye Kamusu isimli eserler kullanılarak havâle konusuyla ilgili değerlendirmelerde bulunulmuştur. Sonuç olarak havâle konusunun zaman içerisinde yeni kavramlarla birlikte detaylandırılarak ele alındığı ve bunda etkili olan unsurların ise aradan geçen uzun zaman ve mekân farklılığı olabileceği değerlendirilmektedir."
