abstract: "Fâsıklar hakkındaki va`îd ayetlerinin âm oluşu, hicrî üçüncü asırdan sonra Mutezile'yi âm lafzın umûm anlamına delaletini öngören usul prensibini Ehl-i sünnet?in şiddetle karşı çıktığı, tövbe etmeden ölen fasıkların ebedî cehennem azabıyla cezalandırılacağı görüşünü destekleyen bir argüman olarak kullanmaya itmiştir. Zikredilen usul prensibinin Mutezile tarafından va`îd-i füssâk tartışmasında bir argüman olarak kullanılması, bunu fıkıh usulünün en tartışmalı konularından biri haline getirmiştir. Mutezilî eğilimlere sahip Irak meşâyihi, âmmın hakikat anlamı olan umûma delaletinin katîliğini ileri sürerken adı geçen itikâdî mezhebe karşı sert muhalefetiyle bilinen Semerkant meşâyihi mezkûr kelâmî görüşe götürmesi sebebiyle sözü edilen katîlik iddiasına karşı çıkmıştır. Âm lafzın delaleti hakkında sergilenen bu yaklaşım farkı, adı geçen gruplar tarafından, tutarlılık adına, va`îd-i füssâk meselesiyle doğrudan ilgili olmayan hâssın delaleti, emrin mûcebi, emrin tekrar/merre ve fevr/terâhî anlamları açısından delaleti, nehyin mûcebi ile zâhir ve nassın delaleti meselelerinde de sürdürülmüştür. Zikredilen tartışmalarda Irak meşâyihinin, şâriin muradını tespitte sîğayı kesin delil kabul eden yaklaşımına karşılık Semerkant meşâyihinin sîğayı şâriin muradını tespitte yeterli görmemesi ve lafzın anlamını belirlerken bunun yanı sıra hâricî bir karine olan ihtiyat prensibinden yararlanması, iki meşâyih grubunun bu tartışmaların etkilediği beyanın tehiri, âm ve hâssın tearuzu, nas üzerine ziyade ile haber-i vâhid ve kıyâsla tahsis meselelerinde de tartışmaların farklı taraflarında yer almalarına yol açmıştır."
