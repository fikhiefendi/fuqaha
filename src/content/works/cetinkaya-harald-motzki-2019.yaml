abstract: "Batı akademisine göre, günümüze kadar yapılan İslam araştırmaları incelendiğinde İslam hukukunun farklı bir önemi olduğu görülmektedir. İslam hukuk tarihi anlatımında ilk olarak klasik İslam hukuk usulünün tarih anlatımı benimsenmiş olsa da, Ignaz Goldziher (ö. 1921) ile birlikte bu anlatım kendini şüpheci yaklaşıma bırakmış ve Joseph Schacht (ö. 1969) ile birlikte Batı'da İslam hukukunun biçimlenmesi ve devamının gelmesine dair alternatif bir tez üretilmiştir. Bu tezin ciddiyet ile sorgulanması, kısmen değiştirilip kısmen terk edilmesi, çeyrek asır sonra Harald Motzki (ö. 2019) ile birlikte gerçekleşmiştir. Üç ana bölümden oluşan bu çalışmanın, ilk bölümünde Harald Motzki'nin entelektüel biyografisi ve eserlerinin tanıtımına yer verilmiştir. İkinci bölümde Batılı İslam araştırmacılarının İslam Hukukunun kaynaklarına yaklaşımları incelenmiş olup, Harald Motzki'nin bu konuya katkıları değerlendirilmiştir. Batı'da İslam hukuk tarihine yönelik geliştirilen tezlerin incelendiği üçüncü bölümde ise Harald Motzki'nin İslam hukuk tarihinin başlangıcına dair görüşleri değerlendirilmiş ve kendisinden önceki çalışmalarla karşılaştırılmıştır."
