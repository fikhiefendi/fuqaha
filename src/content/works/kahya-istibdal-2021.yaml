abstract: "İstibdal, vakfın mülk ile mübadelesi anlamına gelir. Vakıf kurumsal olarak bir malın ebediyen tedavülden alıkonulması fikri üzerine kurgulandığı için istibdal hem izahı oldukça güç hem de suistimale fazlasıyla açık bir hukuk kurumudur. Nitekim vakıfların iptaline giden yolda istibdalin nasıl araçsallaştırıldığı hakkında pek çok tarihi veri bulunur ve ilgili eleştirilerin odağında, istibdal kararı alma noktasında esas yetkili kabul edilen kadılar yer alır. Nihayet 951/1544-5 tarihli emr-i sultân ile Osmanlı Devleti'nde kadılar üzerinde bir denetim mekanizması geliştirilir ve vakıf akarı ilgilendiren istibdal kararları, sultanın iznine tabi kılınır. Meşrutiyet dönemi ve sonrasında ise şer'î yargıyı tamamen devre dışı bırakarak, Evkaf Nezâreti eliyle vakıfların nakit karşılığında istibdalini mümkün kılan yasalar çıkarılır. Parlamentonun varlığı, fıkhî olanın bazen karşısında bazen de yanında daha kuvvetli bir kanuni söylem geliştirilmesini ve böylece vakıf ıslahatlarına daha geniş bir faaliyet alanı açılmasını mümkün kılar. Bu ıslahatlar, cüz'î vakıfların yararını küllî vakfın yani Evkaf Hazinesi'nin yararı karşısında terk etme fikri üzerine kurgulanır. Geleneksel fıkhın araçlarıyla söylenmesi zor olan bu modern fıkıh çözümlemeleri ise halifenin tercihine yüklenen yeni anlamlar üzerinden meşrulaştırılmaya çalışılır. Kanunu ve fıkhı tek bünyede toplayan bu melez ve çok mezhepli hukuk düzeninin ya da yeni fıkhın yeni usulü de yazılır. Hukuk sisteminin merkezine yerleştirilen halife, mevzuatın bağlayıcılık karakterinin esas vericisi olarak sunulur."
