abstract: "\"Ehliyet\", hak, yetki ve sorumluluk sahibi olmak için elverişli olmayı ifade eden hukukî bir kavramdır. İslâm hukukunda insanın şahsiyeti gereği sahip olduğu ehliyet \"vücûb ehliyeti\", mümeyyizlik vasfına bağlı olarak kazandığı yetki ve yeterlilik de \"edâ ehliyeti\"dir. \"Ceza ehliyeti\", kişinin işlediği bir suç için sorumluluğa elverişlilik sahibi olması anlamına gelmektedir. İslâm, ceza düşüncesini ortaya koyarken insanları baliğ olanlar ve baliğ olmayanlar şeklinde ayırmaktadır. Çünkü kişinin biyolojik gelişimi ve aklî melekeleri birlikte gelişmektedir. Kişi, bulûğ çağında kazandığı akıl sayesinde olayları değerlendirebilmekte, davranışlarını şu veya bu şekilde yo nete bilmekte, hukuken suç kabul edilen ya da toplumca kınanan davranışlardan sakınabilmekte, bu davranışlardan sakınmadığında cezalandırılacağını bilebilmekte, cezanın vereceği elemi hissedebilmekte ve psikolojik olarak etkilenmek suretiyle ibret alabilmekte ve ıslah edilebilmektedir. Yani insan iradî bir eylemde bulunurken aklını kullanmaktadır. İnsanın irâde kudreti kelamî mezhepler arasında tartışmalara yol açan bir konu ise de, İslâm hukukçularının tamamı, eğer insan herhangi bir şekilde maddî ve manevî baskı altında değil ise, irâdesinin hür olduğu ve tercihlerini özgür olarak yapabildiği şeklinde düşünmektedir. Çünkü insanın irâde kudretine sahip olduğunu kabul etmeksizin onun cezaî sorumluluğunu izah etmek imkansızdır. İslâm düşüncesinde kişinin gerek dinî, gerekse medenî ve cezaî sorumluluğu sahip olduğu imkan ve kabiliyetle sınırlandırılmaktadır. Bu bakımdan İslâm hukukunda ehliyet ile sorumluluk arasında sıkı bir ilişki vardır. Bedenî cezalar açısından suçlunun âkil-bâliğ olması gerekli iken, malî sorumluluğun doğması için bunun gibi bir şart aranmamaktadır. Çünkü can ve malların dokunulmazlığı, İslâm hukukunun en önemli ilkelerinden birisidir. Kişinin suçlu sayılabılmesi için suç esnasında ehliyet sahibi olması gerekmektedir. Aynı zamanda kişinin savunma hakkını kullanabilmesi ve cezanın vereceği elemi hissederek ders alabilmesi için muhakeme ve infaz aşamalarında da ehliyet sahibi olması gerekmektedir."
