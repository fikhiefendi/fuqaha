abstract: "Çalışma, giriş, dört bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı ve tahkik-tahlil kısmında kullanılan önemli kaynaklar hakkında bilgi verilmiştir. Birinci bölümde müellifin ismi, doğumu, hastalığı, vefatı, ilmi kişiliği ve yaşadığı döneme dair bilgiler sunulmuştur. İkinci bölümde eserin genel bir tanıtımına yer verilmiştir. Bu bölümde ayrıca eserin ismi, müellife aidiyeti, eserin telif sebebi, eserde takip edilen yöntem, müellifin kaynak kullanımı ve dayandığı önemli kaynaklar, eserin yazılış üslubu, mevcut nüshaların özellikleri, metnin tahkikinde izlenen yöntem ve yazma nüshadan örneklere değinilmiştir. Üçüncü bölümde Türkiye'de ve İslâm âleminde kullanılan tahkik yöntemlerine istinat edilerek adı geçen eserin tahkik çalışması yapılmıştır. Çalışmamızda İslâm Araştırmaları Merkezi'nin (İSAM) tahkik konusunda belirlediği kurallar dikkate alınmıştır. Dördüncü bölüm, dört mezhebin kaynaklarına dayanarak adı geçen eserin tahliline ayırılmıştır. Sonuç bölümünde ise yapılan tahkik çalışmasından elde edilen sonuçlar özetlenmiştir."
