abstract: "Bu tez, İmam Şâfiî'nin önemli öğrencilerinden olan Ebu Yakub el-Büveytî'nin İslam hukuk düşüncesine katkılarını ve Batı'daki akademik çalışmalarda nasıl temsil edildiğini incelemektedir. Büveytî, hocası İmam Şâfiî'nin görüşlerini sistemleştirerek Şâfiî mezhebinin kurumsallaşmasında kilit bir rol oynamış, özellikle“el-Muhtasar”adlı eseriyle mezhebin temel fıkhî yapısının oluşumuna öncülük etmiştir. Bu çalışmada, Büveytî'nin ilmî kişiliği, usûl anlayışı ve eserleri klasik kaynaklar üzerinden ele alınmış; ayrıca modern Batı literatüründeki algısı, özellikle Wael Hallaq ve Ahmed Shamsy gibi çağdaş araştırmacıların yaklaşımları çerçevesinde değerlendirilmiştir. Batı'daki çalışmalarda Büveytî'ye dair ortaya atılan bazı metodolojik iddialara klasik kaynaklar üzerinden cevaplar verilmiş; Büveytî'nin Şâfiîliğin sistematik bir doktrine dönüşmesindeki yeri yeniden konumlandırılmıştır. Böylece çalışma hem klasik hem de modern literatürü bir araya getirerek Büveytî'nin İslam hukukundaki yerini bütüncül bir bakışla analiz etmeyi hedeflemiştir."
