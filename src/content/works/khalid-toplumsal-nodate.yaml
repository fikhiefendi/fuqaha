abstract: "Cinsiyet sınıflandırması yani kişilerin erkek ve kadın olarak ayrılması üreme sistemine göre belirlenmekte ve insanın biyolojik farklılıklarına dayanmaktadır. Ancak, Gender ideolojisi, bir toplumun inançlarının ve kültürel değerlerinin erkekler ve kadınlar arasındaki farklılıkları oluşturduğunu ve bu farklılıkların onların psikolojik durumlarını, statülerini ve kendilerine atanmış rolleri etkilediğini iddia etmektedir. Gender terimi söz konusu ideolojik hüviyeti kazanmadan önce de sosyoloji ve psikoloji ilimlerine dair çalışmalarda kullanılmıştır. Ancak, terim bir ideolojiye dönüşüp bazı yerel ve uluslararası yasalara ve düzenlemelere dahil edildiğinde toplumsal ve fikrî anlamda belli değişimlere sebep olmuştur. Nitekim Birleşmiş Milletler kuruluşları ve insan hakları örgütleri, bu ideolojiyi göz önünde bulundurmayan yasalarının değiştirilmesinin zorunlu olduğunda ısrar etmişlerdir. Daha sonra, bu yanılgılarını ileriye taşıyarak, İslam hukukunun bu ideoloji ve ilkelerine dayanarak yeniden şekillendirilmesini ve yeniden inşa edilmesini talep etmişlerdir. Bu çalışma, cinsiyetlerin biyolojik ve doğal yapılarının aile rolleri ve kendilerine atanmış sosyal işlevler üzerindeki etkisini vurgulamayı, aynı zamanda İslam hukukunun eril merkezli olduğu ve ataerkil bir ilkeye dayandığı iddialarının çürütülmesini hedeflemektedir. Çalışma, ilk bölümde tanımlayıcı analitik yönteme ve diğer bölümlerde eleştirel değerlendirme yöntemine dayanmıştır. Çalışmanın ulaştığı en önemli sonuçlardan biri, bu ideolojinin benimsenmesinin birey, aile, toplum üzerinde -inanç, yasalar ve kültüre dair- ciddi ve olumsuz etkileri olduğudur."
