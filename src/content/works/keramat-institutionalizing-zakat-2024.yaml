abstract: "Zekâtın Afganistan'ın yasal çerçevesinde kurumsallaştırılması, ulustaki sosyo-ekonomik kalkınma, yoksulluğun azaltılması, servetin yeniden dağıtımı ve sosyal adalet açısından önemli sonuçlar doğurmaktadır. Bu tez, zekatın Afganistan'ın yasal yapısına dahil edilmesinin ardındaki önemi, tarihsel bağlamı, mevzuattaki karmaşıklıkları ve zekat yönetimini çevreleyen çağdaş zorlukları derinlemesine incelemeye yönelik bir çabadır. Tez, çeşitli Müslüman ülkelerde geçerli olan zekat modellerini ve yasal çerçeveleri dikkatli bir şekilde inceleyerek organizasyon yapılarını, yasal yükümlülükleri, toplama metodolojilerini, dağıtım yöntemlerini ve zekat verebilirliği belirleyen koşulları incelemektedir. Bu tez, Afganistan'daki zekat yönetiminin mevcut durumunun ve Afganistan'da zekatın kurumsallaştırılmasının ardındaki zorunluluğun kapsamlı bir analizini sunmakta ve sağlam bir zekat yönetim sistemi oluşturmak için uygulanabilir öneriler sunmaktadır. Yetenekleri yüksek, bağımsız bir zekat yönetiminin kurulması, zekat kanunu ve ilgili düzenlemelerin çıkarılması, zekat konusunda kamuoyunun bilinçlendirilmesi ve zekat yönetiminde teknolojilerin kullanılması bu amaç için büyük önem taşımaktadır. Buna ek olarak tez, Afganistan'da merkezi bir Zekât yönetimi ve Zekât fonu kurulmasına yönelik zemini hazırlamayı amaçlayan bir dizi hazırlanmış öneri sunmaktadır. Bu tavsiyeler, zekat yönetiminin bağımsızlığının sağlanması, tüzel kişilik verilmesi, dijitalleşmenin benimsenmesi, güçlü personel alımının benimsenmesi, kapasite geliştirme girişimlerinin kolaylaştırılması, kapsamlı Zekât Kanunu ve ilgili düzenlemelerin yürürlüğe konulması ve Şer'i ilkelere bağlı kalınmasının zorunluluklarını vurgulamaktadır. Müslüman ülkeler ve topluluklar, yasal çerçeveler ve organizasyonel yapılar etrafındaki çeşitli Zekât modellerinden elde edilen bilgilerin bir araya getirilmesiyle bu çalışma, politika yapıcıları, akademisyenleri ve paydaşları, sosyo-ekonomik ilerlemenin ve kalkınmanın geliştirilmesinde Zekât kurumsallaşmasının temel rolü hakkında bilgilendirmeyi amaçlamaktadır. Afganistan'da toplumsal refah."
