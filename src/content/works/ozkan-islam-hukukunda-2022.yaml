abstract: "Bu tez, alacaklının alacağını elde etmek üzere borçluya ait alacakla alakası bulunan malı teslimden kaçınarak elde tutma yetkisi veren hapis hakkını Hanefi mezhebi özelinde incelemektedir. Hapis hakkı alacağı güvence altına almayı amaçlar ve Türk hukuk doktrininde incelenip teorik biçimde ele alınırken, Hanefi mezhebi füru fıkıh külliyatında münferit olaylar içinde yer almıştır. Çalışmamızda Hanefi mezhebi kaynaklarında hapis hakkına dair olan meseleler başlangıç noktası kabul edilip incelendikten sonra Türk hukukunda eşya hukukuna dair yazılan eserlerin hapis hakkını değerlendirirken takip ettikleri sistematikten faydalanılarak mezhep içinde teorik bir çerçeve oluşturulmaya çalışılmıştır. Hapis hakkı Hanefi literatürde yer yer rehin ile birlikte anılmıştır. Türk hukukunda ise rehinin yanında alıkoyma hakkı, ödemezlik def'i ve takasın hapis hakkı ile yakın tasarruflar olduklarına değinilmiştir. Hanefi fukaha hapis hakkını, günümüz hukukunda aynî hak olarak ifade edilen milkin bir türü olarak değerlendirmiştir ve onlara göre hapis hakkının ileri sürülebilmesinin temel amacı, bir borç ilişkisinde alacaklar arasında teslim etme ve teslim alma hususundaki dengesizliğin giderilmesidir. Bu amacın hapis hakkını mümkün kılabilmesi için, borç ilişkisindeki edimlerin mahiyetlerinin farklı olması, dengesizliğin aleyhinde kurulduğu tarafın borçluya ait mala haklı zilyet olması, zilyet olduğu bu mal ile alacak arasında bağlantı bulunması ve alacağının muaccel olması şartlarının yerine gelmiş olması gerekir. Sözü edilen bu amaç ve şartların gerçekleşmesi durumunda Hanefi mezhebinde satım, icare, şüf`a, vekalet ve nikah akitlerinde, lukata, gasp ve vediada hapis hakkı ileri sürülebilir. Hapis hakkı ileri sürülürken doğurduğu bazı hükümler vardır. Buna göre, hapis hakkına sahip olan taraf karşı tarafı borcun ifasına zorlamak ve alacağını temin edebilmek için malı alıkoyma yetkisine sahip olurken bazı durumlarda bu malı sattırıp alacağını bedelinden temin etme hakkı da vardır. Hapis hakkı verdiği yetkilerin yanında sahibine, malı muhafaza sorumluluğu da yükler. Hapis hakkı sona erene kadar bu hükümler devam eder. Hanefi mezhebi füru fıkıh kaynaklarına göre hapis hakkı müstakil bir hak olmayıp bir alacağa bağlı olarak ortaya çıktığından bu alacağın sona ermesiyle hapis hakkı sona erer. Bunun yanında başlangıçta muaccel olduğu için karşılığında hapis hakkı kurulabilen borcun/deynin daha sonra vadeli olması kabul edilirse şartlardan biri artık bulunmadığı için hapis hakkı sona erer. Hapis hakkının doğduğu borç ilişkisinde belirli durumlarda yapılan havale bu hakkı düşürebilir. Aynı zamanda hapis hakkı Hanefi fukaha tarafından zayıf bir hak olarak görüldüğü için alacaklının hapis konusu mal üzerindeki zilyetliğini rızasıyla kaybetmesi de hakkın sona ermesiyle sonuçlanır."
