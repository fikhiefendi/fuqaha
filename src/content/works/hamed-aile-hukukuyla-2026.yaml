abstract: "Fıkıh usûlü ilmi, vahyin ilk anlarından itibaren ortaya çıkmıştır. Sahâbiler ve onları takip edenler, Allah'ın (cc) muradını anlamaya ve şer'î hükümleri vahiy metinlerinden çıkarımına büyük önem vermişlerdir. Bu süreçte Arap dili, belâgatı ve ifade üslupları ile birlikte, ilâhî hitabı anlamanın temel vasıtası olmuş içerdiği delâlet ve anlamları kavramada anahtar rol oynamıştır. Bu bağlamda usûl ilmi, bu dilin inceliklerini incelemek, yapısal unsurlarını analiz etmek ve ondan hüküm çıkarma kaidelerini ortaya koymak üzere teşekkül etmiştir. Bu çalışma, fıkıh usûlünün önemli meselelerinden biri olan lafzî delâlet ve lafzın kullanıldığı anlamı ifade etme şeklini ele almakta şer'î metinlerden anlam çıkarma, metnin maksadını anlama ve ondan hüküm istinbât etmede temel bir araç olan lafzî delâlet konusunu incelemektedir. Araştırma, Hanefîlerin esas aldığı dört temel delâlet üzerine yoğunlaşmıştır: İbârenin delâleti, işâretin delâleti, nassın delâleti ve iktizâ delâleti. Bunlar, mütekellimûn usûlcülerinin mantûk ve mefhûm şeklindeki iki temel delâlet ayırımına karşılık gelir. Mütekellimûne göre mefhûm, mefhûm-i muvâfakat ve mefhûm-i muhâlefe olmak üzere ikiye ayrılır. Bu araştırma, lafzî delâletlerin fıkhî hükümleri anlama üzerindeki uygulamalı etkisini vurgulamayı amaçlamakta, aile fıkhına dair Kur'ân-ı Kerîm'den seçilen âyetlerin usûlî ve dilbilimsel analizine dayanarak detaylı çözümlemeler sunmaktadır. İlk bölümde, lafzî delâletin taksimi ve lafzın kullanıldığı anlamı ifade etme yolları hakkında, önce Hanefîlerin sonra da mütekellimûn ekolünün yöntemleri açıklanmıştır. İkinci bölümde ise evlilikle ilgili âyetler usûlî delâletler açısından tahlil edilmiş; evliliğe teşvik, evliliğin hakikati ve mecazî yönü, lafızların anlam belirlemedeki rolü, eşler arası ilişki, ailenin korunması ve yönetimi, anlaşmazlıkların çözümü ve hakem tayini gibi hususlar ele alınmıştır. Üçüncü bölümde ise boşanma âyetleri ve bunlardan çıkan hükümler incelenmiştir. Bu kapsamda boşanmanın meşruiyeti, sünnî ve bid'î boşanma ayrımı, boşama sayısı, ric'î, ve bâin boşanma, iddetin türleri (ric'î, bâin, aylar üzerinden, adet üzerinden, vefat hâlinde), ayrıca boşanmaya yol açabilecek zıhâr, hul', îlâ ve li'ân gibi meselelere dair ayetler delalet şekli bakımından ayrıntılı şekilde ele alınmıştır. Tüm bu âyetler, lafzî delâlet yönünden detaylı biçimde analiz edilerek, şer'î hükümlerin; lafzın anlamı, bağlamı ve yerinden nasıl elde edildiği gösterilmiş; farklı mezheplerin ve fakihlerin bu delâletlere yaklaşımları açıklanmış ilgili hükümler, delâleti kabul eden ve etmeyenlerin gerekçeleriyle birlikte ortaya konulmuştur. Nihayetinde, söz konusu delâletin hüküm çıkarımındaki etkisi ortaya konularak fıkhi açıdan incelenmiştir. Bu yönüyle fıkıh, Kur'an-ı Kerim ve sahih hadislerde karşılığını bulan vahye dayanmaktadır. Fıkıh için temel kaynak, mutlak şarii (kanun koyucu) olan Allah'ın hükümlerinin bulunduğu Kur'andır. Müçtehitlerde ortaya çıkardıkları hükümlerin delillendirilmesi işleminde ilk önce Kur'an-ı Kerim'e başvurmuşlardır. Böylece Kur'an-ı Kerim'deki ahkam ayetlerinin doğru şekilde anlaşılması hususu fakihlerin birinci önceliği olmuştur. Bizde bu çalışmamızda Aile hukuku ile alakalı ahkam ayetlerini lafızların manaya delaletleri bakımından incelemeye çalışılacaktır."
