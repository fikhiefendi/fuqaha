abstract: "Bu tez, Bedreddin el-Ayni'nin“el-Binaye Şerh el-Hidaye”adlı eserinde benimsediği fıkıh metodolojisini ortaya koymayı amaçlamaktadır. Söz konusu amacı gerçekleştirmek için, Ayni'nin dayandığı fıkıh ve usul kaynakları izlenecek ve onun“el-Hidaye”metnini açıklamak için kullandığı yöntem incelenecektir. Bu meyanda tez Ayni'nin fıkıh âlimlerinin görüşlerini nasıl sunduğunu ve tartıştığını, belirli bir fıkıh ekolünü, özellikle Hanefi mezhebini savunmak için kullandığı yöntemi, bu mezhebin görüşlerine karşı yöneltilen şüpheleri giderme ve itirazları cevaplamadaki yaklaşımını ele almaktadır. Tezde ilk olarak, Burhaneddin el-Merginani ve“el-Hidaye Şerh Bidayeti'l-mübtedi”adlı kitabı tanıtılmaktadır. el-Merginani'nin mezhep içindeki yeri ve önemi üzerinde durulmakta ve onun hakkında alimlerin ifade ve değerlendirmelerine dayanılarak Hanefi hukukçular arasındaki yeri aydınlatılmaktadır. Daha sonra, Hanefi eserleri arasında“el-Hidaye”nin önemli statüsü vurgulanmakta ve Hanefi alimlerinin şerh, haşiye yazma ve hadislerinin tahrici yoluyla ona gösterdikleri yoğun ilgi ayrıntılı olarak açıklanmaktadır. Bunun ardından Bedreddin el-Ayni tanıtılıp biyografisi ele alınmakta, Ayni'nin hocaları, öğrencileri ve eserleri hakkında bilgi verilmekte, fıkıh ve diğer alanlardaki ilmî katkıları ve âlimlerin onun hakkındaki övgüleri ortaya konulmakta ve Hanefi hukukçular arasındaki yeri tespit edilmektedir. Sonra, özellikle Ayni'nin eseri“el-Binâye”nin önemi ortaya konulmakta ve Hanefi fıkıh âlimlerinin bu esere olan ilgisi ve onu değerli bir kaynak olarak benimsemesi kanıtlanarak eserin mezhep içindeki yeri ve etkisi belirlenmektedir. Daha sonra, el-Ayni'nin Binaye'de izlediği metodoloji incelenmeye devam edilerek önce eserin telif tarzı, kompozisyonu ve konuların tertibinde izlediği sistematiği ele alınmakta, böylece önce kitabın şeklî, biçimsel yönleri incelenmektedir. Sonra, Ayni'nin Binaye'de fıkıh meselelerini delillendirme, istidlal metodu, fakihler arasındaki ihtilafları sunma ve farklı görüşlerin delillerini tartışma yöntemi, daha güçlü bulduğu görüşü tercih etme süreci ve güçlü görüşe yöneltilen şüpheleri giderme ve itirazları cevaplandırma, karşı görüşün zayıflıklarını ortaya koyma aşamalarındaki yaklaşımı incelenerek eserin muhteva ve metot yönünden analizi yapılmaktadır. Bunu takiben, Ayni'nin dayandığı usûlî deliller ve alıntı yaptığı fıkıh kaynakları belirlenmektedir. Bu bölümde, tearuz eden deliller karşısında Ayni'nin takip ettiği tercih yöntemleri ve kuralları tespit edilmeye çalışılmaktadır. Bu yöntem ve kuralların pratik şekilde anlaşılmasını sağlamak için tartışılan pratik örneklere yer verilmiştir. Sonuç kısmında tez boyunca yapılan araştırmalar neticesinde ulaşılan en önemli ilmî tespit ve bulguların özeti ve İslami bilimler alanında araştırmacılar için faydalı, yol gösterici olacağına inandığımız bir takım öneriler sunulmaktadır."
