abstract: "Bu çalışmada, Türkiye Din İşleri Yüksek Kurulu'nun, 2018 ve 2025 basımlı“Fetvâlar”adlı eserinde, kadınlarla ilgili verdiği bazı fetvȃların analizi yapılarak, klasik kaynaklarla uyumluluğunun ve güncelliğinin tespit edilmesi amaçlanmıştır. Bu bağlamda, klasik kaynakların yanında çağdaş literatürden ve uzman görüşlerinden yararlanılmıştır. Din İşleri Yüksek Kurulu, fetvâlarını genel olarak klasik kaynaklarla desteklemiş, zaman zaman da görüşler arasında tercihlerde bulunmuştur. Kurul, zaman zaman uzman görüşüne atıf yaptığı halde, uzman görüşlerine birebir yer vermemiştir. Tezde, uzman görüşlerinin katkısı olacağı düşünüldüğü yerlerde, uzmanlarla görüşülerek fetvâlarda güncellemelere yer verilmiştir. Bu bağlamda, uzman görüşü dikkate alınarak reglin hafif kanama ile başlayacağı, azami süresinin ise on gün olması gerektiği belirlendi. Kurul'un aynı anda söylenen üç talâkı tek talâk kabul ettiği, günümüz şartlarıyla bu görüşün uyumlu olduğuna değinildi. Kurul, resmî nikâhı bulunmayan yalnızca dini nikâhla evli olan bir kadının boşanması hususunda, Osmanlı Hukûk-ı Âile Kararnâmesinin görüşünü benimseyerek, hakemler aracılığıyla boşanmayı tavsiye ettiği, taraflardan birisi hakem tayinine yanaşmazsa, o taraf için de adil ve güvenilir bir hakem seçilerek bir sonuca gidilmesi yönünde bir çözüm geliştirdiği tespit edildi. Kurul'un, hayatta mal dağıtımı yapılırken, erkek-kız çocuk ayımı yapılmamasını tavsiye ettiği, tıbbî gereklilik dışında estetik yapılmasının uygun olmayacağını belirttiği, özel durumlar dışında kürtaja izin vermediği de görülmektedir."
