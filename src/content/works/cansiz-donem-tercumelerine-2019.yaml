abstract: "Tarihî süreç içerisinde Kur'ân, çeşitli dillere olduğu gibi Türkçe'ye de tercüme edilmiş; bu tercümelerin sayısı Cumhuriyet döneminden itibaren yüzlerle ifade edilir olmuştur. Muhammed Esed ve Mustafa İslamoğlu tarafından hazırlanan“Kur'ân Mesajı”ve“Hayat Kitabı Kur'ân”adlı meal-tefsirler de bu tercümeler arasında yer almaktadır. Söz konusu iki eserin mukayese edildiği bu çalışmada; eserlerin üslûp, yöntem ve kaynakları incelenmiş; çeşitli kavram ve deyimlerin çevirileri ve muhtelif konulara müelliflerin yaklaşımları mukâyese edilerek, eserler arasındaki benzerlikler ve farklılıklar ortaya konulmuştur. Özellikle müelliflerin yoğun eleştirilere maruz kaldıkları sembolik/bâtınî yaklaşımları, olağanüstü sayılabilecek durumları aklî zemine taşınma gayretleri ve gelenekten ayrıldıkları hususlar ele alınmış olup müellifler arasındaki etkileşimin boyutları tespit edilmeye çalışılmıştır."
