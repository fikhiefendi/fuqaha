abstract: "QZEI İslam dininde faizin yasak olması nedeniyle, faizle şa şmayan ekonomik kurumlara ihtiyaç duyulmuştur.Bu ekonomik kurul arın başında da faizsiz bankacılık sistemi gelmektedir. Ülkemiz ik bir yapıya sahiptir ve tam anlamıyla faizsiz bankacılık sis- minin yürütülmesi olanaksızdır. Bu nedenle, ülkemizin ekonomik pısma uygun olarak özel finans kurumları adı verilen bir model taya konmuştur. Çalışmamızın birinci bölümünde, faizsiz bankacılık, amaç politikalarıyla ortaya konularak sistemin dayandığı finansman rleri ve dış ticaret işlemleri tanıtılmıştır. İkinci bölümde ise faizsiz bankacılık sisteminin işleyişi e bankacılık işlemleri açıklanarak faizsiz bankacılık sisteminin ağladığı değişik hizmet ve kolaylıklar ortaya konmuştur. Üçüncü bölümde ise faizsiz bankacılığın Türkiye'deki işle- şi ve bu sisteme yöneliş nedenleri incelenmiştir. Ayrıca Türk ban-.a sistemine göre elde ettiği haksız rekabet unsurları ile ülkemiz conomi ve bankacılığına getirdiği olanaklar açıklanmıştır. Ülkemizde faaliyette bulunan özel finans kurumları, banka cılık sektörü ile şu anda rekabet edecek düzeyde değildir. Topladı- fonlar, banka mevduatları arasında küçük bir tutarı oluşturmakta- lır. Böylece ekonomik açıdan banka sistemini zedeleyici değil, bü tünleyici yönden desteklemektedir. Kurumlar getirdikleri finansman yöntemleri ve imkanlarıyla iiş ticaret alanında öncülük etmektedirler. Orta -Doğu ülkelerinde etrol gelirleri dolayısıyla fon fazlalıkları bulunmaktadır. ülkemiz se gelişmekte olduğundan sermaye kıtlığı çekilmektedir. Bu fonların lkemize çekilmesinde faizsiz bankacılık sistemi bir köprü görevi mpacaktır. Belirlenen hedeflerle yatırımlara yönelindiğinde ekono- ıimize ve bankacılığımıza büyük yararlar getireceği ortaya çıkacaktır"
