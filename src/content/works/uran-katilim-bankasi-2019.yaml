abstract: "Katılım bankalarında hizmet kalitesi, müşterilerin beklentilerini sağlayabilme yeteneği olarak önemli bir kavram şeklinde ön plana çıkmaktadır. Bundan dolayı katılım bankalarında hizmet kalitesi, müşterilerce algılanan performans seviyesi veya hizmetlerin müşterileri tatmin edebilme seviyesi olarak ifade edilmektedir. Hizmet kalitesinin ölçülmesi ve ortaya konması katılım bankalarının rekabetçi piyasa koşullarında avantaj sağlamalarına yardımcı olmaktadır. Bu çalışmada örneklem içerisindeki katılım bankası müşterilerinin bankalarının hizmet kalitesine yönelik algılarının belirlenmesinde literatürde geçerliliği kabul edilmiş olan servqual hizmet kalitesi ölçeği kullanılmıştır. Ölçeğin katılım bankacılığına uyarlanması ile oluşturulan anket aracılığıyla veriler toplanmış ve elde edilen veriler SPSS 24.0 programında analiz edilmiştir."
