abstract: "Bu çalışma 4 numaralı Uşak Şer'iyye Sicili'nin değerlendirilmesi ve transkriptinden oluşmaktadır. Bununla birlikte elde ettiğimiz verileri kullanarak, defterin hazırlandığı sırada dönemin Uşak ekonomisine dair değerlendirmeler de yapılmıştır. Bu verileri temel alarak, toplumdaki borçlanmaları ve Müslüman, gayrimüslim arasındaki borç trafiği detaylandırılmış ve aktarılmıştır. Giriş bölümünde Uşak'ın köyleri, Uşak'ta kullanılan unvanlar, Uşak coğrafyası ve tarihi konu edilmiştir. Birinci bölümde ise Uşak ekonomisi incelenmiş ve Uşak'ta paranın el değiştirmesi üzerinde durulmuştur. Bu kısımda paranın el değişimi detaylı bir şekilde tablolar vasıtasıyla ortaya konulmuştur. Bunlar arasında Müslümanların kendi aralarında ve gayrimüslimler ile yaptığı borçlanma ayrıca gayrimüslimlerin kendi aralarında ve Müslümanlar ile yaptığı borçlanmalarda vardır. Ve yine her başlık altında elde edilen toplam veriler ayrı olarak aktarılmıştır. İkinci bölümde 4 Numaralı Uşak Şer'iyye Sicili'nin transkripti yer almaktadır. Sonuç bölümünde ise aktarılan tüm veriler topu bir şekilde değerlendirilmiştir. Bunun yanı sıra Müslüman ve gayrimüslim arasındaki denge aktarılmış, borç alış-verişindek rolleri ortaya konulmuştur. Bu çalışmanın temel amacı Uşak'ın iktisadi durumunun aydınlatılmasına katkı sağlamaktır."
