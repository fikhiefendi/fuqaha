abstract: "Resmi devlet görevlileri tarafından oluşturulan Şerʻiyye sicilleri, Osmanlı Devletiˈnin tarihi, siyasi, hukuki, idari, mali, dini ve askeri alanlarda incelenmesi ve araştırılmasında birinci elden kaynak niteliğindedir. Bu çalışma Hicri 1065-1067/Miladi 1655-1657 yılları arasını kapsayan“1835/21 Numaralı Trabzon Şer'iyye Sicili”'nin transkripsiyonu yapılarak sicilde yer alan belgeler doğrultusunda sicilin tutulduğu yıllar aralığında Trabzon'daki sosyal, kültürel, ekonomik ve idari yapı değerlendirilmeye çalışılmıştır.Birinci bölümde Osmanlı öncesi ve sonrası Trabzon tarihi hakkında kısa bilgi verilmiştir. İkinci bölümde, söz konusu defterde geçen bilgiler tahlil edilerek burada geçen bilgilere göre değerlendirme yapılmıştır. Üçüncü bölümde ise 1835/21 numaralı Trabzon şer'iyye sicilinin transkripsiyonundan örneklere yer verilmiş ve bunun özeti hazırlanmıştır."
