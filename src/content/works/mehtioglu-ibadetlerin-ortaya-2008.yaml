abstract: "Biz bu çalışmamızda namaz, oruç, hac, zekât, kurban vs. gibi ibadetlerin, Kur'an'da ortaya çıkışını, çeşitlenmesini ve fıkhî bakımdan hükümlerini ortaya çıkarmaya çalıştık. Bu ibadetleri ele alırken başta her ibadetin mahiyetine, tarihçesine, varsa çeşitlerine, Kur'an'dan delillerine ve fıkhî bakımdan hükümlerine ulaşmaya çalıştık. Ayrıca ibadetlerin tarihi gelişimini araştırırken Hz. Peygamberin dönemine inerek bu ibadetler o dönemde Hz. Peygamberin müdahalesiyle, düzenlemesiyle nasıl en son halini aldı ve kendi hayatında bunları ne zaman sistemli (düzenli) bir hale soktu ve nasıl uygulardı vs. gibi sorulara da cevap aramaya çalıştık. Yani araştırmamızda Kur'an'daki ibadetleri Hz. Peygamberin hayatına yerleştirirken bir bakıma onun ibadet hayatıyla birlikte, deyim yerinde ise ibadetlerin sîretini oluşturmaya çalıştık."
