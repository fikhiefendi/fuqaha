abstract: "İnsanın fıtratındaki güzelliğe meyil ve süslenme arzusu, her zaman, mekân ve alanda kendisini göstermektedir. Yüce Allah birtakım kurallar dâhilinde yarattığı zînetlerin helâl olduğunu bildirmiş ve cenneti hak eden kullarına ebedî hayatlarında da altın, gümüş ve inci gibi değerli madenlerden süsler vaad etmiştir. Kişiyi ve muhataplarını öncelikle psiko-sosyal ve iktisadî açıdan etkileyen süslenme, aile ve cemiyeti de etkilemektedir. Kişinin ferdî ve içtimâî hayatını; dünya ve ahiretini yakından ilgilendiren bu konuyu, Şâri'in maksadına göre anlamaya çalışmak, çağın şartlarına uygun ve ihtiyaçları karşılayacak biçimde açıklamak büyük bir önem arz etmektedir. Özellikle günümüzde sürekli değişen moda ve güzellik algısıyla süslenme ve süsleme daha çok özenti ve taklitle yapılır hale gelmiştir. Oysaki fıkha göre süslenmenin, temizliğe, sağlığa ve sadeliğe uygun, riya ve kibir gibi kötü duygulardan uzak, israf sayılmayacak ve ihtiyaçla da ilgili genel kuralları vardır ve bunlarla süslenmeye bir ölçü getirilmiştir. Ayrıca fitrî yapıları başta olmak üzere çeşitli durumlarına göre kişilerin süslenmelerine sınırlar koyulmuş; helâller ve haramlar dairesinde değerlendirmeler yapmıştır. Fıkıh bilginleri süslenme konusunu çeşitli vesilelerle ele almışlar; daha çok“kerâhiyyet”, el-hazar ve'l-ibâhe gibi bölümlerde incelemişlerdir. Çeşitli açılardan konu ile ilgili özel çalışmalar da yapılmış ve hâlen yapılmaktadır. Ancak bilinebildiği kadarıyla fikhî yönüyle süslenmeyi inceleyen müstakil bir çalışmanın bulunmaması sebebiyele böyle bir araştırmaya ihtiyaç duyulmuştur. Süslenmenin diğer alanlarla ilgisi ve çağın süslenme usulleri de dikkate alınarak süslenmenin fıkhî çerçevesi ortaya koyulmak üzere“İslam Hukuku Açısından Süslenme Olgusu”adlı bu yüksek lisans tezi hazırlanmıştır."
