abstract: "Belirli bir fenomenin özünü inceleme ve problemini ve yöntemini bilme konusunda teşhis koyma yeteneği çok kolaydır, ancak dini ve hukuki yönlerin, bilim adamlarının görüşlerinin ve bir fenomeni incelemek için kolektif çerçevede sürekli ve ardışık okuma, pozitivist tarafın müdahalesi, çalışmayı çok zor ve karmaşık yapan şeylerdir. Bankaların İslam dünyasına girmesinden bu yana toplumumuzda giderek artan bir önem kazanmaktadır, çünkü bankalar toplumun ekonomik gücüne bir rehber ve ülkeler tarafından zorlukların üstesinden gelmek için formüle edilen genel bir yaklaşım haline gelmiştir. Bu nedenle bankacılık faaliyetlerinin daha fazla artması, devletin ekonomik durumuna ve genel bütçesine o kadar olumlu yansır ve böylece ülke insanının daha fazla refaha kavuşmasına neden olur. Dolayısıyla ülkeler, finansal kurumlarını ve bankalarını takip etmeye, ekonomik hedeflerine ulaşmak için finans ve para politikaları oluşturmaya çalışırlar. İslami bankalardaki sınırlı finansman kaynakları, yasaklı ve izin verilen sahanın hukuki yönü açısından uzmanlar arasında tam bir netliğin olmaması mudaraba sözleşmesindeki taraflar arasında kâr unsurunun netliği problemin kaynağını oluşturmakta olup, bu açıdan çalışmamız bu problemin araştırılması üzerine yoğunlaşmaktadır. Finansman aracı olarak mudaraba sözleşmesindeki taraflar arasında kâr unsurunun net bir şekilde ortaya konulması gerekmektedir. Sözleşmenin unsurlarından olan sermaye ve emeğin bir araya gelmesiyle helal para kazanmadaki benzersiz avantajların ortaya konulması çalışmamızın önemini ortaya koymaktadır.Araştırmacı çalışmasını farklı mezheplerin görüşlerini mudarabah sözleşmesi çerçevesinde incelemiş, tartışmalarını yapmış, çözüm yollarını ortaya koymaya çalışmıştır. Bu çerçevede İslami bankaların, özellikle Irak İslami bankalarının gelişimi incelenmiş, çalışma sahaları ortaya konulmuş, tanıtılmaya çalışılmıştır. Genelde İslami bankaların, özelde Irak'taki İslami bankaların uygulamada karşılaştıkları problemler göz önüne serilmeye çalışılmış ve çözüm yolları ortaya konulmaya çalışılmıştır. Bunu yaparken gerek bankaların dökümanlarından gerekse fakihlerin, âlimlerin ve teorisyenlerin çalışma ve kitaplarından yararlanılmıştır."
