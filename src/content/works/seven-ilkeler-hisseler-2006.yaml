abstract: "ABSTRACTTHE FOUNDATIONS OF ISLAMIC LAW OF INHERITANCEFROM THE RESPECT OF PRINCIPLES AND LOTSIslamic legal system recognizes for man property right. Acknowledgedforemostly by the Qur'an, this right is emphasized in the Islamic regulations ofinheritance, too. The Qur'an and the hadiths refer to lots of heirs as ?farÄid?,which means ?a precisely defined thing.? The two sources of Islam determinedhow much every heir will receive from the goods left by the dead person. Thisstudy aims at investigating whether these regulations allow for any change andalteration.In Introduction, I discussed the method and the importance of this study.In the first chapter, I outlined the general principles of Islamic law ofinheritance. Under this title, I examined why the lots that heirs receive aretermed as ?farÄid? and investigated the ramifications of this terming. I came toconclusion that this character of Islamic law of inheritance does not allow for thedistribution of lots based on mutual consent as it is a strictly defined way ofacquiring possession. I also found out that a person cannot disinherit his/herheirs of their lots and the heirs are responsible for the debt of the dead person asmuch as the amount of his inheritance. I also discovered that the Islamic law ofinheritance followed a gradual process of development.In the second chapter, I examined the fixed lots that any relatives receive and thereligious texts that regulate the distribution of the lots. It is known that next ofkin's lots are determined by the Qur'an and the Sunnah. However, I tried toexpose that the learned companions of the Prophet also contributed to theformation of the Islamic law of inheritance. The legal method of syllogism is usedin this branch of Islamic law though quite limited with respect to other branches.Therefore, one should not take the statements in the classic legal texts in thesense that there is no room for syllogism in the Islamic law of inheritance.Rather, such statements simply inform that syllogism was rarely used. However,I observed that the companions applied syllogism in determining both the classof heirs and the amount that any heir receives.In the chapter of conclusion, I briefly discussed the fact that no fundamentalchange can be made on the Islamic law of inheritance and the heirs cannot makea distribution of lots with their wish and mutual consent. Such a change is notallowed by the religious texts. In addition, the scholars of Islamic law did notspeak of the possibility of such changes.Mehmet Seven"
