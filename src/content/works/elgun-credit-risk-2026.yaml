abstract: "Bu tez çalışması, Türkiye'de 2016Q3–2024Q4 dönemine ait verilerle seçim dönemlerinin bankacılık sektörü üzerindeki etkilerini kredi büyümesi ve aktif kalitesi (NPL) üzerinden incelemektedir. Politik İş Döngüleri yaklaşımı çerçevesinde, mülkiyet yapısı (kamu-özel) ile bankacılık modelinin (katılım-konvansiyonel) seçim dönemlerinde banka davranışlarını nasıl etkilediği karşılaştırmalı olarak analiz edilmiştir. Literatürde çoğunlukla kamu-özel ayrımı öne çıkarken, bu çalışma kamu ve özel katılım bankaları ile kamu mevduat bankalarını birlikte değerlendirerek katılım bankacılığına özgü yönetişim mekanizmalarının politik etkileri sınırlayıp sınırlamadığını da tartışmaktadır. Analizde sekiz bankaya ait üç aylık veriler ve makroekonomik göstergeler kullanılmıştır. Ayrıca, yatay kesit bağımlılığı ve otokorelasyon sorunlarını dikkate almak için Driscoll–Kraay dirençli standart hataları tercih edilmiştir. Seçimlerin kredi büyümesi üzerindeki eş zamanlı etkisi ile NPL oranları üzerindeki gecikmeli etkileri (t-1, t-2, t-3) test edilmiştir. Bulgular, seçim etkilerinde belirleyici unsurun iş modelinden çok mülkiyet yapısı olduğunu göstermektedir. Seçim dönemlerinde genel bir yavaşlama eğilimi görülse de kamu katılım bankaları kredi arzında daha aktif davranmıştır. Ayrıca, seçimlerden iki çeyrek sonra kamu sahipliğindeki bankalarda NPL oranları artmış; buna karşılık özel katılım bankalarında sistematik bir risk artışı gözlenmemiştir. En dikkat çekici sonuç ise kamu katılım bankalarının risk davranışlarının kamu mevduat bankalarından anlamlı biçimde ayrışmamasıdır; dolayısıyla Şer'i denetim ve varlığa dayalı yapının, kamu sahipliğinden kaynaklanan politik baskıyı sınırlamada beklenen ölçüde etkili olmadığı anlaşılmaktadır."
