abstract: "İmam Şâfiî bir İslam hukuku âlimi olmakla birlikte iyi de bir şairdir. Her ne kadar şairlik yönü güçlü olsa da o hep bir fakih olarak tanınır. Hakkındaki çoğu araştırma onun fakihlik yönünü ele alır ve şairliğini ihmal eder. İmam Şâfiî şairliği yönüyle Arap edebiyatçıları ve dilbilimcilerinden pek çok övgüye mazhar olur. Şiirlerinde çeşitli konuları net ifadelerle aktarır ve mesajlarını toplumun her kesimine ulaştırır. Bunun nedeni ise İmam Şafiî'nin şiirlerinde sade bir dil ve anlaşılır bir üslup kullanmasıdır. Şiirlerinde almış olduğu Kur'ân, hadis, dil ve edebiyat eğitiminin etkisi açıkça görülmektedir. Şiirlerinde, sözcük seçiminde ki titizlik ve anlam derinliği okuyucusunu içine çeken bir yapıya sahiptir. İmam Şâfiî'nin şiirleri, konu bakımından zengin bir çeşitliliğe sahiptir. Şiirlerinde genel olarak; inanç, hikmet, ahlak, adap, nasihat, tasavvuf, züht, ilim, eğitim, hayat tecrübeleri gibi farklı konuları ele almaktadır. Şiirlerinde ele aldığı konular bize onun“insan ve toplum için sanat”anlayışını benimsediğini gösterir. Anlaşılır bir dil, yalın bir ifade ile söylemiş olduğu şiirleri Arap dilini bilen herkese hitap edecek bir sadeliğe sahiptir. Üç bölümü içeren araştırmamız neticesinde onun şiirlerinde genel olarak inşâî yapılara çokça yer verdiğini ve bu yapıları sadece hakiki anlamında değil, nasihat, öğüt, kınama, yerme vb. mecâzî anlamlar için de kullandığı tespit edildi."
