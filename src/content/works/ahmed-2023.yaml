abstract: "Bu araştırma İslam Fıkhı ve Irak hukukuna göre oyunculuk ve sinemayı incelemeyi hedeflemektedir. Sanat, insanlar üzerinde çok etkilidir. Bunun yanında bu alanda çalışanların İslâmî hükümleri önemsemediği de bilinmektedir. Görsel sanatların zaman zaman gerçek silahtan bile etkili olduğu malumdur. Bütün bunlar basın alanında çalışmak, bu alanda görev almak isteyenlere fıkhın bu alanlara nasıl baktığını hiçbir şüpheye mahal bırakmayacak şekilde tespit etmeyi zaruri hale getirmektedir. Konunun gereği olarak araştırmacı analitik tümevarım yöntemi ile karşılaştırma yöntemlerini kullanmıştır. Oyunculuk ve sinema ile ilgili fıkhî malumatlar ile Irak hukukunun konuyla ilgili kanunlarının toplanmasında tümevarım yöntemi kullanılmıştır. Nasların tahlili, fakihlerin görüşleri, kanun maddeleri ve hukukçuların görüşleri incelenirken analitik yöntem tercih edilmiştir. Fakihler ile hukukçuların görüşleri kıyaslanırken ve ittifak edilen yerler ile ihtilaf olan hususlar belirlenirken karşılaştırma yöntemi kullanılmıştır. Araştırmada varılan neticelerin önemlileri şunlardır: Oyunculuk ve sinemanın hükmü, geç dönemde ortaya çıkan fıkhî meselelerdendir. Alimlerin çoğuna göre sinema bir maslahat için yapılıp, güzel ahlaka uygun ise caizdir. Mutlak olarak haramdır denemez. Çünkü sinema, toplumda bıraktığı derin tesir sebebiyle Allah'a davetin önemli bir unsuru haline dönüşebilir. Irak hukuku da bu konuda İslam fıkhı ile uyuşmaktadır. Irak hukukunda sinema ve tiyatro yapımcılarının toplumun ahlaki ilkelerine uymak zorunda olduğuna dair kanun maddeleri bulunmaktadır. Aktörlerin tesettüre dikkat etmeden rol almaları, cinslerin birbirine karışması, aktörlerin evlenmesi ve boşanması konuları İslam'a göre mahzurluyken; Irak medenî hukukuna göre ise meşrudur."
