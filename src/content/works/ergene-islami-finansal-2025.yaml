abstract: "Ekonomik büyümenin temel belirleyicilerinden biri olan finansal gelişme, ekonomik faaliyetlerin etkin bir şekilde finanse edilmesini sağlayarak yatırımları ve büyümeyi destekleyen bir süreçtir. Ancak günümüzde ekonomik büyümenin yanı sıra çevresel etkiler de giderek daha fazla önem kazanmaktadır. Bu bağlamda, faizsiz finansal araçlar, risk paylaşımı ve etik ilkelere dayanan İslami finans, konvansiyonel finanstan farklı olarak çevresel sürdürülebilirliğe daha duyarlı bir yaklaşım sunma potansiyeline sahiptir. Bu çalışma, finansal gelişmenin çevre üzerindeki etkilerini inceleyerek, İslami finansın bu süreçteki rolünü değerlendirmeyi amaçlamaktadır. 2013-2022 yılları arasını kapsayan ve BAE, Bangladeş, Endonezya, Kuveyt, Malezya, Nijerya, Pakistan, Suudi Arabistan, Türkiye, Umman ve Ürdün olmak üzere 11 İslam ülkesini içeren panel veri analizi yoluyla, İslami ve konvansiyonel finansal gelişme ile ekonomik büyümenin çevre üzerindeki etkileri araştırılmıştır. Çalışmada, yatay kesit bağımlılığının bulunmaması ve aykırı gözlemler ile değişen varyansın varlığı dikkate alınarak, Huber (1964) tarafından geliştirilen Robust En Küçük Kareler (RLS) yöntemi tercih edilmiştir. Böylece, aykırı gözlemler ve değişen varyans kaynaklı sapmalar minimize edilerek, elde edilen sonuçların güvenilirliğini artırılmış ve modelin istatistiksel sağlamlığı desteklenmiştir. Ayrıca, literatürde yaygın olarak kullanılan dar çevresel göstergelerin aksine, kapsamlı ve çok boyutlu iki gösterge olan ekolojik ayak izi ve yük kapasitesi faktörü kullanılmıştır. Hem LEF hem de LLCF modelinin analiz bulguları, değişkenler arasında anlamlı ilişkiler olduğunu ortaya koymaktadır. Ancak beklentilerin aksine, İslami finansal gelişmenin çevresel etkisi olumsuz bulunurken, konvansiyonel finansal gelişme çevreye olumlu katkı sunmaktadır. Ayrıca, EKC ve LCC hipotezleri aracılığıyla test edilen ekonomik büyümenin çevre üzerindeki doğrusal olmayan etkileri desteklenmemektedir."
