abstract: "Bu çalışmada Cüveynî'nin mezhep imamı olan Şâfiî'ye muhalefet ettiği usuli konular tespit ve tahlil edilmeye çalışılmıştır. Bu bağlamda Cüveynî'nin usul anlayışının oluşumunda etkilendiği ve etkilediği usulcülere de yer yer dikkat çekilmiştir. Cüveynî, Şafii mezhebine müntesip olmakla birlikte yer yer mezhep imamı olan Şâfiî'ye muhalefet etmiştir. Muhalefet ettiği konuların bir kısmında Şâfiî ile aynı görüşü paylaşmakla birlikte bazı konuların gerekçelendirmesi hususunda farklı bir yol izlediği görülmüştür. Bazı konularda ise doğrudan Şâfiî'nin görüşüne muhalefet etmiştir. İhtilaflı konular ele alınırken öncelikle Şâfiî'nin görüşü tespit ve tahkik edilmiştir. Şâfiî'nin eserlerinde konuyla ilgili sarih ifadeleri bulunması durumunda bu ifadeleri esas alınmış, bulunmaması durumunda ise Şafii usulcülerin ona nispet ettiği görüşler dikkate alınmıştır. Bunun yanısıra usule dair görüşlerini ortaya çıkarma adına yer yer fer'i meseleler hakkında verdiği hükümlerden de istifade edilmiştir. Cüveynî'nin görüşleri de usule dair kaleme aldığı kitaplardan ve bizzat kendi ifadelerinden tespit edilmiş ve gerekçeleriyle beraber zikredilmiştir. İhtilaflı görüşler gerekçeleriyle beraber zikredildikten sonra konu sonunda Şafii usulcülerin benimsediği ve mezhep içinde tercih edilen görüş belirtilmiştir."
