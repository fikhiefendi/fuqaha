abstract: "ÖZETYüksek Lisans TeziHz. Peygamber Dönemi Teşri Faaliyetlerinin Tekâmül SüreciEmin ERDEMDokuz Eylül ÜniversitesiSosyal Bilimleri EnstitüsüTemel slam Bilimleri Anabilim DalıSosyal hayat içerisinde yaşamak zorunda olan insan, bu yönüylediğer canlılardan farklılık göstermektedir. Hukukun ana gayesi olantoplumda adaletin sağlanarak bir düzenin oluşturulması, insanların ilkdevirlerinden beri var olan bir mücadeleli süreçtir.slâmiyet'ten önceki bedevû Araplar arasında da belli bir düzeninsağlanması için bir takım kurallar vardı. Toplum hayatını devamettirmenin vazgeçilmez unsuru olan hukuk düzeni cahiliye dönemiArapları arasında da beşerû düzenlemelerle de olsa mevcuttu. Daha çokgöçebe bir hayat tarzını benimsemiş olan devrin müşrik Arapları kendiyaşam kültürlerine paralel olarak ilkel hukuk düzenlerini oluşturmuşlardı.Hz. Peygamber döneminde Kur'an-ı Kerûm nazil olmaya başlayıncaeski Arapların yaşantıları ile ilgili genel uygulamalara da atıfdabulunmuştur. Gelen hukukû ayetler neticesinde ahkâm oluşmakta vedönemin insanlarının örf ve adetleri doğrultusunda da şekillenmekteydi.slâm'ın uygun bulduğu uygulamalar devam ettirilmek suretiyle sonrakinesillere aktarılması sağlanıyordu.slâm, Hz. Peygamber ile birlikte kendisinin mensubu bulunduğutopluma karşı şu şekilde bir teşrû süreci işletmiştir: Ya eski uygulamaaynen alınmış ya ıslah edilerek alınmış ya reddedilmiş ya da farklı biruygulama bizzat başlatılmıştır. Kur'ân-ı Kerûm'deki genel ahkâmınoluşum aşaması yukarıda sayılan bu dört evreden birine uyumgöstermiştir."
