abstract: "Yapı malikinin sorumluluğu, 6098 Sayılı Türk Borçlar Kanunu'nun 69. maddesinde hüküm altına alınmış bir kusursuz sorumluluktur. İlgili maddeye göre bina veya diğer yapı eserinin yapım bozukluğu ya da bakım eksikliği sebebiyle meydana gelen zararlardan yapının maliki sorumlu tutulur. İntifa ve oturma hakkı sahipleri ise yapının sadece bakım eksikliğinden kaynaklanan zararlarından dolayı malikle birlikte müteselsil olarak sorumlu tutulur. Yapı malikinin sorumluluğunun doğması için bir takım şartların mevcut olması gerekir. Öncelikle yapıdan kaynaklı bir zararın doğmuş olması gerekir. Söz konusu zararın hukuka aykırı olması gerekir. Bunun yanında zarar ile yapının yapım bozukluğu ya da bakım eksikliği arasında uygun illiyet bağının bulunması gerekmektedir. Yapı malikinin sorumluluğunun doğması için kusurlu olması gerekmez. Bu da yapı malikinin sorumluluğunu haksız fiil sorumluluğundan ayırmaktadır. Yapı malikinin sorumluluğunda malik, kurtuluş kanıtı getirerek sorumluluktan kurtulamaz. Ancak illiyet bağının kesildiğini ispat ederek sorumluluktan kurtulabilir. İlliyet bağını kesen sebepler ise mücbir sebep, zarar görenin ağır kusuru, üçüncü kişinin ağır kusuru şeklinde olmak üzere üçe ayrılmaktadır. Yapı malikinin sorumluluğunda zamanaşımı süresi 2 ve 10 yıldır. Sürelerin başlangıç tarihi zararın ve sorumlu tutulacak kişinin öğrenilmesinden itibaren başlamaktadır. Son olarak yapıdan kaynaklı zarar tehlikesi mevcutsa malikten zarar tehlikesinin ortadan kaldırılması için gerekli tedbirler alınması talep edilebilmektedir."
