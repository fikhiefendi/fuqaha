abstract: "Devletin Güvenliğine Karşı İşlenen Bilişim Suçlarının İslam Hukuku Açısından Değerlendirilmesi Her geçen gün hızla gelişen teknoloji, insanın gündelik yaşantısına birçok fayda ve kolaylıklar sağlamaktadır. Bununla birlikte teknolojik gelişmeler sağladığı faydaların yanında birey, toplum dahası devletler için bile yıkım gücü yüksek bir suç unsuru olarak kullanılmaktadır. Bu kapsamda bilişim sistemleri aracılığı ile ortaya çıkabilecek yıkım ve zararların önlenmesi ve en aza indirgenmesi adına kısmen ya da müstakil olarak yasal düzenlemeler yapılmaktadır. Dinamik yapısı ve her çağın problemine adil, hakkaniyetli ve âlimler paradigmasının ilmi yetilerine göre değişmekle birlikte evrensel çözüm üretebilen İslam Hukuku, devletin, bireyin ve toplumun maslahatını gözetmek suretiyle -içtihat yöntemini göz ardı etmeden- bilişim çağının en problemli taksir türü olan dahası bireyin kendilik değerlerine devletinse güvenliğine karşı işlenen bilişim suçlarına tatbik edilebilecek cezaî yöntemleri ortaya koymaktadır. Bu çalışmada devletin güvenliğine yönelik işlenen bilişim suçlarının İslam hukuku açısından değerlendirilmesi yapılmaya çalışılmıştır. Çalışmanın ilk bölümünde bilişim suçlarının özellikleri, işlenme şekilleri ve tasnifi açıklanıp, devletin güvenliğini ne boyutta etkilediğine yer verilerek siber güvenlik ve siber terörizm kavramlarına da kısaca değinilmiştir. Tezin ikinci bölümünde ceza kavramı kısaca ele alındıktan sonra, bilişim suçlarının İslam ceza hukukuna göre devlete karşı hırsızlık, casusluk, isyan ve terör olması açısından fıkhî bir değerlendirmeye tabi tutularak, modern hukukta bilişim suçlarına yönelik tatbik edilen cezalara da yer verilmiştir. Çalışmamızın çerçevesi modern kanunlar ile çizilen bilişim suçlarının, İslam hukukunun asli kaynakları doğrultusunda incelenmesini ve İslam hukukunun klasik yöntemlerinin modern hukuk ile karşılaştırması yapılarak teknoloji çağının ortaya çıkardığı bu yeni probleme çözüm odaklı yaklaşımını içermektedir."
