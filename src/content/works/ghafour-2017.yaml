abstract: "Şüphesiz Arap Dili Kur'an-ı Kerim'in dilidir; Müslümanlar nezdinde bilginin temeli ve yasamanın kaynağıdır. Arap Dili, İslam araştırmalarında o kadar önemlidir ki, bütün İslam ilimleri ona muhtaçtır. Çünkü İslam ilimlerinin anlam ve hakikati, ancak Arapça lafızların mana ve delaletini bilmekle mümkündür.Çalışmamızda Mutezile ve Eş'ariyye itikadındaki ihtilaflı meseleleri ileKitab ve Sünnet metinlerini anlayış tarzlarınıele aldık. Dolayısıyla lugavî, nahvî ve belâğî delaletleri olan inançla ilgili ayet ve hadisleri arz ettik ki her iki mezhebin de görüşleri ortaya çıksın."
