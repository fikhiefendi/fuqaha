abstract: "?İslam Hukuku Açısından Ötanazi? isimli tezimizde, ötanazi konusu; çeşitleri, semavi dinler nezdindeki yeri, sosyal hayattaki yansımaları, yasal yönleri ve bilhassa da İslam dinindeki hükmü çerçevesinde ele alınmaktadır.Tezimiz; ?Ötanaziye Genel Bakış?, ?Ahlakî Yönden ve Diğer Semâvî Dinler Açısından Ötanazi?, ?Ötanazi Konusundaki Görüşler ve Dayanakları?, son olarak da ?İslamiyet ve Ötanazi? başlıklarıyla dört ana bölümden oluşmaktadır.Birinci Bölümde; ötanazi konusunda bir kavram çerçevesi sunulup, çeşitleri detaylandırılıp, konuya dair örnekler sunulmuş ve bu şekilde araştırmanın temellendirilmesi hedeflenmiştir.İkinci Bölümde; konumuz sosyal açıdan ele alınmakla beraber etik açıdan da değerlendirilmeye çalışılmıştır. Ayrıca bu bölümde İslam dininin hâricinde diğer iki semâvi din olan Yahudilik ve Hıristiyanlık açısından da değerlendirmeler yapılmıştır.Üçüncü Bölümde; konumuzla alakalı görüşler ?tasdikler ve redler? çerçevesinde incelenmiştir. Ayrıca Türk Hukuk sisteminin yanı sıra, ötanaziye onay veren ülkeler, hukukî dayanaklarıyla birlikte sunulmuştur. Bu bölümde günümüz İslam hukukçularına da yer verilerek gündemdeki bakış açıları incelenmiştir.Dördüncü Bölümde ise; araştırmamız İslam dini açısından ele alınıp, çeşitlerinin fıkhî sonuçlarına yer verilmiştir."
