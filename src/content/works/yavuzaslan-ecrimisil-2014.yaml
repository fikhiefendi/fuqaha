abstract: "Ecrimisil, bir taşınır veya taşınmazın hak sahibinin rızası olmaksızın haksız zilyed tarafından kullanılması nedeniyle bu kullanım süresi karşılığında ödemesi gereken bedel şeklinde tanımlanabilir. Kamu hukukunda yasal düzenlemelere tabi olan kurum, özel hukuk yönünden yasal bir düzenlemeye konu edilmemiştir. Bu nedenle de uygulamamızda içtihadı birleştirme kararlarıyla bu kuruma yön verilmiştir. Kararlar neticesinde bu bedelin hukuki nitelemesi haksız fiil şeklinde yapılmıştır. Ecrimisil için yapılan haksız fiil nitelemesine karşılık içtihatlarımız, bu hükümlerin dışındaki bazı hükümlerin de uygulanması gerektiğine karar vermiştir. İçtihatlarımızda ecrimisil için haksız fiil, haksız zilyedlikte iade ve kira sözleşmesine ilişkin hükümlerin birlikte uygulanması gerektiği kabul edilmiştir. Ancak bu uygulama, yöneltilen ecrimisil taleplerinin tam olarak karşılanamamasına neden olduğu için eleştirilmektedir. Bu nedenle doktrin tarafından ecrimisile ilişkin ileri sürülen görüşlere ayrıca yer verilmiştir. Uygulamada geniş bir yer kaplayan ecrimisilin daha iyi anlaşılabilmesi için konumuz, Mecelle ve Anglo – Sakson hukuku yönünden de ele alınmıştır. Bu değerlendirmelerden sonra ise ecrimisil talebi için uygulamada aranan şartlara yer verilmiştir. Maddi hukuk bakımından yaptığımız bu incelemelerden sonra konumuzun usul hukuku yönünden ele alınmasıyla da çalışmamız son bulmuştur."
