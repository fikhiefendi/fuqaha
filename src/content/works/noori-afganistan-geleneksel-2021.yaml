abstract: "Bu çalışmada ABD'nin 2001 yılındaki müdahalesi sonrası Afganistan'da geleneksel ve İslami bankacılığın gelişimi incelenmiştir. Afganistan önemli coğrafi konumundan dolayı süper güçlerin istilalarına maruz kalmıştır. 18. yüzyılda Büyük Britanya, 19. yüzyılda SSCB ve en son 20. yüzyılda ABD 11 Eylül 2001 tarihindeki saldırı sonrası terörü bitirme ve ekonomik kalkınma söylemiyle Afganistan'a girmiştir. ABD öncülüğündeki NATO müttefikleri son 17 sene içinde Afganistan'ı kalkındırmak adına 100 milyar dolardan fazla para sarf etmiştir. Bu büyük miktar paranın çoğu ülkenin kalkınması ve gelişmesi için etkili anlamda kullanılmamıştır. Bir kısmı da yabancı güçler tarafından asker maaşı ve teçhizatlarının karşılanması için ülkeden geri çekilmiştir. Ekim 2001'de ABD'nin müdahalesi sonrası kısa bir süreliğine iç çatışma ve kargaşa son bulmuş ve yıkılan devlet düzeni yeniden kurulmaya başlanmıştır. Bu doğrultuda Afganistan'da bankacılık sektörünü uluslararası standartlara getirmek için 2003 yılında 101 maddelik Bankacılık Kanunu yayınlanmıştır. Bu kanunun 3. maddesinde Merkez Bankasına, bankaların hangi tür faaliyetleri yürütebileceklerine dair düzenleme yapma yetkisi verilmiştir. Merkez Bankası bu yetkiyi kullanarak bankaların pencere sistemi şeklinde İslami bankacılık faaliyetine de cevaz vermiştir. Bu çalışmada Afganistan'ın genel sosyo-ekonomik durumundan, geleneksel ve İslami bankacılığın gelişim sürecinden bahsedilecek; ekonometrik model kullanılarak finansal sistemdeki gelişimin ekonomik büyüme üzerindeki etkisi test edilecek İslami bankacılıktaki muhtemel gelişmelerin sonuçları hakkında fikir edinilecektir. Anahtar Kelimler: Afganistan, Geleneksel Bankacılık, Kalkınma, İslami Bankacılık"
