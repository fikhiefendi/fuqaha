abstract: "Toplumun temel taşı hüviyetindeki aile, her hukuk sisteminde olduğu gibi İslâm hukukunda da önemli bir yere sahiptir. Ülkemizde Medenî Hukuk'un kabulüyle birlikte evlilik akdinin kuruluşuyla ilgili özel şekil şartları belirlenmiştir. Bu durum toplum içerisinde farklı nikâh şekilleri doğurmuştur. Bu sebeple, evlilik akdinin şartları açısından İslâm Hukuku ve Mer'i Hukuk arasındaki en önemli ayrım noktalarını ve insanları imam nikâhına yönelten psikolojik etmenlerin analizini yapmaya çalıştık. Boşanmanın tescili bölümünde, talâk hakkının kayıtsız şartsız kocaya ait olduğu görüşünün, Kur'an'da yer alan hükümlere dayalı olmadığını belirttik. Kur'an'ın boşanma işlemlerinin belirli usul ve esasların yerine getirildiği bir süreç içerisinde yapılması talebinin tavsiye niteliğinde kabul edilmesi, içerisinden çıkılması güç problemlerin kaynağı haline gelmiştir. Bu sebeple boşanmaların Kur'an'ın belirlediği süreç içersinde tarafların iradelerin de dikkate alındığı usulde gerçekleşmesinin toplumsal maslahata daha uygun olacağını izah ettik."
