abstract: "Bu araştırmada, Kastamonu Kazâsı'nın 1699-1716 yılları arasındaki idarî, sosyal ve ekonomik yapısı ile kültürel hayatı incelenmiş, günlük hayatta meydana gelen olaylar çeşitli örnekler ile açıklanmış ve mahkemenin bu olaylar ile ilgili karar verirken izlediği yollar tespit edilmeye çalışılmıştır. Tezin hazırlanmasında şehir tarihleri açısından büyük bir öneme sahip ve tarihin ana kaynaklarından biri olan şer'iyye sicilleri kullanılmış, ihtiyaç duyulduğu yerlerde diğer kaynaklara da başvurulmuştur. Giriş bölümünde, çalışma boyunca kullanılan şer'iyye sicil defterleri ile konuyla ilgili diğer kaynaklar hakkında bilgilendirmeler yapılmış ve şehrin tarihçesine kısaca değinilmiştir. İdari yapının incelendiği bölümde, kaynaklara yansıdığı kadarıyla Kastamonu'nun kazâları ve bağlı birimleri, nahiyeleri ve bağlı birimleri, mahalleleri, köyleri ve divanlarının isimlerine ulaşılmıştır. Bu birimler incelenirken rastlanan ve şehrin tarihi, kültürü, coğrafyası ile ilgili çeşitli bilgiler içeren unsurlara da bu bölümde yer verilmiştir. Şehirdeki en üst yönetici konumundaki sancak beyinden başlayarak mahalle imamlarına kadar şehrin idarî yapısındaki görevliler ile ilgili bilgiler yine bu başlık içerisinde ele alınmıştır. Sosyal yapı incelenirken söz konusu dönemdeki toplumsal yaşantı üzerinde durulmuş, aile kavramı içerisinde kadın ve çocukların durumu incelenmiştir. Toplumda kullanılan ünvan ve lakaplardan söz konusu dönemdeki mesleklere, insanların evlerinde kullandıkları eşyalardan şahsi giyim eşyalarına, kadınların süs eşyalarından ziynet eşyalarına, çeşitli silah ve âletlerin isimlerine kadar kayıtlardan elde edilen birçok veri paylaşılmış ve çeşitli kıyaslamalar yapılmıştır. Sosyal yapı ve kültürel hayat bölümünde toplumun vazgeçilmez bir unsuru olan şehre ait vakıflar ile cami, mescid, tekke, zâviye, hamam gibi vakıf kurumları ve vakıf görevlilerine dair bilgilere de yer verilmiştir. Ticaret hayatının canlı olduğu şehirdeki han, bedesten, çarşı ve pazar gibi ticari yapılar incelenerek ve söz konusu dönemdeki çeşitli fiyat tespitlerine bakılarak söz konusu dönemin ekonomik hayatına ilişkin veriler elde edilmiştir. Son bölümde, ayrı ayrı başlıklar altında halkın gündelik hayatında meydana gelen olaylar, çeşitli örnekler çerçevesinde değerlendirilmiş ve mahkemenin çalışma prensipleri ortaya çıkarılmıştır. Ayrıca şehrin idarî teşkilatına mensup kişilerin karıştığı olaylar da ayrı bir başlık altında, ehl-i örf ve ehl-i şer olarak iki grupta incelenmiştir."
