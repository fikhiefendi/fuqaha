abstract: "Bu çalışmada muhaddis kimliğiyle ön plana çıkan bir âlim olan Hatîb el-Bağdâdî'nin fıkıh usûlüne dair görüşleri ele alınmıştır. Şâfiî mezhebine mensup bir âlim olduğundan dolayı Bağdâdî'nin İmâm Şâfiî'nin usûl anlayışını sürdürüp sürdürmediği tespit edilmeye çalışılmıştır. Bağdâdî'nin fıkıh usûlüne yönelik görüşleri, bazı âlimlerle ara ara mukayese edilerek sunulmuştur. Bağdâdî'nin usûl düşüncesi el-Fakîh ve'l-Mütefakkih adlı eseri bağlamında ele alınmıştır."
