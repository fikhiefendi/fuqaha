abstract: "Mehmed Zihni Efendi, İslami ilimlerin pek çok sahasında eser yazmış bir fıkıh alimidir. Zihni Efendi'nin Nimet-i İslam'ı da Türkiye'deki ilmihallerin atası hükmünde çok kıymetli bir eserdir. İlmihal olmasına rağmen, ilmihallerde bulunmayan nikâh ve talak konularını da ihtiva etmektedir. Nimet-i İslam ayrı ayrı kitaplardan (bölümlerden) oluşmaktadır. Eserin nikâh bölümü olan el-Vücûhu'l-Milâh fi-Fusûli'n-Nikâh Hanefi görüşlerine göre yazılmış, nikâh meselesini etraflıca inceleyen bir eserdir. 1917 tarihli Hukuk-ı Aile Kararnamesi de Nimet-i İslam'la aynı dönemlerde kaleme alınmış bir kanun metnidir. Kararname el-Vücûhu'l-Milâh'da olduğu gibi Hanefi mezhebine göre yazılmasına rağmen bazı meselelerde Osmanlı Devletinde eşine az rastlanır şekilde Hanefi mezhebinden ayrılmış, diğer mezheplerin görüşlerini tercih etmiş, bazı meselelerde ise kendisi müstakil tercihler yapmıştır. Ayrıca Osmanlı coğrafyasındaki pek çok Müslüman devletin aile hukuku sistemini doğrudan etkilemiştir. Ziyadesiyle önemli olan ve pek bilinmeyip haklarında yapılmış çalışmalar az olan aynı dönemin bu iki mühim eserinin mukayesesi faydalı olacaktır."
