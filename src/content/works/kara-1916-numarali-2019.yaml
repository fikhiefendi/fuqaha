abstract: "Bu çalışmada, tarih bilimi açısından önemli bir kaynak türü olan bir şer'iyye sicilinin günümüz Türkçesine aktarımı yapılarak değerlendirilmeye çalışıldı. Çalışmanın ana konusunu oluşturan 1916 numaralı Trabzon Şer'iyye Sicili H. 1160-1161/ M. 1747-1748 yılları arasını kapsamaktadır. Sicilin transkripsiyonu esnasında tüm kelimelerin doğru bir şekilde okunması ve kaydedilmesi hususunda özen gösterilmiştir. Defter, dönemin Trabzon tarihi hakkında sosyokültürel, iktisadi, hukuki gibi alanlarda bilgiler içermektedir.“1916 Numaralı Trabzon Şer'iyye Sicili'nin Transkripsiyonu ve Değerlendirilmesi (H. 1160- 1161/M. 1747-1748)”adlı çalışma genel itibariyle iki bölümden oluşmaktadır. Tezin giriş bölümünde Trabzon Tarihi ve Sicilin tarihlendiği yıllardaki Osmanlı Tarihi hakkında kısaca bilgi verilmiştir. Birinci bölümde Trabzon Şer'iyye sicillerini kullanarak çalışma yapan araştırmacılar ve yaptıkları çalışmalar, Trabzon Şer'iyye sicillerinin konu olduğu yüksek lisans ve doktora çalışmaları belirtilmiştir. İkinci bölümde ise 1916 numaralı Trabzon Şer'iyye sicilinin genel özellikleri, şer'iyye sicilindeki belgelerin konuları ile bu konuların değerlendirilmesi ve Trabzon'un idari taksimatı, sicil defterinde adı geçen Trabzon'un yapıları, dönemin meslekleri ve memurlukları hakkında bilgi verilmiştir. Çalışmanın son bölümü olan ekler bölümünde ise 1916 numaralı Trabzon Şer'iyye Sicili'nin transkribe edilmiş metni bulunmaktadır. Bu çalışma ile özelde Trabzon, genelde Osmanlı Devleti'nin sosyal, ekonomik, hukuki, askeri, idari tarih alanlarında yapılacak olan çalışmalara ve çalışma yapacak olan araştırmacılara katkı sağlanması amaçlanmıştır."
