abstract: "Zekât, İslâm'ın beş şartından biridir. Zekât kelimesi anlam olarak büyüme, artma, övme ve temizlenme anlamlarına gelmektedir. Zekât, mal ile yapılan bir ibadet olmasının yanı sıra iktisadî, sosyal yönleri ve önemli sosyal fonksiyonları bulunan bir kurumdur. Bu kadar önemli olduğu içindir ki, Kur'ân-ı Kerîm'de zekât, defalarca ve hemen namazın arkasından zekredilmiştir. Bilindiği gibi zekât, dinen zengin sayılan kimselerin, Kur'ân'da emredilen kimselere, yılda bir defa vermekle mükellef oldukları bir farzdır. Zekât mükellefiyeti Kur'ân ve Sünnetle sabittir. Zekât sayesinde zenginlerin ellerindeki iktisadî değerler karşılıksız olarak yoksullara nakledilmektedir. Böylece sosyal adaletin ve eşitliğin sağlanmasına ve gelir eşitsizliğinin en aza indirilmesine katkı sağlanmaktadır. Kur'ân'da zekâtın harcama yerleri sekiz sınıf olarak açık ve net bir biçimde belirtilmiştir. Ancak, zamanla müslümanlar arasında yaygın hale gelen anlayışa göre zekât, fakir fukaraya verilmesi gereken bir sadaka, bir yardımdan ibaret sanılmıştır. Bu anlayış biraz kısır kalmaktadır. Zekât mükellefiyetinin kapsamına esas olarak bireyler girmekle beraber bazı şartlar oluşmuşsa hükmî kişiliğe sahip şirketler de bu kapsama girebilmektedir. Bu çalışma kapsamında zekâtla ilgili önemli bilgilere yer verilmiş, Zekâtın tanımı yapılarak ve açıklanarak başlanan tez çalışmasında önce zekâtın önemi ve kurum olarak zekâtın ehemmiyeti, işlevleri ve gereği üzerinde durulmuştur. Daha sonra sırasıyla zekât mükellefi olmanın sebep ve şartları, tam mülkiyet, nemâ ve nisab konusu, temel ihtiyaçlar ve havalânil-havl izah edilmiştir. Bu meyanda zekâta tâbî olan mallar hakkında oldukça teferruatlı bilgi verilmiştir. Özellikle hangi durumda şirketler için zekâtın söz konusu olacağı, hangi iktisadî değerlerin zekât kapsamına gireceği ve bu değerlerin hangi finansal tablolardan nasıl sağlanacağı, zekât tutarının nasıl hesaplanacağı, nasıl ödeneceği gibi konular ele alınarak incelenip, araştırılmıştır."
