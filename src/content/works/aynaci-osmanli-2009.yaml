abstract: "?İlim? ve ?Hal? kelimesinden müteşekkil ilmihal kelimesi, ilk dönemlerden itibaren kullanılmakla birlikte, daha sonraları, kişinin içinde bulunduğu anda, zamanda, durumda sahip olması gereken dînî bilgilerin yer aldığı, fıkıh alanıda yazılan eserler için kullanılır olmuştur. Oluşum dönemi Osmanlı'nın kuruluş yıllarına rast gelen bu eserlerden, özellikle bu dönemde yazılan Türkçe ilmihaller dikkati çekmektedir.Araştırmamızın konusunu, Osmanlı kuruluş döneminde yazılan Türkçe ilmihal eserleri ve bu eserlerden hareketle, ilmihal kitaplarının fıkhî yönden değerlendirilmesi oluşturmaktadır. Çalışmamızda söz konusu dönemde yazılan Türçe eserlerden Kutbeddin Muhammed İznikî (821/1418)'ye ait Mukaddime, daha ziyade Kutbeddinzâde olarak bilinen İznikî'nin oğlu Muhammed Muhyiddin b. Kutbeddin'e ait el-Ikdu's-semin ve'l-akdül yemin, Abdurrahman b. Yusuf Aksarâyî (854/1450'den sonra) tarafından bazı ilavelerle tercüme edilen İmadü'l-islam adlı eserler kullanılmıştır.Tezimizin ilk amacı, ilmihal olarak isimlendirilen, günümüzde etkinliğini ve önemini koruyan bu eserlerin ortaya çıkış sürecini incelemektir. İkincisi, klasik fıkıh literatüründen farklı olarak konuların daraltıldığı, bilgilerin daha rafine bir şekilde sunulduğu, hatta ilim dünyasında kınanma riskine rağmen, ele aldığımız dönemde Türkçe olarak kaleme alınmış bu eserlerin, özelliklerini tespit etmek ve klasik fıkıh eserlerinden farklı olan yönlerini ortaya çıkarmaktır."
