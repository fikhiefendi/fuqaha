abstract: "Tez, İslam ve kapitalist ekonomide yönetilen para sisteminde parasal sistemin istikrarının gerçekliğini açıklamayı amaçlamakta, aynı zamanda iki sistemde bunu başarmanın prosedürlerini ve araçlarını ve parasal istikrara ulaşma olasılığını açıklamayı amaçlamaktadır. Kapitalist sistemdeki çağdaş para birimlerinde istikrar. Tez, çalışma alanındaki bilim adamlarının ve araştırmacıların ifadelerinin çıkarımlandığı ve analiz edildiği tümevarımsal ve analitik yaklaşımı benimsemiş, aynı zamanda tümdengelim ve tümdengelim yaklaşımını takip ederek araştırılan konular hakkında görüşler çıkaracak ve bunları kanıtlayacaktır. Ayrıca araştırılan konularda İslami ve kapitalist sistemleri karşılaştırmak için karşılaştırmalı yaklaşımı takip edin. Mesajda, İslami ve kapitalist sistemlerde yönetilen para sisteminde parasal sistemin istikrarının gerçekliğinin açıklamasına ulaşılmış, her iki sistemde parasal istikrarın sağlanması, mekanizması, prosedürleri ve araçları açıklanmış ve şunu açıkça ortaya konulmuştur: İslam'da yönetilen para sisteminde parasal istikrarın sağlanmasıyla ilgili olanların çoğu geleceğe yönelik tahmin meselesidir ve bunu uygulamaya yönelik girişimler henüz tamamlanmamıştır ve bu konu daha fazla çalışma gerektirir ve bir anlaşmaya varılmadan tamamlanamaz. tam bir İslami yönetim sistemidir. Ayrıca İslam'da bunu başarma ihtimalinin kapitalizme göre daha fazla olduğunu göstermiş ve kapitalist sistemde yönetilen para sistemine tabi oldukları sürece çağdaş para birimlerinde kalıcı parasal istikrarın sağlanmasının mümkün olmadığı sonucuna varmıştır."
