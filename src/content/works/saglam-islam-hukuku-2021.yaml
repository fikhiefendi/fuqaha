abstract: "İslâm, ferdin dünyada hayatını devam ettirmesi için gerekli olan şeylerin kullanımının ve tüketiminin mübah yoldan olmasını istemiştir. Her insandan istenen, kendi emeğiyle çalışıp kazanarak harcamasıdır. İslam, insanların alış-veriş, kiralama vb. bedelli akitlerde bulunmasına da müsaade etmiştir. Çalışmaya imkânı olmayanlar ya da imkânı olup kendisine ve ailesine yeterli olmayanlar için de İslam bazı yardımlaşmaları farz, bazılarını vacip, bazılarını ise sevap olarak teşvik etmiştir. Kendisinin çalışıp kazanması mümkün ve yeterli değilse hayatını devam ettiremeyecek duruma gelebilir. Tekrar çalışabilecek duruma gelene kadar veya insanlar yardım edene kadar dilenebilir. Dilenmek en son kazanç yoludur, yani zaruri durumlarda izin verilen bir ruhsattır. Zaruri durumlarda izin verilen bir ruhsat, meslek haline dönüştürülemez. İhtiyacı yokken insanlardan, onların duygularını istismar ederek alınan şeyler âlimlerimizce habis (pis) olarak nitelendirilmiştir. Asıl olan kişinin bizzat çalışıp hayatını idame ettirmesidir. Fakir ve muhtaç durumda ise, Allah (c.c.) zekâtı farz kılmıştır, zenginler tarafından kendisine zekât verilir. Farz olan zekâtın dışında, kendisine yılda bir kere de olsa fıtır sadakası verilir. Diğer zamanlarda hayırsever insanlar, kendisine farklı şekillerde yardım ederler."
