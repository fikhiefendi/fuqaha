abstract: "“Şâfiî Mezhebinde Kabz İle İlgili Hükümler”isimli bu araştırmamızda Şâfiî fıkhında sözleşme ve işlemlerdeki kabzdan bahsedeceğiz. Araştırmamda kabzın kavramsal olarak tarifini yaptıktan sonra, kabzı belirleyen şeri bir tarif bulunmadığından bu konudaki tariflerin örfe dayandığını belirttim. Zira insan toplumları arasında Hak Teâlânın hükmü örfe bıraktığı birçok nokta bulunmaktadır. Ardından nakit, haiz olma, elinde tutma, alışveriş ve benzeri kabz ile ilgili birtakım sözcük ve kavramları ele aldım. Sonrasında İslâm fıkhında kabzın meşruiyetine işaret ettim ve bu konuda deliller getirdim. Ardından da izin açısından kabzın türlerine yer verdim; kabzın geçerli olabilmesi için elinde bulundurma hakkı bulunan kişinin izin vermesinin şart olduğunu, böyle bir hakkın bulunmaması durumunda ise iznin şartı olmadığını belirttim. Ardından kabzın keyfiyeti ve koşullarından bahsettim. Keyfiyet hususunda kabzı; gayrimenkullerin kabzı, menkul malların kabzı ve küçük şeylerin kabzı olarak birbirinden ayırdım. Gayrimenkul mallarda kabzın gayrimenkulün her türlü değerlendirmelerden ve satıcıya veya müşteri dışındaki kimselere ait mallardan tahliye edilmesi ve üzerine teslime uygun zamanın geçmesi şeklinde olduğunu ifade ettim. Menkul mallarda havale ve ödeme şeklinde olacağını, küçük mallarda ise ele almakla olacağını belirttim. Cezai ehliyet, velayet ve izin gibi kabzın geçerlilik şartlarını dile getirdim ve başkasının hakkı bulunan ya da genel hissesi bulunan bir malın kabzedilmiş sayılamayacağını ifade ettim. Araştırmamız farklı türleri ile modern elektronik sözleşmelerdeki kabzın keyfiyetine de değinmiştir. Program, uygulama, film, farklı görsel ve işitsel içerikler gibi elektronik mallarda kabz, müşterinin bu ürünleri kullanmasına ve faydalanmasına izin verilmesi suretiyle gerçekleşir. Ürünlerin kullanımına dair engel kalktığında bu kabız mesabesinde sayılır. Elektronik yollarla ticareti yapılan ayni anlarda ise kabz malların teslimi konusundaki acenteler ve satıcı vekilleri aracılığı ile ya da başka bir vakitte teslim alınması için müşteri adına gönderilen belgeler veya resmi mercilerde kayıtlı olan ürünler gibi hükmen kabzedilen mallar şeklinde gerçekleşir. Bu gibi işlemlerde tescilin müşteri adına yapılması kabız mesabesinde sayılır. Mülkiyet, malın sahipliği ve kullanım hakkı müşteriye geçer. Ardından araştırmamda fıkıh kaidelerinin tarifini yaptım ve öneminden bahsettim. Kabız ve benzeri ile ilgili modelleri belirttim. Son bahiste finansal sözleşmeleri ve kabız ile ilişkisini dile getirdim. Şafii mezhebindeki sözleşme türlerini aktardım ve açıkladım. Sözleşmelerin karşılıklı sözleşmeler ve karşılıksız sözleşmeler diye ikiye ayrıldığını belirttikten sonra, sözleşmelerin şekli, meclisi, tarafları, gerekli olan koşullar, sözleşme yapılan şey ve bulunması gereken koşullar gibi sözleşmelerin unsurlarından ve koşullarından bahsettim. Özetle sözleşmelerin koşullarının dört olduğunu ve bunların gerçekleşme koşulları, sıhhat, geçerlilik ve bağlayıcılık olduğunu belirttim. Özel olarak kabzın sözleşmelerle ilişkisi ve bunun türlerinden de bahsedilmiştir. Hibe, borç ve ödünç gibi mülkiyetin geçmesi için kabzın şart olduğu sözleşmeler dile getirmiştir. Çünkü bu gibi sözleşmelerde mülkiyet sadece teklif ve kabul ile geçmez. Bunun yanındaki hibe eden kişinin izniyle kabız bulunması şarttır. Diğer bazılarında ise sözleşmenin geçerli olması için kabız şarttır. Sarp akdi, faizli malların satışı selem, mudarebe, musakat ve muzaraa akitleri buna örnektir. Bir de hibe ve rehin gibi diğer bazılarında ise akdin bağlayıcı olması için kabız şarttır. Son olarak ulaştığım en önemli neticelere yer verdim."
