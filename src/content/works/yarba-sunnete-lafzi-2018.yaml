abstract: "Çalışmamız sünnete şeklî/lafzî (zâhirî) yaklaşım sergilediği iddia edilen Ebû Hüreyre'nin, bu iddialar bağlamında sünnet anlayışını tespit etmeyi amaçlamaktadır. Bu amaç doğrultusunda çalışmamızı üç bölüm halinde ele almayı uygun gördük. Çalışmanın birinci bölümünde sünnet anlayışı hakkında fikir vereceği düşüncesiyle Ebû Hüreyre'nin hayatı ve kişiliği üzerinde durulmuştur. Neticede hakkında çokça ihtilaf edilen ismiyle değil künyesiyle meşhur olduğu, daha Yemen'deyken müslüman olmakla birlikte ancak 7/628 senesinde Medine'ye hicret ettiği ve Rasûlullah (s.a.) dönemi de dâhil olmak üzere Hz. Ebû Bekir ve Hz. Ömer Bahreyn'de; Muâviye döneminde de Medine'de çeşitli idarî görevler üstlendiği sonucuna varılmıştır. İkinci bölümde ise, Ebû Hüreyre'nin hadisçilik ve fakihlik yönü üzerinde durulmuştur. Neticede onun fakihlik yönünden ziyade hadisçilik yönünün ağır bastığı ve tespit edilen fetvalarının da bu durumu teyit ettiği sonucuna varılmıştır. Üçüncü bölümde sahâbe döneminden günümüze kadarki süreçte kendisine yöneltilen tenkitlere yer verilmiş ve bunların gerekçeleri ele alınmaya gayret edilmiştir. Neticede sahâbe ve Hanefî âlimlerin yaptığı tenkitlerin sünneti doğru anlamaya yönelik yapılmışken diğer grupların bunu önyargılarla yaptığı ve sahâbe tarafından tenkit edilen rivayetlerinin tüm rivayetlerine oranla yok denecek kadar az olduğu görülmüştür. Sonuç itibariyle Ebû Hüreyre'nin fakih olmadığı başka bir deyişle sünnete şeklî/lafzî (zâhirî) yaklaştığı şeklindeki iddiaların haklı olduğu ve ömrünü hadis rivayetine adamış olmasının da bunu teyit ettiği kanaatine varılmıştır."
