abstract: "Araştırmanın amacı, Pakistan'da 2007-2015 yılları arasındaki sermaye yapısının banka performansı üzerindeki etkisini tartışmaktır. Bu doğrultuda, çalışmada özkaynaklardan elde edilen kazancın temsil ettiği bağımsız değişken sermaye yapısı ile ROA (aktif karlılık) ve NFM (net faiz marjı) tarafından belirlenmiş performans arasındaki ilişkiyi tespit etmek amacıyla Panel veri analizi uygulanmıştır. Analiz, Pakistan bankacılık sektöründe özkaynakların kârlılığı nasıl etkilediği ile ilgili edinilen veriler üzerine inşa edilmiştir. Bağımlı ve bağımsız değişkenlerden farklı olarak, likidite riski (krediler/varlıklar), varlık kalitesi (kredi kayıp karşılığı), banka ölçeği (varlıkların logaritması) ve operasyonel etkinlik (faiz-dışı giderler/varlıklar) olmak üzere 4 değişken daha kullanılmıştır. Analiz, sermaye yapısı ve hacmi ile karlılık arasında pozitif ilişki söz konusu olduğunu; öte yandan varlık kalitesi ve operasyonel etkinlik ile karlılık arasında negatif fakat anlamlı bir ilişki olduğunu göstermiştir. Her iki modelde de likidite riski anlamsız bulunmuştur. Karşılaştırmalı grafik analizi ile Pakistan'daki İslami, geleneksel ve karma bankacılık çeşitleri arasında hangi türün daha önde olduğu gösterilmiş olup, karma bankacılığın (İslami perspektiften geleneksel bankacılık) diğer iki alternatif bankacılık yöntemine göre daha iyi performans sergilediği tespit edilmiştir."
