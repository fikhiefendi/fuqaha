abstract: "Kur?an?ı Kerim ile sahih sünnetin açık olarak ifade ettiği bir hüküm üzerinde fakihlerin farklı görüş beyan etmeleri caiz değildir. Ancak gerek nass?lardan kaynaklanan sebeplerden, gerekse de hakkında nass (ayet ve hadis, temel alınacak delil) bulunmayan hususlarda ne şekilde hareket edileceği konusu göz önüne alındığında, farklı mezheplerin var olması zorunlu olur. Yukarıda değindiğimiz gibi müçtehidlerin, nassı anlama, hadisin sübutu ve maslahat, örf ve benzeri delilleri alıp almamakta farklılıkları, ister istemez meselelerin hükmünde ihtilaf etmelerine sebep olmuştur. Netice itibari ile Müslümanlar da kendi bölgelerinde yaşayan imamın fetvalarını biliyor, onu tercih ediyor ve ona göre amel ediyordu. İşte bu tercih ve taraftarlık zamanla yerini ?gidilen yol? manasına gelen mezheplere terketti. Hanefi, Şafiî, Maliki, Hanbelî, Ca?feriyye, Zeydiyye ve Zahirilik mezhepleri başta olmak üzere birçok mezhep ortaya çıktı. Ancak bu yedisi dışındakilerin bağlıları kalmadığı için kitaplarda sadece isimleri vardır. Biz de Ehl-i Sünnet mezhepleri içerisinde Şafiî mezhebinin üç mezhebe muhalif olduğu konuları tespit etmeye çalıştık. Yaptığımız araştırmada Şafiîlerin; ibâdât, muâmelat, münâkehât, müfârekât ve ukubat konularında üç mezhebe teferrüd ettikleri konuları tespit etmeye çalıştık."
