abstract: "Bu çalışmada Ağrı ilinde faaliyet gösteren katılım bankalarıyla aktif olarak çalışan müşterilerin katılım bankacılığı ve finansal okuryazarlık bilgi düzeylerini tespit etmeyi amaçlanmıştır. Ağrı il merkezindeki katılım bankalarıyla, aktif olarak çalışan müşteriler üzerinde bir saha çalışması yapılmıştır. Bu çalışmanın bir diğer amacı da, katılım bankalarıyla çalışanların cinsiyet, medeni durum, yaş, eğitim durumu, meslek ve aylık gelir düzeyi gibi demografik özelliklerine göre katılım bankacılığı bilgi düzeyleri incelemiştir. Araştırmaya katılan katılımcılar, basit tesadüf örnekleme yöntemiyle seçildi. Veri toplama aracı olarak yüz yüze anket tekniğini kullanılmıştır. Ankete katılım bankalarıyla aktif olarak çalışan 7,842 kişi arasından seçilen basit örneklem yöntemiyle %53'ü erkek ve %47'si kadın olmak üzere toplam 270 kişiyle anketin verileri ile çalışmayı gerçekleştirdik. Katılımcılara yöneltilen finansal okuryazarlık bileşenleri finansal bilgi düzeyi, finansal tutum, finansal davranış ve katılım bankacılığı bilgi düzeyi ölçekleri kullanılmıştır. Araştırma kapsamında elde edilen bulguların analizinde aritmetik ortalama, standart sapma, frekans dağılımı, güvenilirlik analizi, normallik analizi, faktör analizi, t-testi, varyans analizi, korelasyon analizi ve regresyon analizinden yararlanılmıştır. Analizler regresyon analizleri sonucunda, finansal okuryazarlığın tutum ve davranış üzerinde pozitif yönde katılım bankacılığı bilgi düzeyi üzerinde ise olumlu bir etkiye sahip olduğu belirlenmiştir. Elde edilen sonuçların literatürdeki sonuçları büyük ölçüde desteklediği tespit edilmiştir. Finansal okuryazarlık tutum ve davranış düzeylerinin demografik değişkenlere göre ve finansal bilgi düzeyine göre farklılaşma durumunun incelenmesinde T testi, tek yönlü Anova ve Tukey testleri kullanılarak elde edilen sonuçlar, bilgilerin analizinde tablolar halinde gösterilerekyorumlanmıştır. Araştırmaya katılan katılımcıların finansal okuryazarlık düzeyi seviyesi durumu finansal davranışlarının ve finansal tutumlarının gelişebilmesi için finansal eğitime ihtiyaç duyulmuştur. Bu çalışmanın bulgularına dayanarak, katılım bankalarıyla çalışan müşterilere ve bu konuda çalışma yapacak olan araştırmacılara önerilerde bulunulmuştur."
