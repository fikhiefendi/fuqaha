abstract: "Muhammed b. İdris eş-Şâfiî ve Ebubekr el-Cessâs, kendi mezhepleri dâhilinde ilk usûl-i fıkıh eserlerini yazan kimselerdir. Ayrıca İmam Şâfiî günümüze kadar ulaşan en eski usûl-i fıkıh eserinin sahibidir. Her iki müellif de beyân ve nesih konularına son derece önem vermişlerdir. Şâfiî,“er-Risâle”isimli eserinin ilk konusu olarak beyân konusunu işlemektedir. Cessâs da“el-Fusûl fi'l-Usûl”isimli eserinin ikinci cildine beyân konusuyla başlamaktadır. Cessâs, Şâfiî'ye beyân ve nesih konularında muhalefet etmiştir. Beyân ve nesih konuları, fıkhî hükümlere doğrudan etki etmesi cihetinden son derece önemli konular olduklarından dolayı Cessâs'ın bu eleştirilerinin incelenmesi ve anlaşılması çok önemlidir. Bu çalışmada Cessâs'ın Şâfiî'ye yönelttiği eleştiriler doğrudan incelenmiş; Cessâs dışında beyan ve neshe dair mezheplerin görüşlerine de yer verilmiştir. Cessâs'a göre Şâfiî'nin beyan tanımı ve taksimi son derece hatalıdır. Cessâs'a göre onun beyan tanımı anlaşılmayacak kadar kapalı olduğu gibi; beyân taksimi de tutarsızlıklar içermektedir. Aynı şekilde Şâfiî'nin nesih teorisini de eleştiren Cessâs onun Kur'an ve Sünnet'in birbirlerini neshedemeyeceği iddiasını şiddetle reddeder ve bu iddianın Hz. Peygamber'i yalancılıkla itham etmek olacağını ifade eder. Çalışmamız; giriş, üç bölüm ve sonuç kısımlarından müteşekkildir. Giriş bölümünde Cessâs ve Şâfiî'nin biyografilerine yer verilmiştir. Birinci bölümde Hanefî ve Şâfiî mezhebi ile Cessâs ve Şâfiî'nin beyân tarifleri ve taksimleri, ikinci bölümde de nesih tarifleri ve taksimleri detaylı olarak delilleriyle birlikte zikredilmiştir. Üçüncü bölümde ise Cessâs'ın Şâfiî'ye eleştirileri ve bu eleştirilerin analitik değerlendirmeleri yer almaktadır. Sonuç kısmında ise incelenen ihtilaflar ve varılan neticeler zikredilmiştir."
