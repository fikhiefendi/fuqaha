abstract: "Bu çalışma, Mali Cumhuriyeti'nde zekât yönetim sisteminin geliştirilebilme imkânını incelemeyi amaçlamaktadır. Çalışma, zekâtın İslami esaslara uygun olarak toplanması ve dağıtılması için kurumsal ve sistematik bir model inşa etmeyi, aynı zamanda zekâtın sosyal ve ekonomik amaçlarının gerçekleştirilmesini hedeflemektedir. Araştırma, Mali'de zekâtın kurumsal ve düzenli yönetim mekanizmalarının eksikliği sorunundan hareket etmektedir. Araştırma soruları; zekât yönetiminin kavramsal çerçevesi ve rolü, Mali'deki mevcut durum, geliştirme adımları, karşılaşılan zorluklar ve önerilen çözümler üzerine odaklanmaktadır. Çalışmada betimsel-analitik ve deneysel yöntem kullanılmış; mevcut duruma ilişkin veriler saha araştırmasıyla toplanmıştır. Araştırmanın temel bölümleri arasında; İslam'da zekât yönetiminin tanımı, sistemleri, harcama alanları ve kurumsal rolü ile Mali Cumhuriyeti örneği (saha çalışması, sonuçlar ve öneriler) yer almaktadır. Bu çalışma, zekâtın amaçları konusunda toplumsal farkındalığı artırmayı, devlet kurumları ve sivil toplum kuruluşlarının faydalanabileceği bir model önermeyi ve Mali'deki akademik literatüre katkı sağlamayı hedeflemektedir. Önerilen metodolojik çerçeve ve yapısal model, ulusal bir zekât yönetim kurumu kurulması, farkındalık kampanyalarının yürütülmesi ve zekâtın hak sahiplerine ulaşmasını güvence altına alacak şeffaflık ve izleme sistemlerinin oluşturulması yönünde pratik adımlar ve öneriler sunmaktadır."
