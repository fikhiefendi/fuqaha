abstract: "İslâm Hukuku'nun medenî hukuk alanında ilk kanunlaştırma örneği Mecelle'dir. Mecelle yalnız ülkemizde değil, Tunus, Irak, İsrail, Fas gibi birçok ülkenin de medenî hukukunun oluşmasında ilham kaynağı olmuştur. İşte bundan dolayı anlaşılabilmesi için Mecelle üzerine birçok şerh yazılmıştır. Çalışmamızın konusunu oluşturan Ali Haydar Efendi'nin ?Dürerü'l-Hukkâm Şerhu Mecelleti'l-Ahkâm? adlı eseri de Mecelle'nin en önemli şerhlerinden birisidir.Çalışmamız ?Dürerü'l-Hükkâm? adlı eserin büyû` bahsi ile alâkalı bilgileri içeren 230-299. maddelerinin kaynaklarının tespit ve tahkikinden oluşmaktadır. Kaynakların tespit ve tahkikini yapmadan önce ilgilenenlerin metinden faydalanmalarını kolaylaştırmak amacıyla metni Latin alfabesine aktardık. Bunu yaparken mümkün olduğunca metnin aslına sadık kalmaya özen gösterdik.Tezimiz giriş ve ana bölümden oluşmaktadır. Ana bölüm ise Ali Haydar Efendi'nin hayatı ile çalışmamızın konusunu oluşturan maddelerin Latin alfabesine aktarılması ve tahkikinden oluşmaktadır.Çalışmamızın amacı zikrettiğimiz bölümün kaynaklarının tahkik çalışmasını yaparak İslâm hukukçularının ve İslâm hukukuyla ilgilenenlerin bu eserden faydalanmalarını kolaylaştırmaktır."
