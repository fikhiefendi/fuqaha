abstract: "Bu çalışmada“İbn Sahibi'l-Hidaye”olarak meşhur, Nizamuddin Ömer İbn Ali Burhaneddin el-Merğinânî'nin (620 h. ?)“Cevâhirü'l-Fıkh”kitabının tahkiki ve incelemesi yapılmıştır. Müellif, Hanefi fıkhında yazılmış“el-Hidâye Şerhu'l-Bidaye”adlı kitabın yazarı Burhaneddin el-Merğinânî'nin çocuklarından biridir. Merğinânî'nin çok sayıdaki oğlundan ilmî faaliyetleriyle önce çıkanlarından biri de Nizamuddin Ömer'dir. Nizamuddin,“Cevâhirü'l-Fıkh”adlı kitabında özellikle Mâverâünnehir bölgesi ulemasının muhtasarları olmak üzere Hanefi mezhebinin birçok muhtasarını bir araya toplamış ve eserini babasının“el-Hidâye”kitabındaki tertibi üzere düzenlemiştir. Bu araştırma üç bölüme ayrılmıştır: Birinci bölümde tahkikte kullanılan yazma nüshalarla ilgili bilgiler verilmiş, ayrıca müellifin hayatı ve ilmi konumu ele alınmıştır. İkinci bölümde müellifin kitabını telifteki üslubu analiz edilmiş, hüküm istidlalindeki yolları ele alınmıştır. Ayrıca araştırmada kullanılan kaynaklar incelenmiştir. Son olarak kitabın Hanefi fıkhındaki önemi ve akademi dünyasına sunacağı katkılar işlenmiştir. Üçüncü bölümde ise metnin tahkiki yapılmış, gerekli dipnotlar, açıklamalar ve çeşitli fihristler eklenmiştir."
