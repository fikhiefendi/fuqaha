abstract: "ÖZET Araştırma konumuz,“İslâm Hukukunda Hukuki İşlemlerin Şarta Bağlılığı”, muamelat hukuku içinde yer almakta olup, hukuki işlemlerin şarta bağlanmasını ifade etmektedir. Şart, bir şeyin hukuken var olması kendisine bağlı olan durumlardır. Hukuki işlem ise, bir veya birden çok kimsenin hukuki bir sonuç doğurmaya yönelmiş irade beyanlarını ifade etmektedir. Şart, İslâm hukukunda temelde kanunî ve iradî olarak ikiye ayrılır. Kanunî şartlar bir hukuki işlemin hüküm doğurabilmesi için gerekli olan şartlardır. Bunlara hukuki işlemin geçerlilik şartları da denir. Çalışmamızın konusunu teşkil eden iradî şartlar ise; hukuki işlemlerde taraflarca belirlenen şartlar olup; hukuki işleme bitişik şartlar (takyîdî) ve geleceğe yönelik (ta'likî) şartlar olmak üzere ikiye ayrılır. Çalışmamız, giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, araştırmanın konusu, önemi ve amacı, kaynakları ve metodu üzerinde durduk. Birinci bölümde, çalışmamızı temellendirebilmek için, şart ve hukuki işlem kavramlarını ele aldık. İkinci bölümde, şart serbestisini de içine alan hukuki işlem serbestisini ana hatlarıyla inceledik. Şarta bağlanan hukuki işlemlerin hükümlerini incelediğimiz üçüncü bölümü, ta'lîkî şarta bağlanan hukuki işlemlerin hükümleri ve takyîdî şarta bağlanan hukuki işlemlerin hükümleri şeklinde iki kısma ayırdık. Sonuç itibariyle, kamu yararının gerektirdiği ve naslarca kesin olarak yasaklanmış durumlar hariç, kişilerin hukuki işlemleri şarta bağlı olarak yapmalarında bir sakınca bulunmamaktadır."
