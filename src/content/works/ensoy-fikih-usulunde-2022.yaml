abstract: "Bu tez, Giriş, İki Bölüm, Sonuç ve Kaynakçadan oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir. Birinci bölümde icmâ' ile örf arasında bir ilişkiden bahsetmemize zemin oluşturan düzlemler ile temel kavramlar ele alınmaktadır. İkinci bölüm icmâ' ile örfün ilişkili olduğu çeşitli bağlamlardan müteşekkil olup üç ana başlıkta incelenmektedir. Bunlardan ilki icmâ' ile örf mukayesesidir. Burada kaynaklar katılımcıları, konuları ve hükümleri bakımdan değerlendirilmektedir. Diğer başlık icmâ'ın kaynak olmasında örfün üstlendiği rolü irdelemektedir. Son kısımda ise icmâ'ın senedinin örf olması durumu ve bunun hükümlere yansımalarına yer verilmektedir."
