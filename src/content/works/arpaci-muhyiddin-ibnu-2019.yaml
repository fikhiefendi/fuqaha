abstract: "Disiplinler arası bir kavram olan rüyâ ile ilgili geçmişten günümüze pek çok araştırma yapılmıştır. Bu çalışmamızda; tasavvufî açıdan rüyâ konusu ele alındıktan sonra özele inilmiş ve Şeyh-i Ekber diye de bilinen Muhyiddin İbnü'l-Arabî'nin eserlerinde rüyâ konusu incelenmiştir. Bu bağlamda, İbnü'l-Arabî'nin sâdık rüyâlardan“mübeşşirât”hakkında yazdığı“Kitabü'l-Mübeşşirât”adlı eseri Türkçe'ye çevrilmiş ve tahlîli yapılmıştır.Çalışmamızın bütünlüğü açısından öncelikle; giriş bölümünde, İbnü'l-Arabî'nin kısaca hayatı, eserleri ve etkilerine yer verilmiştir. Sonrasında rüyâ olgusu ele alınmış ve mâhiyeti açıklanmıştır. Birinci bölümde; İslam âlimlerine ve mutasavvıflara göre rüyâ ve mahiyeti konusu işlenmiş olup rüyâ çeşitleri ve rüyâ yoluyla bilgi edinme hakkında bilgi verilmiştir. Sonrasında İbnü'l-Arabî'nin eserlerinde rüyâ ve İbnü'l-Arabî'de rüyâ yoluyla bilgi edinme konusu ele alınmıştır. İkinci bölümde;“Kitabü'l-Mübeşşirât”adlı risâlenin tanıtımı ve tahlîli yer almaktadır. Bu bölümde İbnü'l-Arabî'nin kendisinin gördüğü ya da başkalarından naklettiği mübeşşirât içerikli rüyâlardan edindiği bilgilerin; Kur'an ve Sünnette karşılığının olup olmadığı incelenmiş, varsa fıkhî boyutu izah edilmiştir. Çalışmamızın sonucunda; dinin temel kaynaklarında varlığı kabul edilen rüyâ olayının İbnü'l-Arabî'nin eserlerinde sıklıkla üzerinde durduğu konuların başında geldiği tespit edilmiş ve ona göre bilgi değeri taşıdığı belirlenmiştir."
