abstract: "Tez çalışmasının konusunu, Konya'nın Üç Numaralı Şer'iyye Sicil Defteri'nde yer alan vesîkaların fıkıh kitaplarındaki tasnif esas alınarak yapılmış olan transkripsiyonu ve konular hakkındaki bilgi ve değerlendirmeler oluşturmaktadır. Tez üç bölüm olarak tasarlanmıştır. Çalışmanın giriş bölümünde, İslâm adâlet teşkilatının menşei olan Hz. Muhammed (s.a.v.) dönemi ve tarihi seyri hakkında bilgi verilmektedir. Birinci bölümde Osmanlı'da devlet yönetimi ve hukûkun işleyişi üzerinde durulmuştur. İkinci bölümde defterin içeriği hakkında bilgi verildikten sonra çalışmanın ana konusunu teşkil eden vesîkaların transkripsiyonu verilerek bunlar üzerinde tahliller yapılmaktadır. Sicilde çok farklı konularda belgeler bulunmakla birlikte vakıflara dâir vesîkaların çokluğu dikkat çekicidir. Sicilde yer alan konular hakkında önce kısaca bilgi verilmiş, daha sonra değerlendirmelere geçilmiştir. Üçüncü bölümde ise defterdeki vesîkalardan yola çıkılarak elde edilen bulgular verilmiştir. Çalışmanın sonunda adı geçen sicil kayıtlarının orijinal metinleri ekler bölümünde verilmiştir."
