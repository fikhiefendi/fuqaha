abstract: "Adalet ve rahmet dini İslâm, insanlar arasındaki ilişkileri ve hayatı düzenleyen, fertlerin ve toplumun haklarını koruyan, eşitlik ilkesine dayanan bir dindir. Dinin tüm hususlarının nizama dayalı bir şekilde tatbik edilmesi ancak birtakım yasalar ve yaptırımlar ile mümkündür. İslâm'da cezalar dinin bir parçasını oluşturmakta, dini nizamı sağlamakta ve İslâm dini ile aynı gayeleri benimsemektedir. Zira İslâm ceza hukukunun amacı din, can, akıl, nesil ve malın korunması olarak karşımıza çıkmaktadır. Canın korunması ise ceza normlarının tatbiki ile mümkün olmaktadır. Bu çalışmamızda İslâm ve Türk ceza hukukundaki cana yönelik yapılan müessir fiiller ve yaptırımlarına değinilmiştir. Ayrıca Yargıtay kararlarından ve kadı sicillerinden örnekler verilerek hem teorik hem pratik anlamda iki hukuk sistemi mukayese edilmiştir."
