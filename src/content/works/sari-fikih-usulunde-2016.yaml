abstract: "Mutlak ve mukayyed İslâm Fıkıh Usûlü ile ilgili iki farklı kavramdır. Nassların anlaşılmasında önemli bir yere sahiptirler. Mutlak, herhangi bir kayıtla kayıtlanmamış bir lafız olup kendi cinsinde yaygın olan fert veya fertlere delâlet eder. Mukayyed ise vasıf, hal, gaye ve şart gibi kayıtlar ile kayıtlanan şeyin mâhiyetine delâlet eden lafızdır. Gerek Kur'ân ve gerekse Hadis nasslarında, mutlak olarak yer alan bir lafız takyîdine dair herhangi bir delil bulunmadıkça bütün İslâm hukukçularınca, mutlak olarak kabul edilir ve o nasstan o doğrultuda hüküm istinbât edilir. Eğer mutlak lafzın mutlaklığını takyîd edecek herhangi bir delil sabit olursa mutlak lafız, mukayyed lafza hamledilerek mukayyed lafzın hükmü ile amel edilir. Ancak İslâm hukukçuları, mutlakın hangi durumlarda hamledilip hangi durumlarda hamledilmeyeceği konusunda farklı görüşler ileri sürmüşlerdir. Bunun yanında hamlin, takyîd mi yoksa nesih mi olduğu konusu âlimler arasında görüş ayrılığına yol açmıştır. Mukayyed lafzın da aynı şekilde aksi bir delil sabit olmadığı sürece mukayyed olarak kabul edileceğinde İslam huhukçuları görüş birliği içerisindeler. Mutlak ve mukayyed kavramlarından doğan görüş farklılıkları İslâm Fürû' Fıkhında ihtilaflara yol açmıştır."
