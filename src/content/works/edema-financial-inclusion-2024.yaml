abstract: "Birçok bireyin finansal hizmetlere erişiminin olmadığı Afrika'da, kapsayıcı finansal sistemler oluşturmak büyük bir önceliktir. Bu çalışma, Afrika ülkelerinde dinin finansal katılımı nasıl etkilediğini araştırmaktadır. Din, pek çok Afrikalı birey için önemli olup onların değer yargılarını ve ekonomik davranışlarını etkilemektedir. Bu çalışmada 2021 yılı Dünya Bankası Küresel Findex Veritabanı verileri, 40 Afrika ülkesine odaklanarak analiz edilmiştir. İstatistiksel analiz Stata kullanarak yapılmış, hesap sahipliği ve finansal katılımın önündeki engeller gibi faktörler araştırılmıştır. Bulgularımız, özellikle Müslüman ağırlıklı ve İslam İşbirliği Teşkilatı (İİT) üyesi ülkelerde hesap sahipliğinde istatistiksel olarak anlamlı farklılıklar olduğunu ortaya koymuştur. Dolayısıyla bu bulgular, özellikle İİT üyesi ve Müslüman ağırlıklı ülkelerde, İİT dışı ve Müslüman azınlık ülkelerdekine kıyasla daha fazla olarak, hesap sahibi olmamada dini sebepleri öne süren bireyler için dini inançlar ile finansal davranışlar arasında bir bağlantı olduğunu göstermektedir. Ayrıca, İslami finans kurumlarının varlığının, resmi finansal hesap sahipliğini artırıcı yönde etkilediği ve bu durumun, Afrika'daki Müslüman çoğunluklu ve İslam İşbirliği Teşkilatı üyesi ülkelerde finansal katılımı artırmaya yönelik potansiyel bir yol olduğu gözlemlenmiştir. Bu etkiyle birlikte Afrika'da, fon eksikliği ve finansal kurumlara duyulan güven eksikliği gibi daha büyük engellerin de varlığı gözlemlenmiştir. Dolayısıyla, Afrika'da finansal katılımı teşvik etmek için din ve sosyoekonomik durum gibi faktörler dikkate alınarak tasarlanması gerektiği düşünülen özel müdahalelere olan ihtiyacın altı çizilmektedir."
