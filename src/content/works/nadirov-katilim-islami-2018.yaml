abstract: "1970'lerde petrol krizi ve petrol fiyatlarında kesin artıştan dolayı petrol zengini olan İslam ülkelerinde fonlarının bankacılık sistemlere yatırılması gereksinimi duyulmuştur. Bankacılık sistemine faizin haram olması nedeniyle fonlarını yatıramayan Müslüman hane halkın sermayeleri elinde atıl vaziyette kalmıştır. Bunun sonucu olarak katılım bankacılık sektörü önemi artarak hızla tanınmış ve gelişmiştir. Bu çalışmada, Türkiye'deki banka müşterilerinin katılım bankacılığının tercih etme sebepleri, katılım bankacılığı ürün ve hizmetleri hakkında bilgi düzeylerin belirlenmesi hedeflenmiştir. Öte yandan, katılım ve ticari bankacılığı kullanan müşterilerin dini yönelim ve finansal okuryazarlık puanları karşılaştırılmıştır. Katılım bankacılığı etkileneceğini düşünülen değişkenlerden (dini yönelim, finansal okuryazarlık, katılım bankacılığı hakkında bilgi sahibi olma, yaş, cinsiyet, medeni durum) bir model oluşturulmuş ve bu modelin katılım bankacılığı kullanabilme tahmin gücü ölçülmüştür. Çalışmanın örneklemi toplam 207 banka müşterisinden (79'u katılım bankacılığı ve 128'i ticari bankacılığı müşterisi) oluşmaktadır. Yapılan analizlere göre;“Dini Nedenler”,“Faiz Kavramından Tamamıyla Uzak Kurumlar Olmaları”,“Personelin Yakın İlgisi”katılım bankacılığını en fazla tercih etme sebepleri olarak bildirilmiştir. Bağımsızlık örneklem t testi ile katılım bankacılığı müşterileri ile ticari banka müşterilerinin dini yönelim açısından farklılaştıkları; ancak finansal okuryazarlık açısından farklılaşmadığı tespit edilmiştir. Oluşturulan lojistik regresyon modeline göre dini yönelim, katılım bankacılığı hakkında bilgi sahibi olma ve cinsiyetin (erkek olmanın) katılım bankacılığını kullanmayı olumlu yönde, finansal okuryazarlığı ise olumsuz yönde etkilediği tespit edilmiştir. Diğer taraftan, yaş ve medeni durumun katılım bankacılığı kullanımı üzerinde anlamlı bir etkisine rastlanmamıştır."
