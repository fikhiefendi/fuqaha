abstract: "Bu çalışmanın amacı، İslami Bankalarda Basel III anlaşmasına göre likidite riskinin yönetiminin incelenmesi ve İslami Bankalardaki risklerin gerçekliğini ve bu risklerin yönetiminin niteliğinin bilinmesidir. Bu araştırmada، İslami bankalarda likidite yönetiminin kavramsal çerçevesini aydınlatmaya önem verdim. Bu hususta، çalışmanın teorik bölümünde var olan Arapça ve İngilizce referanslar ile araştırmacı tarafından ulaşılabilen tüm mevcut raporlar، istatistikler ve süreli bilimsel yayınlar kullanılmıştır. Araştırmada Dedüktif ve İndüktif yöntemler entegre olarak kullanılmıştır. Bu yöntem çalışmanın genel çerçevesi (teori) ile Suudi Arabistan'daki İslami Bankaların pratikliği arasında bir korelasyon ve ayrılmazlık olduğu gerçeğine dayanmaktadır. Araştırma bir dizi tavsiyeyle sonuçlanmıştır."
