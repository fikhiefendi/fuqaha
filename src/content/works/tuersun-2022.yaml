abstract: "Bu Araştırmada İbn Emîr Hacc (ö. 879/1474) olarak bilinen âlim Şemsüddin Muhammed b. Muhammed'in“Halbetü'l-mücellî ve büğyetü'l-mühtedî”adlı kitabındaki fıkhî konulardan birkısmı ele alınmıştır. Söz konusu eser, allame Muhammed b. Muhammed b. Alî el-Kaşgarî'(ö. 705/1306) nin“Münyetü'l-musallî ve gunyetü'l-mübtedî”adlı eserinin şerhidir. İbn Emîr Hacc, bu eserinde“Münyetü'l-Musallî ve Gunyetü'l-Mübtedî”deki konuları, bazı tenkitleriyle birlikte izah ederek incelemiş ve irdelemiştir. Konuyu işlerken yaptığı eleştiriler, söz konusu eseri diğer bir çok şerhten ayıran ciddi faydalar temin etmesidir. Bu araştırma, eleştirilere örnek teşkil edecek bazı meseleleri ele alıyor ve onlara yöneltilen eleştirileri üç noktaya odaklanarak analiz etme girişiminde bulunuyor: - Eleştiri konusu, - Eleştiri yönü, - Fakihlerin sözlerinden bu konuyla alakalı olarak mutemet kitaplarda belirtilenler ışığında elden geldiği kadar değerlendirilmesi. ANAHTAR KELİMELERİ: \"Halbetü'l-mücelli ve bugyetü'l-mübtedi fi şerhi Münyeti'l-musalli ve gunyeti'l-mübtedi, İbn Emir Hac, İmam Sediduddin Kaşgari, Maveraünnehir, Kaşgari, Namaz, İlmihal"
