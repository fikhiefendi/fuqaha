abstract: "Bu çalışmada, mezhebin ana kaynakları ve bunları bir araya getiren aynı zamanda içeceklerle ilgili zengin bir içerik sunan Mervezî?nin el-Kâfî adlı eseri çerçevesinde, muasırı âlimlerin eserlerini de dâhil etmek suretiyle, İslâm hukukunda içecekler bölümünün nasıl incelendiği ortaya konmaya çalışılmıştır. Çalışmada içecekler konusu, her içecek özelinde, mezhep imamlarının ve müelliflerin görüşlerine yer verilerek ayrıntılı olarak işlenmiştir. Buna göre, Ebû Hanîfe?nin ve Ebû Yûsuf?un genelde aynı görüşte olmakla birlikte içeceklerle ilgili her türlü hükmü göz önünde bulundurarak bütüncül bir yaklaşım izledikleri, İmam Muhammed?in diğer ikisine göre daha ihtiyatlı davrandığı görülmüştür. Müteakip dönemlerdeki fıkıh âlimlerinden Mervezî ve Cessas?ın, genelde Ebû Yûsuf?un görüşlerini benimsemiş oldukları, Tahâvî?nin ise haram içeceklerin dairesini en dar tutan kişi olmakla birlikte mütesahil bir tavır sergilemediği gözlemlenmiştir. Eşribe bölümlerinde müellifler pek çok hususa değinmiş ve cereyan eden çeşitli tartışmalara yer vermişlerdir. Ayetlerle haramlığı sabit olan hamrın mahiyeti, buna bağlı olarak kapsamı, ?çoğu sarhoş edenin azı da haramdır? rivayeti, mezhep imamlarının, müelliflerin kendi aralarında ve diğer mezheplerle görüş ayrılığına düştükleri temel problem noktalarıdır. Yine Hz. Peygamber ve sahabenin nebiz içip-içmedikleri, nebizlerin muhtevası, sarhoşluğun tanımı, sarhoş kimseye verilecek ceza, sarhoş edici içeceklerin alım-satım ve tazmini gibi konular da ihtilaflı hususlar olup çalışmanın kapsamı dâhilinde ele alınmıştır."
