abstract: "02. Özet Bu çalışmada Milli Kütüphane Arşivi'nde bulunan 1868 no'lu şeriyye sicili ışığında belli bir süreçte Trabzon'un idari, toplumsal ve ekonomik tarihi ele alınmaktadır. İlk bölüm idari bir merkez olarak Trabzon'un önemine işaret eder. 18. yüzyıl başlarında Trabzon'a bağlı 13 kaza yanında kentin 40 mahallesi mevcuttu, mahallelerin 11 'i müslüman olmayanların isimlerini almıştı. Bu mahalleler nüfus itibariyle karışık veya gayr-ı müslimlerin belki yoğunluk teşkil ettiği mahalleler olmalıdırlar. İkinci bölüm, Trabzon'un toplumsal tarihi ile ilgilidir. Müslümanlar ile Ortodoks Rumlar kentin esas nüfus yapısını oluşturmaktaydılar. Ancak, kentte az sayıda da o.'sa Yahudi ve Ermeni milletlerine mensup insanların yaşadığı gözlenmektedir. Bu araştırmada yer alan sicil kayıtlan kentte yaşayan bütün dini zümreler arasında iyi ilişkiler olduğunu açıkça göstermektedir. Farklı dinsel milletlere mensup kadınlar davaların odak noktası olmakta ve günlük hayatın içinde aktif olarak yer almaktadırlar. Üçüncü bölümde kentin 18. yüzyıl başlarındaki ekonomik tarihi inceleniyor. Bu yıllarda Trabzon'un ekonomik hayatı, özellikle tarihi ipek yolu ile gelip giden tüccarlar sayesinde bir canlılık göstermektedir. Gümrük kayıtları kentin milletlerarası ticarette çok etkin olduğunu ve bölgeler arası ticari faaliyetlerde önemli bir yere sahip olduğunu ortaya koyuyor. Trabzon'da çok sayıda vakıf tesis edilmişti. Bunlar, fakirlere ve düşkünlere yardım etmeleri kadar aynı zamanda çeşitli ihtiyaç veya iş-güç sahiplerine borç veren mali fınans merkezleri olarak önemli bir fonksiyon görmekteydiler. Sonuç olarak, bu bölümde Osmanlı İmparatorluğu'nun 18. yüzyılda girdiği savaşlar yüzünden Trabzon'da ticari yaşamın gerilemediğine tam aksine canlılığını devam ettirdiğine dikkat çekilmektedir. VI"
