abstract: "İslami bankacılık sektörü sadece Türkiye'de değil tüm dünyada çok önemli bir sektör haline geldi. Geçmişte İslam toplumları, faiz ödemeye gerek kalmadan İslami sistemi geliştirmeye çalıştılar, bu yüzden İslami bankacılık te gelişti, bu da İslami bankacılığı geleneksel sistemden farklı oalarak özel bir sistem haline getirmişti. Örneğin, önceki İslam medeniyetlerinde çek ve diğer hizmetler gibi finansal araçlar. Bundan sonra İslami bankacılık, geleneksel bankalara rakip değil, geleneksel bankacılığı tamamlamak ve İslami bankacılığın özel bir durum teşkil ettiği şeylere artık uygun olmayan standartlar yerine İslami bankalara uygun hale gelmek için modern biçimlerde ortaya çıkmaya başladı. Türkiye'deki İslami bankalar bu arada hala İslami standartlar yerine Uluslararası standartları kullanıyorlar, 2020'den sonra ise Türkiye'deki katılım bankalarına İslami standartları kullanma seçeneği sunulacaktır, ancak her iki standart arasında önemli bir fark var. İslami Finansal Kurumlar Muhasebe ve Denetim Kurumu (AAOIFI) tarafından yayınlanan İslami kurumlar için bazı standartlar bulunmaktadır. Tez, Bahreyn'deki Al Baraka Banksı ve Türkiye'deki al Baraka Türk Banksı ile ilgili olarak Uluslararası Muhasebe Standartları 1 ile Finansal Muhasebe Standartları 1 arasındaki farklılıkların açıklığa kavuşturulmasına odaklanmaktadır. Mali tabloların amaçları, kalemleri, hazırlanma esasları, uygunluk beyanı, yabancı para birimleri, mali sözleşmeler, gerçeğe uygun değer, kredi riski, likidite riski ve zekattan oluşan muhasebe politikaları bakımından karşılaştırma yapıldığı durumlarda. Öncelikle Türkiye'de İslami bankacılığın tarihçesi sunulacak, ardından Türkiye'de ve dünyada İslami bankacılıkla ilgili düzenlemeler ve finansal raporlama standartları anlatılacaktır. Son bölümde ise seçilen standartlar için bankaların UMS1 ve FAS1'e göre sunum ve açıklamaları incelenecek, aralarındaki farklar belirlenecek ve önerilerde bulunulacaktır."
