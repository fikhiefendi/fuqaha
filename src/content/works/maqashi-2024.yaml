abstract: "Bu çalışma, İslâm hukukunun klasik ve modern anlamda en önemli konu ve sorunlarından biri olan İslâm'da uluslararası ilişkiler hukukunun, zarûrât-ı hamsenin (din, can, nesil, akıl ve mal) gözetilmesi ve İslâm'ın şahısların hayatlarının dayanağı ve toplumun varlığı için elzem olan bu gereklilikleri korurken çağdaş uluslararası ilişkilerin gereklerini nasıl yerine getirdiği gibi konuları ele almaktadır. Bu hususlar aynı zamanda Müslümanlarla diğer din mensupları arasındaki uluslararası etkileşimin de merkezi konularıdır. Çalışmada, bu ihtiyaçların öneminin ifade edilmesi, bunlara nasıl bakılması gerektiği, koruma yolları ve ilgili hukuki delillerin gözden geçirilmesi gibi konulara odaklanılmıştır. Bu bağlamda İslâm'da uluslararası ilişkilerin en önemli temel ilkeleri olan yardımlaşma, adalet, hoşgörü, ahitlerin yerine getirilmesi, karşılıklılık ve bunların zarûrât-ı hamse ile ilişkilerinin açıklanmasına da dikkat edilmiştir. Çalışmada, uluslararası ilişkilerin İslâmi perspektiften doğru ve dengeli bir şekilde anlaşılması amacıyla İslâm hukukunun insanların hayatları için her zaman ve her yerde geçerli olduğu gerçeğini güçlendirecek şekilde İslâm'da uluslararası ilişkiler hukuku ve zarûrât-ı hamseye (din, can, nesil, akıl ve mal) önem verilmesi hedeflenmiştir. Çalışma, tümdengelimci ve tarihsel yaklaşımın temsil ettiği entegre bir metodolojiye, metin analizine, uluslararası ilişkilerde hukuk hükümleri ile İslâmi ilkeler arasında karşılaştırma, tarihsel ve gerçekçi örneklerin delil olarak sunulması dahil olmak üzere çeşitli yöntem ve tekniklere dayanmaktadır. Çalışma, İslâm'daki uluslararası ilişkiler hukukunun zarûrât-ı hamseyi muhafaza ettiğini, diğer şeriatlarda ve teorilerde bu hususun benzerinin olduğunu ortaya koymuştur. Ayrıca, bunu İslâm hukukunun en önemli amaçlarından biri olarak görmekte, bireylerin ve toplumların haklarını korurken devletler arasında barış, adalet ve iş birliğinin sağlanması için kapsamlı bir çerçeve sunmaktadır. Çalışma ayrıca İslâm'ın dini azınlıkların ve insan haklarının korunmasına herkes için güvenli ve istikrarlı bir ortam sağlanmasına büyük önem verdiğini de vurgulamıştır."
