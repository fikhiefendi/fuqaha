abstract: "HIV salgını yaklaşık 30 yıl önce ortaya çıkmış ve bugüne kadar genç yaşlı birçok insanın ölümüne sebep olmuştur. Kıta olarak Afrika, hastalığın görüldüğü insan sayısı olarak en yüksek istatistiklere sahiptir. Bu kıta genelinde HIV salgınının Sahraaltı Afrika ülkelerinde MENA bölgesine kıyasla sayıca daha yüksek oranlarda olduğu görülmektedir. MENA bölgesi çoğunluk olarak müslüman ülkelerden oluşmasıyla bilinir. Bu bölgedeki HIV yoğunluğu oldukça düşüktür. Bunun nedenlerinden biri de frengi, bel soğukluğu ve tedavi edilemez bir şekilde daha da çok yayılan HIV gibi cinsel yolla bulaşan hastalıklara maruz bırakan bazı faktörleri yasaklayan katı islami kuralların bölgede kabul görmesi ve uygulanmasıdır. İslamda poligami sıkı kurallar ekseninde izin verilen, dikkatle ve özel nedenlerle uygulanan bir sistemdir. İslamdaki katı poligami politikası sıklıkla anlaşmalı çoklu birliktelikle karıştırılır. Bu çalışma poligamiyi ve HIV'in yayılmasının azaltılmasındaki 100% etkisini ve poligaminin HIV le nasıl zıt bir ilişkisinin olduğunu açıklığa kavuşturmaktadır"
