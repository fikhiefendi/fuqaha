abstract: "Bu çalışmanın amacı katılım bankalarının kurumsal yönetim değişkenleri ile finansal performansları arasındaki ilişkiyi incelemektir. Çalışmamızda 2018-2021 yılları arasını kapsayan çeyrek dönem verileri Türkiye'de faaliyet gösteren 6 katılım bankasının yıllık faaliyet raporlarından toplanarak istatistiki veri haline getirilmiştir. Literatürdeki ulusal ve uluslararası çalışmaların değişkenleri dikkate alınarak çalışmada kullanılacak değişkenler belirlenmiştir. Bağımlı değişkenler; hisse başına kazanç (EPS), varlık getirisi oranı (ROA) ve öz sermaye getirisi (ROE), bağımsız değişkenler ise firma yaşı, yönetim kurulu büyüklüğü, danışma kurulu büyüklüğü, işletme büyüklüğü (aktif büyüklük) olarak belirlenmiştir. Çalışmada Panel Veri Analiz Yöntemi kullanılmıştır. Yapılan analizler sonucunda, hisse başına kazanç ve öz sermaye karlılığı oranı ile danışma kurulu ile finansal performansı arasında pozitif ve anlamlı bir ilişki tespit edilmiştir. Yönetim kurulu büyüklüğü ile negatif ve anlamsız bir ilişki tespit edilmiştir."
