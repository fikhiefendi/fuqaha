abstract: "ÖZET Pegile İnterferon/Ribavirin Kombinasyon Tedavisi alan Kronik hepatit C Hastalarında İnterlökin 28B Polimorfizmlerinin Tedavi Yanıtına Etkisi Amaç: Hepatit C virüsü enfeksiyonu dünya genelinde yaklaşık 210 milyon kişinin enfekte olduğu; kronik hepatit, siroz ve hepatosellüler karsinom ile sonuçlanabilen sağlık sorunudur. Pegile interferon ve ribavirin kombinasyonu ile % 50 oranında başarı elde edilebilmektedir. Tedaviye yanıtının hastalar arasında değişiyor olması genetik çalışmalara ihtiyaç doğurmuştur. Bu çalışmada kronik hepatit C hastalarında önemli genetik polimorfizm olan IL28B çalışılması ve viral yanıta etkisinin incelenmesi amaçlanmıştır. Materyal-metod: Bu çalışmaya kliniğimizde takip ve tedavi görmüş 60 kronik hepatit C hastası alınmıştır. Hastalar retrospektif olarak incelenerek pegile interferon ve ribavirin kombinasyonu ile tedavi edilmiş ve tedavinin üstünden 6 ay geçmiş hastalar incelenmiştir. Hastaların demografik özellikleri ve tedaviye cevapları kaydedilmiştir. Hastaların kanlarından izole edilen DNA örneklerinden LC 480 Hepatit C IL28B Mutasyon kiti ve LightCycler® 48 cihazı kullanılarak polimeraz zincir reaksiyonu ile IL28B tek nükleotid polimorfizmleri Rs12979860 ve Rs8099917 varyant analizi yapılmıştır. Bulgular: rs12979860 varyantları çalışıldığında, C/C 13 (% 22,4), C/T 37 (% 63,8) ve T/T 8 (% 13,8) tespit edilmiştir. Kalıcı viral yanıt C/C olan grupta (% 100, n=13), C/C olmayan gruba (% 65,7, n=30) göre daha yüksek bulunmuştur (p=0,012). Rs8099917 varyantları çalışıldığında ise T/T 29 (% 52,7), T/G 22 (% 40) ve G/G 4 (% 7,3) hastada tespit edilmiştir. Kalıcı viral yanıt T/T olan grupta (% 82,5, n=24), T/T olmayan gruba (% 61,5, n=16) göre daha yüksek bulunmuştur, istatistiksel olarak anlamlı ilişki bulunamamıştır. (p=0,129). C/C allellerinin yanında erken viral yanıt ve önceden tedavi görmemiş olmak, kalıcı viral yanıt elde etmek açısından prediktif bulunmuştur (p˂0,0001ve p=0,004). Sonuç: IL28B tek nükleotid polimorfizmi Rs12979860 C/C alleli kalıcı viral yanıt açısından prediktif değere sahiptir.IL28B C/C genotipik özelliğe sahip hastalarda tedavi cevabını önceden tahmin etmek; bu sayede tedavi süresini kısaltmak ve ilaçların toksik etkilerinde kaçınmak gelecekte seçenek olabilecektir. Genetik çalışmaların ışığı altında yeni tedavi rejimleri gelişmesi uzak değildir."
