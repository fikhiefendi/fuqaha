abstract: "Tâbiîn döneminden itibaren belirginleşen ve daha çok ehl-i hadis ve ehl-i re'y diye anılan iki ilim muhiti arasındaki tartışmalar, hadislerin tedvini ve mezheplerin teşekkülü yanında fıkhu'l-hadis ilminin ortaya çıkmasında ciddi bir paya sahip olmuştur. Bu tartışmaların oluşturduğu fikrî potansiyelin ilk kapsamlı ürünü olan İbn Ebî Şeybe'nin el-Musannef'i kendisinden sonra gelenlere örneklik etmiştir. Nitekim onun talebesi ve ehl-i hadisin önde gelen ismi İmam Buhârî el-Câmi'ü's-sahîh'inde ve bazı özel risâlelerinde farklı bir üslûpla Ebû Hanîfe'ye olan itirazlarını yazıya geçirmiştir. Ehl-i re'yin ve ehl-i hadisin iki otorite imamı Ebû Hanîfe ile Buhârî arasındaki bu fıkhî ihtilaflar ilim ehli nezdinde her zaman merak uyandırmış olup, tezimizde bunlar farklı bir yöntemle ele alınmıştır. Birinci bölümde Ebû Hanîfe / Hanefîler ile Buhârî arasında fıkhın değişik bölümlerindeki belli başlı ihtilâf konusu meselelere genel bir bakış yapılmaya çalışılmış; ikinci bölümde (namaz konusunda öne çıkan örnekler çerçevesinde) Hanefî mezhebinde Buhârî rivayetlerine ters düşen hükümler, tarihî süreç içinde karşılaşılan farklı yaklaşımlar ışığında analize tâbi tutulmuştur. Yaptığımız incelemeler söz konusu hüküm farklılıklarının bir çoğunun fıkhî ihtilâfların genel olarak bilinen sebepleriyle ilintili olması yanında, zıtlık bulunduğu bilinen birçok meselede gerçekte zıtlığın olmadığını göstermiştir. Bunun yanında, fıkhî bir meselenin hükmü ile ilgili olarak aynı mezhep içinde farklı tavırların gelişmesinde tarihî, coğrafî ve sosyo-kültürel şartların önemli bir etkiye sahip olduğu da gözlenmiştir."
