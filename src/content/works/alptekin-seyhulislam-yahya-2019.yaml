abstract: "Klâsik Türk edebiyatının belkemiği denilebilecek aşk ve şarap kavramları çalışmanın temelini oluşturmaktadır. Her bir kavram şairler tarafından kendilerine özgü anlayış ve hayal dünyasında yoğrularak yazıya aktarılmıştır. Dîvân şiirinde önemli bir yer tutan aşk ve şarap kavramı şairler için her zaman en önemli malzeme olmuştur. En zarif söyleyişlerle bu kavramlara şiirlerinde yer veren şairler, derin manaları da ihtiva edecek şekilde kendilerini ifade etmeyi amaçlamışlardır. Edebi kültürümüzü oluşturan bu iki temel unsurun ele alınış biçimlerini incelemek çalışmanın temel konusudur. Çalışmaya konu olan şairlerin dîvânları taranarak ilgili kavramların tespiti yapılıp ayrı ayrı bölümler hâlinde başlıklar altında incelemesi yapılmıştır. Giriş bölümünde kavramlar ile ilgili bilgi verildikten sonra şairlerin yaşadıkları dönemler, hayatları, edebî şahsiyetleri ve eserleri hakkında bilgi verilmiştir. Esas bölümde bu kavramların ilgili başlıklar altında incelemesi yapılmış, sonuç bölümünde elde edilen bilgiler ışığında gerekli değerlendirme yapılmıştır. Kaynakça bölümünde ise bu çalışmanın hazırlanması konusunda faydalanılan kaynaklara yer verilmiştir."
