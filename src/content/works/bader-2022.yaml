abstract: "Bu çalışmada, İslami finans kurumlarında takipteki kredilerin olgusunu ve genel olarak bireylerin ve toplumun üzerindeki etkisini anlamayı amaçlanmıştır. Ardından, takipteki kredilerin olgusunu ele almak için gerçek Şeriat hükümlerine tabi olan çözümleri bulunmaya çalışılmıştır. İslami finans kurumlarının deneyimlerini ve takipteki kredilerin olgusunu ele almanın yollarını belirlemenin yanı sıra, Filistin İslami finans kurumlarının deneyiminin içinde özellikle korona salgını gibi krizler ışığında önerilen çözümleri ortaya koyulmuştur. Araştırmacı, bir açıdan tez konusunun çalışmasına daha derinden incelemek için bazı İslami finans kurumlarının performansını etkileyen performans göstergelerini analiz ederek, diğer yandan çalışmanın konusu ile ilgili verileri inceleyerek bilimsel analitik yaklaşımı izlemiştir. Bunu, bazı İslami bankalar ve finans kurumları için yayınlanan yıllık raporlardan incelenen verileri toplayarak yapılmıştır. İlave olarak, Filistin Para Otoritesi, Sermaye Piyasası Otoritesi ve diğerleri gibi düzenleyici otoritelerin raporlarının kullanılmasının yanı sıra, çalışmanın konusu ile ilgili kaynaklara ve referanslara göre revizyon edilmiştir. Çalışmanın sonunda, ele alınan bir takım sonuç ve öneriye ulaşılmıştır."
