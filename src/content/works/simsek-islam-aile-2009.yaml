abstract: "Şimşek, Esra, İslam Aile Hukukunda Kadının Hak Arama Hürriyeti, Yüksek Lisans Tezi, Danışman: Prof. Dr. İbrahim Çalışkan, VII+115 s.Bu tez, bir Giriş ve iki Bölümden oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir.İlk bölümde, hak arama hürriyeti kavramına zemin oluşturması bakımından, hak ve hürriyet kavramları ele alınmaktadır. Ayrıca, ilk bölümde, hak arama hürriyetinin, tarihçesi, çeşitleri ve kadının hak arama hürriyetinin hukuki dayanakları ile ilgili açıklamalar yer almaktadır.Tezin ikinci bölümünde ise, kadının ailede hak arama hürriyetinin bulunduğu alanlar işlenmiştir. İkinci bölüm, sistemli olması bakımından, üç bölüme tahsis edilmiştir. Bu bölümler, evlilik müddeti içinde hak arama hürriyeti, evliliğin sona erme sürecinde kadının hak arama hürriyeti ve evlilik sonrası kadının hak arama hürriyeti şeklindedir."
