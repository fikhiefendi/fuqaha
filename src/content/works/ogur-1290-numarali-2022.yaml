abstract: "Özel anlamda Gebze tarihi genel anlamda Osmanlı tarihi çalışmalarına katkıda bulunacağı düşüncesiyele 1290 Numaralı Gebze Şer'iyye Sicili defterini yüksek lisans tez konusu olarak hazırlanmıştır. 1290 Numaralı Gebze Şer'iyye sicilinin Osmanlıca metninin günümüz Türkçesine çevilirken metne sadık kalınmıştır. 1290 Numaraları Gebze Şer'iyye Sicili, Gebze Tarihi, Şer'iyye Sicilleri tarihi ve içeriği, 1290 Numaralı Gebze Şer'iyye Sicili Transkripsyonu, değerlendirme olarak toplam dört bölümden oluşmaktadır. Sicil toplamda 74 sayfadan oluşmaktadır. Bu sayfaların tamamının transkripsyonu yapılarak değerlendirildi. Çalışmamızın özet halindeki tablosu, sicil içerisindeki davaların tamamına cevap verecek niteliktedir. 1290 Numaralı Gebze Şer'iyye sicili başlıca konuları: boşanma, nikâh akdi, rûz-ı hızır (mali hesapların kayıt edildiği defter), veraset, kadı ve naib tâyinleri, darp, vergi tahsili için gelen fermanlar gibi konulardan oluşmaktadır. Şer'iyye sicilleri kaleme alındığı dönem hakkından önemli bilğileri içermektedir. Siciller bir şehrin veya bölgenin sosyol, ekonomik, kültürel, hukukî, idârî vb. birçok konuda önümüze ışık tutmaktadır. Aynı zamanda yazıldığı yıl içerisinde meslek grupları, giyim kuşam, bulunduğu bölgeler içerisinde ticari faaliyetler, bölge içerisinde yogunlukta yaşayan Müslim ve Gayrimüslim bölgelerin belirlenmesi, kullandıkları eşyalar hakkında bilgi edinile bilmektedir. Çalışmamızın asıl metni İstanbul'daki Türkiye Cumhuriyeti Cumhurbaşkanlığı Osmanlı Arşivinde bulunan 1290 Numaralı Gebze Şer'iyye Sicili'nin transkripsyonudur. Hicrî 1246-1248 / Miladi 1830-1832 yıllarını kapsayan Gebze şer'iyye sicili ile Gebze'nin toplumsal, kültürel, iktisadî, idarî ve hukukî hayatı hakkında bilğiler sunmaya çalışıldı."
