abstract: "Müfessirin ihtiyaç duyduğu önemli gramer kuralları adlı bu çalışma: Arapçadaki çeşitli gramer kuralları; zamirleri, et-Teẕkîr ve't-teʾnîs̱ (eril ve dişil), tarif-tenkir (belirli ve belirsiz), tekillik- çoğulluk, soru – Cevap, eşanlamlılık, mastar, atıf, isim ve fiil ile çağırma gibi gramer kuralları ve diğer farklı gramer kurallarını inceleyerek müfessirlerin metotlarında, bu gramer kurallarını ne ölçüde dikkate aldıklarını ve hangi derecede önemsediklerini ortaya koymaya çalışılacaktır. Bu çalışmanın teorik ve pratik yönleri bulunmaktadır. Teorik yönü: Gramer kurallarından bahsederek bunların açıklamalarını yapmaktadır. Pratik yönünde ise: Ayetlerden örnekler getirilerek bu gramer kurallarının nasıl uygulanması gerektiği ortaya konulmuştur. Bu çalışmada tanımlayıcı ve tümevarım yaklaşımı benimsenmiştir. Bu çalışma takdim, giriş ve iki bölümden oluşmaktadır. Her bölüm altında birkaç başlık ve mes'ele yer almaktadır. İlk bölüm altı başlıktan oluşup, zamirler, et-Teẕkîr ve't-teʾnîs̱ (eril ve dişil), tarif-tenkir (belirli ve belirsiz), tekillik- çoğulluk, soru-Cevap, eşanlamlılık ile ilgili kuralları içermektedir. İkinci bölüm ise: dört başlıktan oluşup, mastar, atıf, isim ve fiil ile çağırma gramer kuralları ve farklı gramer kurallarından ibarettir. Bu çalışma önemli sonuçlarla sonuçlanmıştır, en önemlileri ise: Müfessirlerin kullandığı Arapça gramer kuralları çok kapsamlı kurallar olup, Kuranın lafızlarına (anlamlarına) Egemenlik değil rehberlik etmektedir. Bu nedenle Müfessirlerin bu gibi kaideleri kullanmaları kınanan görüş veya tefsire müdahale kabilinden sayılamaz. Gene Müfessirler, bu kuralları Kuranın müphem lafızlarını açıklamak, anlamlarını beyan etmek ve ayetlerin tefsirinde bulunan farklı görüşler arasında tercih yapmak için kullanmaları bundandır. Bunu yaparken tefsirlerinde gramer kuralları ya açık bir şekilde ya da işaret olarak zikrettiler. Bunlarla birlikte Müfessirler, zamirlerin ayetlerin tefsirinde farklı manaların ortaya çıkmasında ve fıkıh alanında da farklı hükümlerin oluşmasında etki ettiği için zamir kurallarına ve nereye bağlayacaklarına ayrı bir önemi vermişlerdir. Ayrıca Kuran Kerimde eşanlamlılık meselesinin gerektiği kadar bulunduğu ve bunun Kuran Kerimin mucizelerinden olduğuna vurgu yapıldı. Aynı zamanda bu gramer kuralları ayetler ile alakalı hikmetler ve bazı önemli sırları açıklamak konusunda büyük katkılarda bulunmuştur."
