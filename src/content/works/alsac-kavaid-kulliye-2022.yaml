abstract: "Tezimiz üç bölümden oluşmaktadır. Tezin Giriş kısmında, konuya dair bir temel olması açısından kanunlaştırma ve Mecelle ile ilgili bilgiler verilmiştir. Tezin Birinci Bölümü, konunun daha iyi ele alınmasına katkı sağlayacak olan kavramsal analize ayrılmıştır. Bu bölümde kâide kavramı özelinde, kavramın gelişimi, kâideye dair verilen tanımlar, kâidenin diğer kavramlarla ilişkisi, İslâm hukuk tarihinde kâide kullanımının geçirdiği tarihsel süreç, kavâid literatürüne dair telif edilen eserler hakkında bilgi verilmiştir. Tezin İkinci Bölümü, kavâid-i külliye-i kübrâ (el-umūru bi maḳāṣidihā, el-yaḳīnu lā yezūlu bi'ş-şekk, el-meşaḳḳa teclibu't-teysīr, eḍ-ḍarar yuzāl, el-'āde muḥaḳḳeme) üzerine yoğunlaşmaktadır. Kâideler arasındaki hiyerarşiye vurgu yapan bu durum süreç içerisinde takip edilmeye çalışılmıştır. Tezin İkinci Bölümü'nde kavâid-i külliye-i kübrâ; açıklanması, kaynaklarının tespit edilmesi, istisnâlarının ve diğer kâidelerle irtibatının ortaya konması gibi çeşitli açılardan ele alınmıştır. Tezin Üçüncü Bölümü, İkinci Bölüm'de ele alınan kavâid-i külliye-i kübrânın fer'î örneklendirmeleri ile ilgilidir. Kavâid-i külliye-i kübrâ, meselelerin çözümü için temel kıstas ve denetim aracı kabul edilerek, Mecelle'de yer alan diğer maddeler ile irtibatı ortaya konmaya çalışılmıştır."
