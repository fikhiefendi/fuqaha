abstract: "IV ÖZET YÜKSEK LİSANS TEZİ A A EBU YUSUF VE KITABUL-ASAR'I Arif ULU Danışman: Doç. Dr. İbrahim BAYRAKTAR Erzurum-1999- Sayfa: VIII +144 Jüri: Doç. Dr. İbrahim BAYRAKTAR Ebû Hanîfe'nin en ileri gelen talebelerinden biri olan Ebû Yûsuf, fıkıhta olduğu gibi Hadîste de otoritedir. Ebû Yûsuf, henüz Ebû Hanîfe hayatta iken Hadîs âlimlerinden ders almaya baş lamış, onun vefatıyla bunu daha da artırmıştır. İlmî yönü itibariyle zengin bir bölgede yetişen Ebû Yûsuf, yaptığı ilmî ve top lumsal faaliyetlerle bu çevreye önemli katkılar sağlamıştır. Yazdığı eserler ve yetiştirdi ği talebelerin yanı sıra, yaşadığı dönemde bir nüve halinde bulunan, ehl-i re'y ve ehl-i Hadîs adlı sun'î ekolleşmelerin yakınlaşmasına yardımcı olmuştur. Bunlardan dolayı pek çok âlim kendisinden övgüyle söz etmiş, bazıları ise taassup ve çekememezlik ne deniyle onu tenkit etmiştir. İçtihatlarını ve eserlerini bol miktarda hadîs kullanmakla kalmamış, içerisinde bin altmış sekiz rivayetin yer aldığı Kitâbu'1-Asâr adıyla, çoğunluğu hukukî Hadîsler den oluşan bir eser de telif etmiştir. Eserin sahih Hadîslerden oluşmasına oldukça önem vermiş, bunun için gerekli kriterleri tespit ve uygulamadan geri durmamıştır. Bütün bu yönleriyle Ebû Yûsuf un, kendisinden sonrakiler için önemli bir kaynak olduğu muhak kaktır."
