abstract: "Ahkâm ayetleri, fıkıh açısından ibadât, muamelât hudûd/ceza bölümlerini kapsamakla, beşer yaşamında temel bir unsur oluşturmaktadır. Aslında bu sayılan yönlerin her biri, inanç ve ahlak hükümleriyle de sıkı bir ilişki içerisindedir. Tarihselcilik, İslam coğrafyasında genelde Kur'an'ın anlaşılmasına yönelik bir metodoloji sorunsalı olarak ortaya çıkmıştır. Ancak bu düşünce tarzının, ahkâm ayetlerini, M.VII. asır ile kayıtlaması ve üstelik bunların, çağın yapısıyla uyuşmadığını ilan etmesi, meselenin salt bir metodoloji girişimi olmadığını göstermesi açısından önemli bir noktada durmaktadır. Batıda, kendi şartları ve sorunları içerisinde ortaya çıkan bu algı biçiminin Müslüman bir zihin yapısıyla nasıl bir ilişki içerisinde olacağı, her iki ayrı toplumun tarihi alt yapılarını da mülahaza etmemizi gerektiriyor. İşte bütün bu kritik noktaları bir arada değerlendirerek önce Batıdaki tarihselcilik ve bunun neticesinde oluşan Hristiyan vahiy algısı ve bunun bu haliyle İslam coğrafyasına yansıması yani, tarihselci düşünüşün vahiy ve Kur'an algısı temelde araştırıldı. Ardından bu anlayışın hükümlere yaklaşma üslupları ve neticesinde itiraz malzemesi olarak kullanılan tikel konular, uygun bir detayla delillendirilmeye çalışıldı. İtiraz ve iddialar, genelde ahkâm ayetleriyle sınırlı tutulup ona göre kaynaklara müracaat edildi. Nihayet değerlendirme ve mukayeseler ona göre yapıldı."
