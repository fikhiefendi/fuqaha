abstract: "Bu çalışmada, tasarruf finansman sözleşmesi Türk hukuku ve İslam hukuku açısından incelemeye tabi tutulmuştur. Ayrıca, bünyesinde bu hukuki ilişkiyi barındıran tasarruf finansman sistemi tanıtılmaya çalışılmıştır. Tasarruf finansman sistemi, temelde Alman yapı tasarruf sistemine benzeyen, çekilişli ve çekilişsiz finansman modelleri ile finansman faaliyeti yürüten bir finansal aracılık faaliyetidir. Sistemin diğer finansman sistemleri açısından ayırıcı unsuru finansman kullanımının tasarruf etme şartına bağlı olmasıdır. Şirketler müşterilerinden topladıkları tasarrufları finansal faaliyetleri için sermaye olarak kullanmakta ve kapalı devre bir şekilde sadece sistemde belirli şartlar dahilinde tasarruf edenlere finansman sağlamaktadırlar. Tasarruf finansman sisteminin bünyesindeki hukuki ilişkiye karşılık gelen tasarruf finansman sözleşmesi ise ağırlıklı olarak tüketici konumunda olan müşteri ile tasarruf finansman şirketi arasında kurulan, müşteriye aslî olarak organizasyon ücretini ödeme, şirket nezdinde tasarruf yapma, finansmanı geri ödeme yükümlülükleri getiren, şirkete ise aslî olarak organizasyon hizmetini yerine getirme, tasarruf fon havuzunu yönetme ve tahsisatı ödeme yükümlülükleri getiren, bünyesinde karz ve vekalet akdinden unsurlar barındıran bir sözleşmedir. İslam hukuku açısından, kanaatimizce sistem bünyesindeki hukuki ilişkinin tarafları yalnızca şirket ve müşterisi olup çekilişli ile çekilişsiz model arasında akdin niteliğini değiştirecek bir fark bulunmamaktadır. Söz konusu akit, bünyesinde ağırlıklı olarak karz ve icare akdini barındıran, bununla birlikte klasik akit tiplerinin çerçevesine girmeyecek unsurlara da sahip karma nitelikli modern bir akittir. Sistemin temelinde karz ilişkisi bulunmasından ötürü, İslam hukuku açısından başta organizasyon ücretinin niteliği olmak üzere sözleşme bazı sakıncaları barındırmaktadır."
