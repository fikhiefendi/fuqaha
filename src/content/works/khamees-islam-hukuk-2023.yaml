abstract: "4721 sayılı Türk Medeni Kanun. m. 539-541 arasında düzenlenen ve şekli anlamda bir ölüme bağlı tasarruf türü olan sözlü vasiyetname; el yazılı ve sözlü vasiyetname düzenlenmesine engel, olağanüstü durumlar içinde olan miras bırakanın başvurabileceği bir yoldur. Ölüme bağlı tasarruf, kişinin ölümünden sonra malvarlığına ne olacağını belirlemesine olanak veren bir hukuki işlem türüdür. Sözlü vasiyetnameyi el yazılı ve resmi vasiyetname şekillerinden ayıran en önemli özellik, bu türe sadece her iki türde de vasiyetname yapma imkanından mahrum olan kişilerin başvurabilecek olmasıdır. Sözlü vasiyetnamenin bu özelliği bile tek başına onun önemini açıklar mahiyettedir. Çünkü Kanun koyucu bu yolla son anlarını yaşayan kişiye, olağanüstü şartlar altında da olsa terekesinin kaderini belirleme imkanı vermekte ve onun arzularına verdiği değeri göstermektedir. Çalışmada, vasiyetin anlamı, çeşitleri ve geçerli bir vasiyet olması için, vasiyetin tarafları şekli üzerinde durulmuş Türk medeni hukuk ve İslam hukuku çerçevesinde karşılaştırılmıştır. çalışma sonucunda medeni kanun ile İslam hukukunda vasiyet konusunun da yer yer paralellik gösteren durumların olduğu sonucuna varılmıştır."
