abstract: "Vakıflar, Osmanlı İmparatorluğu döneminde ortaya çıkmış ve toplum tarafından, ekonomi ve dini açılardan desteklenmiştir. İslam tarihten itibaren çeşitli hedeflerle ulaşmak için vakıflar kurulmuş ve faaliyet göstermiştir. Bunlardan bir tanesi de Para Vakıflarıdır. Para vakıfları oluşturulduğu amaç yoksullukla mücadekle etmektir. Para vakıflar yoksulluğu azaltması rol oynamış ve ekonomik ve toplum hayatına önemli katkılar sağlamıştır. Para vakıflarının faaliyetleri sayesinde devlet ekonomik olarak rahatlatılmıştır. Cibuti'de de böyle benzer bir sistem 2004'te yılında yoksullukla mücadele etmek için sandık zekatı açmıştır. 2004'ten bu yana yetimler, fakirler, göçmenler, eğitimsiz ve sağlıksız olan çocuklar ve insanlara eğitim, sağlık ve destek ilgili yardıma sağlamaktadır."
