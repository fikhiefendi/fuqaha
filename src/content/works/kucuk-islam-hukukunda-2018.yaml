abstract: "İnsanoğlunun mutlu bir yuva kurmak ve kendisiyle huzur bulacağı bir eşe sahip olabilmesi için evlenmek yüce dinimiz İslâm'a göre meşrû bir yol, Allah Rasûlü (s.a.v)'nün ümmetine tavsiye ettiği önemli sünnetlerindendir. Onun içindir ki İslâm toplumları bu sünnete büyük önem vermiş, aile hayatını kutsal bir kurum kabul etmişlerdir. Geçmişten günümüze bu kurum, toplumumuzun ve dinimizin en çok üzerinde durduğu bir yapı olarak karşımıza çıkmıştır. Bu yapıyı korumak için en önemli tedbirleri ise yine yüce dinimiz İslâm almıştır. Hayatımızın her alanında olduğu gibi aile hayatının kuruluş aşamasında da mukaddes dinimiz bir takım kurallar koymuş ve biz inananları bu konuda aydınlatmıştır. Bizde tezimizde evlilik öncesi aşamada İslâm'ın koyduğu bu kuralları açıklamaya çalıştık. Tezimizi yazarken Kur'ân, sünnet, naslar, fukaha'nın içtihatları, son dönem İslâm hukukçularının meseleye bakış açıları ve modern hukuktan faydalandık. Hıtbe (kız isteme) ve nişanlılık dönemi, evliliğin ilk aşaması olduğu için hem Allah (c.c), hem de Allah Rasûlü (s.a.v) eşlerden birinin diğerini iyi tanıyarak evliliğe sağlam bir adım atması için evlenmeden önce hıtbe'yi meşrû kılmıştır. Çalışmamızda özellikle genç neslin evlilik öncesi İslâmî çizgiden uzak, tamamen nefsânî olarak hareket ettikleri bu aşamada birbirlerini görme, görüşme hususundaki uyulması gereken sınırlara dikkat çekmeye çalıştık. Bir mü'minin her istediği kadınla evlenmeyeceğini, evlenilmesi yasak olan kadınlara evlilik dahi teklif edemeyeceğini, Kur'ân ve sünnet'e uygun bir evlilikte eşte aranması gereken nitelikleri açıklamaya çalıştık. Evlilik teklifi yapılamayan kişiler zikredilirken özellikle iddet bekleyen kadınların evlenmesiyle alakalı detaylıca açıklama yapıp, başkasının dünür olduğu bir kadına dünür olan olumsuz bir cevap almadıkça tâlip olunmasının yasak olduğu, hangi durumlarda kadına tâlip olunması gerektiği konularına dikkat çekmeye gayret ettik. Tezimizin ikinci bölümünde ise özellikle günümüzde sıklıkla karşılaştığımız nişanın bozulmasından sonra ortaya çıkan mehre mahsûben verilen takı, para, tarafların birbirlerine verdikleri hediyeler, maddî ve mânevî tazminat konusuna, İslâm hukuku açısından Kur'ân, sünnet, mezhep imamlarının görüşleri, son dönem İslâm hukukçularının meselelere bakış açıları ve medenî hukuktan faydalanarak konuyu inceledik. Bu çalışmamda bana her aşamada yardımcı olan başta değerli hocam Dr. Öğretim Üyesi Mücahit ÇOLAK hocama, maddî ve mânevî desteklerini esirgemeyen anneme, babama ve eşime teşekkür ederim."
