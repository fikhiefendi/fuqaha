abstract: "Yusuf el-Karadâvî'nin zekât alanında sistematik olarak yazılmış Fıkhü'z-Zekât isimli eseri çerçevesinde âlimler arasında yoğun tartışma konusu olan güncel zekât problemlerinden bir kısmı ele alınmıştır. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde tezimizin amacı, konusu ve yöntemi anlatılmıştır. Birinci bölümde Yusuf el-Karadâvî'nin hayatı ve eserleri hakkında kısaca bilgi verilmiştir. İkinci bölümde zekâtın kavramsal çerçevesi, Kur'an ve sünnetten delilleri, zekâtın bireysel ve sosyolojik boyutu, zekâtın kimlere farz olduğu, zekâtın geçerlilik şartları üzerinde durulmuştur. Üçüncü bölümde ise çalışmamızın temel hedefi olan güncel zekât meseleleri öncelikle fıkıh mezheplerinin görüşlerinden yola çıkılarak, günümüz fıkıhçılarının görüşlerine kısaca yer verilerek ele alınmıştır. Son olarak Karadâvî'nin meseleleri ele alış biçimi, tercih ettiği görüş ve bu asrın diliyle yapmış olduğu açıklamalar üzerinde önemle durulmuştur. Karadâvî bütün mezheplerin görüşlerine eşit mesafe ve fıkıh mirasımıza dikkat çeken özenli yaklaşımı ile bugün üzerinde tartışılan konulara bu çağın diliyle cevap aramaktadır. Güncel zekât meselelerine dair son olarak yaklaşımımızı yansıtacak kısa açıklamalarda bulunduk. Tezimizde araştırma ve incelemeler neticesinde güncel zekât meselelerinin toplumun her kesimince kabul edilebilecek çözümlerini Fıkhü'z-Zekât eserinde ilmi açıdan tespit etmeye çalıştık."
