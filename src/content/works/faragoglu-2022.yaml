abstract: "İmtiyâz sistemi ile çalışmak dünyada ve dolayısıyla islam ülkelerinde de yayıldı, ancak meşruiyetini ve ekonomik önemini netleştirmek için yeterli çalışmalar yapılmamıştır. Bu çalışma, İslam Şeriatının imtiyaz sistemi ve ekonomik etkilerinın üzerindeki duruşu sorusuna cevap vermeyi amaçlamıştır. Araştırmacı çalışmanın amacına ulaşmak için hem fıkıh ve kanunla ilgili araştırmalar ve eserler gibi çalışmaları gözden geçirerek tümevarım metodu, hem de çalışma konusu ile ilgili performans göstergelerini ve verilerini analiz ederek tanımlayıcı analitik yöntemi kullanmıştır. Bu çalışma, imtiyazın kapsamlı bir tanımı, teorilerini ve sözleşmelerinin türlerini de ele aldı. Ayrıca imtiyaz sözleşmesine değinip, direkleri ve özelliklerini açıklayıp, ondan sonra adlı sözleşmelerden biriyle ilişkin olup olmadığını belirtmek için ve onun fıkha uygunluğuyla ilgili sağlam bir görüşe ulaşmak için imtiyaz sözleşmeyi adlı olan sözleşmelerle karşılaştırdı. Araştırma, önde gelen bir ülke olarak ABD'deki İmtiyaz'ların ekonomik performansını analiz etti. Buna ilaveten imtiyazın etkilerini ortaya çıkarmak amacıyla, Küresel İmtiyaz Konseyi tarafından yürütülen ve 2019 yılında yayınlanan bu ankete göre, İmtiyaz'ın küresel olarak ekonomik performansının analizi de yapmıştır. Çalışma, İmtiyaz işinin tamamen veya kısmen uygulanabilecek şekilde genişletilmesi için önerilen bir kavram geliştirdi. Son olarak, çalışma, imtiyaz sözleşmesine ilişkin en sağlam görüşün, her iki taraf için bağlayıcı bir vaadi olan bileşik sözleşmeler arasında sayılabilen ve yasaklanmış konulardan arınmış olması halinde islam fıkhın izin verdiği sözleşme biçimlerinden biri olduğu sonucuna varmıştır. Çalışma, İmtiyaz'ın ekonomik çıktısının, bazılarının yerli ürününün %11'inden fazlasına ulaştığını gösterdi. Ayrıca, 2002'den 2021'e kadar Amerikan Borsasında listelenen en büyük 500 şirket için %184,9'luk bir büyüme oranına kıyasla %347,6 oranında büyüyen Rosenberg Uluslararası İmtiyaz Endeksi'nde kayıtlı şirketlerin performanslarının karşılaştırılmasının sonuçlarını gösterdi. Bunun İmtiyaz şirketlerinin büyümesinin diğer şirketlerin büyümesinden daha hızlı olduğu anlamına geliyor. Bu nedenle İmtiyaz, ülkelerin ekonomik büyümesini etkilemekte ve böylece işsizlik oranının düşürülmesine katkıda bulunmaktadır. Çalışma, araştırma sonuçlarına çözümler şeklinde bir dizi önemli öneriyle sona erdi."
