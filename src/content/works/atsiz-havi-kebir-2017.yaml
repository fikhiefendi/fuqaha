abstract: "Bu çalışmayla, Şâfiî furû fıkhın gelişimine damgasını vuran Ebû'l-Hasen el-Mâverdî'nin el-Hâvi'l-kebîr'i ile İmâmu'l-Harameyn el-Cüveynî'nin Nihâyetu'l-matleb adlı eserlerinin, muhteva ve metot açısından karakteristik özellikleri ortaya çıkarılmaya çalışılmıştır. Şâfiî mezhebinin erken dönem müçtehitlerinden olan Mâverdî ve Cüveynî, gerek ilmi kişilikleri bakımından olsun gerekse eserleri açısından olsun, Şâfiî mezhebindeki tesirleri tartışılmaz bir gerçektir. Kendilerine has üslupları, içtihat ederken takip ettikleri metotlar ve mezhebin genel kabullerine riayet etmeleri açısından mezhep içinde fevkalade önemli bir konuma sahiptirler. Bu çalışma, Mâverdî ve Cüveynî'nin ilmi kişiliklerini, ilgili bölümlerin muhteva ve metot açısından karşılaştırmasını ele almaktadır. Bu çalışma sayesinde, hem Mâverdî'nin hem de Cüveynî'nin fıkhi kişilikleri, bakış açıları ve mezhep içi konumları ortaya çıkarılmıştır. Anahtar Kelimeler Ebû'l-Hasen el-Mâverdî, İmâmu'l-Harameyn el-Cüveynî, el-Hâvî'l-kebîr, Nihayetu'l-matleb, Satım Akdi"
