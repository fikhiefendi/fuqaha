abstract: "Bu çalışma, işârî tefsir geleneğini Gazâlî ve Ebû Abdurrahman es-Sülemî'nin yaklaşımları üzerinden karşılaştırmalı olarak incelemeyi amaçlamaktadır. Araştırmada, Kur'an'ın zâhir ve bâtın anlam katmanları arasındaki ilişkinin nasıl kurulduğu metodolojik bir çerçevede ele alınmıştır. İşârî tefsirin, sûfî tecrübe ile ilmî disiplin arasında yer alan çift yönlü yapısı, çalışmanın temel problematiğini oluşturmaktadır. Elde edilen bulgular, Sülemî'nin yaklaşımının erken dönem sûfî yorumlarını derleyerek müşterek bir aktarım ve muhafaza işlevi gördüğünü; Gazâlî'nin ise daha sistematik, ahlâkî ve pedagojik bir yorum modeli geliştirdiğini göstermektedir. Bu bağlamda, Gazâlî'de işârî yorumun belirli ilmî ilkeler çerçevesinde ölçülü bir tefekkür süreci olarak ele alındığı, Sülemî'de ise sûfî sözlerinin bir araya getirildiği tarihsel bir birikim alanı olarak ortaya çıktığı tespit edilmiştir. Çalışmada ayrıca, işârî tefsirin geçerliliğinin belirli kriterlere bağlı olduğu sonucuna ulaşılmıştır. Buna göre, işârî yorumların zâhir anlamla çelişmemesi, dilsel ve bağlamsal sınırları aşmaması ve şer'î ilkelerle uyumlu olması gerekmektedir. Aksi durumda yorumlar, ilmî değerini kaybederek keyfî bir nitelik kazanabilmektedir. Sonuç olarak, Gazâlî ve Sülemî'nin yaklaşımlarının birbirini tamamlayıcı özellikler taşıdığı; işârî tefsirin ise uygun yöntem ve sınırlar gözetildiğinde hem klasik hem de modern dönemde anlam üretimine katkı sağlayan çok katmanlı bir yorum geleneği olduğu değerlendirilmiştir."
