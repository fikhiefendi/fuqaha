abstract: "Faaliyetleri büyük oranda riskli işlemlere dayanan bankalar için risk yönetiminin stratejik bir önemi bulunmaktadır. Bankalar, güçlü risk yönetimi sayesinde risklerini kontrol edip kayıplarını azaltırken, aynı zamanda izlenilen doğru stratejiler sonucu riskli işlemlerden kazanç sağlayabilmektedirler. Doğası gereği riskli işlemler üzerine inşa edilen bankacılık sektörünün maruz kaldığı riskler katılım bankalarında daha da çeşitlenmektedir. Bu bakımdan, katılım bankalarında risk yönetimi kendine özgü bazı risk ölçümü, riski azaltma ve risk yönetimi sistemleri gerektirmektedir. Katılım bankaları, risk yönetiminde geleneksel bankaların yararlandığı kimi yöntemleri kullan(a)mamakta, bunun yanında kendilerine özgü bazı farklı yöntemler geliştirmektedirler. Bu çalışmada, katılım bankalarının maruz kaldığı riskler ve bu risklerin yönetimine ilişkin ayrıntılı literatür taraması yapılarak, konunun teorik alt yapısı oluşturulmuştur. Ardından, Türkiye'de faaliyet gösteren katılım bankalarında karşılaşılan başlıca riskleri belirleyip, bu bankalardaki risk yönetimini inceleme ve geleneksel bankalardaki uygulamalar ile karşılaştırma amacını taşıyan nitel bir araştırma yapılmıştır. Araştırma kapsamında, görüşme yöntemi ile elde edilen veriler betimesel analiz yöntemi ile yorumlanmıştır."
