abstract: "Şer'iyye sicilleri, Osmanlı Devleti sosyal, kültürel, iktisadi ve ictimai konular üzerine araştırma yapacaklar için son derece önemli kaynaklardandır. Çünkü şer'iyye sicilleri kayıt altına alındığı döneme ışık tutar. Bu siciller, Osmanlı Devleti'nin hukuk sistemi, toplum yapısı, kültürel, iktisadi ve idari yapısına dair önemli bilgiler veren birinci elden kaynaklardandır. 59 sayfadan oluşan 626 Numaralı Diyarbakır Şer'iyye Sicili'nde, (H. 1206- 1207 / M. 1792 – 1793) yılları arasında Diyarbakır'da meydana gelen ve mahkeme kayıtlarına yansıyan olayları içeren belgeler bulunmaktadır. Şer'iyye sicili'nde, İnsanlar arasında oluşan alacak-verecek meseleleri, vergi, miras, cinayet ve hırsızlık gibi birçok konuda verilen kararlar bulunmaktadır. Bu belgeler çalışmamızın temel iskeletini teşkil eder. Bu çalışmada, Şer'iyye sicili, Şer'iyye mahkemeleri, Diyarbakır tarihi ve Osmanlı Devleti dönemi Diyarbakır idari taksimatı hakkında kısaca bilgiler verildikten sonra çalışmanın esasını teşkil eden 626 Numaralı Şer'iyye Sicili'nin transkripsiyonu ve değerlendirilmesi yapılmıştır. Ayrıca çalışmanın sonunda belgede geçen Osmanlıca kelimelerinden oluşan bir sözlük ve eserin orijinal hali bulunmaktadır."
