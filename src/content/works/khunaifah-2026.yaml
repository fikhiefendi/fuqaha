abstract: "Açe'de uygulanan Cinayet Kanunu, İslam fıkhı hükümleri ile Endonezya'nın modern hukuk sistemi arasında bir birleşimi temsil eden özgün bir hukuki deneyimdir. Bu uygulama, şer'î makemelerde suçların nasıl ispat edildiği ve cezaların nasıl belirlendiği konusunda akademik tartışmalar ortaya çıkarmaktadır. Ayrıca yargı uygulamalarının, Açe toplumunun temel referansı olan Şafiî mezhebinin fikhî ilkeleriyle ne ölçüde uyumlu olduğu da önemli bir mesele hâline gelmektedir. Bu nedenle, cezai ispat mekanizmalarının ve hâkimin rolünün incelenmesi, fikhî metinler ile çağdaş yargı uygulamaları arasındaki ilişkiyi anlamak açısından önem taşımaktadır. Bu çalışma, Açe Şeriat Mahkemesi'nde verilen cinayet hükümlerinin, Endonezya Müslümanlarının çoğunluğu tarafından benimsenen Şafii mezhebi ile uyumunu analiz etmeyi amaçlamaktadır. Araştırmada, Açe Cinayet Kanunu hükümleri ve mahkeme kararları betimleyici-analitik yöntemle incelenmiş ve Şafii fıkıh görüşleriyle karşılaştırılmıştır. Ayrıca, karşılaştırmalı yöntemi kullanarak benzerlik ve farklılık noktaları tespit edilmiştir. Araştırma sonuçlarına göre, Açe'de uygulanan cinayet hükümlerinin büyük ölçüde Şafii fıkhına uygun olduğu tespit edilmiştir. Ancak maddelerin bazı kısımlarında küçük farklılıklar tespit edilmiştir. Bu araştırma, ceza hükümlerinin uygulanmasında fıkhî anlayışın güçlendirilmesini ve gelecekteki çalışmaların mezhepler arası karşılaştırma veya makâsıdü'ş-şeri'a perspektifiyle geliştirilmesini önermektedir."
