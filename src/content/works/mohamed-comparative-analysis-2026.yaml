abstract: "Bu tez, seçilen 2020-2025 döneminde Türkiye, Malezya ve Endonezya'daki Şeriat uyumlu bankacılık hisse senetleri ile konvansiyonel bankacılık hisse senetleri arasındaki karşılaştırmalı risk ayarlı getiri performansını incelemektedir. Bu çalışma, İslami ve konvansiyonel bankaların nasıl performans gösterdiğini analiz etmekte ve söz konusu performansları, bu hisselerin dâhil olunan risklere göre getiri üretme konusunda ne derece verimli olduklarını belirlemek amacıyla değerlendirmektedir. Bu araştırma, temel performans ölçütü olarak ağırlıklı biçimde Sharpe oranı analizini ve ek olarak Sortino oranı analizini uygulayarak İslami bankacılık hisselerinin farklı zaman aralıklarında—1 yıl, 6 ay ve 3 ay—konvansiyonel muadillerine kıyasla rekabetçi mi yoksa daha zayıf performanslar mı sergilediğini değerlendirmekte ve performansları sıralayarak karşılaştırmaktadır. Bu yöntemler aracılığıyla, bu araştırma İslami ve konvansiyonel bankacılık hisselerinin istikrarı, verimliliği ve karşılaştırmalı risk performansı hakkında bir içgörü sunmaktadır."
