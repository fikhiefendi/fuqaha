abstract: "Aile yeryüzünün ilk sosyal kurumudur ve cemiyet hayatının temelini teşkileder. İslam aileyi sevgi, saygı, hoşgörü ve adalet esasına dayandırmıştır. Bununlabirlikte eşler arasında zaman zaman problemler oluşmakta, geçimsizlik başgöstermektedir. Kur'an'da bu durum ?nüşuz? ve ?şikak? kavramlarıyla ifadeedilmiştir.Bu tezimizde genel olarak İslam'da aileyi ve nüşuz kavramını, Kur'an,sünnet, tefsir ve fıkıh eserlerini kaynak alarak araştırdık. Diğer taraftan TürkMedeni Kanununun ilgili maddelerini ve günümüz aile hayatıyla alakalı yazılmışeserleri de gözden geçirdik. Bu çalışmamızda araştıma, karşılaştırma veyorumlama yöntemini kullandık.Sonuçta ailede çıkabilecek problemleri öncelikle karı-kocanın kendiaralarında görüşerek çözmeleri gerektiğine,aile içinde çözülemediği takdirde debir hakeme müracaat edilmesi ve aile müessesesinin devamının sağlanmasıkonusunda tarafların hassasiyet göstermelerinin gerekli olduğu kanaatine vardık."
