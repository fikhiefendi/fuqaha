abstract: "Bu tez, Osmanlı devleti bağlamında takriben/yaklaşık 1450-1675 arasında mahlul (sahipsiz ve vârissiz) mal ve eşyaya dair yapılan hak talepleri konusunu inceler. Beytülmal kavramının farklı kullanım ve çağrışımları üzerinde yoğunlaşarak, kavramın daha dar bir özelliğini, mahlul mal/eşya üzerinde hak sahibi olan hazine kalemi anlamını izah eder. İslam hukukunda kamunun mülkiyet iddialarının temel argümanlarını Osmanlı öncesi ve Osmanlı dönemi fıkıh eserleri üzerinden araştırdıktan sonra, Beytülmal'i merkeze alarak, mülkiyet iddiaları konusunda Osmanlı'da yöntemsel bir özgünlüğün olduğuna işaret eder. Teorik olarak, bu özgün anlamında beytülmal, belli mülkiyet iddialarında bireylerin haklarını korumak ve ihtiyaç sahibi kimselere maddi destek sağlamak için/adına kurulmuştur. Zamanla çok yönlü bir yapı kazanarak kurumsallaşan beytülmal kalemi, Osmanlı'da fıkıh kitapları, kanunlar ve fetvalar aracılığıyla düzenlenmiştir. Beytülmalciler devlet tarafından yetkilendirilmiş görevlilerdir. Sahipsiz mal statüsünde olan kayıp ve kendisinden haber alınamayan kimselerin mallarını, terkedilmiş mal ve eşyaları ve varisi bulunmayan terekeleri teftiş eder, toplar ve kurum gözetiminde tutar. Beytülmalcinin peşine düştüğü bu mallar/eşyalar bir bakla tanesi de olabilir, çok iyi bakılmış bir konak da. Beytülmal uygulamaları ve kurumu, Osmanlı imparatorluğunda hukuki ve mali bazı fonksiyonların belirli bir noktaya kadar yerine getirilmesini mümkün kılmıştır."
