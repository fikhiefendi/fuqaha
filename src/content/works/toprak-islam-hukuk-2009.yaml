abstract: "İslâm insan haklarına son derece önem verdiği için sadece meydana gelen olaylara çözüm getirmekle kalmamış, zerîa ilkesiyle olumsuz sonuçlar doğurabilecek bazı fiilleri yasaklamış; bunun aksine, olumlu sonuçlar doğurabilecek bazı fiilleri de desteklemiştir.Bu çalışmanın amacı, İslâm Hukukunda zerîa prensibinin önemini açığa çıkarmaya çalışmaktır. ?Kötülüğe giden yolların kapatılması? anlamına gelen Sedd-i zerâi, İslâm hukuk ekolleri tarafından benimsenmiş ve pek çok konuda uygulanmıştır. Mâlikî ve Hanbelîler, bu prensibi delil olarak kabul eden ve onu hükümlerine uygulayan mezheplerin başında gelmektedir. Hanefîler ise, delil olarak sedd-i zerâi'yi reddetmemekle beraber onu ?istihsan? adıyla uygulamışlardır. Şâfiîlerin bu delili zayıf kabul etmelerine rağmen, zaman zaman onunla amel ettikleri görülmektedir. Zâhirîler ise, sedd-i zerâi'yi bir delil olarak kabul etmemektedirler.Tez, giriş ve iki bölümden meydana gelmektedir. Girişte; konunun ele alınışı ve temel kavramlar üzerinde durulmuştur. Delil kavramı ve aslî - ferî deliller üzerinde durularak sedd-i zerâi'nin bunlar arasındaki yeri belirtilmeye çalışılmıştır. I. Bölüm'de zerîa kavramı, çeşitleri ve dayandığı deliller işlenmiştir. Bu bölümde zerîa kavramı ve onu delil olarak kullananların; Kitap, Sünnet, Sahabe Uygulamaları ve Kıyasa dayanarak getirdikleri deliller üzerinde durulmuştur. İkinci bölümde, bu prensibi delil olarak kabul eden ve etmeyen mezheplerin görüşleri örnekleriyle sunulmaya çalışılmıştır.Sonuçta zerîanın, İslâm Hukukunun dinamik ve canlı olarak kalmasını sağlamak için nasların bulunmadığı konularda, belli şartlarla da olsa, kaynak olarak yararlanılabilecek bir delil olduğu değerlendirmesinde bulunulmuştur"
