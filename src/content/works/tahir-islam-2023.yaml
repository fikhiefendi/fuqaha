abstract: "İslam hukuku, sahip olduğu özgün anlayış ve ilkelerinin sonucu olarak diğer hukuk sistemlerinden farklı bir hukuksal yapılanma oluşturduğu gibi temel hukuki kavramlara da farklı içerikler kazandırmıştır. Çok katmanlı hakikat anlayışını benimsemiş olmanın bir sonucu olarak İslam hukuk düşüncesi çerçevesinde geniş bir yelpazeye yayılan farklı yaklaşımlar ortaya konulmuştur. Bu çeşitlilik, İslam hukukunu, epistemolojik açıdan modern hukuk düşüncesinden uzaklaştırsa da füru-ı fıkıh alanında ortaya konulan çeşitli görüşlerin bir kısmının modern hukukla örtüşmesine de imkan vermiştir. Örneğin İslam hukuku şemsiyesi altında akit nazariyesine dair ortaya konulan yaklaşımların bir kısmının modern hukukla örtüştüğü görülmektedir. Akit nazariyesinde üzerinde durulan konuların önde gelenlerinden biri irade beyanı tartışmalarıdır. İrade beyanı, hukukî işlemlerin gerçekleşmesi açıdan önem arz etmektedir. İrade insanın iç dünyasında oluşan sübjektif bir durumdur. İradenin hukukî sonuca bağlanması ise beyan vasıtalarıyla mümkündür. Bir başka ifadeyle hukukî işlemin gerçekleşmesi iradenin beyanıyla mümkün olabilmektedir. Hukuki işlemin meydana gelmesi için irade ile beyan arasında prensip olarak uygunluğun olması gerekir. Fakat bu uygunluk her zaman mümkün olmayabilir. Bu durumda içte olan irade ile dışa yansıtılan iradenin aynı olmaması akdin sıhhati açısından sorun oluşturabilmektedir. Fukaha, irade-beyan uyuşmazlığının bilinçli ya da bilinçsiz bir şekilde olup olmamasına bağlı olarak farklı hukuki sonuçlar ortaya konulması gerektiğini ifade etmişlerdir."
