abstract: "İmam-ı Azam Ebû Hanife, döneminin önde gelen en önemli İslam alimlerindendir. Onun görüşleri, mezhebi ve eserleri ilim dünyasına yön vermiştir. Kur'an ve Sünnet'in izinden giderek aklı ve nakli en güzel şekilde kullanmıştır. İslam'ın doğru anlaşılmasına ve yayılmasına büyük katkıda bulunmuştur. Ehl-i Sünnet anlayışının şekillenmesinde önemli rolü bulunan Ebû Hanife aynı zamanda birçok öğrenci de yetiştirmiştir. Ebû Hanife eserlerinde birçok akli ve nakli deliller kullanmıştır. Bu da bize Ebû Hanife'nin akla ve nakle verdiği önemi göstermektedir. Sadece akılcı ya da nakilci bir tavır sergilememiştir. Her ikisini de yerli yerinde kullandığı için Ebû Hanife, İmam-ı Azam olarak anılmıştır. Mâtürîdî mezhebinin önde gelen temsilcilerinden olan Nureddîn Sâbûnî, Mâtürîdiyye mezhebinin sistemli bir hale gelmesinde ve yayılmasında büyük katkısı olmuştur. Nureddîn Sâbûnî'de Ebû Hanife gibi aklı ve nakli dengeli bir biçimde kullanmıştır. Bu çalışmada, Ebû Hanife'nin beş eseri ile Nûreddin Sâbûnî'nin el-Bidâye'sinde kullanılan akli ve nakli delilleri iman, tevhid, nübüvvet ve ahiret konularına göre tasnif edilerek ele alınacak, Hanefî-Mâtürîdî düşünce geleneğinde akıl-nakil ilişkisinin nasıl kurulduğu ortaya konulacaktır."
