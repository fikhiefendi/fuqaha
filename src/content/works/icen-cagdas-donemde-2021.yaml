abstract: "Bu çalışma, çağdaş dönemdeki İslâm hukukçularının mülkiyet kavramına yaklaşımlarını konu edinmektedir. Bu dönemde, siyasi ve toplumsal kurumlarda yaşanan dönüşümlerin yanında dinî konu ve meseleler etrafında da yoğun tartışmalar yaşanmıştır. Bu konulardan biri olan mülkiyet, hak ile ilişkisinden dolayı önceleri Batı'da bazı tartışmalara konu olmuş ve bu tartışmalar bir süre sonra İslâm dünyasını da etkilemiştir. Bu çalışma, mülkiyet kavramı etrafında yaşanıp İslâm dünyasına muhtelif kanallardan taşınan tartışmaların çağdaş dönemdeki İslâm hukukçularına yansımasını incelemektedir. Çalışmada, Fransız kamu hukukçusu Leon Duguit ile Mısırlı İslâm hukukçusu Senhûrî arasındaki irtibat üzerinden mülkiyetle ilgili bazı tartışmalar ele alınmıştır. Mülkiyet kavramı hakkında genel olarak“sosyal fonksiyon”yönüne yoğunlaşan Duguit ve ondan etkilendiği varsayılan Senhûrî'nin çağdaş dönemdeki diğer İslâm hukukçuları ile ilişkileri de çalışmada incelenmiş ve bu dönemdeki İslâm hukukçularının mülkiyetle alakalı temayüllerine değinilmiştir. Yaşanan tartışmalar ve ortaya çıkan temayüller içinde öne çıkan“sosyal fonksiyon”kavramının Arap dünyasındaki bazı kanunlara nasıl yansıdığı da çalışmada izi sürülen meselelerden olmuştur."
