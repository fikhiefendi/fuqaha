abstract: "Bu çalışmada Osmanlı Devleti'nin şeyhülislamlarından biri olan Çatalcalı Ali Efendi'nin Fetava-yı Ali Efendi adlı yazma eserin 031a-060b arasındaki varaklar incelenmiştir. Bu varaklar farklı bir nüsha ile karşılaştırılarak çeviri yazısı yapılmıştır. İmla özellikleri, ses bilgisi ve şekil bilgisi yönünden incelemeler yapılmıştır. Çalışma; giriş, inceleme, metin, dizin ve tıpkıbasım olmak üzere beş bölümden oluşturulmuştur. Giriş bölümünde eserin özellikleri, yazarı, konuları, içeriği hakkında bilgiler ve tespit edilen nüshaları verilmiştir. İnceleme bölümünde eser; imla özellikleri, ses ve şekil bilgisi yönünden ele alınmıştır. Metin bölümünde sayfa ve satır numaraları ile birlikte çeviri yazıya aktarılmıştır. Ayrıca bir başka nüsha ile karşılaştırılmış olup farklılıklar dipnotlarla gösterilmiştir. Dizin bölümünde ise kelimelerin tamamının metne uygun olarak anlamları verilmiş olup aldıkları ekler alfabetik sıra ile eklenmiştir. Çalışmanın sonuna incelenen varakların tıpkıbasımları konulmuştur."
