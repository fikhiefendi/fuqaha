abstract: "Araştırmada tarafların karşılıklı anlaşma ile akdi bitirmeleri konusu ikale,muhalâ'a ve kitâbet akidleri üzerinden ele alınmıştır. Çalışma iki bölümden oluşmaktadır. Birinci bölömde ikale, muhalâ'a ve kitâbet akidleri detaylı olarak islam hukuku açısından dört mezhebe göre anlatılmıştır. İkinci bölümde ise çalışmada ele alınan ikale, muhalâ'a ve kitâbet akidlerinin özellik ve gayeleri bakımından mukayesesi yapılıp benzer ve farklı noktaları tespit edilmiştir."
