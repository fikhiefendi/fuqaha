abstract: "Bu çalışmada Bediüzzaman Said Nursi'nin (1877-1960) din siyaset ilişkisine dair görüşleri Eski, Yeni ve Üçüncü Said şeklinde incelenmiştir. Eski Said daha on beş yaşındayken siyasete girmiştir. Kürdlerin, Osmanlıların ve İslam dünyasının istikbalini meşrutiyette görüyordu. Birinci Dünya Savaşı'nda Ruslara esir olmuştur. Millî Mücadele lehinde fetva vererek Anadolu Hükümeti'ni desteklemiştir. Gaye-i hayalim dediği fen ve din ilimlerinin Türkçe, Arapça ve Kürdçe dillerinde okutulduğu uluslararası Medresetüzzehra Üniversitesi için Birinci Meclis'te destek aramıştır. Akabinde Ankara Hükümetiyle görüşlerinin uyuşmaması üzerine siyasetten çekilmiştir. Yeni Said dediği bu dönemde sadece iman ve Kur'an hakikatlarıyla meşgul olmuştur. Sürgünler ve hapishanelerle geçen bir hayata rağmen vatan ve milletin birliğinden yana durmuştur. Çok Partili dönemle tekrar siyaseti yakından takip etmiştir. Eski ve Üçüncü Said dönemlerinde elinden geldiğince siyaseti İslam'a, Kur'an'a, vatana ve millete dost yapmak için gayret etmiştir. Osmanlı ve Cumhuriyet dönemlerinde siyasal aktörlerle temasla siyasete yön vermeye çalışmıştır. Ulusal ve uluslararası mevzularda görüşlerini paylaşmış, teklif, tavsiye ve tenkitlerde bulunarak siyaset yapmıştır. Devrin siyasetçilerine Medresetüzzehra projesi, Ayasofya'nın açılması, Risalelerin Diyanet tarafında bastırılması, ırkçılık ve komünizm tehlikesi, İttihad-ı İslam ve Hristiyanlarla ittifak gibi muhtelif mevzularda görüşlerini paylaşarak siyaset yapmıştır. Bu çalışmayla Türkiye'de din-siyaset ilişkisinde karşılaşılan sorunların çözümünde Kürd ve din alimi kimliğiyle Nursi'nin görüşlerinin katkı sunmasını ümit ediyoruz. Metin incelemesi olan bu tezde söylem (discourse) analizi ile vakıa analizi (case study) esas alınmıştır. Çalışmanın özgün tarafı eski eserleri, gazete yazıları, müdafaaları, sürgün ve hapishane mektupları, Risale-i Nur Külliyatı dâhil Osmanlıca, Latince harflerle yazılmış Arapça, Kürdçe ve Türkçe birinci kaynak bütün telifleri dikkate alınarak karşılaştırmalı, yorumlayıcı, eleştirel, multidisipliner bütüncül bir yöntem izlenmesindedir."
