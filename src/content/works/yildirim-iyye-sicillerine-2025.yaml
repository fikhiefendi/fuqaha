abstract: "Bu çalışmada, miras meselesinin Kastamonu mahkemelerindeki uygulamalarını incelenmiştir. Araştırmanın ana kaynağını 1750-1762 yılları arasında tutulan 44, 45, 46, 47, 48, 49 ve 50 numaralı Kastamonu Şer'iyye Sicilleri oluşturmaktadır. Bu tez giriş bölümü ve üç ana bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, konusu ve kaynakları ile araştırmanın metodundan bahsedilmiştir. Birinci bölüm üç başlık altında ele alınmıştır. İlk önce İslâm hukuku ve İslâm hukukunun kaynakları hakkında kısa bilgi verilmiş, ardından miras kavramı ve miras hukukunun kaynakları ile Osmanlı Devleti'nde miras hukukunun uygulanmasına değinilmiştir. İkinci bölümde; şer'iyye sicillerine göre miras taksimi ve miras davaları başlıkları altında miras taksiminin nasıl yapıldığı, mirasçıların kimler olabileceği detaylı bir şekilde açıklandıktan sonra sicillerdeki miras davaları ele alınmıştır. Miras davalarında karşımıza çıkan veraset, sulh, mehir, köle, vasi tayini, teharüc ve hibe ile ilgili hükümler incelenmiştir. Son bölüm olan üçünde bölümde ise miras taksimi ve miras davalarının yer aldığı hükümler ışığında mehrin alt ve üst limiti, mahalleler, çok eşlilik, lakaplar, meslekler, gayrimüslimler ve kadınlar gibi sosyal ve toplumsal hayata dair analiz ve değerlendirmelerde bulunulmuştur."
