abstract: "Bu çalışmada, dönemindeki Hanefi fukahâsının reisi kabul edilen İmâm Kudûrî el-Bağdâdî'nin (362-428/973-1037) bir rivâyetten hareketle şer'an bağlayıcı bir hükmü ya da nebevî herhangi bir sünneti pratikte hangi ilkelerle tespit ettiği araştırılmıştır. Böylece Kudûrî örneğinde, bir taraftan Hanefi fıkıh usûlünün sünnet bölümlerindeki kuralların ne ölçüde teorik ya da pratik olduğunun belirlenmesi, diğer taraftan da pratikte uygulanan yöntemin muhaddislerle karşılaştırılması hedeflenmiştir. Araştırmada onun, konuyla ilgili takip ettiği ve 'sünnet usûlü' denilebilecek yöntemi detaylıca tespit edilmiş, bir haberin aidiyet/sıhhat, delalet/anlama ve sorumluluk/amel edilebilirlik açısından kabul edilip edilmediğini ayrı ayrı incelediği görülmüştür. Nitekim bir haberin doğru olup olmamasıyla ilgili olarak kullanılan kabul-red, sıhhat-za'f gibi terimler, muhaddisler ile fukahânın yanı sıra Kudûrî tarafından da birden fazla anlamda kullanılmaktadır. Dolayısıyla konunun detaylarına dair tespit edilen kurallar, hem bir fakihin bakış açısını bütüncül bir şekilde yansıtabilecek hem ulemanın ifadelerinin daha iyi anlaşılmasına hem de güncel birtakım tartışmalardaki yöntemle ilgili problemlere katkı sunacak şekilde üç ayrı bölümde müstakil olarak ele alınmıştır. Birinci bölümde Kudûrî'nin, bir haberin nispet edildiği zata aidiyetini belirlerken takip ettiği ilkeler konu edilmektedir. Bu kapsamda onun haberlerin temel kısımlarıyla ilgili görüş ve kurallarının yanı sıra râvînin adâletini ve rivâyetinin güvenilirliğini hangi ilkeler çerçevesinde belirlediği incelenmiştir. Böylece bir fakih olarak Kudûrî'nin hadis usûlu denebilecek kuralları tespit edilmiştir. İkinci bölümde Kudûrî'nin, bir haberin maksadını ve şer'î bir hükme delaletini hangi ilkeler çerçevesinde kabul ettiği ya da reddettiği konu edilmektedir. Kudûrî'nin fıkhû'l-hadis yöntemini oluşturan söz konusu ilkeler için öncelikle bir haberin anlaşılmasında dikkate aldığı görülen Efendimiz (s.a.v. ), Sahâbe ve râvîyle ilgili kuralları belirlenmiştir. Ayrıca onun ihticâcta sıklıkla kullandığı lafız türleri (zâhir, hakikat, 'âm, hâs, mutlak, mukayyed, emir ve nehiy) ile bunların lügavî ve/veya şer'î delaletlerine dair zikrettiği prensipleri belirlenmiştir. Ardından da onun, haberin doğru anlaşıldığını temin için aradığı şartlar tespit edilmiştir. Üçüncü bölümde ise Kudûrî'nin hangi tür haberleri huccet kabul ettiği ve bu haberlerin, bir meselede mükellefiyet ifade edebilmesi için koştuğu şartlar konu edilmiştir. Bu kapsamda onun haberlerin teâruzunda takip ettiği yöntem ile bir haber-i vâhidin fiilen bağlayıcı olabilmesi için aradığı amel şartları detaylıca incelenmiştir."
