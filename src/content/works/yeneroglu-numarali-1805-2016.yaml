abstract: "Şer'iyye sicilleri Türk Tarihinin en önemli kaynaklarındandır. Çünkü bu kaynaklar dönemin sosyal yapısı, ticari hayatı, devletin siyasi, askeri ve iktisadi yapısı hakkında çeşitli bilgiler vermektedir. Bu araştırma da aslı İstanbul'daki Müftülük Arşivinde olan 144 Numaralı (1805/1806-1806/1807 M.Tarihli) Beşiktaş Şer'iyye Sicillerini çevirmeye çalıştık. Çalışmamız toplam dört bölümden oluşmaktadır. Birinci bölümde, Osmanlıda kadılık müessesi verildi. İkinci bölümde şer'iyye sicillerinin tanımı, önemi ve ihtiva ettiği belge çeşitleri incelendi. Üçüncü bölümde kısaca belge özetleri verildi. Dördüncü bölümde de belgelerin çevirisi yapıldı. Bu çalışmadaki toplam 329 belgenin içeriğinde ferman, berat, hüccet, i'lâm, ma'ruz, mürasele gibi konular bulunmaktadır."
