abstract: "ÖZETYargılamanın amacı taraflar arasındaki anlaşmazlığı çözen ve haklı olanı tespit edenbir hüküm elde etmektir. Ancak bu hükmün çeşitli sebeplerle esastan veya usul bakımındanyanlışlıklar taşıması mümkündür. Ya da gerçekte bir yanlışlık mevcut değilken taraflarınverilen hükmün yanlış olduğunu düşünmeleri söz konusu olabilir. Bütün bu durumlarda,mahkemenin verdiği hükmün yanlışlığını tespit edip, düzeltilmesi imkânını verecek veyayanlışlık iddiası ile yapılan itirazın yersizliğini ortaya koyup hükmün tasdikini temin edecekbir çare var olmalıdır.İslam Hukuku teorik olarak mahkeme hükmünün denetlenmesini öngörmektedir. İlkdönemlere ait olanları dâhil olmak üzere bütün İslam Hukuku eserlerinde hâkim hükmününbozulması müstakil bir mesele olarak ele alınmıştır. Hz. Peygamber ve Dört Halifedönemlerine ait uygulamalarda hükümlerin denetlendiğini bize göstermektedir.İslam hukukunda temyiz yoluna benzeyen bir yol kabul edilmiştir, ancak temyiz edilenkararları incelemekle görevli özel bir mahkeme, bir Yargıtay kurulmuş değildi.İslam hukukunu uygulayan Osmanlı devletinde temyizin uygulanışının temeli Hz.Muhammed'in bazı davalara temyiz olarak ifade edebileceğimiz bir şekilde son ve kesin kararmercii olarak bakmasına, aynı şekilde halifeler ve Emeviler dönemi ile Abbasiler dönemindenormal kadılıkların üzerinde teşekkül eden Mezalim divanlarına ve uygulamalarınadayanmaktadır. İslam hukuk tarihinde kurumsal manada, temyiz mahkemesi olarakadlandıracağımız teşkilatın uygulamaları Abbasilerle başlamış diğer müslüman ve Türkdevletlerine geçerek Osmanlı Devletine kadar gelmiştir.Osmanlı devletindeki temyiz uygulamaları iki döneme ayrılmıştır. Birinci dönem;Temyiz mahkemesinin kuruluşuna kadar olan dönemdir. Bu dönemde Temyiz işlevi görenkurumlar olarak Divan-ı Hümâyun ve diğer divanlar, Meclis-i Vâlâ-yı Ahkâm-ı Adliye,Divan-ı Ahkâm-ı Adliye, Meclis-i Tetkikâtı Şer'iyye, Fetvahane gibi kurumlar ön planaçıkmaktadır. 1868'de kurulmuş ilk yüksek mahkeme olan Divan-ı Ahkâm-ı Adliye, Türkhukuk tarihindeki ilk Yargıtay'dır.İkinci dönem ise 1879'da Temyiz mahkemesinin kurulması ile Temyiz müessesesininbir kurum olarak İslam hukuk tarihindeki yerini almış olduğu dönemdir."
