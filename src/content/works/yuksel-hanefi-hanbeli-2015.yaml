abstract: "Tüm iki taraflı akitlerdeki temel prensip gereği, nikâh akdinde de tarafların akde rızaları şarttır. Yapacakları evliliğe rızalarının tam olması için de taraflar bazı şartlar ileri sürmek isteyebilirler. İşte bu çalışmada, İslam Hukukuna göre bir nikâh akdinin herhangi bir şart ileri sürülerek sınırlandırmaya uygunluğu, Hanefî ve Hanbelî mezhepleri çerçevesinde incelenmiştir. Çalışmamız, giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, araştırmanın konusu, metodu ve kaynaklarına yer verilmiştir. Birinci bölümde, araştırma konumuzu temellendirebilmek için nikâhın tanımı ile genel olarak nikâh akdinin hukukî niteliği, gayesi ve muktezası incelenip daha sonra nikâh-şart ilişkisi ele alınmıştır. Bu bağlamda, öncelikle şart kavramı ile bu kavramın içeriğinde bulunan ta'lîki ve takyîdî şart kavramları üzerinde durulmuştur. İkinci bölümde ise, mut'a, muvakkat, hülle, şiğar ve misyâr gibi belli isimlerle anılan şarta bağlı nikâhlar ile literatürde geçtiği kadarıyla nikâh akdi sırasında zikredilen kocanın çok evli olmaması, kadının ikamet ettiği beldesinden çıkarılmaması, mehir ya da nafaka verilmemesi gibi şartlar ele alınmıştır. Sonuç olarak, Hanefî mezhebinin nikâh akdinde ileri sürülebilen şartlar konusunda çok sert bir tavır takındığı; Hanbelî mezhebinin ise bu konuda daha itidalli olduğu görülmektedir. Öte yandan Hanefîlerin örfe uygun şartları da geçerli sayması, aslında nikâh akdinde ileri sürülebilen şartlar yelpazesini genişleten bir düşüncedir. Bu nedenle, nikâh akdinde öne sürülen şartların örf ve teâmül halini alması durumunda bu şartların Hanefî mezhebine göre de caiz sayılacağı söylenilebilir."
