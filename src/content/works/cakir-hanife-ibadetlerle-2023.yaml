abstract: "Hanefî mezhebinin teşekkülünde önemli bir paya sahip olan Ebû Yûsuf ve Muhammed eş-Şeybânî Ebû Hanîfe'nin önde gelen talebelerindendir. Mezhep içerisinde“İmâmeyn”adıyla ifade edilen bu iki müctehit kimi zaman kendi aralarında kimi zamanda hocaları Ebû Hanîfe ile fıkhî görüş ayrılıkları yaşamışlardır. Bunun yanında Ebû Hanîfe'nin bazen Ebû Yûsuf ile bazen de İmam Muhammed ile aynı görüşte olduğu konularda mevcuttur. Ebû Hanîfe'nin Ebû Yûsuf ile aynı görüşte olduğu meseleler Şeyhayn, İmam Muhammed ile ittifak halinde olduğu mevzular Tarafeyn olarak ifade edilmektedir. Bu ihtilâflar, mezhebin olgunlaşmasına zemin hazırlamakla birlikte İslâm hukuk literatürünün zenginleşmesinde de rol oynamıştır. İslâm Hukuku'nun fürû' fıkıh alanında yer alan ibadetler ile ilgili ihtilâfların incelenmesi fakihlerin tartışmalarının arka planı olduğunu ve ulemanın fıkhi meselelerde hüküm verirken keyfi davranmayıp bir usûle dayandıklarını ortaya koymak açısından önemlidir. Bu amaçlarla hazırladığımız çalışmamızda Ebû Hanîfe'nin farklı ictihâdlarını ibadetler özelinde incelemeye çalıştık. İhtilafların tespitinde el-İhtiyâr, el-Hidâye ve el-Mebsût adlı eserleri esas aldık ve yüz doksan sekiz tane ihtilaf tespit ettik. Söz konusu ihtilâfların sebeplerini ve tarafların gerekçelerini ortaya koymaya çalıştık. Bunun akabinde fetvaya esas olan görüşleri belirledik. Çalışmamız giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde araştırmamızın konusu, amacı, kapsamı ve metodu üzerinde durulmuştur. Birinci bölümde ihtilâf kavramı, fıkhî ihtilâfların tarihsel gelişimi ile Hanefi mezhebini kurucu imamları olarak bilinen başta Ebû Hanîfe olmak üzere Ebû Yûsuf ve Muhammed eş-Şeybâni'ni biyografilerine yer verilmiştir. İkinci bölümde ise ibadetler alanında Ebû Hanîfe'nin İmâmeyn ve diğer öğrencilerinden farklı ictihâdları ve gerekçeleri ele alınmıştır. Sonuç kısmında ise incelenen ihtilâflar ve varılan neticelere yer sıralanmıştır."
