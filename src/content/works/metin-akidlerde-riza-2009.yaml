abstract: "İnsanlar arasında yapılan ve çeşitli ihtiyaçlardan kaynaklanan akidlerin temel unsurunu karşılıklı rıza oluşturmaktadır. Hem Kur'an-ı Kerim'i hem de hadisleri incelediğimizde taraflar arasında gerçekleşen anlaşmalarda rıza unsurunun önemi daha çok anlaşılmaktadır. Çünkü Kur'an'da karşılıklı rıza olmaksızın ticaretin helal olmayacağı vurgulanmaktadır. Dolayısıyla biz de çalışmamızda Kur'an'ın üzerinde önemle durduğu bu hususu ayrıntılı olarak inceledik.Çalışmamız dört bölümden oluşmaktadır. Giriş bölümünde tezin konusu, amacı ve metoduna yer verilmiştir. Ayrıca rızanın sözlük ve ıstılahtaki anlamlarına, Kur'an'da ve sünnette rızaya ve rıza-ihtiyar ayrımına değindik. İkinci bölümde, akdin kuruluş aşamasında rıza ve rızayı bozabilecek faktörlerden garar ve ikrahı inceledik.Üçüncü bölümde, akdin sona erdirilmesinde rıza başlığı altında ikâle ve muhâleayı ele aldık. Dördüncü bölümde ise, rızanın korunmasına yönelik tedbirlerden muhayyerlikleri ve fesih hakkı doğuran durumları inceledik."
