abstract: "Girişimlerin ekonomiler için büyük önem arz ettikleri varsayılmaktadır. Bu sebepten ötürü ekonomiye katkı sağlamayı hedefleyen girişimcilerin desteklenmesi de fazlasıyla önem arz etmektedir. Ancak girişimcilerin projelerini hayata geçirirken yaşadıkları finansman sorunu önlerine engel olarak çıkmaktadır. Özellikle dış finansman kaynağı olarak görülen bankalar, girişimcilere yüksek risk barındırmaları ve karşılığında yeterli teminat sağlayamamalarından ötürü sıcak bakmamaktadırlar. Girişimciler için alternatif sermaye kaynaklarının kullanılmasının gerekliliği ortaya çıkmaktadır. Yıllar içerisinde teknolojik gelişmeyle de beraber girişimcilerin farklı evrelerde kullanabilecekleri mikrofinans, melek yatırımcılık ve risk sermayesi gibi birçok alternatif geliştirilmiştir. Girişimlerin ihtiyacı olan alternatif yöntemi belirlemesi ve değerlendirmesi önemlidir. Ancak özellikle internetin de gelişmesiyle beraber ortaya çıkan kitle fonlaması yöntemi, mevduat bankacılığına alternatif olarak değerlendirilebilir. Bu yöntem ile sadece büyük yatırımcıların değil, küçük birikimlerin de yatırıma dönüşebileceği bir platform kurulabilmektedir. İlaveten yatırımcıların yapacakları girişime ilişkin detaylı şekilde bilgilendirerek, kar ve zarara ilişkin ortaklıkları İslami iktisat özüne daha uygun olacaktır. Çalışmamızda girişimciler için alternatif sermaye/finansman yöntemleri tetkik edilerek, girişimlerin yapısına ve aşamasına göre hangi tür modelin daha uygun olacağı tespit edilmeye çalışılmıştır. Bununla beraber özellikle teknolojinin gelişmesiyle beraber ortaya çıkan kitle finansman fonlaması özelinde İslam iktisadına uygun finansal bir mimari önerisi sunulmuştur. Özellikle bu tür bir finansal mimari sayesinde hem tüm alternatif sermaye yöntemleri yer bulabilecek, hem de mevduat bankacılığın içinde bulundurduğu garar ve belirsizlikler giderilmiş olacaktır."
