abstract: "Katılım Finans İlkeleri Açısından Katılım Reasürans Sistemi başlıklı tez, katılım finans ilkeleri açısından katılım reasürans (retekâfül) sistemini kapsamlı biçimde ele almaktadır. Geleneksel reasürans işlemleri; faiz, belirsizlik (garâr) ve kumar gibi unsurları içermesi nedeniyle İslam hukukuna göre caiz kabul edilmemiştir. Bu nedenle katılım finans ilkelerine uygun kabul edilen alternatif bir yapı olan katılım reasürans sistemi geliştirilmiştir. Tezde bu sistemin tanımı, işleyişi, operasyonel modelleri ve geleneksel reasüransla olan benzerlikleri ve farklılıkları detaylı olarak incelenmiştir. Katılım reasürans sisteminin, tekâfül şirketlerinin sürdürülebilirliği ve risklerin paylaşımı açısından katılım finans sektöründe önemi büyüktür. Çalışma, katılım sigorta sektöründeki uygulamalara odaklanarak katılım reasürans alanında akademik literatürdeki boşluğu doldurmayı amaçlamaktadır. Bu kapsamda Türkiye'de faaliyet gösteren katılım sigorta şirketlerinin mevcut reasürans uygulamaları incelenmiş, katılım reasürans şirketlerinin sayıca ve sermaye olarak yetersizliği nedeniyle tekâfül şirketlerinin bu yetersizliği ileri sürerek geleneksel reasürans şirketleriyle çalışmaya yöneldikleri belirlenmiştir. Bu durumun fıkhi açıdan doğurduğu tartışmalara da yer verilmiştir. Ayrıca katılım reasürans uygulamaları ilgili literatür, sektör raporları ve alimlerin görüşleri doğrultusunda değerlendirilmiştir. Tez, bu alandaki teorik ve uygulamaya dönük bilgileri derleyerek literatüre katkı sağlamayı amaçlamaktadır."
