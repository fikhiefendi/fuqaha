abstract: "Fıkıh usûlü konusunda yazılan klasik eserlerin dili Arapçaydı. Bu da eserlerin toplum tarafından anlaşılmasında zorluk oluşturuyordu. Osmanlı Devleti'nde 19. Yüzyıl itibariyle fıkıh usûlü konusunda o güne hitab edecek Türkçe eserler kaleme alınmaya başlandı. İşte Abdulkâdir Sadreddîn Efendi'nin ez-Zerî'a ilâ 'ilmi'ş-Şerî'a adlı eseri bu bağlamda yazılmış ve tez konusu olarak seçilmiştir. Tez üç ana bölümde çalışılmıştır. Birinci bölümde Abdulkâdir Sadreddîn Efendi'nin adı ve nesebi, ailesi, ilmî şahsiyeti, görevleri, son günleri ve vefatı, eserleri ile müellif hakkında yapılan çalışmalar ele alınmıştır. İkinci bölümde ez-Zerî'a ilâ 'ilmi'ş-Şerî'a adlı eserini telif sebebi, telif yeri ve zamanı, eserin dil ve uslubu, eserin konuları ve tertibi ve eserin kaynakları ve değeri şeklinde beş başlık altında tahlili yapılmıştır. Üçüncü bölümde ise eser latinize edilmiştir."
