abstract: "ÖZETİ Anayasamızda, mülkiyet hakkı kişinin temel haklarından biri olarak düzenlenmiş ve güvence altına alınmıştır (Anayasanın 35. maddesi). Ayrıca, mülkiyet hakkına yönelik sınırlandırmaların, kamu yararı amacıyla kanunla yapılabileceği ve bu sınırlandırmalar ile mülkiyet hakkının özüne dokunulamayacağı belirtilerek, mülkiyet hakkına anayasal bir çerçeve çizildikten sonra, Anayasanın 46 ncı maddesinde de, mülkiyet hakkını sınırlandıran kamulaştırma düzenlenmiştir. Mülkiyet hakkına, kamulaştırmayla bir sınırlandırmanın getirilmesinin amacı, kamu hizmetlerinin sürekliliği ve devamlılığını sağlayan idarenin, bu hizmetleri yerine getirebilmesi içi gerekli olan taşınmaz malların mülkiyetlere sahip olmasını sağlamaktır. Ancak, zamanla idarenin, Anayasanın tanıdığı ve kanunlarla düzenlenen kamulaştırma işlemini yapmadan, kamu hizmetleri için, özel mülkiyetteki taşınmazlara el koyduğu görülmeye başlandı. Amaç, kamulaştırmada olduğu gibi, kamu hizmetlerinin yürütülmesi olduğu halde, tamamen kamulaştırmadan farklı olarak, kanunlardaki esas ve usullere uyulmadan, haksız olarak özel mülkiyetteki taşınmazlara el konulmaktaydı. Bu konuda, herhangi bir yasal düzenleme olmaması ve özellikle yol yapımı için kamulaştırma yapılmadan özel mülkiyetteki taşınmazlara el konulması, kamulaştırmasız el koyma (dolayısıyla kamulaştırma) kavramının ortaya çıkarmıştır. Bu şekilde ortaya çıkan kamulaştırmasız el koymanın, nasıl bir düzenlemeye tabi olacağı meselesi önem arz etmeye başlamış ve ilk düzenlemeler yargı kararları ile olmuştur. Uygulamada birliği sağlamak amacıyla, Yargıtay İçtihadı Birleştirme Kurulu toplanarak, içtihadı birleştirme yoluna gitmiş, bu da kamulaştırmasız el koyma konusundaki ilk düzenlemeler olmuştur. Yargıtay'ın, 11.5.1956 tarih ve Esas 1, Karar 6/7 sayılı iki İçtihadı Birleştirme Kararıyla, özel mülkiyetindeki taşınmazına kamulaştırmasız el konulan malikin, mülkiyet hakkının sona ermediğini ve malikin, men'i müdahale (el atmanın önlenmesi) davası açarak, idarenin bu haksız müdahalesini ortadan kaldırabileceği gibi, bu hakkını kullanmayarak, el konulan yerin mülkiyetini idareye devrederek, yerin karşılık parasını da isteyebileceğini, açılan bu davaların, herhangi bir zamanaşımı süresine tabi olmayacağını içtihat etmiştir. Yargıtay'ın, yukarıda belirttiğimiz içtihatları doktrinde eleştirilerek, Yargıtay'ın, bu içtihatlarında tamamen Özel Hukuk ilkelerinden hareket ettiğini, Kamu hizmetlerini yürüten, bu hizmetlerin düzenliliği ve devamlılığını sağlamakla yükümlü olan idarenin durumunun dikkate alınmadığını, farklılık arz eden İdare Hukuku prensiplerinden hareket edilmediğini, bunun sonucu olarak da, idare tarafından yürütülen önemli bayındırlık hizmetlerinin, açılan men'i müdahale davalarıyla engellenmesinin söz konusu olabileceğini belirtmişlerdir. Yargıtay'ın, kamulaştırmasız el koyma konusundaki içtihatlarını, tamamen Özel Hukuk ilkelerinden esinlenerek oluşturması nedeniyle, bu içtihatların doğurduğu sonuçları dikkate alan kanun koyucu, bazı yasal düzenlemeler yapmakzorunda kalmıştır. Bunlardan ilki, 5.1.1961 tarihinde kabul edilen 221 sayılı yasadır. Bu yasa ile 9 Ekim 1956 tarihine kadar olan bütün kamulaştırması el koyma işlemleri, geçerli birer kamulaştırma olarak kabul edilmiş, bu tarihten öncesi için kamulaştırmasız el koyma söz konusu olmaktan çıkarılmıştır. Bu nedenle, ancak 9 Ekim 1956 tarihinden sonraki kamulaştırmasız el koyma işlemleri için malikinin yukarıda değindiğimiz Yargıtay içtihatlarıyla belirlenen seçimlik hakları mevcuttur ve bu hakları herhangi bir süre sınırlamasına tabi olmaksızın kullanabileceklerdir. Zamanla, Yargıtay içtihatları ile kabul edilen çözüm tarzının çeşitli sorunlara sebebiyet verdiği ortaya çıkmıştır. Zira, özel mülkiyetlerindeki taşınmazlarına el konulan maliklerin, el konulmadan uzun yıllar sonra, yargıya müracaat ederek el atmanın önlenmesi veya günün şartlarına göre, bedel istemeleri, yine Yargıtay içtihatlarında, Medeni Kanunun 631, 639, 897. maddelerinde düzenlene kazandırıcı zamanaşımı sürelerinin dikkate alınmaması ve süresiz dava hakkı yüzünden kamu tüzel kişilerinin yüksek ve mükerrer ödemelerde bulunmak zorunda kalmaları gibi gerekçeler ve aksaklıklar dikkate alınarak, 2942 sayılı yeni Kamulaştırma Kanunun da kamulaştırmasız el koyma, yasal bir düzenlemeye tabi tutulmuştur. 2942 sayılı yasanın 38. maddesi, kamulaştırmasız el koyma konusundaki ilk yasal düzenleme olmuştur. Böylece, sadece Özel Hukuku ilgilendiren bir mesele olarak görülen kamulaştırmasız el koyma, İdare Hukuku ilkelerinden hareketle yeni bir düzenlemeye tabi tutulmuştur. 2942 sayılı yasanın 38. maddesindeki yeni düzenlemeyle, Yargıtay içtihatlarıyla belirlenen ve taşınmazlarına kamulaştırmasız el konulan maliklerine tanınan süresiz dava açabilme hakkı bir süreye tabi tutulmuştur. Bu surede yirmi yıl olarak belirlenmiştir. Bu süre zarfında açılmayan davalar, artık hak düşümü süresi nedeniyle açılamayacaktır. 2942 sayılı yasanın 38. maddesi ile yasal bir dayanağa oturtulan kamulaştırmasız el koyma, malik ve idare bakımından bir takım sonuçlar meydana getirmektedir. Kamulaştırmasız el koymanın malik bakımından doğurduğu sonuçların başında, mülkiyet hakkına dayanan davaları açabilme hakkıdır. Bu davaların başında, el atmanın önlenmesi (men'i müdahale) davası gelir. Bu dava ile mülkiyetine haksız el atılan malik, yirmi yıllık hak düşümü süresi içinde, açacağı el atmanın önlenmesi davası ile haksız müdahaleyi ortadan kaldırabilir. Ancak, uygulamada bu dava pek açılmamaktadır. Nedeni ise uygulama kabiliyetinin olmamasıdır. İdarenin yaptığı büyük bayındırlık işlemleri sonucunda, taşınmazlarına el konulan maliklerin, bu dava ile taşınmazlarına yapılan müdahaleyi ortadan kaldırmaları imkansız denecek düzeydedir. Alınan el atmanın önlenmesi kararlarının, idareye karşı uygulanmak üzere icraya konması da çok zordur. Zira, idare alınan bu kararlara uymamakta, maliklerde herhangi bir şey yapamamaktadırlar. İşte el atmanın önlenmesi davası ile alınan kararların uygulanmasının zor, çoğu zaman imkansız olduğundan, bu durumu dikkate alan malik, bir diğer hakkını kullanmakta ve el konulan yerin karşılığı olan bedelin verilmesini dava etmektedir. Bu dava ile malik, mülkiyet hakkını, el koyan idareye devretmekte bunun karşılığı olarak, taşınmazın nakdi değerini istemektedir. Uygulamada en çok karşımıza bu tür davalarçıkmaktadır. Yukarıdaki iki dava türünün yanında, kamulaştırmasız el koyma nedeniyle zarara uğrayan malik veya zilyetler bu zarara sebebiyet veren idareden, uğradıkları zararının tazminini de isteyebilirler. Tazminat davalarını, el atmanın önlenmesi ve bedel davasından farklı olarak yalnızca malik değil, zarara uğrayan zilyetler de açabilmektedir. Kamulaştırmasız el koyma sebebiyle açılan bedel veya tazminat davalarında, talep halinde faize de hükmedilmekte, ana kural olarak da faizin başlangıç günü, el koyma tarihi değil; bedel veya tazminat davasının açıldığı tarih olduğu uygulamada kabul edilmektedir. Bunun gerekçesi olarak da, bedel veya tazminat davalarında hükmedilen bedelin veya değerin, el koyma tarihindeki değer değil, davanın açıldığı tarihteki değer olmasındandır. Zira, sonraki bir tarihte belirlenen değer için, daha önceki bir tarihten faizi başlatmak mümkün değildir. Kamulaştırmasız el koymanın malik bakımından en önemli sonucu, malikin mülkiyet hakkının sona ermesidir. Bu konu çok tartışmalıdır. Zira, bazı hukukçulara göre; malikin, kamulaştırmasız el koyma ile mülkiyet hakkı, ancak idarenin el konulan yerin karşılığını tamamen ödemesi ile sona erer. Malikin, mülkiyet hakkının karşılığı olan bedel ödenmeden, el koyma ile bu hak sona ermez. El konulan taşınmaz üzerinde bayındırlık faaliyetleri veya tesis yapılması bu sonucu değiştirmeyeceğini belirtmektedirler. Buna karşın, diğer bir görüşe göre ise; malikin mülkiyet hakkı, kamulaştırmasız el koyma ile sona ermektedir. Zira, idarenin taşınmaza el koyması ile malikin o taşınmaz üzerinde yararlanma, tasarrufta bulunma imkanı kalmamıştır. Mülkiyet hakkının en önemli özelliğini oluşturan yararlanma ve tasarruf yetkisinin kullanılamaması, mülkiyet hakkının olmadığını gösterir. Yani malik, mülkiyet hakkını, idarenin fiili el koyma tarihinde kaybetmektedir. Bu iki görüşün yanında, malikin mülkiyet hakkı, yirmi yıllık zamanaşımı süresinin dolmasıyla da sona ermektedir. Zira, taşınmazına kamulaştırmasız el konulmuş olan malik, yirmi yıllık zamanaşımı süresi içinde yukarıda değindiğimiz davaları açmamış ise, mülkiyet hakkı bu zamanaşımı süresinin dolmasıyla birlikte sona ermektedir. Kamulaştırmasız el koyma, idare bakımından da bir takım sonuçlar meydana getirir.Bu sonuçlardan en önemlisi, idarenin, kamulaştırmasız el konulan taşınmazın mülkiyet hakkını elde etmesidir. Yine, idare, aleyhine açılan davalarda zamanaşımı süresinin dolduğunu, kamulaştırma işleminin yapıldığını veya bedelin ödendiğini, yada bir kanun hükmüne dayanarak taşınmaza el konduğunu, belirterek savunmalar da bulunabilir, ya da davadan sonra, kamulaştırmasız el konulan taşınmazı kamulaştırarak, yapılan işlemi hukuka uygun hale getirebilir. Sonuç olarak, 2942 sayılı Kamulaştırma Kanunuyla, kamulaştırmasız el koyma yasal bir zemine oturtulmuş ve Özel Hukuk ilkeleri ile İdare Hukuku ilkeleri kullanılarak yeni bir çözüm tarzı benimsenmiştir. Böylece hem Anayasada koruma altına alınan mülkiyet hakkı göz önünde tutulmuş, hem de kamu hizmetlerini yürüten ve devamlılığını sağlayan idarenin durumu dikkate alınarak yasal bir düzenleme yapılmıştır. Bu da en uygun çözüm tarzı olmuştur. 4"
