abstract: "Devletle özdeşleştirilen vergi ve benzeri uygulamaların aslında devlet öncesi cemiyet ve kabilelerde de mevcut olduğu görülür. İslamiyet'in gelişine kadarki vergi uygulamaları emeğe dayalı angarya, tarıma dayalı öşür, ticarete dayalı gümrük ve iç ticaret vergileri şeklindeydi. Özellikle 18. yüzyıldan itibaren verginin teorik meşruiyeti, mevzuu, oranları, matrahı, mükellefi ve harcama yerleri çok gelişmiştir. Devlet (kamu) harcamaları, gayr-i safi milli hasıladan daha hızlı artmaktadır. Bu da verginin tarih boyu, toplum üzerindeki yükünü tartışma konusu yapmış, zaman zaman haksız vergiler yüzünden isyanların çıkmasına sebep olmuştur. Bu yüzden vergi ilkeleri içinde en önemlilerinden biri de adalet ilkesi olmuştur. Zekât ise İslam inancında aslında mahza ibadet olup, İslam'ın iman ve namazdan sonraki üçüncü temel rüknüdür. Meşruiyeti ve vücubu Kur'an-ı Kerim'in naslarıyla, ilkeleri de Hz. Peygamber (sav)'in tatbikatıyla belirlenmiştir. Bugün parlamentolar (siyasi iktidar) vergilerin adını, mevzuunu, oranını, matrahını, mükellefini, değiştirebilir, bir vergiyi kaldırıp, başka bir vergiyi vaz'edebilirken, zekât üzerinde buna benzer bir tasarruf yetkileri yoktur. Bu çalışmada Hz. Peygamber ve hulefa-i raşidîn devrinde olduğu gibi zekâtın devlet tarafından toplanarak hak sahiplerine dağıtılması örneğinden hareketle, vergi gelirleri ve kamu harcamalarından (bütçeden) ayrı tutularak bir fonda (veya ayrı bir bütçede) bu fonksiyonun gerçekleşmesi için devlete bağlı veya devlet denetiminde yetkilendirilmiş, toplanmasından, kullanılması veya dağıtılmasına kadar zekâtın amaçlarına uygun bir biçimde uygulanmasını mümkün kılacak bir yapının oluşturulmasının zekâtın amaçları açısından daha doğru olacağı iddia edilmektedir."
