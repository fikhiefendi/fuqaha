abstract: "Bu çalışmada; Bilanço, gelir tablosu, varlık, kârlılık, mevduat, kredi, özkaynak, sermaye yeterliliği, likidite ve diğer bazı oranlardaki gelişmelerin ardından; hem katılım hem de konvansiyonel bankaların finansal performansları karşılaştırılmıştır. Bu çalışmada, BDDK ve TKBB'den toplanan yılık bülten verileri (2005-2016) sayesinde CAMELS derecelendirme sistemi, rasyo oran analizi, trend analizi, tablolar ve grafikler aracılığıyla kullanımı incelenmiştir. Çalışmanın sonunda, Konvansiyonel Bankaların Katılım Bankaları'ndan daha iyi performans göstermektetir. Ancak, Katılım Bankalar Konvansiyonel Bankalara göre daha istikrarlı ve en hızlı büyüyen bankacılık sektörü olduğu görülmektedir"
