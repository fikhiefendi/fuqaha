abstract: "Afganistan coğrafyası, Müslümanlar tarafından fethedildikten sonra bölgede İslam dini kabul görmüş ve daha önce mevcut olan hukukun yerini İslam hukuku almıştır. İlim tahsili ve bölgedeki hukukî ihtiyaçları çözüme kavuşturmak için Kûfe'ye ve Ebû Hanife'nin ilim halkasına giden Afganistanlı öğrenciler, Ebû Hanife'nin görüşlerini ve Kûfe'de edindikleri fıkhî birikimleri Afganistan'a intikal ettirmişlerdir. Böylece Hanefî fıkhı Afganistan'da yayılmaya başlamıştır. Daha sonra bu fıkhî gelenek, her bölgenin kültür ve sorunlarıyla zenginleşip o bölgenin şartlarına göre farklı biçimlerde gelişmiş ve fakihlerin bulundukları coğrafyaya nispetle Belh ekolü (Meşâyihu Belh) ve Buhara ekolü gibi mezhep içinde alt ekoller oluşmuştur. Afganistan'da kurulan devletlerin Hanefîliği esas almasıyla da Hanefîlik, halk tabanında da benimsenmiştir. Bu süreçte Afganistan'da fıkıh ilminde önemli gelişmeler yaşanmış ve birçok Hanefî fakihi yetişmiştir. Özellikle \"Daru'l-fıkıh\" ismiyle anılan Belh şehrinin ilmî açıdan İslam kültüründe önemi büyüktür. Bu şehirde ilim merkezleri kurulmuş ve İslam fıkhı diğer beldelere buradan intikal etmiştir. Belh fukahası, Hanefî mezhebinin temel prensiplerine bağlı kalsalar da Belh'in kültürel ve coğrafi şartlarını dikkate alarak bazı hususlarda Hanefîlerden farklı görüşler ortaya koymuşlardır. Bölgede değişik mezhepler var olmuşsa da en yaygın olanı Hanefî mezhebi olmuş ve Belh fıkıh ekolü, Sünnî Hanefî çizgi üzere devam etmiştir."
