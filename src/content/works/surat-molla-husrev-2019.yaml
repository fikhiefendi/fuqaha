abstract: "Osmanlı hukuku araştırmaları genel anlamda fıkıh metinleri bağlamında ‎değerlendirilmemektedir. Birçok Osmanlı hukukçusu tarafından“metn-i metîn”olarak ‎nitelendirilen Gurer'ul-Ahkâm ile Mültekâ'l-ebhur adlı eserler, Osmanlı hukukçularının ‎başvurduğu ana kaynaklardan olmuştur. Hanefi mezhebi çeşitli devletlere hukuk kaynağı ‎olmasından dolayı farklı görüş ve uygulamaları da içinde barındırmıştır. Osmanlı'ya da ‎aktarılan hukuk metinlerindeki bu çeşitlilik, hukukun canlılığı olarak görülmektedir. Her iki ‎kitabın muamalet konuları karşılaştırılarak, aynı konuda birbirlerinden ayrı görüşler tespit ‎edilmiştir. Osmanlı yargı pratiğinde de bu farklı görüşlerin yansımaları da yer yer ele alınmıştır.‎ Bu tez, giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde bu çalışmanın konusu, ‎önemi, amacı, hipotezi ve literatür incelemesi yer almaktadır. Çalışmanın birinci bölümü Molla ‎Hüsrev ve İbrahim Hâlebî'nin hayatları, kişilikleri ve eserleri ile birlikte tez konusu olan ‎Gurer'ul-ahkâm ve Mültekâ'l-ebhur adlı eserlerin incelenmesini kapsamaktadır. Aynı bölümde ‎XV. ve XVI. yüzyıl Osmanlı coğrafyasına genel bakış ve dönemin iktisadı durumu, Osmanlı ‎Devleti'nde hukuk ve hukuk eğitimi gibi konularda bilgi verilmiştir. Çalışmanın ikinci ‎bölümünde ise Gurer ve Mültekâ'nın Büyû, İcare, Şirket, Rehin, Vekalet ve Havale ‎bölümlerinde aynı konuda farklı görüşler incelenerek değerlendirilmiştir. ‎"
