abstract: "Türkiye'de 1984 yılından itibaren Özel Finans Kurumları adıyla ortaya çıkan ve yasa değişiklikleri sonrası“Katılım Bankacılığı”adıyla İslami esaslarda faaliyet yürüten bankalar ile katılım prensipleri çerçevesinde“Katılım Sigortacılığı”adıyla sigortacılık faaliyetlerinin yürütülmesi ve gelişimi için devlete düşen destekleyici görevin irdelenmesi amaçlanmaktadır. Devletin iktisadi sisteme müdahalesi maliye politikası araçlarının kullanımı ile gerçekleştirilmektedir. Vergilemenin genel yapısında oluşturulan değişikliklerden“vergi teşvikleri”ile finansal sisteme olan talebin oransal olarak gelişimi sağlanabilir mi sorusunun cevabı araştırılmaktadır. Devletin finansal sisteme yön vermesi açısından kamuya ait katılım finans ve sigortacılığı kurumlarının kurulması önemli olmakla birlikte, İslam iktisadının yerleşmesi ve yaygınlaşması açısından maliye politikası araçlarının kullanılmasının yerindeliği tartışılmaktadır. Maliye politikası temel araçlarından olan verginin finansal sistemde oluşturacağı teşviklerle, katılım bankacılığı ve katılım sigortacılığı piyasa etkinliğinin artırılıp artırılamayacağı konusunda ülke örneklerinden yola çıkılarak bilgiler vermek tez çalışmasında temel hedef olarak belirlenmektedir."
