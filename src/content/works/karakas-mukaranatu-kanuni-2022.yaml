abstract: "Osmanlının son döneminde türlü siyasi, iktisadi toplumsal amiller nedeni ile meydana gelen“Osmanlı Aile Hukuku Kararnamesi”, islam tarihindeki ilk aile hukuku kanunudur. Bu kanun Osmanlı devletinde çok kısa bir süre yürürlükte kalmasına rağmen islam coğrafyasında diğer ülkülerin aile hukuku çalışmaları için çok önemli sayılır. Çin Aile Kanunu ise komünist düşünce temel emelinde hazırlanmış ve dünyadaki bir milyardan fazla insana uygulanmakta olan bir kanundur. Aynı zamanda bu kanun Doğu Türkistan gibi Çin'in sömürgesi altındaki müslüman halklara da uygulanmaktadır. Biz bu tezde söz konusu iki kanunun, islam aile hukuku esasları üzerinden mukayesesini yapmaya çalışacağız."
