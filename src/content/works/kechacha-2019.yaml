abstract: "Cezayirli düşünür «Malik Bin Nebi» 20. yüzyılda en öne çıkan Müsülman düşünürelrden biri sayılmaktadır. Kendisi dikkat çekecek derecede zeki bir şahsiyet, saygıyı hak edecek kadar usta bir yazar ve özen gösterilmeye layık düşünce üretimleri yapan engin bir filozoftur. Son derece yararlı kitaplarıla islam kütüphanesini zenginleştirmiş ve sağlam bilimsel yöntemlere dayanarak «medeniyet sorunlarını» çözümlemiştir. Kendisini düşüncelerinde medeniyet, din, kültür, psikoloji, eğitim, tarih, sosyoloji, siyaset ve iktisadi boyutlara sahip bir proje doğmuştur. Bu tez, medeniyet kalkınma projesi boyutlarından biri sayılması, iktisadi düşünce zincirinin önemli halkalarından biri olması ve islam ekomisi alanında yapısal katkılradan birini teşkil etmesi nedeniyle, kendisinin düşücelerinin ekonomik boyutu araştırılmaya çalışılmıştır. Inceleme ve analiz yöntemi benimsenen çalışmada, Malik Bin Nebi'nin iktisat konusunda yazmış olduğu metinler incelenerek takip edilmiş, özelikle de modern iktisadi görüşleri topladığı «Ekonomi Dünyasında Müsülman» isimli kıtabı başta olmak üzere, bu metinlerin içerdiği ekonomik görüşleri analiz edimiştir. Çalışmada varılan en önemli sonuçlar ise aşağıdaki gibidir: 1. Malik Bin Nebi'nin kitapları, ekonomik düşünce araştırmarı açışından geniş bir alan ve verimli bir behçe sayılmaktadır. Zira ekonomi kendisinin önem odakları arasında büyük bir yere sahiptir. 2. Malik Bin Nebi bir ekonomi adamı değildir. Medeniyetin gelişmeşi açısından hayati bir faktör olması itibarilylr ekonomiden bahseden bir düşünür ve filozoftur. 3. Malik Bin Nebi ekonomiyi bir bilim olarak ele almamıştır. Bilakis onun iktisdi fikirleri felsefi toplumsal ve siyasi düşüncelerinin arasında gelişmiştir. 4. Malik Ben Nebi'nin düşüncelereni islam iktisadi düşüncesi noktasında güçlü bir ideoloji teşkil edebilir. 5. Bu araştırma, ölüm döşeğinde «30 yıl sonra döneceğim» diyen Malik Bin Nebi'nin beklentisinin bir bakıma gerçekleşmesi sayılabilir."
