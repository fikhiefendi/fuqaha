abstract: "Bu çalışma, iş geliştirme merkezlerinin (işletme inkübatörleri) küçük işletmeleri destekleme kabiliyetinin kapsamını ve inkübatörler tarafından girişimcilere ve genel olarak ekonomiye katma değerinin ne olduğunu bulmayı ve küçük işletmeleri gelişmekte olan ülkelerde ekonominin çekirdeği olarak kabul ederek, küçük işletmelerin etkinliğini gelişmekte olan ülkelerde ekonominin refahıyla ilişkilendirmeyi amaçlamaktadır. Bu amaca ulaşmak için çalışma, araştırmacıların iş geliştirme merkezleri hakkında önceki araştırmalarda ve çalışmalarda yazdıkları ve bu merkezlerin küçük işletmelere yardım etmede ne gibi katkılar sağladıkları üzerinden bilgi toplamaya dayanan tümevarımsal yaklaşıma dayanmaktadır. Bu çalışma aynı zamanda geleneksel finansmandan farklı bir finansman sistemi olarak küçük işletmelerin finansmanı sorununa İslami finansman yöntemleri uygulanarak çözüm bulma olasılığını ortaya koymayı amaçlamıştır. Ayrıca Araştırmacı, İslami bankalar aracılığıyla küçük işletmelerin finansmanında Türk deneyimini sunarak analitik yaklaşımı benimsemiştir. Bu çalışmayla araştırmacı bazı sonuçlara ulaşmıştır, bunlardan en önemlileri şunlardır : İş geliştirme merkezlerinin birincil rolü, eğitim ve yeterlilik alanında bir hizmet paketi sunmak, girişimciler için bir çalışma ortamı yaratmak ve bu projeler için finansman sağlamaktır"
