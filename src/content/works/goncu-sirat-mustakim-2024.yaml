abstract: "Allah'a kulluk için belirli süreliğine dünyaya gönderilen insan, kadın ve erkek olarak farklı cinsiyetlerde yaratılmıştır. Her cinsin kendine ait özellikleri, bu özelliklerine göre sorumlulukları vardır. İslam kadına ve erkeğe fıtratına uygun sorumluluklar ve bu sorumlulukları karşılığında da haklar vermiştir. Sanayi Devrimi ile değişen hayat algısı, her alanda farklı fikirlerin ortaya çıkmasına sebep olmuştur. Ortaya çıkan düşünce ve hareketler, sanayi devrimini yaşamayan devletleri de etkilemiştir. Osmanlı Devlet-i 'Aliyye'de, 1908 yılında, II. Meşrutiyet'in ilanıyla basın yayın organlarında artış yaşanmış, farklı dünya görüşlerine sahip yazarlar çeşitli konulardaki düşüncelerini basın yoluyla halka taşıma fırsatı bulmuşlardır. Sırât-ı Müstakîm Dergisi II. Meşrutiyetin ilanından bir gün sonra çıkan, çoğunluğunu İslamî düşünceye sahip yazarların oluşturduğu bir dergidir. Toplumu ve devleti etkileyen ekonomik ve sosyal problemlerden kurtulmak için nelerin yapılabileceğinin gündeme alındığı dergide dinî, felsefî, siyasî ve ictimaî konularda yazılar mevcuttur. Dönemin tartışılan konularından biri de kadınlar ve kadın haklarıdır. İslam'a göre kadının çalışması, eğitimi, tesettürü, sosyal hayattaki konumu gibi konular hakkında yazılar yazılmış ve farklı yazarlarca olaylar yorumlanmıştır. Bu çalışmada Sırât-ı Müstakim Dergisi özelinde 20. Yüzyılın başlarında kadınların sosyal hayatına dair tartışılan konuların neler olduğu tespit edilmiştir. Kadınların eğitimi, çalışması, tesettürü ve sosyal-kültürel hayata katılımına dair konuların o dönemde nasıl değerlendirildiği tartışılmıştır. Dönemin şartları içinde ele alınan kadınların sosyal hayatına dair meselelerin, Kur'an-ı Kerim ve sünnete uygunluğu incelenmiş, klasik fıkıh literatürümüze atıflar yapılmıştır. Günümüzde kadınların sosyal hayatına dair tartışılan konular ve yüzyıl önceki meseleler arasında fark olup olmadığı bu vesileyle ortaya çıkarılmıştır."
