abstract: "İslâm hukuk ilminde cevâz, dinî ve hukukî sahada serbestliği, müsamahayı ifade edip, cevâz verilen dinî-hukukî bir meselenin bir sakınca içermediğini, mahzurlu olmadığını, bir günahın terettüp etmediğini belirtir. En genel ifadeyle cevâz, şer'e (dinî-hukukî) uygunluktur.Kur'ân'da câiz kelimesi geçmemekle birlikte farklı sığalarda cevâz anlamını içeren kullanımlar mevcuttur. Hadislerde ise, İslâm hukuk literatüründe kavrama yüklenen ?şer'e uygunluk? anlamını ihtivâ eden kullanımları görmek mümkündür.Cevâz kavramı, Hz. Peygamber döneminden beri kullanıla geldiği bilinmekle birlikte ne zaman terimleştiğini kestirmek pek mümkün gözükmemektedir. Fıkıh ilminin olgunluk çağını temsil eden mezhepler dönemine göz atıldığında bu döneme ait elimize ulaşan eserler çerçevesinde câiz teriminin kullanım alanını incelediğimizde mezhep imamlarının ve talebelerinin bugünkü terim anlamına benzer bir kullanım tarzı karşımıza çıkmaktadır.Câiz terimi furû fıkıhta ibadetlerde ?sahih? ile eş anlamlı olarak kullanılmasına karşın muamelatta sahihten farklı bir anlamı ifade eder. Muamelatta sahih, meselenin dünyevî-hukukî yönünü ifade ederken câiz, daha çok uhrevî-dinî boyutunu ifade eder.Usûl literatüründe ise câiz kavramı İslâm hukukçularının ekseriyetine göre beş temel teklîfî hükümden biri olan ?mubâh? kavramı ile eş anlamda kullanılmıştır. Her iki kavramda ?yapılmasında veya terk edilmesinde mükellefe bir günahın terettüp etmediği şey? manasını ifade etmektedir.Usûl literatüründe câiz kavramı hakkında bir diğer tartışma konusu, câizin şer'î bir hüküm olup olmadığı meselesidir. Aslında bu tartışma içerisinde olan usûl âlimleri bu tartışmanın terim ihtilafından kaynaklandığını ifade etmektedir.İslâm hukunda genel akid nazariyesinde câiz terimi, vekâlet, âriyet, rehin gibi gayr-ı lâzım akitleri ifade etmek için kullanılmıştır.Sorumluluk hukuku açısından câiz, ?hukuka uygun, hukukun tasvip ettiği, onayladığı, izin verdiği manalara gelir."
