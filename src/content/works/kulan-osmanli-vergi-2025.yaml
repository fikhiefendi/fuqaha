abstract: "Osmanlı kanunnamelerindeki en detaylı ve kapsamlı hükümler vergi alanına dairdir. Osmanlı vergi kanunları, İslam vergi hukuku açısından ele alındığında bazı vergilerin şer'î vergiler olarak düzenlenen kısmı dışında veya şer'î vergilere ek yeni vergiler olduğu izlenimi ilk etapta bu kanunların şer'î hukuk gözetilerek taknîn edildiği konusunda şüphe uyandırmaktadır. Bu durum Osmanlı vergi sistemine yönelik çalışmalarda şer'î ve örfî kategorisinde tasnif edilen vergiler konusunda farklı değerlendirmelere yol açtığı gibi şer'î ve gayr-ı şer'î olarak kabul edilen vergiler hakkında da farklı yaklaşımlara neden olmuştur. Kimi çalışmalarda örfî olarak değerlendirilen bir vergi başka bir çalışmada şer'î veya gayr-ı şer'î olduğu yönünde yahut da tam tersi değerlendirmeler yapılabilmektedir. Bu çalışma, 15 ve 16. yüzyılların kanûn-i Osmânîleri ile bunların Anadolu ve Rumeli coğrafyası sancakları için uyarlanmış metinlerinde vaz edilen vergilere ilişkin hükümleri bilhassa devrin ulemasının fetvaları çerçevesinde ele alarak şer'î olarak kabul edilen vergiler ile şer'î olarak kabul edilmeyen vergilerin detaylı bir analizini yapmaktadır. Bu sayede elinizdeki çalışma, Osmanlı vergi sistemini inceleyen diğer çalışmalardan farklı olarak söz konusu iki yüzyılda tahsil edilen vergilerden hangilerinin şer'î, hangilerinin gayr-ı şer'î örfî vergiler olduğu konusunda özgün bir panorama ortaya koymaktadır."
