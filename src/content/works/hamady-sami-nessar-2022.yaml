abstract: "19. ve 20. yüzyıllarda Mısır'daki İslam felsefesi ve İslam düşüncesi ile ilgili yapılan çalışmalar, genel olarak zengin çalışmalar olup, çok önem taşımaktadır. Çalışmamızda, Mısırlı çağdaş bir düşünür olan Ali Sâmî en-Neşşâr'ın İslam felsefesine dair ana görüşü tahlil edilmeye çalışılmıştır. Ali Sâmî en Neşşâr'ın İslam felsefesine dair ana fikrini analiz eden çalışmamız, giriş bölümünden ve iki bölümden oluşmaktadır. Giriş bölümünde 19. ve 20. yüzyıllarda Mısır'daki İslam düşüncesi tartışmaları başlığı altında iki Mısırlı düşünür olan Muhammed Abduh ve Neşşâr örneklem alınarak çağdaş Mısır'daki İslam felsefesinin durumu anlatılmıştır. Çalışmamızın birinci bölümünde Neşşâr'ın hayatı ve eserleri ile alakalı bilgiler kronolojik olarak verilirken ikinci bölümünde ise Neşşâr'ın İslam felsefesi, kelam, tasavvuf ve usül-i fıkıha dair tasavvuru derin ve daha detaylı bir şekilde ele alınmıştır."
