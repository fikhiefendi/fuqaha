abstract: "Günümüz insanının önemli bir kısmının Osmanlıcayı bilmemesi, yeni nesilleri söz konusu defterleri araştırma ve öğrenme alanından uzak kılmaktadır. Bu konunun belirlenmesinin hedef ve amaçlarından biri mirasımıza sahip çıkmak ve bunu yeni nesillere tanıtma yolunda küçük de olsa bir katkıda bulunmaktır. Bundan dolayı mecmuanın muhtevasına konu olan meselelerin neler olduğunu, sorulan sorulara hangi kıstaslara ve usullere göre çözüm bulunduğunu, fetva merkezinin bölgesel olarak etki alanını ortaya çıkarmak hedeflenmiştir. Üzerinde çalıştığımız fetva defterinde Sivas ilinde yaşayan insanların karşılaştıkları özel durumlara ait fetvalar ortaya çıkarılmıştır. Bununla Sivas özelinde hangi durumlardan dolayı fetva merciine müracaat edildiği, ayrıca müftülerin hangi ölçülere göre nasıl fetva verdikleri okuyucuya sunulmuştur. Toplumun her kesiminden geldiği görülen ve daha çok akitler, nikâh ve boşanma konularıyla ilgili sorulara Hanefi mezhebinin içtihadları çerçevesinde cevap verilmiştir."
