abstract: "Özet İhsanlarla ilgili bütün hukuki olayları, kadıların verdikleri karar suretlerini, hüccetleri ve yargıyı ilgilendiren çeşitti yazdı kağıtları ihtiva eden defterlere Şer'iyye Sicili denir. Osmanlı Devletinde İslâmi hukuk kuralları geçerli idi. Bundan dolayı yapmış olduğumuz çalışmanın giriş kısmında belgelerin anlaşılmasına kolaylık sağlamak amacıyla Şer'iyye ve Nizamiye Mahkemeleri ile İslâm Hukukuna göre vekâletnameler hakkında bilgi verilmiştir. Daha sonra Şer'iyye Sicillerinin genel özelliklerini ve tarihi önemim açıklamaya çalıştık.7 Adet olan Maraş Şer'iyye Sicilleri, Milli Kütûbhanede muhafaza edilrnektedir.Maraş Şer'iyye Sicilleri 1876-1922 tarihleri araşma aittir. Tez konumuz olan 230 numaralı defler 28x38 cm. ebatındadır. îki bölüm ve 213 sayfadan oluşmaktadır. Birinci bölüm H. 1320-1322/ M. 1902-1904 yıllarına ait olup, vekâletnameler yer almaktadır. İkinci bölüm R. 1337-1338/ M. 1921-1922 yıllarına ait olup dava listeleri yer almaktadır. Araştırmacılara kolaylık sağlamak amacıyla belgelerin özeti çıkartılıp daha sonra metin transkripsiyonu verilmiştir. Değerlendirme kısmında çalışmamız sırasında elde ettiğimiz sonuçları ele alarak Maraş \"in idari, ekonomik ve sosyal yapısı hakkında bilgiler verilmiştir. Buna göre XX.yuzyıl başında Maraş Haleb Vilayetine bağlı bir sancaktır. Halk tarım, ticaret ve çeşitti el sanatları ile uğraşmaktadır. Müslüman ve gayrimüslim halk arasındaki ilişkilerin iyi olduğu anlaşılmaktadır. Defterdeki yazı çeşidi hakkında bilgi vermek amacıyla ekler bölümünde beş adet belge fotokopisi verilmiştir. Summary Şer'iyye Register is a kind of written document consisting of lawsuit papers mat moslem judge decides all lawful events about people. During the Ottoman Empire, Moslem laws were valid. Therefore, in the introduction of our studies in order to ease the understanding of the documents, some knowledge about Court of Şer'iyye and Court of Nizamiye and power of attorney according to the Moslem laws were given. In mis work, we tried to explain general qualities and historical importance of Şer'iyye Registers. Maraş Şer'iyye Registers which consisting of 7 volumes are kept in the National Library. The Maraş Şer'iyye Registers belong to the years from 1876 to 1922. The Volume number 230 which is our subject has a width of 28 cantimetres and a length of 38 cantimetres. It has 2 sections and 213 pages. The first section was written in H.1320- 1322(A.D. 1902-1904) and consists of the power of attorney. The second section was written in R-1337-1338(A.D.1921-1922) and consists of the lists of lawsuit In order to provide the researchers easiness the summaries of the documents and transcription texts are given. In the appraise section according to the results which we gained during our research, the knowledge about admirative, economical and social construction of Maraş"
