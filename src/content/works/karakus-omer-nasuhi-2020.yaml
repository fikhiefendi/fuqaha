abstract: "Son dönem fakihlerinden Ömer Nasuhi Bilmen'in (v. 1971) Büyük İslam İlmihali'ndeki hükümlerin Hanefi mezhebi tercih usulüne uygunluğunu değerlendirdiğimiz bu çalışmamız giriş, üç bölüm ve sonuçtan oluşmuştur. Giriş kısmında araştırmanın önemi ve amacı, kapsamı, kaynakları ve konu ile ilgili yapılmış çalışmalar hakkında bilgi verilmiştir. Birinci bölümde Hanefi mezhebi ve tercih kavramı, mezhep içi tercih ölçütleri ve İlmihal'in değerlendirilmesinde kullanılan tercih ölçütleri ele alınmıştır. İkinci bölümde Ömer Nasuhi Bilmen'in hayatı, eserleri ve İlmihali'nde içeriği ele alınmıştır. Üçüncü bölümde Taharet ve Namaz kitabındaki hükümler incelenerek elde edilen sonuçla ilgili genel bir değerlendirme yapılmıştır. Sonuç bölümünde çalışmamız neticesinde ulaşılan tespitler ortaya konulmuştur."
