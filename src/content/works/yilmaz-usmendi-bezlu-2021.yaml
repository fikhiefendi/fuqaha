abstract: "Hicrî VI. yüzyılda yaşamış Semerkantlı âlim Ebü'l-Feth Alâüddîn Muhammed b. Abdilhamîd b. Hüseyn el-Üsmendî'nin Bezlü'n-nazar fi'l-usûl adlı eseri Hanefî usul literatüründe farklı bir yerde durmaktadır. Üsmendî Bezlü'n-nazar'ın yazımında mütekellimîn metodunun temel eserlerinden biri olan Mu'tezilî âlim Ebü'l-Hüseyin el-Basrî'nin el-Mu'temed'ini merkeze almış, onu gerek içerik gerek tasnif, zaman zaman da usul meselelerindeki görüşlerinde takip etmiştir. Bu çalışmada Bezlü'n-nazar tasnif, yöntem ve içerik bakımından ele alınmış, el-Mu'temed adlı eserden hangi noktalarda ayrıldığı, ne oranda onu takip ettiği ve Hanefî usul literatüründe nerede bulunduğuna dair tespitler yapılmaya çalışılmıştır."
