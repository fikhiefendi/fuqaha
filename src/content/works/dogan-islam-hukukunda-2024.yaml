abstract: "İslâm Hukuku'nda vesvese ile ilgili hükümleri incelemeyi amaçlayan bu çalışmada; 'vesvese' kavramı kapsamlı olarak ele alınmış ve anlam çerçevesi netleştirilmeye çalışılmıştır. Klasik kaynaklarda ve âlimlerin bakış açısıyla vesvesenin ne olduğu belirlenmeye ve irtibatlı olduğu eş anlamlı ya da yakın anlamlı kelimelerle arasındaki farklar izah edilmeye çalışılmıştır. Dinî konulardaki vesveselerin günümüzde genellikle dinî takıntı olarak tanımlandığı göz önüne alındığında, bu çalışmanın kaynaklarımızda belirtilen vesvese kavramının tanımının daha net bir şekilde anlaşılmasına katkıda bulunması beklenmektedir. İslâm Hukuku açısından iman, ibadetler ve muâmelât konularında görülen vesveseler ise ikinci bölümde ele alınmıştır. İnsanın içinde oluşan ve dışarıya aksettirilmeyen vesveselerin fıkıhta bir hükmünün olmadığı tespit edilmiştir. Ancak bu vesvese sonucunda yapılan eylemler ve söylenen sözlerin hükmü fıkıh kaynaklarından araştırıldığında kişinin bunlardan sorumlu olduğu, eylem ve sözleri üzerine hüküm bina edildiği belirlenmiştir. Vesvesenin kişinin ehliyeti üzerindeki etkisi incelenerek kişinin sorumluluk alanı ve tasarruflarının geçerliliği belirlenmeye çalışılmıştır. Vesvesenin bir akıl hastalığı olmadığı ve kişinin ehliyetine zarar verici bir etkisinin de olmadığı görülmüştür. Araştırma sonucu ulaşılan neticelerin ayrıntıları sonuç kısmında toplu olarak sunulmuştur."
