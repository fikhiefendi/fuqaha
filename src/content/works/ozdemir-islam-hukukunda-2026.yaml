abstract: "Eğlence, insan hayatında farklı biçimlerde yer alan bir olgu olup, dinî ve ahlakî değerlendirmelere konu olmuştur. İslam hukuku literatüründe eğlence, çoğu zaman müstakil bir başlık altında ele alınmamış; müzik, oyun ve lehv gibi kavramlarla ilişkilendirilerek değerlendirilmiştir. Bu durum Eğlencenin İslam hukukundaki konumunun ve sınırlarının bütüncül biçimde anlaşılmasını zorlaştırmıştır. Bu çalışma, eğlenceyi haram-mubah ikileminden çıkararak, fıtrat, maslahat, ahlâkî sınırlar ve sedd-i zerâi gibi temel fıkhî ilkeler çerçevesinde teorik bir değerlendirmeye tabi tutmayı amaçlamıştır. Çalışma sonucunda, eğlencenin İslam hukukunda aslen mubah kabul edildiği; ancak bu serbestliğin mutlak olmadığı, belirli ölçütlerle sınırlandırıldığı tespit edilmiştir. Bu yönüyle tez, İslam hukukunun eğlenceye yaklaşımının yasaklayıcı değil; insanın fıtrî ve ahlaki yapısını gözeten dengeli bir anlayışa dayandığını ortaya koymaktadır."
