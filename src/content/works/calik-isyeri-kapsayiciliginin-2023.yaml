abstract: "İşletme yönetimi açısından son yıllarda üzerinde önemli çalışmalar yapılan konulardan olan işyeri kapsayıcılığı ve İslami liderlik kavramları bu çalışmanın çıkış noktasıdır. Bu çalışmanın amacı üst düzey yöneticilerin işyeri kapsayıcılığı ve İslami liderlik kavramları hakkındaki bilgi ve tutumlarını ölçmek ve işyeri kapsayıcılığının gelişiminde İslami liderliğin rolünü tespit etmektir. Araştırmada öncelikle teorik olarak liderlik, İslami liderlik ve işyeri kapsayıcılığı kavramları ele alınmıştır. Araştırmanın ilk bölümünde liderlik kavramı açıklanmış ve işletme yönetimi açısından tarihsel süreç içerisinde ele alınmıştır. Bu bağlamda liderlik teorileri klasik ve modern liderlik teorileri olarak ayrı başlıklar altında açıklanmaya çalışılmıştır. İkinci bölümde İslami liderlik kavramı ele alınmıştır. İslami liderlik kavramının tanımı yapıldıktan sonra İslamli liderliğin boyutları ve İslami liderlerin taşıması gereken özellikler 14 başlıkta ele alınmıştır. Bölüm sonunda ise geleneksel liderlik ile İslami liderliğin farkları ele alınmıştır. Araştırmanın üçüncü bölümünde işyeri kapsayıcılığı kavramı ele alınmış olup işyeri kapsayıcılığı kavramının tanımı, özellikleri, faydaları, önemi ve işyeri kapsayıcılığı ile farklılıkların yönetimi kavramlarının farkları ele alınmıştır. Araştırmanın uygulama kısmında çeşitli sektörlerde faaliyette bulunan CEO, CFO vb. ünvanlara sahip yöneticiler ile mülakatlar yapılmıştır. 33 üst düzey yöneticiyle yapılan mülakatlar nitel analizler için elverişli bir analiz programı olan MAXQDA aracılığıyla incelenmiş elde edilen veriler yorumlanmıştır. Yapılan analizler sonucunda Türkiye'de işletme yönetimi açısından İslami liderlik ve işyeri kapsayıcılığının pek duyulmadığı ancak uygulamada yöneticilerin hem İslami lider davranışları hem de kapsayıcı uygulamaları yaptıkları tespit edilmiştir. Bu çalışma neticesinde kavramların bilinirliği ve tanımlamaları tespit edilmiş olup bu kavramların özellikleri de belirlenmeye çalışılmıştır. Çalışmaya konu örgütlerin kapsayıcılık faaliyetleri, uyguladıkları liderlik stratejileri ve İslami liderliğin işyeri kapsayıcılığına etkisi tespit edilmiştir."
