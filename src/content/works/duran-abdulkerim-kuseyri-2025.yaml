abstract: "Bu çalışma, tasavvufî tefsir geleneğinin önemli temsilcilerinden biri olan Abdulkerim Kuşeyrî'nin Letâifu'l-İşârât adlı eseri çerçevesinde bazı ahkâm ayetlerinin tasavvufî yorumlarını incelemeyi amaçlamaktadır. Klasik tefsir literatüründe ahkâm ayetleri genellikle fıkhî hükümler bağlamında değerlendirilmişken, Kuşeyrî bu ayetlere işârî anlamlar yükleyerek onları bireysel arınma, ahlâkî olgunluk ve kalbî tasfiye perspektifinden yorumlamıştır. Bu yönüyle eser, ahkâm ayetlerinin yalnızca hukuki çerçevede değil, aynı zamanda manevî ve ahlâkî bir boyutta da okunabileceğini göstermektedir. Tezde ahkâm ayetleri tahlil edilerek Kuşeyrî'nin bu ayetlerde ortaya koyduğu işârî yorumlar analiz edilecek, yorumların dayandığı tasavvufî kavramlar ve yöntemler açıklanacaktır. Böylece tasavvufun tefsir ilmindeki yeri ve katkısı somut örneklerle ortaya konacaktır. Araştırma hem tasavvufî tefsir geleneğini hem de Kuşeyrî'nin özgün yaklaşımını daha iyi anlama açısından önemli bir katkı sunmayı hedeflemektedir."
