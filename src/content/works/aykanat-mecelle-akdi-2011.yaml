abstract: "İş akdi, bireysel iş hukukunun kapsamlı ve önemli bir konusudur. İş akdine ilişkin olarak Osmanlı Hukukunda Mecelle'den önce bir kanunlaştırma bulunmamaktadır. Mecelle'de iş akdine ilişkin olarak, dönemin şartlarına uygun bir kısım düzenlemeler yer almıştır.İş ilişkileri İslam Hukukunda icare akdi başlığı altında düzenlenmiştir. Mecelle'de iş akdinin karşılığı icare-i âdemi akdidir. Mecelle'de iş akdi konusunda İslam Hukuku terminolojisi kullanılmıştır. İcare-i âdemi akdi Mecelle'nin ikinci kitabı olan icare kitabı içerisinde düzenlenmiştir. İcare-i âdemi akdi, İslam Hukukundaki istihdam kurallarını açıklamaktadır.Mecelle'de işçi kavramının karşılığı ecir terimidir. İşçi ecir-i has ve ecir-i müşterek şeklinde ikiye ayrılmıştır. İşçi kavramı modern anlamdaki işçi kavramından daha geniştir. İşçi niteliğinin belirlenmesinde ücret karşılığı bir işte çalışma kıstas alınmıştır. Bu sebeple iş akdi kavramı da günümüzdeki iş akdi kavramından daha geniştir.İslam Hukuku ile günümüz hukuku iş akdinin kurulması, özellikleri, tarafların borçları ve akdin sona ermesi konularında benzerlikler ve farklılıklar taşımaktadır."
