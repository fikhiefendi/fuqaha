abstract: "Bu tezin amacı İslâm hukuk biliminin gelişiminde kilit role sahip farazî fıkhın teorik boyutunu ortaya koyarak tarihsel süreçteki kullanımını dört mezhep özelinde mukayeseli bir yöntemle tespit etmektir. Bu meyanda, teorik çerçevenin ele alındığı birinci bölümde farazî fıkhın kavramsal analizi yapılarak bazı fıkıh kavramlarıyla ilişkisi ele alınmış, farazî metodun kelâm ilminde ve fıkıh usûlünde kullanımı incelenmiş ve fukahânın farazî fıkha yaklaşımları ele alınarak farazî fıkha yönelik eleştiriler değerlendirilmiştir. İkinci bölümde fıkhın gelişim evrelerinde farazî fıkhın kullanımı irdelenerek, farazî fıkhı temsil kabiliyeti yüksek meseleler üçüncü bölümde ele alınmıştır. Tezimizde vardığımız sonuca göre fürû-u fıkhın teorik yönünü ifade eden farazî fıkıh, yalnızca gelecekte vuku bulması öngörüsüne dayanılarak oluşturulmuş varsayımsal meseleleri ihtiva eden bir ameliye değildir. Farazî fıkıh yöntemiyle oluşturulmuş meseleler asırlar boyunca İslâm toplumunun hukuk ihtiyacını karşılamasının yanında fıkhın bir ilim olarak gelişiminin sacayaklarından biri olmuştur. Farazî meseleler fıkıh konularının kuramsal zeminde değerlendirilmesine olanak sağlamış, fıkıh eğitiminde metot olarak kullanılmış ve İslâm hukukuna dinamizm kazandırmıştır. Bu meseleleri ihtiva eden eserler; sanayi, teknoloji ve tıp gibi alanlarda çok önemli gelişmelerin yaşandığı günümüzde karşılaşılan hukukî hadiselerin çözümünde İslâm hukukçularının başvurduğu temel kaynaklardan biridir."
