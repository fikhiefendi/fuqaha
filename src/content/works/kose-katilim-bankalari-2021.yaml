abstract: "Bu çalışma, katılım bankaları müşterilerinin mobil bankacılık uygulamalarına uyumu ve hizmet kullanım niyeti arasındaki nedensel ilişkinin açıklanmasına amacıyla yürütülmüştür. Çeşitli sektörlerde teknolojik gelişmeler ve uygulamalara yönelik algılar ve uyuma yönelik incelemelere oldukça büyük gereksinim bulunmaktadır. Söz konusu uygulamaların müşterilerin firmayla olan ilişkilerinde, firmaya karşı tutumlarında ve hizmet kullanım niyetlerinde olumlu etkileri olduğu açıktır. Teorik bilgilere dayalı olarak, mobil uygulamalara yönelik uyumu etkileyen unsurların hizmet kullanım niyeti üzerine etkisinin test edilmesi amacıyla kavramsal bir model formüle edilmiştir. Katılım bankalarının mobil bankacılık uygulamalarına yönelik müşterilerinin uyumlarını belirleyen etkenler ve bunların kullanım niyetine etkilerini belirlemek amacıyla anket yöntemi kullanılmıştır. Örnekleme yöntemi olarak, kolayda örnekleme yöntemi tercih edilmiştir. Araştırma hipotezlerinin test edilmesinde, tek ve çok değişkenli istatistiksel analiz yöntemlerinden yararlanılmıştır. Araştırma sonuçlarına göre, algılanan güven ve güvenilirlik, algılanan fayda ve algılanan yaşam tarzına uyum değişkenlerinin hizmet kullanım niyeti üzerine etkili olduğu belirlenmiştir. Algılanan kullanım maliyeti değişkeninin ise, hizmet kullanım niyeti üzerinde etkili olmadığı görülmüştür. İncelenen değişkenlerin genellikle katılım bankaları dışındaki bankalar açısından ele alındığı daha derinlemesine çalışmaların katılım bankaları açısından da değerlendirilmesi gerektiği ifade edilebilir. Sonuçların, katılım bankaları uygulayıcıları açısından farklı bir bakış açısı sunabileceği de anlaşılmaktadır."
