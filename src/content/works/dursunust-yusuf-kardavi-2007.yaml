abstract: "Kardavî, 21. yüzyılın yetiştirdiği büyük İslam âlimlerindendir. Çok geniş bir ilgi alanına ve çalışma sahasına sahip olan bu âlim, akademik câmiada eserleriyle dikkat çekerken, basın yayının yanı sıra, eğitim ve öğretim faaliyetleriyle halkın içerisinde olmuş, onların dinî sorunlarına pratik çözümler getirmeye çalışmıştır. Kardavî, Müslümanların ihtiyaçlarına yönelik birçok müessesenin ve okulun açılmasına önayak olmuş, Avrupa Fetva ve Araştırma Kurulu'unda kurucu üye ve başkan olarak, farklı kültürler içinde yaşayan Müslümanların sorunlarına cevaplar sunmaya çalışmış, dünyanın hemen her bölgesinde tanınan, görüşleriyle yankı uyandıran bir pozisyon elde etmiştir. Onun bu denli geniş bir coğrafyada tanınmasında ve kabul görmesinde, sunduğu çözüm önerilerinde, gündelik hayatı göz ardı etmeyen, kolaylık ve maslahatı önceleyen tutumu kadar, çözüm bekleyen modern problemlerin aciliyeti de etkili olmuştur. Kardavî, çağdaş fıkıh meselelerine kendine özgün çözümler üretmeye çalışan bir âlim olmanın yanında, kökleri XIII. yüzyıla kadar dayanan ve XVIII. yüzyıldan bu yana, büyük ivme kazanan yenilikçi eğilimin ve selefî söylemin bir örneği olarak kabul edilebilir. Bu çalışmada temel olarak, çağdaş müslüman bir âlim olan Kardavî'nin, günümüz fıkıh meselelerine nasıl yaklaştığı, hükümleri nasıl temellendirdiği, delilleri nasıl kullandığı sorusu sorularak cevap verilmeye çalışıldı. Bu sorunun cevabı aynı zamanda, Müslümanların son yüzyıllarda yaşanan modernleşme sürecine nasıl dahil olacakları sorununa bir çeşit cevap mahiyeti de taşıyacağı için, büyük önemi haizdir. Kur`ân, Sünnet, İcmâ, Kıyas gibi delilleri, dinin küllî prensipleri ve muazzam fıkıh mirası ışığında, günümüz müslümanlarının ihtiyaçlarını karşılayabilecek şekilde kullanan ve yorumlayan Kardavî, tevarüs edilen mezheplerin sadece birini değil, hepsini aynı derecede taklide layık bulur. Bu kabul, bugün yaşanan birçok sorunun cevabını, değişik mezheplerden seçerek almayı sağlarken, ictihad ehliyetine sahip olan herkese ictihad etmenin önünü açmaktadır."
