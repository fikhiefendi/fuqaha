abstract: "Bu çalışmada, Şâfiî tabakât kitaplarında ismi geçen, üçüncü neslin önde gelen fakihlerinden olup mezhebin kurucusu İmam Şâfiî'nin (ö. 204/820) usûl ve kaidelerini dikkate alarak görüş beyan eden Ebû Saîd el-İstahrî'nin (ö. 328/940) ibadet ve aile hukuku özelinde mezhebe muhalif görüşleri ele alınmaktadır. Dönemin çeşitli âlimlerinden temel İslâmî ilimleri tedris ettikten sonra fıkıh ilmine yoğunlaşan ve bu ilimde önemli bir mesafe kateden İstahrî, başta Ebü'l-Kâsım el-Enmâtî (ö. 288/901) olmak üzere birçok âlimin rahle-i tedrisinden geçerek zekâsı, aklı, fıkhî meseleleri kavrama yetisiyle dikkatleri üzerine çekmiştir. Bundan mütevellid o, kısa zamanda müctehidlerin övgü ve iltifatlarına mazhar olmuş; dönemin halifeleri tarafından Kum ve Sicistân'a“kadı”; Bağdat'a ise“muhtesib”olarak atanmıştır. Kaynaklarda çokça kitap telif ettiği söylense de kendisinden fıkhî görüşlerini ihtiva ettiği bir eser günümüze –görüldüğü kadarıyla- intikal ettiği tespit edilememiş; ancak bu görüşlere Şâfiî mezhebinin farklı kaynaklarında oldukça yer verildiği görülmektedir. İstahrî, çoğunlukla mezhepte müftâ bih görüşe muvafık kalsa da yer yer İmam Şâfiî'nin kavlini farklı yorumlaması, ilgili fıkhî meseleye literal yaklaşması, konuya ilişkin ayet veya hadislerin zâhirîyle istidlâl etmesi ya da aklî temellendirmede bulunması gibi birtakım gerekçelere binaen farklı görüşler ileri sürmüştür. Elbette ki bunda onun fıkhî birkimi, münazara ehli ve delil sunma becerisinin güçlü olması gibi özelliklerinin bulunması fıkıh meselelerini temellendirmedeki metodu ve ictihad ameliyesini etkin bir şekilde kullanmasının rolü büyüktür. Bu yüzdendir ki, onun ilmî ve içtihâdî şöhreti sadece müntesibi olduğu mezheble sınırlı kalmamıştır. Nitekim onun görüş ve tercihleri Hanefî, Mâlikî ve Hanbelî mezhebinin temel fıkıh kaynakları yanında mukayeseli olarak kaleme alınan birçok eserde incelenir olmuştur. İstahrî'nin mezhebe büyük bir zenginlik kazandıran farklı görüşleri, -mezhebin genel kanaatine aykırı olsa da- fukaha tarafından değer görmüş; bu görüşler birçok fıkıh eserinde yer edinmiştir. Bu yüzden o, Şâfiî müctehid sıralamasında“ashâbü'l-vücûh/müctehid fi'l-mezheb”kategorisinde değerlendirilmiştir. Bu çalışma giriş, üç bölüm ve sonuçtan müteşekkildir. Giriş bölümünde çalışmanın konusu, önemi, amacı, yöntemi, kaynakları, kapsam ve sınırlılıklarından bahsedilmiştir. Birinci bölümde ise İstahrî'nin hayatı, yaşadığı dönemin siyâsî, içtimâî, iktisâdî ve ilmî kültürel yapısı, ilmî kişiliği, kendilerinden ders aldığı hocaları, ders halkasına iştirak eden talebeleri, telif ettiği eserler ve Şâfiî mezhebindeki konumu ayrıntılı olarak ele alınacaktır. İkinci ve üçüncü bölümlerde ise İstahrî'nin ibadet ve aile hukukuna münhasır mezhebe muhalefet ettiği görüşleri meseleye ilişkin referans gösterdiği aklî ve naklî deliller bağlamında mukayeseli olarak detaylı bir şekilde incelenecektir. Sonuç bölümünde de araştırma sonucunda elde edilen veriler ve tespit edilen farklılıklar aktarılacaktır."
