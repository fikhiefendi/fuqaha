abstract: "Taraflar arasında geçerli bir hukukî ilişki olmaksızın arazi malikinden başka bir kişiye ait malzemenin kullanılarak başkasının arazisinde, başkasına ait malzeme ile kendi ara-zisinde ya da başkasına ait malzeme ile başkasının arazisinde yapılan yapılar haksız yapı olarak adlandırılmaktadır. Haksız yapının uygulamada en çok karşılaşılan türü ise bir kimsenin kendi malzemesini kullanarak başkasının arazisinde yapı meydana getirmesi hâlidir. Öneminden dolayı bu çalışmada haksız yapının özellikle bu türü ele alınmıştır. Konu ele alınırken haksız yapının unsurları incelendikten sonra bir arazide haksız yapının varlığı durumunda tarafların ileri sürebileceği taleplerin neler olduğu 4721 sayılı Türk Medenî Kanunu kapsamında ele alınmıştır. Bu çalışmanın amacı başkasının arazisi üzerinde inşa edilen haksız yapının uygulamada sıkça karşılaşılan kendi malzemesiyle başkasının arazisi üzerine yapı inşa edilmesine yol açan sebeplerin incelenmesi ve bu tür yapılara uygulanacak hükümlerin tespit edil-mesidir."
