abstract: "Zekâtın vergi sistemleri içerisinde konumunu konu alan çalışmalar son yıllarda artış göstermekle birlikte Türkiye'de az sayıda çalışmada ele alınmıştır. Zekâtın harcama kalemleriyle transfer harcamalarının benzeştiği noktalarının bulunması bu konuyu daha önemli hale getirmektedir. Araştırma, Türkiye'de zekâtın kurumsallaşması ve zekât ödemelerine sağlanabilecek vergisel avantaj/avantajları ve zekât potansiyelini konu edinmektedir. Araştırmada nitel yöntem, yarı yapılandırılmış mülakat tercih edilmiştir. Bu doğrultuda, zekât veren 22 gelir vergisi mükellefiyle görüşmeler gerçekleştirilmiştir. Katılımcıların zekâtı nasıl tanımladıkları, zekât verirken kullandıkları yöntemler, zekâtın vergi sisteminde tanımlanmasına ve kurumsallaşmaya bakış açıları, zekât için sağlanabilecek vergisel avantajlara dair düşünceleri, Türkiye'deki zekât potansiyeline ve bu potansiyelin yoksulluk üzerindeki etkisine dair sorular sorulmuştur. Katılımcıların 14'ü zekâtın kurumsallaşmasını gerekli görmektedir. Tüm katılımcılar, kurumsal yapının güven ve şeffaflık ilkelerini sağlaması gerektiğini vurgulamıştır. 22 katılımcıdan 13'ü kurumsallaşmanın devlet tarafından, 10'u ise devlet eliyle kurulan farklı bir sistemin uygulanması gerektiğini ifade etmişlerdir. Katılımcıların beşi ise kurumsallaşmanın olmaması gerektiğini ifade etmiştir. 12 katılımcı zekâtın Türk vergi sisteminde tanımlanmasını istediklerini ancak vergisel avantajların sağlanması konusunda tereddüt ettiklerini; sekiz katılımcı ise vergisel avantajın sağlanması gerektiğini vurgulamıştır. Katılımcıların tamamı zekâtın kurumsallaşması neticesinde Türkiye'deki yoksulluğu azaltıcı yönde etkisi olduğunu ifade etmişlerdir. Çalışmanın literatüre diğer katkısı ise 2011-2022 yılları için zekât potansiyeli hesaplaması yapmasıdır. Bu hesaba göre, zekât potansiyeli GSYİH'da yüzde 1.7 ile yüzde 3 arasında paya sahiptir."
