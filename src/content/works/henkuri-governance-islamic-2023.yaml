abstract: "This study aims to manifest the principles and concepts of the governance of the Islamic law supervisory and its legitimacy. It also aims to reach the most important criteria of the governance of the Islamic law in terms of legislation and jurisprudence. The study differentiates between the governance criteria in the financial Islamic institutions and the other governance criteria in the other institutions. The study sheds lights upon the Islamic law supervisory in the Turkish Islamic banks and the extent to which the Islamic norms could be applied. The study constitutes of three chapters and a conclusion. In the first chapter, it manifests the notion of the Islamic supervisory, its adaptations and its components. It also illustrates the essence of the Islamic governance and its principles and the Islamic notion that is the legitimacy of the Islamic law supervisory governance. In the second chapter, the study tackles with the most prominent Islamic supervisory governance criteria compared to the criteria of the other Islamic financial institutions and the other traditional ones. The last chapter of the study deals with the Islamic law supervisory in the Turkish Islamic banks. To achieve this purpose, the study is concerned with the application of the descriptive approach based on induction, analysis and comparison. Then the study comes up to the findings of the importance of the Islamic law governance supervisory apparatus and its development. In addition to the most prominent criteria of the Islamic governance and the manifestation of its principles in the Islamic law. The study finds seven important standards that are considered the most important in the field of the Islamic law supervisory governance, namely: (Independence, mandatory fatwas and decisions of The Islamic Law Supervisory Board, standardization of reference, eligibility and dedication, commitment to fatwa controls and ethics, responsibility, consistency and balance between confidentiality and transparency). It also found the weakness and lack of independence of the legitimate monitoring bodies in the Turkish Islamic banks, and the necessity of having the central bank and the regulatory institutions in Turkey issue laws and decisions that are in accordance with the privacy of the Islamic banks and their operating system."
