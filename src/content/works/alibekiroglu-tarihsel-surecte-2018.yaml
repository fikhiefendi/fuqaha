abstract: "Ashâbu Ebî Hanîfe ile Mu'tezile arasındaki etkileşim, fıkıhta Hanefiliği benimseyen Mu'tezilîler ile Ashâbu Ebî Hanîfe içerisinden i'tizâli görüşleri benimseyen şahıslar nezdinde tezahür etmiştir. Bu etkileşimin her iki gelenek açısından da mezhepleşme sürecinin devam ettiği mihne öncesindekindeki ilk tezahürleri akılcılık zeminindedir. Bu süreçte Mu'tezile ve Ashâbu Ebî Hanîfe'nin itikadî kimliğini oluşturan Mürcie'nin temel tartışma mevzularını oluşturan halku'l-Kur'an-ircâ, kader-ircâ, rü'yet-ircâ, gibi farklı geleneklerle özdeşleşmiş fikirleri bir araya getiren şahıslardan bahsedilebilir. İki mezhebi eğilim arasındaki ilişkinin somut tezahürleri ise mihne süreci ile bağlantılıdır. Mihne sürecinde halku'l-Kur'an fikrini benimseyen ancak diğer i'tizâli fikirleri hakkında bilgi sahibi olmadığımız Ashâbu Ebî Hanîfe'den bazı şahıslarla, Mu'tezilî kimliği belirgin olan, Ashâbu Ebî Hanîfe'den sayılan ancak ilmi yönü belirgin olmayan Ahmed b. Ebî Duâd'dan (ö.240/854), fakih kimlikleri ile Ashâbu Ebî Hanîfe içerisinde saygın şahsiyetler olarak bilinen ve aynı zamanda Mu'tezile tarafından da sahiplenilen şahıslar yer almaktadır. Mihne sonrası süreçte ise Ashâbu Ebî Hanîfe ile Mu'tezile etkileşimine Mu'tezilî kimlikleri belirgin olan ve Mu'tezilî mütekellim olarak tanınan ancak Ashâbu Ebî Hanîfe'den Kerhî (ö.340/952) gibi şahıslardan ders almak suretiyle Hanefî gelenek ile ilişkisi tesis olunan şahısların dahil olduğu görülmektedir. Bu süreçte yine fakih kimlikleri ile bilinen ancak Mu'tezile içerisinde sayılan şahıslar nezdinde de iki mezhep arasındaki etkileşim tezahür etmiştir."
