abstract: "Akdin korunması insanların hayatlarını idâme ettirmeleri için gerekli olan muâmelelerde belli ilkeler çerçevesinde kolaylaştırıcı yolu bulmayı amaçlamaktadır. Bunun için İslâm tarihi boyunca fakihler kullanılan akitleri incelemişler ve İslâmın getirdiği ilkelere aykırı olmayacak şekilde düzenlemişlerdir. Aykırı olan fâsit akitleri ise olabildiğince bu ilkelere uygun şekilde düzenleyip iptal edilmemesi için çaba harcamışlardır. Bundan maksad İslâmın insan hayatını kolaylaştırmayı hedefleyen makâsıdü'ş-şerîayı hayata taşımaktır. Fakihler bu şekilde akitleri korumaya çalışırken örf, istishâb, istihsân ve delâlet-i iktizâ gibi çeşitli ilke, kâide ve usûller kullanmışlardır. Bu çeşitlilik sebebiyle de akdin korunması hususunda ihtilâflar ortaya çıkmıştır. Özellikle dört mezhebin vaz' ettikleri kâidelere binaen zamanla bey' bi'l-vefâ, isticrâr, teverruk, tevrîd, icâreteyn, sigorta gibi yeni bir takım akitler ortaya çıkmıştır. Bu akitler de fakihlerin daha önce kullanmış oldukları hile-i şer'iyye, tashihü'l-ukûd, taharrî li'l-cevâz, tarîkü'l-itibâr ile iptal edilmemiş bilakis korunmuşlardır. Akdin korunması hususunda fakihler çok fazla çaba harcamışlardır. Öyleki zarar, aldatma (garar) veya ribâ şüphesi olan durumlarda bile akdi korumaya gayret etmişlerdir. Bu araştırmadan beklentisi, fâsit akitlerin her zaman feshedilmesinin kaçınılmaz olduğuna ve bu akitlerin devam edemeyeceğine inanan geniş bir kitlenin zihinlerinde, fukahanın, akitleri tamamlamayı insan irâdesine bir saygı olarak gördüğü ve fâsit akitleri tashih ederek korumaya çalıştığı düşüncesini inşa etmektir. Günümüzde İslâmi finans sisteminde de esnekliğin bulunduğu ve her fâsit sözleşmenin iptâl edilmemesi gerektiği konusunda onların zihinlerinde yeni kanaatler oluşması."
