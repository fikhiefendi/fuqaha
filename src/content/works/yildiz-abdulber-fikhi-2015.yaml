abstract: "İbn Abdülber, İslamî ilimlerin birçoğunda kendini yetiştirmiş, Mâlikî ekole mensup Endülüslü bir fakihtir. Genelde hadis ilminde söz sahibi bir âlim olarak bilinmekle birlikte fıkıh alanında müctehid derecesinde bir âlimdi. Kurtuba'da yetişen İbn Abdülber, yaşadığı dönemde ortaya çıkan iç çekişmeler nedeniyle yurdunu terk ederek Endülüs'ün değişik şehirlerini dolaşmak durumunda kalmıştır. İlmî yolculuklarla dönemin ilim merkezlerinden biri konumuna gelen Endülüs, İmam Mâlik'in öğrencilerinin çabalarıyla Mâlikî bir çehreye bürünür. Mısır ve Kayravan merkezli Mâlikî ekolünün gölgesinde gelişen Endülüs fıkhı, birçok fakih yetiştirir. Endülüs ekolü, İbn Abdülber gibi âlimler sayesinde aslî kaynaklara dönmeye ve ictihadı teşvik eden birçok değerli çalışmaya şahit olur. İbn Abdülber, özünde Mâlikî ekole bağlı bir fakih olmasına rağmen, fıkhî ictihadları ve görüşleri körü körüne alıp kabul eden bir âlim değildir. Aslî kaynaklara uymadığına inandığı görüşler, kimin olursa olsun karşı durur, eleştirir ve olması gereken şeklini ortaya koymaya çalışır. Mâlikî mezhebinin görüşlerini açıklayan eserler yazdığı gibi mukayeseli fıkıh anlayışıyla ilgili eserler de kaleme almıştır. Özgür düşünceyi teşvik ettiği gibi taklid anlayışını da eleştirir. Bu nedenle fıkıhta yeterli donanıma sahip âlimlerin ictihad etmeleri gerektiğini savunarak yetkin âlimler için taklidin uygun olmadığını söylemiştir."
