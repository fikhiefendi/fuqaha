abstract: "Sosyal amaçlı finans fonların bir ülkede insan kaynaklarının gelişmesine, ülkenin ekonomik büyümesini hızlandırmasına, maddi (ekonomik) ve manevi yoksulluğun azaltılmasına büyük katkı sağladığı bilinmektedir. Bu çalışma burs fonlarının bursiyerlerin maddi ve manevi refahı üzerindeki etkilerine ilişkin mikro finans literatürünü ve insani gelişme boşluğunu doldurmayı amaçlamaktadır. Araştırmaya dahil edilen grup, lisans, lisansüstü LPDP ve Türkiye Bursları (YTB) eğitim bursu alarak eğitimlerini tamamlayan 382 kişilik mezun bursiyerleridir. Literatür incelenerek burslu mezunların maddi (ekonomik) refahını ölçmek amacıyla azim, aile koşulları, eğitim düzeyi, eğitim süresi, burs miktarı, öğrenim deneyimi, genel not ortalaması ve mezunlar ağı olmak üzere sekiz değişken kullanılmıştır. Ayrıca katılımcıların manevi refahını ölçmek için de CIBEST yönteminin manevi değer göstergeleri olan namaz, oruç, zekât, hane halkının çevresi ve hükûmet politikaları değerlendirilmeye alınmıştır. Çalışmada elde edilen veriler En Küçük Kareler yöntemi (Ordinary Least Square/OLS) ve CIBEST modeli ile ölçülmüş, ardından katılımcılar refah endeksi, maddi (ekonomik) yoksulluk endeksi, manevi yoksulluk endeksi ve mutlak yoksulluk endeksi olmak üzere dört kadrana ayrılmıştır. Çalışmanın sonuçlarında, maddi (ekonomik) refahın, aile koşulları, eğitim deneyimi, eğitim süresi ve eğitim düzeyi değişkenlerinden etkilendiği ortaya konmuştur. Aynı zamanda da genel not ortalaması, eğitim deneyimi, burs miktarı ve mezunlar ağı değişkeninin, burslu mezunların manevi refahını etkilediği belirlenmiştir. LPDP ve YTB bursunu aldıktan sonra LPDP mezunlarının %98'sinin ve YTB mezunlarının %100'ünün maddi (ekonomik) ve manevi açıdan müreffeh anlamına gelen 1. kadrana yükseldiği gösterilmiştir."
