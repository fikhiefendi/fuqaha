abstract: "İnsan özgürce yaşama, evlenme ve istediği kadar çocuk sahibi olma gibi doğal haklara sahiptir. Ancak bazı devletler nüfus planlaması adı altında insanların bu doğal haklarını ellerinden almaktadır. Bu tez, İslam hukuku perspektifinden nüfus kontrolü ve devlet zoruyla kürtaj konularını Doğu Türkistan örneği üzerinden derinlemesine incelemektedir. İlk bölümde nüfus kontrolü, aile planlaması, doğum kontrolü, kürtaj ve biyopolitika kavramları incelenecektir. İkinci bölümde, Doğu Türkistan'da uygulanan nüfus politikaları ve her çeşit uygulamalar irdelenmektedir. Son bölümde ise, nüfus planlaması ve zorla kürtaj konuları İslami bakış açısıyla değerlendirilmektedir. Tez, devlet müdahalesinin İslam hukuku açısından meşruiyetini sorgularken, konuyu insan hakları ve dini özgürlükler bağlamında da tartışmaktadır. Sonuç olarak, nüfus planlaması ve kürtaj gibi hassas konuların, İslam hukuku, insan hakları ve etik değerler çerçevesinde dengeli bir şekilde ele alınmasının gerekliliği vurgulanmaktadır."
