abstract: "İslâm dini müsamahalı ve kolaylaştırıcı bir dindir. Bu yüzden İslâm hukukundaki hükümler, güç ve takatleri farklı olan mükelleflerin durumuna ve onların içinde bulundukları şartlara göre değişebilmektedir. Allah insanlara güç yetirebilecekleri hatta güçlerinin altında sorumluluklar yüklemektedir. Allah hiçbir zaman insanı gücünün son sınırına kadar zorlamaz, sıkıntıya sokmaz ve ona meşakkat vermez. Bedensel engel de hükümlerde değişiklik ve kolaylığa sebep olan durumlardandır. Mükellef olan bedensel engelliler için, bulundukları özel durumlarından dolayı küllî hükümlerden istisna yapılarak daha kolay hükümler verilmektedir.Araştırmanın konusu İslâm hukukunda hükümlere tesiri bakımından bedensel engeldir. Araştırmanın esasını klasik fıkıh kitaplarında geçen içtihat, görüş ve çözümler oluşturması sebebiyle, önce İslâm hukukunun ilk kaynaklarına müracaat edilerek, konuyla ilgili veriler toplanmıştır. Daha sonra çağdaş, İslâm hukuku ve diğer alanlardaki ilgili çalışmalar incelenip bedensel engelliler hakkında bilgilere ulaşılmıştır. Bu bilgiler incelenerek yeniden tasnif edilip, analiz ve senteze tâbî tutularak yorumlanıp, değerlendirilip ve anlamlı bilgiler bütünü haline getirilerek, isabetli görüşlere ulaşılmaya çalışıldı.Bu araştırmanın amacı, İslâm hukukundaki bedensel engelliler ile ilgili hükümleri Hanefî, Şâfiî, Mâlikî ve Hanbelî mezheplerine göre bir araya getirerek bedensel engelin İslâm hukukundaki hükümler üzerindeki tesirini ve bedensel engelin İslâm hukuk sistemindeki yerini belirlemektir.Araştırmanın sonucunda bedensel engelin; görme, işitme, konuşma ve ortopedik engel şeklinde bir tasnifinin yapılabileceği, bu engellerin her birinin İslâm hukukundaki hükümlere etkisinin olduğu, bedensel engellilerin engelli olmalarından dolayı ibadetlerde, muamelâtta, münekâhatta, müfarakâtta ve ukubatta farklı hükümler verildiği ve İslâm hukukunda bedensel engellilere imtiyazlar verildiği ve onlara fırsat eşitliği sağlandığı tespit edilmiştir.Anahtar Kelimeler: Engelli, a`mâ, esam, ahras, a`rac, zemîn, ibadât, tahâret, salat, sıyam, hac, halvet, cihad, muâmelât, akd, hidâne, ukubât, kısas, had, şehâdet, ikrâr, hilâfet."
