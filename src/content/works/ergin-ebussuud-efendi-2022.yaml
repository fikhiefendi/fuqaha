abstract: "İrşâdü'l-akli's-selîm ilâ mezâya'l-kitâbi'l-kerîm isimli eser, fakih, müfessir aynı zamanda şeyhülislâm olan Ebüssuûd Efendi tarafından yazılmıştır. İrşâdü'l-akli's-selîm, onun en çok tanınan ve okunan eseridir. Müellif, eserini dirayet metoduna göre yazmış ve âyetlerin tefsirinde birçok rivayete yer vermiştir. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusunu, amacını, önemini, metodonu ve kaynaklarını belirttikten sonra birinci bölümde Ebüssuûd Efendi ve eserleri hakkında bilgi verdik. İkinci bölümde ise İrşâdü'l-akli's-selîm ilâ mezâya'l-kitâbi'l-kerîm isimli eserin V. cildinde geçen yüz bir rivayetin hangi kaynaklarda geçtiğini tespit edip sıhhat durumları hakkında yapılan değerlendirmeleri aktardık. İncelenen yüz bir rivayetin otuz sekiz tanesi Kütüb-i Tis'a'da, yirmi iki tanesi diğer hadis kaynaklarında, otuz sekiz tanesi tefsir eserlerinde geçmekte olup üç tane rivayetin kaynağı bulunamamıştır. Yüz bir rivayetin otuz beş tanesinin sahih, bir tanesinin hasen, on sekiz tanesinin zayıf rivâyet olduğu, surelerin faziletleri ile ilgili tefsir eserlerinden nakledilen rivâyetlerin yedi tanesinin mevzu haber olduğu tespit edilmiştir. Kırk rivâyetin de sıhhat durumu hakkında hüküm verilememiştir. Çalışmaya konu olan İrşâdü'l-akli's-selîm ilâ mezâya'l-kitâbi'l-kerîm isimli eserin beşinci cildinde toplam yedi sûre ve altı yüz kırk bir âyet bulunmaktadır. Ebüssuûd Efendi, müteşâbih âyetleri göz önünde bulundurursak hemen hemen her âyette konu ile ilgili bir rivayeti mutlaka zikretmiştir. Zikrettiği rivayetlerin büyük çoğunluğu ilk dönem tefsir kaynakları ve Kütüb-i Tis'a'da yer almaktadır."
