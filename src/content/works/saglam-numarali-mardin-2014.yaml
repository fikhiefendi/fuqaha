abstract: "Şer'iyye sicilleri bölgesel ve şehir tarihi araştırmalarında son derece önemli yer tutmaktadır. Tez konumuz olan 244 Numaralı Mardin Şer'iyye Sicili de Mardin'in bölgesel, şehir, kültürel, sosyal ve ekonomik yapısını ayrıntılı bir şekilde bizlere ulaştıran çok önemli bir kaynaktır. Mardin şehri sosyo-kültürel açıdan kozmopolit bir yapıya sahiptir. Bu özeliğiyle Osmanlı Devleti'nin toplumsal yapısının genel özelliklerini yansıtmaktadır. Mardin kırsalında Müslüman nüfusun yoğunluğu fazladır. Şehir merkezinde ise Gayri-müslim nüfusun yoğunluğunun daha fazla olduğu görülmektedir. Genel olarak Müslümanlar daha çok ziraat, tarım ve hayvancılık gibi ekonomik faaliyetlerle uğraşırlarken, Gayrimüslimler ise daha çok sanat ve ticaret gibi şehirlerde faaliyet gösteren mesleklerle ilgilenmişlerdir. Bu çalışmayla 1860-63 yılarında Mardin şehrinin mahallelerini, kazalarını ve köylerini, sosyal yapısını, ekonomik faaliyet alanlarını, bu dönemde yaygın olarak kullanılan kişi adlarını, şehir, kaza ve köylerde yaşayan dini grupları ve bunlar arasındaki sosyal ilişkileri yansıtmaya çalıştık."
