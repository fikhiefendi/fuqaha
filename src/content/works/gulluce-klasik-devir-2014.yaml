abstract: "Hukuk tarihi araştırmalarının hukuk düzeninin kendi zamanı içerisinde ele alınarak yapılmasının gerektiğini mevzu edinen bu çalışmada, Osmanlı hukukunda, davalarda bulunan vekillerin klasik dönemde nasıl bir fonksiyonu eda ettikleri tetkik edilmeye çalışılmıştır. Bu çalışma, fıkıh kitaplarında yer alan vekalet akdi ve onun alt başlığı olan husumete vekalet akdi çerçevesinde ele alınarak yapılmış ve bir özel hukuk düzenlemesi ile hukuki ihtiyaçların nasıl giderildiği tespit edilmeye çalışılmıştır. Bu araştırma yapılırken Osmanlı hukukun muteber kaynakları; fıkıh kitapları, fetva mecmuları, kanunnameler ve mahkeme kayıtları esas alınmıştır. Fıkıh kitaplarında yer alan hukuki mevzuatın tatbikatta -mahkeme kayıtlarında ve fetva mecmualarında- ekseriyetle bir uyum içerisinde yer aldığı, bu metot ile tespit edilmiştir. Bunun yanında avukatlık benzeri bir fonksiyonu eda eden vekillerin, onlara tanınan hukuki serbesti ile yaygın olarak kullanıldığı görülmüştür. Hem kadıların etkin pozisyonu hem de vekilliğin iş haline getirmenin ekseriyetle ortaya çıkardığı menfi neticeler sebebiyle, vekilliğin belirli bir zümreye hasredilmeden, ihtiyaç halinde tevkilin mümkün olacağı bir şekilde düzenleme yapıldığı görülmüştür. Bu vekillerin hakları ve yetkileri de husumete vekalet akdi ile detaylı bir şekilde belirlenerek davalarda vekillerin kullanılmasına, sistemin kendi dinamiklerine has bir şekilde izin verilmiştir."
