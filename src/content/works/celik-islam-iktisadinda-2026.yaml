abstract: "Bu çalışma İslam iktisadının önemli bir parçasını oluşturan kamu maliyesi özelinde geçmişten günümüze bir inceleme yapmaktadır. Çalışma kapsamında“günümüz pratiklerinde İslam'ın emir ve yasaklarına göre düzenlenmiş bir mali sistem inşa edilebilir mi?”araştırma sorusuna yanıt aranmıştır. Bu amaçla İslam iktisat tarihindeki mali uygulamalar, 20'nci yüzyıldan sonra gelişen İslam iktisadı disiplini içerisinde maliye alanına ilişkin tartışılan teoriler ve zekât ve kamu borçlanması özelinde uygulama örnekleri incelenmiştir. İslam iktisadının tarihsel kökeninde kamu maliyesi önemli bir konumda olmasına rağmen günümüzde kamu maliyesine ilişkin tartışmalar nispeten azalmış, alanın gelişimi finans piyasasına doğru kaymıştır. Bu kapsamlı çalışma İslam iktisadı kamu maliyesi tartışmalarını tekrardan gündeme getirmektedir. Araştırma sorusuna yanıt aramak için çalışmanın üçüncü bölümünde 25 akademisyenden oluşan katılımcılarla mülakat yöntemiyle veri toplanarak, tematik analiz yöntemi ile nitel bir analiz gerçekleştirilmiştir. Nitel analiz yapılırken MAXQDA 24 bilgisayar programından yararlanılarak çeşitli şekiller ve tablolar oluşturulmuştur. Katılımcı görüşleri sonucunda altı tema ön plana çıkmıştır. Buna göre İslam iktisadı içerisinde maliye biliminin çok önemli bir konumunun olduğu, buna karşın alana olan ilginin zamanla azaldığı çıkarımı yapılmıştır. Alanın gelişiminin finansa kayması maliye alanını da etkileyecek şekilde çeşitli problemleri de beraberinde getirmiştir. İslam iktisadı ilkelerini benimseyen bir kamu maliyesi sisteminin günümüzde bütüncül olarak uygulanması kolay değildir. Buna karşın katılımcı görüşlerinden hareketle sistemde kısmi eklemeler de mümkün gözükmektedir. Katılımcıların birçoğu devletin piyasayı bozmayacak şekilde faaliyette bulunması gerektiğini ifade etmiş, devletin etkinsizliği sorunu göz önünde bulundurulduğunda vakıflar ve STK'lar gibi kuruluşlar ya da kamu sektörünün özel sektörlerle iş birliği içerisindeki çalışmaların yaygınlaşması gerektiği önerisinde durulmuştur. Katılımcıların bazıları devleti daha minimal şekilde tanımlamıştır. Kimisi de sosyal devlete vurgu yapmıştır. Ama her iki taraf da devletin denetim fonksiyonunu etkin şekilde kullanması gerektiğini ifade etmiştir."
