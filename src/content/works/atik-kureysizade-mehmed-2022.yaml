abstract: "Kureyşîzâde Mehmed Fevzi Efendi, Osmanlı Devleti'nin son döneminde yaşamış alimlerdendir. Kureyşîzâde Mehmed Fevzi Efendi'nin yayımlanmış yetmiş beş eseriyle yazma halinde iki küçük risâlesi tespit edilmiştir. İbadetlerle ilgili ise bilinen on bir eseri mevcuttur. Bu çalışmada Kureyşîzâde Mehmed Fevzi Efendi'nin ibadetlerde ilgili olarak yazdığı Câmiu's-Salavât ve Seyfü'l-cihâd fî nasri'l-ibâd adlı risalelerinin transkripsiyonu, incelenmesi ve kaynaklarının tespit edilmesi amaçlanmıştır. Tez giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde çalışmanın konusu, amacı, yöntemi ve kaynakları üzerinde durulmuştur. Birinci bölümde Kureyşîzâde Mehmed Fevzi Efendi'nin hayatı, ilmi kişiliği ve eserlerinden kısaca bahsedilmiştir. İkinci bölümde Câmiu's-salavât adlı risâlenin transkripsiyonu yapılmış, kaynakları tespit edilmiş, risale hakkında genel bilgilere yer verilip muhtevası incelenmiştir. Üçüncü bölümde ise ikinci bölümde olduğu gibi Kureyşîzâde Mehmed Fevzi Efendi'nin Seyfü'l-cihâd fî nasri'l-ibâd adlı risâlesinin transkripsiyonu ve kaynaklarının tespiti yapılmış, risale hakkında genel bilgilere yer verilip muhtevası incelenmiştir."
