abstract: "Zekât, İslâm'ın temel rükünlerinden biri olup malî bir mükellefiyettir. Temel amacı muhtaç insanların geçimini finanse ederek, refahı toplumun tüm bireylerine yaymak, yoksulluktan kaynaklanan hırsızlık ve benzeri olayları önlemek suretiyle sosyal ve iktisadî dengeyi sağlamaktır. Zekâtın farziyetine delalet eden âyetlerin hepsi umumi lafızlarla varit olup tüm malların zekâta tabi olduğunu göstermektedir. Zekâtla ilgili hadislerin bir kısmı, bir takım malların zekâta tabi oluşunu ve zekât oranlarını beyan ederken, diğer kısmı da umumi manada zekâtın gerekli dinî bir emir olduğunu ifade etmektedir. Bir malda zekâtın vacip olması için birtakım şartlar gereklidir. Zekâtla ilgili nassların genelinden ve zekâtın vücup sebebinden nisaba ulaşıp nâmi/geliri olan her türlü malın zekâta tabi olduğu anlaşılmaktadır. Hz. Peygamber döneminde bulunup geliri olan malların büyük bir kısmının zekâta tabi oluşu ve zekât oranları sünnetle sabittir. O dönemde mevcut olup Sanayi dönemine paralel olarak iktisadî değeri, kemiyet ve keyfiyeti değişen gayrimenkuller, meyve ve sebze gibi zirai ürünler, ticarî amaçlı beslenen at, tavuk ve benzeri kanatlı hayvanlar, nâmi mallar vasfını kazandığından maksadı, felsefesi ve vücup sebebi açısından zekâta tabi olması gerekir. Hz. Peygamber döneminde mevcut olmayıp Sanayi devrimi sonrasında ortaya çıkan, teknolojinin gelişmesine paralel olarak daima büyüyen, gelişen ve yaygınlaşan sanayi tesisleri, gemi, uçak, otobüs, kamyon gibi nakliye ve ulaşım araçları ile iş makinelari ve benzeri vasıtalar, ticarî amaçlı olduğu takdirde zekâta tabi varlıklar kapsamına girmektedir. Bu tür varlıklar ticarî amaçlı olmayıp sahibinin işlerini ve ihtiyaçlarını karşılamaya yönelik olduğu takdirde“havâic-i asliye”kapsamına girdiğinden zekâttan muaftır. Hz. Peygamber döneminde bulunmayıp Sanayi devrimi sonrasında ortaya çıkan malların zekât nispetleri, zekât oranları sünnetle belirlenmiş mallara kıyas edilerek tespit edilebilir. Bu mallardan sanayi tesisleri gayrimenkul olması hasebiyle Sünnet ile zekâta tabi olduğu belirlenen mallar arasında ziraî araziye daha fazla benzerlik arz ettiğinden toprak mahsullerine kıyasla sâfi gelirinin 1/10 nispetinde zekâta tabi olduğunu söylemek, daha makul, daha isabetli gözükmektedir. Gemi, uçak, kamyon, otobüs gibi nakliye ve ulaşım vasıtaları ile iş araçlarının bal arısına kıyasla sâfi gelirinden 1/10 nispetinde zekâtının verilmesi zekât hukuku açısından daha mantıklı gözükmektedir. Sanayi devrimi öncesinde çoğunlukla ev ihtiyacına yönelik beslenen, ancak Sanayi inkılabı sonrasında ticarî amaçla beslenip üretilen kanatlı hayvanlar, ticarî maksatla deniz, göl veya akarsu kaynaklarında üretilen balıklar ve benzeri varlıklar, ticarî servet hükmüne tabi olup geliri ana sermayesine ilave edilerek toplamından 1/40 oranında zekâtı verilir. Fazla emek harcanmadan deniz, göl, baraj veya akarsulardan ticarî amaçlı avlanan balıkların sâfi gelirinin 1/10 nispetinde zekâta tabi olduğu söylenebilir."
