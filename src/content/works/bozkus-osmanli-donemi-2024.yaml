abstract: "İslam muhakeme hukukunda kat'î ve açık delili ifade eden beyyine kavramı, farklı ispat vasıtalarını kapsamaktadır. Bunlardan en yaygın kullanılanı şehadettir. Bu çalışmada, Osmanlı dönemi tercihu'l-beyyinat literatüründe şehadet bahsi iki eserin ilglili bölümleri üzerinden mukayeseli olarak ele alınacaktır. Söz konusu iki eser, Nev'îzâde Atâî'nin el-Kavlu'l-Hasen fî Cevâbi'l-Kavli li-Men adlı eseri ile Mahmud Hamza Efendi'nin et-Tarikatu'l-Vâzıha ile'l-Beyyineti'r-Râciha adlı eseridir. Genel adıyla beyyine olarak ifade edilen ispat vasıtalarına ilişkin çelişkili durumları ve bu hallerde üstün olanın tercihini konu edinen birtakım eserler telif edilmiştir. Tercihu'l-beyyinat literatürü olarak ifade ettiğimiz bu eserler, beyyineler arası tearuzun bulunduğu ve fıkıh kitaplarında farklı bölümlerde yer alan çok sayıda meseleyi derlemektedir. Dolayısıyla herhangi bir meselede tarafların beyyineleri arasında uyuşmazlık söz konusu olduğunda evla olanının belirlenmesi ve tercihi için meseleye dair doğrudan sundukları prensip niteliğindeki muhtevalarıyla tercihu'l-beyyinat literatürü, kâdının başvuracağı bir kaynak mesabesindedir. Bu tezde, 15-18. yüzyıllar arasındaki dönemde telif edilen yukarıda isimlerini zikrettiğimiz eserlerde Kitâbu'ş-Şehâde ve Mesâilu'ş-Şehâdât başlıklı bölümler karşılaştırmalı olarak incelenecektir. Kesinlik bildiren ispat vasıtaları arasında gerek kat'îlik ve gerekse yaygın kullanımı açısından ilk sırada gelen şehadet bu özellikleriyle kimi zaman beyyine kavramının doğrudan bir karşılığı gibi de kullanılmıştır. Şehadetle ilgili meselelerde beyyineler arasında uyuşmazlık görülen durumlar şahitler ve özellikleri, şahitlikte nisab, şahitlikten rücu', yalancı şahitlik, şahitliğin niteliği, şahitlerin ihtilafı, şahitlik yapılan konu şeklinde kısaca sıralanabilir. Ayrıca beyyinelerin tercihi hususunda bir kriter olarak da şahitliğin söz konusu eserlerde yer aldığı görülmektedir. Öyle ki tarafların çatışan beyyineleri arasında tercih yapılırken şahitlerin niteliği veya sayıları gibi açılardan değerlendirildiği durumlar mevcuttur. Bu bakımdan tezin çerçevesi olarak belirlenen eserlerde şehadete ilişkin meselelere dair tearuz bulunan durumların işlenmesi, çalışmanın iki ana unsuru olarak ifade edilebilecek olan şahitlik ve tercihu'l-beyyinat kavramları ile aralarındaki irtibat açısından anlamlı olacaktır. Böylece çalışmanın şahitlik kavramını farklı yönleriyle konu edinen mevcut çalışmalardan ayrılmış ve tercihu'l-beyyinat literatürü çerçevesinde bir inceleme olması bakımından da özgün olması hedeflenmektedir."
