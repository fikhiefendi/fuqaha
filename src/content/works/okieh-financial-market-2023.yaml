abstract: "Bu tezin amacı, geleneksel finansal piyasa risk yönetimi ile islami finans arasındaki benzerlik ve farklılıkları araştırmaktır. Tezin kapsamı, finansal piyasalar sisteminde risk yönetiminin temel ilkelerini belirlemektir. Bu çalışmada kullanılan yöntem, geleneksel finans ve islami finans alanındaki risk yönetimi ilke ve uygulamalarının karşılaştırmalı bir analizidir. Çalışma, akademik literatür, endüstri raporları ve risk yönetimi vaka çalışmaları dahil olmak üzere bir dizi kaynaktan yararlanmaktadır. Bu tezin temeli, geleneksel finansal piyasa risk yönetimi ile islami finans arasında önemli farklılıklar olduğudur. Geleneksel yaklaşım, riski yönetmek için türevlerin ve diğer finansal araçların kullanımına dayanırken, islami finans etik ilkeler ve risk paylaşımı sistemine dayanmaktadır. Bu farklılıkların islami finans alanındaki risk yönetimi üzerindeki etkileri, riske farklı bir yaklaşım gerektirdikleri için önemlidir. Bu çalışmanın bulguları, islami finans alanındaki uygulayıcılar ve politika yapıcılar için önem arz etmektdir. Çalışma, islami finans alanında risk yönetimi ilkelerinin daha iyi anlaşılması ve bu ilkelerle uyumlu yeni risk yönetimi araç ve tekniklerinin geliştirilmesi ihtiyacını vurgulamaktadır. Genel olarak, çalışma islami finans alanındaki risk yönetiminin zorluklarının ve fırsatlarının daha iyi anlaşılmasına katkıda bulunmakta ve bu alanda gelecekteki araştırmalar için bir temel oluşturmaktadır."
