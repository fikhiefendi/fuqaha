abstract: "Osmanlı hukukunun yansıdığı en önemli kaynak şer'iyye sicilleri, kadı sicilleri veya mahkeme defterleri adı ile bilinen defterlerdir. Bu defterler, içerdikleri kayıtlar sayesinde Osmanlı devlet ve millet sisteminin ne şekilde işlemekte olduğunu gösteren çok önemli kaynaklar arasındadır. Yine bu kaynaklar, Osmanlı taşrasının sosyal ve iktisadî yapısını gösteren en önemli kaynaklardandır. Çalışmamıza konu olan 1899 numaralı kadı (şer'iyye) sicilinde yer alan kayıtlar neredeyse bütünüyle Trabzon üzerinden doğu sınırlarında İran ile savaşmakta olan Osmanlı ordusunun ikmal ve iaşesine ait 1733-1737 tarihli kayıtlardan oluşmaktadır. Bu kayıtlardan Osmanlı ordusunun ikmal ve iaşesinin hangi şartlarda gerçekleşmiş olduğu çıkartılabilmektedir. Bu defterdeki kayıtlar asker ve erzak temini, askerlerin geçtiği güzergâhlar, yol tamirleri, savaşın finansmanı, erzak ve mühimmat türleri gibi pek çok konuya dair bilgi sağlamaktadır. 1723-1746 Osmanlı-İran savaşlarının aralıksız devam ettiği dönemdir. Bu sebeple cepheye asker, erzak ve mühimmatın eksiksiz sağlanması savaşın seyri açısından hayati önem taşıyordu. Bunun için de devlet ordunun ikmal ve iaşesini eksiksiz ve zamanında gerekli yerlere ulaştırılması için bazı tecrübeli bürokratlar görevlendirilmiştir. Bu görevliler her türlü ne kadar zahire satın alınacağı, hangi mahzenlerde saklanacağı, kimin gemisine ne miktar yükleneceği ve ulaşım araçlarının temini gibi birçok şeyden sorumludurlar. Devlet, cephede savaşmakta olan ordunun ikmal ve iaşenin sağlanmasında hiçbir masraftan kaçınmamıştır. Bu çalışma, esasında iki amaç üzerine kurulmuştur. İlki Osmanlı devlet sisteminin organizasyon tecrübesini, ordunun ikmal ve iaşesindeki mükemmelliğini vurgulamak, ikincisi ise Trabzon'un, yani bir Osmanlı taşra yerleşiminin, Osmanlı-İran savaşlarına olan desteğini, ikmal ve iaşe açısından göstermektir."
