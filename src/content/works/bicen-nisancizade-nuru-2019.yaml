abstract: "On yedinci yüzyılda yaşayan Nişancızâde, on beşinci yüzyıl fakihi Şeyh Bedreddin'in yargılama usûlü ve muamelata dair telif ettiği ve uzun yıllar mahkemelerde başvuru kaynağı olarak kullanılan eseri Câmi'u'l-fusûleyn'i düzenlemek ve ıslah etmek amacıyla Nûru'l-'ayn fi ıslâhi Câmi'u'l-fusûleyn adlı eseri kaleme almıştır. Bu çalışma, Nûru'l-'ayn'ın 34-39. fasıllarının Câmi'u'l-fusûleyn ile incelenmesini ve karşılaştırılmasını amaçlamaktadır. Nûru'l-'ayn'daki 34-39. fasıllar birbirinden farklı altı konuyu kapsamaktadır. Bu fasılların konuları Câmi'u'l-fusûleyn'le ortakken, muhtevaları farklılık arzetmektedir. Araştırmamız iki bölümden oluşmaktadır. İlk bölümde, iki eserdeki bu fasılların muhtevası üslup ve telif tarzı bakımından karşılaştırılmış, Nişancızâde'nin yaptığı eklemeler ile fasıllardan çıkardığı meseleler ve son olarak kaynaklardan yararlanma üslubu incelenmiştir. Böylece Nişancızâde'nin Câmiʿu'l-fusûleyn'i nasıl ve hangi yöntemlerle ıslah ettiği tespit edilmiştir. İkinci bölümde ise Nûru'l-'ayn'ın 34-39. fasılları, iki farklı müellif nüshasına dayanarak tahkik edilmiştir."
