abstract: "Batılı düşünürler ve ilim adamları İslam'ın konu edildiği platformlarda genellikle İslam'da düşünce ve inanç özgürlüğü olmadığını iddia ederek delil olarak mürtede verilen cezayı öne sürmüşlerdir. Müsteşrikler yıllardır bu konu üzerinde yazılar yazmış ve İslam hukukundaki bu düzenlemeyi ifade ve fikir özgürlüğüne ters düştüğü düşüncesiyle eleştirmişlerdir. Konu, verilen idam cezalarının hukuki sebebine bakılmadan devletlerarası krizlere bile sebep olmuştur. Bu tezde İslam hukukçularının irtidat suçunu siyasi suç mu yoksa düşünce suçu mu kapsamında incelendiklerinin üzerinde durulacaktır."
