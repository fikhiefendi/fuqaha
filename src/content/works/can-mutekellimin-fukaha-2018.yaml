abstract: "İslam Hukuku Metodolojisi'nde, ilk dönemden itibaren Mütekellimîn ve Fukahâ usûlcüleri, lafzın manaya delâlet yolları ile istidlâl etmekte farklı görüşler ileri sürmüşledir. Zaman zaman aynı delillerle farklı hükümler çıkarmışlar veya başka farklı deliller yardımıyla aynı hükümleri elde etmişlerdir. Bu çalışmayı yapmamızdaki asıl amacımız, Mütekellimîn ve Fukahâ metodunu benimseyen usûlcülerin, lafzın manaya delâletiyle ilgili görüşlerini tek tek ele alıp, daha sonra iki metod arasındaki farkları ortaya koymaktır. Çalışmamızda öncelikle Mütekellim ve Fukahâ metodunun özelliklerine, farklarına, önde gelen âlimlerine ve ilgili eserlerine değinilmektedir. Daha sonra istidlâl ve delâlet kavramları ile delâletin dilsel ve dilsel olmayan kısımları hakkında bilgi verilmektedir. Sonrasında ise lafzın manaya delâlet yollarının bu iki metoda göre taksimi, tanımları, delil olabilmesi için gerekli olan şartları ve bu metodları benimseyen usûlcülerin fikirlerini ispatlamak için gösterdikleri örnekler ayrı ayrı incelenmektedir."
