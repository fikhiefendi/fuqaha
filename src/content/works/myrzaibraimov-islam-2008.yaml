abstract: "Bu çalışmada İslam Hukukunun kendine özgü kişilik hakkı anlayışı olduğu ifade edilmiştir. İslam Hukukunda kişilik hakkının anlam kazanması için, bu hakların uygulanabileceği ve iddia edilebileceği bir düzenin kaçınılmazlığı belirtilmiştir. Kişilik hakkı geniş bir kavram olup, kişilik hakkı çerçevesinde kişi, hak (vücub) ehliyeti, eylem (edâ) ehliyeti ve kişiliği oluşturan temel kişilik değerleriyle kişinin hukuki durumu (zimmet) gibi unsurlardan söz etmek mümkündür. Bu unsurlara söz konusu çalışmada kişilik hakkının konuları olarak görülebileceği üzerinde durulmuş ve İslam hukuk düzeni tarafından korunması gerektiği öngörülmüştür. İslam hukukunda kişilik hakkı, temel dinî ve kişilik değerleri çerçevesinde belirlenmektedir. Kişilik hakkının belirlenmesinde İslam Hukukunun hak kavramına bakış açısı da belirleyici rol oynamaktadır. İslam Hukukunda kişilik hakkı, hak süjesinin Allah'a karşı yükümlülüğünü yerine getirme adına üçüncü şahıstan hak iddia etme ve bu hakkı kullanma yetkisini ifade eder. İslam Hukukuna ilişkin klasik kaynaklarda kişilik hakkı, ölüm (ve gaiplik), dinden çıkma ve İslam ülkesinden ayrılmakla sonra ereceği tespit edilmiştir. Bütün bu konularda Hanefî ve Şâfiî mezheplerinin bir birinden farklı yaklaşım tarzları söz konusu olup, bu söz konusu farklı bakış açıları uygulamada da kendini fark ettirmektedir."
