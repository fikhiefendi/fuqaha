abstract: "Tezimiz, Cessâs'ın Makâsıd ve Maslahat konularını ele alarak, Cessâs'ın düşüncesindeki Makâsıd'a dair tutarlı bir usulî tasavvuru ve bunun maslahat ile ilişkisini incelemek suretiyle, Makâsıd ilminin doğuşu ve Hanefî mezhebinin bu konudaki rolüne dair yeni bir yaklaşım ortaya koymayı hedeflemektedir. Araştırmamızda, Cessâs'ın fıkıh, fıkıh usulü ve tefsir alanlarında kaleme aldığı metinleri incelemeye yönelik tümevarımsal analitik bir metodoloji benimsemiştir. Bu incelemeler sonucunda, Cessâs'ın, bilinen Makâsıd sisteminin kurucu kavramlarından farklı, derin usulî tahlillere dayanan tutarlı bir Makâsıdî yapı kurduğu ortaya çıkmıştır. Bu yapı iki temel kavram etrafında şekillenmiştir:“Hüsnü (iyi/güzel) olanı gözeten maslahatlar”ve“Aklın tahsin ve takbih'teki rolü”. Bu ikili, şeriatın gerçek hayatla olan etkileşiminin doğasına dair eşsiz bir temel vizyon oluşturmaktadır; zira şer'î emir iyi/güzel (hasen) olanla, şer'î yasak ise kötü/çirkin (kabih) olanla ilişkilendirilmektedir. Tezimizin en önemli bulgularından biri, Cessâs'ın Makâsıd için tutarlı bir teorik model sunan ilk kişi olması ve bunu fıkıh, fıkıh usulü ve tefsir'de kullanmasıdır. Bu model üzerine birçok usulî kural ve fıkhî mesele inşa eden Cessâs, genel Makâsıd düşüncesini“maslahatların temel dayanakları”(ma'âkidu'l-masalih) olarak adlandırabileceğimiz kavram çerçevesinde ortaya koyan ilk kişi olmuş ve bunları dinin, kanın, ırzın, nesebin ve malın korunması olduğunu beyan etmiştir. Bu durum, Cüveynî (ö. 478 h) tarafından makâsıd-ı hamse olarak meşhur olan beş temel maksadın kavramsallaştırılmasından yaklaşık yüz yıl öncesine denk gelmekte olup, bilinen Makâsıd tarihinin ve Hanefî mezhebinin bu konudaki yerinin yeniden gözden geçirilmesini gerektirmektedir. Cessâs ayrıca hürriyet, adalet ve ümmet düzeninin korunması gayelerine işaret etmiş, ayrıca kifâî farzlarla ilgili ilkeleri ortaya çıkarmıştır. Buna ek olarak, Ehl-i Sünnet metodolojisine uygun ve sistematik bir şekilde Fıkıh Usulü içinde“hüsün ve kubuh”ilkesinin temel konumunu öne çıkaran yaklaşımı tesis etmiştir. O'na göre aklın kesin olarak iyi veya kötü olduğuna hükmettiği hükümlerin, şeriatta nesih veya içtihad'a tabi olmayan temel hükümler olduğunu kabul etmiştir. Buna örnek olarak imanın ve adaletin vacip oluşu, küfrün, zulmün ve yalanın ise kötü oluşu verilebilir ki, bu durum metinleri anlama ve hüküm çıkarma üzerinde etkili olmaktadır. Çalışma, Makâsıdî metodolojinin çağdaş dönemdeki önemini, Hanefîlerin bu konudaki çabalarının değerlendirilmesini ve güncel meselelere değinen, fıkhî ve ahlakî bir bakış açısı sunan metodolojik bir yaklaşım haline getirilmesi için geliştirilmesini vurgulayan tavsiyelerle son bulmuştur."
