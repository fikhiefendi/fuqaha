abstract: "Bu çalışmanın amacı, Türkiye'deki sukuk uygulamalarını, çalışma esaslarını ve süreçlerini, Sukuk uygulamaları olan İslam ülkeleri, Malezya, Bahreyn ve Birleşik Arap Emirliklerinde olan Dubai örneği ile karşılaştırmalı olarak incelemektir. Ayrıca İslami finansta kullanılan yöntem ve ürünler ile ilgili standartları belirleyen İslami Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu (AAOİFİ) tarafından yayınlanan standartlar ile Türkiye'deki Sukuk uygulaması karşılaştırılarak\\ Türkiye'deki Sukuk uygulamasında eksiklikler ortaya koyulmuş ve önerilerde bulunmuştur."
