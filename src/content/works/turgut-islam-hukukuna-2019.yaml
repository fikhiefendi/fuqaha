abstract: "İslâm dininde bireylere özel mülkiyet hakkı tanınmış ve devletin zekât dışında kalan kişisel mallara ve piyasaya zaruri haller dışında müdahale etmesine izin verilmemiştir. Mülkiyet altındaki malların biriktirilmesine belli bir sınırlama konulmamış ancak malların âtıl bırakılması, sadece belli bir zümrenin elinde dolaşması ve bazı özel durumlarda malların biriktirilmesi yasaklanmıştır. Bu nedenle malî sorumluluklar, zekâtla sınırlı tutulmayıp ihtiyaç fazlası tüm malları kapsayacak şekilde genişleyebilmektedir. Böylece mükelleflere düzenli olarak zekât ve nafaka gibi malî yükümlülüklerin yanı sıra açların doyurulması, esaret altındakilerin esaretten kurtarılması, âkıle'ye yüklenen diyet, ihtiyaç hallerinde yolcu, misafir ve komşu hakları gibi sorumluluklar yüklenmiştir. Bu şekilde İslam'da toplumun bütün bireylerinin asgari temel ihtiyaçlarının karşılanması hedeflenmiştir. Dolayısıyla söz konusu ihtiyaçlar karşılanmadıkça ve zaruretler bertaraf edilmedikçe ihtiyaç fazlası malları biriktirmek caiz görülemez. Mülkiyet altındaki malların kullanımı ve harcanması konusunda bazı sınırlamalar getirilmiştir. Toplumsal bolluk ve refahın olduğu hallerde de aşırı lükse ve israfa izin verilmemiştir. Bu bakımdan ihtiyaçtan fazla yemek, ihtiyaç ötesi eşya ve bineklerin biriktirilip âtıl bırakılması, altın ve gümüş gibi çok değerli eşya ve madenlerin kullanım eşyası yapılması; erkekler için altın takılar ile ipek giysiler yasaklanmıştır."
