abstract: "Davranışsal iktisat, Neo-klasik iktisada karşı bir tepki olarak doğmuştur. Bu çalışmada klasik iktisadın eksik yanlarını davranışsal iktisat disipliniyle beraber, ahlak ve İslam iktisadı disiplinlerini ele alarak, insan davranışlarının tercihlerindeki etkisi hesaba katıldığında ekonomi bilimi farklı bir perspektiften ele alınmıştır. Davranışsal iktisat, insanın motivasyon, mutluluk, korku ve diğer duygularını yani baş aktör olarak insan faktörünü karar verici şeklinde ortaya koyarken insan tercihlerine etki eden olguları da görmemize sebebiyet vermiştir. İktisat bilimi bize, doğrudan veya dolaylı olarak ilişkide olduğu antropoloji, sosyoloji, psikoloji ve dini inançlar gibi insanların sosyal yaşamlarını ve davranışlarını konu alan bu disiplinler sayesinde her insanın farklı karakteristik özelliği olduğunu toplum içerisinde veya iktisadi kararlarda farklı tutumlar sergilediğini göstermiştir. İktisat ve psikolojiye baktığımız zaman bu bilimlerin alt yapısında insanın bulunduğu görülmektedir. Psikoloji insan davranışları ve bu davranışların nedenleriyle, ekonomi ise bireylerin iktisadi tercihleri ve onların bu tercihleri yaparken verdiği kararlarla ilgilenir. İktisadi bir olayda etik değerler ve dini inanç ile piyasa arasında bir ahenk olduğu için meşru kar, adil ücret, adil fiyat ve toplumun refahı gibi konular da fonksiyona dahil edilmelidir. İnsanların etkileşim halinde olduğu antropoloji, psikoloji ve sosyoloji gibi disiplinlerden etkilenen iktisat bilimine ilahiyat, iktisat tarihi, dinler tarihi bilimlerinin yanında insanların inançlarını da hesaba katarsak bu bize çok disiplinli bir model olan davranışsal iktisadı ve bunun ışığında İslam iktisadını daha iyi anlamamıza yardımcı olacaktır. Kişinin hayatına inançlarına göre yön vermesi, ekonomik faaliyetteki davranışını inançları çerçevesinde ele alması son derece doğal bir durumdur. İslam, insanı ticari hayatta serbest bırakır; fakat nefsani duygularının içinde olduğu bir şekilde bireyi sade bir halde iktisadi hayata salmaz. (Zaim, 1995)."
