abstract: "Sagânî, Kudâî'nin Müsnedü'ş-Şihâb ve Uklîşî'nin en-Necm adlı eserlerinden mevzû olduğunu söylediği rivayetleri, halk arasında meşhur mevzû rivayetleri, tamamı mevzû rivayetlerden oluşan kitapların adları ve bu kitapların ilk rivayetlerini ed-Dürrü'l-mültekat adlı eserinde derlemiştir. Bunun yanında hadis uydurma konusunda meşhur olmuş bazı kişilerin isimlerini de zikretmiştir. Sagânî, sahih, hasen ve zayıf rivayetlere mevzû hükmü vermesi sebebiyle âlimler tarafından tenkit edilmiştir. Irâkî itirazlarını bir reddiye ile ifade etmiştir. Bu çalışmada Sagânî'nin tespitlerine karşı yapılan itirazlar dikkate alınarak rivayetler değerlendirilmiştir. Karşılaştırılmalı bir yol izlenerek Sagânî'nin hükümlerindeki temel sâikler ve hükümlerinde isabetli olup olmadığı tespit edilmiştir."
