abstract: "İslam hukukunun en temel konularından biri, klasik fıkıh kitaplarının kitâbü'l-et'ime ve'l-eşribe bahislerinde ele alınan helâl gıdaya dair meselelerdir. Günümüzde helâl gıda konusu; gıda üretim tekniklerinin çeşitlenmesi, hazır ve paketli gıdaların yaygınlaşması, gıdalarda çok sayıda katkı maddesinin kullanılması ve alkolün çözücü olarak yer alması gibi gelişmeler sebebiyle daha da önemli hâle gelmiştir. İslam hukukçuları tarihsel süreçte, kendi dönemlerinde ortaya çıkan bu tür fıkhî problemleri çözmeye yönelik içtihatlar geliştirmiştir. Türkiye'de ise Din İşleri Yüksek Kurulu (DİYK), karar, mütalaa ve fetvalarıyla helâl gıdaya ilişkin güncel meseleleri değerlendirmekte ve çözüm üretmektedir. Bu çalışmada DİYK'in helâl gıdaya dair karar, mütalaa ve fetvaları; fetvanın dili ve üslûbu, fetva-mezhep ilişkisi, fetvanın muhtemel sonuçlarının dikkate alınması (i'tibâru'l-meâlât), makāsıdü'ş-şerîa, fetva-ahlâk ilişkisi ve fetvada değişim gerekçeleri gibi ölçütler çerçevesinde incelenmiştir. Nitel araştırma yöntemlerinden dokümantasyon ve içerik analizine dayanan çalışmada; helâl gıdaya ilişkin kavramsal çerçeve, DİYK'in bu alandaki çalışmaları ile Kurulun helâl gıdaya dair başlıca karar, mütalaa ve fetvaları ele alınmıştır. Araştırma sonucunda DİYK'in Kur'an ve sünnet merkezli bir yaklaşım benimsediği, klasik fıkıh müktesebatını ve mezhep birikimini dikkate aldığı, bilimsel veriler ve alan uzmanlarının görüşleri doğrultusunda gerektiğinde fetvalarını güncellediği anlaşılmaktadır. Kurulun ihtilaflı konularda ihtiyat ve sedd-i zerîa ilkesini esas aldığı; kaçınılması güç durumlarda ise umûmü'l-belvâ ve maslahat ilkelerini işlettiği görülmektedir. Ayrıca heyet içtihadına dayalı bu fetvaların bireysel fetvalara kıyasla daha sağlam temellere dayandığı söylenebilir."
