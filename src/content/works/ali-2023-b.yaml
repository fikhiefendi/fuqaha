abstract: "Şeyh ibn Qatlubugha'nın (H. 879) (Bab al-Wadi'ah) 'dan (spekülasyon kapısı) fıkıhta saflığı açıklama konusu inceleme ve inceleme: Bu, saflık metninin bir dipnot ve açıklamasıdır. Şeyh Mahmud bin Ahmed el-Mahbubi'nin fıkıh ilmi konusundaki fıkhı, bu tür açıklamalara ve dipnotlara ulaşmamı engelledi. metin, imamın açıkladığı ve mezhep şeyhlerinin görüşlerini gösterdiği fıkhî gelişmelerin meseleleri vasıtasıyla bu nüshadaki büyük ve büyük faydalardan istediklerime ek olarak, Şeyh'in zevk aldığına ek olarak. İbn Kutlubuğa -Allah ona rahmet etsin- ilmî bir duruşa, keskin bakışlara ve meseleleri ele alıp tenkide ve metni tefsirinde önemli kaynaklara dayanma konusunda ölçülü bir üsluba sahipti ve bu şüphesiz şeyhin delillerindendir. ansiklopedisi, geniş bilgisi ve deyimleri kaynaklarına isnat etmedeki doğruluğu.Mektup bir giriş ve iki bölümden -yani çalışma bölümü ve araştırma bölümü- ve bir sonuçtan oluşuyor ve bir sonuç olarak geldi. şöyle: İlk bölümde Şeyh Mahmud bin Ahmed Al-Mahboubi ve Şeyh İbn Kutlubugha hakkında konuştum ve bunu iki konuya ayırdım ve konuşma her konuda isimleri, soyları, durumları ve ölümleri hakkında geldi. İz bıraktılar. Ve kitabın adını ve müellifine nisbetini ispat etmek, şeyhin onu izahta kullandığı metodu, derleyenin dayandığı kaynakları belirtmek, sonra tahkikatta benimsediğim metodolojiyi belirtmek, nüshaların tasvibini zikretmek , onaylı nüsha, ardından soruşturma bölümü olan ikinci bölüm ve adı doğrulanmış metin, ardından sonuç ve en önemli bulguları içerir. Şeyh İbn Katlubuğa'nın şeriat ilimlerinde çok bilgili bir ansiklopedi alimi olduğu sonucuna vardım ve bu, onun fıkıh meselelerini ayrıntılı ve doğru bir açıklamayla açıklaması ve fıkıh kaynaklarının benimsenmesi ve onlara doğru ve doğru bir şekilde atıfta bulunulmasıyla açıkça ortaya çıkmaktadır. ve şer'i nassların anlaşılmasında aklî delillerin bolluğu, emanet bölümündeki fıkıh konuları, gasp, ipotek, kefalet, vekalet, havâle ve şirk gibi bir Müslümanın ihtiyaç duyduğu en önemli fıkıh bölümlerindendir. insanlarla olan mali işlemlerini düzeltmesi ve bunda Şeyh İbn Katlubugha'nın (Allah ona rahmet etsin) ansiklopedisinin açık ve net bir göstergesidir"
