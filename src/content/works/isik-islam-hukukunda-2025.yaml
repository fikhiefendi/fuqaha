abstract: "İslâm hukukunun insan hayatına dair temel ilkelerinin üç önemli kavram etrafında nasıl şekillendiği ve geliştiği incelenmiştir. Bunlar intihar, ötanazi ve istişhâd şeklindedir. Bu kavramlar, hem tarihsel süreçlerde hem de modern dünyada geniş bir tartışma alanı oluşturmuş, dinî, hukukî ve etik açılardan önemli soruları gündeme getirmiştir. Bu kapsamda çalışma, İslâm hukukunun bu konulara yaklaşımını, temel kaynaklar olan Kur'ân ve Sünnet ışığında ele alarak klasik fıkıh doktrinleri ve çağdaş yorumlarla birlikte ayrıntılı bir analiz sunmayı hedeflemiştir. İslâm hukuku çerçevesinde intihar, yalnızca bir bireyin kendi hayatını sonlandırması değil, aynı zamanda toplum düzenine ve kolektif sorumluluğa karşı bir suç olarak kabul edilmiştir. Çalışmada İslâm'ın hayatı kutsal kabul etmesi ve her canın Allah'a (c.c.) ait olduğu anlayışı üzerine inşa edilen bir yaklaşım sergilenmiştir. Bununla beraber ötanazi meselesi, özellikle tıbbi etik, hukuki sorumluluklar ve insan hakları açısından önemli bir tartışma konusudur. Bu kapsamda çalışmada ötanazinin İslâm hukukundaki yeri, hayatın dokunulmazlığı ilkesiyle nasıl örtüştüğü incelenmiştir. Aynı zamanda modern tıbbi uygulamalarda ötanaziye dair yapılan tartışmalar, İslâm hukukunun perspektifiyle nasıl uyumlu ya da uyumsuz olduğuna dair yorumlar geliştirilmiştir. İstişhâd, özellikle modern dönemde savaş, direniş ve dini motivasyonlarla yapılan eylemlerle ilişkilendirilmiştir. İslâm hukukunun bu kavrama yaklaşımı, yalnızca savaş hukukunun sınırlarını belirlemekle kalmamış, aynı zamanda İslâm'ın barış ve şiddetle ilgili temel öğretilerini de yansıtmaktadır. İstişhâdın meşruiyeti, yalnızca savunma savaşları ve zulme karşı direnişle sınırlı olmalıdır. Tüm bunlarla beraber bu çalışma, bu konulara dair İslâm hukukunun öngördüğü temel ilkeleri, kuralları ve yorumları ortaya koyarak bu meselelerin günümüz dünyasında nasıl daha sağlıklı bir şekilde ele alınabileceğine dair öneriler sunmuştur."
