abstract: "Klasik kaynaklarda ehliyet arızaları ile ilgili olarak cünûn ve ateh gibi belli başlı kavramlar bulunurken son dönemlerde -sınırları bilimsel olarak tartışılan- nörolojik, psikolojik ya da psikiyatrik rahatsızlıklar belirginleşmiştir. Bu çalışmada söz konusu rahatsızlıkların İslam hukukundaki ehliyet arızalarının (cünûn ve ateh özelinde) kapsamını teorik ve pratik düzlemde nasıl etkilediği vurgulanacaktır. Bu durum pek çok alanın kesişim noktasında bulunduğundan ilgili çalışmalar fıkıh, psikoloji, nöroloji, psikiyatri ve hukuki veriler merceğinden değerlendirilmiştir. Çalışmada öncelik teorik bir usul temeli oluşturmak olup pratik verilerden desteklik mahiyetinde faydalanılmıştır, problemleri kesin bir çözüme kavuşturmak iddiası yoktur. Teorik temellendirme için ehliyet arızası, özgür irade, niyet, maksada uygunluk, maslahat, hukuki benlik ve hukuki bilinç kavramları kullanılmıştır. Buna ilaveten adli psikiyatri etiği, nörohukuk, nöroetik tartışmaları değerlendirilerek konuya daha özgün bir katkı sağlanması hedeflenmiştir. Çalışma sonucunda söz konusu literatür çerçevesindeki güncel meselelerin fıkhî koordinatları ve adli bilimler desteği ile ele alınması belirginleşmiştir."
