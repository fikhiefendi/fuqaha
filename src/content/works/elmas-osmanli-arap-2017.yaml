abstract: "Arap Dili ve Edebiyatı, İslam dininin zuhuru ve yayılması ile paralel olarak gelişmiş ve farklı coğrafyalara taşınmış, tarihsel gelişim süreci içinde farklı değişim ve dönüşümler yaşamıştır. On beşinci yüzyılın başlarından itibaren İslam dünyasının tartışmasız tek siyasi otoritesi olan Osmanlı İmparatorluğu, özellikle Suriye, Mısır, Filistin ve Hicaz'ın fethi ile Arap dili ve edebiyatı için yeni bir dönemin başlangıcını ifade etmiştir. Özellikle modern dönemde Arap edebiyatı tarihçilerinin çoğunun bu dönemi inhitat, yani bir çöküş dönemi olarak adlandırmalarına karşın Osmanlı dönemi Arap edebiyatı, iddia edilenin aksine kendisine has karakteristik özellikleri haiz mümbit bir dönem geçirmiştir. İmparatorluğun her anlamda en parlak devrini ifade eden Kanuni Sultan Süleyman dönemi Arapça şiirleri bu durumun örnekliğini yansıtmaktadır. Dönemim şeyhülislamı Ebussuud Efendi, yazdığı Arapça kasidelerle edebi değeri, neredeyse kadim Arap şairlerle müsavi eserler meydana getirmiştir. Bu eserlerin en önemlilerinden biri olan Kasîdei Mîmiyye içerdiği, meramı ifadede en etkili yolları ihtivâ eden beyan ilmi unsurları ile öne çıkmaktadır. Bu çalışmada Ebussuud Efendi'nin eseri Kasîdei Mîmiyye beyan ilminin unsurları olan teşbih, mecaz, istiare ve kinaye kullanımı açısından incelenmiş ve bu bağlamda edebi değeri ortaya konmaya çalışılmıştır."
