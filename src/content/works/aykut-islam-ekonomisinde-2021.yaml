abstract: "“İslam Ekonomisinde Vakıf Müessesesi ve İstihdam: Yeni Bir Yaklaşım”konulu bu çalışmada karma araştırma yöntemi kullanılarak vakıf müessesesinin İslam ekonomisindeki yeri ve İslam medeniyetinde vakıf müessesesinin dayandığı dünya görüşü ele alınmış, çalışmada alanda yazılmış eserler incelenerek vakıf müessesesinin metodolojisine, işlevlerine ve istihdam ile ilişkisine yer verilmiştir. Çalışmada ayrıca İslam ekonomisinde vakıf müessesesinin istihdama katkısının olduğu, günümüz vakıf müesseselerinden elde edilen veriler ışığında ortaya konulmuştur. Bu verilerin bir kısmı ülkemizdeki vakıflara e-posta yolu ile gönderilen bilgi formlarının vakıflar tarafından doldurulması yoluyla elde edilmiş, büyük bir çoğunluğu ise kurum içi değerlendirme raporlarının tarafımızdan incelenmesi sonucunda derlenmiş bulunmaktadır. Bu çerçevede toplam 55 adet vakıf ve bunlara ait 160 rapor incelenmiş böylece vakıf müesseselerinin belli yıllarda bünyelerinde doğrudan ve/veya dolaylı olarak kaç kişiyi istihdam ettikleri, bunların ne kadarının ücretli ne kadarının ise gönüllü olarak istihdam edildiği tespit edilmiş, elde edilen bu veriler tablo ve grafik şeklinde çalışmamızda belirtilmiştir. Araştırmada vakıf müesseselerinin bünyesinde çalışan kişilerin sayılarına, iştirak ve ticari işletmelerindeki çalışan sayılarına, vakıf müesseselerine ait vakıf üniversitelerinde çalışan akademik ve personel sayılarına ulaşılmıştır. Neticede vakıf müesseselerinin istihdama doğrudan ve dolaylı olarak katkısı olduğu ortaya konulmuştur. Çalışmanın son bölümünde ise yeni bir yaklaşımla, vakıf müesseselerinin istihdama doğrudan ve dolaylı katkılarının nasıl arttırılabileceği konusuna yer verilmiş, bu amaçla uygulanabilecek yöntemler üzerinde durulmuştur. Vakıf müesseselerinin işlevleri baz alınarak istihdamı arttırmaya yönelik uygulanabilecek yöntemler hususunda önerilerde bulunulmuştur."
