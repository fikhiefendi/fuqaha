abstract: "Bu çalışma müceddid, usûlcü ve çağdaş bir fakîh olan Muhammed Sa'îd Ramazan el-Bûtî'nin fıkhî metodunu ve görüşlerini örneklerle incelemeyi esas almaktadır. Onun kitapları ve araştırmaları, fıkıh ve fıkıh usûlü alanında son derece önemli meseleleri içermektedir. el-Bûtî, usûlî ve fıkhî meselelerdeki görüşlerini ortaya koyarken ilmî bir yöntem takip etmektedir. Onun eserlerinde zikrettiği furû' ve usûl meselelerini inceleyerek fıkhî görüşlerini ve metodunu tümevarım yoluyla ele aldık. Onun bir hükme ulaşırken takip ettiği merhaleleri ve bu merhalelerin en önemli niteliklerini açıkladık. Çalışmamız mukaddime, giriş üç bölüm ve sonuçtan oluşmaktadır. Mukaddime kısmında araştırmanın konusu, önemi, amacı ve problematiği ele alınmaktadır. Keza bu kısımda konuyla ilgili yapılan çalışmalara temas edilmekte ve araştırmanın bu çalışmalardan farklı yönlerine değinilmektedir. Bunun dışında araştırmanın kaynakları ve yöntemi ele alınmaktadır. Giriş bölümünde el-Bûtî'nin doğumu, yetişmesi, ilmî ve sosyal hayatı, siyasetle ilişkisi, davet yöntemi, ahlakı, zühdü, âlimlerin onun hakkındaki görüşleri ve vefatına değinilmektedir. Ayrıca yöntem (metot) kavramı ve, içeriğiyle birlikte önemine değinilmektedir. Bir ilim ne kadar önemli ise, o ilmin metodu da bir o kadar önemlidir. Araştırmacının meseleleri nasıl çözdüğünü takip ettiği metotla gerçekleşmektedir. İlmî bir araştırma takip edilen metotla ilintilidir. Bu sebeple ilmî bir araştırmanın başarısı veya başarısızlığı araştırmacının takip ettiği metotla ortaya çıkmaktadır."
