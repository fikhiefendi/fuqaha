abstract: "Korsanların tehdit ettiği deniz ticareti ve eşkıyanın tehdidi altındaki kervan ticaretinin güvence altına alınması çabaları, 14. yüzyılda, Avrupa'da modern sigortacılığın doğmasına neden olmuştur.Avrupa'da sigortacılığın başlangıcı 14. yüzyıla kadar uzandığı halde, Osmanlı Devleti'nde 19. yüzyıl gibi hayli geç bir döneme rastlaması, iktisadi zihniyet ve dini uygulamalar ile sigorta benzeri bazı müesseselerin varlığına bağlanabilir.Nitekim, sermaye birikiminin gerçekleştirilememesi, özellikle zirai üretimde iaşe modelinin, üretimin ticarileşmesine tercih edilmesi ve genel olarak halkın ileride gerçekleşmesi şüpheli bir riske, ?Allah korur? anlayışı ile kaynak ayırmaması iktisadi zihniyetin yansımalarıdır.Diğer taraftan, İslam dininin haram/helal anlayışının sigortacılığa uygulanmasında, bilim adamlarının içine düştüğü kararsız ve çelişkili tutum, kaynağını tasavvuf anlayışından alan tevekkül anlayışı, Osmanlı toplumunda var olan avarız vakıfları ve zekât müessesesinin sağladığı sosyal dayanışma da aynı oranda etkili olmuştur.Bir taraftan sigorta müessesesinin din adamları tarafından şüpheyle karşılanması, hatta haram olarak değerlendirilmesi ve tasavvuf çevrelerindeki tevekkül anlayışı, diğer taraftan toplumun kabul ettiği zekât müessesesi ve avarız vakıflarının varlığını sürdürmesi, bu müesseselere alternatif olarak piyasaya girmek isteyen kâr amaçlı bir yapının taban bulamamasına neden olmuştur.Bu itibarla, Osmanlı'da sigortacılığın gelişmemesini açıklamakta, meseleyi sadece sermaye birikimi zaviyesinden ele alan görüş yetersiz kalmaktadır. Belki de sigortaya mesafeli durmayı, bundan daha önemli sebeplere; Avrupa ile Osmanlı toplumları arasındaki zihniyet farklılığına, toplumdaki tevekkül anlayışına, sigorta benzeri sosyal güvenlik kurumları olan avarız vakıfları ile zekât müessesesinin, sigortaya duyulan ihtiyacı azaltmasına bağlamak mümkündür."
