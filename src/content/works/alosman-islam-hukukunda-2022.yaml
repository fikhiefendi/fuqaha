abstract: "Araştırmada yüzyıllardır güncelliğini koruyan bir mesele olan“Devlet Başkanına Karşı Ayaklanma”meselesi; İslam hukukunun temel ilkeleri bağlamında incelenecektir. Araştırmanın giriş bölümünde araştırmanın konusu, önemi, amacı, sınırlılıkları ve yöntemine ilişkin bilgiler yer almaktadır. Birinci bölümde devlet başkanının hak ve sorumlulukları ve İslam'da yönetim teorisi ele alışmıştır. İkinci bölümde, zalim devlet başkanına karşı halkın sorumlulukları başlığı altında, zalim devlet başkanlarına karşı nasıl hareket edilmesi gerektiğiyle ilgili âlimlerin görüşleri değerlendirilmiş olup sivil gösterilerin hükmüne dair bilgiler verilmiştir. Üçüncü bölümde ise devlet başkanına karşı ayaklanma konusu İslam hukuku bağlamında ele alınmıştır. İslam Târihi'nde görülen en önemli ayaklanma örnekleri ve âlimlerin bunlara dâir görüşleri ışığında günümüzün önemli ayaklanmalarından birine dönüşmüş olan Suriye örneği özelinde devlet başkanına karşı ayaklanmanın dini hükmü üzerinde durulmuştur."
