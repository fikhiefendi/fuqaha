abstract: "ً حققت الشريعة الكثري من املصاحل للمسلمني من خالل أحكامها املضمونة يف الكتب الفقهية، واعتمدت املصلحة العامةكدليل معترب شرعا لألمور اليت مل ينص الشرع على اعتبارها أو إلغاها ولكن بضوابط حمددة لإلقرار بشرعية تلك املصلحة من وجهة نظر الشريعة، وهنا يربز قدرة الشريعة اإلسالمية على مواكبة العصر ومسايرة مصاحل الناس. وبسبب اتساع ابب املصلحة، فقد أدى إىل التساهل يف بناء األحكام الشرعية عليها خاصة يف عصران احلاضر ال سيما يف ابب املعامالت املصرفية والبنكية. يسعى هذا البحث اىل تقييم مدى اإلنضباط وااللتزام بضوابط املصلحة من قبل أعلى مؤسسيت الفتوى للمؤسسات املالية االسالمية يف ماليزاي ومها اهليئة االستشارية الشرعية التابعة للبنك املركزي املاليزي ه الورقة يف تركيزها على تناول وحتليل القرارات املبنية على املصلحة حتليالً واهليئة اإلستشارية الشرعية التابعة هليئة األوراق املالية. تكمن أمهية هذ ًعلىكتب أصول الفقه. ًومستندا عميقا و قد اعتمد هذا البحث املنهج النوعي املرتكز على حتليل املصادر والواثئق، فبدأت ابستخراج ضوابط ً املصلحة من كتب أصول الفقه ومن مث حتليل القرارات املعتمد ة على املصلحة والصادرة من اهليئتني املذكورتني سابقا. وقد هدف البحث يف حتديد نتيجة كل قرار على حدا، سواء ابملطابقة الكلية أم اجلزئية بضوابط املصلحة املستخرجة. وقد وصل البحث إىل أن اهليئة االستشارية الشرعية التابعة للبنك املركزي املاليزي واهليئة االستشارية الشرعية التابعة هليئة األوراق املالية قد التزمتا بضوابط املصلحة يف قراراهتم املبنية على املصلحة العامة. وقد اقرتحت الورقة أبن تقوم اهليئة االستشارية الشرعية التابعة للبنك املركزي املاليزي واهليئة االستشارية الشرعية التابعة هليئة األوراق املالية بتجهيز وتوظيف أشخاص ممن ميلكون الكفاءة العلمية والعملية للقيام ابملزيد من االهتمام والبحث والتعمق يف الضوابط والقواعد املذكورة يف الكتب الفقهية واألصولية ومدى مطابقة القرارات الصادرة معها."
