abstract: "Hukuk, toplumda barış ve refahın sağlanması için kurulmuş olan sistemlerden biridir. Tezimizde inceleme konusu yapacağımız Bangladeş dünya haritasında küçük bir ülke olmasına rağmen, 160 milyon nüfusunun % 90.4'ü Müslüman ülkedir. Bangladeş'in medeni hukuk kanunlarında Müslüman halklara yönelik kanunlar uygulanmaya devam etmektedir. Bu çalışmamız Bangladeş'te yürürlükte olan medenin hukukun tarihsel gelişimi ve İslam hukukuna göre değerlendirilmesi için hazırlanmıştır. Bu çalışmada, Bangladeş'in siyasi ve coğrafi yapısı, dini nüfusu ve İslamlaşması hakkında genel bilgiler verildikten sonra Bangladeş'teki hukuk sisteminin tarihsel gelişimi dönemler halinde incelenmiş ve Bangladeş'teki medeni hukuk sistemi İslam hukuku açısından değerlendirilmiştir."
