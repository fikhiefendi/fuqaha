abstract: "Ehl-i hadîs, İslâm düşünce tarihinin en önemli ekollerinden biri olup yöntem ve sistemimin merkezine nakli yerleştirerek bu eksenden dışarıya çıkmamaya çalışmıştır. Fakat bu metot birliğine rağmen bünyesinden çeşitli eğilimlerin neşet etmesine engel olunamamıştır. Kaynakların incelenmesi, verilerin toplanması ve sentezlenmesi yöntemi ile çalışılan bu tez, ehl-i hadîs ekolüne nispet edebileceğimiz çeşitli eğilimleri ve yöntemlerini kıyaslamayı hedeflemektedir. Çalışma, ehl-i hadîs ekolünün temel görüşlerini açıkladıktan sonra bu akımın içine hangi eğilimlerin dahil olabileceği tartışmasına cevap aramaktadır. Akabinde ise ehl-i hadîs şemsiyesi altında toplayabileceğimiz bu eğilimlerin, hicri üçüncü yüzyıldaki usûl ve yöntem açısından ihtilaflarını ortaya koymaktadır. Zira her bir eğilimin varlığı diğer eğilimlerden sistem bakımından ayrıştığını göstermektedir. Ehl-i hadîs ekolü içerisindeki tartışmalar her ne kadar fıkıh alanında daha yaygın olsa da bazen itikâdî konularda da görülmektedir. Buna binaen çalışmada fıkhî, itikâdî, siyâsî hatta şahsî ihtilaf ve tenkitler incelenmiştir. Bu doğrultuda ilk önce teorik ihtilaflar ele alınmış daha sonra da bunların pratik yansımaları tetkik edilmiştir. Böylelikle ehl-i hadîsin geçirdiği dönüşüm ve gelişim aşamaları saptanmıştır. Neticesinde de hadislere yaklaşımlarının yanı sıra diğer usûl kurallarındaki ihtilafların da bu eğilimlerin, ehl-i hadîs ekolüne bağlı birer mezhep olarak ayrışmasına etki ettiği tespit edilmiştir."
