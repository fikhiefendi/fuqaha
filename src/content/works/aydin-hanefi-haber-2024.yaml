abstract: "Meşhur haber, aslı itibariyle haber-i vâhid olmakla birlikte ulema tarafından normatif kaynaklık değeri taşıdığı yaygın şekilde benimsenerek (telakki bi'l-kabul) ikinci ve sonraki nesillerde mütevâtir derecesine ulaşan haberdir. Meşhur haberle umum ifadelerin tahsisi, nassa ziyade ve nesih yapılabildiği için Hanefi haber teorisinde önemli bir konumda bulunmaktadır. Tespit edebildiğimiz kadarıyla meşhur haberin tekabül ettiği mefhumdan bahseden ilk usul alimi Îsâ b. Ebân'dır. Îsâ b. Ebân“Yedıllu Târikuhû”ve“Yuhşâ aleyhi'l-ism”adını verdiği iki farklı kategoriyi“Yecûzu fîhi's-sıdku ve'l-kizbü”kategorisinin altında değerlendirirken Cessâs, bu iki kategoriyi mütevâtirin ikinci kısmı olarak değerlendirmektedir. Debûsî, kendisinden önce tüm haberlerin tek bir çatı altında yekpare şekilde bulunan haber teorisini“Bilgi İfade Etmesi Bakımından Haberler”ve“Hüküm İfade Etmesi Bakımından Haberler”olmak üzere iki kısma ayırmıştır. Ayrıca Debûsî, incelediğimiz alimler arasında her ne kadar günümüzdeki anlamıyla olmasa da“meşhur haber”ifadesini bir haber kategorisine tekabül edecek şekilde kullanan ve iki farklı kısım halinde bulunan haber kategorilerini“müşteher haber”adıyla tek bir kategori olarak vazeden ilk usul alimidir. Pezdevî ve Serahsî, Debûsî'nin meşhur ifadesini anlam daralmasına uğratarak“Müşteher”yerine kullanmakta ve meşhur haberi günümüzdeki anlamıyla tanımlamaktadır. Debûsî, Pezdevî ve Serahsî meşhur haberin ifade ettiği bilgi değerinin tuma'nîne olduğunu söylerken Îsâ b. Ebân ve Cessâs“Yedıllu Târikuhû”kategorisinin istidlâlî kat'ilik ifade ettiğini söylemektedir. Tespit edebildiğimiz kadarıyla yaygın şekilde kullanılan üçlü taksim (mütevâtir, meşhur, âhâd) ilk defa Semerkandî tarafından kullanılmaktadır."
