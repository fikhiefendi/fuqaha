abstract: "Hanefî mezhebinin hadis rivayetlerine yaklaşımıyla ehl-i hadîs ekolünün yaklaşımı büyük farklılıklar içermektedir. Hanefîlerin hadis rivayetlerini kabul hususundaki hassasiyetleri furû-ı fıkıh hükümlerine doğrudan etki etmiştir. Hz. Peygamber'den rivayet edilen hadislerden hangileriyle amel edileceği, rivayetlerin ne şartlarla kabul edileceği, hadis rivayetleri ile Kur'ân ayetlerinin birbirleriyle ilişkisi gibi konularda ihtilaflar meydana geldiği gibi rivayetlerin nasıl anlaşılması gerektiği, Hz. Peygamber'in neyi kastettiği gibi mana yönüyle de mezhepler arası ihtilafların olduğu görülmektedir. Bu çalışmada el-Hidâye eserinin aile hukuku ile alakalı hadisleri incelenmiş, mezheplerin bu hadislere yaklaşımına dair bir inceleme ortaya konulmaya çalışılmıştır. Bu sayede furûʿ hükümler açısından bir araştırma yapılmış olmakla birlikte, hadislerin usûl açısından tahlili yapılmaya çalışılmıştır. Ayrıca usûl-furûʿ tutarlılığı, müctehitlerin fıkıh faaliyetlerinin fikrî arka planı ve mezheplerin hadis rivayetlerine yaklaşımları başta olmak üzere usûle dair bazı görüşleri de ortaya konulmaya çalışılmıştır. Bu bağlamda çalışmanın konusu yalnızca mezheplerin hadis usûl ve metodolojisi değildir. Fıkhî anlamda farklı açılardan incelemeler yapılmıştır. Araştırmaya konu olan hadis rivayetleri iki bölümde ele alınmıştır. İlk bölümde nikâh, ikinci bölümde ise talâk ile ilgili hadisler hakkında araştırmalar yapılmıştır. Hadis rivayetlerinin tahrîci yapıldıktan sonra sırasıyla furûʿ ve usûl incelemeleri ortaya konulmaya çalışılmıştır."
