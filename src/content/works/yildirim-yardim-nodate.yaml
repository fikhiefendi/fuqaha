abstract: "Zekât ibadeti, bireysel olarak eda edilmesinin yanı sıra günümüzde gitgide kurumsal bir boyut kazanmaya başlamıştır. Bu kurumsallaşma çoğunlukla devlet eksenli biçimde gelişmiş olsa da Türkiye gibi bazı ülkelerde kurumsallaşma, hayır kurumları üzerinden icra edilen bir uygulamayı ortayı çıkarmıştır. Günümüzde pek çok mükellef, farklı sebeplerle zekâtlarını bu kurumlar üzerinden ulaştırmayı tercih etmektedir. Ancak bu tercih, zekâtın geçerliliğine dair bazı dinî kaygıları da gündeme getirmektedir. Akademik literatürde devlet merkezli zekât uygulamalarının geniş biçimde incelenmesine karşın sivil kurumların zekât faaliyetleri yeterince ele alınmamıştır. Mevcut az sayıdaki çalışmanın ise genellikle tek bir kurumu konu aldığı veya münhasıran bir konu çerçevesinde meseleyi değerlendirdiği ya da alan araştırması olmadan yalnızca meseleyi teorik olarak tartıştığı görülmektedir. Bu çalışma, hayır kurumlarının zekâtı mükelleften teslim almasından muhtaç kimselere ulaştırıncaya kadar geçen sürecin bütününü ayrıntılı biçimde ortaya koymayı ve bu süreçleri fıkhî açıdan değerlendirmeyi hedeflemektedir. Araştırmada, ülke çapında faaliyet gösteren, güven kazanmış ve zekât konusunda hassasiyet beyan eden kurumlarla yarı yapılandırılmış mülakatlar yapılmış; veriler tematik kodlama ve nitel içerik analizi yöntemiyle çözümlenmiştir. Bulgular, hayır kurumlarının zekât faaliyetlerinin“toplama, muhafaza ve dağıtım”olmak üzere üç temel aşamadan oluştuğunu göstermektedir. Kurumların, kendilerini genellikle zekât memuru (âmil) ya da mükellefin vekili olarak konumlandırdığı; bazı kurumların muhafaza aşamasında zekât fonlarını nemalandırdığı, dağıtım aşamasında ise temlik şartına riayet ederek zekâtı hak sahiplerine ulaştırdığı tespit edilmiştir. Sonuç olarak incelenen kurumların büyük çoğunluğu, zekâtın toplanması, muhafazası ve dağıtımını İslâm hukukunun ilkelerine uygun şekilde yürütmekte ve bu süreci hassas bir şekilde icra ettiklerini göstermektedir. Çalışma, modern dönemde zekâtın sivil kurumsal mekanizmalar üzerinden uygulanabileceğini, ancak bunun titizlikle gözetilmesi gereken bir fıkhî denge gerektirdiğini ortaya koymaktadır."
