abstract: "Şâfiî mezhebi Sünni gelenek içerisinde oluşmuş ve zamanla İslam coğrafyasının farklı bölgelerine yayılmıştır. Bu mezhebin kurucusu olarak zikredilen Muhammed b. İdris eş-Şâfiî İslam düşünce tarihinin en önemli şahsiyetlerinden biri olmuştur. İmam Şâfiî, İmam Mâlik'in yanında kalarak ondan ilim tahsil etmiş ve onun görüşlerinden etkilenmiştir. Daha sonra Bağdat'ta bulunduğu zaman zarfında Ehl-i Rey fıkhının temsilcilerinden Muhammed b. Hasan eş-Şeybani'den (ö. 189/805) ilim tahsil etme imkânına kavuşmuştur. İmam Şâfiî birçok eser telif etmiştir. Bu eserlerden biri olan el-Ümm en hacimli eserlerindendir. Aynı zamanda imam Şâfiî bir hadisçi olup ona nispet edilen el-Müsned adlı hadis kitabının sahibidir. Kütüb-i Sitte sahih hadislerin büyük bir kısmını ihtiva eden altı hadis kitabının adıdır. Ehl-i Sünnet âlimleri tarafından Kur'an-ı Kerim'den sonra en önemli kaynak olarak görülmüştür. Birinci bölümde İmam Şafiî'nin hayatı ve yaşadığı dönem ile ilgili bilgiler verilmiştir. Ayrıca İmam Şâfiî'nin Cuma namazının vücûb ve sıhhat şartları ile ilgili amel ettiği rivayetler ve görüşleri verilmiştir. İkinci bölümde Kütüb-i Sitte müelliflerinin Cuma namazının vücûb ve sıhhat şartları ile ilgili rivayetlere yer verilmiş ve konuyla ilgili değerlendirmeler yapılmıştır. Ayrıca İmam Şâfiî'nin amel ettiği rivayetler ile Kütüb-i Sitte müelliflerinin rivayet ettikleri hadislerin karşılaştırılması yapılmıştır. Bu şekilde aralarındaki rivayet farklılıkları ortaya konmuştur."
