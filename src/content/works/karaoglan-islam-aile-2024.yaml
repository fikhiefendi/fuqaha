abstract: "Bu çalışma İslam aile hukukunda kocanın nafaka yükümlülüğünü ve günümüz medeni hukukunda nafaka uygulamasını incelemektedir. Bu bağlamda nafaka kavram olarak ele alınmış, boşanma sonrası nafaka daha net anlaşılması için İslam hukukunda nafakanın şartları ve İddet kavramı; Medeni hukukta tedbir, iştirak ve yoksulluk nafakası kavramları çalışmaya konu olmuştur. Evlilik nafakası detaylı olarak incelenmiş, kocanın nafaka yükümlülüğünün şartları, evlilik nafakasını düşüren haller, boşanma sonrası iddet nafakası ve çeşitleri üzerinde durulmuştur. Özellikle sıkça tartışmalara konu olan günümüz nafaka uygulamasındaki 'süresiz nafaka' meselesindeki pürüzler ve boşanan bireylerin mağduriyetleri ortaya konmaya çalışılmış, bu konuya İslam hukukundaki nafaka uygulaması ışığında çözüm önerileri getirilmeye çalışılmıştır."
