abstract: "Kur'ân üzerindeki çalışmalar asla durgun değildir. Türkiye ve Endonezya Diyanet İşleri Başkanlıkları tarafından derlenip yayınlanan Kur'ân Yolu ve Al-Quran dan Tafsirnya adlı tefsir eserleri son zamanlarda ortaya çıkan çağdaş tefsirlerin güzel örnekleri olarak sayılabilir. Türkiye'deki müslüman nüfusun çoğunluğu Sünni Hanefi mezhebine bağlı ve Endonezya'daki müslüman nüfusun çoğunluğu Sünni Şafii mezhebine bağlıdır. Bu nedenle, bu araştırmanın temel konusu, ahkâm ayetleri çerçevesinde Türkiye ve Endonezya Diyanet İşleri Başkanlıklarının yayınladıkları tefsirlerinin karşılaştırılmasının önemini ortaya koymaktadır. Bu araştırma çok önemlidir çünkü, ikisi arasındaki farkları tanımayı amaçlar, böylece gruplar arasında karşılıklı bir anlayış olur ve kişisel ya da grup görüşlerinin en doğru olduğu konusunda karşılıklı bir gerekçe yoktur. Çalışmamızı sınırlandırmak amacıyla genel olarak Kur'ân-ı Kerim'de var olan ahkâm konularından bahsedeceğiz. Abdul Vahhap Hallaf'ın metodunda olduğu gibi Kur'ân'ın iki ana ahkam konusu olan ibadet ve muamelat hükümlerini içeren ayetleri ele alarak, Kur'ân Yolu ve Al-Quran dan Tafsirnya tefsirlerinin karşılaştırmasını yaptık. Ve sonuç olarak her iki tefsirde, Şafi'i ve Hanefi mezhepleri arasındaki farklılıklar, hem ibadet ayetlerinde hem de muamelat ayetlerinde yorumun içeriğini etkilemektedir. Fakat, hem Kur'ân Yolu tefsirinde hem de Al-Quran dan Tafsirnya tefsirinde ayetler yorumlanırken belli bir mezhebe eğilim gösterilmemiştir."
