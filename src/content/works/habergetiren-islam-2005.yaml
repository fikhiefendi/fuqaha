abstract: "ÖZETslam Ekonomisi, halkın sosyal refahını arttırmayı amaçlayan, dağıtım temelli,piyasanın kendi şartlarında oluştuğu bir sistemdir. Sistem içersinde yeniden dağıtımısağlayan bir kurumu (merkezi) barındırdığı için bu sisteme ? slami Yeniden DağıtımEkonomisi? denir. Bu kurum ?Beytu'l-Mal? diye isimlendirilir.slam Hukuku'na göre sermaye, ticari veya yatırım amaçlı para yada parayadönüştürülmesi mümkün olan mal olarak kabul edilmektedir.slam Hukuku'nda sermaye bir üretim faktörüdür, sonradan üretilmiştir,bizatihi üretken değildir.Sermaye birikiminde temel unsur emektir. Sermaye stoku (birikimi) tasarruflaoluşur, yatırım ile gelişir.slam Hukuku'nda sermaye gelirlerinden kar ve kira kabul edilmiş, faiz iseyasaklanmıştır. Kar için belli bir sınır konmamıştır. Sermayenin giderlerindensimsarlık ve komisyonculuk hoş görülmemiş, ikramiye ve tazminatlar kabul edilmiştir.slam Hukuku'na göre sermaye birleşmeleri aracılığıylaşirketlergerçekleştirilir. En çok uygulanan şirketler Muşaraka ve Mudarebe'dir. Ortaklargerçek kişiler olabileceği gibi beytu'l-mal de olabilir.slam Hukuku'nda sermayenin büyümesine ve sahibinin elinde bir güç halinegelmesine izin verilmez. Getirilen dağıtım tedbirleriyle topluma tekrar dağıtılır.slam Hukuku'nda dış ticaret kabul edilir. Gümrük vergisi konusunda slamülkeleri arası ticarette zekât dışında bir kesinti, vergi alınmamakta, yabancı ülkelerleyapılan ticarette ise mütekabiliyet esası gereği bir kesinti uygulanmaktadırKüreselleşme dediğimiz sermayenin serbest dolaşımını esas alan biruygulamaya ise devletin güvenliği ve Müslüman toplum yapısını zedelemeyecekoranda izin verilir"
