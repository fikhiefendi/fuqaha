abstract: "Bu tez, İslami toplu sosyal finansman platformlarının ekonomik güçlenmeyi sağlamadaki rolünü tartışmayı amaçlamaktadır. Bu amaçla, bu platformların türleri, isleyiş mekanizmaları ve kullanım kolaylıkları analiz edilmiştir. Ayrıca, bu platformların dünya çapında geniş bir fon sağlayıcı kitlesine ulaşma kapasitesi, yayılma potansiyeli ve İslami finansman modelleri aracılığıyla fon arayan kişilere ekonomik olarak güç kazandırma yeteneği incelenmiştir. Araştırmacı, kitaplar, referanslar, önceki çalışmalar ve çevrimiçi kaynaklardan birincil verileri toplamak ve analiz etmek için hem betimleyici-analitik hem de tümevarım yöntemlerini kullanmıştır. Çalışmanın sonucunda, bu platformların modern teknolojilere dayalı ve kolektif İslami kitlesel fonlama araçlarından biri olduğu sonucuna varilmiştir. Bu platformlar, finansal hizmetlere erişimi kolaylaştırır ve kâr amacı güden ve gütmeyen projeler için bir yatırım platformu görevi görür. Teorik olarak İslami Şeriat ilkelerine uygun olmalarına rağmen, pratikte tam uyumlarının sağlanması zor olmaya devam etmektedir. Bu platformlar, bireylerin ve kurumların islerini verimli bir şekilde yürütmek, kendi kendine yeterliliklerini sağlamak ve ekonomik kalkınma ile sosyal refaha katkıda bulunmak için finansman elde etmelerine yardımcı olarak ekonomik güçlenmede aktif bir rol oynamaktadır."
