abstract: "Kara, Ömer, Kur'ân'ın Anlaşılmasında 'İtibâr. Sebebin Hususîliğine Değil. Lafzın Umûmîliğinedir' İlkesine Usûlcülcrin Metodolojik Yaklaşımları. Doktora Tezi, Danışman: Prof. Dr. Mehmet Paçacı, XXVIII-298 sayfa.“el-ibre bi umûmî' 1-lafz lâ bi husûsî' s-sebeb”ilkesi, bir sebebe mebnî olarak inen umûmî nasların yorumlarında kendisine başvurulan bir prensiptir. Bu prensibin metodolojik boyutları, usûl literatüründe 'soyut' ve 'somut' olarak derince tartışılmaktadır. Kaidenin anlaşılmasında vazgeçilmez unsurlardan biri; kavramsal alanının ve terminolojik boyutunun ortaya konmasıdır. Bu bağlamda 'lafzın umumîliği' kısmında 'hitap; nass, nazm, lafız, kelâm ve cevâp' kavramları temel olarak; 'müstakil' ve 'gayr-i müstakil' alt kavram olarak; 'husûsu's-sebeb' kısmında ise 'sebeb-i vücûb', 'sebeb-i nüzûl/vâkı'a', 'soru' kavramları temel olarak; 'umûm, müsâvî, husus' kavramları da alt kavram olarak önemli bir işlev görmektedir. Biraz daha netleştirecek olursak,“sebeb-i vücûb”kavramı 'nass' ile; 'sebeb-i nüzûl/vâkı'a' kavramı, 'hitap' ile; 'soru' ise 'cevâp' ile eşleşmektedir. İlgili ilke, usûlde 'asi, zabıt, kâide-i külliye, kâide-i fıkhıyye, kâide-i âmme veya hasse' değil, bir“kâide-i usûl”olarak isimlendirilmektedir. Tarihsel süreç içerisinde kaide, usûl literatüründe“bir sebebe mebnî inen âmm”adıyla tartışılmış; usûlcülerin çoğunluğu 'lafzın umumîliğini' savunurken, Şâfı'î ve bir kısım alimlere 'sebebin hususîliği' nisbet edilmiştir. Kaide, konu itibariyle tamamen âmm lafzın tahsîsi meselesine odaklanmakta; âmmın bir problemi olarak tartışılmaktadır. İlaveten kaideyle ilgili olarak konu, değişik tasniflere sahip olup, bu tasnif konunu işlemesine de yansımaktadır. Konunun problematiği, sebeb-i nüzul olsun, sebeb-i vücûb olsun, soru olsun, 'husûsî sebeb'e binaen varid olan âmm nass, 'lafzın umûmluğu'na mı itibâr edilecek, yoksa 'sebebin husûsîliği'ne mi itibâr edileceğidir. Bir sebeb mebnî inen âmm konusu,“sebeb-i vücûb-nass”,“sebeb-i nüzûl-hitâp”ve 'soru-cevâp' olarak çeşitlere ayrılmaktadır.“Sebeb-i vücûb-nass”çeşidi, tamamen nasta nakledilen sebeb ile hitabın 'ta'lîl' ilişkisini anlatmaktadır.“Soru-cevâp”çeşidi, 'müstakil' ve 'gayr-i müstakil şeklinde iki çeşit olup birincisi, sorunun umûm ve husus olmasına; ikincisi ise umûm, husus ve dengi olmasına bağlı olarak tasnif edilmektedir.“Sebeb-i nüzûl- hitâb”, müstakil olarak ele alındığı gibi“soru-cevâp”kısmının“özel sebeb, umûmî hitâb”kısmıyla da ele alınmaktadır. Kaidenin anlaşılması konusunda temel iki görüş bulunmaktadır. Bunlardan birincisi, sebebin hususîliği; ikincisi ise lafzın umumîliğidir. Her iki tarafın kendi görüşlerini destekledikleri argümanları bulunmaktadır. Sonuçta \"lafzın umûmîliği'ni savunan tarafın argümanları tutarlı ve yeterli olduğu görülmektedir."
