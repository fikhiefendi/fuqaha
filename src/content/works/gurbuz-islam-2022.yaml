abstract: "Bu çalışmada hayır kuruluşlarının gelirleri ve tasarruf ilkeleri teberru akitleri bağlamında ele alınmıştır. Hayır kuruluşları aynı zamanda sivil toplum kuruluşları olarak da adlandırılıp vakıflar ve dernekler olmak üzere iki kısma ayrılmaktadır. Vakıflar mal tahsisini ifade ederken dernekler de belirli bir amaç etrafında yapılanan ve tüzel kişiliğe sahip kişi topluluklarını ifade etmektedir. Bu çalışmanın amacı fıkhu't-teberruat bağlamında hayır kuruluşlarının gelirlerini tespit etmektir. Fıkıh ve fetva literatüründen hareketle hayır kuruluşlarına yapılan teberruların sadaka hükmünde sayıldığı ve kabz sonrası teberrudan dönme imkânının kalmadığı görülmektedir. Vakıflar mütevelliler tarafından dernekler ise yönetim kurulu tarafından yönetilmektedir. Vakıfları yönetmede velâyet ve vekâlet hükümleri geçerli olurken derneklerde ise vekâlet hükümleri geçerli olmaktadır. Bu bağlamda dernek yönetim kurulu fıkhi ve kanuni açıdan vekil statüsünde kabul edilmektedir. Hayır kuruluşlarına yapılan teberrular ise şartlı ve şartsız olmak üzere iki kısma ayrılmaktadır. Vakıfların ve derneklerin yöneticilerinin şartlı bağışlarda şartlara riayetsizlikleri fıkhi açıdan tazmin sebebi sayılmaktadır. Vakıfların ya da derneklerin teberrular üzerindeki tasarrufları fıkhi olarak emanet ilkelerine göre şekillenmektedir. İslam hukukunda yed-i milke ya da yedi tazmine konu olmayan mallarda yed-i emanet ilkeleri geçerli olmaktadır. Yöneticilerin bu tür mallarda te'addî, taksir ya da ihanet sayılacak tasarrufları tazminle veya azille sonuçlanmaktadır. Fıkhi açıdan teberruların harcama yerleri kuruluşun zaruri giderleri olması; tezyîn, nakş ya da israf sayılacak bir harcama olmaması gerekmektedir. \"Ra'iyye üzerinde tasarruf maslahata menûṭṭur\" fıkhi kuralı velâyete ve vekâlete dayalı harcamaların sınırı belirleyen külli bir kaidedir. Bu bağlamda Hayır kuruluşlarına yapılan bağışlar fıkhen sadaka sayıldığından harcama alanlarının da Hanefiler açısından kurbet, maslahat ve kadr-i maruf ölçüsüne uymasının zorunlu olduğu görülmektedir."
