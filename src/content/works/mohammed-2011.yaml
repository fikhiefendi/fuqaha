abstract: "Mali işlemlerin soyut haklar içerisindeki yaygınlığı nedeniyle bu çalışma, konuyu İslam Fıkhı perspektifinden pozitif hukuk ile karşılaştırarak ve çağdaş uygulama örnekleriyle kanıtlayarak ele almayı amaçlamaktadır. Bu çalışma, soyut hakların tanımını, soyut hakların türlerini, niteliklerini içeren İslam hukuku ile pozitif hukuk arasındaki soyut hakların“el-Ea'tiad”(Tazmin) kavramının- yani mübadele veya yerine geçme- bir örneği ile başlamaktadır. Soyut haklar ve ayırt edici soyut hakları karıştırılabilecek şeylerden. Çalışma daha sonra fıkıh ekollerinin soyut hakları ea'tiad (Tazmin) yapma konusundaki delillerini gözden geçirmeye devam eder, bunları tartışır ve birkaç koşulda yapmanın imkanlarını seçer. Bu koşulları yerine getirdikten sonra, çalışma, bunları soyut hakların Ea'tiad'ının uygulanmasına ilişkin çağdaş durumlara uygulamaya geçer. On bir uygulama içerir: 1. Bayilik sözleşmeleri (Franchise.) 2. Opsiyon sözleşmeleri (Opsiyon sözleşmeleri). 3. Ticari lisans hakkının Ea'tiad'ını uygulamak (lisans). 4. Menkul kıymetler borsasında aidat,“kimlik ve uyrukluk belgelerinin satışı”ve“rüçhan hakkı”haklarının kullanılması. 5. Gümrük muafiyetleri hakkının Ea'tiad'ını uygulamak. 6. Özel numaraların satışı. 7. Arz kartlarının satışı. 8. Öncelik hakkı- öncelikler - gerçek elde etmede emlak kredisi. 9. Borçlunun ea'tiad hakkının vadesi- Bitiş tarihi. 10. Petrol ve madencilik sektörlerinde Bayilik hakkının Ea'tiad'ını uygulamak. 11. Oy ve adaylık hakkının Ea'tiad'ını uygulamak."
