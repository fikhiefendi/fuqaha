abstract: "Günümüzde, modern yaşam tarzlarının ve artan sağlık bilincinin etkisiyle gıda takviyeleri, özellikle protein tozları, dünya genelinde yaygın bir tüketim alanı bulmuştur. Bu ürünler, kas gelişimi, beslenme eksikliklerini giderme, kilo yönetimi ve yaşa bağlı fizyolojik ihtiyaçları karşılama gibi çeşitli amaçlarla kullanılmaktadır. Müslüman tüketiciler için bu ürünlerin“helallik”statüsü hakkında önemli dini ve fıkhi soruları gündeme getirmektedir. Zira gıda takviyelerinin hammaddeleri, üretim süreçleri ve içerdiği katkı maddeleri, İslami prensipler açısından detaylı bir incelemeyi zorunlu kılmaktadır. Bu tez çalışması, protein tozları ve diğer gıda desteği ürünlerinin helallik açısından fıkhi bir değerlendirmesini yapmayı amaçlamaktadır. Bu amaç doğrultusunda, ürünlerin hammaddelerin tedarikinden başlayarak üretim, ambalajlama ve tüketime kadar olan tüm süreçleri incelenmiştir. Araştırma, nitel bir veri analizi olarak doküman incelemesi yöntemini benimsemiştir. Araştırma, gıda takviyelerinde kullanılan hayvansal, bitkisel ve sentetik hammaddelerin kaynaklarına odaklanmıştır. Bu hammaddelerin elde ediliş yöntemleri, üretim süreçlerindeki kritik helallik sorunları detaylıca incelenmiştir. İslam hukukunun helal ve haram, temel kavramları, gıda takviyelerinin bileşenleri ve üretim süreçleri bağlamında ayrıntılı bir fıkhi analizle değerlendirilmiştir. Ayrıca, istihale (dönüşüm) ve istihlak (yoğaltım) prensipleri ilişkisi bağlamında değerlendirilmiştir. Tez, Müslüman tüketicilere gıda takviyeleri konusunda daha bilinçli seçimler yapmaları için, üreticilere helal üretim süreçlerini benimseme ve tedarik zinciri şeffaflığını artırma konusunda yol göstermeyi ve helal gıda endüstrisinde gıda takviyeleri alanındaki fıkhi standartların gelişimine katkıda bulunmayı hedeflemektedir."
