abstract: "İbadetler ve hukuki olaylarda önemli role sahip olan şart, fıkıh usûlünde ele alınan kavramlardan biridir. Tezde öncelikle vazʿî hüküm kapsamında değerlendirilen şart kavramının fıkıh usûlünün teşekkül sürecinde hüküm kapsamı altında ele alınması değerlendirilmiş, sonrasında ise kavramın tanımı ve işlevi üzerinde tespit ve tahliller yapılmıştır. Şartın işlevi ile ilgili farklı yaklaşımların doğurduğu sonuçlar ele alınmış ve bu yaklaşımların değerlendirilmesi ve hukuki olaylar üzerindeki etkisi incelenmiştir. Fıkıh usûlünde yer bulan şart nazariyesi tespit edilip tahlil edildikten sonra insanların gündelik hayatta en çok başvurdukları akit olgusu bu nazariye etrafında ele alınmıştır. Hanefî, Mâlikî, Şâfiî ve Hanbelî mezheplerinin akitler hukuku ile ilgili ortaya koydukları teori, fıkıh usulündeki nazariye çerçevesinde değerlendirilmiştir. Tez, giriş ve iki bölümden oluşmaktadır. Giriş kısmında tezin içerik ve yöntemi ile ilgili bilgiler paylaşılmıştır. Birinci bölümde fıkıh usulünde şart nazariyesi şerʿî hüküm ile bağlantılı olarak ele alınmış ve şart kavramına dair yaklaşımlar ortaya konulmuştur. İkinci bölümde ise şart kavramının fıkıh usulünde ele alınış biçiminden hareketle akitler değerlendirilmiştir."
