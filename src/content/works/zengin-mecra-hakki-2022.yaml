abstract: "Çalışmamızın konusunu sınırlı aynî hakların içerisinde yer alan ve irtifak hakkı niteliğine sahip mecra hakkı oluşturmaktadır. Mecra hakkı; sahibine elektrik, su, doğalgaz gibi madde, enerji ve verilerin taşınmasını sağlayan transit mecraların bir ya da birden fazla taşınmazdan geçirilmesini sağlayan irtifak hakkıdır. Bu irtifak hakkı taşınmaz malikinin rızasıyla iradî ya da komşuluk hukukunun gerekli kıldığı hâllerde zorunlu olarak kurulabileceği gibi kamulaştırma yoluyla idare lehine de tesis edilebilir. Türk Medenî Kanunu'nda açıkça ifade edilmediğinden mecra hakkının hukukî niteliği konusunda hem Türk hukukunda hem de İsviçre hukukunda tartışmalar mevcuttur. Mecra hakkının bünyesinde inşa etme yetkisinin bulunması bu irtifak hakkını üst hakkına çevirmez. Mecra hakkı, mecraların taşınmazla doğrudan bağlantısının bulunmasına bakılmaksızın bir katlanma irtifakıdır. İradî mecra hakkı kişi lehine ya da taşınmaz lehine kurulabilir. Buna mukabil zorunlu mecra hakkı yalnızca taşınmaz lehine kurulabilen kanunî irtifak hakkıdır. Zorunlu mecra hakkı taşınmaz mülkiyetinin dolaylı kısıtlamalarından olduğu için hak talebinde bulunan taşınmaz maliki doğrudan doğruya yüklü taşınmaza giremez. Talep sahibi, irtifak hakkının kurulması için yüklü taşınmaz malikiyle sözleşme yapmalı ya da dava açmalıdır."
