abstract: "“Yoksulluğa Karşı İslam Hukuku ve Türk Hukukundaki Düzenlemeler”adlı bu çalışmamızda öncelikli olarak geçmişten beri var olan ve birçok bilim dalının konusunu oluşturan yoksulluk problemi ve probleme dair iki farklı hukuk sistemindeki düzenlemeler çalışılmıştır. Sorunun daha iyi anlaşılabilmesi ilk bölümde yoksulluk kavramı; tanım, tür, sebepler ve sonuçlar olarak ele alınmıştır. İhtiyaçları karşılama durumundaki eksik olarak tanımlanan yoksulluk daha çok iktisat ve ekonomi bilimleri ile ilişkilendirilmektedir. Hukuk bilimi ise kurallar koyucu ve kurucu özelliği ile sistemleri kurup şekillendirmektedir. Ekonomi kuralları ve kurumları da hukuk kuralları ile inşa edilmektedir. Kısacası ekonomi ve hukuk birbirlerini şekillendiren iki alandır. Daha çok gelir eksikliği ve ekonomiyle ilişkilendirilen yoksulluk problemi hukuk sistemlerinin de konusu olmuştur. Çalışmamızda İslam hukuku ve Türk hukukunda yoksullukla ilişkilendirilen ve kişileri ekonomik olarak koruyucu ve yoksulluğa düşmelerini önleyici düzenlemeler ele alınmıştır. Bu hukuk sistemlerinin esasları, oluşumları ve kaynakları farklılık arz ettiği için iki ayrı bölüm halinde çalışılmıştır. İslam hukuku kısmı ahkâm âyetleri, hadisler ve temel İslam kaynakları esas alınmıştır. Açıklayıcı olması için düzenlemeler; ibadetler, yasaklar, aile hukuku düzenlemeleri, cezalar ve gönüllük esaslı düzenlemeler şeklinde kategorize edilmiştir. Türk hukuku kısmında ise yoksullukla bağlantılı olarak öncelikle sosyal adalet, sosyal devlet ve sosyal yardım kavramları tanımlanmıştır. Sosyal devlet ve sosyal yardımlar ise Anayasa ve farklı hukuk disiplinlerinde bulunan çeşitli kanunlarla yapılmış ekonomik düzenlemelerle izah edilmiştir. Ayrıca Türk hukukunda devletin aktif sorumluluğu çerçevesinde yoksulluk ve sosyal yardımlar alanında rol alan Aile ve Sosyal Hizmetler Bakanlığından da bahsedilmiştir. Sonuç kısmında iki hukuk sistemindeki benzer düzenlemeler ve farklılıklara değinilerek önerilerde bulunulmuştur."
