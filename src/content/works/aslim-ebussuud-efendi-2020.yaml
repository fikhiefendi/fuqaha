abstract: "Bu tezin amacı, Ebüssuûd Efendi'nin Kur'ân-ı Kerîm'de yer alan nübüvvet kavramı bağlamında ele alınan mucize konusuyla alakalı ayetlere yaklaşımlarını tespit etmektir. Birinci bölümde Ebüssuûd Efendi'nin hayatına dair bilgiler verilmiştir. İkinci bölümde nübüvvet ve mucize'nin kavramsal boyutları ele alınmıştır. Yakın anlamlı ve benzer kavramlar işlenmiştir. Nübüvvet ve mucize birbiriyle bağlantılı iki kavramdır. Mucize nebi'nin eliyle ortaya çıkan olaydır. Müslümanın îmân esaslarından bir tanesi de Allah'ın göndermiş olduğu peygamberlere îmân etmektir. Dolayısıyla peygamberin ortaya koyduğu mucize de îmâni bir meseledir. Peygamber olduğunu iddia eden kimsenin doğruluğunu ispat etmesi gerekir. Aksi halde tarihte örnekleri olduğu gibi farklı şekillerde ortaya çıkıp asılsız iddiada bulunanlar olacaktır. İşte bu tür girişimler mucize gibi bir alamet-i farikayla çürütülüp hak ortaya çıkar. Meydana çıkan hadisenin mucize olup olmadığı, peygamber için doğrulayıcılık yönünün ne olduğu gibi konular ise bu kavramın sağlam bir şekilde anlaşılmasına bağlıdır. Anlama ve kavrama yetileri farklı olup, sahasında ehil olan kimselerin yorumları da meselelere ayrı bir boyut kazandıran önemli bir husustur."
