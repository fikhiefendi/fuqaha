abstract: "İctihad, fıkhın dinamizmini koruyan ve din ile hayat arasındaki irtibatı canlı tutan en hayatî müessesedir. Mezheblerin teşekkülü ve tedvini ardından, özellikle hicrî IV. yüzyıl sonrası dönem, ictihad kapısının açık/kapalı olduğu ve dinî düşüncede bir durgunluk yaşanıp yaşanmadığı tartışmalarına konu olmuş bir dönemdir. Bilhassa, İslâm coğrafyasının Batı karşısında maddî planda geri kaldığı ve bir yenilgi psikolojisinin yaygınlık kazandığı zeminde ictihad meselesi, dinin yeniden yorumlanması gibi bir muhteva da kazanmıştır. XX. yüzyılda ictihad, ihya ve tecdid gibi kavramları merkeze alan farklı bakış açıları gelişmiştir. Kimi geleneğe daha fazla vurgu yapan, kimi mezheb ve taklidin ümmeti geri bırakan unsurlar olduğunu savunarak bu yüklerden kurtulunması gerektiği tezini öne çıkaran, kimi de gelenekten tevarüs edilen mirasla asrın gerekleri arasında bir denge arayışı olarak temayüz eden bu yaklaşımları temsil sadedinde çalışmamızda yer verdiğimiz üç ismin görüşleri simgesel önem taşımaktadır."
