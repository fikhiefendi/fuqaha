abstract: "Hadis usûlü ilmini inceleyen araştırmacıların dikkatle baktığında nazarlarından kaçmayacak olan hususlardan biri, klasik hadis usûlü kaynaklarının en belirgin olanlarının Şâfiîler tarafından kaleme alındığıdır. Bu nedenle de hadis usûlü kaynaklarının Şâfiîler tarafından telif edildiği ve diğer mezhep mensuplarının katkılarının az olduğu şeklinde bir kanaat hâsıl olmuştur. Bu bağlamda biz, Hanefîlerin Hadis Usûlü ilmine yapmış oldukları katkıları ortaya çıkartmak amacıyla bu tezi hazırladık. Tezimiz; önsöz ve sonuç bölümü haricinde giriş ve iki bölümden oluşmaktadır. Giriş bölümünde hadis usûlü ilminin tanımı, ortaya çıkışı, hadis usûlü hakkında yapılan en bariz çalışmalar, hadis usûlü kaynaklarının müelliflerinin fıkhî görüş ve mezhepleri gibi konular ele alınırken, Hanefîlerin hadis usûlü ilmine olan katkılarına kısaca bir giriş de yapılmış ve bu kapsamda Hanefîlerin hadis usûlünü ele alış tarzları tanıtılmıştır. Birinci bölümde hadis usûlü kaynaklarına yeni bir eser katmış olan Hanefî âlimlerinden İbnu'l-Hanbelî ele alınmış; hayatı, ailesi, hocaları, talebeleri ve ilmî çalışmaları araştırılmıştır. İkinci bölümde ise, hanefîlerin hadisçilere muhalefet etmiş olduğu hadis usûlü konularına ve hanefîler tarafından hadis usûlüne yapılmış katkılara yer verilmiştir. Tezimizde bu konuları hanefîlerin ana kaynakları mahiyetinde olan eserlere muracaat ederek hanefîbakış açısını açıklamaya çalışılmıştır. Anahtar kelimler: İbu'l-Hanbelî, Kafvu'l-eser, Hadis usulü, Hadis, Hanefîler."
