abstract: "İslam Devletileri, kuruluşundan günümüz devletleri ortaya çıkana kadar birbiriyle ilişkili birçok teşkilat üzere kâim olmuştur ve bu teşkilatlardan biri de hisbe teşkilatıdır. Hisbenin önemi, pazarları ve mâlî mu'âmeleleri kontrol altında tutup emr-i bi'l-ma'rûf ve nehy ani'l-münker yapmasından kaynaklanmaktadır. Bu araştırma da mahiyeti, uygulanmaya başlanması ve isimlendirilmesi, diğer kurumlardan ayrı müstakil ancak onlarla ilişkisini sürdüren bir kurum hâline gelmesi gibi birçok farklı açıdan hisbeyi ele almıştır. Ayrıca hisbenin Kuran, sünnet ve İslam iktisâdındaki önemine değinip toplumun iktisâdî hayatı, pazarda gerçekleşen mâlî mu'âmelerle ve fesâdın önüne geçilmesiyle ilişkisini beyân etmiştir. Bunların yanı sıra hisbeye dâir yazılmış olan ve hisbe konularını içeren eserlere odaklanmış ve bunları kronolojik olarak sıralayıp müelliflerinin izlediği yöntemleri inceleyerek eserleri teorik ve uygulamalı olmak üzere iki sınıfa ayırmanın mümkün olduğunu tesbit etmiştir. Sonuncu bölümde ise örnek olarak Yusuf Ziyâeddîn'in hisbe hakkındaki risâlesini incelemiştir. Nitekim bu risâle Osmanlı Dönemi'ne âit olup Arapça ve Osmanlıca dilleri kullanılarak yazılmış ve risâlede hem teorik hem de uygulamalı yöntem kullanılmıştır. Müellifinin büyük oranda Osmanlıca fetvâları, hisbe kitaplarını ve fıkıh kitaplarını esas almış olması da bu risâleyi ayıran özelliklerinden biridir. Araştırmada risâlenin içeriği 40 meseleye ayrılmış ve hisbeyle ilgili meselelere odaklanılıp bunlar, önceki hisbe müelliflerinin görüşleriyle de karşılaştırılarak incelenmiştir."
