abstract: "Bu çalışma, İbn Hacer el-Askalânî'nin Buluğü'l-Merâm min Edilleti'l-Ahkâm adlı eserinde yer alan aile hukuku hadislerini delil–istidlâl ilişkisi çerçevesinde incelemektedir. Araştırmanın amacı, söz konusu hadislerin mezhepler tarafından nasıl değerlendirildiğini, bu hadislerden hangi fıkhî hükümlerin çıkarıldığını ve mezhepler arasındaki farklılıkların hangi yorum biçimlerinden kaynaklandığını ortaya koymaktır. Çalışmada nitel araştırma yöntemi benimsenmiş, metin analizi ve mukayeseli inceleme tekniklerinden yararlanılmıştır. Bu kapsamda öncelikle Buluğü'l-Merâm'ın ahkâm hadisleri literatüründeki yeri ve eser etrafında oluşan şerh geleneği ele alınmış, ardından aile hukukuna ilişkin hadisler fıkhî delil değeri ve mezheplerin bu hadisleri kullanma biçimleri açısından değerlendirilmiştir. İnceleme özellikle Hanefî ve Şâfiî mezhepleri merkezinde yürütülmüş, gerekli görülen yerlerde diğer mezheplerin görüşlerine de yer verilmiştir. Araştırma sonucunda mezhepler arasındaki ihtilafların çoğu zaman hadislerin kabul veya reddinden değil, aynı hadislerin farklı şekillerde yorumlanmasından kaynaklandığı tespit edilmiştir. Nikâhta velî şartı, şığâr ve mut'a nikâhları, üç talâk, ric'at, süt hısımlığı, iddet ve nafaka gibi konularda mezheplerin aynı rivayetlerden hareketle farklı hükümlere ulaşabildikleri görülmüş; bu farklılıkların hadislerin delâletinin değerlendirilmesi, rivayetlerin kapsamının belirlenmesi ve hadislerin diğer delillerle birlikte ele alınış biçiminden kaynaklandığı anlaşılmıştır. Bununla birlikte mezheplerin hadisleri yorumlarken kendi hukukî bütünlüklerini ve temel ilkelerini koruma gayreti içerisinde oldukları görülmüştür. Sonuç olarak çalışma, Buluğü'l-Merâm'da yer alan aile hukuku hadislerinin İslâm hukukunda hüküm üretme sürecindeki yerini ortaya koymakta, hadislerin fıkhî hükümlere dönüşümünde yorum ve istidlâlin belirleyici rolünü göstermekte ve hadis ile fıkıh arasındaki ilişkinin daha iyi anlaşılmasına katkı sağlamaktadır."
