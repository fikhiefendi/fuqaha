abstract: "Çalışmanın amacı katılım bankacılığı alanında yeni sunulan bireysel emeklilik sisteminin gerekliliğini ve işleyiş aşamasında bireysel emeklilik sisteminin fonlarının değerlendirilmesi hangi enstrümanlarla gerçekleştirdiğini ortaya koymaktır. 12/01/2008 tarihinde Resmi Gazete ile bireysel emeklilik sistemi içinde en az %30 oranında Devlet Tahvili Hazine Bonosu bulunma şartı kaldırılmasıyla katılım bankacılığında bireysel emeklilik sistemi doğmuştur.Faize duyarlı tasarruf sahiplerinin sisteme girmesiyle katılım bankacılığı sektörünün gelişmesine önemli etkileri olacaktır. Faizsiz bireysel emeklilik sisteminde fonların değerlendirilmesi yeni oluşan ve gelişen bir alandır. Bu konu alanıyla ilgili yayınlaşmış bilimsel kaynağın az olması bu çalışmanın önemini arttırmaktadır.Katılım bankalarında BES'nin çok kısa bir geçmişinin oluşu sisteme dair istatistiksel verilerin yeterince sağlanamaması ve literatürün az olması sınırlılık olarak söylenebilir. Ayrıca bankacılık sisteminde rekabet yoğunluğu nedeniyle bazı verilerin elde edilememesi araştırmanın sınırlılıkları olarak sıralanabilir. Bu araştırmada, gerekli literatür taraması yapılarak betimsel araştırma türü uygulanmıştır.Çalışmanın birinci bölümünde, Türk bankacılık sistemi değerlendirilmiş bankacılık sisteminin içerisinde katılım bankacılığın yeri ve önemi belirtilerek katılım bankacılığının özellikleri hakkında araştırma yapılmıştır. Katılım bankacılının doğuşu, Türkiye'deki mevcut durumu ve işleyiş prensipleri ile ilgili araştırma yapılarak Türkmali sektöründeki önemine vurgu yapılmıştır. Katılım bankacılığının fon toplama, değerlendirme, finansman teknikleri ve fon kullandırma teknikleri açıklanmıştır. böylece katılım bankalarının yapısı ve özellikleriyle ilgili çeşitli kaynaklardan yararlanılarak önemi ortaya konulmuştur.Çalışmanın ikinci bölümünde, katılım bankalarında bireysel emeklilik sistemin incelenerek işleyişi hakkında araştırma yapılmıştır. Öncelikle bireysel emeklilik sisteminin gerekliliği, doğuşu ve özellikleri ile ilgili araştırma yapılmıştır. Diğer aşamada ise katılım bankalarındaki bireysel emeklilik sisteminin özellikleri ve ticari bankalardaki bireysel emeklilik sistemindeki farklılıklarla ilgili değerlendirme yapılmıştır. Ayrıca katılım bankalarında BES' in oluşabilmesi için faizsiz emeklilik yatırım fonlarının doğuşu ve özellikleri araştırılmıştır. Faizsiz emeklilik yatırım fonlarının içerisindeki faizsiz enstrümanların neler olduğu bu emeklilik fonlarını içerisindeki oranları % olarak payı araştırılmıştır.Çalışmanın üçüncü ve son bölümünde ise, katılım bankaları ile mevduat bankalarında sunulan BES'nin karşılaştırılması yapılmıştır. Benzer yönleri ile farklı olan yönler araştırılmıştır. Ayrıca faizsiz emeklilik yatırım fonlarının son yıllardaki performansları araştırılmıştır. Katılım bankalarında bireysel emekliliğin daha verimli ve performanslı olabilmesi için faizsiz sabit getirisi olan yatırım araçlarına yönelinmesi gerektiği vurgulanmıştır."
