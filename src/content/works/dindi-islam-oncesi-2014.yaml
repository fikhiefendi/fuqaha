abstract: "Bilindiği üzere farklı tarihlerde ve farklı toplumlara indirilen her vahiy, Kur'an başta olmak üzere, indiği tarihi, içinde bulunduğu toplumun örf ve adetlerini, zihinsel tasavvurlarını dikkate almış ve onların tarihsel ve toplumsal olgularını göz ardı etmemiştir. Bu bakımdan Kur'an'ın, Hz. Peygamber döneminde anlaşılma sorunu olmamıştır. Nüzul ortamını çevreleyen kültürden uzaklaşıldıkça anlaşılma problemi ortaya çıkmıştır. Özellikle de günümüzde,çağımız Müslümanlarının kültürü, 7. yüzyıl Arap toplum yapısından oldukça farklılaşmıştır. Bu farktan dolayı Kur'an'ı anlamadaki güçlük oldukça artmıştır. O bakımdan 20. yüzyılın ikinci yarısından itibaren Kur'an'ın, 7. yüzyılda, İslam öncesi dönemde/cahiliye çağında yaşayan Arap toplumunun kültürel unsurlarınıihtiva ettiği, vahyin içinde bulunduğu toplum kültürünün bir parçası olduğu gerekçeleriyle,Kur'an'ı iki perspektifli olarak, tarihsel ve evrensel anlama yöntemlerinin ortaya çıktığını görüyoruz. İşte biz de bu çalışmada Kur'an ahkâmını, cahiliye çağı Arap toplumu kültürü içinde iki perspektifli okumaya çalıştık. Kur'an'ın, vaz' ettiği hükümlerde indiği toplumun örf ve adetlerini, tasavvurlarını dikkate alıp almadığını tetkik ettik. Tevrat ve İncil kaynaklı hangi ilkelerin Kur'an'da yer aldığını, ne tür hükümlerin iptal edilip tashih edildiğini ele aldık. Yedinci yüzyıl Arap kültürü ile Kur'an metni arasındaki diyalektik ilişkiyi inceledik. Buradan hareketle,İbranilerin ve cahiliye dönemi Arap toplumunun hangi adetlerinin Kur'an'da teşekkül ettiğini ortaya koyduk. Diğer taraftan, Kur'an'da teşekkül etmiş olan Arap kültür kalıplarına, evrensel ilkeleri Kur'an'ın, nasıl yerleştirdiğini irdeledik. Çalışmanın inşa sürecinde ise analitik, tümevarım yöntemi kullandık. Bu araştırma neticesinde Kur'an'da yer alan pek çok ahkâm ve tasavvurun, cahiliye döneminde Arap ve İbrani teamüllerin bir devamı niteliğinde olduğu, dolayısıyla Kur'an'ın, hem yerel hem de evrensel bir yapıya sahip olduğu ortaya çıktı."
