abstract: "Evrensel bir hukuk sistemi olarak kabul ettiğimiz İslâm hukuku, söz konusu evrenselliğini sağlayan ve ona dinamik bir yapı kazandıran birtakım temel prensipleri bünyesinde barındırmaktadır. İslâm hukukunun evrenselliğini temin eden, değişen şartlara ve Şâriin maksadına en uygun şekilde işlemesini sağlayan unsurlardan biri de ihtiyaç halinde ikâmelere yer vermesidir.Bu çalışmanın amacı da, hukuka dinamizm ve esneklik kazandıran ikâme kurumları ibadetler özelinde incelemektir. İbadetlerdeki ikâmelerin ve bu ikâmelere temel teşkil eden hukukun genel ilkelerinin araştırılması, İslâm hukukunun teşrî siyasetinde önemli bir yeri olan ikâme teorisinin oluşturulmasına katkı sağlayacaktır.Araştırmamız bir giriş ve iki bölümden oluşmaktadır. İfâ, ikâme, bedel, ruhsat gibi kavramların tanımlarına yer verilen giriş bölümünde konuya bir ön hazırlık yapılmıştır. Birinci bölümde ibadetlerdeki ikâme örnekleri genel hatlarıyla anlatılırken ikinci bölümde de bu örneklerden hareketle bir ikâme teorisi oluşturulmaya çalışılmıştır.Araştırmanın sonucunda, İslâm hukukunun değişime en kapalı alanlarından biri olarak kabul edilen ibadetler alanında gerek mükellefin güç yetirme unsuruna bağlı olarak gerekse sosyal şartların değişmesi ve ibadetlerden hedeflenen asıl maksatları gerçekleştirme amacına matuf olmak üzere pek çok ikâmeye yer verildiği tespit edilmiştir."
