abstract: "Bu araştırma, Mindanao, Filipinler'de yoksulluğun azaltılması için uygulanabilir stratejiler olarak vakıf ve İslami mikrofinans ile ilgili bilgi düzeylerinin bir değerlendirmesini sunmaktadır. 204 katılımcıdan oluşan bir örneklemden birincil verileri toplamak için kapsamlı bir anket anketi kullanıldı. Toplanan veriler (SPSS ve Excel) gibi istatistiksel yazılımlar kullanılarak analiz edildi. Bulgular, ankete katılan kişiler arasında vakıf ve İslami mikrofinans konusundaki farkındalık ve anlayış açısından kayda değer bir eşitsizliği ortaya koyuyor. Vakıf nispeten yüksek düzeyde tanınırlığa sahipken, İslami mikrofinans tarafsız olarak değerlendiriliyor. Çağdaş İslami mikrofinans yöntemlerine ilişkin farkındalığın sınırlı olduğunu belirten bazı yanıtlara rağmen, bu yaklaşımlara ilişkin genel farkındalık nispeten düşük kalmaktadır. Bilgilerdeki bu eşitsizlikler, yoksullukla ilgili zorlukları ele almak ve Filipinler'in Mindanao kentindeki Bangsamoro topluluklarının kapasitelerini geliştirmek için tasarlanmış hedefli girişimlerin potansiyelinin altını çiziyor. Bu araştırma, uygulayıcılar ve politika yapıcılar için değerli bir kaynak olarak hizmet etmekte ve olumlu değişimi teşvik etmek için bir temel sunmaktadır. Bu araştırma, farkındalık yaratarak ve vakıf ve İslami mikrofinansın uygun şekilde kullanılmasını kolaylaştırarak, bölgedeki yoksulluğun azaltılmasına ve toplulukların güçlendirilmesine katkıda bulunabilir."
