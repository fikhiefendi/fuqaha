abstract: "İslam hukuku, birey ve toplum hayatını düzenleyen temel bir unsur olup, davranışların yönlendirilmesinde ve ilişkilerin bütüncül bir yasal çerçeve içerisinde düzenlenmesinde önemli bir rol oynamaktadır. İslam ümmeti, İslam medeniyetinin bıraktığı en büyük miraslardan biri olan zengin bir ilmî mirasa sahiptir. Bu miras içerisinde fıkhî miras, derin düşünsel tecrübelerin bir ürünü olan sağlam ilmî içtihatları ihtiva etmesi bakımından öne çıkmakta; ümmetin aklını ve hafızasını temsil etmektedir. Bunun en açık göstergesi, İslam uleması tarafından asırlar boyunca kaleme alınmış ve dünyanın dört bir yanındaki kütüphanelerde muhafaza edilmiş olan İslami el yazması eserlerde görülmektedir. Bu bağlamda Hanefî mezhebine ait bu zengin fıkhî mirasın bir kısmının gün yüzüne çıkarılmasına vesile olunması araştırmacı açısından büyük bir bahtiyarlıktır. Bu eser, özellikle dört mezhebin görüşlerine dair geniş çaplı bir inceleme yapılması ve ihtilaflı görüşlerin titizlikle ele alınması bakımından kapsamlı ve dengeli bir bakış açısı sunmaktadır. Bu çalışma kapsamında, çağdaş dönemde yaşanan krizler ve zorluklar karşısında İslam fıkhının sağlam bir referans kaynağı olma özelliği dikkate alınarak, Cinâyât ve Hudûd konularının incelenmesi tercih edilmiştir. Bu iki konu, günümüz olaylarını anlamada ve onlarla şer'î bir perspektiften sağlıklı bir şekilde başa çıkma hususunda büyük bir öneme sahiptir."
