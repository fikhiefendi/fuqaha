abstract: "Seyhülislam Çivizâde Muhyiddin Mehmed Efendi'nin (896-954/1491-1547) fıkhî görüslerini ve fetvalarını ele aldıgımız bu tezimizde öncelikle; Çivizâde'nin fıkhî görüslerinin ve fetvalarının daha iyi anlasılabilmesi için, yasamıs oldugu dönemdeki ilmî hayatı ele aldıktan sonra, hayatını ve sahsiyetini tanıtmaya çalıstık. Daha sonra, Çivizâde'nin fıkhî görüslerinin belirlenebilmesi ve saglıklı bir sekilde degerlendirilebilmesi için Çivizâde'ye nispet edilen eserleri tespit ettik ve bu eserleri nüshalarıyla birlikte tanıttıktan sonra, kendisine nispetlerinin sıhhatini ortaya koymaya çalıstık. Bu çalısmamız esnasında, tabakât kitaplarında, kütüphane kataloglarında ve ikinci el kaynaklarda Çivizâde Muhyiddin Mehmed Efendi'ye nispet edilen pek çok eserin aslında ona ait olmadıgını; Çivizâde'nin, kendisi gibi seyhülislamlık yapmıs ve kendisiyle aynı ismi ve lakabı tasıyan oglu; Çivizâde Mehmed Efendi (937?1530/995? 1587) sebebiyle, eserlerinin ve fetvalarının birbirlerine karıstırıldıgını, bazı eserlerin ise her iki müellife de ait olmadıgını gördük. kinci bölümde; ilk olarak Çivizâde'nin fıkıhla (slam Hukuku'yla) ilgili risalelerini ele aldık ve bu risalelerdeki görüslerini, ortaya koymus oldugu delillerle birlikte yansıtmaya çalıstık. Fıkhî risalelerinin degerlendirilmesi bölümünde ise, risalelerindeki görüslerinden yola çıkarak Çivizâde'nin içtihat, tahriç ve taklit anlayısını ve kendisinden önceki ulema ve kitaplarla ilgili degerlendirmelerini ortaya koymaya çalıstık. Daha sonra Çivizâde'nin fıkhî yönünün aydınlatılmasına katkı saglamak üzere, kendisine ait olan ve klasik fetva usulüne göre, soru-cevap seklinde vermis oldugu fetvaları inceledik. lk olarak bu fetvaların bulundugu mecmuaları ve eserleri tanıttık ve bu mecmua ve eserlerin içerisinde yer alan ve Baba Çivizâde'ye ait olan fetvaların kendisine nispetini belirlemeye gayret sarfettik. Baba Çivizâde'ye ait oldugunu tespit edebildigimiz fetvaları fıkıh bablarına göre tasnif ederek, latinize etmek suretiyle tezimize ilave ettik. Ardından da fetvaların degerlendirilmesi ile ilgili bir bölüm açtık ve bu bölümde genel olarak fetvaları degerlendirmekle birlikte, özellikle Çivizâde'yi ve onun fıkhî anlayısını yansıtan ve o dönemde tartısılan belli baslı konularla ilgili fetvaları ele aldık ve bu fetvalarla ilgili degerlendirmelerimizi sunduk."
