abstract: "'İslam Hukuku Açısından Domuz ve Ürünleri' adlı bu çalışma, giriş ve iki bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı ve kaynaklarına ilişkin bilgiler yer almaktadır. Burada domuz ve ürünlerinin mahiyetinden bahsedilmekte, bu çalışmayla neyin hedeflendiği ve hangi kaynaklara başvurulduğu belirtilmektedir. Birinci bölüm; konuyla ilgili kavramlara, dinlerde domuzla ilgili hususlara ve sağlık açısından konu ile alakalı alanlara tahsis edilmiştir. Bu bölümde öncelikle araştırma ile ilgili temel esasların anlaşılmasında kavramlar öz bir şekilde açıklanmış olup, semavi dinler ve diğer inançlarda domuz ve ürünleri ilgili genel yaklaşımlara yer verilmiştir. Ayrıca domuz ve ürünlerinin İslam hukuku alanıyla ilişkili sağlık yönüne de yer verilerek bölüm sonlandırılmıştır. İkinci bölüm; İslam hukukunda domuz ve ürünlerine dair tartışma hükümleri mezhepsel bağlamda ele alınarak incelenmiştir. Ayrıca çağımızda yeni tekniklerle domuzdan üretilmiş ürünleri istihale çerçevesinde ele alarak genel bir çıkarım yapılmıştır. Bir de bu bölümde önemine binaen domuz menşeli jelatin etraflıca ele alınarak incelenmiş ve son olarak öneri ve teklifle çalışma neticelendirilmiştir."
