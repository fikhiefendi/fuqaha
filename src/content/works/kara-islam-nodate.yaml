abstract: "Bu çalışmada İslam hukukunun teşekkülünde ve hükümlerin teşriinde önemli bir yere sahip olan zarar vermeme ve meydana gelen zararı giderme prensibinin, akit teorisindeki ilke ve kuralların oluşmasına etkileri, füru örneklerden yola çıkılarak bir teori şeklinde ortaya konulmaya çalışılmıştır. İlgili örneklerde zararın etkileri incelenip illet ya da hikmet olarak nerede durduğu, fesad ve butlâna yol açan unsurlardan hangilerinin zarar illetine dayandığı somut bir şekilde Hanefî mezhebi merkeze alınarak ele alınmıştır. Satım akdi diğer akitler için de model bir akit konumunda olduğundan öncelikle satım akdi düşünülerek, hareket noktası kabul edilmiştir. Araştırma neticesinde, akit teorisinin teşekkülünde ve akitler konudaki prensiplerin oluşmasında, genel anlamda taraflara zarar vermeme, meydana gelen zararı giderme ilkesinin etkisi somut örneklerle ortaya konmuştur. Diğer mezheplerden farklı olarak muâmelât alanındaki hükümleri hukukî açıdan fâsid ve bâtıl olarak ayran Hanefîlerin uygulamalarında zararın özellikle cehalet, garar ve niza unsurlarıyla yakın ilişki içerisinde olduğu görülmektedir. Şöyle ki garar ve cehaletin akdi fâsid kılmasındaki temel gerekçe bilinmezlik ve belirsizlik sonucunda ortaya çıkması muhtemel olan zarardır. Nitekim sonucunda bir zarar ortaya çıkmayacak ya da zarar çok basit kalıp kayda değer bir orana ulaşmayacaksa bunların fesad sebebi olmadığı örneklerde de görülmektedir. Aynı zamanda zarar bu üç unsurdan nizanın da sebebidir. Çünkü insanların akit sebebiyle birbirlerine itiraz etmesinin, mahkemelik olup çekişmesinin temel sebebi de yine zarar görme ihtimalleridir. Diğer fesad sebeplerinin oluşumunda ve akdin kuruluşunu, bağlayıcı hale gelmesini ve nefâzını engelleyen sebeplerin oluşmasında zararın etkileri de bu çalışmada örneklerle ortaya konulmaya çalışılmıştır."
