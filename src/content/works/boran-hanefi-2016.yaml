abstract: "Tezimiz giriş ve üç bölümden oluşmaktadır. Giriş bölümünde, araştırmanın konusu, önemi, amacı, sınırları, kaynakları ve metodu hakkında bilgi verilmiştir. Birinci bölümde, helâl, haram, kerâhiyet, istihsân, hazr, ibâha, tayyib, necis gibi kavramlar tahlil edilmiştir. İslâm'da helâl ve haramın yeri, Kur'an-ı Kerim'de helâl-haram, Sünnette helâl-haram, diğer dinlerde, Yahudilik ve Hristiyanlıkta, Mekke Müşriklerinde helâl-haram konusu üzerinde durulmuştur. Helâllik ve haramlığın tespitine yardımcı olan önemli ölçüler ele alınmıştır. İkinci bölümde, diğer mezheplerin görüşlerine yer vermekle beraber daha çok tezimizde esas aldığımız Hanefi mezhebinde helâl olan hayvanlar, yiyecekler, içecekler, bitkiler, haram olan hayvanlar, yiyecekler, içecekler, bitkiler ve bunların şüpheli olanları incelenmiştir. Üçüncü bölümde, güncel konular ile istihâle, istihlâk gibi hususlara açıklık getirilmeye çalışılmıştır. Jelâtin, karmin, koşineal, şellak, emülgatörler, gıda katkı maddeleri, içeceklerden alkol, bira, kımız, kefir, boza ve ilaçlardaki alkol, helâl sertifika, tavuk ve diğer hayvanların beslenmesi, kesimi ve sonrasıyla alakalı problemler, GDO gibi konular değerlendirilmiştir. Sonuç, kaynaklar ve eklerle tezimiz tamamlanmıştır."
