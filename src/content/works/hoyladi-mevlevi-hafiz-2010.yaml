abstract: "Kureyşilik tartışmaları ilk olarak Hz. Ebûbekir'in halife seçiminde yapılmıştır. Hz. Ebûbekir Sakîfe toplantısında halifenin Kureyş kabilesinden seçilmesi gerektiğini ifade etmiştir. Hilafetin Osmanlılara geçişiyle tekrar gündeme gelen Kureyşilik tartışmaları özellikle Osmanlının son dönemlerinde siyasi sebeplerden dolayı iyice alevlenmiştir. Osmanlı halifesinin Hindistan'da Müslümanların lideri rolünü üstlenmesini istemeyen İngilizler, bu bölgede halifenin Kureyş'ten olması gerektiği propagandası yaptılar. Aynı propagandayı Araplara karşı da yapan İngilizler, onların Osmanlıdan ayrılmalarını amaçladılar. Meselenin hukuki boyutunu ise Hz. Peygamber'in Kureyş lehine olan ifadeleri şekillendirmektedir. Bir kısım ulema bu konudaki hadislere dayanarak halifenin Kureyşten olması gerektiğini söylerken bir kısım ulema da bu hadisleri çeşitli tevillere tabi tutarak bu şarta karşı çıkmıştır. Mevlevî Hafız Abdülcemîl Efendi de Kureyşilik şartına yazdığı risalesinde karşı çıkmış, bu şekilde İngilizlerin propagandalarına karşı bölge Müslümanlarını bilgilendirmiştir."
