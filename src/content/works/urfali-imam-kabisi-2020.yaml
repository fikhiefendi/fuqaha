abstract: "Ebû Abdullâh Mâlik b. Enes el-Asbahî el-Medenî'nin (ö. 179/795) el-Muvatta isimli kitabı, hadîs sahasında tasnif edilen ilk eserlerden biri sayılır. Bu eser İmâm Mâlik'in fıkhî görüşleriyle ilgili bilgi kaynaklarından bir olarak kabul edilir. Muvatta isimli bu eser, Hz. Peygamber'e (s.a.s.) dayandırılan muttasıl ve munkatı' hadîsleri, sahabenin ve Medine ehlinden olan tabiinin ve tebi tabinin sözleriyle görüşlerini ihtiva etmektedir. Dolayısıyla hacimli bir eser özelliğine sahiptir. Bu durum bazı alimleri bu eserin muhtasarını yapmaya sevk etmiştir. Ebu'l-Hasen Ali b. Muhammed b. Halef el-Kâbisî el-Mu'âfirî'nin el-Mulahhis adlı kitabı da Muvatta'nın ihtisarlarından biridir. el-Mulahhis adlı bu eserin daha önce yapılmış bir tahkiki olmakla birlikte metninin eksik olması, içinde pek çok yanlışların bulunması, muhakkikin sadece iki nüshaya itibar etmesi vb. sebeplerden dolayı eseri yeniden tahkik etmeye karar verdik. Zira bunca öneme sahip bir esere ait bir tahkikin en azından mükemmele yakın olması ve yanlışlardan uzak bulunması gerekir. Araştırmamızda öncelikle kütüphane dizinlerini inceleyerek ve uzmanlara sorarak kitabın tüm el yazmalarına ulaşmaya çalıştık. Bu bağlamda dünyanın farklı yerlerindeki nüshaları toplayarak 12 adet el yazması nüshayı elde ettik. Böylece sağlam ve güvenilir metni tespit etmemize yarayacak pek çok değerli nüshaya ulaşmış olduk. İkinci olarak ise; müʿellifin, kitabını kaleme alırken takip ettiği yazım metodunu ve en doğru metni ortaya koymak için el yazmalarını inceledik. Eseri tahkik ederken bir nüshayı asıl olarak kabul ettik. Üçüncü olarak ise; orijinal nüshanın kopyasını alarak diğer nüshalarla karşılaştırdık. Çalışmada sadece nüshaların farklılıklarını göstermekle yetinmedik, bunun ötesinde kitap hakkında bazı yorumlarda da bulunduk. Ayrıca hadîs-i şeriflerdeki bazı“garib”kelimeleri açıklama ihtiyacı hissettik ve tahkik faaliyetimizi tamamlayıcı ve desteklayici olan eklerle söz konusu çalışmamızı nihayete erdirdik."
