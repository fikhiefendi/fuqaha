abstract: "Bu araştırma fıkıh dersi programını öğretmen ve öğ renci görüşlerine dayalı olarak değerlendirmek ve progra mın geliştirilmesine ilişkin öneriler hazırlamak amacıyla düzenlenmiştir. Araştırmada 1993-1994 öğretim yılında 13 değişik okulda görev yapan 50 branş öğretmeni ve 6 farklı okulda okuyan 300 öğrenci örnekleme alınmıştır. Toplanan veriler, kişisel bilgiler ve programa iliş kin bulgular olmak üzere iki ana baslık altında değerlen dirilmiştir, önce öğretmenler, daha sonra da da öğrenci lerle ilgili bulgular değerlend irmeye alınmıştır. 1. Kişisel Bilgiler: öğretmenlerin yarıya yakını {% 46) 31-40 yaş arasın dadır, üçte biri (% 36) 3-8 yıl arası kıdeme sahiptir, öğ retmenlerin yarısı ilahiyat Fakültesi, % 46 'sı ise Yüksek İslam Enstitüsü mezunudur. Yarıya yakınının (%46) yüksek öğretimde aldığı bilgiler öğretmenlik için yeterlidir. Ya rıdan fazlası {% 58) hizmet-içi eğitime ihtiyaç duymakta dır, üçte biri {% 34) fıkıh dersini okutmak için kendini yeterli görmektedir. öğrencilerin kız ve erkek oluşlarında sayısal bir denge vardır, öğrencilerin yarıdan fazlasını {% 62) 16-17yaş arasındakiler oluşturmaktadır. Yarıya yakını {% 42) şehir merkezinde doğmus ve ilkokulu şehirde bitirmiştir. Yarıdan fazlası (% 62) şehirde oturan ailelerinin yanında kalmaktadır. Çoğunun ailesi şehirde oturmaktadır (% 49.3). Yarıya yakınının annesi (% 44.7) okur-yazar değildir. Yarıdan fazlasının babası {% 56.3) ilkokul mezunudur. Büyük çoğun luğunun annesi {% 85.7) ev hanımı, dörtte birinin babası serbest çalışmaktadır. Dörtte birinin ekonomik durumu {% 25) çok zayıftır, öğrencilerin büyük çoğunluğu (% 70.3) ilkokuldan sonra i.H.L.'ne gelmeyi arzu etmişlerdir. Yarı dan fazlası (% 60) bu okula kendi isteğiyle gelmiştir. 2. Programa ilişkin Bulgular: öğretmenlerin yarıya yakınma göre {% 42) muhteva sınıflara göre kısmen dengelenmiştir. Yarıya yakınma göre {% 40) muhteva dersin amaçlarını kısmen gerçekleştirmekte dir, öğretmenlerin büyük çoğunluğuna göre (% 72) kitaptaki konular yeterli değildir, üçte birine göre (% 36) konular tam anlaşılmamaktadır. Yarıdan fazlasına göre {% 54) ders saati artırılmalıdır, öğretmenlerin yarıya yakını {% 40) derse her zaman hazırlanarak girmektedir. Büyük çoğunluğu {% 90) kaynak eserlerin yararına inanmaktadır, öğretmenle rin yarıya yakınına göre (% 46) derste soru-cevap yöntemi uygulanmalıdır. Yarıya yakını {% 40) uygulama konularını sınıflarda nazari olarak anlatmaktadır, öğretmenlerin yak laşık üçte birine göre {% 30) sınıfların kalabalık oluşu dersi olumsuz etkileyen faktörlerdendir.öğrencilerin % 38.7 'sine göre muhteva ders amaçlarını gerçeklestirememektedir. üçte ikisine göre 1% 68.7) kitap taki konular yeterli değildir. Yarıya yakınma göre {% 45.7) günümüzde tartışılan bazı konular kitapta yeterli şekilde açıklanmamıştır, öğrencilerin yarıya yakınına gö re (% 46) öğretmenler dersle ilgili kaynakları öğrencilere söylemektedir. Yarıdan fazlasına göre {% 52) ders saati artırılmalıdır, öğrencilerin yarıdan fazlasına göre {% 55.3) derste tartışma yöntemi uygulanmalıdır. Kız öğren cilerin yarıdan fazlası {% 51) rahatça soru soramamakta, erkek öğrencilerin dörtte üçü {% 76.7) rahatça soru sora bilmektedir, öğrencilerin büyük çoğunluğuna göre % 69.7) öğretmenler uygulamayı gerektiren konuları sınıflarda na zari olarak anlatmaktadırlar. öğretmenlerin yarıya yakınına göre {% 46) derste günlük fıkhî problemlere çözüm getirilmemektedir. öğrencilerin çoğunluğu î.H.L.'ne devam etmekten mem nundur (% 83). Çoğunluğu (% 65.7) î.H.L.'ne dini bilgiler edinmek için gelmiştir, öğrencilerin büyük çoğunluğunun (%93.4) I.H.L.'deki basarı durumu iyidir. Fıkıh dersindeki basarı ise % 96' dır. öğrencilerin yarıdan fazlası {% 55.7) fıkıh dersine normal derecede ilgi duymaktadır. Fıkıh der sine ilgi duyanların dörtte üçü {% 75.1) bazı sorulara ce vap bulabildikleri için ilgi duymaktadırlar. îlgi duyma yanların yarıdan fazlası(% 62.1) fıkhi tabirler anlaşılır yazılmadığı için ilgi duymamaktadır. öğrencilerin büyük çoğunluğu {% 82) dersi isteyerekokumaktadır, öğrencilerin yarıdan fazlasını {% 55) derste mutlu eden olay ibadetlerin yapılış şekillerini öğrenmele ridir, öğrencilerin büyük çoğunluğu {% 81) dersi kavramak tadır, üçte birinden fazlasına göre {% 39) sınıfların ka labalık oluşu basanlarını engellemektedir, öğrencilerin yarıya yakınına göre (% AA. 7) derste öğrenilen konular davranışlarında değişiklik meydana getirmektedir, öğrenci lerin yarıdan fazlasına göre (% 64.7) günlük hayatta kar şılaşılan problemlere fıkıh dersinde kısmen çözüm getiril mektedir. Sonuç olarak, fıkıh dersi programıyla ilgili çözülme si gereken pek çok problemin olduğu görülmektedir. Bu problemlerin çözümünde öğretmenlere, okul yöneticilerine. Milli Eğitim Bakanlığındaki ilgili mercilere önemli görev ler düşmektedir."
