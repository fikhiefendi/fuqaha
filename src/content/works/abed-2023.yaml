abstract: "Bu çalışma, hicri dokuzuncu sırda yaşamış olması dışında, hakkında pek bir bilgiye erişemediğimiz Şemsü'd-dîn Muhammed el-Mısrî eş-Şafii'nin; kıymetli eseri olan Al- Kasas ve Ankebût Sûrelerinin Tefsiri'nin tahkik ve değerlendirmesini içerir. Bu eserin pek çok önemli özelliğinin bulunması bizi bu çalışmayı yapmaya sevketti. Bunlardan ilki rivayet, dirayet ve işari tefsirlerinin üçünü de kullanmasıdır. İkincisi müellifin hadis, kıraat, nahiv, sarf, belagat, fıkıh gibi çeşitli kaynaklardan faydalanmasıdır. Müfessir eseri için belagat ve dilbilgisi kitaplarından faydalanmıştır. Kelimelerin sözlük anlamlarının farklılıklarıyla yetinmeyip lafızlar arasındaki delalet farklılıklarını da genişleterek açıklaması için dilbilgisine, belagata, irab ve kıraat çeşitlerine önem vermiş ve eserinde bunlardan istifade etmiştir. Müellif eserinde akidevi ve fıkhi meselelere kısaca değinmiştir. Müellif tefsirini sahabe, tabiin ve önemli alimlerin görüşleriyle desteklemiştir. Aynı şekilde ayetlere mana verirken zayıf olduğunu bildiği hadisleri de kullanmıştır. Bu eserin tahkiki ve tahlilinde tercihli metin yöntemi tercih edildi. Ayrıca, müellifin zati ve ilmi şahsiyetini tanıtmak için açıklayıcı tarih metodunu kullanmıştır. Ayrıca; a) Eser yazıya geçirilirken modern yazım kuralları esas alındı. b) Nüshalar arasındaki farklılıklar ortaya kondu. c) Metinde atıfta bulunulan Hz. Peygamber'in, sahabenin, tabiinin, müfessirlerin, fakihlerin, muhaddisler ve dilcilerin ifadelerinin hangi eserde geçtiği dipnotlarda belirtildi. d) Anlamı kapalı olan bazı konular mümkün olduğunca açıklanmaya çalışıldı. Müellifin kelimelerin sözlük anlamlarının farklılıklarını açıklamakla iktifa etmeyip lafızlar arasındaki delalet farklılıklarını da genişleterek açıklaması bu eseri değerli kılan hususlardandır. Ancak Kurtubî, Beyzâvî ve başka müfessirler ve ilim adamlarından çokça alıntılar yapmış olmasına rağmen, onlara atıfta bulunmaması esere yöneltilebilecek eleştiriler arasında yer alır. Bu durum; bizi eserde yer alan görüşlerin izini sürmeye sevketti. Tahkik kısmından sonra sonuç bölümü, fihrist ve özgeçmiş yazılarak tez tamamlandı."
