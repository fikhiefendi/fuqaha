abstract: "?İslam Yargılama Hukukunda Hâkim? adlı bu çalışma `Giriş' ve `Sonuç' dışında üç bölümden oluşmaktadır.Giriş kısmında; tezin konusu, amacı, önemi ve sorumluluğu ile araştırmada ele alınan yöntem hakkında bilgi verilmiştir.Birinci bölümde; Fıkıh literatüründe hâkim ve hâkimde bulunması gereken şartlar konusu ele alınmış, bu bağlamda hâkim kelimesinin tanımı ve hâkimde bulunması gereken şartlar hakkında bilgi verilmiştir.İkinci bölümde ise; hâkimlik mesleğinin usul ve esasları konusu incelenmiştir. Bu bölümde öncelikle hâkimlik mesleğinin usul ve esasları konusu işlenerek, bu bağlamda hâkimlerin bu görevi yürütürken genel olarak takınmaları gereken durumlar hakkında bilgi verilmiştir. Örneğin günümüzde de oldukça dikkat çeken hâkimin hediye kabul etmesi, davetlere katılması, yargılama esnasında taraflara eşit davranması gibi konular bu bölümde işlenmiştir. İkinci olarak da yargılamanın usul ve esasları konusu işlenerek bu kapsamda gerek yargı yeri, gerek mahkemede hâkimin yardımcıları, gerekse hâkimin yargılama esnasındaki ruhi durumu gibi konular hakkında bilgi verilmiştir.Üçüncü bölümde ise; yargılama usulü açısından hâkim konusu işlenerek bu açıdan hâkimlik mesleğinin içeriği hakkında bilgi verilmiştir. Bu kapsamda hâkimlerin tayinleri, azilleri, görevleri ve kendisine gelen davalar hakkında yapmakla yükümlü olduğu görevler konusu işlenmiştir. Bunların yanında hâkimin, hüküm bildirirken dayanakları ve taraflara karşı görevleri konusu hakkında da bilgi verilmiştir."
