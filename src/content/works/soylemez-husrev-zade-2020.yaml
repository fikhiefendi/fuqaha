abstract: "Hüsrev-zâde Ömer Sabrî'nin Nasîhat-nâme adlı manzum eseri, dinî-fıkhî bir nasîhat-nâmedir. 19. yüzyılda kaleme alınan eser, genel olarak Allah, Hz. Muhammed, sahabeler, ibadetler, ilmihal bilgileri, tevbe, ahiret gibi konuları içerir. Bunun yanı sıra eserde tasavvufî muhtevaya da rastlanmaktadır. Eser hakkında tespit edilen herhangi bir çalışma bulunmamaktadır. Eserde müellifin ismi geçmekte fakat hayatına dair bir bilgiye rastlanmamıştır. Giriş, iki bölüm ve sonuçtan müteşekkil çalışmanın giriş kısmında eserin türü, nüsha ile ilgili bilgiler ve Türk edebiyatında nasîhat-nâmeler gibi konular üzerinde durulmuştur. Birinci bölümde, eser dinî muhteva yönünden incelenmiş; ikinci bölümde ise eserin çeviriyazılı metni verilmiştir. Sonuç bölümünde ise eserle ilgili değerlendirmelerde bulunulmuştur."
