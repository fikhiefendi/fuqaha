abstract: "Kazakistan, Orta Asya'da İslami finans sektörünü geliştirmeyi hedefleyen önde gelen ülkelerden biridir. 2009 yılından itibaren, bu alanda çeşitli yasal düzenlemeler ve kurumlar oluşturulmuş, ülke İslami finansın gelişmesine yönelik önemli adımlar atmıştır. Kazakistan'daki İslami finans kurumları, İslam hukuku ilkelerine uygun hizmetler sunmakta olup faizsiz bankacılık ve finansal ürünler sağlamaktadır. Ülkedeki İslami finans sektörünün önde gelenleri, İslami bankacılık, İslami leasing ürünleri sunan kurumlar olup her biri faaliyetlerini İslam hukuku kuralları çerçevesinde yürütmektedir. Kazakistan'da faaliyet gösteren İslami finans kurumları arasında Al Hilal İslam Bankası A.Ş., Zaman-Bank İslam Bankası A.Ş. İslami esaslara dayalı bankaları ve İslami leasing şirketleri yer almakta ve bu kurumlar, sunmuş oldukları ürünlerin İslam hukukuna uygunluğunu sağlamak için sürekli İslam hukuku denetimlerinden geçmektedir. Ayrıca, İslami finans ürünlerinin daha etkin ve yaygın kullanılabilmesi için İslam hukuku danışmanlık ve denetim mekanizmaları oluşturulmuş, ancak bu alandaki gelişmelerin artan bir şekilde izlenmesi ve düzenlenmesi gerektiği görülmüştür. Kazakistan, İslami finans sektörünün gelişimine yönelik oluşturduğu yapısal ve yasal altyapı ile bölgedeki lider ülkelerden biri olma amacını taşırken, İslami finansın daha da yaygınlaşması için kurumlar arası iş birliği, eğitim ve farkındalık çalışmalarının güçlendirilmesi önemlidir."
