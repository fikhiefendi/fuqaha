abstract: "Osmanlı Devleti, kurulduğu 1299 yılından itibaren sona erdiği tarihe kadar temel itibariyle İslâm hukuku hükümleri çerçevesinde idare edilmiş bir devlettir. İlmiye teşkilâtının başı olan ve devlet protokolünde önemli bir konumda bulunan şeyhülislâmların kendilerine sorulan sorulara verdikleri cevapların yani fetvaların, -Osmanlı Devleti'nin idarî yapısını ve toplumunun sosyal ve iktisadî yaşantısını aksettirmesi bakımından- çok önemli tarihî belgeler olduğunda her hangi bir şüphe bulunmamaktadır. Doktora tezinin konusu,“XVIII. Yüzyılda Yayımlanmış Fetva Mecmualarına Göre Osmanlı'da İktisadî Hayat”tır. Bu araştırmada, Şeyhülislâm Çatalcalı Ali Efendi (ö.1103/1692), Şeyhülislâm Feyzullah Efendi (ö.1115/1703), Şeyhülislâm Menteşzâde Abdürrahim Efendi (ö.1128/1716), Şeyhülislâm Abdullah Efendi (ö.1156/1743) ve Şeyhülislâm Dürrizâde Mehmed Ârif Efendi (ö.1215/1800) gibi şeyhülislâmların fetvaları ışığında XVIII. yüzyılda Osmanlı'nın iktisat anlayışı ve faaliyetleri belirlenmeye çalışılmıştır. Osmanlı'da ekonomi;“tarım ve hayvancılık”,“sanayi”ve“ticaret”olmak üzere üç temel üzerine kurulmuş ve Osmanlı Devleti'nin kendine özgü bir iktisadî hayatı mevcut olmuştur. Bu tezde, XVIII. yüzyılda yayınlanmış şeyhülislâm fetvalarından hareketle, bu asırda Osmanlı Devleti'nde tarımsal üretimin tarafları olan reâyâ ile askerî sınıfın yani sipahilerin ilişkileri, toprak sistemi ve ziraî üretim, timar sistemi, İslâm medeniyetinde özellikle sosyal hizmetlerin görülmesi anlamında özel bir yeri olan vakıf müessesesi, esnaf teşkilâtının yapısı, esnaf birlikleri, sınaî üretim, devlet hazinesinin temel girdisi olan vergilerin tarh, tahsil ve sarf yerleri, iç ve dış ticaret, ticarî, sınaî ve ziraî şirket nevileri, bir ödeme aracı olan para, finans ve kredi sistemleri incelenmiştir."
