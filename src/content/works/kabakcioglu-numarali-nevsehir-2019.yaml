abstract: "Osmanlı Devleti'nin önemli kültür miraslarından biri olan şer'iyye sicilleri, muhtevalarının zenginliği itibariyle, hemen her konuda kaynak olma özelliğine sahiptir. Dolayısıyla şehir tarihleri ve mahallî hayata dair incelemelerde araştırmacılara sağlam ve zengin bilgiler sunmaktadırlar. Şer'iyye sicilleri incelendiğinde halkın hayat şartlarını, toplumsal ilişkilerini, kullanılan her türlü eşyayı, geçim kaynaklarını, nüfus yapısını, devlet hizmetleri gibi pek çok konu hakkında somut veriler elde edilmektedir. Bu çalışmada, Ankara Milli Kütüphane envanterinde kayıtlı 5 Numaralı Nevşehir Şer'iyye Sicili (H. 1242-1248/ M. 1827-1833) incelenerek, 1827-1833 tarihleri arasında Nevşehir'in ekonomik, sosyal, idari ve kültürel hayatının aydınlatılmasını sağlamak ve şehir tarihi araştırmalarına katkıda bulunmak amacıyla transkripsiyon, tahlil, tasnif ve değerlendirmeler yapılmıştır. Anahtar Kelimler: Şer'iyye Sicili, Kadı, Nevşehir, Osmanlı, Şehir Tarihi."
