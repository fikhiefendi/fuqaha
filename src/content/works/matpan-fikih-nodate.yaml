abstract: "Bu çalışma, fıkıh usûlü ile belâgat ilimlerinin bir alt disiplini olan meânî arasındaki ilişkiyi Ekmelüddin el-Bâbertî örneği üzerinden incelemeyi amaçlamaktadır. İslâmî ilimlerin temel hedefi olan Kur'ân ve Sünnet'in doğru anlaşılması sürecinde lafız-anlam ilişkisi merkezi bir konumda yer almakta; bu ilişki hem fıkıh usûlü hem de meânî ilmi tarafından farklı perspektiflerden ele alınmaktadır. Tezin temel iddiası, meânî ilminin fıkıh usûlünü etkilediği gibi, fıkıh usûlünün de meânî ve belâgat ilimlerini etkilediği; hatta bazı durumlarda fıkıh usûlünün, belâgat âlimlerinin ele almadığı meseleleri daha sistematik biçimde incelediğidir. Bu bağlamda çalışmada, Bâbertî'nin söz konusu etkileşimi her iki disipline ait eserlerinde ne ölçüde ve nasıl uyguladığı incelenmektedir. Böylece, iki disiplin arasındaki ilişkinin tek yönlü değil, çok yönlü ve dinamik bir etkileşim niteliği taşıdığı ortaya konulmaktadır. Bu araştırmada nitel araştırma yöntemlerinden doküman analizi benimsenmiştir. Bu çerçevede fıkıh usûlü ve meânî ilmine dair klasik kaynaklar ile Bâbertî'nin her iki alana ait eserleri sistematik biçimde incelenmiş; elde edilen veriler karşılaştırmalı bir perspektifle değerlendirilerek iki disiplin arasındaki kesişim ve ayrışma noktaları tespit edilmeye çalışılmıştır. Bu amaçla müsned–müsnedün ileyh, haber–inşâ, emir–nehiy, umûm–husûs, mefhûm, hasr, istisnâ ve tearuz–tercih gibi her iki disiplinin ortak inceleme alanına giren meseleler ekseninde söz konusu ilişki analiz edilmiştir. Çalışma sonucunda, fıkıh usûlü ile meânî ilmi arasında karşılıklı bir etkileşim bulunduğu; bu etkileşimin yalnızca meânî ilminin fıkıh usûlü üzerindeki etkisiyle sınırlı kalmayıp fıkıh usûlünün de meânî literatürünü besleyen bir kaynak işlevi gördüğü tespit edilmiştir. Ayrıca Bâbertî'nin, her iki disiplini birlikte kullanan yaklaşımıyla bu etkileşimi sistematik biçimde yansıttığı sonucuna ulaşılmıştır."
