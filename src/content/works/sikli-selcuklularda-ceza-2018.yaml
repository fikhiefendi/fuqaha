abstract: "Tez konusu olarak suç ve cezayı seçmemizin sebebi, suç ve ceza tarihinin insanlık tarihi kadar eski olması, ayrıca suç ve cezanın toplum kültürüyle yakından ilişkili olmasıdır. Suç ve ceza, insanların ilk yaşayış şekli olan kabileler halinde yaşam ile birlikte tarihin hukuk literatüründe yerini almış kavramlardır. Disiplinler arası yöntemi benimseyerek oluşturduğumuz çalışmamız giriş ve girişe ek olarak üç bölümden oluşmaktadır. Giriş bölümünde suç ve cezanın dünya tarihi ve Türk tarihi açısından gelişimi ele alınmıştır. Yine bu bölümde, Selçuklu hukuku analiz edilmiştir. Daha sonra Büyük Selçuklu ve Anadolu Selçuklu'nun suç ve cezaya yönelik hukuki uygulamaları, 'Islaha Yönelik Cezalar', 'Bedene Yönelik Cezalar', ve 'Konularına Göre cezalar' şeklinde bölümlenerek, her bir başlık sırasıyla diğer bölümlere dağıtılmış ve her bir bölümde Büyük ve Anadolu Selçuklu'nun cezaî uygulamaları örneklerle incelenmiştir. Selçuklu hukukunun nasıl oluşturulduğu konusu tartışmalı bir konudur. Bir kısım tarihçiye göre Selçuklu hukukunda İslam tesiri bulunmamaktadır. Diğer kısma göre ise Selçuklu hukukunda İslam tesirini yok saymak, gerçekleri göz ardı etmekten öteye gitmeyecek bir söylemdir. Biz araştırmalarımız neticesinde literatürdeki kaynaklarda Selçuklu'nun hukuk uygulamalarında, İslam ceza hukuku kaidelerine pek az rastladık. Bu bakımdan şu çıkarımı yapmak sanıyoruz doğru olacaktır: Selçuklu hukukunda İslam tesiri olmakla birlikte pratikte daha çok örfi hukuka yer verilmiştir. Ancak Moğol ordusunun Anadolu'da yaptığı tahribattan ötürü literatürde pek kaynağın olmayışı ve de Selçukluların var olduğu zaman diliminde sosyal tarih anlayışı henüz gelişmediğinden devletin halka nasıl cezalar tatbik edildiği bilgisine pek ulaşılamamıştır. Bu nedenle Selçuklu hukukunun kapsamıyla ilgili net bir genelleme yapmak pek mümkün görünmemektedir. Bu sebeple konu, tarihçiler arasında tartışma olarak kalacak gibi görünmektedir. Selçukluların hukuk alanına yönelik tarih literatüründe pek fazla kaynak olmamasına rağmen faydalı olacağını düşündüğümüz derli toplu bir çalışma yaptığımıza inanıyoruz. Yaptığımız bu çalışma, akademik dünyaya katkı sağlamış olduğunda amacımız vasıl olacaktır."
