abstract: "Osmanlı Devleti'nin sosyo-kültürel ve ekonomik hayatının incelenmesinde birincil kaynaklardan biri de Şer'iyye Sicillerinin içerisinde bulunan tereke kayıtlarıdır. Bu kayıtlar tereke sahiplerinin her türlü taşınır ve taşınmaz malları ile birlikte alacak ve verecek borçları gibi sosyal ve ekonomik hayata dair bilgiler vermektedir. Yapılan çalışmada 1855-1856 yılları arasında yazılan 118 numaralı Manastır Şer'iyye Sicili içerisinde kaleme alınan 134 tereke kaydı incelenerek tasnif edilmiş ve hakkında bilgiler verilmeye çalışılmıştır. Çalışma üç bölümden oluşmaktadır. Birinci bölümde tereke belgelerinin tarihsel süreci, önemi anlatılmış ve 118 Numaralı Manastır Şer'iyye Sicili detaylı incelenerek içeriği hakkında bilgiler verilmiştir. İkinci bölümde sicil içerisinde bulunan belge türleri ikiye ayrılmıştır. Birinci başlıkta tereke kayıtlarının kimlere ait olduğunu anlatan tabloyla başlangıç yapılarak, tereke sahipleri hakkında bilgiler verilmeye çalışılmıştır. Daha sonrasında tereke kayıtlarında yazılan Manastır'ın kazaları, mahalleleri ve köyleri, kişi isimleri ve meslekleri anlatılmaya çalışılırken tablolar da eklenerek daha ayrıntılı bilgiler verilmeye çalışılmıştır. Kayıtlarda kaleme alınan eşyalar türlerine uygun başlıklara ayrılmış haklarında bilgiler verilmeye çalışılmıştır. İkinci başlıkta narh belgeleri hakkında bilgi verilerek sicil içerisinde bulunan örnekleri anlatılmıştır. Üçüncü bölümde 118 Numaralı Şer'iyye Sicili basit transkripsiyon usulüne uygun yapılarak belgeleri numaralandırılmış ve tarihlendirilerek yazılmıştır."
