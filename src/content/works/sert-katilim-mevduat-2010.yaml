abstract: "Örgütsel bağlılık, işgörenin, örgüt amaç ve değerlerini benimsemesi, bu amaçlara ulaşmak için kendisinden beklenenden daha fazla çaba sarf etmesi ve örgüt içindeki varlığını sürdürmeyi istemesi olarak tanımlanabilmektedir. Diğer bir ifadeyle, örgütsel bağlılık, işgörenle örgüt arasında oluşan ve işgörenin örgütten ayrılma olasılığını azaltan psikolojik bir bağdır. Araştırmacılar, örgütsel bağlılıkla ilgili olarak farklı sınıflandırmalar yapmışlardır. Genel olarak örgütsel bağlılık duygusal, zorunlu ve normatif bağlılık boyutlarında ele alınmaktadır. Duygusal bağlılık, işgörenin kendisini örgütüyle özdeşleştirerek, örgütün üyesi olmaktan mutluluk duymasıdır. Zorunlu bağlılık, işgörenin örgütten ayrılmanın maliyetinin yüksek olacağını düşünerek ve örgütte kalmasının daha avantajlı olacağını hesaplayarak örgütte kalmaya devam etmesidir. Normatif bağlılık ise, işgörenin örgütte kalmak için yükümlülük hissetmesi sebebiyle örgütüne karşı duyduğu bağlılıktır.Bu çalışmanın amacı, katılım bankalarında çalışanların örgütsel bağlılıklarının mevduat bankalarında çalışanlarla karşılaştırılmasıdır.Araştırma, katılım ve mevduat bankalarında çalışanlara anket yöntemi uygulanarak yapılmıştır. Örgütsel bağlılığın ölçülmesinde 1990 yılında Allen ve Meyer'in hazırlamış oldukları örgütsel bağlılık anketi kullanılmıştır. Anketi mevduat bankalarından 75 kişi ve katılım bankalarından 65 kişi cevaplandırmıştır. Verilerin analizinde SPSS programı kullanılmıştır.Anketin analizi sonucunda, katılım bankalarında çalışanların duygusal ve normatif örgütsel bağlılıklarının, mevduat bankalarında çalışanlara göre daha yüksek olduğu ortaya çıkmıştır. Zorunlu bağlılık açısından ise istatistiksel olarak anlamlı bir farklılık bulunmamıştır.Çalışmanın birinci bölümünde örgütsel bağlılık kavramı tanımlanarak, örgütsel bağlılık sınıflandırmaları ile ilgili bilgi verilmektedir. Daha sonra örgütsel bağlılığı etkileyen kişisel, örgütsel ve örgüt dışı faktörler ile örgütsel bağlılığın sonuçları üzerinde durulmuştur. Son bölümde ise mevduat ve katılım bankalarında çalışan personelin örgütsel bağlılık düzeyleri arasında fark olup olmadığı araştırılmış ve sonuçlara yer verilmiştir."
