abstract: "İslam yargılama hukukunda“beyyine”bir davanın ispatını sağlayan kuvvetli delil anlamına gelmektedir. İslam hukukuna bağlı olarak işleyen Osmanlı mahkemelerinde anlaşmazlıklar, tarafların iddialarına dayanak olarak sundukları beyyineler ile çözüme ulaştırılmıştır. Bu beyyineler ile ispat mevcut durumun aksini iddia eden davacının (müddeî) yükümlülüğü iken davalının (müddeâ aleyh) yemini, iddiayı red için yeterli kabul edilmiştir. Bununla birlikte dava sürecinde iddianın karşılıklı olarak değişmesine bağlı olarak tarafların her ikisinin de beyyine sunduğu durumlar ortaya çıkmıştır. Bu durumlar karşısında bazen beyyinelerin her ikisi ile birlikte amel edilmiş bazen ise beyyinelerin her ikisi de düşmüştür. Bazı durumlarda ise beyyinelerden biri diğeri üzerine tercih edilmiştir. Bu son durumda hangi beyyinenin diğerine göre tercihe şayan olduğu hususu muteber fıkıh kitaplarında beyan edilmekle birlikte ayrıntılı ve ihtilaflı noktalar içermesi sebebiyle konuya özel bazı eserler telif edilmiştir. Bu çalışma, 16. yüzyıl sonları ve 17. yüzyıl başlarında Bağdat'ta yaşayan Hanefî fâkih Gānim el-Bağdâdî'nin, dönemin kadılarına kolaylık sağlamak amacıyla, Hanefî mezhebinin meşhur kitaplarından hareketle yazdığı“Melceʾü'l-kudât ʿinde Teʿâruzi'l-beyyinât”(Beyyineler Çatıştığında Kadıların Sığınağı) isimli risâlesini merkeze alarak Osmanlı yargılama hukukunda beyyinelerin çatışması durumunda hangi beyyinenin tercih edilmesi gerektiği konusunu ele almaktadır. Bu bağlamda çalışmamızda beyyinelerin tercihine dair Hanefî doktrininden yola çıkılarak elde edilen ilkelerle, klasik Osmanlı döneminin hukuki ve içtimai ortamını yansıtan şeyhülislam fetvalarının uyumluluğunun tespiti amaçlanmıştır. Bu amaçla öncelikle Melceʾü'l-Kudât isimli risâle çerçevesinde beyyinelerin tercihi konusu ele alınacak, devamında bu risâlede tespit edilebilen tercihe dair bazı kurallar, farklı dönemlerde yaşamış şeyhülislamlar tarafından verilen fetvalar ve kadı sicilleri ile karşılıklı olarak incelenecektir."
