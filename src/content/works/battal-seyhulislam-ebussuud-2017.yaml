abstract: "Kozmopolit bir yapıya sahip bir İslam devleti olan Osmanlı İmparatorluğu'nda zımmîlerin statüleri ve nasıl bir muameleye maruz kaldıkları, yıllarca çeşitli belgeler üzerinden incelenmiştir. Osmanlı hukuk sisteminin en önemli kaynaklarından olan fetvalar, zımmîlerin statüleri hakkında önemli ipuçları veren bu belgelere örnektir. Bu çalışmada, Osmanlı Devleti'nin en parlak döneminde şeyhülislamlık görevini ifa eden Ebussuûd Efendi'nin zımmîlerle ilgili olan fetvaları, kendilerine ne derece adil davranıldığı ve İslam hukukuna ve İslam hukukunun kendilerine sağladığı olanaklara ne derece bağlı kalındığı dikkate alınarak incelenmiştir. Bu hususta önce İslam hukukunda, ardından klasik dönem Osmanlı hukukunda ve kanunnâmelerde zımmîlik statüsü incelenmiş, ardından fetva örnekleri sosyal yaşam, ekonomik yaşam ve medeni hukuk başlıkları altında yorumlamıştır. Anahtar Sözcükler Osmanlı İmparatorluğu , Zımmî , Hukuk , Fetva ,Ebussuûd"
