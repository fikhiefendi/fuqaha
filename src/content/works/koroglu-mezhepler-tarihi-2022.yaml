abstract: "Hicri birinci ve ikinci asır pek çok ilmi, mezhebi, dini ve siyasi hareketlerin zuhur ettiği dönemdir. Yaşanan dini ve siyasi hareketler neticesinde Mu'tezile, Hariclik Mürcie ve Şîa gibi mezhepler ortaya çıkmıştır. Biz araştırmamızda Şîa mezhebinin önemli gördüğü bir sima olan Ebû Câfer Muhammed Bâkır'ı ele alacağız. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş bölümünde izlenilen metoda, kullanılan kaynaklara ve Muhammed Bâkır'ın yaşadığı döneme kısaca yer verilmiştir. Birinci bölümde onun ilmi, sosyal ve siyasi hayatına yer verilmiştir. O siyasetten ziyade ilmi çalışmalarıyla ön plana çıkmıştır. Döneminde meydana gelen karışıklıklarda hiçbir şekilde yer almayıp kendini ilme vermiştir. Muhammed Bâkır'ın Ebû Hanîfe ile olan ilişkisi, hadis, tefsir ve fıkıh ilmindeki yeri,alimlerin özellikle kaynaklarda onun rivayetlerinden yararlanması da değerlendirmeye çalıştığımız konulardır. Ayrıca onun ders aldığı diyebileceğimiz hocaları ve öğrenci silsilesi hakkında bilgi verdik. İkinci bölümde bedâ, takiyye, imamet, rec'at sahabe, mehdîlik gibi konulardaki görüşleri değerlendirildi. O gulât fırkaların aşırı fikirlerinden uzak kalmış hatta ona mehdîlik, rec'at kendisine özel mana atfedenleri lanetlemiştir. Yine tevhid, nübüvvet, Kur'an, kader ve iman konuları hakkındaki görüşleri değerlendirilip onun Şiilikten uzak Medine ehline yakın olan fikirleri ortaya çıkarılmaya gayret edilmiştir."
