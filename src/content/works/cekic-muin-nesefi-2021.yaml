abstract: "Bu çalışmada, Hanefî-Mâtürîdî kelâm anlayışının önemli temsilcilerinden kabul edilen Ebü'l-Muîn en-Nesefî (öl. 508/1115) ile Ebû İshak es-Saffâr'ın (öl. 534/1139) iman anlayışları incelenmiştir. Nesefî'nin Tebsıratü'l-edille fi usûli'd-dîn ve Saffâr'ın Telhîsü'l-edille li-kavâidi't-tevhîd adlı hacimli kelâm eserleri bulunmaktadır. Çalışma, Nesefî ve Saffâr'ın iman anlayışlarını bu eserler kapsamında tespit etmeyi, incelemeyi ve mukayese etmeyi amaçlamıştır. Giriş ve üç ana bölümden oluşan çalışmanın giriş kısmında araştırmanın konusu, önemi, amacı, yöntemi ve kaynakları hakkında bilgiler verilmiştir. Birinci bölümde Nesefî ile Saffâr'ın hayatları ve ilmî kişilikleri tanıtılmıştır. İkinci bölümde iman konusuyla ilgili imanın tanımı, iman-amel ilişkisi, imanın artıp-azalması, iman-islâm münasebeti ve imanın mahlukiyeti gibi kelâmî tartışmalara değinilmiş ve kelâm mezheplerinin bu konulardaki görüşleri incelenmiştir. Son bölümde Nesefî ile Saffâr'ın iman anlayışları günümüze ulaşan eserleri üzerinden tespit edilmiş, irdelenemiş ve görüşlerindeki benzerlik ve varsa farklılıklar tespit edilmiştir. Sonuç bölümünde ise araştırma neticesinde ulaşılan bilgiler paylaşılmıştır."
