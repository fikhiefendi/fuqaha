abstract: "Biz bu çalışmada manası açık lafızlardan nassın ve kapalı lafızlardan müşkilin tarihsel kavram analizini ve furu' fıkıhtaki örnekler üzerinde makâsıd ile irtibatını kurmaya çalıştık. Bu iki kavramın yanı sıra lafızların mana ile irtibatı bulunan diğer lafızlara da kısaca değindik. Çalışmamızda nass kavramının, birçok kullanımı ile karşılaşsak da, fıkıh usûlündeki kullanımını esas aldık. Müşkil lafzın anlam alanını ve işkâl sebeplerini tespit ederek bunlara çözüm oluşturacak metodları inceledik. Ayrıca bu iki kavramın te'vil ile irtibatını ve alanını saptamaya çalıştık. Ele aldığımız kavramların fukaha ve mütekellim usûlcüleri nezdinde karşılığını kavramaya çalıştıktan sonra furu' fıkıhtaki karşılığını ve dinin ana ruhunu yansıtan makâsıd ile irtibatını kurmaya gayret ettik."
