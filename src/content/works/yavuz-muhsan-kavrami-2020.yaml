abstract: "Kale gibi korunmuş, muhafaza edilmiş kök manasına gelen,“حصن ”kökünden türeyen bir kelime olan“muhsan”Kur'an-ı Kerim'de bu şekliyle mecaz manasında kullanılmış olup, hem iffetin korunmasını, hem bu korumayı sağlayan evlilik ve hür olma durumlarını ifade eden bir tabirdir. Bu çalışmanın birinci bölümde kelimenin kavramsal çerçevesi, lügat ve ıstılah manaları ve ilişkili olduğu kavramlar ele alınmıştır. İkinci bölümde, tefsirlerde kelimenin yukarıda bahsedilen manalarından hangisinin tercih edildiğinin, tercih farklarının ortaya çıkardığı sonuçların, bu sonuçlarla bağlantılı olarak yapılan tartışmaların izi sürülmeye çalışılmıştır. Her ne kadar birkaç ayette kelime kök manasıyla ilişkili olarak kullanılmış olsa da bunlar“muhsan”formunda yani ism-i mef'ul kalıbında değildir.“Muhsan”kalıbında kullanıldığı yerler iffetin korunması ile ilgili olup bunun sonucu olarak da evlilik hukuku ve namus iftirası ile ilgili konulardan bahsedilmektedir. Evlilik hukuku ile ilgili evli/bekar olma, hür/cariye olma, kitabi/ümmi olma, iffetli/iffetsiz olma gibi temel tartışma konuları doğrudan muhsan kelimesine verilen anlam ile alakalı olduğundan kelimenin geçtiği ayetlerin bu anlam odaklarına göre gruplanarak incelenmesi uygun görülmüştür. Bu açıdan kavramsal çerçeveyi ortaya koyduktan sonra ikinci bölümde hür kadın manasında kullanımı ve iffetli kadın manasında kullanımı şeklinde temel bir ayrım yapılmıştır. Bununla ilgili nikâh hukukunu etkileyen cariye ve hür kadın arasındaki farklar, kitabî, ümmi ya da Müslüman olmanın evliliğe etkisi, evlilik tercihinde iffetin belirleyici olması gerektiği gibi detaylar alt başlıklarda yansıtılmaya çalışılmıştır. Bu tartışmalarda oldukça fazla yer tutan Ehl-i Kitabın tanımı ve kapsamı, Kuran'a göre kimlerin iffetli sayılıp sayılmayacağı, kölelik hukukunun evliliğe etkileri gibi konulara da kısmen değinilmek zorunda kalınmıştır. Evlilik hukuku Kur'an'da çok geniş ve detaylı yer kapladığından bu detaylara kavramın anlaşılmasını sağlayacak kadar yer vermek uygun görülmüştür. Daha sonra muhsan kavramının kullanıldığı, hem nüzul tarihi açısından hem fıkıh açısından Kur'an'da genişçe yer alan kazif haddi ile ilgili ayetler incelenmiştir. Kazf suçunun mağduru olanlar için muhsan tabirinin kullanılışı kelimenin iffetli vurgusuyla alakalı olduğundan kazifle ilgili detaylara yer verilmiştir. Ayrıca kazifle ilgili ayetlerin İslam tarihinde“ifk hadisesi”olarak bilinen olayla ilgili bir tarihsel iv zemine oturması muhsan kavramının somut karşılığını anlamak açısından önem arzettiğinden konu bu detayları da verilerek ele alınmaya çalışılmıştır."
