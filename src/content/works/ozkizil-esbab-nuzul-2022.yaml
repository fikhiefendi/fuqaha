abstract: "Bu çalışmada Medine döneminin sonlarına doğru nâzil olan Tevbe sûresinde geçen ahkâmın sebeb-i nüzûl ile ilişkisi incelenmiştir. Bir giriş ve üç böümden oluşan bu çalışmayla ilgili özet olarak şunlar söylenebilir. Giriş bölümünde çalışmanın temel ölçüleri, araştırmanın konusu, önemi, amacı, bu konuyla ilgili diğer çalışma ve eserler hakkında bilgi verilmiştir. Birinci bölümde sebeb-i nüzûlün tarifi, mahiyeti, tarihi, sebeb-i nüzûlle ilgili önemli ilkeler ve konuyla ilgili tartışmalı alanlarla sebeb-i nüzûl ahkâm ilişkisi ele alınmıştır. Bunlara ek olarak Tevbe sûresi hakkında temel bilgiler verilmiştir. Bu minvalde sûrenin isimleri, bölümleri, indiriliş tarihi ve tarihsel ortamı, başında besmele bulunmaması ile ilgili tartışmalar, Tevbe sûresinin öncesi ve sonrası ile ilişkisi ve münasebeti konu edilmiştir. İkinci bölümde Tevbe sûresinin omurgasını oluşturan konulardan cihâd ve münâfıklar konusu işlenmiştir. Bu vesileyle genel olarak cihâdın tanımı, çeşitleri, kapsamı, Hz. Peygamber zamanındaki aşamaları ve fiili olarak farz olduğu zamanı incelenmiştir. Bunun yanında fiilî cihâdın örneklerinden sayılan ve sûrede geniş bir şekilde değerlendirmesi yapılan Tebûk ve Huneyn cihadı işlenmiştir. Cihâdın yanında önemli bir yer tutan münâfıklar konusu da bu bölümde incelenmiştir. Nifâk ve münâfık kavramlarının semantik tahlilleri ele alınarak, münâfık kavramının Kur'an'da ilk kez kullanılmasıyla ilgili âyetler ve Kur'an'da münâfıkların özelliklerinin yanında, özel olarak Tevbe sûresinde geçen özellikleri sebeb-i nüzûl rivâyetleri ve ahkâm âyetleri bağlamında detaylı bir şekilde incelenmiştir. Üçüncü bölümde ise cihâdla irtibatlı olan ve İslâmî literatürde önemli yer tutan infâk ve diğer bazı konular hakkında bilgi verilmiştir. Bu minvalde infâk, zekât ve sadaka kavramlarının tanımları, önemleri ve nübüvvet dönemindeki aşamalarıyla infâkın yapılacağı kişiler ve yerler, özel olarak Tevbe sûresinde infâkla ilgili âyetler sebeb-i nüzûl rivâyetleri ve sözkonusu âyetlerin getirdiği hükümler çerçevesinde detaylı bir şekilde incelenmiştir. Bu bölümde infâk kavramının yanısıra, tevbe konusu ve tevbeleri kabul edilen üç kişinin kıssaları ile tevbelerinin kabul edilmesi için kendilerini mescidin sütunlarına bağlayan diğer kişilerin durumları, münâfıklar ve müşrikler için istiğfâr konuları ele alınmıştır. Bölümün sonunda ise mescidler ve antlaşmalarla ilgili âyetler ve sûrede geçen diğer bazı konular ele alınmıştır."
