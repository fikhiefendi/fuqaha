abstract: "Nikâh, İslam Hukukunun ortaya koyduğu şartlara uygun olarak erkek ve kadının hayatlarını birleştirmeleri hususunda yaptıkları akiddir. İslam nikâhı helal, nikahsız birlikteliği gayri meşru olarak addetmiş ve haram kılmış, nikâhı meşru bir zemine oturtmuştur. Burada amaç İslam'ın ana gayelerinden birisi olan neslin korunması, dolayısıyla da sağlıklı bir toplumun oluşturulmasıdır. Ailenin oluşumunda ilk basamağı teşkil eden nikâh akdinin bir takım hukuki sonuçları ortaya çıkmakta ve nikâh akdi taraflara bir takım maddi ve manevi sorumluluklar yüklemektedir. Erkeğe yüklenen mali sorumlulukların başında ise kadına verilmesi gereken mehir yer almaktadır. İslam öncesi hemen hemen tüm din ve toplumların kültürlerinde mehre benzeyen uygulamalara kaynaklarda rastlanmakla birlirkte, bu uygulamalar mehirden farklılıklar arz etmektedir."
