abstract: "Hasan el-Bennâ (1906-1949), tüm dünya ve özellikle İslam alemi için içtimai, kültürel ve hukuki alanlar başta olmak üzere her alanda gerçekleşen bir geçiş, arayış ve devrim döneminde yaşamıştır. Bu dönemde Müslümanların yaşadıkları buhranlara karşı birtakım çözüm önerilerinde bulunan Hasan el-Bennâ'nın fıkhi ve usuli görüşlerinin tespiti dönemin irdelenmesi açısından önemlidir. Bir ilim ve hareket adamı olarak Bennâ'nın eserleri incelendiğinde, onun fıkıh anlayışının selef-i sâlihîn düşüncesi ekseninde olduğu, ama aynı zamanda bu düşünceyi yenilikçi ve ıslahatçı bir yaklaşımla da desteklediği görülmektedir. Başta icmali deliller olmak üzere usuli kavramları açıklarken ümmetin birliğini sağlama amacı üzerinden görüşlerini belirtmesi, onun fıkıh düşüncesini inşa ederken usulde farklı bakış açıları geliştirdiğini göstermektedir. Özellikle Fıkıh Risâlesi adlı eserinde onun daha çok Kitâb ve Sünnete odaklandığı söylenebilir. Çünkü ona göre Batı'nın dayattığı modern ulusal devlet anlayışına karşılık farklı ırk ve mezheplerden Müslümanların birlik olabilmesi, bu iki asli delilin daha işlevsel hale gelmesine bağlıdır. Bennâ, kurumsal olarak Müslümanların anayasal sisteme geçmesinde Kur'an'ın etkin rol oynayabileceğini savunmuştur. Kur'ân'ın deliller hiyerarşisindeki konumu ona göre doğrudur ancak bu delil uygulanabilirlik bakımından tıpkı bir anayasa gibi toplumun her alanında işlevsel hale getirilmelidir. Böylece ümmetin içindeki ayrılıkların temel nedeni olan mezhebi taassup ortadan kalkabilecek ve selef-i salîhîn döneminde olduğu gibi Müslümanlar birleşerek tekrar güçlü hale gelebilecektir. Bu araştırmada, Hasan el-Bennâ'nın fıkhi düşüncesi yaşadığı dönemin kendi dinamikleri dikkate alınarak ele alınmaya çalışılacaktır."
