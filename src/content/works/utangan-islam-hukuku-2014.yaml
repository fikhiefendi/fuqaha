abstract: "Nikah; hukukî usullere ve şartlara uyarak evlenmek demektir. Başka yollarla ulaşılamayacak amaçlara hizmet etmesi ve insan neslinin devamını sağlaması bakımından aile önemli bir müessesedir. Kur'an ve Sünnete aile hayatının sağlıklı olabilmesi için evlilik müessesesi kurulmadan önce başlayan ve evlilik hayatı boyunca da devam eden bir takım ilkeler ve sorumluluklar koymuştur. Toplumun düzeninin sağlanması ve korunması için aile hayatında bu sorumluluklara riayet etmek gerekmektedir. Bu amaçla, nikahın tanımı, şartları ele alınmış ve nikah akdinin kadına yüklediği sorumluluklar islam hukuku açısından açıklanmaya çalışılmıştır."
