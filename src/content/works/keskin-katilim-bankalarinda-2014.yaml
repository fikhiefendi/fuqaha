abstract: "Faizsizlik prensibini benimseyen ve finansal ihtiyaçlarını bu ilkeler doğrultusunda gidermek isteyen halk katılım bankalarını tercih etmektedir. Her kurum gibi katılım bankalarının da topluma karşı kanuni ve sosyal sorumlulukları bulunmaktadır. Bu çerçevede kurumsal olmanın getirdiği sorumluluklar, finansal hizmetlerin dışında sosyal ve kültürel alanlara da katkı yapmayı gerektirmiştir. Kurumsal kimliklerin kültür ve sanatla desteklendiği projeler Kurumsal Sosyal Sorumluluk adıyla literatürde kendine yer bulmuştur. Bu çalışmada Katılım Bankalarının günümüze kadar yaptıkları sosyal sorumluluk projelerinden bahsedilmiş, bugünkü durumlarının bilimsel yöntem ve araştırma metodlarıyla bir fotoğrafı çekilmeye çalışılmıştır."
