abstract: "Bu çalışma İslam fıkhı ile ilgili sosyal hayatın önemli bir konusunu ele almıştır. Kolektif çalışma ve onun için çağdaş fıkıh hükümleri ile ilgilenirler ve kollektif çalışma, tek bir Müslüman milletin evlatlarının, fertlerin ve grupların işbirliği olduğu için, çalışmalarının bütünleştiği ve çabalarının birleştirildiği sürece birleşiktir. işlerinde samimiler ve yaklaşımlarında İslam'a aykırı hiçbir şey yok - rekabet edip düşman olmaları değil - ve her birey görüyor veya Her grup kendini var etme hakkı görüyor ve diğerlerinin gruptan ayrılmasına hükmediyor. Çalışma ayrıca, Müslümanların gayrimüslim dernek ve kuruluşlara katılmasının hükmünü açıklamak, gayrimüslim insani yardım kuruluşlarının hayır kurumlarına yaptığı yardımların hükmünü açıklamak ve hayır işlerinde haram paranın hükmünü açıklamakt Çalışma aynı zamanda bu özelliği İslam toplumlarında pekiştirmeyi ve şeriatın bunu nasıl teşvik ettiğini ve bunun için nasıl bir ödül verdiğini göstermeyi amaçlamaktadır. Ekip çalışması Allah'ın rızasını kazanmak, Müslümanlara güç ve şeref kazandırmak ve fert için emek tasarrufu sağlamakla sonuçlandığı için araştırma da önemli sonuçlar ve benzersiz faydalar ortaya koymuştur.Bu iş, yani onların işi kötülüğe değil takvaya dayalı olmalıdır."
