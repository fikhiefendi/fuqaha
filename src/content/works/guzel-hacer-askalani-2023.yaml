abstract: "Hadis usulü literatürü İbn Salâh (ö. 643) ile yeni bir merhaleye girmiştir. İbn Salâh sonrasında yazılan hadis usulü kitaplarının neredeyse tamamı İbn Salâh'a itimat etmektedir. İbn Hacer (852) , İbn Salâh'ın usul kitabına 40 nevi daha ekleyerek muhtasar bir kitap yazmıştır. Bu kitaba Nuḫbetü'l-fiker ismini vermiştir. 818 yılında bu esere müellifi tarafından Nüzhetü'n-naẓar fî tavżîḥi Nuḫbeti'l-fiker adında bir şerh yazılmıştır. Nuḫbetü'l-fiker'e kendisinden önce aralarında hoca-talebe ilişkisi bulunan Kemâleddin eş-Şümünnî (ö. 821) tarafından bir şerh yazılmıştır. Netîcetü'n-naẓar fî Şerḥi Nuḫbeti'l-fiker isimli şerhi kaleme alan Şümünnî, eserini İbn Hacer'e arz etmiştir. İbn Hacer yazılan şerhi pek beğenmemiştir ve Nüzhe'nin mukaddimesindeki ifade ile“evin sahibi evde olanı daha iyi bilir”diyerek kendi kitabına şerh yazmıştır. İbn Hacer'in ve Şümünnî'nin yazdığı şerhler muhteva açısından karşılaştırıldığında aralarındaki benzerlik göze çarpmaktadır. Bu benzerlik İbn Hacer'in teferrüt ettiği meselelerde de ortaya çıkabilmektedir. Bu durum iki şerh arasında mukayeseyi ve üzerine araştırma yapmayı gerekli kılmaktadır. Tezde iki alim arasındaki münasebet incelenecektir ve şerhler arasındaki bu benzerliğin sebebi aranacaktır."
