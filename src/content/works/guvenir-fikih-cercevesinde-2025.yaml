abstract: "Bu tezde İslam dünyasında şehir planlamasının önemine odaklanılmakta ve İslam hukukunun bu planlamadaki etkileri incelenmektedir. İslam şehirciliği, İslam'ın öğretileri doğrultusunda şekillenmiş olup, İslam öncesi ve sonrası dönemlerle karşılaştırıldığında farklı özellikler taşımaktadır. Bu çalışmada Batılı araştırmacıların İslam hukukunun şehir planlaması üzerindeki etkileri hakkındaki görüşleri de ele alınmış ve bu görüşler üzerinden İslam şehircilik anlayışının benzerlikleri ve farklılıkları ortaya konmuştur. İslam şehircilik anlayışını ortaya koymak üzere; İslam dünyasında şehirlerin dini, sosyal ve ticari merkezler olarak planlanması ve bu planlamanın İslam hukukuna dayalı prensiplerle şekillenmesi açıklanmıştır. İslam hukukunun şehir planlamasındaki etkilerini kabul eden ve etmeyen Batılı araştırmacıların görüşleri değerlendirilmiş, bu değerlendirmelerle İslam şehircilik anlayışının evrenselliği ve etkisi vurgulanmıştır. İslam ve Avrupa şehircilik yaklaşımları arasındaki benzerlikler ve farklılıklar ele alınmış, bu yaklaşımların şehirlerin şekillenmesindeki etkileri tartışılmıştır. Tarihi süreçte İslam şehirciliğini açıklamak üzere; İslam mimarisi ve şehircilik anlayışının tarihi süreçte nasıl geliştiği ve 18. yüzyıldan itibaren Avrupa şehircilik anlayışının benimsenme süreci ele alınmıştır. Bu sürecin İslam şehir kavramını nasıl tartışılır hale getirdiği anlatılmıştır. Bu tez, İslam şehircilik anlayışının derinlemesine incelenmesi ve İslam hukukunun şehir planlamasındaki etkilerinin daha iyi anlaşılması amacıyla genel bir çerçeve sunmayı hedeflemektedir."
