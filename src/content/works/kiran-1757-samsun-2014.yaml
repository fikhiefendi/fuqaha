abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de Şer'iyyeSicilleri'dir. Şer'iyyeSicilleri'nde, devlet merkezi ile olan yazışmalar, halk dilekleri, fermanlar, ilamlar, hüccetler, beratlar vs. gibi konulara ait bilgilerin yanı sıra, bölgede yetişen ürünler şehir ve kasabaların tahmini nüfusu, salgın hastalıklar ve aile hayatı gibi konular da bu defterlere kaydedilmiştir. Araştırma H. 1260 - 1285 / M.1845 - 1870 yıllarını kapsamaktadır. Çalışmamızın konusu olan 1757/3 Numaralı Samsun Şer'iyyeSicili'nin mikrofilmleri Milli Kütüphane'de bulunmaktadır. Söz konusu defterin mikrofilmi buradan alınmıştır. Bu çalışmayla 19. yüzyılın son döneminde Samsun bölgesinin dini, sosyal, ekonomik ve kültürel açıdan durumunun tespitine katkıda bulunmayı hedefledik. Tez, girişle birlikte üç bölümden oluşmaktadır. Giriş kısmında, araştırmanın problem ve önemi, veri toplama araçları, araştırmanın sınırlılıkları ile kullanılan yöntemler hakkında bilgi verilmiştir. İkinci bölümde,şer'iyye sicillerinin tanımı ve Samsun mahkemelerinde tutulan şer'iyye sicil defterleri ve bunlar üzerinde günümüze kadar yapılan çalışmalar belirtildikten sonra, 1757/3 Numaralı Samsun Şer'iyyeSicili'nde geçen kayıtlardan yola çıkarak, Samsun'un 19. yüzyıl sonlarındaki sosyal, kültürel, ekonomik ve idari yönlerden değerlendirmesi yapılmıştır. Ayrıca şer'iye sicilleri hakkında kısa bilgiler verilerek Osmanlı Tarihi hakkında önemi de belirtilmiştir. Çalışmaya destek olması bakımından Samsun'un kısa tarihi araştırılmış ve kültürel değerleri hakkında bilgi verilmiştir. Çalışmanın üçüncü bölümünde, 1757/3 Numaralı Samsun Şer'iyyeSicili'nin transkripsiyonu yapılarak kısa bir özeti verilmiştir. Sonuç kısmında incelediğimiz şer'iyye sicil defterinden çıkarılan sonuçlar kısaca belirtilmiştir. Araştırmanın ekler bölümüne orijinal belgeler konularak okuyucunun bilgi edinmesine çalışılmıştır."
