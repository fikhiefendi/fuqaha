abstract: "Abbasi Devletinin hayat bulduğu döneme tekabül eden IV/X. yüzyıllar,iktisadi gelişmede hem zirve, hem de gerilemenin başlangıcı olmuştur. Ticaretingelişmesine paralel olarak sarraflık-cehbezlik kurumlarının, sakk-süfteceuygulamalarının gelişimi, mali yapının zirveye ulaşmasını sağlamıştır. FakatBüveyhîlerin hâkimiyeti ele geçirmeleriyle birlikte iktisadi hayatın gelişimindesapmalar oluşmaya başlamış, para ve para kurumları zaafa uğramış, ticari faaliyetleryerini tarımsal faaliyetlere bırakarak ticari canlılık kaybolmuş ve bölgede yavaşyavaş askerî iktâ rejimi ortaya çıkmaya başlamıştır.Bu çalışma, paranın mübadele aracı olarak Abbasiler dönemindeki oluşumu,yapısı, işleyiş şekli ve kullanım alanları gibi konuları, 750-945 (Abbasi devletininkuruluşundan, Büveyhilerin hâkimiyetinin başlangıcı olan 945 yılına kadar) yıllarıarasına tekabül eden zaman dilimi esas alınarak hazırlanmış; fakat yeri geldiğince945 sonrası dönemlere de çeşitli atıflarda bulunulmuştur.Çalışma giriş ve sonuç dâhil olmak üzere dört bölümden oluşmaktadır.Birinci bölümde, takasının başlangıcından paralı ekonomiye geçişe kadar kimübadele süreci, para ve İslam tarihinde paranın geçirdiği süreç ele alınarak, paranındurumu hakkında genel bir çerçeve çizilmeye çalışılmış, yeri geldiğince fukahanınpara ile ilgili değerlendirmelerine yer verilmiştir. İkinci bölümde ise, altın-gümüşpara, mağşuş para ve felsler hakkında bilgi verilerek, Abbasi tarihinde paranın seyrihakkında bilgi sunulmaya çalışılmıştır. Yine bu bölümde, para ile ilgili konulardaAbbasi fukahasının görüşleri sunularak şer'i açıdan para olayları hakkındakideğerlendirmelere yer verilmiş, sonuç bölümüyle çalışma tamamlanmıştır."
