abstract: "Bu çalışma Şihâbüddîn es-Sühreverdî'nin usûl anlayışını konu edinmektedir. Şihâbüddîn es-Sühreverdî, sûfî ve filozof kimliği ile ünlenmiş, İşrâkî felsefe ekolünün kurucusu olarak adından çokça söz ettirmiştir. Sühreverdî'nin çalışmamıza konu olan tarafı ise; onun usûlcü kimliğidir. O, fıkıh usûlüne dair yazdığı“et-Tenkîhât fî usûli'l-fıkh”adlı eserinde ihtilaflı meselelere yer vermiş ve ekollerin bu meselelere sunduğu delilleri aktararak mantıkî bir bakış açısıyla cedel ve münazara yöntemini de kullanarak değerlendirmeye ve çoğunlukla meseleye dair kanaatini de ortaya koymaya çalışmıştır. Çalışmamız, giriş ve üç bölümden oluşmaktadır. Giriş bölümünde; tezin amacı ve önemi, tezin konusu, konunun sınırı ve tez çalışmasında uygulanan yönteme yer verilmiştir. Bunun yanı sıra Şihâbüddîn es-Sühreverdî'nin hayatı, şahsiyeti ve eserleri de giriş bölümünde ele alınmıştır. Tezin birinci bölümünde; deliller başlığı altında Şihâbüddîn es-Sühreverdî'nin Kitâb, Sünnet, İcmâ, Kıyas, İstihsân, İstishâb, Sahâbî Kavli ve İstislâh delillerine bakış açısı incelenmiştir. İkinci bölümde, Sühreverdî'nin istinbât teorisi ele alınmış ve bu kapsamda; âm ve hâs, istisnâ ve takyîd, nesih, mücmel-mübeyyen gibi elfâz konularına yer verilmiştir. Üçüncü bölümde, Sühreverdî'nin İçtihad ve Taklîd konusundaki yaklaşımı incelenmiştir. Sühreverdî'nin usûl anlayışına ve kimliğine dair genel tespitlere ise sonuç bölümünde yer verilmiştir. Çalışmamızda, Sühreverdî'nin aslî delillerin tamamını ve ihtilaflı ferʻi delillerden istishâb ve istislâhı hüccet kabul ederken; sahâbî kavli ve istihsânı hüccet kabul etmediği, içtihad konusunda ise musavvibe taraftarı bir tutum sergilediği tespit edilmiştir."
