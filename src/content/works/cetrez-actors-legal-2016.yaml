abstract: "Etik değerlere dayalı yeni örgütsel biçimlerin nasıl şekillendiğine odaklanan bu çalışmada, Türkiye'de katılım bankacılığının ve organik tarımın başlangıçlarından itibaren otuz yıllık süreçleri tümevarım kalitatif çalışma yöntemi ile incelenmiş ve katılım bankacılığının ve organik tarımın nasıl kavramsallaştığı, kanunlarla nasıl tanımlandığı ve çeşitli aktörlerce nasıl anlaşıldığı ve anlatıldığı araştırılmıştır. Çalışma sonucunda, katılım bankacılığında İslam Hukukuna dayalı bir ideal banka ve ekonomi anlayışının ve organik tarımda Doğanın işleyiş kanunlarını temel alan bir ideal tarım ve üretim anlayışının bu iki endüstrinin şekillenmesindeki çok boyutlu rolleri bulunmuştur. Her iki endüstride de uygulamaların, tanımların ve benimsenen etik değerlerin ideal modellere uygunluğu, bir başka ifadeyle otantikliği hem şekilleri hem maksatları yönünden tartışılagelmiş ve ideal modellerin kendileri ve dayandığı temeller de bu tartışmalara konu edilmiştir. Çeşitli aktörlerin dahil olduğu bu tartışmalar hem katılım bankacılığında hem organik tarımda uygulamaları ve kanuni süreç ve tanımları etkilemekle kalmayıp, ideal modellerin de zamanla daha ayrıntılanmasına katkıda bulunmuştur. Uygulamalar, tanımlar ve bunları ideal modellere uyumlu kılma çabaları arasındaki ilişkileri ortaya koyan bu çalışma, otantisite kaygısının etik değerlere dayalı yeni örgütsel biçimlerin şekillenmesindeki rolününün anlaşılmasına katkıda bulunmaktadır."
