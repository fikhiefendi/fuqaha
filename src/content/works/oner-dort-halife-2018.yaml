abstract: "İslam tarihinde devletin gelirlerinin toplandığı mekân olan beytülmal, günümüzdeki devlet hazinesine tekabül eder. Beytülmal kurumunun mazisi Hz. Peygamber zamanına kadar gitmekle birlikte o dönemde sadece bu amaç için ayrılan bir yerden bahsedilemez. Hz. Ebû Bekir zamanında halifenin evinin bir odası devlet hazinesi için tahsis edilmiştir. Beytülmalin kurumsallaşması ve müstakil binalara kavuşması ise Hz. Ömer zamanına denk gelmektedir. Hz. Ömer döneminde sınırların genişlemesi ve devlet gelirlerinin artmasıyla birlikte divan teşkilatı kuruldu. Halk kabile mensubiyetlerine göre defterlere kaydedildi. Fethedilen bölgelerdeki araziler, daha önce yapılanların aksine mücahitlere dağıtılmayıp hazineye devredildi. Bunun ardından bu arazilerin ne kadar olduğu ve buralardan ne kadar vergi geleceği tespit edildi. Hz. Ömer zamanında hazine gelirleri arasında kabul edilen, Müslümanlardan alınan zekât ile gayrimüslimlerden tahsil edilen cizye, harac, humus, uşûr vb. gibi fey gelirlerinin tutarı belirlendi. Böylece belirli bir bütçe oluşmaya başladı. Beytülmalde biriken malların bir kısmı kamu yararına harcanırken geri kalan kısmı ise atiyye olarak vatandaşlara dağıtılmıştır."
