abstract: "Kur᾽ândaki ahkam ayetlerini konu edinen birçok tefsir kaleme alınmıştır. Bu alanda telif edilen eserlerden biri de el-Besîlî tarafından yazılan et-Takyîdu'l-Kebîr isimli tefsirdir. Söz konusu eserin özgünlüğü, eserde sadece fıkıhçıların farklı yaklaşımlarının işlenmesi ve eserin Kur᾽ân surelerinin dizimiyle uyumlu olmasında yatmaktadır. Eserde en büyük pay şüphesiz Bakara ve Al-i İmrân᾽a aittir. el-Besîlî, ayetlerden çıkarımlar yapmış; ez-Zemahşerî, İbn Atiyye ve İbn Arabî gibi bu alanın etkin simalardan nakillerde bulunmuştur. Nakilde bulundukları arasında Mâlikî mezhebine mensub İbn Arafe ve Ebû Hayyân da bulunmaktadır. Yazar, alim bir şahsiyet olmanın yanı sıra iyi bir eleştirmendir. Sahip olduğu bilgi sayesinde Bakara ve Âl-i İmran surelerindeki incelikleri kavramış ve önemli tespitlerde bulunmuştur. Ortaya koyduğu genel ilkeler, kendisinden sonraki nesiller için yol gösterici olmuş ve Malikî mezhebine hizmet etmek isteyenlere rehberlik etmiştir. Bu nedenlerle çalışmamıza konu olarak el-Besîlî᾽nin et-Takyîdu'l-Kebîr isimli tefsirini seçtik. Eserde fıkıh usûlu ile ilgili bazı konuları aşağıda belirtildiği üzere ele aldık. Çalışmamız önsöz, giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Önsöz kısmında konunun önemi belirtilerek çerçevesi çizilmiş ve konunun tarafımızdan tercih edilmesinin nedenleri işlenmiştir. Giriş kısmında yazarın hayatı, eserin tanımı ve yazara aidiyeti araştırılmıştır. Birinci bölümde İmam Besîlî᾽nin usûl kuralları hakkındaki görüşleri ele alınmıştır. İkinci bölümde İmam Besîlî᾽nin fıkıh usulündeki bazı ihtilaflı görüşlere yaklaşımı aktarılmıştır. Üçüncü bölümde ise lafızların delaletine yönelik görüşlerine yer verilmişir. Araştırma sürecinde elde edilen yeni bulgular sonuç kısmında maddeleler halinde sunulmuştur."
