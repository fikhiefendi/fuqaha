abstract: "Özellikle günümüzde faiz kavramı nedenleri ve sonuçları ile sürekli olarak tartışılır hale gelmiştir. Elindeki ufak birikimlerini ticarî usullerle değerlendiremeyen kişilerden, dinî bir kaygı taşımayanlar birikimlerini faize yönlendirirken dinî kaygılar taşıyan ve faiz almanın veya vermenin şiddetli bir şekilde yasaklandığı inancını taşıyan kişiler ise ellerindeki birikimi nasıl değerlendirebilecekleri noktasında sorular sormaya başlamıştır. Faiz almanın caiziyeti tartışılırken akla ilk gelen soru ise Kur'ân'da şiddetle yasaklanan, alanın ve verenin lanetlendiği ribâ ile faizi aynı kefeye koymanın ne kadar yerinde bir karar olduğudur. Ribâ kavramının tarihinden başlayarak hikmetini ve illetini; mezhepler bağlamında ele aldığımız bu çalışmada, günümüzde konvansiyonel ve katılım olmak üzere bankalarda uygulanan faiz ve kâr payı uygulamalarının ribâ uygulamasından ayrıştığı ve birleştiği noktaları ele almaya çalıştık. Ayrıca paranın tanımını yaparak enflasyon ortamında değer kaybetmesinde izlenecek yolları da açıklamaya çalıştık."
