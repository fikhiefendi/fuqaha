abstract: "Bu çalışma, Osmanlı hukuk sisteminin klasik döneminde aile hukukunu, Ebussuûd Efendi'nin fetvaları ışığında kapsamlı bir biçimde incelemektedir. Araştırmanın giriş bölümünde çalışmanın konusu, amacı, kapsamı ve yöntemi ayrıntılı olarak ortaya konulmuş; ayrıca başvurulan birincil ve ikincil kaynaklar tanıtılarak metodolojik çerçeve belirlenmiştir. Bu çerçevede fetva kavramı hem teorik açıdan ele alınmış hem de Osmanlı hukuk sistemi içerisindeki işlevi, bağlayıcılığı ve uygulamadaki yeri açıklanmıştır. Birinci bölümde, Ebussuûd Efendi'nin hayatı, ilmî kişiliği, eğitim süreci, görevleri ve eserleri detaylı biçimde incelenmiştir. Özellikle şeyhülislâmlık makamındaki konumu, Osmanlı hukuk sisteminin şekillenmesindeki rolü ve fetva kurumu üzerindeki etkisi değerlendirilmiştir. Bu bölümde ayrıca onun ilmî otoritesinin, fetvalarının hem teorik hem de pratik alandaki belirleyiciliğine nasıl katkı sağladığı üzerinde durulmuştur. İkinci bölümde ise aile hukuku kapsamında nikâh, mehir, talâk, iddet ve nafaka gibi temel konulara dair fetvalar sistematik bir şekilde analiz edilmiştir. Bu analizler yapılırken klasik fıkıh literatürü ile karşılaştırmalar gerçekleştirilmiş; böylece Ebussuûd Efendi'nin fetvalarının geleneksel fıkhî birikimle ne ölçüde örtüştüğü ve hangi noktalarda Osmanlı uygulamasına özgü yorumlar içerdiği ortaya konulmuştur. Aynı zamanda fetvaların, dönemin sosyal, ekonomik ve kültürel şartlarıyla olan ilişkisi değerlendirilerek, hukukî düzenlemelerin toplumsal hayata nasıl yansıdığı incelenmiştir. Çalışma, fetvaların yalnızca teorik hukuk metinleri olmadığını, aynı zamanda Osmanlı toplumunun aile yapısını, değerlerini ve gündelik hayat pratiklerini yansıtan önemli kaynaklar olduğunu göstermeyi amaçlamaktadır. Bu doğrultuda, aile hukukuna ilişkin düzenlemelerin bireyler arası ilişkileri nasıl şekillendirdiği ve özellikle aile kurumunun işleyişine nasıl yön verdiği ortaya konulmuştur. Sonuç olarak bu araştırma, Osmanlı aile hukukunun işleyişini fetvalar üzerinden analiz ederek, hukuk ile toplum arasındaki karşılıklı etkileşimi ortaya koymakta; bu yönüyle hem Osmanlı hukuk tarihi hem de sosyal tarih çalışmalarına katkı sağlamayı hedeflemektedir. Anahtar Kelimeler İslam Hukuku, Osmanlı, Aile Hukuku, Ebussuûd Efendi, Fetva"
