abstract: "İslam hukukunda nehiy konusu büyük bir önemi haizdir. Nitekim birçok fıkhî hüküm şer'î emir ve nehiylere dayanır. Bu nehiy çeşitli formlarla gelir, farklı anlamlar taşır ve onun bağlamı ilgili konuya göre değişir. Bu nedenle fakihler, bir taraftan sıhhat ve fesad, diğer taraftan ise butlân ve fesad açılarından nehyi tartışmışlar. Bu araştırma şu soruya cevap verir: ''Nehiy, her zaman nehyedilen şeyin fesadını ve butlânını gerektirir mi? Muâmelât konusunda butlân ile fesâd arasında fark var mıdır?'' Tezimiz bu soruları açıklığa kavuşturmak amacıyla usûl kitaplarında süregelen tarzdan farklı olarak bu konuyu teorik olarak sunmakla yetinmez. Bunun yanı sıra bu konuyu Emir es-San'ânî'nin, (Allah rahmet eylesin), Sübülü's-selâm kitabının el-Buyû' bölümüyle ilişkilendirerek somutlaştır. Bu nedenle çalışmamız, nehyi ve onun mahiyetini inceleyen temel bir bir girişle başlar. Ayrıca üç bölüm daha içerir ki, onlar da -Sübülü's-selâm kitabında yer alan Kitâbü'l-buyû' bölümündeki nehye dair hadislerle bağlantılı olarak- nehyin fesadı veya butlânı gerektirip gerektirmediğini açıklar. Birinci bölüm, nehyedilen şeylerin butlânını gerektiren şeyler; ikincisi bölüm, nehyedilen şeylerin butlânını gerektirmeyen şeyler; üçüncü bölüm ise fakihlere göre butlânı, Hanefilere göre fesadı gerektiren şeyleri konu edinir. Ayrıca her bölümün kapsadığı hadisler de zikredilmiştir. Araştırmayı uzatmamak adına sadece San'âni'nin kendi fıkhî görüşünü belirttiği hadislerden, ardından farklı fakihlerin görüşlerinden ve söz konusu hadislerde yer alan nehiyle ilgili bakış açılardan bahsedilmiştir. Bu da genellikle dört mezhebin fıkhı ile sınırlıdır. Bu araştırmanın asıl amacı, usûl-i fıkıhta nehiyle ilgili teorik olarak yer alan hususları, hadis kitaplarının şerhlerindeki pratik hükümlerle ilişkilendirmektir. Bu yüzden Sübülü's-Selâm kitabını model aldım, her bir mesele için bir hadisi örnek olarak zikrettim, ardından incelenen konuya bağlı olarak nehiy üzerinde durdum ve tartışmanın odak noktasını tespit ettim. Sonra da es-San'ani'nin görüşünü ve dayandığı delilleri, diğer fıkhi mezheplerinin mensuplarının delilleri ile mukayese ettim. Bunu yaparken âlimlerin sözlerini inceleyen, tahkik ve tahlil eden bir metot kullandım."
