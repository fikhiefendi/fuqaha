abstract: "Abdülhay el-Leknevî birçok ilimle uğraşan biri olma açısından 19. yüzyılın Hint alt kıtasında önemli ilmi şahsiyetlerinden birisi olarak temayüz etmiştir. Ülkemizde imam Leknevî ile ilgili nadir çalışmaların olması kendisinin ilmi kişiliğinden ve yakın çağda yaşamış biri olmasından dolayı üzücü bir durum olduğunu belirtmekte fayda vardır. İmam Leknevî'nin bu yönü bizi kendisi ile ilgili bir araştırma ve bazı görüşlerini gün yüzüne çıkarmaya sevk etti. İmam'ın fıkıh başta olmak üzere hadis, kelam, Arap dili, mantık gibi ilimlerde telif ettiği eserlerin sayısının ihtilaflı olmasına rağmen yüzü aşkın eseri olduğundan ve bu eserlerin dilimize kazandırılmamasından veya bu eserler ile ilgili doyurucu çalışma yapılmadığından dolayı Leknevî hakkında daha çok araştırma ve kendisi ile ilgili bazı bilgileri ortaya çıkarma kendisi hakkında çalışma isteğimizi arttırdığını beyan edebiliriz. İmam Leknevî Hanefi fakihi olarak dünya ülkelerinde bilinmesine rağmen ülkemizde sadece hadisçi yönü ile bilinmektedir. Bundan dolayı kendisinin fıkıh alanında elliyi aşkın eseri olması, fıkıh alanında yazmış olduğu eserler ile ilgili bir araştırma yapmayı icap etmektedir. Bu minvalde kendisi ile ilgili araştırma yapılmayı hak eden bir müellif bir âlim olduğu da aşikârdır. Bu kadar bilgi ve aşikarlık göz önünde iken kendisi ile ilgili araştırmaların yapılması arttırılmalı ve teşvik edilmelidir. Diğer önemli bir nokta ise Leknevî'nin otuz dokuz yıl gibi küçük bir hayata nasıl bu kadar çalışmayı sığdırdığı ve telif verdiği de işin ayrı bir merak boyutu uyandıran ve çalışmaya yönlendiren bir etmendir. Biz de fıkıh eserlerinden bid'at konusuna değinmeyi kendisinin bid'at'ı nasıl değerlendirdiğini ve neye bid'at dediğini merak ettiğimizden dolayı bu tarz bir çalışmaya yöneldik."
