abstract: "Belirli eserler özelinde Hanefî ceza hukukuna dair asılları tespit etmeyi amaçlayan bu çalışma giriş ve sonuç kısımları dışında iki bölümden oluşmaktadır. Birinci bölümde“asıl”ve“kâide”kavramlarının erken dönemlerdeki kullanım biçimleri ile bu kavramlarla ilişkilendirilen diğer terimler birçok örnek listelenerek ayrıntılı bir şekilde incelenmiştir. İkinci bölümde ise Hanefî ceza hukukundaki asıllar, yer yer mukayeseli şekilde tespit ve analiz edilmeye çalışılmıştır. Yapılan analizlerle“asıl”ve“kâide”kavramlarının tarihi gelişimi ile fıkıhtaki işlevi ortaya konmuş; kâide kavramının sonraki dönemde daha yaygınlaştığı ve kavâid ilminin sistematikleştiği görülmüştür. Bu çalışma kapsamında erken dönem fukahâ ve usûlcülerin metinleri taranarak kâidelerin yalnızca kurallar bütünü olarak değil aynı zamanda delil, dâbıta, kıyas ve istihsan gibi anlam alanları içerisindeki konumu tespit edilmeye çalışılmıştır. Özellikle Cessâs'ın diğerlerine kıyasla asılları daha yoğun biçimde kullanması ve bu alandaki katkıları, kavâid ilminin onunla birlikte sistematik bir yapıya kavuşmaya başladığını göstermiştir. Pek çok asılın doğrudan âyet ve hadislere dayandığı görülmekle birlikte dil ve belâgat unsurlarının da bu asılların teşekkülünde belirleyici bir rol oynadığı müşahede edilmiştir. Bu bağlamda genellikle hükmün temel dayanağını ifade eden“asıl”kavramının delil, kâide ve istihsan gibi unsurların her biri için geçerli olup söz konusu unsurların ilgili meselede“asıl”niteliğinde değerlendirildiği belirlenmiştir."
