abstract: "Fıkha kaynaklık etme bakımından önem arz eden örf nazariyesi, tarihsel süreç içerisinde gelişimini sürdürerek bugünkü konumuna ulaşmıştır. Çalışmamızda örfün bu gelişim serüveni de dâhil olmak üzere asıl olarak Karâfî, İbn Kayyim ve İbn Âbidîn'in örf nazariyesinin gelişimine sundukları katkı ele alınmıştır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu, amacı, yöntemi ve faydalanılan kaynaklar ele alınmıştır. Birinci bölümde örf ve âdetin lügat ve ıstılahi tanımları yapıldıktan sonra, örf ve âdet arasındaki anlamsal ilişki ortaya konulmuştur. Meselenin daha iyi anlaşılabilmesi için örfün yapı, sıhhat ve kapsam olarak kısımları açıklanmıştır. Örfü kaynak olarak kabul edenlerin Kur'an, sünnet ve icmadan ileri sürdükleri deliller arz edilmiştir. Ardından örfün geçerlilik şartları ve İslâm mezheplerindeki konumu ele alınmıştır. Son olarak süreç içerisinde örfün Batıda ve Doğudaki gelişimi ortaya konulmuş ve bölüm değerlendirilmesi ile konunun alt yapı bilgileri tamamlanmıştır. Çalışmanın ikinci bölümünde; Karâfî, İbn Kayyim ve İbn Âbidîn'in aynı yöntem ile fakat ayrı ayrı olarak; hayatı, dönemindeki ilmî ve siyasi durum, ait olduğu mezhep ve takip ettiği usul bağlamında konunun tamamlayıcıları ortaya konulmuş, sonrasında örfün usul anlayışındaki yeri başlığı altında asıl konu işlenmiştir. Ele alınan her ismin ardından değerlendirme yapılmış ve elde edilen bulgular sonuç kısmında ifade edilmiştir."
