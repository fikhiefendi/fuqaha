abstract: "Hayreddin Karaman, içinde yaşadığımız çağda İslam'ı asrın idrakine sunma sorumluluğunu benliğinde hissetmiş ve çözüm yolları arayışında olmuş bir âlimdir. Bir taraftan geleneksel kültürün donukluktan kurtulup gelişmesi için çalışırken, bir taraftan da çağdaş problemlere çözüm arayışı içinde olmuştur. Klasik literatüre vukûfiyeti yanında muasır İslâm âlimlerinin düşünce ve fikirlerini yakından takip eden Karaman, Fıkıh yanında farklı çalışma alanlarında yoğun gayretler sarf etmiştir. Karaman, müslümanların eğitim-öğretimi, grupçuluktan uzak birlik ve beraberlik içinde yaşamaları için de mesai harcamıştır. Karaman, XIX. ve XX. asrın ıslahatçılarının İslâm dünyasının geri kalmaktan kurtulmasının yolu olarak gördükleri ictihad kapısının devamlı açık tutulması, taklid ve tefekkürsüz dinî hayatın terk edilmesi söyleminin de savunucularındandır.Bu çalışmada, Hayreddin Karaman'ın güncel meselelere nasıl yaklaştığı, şer'i delillere başvuru şekli, fıkıh anlayışının çerçevesi konuları etrafında yoğunlaşıldı. Karaman'ın İslam hukukuna dair ilmî ve fikrî mesaisi üzerinde yapılan bu çalışma aynı zamanda, değişimi baş döndürücü bir hızda seyreden dünyada müslümanların kendi dinleri ve hukuk sistemleriyle beraber nasıl konumlanacaklarına dair Karaman'ın yaklaşımını ortaya koyacaktır.Kur'an, Sünnet, İcmâ, Kıyas, İstihsan ve Maslahat gibi şer'i delilleri yenileşme boyutlarıyla tetkik eden Karaman, günümüze kadar uzanan fıkıh mirasının da bu hayatiyetin göstergesi olduğu kanaatindedir. İctihad faaliyetini dînî bir görev, hayatî bir zorunluluk olarak algılaması, mezhepler arasında ictihad seçiminin önünü devamlı olarak açık tutması, zaruret, maslahat şeriatın makasıdı gibi ilkelerle yeni ortaya çıkan meselelere yaklaşımı, günümüz meselelerinin birçoğunun çözümlenmesini beraberinde getirmektedir."
