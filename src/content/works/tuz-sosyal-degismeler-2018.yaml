abstract: "Bu araştırmada insanlığın başlangıcı kadar eskiye dayanan mehir ve tarihi uygulamaları, farklı kültürlerde farklı uygulamalara bürünen mehrin, yeniden ele alınması gerektiği tespit edilmeye çalışılmıştır. İslam, kültürel olarak Cahiliye adetlerinden olan mehre farklı bir rol biçmiştir. Erkek tarafından kadına ödenen zorunlu bir evlilik sigortası olması hasebiyle toplumlarda farklı uygulamalara bürünen mehrin, tekrardan kendini yenileme ihtiyacı hasıl olmuştur. İnsanın iki farklı güvencesi mevcuttur. Bunlardan birincisi iman yani maneviyat teminatıdır. Diğeri ise toplum içerisinde huzurlu yaşamasını temin eden düzenlerdir. Buna binaen kadın için bir sosyal güvence, teminat olan mehrin işlevsel olması zorunludur. Çalışmamızın genelinde, toplumda büyük bir sayı teşkil eden kadına tanınan mehir hakkının, canlı ve işlevsel olması üzerinde durulmaya çalışılmıştır."
