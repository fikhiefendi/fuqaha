abstract: "Kredi kartı sorunu, özelde bireylerin ve genel olarak toplumun ekonomik seviyesini artıran ekonomik olanaklar nedeniyle modern çağda en önemli konulardan biridir. Milyonlarca insanın bu kartla işlem yapmasına rağmen, dünyanın bütün ülkelerinde yaygın olmasına rağmen ve neredeyse tüm ekonomik kurumlar tarafından kullanılmasına rağmen, İslam hukukunda yasaklanan faizli sisteme dayandığı göz önünde bulundurulmalıdır. Bu nedenle, kredi kartı kavramının İslam Hukuku açısından tanımlanması ve fıkhî değerlendirmesinin yapılması elzemdir. Ayrıca Müslümanın bu konu hakkındaki bilgisizliğinden dolayı düşebileceği haramlar ve hakkında yeterli bilgisinin bulunmaması sebebiyle kredi karla nasıl işlem yapacağının açıklanması amaçlanmaktadır Dikkat çeken şey şudur ki; kredi kartı verme işi rastgele değil, ancak kartı çıkaran cihetin hem kart sahibiyle hem de tüccarla yaptığı kontrata dayanarak gerçekleşmektedir. Bu cihet yukarıdaki sözleşmelerin şart ve hükümlerini koymayı sadece kendine hasretmekte ve kart sahibini veya tüccarı bu şartları silme veya ekleme yoluyla tartışma hakkı olmadan, sadece kabul etmek veya reddetmekle sınırlı tutmaktadır. Netice itibarıyla da bu sözleşmeleri, zayıf tarafın sadece kabul ve rızaya malik olduğu itaat sözleşmelerine benzetmektedir."
