abstract: "Günümüzde Şiilik sırf bir mezhep olarak algılanmamakta belki bunun yanında bir usul-felsefe-siyaset ve hukuk okulu olarak görünmektedir. Öyle ki tarih boyunca dünyada yaşayan insanların bir kısmının hayatını etkilemektedir. Bu okul bugünkü görünümünü din alimleri ve İslam filozoflarına borçludur. Bu alimler ve filozoflar usul ilmi ve fıkıh kaideler ilminin temelini oluşturmakla düşünce ve düşünmeyi bu okulla tanıştırmışlardır.bu kaideler Kuran, Vahiy ve Sünnetten kaynaklanarak düşünce ve İçtihat şekillerinde sosyal hayatın gelişimiyle birlikte hayat sürdürmüşlerdir. Şiiliğin siyasi hukuki çerçevesi dünyada var olan hukuk ve siyaseti kendi çerçevesinde hazmetmiştir. Bu okulun somut örneği Hz. Ali'nin kurduğu devlet ve İslam Cumhuriyeti dir. Şiiliğin kamu hukuku aynı batılı okullar gibi kendi doktorinine dayanarak farklı teorilere sahiptir ve bu teoriler yöneticiler ve yönetilenlerin hakların ve ödevlerin belirtmektedirler. Şiiliğin kamu hukukunda özgürlük, demokrasi, eşitlik, adalet ve buna benzer konular farklı şekillerde yorumlanmaktadır ve çoğunlukla öyle mana olmuşlar ki kendilerini farklı kalıplarda göstere bilirler."
