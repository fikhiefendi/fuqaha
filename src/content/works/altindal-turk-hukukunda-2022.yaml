abstract: "Gemiler, bayrağını çekme hakkına sahip oldukları devletin milliyetine sahiptir. Türk hukukunda Türk bayrağı çekme hakkı, bayrak çekme hakkına sahip olma ve bu hakkı kullanma olmak üzere iki ayrı olgu halinde düzenlenmiş, farklı şartlara tabi tutulmuştur. Türk Ticaret Kanunu m. 940 hükmü uyarınca Türk gemileri, Türk bayrağı çekme hakkına sahiptir. Bir geminin hangi şartlarla Türk gemisi kabul edileceği, gemi maliki esas alınarak; gerçek ve tüzel kişi gemi maliki bakımından farklı şartlarla düzenlenmiştir. Bu şartlara sahip olan ve Türk gemisi sayılan gemilerin Milli Gemi Siciline tescili bayrak çekme hakkı bakımından açıklayıcı niteliktedir. TTK m. 940 gereği Türk gemisi olmayan gemilerin Türk bayrağı çekebilme halleri TTK m. 941, Türk Uluslararası Gemi Sicili Kanunu ve Bağlama Kütüğü Uygulama Yönetmeliğinde öngörülmüştür. TUGSK ve BKUY bakımından gemilerin Türk Uluslararası Gemi Siciline veya Bağlama Kütüğüne kaydı Türk bayrağı çekme hakkı için kural olarak kurucu niteliktedir. Bayrak devleti, bayrağını taşıyan gemilere bazı haklar verirken bu gemilerin, denizde can, mal ve çevre emniyetine yönelik denetimini sağlar. Türk gemisi olmanın getirdiği en önemli ayrıcalık ise kabotaj hakkıdır. Bununla beraber Türk gemileri MGS, TUGS ve Bağlama Kütüğü'ne kaydolabilirler."
