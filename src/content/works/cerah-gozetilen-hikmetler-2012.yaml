abstract: "Bu çalışmada, Fıkha göre kadınların mirası ve bu mirastaki hikmetler incelenmeye çalışılmıştır.Çalışmanın giriş bölümünde, konunun daha iyi anlaşılması için feraiz ilmi tanıtılmış, bu ilmin esasları ortaya konulmuş, mirasçılığın şartları incelenmiştir.Birinci bölümde, özellikle kadın mirasçıların, miras alma durumları incelenmiş, erkek mirasçılara, mukayese için yer verilmiştir. Genel olarak mirasçılar ashâbü'l-ferâiz, asabe ve zevi'l-erhâm olarak bölümlendirilmiştir.İkinci bölümde İslam'a göre kadınların miras paylarının hikmetleri incelenmeye çalışılmıştır."
