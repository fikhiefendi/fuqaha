abstract: "Dünya ekonomisinin gelişimi ile birlikte finans sektörü ve bankacılık sektörü faaliyetleri her geçen gün gelişmekte ve yeni bankacılık faaliyetleri ortaya çıkmaktadır. Dünya finans piyasalarında ve buna paralel olarak Türkiye ekonomisi içerisinde son 30-40 yıllık süre zarfında ortaya çıkan ve gelişimini hızla sürdüren bir bankacılık türü bulunmaktadır. Dünyada İslami bankacılık veya faizsiz bankacılık adı ile faaliyetlerini sürdüren bu kuruluşlar Türkiye'de katılım bankacılığı adı ile faaliyet göstermektedirler. Dünya ekonomik sistemi içerisinde kendine kısa zamanda önemli bir yer edinen faizsiz bankacılık işlemlerinden Türkiye gibi stratejik ve siyasi olarak önemli bir konuma sahip ülkenin uzak durması düşünülemezdi. Türkiye finans piyasası, İslam coğrafyasında toplanan sermaye fazlasını ülke ekonomisine kazandırmak ve iç piyasada atıl fonların değerlendirilmesine olanak tanımak için katılım bankacılığı faaliyetlerinde bulunmak durumundaydı. Son 10 yıllık süre içerisinde katılım bankacılığı faaliyetlerine yönelik daha fazla yatırım yapıldığı ve bu sektörün gelişimine devlet politikası gereği olarak önem verildiği görülmektedir. Günümüz itibariyle katılım bankalarının Türkiye bankacılık sektörü içerisindeki Pazar payı ortalama %5'lik bir orana sahiptir. Üç farklı özel sermayeli banka ve iki devlet sermayeli katılım bankası ülke ekonomisi içerisinde faaliyet göstermektedir. Ülke ekonomisi içerisinde son yıllarda yapılan atılımlarla birlikte önemli bir yer edinmeye çalışan katılım bankalarının, banka müşterileri gözünde yarattıkları algı ve bakış açısı katılım bankalarını gelecek hedeflerine taşıyacak ve istedikleri konuma gelmelerinde etkili olacak en önemli faktördür."
