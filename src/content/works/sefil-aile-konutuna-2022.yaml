abstract: "Çalışma konumuzu“ Aile Konutuna Dayalı Tapu İptali ve Tescili ”oluşturmaktadır. Aile konutu şerhi, ilk kez 4721 sayılı Türk Medeni Kanunu'nun 194' üncü maddesi ile Türk hukukuna girmiştir. Bu düzenleme; ailenin ekonomik bütünlüğünü ve aile yapısını korumak adına öngörülmüş olup, aile konutu olarak kullanılan taşınmazın, malik olan eş tarafından, diğer eşin açık rızası bulunmaksızın devredilemeyeceği ya da aile konutunun üzerindeki hakların sınırlanamayacağı belirtilmiştir. Aynı maddenin üçüncü fıkrasında da aile konutu olarak kullanılan taşınmaz üzerinde, taşınmazın maliki olmayan eşin tapu kütüğüne aile konutu şerhinin verilmesini tapu müdürlüğünden isteyebileceği hükmü düzenlenmiştir. Aile konutu olarak kullanılan taşınmazın tapu kütüğüne aile konutu şerhi işlenmemesine rağmen taşınmazın maliki olan eşten taşınmazı devralan üçüncü kişilerin tapu siciline güven ilkesi kapsamında ayni hak kazanmaları diğer eşin rızasının bulunmadığı gerekçesiyle engelleyip engelleyemeyeceği konusu doktrinde tartışmalıdır. Türk Medeni Kanunu'nun 1023' üncü maddesi gereği tapu kütüğünde aile konutu şerhi bulunmayan taşınmaz üzerinde iyi niyetli üçüncü kişinin ayni hak kazanımının korunması gerekir. Yargıtay, 2015 yılına kadar vermiş olduğu kararlarda aile konutu şerhi bulunmayan taşınmazlarda aile konutu üzerinde üçüncü kişilerin iyi niyetle ayni hak kazanılacağına hükmetmiştir. Ancak sonrasında bu görüşünü değiştirerek aile birliğinin bütünlüğünü korumak amacıyla üçüncü kişilerin iyi niyetli ayni hak kazanımlarının korunmaması yönünde kararlara hükmetmiştir. Bu çalışmada aile konutu şerhinin hukuki niteliği, etkisi ve özellikle iyi niyetli üçüncü kişilerin ayni hak kazanmaları bakımından hukuki sonuçları incelenmektedir. Çalışmamız üç ana bölümden oluşmaktadır. Birinci bölümde aile kavramı, aile konutu tanımı ve unsurları, aile konutunun önemi ve korunma yöntemleri ve korunma süresi incelenmiş olup daha iyi anlaşılabilmesi için aile konutunun tanımı yapılarak, önemine ve koruma nedenlerine değinilmiştir. Çalışmamızın ikinci bölümünde, aile konutu şerhi, şerhin konulması ve kaldırılması üzerinde durulmuştur. Çalışmamızın üçüncü bölümünde ise çalışmamızın asıl konusu olan aile konutuna dayalı tapu iptali ve tescili davası, tapu siciline güven ilkesi, üçüncü kişilerin iyi niyetinin nasıl değerlendirildiği ve buna bağlanan sonuçlar Yargıtay kararları ışığında açıklanmıştır."
