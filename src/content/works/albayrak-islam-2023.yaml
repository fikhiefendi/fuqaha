abstract: "Devletin ortaya çıkışıyla birlikte gündeme gelen siyasal iktidarın meşruiyeti problemi, devlet aygıtının iyice büyüyüp karmaşık hale geldiği günümüzde geçmişe göre daha fazla önem kazanmıştır. Emir-itaat ilişkisi olarak ortaya çıkan siyasal iktidarın hangi ilkeye dayanarak niçin yönetme hakkına sahip olduğu sorusu, meşruiyetin doğasını ortaya çıkarmaya yöneliktir. Bu soruya verilecek yanıt, meşruiyetin mahiyetini ortaya koyacaktır. Siyasal iktidarın, kendisini haklılaştırma aracı olarak her zaman kullanmaya çalıştığı meşruiyet \"olması gereken\" ile \"olan\" arasında bocalayıp durmaktadır. Modern çağın İslam ülkeleri, özellikle \"Arap Baharı\" sürecinde yaşanan iktidarın meşruiyetine ilişkin siyasal krizlerle boğuşmaktadır. Bu bağlamda, ilahi vahye muhatap olan İslam toplumunun meşruiyet anlayışının belirlenerek gündeme getirilmesi büyük bir önem taşımaktadır. Araştırmada sadece siyasal meşruiyet konusu incelenmiş ve bu çerçevede Hz. Peygamber ve Raşit Halifeler dönemindeki tarihsel veriler esas alınmıştır. İslam hukukunun siyasal yönetime ilişkin öğretileri doğrultusunda bir meşruiyet tanımı geliştirilerek siyasal iktidarın meşruiyet temellerinin belirlenmesi ve İslam'ın kurucu dönemindeki meşruiyet tipinin ortaya konulması amacı doğrultusunda yapılan araştırmanın sonucunda, İslam'ın kurucu döneminde yasal-ussal meşruiyet tipinin hâkim olduğu anlaşılmıştır. Anahtar Kelimeler: Siyasal İktidar, Meşruiyet, Hukuksal Meşruiyet, Sosyo-Politik Meşruiyet, Yasal-Ussal Meşruiyet, Emir, İtaat."
