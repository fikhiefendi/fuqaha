abstract: "İmam Ebû Hanife hem kendi dönemine hem de kendisinden sonra ki dönemlere ilmi yönden damga vurmuş bir âlimdir. Çalışmamızda bu büyük âlimi dönemi içerisinde gerçekleşen olaylar ve kendisinin verdiği tepkiler açısından değerlendirilmeye çalışılmıştır. Bu sayede kendisinin siyaset anlayışı hakkında bilgi edinilmeye gayret edilmiştir O yaşadığı ortam ve zaman açısından ilim ve bilgiye ulaşma konusunda avantajlı sayılabilecek bir durumda olmakla beraber; siyâsî açıdan sıkıntılı bir ortamda yaşamıştır. O hiçbir siyâsî ya da itikâdî oluşuma dahil olmamış ve kendi ilmî çizgisini oluşturmuştur. Kendisinin yaşadığı döneme kadar Cemel ve Sıffin savaşları yaşanmış ve bu savaşların acıları, yaraları ve siyâsî sıkıntıları hala Müslümanlar üzerinde etkisini sürdürmekteydi. O, Hz. Ali evlatlarına beslediği sevgi ve saygıya uygun olarak Emevî devletine karşı sert tenkitlerde bulunmuş, hatta onlara karşı Ali evlatlarının çıkardığı ayaklanmalara maddi ve manevi destek vermiştir. Kendisi bu tenkitlerin karşılığı olarak, Emevî devleti tarafından hapse atılmış ve eziyet görmüştür. Ebû Hanife Abbâsîlerin iktidarı Emevîlerden devralmasını ilk başlarda memnuniyetle karşılasa da daha sonraki haksız uygulamalarına karşı onları da tenkit etmekten geri durmamıştır. Ancak o, Emevîleri halîfeliği hak etmemekle ve meşru olmadıklarını sözleri ile eleştirirken; Abbâsîleri ise halifeliğin onların hakkı olup olmadığı konusu üzerinden değil de, genelde adaletsizlik üzerinden eleştirmiştir. Ancak bu, adaletsizlik eleştirisini Emevîler'e karşı yapmadığı anlamına gelmemelidir. O, siyâsî anlamda herhangi bir tarafta olmamıştır. Halk nazarında kıymetli bir yere sahip olması ve halîfeleri sık sık eleştirmesi mevcut iktidarların dikkatini çekmiştir. Maalesef ki bu dik duruşu kendisinin eziyet görmesine ve hapse atılarak şehir edilmesine sebep olmuştur. Anahtar Kelimeler Ebû Hanîfe, Siyaset, Emevîler, Abbâsîler"
