abstract: "Müslümanların uyması gereken şer'î-amelî hükümlerin müctehidlerin yorumları ile sistematik bir biçimde oluşturulmasını ifade eden fıkıh ilminin teorik temelleri fıkıh usûlüne dayanır. Fıkıh usûlü de Kur'an ve sünnetten şer'î-amelî hükümlerin elde edilmesi için gerekli kural ve yöntemlerden söz eder. Kur'an ve sünnet metinlerinin murad-ı ilahiyi taşıyan ifade biçimleri ve anlam kalıpları olması sebebiyle usûlcüler eserlerine ilk olarak“beyân”konusuyla başlamışlar ve lafızların mümkün muhtemel ve zorunlu anlamlarını tespit etmeye gayret etmişlerdir. Lafzın anlama delâleti kısaca“Şârî'nin ne dediğini”tespit etmek demektir. Ancak lâfzî anlamın elde edilmesi ilk hedef olsa da nihai hedef değildir. Zaten tarihi tecrübe bunun yeterli olmadığını Hz. Peygamber'in vefatının hemen ardından doğrulamıştır. Bu bakımdan lafzın anlamının hükme delâletini yani mükellefin fiillerine taallukunu da belirlemek gerekir ki artık bu aşamada“Şârî'nin ne demek istediğini”de tespit etmek gerekir. Dinin, hayatın tüm yönlerini kuşatan ve güncel sorunlarla baş ederek çözüm sunan yapısı ile evrenselliğini koruması da böylece mümkün olacaktır. Bu sebeple lâfzî anlamın yetersiz kaldığı durumlarda ulema, nassların sınırlı, olayların sınırsız olduğu düşüncesinden hareketle örf başta olmak üzere kıyas, istihsan, ıstıslah gibi yollarla alternatif anlam arayışına gitmiştir. Bu çalışma, bahsi geçen kural ve yöntemlerin Gazalî ve İbn Rüşd'ün anlayışları ile değerlendirilmesini konu almaktadır. Bu çalışmada her iki âlimin dil ve mantık kurallarıyla formüle ettikleri yöntemlere ve aralarındaki yöntem farklılıklarına yer verilmiştir. v"
