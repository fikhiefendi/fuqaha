abstract: "“Farz-ı kifâyenin Terkinin Hükmü ve Hukûkî Sonuçları”başlığını taşıyan çalışmamız, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, amacı, yöntemi ve sınırları ele alınmaktadır. Birinci bölümde çalışmanın kavramsal boyutunu teşkil eden vaz'î ve teklifi hükümlerin kısımları izah edilmektedir. Teklîfî hükümlerin tasnifi ve sunumunda genel olarak cumhurun beşli taksimi esas alınmakla birlikte Hanefî mezhebinin terminolojisi de ilave olarak zikredilmektedir. Bu doğrultuda farz, vacip, farz-ı ayn ve farz-ı kifâye gibi fıkhî terimler açıklanmakta, özellikle farz-ı ayn ve farz-ı kifâye arasındaki farklara değinilmektedir. İkinci bölümde, Müslüman toplumu ilgilendiren Farz-ı kifâyeler bağlamında cemaatle namaz, cenaze, şehitlerle ilgili hükümler incelenmekte; imâmı (devlet başkanı) ilgilendiren farz-ı kifâyelerle ilintili olarak hisbe, emr-i bi'l-ma'rûf nehy-i ani'l-münker, ictihâd ve cihâd gibi konular ele alınmaktadır. Üçüncü bölümde, farz-ı kifâyenin terk edilmesi durumunda ortaya çıkan sonuçlar ele alınmaktadır. Buna göre önce dinî farz-ı kifâyelerden cemaatle namazı kılmayı, cenaze hükümlerinin uygulamayı, hisbeyi, emr-i bi'l-ma'rûf nehy-i ani'l-münkeri, içtihadı ve cihadı terketmenin hukûki sonuçları izah edilmektedir. Ayrıca İslam'a uygun bir dünya hayatının tesisi ve devamı açısından farz-ı kifâye kapsamına giren yükümlülükler ve bunların terki halinde doğan hukukî sonuçlar ele alınarak tahlil edilmiştir."
