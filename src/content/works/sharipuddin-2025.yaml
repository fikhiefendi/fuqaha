abstract: "Bu tez çalışması, tasavvuf ve Zen Budizmi geleneklerinde tefekkür ve meditasyon kavramlarını karşılaştırmalı bir yaklaşımla incelemeyi amaçlamaktadır. Çalışma, her biri kendi dinî-teolojik çerçevesine derinden kök salmış bu iki manevî yolun, entelektüel ve ruhsal disiplin aracılığıyla içsel dönüşüm ve hakikat arayışına nasıl yaklaştığını araştırmaktadır. Araştırma, kavramların hem dilbilimsel ve terimsel farklılıklarını hem de her iki gelenekteki teolojik, pratik ve deneyimsel boyutlarını analiz etmektedir. Bu bağlamda, her iki geleneği temsil eden önde gelen şahsiyetlerden Gazâlî ve Dōgen'in tefekkür ve meditasyona dair görüşleri ele alınarak, onların manevî miraslarına katkıları değerlendirilmektedir. Araştırma, karşılaştırmalı analiz temeline dayalı nitel bir yöntemle yürütülmüştür. Birincil kaynaklar arasında Kur'ân-ı Kerîm, hadisler, Budist kanonik metinler (Nikāyalar, Abhidhamma, Visuddhimagga vb.), Gazâlî'nin İhyâʾ ʿUlûm al-Dîn adlı eseri ve Dōgen'in Shōbōgenzōsu yer almaktadır. İkincil kaynaklar ise akademik kitaplar, makaleler ve ilgili önceki çalışmalardan oluşmaktadır. Analiz süreci, temel kavramların semantik ve etimolojik kökenlerinden başlayarak, bu kavramların kutsal metinlerde nasıl temellendirildiği, gelenek içi yorumlarla nasıl şekillendiği ve manevî uygulamalarda nasıl tezahür ettiği yönünde ilerlemektedir. Tezin giriş bölümünde“tefekkür”ve“meditasyon”kavramlarının Arapça, Pali/Sanskrit, Japonca ve İngilizce karşılıklarının semantik çözümlemesi yapılmıştır. Birinci bölümde, İslam geleneğinde tefekkür ve meditasyon kavramları ele alınmış; Kur'ân ve hadislerdeki kullanımları incelenmiş; ardından tasavvufun İslam'daki yeri açıklanarak Mevlevî, Nakşbendî, Kâdirî ve Çiştî gibi bazı tarikatlarda bu pratiklerin nasıl uygulandığı örneklendirilmiştir. İkinci bölümde, Budist kutsal metinlerdeki meditasyon anlayışı özellikle Nikāyalar ve Abhidhamma geleneği çerçevesinde incelenmiş; Zen Budizmi'nin temel öğretisi ve merkezî uygulaması olan zazen pratiği sunulmuştur. Üçüncü bölümde, Gazâlî ve Dōgen'in biyografileri, entelektüel arka planları ve kendi geleneklerine katkıları tanıtılmıştır. Bu kapsamda, Gazâlî'nin İhyâ'sında yer alan altı bölüm analiz edilmiştir: Kur'ân tilâvetinin âdâbı, semâʿ ve vecd, uzlet edepleri, murâkabe ve muhâsebe, tefekkür ve ölüm ve ötesi. Paralel olarak, Dōgen'in Shōbōgenzō'sundan on iki temel fasikül ele alınmıştır: Bendōwa, Soku Shin Ze Butsu, Busshō, Daigo, Shoaku Makusa, Gyōbutsu Iigi, Hotsu Bodai Shin, Bodaisatta Shishōbō, Zazengi, Gyōji, Zenki ve Zazen Shin. Son bölümde, Tanrı tasavvuru, mürşid kavramı, halvet ve manevî ilerleme aşamaları gibi temel kavramlar karşılaştırılmış; ardından zikir ve ilâhî ezgi, nefes farkındalığı ve ölüm tefekkürü gibi uygulama temelli karşılaştırmalar yapılmıştır. Bölüm, Gazâlî ve Dōgen'in tefekkür ve meditasyona dair ilkeleri, hedefleri ve deneyimsel tezahürleri üzerine yapılan doğrudan karşılaştırmayla son bulmaktadır. Bu çalışmanın bulguları, tasavvuf ve Zen Budizmi'nin farklı metafizik temellere dayanmasına rağmen, her iki geleneğin de tefekkür ve meditasyonu varoluşsal dönüşümün temel yolları olarak gördüğünü ortaya koymuştur. Her iki gelenekte de bu pratikler yalnızca zihinsel yoğunlaşma değil, aynı zamanda içsel arınma, farkındalık ve aydınlanma yolunda önemli araçlardır. İslam düşüncesinde tefekkür, Allah'ın varlığına, kudretine ve hikmetine dair aklî ve kalbî bir derin düşünme sürecidir. Kur'ân ve hadislerde teşvik edilen bu süreç, tasavvuf geleneğinde daha sistematik ve derinlikli bir manevî eğitim metoduna dönüşür. Gazâlî'ye göre tefekkür, yalnızca entelektüel bir etkinlik değil, aynı zamanda kalbi arındıran ve ruhu Allah'a yönelten bir ibadettir. O, bu süreci kulun ilahî yakınlığa doğru yükselmesini sağlayan“manevî bir merdiven”olarak tanımlar. Bu süreçte kalp, akıl ve nefis birlikte çalışarak içsel arınmayı mümkün kılar. Ayrıca Gazâlî, tefekkürün bilgiye karşı bir sevgi uyandırdığını, zihinsel üretkenliği artırdığını ve bireyi hem bireysel hem de toplumsal fayda sağlayacak nitelikte bilgi üretmeye sevk ettiğini vurgular. Bu yönüyle tefekkür, yalnızca bireysel arınmanın değil, aynı zamanda bilimsel yaratıcılığın ve teknolojik gelişimin de temeli olabilir. Böylece İslam, maneviyat ile bilgiyi bütünleştiren bir yaklaşım sunar. Dōgen ise meditasyonu özgün biçimde yorumlamakla birlikte, uyanış yolunda merkezî yere sahip olan dhyāna (meditatif yoğunlaşma) uygulamasına vurgu yapan geleneksel Budist okulların çizgisini sürdürmektedir. Geleneği reddetmek yerine, özellikle Mahāyāna ve Tendai temelleri üzerine inşa ederek meditasyonu bizzat aydınlanma olarak yeniden yorumlar. Hi-shiryō (düşünmeme) kavramı, düşüncenin bastırılmasını değil; düşünme (shiryo) ve düşünmemezlik (fushiryō) hâllerinin ötesine geçmeyi ifade eder. Dōgen'e göre zazen, yalnızca hazırlayıcı bir yöntem değil, doğrudan aydınlanmanın kendisidir. Disiplinli oturuş sayesinde uygulayıcı, beden, zihin ve kozmosun dinamik birliğini doğrudan deneyimleyerek, nesne-özne, zaman-sonsuzluk gibi ikilikleri aşar ve varoluşun hakikatini doğrudan idrak eder. Gazâlî ve Dōgen'in yaklaşımları karşılaştırıldığında, her ikisinin de tefekkür ve meditasyona dönüştürücü bir değer atfettiği; bu uygulamaları hakikatle karşılaşmanın vazgeçilmez yolları olarak gördüğü anlaşılmaktadır. Gazâlî'nin yöntemi daha yapılandırılmış, amaç odaklı ve ilahî şeriata dayalı iken; Dōgen'in yaklaşımı daha sezgisel, ikilikten uzak ve doğrudan deneyime dayalıdır. Her iki yol da kendi geleneğinin epistemolojik, ontolojik ve manevî temelleriyle uyumlu olmakla birlikte, bireysel disiplinin ve içsel farkındalığın manevî yolculuktaki merkezî konumunu ortak bir biçimde vurgulamaktadır. Sonuç olarak bu çalışma, tefekkür ve meditasyonun yalnızca ibadet biçimleri ya da ruhsal disiplinler değil, aynı zamanda varlıkla, bilgiyle ve hakikatle kurulan derin ilişkilerin birer tezahürü olduğunu ortaya koymuştur. Gazâlî ve Dōgen'in perspektiflerinden bakıldığında, bu pratiklerin birbirinden farklı olmakla birlikte içsel dönüşüm ve nihai hakikatin idraki yolunda kesişen yollar sunduğu görülmektedir. Onların öğretilerini diyaloğa sokmak suretiyle bu tez, karşılaştırmalı mistisizmin daha derinlemesine anlaşılmasına katkı sunmakta ve hem akademik alana hem de çağdaş insanın anlam, derinlik ve aşkınlık arayışına değerli bir pencere açmaktadır."
