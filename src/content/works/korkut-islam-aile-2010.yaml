abstract: "Birbiri için yaratılan kadın ve erkeğin birbirlerinden ayrı kalması düşünülemez. Kadın ve erkeği en güzel şekilde bir araya getirecek olan şey de evlenmedir. İslam Dini, Müslümanları evliliğe teşvik etmiş, bir yuva kurmanın faydalarını ve hikmetlerini onlara bildirmiştir.Güzel ve faydalı amaçlarla kurulan bir evlilik, bazen bu yönde devam etmeyebilir. Sürekli sorun yaşayan eşlerin, evliliğe devam etmeleri sorunların daha da artmasına sebep olacaktır. Böyle bir durumda eşlerin, evliliği sona erdirmesi daha doğru bir davranış olur.Biz bu çalışmada, evlilik birliğini sona erdiren boşamayı ve boşama iradesinin kullanım şekillerini inceledik. Faydalı olacağı düşüncesiyle mana bakımından lafız çeşitlerinden de bahsettik.Buna göre, evlilik birliğine devam edemeyecek olan eşler de bu birlikteliği sözlü olarak sona erdirebilecekleri gibi yazılı olarak da sona erdirebilirler. Yine taraflar bir takım işaretler kullanarak veya başkalarını vekil belirleyerek de boşanabilirler."
