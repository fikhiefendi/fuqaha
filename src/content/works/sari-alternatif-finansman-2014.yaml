abstract: "Küreselleşen dünya düzeni ile birlikte ekonomik faaliyetlerde sınırlar neredeyse ortadan kalkmış durumdadır. İşletmeler için artık sadece ulusal değil, uluslararası bir rekabet söz konusudur. Hal böyle olunca da işletmeler için kaynak sağlayabilmek ve mevcut kaynakları zenginleştirebilmek önemli bir hale gelmiştir. Çünkü finansal anlamda zayıf olarak nitelendirilebilecek kuruluşların rakipleriyle sıkı rekabete girmelerini beklemek mümkün değildir. Bu durumun sonucu olarak da gerekli zamanda ve yeterli miktarda finansman sağlanması işletmeler için daha fazla önemli hale gelmiştir. Finansal anlamda güçlü olmanın gerekliliği sonucunda yenidünya düzeni içerisinde birçok alternatif finansman yöntemi ortaya atılmış ve bir kısmı halen uygulanmaktadır. Sukuk, alternatif finansman yöntemlerinden birisi olarak keşfedilmiş ve İslami değerlere bağlı biçimde uygulanması sebebiyle her geçen gün daha fazla ilgi görmeye başlamıştır. Finans çevrelerince önemli bir fon sağlama yöntemi olarak görülmesi ve diğer yöntemlere göre yeni olmasına rağmen hacminin sürekli artıyor olması konunun önemini artırmaktadır. Sukuk hakkında genel bilgilerin ortaya konulması ve sukukun Türkiye'de uygulanabilirliği konusunun araştırılmasının amaçlandığı bu çalışma literatür taraması şeklinde yapılmıştır. Araştırma sonucunda görüldüğü üzere sukukun alternatif bir finansman yöntemi olarak yaygın biçimde kullanılmasının önünde bir engel görülmemektedir. Gerçekleşen sukuk ihraç rakamlarına bakıldığında Türkiye'de sukuk piyasasının her geçen gün gelişim içerisinde olduğu görülmüştür. Ancak, konu hakkında yasal dayanakların sınırlılığı, sukukun diğer yöntemlerinin uygulanmaması ve sukuk ihraçları hakkında İslami değerlere uygunluk konusunda değerlendirme yapabilmek adına bağımsız bir kuruluşun gerekliliği ortadadır. Belirtilen konularda çalışmalar gerçekleştirildiği takdirde sukuka olan ilginin artacağı düşünülmektedir. Böylece yurt içinde inançları sebebiyle kaynaklarını değerlendirmeyen kesimlerin ve başta körfez ülkeleri olmak üzere birçok yabancı kaynakların Türkiye'ye aktarılması mümkün olacaktır. Sonuçta sadece farklı bir alternatif finansman inançları sebebiyle sahip oldukları maddi varlıkların değerlendirilmesi mümkün olacak ve ülke ekonomisinin canlanması sağlanacaktır."
