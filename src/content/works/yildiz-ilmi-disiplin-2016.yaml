abstract: "Dînî metinlerden hüküm istinbâtında haber-i vâhidlerle ve celî kıyâsla amel etmelerine rağmen bunları birbirlerine tercih etmeleri bakımından ayrışarak“Ehl-i hadîs”ve“Ehl-i re'y”olarak adlandırılan iki müctehid sınıfı, Asr-ı saâdete dayanan güçlü ilim gelenekleri, yetiştirdikleri isimler ve vücuda getirdikleri eserlerle İslâm hukuku tarihinin gidişatında belirleyici bir role sahip olmuştur. Fıkhü'l-hadîs; Evzâiyye, Şâfiîlik, Hanbelîlik ve Zâhirîlik gibi mezhepler ile dînî olduğu kadar siyâsî bir figür olarak da ön plana çıkan Selefîyyenin orijini durumundaki Ehl-i hadîs ekolünün dînî metinlerle ilişkisini ifâde etmektedir. Fıkhü'l-hadîs usûlünde aklî kıyâs, istihsân ve hadislerin Kur'ân'a arzı reddedilirken, sünnet Hz. Peygamber'e has kılınmış, sıhhati sâbit haber-i vâhidlerle amel edilmiş ve re'y, ehil kimselere tahsis edilmiştir. Ehl-i re'yden farklı olarak aynı konudaki sahîh rivâyetlerin tamamına ulaşmayı ve haber-i vâhid de olsa onlar üzerinde teferruatlı isnâd tahlilleri yapmayı önceleyen bu usûlde ilel bilgisi, tashîf-tahrîf, idrâc ve ziyâdeyi tespit gibi uygulamalar da hayâtî konumdadır. Fıkhü'l-hadîsi ilk defa ilmî bir disiplin olarak sunan Hâkim en-Nîsâbûrî'nin (ö. 405/1014) yaptığı tasvir, teorik yönü ağır basan“fıkhu metni'l-hadîs”değil; rivâyetlerin hıfzı, nakli, râvîlerinin tenkidi ve tarîklerinin cem'i gibi hususları içeren daha özel bir anlam içermektedir. Buna rağmen günümüzde fıkhü'l-hadîs;“fehmü'l-hadîsle eşdeğer tutulma”,“isnâddan bağımsız düşünülme”ve“hadis merkezli fıkıh anlayışı olarak sunulma”olmak üzere üç açıdan ele alınmaktadır. Bu araştırmada, Ehl-i hadîs'e has bir usûl olan fıkhü'l-hadîsin salt metin eksenli bir faaliyet olarak telakkî edilmemesi gerektiği ve bahsi geçen üç yaklaşımdan farklı olarak Ehl-i hadîs'in hüküm istinbât usûlü olduğu ve itikâdî konuları da içeren fıkhî yaklaşımlarının genel adı olduğu sonucuna ulaşılmıştır."
