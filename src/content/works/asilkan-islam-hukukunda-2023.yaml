abstract: "İslam dini insanın hem dünyada hem de ahirette mutluluğunu amaçlayan, birini diğerine tercih ettirmeyen, yüce bir inanç manzumesinden oluşur. Toplumun tamamı ya da büyük bir kısmı Müslüman olan ülkelerde bilhassa yoksulluğun ortadan kaldırılmasında zekât, topluma ekonomik anlamda katkısı olan önemli bir araç olarak görülmüştür. Bu nedenle zekât ibadeti geçmişten günümüze değerlendirildiğinde İslamiyet'in ilk döneminden başlayıp 4 halife devrine kadar devletin idaresinde yönetilmiştir. Geçmişten günümüze kadar zekâtın devlet aracılığı ile yönetilmesi hem yoksullukla mücadelede çok önemli bir unsur olmuş hem de zekât devletin gelir kaynaklarından biri olmuştur. Tezimizde öncelikli olarak zekâtın tanımı yapılmış, sonrasında hicret öncesi ve sonrası döneminde zekâtın devlet aracılığı ile toplanmasına değinilmiş ve ardından günümüzde zekâtı devlet aracılığı ile toplayan ülkelere değinilerek çalışmamız tamamlanmıştır."
