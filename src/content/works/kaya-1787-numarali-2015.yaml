abstract: "Bu çalışmayla 19. yüzyılın son döneminde Samsun bölgesinin dîni, sosyal, ekonomik ve kültürel açıdan durumunun tespitine katkıda bulunmayı hedefledik. Samsun'la ilgili kırk üç adet şer'iyye sicil defteri bulunmaktadır. Bu defterlerden şu ana kadar on dört tanesi ile ilgili çalışma yapılmıştır.Yaptığımız bu çalışmayla hem Samsun'un tarihine hem de bu Şerʻiyye sicillerinden birini transkribe ederek başka araştırmacıların istifadesine katkıda bulunmaya çalıştık. Çalışma 1787/33 numaralı ve 1897-1898 tarihlerini içeren Samsun şerʻî mahkemesine ait şer'iyye sicil defterinin tahlîlidir. Tez giriş hariç iki bölümden oluşmaktadır. Giriş kısmında, araştırmanın problem, amacı ve önemi, veri toplama araçları, araştırmanın sınırlılıkları ile kullanılan yöntemler hakkında bilgi verilmiştir. Birinci bölümde Şerʻiyye sicillerinin tanımı ve Samsun mahkemelerinde tutulan şer'iyye sicil defterleri ve bunlar üzerinde günümüze kadar yapılan çalışmalar belirtildikten sonra, 1787/33 numaralı Samsun şer'iyye sicil defterinde geçen kayıtlardan yola çıkarak, Samsun'un 19. yüzyıl sonlarındaki sosyal, kültürel, ekonomik ve idârî yönlerden değerlendirmesi yapılmıştır. Çalışmamızın ikinci bölümünde orjinal metnin lâtîn harflerine transkripsiyonu yapılmıştır. Transkripsiyon yapılırken kayıt başlarında içerikle ilgili kısa özet verilmiş ve kayıtlar numaralandırılmıştır. Sonuç kısmında ise, incelediğimiz şer'iyye sicil defterinden çıkarılan sonuçlar kısaca belirtilmiştir. 1787/33 numaralı defterde, incelediğimiz bölümde yüz on yedi adet kayıt bulunmaktadır. Kayıtlar vekîl, kefil, vasîve nafaka tayini, alacak-verecek davası, arsa, tarla, ev ve hisse satışı, tereke taksimi, kamu görevlisi tayini, çalınmış veya kaybolmuş mallarla ilgili hükümlerden oluşmaktadır. Çalışma 1897-1898 yıllarında Samsun şerʻî mahkemesine intikâl eden olayları kapsamaktadır."
