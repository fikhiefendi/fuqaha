abstract: "İktisadi örgütlenmenin bir biçimi olarak ortaya çıkan kapitalist sistemin en temel önermesi bireylerin bireysel çıkara göre hareket ettiğini ve tercihlerini de bireysel çıkara göre yaptığını kabul etmesidir. Özellikle Aydınlanma dönemi sonrası gelişen ve yaygınlaşan, sonrasında ekonominin merkezine oturan bu anlayış kapitalist bir ekonomik sistemde ahlakın da yeri ve pozisyonunun sorgulanmasına neden olmaktadır. Süreç içerisinde kapitalizmde ahlakın işlevine dair birçok yaklaşım geliştirilmekle birlikte, tüm bu yaklaşımlar bireysel çıkar merkezli bir piyasa ekonomisi kurguladığı için, ahlak her zaman dışsal olarak ele alınmıştır. Ahlakın bu şekilde dışsallaştırılması ise zaman içerisinde piyasanın ahlaki sınır kabul etmemesine ve en nihayetinde bireylerde aç gözlülük dürtülerinin baskın olmasına yol açmış ve bu da çeşitli ekonomik krizlere neden olmuştur. Bu ekonomik krizlere karşı çözüm olarak sistem içerisinde üretilen yaklaşımlar ise ahlakı içsel bir düzenleyici ve denetleyici mekanizma olarak ele almamaktadır. İslam ekonomisi olarak ifade edilen ve kendisini mevcut sistemler için bir alternatif gören alanın en önemli ve merkezi tezi ahlakın içsel bir mekanizma olarak birey, aile, toplum ve ekonomik sistemi değiştirici ve inşacı bir sürecin parçası olduğudur. Bu anlayışın temel önermesi, ahlakın diğer ekonomik, toplumsal, hukuki ve siyasal bileşenlerle iç içe olduğu şeklindedir. Böylece kapitalizmin üretmiş olduğu gibi sorunlar karşısında, İslam ekonomisi kendi ahlak esasları etrafında bir sosyo-ekonomi, hukuk ve siyasal sistem oluşturmayı öngörmektedir. Bu çalışmada, kapitalizmde ahlakın yeri, işlevi ve dönüşümü karşısında İslam ekonomisinde ahlakın merkezi ve kurucu rolü politik ekonomik bir karşılaştırma içerisinde sunulmaya çalışılmaktadır."
