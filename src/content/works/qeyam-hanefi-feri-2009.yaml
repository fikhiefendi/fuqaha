abstract: "Bu çalışmada aile hukukunun tamamını değil de onun önemli bir bölümünü teşkil eden talak yani evliliğin sona ermesi konusu ve bundan doğan neticeler incelendi. Çalışmanın muhtevasını, bir giriş ve iki bölüm oluşturmaktadır. Birinci bölümde evliliğin sona erme şekilleri Afgan hukuku esas alınarak, Hanefî ve Ca'ferî mezhepleriyle mukayeseli olarak mütalaa edilmiştir. İkinci bölümde ise, evliliğin sona ermesinden doğan neticeler aynı metot ile ele alınmıştır. Kısa bir değerlendirme yani sonuç ile çalışma tamamlanmıştır.Afgan hukuku, genel manada Hanefî mezhebine dayandığı için evliliğin sona ermesi ile ilgili hükümlerde ekseriyetle bu mezhebin müfta bih olan görüşlerine uymuştur. Bazen de Kanun'da Hanefî mezhebi içerisindeki çoğunluğun değil de azınlığın görüşü benimsenmiştir. Zaman zaman tamamen Hanefî mezhebinin görüşünün dışına çıkarak ilgili konuda daha esnek olan Mâlikî mezhebinin görüşlerine yer vermiş ve hükmü de ona göre koymuştur. Bazı durumlarda Hanbelî mezhebinin görüşünü benimseyerek düzenlemeyi ona göre yapmıştır. Bazı durumlarda da bu mezheplerin de dışına çıkarak o topraklarda yaşayan insanların problemlerini göz önünde bulundurarak orijinal bir içtihat de ortaya koymuştur. Araştırmamızın dar çerçevesi ile kayıtlı olarak şunu da belirtelim ki, Afgan Medenî Kanunu, Ca'ferî mezhebinden istifade etmemiş ve onun herhangi bir hükmünü kanun maddesi haline getirmemiştir."
