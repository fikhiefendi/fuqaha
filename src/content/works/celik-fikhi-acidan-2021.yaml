abstract: "Garanti konusu, modern dönem İslam dünyası üzerinde en fazla tartışma yapılmış fıkıh problemlerinden biri olmasına rağmen konu ne modern hukukta ne de İslam hukukunda tatminkâr bir çözüme ulaştırılabilmiş değildir. Garanti sözleşmesi, muhataba güven vermeyi amaçlayan özel hukuk muamelelerinden birini oluşturur. Garanti sözleşmesi, Türk Hukuku'nda ayrı ve özel bir kanunla düzenlenmemiş olup, modern hukukçular tarafından kanundaki üçüncü kişinin fiilini üstlenme niteliğinde sayılmıştır. Bu çalışmanın amacı, ülkemizde yaygın olarak kullanılan garanti sözleşmesi sistemini İslam Hukuku açısından değerlendirmek ve garanti sözleşmesi konusunda oluşan bilince destek olmaktır. Dünya'da Müslüman nüfusunun doğal olarak artan talepleri vardır. Bu ihtiyaçlar teminat sözleşmeleri konusunu da kapsamaktadır. Ancak bu sözleşmelerin İslam'ın temel yasaklarıyla çatışmaması gerekmektedir. Çalışma, garanti sözleşmesi konusunda olduğu kadar, Fıkıh ve İslâmî finansın diğer modelleri ile de ilgilidir."
