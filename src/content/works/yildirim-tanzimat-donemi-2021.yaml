abstract: "Çalışmada şahıslara karşı suçlar Tanzimat dönemi Osmanlı ceza hukuku bakımından ele alınmıştır. Tarihi sürece bakıldığında şahsa karşı suçlar ve cezaların, her devlette olduğu gibi Osmanlı Devleti'nde de çok eskiden beri mevcut olduğu görülmektedir. Ancak literatürde çalışma konusu suçlara ilişkin olarak Tanzimat dönemi Osmanlı ceza hukuku açısından detaylı ve kapsamlı bir çalışmaya rastlanılamamıştır. Somut vakalardan yola çıkarak soyut yaklaşımlarla ilintili olarak değerlendirmeler yapılmış ve literatürdeki boşluk az da olsa doldurulmaya çalışılmıştır. Çalışmada fermanlar, ceza kanunnameleri, dönemin hukukçuları tarafından hazırlanan ceza kanunu şerhleri ve arşiv belgeleri gibi birinci el kaynakların kullanımına özen gösterilmiştir. Bunun yanı sıra öğretide yer alan eserlerden de istifade edilmiştir. Yapılan araştırmalar neticesinde varılan sonuçlar şunlardır: Tanzimat döneminde yayınlanan 1840, 1851 ve 1858 Ceza Kanunnamelerinin tez konumuz olan suç tipleri açısından topyekün olarak değerlendirildiğinde birbirlerini olabildiğince tamamlama gayreti içerisinde olduğu görülmüştür. Ceza Kanunnamelerinin yürürlükte olduğu dönemdeki normatif boşluk İslam hukuku kurallarının uygulanmasıyla doldurulmuştur. Çalışmanın konusu olan şahsa karşı suçlar açısından bakıldığında İslam hukukundaki teori ile Tanzimat dönemi Osmanlı ceza hukuku pratiğinin birbiri ile uyum içerisinde olduğu ve buna ilişkin düzenlemeler getirildiği tespit edilmiştir. Ayrıca Ceza Kanunnamelerinin hükümleri ile İslam hukuku kurallarının hukukun uygulayıcıları olan kadılar tarafından anılan suç tiplerine dikkatlice uygulandığı görülmektedir."
