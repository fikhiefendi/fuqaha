abstract: "ÖZET Bu çalışma E.Hamdi Yazır'a ait İslam Ahkamının metodundaki yorumu temel almak üzere hazırlandı. Kendimize onun İslam Hukuku Usulünü yorumlamada farklı görüşü olup olmadığını sorduk. Bu soru onun seferilik gibi özel düşüncelerinin var olmasından kaynaklanıyordu.Fakat bu noktada belirtmeliyiz ki onun ortaya koyduğu düşünceleri araştırmamızın tek nedeni bu değildir. Buna bağlı olarak bu asrın en önemli şahsiyetlerinden biri olduğunu söyleyebiliriz. O meşhur“Hak Dini Kur' an Dili”tefsirini yazdı ve bu eser son zamanların en önemli eserlerinden biri oldu. Herkesin de bildiği gibi bu eser pek çok düşünce ve fikri ihtiva etmektedir. Ayrıca şunu da belirtmeliyiz tüm bu düşünceler kendi zamanıyla ilgili olarak ortaya koyulmuştur ki bu da onları en az kendileri kadar değerli kılmaktadır. O'nun bu düşüncelerini nasıl oluşturduğunu ortaya çıkarmak için bir çalışma yapmanın metodik yolunun bilinmesi gerekliydi. Biz de onun islam hukuku usulünü anlamadaki yöntemini araştırdık. Çünki E.Hamdi Yazır düşüncelerini İslam Hukuk sistemine dayalı olarak oluşturmuştur. Araştırmamızın başlangıç noktası E.Hamdi Yazır'ın hayatı oldu.Hayatı üzerinde çalışırken edinmiş olduğum bilgiler,onun ilmi seviyesini tespitte ve hukuk alanındaki yetkinliğinde belirleyici unsurlar olabilmiştir.Bir şahsın en iyi anlaşılmasının yolu yaşadığı dönemi ve her türlü siyasi, kültürel ortamı iyi anlamaktan geçtiğini düşünerek E.Hamdi Yazır'ın yaşadığı döneme ait malumatıda edinmeye çalıştım.Ancak tezimizin kapsamının sınırlı olması dolayısıyla bu malumatı oldukça kısa bir şekilde giriş bölümünde aktardık.Hayatını, özelliklerini,ilmi kişiliğini,tezimizin ana kaynağı olan“Hak Dini Kur'an Dili”tefsirini ve bu tefsiri yazarken istifade ettiği kaynakları ardından da diğer eserleri hakkındaki kısaca bilgiyi birinci bölümümüzde anlatmaya çalıştık.İşte bu bölümü hazırlama safhasında ikinci bölümümün başlığı olan“Bir İslam Hukukçusu Olarak E.Hamdi Yazır”kanaati bende iyice pekişmiş oldu ve bu kanaatimle ilgili görüşlerimi desteklemek için E.Hamdi Yazır'ın kendi döneminde yazmış olduğu pek çok makaleyi inceledim.İnceleme safhasında E.Hamdi Yazır'ın araştırmamın konusunu da alakadar edebilecek olan pek çok meseleye değinmiş olduğunu tespit ettim ve bu tespitlerimi bu ikinci bölümde ele almayı uygun gördüm. Böylelikle onun hem hukuk konusundaki vukufiyetini gözler önüne sermiş olacak hem de ahkam ayetleriniyorumlamada metodunun geneline ait bir takım meselelere de değinmiş olacaktım. E.Hamdi Yazır'ınahkam ayetlerini yorumlama metoduna değinmiş olduğum çalışmamın üçüncü bölümüne gelince;o'nun asıl görüşlerini yansıtan büyük eseri“Hak Dini Kur'an Dili”nde ele aldığı meselelerden yola çıkarak ahkam ayetlerini yorumlarken ortaya koymuş olduğu metodunun çerçevesini belirlemeye çalıştım.Bunun için öncelikle bu metodla alakalı olan fıkıh ve usûlüne ait bir takım kavramlara yüklemiş olduğu anlamları zikrettim. Sıra çalışmamın asıl gayesi olan kaynaklardan hüküm çıkartma metodlarına gelmişti ki E.Hamdi Yazır'ın bu konuyla ilgili olan görüşleri üzerinde büyük bir önemle durdum.Çalışmamın E.Hamdi Yazır'a ait bir usûl kitabım değil de tefsirini temel almış olması birtakım güçlükleri beraberinde getirdi ancak,çeşitli vesilelerle usûle ait kavramları ele almış olmasından istifade ederek o 'nun metoduyla ilgili görüşlerini nakletme imkanınada sahip olabildim.Zira üçüncü bölümde hem fıkhın kaynaklarını ve bu kaynakların kapsamında kalan konuları, hemde lafız ve delalet yollarını böylelikle işlemiş oldum. Çalışmamın asıl maksadı olan E.Hamdi Yazır'ın metodunu tanıyıp açıkladıktan sonra o 'nun tefsirindeki fur'u meselelerinden bazılarını inceleme duydum.Çünkü o 'nun bu görüşleri sayesinde E.Hamdi Yazır'ın metodunun tatbikini öğrenme imkanına sahip olunabilecek hemde ortaya koymuş olduğu çözümlerden yola çıkarak meseleleri kavrayışında üstün muhakeme kabiliyeti anlaşılmış olunacaktı.Herşeyden de önemlisi E.Hamdi Yazır'm kitap ve sünnetten ayrılmayarak zamanının icaplannı kavrayıp gözönünde bulundurdukları böylelikle belirtilmiş oldu. VI"
