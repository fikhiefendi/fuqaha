abstract: "Hicrî dördüncü yüzyılda yaşamış muhaddis ve fakîh kimliği ile ön plana çıkan İbn Hibbân (ö. 354/965) yaşadığı dönem ve sonraki dönemlerde gerek muhaddis kimliği ile gerekse de kendine has üslup ve metotlarıyla dikkatleri üzerine çekmeyi başarmıştır. Hadis alanında olduğu kadar fıkıh alanında da etkin olan İbn Hibbân özellikle fıkhu'l-hadis ilminde adından söz edilen bir muhaddistir. Onun fıkhu'l-hadis ilmindeki maharetinin en büyük göstergesi hiç şüphesiz sahih hadisleri toplamayı hedeflediği ve sahîh adıyla kaleme alınan eserlerin sonuncusu olarak kabul edilen el-Müsnedü's-sahîh 'ala't-tekâsîm ve'l-envâ' adlı eseridir. İbn Hibbân bu eserini alışık olunan tarzdan çok farklı bir üslupla kaleme almıştır. Bu eserinde İbn Hibbân muhaddislerin hadislerin fıkhına vakıf olduklarını ve yalnızca hadislerin isnadlarıyla iştigal olmadıklarını, bilakis hadislerin anlaşılması için gereken gayreti gösterdiklerini ispat etmeye çalışmıştır. Fakîh olması hasebiyle hüküm elde ederken usûl-i fıkıh yöntemlerine başvuran İbn Hibbân hadise olan bağlılığı ile fıkıh metodolojisini bir arada harmanlayarak fıkhu'l-hadis ilmini muhaddisler nezdinde ileri seviyelere taşımıştır. Zira İbn Hibbân eserine hadis kaydederken bir muhaddis gözüyle bakmış ve hadisleri yorumlayıp değerlendirirken de fakîh nazarıyla hadislere yaklaşmıştır. İbn Hibbân ehl-i hadise mensup bir âlim olarak hüküm istinbât ederken olabildiğince haberlere bağlı kalarak hadis merkezli bir fıkıh inşa etme gayreti içerisinde olmuştur. Bu yüzden İbn Hibbân fıkha dair kendine has, farklı ve dikkat çekici görüşlere sahip olmuştur."
