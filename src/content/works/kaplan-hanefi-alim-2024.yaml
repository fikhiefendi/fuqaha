abstract: "Yapmış olduğum bu çalışma iki değerli âlim İmam Matüridî ve imam Ebû Câfer et -Tahavi´nin Allah´ın sıfatları ve Kelâmullah hakkındaki görüşlerini mukayese etmeye yönelik bir yüksek lisans tezidir. Allah´ın sıfatları konusu Kelâm'ın ana meselelerinden biri olmuş, mezhepler ve âlimlerce yorumlanmaya çalışılmıştır. Bu sıfatlar Allah´ın zati, subuti, haberi ve fiili sıfatları olarak belirli gruplandırmalara tabi tutulmuştur. İmam Ebû Câfer et Tahavibu konuları yorumlarken naslarda yer alan şekilleri itibariyle ele almış, üzerine yorumlar yapmayı doğru bulmamıştır. Kendisi İmam Ebû Hanîfe çizgisinde yer alan bir âlim olduğundan onun görüşlerine katılmakla beraber kendi görüşleriyle ortaya bir şeyler çıkarmaya çalışmıştır. Çalışmamızın içeriğinde yer aldığı şekliyle nasslara dayanarak bu konu hakkındaki görüşlerini ortaya koymuştur. O, Allah´ın sıfatları ve Kelâmullah hakkında görüşlerini belirtirken akli ve nakli delillerle temellendirmeye çalışmıştır. Yapmış olduğu sentezlerle görüşlerini karşı tarafa akılcı bir şekilde benimsetme yoluna gitmiştir. İki âlimin görüşlerini mukayese ederken görüyoruz ki her ne kadar Tahavi nakli delillere daha fazla yer vermişse de ikisi de genel olarak aynı doğrultuda yorumlar yapmıştır."
