abstract: "Şer'iyye sicillerini, toplumumuzun sosyal yapısını ortaya koyan belgeler olarak değerlendirebiliriz. Bu kayıtlar kaydedildikleri dönemin sosyal, kültürel ve hukuki durumu ile dönemin toplumunun ahlaki yapısı hakkında önemli bilgileri içerir. Şer'iyye sicillerinden yararlanılarak Osmanlı şehir yapısı ile alakalı genelleme ve tespitler yapılabilmektedir. Bu çalışmamızda 1754 numaralı Çorum Şer'iyye sicili esas alınarak Çorum şehrinin H.1242-1253/ M. 1826-1838 tarihleri arasındaki sosyal ve ekonomik durumu ortaya çıkarılmaya çalışılmıştır. Araştırma sürecinde metinlerin transkripsiyonu ve tasniflemesi yapılmış ve bu doğrultuda Çorum'un sosyal ve ekonomik hayatı tasvir edilmeye çalışılmıştır."
