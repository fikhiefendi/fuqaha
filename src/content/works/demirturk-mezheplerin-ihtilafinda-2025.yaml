abstract: "Fıkıh âlimleri hadisleri değerlendirirken metin, sened, bağlam ve diğer şer'î kaynaklarla olan ilişkisini dikkate alarak çeşitli metodolojik yaklaşımlar geliştirmişlerdir. Hadislerin tespiti ve anlaşılmasındaki bu metot farklılıkları, farklı fıkhî görüşlerin ortaya çıkmasına sebep olmuştur. İbn Rüşd'ün (öl. 595/1198) telif ettiği Bidâyetü'l-müctehid ve nihâyetü'l-muktesid isimli eseri fıkhın temel meselelerini içine alacak şekilde fukahanın ittifak ve ihtilâf ettiği meselelerden bahsetmesinin yanı sıra bu ihtilâfların arka planını açıklaması bakımından önemli bir yere sahiptir. Bu araştırmada İbn Rüşd'ün Bidâyetü'l-müctehid kitabı özelinde müctehidlerin hadis kültürü ve usûlünden kaynaklanan fıkhî ihtilâfları incelenmiştir. Ayrıca İbn Rüşd'ün hadis anlayışı ve hadislerle ilgili değerlendirmelerine yer verilmiştir. Araştırmanın giriş bölümünde konu ile ilgili çalışmalar ayrıntılı bir şekilde ele alınmıştır. İkinci bölümde ahkâm hadisleri ile fıkıh ilminin irtibatı irdelenmiş, Hz. Peygamber (s.a.v) döneminden mezhep imamları dönemine kadar uzanan süreçte hadis ilminin fıkhî ihtilâflara etkisi incelenmiştir. İbn Rüşd'ün ilmî kişiliği, hadis anlayışı ve hadis ilmi ile ilgili değerlendirmelerinden bahsedilmiştir. Üçüncü bölümde hadis kültürü ve usûlünden kaynaklanan fıkhî ihtilâflar ele alınmıştır. Dördüncü bölümde ise müctehidlerin usûlünden kaynaklanan fıkhî ihtilâflardan bahsedilmiştir. Bidâyetü'l-müctehid'de hadis kültürü ve usûlünden kaynaklanan fıkhî ihtilâflar başlıklar halinde tespit edilip usûl ve fıkıh kitaplarından istifade edilmiş, ardından tespit edilen örneklerden önemli görülenler tercih edilerek meseleler izah edilmiştir. Böylece müctehidlerin hadis kültürü ve usûlünden kaynaklanan fıkhî ihtilâflarının Bidâyetü'l-müctehid çerçevesinde tespit ve tahlil edilmesi hedeflenmiştir. Tespit edilen örneklerin incelenmesi neticesinde müctehidlerin hadisleri tespit ve değerlendirme hususundaki farklı yaklaşımlarının birçok fıkhî ihtilâfa neden olduğu ortaya çıkmıştır. Bu ihtilâfların; hadislerin bilinmemesi, sıhhatinin tespitindeki ictihad farklılıkları, hadislerin delâletinin yorumlanmasındaki yöntem ayrılıkları, hadislerin delillerle teâruzu ve teâruzun giderilmesi aşamasındaki çözüm metodlarındaki farklılıklardan kaynaklandığı görülmüştür. Bu sebepler arasında fıkhî ihtilâflar üzerinde en çok etkili olan sebebin hadislerin delillerle teâruzu olduğu sonucuna varılmıştır."
