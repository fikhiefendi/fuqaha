abstract: "Bir Müslüman âlimin, şeriata uygunluk ve riayetin empoze edilmesini sağlama meşru ilkesine dayalı olarak, hayat değişip karmaşıklaştıkça ve kendi yönlerinde yolsuzluk ortaya çıktıkça, millete ve hatta bir bütün olarak insanlığa karşı bir görev çizgisi endişesi artar, bu çok ileri gitmedi ve her aksilikte bir son sözün olduğu inancıyla. Dolayısıyla, evrenin mimarisine katılma ve icra etme fikri, miras yoluyla zenginleşmiş, İslami bir vakıf, birçok yönden her zaman önde olmuştur ve esaslarda boylamsal bir eli olmuştur ve herhangi bir amacı olmayan yeniliklere sahip olmuştur. Bir önceki ek örneği, yani geriye kalan meşru hükümler ile ehl-i imanın birleştirilmesiyle olur Bu nedenle, üretim araçlarının mortmain“Vakf”biçiminde taşınırın durdurulmasını, ölü arazinin kullanımını yeniden canlandırmanın haklılığı ile birleştirme fikri,“Vakf”mortmainin yasallığı konusunda hukukçular arasında bir anlaşmazlık yoktur. ve diriliş, Yeni olan, her ikisinden de bilgeliğin elde edildiği meşruiyet kabul edilebilir yollarla onları bir araya getirmektir, Bu, bu karışıma uyan Şeriat kontrollerini gerektirir ve araştırmacı, mahallelerin meşruiyetini ve Devlet yönetiminin evrimini gözden kaçırmamıştır, ancak bu bölümün özü, çıktının ulusun bir birey, kurum veya Devlet olarak yeteneğine eklenmesidir. Araştırmacıya göre, üretim araçlarının mortmain“Vakfı”ile çorak yetiştirme arasındaki bağlantıya dair bir çalışma yoktur. belirli kişilerin ülkesi, şeriat kuralları, usulüne uygun kurallar ve imamların ve hukukçuların üretim araçlarıyla ilgili yaşam deneyimlerine dayanan görüşleri, bilgin Allah'a hamdolsun, ölü toprakları canlandırmak için üretim araçlarına bir mortmain“Vakfı”yaratmak için bütünleşik bir hukuki ve operasyonel konsept ortaya çıkarmıştır, Nerede sebepler ve araçlar bulursa, kullanımı canlandıracak bir gerçeklik olacaktır. Son olarak, bu kavram gerektiğinde geliştirilebilir ve artırılabilir, böylece belirli bir metodolojide çıkarları kontrol eden ve yozlaşmışları yönlendiren Şeriat kanununun esnekliği ve araştırmacılar bu özellikleri zeminde göstermelidir."
