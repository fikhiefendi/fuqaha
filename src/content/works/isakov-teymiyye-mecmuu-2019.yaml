abstract: "İbn Teymiyye'nin Mecmûu'l-Fetâvâ adlı eserinde tarih boyunca Yahudilik ve Hıristiyanlığı çok sert bir dille eleştirdiği konular yer almaktadır. Bu tez çalışmasında ise sadece İbn Teymiyye'nin Mecmûu'l-Fetâvâ adlı eseri değil el-Cevâbü's-Sahîh li Men Beddele Dîne'l-Mesîh ve er-Risâletü'l-Kıbrısiyye adlı eserlerinden de istifade edilerek Yahudilik ve Hıristiyanlığın öncelikle kutsal kitab'a nasıl sahip çıktıkları, kendilerine gönderilen peygamberlere nasıl icabet ettikleri ve kendilerine vahyedilen kitapta olmayan idddiaları işlenmektedir."
