abstract: "Bu çalışma, Osmanlı Hanefîliğinde ribh-i şer'înin kavramsal çerçevesini ve hukuki zeminini, ribh-i şer'îyi doğuran iki başlıca finansman modeli olan îne/muamele-i şer'iyye ve beyʿ bi'l-vefâ akitleri üzerinden inceler. Söz konusu iki işlem, ribadan kaçınma kaygısıyla kurgulanmış“hukukî çözümler”olmakla birlikte, mezhep içi serüvenleri ve meşruiyet zeminleri bakımından ayrışmaktadır. Araştırma, Hanefî literatürünün farklı yazın türlerini (şerh, haşiye, vâkıât/fetva mecmuaları, risâle) dönemsel bir çizgide tarayarak bu akitlerin gelişimini analiz etmektedir. 18. yüzyıl öncesine ait Osmanlı fıkıh literatürü ve şeyhülislam fetvaları üzerinden her iki akdin hükmüne ve işleyişine dair boyutları tasnif edilerek sunulmuş; özellikle muamelede ribhin tahakkuku, ispatı, tazmini ve vakıf paralarının işletilmesi gibi alt sorun alanları örnek fetvalarla tartışılmıştır. Çalışmanın bulguları, îne akdinin Hanefî uleması tarafından caiz ancak mekruh olduğunun görüldüğünü ortaya koymaktadır. Aynı zamanda, Osmanlı ulemasının bu akde dair değerlendirmelerinde, akdin mekruhluğunun dile getirilmesi konusunda belirgin bir zayıflama olduğu ve îne akdini muamele-i şer'iyye ile ilişkilendirmekten kaçındıkları görülmüştür. Vefâ akdi konusunda ise uzun süren ihtilaflar yaşanmış, ihtilaflara rağmen akit toplum için önemini korumuş ve nihayet kendine özgü hukuku olan ayrı bir işlem şekli olarak kabul edilmiştir. Bunlara ek olarak, Osmanlı sultanı tarafından sadır olan bir emirle bu akitlerden alınacak ribhin sınırlandırıldığı ve bunun fetvalara da konu olduğu tespit edilmiştir. Söz konusu emr-i şerifin uygulanabilmesi için gerekli hukukî zeminin, Ebussuud tarafından verilen iki farklı fetva ile aşamalı olarak inşa edilmesi süreci ayrıntılı olarak gösterilmiştir. Sonuç olarak çalışma, îne ve vefâ akitleri ekseninde Osmanlı Hanefîliğinin doktrinel süreklilik ve değişimlerini görünür kılmış; bununla birlikte, ribh-i şer'înin sınırlandırılması pratiği üzerinden kanun–fetva–fürû hattında norm üretim süreçlerinin nasıl işlediğini ortaya koymuştur."
