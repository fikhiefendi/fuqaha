abstract: "İmâm Şâfiî'nin cedîd görüşleri üzerinde şekillenen Şâfiî mezhebi, günümüze kadar muhtelif dönemlerden geçmiştir. Bu dönemlerden birisi hicrî 4. yüzyıldan sonra ortaya çıkan ve Nevevî'ye kadar devam eden süreçtir. Bu süreç içerisinde Şâfiî mezhebi, Irak ve Horasan bölgelerinde güçlenmiştir. Bu bölgelerde yaşayan Şâfiî fakihleri arasındaki mezhep aktarımındaki farklılıklar, mezhebi iki ayrı ekole ayırmıştır. Bu iki ekol arasındaki farklılıkların zamanla artması, bazı fakihleri bu iki ekolü birleştirme çabasına sevketmiştir. Bu iki ekolü birleştiren ve mezhep görüşünün (el-mezheb) tespitinde belirleyici konumda olan fakih, İmâm Nevevî (v. 676/1277) olmuştur. Nevevî'nin söz konusu eserleri incelendiğinde, onun doğrudan veya dolaylı olarak kendi döneminin Irak Şâfiî ekolünün temsilcisi konumundaki Ebû İshâk eş-Şîrâzî'nin Mühezzeb adlı eseri ile Horasan Şâfiî ekolünün önde gelen fakihi İmâmü'l-Harameyn el-Cüveynî'nin Nihâyetü'l-matlab adlı eserinden faydalandığı görülür. Bu tezde, adı geçen iki eser, nikâh bahsi bağlamında metot ve muhteva açısından karşılaştırılmaktadır. Nikâh bahsiyle sınırlanan bu çalışma, ilk olarak hicrî 5. yüzyılda yaşamış ve sonraki Şâfiî fakihleri üzerinde etkili olan iki fakihin entelektüel biyografilerini ele almaktadır. Bununla söz konusu fakihler ve metinleri arasındaki ilişki ve tarihsel bağlam tespiti hedeflenmektedir. Bu şekilde geleneğin sürekliliğini sağlayan iki temel dinamik (fakih-eser) ortaya konulduktan sonra Irak ve Horasan ekolleri, hoca talebe silsileri ve eserlerin nikâh bahisleri özelinde tarîk vecih kavramları izah edilerek kaynakları gösterilmektedir. Ardından eserlerin nikâh bahisleri önce muhteva sonra metot açısından karşılaştırılmaktadır. Bununla her iki fakihin fıkıh anlayışı ve mezhep algıları incelenerek Irak ve Horasan ekolleri arasındaki füru fıkıh yazımındaki farklıların tespiti hedeflenmektedir."
