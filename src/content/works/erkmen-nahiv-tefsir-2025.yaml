abstract: "Bu çalışmada, İslâm dininin temel kaynağı olan Kur'ân-ı Kerîm'in çeşitli sûre ve âyetleri, Mekkî b. Ebî Tâlib'in (ö. 437/1045) el-Hidâye adlı eserinde yer verdiği şekliyle dilsel açıdan ele alınmıştır. Müellifin âyetleri açıklarken İbn Mes'ûd (ö. 32/652-53), İbn Abbâs (ö. 68/687-88), Katâde b. Diâme (ö. 117/735) ve daha birçok sahabe, tabiin ve müfessirden aktarım yaptığı anlaşılmaktadır. Bununla birlikte, sık sık nahiv ilminin kurallarına başvurduğu ve bu kuralları kendi görüş ve düşüncesine bir delil ve dayanak olarak yorumladığı görülmektedir. Kur'ân tefsirinde nahiv ilminin etkisi var mıdır? Varsa bu etkinin düzeyi nedir? Müellif, hangi âyet türlerinde daha çok nahiv ilminden yararlanmıştır? Müellif, nahiv bilginlerinden hangilerine yer vermiştir? Nahiv ilminin kuralları, âyetlerin anlamını değiştirmede ne derece etkilidir? Bu ve benzeri konular Mekkî b. Ebî Tâlib'in el-Hidâye adlı eseri özelinde irdelenmiştir. Bu bağlamda eserde nahiv-tefsir ilişkisini yansıtan çok sayıda örnek tespit edilmiştir. Örnekler kategorize edilerek ilgili bölüm ve başlıklar altında değerlendirilmeye tabi tutulmuştur. el-Hidâye ile birlikte, dokümantasyon yöntemi ile çok sayıda nahiv ve tefsir ilmine ait eser incelenmiştir. Bu eserlerdeki görüşler ile müellifin nahiv ilmi aracılığıyla ulaştığı anlamlar karşılaştırılmıştır. Mekkî b. Ebî Tâlib'in âyetler hakkındaki dilsel açıklamaları, genellikle klasik dönemin önde gelen dilcilerinin nahiv ilmine dair görüşleriyle uyumlu olduğu anlaşılmaktadır. Bununla birlikte, Mekkî'nin nahiv ilmi aracılığıyla âyetlerden daha önceki müfessirlerin değinmediği anlamlara ulaştığı görülmektedir. Kur'ân âyetleri tefsir edilirken nahiv bilmenin gerekliliğine ve bu ilmin tefsir ilmine olan katkısının hangi düzeyde olduğunu göstermesi açısından çalışmanın önemli bir boşluğu dolduracağı düşünülmektedir."
