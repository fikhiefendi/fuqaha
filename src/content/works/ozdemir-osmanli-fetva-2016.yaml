abstract: "Klasik fetva mecmuaları Osmanlı tıbbi yaşamına, dönemin sağlık standartlarına ve tıbbi birikime dair bilgiler sunan tarihi birer vesika niteliği taşımaktadır. İlgili mecmualar Osmanlı toplumunun günlük hayatta karşılaştığı tıbbi sorunların dini ilgilendiren yönünü ve bu problemlere din adamları tarafından sunulan çözümleri yansıtan pek çok fetvayı dağınık halde ve çeşitli başlıklar altında içermektedir. Bu çalışmada 16-19. yüzyıl Osmanlısına ait temsil gücü yüksek bazı fetva mecmualarının incelenerek Osmanlı tıp pratiği ve fetvalar arasındaki karşılıklı etkileşimin ortaya konması hedeflenmiştir. Bu amaçla sağlık hizmetleri, insan bedeni, hastalıklar ve tedaviler şeklinde sistematize edilen başlıklar altında ilgili fetvaların tasviri olarak sunulmasının yanı sıra fetvalar Osmanlı tıp tarihi ve İslam hukuku açısından da yorumlanmış ve analiz edilmiştir."
