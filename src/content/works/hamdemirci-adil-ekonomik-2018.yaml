abstract: "Bu çalışma kapsamında referansını İslam'dan alan, Adil Ekonomik Düzen'in faizsiz kredi sisteminin ekonomiye adapte edilerek fertler ve devletler bazında faiz yükünden kurtularak kredi ihtiyacının karşılanması amaçlanmıştır. Erbakan'ın oluşturduğu bu kredi ilkelerinin uygulanabilirliği noktasında günümüzde ki benzer uygulamalarla karşılaştırılması hedeflenmiştir. Bu ilkeler geliştirilerek kredi kullananlara maddi manevi yük getirmeden Adil Ekonomik Düzen içerisinde faizden uzak bir kredi sistemi oluşturma çabaları devam edecektir. Günümüz insanlığı, hâkim iktisadi görüşün yaptığı iktisadi tanımlar ve uygulamalar neticesinde fıtratına uygun olmayan bir ekonomik yaşantının içine itilmekte ve buhranlara sürüklenmektedir. İhtiyaçların sınırsız olarak kabul edilmesi insanları bencilleştirmekte ve daha çok servet sahibi olmak adına, emeğin sömürüldüğü, faizin yaygınlaştırıldığı bir düzeni beraberinde getirmektedir. Yaratan'ın Kur'an-ı Kerimdeki emirlerinin tersi istikamette uygulanan bu iktisadi uygulama dünya çapında krizlerin yaşanmasına sebep olmuştur. Bununla birlikte işsizliğin artması, adaletsizliklerin ortaya çıkması, suç oranlarının artması gibi olumsuzluklar baş göstermiştir. Bu durum hâkimiyetini devam ettiren iktisadi görüşün tartışılmasını beraberinde getirmiş ve yeni bir ekonomik anlayışa şiddetle ihtiyaç duyulduğu ortaya çıkmıştır. Erbakan bu noktada çalışmalar başlatmış ve“Adil Ekonomik Düzen”adı altında günümüz şartlarına uygun, İslam referanslı bir iktisadi düzen oluşturmuştur. Erbakan maddi kalkınmanın yanında manevi kalkınmanın gerekliliğini de şiddetle savunmuştur. Kapitalizm ve sosyalizm manevi kalkınmaya önem vermemeleri yüzünden çıkmaza girdiklerini ifade eden Erbakan, çalışmayı ibadet sayarak ahlaken ve manen yücelmiş, her gün bir önceki günden daha fazla üretim yapmayı düşünen nesillerle gerçek kalkınmanın olabileceğini söylemektedir. İslam'ın ilk yıllarında manen yükselen insanlık, cahiliye dönemindeki tüm ahlaksızlıkları ve haram kılınan faizi reddetmiş, kardeşlik hukukunu tesis etmiş ve yardımlaşmanın en güzel örneklerini uygulayarak, ortaklıklar, karz-ı hasen, mudarebe gibi kredi sağlama imkânlarını geliştirmiştir. Hz. Ömer zamanında devlet hazinesinden tüccarlara kredi sağlanmış, ticari faaliyetlerden elde edilen kâr/zarar devlet ve tüccarlar arasında paylaştırılmıştır. Emevi, Abbasi, Selçuklu ve Osmanlı dönemlerinde kredi sistemleri gelişerek müesseseleşmiştir. Erbakan, kredinin bu tarihi sürecini dikkate alarak, günümüze uygun, İslam Ekonomisi referanslı, Ortaklıklar, Hakkı Müktesep Karşılığı, Emek Karşılığı, Rehin Karşılığı, Ödenmiş Vergi Karşılığı, Yatırım Projesi Karşılığı ve Selem Senedi Karşılığı Kredi İlkeleri olarak yedi tane faizsiz kredi sistemi geliştirmiştir. Özel Sektörde Gümüş Motor örneği ile uygulamış olup, devlet bazında koalisyon ortaklıkları dönemlerinde bu kredi ilkelerini olabildiğince uygulama safhasına geçirmeye çalışmıştır."
