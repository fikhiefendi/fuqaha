abstract: "Tasavvuf, dinin üç seviyesinden biridir. Bunlar İslam, iman ve ihsan. Fıkıh, İslam hukukunun öğretileri ve iman olarak akaid ile ilgili olduğu gibi, Tasavvuf da, İslam'ın iki şartından sonra İslam dininin üçüncü direği olan ihsan makamını gerçekleştirmekle ilgilendi. Bu, kalp temizliği, nefis terbiyesi, güzel ahlâk, onları kötülüklerden arındırma ve faziletlerle süsleme makamıdır. İslam dünyasında zühd ve ibadetin yoğunluğu ile karakterize edilen tasavvuf hareketi, H. 3. yüzyılda yayıldı ve daha sonra tasavvuf tarikatları olarak bilinen hareketlere dönüşene kadar gelişti. Bu araştırma tasavvufu ve özellikle Şâzelî tarikatını ele almaktadır. Bu bağlamda, Ebü'l-Hasan el- Şâzelî'nin hayatı, en önemli nitelikleri ve nasıl eğitim aldığı hakkında kısa bir genel bakış ile nasıl yükseldiğinden bahsettim. Ayrıca onun tasavvufa yaklaşımının önemine ve tasavvuf hakkındaki birçok sapkın ve hatalı fikirlerin düzeltilmesine olan etkisine dair bir açıklama getirdim. Bu yaklaşımın etkisinin ortaya çıkışı, her ikisi de bu mezhebin şeyhlerinden olan İbn Atâullah el-İskenderî tarafından yazılan el-Ḥikemü'l-ʿAtâʾiyye ve Ahmed Zerrûk'un Tasavvuf kurallarına dayanmaktadır."
