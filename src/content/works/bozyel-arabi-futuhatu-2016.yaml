abstract: "İbn Arabî, gerek yaşadığı dönemde gerekse vefatından yüzyıllar sonra bile geniş kitlelerin dikkatini çeken, lehinde ve aleyhinde pek çok şey söylenen ender âlimlerden biridir. Düşüncelerini en geniş şekilde ele aldığı el-Fütûhâtü'l-Mekkiyye, fıkıh alanı dâhil olmak üzere birçok ilim hakkında zengin bilgiler içeren bir eserdir. Çalışmamızın amacı sûfî bir fakih olarak İbn Arabî'nin Fütûhât eserindeki fıkhi görüşlerini değerlendirmektir."
