abstract: "Afganistan'daki İslâmî bankacılık uygulamalarının fıkhı açısından değerlendirmesini yaptığımız bu araştırmada, Afganistan'daki İslâmî bankaların işleyiş şekillerinin daha iyi anlaşılabilmesi için İslâmî bankacılıkla ilgili kanun ve yönetmeliklerin fıkhın ilke ve amaçlarına göre yapılıp yapılmadığını ve İslâmî bankaların bu kanunlara göre hareket edip etmediğini tespit etmeye çalıştık. Tez hazırlarken Afganistan'da İslâmî bankacılık uygulamalarını fıkhî yönden inceleyen bir araştırmaya rastlayamadık dolaysıyla bu tezin kendi alanında bir ilk olduğunu söyleyebiliriz. Afganistan'da otuz seneden fazla süren iç çatışmalar zamanında bankacılık sistemi çalışamaz hale gelmiştir. 2002 yılında uluslararası güçlerin ülkeyi işgal etmesiyle bir müddet iç çatışmalar son bulmuş ve yıkılan devlet düzenini tekrar kurma çalışmaları başlatılmıştır. Bu doğrultuda Afganistan bankacılık sektörünü uluslararası standartlara uygun bir şekilde çalışır hale getirtmek için 2003 yılında 101 maddelik bankacılık kanunu yayınlanmıştır. bu kanunun 3. maddesinde Merkez Bankası'na, bankaların hangi tür faaliyetleri yürütebileceklerine dair düzenleme yapma yetkisi verilmiştir. Merkez Bankası da kendisine tanınan bu yetkiyi kullanarak bankaların pencere sistemi şeklinde İslâmî bankacılık faaliyeti de yürütmelerine imkân tanımıştır. İlerleyen süreçte, İslami bankacılık ile ilgili düzenleme kanunlarda açıkça zikredilmediği için, İslâmî bankacılık sisteminin gelişim gösteremediği görülmüştür. Bu eksikliğin giderilmesi gayesiyle 2015 yılında yenilenen bankacılık kanununa, İslâmî bankacılığın nasıl yapılacağına dair düzenlemeler de eklenmiştir."
