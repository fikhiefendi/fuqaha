abstract: "Sükût, insan hayatının her aşamasında kendini hissettiren, zorunluluk ya da ihtiyaç sebebiyle ortaya çıkan bir durumdur. Hukuka konu olma bakımından da önemi dikkat çeken sükût hem ibadet hem muamelat hem de ceza hukuku bakımından karşılığı olup, sonuç doğuran bir kavramdır. Sükûtun İslam hukuku açısından önemine dair çalışmalar oldukça sınırlı kalmıştır. Bahse konu yönleri ön plana çıkarılarak son dönem fıkıh literatüründe ve lisansüstü çalışmalarda yeteri kadar yer bulamamış olsa da güncelliğini muhafaza eden bir konudur. Yapılan çalışmalarda sükût tek bir yönüyle ele alınmış olup bunlar da bir bütünlük içerisinde araştırmacıya akademik veri sağlamaktan uzaktır. Borçlar hukuku, ceza hukuku alanlarındaki çalışmalarda ise sükûtun etki alanına ve hüküm değerine değinilmemiştir. İnsan için asıl olan eğer bir mâni, mazeret durumu yoksa iradesini sarih söz ile ifade etmesidir. Bu sebepledir ki ifadenin sarih sözle olmadığı yerde kişinin sükûtuna; haksızlığın, aldatma ya da aldanmanın, akitlerin sıhhatli kurulmasının ve hak kayıplarının önüne geçme düşüncesiyle anlam yükleme ihtiyacı hasıl olmuştur. Dolayısıyla“sakite bir söz isnad olunmaz, lâkin ma'rız-ı hacette sükût beyandır”kaidesi gereği sükût temelde bir eylemsizlik olarak görülse de ehliyet sahibi kişinin konuşmasına ihtiyaç duyulan yerde susması karineler doğrultusunda beyan ve rıza olarak yorumlanmıştır. Sükût bu doğrultuda bazen kazanç, bazen dava hakkının düşmesi, bazen cezai infazın düşmesi gibi dünyevi sorumlulukların ortadan kalkması şeklinde sonuçlar doğurmuştur. Fakat bu sorumluluğun diyaneten düştüğü anlamına gelmemektedir. Diğer taraftan şer'i deliller çerçevesinde bakıldığında sükûtta asıl olanın mübah olmasıdır. Ancak müdahil olduğu dava ve konusuna göre sükût hüküm bakımından mendûp, mekruh, haram veya vacip hükümlerini de alabildiği görülmüştür. Mükellef olan kişinin iradesini ve niyetini açıklamada sükûtun ne derece etkin olduğu hususu İslâm hukukçuları tarafından tartışılmış, akitlerin kurulması ile hukuki tasarrufların geçerlilik kazanması hususlarında sükût, karinelerle çevrelenmiş ve mücerret sükût olmak üzere iki kısımda ele alınmıştır. Karinelerle çevrelenmiş sükût ile mücerred sükût ayrımında her iki sükût halinin hüküm bakımından ne ifade etmesi gerektiği üzerinde durulmuştur. Bu sebeple irade beyanında sükûtun geçerli bir beyan türü olabilmesi için bazı şartlar ortaya konulmuştur. Bu şartlar; sükût eden kişinin sükûtun konusunu bilmesi, mükellef olması, irade beyânına engel bir durum bulunmaması, sükûtun başkasına yönelik bir zarara veya aldanmaya yol açmaması, sükûtun sarih söz ile teâruz etmemesi, soyut sükûtun beraberinde irâdeyi beyân edip açığa çıkaracak hallerin ve karînelerin bulunmasıdır."
