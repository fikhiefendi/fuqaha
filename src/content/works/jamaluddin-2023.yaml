abstract: "Dinde fıkıh, vazifelerin en belirgini ve ilimlerin en şereflisi olup, Cenab-ı Hakk'ın kullarını muvaffak kılma alametlerinden biridir. Seleften alim ve fakihlerin yapmaya çalıştığı şey bu hedefe ulaşmak olup, günümüze kadar da buna büyük önem vermişlerdir. Bunlardan biri olan İmam Şihabeddin Gürani,“Gayâtü'l-Emânî”adlı tefsirinde Kur'an'ın ahkam ile ilgili ayetlerini, kendisinden önceki alim ve fakihlerin metinlerini ve içtihatlarını kullanarak açıklamaya ve tefsir etmeye kendini adamıştır. Bu nakiller büyük bir malzeme oluşturmuş ve ibadetle ilgili fıkhî konuları tartışmak, Molla Gürani'nin seçimlerinde dayandığı kaynakları, kullandığı kelimeleri ve daha fazlasını ortaya çıkarmaya ihtiyaç duyar hale gelmiştir. Dolayısıyla ilmi bir ihtiyaç 'Molla Gürani'nin (Ö.893h) 'Gayetü'l-Emani' Adlı Tefsirindeki Fıkhi Tercihleri Bakara Suresindeki Hac ve Umre ile İlgili Hükümler: Fıkhi ve Karşılaştırmalı Çalışma' başlıklı çalışmayı meydana getirmemizi gerektirdi. Araştırmacı, çalışmasında üç temel yöntemden yararlanmıştır. Bunlardan tümevarım yötemi ile müellifin tefsirindeki metodunu ortaya çıkarmaya, Molla Gürani'nin Bakara Suresi'ndeki fıkhî tercihlerini belirleyerek onun tercih yöntemini görmeye çalışmış ve bunu hac ve umre ile ilgili ayetleri alt başlıklarda bir araya getirip çalışarak yapmayı hedeflemiştir. Tahlil yöntem, imamların fıkhi tercihlerini analiz etmeye ve bunları fıkhi delillerle ilişkilendirmeye dayanmaktadır. Son olarak karşılaştırma yöntemi ile de ilgili konuda tercih edilen görüşe ulaşabilmek için fıkhi deliller eşliğinde görüşler arasında bir dengeleme yapmak, Molla Gürani'nin Hanefi mezhebine uyan veya muhalefet eden görüşlerini beyan etmek ve kadim mezhebinden ne derece etkilendiğini ifade etmek hedeflenmiştir. Bunun yanında tezin doğal akışı bir mukaddime, hazırlık bölümü, iki fasil ve sonuçtan meydana gelmesini gerektirmiştir."
