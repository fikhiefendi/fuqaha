abstract: "Akitler, birden fazla irade açıklaması ile kurulan hukuki işlemlerdir. Özellikle insanlar arası ilişkilerin geliştiği ve çeşitlendiği günümüz modern dünyasında, birçok akit çeşidi gündeme gelmiş ve zaman içinde hukuki çerçevesi de oluşmuştur. Akitler konusunda hem hukuki hem de dini açıdan önem arz eden mesele, bir akdin kurulup hüküm ve sonuçlarını meydana getirmesidir. Hanefî mezhebi dışındaki çoğunluk, akdin kurulması ve hüküm ve sonuçlarını meydana getirmesini in'ikad ve sıhhat merhalelerinde ele almıştır. Hanefî mezhebinde ise bunlara ilaveten nefâz merhalesi de yer verilmiştir. Nefâz merhalesinde akitler ikiye ayrılır; nâfiz akitler ve gayri nâfiz yani mevkuf akitler. Mevkuf akit, hüküm ve sonuçlarını doğurması açısından yürürlüğü askıda olan akittir. Çalışmamızın ilk bölümünde genel olarak akit kavramına ve tasnifine yer vererek mevkuf akitlerin İslam hukuku akit sistematiğinde değerlendirilme şekli incelenmiştir. Daha sonra mevkuf akit teorisinin İslam hukukundaki diğer bazı müesseseler ile benzer ve farklı yönleri ele alınarak mevkuf akit teorisinin kendine özgü yapısı ortaya konulmuştur. İkinci bölümde ise mevkuf akit türlerinin bir kısmı kendi içinde gruplandırılmak suretiyle genel başlıklar altında, bir kısmı ise münferit başlıklar altında ele alınmıştır. Her iki bölümde de konu ele alınırken güncel Türk hukukundaki askıda hükümsüzlük ve iptal edilebilirlik müeyyideleri ile mukayese edilmiştir."
