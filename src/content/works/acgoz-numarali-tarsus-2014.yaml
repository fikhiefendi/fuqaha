abstract: "Bu Çalışma H.1247-1253/M.1831-1837 yılları arasını ihtiva eden 285 Numaralı Tarsus Şer'iyye Sicili'nin incelenmesinden oluşmaktadır. 285 Numaralı Tarsus Şer'iyye Sicili Osmanlıca metninin günümüz Türkçesine çevrilmesinde metne sadık kalındı, kelimeler değiştirilmeksizin cümle kuruluşları aynı şekilde verildi. Ana metin basit transkribe tekniği ile okundu. Metinde geçen Farsça, Arapça, Türkçe sıfat ve tamlamalar bu dillerin gramer kurallarına göre yazıldı. Osmanlıca metinde geçen, ayın harfi: (') işareti, hemze (elif) harfi: (') işareti, uzun a: â harfi, uzun i: î harfi, uzun u: û harfi ile yazıldı. Sicilde geçen 116 belgenin tamamının transkripsiyonu yapılarak değerlendirildi. Belgede yer alan hükümlerin özeti tablo halinde verildi. Çalışmamızın özet tablosu, defter hakkındaki bütün sorulara cevap verebilecek niteliktedir. Sicilde; verâset, vesâyet, mihir-boşanma, tereke taksimleri gibi konular yer almaktadır. Şer'iyye sicilleri kaydedildiği dönem hakkındaki en orijinal bilgileri içermektedir. Bu bilgiler ışığında dönemin sosyal, idarî, hukukî, iktisadî ve kültürel yapısı hakkında bilgilere ulaşmak mümkündür. Bu amaç doğrultusunda sicilde yer alan yer isimleri, devlet görevlilerinin isimleri, askerî görevlilerin isimleri birer birer tespit edildi. Yine sicilde geçen camii, medrese ve diğer dinî yapıların birer birer tespiti yapıldı. Sicilde dönemin soysal yapısı hakkında bilgiler verildi. Dönemin giyim-kuşamı ve kullanılan eşyaların tespiti yapıldı. Yine dönemin iktisadî yapısı hakkında genel bilgiler verilip meslek grupları, çarşıları, dükkânları, esnaf grupları, iskeleleri tespit edildi. Ayrıca dönemin eşya fiyatları ve hayvan fiyatlarına ulaşıldı."
