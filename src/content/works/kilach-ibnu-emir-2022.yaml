abstract: "Araştırmamız; giriş, üç bölüm ve sonuç kısmından meydana gelmektedir. Giriş ve birinci bölümde geniş bir biçimde fıkıh usûlünün tarifi yapılıp bu alanda yazılmış önemli eserler ve ekoller hakkında bilgi verildikten sonra Şârih İbn Emîru Hâc ve Müellif İbnü'l-Hümâm'ın biyografisi ele alınacaktır. İkinci bölümde asıl metin ve asıl metnin şerhi tanıtılıp tahkik ve araştırma metodu açıklanacak, üçüncü bölümde ise et-Tâkrîr ve't-Tahbîr'in“ictihad”, buna bağlı olarak da“taklid”ve“iftâ”bölümünün tahkiki yapılacaktır. Anahtar kelimerler; İbnü'l-Hümâm, İbn Emîru Hâc, et-Takrîr ve't-Tahbîr, İctihâd, Taklid, İftâ, Fıkıh, Fıkıh usûlü"
