abstract: "Bu çalışmada Hârice b. Zeyd'in hayatı ve hadis ilmindeki konumu ele alınmıştır. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde; Hârice b. Zeyd'in yaşadığı dönem hakkında bilgi verilmiştir. Birinci bölümde; Hârice b. Zeyd'in hayatı ve ailesi, ahlâki ve ilmi kişiliği ele alınmıştır. İkinci bölümde; Hârice b. Zeyd'in hocaları ve talebeleri, rivâyet ettiği hadislerin içerik bakımından tasnifi, Kütüb-i Tis'a' ve diğer hadis külliyatındaki hadislerinin tahric ve değerlendirilmesi yapılmıştır."
