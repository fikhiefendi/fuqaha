abstract: "Bu çalışma, Hanefi fıkhının en alimlerinden biri olan Ebü'l-Berekât en-Nesefî'nin (ö. 710) kenzü'd dekaik adlı eserinin şeyh“Abdülmelik el-Kal‛î el-Mekkî el-Hanefî tarafından kaleme alınan hallu'r-Remz an metni'l-Kenz”adlı haşiye eserini tanıtmayı amaçlar. Eserimizin önemi yazarının ilmi bir aileden gelmesinden kaynaklanır, elimizdeki tarihi kaynaklara göre Abdülmelik'in babası ve dedesi Mekke'de Hanefî mezhebinin müftüsü idiler, Abdülmelik ise 12. Yüzyılın başında babasından sonra Mekke'de 37 yıl kadar müftülük görevini üstlendi. Bu sebepten ötürü Hall'ü-Remz adlı kitap Hicaz bölgesinde Hanefî ekolünü yansıtan çokça faydalı bilgileri ihtiva etmektedir ve kitap genelde meseleleri ta‛lîl ve tartışmalı konuları ele alarak ve kıza vede uzun zor konuları ve meseleleri ele alarak naklî delile fazla başvurulmamıştır. Tez ise iki bölüme ayrılmaktadır; Birinci bölüm: Çalışma bölümüdür ve araştırmacı, yazarın hayatı, ilmi rütbesi, eserleri, el yazmasının tanıtımı, izlenilen yöntem ve eserin müellifine olan aidiyetinden bahseder. İkinci bölüm: Tahkîk bölümü; araştırmacı metni asıl nüshada olduğu gibi yazmış (Taharet bahsinin tamamı), kitapta bulunan bab ve bölümlere başlık eklemiş ardından sonuç, bulgular ve tavsiyelerden bahsetmiştir. Bunun yanında kitapta geçen ilmi şahsiyetler, kitaplar, yazma eserin resimlerini ve fihristleri zikretmiştir."
