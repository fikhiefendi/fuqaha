abstract: "Bu çalışmada, İbn Mâlik'in el-Elfiyye adlı kitabında İbn Malik'e göre huruf-u'l-meânî konusunu ele alınmıştır. Çalışma bir giriş ve iki ana bölüme ayırılmıştır. Giriş; nahiv ilminin doğuşu ve tedvin edilişi, diğer ilimlerin nahiv ilmi üzerindeki etkisi ve hicri yedinci yüzyıla kadar olan süreçte, bu dönemlere damgasını vurmuş en belirgin nahiv alimleri gibi nahiv ilminin gelişim aşamaları olarak ele alınmıştır. Aynı zamanda nahiv alimlerinin hurûf-u'l-meânî konusuna bakış açıları ve çalışmalarında yöntemleri, bu harfler ile ilgili telif aşamaları, bu konuya ilgi gösteren en tanınmış nahiv alimleri ve bu alanda yazılmış en meşhur eserleri kapsamaktadır. Çalışmanın birinci bölümünde: İbn Mâlik'in hayatı, ilmî yolculuğu, hocaları, öğrencileri, eserleri, İbn Mâlik'in metodu ve bu ekolü inşa ettiği temeller, Elfiyye'si ve konuları sınıflandırmadaki yöntemi ve seleflerine karşı tutumunu ele alınmaktadır. İkinci bölümde: İbn Mâlik'in Elfiyye'sinde hurûf-u'l-meânî'nin miktarı ve anlamları, Araplara göre lügat ve lehçeleri ele alınmıştır. Böylece, en tanınmış nahiv alimlerinin bu konudaki görüşleri ve bu konuda aralarında oluşmuş ihtilaflar zikredilmiş, daha sonra İbn Mâlik'in her bir harfteki görüşü zikredilmiştir. Çalışma ayrıca, İbn Mâlik'in Elfiyye'sinde, edatları sunuş metodu ve diğer kitaplarında zikretmiş olduğu edat grubunu ve anlamlarını, önceki nahiv alimlerinin bu edatlara karşı tutumunu, hurûfu'l-meâni konusunda getirmiş olduğu yenilik ve bu edatlar konusunda kendisine ait görüşlerini ele almıştır."
