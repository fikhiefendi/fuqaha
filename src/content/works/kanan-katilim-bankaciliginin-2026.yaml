abstract: "Araştırmanın temel amacı, Katılım Bankacılığının tercih edilmesinde etkili olan faktörlerin Van ilinde analizinin yapılıp sonuçların elde edilmesi ve analize göre bilgi edinilmesidir. Bu çalışmanın evrenini Van il genelinde katılım bankacılığını bilen ve katılım bankaları ile aktif çalışan kişilerden oluşmaktadır. Veriler çevrimiçi anket yoluyla toplanmıştır. Çalışmanın araştırma bölümü için 318 yetişkinden veri toplanmıştır. Elde edilen veriler analiz edilmiştir. Araştırma neticesinde gelir düzeyi ve eğitim seviyesi daha yüksek olan kişilerin katılım bankalarını daha çok tercih etme eğilimde olduğu, bu eğilimin cinsiyete göre farklılık teşkil etmediği görülmüştür. Tercih nedenlerinin de en fazla hizmet kalitesi, teknolojik güvenlik ve erişilebilirlik olduğu anlaşılmıştır."
