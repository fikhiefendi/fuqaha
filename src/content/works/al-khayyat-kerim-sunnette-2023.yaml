abstract: "Eskiden başlayarak günümüze kadar gelen ve insanlığın büyük bir problemi olan insan hakları konusu, her dönemde kendisine tartışma alanı bulmuştur. Gerek sosyologlar gerek felsefeciler gerek siyasetçiler gerek de İslâm filozofları tarafından sürekli incelenen insan hakları, tam manasını İslâm dininde bulmuştur. Son kitap olan Kur'an-ı Kerim, insan hakları üzerinde çok hassas kurallar ve yöntemler belirlemiştir. Fakat insanlığın yeryüzüne ilk inişinden bu yana sürekli kendisini sübjektif bir şekilde yenileyen insan hakları, her dönemde mutlaka ya eksik ya da yanlış algılanmıştır. Bundan dolayı tam manasıyla insanlar, hakkını tam olarak tanımlayamamış ve koruyamamışlardır. Bunun en bariz örneği İslâmiyet öncesi topluluklardır. İslamiyet öncesi toplumlarda insanların olanakları oldukça kısıtlı ve elverişsizdi. O dönemlerde kabile anlayışının hâkim olduğu bir toplumsal düzen vardı. Ayrı ayrı birden çok kabilelerin olduğu bu dönemde, her kabile kendi kabilesinin menfaatlerini ve önceliklerini savunmaktaydı. Adalet kavramından yoksun bir anlayış hâkimdi. Zorbalık, intikam, öç alma, yağmacılık (hırsızlık), insanların kişisel mallarına zarar verme gibi davranışlar alışkanlık haline gelmiş ve önüne geçilemez bir boyuta ulaşmıştı. O dönemde yaşayan insanların, can güvenlikleri de mal güvenlikleri de söz konusu değildi. Kadınlara ve kız çocuklarına toplumda asla yer verilmemekteydi. Ta ki Hz. Muhammed (s.a.v.) aracılığıyla Kur'an indirilene ve İslâm Dinine davetler başlayan kadar bu durum böylece devam etmiştir. İnsanın doğuştan kendisiyle beraber getirmiş olduğu, bununla beraber sosyalleşerek kazandığı haklara dikkat çekilip, insanın en güzel ve şerefli bir varlık olduğunu; erkek, kadın, çocuk, genç ve yaşlı ayırt etmeksizin herkesin eşit haklara sahip olduğunu hatırlatan birçok ayet ve birçok Hadis-i Şerif nazil ve varid olmuştur. Tin Sûresinin 4312. ayetinde insanın değeri, onuru ve kıymeti ifade edilmiştir. Kur'an'ın birçok yerinde bu ayette olduğu gibi insan haklarına vurgular yapılmaktadır. Bununla birlikte Hz. Muhammed (s.a.v.)'in sözlerinde ve uygulamalarında da sık sık insan hakları vurgusu yer almaktadır. İslam anlayışının temelinde ırk ve renk ayrımının gözetilmediği de aşikâr bir durumdur. Bu çalışmada insan haklarına, dünya tarihinde ilk, ne zaman, nasıl değinildiği araştırılacak olup gerekli incelemelerde bulunulacak, daha sonra Kur'an ayetleri ve Sünnetten örneklerle insan haklarına değinilecektir."
