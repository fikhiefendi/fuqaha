abstract: "Betimleyici yöntemden oluşan bu çalışma, konuyla ilgili, bilimsel referanslarının derlenmesine dayanmaktadır. Çalışma, bilimsel araştırma ilkelerini ve yöntemini dikkate alarak, Türkiye ve Irak'taki İslami bankaların performansını değerlendirmekte, finansman ve yatırımlardaki rolünü analiz etmektedir. Araştırma kapsamında, Al Baraka Türk Bankası ve Irak Ulusal Bankası ile ile e-posta yoluyla bir röportaj gerçekleştirilmiştir. Ayrıca, Al-Barak Türk'ün araştırmada kullanılmak üzere paylaşmış olduğu, yönetim kurulunun 2018 mali yılı faaliyetleri hakkında bir rapor araştırmada temel alınmıştır. Finansal veriler, Irak Ulusal Bankası ve Al Baraka Türk Bankası'nın yıllık raporlarından elde edilmiştir. Ayrıca, İslami Finansal Kurumlar için Muhasebe ve Denetim Teşkilatı standartları da raporlarla karşılaştırılmıştır. Araştırmanın birinci bölümü, İslami bankanın spekülasyon, katılım, Murabaha, kredi, iyi krediler ve İslami ilkeler gibi işlemlerini içermektedir. Araştırmanın ikinci bölümü, Al Baraka Türk ve Irak Ulusal Bankasını incelemektedir. Bu çerçevede, Bankaların mali tabloları, yatırımları ve fonlarla ilgili değerlendirmeler yapılmıştır."
