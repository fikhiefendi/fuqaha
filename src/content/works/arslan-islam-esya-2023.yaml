abstract: "İnsan, doğumuyla birlikte hatta cenin iken birtakım haklara sahip olmaya başlar. İnsan bu hakları, anne karnından ölüm anına kadar miras, hukukî işlem, çalışma vb. yollar ile elde etmektedir. Kişi, hayatta olduğu sürece sahip olduğu hakların tasarrufu kendisine aittir. Vefatından sonra mâlik olduğu hakların vârislerine intikal edip etmeyeceği konusu ortaya çıkmaktadır. Bu çalışmada kişinin, İslam Eşya-Borçlar hukuku alanına giren haklarının vârislerine intikal edip etmeyeceği konusu ele alınmıştır. Konu ele alınırken mezheplerin görüşleri karşılaştırmalı bir şekilde verilmiş, varislere intikalinde ittifak edilen ve ihtilaf edilen hususlar analiz edilmiştir. Bu çalışmada, kişiye ait söz konusu hakların vârislere intikal edip etmeyeceğinin mezhepler açısından tespit edilmesi ve hakların vârislere intikali konusunda mezheplerde esas alınan temel prensiplerin belirlenmesi amaçlanmıştır."
