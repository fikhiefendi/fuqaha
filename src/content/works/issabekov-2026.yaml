abstract: "Bu çalışma, hicrî V. yüzyılda yaşamış, Mâverâünnehir bölgesinin önde gelen Hanefî fakihlerinden biri olan Ebû Ezher Muhammed b. Ahmed el-İsbîcâbî'ye (ö. 500/1106) ait Şerhu'l-Câmiʿi's-Sağîr adlı yazma eserin bir kısmının ilmî tahkikini ve akademik analizini konu edinmektedir. Söz konusu eser, klasik Hanefî literatüründe önemli bir yere sahip olup, bölgesel fıkıh geleneğinin izlerini yansıtan nadir kaynaklardan biridir. Çalışma iki ana bölümden oluşmaktadır. Birinci bölümde, eserin asıl müellifi olan İmam Muhammed eş-Şeybânî ile şârihi Ebû Ezher el-İsbîcâbî'nin hayatları ve ilmî mirasları kapsamlı bir şekilde ele alınmıştır. Ayrıca XI ve XII. yüzyıllarda Mâverâünnehir bölgesinin, özellikle İsbîcâb şehrinin sosyo-politik ve ilmî yapısı incelenmiştir. Şerhu'l-Câmiʿi's-Sağîr adlı eserin yapısı ve muhtevası analiz edilmiş; müellifine nispeti ortaya konmuş, başvurulan kaynaklar belirlenmiş ve müellifin takip ettiği şerh yöntemi açıklanmıştır. Bununla birlikte, eserde ele alınan bazı fıkhî meseleler diğer Hanefî şerhlerle karşılaştırmalı olarak ele alınmıştır. İkinci bölümde, eserin ibadet ve muâmelât konularını içeren bir kısmının ilmî tahkiki sunulmuştur. Bu bölümde namaz, zekât, oruç, hac, nikâh, talâk, köle azadı, yeminler, kurban ve mekruh fiiller gibi temel fıkhî meseleleri kapsayan bölümler tahkik edilmiştir. Tahkik çalışmasında iki farklı yazma nüsha esas alınmış ve klasik neşir ilkeleri doğrultusunda değerlendirme yapılmıştır. Bu çerçevede Kur'ân âyetlerinin yerlerinin tespiti, hadislerin tahrici, görüşlerin senedlendirilmesi, şahsiyetlerin tanıtımı, ıstılahların açıklanması, noktalama işaretlerinin yerleştirilmesi ve müstensih hatalarının düzeltilmesi gibi işlemler titizlikle uygulanmıştır. Çalışma, genel değerlendirmeler ve sonuçlarla birlikte, kullanılan kaynakların yer aldığı kapsamlı bir bibliyografya ile sona ermektedir. Bu kaynaklar arasında klasik Hanefî fıkıh eserlerinin yanı sıra, İslâm hukuku ve Orta Asya'daki ilmî gelenek üzerine yapılmış çağdaş akademik çalışmalar da yer almaktadır. Bu yönüyle tez, Orta Asya'daki Hanefî fıkıh mirasının incelenmesine önemli bir katkı sunmakta; bölgenin önde gelen fakihlerinden birine ait, nadir ve daha önce neşredilmemiş bir eseri ilmî dünyaya kazandırmaktadır."
