abstract: "Eski Oğuz Türkçesine ait Kit?b-ı A?k?mu'l-'a??yid' adlı eserin (1a/1-51a/12) numaralı varakları üzerinde yapılan bu çalışma, giriş, metin, dizin ve tıpkıbasım bölümlerinden oluşmaktadır. Giriş kısmında eserin sahası ve saha bilgisi, nüsha bilgisi ve eserin bölümlerine değinilmiştir. İnceleme bölümünde metnin yazım, ses, yapı, söz dizimi, ve söz varlığı üzerine açıklamalar yapılmıştır. Bu açıklamalar ışında eserin yazıldığı tarih ve ait olduğu saha üzerine aydınlatıcı görüşler ortaya konulmaya çalışılmıştır. Metin kısmında, yazmanın çeviri yazısı yapılmıştır. Dizini alınmış sözlükte ise; kelimelerin hangi dile ait olduğu, ve anlamları verilerek, ses değişimine uğramış kelimeler, karşılaştırma yapılacak biçimde verilmiştir."
