abstract: "İslam Kalkınma Bankası (İKB), 1975 yılında İslam İş birliği Teşkilatı (İİT) üyesi ülkelerin ekonomik ve sosyal kalkınmasını desteklemek amacıyla kurulmuş bir uluslararası finans kurumudur. İKB, İslami finans prensiplerine uygun olarak faizsiz finansman modelleriyle faaliyet göstermektedir. Bu tez çalışması, İKB odağında İslami finansın kalkınma ve yatırım bankacılığı yönlerini ele alarak Türkçe literatürdeki yetersizliği gidermeyi amaçlamaktadır. Kalkınma ve yatırım bankaları, küresel ekonomik sistemde önemli bir rol oynamaktadır. Bu bankalar, ekonomik büyümeyi teşvik etmek, altyapı projelerini finanse etmek ve sanayi ile tarım sektörlerine destek sağlamak gibi görevlerle ülkelerin kalkınmasına katkıda bulunurlar. İslam Kalkınma Bankası bu bağlamda, İslami finansının temel ilkelerinden biri olan faizsiz finansmanı teşvik ederek, üye ülkelerde altyapı, enerji, tarım, sağlık ve eğitim gibi kritik alanlarda büyük projeleri finanse etmektedir. İKB, kar-zarar ortaklığı (mudârebe ve müşâreke), ticaret finansmanı (murâbaha) ve kira (icâre) gibi İslami finans enstrümanlarını kullanarak ekonomik kalkınmayı desteklemektedir. Ayrıca, yoksullukla mücadele, sağlık hizmetlerine erişim, eğitim kalitesinin artırılması ve kadınların ekonomik hayata katılımını teşvik eden sosyal kalkınma projeleri yürütmektedir. İKB, İslami finans prensiplerine uygun olarak şeffaflık, risk paylaşımı ve sosyal adalet ilkelerini benimseyerek, üye ülkelerin sürdürülebilir kalkınma hedeflerine ulaşmalarına katkıda bulunmaktadır. Banka, aynı zamanda teknik yardım ve kapasite geliştirme programları sunarak bilgi transferi ve insan kaynağı geliştirme konularında önemli katkılar sağlamaktadır. Bu çalışma, İslam Kalkınma Bankasının üye olan Müslüman ülkeler ve üye olmayan ülkelerdeki Müslüman toplulukların finansal kalkınması ve ekonomik problemlerinin çözümündeki rolünü irdelemeyi amaçlamaktadır. İlk bölümde, kalkınma ve yatırım bankaları üzerine genel bilgiler, ikinci bölümde ise İKB'nin faaliyetleri ve sağladığı finansal destekler ele alınacaktır."
