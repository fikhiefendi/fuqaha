abstract: "Kişiler arasında birçok sebebe dayalı olarak borç ilişkisi doğmaktadır. Bu borç ilişkisi sebebiyle de tarafların çeşitli sorumlulukları gündeme gelmektedir. İslam hukukunda borç ilişkisi sonucu kişinin zimmetinde oluşan şey deyn kavramıyla ifade edilmiştir. İslam hukukunda yer alan akid teorisi bağlamında, taraflar arasında gerçekleşen hukukî bir işlemin konusunun ayn veya menfaat gibi varlık olması temel esastır. Bu nedenle herhangi bir hukukî işlemin konusuz olması, yapılan işlemin batıl olmasını gerektirecektir. Kişiler arasında borç ilişkisi sonucu meydana gelen deyn, çeşitli şekillerde bazı hukukî işlemlere konu edilebilmektedir. Bu durumda da deynin varlığının mahiyetiyle ilgili açıklanması gereken bazı hususlar gündeme gelmektedir. Kişinin zimmetinde sabit olduğu ifade edilen deynin hukukî işlemlere konu olabilmesi için varlık statüsü kazanması gerekmektedir. Bu nedenle de deynin zimmetle ilişkisi kurularak ayn kadar olmasa da çeşitli şartlarla bazı hukukî işlemlere konu olabilmesi sağlanmıştır. Özellikle borç ilişkisinde alacaklı açısından bakıldığında alacağı temsil eden deynin henüz tahsili yapılmadan gerek borçlu kişiye gerekse borçlu dışındaki üçüncü bir şahsa satımı konusu İslam hukuku açısından birçok konuyu içerisinde barındıran bir niteliğe sahiptir. Çalışmada öncelikle deyn kavramının İslam hukuku açısından mahiyetine ve hukukî işlemlere konu olabilmesi açısından varlık olarak ele alınması noktasındaki hukukî zeminin tespitine yer verilmiştir. Deyne yüklenen anlam bağlamında, deynin henüz tahsili yapılmadan alacaklısı tarafından borçluya ve borçlu dışındaki üçüncü bir şahsa satımını ifade eden bey'u'd-deyn kavramı üzerinde durulmuştur. İslam hukukunda alacak satımının hukukî tartışmalarına ve gerekçelerine yer verilip, özellikle günümüz finansal piyasaların önemli bir unsuru olan katılım bankalarının borç yapılandırma yöntemlerinin çalışma konusu açısından incelenmesi yapılmıştır."
