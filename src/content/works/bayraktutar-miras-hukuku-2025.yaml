abstract: "Bu tezde, İslam miras hukukunun temel kaynaklarından biri olan hadisler ele alınarak, bu hadislerin miras hukukuna katkıları tahlil edilmiştir. Çalışmada Kur'ân'da genel çerçevede belirtilen miras hükümlerinin Hz. Peygamber'in sözleri ve uygulamalarıyla nasıl şekillendiği analiz edilmiştir. Araştırma kapsamında hadis kaynaklarında yer alan mirasla ilgili rivayetler sened ve metin yönünden değerlendirilmiş, bu hadislerin fıkhî mezhepler üzerindeki etkisi ortaya konmuştur. Miras hukukunun sadece matematiksel bir paylaşım değil; aynı zamanda sosyal, ahlaki ve dini bir sorumluluk olduğu vurgulanmıştır. Hadislerde yer alan hükümlerin günümüzde karşılaşılan problemlere çözüm üretme potansiyeli irdelenmiş; dede yetimi, hünsa-i müşkil gibi özel durumlara dair hükümler hadisler ışığında açıklığa kavuşturulmuştur. Çalışmada Kütüb-i Sitte ile sınırlı tutulan rivayetler, klasik hadis usulüne göre tahkik edilmiştir. Ayrıca hadislerin miras hukukunun anlaşılmasındaki açıklayıcı ve tamamlayıcı rolü örneklerle gösterilmiştir. Tez, İslam miras hukukunun yalnızca Kur'ân'a dayalı değil, aynı zamanda sünnetle pekişmiş bir sistem olduğunu ortaya koymaktadır. Bu yönüyle çalışma, hem ilmî hem de uygulamaya dönük bir katkı sunmayı amaçlamaktadır."
