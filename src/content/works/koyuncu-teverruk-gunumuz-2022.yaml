abstract: "Günümüzde Teverruk İslami Finans Sektörünün çeşitli alanlarında kullanılmakta ancak organize olması sebebiyle fıkhi olarak çeşitli sorunlar barındırmaktadır. Bununla birlikte Teverruk işlemleri için gerekli hizmet genellikle İngiltere ve Malezya merkezli Borsa veya Emtia aracı şirketlerinden ithal edilmektedir. Fıkhi bakımdan sorun teşkil etmeyecek şekilde Klasik Teverruk ürünü ise günümüz finansal ihtiyaçlarına cevap verecek nitelikte geliştirilmeye muhtaçtır. Tezimizde, uluslararası ve yerel fıkhi standartlara uygun, blok zincir ve akıllı sözleşmelere dayalı, dijital emtia ile sürecin tasarlandığı, tarafların tek bir sözleşme ile entegre olabildiği, teknolojik, şeffaf, denetlenebilir, verimliliği ve sürdürülebilirliği önceliklendiren Dijital bir Teverruk platformu sunulmaya çalışılmıştır. Bu kapsamda piyasada yaygın mevcut uygulamalar incelenmiş, bunlara kıyasla İslami finans ilkeleri ile uyumlu olduğu düşünülen likidite yönetimi ve gerçek piyasa sisteminde işleyebilecek nakit finansman amaçlı iki ayrı teverruk modeli için örnek çözüm önerileri sunulmuştur."
