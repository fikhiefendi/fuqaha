abstract: "Çalışma, İstisna'nın sözleşmesini diğer sözleşmelere özgülüğü nedeniyle tanımlamayı amaçladı. Bu sözleşme iki özelliği birleştiriyor: pasaportta merdiveni satma özelliği ve sözleşmenin daha sonra üretileceği bir satış dışı alım makbuzu ve sözleşmedeki kredinin kabul edilebilirliğinde mutlak satışın mülkiyeti Huzur içinde olduğu gibi hızlandırılmamalı. Bu tezde, İslami bankalarda işlemlerin hukukunun yeniden canlandırılması ve çağdaş gerçeklikte uygulanmasına ilişkin bilimsel çabalara katkıda bulunmak amacıyla, İslami bankalardaki Istisna'nın sözleşmelerinin modellerini vurguladı. Endüktif analitik ve tanımlayıcı analitik metodu takip ettim: Bu araştırmada, Istisna'a konusu ile ilgili gerçekleri ve bilgileri toplamak, analiz etmek ve sınıflandırmak için, bu konu hakkında doğru ve ayrıntılı bilgi edinmek için kullanıldı ve araştırmayı sonuç ve önerilerle sonuçlandırdım."
