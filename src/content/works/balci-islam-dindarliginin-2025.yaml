abstract: "Bu araştırmanın temel amacı, bireylerin dindarlık düzeylerinin tüketim eğilimleri üzerindeki etkisini analiz etmektir. Çalışmada, dindarlığın hedonik tüketim, lüks tüketim ve helal tüketim eğilimlerinin yanı sıra bireylerin geri dönüşüm ve yeniden kullanım konusundaki farkındalığı ile bu alanlardaki pratikleri üzerine etkisi incelenmiştir. Dindarlığın İslami bankacılık tercihi üzerine etkileri yine bu çalışmada tespit edilmeye çalışılmıştır. Ayrıca İslami bankacılığın tüketim eğilimleri üzerindeki doğrudan etkisi ve aracılık rolü yine bu çalışmada değerlendirilmiştir. Araştırmada, bireylerin dindarlık düzeyleri, tüketim alışkanlıkları ve demografik özellikleri dikkate alınarak, davranışlarını etkileyen faktörlerin hangi düzeyde belirleyici olduğu tartışılmıştır. Araştırma için hazırlanan anket çalışmasını evreni olarak İstanbul ili belirlenmiştir. Örnekleme yöntemi olarak kolayda örnekleme metodu tercih edilmiştir. Ankete katılım için 18 yaş üzeri olma ve Müslüman olma koşulu dışında bir koşulu bulunmayıp farklı yaş, cinsiyet, medeni durum, gelir düzeyi, eğitim düzeyinden kişilere uygulanmıştır. Örnekleme yöntemi olarak kolayda örnekleme metodu tercih edilmiştir. Veri toplama aracı olarak çevrimiçi anket tekniği kullanılmıştır. Verilerin analizinde kullanılan toplam geçerli anket sayısı 547'dir. Anketten elde edilen veriler, SPSS ve AMOS programlarında analiz edilmiştir. Ölçek faktörleri ve madde yüklerini belirlemek için Açıklayıcı Faktör Analizi (AFA) kullanılmıştır. Doğrulayıcı Faktör Analizi (DFA) ile geçerlik-güvenirlik testleri yapılmış ve model uyum endeksleri hesaplanmıştır. Doğrulayıcı Faktör Analizi (DFA)'nın ardından hipotezleri test etmek için Yapı Eşitlik Modeli (YEM) kullanılmıştır. Analiz bulgularına dayalı yorumlar ve değerlendirmelerin sunulduğu sonuç kısmıyla bu bölüm tamamlanmıştır."
