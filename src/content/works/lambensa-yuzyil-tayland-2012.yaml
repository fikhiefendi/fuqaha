abstract: "Geçmişte bir sultanlık olan Patani, müslümanların bugün yoğun olarak yaşadığı Tayland'ın güney bölgesinin doğu sahilinde yer alan bir şehirdir. Patani Sultanlığı'nın ne zaman kurulduğu kesin olarak bilinmemekle birlikte Patani'nin 2.yy başlarında Langkasuka Devleti'nin kontrolü altında olduğu ve bir transit liman olduğu nakledilmektedir.İslâmiyetin Patani'ye ne zaman girdiği de kesin olarak bilinmemekle beraber 1457'de Patani Kraliyet ailesinin müslüman olması sebebiyle devlet ricali ve halkı İslâmiyete adım adım girmeye başlamıştır. Fıkıh ögrenim ve öğretimi bu süreçte başladığı söylense bile mahallî müslümanlar arasında ilk dönemlerde yazı geleneği yaygın olmadığı için fıkıh, sözlü olarak öğretilmiştir.18. ve 19. yüzyılları, Patani fıkhi faaliyetlerin yoğunlaştığı bir dönem olduğu nakledilmektir. Bunun en önemli sebebi o dönemde Şeyh Dâvûd el-Fetânî gibi birçok âlimin yetişmesidir. Müslümanların eğitimi ve refahı için canını, malını seferber eden Şeyh Dâvûd el-Fetânî, aldığı bütün ilimleri mezcederek genç nesillere ve müslüman toplumlara aktarmaya çalışmıştır. Şeyh Dâvûd el-Fetânî birçok eser telif etmiştir. fakat bu eserlerin bir kısmı günümüze ulaşabilmiştir.Onun en önemli eserlerinden biri olan Fürû'ul-Mesâil ve Usûlü'l-Vesâil, Malay Yarımadası'nda ilk fetva eseri olduğu söylenmekle birlikte mahallî müslümanların dini, sosyal ve kültürel hayatında karşılaştığı çeşitli problemlerin çözümünü ortaya koyan yegâne eser olmuştur."
