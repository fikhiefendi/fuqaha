abstract: "Tez, içindekiler, sonuç ve dipnotlar olmak üzere üç ana bölümden oluşmaktadır. Birinci bölüm, tezin genel çerçevesi olan önsöz, tez konusu, önemi, seçim nedenleri, uygulamaları ve yapısını içermektedir. Çalışmanın ikinci bölümünde, el yazması eserin müellifi alim İbn Emir El-Haj El-Hanifi, yaşadığı yüzyıl ve“Zahira Vakfı Tahsisi”kitabının tanıtımına yer vermiştir. Üçüncü bölüm ise yazma eserin on beşinci bölümünün başlangıcından, eserin sonuna kadar olan ikinci kısmın tahkikini kapsamaktadır. Sonuç bölümünde en önemli bulgular ve öneriler ele alınmıştır. İçindekiler kısmı: özel isimler, şehirler, bölgeler, metinde bahsedilen kitaplar ve son olarak kaynaklar bölümünden oluşmaktadır. Araştırmacı, bu çalışma ile bahsi geçen kitabın genel olarak İslam Ekonomisi ve özelde İslami Vakıf araştırmacıları için temel bir referans olduğu sonucuna varmıştır. Bunun nedeni, Hanifi mezhebinin önde gelen hukukçularının da belirttiği gibi kitabın vakıflarla ilgili tüm soruları kapsayan konuları içermesidir."
