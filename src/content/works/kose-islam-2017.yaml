abstract: "İslâm hukukçuları insan hayatını anne rahmine düştüğü andan itibaren çeşitli devrelere ayırmışlardır. Bu ayrımda ölçüt olarak kişinin fiziki ve aklî olgunlaşması esas alınmıştır. İslâm hukuk usulü eserlerinde ehliyet başlığı altında ele alınan konuların büyük çoğunluğu çocukların vücûb ve edâ ehliyeti ile ilgilidir. Edâ ehliyeti içerisinde önemli konulardan biri ise çocukların ceza ehliyetidir. Bu çalışmada çocukların hukuka aykırı fiillerinin suç kapsamında değerlendirilip değerlendirilemeyeceği, değerlendirilecekse had veya kısas gerektiren bir suç işlediklerinde kendilerine uygulanacak bedeni yaptırımın türü, mali yaptırım uygulanacaksa bunun kim tarafından karşılanacağı İslâm ceza hukuku kapsamında ele alınmıştır. Çocuklara had ve kısas cezası uygulanmayacağı noktasında mezhepler ittifak halindedirler. Ancak bu durum çocukların fiillerinin karşılıksız kalacağı anlamına gelmez. Hâkim, mümeyyiz çocuklara yaşına ve akli gelişimine uygun, fiilin tekrarını önleyici bir yaptırım uygulamakla yükümlüdür. Çocukların had veya kısas gerektiren bir suçu yetişkinlerle birlikte işlemesi durumunda ise yetişkinlere uygulanacak cezanın niteliğinin değişip değişmeyeceği mezhepler arasında ihtilaflıdır. Hanefiler dışındaki sünnî mezhepler her bir fâili kendi özel şartları içerisinde değerlendirirken, özellikle Ebû Hanife'nin ceza ehliyeti olmayan çocuğun suça iştirakini diğer fâillerden de had veya kısas cezasını düşüren bir sebep olarak telakki ettiği görülmektedir. Çocukların adam öldürme, yaralama ve hırsızlık gibi fiilleri neticesinde ortaya çıkan mali yaptırımların kim tarafından karşılanacağı da mezhepler arasında ihtilaflıdır. Şâfiîler dışındaki sünnî mezheplerin ve Caferîlere göre çocukların ödemeleri gereken diyeti âkıle karşılar. Şâfiîlere göre ise diyet öncelikle çocuğun malından karşılanır. Çocuğun malı yoksa zimmetinde borç olarak kalır. İslâm ceza hukukunda mağdur olarak çocuğun durumu ise çeşitli şekillerde karşımıza çıkmaktadır. Had cezalarında yetişkin kadın veya erkeklerin çocuklarla gayri meşru cinsel ilişkide bulunmaları, çocukların iffetine yapılan iftiralar, hırsızlık suçunda çocuğun malının veya kendisinin çalınmasına mezhepler farklı yaptırımlar öngörmüşlerdir. Kısas veya diyet gerektiren suçların mağduru olan çocuklar genel olarak yetişkinlerle eşit tutulmaktadır. Ancak sağlamlığı kesin olarak bilinemediği için konuşma çağına gelmeyen çocukların dilleri, süt dişleri, erkek çocukların cinsel organları müessir fiillerde mükelleflerden ayrı değerlendirilmiştir."
