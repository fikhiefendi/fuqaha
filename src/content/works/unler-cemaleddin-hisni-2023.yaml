abstract: "Osmanlı döneminde yaşayan, Batman'da doğan, Şam Emevî Camii Şeyhü'l-kurrâ'larından Cemâleddin el-Hısnî 40 yıl kadar süren hayatı boyunca birçok eser kaleme almış önemli bir ilim adamıdır. Bir dönem İstanbul'da kıraat dersleri veren Hısnî, buradaki talebelerin isteği üzerine Vakf-ı Hamza ve Hişâm meselesi üzerine el-Keşf an Ahkâmi'l-hemze Fi'l-vakf li Hişâm ve Hamza adlı eseri telif etmiştir. Hakkında herhangi bir çalışma bulunmayan Cemâleddîn el-Hısnî'nin ve el-Keşf an Ahkâmi'l-hemze Fi'l-vakf li Hişâm ve Hamza adlı eserininin ilim dünyasına kazandırılmasını hedefleyen bu çalışma giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı, metodu ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde, Müellifin hayatı,ilmî kişiliği ve eseleri etraflıca ele alınmıştır. Söz konusu meselelere dair bulgular öncelikle müellifin kendi eserlerinden, daha sonra müellifin mensup olduğu ilim geleneğinin kendisi hakkında söylediklerinden ve tabakat eserlerinden tespit edilmiş ve ortaya konmuştur. Ayrıca müellife nispet edilen eserler matbusu bulunanlar, yazma halde olanlar ve henüz nüshasına ulaşılamayan eserler olarak tasnif edilmiş ve yazma halde olanların yerleri tespit edilmiştir. Çalışmamızın ikinci bölümünde, el-Keşf an Ahkâmi'l-hemze Fi'l-vakf li Hişâm ve Hamza adlı eserin ismi ve müellife aidiyeti tespit edilmiş, Hısnî'nin eseri telif sebebi ortaya konmuş, muhteva ve metot analizi yapılmak suretiyle eser tahlil edilmiştir.Ayrıca müellifin eserde kullandığı kaynaklar tespit edilip söz konusu eserler hakkında bilgiler verilmiştir. Araştırmanın üçüncü bölümünde el-Keşf'in tahkikli neşri yapılmıştır."
