abstract: "Çalışma; giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde; ele alınan konunun önemi, araştırmanın amacı, yöntemi ve sınırlılıkları ile birlikte İslam Tarihi kaynaklarında Gadîr-i Hum hadisesinin ele alınış şekli belirlenmiştir. Tez çalışmasının ana bölümü olan ikinci bölümün referans kaynakları Şiî-İmami âlimlerin Gadîr-i Hum hadisesine yer veren tefsir ve hadis teliflerinden oluşmaktadır. Birinci bölümde farklı ekollerin imamet görüşleri hakkında bilgi verilerek İslam düşünce geleneğinde imamet meselesine genel yaklaşım ele alınmaya çalışılmıştır. Akabinde Şiî-İmami ekolün diğer fırkalardan farklılaşması ve imameti aklî ve naklî delillerle izahı incelenmiştir. Ana bolum olan ikinci bölümde İmamiyye'nin imametin bir delili olarak sunduğu Gadîr-i Hum hadisesi ele alınmıştır. İlk dönem eserlerinden günümüze kadar olan kaynaklardaki rivayetlerin tamamına değinmeye çalışılarak Şiî müelliflerin teliflerinde yer verdikleri Gadîr-i Hum hadisesi, kronolojik süreç üzerinden, tefsir ve hadis kaynakları başlığı altında tasnif edilmiştir. Sonuç kısmında Gadîr-i Hum hadisesi bütünsel bir yaklaşımla ele alınarak imamete delil teşkil etme yönü değerlendirilmiştir."
