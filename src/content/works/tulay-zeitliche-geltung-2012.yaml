abstract: "Kanunilik ilkesi; kanuni sınırların aşılmasını engelleyen ve böylece hukuki güvenliğin devamını sağlayan temel bir Ceza Hukuku prensibidir. Bu ilke, Federal Almanya Cumhuriyeti ve Türkiye Cumhuriyeti Anayasalarında açıkça zikredilmiştir. Hakim görüşe göre; kanunilik ilkesi ilk olarak Amerikan eyaletlerindeki anayasa yapım süreçlerinde karşımıza çıkmaktadır. Bu ilke; doktrinde yazar Feuerbach'ın Latince „nulla poena sine lege“ adlandırmasıyla yer edinmiştir. Oysa kanunilik ilkesinin daha önceki dönemlerde İslam Hukukunda benimsenmiş olduğunu belirtmek gerekir. Kanunilik ilkesinin en önemli yansımaları arasında „Kanunların Geriye Yürüme Yasağı”yer alır. Bu ilke, kural olarak fiilin gerçekleştiği andaki hükmün uygulanmasını şart koşar. Bu nedenle fiilin gerçekleştiği anın tespiti önem taşır. Fakat bu ilke ışığında, fail lehine sonuç doğuran ve maddi ceza hukuku alanına dahil olan kanuni değişikliklerin geriye yürümesi imkanı tanınmaktadır. Bu durumda genel kuralın istisnası olarak, yerine göre „Kanunların geriye yürümesi“ veya „Kanunların ileri yürümesi”durumu karşımıza çıkmaktadır. Fail lehine tanınmış istisna kural olarak maddi ceza hukuku alanında geçerlidir ve bu nedenle doğru hükmün uygulanması için „maddi-şekli ceza hukuku\" ayrımının yapılması önem arz eder. Hangi Ceza Hukuku kuralının fail lehine olduğu, somut olayın şartlarına göre en uygun kuralın tespitiyle belirlenir. Her kanunda lehe hükümler tespit edilerek, neticeten birlikte bir uygulama yapmak mümkün değildir. Ceza Hukuku kurallarının zaman bakımından uygulanması sorunu, Alman ve Türk Hukuk Sistemi bakımından bilhassa Güvenlik Tedbirleri, Zamanaşımı, Şikayet kurumu ve içtihat değişiklikleri konularında özel bir inceleme gerektirir."
