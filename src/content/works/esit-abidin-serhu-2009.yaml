abstract: "İbn Âbidîn Hanefi fukahası arasında mukallit olarak görülen, Hanefi fıkhına olan vukufiyetinde hemen hemen herkesin hem fikir sahibi olduğu son dönem Osmanlı âlimlerinden birisidir. İbn Âbidîn'i kendi dönemindeki ulema arasından ayırıp onu ayrı bir konuma yükselten özelliği şüphesiz irdeleyici ve araştırıcı özelliğidir. Bu özelliği ile o fetva konusunda yapılan hataların farkına varmış ve bu konuda müftülere rehber olacak ?Ukudu Resmi'l-Müfti? adında bir nazm ve o nazma ?Şerhu Ukudi Resmi'l-Müftî? adlı bir şerh kaleme almıştır. Bu şerh alanında bir ilk değildir. Ama faydalandığı kaynak genişliği olsun konuyu ele alış tarzı olsun kendisinden önce bu konuda yapılmış olan müstakil çalışmalardaki eksiklikleri giderme başarısını göstermiştir.Hanefi kaynaklarında geçtiği ve İbn Âbidîn'in (ö.1252/1836) de ?Şerhu Ukûdi Resmi'l-Müfti? adlı risâlesinde belirttiği üzere Hanefi mezhebine uygun olarak fetva vermek isteyen bir müftünün göz önünde bulundurması için bazı kriterler Hanefi fakihler tarafından geliştirilmiştir. Bu kriterler fetvanın özeliği, fetvanın yer aldığı kaynak, fetvaya dayanak olan görüşün sahibi ve fetvayı veren şahıs şeklindeki kriterlerdir. Bu sayede fetva verirken doğruya ulaşma konusunda engel teşkil edecek olan bütün alanlarda atılması gereken adımlar belirlenerek müftünün hata etme olanağı en aza indirgenmek istenmiştir. Müftüyü böyle kriterlere bağlamak öncelikle mezhebin doğru olduğu ön kabulünü sunmaktadır. Her ne kadar müftünün bireysel yeteneklerini (içtihat gibi) sınırlayıcı görünse de aslında bu kriterler böyle bir yeteneğin olmaması durumunda bireylerden kaynaklanabilecek hataları en aza indirme ve fetva verme konusunda bir yöntemin var olduğunu gösterme çabası olduğunu rahatlıkla söyleyebiliriz."
