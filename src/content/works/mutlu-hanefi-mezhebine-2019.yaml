abstract: "Bu araştırmanın amacı, İslam hukukunda çocukların evlendirilmesinin hukuki dayanağını ortaya koymaktır. Ayrıca bu problemin günümüz hukuk sistemindeki yerini tespit etmektir. Çocukların evlendirilmesi konusu tartışılmış sonuçta çocukların evlendirilmesini kabul edenler ve etmeyenler şeklinde iki temel görüş ortaya çıkmıştır. Bu araştırma, giriş, iki bölüm ve sonuçtan meydana gelmektedir. Giriş kısmında evlenmenin mahiyeti hakkında bilgi verilmiştir. Birinci bölümde Hanefi mezhebine göre evlenme ehliyeti ele alınmıştır. Evlenme için gerekli olan ehliyet ve velâyet konuları incelenmiştir. İkinci bölümde çocukların evlendirilmesi İslam hukuku açısından incelenerek farklı görüşler ortaya konulmuştur. Bu konudaki Osmanlı kanunlarına ve günümüz hukuk sistemindeki kanunlara değinilmiştir. Sonuç bölümünde ise konu ile ilgili tespit edilen görüşlerin değerlendirilmesi özet olarak verilmiştir."
