abstract: "Bu araştırma, Malikî mezhebinin önde gelen kaynaklarından Muhtasaru Halîl üzerine yazılmış iki önemli şerh olan Hattâb'a ait Mevâhibü'l-Celîl ile Miknâsî'ye ait Şifâ'l-ğalîl'i Kırâz (Mudârebe) konusu örneğinde incelemektedir. Tezin birinci bölümünde, muhtasar yazarı ile şârihler tanıtılmış, üç yazarın biyografileri ve eserleri kısaca aktarılmıştır. İkinci bölümde, fıkıh muhtasarları genel olarak tanıtılmış, Mâlikî muhtasarlarına değinildikten sonra Halîl'in Muhtasar'ında Kıraz konusunun işleniş şekli ele alınmıştır. Üçüncü bölümde ise her iki şerh genel hususiyetleri itibarıyla tahlil edilmiş, belli başlı özellikleri tespit edilmiş ve ardından şârihlerin şerh yöntemlerini mudârebe konusuna nasıl uyguladıkları ele alınmış; böylelikle iki şerh arasında tematik ve metodolojiik bir mukayese yapılmıştır. Mudârebe özelinde şarihler üzerinden mezhep içi fıkhî tartışmalar tespit edilmiş ve öne çıkan bazı konularda diğer mezheplerle mukayeselere gidilmiştir. Tezde, modern iktisadî uygulamalar arasında önemli bir yere sahip olan mudârebe akdinin günümüzde fon geliştirmenin en iyi ticari yollarından biri olduğu da vurgulanmış ve güncel uygulamalar ile klasik fıkıhtaki esaslar arasında bir karşılaştırma yapılmıştır."
