abstract: "Seyyid Muhammed b. Ahmed el-Keddûsî'nin Feyzu'l-Kerîm fî Nukūli Fetâvâ ʿAbdi'r-Raḥîm (Kitâbu't-Ṭahâre'nin başından Ḥudûd Kitâbı'nın sonuna kadar): İnceleme ve Tahkik“ Bu araştırma, Osmanlı dönemi Hanefî âlimlerinden biri olan Seyyid Muhammed b. Ahmed b. Mustafa el-Kuddûsî'ye ait ”Feyzu'l-Kerîm fî Nukūli Fetâvâ Abdürrahîm\" adlı eserin tahkik ve incelemesini konu edinmektedir. Çalışma, sadece taharet kitabından hudûd kitabının sonuna kadar olan bölümü kapsamaktadır. Bu bölüm, ibadetler, muameleler ve had cezalarıyla ilgili Hanefî mezhebinin hüküm çıkarma yöntemini yansıtan, derin fıkhî meselelerle doludur. Tez üç bölüme ayrılmıştır:Birinci bölüm, müellifin hayatı, yetişme süreci, hocaları, talebeleri ve Osmanlı Devleti'ndeki ilmî konumunun incelenmesine ayrılmıştır.İkinci bölümde, müellifin ele aldığı önemli fıkhî meseleler, kullandığı kaynaklar ve terimler açıklanmış; fetvaları sunma ve sıralama yöntemi analiz edilmiştir.Üçüncü bölümde ise, eserin ismi ve müellife nisbeti belgelendirilmiş, eserin Hanefî mirası açısından değeri ortaya konmuş, metnin tahkik edilmiş şekli yazma nüshalara dayanılarak sunulmuş, gerekli ilmî açıklamalar yapılmış, hadislerin tahrici gerçekleştirilmiş ve nüshalar arasındaki farklar gösterilmiştir.Bu çalışma, Osmanlı Hanefî fıkıh mirasının önemini ortaya koymakta; dönemin âlimlerinin fetvaları aktarma ve belgelemeye yönelik yöntemlerini inceleme imkânı sunmaktadır. Ayrıca el-Kuddûsî'nin şahsiyetine ve Hanefî fıkıh geleneğinin geç dönemlerdeki devamlılığındaki rolüne ışık tutmaktadır. Bu eser, söz konusu dönemde nazari fıkıh ile amelî fetva arasında kurulan dengeyi gözler önüne sermektedir."
