abstract: "Tezde İslam Hukuku ve Türk Medeni Kanunu'nda sahih/kanuni evliliğe dayanmayan ilişkiler sonucu nesep ve gündeme gelen hukuki sonuçların benzer ve farklılıkları sunularak hükümlerinin amaçları ortaya koyulmuştur. Birinci bölüm, konuyla alakalı iki hukuk sisteminde bulunan/bulunmayan kavramları içermektedir. Kavramsal çerçeve altında yer alan başlıklar, nesep tayininde ve sonuçlarında gündeme gelen meseleler olduğu için ayrıntıya girilmeden sunulmuştur. İkinci bölümde batıl evlilik, gayr-i meşru ilişki ve yapay döllenme alanları iki hukuk sistemi üzerinden, diğer gayr-i sahih evlilikler İslam Hukuku'na has olması hasebiyle tek taraflı izah edilmiştir. Gerçekleşen bu birleşmelerin nesebe olan etkisi daha sonra incelenen konuların hareket noktası olmuştur. Üçüncü bölümde İslam Hukuku ve Türk Medeni Kanunu açısından nesebin bir evliliğe mebni olarak normal koşullarla kurulmadığı durumlarda sonradan sabit olma yöntemleri ele alınmıştır. Nesebi reddetme şekil ve sonuçları da aynı bölümde açıklanmıştır. Dördüncü ve son bölüm, nesebin sabitliği veya meçhul olması ile meydana gelen fıkhi ve hukuki sonuçları ortaya koyan ve bu şekilde iki hukuk sisteminin benzer ve farklılıklarının yorumlandığı bölüm olmuştur. Bölümde gayr-i sahih evlilik, şüpheli birleşme, evlatlık, gayr-i meşru ilişki ve yapay döllenme sonuçları gruplandırılırken yer yer sahih evliliğe de göndermeler yapılmıştır."
