abstract: "Bu çalışmada özellikle Türkiye'de görülen, karı-koca arasındaki hissesi belirlenmemiş ortak mal ve bu mal varlığı sebebiyle oluşan problemler işlenmektedir. Öncelikle halkın çoğunlukla Hanefî olması göz önünde bulundurularak mülkiyetin ferdîliği bağlamında mal ve mülkiyet ile ilgili hukuki temellendirmelere değinilmiştir. Akabinde İslâm hukukundaki şirket çeşitleri işlenmiş ve buna göre söz konusu ortak malın fıkhî zemini belirlenmiştir. Konunun ciddiyetinin kavranması amacıyla mala taalluk eden temel hak ve sorumluluklardan bahsedilmiştir. Katılımcıları ailelerden oluşan bir anket yapılmış ve sorunun reeldeki karşılığı hakkında fikir edinilmeye çalışılmıştır. Sorunun farklı birçok yeni probleme yol açtığını göstermek amacıyla, kurgusal bir örnek üzerinden hissesi belirsiz mal varlığının sebep olabileceği durumlar ve buna bağlı sorunlar türetilmiştir. Ardından hissesi belirsiz mal varlığı sorununun kaynaklarına ve çözüm yollarına değinilmiştir."
