abstract: "Hekim hataları, ölüm sebepleri sıralamasında ilk beşte yer alan tıbbi hatalar içerisinde büyük bir yer tutmaktadır. Günümüzde olduğu gibi geçmişte de sık sık rastlanan ve hukuki sorumluluk açısından eserlerde yer verilen hekim hataları konusunun ele alındığı bu çalışma, iki ana bölümden oluşmaktadır. Birinci bölümde, hekim hataları konusu modern hukukta ele alındığı şekliyle ele alınmış, hekim hatalarının nedenleri ve sonuçları hakkında ayrıntılı biçimde inceleme yapmak suretiyle hekimin sorumluluklarından bahsedilmiştir. Tezin ana bölümünü oluşturan ikinci bölümde ise hekim hataları konusu İslam hukuku açısından değerlendirilmiş, çalışmanın sınırları gereği araştırma yapılırken özellikle Hanefi mezhebine ait fıkıh eserleri esas alınmıştır. Ancak meselenin farklı şekilde ele alındığı ve konunun aydınlanmasına yardımcı olacak bilgilerin bulunduğu durumlarda zaman zaman diğer üç mezhebin görüşlerine de yer verilmiştir. Hekim hataları konusu bu şekilde hem modern hukuk hem de İslam hukuku açısından ayrıntılı olarak ele alınmış, iki doktrinin benzer ve farklı görüş beyan ettiği konular tespit edilerek değerlendirmeler yapılmıştır."
