abstract: "Küresel ölçekte belirli aralıklarla yaşanan iktisadi ve finansal krizler mevcut finansal sistemin sorgulanmasına yol açmaktadır. Yaşanan krizlerin hemen tamamı ekonomik aktörlerin yüksek oranda borçlanmasıyla doğrudan ya da dolaylı olarak ilişkilendirilmektedir. Borç krizlerinin kök sebebinin ise faiz olduğu kabul edilmektedir. Faize bağımlı ekonomik sistem finansal krizlerin tekrarını netice vermektedir. İslam faizi her türüyle yasaklamış ve bu yasağı teorik düzeyde de olsa bugüne kadar devam ettirmiştir. İslam iktisadı ve finansı ise faize bağımlı olmayan bir ekonomik sistem tasarımını hedeflemektedir. Tez, kamu sektörü borçlanmasında faize bağımlılık olgusunu ortadan kaldırmayı amaçlamaktadır. Bu amaçla farklı ve yenilikçi bir Sukuk tasarımı olduğu düşünülen İstısna' ve İleri Vadeli Kiralama akitlerine dayalı Gayrisafi Yurt İçi Hâsıla (GSYH)'ya endeksli Sukuk ihracı tasarımı önerilmektedir. Finansmanın amacı ise kamu altyapı yatırımlarının finansmanı olarak belirlenmektedir. Önerilen modelin kamu borcunun GSYH oranını otomatik dengeye kavuşturucu özelliğine vurgu yapılmakta ve İslami finansta fiyatlama unsuru olarak faiz oranlarının kullanılmasına yönelik eleştiriler bertaraf edilmektedir. Türkiye'de kamu finansmanı amacıyla Hazine ve Maliye Bakanlığı tarafından ihraç edilen Sukuk (Kira Sertifikası) sertifikalarına ilişkin hukuki ve fıkhi değerlendirmelere de yer verilen tezde kamu Sukuk ihraçlarını düzenleyen yasal çerçevenin önerilen model açısından yeterli olduğu tespit edilmiştir. Senedin ikincil piyasası açısından yeterli likiditeyi sağlayacak tutarda ihraç edilecek GSYH'ye endeksli Sukuk sertifikalarının Türkiye'yi İslami finans piyasalarında öncü bir konuma getireceği değerlendirilmektedir. Ayrıca, önerilen modelin, enstrüman çeşitliliğinin artırılmasına ve yatırımcı tabanının genişletilmesine de katkı sağlayacağı öngörülmektedir."
