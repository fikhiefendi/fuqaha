abstract: "Bu araştırmada Maveraünnehr'de yaşamış olan `Abul'azîz el-Buhârî'nin Keşfu'l-Esrâr adlı eserindeki usûlü incelenmiştir.Çalışmamız iki ana bölümden oluşmuşmaktadır.Birinci Bölümde: Pezdevî ve Buhârî'nin yaşadıkları dönem, hayatları, hocaları yetiştirdiği öğrenciler, eserleri, çalışmaları, ilmi kişiliği kısaca ele alınmıştır.İkinci Bölümde: Keşfu'l-Esrâr'ın usûlü incelnmiş; konuları, kaynakları, sistematiği, uslûbu, konuları işleyiş tarzı ile Abdülaziz el-Buhârî ve Keşfu'l-Esrâr'ın İslam Hukuku'ndaki yeri hakkında bilgi verilmiştir."
