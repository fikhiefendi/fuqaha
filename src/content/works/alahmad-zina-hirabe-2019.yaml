abstract: "Bu tez، İslâm fıkhının önemli konularından birini teşkil eden ve genellikle hadler başlığı altında ele alınan tecavüz konusunu ele almayı amaçlamaktadır. Tez، tecavüz kavramının eski fakihlerce ve günümüzde nasıl tanımlandığı konusuyla başlamakta; özellikle zinâ ve zinâ öncesi، cinsel taciz، namusun lekelenmesi gibi anlam itibariyle kendisine yakın olan kavramlarla karışma ihtimalini ortadan kaldırmak için bu kavramın ifade ettiği anlam üzerinde titizlikle durulmaktadır. Bu tezde، başvurulmadığında tecavüz davasının bir anlam ifade etmediği ve dolayısıyla hiçbir suçun terettüp edemeyeceği ikrâr، şahitlik ve tıpsal verilerden yararlanma gibi tecavüz suçunun ispat edilme yolları üzerinde yoğunlaşmaktadır. Bu tez ayrıca araştırmanın ana konusunu oluşturan tecavüz suçunun cezası، tecavüz cezası ile zinâ cezası arasında herhangi bir fark görmeyip aynı cezanın terettüb edeceğini savunan fakihler ile ve zinâ cezasını yol kesici gibi değerlendiren fakihlerin görüşlerini ele almayı amaçlamaktadır. Bu tez bunun yanı sıra söz konusu cezaların uygulanmasında muhayyer olunduğunu savunan fakihler ile cezaların mislî uygulanacağını savunan fakihlerin görüşlerine değinilerek cezasını uygulanış keyfiyetini ele almaya çalışmıştır. Bu tez aynı şekilde muğtesibin tövbesi üzerinde durmakta ve yapılan bu tövbenin cezayı düşürüp düşürmeyeceği ya da cezayı hafifletip hafifletmeyeceği gibi konulara ışık tutmaktadır. Muğtesipten zinâ suçunun düşmesi، tecavüz sonucunda bakireliğin bozulması ve idrar yolu ile rahmin karışması gibi tezavüz sonucunda muğtesebenin cisminde oluşacak söz konusu zararlar ele alınarak tezin araştırma konusu son bulmuştur. Ayrıca kürtaj ve nesep ile nafaka gibi hususlarda tecavüz sonucu doğan çocukta terettüp eden hükümler açıklanmaya çalışılmıştır."
