abstract: "?Hanefî Mezhebinde Helal Gıda Kriterleri? isimli tezimizde, helal ve haram kavramlarının ne olduğu ve gıdaların helallik- haramlık açısından hükmü ele alınmaktadır.Bu bağlamda tezimiz, ?Hanefîlere Göre Hayvansal Gıdalarda Haram-Helalliğin Kriterleri?, ?Hanefîlere Göre Bitkisel Gıdalarda Haram-Helalliğin Kriterleri?, ?Hanefîlere Göre Zaruret Halinde Haram Gıdaların Hükmü? ve ?Hanefîlere Göre İstihale ve Gıda Katkı Maddeleri? olmak üzere dört bölümden oluşmaktadır.Birinci Bölümde, Kur'an-ı Kerim'de ve hadislerde yenilmesi yasaklanmış olan hayvansal gıdalar üzerinde durarak, hayvan kesiminin ve avlanmanın fıkıh literatüründeki hükmünü inceledik.İkinci Bölümde, bitki kökenli olan içecekler, sigara ve uyuşturucu maddelerin helal ve haramlığını tartıştık.Üçüncü Bölümde, zaruret halinde haram gıdaların hükmüne ve haramla tedavinin hangi hallerde caiz olabileceğine değindik.Dördüncü Bölümde, ?Hanefîlere Göre İstihale ve Gıda Katkı Maddeleri? başlığı altında istihale yoluyla maddenin ne ölçüde değiştiğine, yeni maddenin, ona katılan ve haram olan maddeden tamamen başka bir madde olup olmadığına değinerek, genetik yapısı değiştirilen ve katkı maddesi ihtiva eden diğer gıdaları inceledik."
