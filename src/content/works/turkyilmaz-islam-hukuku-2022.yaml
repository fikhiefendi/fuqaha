abstract: "İnsan; bireyselde fıtratı gereği, toplumsal düzende de huzurun müsebbibi olarak adalete hep ihtiyaç duymuştur. Devletler de adaleti sağlama adına hukuklarını geliştirmiş, eksik sujelerini ve uygulamalarını da zaman içerisinde tamamlamışlardır. Kanunlar, adli teşkilat, yargı unsurları vs hep adalete ulaştırmayı amaçlayan hukuk düzeni için ortaya konmuş ürünlerdir. Bu çalışmada da adaleti sağlamada en önemli faktörlerden olan adli teşkilatın bir unsuru“savcılık”müessesesi ele alınacaktır.“Savcılık”kurumunun; İslam Hukukundaki tarihi gelişimini, nazariyedeki konumunu, fonksiyonunu ve önemini ortaya koymayı amaçlayan bu çalışma; savcılık konusunda farklı bağlamlarda ve genişlikte yazılmış eser ve çalışmaların bir özeti olması ve konuyu“İslam Hukuku”özelinde Türkçe olarak ele alması açısından önemlidir."
