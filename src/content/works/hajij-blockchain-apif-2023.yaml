abstract: "Bu çalışma, vakfın ne olduğunu ve yatırım mekanizmasının ne olduğunu göstererek, Blockchain teknolojisi aracılığıyla Vakıf Gayrimenkul Yatırım Fonu'nu (APIF) geliştirmeyi amaçlamaktadır. Blockchain blokları. Bu hedeflere ulaşmak için çalışma, teorik temellendirme ve ilgili önceki çalışmaların gözden geçirilmesi yoluyla çalışmanın konusunun teorik yönlerini belirlemek için analitik tanımlayıcı yaklaşıma dayanıyordu. Awqaf, 2022 MAXQDA programı aracılığıyla MS 2002 - 2021 yılları arasında fonun yıllık raporlarının gelecek planlarını analiz ederek fonun durumunu ve Blockchain teknolojisi kullanılarak ne ölçüde geliştirilebileceğini keşfetmek için APIF'e sahiptir. Çalışma, Endowment Property Investment Fund APIF geliştirme olasılığı ile APIF Endowment Property Investment Fund'ı Blockchain teknolojisini kullanarak geliştirme önerisiyle sona erdi."
