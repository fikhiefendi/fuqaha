abstract: "İlimlerin mahiyet ve gayesine dair Aristo'dan itibaren geliştirilen düşünce ve yaklaşımların, Gazâlî sonrası dönemde müslüman düşünürler tarafından daha da işlenerek İslâmî ilimlere tatbik edildiği görülmektedir. Felsefe-mantık kökenli olan bu terminoloji, fıkıh usûlcüleri tarafından da kendi disiplinlerine uygulanmış, bu çabalar sonucunda fıkıh usûlü muahhar dönemde metod ve terminoloji bakımından yapısal bir dönüşüm geçirmiştir."
