abstract: "Şer'iyye Sicilleri, Osmanlı Hukuku'nun uygulama alanının günümüze ulaşan kayıtları olarak arşiv belgeleri içerisinde önemli kaynaklardan biridir. XVIII. yüzyıl Osmanlı Hukuku'nun, İslam Hukuku'nu uygulamayı sürdürdüğü bir dönem olarak kabul edilir. Osmanlı toplumunda meydana gelen suçları ve o suçlara verilen cezaları görmek Osmanlı Hukuku'nun şer'iliği meselesinde delil oluşturur. Ayrıca suç ve ceza arasındaki denge ile adaleti görme imkânı sunar. Çalışmamızda öncelikle Osmanlı Devleti'nin benimsediği Hanefi Fıkhı'nda var olan ceza hukuku bölümlerine riayet edilerek had, kısas, diyet ve ta'zir cezalarının mahiyeti hakkında bilgilendirme yoluna gidilmiştir. Sonrasında ise tarihi bir veri olarak elimizde bulunan sicil defterlerindeki kayıtlar üzerinden ceza hukuku uygulamaları incelenmiştir. Bunlar üzerinden klasik fıkıh teorisi ile uygulama arasındaki uyum ve uyumsuzluk ilişkisi ele alınmıştır. Başlıca kaynaklarımız h.1118-1179 yıllarını kapsayan Üsküdar mahkemesine ait yedi (335, 346, 347, 352, 415, 420 ve 466 numaralı)“Şer'iyye Sicili”defteridir. Bu defterlerdeki kayıtlarda had, kısas, diyet ve ta'zir suçları ile cezaları incelenmiştir. Böylelikle XVIII. yüzyıl Osmanlı toplumunda Üsküdar Mahkemesi kadı sicillerinden örneklerle Osmanlı Devleti'nin hukuki uygulamaları incelenmiştir."
