abstract: "Tirmizû'nin Sünen'i üzerinde yaptığımız bu tezde, onun aslında her hangi birfıkhi mezhebe mensup olmadığını, delilleri kullanarak içtihat ettiğini gördük.Tirmizû'nin görüşlerini sarih olarak belirttiği noktaları, dört mezheple mukayeseetmemiz sonucunda; Tirmizû'nin içtihatlarının her zaman bir mezheple bire birörtüşmediği, onun tercihlerinin daha çok Şâfiû'i ve Ahmet b. Hanbel'e yakın olduğunugördük. Böylece, onun her hangi bir mezhebin mukallidi olmadığı, kendi başınamüstakil içtihat eden bir İslam Hukukçusu olduğu gerçeği ortaya çıktı.Günümüze kadar olan süreçte Sünen'in fıkhi yönü üzerinde bildiğimiz kadarıylaher hangi bir çalışma yapılmamıştır. Tirmizû'nin hadisçi olmasının yanı sıra aynızamanda bir fâkih olduğu, Sünen'in Fıkıh Tarihi açısından da; Tirmizû'nin yaşamışolduğu döneme kadar olan fıkhû birikimi bütün zenginliği ile günümüze iletmesindendolayı ?ilk hilâf kitabı? olma gibi ulaştığımız bu sonuçların, Sünen'in fıkıh ilmiaçısından ne kadar önemli bir eser olduğu gerçeğini ortaya koymuştur. Umudumuzulaştığımız neticelerin İslam Hukuku araştırmacılarına veri olmasıdır."
