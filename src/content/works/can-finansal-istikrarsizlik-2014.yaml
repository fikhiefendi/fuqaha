abstract: "Geleneksel iktisat, krizi dışsal bir olgu olarak ele alır. Hâkim politikalar da bu görüş doğrultusunda, ekonomilerin işleyişine etki eden dışsal etmenlerin oluşturduğu krizlerin, yapılacak müdahalelerle aşılacağı ve tekrar etmeyeceği prensibiyle çalışmaktadır. Öte yandan kapitalist sistemin yapısının kaçınılmaz olarak krizleri ürettiği yönünde fikirler de vardır. Bu çalışmanın öncelikli amacı istikrarsızlık ve krizin kapitalist ekonomilerde sistemik bir sorun olduğu yönündeki görüşleri ön plana çıkarmaktır. Bunların en kapsamlılarından birisi de kuşkusuz post-Keynesyen İktisat akımıdır. Çalışmanın içeriğinde, tanınmış post-Keynesyenlerden Minsky'nin 'finansal istikrarsızlık hipotezi' çerçevesinde finans sistemi ve krize yatkınlık konuları ayrıntılı bir şekilde incelenmektedir. Ayrıca yine çalışmanın içinde, son kırk yılda İslam ülkelerinde ortaya çıkıp gelişen 'Faizsiz Finans'ın, istikrarsızlığı önleyerek krizler karşısında sağlam bir finansal yapı oluşturabileceği yönündeki iddiaların bugün için ne kadar karşılık bulduğu ve bu tür finansın gelecekte bir fark yaratma potansiyeli taşıyıp taşımadığı soruları cevaplanmaya çalışılmıştır."
