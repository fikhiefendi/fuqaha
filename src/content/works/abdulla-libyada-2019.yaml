abstract: "Bu çalışma, kanunlaştırma yoluyla İslam şeriatını uygulamanın mümkün olup olmadığı sorusunu cevaplamaya çalışmaktadır. Çalışma giriş ve üç bölümden oluşmaktadır. Birinci bölümde, çeşitli hukuk sistemleri karşılaştırmalı olarak ele alınmaktadır. Ayrıca bu bölümde İslam şeriatının tatbiki meselesinin siyasi ve fikri çekişmelerden nasıl etkilendiği yer almaktadır. Çalışmanın ikinci bölümü, İslam şeriatının kanunlaştırma meselesinin nazari boyutunu içermektedir. Bu bölümde, kanunlaştırmanın tarihi seyri, İslam şeriatının kanunlaştırmaya ilişkin kapsamının sınırlandırılması ve farklı hukuk sistemlerinin ihtilatından kaynaklanan nazari problemler incelenmektedir. Çalışmanın üçüncü bölümü, Libya'da İslam şeriatının kanunlaştırma yoluyla uygulanmasına ayrılmıştır ve Libya kanunlarından örneklerle konu açıklanmıştır. Bunlar; medeni kanun ve ceza kanunudur. Bunları tarihi, kanuni ve tahlili yöntemler izlemektedir. Çalışmanın ulaştığı en bariz sonuç, aralarında bir uyum olmaksızın modern hukuk ile İslam şeriatının birbirine ilhak edilmesinin uygulamada düzensizliğe sebep olacak olmasıdır ki bu da, Libya tecrübesi ile ilgili olarak bu konuda vurgulamak istediğim şeydir."
