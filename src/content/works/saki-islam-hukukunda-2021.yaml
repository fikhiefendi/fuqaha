abstract: "Bu çalışmamızda İslam hukuku açısından temsil kavramı, vekâlet konusu ve vekâlet akidlerinin katılım bankalarındaki uygulamalarını inceledik. Temsil insanoğlunun geçmişten günümüze kadar her zaman ihtiyaç duyduğu bir müessesedir. Temsilin en yaygın olanı akid türü ise vekâlettir. Ticari ve sosyal hayatımızda temsil kavramı çok yaygın olarak kullanılmakta ve her geçen gün daha da yaygınlaşmaktadır. Vekâlet sözleşmeleri bu temsil akidleri arasında özel bir yeri bulunmaktadır. Finans alanındaki hızlı gelişimlerin etkisiyle, İslami açıdan faaliyet gösteren finansal kurumlar ve bu kurumların hizmete sundukları ürün ve hizmetlerinde de artış görülmektedir. Bu ürün ve hizmetler İslami açıdan değerlendirildiğinde, uygun olmayan ürünler ya kabul görmemekte ya da İslami değerlere uygun hale getirilmeye çalışılmaktadır. Finansman ihtiyaçlarının karşılanması için İslami finans sisteminde ortaya çıkan finansman yöntemlerinden biri de vekâlet sözleşmesidir. Vekâlet sözleşmesinde yatırımcı ücreti karşılığında birini vekil tayin ederken, vekil de daha önceden belirlenen oranda gelir elde etmek için bu sermaye ile ticaret yapar. Tezimizde önce vekâlet kavramı İslam Hukuku ve Pozitif Hukuk alanında geniş olarak ele alınmış, sonrasında katılım bankalarındaki uygulamaları incelenmiştir."
