abstract: "Bu çalışma İmam Serahsi'nin örf ve âdet konularındaki metodunu tespit etmeyi amaçlamaktadır. Tezimizde İslam hukukunda örf ve âdete dayalı istidlalde bulunma hususunda Serahsî'nin yaklaşımını ortaya koyan furû-i fıkıhtan çeşitli uygulama örnekleri çerçevesinde konunun farklı yönleri incelenerek ortaya konmaya çalışılmıştır. Tezimizin söz konusu amacına ulaşabilmek için öncelikle örf ve âdetin İslam hukukundaki kaynak değeri ve önemi ortaya konulmaya çalışılmıştır. Nitekim usûlcülerin örf ve adetle istidlalde bulunma yöntemlerini ortaya çıkarmak da çalışmanın ulaşmak istediği diğer bir gayesidir. Örf ve âdetin kaynak değeri ortaya konulduktan sonra, bu teorik alt yapıya dayandırılan fıkhî hükümler Serahsî'nin el-Mebsût adlı eseri özelinde incelenmiştir. Dolayısıyla çalışmamızda, teorik bir meselenin pratikteki tatbikatı, tahlil ve analiz edilmiştir. Ayrıca yeri geldiğinde konuyla ilgili diğer bazı fakihlerin görüşlerine de değinilmiştir. Bu çalışma giriş ve üç bölümden oluşmaktadır. İlk bölümde Serahsî'nin hayatı ve ilmi kişiliği ele alınmıştır. İkinci bölümde örf ve âdetin İslam hukukundaki yeri ve kaynak değeri tespit edilmeye çalışılmıştır. Üçüncü bölümde ise Serahsî'nin örf ve âdeti, furû-i fıkhın ibadetler ve muâmelât alanlarında dikkate aldığı fıkhî meseleler incelenmiştir. Buna göre, Serahsî'nin tezimizde incelediğimiz toplam 11 fıkhî meselede örf ve âdeti fıkhî hüküm tespitinde dikkate aldığı anlaşılmaktadır."
