abstract: "Yaklaşık altı asır boyunca varlığını sürdüren Osmanlı Devleti, hâkim olduğu geniş coğrafyalarda adaleti esas alarak yönetim sağlamıştır. İslam hukukunu esas almakla birlikte, kendi örf, töre ve toplumun ihtiyaçlarından doğan düzenlemeleri de bu yapıya ekleyerek özgün bir hukuk ve adalet sistemi oluşturmuştur. Bu sistem sayesinde farklı din, dil ve kültürlerden topluluklar barış içinde bir arada yaşayabilmiş, devletin uzun ömürlü olmasında adalet anlayışı önemli bir rol oynamıştır. Bu tezde, Osmanlı hukuk sisteminin 1698-1763 yılları arasında Kütahya ve çevresinde nasıl uygulandığı incelenmiştir. Araştırmanın temel kaynakları 1 ve 2 Numaralı Kütahya Şer'iyye Sicilleri ile Osmanlı arşiv belgeleridir. 1. Sicil'in tarihi 1695'den başlamaktadır. Lakin bizim çalışmamızla ilgili belgelerin ilk tarihi 1698 olduğu için tezimizin adında bu tarihi kullandık. Çalışmada, suç tipleri, faillerin sosyal ve ekonomik konumları ile yargılama süreçleri titizlikle analiz edilmiş, siciller arasındaki 59 yıllık boşluk arşiv belgeleriyle tamamlanmıştır. Amaç, Osmanlı hukukunun taşrada nasıl işlediğini, mahkemelerin toplumsal düzenin korunmasındaki rolünü ve devlet-toplum ilişkilerinin adalet mekanizması çerçevesinde nasıl şekillendiğini göstermektedir. Ayrıca, şer'î hukuk ile yerel örf ve geleneklerin birlikte işletilmesi sayesinde toplumda düzen ve barışın nasıl sağlandığı ortaya konmuştur."
