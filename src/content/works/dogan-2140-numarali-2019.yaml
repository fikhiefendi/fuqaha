abstract: "Şer'iyye Sicilleri, Osmanlı Devleti döneminde merkezden atanan kadılar tarafından şer'i mahkemelerde tutulan defterlerdir. Bu defterlerde şer'i mahkemelerde verilen kararlar, kadılara arzedilen şikâyetler, kadıların merkeze gönderdikleri çeşitli konulardaki ilamlar gibi belgeler yer almaktadır. Şeri'iyye sicilleri, sicil defterinin tutulduğu tarihlebölgenin hukuki, askeri, siyasi, iktisadi, sosyal ve kültür tarihini ortaya koyan en önemli başvuru kaynaklarıdır. Safranbolu ve çevresinin tarihi araştırmalarına katkı sağlamak amacıyla tez konusu olarak seçtiğimizH.1292-1293/M.1875-1876 tarihlerini kapsayan 2140 Nolu Safranbolu Şer'iyye Sicil Defterinde, toplamda 182 dava bulunmaktadır. Bu davaların büyük çoğunluğunu terekelerdenoluşturmaktadır. Çalışmamıza konu olan defterde 120 hüccet, 61 ilâm, 1 buyruldu bulunmaktadır. İlk sayfası yarım olan şer'iye sicilimiz daha sonra ki sayfalarda boşluk olmayacak şekilde 46 varaktan oluşmaktadır. Davalar kronolojik sıraya göre gitmektedir. Üç bölümden oluşan çalışmamızın giriş bölümünü Safranbolu'nun Coğrafi Konumu ve Tarihçesi oluştururken birinci bölümde; Osmanlı dönemine ait şer'iyye mahkemeleri, görevlileri, şer'iyye sicillerinin tanımı, mahiyeti ve bu sicillerde yer alan bazı belge türleriyle ilgili kısaca bilgi verilmiştir. İkinci bölümde, 2140 Nolu Şer'iyye Sicil Defterinin transkripsiyonuna yer verilmiştir. Üçüncü bölümde ise okuyuculara kolaylık olması açısından 2140 Nolu Şer'iyye Sicil Defterinde yer alan belge türleri, dava çeşitlerine göre tablolaştırdığımız belge özetleri, 2140 nolu Şeri'yye Sicil Defterinde geçen mahalle ve köy isimlerine yer verilmiştir."
