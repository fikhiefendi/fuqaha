abstract: "Yoksulluk, dünya nüfusunun büyük bir bölümünü etkileyen dünya çapındaki sendromlardan biridir. Finansal kapsayıcılık, temel finansal hizmetlere karşılanabilir bir maliyetle yeterli erişim sağlayarak yoksulluğun azaltılmasında önemli bir faktör olarak tanımlanmıştır. Bu araştırmanın amacı, İslam İş birliği Teşkilatı (İİT) üyesi 31 ülkede İslami bankacılığın yoksulluğun azaltılması üzerindeki etkisinin ampirik bir analizini sağlamaktır. Analiz, 1990'dan 2020'ye kadar olan ikincil kaynaklardan alınan panel verileri kullanılarak yapılmıştır. Sistem Genelleştirilmiş Momentler Yöntemi (SGMM) tahmincisi yöntemini kullanan bu araştırma, İnsani Gelişme Endeksi (İGE) ile finansal kapsayıcılık arasındaki ampirik ilişkiyi kilometre kareye düşen ATM ve banka şubesi sayısı ile ölçerek analiz etmeye çalışmıştır. Ampirik sonuçlar, İslami bankaların ATM ve banka şubelerinin sayısının, 0.1 güven düzeyinde yoksulluğun azaltılması ile pozitif korelasyon içinde olduğunu göstermektedir. Araştırma, İslami bankaların daha fazla kişiyi çekmek için mevcut stratejilerini ve araçlarını geliştirmelerini, yoksullara ulaşmak ve yoksulluğu azaltmalarına yardımcı olmak için finansal ürün ve hizmetlerinin kapsamını genişletmeleri gerektiğini öne sürmektedir. Politika yapıcıların, İslami bankacılığın finansal kapsayıcılığının önündeki başlıca engelleri ele almaya öncelik vermesi gerekiyor. Ayrıca, hükümetler ve düzenleyiciler, İslami bankaların yoksulluğu hafifletmeye yardımcı olabilmeleri için etkin bir şekilde faaliyet göstermeleri ve performans göstermeleri için elverişli bir ortam yaratmalıdır. Bu çalışma, İİT üyesi ülkelerde yapılan ilk çalışma olduğundan, özgün bulgularıyla mevcut literatüre ampirik olarak katkıda bulunmaktadır."
