abstract: "Osmanlı Devleti'nde Şer'iyye Sicili defterleri, yazıldığı dönemin; iktisadi, içtimai ve coğrafi durumunu aktaran, iyi bir kaynak olma özelliğini taşımaktadır. Özellikle şehir tarihi, iktisat tarihi, hukuk tarihi açısından, aydınlatıcı kaynakların başında gelmektedir.“22 Numaralı Kırşehir Şer'iyye Sicili'nin (H.1327-1328/M.1909-1910) Transkripsiyonu ve Değerlendirilmesi”başlıklı çalışmada öncelikle, tarihsel süreç içerisinde Kırşehir'in yeri ve durumu hakkında bilgiler verilmiştir. Şer'i mahkemeler ve Şer'iyye sicilleri hakkında da bilgiler verildikten sonra defterin transkripsiyonu günümüz harflerine çevrilmiş ve mevcut olan hükümlerin özetleri eklenmiştir. Sicilin transkripsiyonu sürecinde mahkemeye taşınan davaların çeşitliliği dikkat çekmiş; Sicilde vasi tayini, boşanma-nafaka, veraset ve alacak konuları olduğu gibi cinayet, kavga, yaralama, zina konularını içeren davalarında olduğu tespit edilmiştir. Bu dava konularına ek olarak sicilde; Ramazan ayının ve Ramazan Bayramının başlangıcına dair ilanlar da mevcuttur."
