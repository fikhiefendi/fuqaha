abstract: "Şeyhülislam İbn Kemal, Osmanlı'nın en ünlü âlimlerinden birisidir. Osmanlı'nın yükselme dönemi olan XV. ve XVI. yüzyıllarda yaşayan İbn Kemal, görüş ve düşünceleriyle dönemine damga vurmuş, hemen hemen her alanda eser kaleme almıştır. Askerlik görevini ifa ederken yaşadığı bir olay üzerine ilim tahsiline başlayan İbn Kemal, çok bilgili, dindar, devlete ve sultana bağlı, vatanını ve milletini çok seven, çok sayıda öğrenci yetiştirmiş bir âlimdir. Mezheplerle ilgili değerlendirmeleri genel olarak Ehl-i Sünnet'in genel anlayışı istikametinde görülen İbn Kemal, Ehl-i Sünnet dışındaki fırkalarla ilgili değerlendirmelerinde ise çok katıdır. İbn Kemal, bidat ehli olarak kabul ettiği bâtıl fırkaları ve bâtıl fırkalar içerisinde saydığı Rafızîleri sert bir şekilde eleştirmekte, onları küfür ve delaletle itham etmektedir."
