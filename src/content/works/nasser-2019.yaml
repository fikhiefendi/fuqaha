abstract: "Araştırmacı, yeni bir metodoloji ve metodolojiye önerilen bir yaklaşım sunmuştur. Ayrıca direk veya internet üzerinden eğitim için bir ders kitabı olmaya uygun olup alanında modern bir ders kitabına örnek teşkil edecek şekilde tasarlamıştır. Kitabı ders olarak okutmada saha ziyaretlerini, pratik ödevleri ve materyali öğretmede pratik deneyimini belgelendirmiş bir uygulama mekanizması oluşturmuştur. Bununla beraber uluslararası deneyimdeki facebook, whatsapp, Telgram, Twitter ve Instagram gibi sosyal medya araçlarını en modern yöntemlerini ve öğretim alanında kullanımını kullanma. En önemli sosyal medyanın (facebook, whatsapp, Telgram, Twitter ve Instagram vb.) çok yönlü Kullanımına ek olarak sosyal medyada en modern eğitim yöntemlerine uygun ve uluslararası deneyimlerini sentezleyerek kullanmıştır. İstanbul- Sabahattin Zaim Üniversitesinde bir örnek dersin eğitimi uygulanmış ve denemesi belgelenmiştir."
