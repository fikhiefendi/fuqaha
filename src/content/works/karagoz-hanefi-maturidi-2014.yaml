abstract: "Bu çalışmada Hanefî-Mâturidî geleneğin kıyas içerikli istidlâle bakışı ele alınmıştır. Hakkında âyet veya hadis bulunmayan bir sorunun çözümü için, benzerlerindeki hükmün uygulanması anlamında değerlendirebileceğimiz kıyas, farklı şekillerde de olsa hem Kelâmda hem de Fıkıh Usûlü'nde kullanılmıştır. Kelâmdaki kullanımına genellikle istidlâl denmiş, Fıkıh'ta ise fıkhî kıyas olarak isimlendirilmiştir. Çalışmamızın giriş bölümünde Candaroğlu İsmail Bey ve eseri Hulviyyât tanıtılmıştır. İkinci bölümde Kelâm İlmi'nde kullanılan istidlâl yöntemleri içinde kıyasın kullanılışı ile Mantık İlmi'nde kıyasa verilen yer üzerinde durulmuştur. Üçüncü bölümde fıkhî kıyas ve buna bağlı olarak illet, ta'lîl, taabbüd gibi konular ele alınmıştır. Dördüncü bölümde ise Candaroğlu İsmail Bey'in Hulviyyât adlı eserinde kıyasın nasıl kullanıldığı incelenmiştir. Giriş dışındaki her üç bölümde de kıyasın bilgi üretme değeri tartışılmıştır."
