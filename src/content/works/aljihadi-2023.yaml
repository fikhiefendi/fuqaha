abstract: "Bu araştırma, ibadet ve ruh sağlığı kavramlarını ve bunların İmam İbn Kayyim el-Cevziyye ilişkisini ve ruh sağlığına veya İmam İbn Kayyim el-Cevziyye'nin iyi yaşam olarak adlandırdığı şeye ulaşmada ibadetin rolünü anlamaya çalışmaktadır. Bu araştırmada, İmam İbn Kayyim el-Cevziyye'nin tercümesi ve tanıtılması gereken alimler üzerinden tarihsel metot ve genel ilkelere ulaşmak için olguları gözlemleme ve veri toplama açısından tümevarım metodu kullanılmıştır. Araştırmanın önemi, barındırdığı birçok sorun ve zararlar sebebiyle hukuk bilimleri, psikolojik bilimler ve İslami eğitim alanına olan katkısıyla ve sonuçlarının bilimsel araştırmalar için açık ve faydalı olmasıyla vurgulanmaktadır. Daha sonra bu sonuçların uygulanması psikoloji ve eğitim bilimlerinde seçkin Müslüman alimlerden biri olan İbn Kayyim el-Cevziyye'nin bakış açısıyla ruh sağlığına ulaştıran yollardan birini anlaşılmasıyla İslam toplumunun bazı sorunlarına çözüm üretilmesine katkı sağlayacaktır. Bu araştırmanın önemli bulguları arasında İbn Kayyim el-Cezziye'nin zihinsel sağlığa ulaşma konusunda üç yaklaşımı tanımladığı yer almaktadır: yapıcı, önleyici ve tedavi edici yaklaşımlar. O, bu bağlamda ibadetin rolünü vurgulamaktadır, çünkü bu, içsel inancı güçlendirir, onu bozuk materyallerden ve istenmeyen özelliklerden temizler ve psikolojik bozuklukların tedavisine yardımcı olur."
