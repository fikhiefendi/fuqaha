abstract: "Özellikle son yarım asırda dünyada ve ülkemizde, finansal piyasalar, piyasaya katılan yeni araçlar ile çok ciddi bir gelişme kaydetmiştir. Elbette bu yeni piyasa araçlarının piyasaya katılımında yeni arayışlar ve özellikle risk yönetim ihtiyacı, arbitraj ve hedge uygulama amacı önemli rol oynamıştır. Finansal piyasalarda ortaya çıkan bu ihtiyaçlar ve özellikle spot piyasaların yetersiz kalması türev ürünlerin ortaya çıkmasına ve yatırımcıların türev ürünler ile işlem yapma ihtiyacı duymasına neden olmuştur. Türev ürünler, finansal piyasaların gelişmesine büyük katkı sağlamanın yanında ülkemiz piyasalarının yabancı piyasalar ile entegrasyonunu da kolaylaştırmıştır. Dünya genelinde çok önemli miktarlarda alım satıma konu olan türev ürünlerin, ülkemiz ekonomisi içerisindeki yeri de yıldan yıla önemli artış göstermektedir. Bu nedenle türev ürünlerin ne olduğu, risk yönetimi ve vadeli piyasalar bakımından ne anlam taşıdığı ve risk yönetim amacına nasıl hizmet ettiği konumuz açısından büyük önem taşımaktadır. Dünya üzerinde uygulanmakta olan finansal sistemin faize dayalı olması ekonomik büyüme bakımından büyük önemi haiz olsa da, faiz uygulaması çeşitli riskleri de beraberinde getirmektedir. En başta finansal piyasalar ile reel ekonomi arasındaki makasın açılmasının en önemli müsebbiplerinden birisi olan faiz uygulaması, çeşitli sistematik riskleri de beraberinde getirmektedir. Faizsiz finans sistemini konvansiyonel finans sisteminden ayıran tek karakteristik özellik, faizin uygulanmaması olmayıp bunun yanında belirsizlik, spekülasyon faaliyetleri gibi olgular da faizsiz finans sistemi bakımından farklılık arz etmektedir. Yapılan bu çalışmada, konvansiyonel finans sistemi bakımından çok önemli finansal ürünler olan türev araçların, faizsiz finansta uygulanabilirliği tartışılacak olup bu finansal ürünlerin faizsiz finans siteminin temel ilkelerine ne ölçüde uygun düştüğü, hangi noktalar bakımından faizsiz finans sistemine uygun olmadığı ortaya konulacaktır. Bu çalışmada hem her bir türev ürünün karakteristik özelliği hem de faizsiz finans sisteminin ilkeleri ayrı ayrı değerlendirilecek ve sonrasında uygunluk denetimi yapılacaktır. iv"
