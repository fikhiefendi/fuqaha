abstract: "Farklı nitelikteki belgeleri kapsayan şer'iye sicilleri Osmanlı Devleti'nin yıkılma dönemine kadar varlığını devam ettiren şer'i mahkemelerde kadılar tarafından görülen davaların kayıt edildiği defterlerdir. Şer'iye sicilleri özellikle Osmanlı şehir tarihinin araştırılmasında; sosyal, iktisadi, hukuki, idari, kültürel ve demografik açıdan önemli bir yere sahiptir. Bu itibarla şer'iye sicilleri üzerine yapılan çalışmalar son dönemlerde artış göstermektedir. 970-1213 / 1562-1798 tarihlerini kapsayan 5 Numaralı Konya Şer'iye Sicili'nin değerlendirmesini yapmış ve transkripsiyonunu hazırlamış bulunmaktayız. Bir giriş ve dört bölümden oluşan çalışmamızda; Giriş bölümünde Şer'iye Sicilleri ve özellikleri hakkında bilgi verilip 5 numaralı Konya Şer'iye Sicili tanıtılmıştır. Diğer bölümlerde ise belgeler konularına göre sosyal, ekonomik, siyasi ve hukuki nitelikli olarak ayrı ayrı ele alınmıştır."
