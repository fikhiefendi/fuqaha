abstract: "İslam ekonomisinin gelişmesine paralel olarak Helal ürün ve hizmetler de günden güne önem kazanmakta, tüm sektörleri etkilemesinin yanı sıra turizm endüstrisi üzerinde de etkili olmaktadır. Günümüzde oteller, mevcut hizmetlerinin yanı sıra, Helal ürünler ve helal hizmet süreçleri geliştirmeye ve Helal ürün ve hizmet talebi olan müşterilerin istek ve ihtiyaçlarını tatmin etmeye ve bu sayede müşteri sadakati oluşturmaya çalışmaktadır. Bu çalışma,“Helal Konseptli”hizmet sunan otellerde yüksek ve düşük sezonda algılanan hizmetin kalitesinin müşteri sadakati ve müşteri değeri üzerine etkisinin belirlenmesi amacıyla yapılmıştır. Üç bölüm halinde tasarlanan çalışmanın birinci bölümünde Helal turizm anlayışında hizmet sunan otellerin standartları ve özellikleri üzerinde durulmuştur. İkinci bölümde hizmet kalitesi, müşteri sadakati ve müşteri değeri kavramları irdelenmiştir. Üçüncü bölümde ise sahadan elde edilen bulgular tartışılmıştır. Araştırma“Helal Konseptli”hizmet sunan dört ve beş yıldızlı otel işletmeleri müşterileri üzerinde yapılmıştır. Evrende yer alan otellerin düşük sezonunda 400 müşteriye ve yüksek sezonunda 400 müşteriye olmak üzere toplamda 800 müşteriye anket uygulanmıştır. Araştırma bulgularına göre algılanan hizmet kalitesi genel puanı ile birlikte alt boyutlar olarak fiziksel özellikler algısı, güvenilirlik algısı, heveslilik algısı, güven algısı, empati algısının düşük sezona göre yüksek sezonda daha fazla algılandığı sonucuna ulaşılmıştır. Yüksek sezonda, düşük sezona göre müşteri değeri genel puanı, fonksiyonel değer, duygusal değer, sosyal değer ve algılanan fedakârlık alt boyutlarının yüksek olduğu saptanmıştır. Düşük ve yüksek sezonda müşteri sadakatinin farklılık göstermediği sonucuna ulaşılmıştır. Araştırmada düşük ve yüksek sezonda algılanan hizmet kalitesi, müşteri sadakati ve müşteri değeri arasında pozitif yönde ilişki olduğu belirlenmiştir. Düşük ve yüksek sezonda algılanan hizmet kalitesinin müşteri sadakati ve müşteri değerinin belirleyicisi olarak pozitif etki yaptığı sonucuna varılmıştır."
