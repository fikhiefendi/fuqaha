abstract: "Tez,“giriş, üç bölüm ve sonuçtan”tan oluşmaktadır. Giriş kısmında tezin hazırlanırken takip edilen yöntem, yararlanılan kaynaklar, amacı ve önemi, kapsam ve sınıurlılıkları, kavramsal çerçeve ile Eş'arilik ve Mu'tezile mezheplerinin doğuşu,gelişimi, temel ilkeleri ve Büyük Selçuklu döneminde mensup olanlar hakkında kısaca bilgi verilmiştir. Devamında Büyük Selçuklu Devleti'nin siyasi ve dini yapısı dört başlıkta incelenmiştir. Birinci başlıkta Büyük Selçuklu Devleti'nin kuruluşu ve devletleşme sürecinden bahsedilmiştir. İkinci başlıkta Tuğrul ve Alparslan dönemlerindeki siyasi panaroma sunulmuştur. Üçüncü başlıkta büyük Selçuklu Devleti'nin diğer devletlerle olan münasebeti ele alınmıştır. Dördüncü başlıkta ise Büyük Selçuklu Devleti'nin genel dini durumu ve mezhebi yapısı hakkında incelemelerde bulunulmuştur. Birinci bölümde Büyük Selçuklular Döneminde Eş'ari geleneğin Mu'tezile algısını oluşturan sebepler ele alınmıştır. İkinci bölümde E'şari geleneğin Mu'tezile'ye karşı mücadelesinin sosyo-politik seyri hakkında bilgi verilmiştir. Üçüncü bölümde ise Eş'ari alimlerin eserlerinde Mu'tezile'yi ele alışına yer verilmiştir. Sonuç bölümünde ise çalışmanın özeti ve değerlendirmesi yapılmıştır."
