abstract: "Sosyal bir varlık olarak, bir toplum içerisinde doğup, yaşayan ve çevresiyle ilişki içerisinde olan insan, bu ilişkilerinde kendisine tanınan haklara uyarken, yüklenen yükümlülüklere de riayet etmek zorundadır. Toplum düzeninin ve adaletin sağlanabilmesi adına, kişinin, kendisine tanınmış olan haklarını aşması veya yükümlülüklerini yerine getirmemesi sonucunda belirli sorumluluklarından bahsedilir. Bu sorumluluklar bir akit nedeniyle ortaya çıkabileceği gibi, arada bir akdin bulunmadığı durumlarda da gündeme gelebilir. Akit dışı sorumluluğun en yaygın şekli ise haksız fiil sorumluluğu olarak da bilinen, kusur sorumluluğudur. Çalışmamızda kusur sorumluluğunun İslâm hukukunda hangi kavramlar altında incelendiği, kaynaklarının neler olduğu, sorumluluk çeşitleri kapsamında hangi başlıkların altına girebileceği anlatılmış ve bu sorumluluğun unsurları ele alınmıştır. Son olarak ise, kusur sorumluluğunun görünüş şekillerine de yargı kararlarından oluşan örnekler eşliğinde yer verilmiştir. Konu ele alınırken modern hukuk ile mukayese edilmiş ve modern hukuktaki sorumluluk hukuku sistematiği çerçevesinde bir inceleme yapılmıştır."
