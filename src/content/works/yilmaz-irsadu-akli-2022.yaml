abstract: "Müteşâbih konusu, öteden beri islam alimlerinin kafa yorduğu, günümüzde dahi canlılığını koruyan ve nasıl anlaşılması gerektiği hususunda üzerinde ihtilaf edilen meselelerin başında gelmektedir. Kur'an'da müteşâbih ayetlerin bulunup bulunmadığı, varsa bunların hangi ayetler oldukları ve insanlarca anlaşılmalarının mümkün olup olmadığı gibi hususlar bu konudaki ihtilafların başlıcalarıdır. Bu çalışma Osmanlı döneminin en ünlü simalarından biri olan ve otuz yıl mütemadiyen şeyhülislamlık vazifesini yürüten Ebüssuûd Efendi'nin, yazmış olduğu İrşâdü'l- Akli's- Selîm adlı tefsirinde müteşâbih konusunu nasıl değerlendirdiğini ve müteşâbihler hakkında nasıl yorumlar yaptığını incelemeyi amaçlamaktadır. Bu bağlamda Şeyhülislam Ebüssuûd Efendi'nin öncelikle Kur'an'da müteşâbihlerin varlığını kabul edip etmediği veya müteşâbih kabul edilen ayetleri hangi perspektiften ele aldığı ve neticede müteşâbihlerin insanlar tarafından bilinebilmelerinin mümkün olup olmadığı konusundaki görüş ve beyanatları ortaya konmaktadır. Üç bölümden oluşan çalışmamızın ilk iki bölümünde Şeyhülislam Ebüssuûd Efendi ile bir usûl konusu olarak muhkem ve müteşâbih kavramları tanıtılmaktadır. Üçüncü bölümde tezimizin esas konusu olan Ebüssuûd Efendi'nin İrşâdü'l- Akli's- Selîm adlı tefsirinde müteşâbih ayetlere yaklaşımları ayet ayet irdelenerek sistemli bir kurgu içerisinde sunulmaktadır. Bununla birlikte her bir bölümün ardından varılan sonuçlara ve yapılan çıkarımlara kısa değerlendirmeler şeklinde bölüm sonlarında yer verilmektedir."
