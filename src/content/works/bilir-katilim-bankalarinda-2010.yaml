abstract: "Bu tez çalışması, katılım bankalarında müşteri memnuniyetini ölçmek ve müşteri odaklı bir hizmet anlayışı güden katılım bankalarına müşteri memnuniyeti ve sadakati sağlayabilmeleri için gerekli öneri ve fikirleri sunmak amacıyla hazırlanmıştır. Çalışma beş bölümden oluşmaktadır. Çalışmada öncelikle araştırma ile ilgili ön bilgiler verilmiş olup, daha sonra katılım bankaları ve müşteri memnuniyeti kavramlarına ilişkin gerekli açıklamalara yer verilmiş ve araştırmaya ilişkin analiz yapılarak bu analiz sonuçları ışığında gerekli tespit ve önerilerde bulunularak çalışma sonuçlandırılmıştır. Araştırmanın evrenini Hatay illinde bulunan katılım bankalarının müşterileri oluşturmaktadır. Katılım bankası şubeleriyle yapılan görüşmelerde, müşterilere şube içinde anket uygulaması yapılmasının genel müdürlükçe uygun bulunmaması gerekçesiyle müşterilere şube dışında kendi belirledikleri ortamlarda anket soruları uygulanmıştır. Anket sorularının hazırlanmasında, Parasuraman, Zeithaml ve Berry tarafından geliştirilen ve hizmet kalitesini müşterilerin beklentileriyle firmanın sunduğu hizmet algılaması arasındaki farkın büyüklüğü olarak tanımlayan `'Servqual Yöntemi'' kullanılmıştır. Elde edilen sonuçlar `'SPSS For Windows Programı'' ile analiz edilerek gerekli sonuçlar elde edilmiştir."
