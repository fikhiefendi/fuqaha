abstract: "Bu çalışmanın amacı, İslamî ilimlerin birçok alanında eserler telif eden Hâkim en-Nîsâbûrî'nin (ö. 405/1014) hadis usulünü tespit etmek, onun yazmış olduğu eserlerden hareketle ortaya koyduğu hadis usulü anlayışını kendisinden önceki ve sonraki hadis usulü âlimleri arasındaki orjinalliğinin nereden kaynaklandığını araştırmaktır. Giriş bölümü araştırmanın önemi, amacı, yöntemi ve kaynaklarından oluşmaktadır. Ayrıca Hâkim'e kadar hadis usulünün tarihi gelişimi hakkında genel bilgiler ele alınmıştır. Çalışmanın birinci bölümünde Hâkim'in yaşadığı dönemin siyasî, sosyal ve ilmî durumu, hayatı, ilmî kişiliği ve Ma'rife adlı eserinin öncesi ve sonrası hadis usulü eserleriyle mukayesesi yapılmıştır. İkinci bölümünde Hâkim'in hadis usulüne dair görüşleri, isnada yönelik değerlendirmeleri, râvi sayısına göre hadislerin kısımları, kaynağı ve sıhhat açısından hadis çeşitleri gibi konular ele alınmıştır. Üçüncü bölümünde ise Hâkim'in cerh ve ta'dîle bakışı, hadis tarihi konularını değerlendirmesi, fıkhu'l-hadis, nâsıh-mensûh, garîbu'l-hadis ve ihtilafu'l-hadis gibi konulara bakış açısı ele alınmıştır. Anahtar Kelimeler Hadis, Râvi, Cerh-ta'dîl, Fıkhu'l-hadis, Hâkim en-Nîsâbûrî"
