abstract: "Yeni dünya düzeninde yeni nesil iş düşüncelerinin evrensel olarak aktifliği artmaya başlamış ve dünya genelinde çalışmalar sürdüren startuplar ortaya çıkmıştır. Ancak bu girişimler kuruluştan yatırım yapabilecek düzeye gelene kadar pek çok zorlukla karşılaşmaktadırlar. Bu zorlukların en dikkat çekeni finansman sağlamak konusunda kendisini göstermektedir. Finansman konusunda meydana gelen güçlükler sebebi ile pek çok iş düşüncesi hayata geçirilmesi mümkün olmamakta ya da hayata geçse bile büyüme sağlanmadan çalışmalarını sona erdirmektedirler. Yeni nesil iş düşüncelerinin hayata geçirilebilmesi için büyümüş ve ülkemiz gibi büyümekte olan ülkelerde alternatif öz sermaye finansman kaynağı olarak katılım bankalarının sağlayacağı teşvik, destek ve fon sağlama uygulamaları önemli bir yer tutmaktadır. Böylece bir yandan iş düşüncelerinin hayata gelmesinde girişimcilere yardımcı olunurken diğer taraftan ekonomide yükseliş meydana gelecektir. Bu çalışmada startuplar ve girişimler ile ilgili genel bilgilere değinilerek, katılım bankalarının çalışma sistemi , katılım bankalarının startupları fonlamasının nasıl gerçekleştirildiği ve fonlama uygulamalarının etkinliği geniş bir perspektif çerçevesinde incelenmiştir."
