abstract: "İslâm Dininin en önemli esaslarından biri olan öşür ibadeti, Hz. Peygamber zamanında kurum haline getirilmiş ve bu kurumun organizesi kamu otoritesinin yetkisine havale edilmiştir. Hz. Peygamber döneminde öşür ürünlerinin toplanma zamanı belirlenmiş, düzenli bir şekilde toplanması için görevliler atanmış, toplanan öşür ürünleri kayıt altına alınmış ve Kur'ân-ı Kerîm'de belirtilen yerlere dağıtılmıştır. Öşür müessesesinin işlevselliğini yerine getiren en önemli organ ise öşür toplayan görevliler olmuştur. İslâm'ın yayıldığı coğrafyalara gönderilen görevliler öşre tabi olan ziraat mahsullerini toplayarak sosyal dengeyi sağlamışlardır. Öşür müessesesi, Hz. Peygamber döneminde inşa edilmiş sosyal bir kurumdur. Bu kurum tam anlamıyla işlerlik kazandığı için toplumdaki fakirlik problemine çare bulunmuş ve insanların sıkıntıları büyük oranda çözülmüştür."
