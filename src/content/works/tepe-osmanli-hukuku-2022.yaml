abstract: "Bu tez çalışmasında Hukuk-ı Aile Kararnamesi oluşturulurken icra edilen yasama faaliyetinin Osmanlı Anayasasına ve Osmanlı hukukunun meşruluğunu sağlayan şer'i hukuk kurallarına ne oranda uygun şekilde icra edildiği belirlenmeye çalışılmıştır. İlk bölümde öncelikle kavramların doğru bir şekilde anlaşılması adına yasama faaliyeti ile ilişkili olan terimler üzerinde durulmuş ve bunlar arasındaki farklar izah edilmiştir. Daha sonra Osmanlı hukukunun tarihi kökenleri olan eski Türk hukukundaki“töre”nin nasıl oluşturulduğu anlatılmış ve akabinde Osmanlı hukukunun İslam hukuku kökenli bir hukuk sistemi olması dolayısıyla İslam hukuku yasama faaliyeti usul ve esasları üzerinde durulmuş ve İslam hukuk tarihindeki yasama faaliyeti ile iligili gelişmelere yer verilmiştir. İkinci bölümde öncelikle örfi ve şer'i hukuk kavramları arasındaki ilişki izah edilmiş ve Osmanlı hukuku yasama faaliyeti ürünlerinin hangi yasama faaliyeti usulü ile hazırlandığı belirlenmeye çalışılmıştır. Daha sonra Osmanlı hukukunda Klasik ve Tanzimat devri ayrımı yapılarak yasama yetkisinin hangi kişi ve kurumlara ait olduğu belirtilmiş ve yasama meclislerinde yasama faaliyetinin nasıl icra edildiği anlatılmıştır. Üçüncü bölümde öncelikle Hukuk-ı Aile Kararnamesi'nin hazırlanma nedenleri ve içeriği hakkında bilgiler verilmiştir. Daha sonra Osmanlı Anayasası olan Kanuni Esasi'deki yasama faaliyeti usulü açıklanmıştır. En sonunda verilen bilgiler ışığında Hukuk-ı Aile Kararnamesi'nin Kanuni Esasi'deki ve İslam hukukundaki yasama faaliyeti usul ve esaslarına ne derece uygun tanzim edildiği ortaya konulmaya çalışılmıştır."
