abstract: "Bu çalışma, çağdaş fıkıh problemlerinin çözümü konusunda kurul ictihadını ve bu ictihadın uygulamalı örneği olarak Uluslararası Mecmau'l-Fıkhi'l-İslâmî'ni incelemeyi hedeflemektedir. Dolayısıyla bu çalışma üç bölümden oluşmaktadır. Birinci bölümde ilk olarak çağdaş fıkıh problemlerinin tanımı, çeşitleri ve ortaya çıkma nedenleri hakkında bilgiler verilmiş, sonrasında kurul ictihadının tanımı, tarihçesi, meşruiyeti, şartları ve şekilleri ortaya konulmuştur. İkinci bölüm önde gelen fıkıh kurullarının tanıtımına hasredilmiştir. Bu bölümün ilk kısmında uluslararası ve özel fıkıh kurulları incelenmiş ve bu kurullara ait fetva örnekleri verilmiştir. İkinci kısmında ise Uluslararası Mecmau'l-Fıkhi'l-İslâmî ayrıntılı bir şekilde tanıtılmış ve fıkıh kurulları çeşitli yönlerden karşılaştırılmıştır. Üçüncü bölümde bu çalışma için örnek olarak seçilen Uluslararası Mecmau'l-Fıkhi'l-İslâmî'nin çalışmaları ele alınmış, ilk olarak kurum faaliyetleri, dönem toplantıları, araştırmaları, müzakereleri ve kararları incelenmiştir. İkinci kısımda kurumun çalışmalarına uygulamalı bir örnek olarak sağlık sigortası konusu seçilmiş, konu tüm ayrıntılarıyla ele alınmış ve genel bir değerlendirme yapılmıştır. Anahtar Kelimeler: Fıkıh, İslam Hukuku, Çağdaş Fıkıh Problemleri, Güncel Fıkıh Meseleleri, İctihad, Kurul İctihadı, Kollektif İctihad, Uluslararası Mecmau'l-Fıkhi'l-İslamî, İslam Fıkıh Akademisi"
city: "İstanbul"
