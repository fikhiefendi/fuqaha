abstract: "ÖZET Pera (Beyoğlu), XX. yy.a kadar Lövanten ve Avrupalı nüfusunun getirdiği özellik nedeniyle batılı gezginlerin daima yakınlık duyduğu, seyahatnamelerinde yaşamından kesitler verdikleri bir bölge olmuştur. XX. yy.da ise cumhuriyetle birlikte gelen ve nüfus yapışım değiştiren sosyal ve ekonomik değişim, bazı yazarların geçmişi araştırarak bölgeye nostaljik bir yaklaşımla eğilmelerini getirmiştir. Bu tezin amacı, hakkında çok fazla sayıda yayın çıkmasına rağmen pek azının bilimsel araştırmaya dayandığı Pera'nın ekonomik, kültürel ve siyasi yapısının mimariye etkilerinin araştırılmasıdır. Bu amaçla seyahatnameler ve bölgede yayınlanan günlük gazeteler taranmak suretiyle buradaki her türlü haber, ilan ve reklam değerlendirmeye alınmış ve haritalara işlenerek değerlendirilmiştir. VI. Daire'ye ait Abdülaziz Albümleri ile önemli bir belgesel değer taşıyan Sigorta Haritaları üzerinde yapılan saptamalarla, Pera (İstiklal) Caddesi'nin Galatasaray ile Tünel arasında kalan bölümünde konut-ticaret ilişkisi ortaya çıkarılarak, tek ailelik konuttan apartmanlaşmaya geçiş çeyrek yüzyıllık bir farkla her iki harita üzerinde irdelenmiştir. Tez altı bölümden oluşmaktadır. 1. Bölümde çalışmanın amacı, kullanılan yöntem ve yararlanılan kaynaklar tanıtılmıştır. 2. Bölümde bölgenin topografyası, fiziki sınırları ile mahalle ve sokakları tanımlanmıştır. 3. Bölümde ise İstanbul tarihi içinde XIX. yy.a kadar Pera'nın, bir uzantısı olduğu Galata bölgesi ile bağıntılı olarak tarihsel gelişimi irdelenmiştir. 4. Bölüm, araştırmanın ağırlığını oluşturan ve sonuç için verilerin toplandığı bölümdür. Burada büyük çoğunlukla gazetelerden elde edilen bilgilerle Pera'daki sosyo-ekonomik, kültürel ve politik durumla birlikte ilk belediye kararları ve bunların 1870 yangını sonrasında kentsel dokuya yaptığı etkiler araştırılmış, ayrıca bölgedeki yapı tipleri, Batı'lı örnekleriyle karşılaştırılarak ortak yanlar ortaya çıkarılmıştır. 5. Bölümde, bir önceki bölümde elde edilen veriler değerlendirilerek haritalar üzerine işlenmek suretiyle bölgenin konut-ticaret ilişkisi ile konut yapısı ortaya çıkartılarak ilk çok katlı konutlardan örnekler verilmiştir. 6. Bölüm sonuç bölümüdür. Pera'nın tarihsel gelişimi içinde mimari olgusunun genel bir değerlendirmesini içermektedir. Çalışmada üç ek bulunmaktadır. Ek A'da üzerine saptamaların yapıldığı haritalar ile cephe siluetleri verilmiştir. Ek B'de Mecelle-i Umur-u Belediye'de çıkan ve VI.Daire'nin kuruluş kararını belirten bölümlerle, L'Indicateur Constantinopolitain Guide Commercial'den alınan ilgili fotokopiler ve yazılı kaynaklardan yararlanılarak hazırlanan çizelgeler yer almaktadır. Ek C'de ise günlük gazetelerden alınan konuyla ilgili reklam ve ilanların fotokopileriyle, bölgeyi tanıtan gravür, kartpostal ve fotoğraflar verilmiştir. xıı"
