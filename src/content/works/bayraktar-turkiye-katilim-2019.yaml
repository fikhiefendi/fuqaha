abstract: "Katılım esasına dayalı fon portföyü, kira sertifikaları, katılma hesapları, ortaklık payları, altın ve diğer kıymetli madenler ile Sermaye Piyasası Kurulunca uygun görülen diğer faize dayalı olmayan para ve sermaye piyasası araçlarından oluşmaktadır. Bu çalışmanın amacı katılım esasına dayalı bireysel emeklilik yatırım fonlarının performanslarını Sharpe Oranı, Treynor Oranı, Jensen Alfası, M², T² ve Değerleme Oranı ölçütlerine göre analiz etmektir. Katılım esasına dayalı bireysel emeklilik fonları belirlenirken emeklilik yatırım fonlarının fon tüzüklerindeki varlık türleri incelenmiş, 21.03.2019 tarihi itibariyle faaliyette olan 266 emekli yatırım fonundan 53 tanesinin katılım esasına dayalı emeklilik yatırım fonu olduğu tespit edilmiştir. Bu fonlardan 40 tanesi 01.08.2014 tarihinden önce faaliyetine başladığından dolayı analizlerde kullanılmıştır. Bu araştırma sonucunda 40 katılım esasına dayalı fon içerisinde 10 fonun performans getirileri pozitif iken, diğer 30 fonun performans getirileri negatif çıkmıştır. Performansı başarılı olan 10 katılım esasına dayalı emeklilik yatırım fonundan 9'unun varlık türü yoğunluğu altına dayalı sermaye piyasası araçlarından oluştuğu tespit edilmiştir. İncelenen 40 fonu yöneten fon şirketlerinin fon performansları ile kamu ve özel şirketler tarafından yönetilen fonların performansları arasında farklılık tespit edilmemiştir. Ayrıca yüksek risk grubundaki katılım esasına dayalı emeklilik fonlarının performanslarının daha başarılı olduğu sonucu elde edilmiştir. Katılım esasına dayalı emeklilik yatırım fonlarının yöneticilerinin seçicilik ve piyasa zamanlama yeteneklerinin olmadığı sonucuna ulaşılmıştır. Altına dayalı sermaye piyasası araçlarından oluşan katılım esasına dayalı emeklilik yatırım fonlarının krizden etkilenmediği, diğer fonların ise krizden negatif etkilendiği tespit edilmiştir."
