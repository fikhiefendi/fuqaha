abstract: "Bu çalışma hayır işleri ve insani yardımın, sağlam ve güçlü üretken bir ekonomiye dayanarak, gelişmesinin faktörlerini incelemeyi amaçlamaktadır. Bu kapsamda Kuveytli başarılı iş adamları örneği üzerinden hareket edilmiştir. Ticari alanda ve ekonomik arka plana sahip olan bu kişilerin Kuveyt hayır işlerinde nasıl başarılı işlere imza attıkları ve Kuveyt'e has bir örnek haline getirdiklerini incelemektedir. Kuveytte hayır faaliyetleri petrolün bulunmasından önceki döneme dayanmaktadır. Kuveyt Devleti bu kapsamda hayır ve insani yardım alanında önde gelen ülkelerden biridir. Siyasi ve doğal afet ve krizlere maruz kalan çok sayıda ülkeye yardımda bulunmuş bir ülkedir. Kuveyt geçmişten bu yana her zaman önemli bir finans merkezi haline gelmiştir. Petrolün bu kapsamda çok büyük bir rolü vardır. Kuveytte bulunduğu zaman ekonomiye büyük katkıları sunmuştur. Kuveyt ekonomisi kısmen küçük sayılabilecek bir ekonomidir. Genelde devlet kontrolünde olan bu ekonomi hayır işlerini geliştirmiş olup, bu alanda çalışan kuruluşların sayısını artırmıştır. Siyasi, ekonomik ve diğer önemli ve etkili günlük hayat sektörlerini etkilemiştir. Kuveyt ayrıca İslam dininin talimatlarına göre çalışan bankaların kurulmasında da büyük rol üstlenmiştir. Bu kapsamda, Kuveyt finans Evi gibi içinde çok sayıda iş adamının emeği geçen kurumlar kurulmuştur. Şeyh Abdullah EL-Mutavva bu kapsamda öne çıkan kişilerden biridir. Kendisi tanınan cömert bir iş adamdır. Hayır, işleri alanında çok sayıda projeye imza atmıştır. Araştırmacı Şeyh Abdullah EL-Mutavvaa tarafında yapılan çok sayıda yerel düzeyde, körfez düzeyinde, Arap ülkeleri düzeyinde ve dünya düzeyinde çok sayıda başarılı işe imza atmıştır. Şeyh Abdullah EL-Mutavva güçlü ve etkili bir ekonomik sistemin kurulması ve hayır işlerinin etkili ve devamlı olması için çok sayıda çalışmaya imza atmıştır. Araştırmacı, Şeyh Abdullah EL-Mutavva örneğinin üzerine odaklanmayı ve ticari, hayır ve insani yardım alanındaki başarısının araştırılmasını tavsiye etmektedir."
