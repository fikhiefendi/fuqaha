abstract: "Artan nüfus oranı, teknolojik gelişmeler ile birlikte özellikle şehir merkezlerine alınan yoğun göç, barınma ve geçinme ihtiyacı sebebiyle konut ve işyerlerine olan talebin artmasına sebep olmuştur. Bunun sonucunda ise, toplumda birçok birey, kiraya veren ya da kiracı sıfatıyla hukukî problemler yaşamaya başlamıştır. Kiraya veren ya da kiracı sıfatıyla yaşanan ihtilafların sıklığından dolayı, özellikle de kira sözleşmelerinde daha zayıf konumda bulunan kiracının menfaatlerinin korunması amacıyla bazı düzenlemeler getirilmiştir. Öncelikle 818 Sayılı Borçlar Kanunu, akabinde ise 6570 Sayılı Gayrimenkul Kiraları Hakkında Kanun sayesinde kira sözleşmelerine ilişkin uyuşmazlıklara çözüm aranmıştır. Sonrasında ise, yürürlükte olan kanunların menfaat dengesi gözetmede ve özellikle kiracıyı korumada yetersiz kalması sebebiyle 1 Temmuz 2012 tarihinde, 6098 sayılı Türk Borçlar Kanunu yürürlüğe girmiş ve halen yürürlüktedir. Çalışmanın konusu“Konut ve Çatılı İşyeri Kira Sözleşmelerinin Kiraya Verenden Kaynaklanan Sebeplerle Sona Ermesi”dir. Kiraya verenden kaynaklanan tahliye sebepleri, Türk Borçlar Kanunu'nda sınırlı sayıda yer almış olup; bu tahliye sebepleri gereksinim, yeniden inşa ve imar ile yeni malikin gereksinimidir. Çalışmanın amacı; kiraya verenden kaynaklanan sona erme sebeplerini, uygulama, doktrin ve yargı kararları çerçevesinde incelemektir."
