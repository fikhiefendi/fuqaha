abstract: "Küresel finans sektörü son on yıldır ciddi bir dönüşüm geçirmektedir. Hızla gelişen günümüz dünyasında, finans ve teknolojinin bir araya gelmesinden oluşan fintek, finans sektörü için yenilikçi bir alan doğurmuştur. Ancak bankaların baskın yapısı, müşteri verilerinin bankaların elinde olması ve fintek sektörünün yeni gelişmesi gibi sebepler finteklerin göz ardı edilmesine sebep olmuş ve İslami Fintek sektörünün gelişim hızını yavaşlatmıştır. Teknolojideki hızlı gelişmeler, İslami fintek sektörünün İslami finans ürünlerine yönelik tutumun ele alınış biçimini de sürekli olarak yeniden değerlendirilmesini gerektirmiştir. Fintekler hız kazanmaya devam ettikçe İslami finans sektörü bu gelişimi benimsemeye başlamış ve İslami fintek olarak bilinen yeni bir olgunun ortaya çıkmasına sebep olmuştur. Bu tez finansal teknolojilerin İslami finans ürünlerinin gelişimindeki önemini değerlendirmek amacıyla yazılmıştır. Ayrıca çalışma, geleneksel katılım bankalarının katılım esaslı ödeme kuruluşu kurması açısından SWOT analizi ve A'WOT yöntemi ile analiz eden ilk çalışma özelliğine sahiptir. Geleneksel katılım bankasının katılım esaslı bir ödeme sistemini kullandığında ortaya çıkacak güçlü ve zayıf yönleri tespit edilmiş, oluşan tehditler ve fırsatlar ortaya konulmuştur. Bulgular sonucunda paydaşlara stratejik önerilerde bulunulmuştur."
