abstract: "Son dönem Osmanlı anayasal reformları siyasi bir takım manevralar mıdır, yoksa dönemin hukuk doktrinine uygun bir şekilde köklü bir hukuksal reform girişimi midir? Bu tezin temel amacı 19. Yüzyıl anayasal belgelerinde öngörülen insan hakları koruma rejimini bu soru etrafında incelemektir. Osmanlı devleti 19. Yüzyıl'da dikkate şayan bir anayasallaşma hareketi içerisine girmiştir. Tanzimat dönemi olarak da adlandırılan 1808-1875 yılları arasında, birçok anayasal belge ortaya çıkmış ve bu belgelere bağlı olarak bir çok uyum yasası hayata geçirilmiştir. Bu belgeler Müslüman ve gayrimüslim bütün Osmanlı tebaasının hak ve hürriyetlerini garanti altına alan ilk yazılı resmi beyanlar olması açısından anayasa tarihimiz için büyük önem arz etmektedirler. Bu belgelerle garanti altına alınan haklar klasik İslam hukukuna göre mi şekillendi, yoksa batılılaşma hareketlerinin etkisiyle mi ortaya çıktı meselesi doktrinde uzun zamandan beri tartışmalı bir konudur. Meseleyi hukuk tarihi ve İslam'da insan hakları tartışmaları içerisinde ele alarak, disiplinler arası bir çalışmayla, anayasal belgelerde garanti altına alınan haklarının doktrinsel temellerini ortaya koymaya çalışacağım. İsmet terimi fıkhın teşekkül döneminden beri bireylerin hak ve hürriyetlerini korumak için İslam hukuku literatüründe kullanılmakta olan bir kavramdır. Ben de, tezimde, anayasal belgeler ile oluşturulan insan hakları koruma rejimi üzerinde ismet kavramının etkisini araştırarak dönemin hukuk doktrininin anayasallaşma hareketleri üzerindeki etkisini ortaya koymaya çalışacağım. Anayasal reformların batı etkisiyle gerçekleştiği iddiası döneme ilişkin araştırmaların çıktıları sınırlandırabilecek ve yanlış yönlendirebilecek indirgemeci bir yaklaşımdır. Bu tezin temel iddiası, Tanzimat reformlarının (i) İmparatorluğun tam anlamıyla modern bir devlete dönüşmesinin sonucu olarak, (ii) dikkat çekici bir şekilde bürokrasi lehine, (iii) batılı devletlerin talepleri de dikkate alınarak, (iv) ve dönemin hukuk doktrinine uygun bir şekilde yürütüldüğüdür."
