abstract: "Bu çalışma, Osmanlı hukuk sisteminin temel taşlarından biri olan Mecelle-i Ahkâm-ı Adliyye'nin 101. maddesinden 1095. maddesine kadar olan bölümünü çeviri yazı ve günümüz Türkçesine tercüme, elde edilen tarifleri derleyip sözlük oluşturmayı amaçlamaktadır. 19. yüzyılın ikinci yarısında Ahmed Cevdet Paşa'nın öncülüğünde hazırlanan Mecelle-i Ahkâm-ı Adliyye, İslam fıkhına dayalı olarak oluşturulan ve modern hukuk sistemlerine geçiş sürecinde bir köprü vazifesi gören ilk medeni kanun niteliğindedir. Araştırmada doküman inceleme yöntemiyle metin incelenmiş; çeviri yazı çalışmaları metnin asıl yapısına sadık kalınarak gerçekleştirilmiştir. Tercüme sürecinde ise hem anlam bütünlüğü hem de terimlerin bağlama uygunluğu gözetilmiştir. Araştırmanın temel amacı, Mecelle-i Ahkâm-ı Adliyye metninin özgün yapısını koruyarak, günümüz okurlarına anlaşılır biçimde sunmak ve bu tercümeyle hukuk, dil ve tarih alanlarına katkı sağlamaktır. Bunun yanı sıra çalışmada Mecelle'nin oluşum süreci, Ahmed Cevdet Paşa'nın rolü ve Mecelle Cemiyeti'nin yapısı gibi tarihî arka plan unsurları da ele alınmıştır. Bu yönüyle çalışma, hem Osmanlı hukuk literatürüne hem de Osmanlı Türkçesi metin çözümlemelerine yönelik bir katkı sunmayı hedeflemektedir."
