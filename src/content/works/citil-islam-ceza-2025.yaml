abstract: "İslâmiyet, bireysel ve toplumsal hayatı düzenlemek maksadıyla emir ve yasakların uygulanması için özendirici veya caydırıcı önlemler almıştır. Bu önlem ve yaptırımlar ceza kavramı içinde değerlendirilmektedir. İslâm hukukunda kişinin hürriyetini kısıtlayan cezalardan biri de hapis cezasıdır. Bu ceza çeşidi, Hz. Peygamber döneminden itibaren çeşitli değişimler geçirmiştir. Ta'zîr suçları kapsamında ele alınan hapis cezası, İslâmiyet'in ilk dönemlerinde alıkoyma amaçlı kullanılmıştır. Bu alıkoymalar cezadan çok, cezayı hazırlayan ortamlar olarak görülmüştür. Ancak İslâmiyet'in egemen olduğu toprakların büyümesi, büyük İslâm devletleri kurulmasıyla birlikte yaygın olarak asıl ceza olarak kullandığı görülmüştür. Hapis cezasının geçirdiği bu süreç oldukça karmaşıktır. Aynı zamanda Kur'an'da hangi suçlarda hapis cezası verilmesi gerektiği belirtilmemiş ya da yasaklanmamıştır. Bu ceza çeşidi, toplumsal gerekliliklerin bir sonucu olarak değişim ve dönüşüme uğramıştır. Hz. Ali'nin hilafet dönemine kadar, özel olarak inşa edilmiş hapishaneler bulunmamaktadır. Ancak alıkoyma amacıyla, mescitler, evler, dehliz, mahzen ve kuyu gibi mekanlar kullanılmıştır. Dolayısıyla uygulama farklılıkları olmasına rağmen ilk dönemlerden itibaren İslâm adalet sisteminde hapis cezasının yeri önemli olmuştur. İslâm hukukçuları hapis cezasının uygulama şekilleri konusunda fikir ayrılıklarına düşmüştür. Cezalar, ağırlığına ve işlenen suça göre hem devlet yöneticileri hem de yargıçlar tarafından belirlenmiştir. Hapis cezasının İslâm hukuk literatüründe yer bulması, hapishanelerin ve mahkûmların durumlarını da ele alma lüzumu doğurmuştur. Temel hak ve özgürlüklere önem veren ve doğuştan getirilen haklara inanan İslâm hukuku kapsamında, hukukçuların uyarılarına zaman zaman uyulmamış, hapishaneler korkutucu zindanlara dönüşmüştür. Bu durum, mahpusların ve hapishanelerin durumunu yeniden gözden geçirmeyi gerekli hale getirmiştir."
