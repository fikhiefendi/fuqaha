abstract: "Değişen ve dönüşen dünya ekonomisinde İslam iktisatçılarını meşgul eden temel problemlerden birisi de sermaye piyasasının önemli araçlarından olan hisse senetleri ve onun ortaya çıkardığı yükümlülüklerdir. Borsalarda alım satımı yapılan ve sermaye akışının önemli bir parçası olan hisse senetleri, doğurduğu yükümlülükleri ile İslam İktisatçılarının hükmünü tartıştığı güncel meselelerdendir. Anonim şirketlerde eşit parçalar halinde esas sermayedeki payları temsil eden hisse senetleri, ortaklarına sadece sermayenin zamanında getirilmesi sorumluluğunun dışında şirkete ortak olma vasfını ve ortaklık sorumluluğunu da ifade etmektedir. Şirkete ortak olma vasfı ortakların, gerçekleşen şirket kazancından kâr alma, öncelikli pay alma gibi mali haklara; genel kurula katılma, şirket yönetimini etkileyebilen oy kullanma ve şirketi temsil etme gibi idari haklara sahip olabildiğini ifade etmektedir. Bu ortaklıktan çıkmak her ne kadar kişinin ihtiyarı ile olsa dahi kural olarak pay sahipliğine yeni bir ortak bulunmadıkça önceki pay sahibi ortaklık hakkından vazgeçememektedir. Bu çalışma hisse senetlerinin doğurduğu sermaye ortaklığının pay sahipleri için aynı zamanda sermayede aynî bir ortaklık vasfını ortaya çıkarıp çıkarmadığı sorusunun cevabını arayacaktır. Türk Ticaret Kanunu (TTK) ve Sermaye Piyasaları Kanunu'nda geçen ortaklık yapısının sağladığı hak ve yükümlülükler doğrultusunda sermaye ortaklığının, şirket mal varlıkları üzerinde bir ortaklık yapısını da ifade etmesi halinde İslam iktisatçılarının bu yapıya sahip ortaklığa bakış açıları incelenip değerlendirilecektir. Çalışmada AAOIFI'nin çağdaş ortaklık standardında öngördüğü hisse senetlerinin ortaklık üzerindeki yapısıyla TTK'nin hisse senetleri üzerine atfettiği ortaklık yapısı karşılaştırılıp değerlendirilecektir. Aynı zamanda hisse senetleri alımıyla yatırımcıların sahip oldukları aynî haklar İslam iktisadının mülkiyet teorisi üzerinde değerlendirilecek ve hisse senedi; anonim ortaklık yapısı mülkiyet bağlamı içerisinde ele alınacaktır. Çalışmada İslam İktisatçılarının hisse senetleri hakkındaki görüşleri içerik analiz yöntemiyle incelenip değerlendirilecek, çalışma kapsamı içerisinde Türkiye'deki güncel kanunlara göre anonim ortaklık, yasal mevzuata göre hisse senetlerinin anonim şirketteki değeri belirlenerek İslam İktisadındaki Anonim ortaklığa uygunluğu değerlendirilecektir."
