abstract: "Katılım bankacılığı günümüz bankacılık sistemi içinde önemi giderek artmakta olan bir bankacılık türü olarak dikkat çekmektedir. Gerek faiz hassasiyetine sahip bireylerin ellerindeki atıl fonların ülke ekonomisine kazandırılması, gerekse körfez ülkelerindeki biriken petro-dolarların ülkeye çekilebilmesi için katılım bankacılığı önemli bir alternatif oluşturmaktadır. Bu sebeplerle katılım bankacılığı sadece Müslüman ülkeler için değil tüm dünya ekonomisi için bir alternatif olmuştur. Buna rağmen katılım bankaları toplumun birçok kesimi tarafından tam anlamıyla bilinmemektedir. Bunun en önemli sebebi de katılım bankacılığının tanıtımının yeterli yapılamamasıdır. Katılım bankacılığı sisteminin Türkiye'de yeterli tanıtımının yapılamaması sebebiyle henüz yaygın olmayışı ve altı katılım bankasının mevcut sistemde hizmet vermesi kar pastasının bölünmesine ve rekabetin de artmasına sebep olmuştur. Hazırlanan bu çalışma kapsamında müşterilerin katılım bankası seçiminde tercihlerini etkileyen faktörleri belirlemeyi ve bu faktörler kapsamında en seçilebilir katılım bankasını bulmayı amaçlamıştır. Banka tercihini etkileyen dokuz kriter şunlardır; Uygun şartlarda finansman, reklam ve tanıtım, karlılık, şube ağı, net kar, sosyal sorumluluk faaliyetleri, ürün ve hizmet ağı, faizsizlik prensiplerine uyum, ve personel tutum ve davranışıdır."
