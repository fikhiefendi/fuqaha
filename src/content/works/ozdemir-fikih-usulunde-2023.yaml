abstract: "Tahsîniyyât güzel olan, göze hoş gelen, tabiata uygun olan, beğenilen, kemâl sıfatta olan ve şer'an sevaba delalet eden fiilleri ifade eden bir kavramdır. Bir fıkıh usulü terimi olarak tahsîniyyât, maslahatın üçüncü mertebesinde karşımıza çıkmaktadır. Maslahat mertebesindeki konumu itibarıyla tahsîniyyât, davranışlardaki en üst noktayı, ahlakın en üstününü, dinde takvalı olmayı, eşyanın en güzel hâlini ve medeniyetin zirve noktasını ifade eden bir maslahattır. Maslahat zarûrî, hâcî ve tahsînî seviyede korunması gereken beş zarûrî ilkenin (din, can, akıl, nesil ve mal) korunmasını sağlamaktadır. Bu mertebelerden asıl olan zarûriyyâttır. Örneğin canın korunması için insanın yemesi, içmesi, giyinmesi ve barınması zarûriyyâttandır. Çaresiz kalan insanın haram olan yiyeceği ölmeyecek kadar yemesinin câiz olması, canın korunmasına yönelik hâciyyâttandır. Pis ve iğrenç şeylerin yenilip içilmesinin yasak olması, temiz ve leziz yiyeceklerden yenilmesi ise tahsîniyyâta örnektir. Her mertebe, diğeri etrafında koruyucu nitelikdedir. Beş zarûrî ilkenin korunması açısından tahsîniyyât mertebesinin korunması, zarûriyyât ve hâciyyâtın korunması kadar önemlidir. Çünkü tahsîniyyât mertebesi ortadan kalktığında zamanla hâciyyât ve zarûrîyyât da ortadan kalkma tehlikesiyle karşılaşır. Tahsîniyyât mertebesi bir toplum için olmazsa olmaz değilse de tahsîniyyât olmadan bir toplumun medeniyetler seviyesine ulaşması imkân dışıdır. Bir eşyanın en üstün seviyesi, bir bireyin kemâl noktası ve bir toplumun medeniyetin zirvesine ulaşması, tahsîniyyâtın varlığı ile mümkün olur."
