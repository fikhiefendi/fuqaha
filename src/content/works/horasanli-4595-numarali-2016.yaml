abstract: "Bu çalışma, Kastamonu ve Tosya tarihine; dönemim sosyal, ekonomik, kültürel ve toplumsal hayatına ışık tutan 4595 Numaralı Kastamonu Şer'iyye Sicili'nin Transkripsiyon çalışmasıdır. Yapılan çalışmadan hareketle Kastamonu ahalisinin hayat tarzı, iktisadi durumları, mahkemelerde görülen dava çeşitleri ve kayıt altına alınan tereke tutanakları ile engin bilgiler elde edilmektedir. 4595 numaralı Kastamonu Şer'iyye Sicili hicri 1279-1284, miladi 1862-1868 yılları arasında tutulan mahkeme kayıtlarını ihtiva ettiğinden, dönemin ana kaynağı hükmündedir. Çalışma sırasında sicil içerisindeki belge asıllarına sadık kalarak, en doğru şekilde transkript edilmeye çalışılmıştır. Yapılan çalışmanın son bölümünde belgeler, genel bir çerçeve oluşturularak; gerek Kastamonu, gerek Tosya, gerekse kadı ve mahkemeler hakkında çalışmalar yapacak olan günümüz araştırmacılarına sunulmuştur."
