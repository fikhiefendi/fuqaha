abstract: "SARS-CoV-2 tedavisinde kullanılan ve ayrıca son yıllarda insanların koranavirüs hastalığı (COVID-19) tedavisinde ihtiyaç duyduğu ilaçlardan favipiravirin ve ribavirinin moleküler yapılarının farklı özellikleri Yoğunluk Fonksiyonel Teorisi (YFT) B3LYP/6-311G(d, p) ve 6-311+G(d, p) yöntemleri kullanılarak araştırılmıştır. Favipiravir ve ribavirinin moleküler yapılarının geometrik optimizasyonu taban durumda, gaz ve su çözücü ortamlarında yapılmış, bağ parametreleri elde edilmiş ve bulunan teorik sonuçlar literatürdeki değerler ile karşılaştırılmıştır. Enerji hesaplamalarından, moleküler orbital enerji değerleri elde edilerek, her iki ortam için, elektron ilgisi, elektronegatiflik, kimyasal potansiyel, kimyasal sertlik, yumuşaklık, elektrofilisiti indeks gibi küresel reaktivite parametreleri elde edilmiştir. Küresel reaktivite değerleri kullanılarak ΔN (yük transfer) ve ECT (elektrofilisiti temelli yük transfer) gibi iki parametre yardımıyla adenin, guanin, sitozin ve timin DNA bazları ile favipiravir ve ribavirin moleküler yapıları arasındaki etkileşimler su ortamında araştırılmıştır. Optimize edilen favipiravin ve ribavirin moleküler yapıları kullanılarak her iki ortam için taban durumda frekans hesabı yapılmış ve moleküler yapıların entropi, entalpi, ısı sığası, sıfır nokta titreşim enerjisi ve Gibbs serbest enerji gibi termodinamik özellikleri araştırılmıştır."
