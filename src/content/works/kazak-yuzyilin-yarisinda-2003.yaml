abstract: "295 ÖZET XIX.Yüzyılın ilk yansına ait olan şer“i mahkeme sicillerinin incelenmesinden oluşan çalışmamızda şehrin idari, ekonomik, sosyal ve askeri yapısını anlamaya çalıştık. Bu dönemde genel hatlarıyla şehrin yapısı ortaya çıkmıştır. İdari açıdan Osmanlı ülkesinde Kütahya,Saruhan,Aydın,Hüdavendigar(Bursa), Kastamonu,Menteşe(Muğla),Bolu,Ankara,Kengırı(Çankırı).Teke ili(Antalya),Hamid İli(lsparta),Sultanönü ve Balıkesir'in de dahil olduğu Anadolu eyaletinin bir parçası olan Karahisar-ı Sahib sancağı, 1839'da Hüdavendigar adıyla teşkil edilen eyalete bağlanmıştır. Sancak 1867 senesinde mutasarrıflık şeklinde idari teşkilatlanmadaki yerini almıştır. Vezir rütbesinde olan ve birkaç sancağın birden idaresini üstlenen mutasarrıflardan, kayıtlarda adı geçenlerini tesbit etmemiz mümkün olmuştur. Görev yerlerine gitmeyen mutasarrıflar, gönderdikleri mütesselimler vasıtasıyla görevlerini sürdürmüşlerdir. Bu müteselimlerden de çoğunun adı sicilerimizde belirlenmiştir. Şehrin en önemli yöneticilerinden biri olan kadılar, hem idari hem beledi ve hem de hukuki işlemlerden sorumlu bulunuyorlardı. Kadılardan bir kısmı, görev yerlerine gönderdikleri naibler vasıtasıyla hizmetlerini yürütmeyi tercih etmişlerdir. Diğer önemli bir yönetici de nakibü'l-eşraf kaim-makamı olup bunlar, peygamber soyundan gelen yani sadat-ı kiramdan olan kimselerin durumu ile ilgileniyorlardı. Bu kimselerin kayıtlarının tutulması, birer suretinin İstanbul'da bulunan nakibül 'l-eşrafa gönderilmesi ve sadattan olduklarını ileri süren fakat böyle olmayanların menedilmesi görevlerini yürütüyorlardı. Sadat-ı kiramdan olan kimselere birer berat veriliyordu. İncelediğimiz dönemde bir çok nakibül'l-eşraf kaim-makamının Karahisar-ı Sahib ve kazalarında görev yapmış olduğunu tesbit ediyoruz. Şehirdeki yönetici zümreden diğer bir gurup olan müftiler de tesbit edilmiştir. Müftiler, şer*i mahkemedeki anlaşmazlıklara, verdikleri fetvalarla yol gösterici olmuşlardır.296 Şehrin yönetiminden sorumlu kimseler, zaman zaman bir takım uygunsuz davranışlar ve istismarlara da sebep olmuşlar ve bu yüzden cezalandırılmışlardır. Sürgüne gönderilen ve görevinden azledilen birçok müftü, nakibü'l-eşraf kaim - makamı, kadı ve mütesellim vardır. XIX. Yüzyılın ilk yarısında ehl-i örf taifesinin reaya üzerindeki ekonomik baskılarının artmış olduğunu biliyoruz. Bir çok ehl-i örf mensubu, halktan haksız yere para toplamış, vergileri istismar etmiş ve zaten ekonomik durumu pek de iyi olmayan halkı ezmişlerdir. Ehl-i örfün halka yaptığı zulümleri sona erdirmek isteyen devlet, gönderdiği pek çok emirler ile böyle davrananları menetmek ve cezalandırmak zorunda kalmıştır. Yine de bu istismar ve zulümlerin önüne tam anlamıyla geçmek mümkün olmamıştır. Sancak idari açıdan Karahisar-ı Sahib, Sandıklı, Şuhud, Sincanlı, Karamık, Çay, Çölabad, Bolavadin, Barçınlı ve Nevahi-i Barçınlı olarak kazalara bölünmüştür. Çalışmamıda Karahisar-ı Sahib sancağının köylerini ve mahallerini de tesbit ettik Şehrin nüfus yapısı incelerken, bilhassa avarız vergisi kayıtlarından ve belgelerde verilen hane sayılarından yola çıkarak bir takım hesaplar yapmak mümkün olmuştur. Avarız hanelerinden yola çıkarak şehirde 43.593 kişinin yaşadığını tesbit ediyoruz. Hane sayılarından yola çıkarak da şehir merkezinde 14.715 kişinin ikamet ettiğini belirledik. Elde ettiğimiz rakamlar, şehir hakkında çeşitli kaynaklarda gözterilenlerle paraleldir. Nüfus konusuna değinirken, şehirde yaşayan gayrimüslim yani Ermeni vatandşlardan da bahsetmek gereklidir. Kayıtlardaki verilerde Nasara mahallesinde 225 hane olduğu anlaşıldığından buradaki nüfus 1125 kişi olarak hesaplanmıştır. Fakat Doğancı, Zaviye, Tac Ahmed ve Cami-i Kebir gibi mahallelerde müslüman halk ile bir arada yaşayan Ermenilerin varlığını da gözönüne alırsak tam bir nüfus tesbit etmemiz mümkün olamamaktadır. Şehirde yaşayan gayrimüslimlerin pek çok hukuki problemlerini şefi mahkemelerde çözümlemiş olduklarını görüyoruz. Gerek kendi aralarında ve gerekse müslümanlarla olan problemlerde, kayıtlara geçmiş pekçok olaya tesadüf297 edilmekteydi ki bu durum bize daha ucuz ve hızlı olan şer”i mahkemelerin tercih edilmekte olduğunu göstermektedir. Karahisar-ı Sahib sancağının ekonomik durumu konusunda devlete verilen vergilere ait kayıtlar dolayısıyla epeyce bilgi sahibi oluyoruz. Zira XIX. yüzyılın ilk yarısında Karahisar-ı Sahib'den alınan pek çok örfi vergi vardır. Avarız, nüzul, iane-i cihadiyye, kalyoncu bedeliyyesi, ref-i menzil bedeli, imdad-ı hazeriyye gibi vergilere ait bilgiler bize hem şehrin Osmanlı iktisadi hayatındaki yerini belirtiyor, hem de vergilendirme sistemine ait ipuçları sunuyor. Bu örfi vergilerin yanı sıra öşür, cizye ve adet-i ağnam gibi şer'i vergiler hakkında da pek çok kayda bu mahkeme sicillerinde yerverilmiş bulunuyor. Ekonomik hayatın en önemli unsuru olan ticaret, Karahisar-ı Sahib'in önemli yollar üzerindeki konumu dolayısıyla oldukça canlıdır. Şehirde pek çok iç ve dış piyasada üretilen mal kullanılmakta ve başka şehirlere satılmaktadır. Şehirde birçok meslek kolu görev yapmaktadır ve kendilerine ait çarşıları da bulunmaktadır. Sanayi alanında Osmanlı ekonomisinin mühim üretim dallarını barındıran Karahisar-ı Sahib, barutun hammaddesi olan güherçilenin üretildiği sayılı şehirlerden biridir. Ayrıca saçma, kurşun ve enfiyeye ait veriler de şehirde bu yönde bir sanayinin geliştiğine işaret etmektedir. Narh kayıtlarına dair verilerden gıda, demir ve sabun, tuz, mum gibi diğer ihtiyaç maddelerine ait fiyatların yıllara göre gösterdiği değişimler öğrenilebiliyor. Tereke kayıtları ve satışa dair belgeler ile de hayvan, ev, bağ ve dükkan fiyatlarını öğrenebiliyoruz. Sosyal hayat, Karahisar-ı Sahib sancağında oldukça canlıdır. Mahkemeye yansıyan pek çok nikah, boşanma, nafaka, vesayet, vekalet ve miras davalarına rastlıyoruz. Bu belgelerde isimler, fiyatlar, hukukun işleyişine dair kurallar, İslam dininin sosyal hayata verdiği şekil apaçık görülmektedir. Mahkeme kayıtları şehirde yaşayan insanların kullandığı isim ve lakaplar konusundaki bilgimizi genişletecek bir çok veriye sahip bulunmaktadır. Şehirde kurulan vakıflar, sosyal hayatın nasıl düzenlendiğinin, hayır hizmetlerine ne kadar298 önem verildiğinin bir göstergesidir. Şehirde vakıf uygulamasının Tanzimat döneminde yeniden düzenlenmeye tabi tutulduğunu, cami, medrese ve benzeri pek çok sosyal kurumun vakıflar eliyle işletildiğini görmekteyiz. Şehir, askeri faaliyetler açısından çok etkin olmamasına rağmen orduya pek çok asker vermiştir. Sancakta tımar sistemi, XIX. yüzyılın ilk yarısında hala uygulanmaktadır. Sancak, orduya askerin yanı sıra at, deve, gıda maddesi bakımından destek de olmaktadır."
