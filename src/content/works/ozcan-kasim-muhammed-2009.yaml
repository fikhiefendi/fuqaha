abstract: "Tâbiûn döneminin önde gelen hadis âlimlerinden Hz. Âişe'nin yeğeni Kâsım b. Muhammed, fukahâ-i seb'a adı verilen Medineli meşhur yedi fakihten biridir. O aynı zamanda Ömer b. Abdülaziz'in Medine valisiyken oluşturduğu fetva heyetinde yer alan on âlim arasında bulunmaktadır. Halife Ömer b. Abdülaziz, resmi olarak hadis tedvin faaliyetini başlatmasının ardından bizzat Kâsım b. Muhammed'in hadislerinin de yazılıp bir araya getirilmesini istemiştir. Önceleri hadislerin yazımına pek sıcak bakmayan Kâsım, tedvin faaliyetine katılarak hadislerinin yazılmasına izin vermiştir. Hadisleri yazılırken bizzat kontrol ederek, rivâyetlerde lafız değişikliğinin yapılmamasına özen göstermiştir. Hocaları arasında en çok halası Hz. Âişe'den hadis nakletmiştir. Kendisinden de öğrencileri arasında yer alan oğlu Abdurrahman en fazla hadis rivâyetinde bulunmuştur. Bu da aile üyeleri arasındaki güçlü rivâyet ilişkisini göstermektedir. Kütüb-i Tis'a çerçevesinde yapılan araştırmada tespit edilen 531 rivâyetin tamamına yakınının muttasıl olduğu görülmüştür. Bu rivâyetler daha çok ibadât ve muamelât konularıyla alakalıdır. Beyan ettiği fıkhî görüşleri de rivâyetlerinin konularıyla benzerlik arz etmektedir. Kâsım, fıkhî görüşlerini daha çok konuyla ilgili hadis ya da sahabi uygulaması naklederek belirtmiştir. Bu da onun zengin bir hadis ve rivâyet birikimine sahip oluğunu göstermektedir. Buna mukabil ortaya çıkan yeni meselelerde zaruri olarak bizzat kendi görüşünü belirttiği durumlar da olmuştur. Dolayısıyla Kâsım, ehl-i hadis fukahası arasında yer almaktadır. O, bu grubun içerisinde hem hadis nakli, hem de fetva ve içtihat konularında ön plana çıkmış bir âlimdir."
