abstract: "Osmanlı hukuk sistemi iki temel yapıdan oluşmaktadır. Birincisi İslamiyet öncesi Orta Asya göçebe geleneğinden gelen örfi hukuk diğeri ise İslamiyet'in kabulü sonrası tatbik edilmeye başlanan Şer'î hukuktur. Bu bağlamda İslam hukuk sistemi içerisinde görevli kadılar tarafından tutulan şer'iyye sicili dediğimiz mahkeme kayıtları çalışmamıza konu olmuştur. Üzerinde çalıştığımız 217 numaralı Urfa şer'iyye sicilinin ikinci bölümü 125 varak 258 sayfadan oluşmaktadır. Sicilin son bir kaç sayfasındaki tahrip olan ve eksik bölümler hariç büyük bir ölçüde okunabilmiştir. Defterin kayıt altına alındığı dönem çok kısa bir süre olmasına karşın içerdiği belge çeşitliliği itibariyle sosyal yaşama dair mühim bilgiler elde edilmesi bakımından önem taşımaktadır. Defterde yer alan belgeler konulara göre tasnif edilğinde en fazla karşımıza çıkan belge türünün 190 adet ile vekil tayini olduğunu görmekteyiz. Bunu 42 belge ile alacak-verecek ve 36 belge ile miras taksimi takip etmektedir. Mahkemeye başvuran davalı, davacı ve şahitlerin kimliği üzerinden toplumun etnik yapısı hakkında bilgi sahibi olmakla birlikte yine bu şahısların yerleşim yerlerinin belirtilmesi sayesinde Urfa'nın mahhale, köy ve kazâlardan oluşan çok sayıdaki yerleşim biriminin ismini tespit edebilmekteyiz. Aynı zamanda şahısların ismi ile beraber kullanılan lakaplar ve ünvanlar vasıtasıyla kişilerin hangi mesleği icrâ ettiğini görebilmekteyiz. Sicilde yer alan resmi görevlilerin atama belgeleri ile bölgede hangi vakıfların, medreselerin dolayısıyla Urfa'nın eğitim kurumları diye sayabileceğimiz mederese ve vakıf isimlerine rastlamaktayız. Sonuç olarak tezimizin amacı Osmanlı döneminde Urfa'nın sosyal ve kültürel yaşantısına dair bilgi vermeyi hedeflemiştir."
