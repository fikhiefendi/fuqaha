abstract: "Hukuk, toplu halde yaşayan insanların sosyal hayatını düzenler. İnsanlar arasındaki uyuşmazlıkları çözen ve bu faaliyeti devletin gücü ile hâkimler aracılığıyla yapan bir ilim dalıdır. Kanunların tüm olayları kapsamadığı kabul edilen bir gerçektir. Hâkimler karşılaştığı davaları sonuca ulaştırmak zorundadır. Fakat karşılaşılan her uyuşmazlık için kanunda hüküm bulunmamaktadır. Bu durumda hâkim kanun içi boşluğu hak ve nısfete uygun olarak doldurarak, kanun dışı boşluk bulunması durumunda ise kanun koyucu gibi davranıp uyuşmazlığı çözecektir. Beşerî hukukta kavramlaşan takdir yetkisinin İslâm hukukunda varlığı ve mahiyetini ortaya koymayı hedeflediğimiz bu çalışmada, İslâmî müktesebatımızdaki fıkıh, hadis ve tefsir gibi klasik kaynakların yanı sıra beşerî hukuk metinlerinden ve uygulamanın zikredildiği şer'iyye sicillerden de faydalanılmıştır. Üç bölümden oluşan çalışmamızın giriş kısmında konunun ehemmiyetine, kaynaklarına ve önceki çalışmaların incelenmesine yer verilmiştir. Birinci bölümde takdir yetkisi ve ilgili kavramlar incelendikten sonra tarihsel süreç izah edilerek bölüm sonlandırılmıştır. İkinci bölümde uyuşmazlığın görüşüldüğü dava süreci ele alınmıştır. Muhâkeme usulünün işlendiği bu bölümde İslâm hukukunun bu aşamada hâkime tanıdığı takdir yetkisi, mümkün olduğu kadar mezhepler arası ihtilaflara da başvurularak Türk hukuku ile karşılaştırmalı olarak incelenmiştir. Üçüncü bölümde ise ceza ve aile hukukunda bulunan takdir yetkisi de bu usule uygun olarak incelenmiştir. İlaveten şer'iyye sicillerden uygulama örnekleri verilerek mukayeseli bir çalışma ortaya konulmuştur. Zira takdir yetkisinin varlığı, yargılama esnasındaki uygulamalarla ispatlanmaktadır. Sonuç olarak beşerî hukukta var olan takdir yetkisinin aslında İslâm hukukunda daha kapsamlı olarak yer aldığı ortaya konulmaya çalışılmıştır."
