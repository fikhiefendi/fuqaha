abstract: "RUS ORYANTALİST STANİSLAV MİHAYLOVİÇ PROZOROV'UN İSLAM MEZHEPLERİ VE ŞİÎLİĞE YAKLAŞIMI Abdullazhon ABDULLAEV Erciyes Üniversitesi, Sosyal Bilimler Enstitüsü Doktora Tezi, Mart 2026 Danışman: Prof. Dr. Muharrem AKOĞLU ÖZET Elinizdeki bu tez, Rus oryantalist Stanislav Mihayloviç Prozorov'un İslam mezhepleri ve erken dönem Şiîliğe yaklaşımını İslam Mezhepleri Tarihi perspektifinden incelemektedir. Çalışmanın hedefi, Prozorov'un entelektüel kişiliğini, yetiştiği Leningrad/St. Petersburg oryantalizm geleneği içindeki konumunu ve İslam'a ilişkin yöntemsel tercihlerini ortaya koymak, ardından onun ilk ihtilaflar, Hâricîlik, Mürcie, Mu'tezile ve erken dönem Şiîlik hakkındaki değerlendirmelerini tahlil etmektir. Araştırma, Prozorov'un makale, monografi, ansiklopedi maddesi, önsöz ve bildirilerinden oluşan Rusça külliyatı esas alınarak metin merkezli ve betimleyici bir yöntemle yürütülmüş, bunun yanında elde edilen bulgular sınırlı düzeyde saha gözlemleriyle de tahkim edilmiştir. Tezde, Prozorov'un İslam'ı tarihsel süreçte teşekkül etmiş ideolojik bir sistem ve toplumsal bir olgu olarak ele aldığı, bu doğrultuda kaynak merkezli ve bağlamsal tarihçiliği önceleyen bir yaklaşım geliştirdiği tespit edilmiştir. Onun mezhebî ve mektebî oluşumların tümünü, İslam'ın tarihsel gelişim sürecinin içkin unsurları olarak değerlendirdiği, ilk ihtilafları ise ağırlıklı biçimde hilafet ve iktidar ilişkileri ekseninde yorumladığı görülmüştür. Hâricîlik, Mürcie ve Mu'tezile'ye dair analizlerinde tarihsel bağlamı merkeze alan Prozorov'un, bu oluşumları İslam tarihinin erken döneminde ortaya çıkan dinî, siyasî ve toplumsal gerilimler ekseninde değerlendirdiği anlaşılmaktadır. Bu çerçevede erken dönem Şiîliği siyasî bir muhalefet hareketinden imamet anlayışına ve nihayet On İki İmam doktrinine uzanan süreç içinde ele aldığı belirlenmiştir. Bununla birlikte, Şiî kaynaklara ağırlık veren yaklaşımının mukayeseli okuma imkânını kısmen sınırlandırdığı bulgular arasındadır. Sonuç olarak bu çalışma, Prozorov'un İslam mezhepleri tarihine dair yaklaşımını sistematik biçimde değerlendirmekte ve ilgili literatüre katkı sunması beklenmektedir."
