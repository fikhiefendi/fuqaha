abstract: "Bu çalışmada, Mecelle'den günümüze Türkiye'de fıkhın dönüşüm süreci; İslam Hukuk Tarihi dönemleri, 1917 tarihli Hukuk-ı Aile Kararnamesi, 1924 tarihli Hukuk-ı Aile Kanun Tasarısı ve Cumhuriyet'in ilanından sonraki gelişmeler çerçevesinde incelenmiştir. Bu noktada İslam Hukuku Tarihi kaynakları ile Türkiye'de İslam Hukuku alanında yapılan çalışmalara müracaat edilmiştir. İtikadi ve ahlaki normlarıyla Mekke devrinde başlayan İslam Hukuku, Medine devrinde inen ayetlerle ve Hz. Peygamber'in açıklamalarıyla ana hatlarına kavuşmuş, başta müçtehit imamların görüş ve içtihatları ile sonraki dönemlerde yapılan çalışmalarla daha da gelişim katetmiştir. Fıkhın uğradığı bu değişim ve gelişmelerde gerek şahıs ve nesiller gerekse siyasi, sosyal ve kültürel durumlar etkili olmuş, ilgili süreçte dönemler çeşitli tasniflendirmelerle ifade edilmiştir. Kurumsallaşma adına Mecelle'ye kadar önemli bir yol kateden İslam Hukuku, Mecelle ile yeni bir atılım geçirmiş, kanunlaştırma ve içtihatlarla uyanış dönemi yaşamıştır. Ardından Türkiye Cumhuriyet'in kuruluşuyla fıkha yeni yaklaşımlar önerilmiş, her ne kadar siyasi nedenlerden ötürü fıkhı kısıtlayıcı yaklaşımlar yürütülse de zamanla bu kısıtlamalar kırılmış ve İslam Hukuku'nun önü açılmıştır. Özellikle çok partili hayata geçişle birlikte İslami ilimlerde görülen rahatlama ve Yüksek İslam Enstitüsü'nün kuruluşuyla İslam Hukuku alanında yapılan çalışmalarda artış yaşanmıştır. 2000 sonrası başta ekonomi, gıda ve tıp olmak üzere çeşitli fıkhi uzmanlık alanları ortaya çıkmış, yapılan ilmi toplantı ve sempozyum organizasyonlarıyla fıkhın alanı genişlemiştir. Bugün ilgili çalışmalara devam edilmekle birlikte bu çalışmalar Fıkıh ya da İslam Hukuku terkibine izafe edilerek yürütülmektedir. Elde edilen bulgular neticesinde siyasi ve sosyal nedenlerden ötürü yer yer kısıtlanan ve baskı altına alınan bir hukuk anlayışından devrin ihtiyaçlarını göz önüne alan, tek mezhebe bağlı kalmayan ve İslam Hukuku'nun imkanlarından faydalanabilen bir hukuk anlayışına geçildiği sonucuna ulaşılmıştır."
