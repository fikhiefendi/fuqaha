abstract: "İslami hukuk teorisinde, maslahat kavramı İslam hukukunun değişen çevre ile uyumluluğunu gösteren önemli bir yasal araçtır, bu yüzden bu kavram İslam hukukunun sürekli değişen çevre ile bağlantısını sağlar. Bu çalışma, İslam hukuks metodolojisinde yaygın olarak basvurulan maslahat ilkesini arastirmaktadir. Bunun yanisira, calışma maslahatın yasal tanımı, geçerliliğini ve koşullarını da incelemektedir. Bu yasal ilke, mevcut kanunları yeni koşullara genişletmek ve uyarlamak için yasal bir araç olarak hizmet etmektedir. Ayrıca bu ilke hukukçulara hukukun ilgili metinlerinde yer almayan durumlarla başa çıkmaları icin olanak saglar. Bu çalışma hukuk kavramı maslahati açıkladıktan sonra, aynı zamanda İslam hukuku alanında tanınmış Türk Müslüman alimlerden Hayrettin Karaman'ı da tanıtmaktadır. Çalışmanın temel amacı, Karaman'ın maslahat ilkesi ile ilgili duruşunu belirlemektir. Karaman'ın maslahat üzerindeki yazılarını inceleyerek, bu alimin liberal muhafazakâr özelliğini aciga cikarmistir. Karaman'ın hayatı ve maslahat teorisi incelenmistir. Pek çok gelenekselci bilim adamı gibi, İslam hukukunun klasik yapısının modern dünyaya uygun oldugunu israrla belirtmektedir. Ancak Karaman yeni şartlar ve modern değerlerle başa çıkmak için bazı düzenlemeler yapma gereğini inkar etmemektedir. Bu bağlamda, Karaman'in maslahat ile baglantili içtihat ve zaruret hakkındaki görüşleri de tartışılmıştır. Yasaklı maddelerle tıbbi tedavi konusundaki bir örnek, modern donemdeki Müslüman alimlerin kanun yapma sürecinde maslahat ilkesine nasıl başvurduğunu gostermek icin, takdim edilmistir. Bu örnek, Karaman'nin Islam hukukunun modern zamanlarda islevsel olabilecegini ve yine Islam hukukunun yeni kosullara gore uyarlanabilecegini kanitlamak icin maslahat ilkesine basvurarak ahlaki ve hukuki hukumler elde etittigini gosterdigi icin bu alimin liberal muhafazakâr özelliğini desteklemektedir."
