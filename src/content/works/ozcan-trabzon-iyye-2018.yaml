abstract: "Çalışma, Osmanlı Anadolusu'nun önemli şehirlerinden Trabzon'u merkeze alan ve XVII. yüzyılın ilk yarısında bu şehirde yaşamlarını sürdürmüş olan kadınların toplumsal, ekonomik, siyasi ve ahlaki konumlarını ortaya koymayı amaç edinen bir inceleme niteliğindedir. Söz konusu nitelikte bir araştırma yapmaya yönelmemizin en önemli nedenlerinden birisi emekleme döneminde olan sosyal tarih incelemelerinin içerisinde kadınlara ilişkin tarih araştırmalarının henüz beklenen seviyeye ulaşmamış olması ve bu konu üzerine yapılacak çalışmaların Osmanlı tarihi ile ilgili bilinenlere de büyük katkılar sağlayacağının düşünülmesidir. Bu tez çalışması dört ana bölümden oluşturulmuştur. Osmanlı kadınını daha iyi anlayabilmek ve kadınların toplumsal, ekonomik ve ahlaki açılardan nasıl ve ne şekilde konumlandırıldıklarını anlamlandırabilmek adına İslam hukuku, fetvalar, kanunnameler ve şer'iyye sicillerindeki kadınlık algısının tartışıldığı birinci bölümde, Avrupalı kadınların da din ve toplum tarafından kendilerine biçilen değer ve konumları incelenmiş ve bu açıdan doğu ve batı arasındaki kadın imajları anlaşılmaya çalışılmıştır. Tezin ikinci bölümünde şer'iyye sicillerinden elde edilen veriler doğrultusunda kadınların evlilik ve boşanma ilişkilerinde var olan hukuki kimlikleri tartışılmıştır. Ailenin kurulması ya da sona erdirilmesinde hukukun kadınlara ne oranda söz hakkı tanıdığı ve kurulan ilişkilerde kadınların hakkını ne derece koruduğu hususu ele alınmıştır. Üçüncü bölümde kadınların toplum içerisinde şehirli-köylü, Müslüman-gayrimüslim, hür-köle şeklinde bir takım ayrı kimliklerle var olabildikleri ancak hukuki uygulamalarla zaman zaman aynılaştıkları tartışılmış, bu kadınların mülkiyete erişim halleri dolayısıyla ekonomik varlıkları ve bunları ne şekilde tasarruf ettikleri de yine bu bölümde incelenmiştir. Dördüncü ve son bölümde kadınların, mahalle ve mahalleli olgusu etrafında şekillenen dolayısıyla bu olgular etrafında kabul gören ahlaki yasalarla nasıl çevrelendikleri ortaya koyulmaya çalışılmış, hukuki ve toplumsal bir varlığa sahip olmaları hasebiyle hem suçlayan hem de suçlanan konumda yer alabildikleri durumlar örneklendirilmiştir. Tezin ana kaynaklarını XVII. yüzyılın ilk yarısına ait Trabzon Şer'iyye sicilleri oluşturmuş, bu arşiv kaynaklarının yanı sıra kanunname ve fetva koleksiyonları da kullanılmıştır. İkincil literatürü ise daha çok Osmanlı toplum ve yaşamı hakkında yapılan araştırma eserler ile yine farklı coğrafyalar temelinde Osmanlı kadını hakkında yapılan eserler oluşturmuştur."
