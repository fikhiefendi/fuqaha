abstract: "Uluslararası arenada ülkelerin birbiriyle olan ilişkilerini etkileyen en önemli parametrelerden biri dış ticaret hacimleridir. Ekonomi eksenli dış politikalar kapsamında ülkelerin aralarında gerçekleştirdikleri ticaret hacimleri ülkelerin birbirlerine daha çok yakınlaşmasına ve stratejik iş birlikleri geliştirmelerine fayda sağlar. Bu bağlamda Müslüman ülkelerin birbirleriyle gerçekleştirdikleri ticaretlerin hacimlerini artırmaları gelecek dönemlerde oluşturulabilecek birlikteliklerin önünü açmada kilit öneme sahiptir. İki ülke arasındaki dış ticaret hacminin gelişmesi için işletmelerin aralarında kullandıkları dış ticaret ödeme yöntemlerinin güvenilir, şeffaf ve bağımsız olması gerekir. Bankacılık sistemi içinde en yaygın kullanılan ve en güvenilir olduğu iddia edilen geleneksel dış ticaret ödeme yöntemi akreditiftir fakat bu ödeme yöntemi bile içinde bazı sorunlar barındırır. Teknolojinin gelişmesiyle birlikte dijital ödeme yöntemlerine olan ilgi artarak devam etmektedir, blok zinciri teknolojisi de dijital ödeme yöntemlerinde sık kullanılan bir alt yapı haline gelmiştir. Bu doktora tez çalışması dış ticaret ödeme yöntemlerine akreditif muadili blok zinciri tabanlı alternatif bir model önerisi sunarak daha hızlı, maliyet avantajlı, güvenilir, şeffaf ve üçüncü bir kurum veya ülkeden bağımsız dış ticaret ödemelerinin gerçekleştirilebilmesine olanak sağlamaktadır. Ayrıca bunu İslam İktisadı ve Finansı ilkelerine uyumlu olarak gerçekleştirerek özellikle Müslüman ülkelerin aralarındaki ticareti geliştirmelerine yardımcı olmayı hedeflemektedir. Geçtiğimiz yıllarda blok zinciri tabanlı dış ticaret ödeme yöntemleri geliştiren bazı girişimler olmuştur fakat bunların hiçbiri İslami Finans ilkelerine uyumlu olmayı gözetmemiştir. Yapılan bu girişimlerden bazılarını vaka çalışması olarak detaylıca inceleyerek yeni bir model önerisi geliştirilmiş ve bu modelin uygulanabilmesi için nasıl bir yol izlenilmesi gerektiğine değinilmiştir. Tezin İslami finans uyumlu ve blok zinciri tabanlı ilk dış ticaret ödeme yöntemi model önerisi olması hasebiyle literatüre katkı sağlaması hedeflenmekte ve bundan sonra yapılacak olan akademik çalışmalara ön ayak olması beklenmektedir."
