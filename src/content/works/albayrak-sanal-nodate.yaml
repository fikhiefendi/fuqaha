abstract: "İnsanlık tarihi boyunca paranın farklı formlarını görmek mümkündür. Mal paradan temsili paraya, temsili paradan itibari paraya, itibari paradan dijital paraya ve nihayetinde kripto sanal paraya geçişe şahit olmaktayız. Bilişim teknolojisinde meydana gelen gelişmeler paranın her geçen gün farklı formlarda kullanılmasına olanak sağlamaktadır. Son yıllarda özellikle yazılım mühendisliğinin gelişmesi ve buna paralel olarak blockchain teknolojisiyle birlikte kripto sanal paralar ilgi odağı haline gelmiştir. Bu anlamda kripto sanal paralar; iktisat, işletme, hukuk, güvenlik ve ilahiyat gibi pek çok farklı alanda yapılan akademik çalışmaların da yoğunlaştığı bir alan olmuştur. Geleneksel ödeme sistemlerine alternatif olarak ortaya çıkan kripto sanal paraların hukukî meşruiyetinin yanı sıra dinî bakımdan meşruiyeti de merak ve tartışma konusudur. Bu anlamda çalışmamızda para olgusu tarihi seyriyle birlikte ele alınmış, kripto sanal paraların teknolojik altyapıları ve çeşitlerine yer verilmiştir. Ayrıca çağdaş İslâm hukukçularının kripto sanal paraların meşruiyetine yönelik görüşleri değerlendirilmiş, fıkıhta para olgusu üzerinde durulmuş ve kripto sanal paraların fıkhî açıdan para olma vasfı tartışılmıştır."
