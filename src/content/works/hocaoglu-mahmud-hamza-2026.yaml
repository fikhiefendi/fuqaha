abstract: "Bu araştırmada, Osmanlı'nın son dönem Şam müftüsü ve Hanefî fakihi Mahmud Hamza Efendi'nin vakıf hukukuna dair yaklaşımı, el-İstikşâf an Teâmüli'l-Evkâf adlı risalesi çerçevesinde incelenmektedir. Çalışmanın temel konusu, klasik İslam hukuku ilkeleri doğrultusunda şekillenen vakıf müessesesinin Osmanlı tatbikatı ile bu uygulamaların Mahmud Hamza Efendi tarafından nasıl fıkhî bir zeminde değerlendirildiğinin ortaya konulmasıdır. Araştırmanın amacı, Osmanlı vakıf pratiğinde ortaya çıkan icâreteyn, hulû, marsad, müşeddü'l-miske ve benzeri tasarruf biçimlerinin fıkhî mahiyetini tespit etmek ve bu uygulamaların örf–fıkıh ilişkisi bağlamında nasıl meşruiyet kazandığını analiz etmektir. Bu çerçevede çalışma, vakıf hukukunun yalnızca teorik hükümlerle sınırlı kalmadığını; yerel ihtiyaçlar ve teamüller doğrultusunda dinamik bir yapı kazandığını göstermeyi hedeflemektedir. Araştırmada nitel yöntem kullanılmış; başta Mahmud Hamza Efendi'nin el-İstikşâf adlı risalesi olmak üzere klasik Hanefî fıkıh kaynakları, Osmanlı arşiv belgeleri ve tabakat eserleri incelenmiştir. Metin merkezli analiz yöntemiyle risalede ele alınan vakıf uygulamaları, klasik fıkıh literatürüyle karşılaştırılarak değerlendirilmiştir. Çalışmanın sonucunda, Mahmud Hamza Efendi'nin vakıf hukukunu yalnızca teorik hükümler üzerinden değil, toplumsal ihtiyaçlar ve yerel uygulamalar ışığında ele alan bir yaklaşım benimsediği ortaya konulmuştur. el-İstikşâf risalesinin, Osmanlı vakıf sisteminde karşılaşılan pratik sorunlara fıkhî çözümler sunması bakımından önemli bir kaynak olduğu ve modern vakıf hukukunun tarihsel arka planını anlamada dikkate değer katkılar sunduğu sonucuna ulaşılmıştır."
