abstract: "Bu çalışmada, mülkiyeti aslen iktisap yolları ele alınmaktadır. Araştırma iki bölümden oluşmaktadır. Birinci bölümde, malın ve mülkiyetin tanımı ve kısımlarından bahsedilmiştir. Devamında mülkiyeti kazanma yolu olan fakat meşrû kabul edilmeyen iktisap yolları kısaca anlatılmıştır. İkinci bölümde mülkiyeti aslen kazanma yollarından ilk olarak ihrâz anlatılmıştır. İhrâzın çeşitleri olan avcılık, ölü arazilerin ihyâsı, ot ve ağaçların ihrâzı gibi mubah malların iktisabında gerekli şartlar ve temellük durumlarından bahsedilmiştir. Devamında mülkiyeti aslen kazanma yollarından sayılan lukata, rikâz ve tağyîre uğramış malın kazanımında gerekli şartlar ve kazanılma durumları anlatılmıştır."
