abstract: "Modern kapitalizmin“ne”yerine“nasıl”sorusuna odaklanan araçsal akılcılığı, insanı kimliğinden kopararak kendine yabancılaştırmış, evrenin öznesi olmaktan çıkarıp nesnesine dönüştürmüştür. Bu durum, yirmi birinci yüzyılda küresel bir ontolojik, ahlaki ve ekonomik krize yol açmıştır. Bu kriz, bilgi birikimini, teknolojik ve siyasi gücünü bir tahakküm aracı olarak kullanan; sahip olduğu silah sanayisi, kitle imha silahları ve askeri kapasitesiyle insanlığı tehdit eden, kurduğu vekâlet örgütler, kukla rejimler ve görünüşte sivil uluslararası siyasi ve iktisadi kurumlarla küresel siyaseti ve ekonomiyi şekillendiren sanayileşmiş ülkelerin bilinçli müdahaleleriyle derinleşmektedir. Bu bağlamda, kapitalist sistemin kendi iç dinamikleriyle insanlığın temel sorunlarına bir çözüm üretmesi mümkün görünmemektedir. Dolayısıyla insanın hümanizmle aşındırılan kimliğini, Aydınlanma ile körelen hakikat idrakini ve Kapitalizmle zedelenen onurunu iade edecek yeni bir felsefi-iktisadi bakışa ihtiyaç kaçınılmazdır. Bu bakımdan, iktisadi sisteme ahlaki ve kurumsal bir ruh kazandırarak iktisadı yeniden toplum ve insan merkezli bir disipline dönüştürecek, İbn Halduncu bir bakışla yeniden yorumlanmış İslam iktisadı ve felsefesi, üretim ve kar beklentisini ahlaki ve insani sınırlara çeken, salt büyüme yerine insan onurunu ve adaleti önceleyen bir perspektif sunmaktadır."
