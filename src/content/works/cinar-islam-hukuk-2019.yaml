abstract: "Bu çalışma, İslam aile hukukunda boşama hükümleri olan ric'î talâk ve bâin talâka ilişkin tartışmaları kapsar. Buna ilişkin fikirlerin nasıl olduğunu ve düzenlemelere etkisini tespit etmeyi amaçlar. İddet, talâk sayıları ve bu sayıların hangi talâk şekli ile ilişkilendirildiği konusunu hedef alır. İslam hukuk düşüncesinde müçtehit âlimlerin aile hukuku bağlamında talâk ile ilgili görüşleri ele alınır. Bu görüşlerin hangi talâk şeklini hedef aldığı belirlenir. Ayrıca İslam aile hukukunda eşler arası ayrılığa sebebiyet verebilecek muhâla'a, tefrik, îlâ, liân, zıhar vb. ayrılık çeşitleri bir hukuki düzenleme kapsamında değerlendirilir. İslam aile hukukunda talâk ve çeşitlerinin Kur'an ve Sünnet doğrultusunda bu görüşleri uygulamayı ve temsil etmeyi ortaya koyar. Talâkın kısımları olan ric'î talâk ve bâin talâkın sebepleri belirlenir. İslam toplumunda bu hukuki hükümler boşanmaları iki şekilde ayırır. Bu doğrultuda aile hukuku alanında ayrılığın hem İslam hukuku açısından hem de medenî hukuk açısından yapılan hukuki düzenlemeler ve ortaya çıkan problemlerle ilgilenir. Boşanmaların İslam hukuku ve medenî hukuk arasında kıyaslaması yapılır. Son olarak, kamu düzeni için boşanmaların bir kanun koyucu tarafından tanzim edilmesi gerekir. Toplumsal refah için düzenlemelerin yapılması, gerekli tedbirlerin alınması ön görülmektedir."
