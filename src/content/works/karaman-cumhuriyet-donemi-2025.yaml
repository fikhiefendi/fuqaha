abstract: "İktisat, tarihsel süreç boyunca toplumların varlığını sürdürmesinde ve toplumsal yapının biçimlenmesinde belirleyici bir rol oynamıştır. Bu rol, özellikle modern dönemde daha görünür hâle gelmiş; Batının iktisadi alanda elde ettiği üstünlük, birçok toplumda Batılılaşma eğilimlerini hızlandırmıştır. Osmanlı-Türkiye toplumunda ise bu eğilim, özellikle Tanzimat sonrası dönemde iktisadi sistem tartışmalarını ön plana çıkarmıştır. Batı kökenli iktisadi modellerin İslâm toplumlarında çeşitli sorunlara yol açması, İslâmi değerler temelinde alternatif sistem arayışlarını beraberinde getirmiştir. Bu bağlamda, 20. yüzyılın ilk yarısında Hindistan alt kıtasında temelleri atılan İslâm iktisadı düşüncesi, Türkiye'de 1950'li yıllardan itibaren tartışılmaya başlanmış; ilerleyen dönemlerde ise Müslüman Türk mütefekkirlerin katkılarıyla daha sistematik bir yapıya kavuşmuştur. Söz konusu gelişim, İslâm iktisadı düşüncesinin Türkiye'deki yerini ve anlamını kavramak açısından büyük önem taşımaktadır. Bu çalışmanın temel motivasyonu da İslâm iktisadi düşüncesinin Türk entelektüel zemininde kazandığı özgün anlam çerçevesini belirlemeye yöneliktir. Bu doğrultuda çalışma, muhafazakâr düşünce hareketleri içerisinde öne çıkan Hareket ve Diriliş ekolleri ile bu ekollerin kurucuları olan Nurettin Topçu ve Sezai Karakoç'un İslâm iktisadi düşüncesine ilişkin görüşlerini analiz etmeyi amaçlamaktadır. Analiz kapsamında, bu düşünce çevrelerinde İslâm iktisadının nasıl kavramsallaştırıldığı, tarihsel meselelerle nasıl ilişkilendirildiği ve ne tür çözüm önerileri geliştirildiği ortaya konulmaktadır. Çalışmanın veri tabanını, söz konusu düşünce çevrelerinin ana yayın organları olan Hareket ve Diriliş dergileri oluşturmaktadır. Metodolojik açıdan ise muhteva analizi yöntemi benimsenmiştir. Dergilerin tüm sayılarına yönelik sistematik bir tarama gerçekleştirilmiş; iktisadi bağlamda ele alınan metinlerde, yazarların söylemleri, yorumları ve önerileri detaylı biçimde analiz edilmiştir. Bu çalışma,“İslâm iktisadi düşüncesi, Türkiye iktisadi düşüncesinde yalnızca bir tercüme hareketi olarak mı yer bulmuştur, yoksa özgün yorumlamalarla yeni bir anlam mı kazanmıştır?”sorusuna yanıt aramaktadır. Çalışmanın temel hipotezi ise, Hareket ve Diriliş ekolleri doğrultusunda geliştirilen İslâm iktisadı fikrinin, Türkiye iktisadi düşüncesine doğrudan iktibas edilmeksizin, yeniden yorumlanarak özgün bir ruh kazandığı yönündedir. Araştırmanın temel bulgusu, kapitalist iktisadi teoriye karşı alternatif olarak önerilen İslâm iktisadı modelinin“Anadolu Sosyalizmi”ve“Diriliş Ruhu”gibi özgün kavramlarla yeniden inşa edilerek Türkiye iktisadi düşüncesinde kendine özgü bir yer edindiğidir."
