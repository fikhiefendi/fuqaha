abstract: "Osmanlı Devleti'nin gerilemeye başladığının fark edilmesiyle birlikte ortaya çıkan, II. Meşrutiyet ile yükselişe geçen, asıl hedefi devleti kurtarmak olan“İslamcılık”dönemin şartlarına göre farklılaşan bir yapıda olduğu için değişen siyasal gelişmelerle birlikte din ve devlet ilişkisi noktasında“Hilafet/İmamet”konusuna farklı yaklaşımlarda bulunmuştur. İslamcıların, siyasî ve fikri görüşlerini anlamak, dönem içerisinde nasıl bir şekil aldığını öğrenebilmek için başvurulması gereken kaynaklardan biri dergilerdir. Bu nedenle İslamcı dergiler referans alınarak İslamcıların“Hilafet/İmamet”görüşü incelenmiştir. 1949-2016 yılları arasında İslamcı dergilerde; Hilafet, İmamet, Biat, Şura, Ehlü'l-Hal ve'l-Akd, Halife, Din ve Devlet İlişkisi ve bu noktada İslam Devleti, Laiklik, Demokrasi, Cumhuriyet kavramları gibi bir dizi konu tartışılmıştır. İslamcı dergilerde din ve devlet ilişkisi, İslam'ın bir devlet ve yönetim şekli belirleyip belirlemediği meselesi“Hilafet”kavramı çerçevesinde ifade edilmiştir. Bu konuda genel olarak İslamcılar, Kur'an ve sünnette İslam'ın belirlediği herhangi bir devlet ve yönetim biçiminin olmadığını, adalet, şura, biat gibi ilkelerinin vazedildiği ve bu ilkeleri uygulayan yönetimlerin şeriata uygun olacağını dile getirmişlerdir. Bunun yanında din ve devleti bir bütün olarak gören İslamcılar, seküler siyasete karşı savunmacı bir pozisyon alarak laiklik ve demokrasi kavramlarına olumsuz yaklaşmışlardır."
