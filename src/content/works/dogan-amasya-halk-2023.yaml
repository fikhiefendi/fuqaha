abstract: "Amasya İl Halk Kütüphanesi'ndeki fıkıh ile alakalı yazma eserleri konu edinen çalışmamız iki bölümden oluşmaktadır. Birinci bölümde kütüphanedeki yazma eserleri, fıkıh usûlü ve furû-ı fıkıh başlıklarında metin, şerh veya haşiye olarak ele alınmıştır. Ele alınan eserlerin muhtevâsı ve teknik özellikleri hakkında bilgi verilmiştir. Nüshaların Türkiye'deki diğer kütüphanelerde bulunan yazma nüshaları tespit edilmiş ve dipnotta zikredilmiştir. Daha sonra müelliflerin hayatı, öğrenimi, hocaları, görevleri ve eserleri hakkında bilgi verilmiştir. İkinci bölümde sadece Amasya İl Halk Kütüphanesi'ndeki eserler türlerine göre tasnif edildikten sonra istinsah tarihleri, müellifi, ihtivası, mezhebi ve tamamlanması cihetiyle değerlendirilmeye çalışılmıştır. Çalışmamızda literatürümüzde bulunan ama varlığı bilinmeyen büyük bir birikime kapı aralanmış ve kıymetli eserler tanıtılmaya çalışılmıştır."
