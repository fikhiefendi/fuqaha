abstract: "Bu çalışmada, taşınmazlar üzerinde bulunan dikili bitkilerin hukukî statüsü ve bu statüye bağlı olarak ortaya çıkan sonuçlar, TMK çerçevesinde ayrıntılı biçimde incelenmiştir. Özellikle TMK'nın temel hükümleri ışığında; bitkilerin taşınmazın bütünleyici parçası olup olmadığı, bu bitkilerin mülkiyet hakkı kapsamında nasıl değerlendirileceği ve taşınmazla birlikte el değiştirmeleri durumunda doğabilecek hukukî sonuçlar ele alınmıştır. Bitkilerin taşınmaz üzerindeki konumuna ilişkin tartışmalar hem teorik hem de uygulamaya dönük çok sayıda sorunu beraberinde getirmektedir. Bu yüzden, bu çalışmada, TMK'nın ilgili maddeleri, Yargıtay kararları ve öğretideki görüşler dikkate alınarak kapsamlı bir çözümlemede bulunulmuştur. Bitkilerin taşınmazla olan fiziksel ve ekonomik bağlantıları göz önüne alındığında, bu unsurların genel kural olarak bütünleyici parça niteliği taşıdığı; ancak bazı özel ve istisnaî durumlarda, bu niteliklerinden ayrılarak bağımsız bir mülkiyet konusu olabilecekleri sonucuna ulaşılmıştır. Nitekim, bitkilerin taşınmazdan fiilen ayrılması veya ekonomik işlevlerinin taşınmazdan bağımsız olarak değerlendirilmesi, bu ayırımı doğrudan etkilemektedir. Özellikle, malikin ayırma hakkını kullanması veya taraflar arasında yapılan sözleşmelerin içeriği ve ifa biçimi, bitkilerin eşya hukukundaki konumunu değiştirebilmektedir. Çalışmada öncelikle, eşya hukukunun temel kavramları ışığında taşınmaz ve taşınır ayrımı ile bitkilerin botanik özellikleri ve bunların hukukî sınıflandırmalara etkisi analiz edilmiştir. Devamında, malikin bitkiler üzerindeki kullanma (usus), yararlanma (fructus) ve tasarruf (abusus) yetkileri ile bitkilerin doğal ürün olarak değerlendirilmesi incelenmiştir. Ayrıca, bitkilere ilişkin kazandırıcı işlemler borçlandırıcı ve tasarruf işlemleri bakımından sınıflandırılmış, özellikle satış ve devir işlemleri bağlamında değerlendirmelere yer verilmiştir. Son olarak, sınırlı aynî haklara konu olan taşınmazlarda bitkilerin hukukî durumu; intifa, üst, oturma, kaynak hakkı, taşınmaz yükü ve ipotek gibi haklar bağlamında kapsamlı biçimde ele alınmıştır."
