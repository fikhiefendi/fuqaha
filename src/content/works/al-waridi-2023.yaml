abstract: "Farâiz ve miras ilmi, diri ve ölülerin haklarının teyidi olup, ilmin yarısı sayılır. Bu çalışma, İmam Beğavî'nin Tehzîb isimli eserinde yer alan ferâiz ve vasiyet hükümlerine ışık tutmaktadır. Ferâiz ve vasiyetin manası, mirastaki şer'î payların beyanı, Kitap ve sünnet tarafından açıklanmayan miras hükümlerinde alimlerin ihtilafı ve konuyla ilgili fakihlerin içtihatlarıyla ilgili bilgi verilirken mezkûr konulara değinilmiştir. Çalışmanın amaçlarına ulaşabilmesi için İmam Beğavî'nin şahsi ve ilmi hayatı, yaşadığı dönemde meydana gelen siyasi, ekonomik ve kültürel olaylar anlatılırken betimleyici tarihsel metot kullanılmıştır. Aynı şekilde kitap ve metodu hakkında bilgi verilmiştir. Kitaptaki miras meselelerinin bir araya getirilmesi, konuyla ilgili alimlerinin görüşlerinin nakledilmesi, nakillerin analiz edilip, doğrusunun tercih edilmesi, şeriatın ruhu ve genel maslahata muvafakat konularında analitik yöntem tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Miras meselelerin aslına inilmiş, Kur'ân ve sünnet delillerine değinilmiş, cumhur ulema yanında İbadiye ve İmamiyye mezheplerine mensup alimlerin görüşlerine de yer verilmiştir. Şâfiî mezhebinin görüşlerine muhalif olsa dahi delile göre tercih yapılmıştır. Örneğin vasiyyetin manası konusunda Hanefilerin görüşlerini tercih etmiştir. Ana baba bir öz kardeşlerin, 1/3 hissede anne bir kardeşle ortak olması tercih ettiği görüşlerdendir. O bu meseleyi anne baba yönüyle ölüye ulaşmaları ve yakınlığın gücü ile ta'lil etmiştir. Istılahların açıklanmasında lügat yönünü ihmal etmemiş, garib kelimeleri sözlüklerden yardım alarak açıklamış, sonrasında ıstılahı beyan etmiştir. Ayrıca kitabında zikrettiği çok sayıda görüş ve iktibas, ilminin bolluğu, bilgi kaynaklarının çeşitliliğine delalet etmenin yanında kitabı araştırmaya değer, miras hukukunun asli kaynaklarından biri haline getirmiştir."
