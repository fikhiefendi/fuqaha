abstract: "Şüphesiz ki, Fıkıh usûlü ilmi, ilimlerin en üstünlerindendir. Ve alimler tarafından büyük ilgi görmüştür. Bu alandaki kitapların en mühimlerinden, geniş kapsamlı ve ayrıntılı olanlarından birisi de Zerkeşî'nin Bahru'l-muhît eseridir. O fıkıh usûlü'nde ansiklopedi sayılıyor. Müellif usûlle ilgili meselelerinin çoğunu bu kitapta ele almıştır. Zerkeşî şerî ilimlerde bir deniz, fakîh ve alimdi. Bu risale kitabın tam tahkiki silsilesinden bir parça sayılıyor. Araştırmacı yazma eserlerin tahkikinde gerekli olan bilimsel yönteme dayanır. Tez iki bölüme ayrılıyor: Birinci bölüm müellifin hayatını inceliyor. İkinci bölüm ise kitabı inceliyor. Birinci bölümde müellifin yöntem ve üslûbu, diğerinde ise altı tane yazma metin karşılaştırılıp tahkik ediliyor. Metinlerden Paris kütüphanesinde yer alan nüsha asıl olandır. Geri kalanları harflerle ona işaret ediyor. Araştırmanın hedefi, gücümüz nisbetinde metinleri müellifin murad ettiği şekilde tahric etmek, gizli ve müşkil hususları açıklığa kavuşturmaktır. Ayrıca metinlere bağlı kalmak ve gerekli tercümeleri hatırlamaktır. Sonuç, tavsiye ve fihristle de tezi bitirmektir."
