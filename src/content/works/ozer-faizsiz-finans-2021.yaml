abstract: "Gelişen küresel ekonomik yapıyla birlikte finansal piyasaların da geliştiği görülmektedir. Son 50 yılın önemli ürünlerinden biri de faizsiz finansmandır. Faizsiz finansman dünyada uygulanan İslami bankacılığın aynısıdır. Türkiye'de de ilk olarak 1980'li yıllarda özel finans kurumu adı altında faaliyet göstermiştir. Faizden uzak duran kesimler için iyi bir alternatif olan faizsiz bankacılık sistemi, bünyesinde farklı yatırım araçlarını barındırmaktadır. Ekonomik yapı içerisinde faizsiz finans, bankacılık tarafından kullanılan bir ürün olarak başlamıştır. Kurumsal bir yapıda faaliyet gösteren bir banka statüsü kazanmasının üzerinden 50 yıl geçmesine rağmen faizsiz finans sektörü, 2019 yılı verilerine göre; 2,8 trilyon USD 'lik varlık büyüklüğüne ulaşmıştır. İslami finans kendine özgü faizsiz enstrümanları ile kısa zamanda hızlı bir şekilde büyüyen bir yapıya bürünmesi dikkat çekmektedir. Kullanılan ürünler incelendiğinde ise, en hızlı büyüyen ürünün sukuk ve en yavaş büyüyen ürünün ise tekafül olarak ifade edilen İslami sigortacılık olduğu gözlenmiştir. Bu çalışmada; dünyada faizsiz bankacılık, ülkemizde katılım bankacılığı olarak ifade edilen sistemin tanımı tarihi gelişimi ve kullandığı ürünler hakkında bilgiler verilmiştir. Ülkemizde katılım bankalarının kalkınma planlarına dahil edilmesi ve devlet eliyle kurulan katılım bankalarının varlığı bu kurumların hızla büyümesinde ve gelişmesinde ciddi katkısı olmuştur. Ülkemizde faaliyet gösteren katılım bankalarının 2011-2020 mali verileri, Promethee yöntemi kullanılarak finansal performans analizi yapılacaktır. Araştırma sonuçlarına göre; Türkiye'de faaliyet gösteren katılım bankaları arasında en yüksek performansı sergileyen bankalar sırayla; Kuveyt Türk, Türkiye Finans ve Vakıf Katılım olmuştur. En düşük performansa sahip kurumlar ise; Albaraka Türk, Bank Asya ve Emlak Katılım olmuştur. Elde edilen bulgular ile katılım bankalarının, bankacılık sektöründen aldığı payın istenilen seviyelere çıkabilmesi için finansal yapılarının güçlü olması gerektiği ve özellikle kriz dönemlerinde yaşanacak dalgalanmalara ya da olası bankacılık krizlerinin en az kayıpla atlatılabilmesi için, zorunlu olarak, hazırlıklı olmaları gerektiğinin tekrar altı çizilmiştir."
