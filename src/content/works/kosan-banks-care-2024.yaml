abstract: "Türkiye'nin banka kredilendirme davranışını, Paris Anlaşması (Cop21), 26. Birleşmiş Milletler İklim Değişikliği Taraflar Konferansı (Cop26) ve Kyoto Protokolü gibi çevre anlaşmaları ve protokollerinin imzalanmasından sonra il düzeyinde hava kirliliği (Pm10) ve Covid-19 pandemisinin etkilerini dikkate alarak inceledik. Bu çalışma, 2016-2023 yılları arasında Türkiye'deki 80 ilden 24000 çeyreklik gözlem içermektedir. Analizde sabit etkiler ve panel veri analizi yöntemleri kullanılmıştır. Elde ettiğimiz sonuçlar, konvansiyonel bankaların çevresel konularda daha bilinçli hareket ettiğini ve çevresel anlaşma ve protokollerin olumlu etkisinin konvansiyonel bankalar için daha yüksek olduğunu göstermektedir. Ayrıca hava kirliliğinin hem katılım bankalarını hem de konvansiyonel bankaları olumsuz etkilediği, ancak bu etkinin konvansiyonel bankalar için daha belirgin olduğu tespit edilmiştir."
