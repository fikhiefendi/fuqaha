abstract: "Bu çalışma, Hayat Rehberi Kur'ân tefsiri özelinde Kur'ân'ın ekonomik hayata ilişkin ortaya koyduğu ilke, kavram ve uygulamaları bir bütün olarak değerlendirmeyi amaçlamaktadır. Bu doğrultuda Kur'ân'ın yalnızca bireysel ibadetlere rehberlik eden bir kitap olmadığı, aynı zamanda toplumsal ve ekonomik hayatı da düzenleyen temel ilkeler içerdiği dikkate alınarak ekonomik adaletin hangi ilke ve esaslar çerçevesinde sağlandığı incelenmiştir. Araştırmada, Kur'ân'ın ekonomik yapıyı olumlu etkileyen ve olumsuz etkileyen unsurları ayırt eden yaklaşımı merkeze alınmıştır. Çalışmanın birinci bölümünde ekonomiyi olumlu yönde etkileyen unsurlar ele alınmış; adalet, helâl kazanç, zekât, infak, sadaka, miras ve vasiyet gibi kavramların hem bireysel hem de toplumsal boyutları değerlendirilmiştir. Bu bağlamda Kur'ân'ın paylaşım, sosyal sorumluluk, mülkiyet anlayışı ve gelir dağılımına ilişkin ilkeleri, Hayat Rehberi Kur'ân tefsiri çerçevesinde tahlil edilmiştir. İkinci bölümde ise haksız kazanç ve faiz (ribâ) başta olmak üzere ekonomiyi olumsuz etkileyen unsurlar ele alınmış; bu uygulamaların birey ve toplum üzerindeki ekonomik ve ahlâkî sonuçları incelenmiştir. Üçüncü bölümde, doğal kaynakların kullanımı bağlamında avlanma kavramı ele alınarak Kur'ân'ın üretim, tüketim ve kaynak kullanımına dair dengeleyici yaklaşımı ortaya konmuştur. Araştırmada nitel yöntem esas alınmış; ilgili âyetler tefsir bağlamı içerisinde analiz edilerek klasik ve çağdaş yorumlarla desteklenmiştir. Sonuç olarak bu tez, Kur'ân'ın ekonomik hayata dair sunduğu ilkelerin adalet, denge ve sosyal dayanışma ekseninde şekillendiğini; Hayat Rehberi Kur'ân tefsirinin bu ilkeleri güncel ekonomik sorunlara ışık tutacak şekilde yorumladığını ortaya koymaktadır."
