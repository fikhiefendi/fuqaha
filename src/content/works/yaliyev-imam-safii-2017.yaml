abstract: "Tefsir düşüncesinde İmam Şafii geçmişte olduğu gibi günümüzde de pek çok incelemeye konu yapılmıştır. Mekke'nin ilim atmosferinde yetişen Medine'nin“Ehli Hadis”ve Irak'ın“Ehli Rey”ilmi yaklaşımını eleştiri süzgecinden geçirerek güçlü yanlarını Mısır'da sistematik bütünlüğe kavuşturmuştur. Eserlerinden ve eserleri dışında kendisine atıf yapılan diğer kaynaklardan yararlanarak Ahmed Ferran tarafından kaleme alınan“Tefsiru'l-İmamu'ş-Şafii”adlı doktora tezinin ışığında“İmam Şafii Tefsirinin Tahlili”adlı bir araştırma yapılmıştır. Bu çalışmamızın birinci bölümü İmam Şafii'nin hayatını ve ilmi birikimini içermektedir. İmam Şafii hakkında klasik dönemden günümüze kadar ele alınmış eserlerde bulduğumuz bilgileri değerlendirerek bu bölüm oluşturulmuştur. İkinci bölümü ise çalışmamızın ana konusu olan“Tefsiru'l-İmamu'ş-Şafii”eser ışığında klasik kaynaklara ulaşarak İmam Şafii tarafından ayetlerin açıklanmasında nasıl bir yol izledinği örneklerle detaylı bir şekilde ortaya konulmaya gayret edilmiştir."
