abstract: "Bu tez, Şeyhülislam Zekeriya el-Ensari'nin şafi fıkhında telif ettiği Fethu'l-Vehhab bi Şerh-i Menheci't-Tullab adlı kitabından bir bölümün incelenmesini ve tahkikini içermektedir. Tahkiki yapılan kısım Kitabu'l-Bey'den başlayıp Cuâle Kitabının sonuna kadar devam eden bölümdür. Zekeriya el-Ensari son dönem Şafii fakihlerinin önde gelenlerinden biri olup, Şeyhülislam unvanını elde etmiştir. Şafi mezhebinin ikinci tenkıh/ayıklama ameliyesini yapanlardandır. Fıkhi hükümlerin naklinde güvenilir şahsiyetlerinden biridir. Kitapları mezhepte en mutemed kaynaklardandır. Bu çalışmama önce araştırmanın önemini, bu eseri seçme nedenini, araştırmanın planını, yöntemini, Şeyhülislam'ın biyografisini, ismini, nesebini, doğumunu, yetişmesini, ilmi talep etmesini, hocalarını, talebelerini, üstlendiği ilmi makamları, vefatını ve eserlerini ihtiva eden bir mukaddime ile başladım. Ayrıca Fethu'l-Vehhab'ın aslı olan el-Minhac sahibi İmam Nevevi'den de söz ettim. Sonra çalışmamı iki kısma ayırdım. Birinci kısımda Fethu'l-Vehhab kitabından, onun isminin belgelenmesinden, müellife nispet edilmesinden, ulemanı bu kitaba verdikleri değerden bahsettim. Bunun yanında elimin altında bulunan ve tahkikte dayandığım yazma nüshalarını da tanıttım. İkinci kısımda ise tahkikini yaptığım metni tanıttım. Metin, eserin Kitabu'l-Buyu' bölümünün tamamını içermektedir. Eser, on iki kitap, on üç bap ve otuz sekiz fasıldan oluşmaktadır."
