abstract: "Bu çalışma, İslam ekonomisi perspektifinden uluslararası para sistemine alternatifleri belirlemeyi amaçlamaktadır. Bu, mevcut uluslararası para sisteminin doğasını açıklığa kavuşturmak ve İslam ekonomisindeki para sisteminin kurallarını ve özelliklerini açıklığa kavuşturarak ve İslam hukukunun kuralları dahilinde parasal amaca ulaşan uluslararası para sistemine alternatifleri araştırmak suretiyle yapılmıştır. Çalışma ayrıca, önerilen parasal sisteme alternatiflerin uygulanmasında karşılaşılan zorlukları göstermeyi amaçlamaktadır. Araştırmacı, bu konuyla ilgili kitap, makale ve elektronik kaynaklara bakarak tümevarımcı yaklaşımı benimsemiş, mevcut parasal sisteme adil bir alternatif olabilecek farklı parasal alternatifleri karşılaştırarak mukayese yöntemini tercih etmiştir. Çalışma, mevcut uluslararası para sisteminin adaletsiz bir sistem olduğu ve bir ulusun diğer uluslar pahasına zenginleştirilmesine dayandığı sonucuna varmıştır. Çalışma ayrıca, İslam ekonomi sistemi altındaki para sisteminin, paranın ihraççısı ve uluslararası paranın özellikleri açısından sınırlamalara ve kurallara sahip olduğu sonucuna varmıştır. Aynı zamanda çalışma altın veya gümüş metalik emtia para sistemine veya her ikisine birden dönüşü tavsiye ettiği mevcut uluslararası para sistemine yönelik birkaç alternatifi gözden geçirmiş ve bu yeni sisteme geçişin önündeki en önemli potansiyel zorlukları göstermiştir."
