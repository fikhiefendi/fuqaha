abstract: "Bu tezin mevzuu Osmanlı Devleti'nin klasik devrinde idam cezası verilen suçlar ve idam cezasının infaz usulleridir. Tez giriş ve iki bölümden meydana gelmektedir. Giriş bölümünde idam cezasının tarihçesi ile mukayeseli hukukta ve İslam hukukunda idam cezasına dair kısa malumat verilmiştir. İlk bölümde ise devrin kanun kitabı sayılabilecek meşhur fıkıh kitapları ile kanunnâmeler, arşiv vesikaları ve şer'iyye sicillerine göre klasik devir Osmanlı hukukunda hangi suçlara idam cezası verildiği ele alınmıştır. İkinci bölümde idam cezasının hangi şekillerle infaz edildiği tetkik edilmiştir. Bu bölümde önceki kısımdaki kaynaklara ek olarak Osmanlı tarihiyle alakalı kitaplar ve Osmanlı ülkesine seyahat etmiş olan ecnebi seyyah ve sefirlerin eserlerine müracaat edilmiştir. Osmanlı Devleti'nde had ve kısas suçlarındaki sabit idam cezalarının yanında taʻzîren (siyaseten) de idam cezası verildiği görülmüştür. Devletin otoritesinin sarsıldığı ve asayişin bozulduğu devirlerde siyaseten katl müessesesine daha çok başvurulduğu göze çarpmaktadır. İdam infaz usulleri arasında en fazla tatbik edilen baş kesmek suretiyle idamdır. Bu infaz usulünü salb (asmak) ve boğmak suretiyle idam takip etmektedir. Bazı eserlerde ve seyahatnamelerde zikredilen işkenceli infaz şekillerinin tatbik edilip edilmediği mevzuunda ise kesin bir hüküm vermek mümkün olmamıştır."
