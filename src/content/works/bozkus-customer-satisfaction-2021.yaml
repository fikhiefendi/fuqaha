abstract: "Bu tez çalışması, katılım bankaları müşteri memnuniyeti, katılım bankalarının hizmet kalitesini tanımlama, personellere olan güven ve personelden duyulan memnuniyet ile banka şubesinin fiziksel özelliklerinden oluşan müşteri memnuniyetini ortaya çıkarmak için hazırlanmıştır. Araştırmanın evrenini Gaziantep illinde bulunan Serbest Muhasebeci Mali Müşavir (SMMM) olan ve aynı zamanda katılım bankalarının müşterileri olan kişilerden oluşmaktadır. İnsanların kullandıkları ürünleri ve aldıkları hizmetleri çevrelerine tavsiye ettikleri ve bu tavsiyelerin genellikle insanlar üzerinde olumlu bir etkisi olduğu bilinmektedir. Bu önerilerin müşteri memnuniyetinin sonucu olduğu apaçık ortadadır. Katılım bankası müşteri memnuniyetini ölçmeye çalıştığımız anketimizde örneklem olarak Serbest Muhasebeci Mali Müşavirleri tercih ettik. Çünkü çok farklı sektörlerden çok sayıda insanla çalışıyorlar ve çalıştıkları bu insanlar işletme sahibi ve para kazanan insanlar. Serbest Muhasebeci Mali Müşavirler güvenilir bir grup olduğundan, müşterisi olan bu kişileri etkileyebilirler. Serbest Muhasebeci mali Müşavir grubu bu çalışmanın ana kütlesi için belli olan bir örneklemdir. Ticari hayatın önemli meslek örgünlerinden biridir. Benzer bir çalışma yapılmamıştır ve homojen bir gruptur. Muhasebecilerin görüşleri iş hayatının bakış açısını yansıttığından bankacılığa olumlu katkı sunacağı beklenmektedir. Bu sayede katılım bankası müşteri sayısında artması yönünde yararlı olacağını öngörüyoruz. Anket uygulaması bireysel iletişim yoluyla online ve doğrudan Serbest Muhasebeci Mali Müşavir ofisleri ziyaret edilerek tamamlanmıştır. Çalışma kapsamında Gaziantep'teki katılım bankaları müşterisi olan 153 Serbest Muhasebeci Mali Müşavir ile anket çalışması gerçekleştirilmiş olup, elde edilen sonuçlar değerlendirilmiş ve katılım bankacılığı müşteri memnuniyeti ile ilgili çıkarımlarda bulunulmuştur. Anketlerden elde edilen veriler analiz edilmiştir. Analizler sırasında güvenilirlik analizi, frekans, Kaiser-Meyer-Olkin (KMO) bağımsız örneklem t-testleri ve tek yönlü ANOVA testleri uygulanmıştır. Elde edilen bulgulara göre katılım bankası ile çalışma süresi değişkenlerine göre vezne işlem hızı ile sunulan hizmet arasında anlamlı farklılık tespit edilmiştir."
