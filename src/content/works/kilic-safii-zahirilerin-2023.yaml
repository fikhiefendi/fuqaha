abstract: "İslam dini toplumun temelini oluşturan aileye büyük bir önemi vermiş ve ailenin belli kurallar çerçevesinde kurulması için birtakım hükümler ortaya koymuştur. Aile hukukuyla ilgili bazı hükümler mezhepler arasında farklılık gösterebilmiştir. Bu çalışmada da Şâfii ve Zâhirî mezhebinin aile hukukuyla ilgili olarak ihtilaf ettiği meseleler karşılaştırılmış ve bu mezheplerin görüşlerine dair delilleri incelenmiştir. Bu araştırma giriş, literatür taraması, materyal ve yöntem, veri ve analizi ve sonuç bölümlerinden oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı ve kapsamına değinilmiştir. Literatür taraması bölümünde bu çalışmada yararlanılan belli başlı kaynaklar ele alınmıştır. Materyal ve yöntem bölümünde bu araştırmada kullanılan materyaller ve takip edilen yönteme yer verilmiştir. Veri ve analizi bölümünde ise genel olarak nikah akdi, nişan, velîme, (düğün yemeği) nikâhta velayet, şahitlik, mehir ve tâlak gibi konularda her iki mezhebin ihtilâf ettiği meselelere yer verilmiştir. Bu iki mezhebin kendi görüşlerine dair gösterdikleri deliller ve bakış açıları incelenmiştir. Sonuç bölümnde ise bu çalışma neticesinde ulaşılan neticeler ve öneriler ele alınmıştır"
