abstract: "Finansal sistemin temel bileşenlerinden biri olan bankacılık sektörü, tasarrufların verimli bir şekilde tahsis edilmesiyle ekonomik kalkınma ve büyümeye katkıda bulunur. Bu sebeple, bir ülkenin ekonomik gelişiminde kritik bir role sahip olan bankacılık sektörünün etkin bir şekilde denetlenmesi büyük önem taşımaktadır. Bu çalışmanın amacı, ülkemizde faaliyet gösteren mevduat bankaları ile katılım bankalarının grup bazında performanslarını ölçerek karşılaştırmalı bir analiz yapmak ve bu analiz neticesinde banka gruplarının finansal özellikleri ve performansları arasında bir farklılık olup olmadığını tespit etmektir. Çalışma kapsamında, Türkiye'de 2006-2017 yılları arasında faaliyet gösteren mevduat bankaları ile katılım bankalarının performansları CAMELS analiz yöntemi aracılığıyla karşılaştırılmaktadır. Çalışmanın değişkenleri, bankacılık sektöründe faaliyet gösteren mevduat ve katılım bankalarının bilanço ve gelir tablolarındaki finansal bilgiler kullanılarak elde edilen oranlardan oluşmaktadır. Bu analiz yöntemi ile mevduat ve katılım bankalarının sermaye yeterliliği, aktif kalitesi, yönetim kalitesi, kârlılık, likidite ve piyasa risklerine karşı duyarlılık açısından değerlendirilmesi amaçlanmıştır. CAMELS performans değerleme yönteminin bankacılık sektörünün yaşamış olduğu gelişmeleri açıklayabildiği ve finansal sistem içerisinde erken uyarı sistemi görevi görüp, olası bankacılık krizlerinin önüne geçilmesinde etkili bir yöntem olacağı düşünülmektedir."
