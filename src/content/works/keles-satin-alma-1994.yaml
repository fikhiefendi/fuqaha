abstract: "ÖZET Bir malı mülkiyetine sahip olmadan, malikinin rızası ile tasarruf etmeye genel anlamı ile kiralama denmektedir. Kiralama düşünce ve uygulamasının tarihi oldukça eskilere dayanmaktadır. Kâim, esas olarak malın mülkiyetinden değil kullanımından doğması kiralamayı, satın almaya göre rasyonel bir alternatif haline getirmektedir. Modern dünyada kiralama uygulaması, temel olarak iki biçimde ele alınabilir: Faaliyet kiralaması ve finansal kiralama. Faaliyet kiralaması, genellikle kısa vadeli bir sözleşme çerçevesinde temin edilen yatırım malının, teknolojik riske karşı değiştirilmesine imkan tanıyan kiralama türüdür. Finansal kiralama ise kiralayan tarafından kiraya verilmek amacı ile satın alman malın, fiyatını ve fiyatı etkileyen diğer maliyet unsurlanmn tümünü kiracının ödemekle yükümlü olduğu orta vadeli bir kiralama türüdür. Kiralama dönemi sonunda mal, kiracıya sembolik bir bedel karşılığı devredilir. Tez'de kullanılan anahtar kavramlardan biri olan reel yatıran maliyeti, işletmenin yatırım maliyeti ile yatırandan kaynaklanan vergi tasarrufları arasındaki fark olarak tanımlanmaktadır. Banka kredisi ile satm alma tercihinde amortisman ve finansman masrafı, vergi tasarruf etkisi yaratırken yatıran malının satm alınmasında ödenen %15 oranındaki duran varlık KDV'si, likiditasyonu düşük bir aktif olarak önemli finansal yükler taşımaktadır. Finansal kiralamada ise kira ödemeleri vergi tasarruf etkisine neden olmakta buna mukabil kira faturalarının %1'e tabii olması nedeniyle oldukça düşük bir fînans maliyeti doğmaktadır. Tez çerçevesinde geliştirilen simülasyonda miktar ve tarih itibariyle birbirine eşit olduğu varsayılan kredi ve kira ödemeleri halinde yılın ilk yansı finansal kiralama, ikinci yansı banka kredisi ile yatırım yapmak daha anlamlı görülmektedir. Yukandaki varsayım işletme için nakit çıkışlan bağlanımda alternatifler arası kayıtsızlık oluşturarak yöntemlerin vergi tasarrufu potansiyelim ölçmek için kullamlmıştır. Öte yandan 12, 24, 36 ve 48 aylık ödeme planlan için optimum reel yatıran maliyeti koşulu altında veri banka baz kredi maliyetlerine karşılık gelen finansal kiralama baz kredi maliyetlerinin bir dökümü yapılmıştır. Bu analizde de aynı vergi tasarruf etkisine ulaşabilmek için finansal kiralama kredi maliyetlerinin banka maliyetlerine göre daha yüksek olması gerektiği görülmektedir. Diğer bir deyişle kredi maliyeti itibariyle daha yüksek büe olsa kiralama tercih edilebilir. Kaldı ki uygulamada finansal kiralama baz kredi maliyetlerinin banka maliyetlerine göre daha düşük seyrettiği bilinmektedir. ıx"
