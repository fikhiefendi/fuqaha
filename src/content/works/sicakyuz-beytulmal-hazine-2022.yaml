abstract: "Bu çalışmanın amacı beytülmâl ve hazine kurumları arasında bir mukayese gerçekleştirmek ve ilgili iki kurum arasında bulunan farklılıkların sebep olduğu sonuçları analiz etmektir. Beytülmâl ve hazine arasındaki en önemli fark beytülmâlin ortaya çıktığı İslami yönetimde teorik açıdan tek egemen olarak Allah varken modern bir kurum olan hazinenin içinde bulunduğu yönetimde tek egemen modern devletin kendisinin olmasıdır. Ayrıca beytülmâl İslami yönetimin mali gelir ve giderlerini organize etmek için ortaya çıkmış organik bir kurum olarak meydana gelmiştir. Varoluşu bizzat Hz. Peygamber'in uygulamalarına dayanmaktadır. Hz. Peygamber'in dini liderliği ve beytülmâlin kaynaklarının büyük ölçüde dini emirlere dayanarak oluşturulması beytülmâl kurumunun ontolojik olarak dini bir temele dayandığı ve bu sebeple gider kalemlerinin de yine şeriatın amaçlarına uygun olmasını, diğer bir ifadeyle Allah'ın -sadece insanlar hakkında uygun gördüğü maslahatların meydana gelmesi için vaz' ettiği- hükümlerinin eksiksiz bir şekilde yerine getirilmesini hedeflemektedir. Hazine sisteminin temel dayanağını ise modern devletin kendisidir. Modern devletin sahip olduğu tek, bölünmez, sürekli ve mutlak egemenliğin bir sonucu olan merkezi kontrol özelliği sayesinde siyasi yönetim vatandaşın üretim ve tüketim faaliyetleri istenilen alana kanalize edilebilmektedir. Ayrıca güçlü bir devlet olmak ve bunu devam ettirmek için gereken finans ihtiyacı vatandaşı vergilendirme üzerinden sağlanırken sürekli büyüme ve ilerlemeyi hedef alan kapitalizmle uyumlu uygulamalar gerçekleştirilmektedir. Modern devletin sahip olduğu bu arka planın ve özellikle güçlü bir egemenlik ve merkezileşmenin pratikteki sonucu olarak hazine sistemi meydana gelmiştir. Devletin hazine sistemi sayesinde her türlü gelirin toplanmasını merkezden kontrol etmesi aynı zamanda yapılan harcamaların da kalemlerini belirlemesini ve dolayısıyla bu harcamaların modern devletin ve kapitalist sistemin amaçlarıyla örtüşmesini beraberinde getirmektedir. Beytülmâlin ontolojik dayanağını Allah'ın muradını ortaya çıkarmayı hedef edinen İslâmî yöntem oluştururken, hazine sisteminin ontolojik dayanağını modern devlet ve kapitalist sisteminin oluşturması bu iki sistemin birbirinin devamı olamayacağını açık bir şekilde ortaya koymaktadır."
