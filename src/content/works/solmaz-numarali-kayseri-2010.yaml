abstract: "82/2 Numaralı Kayseri Şer'iyye Sicili (H.1085/M.1674-1675) Transkripsiyon ve değerlendirilmesi konulu çalışmayı Osmanlı Devleti'nin ictimâî hayatı, Kayseri'nin hukûkî, sosyal, askerî, siyâsi ve iktisâdî hayatı hakkında bilgi sahibi olmak, yapılan araştırmalara katkıda bulunmak ve bu belgelerin günümüzde okunabilmesini sağlamak amacıyla yaptık.Kayseri Şer'iyye Sicilleri'nin mikrofilmleri Ankara Milli Kütüphane'den, Erciyes Üniversitesi Fen-Edebiyat Fakültesi Tarih Bölümü bünyesinde kurulan Kayseri ve Yöresi Tarih Araştırmaları Merkezi'ne getirtilerek tetkik edilmektedir. Çalışmamızın temel kaynağı olan 82/2 Kayseri Şer'iyye Sicilini, Kayseri ve Yöresi Tarih Araştırmaları Merkezi'nden fotokopi yolu ile temin ettik.Tez çalışmasının devam eden aşamasında kaynak taraması yaparak Osmanlı Devleti'nin Örfi Hukuk ve Şer'i Hukuk'u Şer?iyye Sicillerinin tarifi, tarihi gelişimi muhteviyatı ve önemi hakkında bilgi topladık. Tezimize konu olan Şer'iyye Sicili'ndeki belgelerin tamamını sıra numarasına göre transkripe ettik ve belge özetlerini çıkararak belgeleri tasnîf ettik. Tezin son kısmında şehrin yapısı hakkında genel bir bilgi ve değerlendirme yaptık.Bu çalışmalar için 12 aylık bir süre öngörüsünde bulunmuştuk. Belgeleri transkripe etme çalışmamızda elimizde olmayan nedenlerle kesintiler ve duraklamalarla karşılaştık. Bu olumsuzluklar nedeni ile öngörülen süreye ek süre alarak tez çalışmamızı tamamladık.Bu çalışma sonucunda; Osmanlı Devleti tarihine ait belgeleri okumakta başlangıçta ne kadar zorlandıysak da sabredip azimle çalışarak okuyabileceğimizi gördük ve okudukça bu çalışmadan keyif aldık. Şahsım açısından belgeleri okuyabilmenin yanı sıra Osmanlı Devletin'de mahalli hukuki sisteminin çalışma şekli, davanın büyüklüğü veya küçüklüğüne önemli veya önemsiz oluşuna bakılmaksızın kesintiye uğramadan, ivedilikle yerinde tecellî ettirilmesi hayranlık uyandıran bir sonuç olmuştur. Tarihimize ait belgeleri okuyabilmenin bir ayrıcalık olduğunu hissettim. En önemlisi Osmanlı Devleti'nin ve Kayseri tarihine olsa katkıda bulunabilmemizin bu çalışmamızda en önemli sonuç olduğunu düşünüyoruz.Ağustos,2010, 218 sayfa"
