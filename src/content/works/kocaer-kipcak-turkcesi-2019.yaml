abstract: "Bu çalışmada, Kıpçak Türkçesi eserlerde İslam hukuku ve fıkıh ıstılahı incelenmiştir. Çalışma, Berke Fakih'in istinsah ettiği İrşâdü'l-Mülûk ve's-Selâtîn adlı eser üzerinden yapılmıştır. Tez; giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde çalışmanın konusu, önemi, amacı, araştırmanın yöntemi hakkında bilgi verilmiştir. Birinci bölümde üzerinde çalıştığımız İrşâdü'l-Mülûk ve's-Selâtîn hakkında bilgi verilmiştir. İkinci bölümde ise eserin incelenmesi yapılmıştır. Eserde atıfta bulunulan şahıslar ve eserler bu bölümde yer almaktadır. Çalışmamızın esas konusu olan fıkhî terimlerin incelenmesi de bu bölümdedir. Sonuç bölümünde ise tespit edilen terimler ve eser hakkında değerlendirme yapılmıştır."
