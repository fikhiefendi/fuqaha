abstract: "Bankalar, insanlar arasındaki iktisadi ilişkilerin küresel çapta büyümesinden kaynaklı bir ihtiyaçtan ortaya çıkmıştır. Bankalar büyüyen ekonomilerde birey ve kurumlar arasında iktisadi ilişkileri daha hızlı ve güvenilir biçimde yerine getirilmesi fonksiyonunu da ifa eder. Zira ekonominin büyümesi, insanların birbirleriyle ve çeşitli kurumlarla malî ilişkilerini daha kolay, hızlı ve güvenli hale getirme ihtiyacını zorunlu kılmıştır. İslam toplumu olarak kullanmak durumunda olduğumuz uluslararası bankacılık sistemi de şeriatın kesin bir şekilde yasakladığı uygulama olan faiz ile borç alıp verme esası üzerine kurulu olması, alternatif bankacılık sisteminin geliştirilmesi düşüncesini bir zorunluluk haline getirmiştir. Faiz temelli finansal sisteme alternatif olarak ortaya konan İslami bankalar faizli işlemlerin yerine şer'i usule uygun malî muameleler koyma gayesini gütmektedirler. Bu düşünceyi, teoriden pratiğe yansıtma adına birçok çalışma yapılmıştır. Maalesef İslami fıkha uygunluk şiarıyla yapılan bu yoğun formülasyon sürecinde fıkhî kriterlere aykırı ve şüpheli akitler de meydana gelmiştir. Bu akitlerden biri de“teverruk”aktidir. Çünkü bu akit müeccel/vadeli bir satıştır, yani faiz işleminin yerini almıştır. Teverrük akdi için de örnekleme yapılacaksa şu örnek verilebilir. Müşteri bankadan belli bir vade ve taksitle bir araba satın alıyor. Müşteri bu ürünü teslim aldığı andan itibaren istediği gibi tasarrufta bulunma yetkisine sahip olur. Yani paraya çevirmek için de onu satabilir. Bu uygulama teverruk akdinin aslında düşünülen ve olması gereken doğal şeklidir. Ancak bankalar bu sistemi geliştirip sistematik bankasal teverruk ile teverruk borsası işlemini ortaya çıkarmıştır. Oysaki tüm bu işlemler banka ve müşteri arasında çok boyutlu akit üzerinde kuruludur. İşlemin esası ise müşteri ve banka arasındaki vekâlet sözleşmesi olarak kabul edilir. Çalışmamızda yaptığımız araştırmalar neticesinde şu sonuçlara vardığımızı söylemek mümkündür: Teverruk akdinin sistematik bankasal ya da teverruk borsası şekli değil de, hüküm ve şartları tam olan normal teverruk akdi, İslam hukukuna uygundur. Zira bahse konu şekillerde yapılan sözleşmeler, taraflar arasında hile ile yapılmış hayali ve gerçek olmayan bir zemine dayanmaktadır. Bu tür işlemlerin caiz olmadığına dair fıkıhçılar söylem birliği içerisindedirler. Yapılan araştırma sonucunda bu sözleşmenin ve akdin batıl olduğu kanaatine varılmıştır. İslami bankacılık açısından bu tür yasaklara düşmemek ve toplumun hassasiyetini göz ardı etmeyecek şekilde hem biçim hem de uygulanışın tüm aşamalarında İslam fıkhı zaviyesinden şüphe içermeyen uygulamaları düstur edinmek en sağlıklı yoldur. Bu araştırmada tümevarım yöntemi kullanılarak bilimsel araştırma yöntemleri benimsenmiştir. Araştırmanın konusu olan teverruk akdinin sorunlarına yönelik veriler toplandıktan sonra konu hakkında klasik ve modern dönem fakihlerin görüş ve mezheplerine yer verilmiştir. Son olarak da araştırma sürecinde elde edilen veriler ışığında elde edilen sonuçlar ve sorunun çözümüne yönelik öneriler maddeler halinde ilgililere sunulmuştur."
