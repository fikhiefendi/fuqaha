abstract: "İmâm Şâfiî ilim tahsili amacıyla farklı ilim merkezlerine seyahatlerde bulunmuştur. Buralarda farklı metotlara sahip müçtehitlerden ders almış veya ilmi münazaralarda bulunmuştur. Bu durum onu usûle dair görüşlerinde birtakım değişiklikler yapmaya sevketmiştir. Ayrıca birçok bölgeyi gezip farklı örf ve adetlerle karşılaşmıştır. İlmi birikimiyle bu konulara çözüm getirirken bazen daha önceki ictihâdından vazgeçebilmiştir. Eski ictihâdıyla verdiği hükümler kavl-i kadîmi meydana getirirken yeni içtihâdıyla verdiği hükümler kavl-i cedîdi oluşturmuştur. Biz de çalışmamızda, İmâm Şâfiî'ye ait kavl-i kadîmin kavl-i cedîde tercih edilen meselelerini ele alıp bu meseleleri aynı zamanda diğer mezheplerin görüşleriyle karşılaştırmayı amaçlıyoruz. Bu çalışmamız, İmâm Şâfiî'ye ait iki görüşün oluşum süreciyle beraber bu görüşlerin ona aitliği ve Mezhep içindeki âlimlerin bu kanudaki değrlendirmelerini içermektedir. Ayrıca“Kavl-i kadîmin kavl-i cedîde Tercih Edildiği Meseleler”başlığı altında, ele alınan meselelerin her iki görüşe ait delillerini, diğer üç mezhebin görüşlerini ve bu mezheplerin delillerini kapsamaktadır. Genel anlamda önce görüşlerden birini zikredip dayandığı delili getirdikten sonra diğer görüşü ve delilini aktarmaya çalıştık. Ardından sırasıyla Hanefî, Mâlikî ve Hanbelî mezhebinin görüşlerini delilleriyle birlikte aktarmaya çalıştık."
