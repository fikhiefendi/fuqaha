abstract: "Günümüzün hakimlerinin Osmanlı Devleti'ndeki karşılığı kadılardır. Mamafih kadıların görev çeşitlilikleri ve selahiyetleri hakimlerikinden çok daha fazlaydı. Askerî ve sivil yetkilere haiz olan kadılar merkezin taşrada muhatap olduğu en önemli merci idi. Her türlü duyuru, yapılması istenen emirler kadılar aracılığıyla ahaliye duyurulur ve yerine getirilmesinden yine o sorumlu olurdu. Mahkeme başkanlığının yanında bir müfettiş bazen bir belediye başkanı gibi haraket ederdi. Şerʽîye Mahkemeleri kadıların başkanlığında Tanzimata kadar geniş yetkilere sahip ve her türlü davaya bakan mahkemelerdi. Bu mahkemelerde bizzat kadının oluşturduğu belgeler yanında Padişah, Sadrazam, Beylerbeyi vb. devlet ricalinin gönderdiği evraklar da kaydedilirdi. Dolayısıyla Şerʽîye Sicilleri Osmanlı Devleti'nin ve toplumunun bir aynası aynası niteliğindedir. Ve bu belgeler layıkıyla incelenmedikçe Osmanlı tarihi ve toplum yapısı hakkında yapılan mütalalar daima eksik kalacaktır. İncelenen defter Tanzimat Dönemi'nde Nizamiye Mahkemelerinin alt basamağını oluşturan Bidayet Mahkemesinin hükümlerini ihtiva etmektedir. Bu çalışmada 461 numaralı Elbistan Şer'iye Sicilindeki 156 adet belge transkript edilerek, özetleri verildi. Şer'iye Mahkemeleri ve çalışanları hakkında bilgiden sonra Elbistan'ın kısa tarihçesi ve 19. Yüzyılın son çeyreğindeki sosyal, ekonomik vb. durumları diğer defterlerden de yararlanılarak değerlendirildi."
