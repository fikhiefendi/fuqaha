abstract: "Fıkhın oluşumunu tamamlamasıyla beraber fıkhın temel iki kısmı olan usûl ve fürû'a dair fıkhî birikimin farklı yönlerden ele alınması sonucunda kavâid, fürûk, eşbâh ve nezâir, muhtasar, mazûme, şerh, haşiye ve fetva gibi farklı alt yazım türleri meydana gelmiştir. Fakihlerin çalışmaları sonucu ortaya çıkan bu alt edebî türlerden olan eşbâh ve nezâir edebiyatı fıkhın dinamik yapısını göstermektedir. Bununla birlikte hükümlere ulaşmada kolaylık sağlayıp fer'î meseleler arasındaki benzerlik ve farklılıkları sistematik bir hale getirip öğretici ve öğrenci için kolaylık sağladığı ifade edilebilir. Çalışmamızda genelde kavâid edebiyatı, özelde ise el-Eşbah ve'n-Nezâir edebiyatı açısından derin bir vükûfiyete sahip olan Tacüddîn es-Sübkî'nin (ö. 771/1370) el-Eşbâh ve'n-Nezâir isimli eseri ele alınıp incelenmiştir. Tarih, edebiyat, hadis, nahiv vb. pek çok alanda geniş bir müktesabatı haiz olan Sübkî, bilhassa fıkıh ve usûl alanında yetkin bir kişiliğe sahiptir. İki ana bölümden müteşekkil olan tezimizin birinci bölümünde Sübkî'nin hayatı ele alınmıştır. Bu bağlamda Sübkî'nin Hayatı başlığı altında nesebi, doğumu, ailesi, yaşadığı dönemin siyasi, sosyal ve kültürel yapısı hakkında kısaca bilgi verilmiştir. Ardından ilmi hayatına değindiğimiz Sübkî'nin öğrenim hayatı, hocaları, talebeleri ve eserleri hakkında muhtasar malumatlar zikredilmiştir. İkinci bölümde ise çalışmamızın asıl konusunu teşkil eden eşbâh ve nezâir literatürünün teorik ve pratik arka planı ele alınmış ve Sübkî'nin el-Eşbah ve'n-Nezâir isimli eseri muhteva ve metod açısından ele alınıp incelenmiştir. Önem ve kapsam açısından sıralamaya tabi tutulan kaideler ile fıkhî hükümlere etki eden kelâmî, usûlî, lügavî ve muhtelif konular irdelenmiştir. Önemli görülen bazı yerlerde aralarındaki etkileşimi göstermek için konuyla alakalı diğer eserlerle çeşitli yönlerden mukayese edilmiştir."
