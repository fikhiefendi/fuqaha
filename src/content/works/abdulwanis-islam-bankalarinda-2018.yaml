abstract: "Bu araştırma, İslami bankaların düşünce kavram ve temellerini tanımlamayı ,finanslık yapmayı, finansman olma yöntemleri ve bunun önemini öğrenmeyi, pratik uygulamaları ve bu yöntemlerin yasal yönlerini bilmeyi hedeflemektedir. Ayrıca bu araştırma finansman olma tehlikelerinin nasıl yönetileceğini, İslami bankalar tarafından yapılan yatırımı açıklamaktadır. Bu araştırmada yatırım yapma ve finansman olma yöntemlerinden iki önemli çeşidi üzerineve Salam ve istisna sözleşmesi ve ayrıca İslami bankalarda uygulanabilirlik boyutu, İslami ve Arap ülkelerin diğer finansman olma yöntemleri ile kıyaslanarak ekononomik ilerlemenin geliştirilmesinde nasıl faydalanılacağı üzerine ışık tutulmuştur. Bu konuda bir grup uygulamalı yöntemler izlenilmiştir.İndüktif yöntemle, şeri esaslara gore İslami bankaların finansmanlık ve yatırımda kullandığı en önemli yatırım yapma yöntemleri belirtilmiştir. Salam ve istisna sözleşmelerin araştırılmasında uygulamalı yöntem kullanılmıştır. hukukçuların ve araştırmacıların görüşleri ve İslami ekonomi perspektifi ile ekonomik gelişme üzerinde belirtilmiştir.İslami bankaların deneyimleri ve uygulanıldığında Salam ve istisna sözleşmesinin ekonomik gelişme üzerindeki etkisninin boyutunu konuşurken karşılaştırmalı analiz yöntemi kullanılmıştır. İslami bankalarda kullanılan yatırım yapma yöntemlerinden daha fazlasını belirlemeye çalışan bazı tecrübelerin özeti ortaya çıkarılmıştır. Bilinmesi gereken bazı güvencelerin öğrenilmesi ve araştırmaya faydalı olanların ortaya çıkarılması, bilim adamların kitaplarının ve basında öne çıkan hukukçuların bilinmesi, eski araştırmalar hakkında bilgi sahibi olunulması amacıyla İslamın gerektirdiği denge,ılımlı olma gibi tüm konular ortaya çıkarılmaya çalışılmıştır. Araştırma bir grup sonuç ve referanslarla sonlandırılmıştır."
