abstract: "Kur'ân'ın geçmiş ve gelecekteki her türlü bilgiye kâh açık kâh dolaylı olarak işaret ettiği düşüncesi oldukça erken dönemlerden itibaren literatürde yer bulmuş; büyük oranda bu düşünceden beslenen ve XIX. yüzyılda ivme kazanan bilimselci tefsir akımı içerisinde, Kur'ân âyetlerinden bilimsel sonuçlar çıkarmak ve bu sonuçlar üzerinden Kur'ân'ın evrensel ve mu'ciz bir kitap olduğunu kanıtlamaya çalışmak öncelikli amaçlar arasında yer almıştır. Söz konusu bilimselci tefsir akımının argümantasyonu çerçevesinde Ebû Hâmid el-Gazzâlî (ö. 505/1111), kelâm ve tasavvuf bağlamındaki bazı düşünceleri dolayısıyla, bu tefsir yönteminin kurucusu olarak kabul edilmiştir. Gazzâlî'ye göre Kur'ân, Allah'ın zât, sıfat ve fiillerini anlatmaktadır. Evrende olan her şey Allah'ın fiillerinin yansımasıdır. Dolayısıyla Allah'ın fiillerini araştıran bilim dallarında uzman olan kimseler Kur'ân'ın ilgili âyetlerindeki ilahî hakikatleri yani Allah'ın fillerini daha iyi anlayabilirler. Ebû İshâk eş-Şâtıbî (ö. 790/1388) ise, ümmîlik anlayışından hareketle Kur'ân'ın sonradan ortaya çıkan ilimlerin yardımıyla tefsir edilmesine karşı çıkmakta, Kur'ân'dan ilk muhatapların bilmediği ilimlerin çıkarılmasına itiraz etmektedir. Bilimselci tefsiri Gazzâlî ve Şâtıbî'nin düşünceleri bağlamında incelemeyi amaçlayan çalışmamızda bu tefsir yönteminin tanımı, tarihî gelişimi ve temel mantığı, ilk muhatapların evren anlayışı gibi konular üzerinde durulmuş; Gazzâlî'nin varlık, bilgi ve ilâhî kelâma dair düşüncelerinden hareketle bilimselci tefsir hakkındaki görüşleri incelenmiş; Şâtıbî'nin Kur'ân ve yorum anlayışını şekillendiren temel düşüncelerinden hareketle bilimselci tefsire karşı tutumu araştırılmış; nihayet her iki âlimin düşünceleri hem birbiriyle hem de bilimselci tefsirle ilişkisi yönünden mukayese edilerek tartışılmıştır."
