abstract: "TEMEL SLAM B L MLER ANAB L M DALISLAM HUKUKU B L M DALIGazi BARUTTEZ ÖZETEdebü'l-Kâdû, slam muhakeme hukukunun genel adıdır. Hâkimin gerekmuhakeme sırasında, gerekse özel yaşantısında uyması gereken kuralları ihtiva edenkitapların da genel adı olmuştur. Bu kitaplarda hâkimin kişiliği, insanlarla ilişkileri, sözve davranışları, giyim ve kuşamı da dâhil olmak üzere özel hayatı, beşeri münasebetlerive resmi görevleriyle ilgili hususlar yol gösterici ve düzenleyici bir şekilde ele alınmıştır.slam hukukçuları, adaletli bir şekilde yargılama görevini Allah'a imandan sonrayapılması gereken farzların en güçlülerinden saymışlardır. Dolayısıyla devletin asligörevleri arasında yargı organı bulunmasının şart, toplumun huzur ve güvenliğininsağlanması için hâkim tayin etmenin, devlet başkanı üzerine farz bir görev olduğunubelirtmişlerdir.slam Yargılama Hukuku'na göre bir hâkim, kendisine getirilen bir davadaöncelikle Kur'an-ı Kerim'e, yoksa Hz. Peygamber'in uygulamalarına, yine bulamamışise hukukçu sahabelerin uygulamalarına müracaat edecek, burada da bulamazsa kendiaklı ve bilgisi ile ictihad yapacak ve anlaşmazlığı bir karara bağlayacaktır. Yargılamausulünün özü budur. Beşeri hukukta kanunlar uygulanmakla birlikte, kanunun takdiryetkisi tanıdığı veya durumun gereklerini ya da haklı sebepleri göz önünde tutmayıemrettiği konularda hâkim, hukuka ve hakkaniyete göre karar verir.Bu çalışmada öncelikle, slamiyet öncesi başka milletlerdeki hukuk sistemlerindehâkimliğin tarihsel seyri hakkında genel bilgi verilmiştir. Eski devletlerde tüm yetkilerkralda toplandığı için yargı erki de kral tarafından kullanılmaktadır.kinci bölümde, Edebü'l-Kâdû konusu ele alınmış, hâkimin tayini, hâkimlikşartları, hâkimin yardımcıları ve hâkimin azledilmesi konularından bahsedilmiştir.Üçüncü bölümde beşeri hukuktaki yargı sistemi üzerinde durulmuş, özellikle adliyargıda hâkimlerin atanması, bağımsızlığı, idari denetimleri gibi konularda slamyargılama hukukundaki hâkimlik ile karşılaştırmalar yapılmıştır."
