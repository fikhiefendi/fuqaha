abstract: "Bu çalışma, 1748–1760 yılları arasında İstanbul Bâb Mahkemesi'ne ait şer'iye sicillerinde yer alan yeniçeri kayıtları üzerinden yeniçerilerin aile yapısını incelemeyi amaçlamaktadır. Çalışmada, yeniçerilerin evlilik, boşanma, nafaka ve çocukların bakımı gibi aile içi ilişkilerinin nasıl şekillenmiş olabileceği ortaya konulmaya çalışılmaktadır. Bu çerçevede, öncelikle İslam hukukunda aile kurumunun kurulması, sona ermesi ve boşanma sonrası süreçlere ilişkin hükümler ele alınmış; mehir, nafaka, çeyiz ve hidâne gibi temel kavramların hukuki çerçevesi ana hatlarıyla değerlendirilmeye çalışılmıştır. Şer'iye sicillerinin analizi, yeniçerilerin evlilik ve aile ilişkilerinde genel olarak klasik İslam hukukunun ilkelerini esas aldıklarına işaret etmekle birlikte, uygulamaların dönemin toplumsal ve ekonomik koşullarına bağlı olarak farklılıklar gösterebildiğini düşündürmektedir. Nikâh akitleri, nişan uygulamaları, sagîre kızlarla yapılan evlilikler ile dul ve bekâr kadınlarla evlenme tercihleri, dönemin hukuki ve sosyal yapısına dair önemli ipuçları sunan unsurlar olarak ele alınmıştır. Mehir miktarlarının, yeniçerilerin ekonomik konumları ile kadınların sosyal statülerine bağlı olarak değişkenlik gösterebildiği; çeyiz ve miras uygulamalarının ise aile içi mal paylaşımı ve ekonomik ilişkiler hakkında anlamlı veriler sunduğu görülmektedir. Boşanma pratikleri açısından talâk, muhâle'a ve tefrik türlerinin sicillere yansıdığı; nafaka ve hidâne uygulamalarının ise eş ve çocukların korunmasına yönelik hukuki mekanizmaların işleyişine dair değerlendirme imkânı sunduğu anlaşılmaktadır. Sonuç olarak bu çalışma, yeniçerilerin aile yapısının yalnızca askerî kimlik çerçevesinde değil, aynı zamanda sosyo-ekonomik ve hukuki unsurlar bağlamında da ele alınabileceğini göstermeyi hedefleyerek, yeniçeri tarihi ve Osmanlı sosyal tarihi literatürüne aile kurumu ekseninde katkı sunmayı amaçlamaktadır."
