abstract: "Çalışmamızda gerek tıbbi gerekse şeri açıdan kürtaji ele aldık ve ceninin yaratılış aşamalarını izah ettik. Zira çalışmanın konusu olan İslam hukuku ve tıpta kürtajın hükmü konumuzun unsurlarını analiz etmede takip ettiğimiz yöntem şer'î ve tıbbî bakış açılarıdır. Meseleyi tahlil ederken öncelikle onun şeri hükmünü açıklar, ardından alanında uzman doktorların konu hakkındaki yaklaşımlarına yer verdik. Zira onların yaklaşımları, ictihad etmede ve konuyla ilgili meselelerin çözüme kavuşturulmasında fakihin işini kolaylaştırmaktadır. Nitekim İslam dini, insanın güven ve huzur içinde yaşaması için gerekli olan ve el-Mekâsidu'l-Hamse diye tabir edilen; din, can, akıl, nesil ve maldan oluşan beş temel zorunlu amacı gerçekleştirmek ve bunları korumak amacıyla gelmiştir. Dolayısıyla ceninin de her açıdan korunması gereklidir. Çalışmamız giriş ve dört bölümden oluşmaktadır. Girişte tezin konusu, önemi, amacı, yöntemi ve konuyla ilgili daha önce yapılan çalışmaları ele aldık. Konumuzun doğası gereği ve aynı zamanda tıp ilmi gibi farklı alanlarla ilişkisi olduğu için çalışmamızda analitik, tümevarım ve tümdengelim gibi birkaç farklı yöntemi bir arada tatbik ettik. Birinci bölümde cenin kelimesinin sözlük ve terim anlamı, tıbbi açıdan ceninin durumu ve normal doğumdan önce her hangi bir neden ve yöntemle çocuğun aldırılması veya düşürülmesi manasındaki kürtajı konu edindik. Ayrıca tıbbi ve fıkhî açıdan kürtajın çeşitlerini de irdelemeye çalıştık. İkinci bölümde oluşumundan doğumuna kadar ceninin oluşum sürecini ve aşamalarını etraflıca inceledik. Konu hakkındaki ayet ve hadisleri tahlil ettik. Aynı şekilde modern tıp biliminin açıkladığı ceninin tekevvün evrelerini ele aldık. Yine bu bölümde üzerinde durduğumuz konulardan bir tanesi de fakih ve doktorlara göre cenine ruhun üfürülmesi meselesidir. Biz bu konudaki söz konusu görüşleri serdettikten sonra bu görüşlerden hangisinin kuvvetli olduğunu belirttik. Üçüncü bölümde gerek ruhun cenine üfürülmeden önce gerekse üfürüldükten sonra klasik dönem ve çağdaş fakihlere göre kürtajın hükmünü irdeledik. Ayrıca ruhun cenine üfürülmesinin gebeliğin dördüncü ayında gerçekleştiğini ortaya koyduk. Nitekim gerek klasik dönem gerekse çağdaş fakihlerin tercihi de bu yöndedir. Bu bölümde kürtaj ile ilgili teferruatlı bir şekilde ortaya koymaya çalıştığımız başka bir husus da kürtajın sebepleri, meşrulaştırıcı faktörleri ve onun üzerine terettüp eden hükümleridir. Aynı şekilde kürtaj cinayetini işleyen kişi ve bu kişiye terettüp eden kefaret ve ceza da bu bölümün konuları arasındadır. Son bölüm olan dördüncü bölümde ise cenini korumak için alınması gereken tıbbi ve şer'î tedbirlerin neler olduğunu, kürtajın anne ve toplum üzerindeki olumsuzlukları hakkında bilgi sunduk. Zira kasıtlı olarak yapılan kürtajın toplum üzerindeki etkisi kaçınılmazdır. Ayrıca zina, tecavüz veya mahremlerle yapılan zina sonucunda oluşan gebeliklerin kürtajı, bu kürtajın hükmü ile ilgili alt başlıklara yer verilmiştir. Fakat şu bir gerçektir ki İslam toplumunda, tecavüz, zina veya mahremlerle yapılan zinalardan oluşan gebelik azdır. Bununla birlikte bu tür gayri meşru yollardan meydana gelen gebelikler hakkında İslam hukukçularının farklı görüşleri söz konusudur. Konuyla ilgili belirttiğimiz diğer bir husus da engelli doğacak ceninin kürtajı meselesidir. Söz konusu engelli durum iki çeşittir. Birincisi parmak sayısının fazla veya eksik olması gibi kürtaja ihtiyaç duymayan basit bedenî bozukluklardır. İkincisi ise gerek ceninin gerekse annenin hayatını tehlikeye atacak kadar büyük şekilsel bozukluklardır. Bu ikinci çeşitte ceninin bulunduğu merhale fark etmeksizin alanında uzman, güvenilir doktorların verecekleri sağlık raporları doğrultusunda kürtajın caiz olması ihtilaflıdır. Bunun dışında kürtajla alınan ceninlerin ebeveynlerinin rızasıyla ve saygınlığı korunmak kaydıyla bilimsel deneylerde ve organ naklinde kullanılması hükmüne de değindik. Ancak kürtaj, sadece cenini bilimsel ve tıbbi deneylerde kullanmak maksadıyla yapılıyorsa bu caiz değildir ve masum bir canın hayatına son verildiği için katl sayılmaktadır"
