abstract: "Yaşanan gelişmeler neticesinde son yıllarda dünyada, hızla yaygınlaşan faizsiz bankalar, modern bankaların yaptıkları işlemlerden farklı olarak faiz enstrümanına kârışmadan faaliyetlerini yerine getirmektedirler. Ülkemizde de faizsiz bankacılığın kurulmasına ilişkin olarak hazırlanan ilk yasa 1983 yılında çıkmış ve ilk faizsiz banka ?Özel Finans Kurumu? adıyla 1985 yılında kurulmuştur. Katılım Bankaları alanında ilk düzenlemeler ise 1999 yılında gerçekleştirilmiştir ve altı yıllık süreç sonunda Özel Finans Kurumları adı altında çalışan faizsiz bankaların isimleri 2005 yılında Katılım Bankaları olarak değiştirilmiştir.Ülkemizde faaliyette bulunan katılım bankalarına bakıldığında iki temel amaç çerçevesinde hareket etmektedirler. Bunlardan ilki kişi ya da kurumların ekonomik ve sosyal yaşamlarında faizin sebep olduğu sömürüyü, haksızlığı ve dengesizliği ortadan kaldırmak, ikinci olarak da başta bankacılık ve finans sektörü olmak üzere genel ekonomik sisteme olumlu katkı sağlamak amacıyla atıl duran fonları helal yoldan ekonomik alana çekilmesini sağlamaktadır.Çalışmada faizsiz prensiplerde faaliyet gösteren bankaların müşterilerine, faizsiz nakdi kredi verilebilmesi hedeflenmiştir. Geliştirilen modelin hem ticari hayatın geliştirilmesine, hem de başta Türkiye'de faaliyet gösteren katılım bankaları olmak üzere tüm faizsiz bankaların finansal sektör içerisinde ki payının ve etkinliğinin artırılmasına katkı sağlayacağı düşünülmektedir."
