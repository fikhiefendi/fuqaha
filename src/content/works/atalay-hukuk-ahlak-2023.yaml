abstract: "Ahlâk olgusu toplumsal hayatın her anında işleyiş gösterir/göstermesi beklenilir. Her ne kadar günümüzde ahlâk ve ahlâk merkezli bir yaşam konusunda zâfiyetler gösterilse de ahlâk insan için olmazsa olmaz bir unsurdur. Ahlâk konusunun öne çıktığı alanlardan biri de ticarî ahlâk/ticaret ahlâkıdır. Hukuk-ahlâk bağlantısı çerçevesince İslâm hukukunda ticaret ahlâkının yeri özel olarak düzenlenmiştir. Türk hukukunda ticaret ahlâkının yeri ise etik çerçevesindeki yorumlamalar dışında net olarak çalışılmamıştır. Çalışmamızda ticaret hukuku içerisindeki“ticarî ahlâk”kurumu üzerinde durulmuş, öncelikle hukuk ve ahlâk ilişkisi incelenmiş; ticaret, ticaret hukuku kavramları, ticaretle bağlantılı kuruluşlar ve ticarî süjelerin yeri belirlenmiş, daha sonrasında İslâm ve Türk ticaret hukukundaki genel ilkeler ve ahlâk temelli hukuk kuralları ortaya koyulmuştur. Bu doğrultuda çalışmamızda ahlâk ile desteklenmiş kuralların hukuk üzerindeki etkisinin ne yönde olabileceği ana sorusu çerçevesinde ticarî ahlâkın İslâm ve Türk hukukundaki yeri sorgulanmış, iki hukuk sisteminin birbirinin problemlerine çözüm oluşturabileceği fikriyle hareket edilerek ticarî ahlâka dair düzenlemelerdeki yaklaşımların benzerlik ve farklılıkları ele alınmış, mukayese neticesinde elde edilen verilerle önerilerde bulunulmuştur."
