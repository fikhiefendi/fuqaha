abstract: "Yapılacak çalışmada Diyanet İşleri Yüksek Kurulu tarafından oruç ile konularında verilen fetvaların fetva usulü açısından incelenmesi hedeflenmektedir. Bu, fetvaların hangi mezhep esasına göre verildiği ve söz konusu fetvanın esas alınan mezhebin fetva usulüne uygun olup olmadığı tespit edilmeye çalışılacaktır. Oruç ile ilgili fetvaların, İslam hukuku çerçevesindeki yerini ve Diyanet İşleri Yüksek Kurulu'nun bu konuda izlediği yaklaşımı belirleyerek evlilik konusundaki fetvaların toplumsal ve kültürel etkilerini değerlendirmeyi ve bu fetvaların birey ve toplum üzerindeki etkilerini anlamayı amaçlar."
