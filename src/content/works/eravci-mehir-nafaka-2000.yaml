abstract: "Eravcı, Emine,“Mehir”,“Nafaka”ve“İtaat”Kavramları Çerçevesinde İslâm'a Göre Ailede Eşlerin Sorumlulukları, Yüksek Lisans, Prof.Dr.Hayri Kırbaşoğlu, 121+11 sayfa. Tezimizin Konusu: İslâm'a göre ailede eşlerin sorumluluklarıdır. Bunlardan Mehir, Nafaka ve İtaat kavramları çerçevesinde inceledik. Mehir evlenecek erkeğin kadına ödediği mal veya para cinsi bir değerdir. Kur' an ve Sünnet'te mehir konusu ayrıntılı ele alınmıştır. Mehir kadınları ekonomik açıdan güvence altına almaktadır. Ancak ideal olan kadınların mehir almadan da hayatlarını devam ettirebilmeleridir. Erkeğin karısına karşı ikinci sorumluluğu onun ekonomik ihtiyaçlarım karşılamasıdır. Bu da“Nafaka”olarak isimlendirilir. Kadının çocuk emzirme, evin bakımı, çocukların yetiştirilmesi gibi sorumlulukları vardır. Buna karşılık da erkek onun geçimini üstlenmiştir. İslâm âlimleri kadının sorumluluğu olarak da kocasına itaat etmek olduğunu söylemektedirler. Kadın kocasına her konuda kesin bir şekilde itaat etmesi gerekmez. Kadın, ailenin huzuru, namusu, ekonomik çıkarları konusunda kocasına itaat etmelidir. Sonuç olarak biz de tezimizide bu üç kavramı Kur' an ve Hadislere göre inceledik. İslâm âlimlerinin yorumlarını da değerlendirerek sonunda kendi görüşlerimizi de dile getirdik."
