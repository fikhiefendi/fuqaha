abstract: "Tezde, umum ve husus kavramları fıkıh usulü lafızlar bahsi bağlamında ele alınmıştır. Diğer ilim dallarının umum ve husus kavramlarına yaklaşımına konuyla bağlantısı ölçüsünde yer verilmiş, kavramların fıkıh usulündeki lafızlar bahsi haricindeki kullanımları ise tezin kapsamı dışında bırakılmıştır. Fıkıh usulcülerinin getirdikleri umum ve husus kavramlarının lafızlar bağlamındaki temel görünümleri de kavramların daha iyi aydınlatılabilmesi için incelemeye tabi tutuluştur. Tez, Giriş ve İki Bölüm'den oluşmaktadır. Giriş kısmında, tezin konusunun önemi, sınırlandırılması, sunulması üzerinde durulmuştur. Birinci Bölüm'de umum ve husus kavramlarının daha iyi anlaşılabilmesi için gerekli temel kavramlar tanıtılmıştır. İkinci Bölüm'de fıkıh usulcülerinin ortaya koydukları umum ve husus yaklaşımları farklı açılardan incelenerek kavramlara ilişkin birer tanım önerisi verilmiştir. Son olarak, umum ve husus kavramlarının lafızlar üzerindeki temel somut görünümleri ele alınmıştır."
