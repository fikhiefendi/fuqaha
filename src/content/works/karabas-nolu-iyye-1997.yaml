abstract: "192 ÖZETLER193 Sahife: 1 Belge No: 1 Mut Kazası'nın, Kal'a Mahallesi sakinlerinden olan Timurcu Mustafa'nın veraseti eşi Fatma, büyük kızı Durdı, küçük kızı Ümmügülsüm ve küçük oğlu Ahmed'e intikal etmiş olub, tahsisleri yapıldıktan sonra hisse-i irsiyelerine düşen vereseyi, hanelerine içgüveilik giren ve vereseleri va'di'l-yedinde bulunan enişteleri Bekir Usta'dan taleb ve da'va edib, bu konuda sene üçyüzonbeş tarihiyle o tarihte naib-i şer bulunan Hamdullah Efendi imza ve mührünü içeren bir vekalet hücceti olduğunu, bu konuda şamtlerinin olduğunu,Bekir Usta'nın karşı iddialarda bulunması ve yine Ümmügülsüm ve Ahmed'in tekrar şahit göstermeleri neticesinde toplam altıbindokuzyüzseksen kuruş otuzüç paranın Ümmügülsüm ve Ahmed'in vekili Mustafa Efendiye teslimi için, Bekir Usta ve vekili Abdulkadir Efendiye tenbih olunduğuna dair i'lam. 10Zi'l-kadel317. Sahife: 2 Belge No: 2 Silifke Sancağı'na bağlı Ermenek Kasabası'nın Meydan Mahallesi'nde olan Veli Paşa oğlu Mustafa'nın ölümünden sonra, Mut Kazası'na bağlı Barabanlı Köyü'nde oturan oğullan Dede, Hacı Mahmud ve Mehmed ile kızı Sultan' in kendilerine düşen hisseleri için, Dede, Hacı Mahmud ve Sultan'm kardeşleri Mehmed'i vekil nasb ve tayin eylediklerine dair hüccet. 27 Zi'1-hicce 1317. Sahife: 3 Belge No: 3 İçil Sancağı'nın, Mut Kazası'nın, Halatllı Köyü'nde olan Osman'ın, askerde vefat etmesiyle veresesi eşi Meryem ve küçük oğlu Ahmed'e intikal etmiş olub,Osman'ın Mut Kasabası'ndan Ahmed Çavuş' da on kuruş alacağı olduğunu iddia etmiş, Ahmed Çavuş ise borcu kabul etmiş ve bunların varis olmadığım iddia etmiş olub, dinlenen şahitlerden sonra Meryem ve Ahmed'in Osman'ın varisleri olduğuna dair i'lam. 28 Zi'1-hicce 1317. Sahife: 3 Belge No: 4 Silifke Sancağı'nın Mut Kazası'na bağlı Kayabaşı Köyü'nde oturan bikr-i baliğe Durdı'nın yine aym köyde oturan Tarsu'lı Veli oğlu ile Mut Bidayet Mahkemesi'nde nikahlandıklarına dair hüccet 29 Zi'1-hicce 1317.194 Sahife:4, Belge No:5 Mut Kazası'nın Malya Köyü'nde olub, vefat eden Ahmed'in toplam yüzellialtı kuruş terikesinin varisleri olan eşi Ayşe ile küçük oğlu Durmuş Ali ve büyük kızı Emine arasında taksim edildiğini ve küçük oğlu Durmuş Ali'nin hissesinin vasisi olan Ayşe'ye teslim edildiğine dair terike defteri. 20 Zi'1-hicce 1317. Sahife: 4 Belge No:6 Mut Kazası'mn Malya Köyü ahalisinden olan Ahmed'in vefatından sonra, oğlu Durmuş Ali'nin rüşdüne kadar, annesi Ayşe'nin vasi nasb ve tayin edildiğine dair hüccet. 20 Zilhicce 1317. Sahife: 5 Belge No: 7 Mut Kazası'mn Fakırca Köyü'nden olub vefat eden Şerife'nin.toplam yediyüzdoksansekiz guruş terikesinin varisleri olan eşi Ahmed büyük oğlu Osman küçük oğullan Mehmed Ali ve Ali büyük kızı Emine ve küçük kızları Ayşe ve Emişe arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan babalan Ahmed' e teslim edildiğine dair terike defteri. 28 Zi'1-hicce 1317. Sahife: 5 Belge No:8 Mut Kazası'nın Fakırca Köyü ahalisinden olan Şerife'nin vefatından sonra, oğullan Mehmed Ali ve Ali ve kızlan Ayşe ve Emine'nin rüşdüne kadar, babalan Ahmed'in vasi nasb ve tayin edildiğine dair hüccet. 25 Zilhicce 1317. Sahife: 6 Belge No: 9 Mut Kazası'nın Hocantı Köyü'nden olub vefat eden Abdulgaffar'ın.toplam ikiyüzellialtı guruş terikesinin varisleri olan eşi Fatma, küçük oğullan Ahmed, Mustafa, Mehmed ve Osman ile küçük kızı Meryem arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan anneleri Fatma'ya teslim edildiğine dair terike defteri. 28 Zi'1-hicce 1317.195 Sahife: 6 Belge No: 10 Mut Kazası'nın Hocantı Köyü ahalisinden olan Abdulgaffar'ın vefatından sonra, oğullan Ahmed, Mustafa, Mehmed ve Osman ve kızı Meryem'in rüşdüne kadar, anneleri Fatma'nın vasi nasb ve tayin edildiğine dair hüccet. 27 Zilhicce 1317. Sahife: 7 Belge No: 11 îçil (İçel) Sancağı'nın Mut Kazası'nın Carili Köyü ahalisinden olan Halil'in askerden dönüşü vefat etmesiyle, veraseti babası Mahmud'a intikal etmiş olub, Köme Köyü'nde Hüseyin Efendi'den oğlu Halil'in otuz kuruşluk alacağım taleb edip, Hüseyin Efendi ise borcu kabul edip fakat Mahmud'un varis olub olmadığım bilmediğini,, dinlenen şahitlerden sonra, Mahmud'un Halil'in babası ve varisi olduğu ve otuz kuruşun Mahmud'a ödenmesi için Hüseyin Efendi 'ye tenbih olunduğuna dair i'lam. 3 Muharrem 1318. Sahife:7 Belge No: 12 Nezaret-i Evkâf-ı Hümayun'a bağlı, içel Sancağı'nın, Mut Kazası'nın Güme Köyü'nde olan Hacı Ramazan Vakfı'ndan yevmiyeli Osman Efendi'nin ölümünden sonra, yerine oğlu Mehmed ehil olmadığından yine aynı köyden Hüseyin Efendi'nin bu göreve atanması için veliyü'1-emre yazılan ma'ruzdur. 4 Muhaarrem 1318. Sahife: 8 Belge No: 13 Mut Kazası'nın Gençali Köyü'nden olub vefat eden Dervişoğlu Hüseyin'in toplam üçyüzaltmış guruş terikesinin varisleri olan eşi Meryem, Meryem'in batmnda olan hamli mevkuf, li-ebeveyn er karındaşı Ali ve li-ebeveyn kız karındaşları Ayşe, Emine ve Hatice arasında taksim edildiğini ve harol-i mevkufun, hissesinin vasisi olan annesi Meryem'e teslim edildiğine dair terike defteri. 20 Zi'1-hicce 1317; Sahife: 8 Belge No: 14 Mut Kazası'nın Gençali Köyü ahalisinden olan Durdı oğlu Hüseyin'in vefatından sonra, eşi Meryem'in batnında müstebin haml-i mevkufa annesi Meryem'in vasi nasb ve tayin edildiğine dair hüccet. 2 Muharrem 1317196 Sahife: 9 Beige No: 15 Mut Kazası'nın Hacıilbeyli Köyü ahalisinden olan Emine'nin vefatindan sonra, oğullan Hızır, Mehmed ve Ahmed ile kızı Fatma'nın rüşdüne kadar, annesi Ayşe'nin vasi nasb ve tayin edildiğine dair hüccet. 1 Muharrem 1317. Sahife: 9 Belge No: 16 Mut Kazası'nm Malya Köyü ahalisinden olan Yunus'un vefatindan sonra, kızı Ayşe'nin rüşdüne kadar,annesi Ayşe'nin vasi nasb ve tayin edildiğine dair hüccet.3 Muharrem 1318. Sahife: 9 Belge No: 17 Mut Kazası'nın Dindaş Köyü ahalisinden olan İbrahim'in vefatindan sonra, kızı Fatma'nın rüşdüne kadar, annesi Ayşe'nin vasi nasb ve tayin edildiğine dair hüccet. 3 Muharrem 1318. Sahife: 10 Belge No: 18 İçil (İçel) Sancağı'nın, Mut Kazası'nın, Karabelalı Karyesi'nden olan Mehmed'in Yunan muharebesinde Yenişehir Hastahanesi'nde vefat eylediğinden, veraseti eşi Ayşe, dedesi Hüseyin ve küçük oğlu Hasan'a intikal etmiş olub, Mehmed'in yine mezkur köy ahalisinden Monla Yusuf tan yirmi kuruş alacağım varisleri talep etmiş olub, davalı Monla Yusuf borcunu ikrar etmiş olub fakat varisleri olduğu malumum değildir der ve dinlenen şahitler neticesinde, varislerin bunlar olduğu ve yirmi kuruşun ödenmesi için Monla Yusuf un tenbih edildiğine dair i'lam. 13 Muharrem 1318. Sahife: 10 Belge No: 19 Mut Kazası'nın Göktepe Köyü'nden olub vefat eden Köse Mustafa'nın toplam sekizyÜ2yetmişbir guruş terikesinin varisleri olan eşi Emine, küçük oğullan Abdullah ve Ali ve büyük kızı Fatma arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan anneleri Emine'ye teslim edildiğine dair terike defteri. 6 Muharrem 1318.197 Sahife: 11 Belge No: 20 Mut Kazası'nın Göktepe Köyü ahalisinden olan Köse Mustafa'nın vefatından sonra, oğullan Abdullah ve Ali'nin rüşdüne kadar, anneleri Emine'nin vasi nasb ve tayin edildiğine dair hüccet. 6 Muharrem 1318. Sahife: 12 Belge No: 21 Mut Kazası'nın Karabelalı Köyü'nde olan Kerim'in, yine aynı köyde Asiye ile nikahlanıp, nikahlı eşi iken Asiye ise bu durumu inkar edib, neticede şahitlerin dinlenmesinden sonra, Asiye'nin, Kerim'in nikahlı eşi olduğu tesbit olunub, kocasına itaata tenbih olunduğuna dairi'lam. 16 Muharrem 1318. Sahife: 12 Belge No:22 Mut Kazası'nın Perakende Köyü'nden olub vefat eden Berber İsmail'in toplam binyüz guruş on para terikesinin varisleri olan eşi Emine, kebir oğlu İbrahim veküçük oğullan Ali ve Mehmed ve küçük kızı Emine arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan anneleri Emine'ye teslim edildiğine dair terike defteri. 17 Muharrem 1318. Sahife: 13 Belge No: 23 Mut Kazası'nın Perakende Köyü ahalisinden olan Mehmed'in vefatından sonra, oğullan Mehmed ve Ali ile kızı Emine'nin rüşdüne kadar, anneleri Emine'nin vasi nasb ve tayin edildiğine dair hüccet. Sahife: 14 Belge No:24/l Mut Kazası'nın Gertemin Köyü'nden olub vefat eden toplam guruş terikesinin varisleri olan arasında taksim edildiğini ve küçük oğullan hisselerinin vasileri olan teslim edildiğine dair terike defteri. 18 Safer 1318.198 Sahife: 15 Beige No: 25/2 Mut Kazası'nın Gertemin Köyü ahalisinden olan Sarıkeçili Aşiretinden Hasan'ın vefatından sonra, oğullan İbrahim ve Hüseyin ile kızları Fatma, Emine ve Selver'in rüşdüne kadar, anneleri Ayşe'nin vasi nasb ve tayin edildiğine dair hüccet. 18 Safer 1318. Sahife: 15 Belge No:26/3 Mut Kazası'nın Köselerli Köyü'nden olub vefat eden Ahmed'in.toplam ikibindörtyüzseksenbeş guruş terikesinin varisleri olan eşi Ayşe, küçük kızları Şerife, Müslime ve Fatma, baba bir erkek kardeşi Veli ve baba bir kız kardeşleri Ayşe, Alime, Müslime ve Havva arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan anneleri Emine'ye teslim edildiğine dair terike defteri. 17 Safer 1318 Sahife: 16 Belge No: 27/4 Mut Kazası'nın Köselerli Köyü ahalisinden olan Ahmed'in vefatından sonra, kızları Şerife, Müslime ve Fatma'nın rüşdüne kadar, anneleri Ayşe ve ammileri Veli'nin vasi nasb ve tayin edildiğine dair hüccet. 17 Safer 1318. Sahife: 17 Belge No:28/5 Mut Kazası'nın Alkesi Köyü'nden olub vefat eden Ahmed' in.toplam ikibmüçyüzyirmidört guruş terikesinin varisleri olan eşi Ümmi ve küçük oğullan Mehmed, Hüseyin ve Süleyman arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan anneleri Ümm'e teslim edildiğine dair terike defteri. 17 Safer 1318. Sahife: 18 Belge No:29/6 Mut Kazası'nın Alkesi Köyü ahalisinden olan Ahmed'in vefatından sonra, oğullan Mehmed, Hüseyin ve Süleyman'ın rüşdüne kadar, ammileri Abdulkerim'in vasi nasb ve tayin edildiğine dair hüccet. 17 Safer 1318.199 Sahife: 18 Belge No: 30/7 Adana Vilayeti'nin, İçel Sancağı'nın, Mut Kasabası'nın Kal'a Mahallesi'nde olan Hatice'nin, aslen Ermenek Kazası'nın Keçi Mahallesi'nde olan ve Mut Kasabası'nın mezkur mahallesinde olan eşi Hasan'la, birbuçuk seneden beri zevcelik muamelesi bulunmadığım, validesinin din ve imanına cima lafzıyla küfür ettiği cihetle bain-i talak olduğunu ve şer' an ayrılarak mihr-i müeccelini ve iddet nafakasını talep ettiğim, Hasan ise bain-i talakı kabul edib cima lafzıyla küfrü hakkındaki iddiayı reddetmiş olub, Hatice'nin şahitlerinin dinlenmesinden sonra haklılığına karar verilib, Hasan'ın toplam dörtyüzdoksan kuruş mihr-i müeccel ve iddet nafakasını Hatice'ye edaya, Hasan'ın şer'an tecdidi iman ettirilmesine ve tecdidi nikah Hatice'nin rızasına bağlı olduğuna dair i'lam. 12 Safer 1318. Sahife: 19 Belge No:31/8 Silifke Sancağı'na tâbi Bulaçlı Aşireti'nin Koyuncu Karyesinden olub Mut Kazası 'nm Kavaközlü Köyü'nden sakin iken vefat eden Ali'nin toplam ikiyüzotuzsekiz guruş yirmi para terikesinin varisleri olan eşi Ayşe, küçük oğullan Hüseyin, Mehmed ve Süleyman ve küçük kızları Fatma ve Emine arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan anne baba bir ammileri Hasan'a teslim edildiğine dair terike defteri. 26 Safer 1318. Sahife: 20 Belge No: 32/9 Silifke Sancağı'nın Koyuncu Köyü'nden olub Mut Kazası'nın Kavaközlü Köyü'nde ikamet eden Ali'nin vefatından sonra, oğullan Hüseyin, Mehmed ve Süleyman ile kızları Fatma ve Emine'nin rüşdüne kadar, ammileri Hasan'ın vasi nasb ve tayin edildiğine dair hüccet. 26 Safer 1318 Sahife: 20 Belge No:33/10 Mut Kazası'nın Köselerli Köyü'nden olub vefat eden Mehmed'in toplam altıyüzyetmişdört guruş otuzbeş para terikesinin varisleri olan eşi Emine, babası Hacı Ahmed, küçük oğullan Mustafa ve Mehmed ve küçük kızı Fatma arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan baba bir ammileri İbrahim'e teslim edildiğine dair terike defteri. 25 Safer 1318.200 Sahife: 21 Beige No: 34/11 Mut Kazası'nın Köselerli Köyü ahalisinden olan Mehmed'in vefatından sonra, oğulları Mustafa, Mehmed, Sami ve Hamid ile kızı Fatma'nın rüşdüne kadar, arnmileri İbrahim'in vasi nasb ve tayin edildiğine dair hüccet. 25 Safer 1318 Sahife:22 Belge No:35/12 Mut