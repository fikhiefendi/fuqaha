rike defteri. 3 Cemaziye'1-ula 1318. Sahife: 26 Belge No: 41/18 Mut Kazası'nın Nodalı Köyü ahalisinden olan Süleyman'ın vefatından sonra, oğlu Mehmed'in rüşdüne kadar, annesi Meryem'le ammisi Mehmed'in vasi nasb ve tayin edildiğine dair hüccet. 3 Cemâziye'1-ulâ 1318. Sahife: 26 Belge No:42/19 Mut Kazası'nın Zintan Köyü'nden olub vefat eden İbrahim'in toplam bindörtyüzdoksansekiz guruş terikesinin varisleri olan küçük oğullan Mehmed ve Mustafa ve büyük kızı Ümmü arasında taksim edildiğini ve küçük çocukların hisselerinin vasileri olan li- üm er karındaşları Monla Yusuf a teslim edildiğine dair terike defteri. 5 Cemaziye'1-ula 1318. Sahife: 27 Belge No:43/20 Mut Kazası'nın Zintan Köyü ahalisinden olan İbrahim'in vefatından sonra, oğullan Mehmed ve Mustafa'nın rüşdüne kadar, ana bir kardeşi Monla Yakub'un vasi nasb ve tayin edildiğine dair hüccet. 5 Cemâziye'1-ulâ 1318.202 Sahife: 28 Belge No: 44/21 Adana Vilayeti'nin, İçel Sancagı'nın, Mut Kasabası'nın Kal'a Mahallesi'nde sakin fakat aslen Arabkir Kazası'nın Paşabağı Mahallesi'nde olan Şadiye'nin, İstanbul'un Sangüzel Çıkrıkçı Kemaleddin Mahallesi'nde, Yağhane Sokağı'nda olan, sınırları belli ve sened-i hakanileri bulunan arsanın icarıyla ilgili işlemleri için, Devlet-i Aliye'nin tebasından ve Rum Milleti'nden Bodus Efendi'nin vekalete tayin edildiklerine dair hüccet. 5 Cemaziye'l-ula İ318. Sahife: 28 Belge No: 45/22 Adana Vilayeti'nin, İçel Sancagı'nın, Mut Kazası'nın Güllüce Köyü ahalisinden olan ve askerde onbaşı iken vefat eden Mehmed'in, dinlenen şahitler neticesinde varislerinin validesi Abide ve kardeşi Ali olduğuna dair i'lam. 3 Cemaziye'1-ahir 1318. Sahife: 29 Belge No:46/23 İçel Sancagı'nın Mut Kazası'na bağlı Göktepe Köyü'nde olan ergin bakire Sara'nın yine Mut Kazası'nın Alaçam Köyü'nde olan Kütük Dursun Ali oğlu Mustafa ile Mut Bidayet Mahkemesi'nde nikahlandıklanna dair hüccet. 25 Cemaziye'l-ula 1318. Sahife:29 Belge No:47/24 Adana Vilayeti'nin, İçel Sancagı'nın, Mut Kazası'nın, Fakırca Köyü'nde olan Neb