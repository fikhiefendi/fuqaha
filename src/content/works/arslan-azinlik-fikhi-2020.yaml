abstract: "İkinci Dünya Savaşı sonrası, merkezinde ekonomik sebeplerin bulunduğu bazı gerekçelerle İslam ülkelerinden Batı'ya göçler yaşanmıştır. Batı'da Müslüman toplum varlığının artmasıyla, özellikle dini pratiklerin hayata geçirilmesindeki sorunların da arttığı gözlemlenmiştir. Bu durum Müslüman toplumun sorunları ile ilgilenecek kuruluşların ortaya çıkmasına sebep olmuştur. Müslüman toplumun sorunlarının fıkhi çözümünde en çok ihtiyaç duyulan konu, mahallinde çözümlerin üretilebileceği bir anlayışın geliştirilmesidir. Bu ise sorunun ortaya çıktığı ülkede yaşayan, toplumun sosyolojik tahlilini yapabilen, demografik yapısının farkında olan kişiler ile mümkündür. Bu kişilerin yer aldığı komisyonlardan biri de Avrupa Fetva ve Araştırma Konseyidir. Bu çalışmada söz konusu konseyin yapısı, üyeleri ve vermiş oldukları fetvaların yöntemi bazı örnekler üzerinden ele alınarak incelenmiştir."
