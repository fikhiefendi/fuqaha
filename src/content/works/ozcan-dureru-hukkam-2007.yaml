abstract: "Bu tez, Ali Haydar Efendi'nin Dürerü'l-hükkâm eseri esas alınarak yapılan bir çalısmadır. Bu eser, ?slam hukukunun medenî hukuk alanında ilk kanunlastırma örneği olan Mecelle'nin en önemli serhlerinden birisidir. Çalısma, üç temel bölümden olusmaktadır. Birinci bölümde, Ali Haydar Efendi'nin hayatı, ilmî faaliyetleri ve eserleri hakkında bilgi verilmistir. ?kinci bölüm ise Dürerü'l-hükkâm ve bu eserin özellikle kefalet bölümü ile ilgili genel bilgilere ayrılmıstır. Bu bölümde ayrıca müellifin eseri yazarken takip ettiği usul ve yararlandığı eserler üzerinde durulmustur. Çalısmanın üçüncü ve son bölümünde ise Dürerü'l-hükkâm'ın kefalet bölümü latinize edilmistir. Bu bölümde ayrıca yazarın bu serhi yazarken yararlandığı ve sadece ismine atıfta bulunduğu eserler tarafımızdan tespit edilmistir. Son olarak, orijinal metinlerin ilgili sayfaları dipnotta gösterilmistir. Latinize çalısması sırasında metnin aslına sadık kalınmaya çalısılmıstır."
