abstract: "Kısas cezası gerek suçun faili, gerek mağduru, gerekse suç teşkil eden fiile yönelik birçok şartın varlığı ile yürürlük kazanmakta ve bu şartların hiç oluşmaması ya da şartların varlığına rağmen cezanın sübutunu engelleyen birtakım hukuka uygunluk nedenlerinin bulunması hâlinde sanık hakkında cezanın oluşması baştan mümkün olmadığı gibi, ceza sabit olup sanık mahkûm statüsünü kazandıktan sonra da birtakım hukuki gerekçelerle cezanın düşmesi ya da infazının tecili söz konusu olabilmektedir. Dolayısıyla da İslam ceza muhakemesinde cana veya beden bütünlüğüne yönelik haksız fiillerin asli cezası olan kısasa doğrudan başvurulmayıp öncelikle genel caydırıcılık oluşturması bakımından kısas gerektiren suçlar ilan edilerek suç ve cezanın kanuniliği sağlanmış, telafisi imkânsız yargı hatalarının önüne geçmek için suçun teşekkülünü ve ispatını zorlaştıran, hatta bazı durumlarda neredeyse imkânsız kılan birtakım şartlar belirlenmiş, bunun yanı sıra yargılama esnasında“Şüpheden sanık yararlanır.”ilkesiyle hareket edilerek kısas salt cezalandırma felsefesi üzerine kurulmamış, aksine fert ve toplum maslahatına binaen en son çare olarak cezanın tatbiki yoluna gidilmiştir."
