abstract: "Zekât mallarının nemalandırılması konusu günümüzde ortaya çıkan klasik fıkıh literatüründe ve son döneme kadar ki fıkıh müktesebatında ele alınmamış güncel bir meseledir. Zekâtın nemalandırılması konusuna taalluk eden bazı metodolojik problemler bulunmaktadır. Bunların başında zekât emrinin fevre mi yoksa terâhiye mi delalet ettiği noktasındaki ihtilaf ve zekâtın ifâsında temlik şartı gelmektedir. Ayrıca nemalandırma sonucu elde edilen kârın veya menfaatin paylaşımı ve zarar durumunda tazmin sorumluluğu meseleleri de konuya dair soru işaretleri oluşturmaktadır. Zekâta taraf olan müstahik, mükellef, aracı kurumlar, devlet veya nâibi konumundaki kişi ya da kurumlar tarafından zekât malları nemalandırılabilmektedir. Konunun fıkhî analizinin yapılabilmesi için bu tarafların zekât ibadeti açısından rollerinin ne olduğu ve nemalandırma konusunda salahiyetlerinin bulunup bulunmadığı oldukça önemlidir. Bununla birlikte zekâtın nemalandırılması meselesinin caiz olduğu varsayıldığında bu faaliyetin hangi sınıflara ait fonlardan yapılacağı veya hangi yöntemler izlenerek uygulanacağı soruları da önem arz etmektedir. Konu hakkında çağımızın önde gelen ilim adamları tarafından lehte ve aleyhte pek çok görüş belirtilmiştir. Buna ilaveten İslam fıkıh akademileri ve çeşitli ülkelerin fetva kurulları tarafından mesele tartışılmış ve kararları yayınlanmıştır. Bu çalışmada öncelikle zekât mallarının nemalandırılmasına dair metodolojik problemler kapsamlı bir şekilde incelenmiş akabinde zekâta taraf kişi ya da kurumların rolleri ve nemalandırmaya dair yetkileri değerlendirilmiştir. Ayrıca mezkûr görüş ve fetvalar çerçevesinde konunun caiz olup olmadığı hususunda görüş beyan edenler ve öne sürülen delilleri incelenip değerlendirilmiştir. Buna ilaveten meselenin caiz olabilmesi için ileri sürülen şartlara, uygulamaya ve mahiyete yönelik şartlar başlıkları altında ayrıca yer verilmiştir. Çeşitli İslam ülkelerinde faaliyet gösteren zekât kurumları ve ülkemizin önde gelen hayır cemiyetleri tarafından zekât fonunun nemalandırılmasına dair uygulamalar bulunmaktadır. Bu kapsamda Cezayir, Sudan, Malezya ve Türkiye örnekleri incelenmiş ve değerlendirilmiştir. Sonuç olarak konumuz teorik anlamda fıkhî temellere sahip olmakla birlikte pratikte karşılığı bulunan, hak sahiplerinin maslahatına yönelik bir uygulamadır. Zekât fonunun finansal araçlar vasıtasıyla kısa ve orta vadede artırılması, hak sahiplerine yönelik mikro finans projelerinin desteklenmesi, üretim ve hizmet projelerinin hayata geçirilerek hak sahiplerine hem istihdam sağlanması hem de ihtiyaçlarının giderilmesi, zekât mallarının nemalandırılması kapsamında değerlendirilmektedir."
