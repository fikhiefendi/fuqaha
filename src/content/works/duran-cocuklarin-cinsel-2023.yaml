abstract: "Çocuk, bedensel ve ruhsal açıdan sağlıklı olarak yetiştirilmesi, bakım-beslenme gibi temel ihtiyaçlarının giderilmesi, eğitim imkânının sağlanması ve zararlardan ko-runması için bakım ve gözetime muhtaç bir bireydir. Bu ihtiyaç, aile ve toplum üze-rinde bir takım yetkilerle birlikte sorumluluklar da doğurur. Çocuğun en temel yaşamsal ihtiyaçlarından olan güvenliği, çocukların cinsel is-tismarı suçu nedeniyle ihlal edilmekte, cinsel eylemin çocuğun fiziksel sağlığına etki-lerinin yanında oluşturacağı psikolojik etkinin yıkıcı sonuçları olmaktadır. Hatta pek çok cinsel istismar vakası ölümle sonuçlanmaktadır. Çocuğun istismarı fiziksel, duygusal, ekonomik ve cinsel olmak üzere dört fark-lı ana kategoride ele alınmışsa da bu çalışmada yalnızca çocukların cinsel istismarının İslam hukukuna göre suç niteliği araştırılmaktadır. İlgili fiillerin“cinsel istismar”ola-rak kavramlaşması ve çocuk özelinde hüküm geliştirilmesi oldukça yakın bir döneme denk geldiğinden, İslam hukuk âlimlerinin konu hakkındaki görüşleri ve modern dö-nem uygulamaları referans alınarak bir perspektif geliştirme ihtiyacı hâsıl olmuştur. Bu bakımdan ilgili literatür, araştırma-inceleme metodu ile taranmış, tümevarım yöntemi kullanılmıştır. Çocukların cinsel istismarının İslam ceza hukukuna göre suç olduğu, genel itiba-riyle 15 yaş altındaki çocukların cinsel eyleme maruz kalması, pornografik materyali görmesi ya da bu materyalde malzeme olarak kullanılması; fuhuş sektöründe çalıştı-rılması gibi eylemler çocukların cinsel istismarı olarak suç teşkil ettiği kanaatindeyiz. İslam hukukuna göre bu suçun basit hâlinin, zinaya benzer fiiller kapsamında değer-lendirilerek cezaya tabi tutulduğu; nitelikli hâlinin bir görüşe göre hırâbe bir görüşe göre zina haddi gerektirdiği, haddi düşüren durumlar meydana geldiğinde ise tazir ile cezalandırılması gerektiği tespit edilmiştir. İslam hukukunun söz konusu eylemlere ilave yaptırımları da yine cinsel istismar suçunun sonuçları arasındadır. Cinsel istismar failine sopa vurma, hapis, öldürme ve benzeri cezalara ilaveten, failin çocuğa tazminat ödemekle yükümlü tutulması; çocuğu istismar eden ya da ağır ihmali ile istismara se-bebiyet veren ailelerin velayet hakkına müdahale edilmesi ve gerçekleşen cinsel fiil nedeniyle evlenme yasakları tanımlayarak çocuğun ve ailesinin koruma altına alınması bunlardandır."
