abstract: "“İmam Şâfiî'nin er-Risâlesi ile Cessâs'ın el-Fusûl fi'l-Usûl'ünün Haber, Hadîs ve Sünnet kavramları çerçevesinde mukayesesi”ismini verdiğimiz yüksek lisans tez çalışmamız giriş ve iki bölümden oluşmaktadır. Birinci bölümde Kur'ân-ı Kerîm ve Hz. Peygamber'in hadîs usulüne kaynaklık teşkil edecek ayet ve hadislere yer verdikten sonra Etbau't-Tabiîn'e kadar süreç ifade edilmekte ve bu şekilde hadîs usulünün İmam Şâfiî ve Cessâs'a kadar ki süreçte gelişimi ele alınmakta olup devamında müelliflerin hayatlarına ve ilmi şahsiyetlerine dair biyografik bilgilere yer verilmektedir. İkinci bölüm ise çalışmamızın asıl noktasını oluşturmakta ve bu bölümde eserlerin söz konusu kavramlar çerçevesinde genelden özele gidecek şekilde haber, hadîs ve sünnet kavramlarına dair mukayesesini içermektedir. Söz konusu mukayesede haber kavramıyla başlayıp müelliflerin haber taksimlerine ve bu kavram altında oldukça detaylı olarak ele aldıkları haber-i vahid kavramına dair görüşlerini ifade etmektedir. haber kavramının hemen akabinde hadîs kavramı ve hadîs kavramı altında ele alınan konulara yer verilmektedir. Son olarak ise müelliflerin bütün bu görüşleri ışığında sünnet anlayışlarına dair görüşlerine yer verilmiştir. Bütün bu bölüm öncelikle İmam Şâfiî'nin akabinde Cessâs'ın görüşleri ele alınmış olup ve iki görüşü de ifade ettikten sonra mukayese başlığı altında değerlendirmelere yer verilmiştir. İkinci bölümün sonunda genel bir değerlendirme yapılarak tez sona ermektedir."
