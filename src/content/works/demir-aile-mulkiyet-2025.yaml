abstract: "Bu tezde İslâm felsefesi çalışmalarında pratik felsefenin ihmal edilen kısmı olan ev yönetimini (tedbîrü'l-menzil) Yunan ve Roma kaynaklarıyla mukayeseli bir şekilde ele alarak birey ve toplum arasındaki çok yönlü işlevlerini tahlil etmeyi amaçladık. Ev yönetiminin kaynaklarını, mahiyetini ve problemlerini tahlil etmeye gayret ettik. Ev yönetimine kaynaklık eden Antik Yunan'daki“oikonomia”yı tarihsel bir arka plan olarak sunduk. Roma ve İslâm felsefesinde tevarüs edilen yönlerinin nasıl alımlandığını temel kaynaklar üzerinden gösterildi. Tezde bir pratik felsefe disiplini olarak ev yönetimi literatürü etrafında geliştirilen ana yaklaşımlar, problemler ve modellemeler ortaya konuldu. Ayrıca insanın temel gereksinimleri ve ihtiyaçların yönetimi etrafında şekillenen ev yönetiminin iktisadî çehresini oluşturan meslekler, para ve ekonomik uğraşlar bahisleri etraflıca kritik edildi. Çalışmada Meşşâî felsefe çizgisi bağlamında pratik felsefenin ahlâk, ev yönetimi ve siyaset şeklindeki üçlü tasnifi arasındaki güçlü bağ korunarak değerlendirmelerde bulunuldu. Bunun yanı sıra tedbîrü'l- menzil anlayışının fıkıh, tasavvuf, ahlâk, siyaset gibi alanlarla olan ilişkisine yeri geldikçe değinilerek farklı perspektiflerin varlığına işaret edildi."
