abstract: "Herhangi bir konuda aşırıya gitme ve haddi aşma gibi anlamlara gelebilen israf kavramı, daha çok maddi harcamalar konusunda kullanılmaktadır. İnsanların ihtiyacı sınırlı olsa da tüketimin sınırsız olduğu insanlara aşılanarak daha çok tüketmeye yönlendirilir. Özellikle teknolojinin gelişmesi ve sanayileşme ile daha çok tüketmeyi bir yaşam felsefesi haline getiren tüketim toplumunda israf boyutu her geçen gün artmaktadır. Aslında nesnelerin tüketilmesi gerekirken insanın kendisinin tükendiği bir tablo ile karşı karşıya gelinmiştir. İsraf olgusu, önce kişinin kendisini, sonra aile düzenini ve içinde bulunmuş olduğu toplumu yoksulluğa sürükler. Bu durumun önüne geçmek ancak her sorunu çözmede rehber olan İslam dininin ortaya koymuş olduğu hükümlerle mümkündür. İnsanlar, bir yandan Allah'ın çizmiş olduğu sınırlar içerisinde olmalı diğer yandan insanlık için en iyi örnekleri ortaya koyan Hz. Muhammed'in davranışlarını takip etmelidir. Bir atık yönetim felsefesi olarak tanımlanabilen“sıfır atık”kaynakların daha verimli kullanılması ve atık oluşumunun engellenmesi veya minimize edilmesi yoluyla çevreye daha az zarar verilmesini ve sürdürülebilir bir gelecek inşa edilmesini amaçlar. Dünyanın birçok yerinde sıfır atık uygulamalarının hayata geçirilmeye başlandığını görürüz. Bu uygulamaların sayısı arttıkça ve yerinde uygulamalara imza attıkça dünya daha yaşanılabilir bir hale gelecektir. Her zaman dengede olmayı öğütleyen İslam dininin öğretileri ile sıfır atık uygulamaları paralellik gösterir. Böylelikle sıfır atık uygulamaları ile israfın önüne geçilecek ve daha yaşanılabilir bir dünya mümkün hale gelecektir."
