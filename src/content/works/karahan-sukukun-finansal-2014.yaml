abstract: "Türkiye ekonomisi, genç eğitimli beşeri sermayesi, jeopolitik konumu, güçlü sanayi altyapısı ve artan rekabet gücü sebebiyle büyük ekonomik gelişme potansiyeline sahiptir. Ne var ki, Türkiye ekonomisi, tasarruf açığı, teknoloji açığı ve enerji açığından kaynaklanan önemli iktisadi sorunlara da sahiptir. Diğer yandan, tasarruf açığını azaltmak, yatırımları ve ekonomik büyümeyi güçlendirmek için, Türk bankacılık sektörü faizsiz bankacılık ve yenilikçi faizsiz bankacılık ürün ve hizmetlerine doğru dönüşüm göstermekte ve çeşitlenmektedir. Bu bağlamda, bu tezin temel amacı, Türkiye ekonomisinde, genelde faizsiz bankacılık ve ürünlerini incelemek, özelde ise faizsiz bankacılık için yeni ve en önemli bir yatırım/finansman aracı olan sukuku (kira sertifikasına) araştırmaktır. Çalışmada, sukuk ihracı ile finans piyasasında başlayan yeni süreç ele alınmıştır."
