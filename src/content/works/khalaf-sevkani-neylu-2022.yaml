abstract: "Bu çalışmanın amacı, mutlakın mukayyede hamli meselesine odaklanarak, Şevkânî'nin Neylü'l-evtâr adlı kitabının taharet ve namaz bölümlerinde usûl-i fıkıh açısından nasıl bir yöntem izlediğini ve o yöntemin uygulamalarını, çalışmanın konusu ile ilgili Şevkânî'nin hayatındaki bilimsel ve kişisel noktaları ortaya koymaktır. Bununla beraber bu çalışma, Şevkânî'ye göre mutlak ve mukayyet kavramları, mutlakın mukayyede hamlinin şartları, onları etkileyen usûl ve kuralları açıklayıp, diğer alimlerin görüşleri ile karşılaştırmayı amaçlamaktadır. Bundan dolayı, çalışmanın kapsadığı bölümlerdeki mutlakın mukayyede hamledildiği meseleleri araştırarak topladık ve bunların üzerinden bu çalışmayı yaptık. Çalışma giriş ve üç bölümden oluşmaktadır. Girişte araştırmaya dair bilgiler verilmiş iken, ilk bölümde İmam Şevkânî ve kitabı Neylü'l-evtâr, mutlak ve mukayyet kavramları, onların durumları ve mutlakın mukayyede hamlinin şartları ile ilgili bilgiler ele alınmıştır. İkinci bölüm, Şevkânî'nin Neylü'l-evtâr adlı kitabında, taharet bahsindeki mutlak ve mukayyet ile ilgili görüşlerini ele almaktadır. Bu bölüm yedi meseleyi içermektedir. Üçüncü bölüm ise Şevkânî'nin namaz bahsindeki mutlak ve mukayyet ile ilgili görüşlerini ele almaktadır. Bu bölüm ise on dört meseleyi içermektedir."
