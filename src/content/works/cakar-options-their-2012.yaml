abstract: "Bu tez Finansal Opsiyonların genel özelliklerini ve Katılım Bankalarındaki yerini ele almaktadır. Öncelikle modern opsiyonların özelliklerini işleyip kısaca fiyatlama metodlarına değinilecek ve sonrasında özellikle Katılım Bankacılığındakilerle daha çok benzerlik gösteren Egzotik Opsiyonlardan bahsedilecektir. Katılım Bankacılığıın Dünya çapındaki hızlı yükselişi göz önüne serilerek İslami Bankaclığın opsiyon ürünlerine olan ihtiyacına dikkat çekilecek ve konvansiyonel bankadaki egzotik opsiyon karşılıklarıyla son derece benzerlik gösteren vakalar işlenecektir. Farklılıkları az olan bu vakalar üzerinden opsiyonların Konvansiyonel Bankacılık ve İslami Bankacılık'taki yerleri kıyaslanacaktır."
