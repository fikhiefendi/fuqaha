abstract: "Başlangıçta, İslam miras hukukunun ve örfi miras hukukunun kuramsal çerçevesi hakkında bilgi verildi. Osmanlı Devleti'nde kadının İslam miras hukukundaki durumunu kolay bir şekilde anlayabilmek için, tereke kayıtları ve fetva örnekleri belirli formatlarla aktarıldı. Tereke kayıtlarında incelenen paylaşımların büyük bir kısmının fıkıh kitaplarında yer alan oranlar ile uygunluk gösterdiği görüldü. İslam miras hukuku hükümlerine uygun düşmeyen paylaşımlar için getirdiğimiz yorum, varislerin mirası rızai taksime göre paylaşmaları oldu. Bu paylaşımların bir kısmı kadın lehine bir kısmı ise kadın aleyhine gerçekleşmektedir. Örfi miras hukukundaki genel durumu anlamak için, miri arazi ve örfi miras hukukuna tabi vakıfların intikalinde yaşanan dönemsel değişimler yakından irdelendi. Bunların yanında, incelenen birçok vakıfnamede, evlatlık vakıf kuran kişilerin vakıf mallarından yararlanma usulünü, İslam miras hukuku hükümlerini değiştirecek şekilde belirleyebildiği görüldü. Gayrimüslim kadınlar zaman ve mekan bakımından istikrar gösterecek düzeyde İslam miras hukuku hükümlerine göre pay almışlardır. Kadınlar için, muris ve varis olma bakımından reaya askeri sınıf ayrımı yoktur. Osmanlı'da kadının vela mirasçılığı da kabul edilmektedir. Müçtehitler arasında farklı görüşlerin mevcut olduğu durumlarda, seçilen bir görüşün devamlı surette uygulandığı görülmektedir. Kadının miras payına hukuksuz bir müdahalede gerçekleşirse, kadının hakkı devlet tarafından korunmaktadır."
