abstract: "Son iki asırdır köklü bir değişim ve dönüşüm yaşayan İslam dünyasının tümünde olduğu gibi Tunus?ta da çok hızlı ve kayda değer bir gelişme olmuştur. Dolayısıyla tüm İslam ülkeleri gibi Tunus?ta da İslam hukukunun hazırlanışı ve tatbiki bakımından bir kırılma yaşanmıştır. Bu araştırmada, 19. ve 20. Yüzyılda -son iki yüzyıl itibariyle Tunus?un yaşadığı kurumsal, kavramsal ve hukuki değişim muvacehesinde- Tunus?ta pozitif hukukun gelişim seyri irdelenmiştir. Pozitif hukukun gelişimi üç ana döneme ayrılmış ve üç ana başlık altında yapılan reform, yasama ve anayasa hareketlerine değinilmiştir. Hazırlanan kanunların ve Anayasanın yapılışı, niteliği ve muhteviyatı üzerinde durulmuştur. Osmanlı İdaresine bağlı Tunus eyaletinin, bir taraftan ıslahat çalışmaları içerisinde daha çok temel hak ve hürriyetlerin artırılması, bir Anayasanın ve Yeni Ceza Kanunu?nun hazırlanması çalışmalarını sürdürürken diğer taraftan sistemi tıkayan, adalet mekanizmasını sekteye uğratan ve kazaî ayrılık doğuran Şeriat Mahkemelerinin yeniden düzenlenmesi ve ayrıca yabancılara tanıdığı imtiyazlar sebebiyle Konsolosluk Mahkemelerinin kaldırılıp yerine Karma Mahkemelerin kurulması gibi yoğun bir hukuki yapılanma içine girdiğini görmekteyiz. Ayrıca olaylar karşısındaki tutum ve tavrı pek net olmayan bir ulema sınıfının ikna edilmesi, onlarla zıtlaşılmaması ve yönetime katılmalarının sağlanması yoluna gidilmiştir.Fransız Himaye Yönetimine gelince; Fransızlar bir Himaye Yönetimi ile Tunus?u il statüsüne sokmuşlardır. Tunus toprakları, Avrupalı spekülatörler ve yerleşimciler tarafından mülkleştirilmiş ve de toplumsal hayatta bir değişim yaşanmıştır. Ancak hiç şüphesiz, Himaye Yönetiminin, Tunus?ta hukukî ve adlî sistem hususunda inkâr edilemez katkıları olmuş, hatta bu bakımdan Osmanlı İdaresi döneminin önüne geçilmiştir. Davalar, mahkemelerde daha sistemli bir şekilde görülür olmuştur. Bu dönemde, mahkeme çeşitliliği bakımından bir serbestiyetin varlığına şahit olmak mümkündür. Mahkemelerin sayısı, görev ve yetki alanları belirlenmiştir. Bir yandan hukuki yapılanma ve mahkemeler konusunda laik düzene geçilirken, diğer yandan İslamî Mahkemelerin sürekliliği de sağlanmıştır. Laik ve İslamî Mahkemelerin işlevlerini daha rahat icra edecekleri ikili bir hukuk sistemi getirilmiştir. Ayrıca bu dönem içinde Fransız hukukunun, olduğu gibi alınıp Tunus hukukuna uyarlandığı kanunlara şahit olmaktayız. Bağımsızlıktan sonra tamamen Batılı, modernist bir yasama faaliyeti içerisine giren Tunus, İslam hukukunun dışında Batılı (Fransız) hukukundan da yararlanmak suretiyle hukuk sistemini tamamen laikleştirmiştir. Şeriat Mahkemelerinin ve Şer?î Aile Hukukunun kaldırılması amacıyla bir Ahvâl-i Şahsiyye Kanunu hazırlanmış ve yargılama yetkisi Kamu Mahkemelerinin eline verilmiştir. Tunus Devleti ayrıca devletin yapısını, kimliğini ve işlevlerini tespit etmek maksadıyla 1959 tarihli bir Anayasa hazırlamış ve yürürlüğe sokmuştur. Bu Anayasa, 1991 Anayasası ile değiştirilmiştir.Vakıf arazilerinin kamulaştırılması, kadın haklarının artırılması, kadının aile içinde her yönüyle erkeğe eşdeğer konuma getirilmesi ve gayrimüslim erkeklerle evlenebilmelerine kolaylık sağlanması, geleneksel Tunus toplum yapısının hukuki gelişmeler muvacehesinde bir dönüşüm ve değişim yaşamış olduğunu göstermektedir. Doğal olarak bu değişim, bağımsızlık sonrası yasama faaliyetine büyük tesir etmiştir."
