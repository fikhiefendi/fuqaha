abstract: "İmam Nevevî, hicri VII. asırda yaşamış ünlü bir İslam âlimidir. Şam ve çevresinde devrinin mümtaz şahsiyetlerinden ders almış, başta Fıkıh ve Hadis olmak üzere İslamî ilimlerin birçok dalında yüksek bir salâhiyet kazanmıştır. Yüksek ilmî kişiliği, üstün zekâ ve anlayışı, yüksek derecede fazilet, züht ve takvası, telif ettiği seçkin eserleri ile haklı bir üne kavuşan Nevevî, İslam Hukuk tarihinde önemli bir mevki elde etmiştir. İmam Nevevî, Ehlisünnet'in fıkhî-âmelî dört büyük mezhebinden biri olan Şâfiî mezhebinin gelişmesinde önemli bir role sahiptir. Yaşadığı asırda Şâfiî mezhebini kendisi temsil etmiştir. Mezhep içerisinde çeşitli içtihatlarda bulunmuş, fetvâ vermiş ve mezhepteki farklı görüşler arasında tercih yapma derecesine kadar yükselmiştir. Telif ettiği eserler mezhepte en mutemed eserler olarak kabul görmüş, üzerlerinde çok sayıda şerh ve haşiye yazılmıştır. İmam Nevevî'nin çalışmaları ile Şâfiî mezhebi bugünkü son şeklini almıştır. Bu tezde, Nevevî'nin ilmî şahsiyeti, fıkıh alanında telif ettiği eserler ve fıkhî meselelere dâir yaptığı tercih ve değerlendirmeler incelenmektedir. Başta Nevevî'nin eserleri ve bu eserler üzerine yazılan şerh ve haşiyeler olmak üzere onu ilgilendiren diğer belli başlı eserlerden hareketle Nevevî'nin fıkıh ilmine katkısının tespit edilmesi hedeflenmektedir. Yapmış olduğu fıkhî çalışmaların Şâfiî mezhebinde nasıl bir etki bıraktığı ve kendisinden sonraki dönemde Şâfiî çevrelerin bu çalışmaları nasıl değerlendirdiği ortaya konulmaya çalışılmaktır."
