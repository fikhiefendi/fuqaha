abstract: "İnsanlık tarihi boyunca üretim ve yatırım ilişkisi önemli bir denklem olmuştur. Üretim hem büyümenin hem de kâr etmenin kaynağı olarak görülmektedir. Üretimi artırmak için yapılacak her yatırım da sermayenin varlığına bağlıdır. Sermaye kimi zaman üretim artığı veya kâr sonucu elde edilebilirken kimi zaman da borçlanma yoluyla elde edilebilir. Modern dönemde yatırım için gereken borçlanmaya kaynak sağlayan en önemli aktör banka olmuştur. Ancak tarihte bankacılık dışı uygulamalarla da bu ihtiyaçların karşılandığı bilinmektedir. İlk çağlarda, Mezopotamya'da varlığını sürdüren Sümer Medeniyeti'nde“maket”adı verilen müesseselerde bankacılık benzeri yapılar bulunmaktaydı. Sonraki dönemlerde gerek Orta Doğu'da gerek Avrupa'da banka benzeri birçok müessesenin kurulduğu ve işletildiği görülmektedir. Roma İmparatorluğu, Selçuklu İmparatorluğu, Osmanlı İmparatorluğu gibi uzun yıllar hüküm sürmüş ve ardında bir medeniyet tarihi bırakmış devletler incelendiğinde banka benzeri yapıların çeşitli formlarda var olduğu görülmektedir. Özellikle Osmanlı İmparatorluğu'nda uzun yıllar faaliyet göstermiş ve teolojik tartışmalara konu olmuş“para vakıfları”da banka benzeri sermaye satışı yapan kurumlar arasında gösterilmektedir. Bu çalışmada İslam ekonomisi kapsamında değerlendirilmesine karşın, tarihte çok farklı yer ve zamanlarda kullanım alanı bulmuş bir yöntem olan mudarebe sistemi üzerinde durulmuştur. Mudarebe sistemi hem faizsiz bir kredilendirme yöntemi olarak kabul görebilir hem de kamunun kullandığı teşvik ve hibe gibi desteklere alternatif olabilir. Mudarebe yöntemi maliye politikası aracı olarak kullanıldığında bir kamu harcaması kalemi olmakla birlikte bu harcamayı finanse edebilecek bir kamu geliri kalemi de olabilir."
