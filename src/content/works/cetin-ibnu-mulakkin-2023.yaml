abstract: "Hadis şerh literatürü tetkik edildiğinde daha çok Buhârî ve Müslim'in ya da bu iki kitabın birlikte merkeze alınması ile telif edilen eserlerin tercih edildiği görülür. Bu itibarla şârihler, Buhârî ve Müslim'in ittifak ettiği ahkâm hadislerini bir araya getiren ve ilim meclislerinde en çok itibar gören eserlerden biri olması sebebiyle Cemmâîlî'nin (ö. 600/1203) Umdetü'l-ahkâm'ına yönelik de her dönemde şerhler yazmışlardır. İbnü'l-Mülakkın da el-İʿlâm bi fevâidi Umdeti'l-ahkâm adlı eseriyle Umdetü'l-ahkâm'ı şerh edenler arasında yerini almıştır. Bu araştırmada, daha çok hadis ve fıkıh ilimlerinde öne çıkan İbnü'l-Mülakkın'ın söz konusu şerhinde takip ettiği yöntem incelenmiştir. Öncelikle müellifin yaşadığı dönem ve hayatı hakkında yeterli ölçüde bilgi verilmiş, ardından el-İʿlâm adlı eseri genel özellikleri açısından tanıtıldıktan sonra şerh metodu bakımından bütün yönleriyle tahlil edilerek hadis şerh literatüründeki yeri tesbit edilmeye çalışılmıştır. İbnü'l-Mülakkın'ın özellikle hadis ve fıkıh ilimleri başta olmak üzere derin bir ilmî birikime sahip olmasının altında yatan sebeplerin başında ailesinin ilme olan iştiyakıyla küçük yaşlarda ona verdikleri eğitim ve dönemin pek çok meşhur hocasından ders alması zikredilebilir. Ayrıca içinde bulunduğu coğrafyada, idaredeki Memlüklerin de etkisiyle ilmî hareketlilik en yoğun biçimde yaşanmıştır. Bu devir, her mezhebin etkisini gösterdiği ve pek çok alanda üst düzey eserlerin ortaya konduğu dönem olmuştur. İbnü'l-Mülakkın'ın oldukça fazla sayıda eser telif etmesinde ve sahip olduğu ilmî birikiminde bu hususların da etkisinin bulunduğu ifade edilmelidir. Onun bu ilmî müktesebâtı el-İʿlâm adlı eserinde de kendini göstermiş, bu eseri hadis ve fıkıh alanındaki uzmanlığının en belirgin çalışmalarından biri olmuştur. Müellif bu eserinde, çoğunlukla kendi mezhebine bağlı olarak şerh faaliyeti yürütmekle birlikte mezheplerin düşünce sistemlerinden bağımsız hareket edebilmeyi ve münekkid bir tavırla değerlendirme yapmayı başarmış bir şârih olduğunu da göstermiştir."
