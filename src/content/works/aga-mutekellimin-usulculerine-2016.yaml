abstract: "Fıkıh ve usûl kelimelerinden müteşekkil olan fıkıh usûlü terkibi, şer'î tafsîlî delillerden hareketle şer'î hükümlere ulaşmak için sistematik bir düzlemde icmalî deliller ortaya koymayı mümkün kılan bilimin adıdır. Nazarî hukuk olarak da ifade edilen fıkıh usûlüne dair yazılan eserler, İslâmî ilimlerin tedvin edildiği tarihe kadar uzanır. Fıkıh usûlü ilmi, müstakil bir çalışma alanı olduğu günden bu yana ona dair irili ufaklı pekçok eser yazılmış ve bugün hâlâ yazılmaya devam etmektedir. Bunlardan bazıları alana dair bütün konuları kısaca ihtiva ederken, özellikle akademik çevrede müstakil konu ve ıstılah merkezli çalışmalar tercih edilmektedir. Biz de bu çalışmamızda ikinci kısmı tercih ettik. Istılah merkezli çalışmalar arasında umum ifade eden lafızlar ve bunları tahsis etme metodları önemli oranda işlenmiştir. Ancak buna rağmen müstakil olarak ele alınmayı hakettiğini düşündüğümüz bazı terimler, hâlâ akademik düzeyde ele alınmamıştır. Bunlardan birisi, lisâniyât, kelam, mantık, fıkıh ve fıkıh usûlü gibi birçok ilim dalında yer edinmiş olan istisna terimidir. Bir fıkıh usûlü terimi olarak işleyeceğimiz istisnayı, hem literal hem de hükümlere yansıma tarafını mütekellimin usûl âlimlerinin penceresinden bakarak ele aldık. Çalışmamızda bütün yönleriyle ele aldığımız istisna kavramını mütekellimin usûl âlimleri açısından özetle şöyle tarif etmek mümkündür: Kaynağı itibariyle tek bir mütekellime dayanan, özel ve sınırlı sayıda lafızlara sahip olup, muttasıl olan, müstakil olmayan, müstesnanın müstesna minhu bütününden olmadığına delalet eden, şart, sıfat, gaye ve nâsih olmayan, umumi bir hükmü illa/ إلا ve benzeri edatlarla tahsis etmeye istisna denir."
