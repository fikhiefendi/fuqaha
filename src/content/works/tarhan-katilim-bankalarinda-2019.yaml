abstract: "Faiz, tüm dinlerde olumsuz karşılığı bulunan ve dinen caiz görülmeyen bir para kazanma yöntemidir. Bununla birlikte en çok İslam dininde hoş görülmeyen faizin para kazanma aracı olarak görülmemesi önerilmiş hatta yanına yaklaşılmaması tavsiye edilmiştir. Bu sebeple faizden uzak duran ekonomi, katılım bankacılığını ortaya çıkartmış ve burada kâr-zarar endeksine dayalı bir bankacılık modeli oluşturmuştur. Faizsizlik prensibiyle çalışarak, banka kaynaklarından elde edilen kâr veya zararın bölüşüldüğü bankacılık sistemine Katılım Bankacılığı denir. Faiz hassasiyeti olan inançlı kesimin birikimlerinin değerlendirilmesi veya finansman ihtiyaçlarının giderilmesi için alternatif yöntemlere gereklilik duyulmuştur. Bu ihtiyaç nedeniyle ortaya çıkan ve değişen dünya şartlarında finansal yapının dışında kalmanın mümkün olmadığı günümüzde birçok İslami kuralların geçerli olduğu ülkelerde bu sistem benimsenmiştir. İslami bankacılığının modern anlamda ilk örneği 1963 yılında Mısırda Mit Ghamr Tasarruf Bankası ile başlamış ve nüfusunu Müslümanların oluşturduğu diğer ülkelerde de İslami bankacılık hızla yayılmıştır. Eski adları“Özel Finans Kurumu”, yeni adları ise“Katılım Bankası”olan bu bankacılık modelinin ülkemizdeki varlığının tarihi oldukça yenidir. Türkiye'de 1983 yılında Bakanlar Kurulu kararıyla Özel Finans Kurumu adıyla kurulan katılım bankaları 1999 yılında Bankacılık Kanununa tabi olmuş, 2005 yılında da yine kanunla katılım bankası adını almışlardır. 1985 yılından beri Türkiye'de faaliyet gösteren katılım bankaları istikrarlı bir büyüme sergileyerek bankacılık sektöründeki payını arttırmaktadır. Bankaların karlılıklarını arttırmada ve risklerini azaltmada finansal durumlarını sürekli gözden geçirmeleri oldukça önem arz etmektedir. Banka yöneticileri için bankanın finansal durumunu gösteren en temel araçlar banka finansal tablolarıdır. Yöneticiler kendi bankalarının finansal tablolarını ve diğer bankaların finansal tablolarını iyi analiz ederek, mevcut performanslarını değerlendirebilir, geleceğe yönelik hedeflerini oluşturabilir, strateji ve planlar yapabilirler. Bu tez çalışmasının amacı; finansal bilgi ve kullanıcılarından, finansal tablolar ve analiz yöntemlerinden, katılım bankacılığının tanıtımından ve finansman yöntemlerinden, katılım bankacılığının finans sektöründeki gelişiminden bahsedilmesi ve Ülkemizde faaliyet gösteren katılım bankalarının yayımlanan yaklaşık son beş yıllık finansal verilerinin, finansal tablolar analizi yöntemleriyle analiz edilerek performanslarının değerlendirilmesidir. Çalışmamın birinci bölümünde finansal bilgi ve kullanıcıları ile finansal tablolar ve finansal tabloların analiz teknikleri hakkında genel bilgilerden bahsedilmiştir. İkinci ve son bölümde ise; katılım bankacılığı anlatılmış ve Ülkemizde faaliyet gösteren katılım bankalarının yaklaşık son beş yıllık finansal verileri finansal tablo analiz yöntemleri ile analiz edilmiştir. Özellikle sektörün en genç üyesi olan Vakıf Katılım Bankası A.Ş.'nin finansal durumu analiz edilerek sektördeki diğer katılım bankalarına göre ayrıca performansı değerlendirilmeye çalışılmıştır."
