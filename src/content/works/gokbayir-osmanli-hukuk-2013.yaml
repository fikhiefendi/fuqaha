abstract: "Osmanlı dönemindeki şer?iyye sicilleri, genellikle o dönemi anlama konusunda en önemli bilgi kaynaklarından biri olarak kabul edilir. Tezimizin konusu, ?Erzincan Şer?iyye Sicilleri?ndeki ve günümüz Erzincan?ındaki evlenme- boşanma kayıtlarının günümüzle mukayesesidir. Tezimizde öncelikle Osmanlı hukuk sistemi ve şer`iyye sicilleri hakkında kısa bilgiler verildi sonra nikah akdi ve talak konularına özce değinildi ardından sicildeki nikah-talak davalarının transkripsiyonunu yapıldı. Son bölümde de davaların genel değerlendirmesine yer verildi. Bu genel değerlendirme şer?iyye sicillerine, adliyeye ve müftülüğe yansıyan davalar baz alınarak yapıldı. Fıkhın pratik hayattaki uygulamalarını kavramamıza ve teorik yönünü anlamamıza yardımcı olan, hem İslam fıkhının klasik kaynaklarından sayılıp hem uygulama boyutunu kapsayan Osmanlı şer?iyye sicil defterleri aynı zamanda Osmanlı?da uygulanan şer?i hukukun da kaynaklarındandır. Tezimizde de zikrettiğimiz üzre, teori-pratik ilişki cenahından meseleye bakarsak elbette ki fıkhın pratik hayattaki uygulamalarını kavramamız, aynı zamanda teorik yönünü anlamamıza da oldukça yardımcı olacaktır. Ayrıca, fıkhın temel kaynakları olan ?Kitap? ve ?Sünnet?in nasıl anlaşıldığı, nasıl yorumlandığı ve nasıl uygulandığı da fıkhın her iki boyutunu dikkate alan çalışmalarla daha iyi anlaşılabilecektir. Bu çalışmamızın amaçlarından biri de bu sorulara mümkün olduğunca cevap vermek ve günümüzde temel kaynakların ve klasik fıkıh literatürünün nasıl anlaşılması gerektiğini ortaya koymaktır. Yaşadığımız bu hızlı çağda tüm dünyada olduğu gibi Türkiye?de de boşanmaların oldukça fazlalaştığına şahit olmaktayız. Bahusus geçmişten günümüze Erzincan?ın evlenme ve boşanma oranlarına baktığımızda boşanma oranının Erzincan?da da her geçen yıl arttığını görüyoruz. Hayat standartları geçmişe kıyasla oldukça yüksek olduğu halde insani doyumsuzluk had safhaya doğru gidiyor. Acaba buna paralel bir yöneliş mi mevzu bahis evlilik müessesesinde? Boşanmaların sebeplerinden biri olarak görülen ekonomik sorunlar şu soruyu da akla getiriyor: Acaba bu sorunlar ekonomik yeterliliğin yükselmesinden mi yoksa ekonomik yetersizlikten mi kaynaklanıyor? Evlilik birliğini böylesine kökten sarsan sebepler neler? Çalışmamızın esas önemi bu soruların cevap bulması noktasında ortaya çıkan verileri gerçekler ışığında harmanlayarak gerek Erzincan?ın tarihine gerekse fıkhın sosyal hayatın etkisine bir katkıda bulunma arzusudur.Ailenin modernleşme ve sanayileşmenin sebep olduğu değişim ve başkalaşım süreciyle birlikte çoğu işlevlerini diğer kurumlara aktardığı örneğin yaşlı bakımı huzurevlerine, çocuk bakımı kreşlere.. fakat esas niteliklerini muhafazaya devam ettiği hipotezine istinaden ele aldığımız bu tezin amacı, evvela Osmanlı döneminde resmi olarak yürürlükte olan İslâm hukukunun nasıl uygulandığının, farklı din ve ırktan insanların bir arada yaşadığı bir toplumda insanlar arasında vuku bulan davalar neticelendirilirken İslâm hukukunun nasıl işletildiğinin ve İslâm hukukuna aykırı herhangi bir uygulamanın olup olmadığının belirlenmesidir. İkinci olarak çağımızın evrimci modernleşme anlayışının, ailenin tamamen önemini yitirdiği öngörüsünün aksine bilakis bireysel kimliğin inşasına sosyal varlık alanıyla doğrudan ilişkili olduğunun fehmedilmesidir. Değişimin kontrol edilemez hızla yaşandığı toplumumuzda geçmişle bugünü kaynaştıramamanın ve dinin temel öğretilerini çağın dinamikleriyle bağdaştıramamanın kültürel sancısı yaşanırken aile kurumu da bu durumdan kendisine düşen payı almıştır. Aile mefhumunun payına düşen, şiddetli geçimsizlik ve boşanma davalarındaki artışlardır maalesef. Sosyal düzenin en temel birimi olarak kabul edilen aile malum sorunun hem ?kaynağı? hem de ?çözüm aracı? olmak gibi ilginç bir işlevi de üstlenmektedir. Biz işte bu işlevi irdeliyeceğiz. Bunu yaparken kimi akademik çalışmalardaki gibi sıkıcı uslup bariyerlerine takılmadan geçmişte nasıldı, şimdi nasıl sorularına birtakım istatistiki verilerin de yardımıyla ?objektif bilimsellik?ten ödün vermeden cevaplar arayacağız."
