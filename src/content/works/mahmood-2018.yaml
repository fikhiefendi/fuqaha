abstract: "Arap dili, sahip olduğu etkin betimleme ve açıklama gücü nedeniyle önemli bir role sahip olduğu gibi cer harflerinin Arap dilinde ve fıkhî hükümlerin istinbatında önemli bir yeri vardır. Zira cer harflerinin her birisinin farklı anlamları bulunmaktadır ve her birinin Kur'an ve hadislerden hüküm elde etmede büyük etkisi vardır. Cer harflerinin bu önemine binaen fıkıh، gramer ve dil kaynakları ışığında (Fıkhi Hükümlerin Tespitinde Harf'i Cerlerin Rolü) konusunu tercih ettik. Konuyu önemine binaen derinlemesine işledik. Zira anlamlar dil ile ifade edildiği gibi Kur'an ayetlerinde ve peygamberin hadislerinden hüküm dil ile elde edilir. Kapsamlı şekilde incelenebilmesi amacıyla konuyu üç bölümde ele aldık. Birinci bölümde harfin sözlük ve terim olarak mahiyeti ele alındıktan sonra (ب،ك،ل) harflerinin anlamları ile yemin edatı olan (ت) ile (و) harflerinin anlamı incelenmiş ve ilgili âyetler ile âlimlerin konu hakkındaki görüşlerine değinilmiştir. İkinci bölümde cer harflerinden (فِي، عَنْ، مِنْ، إِلَى، عَلَى، رُبَّ، حَتى، حاشا) edatları ve bunlarla ilgili âyetler ile ulemânın görüşleri işlenmiştir. Üçüncü bölümde ise cer harfleri ve anlamları ile ilgili en önemli fıkhî konular ele alınmıştır. Araştırma neticesinde şu sonuçlara vardık: Arap dili açısından büyük bir öneme sahip olan harfler، nahiv açısından da önemli bir yere sahiptir. Cer harflerinin sahip olduğu önem، birden fazla anlam taşımalarından kaynaklanmaktadır. Bu harflerin her biri bazen cümlenin akışıyla belirlenebilecek birden fazla anlam taşımaktadır. Ayrıca bu harfler fiilin yerine kullanılmaktadır. Örneğin (ب) harfi bitişme fiilinin، (ك) benzetme fiilinin yerine geçmiştir. Aynı şekilde diğer harfler de farklı fiillerin anlamını ifade eder. Kur'anda kullanılan cer harflerinin anlamlarının tefekkürü ve derinlemesine incelenmesi، ayetlerin fıkıh، tefsir، inanç ve diğer açılardan sağlıklı bir şekilde anlaşılmasına yardımcı olmaktadır."
