abstract: "Hz. Peygamber, toplum ile kurmuş olduğu iletişimde yaşadığı çağ ve gönderildiği toplum arasında özel bir dil inşa etmiştir. Muhatap ile kurulan ilişkide muhatabın durumu ve Hz. Peygamber'in yaklaşım usûlü açısından çeşitli öncüllerin ve buna bağlı disiplinel bir düzenin oluşturulduğu görülmektedir. İletişimin muhataba bakan yönünde kişilerin psikolojik ve sosyo- kültürel yapıları nebevî yaklaşımın alt yapısını oluşturmaktadır. Sahip olunan cinsiyet, yaş, ilgi, kabiliyet, mizaç ve karakter yapıları gibi bireysel farklılıklar“psikolojik durum”tespitini, toplumun özellikle örf ve adet olarak nitelendirdiğimiz kültürel fonksiyonları ve kişinin toplum içerisindeki konumu ise“sosyo- kültürel”yapının anlaşılmasını sağlamaktadır. İşte bu iki öncül Hz. Peygamber'in iletişimindeki muhatap kimliğini ifade etmektedir. Bu çalışmada muhatap- cevap ilişkisi, muâmelâta dair yöneltilen sorular karşısında Hz. Peygamber'in cevabında cinsiyet, yaş, eğitim, psikolojik durum gibi bireysel faktörlerin ne derece etkili olduğu araştırılmıştır. Dolayısıyla sorular, temel verilerimizi oluşturmakla birlikte insanı, toplumu ya da dönemi analiz etmede önemli bir kaynaklık değeri taşımaktadır. Yapılan araştırmalar sonucunda her bir insanın yaşadığı hayatta subjektif yaşantılara sahip olduğu görülmüştür. Bu yaşantılar ise öteki açısından psikolojik bir fenomen olduğu gibi kişiyi anlamayı, potansiyellerinin şekillendiği zaman ve mekâna dair bilgi sahibi olmayı gerektirmektedir. Bireysel farklılıklar olarak tanımlanan bu özgül duygu- durumlara karşı Hz. Peygamber'in uyguladığı yöntem ise“muhatapların zaviyesince iletişim”olmuştur. Böylece din- insan ilişkisinde kişiyi kendi kılan duygu, düşünce, davranış ve değer yapılarının ne derece mühim olduğu görülmüştür."
