abstract: "Kuşeyrî hicrî 4. yüzyılının sonunda ile 5. yüzyılında yaşamış, Gazâlî ise çoğunlukla hicrî 5. yüzyılında yaşamıştir. Kuşeyrî ve Gazâlî, sırf kendi zamanlarında değil, kendilerinden sonra gelmiş olan birçok âlim ve düşünürü etkilemişlerdir. Zamanla:“Şerîat ve Hakîkat'i cem edenler”olarak tanınmışlar. Temel amacımız, bu iki müfessirin işârî yorumlarını tespit edip mukâyese etmektir. Bu çalışmada, Abdulkerîm el-Kuşeyrî'nin 'Letâifu'l-işârât' kitabı ve Muhammed El-Gazâlî'nin 'İhyâu 'Ulûmi'd-Dîn' kitabı esas alınmıştır. Bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümde, araştırmanın konusu, önemi, amacı ve yöntemi üzerine durduktan sonra, Kuşeyrî ve Gazali'nin hayatları, ilmi kişilikleri ve eserleri hakkında bilgi verilmiştir. Aynı zamanda özetle yaşadıkları zamana dair bilgiler sunululup ve giriş bölümün sonunda ise bir değerlendirme yapılmıştır. Birinci bölümde, işârî tefsirin ne olduğuna dair üzerine durulmuştur. İkinci bölümde ise, Kuşeyrî'nin Letâifu'l-İşârât kitabı ve Gazâlî'nin İhyâu'Ulûmi'd-Dîn kitabı hakkında bilgi verilip, kitapların temel özellikleri üzerine durulmuştur. Ayrıca Letâifu'l-İşârât ve İhyâu'Ulûmi'd-Dîn'den tespit edilen işârî yorumlarına dair örnekler sunulmuştur. Bu bölümün sonunda yine bir değerlendirme yapılmıştır. Sonuç olarak, Kuşeyrî'nin Letâif'inde ele aldığı konuların, tasavvufun daha derin konuları olduğu, Gazâlî'nin İhyâ'daki ele aldığı konuların ise daha genel olduğu dikkat çekmektedir. Bunun da eserlerin yazma amacında ve muhatap kitlesinden kaynaklandığını düşünmekteyiz. Aralarındaki benzerliklerine gelince, Gazâlî'nin sadece Kuşeyrî'nin Risâle'sinden değil, aynı zamanda Letâifu'l-İşârât'ından da etkilenmiş olduğunu düşünüyoruz. Özellikle Gazâlî'nin 'kîle/denildi' kodlamasını kullandığı zaman, kendi yorumu ve Kuşeyrî'ninki arasındaki benzerlikler ortaya çıkmaktadır."
