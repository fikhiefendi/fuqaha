abstract: "Biz bu çalışmamız da Ömer Nasuhi Bilmen ve O'nu tarihe geçiren en önemli eserlerinden birisi olan Hukuki İslamiye ve Istılahatı Fıkhiyye Kamusu adlı eserinin hukukî tahlilini yapmaya çalıştık. Araştırmamıza Türkiye'deki kanunlaştırma hareketlerine genel bir bakışı amaçladığımız giriş bölümüyle başladık. Tanzimat'tan önce Osmanlı toplumunda hukuk, Tanzimat'tan Cumhuriyet Hukuk'una geçiş ve Cumhuriyet'le başlayan yeni hukuk dönemi hakkında genel bilgiler vermeye çalıştık. Daha sonra Ömer Nasuhi Bilmen ve Istılahatı Fıkhiyye Kamusu hakkında tanıtım mahiyetinde özet bilgi sunarak bölümlere geçtik. İki bölüm şeklindeki çalışmamızın birinci bölümünü Ömer Nasuhi Bilmen' in hayatı, ilmi kişiliği ve eserlerine ayırdık. Eserlerini Tefsir, Fıkıh, Hadis, Kelam, Ahlak ve Edebiyat alanlarındaki çalışmaları şeklinde gruplandırarak, telif ettiği kitaplarıyla alakalı özet bilgiler vermeye çalıştık. Bu bölüme, yayınlanmış olan bazı makaleleri ve nerelerde yayınlandıkları hakkındaki bilgileri aktararak son verdik. İkinci bölümü ise tamamen esere ayırmış bulunmaktayız. Müellif niçin böyle bir eseri yazma gereği hissetmiş? Eser nasıl bir sistematik üzere kaleme alınmış? Hangi kaynaklardan istifade edilmiş? Eser üslup bakımından günümüz insanına hitap edebiliyor mu? ve Hukuki İslamiyye Kamusu İlim dünyasında ne tür etkiler meydana getirmiş?... Bütün bu sorulara cevaplar bulmaya çalıştık. Sistematikten bahsederken klasik fıkıh kaynaklarının sistematiği, daha özelde Hanefi mezhebindeki sistematik gelişim, Kamus'un bu sistematik içerisindeki yeri araştırılmıştır. Kullanılan kaynaklar Hanefi ve diğerleri şeklinde bir ayırıma tabi tutulmuştur. Eserin dilinden bahsettikten sonra ilim dünyasındaki etkileri ıstılahlar ve genel olarak eser hakkında söylenilenlerin özetlenmesi ile sona erdirilmiştir. Çalışmamız esnasında İSAM Kütüphanesi başta olmak üzere Ankara Üniversitesi İlahiyat Fakültesi Kütüphanesi ve SAÜ. İlahiyat Fakültesi Kütüphanesi' nden istifade ettik. Mümkün olduğunca eser ve müellifi hakkındaki her malumata ulaşmaya çalıştık. VIII T.C. YÜKSEKÖĞRETİM KURU LP, ©OKfteSANTASYON MERKEZİ *"
