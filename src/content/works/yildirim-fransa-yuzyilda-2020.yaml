abstract: "Revue du Monde Musulman, Kasım 1906 ile 1926 yılları arasında 66 cilt yayımlanan oryantalist bir dergidir. Paris'te yayımlanmaya başlayan bu dergi, Alfred Le Chatelier tarafından kurulmuştur. 1927 yılında itibaren ise Revue des Études İslamiques adını alarak yayın hayatına devam etmiştir. Dergide İslam dünyası ile alakalı coğrafi, tarihi, dini, siyasi vs. her türlü konudan yazı bulunmaktadır. 20. asırda, Avrupa'daki diğer ülkeler gibi Fransa dergicilik faaliyetlerini; oryantalist çalışmalarını ve görüşlerini yaymak için kullanmıştır. Bu çalışmalardan birisi de yaklaşık 21 yıl boyunca yayımlanan Revue du Monde Musulman dergisidir. Dergide mevcut fıkhi yazılara bakıldığında o döneme ait tartışılan fıkhi ve hukuki konular görülmekte, oryantalistlerin İslam dünyası hakkında görüşleri ve eleştirileri bulunmaktadır. Çoğu oryantalist uzman yazar kadrosuna sahip olan dergi, amacı gereği İslam dünyası hakkında yazılan bütün çalışmaları (coğrafi, tarihi, dini vs…), belgeleri ve gezi notlarını Fransızcaya tercüme edip yayımlamaktır. Bu çalışmada Revue du Monde Musulman dergisi genel hatlarıyla tanıtılmış ve dergide fıkıhla ilgili katkısı olmuş yazarlar ve özellikle ihtiva ettiği fıkhi yazılar çalışılmıştır. Bu bağlamda derginin kuruluş ve yayın süreci, yayın politikası, amacı, yazar kadrosu ve kaynakları hakkında bilgi verilmiş, dergide bulunan fıkhi konular saptanıp fıkhi yazılardan hareketle tespitlerde bulunulmuş, fıkıh içeren yazıların müelliflerden birkaçının hayatı anlatılmış. Fransa'nın 20. yüzyılda yayımladığı oryantalist ve bilimsel bir dergi olan Revue du Monde Musulman; içerdiği fıkıh yazılarında özellikle Fransızların İslam dünyası hakkında görüşlerini dile getirip bazen de eleştiride bulunduğu örnek bir dergidir. Ayrıca bu dergi, o dönem içerisinde oryantalistlerin çalıştığı ve Müslümanların tartıştığı fıkhi konuları okurlarına aktardığı da görülmektedir."
