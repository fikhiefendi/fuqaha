abstract: "Osmanlı Devleti şerîatle yönetilen bir devlet olduğu için, İslâm hukukunun devlet yöneticisine tanıdığı bazı tasarruflar bulunmaktadır. Örf-î sultanî dediğimiz örfî hukukun oluşum mecrasının temeli de, şerîatın devlet başkanına tanıdığı bu yetkidir. Osmanlı Devleti padişahları, İslâm hukukunun tanıdığı bu yetki çerçevesinde toplumsal pek çok alanda düzenleme yapmışlardır. Bu düzenlemeleri de nizami bir şekilde kânunnâmeler aracılıyla halka duyurmuşlardır. Osmanlı'nın kuruluşundan yıkılışına kadar pek çok kânunnâme düzenlemesi yapılmıştır ancak biz konumuzu sadece XV.-XVII yy. arasında yayınlanan kânunnâmeleri ele almak üzere daralttık. Osmanlı Devleti, zinâ suçuyla ilgili olacak şekilde gerekli olan maddeleri tanzim etmiştir. Bu bağlamda şartlar oluşmadığı takdirde, zinâ suçunun failine para cezası takdir edilmiştir. İslâm hukukunda zinâ suçunun karşılığında had cezası olarak recm, celde veya sürgün cezaları öngörülürken; Osmanlı Devleti kânunnâmelerinde ta'zir olarak para cezasının takdir edilmesi, bizi böyle bir çalışmayı yapmaya sevketmiştir."
