abstract: "Borçlar Hukuku'na konu olan“borç ilişkisi”nden soyut bir hayat düşünülemez. İslam Hukuku açısından“borçların yerine getirilmesi”ilkesel düzeyde ele alınmış ve bu ilke Kuran-ı Kerim'de“Ey iman edenler! Yaptığınız akitleri yerine getirin (Maide, 1)”şeklindeki ilahi beyan ile vaz' edilmiştir. Borçlunun ifaya gücü yettiği halde borcunu yerine getirmemekte direnmesi halinde devletin yetkili cebri icra organlarınca onun cezalandırılmasının helal ve gerekli olduğu hususundaki hadisi şerif de konu ile ilgili içtihatların kaynağını teşkil eder. Borçlunun ifaya yetkili makamlar vasıtasıyla zorlanması konunun bir yönü iken ifanın gecikmesinin alacaklı açısından meydana getirdiği zarar ve bu zararın karşılanması diğer bir hukuki problemdir. İslam Hukukunda, borçlunun temerrüdü halinde anaparanın tahsilini sağlamaya ve alacaklı açısından ortaya çıkan zararın giderilmesine yönelik hukuki imkanlar ve borçluya uygulanabilecek cezalar üzerinde önemle durulmuştur. Bunlar ele alınırken İslam Hukuku'nun faiz yasağı ile karşılaşılmaktadır. Çalışmanın diğer yönü, borçlu temerrüdünün Türk Hukuku ile karşılaştırmalı olarak değerlendirilmesidir. TBK.m.117-126 hükümleri arasında düzenlenen borçlu temerrüdü borca aykırı davranış biçiminin özel bir türüdür. Borçlar Kanunu'na göre borçlu temerrüdünün yasal şartları şunlardan ibarettir: Borcun Muaccel olması ve ihtar. Anılan iki şart yasal düzeyde belirlenen koşullar olup, temerrüdün şartları bunlarla sınırlı değildir. İfanın mümkün olması, alacaklı tarafın ifayı kabule hazır bulunması da borçlunun temerrüdünün kabul edilen diğer şartlarıdır. Konuya ilişkin veriler, ikincil kaynaklardan derlenmek suretiyle Türk Hukuku ile karşılaştırmalı şekilde döküman analizi yöntemi ile değerlendirilmiştir. Çalışma üç bölüm şeklinde düzenlenmiştir. Birinci bölümde kavramsal analiz, ikinci bölümde Türk ve İslam Hukuku açısından yalnızca temerrüde ilişkin konular, sonuçları ile birlikte karşılaştırmalı olarak değerlendirilmiş ve son bölümde ise borcun geciktirilmesine bağlanan diğer sonuçlar üzerinde durulmuştur. Anahtar Kelimeler Borçlar Hukuku, İslam Hukuku, Borçlu Temerrüdü, Muaccel Borç, Faiz, Sözleşme."
