abstract: "İslam borçlar hukukunda riskin yerinin tespitini amaçlayan çalışmamızda bu çerçevede, riskin günümüzdeki kavramsal yapısı etimolojik olarak ortaya konmuş, ardından istatistik biliminin gelişimiyle başlayan dönüşümüne değinilmiştir. İslâm borçlar hukukunun önemli kaynakları olan klasik fıkıh literatüründeki anlamı tespit edilerek günümüzdeki anlamıyla arasında karşılaştırma yapılmıştır. Bu bağlamda risk, İslâm borçlar hukuku açısından yeniden yorumlanmıştır. Bu konuda klasik fıkıh literatüründe yer alan İslâm borçlar hukunun genel prensiplerinden ve günümüzde risk ile iligli çalışmalardan yararlanılmıştır. Bunun neticesinde akit teorisinde riskin meşruiyet zemini tespit edilmiştir. Son olarak riskin temininin İslâm borçlar hukuku açısından akit konusu olup olamayacağı tartışılmıştır. Bu konuda klasik fıkıh literatüründe kazuistik olarak ele alınmış meselelerden tümevarım yöntemi ile elde edilmiş akit ve mal teorisi çerçevesinde ele alınmıştır. Ayrıca riskin temini anlamına gelen İslâm hukundaki isimli veya isimsiz akitlere değinilmiştir. Ulaştığımız sonuç, riskin temininin akit konusu yapıldığı, yeni çıkan akit şekilleriyle yapılabileceğidir."
