abstract: "ÖZET Muteber veya geçersiz sayıldığına dair belirli bir delili bulunmayan manalara“maslahat-ı mürsele”, (içtihada bırakılmış maslahatlar) denir. Şâri ne bunlara uygun ne de bunların aksi yönünde hüküm koymuştur. Bir başka ifade ile hakkında delil olmayan durumlardır. İslâm hukukunda maslahat üç kısma ayrılır 1. Maslahat-ı mutebere 2. Maslahat-ı mulğa 3. Maslahat-ı mürsele İslâm hukukçuları maslahat-ı mürseleyi de zarurî, hâcî ve tahsînî olmak üzere üçe ayırırlar. Başta Hz. Ebu Bekir, Hz. Ömer, Hz. Osman ve Hz. Ali olmak üzere sahabenin maslahatla ilgili pek çok uygulaması olmuştur. Kur'an sahifelerinin bir mushafta toplanması, bir defada îka edilen üç talakın bir yerine üç talak olarak kabul edilmesi, Cuma için ikinci bir ezan ilâvesi hep maslahat düşüncesiyle verilmiş hükümlerdir. Usûl alimleri ibadetler ve mukadderatla (sayısı ve miktarı nas tarafından belirlenen muamelat) ilgili konularda mürsel maslahatlara göre amel edilemeyeceğinde ittifak etmişlerdir. Muamelelerde (ibadetler haricindeki hukuki münasebetlerde) maslahatların hüccet olup olmadığı, hüküm delillerinden bir delil olup olmadığı konusunda alimler ihtilaf etmişlerdir. Belli başlı hukuk doktrini kurucuları içinde maslahatı en geniş biçimde kullanan İmam Mâlik'tir. İmam Mâlik'i diğer imamlardan ayıran en belirgin özellik, kendisininmaslahatı başlı başına bir fıkıh kaynağı olarak görmesi ve gerek kendisinin gerekse öğrencilerin maslahata binaen pek çok hüküm vermeleridir. Maslahat-ı mürseleyi müstakil bir hukuk kaynağı olarak görmeyen Şafiiler ise maslahatı kıyas kapsamında değerlendirmişler, ıstıshab ve sedd-i zerayi prensipinden hareketle, nas, icma ve kıyasın kapsamına girmeyen olayları çözmeye çalımışlardır. Hanefî usulünde maslahat-ı mürselenin -Mâlikîlerde olduğu gibi- müstakil bir kaynak olarak görülmemesi, Hanefîlerin ıstıslahı, istihsan kapsamında değerlendirmelerinden kaynaklanmaktadır. Hanefîlerin maslahat sebebiyle istihsana dair verdikleri fetvalar incelendiğinde maslahat-ı mürselenin Hanefî mezhebinde de çok kullanılan bir kaynak olduğu görülecektir. Hanbelî hukukçu Necmüddin et-Tûfî'nin (ö. 716/1316) maslahatı, naslardan müstakil seri bir delil olarak görmesi bir yana bırakılırsa, Hanbelî mezhebinin de maslahat-ı mürseleyi delil olarak kabul edip bu prensibe göre fetva verdiği görülecektir."
