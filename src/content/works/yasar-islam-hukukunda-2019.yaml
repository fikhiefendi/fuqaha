abstract: "Son dönemde yapılan çalışmalar ışığında velâ müessesesinin varlığı, dayandığı temel ilkeler ve doğurduğu sonuçlar itibariyle günümüz sigorta kurumuna temel teşkil edecek bir mahiyet arz ettiği dile getirilmiştir. Bu sebeple hem Arap coğrafyası hem de ülkemiz bağlamında İslâm Hukuku'nun ortaya koyduğu“velâ akdi”, araştırmacıların ilgisini çekmiş ve günümüz sigorta anlayışı ile arasındaki benzerlik ve farklar irdelenmeye çalışılmıştır. Roma döneminde ve Câhiliye anlayışında vâr olan kölelik sisteminin İslâm ile birlikte insanlık için yararlı, mağduriyet oluşturmayan ve herşeyden önemlisi insana insan olduğu için değer veren bir yaklaşımla yaşattığı dönüşümün bir benzeri; ortaya çıkışı kölelik kurumu ile birlikte başlatılan“velâ müessesesi”için de söz konusu olmuştur. Bu bağlamda fıkıh,“velâ”ya dair önceki dönemlerdeki müesseseleri ve bunlara dair meseleleri ibkâ, ihyâ ve ilgâ prensipleri çerçevesinde değerlendirip Kur'ân ve sünnet ışığında hükme bağlamıştır. Söz konusu bu çalışmada klasik fıkıh eserleri bağlamında“velâ akdi”nin incelenmesinin yanı sıra Roma ve Câhiliye dönemleri ile mukâyese edilerek aralarındaki farklar tespit edilmiş, Batılı araştırmacıların İslâm Hukuku'ndaki velâ müessesesine dair görüş ve eleştirilerinin klasik fıkıh eserleri üzerinden bir analizi yapılmıştır."
