abstract: "ÖZET Osmanlı İmparatorluğu'nda sivil idarenin başı olan kadılar adlî ve idarî görevler üstlenmişlerdi. 15. y.y.'dan 17. y.y.'a kadar kadıların önemleri sürekli olarak arttı, adlî yönetimde daha fazla görevler üstlenmeye başladılar. Bu tezde 17. y.y.'a ait şeriyye sicilleri ve Şeyhülislam fetvaları ışığında kadıların görevleri genel olarak ve mahkeme prosedüründe kadıların görevleri daha detaylı bir şekilde incelenmektedir. Hukukî davaların görülmesindeki aşamalar, davaların nakli ve hükmün bozulması tezde detaylı olarak incelenen konulardır. Tezde incelenen davalar ışığında, Osmanlı mahkeme prosedürünün taraflı hükmü engelleyecek önceden belirlenmiş kurallara göre işlediği savunulabilir."
