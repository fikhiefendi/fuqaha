abstract: "Bu çalışma, Abbâsî Halifesi Hârûn Reşîd'e hitaben yazıldığı belirtilen ve Mâlik b. Enes'e nispet edilen Risâletü'l-İmâm Mâlik fi's-sünen ve'l-mevâi'z ve'l-âdâb adlı eseri konu edinmektedir. Eserde yer alan hadisler üzerinde tercüme, kaynak ve isnâd tespiti, sıhhat değerlendirmesi ile metinlerin farklı varyantlarının tespiti yapılmıştır. Çalışmada, eserin musannifi, yazılış amacı, içeriği ve metodu ele alınmış; Mâlik b. Enes'e aidiyeti isnâd tahlili, klasik âlim görüşleri ve diğer eserlerle karşılaştırma yöntemiyle değerlendirilmiştir. Hadisler, öncelikle Kütüb-i Sitte başta olmak üzere erken dönem hadis kaynaklarında taranmış, bulunmayan rivâyetler ise diğer hadis külliyatlarında araştırılmış; metin varyantları belirlenerek sıhhat durumları önde gelen hadis otoritelerine göre tespit edilmiştir."
