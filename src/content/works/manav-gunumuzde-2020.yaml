abstract: "Allah Resûlü'nün ifadesiyle İslâm'ın beş esasından biri olan zekât, aynı zamanda sosyal/ictimaî bir müessese olarak da varlığını sürdürmüştür. Fıkıh kitaplarının ibadetler (ibadât) bahsinde ele alınan zekât böylece ilmî geleneğin önemli meselelerinden biri olmuştur. Tarihî süreç içerisinde ticarî hayatın gelişmesi ve dönüşmesiyle yeni meseleler ortaya çıkmış, fıkıh bilginleri bunların çözümü için çaba sarf etmişlerdir. Ticarî hayatla ilgili tartışılan ve fakihlerin çözmesi gereken meselelerden biri de gayrimenkul mallar ve bunların zekâta tabi olup olmadığıdır.“Günümüzde Gayrimenkul Malların Zekâtı”konusunu ele aldığımız tezimizde genelden özele doğru bir yol izlenmiştir. Öncelikle zekât ve onunla bağlantılı kavramlara yer verilip kavramsal temellendirmeye gidilmiştir. Bu temellendirmeden sonra, gayrimenkul malların çeşitleri ve bu kapsama girecek mallar belirtilmiştir. Gayrimenkul kavramının günümüzdeki kapsamını belirlemede Türkiye'de yürürlükte olan modern vergi kanunları ve mevzuatından da istifade edilmiştir. Ayrıca gayrimenkul malların elde bulundurulma sebeplerine ve bir malın zekâta tabi olup olmadığını tayinde önemli bir unsur olan ticarîlik vasfına vurgu yapılmıştır. Bunun akabinde mükellefiyet ile ilgili olumlu ve olumsuz görüşler değerlendirilmiş ve tercihte bulunulmuştur. Tezimizde son olarak sermayenin hesaba katılıp katılmamasına göre gayrimenkullerden verilmesi gereken oranlar belirtilmiştir."
