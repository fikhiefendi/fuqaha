abstract: "Bu tez, İslâm hukukunun temel kaynaklarından biri olan sünnet ile amel-i ehl-i Medîne arasındaki ilişkiyi incelemektedir. Çalışma, giriş, dört ana bölüm, sonuç ve kaynakçadan oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi, kapsamı, problemi, yöntemi ve kullanılan kaynakların değerlendirmesi sunulmuştur. Birinci bölümde amel-i ehl-i Medîne kavramı tanımlanmış; tarihsel arka planı, çeşitleri, delil değeri ve diğer şer'î kaynaklarla ilişkisi ele alınmıştır. İkinci bölümde mâ cerâ bihî'l-amel çerçevesinde bu uygulamanın tarihsel ve coğrafi yansımaları incelenmiş; özellikle Endülüs, Kayrevân ve Fas merkezli Batı Mâlikîlerinin geliştirdiği teorik çerçeve ayrıntılı biçimde değerlendirilmiştir. Üçüncü bölümde İmam Mâlik'in fıkıh metodolojisinde amel-i ehl-i Medîne'nin konumu, sünnet anlayışı, âhâd haberler karşısındaki tutumu ve sünnet–örf ilişkisine yaklaşımı ele alınmıştır. Dördüncü bölümde ise amel-i ehl-i Medîne'nin ibadet ve muamelat alanındaki fıkhî meselelere etkisi incelenmiş; diğer mezheplerle ortaya çıkan görüş ayrılıkları değerlendirilmiştir. Sonuç bölümünde amel-i ehl-i Medîne'nin sünnetle güçlü bir bağ kurduğu ve İmam Mâlik'in içtihadında Medine halkının uygulamalarını esas aldığı tespit edilmiştir. Bu durum, sünnetin doğru anlaşılması ve uygulanması açısından pratik bir değer taşımış; ayrıca, Mâlikî mezhebinin fıkhî temelleri üzerinde etkili ve belirleyici bir kaynak olduğu sonucuna ulaşılmıştır."
