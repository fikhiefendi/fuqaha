abstract: "Bu çalışma, Avrupa'da İslam hukukunun resmi ve gayriresmi görünümlerini incelemekte ve Fransa örneği üzerinden uygulamadaki yansımalarını ele almaktadır. İslam hukukunun Avrupa'daki varlığı, özellikle aile hukuku alanında devletler özel hukuku kuralları ve kamu düzeni istisnası aracılığıyla gündeme gelmektedir. Buna ilaveten Müslüman azınlıklar için fıkhi bir otorite olma hedefiyle tesis edilen fıkhu'l-ekalliyyât bünyesinde verilen fetvalar, Avrupalı Müslümanların hukuki sorunları için üretilen çözümlerin bir başka boyutunu yansıtmaktadır. Hem resmi hem gayriresmi alanda yaşanan gelişmelerle birlikte İslam'ın Avrupa'ya özgü bir sosyolojisi olarak tanımlanabilecek“Avrupa İslamı”kavramı ortaya çıkmıştır. Fransa'da özellikle 1980'li yıllardan itibaren Müslümanların artan kamusal görünümü Fransız devletinin İslam diniyle kurumsal boyutta ilişki kurmasını gerekli kılmış, bu hedefe yönelik atılan adımlar Fransız laikliğini sınamış ve dönüştürmüştür. Bu dönüşümle birlikte Avrupa İslamına benzer şekilde Fransa İslamı gündeme gelmiştir. İslam'ın ve İslam hukukunun Fransız hukukuyla etkileşimi ise özellikle aile hukuku alanındaki uyuşmazlıkları beraberinde getirmiştir. İslam hukuku yabancı hukuk olarak sınırlı bir şekilde uygulanabilse de talak ve çok eşlilik gibi pratikler kamu düzeni istisnası sebebiyle büyük oranda reddedilmektedir. Fransız ulusal hukukunun dini normları tanıması ise daha ziyade İslami finans uygulamalarında söz konusu olmaktadır. Fıkhu'l-ekalliyyât ise Avrupalı Müslümanlar özelinde verdiği fetvalarla hem Avrupa hem Fransa için sınırlı bir işlevselliğe sahiptir."
