abstract: "Osmanlı Devleti'nin klasik dönemdeki idari yapılanması 19. yyda da devam etmiştir. Osmanlı ülkesi idari birim olarak beylerbeylik, sancaklar ve kazalara ayrılmıştır. Sancak ve kazaların sosyal, dini, hukuki ve idari konularla ilgili meseleleri, kadıların sorumlulukları arasında idi. Kadılar şer'i ve hükmi muamelatta, kendilerine verilen beratta gösterilen vazifeleri görüp, Hanefi mezhebi üzerine karar verirlerdi. Araştırmamızın konusu olan Malatya'nın 167 Nolu Kadı Sicili, 1917 senesini kapsamaktadır. Bu tarihte Malatya Osmanlı devletinin sancağıdır. 167 Nolu Malatya Kadı Sicilinin 1-100 sayfaları arasındaki kısım araştırma konumuzdur.1917 yılındaki kadı sicilinde Malatya'daki miras, ölüm, mehr, boşanma, borç, vekâlet gibi konular geçmektedir.Belgelerde dikkat çeken bir husus gayrimüslim halk ile Müslüman teb'a ilişkilerinin iç içe geçmiş olmasıdır. Bu durum Osmanlı medeniyetinin dini yapısındaki farklı kesimlere adaletle hükmeden ve hoşgören tutumunu bir kez daha ortaya koymaktadır."
