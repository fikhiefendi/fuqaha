abstract: "Bu çalışmamda Hanefi mezhebi bağlamında dava bahsiyle ilgili bazı önemli hükümleri İmam Ebû Hanîfe ve İmam Ebû Yûsuf arasındaki tartışmalı meseleleri merkeze alarak inceledim. Çalışmama, Ebu Hanîfe ve İmam Ebû Yûsuf'un hayatlarının kısa özetlerine yer vererek başladım ve araştırmam için önemli olan noktalara temas ettim. Daha sonra Hanefi mezhebindeki muteber kitaplardaki ihtilaflı meseleleri anlattım ve alimlerin sınıflandırma metodunu dikkate alarak mezkûr meseleleri aralarındaki benzerlikler üzerinden yedi kısma ayırdım. Öncelikle çalışmanın zeminini oluşturmak için meselelerin ittifak ve ihtilaf edilen noktalarını içerek şekilde meselelerin sunumunu yapıp ardından ihtilaf mahallini, iki imamın görüşlerini ve delillerini zikrettim. Ardından delilleri karşılaştırıp doğru olduğunu düşündüğüm görüşleri tercih ettim. Devamında mezhep imamlarının tercihleri varsa onları zikrettim ve yer yer Mecelle-i Ahkâm-ı Adliyye'nin tercihlerine maddelerini işaret ederek yer verdim. Son olarak konuyu çalışanlar için önemli olduğunu düşündüğüm konuyla ilgili olan bazı meselelere ve değerlendirmelere yer verdim ve araştırmam neticesinde ulaştığım sonuçları zikrederek bazı önerilerde bulundum."
