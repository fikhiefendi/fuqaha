abstract: "Hanefî fıkıh literatüründe“İmâmeyn”lakabıyla bilinen Ebû Yûsuf ve Muhammed b. Hasan eş-Şeybânî, kendisine mezhep nispet edilen Ebû Hanîfe'den sonra Hanefî mezhebinin teşekkülü, yayılması ve günümüze kadar ulaşmasında kilit rol oynamışlardır. Hanefî mezhebinde Ebû Hanîfe, Ebû Yûsuf ve İmam Muhammed'in birçok meselede ihtilaf ettikleri bilinen bir husustur. Bu ihtilaflar, İslam hukuk literatürünün zenginleşmesi ve hukukî çoğulculuk açısından önem arz ederken, öte yandan hukuki istikrarı sağlama ve mezhepte müftâ bih görüşü belirleme açısından kaçınılmaz olarak bazı zorluklar neden olmaktadır. Bu bağlamda İmâmeyn'in görüşlerinin mezhep kapsamında değerlendirilmesi ve görüşlerinin müftâ bih olarak kabul edilmesinin gerekçelendirilmesi, tarih boyunca Hanefî fakihlerin temel uğraş alanlarından olmuştur. İmâmeyn'in görüşlerinin müftâ bih olduğu meselelere bakıldığında tercihin belli bir usule göre yapıldığı ve bu usule riayet edildiğinde mezhep yapılanmasının canlı ve dinamik bir yapı olduğu görülecektir. Hanefî mezhebinde Ebû Hanîfe'nin hilafına İmâmeyn'in görüşlerinin müftâ bih olduğu meselelerin tahlil edileceği bu çalışmada mezhep içi tercih bakımından İmâmeyn'in konumu ele alınmıştır. Bu amaçla mezhep kavramının tanımı, mezhep içi tercih, müftâ bih görüşün bağlayıcılığı, İmâmeyn'in Ebû Hanîfe'ye muhalif olan görüşlerinin mezhep kapsamında değerlendirmesi problemi ve İmâmeyn'in ictihad seviyesi ele alınmıştır. Daha sonra Münakehâtla alakalı Ebû Hanîfe'nin hilafına İmâmeyn'in görüşlerinin müftâ bih olduğu meseleler tahlil edilmiştir. Burada ilgili meselelerin birçok Hanefî fıkıh eserinde nasıl ele alındığı, ihtilafta tarafların görüşlerinin nasıl gerekçelendirildiği ve tarihî süreçte hangi görüşün nasıl müftâ bih hale geldiği incelenmiştir. Son olarak bir değerlendirilme yapılmış ve varılan sonuçlara yer verilmiştir."
