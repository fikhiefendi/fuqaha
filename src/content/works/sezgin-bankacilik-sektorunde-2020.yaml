abstract: "Bankacılık sektöründe karlılık konusu, sektörün ayakta kalabilmesinde önemli bir etken olarak ortaya çıkmaktadır. Banka türlerine göre farklılık gösteren karlılık unsuru, bu çalışmada banka türleri için karşılaştırmalı olarak değerlendirilmiştir. Analize dahil edilen bankalar; ticari bankalar ve katılım bankaları arasından seçilmiş olanlardır. Ticari bankalar için 2010-2017 aralığındaki dönem; Katılım bankaları için ise, 2010-2018 yılları arasındaki dönem ele alınmıştır. Ticari bankaların 2018 yılına ait verilerine ulaşılmadığı için bu yılın verileri analiz edilememiştir. Ayrıca; katılım bankalarının sektörde çok yeni olmalarından ötürü de bu yıla ait verileri analize dahil edilmiştir. Ticari bankalar sınıfındaki Özel Sermayeli Bankalardan; Akbank, Anadolubank, Şekerbank, Turkish Bank, Türk Ekonomi Bankası, Türkiye İş Bankası ve Yapı ve Kredi Bankası analiz edilmiştir. Yabancı Sermayeli Bankalardan; Arap Türk Bankası, Deniz Bank, Finans Bank, HSBC, Citibank, Deuscthe Bank ve Kamu Sermayeli Bankalar da Vakıfbank, Halkbank ve Ziraat Bankası analiz edilmiştir. Çalışmada analize dahil edilen Katılım Bankaları ise; Albaraka Türk Katılım, Türkiye Finans Katılım, Vakıf Katılım ve Ziraat Katılım Bankalarıdır. Bu çalışmanın amacı; banka türlerinin verilen dönemdeki karlılık performanslarını etkileyen faktörlerin tespit edilmesidir. Analiz edilecek bankalarla ilgili veriler; Türkiye Bankalar Birliği (TBB) ve Türkiye Katılım Bankaları Birliği'nden (TKBB) alınmıştır, Çalışmada; bankaların karlılık ölçümü için parametrik olmayan regresyon yöntemlerinden biri olan MARS ® (Multivariate Adaptive Regression Splines) yöntemi kullanılmıştır. Bu yöntem; bir bağımlı değişken ve bağımsız değişkenler arasındaki ilişkiyi belirleyebilmek için kullanılmaktadır. Çalışmadaki bağımlı değişkenler; Aktif Karlılık (ROA) ve Özkaynak Karlılığı (ROE) olarak belirlenmiştir. Bağımsız değişkenler ise; Şube Başına Aktif (AKTIF_SUBE), Şube Başına Mevduat (MEVD_SUBE), Şube Başına Kredi (KRD_SUBE) ve Şube Başına Net kar Oranı (NETKAR_SUBE), Personel Başına Aktif (AKTF_PERS), Personel Başına Mevduat (MEVD_PERS), Personel Başına Kredi (KRD_PERS) ve Personel Başına Net Kar (NETKAR_PERS) şeklindedir. Analiz sonucunda ROA bağımlı değişkeninin iki banka grubu açısından farklı sonuçlar ortaya koyduğu belirlenmiştir. Özellikle modeldeki anlamlı değişken sayısına bakıldığında ticari bankaların katılım bankalarına göre daha fazla değişkeni anlamlı olarak bulunmuştur. Katılım bankalarında ise yalnızca iki adet anlamlı değişken bulunmuştur. Ticari bankaların ROA bağımlı değişkenine göre analizi sonucunda; (NETKAR_PERS), (NETKAR_SUBE), (KRD_SUBE) ve (MEVD_PERS) değişkenleri istatistiki açıdan anlamlı bulunmuştur. Ticari bankaların ROE bağımlı değişkenine göre anlamlı değişkenleri; NETKAR_PERS, NETKAR_SUBE, AKTF_SUBE ve KRD_PERS olarak bulunmuştur. Katılım Bankalarının ROA değeri açısından bakıldığında; MEVD_PERS ve NETKAR_PERS değişkenleri yüksek oranda anlamlı çıkmıştır. Katılım Bankalarının ROE bağımlı değişkeni için analiz gerçekleştirildiğinde ise; KRD_PERS ve AKTF_SUBE değişkenleri; modeli istatistiki olarak açıklayabilen anlamlı değişkenler olarak bulunmuşlardır."
