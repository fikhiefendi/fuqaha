abstract: "Bu çalışmada Türkiye'deki katılım bankacılığı sektörü ile dünyada öncü nitelikte olan Malezya'daki İslam bankacılığı sektörünün, etkinlik, verimlilik ve performans özellikleri açısından değerlendirilmesi amaçlanmaktadır. Bu amaca yönelik olarak hızla gelişen İslam bankacılığı ve katılım bankacılığı sektörleri araştırılmış, İslam bankacılığı, faizsiz bankacılık ve katılım bankacılığı kavramları açıklanmış, sektörün faaliyet yapısı ve gelişimi incelenerek Türkiye ve Malezya arasında karşılaştırma yapılmıştır. Analizler 2008-2012 yılları arasındaki beş yıllık dönem üzerinden gerçekleştirilmiştir. Bankaların ekinlik düzeylerinin belirlenmesinde veri zarflama analizi (Data Envelopment Analysis-DEA) kullanılmış olup, yıllar itibariyle toplam faktör verimliliği, malmquist toplam faktör verimliliği endeksi aracılığıyla belirlenmiştir. Bankalar arasındaki performans seviyeleri ise TOPSIS yönteminden yararlanılarak tespit edilmiştir. Elde dilen bulgular ışığında, Türkiye'deki katılım bankacılığı sektörünün dünyadaki konumu hakkında fikir edinilmesi olanaklı olacaktır."
