abstract: "Bireysel emeklilik ile kişiler, emeklilik öncesi dönemde yaptıkları tasarrufları uzun vadeli yatırımlara yönlendirmekte ve böylece emeklilik dönemlerinde ek gelir elde etmektedirler. Ülkemizde bireysel emeklilik gönüllülük esasına dayanmaktadır. Kişilerin birikimleri, emeklilik şirketleri tarafından yönetilen emeklilik fonlarında değerlendirilmektedir. Ülkemizde, bireysel emeklilik faaliyetlerine sosyal güvenlik sisteminin yükünü azaltmak amacıyla 2003 yılında başlanmıştır. Söz konusu faaliyetler, sisteme alternatif olarak değil sistemi tamamlamak üzere kurgulanmıştır. Bireysel emeklilik faaliyetlerinin daha geniş kitlelere yayılabilmesi için faiz hassasiyeti bulunan kişilerin sisteme dâhil edilmesi amaçlanmış ve bu doğrultuda 2008 yılında mevzuat değişiklikleri yapılmıştır. Bahse konu değişiklikler neticesinde katılım emeklilik sistemi ülkemizde faaliyet göstermeye başlamış, faiz hassasiyeti nedeniyle yastık altında duran fonlar sisteme aktarılmış ve daha çok kişinin bireysel emeklilik sisteminden yararlanabilmesine olanak sağlanmıştır. Bu çalışmanın amacı, 2017 Ocak - 2021 Haziran (4,5 yıllık) döneminde kesintisiz faaliyet gösteren“Gönüllü Emeklilik Fonlar”dâhilindeki, faizli ve faizsiz fonların, fon grupları bazında, performanslarını çeşitli ölçüm tekniklerinden yararlanarak ölçmek ve karşılaştırmalı analizlerini yapmaktır. Çalışma sonucunda, katılım emeklilik fonlarının ülkemizde hızlı bir büyüme gösterdiği ancak faizli emeklilik fonlarına kıyasla katılımcılarına daha az portföy çeşitliliği sunduğu tespit edilmiştir. Fon sayılarına ve büyüklüklerine bakıldığında faizli fonların faizsizlere kıyasla daha fazla olduğu görülmüştür. Çalışmada incelenen fonların getirileri, yıllık ve kümülatif 4,5 yıllık dönemde 6 ayrı fon grubu için incelenmiştir. 4,5 yıllık dönemde, altın fonları dışında tüm gruplarda faizsiz fonların ortalama getirilerinin faizlilere göre daha yüksek olduğu tespit edilmiştir. Çalışma kapsamında, fonlar ayrıca üç risk seviyesine göre ayrılarak da incelenmiştir. İncelenen dönem aralığında, tüm risk gruplarında, faizsiz fonların faizlilere göre ortalamada daha iyi getiri sağladığı gözlemlenmiştir. En yüksek getiriyi yüksek riskli grupların sağladığı, ortalama en düşük getirinin ise orta düzeyde risk alan faizli fonlara ait olduğu tespit edilmiştir. Mevzuat gereği, katılımcıların fon dağılım değişikliği ve emeklilik şirketi değiştirme hakları bulunmaktadır. Katılımcılar, fon seçiminde piyasa koşullarına göre pozisyon alabilmektedirler. Fonları, yalnızca geçmiş getiri performanslarına göre değerlendirmek yetersiz kalmaktadır. Fonların performansını ölçmek için literatürde çeşitli yöntemler bulunmaktadır. Çalışma kapsamında, fonların“Sharpe Ölçütü”,“Treynor Ölçütü”ve“Jensens (Alfa) Ölçütü”kullanılarak detaylı performans analizleri yapılmıştır. Çalışmanın son kısmında, emeklilik şirketleri, risk grupları bazında;“Getiri”,“Sharpe”,“Treynor”ve“Jensens (Alfa)”ölçümlerine göre puanlanmıştır. Fonların yıllık puanları, hacimleri ile ağırlıklandırılmış ve şirketlerin nihai puanları oluşturulmuştur."
