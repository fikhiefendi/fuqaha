abstract: "Osmanlı Tarihi araştırmalarında şer'îyye sicillerinin önemi büyüktür. Bu kayıtlar yaşanmış hayatların somut verileri oldukları için kaydedildiği dönem ve yer hakkında sosyal, kültürel, idarî, hukûkî ve demografik açılardan ciddi bir bilgi kaynağı konumundadırlar. İncelenen siciller idârî yapı, mahalleler, köyler, içtimâi durum, ticari vaziyet, esnaf, kullanılan eşyalar, gibi pek çok konuda bilgi vermektedir. 1015-1016 (1606-1607) yıllarına ait 32 No'lu Galata Şer'îyye Sicilinde 276 adet belge bulunmaktadır. Araştırmamızda bu döneme ait bilgileri ortaya çıkarmaya ve değerlendirmeye gayret ettik. Çalışmamız Giriş Bölümünden sonra dört bölümden meydana gelmiştir. Giriş bölümünde Osmanlı Devleti'nde Şer'îyye Sicilleri ve Tarihi Öneminden bahsedilerek, 32 No'lu Şer'îyye Sicili'nin Kaynak Tanıtımı yapılmıştır. Diğer dört bölümde ise Galata sosyal, idarî, ekonomik ve hukûkî alanlar açısından incelenmeye gayret edilmiştir."
