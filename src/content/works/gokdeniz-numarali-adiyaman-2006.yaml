abstract: "ÖZETYÜKSEK LİSANS TEZİ262 NUMARALI HISN-I MANSÛR (ADIYAMAN) KADI SİCİLİNİNTRANSKRİPSİYONU VE DEĞERLENDİRİLMESİÖmer Faruk GÖKDENİZKSÜSOSYAL BİLİMLER ENSTİTÜSÜTARİH ANABİLİM DALIDANIŞMAN: Yrd. Doç. Dr. Faruk SÖYLEMEZYIL : 2006, Sayfa: 225Jüri : Yrd. Doç. Dr. Faruk SÖYLEMEZDoç. Dr. Ahmet EYİCİLYrd. Doç. Dr. Mevlüt ERDEMTürk tarihinin önemli belgelerinden olan kadı sicilleri, şehir tarihlerininyazılmasında da önemli kaynaklardandır. Bu çalışma, 1899-1900 yılları arasındakiAdıyaman tarihinin ekonomik, sosyo-kültürel, iktisadû, idarû ve hukukû yönleriniaraştırmacıların istifadesine sunmak amacıyla yapılmıştır.Osmanlı dönemindeki Adıyaman araştırılırken, kadı sicillerine mürâcaatedilmeden yapılan çalışmalar eksik kalacaktır. Bu nedenle, yapılan çalışmada, kadısicillerinin tanımı, tarihi, Şer'iye Mahkemeleri'nde görevli memurlar, kadılarda arananşartlar, Adıyaman'ın tarihi ve Osmanlı dönemindeki Adıyaman konuları hakkındakibilgiler araştırmanın içeriğine dâhil edildi.Bu çalışmada, 262 numaralı Hısn-ı MansÃ»r kadı sicilinin 1-136. sayfalarındaki126 belgenin transkripsiyonu ve özeti yapıldı. Belgelerin deftere kaydında, kronolojiksıraya genel olarak uyulmamıştır. Bu belgelere dayanarak Adıyaman'ın XX.yy.başlarındaki idarû, sosyo-ekonomik, hukukû ve kültürel durumu hakkında tahlilleryapılmaya çalışılmıştır.Çalışmadaki toplam 126 belgenin içeriğinde darp, yaralama, hakaret, hırsızlık,ziraat ürünlerinin tahrib edilmesi, haneye tecavüz, rüşvet alma, zina, emre karşı gelme,emanete uygun davranmama, izinsiz nikah akdetme, dolandırıcılık, devlet arazisinikullanma gibi konular bulunmaktır. Bunlar içerisinde darb ve hakaret davalarıbelgelerin yarıdan fazlasını oluşturmaktadır.Anahtar kelimeler; Adıyaman, Kadı Sicili, Hısn-ı MansÃ»r, Şer'iye Mahkemesi.1"
