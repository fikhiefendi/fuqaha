abstract: "Bu çalışma, tam adı Ebû Abdillâh Muhammed b. Ahmed b. Ebî Bekr b. Ferh el-Kurtubî'nin (ö. 671/1273)“el-Câmi' li Ahkâmi'l-Kur'ân ve'l-Mübeyyinü limâ Tazammenehû mine's-Sünneti ve Âyi'l-Furkân”tefsirinin filolojik açıdan incelenmesini içerir. Filoloji bazı bilimlerden faydalanarak metinleri anlamaya çalışır. Kurtubî de Kur'ân ayetlerini açıklarken sözlükbilim, dilbilim ve söz sanatlarına dair açıklamalar yapar. Bu sebeple tefsirin dil yönü güçlüdür. Kurtubî, Kur'ân kelimeleriyle yabancı diller arasındaki münasebetleri inceler. O, Arap dilinin lehçeleriyle bağlantılarını inceler. Kelimelerin anlam analizlerini yapar ve kelimeleri anlam ilişkileri yönüyle ele alır. Aynı zamanda müphem lafızların (هو, هذا, الذي gibi) ifade ettikleri manaları konu edinir. Müellif ayetlerin i'râbı, Kur'ân kelimelerinin morfolojik tahliline dair birçok görüşü okuyucu ile buluşturmayı, bu görüşleri değerlendirmeyi ve kendi görüşlerini aktarmayı uygun görür. Ayrıca bu tahlillerin manaya etkisini de aktarır. Kurtubî nahiv ekollerinin görüşleri üzerine değerlendirmeler yapar ve tercihlerde bulunur. Ayetlerde yer alan söz sanatları hakkında açıklamalar yapan müfessir, Arap diline ait kavramları hem özel bağlamlarında hem de bu bağlamların dışında kullanır. Çalışma üç bölümden oluşur. Tefsir birinci bölümde sözlükbilim açısından, ikinci bölümde sarf-nahiv yönüyle ve üçüncü bölümde söz sanatları bağlamında incelenir."
