abstract: "Osmanlı Devleti'nde bir mukataanın ömür boyu iltizama verilmesini ifade eden malikâne uygulaması 1695 yılında yayınlanan bir fermanla uygulamaya konulmuştur. Bu uygulama ile malikâne sahipleri mülkiyetleri altında olmadığı halde mülkleriymişçesine tasarruf edebilecekleri bir gelir kaynağı elde etmişlerdir. Bu çalışma malikâne uygulamasının tarihi ve hukuki temellerini araştırmaktadır. Araştırmanın çıkış noktası sistemi ortaya koyan fermanın, malikânenin istihsânen kabul edilmiş olup meşruiyetini ihtiyaçtan ve Mısır'daki iltizam uygulamalarından yani örften aldığına dair ifadeleridir. Fermanda Mısır'daki mukataalar iltizama verilirken mültezimlerden hulvân adı verilen ve malikâne uygulamasındaki muacceleye benzeyen bir meblağ alındığı ifade edilmiştir. Çalışmada Mısır'daki iltizam uygulamasının özellikleri tespit edilerek malikâne sistemiyle olan benzerlikleri ortaya konulmaya çalışılmıştır. Mısır iltizamları Osmanlı merkez topraklarından farklı olarak vergi tahsil hakkıyla sınırlı olmayıp mültezim o bölgenin idarecisi konumundadır. İltizam hakkı mültezim ölene kadar elinden alınmayıp öldüğünde ailesi veya memlükleri tarafından devralınabilmektedir. İltizamı üstlenmek için hulvân adı verilen ödeme yapılmaktadır. Mısır valisinin yerel güçler karşısında zayıfladığı dönemlerde hulvân Mısır'da Osmanlı idaresinin sürdüğünün bir göstergesi olarak kabul edilmiştir. İslam hukuk ve devlet geleneğinde malikâne benzeri uygulamalara bakıldığında ise kabâle veya damân uygulaması dikkat çekicidir. Ayrıca Osmanlı şeyhülislamlarının iltizamı hükümsüz bir akit olarak tasavvur ettiği görülmüştür. Son olarak Osmanlı'da kişiye geniş tasarruf hakkı sağlayan uygulamalar incelenerek malikâneyle olan benzerlikleri ortaya konulmuş, bunlar arasında icâreteyn uygulaması dikkat çekmiştir. Netice itibariyle malikâne sisteminin kaynağını çok eskiden beri Mısır'da uygulanan iltizam sisteminden aldığı ve malikânenin şeyhülislamın da onayıyla maslahat ve Mısır örfüne binaen müstahsen görülerek kabul edildiği söylenebilir."
