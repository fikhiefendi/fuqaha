abstract: "Bu çalışma, Osmanlı mali sisteminde mukataa kurumu üzerinden yürütülen iç borçlanma araçlarından biri olan esham uygulamasını; tarafların hak ve sorumlulukları bağlamında ele almaktadır. Mukataa, Osmanlı'nın merkezi gelir sisteminde önemli yere sahip olan bir gelir yönetim mekanizmasıdır. Bu sistemin içinde iltizam uygulaması ile kısmen başlayan iç borçlanma süreci, 1695'te malikane ve 1775'te esham uygulamalarının devreye girmesiyle daha sofistike bir yapıya bürünmüştür. Çalışmanın ilk bölümünde eshamın öncülleri olan iltizam ve malikâne uygulamalarına değinilerek esham uygulamasının Osmanlı maliyesi içindeki yeri ve dönüşümü incelenmiştir. İkinci bölümde esham uygulamasının zaman içerisinde geçirdiği dönüşümler; evrak-ı nakdiyye, evladiyet şurutlu esham ve eshamı mümtaze gibi esham çeşitlerine değinilmiştir. Son bölümde ise klasik esham (1775-1840) olarak adlandırabileceğimiz, uygulamanın ilk hali odağa alınmış; uygulamanın hukuki niteliği, işleyişi, taraflara sağladığı hak ve sorumluluklar incelenmiştir. Bu bağlamda uygulamanın işleyişi esnasında karşılaşılan hukuki ve mali düzenlemeler ile devletin uygulamadan elde ettiği gelirlerin kanalize edildiği alanlara değinilmiştir Araştırmada öncelikle Osmanlı arşiv belgeleri olmak üzere, döneme ait maliye kayıtları ve ilmî literatürden yararlanılmıştır. Devlet, esham uygulaması sayesinde savaşlar ve mali buhranlar gibi dönemsel zorluklarda acil nakit ihtiyacını karşılamıştır. Ancak uzun süreli sabit gelir vaadi, mukataa verimindeki düşüş ve savaşlar gibi etkenler sistemin sürdürülebilirliğini zayıflatmıştır. Bununla birlikte esham, Osmanlı'da kağıt paraya geçiş ve tahvil benzeri uygulamaların zeminini hazırlaması bakımından mühim bir örnektir. Çalışmada sunulacak bulguların; eshamla alakalı literatürde bulunan malumatı bir adım ileriye taşıması ve konuya dair gelecekte yapılacak çalışmalara destekleyici olması amaçlanmaktadır."
