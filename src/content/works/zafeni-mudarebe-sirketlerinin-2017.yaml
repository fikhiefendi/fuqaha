abstract: "Bu tez çalışması mudarabe şirketi akitlerinin tanıtılması ve İslami şirketler kapsamında en önemli şirketlerden biri olan mudaraba şirketi tanıtma hedefi bulunmaktadır.Aynı zamanda bu çalışma inceleme yaparken her türlü bulunması gereken tüm bilgileri bulundurduğundan, sonraki çalışmalara kaynaklık etmesini Rabbimizden niyaz ederiz.Çalışmayı sunarken sadece Fikhi Mudarebe türüne bakarak Kudemanın fıkıh kitaplarından başka yöntemlerede bu şirket türü altında sahih akitler ve batıl akitlere yeni bankacılık yöntemi türünde açıklık getirilmiştir.Bu tür şirketleri engelleyici uygulamaları ve bazı çözüm önerilerini sunmaktadır. Bu hedeflere ulaşmak için araştırmacı tez ve kitapları gözden geçirmiş ve mudarebe şirketi ile alakalı eski ve yeni tüm verileri serd etmeye uğraşmış ve sadece yayınlanmış eserler dairesinde durmamış yeni yayımlanan mevsu'at el zeheb gibi kaynaklara ulaşmış ve görüşme tekniklerini kullanarak uzmanlarla görüşmüştür.Aynı zamanda toplumun İslam bankacılığının uygulamalarından toplumun ne kadar bilinçli olduğunu görüşmelerle test etmiştir.Öze ulaşmak için taramaları yapmıştır.. Bu çalışmanın sonunda mudarebe şirketinin akitlerinin başka şirket türleri içinde önemli bir yere sahip olduğu fikrine ulaşılmıştır. Çünkü birden çok muamele türünü barındırmaktadır .Aynı zamanda İslam Bankacığı(Katılım Bankacılığı) ile mudarebe akitleri arasında güçlü bağlar olduğu fikrine ulaşılmasından dolayı faize ve haram olan yöntemlere karşı bir çözüm üretmektedir.Toplumun bu akit türüne teveccühünden dolayı katılım bankaları üzerine düşmüştür.Bu tür akitler uygulanması kolay ve islam şeriatı ile uyuştuğunu görülmektedir.Aynı zamanda mudarebe şirketi akitlerin işsizliği ve dilenmenin çözümü olarak iş imkanları sunması ve deneyimli bireylerin katkı sunmasıyla bu akit türlerinin kolayca uygulanamsı ve geliştirilir olması çağımıza sunulacak bir çözüm önerisini beraberinde getirir. Araştırmacı bu tür akitlerin uygulanamasının kapasitesi ve kolay oluşundan ötürü tüm islami bankalarında (katılım bankalar) bu konuya daha çok eğilmesini, aynı zamanda bu tür işlemlerin denetimini yapmak için şerii denetim kurumlarının oluşturulmasını ve kararların çıkartılmasını ve bu tür bankalarda geçerli olması gerektiğini altını çizer.Diğer yönden Anayasasında Müslüman ibaresi bulunan ülkelerde kanunların İslamın ululuğunu ve adalet yapısını daha çok göstermek için İslam İktisadı için gerekli altyapıyı oluşturmasını ve öğrencilerin bu konularda akademik gelişmelerde bulunmasını, bankalarda işler durumda oluşturmasını aksine işlem uygulayanların cezalandırılmasını aynı zamanda akademik çalışmaların İslamın görüşünü benimseyen devletlerin İslam İktisadı nizamını devletlerinde faizle işlemeyen İslam Merkez Bankası fikrini oluşturmaları gerektiğini faizden sakınmamızı emreden Yüce Kitabımızda el-Bakara suresi 275 ayetinde (وأحل الله البيع وحرم الربا) (Allah, alışverişi helâl, faizi haram kılmıştır) buyrulmuştur.Son olarak ararştırmacı tezinde İslam İktisadı sisteminin geliştirilmesinin bu akid sistemlerinin günümüz ihtiyaçlarına cevap verir olması konumuyla dünyaya mazlumların haklarını koruyuculuğu ile cevap vereceğini savunur."
