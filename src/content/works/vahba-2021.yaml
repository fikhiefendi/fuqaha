abstract: "Hastalığın bu dünyadaki Allah'ın kanunlarından biri olduğu ve yaşayan her insan üzerinde sabit ve geçeren olan gerçeklerden hareketle, bu tez, İslam'da hastalığın evrelerini ve faydalarını gözden geçirerek, davranış ve hastalığın İslami kavramdaki anlamını tanımlamaya geldi. Hasta Müslümanı bilgilendirmeyi ve hastalık halinde onu İslam şeriatının hükümlerine uygun yasal davranışa yönlendirmeyi amaçlayan, Bu tezin hasta Müslümanın meşru davranışlarını böldüğü yer: Vacib Davranışlar, Mustehab Davranışları, Haram davranışları, Mekruh davranışları, ve Mubah davranışları. Peygamber'den gelen sahih hadislere dayanmaktadır. Tanımlayıcı, analitik, tümevarımsal ve ampirik bir yaklaşımla tartışıldı. Bu, Rasûlullah (s.a.v.)'in hidayetini bilmek ve hastalık halinde onun sünnetine uymayı yanı sıra."
