abstract: "Daha sonra doldurulDOKTORA TEZİ DİNÎ LİTERALİZMİN ODAĞINDAKİ İMAM ŞÂFİÎ'DE LAFZÎ VE GÂÎ YORUM Muhammet BAĞÇİVAN Tez Danışmanı: Prof. Dr. Ali İhsan PALA 2024, 523 Sayfa Jüri: Prof. Dr. Ali İhsan PALA Prof. Dr. Davut YAYLALI Prof. Dr. Mehmet ERDEM Prof. Dr. Osman ŞAHİN Doç. Dr. Mehmet GÖKTAŞ Bu tezin amacı; modern dönemde literalist yaklaşıma sahip olduğu ileri sürülen İmam Şâfiî'nin, lafzî ve gâî yoruma başvurduğu meseleleri tespit ve tahlil etmektir. Bu gaye doğrultusunda girişte çalışmayla ilgili genel bilgilerin yanı sıra Şâfiî'nin hayatı ve kaleme aldığı eserlere dair bilgiler verilmiştir. Birinci bölümde Şâfiî'nin literal yorumda bulunduğu meseleler irdelenmiş; ikinci bölümde ise gâî yoruma ilişkin teorik düzeydeki açıklamaları ve bu kapsamda fürû-i fıkha dair değerlendirmeleri diğer fıkıh ekolleriyle karşılaştırmalı olarak ele alınmıştır. Tezimizde vardığımız sonuca göre diğer fukahâ gibi Şâfiî de lafız eksenli yorumlarda bulunmuştur. Onun lafza bağlı yorum yaptığı meselelerin önemli bir kısmında ehl-i re'y dâhil âlimlerin çoğunluğunun Şâfiî'yle benzer kanaatlere sahip olduğu görülmektedir. Gâî yorum ekseninde Şâfiî; te'vîl, istidlâl, maʻkûl ve kıyas başta olmak üzere birçok yöntemi kullanmıştır. Ehl-i re'y temsilcilerinin taabbudî olarak değerlendirdiği kimi konularda dahi taʻlîle giderek kıyas yapmış ve gâî yoruma başvurmuştur. Şâfiî'nin salt zâhirî ya da bâtınî şeklinde iki zıt kutuptan birinde konumlandırılamayacak derecede hem lafzı hem de gayeyi dikkate alan ve gâî yoruma daha yakın bir hukukçu olduğu tespit edilmiştir. acaktır."
