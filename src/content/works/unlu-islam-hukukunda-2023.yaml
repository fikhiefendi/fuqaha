abstract: "Tahkim, pek çok ülkede uygulanan alternatif bir uyuşmazlık çözüm yöntemidir. Tez klasik fıkıhta tahkimin yeri ile tahkime ilişkin güncel tarafları bulunan bazı meseleleri ele almaktadır. Tez iki ana bölümden meydana gelmektedir. İlk bölümde tahkimin teorik kısmı ele alınmıştır. Tahkim tanımı, çeşitleri, tarihçesi, Türk hukuk sisteminde tahkimin yeri, tahkimin fıkhî mahiyet ve meşruiyeti, tahkim şartları, hakeme ilişkin meseleler, tahkime konu olan alanlar, tahkimin hükmü, tahkimin sonlandırılması, icrâsı ve temyizi ilk bölümde ele alınan temel hususlardır. İkinci bölümde tahkimin müspet ve menfi yönleri, tahkimin kurumsal yönden gelişememe nedenleri, Türk hukuk mevzuatına göre tahkimde İslam hukukundan istifadenin imkânı, dini gereklilik bakımından tahkime müracaat, tahkim uygulamalarının tarihi süreci, günümüz tahkim uygulamaları ve İslam hukukuna dayalı tahkim uygulamalarında ihtiyaç duyulacak hakem kılavuzu hususları ele alınmıştır."
