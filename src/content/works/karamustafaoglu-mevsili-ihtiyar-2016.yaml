abstract: "Hicri III. asrın sonlarında mezhepleşen Hanefi fıkıh okulu her yüzyılda hukuk alanına birçok eser sunarak genişlemiştir. İlk zahiru'r-rivaye ve nevadir eserleri yazılmış onlar üzerine şerhler, onlar üzerine muhtasarlar, peşinden tekrar şerhler yazılmış, sonuç olarak ortaya birçok kitap ve meseleler çıkmıştır. Kitaplar çoğaldığı için, önceki teliflerden nakil esnasında, meselelerde farklılıklar oluşabilmekteydi. Bundan dolayı her mesele tahkike ihtiyaç duymaktadır. Bu makale elimize ulaşan meselelerin ana kaynak değerlerini tespit etme ve değişime uğrayan noktaları değerlendirme bağlamında Hanefi fıkıh literatürüne hizmet vermeyi hedeflemektedir. Çıkış noktası olarak VII. asır Hanefi ulemasından olan el-Mevsılî'ye ait, mezhebin dört ana metninden birisi olarak telakki edilen el-Muhtar isimli eserin, aynı yazara ait şerhi olan el-İhtiyar isimli eser tercih edilmiştir."
