abstract: "Osmanlı Devleti'nde, en küçük idari birimler olan kazalarda, devletin hukuki temsilcisi vazifesini gören kadılar tarafından tutulan mahkeme kayıtlarına şer'iyye sicilleri adı verilmektedir. Bu siciller, toplumsal yaşam başta olmak üzere, ekonomi, idari, sosyal, kültürel ve hukuki uygulamalar hakkında tutuldukları bölgeye ait bilgiler vermektedir. Şer'iyye sicilleri sahip oldukları çeşitlilik neticesinde hemen hemen her konuda tarih araştırmalarına somut kaynak sağlayabilmektedir. Bu çalışma da bir kadı defteri olan 20 Numaralı Avlonya Şer'iyye Sicili üzerine yapılmıştır. Kullanılan kaynağın oldukça hacimli ve yoğun bir içeriğe sahip olmasından dolayı, defterin ilk 50 varak olan kısmı incelenmiştir. Çalışmanın amacı, Osmanlı Devleti'nin Balkan coğrafyasındaki önemli liman şehirlerinden birisi olan Avlonya'nın 20 Numaralı Şer'iyye Sicili'nde yer alan bilgilerden faydalanarak içtimai ve iktisadi yaşantısı hakkında bilgi vermektir. Çalışmada ana kaynak olarak kullanılan 20 Numaralı Avlonya Şer'iyye Sicili içerisinde yer alan vesikaların Osmanlı Türkçesi'nden Latin harflerine transkripsiyonu yapılmış, bu vesikaların günümüz Türkçesi ile kısa özetleri birlikte sunulmuştur. Ardından vesikaların içerisinden elde edilen bulgular doğrultusunda bölgenin sosyal, ekonomik, ailevi yaşantısı, idari örgütlenmesi ve asayişi gibi konular üzerine bir değerlendirme yapılmıştır. Ayrıca ana kısma geçmeden önce çalışmanın daha anlaşılabilir olması ve okuyucunun verilen bilgileri daha sağlıklı değerlendirebilmesi amacı ile Avlonya'nın tarihi, coğrafi ve kültürel kimliği hakkında bilgiler verilmiştir. Çalışma, temel olarak bölgesel bir görünüme sahip olmasının yanı sıra Osmanlı Devleti'nin hukuki, toplumsal, idari, ekonomik, iktisadi, ailevi yapısı gibi genel konulara da katkı sağlamaktadır. Ayrıca çalışma Avlonya'nın yer aldığı Balkan coğrafyasında Osmanlı Devleti yönetiminin incelenebilmesi ve değerlendirilmesi bakımından da değerli bulgular içermektedir."
