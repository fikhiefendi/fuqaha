abstract: "Toplumu oluşturan kurumlar arasında ekonomi, eğitim, sağlık vb. kurumlar gelmektedir. Ekonomi deyince de birtakım insanların zihninde kendisine finans sektöründe yer bulmuş olan banka gelmektedir. Banka, gün geçtikçe önemini artıran iktisadi bir kurumdur. Banka hem modern toplumları hem de İslam toplumlarının ekonomik yapısını oluşturan finans kuruluşlarının başında gelmektedir. Bu kurum diğer ülkelerde olduğu gibi ülkemizde de gelişimini ilerletmektedir. İnsanlar banka kelimesini işittikleri zaman ise zihinlerinde canlanan kavramlar arasında faiz de gelebilmektedir. Bankalar geleneksel bankacılık ve katılım bankacılığı olarak sınıflandırılabilir. Geleneksel bankacılıkta, oranı önceden belirlenmiş faiz karşılığında mudilerden toplanan mevduatlar, bankanın belirlediği faiz oranı üzerinden, fon ihtiyacı olanlara kredi şeklinde kullandırılmaktadır. Katılım bankacılığını, geleneksel bankacılıktan ayıran en önemli husus, faiz yerine katılım payı sağlamasıdır. Geleneksel bankaların yürütmüş olduğu birtakım işlemlerde faiz bulunduğu için bu işlemlerin İslam hukuku açısından birtakım sakıncaları bulunmaktadır. İşlemlerini İslam hukukunun belirttiği sınırlar dâhilinde yürüten katılım bankalarının işlemlerinde ise İslam hukuku açısından herhangi bir sakınca görülmemektedir. Günümüzde katılım bankalarının İslam hukukuna riayet edecek şekilde işlemlerini yürütmeleri dini hassasiyete sahip kimselerin önemli bir kısmının katılım bankalarına yönelmesi sonucunu doğurmuştur. Bu durum da konunun önemini artıran faktörler arasındadır. Biz de bu alanda görüş belirtmiş iki büyük âlimin görüşlerini derlemek istedik. Bu çalışma bir giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Birinci bölümde Yusuf el-Karâdâvî ve Halil Günenç'in hayatları ve eserleri üzerinde kısaca durduk. İkinci bölümde Bankanın tarihsel gelişimi, katılım bankacılığının ortaya çıkması, katılım bankasının fon toplaması üzerinde durduk. Üçüncü bölümde Yusuf el-Karâdâvî ve Halil Günenç'in bankalar ile ilgili kendilerine yöneltilen sorular karşısında vermiş oldukları cevaplar yer almaktadır. Sonuç bölümünde ise konunun umumi bir değerlendirmesi yapılarak çalışma tamamlanmıştır."
