abstract: "VI ÖZET DOKTORA TEZİ“TEMEL HAK VE ÖZGÜRLÜKLER AÇISINDAN”İSLÂM KAMU HUKUKUNDA GAYRİMÜSLİM VATANDAŞLARIN HUKUKÎ STATÜSÜ Ali Aslan TOPÇUOĞLU 2005-SAYFA: 265 Danışman: Prof. Dr. Davut YAYLALI Jüri: Prof. Dr. Hamza AKTAN Prof.Dr. Vahdettin BAŞÇI Prof.Dr. Mustafa BAKITR Prof.Dr. Şamil DAĞCI Bu tezimizde Hz.Peygamber ve ilk Dört Halife döneminde İslâm ülkesinde sürekli olarak yaşayan gayrimüslimlerin, kamu hukuku açısından, temel hak ve özgürlükleri ele alınmış; ayrıca zaman zaman sonraki dönemlere ait uygulama örneklerine de atıfta bulunulmuştur. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde konunun sınırları ve araştırma esnasında kullanılan metod ve kaynaklar hakkında bilgi verilmiştir. Birinci bölümde İslâm hukuku açısından insanların inançlarına göre sınıflandırılması başlığı altında gayrimüslim gruplar hakkında özet bilgi verilmiş, ayrıca bu unsurların içinde yaşadıkları ülkenin niteliğinin, vatandaşlık statüsü için önem arzetmesi sebebiyle de genel olarak ülke kavramı üzerinde durulmuştur. Öte yandan ülke ile insan topluluğu arasındaki ilişki dolayısıyla da vatandaşlık kavramı üzerinde durulmuştur. İkinci bölümde de gayrimüslimlerin hukukî statüleri ele alınmıştır. Burada öncelikle İslâm ülkesi vatandaşı olmayan“harbîler”, sonra da geçici olarak İslâm ülkesinde bulunan müste'menler kısaca ele alınmış, daha sonra ise asıl araştırma konumuz olan sürekli olarak İslâm ülkesinde oturan gayrimüslim vatandaşlar yani zimmîler dataylı bir şekilde işlenmiştir. Üçüncü bölümde ise gayrimüslim vatandaşların temel hak ve özgürlükleri; kişi özgürlükleri, siyasal haklar ve iktisâdî-sosyal haklar ve özgürlükler şeklinde üç başlık halinde ele alınmıştır. Araştırma sonucunda varmış olduğumuz kanaatler de konu bitiminde belirtilmiştir. Ayrıca bu bölümde bazen konu içerisinde çoğu yerde de dipnotlarda İnsan Haklan Evrensel Bildirgesi, İnsan Haklan Avrupa Sözleşmesi ve 1982 Anayasası'nın ilgili maddelerine atıfta bulunulmuştur."
