abstract: "İslam dininde faizin yasak olması; Müslüman ülkelerde geleneksel bankacılık sistemine alternatif bir bankacılık sisteminin geliştirilmesini zorunlu kılmıştır. Geleneksel bankacılık sistemine alternatif bir sistemin olmaması, faiz hassasiyeti olan kesimin sahip olduğu kaynakların ekonomiye kazandırılmamasına yani atıl kalmasına neden olmaktadır. Bu kapsamda, söz konusu kaynakları ekonomiye kazandırılması amacıyla faizsiz prensiplere göre işleyen finans kurumları Türkiye'de ve dünyanın birçok ülkesinde yaygınlaşmaya başlanmıştır. Faizsiz bankacılık sistemi, günümüzde hem Müslüman nüfusun ağırlıkta olduğu ülkelerde hem de ekonomik çıkar elde etmek isteyen birçok ülkede yaygın bir şekilde kullanılmaktadır. Fakat sistemin dünyada ve Türkiye'de tam oturmaması, işleyişindeki bir takım belirsizlikler, uzman personel ve şube eksikliği, yetersiz tanıtım yapılması ve disiplinler arası çalışmaların yetersiz olması gibi nedenlerle bu alanda açıklık getirilmesi gereken bir takım tartışmalar bulunmaktadır. Bu çalışmanın konusu, katılım bankacılığının dünyada ve Türkiye'deki gelişimi, sektörde yaşanan tartışmalar ve bu tartışmalara çözümü için yapılması gerekenler şeklinde ifade edilebilir. Sonuç olarak yapılan bu çalışmada katılım bankacılığının dünyada ve Türkiye'de ki gelişiminin göz ardı edilemeyecek boyuta ulaştığı ve katılım bankacılığı alanında yaşanan tartışmaların daha çok sistemin işleyişi ve meşruiyeti ile ilgili olduğu tespit edilmiş, yaşanan tartışmaları açıklığa kavuşturmak ve sektörün gelişimine ivme kazandırmak adına öneriler sunulmuştur."
