abstract: "Bu çalışmanın amacı modern dönemde ulus devletinin bir biyopolitika aracı olan ve metalaşarak kapitalist sistem içinde bir sektör olarak var olan sağlık kavramının İslam Politik Ekonomisi açısından eleştirel bir analizini yapmaktır. Bu amacı gerçekleştirmek için modern sağlık sektörünü analiz ederken Michel Foucault'nun biyopolitika ve Karl Polanyi'nin metalaşma kavramlarından faydalanarak çağdaş sağlık sektörünün görünümünü ortaya koymaya çalışacağız. Sonrasında İslam Politik Ekonomisi teorik çerçevesi kullanılarak modern sağlık sektörünün ontolojik düzeyde eleştirel bir değerlendirmesini yapılacak ve İslam ekonomisi bağlamında sağlık kavramının nasıl olması gerektiği ortaya konulacaktır. Toplumda yaşanan dönüşümler sonucunda 18. yüzyıla kadar doğrudan sağlık ile ilgilenen tıp alanı, 19. yüzyıla gelindiğinde biyoiktidar tarafından ortaya atılan normal durum ve anormal olanın tedavisi ile ilgilenmeye başlamıştır. Zamanla tıp alanıyla ilgili olmayan yaşlılık, doğum, menopoz, depresyon ve hiperaktivite gibi birçok durumun tıbbi birer sorun olarak gösterilerek tedavi edilmeye mahkûm bırakılmasıyla tıbbileştirme ortaya çıkmış ve bu sayede tıp alanının iktidarı toplumun birçok alanına yayılmıştır. Gündelik yaşamın bile tıbbileştirilmesi ve tıbbın toplumda bir otorite konumuna gelmesi sonucunda sağlık, biyoiktidar için toplumu kontrol etme kurumlarından biri haline dönüşerek üretken bireyler üretme noktasında bir araç haline gelirken; kapitalizm için ise kapitalist piyasa anlayışı bağlamında başta ilaç üreticileri olmak üzere birçok sektör için kâr elde etmek amacıyla kullanılan bir meta haline gelmiştir. Görüldüğü üzere biyoiktidarın toplum üzerinde hakimiyet kurmayı amaçladığı bu süreç toplumda kapitalist piyasa anlayışının da genişlemesine yol açmıştır. Konuya modern öncesi dönemdeki Müslüman alimler açısından bakıldığında sağlıksız olma durumu kötü bir şey olarak değerlendirilmekten ziyade bu durum günahlara kefaret olması açısından bir imtihan olarak kabul edilmiştir. İslam Politik Ekonomisi'ne göre İslam için esas olan şey insan teklerinin temel amacının her durumda Allah'a kulluk etmeyi ön planda tutmasıdır. Bu yüzden sağlık, modern öncesi dönemde kâr elde etmeyi amaçlayan bir sektör anlayışıyla var olmamış ve sadece insanların Allah'a karşı daha iyi bir kul olma amacını gerçekleştirme noktasında tevekkül anlayışına dayalı bir araç olarak kullanılmıştır. Bu çalışmada vurgulamak istediğimiz nokta Müslüman bireylerin sağlıklı olmaktan kastının genel kabul gören tanımlardan farklı olması gerekliliğidir. Yukarıda anlatılanların ışığında bu çalışmanın diğer çalışmalardan farkı, bir sektörü ortaya çıkan sağlık kavramının kapitalist piyasa sistemi için bir meta olarak, biyoiktidar için ise bir biyopolitika aracı olarak kullanılmasına dair İPE teorik çerçevesi kapsamında ontolojik bir eleştiri getirmesi ve içinde yaşadığımız modern dünyanın doğurduğu dönüşümler bağlamında normatif bir teklifte bulunmasıdır."
