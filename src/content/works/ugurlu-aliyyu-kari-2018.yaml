abstract: "Molla Ali el-Kârî, Temel İslami İlimler sahasının birçok alanında (hadis, fıkıh, akaid, tefsir vb.) saygın eserler kaleme almış ve yaşadığı dönemde muasırı âlimlerce itibar görmüş, ayrıca 11. asrın müceddidi ünvanı bazı entelektüeller tarafından kendisine layık görülmüş bir ilim adamıdır. Hadis sahasındaysa günümüze kadar ulaşabilmiş, içerisinde uydurma hadisleri tespit edip derlediklerinin de bulunduğu 19 eser vererek bu alana da hâkimiyetini ispatlamıştır. Hanefi mezhebine mensup olmakla birlikte Ebû Hanîfe'nin görüşlerine son derece sadık kalmış, birçok alanda bu görüşleri savunmuş ve onun eserlerinden bazılarına da şerh yazmıştır. Bu şerhlerden belki de en meşhuru“el-Fıkhu'l-Ekber”adlı, İslam akaidinin temel konularını ele alan ve Hanefi mezhebinin temel kaynaklarından sayılan, İmam Azam Ebû Hanîfe'nin günümüze ulaşabilmiş küçük risalesine yazdığı şerhtir. Bu şerhte yer yer Kuran ayetlerinden, hadis-i şeriflerden ve meşhur ulemanın görüşlerinden faydalanarak Ebû Hanîfe'nin görüşlerini desteklemekle birlikte, batıl kabul ettiği fırkalarında görüşlerine yer verip onları eleştirmektedir. Biz bu çalışmamızda, hadis sahasında yetkinliğini ispatlamış olan Ali el-Kârî'nin, görüşlerini delillendirmek adına öne sürdüğü hadis rivayetlerinin kaynak değerlerini tespit etmeye çalışarak hem müellifin hadisçiliği hakkında fikir sahibi olmaya, hem de İslam akaidi konusunda üzerinde yapılan tartışmaların aktüel değerini koruduğu meseleler hakkında delil olarak zikredilen hadis rivayetlerinin hangi hadis kitaplarında rivayet edildiğini tespit etmeye, varsa rivayetlerin farklı lafızlarına ve senetlerine dikkat çekmeye çalışacağız."
