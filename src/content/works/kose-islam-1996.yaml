abstract: "Bu tez çalışmamızda son bir kaç asırdır ortaya çıkmış olan anonim ortaklıkları ele aldık. Anonim ortaklıklar ticari şirketlerin en gelişmiş tipleridir. Diğer ticari ortaklıkların yanında dünyada en çok rağbet gören ve ülke ekonomisine en çok katkıda bulunan ve tüzel kişiliğe sahip müesseselerdir. Fertlerin atıl durumda bulunan küçük sermayelerinin en iyi değerlendirileceği ortaklık tipidir. Anonim şirket bir unvana sahip, özel sermayesi belirli ve paylara bölünmüş olan ve borçlarından dolayı yalnız mal varlığı ile sorumlu bulunan şirkettir. Ortakların sorumluluğu, taahhüt ettikleri sermaye paylan ile sınırlıdır. Anonim ortaklıkların organları ; genel kurul, yönetim kurulu ve denetçilerdir. Genel kurul bu ortaklığın en üst organıdır. Şirketin yönetim ve temsil organı yönetim kuruludur. Ortaklığı denetleme görevi ise, genel kurulca seçilmiş olan denetim organına aittir. Anonim ortaklıklar sermayelerini genişletmek amacı ile hisse senedi adı verilen kıymetli evrakları aracı kurumlar sayesinde halka arz ederler. Klasik fıkıh kitaplarında çok ortaklı şirketlerden bahsedilmez. Bununla birlikte genel manada mülk ve akit şirketi şeklinde ikili bir taksim söz konusudur. Akit şirketinin de kendi içerisinde bir takım kısımlarının da olduğu bir gerçektir. Fıkıh kitaplarında bulunan bu sınıflama nassa dayanan bir taksim olmayıp, zamanın ve şartların anlayışına uygun olarak yapılmış bir tasniftir. Günümüz açısından yeni çıkan ortaklık Kur'an ve sünnet persfektifinde ele alınarak fukahanın içtihatlarından da istifade edilerek, zamanın ticari ve iktisadi yapısı da göz önünde bulundurularak yeni bir düzenlemeye gidileceği gayet açıktır."
