abstract: "Bu çalışma, İslâm hukuku bağlamında icâre akdinin teorik temellerini, tarihsel gelişimini ve modern finansal araçlarla ilişkisini incelemektedir. Araştırma, icâre akdine dayalı finansal işlemlerin klasik İslâm hukuku ilkelerine uygunluğunu irdelemeyi ve bu bağlamda ortaya çıkan metodolojik problemleri ele almayı hedeflemektedir. İcâre akdi, yalnızca basit bir kira sözleşmesi olarak değil, tarihsel süreçte faizsiz finansman araçlarının geliştirilmesine temel teşkil eden önemli bir yapı olarak değerlendirilir. Günümüzde finansal kiralama, icâre sukûk ve hizmet finansmanı gibi araçlarla modern finansal piyasalarda geniş bir uygulama alanı bulmaktadır. Araştırma, klasik icâre teorisi ile bu teoriye dayalı olarak geliştirilen finansal işlemler arasındaki ilişkiyi anlamayı, bu işlemlerin İslâm hukuku açısından değerlendirmeyi ve güncel finansal uygulamalar bağlamında ortaya çıkan metodolojik sorunları tespit etmeyi amaçlamaktadır. Bu bağlamda icâre akdine dayalı güncel finansal işlemlerin klasik icâre teorisi çerçevesinde temellendirilebilir olup olmadığı, klasik hükümlerin doğrudan güncel finansal kiralama işlemlerine uygulanmasının mümkün olup olmadığı, gibi birtakım soru(n)lara odaklanmaktadır. Araştırmada klasik hükümlerin tespiti noktasında tarihsel veri araştırmasına dayalı bir yöntem kullanılmaktadır. Klasik hükümlerle modern finansal işlemler arasındaki ortak ve farklı yönlerin tespitiyle ilgili olarak mukayeseli araştırma metodu uygulanmaktadır. Bu çerçevede evvela klasik icâre teorisinin temel yapısal unsurları incelenmekte, bu unsurların oluşumuna etki eden fıkhî, sosyal ve ekonomik faktörler ele alınmaktadır. Ardından icâre akdine dayalı finansal işlemler tanıtılmakta; finansal kiralama, icâre sukûk ve hizmet finansmanı gibi araçların süreçleri ve işleyişleri tahlil edilmektedir. Daha sonra ise, modern finansal işlemlerin klasik icâre teorisi ile ilişkisi ve bu süreçte ortaya çıkan fıkhî meseleler, detaylı bir şekilde değerlendirilmektedir."
