abstract: "İlmihaller temel inanç ve ibadet bilgileri başta olmak üzere ihtiyaca binaen ahlâk ve muamelat konularının da içerisinde yer aldığı, toplumda dini bilginin yayılması ve şekillenmesinde önemli etkileri olan kitaplardır. Yazıldıkları dönemin ilmi durumu ve toplumsal yapısı hakkında vermiş oldukları bilgiler, ilmihal türü eserleri ayrıcalıklı kılmaktadır. Bu çalışmada ilmihal kavramı, literatürdeki yeri, tarihi gelişimi, ilmihallerin birey ve toplumsal açıdan önemi üzerinde duruldu. Bu bağlamada Osmanlı döneminde büyük değişimlerin yaşandığı XIX. yüzyıl'a şahitlik etmiş Abdullah Şevket'in hayatı ve Hanefî mezhebi görüşleri esas alınarak Osmanlıca kaleme aldığı Necâtü'l-Mükellefîn ilmihalinin inceleme ve değerlendirmesi yapıldı. Ayrıca aynı dönemde halka yönelik olarak Osmanlıca yazılmış Nimet-i İslâm ve Dîn-i Mübîn-i İslâm ilmihalleri içerdiği konular bakımından mukayase edilerek bu dönemde yapılan ilmî çalışamlarla ilgili literatüre katkı sunmak hedeflendi."
