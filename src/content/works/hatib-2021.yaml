abstract: "Islâm fıkhı; seriatın getirdigi hükümleri mükelle erin ameline bagladıgından dolayı bu ümmet nezdinde son derece önemli oldugu için, fıkhî hükümler seriatta bundan dolayı konuldugu için ve furû' fıkıh dedigimiz alt konular da usûl kâidelerine baglı oldugu için ben de bu arastırmamda“El-Ihtiyâr' Kitabının 'Oruç' Bölümündeki Usûl ve Fıkıh Kâideleri”konusunu ele aldım. Sonra bu çalısmamı bir giris, iki ayrı bölüm ve bir sonuç kısmı olacak sekilde düzenledim.“Giris”bölümünde çalısmamın baslıgının ne anlama geldiginden bahsettim. Okuyucuların daha kolay anlayabilmesi için“Kâide”ve“Zâbıt”kavramları ile birlikte“Fıkhî Kâide”ve“Fıkhî Zâbıt”kavramlarını, aralarındaki farklara deginerek anlattım. Aynı sekilde“Usûl Kâideleri”kavramınının anlamını da“Fıkhî Kâideler”ile arasındaki farkı anlatarak açıkladım. Bu çalısmam“Oruç”bölümüyle ilgili oldugu için orucun anlamından, seriattaki yerinden, hikmetinden ve bunlarla ilgili olan bazı konulardan bahsettim. Ayrıca bu tez,“El-Ihtiyâr”kitabında bulunan çogu konuyu kapsadıgı için de kitap sahibinin biyogra sine ve bu kitabın diger Hanefî fıkıh kitaplarından ayrılan temel özelliklerine yer verdim. Giris kısmını tamamladıktan sonra“ Birinci Bölüm”e baslayarak“ Oruç v Kitabındaki Fıkhî Kâideler”konusunu ele aldım. Ve bu bölümü dört kısma ayırdım: 1) Öncelikle“Isler maksatlarına göredir. Niyet bulunmadıkça sevap da yoktur.”kuralını, bu kuralda geçen kavramları ve genel olarak kuralın mânâsını anlattım. Buna ek olarak“El-Ihtiyâr”kitabı basta olmak üzere diger fıkıh kitaplarından da ilgili konuya örnekler verdim. 2) Ikinci olarak“Kesin bilgi, süphe ile ortadan kalkmaz.”kâidesini de aynı yaklasımla inceledim. 3) Üçüncü olarak“Zorlugun bulunması kolaylastırmayı gerektirir.”kuralını açıkladım. 4) Dördüncü olarak da“El-Ihtiyâr”kitabında oruçla ilgili geri kalan konuları da içine alan farklı fıkıh kurallarına degindim. Ardından“ Ikinci Bölüm”e baslayarak“ Oruç Kitabındaki Usûl Kâideleri”konusunu üç ana baslıkta inceledim: 1) Ilk olarak“Hâs”lafzı ve kurallarını anlattım. Burada“Emir”ve“Nehiy”ile ilgili konulardan da bahsettim. 2) Ikinci olarak seriatta konulmus olan hükümleri“Ruhsat”ve“Azîmet”açısından açıkladım. Sonra da bu hükümlerin sebeplerini, illetlerini ve bunların oruçla ilgili alt meselelerini ele aldım. 3) Üçüncü olarak“ Kıyas”konusunu, sartlarını; kıyasın“ Muâraza”,“Teâruz”ve“Tercîh”ile ilgisini anlatarak bu bölümü bitirdim. Bu üç baslıgın tamamında da bu kuralların oruçla ilgili fıkhî baglantılarını vurgulamaya çalıstım. vi“Sonuç”bölümünde ise bu arastırmamda ulastıgım en önemli neticeleri ve bazı tavsiyeleri yazdım. Son olarak“Içindekiler”kısmıyla da çalısmamı sona erdirdim."
