abstract: "Kadı Sicillerinde yer alan kayıtlardan vergi, narh, miras, tereke, alış-satış, borç, evlenme (mehir), boşanma (muhala'a) ilam ve hüccetleri en önemli kayıtlardır. Mahkeme Kayıtları bu özellikleri dolayısıyla sosyal ve iktisadî tarihi için vazgeçilmez bir kaynaktır. Bu çalışmada, kadı sicillerinden hareketle 16. ve 17. yüzyıl İstanbul ve tabi kazalarında bey' bi'l-istiğlâl akitleri uygulamalarının anlaşılması amaçlanmıştır. İslam fıkhı ve Osmanlı tatbikatında muamele-i şer'iyye açıklanmış, muamele-i şer'iyye türleri anlatılmıştır. Sicillerde yer alan istiğlâlen borçlanmalar tespit edilmiş ve istiğlâl akitleri dönem/kaza, borçlanan kimselerin kimlik bilgileri, akde konu olan mal, muamele/kira oranları, akitlerin kira süreleri, akitlerdeki ihtilaflar/anlaşmazlıklar ve kullanılan para birimleri analize konu edilmiştir. Sonuç olarak: Bey' bi'l-istiğlâl akitleri, Osmanlı toplumunun her kesiminden bireylerce tüketim, yatırım ve üretim maksatlarıyla geniş bir şekilde kullanıldığı tespit edilmiştir."
