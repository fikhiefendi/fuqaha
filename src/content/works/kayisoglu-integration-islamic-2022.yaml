abstract: "Mikrofinans, yoksul ve düşük gelir grubundaki insanlara finansal ve finans dışı hizmetlerin sunularak onların gelir getirici bir faaliyet yapma konumuna getirilmesi ve yoksulluğun azaltılmasını sağlayan önemli bir araçtır. Günümüzde insanların finansal hizmetlere erişimini sağlayan kurumlardan en önemlisi bankalar olup hem katılım hem de konvansiyonel bankacılık faaliyetleri yoluyla toplumun bir kısmı finansal hizmetlerden yararlanabilmektedir. Ancak, bankacılık faaliyetlerinin doğası gereği hiçbir banka verdiği finansmanın geri ödemesinde aksamalar yaşamak istememekte ve bir geri ödeme garantisi aramaktadır. Bu noktada ise düşük gelir grubundaki kişiler teminat yetersizliği ve kredi geçmişine sahip olmamaları nedeniyle banka-dışı kalmaktadırlar. İslami Mikrofinans sisteminin yapıtaşı en yoksul kimsenin dahi finansmana erişiminin sağlanması ve gelir getirici faaliyette bulunabilmesinin sağlanması prensibidir. Günümüzde ise katılım bankaları dâhil bunu sağlayamamaktadır. Küçük ve Orta Ölçekli İşletmeleri Geliştirme ve Destekleme İdaresi Başkanlığı (KOSGEB) Türkiye' de KOBİ' lerin ve yeni girişimcilere kapsamlı destek programları oluşturan ve geri ödemeli ve geri ödemesiz desteklerle işletmeleri kuruluş aşamasından itibaren destekleyen bir devlet kuruluşudur. Bu tez çalışmasının amacı, Türkiye' nin mevcut durumda en kapsamlı Mikrofinans kuruluşu olan KOSGEB'in sağladığı destek programlarının değerlendirilerek sorunlu alanlarının tespit edilmesi ve katılım temelli mikrofinans perspektifinden bu sorunlu alanların düzeltilebilmesi için çözüm önerileri getirerek daha etkili ve verimli olması amacıyla bu destek programlarıyla katılım temelli mikrofinans sisteminin entegre edilmesi amacıyla çeşitli öneriler sunmaktır. Çalışma 3 bölümden oluşmaktadır. İlk bölümde Mikrofinans, Katılım Mikrofinans ve enstrümanları açıklanmıştır. İkinci bölümde Türkiye' de Mikrofinansın gelişimi hakkında bilgi verilmiş ve Mikrofinans sağlayan kurum/kuruluşlara yer verilmiştir. Bu bölümde ayrıca KOSGEB ve mevcut destek programları da detaylıca açıklanmıştır. Üçüncü bölümde ise KOSGEB destekleri hem genel destek yapısı anlamında hem de katılım temelli mikrofinans açısından değerlendirilerek desteklerin ilgili enstrümanlarla entegresi için öneriler sunulmuştur."
