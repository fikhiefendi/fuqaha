abstract: "Amaç: Bu çalışma, islam hukukunda uygulamalı ekonominin dalı haline gelen kaynak ekonomisini tanımlamayı amaçlamaktadır. Araştırma kaynaklarını ele alan islami kurama Kur-an ve saf sünnetler vasıtasıyla incelemeye ve aktarmaya vurgu yapacaktır. Araştırma aynı zamanda islam hukuku kaynaklarını bu doktrinlerin kuramsal metinlerden gerçek uygulanabilir kurallara, sorunlara, ve şubelere nasıl yön değiştirdiğini inceleyecek ve nihayetinde bunun islam kültüründeki insanların yaşam koşullarına nasıl yansıdığına ışık tutacaktır. Bu çalışma kaynakların iki önemli yönüne değinmektedir:Bunlar, kaynak koruması ve geliştirmesidir.Kaynak koruması, Kaynakları muhafaza etmeye ve onları herhangi bir bozulmaya ve zarar karşı korurken; kaynak geliştirme ise yükseltme, geliştirme, ve faydalanmayı şu sonucu elde etmek için ele alır: Dengeli tüketim ve israftan kaçınma kaynakların en iyi şekilde kullanılmasıdır. Araştırma islami kuramlara teorik açıklamalar sağlayan tanıtım bölümüyle başlar, daha sonraki bölümler hayvan, bitki, toprakaltı ve su kaynaklarına değinir ve araştırma yöntemleri ve bulgularla sonuçlanır. Bu çalışmada analitik metodun yanısıra tümdengelim ve tümevarım yöntemleri kullanılmıştır."
