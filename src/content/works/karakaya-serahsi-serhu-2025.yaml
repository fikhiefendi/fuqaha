abstract: "Bu çalışma, Muhammed b. Hasen eş-Şeybânî'nin (öl. 189/805)“es-Siyerü'l-Kebîr”adlı eseriyle bu eserin şerhi olan Serahsî'nin Şerhu's-Siyeri'l-Kebîr'i ışığında İslâm savaş hukukunu incelemektedir. Şeybânî'nin sözü edilen eseri, İslâm devletler hukuku meselelerini ele alan ilk kapsamlı eser olarak bilinmektedir. Bu eser, İslâm devletler hukukunun evrensel normlarını ve Müslümanların uluslararası ilişkilerde sekiz asırlık önceliğe sahip olduğunu göstermektedir."
