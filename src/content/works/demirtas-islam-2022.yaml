abstract: "Ġslâm dini, toplumu günlük hayatında zor durumda bırakacak ve ona ağır gelebilecek Ģeyleri kaldırmayı amaçlamıĢtır. Bu yüzden bazı tasarruflarda zamanın Ģart koĢulmasını gerekli kılmıĢ ve tarafların yapılan alıĢveriĢte zarar görmemesini öngörmüĢtür. Örneğin; selem, icâre, iâre, vekâlet, müdârebe, hıyâr-u Ģart vb. iĢlemler asıl itibarıyla insanın günlük alıĢveriĢlerinde onlara bir külfet, meĢakkat ve zorluk olmaması için meĢru kılınmıĢ birer tasarruftur. Aynı zamanda bu tasarrufların geçerli olabilmesi için her iki tarafın aralarında zamanı belirlemeleri gerekir. ġayet zaman belirlenmemiĢse bu tasarruflar geçersiz olur. Zaman borçlar hukukunda bu kadar önemli olduğu için biz de bu çalıĢmamızda zamanın etkisini“Ġslâm Borçlar Hukukunda Zamanın Hukukî Tasarruflara Etkisi”baĢlığı altında inceledik. ÇalıĢmamız bir giriĢ ve dört bölümden meydana gelmektedir. GiriĢ bölümünde zamanın önemi, tezin amacı ve yöntemi ele alınmıĢtır. Birinci bölümde, zamanın kavramsal çerçevesi ve zamanla ilgili terimlere değinilmiĢtir. Ġkinci bölümde, Ġslâm hukukunda bulunan süreli ve fevrî muameleler ve zamanın bu muamelelere olan etkisine değinilmiĢtir. Üçüncü bölümde, tarafların karĢılıklı borçlanmaları durumunda zaman açısından bu muamelelerin nasıl bir hüküm aldığı incelenmiĢtir. Dördüncü bölümde ise taraflar zaman hususunda ihtilâfa düĢtüklerinde nasıl bir yol izlenileceğine dair hükümlere değinilmiĢ olup zamanın hangi hallerde sakıt olduğu hususlar fakihlerin görüĢleri bağlamında ele alınmıĢtır. ÇalıĢmamızda ortaya çıkan sonuçlara bakıldığında, Ġslâm borçlar hukukunda zamanın önemi ve muamelelere olan etkisi açık bir Ģekilde anlaĢılmaktadır."
