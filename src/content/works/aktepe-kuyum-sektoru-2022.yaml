abstract: "Kuyum sektörü, değerli metaller ve değerli taşların işlenerek çeşitli eşyalara dönüştürüldüğü sektördür. Bu maddelerin ham halinden çıkarılması ve işlenmesi işlemine kuyum denilmektedir. İnsanoğlu tarih boyunca altın, gümüş, elmas, pırlanta, döviz gibi varlıklara ilgi duymuş ve bunlara sahip olma arzusunda olmuştur. Bu varlıklar az bulunurlukları, parlaklıkları, güzel görünüşleri, kolay işlenir oluşları gibi sebeplerle insanoğlunun dikkatini cezbetmiş, işlenmiş ve ziynet olmuşlar, kadınların ise aslî süsleri haline gelmişlerdir. Likiditeleri yüksek olduğundan ve talep gördüklerinden değerlerini muhafaza etmiş ve hatta artırmışlardır. Eşya ve özellikle de ziynet olarak kullanımlarının yanı sıra insanların tasarruf aracı haline gelmişler; insanlar tarafından saklanmış, korunmuş ve büyük rezervler oluşturmuşlardır. Günümüzde merkez bankalarının en önemli rezerv kaynakları bu türden varlıklardır. Bu güzel özelliklerine rağmen yine bu varlıklar üzerinden faizcilik yapılmış ve yaygınlaştırılmıştır. İslâm hukukunda faiz yasak olduğundan İslâm âlimleri konuyla ilgili âyet ve hadisler ışığında böylesi varlıkların alım satımlarında diğer emtialara nazaran ekstra şartlar ileri sürmüşlerdir. Bununla birlikte bu şartların evrenselliği ve değişkenliği hususunda İslâm âlimleri arasında tartışmalar meydana gelmiştir. Bu çalışmamızda kuyum işlemleri, konu ile ilgili naslar ve bu naslara dayandırılan görüşler doğrultusunda değerlendirilmektedir."
