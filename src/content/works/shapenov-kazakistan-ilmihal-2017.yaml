abstract: "İlmihallerin toplum içindeki yaygın fonksiyonunu incelediğimiz zaman anlıyoruz ki, onlardan beklenen öncelikli fayda, her bir Müslümanın günlük hayatında ihtiyaç duyacağı temel bilgileri insanlara kolayca ulaştırmaktır. Bu nedenle, bütün Müslüman toplumlarda halkın bu tür ihtiyaçlarını karşılamak amacıyla ilmihal eserleri kaleme alınmıştır. Bu uygulama, kazak toplumunda da görülmektedir.“Kazakistan'da İlmihal Geleneğinin Gelişimi”adını taşıyan bu tez çalışmamız, Kazak din adamlarının yazdıkları ilmihal eserlerini tespit edilmiş, Kazak toplumunun ilmihal kaynakları ve anlayışı, ilmihal geleneğinin ne derecede geliştiği ortaya koyulmuştur. Bu kapsamda tespit edilen ilmihal çalışmaları şekil ve muhteva bakımından detaylı bir şekilde incelenerek tanıtılmıştır. Tezimiz bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında araştırmanın önemi, sınırlandırılması, amacı, yöntemi ve araştırmanın kaynaklarına yer verildikten sonra, İslam öncesi ve sonraki dönemde kazaklar hakkında kısaca bilgi verilmiştir. Birinci bölümde, Kazak toplumunun dini bilgi kaynakları, ilmihal kavramı, önemi, gerekliliği ve kazakların klasik dönem ilmihal kaynakları hakkında kalem alınmıştır. İkinci bölümde bağımsızlık öncesi ilmihal çalışmaları ve müelliflerin hayatı, eserleri, hoca ve öğrencileri, ilmi kişiliği ve çağdaşları hakkında bilgi verilmiştir. Üçüncü bölümde ise bağımsızlık sonrası ilmihal çalışmaları ve yazarları hakkında bilgi verilmiştir. Çalışmamız, vardığımız neticeleri ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır."
