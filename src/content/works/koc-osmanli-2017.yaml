abstract: "Osmanlı devleti kendinden önce tarih sahnesinde yerini almış diğer Türk devletlerinden aldığı hukuk mirasını İslam hukuku ile birleştirmiştir. Böylece şer'î ve örfî hukukun beraberce uygulandığı bir sistemi oluşturmuştur. Toplumda meydana gelen suç tiplerine şer'î ve örfî hukuk kurallarına göre farklı yaptırımlar uygulamıştır. Osmanlı unsurları ve ispat şartları gerçekleşen had ve kısas suçlarına belirlenen cezaları uygulamaktadır. Had ve kısas suçlarının dışında kalan ta'zîr suçları ve cezaları kanunnameler tarafından belirlenmektedir. Aynı şekilde had ve kısas suçlarının unsurları oluşmadığında onlara uygulanacak cezalar da kanunnameler tarafından belirlenmektedir. Böylece suçların kanuni unsuru oluşmaktadır Ve ta'zîr cezaları uygulanırken keyfilik ortadan kaldırılmaktadır. Çalışmamızda Osmanlı ceza hukukunu oluşturan fıkıh mevzuatı, fetva mecmuaları, kanunnameler ile klasik ve tanzimat dönemi mahkeme uygulamalarını beraberce görmek mümkündür. Böylelikle teori ve pratik ceza hukukunu bir arada görme ve Osmanlı ceza hukuku etrafında tartışılan konuları daha isabetli değerlendirme imkanımız olacaktır. Anahtar kelimeler: Şer'i Hukuk, Örfî Hukuk, Suç, Ceza, Mahkeme Kararı, İnfaz."
