abstract: "İslam, insan hayatının her yönünü ele alan ve ekonomik, sosyal, kültürel ve toplumsal yaşama dair kurallar getiren bir dindir. İslami iş ve ekonomi anlayışı, bireyin yaşantısının her alanında olduğu gibi ekonomi ve finans alanını da düzenlemektedir. Bu noktada İslami bankacılık (Türkiye'de kullanılan ifadeyle katılım bankacılığı), İslam Hukukuna uygun bir finansal sistemi ifade etmekte olup; borç alan ve veren arasındaki faize dayalı ilişkinin yerine öz kaynağa dayalı ve faizsiz düzenlemeler getirmektedir. Faiz olgusunu ekonomik ve finansal alandan çıkarma amacında olan İslami bankacılık, sadece Müslüman toplumlarda değil aynı zamanda Batı toplumlarında da önemli bir yer edinmiştir. Özellikle 2008 finansal krizi sonrasında ortaya çıkan güven sorunu, dünyanın pek çok ülkesinde İslami bankacılığa yönelik ilgiyi arttırmıştır. Bu çalışmada, İslami bankacılık kavramsal ve kurumsal bir çerçevede ele alınarak dünya örnekleri incelenmiştir. İzleyen aşamada Türkiye'deki İslami bankacılığın gelişme dinamikleri incelenmiş ve konvansiyonel bankacılık ile karşılaştırması yapılmıştır. Çalışmada Türkiye'deki İslami bankacılık sisteminin mevcut durumu ve gelişme eksenleri ele alınarak; mevcut finansal sistemde uygulanmayan İslami pencere modeli önerisi sunulmuştur."
