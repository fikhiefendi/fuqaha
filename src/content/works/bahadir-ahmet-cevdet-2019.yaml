abstract: "Bu çalışmanın temel gayesi, Osmanlı Devleti'nin son dönemlerinde yetişen, tarih, hukuk, edebiyat gibi birçok alanda çalışmalar yapmış ve eserler vermiş, ender şahsiyetlerden biri olan kanunlaştırma dönemi hukukçularından Ahmet Cevdet Paşa'yı ve İslam Hukukuna katkılarını Risâletü'l-vefâ isimli eseri ışığında incelemektir. Osmanlı Devleti'nde, Tanzimat'tan sonra girişilen kanunlaştırma çalışmalarının öne çıkan isminin Ahmet Cevdet Paşa olduğu, şüphe götürmez bir gerçektir. Ahmet Cevdet Paşa, Fransa'nın kanunlarının tercüme edilip alınması yönündeki kanaatlerin bütün şiddetiyle baskın olduğu bir dönemde, bu durumun;“bir milletin hukuk yoluyla istilâ edilmesi ve tamamen teslim olup, yok olması anlamına geleceğini”söyleyerek, bu fikirde olanların karşısına çıkmış, onlarla yaptığı çetin mücadeleler sonunda onları ikna etmeyi başarmış ve İslam Hukuku'nun kanunlaştırılması olan Mecelle'nin hazırlanmasına karar verilmesini sağlamıştır. Ne var ki iş bununla bitmemiş, Ahmet Cevdet Paşa, başkanı olduğu Mecelle'yi hazırlama sürecinde de içerden ve dışardan bu fikre muhalif olanların sürekli hile ve entrikalarıyla mücadele etmek zorunda kalmıştır. Ahmet Cevdet Paşa, sonunda adının tarihe altın harflerle yazılmasına vesile olan, Türk İslam Medeni Hukuku Mecelle-i Ahkâm-ı Adliyye'nin hazırlanmasını başarmıştır."
