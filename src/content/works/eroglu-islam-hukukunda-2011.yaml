abstract: "İslam dinine göre yüce Allah'ın eliyle yaratılan ve Allah'ın ruhunu taşıyan ilk insan Hz. Âdem, çocuk değildi. Fakat onun, cennet yurdundan dünya gibi meşakkatli bir âleme intikaliyle dünyada doğan çocukları için aynı şeyler söylenemez. Dolayısıyla `çocuk' kavramı ile ifade edilen ve araştırmamıza konu olan bu insan yaşamının özel bölümü, insanlık tarihinin ilk dönemlerine kadar gider. Bu küçük insanlar, adaletin, hakkın ve hukukun hâkim olmadığı tüm zaman dilimlerinde çok büyük acılar çektiler. İslam'ın ortaya çıkmasından önce cahiliye Arapları kız çocuklarını diri diri toprağa gömüyorlardı. İslam'ın ortaya çıkmasıyla kız çocukları bu vahşetten kurtulmaya başladı.Ancak dünya genelinde milyonlarca çocuk yaşadığı düşünüldüğünde insanlığın bu önemli konuda daha alacağı çok yolun olduğu görülmektedir. Ayrıca insanın kendi eliyle sebebiyet verdiği savaş, terör, trafik, alkol, uyuşturucu, iş kazalarının yanında, deprem, sel, yangın gibi doğal afetlerle en çok etkilenen çocuklar olduğu düşünüldüğünde bu konunun dini, sosyal, ekonomik, siyasi ve hukuki boyutlarının sürekli gündemde tutulması ve çözümler üretilmesi gerektiği apaçık ortadadır.Çocukların kendi hakları konusunda hukuk sistemlerine bir etkileri düşünülemez. Bu yüzden şu anda sahip oldukları haklar hep büyükler tarafından tespit edilmiştir. Gelecek zamanın büyükleri olacakları için bugünün çocukları çok önemlidirler. Biz büyüklere düşen -özellikle hukukçuların- çocukların sahip olduğu haklar konusunda çok titiz davranmamız gerektiğidir. Çocukların sahip olması gereken hakların ne aşırı ne de eksik olması gerekir. Çünkü çocuk yetişkin bir birey olduğu zaman artık bazı konularda ona hak verilse bile bunun pek faydası olmayacaktır. Demek istediğimiz; çocuk çocukluğunu yaşamalıdır ki, hem bedensel hem de ruhsal gelişimini sağlıklı bir şekilde tamamlayabilsin.İşte biz de bu çalışmamızda, temelde bir insan hakları meselesi olan böylesi önemli ve güncelliğini hiç yitirmeyen çocuk hakları konusunu İslam hukuku açısından ve Modern hukuk açısından incelemeye gayret gösterdik.Biz bu çalışmamızda; İslam hukukunun çocuklara sağladığı hakların ne olduğu ile modern hukukta çocukların sahip olduğu hakların ne olduğu şeklinde merak edilen sorulara cevap aramaya çalıştık."
