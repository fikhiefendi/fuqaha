abstract: "İslam tarihi boyunca Müslüman bilginler/fakihler, Kur'an'ın içerdiği ilke ve öğretileri, kendileri içinde bulunduğu topluma ve zamana doğru bir şekilde taşıyabilmek ve böylece Kur'an'ın anlamının güncelliğini korumak için birçok metot ve kavramlar geliştirmiş, fıkıh yaparken de söz konusu kavramları birer delil olarak kullanmışlardır. Nitekim İmam Malik'in şeri ahkamın delillerinden bir delil olduğunu savunarak kavramsallaştırdığı ve sistemleştirdiği, sonunda İslam hukuku literatüründe yer almasını sağladığı“amel-i ehl-i Medine/Medinelilerin ameli”işte o kavramlardan bir tanesidir. Bu çalışmada, söz konusu kavramı sosyolojik açıdan analiz etme kapsamında ilk olarak İmam Malik'in hayatı ve onun yaşadığı dönemdeki Medine toplumunun sosyal, siyasal ve kültürel durumu ele alınmış, İmam Malik'in amel konusunu detaylı bir şekilde anlattığı Muvatta adlı eseri kısaca tanıtılmıştır. İkinci olarak İmam Malik'in amel-i ehl-i Medine anlayışının oluşmasına zemin olan Medine'nin, Hz. Peygamber'in hicret ettiği sıradaki genel durumu kısaca anlatıldıktan sonra, hicretle beraber Medine toplumunda meydana gelen değişiklik ve sorunlar, Hz. Peygamber'in söz konusu sorunları çözüme kavuşturmak ve gelecek Müslüman nesillere yol göstermek için Medine'de yarattığı kültür ve sosyal davranış kalıplarının neler olduğu ve bu davranışların, İmam Malik'in amel-i ehl-i Medine anlayışının temelini nasıl oluşturduğu üzerinde durulmuştur. Daha sonra İmam Malik'in, söz konusu amelin şeri ahkamın delillerinden biri olduğunu ısrarla savunmasının arkasında yatan sosyolojik nedenler ve bu amelin İslam'ın temel paradigmaları bağlamında sosyolojik açıdan neye tekabül ettiği konusu incelenmiştir. Bu kapsamda söz konusu amelin, sünnet ve Medinelilerin örf/gelenekleriyle nasıl bir ilişki içinde olduğu araştırılmış, son olarak İslam'ın kurumsallaşmasında ve Medinelilerin amelinin fıkıh usulüne girmesinde Medine'deki İslam'ın ilk tecrübesinin nasıl rol oynadığı gibi konular incelenmiştir."
