abstract: "Oryantalizmin temel araştırma alanını İslâm hakkında yapılan çalışmalar oluşturmaktadır. Bu çalışmalar içerisinde çok sayıda Yahudi oryantalistin İslâm'ın kaynağı, Hz. Peygamber'in hayatı, Kur'an ve hadis üzerine araştırmalar yaptığı görülmektedir. Oryantalist zihniyetin önde gelen isimlerinden biri Macar asıllı Yahudi müsteşrik Ignaz Goldziher'dir. Goldziher'in hadis alanında söylediği sözlere karşı, bazı çalışmalar yapılmasına rağmen bunların kelâm ilmi bağlamında değerlendirmesinin de uygun olacağı düşünülmüştür. Bu çalışmada, Goldziher'in“Vorlesungen Uber den Islam”adlı eserinin İlhan Başgöz tarafından tercümesi olan“İslâmda Fıkıh ve Akaid”ismiyle yayımlanan eseri değerlendirilmiştir. Çalışma; giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, çalışmanın amacı ve yöntemi kapsamında kavramsal çerçeve oluşturulmuş ve oryantalizm ile Goldziher hakkında genel bilgiler verilmiştir. Çalışmanın birinci bölümde, Goldziher'in hayatı hakkında kısaca bilgi verilmiş ve İslâm dini hakkındaki genel görüşleri herhangi bir yorumda bulunulmadan ortaya konulmuştur. Çalışmanın ikinci bölümünde ise Goldziher'in“İslâmda Fıkıh ve Akaid”(Vorlesungen Uber den Islam) adlı kitabında; İslâm akîdesi, İslâm dini, eklektik İslâm iddiası (İslâm hukuku ve tasavvufu), Kur'an-ı Kerim, sünnet, nübüvvet ve Mu'tezile ile ilgili görüşleri başlıklar altında kelâm ilmi açısından incelenmiştir. Goldziher, İslâm dinini ilahi bir din olarak kabul etmeyip İslâm'ın heterojen bir yapıya sahip olduğunu iddia etmiştir. Onun İslâm dininin ana kaynaklarından biri olan Kur'an-ı Kerim'i ve sünneti hiçbir şekilde kabul etmediği, bu dinin eklektik bir yapıda olduğunu savunduğu ve Hz. Peygamber'in nübüvvetini reddetme iddialarında bulunduğu tespit edilmiştir. Çalışma kapsamında, Goldziher'in bütün bu iddiaları ayrıntılı bir şekilde incelenmiş ve kelâmi açıdan kabul edilebilir olmadığı ortaya konulmuştur."
