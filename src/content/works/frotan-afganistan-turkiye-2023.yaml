abstract: "Bu çalışmada temel amaç, Afganistan'da İslami bankacılık alanında tam teşekküllü tek banka olan Afganistan İslam Bankası ile Türkiye'de Katılım Bankacılığı sektörünün karşılaştırmalı olarak incelenmesidir. Bu amaçla Afganistan İslam Bankası ve Türkiye'de Katılım Bankacılığı Sektörünün 2018Q3- 2020Q4 dönemleri için finansal oran analizi yöntemiyle karşılaştırma yapılmıştır. Afganistan İslam Bankasına ait veriler, IBA(Islamic Bank of Afghanistan)'nın web sitesinden, Türkiye'de Katılım Bankacılığı sektörüne ilişkin veriler ise Türkiye Katılım Bankaları Birliği (TKBB) internet sitesinden derlenerek oluşturulmuştur. Çalışmanın önemini Afganistan İslam bankası ile Türkiye'deki İslami finans sektörünün finansal rasyolarının karşılaştırılarak finansal performanslarında önemli farklılıklar olup olmadığının ortaya konulması oluşturmaktadır. Çalışmanın sonuçları Afganistan IBA(İslamic Bank of Afghanistan) İslami Bankasının cari oranının Türkiye'de katılım bankacılığı sektörüne göre daha yüksek olduğunu, Türkiye'deki katılım bankacılığı sektörünün ideal cari orana yakın olduğunu göstermektedir. Borç/özkaynak ve borç/varlık oranının Türkiye'deki katılım bankacılığı sektöründen daha iyi olması IBA'nın borçtan çok öz sermayeyi finanse ettiğini göstermektedir. Aktif karlığı ve özkaynak karlılığı açısından değerlendirildiğinde Türkiye Katılım Bankacılığı sektörünün IBA'dan varlıklarını yönetmede ve mevcut varlıklardan etkin gelir elde etmede daha iyi olduğu sonucuna ulaşılmaktadır."
