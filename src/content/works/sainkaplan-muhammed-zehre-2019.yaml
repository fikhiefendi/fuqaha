abstract: "Muhammed Ebû Zehre'nin Zehretü't-Tefâsir adlı tefsiri özü itibariyle ahkâm tefsiri olarak kabul edilmemektedir. Fakat Ebû Zehre'nin fıkıh alanında uzmanlaşmış olması, eserinde hüküm bildiren âyetleri ele alış yönteminin ortaya konulmasını gerekli hale getirmektedir. Müellifinin vefatı sebebiyle tamamlanamamış olan bu eser, Kur'ân-ı Kerîm'in Neml Sûresi'ne kadar olan kısmının tefsirini içermektedir. Bu sebeple Ebû Zehre'nin yöntem ve yorumları Neml Sûresi'ne kadar olan ahkâm âyetleri çerçevesince ortaya konulmaya çalışılmıştır. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın amacı, önemi, yöntem ve kaynakları hakkında bilgi verilmektedir. Birinci bölümde Muhammed Ebû Zehre'nin hayatı, ilmi yönü, Zehretü't-Tefâsir adlı eseri ve tefsir yöntemi ele alınmaktadır. İkinci bölümde ise müellifin hüküm bildirdiği tesbit edilen âyetler başlıklar halinde incelenmiştir. Yapılan inceleme sonucunda Ebû Zehre'nin Kur'ân'ı, Kur'ân ve Sünnet çerçevesinde tefsir etmeye gayret ettiği, ahkâm âyetleriyle alâkalı kanaâtlerini ise mezheplerin görüşlerini de göz ardı etmeden ortaya koyduğu görülmüştür. Bu yönüyle eser hem rivâyet hem de dirâyet tefsiri özelliği taşımaktadır. Ayrıca Ebû Zehre ele aldığı âyetlerde varılan sonuçların hikmetini açıklamayı ihmal etmemiş, hükümleri neden sonuç içerisinde ele almıştır."
