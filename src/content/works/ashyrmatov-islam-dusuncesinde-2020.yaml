abstract: "İslam filozoflarının ahlâk anlayışlarına genel olarak bakıldığında, insanın iyi davranışları kendinde meleke haline getirmesi, nefsinin olgunlaşması ve mutluluğu elde etmesinin onun varlık, bilgi ve değer alanları hakkında bütüncül yaklaşımlara sahip olması ve nefsinin kötü huylardan arındırılmasına bağlı olduğu görülür. İbn Haldun, toplumların ahvalinde görülen farklılığın, sadece onların geçim yollarının farklı oluşundan kaynaklandığını belirtmektedir. Aynı şekilde insanların geçim yollarından biri olan ticaret faaliyetinin kişinin tabiatı ve ahlakı üzerinde olumsuz etkiler yapacağını ifade etmektedir. Bununla birlikte, kazanç elde etme yollarından olan tarım, sanayiyle uğraşanların dışında, siyasi gücü elinde bulundurarak başkasının çalışması sonucunda geçimini sağlayan kişilerin ahlakının olumsuz yönlerinden de bahsetmektedir. Gelir dağılımının devlet tarafından ekonomik hayatın kendine has kanunlarına göre dengeli ve adaletli gözetilmemesi, hem toplumun ve bireylerinin hoşnutsuzluklarının, topluma ve devlete karşı görevlerini yerine getirmeme arzularının yükselmesine ve aynı zamanda devletin hem de uygarlığın ortadan kalkmasının nedeni olacağını ifade etmektedir. Çalışmamızın birinci bölümünde ahlakın tanımı, konu ve gayesi, İslam filozoflarından Kindî, Râzî, Fârâbî, İbn Sînâ, İbn Miskeveyh ve Tûsî'nin ahlâk anlayışları, iktisadın tanımı, konu ve gayesi, iktisadi sistemler, iktisadi düşüncelerde yeni gelişmeler, iktisat biliminin geleceği ve ahlâk ilişkisi incelenmiştir. İkinci bölümünde ise Mukaddime'nin temel kavramları ve İbn Haldun'un ahlâk anlayışı hakkında bilgi verildikten sonra İbn Haldun düşüncesinde iktisat ve genel olarak toplumsal hayata etkileri incelenmiştir."
