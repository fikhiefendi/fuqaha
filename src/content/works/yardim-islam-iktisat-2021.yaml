abstract: "Modern insanlar, kullandıkları mal ve hizmetlerin neredeyse tamamını dışarıdan temin etmektedirler. İnsanlar artık ihtiyaçlarının çok önemli bir kısmını satın alabilmek adına para ya da ücret karşılığında emeklerini ortaya koymakta yani çalışmaktadırlar. Tarihsel süreç içerisinde para olarak kullanılan şeyler değişim göstermiş ve bu durum günümüzde de devam etmektedir. Genel olarak içsel değere sahip paralardan itibari paralara doğru ilerleyen bu değişim, somuttan soyuta doğru gelişmiştir. Ana akım iktisadi düşünce, parayı bir değer ölçüsü ve bir mübadele aracı olarak değerlendirmenin yanı sıra bir meta olarak görmektedir. Günümüz iktisat düşüncesinde para; bir mal gibi alınıp satılmakta ve ekonomik karar almada sosyal, zihni ve duygusal ön yargılarımızı etkilemektedir. İslam iktisadı ise, paranın kendiliğinden hiçbir görevi yerine getiremeyeceğini söylemektedir. Dolayıyla parayı bir meta olarak değil bir mübadele aracı, bir değer ölçüsü ve değer saklama aracı olarak görmektedir. Para, mübadeleye girdiğinde bir varlığa dönüştüğünde veya bir hizmet satın alındığında fayda sağlamış olmaktadır. Kripto para ve blok zincir teknolojisi ile birlikte gelişen yeni nesil dijital finans sektörü, ana akım iktisadın zararlarının giderilmesi ve kapitalist sistemin boyunduruğundan kurtulabilmesi için“ibaha”ilkesi gereğince İslami finansa hizmet edebilir hale gelebilmektedir. Ayrıca asimetrik bilgi sorununun çözülerek maliyetlerin düşürülmesinde, sosyal dayanışma kuruluşlarında ve ülkelerin kendi aralarında kullanabilecekleri para birimleriyle bağımsız bir para politikası belirlenmesinde bu teknolojiden faydalanılabilmektedir."
