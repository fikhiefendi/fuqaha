abstract: "Sosyal güvenlik kavramı, farklı toplumsal kültürlerde aynı gayenin tahakkuku için farklı müessese ve biçimlerde yorumlanıp uygulanagelmiştir. Çağdaş sosyal güvenlik sistemleri Ortaya çıkmadan önce dünya toplumlarında gözlemlenen uygulamalar, bireylerin hayat boyu çalışmasına, artık çalışamayacak kadar güçten düşen ve/veya yardıma muhtaçlara, aile içi, akrabalar ve mesleki teşekkül içerisi dayanışma veya hayır kurumları çerçevesinde korunmaları esasına dayanmıştır. Zaman içerisinde sosyal güvenlik sistemlerinin ortaya çıkmasının en önemli sonucu, kuşaklar arası geleneksel yardımlaşmayı1 kurumsallaştırması ve devletin sosyal görevleri arasına katmış olmasıdır. Devletin sosyal fonksiyonlarından kaynaklanan bu görev, geçmişte fiilen ya da dolaylı olarak devlet kurumlan vasıtasıyla yürütülmüş ise de, günümüzün değişen demografik ve iktisadî ortamında yeniden yorumlanma ihtiyacı göstermiştir. Sosyal güvenlik hukuku, başlangıçta iş hukukunun bir dalı sayılırken daha sonra bağımsız bir branş haline gelmiş bulunmaktadır. Sosyal güvenlik hizmetlerinin hukukî yapısı genelde sosyal sigortalar ve özel sigortalar şeklinde iki farklı disiplinde zorunlu veya isteğe bağlı olarak gelişmiştir. Sosyal güvenlik müesseseleri içerisinde gelişmiş bir teknik olan sigortanın, ilk olarak, denizdeki rizikolara karşı doğduğu, oradan kara rizikolarına uygulandığı ve hayat sigortasıyla geliştiği görüşü hakimdir. Hayat sigortasıyla, bireyin,“temel hak ve özgürlüklerinin”kapsamı genişletilmesi ve korunması hedeflenir. Bu temel hak mücadelesi sosyal haklardan biri olan sosyal güvenlik hakkını bir insan hakkı disiplini haline getirmiştir. Bireyin temel haklarının güvence altına alınması organizasyonu da hukukî düzenlemeleri zorunlu kılmıştır. İslâm hukuk bilginleri,“genelde sigorta özelde hayat sigortası”hakkında farklı görüşler ileri sürmüşlerdir. Hayat sigortası sözleşmesinin caiz olmadığı görüşünde olanlar, İslâm'ın yasakladığı, kumar ve bahis, garar ve cehalet, ribâ ve faiz gibi, sözleşmeden ayrılmayan vasıfların varlığından hareketle^ daha çok inanç temeline dayalı kaderci bir yaklaşımdan yola çıkarlardır. Bunun caiz olduğu görüşünde olanlar ise; temel ve talî kaynaklardan hareketle tek, iki ve çok taraflı benzer hukukî ilişkilerle kıyaslayarak, daha çok sözleşme serbestisi ilkesi gereği, hakkında yasaklayıcı nass da bulunmayan, kendine özgü niteliği olan yeni bir sözleşme sayarak görüşlerini temellendirmişlerdir."
