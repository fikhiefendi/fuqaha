abstract: "Bir kısım muhaddis, Hz. Peygamber'in hadislerini nakletme ve sıhhat açısından değerlendirmenin yanında ehl-i re'y tarafından oluşturulan fıkha karşı hadis merkezli fıkıh faaliyeti yürütme çabalarına da girişmiştir. Bu bağlamda onlar bir hadisin sıhhati tespit edildikten sonra naklî veya aklî olsun başka bir delile arz edilmediği bir metodoloji olarak tarif edilen fıkhü'l-hadis ilminin teşekkülünü sağlamışlardır. Ehl-i hadisin belirgin şekilde fıkhü'l-hadis faaliyetlerini hadis edebiyatı ürünleri üzerinden yürüttüğü görülmektedir. Tasnif edilen cami' ve sünen türü eserlerden bazıları sadece hadis rivâyetini barındırmamış ayrıca ihtiva ettiği hadisler üzerinden fıkhü'l-hadisi de içermiştir. İşte bu özellikteki eserlerden birisi de Ebû İsa et-Tirmizî'ye ait olan Cami'dir. Bu çalışmada Tirmizî'nin düşünce yapısı incelenmiş, Cami'deki takip ettiği usûlü ve tavırları üzerinden onun fıkhü'l-hadis disiplinine göre konumu tespit edilmeye çalışılmıştır. Bunun yanı sıra Tirmizî'nin, eserinde görüşlerini naklettiği âlimlerin listesi çıkarılmış ve bu listenin âlimler tasnifindeki yeri başka eserlerle mukâyese edilerek belirlenmiştir. Yapılan araştırmalar neticesinde Tirmizî'nin fıkhü'l-hadis disiplini çerçevesinde hareket eden ehl-i hadis tavra sahip bir âlim olduğu kanısına ve ayrıca onun, eserinde ehl-i hadise mensup fakihlerin görüşlerini nakletmeyi öncelediği neticesine ulaşılmıştır. Ehl-i hadis fakihler olarak bilinen bu âlimler, çalışmada“fakih muhaddis”kavramıyla ifade edilmiştir."
