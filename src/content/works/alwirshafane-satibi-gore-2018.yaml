abstract: "Al Şâtıbi, istihsanı, üzerine Şer'i hükümlerin bina edildiği bir delil ve önemli bir kaynak kabul etmiştir. Şeriat; fiillerin maksadına bakmayı, muteber maslahata öncelik vermeyi ve gerçekleşmesi kesin veya genellikle gerçekleşen bir zararı savmayı getirmiştir. Al Şâtıbi'nin istihsan anlayışı, umûmi veya külli bir delile karşılık cüz'i maslahatı almaktır. Bu anlayış bazen kıyasa rağmen mürsel istidlale öncelik vermeyi gerektirir. Bu konudaki temel dayanak, Hüküm Koyucu'nun“maslahatları elde etmek ve zararı savmak”şeklinde bilinen amacıdır. Al Şâtıbi, istihsanı on çeşit saymış ve şu şekilde sıralamıştır: Nass'a dayanan bir delil sebebiyle veya iki kıyastan daha güçlü olanı almak suretiyle genel olanı terk etmek veya Nass'ta mevcut olan hükmün muhtemel illetini gerçekleştirmek veya örf sebebiyle genel olanı terk etmek veya maslahat için veya icma için terk etmek, küçük ve önemsizi dikkate alarak terk etmek veya baskın olanın çıkışına çıkan (genellikle söylendiği için söylenen) kuralı için veya sıkıntıyı zorluğu gidermek için ve ihtilafı dikkate almak suretiyle terk etmektir. Araştırma istihsan ile bidat arasındaki fark ve onun Şatibi'ye göre makasıdla ilişkisini de belirtmiştir. Çalışma, Al Şatıbi'nin fetvalarında geçtiği gibi İstihsanı kabul etme metodu hakkında detaylı konular ve örnekler içermektedir. Son kısım istihsanı şer'i önemli bir delil kabul ederek hüküm verilen bazı güncel problemler ele alınarak bitirilmiştir. Bu hükümler Al Şâtıbi'nin istihsan kurallarına göre konulmamış olsalar da onun görüşüne uygun oldukları ortaya kondu. Araştırma sonuçla, öncekilerin yazdıklarından ilim talebelerinin faydalanması için eski ve çağdaş alimlerin, özelliklede onlardan yenilikçi olanların metotları üzerinde bu gibi çalışmaların yapılması ve onların kurallarını çağdaş duruma bağlamayla ilgili tavsiyelerle sona erdi. الرسالة تتناول الاستحسان كأحد أصول الفقه، وذلك عند أحد أبرز علماء الإسلام، والذي كانت بصمته واضحة في التجديد الأصولي، وأثّر في كل من جاء بعده، حيث اعتبر الشاطبي الاستحسان حجة وأصلا مهما تُبنى عليه الأحكام الشرعية، فالشرع جاء بالنظر في مآلات الأفعال، وتقديم المصلحة المعتبرة، ودرء المفسدة المحققة أو الغالبة. ومفهوم الاستحسان عند الشاطبي هو الأخذ بمصلحة جزئية في مقابل دليل كلي أو عموم، ويقتضي هذا أحيانا تقديم الاستدلال المرسل على القياس، والأصل في ذلك ما عُلم من قصد الشارع إلى جلب المصالح، ودرء المفاسد. وعدّ الشاطبي الاستحسان أنواعا عشرة، ابتدأها بترك العموم بدليل نصّي، أو أخذا بأقوى القياسين، أو تحقيقا لمناط الحكم المحتمل في النص، أو تركه للعرف، أو للمصلحة، أو للإجماع، وتركه لاعتبار اليسير التافه، أو لقاعدة ما خرج مخرج الغالب، أو لرفع الحرج والمشقة، وتركه لمراعاة الخلاف. كما ذكر البحث الفرق بين الاستحسان والبدع، وعلاقته بالمقاصد عند الشاطبي. واشتمل البحث على مسائل وأمثلة مفصلة عن منهج الشاطبي في اعتبار الاستحسان كما ورد في فتاواه، واختتم الفصل الأخير ببعض المسائل المعاصرة، جرى فيها الحكم باعتبار الاستحسان دليلا شرعيا مهماً، وأوضح أن ما حُكم فيها إن لم يكن مأخوذا من قواعد الشاطبي في الاستحسان فهو متوافق مع ما يراه. وانتهى البحث إلى خاتمة وتوصيات بإجراء مثل هذه الدراسات في مناهج العلماء المتقدمين والمعاصرين، ليستفيد طلبة العلم مما سطره الأوائل، وخاصة المجددون منهم، وربط قواعدهم بالواقع المعاصر"
