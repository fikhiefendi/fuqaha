abstract: "Selem akdi, akit esnasında özellikleri belirlenmiş madum bir malın, belli bir vadede temin edilip müşteriye teslim edilmek üzere, peşin bedel karşılığında satılmasını konu edinir. Akdin vade içermesi ve henüz tahsil edilmemiş şeyleri konu edinmesi, İslam hukukunda kredileşmeye imkan tanıyan model akitlerden biri olmasını mümkün kılar. Çalışmamızda, ma'dum'u konu edinmesiyle sisteme aykırı olarak nitelenen bu akdin mahiyeti incelenmiş, vadeli olup deyni konu edinmesinden dolayı, İslam'ın iki temel yasağı olan“deyn'in deyn karşılığı satımı”ve“riba”dan akdi koruma düşüncesi etrafında oluşturulan şartları incelenerek, diğer ivazlı akitler arasındaki yeri netleştirilmeye çalışılmıştır. Selem akdinin, cins borcunu konu edinmesiyle ivazlı akitlerin prototipi bey akdinden ayrıldığı temel noktalarına değinilerek, kabzdan önce tasarruf yasağı çerçevesinde, akdin konusuna ilişkin tasarruf biçimleri incelenmiştir. Ma'dumu konu edinmesiyle riskli bir işlem haline gelen bu akitte, îfâ esnasında, akdin konusu, teslim zamanı ve teslim yeriyle ilgili ortaya çıkabilecek problemler incelenmiştir. Son olarak selem akdi ile bey, istısna, karz, sarf, icare ve cuale gibi akitler mukayese edilerek, özellikle istısna, bey ve icare akitlerinin selem akdiyle olan organik bağlarına değinilmiştir."
