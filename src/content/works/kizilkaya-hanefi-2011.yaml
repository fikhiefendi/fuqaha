abstract: "Fıkıh ilmi içerisinde zamanla ahkâm-ı sultâniyeden fetvâya, usûlden furûka, şerh ve hâşiyeden muhtasara uzanan değişik yazım türleri ortaya çıkmıştır. Konuları ele alış yöntemleri, yöneldikleri ana hedefler ve işlevleri bakımından birbirlerinden farklı olan bu yazım türleri, fakîhlerin geniş bir zaman dilimi içerisinde ortaya koydukları çabalara dair zengin bir literatür oluşturmaktadırlar. Aynı fıkıh düşüncesine mensup fakîhlerin kendilerinden önceki kuşaklardan devraldıkları miras üzerinde yapmış oldukları çalışmaların semeresi olan bu alt edebî türler, aynı zamanda fıkıh ilminin her dönemde dinamik bir yapıya sahip olduğunu ve değişik asırlarda ortaya konan fıkhî çabaların çeşitli ürünler ortaya çıkardığını göstermektedir. Fer`î ahkâm ile bunların dayanmış olduğu asıllar arasındaki ilişkiyi inceleyen kavâid edebiyatı da bu yazım türlerinden biridir.Bu çalışmada, fıkhın önemli edebî türlerinden biri olan kavâid ilmi Hanefî mezhebi özelinde incelenmektedir. Bu çerçevede ilk bölümde kavâid, bir kavram olarak analiz edilmiş; ilgili olduğu terimler ve ilim dalları ile mukayese edilmiştir. İkinci bölümde kavâid düşüncesine zemin hazırlayan ve birçok fıkhî yazım türüne kaynaklık eden fıkıh metinleri, muhtasarlar, şerhler ve fetvâ kitapları başta olmak üzere kâidelerin çokça kullanıldığı Hanefî kaynaklarda fıkhî kâidelerin izi sürülmüştür. Bunu yaparken fıkhî kâidelerin uygulama alanları, kendilerine müracaat edilme gerekçeleri, ne şekilde kullanıldıkları ve müstakil tedvine nasıl zemin teşkil ettikleri üzerinde durulmuştur. Kavâidin müstakil bir disiplin olarak incelendiği son bölümde ise öncelikle dört Sünnî mezhep esas alınarak kavâid literatürünün tarihsel gelişim süreci ele alınmış, ardından Hanefî kavâid eserleri içerik ve metot açısından analiz edilmiştir."
