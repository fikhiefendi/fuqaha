abstract: "Bu çalışma, Türkiye'deki katılımcı bankalarda yatırım hesaplarına ilişkin hukuki görüşlerin ve bunların ekonomik etkilerinin belirlenmesi ve enflasyonun yatırım hesapları üzerindeki etkisinin boyutunun ortaya çıkarılmasını amaçlamıştır. yaklaşımla incelenmiş ve araştırmada şu sonuçlara ulaşılmıştır: •Yatırım hesapları, hesap sahibinin Katılımcı Banka ile ilişkisi açısından Mudaraba sözleşmesi sayılır. •Türkiye'de MS 2019'dan MS 2023 Mart ayına kadar olan dönemde enflasyonu telafi edecek belirli bir kalıp bulunmamaktadır. •Enflasyonun yüksek olduğu aynı dönemde önemli ölçüde artan yükümlülükler hariç olmak üzere, katılımcı bankaların konsolide tablolarındaki ana hesaplar ile enflasyon oranı arasında bir bağlantı olup olmadığı açık değildir. • Türk katılım bankalarının yüksek enflasyon koşullarına uyum sağlamak için aktif kalitesinin ve finansal yönetiminin iyileştirilmesi, faaliyet verimliliğinin ve yenilikçiliğin artırılması, finansman kaynaklarının, faaliyetlerinin ve pazarlarının çeşitlendirilmesi, katılım bankaları arasındaki iş birliğinin geliştirilmesi gibi önlemler alması gerekmektedir."
