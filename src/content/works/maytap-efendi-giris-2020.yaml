abstract: "Bu çalışmada Şeyhülİslām Çatalcalı 'Ali Efendi'nin Fetevā-yı 'Ali Efendi adlı eserinin 1b- 30b varakları arasındaki bölümler incelenmiştir. Bu varakların çeviri yazısı yapılmıştır. Eser imlâ, ses ve şekil bilgisi bakımından incelenmiştir. Çalışma; Giriş, İnceleme, Metin, Dizin, Tıpkıbasım olmak üzere beş bölümden oluşmaktadır. Giriş bölümünde; eserin türü, eserin adı, yazılış amacı, yazarı, yazılış tarihi, eserin konusu ve içeriği, eserin tespit edilen nüshaları, eserin hazırlanmasında dikkat edilen hususlar hakkında bilgi verilmiştir. İnceleme bölümünde yazılış özellikleri, ses bilgisi ve şekil bilgisi hakkında bilgiler verilmiştir. Metin bölümünde eser, sayfa numaraları verilerek çeviri yazıya aktarılmıştır. Dizin bölümünde kelimeler alfabetik sıraya göre dizilmiştir. Çalışmanın sonuna eserin tıpkıbasımı konulmuştur."
