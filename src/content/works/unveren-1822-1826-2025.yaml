abstract: "Osmanlı toplumsal tarihi araştırmalarında zaman, mekân ve insan ölçeğini kesintisiz ve bütüncül bir bakış açış ile inceleyebilmek için şer'iyye sicilleri önemli bir yere sahiptir. Ait oldukları şehir ve kazaların çok boyutlu fotoğrafını çeken bu belgeler yerel tarihin aydınlatılması ve Osmanlı yönetim anlayışının doğru anlaşılmasında orijinal veriler sunar. Sicillerde yer alan bilgiler Osmanlı toplumsal tarihi alanında yapılan çalışmalarda mekânsal bağlamda toplumun topografyasını resmederken zamansal bağlamda ait olduğu dönemin öncesi ve sonrasını mukayeseli bir şekilde incelenmesine imkân sağlar. Çalışmamızın konusu kapsamında olan 4 numaralı Nevşehir şer'iyye sicil defteri de bu önem göz önünde bulundurularak incelenmiş ve değerlendirilmiştir. Çalışma, 4 numaralı Nevşehir şer'iyye sicilinin transkripsiyon, özet ve değerlendirmesinden oluşmaktadır. Sicilde Nevşehir'in o dönemdeki mahalle ve köy isimleri, şahıs isimleri, nüfus durumu, toplumsal düzen ve asayiş, toplanan vergiler, sefer hazırlıkları, İstanbul'un iaşesinin sağlanması ile ilgili merkezden gelen emirler, Rumeli'de devam eden isyanların bastırılması için gönderilecek askerlerin listeleri, tereke kayıtları, miras paylaşımları, fiyat uygulamaları, akçe değeri ile ilgili emir suretleri, alacak verecek hususları gibi durumların çözümü ve alınan kararların uygulanışına dair bilgiler yer almaktadır. Sicil ayrıca merkezi otoritenin yerel hayata etkisi, toplumsal sınıflar arası ilişkiler ve ekonomik durum gibi konularda Nevşehir tarihinin aydınlatılmasında yeni bilgiler sunmaktadır."
