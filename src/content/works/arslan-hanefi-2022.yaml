abstract: "Bu araştırmada Hanefî fıkhı şerh geleneği içerisinde yer alan el-Hidâye şerhleri ele alınacaktır. Bu çalışma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde öncelikle çalışmanın kapsamı belirlenecek, önemi, amacı ve yöntemi üzerinde durulacaktır. Birinci bölüm, el-Hidâye müellifi el-Merginânî'nin hayatı, ilmî kişiliği, eserleri, el-Hidâye'nin fıkıh literatürü içerisindeki yeri, kaynakları ve üzerinde yapılan şerh, hâşiye, ta'lik gibi çalışmalar ile bu çalışmaları yapan âlimler hakkında verilen bilgilerden oluşacaktır. Ayrıca ulaşabildiğimiz kadarıyla bu çalışmaları yapan âlimlerin hayatı, ilmî kişiliği ve eserleri hakkında özet mahiyetinde bilgiler yer alacaktır. İkinci bölüm, şerh kavramı, şerh yazımının tarihçesi ve Hanefî şerh geleneği hakkında olacaktır. Bununla birlikte usûl-i fıkıh şerh geleneği ile fürû-i fıkıh şerh geleneği içerisinde yer alan önemli eserler zikredilecektir. Ayrıca içerik ve metod bakımından el-Hidâye şerhleri, şerhlerde başvurulan kaynaklar ve şerhleri etkileyen unsurların yer aldığı konular ile ilgili olacaktır. Son bölümde el-Hidâye şerhlerinin fıkhın gelişimine katkısı ele alınacaktır. Bu çerçevede şerhlerin terimleşmeye katkısı, fıkhî meseleler ve şârihlerin tercihleri ve el-Hidâye'de tespit edilen hatalar yer alacaktır. Araştırma neticesinde elde edilen bulguların yer alacağı \"Sonuç\" bölümü ile çalışma sona erecektir. Anahtar Kelimeler: Hanefî mezhebi, el-Hidâye, Merginânî, Hâşiye, Şerh, Şerh geleneği."
