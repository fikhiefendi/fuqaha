abstract: "1908 yılında ilan edilen II. Meşrutiyet, siyasi açıdan olduğu kadar Türk basın yayın tarihi açısından da dönüm noktasıdır. Sırât-ı Müstakîm Mecmûası'nın, yayın hayatına başlaması da 1908 yılında ilan edilen II. Meşrutiyet'e denk gelmiş, 1912 yılında isim değişikliğine uğrayarak Sebîlürreşâd adıyla 1925 yılına kadar varlığını sürdürmüştür. İslam Mecmûası ise 1914-1918 yılları arasında yayımlanmıştır. Dergiler, bu süreçler boyunca İslâmî düşünce yapısına sahip yazarların fikirlerini herkesle paylaştığı bir mecra halindedir ve yayım hayatları boyunca dönemin dini, siyasi, ilmi, ahlaki ve toplumsal sorunlarını titizlikle ele almış, özellikle din karşıtı yıkıcı düşünce akımlarına karşı büyük bir mücadele ortaya koymuştur. Basın yayının elde ettiği bu fikir özgürlüğü aynı zamanda o güne kadar görülmeyen geniş kapsamlı bir tartışma ortamının doğmasına sebebiyet vermiştir. Özellikle İslâm hukuk tarihinde 19. yy.'a kadar mezhep kavramı etrafında şekillenmiş fıkhî anlayışın, bu süreçte, Batı düşüncesinin de etkisiyle, dergilerde bazı yazarlar tarafından, mezhepler üstü bir anlayışa evrilmeye çalışılması, klasik fıkıh anlayışına sahip yazarlar tarafından tepki almış ve tartışmalar başlatmıştır. Çalışmamızın amacı, yayın hayatına başladıkları ilk günden 1930 yılına kadar dergilerde yer alan İslâm Hukuk Usûlü ve Fıkıh konularında kaleme alınan makaleleri tespit edip; dönemin dini, siyasi, fikri yapısını, yazarların fikri yönelişlerini dikkate alarak değerlendirmek ve dergiler arasında tartışılan fıkhî konuları saptamaktır."
