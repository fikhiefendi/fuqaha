abstract: "Şarih Mübârekfûrî (rahimahullah)'ın ''Tuhfetü'l-Ahvezî Şerh Câmiu't-Tirmizî'' kitabında“fîhi nazar”sözü çokça yer almaktadır. Şarih bu sözüyle, yaptığı karşılaştırma, analiz ve çıkarsamalardan sonra yazarın düşüncesine muhalif görüş beyan etmektedir ki buna“taakkub”adı verilir. Bu taakkub, yukarıda belirtildiği gibi bazen dolaylı bir şekilde bazen de ima şeklinde olur. Şarih bu gibi yerlerde, alimlerin konuyla ilgili sözlerini bazen yorumlamış bazılarını da yorumlamadan yazmıştır. Bu çalışmada, Tirmizînin Sünen'inin Taharet ile Namaz bölümlerinde geçen taakkublar üzerinde durularak konu hadis ilmi açısından ele alınmış, sonunda da iki görüşten daha doğru olanı ortaya konulmuştur. Yaptığımız incelemeler sonucunda araştırmacılar tarafından, İmam Tirmizi ile İmam Mübârekfûrî'nin taakkubları arasında şimdiye kadar herhangi bir karşılaştırmalı çalışmaya rastlanmamıştır. Yalnızca bir Yüksek lisans tezinde konu özet bir şekilde zikredilmiştir. Müellif, Mübarekfûrî'nin bazı konularda İmam Tirmizî'ye itirazındaki yaklaşımını açıklamış ve bazılarından örnek olarak bahsetmiştir.. Bu çalışma üç bölümden oluşmaktadır. Birinci bölüm, İmam Tirmizî ile İmam Mübârekfûrî'nin hayatı ve çalışmamıza dahil ettiğimiz kitapları tanıtılmıştır. İkinci bölümde ise Mübârekfûrî'nin taakkubdaki usulü, düşüncelerini ispat metodu ve dayandığı kaynaklar zikredilmiştir. Üçüncü bölümde ise, söz konusu bölümlerde taakkuba konu teşkil eden hususlara yer verilmiştir. Bu bölümde 24 meselenin incelemesi yapılmıştır. Bunların bir kısmı hadisle, bir kısmı fıkıhla, bir kısmı da dil/lügat ile alakalıdır."
