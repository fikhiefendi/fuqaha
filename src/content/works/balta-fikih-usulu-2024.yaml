abstract: "Her inancın temelini ve yapı taşını oluşturan bir nesil vardır. İslam'ın yerleşmesi ve yayılmasında etkin rol oynayan nesil de sahabadir. Onların bu dine katkıları müsellem bir hakikat olmasına rağmen zaman zaman bu din-i mübine zarar vermek isteyen bazı kimselere onlara yönelik birtakım olumsuz tavır ve haksız tenkitlerde bulunmuşlardır. Bu eleştiriler objektif bir perspektiften bakıldığında pek de isabetli olmadığı görülecektir. Bu bağlamda Fıkıh Usulü Zaviyesinden Sahabenin Tanımı ve Adaleti isimli çalışmamızda önce sahabeye ilişkin kavramsal boyutu ve bu çerçevede konu hakkında yapılan ihtilafları ele aldık. Ardından büyük günahlardan kaçınmak ve küçük günahlarda ısrar etmemek şeklinde tanımlanan adaleti sahabenin adaleti ile ilişkilendererek hadislerin sıhhat şartlarından biri olan ravinin adaletini irdelemeye çalıştık. Çünkü sahabenin adaletinin ta'n edilmesi ilk kaynağın tezyifine sebep olmaktadır. İşte tam bu husus konunun ehemmiyetini ortaya koymaktadır. Sahabilerin hepsi adil mi? Adaletten kasıt nedir? Onlar hakkında ileri sürülen şüphelerin gerçeklik değeri nedir? Gibi sorular bu tezde cevaplandırılmaya çalışıldı."
