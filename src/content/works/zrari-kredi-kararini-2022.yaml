abstract: "Dünyanın zamanla gelişmesi bireylerin ve firmaların da finansal ihtiyaçlarının artmasına neden olmaktadır. Bireyler ve firmalar, söz konusu finansal ihtiyaçların karşılanabilmesi için finansal kuruluşlara başvururlar. Finansal ihtiyaçlarının giderilmesi için finansal kuruluşlara yapılan taleplerin çoğu kredi şeklinde olmaktadır. Çalışmanın temel amacı; Finansal kuruluşlardan olan bankaların, yapılan kredi taleplerini değerlendirirken, kredi kararlarını rasyonelleştirmek için bir araç olarak finansal analize ne ölçüde güvendiklerini belirlemektir. Çalışmada örneklem olarak, Kuzey Irak bölgesinde yer alan bankalarda çalışan 100 kredi görevlisi üzerinde bir pratik çalışma yapılmıştır. Bu çalışmada verileri işlemek ve değişkenler arasındaki ilişkileri bulmak için istatistiksel analiz programını (SPSS) kullanılmıştır. Yapılan analiz sonucunda elde edilen bulgulara göre, her iki bağımlı değişken olan kredi başvuru sahibi ile ülkenin genel ekonomik ve siyasi durumu ve bankalar ile ilgili faktörler, bağımsız değişken olan kredi kararının rasyonelleştirilmesi arasında pozitif korelasyon olduğu ve bağımsız değişken olan kredi kararının rasyonelleştirilmesinde bir etkisi olduğu tespit edilmiştir."
