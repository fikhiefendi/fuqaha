abstract: "Osmanlı Devleti tarih sahnesine çıktığı ilk günden itibaren yargılama sistemine, yargılama sujelerine ve tebaasını oluşturan gayrimüslimlerin haklarına ayrı bir hassasiyet göstermiştir. Adalet sisteminin temel kaynağını İslam hukuk sisteminden alan Osmanlı, zamanın şartlarına ve değişen dünya düzenine göre adalet sisteminde ıslahatlar yapmaktan çekinmemiştir. Yargı sistemine en derin etki eden husus ise Tanzimat süreci olmuştur. Tanzimat ile birlikte Osmanlı, ıslahatlarını gerçekleştirebilmek adına yüzünü batıya dönmüş, İslam dini hükümleri ile ceza yargılamaları açısından ikili bir sentez sağlamaya çalışmıştır. Klasik dönemde şer'iyye mahkemeleri tarafından yapılan yargılamalarda günümüze benzer bir şekilde ceza davaları ve hukuk davaları ayrımı yapılmamıştır. Osmanlı kadısı önüne gelen tüm uyuşmazlıkları şer'i ve örfi hukuk kuralları kapsamında çözümlemeye çalışmıştır. Islahat arzusu ile birlikte devlet teşkilatı değişmiş, tek hakimli yargılama sisteminden vazgeçilerek meclis rolünde yargılamaya ehil makamlar kurulmuş, nizamiye mahkemelerinin yıllar içerisinde şer'iyye mahkemelerinin üzerine çıkarak asıl mahkeme rolünü üstlenmiş, Tanzimat Ferman'ındaki kazanımların korunması amacıyla şeriata uygun bir şekilde batılı kanunlar iktisap edilmiş, verilen kararların hukuka uygunluğunun denetlenmesi amacıyla sistematik kanun yolları tahsis edilmiş, savcılık ve avukatlık gibi mesleklerin ortaya çıkmasına olanak tanınmıştır."
