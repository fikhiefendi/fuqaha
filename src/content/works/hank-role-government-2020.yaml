abstract: "Bu çalışma, Cezayir'de İslami bankacılık sektörünün geliştirilmesi ve ilerlemesinde Cezayir ‎hükümetinin rolünü ele almayı ve aynı zamanda İslami bankacılığın mevcut durumda yasal ve ‎düzenleyici çerçevelerin eksikliği gibi durumlarda hükümetin rolünü değerlendirmeyi ‎amaçlamaktadır. Araştırmacı, Cezayir'de İslami bankacılık hizmetleri sunan iki banka olan ‎Albaraka Bankası ve Selam Bankası ile İslami pencereye sahip olan Gulf Bankası'nı ‎inceleyerek örnek olay çalışması olarak Cezayir'i seçmiştir. Bu çalışmada, bankacılık yasal ‎çerçevesiyle ilgili bilgi toplanıp Cezayir'deki İslami bankacılık uzmanlarıyla kişisel ‎görüşmeler yapılarak nitel yöntem kullanılmıştır. Çalışmada iki İslami bankanın ve İslami ‎pencerelerin‏ ‏karşılaştığı engellerin yasal ve düzenleyici olmak üzere iki kısma ayrıldığı ‎vurgulanmaktadır. Çalışma, bu iki engelin bulunmasının nedeninin, Cezayir hükümetinin ‎siyasi irade eksikliği olduğunu göstermektedir. Çalışma aynı zamanda bu engelleri ortadan ‎kaldırmanın en kolay yolunun hükümetin elinde olduğunu da göstermiştir. Çünkü yasama ‎organının görevlerinden biri de İslami bankacılığa özel olarak veya Cezayir Merkez Bankası ‎teklifi yoluyla ve hükümet tarafından onaylanmasıyla mevzuat oluşturmaktır. Aynı durum ‎hükümetin düzenleyici rolü için de geçerlidir. Merkez bankası, işlevi ülkenin bankacılık ‎alanını yönetmek olan bir devlet organı olduğundan, hükümet onun aracılığıyla İslami ‎bankaların uygun bir atmosferde faaliyet göstermesine olanak tanıyan yasal yönlendirme‏ ‏ve ‎değişiklikler çıkarabilir. Çalışma, İslami bankacılık deneyiminin başarısının nedenlerinden ‎birinin, siyasi iradenin mevcudiyeti ve hükümetin özellikle İslami bankacılık sistemini ‎destekleme ve onun faaliyetlerini geleneksel mali kanunların kısıtlamalarından kurtarma ‎konusundaki ilgisi olduğu sonucuna varmıştır. İslami bankacılık için yasal bir çerçevenin ‎mevcut olması, Merkez Bankası'nın Cezayir'deki İslami bankaları akredite etmesine ve ‎düzenleyici rolünü herhangi bir engelle karşılaşmadan yerine getirmesine olanak tanımaktadır.‎"
