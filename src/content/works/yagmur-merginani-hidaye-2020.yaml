abstract: "Karahanlılar dönemi Maveraünnehir âlimlerinden olan ve yaşadığı bölgenin önde gelen âlimlerinden ders alarak Hanefî mezheb ekolünde önemli bir seviyeye ulaşan Ali bin Ebi Bekr el-Merğînânî'nin el-Hidâye adlı eserinde İmâm Mâlik'e nisbet ettiği görüşlerin değerlendirilmesi yapılmıştır. Asırlar boyu Hanefî mezhebine tabi olan medreselerde okutulan bu kitap günümüzde de el-Ezher üniversitesinde ders kitabı olarak okutulmaktadır. İslam dünyasında bu denli öneme sahip olan bu eserle ilgili çalışma yapmamızın amacı Hanefi mezhebi dışındaki mezheplere de atıfta bulunan el-Merğînânî'nin farklı sebeplerle de olsa hatalı aktarımlarını tespit edip bu kitap ile ilgili ilmî çalışmalara katkı sağlamaktır. Üç bölümden oluşan çalışmamız; Birinci bölümde İmâm Mâlik'in ve Merğînânî'nin hayatları ele alınmış ve el-Hidâye eseri hakkında genel bilgi verilmiştir. İkinci bölümde el-Hidâye'nin ibadetler bölümünde İmâm Mâlik'e nisbet edilen görüşlerin tespiti ve değerlendirilmesi yapılmıştır. Üçüncü bölümde ise elHidâye'nin muamelat bölümünde İmâm Mâlik'e nisbet edilen görüşlerin tespiti ve değerlendirilmesi yapılmıştır. Sonuç olarak Merğînânî'nin toplam seksen dokuz konuda İmâm Mâlik'e nispet ettiği bunların yirmi beşinin hatalı olduğu tespit edilmiştir. Anahtar Kelimeler Fıkıh, ibadet, muâmelât, İmâm Mâlik, Merğînânî, el-Hidâye"
