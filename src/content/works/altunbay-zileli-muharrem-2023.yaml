abstract: "Biyolojik olarak kadınlar erkeklerlen farklı olarak hayız ve nifas gibi özel hâller yaşamaktadırlar. Kadınların bu özel hâlleri ibadetlerin fıkhî boyutu noktasında özel hükümlere ve fetvalara ihtiyaç duyurmaktadır. Bu ihtiyacı gören Zileli Muharrem Efendi 16. asır Osmanlı kadınlarının sormaya utandıkları bu özel halleri ile ilgili sorularına cevap vermek ve onları bu konularda bilgilendirmek amacıyla Türkçe, dili sade, anlaşılır ve halkın lehçesi ile bir eser kaleme almıştır. 'Umdetü'n-nisâ isimli bu eser, ilk Osmanlıca yazılmış ilmihal olması, bugünün kadınlarının da özel durumları ile ilgili sorularına cevap verme özelliğine sahip olması ve yazma halde bulunması nedenleriyle tez konusu olarak tercih edilmiştir. Kütüphanelerde yazma eser olarak bulunan bu eser latinize edildi ve eserin edisyon kritiği, değerlendirilmesi yapıldı. Eserin müellifi Zileli Muharrem Efendi, 16. asırda Zile'de yaşamış olan Osmanlı mutasavvıf ve fakihlerindendir. Arapça, Farsça ve Türkçe farklı alanlarda pek çok eser telif etmiştir. Muharrem Efendi, eserini dört bâbdan, altı fasıldan ve bir hâtimeden oluşturmuştur. Hayız, boşanmış kadının iddeti, iki hayız arasında temiz kalnan süre, kadının alışılagelen âdeti, hünsâ, nifas ve düşük konusu, istihâza, özürlülere ait hükümler, eşler arasındaki haklar, çocuğu olmayan ve düşük yapan kadınlara ilaçlar konularını ele almıştır. Hükümleri ağırlıklı Hanefi mezhebine göre vermekle birlikte zaman zaman hem mezhep içerisindeki farklı görüşlere hemde farklı mezheplerin görüşlerine yer vermiştir. Görüşleri verirken de klasik Hanefi kaynaklarına atıfda bulunmuştur."
