abstract: "Konvansiyonel ekonominin sınırsız olasılıklarının maddi refah getireceğine dair ilkesel değeri, sınırsız isteklere ve faydacı büyümeye dayanır. Bu değerin görsel refah ölçütü ise modadır ve büyümenin finansmanı, değişimin zorunlu faktörü ve itici gücü olan sürekli yeniliği mümkün kılan moda trend döngüsüyle karşılanır. Ekonomik ilişkilerin finansallaşması ile manipüle edilen değer algısı, moda dinamikleri tarafından, malları reel ekonominin alanından finansın yörüngesine iletir. Maddi ilerlemeci düşünce yapısı; arzda ve talepte ihtiyaç ekonomisinin kuralları dışında, sınırsız isteklerin motor gücüyle çalışan, yeni endüstriyel düzenin temellerini; sosyo-kültürel ve ekolojik sorunların kaynağı olan sosyal sermaye ve rekabet dinamikleri üzerine kurar. Ekonomik büyüme teorisi ilkeleri, Arz-Talep Kanununun ekonomiyi tek bir parametreye indirgeyen kalıplarıyla analiz sürekli yenilenmenin, bireysel-sosyal ve çevresel maliyetlerini maddi ilerleme uğruna feda eder. Marjinal fayda ekonomisin statik analizleri ekonomik büyüme, kalkınma ve refah analizlerinde ikincil etkiye sahiptir. Bu nedenle salt pozitif bilimlerin sabit formülleri, statik karakterli analizleri ve ortodoks bilimsel şablonları modanın doğasını ve dinamik döngüsünü açıklamada sınırlıdır. Moda ekonomisi, Arz-Talep Kanunu'nun psikolojik ve sosyolojik eşdeğerlerinin sayısız etkileşimlerini, modaya özgü hareket dinamiklerine ilişkin farklı disiplinlerin değerlendirmeleri bağlamında niteliksel metodolojik analizi gerekli kılar. Finansallaşmanın etkisi sonucunda isteklerin, ihtiyaçlar olarak algılanmaya başlamasıyla; soyut-duyumsal niteliklerin, sosyal yatırım değerinin, finansal ve sosyal getirinin önemi arttırmıştır. Ancak lüks değerler anlayışının çıkarlarını koruyan ve maddi rekabet ilkelerine dayanan modern moda ekonomi sistemi, toplum ve çevre sorunlarının nedenidir. İrrasyonel eğilimlerin egemenliğinde statü çıkarımını tetikleyen yenilenme isteğini ihtiyaç olarak güdüleyen arz-talep döngüsü ile büyümenin niteliksel sonuçlarında geçici refah duygusunun sıfır çarpan etkisi, geride kazançların ve kayıpların eşit olduğu sıfır toplamlı veya kayıpların kazançları aştığı bir değer bırakır. Geri dönüşü olmayan statü-simgesel üretimin ve tüketimin; müşterek ve kalıcı refaha negatif etkisi, paradigma değişimini gerektirir. İnsan varoluşunun temel yasaları ve temel ihtiyaçlar, esası teşkil eder ve kısır statü rekabetini tetikleyen her sistemsel çaba, refaha etkileri bakımından faydasız rekabeti tanımlar."
