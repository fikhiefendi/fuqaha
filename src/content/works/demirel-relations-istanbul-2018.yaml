abstract: "Bu tezin temel amacı Millî Mücadele döneminde Türk Milliyetçilerinin hem İstanbul Hükümetleri hem de İtilaf Devletleri ve Sovyet Rusya ile kurduğu ve dönemin İstanbul ve Anadolu'da yayınlanan gazetelerine yansıyan ilişkilerini analiz etmektir. Bu bağlamda, Milli Mücadelenin dini-hukuki ve diplomatik-askeri meşruiyeti özel olarak ele alınmıştır. Türkçe İstanbul, Alemdar ve Peyam-ı Sabah, gibi üç milliyetçi karşıtı gazete istisna, İkdam, İfham, Tasvir-i Efkar, Vakit, İleri, Yeni Gün, Akşam, Hadisat, Öğüt, Albayrak, Açıksöz, İrade-i Milliye, İzmir'e Doğru ve Hakimiyet-i Milliye gibi hem İstanbul hem de Anadolu'da yayınlanan en etkili milliyetçi gazeteler, İstanbul hükümetlerinin ve İtilaf güçlerinin yoğun sansürüne rağmen Milli hareketi desteklemişlerdir. Bu gazeteler Milliyetçilerin, müdafaa-i hukuk cemiyetleri kurarak, milli kongreler düzenleyerek, İstanbul Hükümeti'ne karşı fetva yayımlayarak, Ankara'da Büyük Millet Meclisi'ni açıp kanunlar koyarak dini ve hukuki meşruiyetlerini sağladıklarını savunmuşlardır. Ayrıca, İstanbul ve Anadolu'daki milliyetçi basının yayınlarına göre, Ankara'daki Milli Hükümet, İnönü, Sakarya ve Büyük Taarruz gibi büyük askeri zaferleri sayesinde uluslararası alanda diplomatik-siyasi meşruiyetini ispat etmiştir. Ankara Hükümeti'nin Fransa ile imzaladığı Ankara İtilafnamesi, Sovyet Rusya ile imzaladığı Moskova Dostluk Antlaşması ve İtilaf güçlerinin temsilcileri ile imzaladığı Mudanya Mütarekesi gibi siyasi antlaşmalar, Ankara Hükümeti'nin uluslararası camiada Türk milletinin tek temsilcisi konumuna gelmesinin zeminini hazırlamıştır."
