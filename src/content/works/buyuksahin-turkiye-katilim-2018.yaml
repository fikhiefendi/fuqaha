abstract: "Finansal sistemde geleneksel bankalarda olduğu gibi katılım bankaları da benzer fonksiyonları icra etmekle birlikte, farklılık arz eden düzenleme ve kurallarla faaliyetlerini sürdrümektedir. Katılım bankaları faaliyetlerini İslam dini ile belirlenen esaslara göre icra ederler. İslami bankacılık sistemi, Müslüman müşterilerin gereksinim ve taleplerine cevap verme ihtiyacının neticesinde ortaya çıkmıştır. Günümüzde de katılım bankacılığının büyüklüğü sürekli olarak artış gösterme, katılım bankaları farklı fon toplama ve kullandırma yöntemleri ile geleneksel bankaları karşısında varlığını büyüyerek devam ettirmektedir.."
