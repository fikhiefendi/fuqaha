abstract: "1124-1141 (Miladi 1712-1728) tarihleri arasında tutulan mahkeme kayıtları mevcuttur. O dönemde Kastamonu, Sancak Beyliği durumundadır. Belirtilen süreler dâhilinde Şark Seferleri gerçekleşmiş bu seferlerde halkın durumu, toplanılan vergiler, yapılan yolsuzluklar, bunların tespiti ve giderilmesi hususunda gereği yapılmıştır. Halkın arasında sosyal hayatta çıkan anlaşmazlıklar da mahkemelere başvurularak çözüme kavuşturulmuştur. Çalışılan sicil ve belirtilen dönem aralığında Kastamonu Sancağında görevli önemli isimler, Mültezimler, Mutasarrıflar, Kadı ve Ayanlar, Müderrisler; Kastamonu nahiye ve köyleri, kazalar, mahalleleri, o dönemde hizmet veren vakıflar, toplanılan vergiler gibi Kastamonu kent tarihine ışık tutacak önemli bilgilere ulaşılmıştır."
