abstract: "İnsan, günlük hayatında tevbe ederek Allah'a dönmediği takidirde Yüce Yaratıcısının rızasını kaybetmesiine yol açacak bazı küçük günahlara düşebilir. Bununla beraber“kebâir”diye isimlendirilen bazı büyük günahlar da vardır. Allah-u Teâlâ bu günahlara düşmemek için sınırlar koymuş, bu tür günahlara götüren davranışların hükümlerini açıklamış ve bu büyük günahlara uygun cezalar emretmiştir. Bu sebeple ben de“İslam Fıkhında Büyük Günah İşleyenler ile İlgili Hükümler”başlığı altında birçok büyük günahı içeren bu konuyu araştırmayı hedefledim. Ve araştırmamı üç bölüme ayırdım. Birinci bölümde hüküm, büyük günah ve günaha işleme kavramlarıyla ilgili hususları yazdım. Daha sonra aynı şekilde İslam Fıkhındaki meşru cezalardan, kısastan ve tazir/kınama cezasından söz ettim. İkinci bölümde de yedi büyük günahtan sayılan“içki içmek”,“hırsızlık yapmak”,“kazf”yani zina iftirasında bulunmak,“zina suçu işlemek”,“dinden çıkmak ”,“eşkiyalık yapmak”,“bağy yani meşru düzene baş kaldırmak”. Bunların her birini üç ayrı başlıkta inceledik. Üçüncü bölümde ise bir kişinin bilerek, bilmeyerek veya bir sebep ile haklarına saldırma konusunu işledik. Bu kapsamda insan öldürme ve organlarını kesme, yaralama, kırma gibi konular hakkında bilgileri delilleriyle zikrettik."
