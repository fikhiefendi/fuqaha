abstract: "Peygamber Efendimizin vefat etmesiyle birlikte İslâm'ın iki temel kaynağı olan Kur'ân ve Sünnet tamamlanmış oldu. Bundan sonraki süreçte İslâmiyet'in hızlı bir şekilde yayılması, farklı coğrafya ve kültürden insanların Müslüman olmasıyla birlikte İslâm'ın meseleleri de çeşitlenmiş, zaruret halinin varlığı ve hükme etkisi tartışılmaya başlanmıştır. Bu tartışmalar neticesinde birçok görüş öne sürülmüş, bir kısım fukahâ zarureti keyfî hüküm vermek olarak görürken bir kısım fukahâ ise zaruretin hüküm verilirken göz önünde bulundurulması gereken bir durum olduğunu savunmuştur. Biz bu çalışmamızda bilhassa Hanefî mezhebinde zaruret kavramını ele alıp, İmam Serahsî'ye ait olan el-Mebsût adlı eserdeki zaruretle ilgili meseleleri tespit edeceğiz. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezin konusu, sınırlandırması, yöntem ve kaynakları ile genel olarak zaruret kavramı ele alınıp Kur'ân ve Sünnette zaruret kavramı açıklanmıştır. Birinci bölümde zaruret ile ilişkili kavram ve delillerle birlikte Serahsî'de zaruret kavramı üzerinde durulmuştur. İkinci bölümde ise el Mebsût'ta geçen zaruretle ilgili meseleler tespit edilmiştir. Sonuç kısmında ise elde edilen bilgiler ışığında İmam Serahsî'nin zaruretle ilgili görüşleri değerlendirilmiştir."
