abstract: "Toplumun mensup olduğu kültürü ve bu kültürün özelliklerini tanımlamak için, günlük yaşamda gerçekleştirdikleri bütün eylemleri incelemek gerekmektedir. Toplumun yaşayış biçimini oluşturan eylemler, kültürü oluşturmakta ve bu kültür, bir toplumu diğer toplumlardan ayıran özellikler karşımıza çıkmaktadır. Diğer yandan toplumun düşünce dünyası da kültürlerini oluşturan başka bir unsurdur. Toplumların kültürleri; düşünce yapılarına, gelenek ve göreneklerine, bulundukları coğrafyaya, bulundukları siyasi duruma, uygun olarak yaşamlarını sürdürmeleri için yaptıkları ey doğmuştur. Böylelikle toplumların yaşayış biçimi, kültürlerini şekillendirmede etkili olmuştur. Toplumun içinde bulunduğu şartlara göre şekillenen en iyi yaşam biçiminin, nesilden nesile aktarılması için toplum, bu yaşam tarzının özelliklerini belirlemiş, bu özellikler hukuk düzen çıkarmıştır. Toplumların oluşturdukları hukuk düzeni onların yaşayış tarzından doğmuş, kurdukları devletler bu hukuk düzenine göre teşkilatlanmıştır. Türklerin tarihi kayıtlara ilk yansıdıkları dönemde ismini Türklerin yaşadıkları coğrafyadan bozkır kültürüne mensup oldukları anlaşılmaktadır. Orta Asya'nın bozkırlarında konargöçer yaşam tarzında hayatlarını sürdüren eski Türkler hareketli yaşam sayesinde Orta Asya'da basmadık toprak bırakmamışlardır. Türklerin kendi hukuk kuralları olan törenin, bozkır kültürünün hukuki sınırlarını çizdiği anlaşılmaktadır. Türklerin İslam dini ile tanışmasından sonra dahi Türk topluluklarında törenin devlet ve halk hukukunda etkili olduğu görülme Tiirk topluluklarının İslam dinini kabul etmesiyle İslam hukuku şeriat Türk hukuku olan töre, bir aray Türk İslam kültürü ortaya çıkmıştır. Bu çalışmamızda İslam öncesinde ilk Türk devletlerinde ve İslam' a geçiş dönemlerinde Türk devlet ve topluluklarında hukuk ve adalet anlayışları"
