abstract: "Bediüzzaman Said Nursi, (r.a.) 20. yüzyılda yaşamış ve hayatını ilim, iman ve Kur'an hizmetine adamış bir İslam alimdir. Te'lif ettiği Risale-i Nur Külliyatında ağırlıklı olarak akide-kelam konuları işlense de fıkıh, hadis ve ahlak gibi meselelere de değinmektedir. Bu çalışmada fıkıh mevzusu olan konuları bilhassa ibadet muh-tevalı meselelere fıkıh ilmi ışığında yoğunlaştık. Ayrıca Bediüzzaman Said Nursî'nin (r.a.) bu konulara hikmet açısından bakışı, başka bir deyişle fıkhın ibadet-ler kısmının 'nasıl' değil, 'niçin' yönünün incelenmesi ele alınmıştır. Bediüzzaman Said Nursi'nin (r.a.) düşünsel mirası ve ibadetlerle ilgili an-lama ve yorumlama biçimi yeni bir perspektif açısından araştırılmıştır. Ayrıca, aka-demik düzeyde Bediüzzaman Said Nursi'nin (r.a.) eserlerini anlama yolunda önemli bir adım daha atılma hususu hedeflenmiştir. Bu çalışmada, konuyla ilgili ayetler, hadisler ve çeşitli kaynaklarla birlikte Bediüzzaman Said Nursi'nin“Eski Said”ve“Yeni Said”dönemlerinde yazdığı eser-ler araştırma alanı oluşturmaktadır. Araştırma konusu, Bediüzzaman Said Nursi'nin (r.a.) eserleri çerçevesinde olduğundan, Risale-i Nur Külliyatının orijinal metnin-den sıkça iktibaslar yapılmıştır. Ele alınan konuları anlaşılır hale gelmesi için“Fıkhu'l-evleviyat”şeklinde nitelendirilecek şekilde Bediüzzaman Said Nursi'nin (r.a.) eserlerinde yer alan il-mihal konusu olan ibadetler incelenmiş ve bunlarla ilgili mezhep alimlerin görüş-lerine başvurulumuştur. Üstad Bediüzzaman Said Nursi'nin (r.a.) eserlerinde, ibadet konularına dair bakış açısı belirlenmiş ve bu bakış açısı geniş kapsamlı açıkalamalarla aktarılmaya çalışılmıştır."
