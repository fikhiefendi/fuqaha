abstract: "Bu tez, belirli bir ekonominin İslami siyasal iktisat ilkelerine uyum düzeyini ölçmek amacıyla bileşik bir endeks geliştirmekte ve bu endeksi birden fazla ülke örneğine uygulamaktadır. Çalışma, konuya ilişkin 662 Kur'an ayeti ve 366 hadis dâhil olmak üzere, kapsamlı bir birincil kaynak kümesine dayanmaktadır. Ekonomik hayat, piyasalar, finans, yeniden bölüşüm ve toplumsal refahın yanı sıra yönetişim ve aile gibi konulara da temas eden bu birincil kaynaklar, İslami siyasal iktisada yönelik ilkeleri, kavramları ve yansımaları tespit etmek amacıyla sistematik bir analize tabi tutulmuştur. Elde edilen veriler, kavramların kodlanması ve tümevarımsal olarak çıkarılması, tematik olarak kümelenmesi ile boyut ve göstergelerin belirlenmesine dayanan bir metodoloji aracılığıyla, İslami Siyasal İktisat Endeksi'nin (IIPE) bileşenlerini geliştirmek için kullanılmıştır. Bu süreç sonucunda, çıktı göstergelerini kurumsal ve uygulama düzeyindeki sinyallerle dengeleyen, 6 boyut altında dağılmış 20 tematik küme ve 99 gösterge ortaya konmuştur. Bahsi geçen göstergeler yönsel olarak uyumlu hale getirilmiş ve 0-1 aralığında normalize edilmiştir. Kümelerin puanları, makâsıd tabanlı kademeli bir ağırlıklandırma sistemi (zarûriyyât, hâciyyât, tahsîniyyât) kullanılarak hesaplanmış; ardından bu kümelerin ve boyutların puanları, IIPE skorlarını üretmek amacıyla aritmetik ortalama alınarak bir araya getirilmiştir. Bu yaklaşımın doğruluğu ve güvenilirliği, geometrik ortalama ve Temel Bileşenler Analizi (PCA) tabanlı yaklaşımlar gibi bileşik göstergeler geliştirmede OECD tarafından kabul görmüş diğer yöntemlere karşı test edilerek sağlamlık kontrolü yapılmıştır. Ardından geliştirilen endeks, Endonezya, İran, Malezya, Pakistan, Türkiye ve Birleşik Krallık'ı kapsayan bir dizi ülkeye uygulanmıştır. Elde edilen bulgulara göre endeks skorları 0,610 (Birleşik Krallık) ile 0,706 (Malezya) arasında değişiklik göstermektedir. Piyasa işleyişi ve sözleşme adaleti (D4) gibi bazı boyutlar tüm ülke örneklerinde istikrarlı bir sağlamlık sergilerken, başta etik finans (D3) olmak üzere diğer bazı boyutlar zayıflık ve tutarsızlık göstermektedir. Müslüman olmayan ülkeleri temsilen seçilen Birleşik Krallık, refah, işçi hakları ve yönetişim gibi İslam'a özgü olmayan boyutlarda yüksek bir skor elde ederken, İslami finansa kurumsal bağlılık ve faizin ortadan kaldırılması gibi doğrudan İslam iktisadı ve finansı ile ilişkili boyutlarda düşük skorlar kaydetmiştir. Bu durum, endeksin evrensel adalet ile İslam'a özgü kurumsal taahhütler arasındaki sapmaları teşhis etmedeki gücünü ortaya koymaktadır. IIPE çok sayıda pratik kullanım alanı sunmaktadır. Bunlardan en dikkat çekici olanları şu şekilde sıralanabilir: (1) Normatif İslami esasları, sistematik bir düzlemde ampirik olarak test edilebilir hale getirmesi; (2) politika yapıcıların İslami ekonomilerin İslami ideallere ne ölçüde sadık kaldığını analiz etmelerine olanak tanırken, mevcut eksiklikleri noktasal olarak teşhis etmesi ve (3) değiştirilmeye ve genişletilmeye açık, esnek bir çerçeve sunması. Tezin sonuç bölümünde ise; İslam iktisadı, Müslüman toplumlarda sosyal adalet analizleri ve genel bileşik endeks literatürüne yönelik çeşitli çıkarımlara ve yapısal değerlendirmelere yer verilmektedir."
