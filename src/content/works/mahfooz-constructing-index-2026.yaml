title: "Constructıng an Index of Islamıc Polıtıcal Economy (Iıpe): A Qur'an and Sunnah-based Measurement Framework Wıth an Applıcatıon on Türkiye, Iran, Pakıstan, Malaysıa, Indonesıa and the Unıted Kıngdom"
