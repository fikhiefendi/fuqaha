abstract: "Hakkında nass veya icma bulunmayan konularda hüküm, kıyasa başvurularak tespit edilir. Aslî kaynaklar arasında zikredilmese de özellikle Hanefi mezhebi tarafından sıkça kullanılan bir delil olan kıyasın diğer delillerden farkı, uygulanırken akla daha çok ihtiyaç duymasıdır. Bu çalışmada Hanefi fıkıh ekolünün günümüze ulaşmış en eski usûl eseri sahibi olan Cessâs'ın kıyas anlayışı örnekleriyle beraber ele alınmıştır. Fıkıh ilminin tedvini açısından önemli bir zaman diliminde kaleme alınan eserler arasında Cessâs'ın el-Fusûl fi'l-Usûl adlı eseri de yer almaktadır. Bu eseri Ahkâmu'l- Kur'ân için bir mukaddime olarak kaleme almış olması, iki eser arasında bir bağlantı olduğuna işaret etmektedir. Cessâs, usûl eserinde kıyasla ilgili hususları aktarırken daha çok tanımlar üzerinde durmuş, aktarılan hususlara dair örneklere çok fazla yer vermemiştir. Ahkâmu'l-Kur'an'da ise doğrudan olaylar hakkında inmiş olan âyetler incelendiğinden, daha çok fıkhın pratik yanı ön plandadır. Buradan hareketle bu çalışmanın birinci bölümde Cessâs'ın kıyas anlayışı teorik olarak incelenmiş; kıyas ve kıyasla alakalı olan kavramların tanımı, türleri ve delilleri ele alınmıştır. İkinci bölümde kıyasa pratik olarak başvurduğu konular incelenmiş, bu uygulamaları esnasında dile getirdiği yorumlardan yola çıkarak kıyasa karşı olan tutumu tespit edilmiştir. Üçüncü bölümde ise Cessâs'ın kıyasla ilişkilendirdiği lügat, nesih, umumun tahsisi, rivâyetler ve birtakım meselelerin kıyasla ilgili yönleri incelenmiştir. Bu konuların her biri, kıyastan ayrı konular olmasına rağmen, kıyasın bu konularla olan bağlantısına dikkat çekilmiş, uygulamalı olarak örnekler üzerinden açıklanmıştır."
