abstract: "Bu çalışmada umumu'l- belva gerekçesiyle reddedilen rivayetlere yönelik Hanefi ve Şafii usulcülerin yorumları ele alınmıştır. Çalışmamızda Şafii usulcülerin hadislerin metin kısmıyla hangi düzeyde ilgilendikleri araştırılmıştır. Araştırma çerçevesinde Hanefi ve Şafii usulcülerinin eserlerinden yararlanarak mevzubahis rivayetler hakkındaki yorumları derlenmiştir. Bu rivayetler arasında erkeğin kadına dokunmasının abdesti bozması, namazda elleri kaldırmak, namazda besmeleyi cehri çekmek, besmele çekmeden abdest alan kişinin abdestinin geçersiz kabul edilmesi, cinsel organa dokunma ile abdestin bozulması, ön ve arka haricinde vücuttan çıkan şeylerin abdesti bozmaması, ezan lafızlarının ikişer ikişer kamet lafızlarının birer birer okunması, bir şahit ve bir yemin hakkındaki hadis ve ateşte pişen yiyeceklerden dolayı abdest alınmasının gerekmesi gibi konularla alakalı olan belli başlı rivayetler zikredebilir. Konu ile alakalı ele alınan hadislerin yanında Hanefilerin bu hadislere yönelik görüşleri, değerlendirmeleri ve delil olarak gösterdikleri rivayetler konunun daha iyi anlaşılması açısından her hadisin girişinde ele alınmış ve Şafiilere yönelik eleştirilerine de yer verilmiştir. Çalışmamız sonuç ve değerlendirme kısmıyla tamamlanmıştır."
