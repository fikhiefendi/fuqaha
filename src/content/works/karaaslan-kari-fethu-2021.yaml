abstract: "İslam Hukuk ilmi kişinin doğumundan ölümüne kadar karşılaştığı tüm sorunların dinî hükmünü ele almasından Müslüman bir birey tarafından son derece büyük bir önemi haizdir. Bu hükümler İslam Hukuk alimleri tarafından belirlendiği için fıkıhla ilgili eserleri olan kimselerin eserlerinin incelenmesi ve fıkıh sahasındaki katkılarının belirlenmesi kaçınılmaz bir zorunluluktur. İşte bu çalışmada biz Ali el-Kârî'nin Hanefî fıkhına katkılarını tespit edebilmek için müellifin Fethu bâbi'l-inâye adlı eserinin hadler bölümünü inceledik. Tezin birinci bölümünde Ali el-Kârî'nin hayatı ve ilmî kişiliği hakkında kaynaklarda aktarılan bilgiler tespit edilmesinin yanında Ali el-Kârî'nin ait olduğu entelektüel çevre tanıtılmaya çalışılmıştır. İkinci bölümde Fethu bâbi'l-inâye adlı eserin hadler bölümündeki şerh metodu incelenmiştir. Bu bölümde Ali el-Kârî'nin konuyu ele alış şekli, dil açısından metne yaptığı katkılar, fıkıh açısından metne yaptığı katkılar belirlenmeye çalışılmıştır. Üçüncü bölümde ise Fethu bâbi'l-inâye adlı eserin hadler bölümü muhteva açısından incelenmeye tabi tutulmuştur. Bu bölümde hadler bölümünde yer alan konular özetlenmiş, metne fıkıh ve hadis açısından yaptığı katkılar tespit edilmeye çalışılmış müellifin bu bölümde faydalandığı kaynaklarla ilişkisi ve kendine has görüşleri tespit edilmeye çalışılmıştır."
