abstract: "Osmanlı Devleti'nin hükümranlık anlayışının temeli İslam hukukuna dayanmaktadır. Yönetim tarzı her alanda etkisini gösterdiği gibi hukuk alanında da etkili olmuştur. Osmanlı hukuku Şer'i ve Örf'i Hukuk olmak üzere ikiye ayrılmış, Osmanlı Devleti'nin suç ve ceza arasındaki dengeyi bu sistemle muhafaza ettiği görülmüştür. Tanzimat'la yeni bir dönem başlamış, Batı hukuku benimsenmiş ve“kanunsuz suç, suç sayılmaz.”anlayışıyla bir dizi değişikliğe gidilmiştir. Kabul edilen ceza kanunlarıyla yeni bir düzenin temelleri atılmıştır. Özellikle Tanzimat sonrası han, kale gibi yapıları hapishane olarak kullanan Osmanlı Devleti, mahkûm sayısının fazlalığından bu yapıların yetersizliğini düşünerek hapishane inşalarına başlamıştır. Hapishanelerin faaliyete geçmesiyle bazı sorunlar ortaya çıkmıştır. Salgın hastalıklar, kadınlar için ayrı bir hapishanenin olmayışı, personel eksikliği bunlara örnek olarak gösterilebilir. Osmanlı Devleti'nde hapishanelerin durumuna ilişkin düzenlemelere dair ilk hükümlere Islahat Fermanı'nda rastlanmıştır. Buna ek olarak yapılan düzenlemelerden bazıları ise 1859 Muhakemat Nizamnamesi, 1876'da Gardiyanlar ile ilgili Talimatname, 1880 Tevkifhane ve Hapishanelerin İdaresine Dair Nizamnamedir."
