abstract: "Çalışmamıza konu olan H. 1331-33/M. 1913-15 tarihli 98 numaralı Antalya Şer'iyye Sicili (Vr. 51-98) 201 hükümden meydana gelmektedir. Mahkemeye intikal etmiş davalar tereke, (miras), eytam sandığından borç alınması, vekâlet konularını ihtiva etmekte olup, bunun dışında bir takım münferit konulara da yer verilmiştir. Ayrıca çalışma alanımız olan Antalya Sancağı'nın Elmalı Kazası'nda, yabancı devletlerin tebaasından olan kimselerin de kayıtlarını görmek mümkündür. Osmanlı ailesinin Antalya örneği ele alınarak, günlük yaşamda kullanılan çeşitli eşyalar, kıyafetler ve bunların nitelikleri dikkate alınarak bir takım çıkarımlarda bulunulabilir. Tereke davalarında miras hukukuna ne kadar çok önem verildiği anlaşılmaktadır. Buna göre Osmanlı Devleti'nde sosyal dayanışma ve sosyal devlet anlayışı ideale yakın bir düzeyde olduğu görülmektedir. Çalışmamızın giriş kısmında Osmanlı mahkemesi Şer'iyye Sicilleri defterlerinin tanıtımına ve genel özelliklerine, şer'iyye sicili arşivlerinin tarihi gelişimine ve üzerinde çalıştığımız şer'iyye sicilinin muhteviyatı ve ehemmiyetine temas ettik. Tezin metin kısmında 98 Numaralı Antalya Şer'iyye Sicili defterinde geçen vesikaların özetleri, metnin transkripsiyonu ve indeks verilmiştir. Transkripsiyon yapılırken basit transkripsiyon kuralları dikkate alınmıştır. Defter, XIX Yüzyılın sonlarına doğru Elmalı yöresinin sosyal ve iktisadî hayatını ve hukukî uygulamalarını incelemek isteyen araştırmacılara, bu hususta birinci dereceden kaynak sağlamayı amaçlamaktadır."
