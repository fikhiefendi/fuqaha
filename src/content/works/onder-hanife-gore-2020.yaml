abstract: "Kur'an-ı Kerim'de kesin ve bağlayıcı bir emirle hamrın haram olduğu bildirilmiştir. Ancak İslam hukukçuları arasında hamrın kapsamının ne olduğu, ihtilaflı bir konudur. Bu çalışma ile alkollü içkiler konusundaki Ebû Hanîfe'nin görüşlerinin tesbit edilmesi amaçlanmıştır. Tez çalışmamızda hadislerde ve fıkıh metinlerinde zikredilen birçok alkollü içkinin olduğu tespit edilmiştir. Bunların mahiyeti hakkında bilgi verildikten sonra hükümlere yansıyan durumları ele alınmıştır. Hanefî mezhebi ve Ebû Hanîfe özelinde yapılan bu çalışmada alkollü içkilerin mahiyetinin ne olduğu ve hükümleri tesbit edilmeye gayret edilmiştir. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş kısmında konunun önemi, amacı, kaynakları ve sınırlarına yer verilmiştir. Birinci Bölümde alkollü içkilerin tanımı ve mahiyeti ele alınmıştır. Alkollü içkilerin tarihçesi ve günümüzdeki alkollü içkiler hakkında kısa bir malûmat verilmiştir. Konunun aslını oluşturan“alkollü içkilerin prototipi olarak hamr”konusu ele alınmış. Hamrın lügat ve terim anlamları, naslarda ele alınış şekli ve Ebû Hanîfe ve İmameyne göre mahiyeti ortaya konmuştur. Hamrın dışındaki alkollü içkiler, üzümden hurmadan ve diğer hammaddelerden elde edilenler olarak açıklanmıştır. İkinci Bölümde de alkollü içkilerin hükümleri konusuna yer verilmiştir. Alkollü içkilerin imanî açıdan ve necaset açısından hükümleri açıklanmıştır. Daha sonra alkollü içkilerin hukukî işlemlere konu edinilmesinde ortaya çıkan hükümler başlığı altında, mütekavvim mal olup-olmaması; hukukî işlemlerin konusunu teşkil etmede ve bedel olarak belirlenmesiyle alakalı konular (bey', selem, icare, hibe, mehir, rehin, miras…); alkollü içkilerin itlafı ve tazmini konularında oluşan durumlar ortaya konmuştur. Diğer başlıklarda da alkollü içkilerin istihâlesi, tedavi amaçlı kullanımı konuları ele alınmıştır. Alkollü içkileri içenlere uygulanacak cezaî yaptırımda ana hatlarıyla açıklanmıştır. Son başlıkta da alkollü içkilerle alâkalı diğer mevzular işlenmiştir."
