abstract: "Osmanlı toplumunda kadın; müslim, gayr-i müslim, köylü, şehirli, sultanlar ve cariyeler gibi farklı statülerde karşımıza çıkmaktadır. Tezimizde incelenen Osmanlı toplumunda müslüman kadın modelidir. Bu çalışmada Osmanlı sosyo-kültürel hayatında kadının yerinin tespit edilmesine çalışılmıştır. İslam öncesi toplumlarda miras bırakılan bir eşya konumuna indirgenen ve toplumda statü sahibi olmayan kadının hak ettiği değere İslam'la kavuştuğu söylenebilir. Osmanlı devletinde aile ve sosyal düzen büyük ölçüde İslâm hukukunun kurallarıyla tanzim edilmiştir. Osmanlı sosyo-kültürel hayatında İslâm'ın kendisine verdiği hakları kullanma yetkisine sahip olan kadının toplumda eğitim, siyaset, miras, evlenme ve boşanma gibi haklarda diğer toplumlardan üstün statüde olduğu görülmektedir."
