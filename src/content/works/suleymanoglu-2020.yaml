abstract: "Bu tez, medeni hukukta hak mahrumiyeti cezalarını konu edinmektedir. Medeni hukukun esas konusu, medenî hak mahrumiyetlerinin suç işleyen kişinin ıslahı hususundaki etkileri ve bu kişinin tekrar toplumsal hayata adapte edilmesidir. Bu çalışma medenî hukuku araştırmak ve medenî hukukta hak mahrumiyeti cezalarının kökenlerine inmeyi hedeflediği gibi; aslî cezalar, ferî cezalar ve bu cezalarının tamamlayıcısı olan cezalar arasındaki farkları ortaya koymayı da hedeflemektedir. Bu araştırmanın hedeflerinden bir diğeri de bu tür cezaların maksatlarını açıklamak, ferdi ve toplumsal hayata katkılarını ortaya koymaya çalışmaktır. Aynı şekilde bu çalışma, suça bağımlılık ve bu bağımlılığın sebeplerine ilişkin şeriatın uygulamış olduğu metodu açıklamayı hedeflemektedir. Bu çalışma, araştırma içeriğinin ayrıntıların ortaya koyulmasında bazen tümevarım yöntemine bazen de analitik yönteme dayanmaktadır. Her meselede ayet ve hadislerdeki kaynaklarına işaret edilmek suretiyle fakihlerin görüşleri zikredilmiş, delilleri ortaya konulmuş, daha sonra tercih yapılmıştır. Bu çalışma esnasında, medeni hukukun içeriği tam olarak ortaya konulmuştur. Medeni hukuk alanında iki önemli olgu bulunmaktadır: kişisel özgürlük ve düşünce özgürlüğü. Aynı şekilde şeriatın hakları korumak için ortaya koymuş olduğu koruma ve ceza sistemi açıklanmıştır. Bu çalışma ile '' sedd-i zeraî ''، '' kim ki bir şeyi vaktinden evvel isti'cal eyler ise, mahrumiyetiyle muâteb olur.'' vb. fıkıh kaideleri arasında bağlantılar kurulmuş, hak mahrumiyetini sona erdiren tevbe, affetme, iade-i itibar ve ceza süresinin bitmesine ilişkin hususlara da değinilmiştir. Yine bu çalışma hak mahrumiyeti cezasının, miras, vasıyyet, rehin vb alanlardaki hükümlerinede değinmektedir. Bu araştırma, önemini aşağıda açıklanan hususlardan almaktadır: - Araştırma konusu, ceza hukukunda araştırma yapanların ihtiyaç duyacağı yeni bir alandır. - Şeriat-ı İslamiyyenin suç bağımlılarına ilişkin ortaya koymuş olduğu metod ve onlarla ilişki yöntemlerini açıklamaktadır. - Son olarak bu konuda yapılan araştırma sayının az olması çalışmaya ayrı bir önem kazandırmaktadır. Anahtar Kelimeleri: Cezâ – Mahrûmiyet - Medenî Haklar"
