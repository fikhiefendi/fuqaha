abstract: "Bu çalışma, İstanbul ve Kahire tilavet tavırlarının karşılaştırmalı olarak incelenmesi ile ilgilidir. Her iki tavrın bugüne kadar ciddi manada çalışılmamış olması –kanaatimizce- araştırma konusu edilmesi gerektiği düşüncesini ortaya çıkardı. Araştırmada örneklem alanını söz konusu tavırlardan beşer okuyucunun icra etmiş olduğu Uşşak makamındaki Fatiha Sûresi oluşturmaktadır. İki tilavet tavrında da önde gelen temsilcilerin okuyuşları çalışma alanımıza girmektedir. Gerek şifahî kayıtlar gerek daha önce yapılmış kayıtlar tez konumuzun çerçevesini şekillendirmiştir. Bu kayıtların notaya alınıp genel hatları ile nasıl bir seyir izledikleri ortaya konmaktadır. Akabinde bilgisayar ortamında dijital analiz programları ile mevcut seslerin sent değerleri ve buna bağlı olarak aralık hesapları yapılmaktadır. Böylelikle icradaki aralıkların nazari ile kıyas edilmesi sağlanmaktadır. Tavırların kendi içinde karşılaştırmaları yapılmakta ve daha sonra birbirleri ile mukayese edilmeleri sağlanmaktadır. Bu vesile ile İstanbul ve Kahire tilavetlerinin farklı veya benzer yönlerine temas edilmektedir. Son olarak notasyon programında dörtlü bir yazım esası geliştirilerek yapılacak olan transkripsiyon çalışmalarına bir model olması da hedeflenmektedir."
