abstract: "Bireycilik, faydacılık ve finansallaşma gibi modern ekonomik anlayışların egemen olduğu bir ortamda, Müslüman topluluklar sosyal ve ekonomik uygulamalarını İslam'ın etik ve hukuki ilkeleriyle uyumlu hale getirme konusunda zorluk yaşamaktadır. Bu tez, söz konusu temel değerlerden uzaklaşan mevcut ekonomik sistemlere karşı, İslami armağan ekonomisini uygulanabilir bir alternatif olarak incelemektedir. Tez spesifik olarak Güneydoğu Asya'ya odaklanarak, İslami armağan ekonomisinin teorik temellerini ve modern uygulamalarını kapsamaktadır. Vaka çalışması metodolojisi kullanarak, zekat, vakıf ve hibenin modern Malezya ve Endonezya'daki çağdaş girişimleri incelemektedir. Bu çalışmanın merkezinde, İslami etik ve kolektif sorumluluk temelinde armağan temelli sosyo-ekonomik ilişkilerin yeniden canlandırılması için savunuculuk yapan Adi Setia ve diğer akademisyenlerin katkısı yer almaktadır. Temel bulgular, İslami armağan ekonomisi uygulamalarının toplumsal uyumu ve ekonomik adaleti teşvik ettiğini, eşitsizliğe ve çevresel bozulmaya çözüm üreterek büyüme merkezli modellere sürdürülebilir alternatifler sunduğunu ortaya koymaktadır. Çalışma, bu uygulamaların seküler, küreselleşmiş toplumlardaki potansiyelini ve zorluklarını belirleyerek kültürel, politik ve yapısal engelleri vurgulamaktadır. Dahası, bu tür uygulamaların özellikle uygun politika çerçeveleri, teknolojik yenilik ve eğitim girişimleriyle desteklendiğinde, Müslüman topluluklar içinde uzun vadeli dayanıklılığa, finansal kapsayıcılığa ve manevi tatmine nasıl katkıda bulunabileceğini değerlendirmektedir. Bu araştırma, klasik İslam iktisat düşüncesini çağdaş uygulama ile birleştirerek literatüre katkıda bulunmakta ve İslami ilkeleri gerçek dünyadaki ekonomik faaliyetlerde uygulamaya çalışan politika yapıcılar, işletmeler ve topluluklar için uygulanabilir öneriler sunmaktadır. Tez, ekonomide etiğin ve toplumun rolünü yeniden değerlendirerek, İslami armağan ekonomisini sürdürülebilir ve adil kalkınmaya ilişkin küresel söylem içerisinde dönüştürücü bir model olarak konumlandırmaktadır."
