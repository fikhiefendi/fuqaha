abstract: "Çalışmamızda ferdi ve toplumsal açıdan insana rehberlik yapan Kur'an'ın iddet sürecine girmiş eşlerin tutum ve davranışlarına nasıl yön verdiği araştırılmıştır. İddet sürecine ilişkin kuralları içermesi ve bu hususta en son nâzil olan sûre olması nedeniyle araştırmamız Talâk sûresi bağlamında yapılmıştır. Veri toplama ve analiz yönteminden yararlanarak yaptığımız çalışmamızın ilk bölümünde İslâm'ın boşanma ve talâk hususundaki ilkeleri tespit edilmiş, ikinci bölümünde bu ilkelerin Talâk sûresi ve diğer sûrelerde nasıl ele alındığına bakılmıştır. Üçüncü ve son bölümde ise önce eşlerin birbirlerine karşı hak ve sorumluluklarının neler olduğu tespit edilmiştir. Ardından iddet sürecinde eşlerin birbirlerine karşı davranışlarını düzenleyen Talâk sûresinde, yerleştirilmeye çalışılan tutum ve davranışlar ile mevcut tutum ve davranışların temelinde yer alan inanç ve değer yargıları vahyin indiği ortam dikkate alınarak incelenmiştir. Doğası gereği toplumu etkileyip ondan etkilenen insan ve davranışları vahiyle yeniden olması gereken hale döndürülmeye çalışılırken Kur'an'ın yapmaya çalıştığı davranış değişikliğinin asıl amacının daha derinlerdeki bozulmuş inanç kalıplarına ve değerlere yönelik olduğu sonucuna ulaşılmıştır."
