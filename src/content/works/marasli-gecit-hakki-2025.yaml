abstract: "İrtifak hakkı, hak sahibine kullanma ve yararlanma yetkilerinden birini veya her ikisini birden sağlayan aynî haktır. Geçit hakkı ise, genel yola bağlantısı olmayan ya da var olan bağlantısı zayıf olan taşınmaz malikine, başka bir taşınmaz üzerinden geçme hakkı tanıyan bir irtifak hakkıdır. Kişiye ya da eşyaya bağlı olarak kurulabilen iradî geçit hakkı kaynağını Türk Medeni Kanunu m. 838 hükmünden almaktadır. Taraflar, hukuka uygun olmak şartıyla geçit hakkının içeriğini belirlemede serbesttirler. Oysa Türk Medeni Kanunu m. 747'de düzenlenen ve yalnızca eşyaya bağlı kurulabilen zorunlu geçit hakkının kurulması, taraf iradelerinden bağımsızdır. Zira zorunlu geçit hakkı kaynağını komşuluk hukukundan almaktadır. Yüklü taşınmaz malikinin temel ödevi, komşu taşınmaz malikinin taşınmazından geçişine katlanmaktır. Bu çerçevede, Türk Medeni Kanunu'nda belirtilen koşulların gerçekleşmesi ile, geçit hakkının tesisine hukukî dayanak oluşur. Ancak tüm şartlar bulunsa bile zaruret içerisinde bulunan taşınmaz maliki, doğrudan komşu taşınmaz üzerinden geçiş sağlayamaz. Bu hakkını dava yolu ile yahut dava dışı olarak sözleşme ile ileri sürmesi gerekmektedir."
