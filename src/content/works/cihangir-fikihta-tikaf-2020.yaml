abstract: "Numan Efendi, İslamî ilimler ve edebiyat konusunda kendini geliştirmiş, Sivas'ın köklü geçmişinde iz bırakmış önemli şahsiyetlerden birisidir. Yaşadığı dönemde halkın hem maddi sorunlarının giderilmesindeki vakıf faaliyetlerinde hem de İslam'ın hayata tatbiki konusunda, Müslüman halkın önünü açacak önemli eserler kaleme alarak, insanların istifadesine sunmuştur. Böylece bulunduğu müftülük makamının hakkını vermeye çalışmıştır. Müellifin risale şeklinde, Arapça olarak kaleme aldığı eserlerinden biriside araştırmamızın konusu olan Risâletü'l-i'tikafiyye'dir. Eserde, Rasulullah'ın (s.a.v.) hayatı boyunca hiç terk etmediği i'tikaf ibadeti konu olarak ele alınmıştır. Müellif eserini, bir müftünün“i'tikaf”konusunda kendisine gelen suallere cevap vererek bu konuda her türlü bilgi eksikliğinin giderilmesine yardımcı olacak şekilde kaleme almıştır. Risalede i'tikaf hakkındaki bütün bilgiler her yönden incelenmiş ayrıca bütün mezheplerin görüşleri kıyas edilerek anlatılmıştır. Çalışmamız i'tikaf konusunun incelendiği birinci bölüm, Sarıhatipzâde ailesi ve Numan Efendi'nin hayatının anlatıldığı ikinci bölüm ve Risâletü'l-i'tikafiyye isimli eserin fıkhî açıdan incelendiği üçüncü bölüm olmak üzere toplam üç bölümden oluşmaktadır."
