abstract: "Bu çalışmanın konusu Modern Türk Miras Hukuku İle İslâm Miras Hukuku'nun karşılaştırılmasıdır. Modern Türk Miras Hukuku'ndan kastedilen şu anda Türkiye Cumhuriyeti'nde tatbik edilen Türk Miras Hukuku'dur. Çalışmamızda Türk Miras Hukuku'nun gelişim evreleri anlaşılabilsin diye öncelikle tarihsel serüveni anlatılmıştır. Sonrasında iki hukukun yapısal özellikleri yani kaynak, sistem, felsefi alt yapı ve kavramları mukayese edilmiştir. Bir de karşılaştırma Modern Türk Miras Hukuku'nun maddeleri temel alınarak mukabilinde var olan İslâm Miras Hukuku'na dair hükümler bazında yapılmıştır. İslâm Miras Hukuku adına Müslümanların kahir ekseriyetinin benimsemiş olduğu Hanefî, Mâlikî, Şâfiî, Hanbelî ve İmâmiyye Mezhepleri esas alınmıştır. Son olarak her iki hukuk sistemine dair yeni önerilerde bulunulmuş ve mevcut olan bazı akımların konu hakkındaki önerileri değerlendirilip eleştiriye tâbi tutulmuştur. Bu iki hukuktan biri ülkemizde kanuni iken diğeri ise sadece dinidir. Yani hem kanuni hem de dini olan bir miras hukukumuz mevcut değildir. Böylece bu konuda toplum ikilemde kalmış ve inancına göre paylaşım yapmak isterse kanuna aykırı davranmakla, kanuni olan hukuka göre paylaşım yapmak isterse bu sefer de dine aykırı bir paylaşım yapmış olmakla karşı karşıya gelmektedir. Bu çalışmamız bu sorunun çözümü için gerekli veriyi toplamış, iki hukuk sistemini beraberce tanıtmış, aralarındaki ortak ve ayrışan özellikleri ortaya koymuş ve böylece bu sorunun çözümü için ortaya konulması gereken çalışmalara bir ön çalışma olma amacı gütmüştür."
