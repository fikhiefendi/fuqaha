abstract: "Bu tezin amacı İslam Miras Hukukunun en önemli ve girift meselelerinden biri“münasaha”konusudur. Bu konuya özgü olarak hicri yaklaşık 11. Miladi 16. Yüzyıl Şafii fakihlerinden Şihabuddin Ahmed b. Mahmud el-Almevî tarafından manzum bir risale yazılmıştır. Bu risale öğrencisi Muhammed b. Mahmud el-Umerî tarafından şerh edilerek konunun daha anlaşılır hale gelmesi sağlanmıştır. Tek yazma nüshası olan bu eserin edisyon kritik ederek günümüz basım sistemine göre gün yüzüne çıkarılması amaçlanmaktadır. Bu risale üzerindeki çalışmamız metnin aslına uygun olarak tespit ve tashihi ile risalenin özgün yanlarını ortaya koyarak açıklayıcı yararlı izahlar yaparak okuyucuya ve araştırmacılara daha faydalı gelmesini sağlayacak kapsamda bir çalışma yapılacaktır."
