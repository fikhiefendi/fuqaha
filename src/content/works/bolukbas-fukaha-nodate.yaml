abstract: "Elfâz bahsi, Kur'ân ve Sünnet'ten hüküm istinbâtında usûl-i fıkhın en temel konularından biri olarak öne çıkmaktadır. Usûl literatüründe lafızların tanımı, kapsamı ve delâlet türleri ayrıntılı biçimde ele alınmış; bu çerçevede hüküm çıkarma süreçlerini belirleyen ilke ve esaslar ortaya konulmuştur. Bununla birlikte elfâz bahsinde belirlenen bu usûlî ilkelerin pratik uygulamalarla ne ölçüde örtüştüğünü ortaya koyan çalışmaların sınırlı olduğu görülmektedir. Bu bağlamda tezde ele alınan temel problem, Hanefî fakihlerinden Ebû Bekr el-Cessâs'ın (ö. 370/981) el-Fusûl fi'l-usûl adlı eserinde ortaya koyduğu elfâza dair usûl kuralları ile müfessir-fakih kimliğiyle kaleme aldığı Ahkâmu'l-Kur'ân'daki uygulamaları arasında usûl-furû' tutarlılığının bulunup bulunmadığıdır. Bu çalışmanın amacı, Cessâs'ın teorik düzlemde benimsediği lafız esasları ile Kur'ân âyetlerinden hüküm çıkarırken sergilediği fiilî uygulamayı karşılaştırmalı olarak incelemek ve bu yolla onun usûl-furû' anlayışını bütüncül biçimde ortaya koymaktır. Cessâs'ın hem usûl-i fıkıh hem de ahkâm tefsiri alanında eser vermiş olması ve Fusûl'ü Ahkâmu'l-Kur'ân'ın mukaddimesi olarak telif ettiğini belirtmesi, bu incelemeyi özellikle önemli kılmaktadır. Bu yönüyle çalışma, elfâz bahsine dair usûlî ilkelerin yalnızca teorik düzeyde değil, pratik fıkhî yorumlar üzerindeki işlevini de ortaya koymayı hedeflemektedir. Araştırmada nitel araştırma yaklaşımı benimsenmiş; betimsel analiz yöntemiyle öncelikle Fusûl'de elfâza dair ortaya konulan usûlî esaslar tespit edilmiştir. Ardından bu esasların Ahkâmu'l-Kur'ân'daki uygulamaları karşılaştırmalı olarak incelenmiş; değerlendirmelerde eleştirel ve doğrulayıcı bir üslup kullanılmıştır. Çalışma kapsamında, Fusûl'de yer almakla birlikte Ahkâmu'l-Kur'ân'da ayrıntılı biçimde ele alınmayan hüsün-kubuh ve emrin edâ-kazâ boyutu gibi konular inceleme dışında bırakılmış; buna karşılık Fusûl'de işaret edilen ancak detaylandırılmayan ta'riz, kırân ile istidlâl ve siyâkın delâleti gibi meseleler her iki eser üzerinden ele alınmıştır. Tezin sonucunda, Cessâs'ın Fusûl'de elfâz bahsine ilişkin benimsediği usûl kurallarının, Ahkâmu'l-Kur'ân'daki pratik örneklerle büyük ölçüde örtüştüğü ve genel olarak usûl-furû' bütünlüğünün sağlandığı tespit edilmiştir."
