abstract: "“İbadetler Bağlamında Serahsî'nin Hanefî Mezhebindeki Tercihleri ve Gerekçeleri”isimli bu tez, bir giriş, iki bölüm ve bir istatistik ve değerlendirmeden oluşmaktadır. Giriş bölümünde konunun önemi, sınırları ve araştırmanın yöntemi ile kaynakları belirtilmiştir. Birinci bölümde Mâverau'n-Nehir bölgesinin önde gelen fakihlerinden Serahsî'nin hayatı, hocaları, talebeleri, eserleri ve mezhep içindeki konumu ele alınmıştır. İkinci bölümde ise Serahsî'nin Mebsût isimli eseri dikkate alınarak ibadet fıkhı bağlamındaki tercihleri ve tercihlerin gerekçeleri tespit edilmeye çalışılmış ve neticede derli toplu bir bilgi sunulmaya gayret edilmiştir. Bununla birlikte ihtiyaç görünen yerlerde de kısa değerlendirmeler yapılmıştır. Son olarak istatistik ve değerlendirme bölümünde Serahsî'nin hangi konuda hangi imamın görüşünü benimsediği, hangisini tercih etmediği maddeler halinde yazılmış ve böylece Serahsî'nin fıkhî tavrı ortaya koyulmaya çalışılarak Hanefî mezhebi içerisindeki konumuna değinilmiştir."
