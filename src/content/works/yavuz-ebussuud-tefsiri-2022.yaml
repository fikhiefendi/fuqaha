abstract: "Tezimiz, Şeyhülislam Ebussuûd Efendi'nin İrşâdü'l-Akli's-Selîm ilâ Mezâye'l-Kitâbi'l-Kerîm adlı tefsirinde kader ve ihtiyâr konusunu ve bunlarla ilgili kavramların nasıl yorumlandığını işlemektedir. Tezimiz, giriş ve sonuç dışında üç bölümden oluşmaktadır. Giriş'te Ebussuûd'un hayatı, hocaları, ilmî kişiliği, eserleri; tefsiri ile kader ve ihtiyâr konuları hakkında yazılmış çalışmalara dâir bilgiler verilmiştir. Bu hususlara ilave olarak, çalışmamızın kaynak, yöntem, önem ve amaç yönlerine temas edilmiştir. Birinci Bölüm'de tezle doğrudan ilişkili olan kavramlardan; kader, kaza, irâde, ihtiyâr, meşîet, ilim, kudret, tekvîn ve fiilin sözlük anlamları verilmiş, akabinde ise ıstılâhî mânâları verilerek bu kavramlar özet olarak açıklanmaya çalışılmıştır. İkinci Bölüm'de kaderin kâinât ve beşerle münasebetinin işlendiği âyetler ile sünnetullâh, hidâyet, dalâlet, Allah'ın ve kulların fiilleri, hayr ve şerrin Allah'a nispeti konuları, selef ve halef ulemasının yorumlarıyla Ebussuûd'un değerlendirmeleri muvacehesinde incelenmiştir. Üçüncü Bölüm'de öncelikle öne çıkan kelâm mezheplerinin özellikle ihtiyâra dâir görüşleri verilmiş, sonrasında Ebussuûd'un ihtiyâr ve meşîet anlayışı ile rızâ ve cebir meşîetinin mâhiyetleri işlenmiştir. Tezimizde, müfessirimizin kendilerine özel olarak yer vermesi nedeniyle, Zemahşerî ile Beydâvî'nin eserlerine diğer tefsir kaynaklarına nispetle daha fazla müracaat edilmiştir. Sonuç'ta genel bir değerlendirme yapılarak, tezin konusu açısından önemli görülen neticeler sunulmaya çalışılmıştır."
