abstract: "Yoksulluk yüzyıllar boyu insanlığın bitmeyen sorunu olmuştur. Yoksulluğu azaltmak ve ortadan kaldırmak için geçmişten günümüze kadar birçok yöntem geliştiren insanoğlu bu yöntemlerinde devletin yanı sıra sivil toplum kuruluşlarını, vakıfları, dernekleri ve özel kurumları da aracı olarak kullanmıştır. Bu bağlamda mikrofinans kurumlarının yoksullukla mücadelede son zamanlarda gerçekleştirdikleri çalışmalar dikkat çekmektedir. Dünyanın birçok yerinde mikrofinans kurumlarının hızlı şekilde artış göstermesi ve ilk kurulduğu zamanlarda elde ettiği başarıları bu kurumların yoksullukla mücadelede yeni bir finansal aracı olarak görülmelerini sağlamaktadır. Geleneksel mikrofinans kurumları yoksulluğun giderilmesine yönelik kısa vadeli, faizli borca dayalı, bireysel finansman sağlarken İslami mikrofinans kurumları ise kar-zarar katılımlı, projelere dayalı, uzun vadeli, kollektif ekonomik güçlendirmeyi baz alan çözümler üzerinde hassasiyetle durmaktadır. Sürdürülebilir Kalkınma Hedefleri (SKH), 2015 yılında Birleşmiş Milletlere (BM) üye 193 ülkenin 2030 yılına kadar dünyada yoksulluğu ortadan kaldırmak, dengeli tüketim ve ekonomik fırsat eşitliğini sağlamak ve bunların yanında gelecek nesillere daha yaşanabilir çevre ve iklim bırakmak için oybirliği ile onayladığı 17 hedef ile 169 alt hedefi içeren evrensel eylem çağrısıdır. Geleneksel mikrofinans kurumları son zamanlarda gerçek amaçlarından uzaklaşarak yoksullara yüksek oranda kredi veren kar maksimizasyonu hedefleyen“sıfır toplamlı”kurumlara dönüşmüştür. İslami mikrofinans kurumları ise yoksullarla iş ortaklığı kurarak“kazandır kazan”felsefesiyle hareket etmekte ve dayanışmaya dayalı finansal kurumlar olmayı amaçlamaktadırlar. Çalışmamız boyunca elde ettiğimiz veriler ışığında özetlemek gerekirse; hali hazırda küresel mutabakat sağlanmış Sürdürülebilir Kalkınma Hedefleri'nin, sadece Müslümanlara değil bütün insanlığa hitap eden ve kollektif ekonomik güçlendirmeyi baz alan İslami mikrofinans enstrümanları aracılığıyla kolaylıkla gerçekleştirilebileceği sonucuna varılmıştır."
