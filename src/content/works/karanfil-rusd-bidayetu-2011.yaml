abstract: "İbn Rüşd'ün Bidâyetü'l-müctehid adlı eserinde Aile Hukuku ile ilgili değerlendirmelerine yönelik yapılan bu çalışmada, İbn Rüşd'ün Hukuk düşüncesinin dayandığı temeller ve kullandığı deliller ve asıllar hakkında bilgi vermek amaçlanmıştır. İbn Rüşd, mezheb taassubluğu yapmadan ve belli bir mezhebe bağlı kalmadan görüşleri kendi hukuk düşüncesine göre değerlendirerek aralarından en doğru olanı bulmaya çalışmıştır. Bu değerlendirmeler sonucu kendi müctehidliginin geregi olarak bu görüşler içinden birini tercih etmiş ya da onlardan farklı olarak bir görüş belirtmiştir. İbn Rüşd, böylece ele aldığı konularda hem derli toplu bilgi edinmemize hem de müctehidlerin hüküm çıkarma yöntemleri hakkında fikir sahibi olmamıza imkan sağlamıştır."
