abstract: "Bu yüksek lisans tezimizde geciktirilen ibadetlerin telafisinin veya kazasının mümkün olup olmadığını ele aldık. Bu konu klasik ve çağdaş İslam hukukçuları arasında tartışılmıştır. Hz. Peygamber'in bazı söz ve uygulamalarına bakarak kazanın mümkün olduğunu söyleyen fakihler olduğu gibi bazı deliller öne sürerek bunun mümkün olmadığını söyleyen fakihler de vardır. Doğru çözüm önerisini sunabilmek için bu konuyu etraflıca, bilimsel ve objektif kıstaslar çerçevesinde inceledik. Farklı düşünen İslam hukukçularının görüşlerini delilleriyle birlikte sunarak aralarında tercihler yaptık. Kendi görüşümüzü de belirttik. Ayrıca tezimizde hangi ibadetlerin kazasının olduğu ve bunların ne şekilde ve ne zaman yapılabileceği hususunda fıkhî bilgiler de sunduk."
