abstract: "Şer'iyye Sicilleri, Osmanlı Devleti'nde kadılar tarafından mahkeme kayıtlarının ve resmi evrakların suretlerinin günlük olarak tutulduğu defterlerdir. Osmanlı Devleti'nde merkez ve taşrada her tabakadan insanlar arasındaki hukukî ilişkilere dair kayıtları içeren bu defterler şehrin sosyal dokusuna, ekonomik, kültürel yapısına dair zengin bilgi içermektedir ve Osmanlı tarihini aydınlatan en önemli kaynak eserlerdendir. Bu çalışmada Ankara Cumhurbaşkanlığı Devlet Arşivleri Başkanlığı Milli Kütüphane envanterine kayıtlı 458 Numaralı Ankara Şer'iyye Sicili (H.1327/M. 1909) incelenerek, belirtilen yıla ait Ankara'nın ekonomik, sosyal, idari ve kültürel hayatının aydınlatılmasını sağlamak ve şehir tarihi araştırmalarına katkıda bulunmak amacıyla transkripsiyon, tahlil, tasnif ve değerlendirmeler yapılmıştır."
