abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de şeriye sicilleridir. Osmanlı Devleti?nde kadıların verdiği hükümlerle, devlet merkezinden gelen fermanlar, beratlar, buyrultular ve diğer belge çeşitlerinin yazıldığı defterlere şeriye sicili denir. Çalışmamızın konusu 76 numaralı Konya şeriye sicili, 1840?1843 yıllarına ait hukuka intikal etmiş mahkeme kayıtlarını ihtiva etmektedir. Sicil, 162 sayfa ve 210 kayıttan oluşmaktadır. Sicilin içinde mülk satışları, fermanlar, beratlar, vasi tayini, miras, vakıf, mülk ve alacak davaları gibi konular yer almaktadır. Bunların içinde nafaka, alım-satım, miras ve vasi tayini sicilin büyük bir kısmını oluşturmaktadır. Bu çalışma ile asıl amacımız, eski çağlardan beri yerleşim merkezi olan Konya?nın, 1840?1843 yılları arası, sosyal, ekonomik ve idarî yapısının belirlenmesine katkı sağlayabilmektir. Bunun yanında, şeriye mahkemeleri ve görevlileri, şeriye sicillerinin tanımı ve önemi gibi konulara da değinilmiştir. Şeriye sicilinde yer alan belgelerin transkripsiyonu, özeti ve değerlendirmesi de yapıldı. Burada üç yıl için düzenlenen defterin tümü ele alınmış ve içindeki kayıtlar çeşitli açılardan analiz edilmiştir. Bu belgelere dayanarak halkın dinî ve sosyal yapısı, ikili ilişkileri, ana, baba ve çocuk sayıları, gündelik yaşamı, ekonomik yapısı, merkezi idare ile taşra arasındaki ilişkileri içeren tahliller yapılmaya çalışıldı."
