abstract: "Bu araştırma Maliki usulü fıkhını, burada yaşanan ihtilafları ve bu ihtilafların bir neticesi olan birbirinden farklı fıkhî hükümleri ele almaktadır. Yapılan araştırma esnasında Malikilerde usul düşüncesi, usul düşüncesinin gelişim evreleri ve bu evrelerin Maliki usulünün oluşumuna etkileri üzerinde duruldu. Maliki ekollerinin kurulması, özellikleri ve en önemli temsilcilerinden bahsedildi. Malikilerin de görüşlerini dayandırdığı genel usul kuralları ile Malikilere has usul prensiplerinden bahsedildi. Malikilere has usul kaidelerindeki esnek yapının mezhebin gelişmesine etkileri ve ortaya çıkan yeni fıkhî sorunları çözmedeki kabiliyeti dile getirildi. Ayrıca Malikî fıkhının diğer özelliklerine de yer verildi. Bu arada İmam-ı Malik'in usul yöntemi hakkında da bilgi verildi. Araştırmada daha çok usulü fıkıh ihtilafının bir sonucu oluşan fıkhî uygulama farklılıklarına dair örnekler verildi. Bu örnekleri daha çok usulü fıkıh ihtilafının bir sonucu oluşturmaktadır. Örnekler verilirken ihtilaflı hangi usul kaidesinin bu farklı uygulamaya sebep olduğu, bu konudaki Malikî âlimlerinin görüşleri ve tercih edilen görüşün hangisi olduğu verilmeye çalışıldı. Çalışma yapılırken Malikî mezhebine ait görüşler üzerinde araştırma ve sentezleme yöntemi kullanıldı. Mezhebe ait görüşler analiz edildi ve tercih edilen anlayış ortaya konulmaya çalışıldı. Yapılan araştırma sonucunda fıkhî ihtilafların büyük bir çoğunluğunun usul ihtilaflarına bağlı olduğu görüldü. İmam-ı Malik'in usule dair bir metin ortaya koymadığı tespiti üzerinde duruldu. Araştırmayla Malikilerde fıkıh usulüne daha çok önem verilmesinin bir ihtiyaç olduğu ortaya çıktı. Çünkü Maliki fıkhında hala açıklığı kavuşturulamamış birçok fıkhî mesele bulunmaktadır. O nedenle fıkıhla irtibatlı olmak kaydıyla usul bilgisine önem verilmesi gerekmektedir. Fıkıh usulünün hedefinin fıkhî hükümlere nasıl ulaşılacağının yolunu göstermek olduğu unutulmamalıdır."
