abstract: "Ebu'l-Hüseyin el-Basrî, Basra Mu'tezile'sine mensuptur. Fıkıh usulü alanında yazdığı el-Mu'temed fî Usûli'l-Fıkh adlı eser müteahhirin usûl düşüncesinin kaynaklarındandır. Emir kavramı, şer'i hükümlere ulaşmayı ve Müslümanların İslami bir hayat sürmeleri açısından oldukça etkili bir kavramdır. Kur'an-ı Kerim'de ve hadis-i şeriflerde emir sîgasının kullanılması sebebiyle usûl alimleri tarafından emir meselesi, üzerinde durulan bir konu olmuştur. Bu tezde Basrî'nin emir kavramına yaklaşımı incelenmiştir. Basrî'nin emir kavramına yaklaşımı hocası Kâdî Abdülcebbâr'dan farklıdır. Basrî fukahâ gibi sîgayı önceleyen ve sîgayı esas alan bir yaklaşıma sahiptir. Bu yaklaşım emrin delâlet ettiği hükümde daha bariz ortaya çıkar. Basrî emrin vücûba delâletini sîgadan hareketle tespit etmektedir. Emrin hasen vasfını haiz olmasını Basrî emrin varid olmasının amacına müteallik olarak açıklar. Buna göre emir, mükellefin sevaba ya da cezaya müstehak olmasını sağlar."
