abstract: "Bu çalışma, İznik Kazası Mahkeme-i Şer'iyyesinde ( H.1341-1342/M. 1922-1923) yıllan arasındaki davaların kaydedildiği Ankara Milli Kütüphanesinde“İznik 36”numarasıyla kayıtlı Şer'iyye Sicil defteri üzerine yapılan bir araştırmadır. Bu araştırma, latinize ettiğimiz defterde yer alan kararlarla, bu döneme ait diğer kaynaklarda mevcut bilgileri bir araya getirerek yaptığımız değerlendirme sonucunda vardığımız tesbitleri içermektedir Altı asır gibi uzun bir süre ayakta kalmayı başarmış olan Osmanlı Devleti'nde kuruluşundan itibaren idari, siyasî, adlî ve bir çok alanda zaman zaman değişiklikler ve ıslahatlar yapılmıştır. Daha kuruluş yıllarından itibaren Osmanlı Devletine bağlı olan İznik kazası da idari statüsü açısından zaman içinde birçok değişmelere uğramıştır. Bu nedenle gelinen son konumun daha iyi değerlendirilebilmesi için ilk önce kazanın tarih içindeki seyri ele alınmış, sonrasında ise bu dönemde bir ilçe merkezi haline getirilmiş olan İznik kazasının idarî ve adlî yapısı incelenmiştir. Ayrıca halkın içinde bulunduğu ekonomik durum, dinî hayat, eğitim-öğretim ve aile yapısı konulan incelenerek şehrin sosyal yapısı ortaya konmaya çalışılmıştır."
