abstract: "Çalışmamızda, İslam ve Osmanlı Hukuk Tarihi açısından son derece önemli olan Mecelle-i Ahkam-ı Adliyye'nin, Mecelle Ta`dil Komisyonu tarafından ta`dil edilen maddelerinin İslam Hukuku açısından değerlendirmesini yapmaya çalıştık.Ta`dil Komisyonu'nun, Kitabu'l-Buyû'un 20 maddesinin değiştirilmesini, bu bölüme 10 madde ilave edilmesini ve bu bölümden 13 madde çıkarılmasını, Kitabu'l-İcare'de ise, 10 maddenin değiştirilmesini ve 13 maddenin ilave edilmesini teklif ettiğini tespit ettik.Ta`dil Komisyonu'nun, ta`dil çalışmalarını yaparken, Mecelle'nin zamanın ihtiyaçlarını karşılayabilecek bir kanun haline gelebilmesi için, Osmanlı Devleti'nin resmi mezhebi olan Hanefi mezhebinin dışında, başka mezheplerin görüşlerini de tercih ettiğini gördük. Ta`dil çalışmalarında en fazla Hanefi mezhebine, daha sonra Maliki mezhebine, daha sonra Hanbeli mezhebine ve en az da Şafii mezhebine başvurulduğunu tespit ettik."
