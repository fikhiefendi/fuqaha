abstract: "Osmanlı Devleti'nde şer'iyye sicilleri mahkemelerin verdiği kararların kadılar ve yardımcıları tarafından kaydedildiği defterlerdir. Bu defterlere kadı sicili, kadı defterleri de denilmektedir. Şer'iyye sicilleri Osmanlı hukuk sistemi içerisinde çok önemli bir yere sahiptir. Osmanlı Devleti'nin sahip olduğu hukuk yapısının ana hatlarını anlamamız açısından da ayrıca önemlidir. Bu sayede hukuk yapısının işlevi ve işleyişi hakkında önemli bilgiler elde etmekteyiz. Osmanlı Devleti içerisinde yaşayan tüm milletleri ilgilendiren her türlü konu, dava konusu olarak görülmekteydi. Bu yüzden mahkeme kayıtları yazıldıkları dönemin sosyal, kültürel, hukuki, idari ve ekonomik yapısı hakkında bizlere önemli bilgiler sunmaktadır. Şer'iyye sicilleri bu kadar kapsamlı konuları içerdiğinden bir yandan biz araştırmacılara ayrıca tarihçilere kaynak olma ve yol gösterme işlevi üstlenirken diğer yandan da hukuk, iktisat, sosyoloji, askeri gibi alanlarda da birinci elden kaynaklar olarak kullanılmaktadır. Tezimizin konusunu oluşturan 419/2 Numaralı Siirt Şer'iyye Sicili 1893-1895 (H. 1311-1313) yıllarını kapsamaktadır. Bu defterin içerisinde birden fazla konu başlığı bulunmaktadır: Alacak-verecek, miras, tereke, icra, mülk satışları, mallara gasp ve zarar verme, hırsızlık, boşanma, nafaka, yaralama, katl gibi davalar incelediğimiz şer'iyye sicillerinde geçen konulardan bazılarıdır. Araştırmamızı kapsayan defterdeki kayıtlar ile ilgili değerlendirmeler yapılmış ve 1893-1895 yılları arasındaki tarihlerde Siirt ilinin sosyo-ekonomik yapısı, idari yapısı ve kültürel yapısı hakkındaki birçok bilginin gün ışığına çıkmasını sağlamıştır."
