abstract: "İnsanı diğer canlılardan ayırt eden, birtakım sorumlulukları yerine getirebilmesini sağlayarak ilahi hitaba muhatap kılan temel özelliklerin başında akıl gelir. Aklın bulunmadığı yerde ortaya konan eylemin geçerliliği sorgulanmaktadır. Sağlığa büyük önem atfeden İslam dini insanın akıl sağlığının yerinde olmasına da o derece önem vermiştir. Akıl sağlığı beraberinde ruh sağlığını da getirmekte olup akıl sağlığının yerinde olması ruh sağlığı ile doğrudan bir bağlantı içerisindedir. Ruh halinde yaşanan sıkıntılar davranışlara yansımakta bu da akıl sağlığını doğrudan etkilemektedir. Bu nedenle beden ile birlikte akıl ve ruhtan her ikisinin de sağlıklı olması halinde tam bir sağlık halinden söz etmek mümkündür. İslam hukukunda bir eylemin, işin sorumluluğunu bireyin üstlenebilmesi ehliyet nazariyesi ile açıklanmıştır. Var olmayı ve aklı temele alan ehliyet teorisine göre insan hayatı çeşitli devirlere ayrılarak her devirde insana farklı sorumluluklar yüklenmiştir. Fakat bazı durumlar vardır ki bu sorumlulukların yerine getirilmesine engel teşkil etmektedir. Klasik fıkıh literatüründe aklın izalesiyle sorumluluğu ortadan kaldıran bu durumlar ehliyet arızası olarak isimlendirilmiştir. Klasik kaynaklarda cünun ve ateh akıl hastalığı olarak değerlendirilmiş fakat hastalıkların detayına girilmeden mecnun ve matuhun sözlü ve fiili tasarruflarına dair genel hükümler belirtilmiştir. Günümüzde ise akıl hastalıkları kapsamına hangi hastalıkların dahil olduğu konusunda ve hastalıkların mahiyetine dair tıbbi literatürde oldukça fazla çalışma bulunmaktadır. Ele alınan çalışmalarda her bir hastalığın aklı ne derece etkilediği birbirinden farklılık arz etmektedir. Bu durum ise çeşitli soru ve sorunların oluşmasına neden olmuştur. Hangi hastalıkların akıl hastalığına girdiği konusunda henüz net bir sınır çizilememiş olsa da çalışmamızda temel tanı kitaplarında zikredilen hastalıklar klasik kaynaklardaki bilgiler ile birlikte ele alınmıştır. Hayatın farklı dönemlerinde çeşitli sorumluluklara sahip olabilen insanın hem dinî sorumluluklarını hem de diğer yükümlülüklerini yerine getirebilmesi için temel şart olan akılda farklı şekillerde hastalıklar meydana gelebilmektedir. Bu hastalıklar insan aklının işlevini tamamen engelleyebildiği gibi bazen bu durum aralıklı bir şekilde seyredebilmekte veya kısmi bir engelleme şeklinde gerçekleşebilmektedir. Araştırmamızda tıbbi literatürde akıl hastalıklarının aklı ne derece engellediği ele alınarak, klasik kaynaklardaki bilgiler ile birlikte günümüzde insanın ibadetleri, mali tasarrufları, evlenip boşanması ve cezai sorumluluğu üzerindeki etkisi incelenmiş ve bir sonuca ulaşılmaya çalışılmıştır."
