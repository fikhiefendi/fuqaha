abstract: "Alman ilim camiasında İslam hukukuna duyulan ilgi, dün olduğu gibi bugün de artarak devam etmektedir. Bu bağlamda Alman İslam araştırmacıları tarafından İslam hukukuna ilişkin yapılan araştırmaların büyük bir kısmı klasik İslam hukukuna yönelik iken araştırmaların diğer kısmı İslam hukukunun bugününe yönelik meselelerini konu edinmektedir. Bu çalışmada İslam hukukunu her iki boyutuyla bir bütün olarak ele alan Alman hukukçu ve İslam hukuku uzmanı Mathias Rohe örneğinde İslam hukukunun klasik ve modern dönemdeki gelişmeleri yanında Avrupa ve Almanya bağlamındaki konumu tasvir edilmeye çalışılmıştır. Giriş bölümünde yazarın hayatı ve ilmî kişiliği yanında İslam ve İslam hukuku hakkında yapmış olduğu çalışmaları ve en genel anlamda İslam hukukunun mahiyetine dair temel görüşleri tanıtılmıştır. Klasik İslam hukukunun ele alındığı birinci bölümde İslam hukukunun teşekkülü ile İslam hukuk metodolojisi ve gelişimi üzerinde durulduğu gibi klasik İslam hukukunda işlenilen temel alanlardaki hukukî düzenlemeler konu edinilmiştir. Modern İslam hukukunun ele alındığı İkinci bölümde ise 19. yüzyıldan sonraki gelişmeler, reformlar ve bu süreçte takip edilen yöntemler incelenmiş, yeni bir şekil kazanan modern İslam hukukunun temel alanlarındaki düzenlemeler mercek altına alınmıştır. İslam ve İslam hukukunun Avrupa bağlamında incelendiği üçüncü bölümde Avrupa hukuk geleneğinin temel dinamikleri ve İslamî hükümlerin Avrupa bağlamında uygulanmasının kapsam ve mekanizmaları yanında Avrupa İslam'ı mefhumu ele alınmıştır. İslam ve İslam hukukunun Almanya özelinde işlenildiği dördüncü bölümde ise İslam'ın hem hukukî hem dinî hükümlerinin uygulanma alanları ve sınırları spesifik hukuk alanlarına göre ele alınmış, bu esnada siyasal İslam, entegrasyon ve İslam teolojisinin teşekkülü gibi konular üzerinde ayrıca durulmuştur."
