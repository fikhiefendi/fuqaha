abstract: "Bu çalışma, Debûsî (v. 430/1038) ve Gazzâlî'nin (v. 505/1111) İslam hukuk metodolojisine dair değerlendirmelerini ve görüşlerinin karşılaştırılmasını konu edinmektedir. Giriş Bölümü'nde araştırmanın amacı, önemi ve kullanılan kaynak ve yöntemler hakkında bilgi verilmektedir. İlk bölümde müelliflerin hayatları, yaşadıkları dönem ve eserleri hakkında genel bilgiler verilmiştir. İkinci bölümde Debûsî ve Gazzâlî'nin şer'î hükmün delilleri hakkındaki görüşleri, el-Müstaṣfâ ve Takvîmü'l-Edille esas alınarak incelenmiştir. Ayrıca kendi mezheplerinden farklı olan bakış açılarına da, değinilmeye çalışılmıştır. Bu bölümün ikinci kısmında, Gazzâlî ve Debûsî'nin şer'î hükmün tâlî delilleri; İstishab, İstihsan, Şer'u Men Kablenâ, Sahâbî Kavli ve İstislâh hakkındaki görüşleri serdedilmektedir. Üçüncü Bölüm'de ise Debûsî ve Gazzâlî'nin şer'î hüküm ve delillerden hüküm çıkarma yöntemleri hakkındaki görüşleri incelenmektedir. Konuların anlatımı yapılırken, mezheplerin görüşleri ve diğer âlimlerin sözleri de müelliflerin bakış açılarıyla karşılaştırılarak, mukayese edilmektedir. Araştırmanın Sonuç kısmında Gazzâlî ve Debûsî'nin, İslam hukuk metodolojisinin ana konularında ittifak etseler de, furû' meselelerde mezheplerinin görüşleri doğrultusunda ihtilaf ettikleri görülmektedir. Ancak müelliflerin bu görüşleri, fukaha ve mütekellimîn metotlarının daha iyi anlaşılmasına ve İslam hukuk metodolojisinin günümüz dünyasına uygun bir şekilde yorumlanabilmesine büyük katkılar sağlamaktadır. Anahtar Sözcükler: İslam Hukuku, Hukuk Metodolojisi, Debûsî, Gazzâlî ve Görüş Farklılıkları"
