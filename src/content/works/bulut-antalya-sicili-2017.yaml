abstract: "Geçmişten günümüze ışık tutan en önemli belgelerden birisi şer'iyye sicili defterleridir. Şehirlerin idari, sosyal, iktisadi yapısını günümüze kadar ulaştırabilen bu kaynaklar, düzenli olarak tutulmuş, belirli sistemlere göre kayıt yapılmıştır. Çalışmamızın içeriği belirli sistemlerle kayıt altına alınmış bir şer'iyye sicilinin incelenmesi sonucu ortaya çıkmıştır. Bu çalışmada Antalya'nın 1897-1902 tarihleri arasında idari durumu, sosyo-ekonomik yapısı, kültürel dokusu belirli başlıklar altına incelenmiştir. Dünya tarihinin uzun ömürlü devletlerinden olan Osmanlı Devleti'ni etnik, dini ve kültürel farklılıklar bakımından zengin, ancak bir o kadar da problemli bir coğrafyada altı asrı aşan bir süre ayakta tutan faktörlerin başında, bu devletin sahip olduğu hukuki yapı ve bunun işletilme biçimi olduğu şüphesizdir. Kuruluşundan Tanzimat'a kadar belirli hatlarla devam ettirilen Osmanlı devlet teşkilatı, Tanzimat Dönemi'nden itibaren köklü ve çok yönlü bir dönüşüm sürecine girmiş, siyasî, iktisadî ve toplumsal alanlarda değişimler meydana gelmiş, bu durum doğal olarak yargı alanında da sayısız değişikliğe sebep olmuştur. Çalışmamızda Antalya 84 Numaralı Şer'iyye Sicilindeki bilgiler bu doğrultuda ele alınıp değerlendirilmiştir. Bu çerçevede elde edilen bilgiler ışığında öncelikle Tanzimat dönemi ve sonrasında yaşanan değişimlerin Antalya bölgesine (Teke sancağına) etkileri üzerinde durulmuştur. Çalışmamızın temel kaynağı 84 Numaralı Şer'iyye Sicili Defterine göre, 1897-1902 tarihleri arasında Antalya'da Müslimler ve Gayrimüslimlerin birlikte yaşadıkları anlaşılmaktadır. Gayrimüslimler ticaret ve zanaatla uğraşırken Müslüman halk ise genel olarak tarım ve hayvancılık yapmaktadır. Gayrimüslim ahali idari ve sosyal hayatın her kademesinde yer almaktadır."
