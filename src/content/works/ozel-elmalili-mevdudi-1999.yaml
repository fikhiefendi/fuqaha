abstract: "ÖZET Bu tez, giriş ve beş bölümden oluşmaktadır. Giriş'te, bugüne kadar, Hak Dîni ve Tefhim üzerine, yapıldığını tespit edebildiğimiz çalışmalar hakkında kısaca bilgi sunulmaya gayret edildi. Birinci Bölüm' de, her iki tefsirde ortak ya da farklı olarak kullanılan kaynaklar, örnekler verilerek, tespit edilmeye çalışıldı. Neticede müfessirlerin zengin bir kaynağa sahip oldukları görüldü. ikinci Bölüm' de, tefsirlerin yazılış gayelerine, hitap ettikleri okuyucu kesimine, tefsir usulüyle ilgili bazı yaklaşımlarına, iki eserin birini diğerinden ayıran kimi özelliklere temas edildi. Üçüncü Bölüm' de, Elmalılı ile Mevdudi'nin geleneksel tefsir yöntemini kullanıp kullanmadıkları belirlenmeye çalışıldı. Sonuçta onların bu tarzı uyguladıkları görüldü. Dördüncü Bölüm'de, pozitif bilimler yardımıyla Kur'an'ın tefsir edilişine, bazı ayetlerin toplumsal boyutlarıyla değerlendirilmesine yer verildi. Bunların İslam dünyasınm sorunlarıyla ilişkili olmasına özen gösterildi. Beşinci Bölüm'de, her iki müfessirin, önceki dönemlerdeki ya da çağdaşı oldukları yazarlara yönelttikleri eleştirilerle, başkalarının kendilerine yönelttikleri tenkitler ele alındı. Çalışma bir değerlendirme ile sona ermektedir."
