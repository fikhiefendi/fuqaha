abstract: "Aile, toplumun temelini oluşturmaktadır. İslam aileyi sevgi, saygı, hoşgörü ve adalet esasına dayandırmaktadır. Ancak bazen eşler arasında problemler oluşmakta, geçimsizlik baş göstermektedir. Bu durumda İslam hukukunda ailenin sağlıklı, mutlu ve huzurlu bir şekilde devam etmesi yönünde taraflara birtakım önerilerde bulunulmakta, tedbirler alınmakta ve çareler sunulmaktadır. Evlilikte sorunların oluşmaması için nikâh akdi öncesinde eşlerde kan, süt ve sıhri akrabalık, din farklılığı, üç talakla boşanma, evli olma, iki akraba ile birlikte evlenme, iddet içinde bunma gibi sürekli ve geçici evlenme engellerinin bulunmaması ve eşlerin dini hassasiyet, ekonomik şartlar, aile ve soy, eğitim seviyesi, yaş, sakatlık gibi konularda birbirlerine denk olmaları şeklinde tedbirler alınmaktadır. Nikâh akdi sırasında alınan tedbir ise nikah akdinin rükünlerinin, in'ikad (kuruluş), sıhhat, nefaz ve lüzum şartlarının tam olarak yerine getirilmesini sağlanarak akdi bütün sonuçlarını doğuracak şekilde tam sağlam yapılmasını istemektir. Hemen nikâh akdi sonrasında alınacak tedbirler olarak da evlilikte eşlerin karşılıklı hak ve sorumluluklarının gereği üzere yerine getirilmesidir. Bütün bu tedbirlere rağmen yine de sorun çıktığında öncelikle aile içinde çözüm yolları aranması istenmektedir. Bu çözüm yolları olarak da; sabır, sulh, öğüt, yatakları ayırma, darb, tahkim, muhâla'a, îlâ', zıhar, ve talak şeklinde sıralamaya riayet ederek bir aşama takip edilmesi tavsiye edilmektedir. Bu zamana yayılan süreçten sonra hala sorun çözülemediğinde yargı yolu ile çözüm bulma yoluna da gidilebileceği de belirtilmektedir."
