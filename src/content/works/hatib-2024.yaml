abstract: "İslâm fıkhını, geçirdiği evreleri, fıkhın müslümanların kalbindeki yerini ve özellikle de gökten inen şer'î hükümler ile mükellef olan insanların fiilleri arasındaki irtibatı doğru bir şekilde inceleyen kişi bu şeriatın üstünlüğünü açıkça görecektir. Âlimlerimizin İslâm fıkhını son derece güzel bir şiirin mısraları gibi bize sunduğunu, o hükümlerin en usta bir ressâm eliyle çizilmiş bir tablo gibi durduğunu anlayacaktır. İşte bu durum; kültür mirâsımızın büyüklüğünü göstermekte, bizim için bu önsözü ve peygamberliğin hidayet nurundan beslenenen bu mükemmel yöntemi dokuyanların kıymetini hissettirmektedir. Bu yöntem, bize gelen şer'î nasların okunup incelenerek özünün ve mükelleflerin fiillerine uygulanacak fıkhî hükümlerinin çıkarılması usûlüne dayanıyordu. Alimlerimiz bu naslardan, fer'î ve özel hükümlerin türetilmesine temel teşkil eden küllî ve genel kâideleri çıkarmaya gayret ettiler. Genel hükümleri içeren genel kâideleri tayin ettikten sonra özel ve ayrıntılı hükümleri çıkarabilmek için tafsîlî naslara yönelip amel etsinler diye mükelleflerin önüne serdiler. Naslarda açıkça geçmeyen yeni olayları ise belirlenen kıyas kurallarına uygun bir şekilde naslarda bulunan benzerlerine kıyas ettiler. Bizim kültürümüzde“Fıkıh”ve“Usûl-u Fıkıh”denilen ilimler bu şekilde ortaya çıkmış oldu. Daha sonra kolaylık için bu çok sayıdaki hükmü toplayıcı belli kâideler koydular. Bundan dolayı“Kavâid-i Fıkhiyye”ve“Zavâbıt-ı Fıkhiyye”ilimleri meydana geldi. İnsanlar bu ilimlerle ilgilendikçe, geçmişlerini takip eden ve kapalı yerleri açan alimlerimizin elinde bu ilimlerin terimleri farklı evrelerden geçerek genişlemeye başladı. Böylece fıkıh ve usûl-u fıkıh, bize bu kültürü aktaran çeşitli faydalar ile yenilenmiş ve taze halde ulaşmış oldu. Bu tezde ise alimlerin bu fennin terminolojisini çok titiz bir şekilde düzenledikleri ve bu fennin neredeyse altın çağlardan biri olan dönemde meydana gelen gelişmelere ışık tutmak için sadece sekizinci asırda hanefî alimlerinin usûlunü anlatmakla yetindim. Çalışmam giriş, dört fasıl ve sonuçtan oluşmaktadır. Giriş bölümünde usûl-u fıkhın mânâsından, hanefîler nezdindeki tarihî gelişmelerden ve bu dönemler içerisinde yazılmış önemli kitaplardan bahsettim. Birinci fasılda sekizinci asrın siyasî durumundan ve ilmî hareketliliğinden bahsettim. Çünkü bu asırdaki siyasî durumun âlimler, dolayısıyla ilmî çalışmalar ve özellikle de tedvîn faaliyetleri üzerinde büyük etkisi bulunuyordu. Tıpkı“Zor zamanlar büyük eserler doğurur.”sözünde olduğu gibi. İkinci fasılda sekizinci asırda hanefî mezhebi ekolünü, en önemli âlimlerini ve o dönemde yazılmış eserleri anlattım. Üçüncü fasılda hanefî ekolünü ve ayırt edici en önemli özelliklere ışık tuttum. Dördüncü fasılda ise o asırda yazılan en mühim kitapların ayrıntılı incelemesine yer verdim. Sonuç kısmında da çalışmam boyunca ulaştığım önemli neticeleri, belli tavsiyeleri ve konu fihristini eklemiş oldum. Allâh celle celâluhû doğruya ulaştırandır."
