abstract: "İklim değişikliği, doğal kaynakların tükenmesi ve çevresel tahribat gibi küresel sorunların etkisinin giderek derinleştiği günümüzde, sürdürülebilir kalkınmayı teşvik eden finansal araçlara duyulan ihtiyacı arttırmıştır. Bu bağlamda yeşil tahviller, çevresel amaçlara hizmet eden projelerin finansmanında önemli bir rol üstlenerek çevre dostu yatırımlar ile finansal piyasalar arasında bir köprü işlevi görmektedir. Bu çalışmanın amacı, yeşil tahvil uygulamalarının genel çerçevesini çizmek ve Türkiye'de yeşil tahvil piyasasının gelişim sürecine ilişkin mevcut durumu analiz ederek, gelişime yönelik politika önerileri sunmaktır. Çalışmanın alanyazın bölümünde genel olarak tahvil ve yeşil tahvil kavramları açıklandıktan sonra yeşil tahvil piyasasının küresel ölçekteki gelişimi incelenmiştir. Uygulama bölümünde ise Türkiye'de gerçekleştirilen yeşil tahvil ihraçları özel sektör ve kamu kesimi örnekleri üzerinden değerlendirilmiş ve yeşil tahvil alanındaki mevcut durum analizi yapılarak SWOT analizine yer verilmiştir. Elde edilen bulgular, Türkiye'de yeşil tahvil piyasasının gelişim aşamasında olduğunu, ancak potansiyelinin oldukça yüksek bulunduğunu ortaya koymuştur. Piyasanın genişlemesi önündeki en büyük engeller arasında yatırımcı farkındalığının düşük olması, ikincil piyasa likiditesinin sınırlı kalması ve çevresel etkilerin raporlanmasında şeffaflık eksiklikleri yer almaktadır. Türkiye'de yeşil tahvil piyasasının gelişimi için yasal düzenlemelerin güçlendirilmesi, teşvik edici mekanizmaların oluşturulması ve sürdürülebilirlik ilkelerinin kurumsal düzeyde benimsenmesi gibi önerilere yer verilmiştir."
