abstract: "ÖZET Bu çalışma, kadının siyasal haklar yönünden tarihteki durumuna kısaca değinilen bir giriş ve üç bölümden oluşmaktadır: Birinci bölümde, önce 'siyasal hak' kavramının tanımı ve kapsamı üzerinde durulmuş, daha sonra İslâm hukukunun kadının seçme hakkına bakışı incelenmiştir. İkinci bölümde, seçilme hakkı kapsamında kadının devlet başkanı olup olamayacağı konusu araştırılmış, önce kadının devlet başkanı olamayacağı görüşünü benimseyenler ve bunların delilleri detayıyla incelenmiştir. Daha sonra kadının devlet başkanı olabileceği görüşünde olan İslâm bilginleri ve bunların delillerine yer verilmiş, sonunda kendi değerlendirmemiz sunulmuştur. Üçüncü bölümde ise önce, kadının milletvekilliği ve bakanlık gibi üst düzey kamu görevlerini yerine getirip getiremeyeceği konusu araştırılmış, bu konudaki görüş ve yorumlara yer verilerek, kritiği yapılmıştır. Daha sonra kadının hakimliği konusu ele alınmıştır. Buna göre, kadının hakimliğini kabul ya da reddeden görüşlere ve delillere yer verilip, sonunda kendi değerlendirmemiz sunulmuştur. Sonuç olarak, kadının seçmenliğinin, devlet başkanı, başbakan ve milletvekilliği gibi üst düzey ve hakimlik gibi diğer kamu görevlerinde bulunmasının önünde, İslam hukukundan kaynaklanan bir engelin olmadığı kanaatine ulaşılmıştır."
