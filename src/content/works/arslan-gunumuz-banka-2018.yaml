abstract: "Banka, önemini her geçen gün daha da artıran iktisadi bir kavramdır. Bu kavram ülkemizde de kendisini göstermekte ve gelişimi tüm hızıyla devam etmektedir. Banka denildiğinde ise ilk akla gelen konu faizdir. Bankalar farklı açılardan sınıflandırılabilmektedir. Bizim çalışmamızda bankalar iki kısma ayrılarak incelenmiştir. Bunlar faiz esaslı geleneksel bankalar ve İslami prensiplere dayalı katılım bankalarıdır. Faiz esaslı bankalarda yapılan işlemlerin İslam hukukundaki hükmü, söz konusu işleme ve kişinin durumuna göre değişebilmektedir. Katılım bankalarında ise işlemler İslami prensipler göz önünde bulundurularak yapıldığı için caiz görülmektedir. Ancak faiz esaslı bankalarda olduğu gibi, katılım bankalarında da İslami prensipler göz ardı edilirse bu işlemler caiz olmayacaktır. Bu çalışma; bir giriş, iki bölüm ve bir sonuçtan meydana gelmektedir. Çalışmanın giriş bölümünde konu ana hatlarıyla ortaya konulmuştur. Birinci bölümde banka kavramı ve banka işlemleri hakkında genel bilgilerle İslam hukukundaki bazı akit türleri ele alınmıştır. İkinci bölümde banka işlemlerinin İslam hukukundaki karşılıkları belirtilmiş ve İslam hukukuna göre hükümleri açıklanmıştır. Sonuç bölümünde ise konunun genel bir değerlendirilmesi yapılmış ve çalışma tamamlanmıştır."
