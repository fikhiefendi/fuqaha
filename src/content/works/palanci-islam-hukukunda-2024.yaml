abstract: "Yargı etiği ilkelerinin belirlenmesi, dünya genelindeki hukuk sistemlerinin temel taşlarından biri olmuştur. Bu ilkeler, âdil, tarafsız ve etkin yargı süreçlerinin yürütülmesini amaçlar, böylece adalet sistemi toplum nezdinde güvenilir kalır. İslam hukukunda da adalet, merkezi bir yer tutar ve hâkimlerin uyması gereken ahlaki standartlar belirlenmiştir. Bu standartlar, hâkimlerin uzmanlık, tarafsızlık, bağımsızlık, âdillik, dürüstlük ve güvenilirlik gibi niteliklere sahip olmalarını ve toplum tarafından bu şekilde algılanmalarını gerektirir. İslamî yargı ilkeleri, Hz. Peygamber döneminden itibaren uygulamada yer almış, zamanla gelişerek yazılı hukuki metinlere dönüşmüş ve resmi yargı kuralları haline gelmiştir. Bu çalışmada, tarihsel belgelerde yer alan yargı etiği ilkelerini, günümüzde uluslararası alanda kabul gören ilkelerle karşılaştırmalı bir şekilde ele alıyoruz. Bu karşılaştırma, tarihsel ve kültürel bağlamda önemli bir perspektif sunmakta ve günümüz hukuk dünyasının evrensel değerlerle olan etkileşimini gözler önüne sermektedir."
