abstract: "Bu çalışmada, günümüzde üzerinde en çok vakit ve emek harcanan ve dünyevî bir uğraş olarak görülen iktisadın, modern hayattan bir tür kaçış ve uhrevî bir faaliyet alanı olarak algılanan tasavvuf penceresinden görünümü üzerinde durulmaktadır. Bu kapsamda, öncelikle sûfîlerin iktisat anlayışının kaynakları sunulmakta ve temel iktisâdî ve tasavvufî kavramlar birbirleriyle olan ilişkileri açısından incelenmektedir. Tarihte farklı mutasavvıfların iktisâdî düşünce ve uygulamaları ile tasavvuf merkezli iktisâdî ve sosyal teşkîlâtlanmaların tespit edilmesi ve tüm bu çalışmaların birlikte ele alınması ile 'tasavvuf iktisadı' fikrine ulaşılmaktadır. 'Tasavvuf iktisadı' sûfîlerin iktisâdî madde ve hayat karşısındaki düşünce ve tavırlarından hareketle önerilen bir kavramlaştırmadır. Buna göre, tasavvufun iktisat içindeki insan karakteri 'iktisâdî sûfî' olarak adlandırılabilir. 'Tasavvuf iktisadı' mevcut seküler ekonomik ideolojilerden temel konularda farklılaşmaktadır. Sûfîlerin iktisâdî motivasyon kaynakları kendilerine özgüdür ve tasavvuf iktisadının 'iktisâdî tevhid' başta olmak üzere dayandığı bazı esaslar vardır. Anlaşılmaktadır ki, tasavvuf iktisadı vahdeti kesrette bulma, kâinata ulu bir nazar ile bakarak yokluk bilincine ulaşma ve bu yokluk ile hakîkî varlığa erişme yoludur. Bu anlamda tasavvuf ile iktisat insan hayatında birbirinden kopuk iki ayrı alan değil, dünya ile âhiret, madde ile mânâ gibi birbirini tamamlayıcı unsurlardır."
