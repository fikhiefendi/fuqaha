abstract: "“İbn Kudâme'nin el-Muğnî Adlı Eserindeki Ebû Hanife'ye Nispet Edilen Görüşlerin Tahkiki (İbadetler Bölümü)”adlı bu çalışma; Hanbelî mezhebinin muteber kitaplarından olan el-Mğnî'nin ibadetler bölümünde İmam Ebû Hanife'ye nispet edilen görüşlerin doğru olup olmadığı tespit edilmeye çalışılmıştır. Bu amaçla yaptığımız çalışma bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında tezin konusu, amaç ve yöntemi ile araştırmanın kaynaklarından bahsedilmiştir. Birinci bölümde İbn Kudâme'nin yaşadığı dönemin ilmî ve siyasî durumu, hayatı, Hanbelî mezhebi ve fıkıh dünyası içerisindeki yeri, el-Muğnî ile diğer eserleri incelemeye tabi tutulmuştur. İkinci bölümde ise, el-Muğnî'nin ibâdetler bölümünde Ebû Hanîfe'ye nispet edilen görüşlerin tahkikine yer verilmiştir. Şöyle ki, öncelikle Ebû Hanîfe'ye nispet edilen görüş el-Muğnî'den tespit edilmiştir. Sonra da tespit edilen bu görüş Hanefî'lerin muteber kitaplarında bu görüşün doğru olup olmadığı araştırılmıştır. Çalışmanın sonuç bölümünde ise çalışma neticesinde elde edilen bulgulara yer verdik. Ayrıca bu alanda yapılacak çalışmaların bir kısmına da sonuç bölümünde zikrettik."
