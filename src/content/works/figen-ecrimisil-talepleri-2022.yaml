abstract: "Ecrimisil bir şeyin haksız kullanımından doğan değerlerin karşılığını anlatan hukuksal bir kavramdır. Ecrimisil talepleri ise uygulamada sıklıkla karşılaşılan bir dava türüdür. Özel hukuk mevzuatında açıkça düzenlenmeyen ecrimisil talepleri yargı kararları ile sistematize edilmeye çalışılmıştır. Buna karşılık somut olaylara ilişkin farklı yargı kararlarının olması hukukta birliğin sağlanmasına engel olmuştur. Ecrimisilin tanımı konusunda doktrin ve uygulamada bir görüş birliği sağlandığı ifade edilebilse de ecrimisilin hukuki niteliği konusunda ciddi görüş farklılıkları bulunmaktadır. Ecrimisilin özel hukuktaki tartışmalı niteliği, ecrimisil taleplerine uygulanacak hukuka etki etmekte; bir bütün olarak ecrimisil taleplerinin özel hukuk açısından incelenmesini gerektirmektedir. Bu nedenle tezimizde ecrimisil talepleri ele alınmış ve bu talepler özel hukuk açısından bir sistematiğe kavuşturulmaya çalışılmıştır. Çalışmamızın konusu ecrimisil talepleridir. Taleplerin açıklanmasından önce ecrimisilin açıklanması gerekir. Zira ecrimisil kavramı geçmişten bu yana hukuk literatüründe kullanılan bir hukuk terimidir. Bu nedenle çalışmamızın birinci bölümünde ecrimisilin tanımı yapılmış ve tarihi süreçte gelişimi ele alınmıştır. Çalışmamızın ikinci ve üçüncü bölümlerinde, ecrimisilin hukuki niteliği ve uygulamada ecrimisil talepleri incelenmiştir. Hukuki niteliği konusunda görüş ayrılıkları ifade edilmiş ve uygulanması gereken hukuk açısından ecrimisilin niteliği belirlenmiştir. Son bölümde, özel hukukta ecrimisilin pozitif hukuka göre talep şartları ortaya konularak, ecrimisil taleplerinde uygulanan özel durumlar tespit edilmiştir. Böylece ecrimisil talepleri maddi ve şekli açıdan sistematize edilmiştir."
