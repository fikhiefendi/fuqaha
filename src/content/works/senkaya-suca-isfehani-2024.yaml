abstract: "Dönemin önde gelen Şâfiî âlimlerinden biri olan Ebû Şücâ' el-İsfehânî; mezhebin önemli fakihlerinden kabul edilmektedir. Uzun yıllar kâdılık görevi üstlenmesi ve kırk yılı aşkın bir süre Şâfiî fıkhının tedrisatıyla ilgilenmesi Ebû Şücâ'ın fıkhî yönünün incelenmesini konumuz açısından önemli hale getirmektedir. Ayrıca mezhebin fıkhî hükümlerinin öğretilmesi amacıyla telif edildiği dönemden günümüze kadar medreselerde ders kitabı olarak okutulan Gâyetü'l-ihtisâr, müellifin eserleri arasında büyük bir şöhret elde etmiştir. Şâfiî mezhebinin istikrâr döneminin sonlarına doğru telif edilen eser, bu dönemde mezhebe ait birçok eser telif edilmesine rağmen ihtilaflı meselelerde kuvvetli görüşlerin zayıf görüşlerden henüz ayıklanmadığı bir döneme rastlamaktadır. Bu dönemi takip eden tenkih döneminde müellifin mezhep içerisinde kuvvetli kabul edilmeyen görüşlerinin bulunduğu gözlemlenmektedir. Bu durum, mezhebi yeni öğrenenler açısından zorluklara neden olabilmektedir. Çalışmamızda Ebû Şücâ'ın hayatı, yaşadığı dönemi, Gâyetü'l-ihtisâr'ın genel tanıtımı ve mezhep içerindeki önemi hakkında bilgi verildikten sonra müellifin bazı fıkhî görüşleri tespit edilmiştir. Tespit edilen fıkhî görüşler arasından mezhepte kuvvetli kabul edilen ve zayıf kabul edilen görüşleri incelenmiştir. Bu incelemede eserin şerh ve hâşiyelerinden faydalanılmıştır. Ayrıca müellifin fıkhî tercihleri ve Şâfiî mezhebindeki değerinin daha iyi anlaşılması için tenkih dönemi âlimlerinden Râfiî ve Nevevî'nin eserleri ile karşılaştırılmıştır. Zayıf görüşlerin tespitinde ve mezhepte tercih edilen görüşlerin belirlenmesinde, mezhebin ciddi ayıklamasını yapan Nevevî'nin tercihleri esas alınmıştır. Yapılan incelemede günümüze kadar mezhep içerisinde önemini koruyan Gâyetü'l-ihtisâr'ın bazı meselelerde mezhebin kuvvetli görüşlerini tercih etmediği tespit edilmiştir."
