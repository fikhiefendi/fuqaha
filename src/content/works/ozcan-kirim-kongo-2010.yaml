abstract: "Kırım-Kongo Kanamalı Ates (KKKA) hastalıgı, Crimean-Congo hemorrhagic fevervirus (CCHFV) tarafından olusturulan ve önemli oranda mortal seyreden bir viralkanamalı ates (VKA) hastalıgı olup, hastalık için özgün antiviral tedavi henüzbulunmamaktadır. Bu çalısmada 2003-2009 yılları arasında KKKA tanısı ile takipedilen ve oral ribavirin tedavisi alan (ribavirin gurubu) ve almayan (kontrol gurubu)456 (%53,6) erkek, 394 (%46,4) kadın, toplam 850 KKKA hastası çalısmaya alındı.Amacımız, oral ribavirinin KKKA'da vaka-ölüm oranı üzerine etkisini incelemek idi.KKKA tanısı Ankara'da Refik Saydam Hıfzıssıhha Merkezi'nde hastaserumlarında anti-CCHFV IgM ve/veya virus antijeni varlıgı ve/veya real time PCRyöntemi ile kondu. Lojistik regresyon analizinde kanama, bilinç bozuklugu, 65 yasüzerinde olma, karaciger enzimlerinin normalin iki katı ve üzerinde olması ileinternational normalized ratio (INR)'nun 1,5'in üzerinde olması fataliteyi gösterenbagımsız risk faktörleri olarak degerlendirildi.Oral ribavirin tedavisi alan 336 hastadan 24 (%7,1)'ü, almayan 514 hastanınise 36 (%7)'sı takip sırasında kaybedilmis olup, oral ribavirin tedavisinin KKKA'davaka-ölüm oranı üzerine bir etkisinin olmadıgı saptandı (p>0.05). Hastalık belirtileribasladıktan sonraki ilk 4 gün içinde ribavirin tedavisi alan 225 hastadan 14 (%6,2)'ü,5 gün ve sonrasında ribavirin tedavisi alan 111 hastadan ise 10 (%9)'u takip sırasındaölmüs olup iki gurup arasında istatistiksel olarak fark saptanamamıstır (p>0.05).Buna göre oral ribavirin tedavisi KKKA'nın erken döneminde de vaka-ölüm oranıüzerine etkili olmamıstır. Literatürdeki en genis hasta gurubuyla yaptıgımız bu geriyedönük çalısmanın sonuçlarına göre oral ribavirin tedavisi KKKA'da etkili degildir.lacın etkin olup olmadıgının kesin olarak degerlendirilmesi için uygun hastasayılarını içeren, rastgele ve çift kör çalısmalara gereksinim vardır."
