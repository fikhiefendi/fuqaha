abstract: "Bu tezin amacı, aile içerisinde meydana gelen sorunların çözülmesi ve toplumun en küçük birimi olan aileyi ayakta tutmak üzere, İslam hukukunda başvurulan tahkim kurumunun hukuktaki yerini orta koymak, ülkemiz hukukunda cari olan Aile Mahkemelerinin yerine getirdiği fonksiyonu anlatmak ve islam hukukundaki tahkimin modern hukukla mukayesesini yapmaktır. Bu amaçla, çalışmada tahkim kavramı ve tarihsel süreç kısaca özetlenerek, günümüz hukukunda Aile Mahkemelerinin kuruluş, görev, fonksiyonlarına yer verilmektedir. Ardından İslam hukukundaki tahkimin modern hukukla mukayesesi yapılmıştr. Tarihsel sürece ve günümüz hukukuna baktığımızda tahkimin, iki taraf arasında meydana gelen problemlerin halledilmesi için, yargının dışında başvurulan vazgeçilmez bir müessese olduğunu söyleyebiliriz. Toplumların yaşadığı çevre, kültür ve anlayışlar değişse de, ailenin toplumun temeli olduğu, dolayısıyla korunması gerektiği ve bunun için genel örf ve adetlerin yanında hukuki önlemlerin de alındığı sonucuna ulaşmaktayız. Asıl hedefin ailenin ve aile fertlerinin sosyolojik, psikolojik ve ekonomik değerlerinin muhafazası olmak gerçeğinden hareketle, eksiklikler bulunsa bile Aile mahkemelerinin son derece önemli bir görev üstlendiği, ve geliştirilmesi yönünde çaba sarf edilmesi gerektiği anlaşılmaktadır."
