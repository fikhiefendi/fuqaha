abstract: "İslam hukukunun teşekkül dönemi içerisinde önemli ilim merkezlerinin yanı sıra Mısır, Şam ve Horasan gibi merkezden uzak çevrelerde de ilmi hareketlilik mevcuttur. Mısır, II. asrın başlarına kadar ilmi anlamda oldukça durağan bir görüntü sergilemektedir. Bununla birlikte özellikle siyasi, dini ve coğrafi şartların etkisiyle Mekke ve Medine'deki ilmi çevrelerle yakın bir bağ kurmuştur. Bu çalışmada hicri II. asır içerisinde yaşamış olan Mısırlı Leys b. Sa'd'ın hayatı ve mensup olduğu ilmi çevre incelenecektir. Tez iki bölümden oluşmaktadır. Birinci bölümde Leys b. Sa'd'ın hayatı, yetişme dönemi, hocaları, talebeleri ve muhtelif yönleriyle ilmi şahsiyeti incelenecektir. Mısırlı hocalarından hareketle II. asra kadar buradaki ilim halkaları zikredilecek ve bu halkalarla Leys'in bağlantısı ortaya konacaktır. Talebelerinden hareketle onun ilmi birikiminin hangi talebeleri sayesinde nerelere ulaştığına dair bilgiler verilecektir. Birinci bölümün sonunda ise Leys, Muhaddis, mutasavvıf, dilcilik ve tarihçilik yönleriyle ele alınacaktır. İkinci bölümde onun fıkhî yönü irdelenecek; yaşadığı dönemde cereyan eden amel tartışmaları içerisinde özellikle İmam Malik'le mektuplaşmaları değerlendirilip, Leys'in fıkıh düşüncesine dair yorumlar irdelenecektir. Sonrasında Leys'in furû fıkha dair görüşlerinin hilâf kitaplarına aktarılması ve cumhurdan ayrıldığı fıkhî görüşeri ortaya konacaktır. Tezin sonunda ise Leys'in görüşlerinin takip edilmesi ele alınıp onun fıkhının bir mezhebe dönüşememesine dair yorumlar ele alınacaktır."
