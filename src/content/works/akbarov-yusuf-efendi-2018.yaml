abstract: "Bu yüksek lisans tezi, Yüsuf Efendi Zade tarafından Zekat Kitabının (NECAHÜ'L – KARI ŞERHU SAHİHİ'L-BUHARİ ) isimli kitabın zekat bölümü tahkik ve inceleme ئ hakkında yorum ve ŞERHU SAHIHI'L-BUHARİ kitabı açıklamak için alimlerin yorumcuların sözlerinden bahseder. Bu yüksek lisans tezinde, yazarın açıklamasında kullandığı kaynakları belirttim. ve kitapta bahsedilen bilim adamlarını tanımladım. Garip kelimeleri, Belirsiz ifadeler ve terimleri ve tanılmayan hadis anltılanlara tanımladım. Ayrıca İMAM-İ BUHARİ ve onun kitabı“ SAHIHI ”ile ilgili kısa bir çalışmam yaptım. ve Hadisi- Şerif açıklayan YÜSUF EFENDİ ZADE ve kitabı“ NECAHÜ'L – KARI ŞERHU SAHIHI'L-BUHARİ ”üzerine kısa bir çalışma yaptım. Şeyh Efendinin zamanında yaşayan Osmanlı sultanlarının tanımladım. Her iki Şeyh için öğrencileri ve Şeyhlerini açıkladım. Araştırmada, iki el yazmasının iki nüshasını temel bir orijinal nüshasında, yazarın el yazısıyla Şeyh Yüsuf Zade'in kopyasını ve bir başka altyazı olan YAHYA TAWFİK ile tanıştım."
