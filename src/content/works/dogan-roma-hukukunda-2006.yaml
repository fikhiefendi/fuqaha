abstract: "Roma Hukukunda borçlunun icra usullerinden de faydalanarak hakk#n# zorla eldeedebildi%i borç ili&kilerine tam borç denirdi. Ancak yapt#r#ma ba%lanan borçlar#n yan#ndaba&ka tür borçlar da kabul edilmekteydi. Bu tür borçlar da alacakl# ile borçlu aras#nda birhakkaniyet ba%# meydana getirmekte idi. Bu gibi hallerde hukuk düzeni bir kimsenin borçluoldu%unu kabul etmekle birlikte, o kimseye kar&# dava ve icra imkan# tan#nmamaktad#r. Bu türborçlar eksik borçtur. Eksik borç do%uran haller çok çe&itli nedenlerden kaynaklanmaktad#r.Ancak herbirinin ortak yan#, dava imkan#ndan yoksun olmalar#d#r. Borçlunun borcunu kendiiste%i ile ifa etmesi halinde ise, tam borcun ifas# gibi sonuç do%ururlar.Roma Hukukunda ilk kez kölelerin borçlar# ile kar&#m#za ç#kmaktad#r. Hak ehliyetinin&artlar#ndan status libertatis'i sa%lamad#klar# için hak ehliyetleri yoktu. Ancak insan olmalar#itibariyle hukuki i&lemler yapt#klar#n# görüyoruz. Bu i&lemlerden kazand#klar# haklardo%rudan efendilerine ait say#l#rd#. Borç alt#na giremedikleri gibi, borçlardan efendileri desorumlu olmazd#. Dava ehliyeti de olmayan kölelere kar&# dava aç#lam#yordu. Yani borç alt#nagirmeyen köleler, yapm#& olduklar# hukuki muameleler nedeniyle obligatio naturalis ileyükümlü say#l#yordu.Aile üyelerinin aras#ndaki hukuki i&lemlerden do%an borçlar da malvarl#%#n#n sadeceaile babas#na ait olmas# nedeniyle, obligatio naturalis idi.Senatus Consultum Macedoinianum'a ayk#r# olarak aile evlatlar#na verilen paraödünçleri de eksik borç do%urmakta idi. Senatus Consultum Macedoinianum'un hedefi, aileevlatlar#na para vermek suretiyle, onlar#n kötü e%ilimlerini te&vik ederek toplum ahkal#n#bozanlar# cezaland#rmakt#r. Aile evlad#na ödünç para verenlere ve mirasç#lar#na aile babas#ölse de , dava hakk# verilmemi&tir.Di%er bir eksik borç çe&idi ise, ahlaki ve sosyal vazifelerden do%an borçlard#r: Dos,sebebiyle verilen &eylerin iadesinden do%an borç da eksik borç olarak kar&#m#za ç#kmaktad#r.Pactum ile kararla&t#r#lan faizden do%an borç da eksik borçtur. Romada hukuk düzenitaraf#ndan tan#nan belli akit tiplerinden, bir dava ile takip edilebilen borçlar meydana gelirdi.Bu akit tiplerinin d#&#ndaki anla&malardan borç do%mazd# ve dava ile takip edilemezlerdi. Bu2anla&malara pactum denirdi. &te ödünç aktinde de, faiz kararla&t#r#lacak ise bunun ayr# birstipulatio ile yap#lmas# gerekirdi. Aksi takdirde obligatio naturalis do%ard#.Impubes'in vasinin auctoritas'# olmadan yüklendi%i borçlar da eksik borç idi.Ergenlikça%#na eri&memi& küçüklerden infans ça%#n# a&anlar, sui iuris ise vesayet altina al#n#rlard# vevasinin bizzat kat#lmas# ile hukuki muameleler yapabilirlerdi. Aksi takdirde yapt#klar#i&lemlerden do%an borçlar obligatio naturalis say#l#rd#.Capitis deminutio ile sona ermi& borçlar da eksik borç çe&idi idi. Roma Hukukundaferdin hukuk düzeni kar&#s#ndaki yerini belirten status'lar sabit de%ildi. Capitis deminutio'yau%rayan ki&inin status'u de%i&meden önceki hukuki muamelelerinden do%an borçlar# obligationaturalis'tir.Litis contestatio ile sona ermi& borçlarda eksik borç olarak devam ederlerdi. Litiscontestatio, yani davan#n tespiti özel mahkeme yarg#lamas#nda borcu sona erdiren bir haldir.Sona ermi& bir borç ili&kisinin ba&ka bir davan#n konusu yap#labilmesi mümkün de%ildi.Böylece sona eren borçlar borçlusu bak#m#ndan eksik borç olarak devam ederdi.Zaman a&#m#na u%ram#& borçlar da eksik borç çe&idi olarak kar&#m#za ç#kmaktad#r:Roma Hukukunda otuz y#ldan sonra alacakl# dava açarsa borçlu uzun zaman geçti%i def'ini(praescriptio longi temporis) ileri sürebilirdi. Böylece borç defi yoluyla sona ermi&say#l#yordu.Roma Hukukunda eksik borcun hükümlerine bakt#%#m#z zaman, borçluya kar&#zorlama unsurunun olmad#%#n# ancak borçlusu taraf#ndan ifa edilirse, bu ifan#n geçerlioldu%unu görürüz. Yani eksik borçlar#n ifas# tam borçlar#n ifas# gibidir. fa edildikleritakdirde, sebebsiz zenginle&me davas# ile geri istenemezler. Çünkü, eksik de olsa ortadamevcut bir borç vard#r. Eksik borçlar yenilemeye konu olabilirler ve takas edilebilirdi. Eksikborçlar#n ayni ve &ahsi teminat alt#na da al#nabildiklerini görüyoruz.Günümüzde de, TMK'da, BK'da hatta icra-iflas kanununda, çe&itli sebeplerle kanunkoyucunun baz# borçlar# yapt#r#ms#z b#rakt#%#n# görüyoruz. Bu durum emeksiz kazançsa%lamay# yasaklama, adalet, genel ahlak, toplum bar#& ve düzenini koruma gibi nedenleredayanmaktad#r.3Günümüzde eksik borcun ilk çe&idi kumar ve bahisten do%an borçlard#r: BK. 504-505'de düzenlenmektedir. Kanun, bu borçlar#n varl#%#n# tasvip etmedi%i için, bunlar#n takasedilmesi, yenilemeye konu edilmesi, bunlar#n teminat alt#na al#nmas# cezai &artkararla&t#r#lmas# mümkün de%ildir. Kanun dava hakk#ndan mahrum b#rakt#%# alacakl#n#n bunuba&ka &ekilde elde etmesini engellemek istemektedir.Zamana&#m#na u%ram#& borçlar, evlenme tellal#n#n ücreti, konkordatoda ibra edilenbölümden do%an borçlar, ahlaki bir yükümlülü%ün yerine getirilmesi için verilen edim, ahlakave kanuna ayk#r# amaç sa%lanmas# için verilen &eyler, re&it çocu%un birlikte ya&ad#%# üstsoyundan olan alaca%#, evlenme vaadinden do%an borç, malikin iyiniyetli zilyet kar&#s#ndakiborcu da di%er eksik borç çe&itleri olarak kabul edilmektedir. Günümüzde taraflar aralar#ndakianla&ma ile bir borcun dava ya da icra yoluyla takip edilemeyece%ini kararla&t#rabilirler.Böylece asl#nda tam olan bir borcu, eksik borç haline getirebilirler."
