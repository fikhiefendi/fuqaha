abstract: "Bu çalışma, Hanefî fıkıh usûlü metodolojisinde Sünnetin şer'î delil değerini, rivayetlerin epistemolojik konumunu ve amelî bağlayıcılığını Abdülazîz el-Buhârî'nin (ö. 730/1330) Keşfü'l-esrâr isimli muhalled eseri ekseninde derinlemesine incelemeyi amaçlamaktadır. Tezin teorik omurgasını, Hanefî usûl külliyatının temel metinlerinden Fahrü'l-İslâm el-Pezdevî'nin (ö. 482/1089) Kenzü'l-vüsûl (Usûlü'l-Pezdevî) adlı eseri oluşturmaktadır. Pezdevî'ye ait metnin girift yapısı sebebiyle, araştırmanın ana kaynağı olarak bu eserin en kapsamlı ve mütekâmil şerhi kabul edilen Keşfü'l-esrâr belirlenmiştir. Çalışmada öncelikle Hanefîliğin tarihsel seyri ve Mâverâünnehir usûl geleneğinin kelâmî temelleri ele alınmış; akabinde haber türleri (mütevâtir, meşhur, haber-i vâhid) sened ve delâlet kuvvetleri bakımından tahlil edilmiştir. Bilhassa zannî bir delil olan haber-i vâhid'in Hanefî fıkhındaki hüccetiyeti, râvî tenkit (kabul/ret) ölçütleri ve kitap, icmâ, kıyas gibi kat'î delillerle teâruzu (çatışması) durumunda işletilen usûlî tercih ilkeleri somut örnekler üzerinden değerlendirilmiştir. Araştırma neticesinde; Hanefî fıkıh usûlünün kendine özgü haber teorisinin, itikadî meselelerde“kesinliği (yakîn)”şart koşarken, amelî ahkâmda“zann-ı gâlibi”(haber-i vâhid, kıyas vb.) yeterli gören dikkate değer bir metodolojik denge üzerine kurulduğu tespit edilmiştir. Abdülazîz el-Buhârî'nin mezkûr şerhiyle bu usûlî dengeyi salt savunmacı bir refleksten çıkarıp sistematik bir felsefeye dönüştürdüğü; rivayet (nakil) ile dirayet (akıl/kıyas) arasında kurduğu titiz denge sayesinde haber-i vâhidi usûl hiyerarşisinde en doğru makama yerleştirdiği sonucuna varılmıştır."
