abstract: "Katılım bankacılığı mal ve hizmetlerin para ile sıkı sıkıya bağlı olduğu, para ile ilgili işlemlerin kesinlikle bir mal veya hizmete dayandırıldığı, elde edilen gelirin ise kâra ve zarara ortaklık şeklinde paylaşıldığı bir mali sistemdir. Katılım bankacılığının temel amacı ekonomik sistem içinde bulunmayan atıl fonların ekonomiye kazandırılmasıdır. Bu çalışmada Dünya'da ve Türkiye'de katılım bankalarının gelişimi, çalışma esas ve şekilleri ile Türkiye'de müşterilerin katılım bankalarını tercih etme nedenleri incelenmiştir. Müşterilerin katılım bankalarını tercih nedenlerini belirlemek amacıyla 23 ilde 5 farklı katılım bankasının 516 müşterisine anket uygulanmıştır. Anket, müşterilerin bazı demografik özellikleri ile müşterilerin katılım bankalarını tercih etme nedenlerine dayalı 23 maddeden oluşan 5'li likertli sorulardan oluşmuştur. Anket verilerin analizi için SPSS istatistiksel paket programı kullanılmıştır. 23 maddeden oluşan müşterilerin katılım bankalarını tercih etme nedenleri ölçeğine ait Cronbach's Alpha güvenilirlik katsayısı değeri 0,907olarak bulunmuştur. Verilerin analizi için çeşitli betimsel istatistikler, t testi, F testi (Tek yönlü varyans analizi) ve çoklu karşılaştırma istatistikleri kullanılmıştır. Çalışma neticesinde müşterilerin katılım bankalarını tercih etmede en etkili 5 faktörün sırasıyla;“Samimi ve yardımsever personel”,“İnsana saygı ve hürmet”,“Müşteri hizmet kalitesi”,“Şube personeli ile yakın ilişkilerim”,“Dini hassasiyetlerin yönlendirmesi”olmuştur. Müşterilerin katılım bankalarını tercih etmede en az etkili 5 faktörün ise sırasıyla;“Kitlesel iletişim araçlarındaki reklamlar”,“Nispeten daha yüksek kâr payı dağıtılması”,“ Ev ve işyerine yakınlık”,“Toplumsal katkıları (bağış burs, toplumsal projelere destek vs.)”,“Uygunluk, rahat erişilebilirlik(araç park imkanları, konfor vs.)”olarak belirlenmiştir."
