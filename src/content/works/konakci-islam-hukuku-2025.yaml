abstract: "Bu çalışmada, İslam hukuku ile mer'i Türk hukukundaki alternatif uyuşmazlık çözüm yöntemleri karşılaştırmalı olarak ele alınmaktadır. Bu iki hukuk sisteminin alternatif uyuşmazlık çözüm yöntemlerinin benzer ve farklı yönlerinin tespit edilmesi amaçlanmıştır. Her iki hukuk sisteminin de arabuluculuk, sulh ve tahkîm yöntemlerini benzer şekilde özel hukukta kullandıkları görülmektedir. Özellikle İslam hukuku, aile meselelerinde bu yöntemlere mer'i Türk hukukuna göre daha fazla yer vermektedir. Mer'i Türk hukukunda evlenme ve boşanma işlemleri kamu düzeni ile ilişkilendirildiğinden bu yöntemlerin kullanılması sınırlıdır. İslam ceza hukukunda kısâs, diyet gibi konular alternatif uyuşmazlık çözüm yöntemine açıktır. Mer'i Türk ceza hukukunda ise bu tür yöntemler oldukça sınırlıdır. Mer'i Türk idare hukukundaki alternatif uyuşmazlık çözüm yöntemleri İslam idare hukukuna göre daha fazladır."
