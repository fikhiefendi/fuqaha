abstract: "İslâm fıkhı çok farklı ve uzun meseleleri ihtiva etmektedir. Bir Müslümanın ise bütün bu meseleleri bilmesi, hafızasında tutması çok zor gözükmektedir. İşte tam burada, imdadımıza, meselelerin hangi temel prensiplere dayandığı fikri yetişmektedir. Bu temel prensiplerin kaynağını da kimi zaman Kur'ân-ı Kerîm, kimi zaman Hadîs-i şerîf, kimi zaman da müçtehitlerin içtihadı oluşturmaktadır. Bu temel prensiplere küllî kâide (genel hukuk kuralları) ve dâbıt (özel hukuk kuralları) ismi verilmektedir. Küllî kâide ve dâbıtlar bilindiği takdirde, çok derin meseleler içerisinde boğulmaktan kurtulacak, aynı zamanda da sağlam bir düşünce yapısına kavuşmak mümkün olacaktır. Küllî kâide ve dâbıtları öğrenmenin yolu, bunlarla alakalı müstakil eserlere veya bunların uygulamalı olarak verildiği fıkıh kitaplarına müracaat etmekten geçer. Küllî kâide ve dâbıtların uygulamalı olarak verildiği fıkıh kitaplarının en önemlilerinden birisi de, Osmanlı devletinin yükseliş döneminde yazılan ve asırlar boyunca medreselerde fıkıh kitabı olarak okutulmuş, mahkemelerde de hukuk kaynağı olarak kullanılmış, Düreru'l-Hukkâm fî Şerhi Gureri'l-Ahkâm isimli eserdir. Eseri, Fatih Sultan Mehmet tarafından“Zamanımızın Ebû Hanîfesidir”iltifatına mazhar olan Molla Hüsrev'in kaleme almış olması daha da önemli kılmaktadır. Bu çalışmada Molla Hüsrev'in Düreru'l-Hukkâm isimli eserinde yer verdiği hükümler incelenerek, bu hükümlerin dayanağı konumunda bulunan küllî kâide ve dâbıtların tesbiti yapılacaktır. Müellifin küllî kâide ve dâbıtları kullanım amacı ve yöntemi ortaya çıkarılmaya çalışılacaktır."
