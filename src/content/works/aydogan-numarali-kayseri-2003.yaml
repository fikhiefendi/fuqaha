abstract: "91/1 numaralı Kayseri Şer'iyye Sicili Transkripsiyon ve Değerlendirme Özet Çalışmamızda, 91/1 numaralı (H. 1094/M. 1683) Kayseri Şer'iyye Siciline göre Kayseri 'nin İdari ve iktisadi durumu, sosyal hayat, Müslim ve gayri Müslim ilişkileri, asayiş ve benzeri konular değerlendirildi. 15. yüzyılın yansından 20. yüzyılın başlarına kadar olan yaklaşık 470 yıllık tarih içinde Osmanlı dönemi tarih araştırmalarında Şer'iyye Sicillerinin en önemli kaynak olduğu gerçeği bütün Osmanlı tarih araştırmacıları tarafından önemle vurgulanmaktadır. Bu nedenle 91/1 numaralı Kayseri. Şer'iyye Sicili değerlendirilirken özellikle Osmanlı şehir tarihçiliği, iktisat tarihçiliği, hukuk tarihçiliği ve merkez-taşra ilişkilerinin yapısı hakkında bilgilere ulaşılması amaçlandı. Üç bölümden oluşan tezin giriş kısmında, kadılık kurumunun genel bir değerlendirmesi, Şer'iyye Sicillerinin ve özellikle 91/1 numaralı Kayseri Şer'iyye Sicili genel durumu ve transkripsiyonda takip edilen metotlarla ilgili bilgi verildi. Birinci bölümde belge özetleri, ikinci bölümde metin transkripsiyonu, üçüncü bölümde ise okunan belgelere göre Kayseri şehrinin idari, sosyal, iktisadi ve hukuki yapısı değerlendirildi. Sonuç olarak, çalışmamızda Kayseri 'deki mahalli hayat, halkın sosyo ekonomik, dini ve askeri durumu, hak ve adalet kavramlarına bakışı, Kayseri mahallerinin yapısı, çarşılardaki ticari hayat, merkezi ve taşra teşkilatlarının otoritesi hakkında aydınlatıcı bilgilere ulaşıldı. 1. Şer'iyye Sicili 2. Osmanlı 3. Belge 4. Kadı 5. Kayseri"
