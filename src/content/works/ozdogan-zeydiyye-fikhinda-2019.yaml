abstract: "İslam hukukunun doğru anlaşılmasında mukayeseli çalışmalar önemli bir yere sahiptir. Çünkü çağın getirdiği koşullar içerisinde zuhur eden güncel problemler, İslâm dünyasının değişim ve gelişmelere donuk kalmamasını ve ortaya çıkan mevzuları çözüme kavuşturmak için mezheplerin bir bahis etrafında ortaya koyduğu muhtelif hükümleri iyi analiz etmesini gerektirmektedir. Bu nedenle araştırmamızda, Zeydiyye mezhebine ait Tecrîd ve Hanefi mezhebine ait Muhtasaru'l-Kudûrî adlı fıkıh kitapları esas alınarak, mukayeseli bir inceleme yapılmıştır. Kitapların tüm bölümleri incelenmemiş olup araştırma“had suçları”bölümü ile sınırlı tutulmuştur. Bu çalışmayla, had suçları çerçevesinde; Şiî fırkalarından sayılan ancak Sünnî mezheplere yakın olduğu ileri sürülen Zeydiyye fıkhı ile Hanefi fıkhın arasındaki benzerlik durumuna ilişkin bir kanaat elde edilmeye çalışılmıştır. Araştırmanın birinci bölümünde Zeydiyye fıkhıyla Hanefi fıkhının teşekkülü ile literatürü genel olarak tanıtılmıştır. İkinci bölümünde Tecrîd ve Muhtasaru'l-Kudûrî eserleri hakkında ayrıntılı bilgiler verilmiş ve eserlerin şekil ve metot açısından mukayesesi yapılmıştır. Üçüncü bölümünde ise iki eserde bulunan; zina, zina iftirası (kazf), içki içme (şürb), hırsızlık (sirkat), yol kesme (kat-ı tarik) ve dinden dönme (irtidât) suçları ile ilgili hükümlerin mukayesesi yapılıp iki mezhebin had cezaları bağlamında var olan ortak ve farklı hükümleri belirtilmiştir. Bunun dışında bir eserde yer alıp diğer eserde yer almayan hükümlere yer verilmiştir. Araştırma sonucunda esasen her iki eserde ortak hükümlerin varlığı yanında, farklıkların da var olduğu görülmüştür."
