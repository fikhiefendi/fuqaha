abstract: "Bu tez çalışması farklılaşan tüketici davranışları üzerinde islam değer ve etksini inceler.Nitekim iktisat sistemi ile islam iktisadı arasında bazı farklar vardır.İktisad sisteminde temeller akıl , deney ve değişen kaynaklardır.Bu davranışların arkasındaki en büyük etken kişisel refahın peşinde koşmaktır.Fakat İslam iktisadı sistemi gücünü Kur'an-ı Kerim'den ve Sünneti seniyeden alır.Amacına ulaştıran motivasyonu ise Rabbinin rızası ve Cennete kavuşma emelidir. Aynı zamanda bu tez çalışması karşılıklı faydaya dayalı ekonomi sisteminin düzenini insanların tekil davranışlarına dayanmasını başta serd etmiştir.Batı toplumunun insanı isteklerini önceleyen ve tükenme bilmeyen istekleri öncelemiştir.Fakat müslamanın tüketim davranışları ulu İslam değerlerinden etkilenmesi gerekir.Müslümanın tüketim davranışları İslamın değerleriyle bağdaşmalıdır.Bu bağdaşlaşmayla islam iktisadı tüketici üzerinde denetleme yetkisi ile yapılabilecek son bir tedavi üslubu gibi gözükmesiyle beraber tüketim davranışları farklılılklar arz edebilir.Rüşd seviyesine erişemeyen bir davranıştan rüşdünü ispatlamış bir davranışa, İslam değerleriyle tedavi edilebilir ve önleyici bir kalkan görevi görür. İslam dini sadece tüketici davranışlarına odaklanarak kalmamış aynı zamanda toplumun tüketimde servet ve gelir dağılımını etkileyen şartları ve tüketici dsiplinini önemsemiştir. Böylece yeryüzünü imar etmek ve Allah'a kulluk bilincinde gelecek nesillere önderlik etme görevini tamamlamış olur. Bu tez çalışmamız da ayrıca makasıdü'ş şeriada tüketicinin önceliklerini ve sonuçlarının tüketici üzerindeki etkilerini konu edinir.Araştırmacı bulgularında bu düzenleme ile başta tüketimde rüşdüne ermiş (aklı baliğ) Müslüman bireyin ihtiyaçlarını karşılanmasını ve doyum noktasına erdirmesini ele almıştır.Ayrıca araştırmacı tüketicinin islam iktisadı açısından dengede durması için islam iktisadı temellerine temerküz etmiş önerileri tutarlılığını tüketici dengesini yarar ve zararını (dengede olamayışını) tartıştıktan sonra sunmuştur."
