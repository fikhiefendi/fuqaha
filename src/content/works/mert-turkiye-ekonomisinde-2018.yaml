abstract: "Tarih boyunca kadınlar ücretli ya da ücretsiz olarak çalışmaya katılmışlardır. Sanayi Devrimi öncesi dönemde üretim alanında aktif rol oynayan ve toplumsal olarak önemli bir statü sahibi kadın, hayvancılık ve ekim işlerinin birleşmesi ile bu statüsünü kaybetmiştir. Ancak kadınların, işçi adı ile çalışma hayatına katılmaları Sanayi Devrimi ile gerçekleşmiştir. Türkiye'de kadınların işçi adı ile çalışma hayatına katılması sanayinin doğduğu ve geliştiği dönemde olmuştur. Sanayi Devrimi'nin gerçekleştiği dönemde Osmanlı Devleti'nin bu dönemde içinde bulunduğu sosyal ve ekonomik durum seri üretimin önüne geçmiştir. Bu nedenle kadınlar çalışma hayatına daha çok Cumhuriyet döneminde katılmaya başlamışlardır. Cumhuriyet öncesi dönemde çıkarılan Mecelle, işçinin tanımını yapan ve iş ilişkilerini düzenleyen temel kanun olmuştur. Kadının aktif hale gelmesi ile birlikte sosyal, ekonomik ve eğitim alanlarında birçok yenilik yapılarak kadınlar korunmaya çalışılmıştır. Cumhuriyet'in ilanından sonraki süreçte kadın-erkek eşitliğinin savunulması, kadınların ve işçilerin korunmasın yönelik yapılan hukuki düzenlemeler ve iyileştirilmeler ile kadın çalışma hayatında daha aktif olmaya başlamıştır. Toplumda yer alan kadın ev işleri ile ilgilenir ve kendine uygun işleri yapmalıdır düşüncesi, devletin uyguladığı kadını girişimciliğe, kendi işini kurmaya yönlendiren politikalar ile az da olsa değişim göstermiş ve Türk Kadını kendi ekonomik bağımsızlığını elde etmeye başlamıştır. Bu araştırmada Türkiye'de çalışma hayatına katılan kadınların sosyal, ekonomik ve toplumsal konumları incelenmiş, bu bağlamda Kars ilinde kadın çalışanların neden girişimciliğe yönelmedikleri konusu araştırılmış ve analiz edilmiştir."
