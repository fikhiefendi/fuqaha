abstract: "'BEDÂİU'T-TEFSÎR' ADLI ESER ÇERÇEVESİNDE İBN KAYYİM EL-CEVZİYYE'NİN TEFSİRE DAİR GÖRÜŞLERİ Mustafa KILIÇASLAN Erciyes Üniversitesi, Sosyal Bilimler Enstitüsü Yüksek Lisans Tezi, Şubat 2017 Danışman: Doç. Dr. Şahin GÜVEN ÖZET Çalışmamızda, İbn Kayyim el-Cevziyye'nin Kur'an-ı Kerim'i anlamadaki metodunu ve bu doğrultuda dikkat çektiği hususları konu edindik. Bizi bu çalışmaya sevk eden iki önemli unsur bulunmaktadır. Birincisi, İbn Kayyim'in anlama faaliyetine ilişkin çizdiği geleneksel metotlara dönüş çabasının ve tefsir etme tarzının, tefsir araştırmalarına suna-cağı katkılardır. İkinci sebep ise, Selefî ekolün öncü isimlerinden biri olan İbn Kayyim'in tefsir birikimi ve tefsirdeki yorum biçimi hakkında ülkemizde herhangi bir çalışmanın olmayışıdır.“'Bedâiu't-Tefsîr' Adlı Eser Çerçevesinde İbn Kayyim el-Cevziyye'nin Tefsire Dair Görüşleri”isimli tezimiz bir giriş ve 3 ana bölümden oluşmaktadır. Çalışmamızın birinci bölümünde İbn Kayyim'in hayatını genel olarak irdelemeye çalıştık. Bunu yaparken 13. ve 14. yüzyılın genel yapısını, sorunlarını, eğitim ve kültürel dokunun nasıl teşekkül ettiğini ortaya koyduk. Bunun yanında tarihi süreç içerisindeki hem Dımaşk bölgesini hem de geniş bir coğrafyayı etkileyen hadiseleri çalışmamız içerisinde kısaca analiz ettik. Bu hadiselerin İbn Kayyim üzerindeki etkilerini tahlil ettik. İkinci bölümde ise İbn Kayyim 'in Kur'an-ı Kerim'i tefsirdeki yaklaşımlarını ele almaya çalıştık. Buna göre Kur'an-ı Kerim'in Kur'an'la tefsirini, Hz. Peygamber'in Kuran'ı tefsir etmesini, Sahabe görüşünün ve Dilbilimsel unsurların tefsirdeki yerini, lafız-mana arasındaki ilişkiyi İbn Kayyim'in penceresinden analiz edip, bu konuda bilgi verdik. Son bölümde ise İbn Kayyim'in tefsirlerinde dikkat çeken hususlar ele alındı. Kur'an-ı Kerim'i anlama faaliyetinde lazım olan ilkesel tavrın ve metodun ne olduğunu bu bö-lümde işledik. Çalışmamız kaynakça ve sonuç bölümüyle son bulmuştur."
