abstract: "Hicri ikinci asrın başından dördüncü asrın ortalarına kadar süren dönem fıkhî mezheplerin doğması ve yerleşmesi bakımından İslam hukuk tarihinde önemli bir zaman dilimidir. İslam hukukunda ameli fıkhi mezhepler olarak tarif edilen meşhur dört mezhep de dâhil diğer fıkhî mezhepler bu dönemde ortaya çıkmıştır. Bu mezheplerin bir kısmı günümüze kadar nesilden nesile aktarılarak ve yaşayarak gelmiş, bir kısmı da zamanla yok olmuştur. Şam bölgesinde uzunca bir süre yaşadıktan sonra tabisi kalmayıp zamanla yok olan mezheplerden birisi de Evzâî mezhebidir. İmam Evzâînin Aile Hukukuna Dair İctihâdları adlı bu çalışmamız üç bölümden oluşmaktadır.Giriş bölümünde İmam Evzâînin yaşadığı dönemin siyasi-ilmi durumu, biyografisi, eserleri ve mezhebi genel hatlarıyla ele alınmış, birinci ve ikinci bölümde ise aile hukukuna dair ictihâdları ve delillerine yer verilmiş, yer yer İmam Evzâînin usul anlayışı aktarılmaya çalışılmıştır. İmam Evzâînin görüşleri ortaya konulurken mukareneli fıkıh kitapları ve hilaf kitapları ile hadis şerhleri ve tefsir kaynaklarından istifade edilmiştir. Bugün tabileri kalmasa da geçmişte islam ümmeti nezdinde itibar gören ve kendisiyle amel edilen mezheplerin görüşlerinin bilinmesi değişen ve gelişen günümüz dünyasının problemlerinin çözümünde önem arz etmektedir. İmam Evzâî ve müntesibi kalmamış diğer mezheplerin imamlarının ortaya koyduğu görüş ve fetvaları fıkıh mirasımızın zenginliğini gösteren ve gerektiği takdirde başvurulabilecek büyük bir birikim olarak karşımızda durmaktadır."
