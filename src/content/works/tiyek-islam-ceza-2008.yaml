abstract: "Bu çalışma, İslâm ceza hukukunda adam öldürme, yaralama, hırsızlık ve zina suçlarında suç kastı hakkındadır.Tez, önsöz, giriş ve dört bölümden oluşmaktadır. Önsözde, çalışmanın konusu ve öneminden; giriş bölümünde, çalışmanın amacı, sınırları ve metodundan bahsedilmiştir.Birinci bölümde, suç ve ceza kavramları genel başlığı altında, suçun unsurları, ceza kavramının mahiyeti, İslâm hukukundaki ceza çeşitleri ve cezalandırmanın gayelerinden bahsedilmiştir.İkinci bölümde, kast nazariyesi genel başlığı altında, kastın anlamı, kast ile saik arasındaki fark, kasıtta aranan şartlar, kast çeşitleri ve kastın tespiti esaslarından bahsedilmiştir.Üçüncü bölümde, ceza özel hükümleri açısından kast genel başlığı altında, İslâm ceza hukuku ve günümüz ceza hukukunda öldürme, müessir fiil (yaralama), hırsızlık ve zina suçundaki kast unsurundan bahsedilmiştir.Dördüncü bölümde, kastın cezaya etkisi genel başlığı altında, öldürme, müessir fiil (yaralama), hırsızlık ve zina suçlarında kastın, cezaya etkisinden bahsedilmiştir.Son olarak ise, işlenen bölümlerin genel bir değerlendirilmesi yapılmıştır."
