abstract: "Bu çalışma, modern endüstriyel üretim alanlarında yaygın biçimde kullanılan hayvansal kaynaklı katkı maddelerinin İslâm hukuku açısından değerlendirilmesini konu edinmiştir. Gıda, ilaç, kozmetik, temizlik, tekstil ve seramik sektörlerinde işlevsel amaçlarla tercih edilen jelatin, kolajen, keratin, enzim, karmin, gliserin, hayvansal yağlar, deri ve kemik türevleri gibi maddelerin kaynağı, elde ediliş yöntemi ve dinî hükmü hususunda önemli belirsizlikler bulunmaktadır. Sanayi devrimiyle birlikte üretim süreçlerinin küreselleşmesi, bu içeriklerin teknik terimler veya kodlarla etiketlenmesine yol açmış; bu durum tüketicinin ürünlerin mahiyetini anlamasını güçleştirmiştir. Araştırmada, hayvanlardan elde edilen söz konusu maddelerin mahiyeti, kullanıldıkları sektörler, mevcut alternatifleri ve ürün etiketlerindeki ifade biçimleri tespit edilerek bunların fıkhî hükümleri analiz edilmiştir. Bu bağlamda klasik fıkıh literatüründe yer alan“helâl-haram”,“habîs-tâhir”,“istihâle”ve“istihlâk”kavramları esas alınmış; çağdaş İslâm hukukçularının yaklaşımları, helâl sertifikasyon sistemleri ve bilimsel verilerle karşılaştırmalı olarak değerlendirilmiştir. Disiplinler arası bir yöntemle yürütülen bu çalışma, hem teorik hem uygulamalı düzeyde katkı sunmayı hedeflemekte; Müslüman tüketicilerin dinî hassasiyetleri doğrultusunda bilinçli tercih yapabilmelerine ve üreticilerin helâl ve temiz içerikli ürün üretimine katkı sağlayacak bütüncül bir çerçeve sunmaktadır."
