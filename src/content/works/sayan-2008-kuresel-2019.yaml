title: "2008 Küresel Finans Krizinin Türkiye'deki Katılım Bankaları ile Mevduat Bankalarına Etkisinin Asimetrik Bilgi Teorisi Çerçevesinde Ampirik Değerlendirmesi: ARDL Modeli"
