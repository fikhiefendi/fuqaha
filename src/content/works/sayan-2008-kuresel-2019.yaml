abstract: "Bu çalışmanın amacı, 2008 küresel finans krizinin Türkiye'deki katılım bankaları ile konvansiyonel bankalar üzerindeki etkisini ampirik olarak incelemektir. Bu çerçevede, 2008 krizinin Türkiye'deki katılım bankaları ile konvansiyonel bankalar üzerindeki etkileri Sınır Testi yaklaşımı (ARDL Modeli) ile test edilerek, Türkiye'deki katılım bankalarının konvansiyonel bankalara kıyasla 2008 küresel finans krizine karşı daha dirençli olduğu yönündeki önermenin geçerliliği sınanmaktadır. Çalışmada, Türk Bankacılık Sektöründe 2005-2015 yılları arasında faaliyet gösteren mevduat bankaları ile katılım bankalarının dahil edildiği analizde, bağımlı değişken olarak Banka Aktif Karlılığı, bağımsız değişken olarak ise net kar/faiz marjı, sanayi üretim endeksi ve reel efektif döviz kuru değerleri üçer aylık dönemler şeklinde kullanılmıştır. 2008 krizini de kapsayan bu veri seti aralığı için seçilen değişkenleri test eden analiz, katılım bankalarının ve konvansiyonel bankaların makroekonomik gösterge ve piyasa koşullarından etkilenme düzeylerinin farklı olduğunu, dolayısıyla her iki banka türünün 2008 küresel krizinden farklı düzeylerde etkilendiklerini göstermektedir. Net faiz marjındaki olumlu gelişme konvansiyonel bankaları daha fazla etkilerken, büyümeyi temsil eden sanayi üretim endeksi ve döviz kurundaki olumsuz gelişmeler katılım bankalarını daha derinden etkilemiştir. Bu durumun katılım bankalarının, katılım bankacılığı ilke ve esasları nedeniyle uymak zorunda olduğu regülatif düzenlemeler, kaynak ve yatırım kısıtlamaları ile açıklanmaktadır. Analiz sonuçları reel sektörü etkileyen finansal dalgalanmaların katılım bankalarını konvansiyonel bankalardan daha fazla etkilediği sonucuna ortaya koymaktadır."
