abstract: "İmam Şâfiî'nin hadis ilmindeki metodolojisi ve bunu ortaya koymak için yazdığı kitaplar, eski zamanlardan günümüze kadar insanların dilinden düşmemiştir. Âlimler, Şâfiî'nin kitaplarına ilgi göstermelerine, onu kabul ve takdirle karşılamalarına rağmen mezhepte ve metotta muhalifleri tarafından eleştiri ve itiraza maruz kalmıştır. Şâfiî'ye kendi döneminde ve sonraki asırlarda hadis bilgisi, muhaddisler arasındaki konumu, cerh ve ta'dîl ehlinin ona karşı tutumu, ravileri tenkit ve haberleri kabul etmedeki metodu hakkında eleştiri okları yöneltilmiştir. Mezhebinin imamları bu eleştirilere cevap vermeye koyulmuşlar, bu hususta çeşitli eserler telif etmişler, hakkındaki itirazlar her çağda yenilenerek devam etmiş ve âlimler da onlara karşı görevlerini yerine getirmeye devam etmişlerdir. Zamanımızda Şâfiî'ye yönelik çağdaş modernist bir eğilime sahip yeni eleştiriler ortaya çıkmıştır. Bunların bir kısmı eski eleştiri sahipleri tarafından da yapılmış olmakla birlikte çağdaş eleştirmenler bunları çağdaş bir görev olarak ve farklı bir bağlamda iş edinmişlerdir. Bu araştırma, hadis ilmi ile ilgili eleştirilere özgüdür. Bunların en barizi Şâfiî'nin sünnet-i Nebeviyye'nin hüccet oluşuna ve teşrî'deki bağımsızlığına karşı tavrı, ona göre sünnet kavramı, sünnetin hüccet oluşuna dair getirdiği deliller, âhâd haberler ve onların hüccet oluşuna karşı tavrı, bunları kabuldeki yöntemi, hadis ravilerini ve onların rivayet ettiği hadisleri eleştirmedeki yöntemi ve metnin tenkidi konusuna dair tutumu gibi konular hakkındadır. Araştırmamızda, bütün bu eleştirileri kendisinden sonra kadim zamanlardan günümüze kadar gelen âlimlerin bu konuda derlediklerini referans alarak Şâfiî'nin usûlüne, sözlerine ve fiillerine arz etmek suretiyle ilmî bir değerlendirmeye tabi tutmaya çalıştık."
