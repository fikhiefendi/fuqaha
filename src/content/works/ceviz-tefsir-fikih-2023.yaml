abstract: "Tesettür, Yüce Allah'ın kullarına emretmiş olduğu dini bir yükümlülük olmasının yanı sıra aynı zamanda hem fıtri ve hem de ahlaki bir vecibedir. Tesettür hükümleri Kur'an ve sünnetle açıklanmıştır. İlgili kaynaklara müracaat eden âlimler ise bunları tefsir ve fıkıh kitaplarında derinlemesine işlemişlerdir. Bu çalışmada güdülen temel amaç; ilgili tesettür hükümleri hakkında açıklama yapan müfessir ve fakihlerin söz konusu hükmün inşasında takip ettikleri metot ve vardıkları esas maksadın tespit ve analizini yapmaktır. Bu bağlamda ilgili hükümler temelde sadece yabancı erkek ve yabancı kadınlar hakkında konulmuş tesettür ilke ve hükümleri üzerinden açıklanmaya çalışılmıştır. Tesettür hükümleri üzerinde duran âlimler farklı metot ve hükümler tespit etmişlerdir. Ancak bu farklılıkların birçok nedeni olmakla birlikte âlimlerin, çoğunlukla söz konusu hükmün temel maksadı hakkında birleştikleri gözlemlenmektedir. Nitekim âlimler arasındaki birtakım ihtilaflar bazen sadece ilgili hükmün lafız ve illetleri bakımından farklılaşmış olabilmektedir. Bu hususun en çok tezahür ettiği hükümlerden biri de tesettürdür. İlgili çalışmalarda, hem tefsir hem de fıkıh kaynaklarındaki birçok örneklerde gözlendiği üzere âlimlerin, kimi âyet ve hükümler hakkında farklı beyan ve ıstılahları tercih etmesine rağmen söz konusu hükmün temel amaç ve pratiğinde birleştikleri hakkında tespitler yapılmaktadır. Bu bağlamda arada birtakım nüans farklılıkları olmakla birlikte yapılan pek çok analizde, benzer sonuç elde edilmekte olup bu tez çalışmasında da, bunların nedenleri üzerinde durulmaktadır."
