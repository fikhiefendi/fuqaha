abstract: "İnsanlık tarihi boyunca toplumların ahlak anlayışını, aile yapısını ve sosyal düzenini derinden etkileyen olguların başında zina gelmiştir. Nitelik itibariyle yalnızca bireylerin özel yaşamına ilişkin bir davranış olarak görülmeyen zina, gerek toplumun ahlaki yapısını gerekse aile kurumunun istikrarı bakımından çok yönlü sonuçlar doğuran bir vakıa niteliği taşımaktadır. İslam hukuku zina fiilini“bireysel tercih”olarak görmemiş, toplumsal düzeni ve nesep güvenliğini tehdit eden bir suç olarak tanımlamış, bu nedenle de ağır cezalar öngörmüştür. Burada amaç aile kurumunu korumak, iffet ve namus kavramlarını toplumsal değerler sistemi içinde yaşatmak ve nesillerin karışmasını önlemektir. Türk hukuk sistemi ise modern ve laik yapısı gereği zina fiilini ceza hukuku kapsamında değil daha çok özel hukuk alanında düzenlemiştir. 5237 sayılı Türk Ceza Kanunu'nda zina, müstakil bir suç olarak yer almamakta bunun yerine evlilik birliğinin temelinden sarsılması gibi medeni hukuk gerekçeleriyle boşanma sebebi olarak kabul edilmektedir. Bu çalışma, İslâm hukuku ile Türk hukuk sisteminde zina fiiline yönelik yaklaşımları tarihsel arka plan, normatif düzenlemeler ve uygulama boyutlarıyla karşılaştırmalı olarak ele almaktadır. Amaç, iki hukuk sisteminin aynı fiile yüklediği anlamı, benzerlik ve farklılıklarını, dayandıkları değerler ve hedefledikleri toplumsal sonuçlar çerçevesinde ortaya koymaktır."
