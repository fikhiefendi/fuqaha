abstract: "İslam siyaset düşüncesi, Hz. Muhammed dönemi ve sonrası yaşanan olaylar neticesinde inşa edilmeye başlamıştır. Bu siyasi düşünce, İslam Devleti'nin çeşitli coğrafyalara yayılmasıyla karşılaştığı farklı kültür ve medeniyetler neticesinde oluşmaya başlayan siyasetname, siyaset felsefesi, fıkıh ve kelâm gibi gelenekler ile zenginlik kazanmıştır. Bunun sonucunda oluşan İslam siyaset felsefesi geleneği, hiç şüphesiz belirli kavramlar üzerine inşa edilmiştir. Bu kavramlar çok sayıda olmasının yanında, çalışmamızda yer verdiğimiz siyaset, devlet, yönetici, ahlaklılık ve adalet kavramları, geleneğin önde gelen isimlerinden olan Farabi, Nizamülmülk, Maverdi ve Gazali'nin yazmış oldukları eserler çerçevesinde incelenmiştir. Bu çalışmadaki amacımız, genel anlamda adı geçen düşünürler ve kavramlar üzerinden İslam siyaset felsefesi geleneğinin portresini çizmek, özel anlamda ise Kınalızâde Ali Efendi'nin aynı kavramlar çerçevesinde siyaset felsefesi ile ilgili düşüncelerini tespit ederek İslam siyaset felsefesi geleneği ile karşılaştırmasını yapmaktır."
