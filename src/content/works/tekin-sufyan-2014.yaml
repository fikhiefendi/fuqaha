abstract: "Bu çalışmada; hicrî ikinci asırda Ebû Hanîfe ile birlikte yaşamış, müstakil bir mezhep sahibi olan ve Bişr el-Hafî, Hamdun el-Kessâr gibi önemli mutasavvıfların müntesibi olduğu; ancak zamanla mezhebinin tabisi kalmayan Süfyan es-Sevrî'nin (ö.161/778), hayatı, eserleri, ilmî şahsiyeti, içtihatlarına esas olan usûlü ve furû-u fıkhın tamamına ait görüşleri incelenerek fıkıh ilmindeki yeri tespit edilmeye çalışılmıştır. Süfyan es-Sevrî'nin daha iyi tanınabilmesi için dönemindeki sosyal, siyasî ve kültürel duruma bakılması kaçınılmaz olduğundan çalışmada bu konulara da yer verilmiştir. Bir kısım alimler Süfyan es-Sevrî'yi Hicaz ekolünün temsilcileri arasında sayarken, alimlerin bir kısmı da onu Irak/Kûfe ekolü içerisinde değerlendirmişlerdir. Süfyan es-Sevrî'yi salt olarak Irak ya da Hicaz ekolü içerisinde değerlendirmek yerine Sevrî'nin bu iki ekol arasında müstakil içtihatlar yapabilen bir müçtehit olduğunu söylemek yerinde olacaktır. Zira Süfyan es-Sevrî zaman zaman re'ycilerin eserden uzaklaştıkları yerde esere yaklaşmış, esercilerin re'ye gitmediği yerlerde ise re'ye yaklaşmıştır. Bununla birlikte Sevrî, Irak ve Hicaz ekolleri arasında içtihatlar yapmış bir fıkıh alimi olmakla beraber Irak/Kûfe ekolüne daha yakın bir çizgide durmuştur."
