abstract: "Hukukçular ve fikir adamları, değişen ve giderek sekülerleşen toplumun ihtiyaçlarına cevap verebilmek için özellikle son iki yüzyılda İslâm hukukunu kanun şekline dönüştürmede büyük gayret sarf etmişlerdir. Bu gayret Osmanlı Devleti'nin son dönemlerinde, Ahmet Cevdet Paşa'nın başkanlığında hazırlanan Mecelle ile başlamış, giderek hız kazanmış ve Aile Hukuku Kararnamesi'nin hazırlanıp yürürlüğe girmesine zemin hazırlamıştır. Osmanlının resmen yıkılmasının ardından ise devamı olan Türkiye Cumhuriyeti için hukuki çalışmalar yapılmış ve İsviçre Medeni Kanunu zemininde Türk Medeni kanunun hazırlanarak yürürlüğe girmiştir. Bu çalışmamızda Medeni Kanun'un oluşturulmasında etkisi ve katkısı bulunan Celâl Nuri İleri'nin İslâm hukukunun muhtelif fıkhi meselelere ilişkin görüşlerini ele alıp değerlendirme yapmaya gayret ettik. Tezimiz; giriş ve dört ana bölümden oluşmaktadır. Tezin giriş kısmında; Tezin adı, konusu, amacı, yöntemi ve literatür değerlendirmesine özlü olarak yer verilmiştir. Çalışmamızın birinci bölümünde o dönemin toplumunu tanıma amacını da önceleyerek, Celâl Nuri İleri'nin hayatı, ilmi konumu, eserleri ve yaşadığı dönemindeki siyasi-ilmi akımların bariz özellikleri hakkında özet bilgi sunulmuştur. İkinci bölümde; İslâm hukukuna giriş sadedinde Celâl Nuri İleri'nin şer'i hükmün kaynakları, ictihad teorisi kapsamında içtihat kapısının açık mı yoksa kapalı mı olduğu, nesih teorisi, Kur'ân ile sünnet ilişkisi ve bu iki temel kaynağın dindeki yeri gibi konular hakkındaki düşünceleri tespit ederek vermeye edilmiştir. Üçüncü bölümde; İslâm aile hukuku çerçevesinde İleri'nin ele aldığı problemlere yaklaşımı ve çözüm önerilerinin neler olduğunu tespit edilmeye çalışılmıştır. Tezin dördüncü bölümünde ise İslâm hukuku içerisinde yer alan muhtelif fıkhi meselelere İleri'nin yaklaşımı ve çözüm sadedinde ortaya koyduğu düşünceleri ortaya koyulmuştur."
