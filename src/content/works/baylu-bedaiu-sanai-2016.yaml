abstract: "İslam hukuku üç ana kısımdan oluşmaktadır; İbadet, muamelat ve ukubat. İslam hukukunda özel anlamı ile ele alındığında ibadetler beş çeşittir; Abdest, Namaz, Oruç, Zekât ve Hac. Bu ibadetler için son derece büyük öneme sahip olan ve bunları meydana getiren“Şart”ve“Rükün”kavramları tezimizin asıl çalışma alanını oluşturmaktadır. Yani bu çalışmamızda ibadetlerin şartlarını ve rükünlerini inceledik. Bu çalışmayı İslam hukukunun iki ana temsilcisi olan Hanefi ve Maliki mezhepleri ve bu iki mezhebin iki ana kaynağı olan“Bedaiu's-Sanai”ve“Bidayetü'l-Müctehid”eserleri bağlamında ele aldık. Özellikle görüş ayrılıkların olduğu yerlerde karşılıklı olarak delilleri zikredip daha sonra değerlendirmeye tabi tutarak sonuca ulaşmaya çalıştık."
