abstract: "Rusya Müslümanlarının İslam hukuku faaliyetlerinin temelinde Mahkeme-i Şer'iyye yer almıştır. 1788'de II. Katerina tarafından kurulan Mahkeme-i Şer'iyye, bağımsızlıklarını kaybeden Rusya Müslümanlarının sahip oldukları tek resmî kurum özelliğindedir. Bu kurum zamanla Kırım ve Kafkasya dışında kalan tüm Rusya Müslümanlarının çatı kuruluşu haline gelmiştir. 1917 yılına kadar başkanlığını Rus Hükümeti tarafından atanan bir müftünün yaptığı Mahkeme'de görev süreleri üç yıl olan üç de kâdı yer almıştır. Mahkeme-i Şer'iyye, mahallelerde görevlendirilecek imam ve müezzin adaylarının sınavlarını yaparak atanmaları için gerekli belgeleri düzenlemek, görevlilerin denetim ve azlinin yanı sıra doğum ve vefat kayıtlarının tutulmasına, nikâh, talâk ve miras işlerinin yerelde görülmesine nezâret etmiştir. Mahkeme, imamlara kâdılık görevinin verilmesiyle, mahallinde çözüme kavuşturulamayan meseleleri görüşüp karara bağlayan bir temyiz mahkemesi konumuna yükselmiştir. İslam hukuk tarihinde pek fazla örneği görülmemekle birlikte teoride var olan çok yargıçlı bir sisteme sahip olan Mahkeme-i Şer'iyye, müftü ve kâdıların birlikte görev yapması açısından da özel bir öneme sahip olmuştur. Mahkeme-i Şer'iyye'ye tevdi edilen resmi görevlerin yanı sıra Rusya Müslümanlarının dinî ve milli kimliklerini korumak adına önemli görevler icra etmiştir. 1917 yılında dinî özerkliğini ilan eden Mahkeme-i Şer'iyye İslam hukuk tarihi açısından çok önemli sayılabilecek yeni mecelle düşüncesini gündemine alarak projelendirmiştir. Mecelle-i Ahkâm-ı Şer'iyye adıyla eklektik metotla hazırlanması planlanan kanunlaştırma projesi, Osmanlı Devleti'nde hazırlanan Mecelle-i Ahkâm-ı Adliye'nin İslam hukuk tarihinde açtığı dönemin yeni ve önemli bir halkası olarak düşünülmüştür. Ancak bu proje Bolşevik Devrimi ve sonrasında yaşanan siyasî ve ekonomik sebeplerden dolayı gerçekleştirilememiştir. Büyük bir heyecanla resmen projelendirilen Mecelle-i Ahkâm-ı Şer'iyye hazırlanamamış olsa da, Rusya Müslüman âlimlerinin yeni mecelle düşüncesinin dillendirilmesinden resmiyet kazandırılıncaya kadarki zamanda zor şartlar altında önemli çalışmalar ortaya koymuşlardır. Özellikle Musa Carullah'ın kaleme aldığı 'Kavâid-i Fıkhiyye' adlı eseri yeni mecellenin külli kâideleri mesabesindedir."
