abstract: "‏Bu araştırma İBN MÜLAKKIN VE EL-EŞBÂH VE'N-NEZÂİR KİTABINDAKİ METODU adlı kitabını ve yazarın bu kitaptaki metodolojisini tanıtmaktadır. Bu kitabın yüksek değeri, önemli fıkhi kurallar ve prensipler içermesi ve bu prensipleri fıkhi meselelerle örnekleyerek kendine özgü bir üslupla açıklaması nedeniyle ortaya çıkmaktadır. Bu araştırmada, yazarın ve kitabının değerini vurgulamak için çaba sarf ettim. Yazarın bu kitaptaki özel metodolojisini fıkıh ve hadis açısından farklı yönlerden çıkardım, yazarın kullandığı tercih ve zayıflama terimlerini açıklayarak bunların ne anlama geldiğini belirttim ve yazarın kitabında başvurduğu alimleri ve kaynakları öne çıkardım. Araştırmamızın değerini artıran bir diğer unsur ise, İbnü'l-Mülakkın'ın kitabı ile hocası İbnü'l-Vekil'in kitabı arasındaki farkları ortaya koymak ve yazarın bu kitabı ile diğer“Nevadirü'n-Nazair fi Kavaidü'l-Fıkıh”adlı kitabı arasındaki benzerlik ve farklılıkları açıklamaktır. Bu bilgilerin sunulması, bu tür farkları ortaya koymak isteyen bir çok araştırmacı için faydalıdır ‏"
