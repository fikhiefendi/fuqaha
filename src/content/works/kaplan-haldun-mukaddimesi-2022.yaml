abstract: "İbn Haldun, 14. yüzyılda yaşamış ünlü bir tarih, hukukçu ve filozoftur. O, Mukaddime adlı eserinde, toplumsal yaşama ve hukukun gelişimine dair bazı kurallar tespit etmiştir.“İbn Haldun Mukaddimesi ve Osmanlı Hukuku”adlı bu tezde, bu kuralların Osmanlı Devleti üzerinde örneklendirilmesi amaçlanmıştır. Böylece, Osmanlı Devleti'nin, İbn Haldun'un tespitlerine ne kadar uygun bir seyirde geliştiği gösterilmek istenmiştir. Tezin birinci bölümünde, İbn Haldun'un hayatı, yaşadığı dönem ve bilim tarihindeki yeri incelenmiştir. Böylece, İbn Haldun'un Mukaddime'yi nasıl yazdığı araştırılmıştır. Tezin ikinci bölümünde, Mukaddime adlı eser ile Osmanlı hukuku birlikte incelenmiştir. Mukaddime'den toplumsal yaşama, göçebe toplum yapısına, yerleşik toplum yapısına ve devlet yapısına ilişkin kurallar çıkarılmıştır. Bu kurallar, Osmanlı toplum ve devlet yapısı kullanılarak örneklendirilmiştir."
