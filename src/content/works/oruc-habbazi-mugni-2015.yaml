abstract: "Türkiye'de bulunan yazma eserler esas alınarak incelenen Şerhu'l-Muğnî, Kâânî (ö. 775/1374) tarafından kaleme alınan bir Hanefî usûl eseridir. İlgili çalışma bir giriş, iki ana ve bir de sonuç bölümüne ayrılmıştır. Giriş bölümünde tahkik ve tahlil aşamasında takip edilen metotlardan bahsedilmiştir. Birinci ana bölüm, hem Muğnî'nin hem de şerhinin yazarlarıyla ilgili bilgilere ayrılmıştir. İkinci ana bölüm ise Kâânî'nin yazmış olduğu şerhin tahlili ile ilgili olan kısımdır. Çalışma, genel hatlar çerçevesinde değerlendirmelerin yapıldığı sonuç bölümüyle tamamlanmıştır. Arapça metin ise tezin sonunda ek olarak sunulmuştur."
