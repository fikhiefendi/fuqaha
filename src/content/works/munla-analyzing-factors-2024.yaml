abstract: "Çalışma, İstanbul'da yaşayan müşteriler tarafından kullanılan banka seçim kararlarını anlama odaklıdır. Bu hedefe ulaşmak için, çalışma, Türkiye'nin ekonomik manzarası ve bankacılık sektörü hakkında genel bir bakışı içeren bir literatür taramasına dayalı bir teorik çerçeve geliştirir ve tüketicilerin en uygun bankayı seçerken kararlarını etkileyen temel faktörleri içerir, bunlar tutum, hizmet kalitesi, sosyal etki, itibar, ücretler ve faydalar. Bir anket formu oluşturuldu ve toplam 225 tüketiciye anket yapıldı. Bilgiler SmartPLS-SEM yazılımı ile toplandı ve analiz edildi. Bu çalışma, müşteri kararlarını etkileyen unsurları incelemek için bir kavramsal çerçeve olarak Düşünülen Davranış Kuramı'nı (TRA) kullanır. Bulgular, müşterilerin banka seçimini belirleyen başlıca faktörlerin tutum, ücretler ve faydalar olduğunu ortaya koymaktadır."
