abstract: "Bu araştırmanın konusu, Cezayir'de İslami bankacılık faaliyetlerini düzenleyen hukuki çerçevenin; 1990 tarihli Para ve Kredi Kanunu, 2018/02 sayılı düzenleme ve 2020/02 sayılı düzenleme çerçevesinde incelenmesi ve bu mevzuatın İslami bankacılık faaliyetlerinin gereklerine ne ölçüde uygun olduğunun değerlendirilmesidir. Çalışma, söz konusu düzenlemelerin İslami finansal ürünlerin sunulmasına elverişliliğini, merkez bankası ile İslami bankalar arasındaki ilişkinin nasıl düzenlendiğini ve bu mevzuatın şer'î açıdan değerlendirilmesini amaçlamaktadır. Ayrıca, başarılı bir şekilde İslami finans alanında hukuki çerçeve oluşturmuş ülkelerin deneyimleriyle karşılaştırmalı bir analiz yapılmaktadır. Araştırmanın temel problemi, İslami bankacılığa uygulanan mevzuatın büyük ölçüde geleneksel bankacılık mevzuatından farklı olmaması olup, bu durum Cezayir'deki hukuki ortamın İslam hukukunun ilkeleriyle ne derece uyumlu olduğu, şer'î ihlallerden kaçınma ve İslam hukukuna uygun bankacılık faaliyetlerini kolaylaştırma ya da engelleme kapasitesi hakkında soru işaretleri doğurmaktadır. Çalışmada, ilgili yasa ve düzenlemelerin sunumunda betimsel yöntem, uluslararası deneyimlerle karşılaştırmada karşılaştırmalı yöntem; metinlerin değerlendirilmesinde analitik yöntem ve mevzuatın tarihsel gelişiminin izlenmesinde tümevarım yöntemi kullanılmıştır. Ayrıca mevcut engellere yönelik uygulanabilir çözüm önerileri sunulmuştur. Araştırmanın ulaştığı en önemli sonuç, Cezayir'deki mevcut hukuki çerçevenin İslami bankacılığın gelişimi açısından yapısal bir engel teşkil ettiğidir. Bu nedenle, İslami bankacılığın kendine özgü yapısını güvence altına alacak şekilde şer'î temellere dayalı olarak yeniden yapılandırılması gerekmektedir. Ayrıca, ortak bir şer'î referansın oluşturulmasını, bütüncül ve bağımsız bir denetim ve düzenleme sisteminin tesis edilmesini, İslami bankalar ile merkez bankası arasındaki düzenleyici ilişkinin geliştirilmesini ve bankacılık mevzuatının düzenlenmesi yetkisinin Cezayir Para ve Kredi Konseyi'ne verilmesini gerekli kılmaktadır."
