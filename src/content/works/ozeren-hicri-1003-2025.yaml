abstract: "Osmanlı Devleti adalet sistemi içerisinde önemli bir yer tutan şer'iyye sicillerini kadı veya naîb tarafından tutulmaktadır. İslam hukukuna dayalı şer'î mahkemeler aracılığıyla oluşturulan bu belgeler, yalnızca siyasi tarih açısından değil sosyal, iktisadi, askeri, hukuk ve şehircilik tarihi açısından önemli bilgiler ihtiva etmektedir. Şer'iyye sicilleri salt birer mahkeme kaydı olmanın ötesinde çok disiplinli tarih araştırmalarında birincil el kaynak niteliği taşımaktadır. Tez çalışmasının ana kaynağı olan Hicri 1003-1005/Miladi 1595- 1597 tarihli Çorum Şer'iyye Sicili Çorum şehrinin ve bölgenin en eski tarihli sicil defteri özelliğine sahiptir. Bu bağlamda defter Çorum ve çevresinin idari yapılanması, idari kadrosu, sosyal ve ekonomik yapısı hakkında özgün ve değerli bilgiler sunmaktadır. Araştırma sürecinde öncelikle sicilde yer alan metinlerin transkripsiyonu hazırlanmış ardından elde edilen veriler doğrultusunda Çorum'un sosyal hayatı çerçevesinde ilk olarak idari yapısı ve mahkeme teşkilatı incelenmiştir, ardından aile kurumunun teşekkül süreci detaylı şekilde değerlendirilmiş. Ekonomik faaliyetler bağlamında Mâlikâne-divanî sistem ile tımarlı sistemine dayalı üretim ve istihdam biçimleri şehirdeki meslek gruplarıyla birlikte ele alınmıştır. Celâli İsyanları bağlamında Çorum ve çevresinde etkin olan eşkıya faaliyetleri, tarihsel, ekonomik ve sosyal dinamikler çerçevesinde değerlendirilmiştir."
