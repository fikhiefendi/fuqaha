abstract: "Katılım bankaları faizsizlik prensibine uygun faaliyet göstermek zorunda olan mali kuruluşlardır. Bu özellikleri sebebiyle faize karşı duyarlılığı olan kişiler, katılım bankacılığının müşteri kitlesini oluşturmaktadır. Bu kişiler için çalıştıkları bankaların faizsizlik ilkesine uygun çalıştıkları hususunda güven en önemli esastır. Bu makul güvenceyi sağlayacak olan temel kriter ise İslami açıdan denetim faaliyetinin gerçekleşmesidir. Katılım bankaları genellikle merkezi danışma kurulları ve bünyelerindeki danışma komiteleri ile bu güveni sağlamaya çalışmaktadırlar. İç denetimde ortaya çıkması muhtemel çıkar çatışmaları nedeniyle daha şeffaf mali tablolar oluşturmak ve katılım bankası işlemlerine İslami açıdan makul güvenceyi sağlayabilmek önem kazanmıştır. Bu çalışmada kamu denetimi ve bağımsız denetime tabi tutulan katılım bankaları mali tablolarının bağımsız denetimi aracılığıyla İslami bankacılık prensiplerine uygunluğunun araştırılması, varsa eksikleri ve problemleri ortaya koyarak çözüm yollarını içeren yeni bir denetim modeli önerisi sunulması amaçlanmıştır. Çalışmada nitel araştırma tekniklerinden doküman analiz yöntemi uygulanarak, katılım bankalarına ait bağımsız denetimden geçmiş mali tabloların İslami bankacılık prensiplerine uygunluğu analiz edilmiştir. Analiz sonucunda Türkiye'de faaliyette bulunan katılım bankalarına ait bağımsız denetim raporları düzenlenirken, birçok kalemde, dipnotlarda ve açıklamalarda genellikle İslami finans esaslarına dikkat edilmediği görülmüştür. Ayrıca katılım bankaları için yeni bir İslami finans denetim model önerisi sunulmuştur."
