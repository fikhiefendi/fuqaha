abstract: "Son yıllarda giderek zenginleşen iletişim kanalları, ticari ve ticari olmayan birçok alanda aktif bir şekilde rol oynamaktadır. Özellikle iletişim kanallarından biri olan ve hayatın vazgeçilmezi haline gelen sosyal medya ve uygulamaları, hızlı biçimde gelişen yapısı nedeniyle finansal kuruluşların paydaşlarıyla iletişim kurmaları ve işlem yapmaları için yeni olanaklar sunmaktadır. Sosyal medya sitelerinin popülaritesi ve internet kullanıcılarına sunduğu hizmet çeşitliliği her geçen gün artmaktadır. Bu artışın bir sonucu olarak sosyal medya, finansal kuruluşların özellikle de bankaların bilgi sahibi olmak ve bilgi paylaşmak amacıyla kullandıkları en önemli mecralardan birisi olmaktadır. Bankalar müşteri potansiyelinden faydalanabilmek, satın alma karar sürecini kendi lehlerine sonuçlandırabilmek ve satış sonrası müşteri memnuniyetini maksimize edebilmek vb. amaçlarla sosyal medyada yer almaya başlamışlardır. Bu çalışmada Türkiye'deki mevduat ve katılım bankalarının sosyal medya kullanımı incelenmiş ve Instagram özelinde bir endeks oluşturulmuştur. Araştırma verilerinin toplanmasında birincil kaynaklardan faydalanılmıştır. 1-31 Mart 2020 tarihleri gün sonlarında erişilen resmi sosyal medya hesaplarından, belgesel tarama yöntemi ile veri toplama gerçekleştirilmiştir. Verilerin analizinde içerik analizi yöntemi kullanılmıştır. Analiz sonucu oluşan endekste bankaların Instagram hesaplarının popülerlik, etkileşim ve içerik değerlendirmesine yer verilmiştir. Ortaya konan Instagram değerlendirme endeksi, bankalara kendi Instagram hesaplarının rakiplerine göre güçlü ve zayıf yönlerini keşfetmelerini sağlayarak sektöre ve literatüre katkı sağlamaktadır."
