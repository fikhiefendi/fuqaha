abstract: "Amaç: Genotip 1 hepatit C virüsü (HCV) ile enfekte kronik hepatit C (KHC) hastalarında peginterferon alfa ve ribavirin kombinasyon tedavisi ile yaklaşık %50 oranında kalıcı virolojik yanıt (KVY) elde edilmektedir. Daha önce peginterferon alfa + ribavirin kombinasyon tedavisine cevap vermeyen genotip 1 KHC hastalarında, yeniden aynı kombinasyon tedavisine yanıt %4-14 arasındadır. Bu nedenle, KVY alınamayan hastalarda peginterferon alfa ve ribavirin kombinasyon tedavisi yeniden düzenlenmekte ve/veya yeni tedavi yaklaşımları denenmektedir. Yakın zamanda, daha önce uygulanan peginterferon alfa + ribavirin kombinasyon tedavisine yanıtsız genotip 1 KHC hastalarında, ribavirin tedavisinin önceden başlandığı ``priming'', takiben peginterferon alfa ve ribavirinin kombinasyonu uygulandığı çalışmalarda antiviral tedavinin etkinliğinin arttığı ve KVY'nin %50'e ulaştığı ileri sürülmüştür.İnvitro ortamlarda pek çok molekül hepatit C virüs (HCV) klirensini sağlayabilmektedir. Bir proton pompa inhibitörü (PPI) olan rabeprazolün EC50 1.6 µM değeri ile HCV yaşam siklusuna etkileyerek HCV klirensine yol açtığı invitro çalışmalarda gösterilmiştir.Bu çalışmada, peginterferon ve ribavirin kombinasyon tedavisine yanıtsız KHC hastalarında, ribavirin ``priming'' tedavisini takiben 48 hafta süreli peginterferon alfa-2b ve ribavirin kombinasyon tedavisi ve rabeprazolün etkinliğini değerlendirmek amaçlanmıştır.Hasta-yöntem: Genotip 1 HCV ile enfekte, en az 12 haftalık peginterferon alfa ve ribavirin kombinasyon tedavisine yanıtsız, önemli komorbid hastalığı olmayan ve önceki tedavi ile önemli yan etki gözlenmeyen 15 erişkin peginterferon kombinasyon tedavisine yanıtsız KHC hastası çalışmaya alındı. Tüm hastalar 4 hafta boyunca oral ribavirin (1000-1200 mg/g) ile tedavi edildikten sonra peginterferon alfa-2b 1.5 mcg/kg/hafta + ribavirin 1000-1200 mg/g ve 1:1 rabeprazol 80 mg/g olmak üzere iki gruba randomize edildi. 24 hafta kombinasyon tedavisini tamamlayan hastalar değerlendirilmeye alındı. HCV RNA COBAS Taqman yöntemi ile çalışıldı (Roche Diagnostic, Germany, Saptama düzeyi: 0.05).Ribavirin öncü tedavi ve kombinasyon tedavisi iyi tolere edildi. Hiçbir hastada yan etki nedeni ile tedavi sonlandırılmadı, eritrosit transfüzyonu gerektiren ciddi anemi gözlenmedi. 4 haftalık ribavirin ``priming'' boyunca median HCV RNA ve ALT düzeylerinde anlamlı azalma görüldü (-0.36±0.3 IU/Ml ve -20±32 U/L, p<0.001, 0.03). Kombinasyon tedavisinin 12. haftasında başlangıç anormal olan serum ALT düzeyi olan 13 hastanın 11'inde (%85) ALT düzeyi normal sınırlara indi (<37 U/L), 4 hastada serum HCV RNA düzeyinde 2 log IU/mL'den fazla azalma görüldü, 24. haftasında ise 3 hastada serum HCV RNA negatifleşti. Bu 3 hastanın ikisi rabeprazol sodyum almakta idi.Sonuç: Bu pilot çalışmadan elde edilen sonuçları ile, ribavirin ile öncü tedavinin önceki peginterferon alfa ve ribavirin kombinasyon tedavisine yanıtsız KHC hastalarında KVY oranını anlamlı arttırmadığı ve rabeprazolün serum HCV RNA düzeyine anlamlı inhibe edici etkisi olmadığını ileri sürebiliriz."
