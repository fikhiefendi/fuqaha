abstract: "Bu çalışma İslam ceza hukukunda had suçlarında cinsiyetin yani kadın ve erkek olmanın cezanın uygulanmasındaki etkisini ele almaktadır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Giriş kısmında konunun ceza hukuku içerisindeki yeri, sınırlandırılması, araştırmanın amacı, yöntemi ve kaynaklarıyla ilgili bilgiler yer almaktadır. Birinci bölümde suç ve ceza terimlerinin kavramsal çerçevesi ele alınmıştır. Bu bölümde suç kavramının tanımı, suçun genel unsurları, suçların tasnifi, ceza kavramının tanımı ve cezanın temel özelliklerine değinilmiştir. Had suçları ve bu suçlara uygulanacak cezalar delilleriyle birlikte incelenmiştir. Çalışmamızın son bölümü olan ikinci bölümde ise cinsiyetin had suçlarına etkisi, cinsiyetin etkili olduğu suçlar ve cinsiyetin etkili olmadığı suçlar başlıkları altında ele alınmış ve hukuki sonuçları incelenmiştir. Kadın ve erkeğin farklı değerlendirildiği hususlar dayandıkları delillerle açıklanmaya çalışılmıştır. Çalışmamız ulaştığımız neticeleri içeren sonuç bölümüyle sona ermiştir."
