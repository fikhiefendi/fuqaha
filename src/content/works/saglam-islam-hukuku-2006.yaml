abstract: "ÖZETYÜKSEK LİSANS TEZİİSLAM HUKUKU AÇISINDAN EVLAT EDİNMEOsman SAĞLAMDanışman: Yrd. Doç. Dr. Murtaza KÖSE2006-SAYFA : VIII + 85Jüri: Yrd. Doç. Dr. Murtaza KÖSEâ¦..â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦â¦..Günümüzde uygulanan evlat edinme müessesesinin en önemli amacı kimsesiz çocuklarıkorumak ve aile ortamında yetişmelerini sağlamaktır. Özellikle Kur'an ve hadislerde yer alanifadeler sebebiyle bu müesseseye olumsuz bakan ve yer vermeyen İslam hukukunun konuyayaklaşımı bugün eleştiri konusu olmaktadır.Kimsesiz çocukların bugün yaşadığı büyük sorunlar ve İslam hukukunun bu konudaeleştirilmesi sebebiyle konunun yeniden ele alınması gerektiğini düşündük.Biz bu çalışmamızda İslam hukukunun müesseseye olumsuz bakmasının nedenlerini yenideninceleyerek bir değerlendirme yaptık ve gerekli şartlara uyulduğu müddetçe İslam'ın evlat edinmeyetümüyle karşı çıkmadığı sonucuna ulaştık."
