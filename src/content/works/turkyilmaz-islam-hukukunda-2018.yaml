abstract: "Zihinsel engellileri konu edinen bu çalışma, İslam hukukuna ve Türk hukukuna göre zihinsel engelli kişilerin ehliyet ve mükellefiyet durumlarını incelemektedir. Bu çalışmada konuya ehliyetin unsurları açısından bakılmış ve zihinsel engelliler, ayırt etme gücüne göre değerlendirilmiştir. İnceleme sonucunda orta, ağır ve ileri derece zihinsel engellilerin ayırt etme gücüne sahip olmadığı görülmüş ve bu nedenle cünûn kapsamında değerlendirilmelerinin daha isabetli olacağı düşünülmüştür. Hafif zihinsel engellilerin, ayırt etme gücüne sahip olduğu; ancak bulûğ konusunda şüpheli bir durumda oldukları tespit edilmiştir. Bu nedenle ma'tûh kapsamında değerlendirilmeleri gerekli görülmüştür. Ancak ibadetler hususunda cumhûrun ma'tûh hakkındaki görüşünden farklı olarak bu kişilerin, sınırlı da olsa ibadet mükellefiyetine sahip olduğu belirtilmiştir. Sınırda zeka geriliğine sahip kişilerse; temyiz ve bulûğ şartına sahip olmalarına karşın, rüşdden yoksun olmaları sebebiyle sefeh kapsamında kabul edilmiştir."
