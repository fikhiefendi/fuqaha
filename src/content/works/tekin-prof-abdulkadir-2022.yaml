abstract: "Biyografi türünde kaleme aldığımız çalışma, son dönemin önemli fıkıh hocalarından Prof. Dr. Abdulkadir Şener'in, içinde bulunduğu tarihsel zamanın koşulları doğrultusunda tecrübe ettiği ilmî, sosyo-kültürel ve fikrî ortamı deskriptif bir yöntemle sunmayı ve ülkemizde devam eden fıkıh çalışmalarına ne oranda katkı sağladığının tespitini amaçlamaktadır. Bu sayede Prof. Dr. Abdulkadir Şener'in yetiştiği ortamın ve zamanın şartları göz önüne alındığında büyük bir mücadele neticesinde sahip olduğu derin fikrî/ilmî düzeyi gözlemleyeceğiz. Doğduğu köyden çıkıp, hafızlığını yaptıktan sonra kendine ilim yolunda bir yol çizen ve bunun için fedakârlıklara katlanan çağımızın önemli mütefekkirlerinden birinin hayatını araştırmak oldukça önemlidir. Diğer taraftan dinî bilimlerde araştırma yapacak olan araştırmacılara Sayın Şener'in hayatı ve ilmî serüveni örnek bir deneyim sunacaktır. Prof. Dr. Abdulkadir Şener'in Mısır ve Irak'ta verdiği ilim öğrenme yolundaki emekler, ülkesinde uzun uğraşlar sonucu meyvesini vermiştir. Hocamız Diyanet İşleri Başkanlığı'nda çalışma hayatına başlamış ancak daha sonra akademik çalışmalar yapabilmek için Ankara Üniversitesi İlahiyat fakültesine geçiş yapmıştır. İlmî hayatı boyunca birçok telif ve tercüme esere imza atan Şener, eserleri, fikirleri ve görüşleriyle bilime olan katkısını sürdürmektedir. Fıkıh alanında uzmanlaşması dolayısıyla eserlerinin çoğunluğunu fıkha ait konularda kaleme almıştır. Ancak en son Prof. Dr. M. Cemal Sofuoğlu ve Prof. Dr. Mustafa Yıldırım ile birlikte hazırladıkları“Yüce Kur'an”isimli eser bir meal çalışmasıdır. Son yıllarda sosyal medya üzerinden gündeme dair görüşlerini takip etme imkânına sahip olduğumuz Prof. Dr. Abdulkadir Şener Hoca'nın fıkhî konulara dair görüşleri son bölümde açıklanmaya çalışılmıştır."
