abstract: "Tezimizde İslam hukukunun muâmelâtla alakalı konuları arasında önemli yeri olan akitlerin feshedilme ilke ve esasları ele alınmıştır. Tez konumuz yalnızca borçlar hukuku alanına dâhil olan akitlerin feshiyle sınırlı bulunmamakta, nikâh akdi dâhil olmak üzere fürû-i fıkıh kaynaklarında konu edilen bütün akitleri ilgilendirmektedir. Konu ele alınırken belli bir fıkıh mezhebi esas alınmamış, çoğunlukla dört mezhebin yaklaşımları aktarılarak ve gerek duyuldukça başka mezhep ve müçtehitlerin görüşlerine de temas edilerek, fesih işleminin İslam hukukundaki yeri bütüncül bir şekilde ortaya konulmaya çalışılmıştır. Tezimiz giriş ve sonuç dışında üç bölümden oluşmaktadır. Birinci bölümde öncelikle tez konusuna hazırlık amacıyla tasarruf, hukuki işlem ve akit kavramları tanımlanıp akitle ilgili temel hususlara temas edildikten sonra feshin kavramsal çerçevesi çizilmiştir. Bu doğrultuda feshin tanımı yapılmış, benzer kavramlarla ilişkisi tahlil edilmiş ve fesih türleri incelenmiştir. Bu bölümde ayrıca İslam hukukunda feshin meşruiyetinin dayandığı delil ve ilkeler incelenmiş, bu münasebetle feshin şer'î hükmü, meşruiyetinin şartları ve meşru oluşuna engel görülen haller üzerinde durulmuştur. İkinci bölümde İslam hukukuna göre fesih hakkı doğuran sebepler tafsilatlı bir şekilde ele alınmıştır. Üçüncü bölümde ise fürû-i fıkıh eserlerinde ele alınan akitler kendi içerisinde tasnif edilerek feshe elverişlilik açısından incelenmiştir. Tezimizde netice itibariyle İslam hukukunda tek taraflı feshin meşruiyetinin akdin bağlayıcı yapıda olmamasının veya bağlayıcılık vasfını yitirmesinin bir sonucu olduğu, bağlayıcı yapıdaki akitlerin üç fıkhî ilkeden -karşılıklı rızanın gerekliliği, zararın önlenmesi ve giderilmesi, şer'î kurallara aykırı olmama ilkelerinden- birine aykırılık içerdiği durumlarda veya bu ilkelerin gerektirdiği hallerde bağlayıcılık vasfını taşımamış sayıldıkları ve ilgili tarafça feshedilebilir kabul edildikleri tespit edilmiştir."
