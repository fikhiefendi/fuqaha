abstract: "Günümüzde, Malın hizmet olduğu bankacılık sektöründe hizmetin müşteriler tarafından nasıl algılandığının bilinmesi çok önemlidir. Bu nedenle bankaların uzun vade de hayatta kalabilmek ve rekabet edebilmek için sundukları hizmetlerde müşteri odaklı olmalarına eskiye oranla daha fazla özen göstermeleri gerekmektedir. Bu yüzden de bankaların müşteri beklentilerini, memnuniyetlerini ve şikâyetlerini sürekli ölçerek memnuniyetsizliğin ortaya çıktığı hizmetlerde beklentilerine yönelik iyileştirmelere gitmeleri kaçınılmaz bir zorunluluk haline gelmektedir. Çalışma, katılım bankaları müşterilerinin sunulan hizmetlerden memnuniyetleri ile ideal bankalardan beklentileri arasındaki ilişkiyi bir model yardımıyla betimlemek amacıyla tasarlanmıştır. Bu amaçla Adıyaman'da mevcut bulunan katılım bankaları müşterileri arasından rassal olarak seçilen 200 müşteriye 19 önermeyi içeren bir anket uygulanmıştır. Anket formu kendi içinde sağlıklı olarak ayıklanmış ve 167 katılımcının verileri analiz edilerek değerlendirilmiştir. Analiz sonucunda öncelik özelik olarak bankaların ilgi (Empati) ve güvenilirliği, kuruma bağlılığı artıran önemli faktörler olduğu ortaya çıkmıştır."
