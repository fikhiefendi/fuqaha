abstract: "Diğer sistemlerde olduğu gibi, ekonomik sistemler de kendilerine özgü felsefi temellerle şekillenir. Sistemdeki bir kısım inanç, düşünce, prensipler, kabuller o sistemi uygulayacak olan insanların dünyaya ve olaylara bakış açısını yönlendirir ve zihinlerde kabul ya da ret şeklinde bir yargı oluşturur. Ekonomik sistemler de bir felsefi temele dayanmaktadır ve konvansiyonel finans ilminin felsefesi“firmaya konulan sermayenin maksimize edilmesi”fikrine dayanır. Buna karşılık İslâmî finans felsefesi, finansal yönetimin İslâmî sınırlar içerisinde faaliyet göstermesini öngörür yani İslâm'ın kapsamı dâhilindedir. İslâmî finans felsefisinin temeli“firmaya konulan sermayenin İslâmî kurallara (helal/haram eksenine) göre maksimize edilmesi”fikrine dayanır. Bu tezin amacı bu felsefelerin mukayesesi, İslâm hukuku çerçevesinde İslâmî finansmanla ilgili finans konularının temel prensiplerini, belirli bir bütünlük içerisinde sistematize edilmiş bir şekilde konvansiyonel finansla mukayeseli olarak ortaya koyarak literatüre katkı sunmak ve İslâmî finansın firmalarda nasıl uygulanabileceğini göstermektir. Bu sebeple İslâmî finansla ilgili hiçbir fıkhi tartışmaya girilmemiş, konular net ve açık olarak işlenerek gerçek hayatta nasıl uygulandığını gösterilmiştir. Bunun araştırması için nitel araştırma ve karşılaştırma yapılıp akademik alanlar ve de iş hayatındaki insanlara İslâmî finansın ve finansal sisteminin iyi anlaşılmasına katkıda bulunması öngörülmektedir."
