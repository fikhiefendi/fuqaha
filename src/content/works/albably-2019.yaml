abstract: "Bu çalışma Vakıf kurumlarının yönetiminde bireysel vizyondan etkin kurumsal çalışmaya nasıl geçileceğini hedef almıştır. Çalışmada ilk olarak dil ve terminoloji açısından yönetişim kavramı tanıtıldı. Ardından yönetişim kavramı için uluslararası örgütlerin tanımlarına devam etti. Yönetişimin finansal ve idari yolsuzlukla mücadeleyle ilişkisinin yanı sıra. Vakfın toplumun sürdürülebilir kalkınmasındaki rolünü açıkladı. Araştırma modern vakıf şirketlerinin dili ve terminolojisi ile bu şirketlerin nasıl kurulacağı olarak tanımlandı. Araştırma sorunu, vizyon ve bireysel kararların hakim olduğu vakıf kurumlarının çoğunun, çeşitli bilim ve modern yönetim becerileri çağında yönetilmesiydi. Araştırma, üç eksene dayanan bir yönetişim ve performans modeli önerdi:“etkinleştiriciler, temalar, süreçler”ve her ekseni harekete geçirmek için sekiz unsurla birlikte. Yönetim ve Performans Yönetimi Ofisi,“Stratejik Seviye, Yönetici Seviyesi ve Operasyonel Seviye”olmak üzere üç düzeyde faaliyet göstermektedir."
