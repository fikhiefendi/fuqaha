abstract: "ÖZET Akıl, insanı diğer canlılardan ayıran ve sorumlu kılan güç ve özelliktir. Akıl sayesinde insanlar düşünme ve anlama melekesi kazanırlar. İnsanın her türlü faaliyetinde doğruyu yanlıştan ayırmasını sağlar. Akıl, ahlakî, siyasî ve estetik değerleri belirlemede önemli rol oynar. Kur'an'da akıl kavramı üzerinde çok fazla durulmuştur. Kur'an'a göre akıl eşyanın hakikatini anladığı gibi ilâhi hakikatleri de anlayabilir. Aynı zamanda akü hakkında felsefe, kelam, tasavvuf gibi ilim dallarında pek çok eser ve araştırma yapılmıştır. Ehliyet kelimesi dinî ve hukukî eylemlere elverişli olmayı ifade eder. Bu özellik ile insan bütün varlıklar arasında farklı bir konumdadır. Kişi, aklı sayesinde hak ve borçlara ehil, dinî görevlerle mükellef, toplumsal ve cezaî açıdan sorumlu olur. Bu yüzden ehliyet, cenin safhasından olgunluk dönemine kadar yavaş yavaş gelişme gösteren itibarî bir sıfattır. Ehliyet, vücub ve edâ ehliyeti olarak ikiye ayrılır. Her insan vücub ehliyetine sahiptir. Aklî gelişimini tamamlayan kişiler buna ek olarak edâ ehliyetine de sahip olur. Edâ ehliyeti, kişinin dinî ve hukukî işlem yapmaya elverişli olmasıdır. Bu iki ehliyet, ehliyetin iki ana kısmı değil, iki aşaması olarak düşünülmelidir. Kişi edâ ehliyetini temyiz, bulûğ ve rüşt olarak üç dönemde kazanır. Ehliyete irade dışı arızalar ve iradeye bağlı arızalar etki ederek onu daraltır ve ortadan kaldırır. İrade dışı arızalar çocukluk, delilik, bunaklık, uyku ve baygınlık, unutma gibi durumlar; iradeye bağlı arızalar ise cehalet, hata, ciddiyetsizlik, sefeh, sarhoşluk ve ikrah gibi durumlardır. İnsanı değerli kılan akıldır. Akıl, ilâhi emirler karşısında insana sorumluluk yükler. Bu yüzden akıl, her türlü tehlikeye karşı korunmalıdır. Sağlam aklın hukuktaki önemi büyüktür. v"
