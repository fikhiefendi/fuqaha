abstract: "Kütahya, uzun bir dönem Anadolu Beylerbeyliği'nin merkezi oldu. Bu tezde 1785-1788 yıllarına tarihlendirilmiş 5 Numaralı Kütahya Şer'iyye Sicili incelendi. Şer'iyye sicilleri kadının tuttuğu mahkeme kararlarını içerir. İncelediğimiz defterde hüccet, i'lâm ve tereke gibi kayıtların yanı sıra merkezden gelen ferman, berat ve buyuruldu gibi belgeler de yer almaktadır. Osmanlı döneminden günümüze kadar ulaşan bu kayıtlar, toplumun sosyal, siyasi ve iktisadi yapısı hakkında pek çok bilgi vermektedir. Ayrıca merkezden gönderilen belgeler sayesinde merkez- taşra ilişkilerinin içeriğini anlayabilmekteyiz. XVIII. yüzyılın sonlarında Osmanlı Devleti, Rusya ile savaş içerisindedir. Merkezden gelen belgeler bu savaşın taşradaki yansımalarına ışık tutmaktadır. Paşalar arasındaki rekabet Kütahya'da mütesellim değişimi olarak kendini göstermiştir. Ayrıca otorite boşluğu eşkıyalık faaliyetlerini arttırmıştır. Bu bilgilerden hareketle çalışmamızda, Kütahya'nın belirtilen yıllarda sancak idaresi, şehrin merkez ile ilişkileri, sancakta yaşayan nüfusun sosyal ve ekonomik yapısı ele alınmıştır."
