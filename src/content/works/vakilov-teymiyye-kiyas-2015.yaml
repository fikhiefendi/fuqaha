abstract: "İslam düşünce tarihinde önemli yeri olan şahsiyetlerden biride Şeyhu'l-İslam Takiyuddin İbn Teymiyye'dir. Bir Hanbelî olarak nasscı ehli-hadis geleneğini temsil eden bu fakîhin aklî bir yöntem olan kıyasa münasebeti bu araşdırmamızın esas konusudr. İbn Teymiyye nassların bütün Fıkhî hükümleri kapsadığı fikrini savunmuş, kıyas gibi aklî yöntemlerle elde edilen hükümlerin de aslında nasslarda mevcut olduğunu söylemiştir. Nassların şümulluluğunu, her şeyi ihata edip, her şeye yeteceğini savunan fakihimiz bunun yanında hükümlerin istinbatında, özellikle benzerlerine tatbik etmek için nasslarda var olan illet ve hikmetlerin belirlenmesinde aklın rolünü inkâr etmemiştir. Bu konuda nassların üzrerinde akıl yürütmeyi ve dolayısıyla kıyası inkar eden Zahirî'leri ve Eş'arî kelamının etkisinde kalarak hükümlerde illet ve hikmetleri inkâr eden bazı ehli sünnet ulemasını tenkit etmiştir. İbn Teymiyyen'nin tefekkürünün diğer bir ana teziyse sarih akılla sahih nassın bir-birine zıt olamayacağı fikridir. Bu düşünce İbn Teymiyye'nin kıyas anlayışını da oturttuğu diğer esas zemindir. Ona göre sahih nassın kaynağı İlahi vahiy olduğu gibi sarih akılın da kaynağı İlahîdir. Allah insanlara Kurânı nazil ettiği gibi Mizanı, yani düşünme ölçme duğusunu da insana nazil etmiştir. Her ikisi ilahi kaynaklı olduğu gibi bir-birilerine de ters düşmez, aksine biri diğerini tamamlar. Kıyasda bir akli yöntem olarak bu Mizan'ın ürünüdür. Bu düşünceden hareketle İbn Teymiyye bazı fakihlerin kıyasla elde edilen hükümlerin nassa aykırı ola bileceği iddialarını eleştirmiş, onların bu düşüncesini aksettiren fürudaki bazı birçok konuları ele alarak teker-teker cevaplandırmıştır. Bu tezde İbn Teymiyye'nin fıkıh usulündeki kıyas anlayışı zikrettiğimiz yönleri ile ele alınmış bu konuda detalları ile incelenmiştir."
