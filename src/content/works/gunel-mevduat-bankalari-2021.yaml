abstract: "Bu çalışmada, bireylerin konut finansmanı tercihlerinin belirlenerek, geçerlik ve güvenirlik kriterlerini sağlayan bir ölçme aracı geliştirilmesi amaçlanmıştır. Tüketicilerin konut finansmanı tercihlerinde etkisi olan faktörler karma yöntem araştırmasıyla belirlenmeye çalışılmıştır. Araştırmada karma yöntem desenlerinden biri olan Keşfedici Sıralı Desen tercih edilmiştir. İlk olarak nitel veriler toplanıp analiz edilmiş daha sonra nicel veriler elde edilerek ölçme aracı geliştirilmiş ve son aşamada da toplanan verilere nicel analizler uygulanmıştır. Araştırmanın evrenini, TR 72 Bölgesi'nde (Sivas, Kayseri, Yozgat) yaşayan ve konut finansmanı alınabilmesi için genel kabul gören 18 ile 65 yaş aralığında bulunan kişiler oluşturmaktadır. Araştırmanın nitel aşamasında kartopu örnekleme yöntemi ile ulaşılan 34 kişiyle yarı yapılandırılmış görüşmeler yapılmıştır. Bu görüşmelerden elde edilen veriler Nvivo 11 paket programı ile analiz edilerek, taslak ölçeğin madde havuzunu oluşturacak olan 75 kod ve bu kodları içeren 9 tema elde edilmiştir. Uzman değerlendirmeleri sonrası taslak ölçekte 54 madde kalmış ve kapsam geçerliliği için 11 uzmanın değerlendirmesi sonucu madde sayısı 43'e düşürülmüştür. Taslak ölçek Kayseri, Sivas ve Yozgat illerinde yaşayan kişilere kolayda örnekleme yöntemi kullanılarak uygulanmıştır. Pilot uygulama kapsamında 102 kişiye, ölçeğin yapı geçerliliğinin incelenmesine yönelik açıklayıcı faktör analizi aşamasında da 440 kişiye taslak ölçek uygulanmıştır. Uygulama sonrası elde edilen verilerin analizi SPSS 25.0 ve AMOS 25.0 istatistik paket programları kullanılarak yapılmıştır. Açıklayıcı faktör analizi sonucunda 5 faktör (sağlanan avantaj, hizmet, güvenirlik, maliyet, kurum imajı) ve 23 maddeden oluşan bir ölçme yapısı elde edilmiştir. Doğrulayıcı faktör analizi aşamasında 230 kişiden elde edilen veriler ile bu yapının geçerliği teyit edilmiştir. Ayrıca ölçeğin güvenirlik analizleri için test tekrar test uygulamasında 40 kişiye, madde analizi ve Cronbach α katsayısının hesaplanması aşamalarında ise 204 kişiye ulaşılmıştır. Yapılan analizler neticesinde verilerin normal dağılım göstermemesi nedeniyle nonparametrik istatistiksel yöntemler kullanılmıştır. Mann Whitney U Testi, Kruskal-Wallis H Testi ve Bonferroni Düzeltmeli Mann Whitney U Testi gibi istatistiksel yöntemlerden yararlanılmıştır. Çalışma sonucunda, ölçeğin tüm faktörlerine ait AVE değerlerinin %50'nin üzerinde olduğu, CR katsayısı değerlerinin 0,847 ile 0,962 arasında değerler aldığı, tüm faktör çiftlerinin AVE değerlerinin bu faktörler arasında oluşan korelasyon katsayısının karesinden büyük olduğu, maddelere ait madde toplam korelasyon değerlerinin 0,307 ile 0,69 arasında olduğu, bütün maddelerin alt ve üst gruplara ait ortalamaları arasında anlamlı fark olduğu (p<0,05), ölçeğin Cronbach α iç tutarlılık katsayısının 0,915 olduğu ve ölçeğin kararlılık katsayısının da 0,863 olduğu hesaplanmıştır. Elde edilen bulgular doğrultusunda, karma yöntem araştırması ile geliştirilmiş olan“Konut Finansmanı Tercih Ölçeğinin”güvenilir ve geçerli bir ölçme aracı olduğu sonucuna ulaşılmıştır. Ölçme aracı beş alt boyuttan ve 23 maddeden oluşmaktadır. Bu alt boyutlar: Sağlanan Avantaj, Hizmet, Güvenirlik, Maliyet ve Kurum İmajıdır."
