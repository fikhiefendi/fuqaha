abstract: "Dünyada“İslâmi bankalar”olarak adlandırılan ve başlangıcı 1960'lı yıllara dayanan faizsiz bankalar, Türkiye'de 1983'ten 2005 yılı sonuna kadar“Özel Finans Kurumları”olarak hayatını sürdürmüş, 19.10.2005 tarihli 5411 sayılı Bankacılık Kanunu ile de banka statüsü kazanarak 2006'dan itibaren“Katılım Bankası”adı altında faaliyetlerini sürdürmektedirler. Katılım bankacılığı toplumda faiz hassasiyeti olan kesimlerin tasarruflarını ekonomiye kazandırmayı ve benzer nitelikteki yabancı fonların ülkeye girişine aracı olmayı amaçlamaktadır. Bu sebeple geleneksel bankacılıktan farklı olarak kendisine has, hatta Türk Katılım Bankacılığında islami kuralları dayanak kabul eden uygulamaları bulunmaktadır. Türk bankacılık sisteminde üçüncü bir bankacılık türü olarak yerini alan Katılım Bankaları, sektöre dâhil olduğundan bu yana hızlı gelişimini ve kârlılığını devam ettirmektedir. Günümüz Türk bankacılık sisteminde dört adet katılım bankası bulunmaktadır. Bu bankalar 2005 yılından itibaren kriz dönemleri dâhil kârlılıklarında sürekli gelişme kaydetmişler ve geleneksel bankacılık ile rekabet edebilir seviyelere ulaşmışlardır. Bu çalışmada, katılım banklarının ve ticari bankaların fon toplama ve kullandırma yöntemlerinin Türk Bankacılık Sektöründeki paylarını ortaya koymak ve bu bağlamda özellikle katılım bankalarınca geliştirilen yeni yöntemlerin ve bu kapsamda Sukuk'un kabulü ve gelişiminin ortaya konması amaçlanmıştır. Sukuk çift yönlü kullanımından dolayı seçilmiş olup; Sukuk yöntemiyle fon temini ve fon kullandırılması açıklanmaya çalışılacaktır. Çalışmanın ilk bölümünde katılım bankalarının ve ticari bankaların fon toplama ve kullandırma yöntemleri hakkında bilgiler verilmiştir. Çalışmanın ikinci bölümünde katılım bankalarının ve ticari bankaların fon toplama ve kullandırma yöntemleri karşılaştırılmıştır. Son bölümde ise katılım bankalarının ve ticari bankaların fon toplama ve kullandırma yöntemlerinin değerlendirilmesi ve yeni enstrüman olan sukukun kullanımı ve gelişimi dikkate alınmıştır."
