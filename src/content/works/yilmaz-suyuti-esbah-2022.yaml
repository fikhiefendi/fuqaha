abstract: "İslâm hukuku, şer'î amelî hükümleri inceleyen bir ilim dalı olması hasebiyle birtakım kurallar ışığında, her asırda Müslüman toplumun ihtiyaçlarına cevap veren dinamik bir yapıya sahiptir. Mezkûr ilim öncelikle usûl ve furû olmak üzere iki başlık altında gelişmiş ve bunlardan mütevellit farklı alt yazım türleriyle muhtevasını zenginleştirmiştir. Bu yazım türlerinden biri de hicri IV. asırda fıkhî mezheplerce küllî kâidelere münhasır müstakil eserlerin telif edilmesiyle ortaya çıkan kavâid edebiyatıdır. Küllî kâideler, dış görünüş itibariyle birbirine teâruz eden hükümleri belli bir usûl dâhilinde toplayarak bir düzene tabi tutmuş ve fıkıh ilminde yeni bir çığır açmıştır. Bu bağlamda fıkıh ilminde ilerlemede ve fıkhın esaslarına muttali olma hususunda ihtisas yapmak isteyenler için küllî kâideler dikkate alınması gereken önemli bir ilim dalıdır. Fakîhler kavâid ilminin önemine binaen birçok eser telif etmişlerdir. Bu eserlerden biri de çalışmamızda incelemeye aldığımız küllî kâide ilmine farklı bir bakış açısı kazandıran ve kendi döneminden itibaren bu alanda temel kaynaklar arasına giren İmam Suyûtî'nin“el-Eşbâh ve'n-Nezâir”adlı eseridir. Mezkûr eserde küllî kâideler, genelden özele ve ehemden mühime şeklinde bir yönteme tabi tutulmuş ve kâideler delilleriyle birlikte incelenmiştir. Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde İmam Suyûtî'nin hayatı ve ilmî kişiliğine değinilmiş ve Suyûtî'nin“el-Eşbâh ve'n-Nezâir”adlı eseri kısaca tanıtılmıştır. İkinci bölümde ise küllî kâidelerin kaynakları, temel özellikleri ve küllî kâidelerin müstakil delil olma vasfı ele alınmıştır. Bununla birlikte fıkhî bir terim olan kâidenin tarihsel gelişimi ve bu terimle bağlantılı olan eşbâh, dâbıt vb. diğer kavramlar tetkik edilmiştir. Üçüncü bölümde ise çalışmanın asıl konusunu teşkil eden Suyûtî'nin mezkûr eserindeki dayanağı nas ile ictihâd olan kırk beş küllî kâide ele alınmış ve bu kâidelerin uygulama alanlarına yer verilmiştir. Kâideler ele alınırken İmam Subkî ve İbn Nuceym'in aynı adla telif ettikleri eserdeki kâideler ile Mecelle'deki tespit edilen kâideler arasında bir mukayese yapılmıştır. Ek olarak Suyûtî'nin mezkûr eserindeki kâidelerin tertibine yer verilmiştir."
