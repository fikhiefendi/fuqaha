abstract: "ÖZET Yüksek Lisans Tezi İSLAM AİLE HUKUKUNDA ÇOCUĞUN BAKIM VE EĞİTİMİ Selma EŞKAN Tez Yönetecish Prof. Dr. Mustafa BAKTIR 1999-Sayfa:30 Jüri: Prof. Dr. Mustafa BAKTIR e»«t»»»»»»«ee»«»»e»» ».«*«» »»»ftees»»eeee»»»« Toplumların geleceği olan nitelikli insan gücünün temeli, çocukluk ve gençlik dönemine dayanır. Çocukların yetişmesinde ve erdemli fertler olarak topluma kazandırılmasında en önemli vazifenin anne-babada olduğu tartışmadan uzaktır. Bu husus çoğunlukla anne-babanm en büyük arzusu olarak var olsa da, bütün insan ilişkilerinde olduğu gibi muhtemel sorunlar hukukî düzenlemeleri gerektirmiştir. Böylece hukuk sistemleri fizikî ve aklî yetersizliklerinden hareketle çocukları koruyan hükümlere yer vermiştir. İslam Hukukçuları, çocukların bakım ve eğitimi hususunu büyük bir dikkatle ele almış, çocukların iyi yetişmesini hedefleyen hükümlere yer vermişlerdir. Aynı zamanda aile reisi olan baba, çocuğun maslahatlarının yerine getirilmesinde esas sorumlu ve yetkilidir. Baba çocuğun iyi ve sağlıklı yetişmesini gerektirecek tüm faaliyetlerden ve çocuğun nafakasının karşılanmasından sorumludur. Çocukla ilgili tasarruflarda sorumlu ve yetkili olabilecek kimselerin sahip olması gereken vasıflara ilişkin tespitler, İslam Hukukçularının konuya olan duyarlılıklarım gösterir. 1C fteöStoCTlM KUTOLüJ"
