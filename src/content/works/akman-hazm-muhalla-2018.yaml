abstract: "Çalışmamız giriş ve iki bölümden oluşmaktadır. Birinci bölümde İbn Hazm'ın hayatı, şahsiyyeti, ilmi eğitimi, eserleri ve usûl anlayışından bahsedip ardından tez konumuzu oluşturan, Mukâyeseli İslam Hukukunun temel eserlerinden biri olan el-Muhallâ'yı tanıttıktan sonra İbn Hazm'ın fıkhi görüşlerinden örnekler vermeye çalıştık. Çalışmamızın ikinci bölümünde İbn Hazm'ın, el-Muhallâ'nın ibadet konularını kapsayan bölümlerinde Ebu Hanîfe'ye ait olduğunu ifade ettiği görüşleri tespit edip, Hanefi kaynaklardan bu görüşleri teyit ettik. Tezimizde 755 görüş inceledik. Bu görüşlerin 60 tanesinin hatalı görüş olduğu kanaatine varılmıştır. Bu hatalar Taharet, Namaz, Zekât, Oruç ve Hac konularında bulunmaktadır. Bu çalışmamızdan hareketle, el-Muhallâ'da daha fazla hatalı nakil olma ihtîmâli vardır. Bu sebeple el-Muhallâ üzerinde daha derin ve ileri çalışmalara ihtiyaç olduğunu düşünmekteyiz."
