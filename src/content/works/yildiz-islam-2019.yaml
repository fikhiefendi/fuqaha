abstract: "İslâm inancına göre peygamberler saygı duyulması gereken insanların en başında yer almaktadır. Bununla birlikte peygamberlerin sonuncusu olan Hz. Peygamber diğer peygamberler gibi gerek yaşadığı dönemde gerekse vefatından sonra bazı kimseler tarafından hakarete maruz kalmıştır. Bu araştırma İslâm hukukunda Hz. Peygamber'e hakaret suçu ve cezasını içermektedir. Amacımız İslâm hukukunda Hz. Peygamber'e hakaret suçu için öngörülen cezaları ortaya koymaktır. Çalışma biri giriş olmak üzere dört bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, kapsamı, önemi, amacı, yöntemi, kaynakları, hakaret suçuyla alâkalı kavramlar ve Hz. Peygamber'in değeri hakkında bilgi verdik. Birinci bölümde hakaret suçunun unsurlarına, gerçekleşme şekillerine, fâilinde aranan şartlara, tespitine, hakaret eden Müslümanın hükmüne, hakaret eden zimmînin akdinin durumuna ve hakaret edenin pişmanlığına yer verdik. İkinci bölümde Hz. Peygamber'e hakaretin cezasını, cezayı ağırlaştıran, hafifleten veya ortadan kaldıran sebepleri ve tarihi uygulamaları ele aldık. Üçüncü bölümde ise Hz. Peygamber'e hakaretin cezası ile alakalı çağdaş yaklaşımları inceledik."
