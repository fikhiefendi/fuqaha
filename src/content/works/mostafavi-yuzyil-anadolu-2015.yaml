abstract: "Anadolu Selçukluları döneminde yaşayan ünlü sûfi şair Evhadeddin Hamid b. Ebu'l-Fahr-i Kirmanî (561-635/1166-1238) 16 yaşlarında sosyo-politik krizden dolayı anavatanını terk ederek Bağdad'a yönelir. Burada fıkıh alanında eğitim aldıktan sonra mûit'lik makamına yükselir. Ardından arayışlarına devam eder ve Sühreverdîlik tarikatının Ebherîyye koluna katılır. Bir yandan şeyhi Sücasî tarafından seyr ü sülûk amacıyla diğer yandan da Ebherîyye tarikatının yayılması doğrultusunda ilk önce Azerbaycan seyahatinde bulunmuştur. Evhadeddin-i Kirmanî, 13. yüzyılın başlarında Anadolu bölgesine yoğunlaşarak Kayseri, Malatya, Ahlat, Sivas, Konya ve Diyarbakır gibi muhtelif şehirlerde seyahatte bulunur. Ardından, Anadolu'da bulunduğu süreçte bu bölgede sınırlı kalmayarak; gezgin bir sûfi olarak Suriye, Mısır ve İran'ın bazı kentlerine vs. bölgelere devamlı seyahat yapar. Bu bağlamda sözkonusu seyahatlerin zaman zaman siyasi amaçla gerçekleştiğini belirtmeliyiz. Nitekim kendisi Anadolu'da bulunduğu süreçte birçok öğrenci yetiştirmiş, siyasi-dinî ve tasavvufi çevrelerle de münasebette bulunmuştur. Ayrıca devletin ve zengin kesimin desteği ile bazı şehirlerde hankâh kurmaya girişmiştir. Sonraki dönemlerde de Ebherîyye tarikatının bir kolu olarak Evhadîyye tarikatı kısıtlı bir şekilde faaliyeti devam edilmiştir. Lakin hatta 19. yüzyıllarda Konya gibi şehirde bu tarikata ait hankâhının faaliyeti gözükmektedir. Şeyh Evhadeddin soy açısından bazı görüşlere rağmen Türk kökenli olduğu için net bir delil yoktur. Bu zat Rubaiyât eserine sahip olmakla birlikte mesnevi kalıbında yazılmış bulunan Misbahu'l-Ervah eseri de ona mensup edilmiştir. Hâlbuki ona mensup edilen bu eser bazı tanıklara göre tespiti çok zordur. Bu sûfi şair resmi olarak Melametîyye veya Kalenderîyye zümresine tabi olmasa da; gayri resmi olarak ameli ve fikri açıdan Melametî ve Kalenderî bir sûfi telakki edilebilir. Bu sûfinin özellikle vahdet-i vücudcu ve şahidbâzî niteliği ile de vasıflandırılması gerekmektedir. Ayrıca Futuvvet veya Ahilik gibi teşkilatlarla hiçbir bağlantısı olmamakla birlikte onun Anadolu'da Halife tarafından Futuvvet teşkilatının sürdürülmesi tezi yanlış bir yaklaşım olduğu âşikardır. Ayrıca, Evhadeddin kendi döneminde muhtelif çevreler arasında ün kazandığı da belirtilmelidir. Nitekim, Şeyh Şehabeddin Ömer-i Sühreverdî gibi ünlü sûfi ve Bağdad şeyhu'ş-şuyuhunun ölümü ardından (632/1235) Halife Mustansır tarafından bahşişte bulunur bazı vakıflar ona devredilir. Son olarak, kendisinin bu dönemden itibaren ömrünün sonuna kadar Bağdad'da bulunduğunu ve orada vefat ettiği ifade edilebilir."
