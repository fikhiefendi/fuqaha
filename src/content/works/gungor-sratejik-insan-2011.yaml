abstract: "Stratejik planlanma, günümüzde gerek kamu gerek özel, bütün işletmelerin üzerinde önemle durduğu bir alandır. İşletmeler stratejilerini oluştururken geleceğin risk unsurlarını dikkate alarak ellerindeki kaynakları en doğru şekilde kullanmayı amaçlarlar. Değişen rekabet ortamı, günün getirdiği şartlar, yasalar, küreselleşme, ülkelerin kalkınmışlık düzeyleri, hedefler, sektörlerin içinde bulundukları şartlar, örgütlerin arz miktarları buna karşılık bulan talep miktarları, stratejik planlara yön veren faktörlerdir.Stratejik insan kaynakları planlamasının hazırlanmasında işletmelerin hem mevcut şartları hem de yeni ihtiyaçları göz önünde tutulmaktadır. Oluşabilecek risk unsurları dikkate alınarak hazırlanan stratejik insan kaynakları planlamasında; işletmelerin geleceğinin, ani ekonomik ve sosyal değişimlere karşı korunması amaçlanmaktadır. İşletmeler belirledikleri hedefler doğrultusunda planlarını hazırlamaktadırlar. Bu hedefler kimi işletmeler için büyüme ve yüksek kar marjı; kimi işletmeler içinse kaliteli hizmet sunabilmektir.Günümüzde uzun vadeli hazırlanan stratejik insan kaynakları planlaması ile insan gücü, gereksiz bir maliyet unsuru olmaktan çıkıp, bir yatırım malı aracı olarak anlam kazanmaktadır. Bu bağlamda planlamanın uzman kişiler tarafından, ayrıntılı bir şekilde ele alınmasının önemli olduğu ortaya çıkmaktadır.Yüksek lisans tezimizde alan çalışması ile ilgili olarak bir bankanın, stratejik planlarına yön veren ve stratejik planlarını etkileyen faktörler incelenmiştir. Bankanın stratejik insan kaynakları planlaması ile varmak istediği amaçlar anlaşılmaya, değerlendirilmeye ve sonuca ulaşılmaya çalışılmıştır."
