abstract: "Muhammed Tâhir b. Âşûr'un Talakla İlgili Görüşleri ve Mâlikî Mezhebiyle Mukayesesi Bu çalışma, Mâlikî fakihlerinden olan Muhammed Tâhir b. Âşûr'un (ö. 1973) talakla ilgili görüşleri ve Mâlikî mezhebiyle mukayesesinden oluşmaktadır. Son dönem âlimlerinden olan İbn Âşur Tunuslu ilim ve fikir adamı, fakih, müfessir, muhaddis, tarihçi, filozof, mantıkçı olup Arap dili ve edebiyatında da etkin bir âlimdir. Çalışmada, talak konusunun ilk olarak kavramsal çerçevesi ve çeşitleri ele alınmış olup ilerleyen bölümlerde evliliğin karşılıklı rıza ile sona ermesi, fesih ve tefrik konuları yer almaktadır. Konular öncelikle Mâlikî mezhebindeki farklı görüşlerin ve mezhep içindeki tercih edilen görüşlerin ele alınması ve tercih edilen görüşlerle İbn Âşûr?un görüşlerinin karşılaştırılması şeklinde işlenmektedir. Mâlikî mezhebinin görüşleriyle İbn Âşûr'un fikirlerinin mukayese edildiği bu çalışmanın sonuçları şu şekilde olmuştur: İbn Âşûr genel olarak mezhebine bağlı ancak mezhep taassubundan uzak objektif bir bilim adamıdır. Bununla birlikte çalışmayı oluşturan konuların altısında İbn Âşûr mezhebiyle aynı görüşte iken üç konuda mezhebinin görüşlerinden ayrılmaktadır. Diğer hususlarda ise mutabık olduğuna veya farklı düşündüğüne dair açık bir veri bulunmamaktadır."
