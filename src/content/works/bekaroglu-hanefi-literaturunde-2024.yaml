abstract: "İslam hukukunun klasik kaynaklarında suç ve ceza konuları“ukûbât”başlığı altında işlenmiştir. İslam ceza hukukunun kaynakları naslar, icma ve kıyastır. Suçlar ve cezalar had, kısas, tazir şeklinde üçlü bir taksimle ele alınır. Bu çalışmada Hanefî mezhebi kaynaklarında ceza hukukuna ilişkin icmâ oluştuğunu belirtikleri hükümler tesbit edildikten sonra diğer üç mezhebin bu icmalar konusundaki görüşleri ortaya konulmaya çalışılmıştır. Dolayısıyla bu çalışma icmâ tartışmalarına yer vermeden Hanefî mezhebinde icmâ olarak nitelendirilen konularda diğer üç mezhebin konuyla alakalı görüşlerini karşılaştırmalı olarak ortaya koymaya yöneliktir. Bu sınırlar dahilinde icmâlar tespit edildikten sonra Hanefi mezhebinin delilleri sunulmuş, Hanefîlerin icmâsına diğer mezheplerin katılması durumunda, katıldıkları belirtilmekle yetinilmiştir. Ancak Hanefîlerin icmâsına katılmamaları durumununda gerekçeleri ile beraber konu ile ilgili tavırları ortaya konulmaya çalışılmıştır. Bu kapsamda birinci bölümde kısas ve diyet ana başlığı içeriğinde kasten, kasta benzer ve hata ile öldürme ve bunlar ile ilgili cezalara, meakil ve kasame konularına yer verilmektedir. İkinci bölümde had ve ta'zir cezaları ana başlığı içeriğinde zina, kazf, içki, hırsızlık, bağy, irtidat, hırabe suçlarına, hadler ile ilgili genel konulara ve ta'zir cezasına yer verilmiştir. Sonuç bölümünde elde edilen veriler kısaca sunularak çalışma tamamlanmıştır."
