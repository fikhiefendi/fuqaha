abstract: "Ca'feriyye mezhebi, ismini mensupları tarafından masum imam kabul edilen ve aynı zamanda sünnîler tarafından da kabul gören Ca'fer es-Sâdık'tan almıştır. Bu mezhep itikadi olmasının yanında siyâsi yönü ağır basan bir fırkadır. Ahbâriyye ve Usûliyye diye iki ekole ayrılan söz konusu mezhep teâruz olduğu kabul edilen haberleri çözüme kavuştururken farklı yollar takip etmiştir. Ahbâriyye genel olarak masum kabul edilen imamların rivayetlerini ilk sıraya alırken Usûliyye istidlâl yöntemini kullanmıştır. Her iki görüşte olanlar da siyâsi bir mezhep olmalarının doğal sonucu olarak masum kabul ettikleri imamlara büyük ehemmiyyet vermişlerdir. Bu çalışmamız giriş ve üç bölümden oluşmaktadır. İlk bölümde Ca'ferî fıkhının doğuşu, oluşumu, geçirdiği evreler ve ortaya çıkan mezhepleri ele aldık. İkinci bölümde delillerin teâruzu ve mahiyeti ile teâruzun türleri konularını ele aldık. Ca'ferî fakihlerin büyük çoğunluğu teâruz konusunu teâdül başlığı altında inceledikleri için biz de teâdül kavramını açıkladık. Özellikle bu konu anlatılırken ilk defa karşılaştığımız tezâhum kavramını da izah ettik. Tezâhum eden delillerin tercih edilme sebeplerini de teâruzu giderme konusuna ilave ettik. Üçüncü bölümde ise fakihlerin teâruzu giderme yolları olan cem' ve tevfîk, tercih, nesih, tesâkut, tahyîr ve tevakkuf konularını detaylı olarak inceledik ve izah ettik."
