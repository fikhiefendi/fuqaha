abstract: "Şevkânî'nin şer`î kıyasla ilgili görüşlerinin merkeze alındığı bu çalışmanın giriş bölümde müellifin hayatı, ilmî şahsiyeti, eserleri ve İslam dünyasındaki etkileri ele alınmıştır.Çalışmanın birinci bölümde Şevkânî'nin fıkıh usulü sahasında şer`î kıyas ile ilgili görüş ve yaklaşımları İrşâdü'l-fuhûl adlı eserine odaklanılarak ortaya konulmuştur. Bu bölümde kıyas taraftarları tarafından kıyasın hücciyyetine dair getirilen delillere Şevkânî tarafından verilen cevaplar üzerinde ayrıntılı olarak durulmuş ve kıyası inkâr edenler diğer fakihler ve Şevkânî arasında mukayeseye ışık tutacak bazı verilere yer verilmiştir.Çalışmanın ikinci bölümde ise Şevkânî'nin şer`î kıyasa bakışını yansıtan temsil kabiliyeti yüksek bazı füru-ı fıkıh örneklerine yer verilmiş ve kıyasa ilişkin tavrının füru-ı fıkıhtaki yansımaları ortaya konulmuştur.Sonuç itibariyle Şevkânî'nin, kıyas metoduyla dinde yer almayan birçok hükmün sonradan dine katıldığını düşünerek kıyasa karşı menfi bir duruş sergilediği tespit edilmiş, ancak kendisinden önce kıyasa karşı menfi bir tavır sergileyen Zâhirilerden bazı açılardan ayrıldığına dikkat çekilerek, kıyas adı verilen bütün istidlâl yöntemlerini reddetmediği ortaya konulmuştur. Usuldeki genel delil anlayışını ve özellikle kıyasa bakışını fürû-ı fıkha yansıtmakta tutarlı bir tavır sergilediği de görülmüştür."
