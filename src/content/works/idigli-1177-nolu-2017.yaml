abstract: "Edremit'e ait ulaşabildiğimiz en eski Şer'iyye Sicili, 1177 no'lu, 921 Hicri, 1515-16 Miladi tarihli olup 62 varaktan oluşmaktadır. Şer'iyye sicilindeki kayıtlarda miras, boşanma, nafaka, alacak-verecek, vakfiye, vekâlet, vasi tayini, satış, borç, icar, hırsızlık, adam öldürme gibi sosyal hayata dair pek çok konuda bilgiler bulunduğu gibi Yavuz Sultan Selim'in Çaldıran Seferi'ne dair de çok önemli bilgiler bulunmaktadır. Ayrıca kayıtlar incelendiğinde Edremit'in sosyo-ekonomik durumunun göstergelerinden olan meslekler üzerinde belgelere dayalı bir tespit ve değerlendirme de yapılabilmektedir."
