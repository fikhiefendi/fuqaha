abstract: "Teğâbun Sûresi âlimlerin, çoğunluğunun görüşüne göre Medine'de muhtemelen ilk yıllarda nâzil olmuştur. İsmini dokuzuncu ayette geçen ve (aldanmak/aldatmak ve toplanmak) manalarına gelen ن kelimesinden“ tegâbun ”اَلتَّغَابُ almıştır. Âyet sayısı on sekizdir. Fâsılaları ن،م،ر،د harfleridir. Tegâbun Sûresi, Allah'ın (cc) yüceliğini belirten, (tesbih) ifadesiyle başlayan beş sûrenin (müsebbihât) mushaf sıralamasına göre sonuncusudur. Sûre, Allah'ın (cc) varlığını ve peygamberleri vasıtasıyla yine Allah'a bağlanmayı, âhiret âlemini ve âhiret hayatına hazırlanma aracı olan dünya hayatını iç içe konular halinde ele alır. Bu muhtevayı üç bölüm halinde incelemek mümkündür. -Birinci bölüm: Kâinattaki her varlığın, Allah'ın (cc) büyüklüğüne tanıklık ettiği, hâkimiyet ve övgülerin Allah'a (cc) mahsus olduğu ve O'nun her şeye gücünün yettiğinin ifade edilmesiyle başlar. -İkinci bölüm: Ahiret hayatına dairdir. Kâfirlerin sonsuz hayatı inkâr ettikleri, fakat bunun mutlaka gerçekleşeceği, bu vesile ile dünya'da sergilenen davranışların karşılıklarının görüleceği ifade edilir. Sûre'nin dokuzuncu âyeti kerimesinde tüm insanların bir araya getirileceği kıyamet günü“tegâbun günü”diye isimlendirilir. -Üçüncü ve sûre'nin son bölümünde: Mü'minlere hitaben âhiret hayatının mutluluğu için dünya hayatında ölçülü ve erdemli davranılması gerektiğine dikkat çekilir. Bu hitabında Allah (cc) insan'a lutfettiği nimetlerden sayılan: eş, evlât ve mal'ın mü'min için bir imtihan vesilesi (düşmanlık sebebi) olduğu ve ebedî kurtuluşu engellemesi durumunda ise kendisi için düşman konumunda olabileceği vurgulanır. Tegâbun Sûresinde kâfirlerin asıl sorunlarının âhireti inkâr etmek olduğuna dikkat çekildikten sonra mü'minlerin hem kendi iç hesaplaşmaları hem de aile bireyleri ve Müslüman kesimi ile ilişkileri açısından uyum ve dayanışma kuralına uymalarının önemi dile getirilmiştir. Sûre'de ayrıca esmâ-i hüsnâ'dan on iki isim bulunmakta, bu isimlerin bir kısmı zât-ı ilâhiyyenin gücü ve azametini ifade ederken, diğerleri ise O'nun bağışlayıcı ve koruyucu özelliğini vurgulamaktadır."
