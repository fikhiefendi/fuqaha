abstract: "Osmanlı Devletinin kazalardaki idari teşkilatının temelini oluşturan ve ait olduğu bölgenin sosyo-ekonomik ve kültürel durumu hakkında bilgi verirken hem genel hem de yerel tarih araştırmalarına kaynaklık eden Şer'iye Sicillerinden Adana sancağına ait olan 54 numaralı Şer'iye Sicili(H. 1225-1227/ M. 1810-1812), bu çalışmanın ana kaynağını oluşturmaktadır. Sicildeki belgeler tek tek incelenmiş ve şehrin o dönemdeki sosyo-ekonomik yapısı hakkında bilgiler elde edilmeye çalışılmıştır. Çalışmamızın giriş bölümünde“Osmanlı Devletinde hukuk”başlığı altında Osmanlı mahkemeleri, kadılık müessesesi, şer'iye sicilleri ve muhtevası ile ilgili bilgiler verilmektedir. İçindekiler kısmı üç bölümden oluşmaktadır. Birinci bölümde Adana 54 numaralı Şer'iye Sicili'nin genel özellikleri ve belge özetleri yer almaktadır. İkinci bölümde ise Adana'nın coğrafi özellikleri, Osmanlı öncesinde ve Osmanlı sonrasında Adana'nın tarihsel gelişim süreci hakkında bilgi verilmektedir. Üçüncü bölümde Adana'nın sosyal-ekonomik yapısı ile ilgili değerlendirmeler yer almaktadır ve sosyal yapı hakkında bilgi verilirken bölgedeki Türkmenler ile yörük aşiretlerinden, nüfus sayısından, etnik yapıdan ve vakıf faaliyetlerinden bahsedilmiştir. İktisadi yapıda ise vergilendirme sisteminden, vergi çeşitlerinden, tarımsal faaliyetlerden, esnaf teşkilatlarından ve şehirdeki alacak-verecek davalarından bahsetmektedir. Sonuç kısmında ise çalışmadan elde ettiğimiz bilgilerle genel bir değerlendirme yapılmıştır. Ekler kısmında 54 numaralı Şer'iye Sicil'inin transkripsiyonu ve orijinal metin fotokopi örneklerine yer verilmiştir. Osmanlı devletinin hukuk sistemi, şer'iye sicilleri ve adana tarihi hakkında faydalandığım kaynaklar ise kaynakça kısmında yer almıştır."
