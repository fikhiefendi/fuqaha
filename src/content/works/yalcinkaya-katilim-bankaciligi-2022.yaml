abstract: "Bu çalışmada, bankacılık sektöründe özellikle 2005'ten sonra Bankacılık Kanunundaki düzenlemeler neticesinde varlığını hissettiren ve gelişmeye de devam eden katılım bankacılığının, bankacılık sektöründeki yeri incelenmiştir. Ayrıca Onuncu Kalkınma Planı'nda öncelikli gelişim programına dahil edilen katılım bankacılığı sektöründeki gelişmeler ele alınmıştır. 2015 yılından itibaren katılım bankacılığı sektörünün gelişmesine katkı sağlamak için kamu sermayeli katılım bankaları kurulmasıyla birlikte katılım bankacılığı sektörünün gelişim sürecinin hızlandığı saptanmıştır. Kamu sermayeli katılım bankacılığının yedi yıllık geçmişi olmasına rağmen katılım bankacılığı sektöründeki aktif rolü finansal kalemlere yansımış ve sektörde ortalama %30-35'lik bir pay elde ettiği görülmüştür. Bu verilerden hareketle kamu katılım bankalarının, katılım bankacılığı sektörünü geliştirmekte başrol oynayacakları anlaşılmaktadır."
