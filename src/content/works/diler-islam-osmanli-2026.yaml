abstract: "Bu çalışmada, İslam-Osmanlı hukukunda hükümdarın mesuliyetinin mahiyeti ve hududu üzerinde durulmuştur. Mesuliyet mefhumu; hukukî, cezaî ve siyasî manada hükümdarın mesul tutulup tutulamamasını ifade edecek şekilde ele alınmıştır. İslam hukuku, hükümdarın mesuliyetine dair mevzuları doğrudan hükme bağlamamıştır. Ancak ilk devirlerde Kur'an-ı Kerîm ile Sünnetteki esaslara istinat eden tatbikat ve sonrasında buna dair kaleme alınan kaynaklar ışığında mesele tetkik olunduğunda, İslam devletinde hükümdarın hukukî cihetle gayrimesul bulunmadığı anlaşılmaktadır. Hükümdar, tebaadan her fert gibi hususî hukuk süjesi olarak tam bir mesuliyet taşımaktadır ve muhakeme edilebilir. Cezaî sahada ise makamının getirdiği bazı imtiyazlar haricinde, hükümdarın yine gayrimesul olmadığı; icabında mesuliyetine gidilebileceği görülmektedir. Lakin siyasî sahada, İslam hukukunun sınırlarında kalmak kaydıyla, hükümdarın gayrimesul bulunduğu telakkisi hâkimdir. Hal' vakaları da bu meyanda tetkik olunmuştur. Çalışma neticesinde, hemen bütün İslam hükümdarları gibi Osmanlı padişahları için de bu hükümlerin câri olduğu tespit edilmiştir. Padişahların hukukî ve cezaî cihetle gayrimesul olmadığına işaret eden hadiselerin yanı sıra; 1876'da ilan edilen Kanun-ı Esasî'nin beşinci maddesinde Osmanlı Devleti'nde padişahın siyaseten gayrimesul olduğunun tanzim edilmesi de bu tespiti teyit eder mahiyettedir."
