abstract: "Muhammed Ali es-Sâyis (1899-1976), ilmî ve fikrî çalışmalarıyla temayüz etmiş 20. yüzyıl Ezher ulemasının önde gelen âlimlerindendir. Daha ziyade fıkıh ilmi alanındaki çalışmaları ile öne çıkmıştır. Başta Tefsîru Âyâti'l-Ahkâm adlı eseri olmak üzere bu alanda çeşitli eserler kaleme almıştır. Sâyis'in yetiştiği çevre dikkate alındığında genellikle yenilikçi fikirleriyle öne çıkan şahsiyetlerden beslendiği görülmektedir. Sâyis'in bu şahsiyetlerden ne şekilde etkilendiği üzerinde durulması gereken bir husustur. Böylece ortaya koyduğu fikirlerin hangi düşünce geleneğinden beslendiği daha net olarak anlaşılacaktır. Sâyis'i bu açıdan inceleyebilmek için, gündelik hayatı en çok ilgilendiren ayetlerin yorumlarını içeren bir çalışma olması yönüyle Tefsîru Âyâti'l-Ahkâm adlı eseri örnek olarak seçilmiştir. Çalışmada önce Sâyis'in bilimsel şahsiyetini şekillendiren çevre üzerinde durulacaktır, ardından yöntemsel açıdan Tefsîru Âyâti'l-Ahkâm eserinde ortaya koyduğu esaslar ele alınacaktır. Böylece usûl bakımından gelenek ile bağlantısının ne oranda olduğu ortaya konulacaktır. Son olarak da benimsenen yöntemin bireysel meselelere nasıl uygulandığı üzerinde durulacak, böylece usûl ile furû meseleleri arasındaki uyum yanında bunun gelenek ile bağlantısı ortaya konulacaktır. Sâyis'in gerek usul gerek furû ile ilgili yorumları, temsil gücü yüksek ayetler örneğinde ortaya konulacaktır. Bu aşamada klasik gelenekten farklı yorumları olup olmadığı açısından tetkik edilecek ve müellifin hangi sebepten dolayı bir tercihte bulunduğu veya şahsî yorum yaptığı tespit edilecektir. Müellifin yorumları veya tercihleri üzerinden sahip olduğu mezhebî/fıkrî temayülleri ve usul hinterlandı tespit edilecektir. Bu ise Tefsir ve İslam Düşüncesi literatüründe konumunun daha iyi belirlenmesine imkân tanıyacaktır. Ayrıca interdispliner (İslam Hukuku-Tefsir) bir özelliğe sahip olması hasebiyle sadece tefsir alanındaki akademik literatüre hitap etmekle kalmayıp İslam Hukuku alanındaki akademik çevrelere de hitap edecek ve ilgili literatüre katkı sağlayacaktır."
