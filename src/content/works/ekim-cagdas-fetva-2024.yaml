abstract: "Bu çalışma güncel fıkhî problemlerin çözümünde çağdaş fetva kurulları tarafından ihtiyaç ve zaruret kavramlarının bir referans kaynağı olarak kullanılmasını analiz etmeyi amaçlamaktadır. İki ana bölümden oluşan çalışmanın birinci bölümünde söz konusu kavram ikilisinin doğru ve kapsamlı bir şekilde anlaşılması ve böylece sağlıklı bir analiz çerçevesinin oluşturulması amacıyla teorik bir inceleme yapılmıştır. Bu kapsamda ihtiyaç ve zaruretin tanımları, bu kavramların bazı fıkıh usûlü terimleriyle ilişkileri, külli kaideler içerisindeki yerleri ve şer'î hükümlerin gerekçesi olabilmeleri için aranan şartlar ele alınmıştır. Literatürde zaruret ve ihtiyacın hükümlere gerekçe yapılırken genellikle birlikte kullanılmalarından hareketle bu iki kavramın eş anlamlı olduğuna dair yaygın bir kabul bulunsa da bu çalışma onların aslında mahiyetleri itibariyle birbirinden farklı kavramlar olduğunu öne sürmektedir. Çağdaş fetva kurullarının ihtiyaç ve zaruret kavramlarına yaklaşımlarına odaklanan ikinci bölümde ise söz konusu kurulların pek çok meselede doğrudan bu iki kavrama referansla naslarda açıkça beyan edilen hükümlerden ve naslardan elde edilen kaide ve asıllarda yer alan hükümlerden istisna yaptığı gösterilmiştir. Yine belli bir mezhebe göre hüküm veren fetva kurullarının kimi zaman zaruret ve ihtiyaç olgusunu göz önünde bulundurarak takip ettikleri mezhebin görüşü yerine başka bir mezhebin görüşünü esas aldığı tespit edilmiştir. Bu kurulların kimi zaman da yine aynı gerekçeyle takip ettikleri mezhebin müftâbih görüşü yerine mezhep içi görüşler hiyerarşisinde ondan daha düşük seviyede yer alan başka bir görüşü tercih ettikleri saptanmıştır. Çağdaş fetva kurullarını ihtiyaç ve zarurete dayalı hükümler vermeye sevk eden temel etkenlerin başında tıp alanında ve sosyal hayatta esaslı değişimlere neden olan teknolojik ilerlemeler gelmektedir. Bu değişimler toplumda köklü bir yere sahip olan kimi uygulamaların güncellenmesi veya söz konusu teknolojik ilerlemelere bağlı olarak insanların hayatlarına birtakım yeni uygulamaların girmesi şeklinde kendini göstermektedir. Bu bakımdan çalışmada çağdaş fetva kurullarının ihtiyaç ve zaruret kavramlarını kullanımları tıp alanında ve sosyal hayatta meydana gelen söz konusu değişimler üzerinden ele alınmıştır."
