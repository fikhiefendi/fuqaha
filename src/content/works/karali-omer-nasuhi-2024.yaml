abstract: "Yaşantıları ve fikirleri ile sosyal hayatı etkileyen, önemli eserler yazan büyük şahsiyetleri bilmek, onları tanımak, onların bilgi ve deneyimlerinden faydalanmak başta ilim talibi olanlar için ve daha sonrasında herkes için büyük bir kazançtır. Bu çalışmada, yakın geçmişte yaşamış olmasına rağmen henüz tam olarak tanınmayan, Türk düşünce ve bilim tarihinin önemli figürlerinden biri olan, fakih ve müfessir kimliğiyle temayüz etmiş büyük İslâm âlimi Ömer Nasuhi Bilmen'in bir nebze olsun tanınmasına ve tanıtılmasına önem verilmiştir. Çalışma, bir giriş kısmı ve iki ana bölümden oluşmaktadır. Giriş bölümünde, çalışmanın kapsamı, Ömer Nasuhi Bilmen'in hayatı, eserleri ve ilmi kişiliği hakkında bilgi verilmiştir. Çalışmanın birinci bölümünde“Örf ve Âdet”tanımları yapılmış ve bu kavramlarla ilgili olarak İslam hukukunda yazılmış klasik ve son dönem kaynaklarından yararlanılmıştır. Çalışmanın ikinci bölümünde ise, araştırmaya konu olan“Örf ve Âdet”i Ömer Nasuhi Bilmen'in başta Büyük İslam İlmihali ve Hukukı İslâmiyye ve Istılahatı Fıkhiyye Kamusu (8 cilt) olmak üzere eserlerinde nasıl işlediği analiz edilmeye çalışılmıştır. Anahtar Kelimler: İslam Hukuku, Ömer Nasuhi Bilmen, Örf, Âdet, Toplum."
