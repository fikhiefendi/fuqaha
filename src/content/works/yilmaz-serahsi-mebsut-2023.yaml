abstract: "Beşinci asrın en önemli Hanefî âlimlerinden birisi olan Serahsî Horasan'ın Serahs şehrinde doğmuştur. Çocukluk yılları hariç hayatının büyük bir bölümünü Maveraünnehir, Fergana ve Özkent şehirlerinde geçirmiştir. Fıkıh alanında usûl ve fürû'ya dair pek çok eser kaleme almıştır. Eserlerinin çoğunu imkansızlıklar içerisinde hapishanede yazmıştır. Hapishanede yazdığı otuz ciltlik Mebsût isimli eser fıkıh literatürü içerisinde çok önemli bir yere sahiptir. Tez konusu olarak, fürû' fıkhın bütün konularını ele alan bu önemli eserdeki ruhsat hükümleri örneğinde Hanefî mezhebinde ruhsat hükümleri ele alınmıştır. Ruhsat hükümler kulların karşılaştığı ârızî hallere (zaruret ve meşakket gibi) bağlı olarak aslî hükmü terk etme imkânı veren geçici hükümlerdir. Mebsût adlı eserde ruhsat hükmü olarak; sırta secde etmek, mesh yapmak, korku namazı kılmak, yolculukta oruç tutmak, yolcunun ve hastanın Ramazan ayında oruç tutmaması, hastalık halinde oruç tutmak, Ramazan hilalini gökyüzü kapalıyken gördüğüne dair tanıklık etmek, hayızlı kadının veda tavafı yapması, şeytan taşlama da üç gün zevalden önce taş atmak, av hayvanı ile hareme girmek, harem de ot koparmak ve diken kesmek, ihramlı iken kadına yaklaşmak, lukata, selem akdi, alışverişte arâyâ, kadıların tanığa hatırlatmada bulunması, kadıların defterinde tanıklık yazılı bulunması, su kullanma ruhsatı, zaruret durumunda içki içmek ve haram et yemek, ikrah, dilenmek, az ile yetinmek şeklinde yirmi iki hüküm tespit edilmiştir. Serahsî bu hükümleri mezheplere göre tahlil etmiş, sistematik ve felsefi bir yaklaşımla ele almıştır. Ruhsat ile ilgili hükümleri ayet ve hadislerle desteklemiş, mezheplerin görüşlerini tarafsız bir şekilde tahlil etmiştir."
