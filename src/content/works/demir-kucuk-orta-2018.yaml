abstract: "Ülke ekonomimizin omurgasını oluşturan KOBİ'ler, istihdam, katma değer, yatırım ve ekonomik büyümenin en önemli iktisadi aktörleri olarak ekonomik sistemde hayati öneme sahiptir. İktisadi gelişmenin ve istikrarın sağlanması için KOBİ'lerin doğru bir şekilde örgütlenmesi, desteklenmesi ve büyütülmesi hedeflenmektedir. KOBİ'ler hakkında yapılan analiz ve araştırmalarda finansman sorunlarının, gelişimleri önündeki en önemli problem olduğuna işaret edilmektedir. Mali sorunları nedeniyle güçlü ve sağlam yapıya sahip olmayan KOBİ'ler kırılgan mali bünyeleri ile ekonomik kriz ve dar boğaz dönemlerinde kapanma, küçülme ve tasfiye tehlikesine maruz kalmaktadır. KOBİ'lerin finansal sorunların çözümü için geleneksel borçlanma esaslı finansman teknikleri yerine riskin paylaşımını esas alan ve kâr/zarar ortaklığına dayalı girişim sermayesi fon yaklaşımı ne ölçüde çözüm getirebilir? Çalışmamızda bu sorunun cevabı aranarak katılım bankacılığı ile entegre bir finansman modelinin ortaya konulması hedeflenmiştir. Girişim sermayesi konusunda yapılan literatür taramalarında dünyada yeknesak bir teorik alt yapı olduğu ve uygulamaların önemli oranda benzerlikler taşıdığı görülmüştür. Sistemin ortaklık esası ile çalışmasına bağlı olarak gerek batı gerekse İslam ülkeleri uygulamalarında faiz dışı bir gelir yöntemine bağlı olarak benzer çalışma sistemine sahip olduğu görülmüştür. Fonlama tekniğinin genel kabul görmesi ve iktisadi disiplinlerce uygulanabilir ilkelere sahip olduğu dikkate alındığında girişim sermayesi yaklaşımının evrensel bir finansman tekniği olarak geliştirilebilir ve uygulanabilir bir yaklaşımdır. Modelin reel üretime dayanan ve ekonomiye doğrudan katma değer sağlayan yöntemi ile sosyal refah artırıcı etkisi oldukça yüksektir. Etik ve sosyal prensiplerle uyumlu çalışan girişim sermayesi modeli, ortaklığın kazancı ile değer ve gelir üreten, birlikte kazanç ilkesi ile tüm tarafların riske birlikte maruz kaldığı yaklaşımdır. Güç birliği ve paylaşımın getireceği ortaklık başarısı tüm taraflara fayda ve kazanç sağlayabilme potansiyeline sahiptir. Girişim sermayesi modelinin katılım bankacılığı ilke ve normlarına uyumu analiz edilerek, katılım bankacılığına uyumlu girişim sermayesi yatırım fonlarının geliştirilmesi ve model olarak sunulması amaçlanmıştır. Yöntem olarak fon ihtiyacı olan firmalar, katılım bankaları ve aktif girişim sermayesi şirketleri ile derinlemesine mülakatlar gerçekleştirilmiştir. Ortaya çıkan sonuçlar ile etkin ve özgün bir modelin alt yapısı oluşturulmaya çalışılmıştır. Mülakat detaylarında ülkemize özgü fırsat ve güçlü yönleri olduğu kadar sistemin işlemesine engel teşkil edecek riskler ve tehditlerin varlığı da görülmüştür. Girişim sermayesi yaklaşımı; KOBİ'lerin ihtiyaç duyduğu orta ve uzun vadeli fonu, sermaye aktarımı ve riske katılım esası ile rahatlıkla sağlayabilecek niteliklere sahiptir. Katılım bankaları kuracakları girişim sermayesi fonları ile faizsiz bankacılık ilkelerine göre tasarruflarını değerlendirmek isteyen fon sahiplerinin birikimlerini doğrudan ihtiyaç sahibi nitelikli KOBİ'lere aktarılabilecektir. Yatırımların finansmanı için sağlanacak uzun vadeli fonlar ile ihtiyaç duyulan yatırım ve büyümenin kaynağını temin edilebilecektir. Ortaklık esası ile çalışan ve katılım bankacılığı işlemlerinin esas odağını oluşturan bir finansman yöntemini aktif hale getirerek, geleneksel finans yöntemleri karşısında sosyal refaha ve ekonomik gelişmişliğe katkı ve doğrudan üretime katılmak suretiyle ülkemizdeki ve yurt dışından sağlanacak fon kaynaklarının reel mal ve hizmetlere dönüşmesi mümkün olabilecektir."
