title: "Küçük ve Orta Büyüklükteki İşletmelerin (KOBİ) Finansal Problemlerin Çözümünde Girişim Sermayesi Fonlarının Önemi ve Rolü: Katılım Bankacılığına Yeni Bir Model Önerisi"
titleTranslation: {"en": "The importance and role of venture capital funds in the solution of small and medium-sized enterprises (SME) financial problems: A new model recommendation to participation banking"}
