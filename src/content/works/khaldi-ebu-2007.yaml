abstract: "Yahya b. Ömer'in (ö. 289/901) ?Ahkâmu's-sûk?, ?Akdiyetü's-sûk?, ?en-Nazaruve'l-ahkâm alâ es'âri'l-müslimîn fi'l-mevâzîn ve'z-zîbât ve cemî'i ahvâli esvâki'lmüslimîn?,?el-Kavlu fîmâ yenbegî en-nazaru fîhi mine'l-esvâk? adlarıyla anılan kitabıhisbe müessesesi ve slam hukukunun piyasa ile ilgili kısmı için en eski ve önemliyegane kaynak olarak degerlendirilir. Müellif bu eserinde kendi dönemindeki ticarimuamelelerden bahsetmis, bunlarla alakalı fıkhi meseleleri soru cevap teknigiyle elealıp incelemistir. Soruyu soran bazen ögrencileri el-Kasrî, bn Sibl iken bazen Kayrevânçarsısı ile Tunus'un Sûse çarsısının mesul kisileri ile baskaları da olabilmektedir.Ayrıca söz konusu kitap müellifin yasadıgı dönemde Magrip ve Endülüs'te enönemli okul sayılan Magrip Fıkıh Medresesi'nin görüslerini yansıtan bir aynakonumundadır. Zira kitapta mam Mâlik'ten ve Mâlikî mezhebinin bnü'l-Kâsım,Esheb, Asbag ve Sahnûn gibi önemli simalarından çokça nakiller bulunmaktadır. Bununyanında Kâdî bn Tâlib'in fetvalarına da yer verilmis ve bunlar onaylanmıstır. Kitap birbaska açıdan da müellifin yasadıgı dönemdeki sosyal ve ekonomik hayatı gösteren birayna sayılabilir.Kitabın dili oldukça açık ve akıcıdır. Genellikle meselelerin delillerine istermezhep (Mâlikî mezhebi) içi ister mezhep dısı olsun fıkhi münakasalara yerverilmemistir. Zira soru soranlar yalnızca sordukları sorunun dini bakımdan netcevabını aradıkları için buna ihtiyaç olmamıstır.Müellif ticari muamelelerin sadece hükmünün belirtmekle yetinmemis konununahlaki boyutundan da bahsetmistir. Aldatma, ölçüde eksiltme ve garar bunlar arasındasayılabilir. Böylece kendisine arzedilen meselelerin hem dini hem de ahlaki boyutunu2ele alan bir üslup kullanmıstır.Tezimizde yöntem olarak öncelikle kitap üzerine Fıkhî bir inceleme yaptık.Daha sonra ilmî bir sekilde eseri tahkik ettik. Bu tahkikte okuyanların konuları rahatçaanlayabilmeleri ve eserden azamî ölçüde istifade edebilmeleri için kitapta yer alanmeselelerin baska mezheplerde ve kaynaklardeki hükmüne, hadislerin tahricine ve özelisimlerin izahına da yer verilmistir."
