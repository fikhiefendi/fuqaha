abstract: "Bu doktora tez çalışması, H. 3'inci ve 4'üncü asırlarda yaşamış olan Ebû Mansûr el-Mâtürîdî'nin (ö.333/944) usûl-i fıkıh görüşlerini ortaya koymayı hedeflemiştir. Mâtürîdî, fıkıh usûlünün teşekkül döneminde yaşamış usûlcülerden biridir. Mâtürîdî, kelâmcı ve müfessir kimliğiyle tanınmış ve bu yönleriyle şöhret bulmuş olmakla birlikte, fakih ve usûlcü yönü, müteahhirûn âlimler nezdinde hak ettiği ölçüde bir şöhrete nail olamamıştır. Onun Meʾâhizü'ş-şerâiʿ ve Kitâbü'l-Cedel adlı eserlerinin kaybolmuş olması, usûl-i fıkıh ilmi için büyük bir kayıptır, onun Teʾvîlâtü'l-Kurʾân ve Kitâbü't-Tevhîd adlı eserleri ile Hanefî usûl literatüründe nakledilen görüşleri, Mâtürîdî'nin usûlî düşüncesine dair kapsamlı bilgileri ihtiva eden kaynaklar olarak kabul edilmektedir. Bu çalışmada, Mâtürîdî'nin usûl-i fıkha dair görüşleri zikredilmiş, diğer mezheplerden kendisine muhalif düşen görüşler ve bunların öne çıkan delilleri beyan edilmiş, ardından tercih edilen görüş ortaya konulmuştur. Çalışma, bir giriş, üç ana bölüm ve bir sonuç kısmından oluşmaktadır. Birinci Bölüm: Mâtürîdî'nin yaşadığı çağa genel bir bakış, hayatı ve eserleri ele alınmıştır. İkinci Bölüm: Ebû Mansûr el-Mâtürîdî'nin usûle dair görüşleri incelenmiştir. Üçüncü Bölüm: Mâtürîdî'nin usûl-i fıkıh görüşlerinin sonraki dönem usûl âlimleri üzerindeki tesiri ve bu görüşlerin fürû-i fıkha olan etkisi analiz edilmiştir. Bu çalışma, Mâtürîdî'nin ilmî şahsiyetinin yalnızca akâid ve tefsir sahalarıyla sınırlı olmadığını, aksine başta usûl-i fıkıh olmak üzere çeşitli şer'î ilimleri de kapsayacak şekilde geniş bir yelpazeye yayıldığını ortaya koymuş ve onun bu alandaki konumunu (ve katkılarını) ispat edilmektedir. Ayrıca çalışma, Mâtürîdî'nin Hanefî geleneğine olan güçlü bağlılığının yanı sıra, fıkıh usulüne dair bazı meselelerde kişisel içtihatlarda bulunduğunu da ortaya koymaktadır. Yine çalışma, onun istidlâl ve nazar (delillendirme ve teorik düşünce) süreçlerinin kurallarına büyük önem verdiğini ortaya koymaktadır."
