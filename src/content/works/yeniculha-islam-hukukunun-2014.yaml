abstract: "İslam hukuku dersleri üniversitelerde yıllarca klasik yöntemlerle öğretilmiştir. İslam hukuku dersi öğretmen merkezli bir sistemle okutulmakta, öğrencinin derse katılımı en az düzeyde olmaktadır. Bu yöntemle, öğrencinin derse ilgisi azalmakta, konuları öğrenme yerine sınavdan geçer not alarak günü kurtarma hesabı yapmaktadır. Probleme dayalı öğrenme öğrenci merkezli bir sistem olduğu için, öğrenciler okuma ve araştırmada daha aktif bir rol üstlenmekte ve öğrenmeyi öğrenmektedirler. İslam hukuku derslerinin bu yöntemle işlenmesiyle öğrenciler İslam hukuku bilgilerini güncel olaylarla ilişkilendirerek daha iyi anlamakta ve karşılaştıkları olayları İslam hukuku açısından yorumlayabilme yeteneklerini geliştirebilmektedirler. Bu çalışmanın amacı, İslam hukukunda yenilikçi öğrenme stratejilerinden birisi olan probleme dayalı öğrenme yaklaşımını incelemektir. Bu yöntem sayesinde öğrencilerin pratik problem çözme yeteneklerini geliştirmeleri beklenmektedir."
