abstract: "Hukuk ve Mantık İlişkisi Kapsamında Mecelle'nin Bazı Kanunlarının Mantık Açısından Değerlendirilmesi adlı bu çalışmada amaçlanan mantığın hukuktaki yeri ve öneminin örneklerle gösterilerek çıkarımlar yapılmasıdır. Bu amaca ulaşırken ise izlenen yöntemde ilk olarak bir yasa kitabı olan Mecelle-i Ahkâm-ı Adliyye yapısı ve özellikleri bakımından incelenmiştir. İkinci olarak ise bağdaştırılacak olan mantık alanının terimsel tanımı, tarihçesi, yöntem ve ilkeleri detaylı bir şekilde ele alınmıştır. Son olarak ise Mecelle'den mantıksal açıklamalar içeren maddeler belirlenmiştir ve mantığın ilke ve kurallarına göre açıklanmıştır."
