abstract: "Alevî-Bektaşîlik, üzerinde çeşitli spekülasyonlar yapılan, ideolojik ve siyasî tartışmaların odağında yer alan bir konudur. Toplumun gündemini bu kadar çok meşgul eden bir düşünce yapısının temel kaynaklarında yer alan ve İslam Hukukuyla ilgili bilgileri, objektif şekilde ve yorumlamalardan kaçınarak ortaya koymak oldukça önemli ve gereklidir. Bu çalışma da, Alevî-Bektaşî geleneğinin temel kaynaklarında yer alan fıkhî bilgi ve görüşleri ilmî bir usulle bir arada toplama amacıyla gerçekleştirilmiştir.Alevî-Bektaşîliğin kaynakları fıkhî açıdan incelendiğinde, bu geleneğin ileri gelenleri ve mensuplarının Ehl-i Sünnet-Hanefî mezhebini benimsedikleri görülmektedir. İbadetlerini bu mezhebin görüşlerine göre eda ettikleri ve muamelat ile ilgili meselelerde de yine bu mezhebe göre hareket ettikleri sonucu ortaya çıkmaktadır. Dolayısıyla İmamiyye mezhebi ile ilgili görüşler, Hacı Bektaş-ı Veli'nin yaşadığı dönem, Bektaşî tarikatının kurulma aşaması ve bu tarikatın ilk dönemleri itibariyle Alevî-Bektaşî geleneği içerisinde mevcut değildir. Binaenaleyh İmamiyye ile ilgili görüşlerin sonraki dönemler itibariyle bu geleneğe girmiş olduğu ve bu mezhebe aidiyet ile ilgili söz konusu söylemlerin sadece sözde kalan ve uygulama alanı bulmayan söylemler olduğu anlaşılmaktadır."
