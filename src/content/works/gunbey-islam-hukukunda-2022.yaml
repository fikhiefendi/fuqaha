abstract: "İslâm dini insanın ferdî ve ictimaî hayatının bütününü kapsayacak şekilde düzenlemeler getirmiş, bununla kişiyi Allah'ın razı olduğu bir hayat yaşamaya sevk etmek ve kişinin hem dünya hem de ahiret mutluluğunu kazanmasını istemiştir. Öyle ki bu düzenlemeler çocuğun anne karnına düşmesinden hayatın sonuna kadar hatta ondan sonrasını bile içine almaktadır. Aile ile ilgili nikâh, mehir, talâk, iddet gibi konular da bu düzenlemeler arasındadır. Aile olmak, cinsel arzu ve ihtiyaçlarını meşru´ şekilde karşılamak, gelecek için hayırlı nesiller yetiştirmek kastıyla kadın ve erkeğin nikâh bağıyla bir araya gelmesi demektir. Aile olmak sorunsuz, problemsiz, her şeyin mükemmel olduğu bir yapı demek değildir. Önemli olan bu problemlerin halledilmesi ve aile birlikteliğinin devam etmesidir. Ancak bazen eşlerin evlilik hayatını bu problemler veya farklı nedenlerle sonlandırmak istemesi de bu hayatın bir gerçeğidir. İslâm hukukunda eşler arasında geçinmenin mümkün olmadığı, evliliğin kişilere ve topluma zarar verdiği durumlarda boşanma meşru´ bir yol olarak görülmüştür. İslâm dini talâk hakkını da normalde erkeğe vermiş, erkeğin boşamaya yanaşmadığı ve kadın tarafından evliliğin devamı istenmediği hallerde de bir bedel karşılığında veya hâkim kararıyla boşanmaya izin verilmiştir. Bu çalışmada talâk kavramının tanımı, meşru´ oluşunun delilleri, boşayan ve boşanan açısından şartlar, talâkın çeşitli açılardan sınıflandırılması ilk bölümde, devamında talâkla ilgili kavramlar; tefvîz, tefrik, fesih, îlâ, liân ve zıhâr konu bütünlüğü sağlanması ve okuyucunun zihninde soru kalmaması için yine birinci bölümde ele alınmaktadır. İctihad farklarının geçmişte olduğu gibi günümüz insanının sorunlarına çözüm sunan bir rahmet olduğu bilinciyle ikinci bölümde Hanefî ve Şâfiî mezhebi arasında talâk ile ilgili meseleler iki ekolün kendi kaynaklarından delilleriyle ele alınmaktadır. Ayrıca bazı durumlarda diğer ekollerin ve fakihlerin görüşüne de günümüzdeki problemlere çıkış yolu sunduğu için yeri geldiğinde değinilmiştir."
