abstract: "Toplumumuzdaki pek çok maddi ve manevi problem İslam'ın aile ile ilgili emir ve tavsiyelerini bilmemek veya uygulamamaktan kaynaklanmaktadır. Eğer aileyi oluşturan karı ve kocalar İslam'ın bu konudaki emir ve tavsiyelerine uyarlarsa mutlu bir aile hayatına kavuşur, dünya ve ahiret seâdetine erişebilirler. Mutlu bir aile hayatının ön şartı dindar bir eş seçerek aile kurmaktır. Geçici nikah aile ve toplum için bir felakettir. Karı ve kocalar aralarındaki problemlerin çözümünde de İslam'ın tavsiye ettiği şekilde hareket etmelidirler. Eşler İslam dininin kendilerine emrettiği görevleri yerine getirmeli, birbirlerine karşı sevgi ve saygı içinde olmalıdırlar. İyi bir aile hayatı yeni yetişecek nesil için de gereklidir. Zira başarılı nesiller ancak mutlu ailelerde yetişebilir. Kadınların ev içinde bir takım görevleri vardır. Kadınlar bunları yerine getirmekten imtina etmemelidirler. Kadınlar eşlerine sadık olmalı ve kocalarından ilgilerini esirgememelidirler. Ve son olarak da kadınların peygamberimize yaptığı bey'atı kendilerine örnek almalıdırlar."
