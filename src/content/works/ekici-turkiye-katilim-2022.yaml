abstract: "Bankacılık sektöründe, katılım bankalarının fon toplama ve fon kullandırma metoduyla uyguladığı katılım finans ürünlerinin, reel sektörde kullanılması ile diğer bankacılık türlerinden ayrılarak yeni bir iktisadi model olarak ifade edilmesi mümkündür. Katılım bankacılığı, işleyişi bakımından konvansiyonel bankacılıktan ayrı bir tür gibi değerlendirilse de aslında iki bankacılık çeşidi de aynı sektörde işlem görmektedir. Bu sebeple çalışmamızda bulunan tablo ve grafikler incelediğinde birbirine çok uzak olmayan sonuçlara ulaşıldığı görülmektedir. Katılım bankalarının küresel alanda gösterdiği performans ile Türkiye'deki katılım bankalarının performansları değerlendirilmiştir. Bankaların sergilediği finansal performans, önemini korumakla beraber günümüzde finansal olmayan, çevresel ve sosyal performans da bankanın itibarı, paydaşlara karşı hesap verebilirlik ve şeffaflığı açısından önemli bir konuyu temsil etmektedir. Dünyamızın geleceği için küresel olarak, sanayileşmenin sonucunda ortaya çıkmış, sadece ekonomik kazanımlara değer veren doğrusal ekonomiden, orta ve uzun vadede çevresel ve sosyal kazanımları da önemseyen döngüsel ekonomiye geçişten bahsedilmektedir. Borsa İstanbul tarafından, sürdürülebilirlik konusuna dikkat çekmesi amacıyla BIST Sürdürülebilirlik Endeksi açılmıştır. Bu endekste yer alan bankaların sürdürülebilirlik performanslarını değerlendirmek için, çalışmamızda Veri Zarflama Analizi kullanılarak uygulama yapılmıştır. Katılım bankaları içerisinde Albaraka Türk, endekse dahil olan ilk ve tek katılım bankası olma özelliğini taşımaktadır. Bankacılık sektörü açısından baktığımızda, sektörün %17'sinin bu endekste yer aldığı düşünüldüğünde önemli bir başarı olarak değerlendirilmektedir. Çevresel, Sosyal ve Yönetim (ESG) açısından sürdürülebilirlik konusuna daha fazla önem gösterilmesi ile dünya ve ülkemizdeki uygulamaların artırılması, öneminin de toplumsal açıdan kavranmasını sağlanmak gerekmektedir. Kamuoyunda, BIST Sürdürülebilirlik Endeksinde bulunmanın önem ve değerinden bahsederek gündem oluşturulması ve daha fazla işletmenin bu ve bunun gibi sürdürülebilirlik faaliyetlerine katılması gerekmektedir. Çalışmamızın gelecekte araştırmacıların başvurabileceği, özgün bir kaynak olarak literatürde yer alması hedefler arasındadır. Katılım bankacılığının, dünyada yaklaşık olarak 60 yıllık, Türkiye'de ise ortalama 30 yıllık geçmişi bulunmaktadır. Katılım bankacılığı alanındaki çalışmalar geçmişten beri var olmasına karşın, ayrı bir dal olarak incelenmeye son yıllarda başladığından, yapılan çalışmanın bilimsel, kültürel ve ekonomik olarak toplumun yapısına ışık tutması beklenmektedir."
