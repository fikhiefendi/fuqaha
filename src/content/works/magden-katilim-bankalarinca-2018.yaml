abstract: "Finansal ihtiyaçlarını İslam hukuku ilke ve kurallarına göre karşılamak isteyen ve bu nedenle İslami finansın en önemli özelliği olan faiz yasağından kaçınmak isteyen kişi ve kurumlar, mevduat bankalarıyla sözleşme kurmaktan çekinmektedir. Ancak artan insan ihtiyaçları İslam'daki faiz yasağını gözeten kişi ve kurumları mevduat bankacılığı kredilerine alternatif olacak yöntemler aramaya sürüklemiştir. Bu kapsamda tüm dünyada İslami bankalarca mevduat bankacılığı kredilerine alternatif olarak kullanılan“murabaha”yöntemi Türk katılım bankacılığı uygulamasında kurumsal ve bireysel finansman desteği sözleşmesi olarak yer bulmuştur.“Murabaha”sözleşmesi klasik anlamıyla satıcının malın fiyatının veya maliyetinin üzerine belli bir kâr koyarak ve bu kârı alıcıya bildirerek yaptığı satışı ifade etmektedir. Modern anlamda“murabaha”sözleşmesi ise finansman sağlayan kurumun, alıcı tarafından sipariş edilen malı peşin fiyatı üzerinden satın alarak, alıcıya vadeli fiyat üzerinden sattığı sözleşmedir. Günümüzde“murabaha”sözleşmelerinde süreci pratik hale getirmek isteyen katılım bankaları“vekalet”yöntemini uygulamaktadır. Söz konusu yöntemde banka, müşteriye istenilen malın satın alınması için İslam hukuku anlamında vekalet verir. Bu özellikleriyle Türk hukukuna göre bir sui generis bir sözleşme olan finansman desteği sözleşmesi şüphesiz ki diğer banka kredileriyle ilgili kural ve sınırlamalara tabidir. Bu çalışmada da finansman desteği sözleşmesi tüm yönleriyle incelenmeye, sözleşmenin mevduat bankacılığı kredileriyle benzer ve farklı yönleri ortaya koyulmaya çalışılmıştır."
