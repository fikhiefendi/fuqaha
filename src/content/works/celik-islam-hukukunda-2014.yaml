abstract: "İslam Hukukunda Hısımlık Nafakası Mükellefiyetinde Din Farkı adlı bu çalışma bir giriş, iki bölüm ve sonuç kısmından meydana gelmektedir. Giriş kısmında konunun önemi, sınırlandırılması, sunulması ve kullanılan kaynakların değerlendirilmesi hakkında genel bilgiler verilmiştir. Birinci bölümde hısımlık nafakasının mâhiyeti, hukuki dayanağı, hukuki vasıfları ve uygulama alanı ile hısımlık nafakası alacaklısı ve borçlusunda aranan şartlar ve Türk Medenî hukukunda hısımlık nafakasının mâhiyeti ve uygulama alanı ile ilgili bilgiler sunulmuştur. İkinci bölümde öncelikle din farkı kavramı ve din farkının İslam aile hukukundaki etkileri hakkında genel bilgiler sunulduktan sonra, din farkının usûl ve fürû arasındaki nafaka mükellefiyetine etkileri, usûl ve fürû hısımları arasındaki nafaka mükellefiyetinde zimmî ve harbî olmanın etkileri, Müslüman ve mürted arasındaki nafaka hukuku ile ilgili bilgi verilip en son civar hısımlar arsındaki nafaka mükellefiyetinde din farkının etkileri açıklanmıştır. Sonuç bölümünde ise, konuyla ilgili genel bir değerlendirme yapılarak, ulaşılan netice belirtilmiştir."
