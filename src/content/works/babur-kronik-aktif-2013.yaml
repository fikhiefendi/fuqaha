abstract: "Giriş ve amaç: Total serum adiponektin seviyelerinin hepatit c virus (HCV) genotip 4 ile en fekte hastalarda antiviral tedaviye yanıtta iyi bir prediktif faktör olduğu bildirilmektedir. Biz HCV genotip 1 ile enfekte 80 hastada 48 haftalık antiviral tedavi başarısı ile tedavi öncesi serum total adiponektin, leptin, insülin direnci (HOMA skorları) ve vücut kitle indeksi (VKİ) dahil olmak üzere çeşitli metabolik faktörlerin ilişkisini araştırmayı amaçladık. Gereç ve Yöntem: Tedavi sonrasında hastaların 43 tanesinde kalıcı virolojik yanıt elde edilerken 37 hastada kalıcı virolojik yanıt yoktu. Ayrıca tedavi öncesi HCV RNA ve serum ferritin düzeyi, modifiye İshak skorlamasına göre hepatik aktivite indeksi / karaciğer fibrozis skorları ve kalıcı virolojik yanıt ile ilgili hepatobiliyer fonksiyon testleri gibi diğer laboratuvar parametreleri değerlendirildi. Bulgular: Kalıcı virolojik yanıt elde edilen ve edilemeyen grup arasında yaş ve cinsiyet açısından fark yoktu. Ortalama serum HOMA skoru ve vücut kitle endeksi kalıcı virolojik yanıt elde edilemeyen grupta, kalıcı virolokik yanıt elde edilen gruba göre anlanmlı olarak daha yüksek olarak bulundu (p 0.05).Univaryant analizde yaş, trombosit düzeyleri, fibrozis skorları, HOMA skorları, bazal HCV RNA düzeyleri, serum ferritin düzeylerinde kalıcı virolojik yanıt gelişimi açısından istatistiksel olarak anlamlı fark varken, multivaryant analizde kalıcı virolojik yanıt gelişimi ile ilgili olarak sadece trombosit düzeyleri ve tedavi öncesi fiboris skorları istatistiksel olarak anlamlı saptandı. Ayrıca serum adiponectin ve leptin seviyeleri ile fibrozis skoru ve veya insülin rezistansı arasında korelasyon yoktu. Sonuç: HCV genotip 1 ile enfekte olgularda antiviral yanıt ve hepatik histoloji ile hastaların bazal serum total adiponektin ve leptin seviyeleri arasında anlamlı bir ilişki saptanmamıştır."
