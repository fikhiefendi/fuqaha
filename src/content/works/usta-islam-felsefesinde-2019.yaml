abstract: "On birinci asırda yaşamış olan İslam fakihi ve yaşamış olduğu dönemin etkili bir siyasi karakteri olan Ebü'l-Hasan Ali b. Muhammed b. Habîb el-Basrî el-Mâverdî (M.974, H.364)'nin, ahlâk ve siyaset görüşleri aynı zamanda siyaset-ahlâk ilişkileri nasıl olması gerektiği konusundaki düşünceleri incelemeye değer bir şahsiyettir. Mâverdî, Tefsirci, Edebiyatçı, Siyasetçi, Hukukçu bir âlimdir. Şafi âlimi olarak bilinen İmam Mâverdî yaşamış olduğu asırda fikir üreterek ortaya koyduğu görüşlerle döneminde oluşmuş olan problemlere çözüm aramaya çalışmıştır. Fikirlerini beyan ederken genellikle dört mezhebin fıkhî görüşlerini tarafsız olarak vermiş olan Mâverdî tartışma bulunan ihtilaflı konularda Şafi Mezhebinin görüşlerini kabul etmiştir. Fikir ve düşüncelerini yaşamış olduğu dönemde tam olarak hayata geçirebilmiş olmasa da Mâverdî daha sonraki dönemlerde din-siyaset ahlâk-siyaset ilişkileri açısından çokça incelenmiş ve ortaya çıkmış olan siyasi düşünce tarihinde kendisine önemli bir yer bularak ışık tutmayı başarmıştır. Mâverdî günümüzde siyasi ahlâki ve siyasi görüşleriyle yaşamayı başaran bir İslam fakihi, İslam siyaset düşüncesinin yazılı olarak ilk temellerini atan ve İslam siyaset düşüncesini ortaya koyan ilim adamıdır. Biz de bu çalışmamızda İslâm siyasî düşünce tarihi içindeki devrinin önemli şahsiyeti olan ve ortaya koyduğu görüşlerle Selçukluların yönetim düşüncesine etki eden, dönemin sosyal, kültürel ve siyasal birikimlerini yansıtan Mâverdî'nin ahlâk ve siyaset anlayışını ele almaktayız. Mâverdî'nin siyaset anlayışını büyük ölçüde yansıtan“Ahkâmü's- Sultaniyye”ahlâki görüşlerini yansıtan“Edebü'd-Dünya ve'd-Din”eserlerini merkez alarak ulaşabildiğimiz tüm eserlerini incelemeye çalıştık. Bu incelemeyi yaparken de müellifin devletin varlık gayesi, etkin bir yönetimin nasıl olacağı, devlet başkanında bulunması gereken temel özelliklerin neler olduğu, ahlâkın amacı, ahlâk hakkındaki düşünceleri, ahlâki görüşlerini inceleyerek ahlâk ve siyaset hakkındaki görüşleri açıklanmıştır."
