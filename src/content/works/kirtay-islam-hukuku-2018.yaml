abstract: "İslâm hukukuna göre nikâh birbirleriyle evlenmelerinde herhangi bir mâni bulunmayan bir erkek ile bir kadının kendi iradeleriyle ortak bir hayat kurmak üzere yaptıkları akittir. Nikâh akdinin unsurları, evlenme isteğinde bulunan kadın ve erkeğin hazır bulunması ve irade beyanında bulunmalarıdır. Nikâh akdini oluşturan eda ehliyeti, meclis birliği, sürekli ve geçici evlenme engellerinin bulunmaması türünden şartların mevcut olması gerekir. Kuruluş aşaması gerçekleşen bir nikâh akdinin geçerli olması için bu akdin şahitlerin huzurunda ve tarafların irade hürriyetleriyle kurulması gerekir. Aksi takdirde yapılan nikâh akdi fâsid olur. Medeni hukuka göre evlenme bir medeni hukuk sözleşmesidir. Evlenme ehliyeti taşıyan kadın ile erkek hür iradeleriyle ve yetkili kılınmış memur önünde evlenme beyanında bulunurlar. Nikâh akdinin tarihsel süreç içerisindeki uygulamaları incelendiğinde, Türkiye'de Cumhuriyet'in kuruluşuyla beraber Batı'dan bir takım kanunların ihdas edilmeye başlanması bir dönüm noktası olmuştur. Bunlardan biri de Medeni Kanun'dur. Yürürlüğe giren bu kanundaki aile hayatı ile ilgili bazı uygulamaların toplumun dini hassasiyetleriyle örtüşmemesi halkı imam nikâhı uygulamasına zorlamıştır. Ayrıca cari hukukta kanuni nikâhın hükmü geçerli olduğundan sadece imam nikâhı ile yapılan akitlerde hukuk kurallarının işlemediği ve bu durumdan da en çok çocuk ve kadınların mağdur olduğu bilinen bir gerçektir. Dolayısıyla hem halkın dini hassasiyetlerinin dikkate alındığı hem de hukuki karşılığının olduğu bir çözüm yolu bulunarak aile hayatını olumsuz etkileyen resmi nikâh-dini nikâh ikileminin yol açtığı sorunlar ortadan kaldırılabilir."
