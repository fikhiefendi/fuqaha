abstract: "Şerʿiyye sicilleri kayda alındıkları dönemde devletin sosyal, ekonomik ve siyasal yapısını ortaya koyan belgeler arasında önemli bir yer tutmuşlardır. Defterler günlük olayları ilgilendiren davalar, başkent ile yapılan yazışmalar, şikâyet ve atamalar gibi belgeleri içerir. Ayrıca şerʿiyye sicilleri, Osmanlı Devleti'nin o dönemdeki durumu ile Kadılık makamının toplum ve devlet nezdindeki konumu hakkında bizlere bilgi veren esaslı bir kaynak niteliğindedir. Tarihi olayları incelemek ve yorumlamak bakımından şerʿiyye sicilleri bu yönü ile ayrıca bir önem kazanmaktadır. Bugüne kadar birçok şerʿiyye sicili bu özelliklerden dolayı üzerinde çalışılmaya değer görülmüştür. Biz de konumuz olan“Hicri 1147-1148 Miladî 1734-1735 tarihli R52 Numaralı Rusçuk Şer`iyye Sicili Transkripsiyonu ve Değerlendirilmesi”adlı çalışmamızla bu sahada yapılmış olan çalışmalara bir katkı ve aynı zamanda kaynak olmayı amaçladık. Defterde ana konulardan birini İran Seferi hazırlıkları ve lojistik faaliyetleri için İstanbul ile yapılan yazışmalar oluşturmaktadır. Bunu sosyal hayatta karşılaşılan meseleler ile ilgili davalar avârız kayıtları ve terekeler takip etmektedir. Bu bağlamda Rusçuk şehrinin XVIII. yüzyılın ilk yarısındaki sosyal ve ekonomik durumu ve askeri hazırlıkları hakkında bilgiler ve analizler sunulmuştur."
