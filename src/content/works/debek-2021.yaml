abstract: "İmam Malik b. Enes meşhur, kadîm fıkıh ve hadis alimlerinden biridir. Medine'de dünyaya gelmiş ve hayatının tamamını Medine'de geçirmiş, tabiînden pek çok alimden ders alması sebebiyle zamanındaki farklı bir şahsiyettir. İmam Malik ismi genellikle şaheseri Muvatta ile birlikte anılmıştır. Muvatta adlı eser, ilim dünyasında takdirle karşılanmış, çok değerli bir hadis kaynağıdır. Ancak İmam Malik'in Muvatta dışında da pek çok rivayetleri bulunmaktadır. İmam Malik'in Muvatta adlı eserinin şerhleri, bu eserdeki fıkhî ictihad ve istinbatlar ve Muvatta'ın farklı rivayetleri konusunda onlarca eser telif edilmişken, Muvatta dışındaki rivayetlerinin derlenmesi, değerlendirilmesi ve bu rivayetlerin Muvatta'a alınmama sebepleri ilmî araştırmaya değer önemli konulardan biri olduğu halde üzerinde pek fazla durulmamıştır. Ancak İmam Malik'in Kütüb-i Sitte'den rivayet edilen, ama Muvatta'ın bize ulaşan hiçbir nüshasında bulunmayan rivayetleri hakkında Ebu'l-Kâsım el-Cevherî (ö.381/960), Dârekutnî (ö.385/964), İbn Abdilberr (ö.463/1042), Ebu'l-Velid Bâcî (ö.474/1082) gibi ilim erbabının önemli değerlendirmeleri bulunmaktadır, İmam Malik'in bazı rivayetlerinin Muvatta'da yer almaması, senedindeki bazı ravilerin tenkid edilmeleri veya meçhul olmaları gibi sebeplerden kaynaklandığı gibi; Muvatta'a alınmayan hadisle amel edilmemesi, hadisin mensûh olması, hadisin ehl-i Medine'nin ameline muhalif olması veya başka tercih sebeplerinden kaynaklandığı görülmektedir. İmam Malik'in Muvatta dışındaki rivayetlerinin özel olarak birer birer incelenmesi, ilim dünyası için anlamlı bir çalışma olacak, daha önce bu denli ayrıntılı bir şekilde araştırılmamış olan bu konunun ele alınması, İmam Malik'in hadis tenkidindeki müstesna yeri ve fıkhî derinliğine ışık tutacaktır."
