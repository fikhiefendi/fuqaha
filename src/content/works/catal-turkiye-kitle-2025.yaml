abstract: "Bu tez çalışması, Türkiye'de kitle fonlama projelerine yatırım yapan bireylerin davranışlarını, motivasyonlarını ve karar alma süreçlerini incelemeyi amaçlamaktadır. Geleneksel finansman yöntemlerine alternatif olarak gelişen kitle fonlaması modeli, dijitalleşmenin etkisiyle girişimcilik ekosisteminde önemli bir yer edinmiştir. Bu bağlamda çalışmada, yatırımcıların kitle fonlamasına yönelmesinde etkili olan güven, finansal getiri, sosyal etki ve ideolojik motivasyon gibi faktörler analiz edilmiştir. Araştırmanın veri kaynağını, Google Forms aracılığıyla çevrim içi olarak uygulanan anket yöntemi oluşturmaktadır. Anket yalnızca kitle fonlamasına en az bir kez yatırım yapmış bireyleri kapsamış ve 139 katılımcının verileri analiz edilmiştir. İstatistiksel analizlerde betimsel istatistiklerin yanı sıra, faktör analizi, güvenilirlik analizi (Cronbach's Alpha) ve ki-kare testleri kullanılmıştır. Analizler sonucunda yatırımcı davranışlarının dört temel boyutta toplandığı belirlenmiştir: Finansal getiri ve risk algısı, platform ve girişimci güveni, sosyal/ideolojik motivasyonlar ve dışsal sosyal etkiler (sürü davranışı). Katılımcıların yatırım kararlarında güven unsuru belirleyici olurken, İslami finans ilkelerine uygunluk ve yerli/milli üretim gibi değer temelli faktörlerin de önemli rol oynadığı görülmüştür. Buna karşılık, sosyal medya ve çevresel yönlendirme gibi dışsal etkilerin daha sınırlı olduğu tespit edilmiştir. Bu çalışma, Türkiye'de hızla gelişen kitle fonlama sisteminin yatırımcı profiline dair derinlemesine bir bakış sunmakta ve hem akademik hem de uygulayıcılar açısından yol gösterici nitelik taşımaktadır."
