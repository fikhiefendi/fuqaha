abstract: "Bu çalışma, Türkiye'de faaliyet gösteren katılım bankaları ile geleneksel mevduat bankalarının kârlılık ve risk yönetimi perspektifinden karşılaştırmalı bir analizini amaçlamaktadır. Bankacılık sektöründe, finansal hizmetlerin sunulmasında farklı yaklaşımlar benimsenmekte olup, katılım bankaları İslami finans prensiplerine uygun olarak faaliyet gösterirken, mevduat bankaları geleneksel bankacılık modelini takip etmektedir. Bu farklılıklar yalnızca faiz ve kâr payı ayrımı ile sınırlı kalmayıp, fon toplama ve kullandırma yöntemleri, risk paylaşımı, müşteri ilişkileri ve etik ilkeler gibi çok boyutlu unsurları da kapsamaktadır. Araştırmanın ampirik kısmında, 2016-2024 yıllarını kapsayan BDDK ve TKBB verileri kullanılarak katılım ve mevduat bankalarının banka sayısı, şube sayısı, personel sayısı, aktif büyüklük, toplanan ve kullandırılan fonlar, özkaynaklar ve net kârları tablo ve grafikler aracılığıyla analiz edilmiştir. Yapılan değerlendirmeler sonucunda, katılım bankalarının özellikle fon toplama ve kullandırma ile operasyonel büyüme açısından sektörde önemli bir yükseliş sergilediği, kârlılık açısından bazı dönemlerde mevduat bankalarına kıyasla daha yüksek performans gösterdiği, risk yönetimi ve sermaye yeterliliği açısından ise mevduat bankalarına yakın bir düzeyde faaliyet gösterdiği tespit edilmektedir. Çalışma, Türkiye'de katılım bankacılığının geleneksel bankacılık karşısındaki konumunu ve ekonomik sistem içerisindeki rolünü ortaya koymakta, kârlılık ve risk yönetimi göstergeleri açısından yapılan karşılaştırmalar ile yatırımcı ve politika yapıcılar için sektörün dinamiklerini değerlendirme imkânı sunmaktadır. Elde edilen bulgular, katılım bankalarının sürdürülebilir büyüme potansiyeli ve finansal performansının, geleneksel bankacılıkla uyumlu biçimde analiz edilmesinin önemini vurgulamaktadır."
