abstract: "Aile toplumun temelini oluşturduğu için İslam dini aileye büyük önem vermektedir. İslam dininde neslin korunması ve devamının sağlanması ancak sahih bir nikâh akdi ile mümkündür. Nikâh, hem kadına hem de kocaya birtakım hak ve sorumluluklar yüklemektedir. Nafaka da bunlardan biridir. Evlilik neticesinde koca, nafaka borçlusu sıfatını alırken; kadın ise nafaka alacaklısı sıfatını almaktadır. Bu kapsamda koca, kadının yiyecek, içecek, mesken, temizlik gibi temel ihtiyaçlarını karşılamakla yükümlüdür. İslam hukukuna göre kocanın nafaka yükümlülüğü için kadının birtakım şartları taşıması gereklidir. Bu şartlar yerine getirilmediğinde kadın, nafaka hakkını kaybeder. Fakihler tarafından bir kadının nafaka hakkını kaybetmesinin en önemli sebebi nüşûz olarak kabul edilmektedir. Hangi fiillerin nüşûz kapsamında olduğu hususunda fakihler arasında içtihat farklılıkları bulunmaktadır. Evlilik birliği devam ederken erkeğin yerine getirmesi gereken en önemli yükümlülük olan nafaka konusunda eşler arasında bazı anlaşmazlıklar yaşanabilir. Tezimizin konusu, bu türden anlaşmazlıkların neler olduğunun tespiti ve ihtilaf durumunda fakihlerin önerdiği çözüm önerileridir. Çalışmamızda boşanma sonrası kadına ödenen iddet nafakası ve kan bağına bağlı olarak meşru kılınmış olan hısımlık nafakası kapsam dışı tutulmuştur. Tezin amacı evlilik nafakasına bağlı olarak eşler arasında yaşanan ihtilaflar hususunda İslam hukukçularının ortaya koymuş olduğu çözüm önerilerini tespit ederek analiz etmektir. Bunun için doküman analizi yöntemi kullanılmıştır. Bu bağlamda klasik fıkıh eserleri ve modern kaynaklar taranmak suretiyle evlilik nafakası hususunda eşler arasında ihtilaflı olan yirmi iki mesele tespit edilmiş ve bu meseleler tahlil edilmiştir. Sonuç olarak İslam hukukunun uhrevi boyutunun da bulunması nedeniyle bu tür anlaşmazlıkların öncelikle karı koca arasında çözülmesinin fukahâ tarafından tavsiye edildiği görülmüştür. Eşler arasında çözümün imkânsız olduğu durumlarda ise problemin mahkeme yoluyla çözüleceği hükme bağlanmıştır. Bu hükümlerle karşılıklı olarak karı-kocanın haklarının korunmaya çalışıldığı görülmektedir. Bu bağlamda klasik fıkıh eserlerinin nikâh ve talak bölümlerinin muhakeme usulü hususunda da bir veri kaynağı olduğu tespit edilmiştir."
