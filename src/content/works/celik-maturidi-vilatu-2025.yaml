abstract: "İmam Mâtürîdî (ö. 333/944), hicrî üçüncü yüzyılda Türkistan coğrafyasında yaşamış, Ehl-i Sünnet inanç sisteminin bu bölgede yerleşmesinde önemli rol oynamıştır. Semerkant bölgesinde faaliyet gösteren Mâtürîdî, özellikle Ebû Hanîfe'nin görüşlerini benimseyerek ilmî çalışmalarını bu çizgide sürdürmüştür. Müfessir ve kelâm âlimi kimliğiyle ön plana çıkan Mâtürîdî, aynı zamanda fıkıh sahasında da etkili bir isim olmuştur. Özellikle âyetlere getirdiği aklî yorumlarla dikkat çekmiştir. Bu bağlamda,“te'vîl”adını verdiği yöntemi geliştirmiş ve bu metodu ilmî miras olarak sonraki nesillere bırakmıştır. İmam Mâtürîdî, ilerleyen dönemlerde Sünnî İslâm dünyasında geniş kabul görmüş ve itikad alanında en çok takip edilen isimlerden biri hâline gelmiştir. Mâtürîdî'nin birçok eser kaleme aldığı bilinmekle birlikte, günümüze yalnızca iki eseri ulaşabilmiştir. Bunlardan biri kelâm alanında yazdığı Kitâbü't-Tevhîd, diğeri ise tefsir alanındaki temel eseri olan Te'vîlâtü'l-Kur'ân'dır. Bu çalışmada, söz konusu tefsir eseri temel alınarak Nûr Sûresi'nde yer alan ahkâm âyetleri üzerine Mâtürîdî'nin getirdiği yorumlar incelenmiştir. İki bölümden oluşan bu araştırmanın ilk kısmında, İmam Mâtürîdî'nin hayatı, ilmî kişiliği, eserleri, hocaları ve öğrencileri hakkında bilgi verilmiş; ayrıca Mâtürîdî fıkhının genel özellikleri ile Hanefî mezhebine katkıları ele alınmıştır. İkinci bölümde ise Nûr Sûresi'nde yer alan ahkâm âyetleri çerçevesinde Mâtürîdî'nin fıkhî yorumları analiz edilmiş ve bu yorumların Hanefî mezhebine ait hükümlerle olan uyumu ortaya konulmaya çalışılmıştır."
