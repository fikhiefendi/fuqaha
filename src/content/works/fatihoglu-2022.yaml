abstract: "Araştırma, fıkıh meselelerde ihtilaftan çıkış ilkesinin öneminden, gerçekleşmesinin şartlarından, denetimlerinden ve dayanaklarından bahsederek ihtilaftan çıkış kuralı konusunu ele almaktadır. Fıkıhçıların arasında bu ilkeyi benimsemelerinde farklılık olmuştur ve Maliki mezhebi en çok bu kuralı benimsemiş ve doktrinlerinde dayandıkları ilkelerden biri haline gelmiş ve bununla ün kazanmıştır. Bu araştırma, fıkıhçıların ihtilaftan çıkma konusunda koydukları kuralları belirtmiş olup kendi görüşlerinden çıkıp diğer mezheplerin görüşüne tabii olmanın şartlarını ve usullerini ele almıştır. Araştırmada ayrıca bu kuralın fıkhî meselelere etkisine, özellikle Hanefi mezhebinin ibadet bölümünde, fıkıh mezhebinin fakihlerinin görüş ve sözlerine dayanarak, onların tartıştıkları hususlara değinilerek yer verilmiştir. İhtilafı fıkıh kitaplarının tasnifine göre tasnif edilmiştir. Ardından araştırmanın en önemli bulgularından ve bu konunun daha geniş ve kapsamlı bir şekilde incelenmesine katkı sağlayabilecek önerilerden bahsederek araştırmayı sonlandırdım."
