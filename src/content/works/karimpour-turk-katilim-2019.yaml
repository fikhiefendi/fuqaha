abstract: "İran'da son yirmi yılda, özel bankacılık sektörü ile birlikte küresel bankacılığın gelişmesi, banka müşterilerinin iç ve dış piyasalarda ihtiyaç seviyelerini artırmış ve bankacılık iş ortamında hem ciddi hem de kalıcı değişikliklere sebep olmuştur. Öte yandan yeni nesil bankacıların ortaya çıkması, özellikle bankacılıkta hizmet sektörünü çok değiştirmiştir. Temel değişikliklerden biri ise müşteri odaklı bankacılığın, ürün merkezli bankacılığın yerine geçmesidir. Bu çalışma, kurumsal bankacılık kavramının gelişim eksikliğine göre, bankacılık literatüründe, yeni bir konu sayılır. Özellikle İran bankacılık sistemini Türkiye'nin katılım bankacılık sistemi ile işlevler ve kurumsal müşterilerin memnuniyetleri açısından karşılaştırmaktadır. Bu çalışma müşteri memnuniyeti endeksi açısından mevcut modelleri tanıtmakta ve kurumsal müşteri memnuniyetini ve sadakatini etkileyen faktörleri belirleyerek sonuçta ülkedeki bankaların performanslarını artırmak için yeni gelişim önerileri sunmaktadır. Bu çalışmada, önce kurumsal bankacılığın tarihçesine değinilmiş, daha sonra doğrulayıcı faktör analizi metoduyla İran banklar ile Türkiye'nin katılım bankları incelenerek, kurumsal müşterilerin memnuniyet perspektifleri ve bankların sundukları hizmetle kıyaslanarak ölçülmüştür. Son olarak, İran müşteri kitlesinin bakış açısıyla uygun, kurumsal bankacılığın iyileşmesi için mümkün olan yollar öneri olarak sıralanmıştır."
