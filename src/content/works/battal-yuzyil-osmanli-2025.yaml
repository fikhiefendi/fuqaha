abstract: "Bu çalışmanın amacı, Tanzimat sonrası Osmanlı ceza hukuku uygulamasında öldürme yaralama suçlarına yönelik İslam ceza hukuku hükümlerinin ne şekilde hayata geçirildiğini ortaya koymaktır. Bu sebeple, uzun yıllar şerʿî hizmetlerde bulunmuş bir Osmanlı kadısı tarafından te'lif edilen Dürru's-Sukûk isimli sakk mecmuası kaynak olarak kullanılmıştır. Mecmua içerisinden öldürme ve yaralama suçlarını konu edinen dava örnekleri seçilmiştir. İstanbul, Balıkesir, Konya ve Afyon'da görülmüş toplam yirmi dokuz dava İslam ceza hukuku çerçevesinde incelenmiş, uygulama örneklerinde yer alan dava kararları, fıkıh eserlerindeki teorik bilgi ile karşılaştırılmıştır."
