abstract: "TEZİN ÖZETİ İSLÂM'A GÖRE PARA KA VRAMI \"İslâm'a göre para kavramı\", zihinlerde İslâm'ın paraya bakış açısını çağrıştırmaktadır. Bu nedenle tezde İslâm tarihinde paranın tarihi gelişimi, klasik hukuk kitaplarında çeşitli konularla ilgili olarak ele alınmış parayla ilgili genel prensipler ve hükümler üzerinde durulmuş; zaman zaman günümüz iktisat çalışmalarına da atıflar yapılarak mukayeseler yapılmıştır. Tezin birinci bölümünde, beşerî iktisatta para sistemleri ve paranın gelişimine değinilmiştir. İkinci bölümde, İslâm öncesi Arap toplumunda ve İslâm'ın zuhurundan sonra para konulan ele alınmıştır. Üçüncü bölümde müslüman toplumlarda para kavramı, zekat, sarf (paranın parayla değişimi), ribâ (faiz) gibi parayla ilgili hükümler incelenmiştir. Dördüncü bölümde ise, paranın fonksiyonları ele alınmış, değer ölçüsü olma, tasarruf aracı olma ve mübadele aracı olma fonksiyonları incelenmiştir. Sonuç bölümünde ise varılan neticeler maddeler halinde belirtilmiştir. VI"
