abstract: "“Arap gramerinde ğarîbu'l-i'râb çalışmaları ve İbn 'Âbidîn'in ”el-Fevâidu'l-'acîbe fî i'râbi'l-kelimâti'l-ğarîbe“ adlı eseri”adlı çalışmamızın birinci bölümünde ğaribu'l-i'rabın mahiyetine, tarihi gelişimine değinildi. Garibu'l-i'rab hakkında telif edilen eserler incelendi ve tanıtıldı. İkinci bölümünde Şam'ın önde gelen ve Osmanlının son dönemi meşhûr fıkıh âlimlerinden olan ve İbn Abidin adıyla bilinen Seyyid Muhammed Emîn b. Ömer b. Abdilazîz'in hayatına, şahsiyetine, ilmi kişiliğine ve konumuzla ilgili olarak dilciliğine değinildi. Üçüncü bölümde ise İbn 'Âbidîn'in“el-Fevâidu'l-'acîbe fî i'râbi'l-kelimâti'l-ğarîbe”adlı eseri tanıtıldı, müellifin eserde faydalandığı kaynaklar ele alınıp incelendi ve eserde geçen i'rabı yapılan kelimeler teker teker alınıp incelendi. Gayret bizden başarı Allah'tandır."
