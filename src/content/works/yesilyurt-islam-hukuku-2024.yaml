abstract: "İnsanlar birtakım temel haklara sahip olarak dünyaya gelirler ve büyüdükçe bunlara daha başka haklar da eklenir. Yaşama hakkı, dokunulmazlık, din ve vicdan özgürlüğü, çalışma özgürlüğü, düşünce ve ifade özgürlüğü bunlardan bazılarıdır. Bu haklardan biri de sahibine geniş bir yetki veren mülkiyet hakkıdır. Mülkiyet hakkı kişiye hayatta iken edindiği mallar üzerinde kullanma, tasarrufta bulunma ve yararlanma yetkisini sağlayan haktır. Bu hak taşınır ve taşınmaz mallar ile söz konusu mallardaki bütün parça ve eklentileri kapsamaktadır. Bahse konu olan geniş kapsamı sebebiyle mülkiyet hakkına verilen ehemmiyet gerek içtimai gerekse dini açıdan oldukça büyüktür. Bireylerin sahip oldukları bu hakkı korumak amacıyla konulan pek çok kanun ve kural bulunmaktadır. Bunlardan biri de mülkiyet hakkını korumayı amaçlayan ve malı haksız olarak elinde bulunduran kişiden geri almayı sağlayan istihkak kanunlarıdır. Günümüz hukukunda tüm ayrıntılarına kolaylıkla ulaşabileceğimiz istihkak konusunun İslâm hukukunda nasıl yer aldığı, klasik kaynaklarda ne şekilde işlendiği hususunda elimizde bulunan Türkçe veriler oldukça azdır. Biz de bu tespit üzerine böyle bir tez konusu seçerek, istihkak kavramının İslâm hukukundaki hükümlerini yer yer günümüz hukuku ile karşılaştırarak ele aldık. Çalışmamız sonucunda İslâm hukukunda yer alan istihkak meselesine ilişkin hükümler ile günümüz hukukundaki hükümler arasında benzerliklerin bulunduğu tespit edilmiştir. Buna mukabil, günümüz hukukunda istihkak davasının açılabildiği haller arasında yalnızca haciz ve miras işlemleri bulunurken; İslâm hukukunda ise mülkiyetin söz konusu olduğu, muamelat bölümüne giren neredeyse her başlıkla ilgili istihkak davası açılabildiği görülmüştür."
