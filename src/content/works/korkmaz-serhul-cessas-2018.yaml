abstract: "Hanefî mezhebinin müessis otoritelerinden birisi olan İmâm Muhammed b. Hasan eş-Şeybânî'nin el-Câmi'u'l-kebîr adlı eseri, Hanefî çevrelerce çok teveccüh görmüş ve bunun bir yansıması olarak da asırlar boyu üzerine pek çok çalışma yapılmıştır. Irak Hanefî ekolünün en önemli simâlarından olan Ebû Bekir el-Cessâs da bu esere ilgi gösterenler arasında olup, Şerhu'l-Câmi'i'l-kebîr ya da Şerhu'l-Cessâs ale'l-Câmi'i'l-kebîr olarak bilinen şerhini kaleme almıştır. Eserin fıkıh ilmi ve birikimine pek çok cihetten katkıları olacağı açıktır. Bu nedenle şerh eserin tamamının edisyon kritiğini yapıp onu ilim dünyasına kazandırmayı hedefledik. Çalışma giriş ve dört bölümden oluşmaktadır. Girişte, konunun önemi ve mahiyeti, çalışmanın kaynakları, tahkikte esas alınan nüshanın tanıtımı ve tahkikte takip edilen yöntem ele alınmıştır. Birinci bölümde Şeybânî'nin kısa bir biyografisi verilmiş, ardından el-Câmi'u'l-kebîr adlı eseri incelenmiştir. İkinci bölümde Cessâs'ın kısa bir biyografisinin yanı sıra dönemin fıkhî özellikleri ele alınmış, daha sonra Şerhu'l-Câmi'i'l-kebîr eserinin yeri el-Câmi'u'l-kebîr'in diğer şerhleriyle mukayese edilerek saptanmaya çalışılmıştır. Çalışmanın üçüncü bölümünde de önemine ve eserdeki yoğunluğuna binâen müstakil bir bölümde eserin kavâid ilmiyle olan ilişkisi ele alınmıştır. Son olarak da Cessâs'ın dört cilt olarak telif ettiği şerhinin, bir cildi kayıp ve 813 varak halindeki -tespit edebildiğimiz kadarıyla- tek nüshasının tenkitli metni yer almaktadır. Anahtar Kelimeler: Şeybânî, Cessâs, Şerhu'l-Câmi'i'l-kebîr, Şerh"
