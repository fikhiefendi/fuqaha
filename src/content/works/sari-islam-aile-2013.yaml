abstract: "Toplumun en küçük birimi ailedir. Evliliğin amacı, aile bireylerinin ömür boyu mutluluk ve huzur içerisinde yaşaması ve neslin devamıdır. Fakat çeşitli sebeplerle evlilikler sona erer. İşte ailelerin dağılmasına yol açan bu sebeplerden biri de zinadır. Eşinin zina ettiğini iddia eden ancak dört şahidi olmayan koca için İslam liân hükümlerini getirmiştir. İslam aile hukukunda yeminleşme ve lanetleşme suretiyle evliliğin sona ermesi adlı tezimiz; giriş, üç bölüm ve sonuçtan oluşmaktadır. Girişte, İslam hukukunda evliliğin sona ermesi ve şekilleri hakkında bilgi verilmiştir. Birinci bölümde liânın tanımı ve mahiyeti, hukukî dayanakları, sebebi, rüknü, şartları, hükmü ve şekli incelenmiştir. İkinci bölümde, liânın hukukî sonuçları; eşlerden had cezasının düşmesi, aralarındaki evlilik bağının sona ermesi ve nesebe dair sonuçlar ele alınmıştır. Üçüncü bölümde ise eşlerden birinin liândan çekinmesi halinde ne yapılacağı ve liânı düşürüp hükmünü iptal eden durumlar açıklanmış ve nihayet bu çalışmanın ortaya koyduğu neticeler sonuç kısmında ifade edilmiştir."
