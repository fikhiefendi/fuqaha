abstract: "Bu çalışmada, Irak fıkıh anlayışını sistematik hale getiren Hanefi mezhebinin, Mısır'daki tanınma ve yayılma süreci ile bu süreçte özel bir yeri olan Tahâvî'nin usul anlayışı incelenmiştir. Çalışmamızda, fıkıh mezheplerinin teşekkül sürecini tamamlamaya başladığı bir dönemde, Mısırlıların neden Hicaz fıkhını benimseyerek Hanefi mezhebine karşı mesafeli durduklarına ve Tahâvî dönemine gelindiğinde ise bu duruşun neden Hanefi mezhebi lehine bir değişim yaşadığına cevap aranmıştır. Temelde fıkıh tarihiyle ilgili belirli bir dönemi inceleyen bu çalışmanın bölümleri arasında kronolojik bir sıra takip edilmiştir. Birinci bölümde; Hanefi mezhebinin Mısır'daki ilk temsilcileri ve diğer mezheplerle olan ilişkisi üzerinde durulmuştur. İkinci bölümde, ilk dönem Mısır Hanefiliğini kendisiyle sınırlandırdığımız Tahâvî'nin hayatı ve eserleri ele alınmıştır. Üçüncü bölümde, ilk dönem Mısır Hanefileri içerisinde mezhebin en güçlü temsilcisi olan Tahâvî'nin fıkıh usulüyle ilgili görüşlerine temas edilmiştir. Yapılan araştırma neticesinde, Tahâvî'nin genel olarak usulde bağlı kaldığı Hanefi mezhebini, Mısırlılara onların aşina olduğu ilim diliyle tanıttığı görülmüştür. Anahtar Kelimeler: Fıkıh, Hanefi Mezhebi, Tahâvî, Usul"
