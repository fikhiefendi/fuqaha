abstract: "İnsan vücudunu temizleme, bakım, koruma ve güzelleştirme için kullanılan ürünlere kozmetik, bu konuyu inceleyen ilme de kozmetoloji denir. Kişisel bakım ürünleri olarak da isimlendirebileceğimiz kozmetikler, çok eski zamanlardan beri kullanılmaktadır. Günümüzde oldukça fazla kullanılan kozmetik ürünler içerdikleri hammaddeler dolayısıyla sağlık açısından risk faktörü oluşturmaları nedeniyle çeşitli araştırmalara konu olmaktadır. Müslümanlar ise kozmetiklerin içeriğinde bulunabilen ve İslâm Dini açısından problem teşkil edebilen bazı hammaddeleri“helâl kozmetik”terimi açısından sorgulamaktadırlar. Bu amaçla dünyada helâl ve tayyib ürünler üretebilmek için çeşitli çalışmalar yapılmaktadır Yüksek lisans tezinin konusu,“Kozmetik Ürünlerin Fıkhî Açıdan Tahlîli”dir. Bu araştırmada en çok kullanılan kaynaklar, medeniyet tarihi alanında yazılan eserler; modern çağda kozmetik ürünler ile ilgili üniversitelerde yapılmış çeşitli akademik çalışmalar, tezler, kitaplar; bu konuyla bağlantılı âyetler, hadisler; ve fıkıh kitaplarıdır. Bu çalışmada kozmetik ve ıtriyyât kavramları ile istihâle, istihlâk, müskirat, necâset, tahâret ve benzeri terimler hakkında ayrıntılı bilgi verilmiş ve bu bilgiler ışığında kozmetiklerin fıkhî açıdan tahlîli yapılmıştır. Geçmişte tıpta, matematikte, kimyada, astronomide zamanlarının en ileri düzeyde bilgisine ulaşmış ve yeni teknikler geliştirerek dünya bilimine büyük katkılar sağlamış olan Câbir b.Hayyân, İbn Sînâ, Ebû Bekir er-Râzî, Birûnî ve Ebü'l-Kāsım ez-Zehrâvî gibi müslüman âlimler bulunmaktadır. Günümüzde de Müslüman bilim insanlarının İslâm dininin kuralları çerçevesinde bilimsel araştırmalar yaparak tüm insanlığa hizmet etmeleri gerekmektedir. Tezimizin bu araştırmalara küçük de olsa bir katkı sunması ise en büyük temennimizdir."
