abstract: "Peygamberlik (nübüvvet) meselesi, tarih boyunca hem farklı dinler arasında hem de aynı dinin kendi içindeki mezhep ve düşünce ayrılıklarında; tanımı, konumu, gerekliliği ve ispatı gibi çok yönlü boyutlarıyla tartışılmıştır. İlk dönem kelam eserlerinde nübüvvet hakkında sınırlı bilgilere yer verilmiş ancak sonraki yüzyıllarda hem iç etkenlerin hem de dış dinamiklerin etkisiyle kelam ilminin en temel meselelerinden biri haline gelmiştir. İslâm akaidinde ise nübüvvet, iman esaslarının en temel ve vazgeçilmez unsurlarından biri olarak günümüze dek önemini korumuştur. İslâm düşünürleri nübüvvet konusuna dair farklı yaklaşımlar geliştirmişlerdir. Bu bağlamda kelam ve felsefe disiplinleri içerisinde nübüvvet, tartışmaların merkezinde yer almış; her düşünce ekolü kendi sistemi içerisinde nübüvveti anlamlandırma çabası içinde olmuştur. Bu çalışmada, İslâm kültür tarihinde önemli bir yere sahip olan Maveraünnehir bölgesinde yetişmiş, Mâtürîdî ekolünün önde gelen temsilcilerinden biri olan Ebü'l-Yüsr el-Pezdevî'nin (ö. 493/1100) nübüvvete dair görüşleri ele alınmıştır. Pezdevî, İmâm-ı Âzam Ebû Hanîfe'nin (ö. 150/767) inanç esaslarına dair görüşlerini sistemleştiren Ebû Mansûr el-Mâtürîdî'nin (ö.333/944) takipçisi olarak, Mâtürîdî düşüncesinin gelişimine ve yayılmasına önemli bir katkı sağlamıştır. Ayrıca, bu çalışmada İslâm düşüncesi üzerinde derin etkiler bırakmış, eserleriyle hem İslâm dünyasında hem de Batı'da dikkat çeken İmâm Gazzâlî'nin (ö. 505/1111) nübüvvet anlayışı da incelenmiş ve Pezdevî'nin görüşleriyle karşılaştırmalı olarak değerlendirilmiştir. Böylece, iki farklı ekolün temsilcileri olan bu iki âlimin konuya yaklaşımlarındaki benzerlikler ve ayrımlar ortaya konulmaya çalışılmıştır.Bu çalışma giriş, üç bölüm ve sonuçtan oluşmaktadır. Birinci bölümde Pezdevî'nin hayatı ve kelami görüşlerine yer verilmiştir. İkinci bölümde nübüvvetle ilgili resul, nebi, risalet, peygamberlik, bi'set, vahiy, itaat gibi kavramların anlamlarına, aralarındaki farklara değinilmiştir. Bu bölüm nübüvvet meselesine giriş ve diğer konuları anlama noktasında temel olma mahiyetindedir. Üçüncü bölümde ise Pezdevî ve Gazzâlî örnekliği bağlamında nübüvvetin imkânı, gerekliliği, ispatı, mucize ve gibi konulara yer verilmiştir. Son olarak Pezdevî ile Gazzâlî'nin nübüvvet anlayışları karşılaştırılarak genel bir değerlendirme yapılmıştır."
