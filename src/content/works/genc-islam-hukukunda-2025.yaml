abstract: "İnsan akıl sahibi bir varlık olması ile birlikte yaşamını devam ettirmek için başka insanlara ihtiyaç duyan, toplumla paylaştığı hayatı huzurlu bir şekilde sürdürmek için kurallara ihtiyacı olan varlıktır. Burada insanın huzurlu bir hayat yaşaması yani kamu düzeni ve güvenliğinin temini için güçlü bir irade yaptırım gücüne sahip bir otoritenin varlığı zorunludur. Bu otoritenin adı devlettir. Devlet, belirli bir ülke, üstün bir gücün egemenliğinde yaşayan insanların oluşturduğu topluluk, ayrı ve ferdi bir şahsiyete sahip, hukukî bir kurumdur. Bu topluluğu yönetmesi ve kamu düzenini sağlaması için güçlü bir irade lazımdır bunu ise devlet başkanı sağlayacaktır. İslâm Hukukunda devlet başkanına itaat meselesi her dönem önemini korumuştur. Âlimlerin itaat hakkındaki görüşleri vacip, haram ve mubah olarak farklılıklar arz etmektedir. Bu farklılıklar dönemin getirdiği yaşam koşulları ile bağlantılıdır. İtaatte verilen hükümlerin farklılığı devlet başkanının kendinde bulundurduğu özellikler ile doğru orantılıdır. Devlet başkanına uygulanan farklı tepkiler ortaya çıkarken bu tepkilere verilen hükümlerin önemini dönemimizde yaşadığımız güncel meseleler canlılığını korumuş ve ehemmiyetini artırmıştır."
