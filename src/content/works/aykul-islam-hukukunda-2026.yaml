abstract: "İslam Hukukunda Rekabet İslam hukuku sadece ibadet alanıyla alakalı değil, hayatın düzenlenmesi ve piyasa ilişkilerinin adalet temelinde yürütülmesi konusunda da kapsamlı ilkeler ortaya koymuştur. Tarihsel süreç içerisinde oluşan bu durum, serbest piyasa işleyişi ile devletin piyasaya müdahalesi arasında maslahat ekseninde bir dengeyi hedeflemiş, rekabet, fiyat oluşumu ve devlet müdahalesi gibi meseleleri belirli ilke ve kurumlar aracılığıyla düzenlemiştir. Bu çerçevede, İslam hukuk doktrininde rekabet olgusunun nasıl kavramsallaştığı ve uygulamada ne tür düzenlemelerle korunduğu meselesi, hem tarihsel hem de teorik açıdan incelenmeye değer bir araştırma alanı oluşturmaktadır. Bu çalışma, İslam hukuk tarihi içerisinde rekabet hukukuna ilişkin bir düzenleme ve uygulama bulunup bulunmadığını, mevcut ise bunun hangi ilke ve kurumlar aracılığıyla hayata geçirildiğini ve özellikle haksız rekabet hallerinde devlet müdahalesinin imkân ve sınırlarını ortaya koymayı amaçlamaktadır. Çalışma, meşru rekabet ile gayri meşru rekabet arasındaki sınırların nasıl çizildiğini, rekabetin hangi durumlarda sınırlandırılabileceğini ve kamu otoritesinin hangi tür müeyyideler uygulayabildiğini tespit etmeyi hedeflemektedir. Araştırmamız, günümüz rekabet hukuku tartışmalarına İslam hukukunun tarihsel ve teorik birikimi üzerinden katkı sunması açısından önem arz etmektedir. Günümüz piyasa ekonomilerinde serbest rekabet, tekelleşme, haksız rekabet ve devlet müdahalesi gibi meseleler hem piyasa düzenleyicileri hem de bu alanda çalışma yapan akademisyenler tarafından yoğun biçimde tartışılmaktadır. İslam'ın ilk dönemlerinden itibaren teşekkül eden piyasa ve pazar düzeni, pazara serbest giriş-çıkış imkânı, arz-talep dengesine dayalı fiyat oluşumu, ihtikâr, neceş, malı yolda karşılama gibi uygulamaların yasaklanması ve hisbe kurumu aracılığıyla piyasa denetiminin sağlanması gerçekleştirilmiştir. Bu çerçevede çalışma, İslam hukukunun sadece ahlaki ilkeler ortaya koymadığı, ayrıca rekabeti korumaya dönük kurumsal ve hukuki düzenlemeler geliştirdiğini göstermesi bakımından önem taşımaktadır. Konu, hem klasik fıkıh literatürünün iktisadi boyutunu ortaya koymak hem de günümüz rekabet hukuku tartışmalarına alternatif bir bakış açısı sunmayı amaçlamaktadır. Çalışmamız, klasik fıkıh kaynakları başta olmak üzere farklı mezheplere ait temel metinler ile İslam tarihi ve siyere dair kaleme alınan eserlerin mukayeseli analizine V dayanmaktadır. Hanefî, Mâlikî, Şâfiî ve Hanbelî literatüründe yer alan ilgili hükümler ile İslam tarihinde var olan uygulamalar, ihtikâr, narh, neceş, telakkî'r-rukbân ve kamu otoritesinin müdahale yetkisi çerçevesinde incelenmiştir. Ayrıca hisbe kurumu ve muhtesip uygulamaları tarihsel veriler ışığında değerlendirilmiş, kavramsal çerçeve oluşturulurken modern rekabet hukuku literatüründeki kavramlarla karşılaştırmalı bir okuma yapılmıştır. Bu çalışma İslam hukukunun, esas itibarıyla arz ve talep şartlarına göre fiyatların serbestçe oluştuğu bir piyasa modelini benimsediğini göstermektedir. Ancak bu serbestlik mutlak olmayıp, piyasada adaleti ve kamu yararını zedeleyen uygulamalar karşısında devlet müdahalesine kapı aralamaktadır. Tekelleşmeye yol açan ihtikâr, fiyatları manipüle etmeye yönelik neceş, üretici veya tüketiciyi zarara uğratan malı yolda karşılama gibi fiiller haksız rekabet kapsamında değerlendirilmiş ve yasaklanmıştır. Narh uygulamasının ise kural olarak tercih edilmediği, ancak piyasa bozulduğunda ve kamu yararı gerektirdiğinde istisnai bir müdahale aracı olarak meşru görülebildiği tespit edilmiştir. Bu çerçevede İslam hukukunun ne tam serbest rekabet ne de katı bir müdahaleci model öngördüğü, adalet, kamu yararı ve piyasa düzeninin korunması ilkeleri ekseninde dengeli bir yaklaşım benimsediği sonucuna ulaşılmıştır. Çalışmamız, günümüz haksız rekabet hukukunun güçlü taraflarını vurgulamakla birlikte eksik kalan taraflarını da ortaya koymaktadır. Bu bağlamda, çalışmamız günümüz hukuku ile İslam hukukunu karşılaştırmaktan ziyade, İslam hukukunun ilkelerinin modern düzenlemeleri genişleten ve tamamlayan bir rehber olduğunu da vurgulamaktadır Çalışma, literatüre iki yönlü katkı sunmaktadır. Birincisi, rekabet hukuku ve haksız rekabet hukukuna dair modern kavramların tarihsel karşılıklarını İslam hukuk geleneği içerisinde sistematik biçimde ortaya koyarak iki hukuk sistemini karşılaştırmaktadır. İkincisi, farklı mezheplerin görüşlerini birlikte değerlendirerek İslam rekabet hukukunun oluşum sürecine katkı sunmaktadır. Bu yönüyle çalışma, İslam iktisat düşüncesinde rekabet, piyasa düzeni ve devlet müdahalesi konularının teorik temellerini yeniden değerlendirmeye ve güncel tartışmalara tarihsel derinlik kazandırmaya katkı sağlamaktadır."
