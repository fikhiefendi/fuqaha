abstract: "Dünyada ve Türkiye'de pek çok kurum, toplumsal talep sonucu ortaya çıkmıştır. Katılım bankacılığının ortaya çıkmasındaki en büyük neden de, yine toplum ihtiyaçları olmuştur. Dini nedenlerden dolayı faize karşı olan tasarruf sahiplerine ait fonların atıl kalması hem tasarruf sahiplerini hem de ekonomiyi olumsuz etkilemektedir.Dünyada, faizsiz bankacılık modelinin temeli 1963 ? 1966 döneminde ?Tasarruf Sandığı? biçiminde ortaya çıkan uygulamaya dayanmaktadır. Bu uygulama, faizsiz bankacılık modelinin ilk örneğini oluştururken, İslam Kalkınma Bankası'nın modern bankacılık anlayışı ile kurulmasında da etkili olmuştur.İslami ülkelerde başlayan, küreselleşmeyle birlikte birçok ülkeye yayılan katılım bankaları, gün geçtikçe daha da önemli hale gelmektedir. Türk finans sistemine 1980'li yıllarda giren katılım bankaları, personel, şube ve müşteri sayısı olarak geçen dönemde önemli gelişme göstermiş olup, bankacılık sektörü içerisinde önemli bir noktaya gelmişlerdir.Klasik bankacılıktan farklı olarak faizsiz finansman prensipleri doğrultusunda özel cari hesaplar ve katılma hesaplarında topladıkları fonları, çeşitli yöntemlerle değerlendiren katılım bankaları, oluşan kar ya da zararı tasarruf sahipleri ile paylaşmaktadırlar. Klasik bankacılıkta sabit bir getiri söz konusu iken, katılım bankalarında sabit bir getiriden söz edilememektedir. Tasarruf sahipleri, elde edilen kara ortak oldukları gibi oluşan zarara da ortak olmaktadırlar.Bu çalışmada, katılım bankaları üzerinde durularak, katılım bankaları klasik bankalarla karşılaştırılmış ve katılım bankalarının muhasebe uygulamalarına yönelik çalışmalar yapılmıştır."
