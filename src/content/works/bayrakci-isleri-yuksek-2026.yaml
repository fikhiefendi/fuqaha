abstract: "Başlangıçta Heyet-i Müşavere adıyla ve Müşavere ve Dinî Eserler İnceleme Kurulu isimleri altında hizmet vermiş olan bugünkü Din İşleri Yüksek Kurulu, Diyanet İşleri Başkanlığı'nın en önemli merkez birimi olarak faaliyet göstermiştir. Araştırmamızda Din İşleri Yüksek Kurulu fetvalarında gerek web sitesinde gerek Fetvalar adlı eserinde geçen kadına dair meselelerin incelenmesi ve derli toplu bir araya getirilmesi hedeflenmektedir. Araştırmamıza konu olan kadını doğrudan ve dolaylı yoldan etkileyen, ilgilendiren soru ve sorunlar, hayat şartlarının değişmesiyle çözüm için beklemekte olan yeni meselelerin meydana gelmesi, dinî bilgilerde uzman kimseleri söz konusu meselelerin çözümü için harekete sevk etmiştir. Geçmişte içtihat ehliyetine sahip müçtehitlerden, günümüzde ise alan uzmanlarından üretilen bu çözümler ve dinî bakış açısının adı olan fetvanın, Hz. Peygamberin zamanından günümüze kadar Müslümanların dinî hayatı ile günlük yaşantılarının düzenlenmesi ve hakikate yönlendirilmesinde, dinî bilgilerin güncelliğinin muhafaza edilmesinde etkili olduğu malumdur. Kadın siyasal, sosyal, ekonomi ile hukuk gibi alanlarda bilhassa aile hayatındaki konumu itibariyle ve farklı yönleriyle en çok tartışılan konulardan biri olarak güncelliğini korumuştur. Tarihsel süreç içinde kadının hak ve sorumlulukları konusunda üretilen bilginin bireysel ve toplumsal alana yansıması zor olmuştur. Önemini ve güncelliğini devam ettiren kadın konusunun metodik, bilimsel ve sağlıklı bir zeminde ele alınması bir zorunluluktur. Konumuz olan kadına dair meselelerin fetvalarda değerlendirilen yönlerinin neler olduğu Din İşleri Yüksek Kurulu Fetvalar Kitabında incelenmiş, Kurul'un fetva serdederken izlediği yöntem, dinî soruları cevaplandırırken esas alınan ilke ve kriterlere değinilmiştir. Dokümantasyon yöntemiyle literatür taranarak hazırlanan çalışmada Kurul'un 1086 fetvasından oluşan 'Din İşleri Yüksek Kurulu Fetvalar Gözden Geçirilmiş İlaveli Baskı' eserinden kadın kavramı taratılarak veri toplanmış, içinde kadın kavramı geçen fetvalar tertip edilmiştir. Ayrıca konu anlam ve bütünlüğü çerçevesinde yapılan diğer çalışmalardan da belirli ölçülerde istifade edilmiştir. Kurulun genel itibarıyla tez konumuzla ilgili geniş ve çok yönlü çalışmalar yaptığı, söz konusu meselelerle alakadar olduğu ve toplumu çeşitli platformlardan bilgilendirdiği bilinmektedir."
