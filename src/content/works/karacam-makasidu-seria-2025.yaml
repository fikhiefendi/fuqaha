abstract: "Makâsıdü'ş-Şeria'nın Yusuf el-Karadâvî'nin Fıkıh Düşüncesine Etkisi başlıklı bu çalışmada Yusuf el-Karadâvî'nin makâsıdü'ş-şeria anlayışı ve bu anlayışının yöntemi ve fıkhî meseleler üzerindeki yansıması incelenmeye çalışılmıştır. Yusuf el-Karadâvî güncel meselelere vâkıf ve güçlü bir fıkıh mirası donanımına sahip, birçok güncel meselenin İslam hukuku açısından çözümü ve ele alınışı hakkında görüşlerine müracaat edilen bir alimdir. Bu sebeple onun fıkıh anlayışı, fıkhi delillendirme yöntemi bu çalışmada incelenmiştir. Makâsıdü'ş-şeria düşüncesi de güncel fıkhi problemlerin çözümünde önemli bir yere sahiptir. Yusuf el-Karadâvî özellikle azınlıklar fıkhına dair meselelerde, birçok güncel meselede makâsıdü'ş-şeria üzerinden çözüm üreterek kollektif ictihad mekanizmasını işletip icma'ı canlandırmaya çalıştığı ve böylece fıkıh alanına kayda değer bir hizmet sunduğu tespit edilmiştir. İslam alemindeki uluslararası fıkıh meclislerinin kurucu ve üyesi olması münasebetiyle bu kurumların üretmiş olduğu fetva ve kararlara dikkate değer bir katkı sunmuştur. Onun fıkhî konulardaki bu büyük etkisinin arka planında makâsıdü'ş-şeria düşüncesinin önemli bir yeri olduğu ve fıkıh mirasına dair özgün görüşlerinin bulunduğu tespit edilmiştir. Bu çalışmada, onun makâsıdü'ş-şeria'ya dayalı fıkhî mülahazaları tespit edilmiştir. Çağdaş bir alimin yaşadığı asrın güncel meselelerine çözüm bulmada takip ettiği metodu ortaya koymaya gayret edilmiş ve onun makâsıdü'ş-şeria düşüncesinin alt yapısını teşkil eden yöntemsel ilkeler ele alınmıştır. Karadâvî'nin makâsıdü'ş-şerîa hakkındaki düşüncesi, fıkıh sistematiğine bütüncül bir şekilde bakarak bu sistematik içerisinden öne çıkan bazı meselelerde makâsıd düşüncesinin onun fıkıh anlayışına etkisi ortaya konulmuştur. Çalışmamız giriş ve üç bölümden oluşmaktadır. Girişte çalışmamızın amacı ortaya konularak daha önce bu konuda yapılan çalışmalara işaret edilmiştir. Birinci bölümde Yusuf el-Karadâvî'nin hayatı hakkında bilgi verilmiştir. İkinci bölümde Karadâvî'nin makâsıdü'ş-şerîa yöntemi üzerinden usûlü fıkıhla alakalı görüşleri ele alınıp fıkhî delillendirme metodu ve onun makâsıdü'ş-şerîa yönteminin temelleri ortaya konulmaya çalışılmıştır. Üçüncü bölümde Karadâvî'nin fürû fıkha dair öne çıkan ve görüşleri ve fıkhî tercihleri incelenmiştir. Sonuçta Karadâvî'nin fıkhî düşüncesinin temellerinde, fıkıh usulünde dile getirdiği ve en çok üzerinde durduğu iki önemli konudan biri makâsıdü'ş-şerîa düşüncesi ve diğeri ictihad düşüncesi olduğu görülmüştür. Fıkıh usûlünün her zaman ve mekâna uygun ve uygulanabilir olduğunu her fırsatta dile getirdiği bu bakış açısının gereği olarak İslam ahkâmının güncel zamanlara ve daha sonrasında da uygulanabilmesi için en çok gerekli olan bu iki meseleye önem verdiği ve özellikle makâsıdü'ş-şerîa düşüncesinin bu minvalde fetvalarına ve fıkıh düşüncesine yoğun bir şekilde etki ettiği tespit edilmiştir. İstidlâl yöntemi ele alındığında her ne kadar klasik fukahâdan farklı usuller takip ederek bazen farklı çıkarımlar yapsa da onun fıkhî düşüncesinin temellerini öncelikle Kur'an ve Sünnet, sonrasında diğer delillerin oluşturduğu, bu yönüyle kadîm fukahânın yolunu takip ettiği görülmüştür. Hemen her meselede ilk olarak kadim fıkıh geleneği içerisinde neredeyse bütün mezhep görüşleri ile birlikte ulaşabildiği her görüşe kıymet verip incelediği, bir hükme ulaşırken şaz görüşler dahil bunların her birini değerlendirip bir sonuca ulaştığı tespit edilmiştir. Onun fıkhî düşüncesinin temellerinde bazı meselelerde Kur'an ve hadise dayanarak cumhurun ya da mezhep görüşlerinin dışına çıkarak fetva verdiği ya da kadim fıkıh geleneğini birçok yönden eleştirdiği durumlar olsa da fıkhın yürürlülüğünün devamı için çok önemli gördüğü ictihad anlayışında gelenekteki görüşlere başvurmayı önemsediğini bizzat ifade ettiği tespit edilmiştir. Karadâvî'nin gerek fıkıh usûlü anlayışı, delillendirme metodu, gerek fürû fıkıh alanındaki bazı öne çıkan görüşleri incelenerek hükümlere ulaşırken makâsıdü'ş-şerianın onun fıkıh düşüncesine önemli bir etkisi olduğu sonucuna ulaşılmıştır."
