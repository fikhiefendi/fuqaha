abstract: "Eşitlik kavramına farklı bakış açılarıyla yaklaşan Türk Aile Hukuku ve İslâm Aile Hukuku, bu kavramı kendine özgü ifadelerle açıklamıştır. Türk Aile Hukuku'na göre kadın ve erkek arasındaki eşitlik, mutlak eşitlik olup hiçbir ayırımın yapılmamasını öngörmektedir. İslâm Aile Hukuku ise eşitlikten ziyade adalet prensibi üzerinde durmakta, temel haklarda bütün insanları eşit görürken, yaratılış ve kabiliyetlerdeki farklılıkları da göz ardı etmemektedir. Bazen bu hakkın tesliminde eşitliği bozan unsurlar ortaya çıkmaktadır. Bunlar, cinsiyet, psikolojik farklılık, sıhhat veya din ayrılığı gibi faktörlerden kaynaklanabilir. Ortaya çıkan bu engellerde eşitliği bozmak bir eşitsizlik olabilir. Ancak İslâm Aile Hukuku'na göre her eşitsizlik adaletsizlik değildir."
