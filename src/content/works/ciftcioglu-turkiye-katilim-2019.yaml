abstract: "Türkiye'de ve dünyada toplumların önemli bir bölümü, faiz olgusundan uzak durmaktadır. Kapitalist batı toplumlarında bile bu yönde eğilimlerin olduğu ve bu nedenle klasik bankalara gitmeyen kaynakların atıl kaldığı gözlemlenmektedir. Bu durum hem ülke ekonomileri ve hem de tasarruf sahipleri açısından bir kayıptır. Türkiye'de katılım bankaları, mali sektörde bir yenilik olarak, faiz duyarlılığı nedeniyle klasik bankalara gitmeyen kaynakları ekonomiye kazandırmak ve tasarruf sahiplerinin tasarruflarını güvenle saklamalarına ve değerlendirmelerine yardımcı olmak, alternatif yatırım alanları vesilesiyle körfez fonlarını da çekmek amacıyla ilk olarak, 83/7506 sayılı Bakanlar Kurulu Kararı ile 1985'te kurulmuştur. Ekonomi açısından önemli bir problem halini alan faiz kavramının, finansman ihtiyacında önemli bir yeri olmasına karşılık reel sektörün büyümesine olumsuz etki ettiği değerlendirilmektedir. Finansman ihtiyaçlarının faizsiz olarak sağlanması ile üretime dayalı ekonomik sisteme geçilmesinin önü açılabilecek ve bu vesileyle daha sağlam bir ekonomik yapı tesis edilebilecektir. Günümüzde gerek İslam ülkelerinde ve gerekse başta batı ülkeleri olmak üzere tüm dünya ülkelerinde hızla büyüme eğilimi gösteren Katılım Bankacılığı, Türkiye'de daha önce kurulan Kuveyt Türk, Albaraka Türk ve Türkiye Finans Katılım bankalarına, kamu sermayesi ile kurulan Ziraat Katılım, Vakıf Katılım Bankaları ile Emlak Katılım Bankasının eklenmesiyle daha da güç kazanmıştır. 2019 Mayıs itibarıyla Türkiye'de; Albaraka Türk, Kuveyt Türk, Türkiye Finans, Ziraat Katılım, Vakıf Katılım ve Türkiye Emlak Katılım Bankası olmak üzere altı farklı katılım bankası bankacılık faaliyetlerini sürdürmektedir. Bu araştırmanın amacı Türkiye'de katılım bankacılığının Türk finans sistemi içindeki rolü ve önemini irdelemek ve gerek katılım bankacılık sektörü ve gerekse de Türkiye ekonomisine olabilecek olumlu ve olumsuz etkilerini araştırmaktır."
