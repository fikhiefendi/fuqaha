abstract: "Çalışmamızda topluma yıkıcı ve ezici zararlar veren ticaret uygulamalarından ihtikâr kavramı Hanefi mezhebi görüşleri açısından ele alınmaktadır. Tez konusu Hanefi mezhebi ile sınırlandırılması nedeniyle İslam hukuku genel hükümleri ve diğer mezheplerin ilgili görüşleri incelenmemektedir. Hanefi mezhebi özelinde ihtikâr konusu ele alınmıştır. Mezhebin konuya yaklaşımı değerlendirilmiş ve mezhep içi ihtilaflara yer verilmiştir. Mezhebin konuya yaklaşımındaki tarihsel süreç ele alınmıştır. Tez, Giriş ve İki Bölüm'den oluşmaktadır. Giriş kısmında tezin içerik ve yöntemi hakkında bilgi verilmektedir. Birinci bölümde birlikte Hanefi mezhebinde ihtikârın tanımına, hükmüne ve ihtikârın oluşmasına sebep olan mekruh alışveriş türlerine değindik. İhtikâra konu olan ve olmayan mallar, yapıldığı mekân ve mesafe, yapıldığı zaman ve süreyi ele aldıktan sonra ihtikâr kapsamı dışında tutulan çiftçi ve şehirdışından mal getiren kimseler hakkındaki tartışmaları ve ihtilaflı görüşleri belirtip delillerini sunduk. İkinci bölümde ihtikârın hukuki sonuçlarını, muhtekirin malının fiyatlandırılması ve satışı meselesini ele aldıktan sonra cezasına değindik"
