abstract: "Bu çalışma, Yahudi fıkhındaki finansal sistemin temelini oluşturan ilkeleri analiz ederek bu alandaki akademik literatüre katkı sağlamayı amaçlamaktadır. Çalışmanın özgünlüğü, Yahudi fıkhında finansal sistemin dayandığı esasları sistematik bir biçimde inceleyen çalışmaların sınırlı olmasından kaynaklanmaktadır. Araştırma; Yahudi fıkhında mali işlemlerin teşri kaynaklarını tanıtmayı, bu kaynaklar ekseninde finansman ilkelerini belirlemeyi, pratik uygulamaları ve ilgili denetim kurumlarını açıklamayı hedeflemektedir. Üç bölümden oluşan çalışmanın birinci bölümünde; teşri kaynaklar ve temel finansman ilkeleri ele alınmıştır. İkinci bölümde; finansal uygulamalar ve denetim mekanizmaları incelenmiştir. Üçüncü bölüm ise mali işlemler bağlamında Yahudi fıkhı ile İslam fıkhı arasındaki benzerlik ve farklılıkların karşılaştırmalı analizine ayrılmıştır. Tümevarımcı, analitik ve karşılaştırmalı yöntemlerin kullanıldığı bu çalışmada; dini metinler ve içtihadı kaynaklar tahlil edilerek her iki hukuk sistemi arasında nitel bir değerlendirme yapılmıştır. Araştırma sonucunda; Yahudi finans sisteminin etik ve teşri temellere dayandığı, bu ilkelerin çeşitli sözleşme uygulamalarında somutlaştığı ve işlemlerin dini uygunluğunu denetleyen kurumsal yapıların mevcudiyeti tespit edilmiştir. Yapılan karşılaştırmalı analiz; her iki sistemin etik temeller bakımından belirli bir yakınlık gösterdiğini, buna karşın başta faiz (riba) meselesi olmak üzere, bazı sözleşme türlerinin niteliği ve finansal denetim mekanizmalarının kapsamı hususunda yapısal farklılıkların bulunduğunu ortaya koymuştur."
