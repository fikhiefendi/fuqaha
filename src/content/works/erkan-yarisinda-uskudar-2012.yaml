abstract: "Bu çalışmada XVIII. yüzyılın ilk yarısı içerisinde İstanbul'un üç büyük kazasından biri olan Üsküdar'da yaşamış müslüman ve gayrimüslim tebaa arasında münasebetler ele alınmıştır. Tezin ana kaynağını incelenen döneme ait Üsküdar Şer`iyye Sicilleri oluşturmuş, bunun yanında Başbakanlık Osmanlı Arşivi, fetva mecmuaları seyahatnameler ve diğer araştırmalardan istifade edilmiştir.Tez, giriş ve üç ana bölümden oluşmuştur. Giriş kısmında müslüman-gayrimüslim ilişkilerinin tarihsel arka planı, Üsküdar'ın tarihi coğrafyası ve incelediğimiz döneme kadar Üsküdar'da yaşayan gayrimüslimler hakkında özet bilgi verilmiştir. Birinci bölümde öncelikle ilişkilerin varlığına sebep olan hukukî zemin, Üsküdar mahkemesi, gayrimüslimlerin kadı mahkemelerini ne sıklıkta kullandıkları ve bu manada cemaat mahkemeleriyle ilgili değerlendirmeler ve Müslümanlarla olan ilişkilerinde hangi hukuki enstrümanları kullandıkları ve ne tür davaların cereyan ettiği açıklanmaya çalışılmıştır. İkinci bölümde ise, iktisadî hayatın unsurları olan alım satım, kredi ve borç ilişkileri, esnaf ve üretim ilişkileri değerlendirilmiştir. Son bölümde Müslümanlar ile gayrimüslimler arasındaki sosyal ilişkiler üzerinde durulmuş, bir arada yaşamaya örnek teşkil edebilecek münasebetler ve Müslümanlar ile gayrimüslimler arasındaki sosyal farklılıklar bütüncül bir bakış açısıyla ele alınmıştır.Netice olarak yapılan çalışma sonucunda ana kaynağımız olan kadı sicillerinden hareketle Osmanlı Hukuk sistemi uygulama alanı içerisinde alternatif cemaat mahkemelerinin olmadığı saptanmıştır. Üsküdar kadısının İslam hukukuna uygun verdiği kararlar doğrultusunda, Müslümanlar ile gayrimüslimler arasında cereyan eden davaların, herhangi bir toplumda görülebilecek sıradan adi vakıalar olduğu gözlemlenmiştir. Münasebetlerin en yoğun olduğu ekonomik alanda ise, gayrimüslimlere getirilen bazı kısıtlamaların dönemsel olduğu vurgulanmıştır. Sosyal hayatta dinî ve örfi sebeplerden dolayı bazı farklılıkların olduğu ancak insani olan hususlarda bu farklılıklarla birlikte bir arada yaşmaya dair örneklerin bulunduğu tespit edilmiştir."
