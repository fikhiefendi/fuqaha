abstract: "Dış ticaretin hızla gelişmesinden dolayı günümüzde özellikle gelişmekte olan ülkeler üretimlerini ve pazar paylarını arttırmayı hedeflemektedirler. Bu yüzden ithalatçıların ve ihracatçıların karşılaştıkları riskler devamlı form değiştirerek büyümektedir. Bu nedenle dış ticaretle iştigal eden kişi ve kurumların yerel, ulusal ve uluslararası mevzuat ve uygulamaları ilgili ülkelere göre çok iyi takip etmeleri gerekmektedir.Bu çalışmanın araştırma problemi uluslararası ticarette bir ödeme aracı olarak kullanılan akreditif uygulamalarının değerlendirilmesidir. Dört ana başlıktan ibaret çalışmanın birinci bölümünde dış ticaret kavramı ve gelişimi; ikinci bölümde dış ticarette kullanılan taşıma, teslim ve ödeme şekilleri; üçüncü bölümde akreditifli ödemeler, çeşitleri ve uygulamada karşılaşılan sorunlar ele alınmıştır. Dördüncü bölümde bir katılım bankası“örnek olay”olarak incelenmiş, elde edilen ihracat verileri değerlendirilmiş ve istatistik sonuçlar (ANOVA, t testi ve Ki Kare) irdelenerek aralarındaki bağlantılar gösterilmiştir. Analiz neticelerine göre ülke-teyit, ülke-vade türü, vade türü-miktar, miktar-teyit, miktar-teslim şekli ilişkileri arasında anlamlı sonuçlar elde edilmiştir."
