abstract: "İslam ekonomisi ya da İslamî ekonomi, İslami bilim insanları tarafından“İslam din ve gelenekleri ile uyumlu bir ekonomik düzeni teşvik etme”şeklinde tanımlanır. İslam'da insan mutlak anlamda hür değildir. Dolayısıyla insan, diğer tüm alanlarda olduğu gibi, ekonomiyle ilgili faaliyetlerinde de Kura,da belirtilen Allah'ın koyduğu sınırlara uymak zorundadır. İslami bilim insanları, İslam ekonomisini kapitalist ya da sosyalist olarak tanımlamaz. İslam ekonomisinin her iki sistemin de negatif özelliklerine sahip olmayan bir“üçüncü yol”olduğunu tezini savunurlar. Sosyal piyasa ekonomisinde talep edilen esassen adil bir finans sistemdir. Bu düzen de tam olarak İslâm ekonomisinde mevcuttur. Çünkü, İslâm ekonomisi, serbest piyasa ekonomisinin kendi prensiplerine göre ahlak ile düzenlenmiş halidir. Bu sebeplerden dolayı İslâm ekonomisi sistemi sosyalizmin yıkılmasını takiben sarsılan kapitalizme bir alternatif olarak tüm dünyada ele alınmaktadır."
