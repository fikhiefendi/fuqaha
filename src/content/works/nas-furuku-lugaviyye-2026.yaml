abstract: "Bu çalışma, Türkçe mealleri el-furûku'l-lugaviyye çerçevesinde incelemeyi konu edinmektedir. Arap dil biliminde yakın anlamlı kelimeler arasındaki mana farklarını inceleyen furûk alanı, lafızların vazedildiği ilk manaları koruma hassasiyetiyle dilin daha doğru ve bilinçli kullanılmasına katkı sağlamaktadır. Kur'an-ı Kerim'de çok sayıda mütekârib (yakın anlamlı) kelime bulunması, bu alanı tefsir ve meal çalışmaları açısından önemli kılmaktadır. Çalışmada Kur'an'daki mütekârib kelimelerin meallerde çoğu zaman müterâdif (eş anlamlı) kabul edilerek benzer ifadelerle çevrilmesi bir meal sorunu olarak ele alınmıştır. Araştırmanın temel problemi, meallerin furûk birikiminden ne ölçüde yararlandığı ve bu birikimi çeviriye nasıl yansıttığı meselesidir. Türkçe literatürde furûk üzerine çeşitli çalışmalar bulunmakla birlikte mealleri furûk açısından inceleyen araştırmaların sınırlı olduğu görülmektedir. Bu çalışmanın amacı, mealleri terâdüf ve furûk anlayışları çerçevesinde analiz etmek ve meal yazarlarının ayetlerin tercümesinde bu yaklaşımları nasıl kullandıklarını ortaya koymaktır. Bu kapsamda çeşitli ölçütlere göre seçilen elli meal incelenmiştir. Karşılaştırma yapmaya elverişli on mütekârib kelime çifti ve bunlara ilişkin ayetler, klasik lügatler ve tefsirlerde yer alan açıklamalar doğrultusunda değerlendirilmiştir. Araştırmada kaynak tarama, metin analizi ve karşılaştırma yöntemleri kullanılmıştır. Araştırma sonucunda birçok dil bilgini ve müfessirin furûka önem verdiği ve yakın anlamlı kelimeler arasındaki anlam farklarını açıkladığı görülmüştür. İncelenen örnekler, furûk birikiminin meallerde yeterince yansıtılamadığını; buna karşılık furûk yaklaşımının çevirilerde anlam inceliklerini daha doğru aktarmaya önemli katkılar sunduğunu ortaya koymuştur."
