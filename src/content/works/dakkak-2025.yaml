abstract: "Naklî delil, dinî ilimlerin temel dayanaklarından biri olarak kabul edilmiştir. Bu nedenle, vahyin tamamlanmasının ve İslam'ın farklı milletler arasında yayılmasının ardından, Müslüman âlimler hemen naklî delilin hüccet olmasını temellendirme, onu yanlış anlamalardan koruma ve karşılaşabileceği sorunları ele alma gayreti içine girmiştir. İslam düşüncesi içerisindeki farklı ekoller, kendi bilgi teorileri çerçevesinde naklî delilin temellerini ve onu okuma yöntemlerini oluşturmuşlardır. Bu ekoller arasında, aklî delillere dayanarak inancını savunan kelâmî ekollerden biri de Eş'arîliktir.“Eş'arî usûlcülerin naklî delil teorisinin usûl ve kelam açısından analizi”başlığını taşıyan bu çalışmamız Eş'arîlerin naklî delili temellendirme yöntemlerini ele almaktadır. Araştırma, Eş'arîlerin naklî delil teorisini iki ana temel üzerine inşa ettiklerini ve bu temellerin birçok kelâmî ve usûlî meseleyi kapsadığını ortaya koymaktadır. Birinci temel, bilgi konusuna dair sorulara cevap arar. Eş'arîler, naklî delili bilgi teorisi bağlamında ele almış ve onu bilgi kaynaklarından biri olarak kabul etmiştir. Bu temel, beş ana delile dayanmaktadır: Akıl, mükellefin fiilleri ve onların hükümlerine dair bilgi elde etme hususunda yalnızca naklî delilin yetkinliğini teyit etmiş, bunu da nübüvvetin aklen mümkün olduğuna bağlamıştır. Duyular, nübüvvet çağını yaşayan ilk neslin bilgileri bunun üzerine inşa edilmiştir. Adet, haberlerin aktarımı ve icmanın oluşumunda belirleyici bir unsur olarak kabul edilmiştir. Amel, zannî delillerle amel etmenin vacip olduğunu göstermiştir. Dil, manaların aktarımı, bilgilerin şekillendirilmesi ve düşüncelerin aktarılmasında önemli bir araç olarak ele alınmıştır. İkinci temel, rol ve işlev sorusuna cevap olarak ortaya konmuştur. Bu çerçevede, naklî delilin içsel bilgi yapısının tamamlanması, kat'îlik ve zannîlik yöntemlerinin kullanılmasıyla sağlanmış ve böylece dışsal yapıyı destekleyen, karşılaştırmalı olarak güvenilir ve sağlam bir bilgi temeli inşa edilmiştir. Bu bilgi temelleri, dini ilimler alanında kesin ve güvenilir esaslar olarak kabul edilmekte ve bu esaslar üzerine sağlam bir ilmi yapı kurulmasına olanak tanımaktadır. Bu temel, Eş'arîler nezdindeki kat'îlik ve zannî'liğin anlamlarını ve derecelerini anlamaya dayanmaktadır. Ayrıca, kat'înin ve zannînin genel olarak İslami ilimlerde özelde ise naklî delil konusunda nasıl kullanıldığını bilmeye dayanır. Sonrasında, Fahreddin er-Razî'nin kat'îye ulaşma problemini ele alarak, kat'îye nasıl ulaşıldığına dair yöntemler belirtilmiştir. Son olarak, bu yöntemlerin kelâmî ve usûlî yapı üzerindeki etkileri ve sonuçları tartışılmıştır. Çalışmanın sonunda ise önemli sonuçlara ve birtakım önerilere yer verilmiştir."
