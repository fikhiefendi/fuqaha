abstract: "İnsanlık bilgide büyüdükçe, çabalarının itici gücü, yaşamın ve çeşitli etkileşimlerinin basitleştirilebileceği yollar bulmak olmuştur. Sonuç olarak, insanlar takas sistemini sürdürülemez ve uygunsuz bulduklarında, meta paraya ve madeni paraya geçiş yaptılar. Altın ve gümüşün ortaya çıkışıyla, günlük işlem faaliyetlerimiz için nihayet mükemmel para birimini bulmuş gibiydik. Ne yazık ki durum böyle değildi, çünkü zamanla, yöneticilerin dar görüşlülüğü onları kısa vadeli kazançlar peşinde koşmaya yöneltti ve böylece sürekli değer kaybı yoluyla darp edilen madeni paraları nominal değerlerinden daha düşük bir değere getirdiler. Debasement sorunu, diğer nedenlerle birlikte, tahvilerin verilmesine yol açtı. IOU'lar yalnızca para birimi işlevi gören kağıt parçaları olsa da, insanlar gerçek bir değerleri olmadığını bilmelerine rağmen bu kağıt paraları kullanmakta rahatlardı. Bu imzalı senetlerin gerçek altının temsili olduğunu bilmeleri yeterli bir güvenceydi. Ayrıca, daha iyi bir sistem arayışında, fiat para birimi için altın ve gümüş standartları terk edildi. Ancak itibari para, öngörülen ideal sistem olarak ortaya çıkmadı. Ondan, bitcoin ve kripto para birimlerinin doğuşunu sebeb olan dijital para birimi sistemine geçtik. Kripto paraya olan bu evrim eşi görülmemiş çünkü sadece insanın parasal evriminde başka bir adım olarak işaret etmiyor, aynı zamanda arkasındaki fikir onu benzersiz kılan şeydir. İnsan artık farklı bir değişim aracının kullanımına geçmiyor. Bunun yerine, herkes için merkezi olmayan ve hükümet müdahalesinden arınmış evrensel bir para sistemi tasarlamayı amaçlamaktadır. Bu, insanoğlunun parası için devlete ya da aracılara bağımlı olan yüzyıllarının sonu anlamına gelecektir. Ancak, hem geleneksel hem de Şeriat perspektifinden, kripto para biriminin Dolar, Euro vb. gibi alternatif bir para birimi rolünü tam olarak üstlenebilmesi için, bir değişim aracı, hesap birim ve değer deposu olarak daha geniş kabul yoluyla kendini kanıtlaması gerekir. Bitcoin'in istikrarsızlığı, içsel değer eksikliği, risk seviyesi birçok eleştiriye maruz kalmasına rağmen, altında yatan teknoloji olan blockchain ve kriptografi ve merkezi sisteme olan artan güven kaybı, Bitcoin'i cazip bir alternatif haline getiriliyor. Şeriat açısından, aksini gösteren bir kanıt olmadıkça tüm işlemler caizdir. Bu itibarla, alimler, bir fenomeni, onun caiz olup olmadığını tespit etmek için dikkatle incelemelerini sağlarlar. Bu inceleme, bitcoin'in bir varlık mı yoksa bir para birimi mi olduğu ve hatta ilk etapta ticarete izin verilip verilmediği konusunda tartışmalara yol açtı. Çalışma, İslami finans ışığında kripto para biriminin çeşitli faydaları, sınırlamaları ve zorlukları olduğunu bulmuştur. izin verilebilirliği ile ilgili olarak, para biriminin izin verilebilirliği konusunda yelpazenin her iki tarafından da güçlü argümanlar olduğunu tespit etti. Ancak, daha iyi bilgilendirilmiş kararlar için daha fazla zamana ihtiyaç duyulmaktadır."
