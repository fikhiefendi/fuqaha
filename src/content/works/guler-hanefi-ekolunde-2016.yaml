abstract: "Bu çalışmada, Hanefiler tarafından bir prensip haline getirilen; ma'ruf sünnete aykırılık gerekçesiyle haber-i vahid ile amel edilmemesi anlayışını ele almaya çalıştık. Bu çerçevede tez çalışması giriş, iki bölüm ve sonuçtan oluştu. Giriş bölümünde tezin konusu, amacı, önemi, yöntemi ve kaynakları belirtilip, konu ile ilgili literatür değerlendirmesi yapıldı. Birinci bölümde, Hanefilerin haber teorisi anlayışı, bu bağlamda haber-i vahid ve ma'ruf sünnet kavramları ele alındı. Hanefiler, ma'ruf sünnete aykırı olan haber-i vahid ile amel etmeme prensibini, oluşturdukları manevî inkıtâ kavramıyla ele almışlardır. Bu nedenle konunun daha iyi kavranması için Hanefilerin manevî inkıtâ anlayışları ve bu bağlamda manevî inkıtânın mahiyeti ve manevî inkıtâya sebep olan durumlar ele alındı. İkinci bölümde, haber-i vahidin ma'ruf sünnete aykırılık gerekçesiyle amel edilmemesi prensibinin teorik gerekçe ve dayanakları ile furûa nasıl yansıdığı ve bu bağlamda, ma'ruf sünnete aykırı olduğu gerekçesiyle amel edilmeyen haber-i vahidler ve Hanefi alimlerinin bu konudaki izahları ele alındı.Sonuç bölümünde ise ulaşılan sonuçlar özetlenerek ifade edildi."
