abstract: "Kâfi“ adlı kitap, şehit hükümdar, müceddid fakih, müellif ve zahid olan Ebû'l-Fazl ”Muhammed bin Muhammed bin Ahmed el-Merwazî tarafından yazılmıştır. Kitap, Allah'ın izniyle (1343 yılında) şehit düşen bu İmam'ın fıkıh ve hadis içeren bir derlemesidir. Şehit, Hanefi fıkhının özünü oluşturan en güvenilir eserlerinden biri olan“Zâhir er-Râvîa Kitapları”olarak bilinen bu eseri bırakmıştır. Bu kitaplar, Iraklı fıkıh âlimi Muhammed bin Hasan esh-Şîbânî tarafından derlenmiş olup içlerinde“ElUsûl”kitabı da bulunmaktadır. Ayrıca“El-Mübstût”ve diğer bazı eserler de bu koleksiyonun bir parçasıdır. Onlardan sağlam yollarla rivayet edildi, şehit onlara yönelik kısaltma yaparak yaklaştı, böylelikle yayılmasını azalttı, yükleri hafifledi ve çalışmalarını anlamayı kolaylaştırdı. Onların rivayetleri bir araya getirildi ve şüphesiz ki insanlar onların değerini kabul etti, onlarla birlikte yerleşti ve onlara nakil ve rivayet konusunda güvendiler. Onu anlamak ve bilgi sahibi olmak konusunda onu tercih ettiler ve onun açıklamalarından bazıları şunlardır: önceki koyun ve eğitimli atlı,“El-Mübstût”un sahibi olan“El-Mübstût”un sahibi olan. Onun yankısı devam ediyor ve çağrısı yeniden ortaya çıkıyor, işte o, iki cihanda da parlak bir şekilde duruyor, övgüye değer olanlar için duyuluyor, rivayetler arasında hakemlik ediyor ve .şüphelerden emin bir şekilde geçiyor Bu, bilimsel bir mektuptur ki ondan tozları silkeleyip atar ve şöyle seslenir: Her süsleyeni buraya davet et, haberleri kulüplerde yayınlayarak ve onunla topluluğun .susuzluğunu gider. Onun çiçeklerinden bir buket topladı ve ondan bir nehir yürüttü - 8 - Onun kısmeti ondan“Nikâh Kitabı”ydı, dört farklı ve zarif nüshadan çıkarılmış, alıntıları belgelemekle uğraşılmış, kökenleriyle dolu, farkları ihmal etmeyen, aksaklıkları görmeyen, ellerinin arasında duran önemli önsözleri vardı. O, onun güzelliklerine düşkün olan, onun etrafında dişlerini gıcırdatan, ondan esansı alan ve şehidin gözüyle gören, güvenilir bir şekilde hatırlatan, eylemleri açığa çıkaran ve .umudu canlandıran bir dizi hızlı bir kılavuzdu, çeşitli yayınlara dair bir rehber Kısacası,“El-Kâfi”kitabı, dördüncü hicri yüzyılın değerli eserlerinden biridir. Hanefi fıkhındaki doğru rivayetlerin özünü içerir, nüshalar arasında karşılaştırmalar, rivayet düzeltmeleri, vahye dayanma, eserlerin nakli ve branşların çeşitlendirmesi gibi unsurları içerir. Bu kitap, dört yüz yılı aşkın bir süredir değerli bir kaynak olarak kalırken, onun sahibi hem fıkıh ve ibadet hem de hadis ve zühd konularında bilgili bir kişiydi. Bu mektupta, özellikle“Nikâh Kitabı”ile ilgili olarak, bu konudaki araştırmacıları teşvik etmek ve onları hedeflerine ulaştırmak için yazılmıştır"
