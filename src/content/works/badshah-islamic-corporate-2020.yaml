abstract: "Bu fenomenolojik çalışma, İslami Kurumsal Yönetim ile firmanın sürdürülebilir finansal performansı arasındaki ilişkiyi açıklamaya çalışmaktadır. İslami kurumsal yönetişim, İslam hukukunun kapsanmasında yerleşik olan yönetişim çerçevesi mekanizmalarını ifade eder. İslami kurumsal yönetişimin temel amacı, bireysel kazanç ve sosyal kalkınma arasında bir denge kurmaktır. İslami kurumsal yönetişimin temel bileşenleri şunlardır: gereksiz risklerden ve faiz temelli faaliyetlere katılımdan kaçınmak, servetin bağış / yardım yoluyla dağıtılması ve kurumsal veya ülke düzeyinde faaliyet gösteren İslami düzenleyici otoritenin gözetimi altında sıkı bir kontrol ve denge sistemi geliştirilmesi. İslami kurumsal yönetişimin en önemli kısmı, yatırımcılar, hissedarlar ve yönetim kurulu arasındaki kurum sorununu ve çıkar çatışmasını ortadan kaldıracak etkin bir hesap verebilirlik sistemi geliştirmektir. İslami kurumsal yönetişimin etkin bir şekilde uygulanması, hissedarların ve diğer paydaşların güvenini arttırmakta ve bu da firmanın piyasa değerini arttırmaktadır. Bu teori, bu çalışmada Borsa İstanbul Endeksinde kayıtlı olan veya MUSİAD (Bağımsız Sanayici ve İşadamları Derneği) ve katılımcı Bankalar üyesi 50 firmanın yarı yapılandırılmış görüşmeleri yapılarak test edilmiştir. Yanıtlar kalitatif teknikler kullanılarak kaydedilmiş ve analiz edilmiş ve tematik analiz NVIVO uygulanarak yapılmıştır. İslami kurumsal yönetişimin sürdürülebilir finansal sağlığa katkıda bulunduğu yöneticilerin verdiği tepkilerden anlaşılmaktadır. IKY, şirketlerin operasyonel ve idari verimlilik açısından iyi durumda olmasını sağlayan CCG'ye karşı hesap verebilirlik avantajına sahiptir. Ayrıca, IKY, yetki devri yetkisi yaklaşımı yoluyla ajans maliyetinin azaltılmasına yardımcı olur. Bu nedenle, IKY çatısı altında formüle edilen SOP'ler, organizasyon yapılarının etkili ve verimli bir şekilde izlenmesini, kontrol edilmesini ve denetlenmesini sağlar."
