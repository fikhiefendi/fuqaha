abstract: "Vakıf kavramı, kadimden beri süregelen bir olgudur. İslâm toplumunda özel bir önem atfedilen vakıf kültürü, Osmanlı döneminde tabiri caiz ise altın çağını yaşamıştır. Osmanlı Devletinin farklı coğrafyalarında kurulan vakıflar yalnızca hayır amaçlı hizmet vermemiş, gerek esnaf gerekse sade vatandaşın nakit ihtiyaçlarını karşılamak üzere sosyal bir kurum olarak da kendini göstermiştir. İlk örneklerine 15. yüzyılda rastladığımız nukûd ve avârız vakıfları da, belli şartlar dâhilinde esnaf ve vatandaşların nakit ihtiyacını karşılamak üzere belli bir nemâ ve rehin karşılığında oluşturulmuş vakıflardır. Geniş Osmanlı ülkesinin küçüklü büyüklü birçok yerleşiminde birçok para vakfını görmek mümkündür. Vakıf şartında belirtilen amaçlar için hayır amaçlı kurulan bu para vakıflarından elde edilen gelirler ile sözü edilen cami, mescit, suyolu, kütüphane vb. yerlerin masrafları karşılanmıştır. Bu tür ibadet mekânlarının gelirlerini zenginleştirmek için ayrıca farklı türlerde gayrimenkuller de vakfedilerek gelirleri ile bu masraflar giderilmeye çalışılmıştır. Tez konumuzu teşkil eden Söğüt para vakıfları da kazada bulunan cami, mescit, suyolu ve kütüphanenin ihtiyaçlarını karşılamak üzere kurulmuş, ihtiyaç sahibi esnaf ve mesleğini tespit edemediğimiz bir kısım insanın nakit ihtiyacını karşıladığı gibi elde edilen nemâ gelirleriyle de bahsi geçen kutsal mekânların giderleri karşılanmıştır. Söğüt para vakıflarını çalışma konumuz olarak seçmekteki gayemiz, hem bir devletin kuruluşuna sahne olan hem de İstanbul dışında Bursa'ya yakın olup nispeten ticari hayatın canlı olduğu bir bölgede bu para vakıflarının bölgenin sosyal ve iktisadî hayatına ne derece katkı sağladığını anlayabilmektir."
