abstract: "İslam, aile yapısını kendine özgü bir takım ilkelere bağlamıştır. Çünkü aile toplumun temeli olup her ferdin yetişmesinde önemli bir etkiye sahiptir. Bundan dolayı aileye önem verilmiş ve evlenme, boşanma, çocuk hakları gibi birçok alanda aile yapısını korumak için İslam hukukunda aile ile ilgili esas ve hükümler mevcuttur. Tarihi sürece bakıldığında aile hukuku geç kanunlaştırılmıştır. Geç kanunlaştırılmış olması evlenme, boşanma, aile içi ilişkiler gibi hususların alelade yapıldığı anlamına gelmemektedir. İslam coğrafyalarında Kur'ân-ı Kerîm, hadis mecmuaları ve âlimlerin görüşleri çerçevesinde toplumun ihtiyacını göz önünde bulundurarak aile hukuku ile ilgili düzenlemeler yapılmıştır. Fakat bu düzenlemeler kanunlaşma safhasına geç gelmiştir. Osmanlı hukuku içerisinde aile hukuku diğer hukuk dallarına nazaran tamamına yakını İslam hukukuna göre oluşturulmuştur. Aile hukukunun düzenli işleyişini sağlamak ve ortaya çıkan sıkıntılara çözüm üretmek amacıyla az da olsa örfî hukuktan da yararlanılmıştır. Padişah iradesine dayanan örfî hukuk hiçbir şekilde İslam hukukuna aykırı olmamıştır. Osmanlı Devleti'nde İslam hukukunun hâkim olduğu devlet yapısına 1839 Tanzimat dönemi sonrası Avrupa'dan iktibas edilen kanunlarla yenilik devresi başlamıştır. Birçok hukuki alanda kanunnameler yapılmasına rağmen aile hukuku alanı sonlara bırakılmıştır. 1917 tarihine kadar kanunname yapılmasa da bu alanda ihtiyaca göre düzenlemeler yapılmıştır. Dolayısıyla Hukuk-ı Aile Kararnâmesi ilk aile hukuku kanunu olarak İslam hukuk tarihinde önemli bir yere sahiptir ve bu durum diğer ülkelere öncülük etmiştir. Kararnâme üç dinin mensupları hakkında farklı hükümler getirerek üçlü karakter yapısıyla hukuk birliğini sağlamaya çalışmıştır. Kararnâmede, birçok konuda Hanefî mezhebinin görüşlerini uygulama usulünden ayrılarak diğer mezheplerin görüşlerinden yararlanılmıştır. Kararnâmenin yaptığı önemli bir yenilikte evlenme ve boşanmalara devlet kontrolü getirmiş, evlenecek kişilerin evlenmeye engel bir durumunun bulunup bulunmamasının tespiti için nikâh ilanının yapılması eğer engel yoksa hâkim huzurunda nikâh akdinin gerçekleştirilmesi esasını benimsemiştir. Boşanmada ise boşanan bireylerin belli bir süre içinde mahkemeye boşandıklarını bildirmeleri şeklinde olmuştur. Ayrıca kanunu hazırlayanlar bazı durumlarda devrin şartlarını ve sosyal çevreyi iyi değerlendirerek kadınlara tefrik hakkı vererek kazaî/adli boşanmanın yolunu açmıştır. Kararnâme çok eşliliği yasaklama yoluna gitmemiş fakat“üzerine evlenmemek ve evlendiği surette kendisi ve ikinci kadın boş olmak şartıyla…”maddesiyle çok eşliliği sınırlandırmıştır. Dört mezhepte küçüklerin evlendirilebileceği görüşü mevcutken Kararnâme İbn Şübrüme ve Ebû Bekir el-Esam'ın görüşlerini esas alarak çocukların ergenliğe girmeden önce evlendirilmesini yasaklamıştır. Kararnâmenin ömrü kısa olmuş, o dönemde yaşanan sıkıntılardan dolayı kısa bir süre sonra yürürlükten kaldırılmıştır."
