title: "Abdürrezzâk B. Hemmâm'ın Musannef'indeki “Kitâbü'l-Megâzî”ile İbn Ebû Şeybe'nin Musannef'indeki \"Kitâbü'l-Megâzî'nin Siyer Açısından Mukayeseli Olarak İncelenmesi"
