abstract: "Allah Resûlü'nün ahkâma müteallik hadislerinin yanı sıra tâbiîn ve tebe-i tâbiînin fıkhî görüş ve düşüncelerine dair rivayetleri bir araya getiren musannefler, erken dönemde siyer/megâzî, hadis ve fıkıh arasında kurulan irtibatın seçkin örneklerini teşkil ederler. Bu türün en meşhur eseri ise Abdürrezzâk es-San'ânî'nin (ö. 211/826-827) Kitâbü'l-Musannef'i ile İbn Ebû Şeybe'nin (ö. 235/849) Kitâbü'l-Musannef'idir. Bir araya getirip tasnif ettikleri çok sayıda rivayetle hem siyer-megâzî hem de fıkıh için önemli birer kaynak olan bu iki eseri, siyer-megâzî için daha da önemli kılan husus, alel'l-ebvâb türü eserlerde pek rastlanmayacak şekilde müstakil olarak Kitâbü'l-Megâzî başlığına yer verilmiş olmasıdır. Çalışmamızda Abdürrezzâk'ın el-Musannef'inde yer alan“Kitâbü'l-Megâzî”ile İbn Ebû Şeybe'nin el-Musannef'indeki“Kitâbü'l-Megâzî”başlıklı iki müstakil bölüm ele alınmıştır. Birbirine yakın dönemlerde farklı merkezlerde eser veren ve Allah Resûlü ve Hulefâ-yi Râşidîn dönemi tarihini müstakil olarak Kitâbü'l-Megâzî başlığı altında ele alan bu iki muhaddisin, siyerle ilgili hangi rivayetleri tercih ettiklerini, bunları nasıl tasnif ettiklerini, kronoloji ve hadiselerin seyri ile ilgili yapılandırmayı nasıl gerçekleştirdikleri tespit edilecektir. Ayrıca araştırmamız muhaddis ve müfessir olmasının yanı sıra bir de tarihçi olduğu iddia edilen İbn Ebû Şeybe'nin siyerle ilgili rivayetlerini muhaddis selefi Abdürrezzâk'ınkilerle karşılaştırarak gerçekten bir tarihçi olup olmadığını ortaya koymayı hedeflemektedir. Bu bağlamda ilk olarak İbn Ebû Şeybe ve Abdürrezzâk'ın megâzî alanındaki rivayetleri tespit edilip incelenmiş ve müelliflerin kullandıkları metotlar değerlendirilmiştir. Akabinde de bu rivayetler karşılaştırılarak tahlil edilmiş ve rivayetlerin örtüştüğü ve farklılık arz ettiği yerlere işaret edilmiştir. Bu tahlil ve mukayese neticesinde ise müelliflerin hadis kitaplarında yer alan siyer vemegâzî rivayetlerinin müstakil bir tarih çalışması açısından değerine ve İslâm tarihine sundukları katkılarına vurgu yapılmıştır. Bu sırada ise siyer-megâzî ile ilgili bilgilerin yer aldığı diğer kaynaklardaki konuya ilişkin bilgilerden yararlanılmıştır. Son tahlilde ise İbn Ebû Şeybe'nin Kitâbü'l-Megâzî'sinde Abdürrezzâk'a nispetle tarihçi kimliği ile izah edilebilecek farklılıklar olup olmadığı ortaya koyulmuştur."
