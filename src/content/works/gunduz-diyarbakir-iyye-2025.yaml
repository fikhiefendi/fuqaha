abstract: "Bu çalışma, İslam-Osmanlı hukuk sisteminin genel yapısını ortaya koyarak, 19. yüzyılda Diyarbekir mahkemelerinde tutulan şer'iyye sicilleri özelinde evlilik kurumunun İslam aile hukuku bağlamındaki yansımalarını incelemeyi amaçlamaktadır. Kadı sicillerine yansıyan ilgili uygulamalara odaklanan bu inceleme, elde edilen verileri İslam hukuku açısından tahlile tabi tutmayı amaçlamaktadır. Giriş, iki bölüm ve sonuç olmak üzere toplam dört kısımdan oluşan bu çalışmanın giriş bölümünde, çalışmanın kapsam ve önemi ile araştırmanın metot ve kaynakları üzerinde durulmuştur. Birinci bölümde Osmanlı hukukunun tarihsel gelişimi, şer'î ve örfî hukuk ayrımı, devletin teşkilât yapısı ve hukuk uygulamalarının temel kaynakları ele alınarak, Osmanlı hukuk sisteminin genel işleyişi üzerinde durulmuştur. Çalışmanın ana konusunu oluşturan ikinci bölümde, Diyarbekir kadı sicillerine yansıyan nikâh uygulamaları, evlenme öncesi süreçler, nikâhın hukukî şartları, nikâh türleri ve evlilikten doğan hak ve yükümlülükler ele alınmıştır. Bu bağlamda; ehliyet, veli, şahit, mehir, nafaka ve denklik gibi temel kavramlar hem fıkhî hem de örfî boyutlarıyla değerlendirilmiştir. Kadı sicilleri, çağdaş ve klasik fıkıh kaynaklarının birlikte kullanılmasıyla meydana gelen bu çalışmada, belirli bir yer ve dönem içinde aile hukukunun pratiğe yansıyan uygulamalarına dair bütüncül bir değerlendirme yapılmıştır."
