abstract: "Bu tez çalışmasında, 1785-1787 (H.1200-1201) yıllarına ait ?62 Numaralı Amasya Şer`iye Sicil Defteri? nin transkripsiyonu yapılarak, defterde bulunan belgeler ışığında adı geçen dönemde Amasya'daki idarî ve sosyo-ekonomik yapı değerlendirilmeye çalışılmıştır.Çalışmamız iki bölümden meydana gelmiştir. İlk bölümde ?62 Numaralı Amasya Şer`iye Sicili Defteri? nin transkripsiyonlu metni yer almaktadır.İkinci bölümde, defteri oluşturan belgeler konularına göre ayrılmış, daha sonra her bir konu bu belgeler çerçevesinde ayrı ayrı değerlendirilmiştir.1785-1787 yıllarında Amasya şehrinin sosyo-ekonomik durumu ve idarî yapısı hakkında transkripsiyonu yapılan belgelerden istifade edilerek bilgiler verilmiştir."
