abstract: "Müslüman bir devletin gelir ve giderleri arasındaki dengeyi sağlayabilmesi, gerektiğinde İslâm hukuku çerçevesinde borçlanması için Hz. Peygamber ve râşid halifeler döneminde uygulanan kamu maliyesi, kamu maliyesinin araçları, borçlanmanın şartları ve şekillerinin bilinmesi önem arz etmektedir. Çalışmada klasik dönemde uygulanan İslâm kamu maliyesi araçlarının incelenip günümüzde uygulanabilirliğini ortaya koymak, İslâm hukukuna göre devletin borçlanma şekillerini incelemek, kullanılan borçlanma araçlarının fıkhî tahlillerini yapmak ve alternatif borçlanma araçlarını meydana çıkarmak amaçlanmıştır. İslâm kamu maliyesi ile ilgili bazı çalışmalar yapılmışken İslâm devlet borçlanmasına dair klasik ve modern dönemde yazılmış müstakil bir esere rastlamadık. Sadece bazı kaynak ve çalışmalarda borçlanma araçlarına değinilmiştir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde cizye ve haraç vergileri, savaş gelirleri, zekât, yer altı ve denizden çıkarılan maden gelirleri, arazi tahsisleri ve kamu çalışanlarının maaşları konuları işlenmiştir. Daha çok klasik dönem eserlerinden yararlanarak işlenen bu vergi türlerinin günümüzde de uygulanabilirlikleri üzerinde durulmuş ve bu çerçevede Müslüman ülkelerde yaşayan gayrimüslimlerden baş vergisinin alınabileceği ve zekâtın verileceği sekiz sınıfın daha geniş olabileceği ortaya konulmuştur. Çalışmanın ikinci bölümünde ise devlet borçlanmasının geçmiş dönemlerde yapılış şekilleri, devlet borçlanmasının nedenleri, sınırı, kısımları, araçları, bu araçların fıkhî tahlilleri, bazı borçlanma modelleri ve örneklik açısından Müslüman ülkelerden Suudi Arabistan, İran, Malezya ve Pakistan'ın borçlanma şekilleri işlenmiş, son olarak da İslâm hukukuna uygun alternatif borçlanma araçları olarak mukâraza ve modern esham ele alınmıştır. Çalışmanın sonucunda klasik İslâm kamu maliyesi araçlarının günümüzde uygulanabilirliği, faizli görüldükleri için İslâm hukukçuların geneline göre caiz görülmeyen borçlanma araçlarının Müslüman ülkelerde kullanıldıkları, İslâm hukukuna göre devlet borçlanmasına mukâraza ve esham gibi bazı alternatif araçların geliştirilebileceği ve zekâtın daha geniş çaplı kullanılması sonucunda devletin yükünün hafifleyeceği görülmüştür."
