abstract: "Bu araştırmada, temel kavramlar, başlıca ilke ve prensipler, ilmî veriler, güncel yaklaşımlar, farklı mezhep görüşleri ve bu görüşlerin dayanmış olduğu Kur?an ve Sünnet?teki referanslar çerçevesinde, Müslümanlar için son derece önemli olduğuna inandığımız ?helâl gıda? problemi ele alınmıştır. Araştırma giriş ve onu takip eden dört bölümden oluşmaktadır. Giriş bölümünde, araştırmanın konusu, önemi, amacı, sınırları, kaynakları ve metodu hakkında bilgi verilmiştir. Birinci bölümde, konuyla ilgili kavramlar tahlil edilmiş, helâl ve haramlar alanında geçerli olan ve bu konudaki güncel problemlerin çözümüne de ışık tutacak olan temel ilke ve prensipler tespit edilmeye çalışılmış, gıdaların haram kılınma sebepleri ve haramlarla ilgili yasaklayıcı hükümlerin ortak yönleri tahlil edilmiştir. İkinci bölümde belli bir tasnif altında nasslar ve mezhep yaklaşımları perspektifinden İslâm?ın haram kıldığı yiyecek ve içecekler ele alınarak konuyla ilgili genel bir çerçeve çizilmiştir. Üçüncü bölümde helâl gıda konusu için son derece önemli olan ve birçok endüstriyel gıdanın şer?î hükmünü tespit etmede önemli bir asıl olan istihâle ve istihlâk kavramlarına açıklık getirilmiş ve konuyla ilgili mevzular kapsamlı bir şekilde tahlil edilmiştir. Dördüncü bölümde ise, gıda katkı maddeleri, jelâtin, karmin, kefir ve boza, hayvansal maya ve modern kesim usulleri gibi hâlâ güncelliğini koruyan ve farklı toplantılarda müzakere mevzuu olmaya devam eden güncel problemler üzerinde durulmuştur."
