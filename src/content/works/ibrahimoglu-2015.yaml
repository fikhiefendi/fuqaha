title: "الإصلاح والثورة في الفكر السياسي عند ابن تيمية وأثرهما على الجماعات السلفية في مصر"
titleTranslation: {"tr": "İbn teymiyye'ye göre siyasi düşüncede reform ve devrim ve bunların mısır'daki selefi gruplar üzerindeki etkisi"}
