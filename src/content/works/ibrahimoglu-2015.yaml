fullText: "https://tez.yok.gov.tr/UlusalTezMerkezi/TezGoster?key=LY6e5xGA7WWUpEdrBmEPLrkeMa_3AUded9EZavXiu5j3Xt262d2yu7jXGRA46Ok_"
abstract: "Bu araştırmanın dört bölümünde sunulanlar üzerinden, ilk bölümde İmam Ahmed ibn Teymiyye'nin hayatı ve mezhebi, dönemindeki siyasi durum ve çağdaşı en önemli siyasi grup ve doktrinlerin sunulması ele alındı. İkinci bölümde Mısır'da çağdaş Selefi grupların ortaya çıkışı ve değişim metodları, entelektüel oluşumlarını etkileyen en önemli ekoller ve bu grupların benimsediği değişim yaklaşımları ele alındı. Üçüncü bölümde İbn Teymiyye'nin reforma yaklaşımı, gördüğü siyasi reform alanları ve bunun çağdaş Selefi grupların siyasi düşüncesi üzerindeki etkisinin izini sürmeye çalıştık. Dördüncü bölümde İbn Teymiyye'nin devrim vizyonu, alanları ve araçları ile çağdaş Selefi grupların siyasi düşüncesi üzerindeki etkisi ele alındı. Bu araştırma, İbn Teymiyye'nin aşağıda sunduğumuz düşüncesiyle Mısır'daki çağdaş Selefi grupların etkisinin boyutlarını ortaya koyan bir takım sonuçlara ulaşılmıştır: 1- İbn Teymiyye'nin siyasi düşüncesinin oluşumunda, Abbasi İslam Hilafeti'nin yıkılmasından itibaren ilmi, edebi ve sanatsal liderliğinin son anlara kadar devam etmesi, askeri güç ve metanetten yoksun olması gibi birçok faktör bir araya gelmiştir. Daha sonra İslam dünyasının askeri zayıflığı nedeniyle defalarca Haçlıların ve Tatarların istilasına maruz kalması, İbn Teymiyye'nin dinin ancak Kur'an ve kılıç birlikteliğiyle tesis edilebileceğini sürekli tekrarlamasına neden oldu. Yöneticilerin Kur'an ehlini ve kılıç ehlini uzlaştırmaya çalışmaları gerekir. 2- Abbasi İslam Halifeliğinin dağılması ve maddi ve idari yolsuzluk ve adaletsizliğin yayıldığı zayıf İslami birimler veya devletlerin ortaya çıkmasıyla birlikte İbn Teymiyye, İslam şeriatının üstünlüğünü tasdik etmeye ve onu terk edenlerin inançsızlığını vurgulamaya çağırdı. Adalet ve dürüstlük ilkesini vurguladı ve kendisini kardeş edininceye kadar adaletsizliğin her türlüsüyle mücadele etti. İnançsızlıkla karşı karşıya kaldı ve gerçeği kabul ederek Müslüman devletindeki yasama, işlevsel ve ekonomik modelde reform yapma girişimine girişti. Halifeliğin düşüşüyle ilgili olanlar, ona halifeliğin düşmesinin, galip olanın emirliğinin ve fethedenlere kulak vermenin ve itaat etmenin caiz olduğunu kabul etmesini sağladı. 3- İster Haçlılarla birlikte Maruniler, ister Tatarlarla birlikte Şiiler ve Hıristiyanlar olsun, bu mezheplerin Sünni Müslümanlara yönelik bir komploları onun eserlerinde ve öğrencisi İbnü'l-Kayyim'in eserlerinde en büyük etkiye sahipti. Günümüzde gayrimüslimlerle ilişkilerde İslam şeriatının hükümlerini bilmek İslami hareketler için birincil referans haline gelmiştir. 4- İbn Teymiyye'nin dönemi, kendi döneminde ortaya çıkan tüm mezheplere karşı Sünnileri savunmak için ayağa kalkarken, düşüncesini açıkça etkileyen çok sayıda mezhep ve önemli olaylarla karakterize edilmiştir. Öyle görünüyor ki, yabancı işgalinin Şam Diyarı'na gelmesinden sonra Sünnilere karşı savaşmak ve kendilerini onlardan korumak için bir araya gelmişler, bu da dilini onlara karşı sert hale getirmiş ve bu durum bugün ötekini reddetme ve uzlaşma imkanının olmayışıyla Selefi düşüncesinde de yansımıştır. 5- İbn Teymiyye aşırılıkçı alimlerden biri değildi. Ancak İbn Teymiyye'nin durumunu ortaya çıkaran ortamın doğasını veya Teymiyye fetvalarının ve içtihatlarının koşullarını dikkate almayan çağdaş Selefi siyasi düşüncesinin üretimine katılan çağdaş, dikkatsiz bir okuma, bunun böyle olduğunu göstermiş olabilir. 6- İbn Teymiyye, yöneticinin milliyetine veya ırkına önem vermezdi, idareyi zorla ele geçirenin yönetimini reddetmezdi, aksine fiili duruma dayanarak onu onaylardı. Darbelerin bol olduğu dönemdeki Memlük hükümdarları, zorba emirlerden başka bir şey değillerdi. İbn Teymiyye onlara teslim oldu ve haksız da olsa insanları dinlemeye ve itaat etmeye çağırdı. Onun için Tatar meselesi direneceği, biat yemininin meşruiyetini savunacağı bir yabancı işgali değildi. Ama sorun (Yasik'in hükmü) idi. Dolayısıyla İbn Teymiyye'nin Tatarlarla olan ilişkileri aslında işgalci bir yabancı ülkeye karşı bir savaş değil, iktidardaki rejime karşı bir devrimdi. İbn Teymiyye'ye göre, halka galip gelen, onları Allah'ın Kitabı'na göre yönetmesi şartıyla işitilen ve itaat edilen bir hükümdar olur. 7- İbn Teymiyye, kendi döneminde İslam devletini etkileyen, hayatın çeşitli yönlerinde İslam ruhunun kaybı olarak gördüğü, yolsuzluk, adaletsizlik ve güven kaybının yaygınlaştığı hastalığa değindi.“Kitab ve Demir ittifakı”nda çareyi anlatmış ve saldırganlar onu yok edinceye kadar bu ruhu korumak için, daha önce de açıklandığı gibi, hem teorik hem de pratik yönleri olan bir direniş teorisi yaratmıştır. 8- İbn Teymiyye, şeriat hukukunun otoritesini, onu terk etmenin ve bunun dışında bir şeye başvurmanın küfür olduğunu vurgulayarak başladı. Daha sonra Müslümanların o dönemdeki zahiri zayıflığını göz önünde bulundurarak, İslam alemi arasında işbirliği, yardımlaşma ve ortak savunmaya yönelik bir anlaşmayı temsil eden sadakat ve inkar ilkesini kurdu. Dini ve dünyayı bozan işgalci düşmanı defetme yeteneğini kazanmak, ardından toprağa ve namusa saldıran düşmanı defetmek üzere yola çıkmak için hazırlık yapılması hipotezini vurguladı. 9- Genel olarak Selefi-cihad hareketinin, Vehhabi Selefiliğin, Seyyid Kutubun metoduyla harmanlanarak, çağdaş Mısır toplumuna göre şekillenip uyarlanma yeteneği kazandıran bir uygulaması olduğu ortaya çıktı. 10- Bazı reformcu Selefi hareketler, görünürde siyasette çalışmalarına ve siyasetle meşgul olmalarına rağmen, demokratik ya da şiddet içeren değişim sürecini kısıtlamak suretiyle siyasi denklemde olumsuz yönde etkili bir figürdür. İster demokratik ister parlamento meclisleri, kamusal eylemler veya gösteriler yoluyla siyasi katılımın kutsallığını tesis ederek ve şiddet içeren devrimci değişimle şiddet içererek sona erdirerek olsun . 11- Selefi gruplar, bir takım düşünür ve hareket gruplarının bir araya gelmesi sonucu ortaya çıkmış ve pratikte reformist ve devrimci hareketler olarak ikiye ayrılmıştır. İki tür, gerçekçi uygulama açısından farklılık gösterse de, referansın niteliği veya entelektüel temelleri açısından farklılık göstermedi. En sağdan en sola kadar Selefiler arasında bu sorunla nasıl başa çıkılacağı konusunda tam bir anlaşmazlık yoktur. Ancak anlaşmazlık, kiminle muhatap olmam gerektiğiyle ilgilidir: Kâfir bir hükümdarla mı, yoksa meşru bir hükümdarla mı? Bu, onların modern sivil devleti tanımlamalarındaki bir anlaşmazlıktır. 12- Selefilik, ister iktidardaki rejime karşı silaha sarılsın, ister cihatçılar gibi onunla savaşsın, ya da onu savunmak için ayağa kalkan ve silahla ya da gösterilerle, hatta ona karşı isyan etmenin caiz olduğuna yürekten inanarak ona karşı her türlü muhalefeti yasaklayan her iki biçimiyle de, Mısır'ın siyasi durumunu açıkça etkilemiştir. 13- İskenderiye Selefi çağrısının durumu, sopayı ortada tutma durumu gibi kalır. Devrimcilerin entelektüel önermelerinde büyük ölçüde hemfikir olmuş ve arzu ettikleri siyasi değişimi gerçekleştirme ve iktidardaki rejimi kendi görüşlerine göre İslam hukukuna dayalı başka bir rejimle değiştirme becerisini kazanmak amacıyla vaaz vermeye ve taraftar toplamaya başlamıştır. Ancak pratikte her zaman siyasi sistemi desteklemek ve istikrara kavuşturmak için çalışan Medhali hareketi ile aynı işi yürüttü ve sanıldığı gibi tam tersi olmadı. 14- Selefi grupların ekonomik alanda grubun genel olarak benimsediği eğilimlerin bulunmadığı, devlette ekonomik düşüncenin veya ekonominin şekline dair bir vizyonun varlığına işaret etmektedir. Ancak ekonomik eğilimlerden ziyade, rüşvetin yasaklanması, hakların sahiplerine devredilmesi gibi neyin caiz, neyin haram olduğunu belirten bazı fetva veya makalelere de rastlayabiliyoruz. Bunların İbn Teymiyye'ye bu konuda açık bir etkisi yoktur. 15- İbn Teymiyye'nin ortaya koyduğu fikirler onun kanun koyucunun manasını, deyim yerindeyse kanun koyucunun mantığını anlama çabasıdır. Teymiyye'nin siyasi düşüncesini araştıran, onun külli kaideler ve hedefler, sistemi veya modeli oluşturan sokağın düzenlerini siyaset alanında uygulayarak devletin ve İslam toplumunun genel güvenliğini sağlayan bir sistemin bileşeni olarak kabul edilmektedir. 16- İbn Teymiyye'ye göre reform alanlarına gelince, onun temel dayanağının siyasi doktrinin reformu ve İslam doktrini üzerine saf inşası olduğunu görüyoruz. Dini ve dünyevi olanı bünyesinde barındıran, ardından kamu işlevleri ve ekonomi alanını yeniden düzenleyen, ardından devleti ve İslami sistemi diğer güçlerin saldırılarından korumak için kültürel güvenlik, hisbe ve askeri güvenliği içeren ulusal güvenlik alanı, içinde yıkım aracı görevi görebilecek güçler, medeniyetler, dinler veya mezhepler. 17- Teymiyye'nin reformunun adalet ve dürüstlüğe ulaşma etrafında dönen araçları ve bunlardan çıkan araçlar, İbn Teymiyye tarafından çeşitli siyasi alanlarda reform sağlamak için dile getirilmiştir. 18- Teymiyye'nin reform modeli Mısırlı Selefi grupların entelektüel temelleri ve siyasi davranışları üzerinde etkisinin yok denecek kadar az olduğunu söyleyebiliriz. 19- Farklı bir durumda yaşayan cihatçı gruplar, yalnızca siyasi birimlerin biçiminin tamamen ulusal devletlere dönüşmesinde değil, aynı zamanda ister devlet düzeyinde ister bireysel düzeyde olsun entelektüel ve kavramsal yapıda da temsil edilmektedir. Cihatçı gruplar, Teymiyye'nin modeline birçok bilimsel ve pratik soruna yol açan bir miktar kutsal görüntü ekleyerek onun modelini tam anlamıyla çağdaş gerçekliğe uygulamak için almışlardır."
