abstract: "Bu çalışma, Şihâbuddîn el-Karâfî'nin (ö. 684/1285) Hz. Peygamber'in tasarruflarına, fillerine ve haber teorisi bağlamında hadis usûlüne dair görüşlerini incelemektedir. Mısır'da yetişen ve ilmî şahsiyetini burada oluşturan Karâfî, Mâlikî mezhebine mensup olup İslâm hukukuna derin tesirlerde bulunmuş mümtaz bir âlimdir. Çalışmanın ilk bölümünde Karâfî'nin yaşadığı VII./XIII. yüzyılın ilmî ve siyasî şartları ele alınmış; hocalarıyla kurduğu ilişki ve aldığı tedrisatın onun ilmî terbiyesindeki rolü incelenmiştir. Devamında Karâfî'nin şahsiyeti, fıkıh, usûl, kelâm ve aklî ilimlerle geliştirdiği çok yönlü temas çerçevesinde değerlendirilmiş; hadis usûlüne dair yaklaşımının bu zemin üzerinde nasıl teşekkül ettiği gösterilmiştir. Ardından Karâfî'nin Hz. Peygamber'in tasarruflarını yorumlama tarzı ele alınmıştır. Karâfî, Hz. Peygamber'in söz, fiil ve takrirlerini tek bir hüküm kategorisine indirgememiş; bunları tebliğ, fetvâ, kazâ ve imâmet gibi farklı vazifeler bağlamında tasnif ederek her birinin bağlayıcılık derecesini tartışmıştır. Bu tasnif, hadislerin ilmî ve amelî değerini tayinde önemli bir işlev görmüş; sonraki usûlcülere de sağlam bir usûl çerçevesi sunmuştur. Karâfî'nin eserlerinde meseleleri işlerken takip ettiği yöntemin karşılaştırmaya dayalı olduğu görülmektedir. Bu çalışma da onun ilmî üslubuna uygun biçimde, meselenin farklı yönlerini birlikte ele alma gayreti taşımaktadır. Çalışmanın müteakip kısmında Karâfî'nin haber nazariyesi tafsilatlı biçimde incelenmiştir. Mütevâtir ve âhâd haber ayırımına ek olarak literatüre kazandırdığı“münferid haber”kavramı, bu üçlü taksim arasındaki ilmî mertebe farkları, haberin amel bakımından değeri ve râvînin güvenilirliğini tayinde kullandığı ölçüler değerlendirilmiştir. Karâfî, haberin hakikat değeri ile bilgi ifade etme kudreti arasındaki ilişkiyi usûl, mantık ve dil ilimlerinin kaideleri ışığında tahlil etmiş; bu esnada, şerhini yaptığı Fahreddin er-Râzî'yi (ö. 606/1210) birçok noktada tenkit etmiştir. Bu çalışma, Karâfî'nin usûl anlayışını yalnızca nakletmekle yetinmemiş; onu kendi bütünlüğü içerisinde yorumlayıcı bir yaklaşımla yeniden ortaya koymaya çalışmıştır. Böylelikle klasik hadis usûlü mirasının, günümüz ilmî araştırmalarında daha geniş bir nazarî çerçevede değerlendirilmesine katkı sağlanması hedeflenmiştir."
