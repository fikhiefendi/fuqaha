abstract: "Şer'iyye Sicilleri, ihtiva ettikleri idarî, siyasî, askerî ve sosyal nitelikli belgelerden dolayı Osmanlı Tarihi'ne ışık tutan kaynaklardır. Biz de bu önemli kaynaklardan biri olan 61 numaralı Amasya şer'iyye sicilini çalışmamıza konu edindik. Hicrî 1198-1199, Miladî 1784-1786 yıllarım kapsayan sicili incelerken öncelikle, Osmanlı adalet sistemi, kadılık ve şer'iyye sicillerine değindik. Daha sonra içeriğindeki belgelerin özetleri ile transkripsiyon metinlerim verdik. Bu metinlerden yola çıkarak yaptığımız değerlendirmelerde de Sivas Eyâleti'ne bağlı, dört nahiyeden müteşekkil bir sancak olan Amasya'nın bu dö nemde idarî, siyasî, askerî, iktisadî ve sosyal yapılan üzerinde durduk."
