abstract: "Fıkıh usûlüne dair bir tartışmayı konu edinen bu tez Osmanlı son dönem hukukçularından Mansûrizade Said ile İzmirli İsmail Hakkı Beylerin fikirleriyle sınırlandırılmıştır. Bir hayli usûl ve furû' meselenin tartışmaya açıldığı II. Meşrutiyet dönemine ait bu araştırma son dönem Osmanlı aydınlarının fıkhî ve fikri mesaisini yansıtmaya yönelik bir çaba olarak da görülebilir. Bu tez aile hukukuna ait bir çalışma olup özellikle çok eşliliğin yasaklanmasını teklif edenlerin usûl görüşünü konu edinmektedir. Tezin birinci bölümü 1917 Hukûk-ı Aile Kararnamesi öncesindeki hukuk tartışmalarını, kararnamenin getirdiği yenilikleri ve Mansûrizade Said ile İzmirli İsmail Hakkı Beylerin hayatlarına ayrılmıştır. Çok eşliliğin yasaklanmasının uygun olup olmadığı tartışmalarında Mansûrizade Said müspet, İzmirli İsmail Hakkı ise menfi yaklaşım sergilemiştir. Tezin birinci bölümünde taaddüd-i zevcâtın yasaklanmasına müspet tavır sergileyen Mansûrizade Said'in yaklaşımına temel teşkil eden usûl görüşü incelenmiştir. Caizin şer'î bir hüküm olmadığı, dolayısıyla şeriatın dışarısında kaldığı ve caizde ulü'l-emrin tasarrufunun bulunduğu, poligamiyi ulü'l-emrin yasaklamasının mümkün olduğu görüşleri Mansûrizade Said Bey'in temel yaklaşımlarıdır. İzmirli İsmail Hakkı Bey caizin şer'î bir hüküm olduğu, şeriatın hududu helal ve haramlar çevrili olduğundan caiz/mübahın şeriatın hududu içerisinde sayılması gerektiği, taaddüd-i zevcâtın mubahlık hükmü, ulü'l-emr tarafından değiştirilecekse dinin diğer emirleri ya da yasakları hakkındaki yaklaşımlarda olduğu gibi şer'î bir nedenin bulunması gerektiği görüşlerindedir. İzmirli İsmail Hakkı Bey'e göre çok eşliliğin yasaklanması içinse ne şer'î ne de aklî bir delil bulunmaktadır. İzmirli İsmail Hakkı Bey'in bu görüşlerine ve Mansûrizade Sait Bey'e getirdiği diğer tenkitlerine ise tezin üçüncü bölümünde yer verilmiştir."
