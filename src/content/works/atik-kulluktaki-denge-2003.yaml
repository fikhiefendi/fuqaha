abstract: "Bu çalışma İslam Hukuk alanında, müslümanın kişisel ve sosyal hayatıyla yalandan ilgili olan iki kavramı incelemektedir. Azimet ve ruhsat nedir? Ruhsat; rahatlık, kolaylık, ayrıcalık anlamlarında, azimetin karşılığı olan bir kavramdır. Azimet ise ikinci dereceden kurallar olan ruhsatın karşılığı olarak, yine birinci dereceden kurallar olarak konulan genel emirlerdir. Ruhsat, dini emirlerin zorluktan kolaylığa doğru yumuşadığım gösterir. Ruhsat; İslam Hukukunun, hayata ve o hayatın şartlarına uyumunu sağlar. Yine ruhsat mükellefin fiillerinin Allah tarafından yumuşatıldığını gösterirken azimet ise aksine mükellefin olağan durumlarıyla ilgili olan Allah'ın kurallarım gösterir. Çünkü İslam Dini ve İslam Hukuku insanlara rahmet olarak gönderilmiştir."
