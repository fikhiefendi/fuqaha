abstract: "Fakih ve muhaddis İbnu's-Salah, h. 577-643 yılları arasında yaşamış ve muhtelif ilimlerde eser telif etmiş Şafiî mezhebinin büyük alimlerinden biridir. Bu çalışmamızda İmam İbnu's-Salah'ın ilmî şahsiyetini, genelde İslam Hukuku, özelde Şafiî fıkhıyla alakalı ilmî çalışmalarını , mezhepteki etkisi ve mertebesini ele aldık. Ayrıca İbnu's -Salah'ın yöntemini, eserlerini ve kaynaklarını inceleyerek fetvalarını ve tercihlerini tartışarak yaptığı değerlendirmeleri tespit etmeye çalıştık. Çalısmanın sonucunda İbn Salah'ın (rh) Şafii mezhebinde kaynak gösterilen/atifta bulunulan önemli sahsiyetlerden biri olduğu sonucuna ulaştık. İbn Salah, hicri 643-577 yılları arasinda yaşamış, kendi asrının fazilet sahibi erbabından biridir. Zira bir çok ilmi seyahatler yapmış, beslendigi kaynaklar çoğalmış, ilgilendiği ilimlerin çesitliliği artmış, muhtelif ilimde bir çok eser vermiştir. Onu anlatan alimler onun usul alimi, hafız ve hadisçi bir alim olduğunda hemfikirdirler. Ulastığım diğer bir sonuç da onun kisiliği ve fıkıhcılığı ekseninde konuşmak onun hakkında daha büyük çalışmaları gerekli kilmaktadir. Zira onun gayretleri ve Şafii mezhebindeki mirasI bundan fazlasını hakkediyor.."
