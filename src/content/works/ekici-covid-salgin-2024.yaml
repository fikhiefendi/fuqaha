abstract: "Bu çalışmada Covid-19 salgın döneminin Türk bankacılık sektörü üzerindeki etkisini analiz edebilmek amacıyla bankaların aktif kalitesinin bir göstergesi olarak kabul edilen takipteki kredi oranının makroekonomik değişkenlerle olan ilişkisi analiz edilmiştir. Covid-19 salgın dönemi özelinde yakın izlemedeki krediler ile takipteki kredilere getirilen 90 & 180 gün gecikme uygulaması sebebiyle kredilerde oluşabilecek bozulmaya ait gerçek etkinin ölçülemeyeceği varsayımıyla yeniden yapılandırılan krediler dâhil olmak üzere yakın izlemedeki kredileri içine alan yeni bir sorunlu alacak oranı oluşturulmuştur. Ek olarak takipten satışları ve silinen tutarları da içine alan ikinci bir sorunlu alacak oranı hesaplanarak analizler 3 farklı bağımlı değişken ile yapılmıştır. Çalışmada mevduat ve katılım bankaları özelinde Covid-19 salgın döneminin etkilerinin farklılaşıp farklılaşmadığını tespit amacıyla karşılaştırmalı analizlere yer verilmiştir. Çalışmada ekonometrik yöntem olarak çoklu panel veri analizi tercih edilmiş olup makro değişken olarak işsizlik, reel efektif döviz kuru, imalat sanayi endeksi, GSYİH büyüme oranı ve ticari kredi faiz oranı kullanılmıştır. Yapılan analizler sonucunda birçok modelde sadece işsizlik ile mevcut takipteki kredi oranı ve yeni sorunlu alacak oranları arasında pozitif yönlü ve anlamlı bir ilişki olduğu tespit edilmiştir. Mevduat bankalarının Covid-19 salgın dönemi öncesi ve salgın dönemine ait sorunlu alacak oranı ile işsizlik oranı arasında belirgin bir ilişki olduğu görülmüş ve salgın dönemine ait farklılaşma net bir şekilde gözlemlenmiştir. Diğer taraftan katılım bankaları için yeni sorunlu alacak oranı ile işsizlik arasında anlamlı ve pozitif yönlü bir ilişkinin varlığından söz edilebilirken Covid-19 salgın dönemi özelinde farklılaşmanın olmadığı gözlemlenmiştir. Sonuç olarak çalışmada, katılım bankalarının krizlere karşı daha dayanaklı olduğu yönündeki görüşleri destekleyen sonuçlar elde edilmiştir."
