abstract: "Îcâzı ve muhtevâsı yönüyle son derece önemli olan İhlâs Sûresi üzerine gerek mutasavvıflar, gerekse müfessirler tarafından pek çok tefsir yazılmıştır. Vahdet-i Vücûd ekolünün önemli isimlerinden olan Sadreddin Konevî'ye nispet edilen Mevâridü Zevi'l-İhtisas ilâ Makâsıdı Sûreti'l-İhlâs adlı eser de bunlardan biridir. Eser, her ne kadar Süleymaniye Kütüphanesi'nde Konevî'ye ait olarak kayıtlara geçmiş olsa da çalışmamız esnasında bu nispetin yanlış olduğunu, kitabın asıl müellifinin VIII/XIV. yy.'da Mısır'da yaşamış olan, Şâziliyye'nin önemli şeyhlerinden Nâsıruddin İbnü'l-Meylak olduğunu tespit ettik.Bir giriş üç bölüm bir de ekler kısmından oluşan tezimizde Mevârid'in tahkikli metni, tercümesi ve tahliline yer verdik. Eserde bir işârî tefsir olmasına rağmen tasavvufî konulara fazlaca değinilmemiş klasik tefsirlere paralel yorumlarda bulunulmuştur. Mevârid, işârî tefsirler arasında bu yönüyle öne çıkmaktadır.Sonuç itibariyle eser, konuları âyet ve hadisler ışığında ele alan tasavvufun temel konularına fazla girmeyen içtimâî, kelâmî bir tefsir niteliğindedir."
