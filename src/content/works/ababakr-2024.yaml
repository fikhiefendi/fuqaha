abstract: "Bu araştırma, İmam Zekeriyyâ el-Ensârî'nin“Esne'l-Meṭâlib Şerḥu Ravżi'ṭ-Ṭâlib”adlı kitabında yer alan fıkhî kaideleri çıkarmayı, konuyu kısaca incelemeyi ve çağdaş fıkıh meselelerini sunmayı ve analiz etmeyi,“Esne'l-Meṭâlib”kitabında yer alan fıkhî hükümleri ortaya koymayı ve bu fıkhî hükümlerin onların hükümleri üzerindeki etkisini açıklamayı amaçlamaktadır. Çalışma, araştırmacının fıkıh kaidelerini bünyesinde toplamaya çalıştığı“Esne'l-Meṭâlib Şerḥu Ravżi'ṭ-Ṭâlib”kitabına bir hizmet niteliğindedir. Bireysel araştırmalarda fıkıh kaidelerini geliştirmiş, İslam kütüphanesini, fıkıh kaideleri bilimi ve çağdaş hukuk bilimi alanında uzmanlaşmış bir çalışmayla zenginleştirmek ve bilinmesi ve yargılanması gereken bir takım çağdaş hukuk konularını fıkıh kaideleri aracılığıyla açıklığa kavuşturmak üzere bunları gramer bilimi alanında öne çıkarmıştır. Araştırmacı, araştırmasında çeşitli bilimsel yöntemleri takip etmiştir: Tümevarımsal, analitik ve uygulamalı yaklaşımlar; burada,“Esne'l-Meṭâlib Şerḥu Ravżi'ṭ-Ṭâlib”kitabını, içerdiği fıkıh kaidelerini çıkarmak için incelemiştir. Daha sonra bu kaideleri analiz etmiş ve bu çalışmada açıklamıştır. Bu kaidelerin bir kısmını bazı fıkhî konulara da uygulamış ve bunlardan hükümler çıkarmıştır. Araştırma, aşağıdakiler de dahil olmak üzere çeşitli sonuçlara ulaştı: İmam Zekeriyyâ el-Ensârî'nin fıkıh kaideleri konusunda uzun bir geçmişi olduğu görülüyor; Zira fıkhî hükümler, kendileri için altın çağ sayılan hicrî sekizinci yüzyılda olgunlaşıp mükemmelleşmiş olduğundan, fıkıhla ilgili en iyi kitaplar İslam Şeyhinin yaşadığı dönemde yazılmış olup; Bu nedenle onun fıkıh kaidelerine ilişkin kitaplarına olan ilgisini ve bahsettiği fıkıh meselelerinde hüküm vermek için fıkıh kurallarını kullandığını, araştırmamız sırasında netleşeceği üzere görüyoruz. Sonuçlar arasında ayrıca fıkhî kaidelerin güncel meselelere ilişkin hüküm vermede önemli bir etkiye sahip olduğu da yer almaktadır. Ayrıca“Esne'l-Meṭâlib”de yer alan bazı fıkhî kaideleri günümüz fıkhî meselelerine uyguladık."
