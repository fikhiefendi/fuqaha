abstract: "Hanefi mezhebinin temel metinlerden olan Ebü'l-Hüseyn el-Kudûrî'nin el-Muhtasar isimli eseri yazıldığı tarihten itibaren Hanefi âlimlerin teveccühüne mazhar olmuş ve hakkında sayısız çalışmalar yapılmıştır. Ebu Nasr el-Aktaʿ'ın Şerhu Muhtasari'lKudûrî isimli eseri de bu çalışmalar arasında önemli bir yere sahiptir. Ebu Nasr elAktaʿ'ın, bizzat Kudûrî'nin talebesi olması ve eserinin el-Muhtasar üzerine yazılan ilk şerh olması, eserin kıymetini arttıran bir başka husustur. Ebu Nasr el-Aktaʿ'ın bu eserini konu edinen tezimiz, beş bölümden oluşmaktadır. Giriş bölümünde konunun ehemmiyeti, mahiyeti, çalışmanın kaynakları ve literatür değerlendirmesi üzerinde durulmuştur. İkinci bölümde Ebu Nasr el-Aktaʿ ve Ebü'lHüseyn el-Kudûrî'nin biyografileri verildikten sonra Muhtasaru'l-Kudûrî şerhleri arasında Ebu Nasr el-Aktaʿ'ın yeri saptanmaya çalışılmıştır. Üçüncü bölümde eserin kaynakları ve iç tasnif açısından tahliline yer verilmiştir. Dördüncü bölümünde eserin muhtevası açısından tahliline değinilmiştir. Elde ettiğimiz çıktılar, sonuç bölümünde paylaşılmıştır."
