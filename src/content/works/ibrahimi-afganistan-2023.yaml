abstract: "Afganistan'ın İslamiyet'le tanışması Miladi VII. yüzyıla tekabül eder. İslam'ın gelmesi ile beraber topluca Müslüman olan Afgan halkı, o günden beri İslamî kurallar ve hükümlerle yöneltilmiştir. 1977 yılında yürürlüğe giren ve 2021 yılı Taliban'ın ülkeyi ele geçirmesine kadar yürürlükte kalan Afganistan Medeni Kanunu, Kur'ân ve sünnet ışığında şekillenmiştir. Fıkıh dışına çıkmadan, yeniliğe açık bir yol takip edilerek hazırlanan Afganistan Medeni Kanunu'nunda her zaman Hanefî mezhebi diğer mezheplere göre daha öncelik tutulmuştur. Bununla beraber mezhebi taassuba gidilmemiş, hazırlanma aşamasında genelde İslam hukuku ve özelde Hanefi mezhebi esaslarına bağlı kalmakla birlikte, dört Sünni mezhep ve müçtehit âlimlerin görüşünden de istifade edilmiştir. Afganistan halkının %99'u Müslüman olup, bunların % 80'ini Sünniler, geri kalanını da Şiîlerden oluşturmaktadır. Bu çalışmada Afganistan Sünnilerine hitabeden, 1977-2021 yılları arasında yürürlükte kalan Afganistan Medeni Kanunu'nun \"Boşanma\" bölümü dört Sünni mezhep açısından mütalaa edilerek Osmanlı Hukuk-ı Aile Kararnamesi ile mukayesesi yapılmıştır. Tezimiz üç bölüm ve bir sonuçtan meydana gelmiştir."
