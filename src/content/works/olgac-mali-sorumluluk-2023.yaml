abstract: "Bu çalışma, fıkıh literatüründeki yed kavramını mali sorumluluk açısından incelemektedir. Meseleyi dört mezhebin önemli kaynaklarını esas alarak mukayeseli bir şekilde inceleyen bu tez çalışması giriş ve sonuç dahil toplam beş bölümden oluşmaktadır. Kavramsal çerçeve bölümünde yed, damân, emânet ve teaddî kavramlarına değinilmiş; ardından yed-i damân ve yed-i emânet terkipleri incelenmiştir. Sonraki bölümde ise fıkıh eserlerinde mali sorumlulukları açısından çokça atıf yapılan zilyetlik türlerinden on tanesi inceleme konusu yapılmıştır. Bu zilyetlik türleri gasp, sevm, vedîa, lukata, şirket, vekâlet, mudârebe, icâre, âriyet ve rehindir. Yed-i damân ve yed-i emânet terimleri İslam hukukunda hicri dördüncü asırdan beri mali sorumluluk açısından zilyetlik türlerini ayırt etmede kullanılmaktadır. Yed-i damân, zilyedi kusuru olmasa da oluşan zarardan sorumlu tutan zilyetlik için kullanılmıştır. Yed-i emânet ise kusuru olmadığı müddetçe zilyedin sorumlu tutulamayacağı zilyetliği ifade eder. Bu açıdan bakıldığında bu tezde incelen on zilyetlik türü yed-i damân hükmünde olanlar, yed-i emânet hükmünde olanlar ve mezhepler arasında hükmü ihtilaflı olanlar şeklinde üçe taksim edilebilir. Bu çalışma yed-i damân ve yed-i emânet kavramlarının İslam hukukunda icra ettiği fonksiyonu göstermekte ve bir sorumluluk kaynağı olarak zilyetliğe dikkat çekmektedir."
