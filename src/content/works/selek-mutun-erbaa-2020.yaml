abstract: "Hanefî mezhebi tarihinde önemli bir yere sahip olan Burhânüşşerîa'nın Vikâyetü'r-rivâye fî mesâili'l-Hidâye'si, Mevsılî'nin el-Muhtâr li'l-fetvâ'sı, İbnü's-Sââtî'nin Mecmau'l-bahreyn ve mülteka'n-neyyireyn ve Nesefî'nin Kenzü'd dekâik'indeki birbirleri arasındaki farklı tercihlerin incelendiği bu çalışma, giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bölümünde araştırmanın yönteminden, gayesinden, sınırlarından ve kaynaklarından bahsedilmiştir. Birinci bölümde, Hanefî mezhep tarihinde telif edilen muhtasar metinler, metinlere fetvâ ve mezhep içi tercihte atfedilen değer ile Mütûn-i Erbaa kapsamında değerlendirilen metinler incelenmiştir. İkinci bölümde, ibadet meseleleri özelinde dört metnin kendi aralarında tercih konusunda farklılık bulunduğu tespit edilen meseleler, İmam Muhammed'in eserlerinden son döneme kadar mukayeseli bir şekilde ele alındı. Sonuç kısmında ise araştırma neticesinde elde edilen verilere temas edildi."
