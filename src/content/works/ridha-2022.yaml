abstract: "Bu araştırma, Kerkük'te İslami bankacılık hizmetlerinin kalitesini artırmada entelektüel sermayenin etkisini göstermeyi, İslami bankalarda mevcut entelektüel sermaye bileşenlerini belirlemeyi ve Bankacılık hizmetlerinin iyileştirilmesini olumlu yönde etkilemek için bu bileşenleri kullanmaya çalışmak, ve bu hizmetlerin kalitesini artırmayı amaçlamaktadır. Araştırmanın amaçlarını gerçekleştirmek için araştırmacı, incelenen olguyu tanımlamaya çalışan betimsel-analitik yaklaşımı kullanmıştır. Kerkük vilayetindeki İslam Yatırım ve Kalkınma Bankası, Cihan İslam Bankası, Arap İslam Bankası çalışma topluluğu olarak belirlenip, araştırma alanı olarak seçilmiştir. Değer elde eden eğilimleri ortaya çıkarma yeteneğine sahip bir bilgi kaynağı olduklarından, danışmanların yanı sıra çeşitli idari seviyelerdeki yöneticilerin görüşlerinin araştırılması da gerekiyordu. Buna göre, araştırmanın sonuçlarını genelleyebilmek ve içinden seçildiği topluluğun seçilmiş örneklemini temsil etmede doğru olması için, araştırma örneklemi genel müdürler, departman müdürleri, muhasebeciler, yöneticiler ve resepsiyonistler tarafından temsil edilmiştir. Dağıtılan 92 form arasından 84 formun analiz için geçerli olduğu tespit edilmıştır. Araştırmanın istatistiksel analizinde istatistiksel paket (SPSS) programı ile birlikte çalışma değişkenleri arasındaki korelasyon ve etki ilişkilerini göstermede korelasyon katsayısı ve lineer regresyon kullanılmıştı. Bu araştırmanın en önemli yanı, incelenen bankaların stratejik hedeflerinin üretilmesinde birincil ve etkili rolü temsil eden insan sermayesi kavramı ile ilgili olması, dış çalışma ortamının izlenmesi ve analizi ile ilgili iç operasyonların denetimi ve verimlilik ve kapasitenin ölçülmesi ile üretkenliği artırmadaki doğrudan rolünün ortaya çıkarılmasıdır. Böylece, pazardaki diğer rakiplere karşı yüksek rekabet avantajı sağlamak için insan kaynağının optimal kullanımı sağlanmış olacaktır. Araştırma, bankacılık performansının iyileştirilmesinde insan unsurunun en önemli unsurlardan biri olması nedeniyle bankacılık hizmetlerinin kalitesini artırmak için insan unsurunun iyileştirilmesi olan bir dizi öneri sunmaktadır. Bankaların son yıllarda teknoloji ve bankacılık bilgisi alanındaki en son bulgulardan yararlanarak bankacılık hizmetlerini geliştirme çabalarına rağmen, hizmet sunum düzeyinin yükseltilmesi ve insan kaynaklarına en uygun yatırımın gerçekleştirilmesi dahil olmak üzere banka çalışanlarının yeteneklerinin geliştirilmesine yönelik çalışmaların eksik kalması, ulaşılması gereken hedeflerin sınırlı kalmasına neden olacaktır."
