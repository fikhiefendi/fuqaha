abstract: "Bu tezimizde genel manada Afganistan'daki kadınların sosyal halleri durumları ele alınmıştır. Çalışmamızda Afganistan kadınlarının tarih boyunca lehine olan düzenlemeler Afganistan Medeni Kanunu'na ve Şeriat kanunlarına yani, İslam hukukuna göre açıklanmaya çalışılmıştır. Yapılan araştırma neticesinde Afgan kadınlarının sosyal ve ekonomik durumlarının genellikle çok sıkıntılı olduğu tespit edilmiştir. Ayrıca elde edilen bulgulara göre nikâh akdini zorlaştıracak birçok sebep bulunmuştur. Bunların başında gelenler; İslam'da olmayan başlık parasının çok yüksek olması, düğünlerde israfa varacak aşırı harcamalar, sırf insanlar ayıplamasın diye yapılan çeşitli düğün töreni masraflarıdır. Örneğin söz, nişan töreni, kına gecesi, düğün ve düğün sonrası damat ve geline yapılan takı ve hediye merasimlerinin oldukça abartılı olması burada zikir edilebilir. Aynı zamanda çalışmamızda, Afganistan'da küçük yaşta evlendirilen kızların hayatları, neden evlendirildikleri açıklanmış ve bunlar resimlerle de desteklenmiştir. Buna ek olarak Afganistan'da uygulanan mehir, miras, nafaka, dul kadınların durumu, çok evlilik ve nedenleri, küçük yaştaki kızların evlilikleri, İslam hukuku ile Afganistan Medeni Kanununa göre örf adetler de göz önünde bulundurularak ele alınıp ayrıntılı bir şekilde açıklanmıştır. Ve neticede Afganistan'da kadın aleyhine olduğu düşünülen birçok yanlış uygulama da kaydedilmiştir. Kadınlara yönelik bu kötü muamelelerin uygulanış tarzı, bunların kanun çerçevesinde engellenmesine yönelik alınan tedbirlerde değerlendirilmeye çalışılmıştır."
