abstract: "Tezimizde 19. yüzyıl İslam hukuk tarihinde kayıp halka olarak adlandırdığımız Mısır'daki kanunlaştırma hareketleri ele alınmış, 1789 tarihinde Mısır'ın Fransızlar tarafından işgal edilmesinden 20. Yüzyılın başlarına kadar devam eden Mehmet Ali Paşa hanedanının hukuk alanındaki çalışmaları incelenmiştir. Çalışmamızda bu dönemdeki Mısır'ın yargı yapısı ele alınmış, hazırlanan temel kanunlar şekil ve içerik yönleriyle değerlendirilmiş, kanunların kaynakları ve şer'î hukukla olan bağlantısı belirtilmiştir. Mısır'da 19. yüzyılda çıkarılan kanunlarda Fransız etkisini gösterebilmek adına Fransa'da hazırlanan başta Medenî Kanun (Code Civil) olmak üzere birçok kanun metni ana başlıklarıyla ele alınmış, Mısır'da çıkarılan kanunlarla bağlantıları değerlendirilmiştir. Muhammed Kadri Paşa'nın kanun taslaklarının da ele alındığı çalışmamızda kamu ve özel hukuk sahasında kırkı aşkın kanun metni araştırmamıza konu edilmiştir."
titleTranslation: {"en": "Codification movements in the 19th century in Egypt"}
