abstract: "Tahrîcü'l-furu literatürü belli bir zaman diliminde bir defada ortaya çıkmış değildir. Aksine uzun bir zaman diliminde ve kavâid ilminin belli evrelerden geçmesinin ardından bir ihtiyaca binaen ortaya çıkmıştır. Şâfiîlerin temsilciliğini üstlendiği tahrîcü'l-furu' edebiyatı, Zencânî elinde sistematik bir yapı kazanmıştır. XVI. yüzyılda Gazze'de yaşamış Hanefî fakih olan Timurtâşî de el-Vüsûl ilâ kavâidi'l-usûl adlı eseri ile usûl-furu' ilişkisini anlamlandıran tahrîcü'l-furu' literatürüne katkıda bulunmuştur. Tezimizin konusu olan Timurtâşî'nin el-Vüsûl ilâ kavâidi'l-usûl adlı eseri, XVI. yüzyıl eserleri arasındadır. Zencânî ile başlayan bu süreç yaklaşık dört yüz yılı aşkın bir süreye yayılmıştır. Bu süre zarfında Şâfiî mezhebi başta olmak üzere Maliki ve Hanbeli literatürünün de tahrîcü'l-furu'ya ilişkin eserleri oluşmuştur. Timurtâşî'ye kadar geçen dönemde tahrîcü'l-furu'ya dair eserler olgunlaşmış ve birikimler mezcedilip mezheplerin karakteristik yapılarına uygun eserler ortaya çıkmıştır. Timurtâşî bazı farklılıklarla beraber tertip, sistematik ve muhteva bakımından İsnevî'den faydalanmış ve el-Vüsûl'ü İsnevî'nin et-Temhîd'ini esas alarak oluşturmuştur. Timurtâşî'nin bir Şâfiî olan İsnevî'yi takip etmesi mezhebi tavır ve metodolojisi bakımından birtakım farklılıklara sebep olmuştur. Bu çalışmada tahrîcü'l-furu literatürünün başlıca eserlerine yer verilip sistematik ve içerik bakımından birtakım farklılıklara işaret edilmiştir. Böylece el-Vüsûl'ün literatürdeki konumu ve eserler arasındaki etkileşimi ortaya koymuş olduk. el-Vüsûl'ü konuları, sistematiği ve kaynakları itibariyle bir tahlile tabi tuttuk. Çalışmamızın amacı her iki eserin mukayesesi olmamakla birlikte, İsnevî'den ne derece etkilenip etkilenmediğini ortaya koymak bakımından et-Temhîd sıkça müracat ettiğimiz kaynaklar arasında yer almıştır."
