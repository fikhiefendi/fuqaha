abstract: "TÜRKÇE ÖZET Araştırmamızda İslam Hukukunda uyuşturucu maddelerin hükümlerini ortaya koymaya çalıştık. Giriş bölümünde konuya ışık tutması açısından, uyuşturucu maddelerin dünyada ve ülkemizde gelişimini ve fakihlerin uyuşturucuların nitelikleri hakkındaki görüşlerini aktardık. Konuyu, önce suç olarak ele alıp tanımlamasını ve şer' i nasslardaki mesnedini araştırma ya çalıştık. Daha sonra failin hangi şartlara haiz olması gerekir, suçun maddi ve ma'nevi unsurları nelerdir, kusur yeteneği, zorla bu maddelerin kullandırılması, bu maddelerle tedavi olma hükmünü ve suçun hangi vesilelerle ispat edileceğini anlattık. Konuyla ilgili açık bir nass olmamakla birlikte, bu maddelerin içkiye kıyaslanması ve İslam Hukukunun genel kaide ve prensiplerinden bu maddelere bakış açısını izah ettik. Cezayla ilgili bölümde, bu maddelere ceza verilmesinde gözetilen hedef, aklın korunmasının hikmetlerini ve bu cezanın ceza sistemi içerisindeki yerini anlatmaya çalıştık. Daha sonra cezayla ilgili İslam Hukukunun verdiği -fakihlerin görüş farklılıklarıyla birlikte- cezanın ne ve nasıl olduğu, uygulama şekli ve hakimin takdir yeteneği, suçlunun topluma kazandırılması için tedavi, ıslah ve te'dibi ve yollarını aktarmayı denedik. vıı"
