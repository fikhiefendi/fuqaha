abstract: "Gelişen ve dönüşen dünya, ülkelerin kaynak ihtiyacını artırmış, bireysel gereksinimleri değiştirerek finans sektörü meydana getirmiş, finansal piyasalar oluşmuş ve finansal piyasa araçları türemiştir. 1970'lerde petrol ve dolardaki artış petrol zengini Orta Doğu ülkelerini zenginleştirmiştir. Zenginleşen Orta Doğu ülkelerinin yatırımcıları ellerindeki kaynakları farklı ülkelerde yatırıma dönüştürmek için inançlarına uygun finansman yöntemlerine sahip ülkeleri tercih etmişlerdir. Bu durum İslami ilke ve kurallara uygun bir ihraç sürecini ortaya koyan sermaye piyasası araçlarından biri olarak Sukuk'u karşımıza çıkmıştır. Tez çalışmamızda Sukuk finansman modellerinin çerçevesi, özellikleri, ihraç süreçleri ve klasik finansman yöntemleri ile karşılaştırmaları yapılmıştır. Türk ekonomi sistemindeki uygulaması olarak karşımıza çıkan kira sertifikalarının mevzuat boyutu ve ihraç süreçleri açıklanmaya çalışılmıştır. Murabaha Sukuk finansman modelinin kavramsal çerçevesi, ihraç süreci, Türkiye'de uygulaması ve tarafları açısından muhasebeleştirilmesi örnek ile açıklanmaya çalışılmıştır."
