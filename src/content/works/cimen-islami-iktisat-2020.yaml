abstract: "İslamî iktisat alanında ortaya çıkan faizsiz bankacılık sistemi, mevduat bankalarından farklı bir yapıda faaliyetlerini yürütmeye çalışmaktadır. İslam dininde faizin yasak olmasından dolayı kurulan faizsiz bankalar, Türk bankacılık sistemine bir alternatif olmaktan ziyade eksik kalan bir parçayı tamamlama görevini üstlenmiştir. Faizsiz olarak faaliyetlerini yürütmekte olan katılım bankacılığın birden çok hedefi vardır. Bunların içerisinde sağlam bir finansal sistem oluşturmak, ekonomik ve toplumsal hedeflere ulaşılmasına yardımcı olmak, bankacılık sektörü içerisindeki payını artırmak, toplumsal yapıya uygun yeni hizmetler geliştirmek, toplumsal dayanışmayı daha da iyileştirmektir. Bu çalışmanın amacı Türk bankacılık sektöründe faaliyet gösteren mevduat ve katılım bankalarının çalışmalarındaki farklılıkları göstermek, özellikle Orta doğu ülkeleri ile ekonomik ilişkilere yönelik fayda sağlamak, katılım bankacılığının hangi süreçlerden geçtiğine dair bilgi akışını sağlamak, günümüze kadar yaşanan bu gelişimi ve mali sistemimizin içerisinde var olan etkilerini gün yüzüne çıkarmaya çalışmaktır. Türkiye'de meydana gelen ya da yaşanan krizlerle birlikte farklı dönemlerde maruz kalınan finansal krizlerin etkileri incelendiğinde bunun negatif etkileri açıkça görülmektedir. Yaşanan bu etkileri minimum düzeyde atlatmayı başaran faizsiz bankalar, kendi iç dinamikleriyle devlete hiçbir maliyet yüklemeden çıkmayı başarmışlardır. Bu olumlu sonuçlar da dikkate alınmak suretiyle, ülkemizde bankacılık faaliyetlerini devam ettiren katılım bankalarının finansal sisteme yaptığı katkılar, bu çalışmada ortaya konulmaya çalışılmıştır."
