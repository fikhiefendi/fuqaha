abstract: "Hz. Peygamberin vefatından sonra İslâm devletinin başkanlığını ifade etmek için hilâfet- imâmet gibi isimler kullanılmıştır. Hilâfetten maksat şeriatin tatbiki ve adaletin sağlanmasıdır. Devlet başkanlığı görevini üstlenen ve yürüten kimse için ise halife, halifetü Resulillah, emirü'l- mü'minin vesaire ünvanlar kullanılagelmiştir. Bu görevi üstlenecek kimsede bir takım vasıfların bulunması gerekmektedir. Bu vasıflardan bazıları; Müslüman ve akıl – bâliğ olmak, İslam ahkâmını uygulamaya ve devlet işlerini yapmaya muktedir olmak, âdil olmaktır. Halife, ehlü'l hal ve'l-akd tarafından seçilmesinin ardından bir takım mesuliyet ve görevleriüzerine almış bulunmaktadır. İslâm âlimleri nasslar ışığında bu görevlerin bazılarını zikretmiş, halifenin ilk ve en önemli görevinin âdil olmak ve halkı İslâm ahkâmına göre yönetmek olduğunu ifade etmişlerdir. Halife kendisinde bulunması gereken vasıflara sahip olduğu ve görevlerini hakkıyla yerine getirdiği müddetçe kendisine itaat edilmesi gereklidir. Ancak görevlerini yerine getirmeyip, halka zulmetmeye ve adâlet çizgisinden ayrılmaya başlarsa azli söz konusu olmaktadır. İslam âlimleri azil konusunu tartışmışlar hangi hususların azle sebep olduğu hususunda görüşlerini belirtmişlerdir. Azle sebep olan hususlar arasında üzerinde ittifak edilenlerden bazıları; âdil olmayıp halka zulmetmek, halifelik görevini hakkıyla yapmaya engel olacak bedenî noksanlıkların ortaya çıkması, İslâm dininden çıkmak, namazı ve ona daveti terk etmektir. Azli gerektiren hususlar arasında halifenin adâlet vasfını kaybetmesi hususu uzun uzadıya tartışılmış, bu durumun azil sebebi olup- olmadığı İslâm âlimleri arasında ihtilafa yol açmıştır."
