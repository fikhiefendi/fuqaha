abstract: "İslam Hukukunda cenin safhasından başlayarak, aklî ve bedenî gelişime paralel bir şekilde zamanla şekillenen ehliyet, dini-hukuki fiillere muhatap olunması hususunda birincil unsur olmaktadır. Aktif-pasifliğine göre edâ ve vücûb ehliyeti olarak ikili tasnifi yapılan bu unsurun, birtakım arızalar sebebiyle kısıtlanması veya tamamen ortadan kalkması söz konusudur. Kişinin ehliyetini olumsuz yönde etkileyen bu arızalar ise karşılaşılmış/kazanılmış olması açısından semâvî ve mükteseb arızalar şeklinde incelenmektedir. Burada önemli nokta kişinin ehliyet arızasının olması durumunda yapılacak hukuki işlemlerin hangi doğrultuda etkileneceğidir. Günümüzde akıl hastalığı olarak adlandırılan şizofreni, Alzheimer, epilepsi gibi pek çok rahatsızlığın İslam Hukukunda cünûn, ateh, sefeh gibi değişik başlıklar altında incelenmesi gerekmektedir. Nitekim akıl hastalığı kapsamındaki her rahatsızlığın cünûn başlığı altında ele alınması doğru bir tespit olmayacaktır. Nitelikleri itibariyle şizofreni cünûn derecesindeyken; Alzheimer evrelerine göre ateh ya da cünûn olarak değerlendirilmektedir. Diğer yandan Obsesif Kompulsif Bozukluk edâ ehliyetini etkilemezken; patolojik kumar bireyi sefih noktasına getirmektedir. Kişinin ehliyetini farklı yönlerden etkileyen bu hastalıkların muâmelât sahasında da çeşitli tezahürleri görülmektedir. Bu çalışma tıp literatüründe akıl hastalığı olarak kabul görmüş rahatsızlıkların, İslam Hukukunda ehliyete etkisi açısından hangi noktada değerlendirilmesi gerektiğini ve muâmelât konusuna tesirlerini kapsamaktadır. Neticede geçerli bir hukuki işlem yapabilmek ya da var olanları sürdürebilmek hususunda Şizofreni, Alzheimer ve Patolojik Kumar hastalıklarının mecnûn, ma'tûh ve sefih olma açısından etkilerinin görüldüğü, ele alınan diğer hastalıkların edâ ehliyetinde bir kısıtlama hâlini oluşturmadığı saptanmıştır."
