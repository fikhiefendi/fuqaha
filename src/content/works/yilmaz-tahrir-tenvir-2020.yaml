abstract: "XX. asrın güzide ilim şahsiyetleri olarak tanınan ve ilmi, bilimsel ve düşünsel olarak ilmî camiaya önderlik eden iki 'alim-entelektüel' İbn Aşur ve es- Sabûni'nin tefsir alanında, bilhassa ahkâm ayetleri hususundaki yorumlarını sistematik bir şekilde kıyaslayacağız. Bu kıyaslama iki temel kaynak üzerinden (Et-Tahrir ve't-Tenvir - Revaiul Beyan) yürütülecek olup her iki şahsiyetin de kendilerine has üslupla kaleme aldıkları bu iki eserle gerçekleştirilecek. İbn Aşur ve Sabûni'nin hayatı, fikir dünyası, tahsil serüveni ve akademik çalışmalarına değinip kıyaslamaya temel aldığımız eserler başta olmak üzere âlimlerin diğer eserleri hakkında da bilgi aktaracağız. Kendilerine özgü tarzla yürüttükleri metodlar ve kullandıkları kaynakları, hemfikir oldukları veya farklı düşündükleri mevzuları aktarıp tüm çalışmamızın sonucunda konulara olan yaklaşımlarını açığa kavuşturacağız. Örnek verecek olursak; sihir öğrenmek ve öğretmenin caiz olup olmadığı, hastalıktan veya yolculuktan dolayı tutulamayan oruçların kazası, bir müslümanı yanlışlıkla öldürenin azat etmesi gereken kölenin vasfına dair, kadınların örtünmesi gibi hususlarda beyan ettikleri görüşleri kıyasladık."
