abstract: "Ebussuûd Efendi, tefsir geleneği ve İslam hukuku alanında önemli bir âlimdir. XVI. yüzyılda Osmanlı Devleti'nin zirve döneminde 29 yıl Şeyhülislâm olarak hizmet etmiştir. Sahip olduğu bu sosyal ve kültürel sorumluluklar, onun İrşâdü'l-ʻAḳli's-Selîm ilâ Mezâya'l-Kitâbi'l-Kerîm adlı bir tefsir yazma yöntemini büyük oranda etkilemiştir. Tezimizde Ebussuûd tefsirini ahkam ayetleri çerçevesinde sosyokültürel bağlamında incelemeye çalıştık. Çalışmamız, tefsir eserinde Kur'an-müfessir-tefsir üçlüsü arasındaki ilişkiyi doğru bir şekilde anlamaya yönelik bir girişim olup, Ebussuûd'un sosyal ve kültürel koşullarının onun Kur'an anlayışı üzerindeki etkisini görmeyi amaçlamaktadır. Ayrıca; Ebussuûd'un zekât, evlilik ve hac ile ilgili Kur'an ayetlerinin tematik yorumuna odaklanılmaktadır. Müellfin yaşamı boyunca içinde bulunduğu sosyokültürel koşulların gelişimi dikkate alınarak üç konu tespit edilmiştir. Araştırmamıza göre, Zemahşerî ve Beyzâvî'nin tefsirleri Ebussuûd tefsirini büyük ölçüde etkilemiştir. Zira her iki tefsir de Osmanlı medreselerinde yaygın olarak okutulmuştur. Ebussuûd, zekâtı vergilerle eş tutmuştur. O dönemdeki sosyoekonomik koşulları iyileştirmek için Müslümanları zekât vermeye şiddetle teşvik etmiş, zekât vermek istemeyenleri şiddetle eleştirmiştir. Evlilikle ilgili olarak, evliliğin amacının çocuk sahibi olmak ve çocuk bakmak olduğunu ifade etmiş, bu nedenle cariyelerle evlenmeyi önermemiştir. Ayrıca çok eşlilikte adaletin sağlanması mümkün olmadığı için tek eşliliği tercih etmiştir. Hac konusuyla ilgili olarak, o dönemde hac zor ve yorucu koşullarda yapılsa da haccın Müslümanlara farz olduğunu kuvvetle vurgulamıştır. Hac ile ilgili ayetleri tefsir ederken, Hanbeli hariç, Sünnî fıkhın üç mezhebine mensup imamların görüşlerini sık sık aktarmıştır. Bazen Hanefî mezhebine mensup bir toplulukta yetişmiş bir kişi olarak geçmişi nedeniyle İmam Ebû Hanife'nin görüşünü de tercih etmiştir."
