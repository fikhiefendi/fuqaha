abstract: "Yüce Allah Kur'ân'ı Kerim'i insanlara hidayet ve nur kaynağı olarak göndermiştir. Kıyamete kadar bize rehber olmaya devam edecektir. Allah Teâlâ Kur'ân'ı Kerim'de bizim dünya ve ahirette huzura kavuşmamız için hükümler bildirmiştir. Koyduğu hükümlerde gaye ve hikmetler vardır. Allah Teâlâ'nın koyduğu hükümlerinde gözettiği anlam ve hikmetlere makâsıd denir. Allah Teâlâ'nın Kur'ân ayetlerinde kastettiği manayı anlamak için ayetlerin arka planında yer alan maksatların bilinmesi gerekir. Maksatları tespitin dayanağı Kur'ân metni ve zâhirî delaletidir. Bu sebeple Kur'ân'ın külli maksatlarının doğru anlaşılması gerekmektedir. Kur'ân'ı anlamak demek sadece ayetlerini okuyup ezberlemek değildir. Kur'ân'ı anlamak esas olarak Allah Teâlâ'nın kitabında bizlere ne buyurduğunu, ayetlerde ne ifade edildiğini anlamak demektir. Makâsıd, zarûriyyat, hâciyyât ve tahsîniyyât şeklinde derecelenmiştir. Maslahat ise insanlara fayda veren şeyi emretmesi, zarar veren şeyi yasaklaması esasına dayanır. Makâsıdın temelini maslahat oluşturmaktadır. Zarûrî maslahatlar din, can, nesil, akıl, mal şeklinde sıralanmıştır. Hâciyyât ve tahsîniyyât ise zarûriyyâtı tamamlar niteliktedir. Makâsıdın kapsamına dinin genel nitelikleri, genel amacı ve gözettiği anlamlar hatta bazı hükümlerde görülmese de diğerlerinde görülebilen hikmetler de girmektedir. Makâsıdın en üst gayesi ise bireyin ve toplumun ıslahıdır. Kur'ân'ın nüzulünün en temel maksadı insanlığın ferdî, ictimai, küresel meselelerinin düzenlenmesidir. İslam dini insanları ıslah etmek ve insanları ahiret hayatına hazırlamak için gelmiştir. Kur'ân'ın içeriğinde bulunan hüküm ve esasları irdeleyen makâsıdî/gâî yaklaşım bizlere Allah Teâlâ'nın esas amacını açıklamaktadır."
