abstract: "Bu tez, Serûcî'nin el-Gâye adlı eseri özelinde hadis tahrîci anlayışını ve Hanefî fıkıh geleneği içerisindeki yerini incelemektedir. Çalışmanın temel amacı, Memlükler döneminde bir Hanefî fakihin hadislerle kurduğu ilişkiyi ortaya koymak ve özellikle Kütüb-i Sitte başta olmak üzere hadis kaynaklarına yaptığı atıfların mahiyetini tespit etmektir. Bu bağlamda Serûcî'nin, el-Hidâye üzerine yazdığı şerhte hadisleri ilk kez tahrîc etmesi, onu klasik Hanefî şerh geleneğinden ayıran önemli bir özellik olarak değerlendirilmiştir. Araştırmada nitel yöntem esas alınmış; Serûcî'nin hadis kullanımı, kaynaklara atıf biçimi ve muhaddislerle ilişkisi biyografik ve metin merkezli analizlerle incelenmiştir. Ayrıca mukayeseli yöntemle Serûcî'nin yaklaşımı, hem Hanefî hem de diğer mezheplere mensup âlimlerle karşılaştırılmıştır. Çalışma, Serûcî'nin yalnızca fıkıh alanında değil, hadis ilmi bağlamında da önemli bir birikime sahip olduğunu ve tahrîc faaliyetinin Hanefî literatürde sistemleşmesine katkı sağladığını ortaya koymaktadır. Sonuç olarak bu tez, Serûcî'nin hadis tahrîci yaklaşımının, Hanefî mezhebinde hadis temelli istidlâlin güçlenmesine katkıda bulunan önemli bir ilmî dönüşümü temsil ettiğini göstermektedir."
