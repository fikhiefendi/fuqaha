abstract: "Kanunilik ilkesinin İslam Ceza Hukukundaki yerini kapsamlı ve müstakil olarak ortaya koymak, konuyla ilgili çeşitli iddiaları araştırmak doktora çalışmamızın amacı olmuştur. Çalışmada öncelikle kanunilik ilkesinin günümüz ceza hukukundaki yeri tespit edilmiş, müteakiben İslam Ceza Hukuku açısından değerlendirilmiştir. Kanunilik ilkesinin günümüz ceza hukukundaki yerini tespitte Türk Ceza Hukuku kaynaklarına müracaat edilmiştir. İslam Ceza Hukukunda ilkenin tespitinde ise imkan nispetinde eski ve yeni kaynaklara başvurulmuştur. Modern ceza hukukunda kanunilik ilkesi, tarihi süreç içerisinde mahiyet değişikliğine uğramıştır. Böylece ilkede, klasik kanunilik ilkesi anlayışı ve modern kanunilik ilkesi anlayışı olmak üzere iki farklı yaklaşım tarzı meydana gelmiştir. Kitap ve Sünnet' le belirlenmiş suç ve cezalar, genel itibarıyla modern kanunilik ilkesi anlayışına uymaktadırlar. Tazir suç ve cezalarında ise bugün kanunilik ilkesine verilen en esnek anlamı bulmak mümkündür. Bununla beraber bunlarda ilkenin nasıl tatbik edileceğinde özellikle devletin etkisinin büyük olduğu görülmektedir. İslam Ceza Hukukunda kanunilik ilkesinin olmadığı düşüncesinin önemli dayanaklarından birisi de kıyas konusudur. Kıyas konusuna, kıyasın İslam Hukuk doktrinindeki yeri ve resmi hakimin baş vurduğu bir yorumlama metodu olmak üzere iki farklı açıdan yaklaşmak gerekir. Kanunilik ilkesinin yasakladığı kıyas, resmi hakimin yorumlama faaliyetinde başvurduğu kıyastır. Tarihi süreçte gelinen son durumun İslam Ceza Hukukunda mahkeme içtihadında kıyasa baş vurulamayacağı yönünde olduğu dikkate alınırsa kıyas açısından da kanunilik ilkesine ters bir durumun olmadığı anlaşılmış olur."
