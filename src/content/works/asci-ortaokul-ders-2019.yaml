abstract: "Öğretim programlarının hedeflerine ulaşmasının birincil araçlardan olan ders kitapları, öğretmen ve öğrencinin ortak kaynaklardır. Ortaokul öğretim programlarının perspektifini oluşturan değerler eğitimi ve bir manevi terbiye yöntemi olan tasavvuf birbirini desteklemektedir. Tezimizde tasavvuf eğitiminin örgün din eğitimi içerisindeki durumu ortaokul 5-8. Sınıf DKAB, Temel Dini Bilgiler, Peygamberimizin Hayatı ders kitapları çerçevesinde incelenmektedir. Çalışma sonunda; ders kitaplarında tasavvuf öğretimine gerektiği kadar yer verilip verilmediğinin, ahlâk ve değerler eğitimi ile tasavvufî öğretiler arasında yeterince bağlantı kurulup kurulmadığının tespiti yapılmıştır. Tezimiz giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, araştırmaya sevk eden problem ortaya konarak araştırmanın amacı, yöntemi ve ders kitaplarının hazırlanmasında zorunlu temel kaynaklar olan ve 2007-2008 eğitim öğretim yılında uygulamaya konulan yeni DKAB, Temel Dini Bilgiler, Peygamberimizin Hayatı öğretim programlarının genel bir tanıtım ve değerlendirmesi yapıldı. Birinci bölümde, ortaokul ders kitaplarında yer alan tasavvufî konular daha çok ahlâk kavramı çerçevesinde yer aldığı için tasavvuf, ahlak ve din arasındaki ilişki açıklanarak tasavvufun örgün eğitime katkıları incelendi. Ayrıca öğretim programlarına ilk kez yer alan değer kavramının da tasavvuf ve ahlak bağlamında değerlendirmesi yapıldı. İkinci bölümde araştırmanın problemini oluşturan ve örneklem olarak seçilen ortaokul 5, 6, 7 ve 8. sınıf DKAB, Temel Dini Bilgiler, Peygamberimizin Hayatı ders kitaplarının içerik ve etkinlikleri, her bir ders kitabı incelemeye alınarak tasavvufî konular bağlamında değerlendirildi. Devamında araştırma sonuçlandırılıp öneriler geliştirildi."
