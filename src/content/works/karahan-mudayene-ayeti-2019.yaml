abstract: "İnsan sosyal bir varlık olarak diğer insanlara muhtaçtır. İnsan bu ihtiyaçlarını diğer insanlarla akitler kurarak karşılıklı olarak gidermektedir. İnsanlar ihtiyaçlarının bir kısmını kendileri üreterek temin ederken, bir kısmını da başka kişilerden alış-veriş yoluyla temin etmektedirler. Dolayısıyla insanlar arasında ticari ilişkilerin önemi gün geçtikçe artmaktadır. Ticari ilişkiler, doğrudan veya dolaylı şekilde insanların sosyal ilişkilerini etkilemektedir. Bu ilişkilerin adaletli, mutlu ve huzurlu bir şekilde devam etmesi için yazılması başta olmak üzere bazı kurallara ihtiyaç vardır. Bu kurallar, örf ve âdetler tarafından belirlendiği gibi inanç sistemleriyle de belirlenmektedir. Bu bağlamda Kur'an-ı Kerim, insanların sosyal hayatlarını kolaylaştırmak için kural koyucu unsur olmuştur. Çalışmamızda, Bakara Suresi 282. ayeti bağlamında İslam borçlar hukuku genel olarak incelenmiş, insan hayatı için vazgeçilmez olan ticari ilişkilerde oluşabilecek problemleri ortadan kaldırmaya yardımcı olmak amaçlanmıştır. İslam borçlar hukuku değerlendirilirken ayette geçen konular dikkate alınarak çalışmamız bu kapsamda değerlendirilmiştir. Çalışmamızda müfessirlerin, ilk dönem İslam hukukçuları ile günümüz İslam hukukçularının eserlerinden yararlanılarak görüşlerine yer verilmiştir. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde, ayetin tahlili yapıldıktan sonra ayette geçen fıkhî terimler ve ayetteki konular maddeler halinde açıklanmış ve alışveriş sözleşmesini yapan ve bu sözleşmeyi tevsik eden kâtip, şahit ve günümüzde noterde bulunması gereken şartlar anlatılmıştır. İkinci bölümde, çalışmamız açısından önemli olan akitler, dürüstlük ilkesine aykırı olan durumlar ve borcun hangi şartlarda sona ereceği hususları açıklanmıştır. Üçüncü bölümde ise, borçların güvence altına alınmasıyla ilgili günümüz uygulamaları değerlendirilmiş ve çalışmamız sonuç bölümüyle bitirilmiştir."
