abstract: "Bu çalışmanın temel amacı, bir İslam düşünürü olan Sezai Karakoç'un, Diriliş düşüncesi ekseninde ekonomi düşüncelerini incelemektir. Bu çalışmada“Nitel Araştırma”yöntemi kullanılmıştır. Bu bağlamda, çalışmada kullanılan veri ve bulgular literatür taramasına dayalı, metin ve içerik analizi tekniği kullanılarak analiz edilmeye çalışılmıştır. Karakoç'un 1960-1992 yılları arasında yayımladığı Diriliş dergisi ana kaynak olarak belirlenmiştir. Sezai Karakoç'un, kesintilere rağmen, 1960'tan başlayarak 1992'ye kadar süren Diriliş dergisinde yayımlanan tüm yazıları incelenmiştir. Karakoç'un düşünce yazılarında ekonomiye yönelik yer alan görüşleriyle birlikte, sadece ekonomiye yönelik olan yazıları da tespit edilmiştir. Sezai Karakoç'un, yaşadığı coğrafyanın özel şartlarına bağlı olarak gelişim gösteren siyasi, sosyal, kültürel olaylara bakarak mevcut ekonomi düşüncesinin nasıl şekillendiği tespit edilmeye çalışılmıştır. Sezai Karakoç'un fikir dünyasına etki eden olayların daha iyi anlaşılması için, İkinci Dünya Savaşının sonlanmasıyla Türk siyasi hayatındaki değişimler ve bu değişimlerin sonucunda tartışılan ekonomik doktrinler incelenmiştir. Sezai Karakoç'un, ekonomiye yönelik düşüncelerinin oluşumuna inancın kaynaklık ettiği tespit edilmiştir. Karakoç'un, ekonomi anlayışının inancın bir sonucu olarak tanımladığı görülmüştür. Sezai Karakoç'un, ekonomi doktrinleri Batı medeniyetinin birer yansıması olarak değerlendirdiği ve Batı medeniyetine karşı, İslam medeniyetini idealize ettiği tespit edilmiştir. Bu bağlamda Karakoç'un, Diriliş düşüncesi ekseninde, mevcut doktrinler dışında alternatif bir kimlik inşası gayretinde olduğu sonucuna varılmıştır. Sezai Karakoç'un, alternatif kimlik inşasına, İslam dini, kültürü ve tarihini kaynak olarak aldığı ve bu çerçevede ekonomiyi değerlendirdiği tespit edilmiştir. Sezai Karakoç'un ekonomi düşüncesinin temel dayanakları ve ekonomiye yönelik yorumları Diriliş dergisinde yayımladığı yazıları üzerinden değerlendirilmeye çalışılmıştır."
