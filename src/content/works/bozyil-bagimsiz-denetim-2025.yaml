abstract: "Bu tez çalışmasında, bağımsız denetim kalitesinin finansal performans üzerindeki etkisi, Türkiye'de faaliyet gösteren Kuveyt Türk Katılım Bankası örneği üzerinden incelenmiştir. Küreselleşen finansal piyasalarda şeffaflık, hesap verebilirlik ve güvenilirlik gibi kavramların önemi artarken, işletmelerin sürdürülebilir büyüme ve rekabet gücünü koruyabilmeleri açısından bağımsız denetim hizmetlerinin kalitesi kritik bir unsur haline gelmiştir. Özellikle faizsiz bankacılık esaslarına göre faaliyet gösteren katılım bankalarında, bağımsız denetim süreçlerinin etkinliği hem kurumsal itibarı hem de finansal istikrarı doğrudan etkileyen önemli bir faktör olarak değerlendirilmektedir. Araştırmada, öncelikle bağımsız denetim ve denetim kalitesi kavramları teorik olarak ele alınmış; ardından finansal performans kavramı ve performans ölçütleri detaylı bir şekilde incelenmiştir. Uygulama aşamasında, Kuveyt Türk Katılım Bankası'na ait 1989-2024 dönemine ilişkin finansal veriler kullanılarak analiz gerçekleştirilmiştir. Verilerin çok değişkenli yapısının etkilerini azaltmak ve değişkenler arası çoklu doğrusal bağlantıyı ortadan kaldırmak amacıyla Temel Bileşenler Analizi (PCA) uygulanmıştır. Bu yöntemle, bilgi kaybı minimumda tutulmuş ve analizde kullanılacak yeni bileşenler oluşturulmuştur. PCA sonrası elde edilen bileşenler kullanılarak, bağımsız değişkenler arasındaki ilişkiyi daha etkin modelleyebilmek amacıyla Elastic Net regresyon analizi gerçekleştirilmiştir. Bu yöntem, klasik regresyon tekniklerine kıyasla daha yüksek doğruluk sağlamış ve modelin tahmin gücünü artırmıştır. Çalışmanın ampirik bulguları, bağımsız denetim kalitesinin finansal performans üzerinde pozitif ve istatistiksel olarak anlamlı bir etkiye sahip olduğunu göstermiştir. Elde edilen sonuçlar, yüksek kaliteli bağımsız denetim hizmetlerinin finansal tabloların güvenilirliğini artırarak, yatırımcı güvenini pekiştirdiğini ve dolayısıyla banka performansının iyileşmesine katkı sağladığını ortaya koymuştur. Özellikle katılım bankacılığı sektöründe faaliyet gösteren kuruluşlar açısından, denetim kalitesinin artırılmasının sadece yasal uyumun bir gerekliliği değil, aynı zamanda finansal sağlamlık ve rekabet avantajı için de vazgeçilmez bir unsur olduğu sonucuna ulaşılmıştır. Bu tez, bağımsız denetim kalitesinin işletme performansına olan etkisini teorik ve ampirik düzeyde bütüncül bir yaklaşımla ele almakta hem akademik literatüre katkı sunmakta hem de uygulayıcılara önemli çıkarımlar sağlamaktadır. Çalışmanın sonunda, denetim süreçlerinin etkinliğininiv artırılması ve finansal performansın sürdürülebilirliğinin sağlanması için önerilerde bulunulmuştur."
