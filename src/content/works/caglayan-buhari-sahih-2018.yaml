abstract: "Bu araştırma, Buhârî'nin Sahîh'inde geçen mübhem şahsiyetleri konu edinmektedir. Araştırmanın temel amacı, Buhârî'nin Sahîh'inde Kitâbu Bed'i'l-Vahy ile Kitâbu'z-Zekât arasında yer alan mübhem şahsiyetleri tespit etmek ve bunların kim olduklarını ortaya koymaktır. Araştırma sonucunda, ibhâm ve mübhem kavramlarının ne anlama geldiği, hadislerin metin veya isnâd yönünden mübhem bırakılmasının sebepleri, ibhâmın kısımları, sened veya metninde mübhem şahıs bulunan rivayetlerin hadis ilmindeki yeri ve hükmü açıklanmıştır. Mübhem şahısların tespiti ile sahâbe veya tâbiîn döneminde ya da diğer asırlarda yaşayan bazı kişilerin kimlikleri tespit edilmiştir. Mübhem (belirsiz) şahsiyetleri açıklayan bazı rivayetlerin farklı olduğu, bazı mübhem şahsiyetlerin kim olduğu ile ilgili Buhârî şerhleri arasında ihtilafın bulunduğu saptanmıştır. Ayrıca bazı mübhem şahsiyetlerle ilgili herhangi bir bilginin bulunmadığı tespit edilmiştir."
