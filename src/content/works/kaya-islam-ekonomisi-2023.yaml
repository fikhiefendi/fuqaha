abstract: "Gıda israfı, İslam ekonomisi açısından büyük bir endişe kaynağıdır. İslam ekonomisi, kaynakları verimli kullanmayı, adaleti, toplumsal dengeyi ve yardımlaşmayı vurgular. Bu çerçevede, gıda israfı İslam ekonomisinin temel prensipleriyle uyumsuzdur. İslam'da, yiyecek ve içeceklerin israf edilmesi kesinlikle hoş karşılanmaz. Bu kavram, farklı anlatımlarla Kur'ân-ı Kerîm'de çoğu yerde kullanılmıştır. Çalışmamız, bir giriş ve beş bölümden oluşmaktadır. Giriş bölümünde çalışmanın önemi, amacı ve yöntemden bahsedilmiştir Kavramsal zeminini oluşturan birinci bölümde tasarruf, tüketim israf kavramının öncelikle sözlük ve literatür anlamları verilmiş, ardından ise tüketim ve israfa bakış açılarında; kapitalizmin tüketim toplumuna ve israfa bakışı, tüketim kavramına ve israf kavramına heterodoks bakış, İslam ekonomisinde tüketim toplumu, tasarruf ve israf, İslam'da tasarruf ve israf, İsraf türlerinden bahsedilmiştir. İkinci bölümde ise tezin ana çerçevesini oluşturmaktadır. Bu bölümde gıda israfı anlatılmış; dünyadaki ve Türkiye deki gıda israfı, gıda israfının nedenleri ve önleme yolları üretici ve tüketici yönünden incelenmiştir. Üçüncü bölümde ise araştırmanın yönteminden bahsedilmiştir. Dördündü bölümde bulgular, beşinci bölümde ise sonuç ve önerilerden ele alınmıştır. Bu çalışma İslam Ekonomisi perspektifinden gıda israfını analiz etmeyi ve gıda israfını etkileyen faktörleri belirlemeyi hedeflemektedir. Yapılan ankette ilk bölümde demografik değişkenler verilmiş olup, ikinci bölümde ise gıda israfı tutumuna yönelik sorular sorulmuştur. Google Forms üzerinden anket formu hazırlanmış ve uygulanmıştır. Anketi 461 kişi katılmış olup ancak eksik ve yanlış olduğu düşünülen anketler elendikten sonra 444 tanesi değerlendirmeye alınmıştır. Kolayda örneklem yöntemi uygulanmıştır. Gıda İsrafı Ölçeği için keşfedici faktör analizi yapılmış, daha sonra faktörler arası korelasyon analizi gerçekleştirilmiştir. Araştırma sonucunda tüketicilerin gıda israfının etkileyen altı boyut ortaya çıkmıştır."
