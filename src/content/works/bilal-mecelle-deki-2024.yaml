abstract: "Bu çalışmada, Mecelle'nin ilk 100 maddesi, mer'i Türk hukuku ile mukayeseli olarak ele alınmaktadır. Bu maddeler ışığında İslam hukuku ile mer'i Türk hukukunun benzer ve farklı yönlerinin tespit edilmesi amaçlanmıştır. Bu tezde Mecelle'nin ilk 100 maddesinde, Ebû Saîd el-Hâdimî'nin (v. 1176/1762) Mecâmiu'l-hakâik adlı eserinden yararlandığı, Hâdimî'nin ise İbn Nüceym'in (v. 970/1563) el-Eşbâh ve'n-nezâir eserinden faydalandığı ve bazı eklemeler yaptığı belirlenmiştir. Bu kâidelerden bazıları Mecelle'ye aktarılırken kanun kitabına uygun olması açısından ya değiştirilmiş ya da kısaltılmıştır. Mecelle, Hanefî hukukuna dayanılarak hazırlanmış olsa da bu kâidelerin farklı hukuk sistemleri tarafından uygulanabilir oldukları görülmüştür. Tezde, 100 kâidenin %90 oranında mer'i Türk hukukunda uygulama alanı bulduğu belirlendi. Geriye kalan %10 kısmında ise farklılıklar tespit edildi. Zarûret ve ihtiyacın dikkate alınması, örfün hukukun kaynağı olması, şüpheden sanığın yararlanması ilkesi gibi bazı durumların hem İslam hukuku hem de mer'i Türk hukukunda benimsendiğine dikkat çekildi. Muhakeme hukukunda ise iki hukuk sisteminin farklı yaklaşımları benimsediği görüldü. Yargılamada İslam hukuku şahitlik sistemini temel olarak benimserken mer'i Türk hukuku ceza yargılamasında buna takdiri deliller arasında yer vermiştir. Bu çalışma, hukuk sistemlerinin farklı bakış tarzları olsa da temelde birbirine benzer yanlarının da olduğunu göstermiştir."
