abstract: "Günümüz fıkıh problemleri dünyanın farklı bölgelerinde Müslümanlara dinî rehberlik sağlayan fetva meclisleri tarafından ele alınmaktadır. Bu meclisler tüp bebek (in vitro fertilization / IVF), taşıyıcı annelik, klonlama, kök hücre, genetik test, gen tedavisi, ceninin cinsiyetinin seçilmesi ve kürtaj gibi embriyo ve cenini ilgilendiren meseleleri de fetvalarında ve karar metinlerinde değerlendirmişlerdir. Söz konusu bu tıbbî müdahaleler sağladıkları faydaların yanında fıkhî ve etik birçok tartışmayı gündeme getirmektedir. Bu çalışmada çeşitli dillerde ve bölgelerde hizmet veren fetva meclislerinin tüp bebek, taşıyıcı annelik, klonlama, kök hücre, genetik test, gen tedavisi, ceninin cinsiyetinin seçilmesi ve kürtaj gibi tıbbî müdahalelere dair kararları tematik analiz yöntemi kullanılarak analiz edilmiştir. Kullanılan bu nitel analiz yöntemi ile söz konusu müdahalelere karar metinlerinde yer veren fetva kurumları belirlenmiştir. Çalışmanın temel hedefi ise embriyo ya da cenine rahim dışında ya da rahim içinde bir yönüyle müdahale eden medikal uygulamaların fıkhî hükmünün fetva meclisleri tarafından hangi fıkıh ilkeleri ile gerekçelendirildiğini tespit etmektir. Çalışma, söz konusu modern tıbbî uygulamaların fetva otoriteleri tarafından değerlendirilme biçimlerine işaret etmesi yönüyle önem arz etmektedir."
