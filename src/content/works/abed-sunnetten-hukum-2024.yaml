abstract: "Bu araştırma, Arap dili bilimlerinin İslam hukuk bilimleri açısından önemini açıklamaya çalışmıştır. Bu önem, Arap dili bilimlerinin maksatlar ile araçlar arasında ya da bilim ile uygulama arasında bir köprü oluşturmasında yatmaktadır. Şeriat bizden onun hükümlerine uygun hareket etmemizi ve bu hükümleri takip etmemizi istemektedir ve bu, yalnızca onun diline dayanan doğru bir anlatımın anlaşılmasıyla mümkün olabilmektedir. Bu çalışmada anlamların dilsel kullanımın etkisi ile akîde, fıkıh ve usul hükümleri arasındaki sıkı ilişkinin Arap dili üzerindeki etkisi ele alınmıştır. Şeriat,“Kitap ve Sünnet”etrafında şekillenmiştir. Hem imla ve nahiv hem de gerçek anlam ve mecaz açısından Kitap ile Sünnet'in dili Arapçadır. Bu nedenle şeriat hükümleri dilden ve dil kurallarından ayrı düşünülemez. Allahutaala bu dili, kutsal kitabının koruyucusu olarak seçerek ona büyük bir şeref vermiştir. Bu yüzden âlimler, dilin ve dil sanatlarının anlam değişimi ve hükümler üzerindeki etkisini büyük bir önemle değerlendirmişlerdir. Bu nedenle, Kur'ân'ı tefsir etmek, hadisleri açıklamak ve fıkıh kurallarını çıkarmak isteyenlerin Arap dili bilgisine derinlemesine vakıf olmalarını, dil kurallarını, çekimlerini, usullerini ve lehçelerini bilmelerini şart koşmuşlardır. Bu araştırmada bu konu açıklanmaya çalışılmıştır ve Arap dilinin Kitap ve Sünnetten hüküm çıkarma üzerindeki etkisini somut örneklerle göstermeye çalışmıştır. Bu çalışmada ulaşılan başlıca sonuçlar şunlardır: Arap dili, dini bilimleri inceleyenler için vazgeçilmez bir araçtır; Kur'ân-ı Kerim ve sünnet metinlerini anlamak, büyük ölçüde Arapçayı iyi bilmeye ve derinlemesine anlamaya bağlıdır. Ayrıca Arapçayı öğrenmeye yeterince önem verilmemesi, bu metinlerin yanlış yorumlanmasına ve hatalı çıkarımlara yol açabilmektedir. Bu bağlamda birçok kişinin akide konularındaki yanlış anlamalarının, Arapçayı yeterince anlamamış olmalarından kaynaklandığı görülmektedir. Allah doğru yolu gösterendir."
