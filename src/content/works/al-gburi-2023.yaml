abstract: "Bu tezde İbn Nüceym el-Hanefî'nin el-Bahrü'r-Râik isimli Eserinde kullanılan külli kaideler konu edinilmiştir. Bu konu kitabın ve müellifin ilmi konumu sebebiyle seçilmiştir. Araştırmacı konuyla ilgili ıstılahları ve prensipleri açıklamıştır. Fıkhî kaidelerin ortaya çıkışı, gelişimi, önemli özellikleri ve konuyla ilgili ıstılahlar, incelenmiştir. el-Bahrü'r-râik isimli eserde yer alan küllî kaideler ve kaidelerin uygulandığı fıkhî cüzî meselelerin yerli yerinde açıklanması için müstakil bir bölüm ayrılmıştır. Kaidenin belli yönleri ve İbn Nüceym'in kaideyi belli fıkhî meselelere uygulamasındaki isabetini tespit için İbn Nüceym'in görüşleri Hanefî âlimler ve dört mezhebe mensup diğer alimlerin görüşleriyle kıyaslanmıştır. Bu araştırmanın önemi, fıkhî kaideleri mezkûr kitaptan çıkararak toplamak ve diğer kitap ve metinlerde bahsedilenlerle karşılaştırmadan kaynaklanmaktadır. İbn Nüceym'in olaylar ve çeşitli fıkhî meselelerin hükmünü tespit hususunda bu kaideleri nasıl kullandığını tespit etmede araştırmanının önemli bir başka özelliğidir. Ayrıca İbn Nüceym'in mezhebinin temel esaslarını derin bir şekilde anlaması ve keskin fikri ve bakış açısının inceliği sebebiyle bu esaslardan istifade etmedeki başarısını da ortaya koyma araştırmanın hedefleri arasındadır. Araştırmada fıkhî kaidelerin bir araya getirilmesi, usul ve fıkıh kitaplarında uygulanması, kaidelerin tahlil edilmesi, içlerinden ayrılanların tespit edilmesi ve fıkıh dallarından bu kaideler üzerine bina edilenleri ortaya konulurken analitik tümevarım yöntemi kullanılmıştır. İbn Nüceym'in görüşlerinin diğer dört mezhep mensuplarının görüşleriyle kıyaslanması, benzer ve ihtilaflı hususların ortay konmasında karşılaştırma metodu kullanılmıştır. Araştırmada ulaşılan sonuçlarda önemli olanları şunlardır: İbn Nüceym, kaide ve hükümleri şerh etmek için naklettiği görüşleri açıklamış, kendi anlayışına göre kaideyi fıkhi hâdiselere uygulamış, kitaptan ve sünnetten şer'î muteber aslı olan fıkhi kaideleri kullanmıştır. Eserde istifade edilen kaynakların tamamı Hanefî mezhebinin aslî kitaplarıdır. İbn Nüceym bizzat kendisi de ifade ettiği gibi geçmiş alimlerin kitaplarından bolca istifade etmiştir. En-Nihâye Şerhü'l-Hidâye, es-Sirâcü'l-Vehhâc Şerhu muhtasari'l-Kudûrî, Nikâye ve diğerleri bu kaynaklara örnek olarak verilebilir."
