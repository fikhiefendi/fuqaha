abstract: "Usûl-i fıkh, tafsîlî delillerden hükümlerin nasıl istinbât edildiği hakkında bilgi veren bir bilim dalıdır. Usûl-i fıkhın konularından birini teşkil eden deliller ise temsil ettikleri mezheplerin ictihâd yöntemlerini ve mezhebin üzerinde kurulduğu sistemi aktarma çabasının bir parçasıdır. Bu çalışmada da istishâb özelinde Hanefî mezhebinde muteberliği tartışmalı olan deliller ele alınmıştır. Çalışmanın birinci bölümünde delil kavramına yer verilmiştir. Bu meyanda istishâbın da içerisinde bulunduğu, muteberliği tartışmalı olan bazı delillerin, 'delilsizlik ile ihticâc', 'saptırıcı', 'fâsid' ve benzeri vasıflar ile nitelendirilerek aktarıldığı; kimi zaman ise illeti tespit etme yöntemlerinden tenkit edilen 'tard' bağlamında değerlendirildiği tespit edilmiştir. Bu deliller hakkında kısaca bilgi verilerek birlikte anılmaları hususunda ortak bir paydanın gözetilip gözetilmediğine temâs edilmiştir. İkinci bölümde bu tür deliller arasında en fazla tartışma konusu yapılan istishâb delili ele alınarak mâhiyet ve çeşitlerine yer verilmiş; delil değeri ve diğer deliller arasındaki konumuna dair serd edilen görüşler incelenmiştir. Son bölümde ise istishâb delili ile ilişkilendirilen küllî kâideler tahlil edilmiş; ayrıca konunun daha anlaşılır hâle gelmesi için usûl eserlerinde istishâb delili ile ilgili işaret edilen bazı örnekler îzâh edilmiştir. Sonuç olarak, Hanefî usûl eserlerinde muteberlik bağlamında değerlendirilen delillerin değer olarak aynı derecede görülmediği; bu delillerden istishâbın ise özellikle bir başkasını ilzâm etme ve yeni haklar elde etmede kullanılabilecek kuvvette bir delil olmasa da, mezhep tarafından kabul edilen delillerin sonuç vermemesi durumunda mevcut hakları korumada fayda sağladığı söylenebilir."
