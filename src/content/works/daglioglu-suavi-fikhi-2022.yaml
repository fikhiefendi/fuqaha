abstract: "XIX. yüzyıl Osmanlı âlim ve aydınlarından olan Ali Suâvi (1839-1878), dönemin problemleriyle yakından ilgilenmiş ve gazetecilik, yazarlık, vaizlik, medresede hocalık gibi yönlerini kullanarak Osmanlı Devleti'nin yeniden ayağa kalkması ve bekâsı uğrunda verdiği mücadele ile hayatını geçirmiştir. Avrupa'da bulunduğu (1867-1876) dokuz yıllık sürgün hayatı sırasında; Batılı fikir akımlarını tanıma şansı yakalamış, yitik mal misali Müslümanlara fayda sağlayacak siyasî ve ictimâî kavram ve fikirleri, İslâm'ı referans alıp tekrar yorumlayarak düşünce dünyamıza kazandırmıştır. Bu yönüyle siyâsî ve sosyoloji tarihimizde; ictihad kapısını aralayıcı fetvaları ve fıkıh usulünde yeni yöntem fikirleri ile de fıkıh tarihimizde Suâvi'nin hikâyesi kıymetlidir. Ayrıca gazeteciliğin ülkeye girişteki serüveninin görülmesi açısından basın tarihimizde; medrese müfredâtını ve sistemini eleştirmesi ve ıslahı için tekliflerde bulunmasının yanında Galatasaray Mekteb-i Sultânîsi'nde müdürlüğü (1877) sırasındaki girişimleriyle eğitim tecrübemizde ayrı yeri vardır. Bu tezin konusu, Suâvi'nin diğer alanlardaki tüm görüşleriyle de bir şekilde irtibatta olan fıkıh düşüncesi ve fıkhî görüşleridir. Çalışmanın ilk kısmında Suâvi'nin hayatı, dönemi, Yeni Osmanlılarla ilişkisi ve gazetecilik faaliyetleri ele alınmıştır. İkinci kısımda ise, fıkıh alanına giren siyâsî ve sosyal meseleler ile genel fıkıh düşüncesi ve çeşitli fıkhî konularla ilgili görüşleri incelenmiştir. Bu çalışma ile Suâvi'nin tüm düşüncesini etkileyen fıkıh anlayışı ile ilgili bütüncül bir tablo çizilmesi amaçlanmıştır."
