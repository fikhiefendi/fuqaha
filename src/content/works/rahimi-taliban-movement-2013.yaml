abstract: "Taliban sorunu halen Afganistan'da önemli konulardan biri olmaya devam etmektedir. Taliban, adalet ve barışı sağlama ve Afganistan'da İslam Hukukuna dayalı bir sistem kurma söylemi ile ortaya çıkmış bir harekettir. Savaş yorgunu Afganistan halkı öncelikle Taliban'ı hoş karşılamıştır ancak Talibanın radikal ve katı kurallarını gördükten sonra bir kez daha güç elde etme hırsının acı sonuçlarıyla karşılaşmıştır. ABD liderliğindeki koalisyonun işgalinden sonra Taliban Afganistan'ın kontrolünü kaybetti. Talibanın defteri kapanmış ve güçleri yenilmişti. Ancak Taliban, Afganistan halkı için daha fazla sorun yaratacak ve Afganistan'ın yeniden yapılanma ve gelişmesi sürecini engellemek için 2003 yılında bir kez daha Afganistan sahnesine çıkmıştır. Daha radikal bir tavır almış ve daha önce taraflarınca hiç kullanılmamış intihar saldırılarını direniş stratejileri olarak benimsemişlerdir. Bu tez, Taliban intihar bombacılarının nasıl ortaya çıktığını ve Talibanı daha radikal olmaya iten sebebi araştırmaktadır. 2001 öncesi ve sonrası Taliban hareketini karşılaştırarak, Afganistan'daki aktörler arasında olan güç dengesinin değişime uğrayıp uğramadığına bakacağım ve simetrik ya da asimetrik dengelemenin Taliban'ın radikalleşmesi üzerinde etkisi olup olmadığına bir sonuç çıkaracağım."
