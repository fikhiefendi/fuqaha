abstract: "Bu çalışmanın temel amacı 10/16. yüzyıl Osmanlı döneminde yaşamış Kütahyalı şair-vaiz Firâkî Abdurrahman Çelebi'nin kelamî düşüncesini, ona ait olduğu tespit edilen üç eser üzerinden incelemeyi amaçlamaktadır. Firâkî'nin hocası Hakîm İshak tarafından kaleme alınan el-Fıkhu'l-ekber şerhine yaptığı mensur tercümesi, müellifin sadece bir dilden diğer bir dile aktarıcı olduğunu değil aynı zamanda yorumlayıcı bir tavır gösterdiği göstermektedir. Tercüme boyunca ortaya koyduğu açıklamalar onun itikâdî meselelere dair yaklaşımını yansıtmaktadır. Bu metinle birlikte Firâkî'ye nispet edilen Kırk Sual Şerhi ve Sa'âdet-nâme adlı iki farklı türdeki eserleri de değerlendirmeye alınmış; Firâkî'nin itikâdî kimliği edebî ve tasavvufî yönleriyle birlikte çok yönlü bir biçimde değerlendirilmiştir. Çalışmada metin çözümlemesi ve karşılaştırmalı yöntem kullanılarak Firâkî'nin temel inanç meselelerindeki tutumu belirlenmiş ve mensubu olduğu kelamî geleneğin izleri tespit edilmeye çalışılmıştır."
