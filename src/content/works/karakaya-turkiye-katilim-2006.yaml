abstract: "228 TEZ ÖZETİ Tezde, ülkemizde çalışma esaslarından dolayı bankacılık sektöründen uzak kalmak isteyen kişilerin, tasarruflarını değerlendirmeleri, projelerine finansman sağlamaları ve bu kişilerin bankacılık hizmetlerinden yararlanmaları amacıyla kurulan ve son düzenleme ile banka statüsüne kavuşan, Katılım Bankalarının genel özellikleri üzerinde durularak tanıtılmıştır. Katılım bankalarının mali sistemin bir unsuru olması dolayısıyla sürekli izlenmesi, sistemi etkileyebilecek durumlarda müdahale edilmesi gerekmektedir. Bu nedenle katılım bankalarının denetimi oldukça önelidir. Tezde katılım bankaları nezdinde iç, kamu ve dış denetçiler tarafından yapılan denetim çalışmaları genel nitelikleri itibariyle anlatılmıştır."
