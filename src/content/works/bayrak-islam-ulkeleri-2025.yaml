abstract: "Türkiye Muhasebe Sistemi ile İslami ülkelerin muhasebe sistemlerinin karşılaştırıldığı ve bu karşılaştırma sonucunda elde edilen verilere dayanarak ortak bir muhasebe önerisinin oluşturulmasının amaçlandığı bu çalışmada İslami finans ilkeleri doğrultusunda İslam Ülkelerinin muhasebe yapılarının karşılıklı etkileşimini incelenmektedir. Bu çalışma, İslami ülkeler arasında yürütülen çeşitli ticari ve mali ilişkiler bağlamında, ekonominin temel yapı taşları olan kurumların karşılıklı işlemlerinde kullanılabilecek pratik, şeffaf ve dinamik bir muhasebe sistemine ulaşılması amacıyla Türkiye ve İslam Ülkelerinin muhasebe organizasyonlarının incelenmesi ve karşılaştırılmasıyla gerçekleştirilmiştir. Karşılaştırma sonucunda elde edilen bulgulara dayanarak hem İslami muhasebe standartlarını hem de uluslararası uygulamaları göz önünde bulunduran ortak bir muhasebe sistem önerisi geliştirilmiştir. Bu çalışma kapsamında öncelikle konunun önemini vurgulayan kapsamlı bir literatür taraması yapılmıştır. Tarama sürecinde muhasebeyle ilgili yabancı ve yerli kaynaklar, tez çalışmaları, akademik makaleler, muhasebe standartlarını içeren belgeler ile ilgili mevzuat incelenmiş; özellikle İslami muhasebe uygulamalarına dair temel kaynaklara başvurulmuştur. Türkiye Muhasebe Sistemi ile incelenen İslami ülkelerin muhasebe sistemleri karşılaştırma tekniğiyle analiz edilerek benzerlikler ve farklılıklar ortaya konulmuştur. Çalışma bu yönüyle önem kazanmaktadır. Araştırmada yapılan bu karşılaştırmalar sayesinde, ülkeler arasında muhasebe sistemlerinin uyumlaştırılması yönünde önemli veriler elde edilmiş, karşılıklı ticari faaliyetlerin muhasebe boyutunda daha sağlıklı yürütülebilmesi açısından bu çalışmanın işletmeler ve ulusal ekonomi açısından katkı sağlayacağı değerlendirilmektedir. Çalışmamızın amacı İslam Ülkelerinin Muhasebe Sistemleri ile Türkiye'de uygulanan Tek Düzen Muhasebe Sisteminin karşılaştırılarak ayrışma ve çakışmalarının tespit edilmesini sağlamak ve bu analiz sonrasında ortak ticaret anlayışının muhasebe ayağının sorunsuz gerçekleşmesi için ortak muhasebe organizasyonu önerisi getirebilmektir. Amaca ulaşabilmek için yapılan literatür taraması sonucunda gerekli analizler nitel olarak yapılarak karşılaştırmalar yapılacaktır. Çalışmanın muhasebe ve işletme bilimine katkı sunması umut edilmektedir."
