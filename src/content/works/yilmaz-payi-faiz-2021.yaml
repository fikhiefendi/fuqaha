abstract: "Faizsiz bankalar, İslami kurallara uygun faaliyet yürüten finansal kurumlardır. İslamiyet'te faizin yasak olması Müslüman kesim tarafından alternatif banka olarak görülen faizsiz bankacılık sisteminin kurulmasında temel etken olmuştur. Faizsiz bankacılık sistemi 1963 yılı itibariye Müslüman nüfusun yoğun olduğu ülkelerde kurulmuş ve hızla gelişmeye başlamıştır. Türkiye'de faizsiz bankacılık sistemi 1985 yılında kurulan iki Özel Finans Kurumu (ÖFK) ile başlamıştır. ÖFK'lar 2005 yılında çıkarılan kanun ile Katılım Bankası adını almıştır. Türkiye'de 2021 yılı itibariyle 6 tane katılım bankası faaliyet göstermektedir. Çalışma kapsamında, Türkiye ve Malezya'da faaliyet gösteren faizsiz bankalar ile konvansiyonel bankalar arasındaki ilişkiyi ortaya koymak amacıyla, aylık ortalama kâr payı oranları ile aylık ağırlıklı ortalama mevduat faiz oranları arasındaki nedensellik ilişkisi, Toda – Yamamoto nedensellik analizi yapılarak tespit edilmeye çalışılmıştır. Türkiye'nin 2010-2019 ve Malezya'nın 2015-2019 dönemi aylık verileri kullanılarak kâr payı ile faiz oranları arasındaki nedensellik ilişkisi Eviews10 istatistik programı aracılığıyla analiz edilmiştir. Yapılan ekonometrik analiz sonucunda, Türkiye'de konvansiyonel bankaların mevduat faiz oranlarından, İslami bankaların müşterilerine dağıttığı kâr payı oranlarına doğru tek yönlü bir nedensellik ilişkisi olduğu, Malezya'da ise mevduat faiz oranları ile kâr payı oranları arasında nedensellik ilişkisi olmadığı sonucuna ulaşılmıştır. Elde edilen sonuçlardan yola çıkılarak iki ülkenin faizsiz bankacılık sistemi karşılaştırılmıştır. Malezya'da, faizsiz bankacılık sisteminin bankacılık sektöründeki payının yüksek olmasından dolayı, kâr payı oranlarının faiz oranlarından etkilenmediği görülmüştür. Ancak Türkiye'de kâr payı oranlarının faiz oranlarından etkilendiği görülmüştür. Bu nedenle Türkiye'de de faizsiz bankacılık sisteminin gelişmesi gerektiği sonucuna ulaşılmıştır."
