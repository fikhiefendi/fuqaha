abstract: "İslam hukuku sanıklara, onurlarını koruyan ve onları zulme karşı koruyan pek çok hak tanımıştır. Bu haklar arasında masumiyetin varsayılması ve kendini savunma hakkı veya savunma için bir vekil atama hakkı gibi haklar bulunmaktadır. Libya hukukunda sanık hakları ise Ceza Muhakemesi Kanunu'nda belirlenmiş olup, bazıları açıkça belirtilmiştir. Ancak, Libya yasaları sanığı terimsel olarak tanımlamamakta ve onunla ilgili hükümler, en son 2014 yılında yapılan yasal değişikliklerde yer almaktadır. İslami hukukta masumiyetin korunması hakkı, Kur'an ve sünnette açıkça ifade edilmiştir; ancak Libya hukukunda bu hak açıkça tanımlanmamıştır. Libya yasalarında, sanığın haklarını güvence altına alan prensipler bulunsa da yasada bunlar açıkça belirtilmemiştir. Örneğin, masumiyetin varsayılması ve insan onuru prensibi gibi. Bu durum, aşırılıklara neden olabilmektedir. Gizliliğin korunması, İslam ve Libya hukukunda güvence altına alınmıştır, ancak yöntemler farklılık göstermektedir; eğer sanık bir kadınsa, İslam hukuku erkekler tarafından dokunulmaması gerektiğini belirtirken, Libya hukuku da kadınlar tarafından arama yapılmasını zorunlu kılmaktadır. Ayrıca, Libya hukukunda önleyici tutuklama süresi 15 günden fazla olamazken, İslam hukukunda bu, hâkimin takdirine bırakılmıştır. Bu ve benzeri farklılıklar sebebiyle sanık haklarının İslam hukuku ile diğer ceza hukukları arasında bir mukayesesine, benzerlik ve farklılıkları ortaya koymaya ihtiyaç vardır. Araştırmanın konusu da bu ihtiyaca binaen İslam ceza hukuku ile Libya hukuku arasındaki sanık haklarının incelenmesi üzerinedir. Bu araştırmada, sanığın temel hakları, suçlu bulunana kadarki masumiyet hakkı, kendini savunma hakkı ve adil bir yargılama hakkı gibi haklar ele alınmakta olup, bunlara dair dini deliller ve hukuki metinler de incelenmektedir. Ayrıca, Libya hukukunda arama ve sorgulama gibi ceza usullerine de yer verilmekte, sanığın haklarını korumak amacıyla kötüye kullanımı önlemek için sağlanan haklar ele alınmaktadır. Araştırmanın problemini, Libya hukuku da dahil olmak üzere mevcut yasaların yetersizliği oluşturmaktadır. Çünkü bu yasalar genellikle Batı hukukuna dayanmaktadır. Çalışmanın amacı, Libya yasalarındaki eksiklikleri keşfetmek ve bunları, kendine özgü ve tam olan İslami yasalarla karşılaştırmaktır. Böylece İslam hukukunun sanık haklarını nasıl koruduğunu açıklamak ve Libya yasalarının benimsediği sanık haklarını tanımlayıp analiz etmek ve bunları İslam hukukuyla karşılaştırmaktır. Araştırmada, Libya yasalarının maddeleri ile İslam hukukunun sanık haklarına ilişkin metinlerini incelemek için istatistiksel, analitik ve karşılaştırmalı yaklaşım olmak üzere üç yöntem kullanılmıştır."
