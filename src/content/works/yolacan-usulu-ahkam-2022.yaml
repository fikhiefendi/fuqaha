abstract: "Bu tezde 6/12. Asrın Zeydî muhaddislerinden Ahmed b. Süleyman (öl. 566/1171) ve onun Usulü'l-ahkâm el-cami' li mesail'l-helal ve'l-haram adlı eseri çerçevesinde ahkâm hadislerini yorumlama yöntemi üzerinde durulacaktır. Bu tezin temel sorusu şudur: Zeydî fakihlerin ahkâm hadislerini anlama ve yorumlamada dikkate aldıkları temel yaklaşım ve yöntemler nelerdir? Bu sorunun cevabı Hicrî 6. asır Zeydî fakihlerinden Ahmed b. Süleyman'ın Usulu'l-ahkâm adlı eseri üzerinden verilecektir. Çalışmada ağırlıklı olarak müellif ve eser merkezli bir yöntem takip edilmiştir. Ahmed b. Süleyman'ın hadisleri yorumlamadaki prensiplerini ortaya koymak için analiz yöntemi kullanılmıştır. Usulü'l-ahkâm kitabındaki hadisleri yorumlama örneklerinden yola çıkarak tümevarım metodu ile sonuçlara ulaşılmıştır. Usulü'l ahkâm eseri çerçevesinde Ahmed b. Süleyman'ın hadisleri analiz ve değerlendirmelerini incelerken onun hadisleri hem sened hem de metin yönünden ele aldığını gördük. Bu tespit ışığında Ahmed b. Süleyman'ın hadisleri hem muhaddis hem de fakih bakış açısı ile ele aldığını, rivayet ve dirayet bütünlüğüne dikkat ettiği sonucuna ulaştık."
