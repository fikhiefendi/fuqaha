abstract: "Dünyada 1970'li yıllardan itibaren şekillenmeye başlayan faizsiz bankacılık kurumsal yapısı Türkiye'de önce 1983'te ?özel finans kurumu? adıyla ortaya çıkmış ve 2005 yılından itibaren de katılım bankacılığı adıyla varlığını sürdürmüştür. Bu kurumsal yapı, ürün türü, işlem hacmi ve diğer yönlerden gelişmesini devam ettirmektedir.Katılım bankacılığının kendisine has uygulama esasları bulunmaktadır. Katılım bankaları fon kullandırım gelirlerinin ortaklık usulüyle dağıtılması esasına göre fon toplamaktadır. Bu durum bilanço varlık ve yükümlülüklerini birbirine bağlamakta, böylece daha sağlam bir yapı oluşturmaktadır. Dış ve iç değişkenleri dikkate alarak, katılım bankası yöneticileri de hem büyümek hem de karlarını maksimize etmek için çalışmaktadır. Bu sebeple maliyet analizi ve fiyatlama katılım bankaları için de büyük önem arzetmeye başlamıştır.Katılım bankaları maliyet ve performanslarını ölçen reel ve esnek metodlar geliştirmek durumundadır. Bu sayede büyüme ve kârlılık hedeflerini gerçekleştirebileceklerdir."
