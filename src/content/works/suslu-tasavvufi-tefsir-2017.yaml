abstract: "Tefsîr ekolleri içerisinde en dikkat çekici olanlarından biri sûfîlerin tefsîrleridir. Onlar Kur'ân'ı Allâh'ın ezelî kelamının tezahürü olarak görmüşler ve sebeple de Kur'ân'ın sınırsız anlamlara sahip olduğunu düşünmüşlerdir. Dolayısıyla onlara göre Kur'ân'ın zâhirinin altında birçok bâtınî anlamlar yatmaktadır. Bu bâtınî anlamlar ma'rifet ehline zâhiri tatbiklerinin karşılığı olarak verilmiş ilâhî bir bağıştır. Söz konusu yorumları Kur'ân'ın tefsîri olarak görmemişler, aksine bunun bir nevi te'vîl olduğunu belirtmişlerdir. O yüzden âyetler hakkında yaptıkları yorumlara işâret adını vermişlerdir. Zaten bu nedenle tasavvufî tefsîrler İşârî Tefsîr adıyla da anılmıştır. Kur'ân'ın bâtınını idrâk etmek için zâhirini iyi bilmek ve onu tam anlamıyla tatbik etmek gerekir. Ayrıca bâtınî anlamın sıhhat ölçütü de zâhire uygunluğudur. Kur'ân'ın zâhirine uymayan her bâtın onlara göre bâtıldır. Bâtınîlik ve Zâhirîliğin aksine onlar Kur'ân'ın hem zâhirini hem de bâtınını bir araya getirmeye çalışmışlardır. Nitekim tasavvufî tefsîrlerin bâtınî te'vil geleneğinden en büyük farkı, tasavvufî yorumların keşfe dayalı olması ve zâhirî anlamla uyum içerisinde olmasıdır. Oysa Bâtınîlikte zâhirî anlam önem taşımaz; Zâhirîlikte ise bâtın anlam inkâr edilir. Sûfîler, işârete dayalı yorumlarının Kur'ân'ın zâhiriyle uyum içerisinde olduğunu göstermek adına eserlerinde sözlerine farklı âyetlerden delil getirmişler, kelimelerin lügat anlamlarını nakletmişler, birçok hadîs ve sahabe sözlerini rivâyet etmişlerdir. Ahkâm âyetlerini, kevnî âyetleri ve Kur'ân'da anlatılan kıssaları teşbih esaslı itibar yöntemiyle ele almışlar ve farklı işârî anlamlar zikretmişlerdir."
