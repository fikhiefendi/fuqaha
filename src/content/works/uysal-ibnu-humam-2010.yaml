abstract: "Memluk Devletinin topraklarında doğup burada yaşayan İbnü'l-Hümam, Hanefî mezhebinin önemli âlimlerindendir. Hanefî mezhebinin en önemli kaynaklarından olan Hidâye'yi şerheden İbnü'l-Hümâm'ın Fkıh ve Kelam alanında önemli eserleri vardır. Fethu'l-Kadîr'de fıkıh alanında yazdığı en geniş eseridir. Çalışmada; dis alanında günümüze ulaşan eseri olmayan müellifin hadis ilmindeki yeri bu eserden yola çıkılarak incelenmiştir.Tez, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın konu, amaç ve kaynaklarına yer verilmiştir.Birinci bölümde İbnü'-Hümâm'ın içinde yaşadığı sosyal ve ilmî çevre ile hayatı, eserleri, hocaları ve talebeleri gibi konular anlatılmıştır.İkinci bölümde ise İbnü'l-Hümâm'ın hadisçiliği değerlendirilmiştir. Eseri baştan sona okunarak elde edilen verilerden yola çıkılarak bazı sonuçlara ulaşılmıştır. Ayrıca bu bölümde daha önceden belirlenen 350 kadar hadisin sıhhat değerlendirmeleri yapılmıştır.İkinci ve son bölüm ibnü'l-Hümâm'ın kullandığı kaynakların değerlendirilmesi ve sonuç bölümüyle tamamlanmıştır."
