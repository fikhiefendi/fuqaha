abstract: "ÖZET YİĞİT Metin,“Fey', Zekat ve Talak Ayetleri Çerçevesinde Lafzı ve Gaî Yorum Tartışmaları”(Yüksek Lisans Tezi) Yöneten: Prof. Dr. Abdülbaki TURAN Kullanıldığı alana göre anlam kazanan Yorum, İslami literatürde içtihat, tefsir ve istinbat gibi terimlere tekabül eder. Buna göre yorum; kişinin Şariin muradını anlama faaliyeti olarak tanımlanır. Metnin gerçek mana ve maksadını belirleme ancak yorum faaliyetiyle mümkün olduğundan yorum, metni anlama ve yaşamanın ilk basamağını oluşturur. Dini nasslar, arzettikleri farklı özellikler nedeniyle kat'î (yoruma kapalı) ve zannî (yoruma açık) kategorilerine ayrılır. İçtihat düzeyinde yorum faaliyetinde bulunan şahsın, belli bazı nitelikleri {adalet ve ilmi ehliyet) taşıması gerekir. Yorum, metnin varlığı ve vahyin nüzûlüyle yaşıt denecek kadar eskidir. Bu nedenle Peygamber döneminden itibaren var olagelen bir yorum ve bunun teorik çerçevesini belirleyen metoda (usûl) tanık olmaktayız. Daha sonraki dönemlerde sistematik bir yapıya kavuşan bu usûl, dinamikleri itibariyle sabit ve sürekli bir özellik arzeder. Kitap, Sünnet, İcma ve İçtihat hiyerarşisi bu metodun karakteristik yapısını oluşturur. İslami nassların yorum metodolojisi olan fıkıh usûlü, yorumu iki ana çerçevede ele alır. Bunlardan biri lafza dayalı yorum, diğeri gaye ve maksada dayalı yorumdur. Lafzî Yorum, nassın taşıdığı dil ve üslûp özelliklerini incelerken; Gaî Yorum daha genel bir çerçevede metin sahibinin maksadını keşfetmeye çalışır. Lafzî ve Gaî yorum birbirine alternatif değil, birbirini tamamlayan denge unsurları olarak anlaşılmalıdır. Sağlıklı bir yorumda gaye ve espiri kadar lafız ve şekil de önem arzeder. Bunlardan birini diğerine tercih etmenin haklı hiçbir dayanağı olamaz. Bu meyanda en fazla kullanılan argümanlar, Hz. Ömer'in Fey', Zekat ve Talakla ilgili uygulamalarıdır. Ancak iyice irdelendiğinde bu uygulamaların iddia edildiği gibi kat'î nassa rağmen yoruma gitmek niteliğinde olmadığı görülecektir. Aksine Hz. Ömer, bütün uygulamalarında ya nassı olduğu gibi uygulamış ya da hükmün uygulama gerekçesinin (illet) bulunmaması nedeniyle tatbikatı durdurmuştur."
