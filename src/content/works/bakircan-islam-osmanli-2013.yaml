abstract: "İstanbul Bab Mahkemesinde 1833-1837 yılları arasında yazılan sekiz mahkeme defteri, dönemin fetvâ mecmuaları ve klasik fıkıh eserleri çerçevesinde hazırlanan bu çalışma, iki ana bölüm ihtivâ etmektedir: İslam hukukunda nafaka ve Osmanlı hukukunda nafaka. İlk bölümde nafaka konusu klasik fıkıh kitaplarından yararlanılarak kısaca anlatılmış ve ikinci bölümde Osmanlı uygulamasını görmek üzere, genellikle karı koca ilişkilerini kapsayan davalardan müteşekkil olan İstanbul Bab Mahkemesi'ndeki sicil kayıtları ve fetvâlar incelenmiştir. Bu araştırma sayesinde İslam hukukunun Osmanlı Devleti?nde uygulanış sahasına girerek teorik bilgilerin pratikte yansımaları olduğu ortaya çıkarılmaya çalışılmıştır."
