abstract: "Nesh meselesi, hicri ikinci asırdan itibaren fıkıh usulü başta olmak üzere birçok ilim dalının konusu olmuştur. Fıkıh tarihi içerisinde nesh konusu üzerinde ciddiyetle duran, konunun kavram ve ıstılahlarını ortaya koymaya çalışan ilk alim İmam Şafiî olmuştur. Bu anlamda özellikle fıkıh usulü alanlarında ilk tedvin edilen eserlere öncülük etmiş olan İmam Şafiî eserlerinde nesh konusuna detaylıca yer vermesiyle bu konuda kendisinden sonra gelenlere kaynaklık teşkil etmiştir. O neshin tahsis, takyid ve istisna kavramlarıyla eş değer manalarda kullanıldığı henüz İslami ilimlerin kavramsallaşma sürecinin başında neshe dikkat çekerek, ona yüklediği anlamla neshi bu kavramlardan ayırmıştır. İmam Şafiî nesh konusundaki düşüncesini“her şey ancak kendi dengi ile neshedilebilir”kaidesine dayandırarak, Kitab'ın ancak Kitap ile, sünnetin de ancak sünnet ile nesholabileceğini kabul etmiştir. Şafiî, nesh konusunu nazari bir mesele olmaktan ziyade pratik bir mesele olarak incelemiştir. Bu anlamda temizlikten ibadete, aile hukukundan hadd cezalarına varana kadar -itikadî hükümler dışında- fıkhi birçok konuda neshin örneğini sunmuş, bu örneklendirmelerinde de neshin Kitap ve sünnetin neshinin kabul ettiği şartlarla gerçekleştiğini delillerle temellendirmiştir."
