abstract: "?Edebü'l-Kâdî Adlı Eseri Işığında Mâverdî'nin Sünnet Anlayışı? olarak belirlediğimiz bu çalışmamız, `Giriş'le beraber dört bölümden oluşmaktadır.Giriş bölümünde Mâverdî'nin hayatını ve Edebü'l-Kâdî adlı eserini inceledik.Birinci bölümde sünnetin tarifi, delil olma durumu, bölümleri ve bu konuda Mâverdî'ye has görüşlerden bahsettik.İkinci bölümde, haber kavramına, çeşitlerine ve Mâverdî'nin haberleri farklı derecelendirip anlamlandırmasına değindik.Üçüncü bölümde de râvîlerin özelliklerini ve hadîs alma şekillerini ele aldık. Son olarak da Mâverdî'nin, râvîlerle ilgili tartışmalı olan meselelerdeki görüşlerini beyan ettik.Sonuç kısmında ise, araştırmamızda elde ettiğimiz neticeyi ve Mâverdî'nin sünnetle ilgili olarak tespit ettiğimiz özgün görüşlerini vurguladık."
