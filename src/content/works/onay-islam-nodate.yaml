abstract: "Bu çalışma, İslam hukukunda anlaşmazlığı (nizâ) önleme olgusunun yerini ve önemini tespit etmeyi, onu hukuk sisteminin bütününe nüfuz eden genel ve şemsiye bir ilke olarak temellendirerek fıkhın farklı alanlarındaki yansımalarını sistematik bir bütünlük içinde ortaya koymayı amaçlamaktadır. Klasik İslam hukuk literatüründe anlaşmazlık meselesi çoğunlukla borçlar hukuku ekseninde, akitlerin sıhhat şartları çerçevesinde ve özellikle cehalet ile garar kavramları bağlamında ele alınmış; ancak anlaşmazlığı önleme olgusunun müstakil ve kapsamlı bir teori olarak incelenmediği görülmüştür. Bu tez, söz konusu boşluğu doldurmayı hedeflemektedir. Çalışmada, hukukun adaleti tesis etme, hukukî emniyeti sağlama ve toplumsal ihtiyaçları karşılama gibi temel işlevlerinin anlaşmazlık durumlarında nasıl zedelendiği ortaya konulmuş; bu bağlamda anlaşmazlığı önlemenin yalnızca bir sonuç ya da hikmet değil, hukuk üretim sürecinde gözetilen asli bir illet ve gaye olduğu savunulmuştur. Araştırmada nitel ve anlam odaklı bir yöntem benimsenmiş, klasik fıkıh kaynakları tümevarımcı ve yorumlayıcı bir perspektifle analiz edilerek dağınık hükümlerin aslında bütüncül bir nizâ teorisi etrafında birleştiği gösterilmiştir. Araştırmanın ayırt edici yönü kişiler, aile, eşya, borçlar, miras ve ceza hukuku gibi farklı alanlarda ortaya çıkabilecek anlaşmazlık sebeplerini sistematik bir tasnife tabi tutması ve bu uyuşmazlıkları henüz ortaya çıkmadan önlemeye yönelik geliştirilen fıkhî araçları bütüncül bir çerçevede ele almasıdır. Ayrıca klasik literatürde dağınık halde bulunan ancak müstakil bir teori altında değerlendirilmeyen ama mahiyet itibarıyla anlaşmazlığı önleme ilkesine dâhil edilebilecek hususlar da incelenmiştir. Furû fıkıh merkezli bir karakter taşıyan bu çalışma, nasslar, sahabe uygulamaları ve icmâ gibi naklî delillerin yanı sıra maslahat, istihsan, sedd-i zerâyi, örf ve kavâid-i fıkhiyye çerçevesinde anlaşmazlığı önleme ilkesinin usûlî arka planını da ortaya koymaktadır. Bu çalışmada İslam hukukunun yalnızca ortaya çıkan uyuşmazlıkları çözen bir sistem olmadığı; aksine şekil şartları, belirlilik esasları ve ispat kurallarıyla hukukî emniyeti sağlayan, uyuşmazlıkları daha doğmadan önleyen düzenleyici bir yapıya da sahip olduğu gösterilmiştir. Sonuç olarak, anlaşmazlığı önleme ilkesinin fıkhî meselelerin değerlendirilmesinde işlevsel bir parametre ve kurucu bir üst değer olarak kabul edilmesinin, hem klasik fıkhın iç tutarlılığını pekiştireceği hem de günümüzün karmaşık hukuk problemlerine çözüm üretme kapasitesini güçlendireceği sonucuna ulaşılmıştır."
