abstract: "İslâmiyette gerek müslüman toplumların diğer milletlerle olan savaş münasebetlerinde, gerekse bir din olarak İslâm'ın dünyaya hâkim kılınması şeklinde ifade edilebilecek idealin yaşatılmasında cihad olgusu merkezi bir öneme sahip olmuştur. Cihadın dinî ve hukukî boyutuna ışık tutmak maksadıyla oldukça erken sayılabilecek bir dönemde müstakil eserler telif edilmiş, bu sahadaki çalışmalar ilk dönemlerden modern çağa değin devam etmiş ve konu etrafında zengin bir literatür oluşmuştur. Bu çalışma, ilk asırlardan günümüze kadar cihad alanındaki literatürü ve bu sahada temsil gücü yüksek bir Şâfiî fakihi olan Bedreddin İbn Cemâa'nın ilgili eserlerinin incelenmesini konu edinmektedir. Bir giriş ve iki bölümden oluşan çalışmanın giriş kısmında ilk olarak cihad kavramının sözlük ve terim anlamları etrafında kavramsal çerçevesi çizilmiş, ardından fürû fıkıh kitaplarında cihadın nasıl bir tasnif dâhilinde ve hangi başlıklar altında incelendiği üzerinde durulmuş, ilave olarak her mezhepte temsil gücü yüksek iki eser seçilerek cihadın konu edindiği bölümlerin içindekiler listesi tablo halinde sunulmuştur. Birinci bölüm, İslâmî literatürde cihadla ilgili eserlere ayrılmıştır. Bu bölümde ilk dönemlerden 20. yüzyılın ortalarına kadar kaleme alınmış kitap, risale ve makale türlerindeki eserler ele alınmış, kuruluşundan günümüze kadar Türkiye'de bu sahada telif edilen çalışmalara da yer verilmiştir. İkinci bölüm, İbn Cemâa ve cihada dair eserlerini konu edinmektedir. Bu çerçevede ilk olarak İbn Cemâa'nın hayatı, ilmî çalışmaları ve yaşadığı döneme değinilmiş, ardından cihada dair yazdığı Tahrîrü'l-ahkâm fî tedbîri ehli'l-İslâm, Müstenedü'l-ecnâd fî âlâti'l-cihâd ve Tecnîdü'l-ecnâd ve cihâtü'l-cihâd eserleri değerlendirilmiştir."
