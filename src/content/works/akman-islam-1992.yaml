abstract: "Özet:İslâm Hukukunda Akdi Mesuliyetten Doğan Tazminat isimli tez çalışması, BorçlarHukukunun çok temel bir problemi olan akitlerden doğan borçların ifa edilmemesi,kötü yahut geç ifası hallerindeki neticelerini ele almaktadır. Konuya akitten doğanborçların tazmin sorumluluğu açısından tasnifi ile başlanmış ve İslâm hukuku ile Batıhukuku, özellikle Türk Borçlar hukuku mukayeseli olarak ortaya konulmayaçalışılmıştır. Dört bölümde yürütülen çalışmada İslâm Hukukunda temerrüt,imkansızlık ve kötü ifanın akdi sorumluluğa etkisi, sorumluluğun unsurları ve nihayetakit tipleri bakımından yapılan gruplandırmaya uygun olarak tazminat durumu elealınmıştır."
