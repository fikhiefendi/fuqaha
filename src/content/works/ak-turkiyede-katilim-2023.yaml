abstract: "Ekonomideki en önemli finansal aracılardan biri bankalardır. Piyasadaki fon aktarımına aracılık eden bankalar ekonomide fon fazlası olan kesimden fon ihtiyacı olan kesime aktarım işlemi yapmaktadırlar. Bu işlem yapılırken çoğunlukla kredi verme kanalı kullanılmaktadır. Kredi verme işlemi sonrasında kredinin geri ödenmeme riski bulunmaktadır. Verilen krediler ödenmediğinde takipteki kredi (sorunlu kredi) adını almaktadır. Çalışmada konvansiyonel bankalar ve katılım bankalarındaki bankaya özgü ve makroekonomik faktörlerin takipteki krediler üzerindeki etkisi karşılaştırmalı olarak analiz edilmektedir. Türkiye'deki konvansiyonel bankalar ve katılım bankalarında takipteki kredileri etkileyen bankaya özgü ve makroekonomik değişkenlerin etkilerini ölçmek için kantil regresyon (QR) ve OLS tahmin yöntemi modeli kullanılmıştır. Çalışmada bağımlı değişken olarak takipteki krediler kullanılmıştır. Bağımsız değişkenler bankaya özgü ve makroekonomik değişkenler olarak iki gruba ayrılarak ele alınmıştır. Bankaya özgü değişken olarak“toplam krediler, net kâr, krediler/GSYİH, krediler/mevduat, aktif kârlılığı, özsermaye kârlılığı ve banka büyüklüğü”, makroekonomik değişken olarak“konut faizi, ihtiyaç faizi, ticari faiz, GSYİH, enflasyon, mevduat faizi ve kredi risk primi (CDS)”kullanılmıştır. Çalışmadaki veriler 2011 dördüncü çeyrek ile 2021 ikinci çeyrek arasında toplamda 39 çeyreklik dönemi kapsamaktadır. Konvansiyonel bankalara ait veriler FitchConnect veri tabanı, Türkiye Cumhuriyeti Merkez Bankası EVDS veri tabanı, Cumhurbaşkanlığı Finans Ofisi veri tabanı, Türkiye Bankalar Birliği, Bankacılık Düzenleme ve Denetleme Kurumu ve bazı dönemlere ilişkin eksik veriler bankaların konsolide olmayan finansal tablolarından derlenmiştir. Katılım bankalarına ait veriler FitchConnect veri tabanı, Türkiye Cumhuriyeti Merkez Bankası (TCMB) EVDS veri tabanı, Cumhurbaşkanlığı Finans Ofisi veri tabanı, Türkiye Katılım Bankaları Birliği ve bazı dönemlere ilişkin eksik veriler bankaların konsolide olmayan finansal tablolarından elde edilmiştir. Makroekonomik veriler, TÜİK ve Dünya Bankasına ait veri tabanından elde edilen bilgiler ile derlenmiştir. Çalışma, analiz de dahil olmak üzere dört bölümden oluşmaktadır. Birinci bölümde, konvansiyonel ve katılım bankacılığı sektöründeki kredi kavramının ana hatlarına yer verilmiştir. İkinci bölümde, konvansiyonel ve katılım bankacılığı sektöründeki takipteki kredi kavramı ana hatları ile ele alınmıştır. Üçüncü bölümde, bankacılık sektöründeki kredi riskleri, yönetimi ve türleri konvansiyonel bankalar ve katılım bankaları karşılaştırmalı olarak ele alınmıştır. Dördüncü ve son bölümde takipteki kredilerin belirleyicisi olan bankaya özgü ve makroekonomik değişkenler kantil regresyon yöntemi ile analiz edilmiştir. Bu bölümde hem konvansiyonel hem katılım bankaları açısından literatürdeki ulusal ve uluslararası kaynaklar, araştırmanın metodolojisi, analizde kullanılan değişkenler ve analiz sonucunun yorumlamaları yapılmıştır. Analiz yapılırken üç farklı denklem denemesi yapılmış ve tüm sonuçlar için anlam düzeylerinde yakınlık olduğu için tamamı çalışmada açıklanmıştır."
