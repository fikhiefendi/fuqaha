abstract: "Osmanlı Devleti'nin modernleşme dönemini temsil eden ve meşihat tarafından yayınlanan İlaveli Mecmua-i Cedide daha önce müstakil bir çalışmaya konu olmamıştır. Bu çalışmada İlaveli Mecmua-i Cedide içerik ve biçimsel özellikler bakımından ayrıntılı bir şekilde tanıtılmış, eserde fetvası yer alan şeyhülislamlar tespit edilmiş ve bu şeyhülislamlar hakkında biyografik bilgiler verilmiştir. Ayrıca eserde yer alan ve modernleşme dönemini temsil eder nitelikte olan bazı fetvalar, bu konular hakkında yazılmış bir takım makale ve risaleler çerçevesinde ele alınmıştır. Böylece fıkhî meselelerin Osmanlı'nın son dönemlerinde nasıl ele alındığı incelenmiş ve meselelerin sosyal boyutuna dikkat çekilmiştir."
