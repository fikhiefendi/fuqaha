abstract: "19. Yüzyılda başlayan genelde tüm İslâm ilimleri branşlarında özelde fıkıh anlayışında ortaya çıkan yenileşme hareketi 20. yüzyılda Mısır'da ilerleme katetmiş, klasik usûlden bağımsız bir yöntem oluşturma gayreti içerisine girmiştir. Modern dönemde klasik usûlü takip eden çağdaş İslâm hukukçuların yanı sıra bu“yeni”yöntemi inşa gayretine giren ve takip eden İslâm hukukçuları da olmuştur. Hatta günümüz fıkıh çalışmalarına etkisi bakımından bu yeni yöntem nispi bir üstünlük elde etmiştir. Çağdaş ibadet konuları, İslâm iktisadı, tıp ve etik alanlarda bu yöntemden yararlanıldığı görülmektedir. Bu araştırma akademik yazında ilk kez bu yönteme İctihâdî Yöntem ismini verirken klasik yöntemi takip eden, çağdaş problemlerin çözümü için alternatif enstrümanlar geliştiren fıkıh anlayışını ise Neo-Klasik Yöntem olarak isimlendirmiştir. Her iki yöntemin ilkelerini ortaya koymayı amaçlayan bu çalışma Mısırlı Yusuf el-Karadâvî ile Pakistanlı Muhammed Takî el-Osmânî'nin farklı yöntemler takip ettiği iddia etmekte, buna göre bu iki İslâm hukukçusunun kısa biyografilerini incelemekte, yöntemlerini netleştirmeye çalışmakta ve 11 fürû meseledeki içtihatlarını/fıkıh görüşlerini tartışmaktadır. Bu çalışmanın ortaya koyduğu bulgulara göre Karadâvî, Mısır ve Ezher menşeli bazı ilim adamlarını takip etmiş, mezheb temelli fıkıh anlayışına karşı çıkmış, klasik fıkıh yöntemini terk etmiş, ictihad, maslahat, teysir ve mekâsıd temelli yeni fıkıh ve usûl-i fıkıh söylemleri geliştirmiştir. Osmânî ise klasik fakihleri ve Diyûbend ulemasının fıkıh yöntemini takip etmiş, mevcut fıkıh ve usûl-i fıkıh birikimi geliştirme gayreti içerisinde olmuş, çağdaş meselelerin çözümü için zaman zaman tek mezhebi takip eden fıkıh anlayışını terk etmiş, dört mezhep içerisinde makul çözümler aramış, alternatif yöntemler geliştirmiştir."
