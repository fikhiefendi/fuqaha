abstract: "ÖZET Genel olarak kiralama; bir malı kiraya veren ve kiracı olmak üzere daha önceden belirlenmiş bir kira bedeli üzerinden iki taraf arasında yapılan anlaşma olarak tanımlanır. Ancak bizim çalışma konumuzu oluşturan kiralama bu anlamı dışında bir yatırım malının mülkiyetinin finansal kiralama şirketinde kalarak belirlenen kiralar karşılığında kullanım hakkının kiracıya verilmesi ve sözleşmede belirlenen değer üzerinden sözleşme süresi sonunda mülkiyetin kiracıya geçmesini öngören bir finansman yöntemi olarak incelenmiştir. Başlangıçta üretici veya aracı şirketler tarafından pazarlama olarak görülen kiralama işlemleri II. Dünya Savaşı sonrasında yeni bir finansman yöntemi olarak ortaya çıkmıştır. Bugünkü anlamda ilk kiralama şirketi 1952 yılında ABD'de kurulmuştur. ABD'de uygulanmaya başlanan bu sistemin Avrupa' daki gelişimini 1960 yılında İngiltere, 1961 yılında Fransa ve İtalya izlemiştir. Federal Almanya'da ise ilk finansal kiralama şirketi Amerikan- Alman ortaklığı olarak 1962 yılında faaliyetlerine başlamıştır. Finansal kiralamanın gelişmiş ülkelerdeki yaygın uygulaması, gelişmekte olan ülkelere de yansımış, özellikle son yıllarda bu ülkelerdeki finansal kiralama şirketlerinin sayısı ve kiralama ile yapılan yatırımların yüzdesinde önemli artışlar kaydedilmiştir. Ancak bu yatırımlar, sektörler itibariyle gelişmekte olan ve gelişmiş ülkeler arasında farklılık yaratmaktadır. Finansal kiralama yoluyla yapılan yatırımlar gelişmekte olan ülkelerde daha çok tarımsal sanayi, otomobil, bilgisayar, büro donanımları üzerinde yoğunlaşmaktadır. Kiralama yoluyla yapılan yatırımların bu alanlara kaymalarının başlıca ve en önemli nedeni finansal kiralama şirketlerinin ancak küçük ve orta boy işletmelerin ihtiyaçlarını karşılayabilecek finansman yapısına sahip olmalarından kaynaklanmaktadır. Finansal kiralama yoluyla yatırımların finansmanı yatırımcıya vergi avantajı, %100 finansman sağlaması, sözleşme süresi sonunda kiralanan mala sahip olma hakkı, yatırım teşvikinden yararlanma, kredi olanaklarının saklı kalması, kullanılan teknolojiyi yenileme ve taraflarca ödeme dönemlerinin belirlenebilmesi gibi özellikleriyle her türlü yatırımmalının kiralanmasına olanak tanır. Bilindiği gibi ülkemizde iç tasarrufların yatırımları karşılayacak.' düzeyde olmaması, sermaye piyasasının yeterli gelişmeyi gösterememesi ve diğer yandan kredi faizlerinin yüksek olması gibi ekonomik ve mali yapıdaki aksaklıklar yatırımları olumsuz yönde etkilemektedir. Gelişmekte olan ülkelerin ortak sorunlarından birisi de, orta ve uzun vadeli kredi kaynaklarının yetersiz olmasıdır. Sermaye piyasası gelişmiş ülkelerde, uzun vadeli bir finansman aracı olarak bilinen tahviller, ülkemiz gibi enflasyonun yerleştiği ekonomilerde bono gibi kısa vadeli finansman işlevi gördüklerinden, şirketler orta ve uzun vadeli kaynak sağlamakta güçlük çekmektedirler. Bu nedenle, öz kaynakları yeterli olmayan ve kredi sıkıntısı çeken yatırımcılar tarafından finansal kiralamanın ilgi ile karşılandığını görmekteyiz. Ancak finansal sorunlarını en uygun biçimde çözmeye çalışan şirketlerin bu konuda yeterli bilgiye sahip olmayışları ilk yıllarda gelişimin yavaş olmasına neden olmuştur. Finansal kiralamanın tabana yayılmasının bazı durgun sektörlere canlılık getireceği ve sonuçta ekonomik büyümeyi hızlandıracağı, aynı zamanda finansal darboğaz nedeniyle düşük seviyede seyreden yatırımların bu yolla hızlanması ve arz yetersizliğinden kaynaklanan enflasyonist baskıların ortadan kaldırılmasına katkıda bulunacağı söylenebilir. Özellikle finansman sıkıntısının üretimi kısıtlayıp, talebin karşılanamadığı pazarlarda piyasanın canlanmasını sağlama ve üretken yatırımları arttırmak yönünden finansal kiralama oldukça etkin bir finansman yöntemi olarak değerlendirilebilir."
