abstract: "Araştırmaya medar olan bu çalışma, hem ulum-u İslâmiye hem de ulum-u akliye sahasında kendisini ispatlamış Seyfuddîn el-Âmidî'nin usûl düşüncesinin bir paradigması olan nesih nazariyesi hakkında yapılmıştır. Hicri VII. Miladi XIII. asırda yaşayan Âmidî, ilk tahsiline doğduğu yer olan Diyarbakır'da başlamıştır. Daha sonra İslami ilimler sahasında derinlik kazanmak adına Bağdat, Şam, Hama ve Mısır gibi diyarlara ilmi seyahatler gerçekleştirmiştir. Gazzâlî gibi felsefe ve mantık ilimleriyle de meşgul olmayı tercih eden Âmidî,“Hikmet, müminin yitik malıdır; onu nerede bulursa almaya daha hak sahibidir.”şiarıyla hareket ederek Yahudi ve Hristiyan bilginlerinden aklî ilimler olan felsefe ve mantık dersleri almıştır. Böylece hem dini sahada hem de aklî sahada bir otorite olduğunu ortaya koymuştur. Bu çalışmada Seyfuddîn el-Âmidî'nin usûl düşüncesini merkeze alarak Seyfuddîn el-Âmidî'nin nesih ile alakalı kendine özgün görüşleri tespit edilip ortaya konmaya çalışılmıştır. Seyfuddîn el-Âmidî'nin nesih anlayışı adlı konunun tercih edilmesinin sebebi ise Türkiye'de Seyfuddîn el-Âmidî ekseninde bu konuyla alakalı kapsamlı bir çalışmanın olmaması ve nesih konusunun tartışmalı bir mesele olması hasebiyle olmuştur. Bu sebeple yapılan bu çalışmada Seyfuddîn el-Âmidî gibi önemli bir ilim adamının kendi metodolojisinde nesih konusuna nasıl yaklaştığı, konuyu nasıl ele aldığı ve konuyu nasıl değerlendirdiği araştırılıp ortaya konmuştur."
