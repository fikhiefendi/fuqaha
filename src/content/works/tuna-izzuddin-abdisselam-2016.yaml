abstract: "'İzzüddîn b. 'Abdisselâm es-Sülemî (ö. 660/1262), İslâm ümmetinin kuvvetini önemli ölçüde yıkıp azmini ve ümidini kıran kritik bir dönemde yaşamıştır. Bu dönem, İslâm ümmetinin sırtına tarifi imkânsız elem ve sıkıntılar yüklemiştir. Müellifin yaşadığı bu dönem, hicrî altıncı ve yedinci asırlara tekabül etmekte olup tam olarak 577 - 660 yılları arasındadır. Bu da, Abbâsîler'in ve Eyyûbîlerin son zamanlarına, Memlûklerin ilk dönemlerine denk gelmektedir. 'İzzüddîn b. 'Abdisselâm'ın dönemi ziraat, san'at ve ticâret alanlarında yapılan iyileştirmelere bağlı olarak mâlî kaynakların bollaşmasına rağmen, maalesef müellifin yaşadığı tüm zamanlar, savaşlar sebebiyle refâh ve bolluk içinde geçmemiştir. 'İzzüddîn b. 'Abdisselâm, gençliğinde gördüğü bir rü'yâ üzerine ilim yolunu tercîh etmiş, bu yolda gayret sarf ederek en yüce ilim mertebelerine ulaşmıştır. Bununla birlikte o, ilmî hayatına ilave olarak Dimeşk'te başlayıp, Mısır'da devam eden müderrislik, hatiplik, kadılık, müftülük ve Bağdat'ta bulunan Abbâsî halîfesine elçilik gibi pek çok görev yapmış ve adı geçen makamlarda bulunmuştur.“Men yehâbuhu'l-mulûk”,“Sultânu'l-'ulemâ”,“Bâ'iu'l-mulûk”lakaplarıyla tanınan 'İzzüddîn b. 'Abdisselâm, söz konusu hak olduğunda, kral ve avânelerini bile geri adım attıracak ölçüde cesâret sâhibi güçlü bir 'âlimdir. O, dünyaya karşılık ahreti tercîh eden; insanların rızâsına karşılık Allâh'ın rızasını önceleyen ve daima adaleti gözeten birisidir. 'İzzüddîn b. 'Abdisselâm, seksen üç yıllık uzun ve bereketli yaşamı boyunca iyiliği emretmiş, kötülüğü yasaklamış, engellemiş veya engelletmeye çalışmış, gerçeği bütün çıplaklığıyla dile getirmiş, bâtıla ve bâtıl ehline karşı savaş açmış, döneminin olaylarını yaşamış, onları etkilemiş ve onlardan etkilenmiştir. Kalemiyle ve diliyle cihâd ettiği gibi bizzat eliyle de cihâd etmiştir. Hatta adını nûrdan harflerle ebedîlerin defterine yazmıştır. Ardında her araştırmacıya zengin bir okul bırakmış, yine gerçeğin peşinde olan ve adâletin yardımcılarının tâbi olup örnek alabilecekleri hoş bir yaşam bırakmıştır. 'İzzüddîn b. 'Abdisselâm, sekizi“'akâid”, beşi“tefsîr”, üçü“hadîs”, on biri“fıkıh”ve“fıkıh usûlü”, üçü“fetvâlar”, ikisi“siyer”, yedisi“tasavvuf”ve üçü de“başka ilim dalları”nda olmak üzere toplam kırk iki eser yazmış velûd bir âlimdir. İşte yazdığı eserlerden biri de tahkîk ettiğimiz“el-Emâli'l-Kur'âniyye”dir. 'İzzüddîn b. 'Abdisselâm'ın tezimize konu olan“el-Emâli'l-Kur'âniyye”adlı eseri, Müslümanların Kur'ân'ı anlamada zihinlerine takılan sorulara tercüman olmakta ve bunlara hem aklî hem de naklî cevaplar sunmaktadır. 'İzzüddîn b. 'Abdisselâm,“el-Emâli'l-Kur'âniyye”de lüğat, nahiv, belâğat, 'akîde veya usûl açısından problem olarak addedilen hususları dile getirmekte ve bunlara aklî ve naklî cevaplar vermektedir."
