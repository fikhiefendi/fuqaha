abstract: "Bilgi ve iletişim teknolojilerindeki ilerlemeler gündelik yaşantıyı dijitalleştirerek siberuzay denilen elektronik evrene taşımaktadır. Toplumsal ilişkilerin zaman ve mekânın bağlayıcılığından kurtulup bedensizleşerek bir makineyle ortaklaşa yaşayan siborg türüne ihtiyaç duyduğu görünmektedir. Gerçek dünyaya ait birçok kültürel öğe dijital kültürün etkisiyle değişime uğramaktadır. Yaşanılan gerçek dünyanın sözcük anlamı“çevrimdışı”sözcüğüyle yer değiştirmektedir ve çevrimiçi olmak çevrimdışı olmanın yerini almış izlenimi vermektedir. Bireyler çevrimiçi olmanın bedelini kişisel bilgilerini paylaşarak öderken, toplumsal gözetim uygulamalarının alanı genişlemektedir. Siberdenetim, seçkinler ve sosyal yapılardan bireylere kadar her kurumun ve kişinin gözetim uygulamalarını yapabilmesiyle yaygınlaşmaktadır. Bu araştırmada katılım bankası çalışanlarının hem gözetim yapan hem de gözetime maruz kalan kişiler olmaları nedeniyle gözetim deneyimlerinin ikili doğasına farklı bir bakış açısı getirilmiştir. Toplumsal denetimin nesneleri olan birey aynı zamanda toplumsal denetimin aktörü konumuna oturtulmuştur. Gözetimin bireyler açısından hem özne hem nesne olarak ikili değerlendirmeye tabi tutulması gözetimle ilişkili değişkenlerin de farklı yorumlanabilineceğini göstermiştir."
