abstract: "İslam Kalkınma Bankası, İslam İşbirliği Teşkilatı üyesi ülkelerdeki kalkınma projelerinin finansmanında etkin bir rol oynamaktadır. Bu finansmanlar, üye ülkelerin ihtiyaçlarını karşılamış olup, faizsiz İslami finansman ilkelerine dayanmaktadır. Bu araştırma, İslam Kalkınma Bankası'nın Burkina Faso'daki kalkınma projelerinin finansmanındaki rolünü incelemeyi amaçlamakta; ayrıca finanse edilen en önemli projeleri, bu projelerin finansmanında izlenen yöntemleri ve projelerin Burkina Faso'daki kalkınmayı güçlendirmedeki etkisini ortaya koymayı hedeflemektedir. Çalışma, konuyla ilgili yazılanları incelemek amacıyla betimsel yöntemi, bankanın finansmanlarının Burkina Faso'da ekonomik ve sosyal kalkınmayı sağlama konusundaki etkinliğini analiz etmek amacıyla ise analitik yöntemi kullanmıştır. Araştırma, İslam Kalkınma Bankası'nın Burkina Faso'daki ekonomik ve sosyal kalkınmayı güçlendirmede etkin bir rol oynadığını ortaya koymuştur. Banka, enerji, altyapı, tarım, eğitim, sağlık hizmetleri gibi çeşitli sektörlerde 4,6 milyar dolar değerinde 217'den fazla projeyi finanse etmiştir. Çalışma, Burkina Faso'daki stratejik sektörlere yönelik tahsisatların artırılması ve tarım sektörüne öncelik verilmesi gerektiğini, çünkü bu sektörün ekonomiyi desteklemede ve halkın yaşamını iyileştirmede önemli bir rol oynadığını önermektedir."
