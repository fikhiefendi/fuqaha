abstract: "Hanefî mezhebinde Ebû Hanîfe ve öğrencilerinden sonra gelen ana akım gruplardan biri olan Orta Asya Hanefî meşâyihinin fıkhî etkinliklerinden biri de fetva faaliyeti olmuştur. Bölgedeki müftü meşâyih tarafından yoğun bir şekilde yürütülen bu fetva faaliyeti neticesinde kendisinden fetva literatürü olarak bahsedebileceğimiz yeni bir yazın türü ortaya çıkmıştır. Bu literatür aynı zamanda Hanefî mezhebinin kurucu doktrininde gerçekleşen fıkhî değişimin müftü meşâyihin fetvaları üzerinden takip edilebildiği en temel referans kaynaklarını barındırmaktadır. Çalışmamızda Ebû Hanîfe tarafından“hüccet ve burhan ilkesi”çerçevesinde ortaya konulan fıkıh düşüncesinin, 4/10-6/12. yüzyıllarda Orta Asyalı Hanefi müftü meşâyihin ilgili literatürde yer alan fetvalarında nasıl bir“ihtiyaç ve uygulama fıkhı”na dönüştüğü incelenmektedir. Müftü meşâyihin verdiği fetvalarda, kurucu imamlar tarafından vazedilen birçok hukuk kuralının, öncelikle bölge halkının uygulama ve ihtiyaçları göz önünde bulundurularak değişime uğradığı öngörülmektedir. Orta Asya müftü meşâyihinin mezhep intisabının sınırları içerisinde yönettiği bu uygulama ve ihtiyaç odaklı hukuki değişimde,“görüşler arası tercihte bulunma”,“örfü bir delil olarak kabul etme”ve nihayet“fıkhî çözümlere (ḥiyel-i şerʿiyye) başvurma”gibi yöntemlerin kullanıldığı gözlemlenmektedir. Fıkhî değişimin, fıkhî çözümlere başvurularak sonuçlandırıldığı örneklerinden biri de, faizli karz akdine alternatif olmak üzere Buharalı müftü meşâyih tarafından bir faizsiz finans aracı olarak kurgulanan icâre-i tavîle akdidir. İcâre-i tavîle akdi, fıkhî çözümlerin etkin bir yöntem olarak kullanılması yoluyla klasik icâre akdinin, faiz içermeyen meşru bir finans enstrümanına dönüşmesinin temsil gücü yüksek bir örneğini teşkil etmektedir. Çalışmamızın odak noktasını, 4/10-6/12. yüzyıllardaki fıkhî değişimi kendisi üzerinden takip edeceğimiz Orta Asya fetva literatürü ve bu değişimi temsil eden fıkhî çözüm nitelikli bir akit olan Buhara uygulamasındaki icâre-i tavîle örneği oluşturmaktadır."
