abstract: "İslami finans her türlü finansal faaliyetin, islami emirler ve yasaklar tarafından oluşturulan helal dairesi içerisinde gerçekleştirildiği; küresel kapitalizm tarafından üretilen problemlere cevap niteliğinde pek çok finansal enstrümana sahip bir sistemdir. Ayrıca bu sistem sadece Müslümanların değil, tüm insanların refahı için kullanılabilecek, temel ilkelerinden taviz verilmemesi şartıyla çağın değişen koşul ve ihtiyaçlarına karşılık vermekte zorlanmayacak kadar da esnek bir finansal sistemdir. İslami finansta yasaklar ve temel islami akitlerin incelenmesini konu alan bu tezde islami finansın temel prensipler olarak benimsediği bu ilkelerin detaylı açıklanması yoluyla, bu sistemin konvansiyonel finansal sistem için güçlü bir alternatif olarak nasıl ortaya çıktığı irdelenmiştir. İlk önce islami finansın temel prensipler olarak benimsediği, riba, faiz, garar, kumar ve şans oyunları ile israf yasaklarından detaylıca bahsedilmiş daha sonra ise bu sınırlamalar çerçevesinde, hem İslamın genel ilke ve prensipleri hem de çağın gerektirdiği imkân ve ihtiyaçlar dikkate alınarak geliştirilen finansal araçlar etraflıca anlatılmış ve tartışılmıştır. Bu finansal araçların iktisadi hayat içerisinde teşekkül etmesi zaviyesinden bakılacak olursa en önemlilerinin; karz-ı hasen, mudaraba, Müşareke, murabaha, icare, mufavada, inan, vücuh, şirket-i amal, muzaraa, sukuk, istisna, selem ve takafül oldukları tespit edilmiş ve bu araçlar detaylıca anlatılmıştır."
