abstract: "Bu çalışma, İmam Şafiî ve Ebu Zeyd ed-Debûsî'nin hayatlarını ve fıkıh usûlünde benimsemiş oldukları metodolojileri, Debûsî'nin İmam Şafiî'ye yönelttiği eleştirileri sınırlamayı ve bu eleştirilerin Mütekellim (Cumhur) mezhebi üzerindeki etkilerini tespit etmeyi hedeflemektedir. İmam Şafiî'nin ve Debûsî'nin kaleme aldığı eserlerin, Hanefî ve Şafiî mezhebindeki güvenilir kaynakların ve sonraki araştırmaların merkeze alındığı tez çalışması üç bolümden oluşmaktadır. Bu çalışmanın giriş bölümünde, kendi eserlerinden ve tabakat literatüründe verilen bilgilerden yola çıkılarak İmam Şafiî ve Debûsî hakkında ilmi bir portre çizilmiş ve usûl anlayışlarının sonraki fukaha ve mütekellim metodu üzerindeki etkileri tespit edilmeye çalışılmıştır. Birinci bölümde, beyan, nesih, haber ve kıyas konularının her ikisi tarafından ele alınışı detaylarıyla incelenerek Debûsî'nin bu konularda İmam Şafiî'ye yönelttiği eleştiriler tespit edilmiştir. İkinci bölümde ise, Debûsî'nin İmam Şafiî ile olan usûl farklılıklarının, mütekellim metodu üzerindeki etkisi incelenmiş ve bu amaçla başta Şîrazî, Sem'anî ve Gazâlî olmak üzere diğer usûlcülerin eserlerinde zikredilen dört konudaki etkisi tespit edilmeye çalışılmıştır. Bu çalışmanın sonucunda, İmam Şafiî'nin usûl ilminde eşi benzeri olmayan bir rol oynadığı saptanmış olsa da Hanefî mezhebinden olan Debûsî'nin kendisine bazı konularda eleştiriler yönelttiği tespit edilmiştir. Debûsî'nin yönelttiği bu eleştiriler, İmam Şafiî'nin görüşlerinin mütekellim metodolojisi içinde yeniden ele alınmasına ve yorumlanmasına yol açmış, hatta Sem'anî'nin Kavâdi'ul-Edille ve Gazâlî'nin Şifâ'ul-Ğalîl adlı eserlerinin Debûsî etkisiyle ortaya çıktığı söylenebilir."
