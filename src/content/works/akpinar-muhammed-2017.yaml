abstract: "Muhammed Enver Şah el-Keşmîrî, modernitenin İslam tefekkür tarihinde güçlü bir tahakküm alanı tesis etmeye başladığı bir dönemde, geleneksel ilim ve hukuk anlayışına sadık kalarak fıkıh meselelerinin temellendirilmesi hususunda çaba sarf eden ve bu yönüyle İslam hukuk geleneğinin savunucusu olarak öne çıkan Hindistanlı bir âlimdir. Kırk yılı aşkın eğitim ve öğretim hayatı boyunca dinî-hukukî metinlerin anlaşılması üzerine mesai harcamış, norm-amaç ilişkisini tespit etmeye çalışmış, bağlı bulunduğu Hanefî mezhebinin temel tezlerini te'yid edecek nitelikte külli kaideler vazetmiş olan Keşmîrî'nin çalışmaları, özgün tahkik ve tespitler içermesi yönüyle İslâm hukuk birikimine önemli katkılar sağlayacak düzeydedir. Keşmîrî'nin fıkıh düşüncesinin ortaya konması, XIX ve XX. yüzyılda entelektüel anlamda büyük bir dönüşümün yaşandığı Hint alt kıtasının hukuki birikimine ışık tutması açısından da kıymet arz etmektedir. Bu araştırma, Keşmîrî'nin hukuk düşüncesinin ayırt edici özelliklerini ve bu düşüncenin oluşmasına etki eden faktörleri incelemeyi konu edinmektedir. Tez, bir giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında araştırmanın çerçevesi ve kaynakları ile konunun amaç ve önemine ilişkin bilgilere yer verilmiştir. Birinci bölümde, Keşmîrî'nin biyografisi, ilmî kişiliği ve hukuk düşüncesinin tarihi arka planı ele alınmış, ardından fıkıh düşüncesinin teorik çerçevesi ve karakteristik özellikleri ortaya konmuştur. Kendisinin doğrudan usûl konularına ilişkin görüşlerinin ele alındığı ikinci bölümde ise, onun fıkıh usûlü kavramlarıyla inşa ettiği bilgi nazariyesine kısaca temas edilmiş; ardından klasik usûl sistematiğinin kaynak (delil), hüküm, yorum (lafız) ve ictihad konuları üzerindeki değerlendirmelerinden hareketle usûl düşüncesi ele alınmıştır. Bu esnada hukuk düşüncesinin ayırt edici özelliğini karakterize etmesi bakımından hükümlerin teşrî' ve istinbâtında tatbik ettiği merâtib ve tercih teorisi ayrı başlıklar altında incelenmiştir. Anahtar Kelimeler: Hint Alt Kıtası, Keşmîrî, Merâtib, Lafız, Yorum."
