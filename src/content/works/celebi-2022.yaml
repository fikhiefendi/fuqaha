abstract: "Haram kazanç tehlikeli işlerden sayılır musurman bu yola girmemesi gerekir çünkü bu şeriata ayıkırıdı Allahtan uaklaştırır kötü yola düşürür bu Tez konusu olan islam fıkhında yasak paranın elden çıkarılması ve elden çıkarılması yöntemleri bu sebepten dolayı kazançların haram mal ve manfatler meşru kazanç sayılmaz ve mülkiyetine girmez her hangi bir yöntemle olsa bile ve bu nedenle birinci fasılda haram malın hükmünü islam fıkıhına göre ele alınır ve mülkiyet hükümü ve harcaması ve heleleştirilmesi ve bu teze göre meşru kazancın şeklini gösterdi ve meşru olmayan kazancın ülke ekonemisine haram malın eseri ne olabilir ve şeriat haram malı mülkiyete geçirmesini yasaklamıştır gerek miras yolu ile ve ya zimete geçirme ve ya rişvet ve ya kumsr ve ya yozlaşmış sözleşmeler ve ya onun gibiler iki tarafın rızası olsa bile çünkü rızaları haramı helal etmez üçüncü fasılda haram malın faydalanmasının hükümünde gerek farzlarda ve ya sünetlerde haram maldan hangi helal munasib yolardan kurtulunur ve banka fayızından ."
