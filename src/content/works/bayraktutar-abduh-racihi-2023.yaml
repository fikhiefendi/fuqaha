abstract: "Dilbilimin en önemli amacı, dilin işleyişini anlamak ve anlatmaktır. Arap coğrafyasında da dilbilim ilk olarak, Kur'ân'ı daha iyi anlamak, korumak ve anlatmak için gelişmiştir. Araştırmamız Abduh er-Râcihî'nin (1937-2010) dilbilimine dair bazı yorumlarını kapsamaktadır. Birinci bölümde kavramsal çerçeve, Râcihî'nin hayatı, eserleri ve dilbilimin Batıda ve Arap dünyasındaki yansımalarından bahsedilmiştir. İkinci bölümde fıkhu'l-luga ve ilmu'l-luga kavramları Râcihî'nin görüşleri ile beraber ayrıntılı bir biçimde incelenmiş, Daha sonra, Ebu'l-Feth Osman b. Cinnî'nin (ö. 392/1002) yapmış olduğu dil tanımı, Râcihî'nin görüşleri ile birlikte analiz edilmiş, Bölümün sonunda ise dilin doğuşu meselesi ele alınmıştır. Ayrıca dilin gelişimi ve lehçeler konusu işlenmiştir."
