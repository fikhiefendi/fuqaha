abstract: "Hazırladığımız tezin konusu, hicri 7. asrın tanınmış mâlikî usülcüsü Şehabeddin Ebu'l-Abbas Ahmed b. İdris b. Abdirrahman es-Sanheci el-Karâfî'nin Kur'an'ı nasıl anladığı ve bu anlayışının onun yorumuna nasıl yansıdığıdır. İslâmî disiplinlerin dayanağının Kur'an olması bu disiplinlerin Kur'an'la sıkı bir ilişki içerisinde olduğunu da ortaya koymaktadır. Dolayısı ile, Tefsir disiplininden başka bilim dalında ün yapmış alimler de, bir noktada tefsir alanı ile ilgilenmişler ve kendi alanlarında tefsirden belli ölçülerde yararlanmışlardır. Bu demektir ki, bir fakih, yada bir kelam aliminin aynı zamanda bir müfessirlik yönünün de bulunması gerekmektedir. Biz de bu noktadan yola çıkarak, bir fakihin Kur'an anlayışını, ayetleri yorumlama biçimini ve genellikle Kur'an'a bakış açısını inceleyecek bir tez konusunu çalışmaya karar verdik. Karafi'nin Tefsir'e dair herhangi bir eseri bulunmadığı için tezimizin kapsamı, onun, esasen Tenkih, Ecvibe ve İstisna isimli eserlerinde işlediği konular ve incelediği yada hakkında görüş beyan ettiği ayetlerle sınırlanmıştır. Bu anlamda, Tefsir disiplini açısından hazırlamaya çalıştığımız böyle bir tezin nihai şekli de, büyük ölçüde elde olunan verilere göre teşekkül etmiştir. Tezin Giriş Bölümü'nde; çalışmaya dair teknik bilgiler verdikten sonra Karafi'nin hayatı ve eserlerini tanıttık. Tezin Birinci Bölümü'nde; Ulumu'l-Kur'an bağlamında Karafi'nin Kur'ana bakışını inceledik. Tezin İkinci Bölümü'nde; Karafi'de, Kur'an'ı anlamada öne çıkan kavramlar ile Karafi'nin yorumlama metodunda faydalandığı kaynaklara değindik."
