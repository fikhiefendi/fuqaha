abstract: "Çalışma, metafiziğin konusu olarak varlık ve meselesi olarak illetleri bağlamında ortaya çıkan varlık ve illetleri problemini Şerefuddin Muhammed b. Mes'ûd el-Mes'ûdî açısından incelemeyi hedefler. Bununla Mes'ûdî'nin İşârât ve't-Tenbîhât şerhi niteliği taşıyan kitabı Kitâbu'l-Mebâhis ve'ş-Şukûk referans alınarak kendisine özgü ve iddialı nitelik taşıyan eleştirel yönü araştırılmıştır. Araştırmanın hedefine uygun olarak Şukûk'un, İşârât'ın dördüncü namatına denk gelen meseleleri incelenmiştir. Bu konu üzerine şimdiye kadar herhangi bir çalışma yapılmadığından dolayı yaşadığı dönemde mütekellim ve filozof olarak bilinen Mes'ûdî'nin bu konuda bir kısım eleştirilerinin gün yüzüne çıkarılması sağlanmıştır."
