abstract: "Varlık sınıflarının genişlemesi ve sağlık, ekonomik ve jeopolitik krizler, yatırımcıların varlıklarını uluslararası piyasalarda çeşitlendirmelerini gerekli kılmıştır. Bu tez, Bitcoin (BTC), İslami Pay Senetleri (DJI) ve petrol fiyatları (WTI) arasındaki nedensel ilişkiyi araştırmayı amaçlamaktadır. Bu amaçla, öncelikle 18 Ağustos 2011- 10 Aralık 2021 dönemi için Artırılmış Dickey-Fuller (ADF) ve Philips Perron (PP) Testleri kullanılarak veri serilerinin durağanlığı kontrol edilmiştir. Daha sonra, Vektör Otoregresif (VAR) Modeli ve değişkenler arasındaki korelasyonların varlığını izlemek için çeşitli sağlamlık kontrolleri uygulandıktan sonra, incelenen seriler arasındaki ilişkinin yönünü ve gücünü belirlemek için Parametrik Olmayan Kantil Nedensellik Testi kullanılmıştır. Sonuçlar, değişkenler arasında iki yönlü varyans nedensellik olduğunu göstermiştir. Bu nedenselliğin gücü özellikle normal piyasa koşullarında artmakta ancak BTC'den İslami Pay Senetleri (DJI)'ye ve Petrol fiyatlarından (WTI) İslami Pay Senetlerine (DJI) olan nedensellik dışında üst kantillerde zayıftır. Ortalamada nedensellik açısından, İslami pay senetlerinden (DJI) petrol fiyatlarına (WTI) yalnızca orta kantilde tek yönlü bir nedensellik tespit edilmiştir."
