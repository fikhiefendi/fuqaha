abstract: "Ulusal Varlık Fonları, özellikle 2000'li yılların başında ve sonrasında gelen 2008 küresel ekonomik krizin etkileri sonucu devletlerin kendi ekonomileri için finansal piyasalarda var olma gerekliliğini gündeme getirmiş ve sayılarında belirgin artışlar olmuştur. Siyasi ve politik rollerini de göz önüne alarak gelişmekte olan ekonomiler için devletin finansal piyasalara kalkınma stratejileri içinde Varlık fonları ile katıldıkları görülmektedir. Bu çalışmanın amacı; Türkiye Varlık Fonu'nun kuruluşu ile ortaya çıkan iktisadi büyüklüğün, stratejik olarak atabileceği adımlar ile Türkiye'de İslami finans piyasalarının gelişimini sağlayabileceğini göstermektir. Katılım ekonomisinin desteklenerek büyütülmesi ile İslami finansın ülke ekonomisine, sosyal ve ekonomik katkılarını gösterebilmektir. Varlık fonu bünyesinde barındırdığı kaynakları etkin kullanarak hem ülkenin ekonomik olarak kalkınmasını sağlayabilir hem de Türkiye'de İslami finansın gelişimini sağlayabilir."
