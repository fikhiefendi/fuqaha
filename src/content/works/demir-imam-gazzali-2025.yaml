abstract: "İmam Gazzâlî, İslamî ilimlerde geniş bir etkiye sahip, fıkıh alanındaki eserleriyle, Şâfiî mezhebine önemli etkileri olmuştur. Özellikle el-Vasît adlı eseri, Şâfiî medreselerinde asırlar boyu okutulmuş ve mezhebin literatürüne önemli bir kaynak oluşturmuştur. Gazzâlî'nin fıkh alanınıdaki telifleri, onun sadece diğer ilimlerdeki başarılarıyla değil, aynı zamanda fıkıh alanındaki üretkenliğiyle de öne çıktığını göstermektedir. Fıkıh alanında yaklaşık yirmi eser kaleme almış olan Gazzâlî, el-Vasîtile Şafiî literatüründeki önceki metinlerde bulunan karmaşayı düzenleyip konuları daha anlaşılır hâle getirmiştir. Ayrıca, eserde farklı mezheplerin görüşlerine de yer verilmesi, onu mukayeseli bir fıkıh metni olarak öne çıkarmaktadır. Bu araştırma, İmam Gazzâlî'nin el-Vasîtadlı eseri ve Şâfiî fıkhındaki yerini ve önemini, özellikle“Kitâbü's-salât”bölümü örneğiyle incelemeyi amaçlamaktadır. Gazzâlî'nin el-Vasît adlı eseri, Şâfiî mezhebinin müteahhirûn döneminde önemli bir yere sahip olup, mezhebin sonraki gelişimi üzerinde derin etkiler bırakmıştır. Çalışmanın amacı, Gazzâlî'nin fürû fıkıh alanındaki katkılarını tespit ederek, onun mezhebe olan etkisini ortaya koymaktır. Üç bölümden oluşan bu çalışmada, ilk bölümde Gazzâlî'nin hayatı ve fıkıh alanındaki eserlerine genel bir bakış sunulacak, ikinci bölümde el-Vasît, metot açısından incelenerek diğer Şâfiî eserleri ile karşılaştırılacak, üçüncü bölümde ise eserin muhtevası değerlendirilerek Şâfiî fıkhındaki yeri ve etkisi belirlenecektir. Gazzâlî'nin fürû fıkıh alanındaki eserleri modern dönemde yeterince incelenmemiştir; bu çalışma, söz konusu eksikliği gidermeyi hedefleyerek, Gazzâlî'nin fıkıh ilmine olan katkılarını daha iyi anlamaya katkı sunmayı amaçlamaktadır."
