abstract: "V. HİCRÎ ASIR İSLAM HUKUKU METODOLOJİSİNDE MÂLİKÎ-ŞÂFİÎ AYRIŞMASI (EBÜ'L-VELÎD EL-BÂCÎ VE EBÛ İSHAK EŞ-ŞÎRÂZÎ ÖRNEĞİ) ÖZET Bu tez, birbirinden iki yıl arayla vefat etmiş iki usûlcünün eserlerini karşılaştırır: Endülüslü Mâlikî fakihi Ebü'l-Velîd el-Bâcî (v. 474/1081) ile Bağdatlı Şâfiî fakihi Ebû İshak eş-Şîrâzî (v. 476/1083). İkisi de hicrî V. asır Mâlikî–Şâfiî ayrışmasının temsilcisi sayılır. Buradaki soru ise daha dardır. İki müellifin nerede ayrıldığı değil, ayrıldıkları yerde niçin ayrıldıkları sorulmaktadır. Bâcî ile Şîrâzî çağdaştır. Yolları Bağdat'ta kesişmiş, Bâcî doğu seyahatinde Şîrâzî'nin ders halkasında bulunmuş, ikisi de büyük ölçüde ortak bir usûl birikiminden beslenmiştir. Buna rağmen eserleri birbirine benzemez. Biri tartışma ortamının gereklerine, öteki tedrîsin gereklerine göre düzenlenmiştir. Çalışma, aradaki farkın ne kadarının bu ayrımdan doğduğunu sorar. Karşılaştırma, Bâcî'nin İhkâmu'l-Fusûl ve el-Minhâc'ı ile Şîrâzî'nin et-Tebsıra, el-Lüma' ve Şerhu'l-Lüma' adlı eserlerine dayanır. Tespit edilen her ihtilafa üç ölçüt uygulanmıştır. Birincisi doktrineldir: fark, mezhebin fürû mirasından türetilebiliyor mu? İkincisi bağlamsaldır: müellifin yetiştiği muhit ve eserini yazma amacı bu farkı açıklıyor mu? Üçüncüsü ispat eşiğidir; yani müellifin bir hükmü sabit saymak için aradığı asgarî delil düzeyi. Bu sonuncusu iddia edilmemiş, ölçülmüştür. Beş göstergeden okunur: illetin şer'î bir delile dayanmasının şart koşulup koşulmaması, aslın hangi delillerle sabit olmasının arandığı, benzerliğin tek başına hüküm taşıyıp taşıyamayacağı, haber-i vâhid ile sükûtî icmânın bağlayıcılığı ve bir itirazın illeti düşürmeye ne kolaylıkla yeteceği. Delillerin kendisinde iki müellif neredeyse hiç ayrılmaz. Kitap, sünnet, icmâ ve kıyas ikisi için de hüccettir. Mutlak emir, aksini gösteren bir karîne yoksa vücûb ifade eder. Umum lafız, tahsis edici çıkmadıkça kapsayıcıdır. Delilsiz istihsan reddedilir. Ayrılık başka yerdedir: bu delillerin işletilme biçiminde, hepsinden önce de eşikte. İncelenen eserlerde Şîrâzî, hükmün dayanaksız taşınma ihtimali bulunan her yerde sıkılaşır; illet için şer'î dayanak ister, nass, icmâ veya sahih kıyasla sabit olmayan asıl üzerine kıyası kabul etmez, şebeh kıyâsını büsbütün geçersiz sayar, bir belde halkının ittifakını ümmet icmâı yerine koymaz. Bâcî ise amelî yahut naklî bir dayanağın bulunduğu yerde gevşer. Doğrudan mezhep mirasına bağlanabilen ihtilaflar azdır; Medine ehlinin icmâı bunlardan biridir. Lafız bahislerinde ikisi birbirine en yakın hâldedir. Öyleyse aradaki mesafe bir doktrin kopuşu değildir. Aynı mirasın, iki ayrı amaç ve iki ayrı ispat eşiği altında iki kez düzenlenmesidir."
