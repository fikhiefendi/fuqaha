abstract: "ÖZET Bu araştırma kısaca Şemseddin Sivasi'nin Zübdetü'l-Esrâr fi Şerhi Muhtasari'l- Menar adlı eserinin tahlil ve tahkikini içermektedir. Çalışmamız üç bölümden oluşmaktadır. Giriş kısmında Fıkıh usûlü ilminin tarihçesi ve kitapları hakkında bilgi verilmiştir. Birinci bölümde Şemseddin Sivasi'nin ilmi, edebi, tasavvufı yönü, yetiştirdiği şansiyetler hakkında bilgi verilmiştir. Yine Şemseddin Sivasi'nin eserleri tanıtılmış ve Zübdetü'l-Esrâr' in eserler arasındaki yeri belirtilmiştir. İkinci bölümde Zübdetü'l-Esrâr' in tahlili yapılmıştır; Eserin el yazması nüshalarının karşılaştırılması yapılmıştır. Zübdetü'l-Esrâr telif edilirken üç önemli eserin kaynak kabul edildiği anlaşılmıştır. Bu eserler, ibn Habib (ö.808)'in Muhtasari'l-Menar'ı, en-Nesefı (ö.710)'nin Keşfu'l-Esrâr'ı, ed-Dihlevi (ö.891)'nin İfadatü'l-Envâr'ıdır. Üçüncü bölümde Zübdetü'l-Esrâr'ın Arapça metninin tahkiki yapılmıştır. Tahkik esnasında Muhtasari'l-Menâr metni ile şerhi ayırdetmeye yarayacak bir metin oluşturulmuştur. Muhtasari'l-Menâr'ın metni ek bölümde sunulmuştur. Tahkik yapılırken üç el yazmanın karşılaştırılması yapılmış, ayetlerin numaraları ve hadislerin kaynakları verilmiş, eserde ismi geçen alimler hakkında kısa bilgiler aktarılmıştır."
