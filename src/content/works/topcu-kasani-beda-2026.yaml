abstract: "Bu çalışma Alâüddîn Ebû Bekr b. Mes'ûd b. Ahmed el-Kâsânî'nin Bedâʾiʿu'-ṣanâʾiʿ fî tertîbi'ş-şerâʾiʿ adlı eserinin ceza hukuku bölümünde istihsan metodunun nasıl uygulandığını incelemektedir. Çalışmada istihsanın hangi kısımlar altında zikredilip taksim edildiği, istihsanın kıyastan farkı ve nerelerde kıyastan dönüleceği, hangi vecih ve delillendirmeler ile istihsan yapıldığı ve istihsanın mahiyeti ortaya konulmaya çalışılmaktadır. Çalışmamız giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte çalışmanın amacı, önemi, yöntemi ve sınırları çizilmiştir. Birinci bölümde istihsanın tanımı, mahiyeti, çeşitleri, fıkıh usulündeki konumu, istihsanı kabul ve reddedenler ile bu iki tarafın tez çerçevesinde delilleri ve hangi gerekçelerle kıyasa tercih edildiği ele alınmaktadır. Bu noktada Hanefîlere göre istihsanın keyfî bir hüküm verme biçimi olmadığı, belirli gerekçelere dayanan metodolojik bir tercih olduğu ortaya konmaya çalışılmıştır. İkinci bölümde ceza hukuku konularında istihsan uygulamaları ele alınmış ve istihsan gerekçeleri zikredilmiştir. Bazı uygulamaların istihsan olup olmadığının anlaşılabilmesi için had ve kısasın mahiyeti ile had cezalarının sebeplerine değinilmiştir. Zira zahiren haddi gerektiren sebepler bulunmakla birlikte, haddin uygulanmadığı bazı örnekler ilk bakışta istihsan gibi görünebilmektedir. Ancak bunlar dikkatle incelendiğinde işlenen fiilin haddi gerektiren şartları taşımadıkları anlaşılmaktadır. Bu ayrımı ortaya koyabilmek amacıyla ilgili örneklere yer verilmiştir. Bazı örneklerin ise kaydı bulunmasa da istihsan uygulaması olduğu tespit edilmiştir."
