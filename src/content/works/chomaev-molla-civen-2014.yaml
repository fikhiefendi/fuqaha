abstract: "Molla Civen ve et-Tefsiratü'l-Ahmediyye Adlı Ahkam Ayetleri Tefsiri Öz: İslam âlimleri, başlangıçtan itibaren Kur'an'ın farklı yönlerine eğilmiş ve bu konuda eserler telif etmişlerdir. Bu yönlerden birisi de Kur'an'da ahkâm ifade eden âyetlerin tefsiridir. Tarih boyunca ahkâm âyetlerini tefsir eden çok sayıda tefsir yazılmış, müfessirler bu tefsirlerde genellikle kendi mezhep görüşlerinin savunmasını yapmışlardır. Hanefi mezhebinin görüşlerini savunmak üzere yazılan ahkam tefsirlerinden birisi de Molla Civen tarafından yazılan et-Tefsiratü'l-Ahmediyye adlı tefsirdir. Bu tefsirin ahkam âyetleri tefsirleri arasındaki yerini ve önemini ortaya çıkarabilmek için önce müellifin biyografisi üzerinde durulmuş, daha sonra da tefsirin tahlili yapılmıştır. Buna göre Molla Civen, Hindistan'da İslam hakimiyetinin zirvede olduğu bir dönemde, 1638-1718 tarihleri arasında yaşamış, genç yaşta hocalığa başlamış, devrinin sultanına hocalık yapmış bir fakihtir. et-Tefsiratü'l-Ahmediyye isimli ahkâm âyetleri tefsirini yazmaya 16 yaşında iken başlamış, 1665 senesinde 27 yaşında iken son şeklini vermiştir. Molla Civen bu tefsirinde klasik metotlara bağlı kalmış, ancak seleften gelen rivayetlere ağırlık vermiştir. Daha ziyade Hanefi mezhebini destekleyen görüşleri tercih etmiştir. Molla Civen ahkâm âyeti mefhumunu daha geniş ele almış ve Kelâm ilminin alanına giren âyetleri de ahkâm âyeti olarak tefsir etmiştir."
