abstract: "Bu çalışmada amaç, İslami finans sisteminin uygulandığı katılım bankaları ve konvansiyonel bankalar olarak nitelendirilen geleneksel faizli bankalar arasındaki farklılıkları ve katılım bankalarının uyguladığı bu sistemin neticesinde Türkiye üzerinde ekonomik büyümenin ne şekilde etkilendiğini ortaya koymaktır. Banka tercihlerindeki en önemli etkenlerin başında ülke insanının muhafazakâr tutumu ve sisteme bakış açısı gelmektedir. Katılım bankalarının hedef kitlesi öncelikli olarak bu örneklem içindeki insan grubudur ve katılım bankaları bu örneklemdeki insanlara göre aksiyom alarak hareket etmektedirler. Bunun dışında ise sistemin diğer avantajlarına göre farklı yapıdaki müşteri örneklemlerine yönelmekte ve bu şekilde müşteri portföylerini genişletme eğilimi içerisindedirler. Bu çalışmadaki uygulama için kullanılan veriler, TCMB elektronik veri dağıtım sisteminden alınan 2012 yılının ilk çeyreği ile 2021 yılının ilk çeyreği dahil dönemi kapsamaktadır. Bu çalışmada bağımsız değişken, reel ekonomik sektörü temsil etmek için toplam İslami banka finansmanı (IF) iken bağımlı değişken kişi başına reel GSYİH olarak alınmıştır. VAR (Vektör Otoregresyon) analizi neticesinde uygulanılan modelin sonucu olarak İslami finansın büyümeye pozitif yönde etki ettiği gözlemlenmiştir."
