abstract: "Endülüs coğrafyası, İslam medeniyetinde toplumsal, siyasi, ilmî ve kültürel anlamda çok yönlü bir etkiye sahiptir. Müslümanların neredeyse sekiz asır boyunca yaşadığı bu coğrafyada mezhep olarak Maliki mezhebi hâkim konumdadır. Ancak Maliki mezhebinin hakim mezhep konumunda olması, bu bölgede başka mezheplerin vücut bulmadığı anlamına gelmemektedir. Endülüs ve Doğudaki İslam dünyası arasında yapılan ilim ve hac yolculukları, ticaret ve seyahatler vasıtasıyla, Endülüs coğrafyası, Maliki mezhebi dışında Evzai mezhebi, Zahiri mezhebi, Şafii mezhebi, Hanefi mezhebi, ve Hanbeli mezhebi gibi farklı fıkıh mezhepleriyle tanışmıştır. Hatta bu mezheplerin müntesipleri Endülüs'te kadılık makamına kadar gelmiş, önemli şahsiyetler olarak tabakat kitaplarında yer almışlardır. Ancak bu mezhepler, yayılmayı sağlayacak bir takım saiklerden yoksun olmalarından ötürü, Maliki mezhebi kadar yayılma imkânı bulamamıştır. Bu çalışma, Endülüs ile alakalı yapılacak araştırmalarda, araştırmacılara, Endülüs'teki İslam hukuk mirasının, farklı fıkhî oluşumlarını göstermesi açısından önem arz etmektedir."
