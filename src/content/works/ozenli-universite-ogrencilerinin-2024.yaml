abstract: "Katılım bankaları, içinde faiz unsuru olan bankacılık ürün ve hizmetlerinden faydalanmayı tercih etmeyen müşterilerin bankacılık işlemlerini yapabilmelerini olanak sağlayan finansal kuruluşlardır. Bu kuruluşlar tüm dünyada ve Türkiye'de her geçen gün daha fazla yaygınlaşmaktadır. Buna rağmen katılım bankacılığının ürün ve hizmetlerine olan talep çok da istenildiği seviyede olmadığı gözükmektedir. Bu durumun oluşmasında katılım bankacılığına ilişkin algı, tutum ve bilgi düzeyinin istenilen seviyede olmaması, tanıtım çalışmalarının yeterince yapılmaması, ürün ve hizmetlerinin kişi ve kurumlar tarafından bilinmemesi ve şube sayısının az olması gibi sebepler sayılabilir. Bu çalışma ile üniversite öğrencilerinin katılım bankacılığına ilişkin algı, tutum ve bilgi düzeyinin belirlenmesi amaçlanmıştır. Bu çalışmanın bir diğer yapılış amacı ise üniversite öğrencilerinin demografik özellikleri ile katılım bankacılığına ilişkin algı, tutum ve bilgi düzeyleri arasında anlamlı farklılıkların olup olmadığını tespit edebilmektir. Elde edilen verilere göre üniversite öğrencilerinin yaşları, kayıt oldukları fakülteler ve aylık gelirleri gibi demografik özellikleri ile anket sorularına vermiş oldukları cevaplar arasında anlamlı farklılıklar bulunmuştur."
