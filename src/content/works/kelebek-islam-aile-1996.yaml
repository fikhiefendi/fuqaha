abstract: "ÖZET“islâm Aile Hukukunda Velayet”adıyla yaptığımız bu tez çalışmasında, bu konudaki hukukî kural ve ilkeleri bir araya getirmeyi gaye edindik. Genelde insan, özelde çocuğun himayesini hukukî statüye kavuşturan VELAYET SİSTEMİ, aile hukukunun önemli bir bölümünü oluşturmaktadır. Velayet kelimesi, bir hukuk kavramı olarak, aile hukukunun dışındaki genel mevzuları da kapsamına almaktadır. İslâm hukukunun bu özelliğini gözönünde bulundurarak velayetin aile hukukuna ait alanını belirlemek için“velayetin şümulü”üzerine bir bahis açtık. Çalışmamızı, çocuğun ve diğer kısıtlıların şahsiyetleri ve mallan üzerindeki hukukî temsîl olmak üzere iki konu üzerinde yoğunlaştırdık. Velayet altındakilerin aile içindeki himaye ve temsillerine ait kuralları ele alırken, yer yer, diğer hukuk sistemleriyle de karşılaştırmalar yaptık. İslâm Hukuku kaynaklarından orjinal metinler aldık. Çalışmayı bir giriş ile üç bölüm halinde tasnif ettik; a) Giriş: Çalışma hakkında genel bilgi, b) I. Bölüm: Velayet Kavramı, c) II. Bölüm: İslâm aile hukukunda velayet, velî, velîlerin dereceleri ve yetki sınırları, mal üzerindeki velayet ve sınırlan, şahıs üzerindeki velayet ve sınırları, d) III. Bölüm: İslâm ülkeleri ve diğer ülkelerde, aile hukukunda velayet ile ilgili çalışmalara, yer verildi. Alan Kodu:223 1101 127"
