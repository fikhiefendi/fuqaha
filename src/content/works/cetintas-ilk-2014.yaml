abstract: "Kur'an ve hadislerdeki bazı ifadeler ile Hz. Peygamber'in uygulamalarından hareketle mükellefin fiilleriyle ilgili talebin kesin ve bağlayıcı olup olmaması bakımından hükümleri tasnif etme tasavvurunun sahabe ve tâbiûn döneminde ortaya çıktığı görülmektedir. Mesela Hz. Ali vitir namazının kılınmasının istendiğini ancak farz namaz kadar kesin ve bağlayıcı bir tarzda istenmediğini söylemiştir. Ümmü Atıyye kadınların cenaze namazlarına katılmalarının nehiy edildiğini ama bu nehyin haram gibi kesin ve bağlayıcı olmadığını belirtmiştir. İbn Abbas temettu' haccından bahsederken Allah'ın temettu' haccını kitabında ve peygamberinin sünnetinde emrettiğini fakat Mekke halkından başka insanlar için onu mübah kıldığını söylemiştir. Aynı tasavvuru tâbiûnun ifadelerinde de gözlemlemek mümkündür. Bu tezimizde hükümlerin doğuş ve gelişim seyrini izlemek bakımından öncelikli olarak Kur'an ve sünnetin hükümlere esas teşkil eden ifadeleriyle sahabe ve tâbiûnun kullandıkları kavramlar tespit edilmeye çalışılmıştır. Mezheblerin teşekkül dönemine gelindiğinde başta Hanefî mezhebi olmak üzere mezheb imamları tarafından mükellefin fiillerinin talebin kesin olup olmaması bakımından bir ayırıma tabi tutulmaya başlandığı görülmektedir. Çalışmamızda mezheb imamlarının teklîfî hükümlere delalet eden ifadeleri de tespit edilerek ilk beş asır fıkıh usulü literatüründe teklîfî hükümlerle ilgili terminolojinin gelişim süreci ortaya konulmaya çalışılmıştır."
titleTranslation: {"en": "The terminology of al-ahkâm at-taklifiyya in the literature of usul al-fiqh: The first five centuries"}
