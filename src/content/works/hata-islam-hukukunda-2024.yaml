abstract: "Zamanın değişmesiyle hükümlerin değişmesi\" yönündeki ahkâmın değişmesi kaidesi, kadim asırlardan bu yana fıkıh düşüncesinde mana ve mefhum olarak mevcudiyetini sürdürmekte, belirli bir sahada ve olağan akışında hükmünü icra etmekteydi. Ancak önce Mecelle'nin söz konusu kaideyi küllî kaideleri arasına alması, sonrasında da modern yenilik hareketlerinin kaideyi fıkıhta modern yenilik projesinin en önemli argümanlarından biri durumuna getirmesiyle, kaide, modern zamanların en çok tartışılan ve en önde bulunan tartışma konularından biri haline gelmiştir. Kaide ile ilgili kadim gelenekte ve Mecelle'de, kaidenin nassla sabit olmayan örf ve âdete dayalı tâlî hükümlerde geçerli olduğu yönünde bir çerçeve belirlenmiştir. Ancak Mecelle sonrasında ise, modern yenilik hareketleri tarafından, kaide ile ilgili kadim gelenekte ve Mecelle'de konulan kayıt ve sınırlar dikkate alınmamış; kaide, kapsamı aşırı genişletilerek, fıkıhta modern yenilenme hareketinin en önemli argümanlarından biri durumuna getirilmiştir. Kaidenin aşırı genişletilmesinde ve \"değişim\"in öne çıkarılmasında modern Batı düşüncesinin de önemli etkileri olmuştur. Kaide, kuruculuğu Cemâleddin Efgânî, Muhammed Abduh ve Reşîd Rızâ gibi yenilikçi düşünürler tarafından yapılan \"modern fıkıh düşüncesi\"nin kurucu, temel paradigmalarından birini oluşturmaktadır. Birçok muasır İslâm hukukçusu ve Türkiye'deki bazı akademisyenler de kaide konusunda bu modern görüşü benimsemiştir. Diğer yandan modern dönemde ahkâmın değişmesi kaidesinin klasik otantik çerçevesi bağlamında ele alınması gerektiğini ve aşırı genişletilmesinin büyük mahzurlara yol açacağını düşünen birçok İslâm âlimi ve müellifi de vardır. Bizim ulaştığımız sonuç da klasik geleneğin ve klasik çerçevenin muhafaza edilmesini savunan modern dönem müelliflerinin görüşü istikametindedir. Araştırmamızda ahkâmın değişmesi konusundaki klasik yaklaşım ile modern yaklaşıma dair bilgiler doküman analizi yöntemi ile toplanmış, sonra karşılaştırılması yapılarak tümevarım yöntemiyle bir sonuca ulaşılmaya çalışılmıştır."
