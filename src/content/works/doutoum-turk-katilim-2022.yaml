abstract: "Ekonomimizin ayrılmaz bir parçası olan bankacılık, uzun yıllardır sürdürdüğü geleneksel faaliyetine, dünya genelinde 1972 yılında Türkiye'de ise 1985 yılında faaliyete başlayan İslami bankacılık ile farklı bir ivme kazanmıştır. Tüm bankacılık türleri için olduğu kadar, katılım bankaları için de karlılık önemli konular arasındadır. Bu çalışmada, 2009-2020 arası Türk bankacılık sektöründe faaliyette bulunan özel sermayeli katılım bankalarında karlılığın belirleyicileri, En Küçük Kareler ve Genelleştirilmiş En Küçük Kareler Yöntemleri kullanılarak panel veri analizi ile incelenmiştir. Çalışma sonuçları özel sermayeli katılım bankaları karlılığının, banka büyüklüğü, yabancı para cinsinden kullandırılan fonlar, Euro efektif satış kuru ve ihracattan pozitif, enflasyon ve GSYIH'dan ise negatif yönde etkilendiğini göstermektedir."
