abstract: "Aile kurumu insanlığın en eski ve en köklü kurumudur. İnsanların topluluklar halinde varlıklarını düzenli bir şekilde devam ettirebilmeleri her şeyden önce âile kurumunun sağlam temeller üzerine dayalı olmasına bağlıdır. Bu bağlamda fıkıh ilmi ve bu ilmî alanda faaliyet gösteren mezhepler âileye ilişkin birçok konuları da bir düzene bağlama yolunda büyük gayretler göstermişlerdir. Şiilik, özellikle onun mu?tedil kolu olan Câferîlik ehli Sünnet?ten sonra en çok taraftarı bulunan bir mezhep olup İslam dünyasında oldukça önemli bir yere sahiptir. Böylelikle İslam dünyasının en yaygın mezheblerinden biri olan Câferîlikte ve mezhebin fıkhi sisteminde âile müessesesi ve nikâh akdi çok önemli konulardan biridir. Bu tezde caferi fikh ekölünün önemli alimlerinden olan Cemâlüddîn el-Hasan b.Yusuf b. Alî İbnü?l-Mutahhar el-Hillî?nin ?Tahrîru?l-ahkâmi?ş-şer?iyye `alâ mezhebi?l-İmâmiyye? eseri kapsamında Câferî nikâh hukukunun farklı-farklı konuları çeşitli açılardan ele alınmıştır. Giriş, dört bölüm, sonuç ve kaynaklardan oluşan çalışmamızda eserdeki aile, nikâh akdine ilişkin toplum için önemli olan birçok meseleler taranarak sıralanmış, yeri geldikçe farklı mezheplerde olan görüşlerle mukayeseli şekilde analiz olunmuştur. I. Bölümde Caferi fıkhında aile kavramı, evlilik akdinin şartları ve unsurları, sahih evlilikte mehir diğer mezheplerdeki farklı görüşlerle mukayeseli şekilde incelenmiştir. II. Bölümde nikâh hukukunda evlenme engelleri, nikâh akdi zamanı ortaya çıkan problemler belli bir sıralama ile incelenmiştir.III Bölümde ise muta nikahı ve onun şartları ele alınmıştır. IV Bölümde evliliğin sonuçları boşanma ve onun şartlarına kısaca değinildi. Sonuc olarak kaydedebiliriz ki Câferî fıkhı ile sünnî fıkıh ekolleri arasında nikâha ilişkin meselelerde büyük benzerlikler söz konusudur. Aradaki en büyük fark mut?a nikâhının meşrûiyeti ve buna bağlı olarak mut?a nikâhına ilişkin diğer hükümler konusudur."
