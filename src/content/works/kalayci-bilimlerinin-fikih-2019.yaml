abstract: "Günümüzde birçok dala ayrılmış olan bilimler inceleme alanları ve yöntemleri bakımından birbirinden çok farklı olsalar da bütün bilimlerin ortak noktası“insan”olduğundan bilim dalları arasında sürekli bir etkileşim bulunmaktadır. İnsan hayatı ile ilgili olan pek çok konu bir açıdan fıkıh ilminin başka bir açıdan fen bilimlerinin ilgi alanına girebilmektedir. Bu çalışmada bu iki disiplinin yollarının kesiştiği meseleler örneklendirilerek fen bilimlerinin fıkıh ilmine katkıları araştırılmıştır. Bu anlamda ele alınan konular fen bilimlerinin hangi alanı ile ilgili olduğuna göre sınıflandırılarak değerlendirilmiştir. Fıkıh kitaplarında yer alan konulardan madde ile ilgili olanlar“Fıkıh ve Fiziki Bilimler”, canlılarla ilgili olanlar ise“Fıkıh ve Biyolojik Bilimler”başlığı altında ele alınmıştır."
