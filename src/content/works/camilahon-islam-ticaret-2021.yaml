abstract: "İslam her devrin, her memleketin ve tüm şartların ihtiyacını karşılayacak esasları en ince noktalarına kadar inceleyen evrensel dindir. İslam çalışmayı ve helal kazanmayı kulluğun bir gereği sayarken, ticaretin evrensel kural ve değerlerini de ibadetlerin kuralları gibi kabul etmiştir. Bu kurallara uyarak ticaret veya üretim yapanları övmüş, dürüst ve güvenilir işadamı ve tüccarın cennetteki yerini peygamberler ve şehitlerin yanı olarak nitelemiştir. Namazda abdest almak nasıl şartsa, ticarette de bir takım kurallar şarttır. Allah'ın istekleridir. Onlar olmadan yapılan alışveriş ya geçersiz ya da günahtır. Allah bu kuralları, hem kendi hoşnutluğu için, hem de insanların kendi aralarında barış ve huzur içerisinde yaşamaları için koymuştur. Bundan dolayı İslam çalışmayı, ticaret yapmayı önemsemiş, alışverişin sağlıklı ve adalete uygun olması için bir takım ilkeler koymuştur. Mesela akitlerin sağlam kurulmasını ve verilen söze bağlı kalınmasını emretmiş; aldatma, yalan beyanda bulunma, zorlama, karaborsacılık, karşı tarafın sıkıntıda olmasından yararlanma, belirsizlik ve risk sömürüsü yoluyla kazanç elde etme gibi haksızlığa sebep olabilecek uygulamaları yasaklamıştır. İslam, insanların mutlu olmaları, birbirlerinin mallarını haksız yollarla yememeleri için ticaretin temel ilkelerini koymuştur. İslam'ın geldiği ilk dönemlerden itibaren Müslümanların sosyal ve kültürel durumlarına baktığımızda dinamik bir hayat görüşünün var olduğunu, bunun sonucu olarak da canlı bir çalışma temposunun olduğunu ve iktisadi hayatın hareketli bir şekilde devam ettiğini görürüz. Ticaretin önemi ve ilkeleri konusunda ilgili ayetlerin yanında Hz. Peygamberin hadisleri ve İslam bilginlerinin yol göstericiliği ile İslam iktisat sistemi kurulmuştur. İslam'ın ticari hayata dair koyduğu kurallara uyulmaz ise piyasada rüşvet, haksız kazanç, hırsızlık, borcunu ödememe, çalışma barışının bozulması gibi olumsuzluklar ortaya çıkacaktır. Ekonomik dengeyi bozmak, haksız kazanç sağlamak, ölçü ve tartıda hile yapmak, müşteriyi aldatmak ve benzeri konular kişiyi Allah'ın rızasından uzaklaştırmakla birlikte aynı zamanda ödenmesi zor birer kul hakkına dönüşebilecektir. Bugün yaşadığımız sosyal hayatta geçmişte geleneksel olarak yaptığımız alışverişin dışına çıkılmıştır. Artık hayatımıza sanal ve kripto paralar ile eletronik alışveriş türleri girmiştir.“Bitcoin”ve“Ethereum”gibi kripto ve sanal paralar İslam âlimlerinin çoğu tarafından incelenmiş ve İslamın ticari alandaki temel kriterlerine bakarak onları caiz görmemişlerdir. Buna gerekçe olarak da bu tür paraların merkezi bir otoriteye sahip olmadığını ve devlet teminatı altında bulunmadığını ileri sürmüşlerdir. Bugün bütün dünya, gelir dağılımındaki adaletsizlik ve ekonomik buhranlar karşısında İslam'ın sosyal hayata dair koyduğu adil ilkelerinin değeri daha da iyi anlaşılmaktadır. Ticari ilişkilerinde hilenin, aldatmanın, sömürünün, faizin olmadığı, emek, üretim ve hizmetin temel amaç olduğu, muamelelerin adil ve dürüst bir şekilde yapıldığı topluluk mutlu ve müreffeh bir toplum olacaktır."
