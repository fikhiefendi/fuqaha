abstract: "Hasılat kirası ve müzâraa akdi, İslam hukukunda gelir paylaşımına dayanan iki önemli sözleşme türüdür ve benzerlikler taşır. Müzâraa akdinde, toprak sahibi toprağını ekim amacıyla çiftçiye verir, çiftçi üretimi gerçekleştirir ve hasat edilen ürün taraflar arasında belirlenen oranlarda paylaşılır; bu akit özellikle tarımsal üretime yöneliktir. Hasılat kirası ise, gelir getiren bir mülk veya işletmenin kiralanmasıyla kurulur ve kiracı, bu mülkten elde ettiği geliri kiraya verene pay olarak sunar. Tarım dışındaki faaliyetleri de kapsayan hasılat kirası, daha geniş bir uygulama alanına sahiptir. Her iki akit de karşılıklı anlaşma ve gelir paylaşımı esasına dayanmakla birlikte, müzâraa akdi tarıma odaklanırken, hasılat kirası farklı gelir getirici faaliyetleri içerebilir; bu da tarafların yükümlülüklerini ve akitlerin uygulama alanlarını belirler. Bu çalışmada, müzâraa akdi ve hasılat kirasının tanımı, rükünleri, şartları, çeşitleri ve sona ermesi gibi konular incelenmiştir. Ayrıca, bu iki akit türünün benzer ve farklı yönlerinin karşılaştırmalı olarak ele alınması amaçlanmıştır. Sonuç bölümünde ise, hasılat kirası ve müzâraa akdinin farklı amaçlara hizmet eden sözleşmeler olduğu vurgulanmıştır. Hasılat kirasında toprak sahibinin pasif olup düzenli gelir elde etmeyi tercih ettiği, müzâraa akdinde ise tarafların tarımsal üretimde iş birliği yaparak risk ve kazancı paylaştıkları ifade edilmiştir. İslam hukuku açısından adil ve dengeli sözleşmelerin her iki modelde de uygun olduğu, ancak bir sözleşme taraflardan birine haksızlık edecek şekilde uygulanırsa bunun kabul edilemeyeceği belirtilerek çalışma sonlandırılmıştır."
