abstract: "Ebu'l-Huseyn el-Basrî, Mütekellimîn usûl-i fıkıh ekolünün en önemli simalarından biri olmasının yanı sıra Mu'tezile usûlü için de oldukça kilit isimlerden biridir. Bu çalışmada Ebu'l-Huseyn el-Basrî'nin el-Mu'temed adlı usûl eseri çerçevesinde yine usûl-i fıkhın en önemli meselelerinden biri olan kıyas konusu incelenmeye çalışılmıştır. Bu bağlamda Ebu'l-Huseyn el-Basrî'nin kıyasın meşruiyetini temellendirme şekli, kıyasın şartları ve diğer tartışmalı konularla alakalı görüşleri, kendisinden önceki Mu'tezilî veya Mu'tezilî eğilimleri ile bilinen âlimlerin ve kendisinden sonraki usûlcülerin görüşleri ile karşılaştırmalı olarak incelenmiş, Ebu'l-Huseyn'in alana katkıları ve izlediği gelenek ortaya konmaya çalışılmıştır."
