abstract: "Türk Finansal sistemi içinde hitap ettiği kesim, sunduğu farklı ve çeşitli enstrümanlarla büyük bir öneme sahip olan katılım bankalarının tarihsel süreçte dünyada yarım asra yakın geçmişi olduğu, ülkemizde ise 1985 yılında Özel Finans Kurumları adı altında faaliyete başlayıp, 2005 yılında Katılım bankaları adıyla Bankacılık sektöründe faaliyetlerine devam ettiği görülmektedir. Özellikle son yıllarda, kamu katılım bankalarının da sektöre dahil olması, ülkemizde İslami finans sisteminin kamuoyu nezdinde daha tanınır hale gelmesi sonucunda katılım bankalarına ilginin daha da artacağı tahmin edilmektedir. Bu sebeplerle geleneksel bankalarla aynı sektörde faaliyet gösteren katılım bankalarının sektördeki yerinin ve sisteme katkısının izlenebilmesi, geleceğe dönük stratejilerini oluşturabilmesi açısından geleneksel bankalarla performans karşılaştırmasının yapılması önemlidir. Bu çalışmada, faizsiz esasa göre çalışan katılım bankacılığı ile faiz çerçevesinde çalışan geleneksel bankaların dünyada ve ülkemizde tarihsel gelişimi, ortaya çıkış sebepleri ele alınmış, Türk bankacılık sisteminde banka türleri irdelenmiş ve katılım bankalarının Türk bankacılık sektöründeki yeri, katılım bankacılığının özellikleri ile geleneksel bankalardan ayrışan özelliklerine değinilmiştir. Bankalarda performans kavramı tanımlanmış, sektörde performans ölçümünün önemi ortaya konulup, bankacılıkta kullanılan performans ölçütleri tanıtılmıştır. Katılım bankaları ile geleneksel bankaların sektör verileri ve seçilmiş rasyolar açısından 2016-2020 yılları arasını kapsayan verilerinin karşılaştırmalı analizi yapılmış ve yıllık artış-düşüş trendleri izlenip yorumlanmıştır. Bankacılık sektöründe geleneksel bankalar ile rekabet halinde olan katılım bankalarının finansal oranlarını iyileştirici adımlar atması, düzenleyici kurumların sektörün ihtiyaçlarına yönelik düzenlemeler yapması, katılım bankalarının tanınırlığı ve bilinirliliği üzerine çalışmalar yürütülmesi ile katılım bankalarının önümüzdeki yıllarda finansal performans açısından geleneksel bankalardan daha önde olabileceği ve sektör payını daha da artırabileceği beklenmektedir."
