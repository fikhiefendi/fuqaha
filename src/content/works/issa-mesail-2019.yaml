abstract: "Bu çalışma iki imamın: (Muhammed b. Muhammed ibni Ebu Hamıd El-Ğazali et-Tusi ile Muhammed b. Ahmed bi. Rüşt Ebu Velit El-Kurtubi) hayatlarını. Ve (Ed-daruriyyu fi usulul fıkhi) adlı kitabı çerçevesinde İbni Rüşt'ün İmam Gazaliye muhalefet ettiği usuli meseleleri kapsamaktadır. Bu tez giriş, üç fasıl ve hatimeden ibarettir Giriş bölümü iki imamın (İmam Ğazalî ve İmam b. Rüşt el-Hafid) biyografilerini ve yaşadıkları asrın siyâsî ictimâî ve ilmî yönlerini kapsamaktadır. Bununla tezimiz beraber ikisinin kitaplarını da tanıtmaktadır. (El-Mustesfa min ilmil-usul) İmam Ğazalînin. (Ed-Deruriyyu fi usulil-fıkhi) İmam İbni Rüşt El-Hafidini. Tezin birinci bölümü İbni Rüşt'ün İmam Gazali'ye muhalefet ettiği şer'i hükümler bahsindeki usulî meseleleri kapsamaktadır. Onlar ki: şer'i hükmün tarifi, rükünleri, hakimin tarifi, sarhoşun teklifi ve boşama hükmü meselesi, vacibin tarifi, vucub nashedilirse meselesi, mübahın tarifi ve kaza konularıdır. Tezin ikinci bölümü ise: İki imamın ihtilafel düştükleri olan delil bahsindeki usulî meseleleri kapsamaktadır. O da: Mutevatirin tanımı, tevatürden hasıl olan ilim zaruri midir nazarî midir?, haberi vahidden murad olan şey ve ifade ettiği şey, akıl: haberi vahid ile amel etmenin vacip olma delili midir? Aadaleti mechul olan birinden rivayet etmek, Cerh ve tadil sebeplerini zikretmek vacip midir?, ziyadetüssîkâ meselesi, hadisi mâna ile rivayet etmek, muhaddisin hadisin bir kısmı üzerine ihtisar yapması gibi konulardır. Nesih babında ise ikisi nesih tarifinde, fiilde tamekkün etmeden bir emrin neshedilmesi, neshin şartları, Kur'ânın mütevatir hadis ile neshedilmesi konularında ihtilaf etmiş. İcma ve kıyas meselesinde ise kıyas ve icmanın tarifinde ihtilaf etmişler. Tezin üçüncü bölümü ise iki imam arasında muhtelif olan ictihat ve deliller bahsindeki usulî meseleri kapsamaktadır: Kioda: delilin tanımı, lafzın hükme delalet etmesinde usul alimlerinin izlediği yol, mefhûmûl-muhalif ve tarifi, isimleri, şartları, çeşitleri. Yine iki imam arasında ihtilaflı olan elfazın delaleti, beyânı ihtiyac anına kadar erteleme meselesi, cins dışında başka birşeyden istisna, ekserden istisna, اِفْعَلْ) yap( siğasının karineler olmadan delaleti meseleridir. İCTİHÂD konusunda ki ihtilafları ise sadece ictihadın tarifi, muctehidin şartları, ve müctehidin isabet etmesinde ki ihtilaflarıdır. Sonuç bölümüne gelirsek; bir çok neticeyi barındıyor. Onladan biri İmam İbni Rüştün ehli sünnet ve cemaat itikadında olması, üstün bir akla sahip olması, usulûl-fıkıhta müctehid olmasıdır. Yine bu neticelerdendir. Kendisi ed-darûriyye fi usulûl-fıkhı isimli kitabında imam Gazalîye (bu kitap çevresinde kendisine vakıf olduğum (36) mesele de muhalefet etmiştir. Anahtar kelimeler :usullî meseleler, usulu̕l-fıkıh, imam El-Ğazali, İmam ibni Rüşt, Mustesfâ, Darûrî."
