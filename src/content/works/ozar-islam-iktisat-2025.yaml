abstract: "Hisbe Teşkilatı, İslami kurallar çerçevesinde, ahlaki boyutu olan ve İslam zihniyetini temsil etmesi amacıyla oluşturulan Medine pazarının işleyişini esas alan bir yapıdır. Söz konusu pazar,“Emr-i bi'l ma'ruf nehy-i ânil-münker”çerçevesinde ele alınmıştır. Bu çalışmada İslam ekonomi pratiğinin bir unsuru olan, Hisbe Teşkilatının, kuruluşu, yapısı, işleyişi ve tarihsel süreci bir çerçevede ele alınmıştır. Ayrıca günümüz piyasa/pazar bozuklukları ele alınarak, hisbe anlayışı ve zihniyeti çerçevesinde tartışılmıştır. Amaç, piyasanın yüksek bir ahlak seviyesine erişebileceği bir sistemin mümkün olabileceğini ve toplumun kötü isçilikten, kötü tüccardan, kötü üreticiden, dolandırıcılıktan, stokçuluktan, karaborsacılıktan, zorbalıktan, sömürüden koruyacak bir iktisat sisteminin geçmişte nasıl uygulandığını ve bugünkü iktisadi sistemde mevcut sorunların giderilmesi için yol gösterici olup olamayacağını veya hangi ölçüde rehber olabileceği araştırmaktır. İdeal İslami ekonomik sistemde hak, adalet, ahlak, gibi değerlerin Hisbe Teşkilatı'ndaki piyasaya yansımasını ele alarak bugünün ekonomiye bir katma değer yaratılmaya çalışılmaktadır. Dünyada, hâkim ekonomik anlayış ve politikalarının insanlığa mutluluk getirmediği gerçeği zihniyet yapısının ahlaki değerler doğrultusunda değişimini gerekli kılmaktadır. Sonuç olarak, İslam ahlak ve ekonomi politikasının, zihniyet çerçevesinde tekrar ele alınması gerekliliğidir. Bu doğrultuda ekonomi politikasının da temelini oluşturabilecek alternatif maddeler sıralanmıştır."
