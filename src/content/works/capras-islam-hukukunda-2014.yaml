abstract: "Duygularıyla var olan insan, davranışlarını da çoğu zaman duygularına göre tayin eder. Duygular kendi içinde olumlu veya olumsuz şeklinde tasnif edilebildikleri gibi, bu duyguların birer sonucu olan söz ve davranışlar da olumlu veya olumsuz olarak nitelendirilmektedirler. İslam dini, duygularla yaratılmış olan insanın bu duygularını görmezden gelmemiştir. Bu duyguları ihmal etmediği gibi, başıboş da bırakmamış; hangi duyguların kime karşı ve hangi şartlarda kullanılabileceğini zapt-u rapt altına almıştır. Her duyguyu Allah'ın hoşnutluğuna ya da hoşnutsuzluğuna bina etmiştir. Duygular arasında en çok arzulanan mutlu olma ve mutlu etme duygusudur. Gerek mutlu olma ve gerekse mutlu etmenin de Allah'ın hoşnut olduğu ve hoşnut olmadığı halleri vardır. Bir fakire yardım etmek, birisine müjdeli bir haber vermek, yalan ve tahkirden uzak bir espriyle çevresindekileri güldürmek Allah'ın hoşnut olduğu haller iken, birileriyle alay ederek eğlenmek, yalan söyleyerek muhataplarını güldürmek, başkalarına zulmederek mutlu olmak ise Allah'ın hoşnut olmadığı durumlardandır. Mizah, insanlar arası mutluluğun en önemli iletişim kanallarındandır. Sevinmenin ve sevdirmenin en önemli araçlarından biri olan mizahın da haddizatında meşru olanı ve meşru olmayanı olduğu gibi, ister meşru olanıyla, ister de meşru olmayanıyla yapılan bir davranış veya söylenen bir sözün sahibine yüklediği bazı sorumluluklar veya müeyyideler olmaktadır. Hayatın pek çok alanında son derece rahat ve yaygın bir şekilde kullanılan mizahla ilgili olarak, Müslüman birey ve toplumun nelere dikkat etmesi gerektiğini bilmeleri dini bir sorumluluktur. Bu sorumluluğun idraki oranında meşru mizahın icra edilmesi mümkün olabileceği gibi, mizahın meşru yer ve şekillerde kullanımı da imkân dâhilinde olacaktır. İbadetlerden aile hukukuna kadar fıkhın pek çok konusunda mizahla ilintili başlıklar vardır. Bu başlıklardan günlük hayatta en çok karşılaşılan bazı konulara ışık tutmakla, mizahla ilgili sağlıklı ve dengeli bir duruşun sergilenmesi büyük oranda mümkün olabilecektir."
