abstract: "Hanbelî fakihi olan İbn Kudâme (ö.620/1223) Hanbelî mezhebinin temel eserlerinden el-Muğnî'nin müellifidir. Bu kapsamlı eser fıkhî alanda mezheplerarası karşılaştırmalı bir eser konumundadır. Hanbelî mezhebi görüşleri yanında diğer mezheplerin muvafık ve muhalif görüşlerine de bu eserde yer verilmektedir. Onun aktardığı görüşlerden bir kısmı da Hanefî mezhebine ait görüşlerdir. Bu araştırmada el-Muğnî'nin nikâh bölümündeki Hanefî mezhebine ait görüşlerin tespit ve tahkiki yapılmaktadır. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın önemi, amacı, kaynakları ve sınırlıklarını ele alınmakta, birinci bölümde de İbn Kudâme'nin hayatı ve ilmi kişiliğine dair bilgiler verilmektedir. İkinci bölümde ise el-Muğnî'deki nikâh babında Hanefilere atfedilen görüşlerin tespiti ve tahkiki yapılmaktadır. Bu kısımda Hanefi âlimlere yapılan atıflar toplamı yaklaşık 127'dir. Bu atfedilen görüşler Hanefi kaynakları ile karşılaştırılmış ve bu konuda elde edilen bulgular değerlendirilmiştir."
