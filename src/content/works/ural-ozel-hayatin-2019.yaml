abstract: "Hukuk literatüründe özel hayat genel itibariyle; başkasıyla paylaşılması uygun görülmeyen sır veya mahremiyet alanı olarak değerlendirilmektedir. Bu alanda meydana gelen ihlal ve suçların önüne geçmek için kanunlar çerçevesinde farklı yaptırımlar ve cezalar olduğu bilinmektedir. Hukukun bu yaklaşımı, mahremiyet alanının korunmasıyla ve dokunulmaz olarak kabul edilmesiyle ilişkilidir. Çünkü hukukun temel varlığı, bireysel ve toplumsal menfaatin gözetilmesidir. Özel hayatın gizliliğini ihtiva eden ihlal eylemleri, farklı şekillerde zuhur etmekte, günümüzde ise daha çok internet ve dijital teknoloji alternatifleri yoluyla işlenmektedir. Bu çalışmada; İslâm hukuk literatüründe özelde kişilik hakları, genelde ise mahremiyet konuları üzerinden özel hayatın gizliliğinin ihlal ve cezalarının tespiti amaçlanmıştır.Ayrıca söz konusu konular irdelenirken özel hayatın gizliliği çerçevesinde ihlal ve cezaların günümüzde daha çok hangi yollarla yapıldığını,İslâm hukuku ilegünümüz hukuku arasında mukayeseye başvurarak, yaklaşım farklılıklarını tespit etmektir."
