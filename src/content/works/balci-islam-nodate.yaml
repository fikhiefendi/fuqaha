abstract: "Bu çalışma fıkıh bağlamında ahlâkî ilkelerin yerini ve işlevini kapsamlı bir şekilde incelemektedir. Din, ahlâk ve hukuk gibi sosyal kurumların birey ve toplum üzerindeki etkileri detaylı olarak ele alınmış; iman, ibadetler, ticarî ilişkiler, evlilik ve ceza hukuku gibi temel konularda ahlâkî ilkelerin nasıl uygulandığı araştırılmıştır. Çalışmada, dinin bireylerde manevi sorumluluk bilinci ve iyi-kötü ayrımını oluşturduğu; ahlâkın bu değerlerin bireysel davranışlara yansımasını sağladığı; hukukun ise toplumsal düzeni korumak için zorlayıcı yaptırımlar uyguladığı vurgulanmıştır. Ayrıca, hukukun toplumsal düzen için tek başına yeterli olmadığı, ahlâkî değerlerin bireylerin içsel motivasyonlarını güçlendirerek toplumsal uyumu desteklediği konusu analiz edilmiştir. İman ve ahlâk ilişkisi bağlamında bireyin manevi bilinç düzeyi ve sorumluluk hissi ön plana çıkarılmış; ibadetlere dair bölümde ise ahlâkî tutumların, ibadetlerin anlamlandırılması ve içselleştirilmesindeki belirleyici rolü ele alınmıştır. Ticarî ilişkilerde dürüstlük, hakkaniyet ve helal kazanç ilkeleriyle ahlâkî sorumluluk arasındaki ilişki vurgulanmış; evlilik kurumunda ise sevgi, sadakat ve sorumluluk gibi temel ahlâkî değerlerin aile yapısının inşası ve korunmasına katkısı analiz edilmiştir. Ayrıca İslâm ceza hukukuna dair incelemelerde, adalet ve hakkaniyetin tesisi noktasında ahlâkî ilkelerin nasıl işlevselleştiği değerlendirilmiştir."
