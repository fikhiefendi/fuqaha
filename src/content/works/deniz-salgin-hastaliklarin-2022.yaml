abstract: "Tarih boyunca zaman zaman insanoğlunun salgın hastalıklara maruz kaldığı bilinmektedir. Veba, Kolera ve yaklaşık üç yıldan beri devam eden Covid-19 gibi bazı hastalıklar hızla bulaşarak salgın halini almakta, kitlesel ölümlere sebep olmaktadır. Bunlar ve benzerleri sabrı gerektiren birer imtihan vesilesidir ve mü'minler, bunu böyle bilmektedirler. Bu salgınlar ibadet hayatını önemli ölçüde etkilemekte; özellikle cemaatle yapılan ibadetlere ara verilmesi gibi farklı uygulamaları gerektirmektedir. Hastalık hallerinde ibadet hayatıyla ilgili uygulamaların nasıl yapılacağı fıkıh kaynaklarında,“Kitâbü'ṭ-ṭahâre”,“kitâbü's-salât”,“kitâbü's-savm”,“kitâbü'l-hac”gibi başlıklar altında çeşitli vesilelerle delilleriyle anlatılmıştır. Bu konuda fıkıh literatüründe çeşitli fetvalar da yer almış; bazı çağdaş eserlerde de fıkhın salgın hastalık gibi olağanüstü hallere bakışı incelenmiştir. Covid-19 pandemisinin yaşandığı yıllarda Diyanet İşleri Başkanlığı'nın fetva ve açıklamaları da halkı aydınlatmada çok önemli bir yer tutmuştur. Bunlarla birlikte konuyla ilgili olarak müstakil bir akademik çalışmaya ihtiyaç duyulmuş“Salgın Hastalıkların İbadet Hayatına Etkisi”adıyla bir yüksek lisans tezi hazırlanması uygun görülmüştür. Bu çalışmada geçmişte de hastalık durumlarında farklı uygulamalara gidildiği örneklerle izah edilmiş, bu uygulamaların fıkha uygun olup olmadığı açıklanmaya çalışılmıştır."
