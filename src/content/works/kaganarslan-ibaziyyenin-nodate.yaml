abstract: "İbâzıyye, hicri 1. asırda Müslümanlar arasında meydana gelen Sıffîn Savaşında tahkîm olayına karşı çıkan ilk Hâricîlerin bir devamı olarak Basra'da ortaya çıkmıştır. İbâzıyye, fıkhî bir mezhep olarak kendi kaynaklarından ziyade başka kaynakların dilinden Hâricî çatısı altında ele alınmıştır. Mezhebin fıkhı ve usûlü, ilk dönemde itikâdî ve siyasî alanda yaşanan olumsuzlukların bıraktığı izlenimin gölgesinde kalmıştır. İbâzıyye, tahkîme karşı çıkan ilk Hâricîler sonrasında oluşan hareketin içinde yer almıştır. Ancak bu oluşumun daha sonraki süreçte kendi içinde yaşadığı ayrışma, müelliflerce yeterince dikkate alınmamıştır. İbâzıyye'nin toptancı bir yaklaşımla Hâricî çatısı altında diğer Hâricî gruplarla birlikte zikredilmesi, hakkında ileri sürülen birçok görüşün temelini oluşturmaktadır. Bu sebeple çalışmada, genel olarak İbâzıyye mezhebinin tarihi kökeni, doğuşu ve teşekkülünü özelde ise sahip olduğu fıkıh usûlü anlayışını klasik kaynakları da ihmal etmeden mezhebin kaynaklarından hareketle ele aldık. Çalışmada, genelde İbâzî mezhebine, özelde ise fıkıh ve usûlüne ilişkin İbâzıyye dışındaki kaynaklarda ortaya konulan yaklaşım ile İbâzîlerin yaklaşımının birbirinden farklı olduğunu gördük. İbâzîlerin fıkıh usûlü anlayışını; esas aldıkları deliller, istinbât yöntemleri, deliller arasında teâruz ve tercih metotları, ictihâd ve taklîde yaklaşımları gibi temel konular üzerinden ele aldık. Araştırmada, Hâricî çatısı altında ya da doğrudan İbâzıyye'ye nispet edilen fıkıh ve usûlüne dair birçok görüşün, İbâzî kaynaklarca doğrulanmadığını gördük. Mezhebin fıkıh usûlü düşüncesinin tedvin ve gelişiminin büyük oranda Ehl-i Sünnet'in bilhassa mütekellimîn usûlcülerin etkisinde devam ettiği söylenebilir. Genel olarak fıkıh usûlü konularında İbâzıyye'nin Ehl-i Sünnetle olan ihtilafları Ehli Sünnet'e mensup mezheplerin kendi aralarında yaşadıkları ihtilaflardan pek farklı değildir. Özetle İbâzıyye Kur'ân, sünnet, icmâ, kıyas ve istidlâl delillerine dayalı bir usûl anlayışını savunmaktadır."
