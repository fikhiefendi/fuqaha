abstract: "ÖZET Bu araştırmada, İslâm hukukunda akraba evliliği, incelenmiştir. Güncel bir konu olması dolayısıyla Akraba Evliliği gerek yazalı gerekse görsel medyada sıkça yer almaktadır. Bu itibarla İslâm kaynaklarında akraba evliliği detaylı olarak araştırılmıştır. Çalışma, giriş ve iki bölümden oluşmaktadır: Giriş bölümünde, genel olarak aile ve evlilik ele alınmıştır. Birinci bölümde, konuyla alakalı âyet, hadis, sahabe sözü ve uygulamalara değinilerek, bunların değerlendirilmesi yapılmıştır. İkinci bölümde, Akraba evliliğinin sosyolojik ve tıbbî boyutu araştırılarak bu konuda yapılmış olan araştırmalara ve anketlere yer verilmiştir. Çalışma bir sonuç bölümüyle tamamlanmıştır."
