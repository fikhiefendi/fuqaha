abstract: "Bu tez, ilk dönem Osmanlı fakihlerinden Kutbuddin İznikî ile Cumhuriyet dönemi alimlerinden Ömer Nasuhi Bilmen'in yazdıkları ilmihal kitaplarını çeşitli yönlerden karşılaştırarak ilmihal geleneği açısından iki dönem arasındaki farkı ortaya çıkarmayı amaçlamaktadır.Araştırma, bir Giriş ve iki Bölüm'den meydana gelmektedir.Girişte, konunun seçimi, sınırlandırılması, metod, literatür ve ilmihal geleneğine yer verilmiştir.Birinci bölümde, tezimize konu olan Mukaddime ve Büyük İslam İlmihali'nin müellifleri ve diğer eserleri hakkında bilgi verilmiş ve tez konusu olan ilmihaller çeşitli yönlerden karşılaştırılmıştır.İkinci bölümde ise Mukaddime ve Büyük İslam İlmihali'nin konuları tasnif edilerek mukayese yapılmıştır.Anahtar Sözcükler Kutbuddin İznikî, Ömer Nasuhi Bilmen, İlmihal, Mukayese"
