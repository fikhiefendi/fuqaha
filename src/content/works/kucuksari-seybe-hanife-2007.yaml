abstract: "Bu çalışmada İbn Ebî Şeybe'nin, Ebû Hanîfe'ye muâmelât alanında yönelttiği eleştiriler ele alınmıştır. İbn Ebî Şeybe hadis ekolünün önemli bir temsilcisi, Ebû Hanîfe ise re'y ekolünün kurucu isimlerinden biri olarak görülmektedir. Bu bağlamda, özelde bu iki âlim arasındaki ihtilâfları konu edinen bu çalışma, genelde re'y ve hadis ekollerinin ilmî metotlarına ışık tutacaktır. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde; Konu, yöntem ve kaynakların yanı sıra, İbn Ebî Şeybe ve Ebû Hanîfe'nin hayatları ve ilmî kişilikleri çerçevesinde kısa bilgiler verilmiştir. Birinci bölümde; İbn Ebî Şeybe'nin eleştirilerde bulunduğu meselelerden şahıs ve aile hukuklarına dair hususlar, ikinci bölümde; borçlar hukukuyla alakalı konular ele alınmıştır. Üçüncü bölümde ise taraflar arasındaki ihtilafların sosyal ve metodolojik sebepleri tespit edilmiş ve incelenmiştir."
