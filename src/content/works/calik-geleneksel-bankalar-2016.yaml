abstract: "Bu çalışmanın amacı; ekonomik alanda temel yapı taşı olan bankaların türleri içerisinde yer alan geleneksel bankalar ile katılım bankalarının farklılıklarını incelemek, dünya ekonomisinde giderek büyüyen ve ilgiyi üzerine çeken katılım bankalarının neden önemsendiğini anlatmak ve geleneksel bankalar ile katılım bankalarının kıyaslanmasında, Basel III kriterlerini de göz önünde tutarak performans analizi yapmaktır. Bu çalışmada Türkiye'de 2010-2015 yılları arasında faaliyette bulunan 10 geleneksel banka ve 2 katılım bankasının mali tablolarından elde edilen veriler kullanılarak çalışma iki dönem halinde incelenmiştir. Basel III öncesi dönem olarak 2010-2012 yılları arası ve Basel III sonrası dönem olarak da 2013-2015 yılları arası esas alınmıştır. Analizler sonucunda hem geleneksel bankalar ile katılım bankaları, hem de Basel III öncesi ve sonrası dönemler itibariyle çeşitli kıyaslamalar yapılmıştır. Yapılan kıyaslamalara göre Basel III kriterlerinin her iki banka türünde de finansal yapılarında önemli değişikliklere sebep olduğu, finansal rasyolardaki değişmelerle tespit edilmiştir."
