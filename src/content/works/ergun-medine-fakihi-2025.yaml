abstract: "Bu araştırma, 1./7. asrın son çeyreği ile 2./8. asrın ilk yarısında yaşamış, tedvin ve tasnif dönemlerini tecrübe etmiş, pek çok âlim/münekkit tarafından güvenilir addedilmiş, Abdullah b. Ömer'in (ö. 73/693) rivayetlerine en yakın hocası ve ilminin asıl kaynağı olarak tespit edilen Nâfi' Mevlâ İbn Ömer (ö. 117/735) ile ulaşmış ve onun rivayetlerini kendinden sonraki nesle aktarmada âdeta bir köprü vazifesi görmüş, Medine fakihlerinin ilmini yüklenen pek çok isimden istifade etmiş olan Ubeydullah b. Ömer b. Hafs (ö. 147/764) ve Cüz'ünü konu etmektedir. Çalışmada Ubeydullah b. Ömer b. Hafs'ın entelektüel biyografisi isnâd, ricâl ve tematik verilerle ortaya konulmuş, yakın hoca ve öğrencileri tespit edilmiş, hadis tarihindeki konumu/rolüne dikkat çekilmiştir. Ubeydullah b. Ömer bir nüshaya sahiptir ancak çalışmanın konusu olan eserin müellif nüshası değil, mürettibinin Şuayb b. İshâk olduğu ortaya konulmuştur. Eserin diğer rivayetlerinin de tespit edilmesiyle birlikte Şuayb b. İshâk nüshasının bu nüshalar arasındaki konumu, farklılıkları ve benzerlikleri, yayılım yönü konu edilmiştir. Tespit edilen tüm rivayetleri ile Ubeydullah b. Ömer b. Hafs'ın nüshasının ise inşa edilebileceğine dikkat çekilmiştir. Ubeydullah b. Ömer b. Hafs'ın rivayetlerinin Şuayb b. İshâk yoluyla değil de diğer râvileri vasıtasıyla 3./9. asır koleksiyonlarına intikal ettiği tespit edilmiştir. Tüm bu zikredilenlerle beraber Cüz'ün tanıtımı yapılmış, muhtevası usûl açısından analiz edilmiş ve üçte ikisini namaz, talâk ve hac konularını muhtevi rivayetlerin oluşturduğu hadislerle fıkhı yansıtan bir fetva kitabı olduğu sonucuna ulaşılmıştır."
