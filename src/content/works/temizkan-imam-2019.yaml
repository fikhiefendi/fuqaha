abstract: "Fıkıh usûlü, başta fıkıh olmak üzere bütün İslami ilimler için bir üst metodoloji hüviyetine sahiptir. Şâfiî, kaleme aldığı er-Risâle'siyle bu ilmin kurucusu olmuştur. Ona göre, şer'î hükümler konusunda kesin ve güvenilir bilgi sağlayan kaynaklar/cihetü'l-ilm, Kur'an, Sünnet ile icmâ ve kıyastır. Şer'î delillerden olan hadislerin birbiriyle uyumu ve aralarında yaşanacak ihtilafı giderme, Şâfiî'nin eserlerinde önemli bir yer tutmanın yanı sıra onu, usûle dair bir eser yazmaya sevk eden etkenlerin başında yer almaktadır. Şâfiî, hadisler arası ihtilaf konusunu ele alan ve çözüm esaslarını belirleyen ve bu alanda müstakil eser yazan ilk kişidir. Çalışmamızda Şâfiî'nin konuyla ilgili eserleri başta olmak üzere konuyla ilgili çalışmaları incelemek suretiyle anlayışını ortaya koymaya çalıştık. Bu çerçevede birinci bölümde Şâfiî'nin hayatı, eseleri, düşünce yapısı ve fıkıh usûlü anlayışına yer verirken; ikinci bölümde ihtilaf ve ilgili kavramların tanımı, teâruzun imkânı, vukuu, rükünleri, şartları, mahalli, hükmü, türleri ve çözüm yolları gibi konularda İmam Şâfiî ile cumhurun yaklaşımlarına yer verdik. Şâfiî'ye göre şer'î deliller arasında, çözümsüz bir çatışmanın vuku' söz konusu değildir. Ancak, her çözüm yolu mutlaka bir delile dayanmalıdır. Şâfiî, eserlerinde teâruz kavramını mutlak olarak delillerin çatışmasını ifade etmek üzere kullansa da çoğunlukla hadislerin birbiriyle çatışmasını ifade etmek üzere, ihtilafu'l-hadis kavramıyla aynı anlamda kullanmaktadır. Şâfiî, muhtelif/ihtilaf kavramlarıyla, aralarında cem' imkânı bulunmayan hadislerin çatışmasını kastetmektedir. Şâfiî, zahirde birbiriyle çatışan ve te'lifi imkân dâhilinde olan deliller için“cem' ”kavramı yerine“iki delilin kullanılması”veya“iki haberin geçerli kılınması”anlamına gelen“isti'mâlu'd-delileyn”ya da“İmdâu'd-delîleyn”ifadelerini kullanırken, buna karşın aralarında hakiki teâruzun/ihtilafın bulunması nedeniyle uzlaştırılamayan deliller için ise,“İki delilden birinin itibardan/amelden düşürülmesi, atılması, işlevsiz kılınması”anlamına gelen“ıskatu/tarhu/ta'til-ü ehadi'd-delîleyn”tabirlerini kullanmaktadır. Şâfiî, ihtilafı gidermede sırasıyla cem', nesh ve tercih yollarına başvurmaktadır. O'na göre nesh ve tercih, hakiki; cem' ise zahiri ihtilafı giderme yollarıdır. Anahtar Sözcükler Şer'î delil, Hadis, İhtilaf, Teâruz, Cem', Çözüm yolu, Nesh, Tercih, Iskat, İ'mal."
