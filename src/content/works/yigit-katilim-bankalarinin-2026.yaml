abstract: "Bu çalışmada, Türkiye'de faaliyet gösteren katılım bankalarının finansal performansları çok kriterli karar verme yaklaşımı çerçevesinde ayrıntılı biçimde incelenmiştir. Finansal performansın tek bir gösterge ile açıklanamayacağı varsayımından hareketle, bankaların mali tablolarından elde edilen veriler kullanılarak çok boyutlu bir değerlendirme yapılmıştır. Bu kapsamda, öncelikle finansal performansı temsil eden kriterlerin göreli önem düzeyleri SD yöntemi ile nesnel olarak belirlenmiş, ardından bankaların performansları ARAS ve MOORA yöntemleri kullanılarak analiz edilmiştir. Böylece, kriter ağırlıklandırması ve performans sıralaması aşamaları bütüncül bir yöntemsel yapı içerisinde ele alınmıştır. Elde edilen bulgular, katılım bankaları arasında finansal performans açısından anlamlı farklılıklar bulunduğunu ortaya koymaktadır. ARAS ve MOORA yöntemleri ile elde edilen sıralamaların büyük ölçüde birbirini desteklemesi, analiz sonuçlarının tutarlılığını ve güvenilirliğini göstermektedir. Çalışma, SD yöntemi ile yapılan nesnel ağırlıklandırmanın performans değerlendirme sürecine önemli katkı sağladığını ve çok kriterli karar verme yöntemlerinin katılım bankalarının finansal performanslarının ölçülmesinde etkili araçlar olduğunu ortaya koymaktadır. Bu yönüyle araştırma, katılım bankacılığı alanındaki ampirik literatüre yöntemsel ve uygulamaya yönelik katkı sunmaktadır."
