abstract: "İslam dininin temelinde inanç ve ahlakla birlikte bir hukuk sistemi de mevcuttur. Bu hukuk sistemindeki dinî hükümlerin meşruiyetine başlıca Kitap ve Sünnet kaynaklık eder. Sonra temel şer'î deliller arasında üçüncü sırada yer alan ve İslam hukukunun önemli kavramlarından biri olan icmâ gelmektedir. İcmâ, Kitap ve Sünnetin çizgisinden sapmadan meydana gelen yeni meseleler hakkında çözüm üretme kurumu olarak tasarlanmıştır. Çalışmamızda Eyyûbîler dönemi Mısır'da ilme ve ilim ehline önem verilen münbit bir dönemde yaşayan kıraat, fıkıh, hadis ve Arap dili ve edebiyatı gibi ilim alanlarında kendini yetiştirmiş ve Mâlikî mezhebinin büyük alimlerinden olan İbnü'l-Hâcib'in icmâ anlayışı incelenmiştir. O, Doğu İslam dünyasında Arap diline dair eserleriyle bilinirken, Batı İslam dünyasında fıkıh ve fıkıh usûlüne dair eserleriyle şöhret bulmuştur. İbnü'l-Hâcib'in icmâ anlayışını incelerken özgün görüşlerini tespit etmeye çalıştık. Usûl alimleri ve mensubu olduğu Mâlikî mezhebi ile ittifak veya ihtilaf ettiği konuları, icmâ hakkındaki eleştirileri ve tespitleri incelenmiştir."
