abstract: "Bu tez, İslam Hukukunda“Hile-i Şer'iyye”nin oluştuğu ortam, çıkış sebebi ve dayanağı; ayrıca tanımı, mahiyeti ve mezheplerin bu konu hakkındaki görüşleri, delilleri ve özellikle Hanefi mezhebinin“Aile Hukuku”alanında ileri sürdükleri hile-i şer'iyyeleri kapsamaktadır. Çalışmanın ilk bölümünde hile-i şer'iyye'nin ahlak ve hukuk ilişkisi tartışılmıştır; amel, niyet ve fiil çerçevesinde hile-i şer'iyye'ye genel bir açıdan bakılmaya çalışılmıştır; hile-i şer'iyye'nin ıstılahtaki tanımı, mahiyeti, mezheplerin görüşleri ve delilleri hakkındaki bilgilere yer verilmiştir. İkinci bölümde İslam Aile Hukukunda nikah ve talak konusu hakkında genel bilgi verilip Hanefilerin nikah, talak ve bu konuların içinde yer alan bazı meselelerle alakalı ileri sürdükleri hile-i şer'iyye örneklerine geçilmiştir. Çalışmanın sonuç kısmında ise genel bir değerlendirme yapılmıştır."
