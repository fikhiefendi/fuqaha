abstract: "Karşılaşılan ve çözüme kavuşturulması için ehline sorulan, şer'î bir meselenin cevaplandırılması demek olan fetva, fıkhın dinamik alanıdır. Hz. Peygamber (s.a.v) ile başlayıp sahâbe ve tabiîn nesli ile devam eden süreç, fetva verme yetkisine sahip uzmanlarca yerine getiriliyordu. Zamanla ihtiyaca binaen kurumsal bir kimliğe kavuşan fetva müessesesindeki fetvalar kayıt altına alınmıştır. 1970-2015 yılları arasında Kastamonu Müftülüğü fetva birimine yöneltilen ve kayıt altına alınan soruların teşkil ettiği iki adet defter, halkın fıkıh anlayışı hakkında vereceği fikir ile dinî, sosyal ve ahlakî hayatına ışık tutması bakımından önem taşımaktadır. Kastamonu Müftülüğünün söz konusu yılları kapsayan fetva defterlerinde akaid, ibadetler ve muamelatla ilgili olmak üzere toplamda üç yüz on dokuz soru ve cevap yer almaktadır. Fetvalar ağırlıklı olarak Kastamonu halkından gelen sorulara verilen cevaplardan müteşekkildir. Bununla birlikte miras ile ilgili Tokat'lı bir vatandaşın sormuş olduğu soruyu da barındırmaktadır. Giriş kısmında tezin konusu, amacı, önemi ve kapsamına değinildikten sonraki bölümde, tezin hazırlanmasındaki yönteme kısaca vurgu yapılmıştır. Çalışmamızı üzerine temellendireceğimiz teorik bilgilerin ele alındığı bölümde, genel olarak fetva, fetva verme yetkisi ve fetva verme kurumları, fetva usûlü hakkında bilgi verilmiştir. Defterlerdeki sorular öncelikle içerdiği konulara göre tasnif edilerek fetva usûlü açısından değerlendirilmiştir. Şifahi sorular ışığında Müslüman bireylerin fetva ve fetva kurumu ile olan ilişkisi bağlamında Türkiye'de fetvanın konumuna değinildikten sonra çalışmadan elde edilen sonuca ve buna bağlı olarak bazı önerilere yer verilmiştir. Ekler kısmında ise, fetva defterlerinin dış kapak özellikleri, iç özellikleri ve fetvaların fıkhî konulara göre tasnifi yer almaktadır."
