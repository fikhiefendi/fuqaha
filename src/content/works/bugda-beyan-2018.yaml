abstract: "İslam ilim mirasında delâlet teorisi olarak bilinen lafız anlam ilişkisi, büyük bir öneme haizdir. Zira saadet-i dâreyn için toplumsal hayatı belirli bir sistem içinde şekillendiren Kur'ân ve sünnetin maksadını ve hikmetini doğru anlamak ve bunlardan hukukî ahkâmları istinbât etmek için lafızların bünyesinde barındırdığı manaları iyi bilmek gerekir. Ayrıca bir edebî sanatı ortaya koymak için edebî unsurlara hâkim olunmalı ve tasavvur edilen manayı farklı söz ve üslupla ifade etme melekesine de sahip olmak gerekmektedir. Bu önemden ötürü belâgat ve fıkıh usûlü disiplinlerinde, lafız anlam ilişkisi titizlikle incelenmiştir. Edebî eserlerin değerini tespit etme ve Kur'ân'ın iʻcâzını ispatlama yöntemi olan belâgat ilimlerinin bir disiplini olan beyân ile nasslardan şerʻî hükümleri isinbât etme metodu olan fıkıh usûlü ilişkisini konu edinen bu çalışma, giriş bölümünün ardından iki bölüm ve sonuçtan oluşmaktadır. Çalışmanın giriş kısmında araştırmanın konusu, amacı, çalışmada esas alınan kaynaklar, literatür çalışmaları ve araştırmanın yöntemi ele alınmıştır. Tezin birinci bölümünde belâgat ve fesâhat kavramlarının tahlilini yapıldıktan sonra belâgat ilimlerinin doğmasına neden olan saikler, belâgat bilimlerinin müstakil bir hüviyet kazanmasına katkı sağlayan disiplinler ve bu bilimlerinin gelişim sürecinin tarihi arka planı incelenmiştir. Akabinde fıkıh usûlü ilminin İslam'ın ilk döneminden gönümüze kadar tarihi seyir içindeki gelişimi ve son olarak belâgat ve fıkıh usulüne dair eser yazan müellifler ve alanla ilgili eserleri ele alınmıştır. Tezin ikinci bölümünde ise, belâgat ile fıkıh usûlü arasındaki ilişki incelenmiştir. İki disiplin arasındaki ilişki çerçevesinde ilk etapta beyân daha sonra delâlet nazariyesi her iki disiplin bağlamında ele alınmıştır. Son olarak her iki disiplin için de büyük bir öneme sahip olan hakîkat, mecâz, mecâzın kısımları, teşbîh ve kıyâs, sarih, kinâye ve tarîz konuları incelenmiştir."
