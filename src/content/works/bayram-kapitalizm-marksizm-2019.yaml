abstract: "Hazırladığımız bu tezde amacımız, Dünya genelinde hüküm süren üç ekonomik yaklaşımın; Kapitalizmin, Marksizmin ve İslâm Hukukunun faize nasıl yaklaştıklarını ve faizin bu üç yaklaşımdaki yerini tespit etmektir. Bunun için üç yaklaşımın temel eserleri başta olmak üzere konuyla ilgili olan kaynakları bulabildiğimiz kadarıyla tarayıp tespit ettik. Eserleri inceledikten sonra, önceden belirlediğimiz başlıklara göre mevcut bilgileri tasnif ettik. Konunun güncel bir konu olması hasebiyle, faizin günümüzdeki durumuna da yeri geldikçe değindik. Faizin tarihini ortaya koyduktan sonra, üç ekonomik görüşün faize yaklaşımını ve bu üç görüşün kıyaslamasını yaptıktan sonra tezimizi sonuçlandırdık. Tez bitiminde faizin hayatımızı fark edemediğimiz kadar etkilediğini ve zararının düşündüğümüzden çok daha fazla olduğunu müşahede ettik. Üç ekonomik görüşten Kapitalizm ve Marksizmin ekonomik problemlere farklı çözümler getirmekle beraber sonuçta problemleri daha çok büyüttüğünü, İslâm Hukukunun ise problemlerin köküne inip insan fıtratına ve toplumsal realitelere uygun yöntemlerle problemleri çözdüğünü veya çözme potansiyeline sahip olduğunu tespit ettik."
