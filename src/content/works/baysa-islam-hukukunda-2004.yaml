abstract: "ÖZET Bu çalışmamızda, Kennedy I ve II sınıflamasına dahil bireylerde rutin tekniklerle yaptığımız protezlerin, farklı test yiyecekleri çiğnenmeleri ve maksimal sıkma fonksiyonlarında Masseter ve Temporalis Anterior kasları üzerine etkilerini EMG ile araştırdık Araştırmamızdaki grupların yaş ve cinsiyet ortalamaları (Kennedy I: 39.50 ± 2.63 6'sı bayan ve 4'ü erkek, Kennedy II: 39.60 ± 2.22 4'ü bayanve 6'sı erkek, Kontrol: 38.40 ± 2.17 5'i bayan ve 5'i erkek) şeklinde olmak üzere toplam denek sayımız 30 kişiden oluşmaktadır. Rutin tekniklerle yaptığımız protezlerin çiğneme kasları üzerine etkilerine 3 gram fındık, 3 gram sakız çiğnettirilerek ve S sn maksimal sıkma yaptırtılarak, 1. ve 3 aylarda bakıldı. Çiğneme fonksiyonlarında Kennedy II protezlerinde dişsiz sonlanan taraftaki masseter ve temporalis anterior kaslarında, Kennedy I grubuna gore daha fazla artış görüldü. Bu gruplardan elde edilen veriler doğal dişli bireylerle kıyaslandığında daha düşük bulundu. Maksimal sıkma esnasında ise Kennedy I ile II arasında fark bulunmazken, doğal dişli bireylerde kas aktivasyonu en yüksek tespit edildi. 79"
