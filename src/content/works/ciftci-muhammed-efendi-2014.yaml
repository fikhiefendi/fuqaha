abstract: "Tercüme-i Sadru'ş-Şerîʻa Arap harfleriyle yazılmış, Osmanlı Türkçesi dil özelliklerini taşıyan bir fıkıh tercümesidir. Çalışmamıza konu olan kısım, eserin Süleymaniye Yazma Eser Kütüphanesi Ayasofya Bölümü'nde 1052 demirbaş numarasıyla kayıtlı nüshasının 130b/06-160b/14 varaklarını kapsamaktadır. Eser, Mülteka'l-Ebhur tercümesiyle tanınan Mevkûfâtî Muhammed Efendi tarafından yazılmıştır. Bu çalışma dört ana bölümden oluşmaktadır: İnceleme, Metin, Dizin, Tıpkıbasım. İnceleme bölümünde, müellif, mütercim ve tez konusu olan eser hakkında bilgi verildikten sonra eserin imlâ, dil ve ses özellikleri incelenmiş ve metnin geniş bir özeti verilmiştir. Metin bölümünde, çalışmamıza konu olan varakların transkripsiyonlu metni yer almaktadır. Arapça kısımlar metnin aralarında orijinaline bağlı kalarak aynen verilmiştir. Dizin bölümünde, transkripsiyonu yapılmış metinde bulunan tüm kelimeler metin içinde kullanıldığı anlamlarıyla anlamlandırılmıştır. Metinde geçen Arapça ibareler için de ayrı bir dizin oluşturulmuştur. Tıpkıbasım bölümünde de çalışmamıza konu olan varakların tıpkıbasımı yer almaktadır."
