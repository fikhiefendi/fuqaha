abstract: "Fıkhî mezheplerin büyük çoğunluğu usûl anlayışlarında kapsamlı veya sınırlı ölçüde fıkhî kıyasa (temsil, analoji) yer vermiş, bilhassa ehl-i rey, analojiye başvurmaksızın fıkhî meselelere çözüm bulunamayacağını dile getirmiştir. Kendilerini ehl-i hadis içerisinde konumlandıran Zâhirîlerin en önemli temsilcilerinden olan İbn Hazm (ö. 456/1064) ise karşılaşabilecek sınırsız meselenin fıkhî kıyasa başvurmaksızın, eldeki naslarla çözülebileceğini savunmuştur. Buna göre İbn Hazm, fıkhî kıyasa alternatif olarak mantıkî kıyasın (syllogism) ve mantık ilminin diğer imkânlarının kullanılmasını teklif etmiştir. Ayrıca o, dönemindeki hâkim fıkıh anlayışına ciddi eleştiriler getirmiştir. İbn Hazm'ın Hanefî mezhebi özelinde ehl-i reye yönelik kıyas eleştirisinin, mantıkî temelleri ve fürû-i fıkha yansımalarıyla birlikte ortaya konulmasını hedefleyen bu tez, bir giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi, yöntem ve kaynakları ortaya konulmuştur. Birinci bölümde İbn Hazm'ın kıyas eleştirisinin arka planının anlaşılması için ilk olarak onun epistemolojisine, mantık ve şer'î delil anlayışına, ardından kıyasla ilişkisini kurduğu kavramlardan olan taklit, rey ve istihsâna bakışı ile ictihad anlayışına kısaca değinilmiştir. Daha sonra onun illet, ta'lîl ve kıyasa bakışı ve daha çok Hanefîler özelinde ehl-i reye yönelik ilgili eleştirileri, bilhassa ilk dönem Hanefîlerinden Cessâs'ın (ö. 370/981) görüşleri ile mukayeseli olarak incelenmiştir. İkinci bölümde ise İbn Hazm'ın el-Muhallâ bi'l-âsâr isimli kapsamlı fürû-ı fıkıh eseri çerçevesinde, onun teoride şer'î bir delil olarak kabul etmediği kıyasa, uygulamada ne tür eleştiriler getirdiği ele alınmıştır. Bu çerçevede İbn Hazm'ın Hanefîlere nispet ettiği temsil gücü yüksek bazı kıyaslar seçilerek onun bu kıyaslara yönelik itiraz ve eleştirileri ortaya konulmuş, ayrıca bu kıyasların Hanefîlere aidiyeti araştırılmıştır."
