abstract: "İslam hukuk düşüncesinin tarihsel gelişiminde ekolleşme yönündeki ilk ayrımın başlangıçta coğrafî bir isimlendirmeye dayalı olarak Ehl-i Hicâz ve Ehl-i Irak şeklinde olduğunu, kısa bir zaman sonra ise bu ayrımın coğrafî niteliklerinden sıyrılarak yöntemsel bir hüviyete kavuştuğunu söylemek mümkündür. Bu yöntemsel ayrımın iki ekolünü ise Ehl-i Hadis ve Ehl-i Rey teşkil etmektedir. Fıkıh mezheplerinin teşekkülü ile birlikte söz konusu ayrım önemini bir ölçüde yitirmiş olsa da bu ekolleşmenin izlerini fıkıh mezheplerinin usul anlayışlarında görmek mümkündür. İbn Teymiyye hicrî VII. ve VIII. Yüzyıllarda yaşamış, zihinsel kodları bakımından ehl-i hadis ekolünün karakteristik özelliklerini kendi üzerinde taşıyan, Hanbelî mezhebine mensup bir âlimdir. İslâmî ilimlerin hemen hemen bütün dallarına ilişkin yazdığı eserleriyle tarih boyunca büyük bir etki alanına sahip olan İbn Teymiyye'nin fıkıh ve usul alanında ehl-i rey'e ve bu ekolün temsilcisi mahiyetinde gördüğü Hanefîlere yönelik çeşitli değerlendirmelerde bulunduğu görülür. Sonraları \"selefî düşüncenin kurucu ismi\" olarak değerlendirilen İbn Teymiyye'nin, kendi düşünce sisteminin tarihsel serüveninde \"öteki\" olarak algılanan çevreler hakkındaki değerlendirmeleri önemlidir. Onun, kurucu imamlarından başlamak üzere Hanefîlerin gerek usul ve metodolojileri, gerekse somut fıkıh meselelerine yönelik fetva ve ictihadları hakkındaki bu değerlendirmeleri, selefî düşüncenin reye ve reyin temsilcisi konumundaki Hanefîliğe bakışını derinden etkilemiştir. Bu çalışmada İbn Teymiyye'nin Hanefîliğe yönelik değerlendirmeleri bir bütünlük içinde ele alınmış, onun Hanefîlerin yöntem ve uygulamalarında tasvip ettiği ve eleştirdiği noktalar açıklığa kavuşturulmaya çalışılmıştır. Bu değerlendirmeler bir bütünlük hâlinde incelendiğinde İbn Teymiyye'nin Hanefîliği usullerinin net olmaması, hile-i şerʻiyyeyi aşırı bir şekilde kullanmaları, nasslara muhalif şerʻî kıyasların olabileceği görüşünü benimsemeleri, haber-i vahidler ile amel konusunda ileri sürdükleri şartlar gibi konularda eleştirdiği görülmektedir."
