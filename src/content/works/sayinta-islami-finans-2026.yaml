abstract: "Bu çalışmanın amacı, İslami finansal okuryazarlığının İslami bankacılık tercihine etkisinde İslami inanç ve helal algısının rolünü incelemektir. Araştırmada nicel yöntem benimsenmiş ve örneklem kapsamına alınan 278 katılımcıdan anket yoluyla veri toplanmıştır. Elde edilen veriler istatistiksel analiz teknikleri ile değerlendirilmiştir. Literatür doğrultusunda İslami inanç ve helal algısı bağımsız değişkenler, İslami bankacılık tercihi bağımlı değişken ve İslami finans okuryazarlığı ise düzenleyici değişken olarak ele alınmıştır. Analiz sonuçlarına göre İslami inancın helal algısını pozitif ve anlamlı biçimde etkilediği, ayrıca İslami inancın İslami bankacılık tercihi üzerinde de pozitif ve anlamlı bir etkiye sahip olduğu tespit edilmiştir. Bunun yanında helal algısının İslami bankacılık tercihini pozitif yönde ve anlamlı düzeyde etkilediği belirlenmiştir. Son olarak, İslami finans okuryazarlığının, helal algısı ile İslami bankacılık tercihi arasındaki ilişkide düzenleyici bir role sahip olduğu ve bu rolün istatistiksel olarak anlamlı olduğu ortaya konmuştur. Araştırma bulguları, ilgili literatürde yer alan kavramsal çerçeveyi destekler niteliktedir."
