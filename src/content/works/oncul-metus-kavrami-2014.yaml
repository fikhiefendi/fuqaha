abstract: "“Metus Kavramı ve Kurumlarının İncelenmesi”isimli bu Doktora tez çalışması, Giriş ve Sonuç dışında beş bölümden oluşmuştur. Bu çalışma Roma Hukukunda metus (Tehdit / Korkutma) kavramı ve bununla ilgili düzenlemeleri günümüze olan yansımasıyla birlikte incelemektedir. Birinci Bölümde, metus kavramının incelenmesi, konu ile ilgili terminolojinin oluşturulması ve praetorların hukuk yaratım faaliyetleri incelenmektedir. Bu başlık altında metus örneğinde olduğu gibi, ius civile'nin çözümsüz kaldığı durumlarda praetorların hukuk yaratıcılığı sayesinde Roma Hukukunun adalet ve hakkaniyeti nasıl gerçekleştirdiğine dikkat çekilmektedir. İkinci Bölümde, metus'un belgelere yansıması, bir diğer deyişle, Institutiones ve Digesta'da metus ve metus ile ilgili kavramların yer aldığı Latince metinlerin incelenmesi söz konusudur. Üçüncü Bölümde, bir sözleşmenin metus etkisi altında kurulduğunu kabul edebilmek için varolması gereken şartlar (unsurlar) incelenmektedir. Dördüncü Bölümde, metus halinde tanınan koruyucu vasıtalar incelenmektedir. Koruma vasıtaları olarak; actio, exceptio ve in integrum restitutio'lar ele alınmaktadır. Nihayet, beşinci Bölümde, mukayeseli hukukta metus'un ele alınışı incelenerek Roma Hukukunun etkileri gösterilmeye çalışılmıştır. Bu kapsamda mecelle'den müşterek hukuka, modern avrupa hukuklarından, belli başlı uzak doğu ülkelerindeki hukuk sistemlerine kadar metus konusunun düzenlenişi vasıtasıyla Roma hukukunun etkileri gösterilmeye çalışılmıştır."
