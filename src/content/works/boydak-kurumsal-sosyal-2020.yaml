abstract: "Günümüzde bireyler ürün ve hizmet satın alma tercihlerinde sadece bireysel faydaya değil toplumsal faydaya da dikkat etme eğilimindedirler. Değişen dünya ve tüketim alışkanlıklarıyla birlikte tüketiciler ürünü ve hizmetin kendisinden ziyade sağladığı değerleri de satın almaktadır. Bu sebeple tüketiciye sadece kaliteli ürün ve hizmet sunmak değil aynı zamanda değer yaratmak da önemli hale gelmiştir. Bunun yanı sıra çeşitli stratejilerle ya da yollarla farklılık yaratmak da rekabet avantajı sağlamak için zorunluluk haline gelmeye başlamıştır. İşletmelerin faaliyetlerini kurumsal sosyal sorumluluk bilinciyle yürütmesi farklılaşmak için önemli bir ölçüt haline gelmektedir. Bu çalışmanın amacı, geleneksel bankalar ile katılım bankalarının tercih edilmesinde kurumsal sosyal sorumluluk projelerinin etkisini incelemek, kurumsal sosyal sorumluluk algılarını karşılaştırarak anlamlı sonuçlar elde etmektir. Bu alandaki literatür çalışmaları incelendiğinde katılım bankası ve mevduat bankası karşılaştırması yapılmamış olduğu görülmektedir. Dört bölümden oluşan çalışmada, birinci bölümde kurumsal sosyal sorumluluk detaylı bir şekilde ortaya koyulmuştur. İkinci bölümde ise müşterilerin banka tercihlerini etkileyen faktörler incelenmiştir. Üçüncü bölümde Türk Ekonomi Bankası ve Kuveyt Türk Katılım Bankası hakkında genel bilgiler verilmiş olup, yapmış oldukları sosyal sorumluluk faaliyetlerine yer verilmiştir. Dördüncü bölümde ise anketörler İstanbul ili Bakırköy, Fatih, Kadıköy, Pendik ilçelerindeki Kuveyt Türk ve TEB banka şubelerine giderek yüz yüze anket tekniği ile banka müşterilerine anket uygulamışlardır. Ankete 451 banka müşterisi katılmıştır. Araştırmada elde edilen verilerin analizleri IBM SPSS 23.0 yazılımı aracılığıyla yürütülmüştür. Sonuç bölümünde analizler değerlendirilerek, bankalara öneriler sunulmuştur."
