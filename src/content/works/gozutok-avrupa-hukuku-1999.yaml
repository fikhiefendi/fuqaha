abstract: "Erkekle kadının meşru evlilikte kurduğu yuvaya Arapça'da“ El-Usratu”Türkçe de ise“ Aile ”denir. Batı dilinde Latince“Familia”dan alınmış kelimeler aynı kavramı ifade Eder. İslam fıkhında aile ile ilgili esas ve hükümler“ nikah – talak ”,“münakehat – mufarakat”veya“el-Ahvalüşşahsiye”gibi başlıklar altında incelenir. Aile ismini verdiğimiz sosyal kurum, tarih boyunca gelişme değişmeler geçirmiş, totem vasıtasıyla birbirine bağlanan binlerce üyeli aileler zamanımızda karı, koca ve küçük çocuklardan ibaret olarak çekirdek kadar küçülmüştür. Tarihte birçok kültürde aile, erkeğin egemenliğinde (ataerkil) olmuştur. Erkeğin egemenliğindeki ailenin belki de en çarpıcı örneği Eski Ahitte sözü edilen ve klanların başı olan erkeklerin hem birçok eş, hem de birçok cariye alabildikleri aile tanımıdır. Roma çağında da aile ataerkil idi. Sanayi devriminde sonra modern aile ortaya çıkmıştır. Tek ebeveynli ailelerin sayısında hızlı bir artış görülmektedir. Avrupalı Modern aile bugün üretici olmaktan çok tüketici bir birimdir ve aile bireyleri kendi evlerinden çok dışarıda çalışmaktadır.AİLE HUKUKU: Aile Hukuku; genel olarak ailenin örgütlenmesine ilişkin kanunlar ve yazılı kurallar topluluğu olarak tanımlanabilir. Modern çağlara gelene kadar evlilikte genel kural, gelinin babasına olan bağımlılığının damada verilmesiydi. İngiliz Medeni Kanunu'nun öngördüğü gibi, kadın genellikle evlilikte her türlü yasal kimliğini kaybeder. İslam Hukukunda ise, kadınlar kişisel malları üzerinde önemli ölçüde denetim hakkına sahiptir. İSLAM HUKUKUNDA AİLE KAVRAMI: Aile meşru nikah temeline dayanır, nikah Müessesesi bütün semavi dinlerde korunmuş ve evlilikle ilgili bir takım prensipler konulmuştur, cinsi tatmin gaye değil, vasıtadır, evliliğin gayesi aileye mutluluk, topluma da iyi bir nesil sağlamaktır. Evlilik şenlikle ilan edilir. Evlilik karşılıklı haklar ve vazifeler getirir. İyi geçinmek hedef, boşanma son çaredir. Prensip olarak tek kadınla evlenilir. Evlilik dışı ilişki kesin olarak yasaktır. AVRUPA HUKUKANDA AİLE KAVRAMI: 1. Grup Aile; \"Geleneksel Aile Modeline çok yakındır. Cinsel yaşamın evlilikle başladığına inanır ve evliliği ilke olarak bir daha bozulmayacak bir birlik olarak algılar. 2.Grup Aile; Ortak yaşamın evlikli öncesinde başlayabileceğini kabul eder. Çocuk yapmaktan kaçınır. 3.Grup Aile; Evliliğe karşı duranlar 4.Grup Aile; ise tek ebeveynli ailedir"
