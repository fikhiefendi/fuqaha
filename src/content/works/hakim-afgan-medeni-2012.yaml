abstract: "Toplumun temel taşını teşkil eden aile müessesesine İslam dini çok önem vermiştir. Müslümanların sahih nikâh akdiyle aile kurmaları değişik ayet ve hadislerle teşvik edildiği görülmektedir. Bu şekilde hayatlarını birleştiren karı-koca, bir takım hak ve mükellefiyetler üstlenmektedirler. Bunların bir kısmı sadakat, saygı, iyi davranmak vs. gibi karşılıklı hak ve sorumluluklar iken diğer bir kısmı da mali külfeti olan ve erkeğin hanımı için yerine getirmesi gereken sorumluluklardır. Biz bu çalışmamızda AMK'nun Âsâr-ı İzdivac başlığı altında ele alınan ve evlilik akdiyle beraber kocanın karısına karşı sorumlu olduğu mehir, mesken ve nafaka hakkını inceledik. Çalışmamız giriş, iki bölüm ve sonuçtan meydana gelmektedir. Birinci bölümde AMK'nun (98-114) maddeleri göz önüne alınarak kadının mehir hakkı teferruatlı bir şekilde ele alınmıştır. İkinci bölümde ise yine sözünü ettiğimiz kanunun (115-130) maddeleri doğrultusunda kadının mesken ve nafaka hakları incelenmiştir.1977 yılından bu yana yürürlükte olan Afgan Medenî Kanunun hazırlanmasında genel manada Hanefi mezhebinin görüşü esas alınmıştır. Dolaysıyla Âsâr-ı İzdivac başlığı altında ele alınan maddelerin hükümleri de genel manada bu mezhebin görüşüne uygun bir şekilde yapılmıştır. Ancak bazı durumlarda bu mezhebin görüşünün yanında diğer Sünnî mezheplerin görüşlerinden de faydalandığı görülmektedir. Ayrıca Afgan Medenî Kanunu'nda Şiîlere has herhangi bir hüküm bulunmamaktadır."
