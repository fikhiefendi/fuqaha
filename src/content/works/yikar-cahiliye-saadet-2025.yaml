abstract: "Ribâ meselesi, tarih boyunca hemen her medeniyetin ve dinî sistemin gündeminde yer edinmiş, kuşaktan kuşağa tartışılan temel iktisadi ve ahlâkî sorunlardan biri olmuştur. Günümüzde ise, gerek modern bankacılık sisteminin ortaya çıkışı gerekse küresel iktisadi dönüşümler sebebiyle faiz tartışmaları farklı bir boyuta evrilmiştir. Özellikle İslâmî ilimler sahasında faiz yasağına dair yapılan ilmî çalışmalar, faizin mahiyetini, kapsamını, meşruiyetini ve yasaklanma gerekçesini birçok yönüyle ele alarak İslam ekonomisinin temel ilkeleri bağlamında değerlendirmeye tabi tutmuştur. Câhiliye döneminde uygulanan ribânın borçlu üzerinde baskı kurmak, borcu ertelemek suretiyle fazlalık talep etmek gibi uygulamalara dayandığı görülmektedir. Söz konusu işlem Kur'ân-ı Kerîm'de ağır şekilde kınanan sömürü düzeninin temel unsurlarından biri olarak karşımıza çıkmaktadır. Ancak günümüzde, hem ribânın illetine dair farklı anlayışlar hem de naslardaki ifadelerin yorumuna dayalı olarak ribânın kapsamını daraltan veya ribâ oranına göre hüküm tayin eden yaklaşımlar ortaya çıkmıştır. Bunun yanında, hangi ürünlerin ribevî sayılacağı, ribânin gerçekleşme şartları ve yasağın kıyasla başka alanlara teşmil edilip edilemeyeceği gibi konular da tartışma sahası olmaya devam etmektedir. Bu bağlamda çalışmamız, ribâ meselesinin asli bağlamını teşkil eden ilk dönem uygulamalarına, özellikle de câhiliye dönemi Arap toplumunda yaygın olan ribâ anlayışına, yasaklanan uygulamaların mahiyetine ve yasağın tedricen nasıl tatbik edildiğine odaklanmaktadır. Akabinde ribâ yasağının nüzûl sürecinde Hz. Peygamber'in (a.s) uygulamaları ve özellikle sahâbe döneminde ortaya çıkan içtihat farklılıkları detaylı biçimde ele alınmaktadır. Sahâbe arasında cereyan eden ribâ tartışmaları hem yasağın kapsamı hem de uygulama sahası açısından büyük önem arz etmektedir. Bu yönüyle çalışma, ribâ yasağının mahiyetini tarihî bir süreklilik içinde ele almakta; câhiliye ribâsı, nübüvvet dönemindeki düzenlemeler ve sahâbe uygulamaları arasındaki irtibatı ortaya koyarak, günümüz faiz tartışmalarına ışık tutmayı hedeflemektedir."
