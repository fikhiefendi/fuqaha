abstract: "İctihadın temel amacı şer'i hükme ulaşmaktır. Müctehid şer'i hükmü elde ederken İslâm hukuk metodolojisinde geçerli olan delillere dayanmak zorundadır. Bu delillerden bir kısmında görüş birliği varken bazılarının delil olması konusunda görüş ayrılığı bulunmaktadır. Çalışmamızın konusu olan“fiillerin sonucunun i'tibâra alınması”konusu da delil olması noktasında görüş ayrılığının bulunduğu maslahat-ı mürseleyle irtibatlıdır. Bu çalışmada“fiillerin sonucunun dikkate alınması”prensibi, Şâtîbî esas alınarak incelenmiştir. Çalışmanın neticesinde bu ilkeninin Şâtîbî'nin usul anlayışında önemli bir yerinin olduğu görülmüştür. Zira ona göre İslâm hukuk usulünde yer alan İstihsan, sebeb, hikmet, maslahat gibi kavramlar bu ilke kapsamına girmektedirler. Diğer taraftan Kitab ve Sünnet'e yer alan birçok hükümde de bu ilkeye yer verilmiştir. Ayna zamanda vahyin indiği ortamda bulunan ve Hz. Peygamber'in ictihad öğretimindeki ilk talebeleri olan Sahabe uygulamalarında“fiillerin sonucunu dikkate alınması”prensibinin yeri olduğu tespit edilmiştir. Netice itibarıyla Şâtîbî'ye göre ictihad faaliyetinde bulunurken müctehid, mükelleflerin fiilleriyle ilgili bir konuda hüküm elde ederken, elde etmiş olduğu hükmün mükellefler için fayda veya zarar sağlayıp sağlamayacağına dikkat etmelidir."
