abstract: "İnsan kişiliğini güçlendiren faktörlerden biri, yüce bir amaca olan bağlılığıdır. Bu yüce dine olan bağlılığımız bizlerde bu din etrafında cereyan eden her şeyi araştırma isteği oluşturmuştur. Konuşabilen, öğrenebilen, öğretebilen bir şekilde muvaffak olmamızla birlikte Arap diline olan bağlılığımız da artmaktadır. Bilgin seleflerimiz bu başarıyı bilimsel ve hukuki alanlarda hissetmiş ve fukaha nezdinde bu başarı net bir şekilde görülmüştür. Bu fakihlerden özellikle Kasım b. Abdullah el-Konevî'nin (ö. 978/1571) fıkhi bölümlemeye uygun olan ve 36 kitaptan oluşan Enîsu'l-Fukahâ kitabı zikretmeye değerdir. Bu nedenle söz konusu eseri araştırma konusu olarak seçmeyi uygun bulduk. Yazarın fıkıh bab bölümleri ile beraber fıkıh terimlerini ortaya koyarak konulara başladığı görülmektedir. Fıkıh konuları çok ve çeşitlidir. Temizlik (Tahâret) konusuyla başlar miras hukuku (Feraiz) konusuyla son bulur. Bu iki konu arasında fıkhi terimsel manaların ele alınmasında ve bu terimlerin etimolojisi ile dilbilimsel açıdan sunulmasında farklı usluplar dikkati çekmektedir. Dil, fıkıh ilminin de içinde bulunduğu ilimler için bir araçtır ve orada dil ve fıkıh arasında bir ilişki söz konusudur. Çalışmada dil ve fıkıh arasındaki bu ilişki ortaya konulmaya çalışılmıştır. Bu ilişki“dilsel çabalar/çalışmalar”başlığı altında ele alınmıştır. Araştırma İmam el-Konevî'nin dilin birçok yönünü ele aldığı ve fukaha dilinde bir sözlük olarak nitelenmeyi hak eden Enîsu'l-Fukahâ adlı eseri üzerinde gerçekleştirilmiştir. el-Konevî genel olarak çalışmasını iki tarafa tevzi etmiştir. Biz de araştırmamızda“dil ve delalet”şeklinde ifade edilebilecek bu iki bölümü metodolojik yaklaşımlarla ele aldık. el- Konevî'nin bu kitapta ortaya koyduğu çabalarının tecelli ettiği farklı işleyişleri üzerinde dikkatlice durmaya çalıştık. el-Konevî ve eserini ele aldığımız çalışmamız iki bölüm ve bir girişten oluşmaktadır. İncelemenin“Dil Çalışmaları”başlığını taşıyan birinci bölümü, üç konu başlığı altında ele almaktadır. Birinci başlıkta el-Konevî'nin dilsel çabalarının kaynağı ve bunları ifade etme üslubu incelenmiştir. İkinci başlıkta el-Konevî'nin lafzın delaletinde م kullandığı dil şahitlerinden söz edilmiştir. Üçüncü başlıkta ise el-Konevî'nin manayı açıklamada kullandığı araçlar açıklanmıştır. İkinci bölümde \"lafzın manaya delaleti konusu üç başlık altında ele almaktadır. Birinci başlıkta terimin mahiyeti, sebepleri, etkenleri ve gelişim açısından delalet konusu ele alınmıştır. İkinci başlıkta Enîsu'l-Fukahâ adlı eserde var olan delaletin gelişiminin olgularından söz edilmiştir. Üçüncü bölümde ise dilsel olgular ve bu olgular karşısında el-Konevî'nin tutumu ele alınmıştır. Daha sonra önemli sonuçlar ve tavsiyelerin yer aldığı sonuç kısmı yer almıştır."
