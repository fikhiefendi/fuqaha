abstract: "Bu araştırmada çağdaş fakihlerden Muhammed Takî Osmânî'nin hayatını, ilmî şahsiyetini, eserlerini, fetvâ usûlü ile ilgili görüşlerini ve güncel furû-u fıkıhla ilgili görüşlerini ortaya koymaya çalıştık. Bu çalışma bir giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Çalışmada Muhammed Takî Osmânî'nin fetvâ usûlü ile ilgili görüşleri arasında fetvânın ehemmiyeti, selef zamanında fetvâ, fetvâ veren kişide bulunması gereken kurallar, kişinin bağlı bulunduğu mezhepten başka bir mezheple fetvâ vermesi, zamanın değişmesiyle hükümlerin değişmesi ve fetvâ vermenin hükmü gibi görüşler yer almaktadır. Ayrıca bu çalışmada Muhammed Takî Osmânî'nin furû-u fıkıhla ilgili görüşlerinden buyû' (alışveriş) fıkhı ve diğer bazı meselelerle ilgili görüşleri ele alınmıştır."
