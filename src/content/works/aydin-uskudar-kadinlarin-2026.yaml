abstract: "Vakıf, islâm tarihinde toplumun sosyal, ekonomik ve kültürel yapısını şekillendiren derin köklere sahip bir müessesedir. Bu kurum toplumların dini anlayışları, kültürel etkileşimleri ve sosyal ihtiyaçları doğrultusunda gelişmiş ve İslam medeniyetinde bireyin kamu yararına katkı sunmasının en etkili araçlarından biri haline gelmiştir. Osmanlı döneminde vakıf müessesesi, kadınların aktif biçimde yer aldığı bir alan olmuştur. Böylece hem maddi güçlerini hem de toplumsal rollerini vakıflar aracılığıyla görünür kılma imkânı bulmuşlardır. Bu çalışmada, Osmanlı döneminde Üsküdar'da kadınlar tarafından kurulan vakıflar kapsamlı bir şekilde ele alınarak mekânsal, toplumsal ve iktisadi bağlamda değerlendirilmiştir. Vakıf kurucuların toplumsal konumları, ekonomik tercihleri ve vakıf müessesinin işlevsel çeşitliliği, vakfiye senetleri ışığında incelenmiştir. Araştırma kapsamında 547 kadın vakfı tespit edilmiş olup bunların %79.14'ünün Şer'iyye sicilleri'ne, %20.86'sının ise Vakıflar Genel Müdürlüğü ve Başbakanlık Osmanlı Arşivi kayıtlarında yer aldığı tespit edilmiştir. Bu vakıflar arasında eğitim kurumları, dini yapılar, tarikatlar, su yapıları, ev avarızları ve çeşitli taşınmazların yer aldığı çok sayıda farklı amaçlara hizmet eden vakıflar bulunmaktadır. Çalışmada, Üsküdar'da kadınlar tarafından vakfedilen konutlar, dükkânlar, bağlar ve arsalar üzerinden dönemin konut mimarisi ve şehirleşme süreçlerine dair önemli veriler elde edilmiştir. Ayrıca yüzyıllar içerisinde değişen ekonomik koşullara paralel olarak kadınların gayrimenkul vakıflarından para vakıflarına doğru değişen eğilimleri ve bu vakıfların ekonomik dalgalanmalarla olan ilişkisi değerlendirilmiştir. Vakıfların sosyal ve dini boyutları kapsamında, kadınların eğitim kurumlarına ve dini yapılara sağladıkları destekler de çalışmanın odak noktalarından biridir. Özellikle Aziz Mahmud Hüdayi gibi dergâhlar ile kurulan ilişkiler, kadınların manevi yönelimlerini ve tasavvufi çevrelerle olan bağlarını gözler önüne sermektedir. Sonuç olarak bu araştırma, Üsküdar kadınlarının özel yaşam alanlarının dışında vakıf faaliyetleri aracılığıyla toplum içerisinde görünür olduğu, etkin, üretken birer aktör olduklarını ve şehir yaşantısında sosyal dayanışma ve hayırsever kimlikleriyle ekonomik hayata bireysel ve kolektif düzeyde katkılar sunduklarını ortaya koymaktadır. Vakıf belgeleri, kadınların dönemin ekonomik koşullarına duyarlılığını, toplumsal sorumluluk bilinciyle hareket etme iradelerini ve dini, sosyal kurumlarla kurdukları çok yönlü ilişkileri gözler önüne sermektedir. Böylece kadın tarihi ile Osmanlı vakıf literatürüne katkı sağlamak amaçlanmaktadır."
