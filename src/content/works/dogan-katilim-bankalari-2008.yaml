abstract: "Günümüzde sadece İslâm ülkelerinde değil, tüm dünya ülkelerinde hızla yaygınlaşan faizsiz bankalar, diğer geleneksel bankaların yaptıkları işlemleri, faiz alıp-vermeden yerine getiren kurumlardır.Türkiye'de katılım bankaları, 1985 yılından bu yana, faizsiz bankacılık sistemi çerçevesinde fon kabul etme ve kullandırma yetkisine sahip kurumlar olarak ortaya çıkmışlardır Türkiye'de katılım bankaları, bankacılık sisteminde verimliliğin artırılması olmak üzere, kaynak transferinin sağlanması, atıl fonların ekonomiye kazandırılması gibi, unsurların etkisiyle ekonomiye olumlu katkı sağlamaktadırlar.Ayrıca, Türkiye'de yaşanan finansal kriz dönemlerinde, krizin olumsuz etkilerini en az hasarla atlatan katılım bankaları, kendi iç dinamikleriyle devlete hiçbir maliyet yüklemeden çıkmışlardır."
