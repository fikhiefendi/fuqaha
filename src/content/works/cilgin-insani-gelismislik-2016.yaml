abstract: "İnsani Gelişmişlik Endeksi (İGE), Yaşam Beklentisi, Yetişkin Okur-Yazarlığı ve Okullaşma ile Kişi Başına Düşen Gayrisafi Yurtiçi Hasıla olan dört ana göstergeye bağlı olarak ülkelerin milli refah düzeylerini ölçmektedir. Fakat insani gelişmişlik, şu an İGE'nde yansıtılandan çok daha geniş ve boyutlu bir kavramdır. Buna istinaden endeksin, toplumsal gelişmişliğin daha fazla boyutunu hesaba dâhil etmesi için teorisi ve hesaplanmasında bir gözden geçirmeye ihtiyaç vardır. Bunu gerçekleştirmek için, ülkelerin insani gelişmişliğinin önemli bir belirleyicisi olan işsizlik oranı, orijinal İGE modeline eklenmiştir. Tavsiye edilen endeks,“İşsizliğe göre ayarlanmış İGE”olarak adlandırılmış ve İGE-2 ile gösterilmiştir. Bu çalışmada, İGE-2, 1998 ve 2007 arasındaki yıllar için 30 OECD ülkesi için hesaplanmıştır. Ülkeler, İGE ve İGE-2 verilerine bağlı olarak“Kümeleme Analizi”yöntemi ile sınıflandırılmıştır. Bunun akabinde, ülkelerin verimlilik değerlerinin hesaplanmasında, hem İGE modeli, hem de İGE-2 modeli üzerinde“Veri Zarflama Analizi (VZA)”uygulanmıştır. Sonuçlar, işsizlik oranının İGE'ne yeni bir gösterge olarak eklenmesinin endeksi daha kapsamlı hale getirme potansiyeli ve ülkelerin kalkınma performanslarını değerlendirmede uygun bir yaklaşım olduğunu göstermektedir. Önerilen endeks İGE'nin alternatif veya tamamlayıcısı olarak düşünülebilir. Çıkan sonuçlar için gerekli öneriler yapılmıştır."
