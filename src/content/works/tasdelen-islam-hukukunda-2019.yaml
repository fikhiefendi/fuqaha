abstract: "Bu çalışmada bireyin kendi bedeni üzerindeki tasarruf yetkisi ele alınmıştır. İslâm'da genel anlamda kişi emir ve yasaklara muhataptır. Emir ve yasaklar dışında bir şeyi yapıp yapmama tavsiye niteliği taşır. Bu temel hususlar dikkate alınarak konu ele alınmıştır. Kişi kendi bedeni üzerinde neleri yapmakla yükümlüdür, nelerden sakınmalıdır ve tavsiye olarak nelere dikkat etmelidir? Kişinin bedeni üzerindeki tasarrufunu İslâm'ın istediği şekilde yürütmesinde ne gibi hikmetler olabilir? Soruları bağlamında konu işlenmiştir. Bu tezin ana temasına geçmeden önce insanın bedeni üzerindeki tasarrufları bağlamında İslâm-hümanizm karşılaştırması yapılmıştır. Hak ve özgürlükler üzerinden bireyi ele almada hümanizm ile İslâm'ın temel farklara sahip olduğu görülmüştür. Kişinin bedenini bizatihi sahiplenmesinin sakıncalarına değinilmiş, aksi halde her yönüyle kendisine sahip çıkan bireyin dışa doğru her şeye sahip çıkmasının kaçınılmaz olduğu, böylece kişinin örtük bir tanrılaşma tehlikesine gideceği belirtilmiştir. Diğer taraftan kişinin kendisini Allah'ın emaneti olarak görmesi, merkezden dışa doğru her şeyi O'na (c.c.) vermesi ve netice itibariyle her şeyin sahibinin O (c.c.) olduğu inancının kendisinde pekişeceğinin önemine dikkat çekilmiştir. Aslında İslâm'ın, bedeni insana ait görmemesinin temel nedeninin insanın Yaratıcısına karşı kulluk vazifelerini ihmal etmemesi ve O'nu Rab (c.c.) olarak bilmesi temel düşüncesine dayanmaktadır. Tezin ana konuları iki başlık üzerinde incelenmiştir. Bu incelemeler temel klasik eserler üzerinden olduğu gibi yakın dönem ve günümüz çağdaş İslâm hukukçularının nazarları üzerinden de yapılmıştır. Kişinin Maddi Şahsiyetiyle İlgili Tasarrufları bölümünde; Organ-Doku Nakli, Dövme, Estetik Ameliyatlar, Kürtaj, Cinsiyet Değiştirme, İntihar, Ötanazi; Kişinin Manevi Şahsiyetiyle İlgili Tasarrufları bölümünde; Madde Bağımlılığı (Şarap/Alkol, Uyuşturucu Madde, Sigara), Domuz Eti, Zina, İstimnâ, Yalan, Gıybet, Altın-Gümüş Kullanmak, İpekli Elbise Giymek, Namaz, Oruç, Hac, Sıdk/Doğruluk, Tesettür, Temizlik (Öz Bakım) konuları işlenmiş; konuların ittifak edilen hususları verilmekle beraber konular üzerinde mezhepler arasındaki farklara temas edilmiş ve bazı İslâm düşünürlerinin farklı görüşleri de aktarılmıştır."
