abstract: "'Paradan para kazanma' ilkesine karşı 'riski ve kazancı paylaşma' esasına dayalı olarak ortaya çıkan Katılım Bankacılığı, toplumsal duyarlılığın finansal yansıması olarak karşımıza çıkmaktadır. Sektördeki payını günden güne artıran katılım bankalarının, makroekonomik faktörlerde meydana gelen değişimlerden nasıl etkilendiğinin anlaşılması, söz konusu bankaların risk yönetimi ve finansal istikrarı açısından oldukça önemlidir. Bu bağlamda, bu çalışmada Ocak 2010- Nisan 2024 dönemine ilişkin veriler kullanılarak katılım bankaları ve ticari bankaların, makroekonomik ve bankaya özgü değişkenlerden ne ölçüde etkilendiğinin belirlenmesi amaçlanmıştır. Farklı ekonomik konjonktürlerin etkisini elde etmek amacıyla Markov Rejim Değişim Modelinden yararlanılmıştır. Çalışmada bağımlı değişken olarak aktife göre getiri (ROA), öz kaynağa göre getiri (ROE) ve net faiz marjı (NIM) değişkenleri kullanılmıştır. Bankaya özgü değişkenler olarak finansal durum oranı (FD), takibe dönüşüm oranı (TD), sermaye yeterlilik oranı(SY), faiz dışı gelirlerin faiz dışı giderleri karşılama oranı (FDGG), faiz dışı gelirlerin toplam aktifler içindeki oranı (FDGE), aktif kalitesi oranı (AK) ve toplam personel sayısının toplam şube sayısına oranı (PERSONEL) değişkenleri dikkate alınmıştır. Makroekonomik faktörler olarak ise Türkiye ile ABD arasındaki faiz oranı farkı (INTDIFF), enflasyon oranı farkı (INFDIFF), Türkiye'ye ilişkin sanayi üretim endeksi (IPI), TÜFE bazlı reel efektif döviz kuru endeksi (REER) ve ABD ekonomik politika belirsizlik endeksi (EPU) değişkenleri ele alınmıştır. Elde edilen sonuçlara göre daralma dönemleri için, her iki bankacılık türünün aktif karlılığını, FDGG ve FDGE, özsermaye karlılığını FDGG, FDGE, SY, INFDIFF, net faiz marjını ise SY ve INFDIFF pozitif yönde etkilemektedir. Genişleme dönemleri için bakıldığında her iki bankacılık türünün aktif karlılığını SY, FDGE, INFDIFF, özsermaye karlılığını, SY, FDGE, REER, INFDIFF, net faiz marjını ise SY, INTDIFF, INFDIFF pozitif yönde etkilemektedir."
