abstract: "Bu çalışma Malezya'daki İslamî otoritelerin Tasavvufi konulara yaklaşımını, ulusal fetva komitesi ve eyalet düzeyindeki fetva komiteleri tarafından yayınlanan fetvalar aracılığıyla incelemeyi amaçlamaktadır. Bu çalışmada aynı zamanda fetva uygulamalarının bir standarda sahip olamamasının ve fetvaların birbiriyle çelişmesinin nedenleri de ele alınmaktadır. Sufilerin akaid ve uygulamalarına ilişkin fetvalar; vahdet-i vücud, nûr-ı Muhammedî, semâ, rabıta, halvet, yakaza, teberrük, ve istiğase gibi konular ışığında bu çalışma dahilinde ayrıntılı olarak tartışılmaktadır. Malezya'da yayınlanan fetvalardan etkilenen bazı tarikatlar hakkında da detaylı bilgi verilmiştir. Bu çalışmada, seçilmiş fetvalar Malay alimlerin görüşleri ve fetva otoritelerinin kararları ışığında incelenerek ve açıklanarak analitik yöntem kullanılmıştır."
