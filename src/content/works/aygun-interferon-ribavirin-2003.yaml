title: "İnterferon+ribavirin Tedavisinde Virolojik Yanıtsız Kronik Hepatit C Hastalarında Genotip 1b Virüs Genomunun İnterferona Hassasiyeti Belirleyici (ISDR) Dizisinde Mutasyonların Belirlenmesi"
