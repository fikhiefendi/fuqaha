abstract: "1. ÖZET“İnterferon+Ribavirin tedavisine virolojik yanıtsız kronik hepatit C hastalarında, genotiplb virüs genomunun interferona hassasiyeti belirleyici (ISDR) dizisinde mutasyonların belirlenmesi”Dünyada 170 milyon insanı etkileyen Hepatit C Virüs (HCV) enfeksiyonu; %50 -85 kronikleşmeye, bunların % 20' sinde siroz gelişimine ve her yıl 3.5-10 milyon sirozluda karaciğer kanseri görülme riskine yolaçar. AntiHCV pozitifliği, dünyada ortalama % 3, Türkiye'de farklı kaynaklara göre % 0.3-4* tür. Ayrıca Türkiye'de kronik karaciğer hastalıklarında, HCV prevalansı % 13-27'dir. Kronik HCV enfeksiyonunda uygulunan tedavilerin başansızlığındaki etkili mekanizmaların saptanması ve hastalığın etkin tedavi protokollerinin geliştirilmesi gerekmektedir. Uluslararası kronik HCV tedavisi için IFN+Ribavirin kullanımında basan ile ilgili olarak,“çift iplikli RNA'nın aktive ettiği protein kinaz”(double stranded RNA activated protein kinase, PKR) bağlanma alanının etkinliği yayınlandı. HCV'nin non-structural 5 A (NS5A) geninden kodlanan ve PKR-bağlanma alanını kapsayan NS5A proteini, PKR enzimine bağlanarak dimerize olmasına engel olmakta ve hücre ölümünü önlemektedir. Bu durumda virüs üremesine devam etmektedir. NS5A-PKR bağlanma alanında saptanan bazı mutasyonların, in vivo mayada PKR enzimine bağlanmayı önleyerek hücrelerin ölmesine neden olduğu ve virüsün üremesini engellediği gösterildi. Dokuz Eylül Üniversitesi hastanesinde IFN+Ribavirin tedavisi alan, HCV genotiplb üç tam yanıtlı (TYL), beş biyokimyasal yanıtlı (BYL), 1 1 tam yanıtsız (TYS) hastaya ait serum örnekleri çalışıldı. Her bir serumdan proteinaz K yöntemiyle RNA izolasyonu, RT-PCR ile cDNA eldesi ve bu ürünlerden nested PCR ile HCV-NS5A (PKR bağlanma alanını kodlayan bölge) geni amplifiye edilerek DNA dizisi belirlendi. Sonuçta; 86 aminoasit değişiminin 14 (% 16)'ü PKR-bağlanma alanının kapsadığı ISDR bölgesinde, 72 (% 84) 'si bu bölgenin karboksi terminal alanında saptandı. ISDRnin 14 aminoasit değişiminin 12 (% 86) vsi BYL grubunda belirlendi. BYL hasta grubunda ISDR aminoasit değişimi sayısı, TYS hasta grubuna göre istatistiksel olarak anlamlı ölçüde fazla bulundu (p=0.012). Bu araştırma; genotip lb kronik HCV hastalarının IFN+Ribavirin tedavisinde, biyokimyasal yanıt açısından ISDR aminoasit değişimlerinin, önemli bir prediktör faktör olduğunu göstermektedir."
