abstract: "Çalışmamızda Cemaleddin Kâsimî`nin, geniş tartışmalara yol açan; Kur'an'ı Kerim'de kadınlarla ilgili ayetlere ilişkin bakış açısını ortaya koymayı hedeflemekteyiz. İlk bölümde; Kâsimî'nin ilmi, fikri şahsiyeti ve itikadi yapısının yanı sıra hayatı, yaşadığı çağın üzerindeki etkilerine ışık tutmak suretiyle onun kadınlar hakkındaki değerlendirmelerini ve çağındaki kadın algısından yola çıkarak bu konudaki konumunu irdeledik. Buna bağlı olarak Kâsimî'nin kadınlara ilişkin ayetleri anlamasını etkileyen hususları, hocalarının ve talebelerinin onun düşüncesi üzerindeki etkileri ortaya konmuştur. Özellikle kadınlarla ilgili meseleler fıkhın alanına da girdiği için, onun fıkhi mezhebini de açıkladık. İkinci bölümü Kâsimî'nin kadınlar ile ilgili ayetlere ilişkin, nikah, boşanma (talak), miras ve son olarak da tesettür ile ilgili görüş ve fikirlerine ayırdık. Nikah konusunda erken evlilik, evlilik yaşı, çok evlilik ve muta nikahı ele alınarak Kâsimî'nin erken yaşta evliliğe ve erkeklerin kendisinden büyük kadınlarla evlenme fikrine karşı olduğu, iffetli oldukları müddetçe tek evliliği tercih etmeleri gerektiği, muta nikahının çok zorunlu hallerde caiz olduğu görüşünü benimsediği anlaşılmıştır. Boşanma konusunu üç başlık altında ele aldık. İlki boşanmanın sınırlanması, öfke durumda, kadınların adet ve nifas döneminde, sarhoş iken, şaka ile boşama, baskı altında boşama, askıya alınan boşama, şahitsiz boşanmanın geçerli olmaması, Üç talak ile birlikte tek bir talak sayılması. İkinci başlıkta talak hakkının sınırlanması, yani boşanmanın hakim veya iki hakemin kararı ile gerçekleşmesi ve boşanma hakkının kadına geçmesi meselesi ele alınmıştır. Üçüncü başlıkta ise boşanmış veya ölü kadının meskeni ve nafakası konuları incelenmiştir. Bu konuda Kâsimî'nin dikkat çeken bir tercihi bulunmaktadır. O da onun eşi ölen kadının, bilinenin aksine, bir yıl konut hakkına sahip olduğu görüşünü benimsemesidir. Çalışmamızın miras bölümünde Kâsimî'nin tefsirinden nakillerde bulunarak, mirasta erkek ile kadının pay hakkının farklılığı meselesi tartışılmıştır. Çalışmamızın son kısmını oluşturan tesettür konusunda Kâsimî harama sebebiyet vermedikçe, kadının yüzü ve ellerinin mahrem sayılmadığı, görüşünü tercih etmektedir. Ayrıca o, örf ve adetlere bağlı olarak örtünme konusunda oluşan yanlış algıları, kadınların haklarından mahrum edilmelerini, onlara hukuki haklarının verilmemesini, seyahat ve eğitimlerinin kısıtlanmasını şiddetle eleştirmektedir."
