abstract: "Bu araştırma,“ihtiyaçlar genel olsun özel olsun zaruret menzilesine tenzil olunur”kaidesini ve bunun güncel sorunlar üzerindeki etkilerini incelemektedir. Bununla beraber çalışmada bu kaidenin açıklığa kavuşturulması amaçlanmaktadır; bu nedenle kavramın manası ve şartları belirtilmiş, ihtiyaç (el-hace) ve zorunluluk (ez-zarûra) kavramları dilsel ve teknik olarak tanımlanmış, aralarındaki benzerlikler ve farklılıklar açıklanmıştır. Aynı zamanda bu kaidenin mutlak olmadığı, aksine meydana gelen yeni meselelerde uygulanabilmesi için belirlenmiş ilkelerinin mevcut olması gerektiği vurgulanmıştır. Bu mekanizmalar mevcutsa, zaman, yer ve insanlar için uygun çözümlere ulaşmak mümkün olacaktır. Bu kaidenin önemi, diğer kaideler arasındaki konumunda ve güncel meselelerin fıkhî hükümlerinde yaptığı etkiden kaynaklanmaktadır. Araştırmanın problemi, güncel malî işlemlerde (muâmelât) yeni sorunların çokluğundan ortaya çıkmıştır. Bu durum, söz konusu güncel meselelere ışık tutarak araştırmayı, ayrıca kaidenin uygulanmasının bu meselelerle ilgili hükümler üzerindeki etkisini incelemeyi gerektirmektedir. Kaide ve onun delilleri konusunun analiz edilip kullanılış biçiminde, güncel mali işlemlere olası etkisi ve bunun uygulanmasına yönelik ilkelerin araştırılmasında betimleyici analitik yöntem kullanılmıştır. Bu yöntemle aynı zamanda, kaideyle ilgili iki zıt görüş sahibi fakihlerin görüşleri, bununla ilgili ileri sürdükleri deliller, aralarındaki farklılıklar ve tartışmalar klasik kaynaklardan elde edilen bilgilerle birlikte sunulmuştur. Çalışma, muteber ve şerî şartlarının varlığıyla beraber ihtiyaç (el-hace) ve zorunluluğun (ez-zarura), sübut ve delalet yönünden zannî olan metinler içeren bazı güncel malî işlemlerdeki hükmü değiştirebileceği sonucuna varmıştır. Buna karma şirketlerin hisselerinde, zekât fonlarının yatırım araçlarında kullanılmasında ve teavün sigortasında (tekafül) örnek olarak verilebilir. Ancak faizden elde edilmiş parayla ev satın alma veya rehin gibi diğer bazı malî işlemlerde ise ihtiyaç ve zorunluluk muteber olmadığı için fıkhî hükmü etkilemedikleri görülmektedir. Araştırma, bu tür konular için de fıkıh kurullarının bu konularda alternatif çözümler üretmeleri ve şüphelerden olabildiğince uzak durulması görüşünün daha uygun olacağı sonucuna varmıştır."
