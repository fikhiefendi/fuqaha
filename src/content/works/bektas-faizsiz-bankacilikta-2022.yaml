abstract: "Tez çalışmasında Türkiye'de faaliyet gösteren katılım bankalarının performansları, konvansiyonel bankalarla mukayeseli olarak analiz edilmiştir. 2005-2020 dönemi için on sekizi konvansiyonel, üç tanesi katılım bankası olmak üzere toplam yirmi bir banka için Veri Zarflama Analizi ve Malmquist Toplam Faktör Verimliliği endeksi yardımıyla bankaların teknik etkinlik ve toplam faktör verimlilik skorları hesaplanmıştır. İlgili dönemde Veri Zarflama analizinden elde edilen yıllık ortalama değerler gerek katılım bankalarının gerekse konvansiyonel bankaların etkin olmadıklarını göstermektedir. Buna karşın bir bütün olarak katılım bankacılığı ve konvansiyonel bankacılık sektörlerinin etkinsiz olduğu ancak katılım bankacılığı sektörünün etkinliği yakalama seviyesinin (Catch-Up effect) konvansiyonel bankacılık sektörüne göre daha yüksek olduğu belirlenmiştir. Malmquist Toplam Faktör Verimliliği Endeksine ait ortalama değerler ise, her iki banka grubu için etkinlikte, teknolojide, ölçek etkinliğinde ve toplam faktör verimliliğinde ilerlemeye işaret etmektedir. Ayrıca katılım bankalarının teknik etkinliklerini etkileyen faktörlerin ortaya konması adına uygulanan dinamik panel veri analizi sonuçlarına göre katılım bankalarının teknik etkinliklerini, öz kaynak kârlılığı, toplam kredilerin toplam aktiflere oranı ve likit aktiflerin toplam aktiflere oranının pozitif, sermaye yeterliliği oranının ise negatif etkilediği tespit edilmiştir. Modelin teknik etkinlik üzerindeki etkileri ve etki düzeylerinin katılım ve konvansiyonel bankalar açısından farklılık gösterip göstermediğinin belirlenmesi amacı doğrultusunda tanımlanan kukla değişkenin, Öz kaynak kârlılığı ve sermaye yeterliliği oranı ile etkileşimlerini gösteren etkileşim kuklalarının parametre tahminlerine bakıldığında, öz kaynak kârlılığının katılım bankalarının teknik etkinliklerini, konvansiyonel bankalara göre pozitif yönde ve daha fazla, sermaye yeterliliği oranının katılım bankalarının teknik etkenliklerini, konvansiyonel bankalara göre negatif ve daha fazla etkilediği sonucuna ulaşılmıştır."
