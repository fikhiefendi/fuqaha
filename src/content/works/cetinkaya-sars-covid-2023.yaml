abstract: "Doktora tez çalışması kapsamında antiviral ilaçlardan ribavirin (RIB), molnupiravir (MOL), umifenovir (UMI) ve kamostat mesilat (KAM)'ın seçici ve hassas analizine yönelik moleküler baskılı polimer (MIP) temelli sensörler geliştirilmiştir. Geliştirilen sensörlerin elektrokimyasal ve yüzey karakterizasyonları dönüşümlü voltametri (DV), elektrokimyasal impedans spektroskopisi (EIS), taramalı elektron mikroskopisi (SEM), Fourier dönüşümlü kızılötesi spektroskopisi (FTIR), atomik kuvvet mikroskopisi (AFM) ve temas açısı yöntemleri kullanılarak değerlendirilmiştir. RIB tespiti için ilk kez elektropolimerizasyon (EP) ve fotopolimerizasyon (FP) tekniklerinde sırasıyla pirol-para aminofenil boronik asit (Py-p-AFBA) ve urasil metakrilat (UraM) gibi farklı fonksiyonel monomerler kullanılarak MIP temelli elektrokimyasal sensörler geliştirilmiştir. Poli(Py-co-p-APBA)/RIB@MIP/CKE ve UraM/RIB@MIP/CKE sensörlerin analitik performansları diferansiyel puls voltametrisi (DPV) kullanılarak değerlendirilmiştir. Geliştirilen sensörler, RIB'a karşı yüksek baskı faktörü (IF) ile mükemmel bir seçiciliğe sahiptir. MOL'ün elektrokimyasal analizi için EP ve FP yöntemlerinde monomer olarak sırasıyla pirol-3-tiyonil boronik asit (Py-3-TBA) ve guanin metakrilat (GuaM) kullanılarak MIP temelli sensörler hazırlanmıştır. Geliştirilen Poli(Py-co-3-TBA)]/MOL@MIP/CKE ve GuaM/MOL@MIP/CKE sensörlerin teşhis sınırı (TS) değerleri sırasıyla 6.01x10-13 M ve 1.13x10-13 M olarak hesaplanmıştır. Farmasötik formlarda ve ticari serum numunelerinde elde edilen iyi geri kazanım değerleri sensörlerin bu numunelere başarılı bir şekilde uygulanabildiğini göstermiştir. UMI'nin seçici ve duyarlı analizi için fonksiyonel monomer olarak butil metakrilat (BuMA), gözenekli yapı oluşturmak için bor nitrür (B3N3) kullanılarak MIP temelli elektrokimyasal sensör hazırlanmıştır. Geliştirilen sensör DPV ve EIS gibi farklı elektroanalitik yöntemler kullanılarak UMI'nin analizine başarılı bir şekilde uygulanmıştır. UMI@B3N3/BuMA@MIP/CKE sensörünün yüksek duyarlılığını gösteren TS değerleri DPV ve EIS yöntemleri için sırasıyla 4.82x10-14 M ve 2.34x10-14 M olarak hesaplanmıştır. Girişim ve IF analizleri geliştirilen sensörlerin yüksek seçiciliğini doğrulamıştır. KAM'ın daha hassas ve duyarlı analizi için perde baskılı elektrotlar (SPAuE) kullanılarak hem MIP temelli sensör hem de sahte baskılı polimer (DIP) temelli sensörler hazırlanmıştır. Geliştirilen sensörlerin performansları dikkate alındığında poli(Py-co-p-ABA)@KAM@MIP/SPAuE sensörünün hem analitik validasyon parametreleri hem de uygulanabilirliği açısından diğer etken maddelerle hazırlanmış DIP sensörlere göre oldukça etkili sonuçlar elde edilmiştir. Sonuç olarak; RIB, MOL, UMI ve CAM'ın elektrokimyasal analizi için geliştirilen MIP tabanlı sensörlerin mevcut yöntemlere göre daha avantajlı ve alternatif yöntemler olduğu kanıtlanmıştır."
