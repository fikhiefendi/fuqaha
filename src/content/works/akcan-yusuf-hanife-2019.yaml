abstract: "Hanefî mezhebinin en büyük imamlarından olan Ebu Yusuf'un hocası Ebu Hanife'ye füruya dair hükümlerde ihtilaf ettiği bilinmektedir. Bu çalışmamızda Ebu Yûsuf'un hocasına olan ihtilafının sebepleri araştırılmış ve bu ihtilafların fıkıh usulü ve asıllardan kaynaklı olduğu sonucuna ulaşılmıştır. Bunun yanı sıra Ebu Yusuf'un hocasına göre daha zâhirci bir kimliğe sahip olduğu, Ebu Hanife'nin ise öğrencisine göre daha manacı ve arkaplanı hesap eden bir karakter taşıdığı sonucuna da varılmıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde ihtilafın akli temellendirilmesi yapılmaktadır. Birinci bölümde fıkıh usulü temelli ihtilaflar incelenmiştir. Bu bölüm de kendi içinde deliller ve hüküm bölümlerine ayrılmaktadır. İkinci bölüm ise asıllardan kaynaklı ve çeşitli sebeplerden doğan ihtilafları incelemektedir."
