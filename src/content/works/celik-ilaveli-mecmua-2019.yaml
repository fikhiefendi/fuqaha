abstract: "Bu çalışmada, şeyhülislamlık müsevvidlerinden Yakovalı (Kosova'da bir il) Ali el-Murtaza b. Zübeyir tarafından derlenerek meydana getirilmiş olan İlâveli Mecmua-ı Cedide isimli fetva kitabının İbadetler bölümü incelenmiştir. Osmanlı Devleti'nin son döneminde (1911) meşihat makamı tarafından verilen fetvaların toplandığı eser olan İlâveli Mecmua-ı Cedide'de yer alan ibadetler ilgili fetvaların latinizesi ve Arapça nakillerin tercümesi yapılmış, eserin ilk baskısı olan Mecmuâ-yı Cedîde'nin ibadetler bölümü ile karşılaştırılarak değerlendirilmiştir. Osmanlılarda Tanzimat'tan sonra kurumsallaşan Fetvahanede derlenen İlâveli Mecmua-ı Cedide her ne kadar Osmanlının son dönemlerinde (1911) yayımlanmışsa da eserde klasik dönemden de fetvalar bulunmaktadır. Bu durum her iki dönemin farklılıklarını görmemiz açısından önem arz etmektedir. Bu tarihi süreç içerisinde Osmanlılardaki fetva anlayışı ve uygulaması, toplumun karşılaştığı meseleler, fert ve devlet erkânından gelen sorular gibi konular hakkında bilgi sahibi olduk. Eserin bir özelliği de çok zengin bir kaynak olmasıdır. Bunun sebebi eserde farklı dönemlerde yaşamış fetva vermiş şeyhülislamlar ve meseleye fıkhi yaklaşımları, eserde atıf yapılan klasik fıkıh-fetva kitapları ve bunların meydana gelmesine sebep olan toplumun karşılaştığı problemlerdir. Diğer bir açıdan baktığımızda ise tek elden çıkmayan bu eser derleme olduğundan, fıkhi-hukuki ve dini-toplumsal yaklaşım farklılıklarını göstermektedir. Hanefi mezhebinin imamları arasındaki görüş ayrılıkları kaynak olarak gösterilmiştir. Bu durum fıkhın istihsan ve maslahat ilkeleri işletilmek suretiyle İslam hukukunun aktif olduğuna işaret etmektedir. İncelediğimiz eserin sadece ibadetler bölümünde; resmi olarak iftâ makamında bulunan 18 şeyhülislam tarafından verilen 200 fetva ve Hanefi mezhebi doktrinine ait 79 tane temel kaynağın kullanılması ciddi ve nitelikli bir fetva mecmuası olduğunu göstermektedir. Bu fetva mecmuasını derleyerek meydana getiren fetvahane müsevvidinin fıkha vukufuyeti ve ilmi müktesebatının yüksek oluşu ayrıca önem arz etmektedir. Bu durum eserin yayınlandığı dönemde toplum tarafından ilgi görmesi ve ikinci baskının yapılmasının sebepleri arasında gösterilebilir.Çalışmamızın başında konumuzun ve incelediğimiz eserin dayandığı Osmanlı İlmiye teşkilatının bazı önemli kurum ve kavramlarından fetva olgusu, Osmanlılarda fetva uygulaması, fetva mecmuaları, şeyhülislam, fetvahane ve fetva eminliği hakkında bilgiler verilmiştir."
