abstract: "İnsan sosyal bir varlıktır. Bu yüzden içinde yaşadığı toplum tarafından kabul edilen kurallara uymak zorundadır. Bu kurallar bazen din, bazen yasa, bazen de örf-adet kaynaklı olabilir. İslam dini ve getirdiği ahlaki umdeler, insana, toplumda nasıl yaşayacağını açıklamıştır. Bu çalışmamızda farklı boyutlarıyla İslam Dini ve İslam Hukuku açısından fitne kavramı araştırılmıştır. Çalışmamızda başta Kur'an ayetlerine ve hadislere yer verilerek fitne kavramı açıklanmış, Nübüvvet Dönemi olayları sünnet ve siyer kaynaklarından araştırılmış, kamu düzenini sarsan olaylar ve bunları bertaraf etmek için öngörülen çözüm yollarını bu konuda yazılan eserlerden faydalanılarak fıkhı içtihatlarla birlikte analiz edilmiştir.Çalışmamızın neticesinde görülmüştür ki; fitne, ilk insan Hz. Adem'in şeytan tarafından fitneye maruz bırakılmasından başlayıp tüm insanları içine alan imtihan vesilesidir. Fitne Allah'a nispet edildiğinde imtihan ve sınama; insanlara nispet edildiğinde ise, bir insanın inancından ve dininden döndürmek için işkenceye maruz bırakmaktır.Fitne tüm toplumu saran büyük bir bela olduğunda Rabbimiz, zararı herkese olan, musibeti günahkar olan ve olmayan herkese ulaşan anlaşmazlık, kavga ve anarşiden kaçınmamızı emrederek dünyadaki tüm insanların barış, adalet, emniyet, müsamaha ve diyalog kültürü içinde, bir arada nasıl yaşayabileceğini getirdiği hukuki ve ahlaki kurallarla ortaya koymaya çalışmıştır. Hukuki açıdan can, din, akıl, nesil ve malın korunması için önleyici tedbirler alınmış, cezai müeyyideler getirilmiştir, gerektiğinde ve başka çare kalmadığında savaşa da izin verilmiştir."
