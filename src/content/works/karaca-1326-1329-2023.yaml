abstract: "Kadıların Osmanlı sistemindeki etkin rolleri sebebiyle şer'iyye sicilleri sosyal ve yerel tarih çalışmalarında ana kaynak niteliği taşımaktadır. Osmanlı tarihi kaynakları içerisinde çok önemli yeri bulunan bu belgeler tanıklık ettiği döneme ışık tutan özgün kaynaklardır. Bunlar Osmanlı Devleti mahkemelerinde verilen kararların ve tutulan kayıtların toplandığı defterlerdir. Kadı sicilleri, kadı divanı, mahkeme kayıtları, sicillât-ı şer'iyye ve yaygın kullanımı ile şer'iyye sicilleri denilen bu defterler kadı yahut nâibi tarafından tutulmakta ve çeşitli türden belgeleri içermektedir. Yüksek lisans tezi olarak incelediğimiz 419 Numaralı Manisa Şer'iyye sicilini (1326-1329/1908-1911); konu bakımından tespit ettiğimiz dava kayıtlarının ağırlıklı olarak, miras, talak, vasi tayini, satış ve alacak davalarını içeren hüccet ve berat türü belgeler olduğunu görmekteyiz. Bu çalışma ile Manisa Sancağı Kula Kazası yerelinde yaşanan olayların; dönemin ekonomik, sosyal, kültürel ve hukuki durumuna ışık tutacağına inanıyoruz. Çalışmamız, giriş ve üç bölümden oluşmaktadır. Giriş kısmında çalışmanın konusu, amacı ve yöntemi belirtilerek, Manisa ve Kula Kazası'nın coğrafi ve tarihî durumu ele alınmaktadır. Ardından birinci bölümde Osmanlı klasik dönem hukuku ve kadılık kurumu, son olarak Tanzimat dönemi hukuku ve mahkemeleri hakkında genel bilgi verilmiştir. İkinci bölümde Manisa Şer'iyye Sicilleri, 419 Numaralı sicil defterinin tanıtımı, belge özetleri ve transkribi, üçüncü bölümde ise sicilin genel değerlendirmesi yapılmış, defterde geçen dava konuları ve yer adları hakkında bilgi verilmiştir. Çalışma sonuç, ekler ve kaynakça ile son bulmaktadır."
