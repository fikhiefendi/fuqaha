abstract: "Bir organizasyon yapısı içinde yer alan tüm yöneticiler, öncelikli olarak organizasyonun sürekliliğinin sağlanması ile yükümlüdürler. Bu çerçevede, örgüt hedeflerine ulaşmada örgütün asli unsuru olan çalışanların en üst seviyede katkıda bulunmalarının sağlanması da yöneticilerin yönetim becerileri ile doğru orantılı olacaktır. Hangi yönetsel kademede olursa olsun bir astın iş görme kabiliyetini doğru yönetebilen bir üst, organizasyonun, hedeflenen başarıya ulaşması için sosyal işbirliği ortamını geliştirerek, bireysel çabaların artırılmasını sağlamış olacaktır. Yönetim yazınında yaşanan gelişmeler neticesinde bireylerin yeteneklerini maksimum düzeyde kullanmasının ve verimliliğin işletmeler için önemi gün geçtikçe daha çok anlaşılmış, böylece koç ve koçluk sistemi, yönetsel düzeyde daha çok benimsenerek, uygulanır hale gelmiştir. Yöneticinin koçluk uygulamaları yoluyla çalışanların, organizasyonun hedeflerine odaklanarak, çabalarını bu yönde ortaya koyması, lider ile astın arasında kaliteli bir etkileşimin olması gibi sosyal işbirliği ortamını geliştirecek, tüm bunların bir çıktısı olarak da çalışanların örgüte olan bağlılıkları artmış olacaktır. Yöneticiler, uygun metodu kullanmaları halinde, çalışanı birlikte düşünmeye ve işbirliği duygusu ile sorumluluk paylaşmaya özendirerek, verdikleri somut görevlerin, benimsenip kendi hedefleri haline dönüştürülmesini sağlamış olacaktır. Bu işbirliği, literatürde Lider-Üye Etkileşimi (LÜE) adıyla inceleme alanı bulmuştur. Bu tez çalışmasında, koçluk uygulamaları, örgüt bağlılığı ve lider-üye etkileşimi (LÜE) kavramlarına yönelik literatür incelenmiş, söz konusu kavramların birbiri ile etkileşimleri ve bir örgüt içerisindeki gerçek etkilerini belirlemeye yönelik alan araştırması yapılarak, sonuçları tartışılmıştır."
