abstract: "İnsan embriyonik kök hücreleri uygun şartlarda insan vücudunu oluşturan tüm somatik hücre çeşitlerine dönüşebilme kapasitesine sahiptir. Yapılan bilimsel araştırmalar bu hücrelerin klinikte tedavisi mümkün olmayan birçok hastalığın tedavisinde kullanılabileceği ihtimalini taşımaktadır. Ancak insan embriyosu kullanılarak elde edilen kök hücre çalışmaları büyük tedavi umutlarının yanı sıra bir takım hukuki ve ahlaki sorunları da beraberinde getirmiştir. Bu çalışmada, insan embriyosu kullanılarak elde edilen kök hücre araştırmalarına dair etik tartışmalar incelenmiştir. Bu amaçla öncelikle konunun hukuki boyutu araştırılmış ve konu Türk hukuk mevzuatı çerçevesinde hayatın başlangıcı ve tüp bebek ünitelerinde oluşturulan fazlalık embriyolar üzerinden incelenmiş ve embriyonun hukuken belirsiz bir alana terk edildiği ve bütünlüklü bir yasal bir düzenlemeye ihtiyaç duyulduğu görülmüştür. Çalışmanın devamında ise semavi dinlerin; embriyonun bilimsel çalışmalarda kullanılması, insanlığın başlangıcı ve anne rahmindeki embriyonun ve tüp bebek ünitelerindeki fazlalık embriyoların ahlaki konumuyla ilgili yaklaşımları karşılaştırmalı olarak incelenmiştir. Böylece hem dinlerin kendi içlerindeki farklı görüşlerin hem de İslamiyet?in diğer semavi dinlerle olan benzer ve farklı yaklaşımlarının ortaya konulması sağlanmıştır. Son olarak ülkemizin önemli fıkıh alimleriyle yapılan görüşmeler sonucunda, ulemanın konuya dair görüşleri değerlendirilmiş ve ulema arasındaki pozisyonların dünya literatüründeki pozisyonlar açısından tasnifi yapılmıştır."
