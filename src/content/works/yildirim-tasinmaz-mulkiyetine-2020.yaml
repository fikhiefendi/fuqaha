abstract: "Taşınmaz malların sahip oldukları sosyal ve ekonomik değeri göz ardı etmek mümkün değildir. Taşınmazlar gerek bu ekonomik değerleri gerekse yapıları itibariyle taşınır mallardan daha ağır ve ortadan kaldırılması daha zor müdahalelere uğramaya müsaittirler. Bu sebeple sağlanacak hukuki korumanın da ayrıca incelenmesi gerekir. Bu eserin konusu taşınmaz mülkiyetinin el atmanın önlenmesi davası ile korunmasıdır. Taşınmaz mülkiyetine gerçekleşen müdahalelere karşı el atmanın önlenmesi davasının uygulanması incelenirken öncelikle el atmanın önlenmesi davasına ilişkin genel esaslar değerlendirilmiştir. Daha sonra ise davanın uygulaması sırasında taşınmaz eşyalara ilişkin olarak karşılaşılabilecek sorunlar incelenmiştir. Bu çerçevede müdahalenin varlığının tespit edilebilmesi noktasında önem taşıyan mülkiyet hakkının kapsamı ve malikin mevcut müdahaleye karşı olumsuz yetkilerini kullanamayacağı durumları tespit eden katlanma yükümlülüğü kavramları taşınmaz mülkiyeti yönünden ayrıca araştırılmıştır. Bu hususların yanında taşınmaz mülkiyetinin uğrayabileceği olası müdahaleler sınıflandırılmıştır. Son olarak ise yargılama süreci incelenmiştir."
