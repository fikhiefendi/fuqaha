abstract: "Çalışmamızda İbn Hazm'ın el-Muhallâ adlı eserinde İmam Şâfiî'ye ait ibadet konusundaki görüşleri tahkik etmeye çalıştık. Tezimizde 409 tane görüş ele alınmış olup, bunların 12 tanesi yanlış görüş olarak tespit edilmiştir. Bu hatalar Taharet, Hayız, Namaz, Oruç ve Hac konularında bulunmaktadır. İncelenen görüşler İmam Şâfiî'nin el-Ümm adlı kendi eseri ve Şâfiîlerin ünlü eserlerindeki gürüşleri ile teyit ve tasdik edilmiştir. Ayrıca, bu çalışma sayesinde el-Muhallâ'da bulunabilecek daha fazla hata olduğu ihtimaline inanıyoruz. Bu nedenle, gelecekte buna benzer çok çalışma olacağını temenni ederiz. Böylece, o çalışmalar el-Muhallâ'daki eksik bilgileri tamamlayabilir veya içindeki hataları düzeltebilir."
