abstract: "oz Bu araştırma,“KUR' AN VE SÜNNETTE ZEKÂT”başlığını taşımaktadır. Bu başlık altında zekât, asıl kaynaklarından anlatılmaya çalışılmıştır. Bu araştırma, giriş hariç üç bölümden oluşmaktadır. Giriş kısmında, Kur'an'da zekâtı, direk veya dolaylı anlatan kavramlar tespit edilmiş, etimolojik ve terminolojik yönden incelenmiş ve Kur'an'da geçtikleri ayetler ile beraber verilmiştir. Birinci bölümde; Giriş kısmındaki ilgili ayetler kullanılarak konu başlıkları belirlenmiş ve zekâtın Kur'an'da ki fenomeni kurulmaya çalışılmıştır. İkinci bölümde; Sahih hadis kitaplarının, zekât ile ilgili bölümlerindeki konu başlıklarından yola çıkılarak sünnette zekât işlenmiştir. Üçüncü bölümde ise; mezheplerin zekâta bakış açılarını göstermesi bakımından mezhepler arasında en çok tartışılan konulardan örnekler verilmiştir. Araştırma, herkesin söz söylediği zekât gibi mühim bir konuda sözü Kur' an' a bırakmıştır. Kur' an, zekâtı, iktisâdi dengeyi kurmada ve toplumsal barışı sağlamada bir araç yapmıştır. Kur' an, zekâtı namaz ile birlikte zikrederek ona ibadet özelliğini yüklemiştir. Aynı zamanda insanlığa adaletli vergi sisteminin ilkelerini sunmuştur. iv"
