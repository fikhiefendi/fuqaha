abstract: "Türkiye Cumhuriyeti Devleti'nde Şâfîî-Kürt halkı yoğun olarak, Doğu Anadolu ve Güneydoğu Anadolu bölgelerinde yaşamaktadır. Bu bölgede Diyanet İşleri Başkanlığı'nın bünyesinde, resmî olarak dinî faaliyet yürüten; anadili Türkçe ve Hanefî mezhebine bağlı imamlarla, anadili Kürtçe ve Şâfîî mezhebine bağlı olan imamlar bulunmaktadır. Bu çalışma, bahse konu olan imamların, imamlık vazifelerini yerine getirirken yaşadıkları deneyimlerden yola çıkarak, Türkiye'deki dinî faaliyetlerin, resmî dilde (Türkçe) ve başat mezhepte (Hanefî) yürütülmesinden kaynaklanan problemleri fenomonolojik açıdan tartışmayı hedeflemektedir. Böylelikle olabildiğince mevzunun tüm yönlerini ortaya koyan bir durum tespiti yapmak istenmektedir. Bu bağlamda, bahse konu edilen imamların, bölgede görev yaptıkları süre içerisinde, imam arkadaşlarıyla, cemaatle ve bölgede yaşayan halkla ilişkileri incelenmektedir. Çalışma, dil ve mezhep farklılıklarını kendinde barındıran imamların, ekseriyetle Kürt olan cami cemaati ve bölge halkı ile olan muhataplıkları açısından, yaşadıkları bireysel deneyimleri nasıl değerlendirdiklerini göstermeye çalışmıştır. Tarama modelinde gerçekleştirilen araştırma, beş (5) Türk-Hanefî, on iki (12) Kürt-Şâfiî olmak üzere toplamda on yedi (17) imamdan oluşan bir çalışma grubu ile yapılan görüşmelerden elde edilen verilere dayanmaktadır. Araştırmada yarı yapılandırılmış görüşme tekniği kullanılmıştır. İmamlarla yapılan mülakatların kayıtları çözümlenerek görüşme metinlerine dönüştürülmüştür. Elde edilen bu veriler, betimsel ve sistematik analiz yöntemi kullanılarak fenomonolojik açıdan değerlendirilmiştir. Yaygın anadilinin Kürtçe, mezhebin ise Şâfiî olduğu bu coğrafyada, dinî faaliyetleri yürütmek için Diyanet İşleri Başkanlığı tarafından görevlendirilen, Hanefî mezhebine bağlı, anadili Türkçe, Kürtçeyi bilmeyen ya da çok az bildiği varsayılan imamların; Şâfiî mezhebinin dinî uygulamaları ile halkın imamlara başvurduğu çeşitli toplumsal uygulamalarda (nikâh, cenaze, küslerin barıştırılması vb.), mezhep, örf ve adetler konusunda yeterli bilgiye sahip olmadıkları görülmektedir. Dolayısıyla çalışma, bu durumun devlet tarafından verilen dinî hizmetin ve toplumsal yaşam çözümlemelerinin niteliğini zayıflattığı iddiasını taşımaktadır. Anahtar kelimler: Mezhep, Dil, Kimlik, Şâfiî/Kürt, Hanefî/Türk, Fenomonoloji."
