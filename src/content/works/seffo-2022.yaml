abstract: "Hz Ali'nin aynı mesele hakkında farklı görüşler belirttiği olmuştur. Bu durum ise bazı sebeplere dayanmaktadır. Sözü edilen sebeplerden bir kısmı şu şekildedir: Hz. Ali'nin daha sonra meselenin hakikatına vakıf olduğu için önceki görüşünden dönmesi. Aynı mesele hakkında soru soran değişik kişilerin her birine münasip düşen fetva vermesi. Kendinden rivayet edilen farklı rivayetlerin hakikate tek rivayet olması. Buradaki ihtilaf ravilerden bir kısmının onun fetvasını kısaltıp aktarmasından kaynaklanmaktadır. Nitekim bu durumda kısaltılan rivayet asıl itibariyle uzun ve onun tefsiri mahiyetinde olan rivayete raci olmaktadır. Kendisinden sahih ve zayıf olarak rivayet edilen farklı rivayetlerın olması. Hz. Ali'nin bu türden ihtilaflarını incelediğimizde şöyle bir sonuçla karşılaşıyoruz: Hz. Ali'nin meselenin hakikatıni kavradığından ötürü ictihad değişikliği yaptığı yerlerde onun son fetvası esas alınır. Farklı şahsalar için verdiği değişik fetvalarda onların her birine verdiği fetva sabit olur. Uzun ve kısa rivayetlerden kaynaklanan ihtilaflarda uzun olan rivayet kabul edilir. Zayıf ve sahih olarak kendinsinden gelen farklı rivayetlerde ise şayet her iki rivayet zayıflık ve sahihlik bakımından eşitse ilim erbabınca makul bulunan yöntemle her iki rivayet ile amel edilir."
