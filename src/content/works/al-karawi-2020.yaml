abstract: "“İmam Serhasî ve Kıyas Metodu ”isimli tez, Hanefi fıkıh usûlü literatürünün en temel kaynaklarından biri olan Usul-u Serhasî'yi ve Fıkıh usûlünün en önemli konulardan biri olan kıyas konusunu ele alması itibariyle büyük önem taşımaktadır. Konunun önemine rağmen Serahsî'nin kıyas metodu müstakil bir çalışmada ele alınarak detaylı bir şekilde incelenmemiştir. Bu nedenle bu araştırmanın amacı İmam Serahsî'nin kıyas metodunu tespit ederek ayrıntılı bir şekilde tahlil etmektir. Çalışmanın konusu, Serahsî'nin kıyas konusundaki yöntemi, onun bu konuya kattığı yenilikler ve kıyas konusunda kendisinden önceki fıkıh imâmlarına yönelttiği eleştirilerdir. Bu araştırmada sosyal bilimlerde kullanılan araştırma yöntemlerinden biri olan analitik betimleyici yöntem kullanılmıştır. Serahsî, h.v yy.'da neş'et etmiş ve erken yaşlarından itibaren ilim tahsil etmeye başlamıştır. Devrinin en büyük âlimlerinden biri olarak“imâmet”mertebesine ulaşmış ve imamların güneşi anlamına gelen“Şemsü'l-Eimme”lakabıyla anılmaya başlamıştır. Hakikat taraftırlığı ve ilkeli duruşu nedeniyle görüşlerinden ve düşüncelerinde taviz vermemiştir. Bundan dolayı bazı siyâsî, hukukî ve dinî meselelerde devrin siyasi idaresine muhalif olan düşünceleri sebebiyle zulme maruz kalarak hapse düşmüş ve karanlık bir kuyunun dibine hapsedilmiştir. Hapse düşmesine rağmen kalbindeki ilim sevdası ve sarsılmaz imanıyla ilmî faaliyetlerden vazgeçmemiş, âdeta karanlık kuyuyu medreseye çevirmiştir. Kitaplarından ve kaynaklarından mahrum bırakılmış haldeyken dahi ciltler dolusu eserler telif etmiş ve bu eserleri talebelerine hafızasından yazdırmıştır. Serahsî, Hanefî mezhebi tabakatında üçüncü tabakadan olan imamlardan kabul edilmektedir, bu tabakada yer alanlar herhangi bir konu veya meselede müçtehid seviyesinde olan âlimlerdir. Serahsî, kıyası türediği fiilin sigası ve delâleti açısından ikiye ayırarak kıyasın iki anlamı olduğunu ifade etmiş, kıyasın lügat anlamının“ölçme, takdir ve eşitlik”manâlarına geldiğini belirtmiş ve kıyasın lügat anlamıyla yetinerek ıstılâhî bir tanımda bulunmamıştır. Ayrıca Serahsî; sahabe, tâbiîn ve büyük imamlarının, hükümleri sâbit olan asıllar üzere, rey ile kıyas yapmanın câiz olduğu görüşünde olduklarını ifade etmiştir. Serahsî asılların illete tâbî olduğunu dile getirmiş ancak onların şu anda da illete tabi olduğunu gösteren kesin bir delilin bulunması gerektiğini belirtmiştir. Buna ek olarak Hanefî alimlerinin illeti belirlemede hangi vasfın uygun olduğunu belirten bir delil bulunmasını şart koştuklarını zikretmiş ve kıyas konusunda kendisinden önceki fıkıh alimlerinin belirttiği şartları naklederek değerlendirmiştir. O, gerek Şâfîlerin gerekse cumhûrun ortaya attığı itirazları ele alarak Hanefî usulcülerin belirlediği kıyasın dört şartına ek olarak yeni beşinci bir şart getirmiştir. Serahsî illeti kıyasın rüknü kabul etmek hususunda Hanefî usûlcülerinin yaklaşımını benimsemiş ve illetin hükmünün“Nas ile sabit olan bir hükmün, kendisi hakkında nas bulunmayan bir fer'e de intikal etmesi -taşması-”olduğunu vurgulamıştır."
