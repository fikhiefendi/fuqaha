abstract: "Bu araştırma, Malikî mezhebindeki farzlar (vâcipler) ile ilgili ahkâm ayetlerini ele almaktadır. Çalışmada, diğer dört fıkıh mezhebinden Malikîlere katılanlar veya onlara muhalif olanların görüşleri delilleriyle birlikte sunulmuştur. Bazı durumlarda tartışılmış ve tercih edilen görüşler benimsenmiştir. Bu araştırmanın temel amaçlarından biri, araştırmacının genel ahkâm ayetlerinin tefsiri ve bilhassa farzlarla ilgili ayetler bağlamında Malikî fıkıh âlimlerinin görüşlerini tümevarım yöntemiyle inceleyerek, Malikîlerin Kur'an'daki farzlara ilişkin metinlere dair yaklaşımlarını belirginleştirmektedir. Bu mütevazı araştırmanın önemi; ahkâm ayetleri ilminin mahiyeti, ortaya çıkışı ve benzeri temel başlangıç noktalarını açıklığa kavuşturmasında; Malikî âlimlerinin bu ilme gösterdikleri ihtimamı ve benimsedikleri metodu ortaya koymasında; ayrıca farzlarla ilgili ayetlerden hükümler çıkarılmasında da belirginleşmektedir. Çalışma, giriş, iki bölüm ve bir sonuç kısmından oluşmaktadır. Araştırmacı, bu araştırma boyunca çeşitli metodolojiler kullanmış olup, bunların başında tümevarımcı (istikraî), objektif ve analitik yöntemler gelmektedir. Şunu da belirtmek gerekir ki hüküm cıkarmakta iken (istinbat) başvurulan kaynakların büyük ölçüde hicri beşinci yüzyıldan günümüze kadar yazılmış eserler olup“Ahkâmül Kur'an”İbnü'l-Arabî'nin ve“el-Cami' li Ahkîmi'l-Kur'ân”türündeki derlemeler kullanılmaktadır."
