abstract: "Bu çalışma, zekât yükümlülüğünün temel şartlarından biri olan tam mülkiyet kavramını teorik çerçevesi ve pratik yansımalarıyla incelemektedir. Araştırmanın amacı, tam mülkiyetin fıkhî mahiyetini ortaya koymak ve bu şart ekseninde şekillenen klasik ve güncel zekât meselelerini bütüncül bir yaklaşımla değerlendirmektir. Bu doğrultuda öncelikle fakihlerin tam mülkiyet kavramına yükledikleri anlamlar ile bu şartın gerçekleşmesi için gerekli gördükleri unsurlar ele alınmıştır. Ardından tam mülkiyetin gerçekleşip gerçekleşmediği hususunda ihtilaflı olan meseleler incelenmiştir. Bu kapsamda kamu malları ve belirsiz kişilere vakfedilmiş varlıkların zekâtı değerlendirilmiş; haram mallarda zekât yükümlülüğünün doğup doğmayacağı tartışılmıştır. Tasarruf yetkisine ilişkin kısıtlamalar bağlamında mâl-i dımâr, vasiyet edilen mallar ve rehnedilen malların zekâta tâbi olup olmadığı ele alınmıştır. Ortaklık yapılarının tasarruf yetkisi üzerindeki etkileri incelenirken, modern finansal araçlardan hisse senetleri ve katılma hesaplarında zekâtın nasıl hesaplanacağı ve mükellefiyetin kime ait olduğu analiz edilmiştir. Son olarak alacakların zekâtı, tahsili umulan ve umulmayan alacaklar ayrımı çerçevesinde tam mülkiyet şartı bakımından yeniden değerlendirilmiş; vadeli ve vadesiz banka hesaplarında bulunan varlıklar da güncel bir mesele olarak aynı bağlamda ele alınmıştır. Çalışmada, tam mülkiyetin gerçekleşebilmesi için ayn ve menfaat üzerinde mülkiyetin bulunması, mal sahibinin ilgili varlık üzerinde tasarruf yetkisine sahip olması ve mülkiyetin istikrar kazanmış olması gerektiği sonucuna ulaşılmıştır. Bu çerçevede tam mülkiyet şartı, farklı ve güncel varlık türlerinde zekât yükümlülüğünün tespitine yönelik işlevsel bir ölçüt sunmaktadır."
