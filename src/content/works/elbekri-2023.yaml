abstract: "Hanefî füru fıkıh literatürünün üç alt türü içerisinde fetvâ ve nevâzil tarzı eserler önemli bir yer tutar. Zira bu literatür, mezhebe mensup fakihlerin ilk dönem kurucu metinlerde yer almayan konularda sonraki dönemlerde ortaya koydukları görüşleri barındırması bakımından mezhep içi fıkhî istidlal ve ictihad faaliyetinin duraksamaksızın canlı bir şekilde yürütüldüğünü gösterir. Hanefî mezhebi ilk ortaya çıktığı Irak bölgesinde kuruluşunu ve ilk metinlerini ortaya koyduktan sonra Mâveraünnehir ve Horasan bölgelerinde yaygın bir kabul görmüştür. Bu bölge fakihleri kurucu metinlerin şerhi yanında özellikle fetva ve nevâzil konusunda mezhep içerisinde etkisi hissedilir bir ilmî mesâî ortaya koymuşlardır. Hicrî beşinci yüzyılda Mâveraünnehir bölgesinde Hanefî mezhebinin fetva literatürü konusunda iki büyük âlimin kaleme aldığı eserler, sonraki dönem Hanefî fıkhında önemli bir yer edinmiştir. Bunlardan biri olan Ebubekir el-Hasîrî (v. 500) el-Hâvî fi'l-fetâvâ adlı eseri halen yazma hâlde bulunmaktadır. Bu eserlerden diğeri ise Ebu Hafs es-Sadruşşehid'e ait Umdetü'l-fetâvâ adlı kitabıdır. Bu çalışmada Hasîrî'nin söz konusu eserinin el-Mekrûhat ve'l-mahzûrat adını taşıyan bölümünü tahkik etme yanında söz konusu bölümü, Sadruşşehid'in eserindeki aynı konuların yer aldığı bölümle mukayese etmek suretiyle Mâveraünnehir Hanefî fıkıh düşüncesinde fetvanın kaynakları, üslubu ve konularının benzerlik ve farklılık gösterip göstermediği konusunu ele almaya çalıştık. Araştırmamız bir giriş ve dört bölümden oluşmaktadır. Birinci bölüm İmam Hasîrî'ye ayrılmış olup bu bölümde Hasîrî'nin şahsı ve el-Hâvî fi'l-fetâvâ adlı eseri tanıtılacaktır. Bu tanıtım esnasında Hasîrî'nin yararlandığı kaynaklar, yer verdiği muhteva, konuları ele alış biçim ve üslubu, fetvalarındaki tercihler gibi konular üzerinde durulacaktır. Araştırmanın ikinci bölümünde Sadrüşşehid'in şahsiyeti ve Umdetü'l-fetâva adlı eseri tanıtılacaktır. Üçüncü bölüm ise Hasîrî ve Sadrüşşehid'in eserlerinin ilgili bölümlerinin mukayesesine ayrılmıştır. Çalışmamızın ana bölümlerinden birini teşkil eden dördüncü bölüm, el-Hâvî fi'l-fetâvâ adlı eserin el-Mekrûhat ve'l-mahzûrat başlığını taşıyan kısmın tahkikinden oluşmaktadır. Çalışmamızda Hasîrî'nin eserinin; muhtevasının zenginliği, kaynaklarının fazlalığı, yalnızca fetva aktarımıyla yetinmeyip yaptığı tercihler yönünden Sadrüşşehid'in eserinin ilgili bölümüne göre daha önce çıktığı tespit edilmiştir. Bununla birlikte her iki eserin de sonraki dönem genel füru eserleri yanında fetva literatüründe önemli bir yer edindiği de tespit edilmiştir."
