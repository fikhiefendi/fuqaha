abstract: "İktisadi ve sosyal hayatta ticareti kolaylaştırmayı sağlayan en önemli araç paradır. Tarihte para sistemleri mutat şekilde çökmüş ve yeni para sistemleri her zaman bir öncekinin kusurlu yönlerini tahsis etmek amaçlı ortaya çıkmıştır. Günümüzde de halihazırdaki para sisteminden kaynaklanan sorunlar iktisadi ve sosyal hayatta çöküşlere yol açmaktadır. Bu nedenle mevcut para sistemi sorgulanmaya başlanmış, daha büyük sıkıntılara ve yıkımlara yol açmadan ikamesi için araştırmalara hız verilmiştir. Çalışmanın amacı mevcut para sisteminin kusurlu yönlerini düzeltmek için İslami bir çözüm önerisi sunmaktır. Bu araştırmada kavramsal analiz ve teorik araştırma yöntemi kullanılmıştır. Konunun içeriğinin son derece ehemmiyetli olmasına karşın literatürde bu önemi gösteren araştırmaların sayısı yeterli değildir. Günümüz iktisadi sisteminde para riba içeren borçlanma senetleri ile yaratılmaktadır. Değerli madenlere dayalı para sistemleri, spekülasyon ve garar'a zemin hazırlamaları münasebeti ile, tarihte denenmiş ve çökmüşlerdir. İslami açıdan para üretime ve emeğe dayalı olmalıdır. Bu veriler ışığında lisanslı depoculuk sistemi sayesinde paranın, tedarik zincirlerinden başlanarak üretime ve emeğe dayalı yaratılabileceği tespit edilmiştir. İslami açıdan uygun kripto para sistemiyle birlikte geliştirilecek elektronik depo sertifikalarının da paranın çapası olma fonksiyonunu kolaylıkla yerine getirebileceği sonucuna ulaşılmıştır."
