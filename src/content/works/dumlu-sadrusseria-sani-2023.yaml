abstract: "Sadruşşerîa es-Sânî (ö. 747/1346) Hanefi fakihi ve mütekellim olmasının yanı sıra tefsir, hadis, belagat, felsefe gibi alanlarda yetkin olan, eserleri Osmanlı medreselerinde ders kitabı olarak okutulan bir âlimdir. Bu çalışmada bu güne kadar zikri geçen ilimlere dair eserleri üzerinde durulan fakat Mâverâünnehir'de ulemâ-sûfî birlikteliğinin bir halkası olarak sûfi kimliğine atıf yapılmayan Sadruşşerîa'nın tasavvufî muhitlerle ve şeyhi Hasan Bulgârî ile irtibatı, tasavvufî perspektiften kaleme aldığı“Makâmâtü'l-ârifin”ve“Te'vîl-i Kıssa-i Yûsuf”adlı eserlerinden hareketle tasavvuf anlayışı ortaya konacaktır."
