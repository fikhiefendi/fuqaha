abstract: "Bu çalışmada Kur'ân-ı Kerîm'de yer alan iktisâdî yapıyı ortaya koymayı hedefliyoruz. Bu yapının temeli âyetlerde yer alan akidevî ve ahlâkî prensiplerdir. Bir de bunların üzerinde yükselen ve Kur'ân iktisadı esaslarının kendisine dayandığı mülkiyet, adalet ve hürriyet sütunları bulunmaktadır. Bu iktisadın görünür kısmı yani bu yapının dış duvarları ise üretim, tüketim, dağıtım, infak gibi hususlardır. Bu tezde âyet-i kerîmeleri inceleyerek Kur'ân-ı Kerîm'deki iktisâdî prensipleri ortaya çıkarmaya çalıştık. Kur'ân-ı Kerîm o dönemde mevcut olan iktisâdî hayatı nasıl tavsif ediyor ve onunla alâkalı ne tür değerlendirmelerde bulunuyor, bunu beyan etmek istedik. Çünkü Akâid, Ahlâk ve İslâm iktisâdı ile alâkalı bütün çalışmaların tamamı âyet-i kerîmelere dayanmak durumundadır. Kur'ân-ı Kerîmdeki iktisâdî yapının ana unsurları ve prensipleriyle alâkalı sahih bir tasavvur oluşturmaya çalıştığımız bu çalışmamızda bir takım teklif ve tavsiyelerde bulunduk: İslam İktisâdıyla alâkalı problemler öncelikle İslâm teşriinin esası olan Kur'ân Kerîm'le çözülmelidir. Bu yüce kitabın esrarına vâkıf olabilmek için derin ve dikkatli çalışmalar yapılmalıdır. Kitabullah'ın umûmî olarak bütün sosyal hayatla özelde ise iktisâdî hayatla alâkalı olarak ne söylediğini iyi anlayabilmek için sosyal bilimlerin farklı alanlarındaki uzmanların daha fazla çalışmalar yapmaları ihtiyaç vardır."
