abstract: "Osmanlı devlet sisteminde hükümdar, halife-sultan senteziyle çok sağlam bir mutlak otorite algısı kurmuştur. Ancak XVI. yüzyılın sonlarına doğru bozulmaya başlayan klasik devlet anlayışı içerisinde, mutlak otorite algısı da zarar görmüştür. Böylece devlet adamları için hükümdarı tahtından indirmek çok bir sorun haline gelmemiş ve netice itibarıyla Osmanlı tarihinde XVII. yüzyıldan devletin sonlarına kadar, Osmanlı söyleminde hal' vakası ancak modern söylemde darbe, neredeyse hiç eksik olmamıştır. Bu hal' vakalarında en etkin iki temel grup vardır. Bunlar ulema ve Yeniçeriler, yani askerdir. Ulemanın en etkili üyesi ise, elbette ki, o sınıfın başı olan Şeyhülislam'dır. Hükümdarın hilafet söylemi, hal' vakalarında Şeyhülislam'a çok özel bir yer tahsis etmiştir. Zira şeyhülislam artık, hükümdarın yönetim meşruiyetini ortadan kaldırıp, hal' edilmesini meşrulaştırabilecek tek yüksek otoritedir. Ancak tarih araştırmalarında hal' vakaları genellikle askeri darbe ekseninde incelendiği için, olaylarda her zaman Yeniçeriler ön plana çıkarılmıştır. Dolayısıyla, Şeyhülislam'ın bu yolla görmezden gelinmesi, sürece etki eden unsurlardan birinin göz ardı edilmesi sonucunu doğurmuştur. Hâlbuki Osmanlı kronikleri, olayları hilafet söylemi üzerinden ele almakla, Şeyhülislam'ın hadiselerde nasıl bir konumda durduğunu ortaya koymaktadır. Araştırmanın sonucuna göre, normalde teşkilatlanma içerisinde herhangi bir idarî icraya muktedir olmayan Şeyhülislam, hal' vakalarında sürece birinci dereceden tesir etmekle, çok hususi bir siyasi konuma erişmiştir."
