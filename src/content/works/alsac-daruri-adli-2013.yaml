abstract: "Tezde, İbn Rüşd?ün usûl anlayışı Gazâlî'nin Mustesfâ'sına Muhtasar olarak yazmış olduğu Darûrî adlı eseri bağlamında ele alınmıştır. Usûl konusunda İbn Rüşd'ün kendisine has yöntemi ve görüşleri tespit edilmeye, Darûrî'nin Mustesfâ'nın özeti olmaktan öte İbn Rüşd'ün kendi görüşlerini de içeren özgün bir eser olduğu ve İbn Rüşd!ün Mâlikî olmakla beraber bir mezhep taassubu içinde olmadığı ortaya konmaya çalışılmıştır. İbn Rüşd?ün görüşleri, diğer usûlcülerin görüşleri ile de mukâyese edilmek suretiyle ele alınmış, varsa etkilenmiş olması muhtemel isimler belirtilmeye çalışılmıştır. Ayrıca İbn Rüşd'ün konuları ele alışında kendine has tutumuna da dikkat çekilmiştir.Tez, Giriş ve İki Bölümden oluşmaktadır. Giriş kısmında, tezin içeriği ve hazırlanmasıyla ilgili bilgiler ve İbn Rüşd?ün Hayatı ve Eserleri konularına yer verilmiştir. Bu bölümde ayrıca Darûrî ile Mustesfâ arasında bir mukayeseye de değinilmiştir.Tezin Birinci Bölümünde, İbn Rüşd'ün Hukm ve Hukmlerin Asılları (İslâm Hukukunun Kaynakları) konularındaki görüşleri tespit etmeye çalışılmıştır. Tezin ikinci bölümünde, İbn Rüşd'ün usûl-i fıkhın esas konusu olarak nitelendirdiği delâletu'l-elfâz bahisleri ve bunun yanında İbn Rüşd'ün ictihâd ile ilgili konulara yaklaşımı ele alınmıştır."
