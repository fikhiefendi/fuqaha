abstract: "İslamın temel ibadetlerinden bir tanesi de zekâttır. Zekât mal ile yapılan bir ibadettir. Dinimizce zengin sayılan müslümanların mallarının belli bir kısmını belli zamanlarda ihtiyaç sahiplerine vermeleriyle gerçekleşir. Bu ihtiyaç sahipleri yani zekât verilecek kimseler Tevbe Suresi 60. Ayeti Kerimede şöyle sınıflandırılmıştır:?Zekâtlar, Allah katında farz kılınmış olarak; yalnız fakirler, miskinler, zekât işlerinde çalışanlar, kalpleri İslama ısındırılmak istenenler, köleler, borçlular, Allah yolunda bulunanlarla yolcuların (hakkı)'dır. Allah çok iyi bilendir, derin hikmet sahibidir.?Bu ayeti kerimeye göre zekât ancak şu kimselere verilir:1.Fakirler: İhtiyaç sahibi olup geçimini sağlayacak kadar imkânı olmayan kimseler.2.Miskinler: Fakirlerden daha çok ihtiyaç sahibi olan veya çalışacak durumda olmayan kimselerdir.3.Zekât İşlerinde Çalışanlar: Devlet tarafından zekât toplama ve dağıtmak için görevlendirilmiş memurlardır.4.Müellefe-i Kulûb: Müslüman olanlardan veya olmayanlardan İslam dinine ısındırılmak istenen kişilerdir.5.Köleler: Özgürlüğünü elde etmek için efendisi ile anlaşmalı kölelerdir.6.Borçlular: Kötü ve haram bir iş için olmamak şartıyla borçlanan kimselerdir.7.Allah Yolunda Bulunanlar: Yüce Allah'ın rızasını kazanmak için çalışıp savaşanlardır.8.Yolda Kalanlar: Yolculuk sırasında mağdur durumda olan yolculardır.Bu sınıfların dışında kalanlara zekât verilmez. Ancak bu sınıfların kimler olduğu zamana ve şartlara göre farklı şekillerde yorumlanabilir. Bu yorumlar yapılırken ayeti kerimede belirtilen bu temel sınıflar ve amacın dışına çıkılmamalıdır.Zenginlere, çalışıp kazanabilecek durumda olanlara, bakmakla yükümlü olunan yakınlara, müslüman olmayanlara ve Hz. Peygamber(s.a.v) yakınlarına zekât verilmez."
