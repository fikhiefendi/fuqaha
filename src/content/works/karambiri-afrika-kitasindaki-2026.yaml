abstract: "Bu çalışma, Afrika kıtasındaki faaliyet gösteren İslami bankaların kurumsal sosyal sorumluluk (KSS) uygulamalarını incelemeyi amaçlamaktadır. İslami bankacılık; şeriata dayansa da Afrika'daki farklı İslami bankalarının KSS stratejilerine ne ölçüde yansıdığı yeterince araştırılmamıştır. Araştırma, misyon ve vizyon beyanı, ürünler ve hizmetler, zekât, hayır ve yardım fonları, çalışanlara, borçlulara ve topluma yönelik taahhütler gibi temel KSS alanlarını belirlemeye odaklanmakta ve bu girişimlerin hem İslami finansın değerleriyle hem de yerel sosyoekonomik ihtiyaçlarla nasıl bir performans sergilediğini değerlendirmektedir. Kamuya açık yıllık raporlara dikkate alıp KSS açıklama endeks analiz edilerek, Jaiz Bank, Al Baraka Bank Mısır, Al Baraka Bank Cezayir, Alsalam Bank Cezayir, Al Baraka Bank Tunus, Bank Zitouna Tunus, Wifak Bank, Faisal İslamic Bank Sudan, Albaraka Bank Sudan, Umnia Bank, Bank Assafa ve Güney Afrika Al Baraka Bank seçilen İslami bankaların KSS uygulamaları karşılaştırmalı olarak değerlendirilmiştir. Bu çalışma, Afrika'daki 12 İslami bankanın KSS endeks performansını inceleyerek önemli farklılıkları ortaya koymaktadır. Genel eğilimler, bankalar ve endeks boyutları arasında heterojen bir performans sergilendiğini, misyon ve vizyon beyanı ile borçlulara yönelik taahhütlerin güçlü alanlar olduğunu, ancak zekât ve hayır fonları açıklamalarının en zayıf boyutu oluşturduğunu göstermektedir. Topluma ve çalışanlara yönelik taahhütler ise ülkeler arasında dalgalı bir seyir izlemektedir. Genel performans sıralamasında Al Baraka Bank (Mısır) ile birinci, Albaraka Bank (Güney Afrika) ikinci, Jaiz Bank (Nijerya) ve Faisal Islamic Bank (Sudan) üçüncü sırada yer alırken; Umnia Bank ve Bank Assafa en düşük KSS Endeks skorları almıştır. Sonuç olarak, İslami finansın etik boyutu teoride güçlü olsa da sosyal uygulamalar ve şeffaf açıklamalar heterojen kalmakta; özellikle hayır fonları raporlamasının geliştirilmesi ve sosyal sosyal göstergelerin stratejilere daha fazla entegre edilmesi kritik bir ihtiyaç olarak öne çıkmaktadır."
