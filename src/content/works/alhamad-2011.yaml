abstract: "Araştırma Özeti: Her insan faaliyetinin, o faaliyetin sahipleri sistemi önemsemese veya belirli bir sistemin kapsamına girse bile, bir çarpışması olması gerekir. İnsan hayatındaki en önemli çatışmalardan biri \"intikam amaçl cinayet tir ve bu saik, nesiller boyunca insanoğlunu rahatsız etmiştir. Bu nedenle, bu araştırma bu güdüyü sosyal, hukuki ve hukuksal olmak üzere birçok açıdan ele almaktadır. Bu güdü, eski ve yeni bir olgu olan intikam olgusu olarak bilinen bir olgu haline gelmiştir. eskiliği ve yeniliği, yakınında ve uzağında yaşayan insanların uygulamalarında yatmaktadır. Kendisine olan uzaklığın ve yakınlığin sebebini inceleyen kimse, bunu din ile olan ilişkinin kuvvetli veya zayıf olmasına veya din anlayış tarzina bağlamaktadır. Araştırma için araştırmacının seçilmesinin nedenleri şunlardır: İnsan ruhunun kutsallığını ve İslam dinindeki yerini anlatmak, İslam'ın insan ruhunun kutsallığı ve korunmasına duyduğu önemi ortaya koymak, Ve Cenâb-1 Hakk'ın dini ile insanın kendi kendine getirip yarattığı örf, adet, örf ve kanunlar arasındaki farkın hakikatini ortaya koymaktır. Araştırmanın önemi, insan kanının değerini ve yaygin bir kültürün olmayışını gösteren temel bir hususta yatmaktadır: (Başkalarının eylemlerinden bir kişiyi sorumlu tutmamak), Araştırmanın bireyle, aileyle, toplumla, devletlerle ve milletlerle güçlü bir bağlantısı vardır ve Cenab-1 Hakk'ın hükmünü öğrenmek isteyen her insanı ilgilendirir. Araştırmanın yargı kurumlarıyla, hukukçularla ve şehirdeki, kırsaldaki veya çöldeki ileri gelen kişilerle güçlü ve ayrılmaz bir bağlantısı var. Belki de araştirmanın sorunu, çoklu çelişkilerle birlikte insan ruhunun değerinin büyük ölçüde göz ardı edilmesinde yatmaktadır. Diğer şeylerin yanı sıra, önceden niyet veya niyet olmaksızın meydana gelen olayların sonucunun ne olduğu, Bazıları, bazı toplumları sonu olmayan çatışmalar içinde tutmak için arkalarinda kurnaz ve kötü niyetli ellerle kasıtlı olarak siyasallaştırılıyor. Araştırmanın en önemli hedefleri şunlardır: 1- Müslüman ülkelerin bazı yerlerinde hâlâ yaygin olan İslam öncesi örf ve adetlerin hakimiyet tehlikesini ortaya koymak. 2- Farkındalığın değerini göstermek, hayatta iyi karakteri harekete geçirmek ve bunu kan, gelenek, klan ve kabile bağnazlığının önüne koymak. 3- Müslümanların hayatında (başkalarının eylemlerinden kimseyi sorumlu tutmama) anlayışını harekete geçirmek."
