abstract: "Çalışmış olduğumuz 1541 Numaralı Tekirdağ (Rodoscuk) Şer'iyye siciline ait defter, 85 varaktan oluşmaktadır. Her bir varak kendi içerisinde a/b şeklinde gösterilmiştir. The book is dated 1601 (H. 1008/1009). Transkripsiyonu yapılan defterde adı geçen görevlilere ait genel bilgi verilmiş ve şer'iyye sicillerinin özelliklerinden bahsedilmiştir. Aynı zamanda Tekirdağ'ın (Rodoscuk) kültürel, sosyal, ekonomik yapısı hakkında da bazı değerlendirmelerde bulunulmuştur. Defterde adı geçen mahalle ve köy isimleri ile bunlara ait dava konuları, ayrı bir başlık altında tablolar şeklinde gösterilmiştir. En son bölümde defterin transkripsiyonuna yer verilerek çalışma tamamlanmıştır."
