abstract: "Fetva sorunlarına yansıyan kadın problemleri adlı araştırmamızdatoplumda var olan din eğitimi ile ilgili ihtiyaçlar tespit edilmektedir.Araştırma üç bölümden meydana gelmektedir. Giriş bölümündearaştırmanın problemi, amaç ve önemi, hipotezleri ve sınırlılıkları; ikincibölümde din eğitimi, kadın mefhumu, dini danışmanlık ve ilgili yayınlarortaya konmaktadır. Araştırmanın üçüncü bölümünde stanbul ve KonyaMüftülükleri Bayan Fetva Birimine gelen sorular incelenerek konularınagöre tasnif edilmiştir. ki şehrin yaşam şekilleri karşılaştırılmıştır.Kadınların problemlerine çözüm bulmak amacıyla müftülükleri aradıklarıgörülmüştür.Müftülüklere gelen soruların içeriğini incelediğimizde günümüzkadınının hayatın her aşamasında değişik sorunlarla karşılaştığınıgörmekteyiz. Kadın, aile içinde yaşadığı şiddetten ticari hayatta karşılaştığısorunlara kadar müftülüklere sorular yöneltmektedir. Bu problemleraraştırmada ele alınarak kadınların dini bilgilenme noktasındakieksiklikleri tespit edilerek çözüm önerileri getirilmektedir."
