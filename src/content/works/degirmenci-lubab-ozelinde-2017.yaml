abstract: "İslam fıkhının içerisinde yer alan, fıkhın varlığı ile beraber ortaya çıkan, öz ifadeler şeklinde dile getirilen ve belirli bir eserde toplama faaliyeti Şâfiî mezhebinde Tacceddin es-Subkî, Hanefi mezhebinde İbn-i Nuceym'in el-Eşbâh ve'n-Nezâir gibi eserlerinde müstakil bölümlerde hayat bulan ve mecellede kanun maddeleri şeklinde yer alan fıkıh küllî kâidelerini ele aldık. Bu kâideleri, araştırma konusu yaparken Meydânî'nin el-Lübâb fi Şerhi'l-Kitab eserini kaynak olarak seçtik. Tezimiz üç bölümden oluşmakta, giriş bölümünde tezin önem, amaç ve yöntemine ilişkin bilgilerin yanında müellifin hayatı ve eserleri hakkında öz bilgiler verdik. Birinci bölümde kâide ve küllî kavramları, benzer kavramlarla farklılık ve benzerliklerini, küllî Fıkıh kâidesinin delil olup olmama noktasında bilginlerin görüşlerini, küllî kâidelerin tarihsel gelişimi konusunda öz bilgi, alanda meşhur olan eserler, kâidelerin kısımlarını ve kaynaklarını zikrettik. İkinci bölümde ise çalışmamızın bel kemiğini oluşturan Lübâb kitabındaki küllî fıkıh kaîdelerini eserde geçtiği ifadelerle kaleme alarak, kâidenin içinde yer alan kavramları lügat ve ıstılah açısından tanımlamak suretiyle, kâideye örnek teşkil eden misalleri aynı eserden aldık. Küllî Fıkıh kâidelerle alakalı olan önemli konular işlenmiş, varolan kâideler ortaya konmuştur."
