abstract: "Hayatımızın rehberi olan Kur'ân tarih boyunca muhatapları tarafından çeşitli şekillerde anlaşılan bir kitaptır. Bizde bu çalışmamızda H.I. asırda yaşamış olan Mukâtil b.Süleymân ve H.XI. asırda yaşamış olan İsmail Hakkı Bursevî'nin ahkâm ayetlerini nasıl ele aldığını karşılaştırmaya çalıştık. Çalışmamız giriş,birinci bölüm ve sonuç olmak üzere üç bölümden oluşmaktadır. Giriş bölümünde Mukâtil ve Bursevî'nin hayatları ve yaşadıkları dönemler hakkında bilgi vermeye çalıştık. Birinci bölümde Mukâtil ve Bursevî'nin Kur'ân'daki ahkâm ayetlerinin muamelatla ilgili olan yorumlarını ele aldık. Sonuç bölümünde ise Mukâtil ve Bursevî'nin tefsir yöntemleri ve Kur'ân'ın çeşitli şekillerde anlaşılmasının sebepleri hakkında bilgi vermeye çalıştık."
