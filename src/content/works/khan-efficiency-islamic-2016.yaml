abstract: "İslam tam bir hayat kılavuzudur. Hayatın her bir alanında inananlarına rehberlik eder. Kendine özgü eğitim, adalet, sosyal ve ekonomik sistemleri vardır ve inananlarının hayatlarını bunlara göre sürdürmelerini gerektirir. İslam'ın önemli parçalarından biri finansal sistemidir. İslami finans sistemi, sadece ekonomik yönden rehberlik etmesiyle değil, işlemlerin ahlaki ve etik boyutunu da kapsaması münasebetiyle eşsiz bir sistemdir. Bankacılık sistemi, tüm finans sistemlerinin hayati öğesidir. İslam, bankacılığın önemini tanımakta ve bankacılık sisteminin, İslam prensiplerine bağlı kalmasını gerektirmektedir. Bu çalışma Türkiye'de İslami finans ve bankacılığın gelişimini göstermek için yazılmıştır ve üç bölümden oluşmaktadır. Çalışmanın ilk bölümü iki soruya cevap vermektedir; İslami finans nedir ve İslami bankacılığın ve finansın yöntemleri nelerdir? Perakendecilik, ortaklık ve girişimler için İslami finans yöntemleri, İslami finansın temel piyasa ürünleriyle keşfedilmektedir. İkinci bölüm Türkiye'de İslami finans ve bankacılığın gelişim süreçten bahsedilmektedir, Türkiye'de faaliyetlerini sürdüren 4 banka üzerinde durulmuştur. İkinci bölümde aynı zamanda İslami finansın Türkiye toplumuna ve ekonomisine katkısı da ele alınmıştır. Tezin üçüncü bölümünde Veri Zarflama Analizi kullanılarak, hangi sektörün daha etkin olduğu ortaya konmuştur. Veri Zarflamada 3 katılım bankası ve 26 ticari banka ele alınmış ve 2010-2015 arası altı yıllık veri incelenmiştir. Çalışma sonucunda genel olarak incelenen dönem için katılım bankalarının geleneksel bankalardan daha etkin oldukları gözlemlenmiştir."
