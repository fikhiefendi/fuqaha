abstract: "İbn Kudâme'nin el-Muğnî adlı eserinin nikâh bölümünde Şâfiî mezhebine nisbet ettiği görüşlerin değerlendirilmesini amaçladığımız bu çalışmamız; giriş, iki ana bölüm ve sonuç bölümü olmak üzere dört bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı ve yöntemi hakkında kısa bilgi verildikten sonra ikinci bölümde İbn Kudâme'nin hayatı, ilmî kişiliği ve başta el-Muğnî olmak üzere eserleri hakkında genel bir bilgi verilecektir. Üçüncü bölümde nikâh ile ilgili genel bir bilgi verildikten sonra çalışmamızda esas aldığımız el-Muğnî'nin nikâh bölümünde Şâfiî mezhebine nisbet edilen görüşler Şâfiî mezhebine ait bazı temel kaynaklarla mukayese edilerek değerlendirilecektir. Sonuç bölümünde ise mezkûr eserin ilgili bölümünde Şâfiî mezhebine nisbet edilen görüşlerin Şâfiî mezhebiyle aynı olup olmadığı veya mezhepte yer alan iki görüşten biri olduğu ya da mezhep içi ihtilaflı olduğu şeklinde tasnifi yapılarak ortaya konulacaktır."
