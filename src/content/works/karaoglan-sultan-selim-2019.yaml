abstract: "Osmanlı Devleti, kuruluşundan itibaren hızlı bir devletleşme sürecine girerek, geniş bir coğrafyaya yerleşmiştir. Böyle bir gelişmenin sadece askeri güçle olamayacağı muhakkaktır. Osmanlı Devleti, fethettiği toprakların halkını kendi halkı saymış, buraların yönetimini başıboş bırakmamış, buraların idaresiyle ilgili askeri, ekonomik, kültürel ve dini alanlarda yeni düzenlemeler yaparak en güzel şekilde yönetme yoluna gitmiştir. Böylece kısa bir sürede dönemin en büyük devletleri arasında kendisine yer bulmuştur. Osmanlı Devleti, her dönemde özellikle de kuruluş ve yükselme dönemlerinde yetenekli padişahlar ve kıymetli devlet adamları yetiştirmiştir. Bu durum Divan-ı Hümayun'un ve diğer taşra teşkilatlarının mükemmel bir şekilde işletilmesiyle sonuçlanmıştır. Sultan II. Selim, diğer padişahlar gibi iyi bir eğitimin sonunda Osmanlı tahtına oturmuş 11. Padişahtır. Sultan II. Selim, kendisinden önceki padişahlar kadar yetenekli olmasa da, onların yolunu takip etmeye çalışmış, devlet idaresini Sokullu Mehmet Paşa gibi yetenekli bir devlet adamına teslim ederek ülkeyi yönetme gayreti içinde olmuştur. Bu gayretin sonucunda Kıbrıs, Yemen ve Tunus fethedilmiştir. Dönemin teknik imkânlarından yararlanarak Don-Volga ve diğer kanal projeleriyle dünya siyasetindeki yerini almaya çalışmıştır. Uzak bölgelerdeki Müslümanlara hem askeri hem de insani yardımlar yapılmış, Müslümanların koruyucusu kimliğiyle görevini yerine getirmeye çalışmıştır. Şeyhülislam Ebüssuud Efendi rehberliğinde ilim ve kültür alanında birçok çalışma yapılmış, yüzlerce ilim adamı ve bir o kadar da ilim eseri meydana getirilmiştir. Sultan II. Selim'in ve Mimar Sinan'ın üstün gayretleriyle bu döneme damga vuran Edirne Selimiye Camii başta olmak üzere Anadolu'da ve hâkimiyeti altındaki bölgelerde birçok mimari eser meydana getirilmiştir. Bütün bu gelişmelere rağmen hem batı kaynaklarında hem de bazı Müslüman tarihçiler tarafından Sultan II. Selim'in şahsiyeti ölçüsüzce eleştirilmiş ve padişahlık yaptığı dönem sönük olarak nitelendirilmiştir. Biz bu çalışmamızda, Sultan II. Selim dönemini siyasi, askeri ve kültürel yönlerden inceleyerek bilgiler sunmayı amaçladık. Bununla birlikte Sultan II. Selim'in şahsına ve bu dönemin yönetim anlayışına yöneltilen eleştiriler ve bu eleştirilerin haksız olduğunu delilleriyle ispatlamaya çalıştık."
