abstract: "Kur'an perspektifinde ekonomik bozulmanın önlenmesi konusu çok önemli bir yere sahiptir. Çünkü beşerî hayatın ekonomi ile direkt olarak bir ilişkisi vardır. Dinî anlamda ekonominin hedefi insanların maddî ihtiyaçlarının karşılanmasıdır. Ekonominin İslamda önemli bir yeri oluduğu için bu konuda Kur'an'ın farklı yerlerinde birçok açık nas varid olmuştur. Bütün bu naslar, ekonominin korunması, geliştirilmesi ve ekonomik bozulmanın önlenmesini amaçlamaktadır. Ekonomik bozulmanın birçok iktisadî, siyasî ve ahlakî sonuçları ortaya çıkmaktadır. Bugün dünyaya baktığımızda gerek İslam devletlerinin gerekse diğer devletlerin çoğunun karşılaştığı problemlerin ekonomik bozulmadan kaynaklandığını görmekteyiz. Hatta günümüzde dünya devletleri arasındaki savaşlar, ekonomi savaşlarından başka bir şey değildir. Bu bakımdan iktisat açısından İslam nizamının nekadar mükemmel olduğunu anlamaktayız. Çünkü İslam, ekonominin korunması ve bozulmaması için çok önemli iktisadî ilkeler getirmiştir. Bu önemli İslamî ilkelerle ne önceki dinlerin ne büyük imparotorlukların ne de bugünkü modern gelişmiş ülkelerin iktisadî prensipleri boy ölçüşemez."
