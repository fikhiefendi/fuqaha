abstract: "Türk tarihi açısından oldukça önemli bilgiler içeren Şer'iyye Sicilleri, Osmanlı tarihinin önemli arşiv kaynaklarından biridir. 2143 numaralı Safranbolu Şer'iyye Sicili H.1295/M.1878 – H.1296/M.1879 yıllarını kapsamakta ve bir tereke defteri özelliği taşımaktadır. Giriş bölümünde Safranbolu'nun coğrafi konumu, tarihçesi, idari yapısı, nüfusu ve ekonomik durumu hakkında bililer verilmiş devamında Osmanlı hukuk yapısı ve şer'iyye sicilleri hakkında bilgilere yer verilmiştir. Belgelerin içerikleri özet olarak verilmiştir. Transkripsiyon yapılarak veriler tablolara dönüştürülmüş, çalışma, değerlendirme ve sonuç kısmı ile sonlandırılmıştır"
