abstract: "Malî muamelelerin hükümleri, bu hükümlere ilişkin olarak meydana gelen bir takım müessir durumlardan etkilenir. Hükümlere etki eden bu hususlar sözlü ifadeler ve benzerinde olduğu gibi sarih olabileceği gibi şahıslardan sadır olan bazı fiiller gibi zımnî de olabilir. Bu çalışma, fiilî tasarrufların mali muamelelere ilişkin fıkhî hükümlerin çeşitli yönlerine etkisini açıklamak üzere gerçekleştirilmiştir. Fiilî tasarrufların bir kısmı malî muamelelere bitiştiğinde daha öncesinde mevcut olmayan bir takım hukukî sonuçlar doğurur. Bu sonuç tasarrufun inşası yönünde olabileceği gibi sahihlik, bağlayıcılık, fesih, mülkiyetin intikali, tazmini hak etmek gibi hususlarda da olabilir. Bu çalışma fiilî tasarrufların yalnızca sahih akitlere özgü olmadığı, akdi bozan durumları ortadan kaldırmak suretiyle fasit akitlerin sahih hale getirmesine kadar uzanabileceğini de ortaya koymaktadır. Çalışmamız fiilî tasarrufların malî muameleler üzerindeki etkilerinin bu tasarrufların ilgili olduğu akitlerin türlerine bağlı olarak değişebileceğini de göstermektedir. Örneğin ribevî mallar üzerine yapılan akitlerde akde konu olan malın kabz edilmesi akdin sıhhatini etkilediği halde diğer akitlerde kabzın akit üzerindeki etkisi farklı olabilmektedir. Mesela karz, hibe ve icare gibi kimi akitlerde kabz malın mülkiyetinin intikal etmesi üzerinde etkili olurken satım akdinde tazmin yükümlülüğünün intikal etmesine etki etmektedir. Çalışmanın ortaya koyduğu bir başka husus ise fiilî tasarrufların hukukî neticelerinin söz konusu fiilî tasarrufun tabiatına göre değişiklik gösterdiği hususudur. Zira çalışmada fiilî tasarrufun tabiatının farklı türlere sahip olduğu, söz gelimi akde konu olan şeyin verilmesi, kabz edilmesi, itlafı, başka mallarla karıştırılması gibi bir takım tasarrufların söz konusu olabileceği, bu fiillerin tümünün doğasının farklı olduğu ortaya konulmuştur. Söz gelimi cuale veya mudarebe akdinde işe başlamanın etkisi satım akdinde akit konusunun itlaf edilmesinden farklıdır. İlki akdin bağlayıcı hale gelmesine etki ettiği halde ikincisi akdin feshedilmesine etki etmektedir. Yine satım akdinde rızaya delalet eden akit mahallinin tesliminin etkisi emanet akitlerinde akdin mahallinin itlaf edilmesinin etkisine göre farklılık göstermektedir. İlki akit sigasının inşasına etki ederken ikincisi tazminat hakkı elde etmeye etki etmektedir. Bütün bunlardan \"fiilî tasarrufun hukukî etkisi\" ifadesi ile kastedilen şeyin \"iradenin fiil yoluyla ortaya konulması\" ifadesinde kastedilenden daha kapsamlı olduğu anlaşılmaktadır. Araştırmamızda fiilî tasarrufların malî muamelelere etkisi konusunda mütekâmil bir teori ortaya koymaya ve aynı zamanda bu teorinin fıkıh mezheplerinin ictihadları üzerinde nasıl uygulandığını göstermeye çalıştık. Anahtar Kelimeler: Malî muamelat, fiilî tasarruflar, akitler, irade, tazmin"
