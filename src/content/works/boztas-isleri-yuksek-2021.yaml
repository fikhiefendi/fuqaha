abstract: "Çalışmamız, Diyanet İşleri Başkanlığı bünyesinde kurulan, Din İşleri Yüksek Kurulunun faizsiz finans uygulamaları hakkındaki görüşlerini tespit etmek, değerlendirmek ve müstakil bir eserde toplayarak literatüre kazandırmak amacıyla hazırlanmıştır. Çalışmada, herhangi bir eserde toplanmamış dağınık olan fetvalar ve kararlar, konular kapsamında kategorize edilerek bir araya getirilmeye gayret gösterilmiştir. Çalışmamız, iki bölüm şeklinde oluşturulmuştur. İlk bölümde, Diyanet İşleri Başkanlığı ve Din İşleri Yüksek Kurulunu tanıtacak bilgilere yer verilmiştir. İkinci bölümde ise Kurulun fetvaları farklı başlıklar altında kategorize edilerek ele alınmış, yalnızca fetvaların zikredilmesiyle yetinilmeyip, öncesinde konuyu izah etmek amacıyla meselenin genel hatlarına değinilmiş, akabinde fetvalara yer verilmiştir. Çalışma yapılırken nitel araştırma yöntemi kullanılmış, yetkili kişilerle görüşülmüş ve doküman analizi yapılarak veriler toplanmıştır. Kurulun genel itibarıyla faizsiz finans meseleleriyle ilgili çalışmalar yaptığı ve söz konusu meselelerle yakından ilgilendiği tespit edilmiştir. Akabinde ise elde edilen verilerden hareketle Kurulun, söz konusu meseleler hakkında, halkı çeşitli platformlardan bilgilendirdiği görülmüştür. Ancak resmî, yazılı, halka açık ve televizyon programlarındaki fetvaların bazılarının yeterli, açık, detaylı olmadığı ve bir kısmının da güncel ihtiyacı tam anlamıyla karşılayamadığı kanaatine ulaşılmıştır."
