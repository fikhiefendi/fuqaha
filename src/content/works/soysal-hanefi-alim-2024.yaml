abstract: "Bu çalışmada Şam-Dımaşk Hanefî müftüsü Ali el-Murâdî'nin (1132-1184/1720-1771) Rafızîlik ve Dürzîlik hakkındaki görüşleri konu edilmiştir. Ali el-Murâdî'nin Rafızîlik ve Dürzîlik özelinde iki risalesi bulunmaktadır. Rafızîlerle evlilik konusunu ele aldığı er-Ravzu'r-Râyiz fî 'Ademi Sıhhati Nikâhi' Ehli's-sünne li'r-Revâfiz adlı eseri ve Dürzîler hakkında kaleme aldığı Akvalü'l-Eimmeti'l-Âline fî Ahkâmi'd-Dürûz ve't-Teyâmine adlı risalesi Ehl-i sünnet alimlerinin bu mezhepler hakkındaki fetvalarını içermektedir. Bu bakımdan bu fetvalar Hanefî literatürde mezheplerle ilgili kaynak olma özelliği kazanmaktadır. Bu çalışma müftü ve fakihlerin fetvalarının İslam Mezhepleri Tarihi alanında önemli bir yer tuttuğunun bir örneğidir. Çalışma giriş ve üç bölümden oluşmaktadır. Birinci bölümde Ali el-Murâdî'nin ailesi, hayatı ve eserleri ele alınmıştır. Eserleri bölümünde konumuzla alakalı olan“er-Ravzu'r-Râyiz fî 'Ademi Sıhhati Nikâhi' Ehli's-sünne li'r-Revâfiz”ve“Akvalü'l-Eimmeti'l-Âline fî Ahkâmi'd-Dürûz ve't-Teyâmine”adlı risaleleri hakkında bilgiler verilmiştir. İkinci bölümde Ali el-Murâdî'nin Dürzîlik mezhebine bakışı konu edilmiştir. Üçüncü bölümde ise Ali el-Murâdî'nin Rafızîlik mezhebine bakışı konu edilmiştir."
