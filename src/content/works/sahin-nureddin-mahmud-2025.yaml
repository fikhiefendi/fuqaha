abstract: "İslam dünyasında Ehl-i Sünnet'in kurumsallaşma süreci, Abbâsîler döneminde siyasî parçalanma ve mezhepler arası tartışmalarla şekillenmiş, Ahmed b. Hanbel gibi âlimlerin etkisiyle kimlik arayışı başlamıştır. Selçuklu döneminde Nizâmülmülk öncülüğünde kurulan Nizâmiye Medreseleri ve Gazâlî'nin çalışmaları, Ehl-i Sünnet'in ilmî otoritesini güçlendirmiştir. Ancak Haçlı Seferleri ve Şiî güçlerin etkisi, İslam dünyasında yeni bir birlik ve siyasal düzen ihtiyacını doğurmuştur. Bu ortamda Nûreddîn Mahmûd Zengî, Ehl-i Sünnet'i siyasî ve ilmî açıdan güçlendirmeyi hedeflemiş, medreseler, dâru'l-hadisler ve hankâhlar kurarak tasavvufî ve ilmî kurumları desteklemiştir. Hanefî mezhebine bağlı olmakla beraber, mezhepler arası uyumu gözetmiş, Şafiî ve Hanbelîlerle iş birliği yapmıştır. Kuşeyrî-Gazâlî çizgisindeki tasavvuf anlayışını benimseyerek Sünnî kimliğin pekişmesine katkı sağlamıştır. Nûreddîn'in ilmî ve siyasî politikaları, Selçuklu mirasını devralarak Sünnîliği yeniden ihya etmeye yönelmiş, Haçlılara karşı cihad ruhunu canlandırmıştır. Bu miras, halefi Selâhaddîn Eyyûbî tarafından devam ettirilmiş ve Haçlılar karşısında güçlü bir birlik oluşturulmuştur. Böylece Nûreddîn Mahmûd Zengî, sadece siyasî bir lider değil, Ehl-i Sünnet'in kurumsallaşmasında da önemli bir dinî ve ilmî öncü olarak tarih sahnesinde yer almıştır."
