abstract: "Abdülvehhâb eş-Şa'rânî (v. 973/1565), yaşadığı dönem itibariyle sosyal ve kültürel hayatı yansıtan önemli eserler vermiştir. O, eserlerinin pek çoğunu tasavvuf ve ahlak alanında yazmıştır. Bir sûfî olmasına rağmen onun, en önemli eserlerinden birisi, fıkhî ihtilâflar alanında telif ettiği el-Mizanü'l-Kübrâ'dır. Şa'rânî'nin fıkhî ihtilâflara temas etmesinin amacı, diğer eserlerinde olduğu gibi sosyal ve manevî bir gayeye yöneliktir. Şa'rânî, kendi döneminde var olan katı mezhep taklitçiliğine karşı bir yöntem geliştirme ihtiyacı hissetmiştir. Ayrıca Şa'rânî, Mizan adını verdiği bu yöntem sayesinde şeriat ve hakikat taraftarları arasındaki tansiyonu düşürme ve onlar arasında bir denge kurma gayesi taşımıştır. Onun bu yöntemini yazdığı el-Mizanü'l-Kübrâ kitabının mukaddimesi, şeriat-hakikat dengesinin gözetildiği bir ihtilâflar usûlü olarak kabul edilebilir. Şa'rânî, sûfî bir yaklaşımla ele aldığı hilâf ilmine, yeni açılımlar getirmiştir. Ancak o, gelenekten yola çıkarak irfânî söylemle geleneği doğrulama yoluna gitmiştir. O, her konuda fıkhın sınırlarını koruyan bir uslûpla Mizan'ı kaleme almıştır. Şa'rânî'nin Mizan'da ortaya koyduğu en temel iddiası, bir konuda verilen bütün ictihadların şeriate dayanmasıdır. Mizan'da hiçbir ictihad, şeriat dışında sayılmaz. Şeriat birdir ve ondan gelen emirler tahfif-teşdid adı altında ikili bir kategoride değerlendirilir. İnsanlar iman veya beden yönüyle güçlerine göre ictihadlara muhatap olurlar. Güçlü iseler teşdid, zayıf iseler tahfif olan hükümle amel etmek zorundadırlar. Ancak bu zorunluluk herkes için geçerli değildir. Seyr-i sülûkünü tamamlamış ve keşfen şeriate erişmiş olan kimseler, artık bu zorunlu seçime tabi olurlar. Bu seviyede olmayanlar ise bir mezhebi takip etmeleri daha doğrudur. Zira bu kimselerin bir mezhebe tabi olmamaları durumunda telfike düşme tehlikeleri bulunur. Şa'rânî, Mizan yönteminde azimetle amel etmeye vurgu yaptığı kadar şartlarını taşıyan kimselerin ruhsatla amel etmeyi terk etmemelerini tavsiye etmesi önemlidir. Ayrıca onun, müctehid imamları insan-ı kâmil mertebesine koyması, onun mezheplerin otoritesini kabul etmesini netice vermiştir. Ona göre hiçbir mezhebin birbirine üstünlüğü olmamakla beraber her mezhebin eşsiz bir değeri vardır. Şa'rânî'nin bütün ictihadları şeriat dahilinde kabul edip musavvibe görüşünü takip etmesi ve ihtilâflara ayrı bir önem atfetmesi Mizan'ı hilâf alanında yazılmış diğer eserlerden ayıran önemli bir husustur. Onun, İslâm tarihinde ayrışmalara sebebiyet veren fıkhî ihtilâflara daha geniş bir perspektiften bakması ve fetvalar arası geçişi kolaylaştırması, onun hilâf ilmine getirdiği bir yenilik olarak kabul edilebilir. Şa'rânî'nin fıkhî ihtilâflara kazandırdığı bu genişlik ve esneklik ile taklidin sertliğine karşı duruşu, kendisinden sonra özellikle IX. ve XX. yüzyılda fıkıhta tecdit yapmak isteyenlere ilham kaynağı olmuştur."
