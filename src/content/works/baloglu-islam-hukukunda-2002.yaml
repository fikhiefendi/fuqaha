abstract: "ÖZET Konu. İslam hukukunda rızanın cezai sorumluluğa etkisi Anahtar kelimeler, rıza, cezai sorumluluk Tezin konusunun İslam hukukunda rızanın cezai sorumluluğa etkisi olarak seçilmesindeki amaç, ikinci ve üçüncü bölümlerde ele alman mala, cana, organlara karşı işlenen suçlara izin vermenin islam hukuku açısından doğurduğu sonuçlardır. Araştırma boyunca rıza konusu ve suçun mağdurunun rızası karşılaştırmalı bir şekilde ele alınmış, hukuki kültür mirasımızda önemli yeri olan mezheplerin görüşlerine yer verilmiş, azda olsa modern Türk hukukundan ve yabancı ülkelerin uygulamalarından örnekler verilmiştir. Sonuçta, İslam hukukunda suça maruz kalan kişinin failin fiiline razı olmasının, o fiili mubah hale getirmeyeceği ancak mala karşı, cana karşı ya da organlara karşı işlenen suçlarda suça izin vermenin, suçun unsurlarından birini ortadan kaldırdığı için suçluya verilen asli cezaların da verilemeyeceği ortaya çıkmaktadır. İslam hukukunda, feragat ve devri caiz olmayan temel hakların başında insanın hayat hakkı olup, İslam'ın temel prensiplerine göre, insan kendi yaşamına devam etme ya da son verme hakkına sahip kılınmamıştır. Dolayısıyla insanın kendi hayatını kısaltan ya da tamamen ortadan kaldıran tasarruflanmn hukuken geçersiz olduğu bu çalışmanın en önemli sonuçlanndandır. X"
