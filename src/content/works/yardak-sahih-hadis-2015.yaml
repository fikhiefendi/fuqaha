abstract: "Giriş Kısmında; Şia ile sahih kelimelerinin tahlili, Şia fırkaları, Usûlu'l-Hadis İlmi ve Şia'da hadis ilminin doğuşu konuları ele alınmıştır. Birinci Bölümde; Şia'nın hadis/sünnet'e bakışı ile kabul ve ret açısından hadisler, ravi sayısı açısından hadisler, senedin kaynağı açısından hadisler, hüccet olma açısından hadis çeşitleri ve Usûlu'l-Erbaa kısaca ele alınmıştır. Bu kaynaklarla ilgili yapılan değerlendirmelere yer verilmiş ve açıklamalar yapılmıştır. İkinci Bölümde; Şia'da sahih hadis, sahih hadiste aranan şartlar, hadis râvilerinde aranan şartlar, sahih hadisin mertebeleri, hadisleri tercih etme metodu ve ölçüleri ile metin tenkidi konuları üzerinde durulmuştur. Sonuç Bölümünde ise, araştırma neticesinde varılan sonuç ve kanaatler paylaşılmıştır."
