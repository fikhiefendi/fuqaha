abstract: "Bu tezin araştırması (Tarihu'l-İctihad fî Tefsîri'l-Kur'an kehanet çağında yoldaşlar ve takipçiler ve modern çağda )'ini üç ana ve tali eksende ele almaktadır, her biri Kuran Kerim tefsirinde içtihat tarihinde tarihsel bir çağı temsil etmektedir, her bir çağda Kuran ayetlerinin yorumunu etkileyen yeni gelişmeler ortaya çıkmıştı:- Birinci Eksen: Peygamberlik, çağında ictihad ashabi kiram ve tabiin çağında içtihat, Peygamberimiz S.A.V. tek şeriat koyan ve tek tefsirci idi, ve sahaba din konusunda bilmedikleri konuları, buna Kuran Kerim ayetleri tefsiri dahil ona müracaat ediyordu, Peygamberimiz S.A.V. 'ın metodolojisi Kuran Kerimi yine Kuran Kerim ile yada sahabenin sorduğu ayetleri tefsir ederdi, yada ayet okuyup tefsir ederdi, bazen de Peygamberimiz S.A.V. sahabenin tefsirini onaylardı. Daha sonra sahabeler çağı başladı, Kuran Kerim Peygamberimiz S.A.V.'e göre tefsir ediyorlardı, aksi halde Dil Bilim ve sanatlarına baş vururlardı, orada da bulamazlar ise içtihat ederlerdi ve tabiinler için tefsir okulları kurdular ve Bilim tefsirini yaydılar, metodları ise sahabe metodu idi. Tabiin döneminde ise Israil rivayetleri yayıldı ve dayanaksız rivayet ediliyordu ve hatta yalancılıkla Peygamberimiz S.A.V.'a dayandırılıyordu ve dolayısı ile Kuran Kerim tefsirini çok etkiledi. İkinci Eksen: Tedvin döneminde ictihat, Bilimler zirveye ulaşana kadar yayıldı, buna tefsir bilimi dahil, yeni tefsir türü ortaya çıktı o da fikir ile tefsir, daha önceleri tefsir Peygamberimiz S.A.V. ve sahabelerden gelen eserlere dayanıyordu, her tefsirci Kuran Kerim kendi düşüncesine göre tefsir ediyordu. Tefsir, sahih eserlere, dil bilgisine ve tefsirde doğru metoda dayanmaktadır. Bu tefsir mahmut düşünceye dayanır, ama mezhebe ve gruplara dayanıyorsa ve tefsirde doğru şartları gözetlemiyorsa bu tefsir zem olunmuş düşünce ile tefsir sayılmaktadır. Bu çağda farklı dillere Kuran Kerim tefsiri ortaya çıkmıştır, bu nedenle kasıtlı yada kasıtsız tefsire yansıyan bir çok hata meydana gelmiştir çünkü tercümanlar iki dili hakim değildir yada mezheplerinin tarafını tutarak tefsir yaparlar, dolayısı ile Kuran metinlerinin indirilmesindeki Allah C.C. amacı tercüme ile bozulmuştur. Üçüncü Eksen:Modern çağda tefsir, modern çağın yaşadığı bilimsel gelişim ve modern bilimsel buluşlar tefsirin yeni renklerinin ortaya çıkmasına neden oldu, bilimsel ve sosyal tefsir gibi, bazı tefsirciler farklı alanlarda modern buluşlar ve ayetler arasında bağ kurarak 4 Kuran Kerimdeki bilimsel mucizeleri ortaya çıkarmaya çalıştılar. Bu çağda tefsiri etkileyen başka bir faktör ise oryantalizmin ve Oryantalistlerin ortaya çıkmasıdır, bunlarda iki gruba bölünmüştür, bir grup Kuran kerimin doğruluğunu hedef alarak İslam ve Müslüman temel hedefleri olmuştur yada Kuran Kerimi amaçlarına göre Din Usulü alimlerin istenilen anlama ulaşmak için belirttikleri doğru metottan uzak tefsir etmişlerdir, diğerinin amacı ise hakkı beyan etmek ve doğru İslam hedeflerini belirlemektir, bunlar kitapları ve yazıları ile İslam ve Müslümanı korumuşlardır ve hedeflerini ve temiz niyetlerini gösteren izler bıraktılar."
