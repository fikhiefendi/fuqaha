abstract: "Osmanlı toplumunda vakıflar, bayındırlık hizmetlerinden dini hizmetlere, eğitimden finansman sağlamaya kadar pek çok alanda toplumun ihtiyaçlarını karşılamış ve bu hizmetleri kar değil hayır amacıyla yürütmüşlerdir. Vakıfların bir türü olan para vakıfları da kendilerine vakfedilen nakit sermayeleri faizsiz usuller ile işleterek elde ettikleri gelirler ile bu hizmetlerin karşılanmasında önemli rol oynamışlardır. Para vakıfları aynı zamanda toplumun faizsiz finansman ihtiyacını karşılamak suretiyle İslam dini tarafından haram kabul edilen faizin ortaya çıkardığı dini ve iktisadi problemlerin önüne geçilmesine de katkı sağlamıştır. Üsküdar Mahkemesi 417 numaralı defter kayıtları incelenerek 1139 senesi Üsküdar vakıflarının gelirleri, giderleri, nakit sermaye işletme yöntemleri, kiralama yöntemleri gibi konularda bir takım verilerin ortaya çıkarılıp günümüze aktarılması çalışmanın temel amacı olmakla beraber temel veri kaynağının muhasebe kayıtları olmasından dolayı Osmanlı muhasebe sisteminde kullanılan merdiven yöntemi incelenmekte ve 417 numaralı defter örneğinde vakıflarda muhasebe konusu da ele alınmaktadır. Çalışmada ilk olarak merdiven kayıt yöntemi ve vakıflarda muhasebe konusu ele alınmakta olup vakıfların Osmanlıda kullanılan muhasebe usulünü aynen uyguladıkları tespit edilmektedir. 2. Bölümde 18. Yüzyılın ilk yarısında Üsküdar vakıflarının nakit sermaye işletme usulleri, bu usullerden elde ettikleri gelirleri, bu işlemler için aldıkları teminatlar ve zimem , 3. Bölümde ise ilgili senede vakıfların sahip oldukları gayrimenkuller, elde ettikleri kira gelirleri ve kiracılar dair veriler ortaya koyulmaktadır."
