abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de Şer'iyye Sicilleridir. Ait oldukları dönem ve yer hakkında oldukça önemli bilgiler veren Şer'iye Sicillerinden faydalanma konusu, bugün için belli başına bir problem olmaktadır. Bu durum ise sicillerden faydalanma konusunu belirli bir metoda bağlı kılmayı zaruri hale getirmektedir. İşte bu açıdan Türkiye'de bulunan bütün sicillerin fihristlerinin yapılması zorunludur. Bu çalışmamızda, Türk tarihi ve kültürü açısından büyük bir önem taşıyan Şer'i ye Sicillerinden sadece bir tanesinin fihrist ve tanıtımının yapılması suretiyle, bu alanda yapılan çalışmalara bir örnek teşkil etmesi amaçlanmıştır. Osmanlı Devleti'nin yerel mahkeme kayıtları olan Şer`iye sicilleri şehir tarihçiliğinin en önemli kaynakları olduğu gibi sosyal, kültürel ve ekonomik açıdan son derece önemlidir. Bu çalışmada H.1182- 1195(M. 1768-1780) tarihlerini ihtiva eden ve 96 sayfadan oluşan 131 numaralı AyntâbŞer`iyyeSicilinin sayfasının transkript ve değerlendirilmesi yapıldı. Sicilde yer alan belgelerin miras, , tereke kayıtları, alacak- verecek davaları, vasi ve vekil tayini, nafaka talepleri, tarla satışı, naibe tayini, gedik tımarı ve buyururdu gibi konularla ilgili olduğu görüldü. Neticede Gaziantep'in yaklaşık iki buçuk asır önceki durumunun anlaşılmasına katkı sağlandı. Ayrıca Müslüman ahalinin durumunun ve sosyal yapısının nasıl olduğu hakkında bilgi edinildi."
