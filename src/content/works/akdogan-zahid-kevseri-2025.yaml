abstract: "Bu tez çalışması, İslam hukuk tarihinde hadis ve fıkıh metodolojileri arasındaki tatışmalara odaklanmakta ve bu çerçevede Ebû Hanîfe'ye (ö. 150/767) yöneltilen hadis karşıtlığı eleştirilerini, Zâhid el-Kevserî'nin (ö. 1952) kaleme aldığı en-Nüketü't-Tarîfe fî't-Tehâdüsi ʿan Rudûdi İbn Ebî Şeybe ʿalâ Ebî Hanîfe adlı eseri ekseninde değerlendirmektedir. Kevserî, bu reddiyesinde, İbn Ebû Şeybe'nin el-Musannef'te Ebû Hanîfe'nin 125 meselede sünnete muhalefet ettiğine dair ileri sürdüğü iddialara ilmî bir savunmayla karşılık vermektedir. Araştırma, Kevserî'nin savunma yaklaşımını metot, içerik ve delil temelli analiz ederek hem klasik fıkıh usûlünü hem de Kevserî'nin dönemine özgü savunmacı ilmî geleneği gözler önüne sermektedir. Kevserî ve İbn Ebû Şeybe'nin (ö. 235/849) ilmî konumları, yaşadıkları dönemler ve yaklaşımları karşılaştırmalı biçimde ele alınmış; en-Nüketü't-Tarîfe'nin yapısı ve üslubu incelenmiş, eserin sadece polemik değil, sistematik bir ilmî müdafaa niteliği taşıdığı ortaya konmuştur. Kevserî'nin savunmasında sened tenkidi, metin analizi ve fıkıh usûlü ilkelerini birlikte kullanması, Ebû Hanîfe'nin yönteminin hem rivayet hem dirayet temelli olduğunu göstermektedir. Bu yaklaşımla, eleştirilerin büyük kısmının metodolojik farklılıklardan ve bilgi eksikliğinden kaynaklandığı belirlenmiştir. Bu bağlamda en-Nüketü't-Tarîfe, sadece bir reddiye metni değil; aynı zamanda fıkıh-hadis ilişkisini yeniden düşünmeye sevk eden, mezhepler arası ilmî tartışma geleneğine katkı sunan ve klasik usûl düşüncesini günümüz akademik düzlemine taşıyan kıymetli bir eserdir. Bu çalışmayla birlikte, Zâhid el-Kevserî'nin entelektüel mücadelesi, Hanefîliğin rivayetle dirayet arasındaki dengeyi gözeten usûl anlayışı ve Ebû Hanîfe'nin ilmî mirası yeni bir perspektifle yeniden değerlendirilmiştir."
