abstract: "İmam Ebü'n-Nasr el-Kuşeyrî (ö. 514/1120), hicrî beşinci yüzyılda tefsir alanında öne çıkan âlimlerden biridir. Kendisi, meşhur sûfî İmam Ebü'l-Kāsım el-Kuşeyrî'nin oğludur ve babasından sûfî mektebi ile onun terbiyeci yönünü miras almıştır. Ancak, ilmî serüveninde bağımsız bir çizgi benimsemiş, şer'î ilimlerde derinleşmiş ve özellikle tefsir ile kıraat ilminde büyük bir yetkinlik sergilemiştir.“Et-Teysîr fi't-Tefsîr”adlı tefsirinde, sağlam bir fıkhî anlayış, köklü bir usûlî temellendirme ve yüksek seviyede dil ve belâgat hassasiyeti bir araya gelmektedir. Bu yönüyle eser, daha fazla ilgi ve tahkiki hak eden önemli kaynaklardan biridir. Bununla birlikte, söz konusu eser büyük ehemmiyetle korunmuş ve yüzyıllar boyunca yazma halinde kalmış, 2022 yılında ise ilk defa neşredilmiştir. Bu durum, akademik alanda eser üzerine derinlemesine yapılan çalışmaların yokluğunu da açıklamaktadır. İşte bu eksiklikten hareketle hazırlanan bu çalışma, Kuşeyrî'nin“Et-Teysîr fi't-Tefsîr”adlı eserindeki fıkhî ve usûlî metodunu takip etmeyi ve özellikle ahkâm âyetlerine yaklaşım biçimini ortaya koymayı hedeflemektedir. Ortaya konan inceleme, onun köklü bir tefsirî derinliğe, yüksek bir dil zevkine sahip olduğunu ve anlamları, fıkhî ve belâgî bir üslupla özgün bir şekilde ortaya koyabildiğini göstermektedi. Her ne kadar Kuşeyrî'nin fıkıh alanındaki müstakil eserleri günümüze ulaşmamışsa da, Taberî ve Vâhidî gibi müfessirlerin eserlerinde kendisinden yapılan nakiller, onun fıkıh ilmindeki yerini teyit etmektedir. Bu da“Et-Teysîr”de meseleleri mezhep taassubundan uzak bir şekilde, çoğu zaman Şâfiî olmakla birlikte farklı mezheplere de atıfta bulunarak ele aldığını açıkça göstermektedir. Ayrıca eserde, lafızların delâletleri, âm-hâs, mutlak-mukayyed, nâsih-mensûh gibi usûl-i fıkıh konularının da açıkça işlendiği görülmekte; bu da onun şer'î istinbât yöntemlerine ne denli vâkıf olduğunu ortaya koymaktadır Bu tez, İmam Ebü'n-Nasr el-Kuşeyrî'nin“Et-Teysîr”adlı tefsirinden hareketle onun fıkhî ve usûlî yöntemini incelemeyi ve özellikle ahkâm âyetlerine yaklaşım biçimini analiz etmeyi amaçlamaktadır. Tezin uygulamalı kısmı ibadetler bahsine ayrılmış olup, bu kısım Kuşeyrî'nin fıkhî bakışını ve dili ile kıraatleri anlam inşasında nasıl kullandığını ayrıntılı şekilde ortaya koymaktadır. Bu çalışmanın, zengin bir ilmî mirası ihyâ etmeye ve henüz yeni keşfedilmeye başlanan bu sahada ilmî katkı sunmaya vesile olması ümit edilmektedir."
