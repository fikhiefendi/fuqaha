abstract: "Bu araştırma; Katılım Bankalarının uyguladıkları birebir pazarlama faaliyetlerinin etkinliğini hem banka çalışanları hem de banka müşterileri tarafından ortaya koymak amacıyla gerçekleştirilmiştir.Amaç doğrultusunda hazırlanan anket formu; Ankara ili Keçiören İlçesinde bulunan Katılım Bankalarında görevli 67 çalışana ve bu bankalara ait 74 banka müşterisine uygulanmıştır.Araştırmada elde edilen veriler SPSS 17.0 istatistik paket programı aracılığıyla analiz edilmiştir. Anketlerden elde edilen veriler değerlendirilirken; banka çalışanlarının ve müşterilerinin tanımlayıcı özelliklerinin belirlenmesinde frekans ve yüzde istatistiklerinden, banka çalışanlarının birebir pazarlama uygulama ve banka müşterilerinin bankanın birebir pazarlama faaliyetlerini uygulama düzeylerine ilişkin algılarının belirlenmesinde ortalama ve standart sapma istatistiklerinden faydalanılmıştır. Araştırmanın hipotezlerinin test edilmesinde t-testi, Tek yönlü (Oneway) Anova testi kullanılmıştır. Ayrıca birebir pazarlama faaliyetlerini belirleyen boyutlar arasındaki ilişkiler korelasyon analizi yardımıyla incelenmiştir.Araştırma sonucunda; Katılım Bankası çalışanlarının birebir pazarlama faaliyetlerini etkili ve yüksek düzeyde uygulamaya koydukları, bu uygulamalarının da aynı düzeyde müşteriler tarafından algılandığı belirlenmiştir."
