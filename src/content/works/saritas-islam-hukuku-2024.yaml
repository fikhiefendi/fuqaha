abstract: "Günümüzde estetik amaçlı müdahaleler daha önce görülmemiş bir biçimde artış göstermiş ve hızla artış göstermeye de devam etmektedir. Bilim ve teknolojinin sağlık alanında oluşturduğu güven ortamı, insanları deforme olmuş bedenlerini iyileştirmeye yahut hali hazırdaki bedenlerini daha güzel görünmek için estetik amaçlı cerrahi müdahalelere rahatlıkla başvurabilecekleri düşüncesine sevk etmiştir. Tüketim kültürünün etkisi altına giren bedene yönelik müdahaleler zamanla kapitalist sistemin yeni ve güçlü bir ticaret kapısına dönüşmüştür. Batı kültürünün hükmettiği bu durum tüm toplumları etkilediği gibi İslam toplumunu da etkisi altına almıştır. Daha çok kadınların genç ve güzel görünmeye meyilli yapısıyla ilişkili olan söz konusu işlemler, bilhassa son zamanlarda erkekler arasında da ciddi anlamda artış göstermeye başlamış, iki cinsi de bu alanlara ciddi bir sermaye sarf etmeye itmiştir. Öyle ki tüm dünya genelinde estetiğe harcanan sermaye Afrika büyüklüğündeki bir kıtanın sağlık ve gıda ihtiyacını giderecek seviyeye ulaşmıştır. Bu alanda yapılan araştırmaların yetersiz olması kapitalist sistemin gelir kapısı olarak gördüğü estetik müdahalelere pek çok insanın sorgusuz bir şekilde başvurmasına sebebiyet vermektedir. Tezimiz, erkek bedeni üzerinde gerçekleştirilen estetik müdahaleler ile sınırlandırılarak daha önce müstakil bir başlık halinde herhangi bir araştırmaya konu olmayan faydalı bir çalışma sunma gayreti içerisinde olacaktır. Tezin birinci ve ikinci bölümleri erkek bedenine yönelik yasak ve meşru estetik müdahalelerin klasik eserlerde yer alan örneklerinin bulunması ve bu müdahalelerin gerekçelerinin tespit edilmesi üzerine yoğunlaşmaktadır. Tezin üçüncü ve nihai bölümü ise günümüzde artış gösteren ve erkekler tarafından tercih edilen estetik müdahalelerden saç ekimi, botoks ve jinekomasti ameliyatlarını ele almaktadır."
