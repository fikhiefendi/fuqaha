abstract: "Ahlakî değerlerin önemini yitirdiği günümüzde İslam hukukunun insanlığa yeniden yol gösterici olacağı düşüncesiyle“İslam hukukuna göre tecavüze uğrayan kadının hak ve sorumlulukları”başlığında tezimiz yazılmıştır. Tezimiz toplumda yerleşmiş yanlış uygulamaların kaynağının İslam hukuku olduğu düşüncesini değiştirmek ve geçmiş milletlerin yerel kanunlarından ve günümüzde de varlığını sürdüren töre kaynaklı olduğunu ispatlamak amacı gütmektedir. Tez yazılırken öncelikle ayet ve hadislerin daha sonra İslam hukukçularının klasik dönem eserlerinden istifade edilmiştir. Yakın zamanda Osmanlı dönemi araştırmaları üzerine yapılmış olan makale ve tez çalışmalarına da başvurulmuştur. Tezimiz giriş ve sonuç hariç iki bölümden oluşmaktadır. Birinci bölümde bu alanla ilgili kavramlara genişçe yer verilmiş daha sonra da ikinci bölümde tezimizin amacı dahilinde bulunan veriler toplanarak tezimiz tamamlanmıştır."
