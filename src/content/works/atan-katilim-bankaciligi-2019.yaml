abstract: "Türk Bankacılık sistemi içerisinde gün geçtikçe artan sayıları ve verdikleri hizmetler itibariyle yerini iyice pekiştiren katılım bankalarının gelecekte mali kesimin en önemli aktörleri arasında söz sahibi olmaları beklenmektedir. Katılım bankalarının vergilendirilmesi, kurulmaya başladıkları yıllarda; Özel Finans Kurumları adıyla çıkarılan düzenlemeler başta olmak üzere gelir ve harcama üzerinden alınan vergilerin kapsadığı yasalar ve idari düzenlemelerle vergilendirmekte iken, bu kurumların faizsizlik ilkesine göre faaliyet göstermeleri nedeniyle bazı sorunlar ortaya çıkmış, yeni yasal düzenlemelere ihtiyaç duyulmuştur. Ülkemizin gelişen ekonomik yapısı ve sayılarındaki artışla birlikte Katılım Bankalarının diğer çeşitli bankalardan ayrı bir yerde tutulması ve kendilerine özgü işleyişlerinden kaynaklanan vergisel problemlerin önüne geçmek üzere bu kuruluşların 5411 sayılı yasaya tabi tutulması söz konusu olmuştur. Ayrıca kurumlar vergisi, gelir vergisi, banka ve sigorta muamele vergileri ile diğer ilgili vergi kanunlarında yapılan değişiklerle birlikte vergilendirilmelerinde yaşanan sorunlar giderilmeye çalışılmıştır. Günümüz itibariyle katılım bankaları herhangi bir fark gözetilmeksizin diğer bankaların tabi oldukları tüm yasal ve idari düzenlemelere uymak durumundadırlar. Tezin amacı, katılım bankalarının vergilendirilmesi ile ilgili hem sorumlu hem de yükümlü sıfatı ile tabi oldukları vergilerin incelenmesi, uygulamada ortaya çıkan sorun ve çözüm önerilerinin değerlendirilmesidir."
