abstract: "Бул изилдөө Ислам укугу боюнча Куран жана Сүннөттүн негизинде жаныбарлардын этинен, сүтүнөн өндүрүлгөн азыктарды анализдөө, ошону менен бирге төрт мазхабда эти желген жана желбеген жаныбарларды аныктоо. Биринчи бөлүмдө Исламдагы адал ырыскы (азык-түлүк) түшүнүгүнө берилген маани жана адал, арам, макрух (жаман көрүлгөн) сыяктуу негизги терминдердин лексикалык жана терминологиялык аныктамалары каралды. Бул бөлүмдө адал жана арам түшүнүктөрүнүн шарияттагы орду, негизги ченемдери жана аларга байланыштуу Куранда белгиленген эрежелердин негизинде талдап, адал жана арам тууралу исламдагы негизги эрежелер баяндалды. Экинчи бөлүмдө жаныбарлардан алынган эттин адал же арам экендиги кайрадан каралып такталды. Аларды тактоодо Куран жана Сүннөт далил катары колдонулду. Ошону менен бирге эти адал же арам экендиги талаштуу болгон жаныбарлар төрт мазхабдын көз карашы боюнчада баяндалды. Үчүнчү бөлүмдө жаныбарлардан алынган азыктарды пайдалануучу шарттар жана шариятка ылайык союу ыкмалары тууралуу баяндалды. Жаныбарлардан этинен, сүтүнөн өндүрүлгөн азыктар, алардын адал же арам экендиги боюнча мазхабдар арасындагы талаштуу маселелерге анализ жүргүзүлдү. Изилдөөнүн жүрүшүндө талаштуу маселелерге далилдери менен көрсөтүп, ислам укукчуларынын көпчүлүгү туура деп билген пикирлер айтылды. Изилдөөнүн жыйынтыгында, жаныбарлардын этинен, сүтүнөн өндүрүлгөн азыктарды адал жана арам деп аныктоо боюнча Ислам шариятынын негизде мааниси жана аларга ылайык колдонуу шарттары белгиленди. Ачкыч сөздөр: Ислам укугу, шарият, мазхабдар, адал, арам, макрух."
