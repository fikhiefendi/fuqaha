abstract: "Bu çalışma, Türkiye'deki katılım bankaları müşterilerinin kredi kartı kullanım tercihleri ve davranışlarını incelemek amacıyla yapılmıştır. Araştırma betimsel bir araştırma modeline dayanmaktadır ve nicel veri toplama yöntemi kullanılarak gerçekleştirilmiştir. Veriler, çevrimiçi anket tekniği ile toplanmış ve SPSS yazılımı kullanılarak analiz edilmiştir. Araştırma kapsamında belirlenen hipotezler arasında kredi kartı kullanma durumu ile yaş, cinsiyet, gelir düzeyi, çalışma hayatı tecrübesi, medeni durum ve eğitim durumu arasındaki ilişkiler incelenmiştir. Araştırmanın örneklemi, Türkiye'de faaliyet gösteren katılım bankalarının müşterilerinden oluşmakta ve kolayda örnekleme yöntemi ile belirlenmiştir. Örneklem, 18 yaş ve üzeri bireylerden oluşmakta olup, yaklaşık 200 katılımcıya ulaşılmıştır. Araştırmanın bulgularına göre, kredi kartı kullanma durumu ile yaş arasında bazı anlamlı ilişkiler tespit edilmiştir. Örneğin, 31-40 yaş grubundaki bireyler arasında iki kredi kartı kullanımı yaygındır. Ayrıca, kredi kartı kullanma durumu ile cinsiyet arasında da anlamlı farklar bulunmuştur. Erkek katılımcılar arasında iki kredi kartı kullanımı yaygınken, kadın katılımcılar arasında bir kredi kartı kullanımı öne çıkmaktadır. Yaş ile kredi kartı kullanma sayısı arasında anlamlı bir fark bulunmamış (X² = 9,408, p = 0,152) ancak, cinsiyet ile kredi kartı sayısı arasında anlamlı bir fark bulunmuştur (X² = 23,261, p = 0,000). Gelir düzeyi ile kredi kartı kullanma durumu arasında da anlamlı ilişkiler bulunmuştur. Düşük gelir grubundaki katılımcılar arasında bir kredi kartı kullanımı yaygınken, yüksek gelir grubundaki katılımcılar arasında dört ve üzeri kredi kartı kullanımı yaygındır (X² = 32,613, p = 0,000). Ayrıca, kredi kartı kullanımının aylık harcamaları artırma durumu ile gelir düzeyi arasında anlamlı bir ilişki bulunmuştur (X² = 0,018, p = 0,991). Çalışma hayatı tecrübesi ile kredi kartı kullanma durumları arasında anlamlı bir ilişki bulunmuş, 12 yıl ve üzeri tecrübeye sahip katılımcılar arasında dört ve üzeri kredi kartı kullanımı yaygındır (X² = 17,855, p = 0,007). Eğitim durumu ile kredi kartı borcunu ödeme sıklığı arasında da anlamlı bir ilişki tespit edilmiştir. Lisansüstü mezunlarının çoğunluğu kredi kartı borçlarını zamanında ödemektedir (X² = 7,944, p = 0,019). Medeni durum ile kredi kartı kullanma nedeni arasında da anlamlı bir fark bulunmuştur. Evli katılımcılar genellikle nakit taşımama amacıyla kredi kartı kullanırken, bekar katılımcılar daha çok taksitli alışveriş için kredi kartı kullanmaktadır (X² = 6,613, p = 0,037). Bu araştırma, katılım bankaları müşterilerinin kredi kartı kullanma davranışlarını ve tercihlerini anlamak için önemli bulgular sunmaktadır. Çalışmanın bulguları, katılım bankalarının kredi kartı ürün ve hizmetlerini geliştirmeleri için yol gösterici nitelikte olabilir. Araştırma, kredi kartı kullanma durumları ile demografik ve sosyoekonomik faktörler arasındaki ilişkileri detaylı olarak ele almıştır."
