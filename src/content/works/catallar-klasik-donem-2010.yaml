abstract: "Bu tez, Hanefi Fıkıh Usûlünün iki büyük ismi olan Debûsî (v. 430/1038) ve Serahsî'nin (v. 483/1090) nesih meselesine dair değerlendirmelerini konu edinmektedir. Tez üç bölümden oluşmaktadır. İlk bölümde neshin mahiyeti ve tarihi arka planı hakkında genel bilgiler verilmiş, neshi kabul edenler ile reddedenlerin görüşlerine değinilerek İslâmî ilimlerin teşekkülünden önce neshe yüklenen manalar ele alınmıştır. İkinci bölümde Debûsî'nin fıkıh usûlüne dair yazmış olduğu Takvîmu'l-Edille adlı eserinde, nesih konusuna nasıl baktığı ortaya koyulmaya çalışılmıştır. Debûsî eserinde önce neshe verilen manalara değinmiş, neshin meşru olduğunu ispat etmeye çalışarak, neshin nerelerde olabileceğine dair değerlendirmeler yapmış, onun kısımlarını ve çeşitlerini beyan etmiştir. Üçüncü bölümde de Serahsi'nin el-Usûl kitabında nesih konusunu nasıl ele aldığı değerlendirilmeye çalışılmıştır. Debûsî'nin ele almış olduğu konulara Serahsî de değinmiş ve Debûsî'nin üzerinde pek durmadığı ?haber konularında nesih? ve ?bedâ? konusunda açıklamalarda bulunmuştur. Bu iki müellif, nesih konusunu anlatırken özellikle Şâfî'nin görüşlerine de yer vererek meseleleri genellikle mukayeseli olarak ele almış, kendi mezheplerinin delil anlayışı ve sisteminin ortaya konmasına büyük katkılar sağlamışlardır. Debusî ve Serahsî, eserlerini fukaha metoduna göre yazarak kendilerinden sonraki birçok esere de kaynaklık etmişlerdir."
