abstract: "İslam'ın beş temel esasından olması hasebiyle namazın her bir parçası Müslümanlar açısından ayrı bir önemi haizdir. Kur'an-ı Kerim ve hadisler de bizlere namazın ehemmiyeti hakkında birçok mesaj vermektedir. Bu çalışmada Müslümanlar açısından önemli bir yeri olan namazdaki ef'âl-i mahsûsa konusunda İslam âlimlerinin farklı ictihadları incelenmiştir. Bu farklı görüşlerin temelinde genel olarak Hz. Peygamber'den aktarılan farklı hadislerin ve mezheplerin bu hadisleri delil kabul etme noktasındaki farklı usul ve yöntemlerinin olduğu söylenebilir. Çalışmanın amacı, mezheplerin ortaya koyduğu farklı ictihadların akli ve nakli bir delile dayandığını ortaya koymak ve bu delilleri mezheplerin bakış açılarına göre incelemektir. Bu sayede İslam âlimlerinin, İslam'ı anlama hususunda ortaya koydukları gayret görülmüş olacaktır. Hiç şüphe yok ki namazdaki ef'âl-i mahsûsa, Müslümanların zihinlerinde ve toplumunda mezheplerin anlaşılması noktasında önemli bir yer edinmiştir. Ayrıca mezheplerin, namazın herhangi bir fiili ile ilgili olarak ortaya koyduğu farklı ictihadlar, İslam'ın bir zenginliği, Allah'ın bir rahmeti olarak görülmeli ve bu konuda müsamahakâr olunmalıdır. Nitekim bu fiillerin her biri, Hz. Peygamber'in söz ve fiillerine, meşru delillere dayanmaktadır."
