abstract: "Tüketim kültürü, kapitalist sistemin bir kültürüdür. Temel ilkesi, toplumun“üretim için tüketim”yapmasıdır. Bu sistemde her bireyin üretim ya da tüketimin bir aşamasında yer alması beklenir. Ancak bu zorunluluk, medyanın etkisiyle gönüllü ve meşru bir davranış gibi sunulur. Medya, tüketim kültürünü meşrulaştıran en güçlü araçtır. İster geleneksel ister dijital olsun tüm medya organları, 7 gün 24 saat boyunca doğrudan reklamlarla veya dolaylı yollarla –dizi, film, müzik, haber, magazin, yarışma programları gibi içeriklerle– tüketimi teşvik eder. Bu durum bireyin zihninin sürekli tüketimle meşgul olmasına neden olur. Eleştirel ekonomi politik yaklaşım, medyanın tüketim odaklı içerikler üretmesini sahiplik ilişkileri ve kâr güdüsüyle açıklar. Medya bir endüstridir ve ana gelir kaynağı reklamlardır. Medya patronları sıklıkla inşaat ve enerji gibi medya dışı sektörlerde yatırımlara sahiptir. Ayrıca bazıları siyasi çevrelerden açık ya da örtülü destek alır. Tüm bu unsurlar, medya içeriklerinin yönünü belirler. Bu içeriklerin hedeflediği birey tipi“iktisadî birey”dir: seküler, bencil, faydasını maksimize etmeye çalışan, sosyal bağları zayıf ve tam bilgiye sahip olduğu varsayılan bir model. Neoliberal iktisatçılar, tüm bireylerin böyle davrandığını varsayarak ekonomi politikalarını buna göre tasarlar. Ancak bu anlayış; çevresel tahribat, ahlâkî çöküntü ve sosyal bağların zayıflaması gibi pek çok sorunu beraberinde getirmiştir. Bu çalışmada iktisadî birey postulatı yerine İslâmî birey anlayışı önerilmektedir. İslâmî birey Müslümandır, bencil değildir, başkalarını da düşünür, helal ve harama dikkat eder, israf etmez, lüks tüketmez, gösteriş tüketimi yapmaz, faiz yemez, zekât ve sadaka verir, sosyal ilişkilere önem atfeder, iktisadî kararlarında ahiretini de hesaba katar, günah işlemekten uzak durur, sevaplı işlere yönelir. Bu nedenle medya içeriklerinin pek çoğundan uzak durur. Çünkü o, tüketim kültürünün farkındadır. Zihnini ve kalbini bundan korumaya çalışır. Zira Allah onu imtihan etmektedir. Bu imtihanın bir parçası da kötü ve pis işlerden uzak durmaktır. İslâmî birey imanı ve ilmi sayesinde güzel ahlâkla ahlaklanmıştır. Sahip olduğu güzel ahlâk onu tüketim kültürünün cezbedici doğasından muhafaza eder. Tüketim kültürünün devam edebilmesi iktisadî bireylerin varlığına bağlıdır. Eğer insanlar iktisadî birey gibi davranmayı bırakıp İslâmî birey gibi davranmaya başlarlarsa öncelikle kendilerini ve ailelerini tüketim kültürünün olumsuz etkilerinden korumuş olurlar. İslâmî birey gibi davranan insanların sayısı ne kadar artarsa o insanların yaşadığı toplum da o ölçüde tüketim kültüründen uzaklaşır."
