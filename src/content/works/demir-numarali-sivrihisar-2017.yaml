abstract: "Bu çalışma, Osmanlı Devleti'nin mahkeme kayıtlarını tutan şer'iye sicillerinden Sivrihisar'a ait bir numaralı defterin 162-237.sahifelerinin transkribe edilerek değerlendirilmesi amacıyla yapılmıştır. Defterin bu günkü alfabe ile yazımı sırasında basit transkripsiyon kuralları uygulanmıştır. Metindeki hükümler, tarihsel bakış açısı ile değerlendirilmiş, konuyu tamamlamak bakımından Osmanlı hukuk sistemi ile ilgili birtakım kavramlar tanıtılmıştır. Çalışmada ayrıca Sivrihisar'ın tarihi hakkında kısa bilgi verilmiştir. Çeşitli konularda hükümlerin yer aldığı defter, dönemin siyasi, sosyo-ekonomik, askerî ve kültürel yönleri hakkında fikirler vermektedir. Bu bilgiler ışığında Osmanlı Devleti'nin merkez dışındaki uygulamaları ve Sivrihisar'ın Osmanlı tarihindeki önemi de ortaya çıkmaktadır."
