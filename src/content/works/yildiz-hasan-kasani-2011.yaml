abstract: "Hasan Kâşânî'nin Kenzü't-Tuhaf isimli Farsça mûsikî risalesinin çevirisi ve incelemesi olan bu tezin amacı, önemli bir mûsikî risalesini Türkçe'ye kazandırdıktan sonra, eserin yazarının kimliğini, eserin dönemin mûsikîsine etkisini ve eserde kullanılan mûsikî terimlerini tespit etmektir. Tez, bir giriş ve üç bölüm içermektedir. Giriş bölümünde eserin yazıldığı döneme ait bilgiler verildikten sonra, birinci bölümde Hasan Kâşânî'nin hayatı ve eseri olan Kenzü't-Tuhaf hakkında bilgiler verildi. Kenzü't-Tuhaf'ın genel özellikleri, konusu, içeriği, yazım tarihi ve nüshaları bu bölümde yer aldı. İkinci bölümde Kenzü't-Tuhaf beş başlık altında incelendi. Bu başlıkları şöyle sıralayabiliriz; 1- Ses Sistemi, 2- îkâ ve Türleri, 3- Kompozisyon, 4- Sazlar, 5- Öğütler, Mûsikînin Tesirleri ve Mitoloji. Üçüncü ve son bölümde Kenzü't-Tuhaf adlı eserin Farsça'dan Türkçe'ye tercümesine yer verildi. Çalışmanın sonuna, eserin Takî Bîneş tarafından yapılmış edisyon kritik çalışması ve eserin British Museum (Londra)'da yer alan nüshası eklendi."
