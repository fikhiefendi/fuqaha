abstract: "Bu araştırmada miladî XIII.vy.da, Abbasîlerin son döneminde Bağdat'ta yaşamış büyük bir Hanefî Hukukçusu olan İbnu's-Sââtî'nin hayatı ve onun önemli eseri olan 'el-Bedî' adlı eserindeki metodu incelenmiştir. Giriş kısmında Fıkıh Usûlü'nün tarihçesi hakkında bilgi verilmiştir. Çalışmamız iki ana bölümden oluşmaktadır. Birinci bölümde Fıkıh Usûlü'nün tarifi, konusu ve delillerinden bahsedilmiştir. İbnu's-Sââti'ye kadar İslam Hukuku'nun geçirdiği devreler ana hatlarıyla ele alınmıştır. İbnu's-Sââtî'nin hayatı yaşadığı dönem ele alınmış, İbnu's- Sââti'nin hayatı, ölümü, hocaları, yetişmesi, öğrencileri, eserleri, ilmi kişiliği Abbasî Devleti dönemindeki ilmi, kültürel gelişmeler kısaca anlatılmıştır. İkinci Bölümde 'el-Bedî'in metodu incelenmiş, el-Bedî'in konulan, kaynaklan, sistematiği,uslûbu, konulan işleyiş tarzı ile İbnu's-Sââtî ve 'el-Bedî'in İslam Hukuku'ndaki yeri hakkında bilgi verilmiştir."
