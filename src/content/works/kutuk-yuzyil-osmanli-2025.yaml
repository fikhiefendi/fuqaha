abstract: "Bu çalışma, on altıncı yüzyıl Osmanlı ceza hukukunda ırza yönelik suçları ve cezaları incelemektedir. Zinaya teşebbüs ve ırza geçme suçları, çalışmanın odağını oluşturmaktadır. Çalışmada Osmanlı hukuk pratiğinin had alanına girmeyen zinaya teşebbüs suçunda başvurduğu ispat vasıtaları ve yargılama süreci incelenmektedir. Mezhepte ispatı için ağır şartlar vaz edilen cebren zina suçunun Osmanlı hukuk belgelerine nasıl yansıdığı, ispatın mümkün olmadığı durumlarda hukukun nasıl bir yol izlediği çalışmanın ana meseleleri arasındadır. Çalışma, teşebbüs seviyesinden kalan suçların yargılanması ve failin cezalandırılması noktasında hukukun daha esnek bir alana sahip olduğunu; ırza geçme şikayetlerinin ispatı hususunda mezhepte belirlenen ispat koşullarına sıkı sıkıya bağlı kalındığını; bu tür olaylarda tanığın bulunmaması halinde mağdur ve zanlının yaşadıkları mahallede sahip oldukları şöhret ve imajın suçlamanın düşmesi yahut davacının cezalandırılmasında önemli bir kriter olduğunu ileri sürmektedir."
