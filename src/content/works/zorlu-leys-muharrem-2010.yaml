abstract: "Muharrem Efendi (ö.1591?92) Hanefi mezhebindendir ve Halvetî'dir. Fakih, nahiv ilmine vakıf ve aynı zamanda şeyhler ve mutasavvıflar faslında sözü geçen biridir. Yaşadığı devirde ilmî hayatın canlılığını sürdürmesi adına değerli katkıları olduğunu yazmış olduğu eserleriyle ortaya koyan Muharrem Efendi, dönemin kıymetli âlimlerinden ve velûd yazarlarından biridir. Vefatından sonra ardında kitaplarından başka bir şey bırakmamıştır. Türkçe, Farsça ve Arapça olmak üzere değişik alanlarda olmak üzere birçok eser meydana getirmiştir.Muharrem Efendi çalışmamıza konu olan Hubbu'l-mesâil adlı eserinde önemli gördüğü birçok fıkhî meseleyi ele almaktadır. Bu eserde kaynak olarak zikredilen eserlerin çokluğu ve ana kaynakların kullanılmış olması Hubbu'l-mesâil'in önemini bir kat daha arttırmaktadır."
