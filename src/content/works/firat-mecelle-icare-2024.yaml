abstract: "Çalışmamız, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde tezimizin konusu ele alınmış, konunun ele alınış amacı, önemi ve konunun işleniş yöntemi hakkında bilgi verilmiştir. Ayrıca tezde istifade edilen kaynaklar ve bu kaynaklardan faydalanma şekilleri izah edilmiştir. Tezimizin adının iki unsurunu oluşturan Mecelle ve icâre konuları hakkında da girişte bilgiler sunulmuştur. Birinci bölümde, Mecellede icâre akdinin mahiyetine dair hükümler'den söz edilmiş ve icâre akdinin tanımı ve hukuki niteliği, icâre akdinin çeşitleri, rükünları, kurulum ve sıhhat şartları Mecelle'de geçen şekli baz alınarak ele alınmıştır. İkinci bölümde ise Mecelle'de icâre akdinin işleyişine dair hükümler'den söz edilmiştir. Bu kısımda Mecelle'de icâre akdinin işleyişine dair olan icâre akdinde ücret, süre, muhayyerlik ve tazminat konuları ele alınmıştır. Kiralanan şeyin türleri ve icâre akdi sonrası kiracı ve kiralayanın görev ve yetkilerinden söz edilen bu kısımda ayrıca icâre akdinin feshi ve batıl olması konularına yer verilmiştir. Bu kısmın sonunda icâre akdinde iş akdi konusu ele alınmıştır. Üçüncü bölümde ise \"Uygulama Bakımından İcâre Akdi\" konusu ele alınmış Mecelle'nin icâre akdi bölümünün uygulanması ile ilgili örneklere temas edilmiştir. Osmanlı Devleti'nde Mecelle'nin uygulandığı mahkemeler ve bu mahkemelerde Mecelle'nin icâre akdi bölümünün uygulanması ile ilgili örneklere değinilmiş, Osmanlı devletinde mahkemelerdeki kanunların dercedildiği Cerîde-i Mehâkim denilen dergide geçen Mecelle icâre akdi uygulamaları ile ilgili örneklere değinilmiştir. Bu bölümde Mecelle sonrası hazırlanan kanunlara Mecelle'nin kaynaklık etmesi ile ilgili Mecellenin müslüman devletlerin yasasına icare örneğinde etkisi ve Türk medeni kanununda icare hükümlerinde mecelle etkisi başlıkları altında örnekler verilmiştir. Bu bölüm Mecelle'nin uygulanışı ve sonraki kanunlara kaynaklık etmesinin anlaşılması bakımından önemlidir."
