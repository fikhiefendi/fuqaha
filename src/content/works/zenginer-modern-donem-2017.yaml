abstract: "Modern dönemde dinin kaynak metinlerini okuma konusunda geliştirilen yeni usullerin tatbiki sonucunda, ilim geleneğimizde belli bir şekle kavuşan birçok mesele yeniden tartışma konusu yapılmış ve farklı bir takım neticelere ulaşılmıştır. Bu tartışmalar zamanın değişmesiyle hükme de tesir eden muamelât sahasıyla sınırlı kalmamış, ilim geleneğimizde sabit görülen bazı ibadet hatta akait meselelerine de sirayet etmiştir. İşte bu bağlamda tartışılan konulardan biri de Yahudi ve Hıristiyanların hidayet üzere olmak ve necata erişmek bakımından son peygambere ve kitaba iman etmelerinin zorunlu olup olmadığı meselesidir. Elbette bu alanda yapılan farklı çalışmalar mevcuttur. Fakat bu meselenin isabetli bir çözüme kavuşturulması için modern dönemdeki tarihi kırılma noktalarının isabetle tespit, teşhis ve tahlil edilmesinin önemi izahtan varestedir. İşte bu tezde, geleneksel yaklaşım çerçevesinde telif edilen iki tefsir ölçü alınarak, son 40 yıl içinde kaleme alınan iki önemli tefsirdeki bahsi geçen meseleye dair ayetlerin yorumundaki kırılma noktaları tespit ve tahlil edilecektir. Tez, giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde Ehl-i kitap hakkında kısaca bilgiye değinildikten sonra yazarlarımızın hayatları ve eserleri hakkında bilgi verilmektedir. Birinci bölümde genel olarak peygamberlere iman konusu ve kelam ekollerinin nübüvvet konusundaki görüşleri ele alınmıştır. İkinci bölümde ise Ehl-i kitabın son peygambere ve kitaba imanı meselesine, ikisi klasik, ikisi de modern dönemde yazılmış tefsirler arasında mukayese yapılmış, modern dönemde Kur'ân yorumlarında meydana gelen değişiklikler ortaya konulmuş ve tahlillerle sonuca ulaşılmıştır."
