abstract: "Genel olarak İslâm bütün çeşitleriyle temizliğe büyük bir önem vermiştir. Temizlik, İslâm'ın en önemli farzlarından biri olan namazın sahih/muteber olması için de aranan öncelikli şartlardandır. Onlardan birisi de maddî pisliklerden temizlenmek anlamında necâsetten tahârettir. İdrar, dışkı ve kan gibi bazı maddeler fıkhen necis sayılmıştır. Anılan maddelerin katı ya da sıvı oluşuna göre -ağırlık veya kapladıkları alan bakımından- belli bir miktarı, namazın sıhhatine ya kısmen engel görülmüş ve namaz kerahetle de olsa sahih sayılmış ya da tamamen engel görülerek namazın fasit/bâtıl oluşuna hükmedilmiştir."
