abstract: "Vakıflar, İslâm Tarihi boyunca Müslümanlar tarafından kurulan sembol ve örnek kuruluşların başında gelmektedir. Geçmişten günümüze dek tüm İslâm coğrafyası ve toplumları arasında âdeta yardımlaşma ve dayanışmanın merkezleri ve öncü kurumları hâline gelen vakıflar, dinî, ilmî ve içtimaî yönü ağır basan kuruluşlardır. İslâm kültüründe çok köklü bir yere sahip olan“sadaka-i cariye”, yani“süreklilik arz eden hayır ve iyilik”inancından kaynaklanarak yaygınlaşan vakıf kurma geleneği, Osmanlı'yı altı asır ayakta tutan dinamiklerin ilklerinden biriydi. Bu arada Bursa şehri, Osmanlı Devleti'nin en eski başkenti olması (1326-1362) itibariyle vakıf müessesesi açısından çok önemli bir konumda bulunmaktadır. Buna göre Bursa, vakfiyelere ait belgeler/dokümanlar bakımından oldukça zengin malzemeyi bünyesinde barındıran bir kent olma özelliğini taşımaktadır. Dolayısıyla Bursa Şer'iyye Sicilleri Arşivi, Osmanlı Tarihi araştırmacıları için vazgeçilmez değeri haizdir. Bu gerçekten hareketle“Vakfiyelere Göre XVIII. Yüzyılın İlk Çeyreğinde (1701-1725) Bursa'da Vakıflar ve İşlevleri”üst başlığını taşıyan bir konuyu çalışmaya karar verdik. 25 yıllık bir süreyi kapsayan bu çalışma bir giriş, üç bölüm ve bir sonuçtan meydana gelmektedir. Girişte, bilimsel araştırma teknikleri açısından çalışma(nın) yöntemi ile vakıf kurumları ve vakfiye kayıtları hakkında ön bilgiler verilmiştir. Bu bağlamda araştırmanın konusu, amacı, kapsamı, temel kavramları ve ana kaynakları üzerinde kısaca durulmuştur. Birinci bölümde“Kurucularına veya Vakfeden Kişilere Göre Vakıflar”, ikinci bölümde“Mevkûfâta (Vakfedilen Mallara) Göre Vakıflar”, üçüncü bölümde ise“Vakfetme veya Hizmet Amaçlarına Göre Vakıflar”ele alınmış ve incelenmiştir. Sonuçta da genel bir değerlendirme yapılarak çalışma bitirilmiştir."
