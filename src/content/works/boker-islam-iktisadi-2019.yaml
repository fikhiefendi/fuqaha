abstract: "Bu çalışmanın hedefi; Son yıllarda toplumlar üzerindeki olumsuz etkilerini yansıtan, değerleri, ilkeleri ve etiği etkileyen ve ulusal ve uluslararası ekonomiyi tahrip eden ciddi bir finansal suç var, bu suçlama, son zamanlarda uluslararası forumlarda ortaya çıkmaya başlayan bir terim olarak kara para aklama olarak biliniyor. Bu çalışma, Libya'da kara para aklama olgusunun ekonomik, sosyal ve güvenlik etkilerini ve daha sonra da tedaviyi bilmek amacıyla yapılmıştır. Bu çalışmanın önemi, kara para aklama fenomeninin, bu suçun toplumun güvenliğini ve ekonomisinin istikrarını tehdit eden diğer suçlarla birleştirmesinin yanı sıra, toplumların ve içinde bulundukları ülkelerin karşılaştığı en ciddi ekonomik suçlardan biri olmasıdır. Tümdengelim yaklaşımının metodolojisi araştırmada kullanılmış olup, esas olarak konuyla ilgili kavram ve terminoloji açısından kara para aklama olgusunu okumak ve Libya'da bu konuyla ilgilenen çalışmaları, araştırmaları, yayınları ve alanları görmek ve Libya'daki ekonomik, sosyal ve güvenlik etkilerini incelemek için kullanılmaktadır. Ve İslam ekonomisinde kara para aklama ile kara para aklama faaliyetlerini pozitif ekonomi bağlamında kara para ile karşılaştırmak için karşılaştırmalı bir analitik yaklaşımın yanı sıra, Libya Merkez Bankası ve Denetim Bürosu tarafından yayınlanan devlet tahminleri ve yayınlarına dayanarak Libya'daki kara para aklama operasyonlarının hacmi ve analizi çalışması. Bu süreçlerin sunumunda tarihsel ve kısıtlayıcı yönlerden bahsetmek. Çalışma, kara para aklama işlemlerinin toplumlara zarar veren finansal bir ekonomik suç olarak görülmesi, milli gelir üzerinde ve değerler ile sosyal bağlar ve diğer etkiler üzerinde olumsuz etkilere yol açtı."
