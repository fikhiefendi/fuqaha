abstract: "Bu tez 1912 -1967 yılları arasın da yaşamış olan; es-Seyyid Abdulvahhab ed-Derizbinî Hoca Efendinin, hayatı ve eserleri, fıkıh konuları hakkında verdiği fetvaların tahkîki ve tahlîli, atıfta bulunduğu eserler, tercih nedenleri ve müellifleri hakkında bilgi verme konularını kapsamaktadır. Araştırma giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, redaksiyon ve tahlîlde izlenen metot, fetva ve tarihçesi açıklanmıştır. Birinci bölümde Derizbinî?nin hayatı, eserleri ve yaşadığı dönem hakkında bilgi verilmiştir. İkinci bölümde Derizbînî fetvalarının muhtevası, konuları ve metodu zikredilmiş, atıfta bulunulan kaynaklarla fetvalarda zikredilen Arapça ibarelerin karşılaştırılmasından örnekler verilerek yapılan yöntem hataları ele alınmıştır. Ayrıca, Derizbinî?nin fetvalarında atıfta bulunduğu müellifler, eserleri ve tercih nedenleri hakkında da bilgi verilmiştir. Üçüncü bölümde tahkikli metin verilmiştir. Sonuç bölümünde ise çalışmamız neticesinde, vardığımız sonuçlar zikredilmiştir."
