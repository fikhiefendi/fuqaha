abstract: "Osmanlı ulemasının belirli bir mesele çerçevesinde kaleme aldığı risaleler, telif edildikleri dönemlerde alimler arasında tartışılan güncel konuları yansıtırlar. Risaleler yaşanan hayatla doğrudan irtibatlıdırlar.15 ve 16. yüzyılda Osmanlı Devleti'nde vakıflarla ilgili çok sayıda risale yazılmıştır. Risalelerle toplumsal olaylar arasındaki bu ilişki bu meselenin niye tartışıldığı sorusunu ortaya çıkarmaktadır.Zürrî vakıflarda kullanılan ?çocukların çocukları? lafzının vâkıfın kızının çocuklarını kapsaması meselesiyle ilgili yazılmış üç risale vardır. Bunların müellifleri Hatibzâde, Kemalpaşazâde ve İbn Nüceym'dir."
