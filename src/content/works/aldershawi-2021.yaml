abstract: "Bu tez, şer'î hüküm çeşitlerinden biri olan ve mükelleflerin özür durumlarına bağlı olarak onlara bazı mükellefiyetleri hafifletme anlamındaki ruhsat konusunu ele almaktadır. Ruhsat konusunu hem fıkıh usûlü hem de fürûu açısından inceleyen bu tez, üç bölümden oluşmaktadır. Birinci bölümde usûlcülere göre bütün yönleriyle ruhsat teorisi sunulacaktır. Usûlcülerin eserlerinde dağınık bir şekilde sözü edilen konunun unsurları bir araya getirilecektir. Söz konusu teori, usûlcülere göre ruhsatın tanımını, ruhsat ile ona yakın anlamlı olan istihsan, ibaha, tahsis gibi kavramlar arasındaki farkı, ruhsatın kısımlara ayrılmasında usûlcülerin izlediği yöntemi, şer'î hükmün kısımları arasındaki yerini ve hükmünü içerecektir. Bunlardan sonra gerek ittifak edilen gerekse ihtilaf edilen delillerle ruhsatın sübutundan söz edilecektir. Ardından ruhsata sebep teşkil eden özür haline ve mükellefin ruhsatla amel etmesine değinilecektir. Nihayet ruhsatla amel ederken dikkat edilmesi gereken kurallar ve azimet veya ruhsatla amel arasında tercihte bulunma konusu üzerinde durulacaktır. Tezin ikinci bölümü, İslam hukuk ekollerinin ruhsat teorisini, özellikle malî hukuk (muâmelât) kısmına tatbik etmeleri konusuna ayrılacaktır. Bu bölümde, ihtiyaç hali göz önünde bulundurularak genel kurala aykırı bir şekilde meşru kılınmış olan selem ve istısnâ' gibi satım çeşitlerine, teorinin uygulanışı söz konusu edilecektir. Yine genel kurala aykırı olarak meşru kılınmış olan icare, cuâle, mudârabe, müsâkât, müzâraa, karz, havâle ve şüf'a gibi akitlere, ruhsat teorisinin tatbik edilişi üzerinde durulacaktır. Bu akitlerin ruhsat oluş yönü ve bunun fıkhî meselelere etkisi izah edilecektir. Üçüncü bölümde ise güncel malî işlemler içerisinden en yaygın olan meselelere, ruhsat teorisinin uygulanışından söz edilecektir. Faizli ihtiyaç kredisi alma, ücretle teminat mektubu almak, faizli bankalarda hesap bulundurma, kredi kartı kullanma ve ticarî sigorta; incelenecek olan bu güncel meselelere örnek olarak verilebilir. Bu gibi işlemlerin temel hüküm ortaya konacaktır. Ardından ihtiyaç halinin, bunların mubah oluşunu benimsemeye tesir etmesinin boyutları ve bu görüşü tercih etme esnasındaki ruhsat kuralları açıklanacaktır."
