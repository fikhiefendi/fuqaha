abstract: "Hac, İslamiyet'in beş temel şartlarından ve Allah'a ulaşan yollardan bir tanesidir. Mekke'ye gerçekleştirilen hac ziyaretlerinin ilk olarak hangi tarihte yapıldığı net bir şekilde belli olmasa da İslamiyet'in kabul edilmesinden daha önce olduğu malumdur. Ve Müslümanların“Cahiliye Dönemi”diye nitelendirdikleri İslamiyet öncesi zamana tekabül eder. Bu çalışmada hac kavramı genel bir bakışla ele alındı. Bu kavramın Ehl-i Kitapta, beşeri dinlerde ve İslâm öncesi Arap kültüründeki karşılığı ortaya kondu. İslâm'da hac ibadeti ana hatlarıyla açıklandı. Hanefî ve Ca'ferî mezhepleri hakkında genel bilgi verildi. Söz konusu mezheplerin yöntem ve görüşlerine kısaca değinildi. Hanefî ve Ca'ferî mezheplerine göre hac ayrıntılı şekilde ele alındı. Hac ibadetinde iki mezhep arasındaki farklılıklar ortaya kondu. Hac ibadetinde iki mezhep arasında ortak birtakım uygulama ve prensipler olsa da bir birinden ayrıldığı çok sayıda nokta olduğu söylenebilir. Çalışmanın sonucunda; Ca'ferî mezhebinde hac kadar önemli olan bir diğer ibadetin de imamların mezarlarına yapılan ziyaretlerin olduğu, Ca'ferîler'de, Kerbelâ'nın toprağı ve suyu, Hz. Hüseyin ve çevresinde bulunanların kanı ile karışmış olduğu inancına dayanarak, o mekânın şifalı ve kutsal sayıldığı görülmüştür."
