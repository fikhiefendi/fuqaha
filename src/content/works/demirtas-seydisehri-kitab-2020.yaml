abstract: "Osmanlı Devleti, Tanzimat ile birlikte birtakım kanunlaştırma çalışmalarına girişmiştir. Bunlardan biri de 25 Ekim 1917 tarihli Hukûk-ı Âile Kararnâmesi'dir. Kararnâme bir buçuk yıl gibi kısa bir süre yürürlükte kalmasına rağmen geniş yankı uyandırmıştır. Kararnâme bir komisyon tarafından hazırlanmış ve komisyon başkanlığını Mahmud Esad Seydişehrî yapmıştır. Bu çalışmada; medrese eğitimin yanında mektepli kuşağın ilk mensuplarından olan Seydişehrî'nin Kitâb-ı Nikâh ve Talâk isimli eseri ile bu eserden yaklaşık on yıl sonra hazırlanan Hukûk-ı Âile Kararnâmesi mukayese edilmiştir. Tez giriş ve iki bölümden oluşmaktadır. Giriş kısmında ilk olarak Kitâb-ı Nikâh ve Talâk isimli eserden ve yazarı Mahmud Esad Seydişehrî'nin hayatından bahsedilmiştir. İkinci olarak Hukûk-ı Âile Kararnâmesi hakkında genel malumat verilmiş, Kararnâme'nin hazırlanması için oluşturulan komisyon üyeleri ve komisyon üyelerine yöneltilen eleştiriler belirtilmiş daha sonra Kararnâme'nin hazırlanmasında etkili olan düşünceler ifade edilmiştir. Birinci bölümde Kitâb-ı Nikâh ve Talâk ile Hukûk-ı Âile Kararnâmesi'nin ele aldıkları konular ve bunları işleyiş tarzları hakkında bilgi verilmiştir. Kitâb-ı Nikâh ve Talâk, meseleleri klasik Hanefî füru kitaplarına göre ele almış, çoğunlukla Hanefî mezhebinin dışında görüş nakletmemiştir. Seydişehrî, bazı güncel konularda kısaca kendi görüşlerini bildirmiştir. İkinci bölümde bu iki eserin içerdiği hükümlerin karşılaştırması yapılmıştır. Mahmud Esad Seydişehrî, Kitâb-ı Nikâh ve Talâk'ta Hanefî mezhebine uymayan bir görüş belirtmediği için daha çok Hukûk-ı Âile Kararnâmesi'nde geçen ve Hanefî mezhebine uymayan görüşler, Kararnâme'nin Esbâb-ı Mûcibe Lâyihası dikkate alınarak incelenmiştir."
