abstract: "Mülkiyet hakkı Anayasamızın temel haklar başlığı altında düzenlenmiş ve Anayasa ile güvence altına alınmıştır. Anayasa'nın 35. ve 46. maddelerinde, özel mülkiyetteki gayrimenkullere, idarenin ancak kamu yararı amacı ile kanunlarla öngörülen usullere uymak suretiyle sınırlama getirebileceği düzenlenmiştir. Yani idarenin özel mülkiyette bulunan bir gayrimenkule kanunlarla öngörülen usullere uymadan el atması Anayasa ve Kanunlara aykırı bir durum teşkil etmektedir.İdarenin kamu hizmetlerini yerine getirebilmesi için kamulaştırma ile mülkiyet hakkına sınırlandırma getirilebileceği düzenlenmiştir. Süreç içerisinde idare, Anayasanın tanıdığı ve kanunlarla düzenlenen kamulaştırma işlemini yapmadan özel mülkiyetteki taşınmazlara el atmaya başlamıştır. İdarenin, kamu hizmetlerinin yürütülmesi için özel mülkiyetteki taşınmazlara el atmaya başlaması kamulaştırmasız el atma kavramını ortaya çıkarmıştır. Kamulaştırmasız el atma kavramı, hukukumuzda, özel mülkiyetteki taşınmazlara, özellikle yol yapımı nedeni ile el atılması ile ortaya çıkmıştır.İdare, Anayasa ve yasalara uygun bir işlem oluşturmaksızın, bir kimsenin taşınmaz malına el atar, onun üzerinde bir tesis veya bina yapar veya o taşınmaz malı bir hizmete tahsis ederek mal sahibinin taşınmazı üzerinde dilediği gibi kullanma hakkına karşı herhangi bir girişimde bulunuyor ise taşınmaz mala kamulaştırmasız el atmış sayılır.Kamulaştırmasız el atma konusundaki ilk düzenlemeler Yargı kararları ile oluşturulmuştur.Yargıtay'ın, 11.5.1956 tarih ve Esas 1, Karar 6/7 sayılı iki İçtihadı Birleştirme Kararıyla, özel mülkiyetindeki taşınmazına kamulaştırmasız el atılan malikin, mülkiyet hakkının sona ermediğini ve malikin, el atmanın önlenmesi davası açarak, idarenin bu haksız müdahalesini ortadan kaldırabileceği gibi, bu hakkını kullanmayarak, el atılan yerin mülkiyetini İdareye devrederek, yerin karşılık parasını da isteyebileceğini, açılan bu davaların, herhangi süre sınırlamasına tabi olmayacağı belirlenmiştir.Zamanla, Yargıtay içtihatları ile kabul edilen çözüm şekli çeşitli sorunlara neden olmuş. Bu nedenle bir takım yasal düzenlemeler yapılması yoluna gidilmiştir.05.01.1961 gün 221 sayılı yasa ile 9 Ekim 1956 tarihine kadar olan bütün kamulaştırmasız el atma işlemleri, geçerli birer kamulaştırma olarak kabul edilmiş, bu tarihten öncesi için kamulaştırmasız el atma söz konusu olmaktan çıkarılmıştır.2942 sayılı Kamulaştırma Kanunu'nda kamulaştırmasız el atma, yasal bir düzenlemeye tabi tutulmuştur.2942 sayılı yasanın 38. maddesi ile Yargıtay içtihatlarıyla belirlenen ve taşınmazlarına kamulaştırmasız el atılan maliklerine tanınan süresiz dava açabilme hakkı yirmi yıllık süre sınırlamasına tabi tutulmuştur. Bu süre sınırlaması (hak düşürücü süre) nedeni ile bu süre içinde açılmayan davalar, artık açılamayacaktır.2942 sayılı yasanın 38. maddesi ile yasal bir dayanak oluşturulan kamulaştırmasız el atma, malik ve idare bakımından bir takım sonuçlar doğurmaktadır.Malik'in mülkiyet hakkına dayanan davaları açabilme hakkı kamulaştırmasız el atmanın doğurduğu sonuçların başında gelmektedir. El atmanın önlenmesi davası ise bu davaların başında gelir. Taşınmaz maliki, açacağı dava ile el atmanın önlenmesini isteyebileceği gibi dilerse bu yola başvurmayıp, mülkiyet hakkının, kamu tüzel kişiliğine devrine razı olarak, taşınmaz malın bedelinin verilmesini de dava edebilir. Bunun yanında kamulaştırmasız el atma sebebiyle zarara uğrayan malik veya zilyetler bu zarara sebebiyet veren idareden, uğradıkları zararının tazminini de isteyebilirler. Kamulaştırmasız el atma nedeni ile açılan bedel veya tazminat davalarında, talep halinde faize de hükmedilebilmektedir. Faizin başlangıç tarihi ise bedel veya tazminat davasının açıldığı tarihtir. Malik bakımından kamulaştırmasız el atmanın en önemli sonucu, mülkiyet hakkının sona ermesidir.Kamulaştırmasız el atma, idare bakımından da bir takım sonuçlar doğurmaktadır. Bu sonuçlardan en önemlisi, idarenin, kamulaştırmasız el attığı taşınmazın mülkiyet hakkını elde etmesidir. Bunun yanında idare, aleyhine açılan davalarda kamulaştırma işleminin yapıldığını veya bedelin ödendiğini, ya da bir kanun hükmüne dayanarak taşınmaza el attığını, belirterek çeşitli savunmalarda bulunabilir veya dava açıldıktan sonra kamulaştırmasız el attığı taşınmazı kamulaştırarak, yapılan işlemi hukuka uygun hale getirebilir.Anayasa Mahkemesi tarafından, Kamulaştırma Kanununun 38. maddesi Anayasa'ya aykırılığı sebebiyle iptal edildiğinden dolayı artık 38.madde ile öngörülen yirmi yıllık hak düşürücü süre ortadan kalkmış bulunmaktadır.2942 sayılı Kamulaştırma Kanunuyla, temel haklardan olan mülkiyet hakkının malik açısından 20 yıllık hak düşürücü süreye tabi tutulması Anayasa'ya aykırılık teşkil ettiğinden, iptal edilmesi, Hukuk Devleti olmanın gerekliğini ortaya koymuştur. Böylece Anayasa ile korunan mülkiyet hakkına haksız müdahalenin hak düşürücü süre ile hukuka uygun hale gelmesinin önüne geçilmiştir."
