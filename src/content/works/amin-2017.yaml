abstract: "Bu mesajın amacı Suriye'den gelen göç dalgasının Türkiye ekonomisi üzerindeki etkilerini belirlemek 2012/2016 Araştırmacı, önceden yapılmış olan ve alakalı olan çalışmaları inceleyerek ve istatistik bilgiler ile bilimsel metotları kullanarak çok sayıda sonuca varmıştır. Bunların en önemlisi ise, Suriye göçünün Türkiye üzerindeki etkinin negatif değil bilakis pozitif etki olduğunu söylemiştir. Zira Suriye'den gelen insanlar işgücüne katkıda bulunarak, maaşların daha yükseğe çıkmasına engel olmuş ve böylece Türkiye'deki ekonomik sektörleri pozitif bir şekilde etkilemiştir. Bu kapsamda üretim, tüketim ve nakit rezervinin arttığı görülmüş ve ithalat ve ihracatın arttığı da görülmüştür. Ayrıca, gerekli elverişli ortamın sunulması durumunda, Türkiye'de iş yapmak ve şirket açmak isteyen iş adamlarının sayısı artmıştır. Araştırmacı ayrıca Suriye'den gelen işgücüne karşı ilginin artmasını ve Türkiye'nin gelecekteki ekonominse büyük katkısı olacak bu insanlara daha fazla olmasını yönünde tavsiyede bulunmuştur."
