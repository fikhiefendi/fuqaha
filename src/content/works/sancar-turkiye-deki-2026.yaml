abstract: "Tarih boyunca insanlar bir yandan yatırım yaparak kazanç elde etmek ve mevcut birikimlerinin değerini korumak istemişler diğer yandan da girişimleri ve ticari faaliyetleri için finansmana ihtiyaç duymuşlardır. Kökenleri hem İslam dünyasında hem de Batıda bulunan ve modern dönemlere gelindiğinde girişim sermayesi ismiyle kurumsallaşan sistemin doğuşu da her iki ihtiyacı karşılamaya yönelik tarihsel sürecin tabii bir ürünüdür. Girişim sermayesi, girişimcilere kaynak sunarken yatırımcılara da üstlendikleri risk karşılığında daha yüksek kazanç elde etme imkânı sağlayan sermaye temelli bir finansman ve yatırım aracıdır. Bu bağlamda girişim sermayesi finansman yöntemi, dünyada ve Türkiye'de farklı araçlarla uygulanan bir şemsiye kavramdır. Nitekim farklı ülkelerde, farklı isim, mevzuat ve yapılarla kurgulanan bu finansman yöntemi girişimciye ortaklık yoluyla sermaye finansmanı sağlama ve yatırımın büyüyüp gelişmesiyle kâr elde etme noktasında müşterek bir prensibe dayanmaktadır. Tez kapsamında girişim sermayesi finansman yöntemini kullanan araçlar arasından girişim sermayesi yatırım ortaklıkları ve fonlarının araştırma konusu olarak seçilmesinin sebebi ise Türkiye'de girişim sermayesi faaliyetlerinin başlıca bu iki yapı tarafından yürütülmesidir. Dünyada ve Türkiye'de giderek yaygınlaşan bu girişim sermayesi yatırım araçlarının İslam hukuku açısından değerlendirilmesi büyük önem taşımaktadır. Zira girişim sermayesi, Müslüman toplumlar ve bireyler için reel ticari ve iktisadi faaliyetlerde faizli borçlanma sistemlerine alternatif oluşturabilecek bir yatırım aracıdır. Temel prensipleri itibarıyla sermaye ortaklığına dayanması sebebiyle meşru görülen girişim sermayesi yönteminin, mevcut uygulamalar bakımından fıkhi prensiplere tamamen uyup uymadığı ise yanıtlanmayı bekleyen bir sorudur. Bu bağlamda tezin temel amacı, Türkiye'deki girişim sermayesi yatırım ortaklıkları ve girişim sermayesi yatırım fonlarının fıkhi mahiyetini tespit etmeye çalışmak ve bu yapıların güncel uygulamalarını İslam hukuku açısından değerlendirmeye tabi tutmaktır."
