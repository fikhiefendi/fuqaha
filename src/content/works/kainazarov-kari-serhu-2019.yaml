abstract: "Bu çalışmada, Ali el-Kârî'nin Şerhu Musnedi Ebî Hanîfe isimli eserinin muhteva ve metodu tesbit edilmeye çalışılmış, Ebû Hanîfe'ye yöneltilen bazı tenkidlere müellifin verdiği cevaplar ortaya konmuştur. Netice itibarıyla bu şerh özelinde Ali el-Kârî'nin hadisçiliği hakkında fikir edinmeye çalışılmıştır. Bununla birlikte çalışmada Ali el-Kârî'nin şerhini ilim dünyasında farklı yönleriyle gündeme taşımak hedefi güdülmüştür. İslâmî ilimlerde önde gelen âlimlerden biri olan Ali el-Kârî, Afganistan'ın Herat şehrinde dünyaya gelmiş, Şah İsmail'in şîîleştirme siyasetinden dolayı Herat'ı terkedip Mekke'ye yerleşmiş ve orada 1014/1605 senesinde vefat etmiştir. İslâmî ilim dallarının hemen hemen tamamında eser yazmıştır. Eserlerinden bugün de istifâde edilmektedir. Ali el-Kârî, Musnedu Ebî Hanîfe'nin Hârisî (340/952) tarafından cem edilen ve Haskefî'nin (650/1252) ihtisar ettiği Musned üzerine şerh yazmıştır. İşte bugün Musnedu Ebî Hanîfe ismi ile meşhur olan ve Ali el-Kârî'nin şerh ettiği Musned budur. Çalışma iki bölümden müteşekkildir. Birinci bölümde Ali el-Kârî'nin hayatı, ilmî şahsiyeti, hadisçiliği ve Musned hakkında bazı bilgilere yer verilmiştir. İkinci bölümde ise Şerhu Musnedi Ebî Hanîfe'nin tanıtımı, şerhte kullanılan kaynaklar, şerhin muhteva ve metodu, Ebî Hanîfe'ye yöneltilen bazı tenkidler ve Ali el-Kârî'nin cevabı incelenmiş ve misallerle îzah edilmeye çalışılmıştır. Ali el-Kârî, genel olarak bu şerhi anlaşılır ve kolay ibarelerle, okuyan kimsenin rahatlıkla anlayabileceği bir üslûp benimseyerek, rivâyetleri kısa ifâdelerle şerh etmiştir. Hadisleri Hanefî mezhebi doğrultusunda şerh etmiş ve yer yer diğer mezheplerin görüşlerine de yer vermiştir. Hadisler arasındaki tearuzda genelde cem' ve te'lif, nesih ve haml yöntemlerini kullanmıştır."
