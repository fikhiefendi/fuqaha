abstract: "Türkiye' deki katılım bankaları mevcut durumda TFRS'ye (Türkiye Finansal Raporlama Standartları) ve BDDK (Bankacılık Düzenleme ve Denetleme Kurumu) düzenlemelerine uygun finansal tablolar hazırlayarak denetimden geçtikten sonra bu raporları üç ayda bir KAP (Kamu Aydınlatma Platformu) sistemi ile kamuoyuna açıklamaktadırlar. Ana ortakları yurtdışında olan bazı katılım bankaları da bu TFRS'ye uygun finansal tablolara ilave olarak IFRS'ye (Uluslararası Finansal Raporlama Standartları) uygun tabloları da altı ayda bir hazırlayarak kendi internet sitelerinde yayınlamaktadırlar ve ana ortaklarına göndermektedirler. Yapılan her iki uygulama diğer geleneksel faizli bankalar tarafından da bu şekilde yapılmaktadır. TFRS standartlarının IFRS standartlarından temelde farkı yoktur. TFRS standartları Türkiye yerel mevzuatı ve BDDK düzenlemeleri, yönetmelikleri çerçevesinde KGK tarafından Türkçeye çevrilerek hazırlanmış standartlardır. IFRS ve TFRS standartları İslami bankaların ya da ülkemizde kullanılan adı ile katılım bankalarının ürün ve muhasebe özelliklerine göre hazırlanmış standartlar değildir. Bu çalışma ile Türkiye'deki Katılım Bankalarının bu iki değişik raporlama yöntemine ilave olarak AAOIFI (Accounting and Auditing Organization for Islamic Financial Institutions) muhasebe standartlarına uygun en az yılda bir kez Finansal tablolar ve dipnotlarını hazırlamaları ve bu raporları bağımsız denetimden geçtikten sonra KAP'ta duyurarak kamuoyu ile paylaşmaları önerilmektedir. AAOIFI muhasebe standartlarına uygun finansal tablolar hazırlanırken uygulanabilecek yaklaşım da bu çalışmada detaylı bir şekilde anlatılmıştır. Otuz iki adet AAOIFI muhasebe standartları özünde elli sekiz adet Faizsiz Finans (Fıkıh) standartlarını esas alarak hazırlanmış ve Katılım Bankacılığında uygulanan İslami prensiplerle çelişmemesi gereken standartlardır. Bu İslami prensiplere dayalı olarak hazırlanacak olan ve Kamu ile paylaşılacak olan Finansal tabloların Türkiye'de Katılım Bankalarının yatırımcılar, müşteriler, ortaklar ve çalışanlar nezdinde itibar ve güvenini artıracağı düşünülmektedir. Ayrıca farklı ülkelerde AAOIFI'ya göre finansal tablolar hazırlayan tüm İslami Finans kuruluşları ile uyumlaşma, birbirini daha şeffaf ve anlaşılır bir şekilde görebilme, faizsiz finans uygulamaları konusunda ve buna bağlı denetim sistemlerinde kurumsallaşma açısından da olumlu sonuçlar doğuracağı beklenmektedir. Bu artan güven ve itibar ile İslami finans sektörünün yaygın ve güçlü olduğu ülkelerden, katılım bankalarının yabancı para sukuk ihraçlarına yatırım yapmak için ülkemize uzun vadeli sukuk yatırımlarının artma olasılığının da yüksek olduğu tahmin edilmektedir. AAOIFI standartlarına uygun finansal tablo hazırlamanın diğer önemli bir faydası da ülkemizin İslami Finans Ülke endeksinde daha iyi seviyelere yükselmesinde etkin bir faktör olabileceğidir."
