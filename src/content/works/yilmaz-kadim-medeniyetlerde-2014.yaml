abstract: "Bu çalışmada, ağırlıklı olarak İslâm Ceza Hukuku ele alınmış, bunun yanı sıra tarih seyrinde ortaya çıkmış ilk medeniyetlerin tecrübeleri neticesinde inkişaf etmiş binlerce yıllık ceza düşüncesini de ortaya koymak için bu kadim toplulukların da ceza hukuklarına yer verilmiştir. Bu bağlamda“Suç ve Cezalar”zaviyesinden insanlık tarihi, İslâmiyet öncesi kadim medeniyetlerin ve semavi dinlerin hukuk-ı cezaiyelerinde düzenlenen suçlar ve cezalar ile İslâmiyet'in kabulünden sonra temayüz eden İslâm ceza anlayışının umumi manada tahlili maksadıyla da İslâm Ceza Hukuku' nda düzenlenen suçlar ve cezalar şeklinde incelenmiştir. Kadim medeniyetlerin ceza sistemlerine bakıldığında zina, hırsızlık, adam öldürme, yaralama, umumi adaba mugayir hareketler, kadının kocasına vaki hakareti, milli dinin terk edilmesi gibi pek çok fiil, toplumun umumi nizamını derinden sarstığı, aile kurumu ile toplumdaki ahlaki düşünceyi fesada uğrattığı gibi mülahazalarla, suçların en ağırı olarak görülmüş ve ölüm ile cezalandırılmıştır. İslâm Ceza Hukukunda da, kısası gerektiren kasden adam öldürme, evlilerin zinası, yol kesmek, irtidat, meşru hükümete isyan suçları ile ta'zir nev'inden olmak üzere bazı suçlar için ölüm cezası başta olmak üzere pek ağır cezalar konulduğu, fakat kısası gerektiren suçlarda evleviyetle kişilere affın öğütlendiği görülmektedir. Bunun yanı sıra İslâm şeriatı, diğer toplumların ceza düşüncesinden farklı olarak ölüm cezasının uygulanması noktasında çok esnek bir anlayışa sahiptir ve bazı şartların oluşması halinde de mezkûr cezanın affedilmesine olanak vermektedir."
