abstract: "Bu çalışma Ya'kûb b. Seyyid Alî el-Bursevî'nin (ö.931/1524) nahve dâir Şerhu Dîbâceti'l Misbâh adlı eserinin üzerine, Osmanlı ulemâsından Ahmed b. İmâd el-Hanefî el-Âyıntâbî tarafından yazılan el-Hamdiyye adlı şerhin tahkikidir. Müellif/Muhaşşî Ahmed b. İmâd el-Hanefî el-Ayıntâbî'nin taşrada yaşamasından olsa gerek ki; yapmış olduğumuz taramalarımızda hayatı hakkında herhangi bir bilgiye ulaşamadık. Bununla beraber taradığımız eserlerin listesini araştırmanın yöntemi başlığı altında zikretmiş bulunmaktayız. Müellifimiz hakkında bir bilgiye ulaşamadığımızdan tezimizin Türkçe bölümünde müellif için ayrıca bir başlık açmayı oluşturamadık. Çalışmamız, giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde araştırmamızın konusu, gayesi ve yöntemini ele aldık. Birinci bölümde eserin durumu, nüshaları, özellikleri ve tahkikte izlediğimiz yöntem hakkında bilgi verdikten sonra sonuç ile çalışmamızın Türkçe bölümünü tamamladık. İkinci bölümde ise yazma eserin tahkiki ile çalışmamızı bitirdik."
