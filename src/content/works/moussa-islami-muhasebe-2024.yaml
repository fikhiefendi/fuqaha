abstract: "Bu kapsamlı çalışma, zekât hesaplamasında kritik rol oynayan ve İslami finansal muhasebe çerçevesinde büyük önem taşıyan temel muhasebe standartlarının derinlemesine analizini sunmaktadır. Çalışma, iki önemli muhasebe standardına odaklanmaktadır: İslami Finansal Kuruluşlar için Muhasebe ve Denetim Organizasyonu (AAOIFI) tarafından yayımlanan Finansal Muhasebe Standardı 39 (FAS 39) ve Malezya Muhasebe Standartları Kurulu (MASB) tarafından yayımlanan Teknik Rapor i-1 (TRI 1). Bu araştırma, zekât hesaplaması için yenilikçi muhasebe modelleri tanıtarak Hanefi mezhebinin ilkelerine göre zekât hesaplaması yapılmıştır. Muhasebe modellerinin bu ilkelere uyarlanmasının ve bu baskın öğretilerin entegrasyonunun gerekliliğini ön plana çıkarmaktadır. Likidite, ticari ve sınai işlemler ile personel gelirleri gibi çeşitli boyutları inceleyerek, işletmelerin zekât matrahının belirlenmesinde bütünlüğü sağlayan bir çerçeve geliştirilmiştir. Metodolojik açıdan, bu çalışma nitel bir yaklaşım benimsemekte olup, bu standartlarla ilişkili teolojik temelleri, muhasebe ilkelerini ve hesaplama yöntemlerini derinlemesine araştırmak amacıyla titiz teolojik analiz ve kapsamlı vaka çalışmaları birleştirilmektedir. Bulgular, zekâta tabi varlıklar ve işlemlerin tanımlanması, sınıflandırılması ve muamelesinde önemli farklılıklar olduğunu ortaya koyarak, hesaplanan zekât miktarlarında dikkate değer farklılıklar yaratmaktadır. Zekât hesaplamalarında bilanço yanında gelir tablosunun da doğru şekilde düzeltilmesi son derece önemlidir. Şer'i kurallara aykırı kalemlerden kaçınılmalıdır. Gelir tablosunun şeri açıdan doğru bir şekilde gözden geçirilmesi gerekmektedir; bu, zekât hesaplamalarının doğruluğunu sağlamak için kritik bir adımdır. Faizden arındırılmış bilanço ve zekât temelli düzeltilmiş dönem kârı, bu çalışmanın önemli bir katkısıdır, çünkü bu yöntemle finansal durum ve finansal performansın şer'i ilkelere uygun şekilde düzenlenmesi sağlanabilmektedir. Ayrıca bu tez, zekâtın karşılaştığı çağdaş zorlukları incelemekte ve zekâtın etkin uygulanması ile ilgili fırsatlar ve engeller hakkında yenilikçi bir bakış açısı sunmaktadır. Akademik literatüre katkıda bulunarak, bu araştırma İslami muhasebe standartlarının zekât üzerindeki etkisinin titiz ve ayrıntılı bir analizini sağlamakta ve modern İslami finansal ortamlarda zekât'ın anlaşılmasını ve uygulanmasını optimize etmeye yönelik stratejik öneriler sunmaktadır. Bu öneriler, uygulayıcılar, akademisyenler ve politika yapıcılar için önemli bir rehber işlevi görmekte olup çağdaş İslami finansal bağlamlarda zekât'ın daha iyi anlaşılmasını ve uygulanmasını kolaylaştırmaktadır."
