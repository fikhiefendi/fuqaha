abstract: "İslâmî bankacılık ve finans sistemlerinin kurulması ve işletilmesi, İslâm hukukunun temel ilkelerine dayanmaktadır. Bu prensipler, şer'î ölçüleri esas alan iktisadi hayata yeni bir boyut kazandırmıştır. İslâmî bankacılık sisteminin resmî finans şekli yaklaşık 50 yıl önce başlamış ve çağdaş İslâm âlimleri, bunun modern dünya için alternatif bir bankacılık sistemi olduğunu kabul etmişlerdir. Günümüzde İslâmî bankacılık endüstrisindeki bu hızlı büyümenin sebepleri arasında, İslâm ülkelerindeki finansörlerin şer'î usül ve hükümlere uygun olan iktisadi ilkeleri uygulamayı benimsemeleri olduğu söylenebilir. Bu çalışmada, Bangladeş'te İslâmî bankacılık sisteminde uygulanan iki temel işlem incelenecektir: Bunlardan birincisi, bankanın müşterilerden \"vedîa ve mudâraba\" sözleşmesi ile para toplaması; ikincisi ise, toplanan paranın \"murâbaha, bey' müeccel, bye' istısnâʻ, bey' selem, müşâreke\" gibi çeşitli akitlerle yatırımcıya fon olarak kullandırılmasıdır. Dolayısıyla bu fon toplama ve yatırımın çalıştırılmasının fıkıh ilmine göre tahlil edilmesi çalışmamızın temel konusunu teşkil etmektedir. Bunun için ilk olarak, İslâmî bankacılık sistemiyle ilgili temel kavramlar ele alınmış, ardından tezle ilgili konular fıkıh ilimi açısından incelenmiş, son olarak klasik ve son dönemdeki fakihlerin görüşleri klasik fıkıh literatürü sistematiği esas alınarak karşılaştırılmıştır."
