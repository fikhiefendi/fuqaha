abstract: "?Fıkıh Usûlünde el-Bâkıllânî'nin el-Gazzâlî'ye Tesiri (Hüküm Çıkarma Metodları Çerçevesinde)? adlı bu çalışma `Giriş' ve `Sonuç' dışında iki bölümden oluşmaktadır.Çalışmanın Giriş kısmında fıkıh usûlünün, müelliflerimize kadar olan tarihi hakkında özet bilgiler sunduk.Birinci bölümde, el-Bâkıllânî ve el-Gazzâlî'nin hayatları, eserleri, yaşadıkları dönemlerin ilmî, siyâsî ve sosyal ortamı ve fıkıh usûlü ilmindeki yerleri hakkında bilgi verdik. Daha sonra el-Gazzâlî'nin, el-Bâkıllânî'nin görüşlerini hangi kanalla aldığı hakkında bazı tespitlerde bulunduk.İkinci bölümde, fıkıh usûlünde el-Bâkıllânî'nin hüküm çıkarma metodları açısından el-Gazzâlî'ye tesirini inceledik.Sonuç kısmında ise araştırmamızda elde ettiğimiz neticeyi özetledik."
