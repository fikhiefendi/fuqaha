abstract: "Kurân, Sünnet ve bu iki temel kaynaktan elde edilen şer'î hükümlerin anlaşılmasının birincil vasıtası olan dil ve özellikle Arapça, İslâm medeniyetinde her zaman çok önemli bir inceleme sahası olmuştur. Günümüzde Arapçaya dair akademik araştırmalar genellikle sarf, nahiv ve belâgat gibi klasik dil ilimlerine münhasır tutulurken klasik dönemde usûl-i fıkıh ilmindeki dil bahisleri dil ve anlama ait birçok önemli konunun araştırıldığı bir alanı teşkil etmekteydi. Usûl ilmindeki dil bahisleri hem klasik dil ilimleriyle irtibatlıydı hem de kendine ait meselelerin geliştiği özgün bir sahaydı. Burada ele alınan başlıca konular sözün açıklık dereceleri, emir-nehy ve umûm-husûs konularıydı. Zamanla usûl-i fıkıhta müstakil bir dil ve anlam metodolojisi gelişmiş, öyle ki miladî XIII. yy.'da ayrı bir disiplin haline gelen belâgatte kullanılan birçok terim usûl-i fıkıh ilminden alınmıştı. Usûlcüler de dil ilimlerinden istifade etmekle beraber dile dilcilerden farklı olarak hüküm çıkarma gayesiyle yaklaşmışlardı. Bu yüzden klasik dil ilimlerinde ele alınmayan dilin kesinliği, emrin mahiyeti, umûm sigaların delâleti ve mefhûmun delâleti gibi özgün meseleleri rasyonel bir bakışla tartışmışlardı. Aradaki irtibatın önemine rağmen günümüzde usûl-i fıkıh ile dil ilimlerinin ilişkisini inceleyen ve usûl ilminin dil ilimlerine katkısını gösteren çok fazla çalışma mevcut değildir. En büyük İslâm âlimlerinden olan İmâm Gazâlî'nin ömrünün sonlarında mütekellimîn metoduna göre yazdığı el-Mustasfâ min 'ilmi'l-usûl kitabı onun usûl-i fıkıhta kendi nihai görüşlerini sunduğu olgunluk dönemi eseridir. Mustasfâ, başta Bâkıllânî'nin Takrîb'i olmak üzere mütekaddimîn dönemi usûl-i fıkıh eserlerinin bir hülasasıdır. Gazâlî eserinde öncekilerin görüşlerini tahkik ederek son derece sistemli bir şekilde sunmuştur. Tezde Mustasfâ esas alınarak usûl-i fıkha ait dil ve anlam metodolojisi, usûl-i fıkıh ile klasik dil ilimlerinin arasındaki ilişki ve İmâm Gazâlî'nin dile yaklaşımı incelenmiştir."
