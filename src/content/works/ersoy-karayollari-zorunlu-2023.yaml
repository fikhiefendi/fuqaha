abstract: "Trafik kazalarında önemli bir yere sahip olan zorunlu sorumluluk sigortaları ülkemizde sigortacılık faaliyetlerinde önemli bir yere sahiptir. Her geçen gün trafik kazalarındaki artış, meydana gelen can ve mal kayıpları, üçüncü kişilerin meydana gelen zararlar karşısında korunması düşüncesi ile araç malikinin, araç işletenin, araç işletenin meydana gelen zararlardan eylemleri nedeni ile sorumlu olduğu kişiler bakımından sorumlulukların ve trafik kazasının tanımı yapılarak; bu kişilerin meydana gelen ve tanımı yapılan trafik kazası karşısındaki durumları 6098 sayılı Türk Borçlar Kanunu ile 2918 sayılı Karayolları Trafik Kanunu çerçevesinde çalışmamızın birinci bölümünde değerlendirilmektedir. Çalışmamızın ikinci bölümünde ise, tarfik kazalarında meydana gelen zararlar bakımından düzenlenen zorunlu mali sorumluluk sigortasının, zarar görenin tanımı yapılarak, Karayolları Zorunlu Mali Sorumluluk Sigortasının düzenlenmesi, sigorta sözleşmesinin tarafları, sözleşmenin düzenlenme amacı, zorunlu mali mesuliyet sigortasının hukuki niteliği ile yine 2918 sayılı Karayolları Trafik Kanunu, 6102 sayılı Türk Ticaret Kanunu ve 5684 sayılı Sigortacılık Kanunu kapsamında ele alınarak, sözleşme taraflarının yükümlülükleri de incelenmiştir. Yine Karayolları Zorunlu Mali Sorumluluk Sigortasına bağlanan hukuki sonuçlar sigortacı ile sigorta ettiren ve zarar gören açısından yine sigorta ettiren/sigortalı ile zarar gören açısından ayrıca değerlendirilmektedir. Son olarak ise; Karayolları Zorunlu Mali Sorumluluk Sigortası'nda sigorta himayesinden bahsedebilmek için öncelikle bir kısım şartların mevcut olması gerekmektedir. Tezimizin asıl konusunu oluşturan husus, Karayolları Zorunlu Mali Sorumluluk Sigortasında Sigorta Himayesinin Kapsamı olup; tez konumuzun açıklanması bakımından söz konusu sorumluluk sigortasının şartlarının değerlendirilmesi gerekmektedir. Bu hali ile tezimizin son kısmında sorumluluk xiii sigortasının şartları açıklanarak, karayollarında motorlu aracın işletilmesi nedeni ile trafik kazası meydana gelmesi halinde sorumluluk sigortasında hangi teminatların sözleşme kapsamında yer aldığı hangi teminatların sözleşme istisnası olarak yer aldığı hususu açıklanmak sureti ile ele alınmıştır. Motorlu aracın işletilmesi sonucu meydana gelen trafik kazası sonucunda oluşan zarar karşısında zarar ören üçüncü kişinin 2918 sayılı Karayolları Trafik Kanunu'nun 97. madde hükmü de dikkate alınarak doğrudan doğruya dava hakkını ne şekilde kullanacağı incelenmiştir. Çalışmamızda konu sınırlaması alanı olan, 2918 sayılı Karayolları Trafik Kanunu'nun Anayasa Mahkemesi tarafından 92/i maddesinin iptal edilmesi ile birlikte Karayolları Zorunlu Mali Sorumluluk Sigortası Genel Şartlarında yapılan değişiklikle birlikte, yargı kararlarında meydana gelen farklılıklar ve geriye yürümezlik kuralı doğrultusunda sigorta himayesi dışında kalan tek taraflı olarak karayolunda meydana gelen trafik kazası sonucu tam kusurlu motorlu araç sürücüsünün vefatı nedeni ile destekten yoksun kalanlarının Poliçe Genel Şartlarında yapılan değişiklik itibari ile sigorta himayesinden ne şekilde yararlanacakları yargı kararları da dikkate alınmak sureti ile yine çalışmamızın son kısmı olan üçüncü bölümünde değerlendirilmiştir."
