abstract: "Bu çalışma, çağdaş ekonomik sistemin doğurduğu sosyoekonomik adaletsizliklere karşı alternatif bir finansman modeli olarak İslam iktisadının temel kurumlarından biri olan zekâtı ele almaktadır. Kapitalist sistemin finansmana erişimi belirli çıkar gruplarının denetimine bırakması, gelir eşitsizliğini derinleştirirken, toplumsal refahın yalnızca ekonomik göstergelere indirgenmesine yol açmıştır. Bu bağlamda tezde, zekât kurumu klasik fıkıh literatürü ve tarihsel uygulamalar çerçevesinde yalnızca bireysel bir ibadet olarak değil, aynı zamanda ekonomik dengeyi sağlamaya yönelik sistemli ve kurumsal bir mekanizma olarak değerlendirilmiştir. Zekâtın hukuki temelleri, dağıtım esasları ve toplumsal etkileri bütüncül bir yaklaşımla analiz edilmiş; elde edilen bulgular, zekâtın kurumsal bir yapı içinde sistematik biçimde uygulanması hâlinde işsizlikle mücadele, gelir dağılımındaki adaletsizliklerin giderilmesi, ekonomik üretkenliğin artırılması ve sosyal adaletin tesisi gibi makroekonomik düzeyde önemli işlevler üstlenebileceğini ortaya koymuştur. Ayrıca, devletin şeffaf ve dijital altyapılarla desteklenen, izlenebilir bir zekât organizasyonu oluşturmasının toplumsal kalkınmayı destekleyeceği ve zekâtın sürdürülebilir kalkınmanın, sosyal barışın ve ekonomik adaletin inşasında stratejik bir araç olarak değerlendirilebileceği sonucuna ulaşılmıştır."
