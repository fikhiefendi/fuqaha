abstract: "Doktora tezi, vakıf kuruluşlarında dijital dönüşümü desteklemek için şer'i hükümler ve geleneksel değerlerle uyumlu bütünleşik bir organizasyonel model tasarlamayı amaçlamaktadır. Model, on iki temel alana dayanmaktadır: strateji, organizasyonel yapı, sistemler, personel, beceriler, liderlik stilleri, ortak değerler, şer'i hükümler, açıklık ve şeffaflık, hesap verebilirlik ve denetim, paydaşlara karşı sorumluluk ve özerklik. Bu tezde çalışma yöntemi olarak, teorik analiz ve pratik uygulamayı birleştiren bütünleşik bir bilimsel metodoloji benimsenmiştir. Betimleyici, analitik ve uygulamalı yaklaşımlar kullanılarak, dijital dönüşüm çağında vakıf kuruluşlarının ihtiyaçlarını karşılayan bütünleşik ve sürdürülebilir bir modelin oluşturulması sağlanmıştır. Çalışmanın başlıca sonuçları şunlardır: - Uzmanlar, vakıf kuruluşlarında organizasyonel gelişim için önerilen modelin her bir alanı üzerinde büyük ölçüde mutabık kalmışlardır. On iki alanın tamamı uzmanlardan oldukça yüksek düzeyde onay almıştır. - α=0.05 anlamlılık düzeyinde, her bir alan ile diğer alanlar arasında ve ayrıca her bir alan ile önerilen organizasyonel gelişim modelinin tamamı arasında istatistiksel olarak anlamlı bir korelasyon bulunmaktadır. Çalışma, aşağıdaki önerilerle sonuçlanmıştır: - Önerilen örgütsel gelişim modelinin vakıf kuruluşları tarafından benimsenmesi. - Vakıf kuruluşlarının stratejilerinde dijital dönüşüme özel bir önem vermeleri gerekmektedir."
