abstract: "Bu çalışmanın amacı, İbn Atıyye ile son dönem müfessirlerinden çok yönlü bir alim olan Şevkânî'nin Kur'ân'ı tefsir yöntemlerini ve tefsir ilmine katkılarını karşılaştırmalı olarak araştırmaktır.Bu çalışma; bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında Endülüs'te yaşamış İbn Atıyye'nin ve Yemen'de ömrünü devam ettirmiş Şevkânî'nin hayatları ve yaşadıkları ortam hakkında anahatlarıyla bilgi verdik. Birinci bölümde; her iki tefsirin, genel özellikleri ve kaynakları açısından karşılaştırmasını yaptık.İkinci bölümde; el-Muharraru'l-Vecîz ile Fethu'l-Kadîr isimli tefsirleri Kur'ân ilimleri açısından mukâyese ettik.Üçüncü bölümde; her iki tefsirin yazılış biçimlerini ve bu tefsirleri; kelâm, kırâat, fıkıh, filoloji ve tasavvuf açısından inceledik. Bu çalışmamızda; gerek İbn Atıyye'nin gerekse Şevkânî'nin tefsirlerinde, pek çok alana ait zengin kaynak kullanmışlardır. Bununla birlikte Şevkânî'nin, kendi yaşadığı dönemin imkanlarından dolayı literatüre hâkimiyet yönüyle İbn Atıyye'den daha ileri düzeyde olduğu kanaatine vardık. Her iki müfessirin geleneksel tefsir yöntemini kullanıp kullanmadıklarını belirlemeye çalıştık. Sonuçta onların da bu yöntemi uyguladıklarını gördük. İki müfessirin tefsirleri, şekil olarak düzenli ve sistematiktir. Ancak İbn Atıyye, tefsirinin mukaddimesinde izah edeceği konulara bab başlığı koyup onları ayrıntılı ve sistematik anlatması yönüyle Şevkânî'den daha ileri düzeyde olduğu görülmektedir."
