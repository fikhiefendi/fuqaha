abstract: "Konvansiyonel sigortacılığın İslami finanstaki alternatifi olan tekafül, son yıllarda dünyada hızla gelişme göstermektedir. Tekafül sektörü her ne kadar Türkiye'de yavaş yavaş gelişse de dünya ortalamasının gerisinde kalmaktadır. Bu nedenle Türkiye'nin kendi durumunu incelemesi ve dünyanın en gelişmiş tekafül ekosistemine sahip Malezya'nın değerli tecrübelerinden ders çıkarması gerekmektedir. Bu çalışmanın amacı, Türkiye'de tekafül sisteminin gelişimini etkileyen faktörleri incelemek ve ileride daha sağlıklı bir tekafül ekosistemi için faydalı ve uygulanabilir öneriler geliştirmektir. Bu amaca ulaşmak için çalışmada karma araştırma yöntemin keşfedici sıralı deseni kullanılmıştır. Öncelikle Malezya'daki tekafül sektörünün gelişimi ile ilgili tecrübelerini aktarmak ve Türkiye için değerli tavsiyelerde bulunmaları için tekafül konusunda oldukça tecrübeli uzmanlar ile mülakat gerçekleştirilmiştir. Elde edilen nitel verilerden fenomenolojik yaklaşım ile tematik kodlar oluşturulmuş ve bu temalar bağlamında bulgular değerlendirilmiştir. Tekafül ekosisteminin kapsamlı yapısı itibariyle ilk aşamada tekafül sisteminin gelişimini etkileyen genel meseleler nitel analiz yöntemi ile alınmış ve ikinci aşamaya geçilmiştir. Bu aşamada müşterilerin tekafül ürünlerini tercih etmesini etkileyen faktörleri incelemek için nicel analiz yöntemi kullanılmıştır. Bu kapsamda, potansiyel tekafül müşterilerine anket yapılmış ve tekafül ürünlerini tercih etme niyetleri planlı davranış teorisi bağlamında ele alınmıştır. Bulgular; tekafül farkındalığı, düzenleyici ve denetleyici mekanizmaların işleyiş süreçleri, beşerî sermaye, acenteler, İslami finansa özgün sorunlar, İslami finansal yatırım araçları tekafül modelleri ile zorluklar ve beklentiler bağlamında tartışılmıştır. Daha sona tekafül sektör temsilcileri, düzenleyici ve denetleyici yapılara yönelik çeşitli politika önerileri geliştirilmiştir. Sonuç itibariyle, bu çalışma Türkiye'deki tekafül piyasasının sorunlarını teşhis etmeye ve buna bazı çareler sunmaya çalışmaktadır. Bu çalışmanın, Türkiye tekafül ekosistemine fayda sağlaması ve Türkiye tekafül sistemi konusunda yapılacak çalışmalara yol gösterebileceği düşünülmektedir."
