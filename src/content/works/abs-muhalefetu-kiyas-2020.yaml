abstract: "Bu tezin konusu olan“Arapça'da vezinler ve fiil çekimlerinin kuralları”sarfi (morfolojik) araştırmalar kapsamına girmektedir. Nitekim bu babların ele alınması, kutsal dil Arapçayı anlama ve onun inceliklerinin farkına varma yolunda atılan ilk adımlardır. Sarf ilmi, titizlikle belirlenmiş kıstaslara ve kelime yapısının anlaşılmasını sağlayan kapsamlı kurallara dayanmaktadır. Hal böyleyken, bu kuralların istisnaları dikkat çekip araştırmaya teşvik etmektedir. Dilsel kullanımda sarf ilminin ortaya koyduğu kuralların terkedilmesi oldukça yaygın bir olgudur. Neredeyse sarf ilmindeki bütün bablarda kurallara aykırı formda kullanılan kelimeler vardır. Bu araştırma, sarf ilmini daha güçlü hale getirmek amacıyla kural dışı bir formda kullanılan kelimeleri inceleyip klasik kitaplarda bu istisnai kullanımların gerekçelerini açıklamak için ortaya atılan görüşleri beyan edecektir. Bu bağlamda ki örnekler teorik temellere dayanan kurallara ve dildeki kullanım şekillerine binaen ortaya çıkan dayanaklara erişebilmek için kapsamlı bir bakış açısıyla incelenecektir. Bu tez önsöz, 4 bölüm ve bir adet ek kısmından oluşmaktadır. Önsözde Firuzabadi ve kendisinin sözlüğünden bahsedilmektedir. Birinci bölümde mastarlar ve türemiş kelimelerdeki istisnalar zikredilmiştir. İkinci bölümde dişil, müsenna, çoğul, küçültme sıfatı ve nispet formundaki fer'i isimlerin kurala aykırı formu yani istisnai kullanımları incelenmiştir. Üçüncü bölümde ibdal, i'lal, idğam, tahfif-i hemze, hazf ve ziyade gibi müşterek sarf bahislerindeki kural dışı kullanımlar ele alınmıştır. Dördüncü bölüm ise nahiv alimlerinin kurala aykırı formda kullanılan kelimelere yönelik tutumları ve kelimeleri kurallı formalarla ilişkilendirme girişimlerini incelemek için ayrılmıştır. Bu araştırmanın iki temel hedefi vardır. Birincisi; sarf alimlerinin ileri sürdüğü teorik kuralların dilin gerçek yapısı ile bağdaştığını gözler önüne sermektir. Bu bağlamda temel Arapça sözlüklerden biri olan Firuzabadi'nin“El-Kamusul Muhit”adlı eserini esas alarak bu konuya ışık tutması için dildeki pratik kullanımlara başvurulmuştur. İkincisi ise kelime yapısı bakımından Arapça dilbilgisi kurallarına aykırı olan kelimelerin derlendiği yeni bir sözlüğün Arapça sözlükler kütüphanesine eklenmesi çabasıdır."
