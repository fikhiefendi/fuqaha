abstract: "Sağ ya da ölü olduğu bilinemeyen kayıp kişilerin hukukî durumları üzerinde bir belirsizlik hâkimdir. Bu belirsizlik hâlinin giderilmesi ve gerek kaybolanın gerekse kaybolan ile hukukî ilişkisi bulunan kişilerin hak ve menfaatlerinin dengelenmesi amacıyla hukuk sistemleri çeşitli çareler öngörmüştür. Bu çalışmada, kayıp kişi hakkında Türk medenî hukuku ve İslam hukuku sistemlerinde geliştirilen kıstaslar ve mahkemece verilen gaiplik (hükmen ölüm) kararının hüküm ve sonuçları incelenmiş ve mukayese edilmiştir. Mahiyet itibariyle bir“mikro mukayeseli hukuk”çalışması olan bu tezin birinci bölümünde Türk medenî hukuku ve İslam hukuku sistemlerinde kişi, kişilik ve kişiliğin sona ermesi kavramları mukayeseli olarak incelenmiştir. Çalışmanın ikinci ve üçüncü bölümlerinde Türk medenî hukuku ve İslam hukuku sistemlerinde gaiplik kurumu ayrı ayrı ele alınmış ancak takip edilen ortak başlıklandırma usulü sayesinde bir mukayese zemini oluşturulmuştur. Dördüncü ve son bölümde ise Türk medenî hukuku ile İslam hukuku sistemlerinin gaiplik kurumuna ilişkin düzenlemeleri mukayese edilerek birtakım benzerlikler ve farklılıklar tespit edilmiştir. Muhteva itibariyle“dogmatik tatbikî mukayeseli hukuk”olarak nitelenen bu çalışma vasıtasıyla Türk medenî hukukuna eleştirel bir gözle bakma imkânı bulunmuş ve günümüz hukukunu geliştirmek adına bazı teklifler sunulmuştur."
