abstract: "Bu çalışmamızda, devrinin önde gelen âlimlerinden ders aldıktan sonra ilmiye sınıfının değişik kademelerinde on altı yıl süreyle görev almış hatta Şeyhülislam vekilliğine kadar yükselmiş, Osmanlı Devletinin yıkılışına şahit olmuş, hayatının yarısını Kahire gibi bir ilim merkezinde geçirerek ellinin üzerinde eser te'lif etmiş ve te'lif ettiği eserleriyle ehl-i sünnet akidesini ve Hanefi mezhebini müdafaa etmiş olan Zahid el-Kevserî'nin hayatını, İslamî ilimlerdeki çalışmalarını, eserlerini, önemli görüşlerini ve fıkıh düşüncesini ele aldık. Bununla ulaşmak istediğimiz amaç, Osmanlı medreselerinin yetiştirdiği büyük âlimlerden birisi olan Kevserî'nin daha iyi tanınmasına hizmet etmek ve Kevserî hakkında yapılacak yeni çalışmalara kapı aralamaktır.Tez üç ana bölümden oluşmakta olup, birinci bölümde Kevserî'nin hayatını, ikinci bölümde eserlerini ve ilmî şahsiyetini, üçüncü bölümde ise fıkıh düşüncesini ele aldık. Kevserî, her ne kadar yeni ve orijinal görüşler ortaya koymak yerine bütün gayretini geleneği muhafaza etme yolunda kullanmış olsa da onun eserleri ve düşünceleri daha birçok çalışmaya konu olabilecek enginliktedir."
