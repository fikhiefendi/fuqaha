abstract: "Osmanlı hukukunda talak, tefrik ve muhala'a olmak üzere üç farklı boşanma yöntemi bulunmaktaydı. Ayrıca lian, ila ve zihar evliliğe dolaylı olarak son veren usullerdi. Talak hakkı kocaya tanınan bir ayrılık yöntemiydi. Mahkeme kararıyla boşanma anlamına gelen tefrik sebepleri Osmanlı Devleti'nin resmi mezhebi olan Hanefi mezhebinde dar yorumlanmaktaydı. XVI. yüzyılın ortalarından itibaren kadı ve müftü beratlarında kadıların Hanefi mezhebi dışında kalan mezhep içtihatlarına göre hüküm kurması yasaklandı. Bu nedenle kadınlar kendileri için çekilmez hale gelen evliliğe son verebilmek için çoğunlukla muhala'a yöntemine yöneldi. Tarafların anlaşarak boşanması anlamına gelen muhala'a yönteminde kadın kocası lehine birtakım mali fedakarlıklarda bulunuyordu. Koca ayrıca talak yöntemi ile boşanması halinde karısına vermek zorunda olduğu mehr-i müeccel, iddet nafakası ve me'ûneti süknâ gibi mali yüklerden de kurtuluyordu. Kadın için devam ettirmek istemediği evliliğe son verme imkânı sunan; koca için ise ekonomik avantajları bulunan muhala'a kadı sicili kayıtlarında sıklıkla yer bulmaktaydı."
