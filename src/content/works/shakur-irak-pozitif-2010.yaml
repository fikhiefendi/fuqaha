abstract: "Geçmişten günümüze Irak bölgesinde yaşayan insanlar değişik kanunlarla idare edilmiştir. Ancak bu kanunları birbirinden bağımsız düşünmek yanlış olur. Bu nedenle Irak'ta Pozitif Hukuk Gelişmeleri ve Kerkük'ün Hukuki Statüsü'nü araştırmaya çalıştık.Tarihin başlangıcından günümüze kadar Mezopotamya ülkelerinde yaşamış olan toplumları, bu toplumların yönetildiği kanunları ve anayasaları bu yönüyle ele aldık. İslam öncesi hukuk, İslami dönemde hukuk ve İslami dönemin sonu kabul edilen Osmanlı İmparatorluğu döneminde hukuku inceledik.Daha sonra Irak'ın İngilizler tarafından işgali, Irak'ta Krallık, Sosyalist Dönüşüm (Cumhuriyet Dönemi) ve Krallık yönetiminden sonra kurulan cumhuriyetler döneminde hukuk ele alınmıştır.Çalışmamız, 2003 yılında Bağdat'ın Amerika işgaline boyun eğdiği dönem yanı sıra Irak'lıların yönetimi teslim alıp Demokratik bir devlet kurarak Iraklılar tarafından 2004 yılında milli bir anayasa hazırlandığı tarihe kadar devam eden Amerika işgali dönemini de kapsamaktadır.Bu aşamadan sonra, halkı, yukarıda belirtilen dönemlerde yıllarca zulme, baskıya ve şiddete maruz kalan Kerkük'ün Hukuki Statüsü'ne yer verdik.Çalışmada; Kerkük'te hukukun en istikrarlı olduğu dönemin Osmanlı İmparatorluğu dönemi olduğu, bu dönemin köklü yönetim ve düzenleme bakımından diğer dönemlerden oldukça farklı yapıya sahip olduğu, ırk ve milliyet bakımından halkın bireyleri arasında herhangi bir ayrım yapılmadığı dikkatimizi çekmektedir. Bunun yanı sıra, Kerkük ili, yüzyıllarca haksızlığa uğrayan ve baskı altında yaşamaya mahkûm edilen Kerkük halkı, Kerkük'ün güzelliği, doğal yapısı, coğrafi konumundan dolayı doğal, tarihi ve kültürel zenginliği ile ilgili birtakım tavsiyeleri aktardık."
