abstract: "Roma Hukuku'nda locatio conductio terimi, bir malın belirli bir bedel karşılığında kullanılması veya o maldan yararlandırılması (locatio conductio rei), belli sürede bir işin görülmesi (locatio conductio operarum) ve belirli bir sonucun ortaya çıkarılmasının üstlenilmesi (locatio conductio operis) hukuki işlemlerinin hepsinde genel olarak kullanılmaktadır. Locatio conductio rei, kiraya verenin (locator) tüketilemeyen belirli bir malı kullanmasını (res locata) veya o malı kullanıp semerelerinden faydalanmasını (fruenda locata) sağlayan, kararlaştırılmış bir bedel (merces) karşılığında kira konusunu kiracıya (conductor) devretme borcu altına girdiği, tam iki tarafa borç doğuran rızai bir sözleşmedir.Hem bir malın kullanılmasında, hem de bir malın kullanıp semerelerinden faydalanılması durumlarında Roma'da, ?locatio conductio rei? şeklinde tek bir sözleşme söz konusu olmaktaydı. Günümüz hukuklarında ise, ilk durumda ?Adi Kira Sözleşmesi?nden; ikinci durumda ?Hasılat Kirası Sözleşmesi?nden söz edilmektedir.Roma'da kira sözleşmesinin konusunu, hem taşınır (res mobiles) hem de taşınmaz mallar (res immobiles) gibi maddi olan; rehin hakkı gibi maddi olmayan şeyler oluşturmaktaydı.Roma Sözleşmeler Sistemi'nde rızai sözleşmeler içinde yer alan kira sözleşmesinin geçerli olarak kurulabilmesi için, kiraya veren ile kiracının sözleşme konusu ve kira bedeli üzerinde anlaşmaları gerekmekteydi. Locatio conductio rei'nin taraflarının kira konusunun belirli bir bedel karşılığında kullandırılması hususunda karşılıklı ve birbirlerine uygun irade beyanlarını açıklamaları sözleşmenin kurulması için gerekli ve yeterliydi. Kira sözleşmesinin bir rızai sözleşme olması nedeniyle, Roma Sözleşmeler Sistemi içindeki diğer sözleşme gruplarının aksine, kurulması için herhangi bir sözlü ya da yazılı şekil şartı öngörülmemekteydi.Roma Hukuku'nda kira sözleşmesinin tarafları, kiralayan (locator) ve kiracı (conductor)'dır. Locator'un, kendisine ait tüketilemeyen belirli bir şeyin kullanılmasını veya o şeyi kullanıp semerelerinden faydalanılmasını sağlayan kimse; conductor'un ise, kiraladığı mal karşılığında locator'a belirli bir bedel ödemekle yükümlü olan kimse olduğu görülmektedir.Locator'un kira sözleşmesinden doğan asli edim yükümlülükleri, kiracıya sözleşme konusu şeyin kullanılmasını temin etmek ve bu amaçla gerekli masrafları yapmaktır. Buna karşılık conductor da, sözleşmede kararlaştırılan kira bedelini ödeme ve kira konusunu özenle kullanıp kiralayana iade etme borcu altında bulunmaktadır. Locatio conductio rei'de kiralayan ile kiracının sözleşmeye ek hüküm ve şartlar (lex contractus) eklemeleri mümkündü. Sözleşmeye aykırılık halinde taraflara, ius civile tarafından iyiniyet davası (actio locati/ actio conducti) açma hakkı tanınmaktaydı. Locatio conductio rei'de kiracının her zaman sözleşme gereği bir ücret, yani para (merces) ödemesi gerektiği; aksi halde taraflar arasındaki hukuki işlemin, locatio conductio rei değil isimsiz bir sözleşme (contractus innominati) haline geldiği görülmektedir. Kira sözleşmesinin tam iki tarafa borç yükleyen bir sözleşme olması nedeniyle, taraflardan birinin malvarlığında karşılıksız bir artma, yani bağışlama sebebiyle (causa donationis) yapılması mümkün değildi. Roma Hukuku'nda locator'un, kiraya verdiği malın mutlaka maliki olması gerekmemekteydi. Dolayısıyla Roma'da conductor, kiralamış olduğu bir malı başka bir kimseye kiraya verebilmekte, yani alt kira (sublocatio) yapabilmekteydi. Kira sözleşmesinde kira konusundan conductor'un çekişmesiz olarak yararlanmasını sağlama borcu altında olması dolayısıyla kiralayanın, kiracıya karşı kira konusundaki hukuki ayıplardan sorumluluğu bulunmaktaydı. Ayrıca kiralayan locatio conductio rei'de, kira konusunun benzer şeylerden beklenen özelliklere sahip olmaması halinde, kiracıya karşı maddi ayıplardan da sorumluydu. Kira bedelinin ödenmemesi durumunda, Iustinianus Dönemi'nde kira konusuna kiracının getirdiği şeyler üzerinde teminat olarak kiralayanın kanuni rehin hakkı bulunmaktaydı. Buna karşılık kiracı da, kira konusu mal için yapmış olduğu zorunlu ve faydalı masrafların kiralayan tarafından ödenmemesi durumunda; kira sözleşmesi konusu mal üzerinde hapis hakkına (ius retentionis) sahip olmaktaydı. Iustinianus Dönemi'nde, locatio conductio rei'nin tam iki tarafa borç yükleyen bir sözleşme olması nedeniyle; locator ve conductor birbirlerine karşı bütün kusurlardan (omnis culpa) sorumlu tutulmaktaydı. Kira sözleşmesinde tarafların kusuru olmaksızın kiracının kira konusundan yararlanma imkânının kalmaması durumunda, kiracının kira bedelini ödemekten kurtulduğu görülmektedir. Dolayısıyla locatio conductio rei'de hasar, kiralayana aitti. Roma'da tarafların birbirlerine uygun irade beyanları ile (consensus) kurulan locatio conductio rei'de sözleşmenin tarafları, söz konusu bu sözleşmeleri bozmaya yönelik zıt irade beyanları (contrarius consensus) ile aralarındaki hukuki ilişkiyi sona erdirebilmekteydi. Belirli süreli kira sözleşmelerinde, sözleşme süresinin sona ermesinden sonra; tarafların hukuki ilişkinin devamı yönünde açık ya da zımni irade beyanlarının olmaması halinde, locatio conductio rei kendiliğinden sona ererdi. Ancak kiracının kira bedelini süresinde ödememesi, taşınmaz kiralarında sebepsiz olarak kira konusunu terk etmesi, çiftlik kiralarında araziyi ekip biçme görevini ihmal etmesi, kira konusu şeyi kötü kullanması hallerinde kiralayan; sözleşmenin süresinin dolmasından önce sözleşmeyi sona erdirebilme imkânına sahipti. Buna karşılık kira konusunun kullanım için uygun olmayan bir hale gelmesi veya sözleşme konusunun kullanımının kendisi için tehlike arz ermesi durumlarında kiracı da, sözleşmenin süresinin bitiminden önce sözleşmeyi sona erdirebilmekteydi. Belirsiz süreli kira sözleşmelerinde ise, taraflardan her biri, sözleşmeyi istediği zaman tek taraflı olarak feshedebilmekteydi. M. S. 214 yılında Caracalla tarafından çıkarılan bir emirname ile taşınmaz kiralarında kira bedelini düzenli ödeyen kiracının kiralayan tarafından sebepsiz olarak taşınmazdan çıkartılamaması ilkesi getirildi. Ancak yine de taşınmaz sahibi, taşınmazı tamir etmesi gerektiğini (corrigere domum), kiracının kira konusunu kötü kullandığını ya da sözleşme konusunu bizzat kullanmak zorunda olduğunu ispat etmek suretiyle sözleşmeyi sona erdirebilmekteydi. Kiralayanın kendisinin taşınmaza ihtiyacı olması durumunda kiracıyı koruyan gereklilik ve zorunluluk şartları, İmparator Iustinianus tarafından tanındı."
