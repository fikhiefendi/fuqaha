abstract: "Fıkıh usulü, İslam hukuk düşüncesinin temel disiplinlerinden biri olarak, şer'î hükümlerin kaynağını, delil değerini ve çıkarım yöntemlerini sistematik bir biçimde inceleyen ilim dalıdır. Sünnet, İslam hukukunun kaynakları içerisinde ikinci delil olması bakımından önemli bir konuma sahiptir. Bu bağlamda sünnetin, özellikle de Hz. Peygamber'in (sallallahu aleyhi ve sellem) fiillerinin, hüküm çıkarımındaki rolü usul literatüründe önemli bir tartışma alanını teşkil etmektedir. Hz. Peygamber'in fiillerinin şer'î delil olup olmadığı, bağlayıcılık derecesi, fiillerden hüküm çıkarma yöntemleri ve benzeri meseleler klasik kaynaklarda farklı yaklaşımlarla ele alınmıştır. Bu çalışma, söz konusu meseleyi Ebû Şâme el-Makdisî'nin“el-Muḥaḳḳaḳ min ʿilmi'l-uṣûl fîmâ yeteʿallaḳu bi-efʿâli'r-Resûl”adlı eseri üzerinden incelemekte ve bu eserin, Hz. Peygamber'in fiillerine dair usulî tartışmalarda sahip olduğu konumu ortaya koymayı amaçlamaktadır.“El-Muhakkak”, bu alanda kaleme alınmış ilk müstakil eserlerden biri olması bakımından hem içerdiği özgün görüşler hem de usul ilmine katkısı açısından tezimize konu olarak seçilmiştir. Tez, üç ana bölümden oluşmaktadır. Birinci bölümde, Ebû Şâme el-Makdisî'nin hayatı, ilmî kişiliği, ders verdiği kurumlar ve eserleri ele alınmıştır. İkinci bölümde, onun öncesindeki usul âlimlerinin, Hz. Peygamber'in fiillerinin nasıl ele alındığı işlenmiştir. Üçüncü bölümde ise,“el-Muhakkak”adlı eser ayrıntılı bir biçimde incelenmiş, müellifin görüşleri sistematik şekilde analiz edilmiş ve bu görüşlerin beslendiği kaynaklar orijinal referanslarıyla birlikte ortaya konmuştur. Bu çalışma, Hz. Peygamber'in fiillerinin usul açısından değerlendirilmesine katkı sağlamayı ve klasik fıkıh usulü literatürünün güncel araştırmalarda yeniden konu edilmesine katkıda bulunmayı amaçlamaktadır."
