abstract: "Bu araştırma geçmişten günümüze fert ve toplum hayatında yer almış, toplumun hukuki, iktisadi ve ahlaki değerlerini yakından ilgilendiren ve bu değerlerin değişmesinde fevkalade müessir olan faizin İslâm'da yasaklanmasının Ca'ferî mezhebinde usûl açısından gerekçesinin irdelenmesi ile ilgili bir çalışmadır. Sadece dinin kapsamında ve yargı alanında olmadığından mahiyeti ve meşrulaştırılmaya çalışılırken sergilenen felsefi ve iktisadi yaklaşımlardan bahsedilerek gerekli görülen yerlerde Hukuk metodolojisi ile ilgili muhtasar bilgiler verilmiş, illeti belirlemede Sünni mezheplere göre Ca'feriyenin farklı metodolojik yaklaşımları açıklanmıştır. Bu yaklaşımlarına göre tespit edilen illet ve şartlar ölçü alınarak ribevî malların kapsamı, varılan sonuç ve hükümler ortaya konulmuştur. Sermayenin sosyal refaha katkısının inkâr edilemeyeceği ancak sermayeden yararlanmada adil yolu İslâm'ın belirlediğini, metodolojideki nüanslara ve farklı metodolojik prensiplerden hareket etmelerine rağmen Hanefilerle illet ve şartlarda aynı görüşte olan Ca'feri mezhebinde de ribaya bakış ve hüküm itibariyle farklılık olmadığı belirlenmiştir."
