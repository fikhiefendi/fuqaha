abstract: "?Zeydî Usulcülerin Kaynak Anlayışı? isimli tezimiz giriş ve üç bölümden oluşmaktadır.Girişte konu ile alakalı teknik bilgiler verilmiş, birinci bölümde Zeydiyye'de Şer`î hükmün kaynaklarının gelişim ve değişim süreci incelenmiştir. Zeydî usûlünde hicrî II. asırda, ?kitap, sünnet, icmâ` ve kıyas? şeklinde sade bir yapı arzeden kaynaklar; hicrî III. asra tekabül eden ?kelam tesirindeki dönem?de ?akıl, kitap, sünnet, icmâ` ve kıyas? şeklinde, sıralanmıştır. Bu dönemden itibaren Zeydî usûlünde ?Mu`tezilî? usûlcülerin tesirini görmek mümkündür. Zeydî usûlünün hicrî V. asra tekabül eden ?klasik tasnif dönemi?nde kaynaklarda bir genişleme olmuş, aklın yerini daha net bir şekilde, istidlâl yöntemleri ve çeşitlerinden kabul edilen ?ıstıshâb? ve ?istihsân? gibi kaynak/metodlar almıştır. Hicrî V. asırla birlikte başlayan bu dönem, Zeydî usûlünde hem kaynakların şekillenmesi, hem de, kaynaklara yaklaşım açısından oldukça verimli geçen bir dönemi ifade eder. Zeydî usûlünün son evresi, bu asrı ifade eden ?çağdaş? dönemdir. Bu dönemde, hicrî III. asırda olduğu gibi, ?akıl? yeniden kaynaklar arasına yerleştirilmiş, hadislerin ?Kur'ân'a arzı? ve ?akla vurulması? gibi yöntem önerileri de öne çıkmıştır.İkinci bölümde Zeydiyye'de aslî kaynak kabul edilen Kur'ân ve Sünnet ele alınmıştır. Zeydî usulcülerin kitaba yaklaşımları genel çerçevede sünnî usulcülerden çok farklı olmamış, bunun yanında kitap tanımları, kıraatler ve lafızlarının hükme delaleti gibi konulardaki tercihleri yer yer özgün bir yapı arz etmiştir. Zeydî usulünde, şer`î hükmün ikinci kaynağı, ?sünnet?tir. Zeydîler, özellikle âhâd haberleri kabulde ileri sürdükleri ilkeler açısından kendilerine has bir yöntem önerisi içerisinde olmuşlardır. Onların, Kur'ân-sünnet ilişkisine yönelik tespitleri, Sünnî usûlcülerle neredeyse aynı tartışmaları içermektedir.Üçüncü bölümde Zeydî usulcülerde tâlî kaynaklara yer verilmiştir. Bu bölümde, icmâ`, Ehl-i Beyt'in icmâ`ı, Hz. Ali'nin içtihatları, istihsan, ıstıshab ve akıl gibi kaynaklara temas edilmiştir. Zeydîlerin, Sünnî usulcülerden farklılaştığı en temel nokta Ehl-i beyt müçtehitlerinin icmâ`ı ile Hz. Ali'nin içtihatlarının şer`î bir kaynak olarak kabul edilmesidir. Bu iki kaynağın haricinde onların sünnî usulcülerden fazlaca farklı düşündüklerini söylemek oldukça zordur. İstihsan, Zeydî usûlünde, maslahat hariç, tüm türevleri ile birlikte kabul edilen bir metoddur. Verdikleri örnekler dikkate alındığında, Zeydîlerin, istihsan konusunda Hanefîlerden etkilendiği söylenebilirse de, bu etkileşimin doğrudan Hanefî usulcüler vasıtasıyla değil, Mu`tezilî usulcüler aracılığı ile olduğu pekala söylenebilir.Zeydî usulcülerin kaynak anlayışları, farklı fıkhî ekollerin tesirini hissettirse de, kendine has ve özgün kabul edilebilecek bir yapı arzetmekte ve ?Zeydî? tercihleri yansıtmaktadır. Ancak bu usûlün oluşumunda, Zeydî alimler kadar, ?Mu`tezilî? ve ?Mütekellimîn? usulcülerin tesiri de büyük olmuş; ?Hanefî? usulcülerin katkısı ise sınırlı kalmıştır."
