abstract: "Ahkâm defterleri Osmanlı dönemi hukuk sisteminin elimizdeki et ve kemiğe bürünmüş halidir. Genelinde hukuk sistemi olarak ele aldığımız bu defterler özelinde tutulduğu bölgenin sosyo kültürel yönünü, adli ve idari yapısını, ekonomik durumunu anlamamızda bize yardımcı olacak ana kaynaklardandır. İslam hukuku açısından değerlendirdiğimiz takdirde yakın tarihte şer'i hükümlerin uygulama olarak hayata geçtiği son mahkeme kayıtlarındandır. Yaşamış olduğumuz çağda örfi birçok uygulamanın temelinin yine bu hukuk sistemine dayalı olduğunu görmekteyiz. Yapılan bu çalışmayla bölgenin geçmişten bugüne dini, örfi, kültürel, adli ve idari yapısının değişim ve dönüşümünün kıyaslanabilmesi adına da yardımcı olabilecek bir kaynak oluşturulabilmesi için gayret edilmiştir."
