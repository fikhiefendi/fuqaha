abstract: "Kur'an'ın ayetlerinden bir kısmının manası açıktır(muhkemdir). Diğer kısmı ise yoruma açıktır(müteşabihtir). Allah (c.c) bu ayrımı, Al-i İmran suresi 7. ayette yapmıştır. Kur'an-ı Kerim'e müteşabih ayetleri içinde bulundurması nedeniyle itiraz etmek mümkün değildir. Müteşabih, anlamı ve delaletleri gizli olan ayetlerin muhkem olan kısımlarına başvurduğunda açıklığa kavuşur ve anlamı belirginlik kazanır. Böylece müteşabih olan bir ayet, muhkem olan bir diğer ayetin aracılığıyla muhkemleşir. Bu konuda ortaya çıkan tartışmalar, alimlerin ayetleri farklı biçimde yorumlama biçimlerinden ve ayetin anlamındaki kapalılığın nedenini kullanılan dilin özelliklerinin iyi bilinmemesinden kaynaklandığına bağlanmıştır. Bu çalışmada Sünni ve Şii mezheplerinde ortaya çıkan yenilikçi düşünceler muhkem ve müteşabih olan yaklaşımlarını mukayeseli olarak ele alınmıştır. Sünni ve Şii tefsir kategorilerine dahil olan Reşid Rıza ve Tabatabai'nin tefsirleri, muhkem ve müteşabih ile ilişkilendirdikleri ayetleri yorumlama şekilleri yönünden de ele alınmıştır. Çeşitli İslami mezheplere mensubu olan Müslüman halkların birbirlerine inanç ve düşüncelerini, temel kaynaklar aracılığıyla tanımalarını sağlamayı ve böylece birbirlerini daha iyi tanıyarak İslami vahdet ve kardeşliğin pekişmesi yönünde Ehl-i sünnet ile Şia'yı yaklaştırmak gibi çok önemli bir amacı gerçekleştirmektedir."
