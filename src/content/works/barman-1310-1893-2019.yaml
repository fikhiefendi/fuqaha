abstract: "Çalışmamızın konusunu 1310 h./ 1893 m. Tarihli Erzurum Fetva Defteri adlı el yazması teşkil etmektedir. Günümüz insanının önemli bir kısmının Osmanlıcayı bilmemesi, yeni nesilleri söz konusu mecmuaları araştırma ve öğrenme alanından uzak kılmaktadır. Bu konunun belirlenmesinin hedef ve amaçlarından biri mirasımıza sahip çıkmak ve bunu yeni nesillere tanıtma yolunda küçük de olsa bir katkıda bulunmaktır. Bundan dolayı mecmuanın muhtevasına konu olan meselelerin neler olduğunu, sorulan sorulara hangi kıstaslara ve usullere göre çözüm bulunduğunu, fetva merkezinin bölgesel olarak etki alanını ortaya çıkarmak hedeflenmiştir. Üzerinde çalıştığımız fetva mecmuasında Erzurum yöresinde yaşayan insanların karşılaştıkları özel durumlara ait fetvalar ortaya çıkarılmıştır. Bununla yöre özelinde hangi durumlardan dolayı fetva merciine müracaat edildiği, ayrıca müftülerin hangi ölçülere gere nasıl fetva verdikleri okuyucuya sunulmuştur. Toplumun her kesiminden geldiği görülen ve daha çok akitler, nikâh ve boşanma konularıyla ilgili sorulara Hanefi mezhebinin içtihadları çerçevesinde cevap verilmiştir."
