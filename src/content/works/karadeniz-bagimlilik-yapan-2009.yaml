abstract: "Bu çalışmada, insanın sahip olduğu en önemli varlık olan aklı geçici de olsa devre dışı bırakan, tekrar kullanımıyla da kişiyi bağımlı hale getiren maddeler hakkındaki hükümler, bu hükümlerin ihlali sonucunda doğan suçlar ve bu suçların etkileri İslam hukuk doktrini açısından ele alınıp incelenmiştir.Ayrıca sarhoşluk ve bağımlılık kavramları, İslam hukukunda bu kavramlara karşılık gelebilecek terimler, bağımlılık yapan madde türleri genel ve hukuki açıdan tarihi süreçleri göz önüne alınarak açıklanmış ve bu maddelerin kullanıma sunulabilmesi için, imallerinden alım-satımına kadarki süreçte suç kabul edilen durumlar hakkında yapılan hukuki düzenlemeler ile bu düzenlemelerle korunan hukuki menfaatler modern ve İslam hukuku açısından incelenmiştir.Yapılan araştırmalar sonucunda, çağımızın en önemli sorunlarının başında gelen bağımlılık yapan maddelerden kaynaklanan sarhoşluk etkisiyle veya bağımlı olunan maddenin temini için kişilerin suç işledikleri, suçlularla bağlantı kurdukları hatta çıkar amaçlı suç örgütleri kurdukları ortaya konmuştur. Ayrıca madde bağımlılığının bireysel, ailevi, ekonomik ve toplumsal açıdan son derece önem taşıyan zararlı etkilerine yer verilmiştir."
