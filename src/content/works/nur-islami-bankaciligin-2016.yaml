abstract: "Bankalar hiç şüphesiz ülkelerin ekonomisinde hayati bir rol oynar. Ekonominin istikrarı temelde bir ülke içinde bankaların iyi performansına dayanır. Çalışma 2000-2015 yılları arasında, iki farklı ülkede (Malezya ve Türkiye) bulunan İslami bankaların finansal performansını değerlendirmeyi hedeflemektedir. Ayrıca bu iki ülkede bulunan 12 İslami bankadan elde edilen veriler kullanılarak banka karlılığı ile bankaya özgü ve makroekonomik özellikleri arasındaki ilişkiyi de araştırır. Çalışmada yapılan betimsel istatistiklere göre, Türk İslami bankalar Özsermaye Karlılığı ve Yönetim Kalitesi alanında daha iyi performans gösterirken, Malezya'daki İslami bankalar Aktif Kârlılık, Sermaye Yeterliliği ve Kazanç Kalitesi açısından daha iyi performans göstermektedir. Bu tez Sermaye Yeterliliği, Yönetim Kalitesi, Kazanç Kalitesi, Likidite, Banka büyüklüğü, Gayri safi yurtiçi hasıla ve Enflasyon Oranının temel Kârlılık Göstergeleri (Aktif Kârlılık ve Özsermaye Karlılığı) üzerindeki etkilerini ayrı ayrı araştırırken Eviewes programı versiyon 8.1 POLS (Pooled Ordinary Least Square) uygulanmıştır. Korelasyon ve regresyon analizleri da yapılmıştır. Ampirik sonuçlar ayrıca bu bağımsız değişkenlerin çoğunu kârlılık (bağımlı) değişkenlerinin üzerinde güçlü bir etkisi olduğunu göstermiştir."
