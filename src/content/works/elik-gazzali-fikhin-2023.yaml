abstract: "İslam ilim tarihinin önemli şahsiyetlerinden Ebu Hamid Muhammed b. Muhammed el-Gazzâlî (ö. 505/1111) fıkıh, kelam, felsefe, tasavvuf, mantık gibi birçok alanda önemli eserler vermiş çok yönlü bir alimdir. Gazzâlî'nin mutasavvıf yönü yaygın olarak bilinse de fakih yönü genel olarak diğer yönlerinin gölgesinde kalmıştır. Bu çalışma; Gazzâlî'nin hayatı, eserleri, epistemolojisinden hareketle onun fıkıh ilmindeki önemini vurgulamayı ve fıkıh ile tasavvufu birleştiren kişi olarak takdim edilen Gazzâlî'nin mutasavvıf-fakih kimliğini öne çıkarmayı amaç edinmektedir. Bu tezin konusu“Gazzâlî'de fıkhın tasavvufî boyutu”ile sınırlandırılmış olup onun kelâm, felsefe ve bâtınî düşünceyle ilişkisi epistemik anlayışını ortaya koymak üzere ele alınmış, böylece onun tüm yönleriyle bütüncül olarak anlaşılmasına katkı sunulmaya çalışılmıştır. Bu çalışmada sonuç olarak; birçok ilim dalında yetkin bir isim olan Gazzâlî'nin Şafiî fıkhında ihmal edilemeyecek derecede önemli bir konumda bulunduğu; hayatındaki iki önemli kırılma noktası sonrasında bilgi tasavvurunda önemli değişimler yaşadığı; aklî istidlal ve felsefî düşünce noktasında kendisine yönelik eleştirilerin hakkaniyetten uzak ve onu bütüncül bir nazarla ele almamanın bir neticesi olduğu; Gazzâlî'de tasavvufî bilginin aklın idrak alanı dışında kalan, sayesinde diğer bilgilerin kesinliğinden emin olunan, sübjektif bir üst bilgi türü olarak yer aldığı; nihai olarak onun tasavvufta karar kılıp fıkhî konuları tasavvufî bakış açısıyla ele aldığı; fıkhın zahirinden taviz vermeden bâtınî/tasavvufî yönünü öncelediği tespit edilmiştir."
