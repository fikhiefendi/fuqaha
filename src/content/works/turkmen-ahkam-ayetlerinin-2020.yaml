abstract: "Ahkâm Âyetlerinin Hukuk Analizi İbn Kesîr Örneği; başlıklı tez çalışmamızda, İslam coğrafyasında şöhret bulmuş olan; muhaddis, fakih, müfessir İbn Kesîr'in (ö. m.1301/h.701) kaleme aldığı Tefsîrü'l-Ḳurʾâni'l-ʿaẓîm adlı eserindeki hukuka tealluk eden âyetlerin tefsîrinde, İbn Kesîr'in analizleri ile yaptığı izahatların bir araya getirilmesi amaçlanmıştır. Müfessirin eseri, rivayet tefsîri olup Kur'an-ı Kerim'in tamamı üzerine yazılmıştır. Tez çalışmasının kapsamına ise sadece ahkâm âyetleri dahil edilmiştir. Âyeti kerimelerin tefsîrinde müfessirin aktarmış olduğu hadis rivayetlerinin farklı senetlerle tekrar edilmesinden ötürü konunun anlaşılmasına katkı sağlayacak kadar rivâyet aktarılmış, sahabe ve tabiin kavillerine müracaat edilmiş, ayrıca müfessirin yaşadığı devre kadar yazılan tefsîr eserlerinden naklettiği yorumlarda, kısaltılarak tez çalışmasında yer almıştır. İbn Kesir'in tefsîrinde belli bir usul takip etmediği ve hükümleri nakledip içtihada da pek girmediği gözlemlenmiştir. Âyetin âyet ile ve âyetin hadis ile neshini kabul ettiği görülmüştür. Zikrettiği delillerde âyet ve hadisler için nas tabirini kullandığı ayrıca mezhebi olan Şafiîliğin kullandığı dile etkisi olduğu da görülmüştür. Ehli sünnet mezhepleri arasındaki ihtilaf edilen konular ve mezheplerin kullandıkları delilleri tefsîrine eklemiştir. Çalışamada ihtilafa konu olan mezhep görüşleri kısmen aktarılmış olup ibadet konuları ise dahil edilmemiştir. Anahtar Kelimeler İbn Kesir, Rivâyet Tefsîri, Ahkâm, Hukuk, Kişi, Kamu, Had, Kısas, Mezhep"
