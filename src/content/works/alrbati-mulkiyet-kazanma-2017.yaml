abstract: "Mülkiyet kazanma yollarından Şüf'a (Libya Kanunlarıyla Mukayeseli Olarak) Şüf'a hakkı islam hukukunun tanıdığı bir haktır. ortaklık ve komşuluk ilişkisi olan kişilerden birinin gayr-ı menkulünü satması durumunda ortaya çıkar. Bu durumda ortak veya komşu satım bedelini ödeyerek ilgili akara mâlik olur. Bu çalışma Şüf'a hakkını (ön alım hakkını) islam hukuku esas olmak üzere konuyla ilgili mezheplerin görüşleri dikkate alınarak Libya hukukuyla mukayeseli olarak ele almaktadır. Tezimiz bir giriş ve dört bölümden oluşmaktadır. Giriş Bölümü: Mülkiyeti elde etme yolları İslam hukuku ve Libya Medenî kanununa göre ele alınacak bunlar içerisinde şüf'a hakkının yeri belirlenmiştir. Birinci Bölüm: Şüf'anın sözlük ve terim anlamı verilip hukukî yönü ortaya konulmuştur. İkinci Bölüm: Şüf'anın rükunları belirtildi ve her bir rükunda bulunması gereken şartlar, sebepler belirtildi ve akar ve gayr-i menkuller üzerinde şüf'anın gerçekleşip gerçekleşmeyeceği delilleriyle ortaya konuldu. Üçüncü Bölüm: Şüf'a hakkının gerçekleşebilmesi için gerekli şartlar belirtildi ve şüf'ayı ortaya çıkaran şartlar ile şüf'a hakkına sahip kişinin izleyeceği prosedür anlatıldı. Dördüncü Bölüm: Libya kanunlarına göre şüf'anın gerçekleşmesi, yargı yoluyla şüf'a hakkının gerçekleşmesi, şüf'a hakkıyla temellükün nasıl gerçekleştiği ve şüf'a hakkının düşüren sebepler ile bu hakkı düşürmek için hile-i şer'iye yapılması meseleleri ele alındı."
