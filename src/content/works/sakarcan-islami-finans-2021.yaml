abstract: "“İslami Finans Yöntemlerinden Biri Olan Emek- Sermaye Ortaklığının Günümüzdeki Yeri: Bir Saha Çalışması”başlıklı tezin amacı, Türkiye'deki emek sermaye ortaklığının neden fazla tercih edilmediğini ve tercih edildiğinde ne tür risklerin ve zorlukların oluşabileceğini incelemektir. Bu bağlamda yapılan analizlerden ilki, katılım bankası çalışanları perspektifinden mudarebe finansmanın yaygın olarak kullanılamama sebeplerinin incelenmesidir. Çalışmanın odaklandığı diğer bir analiz ise, mudarebe benzeri girişim sermayesi fonunun sağlanması durumunda ne tür zorlukların oluştuğunun bu fonu kullanan girişimciler perspektifinden incelenmesidir. Çalışmada, Nitel Araştırma modeli kullanılmıştır. Çalışmanın evrenini, altı katılım bankası (Kuveyt Türk, Albaraka Türk, Vakıf Katılım, Türkiye Finans Katılım Bankası, Ziraat Katılım ve Emlak Katılım) ile birlikte, Katılım Portföy Yönetim Şirketleri ve katılım bankaları girişimcilik merkezlerini kapsamaktadır. Katılım bankası çalışanları gözünden mudarebe ortaklığının neden sık uygulanamadığının nedenleri yarı biçimlendirilmiş mülakat sorularından elde edilen veriler ile değerlendirilmiştir. Katılım bankaları aracılığı ile uygulanan girişim sermayesi fonunun uygulanması halinde oluşabilecek engeller ve zorluklar ise bu fonu kullanmayı talep etmiş girişimciler ile yapılan yarı biçimlendirilmiş mülakatlar ile incelenmiştir. Sonuç bölümünde yapılan analizden elde edilen verilerin bir değerlendirilmesi yapılmıştır. Elde edilen bulgulara göre mudarebe ve girişim sermayesi finansmanının uygulanmasını engelleyen başlıca sebepler tek tek incelenmiş ve potansiyel çözümler sonuç bölümünde sunulmuştur. Bu minvalde değerlendirildiğinde yine sonuç bölümünde bu iki finansman türü için kullanılan fonların ortak bir havuzda değerlendirilmesine ilişkin bir çözüm önerisinde bulunulmuştur."
