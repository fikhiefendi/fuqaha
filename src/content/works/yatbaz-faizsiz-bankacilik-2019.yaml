abstract: "Bu çalışmada Türkiye'deki İslami bankacılık alanında faaliyet göstermekte olan katılım bankalarına yönelik İslami ilkelerle uyumlu muhasebe standartları ve Türkiye'de uygulanabilirliği ortaya konmaya çalışılmıştır. Bu kapsamda öncelikle İslami Finansal Kuruluşlar Muhasebe ve Denetim Organizasyonu Kurumu (AAOIFI) muhasebe standartları, Uluslararası Muhasebe Standartları Kurumu'nun (IASB) ilgili muhasebe standartları ve bazı ülkelerin yerel İslami muhasebe standartlarından yola çıkarak İslami finansal ürünlerin muhasebe ve raporlama karşısındaki durumu karşılaştırmalı olarak incelenmiştir. Ardından İslami ilkelerle uyumlu muhasebe standartlarının Türkiye'de uygulanabilirliğine yönelik yapılan anketin sonuçlarına yer verilmiştir. İslami ilkelerle uyumlu muhasebe standartlarının Türkiye'de uygulanabilirliğini ortaya koymak amacıyla yürütülen anket çalışması kapsamında Türkiye'de faaliyet gösteren beş adet katılım bankasının muhasebe ve finansal raporlama birimlerinde çalışmakta olan kişilere ulaşılmıştır. Ankete katılan kişilerin yaklaşık olarak %58'inin AAOIFI muhasebe standartları ve dolayısıyla İslami muhasebe standartlarından haberdar olmadıkları tespit edilmiştir. İslami muhasebe standartlarının Türkiye'de uygulanmak istenmesi durumunda, katılımcılar tarafından faizsiz bankacılık ve finans kesiminde yeterli talebin oluşmaması en zorlaştırıcı etken, katılım bankalarının ve diğer faizsiz finans kuruluşlarının sayısının giderek artması ise en kolaylaştırıcı etken olarak görülmüştür. Uygulanması durumunda ise katılımcılar tarafından faiz hassasiyeti olan uluslararası yatırımcıların güveninde artış yaşanacak olması sağlanacak en önemli yarar olarak görülürken, kullanıcıların finansal bilgileri yorumlamalarında değişiklik yaşanacak olması ise en önemli problem olarak görülmüştür."
