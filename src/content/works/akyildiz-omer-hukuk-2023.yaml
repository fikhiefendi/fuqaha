abstract: "Bu çalışma Hz. Ömer'in hayatını, liderliğini ve kendi döneminde ortaya çıkan birtakım problemlere karşı çözüm önerilerini ve olaylara bakış açısını inceleyerek onun hukuk anlayışını ortaya koymaya çalışmaktadır. Hz. Ömer'in gerek Hz. Peygamber'in (a.s) döneminde gerek ilk halife Hz. Ebubekir'in (r.a) halifeliği döneminde gerekse kendi halifeliği döneminde karşılaştığı birtakım sosyal olaylara karşı uyguladığı içtihatlar, kendi döneminde karşılaşılan problemlerin çözümünde çok etkili ve isabetli olduğu anlaşılmaktadır. Biz ise ortaya koyduğumuz çalışmamızda Hz. Ömer'in yapmış olduğu içtihatları tespit ederek ve bu içtihatların öneminin vurgulanması adına farklı bir bakış açısı benimseyerek günümüz problemleri adına bir bakış felsefesi ortaya koymaya çalıştık. Ayrıca Hz. Ömer'in; özellikle lider olarak kamu ve özel hukuk alanında yapmış olduğu içtihatlar, onu sadece tarihi bir figüran olmaktan öteye götürerek İslâm'ın hukuki mirasının temellerinin atılmasına büyük katkı sağlamıştır. Yapmış olduğumuz çalışma, dört bölümden meydana gelmektedir. Birinci bölüm Hz. Ömer'in kişisel bilgilerini içermektedir. İkinci bölüm Hz. Ömer'in hukuku işletirken temel aldığı hususları barındırmaktadır. Üçüncü bölüm Hz. Ömer'in içtihadi temellerini kapsamaktadır. Dördüncü bölüm ise Hz. Ömer'in kamu ve özel hukuk dallarında yaptığı içtihatları içermektedir. Sonuç kısmında ise elde edilen neticeler ortaya konulmuş ve İslâm Hukukunda içtihadın mahiyetinin daha iyi kavranması ve aynı zamanda İslâm Hukukunun yürürlüğünün sağlanması adına, bu konunun önemi daha fazla vurgulanarak daha çok çalışma yapılması gerektiğinin altı çizilmiştir."
