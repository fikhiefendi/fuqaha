abstract: "Terim olarak klasik murabaha; satıcının, satın almış olduğu malı, maliyetini ve üzerine eklediği karı müşteriye bildirerek satmasıyla gerçekleşir. Çağdaş murabaha ise; müşterinin talebi üzerine bir malın faizsiz bir banka tarafından satın alınıp söz konusu müşteriye alınan malın maliyeti hakkında bilgi verilerek ve eklenecek olan kar oranında anlaşarak vadeli bir şekilde satılmasıdır. Murabaha akdinin şartları ise; alış fiyatının bilinmesi, murabıhın malı mülk edinip teslim alması, satın alınan mal ve ödenen bedelin faiz cereyan eden mallardan olmaması, ilk akdin sahih olması, semenin misliyattan olması şeklinde sıralanabilir. Para vakfı; kuruluş sermayesinin bir kısmı ya da tamamı nakit paradan oluşan vakıftır. Tarihsel sürece bakıldığında, İslam toplumlarında girişimcilerin finansman sorunlarının çözülmesinde para vakıfları büyük rol oynadığı görülmektedir. Para vakıfları, toplumdaki girişimcilerin fon sorunlarının yanında devlet ve bazı kamu kuruluşlarının finansman ihtiyacının karşılanmasında önemli bir yer tutmuştur. Murabahanın günümüz katılım bankalarında çok tercih edilmesinin sebebi ise uygulanış şeklinin diğer akitlere nazaran kolay olması ve geniş bir alanda uygulanabilir olmasıdır."
