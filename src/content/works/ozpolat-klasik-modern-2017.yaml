abstract: "Bu çalışmanın temel konusunu mütekavvim mal kavramı oluşturmaktadır. Çalışmanın amacı, klasik fıkıhta,“şeriatın kendisinden yararlanmayı mübah kıldığı mal”anlamında kullanılan bu kavramın modern hukuktaki karşılığının tespit edilip her iki doktrin arasında karşılaştırmalarda bulunmak suretiyle çeşitli sonuç verilere ulaşılmasıdır. Söz konusu karşılaştırma yapılırken mezkur bileşik terkibin bütünü göz önünde bulundurulduğu gibi“mal”ve“mütekavvim”şeklinde ifade edilebilecek olan parçaları da ayrı bir okumaya tabi tutulmuştur. Ayrıca klasik dönemde karşılığı olmayan fakat modern dönemde ortaya çıkmış bazı yeni meselelerin mezkur kavram bağlamında hükümleri de tespit edilmeye çalışılmıştır. Çalışma, bilinçli olarak Hanefi mezhebi üzerine kurulmuştur. Tarih boyunca fıkhi problemlere çözüm önerileri getiren dört mezhepten her birinin özel bir yöntem takip ettiği bilinmektedir. Bu bağlamda problem teşkil eden meselenin çözümü noktasında her bir mezhebin fıkıh metodolojisinin ayrı olarak mütalaa edilmesi daha köklü bir yöntem olduğu gibi daha sağlıklı sonuçların da çıkmasına sebep olacaktır. Çalışmanın birinci bölümünde mütekavvim mal kavramın klasik fıkıhtaki yeri tespit edilmeye çalışılmış, ikinci bölümünde ise modern hukukta direk olarak kullanımı olmayan bu kavramın klasik fıkıhtaki anlam perspektifinden modern hukuktaki karşılığına ulaşılmaya çalışılmıştır. Çalışmanın üçüncü bölümü sonuç mesabesindedir. Bu bölümde önceki iki bölümde geçen bazı kavram ve meselelerin karşılaştırması yapılıp modern dönemde ortaya çıkmış güncel bazı konuların mezkur kavram bağlamında klasik fıkıhtaki hükmü ortaya konmaya çalışılmıştır."
