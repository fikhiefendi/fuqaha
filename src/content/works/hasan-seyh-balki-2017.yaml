abstract: "Kuşkusuz Tasavvuf ta diğer farklı fikirler gibi belli bir dönemde belli bazı sebeplerden dolayı sonradan İslam'a girmiştir. Hz. Peygamber döneminde de tasavvuf vardı şeklindeki görüşlere gelince her toplum ve mezhep kendi fikir ve görüşlerini desteklemek, bu konuda güven kazanmak için böyle bir iddiayı ileri sürmektedirler. Fakat doğru olan görüş, günümüz formatındaki tasavvufun dördüncü asırda ortaya çıktığıdır. Geçirdiği dönemlerin şartlarına bağlı olarak tasavvufta birçok değişimler ortaya çıkmış ve bu değişimler tasavvuf ehli arasında tartışma konusu olmuştur. Hz. Peygamber'in dönemindeki ise takva, zühd, kanaat ve nefis tezkiyesinden ibaretti. Çalışmamızda daha çok üç konu üzerinde yoğunlaştık. Bunlardan iki tanesi ilmi seviyesini ortaya koymak ve telif ettiği eserinde hedeflediği gayede ne kadar başarılı olduğu gibi yazarla ilgili hususlardır. Diğeri ise tarikatın hakikati ve onun şeriatla olan ilişkisi hakkında doğru olduğunu düşündüğümüz görüşlerimizi ortaya koymaktır. Birinci husus çalışmamıza konu olan eseri incelerken, yazarının genel olarak bütün ilimler özel olarak da kar 'an-ı Kerim'den sonra İslam dininin ikinci temel kaynağı olan hadis-i şerifler konusunda yeterli seviyede olmadığını gördüm. Bu durum onun hadislerden şahid getirdiği yerlerde sahih ile zayıf, senedi Hz. Peygambere dayanan ile büyük âlimlerin sözleri arasında bir ayrıma gitmediği bariz bir şekilde görünmektedir. Söz konusu eseri inceleyen birisi yazarın bu konuda karıştırdığını görecektir. Eseri tahkikini yapan kişinin de belirttiği üzere özellikle 21-22 sayfalarında bazı mevzu hadislere yer verir, sayfa 43te ise sırrî es-Sakatî sözü olan“bir saat tefekkür altmış yıl ibadet etmekten daha hayırlıdır”sözünü Hz. Peygambere nispet etmiştir. Buna benzer örnekleri çoğaltabiliriz. Muhakkik haşiyesinde bu konu üzerinde değerlendirmelerde bulunmaktadır. Biz de detaylı bir şekilde bu konu üzerinde durmaya çalıştık. Yine tefsir ilmindeki seviyesi de bu şekildir. Çünkü o her hangi bir ayetin tefsirini yaparken bu alanda muteber kabul edilen tefsir kaynaklarının hiç birinden nakilde bulunmamaktadır. Aynı şekilde bazı ilim ehlinden bilgi aktarırken bilginin kaynağına yer vermemesi dikkat çeken diğer bir husustur. Oysaki bu durum araştırmacıların işini zorlaştırmaktadır. Ayrıca onun ayetleri tefsir edişine bakıldığında yaşadığı çevrenin büyük tesirini görebiliriz. 075 İkinci husus ise müellifin tarikatın şeriatla arsını bulmaya çalıştığı konuyla ilgilidir. Onun bu konudaki çabalarının yanlış olduğunu söyleyebiliriz. Bu durumun nedeni yukarıda da belirttiğimiz gibi müellifin ilmi seviyesiyle ilgilidir. Çünkü o yirminin üzerinde konuyu tartıştığı 108 sayfalık eserinin tamamında çok az miktarda ayet ve hadislere yer verdiğini görürüz. Kanıt olarak getirdiği delillere bakıldığında söz konusu delillerin yeterli olmadığı da ortadadır. Bırakın müellifin tarikatın şeriatla arsını bulmasındaki yeterliliğini tarikatın kendisini ispat etmemiştir. Aynı şekilde müellifin kitabı dikkatlice incelendiğinde onun birçok çelişkilere düştüğü görülecektir. Bundan dolayı okuyucu onun kitabında şeriattan farklı olarak, Müslüman bireylerin ıslahını gerçekleştiren bir tarikat kurumunun olduğunu fark etmez. Çünkü müellifin tarikatla ilgili verdiği bilgiler delille ispatlanmamış, olağan üstü kişileri yetiştiren bazı dini ayinlerden öteye geçmez. Ki bu ayinlerin hiç biri ne Hz. Peygamber, onun sabilerinin hayatlarında ve ne de naslarda bulunmamaktadır. Zira tamamı aklın reddettiği şeylerdir. Araştırmamızda üzerinde durduğumuz hususlardan üçüncüsü tarikatın gerçeğini ortaya koymak ve onun şeriatın aynısı olup olmadığını incelemeye yönelik çabamızdır. Sonuçta müellifin bahsettiği şekilde bir tarikatın olmadığını ve eğer şeriatla aynı olsaydı tarikat terimine gerek olmayacağını düşünüyoruz. Çünkü onun zikrettiği şekildeki bir tarikat Hz. Peygamber ve sahabenin amacı olmamıştır."
