abstract: "Osmanlı Devleti'nin altın çağını yaşadığı dönem olan XVI. yüzyılda, birçok ilim ve fikir insanı yetişmiştir. Çok fazla tanınmamakla birlikte bunlardan biri de Zileli Muharrem Efendi'dir. Muharrem Efendi, dilbilimciliği ve mutasavvıf kimliğinin yanı sıra; eserlerinden anlaşıldığı üzere fıkıh ilmi bakımında da ön plana çıkmaktadır. Özellikle fıkıh ilmi açısından ele alınan eserleri, Muharrem Efendi'nin fıkıh ilmine olan vukufiyetini bizlere göstermektedir. Bu çalışmada; Muharrem Efendi'nin fıkıh ilmiyle ilgili yazdığı eserler tespit edilip içerikleri incelenmiş ve bu eserlerde işaret ettiği usûl ve fürû kaideleri ile vermiş olduğu fetvalardan yola çıkılarak onun 'Fıkhî görüşleri' ortaya konulmaya çalışılmıştır. Çalışma, giriş ve iki bölümden oluşmaktadır. Giriş bölümünde, Muharrem Efendi ile ilgili genel bilgiler verilerek hakkında yapılan çalışmalar tespit edilmiş ve bu çalışmanın, amacı ve önemi gibi unsurları açıklanmıştır. Birinci bölümde, Muharrem Efendi'nin yaşadığı dönem hakkında bilgiler ile bu dönemde yetişmiş bazı ilim adamlarına işaret edilmiş akabinde ise müellifin hayatı ve“Sivâsîler”olarak bilinen ailesi tanıtılmıştır. Bu ailenin, Kadızâdeliler ile meşhur tartışmasına da yer verilerek tartışmanın genel maddeleri ortaya konulmaya çalışılmıştır. Bu bölümde Muharrem Efendi'nin eserlerinden fıkıh ilmiyle ilgili olanları tespit edilmiş ve bu eserlerin katalog bilgilerine de yer verilmiştir. İkinci bölümde ise belirlenen bu eserler incelenmiş ve eserlerde işaret edilen kaideler ve fıkhî görüşler tespit edilerek maddeler halinde sunulmuştur. Çalışmada, Muharrem Efendi'nin fıkıhla ilgili“Cübbü'l-mesâil, Umdetü'n-Nisâ, Risâle Müteallika bi-Delili Hurmeti'r-Rada', Zelletü'l-ḳārî bi-ʿİnâyeti'r-Rabbi'l-Bârî, Hediyyetü'ṣ-ṣuʿlûk fî şerḥi Tuḥfeti'l-mülûk, Risâle-i Şükriyye ve Tenbîhü'l-gāfilât”adlı eserleri nitel araştırma ve içerik analizi yöntemiyle incelenmiştir. Çalışma yapılırken öncelikle Muharrem Efendi ile ilgili yapılan tüm çalışmalar taranmış ve tetkik edilmiştir. Daha sonra yazmış olduğu tüm eserlerine yazma eser katalogları taranarak ulaşılmış, akabinde ise eserlerinin fıkıh ile ilgili olanları tespit edilerek Yazma Eserler Kurumu Başkanlığından temin edilmiş ve detaylı olarak incelenmiştir. İzlenen bu yöntemle Muharrem Efendi ile ilgili literatüre hakim olunması amaçlanmıştır. İncelemeye konu olan fıkıh eserlerinde yer alan fıkhî kaideler ve görüşler tespit edilmiştir. Tespit edilen bu kaidelerin, fıkıh usûlü alanına ait olanlarının yanı sıra; ibâdât, muâmelât, ukûbât ve ahkâmü's-sultâniyye gibi fıkhın farklı alanlarına ilişkin fürû kaideleri de kapsadığı görülmüştür. Bu kaidelerin özellikle ibâdât, muâmelat ve ukûbât alanına yoğunlaştığı da söylenebilir. İncelenen eserlerde; toplamda 93 adet kaide ve fıkhî görüşlere ulaşılmıştır. Tespit edilen bu kaide ve görüşler ilgili bölümlerde sistematik olarak sunulmuştur. Muharrem Efendi'nin eserlerinde sıkı bir Hanefi mezhebi müntesibi olduğu görülmüş ancak hanefi mezhebinde genel kabul gören bazı konularda farklı yorum ve tercihlerde bulunduğu da tespit edilmiştir. Literatürde Muharrem Efendi'nin fıkıh ilmiyle ilgili eserlerini ele alan bazı çalışmalar bulunmaktadır. Ancak bu çalışmada, Muharrem Efendi'nin fıkıh ilmi alanında yazdığı bütün eserlerinin incelenmesi, Arapça ve Osmanlıca türkçesi halinde bulunan bu eserlerin genel bir muhtevâsının verilmiş olması, Muharrem Efendi ile ilgili yapılacak olan çalışmalara katkı sağlayacaktır. Bu çalışmada ayrıca, fıkıh kaideleri ve fıkhî görüşleri tespit edilmeye çalışılmıştır."
