abstract: "Bu çalışmada es-Süyûtî (ö. 911/1505)'nin el-İktirâh fî usûli'n-nahv adlı eseri özelinde, Arap dil bilgisinin metodolojisini oluşturan nahiv usûlü ile fıkıh usûlü kavramsal düzeyde karşılaştırılmaktadır. Dil kurallarını şekillendiren usûl mantığının fıkıh usûlü sistematiğiyle benzeştiği ve ayrıştığı noktaları tespit etmek, araştırmanın temel problemini oluşturmaktadır. Giriş ve üç bölümden oluşan tezin giriş kısmında araştırmanın amacı, önemi, yöntemi ve kapsamı gibi metodolojik çerçeve ele alınmıştır. Birinci bölümde es-Süyûtî'nin hayatı ve ilmî kişiliği, ikinci bölümde nahiv usûlü ilminin tarihsel gelişimi incelenmiştir. Tezin ana gövdesini teşkil eden üçüncü bölümde ise iki alanın ortak bilgi kaynakları olan semâ', icmâ, kıyas ve istishâb delilleri, teâruz durumunda izlenen yöntemler mukayese edilmiş ve müçtehitlik şartları da ele alınmıştır. Araştırma sonucunda es-Süyûtî'nin fıkıh usûlünün sistemli yapısını dil bilimine başarıyla uyguladığı, bunu yaparken de Arapçanın lehçe zenginliğini koruduğu görülmüştür. Sonuçta nahiv usûlünün fıkıh kurallarını dile doğrudan dayatmak yerine dilin kendi ses uyumuna, estetiğine ve tarihsel işleyişine uygun, dil sistemini bozulmalardan korumayı amaçlayan özgün ve esnek bir denetim mekanizması geliştirdiği tespit edilmiştir."
