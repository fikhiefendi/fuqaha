abstract: "Bu çalışma kapsamında 77 görüntü 75 varak ve 150 sayfadan oluşan Konya Şer'iyye Sicil Defteri'nin transkripsiyonu ve değerlendirilmesi yapılmıştır. Bu kapsamda önce belgeler günümüz Latin harfleri Türkçesine çevrilmiş ve sunulmuştur. Varak numarasına ve hüküm sayılarına göre belgelerin özeti de 3. Bölümde verilmiştir. Belgelerde geçen önemli olaylar, siyasi ve dini kişilikler, müslüman ve gayrimüslim figürler, eğitim, ticaret, sosyo-kültürel yapıya ait kayda değer tüm özel ad ve değerler birinci bölümde ele alınmıştır. Dönemin en önemli olayı Sultan I. Abdülhamit'in vefatına kadar sürecek Özü Kalesi muhasarası ve harp ile ilgili padişah fermanlarıdır. Tüm Osmanlı coğrafyasını etkileyen bu olaylar Konya yöresinde de yankı bulmuş ve sicildefterinde yer bulmuştur. Ayrıca Şer'iyye kayıtlarının yöresel hukuki olaylara yer vermesi sebebiyle dönemin yaşam tarzına, bölgenin ticari ve ekonomik durumuna ait verileri de içermektedir. Mutfak eşyaları, tarım ürünleri, ticari mallar ve narhlara ait değerler de sunulmuştur. Sonuç olarak bu defterin transkripsiyonu ile doğrudan belgeler tarihçiler ile diğer bilim insanlarının kullanımına sunulmuştur."
