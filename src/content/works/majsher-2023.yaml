abstract: "Bu çalışma, katılım bankaları tarafından sunulan kredi kartlarının Türk ekonomisi üzerindeki etkisini ortaya koymayı amaçlamaktadır. Açıklayıcı-analitik yöntem kullanılmış ve Türkiye'de ikamet eden Türk ve yabancı toplum üyelerinden oluşan bir örneklem üzerinde“Anket”aracıyla ilk veriler toplanmıştır. Çalışma örnekleminde Türkiye'deki katılım bankalarının müşterilerinden (289) kişi yer almış olup, çalışmanın sonuçları kredi kartlarının müşterileri tüketimde genişletmeye ve teşvik etmeye yönlendirmede rol oynadığını ortaya koymuştur. Bu da Türk ekonomisinde enflasyonist etkilere ve kısmen esnek ve genişlemeye açık bir ekonomide gelişme etkilerine yol açmaktadır. Ancak ithal enerji fiyatlarının yükselmesi nedeniyle enflasyonist etkilerin gelişme etkilerini aştığı görülmüştür. İlk verilerin analizinden sonra, müşterilerin tüketim harcamalarındaki genişleme etkisi, katılım bankaları müşterilerinin kredi kartlarının anket alanları üzerindeki etkinliği konusundaki görüşlerinden belirlenmiştir. Bu kapsamda, katılım bankalarında çalışanlarının ortalama yanıtı 4.46 olmuştur; yani oldukça büyük bir onaylama. Bu, kredi kartlarının müşteri çekme ve tüketim taleplerini teşvik etme konusundaki rol ve önemini ortaya koymaktadır."
