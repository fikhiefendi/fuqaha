abstract: "İslam Hukukunda mezheplerin teşekkülü sonrasında mezhebe ait usûl ve fürû'un kaleme alındığı pek çok eser te'lif edilmiştir. Bu sürecin devamında yeni bir yazım şekli olarak Tahrîcü'l fürû' ale'l usûl edebiyatı karşımıza çıkmaktadır. Bu yazım türünde usûl ve fürû' kavramlarının içeriği, aralarındaki ilişki, usûl olarak kabul edilen ilkelerin kaynağı ve fer'î meselelere etkisi, hilaf konularının esası ve meselelere yansımaları incelenmektedir. Tilimsânî (ö. 771/1370) Mağrib bölgesinde yaşamış önemli bir Mâlikî âlimidir. Onun Miftâhu'l-vusûl ilâ binâi'l-fürû' 'ale'l-usûl adlı eseri Tahrîcü'l fürû' 'ale'l usûl tarzında yazılmış orijinal bir eserdir. Diğer eserlerden farklı olarak hilafa sebep olan meseleleri usûl konularına göre tasnif edip incelemiştir. Çalışma giriş ve dört bölümden oluşmaktadır. Birinci bölümde Tahrîcü'l fürû' 'ale'l usûl edebiyatının daha iyi kavranması düşüncesiyle bu edebiyata ait kavramların sözlük ve ıstilahi manalarına ve fıkıh ilminde kullanılma amaçlarına değinilmiştir. Ek olarak bu bölümde farklı mezheplerin tasnifi esas alınarak yazılan eserlerin tanıtımına ve literatür değerlendirilmesine geniş yer verilmiştir. İkinci bölümde Mâlikî mezhebinin tarihi gelişim süreci ve müellifimizin biyografisi, eserleri, hocaları, talebeleri ve müellifin yaşadığı dönemde vuku bulan olayların tarihsel arka planları incelenmiştir. Ayrıca bu dönemle ilgili olarak Mağrib bölgesinde kurulan devletlere ve ilmi faaliyetlere yer verilmiştir. Üçüncü bölümde Tilimsânî'nin Miftâhu'l-vusûl ilâ binâi'l-fürû'ale'l-usûl eseri, usûl yönünden Şafiî ve Eş'arî ekolünün en önemli eserlerinden İmam Gazalî'nin (ö. 505/1111) el-Mustasfâ'sı ve Hanefî ve Maturidî ekolünden İmam Serahsî'nin (ö. 489/1090) Usûlü's-Serahsî adlı eseri ile mukayese edilmiştir. Mütekellim ve fukahâ metodu ile yazılan bu iki eserin Tilimsânî'nin eseriyle karşılaştırılması sonucunda bu eserin bu iki metota benzeyen ve farklılaşan yönlerine değinilmiştir. Bu mukayese zaman ve mekân açısından birbirlerine yakın olan Gazzalî ve Serahsî'nin usûllerinin kendilerinden yaklaşık iki yüz elli yıl sonra başka bir coğrafyada, Mağrib bölgesinde, farklı bir yaklaşım ile yazılan bir usûl eserine etkisinin anlaşılmasına katkı sağlayacaktır. Dördüncü bölümde ise Hanefî mezhebine mensub Debûsî'nin (ö.430/1040) Tahrîcü'l fürû' 'ale'l usûl alanında yazılan ilk kitap olma özelliği taşıyan Te'sisû'n-nazar adlı eseri ve bu konuda zirve olarak kabul edilen Şafiî mezhebine mensub Zencanî'nin (ö.656/1258) Tahrîcü'l-fürû'ale'l-usûl adlı eseri, tez konusu olan eser ile fürû' yönünden karşılaştırılmıştır. sonra doldurulacaktır."
