abstract: "Müslümanların karşılaştıkları çeşitli sorunlara çözüm bulma amacıyla müftülere danışması fetva verme olarak adlandırılan iftâ faaliyetinin ortaya çıkmasına zemin hazırlamıştır. Müftüler, kendilerine yöneltilen soruları asırlarca cevaplayarak bu alandaki büyük bir boşluğu doldurmuşlardır. İftâ faaliyeti, müftü-müsteftî-fetva gibi temel unsurlar etrafında şekillenmiş ve bu çerçevede birçok konu ele alınmıştır. Ortaya çıkan fetva metinleri diğer metinlerden farklı olarak özgün birtakım içeriklere ve özelliklere sahip olmuştur. Ayrıca fetva metinlerinde muhatabın durumu gözetilmiş, ona uygun fetva verilmiş ve kimi zaman fetvadaki görüşlerin delillerine değinilmiştir. Ne yazık ki fetva literatürü ve fetva usulü üzerine yapılan çalışmalar, henüz yeterli seviyeye ulaşmamıştır. Bu çalışmada 16. yüzyılda yaşamış, fetvalarıyla dönemin toplumsal meselelerine çözüm üretmeye çalışmış ve aynı zamanda Gazze'nin Hanefî müftüsü olan Şemsüddîn et-Timurtâşî'nin fetva usulü ve fetvaları ele alınmaktadır. Çalışmamızın ilk bölümünde müellifin hayatı, ilmi kişiliği ve eserleri hakkında bilgi verilmiştir. İkinci bölümde kendi eserleri temel alınarak fetva usulü alanındaki görüşlerine yer verilmiştir. Üçüncü ve son bölümde ise Timurtâşî'nin fetvaları incelenmiş, fetva verme metodu ve fetvalarında gözetmiş olduğu ilkeler örneklerle ortaya konulmuştur."
