abstract: "Araştırmanın hedefi, benzer amaçlara sahip ancak uygulamada aralarında bariz farklar bulunan mikro kredi ile karz-ı hasen arasında karşılaştırmalarda bulunarak karz-ı hasenin üstünlüklerinin ortaya konulmasıdır. Araştırma Giriş ile iki bölümden meydana gelmektedir. Giriş kısmında araştırmanın amacı kapsamı ve önemi ele alınmıştır. Birinci Bölümde mikro finans, mikro finans modelleri, dünyada ve Türkiye'de mikro kredi uygulamaları üzerinde durulmuştur. İkinci bölümde mikro kredi yerine karz-ı hasen bağlığı altında, karz-ı hasen kavramı, İslami mikro finans, faiz ve kredi kavramları ile karz ilişkisi, yoksullukla mücadelede karz-ı hasen, mikro kredi ile karz-ı hasen farkı ile Türkiye'de karz-ı hasen uygulamalarına değinilmiştir. Geleneksel ve modern ekonomik sistemler, adil olmayan gelir dağılımının yarattığı toplumsal tahribi önlemeye yönelik kalıcı çözüm üretmiş değillerdir. Alternatif olarak yeterli kaynağa sahip olmayanlar, kadınlar, girişimciler ve mesleki becerileri olanlar daha kendi meslek projelerine tahsis edilmek üzere finansal aracılardan geri aide etmek üzere çoğunlukla faizle mikro kredi (küçük kredi) tedarik etmektedirler. Ancak, mikro kredide hizmet bedeli olarak %20'yi bulan faiz ödenmesi, yerelden öteye geçememesi, çocuk işçiliğini teşvik etmesi, kullanıcıları tekrar ekonomik dar boğaza itmesi gibi nedenler yoksul ve dezavantajlı kesime çözüm olmaktan uzak durmaktadır. İslam, zenginlerden fakirlere veya parasal desteğe ihtiyaç duyanlara sadece sosyal yükümlülük temeline dayanılarak borç vermelerini isteyerek onların sosyal anlamda desteklenmesini emretmiştir. Karz-ı hasen, mikro kredinin bireye yansıyan olumsuzluklarını gideren, finansmanı toplum geneline yayarak, yoksulların yaşadığı finansal dışlanmayı azaltan, sosyal adaleti ve karşılıklı işbirliğini sağlayan en uygun bir seçenek olarak görünmektedir."
