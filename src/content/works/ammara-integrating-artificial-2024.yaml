abstract: "İslami finans ve dijital devrimin kesişimi, yeni araştırma yönleri için fırsatlar yaratmıştır. Bu çalışma, Fas'taki İslami bankacılık sektöründe Yapay Zeka (AI) uygulamasının mevcut kapsamını değerlendirmeyi, potansiyel beklentilerini ve ilgili zorlukları araştırmayı amaçlamaktadır. Nitel bir yaklaşım kullanan bu araştırma, kapsamlı bir literatür taramasının yanı sıra Fas'taki İslami bankalar, İslami finans kurumları ve yapay zeka sektörlerinden ilgili profesyoneller arasında yapılan yarı yapılandırılmış görüşmeleri entegre edecektir. Bulgular, Fas'taki İslami bankaların henüz yapay zeka kullanımını benimsemediğini, ancak çevrimiçi bankacılık ve dolandırıcılık tespiti için Fintech'in bazı sınırlı kullanımları olduğunu göstermektedir. Bu durum, ülkenin düzenleyici çerçevesinin ve teknolojik altyapısının bu tür yeniliklere hazır olmamasına bağlanabilir. Ayrıca, BT'ye yapılan yatırım nispeten düşüktür ve bankacılık profesyonellerinin uzmanlığının geliştirilmesi gerekmektedir. Bununla birlikte, yapay zekanın bu kurumlarda uygulanması durumunda, önemli faydalar beklenebilir. Bunlar arasında etkin maliyet yönetimi ve giderlerin düzene sokulması, gelişmiş karar alma desteği ve en önemlisi, ülkedeki İslami bankaların pazar payında bir artış yer almaktadır. Bu durum, öncelikle pratik bankacılık çözümlerinin benimsenmesi ve müşteri hizmetlerinin iyileştirilmesi yoluyla konvansiyonel bankalarla rekabetin yoğunlaşmasına yol açacaktır. Ayrıca, İslami bankacılık sektörünün marka imajının geliştirilmesine de katkıda bulunacaktır. Bu tez, belirli düzenleyici politikaların geliştirilmesi ve personel eğitimine yatırım yapılması gibi yapay zeka entegrasyonunu kolaylaştırmaya yönelik öneriler sunmaktadır."
