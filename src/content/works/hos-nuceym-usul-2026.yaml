abstract: "Bu çalışma, geç dönem Hanefî fıkıh düşüncesinin önemli isimlerinden İbn Nüceym'in Fethu'l-gaffâr bi-şerhi'l-Menâr adlı eserinde yer alan ihtilaflı usûl meseleleri üzerinden müellifin usûl anlayışını incelemeyi amaçlamaktadır. İbn Nüceym, akademik çalışmalarda daha çok el-Eşbâh ve'n-nezâir ve el-Bahrü'r-râik gibi kavâid ve fürû eserleriyle ele alınmıştır. Buna karşılık Fethu'l-gaffâr, Menâr şerhleri arasında zikredilmekle birlikte, İbn Nüceym'in usûl anlayışını ortaya koyan müstakil bir incelemeye yeterince konu edilmemiştir. Bu tez, söz konusu eseri merkeze alarak İbn Nüceym'in ihtilaflı usûl meselelerini ele alış biçimini, görüşler arasında yaptığı değerlendirmeleri ve tercihlerini dayandırdığı gerekçeleri incelemek suretiyle Hanefî usûl literatürüne katkı sunmayı hedeflemektedir. Çalışmanın birinci bölümünde İbn Nüceym'in hayatı, ilmî çevresi, eserleri ve yaşadığı dönemin genel ilmî şartları ele alınmıştır. İkinci bölümde Fethu'l-gaffâr'ın tamamı taranarak tespit edilen elli üç ihtilaflı usûl meselesi incelenmiştir. Bu meseleler, el-Menâr'ın konu tertibi aynen takip edilmeksizin, çalışmada esas alınan tasnif doğrultusunda deliller, hükümler, elfâz bahisleri, beyan, nesih ve içtihat başlıkları altında değerlendirilmiştir. Üçüncü bölümde ise önce Fethu'l-gaffâr'ın kaynak kullanımı ve atıf yapısı ele alınmış, ardından seçilen meseleler üzerinden İbn Nüceym'in usûlcülüğü ve meseleleri değerlendirme biçimi incelenmiştir. Bölümün sonunda Fethu'l-gaffâr'ın sonraki Hanefî usûl literatüründeki yeri, İbn Âbidîn'in Nesemâtü'l-eshâr'da bu esere yaptığı atıflar üzerinden örnek olarak değerlendirilmiştir. Çalışmada, Fethu'l-gaffâr'ın İbn Nüceym'in usûl anlayışını takip etmek bakımından elverişli bir metin olduğu kanaatine ulaşılmıştır. Eserde tespit edilen ihtilaflı meseleler, müellifin Hanefî usûl birikiminden geniş ölçüde yararlandığını, bununla birlikte bazı meselelerde nakledilen görüşleri değerlendirerek tercihte bulunduğunu göstermektedir. Bu yönüyle çalışma, İbn Nüceym'in usûl meselelerine yaklaşımının Fethu'l-gaffâr üzerinden tahlil edilmesine imkân tanımaktadır."
