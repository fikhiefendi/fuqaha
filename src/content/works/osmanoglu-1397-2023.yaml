abstract: "El-Ebherî'nin bu haşiyesi, genel olarak usûl kitaplarında ve özel olarak Şâfiîler nezdinde yaygın bir şekilde kendisine atıf yapılan bir eser olduğu gibi, dil, mantık, fıkıh ve fıkıh usûlünün yetkin eserlerine dayanması hasebiyle kıymeti haizdir ve tam da bu sebeple tarafımdan tahkik ve tahlile konu edilmiştir. Bu haşiyenin ehemmiyeti ve alâmet-i farîkalarından bir diğeri de Abdülaziz El-Buhari'nin Keşfü'l-Esrâr'ı ve benzeri eserler gibi daha ziyade bir usûl ansiklopedisi hüviyeti arz etmesidir. Ayrıca, usûl ve mantık, nahiv, sarf ve belâgat ilimlerinin yanısıra diğer ilimlerin bir arada anlamlı bir bütün halinde harmanlanması, bu haşiyenin ilmî cihetten eriştiği zirveyi göstermektedir. El-Ebherî Şâfiî olmakla birlikte meseleleri ele alırken daha kuvvetli bir delile tesadüf ettiği takdirde diğer mezheplerin tercihlerine meyletmekten de geri kalmamıştır. Bu çalışma vesilesiyle bahse konu eserin yazma nüshasının tahkik ve tahlilinin akabinde neşri amaçlanmış, ayrıca İslâmî ilimlerde bilimsel zihniyetin düşüncede ve telifte ihyası hedeflenmiş, yanısıra usûl-i fıkıh ve mantık ilimlerini mahirane bir surette ele almak gayesi güdülmüştür."
