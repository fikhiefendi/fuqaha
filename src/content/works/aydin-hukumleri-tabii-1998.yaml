abstract: "Hukuk ilminin ana kaynağı tabiî hukuk ile, İslam hukukunun esası Kur'an-ı Kerim'in karşılaştırılmasını konu edinen çalışmamızın amacı; insanların ferdî sorumluluklarını ve sosyal münasebetlerini düzenleyen hukuk ilmini objektif olarak inceleyip, kapsamında bir takım değişiklikler olsa bile, hukukun evrenselliğim, bütün toplumların ortak malı olduğunu ortaya koymaktır. Buradan hareketle, tarih boyunca hukukun geçirdiği devrelerde; insanların özel durumları, sosyo-politik realitenin ve ekonomik sebeplerin ön plana çıkardığı problemler doğrultusunda, durmadan tekâmül eden aklın öngördüğü hukukî temel prensipleri açıklamaya çalıştık. Öte taraftan Kur' an' ı hukuk açısından incelemekle, ilk çağlardan beri insanlığın kullandığı bu hukukî normların, kelâmullah da, insanın maslahatına münasip olarak nasıl açıklandığım belirterek,“hukukun temelinde bir ilahî kaynak vardır”şeklindeki tezimizi hukuk tarihinden misaller vererek temellendirmeye gayret ettik. Ayrıca batı kültürüyle beslenmiş tabiî hukuk düşüncesinin; Kur' an ve sünnetin İslam toplumuna kazandırdığı hukukî melekenin etkisiyle, Müslüman ilim adamları tarafından nasıl algılandığım ve bu noktada genel hukuk kültürüne ne derecede miras bıraktıklarını ortaya koymaya çalıştık. Son olarak doğru bir değerlendirme yapabilmemiz için; genel prensipler ve fer'î deliller açısından, Kur'an'la tabiî hukuku karşılaştırarak, hukukun evrensel olduğu tezini vurguladık. Şunu da unutmamak gerekir ki; çalışmamızın kapsamım bir taraftan hukuk felsefesi, diğer taraftan usûlü'1-fikh oluşturduğundan, içerik itibariyle, teorik bir hüviyet kazandığı ortadadır."
