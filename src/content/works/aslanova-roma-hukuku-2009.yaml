abstract: "Tezin konusu ?Roma Hukuku'nda Rehin Akti (Pignus), Rehin Hakkı (Hypotheca) ve Türk Hukuku'na Etkileri?dir.Bir borç ilişkisinin kurulması aşamasında alacaklı için malvarlığından çıkardığı şeye karşı önem teşkil eden konular borçlunun malvarlığı, kişiliği ve dürüstlüğüdür. Bu aşamada borçlu hakkında yeterli bilgiye sahip olmayan ve malvarlığının güvencesini düşünen alacaklılar, ilk çağlardan itibaren farklı teminat kurumlarını kullanmışlardır.Teminat, şahsî veya aynî olarak ikiye ayrılır. Şahsî teminatta, borçlunun borcunu ödememesi durumu ile karşı karşıya kalındığında, üçüncü bir kişinin alacaklıya alacağını ödeme yükümü altına girmesi söz konusu olmaktadır. Roma'da ilk dönemlerden itibaren kullanılan tipik şahsî teminat kurumu ?kefalet (sponsio)? idi.Aynî teminat ise malvarlığına ait bir değerin bir alacağın elde edilmesine yönelmesini ve borçlunun borcunu ödememesi durumunda malikin rızasına ihtiyaç duyulmadan, söz konusu malın paraya çevrilmesi suretiyle alacaklının alacağına kavuşmasını sağlamaktadır. Tipik aynî teminat kurumu ise ?rehin (pignus-hypotheca)?dir.Modern hukukta rehin hakkı, alacaklıya borcun ifa edilmemesi durumunda, rehin konusu malı icra aracılığıyla sattırıp, satış değeri üzerinden alacağını öncelikle alma hakkını veren fer'î bir aynî haktır.Rehin akti farklı dönemlerde farklı özelliklere sahip olmuştur. Bu özellikler, rehin aktinin konusuna, tarafların sahip oldukları hak ve borçların kapsamına, aynı şekilde mevcut olan hukuki korunma yollarına etkide bulunmuştur.Önem teşkil eden bir diğer husus da Romalıların teminata bakış açılarındaki değişimdir. Zira, Roma Hukuku'nda önceleri teminat kavramından anlaşılan şahsi teminattı. Roma'da borçlu borcundan şahsı ile sorumluydu. Şahsi teminatta söz konusu olan şahıs üzerinde icranın sertliği ve kesinliği Romalıların aynî teminata olan ihtiyacını geciktiren önemli etkenlerdendi. Romalılar ilk önce alacaklıya mülkiyetin geçmesini gerektiren fiducia cum creditore, yani alacaklı ile yapılan inançlı akti uygulamışlardır. Zamanla fiducia yerini önce zilyetliğin alacaklıya geçmesini zorunlu kılan rehin aktine, daha sonra ise zilyetliğin geçmesini gerektirmeyen ve sadece anlaşmayı yeterli gören rehin hakkına (hypotheca) bırakmıştır.?Roma Hukuku'nda Rehin Akti (Pignus), Rehin Hakkı (Hypotheca) ve Türk Hukuku'na Etkileri? konulu çalışmamız Giriş ve Sonuç bölümleri dışında iki bölümden oluşmaktadır.Birinci Bölüm'de, genel olarak Roma Hukuku'nda Aynî ve Şahsî Teminat'tan bahsedilmiştir. Burada, aynî ve şahsî teminatın tercih edilmesinin sebeplerinden, şahsî teminatı sağlayan kurumlardan kefalet ve rehin aktinden, Roma'da aynî teminat denilince akla ilk gelen fiducia ve rehin hakkı (hypotheca) kurumlarından bahsedilmiş ve daha sonra bu kavramlar ve alt başlıkları daha ayrıntılı bir biçimde incelenmiştir.İkinci Bölüm'de ise, birinci bölümde bahsedilen Rehin Akti ve Rehin Hakkı kurumlarının günümüz Türk Hukuku'na etkilerinden ve Roma Hukuku ile Modern hukuk arasındaki farklardan sözedilmiştir.Sonuç bölümünde, birinci ve ikinci bölümlerde ele alınan konular değerlendirilmiş ve varılan sonuçlar saptanmıştır.Çalışmamızın amacı, aynî ve şahsî teminata duyulan ihtiyaç ve bu ihtiyaç çerçevesinde gelişen hukuki kurumları, özellikle rehin akti ve rehin hakkının Roma hukukundaki esaslarını belirlemek olacaktır.Rehin akti ile bir aynî hak oluştuğunun kabulü uzun zaman almıştır. Sonraki dönemlerde ise, rehin aktinin rehin hakkından önemli bir farkı kalmamaktaydı. Artık taraflar çok daha kolay uygulanabilen rehin hakkına daha sık başvurmaktaydı. Ancak bu durum rehin akti ve rehin hakkı arasında yaşanan kavram kargaşasının son bulması demek değildi. Rehin akti ile rehin hakkı arasındaki en önemli fark, rehin akti ile zilyetliğin rehinli alacaklıya geçmesi, buna karşılık rehin hakkının zilyetliğin geçmesini gerektirmeden, sadece basit bir anlaşma ile meydana gelmesidir. Ancak iki kavram arasında bunun dışında da önemli farklar bulunmaktadır. Çalışmamızın amacı da, bu farklara değinerek rehin akti ve rehin hakkı kurumlarını incelemek ve bu kurumların Türk hukukuna etkilerini saptamaktır.Türkiye'de Roma Hukuku ile ilgili çalışmalarda Rehin Akti ve Rehin Hakkı konularının tez çalışması olarak daha önce çok fazla incelenmemiş olması, ve bununla birlikte bu konunun hala güncelliğini kaybetmemesi, bizleri bu konuda Yüksek Lisans Tezi yazmaya yönelten sebeplerdendir."
