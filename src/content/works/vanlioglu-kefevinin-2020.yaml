abstract: "Kefevi'nin Ketaibü a'lâmi'l-ahyâr min fukahâi mezhebi'n-Nu'mâni'l-muhtâr adlı çalışması Osmanlı dönemi tabakât literatürünün en özgün ve kapsamlı Hanefî biyografi eserlerinden biri olup aynı zamanda biyografileri verilen alimlerin ilmî silsilelerini ihtiva etmesi sebebiyle fıkıh tarihi olarak okunmaya ciddi katkıları olabilecek bir eserdir. Bu eserin modern bir neşrinin bu tez çalışması başladığında henüz yapılmamış olması ve hala iyi bir neşrinin de bulunmaması sebebiyle eserin tahkikini hedefleyen bir proje kapsamında bu tez çalışması yapılmıştır. Eserin bir nevi mukaddimesi olarak görülebilecek ve Hanefi tabakâtının başladığı zamandan önceki dönemi konu edinen kısmı, yani Hz. Adem'den başlayıp Hz. Muhammed'e kadar peygamberler ve şeriatları, sahâbe, tabiîn ve müçtehit imamlar döneminde fıkıh ilminin teşekkülüne katkı veren isimlerin ele alındığı kısımlar bu tezin tahkik için esas alındığı bölümdür. Tez çalışması üç bölümden oluşmaktadır. Birinci bölümde müellif ve kitabı tanıtılmakta, ikinci bölümde tahkik kapsamında yer alan metnin içeriği tanıtılmakta ve değerlendirmektedir. Üçüncü bölümde ise eserin ilgili bölümünün elde mevcut nüshalardan seçilmiş dört nüshadan tahkiki yapılmıştır. Burada dört nüshanın verdiği imkanlar doğrultusunda müellif nüshasına en yakın en doğru metni neşretmek hedeflenmiştir. Bu doğrultuda önce birinci bölümde müellif ve eseri özellikle özgün bir içeriğe sahip mukaddimesi esas alınarak tanıtılmaktadır. İkinci bölümün içeriğini teşkil eden peygamberler, son peygamber ve son şeriat fikri ve bu fikrin fıkıh ilminin arkaplanını teşkil etme olgusu incelenmiştir. Bu perspektifin fıkhı evrensel bir bakış açısıyla insanlık tarihi içine yerleştirme düşüncesi içerdiğine dikkat çekilmiştir. Ardından gelen iki başlıkta fıkıh ilminin teşekkül sürecinde en önemli halkalardan ikisini oluşturan sahâbe ve tabiîn dönemi fıkhı ve fakihleriyle ilgili değerlendirmeler yer almaktadır. Fıkıh ilminin adım adım nasıl olgunlaştığı ve bu oluşumda aktif rol alan isimlerin kimler olduğu soruları bu bölümlerin mihverini teşkil etmektedir. Nihayet son bölümde ise kendilerine bazen şehir fakihleri (fukaha-i emsâr) ya da müçtehit imamlar adı verilen fıkıh ilminin kurucusu kabul edilen fakihler ve bunların ekolleri ve ilim silsileleri incelenmiştir."
