abstract: "Osmanlı döneminde İslâm hukuku alanında pek çok eser kaleme alınmıştır. XVI. ve XVII. Yüzyıllarda yoğun olarak ortaya çıkan bu çalışmalardan bazıları günümüze tam bir şekilde bazıları ise farklı sebeplerle eksik ulaşmıştır. Söz konusu dönemde yaşamış ve fıkhî meselelerde önemli konulara imzasını atmış âlimlerden biri de Karamanlı fakih, Zenbilli Ali Efendi diye bilinen Ali Cemâlî'dir. Fatih döneminde doğup II. Bayezid, Yavuz Sultan Selim ve Kanuni Sultan Süleyman döneminde şeyhülislâm olarak görev yapan Zenbilli Ali Efendi en önemlisi İslâm hukuk alanında olmak üzere İslâmî ilimlerin neredeyse her alanına katkı sağlamıştır. Elimizdeki tezin yazılması için klasik fıkıh kitapları ve kütüphane arşivleri elden geçirilmiştir. Ayrıca konuyla ilgili yapılan çalışmalar incelenmiş ve müellifin kendi eserine müracaat edilmiştir. Zenbilli'nin kitabında yer verdiği muamelat konuları tezin konusunu oluşturmuştur. Müellif, fetvalarını verirken Hanefî fıkhının esaslarını dikkate almış ve bazı konularda İmam Şafiî'nin görüşlerini akabinde zikretmiştir. Meselelere yaklaşımındaki tavrı yanında muâmelât alanına dair bütün konulara değinmiş olması önemlidir. Yapılan incelemelerde Zenbilli hakkında bitmiş bir çalışmaya rastlanmamış olması böyle bir tez hazırlanmasına teşvik etmiştir. Çalışmada Zenbilli Ali Efendi'nin hayatı, ailesi, yaşadığı dönemin dînî, siyasi, ekonomik özellikleri, ilmi kişiliği yanında muamelata dair fetvaları hakkında bilgi verilirken klasik fıkıh kitaplarıyla karşılaştırılmalar da yapılmıştır. Araştırmalar neticesinde Merginânî'nin el-Hidâye adlı eserinden etkilenerek Muhtaratu'l-Hidâye adlı eserini oluşturduğu anlaşılan Zenbilli'nin Hanefî gelenekten ayrılmadığı görülmüştür. Çalışmanın sonunda Zenbilli'nin tercih etmediği Hanefî imamların ve ve diğer mezheplerde yer alan konuyla ilgili görüşler zikredilerek genel bir değerlendirme yapılmıştır."
