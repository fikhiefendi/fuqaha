abstract: "Demokratik siyasal sistem hükümet şekillerinden biri olan Başkanlık Sisteminin İslâm kamu hukuku açısından incelendiği bu çalışmada öncelikli olarak toplumsal yaşamın zorunlu bir neticesi olan devlet olgusu ele alınmıştır. Bu bağlamda devlet mefhumu dini ve felsefi açıdan incelenmiş, devletin kökenleri ve devlet mefhumunun gelişim süreci ana hatlarıyla ortaya konulmuştur. İslâm toplumu için devlet şeklinde bir siyasal yapı içerisinde yaşamanın dini gerekliliği ve bu gerekliliğin sebepleri üzerinde durulmuştur. İslâm dininin toplumsal yaşamın huzurunu temin gayesiyle telkin ettiği eşitlik, özgürlük, adalet, şûra, toplumsal dayanışma ve yardımlaşma gibi temel ilkelere dayanan İslâm siyasal sisteminin, Hz. Peygamberle birlikte Medine'de fiilen hayat bulması ve râşid halifelerle birlikte bu sistemin \"hilâfet\" adıyla kurumsallaşması çalışmada tahlil edilmiştir. Çalışmada devlet otoritesini kullanmada millet iradesini esas alan demokratik hükümet modelleri temel özellikleriyle aktarılmış, bu hükümet modellerinden Başkanlık Sistemi, İslâm siyasal sistemi hükümet modeli ile kuvvetler ayrılığı bakımından karşılaştırmalı olarak incelenmiştir. Bu karşılaştırmada temel kriter olarak devlet şeklinde örgütlenen siyasal yapıların temel fonksiyonları olan ve siyasal sistemlerin ana karakterini yansıtan yasama, yürütme ve yargı kuvvetlerinin yapısı, oluşumu, görev ve yetkileri ve birbirleriyle ilişkileri esas alınmıştır. Neticede millet iradesine verdiği önem nedeniyle demokratik sistemlerle; yürütmenin yapısı, işleyişi, görev ve yetkileri bakımından daha çok başkanlık sistemiyle benzerlik göstermekle birlikte aslında İslâm siyasal sisteminin, vahye dayanması hasebiyle bütün sistemlerden farklı ve özgün bir sistem olduğu kanaatine varılmıştır."
