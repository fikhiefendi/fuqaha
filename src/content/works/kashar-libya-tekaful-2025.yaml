abstract: "Bu tez çalışması, Libya'daki tekafül sektöründe müşteri ilişkileri yönetimi Müşteri İlişkileri Yönetimi (MİY) ile müşteri sadakati arasındaki ilişkide müşteri memnuniyetinin aracılık rolünü incelemektedir. Çalışma, İslami finans kuruluşlarının rekabetçi konumlarını güçlendirme ve hızla gelişen sigortacılık ortamında müşteri beklentilerini karşılama ihtiyacına yanıt vermektedir. Müşteri İlişkileri Yönetimi'nin (MİY), memnuniyet ve sadakat konularına yönelik literatürden geliştirilen kavramsal bir çerçeve ile yönlendirilen bu çalışmada, nicel bir araştırma tasarımı uygulanmaktadır. Birincil veriler, Libya'daki tekafül şirketleri müşterisi olan 293 kişiye uygulanan yapılandırılmış anket aracılığıyla toplanmış, toplanan verilerin taranmasından sonra 293 geçerli yanıt elde edilmiştir. Ölçüm ve yapısal modelleri test etmek amacıyla Doğrulayıcı Faktör Analizi (CFA) ve AMOS kullanılarak Yapısal Eşitlik Modellemesi (SEM) gibi analitik araçlar ile analizler gerçekleştirilmiştir. Bulgular, Müşteri İlişkileri Yönetimi (MİY) ile memnuniyet, memnuniyet ile sadakat arasında anlamlı ve olumlu bir ilişki olduğunu ve memnuniyetin Müşteri İlişkileri Yönetimi (MİY) ile sadakat arasındaki ilişkide kısmi aracılık etkisi bulunduğunu göstermektedir. Bu sonuçlar, Müşteri İlişkileri Yönetimi (MİY) uygulamalarını uzun vadeli müşteri sadakatine dönüştürmede memnuniyetin kritik bir rol oynadığını doğrulamaktadır. Çalışma, teorik açıdan ilişki pazarlaması modellerini Libya'nın az incelenmiş tekafül bağlamına taşıyarak ilgili alan yazına katkıda bulunmaktadır. Uygulamalı açıdan ise müşteri odaklı stratejilerin önemini vurgulamakta, tekafül şirketlerinin memnuniyet ve sadakati artırmak için hizmet kalitesi, kişiselleştirilmiş etkileşim ve şeffaf iletişime öncelik vermesi gerektiğini önermektedir. Coğrafi sınırlılık ve öz-beyanlı verilere dayanma gibi kısıtlamalara rağmen çalışmanın, ülkeler arası karşılaştırmalar, uzunlamasına dinamikler ve ek aracılık değişkenlerini araştıracak gelecekteki çalışmalara sağlam bir temel sunduğu düşünülmektedir. Bu tez, teorik içgörüleri pratikle birleştirerek Libya'daki tekafül sektöründe sürdürülebilir büyümeyi desteklemede müşteri memnuniyetinin stratejik bir aracı rolü olduğunu vurgulamaktadır."
