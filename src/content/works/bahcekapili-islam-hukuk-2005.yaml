abstract: "ÖZET Bu çalışma, İslâm hukuk metodolojisinin bir bölümünü oluşturan açık ve kapalı lafızlarla ilgili bir araştırmadır. Tezimiz iki bölüm ve bir sonuçtan oluşmaktadır. Birinci bölümde, açık lafızları ele aldık. Açık lafızlar, mananın anlaşılması konusunda herhangi bir açıklamaya ya da dış unsura ihtiyaç duymayan kavramlardır. Açık lafızlar, manaya delâletlerinin kuvvetli oluşuna göre; muhkem, müfesser, nass ve zahir olmak üzere dört kısma ayrılmaktadır. İkinci bölümde, kapalı lafızları inceledik. Kapalı lafızlar, manalın anlaşılması için bir açıklamaya ya da dış unsurlara ihtiyaç duyan lafızlardır. Kapalı lafızlar da manaya delâletinin zayıflığı açısından; müteşâbih, mücmel, müşkil ve hafi olmak üzere dört kısma ayrılmaktadır. Biz her iki bölümde de bu lafızları incelerken, mukayeseli bir araştırma yapmayı hedefledik. Sonuç bölümünde ise, İslam hukuk metinleriyle diğer hukuk metinlerinin doğru bir şekilde anlaşılabilmesi için hukukî kavramların özümsenmesi kanaatine vardık. IV"
