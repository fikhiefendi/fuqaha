abstract: "İslam hukukundaki şirket yapıları, tarih içinde, vahiy temelli oluşmuş, adaletli paylaşımı esas alan iktisadi kurumlardır. Ancak zaman içinde meydana gelen değişikliklere ayak uyduramamaları, onları çağın gerisinde bırakmıştır. Elbette ki bunda Batıda ortaya çıkan şirket yapılarının da etkisi vardır. Çünkü onların varlığı, bu sahada çalışma yapmayı geciktirmiştir. Ancak batıdaki şirket yapıları, batının yerli kültürüne uygun olduğu için sürekliliklerini sağlamada zorlanmamışlardır. Hâlbuki bu şirket yapılarının Müslüman toplumlarda kullanılması, kurulan şirketlerin birkaç nesil sonra çökmesini önleyememiştir. Dolayısıyla İslam toplumlarında ortaya çıkan şirket yapılarının, günümüz modern işletme teknikleri ışığında yeniden ele alınmaları, bir ihtiyaç olarak karşımızda durmaktadır. Özellikle günümüzde ülke ekonomilerinin büyük bir bölümünü oluşturan aile şirketleri, toplumun sahip olduğu dini, milli, sosyal ve kültürel değerler dikkate alınarak yeniden düşünülmelidir. Bu amaçla konu İslam hukukunda ve günümüz hukukunda incelendi, aralarındaki yapısal farklar tespit edildi. Şirketlerde sürekliliğin sağlanması yerine sürdürülebilir şirket yapısının oluşmasına yönelik öneriler sunuldu."
