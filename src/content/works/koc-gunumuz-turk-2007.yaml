abstract: "Çalısmamız esnasında önce İslam Hukukunda mezheplerin âriyet akdine bakıslarını sonra da, günümüz Türk Hukukunun bakısını, daha sonra da her iki hukuk sisteminin birlestikleri ve ayrıldıkları noktaları ortaya koymaya çalıstık. Zaman zaman da bu görüsler arasında tercihlerde bulunduk. Çalısmamızda ortaya koydugumuz sonuçları söyle özetleyebiliriz: Âriyet: Dönülmesi kabil olmak üzere intifa hakkı karsılıksız olarak baskasına devredilen maldır. Âriyet akdi ele aldıgımız bütün hukuk sistemlerine göre teberru akidleri arasında yer almaktadır. Hanefî ve Malikî mezheplerinin görüslerine göre; âriyet alan, âriyet aldıgı malı sahibinin izni olmadan bir baskasına âriyet olarak verebilirken bizim de katıldıgımız diger mezheplerin ve günümüz Türk Hukukunun görüslerine göre ise veremeyecegi belirtilmistir. Hanefî mezhebine göre âriyet akdi gayr-ı lazım bir akid oldugu için tarafların akıllı olması yeterli iken diger mezhepler ve günümüz Türk Hukukuna göre tarafların teberrua yönelik akidleri yapabilecek ehliyete sahip olması gerekir. Âriyet akdi bütün mezheplere göre bedelsiz olarak yapılır. Ancak günümüz Türk Hukukunda âriyet alanın ve verenin birlikte çıkarları söz konusu oldugunda da akid karsılıksız olarak yapılmıs gibi kabul edilir. Âriyet olarak alınan malın tazmin edilip edilmeyecegi fıkıhçılar arasında tartısılmıstır: Bizim de katıldıgımız Hanbelî mezhebinin görüsüne göre; âriyet alınan mal her halükarda mazmundur. Sâfiî mezhebine göre ise âriyet mala hasar, kullanım esnasında geldiyse tazmin edilmez, kullanım dısında olmussa tazmin edilir. Malikî mezhebine göre ise âriyet mal saklana bilen bir mal ise tazmin edilir, degilse tazmin edilmez. Diger mezhepler ve günümüz Türk Hukukuna göre ise kullananın bir kusuru var ise meydana gelen zararı tazmin eder yoksa etmez. Âriyet alınan malın normal masrafları, Sâfiî ve Hanbelî mezheplerinin dısında kalan mezhepler ile günümüz Türk Hukukunun ve bizim de katıldıgımız görüse göre, âriyet alana aittir. Sâfiî ve Hanbelî mezheplerine göre ise mal sahibine aittir. Âriyet alınan malın geri verme masrafı bütün mezhepler ve günümüz Türk Hukukuna göre âriyet alana aittir."
