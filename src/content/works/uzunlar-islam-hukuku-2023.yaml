abstract: "Cinnet getirmek kavramı yaygın bir şekilde kullanılan ve kullanımıyla da zihinlerde ortak anlam birliği oluşturan bir kavramdır. Ancak bu kavram tam olarak ne hukukî ne de tıbbî terminolojide hak ettiği yeri bulamamaktadır. Bununla birlikte modern psikolojik kaynaklardan dünyaca kabul gören ve referans alınan Amerikan Psikiyatri Derneği'nin ve Dünya Sağlık Örgütü'nün düzenlediği el kitaplarında kavramın tam olarak karşılığına rastlayamamış olsak da bu duruma benzer ya da bu durumun tetikleyicisi olacak şekilde kabul edilebilecek bilgilere ulaşılmıştır. Cinnet kavramı Kur'an ve sünnet ışığında incelendiğinde cünûn kavramına karşılık gelecek şekilde kullanıldığı görülmektedir. Yine fıkhî kaynaklarda ve Arapça lügatlerde kavram, kısmî de olsa deliliğe karşılık gelecek şekilde tanımlanmıştır. Kavramın tarihsel arka planını irdelediğimizde tarama yapılarak ulaşılan Osmanlı Arşiv Belgelerinde cinnet kavramının; kısmen deliliğe (cünun) karşılık gelecek şekilde kullanıldığı görülmüştür. Ancak bazı cinnet durumlarında kişinin şuur ve iradesi cünun gibi tamamıyla ortadan kalkmayıp az da olsa fiil anında devam ettiği yönünde kanaat belirtilmiştir. İncelenen kaynaklardan anlaşıldığı kadarıyla“cinnet getirmek”ve“cinnet geçirmek”deyimlerinin ikisi de aynı anlama gelecek şekilde kullanılmıştır.“Cinnet getirmek”kavramı bireyin bir anlık öfke patlaması neticesinde, maruz kaldığı olaylara karşı -gerek sözle gerekse fiziki olarak- aşırı tepki verme durumu olarak tespit edilmiştir. Bu tespite istinaden“öfke”faktörünü dikkate alarak, cinnet getirmek durumu, İslam hukukunda hükümlere tesiri açısından ortaya koyulmuştur. Bu çalışmada İslam hukukunda cinnet durumunun, ehliyet bahisleri içindeki yeri, cinnetin modern psikolojideki tanımı ve cinnetle ilişkilendirilebilecek haller veya bozukluklar ve İslam hukukundaki cinnet getiren kişinin durumu incelenmiştir."
