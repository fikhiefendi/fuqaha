abstract: "Evlilik kurumuyla oluşturulan aile, toplumu oluşturan temel unsurdur. Bu açıdan dinimiz İslam aileye büyük önem vermiştir. Bu açıdan ailenin sağlam bir şekilde oluşturulması ve sağlıklı bir şekilde sürdürülmesi büyük önem taşır. Nasları temel alan İslam Hukuku aile kurumu hakkında pek çok düzenlemeler yapmıştır. Buna rağmen kurulan her aile sağlıklı bir şekilde devam etme başarısını gösterememiştir. Bazı durumlarda aile, bireyleri mutlu edememekte ve aile hayatı taraflara saadet sunamamaktadır. Böyle bir durumda çekilmez bir hal alan evlilik hayatına insanları mahkûm etmenin de bir anlamı yoktur. Bu açıdan İslam başarısız bir evliliğin sona erdirilmesi için boşanmayı da bir gerçeklik olarak kabul etmiştir. Bunun için evlilik kurumunun oluşturulmasında olduğu gibi boşamayı da hukukî statüye bağlamıştır. Böylece boşanma hukuku çerçevesinde tarafların subjektif tutumları önlenmeye çalışılmış ve boşanma sebebiyle ortaya çıkan riskler adil olarak paylaşılmaya çalışılmıştır. Boşanmadan sonraki süreçte de boşanan tarafların kendi iradeleri doğrultusunda hayatlarını düzenleme ve sürdürebilme imkânının önü açılmıştır. Bu çalışmada boşanma ile ilgili hukukî düzenlemelerin İslam ve Türk Hukuku açısından bir karşılaştırması yapılmaya çalışılacaktır. Bu çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezin konusu, kapsamı, amacı, önemi ve yönteminden bahsedilmiştir. Birinci bölümde İslam ve Türk Hukukuna göre boşanma kavramı, önemi, dinlerde ve kültürlerde boşanma ile ilgili bilgiler verilmeye çalışılmış ayrıca boşanma kavramı Türk Hukuku açısından ele alınmıştır. İkinci bölümde ise tezimizin ana konusu olan boşanma ile ilgili hükümler İslam ve Türk Hukuku açısından karşılaştırılarak değerlendirilmeler yapılacaktır."
