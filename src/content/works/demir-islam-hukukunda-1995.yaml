abstract: "ÖZET Yüksek Lisans Tezi İSLAM HUKUKU'NDA KEFALET Halis DEMİR Danışman: Yrd.Doç.Dr. Hakkı AYDIN 1995 SAYFA: 88 Jüri: Yrd.Doç.Dr. Hakkı AYDIN islam Hukukuna göre kefalet, teminat gayesi taşıyan, kefil açısından bağlayıcı bir akittir. Kefalet akdinin meşruiyeti Kur'an, Sünnet, îcmâ ve Örfe dayanmaktadır. Aslî kaynaklarda kefaletle ilgili genel prensiplerin vaz edilmiş olması sonucu, örfün kefalet akdine tesir sahası genişlemiştir. Kefalet husûsi bir akit olması sebebiyle, kefil, asil. alacaklı ve kefaletin konuyula ilgili çeşitli şartlar vardır. Ayrıca Fıkhı mezhepler arasında farklılıklar da vardır. Kefalet akdi toplumda fertler arasında ahlâkî, hukukî ve içtimaî açılardan dayanışmayı sağlar."
