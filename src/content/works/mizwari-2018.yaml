abstract: "Bu çalışma, Allah ve Peygamber'in (s.a.v.) yasakladığı alışverişlerden uzak durulması durumunda elde edilen ekonomik gayeleri/maslahatları beyan etmek için hazırlanmıştır. Zira bugünkü toplumumuzun karşı karşıya olduğu ekonomik problemlerin ekseriyeti, haram kılınmış işlemlerde ve yasak mallardaki muamelelerde yatmaktadır. İlk bölümde, İslam hukukundaki makâsıdın mahiyeti ve onu bilmenin öneminden bahsettik. İslam ekonomisinin özellikleri ve genel ilkelerinin izahından sonra da İslam hukukundaki alışverişin ekonomik hedeflerini ve malın korunması, tespiti, revacı ve adalet içeren hususları açıkladık. İkinci bölümde, İslam hukukunda bir nassa dayalı yasaklı alışverişleri zikrettik. Bu yasakların nedeninin; ya ribevî mallar sınıfına giren altı çeşit mal ve îne satışı gibi faizin varlığından ya meyvenin olgunlaşmasından önce satışı ve şartlı satış gibi garar (meçhulün) satışının varlığından ya kişinin kardeşinin alışverişi üzerine alışveriş yapması ve tüccarların kervanları şehir dışında karşılaşması gibi zarara sebebiyet veren alışverişin varlığından ya da ك içki, kan ve leş satışı gibi eşyanın kendisindeki bir illetin varlığından kaynaklı yasaklı alışveriş olduğunu izah ettik. İktisadi gayeleri beyan etmek için de bu dört tür alışverişin her birinin sonuna özel bir bölüm tahsis ettik. Bu satışlardan uzaklaşmanın; ticaretin gelişmesi, malların israfının korunması, fiyatların düşmesi, üretimin artması, malların tedariki, emeğin çoğalması, yoksulluğun, hırsızlığın, rüşvetin vb. suçların azaltılması dâhil olmak üzere büyük ekonomik faydaların elde edileceği apaçık ortaya çıkmıştır."
