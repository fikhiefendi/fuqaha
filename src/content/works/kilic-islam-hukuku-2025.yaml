abstract: "Bu çalışma, İslâm hukuku perspektifinden aile reisliği kurumunu hem teorik hem de pratik boyutlarıyla incelemeyi amaçlamaktadır. Aile kurumu, bireylerin sosyal, kültürel ve ahlaki değerleri edindikleri; kişilik gelişiminin temellendiği en temel toplumsal yapı olarak kabul edilmektedir. Ailenin sağlıklı bir biçimde işleyebilmesi ve toplumsal düzenin korunabilmesi için ise, aile içi rollere dair görev ve sorumlulukların belirli bir sistem dâhilinde düzenlenmesi gerekmektedir. Bu çerçevede aile reisliği, yalnızca bir yönetim pozisyonu değil, aynı zamanda hak ve sorumlulukların dengeli bir şekilde paylaşıldığı adil bir sistemin sürdürülebilirliği açısından da hayati bir rol üstlenmektedir. Dolayısıyla aile reisliği, İslâm hukukunda hem hukukî hem de toplumsal fonksiyonları itibariyle derinlikli bir şekilde ele alınması gereken çok yönlü bir müessesedir. Çalışmada, Kur'ân-ı Kerîm başta olmak üzere sünnet, klasik fıkıh eserleri ve modern İslâm hukukçularının görüşleri çerçevesinde aile reisliği derinlemesine analiz edilmiştir. Özellikle Nisâ Suresi 34. âyette geçen“kavvâm”ifadesi üzerinden erkeğin ailede üstlendiği görev ve sorumluluklar değerlendirilmiş; bu kavramın sadece otorite değil, koruma, gözetme ve adalet yükümlülüğü anlamına geldiği vurgulanmıştır. Ayrıca Bakara Suresi 228. âyet gibi temel metinler ışığında eşler arasındaki hak ve sorumluluk dengesi, aile birliğinin devamı açısından ele alınmıştır. Çalışma kapsamında, evlilik akdiyle başlayan aile birliğinde aile reisinin, hem eşine hem de çocuklarına karşı üstlendiği maddî ve şahsî yükümlülükler; nafaka, mehir, barınma, eğitim, terbiye ve temsil gibi başlıklar altında incelenmiş, bu görevlerin ahlâkî değerlerle olan ilişkisi açıklanmıştır. Ayrıca aile reisinin taşıması gereken temel nitelikler, bireyler arası ilişkilerde adalet ve merhamet ilkeleriyle bağlantılı olarak ele alınmıştır. Elde edilen bulgular, İslâm hukukunun aile kurumuna atfettiği sorumluluk merkezli yaklaşımın, aile yapısının korunması ve toplumsal istikrarın sağlanması açısından güçlü bir zemin sunduğunu göstermektedir. Bu çerçevede, aile reisliği kurumu hem tarihsel gelişimi hem de çağdaş bağlamda uygulanabilirliği yönüyle değerlendirilmiş ve aile yapısının güçlendirilmesine yönelik öneriler sunulmuştur"
