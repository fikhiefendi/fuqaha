abstract: "El-Bâbî el-Halebî'ye (ö.839h) ait olan Muhtasar fi'l-Fıkhi Mimma Leyse fi'r-Ravda ve'l-Minhâc adlı mahtut kitap, Şafii fıkhının önemli eserlerindendir. Kitabın müellifi el-Bâbî ansiklopedik bir alim olup, usül, fıkıh, arapça ve kıraat ilimlerinde söz sahibidir. Döneminin önde gelen Şafii alimlerinden dersler almıştır. Kitabında dil, tefsir, siyer ve diğer bazı alanlara ilişkin faydaların yanı sıra, özellikle hicri yedinci ve sekizinci asırdaki mezhep fakihlerinin içtihatlarının bir özetine yer vermiştir. Araştırmacı, çalışmasında gerçekleştirmeye çalıştığı birtakım hedefler belirlemiş olup bunlardan bazıları şu şekildedir: İlmi hayatının araştırılması ve ismi, nesebi, doğumu, yetişmesi, ahlaki özellikleri, hocaları ve öğrencilerinin de tanıtılması yoluyla ilmi bir şekilde kitabın müellifinin tercemesine ışık tutulması, mahtut eserin yazarına olan nispetinin tespiti ile kaynakları ve terimleriyle beraber müellifin yöntemi üzerinden kitaptaki en önemli bulunan meselelerin incelenmesi bu hedeflerdendir. Bununla beraber eserin tahkikinin yapıldığı bölümde ise ayet, hadis ve görüşlerin tahrici, lafızların şerhi, önemli şahsiyetlerin tercemesi ve bazı yerlerin de tarifi yapılmıştır. Çalışma sonucunda şu bulgular elde edilmiştir: Kitabın müellifine olan nispeti tespit edilmiştir. Müellifi olan el-Bâbî'nin takip ettiği yöntem ise Ravda ve Minhâc adlı eserlerde yer almayıp Şafii mezhebinin temel kitaplarından en ayrıntılı meseleleri nakletmeye önem vermesi, fıkhî meselelerde görüş ve vecihleri zikretmesi ve sadece görüşleri nakledip yorumlamakla kalmayarak itirazlarda bulunup yönlendirmeler yapması şeklinde olmuştur. Ayrıca eserinde hala mahtut halde bulunan el-Ezra'î'ye ait olan Ğunyetü'l-Muhtac ile kayıp olan Rafi'î'nin el-Îcaz fi Ahtari'l-Hicaz gibi Şafii fıkhının çok önemli kaynaklarından yararlanması da yönteminin önemli özelliklerinden biridir."
