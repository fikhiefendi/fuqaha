abstract: "Kur'ân'ın tefsiri çerçevesinde, dilbilim, en önemli unsur olma özelliğini taşımaktadır. Dilbilimsel tefsir faaliyetlerinin temeli Hz. Peygamber (s.a.v.) dönemine kadar uzanmaktadır. Erken dönemde yazılan ve günümüze kadar ulaşan, el-Vücûh ve'n-Nezâir, Garîbu'l-Kur'ân ve Me'âni'l-Kurân tarzındaki eserler de dilbilimsel tefsir faaliyetlerinin köklü bir geçmişe sahip olduğunu göstermektedir. İslâmî ilimlerin çoğunda önemli eserlere imza atan Taberî“Câmiü'l-Beyân 'an Te'vîli Âyi'l-Kurân”adlı tefsirinde dilbilimsel izahlarda bulunmuştur. Taberî, eserinde tartışmaya medar olan konularda dil ekollerinin görüşlerini tafsilatlı bir şekilde aktarmıştır. Ancak tercihlerde bulunurken Basralı dilcileri eleştirmekle birlikte Kûfeli dilcilerden yana tavır koymuştur. O, dilsel izahlarında dilbilim alt dallarından Sarf-İştikâk, Nahiv, Dirâsetü'l-Müfredât, İlmü'l-Delâle, İlmü'l-Esvât ve İlmu'l-Lehcât'ı sistemli bir şekilde işlemiştir. Tefsirinde rivâyetlerin ağırlığı önemli derecede hissedilmekle birlikte rivâyetlerle dilsel kaideler arasındaki bağlantıyı kurmaya çalıştığı görülmektedir. Dolayısıyla müfessirin dilsel izahları sathi ve düzensiz olmayıp, belli bir yöntem çerçevesinde olmuştur. Ayrıca dilbimin alt dallarından İlmü'l-Esvât'ın bir bölümü olarak değerlendirilen Kırâatleri işlemesi de tefsirinin önemli bir özelliği olarak zikredilmelidir. Bunun yanında ele aldığı her Kırâatten sonra dilbilimin diğer alt dallarına geçiş yapması da ayrıca belirtilmelidir. Taberî, dilbilimin diğer İslâm bilimlerine yansımasına da işaret etmiştir. Bu doğrultuda kırâatlerin yanında fıkhî yorumların şekillenmesinde dilsel etkenlerin rolünü ortaya koymuştur. Biz de bu çalışmada söz konusu hususları göz önüne alarak Taberî'nin, rivâyetlerin yanında, dilbilimsel tefsir yöntemini kullandığını incelemeye çalıştık."
