abstract: "Bu çalışmada İslam borçlar hukukunun en temel konularından biri olan safkateyn yasağı ve bu yasağın günümüzde uygulanan faizsiz finansman araçlarına etkisine yer verilmiştir. Çalışmamız bir giriş, dört bölüm ve bir sonuçtan meydana gelmiştir. Giriş kısmında çalışmanın çerçevesini belirlemek amacıyla araştırmanın konusuna, önemine, amacına, yöntemine, sınırlandırılmasına ve daha önce yapılmış çalışmaların değerlendirilmesine yer verilmiştir. Birinci bölümde ise İslam hukukunda akitler genel teorisi ele alınarak, akitlerin tasnifi ve akit hürriyeti konuları üzerinde durulmuştur. İkinci bölümde safkateynin sözlük ve terim anlamları, terimleşme süreci ve literatürde işlenişi konuları kronolojik olarak incelenmiştir. Ayrıca safkateynin benzer kavramlarla ilişkisi ele alınmıştır. Üçüncü bölümde İslam hukuk doktrininde akitlerin birleştirilmesine yer verilmiştir. Bu çerçevede safkateyn yasağının fıkhî dayanakları, mahiyeti, illeti ve akitlerin birleştirilmesine yol açan faktörler birer başlık altında incelenmiştir. Çalışmanın dördüncü bölümü, safkateyn yasağının günümüz faizsiz finans uygulamalarına etkisi konusuna tahsis edilmiştir. Bu bölümde İslamî finansman araçlarından finansal kiralama (leasing), çağdaş murabaha, sukuk, azalan müşâreke ve teverruk uygulamalarına yer verilmiştir. Çalışmamız vardığımız neticeleri içeren bir sonuç bölümüyle tamamlanmıştır."
