abstract: "Seyyid Mehmed Nesîb Efendi 19. ve 20. Yüzyıllarda İstanbul'da yaşamış bir Osmanlı âlimidir. Tasavvufî, ilmî ve hukukî kişiliğe haiz olan Nesîb Efendi Dârü'l-Hikmeti'l-İslâmiyye üyeliği, Dârü'l-Fünûn Hukuk Fakültesi müderrisliği ve Osmanlı Devleti mahkemeleri azalığı gibi çeşitli vazifelerde bulunmuştur. Tasavvuf, fıkıh ve hukuk alanındaki makaleleri dönemin önemli dergilerinde yayınlamıştır. Nesîb Efendi'nin hukuk alanında yazdığı ve Mecelle'nin ıslahı ile ilgili görüşlerini aktardığı“Mecelle'nin Islahına Doğru”adlı makale onun önemli eserlerinden bir tanesidir. Makalede, kanunların asrın ihtiyaçlarına göre düzenlenmesi ve kanunu düzenleyecek kişilerin insanların örf, âdet ve muâmelelerine vukûfiyetinin gerekliliğine değinilmekte, akitlerle birlikte ileri sürülen şartlar ve mezheplerin bu konu hakkındaki ihtilaflarının analizi yapılmakta, özellikle de Mecelle mazbatasında bu konu hakkında tercih edilen görüşün asrın ihtiyacını karşılamadığı ve ta'dîlinin gerekliliği üzerinde durulmakta, mesele ilmî bir metodolojiyle ele alınmaktadır. Nesîb Efendi'nin, Mecelle'nin ıslahı ile ilgili görüşlerini ele aldığı makale, onun özellikle Mecelle'nin hazırlanışı esnasında ortaya çıkan ve ta'dîl çalışmaları esnasında da gündemde olan“Batı'dan bir kanun iktibası”fikirlerinin tam karşısında ve Mecelle'nin İslâm hukuk geleneği içerisinde ta'dîlinin mümkün olduğu, dolayısıyla İslâm hukukunun her çağın ihtiyaçlarına cevap verebilecek derinlikte ve zenginlikte olduğu fikrini benimsediğini ortaya koymaktadır."
