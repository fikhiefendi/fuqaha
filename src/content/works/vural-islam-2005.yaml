abstract: "IV ÖZET DOKTORA TEZİ İSLÂM HUKUK DÜŞÜNCESİNDE YASAMA YETKİSİ (Hz. ÖMER DÖNEMİ) Muammer VURAL Danışman : Prof. Dr. Beşir GÖZÜBENLİ 2005-SAYFA: \\TH + 197 Jüri : Prof. Dr. Beşir GÖZÜBENLİ Prof. Dr. Hamza AKTAN Prof. Dr. H. İbrahim ACAR Prof. Dr. Vahdettin BAŞÇI Prof. Dr. Ali BAKKAL Bu doktora tezinin konusu \"İslâm Hukuk Düşüncesinde Yasama yetkisi'dir. Tez bir giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı ve metoduna dair bilgi verildi. Birinci bölümde, hukukta kaynak kavramı analiz edilerek pozitif hukuk ile İslâm hukukunun kaynakları mukayeseli olarak incelendi. İkinci bölümde, hukukta yasama konusu ele alınarak pozitif hukuk ve İslâm hukukuna göre yasama kavramı, yetkisi ve yasamanın kaynaklan karşılaştırmalı olarak incelendi. Üçüncü bölümde ise dört halife dönemi açısından yasama kavramı, yetkisi ve yasama kaynaklan incelendikten sonra yasama örnekleri ile konu tamamlandı. Sonuç olarak İslâm hukuk düşüncesine göre, mutlak manada hüküm koyucu/şâri' Allah olmakla birlikte yasama bir devlet işi olduğu için bunda beşer faktörü önemli rol üstlenmektedir."
