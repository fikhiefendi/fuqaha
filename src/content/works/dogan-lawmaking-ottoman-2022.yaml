abstract: "Fetvalar Osmanlı hukuk normlarının oluşmasında büyük rol oynamıştır. Ancak bugüne kadar Osmanlı tarihçileri Osmanlı fetvasıyla ilgili incelemelerini büyük ölçüde baş müftülerin (şeyhülislam) fetvalarıyla sınırlandırmış, taşra müftülerinin (kenar müftüsü) rolü ve fetvalarını ihmal etmişlerdir. Bu müftüler, imparatorluğun sınırında yasal normların oluşumunda nasıl bir rol oynadılar? Merkezi otorite ve yerel aktörlerle nasıl ilişki kurdular? Fetvaları hangi işlevleri yerine getirdi? Hukuk oluşum sürecinde rolleri neydi? Kendi otoritelerini nasıl kurmuşlardı? Bu tezde, bu soruları bir Osmanlı imparatorluk alim-bürokratı olan Ali Akkirmani'nin fetvaları üzerinden soracağım. Akkirmani, 1591-92'de memleketi ve bir sınır şehri olan Akkirman'da müderrislik ve müftülük görevine atanmadan önce eğitimini İstanbul'da Valide Sultan Medresesi'nde aldı. 1618'deki ölümüne kadar yaklaşık otuz yıl bu görevi sürdürdü. Müftü olarak, sıradan insanlar, ileri gelenler, resmi görevliler, kadılar vb. insanların sorularına verdiği fetvalar, ölümünden sonra 1630 yılında Fetâvâ-yı Akkirmani başlığıyla derlendi. Bu çalışmada, Akkirmani'nin kendi yerel bağları, hukuki ve emperyal otoritesini güçlendirmek ve kendisini Osmanlı sınırında hukuk normlarının oluşumunda kritik bir rol sahibi olarak konumlandırmak için şeriat ve imparatorluk hukukunu nasıl yorumladığını ve uyarladığını Kitâbü's-Siyer bölümü başta olmak üzere farklı konuları merkeze alarak cevaplamaya çalışıyorum."
