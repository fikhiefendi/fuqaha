abstract: "Burhaneddin İbni Maze el-Buhâri'ye ait“Tetimmetü'l Fetâva”isimli kitabın Taharet kitabının başından, Nikah kitabının sonuna kadarki olan bölümünün inceleme ve araştırması; Bu kitap Hanefi mezhebinde fetva kitapları arasında sayılır. Çünkü bu kitap metinler, şerhler ve fetvalar bölümlerine ayrılmıştır. Bu kitabında Burhaneddin İbni Maze üstadı olan Es-Sadru'ş Şehid'in“El-fetava es-Suğra”adlı kitabını tamamladı ve bir kısım yeni meseleler ekledi. Hanefi mezhebinde fetva kitsplarının özel bir önemi vardır. Çünkü onlardaki bazı meseleri metin ve şerh kitaplarında bulamazsın. Bu kitaplar metin ve şerhlerde bir konuyla ilgili nir hüküm bulunmadığı takdirde konunun hükmünün bilinmesi için önemli bir kaynak olmasının yanısıra aynı zamanda müelliflerinin günlük yaşantısında metin ve şerh kiaplarının naslarının uygulanış biçimini görmekteyiz. Tetimmetü'l Fetâva isimli kitabımız önemini iki önemli kaynaktan beslenmekten almaktadır; İlki aslıda olan el-Fetâva's Suğra...Çünkü bu kitap, mezhep imamlarının itimat ve nakil ettiği aynı zamanda da otorite kabul ettiği fetva kitaplarının en meşhurlarındandır. Beslendiği ikinci kaynak; Bu kitabın müellifi olan Burhaneddin İbn-i Maze el-Buhari... Bu imam ilk dönem mezhep imamlarındandır. Kitapları malûm olmakla, kendisinin geniş müktesebatına delâlet eden, eski ve yeni dönemde ulemanın nakil ve istifade ettiği önemli eserlerdir. En önemli büyük ve ma'ruf olan eseri El-Muhiti'l Burhanîdir. Tetimmetü'l Fetâva adlı kitabı önemine rağmen daha önce herhangi bir tahkik incelemesi görmemiştir. Onun fayda ve özelliklerine misal teşkil etsin diye, onun bir bölümünü tahkik Bu tezdeki çalışmamız iki kısımdan oluşacak: İnceleme ve tahkik... İncelemesi kısmında elimden geldiği kadarıyla ulaştığım kaynaklardan elde ettiğim bilgilerle müellifin kişiliğinden, hayatından ve mezhepteki fıkıh derecesinden bahsedeceğim. Aynı şekilde bu kitap, önemi, aslı, kaynakları, diğer mezhep kitapları arasındaki özelliği; müellifin bu kitapta takip ettiği yöntem, bu kitabın diğer mezhep kitapları arasındaki özelliği, ulaştığım elyazması nüshalar ve bu nüshaların özellikleri; bu konular hakkında genel olarak; başkasını değilde kendisini esas aldığım elyazmaları ve vasıfları hakkında ayrıntılı olarak ve tahkikte takip ettiğim yöntem hakkında bahsedeceğim. Tahkik kısmında ise kendisine ulaştığım en önemli elyazması nüshaları esas alarak, tahkik ilminin kurallarını gözeterek yani nüshaların arası önemli farkları belirterek kitabın ibarelerini müellifin yazdığı şekilde aslına uygun olarak ispat etmeye, önemli şahsiyetlerin hayatı hakkında bilgi vermeye, sözleri söyleyenine ve nakilleri kaynaklarına ilintilendirmeye, ondaki ayet ve hadislerin tahricini yapmaya ve kapalı ve problemli olan yerleri açıklamaya çalışacağım."
