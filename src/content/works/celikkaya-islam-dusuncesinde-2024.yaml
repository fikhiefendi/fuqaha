abstract: "İslam düşüncesinde bilhassa modern dönemde yoğun olarak gündeme gelen dini yenileme olgusu, tecdid, ıslah, ihya gibi çeşitli kavramlarla ifade edilmektedir. Bu kavramlardan en yaygın ve erken dönem kullanımı bu konuda hadis rivayeti bulunmasından hareketle tecdid kavramıdır. Bu çalışmada tecdid kavramı özelinde İslam düşüncesinde ortaya çıkan dini yenileme anlayışları incelenmektedir. Araştırmada, etimoloji ve semantik biliminin yardımıyla tecdid kavramı tanımlanmakta ve erken dönemden itibaren İslam düşüncesindeki anlaşılma biçimleri tespit edilmektedir. Tecdid rivayetinin; dolayısıyla kavramın dini yenileme bağlamında erken dönemde özellikle Şafiî mezhebi çevresinde gündeme alınması ve 'sünnetlerin ihyası bid'atlerin ortadan kaldırılması' olarak ifade edilmesi, meselenin mezhepler tarihi açısından değerlendirmesini gerektirmektedir. Buradan hareketle çalışmada, Şâfiîlik, Hanbelîlik ve Mâlikîlik çerçevesinde geleneksel-muhafazakâr din anlayışı; Hanefîlik ve Mu'tezile mezhebi örnekleriyle de akılcı-hadarî din anlayışı tetkik edilmektedir. Dinin yenilenmesi bağlamında tecdid kavramından hareketle klasik dönemde gelenekçi-muhafazakâr din anlayışının yaklaşımı tespit edilebilmektedir. Akılcı Hadarî din anlayışının kavram özelinde meseleye yaklaşımının örneği ise modernleşme dönemi olan Osmanlı Devleti'nin Tanzimat döneminde görülmektedir. Dinin ve devletin Tanzimat esaslarının tatbik edilmesiyle tecdid edileceği görüşündeki üst düzey ulema ve devlet erkanının yaklaşımı, kavramın dini yenileme bağlamında modernleşme döneminde Hanefî-Mâtürîdî çevrede anlaşılma biçiminin bir örneğini sunmaktadır."
