abstract: "Banka, nakit ihtiyaçları göz önünde bulundurarak, tasarruf sahiplerinden fon toplayan ve toplanan bu fonları gerçek ve tüzel kişilere kısa ve uzun vadeli kredi olarak kullandıran, kar hedefiyle çalışmalarını sürdüren finansal aracı niteliğindeki kurumlardır. Katılım bankacılığı ülkemizde 1985 yılında ilk olarak Özel Finans Kuruluşları adıyla faaliyete başlamıştır. 2005 yılında yapılan düzenlemeyle“Katılım Bankası”unvanını almıştır. Dünya'da ve ülkemizde gelişmekte olan katılım bankaları, faiz hassasiyeti olan insanların tasarruflarını ekonomiye kazandırılması amacıyla klasik banka hesaplarından farklı olarak çeşitli hukuki niteliklere sahip, saklama ve değerlendirme konusunda alternatif , cari hesaplar ve katılma hesapları ile faaliyet yürüten kurumlardır. Katılım bankalarını, konvansiyonel bankalardan ayıran en önemli özellik katılma hesapları yoluyla fon toplama ve toplanan bu fonların ekonomiye kazandırılma yöntemleridir. Ticarete konu teşkil eden bankacılık faaliyetleri sonucu mudilerine belli bir getiri oranı taahhüt etmeden, kâr ya da zarar esas alınarak mudilerin katılma hesaplarına yansıtılması katılım bankalarıyla konvansiyonel bankaları birbirinden ayıran bir başka özelliktir. Bu çalışmada, katılma hesabının işleyişi, özellikleri ve hukuki niteliği ele alınmıştır. Dört bölümden oluşan çalışmanın birinci bölümünde genel olarak banka kavramı, ikinci bölümünde katılım bankacılığı uygulamaları ve katılma hesabı irdelenmiştir. Çalışmanın üçüncü bölümünde katılma hesabının işleyişi, dördüncü bölümünde ise katılma hesaplarının hukuki niteliği analiz edilmiş, ayrıca katılma hesabı sözleşmesinin hukuki mahiyeti itibariyle mevduat sözleşmesi, yatırım fonu sözleşmesi, vedia sözleşmesi, karz sözleşmesi ve ariyet sözleşmesi ile karşılaştırılması yapılmıştır. Bu yapılırken ilk üç bölümdeki kuramsal bilgilerden ve konuya ilişkin yargı kararlarından yararlanılmıştır."
