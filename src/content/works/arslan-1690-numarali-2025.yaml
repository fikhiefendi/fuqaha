abstract: "Şer'iyye Sicilleri, Osmanlı İmparatorluğu'nun bölgesel tarih araştırmalarında, yönetsel, sosyal ve ekonomik yapıyı anlamada önemli kaynaklar arasında yer almaktadır. Bu çalışmada, Rodoscuk'a ait 1690 numaralı Şer'iyye Sicili üzerinde, Hicri 1194-1195 (Miladi 1780-1781) yıllarını kapsayan veriler ışığında bir analiz yapılmıştır. Elde edilen bulgular, 18. yüzyılda Rodosçuk'taki gündelik yaşamı derinlemesine incelemeyi ve söz konusu tarihsel veriler ışığında, dönemin sosyal ve ekonomik yapısını güncel bir perspektife taşıyarak değerlendirmeyi amaçlamaktadır. Gündelik yaşamın çeşitli boyutları, kamusal alanları temsil eden şehir, mahalle, çarşı gibi unsurlar ile özel alanı ifade eden ev gibi mekanlar üzerinden ele alınmıştır. Bu mekânların fiziksel yapıları ve kullanım biçimleri detaylı bir şekilde incelenmiş, söz konusu mekânların bireylerin sosyal pratikleriyle ilişkisi çeşitli açılardan değerlendirilmiştir. Elde edilen bulgular, Rodosçuk Kazası'nın, Osmanlı şehri kimliğini taşıdığına ve bu kimliğin gündelik yaşam pratiklerine nasıl yansıdığına dair önemli ipuçları sunmaktadır. Ayrıca, Rodosçuk Mahkemesi'nin çalışma düzeni, günlük iş hacmi, gündelik yaşamın temposu ve insan ilişkilerinin, deftere yansıyan belgeler aracılığıyla daha anlaşılır hale geldiği tespit edilmiştir. Bu bağlamda, mahkemelerin sadece hukuki değil, aynı zamanda toplumsal ve ekonomik yaşamı şekillendiren önemli kurumlar oldukları ortaya konmuştur. Çalışmanın bir diğer önemli boyutu, gündelik hayattaki aile yapısı, ekonomik durum, kullanılan eşyalar ve şehirdeki ekonomik faaliyetler üzerine yapılan detaylı incelemelerdir. Bu unsurlar, bölgenin sosyal yapısını ve günlük yaşamın dinamiklerini anlamada anahtar rol oynamaktadır. Sonuç olarak, 1690 numaralı Rodosçuk Şer'iyye Sicili, bölgenin sosyal, kültürel ve ekonomik yapısına dair önemli veriler sunmakta ve bu veriler doğrultusunda, Rodoscuk Kazası üzerine kapsamlı bir değerlendirme yapılmıştır. Çalışma hem dönemin yerel yönetim yapısını hem de toplumun genel yaşam biçimini daha iyi anlamamıza katkı sağlamaktadır."
