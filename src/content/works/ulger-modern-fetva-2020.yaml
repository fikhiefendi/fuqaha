abstract: "Modern tıbbın sağladığı geniş imkanlar insan tasavvurunun çok ötesine ulaşmış ve tıbbî alanda birçok yeni uygulama ortaya çıkmıştır. Bu durum, beraberinde birçok dini ve etik tartışmayı ve cevap bekleyen meseleyi gündeme getirmiştir. Modern teknolojiyle ortaya çıkan ve insan bedeni üzerinde gerçekleşen tıbbî uygulamaların fıkhî ve etik boyutları ise sürekli olarak tartışılmaktadır. Bu tartışmaları gündemine alanlardan biri de modern fetva kurumlarıdır. Günümüzdeki modern fetva kurumları karmaşık olan biyoetik meselelere çözümler üretmek adına birtakım çalışmalar yapmaktadırlar. Bu fetva kurumlarının en önemlilerinden biri de Mecmau'l-Fıkhî'l İslamî ed-Düvelî'dir. Birçok konuda fetvası bulunan Mecmau'l-Fıkhî'l İslamî ed-Düvelî'nin tıbbî fetvaları bu çalışmanın temelini oluşturmakta ve çalışma boyunca bahsi geçen fetva kurumunun bugüne kadar vermiş olduğu tıbbî fetvaların fıkhî, tıbbî ve etik açılardan tahlili yapılmıştır. Çalışmada öncelikli olarak mezkûr fetva kurumunun tıbbî kararları konularına göre çeşitli başlıklar altında tasnif edilmiştir. Sonrasında ise kararların farklı açılardan tahlili yapılmış ve son olarak Mecmau'l-Fıkhî'l İslamî ed-Düvelî'nin tıbbî fetvalarında kullandığı fıkhî yöntem ve prensipler ile fetva verirken nasıl bir yöntem takip ettiği ele alınmıştır."
