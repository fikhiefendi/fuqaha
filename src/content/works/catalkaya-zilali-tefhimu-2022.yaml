abstract: "Bu çalışmada ictimaî tefsir türünün iki önemli örneği olan Fî Zılâli'l-Kur'ân ve Tefhîmü'l-Kur'ân tefsirleri başlıca Kur'ân ilimleri konuları açısından mukayese edilmiştir. Birinci bölümde asıl konuya hazırlık kapsamında Kur'ân ilimleri kavramı, kavramın doğuşu ve tarihi süreç gibi başlıklara yer verilmiştir. İkinci bölümde ise Fî Zılâli'l-Kur'ân ve Tefhîmü'l-Kur'ân müellifleri olan Seyyid Kutub ve Mevdûdî'nin hayatları ve eserlerine yer verilmiştir. Bu bilgiler müfessirlerin yaşadığı dönemin tefsirlerine ne ölçüde etki ettiğinin görülmesine olanak sağlayacaktır. Çalışmanın üçüncü bölümünde yer alan mukayese kapsamında müfessirlerin tefsirlerinde bu ilimlere hangi ölçüde yer verdiklerinin, ictimaî tefsir yönteminin Kur'ân ilimlerinin eserlerdeki varlığını hangi yönlerden etkilediğinin, tefsirlerin birbirleriyle ve klasik tefsirlerle benzer veya farklı yönlerinin ortaya çıkarılması amaçlanmıştır."
