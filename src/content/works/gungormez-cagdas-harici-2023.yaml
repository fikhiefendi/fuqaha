abstract: "İslam düşünce tarihinde 'selef' kavramı, geçmişte ve günümüzde en çok kullanılan, gerek Müslüman gerekse Batılı düşünürler tarafından sık sık gündem edilen ve üzerinde araştırmalar yapılan kavramlar arasında yerini almıştır. Özellikle günümüzde kimi coğrafyalarda meydana gelen katliam ve vahşet senaryolarının katil başrolünü oynayanların kendilerini 'selefi' diye lanse etmeleri, hem bu güruhun hem de bunların kendilerine model kabul ettikleri Selefiliğin iyi anlaşılmasını iktiza etmektedir. Yapı olarak Haricilere ciddi manada benzerlik gösteren ve 'tekfir, bidat' gibi kavramları kendilerine zırh gibi kullanan günümüz selefçilerinin, kendi fikir ve düşüncelerini selefe yani İslam'ın ilk üç nesline dayandırdığı görülmektedir. Bu selefi gruplar her ne kadar selef ile aynı fikre sahip olduklarını dillendirseler de, yaptığı icraatlar onların Hariciliğin müdavimi olduğunu gözler önüne sermektedir. İlk dönem İslam dünyasının 'asi çocuğu' olan Hariciler, 'hüküm ancak Allah'ındır' sloganıyla hareket edip bu slogan etrafında toplanmışlardır. Görünüşte bir fikir ekseninde birlenmiş olan bu zümre, esasen bir 'kabile ittifakı hareketi' hüviyetindedirler. Onların yetiştikleri çevre ve kültür, taassubun, asabiyetin, katılığın zirvede olduğu; kendileri gibi inanmayan görüşlerin içerisinde yer almayan, kendileriyle birlikte hareket etmeyen herkesi düşman gören bir çevre idi. Tabiri caizse, onların kan davalılarına yaptıkları muamele ile kendi fikir ve zihniyetlerinde olmayanlara yaptıkları muamele aynıydı. Beyinlerini her türlü görüşe kapatan bu kişilerin, beyinlerine kazıdıkları tek şey ise; 'tek ve mutlak hak biziz' görüşü idi. İşte bu ve benzeri görüşler, günümüz dünyasını kargaşaya, karışıklığa ve keşmekeşe sokan, kan ve şiddetin içine atan etmenlerdir. Bundan dolayıdır ki, mezkûr fırka Batılılar tarafından 'Müslümanların anarşistleri' olarak adlandırılmaktadır. Kendilerini hakikatin kendisi bilen ve kendi görüşlerinin zıddını İslam dışı, sapık, kâfir, müşrik diye isimlendiren her türlü mezhepçi, meşrepçi, ırkçı hareketlerin temelinde Hariciliğin kokusunu almak çok da zor olmasa gerek. Özellikle aktüelimizde sık sık kulaklarımızı çınlatan El-Kaide ve IŞİD gibi selefçi gruplar, Hariciliğin mücessem bir timsalini teşkil etmektedirler. Çalışmamız, İslam dininin teşekkülünün ilk asrından günümüze kadar var olan ve her zaman da dillendirilen bu sorunu incelemek olacaktır. Bizim 'Çağdaş Harici Akımlar: El-Kaide ve IŞİD Örneği' adını verdiğimiz bu araştırmamız üç bölümden oluşmaktadır. Birinci bölümde, araştırmamızda ele aldığımız konunun kavramsal çerçevesi ve tarihi arka planı ele alınacaktır. Özellikle 'selef' ve 'harici' kavramlarının iyi anlaşılması ve bunların tarihi serüveninin iyi bilinip değerlendirilmesi bizi hedefimize yaklaştıracaktır. İkinci bölümde, çalışmada ele alınacak olan grupların isimlendirilmesi problemi üzerinde durulacaktır. Böylece araştırma konusu olan grup ve fırkaların isimlendirilme menşei, hasımları ve taraftarları tarafından yapılan isimlendirilmelerin ne şekilde olduğu öğrenilmiş olacaktır. Üçüncü bölümde ise, tarihi selefi-harici akımların fikri yapıları ile çağdaş harici selefi akımların (El-Kaide, IŞİD vb. grupların) fikri yapılarının nasıl olduğu incelenip bunların mukayesesi yapılacaktır. Günümüz selefçiliği ile selefin benzerliklerinin veya farklılıklarının tespiti için, o dönem ile günümüz dönemini, selefin zihniyeti ile günümüz selefçilerinin zihniyeti karşılaştırılmalıdır. Böylece bunlar arasındaki benzerlikler ve ayrılıklar saptanabilecektir. Bu grupların fikri yapılarının iyi bir şekilde incelenebilmesi için sadr-ı İslam'da vuku bulan ve büyük bir ayrılma-ayrışmayı meydana getiren kimi olayları, Haricileri ve Selefiliği ele almamız gerekmektedir. İşte bu eksende yapacağımız çalışma, günümüzde kendilerini selefin takipçileri olarak gören 'harici-Selefçi-Vehhabi' grupların fikri yapılarının incelenmesi ve kendilerini dayandırdıkları selefin fikri yapısı ile mukayese edilmesini ele alacaktır."
