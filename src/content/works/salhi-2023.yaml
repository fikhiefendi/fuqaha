abstract: "Bu araştırmada Bedreddîn el-Aynî el-Hanefî'nin (ö. 855) el-Mukaddimetü's Sûdeniyye fi'l-ahkâmi'd-dîniyye isimli eserinin tahkik ve analizi hedeflenmektedir. Aynî kitabı, arkadaşı nâibu'ş-Şâm el-Emîr Sûdûn et-Tarnatây'a (ö. 794) hediye edeceği için esere farkı bir önem vermiştir. Kitabın kıymeti buradan kaynaklanmaktadır. Eser müellifin dua, zikir ve fıkhi hükümler konusunda Hanefi fıkhına dair yazdığı eserlerin özeti mahiyetindedir. Tahâretle başlayıp, hadler bölümüyle biten eser, 10 bölümden oluşmuştur. Araştırmanın hedeflerini gerçekleştirmek için Aynî'nin şahsi ve ilmi hayatı anlatılırken betimleyici tarihsel metot kullanılmıştır. Metnin yazılması, harekelenmesi, nakledilen görüşlerin asli kaynaklardaki yerlerinin gösterilmesinde tahkik ve talik yöntemi tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Aynî muhtasar olan bu eserde Ebû Hanîfe, Ebû Yusuf, Şeybânî, Tahâvî gibi ilk dönem Hanefi alimlerinin görüşlerinin çoğuna değinmiştir. Müftâ bih olan fetvayı vermiş, onun dışındaki görüşleri ihmal etmiştir. Yapılan nakillerin ana kaynaklardaki yerleri gösterilmemiştir.“Bu sahihtir”,“Bu konudaki en sahîh olan görüş budur”gibi ifadelerle naklettiği rivayetler hakkında sıhhat değerlendirmesi yapmıştır. Aynı şekilde zayıf olan nakillere değinmiş, rivayetler arasında tercih yapmıştır. Bu da onun ilmi seviyesini gösteren bir husustur. Aynî, hadis, tefsir, fıkıh ve diğer ilimlerde rusuh sahibi bir alimdir. Tercihleri ve istidlallerinde Hanefi mezhebine bağlılığı açık bir şekilde görülmektedir. Ezberlemesi kolay olması için muhtasar bir eser yazdığı için fıkıh kitaplarında uygulandığı şekliyle karşılaştırma yöntemini kullanmamıştır. Ayrıca kitap, yazıldığı dönemde geniş bir üne kavuşmuştur. Belki de bunun nedeni, müellifin, devrinin âlimleri arasında sahip olduğu yüksek mevki ve aynı zamanda yürüttüğü dinî ve idarî mevkilerle diğerlerine karşı üstünlüğüdür. Özetle kitap, müelilfin geniş kültürü, ilminin çeşitliliği ve bolluğunu göstermenin yanında İmam Ebu Hanife ve Hanefi mezhebinin imamlarının görüşlerinin yer aldığı bir fıkıh ansiklopedisi niteliğindedir."
