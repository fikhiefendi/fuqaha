abstract: "Günümüz çalışma hayatında en önemli konuların başında yöneticiye duyulan güven oluşturmaktadır. Çalışma hayatında yöneticiye karşı duyulan güven; örgütsel bağlılık ve çalışanın verim artırmaktadır. Etik liderlik modeli ve örgütsel bağlılık arasında güçlü bir pozitif bağ mevcuttur. Katılım Bankacılığı, kurumun ve çalışanların etik değerlere uygun bir şekilde faaliyet gösterdiği, kar payı prensiplerine dayalı bir bankacılık modelidir. Bu modelde, işletmenin yöneticileri ve çalışanları dürüstlük, şeffaflık ve adalet gibi etik ilkeleri benimserler. Örgütsel bağlılık ise, çalışanların işletmeye duygusal ve psikolojik olarak bağlı olmalarını ifade eder. Kar payı prensiplerine uygun olarak yönetilen bir katılım bankacılığı modeli, çalışanların işlerine ve kuruma olan bağlılıklarını artırır. Bu da müşteri memnuniyetinin uzun vadeli olarak sağlanmasına ve rekabet avantajının elde edilmesine katkı sağlar. Araştırmanın amacı etik liderliğin örgütsel bağlılık üzerindeki etkisini incelemektir. Bu araştırma, etik liderliğin örgütsel bağlılık algısı üzerinde bir rol oynayıp oynamadığını belirlemeyi hedeflemektedir. Araştırmanın evrenini bir kamu bankasında çalışan kişiler oluşturmaktadır. Toplam çalışan sayısı 2776 kişidir. Araştırmanın örneklemi 324 kişi olarak hesap edilmiştir. Katılımcıların cinsiyet ve unvan durumuna göre tabakalandırma örneklem yapılmıştır. Ankete toplam 338 kişi katılmıştır. Araştırma, Nisan-Mayıs 2024 döneminde, Türkiye'de bir kamu katılım bankasında gerçekleştirilmiştir. Çalışmada etik liderlik ile örgütsel bağlılık arasında, pozitif yönde bir ilişki olduğu saptanmıştır. Bu çalışma, katılım bankacılığı alanında etik liderliğin önemini vurgulayarak, kurum içindeki etik değerlere olan bağlılığın ve çalışanların işletmeye duygusal bağlılığının artırılmasının önemini ortaya koymaktadır."
