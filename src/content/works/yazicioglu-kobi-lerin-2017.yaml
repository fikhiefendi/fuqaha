abstract: "Günümüzde ülke ekonomisinde küçük ve orta ölçekli işletmelere karşı bakış açısında olumlu yönde önemli gelişmeler yaşanmaktadır. KOBİ'ler ekonominin kamburu olarak görülürken, zamanla ekonominin omurgası oldukları fikri yayılmaya başlamıştır. Bu noktaya gelmedeki esas başarı sebebi KOBİ'lerin ekonomik, sosyal ve politik yaşamda ülkeye getirdikleri dengedir. Ekonomik sistem içerisinde KOBİ'lerin oranı oldukça yüksek olup, istihdamdaki oranı her geçen gün artmaktadır. Ekonomideki istikrarsızlıkların olumsuzluklarını ve kriz dönemlerini daha kolay atlatmayı başarabilen KOBİ'ler, bu yapılarıyla ülke ekonomisinde dinamikliği temsil etmeye başlamışlardır. KOBİ'lerin başarısı ülkemizin ekonomik gelişmesini sağlayacak, politikaya istikrar getirecek ve sosyal yaşama sağlam temeller kuracaktır. Dolayısıyla bu kesimin güçlenerek varlığını devam ettirmesi toplumun huzuru, refahı ve geleceği açısından büyük önem arz etmektedir. Türkiye açısından önemi bu kadar ciddi boyutta olan KOBİ'lerin istikrarlı bir başarıya sahip olmaları, yeni girişimlerle sayılarının arttırılması ve zor dönemlerinde onlara destek olabilmek için onları finansal olarak desteklemek gerekmektedir. Küçük ve orta ölçekli işletmelerin finansal sorunlarına konvansiyonel ve İslâmi finans fon kullandırma yöntemleriyle çözüm aranan bu çalışmada, fon kullandırma yöntemleri İslâmi ve konvansiyonel olarak mukayese edilmiştir. Bu bağlamda bu çalışmanın amacı; KOBİ'lerin finansal sorunlarının çözümünde fon kullandırma yöntemlerini konvansiyonel ve İslâmi finans açısından tanımlayarak, onları mukayese edip işletmelere ışık tutabilmektir."
