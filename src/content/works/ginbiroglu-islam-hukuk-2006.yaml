abstract: "İslam Hukuk metodolojisinde âhâd haberlerle ilgili tartışmaların temeli âhâd haberlerin ilim veamel gerektirip gerektirmemesine dayanır. Âhâd haberin kabul edilmesine dair Kur'an'dan,Sünnetten, Sahabe ve Tabiûnin uygulamalarından deliller vardır. Bu konuda en önemli delilsahabe ve tabiûnin icmasıdır. Konu ile ilgili tartışmalar ilk üç nesilden sonra başlamıştır.Alimler, âhâd haberleri kendilerine has metotlarla değerlendirmişlerdir.Hanefi Mezhebinin önde gelen fakihlerinden Cessâs, eserinde âhâd haberle ilgili meseleleriuzunca tartışmış, şartlarına uyan âhâd haberlerle amel edilmesi gerektiğini söylemiştir.Ortaya konulan şartlar; Kur'an'a ve sabit sünnete arz, umumu ilgilendirmemesi, rivayetin aksineamel edilmemesi ve Râvûnin durumunun değerlendirilmesidir. Râvûyi değerlendirirken asıl olanonun adaletli zabt sahibi, fıkıh ve anlayışla bilinen kimse olmalıdır. Sahabe ve Tabiûn tarafındantenkit edilmemiş olanlarla tereddütsüz amel edilmiş, onlar tarafından tenkit edilenler de kıyas veiçtihada tabi tutulmuşlardır. Cessâs, yaşadığı çağın ilmi tartışmalarını aktarmış, kendisinin vehocalarının görüşlerini akli ve naklû delillerle ispat etmeye çalışmıştır."
