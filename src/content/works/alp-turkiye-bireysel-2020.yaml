abstract: "Bankacılığın izlerine ilkçağlarda rastlanmakla birlikte 1300'lü yıllardan itibaren gelişimini sürdürmüş ve 20. yy'da Amerika Merkez Bankası'nın kurulması ile modern bankacılık sistemine geçiş yapılmıştır. Ekonomik sistemin gereklerine göre gelişen bankacılık sektöründe günümüzde konvansiyonel bankacılık dışında farklı bankacılık türleri de mevcuttur ve her bir bankacılık türü giderek daha etkin bir şekilde faaliyetine devam etmektedir. Türkiye'de 2001 Bankacılık Krizi'nden sonra bankacılık sektöründe yapılan düzenlemelerle sağlam bir bankacılık sistemi oluşturulmuştur. Bu çalışmada bireylerin konvansiyonel bankacılık ile katılım bankacılığını tercih etme nedenleri üzerine bir araştırma yapılmaktadır. Örneklem sayısının yeterli olup olmadığı ve verilerin faktör analizine uygun olup olmadığı KMO katsayısı ve Bartlett Sphericity testi SPSS programında yapılarak değerlendirilmiş, elde edilen sonuçlar doğrultusunda gerekli görülen ifadeler çıkarılmıştır. Ön test sonrasında oluşturulan çalışma, Google formlar aracılığı ile katılımcılara uygulanmış ve elde edilen veriler SPSS programı ile analiz edilerek geçerlilik ve güvenirlik koşullarının sağlandığı tespit edilmiştir. Ayrıca ölçekte yer alan ifadelere açıklayıcı faktör analiz yapılmış ve dört faktörlü bir sonuç elde edilmiştir. Elde edilen bu alt faktörler için gerekli olan geçerlilik ve güvenilirlik testleri ile örneklem grupları arasındaki farlılıkların anlamlı olup olmadıklarını tespit edebilmek amacıyla normallik, basıklık – çarpıklık, t testleri ve Anova testleri yapılmıştır. Yapılan bu çalışmadan elde edilen sonuçlar doğrultusunda bankaların müşteri portföylerini oluşturmada ne gibi yollar izlemeleri ve var olan müşterilerini ellerinde tutabilmek için nelere dikkat etmeleri gerektiği gibi soruların cevaplarının yanı sıra konvansiyonel bankacılık ile katılım bankacılığı tercih sebepleri arasındaki farlılıkların neler olduğu vb. soruların cevaplarına ulaşılmaya çalışılmıştır."
