abstract: "Bu dönemde bankacılık sektöründe bankacılık faaliyetlerinin etkinliği sorusu önemli bir yer tutmaktadır. Son yirmi yılda İslami bankacılık, birçok Arap ve Müslüman ülkede ve dünyanın diğer ülkelerinde önemli gelişmeler görmüş ve yaygınlaştırmıştır ve bu gelişme, küresel ekonomiye açılma, sermaye hareketinin serbestleşmesi gibi birçok faktörden kaynaklanmaktadır. ve yapısal reformlar. Finansal sistemin ve piyasaların genel entegrasyonu, bu kurumların varlıklarının, mevduatlarının ve kârlarının büyümesine ve yüksek düzeyine yansır. Buna rağmen, İslami bankalar hala birçok zorluk ve zorlukla karşı karşıyadır ve belki de en önemli zorluklar, İslami bankacılık finansal ürünleri sunan İslami pencereler açan geleneksel bankalardır ve bu bankaların bankacılık sektöründe uzun bir geçmişe ve yapabileceklerinden daha fazla deneyime sahiptir. Bu sayede bankacılık işlemleri daha verimli hale gelmektedir. Zorluğu çözmeye yönelik en önemli pratik stratejilerden biri, İslami bankaların hizmet sağlamadaki yüksek etkinliğidir ve artan rekabet, bankacılık sektörünün etkinliğini değerlendirmeye ve fonksiyonel bölümleri belirlemeye yardımcı olan bilgilere ihtiyaç doğurmaktadır. Veri Ortamı Analizi (VZA) yöntemi de dahil olmak üzere bir dizi yöntem kullanılabilir. Çalışmanın amacı, üç ülkedeki (Irak, Ürdün, Suudi Arabistan) İslami bankalardan oluşan bir örneklemin (2011-2020) dönemindeki etkinliğini veri zarflama yöntemi (VZA) kullanarak ölçmektir. Irak'ta İslami bankacılığın yeni deneyimi ile ilgili olarak, Irak'taki İslami bankalar hem metodolojik hem de uygulamalı çerçevelerde zorluk ve engellerle karşılaşmakta ve bu tür bankaların temel ilkeleri gerektiği gibi uygulanmamaktadır. 2011-2020 dönemi için çalışmanın amaçlarına ulaşmak için (VZA) uygulanmış ve materyal analiz edilmiş ve veri zarfının (VZA) ikinci baskısı uygulanarak sonuçlar elde edilmiştir. Çalışmanın sonuçları, sabit hacimli getiri modeline göre (Al-Bilad, Jordanian Islamic, Jordanian International, Irak Ulusal İslami) dört bankanın tam etkinliğe ulaştığını göstermiştir. (2011-2020) döneminde beş banka değişken hacimli getiri modelinden tam verim elde etmiştir (Al-Bilad, Al-Jazeera, Urdun islam, Urdun Ulusal, Irak islami ulusal). Çalışma, İslami bankacılık deneyiminin yeni olması, Irak'taki güvenlik ve siyasi koşullar ve Irak bankalarının çoğunun küçük olması nedeniyle, örnek alınan Irak bankalarının yarısının verimsiz olduğunu ve optimal mali büyüklüklerine ulaşmadığını ortaya koydu. bu nedenle bankaların çoğu başkent Bağdat'ta yoğunlaşmış ve taşrada çok az şubesi olması faaliyetlerini olumsuz etkilemiştir. Çalışmanın en önemli tavsiyelerinden biri, verimsiz bankaların kişisel becerilerini geliştirmek ve verimliliği artırmak için yoğun eğitimler yapmaları ve eğitim yoluyla verimliliklerini artırmaları gerektiğidir. İslami bankaların zorlu rekabet karşısında ekonomik kalkınmayı sağlayabilmeleri için tam hizmet vermeleri ve tüm sektörlerin finansmanına katılmaları gerekmektedir."
