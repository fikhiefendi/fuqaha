abstract: "Tazir suçları İslam ceza hukukunda had, kısas ve diyeti gerektiren suçların dışındaki suçları kapsamaktadır. Tazir suçları Kitap, Sünnet ve İcma ile sabittir. Kısaca tazir suçları kanun koyucu tarafından bir şekilde yasaklanmış fakat karşılığında caza takdir edilmemiş suçlardır. Bu çalışmada; çok geniş ve dağınık olan tazir suçları, İslam dininin korumayı hedeflediği beş temel esas dikkate alınarak, altı bölüm halinde incelenmiştir. Ancak birinci bölüm ta'zir kavramına ayrılmıştır. Giriş bölümünde tazir dışı kalan hadler hakkında ve tezin içeriği konusunda kısaca bilgi verilmiştir. Birinci bölümde ta'zir kavramı ve ta'zirin genel özellikleri ile ilgili bilgiler verilmiştir. Kalan beş bölümde ise; İslam'ın korumayı hedeflediği can, mal, nesil, din ve toplumun huzuruna yönelen suçları ve bunların suç olma nedenleri ile delilleri kısa kısa ortaya konulmuştur. Burada bütün tazir suçları tam olarak ortaya konulamamıştır. Çünkü tazir suçları çok geniş bir alanı kapsamaktadır. Bundan dolayı bütün tazir suçlarının tek tek sayılması mümkün olmamıştır. Ancak mevcut olanın yeni ortaya çıkana kıyaslanabilineceğine işaret edilmeye çalışılmıştır. Sonuç olarak tazir suçları önceki ceza hukukumuzun önemli bir bölümünü kapsamakla beraber İslam Dini'nin yasaklamış olduğu davranışları içine almaktadır. Bundan dolayı bunların bilinmesinin dini ve sosyal yönden gerekli olduğu düşünülmüştür."
