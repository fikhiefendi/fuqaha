abstract: "Musul, el-Cezire bölgesinin merkezi konumundadır. Sadece coğrafi özelliği ile değil, kültür ve medeniyeti temsil eden gelişmelerin yaşandığı bir yer olarak da dikkat çeker. Çünkü bulunduğu konum, isminden de anlaşılacağı üzere“kavşak”noktadadır. Türkiye'den Irak topraklarına geçen Dicle Nehri'nin yolu Musul'dan geçmektedir. Su, genelde bölgeye, özelde Musul'a hayat vermektedir. Coğrafi konum itibariyle kavşak noktasında olan Musul, ilmi olarak yoğunluk yaşayan Şam ile Bağdat arasında bir geçiş noktasıdır. Bu bağlamda rihle yapanların uğradığı bir yer olmuştur. Diğer ilimlerde olduğu gibi, hadis ilminde de kendi muhaddislerini yetiştirmiş ve hadis taliplerini ağırlamıştır. Şehrin önde gelen muhaddisleri arasında, Ömer b. Bedr el-Mevsılî, Ebu Ya'la el-Mevsılî, İbnü'l-Esîr; bir müddet orada kalanlar açısından İbnü'l-Cevzî ve İbnü's-Salah bulunmaktadır. Tez konumuz olan Ömer b. Bedr el-Mevsılî, el-Cezire bölgesinde doğmuş, büyümüş ve eğitimini almış bir muhaddistir. Özellikle uydurma rivayetler, hadislerin cem'i ve mevkuf rivayetler konusunda eserler vermiştir. Hayatı hakkında bilgi veren tabakat kitapları onun birçok eserinden bahsetse de matbu olarak bulunan üç eserinin olduğunu ifade etmek gerekir. Mevzu rivayetler konusunda, hakkında İbnü'l-Cevzî'yi taklit ettiğine dair iddialar bulunmaktadır. Yaptığımız çalışmalarda, iddiaları haklı çıkaracak bilgiler bulunsa da şahsi tespit ve değerlendirmelerinin olduğu da muhakkaktır. Bu noktada yapılan değerlendirmelerin, toptancı bir yaklaşımla oluşturulduğu tespit edilmiştir. el-Mevsılî, özellikle el-Muğnî eserinde alandaki birçok alimin mevzu değerlendirmesinde bulunmadıkları birçok rivayete yer vermiştir. Eserin mevzu rivayetlerin bir araya getirildiği bir çalışma olduğu düşünüldüğünde, bu rivayetlere de uydurma gözüyle baktığı anlaşılmaktadır. Dolayısıyla onun, bazı rivayetlere uydurma olmadıkları halde mezvu değerlendirmesiyle yaklaştığı anlaşılmaktadır. Bu noktada onun değerlendirme şartları açısından bazı kusurları olduğu görülmektedir. el-Mevsılî'nin farklı yaklaşımları olsa da İbnü'l-Cevzî'ye itibar ettiği muhakkaktır. Bu durum, onun selefî bir bakışa sahip olduğu iddiasını gündeme getirmektedir. Ancak yapılan çalışmalara göre, tabakat âlimleri onun mezhep olarak Hanefî olduğunu ifade etmektedirler. Mezkûr değerlendirmelerin, İbnü'l-Cevzî'ye değer verme ve atıflarda bulunmaktan kaynaklı olduğu tespit edilmiştir."
