abstract: "İslam dininin temel akidelerini açıklamak ve savunmakla yükümlü ilimler olarak fıkıh ve kelam ele aldıkları itikadi ve ameli konular açısından Müslümanların üzerinde bilgi sahibi olması gereken konuları içermesi nedeniyle, onların neye ne şekilde inanmaları noktasında çok büyük önem arz etmektedir. Bu çerçevede hayatın uygulama aşamasında fıkıh ve üzerinde tartışılan konuları, İslamın temel akidesi olan itikad/iman üzerine kurulu ilmi olan kelam ve konuları üzerine bu ilimlerin bilgilerinden en doğru şekilde faydalanmak her Müslümanın hakkıdır. Kaynak bakımından da Kur'an ve Sünnet'e başvurmaları nedeniyle aralarında bir bağ/ilişkinin olduğu tartışılmaz bir gerçektir. Sa'düddin et-Taftazani'nin Şerhu'l-Akaid adlı eserinde Fıkıh-Kelam ilişkisi adlı tez çalışmamızın konusunu da bu eserde yer alan ihtilaflı fıkhi konular oluşturmaktadır. Çünkü bu fıkhi konular Şia ve Mu'tezile mezheplerince itikadi bir hal almış ve bu konularla ilgili tutumları onların inanç sistemine yerleşmiştir. Dolayısıyla hem Şia ve Mu'tezile'nin fikirlerine reddiye olması yönünden hem de Ehl-i Sünnet'in sahih görüşlerini aktarma yönünden araştırmamız önem arz etmektedir. Bu tez çalışması günümüz Müslümanlarının ameli/itikadi noktasındaki inançlarını ne gibi yanlış düşünce ve fikirlerden koruyabilecekleri ve Ehl-i Sünnet çerçevesince sahih görüşleri anlama bakımından bir kaynak niteliği taşımaktadır."
