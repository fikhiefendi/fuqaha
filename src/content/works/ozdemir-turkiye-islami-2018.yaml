abstract: "Mikrofinans, düşük gelir grubundaki insanlara finansal ve finans dışı hizmetlerin sunularak yoksulluğun azaltılmasını sağlayan önemli yöntemlerden biridir; ancak bu kuruluşların faaliyetlerinde İslami prensiplerle çelişen unsurların olması tüm düşük gelirli kişileri kapsamalarını engellemektedir. Mikrofinansla benzer dönemlerde başlamış olan İslami bankacılık da İslami prensiplere uygun olarak faaliyetlerini sürdürmekte ve birçok insanın finansal hizmetlere ulaşmasını sağlamaktadır. Türkiye'de ise katılım bankaları bu misyonu temsil etmektedir. Ancak düşük gelir grubundakiler, teminatlarının olmaması, kredi geçmişlerinin bulunmaması, birim başına yüksek operasyonel maaliyetler gibi sebepler nedeniyle katılım bankalarından finansman sağlayamamaktadır. İslami mikrofinans, İslami bankalar ve konvansiyonel mikrofinans kuruluşları tarafından finansal sistemin dışında bırakılmış kişilere farklı İslami prensipler içerisinde hem finansal hem de finans dışı hizmetlerin sunulmasını sağlamaktadır. Yoksulluğun azaltılmasında İslami mikrofinans metotlarını kullanmak sadece katılım bankaları üzerinden değil banka dışı finans kuruluşları yoluyla da mümkündür. Bu tezin amacı, katılım bankaları ve sivil toplum kuruluşları için Türkiye'ye yönelik İslami mikrofinans modellerinin sunulmasıdır. Araştırmada hem Türkçe literatüre katkı sağlanması hem de pratik anlamda bu modelleri hayata geçirebilecek bir çerçeve sunulması hedeflenmektedir. Yöntem olarak nitel araştırma yöntemi seçilmiş, yarı yapılandırılmış mülakat metodu kullanılarak ilgili paydaşların görüşleri alınmıştır. Mülakata, katılım bankaları, İslami ve konvansiyonel mikrofinans kuruluşları yöneticilerinin yanında, akademisyenler ve düzenleme/kamu kurumlarından toplam 35 kişi katılmıştır. Yapılan görüşmeler çerçevesinde hem katılım bankaları bünyesinde hem de katılım bankaları dışında uygulanabilir iki model oluşturulmuştur. Katılım bankalarının yaygın şube ağları, teknolojik altyapıları, uzman personelleri gibi imkânları nedeniyle İslami mikrofinansın sürdürülebilir şekilde daha çok kişiye sunulması noktasında önemli bir girişim ortaya koyabilecekleri sonucuna ulaşılmıştır. Diğer yandan, her ne kadar katılım bankalarının İslami mikrofinans hizmeti sunmasının yerinde olacağı düşünülse de katılım bankaları dışı kâr amacı gütmeyen kuruluş yapılarına da ihtiyaç vardır. Mülakata katılan İslami mikrofinans kuruluşlarının tecrübelerine bakıldığında, katılım bankaları dışındaki yapıların sürdürülebilirlik gibi zayıf yönleri olmakla birlikte, bu kurulıuşların yoksulluğun azaltılmasında farklı imkânlar sunabileceği de görülmüştür. Sonuç olarak, paydaşların görüşleri çerçevesinde şekillenen bu iki İslami mikrofinans modelinin, Türkiye'de düşük gelirlilerin de finansal hizmetlere erişmesine katkı sağlaması umulmaktadır."
