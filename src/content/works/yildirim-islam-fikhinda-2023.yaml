abstract: "Müslüman, akıllı ve bulûğ çağına ulaşmış kişiler oruç ibadetiyle mükellef olurlar. Bu vasıflara sahip olan bireylere, sağlıklı ve mukim oldukları sürece oruç tutmak farzdır. Bununla beraber ramazan orucunun özellikle gündüzlerin uzun olduğu mevsimlerde diğer ibadetlerde olmayan bir meşakkati olduğu söylenebilir. Çünkü fecr vaktinden gün batımına kadar yeme-içme ve cinsel ilişkiden uzak durmayı gerektiren oruç ibadeti insanın bünyesini zorlayabilir. Normal sağlıklı kişilerde bile bu şekilde zorluk meydana getirebilecek olan oruç ibadeti, birtakım özürleri olan insanlar için daha da zor olacağı aşikardır. Bundan dolayı bazı mazeretlerin bulunması hâlinde oruç tutulmaması mubah hâle gelmektedir. Çünkü İslam dini, kişileri güçleri kadar sorumlu tutmuş, güçlerini aşan veya kişileri sıkıntıya sokan durumlarda kolaylaştırıcı hükümler getirmiştir. Oruç tutmamayı veya başlanmış bir orucu açmayı mubah kılan durumlar ise genellikle fıkıh kitaplarında şu şekilde sayılmıştır. Yolculuk (seferilik), hastalık, gebelik, çocuk emzirmek, yaşlılık, savaş hali, tehdit edilme, açlık, susuzluk, kadının adet veya lohusa hali ve zor işlerde çalışmak. Bu çalışmada, İslam hukukunda oruç tutmamayı mubah kılan özürler ele alınıp mezhepler arası karşılaştırmalar yapılarak ortaya konmaya çalışılmıştır."
