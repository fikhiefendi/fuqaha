abstract: "Bu çalışma, zekât fonlarını üretim ve yatırım araçlarını finanse etmeye yönlendirerek ve bunların yoksulluğu ve işsizliği azaltma ve kendi kendine yeterlilik ve ekonomik güçlenme elde etme yeteneklerini sağlayarak ekonomik güçlenmenin sağlanmasında zekâtın rolünü incelemeyi amaçladı Bunu başarmak için araştırmacı, zekât fonlarından ekonomik güçlendirme elde etme olasılığına ulaşmak amacıyla bu bilgileri analiz etmek ve düzenlemek için tümdengelimli analitik yaklaşıma ek olarak tümevarımcı tanımlayıcı yaklaşımı izledi. Çalışma, en önemlileri olan bir dizi sonuca ulaştı: Zekât sisteminin etkili bir şekilde uygulanması, zekât fonlarını yatırıma ve iş fırsatları sağlamaya ve bireylerin beceri ve yeteneklerini geliştirmeye yönlendirerek ekonomik gücün artmasına katkıda bulunur, bu da işsizliğin ve yoksulluğun azaltılmasına katkıda bulunur. Ulaştığım en önemli konu, savunmasız grubun ekonomik olarak güçlenmesini sağlamak için zekât fonlarının kullanılmasına yardımcı olan ve onların becerilerini geliştirmek için çalışan ve zekat fonları aracılığıyla onlar için yeterli ve yeterli olacak şekilde projeler üreten merkezler ve kurumlar kurma ihtiyacıdır. Bağımsızdır ve böylece yoksulluğun üstesinden gelir ve ekonomik güçlenme elde eder."
