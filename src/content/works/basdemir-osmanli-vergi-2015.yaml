abstract: "Osmanlı Devleti kalıcılığını uygulamalarda gösterdiği hukuk sistemi, toprak sistemlerini ve bu sistemlerin doğal uzantısı olan vergilendirmelerle sağlamıştır. Örfi hukukla idare edilen devletler genel itibariyle örf ve geleneğe, devleti yönetenlerin emir ve buyruklarına, içtihatlara, devletin önde gelenlerinin oluşturduğu bir kurul/heyet veya meclisin yasama çalışmalarına dayanan bir sistemle yönetilir. Şeri hukukun ise öncelikle faydalandığı kaynak Kuran'dır. Kuran'dan sonra dayandığı ikinci kaynak ise sünnet adı verilen, İslam dini Peygamberi Hz. Muhammet'in sözleri ve davranışlarıdır. Osmanlı Devleti'nin arazi sistemi incelendiğinde, toprak sisteminin temelinde İslam arazi hukukunun olduğu görülmektedir; ancak devletin güçlenmesi ile birlikte fethedilen topraklar artmış ve bu artışla birlikte, Osmanlı'dan önce hüküm süren Anadolu Selçuklu Devleti, Büyük Selçuklu Devleti, Anadolu Beylikleri ve Bizans İmparatorluğu toprak yönetim modellerinin de Osmanlı İmparatorluğu toprak modeline etki ettiği ve Osmanlıların tüm bu toprak modellerinden kısım kısım yararlanarak topraklarının taksimatını yaparak, yönettikleri bilinmektedir. 16. yüzyıl Osmanlısında vergiye bakış, devletin amme giderlerini karşılamak amacıyla vatan topraklarında yaşayan herkesin özel varlıkları (mal, mülk) üzerinden aldığı pay şeklindedir. Osmanlı hukukunda vergilerin Müslümanlardan ve gayri Müslimlerden alınan vergiler şeklinde de sınıflandırıldığı görülebilir. Öşür vergisi de Müslüman halkın zirai ürün mahsullerinden 1/5 ila 1/10 nisbetinde zekatın alınması şeklinde tanımlanabilir. Öşür vergisi Osmanlı devletinde ayrıntılı olarak tahsilat zamanı ve tahsilat oranı da üzerinde ayrıca durulmuş mevzulardır."
