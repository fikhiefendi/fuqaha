abstract: "Bu çalışmamızda El-Hafîd Es-Saad Ahmed B. Yahya Et-Taftâzâni'nin“El-Haşiyetu Ala Şerhi'l-Vikaye”başlıklı yazma eserin Muâmelât bölümünü tahkik etmeye çalıştık. Bu tahkik çalışmasını iki bölüm üzerinden gerçekleştirdik. Birincisi; yazma eserin yazara atfedildiğini doğrulamayı ve yazarın kişisel ve bilimsel yaşamını bilmeyi içeren bölümdür. İkinci bölüm ise modern bir eser olarak ortaya çıkarmak amacıyla Muâmelât bölümünün tahkik edilmesidir. Bunun üzerine araştırmacı İslam fıkhının kaynaklarına bir yenisini eklemek ve Mütekaddimîn alimlerinin birçoğu hâlâ el yazması halinde olan eserlerini inceleyerek onların sözlerini öne çıkarmaya odaklandı. Dolayısıyla bu çalışmada yazarın metodunu, kişisel ve bilimsel yaşamını incelemek için tümevarım yöntemine başvurulmuştur. Ayrıca yazma eseri modern ve anlaşılır bir biçimde ortaya çıkarmaya çalıştığımız tahkik yöntemini de kullandık. Bu çalışmada ulaştığımız en önemli bulgular şunlardır: El-Hafîd Ahmed B. Yahya El-Taftâzâni'nin H. 916 yılında vefat ettiğini doğruladık. Aksini söyleyenler olsa da El-Hafîd Et-Taftâzâni Şafii mezhebine hâkim bir Hanefi mezhebi mensubudur. Bu husus onun Hanefi mezhebinde zikrettiği ve aktardığı fıkhî görüşlerle ve iki mezhep arasındaki farka değinerek Şafiî mezhebinden bahsetmesiyle vurgulanmaktadır. Yazma eserin ise sahibine atfedildiği yazma eserin kendisi aracılığıyla da doğrulanmıştır. Ayrıca El-Hafîd“El-Haşiyetu Ala Şerhü'l-Vikaye”de ''Şerhü'l-Vikaye'' yazarının fıkhî görüşlerini deliller ve kendi görüşleri ile desteklemiştir. Aynı zamanda zor ve kısaltılmış olan ibareleri şerh etmiştir. El-Hafid el-Taftâzâni, birden fazla âlimin bir beyanını aktardığında, belirli bir ifadeye yönelmeden ifadeleri karşılaştırır.‎ Ayrıca konuları garip veya muğlak kelimelerle açıklamaz, bunun yerine basit ve sık kullanılan kelimeler kullanır. Belirli bir kelimenin kullanılması gerekiyorsa, onun anlamını dil kitaplarından açıklar. Eğer fıkhî bir görüşün ispatı için Kur'an veya Sünnet'ten delil gösterilmesi gerekiyorsa, ayetin veya Peygamber hadislerini tamamını zikretmeden sadece konuyla ilgili kısmını aktarır."
