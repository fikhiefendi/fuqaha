abstract: "16. yüzyılın sonlarından itibaren kullanımı İslam dünyasında yaygınlaşmaya başlayan tütün ve mamullerinin hükmü, konuyla ile ilgili sarih nasslar bulunmaması nedeniyle fukaha nezdinde tartışma konusu olmuştur. Osmanlı âlimleri arasında da şer'î hükmü tartışılan tütünün mübâh olduğunu söyleyenlerin yanı sıra haram ve mekruh olduğu kanaatini taşıyanlar da mevcuttur. 19. yüzyıl Osmanlı müderrislerinden olan Debbâğzâde Mustafa Sıdkî b. İbrahim es-Sivasî de tütün hakkındaki tartışmalara, yazdığı Risâle fî Beyâni'd-Duhân adlı risalesiyle katkıda bulunmuştur. Debbâğzâde, eserinde konuyla ilgili tarafların görüşlerini ve delillerini ele alıp değerlendirmiş, kendi görüşlerini delilleriyle beraber ortaya koymaya çalışmıştır. Mustafa Sıdkî, yaptığı değerlendirmelerden sonra tütün ürünlerinin tüketiminin, kullanımının ve satışının fıkhî açıdan mübâh ve câiz sayılamayacağını söylemiştir. Bu çalışmada, Mustafa Sıdkî b. İbrahim'in hayatı ve eserleri hakkında bilgi verildi. Onun tütün hakkındaki risâlesi incelendi ve muhtevası değerlendirildi. Ayrıca risâlenin tahkikli metnine yer verildi."
