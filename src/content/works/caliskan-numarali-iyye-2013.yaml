abstract: "''B-7 Numaralı Şer`iyye Siciline Göre Bursa (1591-1592)'' adlı bu tez, B7 numaralı Bursa şer`iyye sicili esas alınarak hazırlanmıştır. Tezimiz giriş ve sonuç bölümlerinin dışında iki bölümden oluşmaktadır. Girişte, temeli MÖ.300'lerde atılmış olan Bursa şehrinin h.1000. yıla kadar olan tarihi geçmişi genel hatlarıyla açıklandıktan sonra, Şer`iyye sicilleri hakkında genel bir bilgi verildikten sonra, bu tezin de ana kaynağını teşkil eden B7 nolu sicil hakkında bilgi verilmiştir. Şer`iyye sicillerinde yer alan bilgiler, devletin işleyişi ve toplumsal tarih hakkında bilgi edinebilmeyi mümkün kılmaktadır. Bu düşünceden hareketle çalışmamızın ana kaynağını oluşturan Bursa B7 no'lu sicildeki veriler doğrultusunda çalışmamızın birinci bölümünde Osmanlı Devleti'ne 80 yıl kadar başkentlik yapmış olan Bursa'nın 1591-92 yılları arasındaki fiziki ve idari yapısı üzerinde durulmuştur. İdari görevlilerin -mümkün olduğunca- tek tek tanıtıldığı bu bölümde ayrıca şehrin dini, sosyal ve ticari yapıları hem mimari açıdan, hem de işlevleri açısından değerlendirilmeye çalışılmıştır. İkinci bölümde ise Bursa şehrinin toplum yapısı ve ekonomik hayatı değerlendirilmeye çalışılmıştır. Bu bölümde -özellikle- toplum ve aile yapısı incelenerek şehir halkının gündelik hayatına dair ipuçları elde edilmeye çalışılmış ve incelenen ?sicildeki? belgelerden elde edilen bilgi doğrultusunda da Bursa şehrinin ekonomik hayatı değerlendirilmeye çalışılmıştır. Anahtar Sözcükler 1. Bursa 2. Şer`iyye sicili 3. Kadı 4. Mahkeme 5. Aile 6. Yeniçağ Tarihi"
