abstract: "Araştırma, üniversite öğrencilerinde İslami finansal okuryazarlık kültürünü ve bu kültürün oluşumunda etkili olan faktörlerin incelemesini amaçlamıştır. Bu kapsamda Nur Esra BEKERECİ (2018) tarafından hazırlanmış“İslam Finansal Okuryazarlık Ölçeği”Karabuk Üniversitesi'nda eğitim gören İşletme, Aktüerya, İktisat, Halk İlişkiler, Uluslararası Ticaret ve Finansman birinci öğretim ve ikinci öğretim düzeylerinde lisans eğitimine devam eden ve tesadüfi yöntemle tespit edilmiş 344 kişiden oluşan örnekleme google form üzerinden anket metoduyla ilişkisel taraması yapılmıştır. Araştırma sonucunda islami okuryazarlık alt kategoriler açısından en yüksek puanın ilişkilendirildiği boyut dindarlık olup, ortalama 3,59±0,595 puan olarak tespit edilmiştir. En düşük puanı gösteren boyut ise 2,71±0,932 puan ortalamasıyla çaresizlik boyutudur. Finansal uygulama ve inanç eğilimi arasında pozitif yönde orta düzeyde, çaresizlik ile inanç eğilimi ve finansal uygulama arasında pozitif yönde düşük düzeyde, dindarlık ile inanç eğilimi, finansal uygulama ve çaresizlik arasında pozitif yönde düşük-orta düzeyde, finansal tatmin ile inanç eğilimi, finansal uygulama, çaresizlik ve dindarlık arasında pozitif yönde düşük düzeyde istatistiksel olarak anlamlı bir ilişki belirlenmiştir. Sonuç olarak finansal okuryazarlık bilgisinin toplamda artış düzeyi alt kategorilerideki artışa bağlı olmakla birlikte farkındalık düzeyinin artışıyla ilgili olduğu tespit edilmiştir."
