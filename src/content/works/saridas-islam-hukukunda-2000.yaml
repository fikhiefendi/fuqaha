abstract: "ÖZET YÜKSEK LİSANS TEZİ İSLAM HUKUKUNDA KADININ RESMİ VE KURUMSAL ALANLARDA SOSYAL AKTİVİTELERİ Gülsüm SARIDAŞ Danışman: Prof.Dr.Hamza AKTAN 2000-Sayfa:211 Jüri: Prof.Dr. Hamza AKTAN İnsanlığın bir çok konudaki telakkilerinin oluşumunda olduğu gibi kadın konusundaki telakkilerin oluşmasında da dinlerin büyük payı vardır. İslam öncesi kültür ve medeniyetlerde kadınla ilgili düşüncelerin şekillenmesinde dinlerin etkisi açık olarak görülmektedir. İslam kültür ve medeniyetlerinde de aynı durum sözkonusudur. İslam tarihi seyri içerisinde kadının sosyal aktiviteleri, zamanın siyasi iktisadi ve sosyal şartlarının etkisiyle ilk dönemden günümüze giderek yavaşlayan bir seyir takip etmiştir. Müslüman kadının hayata katılımında, sosyal aktivitelerde gerilemesinin sebebi İslam değil, müslümanların tutum ve yaklaşımları olmuştur. Çalışmamızın amacı, kadının toplumun tamamına veya bir kesimine verdiği özel hizmetlerinde (cami, köprü, çeşme yaptırma, vakıflarda, hayır kuruluşlarındaki hizmetleri) ve topluma hizmet olarak nitelenecek resmi görevlerinde (ebelik, hemşirelik, devlet reisliği, hakimlik...vs.) kadının statüsünü İslam hukuku açısından ortaya koymaktır. İslam, kadını İslam öncesi kültür ve medeniyetlerde olduğu gibi \"ikinci sınıf insan statüsünde görmez. Keza feminist anlayışların ortaya koyduğu gibi kadının cinselliği ön plana çıkarılarak sömürülmesine de müsade etmez. İslam kadına bir insan olarak olması gereken haklarını verdikten sonra kaybettiği insanlık onurunu iade etmiştir. Teşvik ettiği her işte ve yönlendirdiği hayat biçiminde onun fıtratını yaradılıştan getirdiği nitelikleri de gözardı etmez. Yaptığımız çalışma bizi; İslam hukuku açısından kadının resmi kurumsal alanda sosyal aktivitelerine hiçbir engelin bulunmadığı sonucuna ulaştırmaktadır."
