abstract: "ÖZET Tezimiz bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında, evlilikte velayet konularım ele aldık. Velayetin kaynağı, tarifi ve kısımlarını açıklamaya çalıştık. Birinci bölümde, velayetle ilgili ayetleri, ayetlerle ilgili müfessirlerin görüşlerini, hadisleri ve hadisler ile ilgili muhaddislerin görüşlerim ele aldık ve değerlendirmeye çalıştık. Birinci kısımda ayetleri ele aldık Bundan maksadımız ayetlerle ilgili müfessirlerin görüşlerini tespit etmek, yani öncekilerin bu konudaki değer yargılarını belirlemektir. Ayrıca fakihlerle müfessirlerin farklı görüşlere sahip olup olmadıklarım ortaya koymaktır. Bu bakımdan müfesshierle fakirler arasında esasa tesir edebilecek farklı fikirlere tesadüf edemedik. ikinci kısımda hadisleri ve hadis sarihlerinin görüşlerini zikrettik. Hadis ve hadis sarihleri ile ilgili olarak da müfessirlerle ilgili söylediklerimizi aynen tekrar edebiliriz: Onlar da hadisleri yorumlarken genellikle mezheplerin görüşlerini zikretmektedirler. Bu bakımdan fakihlerin görüşleriyle muhaddislerin görüşleri arasında esaslı fark göremedik. Tezimizin ikinci bölümünde, evlendirilecek kimseler konusunda mezheplerin görüşlerine yer vermeye çalıştık. Bu bölümün birinci kısmında mezheplerin, küçüklerin evlendirilmesi hususunda baba, dede ve diğer veliler ile alakalı görüşlerine, ikinci kısmında ise büyüklerin evlendirilmesi hususunda mezheplerin veliler ile alakalı görüşlerine yer vermeye çalıştık."
