abstract: "Bu tezde, İslam aile hukukunun dikkat çeken konularından biri olan mehir, yalnızca bir nikâh şartı olarak değil; aynı zamanda evlilik hayatına yüklediği anlam, taşıdığı mesaj ve sağladığı faydalar üzerinden ele alınmıştır. Genel olarak“mehir neden vardır?”sorusunun cevabıyla meseleye yaklaşılmış, bu uygulamanın sadece geçmişte değil, bugün de birey ve toplum için ne gibi hikmetler barındırdığı ortaya konulmaya çalışılmıştır. Çalışmanın ilk kısmında, tarih boyunca farklı din ve kültürlerde mehir benzeri uygulamalara kısaca değinilmiş, ardından İslam'ın bu konuda nasıl bir farklılık getirdiği gösterilmiştir. Kur'an'da geçen mehirle ilgili akhâm ayetler, klasik tefsir kaynaklarına başvurularak yorumlanmış; fıkıh kitaplarındaki görüşlerle birlikte mezheplerin konuya bakışları karşılaştırmalı olarak değerlendirilmiştir. Bu tez, salt teknik meselelerle sınırlı kalmamış, daha çok konunun hikmet yönüne de odaklanmış,“mehir ne işe yarar, niçin vardır, topluma ve bireye ne kazandırır?”gibi sorulara samimi ama ilmî bir dille cevap vermeyi hedeflemiştir. Böylece hem teorik bilgiye katkı sunmak hem de sahada karşılaşılan bazı yanlış algıları düzeltmek amaçlanmıştır."
