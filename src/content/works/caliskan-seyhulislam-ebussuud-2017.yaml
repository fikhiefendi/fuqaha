abstract: "Osmanlı Devleti'nin kurum ve kurallarının netleştiği bir dönem olması sebebiyle her bakımdan zirve dönemini yaşadığı XVI. yüzyılda müderris, kadı ve kazaskerlik gibi önemli görevlerin yanı sıra otuz yılı aşkın bir süre şeyhülislâmlık makamında bulunan Ebussuûd Efendi, bu makamın ilmiye sınıfının en üst kurumu haline gelmesinde büyük bir etkiye sahiptir. Nitekim gerek bu süreç içerisinde verdiği fetvaları gerekse müstakil konularda telif ettiği risâleleri ile İslâm Hukuku'nun Osmanlı Devleti içerisindeki uygulamalarına büyük katkılar sağladığı aşikârdır. Bu sebeple Ebussuûd Efendi'ye âit eserlerin tespiti, o dönemin hukuk problemlerini ve çözüm önerilerini yansıtması bakımından büyük önem arz etmektedir. Ebussuûd Efendi'yi konu edinen bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın yöntemi, sınırları ve kaynaklarından bahsedilmiştir. Birinci bölüm olarak ele alınan kısımda ise Ebussuûd Efendi'nin hayatı, eserleri ve yaşadığı dönem üzerinde durularak araştırmaya esas teşkil eden fıkıh risâlelerinin müellifinin ilim ve düşünce dünyasını oluşturan zemin ele alınmıştır. Araştırmamızın asıl konusunu oluşturan ikinci bölümde ise Ebussuûd Efendi'ye nispet edilen fıkıh konulu risâlelerin tespit ve tanıtımları yapılarak âidiyet problemleri giderilmeye gayret edilmiştir. Ebussuûd Efendi'ye âit olan risâleler konularına göre tasnif edilerek muhtevaları hakkında bilgi verilmeye çalışılırken ona âit olmayanlardan kısaca bahsedilmiştir. Ardından Ebussuûd Efendi'nin araştırmamıza konu olan telifâtında istifade ettiği kaynakların tespiti yapılarak her biri hakkında kısa bir bilgi verilmiştir."
