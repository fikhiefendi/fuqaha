abstract: "Bu araştırma, süriye toplumundaki mevcut krizin gölgesinde boşanma olgusuyla ve süriye'de meydana gelen boşanmanın yeni sebeplerin ve etkilerini ele almıştır. Ayrıca, bu araştırma savaştan yol açtığı mevcut koşullar altında ailenin parçalanmasıyla beraber meydana boşanma oranlarındaki artışın nedenlerini ve etkilerini tespit etmışır. Bu araştırma beş bölümden olmuşmaktadır. Birinci bölümde, talak kavramının sözlük ve terim anlamı ile açısından teork yönüyle ele alınmıştır. İkinci bölüme gelince, boşanma neden olan genel sebebler ile daha sonra bu kriz sebebleriyle meydana gelen boşanma sebebleri açıklanmıştır. Ücüncü bölümünde, boşanma yol açtığı krizden önce ile sonrasında meydana gelen boşanma oranları karşılaştırmıştır. Dördüncü bölümde, boşanmanın öncelikle aile ve daha sonra süriye toplumu üzerindeki etkileri incelemiştir. Beşinci bölümü, boşanmanın önlenmesi için önemli önlem ve çözüm önerileri ele alınmıştır. Sonuç bölümde de konuyla ilgli olarak ulaşılan en önemli bulgu ve öneriler ele alınmıştır. Anahtar Kelimeleri: boşanma, sebepler, etkiler, süriye krizi"
