abstract: "Reel ekonomiye finansman sağlayan katılım bankaları için finansal kiralama önemli ve fonksiyonlarına da son derece uygun bir ürün çeşididir. Özel sektörün finansman kaynakları arasında Avrupa ile kıyaslandığında Türkiye'de leasing halen çok düşük bir seviyede yer almaktadır. 6361 sayılı yeni kanun ile getirilen hizmetlerin kapsamının genişletilmesi, fonksiyonel bir birliğin kurulacak olması gibi düzenlemelerle sorunların önemli ölçüde çözülmesi hedeflenmektedir. Yeni kanun ile leasing, Türkiye'nin büyümesi ve gelişmesinde önemli bir rol üstlenmiş olup, yatırımcıların finansman temini için yönlendikleri ciddi bir kaynak durumundadır. Son yıllarda hazine bonosu ve mevduat gibi konvansiyonel yatırım araçlarının cazibesini görece yitirmesiyle sektörde yeni borçlanma araçlarına ilgi artmakta, alternatif yatırım araçlarına yönelme de bu anlamda önem kazanmaktadır. Hazine Müsteşarlığı'nın kısa süre önce ilk ihracı gerçekleştirdiği İslami bir borçlanma aracı olan sukuk da bu alternatif yatırım enstrümanlarından birisidir. Bu ihracın bir gösterge oluşturması ve özel sektörü tetiklemesi ile Körfez yatırımcılarının ilgisi düşünüldüğünde Türkiye'nin daha önce yeterince çekemediği İslami yatırımcı kitlesinden kısa-orta vadede milyarlarca dolarlık fon sağlaması beklenmektedir. Küresel çalkantılardan daha az etkilendiklerinden global kriz sonrası öne çıkan İslami borçlanma piyasalarına sadece İslami koşullarda yatırım yapanlar değil, yatırımlarını çeşitlendirmek isteyen klasik tahvil yatırımcılarının da oldukça ilgi gösterdikleri dikkat çekmektedir. Ülkemizde gerek ekonomi yönetiminin son günlerde kamu bankalarının da katılım bankacılığı sektörüne girmesi yönünde karar alması, gerekse kira sertifikası konusundaki gelişmeler sektörün büyüme hızını artıracağı yönünde beklentilere yol açmıştır."
