abstract: "İslam fıkhının metodolojisi incelendiğinde taabbüdî ve ta'lîlî hükümlerin, İslam hukukunun temel dayanaklarını oluşturduğu ve hükümlerin belirlenmesinde kurucu bir işlev üstlendiği görülmektedir. Bu hükümler yalnızca fıkhî hükümlerin mahiyetini tayin etmekle kalmayıp aynı zamanda metodolojik çerçevenin inşasında da belirleyici bir rol oynamaktadır. Bu çalışmada, taabbüdî ve ta'lîlî hükümlerin lügat, ıstılah ve teknik anlamları ayrı ayrı ele alınarak, İslam fıkhındaki işlevsel yönleri ortaya konulmaktadır. Söz konusu hükümler, usûl-i fıkıh ve fürû'u fıkıh açısından ayrı ayrı incelenmiş ve ilgili örneklerle açıklığa kavuşturulmaya çalışılmıştır. İslam fıkhının evrenselliği ile esnekliği arasındaki dengeyi kurabilmek için taabbüdî ve ta'lîlî hükümlerin sınırlarının titizlikle belirlenmesi gerekmektedir. İslam hukukunu diğer hukuk sistemlerinden ayıran temel hususlardan biri, hükümlerin hem evrensel bir mahiyete sahip olması hem de değişen zaman ve mekâna uyum sağlayabilecek esneklik gösterebilmesidir. İslam fıkhının evrenselliği her toplum ve çağ için geçerli temel hükümlerin varlığına dayanır ki bu tür hükümler en iyi şekilde taabbüdî karakterli normlarla açıklanabilir. Bununla birlikte, İslam hukukunun esnek bir yapıya sahip olması da zorunludur; zira, hukukun değişen ve gelişen dünyayı yakalayabilmesi farklı toplum ve kültürel yapılarla uyum içinde varlık gösterebilmesi açısından bu özellik büyük önem arz etmektedir. İslam hukukunun bu esnek yapısını en iyi ifade eden ise ta'lîlî hükümlerdir. Bu çalışmanın temel amacı, İslam fıkhının evrenselliği ile esnekliği arasındaki dengenin doğru tespit edilmesine katkı sağlamaktır. Zira bu denge sağlanamadığında çeşitli problemler ve farklı fikir akımları ortaya çıkabilmektedir. Bu bağlamda, çalışmada farklı düşünce akımlarına da yer verilerek taabbüdî ve ta'lîlî hükümlerin doğru bir şekilde belirlenmesinin ve İslam hukukunun evrensel ilkeleri ile esneklik kapasitesi arasındaki dengeyi sağlamanın önemi vurgulanmaktadır."
