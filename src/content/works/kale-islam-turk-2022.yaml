abstract: "Hazırlamış olduğumuz tezimizin konusu İslam hukukunda ve 5237 Sayılı Türk Ceza Kanunu'nda suçlu ile mağdurun birbirlerinin akrabaları olmaları durumunda aralarında var olan bu akrabalık ilişkisinin suç veya cezaya nasıl ve ne derecede etki ettiğinin araştırılmasıdır. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezimizin amacı ve kaynakları konulara değinilmiştir. Birinci bölümde İslam ve Türk Ceza Hukuku'ndaki suç ve ceza kavramlarına ve bu kavramların unsurlarına yer verilmiştir. İkinci bölümde İslam hukukundaki had suçları ile kısas suçları ve cezaları hem basit şekilleri açısından hem de suçlu ile mağdurun birbirlerinin akrabaları olmaları açısından ele alınmıştır. Sonuç bölümünde ise ulaşılan bulgular değerlendirilerek çalışma sonlandırılmıştır."
