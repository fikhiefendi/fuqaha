abstract: "İslami bankacılık sistemi, Müslümanların ihtiyaçlarından doğan ve bu sebeple Müslüman bilim insanlarının geliştirmiş olduğu bir sistemdir. Bu sistem Müslümanların dini hassasiyetlerini içeren İslamiyet dininin kurallarına ters düşmeden faiz sebebi ile finansal sistem dışında kalan sermayenin finansal sisteme katılmasını ve İslam dini hassasiyetleri olan toplumların finansal ihtiyaçlarını karşılamayı amaçlamaktadır. Tezde sukukun hareket alanı olan piyasalar tanımlanmış, sukuk sistemini veya sistemin çalıştığı piyasaları ilgilendiren islami finansal kuruluşları anlatılmış, sukukun diğer finansman araçları ile karşılaştırılması yapılmıştır. Tezin son üç bölümünde dünyada işlem gören sukuk tanımlanmalarına girilmiş ve sukuk türleri anlatılmıştır. Türkiye deki sukuk finansman modelinin Türkiye deki uygulaması olan kira sertifikaları ve kira sertifikalarının tarafları açısından muhasebeleştirilmeleri örneklerle açıklanmıştır."
