abstract: "Arap Dili belağatı, bütün sanat çeşitleri ile Kur'an'ın icazının temelini oluşturmuştur. Kur'an kerim bu sanatla kâfirlere meydan okumuş, alimler asırlar boyunca hatta günümüzde de Kur'an'ın Arap dili ve belagatı açısından inceliklerini açıklamakla meşgul olmuştur. Arap toplumu kendi dilinin belağatı ve sanatlarıyla övünmüştür. Evet Kuranın icazı bu dil ile gelişmiştir. Hatta bu sanatın etkisi birçok islami ilimler de görülmektedir. İslam hukuku ve usulü, Tefsir ilmi ve usulünü Arap dili edebiyatının inceliklerinden ve etkisinden bağımsız düşünmek mümkün değildir. Bu edebi sanat Arapça ile temel İslami ilimler arasındaki ilginin ve ilişkinin temeli olmuş, dikkatleri hep üzerine çekmiş, bu ilimlerin gelişmesinin ve güzelliğinin esası olmuştur. [Tezde yapılan çalışma, tefsir fıkıh ve usul ilimlerinin Arap edebiyatı inceliklerinin tefsir, fıkıh ve usül ilimlerine hem teorik hem de pratikteki etkilerini ortaya koyması ve Kur'an'daki bazı ayeti kelimeleri esas alarak örnek uygulama yapılması açısından önem arz etmektedir"
