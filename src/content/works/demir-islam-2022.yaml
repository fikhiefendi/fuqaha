abstract: "Bey'u'l-îne, İslam borçlar hukukunda zikredilen satım akidlerinden biridir. Bu akit, genel olarak bir malın satıldıktan sonra ilk sahibine geri dönmesini ifade eder. En bilinen ve kabul gören tanıma göre bey'u'l-îne, bir kimsenin bir malını vadeli satması ve aynı malı aynı müşteriden daha düşük fiyata peşin olarak geri almasıdır. Bey'u'l-îne adı, bütün mezheplerce aynı içerikle açıklanmadığından dolayı günümüz araştırmacıları, daha kapsayıcı olan \"geri alım sözleşmesi\" adını kullanırlar. Bey'u'l-îne ile ilişkili kavramların en önemlileri, teverruk ve muâmele-i şer'iyyedir. Osmanlı döneminde kullanılan muâmele-i şer'iyye kavramı, bey'u'l-îne ile ilişkili olarak üretilmiş bazı uygulamaların adıdır. Günümüzde bey'u'l-îne akdine, Malezya'daki İslâmî finans sektörünce kredi işlemlerinde çokça başvurulmaktadır. Bu satış, diğer İslam ülkelerindeki faizsiz bankacılık sektöründe ise organize teverruk işlemiyle karşımıza çıkmaktadır. Anahtar kelimeler: Bey'u'l-îne, Teverruk, Muâmele-i şer'iyye, İslâmî finans, Faiz, Riba"
