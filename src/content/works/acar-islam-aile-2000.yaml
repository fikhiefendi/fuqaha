abstract: "ÖZET Her insan muayyen bir ailede dünyaya gelmekte, aileye hayat veren birliktelik nikah bağıyla kurulmaktadır. Her inanç sisteminin olduğu gibi, yahudilik, hıristiyanlık ve cahiliye arap toplumunun da kendilerine özgü aile ve evlilik anlayışları bulunmaktadır. Yahudilikte ve hıristiyanlıkta nikah akdinde din farkı prensip olarak evlenme engeli olarak kabul edilmiş, ancak bazı dönemlerde bu temel prensipten sapmalar olduğu görülmüştür. Cahiliye araplannın ilahî bir inanç sistemi olmadığı gibi, aile ve evlilik ilişkilerinin de daha çok güçlülerin belirlediği, temelde keyfiliğin esas olduğu bir seyir takip ettiği gözlenmektedir. İslam dininin dünya ve ahiret tasavvurunun aile ve evlilik kurumunu etkilediği görülmektedir. İslam ailesi, Kur' an ve sünnet temelinde, hukuki yorumlarla detaylandınlmış, pratiği sağlam, farklı zaman ve coğrafyalara uygulanabilme esnekliğini bünyesinde barındıran ideal bir görünüm vermektedir. İslam aile hukukunda nikah akdinin birtakım şekil ve şartlan bulunmaktadır. Bu şekil ve şartlar nikahın hukuki geçerliliği açısından büyük önem taşımaktadır. İslam aile hukuku, nikah akdinde din farkını geçici evlenme engeli olarak kabul etmektedir. Müslüman kadına; müşrik, ehl-i kitap, ateist, mürted vb. bütün gayri müslimlere yönelik nikahlanma yasağı bulunmaktadır. Yani müslüman kadın sadece müslüman erkekle nikahlanabilmektedir. Müslüman erkeğe de; müşrik, ateist, mürted vb. gayri müslimlere yönelik nikahlanma yasağı bulunmaktadır. Müslüman erkek, müslüman kadından farklı olarak ehl-i kitap kadınlarla nikahlanabilmektedir. Müslüman kadın ve müslüman erkek arasında ortaya konulan bu farklı tutum İslam'ın aile ve evlilik kurumuyla hedeflediği temel prensiplerle örtüşmektedir. İslam hukukçuları tarafından değişik yönleriyle ele alınan mezkur helallik alanı, çok özel şartların gerektirdiği zemin ve zamanlarda kullanılması gereken bir ruhsat olarak görülmektedir. Gerçekte aynı inancı ve aynı idealleri paylaşan eşler uyumlu ve mutlu olma fırsatını yakalayabilir, sahip olacakları çocuklara da huzurlu bir aile ortamı sunabilir. vııı"
