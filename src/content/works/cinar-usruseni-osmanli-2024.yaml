abstract: "Çocuk hakları ve hukuku konusunda son iki yüzyıllık süreçte yoğun gelişmeler yaşanmıştır. Bu süreç içerisinde konuyla ilgili sıklıkla gündeme gelen bazı kavram ve yaklaşımların, bu son dönemde ortaya çıktığı yönündeki algılar ve iddialar da literatürde kendine yer bulmuştur. Bu çalışma, söz konusu algı ve iddiaları akılda tutarak, İslam hukukunda, Hanefi mezhebi özelinde, çocuk hukukunun niceliksel ve niteliksel olarak nasıl ele alındığı sorusuna cevap aramaktadır. Çalışmanın temel kaynaklarını, 13. yüzyıla ait Üsrûşenî'nin Câmi'u ahkâmi's-sığâr adlı eseri ile 16. yüzyıl Osmanlı şeyhülislamlarına ait fetvalar teşkil etmektedir. Bu iki temel kaynağın bütüncül bir yaklaşımla incelenmesi neticesinde ortaya çıkan kategorilerin derinleştirilmesi ve zenginleştirilmesi amacıyla, Hanefi literatüre ait çeşitli kaynaklardan istifade edilmiştir. Bu şekilde çalışma, 9.-20. yüzyıllar arasında telif edilmiş ve temsil gücü yüksek eserlere dayanmıştır. Kullanılan kaynakların, geniş bir coğrafi çeşitliliğe sahip olması da beraber düşünüldüğünde, elde edilen sonuçların yaygınlığı ve genel geçerliği noktasında tatmin edici bir zemin oluşturulmuştur. Hukukun çeşitli alanlarında çocukla ilgili hükümlerin incelenmesi sonucunda, istikrarlı bir şekilde takip edildiği gözlemlenen yedi temel ilke tespit edilmiştir. Çalışmada, ele alınan bu yedi ilkeden özellikle“Çocuğun menfaatinin gözetilmesi ve çocuğun zarar görmesinden kaçınılması”ilkesi üzerinde durulmuş ve bu ilkenin, hukuk düzenlemelerine yansıması çeşitli üst başlıklar altında ele alınmıştır. Sonuç olarak, bu menfaat-zarar ilkesinin İslam hukukunda ilk andan itibaren çocukla ilgili hükümlerde en etkin ilkelerden biri olduğu ortaya koyulmuştur."
