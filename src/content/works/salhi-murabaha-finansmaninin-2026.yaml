abstract: "İslami bankaların çoğunluğu, finansmanlarının temelinde murabaha işleyişini benimsemektedir. Yüksek getirisi, düşük riski, uygulama kolaylığı ve önceden bilinen kârları, bu durumun başlıca sebeplerindendir. Bu araştırma, murabaha finansmanının ekonomi üzerindeki etkisini araştırmaktadır. Bu amaçla makroekonomik göstergelerden ekonomik büyüme oranı, enflasyon oranı, faiz oranı ve ekonomik açıklık oranı ile murabaha arasındaki ilişki incelenmiştir. Murabahanın görece daha yaygın olarak kullanıldığı ekonomiler olan Suudi Arabistan, Malezya, Endonezya, Ürdün, Birleşik Arap Emirlikleri ve Kuveyt ekonomileri üzerine araştırma gerçekleştirilmiştir. Çalışma 2014 -2021 dönemini kapsamakta, üçer aylık veriler üzerinden 32 döneme ilişkin verilerden oluşmaktadır. Panel veri analiz yönteminin uygulandığı çalışmada öncelikle modeldeki sabit ve eğim katsayılarının durağanlığı test edilmiş, homojenliği doğrulanarak GMM-PVAR testi ve PVAR Granger Nedensellik testi yapılmıştır. Analiz sonuçlarından elde edilen bulgulara göre murabaha ile reel büyüme oranı faiz oranı ve enflasyon oranı arasında tek yönlü nedensellik bulunurken; murabaha ve ekonomik açıklık oranı arasında ise nedensellik ilişkisinin bulunmadığı tespit edilmiştir. Murabahadan faiz oranı ve enflasyon oranına nedensellik ilişkisi bulunurken, reel ekonomik büyüme oranından murabahaya bir nedensellik bulunmaktadır."
