abstract: "Bu çalışmanın konusu, hırsızlık suçunun İslam ve Mer'i Ceza Hukuku kaynaklarındaki yeri ve muhtevasıdır. İslam Ceza Hukukunda örnekleme yönteminin, mer'i ceza hukukunda ise ilkesel yöntemin kullanılması sebebiyle her iki hukuk sistemi karşılaştırılmak suretiyle hırsızlık suçunun yer ve muhtevası tespit edilmeye çalışılmıştır. Tezin amacı ise kısmen ilkesel olmakla birlikte daha çok örneksel bir yöntemle zenginleştirilmiş/geliştirilmiş İslam ceza hukukunda hadd suçları kategorisinde yer alan ve kural olarak hadd cezasına tabi olan hırsızlık suçunun mer'i hukuk sistematiği ile ifade edilmeye çalışılmasıdır. Bu çalışma sırasında İslam hukukunun klasik dönem eserleri ile birlikte son dönem eserleri de, mer'i hukuk eserleri ile birlikte taranmış ve karşılaştırma mer'i hukuk sistematiği içerisinde değerlendirilmiştir."
