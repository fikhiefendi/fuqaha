abstract: "Finansal kaynak olarak görülen yabancı sermaye, serbestleşen sermaye hareketleri, faiz gibi faktörlerin ülkelerde yol açtığı finansal krizler faizsiz finansal yöntemlerin yaygınlaşmasına sebebiyet vermiştir. Sukûk da bu faizsiz finans yöntemlerinin en çok rağbet gören ürünü olarak tüm dünyayı etkisi altına almıştır. Sukûkla birlikte onun bir tarafı olarak ortaya çıkan Varlık Kiralama Şirketleri (VKŞ) ise beraberinde birçok fıkhî tartışmayı beraberinde getirmiştir. VKŞ'lerin durduğu yer itibariyle niteliği bir yana kaynak kuruluş ile ihraca konu varlıkların devri, geri alma taahhüdü ve garantörlük meselesi ciddi tartışmalara neden olmuştur. Bu çalışma ile Varlık Kiralama Şirketlerinin mahiyeti ve gerçekleştirdiği işlemler bağlamında fikhî durumları anlatılmaya çalışılmıştır."
