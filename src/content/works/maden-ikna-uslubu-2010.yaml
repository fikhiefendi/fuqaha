abstract: "Bu çalışmada öncelikle Kur'an'da aynı ayet ve aynı pasaj içinde muhatapları ikna etmek gayesiyle imani konularda yapılan mukayeseler konu edinilmiştir. Kur'an daima öğretici, ikna edici ve teşvik edici bir güce sahiptir. Etkili ve güzel üslubu ile muhataplarını hayran bırakan Kur'an-ı Kerim en derin mevzuları teşbihler, temsiller, diyaloglar nev'inden üsluplarla insanların seviyelerine indirir. İşte Kur'an'ın bu yönünü ortaya koyma anlamında mukayese yönteminin çok önemli bir yeri vardır. Çünkü mukayese yöntemi Kur'an-ı Kerim'de sıkça yer alan etkili bir ikna üslubudur.Bu çalışma üç ana kısma ayrılmaktadır. Birinci bölümde ulûhiyetle ilgili mukayeselere yer verilmiştir. Burada Allah'ın birliği, dilemesi (meşiet), kudreti ve ilmi ile ilgili karşılaştırmalar incelenmiştir. Ikinci bölümde ise mü'minlerin kâfir, münafık, mürted ve zalim kimselerle mukayese edildiğini gördüğümüz ayetler bağlamında Kur'an'ın mukayese üslubu değerlendirilmiştir. Son bölümde ise ahiretle ilgili karşılaştırmalar ele alınmış; cennet cehennem mukayesesi, Ahiret hesabı ile ilgili mukayeseler, cezalandırma ve ödüllendirme mukayesesi incelenmiştir.Çalışmanın hedefi Kur'an-ı Kerim'in imani konuları mevzu ederken muhatapları ikna etmek için mukayese yöntemi kullandığının tespiti ve bunun ayetlerle delillendirilmesi olmuştur. Sonuç olarak Kur'an'da muhatapların zihinlerinde iman konusunun daha da belirginleştirilmesi gayesi ile aynı ayet ve aynı pasaj içinde imani konularda mukayeseli bir üslubun kullanıldığı görülmüştür."
