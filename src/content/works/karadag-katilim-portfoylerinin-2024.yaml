abstract: "Teknolojik alanda yaşanan gelişmelerin de eşlik etmesiyle birlikte 1990'lı yıllardan itibaren finansal piyasalar arasındaki etkileşim ve bağımlılık giderek artmış, piyasalardan birinde meydana gelen olumsuz bir durum doğrudan ya da dolaylı olarak diğer piyasaları da hızlı bir şekilde etkiler hale gelmiştir. Bu açıdan en kırılgan piyasalardan bir tanesi hisse senedi borsalarıdır. Özellikle son yarım asırda meydana gelen çok sayıdaki finansal ve ekonomik gelişmenin yol açtığı, borsa krizi olarak adlandırılan ve neredeyse tüm hisse senetlerinde fiyat çöküşleri meydana getiren ciddi düşüşler akademik anlamda birçok araştırmacının ilgi odağı olmuş, bu kapsamda hisse senedi portföylerinin sistematik piyasa riskine karşı nasıl yönetileceği konusunda çok sayıda araştırma yapılmıştır. Bu tez çalışmasında Markowitz'in ortaya koyduğu ve günümüzde de pratik olarak geçerliliğini sürdüren portföy seçimi modeli kullanılarak, Türkiye'de“katılım”olarak adlandırılan İslami hisse senetlerinden getiri-risk çerçevesinde optimal portföyler oluşturulmuş, konvansiyonel muadillerine kıyasla da borsa krizlerine karşı dayanıklılıkları karşılaştırmalı olarak incelenmiştir. Tez çalışması üç bölümden oluşmaktadır; birinci ve ikinci bölümde hem okuyucuya alanla ilgili teorik ve kavramsal bilgiler verme hem de üçüncü bölümdeki uygulamanın arka planını oluşturma amacıyla dünyada İslami hisse senetlerinin ortaya çıkışı, kullanılan farklı izleme kriterleri, önemli borsa krizleri, riskin tarihi, tanımı ve ölçümü, Modern Portföy Teorisi ve Finansal Varlıkları Fiyatlama Modeli konularında bilgiler aktarılmış, İslami hisse senetleri ve portföylerle ilgili geçmişte yapılan çalışmalardan bir literatür özeti sunulmuştur. Üçüncü bölümde“Modern Portföy Teorisi çerçevesinde ve katılım ilkeleri doğrultusunda oluşturulan optimal hisse senedi portföyleri, en az aynı piyasadaki konvansiyonel muadilleri kadar borsa krizlerine karşı dayanıklı mıdır?”sorunsalına cevap aramak amacıyla ampirik uygulama yapılmıştır. Bu amaçla öncelikli olarak borsa krizinin kavramsallaştırması yapılmış ve bunun sonucunda Türkiye'de 2011-2023 yılları arasında Gezi Parkı, Rahip Brunson ve COVID-19 Krizleri olmak üzere üç kriz dönemi tespit edilmiştir. BIST 30 ve BIST KATILIM 30 endekslerindeki şirketlerin aylık düzeltilmiş logaritmik getirileri kullanılarak her bir kriz döneminde getiri-risk çerçevesinde ve üç farklı yatırım stratejisi altında katılım ve konvansiyonel optimal portföyler oluşturulmuş ve sorunsal kapsamında oluşturulan hipotezler %95 güvenilirlik seviyesinde istatistiksel olarak test edilmiştir. Ayrıca her bir portföy grubu etkinlik, çeşitlilik ve benzeşme açılarından da değerlendirilmiştir. Aynı dönemde borsa krizi kapsamına girmeyen ancak düzeltme dönemi olarak değerlendirilebilecek iki farklı düşüş dönemi de modelin sağlamlık testi amacıyla kullanılmıştır. Elde edilen sonuçlar doğrultusunda, her bir inceleme döneminde katılım optimal portföylerinin en az konvansiyonel optimal portföyler kadar krizlere karşı dayanıklı olduğu tespit edilmiştir. Ayrıca etkinlik ve çeşitlilik açılarından da katılım optimal portföylerinin, birkaç istisna dışında konvansiyonel optimal portföylere göre üstünlük sergilediği gözlenmiştir. Sağlamlık testi dönemlerinde de kriz dönemlerine benzer sonuçlar elde edilmiş ve kullanılan modelin sadece borsa krizlerinde değil, kriz dışı düşüş dönemlerinde de geçerliliğini koruduğu görülmüştür."
