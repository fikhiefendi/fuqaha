abstract: "Makasid temelli ictihad, günümüzde âlimler ve araştırmacılar nezdinde önemli bir ilgiye mazhar olmuş; bu yaklaşımın mesâlikine ve yöntemine bağlılık giderek yaygınlaşmıştır. Ancak bu bağlılık, meşru ve ilmî temellere dayanan sahih bir yönelim ile geçersiz ve reddedilmesi gereken bir sapma arasında farklılık arz etmektedir. Nitekim bazı araştırmacıların bu alana yönelik ilgisi, naslar ile muteber usûl kaide ve ilkeleri çerçevesinde şekillenmiş; nihai hedef olarak hakikate ve Şâri'in maksadına ulaşmayı esas almıştır. Buna karşılık, diğer bazı yaklaşımlar ise hevâ ve sübjektif maslahat anlayışları doğrultusunda gelişmiş; böylece nefsânî eğilimlerin maksadını gerçekleştirmeyi hedefleyen ve bunu da ictihad kisvesi altında meşrulaştırmaya çalışan bir çizgi ortaya çıkmıştır. Benzer şekilde zâhirî ictihad da çağdaş dönemde farklı biçimlerde ilgi görmüş; bu yaklaşım da söz konusu yönelimlerden nasibini almıştır. Bu bağlamda bazı âlimler, ifrat ve tefrite düşmeden, belirli bir usûl ve muteber mesâlik çerçevesinde hareket ederken; diğer bazıları ise zâhirî yaklaşımı benimsemede aşırılıklara saparak metodolojik dengesizlikler sergilemiştir. Kısacası, her iki ictihad tarzı da çağdaş düşünce ve yaklaşım biçimleri üzerinde derin etkiler bırakmış; ancak bu etki ve bağlılık, farklı düzey ve yoğunluklarda tezahür etmiştir. Bu çerçevede söz konusu çalışma, makasidî ve zâhirî ictihad anlayışlarının mahiyetini ve temel unsurlarını ortaya koymayı; her iki yaklaşımı temsil eden ve bu alanlarda öne çıkan âlimlerin perspektifleri üzerinden değerlendirmeyi amaçlamaktadır. Ayrıca bu iki ictihad tarzının birbirinden ayrıştığı mesâlik ve yöntemlerin mukayeseli bir analizini yaparak, günümüzde bireyler ve fikrî akımlar üzerindeki etkilerini tespit etmeyi hedeflemektedir. Çalışmada bu hedeflere ulaşmak üzere tanımlayıcı, analitik, tümevarımsal ve karşılaştırmalı bilimsel yöntemler birlikte kullanılmıştır. Araştırma neticesinde ulaşılan bulgulara göre zâhirî ictihad; Kur'an ve Sünnet'te vârid olan lafızların, zahirî anlamları ile zorunlu olarak tek bir manaya delâlet eden mefhumlarından hareketle, mevcut bir olgunun hükmünü talep etmeye yönelik ilmî çaba ve gayreti ifade etmektedir. Buna karşılık makasid temelli ictihad ise; nasların mana ve mefhumlarını, indirildiği dil bağlamı (zâhir, ibare ve mefhum) içerisinde dikkate alarak, bir hüküm hakkında zannî veya kat'î bir sonuca ulaşmayı ve bu sonucun vakıa üzerinde genel ve özel düzeyde—hem mevcut durumda hem de geleceğe yönelik olarak—tahakkukunu sağlamayı amaçlayan bir ictihad faaliyetidir. Bu çerçevede ulaşılan hüküm, ya doğrudan naslarda mevcut olmakta ya da naslarla uyumlu bir şekilde temellendirilmektedir. Etkileri bakımından değerlendirildiğinde ise, günümüz âlimlerinin bu iki ictihad tarzından ve bunları temsil eden şahsiyetlerden farklı derecelerde etkilendiği açıkça görülmektedir. Nitekim bazıları bu yaklaşımlara sempati duymuş, bazıları hüküm verirken bunlardan istifade etmiş, bazıları ise belirli mesâlik ve yöntemlere sıkı bir şekilde bağlı kalarak bu yaklaşımları benimsemiş, geliştirmiş ve sürdürmüştür. Zâhirî ictihad açısından bakıldığında, bazı âlimler (örneğin İbn Akîl) bu yaklaşımı bir mezhep ve yöntem olarak benimserken; bazıları (örneğin Muhammed Nâsırüddîn el-Elbânî) bunu açıkça ifade etmemiş, ancak ictihad yöntemlerinde belirgin bir etkilenme gözlemlenmiştir. Genel olarak bu etkinin özellikle Selefî eğilimlerde daha belirgin olduğu söylenebilir. Makasid temelli ictihad ise günümüzde şüphesiz en yaygın ictihad biçimlerinden biri hâline gelmiştir. Bu alanda öne çıkan isimler arasında Yusuf el-Karadâvî ve Ahmed er-Reysûnî gibi şahsiyetler yer almakta; bu yaklaşım özellikle çağdaş orta yolcu (vasatî) düşünce akımlarında güçlü bir şekilde temsil edilmektedir."
