abstract: "Abdülganî en-Nâblusî (1640-1731) 17-18. yüzyıllarda Şam'da yaşamış çok yönlü bir âlimdir. Hanefî mezhebine mensup olan Nâblusî, başta fıkıh ve tasavvuf olmak üzere; kelam, hadis, tefsir, Arap dili ve edebiyatı, cifr, rüya tabiri, tarih ve seyahatname gibi birçok alana dair üç yüze yakın eser kaleme almıştır. Nâblusî'nin daha ziyade tasavvufî yönüne dair çalışmalar yapılmış; onun fıkıh eserleri ve fıkhî yönü kapsamlı bir şekilde incelenmemiştir. Bu çalışmada öncelikle Nâblusî'nin hayatı ve eserleri hakkında bilgi verilmekte ve bilhassa fıkıh eserleri detaylı bir şekilde incelenmektedir. Ardından Nâblusî'nin yaşadığı dönemde Osmanlı Devleti; siyasî, sosyal, iktisadî, ilmî ve kültürel açıdan ele alınmaktadır. Nâblusî'nin fıkıh düşüncesi; eserleri ve yaşadığı dönem dikkate alınarak, onun bazı usûl ve fürû meselelerine yaklaşımı üzerinden incelenmektedir. Nâblusî Osmanlı Devleti'nde birtakım hararetli tartışmaların olduğu bir dönemde yaşamış ve bu tartışmalara kayıtsız kalmamıştır. Literatüre Kadızâdeliler ve Sivâsîler tartışması olarak geçen bu tartışma konularından bir kısmı da fıkhî konulara dairdir. Tartışılan konulara dair Nâblusî, müstakil eserler yazmış ve Kadızâdeliler'in el kitabı mahiyetindeki İmam Birgivî'nin et-Tarîkatü'l-Muhammediyye adlı eserini şerh etmiştir. Nâblusî Kadızâdeliler ve Sivâsîler'in tartıştıkları bu fıkhî meselelerden tütün, kahve, musiki, sema, raks ve deverân gibi konuları yazdığı eserlerde detaylı bir şekilde incelemektedir. Kadızâdeliler ve Sivâsîler hakkında detaylı bilgi verdikten sonra, taraflar arasındaki fıkhî tartışmalar ve Nâblusî'nin bu tartışmalara yaklaşımı ortaya konulmuştur. Sonuç olarak bu çalışmada Nâblusî'nin hemen hemen tüm İslâmî ilimlere vukufiyeti olan, yaşadığı dönemi iyi okuyup anlamaya çalışan, usûlde sırf mukallid olmakla birlikte fürûda mezhep içi tercihler yaparak ictihad edebilen bir fakîh olduğu tespit edilmiştir."
