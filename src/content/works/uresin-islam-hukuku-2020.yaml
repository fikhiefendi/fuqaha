abstract: "Bu çalışmada nikâh akdiyle birlikte erkeğe yüklenen sorumluluklara dâir bilgiler ele alınmaktadır. Araştırmamızın giriş bölümünde“Araştırmanın Konusu ve Alanı”belirtilerek çalışma süresince kullanılan“Kaynaklar”ve“Takip Edilen Metot”hakkında bilgilere yer verilmiştir. Çalışmamızın konusu itibariyle ilk bölümde erkeğin eşine olan maddi sorumluluklarına dâhil olan, nafaka, mehir, tedavi masrafları vb. konularına değindik. İkinci bölümde ise kocanın eşine karşı maddi sorumlulukları haricinde kalan şahsî sorumluklarının ve çocuğuna karşı yükümlülüklerinin kapsamlarını ortaya koyduk. Bunlar; güzel muamele, çocuğun nafakası, eğitilmesi, sünnet ettirilmesi, evlendirilmesi, eşler arası adalet, iyi geçim, evlat yetiştirme, tedib gibi çeşitli konulardır. Sonuç bölümünde araştırmamızı genel bir değerlendirme yaparak tamamladık. Çalışmamız ortaya koymaktadır ki değişen dünya ve sistemlere rağmen aile hayatının korunması ancak ilahi ve nebevi ölçülerle sağlanmaktadır. Nitekim aile hukukunun ilkeleri gerek Kur'an-ı Kerim'de gerekse hadislerde geniş bir çerçeveyle ortaya konmuştur. Bu nedenle araştırmamızı işaret edilen çerçeve dâhilinde yapıp edindiğimiz bilgilere kanaatimizi de ekleyerek aktardık."
