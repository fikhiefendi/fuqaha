abstract: "ÖZET KLASİK HANEFİ FIKIH USÛLÜNDE NESİH ANLAYIŞI Tezimizin konusu, Klasik Hanefî Fıkıh Usûlünde Nesih Anlayışıdır. Araştırmamızda özellikle hicrî ilk beş asırda yaşamış Hanefî usulcülerin, nesih kavramına yaklaşımlarım tespit etmeye çalıştık. Bu amaçla; onların usul kitaplarındaki nesih kavramı ile ilgili bölümleri tespit ederek tasnif ettik ve sınıflandırılan bölümleri değerlendirerek genel düşünce ve anlayışın ne olduğunu belirttik. Klasik Dönem Hanefî Fıkıh Usulü Bilginlerinin, nesih anlayışlarını incelendiğimiz tezimiz, bir giriş ve iki bölümden oluşmaktadır; Girişte; tezin konusu, tezin önemi ve amacı, tezin sınırlandırılması, tezin yöntemi ve tezin bölümleri hakkında bilgiler verilmiştir. Birinci bölümde; neshin kelime ve ıstılahı anlamı, neshin cevazı, bedâ nesih ilişkisi ve neshin hikmeti, neshin hangi çeşit hükümlerde vuku bulduğu, neshin hangi zaman diliminde gerçekleşebileceği ve nesih ile ilgili şartlar ele alınarak nesih kavramı ve mahiyetinin ne olduğu ortaya konmaya çalışılmıştır. İkinci bölümde ise; nesih olgusunun iki aslî unsuru olan nâsih ve mensûh kavramları ile hükümler arası nesih ilişkisi ele alınmıştır. Bu bağlamda nâsih hüküm olması bakımından; Kur'an'ın bir ayetinin Kur'an'ın başka bir ayetinin hükmünü neshi, bir Sünnet'in bir başka Sünnet'in hükmünü neshi, Kur'an'ın bir ayetinin bir Sünnet'in hükmünü neshi, bir Sünnetin Kur'an'ın bir ayetinin hükmünü neshi, îcmâ ile nesih ilişkisi ile Kıyas ile nesih ilişkisi ele alınmıştır. Kur' an' da gerçekleşen nesih çeşitlerinden mensûh hüküm olması bakımından da; Bir nassın hükmünün ve tilâvetinin birlikte neshi, bir nassın hükmü baki kalarak tilâvetinin neshi, bir nassm tilâvetinin baki kalarak hükmünün neshi ve nassa ziyade ile nesih arasındaki ilişki ele alınmıştır. Daha sonra sonuç kısmında genel bir değerlendirme yapılarak tezde ulaşılan netice açıklanmıştır."
