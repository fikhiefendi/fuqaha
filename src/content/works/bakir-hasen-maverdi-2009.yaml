abstract: "İslam hukukunun başta devlet başkanlığı ve adli teşkilat olmak üzere idareyle alakalı ahkâmını toplu bir şekilde ele alan ve bu alandaki en önemli eserlerden olan el-Ahkâmus-sultâniyye'lerin müellifleri Ebü'l-Hasen el-Mâverdî (ö. 450/1058) ve Ebû Ya`lâ el-Ferrâ (ö. 458/ 1066), Abbasî döneminde yaşamışlardır. Müelliflerin aynı adı taşıyan iki eseri, hem muhteva hem metod itibariyle birbirine oldukça benzemektedir. Bu benzerlik o kadar fazladır ki, çoğu zaman aynı şeyleri tamamen aynı kelimelerle ifade etmişlerdir. Bununla birlikte iki eser arasındaki temel farkın müelliflerin mezheplerinden kaynaklandığını ifade etmemiz mümkündür. Çalışmanın giriş bölümünde Mâverdî ile Ferrâ'nın hayatları, yaşadıkları dönem ve ilmi kişilikleri ele alınmış, aynı zamanda el-Ahkâmus-sultâniyye'lerin yazılma sebepleri, bu iki eserin muhteva, metod ve üslubu ve mukayesede takip etmiş olduğumuz yöntem hakkında bilgi verilmiştir. Birinci bölümde iki eserin imamet konuları, ikinci bölümde ise yargı (kazâ) konuları mukayese edilmiş ve aradaki farklar ortaya konulmaya çalışılmıştır. Üçüncü bölümde ise iki eserin hangisinin önce yazıldığı ve hangi müellifin diğerinden etkilendiği konusundaki tartışmalar ele alınmış, sonra da görüşlerin ve delillerin değerlendirmesi yapılmıştır."
