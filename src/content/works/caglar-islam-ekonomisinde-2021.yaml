abstract: "İslam'ın bir toplum ve devlet düzeni olarak tanımlandığı günümüzde, İslam'ın iktisadi yaşamla ilgili gündeme getirdiği açıklamalar da gün geçtikçe önem kazanmıştır. Bu sebeple insanı tabiattan, hayatı ekonomiden soyutlamayan bir dinin, kendi mantığına ve dünya görüşüne uygun bir ekonomik sistemi de belirlemesi oldukça mantıklıdır. İslam ekonomisi içerisinde özellikle ahlaki değerleri bulundurması ile ana akım ekonomik sistemler ile arasında bir farklılık göstermektedir. İktisadın önemli birer konularından olan üretim, tüketim ve bölüşüm ile ilgili problemlerde de İslam ekonomisi olaylara ahlaki değerlerle konuları değerlendirmektedir. Bu bağlamda“İslam Ekonomisinde Teorik Açıdan Üretim – Tüketim ve Bölüşüm”isimli yüksek lisans tez çalışması, adil bir ekonomik sistem odaklı İslam iktisadi yaklaşımını Kur'an ve Sünnet temelinde açıklayıp günümüzde ana akım iktisadi yaklaşım olarak kabul gören iktisat yaklaşımından ayrıldığı konuları belirterek, günümüzde gelinen noktada İslam iktisadi yaklaşımının yapısını değerlendirmiştir İslam ekonomisi, İslam'ın koymuş olduğu sınırlar ve hükümler çerçevesinde uygulanan ekonomik bir model olarak ele alınmıştır. İslam Ekonomisi ilkeleri ve teorik temelleri açıdan üretim-tüketim ve bölüşüm konuları incelenerek konuyla ilgili literatür taraması yapılmıştır. Bu çalışma ile İslam ekonomisinin ana akım ekonomik sistemlerle olan ilişkileri belirlenerek İslam ekonomisinin hem günümüzdeki konumu hem de geleceği açısından önerilerde bulunulmuş ve İslam ekonomisinin teorik açıdan ilerlemesi için önerilerde bulunulmuştur."
