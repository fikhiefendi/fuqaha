abstract: "Murabaha, 1970'lerde mudarabe ve müşareke temelli bir anlayışla faaliyete başlayan İslam bankacılığının en çok kullanılan işlemi olma özelliği taşımaktadır. Murabaha; ortaya çıkış biçimi, geçirdiği süreç, içerdiği problem noktaları ve hakkındaki tartışmalar açısından oldukça farklı boyutlara sahip bir akittir. Böyle bir akdin tarihsel gelişmini ele almak, geçirdiği merhaleleri takip etmek ve taşıdığı problem noktaları hakkındaki tartışmaları incelemek genel olarak İslam iktisadı ve özellikle modern akitler alanında önemli bilgiler sunmaktadır.Modern İslam iktisadı ve İslam bankacılığının durumunu değerlendirmek için murabaha akdinin seçilmesinde murabahanın; mudarebe, müşareke, icare ve selem gibi diğer yatırım-finansman modelleriyle ortak meselelere sahip olmasının yanı sıra kendine has pek çok farklı problem noktası içermesi, diğer işlemlere göre daha geniş ölçekli ve günümüzde en yaygın şekilde kullanılan işlem olması ve modern dönemde en çok tartışılan işlem niteliği taşıması etkili olmuştur. Ayrıca murabaha, klasik bir akdin modern ihtiyaçlara göre nasıl şekillendirildiğini ve bu konuda yapılan tartışmaların yönünü görme açısından da önemli bir örnektir.Bu çalışma, murabahayı fıkhî, iktisadî, sosyal vb. çeşitli yönleriyle ve eleştirel ve bütüncül bir bakış açısıyla ele almakta ve mevcut literatürden hareketle modern İslam iktisadı problemlerindeki akıl yürütme ve hüküm üretme faaliyetlerinin gidişatını ortaya koymaktadır."
titleTranslation: {"en": "Approaches to murabaha in the literature of modern Islamic economics"}
