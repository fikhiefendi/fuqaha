abstract: "Bu çalışmanın amacı nadide bir el yazmasını gün yüzüne çıkarmak ve ibadetlerin sırları ve hikmetleri hakkında müellifin görüşlerini değerlendirmektir. Eserin İslam hukukunu ilgilendiren bölümü ibadetlerin sırlarıyla ilgili olduğu için yapılacak olan tahlil de hikmet-i teşri açısından olacaktır.İksîrü's-seâdât fî esrâri'l-İbâdât, Kadı Burhanedddin tarafından 798'de yazılmıştır. İbadetlerin sır ve hikmetlerini fıkıh ve tasavvuf ilimlerini mezcederek ele alan eser, fıkıh-tasavvuf ilişkisinin en güzel örneklerinden biridir. Kadı Burhanedddin, ibadetlerin sırları ve hikmetlerini ele almadan önce bir biriyle bağlantılı üç ayrı mukaddime yazmıştır. Müellif bu mukaddimelerde vahdet-i vücud anlayışını benimsediğini ortaya koymuştur. Ancak mukaddimeler vahdet-i vücud anlayışını ayrıntılı bir şekilde ortaya koymak için değil, ibadetlerin sırlarına dair söylenecek şeylerin daha iyi anlaşılmasına yardımcı olmak için kaleme alınmıştır. Çünkü bu anlayışa göre varlık birdir. O da Vacibu'l-vücûd olan Hakkın varlığıdır. Âlem/ler Hakkın isimlerinin yansımalarından (tecelli/zuhur) ibarettir. Maddi- manevi, kesif-latif her şey bir biri ile bağlantılıdır. Bu temel düşüncenin bir sonucu olarak ibadetler de ilahi isimler, varlık mertebeleri, dört unsur, harfler ve birbiri ile bağlantılıdır. Eserde bu bağlantı noktaları tespit edilmiş ve abdest, namaz, oruç, zekât, hac ve cihadın sırları ve insan nefsine etkileri açıklanmıştır. Kadı Burhanedddin'in İksîrü's-seâdât'ta, ibadetlerin sırlarına dair yaptığı açıklamaların temellerini, Füsusu'l-Hikem ve şerhleri ile Fütühât-ı Mekkiyye'de görmek mümkün olmakla beraber, onların bir kopyası da değildir. İksîrü's-seâdât, bir yönüyle orjinal bir \"hikmet-i teşrî\" kitabıdır. Anahtar Sözcükler: Varlık, tecellî, hikmet-i teşrî, ibadet, ibadetlerin sırları ve insana etkileri."
