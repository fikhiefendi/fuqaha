abstract: "Marka ve marka değeri kavramları geçmişten günümüze ülkemizde ve dünyada üzerinde birçok araştırmanın yapıldığı bir kavram olarak karşımıza çıkmaktadır. Araştırmacıların son derece ilgisini çeken bu kavramlar, sektör yöneticileri, tüketiciler ve firmalar açısında da önemli unsurlar olarak karşımıza çıkmaktadır. Bu çalışmada, marka tanımı ve tarihçesine değinilerek, markanın önemi üzerinde durulmuştur. Markanın, üreticiler, tüketiciler, aracılar, toplum ve kamusal kuruluşlar açısından önemi açıklanmıştır. Ayrıca, marka türleri, markanın elementleri ve marka değeri kavramlarına yer verilerek, marka değeri boyutları irdelenmiştir. Ardından katılım bankacılığının tarihçesine değinilerek dünyada ve Türkiye'deki katılım bankalarının başlangıcı ve konumundan bahsedilmiştir. Bankacılık sektöründe, katılım bankalarının dünyadaki ve Türkiye'deki payları, yeri ve özellikleri incelenmiştir. Türk katılım bankacılığında marka kavramının önemi, marka değerine bakış ve uygulanan marka stratejileri üzerine araştırmalar yapılmış, müşteri tercihleri ve değişimleri analiz edilmiştir. Türkiye'de faaliyet gösteren kamu ve özel katılım bankası müşterileri üzerinde yapılan anketlerin analiz edilmesi sonucunda, Marka Farkındalığı ile Marka Çağrışımları ve Algılanan Kalitenin, Marka Sadakati üzerinde olumlu etkisi olduğu ortaya konulmuştur."
