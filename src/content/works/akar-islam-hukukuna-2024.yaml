abstract: "İslam hukuku, insanoğlu için daha doğmadan cenin halinden başlayıp doğumu, temyiz çağı, buluğu ve dahi hayatının her safhasına dair hükümler ortaya koymuştur. Bu dönemlerden insanın en savunmasız ve muhtaç olduğu zaman dilimi ise şüphesiz çocukluktur. Allah (cc), aciz durumda olan küçüğe velâyet müessesesini tayin etmiş, anne babasını da onun velîsi kılmıştır. Küçükler için bir himaye müessesesi olan velâyet, çocuğun her türlü tehlikeden korunup maddi ve manevi gelişimini en iyi şekilde tamamlamasını ve bir yetişkin olarak toplumda yer almasını sağlamayı amaçlamaktadır. Velâyet, anne babaya tanınan bir haktan öte içerisinde birçok görev ve sorumluluğu barındırmasıyla bir yetki-görev niteliğindedir. Çocuk üzerinde anne babaya sınırsız bir yetki sağlamayan velâyetin çocuğun menfaat ve gelişiminin zarar görmesi veya buna ihtimali halinde sınırlandırılması veya kaldırılması söz konusudur. Türk hukukunda da velâyet benzer amaçlarla düzenlenmekte olup; çocuğun üstün yararı her şeyden önde tutulmuştur. Türk Medeni Kanunu'nun ilgili maddelerinde geçen çocuğun üstün yararı ve gelişimini tehlikeye sokacak durumlarda velâyetin sınırlandırılması veya kaldırılması gerekmektedir. Her iki hukukta da velâyete dair müdahaleyi gerekli kılan belli başlı durumlar olmakla birlikte gerçekleşen her somut olay çocuğun menfaati üstün tutularak değerlendirilmektedir. Tezimizde her iki hukuk sisteminde yer alan velâyetin sınırlandırılmasını ve kaldırılmasını gerektiren durumları ve bu durumların müdahaleyi gerektirme sebeplerini karşılaştırıp çocuğun menfaat ve gelişimi açısından değerlendirmeyi hedeflemekteyiz."
