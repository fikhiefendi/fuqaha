abstract: "Rumeysa Şükriye GENGİL Ahkâmu'l-Kur'ân, tefsir ilminin ibâdât, muamelât ve ukubatla ilgili ayetleri inceleyen dalıdır. Aile hukuku kapsamında incelediğimiz evlilik ve sonuçlarını ele alan ayetler de muamelata taalluk eden hususları açıklamaktadır. Bu çalışma, hicri dördüncü asırda yaşayan ve Te'vîlâtü'l-Kur'ân adlı eserin sahibi Ebû Mansûr el-Mâtürîdî (ö. 333/944) ile yine aynı asırda Bağdat'ta vefat eden Ahkâmu'l-Kur'ân isimli tefsirin müellifi Ebû Bekr el-Cessâs'ın (ö. 340/952) aile hukukunun evlilik ve sonuçları bağlamındaki görüşlerinin mukayesesi üzerinedir. Doğal olarak çalışma Kur'ân'ın aile hukuku kapsamındaki ahkam ayetleri çerçevesinde her iki müfessirin görüşlerinin karşılaştırılması esasına dayanmaktadır. Semerkand'da yaşayan Mâtürîdî, Hanefî mezhebine mensup önemli bir müfessir, mütekellim ve fakihtir. O, Te'vîlâtü'l-Kur'ân adlı tefsirinde ahkâm ayetlerini yorumlarken Semerkant ekolü merkezinde fakih kimliğini ortaya koymuştur. Irak Hanefîliğinin önde gelen temsilcilerinden Ebû'l-Hasen el-Kerhî'nin öğrencisi olan Ebû Bekr el-Cessâs (ö. 370/981) ise Ahkâmu'l-Kur'ân adlı eserini Irak Hanefî Ekolünün etkisi altında ahkam ayetlerini yorumlamıştır. Çalışmanın temel amacı aynı tarihlerde fakat farklı bölgelerde yaşayan bu iki Hanefî âlimin evlilik ve sonuçlarıyla ilgili ayetleri yorumlarken hangi ölçüde ortak ya da farklı görüşlere sahip olup olmadığını tesbit etmektir. Ayrıca birbirlerinden değişik görüşleri varsa bunların nedenlerini, bölgesel farklılıkların ayetlerin tefsirlerine etki edip etmeyeceğini ortaya çıkarmayı hedeflemiştir. Çalışmanın kapsamında incelenen evlilik ve sonuçlarına karşılık gelen ayetler her iki müfessirin de yorumlama yöntemleri ve vardıkları sonuçlar bağlamında değerlendirilmiştir. Müfessirlerin yorumları mukayese edilirken fıkhi başlıklandırmalardan faydalanılarak ayetler incelenmiştir. Bu çerçevede evliliğe teşvik, çok eşlilik, nikahta velinin rolü, evliliğin doğurduğu haklar ve sorumluluklar, doğum ve sonuçları gibi başlıklar altında bu konularla ilgili ayetlerin tevilleri aktarılmış, benzerlikler ve farklılıklarla ilgili değerlendirilmeler yapılmıştır. Çalışmanın sonucunda ise ayrı ekollere mensup iki Hanefî müfessirin evlilik ve sonuçlarına ilişkin ayetlerden çıkardıkları hükümlerin neredeyse tamamen aynı olduğu, bölgesel farklılıkların bu türden ayetlerin yorumlarına etki etmediği görülmüştür. Bununla birlikte Mâtürîdî ve Cessâs'ın hem toplumsal hayat hem de özel hayat ile ilgili meselelere yaklaşım biçimleri noktasında belirgin farklılıklar olduğu tesbit edilmiştir. Özellikle Mâtürîdî'nin maslahat odaklı yaklaşımı dikkat çekmektedir."
