abstract: "Bu araştırmanın amacı Osmanlı Dönemi'nde bir Türk şehri olan Siirt ve bağlı yerlere ait mahkeme kayıtlarını ihtiva eden 417 numaralı şer'iyye sicilinin gerekli izahat ve değerlendirmeleri ışığında transkripsiyonunu yapmak, o dönemde Siirt'in sosyal, ekonomik, hukuki ve kültürel yönlerini anlamak ve açıklığa kavuşturmaktır. Üzerinde çalıştığımız defterin kapsadığı tarihlerde Siirt Livâsı Bitlis Vilâyetine bağlı idi. 417 Numaralı defterde Osmanlı mahkemesine intikal eden davalar, vakıflar, arsa-mülk satışları, vasi tayini, askeri konular ve arzuhal kayıtları bulunmaktadır. Bölgede çok kültürlü, farklı etnik kimlikler yaşadığından bu yapı mahkeme kayıtlarına da yansımıştır. Bu nedenle çalışmamızın özünü oluşturan 417 numaralı Siirt Şer'iyye sicili belli bir dine ait kişilerin kaydedildiği defter olmaktan ziyade Müslüman ve gayrimüslimlerin kaydını içeren bir defterdir."
