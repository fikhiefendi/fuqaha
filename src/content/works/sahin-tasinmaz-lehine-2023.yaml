abstract: "Taşınmaz lehine irtifak hakkı, yüklü taşınmazın üzerine yararlanan taşınmazın lehine kurulan ve yüklü taşınmazın malikinin mülkiyet hakkından doğan yetkilerinden bazılarını kullanmaktan kaçınması veya yararlanan taşınmazın malikinin yüklü taşınmazı kullanmasına katlanması yükümlülüğü içeren irtifak hakkıdır. Bu hakkın hukuka uygun yarar sağlaması ve yüklü taşınmaza ilişkin olması şartıyla, taşınmaz lehine irtifak hakkının içeriğini belirleme özgürlüğü bulunmaktadır. Taşınmaz lehine irtifak hakkı Türk Medeni Kanunu'nun 779-793. maddelerinde düzenlenmektedir. Bu çalışmanın konusu, Türk hukukundaki taşınmaz lehine irtifak hakkına ilişkin hükümlerdir. Bu çerçevede birinci bölümde, taşınmaz lehine irtifak hakkının hukuki niteliği, içeriği ve konusu ele alınmaktadır. Taşınmaz lehine irtifak hakkının benzer kavramlardan farkları incelenmektedir. İkinci bölümde, taşınmaz lehine irtifak hakkının tescille kurulması ve tescilden önce kazanılması üzerinde durulmaktadır. Üçüncü bölümde, taşınmaz lehine irtifak hakkının hükümleri açıklanmaktadır. Özellikle taşınmaz lehine irtifak hakkının kapsamı, bu hakkın taraflara sağladığı yetkiler ve yüklediği yükümlülükler ve bu hakka ilişkin değişikliklerin hukuki sonuçları ele alınmaktadır. Dördüncü bölümde, taşınmaz lehine irtifak hakkının terkinle ve terkin dışı sona ermesi incelenmektedir."
