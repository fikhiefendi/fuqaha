abstract: "Bu araştırmada Kur'ân'daki mukârene ayetleri bir araya getirilip analiz edilmiştir. Mukârene، tekâbül veya muvâzene، Kur'ân'ın beyan ve edebî tasvirlerinde kullanılan edebî bir üsluptur. Bu“Eşya zıddıyla bilinir”ilkesi gereği Kur'ân'ın birbiriyle çelişen canlı suretleri örnek verirken veya biri diğerinin tam karşısında konumlanmış iki zıt durumu ifade ederken kullanılan bir metottur. Kur'an'ın bu yöntemindeki amacı، negatifin yanlışlığına karşı olumlunun sahihliğini göstermek، sahîh olana sarılıp، olumsuz olanı terk etmektir. Karşılaştırma، değeri teşhis etmek için olumlu bir insan modeli ile olumsuz bir modeli karşılaştırma anlamına gelir. Bu çalışma، Kur'an'daki bu tasniflerle ilgili çağdaş çalışmaların eksikliğini gidermekte ve Kur'ân araştırmalarındaki bu boşluğu doldurmayı amaçlamaktadır. Araştırmacı، bilimsel materyal toplama، Kur'an-ı Kerim'deki mukayese ayetlerini tespit etme، tefsir kitapları، Kur'an ilimleri، lügat kitapları ve diğer ilgili kaynaklarda bunlarla ilgili örnekleri incelemede karşılaştırmalı، analitik tümevarımcı yaklaşım metodu kullanmıştır. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Kur'an'daki mukayese yöntemi öncelikle eğitici olup، hidayet، ıslah، kişilik inşası ve ideal hayat modellerinin değerlendirilmesi alanında kullanılabilir. Kur'ân'da mukârene eğitim ve etik alanındaki fiillerin avantaj ve dezavantajlarının açıklanması، rasul ve nebiler arasındaki üstünlüğün ortaya çıkarılması gibi birkaç hedef doğrultusunda kullanılmaktadır. Kur'ân kıssalarında kullanılan mukârene ise، önceki ümmetlerin başına gelenlerden ibret، öğüt almak; hikmet ve güzel öğütle tebliğ yolunda peygamberleri örnek edinme hedefiyle kullanılmıştır. Bu kıssalar، içerisinde barındırdıkları ders ve ibretler sebebiyle nesilleri etkilemek، yol göstermek ve eğitmek için bir araç haline getirilmiştir. Bu kıssalar، alelade hikâyelerde olduğu gibi konusu ve anlatılışı itibariyle birer sanat eseri değil، insanın iki cihan saadetini temin eden Kur'ânî bir vesiledir. Ayrıca okuyucunun، rakibini yenmek için tartışırken argümanların ve kanıtların kademeli olarak kullanılmasını öğrenmesi gerekliliğinden de yararlanır. Kur'ân'ın mukârene üslubunda bu ayetlerdeki belâgî icâza hizmet eden tasrî' gibi lafzî güzelleştirmeler، tıbak gibi manevi güzelleştirmeler kullanılmıştır."
