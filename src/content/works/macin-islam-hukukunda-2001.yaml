abstract: "Keffaret (îjtfsıı)» Arapça bir kelime olup, jü fiilinin mastarıdır. Sözlükteki temel anlamı örtmektir. Bir İslâm Hukuku terimi olarak ise keffaret, işlenen bir suçtan kaynaklanan günahı telafi etmek için belirlenmiş, ibadet mahiyetinde bir ceza olarak tanımlanabilir. İslâm Hukukçularının, İslâm Hukukunun iki temel kaynağı, Kur'an-ı Kerim ve Peygamber (s.a.v.)'in Sünnetine dayanarak ortaya koydukları keffaret çeşitleri şunlardır: 1- Orucu Bozma Keffareti: Ramazan ayında şer' i herhangi bir mazereti olmaksızın bilerek orucu bozan kimseye gereken keffarettir. Bu, kişinin gücü nisbetinde sırayla: Mü'min bir köle azad etmesi, iki ay oruç tutması, altmış fakiri doyurmasından ibarettir. 2- Hac Kurallarına Uymama Keffareti: Hacca giden kimselerin hacda hac vaciblerinden birini yerine getirmemelerinden ya da ihram yasaklarından birini ihlal etmelerinden dolayı gerekli olan keffarettir. Böyle bir yasağa uymayan kimse, şu üç şeyden birisini yapması gerekir: Bir kurban kesmek, üç gün oruç tutmak, altı yoksulu doyurmak 3- Cinsel Yasaklan İhlal Etme Keffareti: Bu, bir kimsenin hayızlı ya da nifaslı hanımıyla cinsel ilişkiye girmesinden dolayı yerine getirmesi gerekli olan keffarettir. Bu durumdaki bir kimsenin, gücü nisbetinde 1 ya da yarım dinar ya da bu değerdeki bir meblağı sadaka olarak verip, günahının bağışlanması için tevbe etmesi gerekir. 4- Zıhar Keffareti: Bu, kişinin, hanımını, annesine benzeterek onu kensine haram kılmasıdır. Bu, cahiliye döneminde boşanma kabul edilen kötü bir uygulama idi. İslâm, bu kötü uygulamayı kaldırarak böyle bir yola baş vurup, hanımıyla. evlilik hayatını sürdürmeyi isteyen kocaya gücü nisbetinde sırayla şunlardan birisini keffaret olarak vermeyi gerekli kıldı: Bir köle azad etmek, iki ay peşpeşe oruç tutmak, altmış fakiri doyurmak. 5- Yeminden Dönme Keffareti: Bir kimsenin ettiği yemine riayet etmeyip; yeminini bozması halinde kendisine gerekli olan keffarettir. Bunun keffareti: kişinin ailesine yedirdiğinin orta derecesinden on fakiri yedirmek ya da on fakiri giydirmek ya da bir köle azad etmektir. Bunlardan birisine güç yetiremeyen kimse, keffaret olarak üç gün oruç tutması gerekir. 6- Adam Öldürme Keffareti: Yanlışlıkla bir insanı öldüren kimseye gerekli olan keffarettir. Yanlışlıkla birisini öldüren kimse, yapabiliyorsa mü'min bir köle azad etmesi gerekir. Buna gücü yetmiyorsa iki ay peş peşe oruç tutması gerekir. Bu keffaret çeşitlerinin ilk ikisi ibadetlerle, diğer ikisi aile hayatı ile son ikisi ise beşeri ilişkiler (muamelat)'le alakalıdır."
