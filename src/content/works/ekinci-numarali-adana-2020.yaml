abstract: "Osmanlı Devleti'nin siyasi, iktisadi, hukuki, askeri ve sosyo-kültürel yapısı hakkında bilgi sahibi olmak için ilk başvuru yapılması gereken ana kaynakların başında şer'iyye sicilleri gelmektedir. Şer'iyye sicili kayıtlarına bakılarak bir bölgenin ya da bir şehrin sosyal tarihi hakkında değerlendirmeler yapılabilmektedir. Çalışmanın amacı Adana'nın 5 Numaralı Şer'iyye sicilinin transkripsiyonunu ve değerlendirmesini yapmak, Osmanlı hakimiyetine kadar olan tarihi gelişimi, hukuki yapısı, şer'iyye mahkemeleri ve sicillerdeki belge çeşitleri hakkında bilgiler vermektir. İncelenen şer'iyye sicilindeki kayıtlarının ait olduğu tarihi hicri 1184-1185 miladi 1770-1771 yıllarıdır. İçerik bakımından farklı konuları kapsamaktadır. Defterde, öncelikle sosyal hayatta müslim-gayrımüslim ilişkileri; özel mülkiyetin alım-satımı, kiralanması ve miras ile alakalı belgeler mevcuttur. Bunların yanında sicilin son bölümlerine doğru Osmanlı-Rus savaşlarından dolayı ordunun asker ve zahire ihtiyacını karşılmak için merkezden Adana sancağına gönderilen belgeler yer almaktadır."
