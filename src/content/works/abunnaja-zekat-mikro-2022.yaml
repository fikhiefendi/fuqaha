abstract: "Bu çalışmanın amacı, zekâtı mikrofinans programlarında kullanmanın imkanını araştırmaktır. Önerilen sistemin uygunluğu, hem İslam hukuku hem de yoksulluğun ortadan kaldırılmasında zekât ile sağlanan fonların sürdürülebilirliği ve yeterliliği bağlamında incelenecektir. Zekât hakkında yapılmış olan bilimsel metinlerin yorumlanmasında genelde nitel araştırma yöntemi kullanılmıştır. Biz de aynı yöntemi takip etti. Öte yandan, zekât fonunun mikro-finansa katkısının ne kadar önemli olduğunun cevabı aranacak ve bu doğrultuda bir yöntem geliştirilecektir. Toplanacak potansiyel zekât miktarı Türkiye GSYİH'sinin bir yüzdesi olarak hesaplanacak ve sonuç yoksulluk oranıyla karşılaştırılacaktır. Bu çalışma, zekât fonlarının yoksulluğu azaltmada yetkin ve değerli bir etkisinin olduğunu ortaya koymaktadır."
