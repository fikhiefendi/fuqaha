abstract: "Mahremiyet hakkı genel anlamıyla: Bireylerin, başkalarıyla kendi hayatıyla ilgili paylaşımlarının ne ölçüde olacağını belirleme hakkına sahip olmasını ifade eder. Günümüzde en sık ihlal edilen haklardan biri, kuşkusuz mahremiyet hakkıdır. Bireyin fiziksel, dijital ve sosyal sınırlarını korumasının güvencesi olan bu hak, teknolojik gelişmelerin hız kazandığı, gözetimin sıradanlaştığı ve bilginin ekonomik değere dönüştüğü bir çağda giderek daha fazla ihlal edilmektedir. Mahremiyet, devletlerin, şirketlerin, medyanın ve diğer bireylerin meraklı bakışları altında giderek daralan bir alana sıkışmış durumdadır. Mahremiyet bir hak olmanın yanında, bireylerin toplumsal yaşam içinde ihtiyaç duydukları bir kavramsal alanı da kapsamaktadır. Bu nedenle mahremiyetin ihlali, bireysel hakların kısıtlanmasının yanında toplumsal bir soruna da yol açmaktadır. Çalışmanın ilk bölümünde, mahremiyet kavramının kelime kökeni ve bir hak olarak dönüşümüne değinilmiş, tarihsel süreç içinde mahremiyet hakkının gelişimi irdelenmiştir. İkinci bölümde, uluslararası evrensel ve bölgesel düzenlemeler ile İslam hukuku kaynaklarında mahremiyet hakkının yeri incelenmiştir. Son bölümde ise, mahremiyet hakkının beden, konut ve bilgi gibi alt kategorilerde nasıl ihlal edildiği, yargı ve denetim mekanizmalarının kararlarından örneklerle ele alınmıştır. Çalışmada, her bölüm kendi içinde karşılaştırılarak analiz edilmiştir. Böylece uluslararası hukuk ve İslam hukukunda güncel bir mesele olarak mahremiyet hakkının değeri ve yeri bütüncül bir bakış açısıyla ele alınmıştır."
