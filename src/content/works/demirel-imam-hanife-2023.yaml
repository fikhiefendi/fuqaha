abstract: "İman konusu mezhepler tarafından geçmişten günümüze kadar tartışılagelmiş ve Kelam ilminin en mühim konularından birisi olmuştur. Yaptığımız araştırmalar sonucunda Ebû Hanîfe ve Mürcie'nin iman anlayışı hakkında henüz bir çalışma yapılmadığını tespit ettik. Bu çalışmayı yaparken; Ebû Hanîfe ve Mürcie fırkasının iman anlayışlarını net bir biçimde ortaya koymaya çalıştık ve iki görüşün karşılaştırmasını yaptık. Bu görüşlerin ortak noktalarını bulmaya çalışırken farklılıklarına da değindik. İnanç ve itikâdî konulardaki görüşleriyle kelam ilminin öncülerinden olan Ebû Hanîfe, imanı“Dil ile ikrâr kalp ile tasdîk.”şeklinde tanımlamıştır. O imanın,“tasdîk”özelliği üzerinde dururken; Mürcie fırkası iman hakkında kesin ve ortak bir tanım üzerinde birleşmemiş ve imanı“yalnızca marifet”,“marifet ve ikrâr”ve“Dil ile tasdîk ve ikrâr”olarak tanımlamıştır. İman tanımı yapılırken“Amel-imandan bir parça/cüz müdür?”,“İman ile İslam aynı anlama mı gelir?”,“Büyük günah işleyen imandan çıkmış mıdır?”,“İmanda istisna yapılabilir mi?”,“İman yalnızca marifet midir?”,“İmanda artma ve eksilme olur mu?”gibi sorular ortaya çıkmıştır. İmanın tanımından kaynaklanan bu soruları tezimizde açıklık getirdik. Fakat bunu yaparken Ebû Hanîfe ve Mürcie çizgisi içerisinde yapmaya çalıştık. Zaman zaman diğer fırka ve mezheplerin görüşlerine de yer verdik."
