abstract: "İctihatta Hata sabet Problemi isimli bu tez, Erciyes Üniversitesi Sosyal BilimlerEnstitüsü'nde Yüksek Lisans Tezi olarak sunulmuş olup, bir giriş, üç ana bölüm ve birsonuçtan oluşmaktadır.Birinci bölümde, ictihatta hata isabet tartışmasının temel kavramları olan ?ictihad?,?hata?, ?isabet/savab?, ?hakk? kelimelerinin tanımları yapılarak, ictihatta hata isabetprobleminde hangi anlamda kullanıldıkları açıklanmıştır.kinci bölümde, ictihatta hata isabet tartışmasının teorik temelleri üzerinde durulmuş, bubağlamda ictihatta hata isabet tartışmasının mahiyeti ele alınarak tartışmanın cereyanettiği alan belirtilmiştir. Bu bölümün ikinci kısmında ictihatta hata isabet tartışmasınıntarafları ile bu tarafların görüşleri gerekçeleriyle beraber açıklanmıştır.Üçüncü bölümde ise ictihatta hata isabet probleminin sonuçları incelenmiş, tartışmanınpratik sonuçları kısmında tartışmanın lâfzûliği ve günah meselesi ele alınmıştır. Bubölümün ikinci kısmında ise tartışmanın furu'a yansımaları örnekler verilerekincelenmiştir.Tez bir sonuç ve bibliyografya ile sona ermektedir."
