abstract: "Katılım bankacılığı, finansal işlemleri şeriat ilkelerine uygun şekilde yürüten faizsiz bir bankacılık modelidir. Bu alanda, AAOIFI tarafından yayımlanan şeriat standartları, ürünlerin yapılandırılması ve denetlenmesinde temel bir referans kaynağıdır. Bu çalışmada, Türkiye'de faizsiz bankacılık sektöründe faaliyet gösteren katılım bankalarının AAOIFI şeriat standartlarına uyum düzeylerinin belirlenmesi ve karşılaştırılması amaçlanmıştır. Bu kapsamda faizsiz bankacılığın teorik temelleri ele alınarak dünyada ve Türkiye'deki tarihsel gelişimi incelenmiş, faizsiz finans uygulamalarında standartlaşmanın ve bu standartlara uyumun önemi tartışılmıştır. Bu araştırmada, AAOIFI tarafından yayımlanan 61 adet şeriat standardı, alan uzmanlarının katılımıyla gerçekleştirilen Delphi yöntemi aracılığıyla değerlendirilmiş ve tematik benzerliklerine göre 6 ana kategori altında toplanmıştır. Elde edilen bu kategorilerin göreli önem derecelerinin belirlenmesinde çok kriterli karar verme (ÇKKV) tekniklerinden Best Worst Method (BWM) kullanılmıştır. Son aşamada, Türkiye'de faaliyet gösteren katılım bankalarının AAOIFI şeriat standartlarına olan uyum düzeyleri, bulanık mantık temelli iki ayrı sıralama yöntemi olan Fuzzy TOPSIS ve Fuzzy PROMETHEE ile analiz edilmiştir. Bu analizler sonucunda hem standartların göreli ağırlıkları hem de bankaların bu standartlara ne ölçüde uyum sağladığı objektif ve sistematik bir biçimde ortaya konmuştur. Bu çalışma, Türkiye'deki katılım bankalarının AAOIFI şeriat standartlarına belirli düzeyde uyum sağladığını, ancak uygulamalarda farklılıklar bulunduğunu ortaya koymaktadır. ÇKKV yöntemleriyle yapılan analizler, politika yapıcılar ve uygulayıcılar için stratejik yönlendirmeler sunarken, faizsiz finansın sürdürülebilirliği için standartlaştırma ve denetimin güçlendirilmesi gerektiğine dikkat çekmekte ve bu alandaki literatüre metodolojik katkı sağlamaktadır. Analiz sonuçlarına göre A6 ve A3 bankaları en yüksek uyum düzeyini sergilerken, A4 bankası en düşük skoru almış; bu da bankalar arasında anlamlı düzeyde uyum farklılıkları olduğunu göstermektedir."
