abstract: "Hz. Peygamber'in vefatından sonra insanlar dini meselelerinin de Kurân ve sünnetten delil çıkarmaya güç yetirebilen müctehid imamlara yönelmişler ve onların içtihatlarıyla amel eder olmuşlardır. Zamanla insanların bu ihtiyaçlarını karşılamak için müctehid imamlar, ictihad mekanizmasını sistematik hale getirmişlerdir. Sistematize edilen bu yol sayesinde sorulara çözümler üretilmiştir. İnsanların bu tür ihtiyaçlarını karşılayan en önemli mezheplerden ilk ikisi şüphesiz ki Hanefi ve Maliki mezhepleridir. Hanefi mezhebi kurucu imamlarından ve özellikle Hanefi mezhebinin delillerini kaleme almış biri olan Muhammed b. Hasan eş-Şeybânî, mezhebin tekamülleşmesinde çok önemli yere sahiptir. Özellikle Ebu Hanife'nin ve Mâlik'in talebeliğini yapmış olan Şeybânî Malik'ten Muvatta'sını almış ve kendi delillerini de ekleyerek iki mezhebin delillerini mukayese yapmıştır. Her iki mezhebin ittifak ettikleri ve ihtilaf ettikleri yerlere değinmiştir. Her iki mezhebinde delilleri incelendiğinde, ihtilafların usul farklılıklarından doğduğu görülmektedir. Bu usuldeki farklılıklar fetvaları etkilemekte bazen usul farklılıklarına rağmen aynı fetvalar çıkabilmektedir. Bu durumda her iki mezhebinde kendine ait görüşlerini yansıtan has bir yöntem ve metodoloji takip ettiklerinin söyleyebiliriz."
