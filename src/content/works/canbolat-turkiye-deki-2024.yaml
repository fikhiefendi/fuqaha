abstract: "Geleneksel ve katılım endeksleri, yatırımcılar için farklı risk ve getiri profilleri sunan önemli finansal araçlardır. Geleneksel endeksler, geniş bir sektör yelpazesinde faaliyet gösteren şirketleri içerirken, katılım endeksleri, İslami finans ilkelerine uygun olarak faaliyet gösteren şirketleri kapsar ve bu iki tür endeks, piyasalardaki farklı dinamikleri yansıtır. Bu doğrultuda çalışmanın amacı, 2018Q2 – 2024Q1 döneminde, COVID-19 pandemisinin etkilerini de dikkate alarak şirketlerin performanslarının ve finansal sıkıntı risklerinin nasıl değiştiğini incelemektir. Çalışmada, Türkiye'deki BİST 50 ve Katılım 50 endekslerinde yer alan şirketlerin finansal performansları ve finansal sıkıntı riskleri analiz edilmiştir. Bu kapsamda, üç alt dönem (COVID-19 öncesi, COVID-19 etkisinin yoğun olduğu ve COVID-19 etkisinin azaldığı dönem) boyunca Entropi tabanlı TOPSIS ve Zmijewski X skor yöntemleri aracılığıyla analizler gerçekleştirilmiştir. Analizler sonucunda, BİST 50 endeksi madencilik ve taş ocakçılığı sektöründe faaliyet gösteren IPEKE, KOZAL ve KOZAA şirketlerinin her üç alt dönemde de yüksek performans sergilediği ve finansal sıkıntı risk düzeylerinin düşük olduğu tespit edilmiştir. Ayrıca Katılım 50 endeksinde ise imalat sektöründeki EGEEN şirketi üç alt dönemde de yüksek bir performans sergilemiştir. Ancak hem BİST 50, hem de Katılım 50 endekslerinde işlem gören ulaştırma sektöründeki PGSUS ve THYAO şirketleri, COVID-19 öncesi ve COVID-19 etkisinin azaldığı dönemlere nazaran COVID-19 etkisinin yoğun olduğu dönemde daha düşük finansal performans göstermiş ve yüksek düzeyde finansal sıkıntı riskiyle karşı karşıya kalmıştır. Sonuçlar, COVID-19 salgın sürecinin farklı sektörlerdeki şirketlerin finansal performansları ve sıkıntı riskleri üzerindeki etkilerini ortaya koyarak yatırımcılara ve şirket yöneticilerine önemli bilgiler sunmaktadır. Ayrıca, Katılım 50 endeksindeki şirketlerin daha sağlıklı bir finansal yapıya sahip oldukları ve daha az risk taşıdıkları belirlenmiştir. Bu bulgular ışığında, İslami finans ilkelerine uygun faaliyet gösteren şirketlerin kriz dönemlerinde daha sağlıklı bir finansal yapı sergiledikleri tespit edilmiştir."
