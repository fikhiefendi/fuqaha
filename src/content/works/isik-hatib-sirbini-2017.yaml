abstract: "İslâm hukukunun önemli bir parçasını teşkil eden kavâid, müstakil bir ilim olarak fıkıh ilminin oluşumunu takip eden dönemde ortaya çıkmıştır. İlk asırlardan hicri IV. asra kadar çoğalan içtihat ve fetvalar fukahânın eliyle sistematize edilmeye çalışılmış, bu bağlamda fakihler, dağınık bir şekilde bulunan meseleleri belli asıl ve kurallar altında bir araya getirmeye çalışmışlardır. Bu çabaların sonucunda meydana gelen kavâid ilmi, İslâm hukukunun ruhunu ve mantığını yansıtması açısından büyük bir önemi haizdir. Ayrıca fıkıh meselelerinin daha kısa sürede kavranması ve bir sistem içinde bellenip zabdedilmesi açısından büyük bir kolaylık sağlamaktadır. Bu çalışmada X/XVI. yüzyıl Şâfiî âlimlerinden biri olan ve mezhep içerisinde önemli bir konumda bulunan Hatîb eş-Şirbînî'nin, yine mezhep içerisinde mutemed eserler arasında zikredilen Muğni'l-muhtâc adlı eseri bey' bölümünde tespit edilen fıkhî kâide ve dâbıtlar ışığında, kavâid ilmi bağlamında değerlendirilmeye çalışılmıştır. Çalışma, iki bölümden oluşmaktadır. Birinci bölümde Şirbînî'nin hayatı, Muğni'l-muhtâc adlı eseri ve kavâid ilminin temel konuları hakkında malumat verilmeye çalışılmıştır. İkinci bölümde ise Şirbînî'nin söz konusu eserinde, kâideleri kullanımı hakkında bilgi verildikten sonra bey' bahsinde tespit edilen kâidelerin Şâfiî kavâid ve furû' eserlerindeki yeri ve işlenişi hakkında bilgiler verilmiştir. Aynı şekilde dâbıtlar da tespit edilmeye çalışılmış ancak dâbıtlara sadece Şirbînî'nin zikrettiği bağlam çerçevesinde değinilmiştir. Kâidelerin yer yer zikredildiği eserde, kâideler kimi zaman tam ibareleri ile bazen bir kısmının zikredilmesi ile ele alınmış, bazı yerlerde ise kâideye işaret edilerek dolaylı yoldan kâidelere atıflarda bulunulmuştur. Bu şekilde kâidelere yer verilmesi dağınık meselerelerin bir bütünlük içinde anlaşılmasını ve zabdedilmesini kolaylaştırmıştır. Müellifin bazen kendinden önceki fukahânın yolunu izleyerek kâideleri aktarması, kimi zaman da kavâid alanında bazı yeni uygulamarda bulunması konuya olan vukûfiyetini ve otoritesini göstermesi açısından önemlidir."
