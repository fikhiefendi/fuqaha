abstract: "Bu çalışmada kadının statüsü, din ve sosyal değişme bağlamında ele alınmaktadır. Modernleşmenin yol açtığı sosyal değişme ile birlikte kadının statüsünde önemli değişmeler meydana gelmiştir. Kadınların eğitim seviyeleri ve ekonomik bağımsızlıkları yükseldikçe toplumsal konumları da yükselmiştir. Bu süreç, kadınların geleneksel cinsiyet rollerinden uzaklaşıp yeni roller üstlenmelerine yol açmıştır. Erkeklerin yerine getirdiği çeşitli rolleri, kadınlar da üstlenmeye başladıkça, bir rol çatışması yaşanmaktadır. Erkekler, daha önce kıt kaynaklı statü ve ekonomik kaynaklar üzerindeki hâkim pozisyonlarını sürdürmek için bir takım dini söylemlere başvurmuşlar ve dini metinleri de kendi lehleri doğrultusunda yorumlamışlardır. Bu bağlamda çalışmanın birinci bölümünde ?Geleneksel Cinsiyet Rolleri? ve semavi dinlerde bu rollere bakış açısı ortaya konulmaktadır.Türkiye'nin Cumhuriyetle birlikte girdiği modernleşme sürecinde kadınlarla ilgili reformlar neticesinde kadının statüsünde de önemli değişmeler meydana gelmiştir. Tezimizin ikinci bölümünde de bu değişmeler ele alınmaktadır.Son bölümde de Diyanet İşleri Başkanlığı'nın kadınlarla ilgili fetvaları ve Kahramanmaraş Müftülüğü'ne sorulan sorular da değerlendirilerek araştırmanın bulguları üzerinde durulmuştur."
