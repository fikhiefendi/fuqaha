abstract: "ÖZET HCV dünyada kronik karaciğer hastalığının en önemli nedenlerinden biridir. Bu virus akut viral hepatitlerin yaklaşık %20'sinden, kronik hepatitlerin ise yaklaşık %60-70'inden sorumludur. Bunun yanısıra HCV siroz, son dönem karaciğer hastalığı ve karaciğer kanserinin de %30'unda etkendir. ACH'li olguların en az %75'inde kronik karaciğer hastalığı gelişir. KCH'nde uzun dönemde siroz ve HSK gelişme riskinin olması ve dolayısıyla mortalite oranının artışı tedavi konusunda yoğun çalışmaların yapılmasına neden olmaktadır. Bu çalışmada daha önce tedavi görmemiş KCH'li 19 hastaya ilk dört hafta günlük 5 MÜ, takiben haftada üç gün 5 MÜ alfa-İFN 2b ile indüksiyon tedavisi ve 19 hastaya ise haftada üç gün 3 MÜ alfa-İFN 2b + 1000-1200 mg/gün ribavirin kombinasyon tedavisi 12 ay süreyle verildi. Her iki tedavi protokolünün karaciğer fonksiyon testleri, virolojik göstergeler ve karaciğer histopatoloj isindeki değişimler üzerine etkisi araştırıldı. Ayrıca hastalarda infeksiyon etkeninin 85olası bulaş yolunu saptayabilmek için parenteral ve non parenteral bulaş yolları sorgulandı. Hastalar tedavi süresince her ay ve tedavi bitiminden sonra üç ayda bir olmak üzere altıncı aya kadar izlendiler. Tüm izleme dönemlerde karaciğer fonksiyon testleri, periferik kan bulguları bakıldı. Tedavinin birinci, üçüncü, altıncı, onikinci aylarında ve takip altıncı ayda HCV-RNA çalışıldı. Başlangıç ve kontrol karaciğer biyopsileri Knodell HAİ'ne göre değerlendirildi. Tedaviye alınan yanıtlar kısmi yanıt, tedavi sonu tam yanıt, kalıcı yanıt, yanıtsızlık ve relaps olarak değerlendirildi. Her iki tedavi grubunda ilaç yan. etkileri araştırıldı. İndüksiyon grubunda iki, kombinasyon grubunda altı hasta ilaç yan etkileri veya çalışma protokolüne uyumsuzluk gibi nedenlerle çalışmadan çıkarıldı. İnfeksiyon etkeninin hastaların %94.7'sinde parenteral yol ile bulaştığı tespit edildi. Tedavi süresince her iki grup karşılaştırıldığında, birinci ay sonunda indüksiyon grubunda beyaz küre ve trombosit, kombinasyon grubunda ise ALT ve hemoglobin değerlerindeki azalma daha belirgindi (p 0.05). İndüksiyon grubunda tedavi sonu biyokimyasal yanıt %64.3, kombinasyon grubunda %92.3'tü. Takip altıncı ayda ise biyokimyasal yanıt oranı indüksiyon grubunda %50, kombinasyon grubunda %53.8 bulundu. Kombinasyon 86grubunda takip altıncı aydaki ALT düzeyi normal hasta oranı, tedavi sonunda elde edilen orana göre düşüktü (p 0.05). Onikinci aydaki virolojik yanıt oram ise kombinasyon grubunda %84.6, indüksiyon grubuna ise %78.6 idi (p>0.05). Her iki tedavi grubunda karaciğer biyopsileri tedavi öncesi ve sonrası uygulanan tedavi rejiminden bağımsız olarak değerlendirildiğinde HAİ, PN ve KN, İD ve FN, Pİ skorlarındaki azalma istatistiksel olarak anlamlı, fibrozisde gözlenen azalma ise anlamsız bulundu. Her iki grubun başlangıç ve kontrol karaciğer biyopsilerinin toplam HAI'ndeki düzelme oranlan karşılaştırıldığında, kombinasyon grubundaki düzelme daha belirgindi (p>0.05). Tedavi sonu tam yanıt oram indüksiyon grubunda %41.2, kombinasyon grubunda %76.9 iken, kalıcı yanıt oranlan sırasıyla %35.3 ve %46.2 bulundu. Kombinasyon grubunda tedavi sonu tam yanıt ve kalıcı yanıt oranları indüksiyon grubuna göre daha yüksekti (p>0.05). İndüksiyon grubunda relaps oranı %14.3, kombinasyon grubunda %40 bulundu (p>0.05). İndüksiyon grubunda yanıtsız hasta oranı %16.7 iken, kombinasyon grubunda yanıtsız hasta yoktu. Tedavinin birinci ayında kombinasyon grubunda hemoglobin, indüksiyon grubunda beyaz küre ve trombosit değerlerinde belirgin azalma vardı (p<0.05). Kombinasyon grubunda üç (%15.8) hastada hemoglobin < 8.5 gr/dl olduğu için ribavirin tedavisi sonlandırıldı. Her iki grup arasında diğer ilaç yan etkileri açısından anlamlı fark gözlenmedi. Çalışmanın sonuçlan KCH'inde yüksek doz indüksiyon tedavisi ile birlikte ribavirin uygulanmasının, kalıcı virolojik, biyokimyasal yanıt oranlarında artışa ve daha iyi histolojik düzelmeye yol açabileceğini düşündürmektedir."
