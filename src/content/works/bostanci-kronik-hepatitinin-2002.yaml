type: "tez-doktora"
title: "Kronik C Hepatitinin Tedavisinde İnterferon Alfa-2b İndüksiyon Tedavisi ile İnterferon Alfa-2b ve Ribavirin Kombinasyon Tedavisinin Karşılaştırılması"
titleTranslation: {"en": "A Comparison of interferon alpha-2b induction therapy with interferon alpha-2b plus ribavirin combination therapy for the treatment of chronic hepatitis C"}
authors: ["Bostancı, Fatih"]
language: "tr"
year: 2002
university: "Erciyes Üniversitesi, Tıp Fakültesi"
city: "Kayseri"
department: "Klinik Mikrobiyoloji ve Enfeksiyon Hastalıkları Ana Bilim Dalı"
advisors: ["Bilgehan Aygen"]
topics: ["İslam iktisadı"]
