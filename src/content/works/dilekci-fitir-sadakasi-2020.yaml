abstract: "Sünnet, Hz.Peygamber'in (s.a.v) söz, fiil ve onayları (takrirleri) demek olup İslam düşüncesinin Kura'an-ı Kerim'den sonra teşrî' de ikinci ana kaynağını teşkil etmektedir. Hz.Peygamberin (s.a.v) ferdi-ictimai, maddi-manevi hükümleriyle dolu teşri' kıldığı hükümler vardır. Bu hükümlerden birisi de fıtır sadakasıdır. Biz de bu çalışmamızda fıtır sadakası ile ilgili rivayetleri Kütüb-i Sitte'yi baz alarak tespit ettik. Ayrıca bu rivayetlerden mezheplerin nasıl hüküm çıkardığını, mezheplerin ihtilaflarını, ihtilafların sebeplerini ve delillerini, mezheplerin fıkıh kitaplarından inceleyerek belirtmeye çalıştık."
