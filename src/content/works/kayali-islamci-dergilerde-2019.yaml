abstract: "Cumhuriyet döneminde etkin birer yayın organı olan İslamcı dergiler, toplumsal ve siyasi meselelerde muhalefet görevi sürdürmüşlerdir. Özellikle iktisadi açıdan ele alınan yazıların mahiyetini tespit edebilmek, bunların hangi bakış açılarıyla değerlendirildiğini ortaya koyabilmek asıl amaç olmuştur. Bu noktadan hareketle, seçilen iki İslamcı derginin içinde bulunan ekonomi yazıları 21 adet kavram etrafında incelemeye tabi tutulmuştur. Bu kavramlar etrafında iki derginin bakış açısı karşılaştırma yöntemiyle ortaya konulmuştur. Dergilerin kurucuları olan Necip Fazıl Kısakürek ve Nurettin Topçu için de yine aynı yöntem benimsenip, önce bu iki düşünürün iktisadi düşünce dünyaları ortaya konulmuş, ardından fikir ayrılıkları noktasında karşılaştırmalar yapılmıştır. Çalışmanın İslam Ekonomisi alanına katkı sunabilmesi amacıyla özellikle bu iki düşünürün iktisat ve İslam ekonomisine dair düşüncelerine ağırlık verilmiştir. Hem dergilerin hem de kurucularının kapitalist sistem karşısında alternatif bir sistem önerip önermediklerini tespit etmek bu çalışmanın asıl sorularından biri olmuştur. Çalışmanın nihai sonucu olarak; Büyük Doğu dergisinin daha çok siyasi muhalefet organı gibi hareket ettiği, Hareket dergisinin ise siyasetten uzak bir anlayışla zihniyet ve fikir odaklı bir çizgiye sahip olduğu tespit edilmiştir. Bu bağlamda Hareket dergisi özelinde Nurettin Topçu'nun İslam sosyalizmi söylemi ön plana çıkmıştır. Öyle ki Topçu; İslam ekonomisini uygulayabilecek olan devletin ancak sosyalist bir devlet olabileceğini ifade etmiştir. Tedbirci, devlet yönetiminin yoğun olduğu, müdahaleci bir anlayışın tavsiye edildiği görülmektedir. Her iki düşünür adına ortaklık taşıyan bazı noktalar da olmuştur. İki düşünürün de oluş felsefesinden etkilenmesi bunlardan biridir. Oluş felsefesinden hareketle Necip Fazıl“aksiyon”, Topçu ise“hareket”kavramını kullanmıştır. Bir diğer ortak bakış açısı ise hayatlarında ideolojik bir bakış açısına sahip olmalarıdır. Necip Fazıl İdeolocya Örgüsünü savunurken, Topçu'nun da İslam sosyalizmini ideolojik olarak benimsediği görülmüştür. Topçu ve Kısakürek'in farklılık arz eden düşünceleri arasında dikkat çekeni sanayi meselesidir. Kısakürek sanayileşmeyi kaçınılmaz olarak görürken, Topçu sanayileşmeyi toplumun ahlakı açısından felaket olarak değerlendirmiştir. Sonuç ve değerlendirme amacıyla ifade etmek gerekirse; her iki derginin ve her iki düşünürün, dönemin Türkiye'sinde toplumun nabzını tutarak tartışma konularına duyarsız kalmadıklarını, söz söyleme sorumluluğunu yerine getirdiklerini ifade edebiliriz"
