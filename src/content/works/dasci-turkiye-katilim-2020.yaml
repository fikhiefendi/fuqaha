abstract: "Müslümanlar, 20. yüzyılda modern finans piyasaları karşısında kendi değerlerine uygun alternatif banka arayışına girmiştir. Dünyada faizsiz bankacılık adıyla anılan bu alternatif bankalar Türkiye'de 2005 yılında yasal zemine oturtularak ''Katılım Bankası'' adını almıştır. Türkiye'de bankacılık sektör payı %5 olan katılım bankaları yapmış oldukları birtakım çalışmalarla bu oranı yükseltme çabası içerisindedir. Bu bankalar atıl durumda bulunan fonları, finans piyasalarına kazandırmak adına birtakım modeller geliştirmektedir. Türkiye'de, 2020 yılı itibariyle altı tane katılım bankası faaliyette bulunmaktadır. Bu altı katılım bankası içerisinde üç tanesi kamu sermayeli katılım bankalarıdır. Bu çalışma, Katılım bankacılık sektörünün reel ekonomiye etkisinin araştırılması üzerine yapılacak akademik çalışmalara katkı sağlaması amacıyla hazırlanmıştır. Yapılan tez çalışmasında Türkiye'de banka kredi kanalının etkinliği katılım bankacılık sektörü üzerinden değerlendirilmiştir. VAR modeli kullanılarak yapılan analizde para otoritelerince alınan kararların katılım bankacılık sektörü kredi miktarını etkilediği görülmüştür. Daraltıcı para politikalarının reel sektörü temsil eden sanayi üretim endeksini sınırlı şekilde etkilediği, reel sektörün katılım bankalarının kredilerine bağımlı yapı içerisinde olmadığı tespit edilmiştir."
