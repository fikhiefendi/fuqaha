abstract: "Bu çok değerli eserin yazarı şeyh Mustafa es-Safevî el-KaI'âvî. Âmîn\" lafzıyla ilgili fıkıh, belagat, irab açılarından ve onunla ilgli bir çok yönü açıklayan bu eser hicri 13. yüzyılın eserlerindendir. Bu kitap, sahip olduğu öneme rağmen bugüne kadar çalışılmadı. Dolayısıyla Allah Teala'dan yardım dilerek bu görevi yerine getirmek istedim."
