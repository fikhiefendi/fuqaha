abstract: "Gelişmekte olan ülkelerin ekonomik performanslarının en popüler teorik açıklamaları neo-liberal, yapısalcı-kurumsalcı, ?uçan kaz? ve bağımlılık yaklaşımı olarak sıralanabilir. Gelişmekte olan ekonomilerin işsizliği ve yoksulluğu aşabilmesi bağlamında Meksika ve Malezya örnek ülkelerdir. 1980 sonrası her iki ülkede de mamul ürün ihracatı hızla yükselmiştir. Bunun yanında, ihracatları içinde yüksek teknolojili ürün payı artmıştır. Meksika ve Malezya'nın performanslarında coğrafi konumları etkilidir. Meksika Amerika'nın sınır komşusudur, Malezya da Japonya'nın ekonomik hinterlandı içindedir. Bunu destekler biçimde, Meksika NAFTA anlaşması sonrası Amerika'dan, Malezya ise Plaza anlaşması sonrasında kalkış sürecinde Japonya'dan doğrudan yabancı yatırım almıştır. Meksika'da söz konusu yabancı yatırım girişinin ardından hızlı büyüme gerçekleşmiştir. Bununla birlikte, işsizlik oranındaki azalmaya karşın reel ücretler aşağı yönlü hareket içindedir. Çalışanların büyük bir kısmının ücret düzeyi yoksulluk seviyesindedir. Meksika'da düşük ücretler tam istihdama yakın bir işsizlik düzeyini sağlarken, Malezya'da tersine, işsizliğin azalması reel ücretleri yükseltmiştir. Malezya'da büyüme oranı hızı Meksika'nın yaklaşık üç mislidir. Bu çalışmada doğrudan yabancı yatırımlar ile ihracatın yıllar itibariyle seyrini ve sıralama düzeyinde bir ilişkinin varlığını sınamak amacıyla ekonometrik bir deneme yapılmıştır. Doğrudan yabancı yatırımlar ve ihracatın değişim oranları arasında özellikle gıda maddeleri, makineler ve ulaşım araçları, dokumacılık ve hazır giyim gibi sektörlerde eş yönlü hareket bulunmaktadır. İncelenen zaman aralığında, bazı yıllarda benzerlik göstermekle birlikte, gelişmekte olan ülkelerde imalat sanayisi alt sektörlerinde yabancı yatırım ihracat ilişkisi zayıftır. Bu, doğrudan yabancı yatırımın toplam ihracat payının düşük olmasına bağlanabilir. Dolayısıyla, doğrudan yabancı yatırım etkisini daha çok geri bağlantılar, istihdam ve teknoloji üzerinden göstermektedir. İhracat katkısı bulunmakla birlikte bunun payı düşüktür."
