abstract: "Bu çalışmada, Kur'ân-ı Kerîm perspektifinde rızık konusu ele alınmıştır. Çalışmanın birinci bölümünde rızık kavramı ve ilgili âyetlerde rızık kavramıyla beraber geçen kavramlar izah edilmiştir. İkinci bölümde de rızkın kaynakları, helal ve haram rızık çeşitleri, maddi ve manevi rızık çeşitleri, helal ve haram rızkın birey, aile ve toplum üzerindeki maddi ve manevi etkileri, helal rızkı artırmanın yollarına değinilmiştir. Helal kazancın insan hayatındaki maddi-manevi önemi, toplum düzenine katkısı açıklanmıştır. Bu çalışma yapılırken hadislerden, klasik ve modern müfessirlerin görüşlerinden istifade edilmiştir. Bu hedef doğrultusunda klasik ve modern tefsir kaynakları taranmış, mezheplerin farklı görüşleri de dikkate alınarak konu iyice araştırılmıştır. Sonuç olarak bu çalışma, helal rızkın bireysel ahlâk, maneviyat, sosyal adalet ve İslâm açısından ne kadar önemli olduğunu göstermektedir. Ayrıca bu konuda geliştirilecek bilinç ve hassasiyetin, toplumsal huzura ve refaha katkı sağlayacağı vurgulanmaktadır."
