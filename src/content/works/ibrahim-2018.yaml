abstract: "Araştırmada, göçün luğavî ve ıstılahî anlamları, göçün hakikati, nedenleri ve çeşitlerini ele aldık. Ayrıca araştırmada Hz. Âdem'den (s.a.) başlayarak tarihte vuku bulan önemli göç olaylarına değindik. Bu bağlamda Kur'ân'ı Kerîm'e ve onda var olan peygamber kıssalarını temel alarak ilk önce Avrupa ve Batı ülkelerinde, ardından Orta Doğu'da gerçekleşen bazı önemli zaman dilimlerinde meydana gelen olaylar neticesinde ortaya çıkan göçleri ve bu göçlerin etkilerini ele almaya çalıştık. Çalışmada ayrıca“Yurd (vatan)”kelimesinin tanımını ve Yurd'un kısımlarını ele aldık. Göç edene nispeten ateşkes yurdunun önemine vurgu yaptık. Daha sonra İslam hukukunda gönüllü ve zorunlu göçün hükümlerini; göçün vacip, haram ve helal olması açısından hükümlerini ve bunların dışında göç ile ilgili diğer hükümleri ele aldık. Göç eden kişinin Dârülislâm'a veya onun dışındaki diğer devletlere göç etmesinin hükümlerini açıkladık. Göç edenlere dair ibadet, muamelat ve diğer meselelere taalluk eden bazı hükümler insanlara karışık gelmiştir. Bu yüzden özellikle (örnek mahiyetinde) ibadetler ile ilgili bir takım hükümleri ayrıntılarına girmeden açıklamak üzere özel bir bölüm ayırdık. Son olarak elde ettiğimiz önemli sonuçları ele alarak çalışmayı sonlandırdık."
