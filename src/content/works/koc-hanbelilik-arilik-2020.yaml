abstract: "İslam düşüncesinin önemli mezheplerinden Hanbelîlik ile Eş῾arîlik arasında ilk dönemlerden başlayarak şiddetli tartışmaların olduğu görülmektedir. Mihne'nin sona ermesi ile birlikte gücünün zirvesine ulaşan Ahmed b. Hanbel ile Küllâbîler arasında yaşananlar iki mezhep arasındaki ilişkinin temelini oluşturmaktadır. Hanbelîler ile Küllâbîler arasındaki ilişki Ahmed b. Hanbel'in İbn Küllâb, Muhâsibî ve Kerâbîsî hakkındaki ifadelerinden başlanarak geniş bir şekilde incelenmektir. İki mezhep arasındaki ilişkinin arka planını teşkil eden Eş῾arî ile Berbehârî'nin görüşmesi de gündeme getirilmelidir. İki mezhebin III./IX. yüzyıldan itibaren üç yüz senelik tarihi seyri, Büveyhîler ve Selçuklular merkezli olarak incelenmektir. Büveyhîler döneminde Hanbelî kanatta İbn Batta ve İbn Mende, Eş῾arîliğe yönelik eleştirileri ile dikkat çekmektedir. Bu dönemde diğer kanatta ise mezhebin kurulmasını da sağlayan Bâkıllânî, İbn Fûrek ve Abdulkâhir Bağdâdî'nin isimleri ön plana çıkmaktadır. Selçuklular döneminde iki mezhep arasındaki tartışmaların boyutu şiddetlenerek devam etmektedir. Bu dönemde mezhep müntesiplerinin muhaliflerine yönelik eleştiri ve ifadeleri incelenmektir. Ebû Ya῾lâ el-Ferrâ ve Herevî başta olmak üzere birçok Hanbelî ismin eleştirilerine yer verilmektedir. Aynı şekilde Hatîb el-Bağdâdî, Kuşeyrî ve Cüveynî gibi Eş῾arî alimlerin düşünceleri de ifade edilmektedir. Ayrıca Nizâmülmülk sonrası Eş῾arîlerin Hanbelîlere yönelik sertleşen tavırları da göz ardı edilmemektedir. İki mezhep arasındaki tartışmaların tarihi seyrinin yanında meselenin fikri boyutu da çalışmanın kapsamına dahil edilmektedir. İki mezhep arasındaki tartışmaların merkezinde Allah'ın sıfatları ve halku'l-Kur'an meselesi bulunmaktadır. Bunun dışında iki mezhebin siyaset konusundaki yaklaşımları ve diğer tartışma konusu olan hususlar da zikredilmektedir."
