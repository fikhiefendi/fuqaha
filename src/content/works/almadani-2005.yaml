abstract: "Eserin içerisinde akaid ve tasavvuf ilimlerine dair bilgiler yer alsa da eser Hanefi fıkıh eserlerinden sayılır. Eserin daha ünce basılmamış olup el yazması halinde olması ve eserin yazarın yegâne eseri olması, eserin tahkikinin önemini ortaya koymaktadır. Ayrıca bu kitap, yazmaları kaybolmuş ve tahkik edilememiş bazı güvenli kaynaklardan da nakillerde bulunur. Küçük hacimli olmasından dolayı yolculukta taşınması kolay bir eser olmasının yanı sıra pek çok beldede bu eserin el yazmasının bulunması da eserin önemini ortaya koymaktadır. Tez, iki bölümden oluşmaktadır: 1. İnceleme: Bu bölümde yazarın hayatı ve eser incelenecektir. Yazarın hayatının inceleneceği bölümde, yazarın adı, nesebi, doğumu, vefatı, hocaları, seyahatleri, memleketi ve yaşadığı çağ incelenecektir. Kitabın inceleneceği bölümde de kitabın adı, yazara aidiyeti, yazma nedeni, eserin ana kaynakları, yazarın eserdeki metodu, el yazmaları hakkında bilgi ve son olarak tahkikte başvuracağımız metod işlenecektir. 2. Tahkik: Bu bölüm kitabın tamamının tahkikini içermektedir. Tahkik ettiğimiz kitap on bölümden oluşmaktadır: Birinci bölümü, fıkhi hükümlere temel teşkil etmesi itibariyle İslam akaidin ilkeleri hakkındadır. Sekiz bölüm de Hanefi mezhebine göre ibadetleri konu ediniyor. Son olarak onuncu bölüm ise tasavvuf ve tasavvuf adabı hakkındadır. Eser, Hanefi mezhebi kaynaklardan derlediği bilgileri özet bir şekilde sunmakta ve verdiği bilgilerin kaynaklarını belirtmektedir. Yazar bazen Hanefi görüşleri ile Şafii ve Maliki görüşleri arasında mukayese yapar. Yazar bu eseri, uzun seyahati esnasında yazmıştır. Nitekim eserin yazımına Türkiye'nin Sinop ilindeyken başlamış. Son düzenlemelerini ise Mısır'ın Kahire ilinde tamamlamıştır."
