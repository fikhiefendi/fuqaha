abstract: "Milletler tarihteki kökleriyle var olur, tarih boyunca ortaya koydukları eserlerle anılır ve bıraktıkları medeniyet eserlerine göre insanlık tarihindeki değerleri belirlenir. Fakat bu milletlere ait ilmî ve fikrî faaliyetler ortaya çıkarılmazsa, çok büyük bir medeniyet olsa bile kaybolup gitmeye mahkûm olur. Bu sebeple bir toplumun kültürel mirasını ortaya çıkarmada yazma eserlerin önemi çok büyüktür. Birçok el yazması eserimiz kütüphanelerde ortaya çıkarılmayı beklemektedir. Tezimizdeki hedefimiz bu yazmalardan birisini ortaya çıkarmaktır. Kemalpaşazade Osmanlı Devletinin en güçlü âlimlerinden birisidir. Tezimizin konusu onun henüz yazma halinde bulunan“Safvetü'l-Menkûlât”isimli eserinin edisyon kritiği ve değerlendirilmesidir. Eser namaz fıkhına aittir. Çalışmamız Müellifin anlatıldığı Dirase (Araştırma) ve eserin incelendiği Tahkîk (Edisyon Kritik) olmak üzere iki kısımdan oluşmakta dipnotlar ile gerekli açıklamalar yapılmaktadır."
