abstract: "Bu çalışma İbn Teymiyye'nin cihad doktrinine odaklanmaktadır. Cevap aradığı soru İbn Teymiyye'ye göre bir kafiri öldürme sebebi küfür müdür yoksa Müslümanlara karşı sergilenen düşmani davranışlar mıdır? Ayrıca konuyu biraz öteye götürüp kafirlerin Müslümanlara cizye ödemeden barış içinde yaşayabilmeleri mümkün müdür sorusuna da yanıt aramaktadır. Bunu yaparken de İbn Teymiyye'de maslahat kavramına merkeze alarak inceleme yapılmaktadır. Onu Mardin Fetvasında veya başka çalışmalarında geliştirdiği ülke kavramı üzerine durulmaktadır ve onun yazılarında ikiden fazla kavram bulunduğuna kanat ve delil getirilmektedir. Bu kavraları tartışırken onun diğer klasik ulemadan daha çok esnek olduğunu görebilmekteyiz. İkinci bölümün sonunda yukarıda bahsi geçen fetvanın modern dünyadaki öneminden ve yanlış kullanışından bahsedilmektedir. Bunu yaparken ülke, yöneticilerine ayaklanma, maslahat ve intihar saldırısı kavramları üzerinde durarak söylem analizi yapılmaktadır. Çalışmanın son bölümü ise Moğollara karşı ve kendi yöneticilerine karşı duruşunu değinmekte ve modern radical, selefi, modern İslamcı diye adlandırılan grupların çağdaş dünyada Batının etkisine karşı mücadelesinden bahsetmektedir. En önemlisi, böylesi grupların İbn Teymiyye'nin yazılarını kullanarak meşrutiyet kazanmayı çabaladıklarını görmekteyiz. Buna ek, bu grupların İbn Teymiyye'yi yanlış okuduklarını ve onlarla İbn Teymiyye arasındaki farkı vurgulamakatadır. Son olarak, Osmanlı ve günümüzdeki Türkiyesinde İbn Teymiyye'nin algısından bahsedilmektedir."
