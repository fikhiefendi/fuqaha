abstract: "İnsanlar arasında söz konusu olabilecek olan istismar ve iktisadi dengesizliği önlemeye çalışan İslâm hukuku, çeşitli tedbirler alma yoluna gitmiştir. Bu tedbirlerden bazıları da ?gabin? çerçevesinde mevzu bahis edilmiştir.İslâm hukukunda gabin denince ?bedeller arasındaki oransızlık? anlaşılmaktadır. Türk hukukunda konu edinilen ?gabin?, tam birebir örtüşmemekle beraber klasik fıkıh kaynaklarında ?tağrîrli gabin?, çağdaş fıkıh kaynaklarında ise ?istiğlâl? kavramlarıyla ifade edilmektedir.?İslâm Borçlar Hukukunda Gabin? isimli tezimiz, ?Giriş? ve ?Sonuç? kısımları hariç üç bölümden oluşmaktadır.Birinci bölümde, teze temel teşkil etmesi için tasarruf, irade beyanı ve akid kavramları açıklanarak, hükümsüzlük teorisi ve iradeyi bozan sebepler ele alınmıştır.İkinci bölümde gabnin tanımı yapılmış, gabnin mahiyeti, hukuk sistemlerindeki yeri, unsurları, çeşitleri, uygulama alanları ve hukukî niteliği üzerinde durulmuştur.Üçüncü bölümde ise gabnin hukukî sonuçları ve gabin davası üzerinde durulmuştur.Sonuç olarak İslâm borçlar hukukunda üç boyutlu bir gabin telakkisinin mevcut olduğu, gabne değişik fıkıh âlimlerinin farklı hukukî sonuçlar bağladığı tespit edilmiştir"
