abstract: "Kurumsal özelliklerin ekonomik performans üzerindeki etkisini inceleyen çok sayıda araştırma bulunmaktadır. Bu çalışmalarda genelde ekonomik büyümenin kurumlara bağlı olarak gerçekleştiği üzerinde durulur ve kurumların diğer ekonomik göstergeleri de anlamlı şekilde etkilediğine değinilir. Eşitsizlik, kurumların çeşitli kanallar üzerinden etkisine maruz kalır ve büyük oranda kurumlar tarafından şekillendirilir. Son yıllarda eşitsizlikte yaşanan artış bu alandaki araştırmaların artmasına ve önem kazanmasına neden olmuştur. Toplumun geniş kesimlerini etkileme gücüne ve yıkıcı sosyal ve ekonomik etkilere sahip olan eşitsizlik, küresel bir problemdir. Kurumların politik güç elde eden farklı çıkar grupları tarafından manipüle edilmesi eşitsizliğin artmasına sebep olmaktadır. Kurumlarda yaşanan bozulma eşitlikçi politikaların hayata geçirilememesine yol açar ve elitlerin rant arayışına hizmet eder. Kamudan elitlere servet aktarımı kolaylaşır ve eşitsizlik artar. Bu doğrultuda yolsuzluk; kurumlardaki bozulma, idealden uzak işleme ya da işleyemez hale gelme durumu olarak kavramsallaştırılmıştır. Kurumsal özelliklerin eşitsizlik ile ilişkisi ölçülmüştür. İki değişken arasında ilişki kurmayı hedefleyen önceki çalışmalarda nedensellik ilişkisinin yönü her iki şekilde de ele alınmıştır. Bağımlı değişken olarak bazı çalışmalarda eşitsizlik bazı çalışmalarda yolsuzluk araştırmaya dahil edilmiştir. Değişkenler arasında çift yönlü nedensellik ilişkisinin bulunduğunu iddia eden çalışmalar da mevcuttur. Ayrıca ilişkinin yönünü pozitif ve negatif olarak saptayan çalışmalara rastlanır. Eşitsizlik konusundaki çalışmalar genellikle gelişmiş ülkelere odaklanır ve eşitsizliğin dikkat çekici oranda yüksek olduğu İslam ülkeleri ihmal edilir. Bu nedenle araştırmada 14 seçili İslam ülkesinde yolsuzluğun gelir eşitsizliği üzerindeki etkisi incelenmiştir. 2003 ve 2011 yılları arasındaki veriler ile Panel Veri analizi gerçekleştirilmiştir. Analiz sonucunda yolsuzluk ve eşitsizlik arasında anlamlı ve pozitif bir ilişki olduğu tespit edilmiştir. Ülkelerin Yolsuzluk Algı Puanında gerçekleşen %1'lik bir düzelme Gini katsayısını %0.25 azaltmaktadır."
