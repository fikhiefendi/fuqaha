abstract: "İslam âlimleri arasında fıkhî ihtilaf olgusunun var olduğu ve hissedildiği görülmektedir. Zira Allah birdir, Peygamber birdir, Şeriat birdir ve biz bütün peygamberlere iman etmekteyiz. Buna rağmen bir taraftan bu fıkhî ihtilaf ortaya çıkmış, diğer taraftan ise İslam düşmanlarının dini ve onun bağlayıcılığını zayıflatmak için çalıştıkları görülmüştür. Bunun sebebi, söz konusu fıkhî ihtilafın etkisiyle İslam fıkhını sorgulamalarıdır. Bütün fakihler, hüküm istinbatında Kur'ân ve Sünnet'in iki temel kaynak olduğu hususunda ittifak etmişlerdir. Bunun dışındaki konularda ise ihtilaf etmişlerdir. Furû' meselelerdeki ihtilaf ise bir problem teşkil etmez. Nitekim ihtilaf, Peygamber Efendimizin sahâbeleri arasında da mevcut olmuştur. Bunun en meşhur örneklerinden biri, Peygamber'in“İkindi namazını (Asr) ancak Benî Kurayza'da kılınız”şeklindeki hadisidir. Aynı şekilde ihtilaf, tâbiîn arasında ve imamlardan günümüze kadar devam etmiştir. Bu ihtilaflar sebebiyle tartışmaya ve çatışmaya gerek yoktur. Zira birçok insan Şeriat ile fıkıh arasındaki farkı ayırt edememekte, bu durum ise çekişmelere yol açmaktadır. Şeriat, Kitap ve Sünnet anlamına gelmektedir ve vahiy değişmez. Fıkıh ise zaman ve mekâna göre yenilenen bir beşerî anlayıştır. Şer'î hükümlerin önemli bir kısmı zannî delillere dayandığından ihtilaf ortaya çıkmaktadır.“Şeriat”terimi kullanıldığında, Kur'ân ve Sünnet olmak üzere vahyin iki türü kastedilir.“Fıkıh”terimi ise Kur'ân ve Sünnet'te yer alan ilâhî nasları anlamaya yönelik insanî çabayı ifade eder. Bu anlayış ve onun sınırları çerçevesinde söz konusu naslar pratik hayata uygulanır. Bu bağlamda, üzerinde ittifak edilen hususlarda iş birliği yapılması, ihtilaf edilen konularda ise hoşgörülü davranılması ve mezhep taassubu ile ayrışmanın şiddetinin azaltılması yönünde arzulanan hedefe katkı sağlaması ümidiyle bu araştırmanın önemi ortaya çıkmaktadır."
