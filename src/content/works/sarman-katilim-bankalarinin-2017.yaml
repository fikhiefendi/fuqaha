abstract: "KATILIM BANKALARININ PERFORMANS ANALİZİ Katılım bankaları bankacılık sisteminin tamamlayıcıları olup, çeşitli sebeplerle sistem dışı kalmış atıl fonları, sisteme kazandırmışlardır. Bu bankalar fon kullanan sanayici ve iş adamlarına alternatif finansman imkânı sağlamışlardır. Kar zarara katılma esasına dayalı olarak çalışan Katılım Bankaları bu sistemin ve sağlıklı fon kullandırma yöntemlerinin tabii bir sonucu olarak ekonomide yaşanan mali ve ekonomik krizlerden daha az etkilenmektedirler. Tasarrufçu kesime tatminkâr getiri dağıtabilmişlerdir. Ticari ve sınai kesime rekabetçi ve ekonomik maliyetlerde fonlama yapabilmişlerdir. Düzenli kamu denetimleri sistemin gelişmesine önemli katkı sağlamıştır. Katılım bankaları DİBS'lere yatırım yapmadığı için kaynaklarını ülkemiz firmalarına fon olarak kullandırmayı esas alan bir iş planına sahiptir. Katılım Bankaları Körfez sermayesinin Türkiye'ye çekilmesinde önemli bir rol oynayabilirler. Türk hazinesinin geçtiğimiz aylarda ihraç ettiği Kira Sertifikası ihraçlarıyla kaynak açığı bulunan ülkemize bu bölgeden önemli miktarda sermaye çekilmesi mümkün olabilecektir. Bu nedenle, söz konusu mali aracın çıkarılması ekonomimize olumlu katkı sağlamıştır. Bugüne kadar 42 Milyar TL'nin üzerinde Kira Sertifikası ihracı gerçekleştirilmiştir. Katılım Bankalarımız uluslararası piyasalardan muhtelif yapılandırılmış finansman ürünü ile uygun maliyet ve vadelerle borçlanma imkânlarını her geçen gün artırmakta olup bu imkânlarını müşterilerinin rekabet avantajı sağlayacağı fon kullandırımlarına dönüştürmektedir. Körfez bölgesinden sendikasyon yoluyla temin edilen ve giderek yaygınlaşan“Murabaha”finansmanında önemli rol almaktadırlar. Ülkemizde yeni gelişen bu finansman modelinden şu ana kadar 2 (iki) Milyar Doları aşan tutarda finansman temin edilmiştir. Özet olarak bilançonun pasifinde yer alan ve halktan toplanan tasarrufların oluşturduğu yükümlülüklerde; kar zarara katılma yöntemi sabit oranlı yükümlülüğe nazaran katılım bankalarına rahatlık sağlayarak krizlerin aşılmasına yardımcı olmuştur. Faiz riski almayan katılım bankaları, açık pozisyon yapmayarak kur riski de yüklenmemişlerdir. Bilançonun aktifinde yer alan kredilerde; bu bankaların çalışma prensipleri gereğince fonların mutlaka bir proje veya emtia ve ekipman tedariki karşılığında kullandırılması ve finansman bedelinin işletme yerine işletmeye mal ve hizmet temin eden satıcıya fatura karşılığında ödenmesi, bu fonların veriliş amacı dışında, riskli ve spekülatif alanlarda kullanımını önlemektedir. Ayrıca bu yöntem kullandırılan fonun ve firmanın kontrolünü kolaylaştırmaktadır. Fonların taksitli kullandırılması ve genellikle taksitlerin aylık tahsil edilmesi seyyaliyeti ve emniyeti arttırmaktadır. Fonların fatura karşılığı kullandırılması, işletmenin ihtiyacından fazla fon kullanmasını engelleyerek finansmanda irrasyonel davranışları önlemektedir. Diğer taraftan, katılım bankalarının kendi bünyelerindeki fon kullandırma yöntemlerinden olan finansal kiralama yöntemi, fon kullanan firmaların nakit akımlarına uygun tarzda fonlanmasında ve finansmanın fon kullandırma tekniğine başka bir ifadeyle yatırımının uzun vadeli finansmanla yapılması ilkesine uygun olmasını sağlamaktadır. Bu yöntemler, katılım bankalarının kullandırdıkları fonların emniyetini artırarak aktif kalitesini yükseltmektedir. Ayrıca, Katılım Bankaları bütün finansman sağlama işlemlerini prensipleri gereğince faturaya veya bir belgeye dayandırdıkları için kayıt dışı ile mücadele konusunda devlete yardımcı olmaktadırlar. Neticede Katılım Bankacılığı; sadece faizsizlik özelliği olan bir bankacılık türü değil, aynı zamanda bilançonun pasifindeki yükümlülüklerin riskini azaltıcı, aktifindeki kredilerin emniyetini ve dolayısıyla aktif kalitesini arttırıcı özelliği olan bir bankacılıktır. Tarih. 18.08.2017"
