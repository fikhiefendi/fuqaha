abstract: "Şer'u men kablena, daha önceki peygamberlerin, bizim şeriatımız(dinimiz) tarafından neshedildiği açıklanmayan şeriatlarıdır. Âlimler, Hz.Peygamber'in önceki şeriatlarla amel edip etmemesi hususunda ihtilaf etmişlerdir. Bir görüşe göre Hz.Peygamber, kendisine peygamberliği bildirildikten sonra eski şerîatların hükümleriyle amel etmiştir. İkinci bir görüş, Hz.Peygamber, kendisine peygamberlik bildirildikten sonra eski şerîatların hükümleriyle amel etmemiştir. Üçüncü bir görüşe göre eski şerîatların hükümleri Müslümanlar için de bağlayıcıdır. Artık bunlar Hz.Muhammed(s.a.v.)'in şerîatı haline gelmişlerdir. Sonuç olarak önceki şeriatlara ait hükümler, temel kaynaklarla(nassda) haber verilmiş ve neshedilmemiş olmak şartıyla uygulanabilir.Hz. Muhammed (s.a.v.)'i müslüman olarak gören, O'nun sohbetinde bulunan ya da O'nunla gazveye katılan ve mümin olarak ölen kimselere sahâbî denilmiştir. İslami ilimler içerisinde bu kadar önemli bir yere sahip olan sahâbî sözlerinin hukûki değeri araştırmamızın konusunu oluşturmaktadır. Araştırmalarımız sonucunda yaptığımız tesbitleri kısaca şöyle ifade edebiliriz: Sahâbîlerin icmâı olarak adlandırılan söz ve uygulamaları müminler için bir hüccettir. Hüccet olmadığı yönünde bazı aykırı görüşler kabul görmemiştir. Sahabilerin kendi aralarında çeşitli konularda ihtilaf etmeleri mümkündür. Bu ihtilafların ortaya çıkmış olması onların fikirlerini özgürce ortaya koyduklarının bir göstergesi olarak kabul edilmiştir. Sahabi sözleri, önde gelen mezhep imamları tarafından hüccet olarak kabul edilmiştir. Çoğunluk usülcüler de sahibi sözünü fer'i bir delil olarak İslam Hukuk Metodolijisinde deliller konusu içerisinde değerlendirmişlerdir."
