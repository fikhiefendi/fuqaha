abstract: "Zekât, İslam'ın emrettiği mâlî ibadetlerin başında gelmektedir. Bu ibadetin amacı, toplum içerisinde bulunan zenginler ile fakirler arasında oluşabilecek sosyal ve ekonomik olumsuzlukları ortadan kaldırmak ve toplum içerisindeki her Müslümanın aslî ihtiyaçlarını karşılayabilecek bir refah seviyesine ulaştırmaktır. Zekâtın özünde malları temizlemek ve ruhu tezkiye etmek vardır. Zekât, her Müslümanın üzerine farz olmamakla birlikte; kişi gerekli şartları sağlaması halinde, mallarından zekâtını ayırıp, Allah'ın Tevbe Sûresi'nde belirlediği sınıflara, zekât müessesesi aracılığıyla ulaştırmak zorundadır. Zekât, İslamî esasları benimsemiş bir otoritenin yani İslam devletinin bir organı olarak düzenlenmeli; toplanıp, dağıtılmalıdır. Çünkü Peygamberimiz (S.A.V.) döneminde bu şekilde uygulanmış ve çeşitli delillerle de bu ibadetin organizasyonunun, İslam devletinin bir görevi olduğu belirtilmiştir. Fakat kısa bir süre sonra zekât ibadeti, devletin bir organizasyonu olmaktan uzaklaşarak ferdî olarak ifâ edilen bir yapıya dönüşmüştür. Günümüzde Malezya, Endonezya, Suudi Arabistan gibi ülkelerde zekâtın devletin akredite ettiği bir organizasyon aracılığıyla toplanıp, belirlenen sınıflara dağıtılması hususunda çalışmalar yapılmaktadır. Böylece ferdi olarak yapılması halinde amacına ulaşmasından uzak olan sonuçlara verimli bir şekilde ulaşılabileceği düşünülmektedir. Bu bilgiler ışığında, günümüzde zekâtın devletin organize ettiği özel bir yapıda faaliyet gösterecek bir organizasyon ile Türkiye'de uygulanması mümkündür. Ülkemizin hukûkî şartlarını göz önüne alarak oluşturduğumuz model ile Türkiye'de zekât potansiyeline ulaşacağını düşünmekteyiz."
