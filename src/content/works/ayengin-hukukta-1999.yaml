abstract: "ÖZET DOKTORA TEZİ HUKUKTA KÖKEN PROBLEMİ AÇISINDAN SOSYAL REALİTE NASS İLİŞKİSİ Tevhit A YENGİN Danışman: Prof. Dr. Beşir GÖZÜBENLİ 1999, SAYFA: XVUI + 289 Jüri: Prof. Dr. Beşir GÖZÜBENLİ Sosyal hayatın ayrılmaz bir parçası olan hukuk; teoloji, felsefe, sosyoloji, ant ropoloji, psikoloji, ahlâk, hukuk bilimi, felsefesi ve metodolojisi gibi ilgi alanları farklı bilimler tarafından, doğrudan ya da dolaylı olarak incelenmektedir. Bunlardan hukuk felsefesi, sosyolojisi ve metodolojisi alanında yapılan çalışmalar, hukukun kökeni problemi ekseninde yoğunlaşmakta ve bu sorun; olgu, ide ve bu iki yaklaşımın sentezi referans alınmak suretiyle tartışılmaktadır. Olgucular, hukukun kökenini evrendeki in sanlar arası somut ve ampirik ilişkilerde; idealistler soyut, aşkın, ussal, pozitivite üstü bir evrende veya irâdede; sentezciler ise, realite ve idenin her ikisinde aramışlardır. İslâm hukuk metodolojisinde köken sorunu, ilâhî, beşerî ve toplumsal irâdenin boyutları bağlanımda değerlendirilmektedir. İlâhî irâde, ölümlüler dünyasına vahiy yo luyla ulaştırılan metin içerisinden, indiği ortama müdahale ediş biçimi ve gayesi gözeti lerek, çıkarılmaktadır. İnsan ve sosyal realite ise; hukuk oluşturma, yorumlama ve uygu lamadaki görev, yetki ve fonksiyonları açısından köken olabilmektedir. Çalışmamız yukarıda değindiğimiz konuların açılımım içermektedir. Hukukun kökenini ide ve realitede arayan hukuk okullarının metodolojik farklılıklarına işaret ettikten sonra, nassın ilk muhataplarının Kur'ân'ın inişinden önce benimsemiş oldukları sosyal realite ve buna dayalı tekil eylemlerin vahyin içeriği ve yönü üzerindeki etkisinin uzantılarına, gaye problemi açısından, açıklık getirmek istedik. Bu sebeple, nassın in diği tarihî ortamın sosyal, kültürel, dilsel ve hukuksal yapısına, nassın sosyal realiteyi gözetme, değiştirme ve bu değiştirmede güttüğü amaç açısından, işaret ederek bu husu su birkaç örnekle açıklamaya çalıştık. Çalışmamızın sonunda, sosyal realitenin rolünün nassın inişine sebep olmakla sınırlı olduğunu, nassın yönünü ve hedefini belirlemede etkin olmadığım gördük."
