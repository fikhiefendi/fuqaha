abstract: "İç Anadolu'nun Kuzeyinde, tipik bir Orta Anadolu kenti olan Çankırı?da XIX. Yüzyılın İlk yarısında yaşamış ailelerin hukuki, sosyal ve ekonomik yapıları, mahkeme kayıtları olan şer?iye sicilleri incelenerek anlaşılmaya çalışılmıştır. Yapılan araştırmanın amacı, Osmanlı Devletinin köklü yapısal ve sosyal değişimler yaşadığı bu dönemde, Çankırı örneğinden yola çıkarak, Anadolu?da yaşayan Osmanlı ailesinin ve dolayısıyla toplumunun yapısını anlamaya çalışmaktır. Bu çalışmada kaynak olarak kullanılan şer?iye sicilleri, şer?iat mahkemelerinde adalet sağlayan kadıların ilgilendikleri her konu ile ilgili tuttukları defterlerdir. Çankırının 18, 21, 22, 23, 25 ve 26 numaralı şer?iye sicil defterleri baz alınarak araştırma şekillendirilmiş, bu defterler içinde yer alan özellikle ilam ve tereke kayıtları incelenmiştir. Şer?iye sicillerine yansıyan belgeler ışığında, XIX. Yüzyılın ilk yarısında Çankırılı ailelerin hukuki ilişkilerinin, sosyal ve ekonomik hayatının açığa çıkarılması çalışmanın içeriğini oluşturmaktadır. XIX. Yüzyılın ilk yarısını kapsayan dönemde, Çankırılı ailelerin hayatlarının incelendiği çalışmamızın sonucunda, Osmanlı Devletinin yönetim ve elit kesiminde yaşanan değişimin Osmanlının sıradan tebaası arasında aynı hızla kendini göstermediği, Anadolu?da ailelerin geleneksel, muhafazakar ve sade yaşantılarını devam ettirdikleri anlaşılmaktadır."
