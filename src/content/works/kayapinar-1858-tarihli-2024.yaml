abstract: "Osmanlı Devleti, Tanzimat devrinde yeniden yapılanma işine girişmiştir. Bu devirde birçok ıslahat girişiminde bulunulmuştur. Ceza hukuku da bu ıslahat girişimlerinden nasibini almıştır. 1840 ve 1851 tarihlerinde iki ceza kanunnamesi ilan edilmiş ve nihayetinde 1858 tarihinde Ceza Kanunname-i Hümayunu meriyete girmiştir. Kanunun hazırlanmasında 1810 tarihli Fransız Ceza Kanunu'ndan (Code Pénal) hayli istifade edilmiştir. Bu istifadenin ne derece olduğu doktrinde tartışmalıdır. Kanunname hakkında doktrinde tartışmalı olan bir diğer husus da kanunnamenin şer'î hukukla olan irtibatıdır. Bu çalışmada temel olarak bu iki tartışma ele alınmıştır. Fransız Ceza Kanunu ile olan irtibatın derecesi, ki kanun arasında benzerlik ve farklılıklar tespit edilip, mukayese edilerek ortaya konulmaya çalışılmıştır. Şeri hukukla olan irtibatta ise öncelikle kanun hükümlerine bakılmıştır. Kanun hükümlerinin şer'î hukukla olan irtibatı tespit edilmeye çalışılmıştır. Ancak bununla yetinilmemiş daha doğru bir neticeye ulaşabilmek için alakalı hükümlerin tatbikattaki durumu ele alınarak bir neticeye ulaşılmaya çalışılmıştır. Çalışmada, Fransız Ceza Kanunu ile irtibatlandırılabilecek birçok hüküm bulunmakla beraber farklılıklar göz önüne alındığında kanunnamenin tam tercüme olarak vasıflandırılamayacağı ve kanunnamenin şer 'î hukuk dairesi içinde değerlendirilebilecek bir örfî hukuk tatbikatı olduğu neticelerine ulaşılmıştır."
