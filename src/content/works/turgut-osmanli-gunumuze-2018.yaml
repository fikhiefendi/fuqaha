abstract: "Etik, bir bireyin ne yapması gerektiğini ve en iyi davranış biçimini gerekçeleriyle birlikte belirlemeye çalışır. Diğer bir deyişle doğru ve yanlışla ilgili insanlığın üzerinde mutabık kaldığı ilkeleri ifade eder. Meslek etiği ya da diğer adıyla mesleki ahlak kuralları, bir mesleği yerine getirirken uyulması gereken ideal davranışlar olarak tanımlanabilir. Yargı ve hukuk etiği ise, bu görevi yerine getiren hâkimlerin ve diğer makamların yapması gerekenleri belirleyen kurallar olmakla beraber bunun ötesine geçerek mesleki faaliyetlerin doğru bir şekilde yerine getirmeleri için yapılması gerekenin ne olduğunu da belirler. Yargı görevini yerine getirenlerin, öncelikle etik ilkeleri anlaması ve bu ilkelere bağlı olması gerekir. Türk Hukukunda, İslam'ın kabulü ile beraber, İslam Hukuk kuralları uygulanmaya başlanmıştır. Osmanlı Devletinde yargı yetkisi kadılar tarafından yerine getirilmiş, kadıların seçimi, tayin ve niteliklerine ilişkin konulara oldukça önem verilmiştir. Kadıların nitelikleri hakkında, Mecelle'de hüküm altına alınmış önemli vasıflar bulunmaktadır. Günümüzde ise Yargı etiğine ilişkin kural ve ilkeler ulusal mevzuatta Anayasa ve özel kanunlarda hüküm altına alınmıştır. Ayrıca Uluslararası alanda kabul edilen ilkeler bulunmaktadır. Hâkimler için Bangalor Etik İlkeleri, savcılar için Budapeşte İlkeleri, avukatlar için de Havana Kuralları bunların başında gelmektedir. Bu çalışmada Osmanlı Devleti'nden günümüze Türk hukukunda yargı etiği üzerinde durulmuş, ideal bir hâkim savcı ve yargı etiği için önerilerde bulunulmuştur."
