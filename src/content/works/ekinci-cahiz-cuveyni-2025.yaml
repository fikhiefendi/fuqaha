abstract: "Bu çalışma, İslam siyaset düşüncesinde merkezi bir yere sahip olan imâmet kurumunu, kelâm geleneğinin iki önemli ismi olan Câhiz (ö. 255/869) ve Cüveynî (ö. 478/1085) ekseninde karşılaştırmalı olarak ele almaktadır. Her iki düşünür de imâmetin, toplumsal düzenin devamı açısından zaruri olduğunu savunmakta; ancak bu kurumun meşruiyet zemini, tayin yöntemi, imamda bulunması gereken nitelikler ve ümmetin siyasal temsil modeli gibi konularda birbirinden ayrılan teoriler ortaya koymaktadır. Câhiz'ın görüşleri, mensubu olduğu Mu'tezilî ekolün rasyonalist çerçevesinde şekillenmiş; maslahat, akıl ve kamu yararı temelli bir imâmet anlayışı öne çıkmıştır. Cüveynî ise Eş'arî gelenek içinde, nas ve akıl arasında denge kuran sistematik bir yaklaşım sergilemiş, imâmetin hem şer'î hem aklî delillerle zorunlu olduğunu savunmuştur. Her iki düşünürün, yaşadıkları siyasi ve sosyo-kültürel bağlamların etkisiyle imâmet teorilerini inşa ettikleri görülmektedir. Tezde, öncelikle kavramsal arka plan ortaya konulmuş; ardından Câhiz ve Cüveynî'nin imâmet konusundaki görüşleri, imâmetin vücûbiyeti, nas ve tayin, imamda aranan şartlar, ideal imamın görevleri, seçici kurul, azil ve çoklu imâmet gibi alt başlıklar çerçevesinde detaylı biçimde karşılaştırılmıştır. Son bölümde ise bu iki müellifin görüşlerinin çağdaş İslam siyaset düşüncesine etkileri ve günümüzdeki hilâfet-imâmet tartışmalarıyla ilişkisi değerlendirilmiştir. Bu yönüyle çalışma, sadece iki klasik düşünürün mukayesesiyle sınırlı kalmayıp, İslam siyaset düşüncesinin teorik temellerine dair tarihsel sürekliliği ve günümüzle bağlantısını da ortaya koymaktadır."
