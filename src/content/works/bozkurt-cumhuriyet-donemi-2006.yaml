abstract: "ÖZETCUMHUR YET DÖNEM LM HAL ÇALIŞMALARI VE PROBLEMLERlmihaller özellikle, halkın temel dini bilgileri kolaylıkla öğrenebilmesi içinyapılmış çalışmalardır ve bu isimle daha çok Türk toplumlarında yaygın olarakbilinmektedirler. lmihaller genelde konuları sade ve basit anlatımı ile bilinençalışmalardır. Bu çalışmamız üç ana bölümden oluşmaktadır. Birinci bölümdeTürkiye'de cumhuriyet döneminde yapılan ilmihal çalışmaları, hazırlayanları, amaçları,yöntemleri, muhtevaları ve bazı önemli görüşleri ile incelenmeye çalışılmıştır. Çalışmadailmihaller, hacimleri, konuları, mezhepleri gibi, çeşitli yönleriyle gruplandırılmaksuretiyle de incelenmiştir. Bu bölümde ayrıca lmihallerin faydaları, yazılma gerekçelerive kısaca tarihçesinden de bahsedilmiştirTez de yapılan çalışmalardan ve araştırmalardan biri, cumhuriyet dönemindeyapılan ilmihal çalışmalarında görülen problemlerdir. Tezimizin bu bölümündelmihallerde görülen problemler üzerinde tespitler, tetkikler, değerlendirmeler vetenkitler yapılmış ve bu problemlerin çözüm yollarına dair önerilerde bulunulmuştur.Çalışmada son olarak iyi bir ilmihal nasıl olmalıdır sorusuna cevap verilmeyeçalışılmış, bununla ilgili faydalı olacağı düşünülen bazı öneriler de bulunulmuştur."
