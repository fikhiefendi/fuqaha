abstract: "İnsanoğlunun fıtratında olan estetik algısı ve buna bağlı olarak gerçekleştirilen estetik müdaheleler insanlık tarihi boyunca birey ve toplum nezdinde önemli bir yer teşkil etmiştir. Fıkıh ilmi de birey ve toplum hayatını dinî bakış açısıyla düzenleyen bir ilim olması bakımından bedene yapılan estetik müdaheleleri konu edinmiş, her dönemin konuyla ilgili teknik uygulamaları fıkhî bakış açısıyla değerlendirilmiştir. Teknolojinin ilerlemesi ve değişen estetik algısına paralel olarak günümüzde daha önce mevcut olmayan çeşitli tıbbî estetik işlemler ortaya çıkmıştır. Tezimizde söz konusu estetik müdahelelerin fıkhî olarak temellendirmesine gayret gösterilmiştir. Bu bağlamda sözkonusu çalışmada öncelikle İslam'ın estetik anlayışı, fıkhın temel kaynağı olan Kur'ân'da güzel ve güzelleşmeyle ilgili kavramlar üzerinden anlatılmıştır. Sonrasında ise esasında bedenin saygınlığı, dokunulmazlığı ve Allah'ın yarattığını değiştirmenin yasaklığı gibi fıkhın bazı ilkelerini ihlal anlamına gelen kozmetik tıbbî estetik müdahalelerin yasaklığı ve zaruret veya ihtiyaç gibi istisnâî durumlarda meşruiyetinin temelleri makasıd teorisi bağlamında ele alınmıştır. Son olarak fıkhî temellendirmede tespit edilen illkeler ve illetler ışığında günümüzde uygulanan birtakım tıbbî estetik işlemlerin hükümleri ortaya koyulmaya çalışılmıştır."
