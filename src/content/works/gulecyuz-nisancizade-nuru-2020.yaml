abstract: "Bu çalışma, Nişancızâde Mehmed Efendi'nin kendisinden iki asır önce yaşamış Şeyh Bedreddin'in Câmiʿu'l-fusûleyn adlı eseri üzerine hazırladığı Nûru'l-'ayn adlı eser hakkındadır. Nûru'l-'ayn'ın müellifi Nişancızâde Muhyiddin Mehmed kâdılık yaptığı dönemde Câmi'u'l-fusûleyn'e sıkça başvurmuş, duyduğu ihtiyaç üzerine muhtemelen mülâzemet dönemlerinden birinde eseri düzenlemeye girişmiştir. Nûru'l-'ayn, Câmi'u'l-fusûleyn üzerine yapılan diğer çalışmalarla kıyaslandığında eserin bütünü üzerine yapılmış olması ile dikkat çekmektedir. Nişancızâde'nin çıkış noktası eserin kullanımını kolaylaştırmaktır. Nüshalarının çokluğu, fıkıh literatüründe kullanıldığının bilinmesi ve bazı yazmalarda kadıların esere teveccühüne işaret eden notların bulunması eserin aktif olarak kullanıldığı ve kabul gördüğünü göstermektedir. Çalışmamız üç ana bölümden oluşmaktadır. Birinci ana bölüm eserin ortaya çıktığı dönem ile müellifinin hayatını anlatan ve teze konu olan eserin tanıtımını yapan üç kısımdan oluşmaktadır. Bu bölümün eserin anlaşılmasına zemin hazırlaması amaçlanmaktadır. İkinci ana bölüm Nûru'l-'ayn metninin Câmiʿu'l-fusûleyn ile karşılaştırılmasıyla elde edilen bulguların değerlendirilmesine ayrılmıştır. Üçüncü ana bölümde ise eserin I-VI. fasıllarının tahkikli metnine yer verilmiştir. Bu sayede proje tamamlandığında XVI-XVII. yüzyıl Osmanlı hukuk literatürüne ait bir yazma eser ilim dünyasının istifadesine sunulmuş olacaktır."
