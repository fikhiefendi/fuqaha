abstract: "Bu çalışma, şer'î/fıkhî hileleri, kurumsal yatırımın bazı biçimlerinde yenilenen uygulamalı bir fıkıh problemi olarak ele almakta; sözleşme amaçlarının finansal düzenleme gereklilikleriyle iç içe geçtiği modern bir finansal araç olarak yatırım fonlarına odaklanmaktadır. Çalışma, yatırım fonu uygulamalarında hilelerin ne ölçüde yer aldığını tespit etmeyi ve bunların İslam hukuku hükümleri ve ilkeleriyle uyum ya da aykırılık sınırlarını ortaya koymayı amaçlamaktadır. Araştırmada, ilgili yapı, kural ve metinlerin izlenmesine yönelik tümevarım ile desteklenen betimleyici-analitik yöntem benimsenmiş; bu sayede yatırım uygulamalarında“disiplinli/ölçülü şer'î çıkış yolu”ile“yasak hile”arasında ayrım yapmaya imkân veren analitik bir ölçüt geliştirilmiştir. Çalışma, hile biçimlerinin bazı yapılarda, ya karmaşık düzenleyici ortamlarda şer'î uyumu sağlama amacıyla ya da biçimsel bir kullanım sonucu ortaya çıkabildiğini; bunun da kimi zaman yasak işlemlerin amaçlarına benzer sonuçlar doğurduğunu veya sözleşmenin özünü boşalttığını ortaya koymaktadır. Ayrıca çalışma, şer'iatın maksatları ve sözleşme kuralları doğrultusunda meşru yapılar ile yasak hileler arasında ayrım yapılmasına yönelik açık ölçütlerin benimsenmesini, sözleşme ve ürünler üzerinde şer'î denetimin etkinleştirilmesini ve fetva ile hukuki nitelendirmenin kurumsal uygulama verileri ve etkileriyle ilişkilendirilmesini önermektedir. Bu da yatırım fonu faaliyetlerinde şer'î uyumun sağlamlığını desteklemektedir."
