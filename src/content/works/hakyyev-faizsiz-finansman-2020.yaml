abstract: "Varlıkların menkul kıymetleştirilmesi kapsamında geliştirilen ilk İslami yatırım araçları Orta Çağ'dan günümüze kadar uzanmaktadır. İslami finansal ürünleri faize karşı duyarlı insanların tasarruflarını ekonomiye kazandırmakta büyük rol oynamaktadır. Özellikle, Müslüman kesimin ağırlıklı olduğu ülkelerde İslami finansal ürünler, geleneksel yatırım araçlarına bir alternatif olmaktadır. Son yılların gözde faizsiz finansman araçlarından biri olan sukuk, ilk olarak 1990 yılında Malezya'da gerçekleştirilmiştir. Sukuk ihracında karşılaşılan sorunları en iyi şekilde çözüme kavuşturan Malezya, bu konuda dünyada lider konumdadır. Türkiye'de ise, ilk sukuk ihracı 2010 yılında gerçekleştirilmiştir. Ülkemizde sukuk ihraçları ağırlıklı olarak katılım bankaları ve Hazine Müsteşarlığı tarafından gerçekleştirmektedir. Bu çalışmada, Türkiye ve Malezya'da gerçekleştirilen sukuk ihraçları yıllara göre karşılaştırılmış ardından Türkiye'nin sukuk ihracında Malezya'nın çok gerisinde olmasının sebepleri açıklanmış ve Türkiye'de sukuk ihracının artırılması için çeşitli öneriler sunulmuştur."
