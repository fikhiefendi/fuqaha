abstract: "Son yıllarda teknolojinin gelişmesinden kuşkusuz finans sektörü de nasibini alarak finans ile teknoloji bir araya getiren Fintech, Start up gibi şirketler kurulmaya başlamıştır. İnsanlık tarihindeki en büyük buluşlardan olan para, finans alanındaki bu başkalaşım içerisinde kendisine yer bularak önemli bir değişime uğramıştır. Hala da bu başkalaşım devam etmektedir. Üretimini ve iş/işlemlerini kriptoloji yöntemi ile gerçekleştiren, alt yapı olarak blockchain kullanan kripto para birimleri bu başkalaşımın tezahürlerinden bir tanesidir. Daha yeni bir kavram olmasına rağmen halk tarafından bir hayli ilgi gören kripto para birimleri, haliyle İslam Hukuku'nun da ilgisini çekmiş ve olumlu/olumsuz birçok görüş almıştır. İslam Dünyasında kripto para birimleri hususunda fetva hareketliliğinin yanında kripto para ile alakalı olumlu/şartlı olumlu görüş bildirenler tarafından bazı fiili hareketlenmelerde görünmüştür. İslami olduğu iddia edilen kripto paralar ve blockchain alt yapılı çeşitli İslami olduğu iddia edilen maddi ve manevi çalışmalar bu hareketlenmelerdeki en önemli tezahürlerdendir. Çalışmamız içerisinde bu malumatlara ek olarak zannımızca önemli bir buluş olan blockchain alt yapısı hususunda nerelerde kullanılabileceği ile alakalı bir bölüm de yer almaktadır."
