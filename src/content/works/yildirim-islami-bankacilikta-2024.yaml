abstract: "Değişen ve gelişen dünyada insanların ihtiyaçları da sürekli olarak değişmektedir. Bu ihtiyaçlardan biri de İslami hassasiyete sahip olan bireylerin İslami hukuk kurallarına uygun bankalar ile çalışma isteğidir. Söz konusu ihtiyaçlar doğrultusunda 1984 yılından itibaren katılım bankaları, geleneksel bankalara alternatif olarak faaliyet göstermeye başlamıştır. Ancak katılım bankalarının gelişmesiyle birlikte uygulamalarının İslami normlara uygunluğu konusunda birtakım fikir ayrılıkları da ortaya çıkmaya başlamıştır. Bu doğrultuda, bu tezin amacı İslami finans kuruluşlarındaki mevcut uygulamaların, İslami etik normları yansıtıp yansıtmadığını tespit etmek ve çözüm önerileri sunmaktır. Araştırmada nitel araştırma yöntemi tercih edilmiş ve veri toplamak amacıyla derin görüşme (deep interview) tekniği uygulanmıştır. Araştırmada elde edilen veriler Maxqda programı ile analiz edilmiştir. Analiz sonucunda, İslami finans kuruluşlarının mevcut uygulamalarına ilişkin 11 sorun kategorisi tespit edilmiş ve bu sorunlara yönelik çözüm önerileri sunulmuştur."
