abstract: "İslâm âlimlerinden olan Mâlik b. Enes (ö: 179/795) Mâliki mezhebinin imamı, müctehid ve önemli muhaddislerdendir. En önemli eseri olan“Muvatta'”hem hadis hem de fıkıh kitabı özelliği taşımaktadır. İslâm tarihinde ve fıkhında ilk kaynak eserlerden biri olma özelliği taşıyan Muvatta', aynı zamanda İmam Mâlik'in hadis-fıkıh ilmini ve metodunu ortaya koyan önemli bir eserdir. İmam Mâlik, Muvatta'ında Medine ehlinin uygulamalarına ve kendi yorumlarına da yer verdiği için Mâliki mezhebinin kaynak eserlerinden kabul edilmektedir. Muvatta'daki evlenme (nikâh) konusundaki hadisler 22 babtan 61 hadisten oluşmaktadır. Bunların bir kısmı merfu hadisler iken, bir kısmı da mevkuf ve maktu rivayetlerdir. Râvilerinin hemen hepsinin sika olduğu, senetlerdeki kopukluktan dolayı munkatı ve mürsel hadisleri de barındırdığı ancak geneli itibariyle sahih kabul edildiği görülmektedir. Bu çalışmada İmam Mâlik ve eseri Muvatta' hakkında genel bilgiler verilmekte olup, sonrasında Muvatta'da yer alan evlenmeyle alakalı hadislerin Kütüb-i Sitte esas alınarak tahrici yapılmaktadır. Tahric neticesinde özellikle ortak râvilerin sened tenkidi yapılarak, râviler hakkında cerh ve ta'dil ilmiyle uğraşan hadis âlimlerinin görüşlerine de başvurularak kısa bilgiler verilmektedir. Ayrıca râvilerin vefat tarihleri dikkate alınarak senedinde ınkita olma durumu da göz önünde bulundurularak, Nasiruddîn Elbânî ile Tirmizî tarafından hadislerin sıhhat değerlendirmesine kısmen yer verilmektedir. Hadislerin metin tenkidinde, varsa diğer kaynaklarda geçen lafız farklılıklarına ve hadis şerhlerinden faydanarak mana tahliline yer verilmeye çalışılmakta olup, her babın sonunda ise mezhep imamlarının görüş ve fetvalarına da kısmen yer vererek konu değerlendirmesi yapmaya çalışılmaktadır."
