abstract: "Arap dilinin dilbilgisi kurallarının çıkarılması sırasında dilbilimciler tarafından izlenen yöntem ve prensiplere klasik literatürde ?nahiv usulü? adı verilir. Nahvin temel kaynağını Arapların konuşma dili oluşturur. Ayrıca şiirler, Kur?an kıraatleri, hadisler ve âlimlerin icmaı da kaynaklar arasında sayılır. Gücünü nakilden alan diğer deliller ise kıyas, istihsân ve ıstıshâbdır. Bunlar da nakil ile elde edilen verilerden hareketle nahve yeni açılımlar sağlar. Bu çalışmada İmâm Şâtıbî?nin (ö. 790/1388), 2008 yılında yayınlanan el-Makâsıdu?ş-Şâfiye eseri nahiv ilminin metodolojik prensipleri açısından incelendi. Öncelikle bu prensipler hakkında teorik bilgiler verildi, ardından Şâtıbî?nin bunlar hakkındaki görüşleri ve onları nasıl kullandığı ele alındı. Bu yapılırken eserindeki pek çok örnek gösterildi ve onun nahiv düşüncesinden ana hatlarıyla bahsedildi. Şâtıbî, temelde nahiv geleneğine bağlı bir tavır sergiledi ve nahiv usulünde sayılan delillerin hepsini eserinde kullandı. Araplardan nakledilen şiir ve nesir rivayetlere çokça yer verdi, kıraatleri delil olarak kabul etti. Hadislerin ise ancak bazı şartları taşıması halinde delil olabileceğini savundu. Kıyasın tüm çeşitlerini kullandı ve nahvin kıyas üzerine bina edildiğini dile getirdi. Eserinde adını zikrettiği yirmi dört illet türünü çeşitli vesilelerle kullandı. Nakli tüm delillerin aslı kabul etti ve aklî delillerden biriyle çelişmesi halinde naklî delilin tercih edilmesi gerektiğini savundu."
