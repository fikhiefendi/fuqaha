abstract: "Bu çalışma bir ehliyet arızası olarak kabul edilen hezl çerçevesinde hazırlanmıştır. Hâzilin (şakadan boşayan kimse) tasarruflarında iç irade ile ortaya konulan dış iradenin farklı olduğu görülmektedir. Bu farklılığın hâzilin işlemlerine etki edip etme konusu ayrı bir önem arz etmektedir. İslam evliliğin devamlılığını tavsiye ettiği gibi saygınlığını da korumayı amaçlamaktadır. Bunun için birtakım tavsiyelerin yanında gerekli tedbirleri de almıştır. Talâkın şakaya konu yapılmaması da bunlardandır. Bu araştırma amellerin niyetlere göre değer kazandığı İslam'da hâzilin talâkının vâki olup olmadığını ortaya koymayı amaçlamaktadır. Araştırmanın konusu, amacı, yöntemi ve kaynaklarının yer aldığı giriş bölümü ile başlayan bu çalışma üç bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde evlilikleri sonlandıran bir işlem olan talâk konusu genel çerçevede ele alınmıştır. İkinci bölümde ehliyet kavramına ve çeşitlerine değinilmiş olup ehliyet arızaları ve bu arızaların talâka olan etkisi incelenmiştir. Üçüncü bölümde ise hezl ve muvazaa kavramlarına, hezlin hükmüne, hâzilin tasarruflarına değinilmiştir. Yine aynı bölümde hâzilin talâkının vâki olup olmadığı ayrıntılı olarak ele alınmış ve ileri sürülen delillerin kritiği yapılmıştır. Sonuç bölümünde ise ulaşılan sonuçlara ve araştırmanın bizde oluşturduğu kanaate yer verilmiştir. Çalışmamızda hazilin talakına yönelik ileri sürülen deliller derlenip kritiği yapılmıştır. İlgili rivayetlerde birtakım kusurların olduğu tespit edilmiştir. Ancak bu kusurlar ağır kusurlar olmadığı gibi ilgili rivayetler de birbirini destekler niteliktedir. Bundan dolayı hâzilin talâkının belirli kriterler doğrultusunda vâki olacağı kanaatindeyiz."
