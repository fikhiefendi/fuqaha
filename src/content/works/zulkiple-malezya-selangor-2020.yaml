abstract: "İslam'ın beş şartından biri olan zekât, toplumsal olarak Müslümanlar arasında sosyo-ekonomik adaleti sağlamayı hedeflerken bireysel olarak da insanı bencillikten ve açgözlülükten uzaklaştırarak paylaşmayı ve diğergâmlığı desteklemektedir. Malezya'da, zekâtın uygun şekilde dağıtılması için kişilerin zekâtlarını devletin hazırladığı zekât toplama merkezlerine teslim etmeleri teşvik edilmektedir. Malezya'da, her eyaletin ayrı bir zekât kurum modeli mevcuttur. Bu çalışma, profesyonel ve verimli bir şekilde yönetilen Malezya'daki güncel zekât uygulamasını ele almaktadır. Malezya'nın Selangor eyaletinde bulunan ve önde gelen zekât toplama ve dağıtım kurumlarından biri olan Selangor Zekât Kurulu (Lembaga Zakat Selangor-LZS) olarak bilinen zekât kurumuna odaklanacaktır. Bu çalışmanın temel amacı, klasik ve çağdaş fıkıh âlimlerinin en son teknoloji kullanılarak ve İslami değerler doğrultusunda uygulanan zekat toplama ve dağıtım uygulamaları hakkındaki özellikle LZS'de nasıl uygulandığına ilişkin görüşlerini tespit etmektir. Ayrıca, LZS'nin özellikle çağdaş Müslüman toplumda yeni zekat toplama ve dağıtım yöntemlerini nasıl benimsediğini ve uyarladığını değerlendirecektir. Bu çalışmada Malayca, İngilizce, Arapça ve Türkçe kaynaklarda kütüphane araştırma materyallerini içeren nitel bir araştırma yaklaşımı kullanılmıştır. LZS'nin en iyi uygulamaları 2014-2018 arası Yıllık Raporları aracılığıyla analiz edilecektir. Ayrıca veriler, LZS Yönetim Kurulu'ndan yetkililerle yapılan röportajlar yoluyla toplanmıştır. Bu çalışma, LZS'nin Malezya'da zekât toplama ve dağıtımı açısından profesyonelce yönetilen, önde gelen zekât kurumlarından biri olduğunu göstermektedir. LZS, zekât toplama ve dağıtımı için, sadece zekât alıcıların ihtiyaçlarını karşılamakla kalmayan, aynı zamanda devlet otoritesi tarafından çıkarılan fetvayı takip ederek İslam Hukuku'na da bağlı olan bazı yenilikçi yöntemler getirmiştir."
