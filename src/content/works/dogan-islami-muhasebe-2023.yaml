abstract: "İslam Dini, geçmişten günümüze var olan toplumun inançlarını, ibadetlerini, kültürlerini etkileyen olgudur. İnsan davranışlarının hemen hemen bütününe etki eden din, ekonomiye de etki ettiği görülmektedir. Birçok hadislerde geçen buyruk ve yasaklarda bunu kanıtlamaktadır. Özellikle Bakara 282. Ayetin mealinde de aralarında bir kâtip seçip borç ve alacaklarını eksizsiz yazılmasını, gerektiğinde şahit tutup unuttukları borçları hatırlatmasını ve az olsun çok olsun yazılmasını buyurmaktadır. Mealden de anlaşılacağı üzere İslam Dini mali olayların kayıt altına alınmasını buyurmuştur. Bu mealde anlatılan durumu muhasebenin temel unsurlarından sosyal sorumluluk, tam açıklama, önemlilik ile maliyet esası kavramlarıyla ilişkilendirmek mümkündür. İslami Muhasebe, İslam dininin faizi yasaklamasıyla ortaya çıkmıştır. Böylelikle günümüzde finans kuruluşlarının temelinde var olan faizin İslam Dininde yasaklanmış olmasından dolayı Müslüman ülkelerde farklı bir finans sisteminin oluşmasına sebep olmuştur. Katılım Bankaları, İslami Banka, Özel Finans Kuruluşları adı altında faizsiz finans kuruluşları kurulmuştur. İslami Muhasebe Kuruluşları Denetim ve Organizasyonu (AAOIFI) tarafından uluslararası muhasebe ve finansal raporlama standartlarıyla uyum sağlamak amacıyla Faizsiz Finans Denetim ve Muhasebe standartları yayınlanmıştır. Yayınlanan standartlar ülkemizde, 29.05.2019 tarihinde Kamu Gözetimi Kurumu (KGK) tarafından Resmi Gazetede yayınlanmıştır. Çalışmamızda, yayınlanan bu standartlar çerçevesinde, İslam Dini muhasebeyle ilişkilendirilerek, İslami Muhasebe ve Denetim Standartlarının temel özellikleri ve ilkeleri açıklanmaya çalışılmıştır. Çalışma bu yönüyle önemlilik kazanmaktadır. Çalışmamızın amacı, İslami Muhasebenin gelişimini tarihsel olarak inceleyip, günümüzde uluslararası muhasebe ve finansal raporlama standartları ile uyumlu olacak şekilde çıkarılan Faizsiz Finans ve Bankacılık Denetim Standartlarının incelenmesini yapıp muhasebeye etkilerini belirlemektir. Literatür taraması yöntemi ile İslami finansın temel prensipleri, kurum ve kuruluşları incelenerek, Türkiye'de ki çalışmalar araştırılıp amaca ulaşılmaya çalışılacaktır. Bu çalışma ile muhasebe bilimine ve muhasebe literatürüne katkı sağlanacağı umut edilmektedir."
