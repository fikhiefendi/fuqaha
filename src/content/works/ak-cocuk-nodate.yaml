abstract: ".Doğumdan ergenlik çağına kadar devam eden döneme çocukluk, bu dönemi yaşayan kimseye de çocuk denir. Çocukluk döneminin kendine has özellikleri vardır. Çalışmamızda İslam Hukukunda Hanefi mezhebine göre çocuğun mallarını kimlerin, nasıl yöneteceği ve çocuğun mali sorumlulukları ele alınmış, çocukların haklarının korunmasını temin edecek kanuni çerçevenin tespiti hedeflenmiştir. Araştırmamız giriş ve dört bölümden oluşmaktadır. Giriş kısmında araştırmanın amacı, metodu ve kaynakları üzerinde durulmuştur. Çalışmamızın birinci bölümünde çocukluk, ehliyet ve insan hayatının evreleri hakkında bilgi verilmiştir. İkinci bölümde çocuk mallarının kaynakları, bu malların veli ve vasiler tarafından yönetilmesi incelenmiştir. Bu bağlamda velî ve vasîlerde olması gereken şarlar, velâyet çeşitleri, velâyet ve vesâyet yetkisine sahip olanların yetkileri üzerinde durulmuştur. Çalışmamızın üçüncü bölümünde me'zûn çocuğun, velinin ve vasînin çocuğun mallarını, ticaret ve ticaret sahasına giren hususlarda işlemlerde bulunması, bunların şekil ve şartları ele alınmıştır. Dördüncü bölümde ise çocuğun malla ilgili ibadet ve hukuki sorumlulukları incelenmiş, cezai ehliyeti olmayan çocuğun haksız fiil gibi tazminat doğuran eylemlerinden sorumlu olması incelenmiştir. Sonuç olarak İslam'ın ilk yıllarından itibaren çocukların malvarlıklarının korunmasına ve işletilmesine önem verildiği, alimlerin çocuğun malvarlığına zarar gelmemesi için çok ince düşüncelerle fetva ve hüküm vermeye çalıştıkları görülmüştür."
