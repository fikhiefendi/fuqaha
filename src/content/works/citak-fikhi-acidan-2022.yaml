abstract: "Küresel boyutta tün dünyayı etkisi altında alan 2008 ekonomik krizi, beraberinde kitle fonlamasını gündeme getirmiştir. Kitle fonlamasının gündeme gelmesiyle ve tüm Dünya'da insanların ilgisini çekmesiyle farklı modeller geliştirilmiştir. Bu modellerden bir tanesi de bu çalışmamızın konusu olan paya dayalı kitle fonlaması modelidir. Paya dayalı kitle fonlamasının temel amacı, girişim şirketinin sermayesini temsil eden ve elinde bulundurana ortaklık hakkı veren paylar karşılığında platformlar aracılığı ile halktan para toplanması olarak ifade edilmektedir. Bu çalışma, paya dayalı kitle fonlamasının mahiyetini, taraflarını ve uygulamasını detaylı bir şekilde ele aldıktan sonra, bu modelde yer alan tarafların fıkhi ilişkileri incelenmiştir. Bu incelemeler sonucunda, İslam hukukuna uygun olan ilişkiler belirtilmiş ve uygun olmayanlar için öneriler sunulmuştur. Diğer taraftan, paya dayalı kitle fonlaması ile finansman alan girişim şirketinin sermayesi, ihraç edilen payları ve kâr/zarar dağılımı, medenî hukuk ile İslam hukuku arasında karşılaştırılarak tahlil edilmiştir. Bu değerlendirmeler sayesinde, paya dayalı kitle fonlamasının İslam hukukundaki hükmü tespit edilmeye çalışılmıştır."
