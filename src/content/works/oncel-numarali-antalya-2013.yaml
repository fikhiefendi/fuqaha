abstract: "Tezimiz, Antalya Şer'iyye Sicilleri'nden H. 1330-31/M. 1912-13 tarihli 98 numaralı Şer'iyye Sicilidir. Üzerinde çalıştığımız sicilin orijinali Başbakanlık Osmanlı Arşivleri'nde bulunmaktadır. Ecdadımızın bize miras bırakmış olduğu arşivlerden istifade edip bizden sonraki öğrencileri teşvik etmek, bu alandaki çalışmaları kolaylaştırmak ve araştırmacıların hizmetine sunmak amacıyla Antalya'ya ait 100 şer'iyye sicili defterinden 98 numaralı Antalya şer'iyye sicilinin transkripsiyon, tahlil ve indeksini yaptık. Bu çalışma, 95 varak olan defterin ilk 50 varağı üzerinden yapılmıştır ve 239 vesika/ilam/hüccet içermektedir. Defterin bütünlüğü bozulmaması için 51-95 varaklar arası başkası tarafından çalışılmaktadır. Bunların içinde eytam sandığından borç alınması, vekâlet ve miras davaları ile ilgili kayıtlar çoğunluktadır. Çalışmamızın giriş kısmında Osmanlı Mahkemesi Şer'iyye Sicilleri defterlerinin tanıtımına ve genel özelliklerine, şer'iyye sicili arşivlerinin tarihi gelişimine, Antalya Şer'iyye Sicillerine ve üzerinde çalıştığımız şer'iyye sicilinin muhteviyatı ve ehemmiyetine temas ettik. Defter Elmalı mahkemesinde tutulduğu için tezimizde Elmalı tarihi hakkında da bilgi yer almaktadır. Tezin metin kısmında ise 98 Numaralı Antalya Şer'iyye Sicili defterinde geçen vesikaların özetleri, metnin transkripsiyonu ve indeks verilmiştir. Transkripsiyon yapılırken basit transkripsiyon kuralları dikkate alınmıştır. İndekse, yalnızca şahıs, yer ve kurum isimleri dâhil edilmiştir."
