abstract: "\"İbn Hacer el-Heytemî, Şemseddin er-Remlî ve Hatîb eş-Şirbînî'nin Borçlar Hukukuyla İlgili İhtilafları ve Şâfiî fıkhına Etkileri\" isimli bu çalışmada Şâfiî mezhebinin önde gelen âlimlerinden İbn Hacer el-Heytemî'nin Tuhfetu'-muhtâc, Şemseddin er-Remlî'nin Nihâyetü'l-muhtâc ve Hatîb eş-Şirbînî'nin Muğni'l-muhtâc adlı eserleri bağlamında borçlar hukukuyla ilgili ihtilafları konu edinilmiştir. Giriş, iki bölüm ve sonuçtan oluşan tezin; giriş kısmında araştırmanın konusu ve amacı, araştırmanın yöntemi ve araştırmanın kaynakları verilmiştir. Birinci bölümde dönemin siyasi, sosyal, ekonomik ve ilmî durumu, İbn Hacer el-Heytemî, Şemseddin er-Remlî ve Hatîb eş-Şirbînî'nin hayatları, ilmî kişilikleri ve Şâfiî fıkhına katkıları ele alınmıştır. İkinci bölümde ise borçlar hukukuyla ilgili genel bilgiler ile Heytemî, Remlî ve Şirbînî'nin borçlar hukukuyla ilgili ihtilafları, ihtilaf sebepleri ve Şâfiî fıkhına etkileri incelenmiştir. Sonuç kısmında da ulaşılan sonuçlar sunulmuştur. Anahtar Kelimeler: Şâfiî fıkhı, Borçlar hukuku, Heytemî, Remlî, Şirbînî"
