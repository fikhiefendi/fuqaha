abstract: "Araştırma konumuzu hem Arnavutça hem de Arapça çok sayıda orijinal eserleri bulunan Arnavut fikıh alimlerinin önde gelenlerinden Vehbi Süleyman Gavoçi'nin hayatı, eserleri ve onun fikhi görüşleri olusturmaktadır. Amacımız, Şu'ayb el-Arnaut, Abdulkadir el-Arnaut ve Nasirüddin el-Elbani ile birlikte Arnavut alimlerin en önde gelen alimlerinden olan Vehbi Süleyman Gavoci'nin hayatını, eserlerini, fıkıh alanındaki çalışmalarını tanıtmak ve fikhî görüşlerini fıkıh ilmi ile uğraşanların kazanımına sunmaktır. Vehbi Süleyman Gavoçi ibadet, muamelat ve ahlak konuları da dahil Arapça ve Arnavutça olmak üzere yaklaşık 60 orijinal eser kaleme almış velud bir alimdir. Fakat burada onun tüm eserlerinin tanıtımını kısaca yapmakla beraber her bir eser için detaya inmemiz mümkün değildir, ki bu aslında çalışmamızın amacını da taşmaktadır. Çalışmamızın kapsam ve sınırlarını belirlemek bakımından esas konumuzu, Vehbi Süleyman Gavoci'nin fıkıh ilmine dair katkıları bakımından fıkıh ile ilgili en önemli görüşleri oluşturmaktadır. Araştırmamızda nitel araştırma yöntemi tercih edildi. Veri toplama aracı olarak kaynak taraması, metin okumaları, doküman incelemesi yoluna gidildi. Ilk olarak kaynaklardan Vehbi Süleyman Gavoci'nin hayatı ile ilgili bilgi taraması yapıldı. Bu doğrultuda hem hakkında yazılanlar hem de kendisinin vermiş olduğu röportajlar incelendi. Konu hakkında doğrudan veya dolaylı olarak alakası bulunan yazılı metinlere, kaynaklara da müracaat edildi. Kaleme aldığı eserleri ve özellikle fıkıh ile ilgili olan eserleri incelendi. Çalışma aşamasında elde ettiğimiz bütün bulguların kaynakları da kaynakça kısmında gösterildi. Araştırma sonucunda Vehbi Gavoçi'nin en önemli fıkhî görüşlerini tespit ettik, savunduğu fikir ve düşüncelerini kendi kitaplarından kesitlerle ortaya koymaya gayret ettik."
