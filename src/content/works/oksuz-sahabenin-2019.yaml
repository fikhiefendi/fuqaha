abstract: "Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmamızın konusu, önemi ve kaynaklarına dair değerlendirmeler yer almıştır. Sahâbenin fıkıh tarihindeki konumuna işaret eden birinci bölümde öncelikle 'fakih sahâbe' kullanımına dair değerlendirmeler yer almıştır. Bunun yanında sahâbenin fıkhî birikim elde etme süreci ile sonraki nesillerin müracaat kaynağı olacak bilgi üretme çabaları ele alınmıştır. Daha sonra ise Hz. Ömer döneminde başlayan fakih sahâbe hareketliliği ve bunun sonucunda ortaya çıkan fıkıh merkezleri selef-halef irtibatları özelinde incelenmiştir. İkinci bölümde Kûfe fıkıh merkezi birikiminden etkilenerek fıkhî görüşlerini ortaya koyan ve aynı zamanda mezhebin kurucusu olan Ebû Hanîfe'nin fıkhında sahâbe etkisi ele alınmıştır. Bunun için öncelikle Ebû Hanîfe'nin sahâbî kavline bakışını daha sonra ise fıkhî görüşlerinin dayanaklarını içeren en erken tarihli eser olması bakımından Ebû Yûsuf'un el-Âsâr'ı özelinde sahâbe etkisini ortaya çıkaran konuları tespit edilmiştir. Bu konular çerçevesinde Ebû Hanîfe'nin benimsediği görüşlerde sahâbe etkisini ortaya konmuştur. Anahtar Kelimeler: Fakih Sahâbe, Kûfe Fıkıh Merkezi, Ebû Hanîfe, Hoca-Talebe İrtibatı"
