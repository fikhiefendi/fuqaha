abstract: "Bu tezde Hanefî fıkıh usulünün klasik eserlerinden Debûsî'nin Takvîmu'l-edille adlı eseri ile Serahsî'nin Usûl'ü karşılaştırılmış, Serahsî'nin Debûsî'den usul yazımında ayrıldığı hususlar tespit edilmeye çalışılmıştır. Tezimiz giriş, iki bölüm ve sonuçtan oluşmaktadır. İlk bölümde yazarların hayatları, hocaları, talebeleri ve eserleri ele alınmış, ikinci bölümde ise Serahsî'nin usûlde gerek konuları sıralama, isimlendirme ve diğer şeklî yönlerden gerekse savunulan ve benimsenen görüşler bakımından Debûsî'den ayrıldığı hususlar incelenmiştir. Bu çalışmada iki fıkıh usûlü eserini temel alıp inceleyerek zaman içerisinde Hanefî usûl anlayışında yaşanan gelişimi ve değişimi tespit edip bu konuya ışık tutma gayesi güdülmüştür. Aralarında büyük benzerlikler bulunan iki eser arasındaki farklılıkların sınırlı sayıda olduğu tespit edilmiştir. Bu farklılıkların büyük çoğunluğu sadece şekil açısından farklılık iken önemli sayılabilecek kısımlar da vardır. Genel olarak birbirini tamamlayan bu iki eserin büyük oranda benzer fikrî altyapının ürünü olduğu kabul edilebilir. Serahsî'nin eserinin Takvîmu'l-Edille'nin bir şerhi olduğunu söylemek mümkündür. Karşılıklı okumalar sırasında da bunu destekleyecek bazı unsurlara rastlanmıştır."
