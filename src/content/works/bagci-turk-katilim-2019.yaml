abstract: "Katılım Bankacılığının son yıllarda global anlamda kabul görmesi ile katılım bankacılığı önem kazanmış ve bu anlamda hizmet veren kuruluşların sayısı artmıştır. Katılım Bankacılığının artan önemi ile katılım bankacılığı ürünleri ile hizmet veren kuruluşlar sadece bu bankalarla sınırlı kalmamış diğer bankalarda faiz hususunda hassasiyet gösteren müşterileri için bu alanda ürünler sunarak hizmet vermeye başlamıştır. Dolayısıyla katılım bankacılığı ürünlerinin önemi artmıştır. Bu nedenle katılım bankacılığı ürünlerinden biri olan mudarebe sözleşmesi, tezimizin konusu oluşturmaktadır. Tezimizde kâr ve zarara katılma esasına göre işleyen mudarebe sözleşmesine ilişkin genel esasların belirlenmesine gayret edilmiştir."
