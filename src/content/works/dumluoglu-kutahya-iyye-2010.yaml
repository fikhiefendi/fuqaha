abstract: "Osmanlı Tarihi araştırmalarında büyük öneme sahip olan kaynaklar arasında Şer'ye sicilleri de vardır ve ait oldukları dönemi aydınlatmak açısından da son derece önemli ve gerekli vesikalardır. Bu tez çalışmasında da Hicri 1218-1221 Miladi 1803-1806 yıllarına ait Kütahya ve çevresinde hukuka intikal etmiş mahkeme kayıtlarını ihtiva eder.Çalışma konusu olan 7 Numaralı Kütahya Şer'iyye Sicili (1. Bölüm) defterinde tereke, i'lâm, ma'ruzat, ferman, mektub, buyruldu, berat, temessük, mürâsele, masraf kaydı, müfredat defteri, tahrirat defteri, narh defteri, sehm defteri, mahalle kaydı, ahidnâme, saire defteri, resm defteri belgelerinin transkripsiyonu ve değerlendirmesi yer almaktadır. Bilindiği gibi şer'iye sicilleri mahkeme kararı demektir. O dönemden günümüze intikal eden bu kararlar, toplumun sosyal, siyasi ve ekonomik yapısı hakkında bize bilgi vermektedir. Ayrıca bu belgeler miras paylaşımı, boşanma ve nafaka, alacak tahsili, şikayet gibi gündelik yaşamın gereklerini içinde barındırırken ferman, buyruldu, berat ve benzeri belgeler de Kütahya'nın nezdinde Devletin tümünü içine alan karaların alındığı ve uygulanmasının bildirildiği belgeleri ihtiva etmektedir.Çalışmasını yaptığımız bu defterden halkın kendi örf ve ananelerine göre hayatlarını sürdükleri ve bu sebeplerle de kullanılan eşyalardan, mahalle isimlerine kadar birçok değerin günümüze kadar değişmeden korunduğu görülmüştür. Bir başka dikkati çeken nokta ise mahkemeye intikal eden olayların her biri müsbet ya da menfi bir karar halinde sonuçlanmasıdır. Sonuçlanan bu kararların altında ? şuhud-ü hal? denilen ve o bölgenin ileri gelenleri arasından seçilen, aralarında önemli hukukçuların da yer aldığı şahitlerin olması bahsedilmesi gereken önemli bir konudur. Diğer taraftan defterin işlendiği tarihte devletin siyasi, sosyal ve ekonomik durumunun da gündelik yaşama yansıdığı dikkati çeken bir başka husus olmuştur. Ayrıca cinayet ve hırsızlık gibi yüz kızartıcı suçların kayıtlarda olmaması halkın o dönemde bu konulardaki titizliğini göstermektedir.Bu çalışmanın ortaya çıkmasında ilgi ve desteğini esirgemeyen tez danışmanım Yrd. Doç. Dr. Emine Dingeç'e teşekkür ederim."
