abstract: "Hanefi mezhebinin görüşlerini bir araya getirme açısından son derece önemli bir eser olan el-Hidâye'de Ebû Hanîfe'nin önemli iki öğrencisi İmam Ebû Yusuf ve İmam Muhammed'in İbadetler ve Nikâh alanlarında hocaları Ebû Hanîfe'ye karşı ittifak ettikleri konular ele alınmıştır. Bu çalışmanın amacı mezhep içi rey özgürlüğünün olduğunu zaman içerisinde – özellikle istikrar döneminden günümüze- İmameyn'in görüşünün sonraki Hanefi fakihleri tarafından bazı konularda tercih edilerek müftâ bih görüş olarak uygulamaya konulduğunu göstermektir. Bunun yanında yer yer İmameyn'in görüşlerinin diğer mezhep imamlarıyla birleştiği noktalardan örnek vererek reylerinde yalnız kalmadıklarını göstermektir. Zaman içerisinde mezheplerin görüş farklılıklarını ele alan muhtasar eserler yazıldığı gibi mezhep içi görüşlerin ele alındığı eserler de yazılmıştır. Amacımız mezhep içindeki farklılıkların sebeplerini ortaya koymak ve dayandıkları delilleri mümkün mertebe tahriç ederek el-Hidâye bağlamında müftâ bih olabilecek görüşleri tespit etmeye çalışmaktır."
