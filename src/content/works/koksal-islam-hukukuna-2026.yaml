abstract: "Bu çalışma, yapay zekânın, bireyin mahremiyeti üzerinde oluşturduğu tehditleri, İslam hukukunun Nass ve usulleri çerçevesinde analiz etmektedir. Araştırma, yapay zekâ uygulamalarının neden olduğu veri ihlali, gözetim ve itibar saldırıları gibi mahremiyet sorunlarına, İslam düşüncesi içinde çözüm önerileri bulmayı amaçlamaktadır. Çalışma, yapay zekâ teknolojisinin hukuki sorumluluğunun nihai olarak onu tasarlayan, üreten ve kullanan kişiye ait olduğu tezini savunmaktadır. Yapay zekâdan kaynaklanan mahremiyet ihlallerine karşı, İslam ceza hukuku usulü çerçevesinde içinde müeyyideler ele alınmaktadır. Bugün için yapay zekânın hukuki kişiliği bulunmadığından, sorumluluk mübaşir, mütesebbip ve müşârik şeklinde bir zincir üzerinden insan sorumlulara yüklenir. İhlalin türüne göre, ta'zîr cezaları veya özellikle zina iftirası (kazf) ve belli şartlar altında dijital veri hırsızlığı gibi durumlarda had cezaları tartışılmıştır. Bu tez, yapay zekâ çağının getirdiği beklenilen yeni mahremiyet tehlikelerine karşı, İslam hukukunun usul ve ukûbat alanında, kaideler geliştirme yetkinliğine sahip olduğunu ortaya koymaktadır."
