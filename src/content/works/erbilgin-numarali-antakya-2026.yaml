abstract: "Bu tez, Antakya'ya ait 22 Numaralı Şer'iyye Sicili'nin transkripsiyonunu ve içerik değerlendirmesini konu edinmektedir. İncelenen sicil, Hicrî 1246–1248 (Miladî 1830–1833) yıllarına ait kayıtları ihtiva etmekte olup, geç Osmanlı döneminde Antakya'nın sosyal, ekonomik ve hukukî yapısına dair önemli veriler sunmaktadır."
