abstract: "Bu tez, Osmanlı Tanzimat dönemindeki toprak mülkiyeti reformlarının, özellikle 1858 Toprak Kanunu ve ardından gelen, miri toprak mülkiyetini resmileştiren ve bireyselleştiren yasaların, Orta Doğu'da nesiller arası servet aktarımına etkisini incelemektedir. Çalışma, Yeni Kurumsal İktisat (YİK) temelli bir kuramsal çerçeve kullanmakta ve Georgist iktisat gibi heterodoks okullardan yararlanmaktadır. Toprak reformları ile ekonomik rantın özelleştirilmesi, gayrimenkule yatırılan taṣarruf oranı ve nesiller arası aktarımın verimliliği (yani ilgili işlem maliyetleri) arasında bir ilişki olduğunu varsayılmaktadır. İlk olarak, Osmanlı deneyimini çağdaş İngiliz ve Fransız reformlarıyla karşılaştırmak için karşılaştırmalı bir tarihsel analiz yapılmış ve bu da hipotezin ayrıntılı bir teoriye ve ilgili bir biçimsel modele dönüştürülmesini sağlamıştır. İkinci olarak, bu teori, Anadolu ve Levant'tan dört örnek tarihsel vaka çalışması incelenerek ve teorinin mekanizmaları pratikte izlenerek daha da test edilmiştir. Sonuç, varsayılan ilişkinin ve teorinin genel olarak doğrulanmasıdır. Ancak bu çalışma, yüzyıllar boyunca miri toprakların giderek artan özelleştirilmesine yol açan değişimleri tam olarak anlamak için uzun vadeli bir yaklaşım benimsenmesi ihtiyacını ortaya koymaktadır. Son olarak, çalışma bir dizi politika ve pratik önerinin yanı sıra İslam iktisat düşüncesiyle ilgili değerlendirmelerle sona ermektedir."
