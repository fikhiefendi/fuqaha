abstract: "Bu çalışmada Muhammed b. Muhammed el-Hanefî el-Hüseynî'nin Şerhu Mukaddimeti Ebî'b-Suûd isimli eserinin tahkik ve analizi yapılmıştır. Araştırma Kur'ân'ın en önemli tefsirleri arasında yer alan Ebû's-Suûd tefsiri üzerine yapılan bir çalışmayı konu edinmesi sebebiyle önelidir. Ebû'Suûd'un tefsiri medreselerde okutulmuş, üzerine birçok şerh ve hâşiye yazılmış, özel ve resmi bütün okulların müfredatında yer almış, müellifinin ünü dört bir yana yayılmıştır. Araştırmayı önemli kılan bir diğer husus ise Zeyrekzâde'nin Ebû's-Suûd'un öğrencilerinden olmasıdır. Hocasından bizzat ders alması hocasının kullandığı ifadeleri ve maksatlarını çok iyi anlamasını sağlamıştır. O hocasından işittiklerini ve derslerde yazdıklarını aktarmıştır. Zeyrekzâde eserin mukaddimesinde eseri hocasından hangi yolla aldığını söylemiş, metne esas aldığı nüshanın bizzat kendisi tarafından hocasına okunduğunu açıklamıştır. Müellif esere kitabın yirmide biri oranında olan bir mukaddime ile başlamış, kısa bir şekilde eserde uyguladığı metodu anlatmış sonra Ebû's-Suûd'un sözlerini şerhetmeye başlamış, dua ve şiirlerle eserini bitirmiştir. Zeyrekzâde'nin ilmi ve şahsi hayatı anlatılırken betimleyici tarihsel metot kullanılmıştır. Metnin yazılması, harekelenmesi, nüshaların karşılaştırılması, nakillerin asli kaynaklardaki yerlerinin gösterilmesi ve dipnotların verilmesinde talik ve tahkik yöntemi tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır. Zeyrekzâde dönemin en meşhur alimlerinden biri olup, bizzat Ebû's-Suûd'a öğrencilik yapmıştır. Edirne, İstanbul ve daha birçok yerde Osmanlı medreselerinde hocalık görevini yürütmüştür. Sultanların çocuklarına ve akrabalarına dersler vermiştir. Ders verdiği şehzadeler arasında Sultan Süleyman da vardır. O, tefsir, fıkıh, hadis, belagat ve diğer İslâmî ilimlerde rüsûh sahibidir. Zeyrekzâde'nin eseri lügat ve belagat esaslı tefsirler arasında sayılabilir. Zira müellif garib lafızlar ve zor anlaşılan ibarelerin manasını şiirler ve Arap mesellerinden örnekler vererek tespit etmektedir. Aynı zamanda kelimelerin irabına önem vermiş, kelimelerin farklı irablarından hareketle cümleye değişik manalar vermiştir. Eserde belagat ve edebi sanatlara da yer verilmiş, kelimelerin manaları ve köklerinin tespitinde lügatlerden istifade edilmiştir. Müellif akli istidlâller ve mantık konularında da mahir bir kişilik olup, kelam ve mantıkta döneminin en meşhur alimlerinden biri sayılır. Bu durum eserde meselelerin ele alınıp tartışılmasında bariz bir şekilde görülmektedir. Eserde fıkhî konulara da yer verilmiş, farklı mezheplerin görüşleri tercih edilmiştir. Bütün bunlar, müellifin kültürünün çeşitliliğini, geniş bilgi birikimini, önde gelen ilim şahsiyetini, kitabın zenginliğini, tefsir, hadis, akâid ve lügat kaynaklarının çokluğunu yansıtmakta olup, eserin içerik ve üslup yönüyle doyurucu olduğuna delalet etmektedir."
