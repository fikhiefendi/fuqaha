abstract: "Bu araştırma projesi TÜBİTAK tarafından 1002 Hızlı Destek Programı kapsamında desteklenmiştir. Projede 2 farklı mutajenin; Ribavirin (RBV) ve 5-Fluorouracil (5-FU) İnfeksiyöz pankreatik nekrozis virus (IPNV) üzerine antiviral etkisi ve mutasyon oluşturma potansiyelleri, duyarlı hücre hattı EPC (Epithelioma Papulosum Cyprini) üzerinde in vitro olarak araştırılması hedeflenmiştir. Bu amaçla; ilk olarak RBV ve 5-FU sitotoksik dozları araştırılarak, sırası ile 50 µM/mL ve 100 µM/mL olarak tespit edilmiştir. Daha sonra IPNV'nin ilaç baskısı altında ve ilaç baskısı altında olmadan EPC hücre hattında seri pasajları gerçekleştirilmiştir. Her pasaj sonunda Real Time Revers -Transkriptaz Polimeraz Zincir Reaksiyonu ile konfirmasyonları gerçekleştirilmiştir. Yapılan seri pasajlar viral yük açısından Kantitatif Real Time PCR (qrt-PCR) ile kontrol edilmiştir ve viral yüklerde ilaç baskısı altında olmayan virus ile karşılaştırdığında viral yükte azalma açık olarak tespit edilmiştir. Ribavirin baskısı altında olan virusun 1.pasaj için 1,18x105 kopya/µl olan viral kopya sayısı, 5.pasaj sonunda 1,49x102 kopya/µl'e düşmüştür. 5-FU baskısı altında olan virusun, 1.pasaj için 3,84x103 kopya/µl olan viral kopya sayısı hemen her pasajda kademeli olarak azalarak (2.pasajda viral yük artmıştır) 5.pasaj sonunda 1,78x102 kopya/µl'e düşmüştür. Ribavirin ve 5-FU baskısı baskısı altında olan virusun ve ilaç baskısı altında olmayan virusun 1 ve 5.pasajları parsiyel kısmi sekans ile kontrol edilmiş ve bu mutajenlerin antiviral etkileri olmasına rağmen virusun VP2 üzerinde herhangi bir mutasyona neden olmadığı tespit edilmiştir. Sonuç olarak yaptığımız bu çalışmada iki mutajenin antiviral etkinliği yönünde veriler elde edilmilştir. Çalışma için seçilen gen bölgesinde herhangi bir mutasyon tespit edilmemesi nedeni ile diğer viral proteinler üzerine etkisi ve/veya virusun replikasyon siklusu üzerine etkisi araştırılması önerilir."
