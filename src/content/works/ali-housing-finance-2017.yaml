abstract: "Bilindiği üzere, 2008-2009 küresel finans krizi Türk ekonomisini de etkilemiş; ileride karşılaşılabilecek potansiyel krizlerin önlenebilmesini teminen birtakım makroihtiyati politikaların benimsenmesini gerektirmiştir. Bu kapsamda, tez çalışmasında söz konusu politikalardan biri olan kredi-değer oranının gayrimenkul piyasalarından kaynaklanan sistemik risklerin azaltılmasındaki etkinliğinin geleneksel ve İslami bankalar açısından karşılaştırmalı olarak incelenmesi amaçlanmıştır. Buna göre, konut finansmanı sistemi geleneksel ve İslami bankalar için ayrı ayrı irdelenmiş ve söz konusu sistemde kredi-değer oranına ilişkin düzenlemelerin etkisi ortaya konmuştur. Çalışmada, geleneksel ve İslami bankalar tarafından kullandırılan konut kredilerinin miktarı ve takibe dönüşüm miktarları ile kredi-değer oranı politikası arasındaki ilişkiler fark testleri, Chow testleri ve regresyon analizleri yordamıyla açıklanmıştır. Kredi-değer oranının uygulanmadığı dönemler ile uygulandığı dönemlerin söz konusu testlerle mukayese edilmesi sonucunda elde edilen bulgular, kredi değer oranı düzenlemesinin konut kredilerinin miktarı ve takibe dönüşüm miktarları üzerindeki etkilerinin geleneksel bankalarda İslami bankalardakinden daha anlamlı olduğunu göstermektedir."
