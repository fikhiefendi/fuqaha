abstract: "İslam ceza hukukundaki hükümleri hadislerin vürud sebeplerine dayalı olarak inceleyen bu tezde, detaylı analiz ve tümevarım yöntemleri kullanılmış olup çeşitli sonuçlar elde edilmiştir. Bunlar arasında şunları zikredebiliriz: İslam ceza hukuku hükümleri, Şari Teala'nın mahlukata olan rahmetinin bir eseridir. Zira, uygulanması ile güven ve huzuru tesis etmiş olup, tatbik edilmediği zamanlardaki karışıklık, yıkım ve toplumsal düzendeki bozulma da bunu göstermektedir. Ayrıca, İslam hukukçularının ihtilafları ve ahkamın bir çoğunu anlamadaki çeşitlilik de bunun bir göstergesidir. Suçlulara ağır cezaların uygulanmasında ceza hukuku hükümlerinin anlaşılması yönündeki çabalar da bir başka vechesidir. Kur'an'da yer alan şer'i cezaların istinbatından da anlaşılan, bunların vesile hükümler olduğudur. Yani, bu hükümler İslam hukukunun her zaman ve mekana uygun olacak şekilde kapsamlı ve yetkin olduğunu, hükümlerinin yumuşak ve uyumlu olduğunu ortaya koymaktadır. Bu tezin hedefi, ceza hukukunda hadislerin vürud sebeplerine dayalı olarak fıkhî hükümleri beyan etmek, öldürme, zina, içki içme, hırsızlık, eşkıyalık ve iftira suçlarını gerçekleşme şartları ve cezaların tatbikatı açısından incelemektir. Bu konudaki ihtilafların sebepleri lafzi olabileceği gibi, ki Arap dilinin çeşitli vecihlerde anlaşılma durumuyla doğrudan ilgilidir, delillerin, anlayışların ve görüşlerin farklılaşmasının hadlerin sınırları, şartları ve tatbik durumları ile ilgili farklara da götürdüğü açıktır. Çalışmanın sonunda, günümüzde İslam ülkelerinde ve diğer yerlerde işlenen suçların çeşitliliği ve yaygınlığı ile ilgili sebeplerin İslam hukukunun gaye ve hedefleri doğrultusunda incelenerek, suç tipleri, zaruret ve zarar kavramları da göz önünde bulundurularak daha ileri çalışmalar yapılması tavsiye edilmektedir."
