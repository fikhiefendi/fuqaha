abstract: "Dış ticaret bir ülkenin ekonomisinin esaslı unsurlarından biridir. Söz konusu Mısır ve Türkiye olunca bu çalışma daha önemli hale gelmektedir. Çalışma, Mısır ve Türkiye'nin mevcut ticaretini tespit etmek ve bunun geliştirme yollarını araştırmayı hedeflemektedir. Buna istinaden de“Mısır ve Türkiye Arasında Dış Ticaret ve Bunu Geliştirme Yolları”başlıklı bir araştırma konusu seçilmiştir. Çalışma bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde dış ticarete ilişin temel bilgiler verilmiş, ikinci bölümde Mısır ve Türkiye'nin 2006-2015 yıllarına ait dış ticaret verileri incelenmiş ve üçüncü bölümde ise, söz konusu iki ülke arasında dış ticaretin geliştirme yolları ele alınmıştır. Son olarak da çalışmanın sonuçları verilmiştir."
