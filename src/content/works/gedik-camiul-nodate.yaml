abstract: "Şeyh Bedreddin'in hayatı, hocaları ve eserlerinin tanıtımı çalışmamızın öncelikli konularıdır. Çalışmamızda Câmiu'l-Fusûleyn'in yazılış gayesi, önemi, muhtevası, kaynakları ve eser üzerine yapılan çalışmalar hakkında bilgi verilmiştir. Kaynakları üzerinde yoğunlaşılmış olup, kaynakların tanıtımı yapılmış ve yazma nüshalarına işaret edilmiştir. Eserin kendisinden sonra etkilemiş olduğu bazı eserler tespit edilerek fıkıh literatüründeki yeri ve önemi ortaya konulmuştur. Şeyh Bedreddin'in fıkhî tercihlerini yansıtan ıstılahlar, mezhep içi ve dışı tercihleri tespit edilerek bu bağlamda fıkhî görüşleri belirlenmiştir. Câmiu'l-Fusûleyn'de kaynak olarak kullanılan farklı eserlerden yapılan nakillerde bazen görüşler arasında tenâkuzlar oluşmuş, oluşan bu tenâkuzları ortadan kaldırmaya yönelik Şeyh Bedreddin'in tespitleri belirlenmiş, benimsemediği görüşlere yönelttiği tenkit ve itirazlar ortaya konulmuştur. Şeyh Bedreddin'in eserde ortaya koymuş olduğu fıkhî görüşler özel başlıklar altında açıklanmış, görüşlerden hareketle bazı çıkarımlarda bulunulmuştur. Eserde kullanılan şer'î delillere yer verilmiş, eserde geçen küllî kâideler ve zâbıtlar tespit edilmiştir. Ayrıca Şeyh Bedreddin'in ictihad ve taklid konusuna bakış açısı, bu konudaki düşünce ve görüşlerine değinilmiştir."
