abstract: "Çalışmamızın konusunu“iftira suçu”oluşturmaktadır. Bu suç tipi ile ilgili bilgiler tarihsel süreç ile birlikte ele alınarak nihayetinde 5237 sayılı Türk Ceza Kanunu bağlamında izah edilmeye çalışılmıştır. Çalışmamızda teorik tartışmalar ve Yüksek Mahkeme kararları dikkate alınarak suç tipinde karşılaşılan hususlara şahsi kanaatimizi de eklenerek ceza hukuku bilimine katkı yapmayı amaçlamaktayız. Çalışmamız özünde üç ana bölümden oluşmaktadır. İlk bölümde, bilhassa iftira suçunun tarihsel kökeni ve Türk hukukunun İslamiyet öncesi iftira suçunun varlığı ele alınmıştır. Ayrıca başka ülkelerin hukuk sistemleri incelenerek, suç tipinin evrensel olup olmadığı ve diğer hukuk sistemlerinde bir yaptırımla karşılanıp karşılanmadığı anlatılmıştır. Bunun yanında İslam hukuku mukayeseli hukuk olarak ele alınıp, kısaca İslam hukukun iftira suçunu ele alışı değerlendirilmiştir. Bölüm sonunda ise“zina isnadı ve nesebin reddi”durumuna yönelik suç tipi olan“kazif”suçunun, meri hukuk sistemi içerinde bir karşılığının bulunup bulunmadığı gerekçeleri ile ortaya konularak izah edilmeye çalışılmıştır. Çalışmamızın ikinci bölümde, Türk ceza hukuku bağlamında iftira suçunun koruduğu hukuki değer tartışması yapılmış, suçun unsurları ve iftira suçu açısından önem atfeden hukuka uygunluk halleri ele alınmıştır. Ayrıca iftira suçunun cezasını ağırlaştıran sebepler ve sonuçları izah edilmeye çalışılmıştır. Suçun özel görünüm biçimleri kapsamında bilhassa içtima kurumu açıklanmaya çalışılmıştır. Aynı bölüm içerisinde özellikle kanun koyucunun iftira eyleminden rücu etme halinde etkin pişmanlığın yapıldığı ana göre kademeli bir şekilde failin cezasının hafifletilme süreci ele alınarak izah edilmeye çalışılmıştır. Son bölümde, kanun koyucu tarafından basın ve yayın yoluyla işlenen iftira suçu için düzenlenen ve kanaatimizce infaz müessesi olan“hükmün ilanı”hususu izah edilmeye çalışılmıştır. Aynı bölüm içerisinde iftira suçundan hüküm alan bireylerin üzerinde iftira mahkûmiyetinin doğrudan veya dolaylı etkisinin bulunup bulunmadığı incelenmeye çalışılmıştır. Ayrıca iftira suçu ile bir kısım suç tipleri karşılaştırılarak benzer yönleri ile farklılık arz eden yönleri izah edilmeye çalışılmıştır."
