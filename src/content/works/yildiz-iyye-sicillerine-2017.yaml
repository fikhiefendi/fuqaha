abstract: "Şer'iyye sicilleri esas alınarak XIX. yüzyılın ikinci yarısında Rize ailesini sosyal, ekonomik, dînî ve kültürel yönleriyle ortaya koymayı amaçlayan çalışmamız, giriş ve iki ana bölümden oluşmaktadır. Girişte Rize ilinin tarihi, Osmanlı Devleti'nde şer'iyye mahkemeleri ve bu mahkemelerde tutulan siciller hakkında genel bilgiler verilmiştir. Birinci bölümde ailenin teşekkülü, Rize'nin aile yapısı, ailelerde yaşanan boşanma ve ölüm olayları, boşanma ve vefat sonrası çocukların korunmasına yönelik bazı uygulamalar üzerinde durulmuştur. Aynı bölümde ailenin refah durumu ve serveti, Rize ailesinin temel geçim kaynakları, aile fertlerinin görev ve meslekleriyle çeşitli ekonomik faaliyetleri incelenmiştir. Dînî ve kültürel yönüyle Rize'de aile hayatının ele alındığı ikinci bölümde, Rize ailesinin başlıca ibadet mekânları üzerinde durularak, Rizeli hayırseverler, Rize'nin dînî hayatında yer edinmiş bazı mühim şahsiyetler, Rize'de vuku bulan gayr-i dînî ve ahlakî davranışlar hakkında tespitlerde bulunulmuştur. Ayrıca Rize'de kullanılan şahıs adları, sülale adları, unvan ve lakaplarla ilgili değerlendirmeler yapılmıştır. Son olarak Rize ailesinin evi, evlerde ve günlük hayatın farklı alanlarında kullanılan muhtelif eşya ile giyim-kuşama dair tespitlere yer verilmiştir"
