abstract: "Hem dünyada hem de Türkiye özelinde İslami finans kavramı gün geçtikçe önem kazanmakta ve özellikle İslam ülkeleri başta olmak üzere Müslümanların azınlıkta olduğu ülkelerde dahi İslami finansın tüm finans sistemleri içindeki payında büyük bir artış gözlemlenmektedir. Bu araştırmada İslami finansın bulundukları ülkelerin ekonomik büyümesine ve dış ticaretine olan etkileri ve karşılıklı etkileşimleri incelenmiştir. Çalışmanın araştırma kısmında İslami finansın bulundukları ülkelerin ekonomik büyümesine ve dış ticaretine olan etkileri ve karşılıklı etkileşimleri IFSB'nin en son yayınladığı 2020 yılı raporuna göre katılım bankalarının kendi ülkesinin finans sisteminde en yüksek paya sahip 20 ülkenin verileri kullanılarak ekonometrik analizler ile ortaya konmaya çalışılmıştır. Sonuçlar, katılım bankalarının tüm ülke bankacılık sistemi içerisindeki yüzdelik payı ile GSYİH'daki yıllık yüzdelik değişim ve dış ticaretin GSYİH'daki yüzdelik payı arasında bir eşbütünleşme ilişkisinin olduğunu, katılım bankalarının tüm ülke bankacılık sistemi içerisindeki yüzdelik payından GSYİH'daki yıllık yüzdelik değişime doğru ve GSYİH'daki yıllık yüzdelik değişimden katılım bankalarının tüm ülke bankacılık sistemi içerisindeki yüzdelik payına doğru çift yönlü; tüm ülke bankacılık sistemi içerisindeki yüzdelik payından dış ticaretin GSYİH'daki yüzdelik payına doğru ise tek yönlü bir nedensellik ilişkisi bulunduğunu göstermektedir. Ayrıca katılım bankalarının tüm ülke bankacılık sistemi içerisindeki yüzdelik payının, GSYİH'daki yıllık yüzdelik değişim ve dış ticaretin GSYİH'daki yüzdelik payı üzerinde anlamlı ve pozitif bir etkisinin olduğu bulunmuştur."
