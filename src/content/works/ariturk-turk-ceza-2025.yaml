abstract: "Türk Ceza Hukukunda Rüşvet Suçu isimli çalışmamız üç ana bölümden oluşmaktadır. İlk bölümde temel kavramlar ve rüşvet suçunun tarihi gelişimi ele alınmıştır. Rüşvet kavramı Arapça kökenli bir terim olup, genel olarak yetkili bir kişiye menfaat sağlanması veya sağlanması için söz konusu bir kişiye para veya mal verilmesi olarak tanımlanmıştır. Türk Ceza Kanunu'nda rüşvet suçu 252. maddede düzenlenmiştir. Bu maddeye göre rüşvet suçu, görevinin ifasıyla ilgili bir işi yapması veya yapmaması için bir kamu görevlisine veya gösterdiği bir kişiye menfaat sağlayan kişi tarafından işlenmektedir. Kamu görevlisi kavramı da rüşvet suçunda büyük bir öneme sahiptir. Kamu görevlisi tanımı Anayasa ve kanunlarda geniş kapsamda ele alınmıştır. Kavramları müteakip olarak, Roma, Cermen, Kilise, İslam ve Osmanlı hukuklarında rüşvet suçuna yaklaşımlar incelenmiştir. Roma hukukunda rüşvet suçunun gelişimi, çeşitli yasal düzenlemeler ile kademelendirilmiş ve cezalar öngörülmüştür. Cermen hukukunda da benzer şekilde rüşvet suçunun ciddiyeti vurgulanmış ve cezalar belirlenmiştir. Kilise hukukunda rüşvet ve simoni suçları ele alınmış, cezalar belirlenmiştir. İslam hukukunda rüşvet suçu, Kuran-ı Kerim'deki ayetler ve Hz. Peygamber'in hadislerine dayanarak yasaklanmış ve cezaları belirtilmiştir. Osmanlı hukukunda rüşvet suçunun varlığı ve cezaları incelenmiş ve dönemsel düzenlemeler ele alınmıştır. Çalışmamızın ikinci bölümünde rüşvet suçunun uluslararası boyutu, karşılaştırmalı hukuktaki durumu ve benzer suçlarla karşılaştırılması detaylı olarak ele alınmıştır. Rüşvet suçunun uluslararası boyutu; Ekonomik İşbirliği ve Kalkınma Teşkilatının (OECD) Hazırlamış Olduğu“Uluslararası Ticari İşlemlerde Yabancı Kamu Görevlilerine Verilen Rüşvetin Önlenmesi Sözleşmesi”, Avrupa Konseyi Yolsuzluğa Karşı Ceza Hukuku Sözleşmesi, Birleşmiş Milletler Yolsuzlukla Mücadele Sözleşmesi ve Avrupa Birliği çerçevesinde Uluslararası Örgütler olarak ele alınırken Alman, Fransız, İsviçre, Norveç ve ABD ulusal ceza hukuklarında nasıl düzenlendiği de karşılaştırmalı hukuk alanında incelenmiştir. Bu bölümde son olarak Zimmet Suçu, İrtikap Suçu, Nüfuz Ticareti Suçu, Görevi Kötüye Kullanma Suçu, Dolandırıcılık Suçu ve 6222 Sayılı Kanun'da Düzenlenen Şike Suçu Rüşvet suçuna benzer suçlar olarak benzerlik ve farklılıkları incelenmiştir. Çalışmamızın son bölümünde ise Türk Ceza Hukukunda Rüşvet Suçu detaylı olarak ele alınmıştır. Öncelikle suçla korunan hukuki değere değinildikten sonra suçun unsurlarını; konu, fiil, fail ve mağduru içerecek şekilde maddi unsurlar, manevi unsur, hukuka aykırılık unsuru, suça etki eden haller çerçevesinde ve özellikle Yargıtay kararları ve doktrinel yaklaşımları ile incelendikten sonra kusurluluk, suçun özel görünüş şekilleri, cezalandırmayı etkileyen diğer halleri ile soruşturma ve kovuşturma usulü ve yaptırım konuları detaylı olarak incelenmiştir."
