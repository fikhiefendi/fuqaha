abstract: "İslam Peygamberi Hz. Muhammed Mustafa (sav) \"insanların en çok müşâvere edeni\" olduğu halde; İslam'ın temel referansı Kur'an-ı Kerim Müslümanları namaz kılan ve infak eden kimseler olarak tanımlarken bu ikisinin arasında aynı zamanda \"işlerinin aralarında şûrâ\" olduğunu beyan buyurduğu halde İslam ümmetinin şûrâ fıkhı üzerinde namaz ve zekât kadar düşünmediğini ve yazmadığını görüyoruz. Oluşmuş olan literatür ise genellikle birbirini tekrar eden teorik yaklaşımlarla sınırlı kalmaktadır. Biz bu tez çalışmamızda çağdaş İslami hareketlerin şûrâ prensibi karşısındaki tutumunu Mısır İhvan ve Tunus Nahda hareketleri üzerinden inceledik. İhvan da Nahda da şûrânın bağlayıcılığını prensipte kabul etmekle birlikte, İhvan'ın bu yaklaşımı tatbikata yansıtmakta zorlandığı görülmektedir. Dünyadaki demokrasi tecrübelerini \"hikmet müminin yitik malıdır\" anlayışıyla benimsemekten çekinmeyen, böylece şûrâ prensibini görece daha yaygın uygulayan İslami hareketlerin politikada daha başarılı ve kalıcı oldukları görülmektedir. Nahda hareketi bunun canlı bir örneğidir."
titleTranslation: {"en": "The attitude of Islamic movements against the principle of“Shûrâ”: Ikhwan and Nahda as example"}
