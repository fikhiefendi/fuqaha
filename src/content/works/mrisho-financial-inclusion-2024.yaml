abstract: "İİT ülkelerindeki yeraltı ekonomisinin büyümesi, politikaları doğrudan veya dolaylı olarak etkileyerek bölgenin kalkınmasını sınırlandırdığı için birçok devleti çözüm bulma konusunda alarma geçirmiştir. Bu çalışmanın amaçları, finansal tabana yayılmanın ikili bankacılık sistemi içerisinde yeraltı ekonomisi üzerindeki etkisini incelemek, ardından kurumsal gelişimin yeraltı ekonomisi üzerindeki rolünü ölçmek ve son olarak özellikle İİT bölgesinde yeraltı ekonomisini etkileyen faktörleri incelemektir. Çalışma, 2002'den 2018'e kadar 16 yılı aşkın bir süre boyunca 49 ülkeden elde edilen panel verilere sabit etkiler metodolojisini uygulamaktadır. Bulgular, hem İslami hem de konvansiyonel bankalar arasında kayıt dışı ekonomi ile finansal tabana yayılma arasında negatif bir ilişki olduğunu göstermektedir. Kurumsal kalite ile kayıt dışı ekonomi arasında İslami bankaların varlığında pozitif, konvansiyonel bankaların varlığında ise negatif bir ilişki vardır. Ayrıca, hem İslami hem de konvansiyonel bankaların varlığında vergiler arttıkça yeraltı ekonomisinin büyüklüğü artarken, reel efektif döviz kuru ve GSYİH yıllık büyümesi, İslami bankaların İİT içindeki pazar payının konvansiyonel bankalara kıyasla küçük olmasından dolayı İslami bankaların varlığında pozitif, konvansiyonel bankaların varlığında ise negatiftir. Dolayısıyla çalışma, politika yapıcıların finansal kapsayıcılık ve kurumsal kalitenin kayıt dışı ekonomi üzerindeki etkisini artırmak için İslami kurumlara daha fazla yatırım yapmayı düşünmeleri gerektiğini ortaya koymaktadır."
