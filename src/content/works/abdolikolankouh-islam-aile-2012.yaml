abstract: "Evliliği sona erdirme şekillerinden biri de talâktır. Talâk kocanın tek taraflı evliliği sona erdirmesidir. Kocanın, talâk yetkisini nasıl kullanacağını Allah Teâlâ Kur'an'da bizlere bildirmiştir. Allah'ın emrettiği şekilde talâkın gerçekleşmesi için kadının hayızlı olmaması, eğer temizlik döneminde ise o temizlik dönemi içinde onunla ilişkiye girmiş olmaması gerekir. Bunun dışındaki boşama şekilleri Kur'an'a aykırı olacağından geçerli değildir. Talâk, nikâh bağının çözülmesi anlamında Türkçe karşılığında boşamadır. Bu da bain ve ric'î olmak üzere iki kısma ayrılır. İslâm hukukunda boşama yetkisi erkeğe vermekle birlikte kadın da isterse bu yetkiyi Tefviz-i talâk ile kullanılmaktadır. Talâk mubah olmakla birlikte Allah'ın hoşlanmadığı bir ruhsattır. Boşamanın diğer bir türü olan şartlı boşama ve buna bağlı olarak boşama yemini konusunu boşama yemini ile ilgili farklı yaklaşımlar ve günümüz İslâm ülkelerindeki uygulamalar gündeme getirilmektedir. Aynı zamanda çalışmamızda toplumda sıkça rastlanan her türlü hastalıklar ve ya öfke halinde verilen talâkın fıkhı açıdan geçerli olup olmayacağı konusu farklı mezhep hukukçularının görüş ve gerekçeleriyle birlikte incelenecektir."
