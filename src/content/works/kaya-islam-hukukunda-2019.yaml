abstract: "Dünyayı imar etmenin ve yaşanılır hale getirmenin vazgeçilmez kurumu ailedir. İslam ailesinin temel niteliği ise, ailenin huzur yuvası ve bir sevgi-rahmet pınarı olmasıdır. Aile içinde karşılıklı saygı, sevgi, dayanışma, bağlılık ve iş bölümü esastır. Aile üyelerinin, ailenin birliği ve devamı için her birinin taşıdığı sorumluluğu yerine getirmeleri, iş bölümü içinde olmaları gerekmektedir. Bununla birlikte eşler arasında zaman zaman problemler oluşmakta, geçimsizlik baş göstermektedir. Kur'an'da bu durum“nüşûz”ve“şikak”kavramlarıyla ifade edilmiştir. Bu tezimizde genel olarak İslam'da aile kurumunun oluşum süreci nikâhı, eşler arası geçimsizlik olan nüşûz kavramını fıkıh, sünnet ve tefsir eserlerini kaynak alarak araştırdık. Diğer taraftan Türk Medeni Kanununun ilgili maddelerini ve günümüz aile hayatıyla alakalı yazılmış eserleri de gözden geçirdik. Bu çalışmamızda araştırma, karşılaştırma ve yorumlama yöntemini kullandık. Sonuçta ailede çıkabilecek problemlerin çözümü için eşlerin aralarında konuşarak, görüşerek çözmeleri gerektiğini, aile içinde çözülemediği takdirde de bir hakeme başvurulması ve aile müessesinin devamının sağlanması konusunda tarafların yani karı-kocanın hassas davranmasının gerekli olduğu kanaatine vardık."
