abstract: "Bu araştırma, İslâm Tarihi ışığında; Divan'ın iktisadî-mâlî zeminde gerçekleştirdiği düzenlemeler, mâlî gelir-giderler açısından sağladığı adâlet, İslam Devleti'nin iktisâdî işleriyle ilgilenen bütün divanlara yaptığı mâlî denetlemeyle iktisâdî bozulmanın nasıl önünü aldığı konularını inceleyip o asırlarda Divan'ın denetimindeki mâlî girdi ve çıktıları ortaya koyarak Divan Teşkilatı'nın iktisâdî düzendeki rolünü ortaya koymayı hedeflemektedir. Bu girdi ve çıktılar araştırmada her döneme âit rakamları içeren tablo ve şemalarla düzenlenip gösterilmiştir. Araştırma İslam Devleti'nin hüküm sürdüğü bütün asırları kapsamakla beraber, Divan'ın farkedilir şekilde geliştiği Abbâsîler ve Emevîler Dönemlerine ayrıca odaklanmıştır. Araştırma; Divan Teşkilatı'nın yüksek miktarda parayı idâre etmesi ve İslam Devleti'nin topluma yapılan harcamaları, bireylere verilen erzağı ve devlet altyapısı için yapılan harcamaları da kapsayan genel harcamalarını denetlemekten sorumlu olmasıyla iktisâdî-mâlî düzende ciddi bir etkisi olduğu sonucuna varmıştır. Ayrıca araştırma, şu anki asırda Divan Teşkilatı'nın yokluğundan kaynaklanan sonuçları zikrederek sona ermektedir."
