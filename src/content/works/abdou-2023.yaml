abstract: "Bu çalışmada, Hanefi fakihlerinden İmam Tâcüşşerîa Ömer b. Ahmed el-Mahbûbî'nin Nihâyetü'l-Kifâye li-Dirâyeti'l-Hidâye adlı eserini tahkik ederek değerlendirdik. El yazma, Merginânî'nin el-Hidâye şerhu bidâyetü'l-mübtedî adlı eserinin“kavluhu”tipi kısmî şerhidir. Müellif, eserini anlaşılır bir üslupla yazmıştır. Eser, el-Hidâye'nin en eski ikinci şerhi olması ve kapalı yönlerini şerh etmesi yönüyle faydalıdır. Eserin müellifi Tâcüşşerîa, Orta Asya Hanefî mezhebi tarihi, Buhara ilim ve siyasetinde öne çıkan/sadr ailelerinden Mahbûbîler'e mensuptur. Müellifin soy ağacındaki baba, oğul ve vefat bilgisi ile ilgili karışıklığı, çeşitli el yazmalardaki şecerelerden gidererek torunundan aşağı doğru ailenin yakınlık sırası Sadrüşşerîa es-Sani Ubeydullah b. Mesud b. Tâcüşşerîa Ömer b. Sadrüşşerîa el-Evvel Ahmed b. Ubeydullah b. İbrahim şeklindedir. Vefat tarihi 709 değil yaşadığı olaylara kıyasla 696 sonrası bir tarih olmalıdır. El yazmasının 30 civarı nüshası olup ikinci cilde ait 12 nüshadan 10 tanesi karşılaştırarak tahkik ettik. Esas aldığımız Fatih Kütüphanesi nüshası, müellifin imla ettirdiği en eski nüshalardan biri olup hayatına en yakın nüshadır. Çalışmamız, el yazmanın ikinci cildi bey'-ikrah bölümleri arasındaki bölümlerdir."
