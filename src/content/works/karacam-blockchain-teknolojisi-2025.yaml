abstract: "Blockchain teknolojisi kullanılarak gerçekleştirilecek sukuk ihracı, sektörde önemli bir yenilik olarak değerlendirilmektedir. Bu teknolojinin Türkiye'deki bankacılık sistemine entegrasyonu, Türkiye bankalarının uluslararası ticarette rekabet gücünü artıracaktır. Ayrıca, sukuk ve diğer İslami finansal ürünlerin ihracında blockchain teknolojisinin kullanılması; şeffaflık, güvenlik, düşük maliyet ve yüksek işlem hızı gibi önemli avantajlar sağlayacaktır. Kırsal kesimlerde yaşayan ve finansal kurumlara, bankalara ulaşımı zor olan kişiler online bir şekilde bu sisteme dahil olarak şeriat prensiplerine uygun olan işlemler sağlayabilecektir. İslam alimleri, blockchain teknolojisini devlet ve kurumlar tarafından düzenlemeler getirmesiyle İslami finans için uygulanabilir olacağını söylemektedir. İslami finansın en belirgin olan kuralları belirsizlik (Garar), faiz yasağı olarak bilinir, bu da sistemi bunun üstüne kurulan bir uygulama ile blockchain teknolojisi kullanıcılarına bu hizmeti sunabilir. Yapılan literatür taramaları, blockchain teknolojisinin başta komisyon maliyetlerini azaltmak olmak üzere, birçok alanda İslami finans uygulamalarını destekleyebileceğini ve hatta bu alandaki yapısal eksiklikleri gidermede önemli katkılar sağlayabileceğini ortaya koymaktadır. Birçok alanda blockchain teknolojisinin akıllı sözleşmeler aracılığıyla kolay bir şekilde aracıları kaldırarak satıcı kurum ve yatırımcının çıkarlarını korumak üzerine tasarlanmıştır. Akıllı sözleşmeler aracılığıyla yapılacak olan işlemlerde, bir mülkiyet hakkı yatırımcıya verilerek ve sözleşmede belirlenen tarihte geri alınacağı ifade edilir. Bu da akıllı sözleşmelerin komisyoncuları ve aracı kurumların karmaşık işlemlerinin otomatik bir şekilde yapılacağı anlamına gelmektedir. Blockchain teknolojisi kullanılarak alım satım yapılan finansal ürünlerde komisyon maliyetlerinde %95 oranında bir tasarruf sağlandığı söylenmektedir. Bankalarının bu sistemi uygulaması ise Türkiye'deki bankacılık sisteminin dünya çapında tanınması ve ülke ekonomisine katkı sağlanmasında büyük bir rol oynayacaktır."
