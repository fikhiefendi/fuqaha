abstract: "İslam dini, îmân, ibadet ve ahlâk alanlarındaki prensiplerin uygulanmasını sağlamak, bunlarla ilgili emir ve yasakların ihlâlini önlemek, ferdî ve sosyal hayatı bütün yönleriyle ıslah etmek amacıyla hem bu dünya hem de ahiret hayatına yönelik birtakım caydırıcı tedbirler almıştır. Bu tedbir ve müeyyidelerin tamamı ceza kavramının kapsamı içindedir. İnsanlığa bir hidayet rehberi olarak gelmiş olan İslam dini, hayatın diğer sahaları yanında ceza hukûku sahasında da bir takım hükümlere sahiptir ki, bunlar dinin değer ve ideallerini korumaya yöneliktir. İşte dinin değer ve ideallerini korumaya yönelik olarak konulan kısas ve diyet cezası insan hayatını, içki içme ve sarhoşluk için öngörülen ceza aklı, zina ve iftira suçlarına uygulanacak cezalar ırzı, hırsızlık suçuna verilecek ceza malı, irtidât'ın cezalandırılması dini, eşkiyalık, bağy ve büyü/sihir suçları için öngörülen cezalar da bu değerlerden bir kaçını ve sonuçta kamu düzenini korumayı hedef alır. İnsanlık tarihi kadar eski olan suç işleme fiili, Hz. Peygamber zamanında da vuku bulmuş ve Hz. Peygamber'in işlenen bu suçlara ne gibi cezalar uyguladığı, Kur'ân da miktar ve keyfiyeti belirlenen cezalar dışında başka cezalar uygulayıp uygulamadığ, uygulamış olduğu cezaların had kapsamında mı yoksa ta'zir kapsamında mı olduğunun bilinmesi önem arz etmektedir. İşte bu tezimizde Hz. Peygamber'in uygulamış olduğu had, kısas-diyet ve ta'zir cezalarını, ayrıca ayet ve hadislerle sabit olan diyânî cezaları incelemeye çalıştık."
