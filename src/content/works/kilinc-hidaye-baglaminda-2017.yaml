abstract: "Hüküm koyucu, açıklayıcı, teyit edici yönleriyle sünnet, İslam dininin temel kaynaklarındandır. Fıkhî hükümlerin delillendirilmesinde Kur'an-ı Kerim'den sonra önemli bir yer tutmaktadır. Merğînânî de“el-HidâyeŞerhu Bidâyeti'l-Mübtedî”adlı eserinde hükümlere delil olarak hadisleri getirmiştir.el-Hidâyebağlamında İmam Merğînânî'nin hadisleri kullanma yöntemi adlı tezimizde el-Hidâye'nin içerisinde yer alan hadisler inceleme konusu yapılmıştır. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde İmam Merğînânî'nin hayatı üzerinde durulmuş, hocaları, öğrencileri, eserleri hakkında genel bilgi verilmiştir. İkinci bölümde ise el-Hidâye'de yer alan garib, mürsel, mevzu hadisler, mevkuf hadisin Merfû hadis olarak nakli ve telfîku'r-rivayet üzerinde durulmuştur. Sonuç bölümünde de konunun genel bir değerlendirmesi yapılmıştır."
