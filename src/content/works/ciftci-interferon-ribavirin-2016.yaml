abstract: "NS3-NS4A serin proteaz,kronik hepatit C virüs enfeksiyonu için geliştirilmekte olan direk etkili antiviral (DEA) ilaçların temel hedeflerinden biridir. HCV enfeksiyonu sırasında lökosit hücre antijenleri tarafından oluşturulan seçici baskının sonucu olarak, viral genomda yüksek seviyede nükleotit mutasyonu gözlenmekteve viral kaçış mutasyonlarının meydana çıkmasına neden olmaktadır. Bu çalışmanın amacı, proteaz inhibitöreleri yönünden naif, HCV genotip 1b ile enfekte karaciğer alıcılarında, daha önce proteaz bölgesinde ilaç direnciyle ilişkilendirilmiş amino asit değişimlerini ve CTL epitoplarındaki değişimleri karakterize etmektir. Dirençle ilişkilendirilen varyantlar 3 hastada bulunmuştur (3/5). Toplam 14 serum örneğinde 3 farklı (155G,168A ve 168G) dirençli varyant bulunmuştur. Sonuçlarımız, HCV ile enfekte ve proteaz inhibitörü kullanmayan karaciğer organ alıcılarında kendiliğinden oluşan dirençli varyantların varlığını göstermiştir. İki farklı veri bankasından NS3 bölgesinde bulunan ve HCV genotip 1 olarak bildirilen CTL epitopları indirilmiştir. Transgenik memeli hücrelerinden gelen epitoplar ve HLA tipi belirsiz olanlar dışlanmıştır. Beş hastadan elde edilen 14 serum örneğinin CTL epitoplarının korunmuşluk oranları %28 ile %57.3 arasındadır. HCV ile enfekte karaciğer organ alıcılarında kendiliğinden oluşan dirençli varyantların proteaz inhibitörleriyle üçlü sağaltıma başlanmadan önce tanımlanması, sağaltıma yanıtı tahmin etmede yardımcı olabilir. Bağışık yanıttan kaçış ve ilaç direnci profillerinin karakterizasyonu, kişinin ilaç rejiminin belirlenmesinde önemli bilgiler sağlayabilir."
