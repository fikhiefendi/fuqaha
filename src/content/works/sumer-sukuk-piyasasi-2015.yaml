abstract: "İlk ihraçlarına 1990'lı yılların başında Malezya'da başlanan sukuk, dünya genelinde yıllık 100 milyar doları aşan ihraç rakamlarıyla, alternatif bir finansman aracı olarak Ortadoğu, Asya, Avrupa ülkelerinden ilgi görmektedir. Ülkemizde, 2010 yılında Sermaye Piyasası Kurulu'nun (SPK) çıkarmış olduğu tebliğle ihracı mümkün hale gelen sukuk, ilk olarak Kuveyt Türk Katılım Bankası tarafından ihraç edilmiştir. Türkiye'de halihazırda yer alan 4 adet katılım bankası ve özel sektör kuruluşları sukuk ihracı gerçekleştirmişlerdir. Ülkemizde, 2012 yılında Hazine Müsteşarlığı'nın da sukuk ihraçlarına başlamasıyla, sukuk piyasası gelişimini hızlandırmıştır. İkincil piyasası da oluşan sukuk, yatırımcılar için önemli bir finansal enstrüman haline gelmiştir. Gerek dünyada gerekse de ülkemizde büyüme trendi gösteren sukuk piyasasının incelendiği bu çalışmada, sukukun kavramsal yapısı, özellikleri, türleri üzerinde durulmuştur. Dünya genelinde ülkelerin sukuk piyasaları hakkında da incelemeler yapılmıştır. Türkiye sukuk piyasasına ilişkin detaylı bilgilerin yer aldığı bu çalışmada, SPK 2010 ve 2013 tebliğlerinin karşılaştırılmasına, sukuk ihracı gerçekleştiren kurum ve kuruluşların ihraçlarının değerlendirilmesine ve ülkemizde sukuk piyasasının gelişimi için önerilere yer verilmiştir."
