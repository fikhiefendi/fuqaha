abstract: "18. Yüzyılın yarısından itibaren Avrupa'daki gelişmelerden etkilenenOsmanlı Devleti hukuk sahasında yaşanan kanunlaştırma hareketlerinden deetkilenmiş ve Tanzimat'ın ilanından sonra Batı'dan birtakım k a n u niktibaslarına başlanmıştır. Kanunların Batı'dan alınması fikrinden hareketleve dönemin şartları doğrultusunda seküler fikirler gelişmiş ve dinin sınırlarıçizilmeye başlanmıştır.İslam Hukuku çerçevesinde Aile Hukuku alanında Osmanlı Devleti'nde vedaha da geniş düşündüğümüzde İslam Tarihi boyunca ilk kanunlaştırmafaaliyeti 1917 Hukuk-i Aile Kararnamesiyle ortaya konmuştur. Aslında MedeniHukuk alanı 1876 tarihinde Mecelle ile, kanunlaştırma sahasına girmesinerağmen halk arasında farklı mezhep ve din farkı olması, muhtemel itirazlaramaruz kalmamak ve diğerleri kadar acil bir konu olmamasından dolayı 1917tarihine ulaşılmıştır.Ancak dönemin şartları göz ününe alındığında imparatorluğun içindeki zordurum, savaşlar ve farklı görüşlerin ortaya çıkması sonucunda yaşananolaylar sosyal konularda da birçok değişimi beraberinde getirmiş ve öncelikletepeden inme bir şekilde uygulanan kanunlar zamanla halk tarafındanbenimsenmeye başlamıştır.Aile Hukuku alanında referans olarak dini konulardan seküler birdayanağa geçişi 1926 tarihinde Medeni Kanunla görmekteyiz. HalkCumhuriyet'e geçişle birlikte yaşadığı sosyal ve kültürel değişim ortamınaalışmakta birtakım zorluklar yaşamıştır. Aile Hukuku alanında da uzun yıllarbu zorlukların yansımaları görülmektedir. Yeni düzene alışma noktasındaiktibas edilen kanunda birtakım değişiklikler yapılmış, yaşandıkça ortayaçıkan sorunlar doğrultusunda da çözüm yolları aranarak sorunlar aşılmayaçalışılmıştır."
