abstract: "Tarih alanında, özellikle de sosyal yapının araştırılmasında kullanılacak kaynakların başında, gerçekçi ve yoruma dayanmayan verileri ihtiva eden“Şer'iyye Sicilleri”gelmektedir. Osmanlı Devleti'nde olduğu gibi Kırım Hanlığında da kadılar tarafından kayda alınmış olan siciller devlet ve halk arasındaki ilişkilerde adeta bir köprü görevi görmüşlerdir. Siyasî, idarî, hukukî ve sosyal tarih araştırmalarının başlıca kaynaklarından birisini teşkil eden“Şer'iyye Sicilleri”sunduğu zengin veri kaynakları ile bölgenin sosyo-ekonomik ve kültürel yapısına dair içerdiği örnekler, yüzyıllar sonra bile araştırmacılar tarafından doğru bilginin edinilmesinde büyük önem arz etmektedir. Sicillerin içerisinde yöre insanının şikâyet ve dilekleri, gerek merkezden kadıya gönderilmiş ferman, berat gibi emirler gerekse de kadı tarafından merkeze gönderilen ilam ve hüccetler ile kişilerin ölümleri halinde mal varlıklarının tespit edildiği terekelerden tutun da hemen hemen her alana dair kayıtlar bulunmaktadır. Ayrıca son yıllarda tarih alanında aile kurumuna dair yapılan araştırmaların çoğalması bu konunun ehemmiyetini gözle önüne sermektedir. Karadeniz'in kuzeyinde çok geniş bir sahaya hükmeden Kırım Hanlığı, Osmanlı Devleti'nin yalnızca kuzeyde değil, doğu ve batıda da her daim yanında bulunmuş, desteğini her zaman hissettirmiştir. Nitekim Kırım Hanlığı'nın 1783 senesinde Ruslar tarafından ilhakı da Osmanlı Devleti'nin savaş meydanlarındaki yenilgi sayısını arttırmıştır. İşte bu sebeplerden ötürü Kırım Hanlığı Tarihinin araştırılması Osmanlı Tarihi bağlamında bir zarurettir. Bu tezin hazırlanmasındaki ilk amaç Kırım Tatarlarının gündelik yaşamlarını daha net bir biçimde gözler önüne serebilmektedir. Kırım Hanlığı Şer'iyye Sicilleri kullanılarak şehir tarihi yazımı çok defa kaleme alınmıştır. Ancak aile konusunda daha önce bir araştırmanın yapılmamış olması çalışmamızın temel motivasyonunu oluşturmuştur. Tez toplam 6 ana bölümden meydana gelmektedir. Birinci bölümde Kırım'ın tarihçesi yer almaktadır. Bu bölüm üç alt başlık halinde incelenmiş olup ilk olarak Tatarlardan önce Kırım'ın tarihçesi, ardından yarımadanın Türkleşme süreci ve en nihayetinde de Kırım Hanlığı Tarihi anlatılmıştır. İkinci bölümde İslâmiyet öncesi Türklerde aile konusu işlenmiş ve eski Türk-Tatar topluluklarının aile kurumuna bakış açıları aktarılmaya çalışılmıştır. Üçüncü bölümde Müslüman Kırım Tatarlarında aile konusu işlenmiştir. Evliliğe gidilen süreçte Kırım Tatarlarının nişan, nikâh gibi gelenekleri sicillerden örneklerle kaleme alınmıştır. Dördüncü bölümde evliliğin taraflara yüklediği hak ve sorumluluklar anlatılmıştır. Beşinci bölümde boşanma konusu işlenmiş ve en nihayetinde altıncı ve son bölümde ise miras ve paylaşım konusu incelenerek çalışma tamamlanmıştır."
