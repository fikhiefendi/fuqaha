abstract: "Piyasalarda serbest rekabet sisteminin varlığı hem ana akım iktisat literatüründe hem de İslam iktisat anlayışında arzu edilen bir olgudur. Bunun nedeni, adil rekabetin tesis edildiği mübadele merkezlerinde tüketicinin daha iyiye ulaşmasını kolaylaştıracak olmasıdır. Ancak insanlardaki rekabet duygusu bazı zamanlar birtakım haksızlıkların ortaya çıkmasına yol açabilir. Rekabet sonucu olarak pazarda hâkim duruma gelen teşebbüs, sahip olduğu konum itibariyle rakiplerini ezebilir. Yıkıcı fiyat uygulaması da bunlardan biridir. Devletler anayasalarında bu gibi durumlara karşın gerekli yasal düzenlemeleri zaman geçtikçe yapmaya çalışmaktadır. İslam'ın temel kaynakları incelendiğinde genel anlamda haksız kazancın haram kılındığı görülmektedir. Zamanın ilerlemesi ve yeni ekonomik ilişkilerin ortaya çıkmasıyla beraber yeni iktisadi aldatmalar da peyda olmaktadır. İslam Hukuk literatüründe kötü niyete bağlı şekilde fiyat indirimleri olan yıkıcı fiyatlandırma az bahsedilen bir mesele olmaktadır. Bu yüzden İslam Hukuku'nun temel ilkeleri ve birikimlerinden yola çıkarak yıkıcı fiyat uygulamasının dini boyutunu ele alacağız."
