abstract: "Tez Özeti Tezin adı: El-Kefil Bi-Maani't Tenzil. Müellif: Kadı İmaduddin El-Kindi (ö. 741 Hicri) Mümtehine suresinin başından Saff suresinin sonuna kadar inceleme ve tahkik çalışması. Tezin içeriği: Tez bir mukaddime, iki kısım, sonuç ve çeşitli fihristlerden oluşur. Mukaddime: Konunun önemini, bu konuyu seçme nedenlerini, konu hakkında önceki çalışmaları, tezi yazarken üzerinde yürünen yolu ve tahkik yöntemini ele alır. . Birinci Kısım: Bu kısım müellifin biyografisi ve kitap hakkında yapılan araştırmayı ele alır. Bu kısım üç fasıldan oluşur: Birinci Fasıl: Zemahşeri'nin hayatı, Keşşâf adlı kitabının tanıtımı ve bu kitap üzerine yazılan haşiyeler hakkında kısa araştırmayı ele alır. İkinci Fasil: Bu bölüm müellif İmaduddin'in ismi, nesebi, doğumu, yaşamı, ilmi hayatı, telifleri, hocaları, öğrencileri, akidesi, fikhi mezhebi, ilmi mekaneti, alimlerin ona karşı övgüleri, yaşadığı asırdaki siyasal durumlar, ictimai ve ilmi hayatı hakkında genel biyografisini ele alır. Üçüncü Fasıl: Bu bölüm, El-Kefil kitabının araştırmalar ile isminin doğrulanması, kitabın müellife ait oluşunun isbatı, kitabın konusu, kaynakları, müellifin kitaptaki metodu, kitabın ilmi değeri, yazma eserin nüshalarının tümünün vasfi ve bu nüshalardan örnek alıntıları içeren araştırmayı ele alır. • İkinci Kısım: Bu bölüm kitaptan Mümtehine süresinin başından Saff süresinin sonuna kadar yapılan tahkik çalışmasını içerir. Tez en sonunda ilmi ve çeşitli fihristlerle sonlandırılmıştır. Hamd alemlerin Rabbi Allah'adır. Allah efendimiz Muhammed'e, onun ailesine ve tüm ashabına salat ve selam etsin."
