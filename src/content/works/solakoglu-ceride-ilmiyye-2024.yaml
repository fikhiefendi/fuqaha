abstract: "Bu çalışmada Osmanlı Devleti'nde 1914-1922 tarihleri arasında Meşîhat Makamı'nın resmi yayın organı olarak neşredilmiş olan Cerîde-i İlmiyye içeriğindeki“Fetâvâ-i Şerîfe”ve“Ecvibe-i Şer‛iyye”bölümleri İslam aile hukuku açısından incelenerek dönemin aile hukuku uygulamalarına ışık tutulması amaçlanmıştır. Aile hukukunun o dönem şartlarında nasıl uygulandığını ortaya koymayı amaçlayan çalışmamız giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında araştırmamızın konusu, amacı, önemi ve yöntemi ile Cerîde-i İlmiyye ile ilgili olarak daha önce yapılmış olan çalışmaların incelenmesi yoluyla literatüre dair bilgi verilmektedir. Çalışmamızın birinci bölümünde Osmanlı Devleti'nde Meşîhat Kurumu'nun ve Şeyhülislâmlığın ortaya çıkışı ve tarihi ile ilgili bilgi verilip, Şeyhülislâmların İlmiye Teşkilatının başı olması münasebetiyle bu makamın görev ve yetkilerine değinilmektedir. Meşîhat Makamının alt birimlerinden olan, fetva ve şer‛î sorulara cevaplar verme görevini üstlenen Fetvahâne-i Âlî'nin işleyişine değinilerek Meşîhat'in resmi dergisi olan Cerîde-i İlmiyye'nin Osmanlı hukuk tarihi ve aile hukuku açısından öneminden bahsedilerek yayınlanma nedenleri ve içeriği ilgili bilgi verilmektedir. İkinci bölümde ise aile hukuku kapsamına giren nikâh akdinin yapılışı ve sıhhati, nikâhta velayet, buluğ muhayyerliği, nikâhta vekil ve fuzûlînin nikâhı, evlenme engelleri, gayrimüslimler ve kölelerle evlilik gibi konular ile nikâhın doğurduğu sonuçlardan mehir, nafaka ve nesep evlenme başlığı altında ele alınmıştır. Boşanma başlığı altında talak, tefrik, muhâlea ve diğer boşanma çeşitleri ile boşanmanın doğurduğu sonuçlardan iddet ve hidâne konuları incelenmektedir. Konular ele alınırken öncelikle İslam Hukukunun temel prensipleri ve gerektiği halde dört mezhebin görüşlerine göre bilgi verilmeye çalışılarak, konuyla ilgili tespit edebildiğimiz fetva mecmualarından Osmanlı uygulamasıyla karşılaştırmalı biçimde Cerîde-i İlmiyye içeriğindeki fetvalar ve ecvibe-i şer‛iyye incelenmiştir. Eğer varsa önceki dönemlerden farklı uygulamalar tespit edilerek ortaya konulmaya çalışılmıştır."
