abstract: "İslami finans sistemi, toplumun ekonomik hayatının yanında sosyal ve dini hayatlada bütünleşik durumdadır. Çalışmamızın konusu, Türkiye'de islami finans araçlarının tercih edilme nedenlerini açıklayarak ve kullanılan yatırım ürünlerinin dünya genelinde ve de ülkemizdeki durumla karşılaştırılmasını, islami yatırım ürünlerinin tanımı, kullanım şekillerini ve müşterilerin tercih durumlarını belirlemektir. Araştırma da verilerin toplanması mülakat şeklinde, yarı yapılandırılmış görüşme tekniği kullanılmıştır. Araştırmanın katılımcıları, katılım bankalarında en az onbeş yıl tecrübe sahibi olan şube müdürleridir. Çalışmaya katılan şube müdürlerinin görüşlerinden hareketle islami finans araçlarının tercih edilmesine etki eden faktörler tanımlanmıştır. Konuyla iligili literatür taramalarımızda ise, İslami finans ürünlerini daha çok katılım bankacılığını kullanan müşterilerin tercih ettiğini ve bu konuda bilgi sahibi olduklarına ulaşılmıştır."
