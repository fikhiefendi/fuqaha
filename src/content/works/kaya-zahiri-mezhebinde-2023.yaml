abstract: "Hz. Peygamber'in hadislerini tespit etmek ve onları doğru bir şekilde anlayıp sonraki nesle aktarmak muhaddis ve fakîhler başta olmak üzere İslâm âlimlerin temel gayelerinden olmuştur. Bu cihetle çalışmamızda Zâhirî âlimlerin Hz. Peygamber'in hadislerinin tespit çabaları ve onları anlama ve yorumlama metodları ele alınmıştır. Zâhirî âlimler haber, sünnet ve hadis etrafında oluşan meselelerin hemen hemen tümüne müdahil olmuş ve kendi düşüncelerini dile getirmişlerdir. Ancak söz konusu meselelere yaklaşımlarında kendi içerisinde bütünüyle homojen bir yapıda olmayan Zâhirî âlimleri bazı konularda muhaddis ve fakîhlerin cumhuruna da muhalefet etmişlerdir. Zayıf hadisle amel ve hadislerin mana ile rivayeti meseleleri bu konulardan birkaçıdır. Çalışmamızda Zâhirî âlimlerin hadislerin lafzına bağlı kaldıkları ve hiçbir surette hadislerin mana ve gayelerini dikkate almadıklarına dair ön yargıların isabetli olup olmadıklarına da değinilmiştir. Bu bağlamda Zâhirî âlimlerin, hadislerin sıhhatini tespit etmede isnadın yanı sıra metin tenkidi kriterlerini de sıklıkla kullandıkları görülmüştür. Ayrıca Zâhirî âlimlerin hadisleri anlama ve yorumlama yöntemleri incelenmiştir. Onlar lafızcı yaklaşımlarla birlikte Hz. Peygamber'in dini beyan etme görevini de dikkate almışlardır. Zâhirîler insanî değerleri de önemseyerek külfet, zaruret ve insan malının, canının ve namusunun kutsiyeti gibi ilkelerin yanı sıra hadislerin gaye ve amacını dikkate alan yaklaşımlarda da bulundukları tespit edilmiştir. Bu açıdan Zâhirîlerin tümüyle lafza bağlı kaldıklarını söylemenin isabetli olmadığı söylenebilir."
