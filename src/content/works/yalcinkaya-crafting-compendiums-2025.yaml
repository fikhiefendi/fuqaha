abstract: "Bu çalışma, 17. yüzyılın sonlarına tarihlenen ve kanunlar, fetvalar, fermanlar ile sancak kanunnamelerinden iktibaslar içeren bir Osmanlı kanun mecmuasını incelemektedir. Manisa 5819, Saraybosna Şarkiyat Enstitüsü R.3 ve İstanbul Laleli 1263 numaralı üç el yazması nüsha üzerinden yürütülen analiz, mecmua yapım sürecinin oluşum, genişleme ve pekişme olmak üzere üç aşamada gerçekleştiğini ortaya koymakta, her aşamanın sırasıyla müellif-derleyiciler, haşiyeciler ve müstensihler tarafından şekillendirildiğini göstermektedir. Bu çalışmada nüshalar arasındaki metinsel farklılıkların mekanik bir çoğaltma sürecinden ziyade aktif bir entelektüel etkileşimi yansıttığı savunulmaktadır. Kenar notlarının zamanla ana metne dahil edilmesi ilmiye mensuplarının katkısıyla gelişen dinamik bir hukuk bilgisi üretim sürecine işaret etmektedir. Üç nüshadaki kenar notlarının izini süren bu çalışma, özellikle kanun ve fetva arasındaki ilişki bağlamında, mecmuaların hukuk bilgisinin ifade edilmesi ve tartışılması için bir zemin sunduğunu göstermektedir. Kanun mecmuası oluşturma pratiği alim-bürokratlar arasında özgün bir kanun bilincinin geliştiğini ortaya koymakta ve bu sürecin, fetvanın hukukun resmi bir ifadesi haline gelmesiyle sonuçlandığını göstermektedir. Sonuç olarak bu çalışma, 17. yüzyılda kanun mecmualarının sultanın nişancısının ötesinde, hukuk yapımında belirleyici bir rol oynayan başlıca yazım türlerinden biri olarak ortaya çıktığını ileri sürmektedir."
