abstract: "ÖZETÖLÜM'ÜN ÖZEL HAKLARA ETK Sslâm hukuk sistemi, insana, tanımış olduğu hayat hakkının bir gereği olarakmülkiyet hakkı başta olmak üzere birçok hak tanımıştır. Ölüm'ün Özel Haklara Etkisibaşlığıyla, slâm hukukunun genel hedeflerine ve geçerli saydığı maslahatlara riayetederek, `ölüm özel hakları mutlak olarak sona erdirmez ve kişi ölümünden sonra dabazı haklar kazanabilir' şeklinde ifade ettiğimiz tezimizi doğrulamak için yapmışolduğumuz çalışmamızda ulaştığımız genel sonuçları şöylece özetleyebiliriz:Ölüm, kişisel olmayan haklara kaybettirici olarak etki etmez. Buna karşın kişiselhaklar genel olarak ölümle sona ererler. Ölümle sona ermeyen haklar öleninmirasçılarına geçerken ölümle sona eren haklar ölenin mirasçılarına geçmezler."
