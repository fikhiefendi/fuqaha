abstract: "Günümüzde gelişen ve değişen koşullara ayak uydurabilmek amacıyla hukuk alanında da birtakım değişimlere ihtiyaç duyulmaktadır. Özellikle onarıcı adalet anlayışı çerçevesinde artan suç oranları karşısında temel hak ve hürriyetleri güvence altına alan, suçlunun topluma yeniden kazandırılmasını öngören, mağdurun da haklarının gözetildiği ve tüm bunlar yapılırken yargının iş yükünün hafifletilmesinin amaçlandığı alternatif çözüm yollarına ihtiyaç duyulmuştur. Ceza muhakemesinin etkinliğini artırmak amacıyla uzlaştırma, önödeme, seri muhakeme usulü alternatif çözüm yolları olarak Türk hukuk sistemine dahil edilmiştir. Hukuk sisteminde yer alan kamu davasının açılmasının ertelenmesi kurumu, bu alternatif çözüm yollarından birisi olması dolayısıyla çalışmanın konusunu oluşturmaktadır. 5271 sayılı Ceza Muhakemesi Kanunu'nun 171. maddesinde düzenlenen kamu davasının açılmasının ertelenmesi kurumu, hukuk sistemimize 2005 yılında Çocuk Koruma Kanunu'nda yapılan değişiklikle sadece çocuklar bakımından getirilmiş, 5560 sayılı Kanun ile Ceza Muhakemesi Kanunu'nda yapılan değişiklik neticesinde yetişkinler açısından da uygulanabilir hale gelmiştir. Kamu davasının açılmasının ertelenmesi kurumunda amaç yalnızca şüphelinin topluma yeniden kazandırılmasını sağlamak değil; mağdurun da haklarını gözeterek uğradığı zararın giderilmesini sağlamaktır. Kurumun uygulanmasında bir diğer amaç, ilk defa suç işleyen kişileri cezaevinin getirdiği olumsuz koşullardan uzak tutarak devletin infaz yükünü hafifletmektir. İlk başlarda uygulama alanı oldukça dar tutulan kurum, zamanla yapılan kanun değişiklikleri ile birlikte daha etkin bir şekilde uygulanmaya başlamıştır. Kanun koyucu kurumun uygulanmasını zorunlu tutmayıp Cumhuriyet savcısının takdirine bırakmıştır. Bu düzenlemeyle Cumhuriyet savcısının takdir yetkisi genişletilmiştir."
