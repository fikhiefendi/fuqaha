abstract: "Halvet kavramı, İslam aile hukuku açısından oldukça önemli bir yere sahiptir. Kavram ve mahiyet olarak Hz. Peygamber (s.a.v.) döneminde şekillenen halvet terimi, asırlar boyu fukahânın üzerinde ehemmiyetle durduğu bir konudur. Tarihin her safhasında, insanın varolduğu her yerde güncelliğini koruyacak bir mesele olan halvet, sonuçları itibariyle bir takım hükümler doğurmaktadır. Halvetin sonuçlarının net bir şekilde bilinebilmesi için öncelikle halvetin mahiyetinin, kısımlarının, mânilerinin bilinmesi gerekmektedir. Bu mütevazi çalışma, giriş, iki bölüm ve sonuç olarak tasnif edilmiştir. Halvetin haram veya helal olarak sınıflandırılmasında belirleyici bir etkiye sahip olan mahremiyet kavramı, giriş bölümünde işlenmiştir. Buna ek olarak mahremiyetin kısımları ve sebepleri de aynı bölümde mercek altına alınmıştır. Araştırmanın birinci bölümünde halvetin mahiyeti, fukahânın halvet anlayışı, ve halvetin sahih-fâsit olarak tasnifi, hükmî açıdan haram ve mübah kabul edilen halvet çeşitleri incelenmiştir. İkinci bölümde ise halvete mâni olan sebepler îzah edildikten sonra aile hukuku açısından halvetin hangi sonuçları doğurduğu, fıkhî mezheplerin bu sonuçlar hakkındaki görüşleri aktarılmıştır. Halvetin etki edeceği unsurlar ayrı başlıklar halinde ele alınmış ve zikri geçen konular hakkında fakihlerin görüşleri nakledilmiştir. Sonuç kısmında ise okuyucunun, bu çalışmadan elde edebileceği kazanımların neler olduğuna kısaca temas edilerek çalışmaya nihâyet verilmiştir."
