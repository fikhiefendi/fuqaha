abstract: "Muhakkakki hamd sadece Allah'a aittir.Kendi nefsimizden ve günahlarımızdan Allaha sığınırız. Allah, kimi hidayete erdirirse onu yanıltacak kimdir! Kim dalalete düşerse hidayete erdirecek kimdir!Allah'tan başka ilah olmadığına ve Hazreti Muhammed'in onun kulu ve elçisi olduğuna şehadet ederiz. Hiç birimizin gözümüzden hadis el yazma eserlerinin ve el yazmaları mirasımızın önemi kaçmamaktadır. Hangi ümmet olursa olsun kültürüne ve ilmine muhafaza eden ümmet takdire şayandır. Bu eserlerde olan kültürün ümmetimize veya başka ümmetlere kattığına bakmaksızın geleceğe katkıda bulunan tüm kültürler içinde geçerlidir. Bu yazma eser ; İmam-ı Buhari'nin Sahihi Buhari şerhlerinden (Necah el-Kari lişerh Sahih el-Buhari) müellifi; Yusuf Efendi Zade , İslam iktisadı ve Hukukunda Yüksek lisans derecesini almak için ele alınmıştır. Necah el-Kari lişerh Sahih el-Buhari eseri bir mukaddime ve iki bölümden ve bir fihristen oluşur. Mukaddimede : Bu bölümde araştırma görevlisinin bu konuyu seçmesindeki sebebi ve konun önemi, bu yazma eserler ilgili geçmiş çalışmalar , araştırma projesi ve tezi ele alınacak uslübu içeririr. Birinci bölümde: Eserin ana unsuru beş kısıma ayrılır. Birinci kısımda : İmam-ı Buhari-Allah Rahmet eylesin- tanıtıldı. İkinci kısımda : Cami-ul Sahih (Sahih el-Buhari) kitabı tanıtıldı. Üçüncü kısımda : Müellif Yusuf Efendi Zade tanıtıldı. Dördüncü Kısımda : Eser tanıtıldı.(Necah elkari li-Şerh Sahih el-Buhari) İkinci bölümde :Tahkik nassını içermektedir. İçerisinde : Kitaba (Sahih-i Buhari) mutabık kalarak hadisin şerhedilmiş metnini.Muhakkıkın nassını Yusuf Zade'nin şerhini sonra ise haşiyenin tahkikidir. Tahkikin içerisinde Kitabu'l Buyu' başından 2068 nolu hadise kadardır.Bab(konu): Hz.Muhammed (sallallahualeyhivesellem)'in Nesie yoluyla satın alması.Bab başlıklarını bir düzen ile İmam-ı Buhari'nin Sahihinde olan dizgisini kullanmıştır. Yazma eserin nassını iyi bir şekilde düzenlenmiş ve dilinede ehemmiyet gösterilmiştir.Ayetlerin geçtiği sure ve ayet numaralarına işaret edilmiş ve Hadis Şeriflerin tahriç işlemleri ve biyografi , mekan ve ülkelerin tercemeleri verildi.Nasların açıklma ve delillendirme işlemleri asıl kaynaklarından yapılmıştır. Fihristler : Araştırmacının tezdeki son işlemidir.Kur'an-ı Kerim fihristini ve Biyografi (A'lam) fihristini ve araştırmada geçen ravi ve rivayetleri , kaynak katalogu ve referanslarını ve araştırılacak konuları ele almıştır. Gayret bizden tevfik Allahtandır."
