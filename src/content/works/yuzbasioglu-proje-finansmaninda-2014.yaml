abstract: "Dünya ekonomisinin her geçen gün büyümesi ve gelişmesi mevcut sistemin eksikliklerinin görülmesine neden olmuştur. Aslında yeni bir sitem olmayan ve İslamiyet'in doğuşuyla başlayan faizsiz sistemin varlığı ancak yüzyıllar geçtikten sonra anlaşılmaya başlanmıştır Günümüzde 30 yıllık bir geçmişe sahip olan faizsiz finansman sisteminin önemi gün geçtikçe daha iyi anlaşılmaktadır. Dünyada yaşanan ekonomik dalgalanmalar faizsiz sisteminin önemini daha da artırmıştır. Faizsiz finansman sitemini yeni projelere yatırım yapmak isteyen girişimciler için riski azaltması sebebiyle dolayı mevcut sistemden daha sağlam bir yapıya sahiptir. Çalışmanın birinci bölümünde faizsiz finansman sisteminin oluşumu işleyişi ile bilgiler verişmekte, faizli ve faizsiz finansman sisteminin yöntem ve araçları anlatılmaktadır. İkinci bölümde ise faizsiz finansman yöntemlerinden olan mudaraba yönteminin risk sermeyesi ile benzerliği inceleme ve faizsiz finansman yöntemlerinden olan SUKUK yöntemi açıklanmıştır. Çalışma konularının panel bir değerlendirmesini içeren sonuç bölümü ile tanımlanmıştır."
