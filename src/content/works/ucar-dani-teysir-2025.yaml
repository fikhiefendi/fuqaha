abstract: "Lafzı ve manası ile Allah'a ait olan Kur'ân-ı Kerîm, kıraat ilminin en temel kaynaklarındandır. Bu yüzdendir ki Kur'an'ın nüzûluyle birlikte Müslümanlar Kur'an'ı öğrenmeye, ezberlemeye ve anlamaya çalışmışlardır. O günden bu yana bu alanda yetişen sayısız âlim, kıymetli eserler kaleme alarak bilgi hazinemize katkıda bulunmuştur. Temeli Kur'an olan çalışmalar içerisinde en önemli ve en kapsamlı olanlarından bir tenesi de şüphesiz ki kıraat ilmidir. Bu çalışmada, kıraat ilminin en önemli iki eseri ve onların temsilcileri ele alınmıştır. Bunlar, Dânî ve Teysîr adlı kitabı ile bu esere dayalı olarak kaleme alınan Şâtıbî'nin Ḥırzü'l-emânî adlı manzumesidir. Sâṭıbiyye, veciz ifadeler ve şifreler içerdiğinden çalışmada tâli kaynaklardan yararlanılmış, şerh ve tahrîrat çalışmalarına da bakılmıştır. Erken döneme ait bu eserlerin yedi kıraat imamının rivayetlerini sistemli bir şekilde aktarması, kıraat alanında teorik ve pratik düzeyde bilgiler sunması ve Ḥırzü'l-emânî'nin ezberlenebilmesi açısından büyük bir öneme sahiptir. Ḥırzü'l-emânî, Teysîr'in bir özetidir. Teysîr'de Ḥırzü'l-emânî'nin aslıdır. Şâtıbî, bir nesir eseri olan Teysîr'i esas almış, kıraat imamlarının görüşlerini şiirsel bir metin ile ifade etmiş ve bazı yerlerde de Teysîr'de zikredilmemiş hususları eklemiştir. Bu çalışma iki eser arasındaki metinsel ilişkiyi merkeze alarak Şâtıbî'nin Teysîr üzerine yaptığı ziyadeleri ya da bulunduğu tercihleri usûl açısından tespit ve tahlil etmiştir. Tezde, öncelikle her iki müellifin yaşadıkları devirler, hocaları ve talebeleri ile eserleri ve kıraat ilmindeki yerleri incelenmiş ardından da Teysîr ile Ḥırzü'l-emânî metinleri mukayeseye tabi tutularak ulaşabildiğimiz ziyadeler aktarılmıştır. Şâtıbî'nin yaptığı eklemeler içeriksel olarak kategorilere ayrılmış, tasnif edilmiş ve sistematik bir biçimde incelenmiştir. Çalışma sonucunda, bu ilavelerin yer yer tamamlayıcı veya tercihe yönlendirici nitelikte olduğu bununla birlikte hulf şeklinde karşımıza çıktığı gözlemlenmiştir. Sonuç olarak bu tez, klasik kıraat metinler arası ilişkiler düzleminde kıraat ilminin gelişim sürecinin anlaşılmasına katkı sağlamayı ve tespit edilebilen ziyadeleri kıraat ilmiyle meşgul olanlara göstermeyi hedeflemektedir."
