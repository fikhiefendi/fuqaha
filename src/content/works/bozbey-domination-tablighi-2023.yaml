abstract: "Bu tez Tebliğ Cemaati'nin Sovyet sonrası dönemde Kırgzistan'da edindiği hissedilir derecede güçlü varlığı ve etki gücünü mümkün kılan etkenleri dini ekonomiler yaklaĢımının merceğinden incelemektedir. Kırgızistan'ın Orta Asya cumhuriyetleri arasındaki tarihi ve siyasi nevi Ģahsına münhasır konumu ile Tebliğ Cemaati'nin onu rekabete girdiği diğer Ġslami yapılar ve hareketlerden ayıran gezgin tebliğ metodu muhtemel etkenler olarak öne sürülecektir."
