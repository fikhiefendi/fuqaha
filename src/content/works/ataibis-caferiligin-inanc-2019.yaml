abstract: "İnsanlık tarihi boyunca toplumda insanlardan bazılarının öne çıktığı veya çıkartıldığı görülmektedir. Örneklerine sıklıkla rastlanan bu insanlar, kimi zaman beşeri kuvvetler tarafından kimi zaman da bizzat kendi gayret ve özellikleriyle öne çıkmışlar veya çıkartılmışlardır. Hicri birinci asrın sonlarından ikinci asrın ortalarına kadar yaşayan Cafer-i Sadık da olağanüstü vasıflarla tavsif edilen kişilere örnek olarak verilebilir. Ehl-i Beyt imamlarından İmam Cafer-i Sadık'ın İslami görüşleri etrafında oluşan Caferi Mezhebi, Ehl-i Beyt mektebinin fıkhi cephesine verilen isimdir. Bu araştırmada Türkiye'de yaşayan Caferilerde dini ve sosyal hayat incelenmiştir. Bu kapsamda çalışma iki bölümden oluşturulmuştur. İlk bölümde Caferilerde dini hayat, ikinci bölümde Caferilerde sosyal hayatla ilgili bilgiler aktarılmıştır. Çalışmanın Caferi mezhebi ve Türkiye'de dini bir grup olarak var olan Caferiler hakkında bilgi edinmek açısından önemli olduğu düşünülmektedir."
