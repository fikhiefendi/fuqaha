abstract: "İnsanoğlu ilk çağlardan beri varlığını sürdürmek, yaşam alanını genişletmek, daha müreffeh yaşamak gibi sebeplerle araştırmalar yapmış, araçlar üretmiştir. Bu üretim seyri neticesinde sayısız icatlarla günümüzdeki yapay zekâ, biyomühendislik gibi gelişimlere ulaşılmıştır. İnsanlık bu süreçte yalnızca teknoloji açısından gelişimlerle ilerlememiştir.Düşünsel açıdan da muhtelif fikirlere yönelmiş farklı ideolojilerin temelleri atılmıştır. Transhümanizm de bu fikri oluşumlardan biri olarak insanlığı fiziksel ve zihinsel anlamda post-human haline getirmeyi amaçlamaktadır. Bu amaç doğrultusunda da günümüzdeki teknolojik yöntemleri araç edinmektedir.Transhümanizm, evrim teorisinin devamı niteliğinde insanı kendi sınırları üstüne çıkartarak adeta insanüstü bir varlığa ulaştırmak amacı ile genetik mühendisliğini de araçsallaştırmıştır. Kök hücre, klonlama, CRIS-PR gibi genetik ve tıbbî yöntemler bu araçlardan bazılarıdır. İslâm hukȗku ise insan hayatının her alanında kişinin dünyevi ve uhrevî açıdan lehinde ve aleyhinde olan durumları konu edinir ve buna yönelik kanunları içerir.Transhümanizm gibi materyalist ve hedonist bir ideoloji çerçevesinde insana etki edecek bir durum da İslâm hukȗku yönüyle incelenmesi önemli bir ihtiyaçtır. Bu öneme binâaen tezimizin ana amacı da Transhümanizm bağlamında cenin üzerinde gerçekleştirilecek genetik müdahalelerin incelenmesidir. Çalışmanın birinci bölümünde cenin kavramı âyetler ve hadisler üzerinden tanıtılarak İslâm'da cenin hukȗku ele alınacaktır. Çalışmanın ikinci bölümünde ise Transh manizm mefhumu da tanıtılarak bu fikriyatın genetik modifikasyon amacı sırasında kullandığı yardımcı yöntemler ve etik boyutları incelenecektir. Çalışmanın son bölümünde ise genetik müdahale yöntemlerinin Transhümanizm amacı ile uygulamasının İslam hukȗku açısından muhtemel karşılıkları sorgulanacaktır. Böylelikle insanlığın fıtratını değiştirmek üzere çalışan bir genetik modifikasyon sistemi fıkhî açıdan ele alınarak bu konuda ilgili literatüre katkı sağlaması planlanmaktadır."
