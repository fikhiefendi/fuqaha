abstract: "İslam hukuku; içinde bulunduğu çağın ihtiyaçlarına cevap verebilecek donanıma sahip olması bakımından dinamik bir hukûkî sistemdir. Fakihler, İslam hukukunun dinamik boyutunu işlevsel kılmak amacıyla gâî yorumu etkin kıldıkları gibi lafzî yorumu da etkin kılacak şekilde hareket etmişler ve çalışmalar ortaya koymuşlardır. Hukûkî metinlerin lafzî yorumunun gerçekleştirilebilmesi için, metnin ait olduğu dil ailesinin gramatikal özelliğinin ve kurallarının bilinmesi ve işletilmesi kaçınılmazdır. Bu bağlamda fakih(ler)in, Arapça dilbilgisi olan nahiv ilminin kurallarını dikkate almalıdır. İstisnâ konusu nahiv ilminde önemli yer tutan ve pek çok problematik alana sahip bir konudur. İslam hukukçusu da istisna barındıran hukuki metinleri çözümlerken nahiv ilmindeki bu verileri kullanmalıdır. Dolayısıyla tezin birinci bölümünde istisnânın dilbilgisel yönüne ışık tutulmuştur. İkinci bölümde istisnanın usul-ı fıkıhtaki yerine ve işlevine temas edilmiş; üçüncü bölümde ise istisnanın füru'-ı fıkıhtaki örneklerine yer verilmiştir."
titleTranslation: {"en": "Al-istidlâl with the rule of al-istithnâ in Islamic law: The case of Hanafî school of thought"}
