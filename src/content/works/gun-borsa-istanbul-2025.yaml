abstract: "Amaç: Bu çalışmanın temel amacı, Borsa İstanbul'da işlem gören sağlık şirketlerin katılım finans ilkelerine uyum düzeylerini ve borçlanma araçları kullanımını analiz ederek, sağlık sektörünün katılım finans sistemiyle olan uyumunu ve faizsiz borçlanma araçlarından yararlanma durumunu ortaya koymaktır. Sağlık sektörünün etik, sosyal sorumluluk ve toplumsal fayda temelli yapısı ile katılım finans ilkeleri arasında doğal bir uyum olduğu varsayımından hareketle, bu ilişkinin şirket düzeyinde finansal veriler ve Kamuyu Aydınlatma Bildirimleri temelinde incelenmesi hedeflenmiştir. Gereç ve Yöntem: In this study, a qualitative research method was adopted, and a case study design was employed. The data collection tool used was the document analysis technique, and the dataset was based on the electronic disclosures published on the Public Disclosure Platform (KAP) for the periods of 2023/12, 2024/6, and 2024/12. The study group consisted of 15 different healthcare companies listed on Borsa Istanbul, and their level of compliance with participation finance principles was evaluated within the framework of the Participation Finance Principles Information Form (KAFİF). In addition, the companies' debt instrument issuance disclosures were examined to determine the extent to which they utilized interest-free financing instruments. Bulgular: Şirketler arasında katılım finans ilkelerine uyum düzeylerinin farklılık gösterdiği belirlenmiştir. 15 farklı sağlık şirketinin %20'sinin sözleşmelerinde katılım finansa uygun olmayan imtiyaz yer aldığı, yaklaşık %46'sının (7 şirket) katılım finans ilkelerine uyumlu olduğu, geri kalanların ise faizli gelir, varlık ve borç oranlarının bu uyuma engel oluşturduğu bulgusuna ulaşılmıştır. Ayrıca çalışma grubunu oluşturan şirketlerin yaklaşık %33'ünün (5 şirket) borçlanma aracı ihraç ettiği bulgusuna ulaşılmıştır. Sonuç: Sağlık sektörünün yapısal olarak katılım finans ilkeleriyle uyumlu olduğu, incelenen şirketlerin önemli bir kısmının katılım finans yatırımcıları için uygun olabileceği görülmüştür. Bu durumun sağlık şirketlerinin yatırımlarının finansmanı için ihraç edeceği ortaklığa dayalı ve borçlanma ilişkisine dayalı sermaye piyasası araçları açısından yatırımcı profilini genişletmek/çeşitlendirmek suretiyle bir avantaj oluşturabileceği değerlendirilmiştir. Ancak çalışma grubunu oluşturan ve Borsa İstanbul'da işlem gören sağlık şirketlerinin faizsiz borçlanma araçları ihraçlarının toplam ihraç içindeki payının oldukça düşük tutarlarda olduğu görülmüştür."
