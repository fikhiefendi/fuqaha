abstract: "Hiç kuşku duyulmayan şeylerden biri de paranın günümüzde dünya iktisadının belkemiği olduğudur. Ki o (para) eşyaların dolaşımına,değer biçilmesine ve eşyaların kıymetinin belirlenmesine vesiledir. Onun vasıtasıyla devletin ekonomik gücü yada zayıflığı bilinir. Paranın madeni (altın yada gümüş) olduğu zamanlarda, ortada günümüz dünyasının gerek ferdler nezdinde gerekse hükümetler nezdinde çekmekte olduğu sıkıntılar bulunmamaktaydı.Bunun sebebi kıymetini kendi bünyesinde barındırmasındandır. Ama bizim kağıt paralarımız eğer yürürlükten kalkarsa yada bir (ekonomik) çöküş olursa söze değer hiçbir kıymeti kalmaz.Ve burada parasal enflasyon sorunu, günümüz dünya ekonomisinin belkemiğine dogrudan bağlantılı olan ekonomik bir olgu olarak ortaya çıktı. Özellikle de beşeri iktisadın ortaya sunduğu çözümlerin bu olguyu tedavi etmek için uygun çözümler ortaya koymada çaresiz olduğu ortaya çıkmışken, İslam Şeriatının parasal enflasyon olgusuna karşı bakış açısını açıklamak ve beşeri iktisadın mevcut çözümlerine karşı uygun çözümleri açıklamak gerekli olmuştur. Bu çalışma beş bölüm olarak düzenlendi: Bu araştırmanın ilk bölümünde paranın yapısı ve tarihi, iktisatçıların ve fıkıhçıların nezdindeki görevleri ortaya kondu ve paranın değer mefhumu ve bu değerin kaynağı açıklandı. Sonra ikinci bölümde paranın çeşitleri, fıkıhçıların kağıt paraları adaptasyonu ve buna ek olarak paranın uğradığı değişiklik çeşitleri geldi. Üçüncü bölümdeyse parasal enflasyon kavramına ve tarihinin aslına iniliyor ve (enflasyonun) çeşitleri ve karşılaştırma yöntemlerinden de bahsediyor. Dördüncü bölümdeyse parasal enflasyonun sebeplerine ve ortaya çıkardığı etkilere ışık tutuluyor. Beşinci bölümdeyse parasal enflasyonu beşeri iktisatda tedavi etme yöntemleri açıklanmaya başlıyor. Ve parasal enflasyonun İslam fıkıhında tedavi etme yöntemleriyle son buluyor."
