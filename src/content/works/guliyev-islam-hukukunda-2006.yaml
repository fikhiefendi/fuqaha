abstract: "lahi mesnede dayanan slam Hukuku sadece inanan insan topluluguna degil, müslüman olmayan, Allah`ın emr ve yasaklarına riayet etmeyen ve Son Peygamber`in yolundan gitmeyen insanlara bile, sadece insan olduklarına göre önem vermis ve onların hakları üzerinde ihtimamla durmustur. slam Devletinin her bir vatandasının temel hak ve hürriyetleri oldugu gibi gayri müslim vatandasların da bu hak ve hürriyetlerden istifade etme hakları vardır. Fakat slam Devleti, dini hükümler zemininde yönetilen bir devlet sekli olduguna göre dini mensubiyetinden dolayı devletin vatandası olan veya vize ile ülkeye girme hakkına sahip gayri müslimlerin hak ve hürriyetlerine sınırlamalar getirilebilir. Onlara getirilen sınırlamaların daha çok aile, miras, yargı, ceza ve s. hukuk dallarında ve siyasi, sosyal ve ekonomik alanlarda gerçeklestigi görülmektedir. Gayri müslim tebaa her ne kadar bazı hukuku ve sosyal alanlarda kısıtlamalara maruz kalabilirlerse de, onların kendi dinleri ve inançları dogrultusunda her hangi bir baskı altında kalmadan yasamlarını sürdürürler. Müslümanlar tarafından onlara karsı yapılacak her hangi bir haksız fiile göre Allah Resulu`nun zemm ve itabına maruz kalınacagına dair haberler, aynı zamanada onların bir emanet olarak vasıflandırlması onların haklarına verilen deger ve ehemiyetin göstergesidir. Zimmet ve ya eman anlasması ile slam Devleti karsısında uhdelikleri olan gayri müslimlerin haklarına sınırlamalar tatbik edilirken, diger devletlerin de o devletin müslüman vatandaslarına karsı tutum ve davaranısları da mütekabiliyet prensibi çerçevesinde dikkate alınması gereken hususlardandır. Bu durum daha çok sosyo-ekonomik meselelerle iliskilidir."
