abstract: "Fıkıh alanındaki araştırmalarda, Malikiler mesalih-i mürseleyi kabul etmekle ön plana çıkmışlardır. Aynı zamanda, mükellefin amellerine yönelik koyduğu hükümlerde Şâri Teâlânın belli maksatları gözettiğine dair makasıd eksenli bakış açısıyla meşhur olmuşlardır. Bu çalışma, Endülüs ekolü özelinde Malikilerdeki mesalih-i mürseleyi makasıd eksenli bir bakış açısıyla ve tatbiki bir tarzda incelemektedir. Malikilerin makasıd eksenli bakış açısı ve maslahat-ı mürseleyi geniş kullanımları ve bunun fıkhi içtihada ve içtihada dayalı hükümlere etkisi düşünüldüğünde bu çalışmanın çağdaş usul çalışmaları içerisindeki önemi ortaya çıkar. Bu çalışma makasıdü'ş-şeriayı teorik olarak temellendirmekte, teşrideki önemine vurgu yapmakta ve Malikilerin bu konuya verdikleri öneme ve özene dikkat çekmektedir. Aynı zamanda maslahat-ı mürseleyi makasıd düşüncesinin temeli olarak alıp önemine dikkat çekmekte ve tatbiki meselelere de yer vererek Maliki Mezhebi'nin Endülüs Ekolünü bu anlamda bir örneklem olarak incelemektedir. Araştırmanın amacı Malikilerin makasıd ve maslahat eksenli bakış açısının önemine ve fıkhi içtihat konusunda her dönem için uygun bir yöntem olduğuna dikkat çekmek olduğuna göre son bölümde füru alanından bazı kadim ve yeni meseleler inceleme konusu edilerek Malikilerin bu yönteminin özgünlüğüne dikkat çekilmiştir."
