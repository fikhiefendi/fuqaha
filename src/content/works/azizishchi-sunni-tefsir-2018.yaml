abstract: "“Sünnî ve Şiî Tefsir Kaynaklarına Göre Hırâbe”ile ilgili bu çalışma bir giriş, iki bölüm ve sonuç kısmından meydana gelmektedir. Giriş kısmında araştırmanın konusu, önemi, amacı, sınırlandırılması, kaynakların değerlendirilmesi hakkında genel bilgiler verilmiştir. Birinci bölümde kavramsal ve hukuki bakımdan hırâbe ve bağy suçunun terim anlamları, hırâbe suçunun gerçekleşmesi için yolu kesenlere ait, yolu kesilenlere ait, hırâbe suçunda çalınan mala ait ve yol kesme olayının geçtiği yere ait aranan şartlar, hırâbe haddini düşüren şartlar ve hırâbe suçunun ispat vasıtaları temel sözlüklerden ve fakihler tarafından esas alınan Sünnî ve Şiî fıkıh kitaplarından açıklanmıştır. İkinci bölümde ise Sünnî ve Şiî tefsir kaynaklarına göre hırâbe ayetlerinin nüzul sebebi, Ureyne vâkıası ile ilişkisi, Allah ve Resûlü ile savaşma kısmının tevilleri, yeryüzünde fesat çıkarma kısmının tefsiri, hırâbe haddinin kapsamında olan suçlular, hırâbe haddinin uygulanmasındaki farklı görüşler ve hırâbe suçunda tevbenin uygulanacak cezaya etkisi olarak yeni ve eski tefsir kaynaklarına göre değerlendirilmiştir. Sonuç bölümünde ise genel bir değerlendirme yapılarak ulaşılan netice belirtilmiştir."
