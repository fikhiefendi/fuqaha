abstract: "Bu çalışmada, son dönemlerde ortaya çıkmış olan genetik kalıtım alanlarındaki çağdaş teknolojilerin en önemlilerinden olan insan genom projesi, insan neslinin iyileştirilmesi, insan hücrelerinin genlerle tedavisi gibi konuların şer'î hükümleri ele alınmaktadır. Bu araştırma altı bölümden oluşmakta olup, birinci bölümde hücre, hücrelerin oluşumu, kromozomlar ve nükleik asitler ve bu yollarla özelliklerin taşınması incelenmiştir. İkinci bölüm, büyük insan genomu projesine ayrılmış olup, tarihi, amaçları ve riskleri ele alınmış, meşruiyet ve ahlak açısından problemlerine değinilmiştir. Bu çerçevede akraba evliliği ve evlilik öncesi muayenelerin yapılması konularının fıkhî hükümlerine temas edilmiştir. Üçüncü bölümde neslin ıslahı ve iyileştirilmesi projesine yine dinî/fıkhî boyutlarıyla bakılmış, dördüncü bölümde ise genlerle tedavi konusu incelenmiştir. Beşinci bölüm, sperm bankalarını ele almaktadır, bunların geçmişi ve muhtemel riskleri fıkhî bir bakışla incelenmektedir. Altıncı ve son bölüm yapay dölleme konusunu detaylı bir şekilde ele almakta olup, çeşitli yöntemlerin fıkıh ilminin cevaz ve yasak kavramları ve ilkeleri ışığında hükümlerine dair bilgi verilmektedir."
