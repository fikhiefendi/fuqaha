abstract: "Bu tez çalışması, 1980 yılından günümüze Irak ve İran devletleri arasındaki siyasi, ekonomik, sosyal ve kültürel ilişkiler noktasında ortaya çıkan krizleri anlamlandırmayı hedeflemektedir. Bu bağlamda her iki devletin rejimleri, etnik, dini ve mezhepsel yapıları göz önünde bulundurularak analiz yapılmıştır. Irak'ın yaklaşık bin kilometre kara sınırına sahip olduğu İran devletiyle ilişkileri geçmişten günümüze dönemsel olarak farklılık göstermiş, kimi zaman ortak çıkar ekseninde hareket edilmiş, kimi zaman ise çıkarların çatışması çerçevesinde hem bölgesel hem de küresel düzeyde problemlere neden olmuştur. Dünya'nın en büyük petrol ve maden rezervlerine sahip olan bu devletler, tarih boyunca bir çok medeniyete ev sahipliği yapmanın yanı sıra, uluslararası aktörlerinde dönem dönem çatışma sahası olmuş ve uluslararası hegemonyalarını kanıtlama yolunda söz konusu bölgede güç mücadelesine girerek arkalarında bıraktıkları kan ve gözyaşlarıyla bu ülkeleri ve bölgeyi istikrarsızlığa sürüklemişlerdir. 1980 yılından günümüze İran ve Irak devletleri arasında süregelen ilişkiler literatürde genel olarak körfez savaşlarına, bölgesel ve uluslararası aktörlerin tutumlarına veya iki devlet arasında çıkan bu savaşa yaklaşımlarına odaklanmaktadır. Bu minvalde; tez çalışmasında, 1980 yılı ve sonraki dönemin seçilmesinin temel nedeni, hem tarihsel açıdan uluslararası güç mücadelesinin en yüksek seviyede yaşandığı yıllar olmasından hem de takip eden süreci etkilemesinden kaynaklanmaktadır. Nitekim söz konusu dönemde Ortadoğu bölgesinin kaderini derinden etkileyen olayların; hem iki ülke arasında, hem bölgesel anlamda hem de küresel anlamda yaşanmış olması bu düşünceyi; bir retorik ötesinde kanıtlar mahiyettedir. Buradan hareketle uluslararası akademi literatürüne mütevazı bir katkı yapmak amaçlanmıştır. Bu bağlamda tez çalışmasının ilk bölümünde; tarihsel perspektiften Irak ve İran devletlerinin ilişkileri yaşadıkları temel problemler çerçevesinde analiz yapılacak, ikinci bölümünde; söz konusu dönemin iki önemli aktörü olan Nuri el-Maliki ve Tarık el-Haşimi'nin Irak'ın İran'a yönelik dış politika davranışlarındaki etkileri ortaya ii koyulacak; üçüncü bölümünde ise 1980 yılından günümüze Irak ve İran devletleri arasında yaşanan beş temel sorun ele alınarak ilişkiler analiz edilecektir. Nihayetinde sonuç bölümünde ise 1980 yılından günümüze Irak-İran ilişkileri söz konusu bölümlerde yapılan analizler çerçevesinde anlamlandırılacaktır."
