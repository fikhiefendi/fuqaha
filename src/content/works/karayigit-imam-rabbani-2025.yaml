abstract: "Yaklaşık dört asır önce yaşamış olan, 60 yıllık ömründe rabbânîlik, müceddidlik, fârûkîlik ve sılalık gibi birden çok nisbeti kendisinde barındıran İmâm-ı Rabbânî, daha çok tasavvuf, kelâm ve keşfî kabiliyetiyle ön plana çıkmış, onun fıkhî yönüne pek temas edilmemiştir. Hâlbuki o, müceddidlik nisbetine layık görülmesini bidʻatlerle mücadele hususunda göstermiş olduğu gayretine borçludur. Bidʻat; dinde olmayan şeyi dine katmak olunca, bidʻatle mücadele de hâliyle fıkıh ilmiyle olacaktır. Bundan dolayı İmâm-ı Rabbânî'nin hicrî ikinci binyılın müceddidi sayılmasında fıkhî düşüncesinin rolü oldukça büyüktür. Zira İmâm-ı Rabbânî'nin, talebelerle beraber fıkıh eserlerini mütalaa etmeyi temennisi, dergâhlarda tasavvuf eserlerinin yerine fıkıh eserlerinin okutulmasını ısrarla tavsiye etmesi, onun fıkıh ilmine ne denli önem verdiğini ortaya koymaktadır. Çalışma giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Girişte çalışmanın konusu, önemi, amaç, yöntem ve planına yer verilmiştir. Birinci bölümde İmâm-ı Rabbânî'yi daha iyi tanıtmak amacıyla rabbânîlik, müceddidlik, fârûkîlik ve sılalık gibi unvanların kendisine hangi sebeplerle verildiği, hayatı, eserleri, ilmî kişiliği, ilme ve özellikle fıkha verdiği değer ve mezhep tasavvuru gibi hususlara temas edilmiştir. İkinci bölümde onun usul anlayışına yer verilirken, üçüncü bölüm fürûʻ ile ilgili düşüncelerine ayrılmıştır. Onun fıkhî analizleri, dayandığı delillerle birlikte ele alınmış ve gerektiğinde diğer mezhepler ve günümüzle karşılaştırılarak incelenmiştir. İmâm-ı Rabbânî'nin mutasavvıf bir kimliğe sahip olması, fıkhî meselelere keşfî yorumlar getirmesinin önünü açmıştır. Bu doğrultuda çalışmada, onun fıkhî meselelere dair tasavvufî yorumlarına da yer verilmiştir. Ayrıca, fıkhî konulara eğilmesinin dinî, siyasî ve sosyo-kültürel sebepleri, imkânlar ölçüsünde tespit edilerek ortaya konulmuştur. Bu çalışmada İmâm-ı Rabbânî'nin gözlerden kaçan fıkhî yönü açığa çıkarılıp onun bilinenin aksine kelâm ve tasavvufun dışında fıkıh alanında da söz sahibi bir âlim olduğunun tespiti hedeflenmektedir"
