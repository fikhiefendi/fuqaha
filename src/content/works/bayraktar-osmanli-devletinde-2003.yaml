abstract: "Suçlunun zorunlu olarak bir kalenin içinde ikamet ettirilmesine kale-bend cezası denir. Osmanlı Örfî Hukuku içinde, tazîr suçlan arasında kendisine önemli bir yer edinen kale-bend cezası XVII. yüzyılın son çeyreğinden itibaren uygulanmaya başlamış, XVIII ve XIX. yüzyılda yoğun olarak uygulanmış ve Tanzimat'tan sonra da uygulanmaya devam etmiştir. 1858 tarihli Ceza Kanunnâmesi'nde muvakkat ve müebbet olarak ikiye ayrılırken; muvakkat kale-bendlik 3 ile 15 yıl arasında değişen oranda belirlenirken, müebbet kale bendin ömür boyu olacağı açıklanmıştır. Kale-bend cezası Cumhuriyetin ilânından sonra da 1930-35'lere kadar uygulanmıştır. Gerek I. Dünya Savaşı ve gerekse İstiklâl Harbi ve sonraki dönemde pek çok fikir adamı, gazeteci, edebiyatçı ve üniversite müderrisi bu cezadan nasibini almıştır. Sinop, Bodrum, Magosa, Limni Adası, Bozcaada, Seddü'l-bahir, Bursa gibi şehirler hem Osmanlı hem de Cumhuriyet döneminde önemli kale-bend yerleri olmuştur. Osmanlı toplumunda sıradan vatandaştan üst düzey devlet adamlarına, gayr-i Müslim halka kadar her kesimden insana uygulanmıştır."
