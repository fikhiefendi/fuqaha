abstract: "Bu çalışma Osmanlı Devleti'nin son dönemleriyle Cumhuriyet devrinin ilk yılları arasında yaşamış kadı/hakim Ali Himmet Berki?nin hayatı ve bilhassa İslam hukukuyla ilgili eserleriyle hukuk anlayışı hakkındadır. Berki, kitaplarında sık sık ifade ettiği gibi eserlerini yeni kabul edilen Medenî Kanun?un temas etmediği noktalarda hukukta doğan boşluğu giderme gayesiyle yazmıştır. Telif ettiği eserler bugün de istifade edilebilecek niteliktedir."
