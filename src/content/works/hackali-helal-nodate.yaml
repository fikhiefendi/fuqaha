abstract: "İnsanın en temel haklarından biri, inancının gerekliliklerine uygun bir yaşam sürme hakkıdır. Müslümanlar da özellikle modern yaşamın giderek karmaşık bir hale gelmesiyle birlikte helal beslenme ihtiyaçlarını daha güvenilir şekilde karşılamak amacıyla bir helal belgelendirme sistemi oluşturmuştur. Helal belgelerinin esas aldığı kurallar bütünü ise helal standartlardır. Helal standartlar, farklı uzmanlık alanından kişilerin bulunduğu teknik komiteler tarafından oluşturulmaktadır. Bu çalışmada, dünyada öne çıkan helal gıda standartlarından; İslam İşbirliği Teşkilatı bünyesinde hazırlanan ve Türk Standardları Enstitüsünün helal belgelendirmede (TS OIC/SMIIC 1:2019 adıyla) referans aldığı Helal Gıda İçin Genel Gereklilikler (OIC/SMIIC 1:2019) standardı, Malezya'nın resmi olarak yayımladığı Helal Gıda- Genel Gereklilikler (MS 1500:2019) ile Helal Et ve Kümes Hayvanları Üretimi için Malezya Protokolü, Singapur'un resmi olarak yayımladığı Helal Sisteminin Geliştirilmesi, Uygulanması ve Yönetimi için Genel Kılavuz (MUIS-HC-S002) ile Helal Gıdaların İşlenmesi ve Elleçlenmesine Yönelik Genel Kurallar (MUIS-HC-S001) ve Körfez Arap Ülkeleri İşbirliği Konseyi Standardizasyon Örgütü tarafından yayımlanan, Helal Gıda - Bölüm 1: Genel Gereklilikler (GSO 2055-1:2015) ile İslami Kurallara Göre Hayvan Kesim Gereklilikleri (GSO 993:2015) standartları İslam hukuku çerçevesinde değerlendirilmiştir. Genel olarak helal gıda standartları ve İslam hukuku birlikte ortaya koyulmaya çalışılarak helal gıda standartları ile fıkıh ilişkisinin daha net anlaşılması sağlanmıştır. Helal gıda standartlarının; helal, haram hayvanlar, bayıltma yöntemleri, hayvan kesimi gibi temel konularda belirlemiş olduğu kurallar, Hanefî, Şafiî, Mâlikî ve Hanbelî mezheplerinin bu konulardaki görüşleri kapsamında ele alınmıştır. İzlenilen bu yöntem sonucunda hem standartların benzer ve farklı yönleri hem de standartlarda belirlenmiş olan gerekliliklerin fıkhî karşılıkları ortaya konulmuştur."
