abstract: "Bu tezin amacı günümüzdeki konut finansman sistemlerindeki işleyişin, İslâmî değerler bağlamında faiz yasağı kapsamına girip girmediğini tespit etmektir. Bundan dolayı araştırma, genel manada konut finansman işlemleri ile sınırlı tutulmuş ve bu işlemler İslâm borçlar hukuku kapsamında mukayeseli bir yöntemle incelenmeye çalışılmıştır. İki bölümden oluşan tezin giriş bölümünde kavramsal çerçeve hakkında bazı bilgiler verilmiştir. Tezin birinci bölümünde ise konut, faiz ve banka kavramları kapsamlı bir şekilde açıklanmaya çalışılmıştır. İkinci bölümde de konut finansman sistemlerinin genel işleyişi hakkında bilgiler verildikten sonra bu işleyişin İslâm Hukuku kaideleri bağlamında fıkhî boyutu incelenmeye çalışılmıştır. Konut finansman yöntemlerinin, fıkhî/hukukî olarak incelendiği bu çalışmada günümüz Türkiye'sinde, aktif bir şekilde finansman işlevi yürüten dört sistemin bulunduğu tespit edilmiştir. Bunlar; konvansiyonel banka işlemleri, İslâmî finans adı altında işlemlerini yürüten katılım bankacılığı işlemleri, tasarrufa dayalı faizsiz finansman şirketlerinin işlemleri ve son olarak TOKİ tarafından yürütülen toplu konut işlemleridir. Tespit edebildiğimiz kadarıyla, mevcut konut finansman sistemlerinde, katılım bankalarının murabaha ve müşâreke işlemlerinin geliştirilmesi ve eksik yönlerinin giderilmesi gerektiği, diğer işlemlerinde fıkhî meşruiyet açısından sorunlar olduğu, tasarrufa dayalı faizsiz finansman şirketlerinin resmi kanallarca kontrol altına alınması aynı zamanda sözleşme ve uygulamalarındaki İslâm Hukuku esasları bağlamında sorunların giderilmesi halinde uygun bir sistem olabileceği ve son olarak TOKİ'nin sosyal konut projelerinde kredi kullandırılmadan enflasyon oranı artışı uygulamasının esas alındığı sistemin caiz bir yöntem olduğu sonuçlarına ulaşılmıştır."
