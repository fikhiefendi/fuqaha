abstract: "Mezhepler alimlerin görüşlerini belirlediği gibi alimler de mezheplerin yaşamasını sağlamıştır. Ruhban sınıfı olmayan İslamiyet'te ise alimler daha özgürce fikir beyan edebilmiş ve katı sınırlardan muaf tutulmuşlardır. Yer yer alimlerin mezheplerinden taşmalarına da sebebiyet vermektedir. Bazı zamanlarda ise alimler üst söylem gücüne ulaşmış ve yeni bir ekol olma yolunda olmuşlardır. Pezdevî de hem uzayan bir teşekkül sürecine sahip olan Mâturîdilik için hem de zaman zaman sahip olduğu söylemden ötürü mezhebin sınırlarında dolaşması ve bazen tam nerede olduğu anlaşılmayan yapısından ötürü eleştiri ve merak kaynağı olmuştur. Onun ortaya koyduğu söylem pek çok kısmı kapsadığı gibi Eş'arî ve Eş'arilik hakkında yaptığı açıklamalar kendi kimliği ve mezhepler algısı açısından önem arz etmektedir. Selçukluların yükselişe geçtiği ve Müslüman düşünce geleneğinin yeni bir serüvene girdiği dönemde yaşamış olan Pezdevî, kendisini yeni kimlik inşalarının olduğu fikrî çeşitlilikte bulmuştur. Erken dönem Mâturîdî söylemin inşasında öncü isimlerde olmasının yanı sıra farklı mezheplere olan bakış açısı için de kıymetlidir. Mâturîdî'nin keşfinde önemli rol oynayan Pezdevî, tavrı ile de çağdaş dönemde bir tartışma konusu olmuş ve aidiyeti kuşku ile karşılanıp Mâturîdî aidiyeti eleştiriye tabi tutulmuştur. Kendisi ise yer yer başka mezheplerin görüşlerine uyduğunu açıklayarak ve imamlarına muhalif görüş öne sürerek bu eleştirilerin oluşmasında olanak sağlamıştır. Hanefiliği Ehl-i Sünnet'in merkezine alarak hareket eden Pezdevî, diğer oluşumları bu bakış açısından değerlendirmiştir. Anlama ve anlamlandırma faaliyetinde eserler üzerinden geçmişe sarkmakla birlikte muhatapları üzerinden de diyaloglara girerek zihin dünyasını çeşitlendirmiştir. Eş'arilikle olan ilişkisi ise kimi zaman reddiyeci tavrı getirmişken kimi zaman da ılımlı yaklaşımı ve hatta kabulü de içinde taşımıştır."
