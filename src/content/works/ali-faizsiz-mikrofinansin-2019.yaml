abstract: "Bu çalışma, Etiyopya'da finansal olarak sisteme dâhil edilme (finansal içer-me) ve yoksulluğun azaltılmasında faizsiz mikro finans sisteminin rolünü değerlen-dirmeyi amaçlamıştır. Ana hedefe ulaşmak için çalışma, ülkenin farklı bölgelerinde mevcut geleneksel mikro finans kurumlarındaki faizsiz mikro finans pencerelerinden bir numune aldı. Şu anda OCSSCO, HMFI, DMI, SMFI ve RMFI gibi geleneksel MFK'lar, faizsiz mikro finansman hizmetlerini kredi ve tasarruf şeklinde sunmaktadır. Küçük girişimcileri ve işadamlarını finanse etmek için popüler bir yol olan Murabaha, faizsiz hizmet sunan neredeyse tüm MFK'lar tarafından uygulanmaktadır. Bir müşte-riye kendi seçimleri ile bir varlık satın alınır ve ona açıklanmış maliyetine kar payı ek-lenerek satılır. Bu tür bir finansman, uygulanması kolay olduğu için bugünün MFK'la-rında sıklıkla kullanılmaktadır. Ancak, bazı müşterilerin aldatmaya meyilli olmaların-dan dolayı malların alım ve satımında gerekli olan özel düzenlemeler ve dikkatlilik za-ruridir. Murabaha'ya ek olarak icare, selem ve mudarabe de belirli alanlarda MFK müşterilerine sunulmaktadır. Faizsiz mikro finans sisteminin temel zorlukları, faizsiz mikro finans hizmetleri ile ilgili eğitimli ve bilgili işgücünün yetersizliğinden kaynaklanan açık ve ayrıntılı bir mevzuatın yokluğu, sistemin muazzam ve zorlayıcı idari maliyetleri ve MFK'lar adına piyasadan satın aldıktan sonra malın kuruma teslim edilmemesi gibi bazı Şeriat ilkele-rine uyumsuzluktur. Mikro finans sektöründeki kritik endişe finansal katılım meselesi-dir. Finansal katılım, her bakımdan açık ve kapsamlı politika önlemleri ile sağlanacak-tır. Bunlardan en önemlileri arasında, ülkedeki kapsayıcı finansal sistemin uygulan-masının bir yolunu gösteren düzenleyici çerçeve yer almaktadır. Bu nedenle, NBE, yalnızca mikro finans sektöründe değil, aynı zamanda ülkenin genel mali sisteminde de faizsiz ve her şeyi kapsayan finansal hizmetlerin diğer biçimlerini gözden geçirme-li ve dikkate almalıdır. Bu politika önlemi, fonlara erişim için tüm engelleri kaldırır ve vatandaşların ekonomik sektörün her seviyesine katılımını arttırır."
