abstract: "Yazılı arşiv kaynakları sınıfında bulunan şer'iyye sicilleri, muhtevâsında bulundurduğu bilgi çeşitliliği bakımından önemli bir yazılı mirastır. Bu belgelerin içerisinde ait olduğu dönem ile ilgili bölgede yaşayan halkın askeri, hukuki, idârî, dini ve ekonomik durumu gibi birçok alanda mukayese yapma olanağı veren bilgiler sunmaktadır. Bu siciller, ait olduğu kentin idârî taksîmatı, yerleşim birimlerinin isimleri ve konumları, defterde geçen kişilerin ünvan veya lakapları, toplumu oluşturan kişiler arasındaki ilişkileri, şehirdeki âsâyişi, alım-satım, miras, vasî tâyini, nikâh, boşanma, işlenen suçlar, vergi toplama uygulaması, merkezden gelen emirler gibi birçok toplumsal ve idârî konular hakkında resmi bilgiler vermektedir. Amasya şehrinin tarihine ışık tutan aynası konumunda olan siciller, ait olduğu dönemde yaşayan toplumun anlaşılmasına yardımcı olan kaynakların başında bu defter gurupları gelmektedir. Söz konusu tez çalışmasında 24 numaralı Amasya Şer'iyye Sicili Defteri'ni merkeze alarak transkripsiyonu ve değerlendirilmesi yapılmıştır. Çalışma yedi bölümden meydana gelmektedir. Birinci bölümde, kaynak taraması yapılarak, şer'i mahkemeler, kadılık kurumu, kadı yardımcıları hakkında bilgilere yer verilmiştir. İkinci bölümde ise, Amasya'nın, tarihi, coğrafi konumu ve özellikleri, Amasya şehrine ait olan şer'iyye sicilleri hakkında açıklamalar yapılmıştır. Bu çalışmanın konusu oluşturan defterin fiziki yapısı ile ilgili bilgiler ikinci bölümde yer verilmiştir. Üçüncü bölümden başlayarak, metnin transkripsiyonun verildiği yedinci bölüme kadar ayrı başlıklar ve bölümler halinde defterin detaylı incelemesi sunulmaya çalışılmıştır."
