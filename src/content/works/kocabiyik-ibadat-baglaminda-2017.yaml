abstract: "Bu yüksek lisans tezi, ʽAbdullâh b. ʽAbbâs'ın ibadat konularında fıkıh mezhepleri üzerindeki etkisini, Hanefî, Mâlikî, Şâfiʽî, Hanbelî, Zâhirî ve İmâmiyye gibi önemli mezheplere kaynaklık etmesi yönüyle ele almaktadır. Tez, Giriş ve Üç Bölüm'den oluşmaktadır. Giriş kısmı, tezin içerik ve yöntemine dair ve aynı zamanda ʽAbdullâh b. ʽAbbâs hakkında ana hatlarıyla bilgiler vermektedir. Birinci bölüm, muhtelif İslam hukuk ekollerinin ʽAbdullâh b. ʽAbbâs'a nispet edilen aynı konuda farklı görüşlere dayanarak, farklı ictihadi sonuçlara ulaştıkları konuları incelemektedir. İkinci bölüm, muhtelif İslam hukuk ekollerinin ʽAbdullâh b. ʽAbbâs'a ait olan aynı konuda aynı görüşe dayanarak, aynı ictihadi sonuca ulaştıkları konuları ele almaktadır. Üçüncü bölüm, münferiden bir İslam Hukuk Ekolünün ʽAbdullâh b. ʽAbbâs'a ait olan aynı konudaki aynı görüşe dayanarak, aynı ictihadi sonuca vardığı konuları incelemektedir."
