abstract: "Bu makalenin amacı, farklı makine öğrenimi teknikleri kullanarak İslami bankalardaki likidite riski pozisyonunu tahmin etmeye odaklanmaktır. Körfez İşbirliği Konseyi'nde faaliyet gösteren 18 İslami bankadan 10 Bankaya özgü değişken ve iki Makroekonomik değişken toplanmıştır. Bu yazıda, kümelemeyi denetimsiz bir öğrenme tekniği olarak ve hem Yapay Sinir Ağı (YSA) hem de Rastgele Orman Sınıflandırıcısını denetimli öğrenme tekniği olarak uyguladık. Sonuç olarak kredi-mevduat oranına göre, bir İslami bankada likidite pozisyonunu belirleyen en önemli faktörler toplam aktifler ve aktiflerin getirisidir."
