abstract: "Ekonomik büyüme ülkeler için önemli bir kavramdır. Ekonomik büyümenin seneler içerisinde istatistiki olarak artmasından ziyade bu durumun istikrarı daha çok önem arz etmektedir. Ülkeler ekonomileri için karar vericilerin almış ve uygulamış olduğu politikalarda son yıllarda finansal piyasalara daha da ağırlık vermeye başlamışlardır. Finansal piyasaların vazgeçilmez unsurları olan bankaların da burada doğrudan etkileri bulunmaktadır. Son yıllarda yaşanan makro ve mikro çaplı krizlerin temel sebepleri arasında finansal piyasaların etken olması buradaki ağırlığın artmasında etkili olmaktadır. Finansal piyasalar içerisinde ise Katılım Bankaları son 20-25 yıl içerisinde Müslümanların ağırlıkta olduğu yerlerde etkin olmakla birlikte ve azınlıkta olduğu yerlerde dahi faal olmaktadırlar. Ülke ekonomileri için kaynakların etkin bir şekilde kullanılması ve atıl olarak kalan fonların ekonomiye aktarılması önem arz etmektedir. Araştırmada Türkiye örneği üzerinde 2010 ve 2020 yılları çeyreklik veriler baz alınarak Johansen Eş Bütünleşme testi ve Granger Nedensellik testleri uygulanmıştır. Katılım Bankalarında kullandırılan finansmanlar, vadeli ve vadesiz mevduatlar, toplam varlıklar ülke ekonomisinde temel gösterge olarak alınan Gayri Safi Yurtiçi Hâsıla (GSYİH) ile karşılaştırılmıştır. Uygulanan testler sonucunda değişkenler arasında uzun dönemli eş bütünleşme ilişkisi tespit edilmiştir. Nedensellik testleri sonucunda da kredilerden GSYİH'ya doğru tek yönlü nedensellik, GSYİH ve kredilerden mevduatlara yönlü de tek yönlü nedensellik tespit edilmiştir."
