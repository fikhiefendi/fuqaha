abstract: "Osmanlı Devleti taşra yönetiminde önemli bir yere sahip olan adli ve mülki işleri idare eden yöneticilere kadı denilmektedir. Osmanlı Devleti'nde kadılar şer'i ve örfi yargı görevlerinin yanı sıra devletin askeri, dini konularında da geniş yetkilere sahiptiler. Kadıların mahkemelerde verdikleri kararların yazılı olduğu defterlere“şer'iyye sicili”denilmektedir. Kadı sicilleri resmi bir evrak niteliğine sahip olup, güvenilir tarihi kaynaklar kabûl edilir. Şeriyye sicilleri dönemin gündelik hayatını, ekonomisini ve sosyo-kültürel yapısını inceleyen araştırmacılar için son derece kıymetli birer belge niteliği taşımaktadır.“221/1 Numaralı Urfa Şer'iyye Sicili'nin Transkripsiyon ve Değerlendirilmesi'' adlı tez çalışmasında sicilin ilk 212 sayfalık bölümü esas alınmaktadır. Transkripsiyon çalışması iki ana bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında Kadı Sicilleri tanıtılarak Osmanlı kadılık teşkilatı hakkında bilgi verilmiştir. Birinci bölümde 221/1 numaralı Urfa Şer'iyye Sicili'nin tanıtımı, sicile konu olan davaların içerikleri, sicilde geçen şahıs isimleri, bölgede bulunan mahalle, nahiye ve köy adları ve transkripsiyonda takip edilen metoda yer verilmiştir. İkinci bölüm ise ”221/1 Numaralı Defterdeki Davaların Özeti ve Transkripsiyonu\" adını taşımakta olup davaların özetleri ve metin trasnkriptleri yapılmıştır. Çalışmanın sonuç kısmında ise genel bir değerlendirilme yapılarak incelenen sicil defterindeki bilgiler ışığında Urfa şehrinin dini, sosyal, kültürel ve iktisadi yapısı hakkında bilgi verilmiştir."
