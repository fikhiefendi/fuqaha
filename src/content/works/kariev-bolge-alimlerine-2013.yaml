abstract: "İslam?ın temel şartlarından olan ve dinin direği olarak nitelenen namaz ibadetinin nerede, ne zaman, nasıl eda edileceği Kur?an ve Sünnet tarafından belirlenmiştir. Namazın, vakitlere bağlı bir ibadet olduğu ve günde beş defa kılınması gerektiği açık bir şekilde ifade edilmiştir. Bu beş adet namazın vakitleri ise belli şart ve alametlere bağlanmştır. İslamiyetin indiği ve ilk yayıldığı coğrafyalarda bu şart ve alametlerin düzenli olarak tekrar etmektedir. Ancak İslamiyetin kutuplara yakın bölgelere kadar yayılması ile birlikte daha önce tartışılmayan namazların vakitleri ve dolayısıyla sayıları hususunda ihtilaflar çıkmıştır. Bu çalışma, kuzey kutbuna yakın bir bölge olan İdil-Ural bölgesindeki yatsı namazı hususundaki ihtilafları ele almaktadır. Bu meselenin uygun çözüme kavuşması için bölge ulemasının yaptıkları ictihadlar, dayandıkları deliller kendi eserlerinden veya ikinci kaynaklardan hareketle ele alınmıştır.İlk olarak, namaz vakitlerinin astronomik ve coğrafi şartlara göre belirlenmesine binaen İdil-Ural bölgesinin coğrafi özellikleri hakkında bilgi verilmiştir ve ihtilaf mevzu olan akşam vaktindeki şafağın durumu üzerinde durulmuştur. İhtilaf mevzu olan bölge ve özellikleri anlatıldıktan sonra mevzu hakkında görüş belirten bölge âlimlerinin biyografileri ve bölge âlimleri arasında ortaya çıkan kadimci-ceditci şeklinde ortaya çıkan ayrışmaya da yer verilmiştir. Çalışmanın omurgası olan üçüncü bölümde bölge âlimlerinin görüşleri ve delilleri yorumlama farklılıkları ortaya konulmaya çalışılmıştır. Çalışmamızın sonuç bölümünde âlimlerin genel görüşleri kısaca sunulmuş ve bölge halkının geçmiş ulemanın konuyla ilgili tartışma ve görüşleri hakkında bilgi sahibi olmaları amaçlanmıştır."
