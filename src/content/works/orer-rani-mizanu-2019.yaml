abstract: "Bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusuna, önemine, amacına, plan ve yöntemine dair bilgilere yer verilmiştir. Birinci bölümde m. XVI. yüzyıl Mısır fakîhlerinden İmam Şa'rânî'nin hayatından, yaşadığı dönemin ilmî, sosyal ve siyâsî durumlarından bahsedilmektedir. İkinci bölümde ise Şa'rânî'nin Mîzânü'l-Kübrâ isimli eseri hakkında bilgiler yer almaktadır. Ardından çalışmanın ana konusu olan Şa'rânî'nin ortaya koyduğu dört mezhebe dair icmâ` edilen meseleler ele alınmaktadır. Sonrasında bu meseleler hakkında dört mezhebin temel kaynaklarına bakılarak Şa'rânî'nin tespitleri değerlendirilmektedir. Bu süreçte Şa'rânî'nin değinmediği bir icmâ` tespit edildiyse ilgili konunun peşinde zikredilmekte, Şa'rânî'nin değinip de hakîkatte ihtilaf bulunan meseleler de, ihtilaf gerekçeleriyle birlikte gerekli yerlerde belirtilmektedir. Nihayetinde Şa'rânî'nin ortaya koyduğu ittifak meselelerine dâir değerlendirmelerin bulunduğu bir sonuç bölümü bulunmaktadır."
