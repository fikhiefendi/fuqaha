abstract: "İslam Hukukçuları bir çok nedenden dolayı ihtilafa düşmüşler ve aynı meseleler hakkında farklı görüşler ileri sürmüşlerdir. Bu ihtilafların nedenlerinden birisi de tez konusu olarak seçtiğimiz“Hurûfa'l-Meânî”denilen harflerdir. Biz tez çalışmamızda bu harfleri yaptıkları görevler bakımından Atıf, Cer ve Şart harfleri şeklinde üç kategoride sınıflandırdık. Her kategorideki bütün harflere değil, sadece ihtilaflara en çok etkisi olanlara ve klasik usul kitaplarında yer alanlara yer verdik. Her bir harfin öncelikle kullanıldıkları anlamların neler olduğunu tespit ettik. Fıkıh usulcüleri ve fakihler, harflerin anlamlarının ne olduğunu tespit ederken Arap dilindeki kullanımlarını dayanak almışlardır. Bu da bize usulcülerin ve fakihlerin harflere yeni bir Şer' i anlam yükleme gayretinde olmadıklarım ve harflerin dildeki kullanımlarına sadık kaldıklarım göstermektedir. Daha sonra da harflerin ihtilafa nasıl etkisi olduğunu göstermek amacıyla her harfle ilgili bir ya da iki örneğe yer verdik. Bazı harfler ise, usul kitaplarında yer almalarına rağmen neden oldukları ihtilafları gösteren bir örnek bulamadık. Oluşan ihtilafları işlerken konuyu daha sistematik anlatabilmek için mezheplere °;öre konuyu anlatmaya çalıştık. Konunun fazla dağılmaması için de genelde iki mezhebin görüşlerini esas almaya özen gösterdik. İslam Hukukçuları fer'i meselelerdeki kendi görüşlerini desteklemek için harflerin yanında başka delillere de dayanmışlardır. Bunların başında Hz. Peygamber' in uygulamaları ve hadisleri gelmektedir. Biz konunun fazla dağılmaması için mümkün olduğunca harflerle ilgili delillerin dışına çıkmadık. Tez konumuz olan harflerin fikhi ihtilaflara etkisi, İslam Hukukçuları ve usulcülerinin bu harflerin anlamını tespitteki ihtilaflarından kaynaklanmaktadır. Bu ihtilaflar ise, iki nedenden dolayı ortaya çıkmaktadır. Bunlardan birincisi, harfin hakikat ve mecaz anlamlarının neler olduğunu tespitteki ihtilaftır. İkincisi ise, cümle içerisinde kullanıldığında hangi anlamda kullanıldığını belirlemedeki ihtilaftır. Bu ihtilaflar sonucunda fakihler farklı sonuçlara ve hükümlere ulaşmışlar; bu da meselelerin çözüm yollarının ve fıkhın genişlemesine neden olmuştur."
