abstract: "77 numaralı Antalya Şer'iyye Sicili'nin transkripsiyon ve değerlendirilmesi yöntemiyle oluşturulan bu çalışmada Osmanlı Devleti'ndeki hukuki süreç ve işleyişi ile alakalı dinamikler arasında, eyalet bazlı sistemin, devletin merkezi İstanbul ile bağlantılı bir şekilde ilerleyebilmesi için oluşturduğu düzenin incelenmesi konusu, tezin çıkış noktası olmuştur. Merkezde sağlanan hukuki düzenin, eyaletlerde de kayıtlı bir biçimde ilerleyebilmesi için, belirli kriterler ve belirli bir sistem ile seçtiği kadı isimli görevlilerin, oluşturduğu Şer'iyye Sicili isimli defterler, çok önemli bir yere sahiptir. Bu defterler birinci elden kaynaklar oldukları gibi bize yazıldıkları şehirlerle ilgili başka hiç biryerde bulamayacağımız bilgiler verirler. 600 yıllık Osmanlı İmparatorluğu'nun eksik kalan noktalarını birleştirmemize yardımcı bu nadir kaynaklar bize kent araştırmalarının önemini bir kez daha hatırlatır niteliktedir. Bunu baz alarak bu çalışmada yola, önce Şer'iyye Sicili'nin ait olduğu Antalya şehrinin tarihsel sürecinden bahsedilerek başlanmıştır. 1918-1924 yıllarına ihtiva eden defterin doğru yorumlanabilmesi adına, Antalya ilinin bu yıllara tekabül eden sosyal ve siyasi şartlarını anlamak bu bölümün ilk amacıdır. Bölüm, Şer'iyye Sicilleri ve Kadı'nın öneminden bahsedilmesiyle devam etmektedir. Burada sicillerde kullanılan belge çeşitleri tasniflendirilmiş ve açıklanmıştır. Sicillerin içeriklerine değinilmiş ve aynı zamanda kavramsal açıklamalar üzerinde durulmuştur. Tezin ikinci bölümde ise, 77 numaralı Antalya Şer'iyye Sicili'nin transkripsiyonu ve değerlendirilmesi yer almaktadır."
