abstract: "“Kunût İbadeti”isimli çalışmamızın giriş bölümünde, konunun amacı ve önemine dair hususların yanında metot ve kaynaklarına dair bilgiler yer verilmiştir. Birinci bölümde, kunût terimi başlığı altında sözlük ve ıstılâhî anlamları konusunda bilgi verilmiştir. Kunût duasının tarihçesi, hangi namazlarda okunduğu, şekli ve duası çalışıldıktan sonra hükmü konusunda kısa bilgi ile yetinilmiştir İkinci bölümde, Vitir namazında, sabah namazında, müslümanların başına gelen musibetler anında yapılacak kunût duasıyla ilgili mezheplerin görüşleri, delileriyle beraber ele alınmıştır. Bununla beraber kunûtta imama uyma, ellerin kaldırılması ve yüze sürülmesi, Cuma namazında kunût, Bayram namazında kunût, kunûtun miktarı, kunût duasında salâvat getirme ve kunûtun unutulmasının hükmü konularında mezheplerin görüşleri delilleriyle beraber çalışılmıştır. Araştırmamızın sonunda genel bir değerlendirme yapılmıştır."
