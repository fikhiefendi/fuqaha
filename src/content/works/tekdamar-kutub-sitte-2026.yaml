abstract: "Hicrî ikinci asır, fıkıh mezheplerinin ilk nüvelerinin teşekkül etmeye başladığı bir dönemdir. Bu süreçte ortaya çıkan metodolojik yaklaşımlar; coğrafi şartlar, sosyo-kültürel yapı ve ulaşılabilen rivayet mirası gibi unsurlara bağlı olarak bölgesel farklılıklar göstermiştir. Nas bulunmayan meselelerde daha fazla içtihada başvuranlar Ehl-i re'y, içtihattan ziyade rivayeti alanlar ise Ehl-i hadîs olarak isimlendirilmiştir. Bu dönemde Ebû Hanîfe, Mâlik, eş-Şâfiî ve Ahmed b. Hanbel ortaya koydukları fıkhî görüşlerle öne çıkan isimler olmuşlardır. Üçüncü asırda ise fıkhî mezhepleşme sürecine paralel olarak rivayetlerin fıkıh başlıkları altında tasnif edildiği câmi' ve sünen türü eserler telif edilmiştir. Bu araştırmada, Kütüb-i sitte müelliflerinin eserlerini telif ederken Mâlik'ten ne derece etkilendikleri mukayeseli bir perspektifle analiz edilmiştir. Çalışmanın ilk kısmında Kütüb-i sitte rivayetlerinin naklinde Mâlik'in rolü incelenmiş; Mâlik kanalıyla aktarılan hadislerin sayısal ve konusal dağılımı tablolarla ortaya konulmuştur. Ayrıca Kütüb-i sitte'de mevcut olup Muvatta'da yer almayan Mâlik rivayetleri tespit edilerek araştırmaya dâhil edilmiştir. Elde edilen veriler hem rivayetlerin niceliği hem de tematik dağılımı bakımından, müelliflerin Mâlik'in muhaddis kimliğine duydukları saygıyı açıkça göstermektedir. İkinci bölümde rivayetlerin nakledildiği fıkhî bağlamlar incelenmiştir. Başta Buhârî olmak üzere müelliflerin, çok yönlü rivayetleri farklı başlıklar altında nasıl değerlendirdikleri ele alınmıştır. Ayrıca Mâlik'in fıkhî görüşleriyle örtüşen ve ayrışan noktalar analiz edilmiştir. Araştırma sonunda Kütüb-i sitte müellifleri, Malik'ten fazlaca rivâyet nakletmelerine rağmen onun fıkhî içtihatlarını aynen kabul etmekten ziyade rivayetlerin lafzî içeriğine bağlı kalmaya öncelik verdikleri görülmüştür. Sonuç olarak bu çalışma, klasik hadis literatürünün temel kaynakları arasında yer alan Kütüb-i sitte'nin teşekkül sürecinde Mâlik'in derin ve belirleyici etkisini, somut veriler ışığında ortaya koymaktadır."
