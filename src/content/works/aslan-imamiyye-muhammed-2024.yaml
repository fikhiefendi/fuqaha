abstract: "Ele alınan bu araştırmada İslâm Mezhepler Tarihinde önemli bir yeri olan Muhammed b. Hanefiyye'nin hayatı, Şiî düşünceye olan katkıları ve İmâmiyye fırkasının kendisine yaklaşımı incelenmiştir. Muhammed b. Hanefiyye'nin İmâmiyye mezhebindeki konumu ise araştırmanın genel amacını oluşturmaktadır. Araştırmanın birinci bölümünde Muhammed b. Hanefiyye'nin hayatı ele alınmış ve Şîa'yı oluşturan temel kavramlar üzerinden Şiî düşüncedeki yeri tespit edilmeye çalışılmıştır. İkinci bölümde ise Muhammed b. Hanefiyye hakkında İmâmî literatür taraması yapılmış ve onun hakkında ortaya atılan iddialara İmâmiyye fırkasının yapmış olduğu eleştiriler incelenmiştir. Muhammed b. Hanefiyye, Hz. Ali'nin, Hz. Fâtıma'dan olmayan çocuklarından birisidir. İbnü'l-Hanefiyye, Hz. Ebû Bekir'den sonraki diğer üç halife döneminde ve Emevî Halifelerinden Abdülmelik b. Mervan dönemine kadar yaşamıştır. O bazen abileri Hz. Hasan ve Hz. Hüseyin'in bir adım gerisinde kalmış, bazen de Cemel ve Sıffîn gibi savaşlarda babasının sancağını en ön saflarda taşımıştır. Muhammed b. Hanefiyye Kerbelâ vakasından sonra Ehl-i beyt taraftarlarının gözdesi haline gelmiştir. Bu süreçte İslâm toplumunun birlik ve beraberliği için uğraşmış, herhangi bir fitneye sebebiyet vermemek ve Müslüman kanı dökmemek için büyük çaba göstermiştir. Muhammed b. Hanefiyye'nin vefatından sonra Keysâniyye mezhebi onun imam olarak seçildiği, ölmediği, Radva isimli dağda gaybette olduğu ve bir gün geri döneceği gibi iddialar ortaya atmıştır. Şîa'da ana bünyeyi oluşturan İmâmiyye fırkası ise onun imâmet iddiasında bulunmadığını ve vefat etmiş olduğunu söyleyerek Keysâniyye'yi eleştirmiştir. Daha sonraki süreçte Muhammed b. Hanefiyye hakkında ortaya atılan gaybet, recat, mehdîlik ve gizli ilimleri bilmesi gibi iddialar İmâmiyye mezhebinin inanç esasları haline gelmiştir."
