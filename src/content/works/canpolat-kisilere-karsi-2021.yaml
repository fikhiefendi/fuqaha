abstract: "Hukuk sistemleri toplumda huzur ve düzeni sağlamak, kişilerin can ve mal güvenliğini korumak, hak ve özgürlükleri ihlal edilen insanların mağduriyetlerini gidermek için kanunlar çıkarır ve bu çerçevede çeşitli yaptırımlar uygularlar. Tarih boyunca ortaya konulan hukukî sistemlerin bir kısmı dinî, bir kısmı ise beşerîdir. Araştırmamıza konu ettiğimiz Türk ceza hukuku İtalya Ceza Kanunu'ndan alınmış ve zamanla ihtiyaca binaen yeniden düzenlenmiş bir kanuna dayanmaktadır. İslâm ceza hukuku ise Kur'an ve Sünnet'e dayanan ilahi kaynaklı bir hukuk sistemidir. Yaptırım itibariyle de İslâm ceza hukuku maddi müeyyidelerin yanı sıra uhrevî ikâbı öngörmesi itibariyle Türk ceza hukukundan farklılık arz etmektedir. Çalışmamızda Türk Ceza Kanunu'nun“Kişilere Karşı İşlenen Suçlar”başlığı altında yer alan konular ele alınmıştır. İlgili başlıklarda suçların İslâm ceza hukuku doktrini içerisindeki yeri ortaya konulmuş, kavram ve tanımlamaları ile açıklamalar yapılmıştır. Türk ceza hukuku ve İslâm ceza hukuku arasındaki benzer ve farklı noktalara dikkat çekilmiştir. Aynı zamanda her iki hukuk sisteminde bahsi geçen suçların cezalandırılma yöntemleri, fâilin ve mağdurun hak ve sorumlulukları ele alınmıştır."
