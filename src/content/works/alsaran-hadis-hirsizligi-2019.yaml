abstract: "İslâm hukukunun aslî kaynaklarından sayılan ve müslümanların yaşamına ışık tutan hadisler tarihi süreç içerisinde bir takım tehlikelerle karşı karşıya kalmıştır. Özellikle Hz. Peygamber (s.a.v.)'in vefatından bir süre sonra hadis uydurma faaliyetlerinin başlamış olması, hadis râvîsi sahâbîlerin vefatıyla bu faaliyetlerin hızlanması, râvîlerin ve rivâyetlerin İslâm coğrafyasının çeşitli bölgelerine dağılması gibi durumlar ulemâyı harekete geçirmiş ve hadisler muhaddislerin üstün gayretleriyle bir araya toplanarak günümüze intikal etmiştir. Sahâbe döneminden itibaren hadislerin taşıyıcısı konumundaki muhaddisler, rivâyetleri muhafaza altına alarak kaydetmek, tetkik ederek nakletmek için hadis yolculukları (rıhleler) düzenlemişlerdir. Bu yolculukların sonucu olarak, zaman içinde hadislerin sahih olanını zayıf olanından ayırmak, râvîlerin güvenilirlik derecelerini, senedlerin sıhhat durumlarını açıklayan Cerh-Ta'dîl ilmi ve hadislerin nakledilme metodlarını belirleyen Tahammül-Edâ metodları gibi bazı ilmî kriterler ortaya çıkmıştır. Cerh-Ta'dil işlemi sırasında muhaddislerin kullandıkları“yesriku'l-hadîs”lafzı, hadis çalan râvîlerin tenkidine yönelik bir ifade olarak karşımıza çıkmaktadır ki, tezimizin ana konusunu bu kavram oluşturmaktadır.“Hadis Hırsızlığı”adlı çalışmamız, usûlsüz hadis rivâyet etmeleri sebebiyle muhaddislerin haklarında“hadis çalar”diyerek cerhettikleri bazı râvîlerin hadis aşırma yöntemlerini ve muhaddisleri bu lafzı kullanmaya iten temel sebepleri araştırmaya yönelik olarak hazırlanmıştır."
