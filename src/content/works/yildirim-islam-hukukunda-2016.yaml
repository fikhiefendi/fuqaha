abstract: "Çalışmamızın içeriği, giriş, üç bölüm ve sonuç kısmından oluşturmaktadır. Girişte araştırmanın amacı, önemi ve araştırmada izlenen yöntem ele alınmıştır. Birinci bölümde, zinâ kavramının tanımı, zinânın haram oluşunun delilleri ve hikmetleri, zinâ suçunun cezası ve zinânın kişi ve toplum üzerindeki etkileri üzerinde durmaya çalıştık. Ayrıca veled-i zinâ kavramıyla kimlerin kastedildiği, veled-i zinâ ile benzer durumda olan veled-i mülâane, veled-i lakît ve veled-i şibhe gibi kavramları açıklayıp bunların tabi oldukları hükümler bakımından aynı ve ayrı olduğu durumlara yer verilmiştir. İkinci bölümde ibâdât, muamelat, idare ve ceza hukukunda veled-i zinânın durumunu irdelemeye çalıştık. Üçüncü bölümde ise miras, nafaka, hidâne ve nesep gibi konuları ahval-ı şahsiye ve veled-i zinâ başlığı altında inceledikten sonra sonuç kısmında konuyu toparlamaya çalıştık. Sonuç kısmında ise, çalışmamız sonucunda ulaşmış olduğumuz hususlar ifade edilmiştir."
