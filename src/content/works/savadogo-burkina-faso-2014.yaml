abstract: "Burkina Faso'da mikro finans,1980'li yıllarda ortaya çıkmıştır. Mikro finansın gelişmesi; ülkenin fakirliği ve bankacılık sisteminin durumu gibi iki ana faktöre bağlıdır. Burkina Faso'nun ekonomisi tarım ve madenciliğe dayanmaktadır. Nüfusun %80'i tarım sektöründe çalışır. Burkina Faso'nun 2011 yılındaki kişi başına düşen Gayrı safi yurtiçi hasıla (GSYİH)'si 613$ ile, dünya sıralamasındaki en düşük olan GSYİH'lerden biridir. Burkina Faso'da GSYİH'nın %31'ini tarım sektörü sağlamaktadır, finansal erişim oranı %18 civarındadır. 2009 yılında yoksulluk sınırı altında yaşayan bireylerin oranı, %43,9'tu. Burkina Faso'nun mikro finans sektörü 156 mikro finans kurum (MFK)'den oluşmaktadır. Ancak sektörün kredi ve tasarrufun %75'ine tek MFK olan Reseau des Caisses populaires du Burkina (RCPB) sahiptir. MFK'ların kredi kalitesi ve karlılık durumu yeterince iyi olmasına karşın, mikro finansın yoksullukla mücadele çerçevesinde etkin olması için tarım kredisinin çoğaltılması gerekmektedir. Tarım kredisinin güvenli olması için devlet garantisi veya grup kredi sistemi uygulanabilir. Ayrıca leasing yöntemi ve İslami finans mekanizmasının kullanılması faydalı olabilir."
