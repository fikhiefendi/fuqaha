abstract: "Bu çalışma İbnü'l-Hümâm'ın (ö. 861/1457) Fethu'l-kadîr adlı eserinde muamelat alanına dair meselelerde Hanefî mezhebinin kurucu imamlarından ayrıldığı görüşleri tespit etmeyi hedeflemektedir. İbnü'l-Hümâm'ın Hanefî mezhebi içerisindeki ilmî konumunun yalnızca tabakât eserlerinde kendisine nispet edilen vasıflar üzerinden değil, bizzat fıkhî meseleleri ele alış biçimi üzerinden değerlendirilmesi gerektiği düşüncesi çalışmanın çıkış noktalarından biri olmuştur. Zira İbnü'l-Hümâm, Fethu'l-kadîr'de sadece el-Hidâye'yi şerh eden bir âlim olarak değil, mezhep görüşlerini delil, illet, usul ve tutarlılık bakımından değerlendiren bir fakih olarak öne çıkmaktadır. Ayrıca onun ibadet ve aile hukuku alanındaki tercihleri üzerine çalışmalar yapılmış olmakla birlikte, muamelat alanındaki mezhebe muhalif görüşleri müstakil ve bütüncül biçimde incelenmemiştir. Bu çalışma söz konusu boşluğa katkı sunmayı amaçlamaktadır. Araştırmada mezhebe muhalefet kavramı, İbnü'l-Hümâm'ın Hanefî mezhebine mensubiyetini ortadan kaldıran genel bir ayrışma anlamında değil, onun kurucu imamların tamamına ait görüş alanı dışında kalan bir kanaati benimsemesi anlamında kullanılmıştır. Bu sebeple kurucu imamlardan birinin görüşünü diğerlerine tercih ettiği yerler değil yalnızca üç kurucu imamın hiçbirine ait olmayan görüşleri benimsediği meseleler esas alınmıştır. Yöntem olarak Fethu'l-kadîr'in muamelat bölümleri belirli kelimeler üzerinden yapılan sınırlı taramalarla değil, baştan sona okunmuştur. Bu okuma sırasında sadece muhalif görüşlerine odaklanılmayıp aynı zamanda müellifin delilleri nasıl değerlendirdiği, hangi gerekçelerle eleştiri yaptığı ve hangi sonuca ulaştığı da ortaya konmuştur. Böylece bir yandan İbnü'l-Hümâm'ın eserindeki yöntemi ortaya konmuş, diğer yandan kurucu imamlara muhalif olarak benimsediği görüşler tespit edilmiştir. Tespit edilen meselelerde önce Hanefî mezhebinin kurucu imamlarının görüşleri, ardından diğer mezheplerin yaklaşımları, İbnü'l-Hümâm'ın değerlendirmesi ve sonraki Hanefî literatürde bu görüşlerin nasıl karşılandığı incelenmiştir. Son olarak İbnü'l-Hümâm'ın mezhebe muhalefet sebepleri tespit edilerek yer verilmiştir."
