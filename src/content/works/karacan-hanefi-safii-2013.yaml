abstract: "Bu çalışmada Hanefî ve Şafiî mezheplerinin devlet başkanına tanıdıkları yetkileri incelenecektir. Bunun için Necmuddin et-Tarsûsî?nin XIV. yüzyılın ortalarında Şam?da baş kadılık vazifesi döneminde kaleme aldığı, Tuhfetü?t-Türk (Türk?e armağan) adlı eseri esas alınmıştır. Bununla birlikte müellifin, Hanefî mezhebinin devlet başkanına, Şafiî mezhebine oranla daha fazla yetki tanıdığı şeklindeki iddiası incelenecektir. Bu sebeple, tayin edici altı fıkhî mesele araştırmanın odağı olarak belirlenmiştir. Ayrıca, eserin gerekli açıklamalarla birlikte tanıtılacağı bu araştırmada İslam hukukuna göre devlet başkanı meselesi de değişik yönleriyle ele alınacaktır."
