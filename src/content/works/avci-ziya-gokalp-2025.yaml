abstract: "Bu tez Osmanlı Devleti'nin yıkılmasından sonra yerine kurulan Türkiye Cumhuriyeti'nin önemli fikir babalarından olan Ziya Gökalp'in İslam aile hukuku hakkındaki görüşlerini fıkhî açıdan değerlendirmek maksadıyla kaleme alınmıştır. Gökalp'in İslâm Mecmuası, Küçük Mecmua ve Yeni Mecmua dergilerindeki makaleleri temel alınarak ve bu alanda yazılan bilimsel çalışmalardan yararlanılarak hazırlanmıştır. Tezimiz giriş bölümüyle birlikte beş bölümden oluşmaktadır: Giriş bölümünde araştırmamızın konusu, amacı, önemi, metodu ve kaynakları ele alınmıştır. İkinci bölümde Ziya Gökalp'in hayatı, eserleri ve yaşadığı dönemdeki genel duruma yaklaşımı incelenmiştir. Üçüncü bölümde Gökalp'in din, İslâm ve fıkıh görüşlerine yer verilmiştir. Dördüncü bölümde ise kadın, tesettür ve aile hakkındaki temel görüşlerine değindikten sonra Gökalp'in İslâm aile hukuku hakkındaki hükümleri fıkhî açıdan değerlendirilmiştir. Son bölümünde ise çalışmada ulaşılan sonuçlar zikredilmiştir."
