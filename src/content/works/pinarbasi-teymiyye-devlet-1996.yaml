abstract: "ÖZET Devlet ve iktisadi faaliyetler insan için vazgeçilmez bir öneme sahiptir. Devletin sağladığı adalet ve güvenlik ortamı olmadan iktisadi gelişme olmayacağı gibi, iktisadi faaliyetler olmadan devlet ayakta duramaz. Bu tez çalışmasının amacı iktisada ilişkin bir konuda kendi kültürel mirasımızda neler söylendiğini araştırmak, orta çağın bir büyük düşünürü hakkında bilgi vermek ve genel iktisadi düşünce tarihindeki“boşluğu”bir nebze de olsa doldurmaktır. Tezin ana konusu İbn Teymiyye'de Devlet-iktisat ilişkisi olmasına rağmen onun siyasi ve iktisadi görüşlerine de temas edilmiştir. Bu çalımanm yeterli olduğunu söylemek mümkün değildir. Son yıllarda Türkiye'de artan kültürel mirasımıza yönelik çalışmalardan biridir. İbn Teymiyye'nin devlet-iktisat ilşkisine dair görüşleri çağdaş iktisatçıların özellikle neo-klasiklerin görüşleriyle benzeşmektedir. İslam düşüncesi tarihinde bu konuyu bu kadar kapsamlı ele alan bir düşünürün bulunmadığı söylenmektedir. Kamu yaran sözkonusu olduğunda devlet müdahelesini caiz hatta vacip gören İbn Teymiyye, normal şartlar altında seyreden ekonomiye müdahele edilmesini iktisadi açıdan yararsız, sonuçlan bakımından da zulüm olarak görmektedir. v."
