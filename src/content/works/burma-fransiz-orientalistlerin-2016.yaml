abstract: "Tezimizin hedefi Oryantalizmin ne olduğunu, tarihi sürecini, oryantalistlerin Kur'ân'a ve İslam Fıkhı'na karşı tutumlarını, hedeflerini, çalışma ve faaliyetlerini ele almaktı. Özellikle de önemli oryantalistik merkezlerden olan Fransa'daki gelişimini ve oryantalist çalışmalarını ortaya çıkarmaktı. Çalışmamızda, önce oryantalizmin ne olduğu, sonra ise oryantalistlerin/müsteşriklerin genel tutumları ve Kuran'a bakışları, son olarak da Fransız oryantalistlerin İslam Hukuku literatürü hakkındaki çalışmaları, oluşturdukları kurumları ve telif eserleri çerçevesinde ihtisâr ile inceledik. Fransız müsteşriklerin her alanda olduğu gibi İslam hukuku sahasında da oldukça fazla araştırmalarının olduğunu tespit ettik."
