abstract: "Arap dili, fıkıh, tefsir, hadis, kelam gibi temel İslam ilimlerinin özünü ve ana zeminini teşkil eden en önemli ilimdir. Bu yüzden dinî nasların ihtiva ettiği hüküm ve bilgilerin elde edilebilmesi vaz', delâlet, hakikat-mecâz, âmm-has, isti'mâl, müşterek-müteradif, istisna ve emir-nehiy gibi dilsel konularda birikimi gerektirmektedir. Bu sebeple İslâm âlimleri tarafından dinî nasları anlamak üzere bir yöntem bilimi olarak vaz' edilen fıkıh usûlü ilminin önemli bir kısmı“mebâdiü'l-luga”yani temel lisanî mukaddimeler diye anılan dilsel konulardan oluşur. Bu sebeple usul âlimleri bu dilsel konulara en az dil bilimciler kadar ihtimam göstermişlerdir. Nitekim İslâm ilim geleneğinde dilbilim araştırmalarının yoğun olarak gözlendiği alanlar nahiv, belagat ve mantık gibi ilimlerin yanı sıra fıkıh usulüdür. Dil ilimlerinin fıkıh usulüyle buluştuğu konuların başında, bu ilimdeki umûm-husûs bahisleri gelir. Bu çalışmada, dini nasların anlaşılması noktasında kritik bir öneme sahip olan umûm-husûs meselesi, dil açısından,“Karâfî örneğinde”incelenmiştir. Bununla birlikte konunun farklı ilim dallarının kesişim noktası olması dolayısıyla çalışma, belli ölçüde disiplinler arası bir mahiyet arz eder. Tezde, konuyla ilgili müstakil bir eser kaleme almış olan Karâfî'nin umûm-husûs'a dair görüşleri, eserinde serdettiği tanımlar üzerinden analiz edilmiş ve onun umûm-husûs tasavvuru tespit edilmeye çalışılmıştır. Usulcüler tarafından yirmi kadar umûm sigası tespit edilebilmiştir, oysa Karâfî eserinde iki yüz elli kadar umûm sîgası saymaktadır. Ulaşılan bu sayı, onun bu konuya dair özgün fikirleri olduğuna ve konuyu ne kadar detaylı incelediğine dair ipuçları vermektedir. Bu tezde Karâfî'nin umûm-husûs tasavvurunu tespit etmenin yanında, fıkıh usulü eserlerinde ancak onbeş-yirmi adet olarak zikredilen umûm sigalarının Karâfî'de nasıl olup da iki yüz elli'ye çıkabildiği sorusuna cevap aranmıştır."
