abstract: "İslâmî ilimlerin bir parçası olan fıkıh, teşekkülünden bu yana sahip olduğu dinamik yapısı sayesinde zengin bir literatüre şahitlik etmiştir. Zaman içerisinde gelişen bu literatür, gerek teknik gerekse muhtevâ açısından birbirinden farklı yazım türlerini beraberinde getirmiştir. Fıkhî müktesebâtın farklı bakış açılarıyla yorumlanması sonucu ortaya çıkan kavâid-i fıkhiyye ilmi, bu disiplinlerin başında gelmektedir. Küllî kâideler, fıkhın özünü ve ilkesel yönünü göstermesi açısından önemli bir yeri hâizdir. Bu açıdan küllî kâideleri bir arada toplamak ve fer'î ahkâma ortak açıklama getirmek amacıyla çeşitli eserler kaleme alınmıştır. Bu çalışmada kavâid ilmi açısından önemli bir yer edinen Zerkeşî'nin el-Mensûr fi'l-kavâ'id fürû fıkhi'ş-Şâfiîyye isimli eseri incelenmektedir. Çalışmamızın birinci bölümünde ilmî yönden çok yönlü kişiliği ile tanınan Zerkeşî'nin hayatı hakkında özet bilgiler sunulduktan sonra konumuzla yakın irtibatı olması sebebiyle kavâid ilmi ve tarihsel gelişimi kısaca ele alınmıştır. Akabinde ise eserde geçen ıstılahlar, isimler ve müellifin kullandığı kaynaklar tespit edilmiştir. İkinci bölümde çalışmamızın merkezini teşkil eden Zerkeşî'nin eseri, muhtevâ ve metod açısından incelenerek eserin önemi, sonraki dönemlere etkisi ve özgün yönleri tespit edilmiştir. Akabinde ise, söz konusu eser kavâid alanında telif edilen benzer eserlerle mukayese edilerek aralarındaki benzerlikler ve farklılıklar tespit edilmiştir."
