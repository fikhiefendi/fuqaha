abstract: "Klasik eserler diye adlandırdığımız çalısmaların önemli bir bölümü yazmalar halinde bulunmaktadır. Geçmiste bir ilmi gelenek çerçevesinde kaleme alınan bu eserlerin bugün islenerek güncellemesinin yapılması -yeni bilgi- üretmenin temel sartlarındandır. Bundan dolayı yazma eser çalısmak, geçmise ait bir sorumluluğu yerine getirmenin yanı sıra gelecekteki ilmi çalısmaların sıhhati ve sürekliliği için önemlidir. Çalısmamız Fıkıh usulünde oldukça önemli bir yere sahip olan Debusi'nin Takvimü'l Edille'sinin muhatasarı niteliğinde olan Havi'l Kudsî adlı eserin usulü'l fıkıh bölümünü konu edinmektedir. Bu mütevazı çalısma, fıkıh usulü çalısmalarına ve yazma eserlerin gün ısığına çıkarmaya küçükte olsa bir katkı sağlama amacı gütmektedir. Çalısmanın konusu, amacı, çalısmada uygulanan yöntem ve arastırmalar giris kısmında verilmistir. Eserin müellifine nispetinin sıhhatinin çesitli açılardan sorgulanması, mevcut nüshalarda ve biyografik kaynaklardaki bilgilerin karsılastırılması ve Havî'l Kudsî'nin mevcut nüshaları hakkında bilgi eserin birinci bölümünü olusturmaktadır. Tezimizin ikinci bölümünü el- Havî'l Kudsî'nin genel olarak içeriğinin, sistematiğinin ortaya konulması ve fıkıh usûlü bölümünün muhtevasının akli ve seri deliller çerçevesinde değerlendirilmesinden olusmaktadır. Bu çerçevede müellifin basta Debûsî olmak üzere Serahsi ve Pezdevî gibi usul alimlerinin eserleriyle karsılastırılarak farklılıkları tesbit edilmeye çalısılmıstır. Havî'l Kudsî'nin fıkıh usûlü bölümünün tahkikli metni ise çalısmamızın üçüncü bölümünü olusturmaktadır. Üçüncü bölüm ise, fıkıh usûlü konuları, ser'i deliller esas alınarak,müellifin konuları ele alısı, eserin sistematiği, kavramların açıklanması, Debûsi ile karsılastırılması yer yerde genel Hanefi söylemdeki yerinin tespit edilmesi seklinde kaleme alınmıstır. Tahkikli metni hazırlanırken diğer tahkik çalısmaları dikkate alınarak bir usul tayin edilmistir. Nüshalar, Arapça harflerle bulundukları kütüphanelere göre rumuz verilmis, nüshalar arası farklılıklar dip notlarda gösterilmistir. Metin içinde yer alan ayet ve hadislerin bulundukları yerler tespit edilerek, ayetler metin içinde, hadis kaynakları dipnotlarda gösterilmislerdir. Tez içerisinde tahkikli metin değerlendirme bölümünün devamı olarak gösterilmis ancak Arapça metinler sağdan basladığı için tezin son kısmına koyularak sayfa numaraları yeniden verilmistir."
