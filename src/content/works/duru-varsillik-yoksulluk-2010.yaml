abstract: "Varsıllık ve yoksulluk kavramları zekât, fıtır sadakası, fidye, nafaka gibi malî nitelikteki dinî mükellefiyetlerin temelini teşkil etmektedir. Bu nedenle bu kavramların çerçevesinin çizilmesi İslâm hukuku açısından son derece önemlidir.Fakihler, varsıllık ve yoksulluk kavramlarının çerçevesinin çizilmesi amacıyla ciddi bir zihnî çaba harcamışlar, malî-dinî mükellefiyetlerle ilgili nasları kendi dönemlerinin iktisâdî ve sosyal şartlarına göre yorumlamış ve pratik çözümler üretmişlerdir. Ancak bu çözümler günümüzdeki sanayi toplumlarının ihtiyaçlarını tam olarak karşılamamaktadır. Dolayısıyla çağdaş fıkıh âlimleri bu konularda yeni çözüm yolları üretmeye çalışmaktadırlar.Biz de bu çalışmamızda modern dönemde yapılan yoksulluk araştırmalarının ortaya koyduğu açlık sınırı ve yoksulluk sınırı kavramları ile bir işçiye yasal olarak ödenebilecek en az ücret olan asgarî ücretin malî-dinî yükümlülüklere nasıl etki edeceğini tespit etmeye çalıştık.Malî-dinî mükellefiyetlerle ilgili en çok tartışılan konulardan biri nisab kavramıdır. Zekâta tabi olan malların nisabları Hz. Peygamber (a.s) tarafından belirlenmiştir. Bu belirlemenin taabbudî mi yoksa o dönemde Müslümanların zekât uygulamalarına pratik bir çözüm getirme amacıyla mı belirlendiği tartışmalıdır. Özellikle gümüşün değerinin çok düşmesi nedeniyle para nisabının belirlenmesinde neyin esas alınacağı da tartışılan bir diğer konudur. Buna bağlı olarak açlık sınırı, yoksulluk sınırı ve asgarî ücret kavramlarının nisabın belirlenmesinde kıstas olarak alınıp alınamayacağı da tartışılmıştır.Açlık sınırı, yoksulluk sınırı gibi kavramlar toplumun genel hayat standardı hakkında bize yardımcı olabilir. Ancak nisabın belirlenmesinde kıstas olarak kullanılamazlar. Çünkü bu kavramlar üzerinde fikir birliği edilmiş kavramlar değildirler. Açlık sınırı ve yoksulluk sınırının ölçülmesinde farklı kıstaslar kullanılmaktadır. Dolayısıyla ortaya çıkan sonuçlar da birbirinden farklı olmaktadır. Bununla birlikte açlık sınırı ve yoksulluk sınırı dört kişilik model bir aile üzerinden ölçüldüğü için toplumun tamamı için geçerli olmamaktadır. Nisab ise kesindir ve herkes için aynıdır, değişmez.Zekât dışındaki diğer malî-dinî mükellefiyetlerde nisab şartı yoktur. Kişinin aslî ihtiyaçlardan fazla yeterli mala sahip olması o ibadetin yerine getirilmesi için kâfidir."
