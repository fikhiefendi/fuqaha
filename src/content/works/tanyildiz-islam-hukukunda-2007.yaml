abstract: "?İslâm Hukukunda Sarhoşluğun Ceza Ehliyetine Etkisi? başlıklı tezimiz, Önsöz, üç bölüm, Sonuç ve Kaynakça kısımlarından oluşmaktadır. Önsözde çalışmanın amacı belirtilerek, tezde işlenen konuların genel değerlendirilmesi yapılmıştır. Birinci Bölüm'de Suç ve Ceza Kavramları, Cezanın Amacı ve Suçun Unsurlarına yer verilmiştir. İkinci Bölümde Sarhoşluğun Tanımı, Sarhoşluk Veren Maddeler, Sarhoşluk Veren Maddelerin Dini Hükmü ve Ehliyet Kavramı'na değinildikten sonra Sarhoşluğun Ceza Ehliyetine Etkisi Nazariyesi ele alınmıştır. Üçüncü Bölümde Kısas ve Diyet Suçlarında Sarhoşluğun Ceza Ehliyetine Etkisi ve Had Cezaları Açısından Sarhoşluğun Ceza Ehliyetine Etkisi değerlendirildikten sonra Had Suçlarının Özellikleri ve Çeşitleri incelenmiştir. Sonuçta, ayrıntıları işlenen bölümlerin genel bir değerlendirilmesi yapılmış ve düşüncelerimiz belirtilmiştir."
