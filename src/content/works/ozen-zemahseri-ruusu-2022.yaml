abstract: "İtikatta Mutezilî, amelde Hanefi olan Zemahşerî, fıkıh konusunda kaleme aldığı“Ruûsü'l-Mesâil”adlı eseri, Hanefi ve Şâfiî mezhebinin ihtilaflı görüşleri delilleriyle birlikte verilen nadide hilaf türü eserlerdendir. Bu tür eserler mühim olmakla birlikte bazı problemleri de beraberinde getirirler. Bu problemlerden bir kaçı şu şekilde zikredilebilir: Nispet edilen görüş gerçekten nispet edilene ait mi değil mi? Nispet edilen görüş, nispet edilen kişinin tercih ettiği görüş mü değil mi? Nispet edilen görüş, nispet edilen mezhep âlimleri tarafından kabul edilip edilmediği gibi birçok soru işareti içermektedir. Bu soruların cevaplarını bulmaya ve değerlendirmeye gayret ettik. Bu çalışmamızda evvela Zemahşerî'nin hayatı, aile yapısı, ilmi yolculukları, ders aldığı hocaları, öğrencileri ve eserleri araştırıp öz bir şekilde verdik. Daha sonra İmam Zemahşerî'nin“Ruûsü'l-Mesâil”adlı eserinde de yukarıda sözü ettiğimiz soru işaretlerin ve sıkıntıların mevcut olup olmadığını görmek için bu eserin ihtiva ettiği; kısâs, diyet, kefâret, bâğî ve hadler bölümünü araştırmaya çalıştık. Zemahşerî'nin“Ruûsü'l-Mesâil”isimli eserindeki sistematiği; Hanefi mezhebi ve İmam Şâfiî'ye nispet ettiği görüşü verdikten sonra her iki mezhebin bu görüşlerinde dayandıkları delileri de vermiştir. Fakat biz bu çalışmamızın daha rahat anlaşılması için ve karışıklığa mahal vermemek adına, Ruûsü'l-Mesâil sistematiğinden farklı bir metotla çalıştık. Çalışmamızda, Zemahşerî'nin Hanefi mezhebine isnat ettiği görüş ve delilleri müstakil bir başlık altında verdikten sonra, aynı şekilde İmam Şâfiî'ye isnat edilen görüş ve delilleri de müstakil bir başlık altında verip ve Şâfiî mezhebine mensup olan diğer âlimlerin görüşleriyle birlikte Şâfiî mezhebine ait klasik ve mun'asır kaynaklarda değerlendirdik."
