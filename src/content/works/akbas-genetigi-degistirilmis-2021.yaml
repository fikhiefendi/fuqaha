abstract: "Genetiği değiştirilmiş organizmaların İslam hukuku açısından incelenmesi helâl gıda açısından önemlidir. Konunun anlaşılması için birçok boyutunun ortaya konulması zaruridir. Konunun İslam hukuku perspektifinden değerlendirilmesiyle bu konuda duyarlılık oluşturulması elzemdir. Genetiği değiştirilmiş organizmaların geçmişi ve bugünü değerlendirilirken, konu ile ilgili geleceğe dair tahminlerin de ortaya konulması önemlidir. Bu çalışmada genetiği değiştirilmiş organizmaların, kavramsal çerçevesini ortaya koymaya çalıştık. Genetiği değiştirilmiş organizmaların önemi, tarımdaki yeri, elde edilişi ve analizi gibi teknik konulara yer verdik. Aynı zamanda genetiği değiştirilmiş organizmaların faydalarına ve zararlarına değindik. Konuya hukuki açıdan bakarken, konuyu öncelikle günümüz hukuku açısından da ele aldık. Sonrasında, sözü İslam hukukuna getirerek, konuyu helâl ve haram kriterleriyle ve helâl gıda boyutuyla yorumlamaya gayret ettik. Konu ile ilgili İslam hukuku açısından kurumsal ve bireysel görüşlere yer verildikten sonra kendi görüşümüz de ortaya konulmaya çalışılmıştır."
