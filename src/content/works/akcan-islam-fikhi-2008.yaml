abstract: "Bu tez İslam Fıkhı'nda işçinin hak ve sorumluluklarının tespitini, tasnifini ve değerlendirilmesini hedeflemektedir. İslam'ın birey ve toplum çerçevesinde işçi hukukuna bakışını ortaya koymak, yer yer de bu alanda yapılmış çalışmaları derlemek ve günümüz problemleri açısından mukayeseye varan yorumlarda bulunmayı amaçlayan çalışmamızda; iş dünyasının iki kesimi arasında oluşan kutuplaşmanın kökenindeki temel problemlerin neler olduğu, İslam Fıkhı'nın bu problemlere karşı ne tür önlemler aldığını, çalışma barışının daha kolay sağlanmasına yönelik vaz ettiği temel prensipler ayrıntılı olarak incelenmektedir.Araştırmamız bir giriş ve üç ayrı bölümden oluşmaktadır. Giriş kısmında tezin sınırları, amaç ve yöntemine yer verilmiştir. İşçinin hak ve sorumluluklarını araştırmadan önce bilinmesi gereken ilk esas, toplumu oluşturan fertlere- insan olmaları vasfıyla- İslam dininin verdiği değer ve önemdir. Bu gayeyle çalışmamızın birinci bölümünde işçinin her şeyden önce insan olma sıfatıyla temel hak ve hürriyetlerine değinilmiştir. Ayrıca İş hukukunun teorik yapısı ve temel kavramları da bu bölümde ana çizgileriyle açıklanmıştır.İkinci bölümde, İş hukukunun doğuşu, gelişimi ve başlıca iktisadi- sosyal sistemlerin çözümleri, onların temel mantıkları ve ana ilkeleri ele alındıktan sonra, üçüncü bölümde hizmet akdinin hukuki boyutu ana hatlarıyla işlenmiş, dördüncü bölümde ise, İslam Fıkhı'nda işçinin hak ve sorumlulukları İslam dininin iki temel kaynağı olan Kur'an ve Sünnet ışığında genişçe ele alınmıştır. Yine Hz. Peygamberin, Kur'an-ı kerim'in çalışma hayatı ve prensipleri ile ilgili ayetleri kendi hayatına nasıl uygulandığını, bu alanda doğruluk, güvenilir olma, adaleti uygulama ve sözleriyle davranışları arasında çelişki bulunmama gibi çalışma hayatının olmazsa olmazları olan iş ahlâkına dikkat çekilmiştir."
