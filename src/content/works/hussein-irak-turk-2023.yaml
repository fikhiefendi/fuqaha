abstract: "Toplumu oluşturan en küçük yapı taşı olarak ifade edilen aile, evlilikler yoluyla kurulmaktadır. Kurulan bu evlilikler çeşitli sebeplerde de bozulabilmektedir. Evlilik bağının ortadan kalmasının bir sebebi boşanmalardır. Evli çiftler çeşitli sebeplerle evliliklerine son verebilmektedir. Toplumdan topluma değişiklik gösteren hukuk kuralları evlenme ve boşanma içinde geçerlidir. Bazı toplumlarda boşanma serbest olurken bazı toplumlarda boşanma kavramına yer verilmemektedir. Bunlara ek olarak bazı toplumlarda ise boşanma bir sebebe ve hâkim hükmüne bağlanmıştır. Kanun tarafından öngörülmüş olan sebeplerle evli çiftler boşanma davası açabilmektedir. Ancak boşanma hâkim kararıyla gerçekleşmektedir. İnsanlık tarihi kadar eski olduğu kabul edilen boşanma kavramı tarihsel süreç içerisinde değişiklik gösterdiği görülmektedir. Bu değişikliklerde toplum geleneklerinin ve toplumların dini inançlarının oldukça önemli katkıları olmuştur. Dolayısıyla her toplumda boşanmaların gerçekleşme biçimleri farklılık göstermektedir. Çalışmanın amacı Türk Hukukunda ve Irak Hukukunda boşanma sebeplerini ortaya koyarak, karşılaştırmasını yapmaktadır. Bu bağlamda çalışmada öncelikle Türk ve Irak Hukukunda yer alan boşanma sebeplerine ve boşanma sonrası eşler i.in ortaya çıkan sonuçlara yer verilmektedir. Daha sonra bu iki hukuk içinde boşanmaya yönelik görüşler ve benimsedikleri boşanma ilkeleri açıklanmaktadır. Sonuç olarak ise kaynağını İsviçre Hukukundan alan Türk Hukuku ile kaynağını İslam Hukukundan alan Irak Hukukunda boşanma sebepleri, benimsedikleri boşanma ilkeleri ve boşanmanın meydana getirdiği sonuçlar karşılaştırılmaktadır. Bu karşılaştırma sonucunda Irak ve Türk Hukukunda benzerlikler olduğu gibi farklılıklarda bulunmaktadır. En önemli farklılık kadın ve erkeğe yönelik farklı uygulamalardır. İki hukukta boşanma görülmektedir. Ancak Türk Hukukunda boşanma bir sebebe ve hâkim hükmüne dayanmaktadır. Irak hukukunda ise yine hâkim kararına dayanmakla birlikte koca herhangi bir sebep göstermeden boşanabilme hakkına sahiptir. Buna ek olarak Türk Hukukuna göre kadın ve erkek sadece bir evlilik yapabilirken, Irak Hukukunda erkek dört kadınla evlenebilmektedir."
