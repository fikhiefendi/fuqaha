abstract: "Bu çalışma, beşerî tıbbî ürün tanıtımının Türk hukukundaki idârî denetimini hem mer'î hukuk hem de İslâm hukuku perspektifinden karşılaştırmalı biçimde ele almaktadır. Söz konusu denetim, TİTCK ile Reklam Kurulu'ndan müteşekkil sui generis bir ikili yapı sergilemekte olup bu yapı Türk hukuku literatüründe müstakil bir incelemenin konusu yapılmamış bulunmaktadır; çalışma mezkûr boşluğu doldurmayı amaçlamaktadır. Çalışmada nitel hukukî analiz yöntemi benimsenmiş; birincil kaynak olarak yürürlükteki mevzûat ve yargı kararları, ikincil kaynak olarak ise yerli ve yabancı öğreti esas alınmıştır. Tez üç bölümden müteşekkildir: birinci bölümde beşerî tıbbî ürün tanıtımının hukukî çerçevesi, ikinci bölümde ihlâl türleri, yaptırımlar ve Reklam Kurulu'nun 2024-2025 dönemine ait kararları, üçüncü bölümde ise ilâç tanıtım faâliyetleri İslâm hukuku ilkeleri çerçevesinde incelenmiş; hekim-ilâç firması ilişkisinin fıkhî ve etik boyutları ortaya konulmuştur. Çalışmanın başlıca bulguları şunlardır: BTÜTFHY kapsamlı bir normatif çerçeve oluşturmakla birlikte dijital platform boşluğu ve yaptırımların muhâtabına ilişkin yasal dağınıklık yapısal zâfiyetler olarak öne çıkmaktadır. Reklam Kurulu kararları BTÜTFHY'nin kapsam dışında bıraktığı gri alanı gıda mevzuatı aracılığıyla doldurmakta; ancak yaptırımlara dâir tutarsızlıklar caydırıcılık işlevini zayıflatmaktadır. İslâm hukuku ilkeleri ile pozitif hukuk normları aynı amacı paylaşmakla birlikte aynı kuralları öngörmemekte; sedd-i zerîa başta olmak üzere pek çok ilke, pozitif hukuktan daha katı bir tutum sergilemektedir. Her iki perspektif nihâyetinde tek bir tespitte ittifak etmektedir: reçeteleme bağımsızlığının güvencesi bireysel vicdanda değil, kurumsal düzenlemede aranmalıdır."
