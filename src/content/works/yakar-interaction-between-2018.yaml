abstract: "Müslüman alimlerin veya İslami dini kurumların Müslüman bireylerin sorduğu sorulara cevaben verdiği, bağlayıcı olmayan, İslam hukuk hükümlerinin veya görüşlerinin (fetvalar), (geçmiş ya da şimdiki) İslam hukuk literatürünün en dinamik nev'ini temsil ettiği söylenebilir. Geleneksel olarak, ifta uygulaması Müslüman alimlerin bireysel yetki ve çabalarına dayanır. Bununla birlikte, yirminci yüzyılın başlarında ulusal ve uluslararası dini kurumların kurulmasından sonra, bu uygulama büyük ölçüde, fetva vermekle görevlendirilen belirli organların sorumluluğu haline gelmiştir. Suudi Arabistan'daki Dar al-İfta (İlmi Araştırma ve İfta Genel Başkanlığı) ve Türkiye'deki Diyanet (Diyanet İşleri Başkanlığı) yirminci yüzyılın somut ve seçkin fetva kurumları arasındadır. Bu çalışma, her iki kurum tarafından yürütülen ifta uygulamasına ve aynı zamanda bu iki farklı toplumdaki ifta uygulamasının gelişimine ve tatbikine duruma özgü bir ışık tutmaktadır. Bu tezin ana amaçlarından biri, iki kurumun ve yayınladıkları resmi fetvaların otoritesini, işlevini ve rolünü kendi ortamlarında tanımlamak ve tespit etmektir. Bu tez, söz konusu iki kurum tarafından verilen fetvaları, hangi İslam hukuk kavramlarına ve yöntemlerine başvurulduğunu tespit etmek amacıyla karşılaştırır. Ayrıca, bu araştırma, kurumların İslam hukukunun ana kaynaklarını nasıl yorumladıklarını ve bu kurumların farklı ve hatta taban tabana zıt İslami hukuki hükümlere ulaşma sürecini değerlendirir. Tez, bu iki dini modern kurumu inceleyerek ve onların İslam hukuk yorumlarına ve görüşlerine (fetvalar) odaklanarak İslam hukuk metodolojileri ve toplumsal gerçeklikler arasındaki dinamik ara bağlantıların ve karşılıklı etkileşimin anlaşılmasını sağlar. İslam hukukunun aktif boyutu, fetva mekanizmasının yeni düzenlemeler ve hükümler sağladığı, kültürel, yasal, siyasi ve sosyal bağlamlarda görünür bir şekilde ortaya konmaktadır. Bu çalışma, fikir farklılıklarının temel İslam hukuk kaynaklarından (Kuran ve Sünnet) kaynaklanmadığı, ancak bağlamsal unsurlar ve İslam hukuk metodolojileri arasındaki güçlü bağı örneklerle açıkladıktan sonra, fetvaların ortaya çıktığı farklı bağlamsal çevrelere kadar uzanabileceği yönündeki önerme üzerinde yoğunlaşır. Karşılaştırmalı bir çerçevede benzer konular üzerinde iki kurum tarafından yayınlanan fetvalar analiz edilirken, İslam hukuk metodolojileri ve onların uygulandıkları bağlamlar arasındaki karşılıklı etkileşim tetkik edilir. Bu nedenle, söz konusu iki kurum tarafından verilmiş olan güncel fetvaların bağlamsal ve metodolojik analizleri detaylı olarak takdim edilir. Konu ile ilgili dört kriter (hâkim mezhep mensubiyeti, hukuki sistemler, siyasi yapılar ve toplumsal varsayımlar/kültürel uygulamalar) belirledikten sonra, tez bu iki kurumun bahsedilen kriterlerin hangi noktalarında birleştiğini ve birbirinden ayrıldığını belirlemeye çalışır. Çalışma aynı zamanda, iki kurumun benzer konuları ele alırken farklı İslami hukuki kavramları ve ilkeleri nasıl kullandığını göstermek için kurumlar tarafından yayınlanmış fetvalardan yararlanır. Son olarak, bu tez, kurumları (sosyal ve dini yorumlayıcılar olarak), İslam hukuk teori ve metodolojilerini (hukukun temel kaynağı olarak) ve fetvaların ortaya çıktığı sosyal bağlamı içeren fetva çalışmaları için gelişmiş bir karşılaştırmalı model tasarlamayı amaçlamaktadır. Bu açıklamalar ışığında, Dar al-İfta ve Diyanet'in analiz edilerek karşılaştırıldığı bu çalışmanın, akademik araştırmacıları, kurumsallaşmış ifta uygulamasını daha detaylı incelemeye ve modern dünyadaki görüş farklılıklarını araştırmaya teşvik edeceği tasavvur edilir. Kurumsallaşmış fetvalar, İslam hukukunun hızla değişen sosyo-kültürel, sosyo-yasal ve sosyo-politik durumlarla karşılaştığı noktalara önemli bir bakış açısı sağlayan asli temel materyaller olarak kabul edilebilir."
