abstract: "Mezhep âlimlerinin fıkhî içtihatları ve usul ile ilgili ortaya koydukları delillerin hem sistematik hem de işlevsel hale getirilmesinin sonucunda füru-i fıkıh ortaya çıkmıştır. Zamanla fıkıh alanında neşredilmiş olan bütün eserler füru-i fıkıh için geniş bir literatür zemini teşkil ettiği gibi sonraki dönemlerdeki fıkıh alanındaki fikir üretimlerini de derinden etkilemiştir. Fürû-i fıkıh ile ilgili te'lifatta bulunan müelliflerin fıkhî tercihlerinin tespit edilmesi, fıkıh meselelerinin çözümünde takip ettikleri yöntemlerin bilinmesiyle doğrudan ilişkilidir. Fıkıh alanında yeni bakış açılarının ortaya konulmasında bu yöntemlere vâkıf olmak ancak fıkıh eserlerinin dikkatlice incelenmesi ile gerçekleşebilmektedir. Bu amaçla, son yıllarda akademik çevrelerde âlimlerin fıkıh anlayışlarının ortaya konulmasına yönelik pek çok özgün çalışma yapılmaktadır. Bu anlayışla, VIII. (XIV.) yüzyılın fakihlerinden olan Yûsuf Erdebîlî'nin fıkıh alanında belirttiği özgün görüşlerini tespit edilmesi önem arz etmektedir. Erdebîlî'nin fıkhî görüşlerinin incelenmesi bu tez çalışmasının ana odak noktasını teşkil etmekte olup İslam fıkıh literatürüne katkı sağlamayı hedeflemektedir. Literatürdeki ana kaynaklarda Erdebîlî'nin doğum tarihi ile ilgili bilgi bulunmakla beraber vefatı konusunda ilgili tarih (ö. 779/1377 [?]) bazı kaynaklarda geçmektedir. Doğum yeri Azerbaycan coğrafyası olup Şâfiî geleneğini temsil etmektedir. Erdebîlî'nin fıkıh alanıyla ilgili meşhur eseri el-Envar li-a'mâli'l-ebrâr bu tez çalışmasının ana kaynaklarından birisi olup Erdebîlî'nin fıkhî yaklaşımlarını ne üzerinden bina ettiği hakkında bilgiler elde etmek mümkündür. Fıkhî düşüncesinin şekillenmesinde etkili olan unsurlar örneklerle işlenmiş olup, Şâfiî mezhebine muhalif ve muvafık görüşlerinin yanısıra zayıf olarak nitelendirdiği bazı yaklaşımlarındaki tercih kriterleri de ortaya konulmaya çalışılmıştır. Yûsuf Erdebîlî'nin fikhî bir kavrayışa sahip olduğu ve usulî delilleri toplumun örf ve ihtiyaçlarına göre okuyarak fürû meselelerdeki tercihlerini bu minvalde ortaya koyduğu gözlemlenmiştir."
