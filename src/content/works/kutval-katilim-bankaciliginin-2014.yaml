abstract: "İlk olarak 1963 yılında Mısırda başlatılan faizsiz bankacılık sistemi Türkiye'de 1983 yılında“Özel Finans Kurumları”(ÖFK) ismiyle organize olmuştur. 2005 yılında ülkemizde yapılan kanuni düzenlemeler sonrasında ismi“Katılım Bankacılığı”olarak değişen bu müesseseler, dünyada“İslami Bankacılık”olarak tanınmaktadır. Klasik bankacılık sistemine göre henüz çok yeni sayılabilecek olan katılım bankacılığı, 2008 krizinden sonra gerek finans çevrelerinin gerekse akademik çevrenin dikkatini üzerine çekmiştir. Bu konuda yapılan çalışmaların çoğu katılım bankacılığının nasıl gelişeceğini incelemeye yöneliktir. Bu çalışma, katılım bankacılığının gelişimini incelemenin yanı sıra, Türkiye'nin faizsiz finans alanında gelişimi için yapması gerekenleri ele almaktadır. Bu bağlamda“Türk Bankacılık Sistemi”,“Faizsiz Bankacılık Sistemi”ve“Dünyada ve Türkiye'de Katılım Bankacılığı”gibi konular çalışma içerisinde incelenecektir. Son bölümde ise konuyu test etme amaçlı anket çalışmasına yer verilecektir. Anket çalışmasında elde edilen bulgulardan bazıları; katılım bankalarının kendilerini tam olarak ifade edemedikleri (%73,84 oranında), fon kullandırma yöntemlerinin geliştirilmesi gerektiği (%86,49 oranında), katılım bankalarının nakit finansman sağlayabileceği (%53,5 oranında) şeklindedir."
