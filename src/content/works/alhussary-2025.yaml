abstract: "Bu tez, 2014–2024 döneminde Türkiye'deki katılım bankalarının performansı üzerindeki Basel III gerekliliklerinin etkisini incelemektedir. Çalışma, Basel III'ün birinci direğini; Sermaye Yeterliliği Oranı (CAR), Birinci Düzey Ortak Öz Sermaye (CET1), Kaldıraç Oranı (LR), Likidite Karşılama Oranı (LCR) ve bileşik uyum endeksini kapsayacak şekilde ele almaktadır. Bu düzenleyici göstergelerin katılım bankalarının performansını etkilediğine ilişkin temel hipotezi test etmek için beş banka seçilmiş ve yıllık finansal veriler panel çoklu regresyon yöntemiyle analiz edilmiştir. Bulgular, sermaye gerekliliklerinin (CAR ve CET1) performans üzerinde kritik belirleyiciler olduğunu göstermektedir; kârlılığı (ROAA ve ROAE) olumlu ve anlamlı biçimde artırmakta, operasyonel verimliliği yükseltmekte ve takipteki finansmanı azaltmaktadır; ancak CET1'in mevduata göre finansman oranı üzerindeki etkisi sınırlıdır. Bileşik Basel III uyum endeksi de kârlılık ve verimliliği artırırken kredi genişlemesini sınırlamakta ve kapsamlı düzenleyici uyumun istikrara katkısını vurgulamaktadır. Buna karşılık, Basel III kaldıraç oranı kârlılık veya verimlilik üzerinde anlamlı etkiye sahip değildir; ancak yüksek takipteki finansman ve artan mevduata göre finansman oranıyla ilişkilidir. Likidite (LCR) kârlılık veya verimlilik üzerinde anlamlı bir etki göstermemekle birlikte, finansman sağlarken mevduata bağımlılığı azaltmaktadır. Banka büyüklüğü sınırlı ve değişken etkiler gösterirken, GSYH herhangi bir anlamlı etki sunmamaktadır; bu da katılım bankalarının performansının makroekonomik koşullardan ziyade içsel özelliklerine bağlı olduğunu göstermektedir. Sonuç olarak, bulgular Basel III'ün katılım bankalarında istikrar, verimlilik ve risk yönetimini güçlendirmedeki kritik rolünü ortaya koymakta ve politika yapıcılar ile düzenleyiciler için sürdürülebilir büyümeyi destekleyecek uygulamalı öngörüler sunmaktadır."
