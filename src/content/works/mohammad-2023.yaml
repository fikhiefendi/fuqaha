abstract: "Tezin Özeti: Bu bilimsel tez, Tahir b. Ahmed b. Abdirreşid el-Buhari'nin (6. 542/1148)“Huläsatu'l-Fetava”adl eserinin kapsamlı bir incelemesini ve Hanefi fikhina dair“Kitabü's-Şehädät ve'd-Da'va”adlı bir eserin tahkikini içermektedir. Bu çalışmanın amacı, şehadet ve dava konusunu, anlamını, önemini ve bunlarla ilgili meseleleri öğrenmek ve bu alanda bilgi sahibi olmaktır. Tez, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde, şahitliklerin hükümlerinin bilinmesinin önemi, bu konunun neden seçildiği, hedefleri, çalışmada baz alınan yöntem, önceki çalışmalar, çalışmanın sınırları ve tez planı ele alınmıştır. Birinci bölüm, müellif ve el yazmasına dair bilgiler içermektedir. Bu bölümde de alt bölümler bulunmaktadır. Birinci alt bölüm: Müellifin Tanıtımı, Ikinci alt bölüm: Kitabın Tanıtımı, Üçüncü alt bölüm: Nüshaların Tanımı ve Tahkikat Metodu 34 NOTERLIGI MZA BURAK DUMAN İkinci bölümü, metnin tahkiki için ayırdım.Bu bölümde, jubkik ilminin alimlerinin kurallarına uygun olarak tahkik ettim."
