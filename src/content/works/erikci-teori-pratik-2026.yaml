abstract: "İslâm ilim geleneğinde nassın anlaşılması ve hükme bağlanması süreci, dilbilimsel verilerle hukukî normların kesiştiği hassas bir zeminde yürütülmüştür. Bu zeminin dikkat çekici unsurlarından birini bağlama göre değişkenlik gösteren 'hurûfu'l-meânî' oluşturmaktadır. Nahivcilerin vaz'î kurallarla teorik bir çerçeve çizdiği, fakihlerin ise istinbat metotlarıyla amelî bir gâye güttüğü bu alanda, teori ile pratik arasındaki ilişkinin mahiyetini ortaya koymak bu çalışmanın temel amacıdır. Bu amaç doğrultusunda, ahkâm âyetlerinde fakihlerin harflere yüklediği anlamların, nahiv literatüründe sunulan teorik anlam yelpazesiyle örtüştüğü ve ondan ayrıştığı noktalar analiz edilmiştir. Araştırmanın ana problemi, fakihlerin hurûfu'l-meânîye yükledikleri anlamların, nahiv ilminin sunduğu teorik çerçeveyle ne ölçüde örtüştüğü ve pratik ihtiyaçların bu anlamlandırma sürecini nasıl şekillendirdiğidir. Bu bağlamda“Fakihlerin lafız ve vâkıayı dikkate alarak geliştirdikleri yorumlar, salt dilbilimsel verilerle uyumlu mudur?”ve“Fakihler, ahkâm âyetlerinde nahiv sınırlarını aşarak literatürde yer almayan yeni anlamlar keşfetmişler midir?”sorularına cevap aranmıştır. Araştırmanın kapsamını ahkâm âyetlerinde yer alan hurûfu'l-meânî unsurları, nahiv analizleri ve bunlara dayalı fıkhî hükümler oluşturmaktadır. Çalışmada nitel araştırma tekniklerinden doküman analizi ve literatür taraması yöntemleri kullanılmıştır. Dört mezhebin görüşleri esas alınarak yürütülen üç aşamalı eleme süreci neticesinde 90 âyet ve 124 kullanım tespit edilmiş; bu veriler İ'râbu'l-Kur'ân ve Ahkâmu'l-Kur'ân literatürü ışığında tetkik edilmiştir. Araştırma sonucunda, hurûfu'l-meânî eksenli tartışmaların %75'inin teorik düzeyde kaldığı, ancak %25'lik kritik bir dilimde dilbilimsel tercihlerin fıkhî hükmü doğrudan şekillendirdiği tespit edilmiştir. Fakihlerin genelde nahiv teorisine sadık kaldıkları, ancak hükme ilişkin başka veriler bulunduğunda harfe nahiv âlimlerinin zikretmediği anlamlar yükledikleri görülmüştür. Bu bağlamda fıkıh usulünün dil ilimlerini sadece kullanan değil, bilhassa hurûfu'l-meânî özelinde dilbilime katkı sunan bir disiplin olduğu sonucuna ulaşılmıştır."
