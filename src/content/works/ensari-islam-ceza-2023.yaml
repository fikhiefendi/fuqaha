abstract: "Cezalar bazı toplumlarda ilahî kanunlarla, bazı toplumlarda ise beşerî kanunlarla düzenlenmiştir. Tezimizde ilahî kökenli İslâm ceza hukuku ile beşerî kökenli Türk ceza hukuku mukayese edilmiştir. Çalışmamız, üç tür mukayeseyi konu edinmiştir. Çalışmamızda her iki hukukun aslî-tali kaynakları mukayese edilmiştir. Çalışmamızda her iki hukuktaki suç-ceza kavramları incelenmiş, inceleme sonucunda ittifak edilen ve ihtilaf edilen noktalar belirlenmiştir. Son olarak tezimizde had cezaları İslâm ceza hukuku ile Türk ceza hukuku açısından incelenmiştir. Çalışmamızda izlenen yöntem şu şekildedir: Çalışmamızın tüm bölümlerinde öncelikle kavramların sözlük ve terim anlamları verilmiştir. Birinci ve ikinci bölümde konuların ve kavramların tanımları verilmiş, İslâm ceza ile Türk ceza hukukundaki yeri belirlenmek sureti ile mukayese yoluna gidilmiştir. Üçüncü bölümde ise her bir had ile ilişkili kavramların tanımları verilmiştir, her bir had cezasının dayandığı deliller açıklanmıştır. Haddin unsurları ve haddin cezaları mezheplerin görüşleri ışığında incelenmiştir. Hadler ile alakalı kavramların Türk ceza hukukundaki karşılıkları tespit edilmiştir. İki hukuk kıyaslanmak sureti ile ittifak ve ihtilaf edilen noktalar tespit edilmiş ve değerlendirmelerde bulunulmuştur. Çalışma yapılırken İslâm hukuku ile ilgili klasik eserlerden istifade edilmiş, kimi zaman tez ve makalelere müracaat edilmiş, kimi zaman günümüz araştırmacılarının kaynaklarına başvurmak sureti ile İslâm hukukunun meselelere bakış açısı ortaya konulmaya çalışılmıştır. Türk ceza hukuku ile ilgili olarak Anayasa, Türk Ceza Kanunu, Medeni Kanun gibi konu ile alakalı kanunlardan ve ceza hukukçularının kitaplarından, konuyla ilgili tezlerden, bilimsel makalelerden istifade etmek sureti ile Türk ceza hukukunun konu ile alakalı görüşü aktarılmıştır. Daha sonra her iki hukuk birbiri ile kıyaslanmıştır. Bu kıyaslama sonucunda; İslâm ceza hukukundaki hükümlerin Türk ceza hukukundaki hükümlere nazaran daha âdil, geniş görüşlü ve daha caydırıcı olduğu sonucuna varılmıştır."
