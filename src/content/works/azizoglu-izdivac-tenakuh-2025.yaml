abstract: "Osmanlı Devleti 19. yüzyılda uzun süren savaşlar, göçler, malî buhran ve nüfusun azalması gibi problemlerle karşı karşıya gelmiştir. Evliliklerdeki aşırı masraflar da bu dönemde hem halkın hem de merkezin gündeminde olmuştur. Düğünlerdeki israf evlenmelerin azalmasına sebep olarak görüldüğü için bu merasimlerdeki bazı uygulamalar yasaklanmış veya kısıtlanmıştır. Tez çalışmamız olan“İzdivâc ve Tenâküh Mâddesi Hakkında Tenbihâtı Hâvî İlânnâme”evliliklerin kolaylaştırılması için yapılan hukuki düzenlemelerden biridir. Araştırmamızın ilk bölümünde dönemin tarihî gelişmelerine kısaca değinilmiş, ardından evlilikler ile ilgili düzenlemelerden örnekler verilmiştir. İkinci bölümde ise ilânnâmenin yayımlanma süreci, metni ve muhtevası hakkında genel bilgi verilmiştir. İlânnâmede düğün sürecinde yer alan düğün yemeğinden çeyiz malzemelerine kadar birçok konuya değinilmiştir. Ağırlık ve düğünlerde hediye vermeye yasaklamalar getirilmiş ve mehrin miktarı da halkın maddi gücüne göre tespit edilmiştir. İlânnâmede yer alan düzenlemeler fıkıh ilmi açısından değerlendirilmiştir. Tezin son kısmında, ilânnâmenin ne zamana kadar hüküm sürdüğü araştırılmış, günümüz evlilikleriyle genel bir karşılaştırılması yapılmış ve çözüm arayışlarından bahsedilmiştir."
