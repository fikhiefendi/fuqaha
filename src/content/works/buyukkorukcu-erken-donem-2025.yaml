abstract: "Hanefî mezhebinde ukûbât bahislerinde incelenen mesâil genel hatlarıyla had, kısas-diyet ve tazîr olarak taksim edilir. Miktarı nas ile belirlenmeyen ve aynı zamanda velâyet sahibinin takdir yetkisine havale edilen tazîre dair hicri ikinci asırdan günümüze canlı ve zengin olduğu kadar değişime ve genişlemeye müsait bir fıkıh edebiyatı vardır. Mezhebin erken dönemindeki tazîr telakkisi süreç içerisinde bazı değişiklikler geçirmiştir. Başlangıçta darb ve hapis olarak uygulanan tazîr cezası, ilerleyen süreçte mahiyet değiştirerek katl/ölüm cezası olarak dahi uygulanan bir ceza kategorisi hüvviyeti kazanmıştır. Çalışmamızda öncelikle erken dönem Hanefî mezhebi furû fıkıh kaynakları çerçevesinde tazîr mesâiline odaklanılmış, sonrasında bu mesâilin mahiyeti ve husususiyetleri ile günümüzdeki tazîr algısı arasındaki farklılıklara dikkat çekilmiştir. Bu sûretle erken dönem Hanefî tazîr tasavvurunun alâmetifârikaları üzerinden bir hâsıla ortaya konulmaya çalışılmıştır."
