abstract: "Kişisel statüdeki bilgisizliğin nikâh ve boşanma üzerindeki etkisi: Karşılaştırmalı Fıkhî bir inceleme“ konusu ele alınmıştır. Bu konu, İslam fıkhının birçok bölümünde dallanan detaylarıyla oldukça hassas bir mesele olup, çağdaş teknolojik gelişmeler ve modern uygulamalar ışığında daha da karmaşık bir hâl almaktadır. Bu çalışmanın amacı, nikâh ve boşanma akitlerinde ortaya çıkabilecek cehalet (bilgisizlik) türlerini açıklamak, bunun fıkhî etkilerini belirlemek ve bu akitlerin sürekliliği üzerindeki etkilerini ortaya koymaktır. Ayrıca cehaletin evlilik haklarına yansımalarını, hangi durumlarda akdi geçersiz kılacak ölçüde olduğu ve bu durumların günümüz şartlarına nasıl yansıdığını incelemek amaçlanmıştır. Bu doğrultuda çalışma, fıkıh âlimlerinin metinlerini takip eden istikraî (tümevarımsal) bir yöntem izlemiş; bu metinlerin analizi yapılarak farklı görüşlerin dayandığı gerekçeler ortaya konmuş ve cehaletin nikâh ve talak (boşama) hükümleri üzerindeki etkileri mukayeseli olarak değerlendirilmiştir. Elde edilen görüşler, günümüz uygulamalarıyla ilişkilendirilerek incelenmiştir. Çalışmada ulaşılan başlıca sonuçlar şunlardır: Cehalet, esas itibariyle, nikâh ve boşanma akitlerinde ihtilafa sebep olan etkenlerden biridir ve fıkıh âlimleri, bağlayıcı akitlerde – ki nikâh akdi de bunlardan biridir – aşırı cehaleti (cehalet-i fahiha) oy birliğiyle yasaklamışlardır. Bu bağlamda, nikâh akdindeki cehalet; akdin lafzı, tarafları, mehir, şartlar, velayet ve şahitlik gibi unsurlarla ilgili olabilir. Boşanma konusundaki cehalet ise – lafzı, ric'at (boşandıktan sonra dönme) ve buna bağlı hükümler bakımından – nikâhtakinden daha tehlikelidir. Zira bu durum doğrudan akdin devamlılığını ve tarafların haklarını etkilemektedir. Fıkıh âlimlerinin, cehaletin akit üzerindeki etkisini belirlerken başvurduğu temel kaide ise şudur: ”İhtilafa yol açan her şey, çoğunlukla yasaktır.\" Bu çerçevede örf (gelenek) ve zaruret (ihtiyaç) gibi hususlar da göz önünde bulundurulmuştur. Ayrıca çalışma, günümüzde karşılaşılan ve yeni içtihadî değerlendirmeler gerektiren çağdaş cehalet türlerine de dikkat çekmiştir."
