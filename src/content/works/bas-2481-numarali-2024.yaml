abstract: "Çalışmaya konu olan 2481 A/25 Numaralı Bursa Şeriye Sicili Defteri 1518, 1519, 1520 yıllarında Bursa'daki mahkeme kayıtlarını ihtiva etmektedir. Çalışma, XVI. yüzyılda Bursa'nın sosyal, siyasi, idari, hukuki ekonomik ve ticari konularını barındırması sebebiyle birinci elden kaynaklardan yararlanarak bilgi edinmemize olanak sağlamıştır. Bu çalışma bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde kuruluşundan XVI. yüzyıla kadar Bursa, hakkında bilgi verilmiştir. Birinci bölümde, şer'iyye sicilleri ve Osmanlı şer'i mahkemelerinin işleyişi hakkında bilgi verildikten sonra Bursa mahkemesinde yer alan görevlilere ve 2481 A/25 Numaralı Bursa Şer'iyye Sicili Defterinin özelliklerine yer verilmiştir. Bölümün sonunda defterdeki belge türlerine değinilmiştir. İkinci bölümde, 2481 A/25 Numaralı Bursa Şer'iyye Sicili Defterinin muhtevası, sosyal hayat ve hukuk uygulamaları, iktisadi hayat, merkez-taşra arası ilişkiler ve diğer konular başlıkları altında değerlendirilmiştir. Üçüncü ve son bölümde ise defterin transkripsiyon metni ile özetleri, defterde yer alan kayıtlardan istifade edilerek oluşturulan Tablo çalışmaları ile defterde geçen yer adları ve eser isimleri indekslenmiş, yapılan çalışmada araştırma ve inceleme kolaylığı sağlanmıştır."
