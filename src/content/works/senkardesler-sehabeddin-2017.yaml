abstract: "Şehâbeddin Karâfî, (VII./XIII.) asırda Mısır'da yaşamış bir Mâlikî fıkıh bilginidir. Mezhebinin doğu ve batıdaki ekollerinin fürû-i fıkıh görüşlerini bir araya getiren Karâfî, aynı zamanda kendisinden önceki mezhep birikimini geleceğe taşıma misyonunu üstlenmiş ve bu başarısı nedeniyle Mâlikî mezhebinde imam olarak kabul edilmiştir. Ancak Karâfî daha ziyade fıkıh usûlü ilmine yaptığı katkılarla şöhret bulmuştur. O, usûlde kimi zaman geleneksel söylemin dışına çıkmış ve önceden kesin bilgi ifade ettiği kabul edilen bazı hususları tartışmaya açmıştır. Keza usûl konularında daha önce benzeri görülmemiş açılımlar gerçekleştirmiştir. Hz. Peygamber'in tasarruflarının tasnif edilmesi ve bunun yol açacağı sonuçlar konusunda yaptığı açıklamalar, fıkhın genel ilkelerini oluşturan kavaid ve bunlar arasındaki farklar üzerine müstakil bir eser (el-Furûk) telifi ve ictihadında maslahata ayırdığı yer bunlar arasında en dikkat çekici olanlarıdır. Karâfî'nin maslahat konusu ve fıkıh usulünün temel delillerinden sünnet, icmâ ve kıyas hakkındaki görüşleriyle sınırlandırılan bu çalışma; bu büyük fakîhin hukuk düşüncesine ve fıkıh tarihindeki yerine ışık tutmayı hedeflemektedir."
