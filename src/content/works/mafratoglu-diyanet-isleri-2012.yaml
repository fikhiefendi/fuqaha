abstract: "Bu çalışma Din İşleri Yüksek Kurulu'nun 1965 sonrası genel kurul düzeyinde ele alıp hükme bağladığı kararları dayandığı şer'î deliller açısından incelemeyi amaçlamaktadır. Araştırma bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusuna, amacına ve yöntemine değinilmektedir. Birinci bölümde Kurul'u tanıtmak amacıyla onun yapısı, görevleri ve çalışma esasları hakkında bilgi verilmektedir. İkinci bölüm fetvâ kavramı ekseninde işlenmiş olup günümüzde ?İftâ Makamı? konumunda olan Kurul'un almış olduğu kararların daha iyi anlaşılabilmesini amaçlamaktadır. Üçüncü bölüm inceleme konusu yaptığımız Kurul kararlarını hüküm istinbatında kullanılan aslî ve fer'î deliller açısından ele almakta ve Kurul'un hükme varmada bu delilleri ne ölçüde kullandığını belirlemeye odaklanmaktadır.Araştırmanın sonuç bölümünde Kurul'un karar verirken izlediği yöntem üzerinde durulmakta ve hüküm istinbatında en çok kullanılan delillerin belirlenmesi ve elde edilen verilerin değerlendirilmesi yapılmaktadır."
