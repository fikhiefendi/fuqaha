abstract: "Sigorta ve sigortacılık sistemi, özellikle Akdeniz merkezli ticaretin gelişmesiyle Avrupa'da gelişmeye başlamış, İngiltere'de sanayi devrimine denk gelen dönemde ise istatistik yöntemlerin de kullanılmasıyla sistematik bir uygulama haline gelmiştir. Buna karşılık İslam toplumlarında ise 19. yüzyıla kadar sigortanın işlevini zekât, vakıf, Beyt-ül Mal, lonca gibi müesseseler görmüştür. Ancak özellikle 20. yüzyılın ikinci yarısından itibaren ekonomik ve sosyal hayatın değişimi ile artık bu müesseseler neredeyse tamamen işlevini kaybetmiş, sigortanın temin ettiği güven ortamına olan ihtiyaç iyice artmıştır. 1960'lardan itibaren İslam dünyasında fıkhi boyutlarıyla yoğun bir şekilde tartışılan sigorta konusunda ihtiyaçlara cevap verebilecek uygun çıkış yolları aranmıştır. Tekafül sigortası, temelinde karşılıklı kefaletin olduğu bir modeldir. Bu model geleneksel sigortaya alternatif İslami bir seçenek olarak sunulmuş ve kabul görmesinden itibaren de hızla gelişmiştir. Sudan, Malezya gibi ülkelerin teorik öncülüğünü yaptığı bu model, günümüzde İslam ülkelerinde olduğu kadar Batılı ülkelerde de uygulanan alternatif bir model haline gelmiştir. Bu çalışmada öncelikle sigorta kavramı, kavramsal kökleri ve tarihçesi, İslam fıkhı açısından tartışılmış, daha sonra ise sigortacılığın Dünyadaki ve Türkiye'deki durumu incelenmiştir. Sigortanın ekonomideki ve fıkıhtaki yeri tartışıldıktan sonra fıkıh açısından tartışmalı bulunan sigortaya alternatif olarak geliştirilen tekafül sigortası anlatılmıştır."
