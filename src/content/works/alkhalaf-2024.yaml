abstract: "Çalışmada Halep şehrinde yürürlükte olan ve insanların uzun yıllardan beri bildiği Rehine sözleşmesi ele alınmakta olup, ve bu çalışmada, Rehine sözleşmesinin tanımı, uygulanabilir şekil ve şekillerinin açıklanması ve buna ilişkin sözleşmelerin bilinmesi, Çalışmada ayrıca Rehine sözleşmesinin İslam şeriat'in hükümlerinde caiz olarak adlandırılan diğer sözleşmelerin hükümleri ve biçimleri aracılığıyla hukuki açıdan uyarlanması analiz edilmiş, ayrıca bunun hukuki kavramı ve sadakat satışı gibi diğer benzer sözleşmelerden farkı da açıklanmıştır, Bu çalışmanın önemi, bu tür sözleşmelerin yayılmasının etkilerini tahmin ederek, bunları düzeltmeye çalışmak, Çalışma,aşağıdakiler de dahil olmak üzere birçok sonuç üretti: İpotek sözleşmesinin şeriat hukukuna uyarlanması yoluyla caiz olması ve İslam hukukunda diğer caiz sözleşmelerin esasları arasına yerleştirilmesi, ve Rehine sözleşmesi, taraflardan birinin satışa ilişkin sözünü söylemesi ve iradesinin bu yönde olması durumunda, ipotek satışıdır, ve kira bedeli, taraflar arasında başka bir sözleşmede bulunuyorsa ve herhangi bir danışıklı dövüş veya kayırmacılık yoksa, sözleşme caizdir, ve Rehine sözleşmesinde ipotek hükümlerinin uygulanması, onu geçersiz bir sözleşme haline getirir, Çalışmada ayrıca Rehine sözleşmesi hükümlerinin ihtilafları ve bilgisizliği önleyecek şekilde şeriat hükümlerine uygun olarak düzenlenmesi ve açıklığa kavuşturulması konusunda kanunun ve Fetva Kurumunun müdahale etmesi gerektiği önerildi, şehirde hakim olan geleneği dikkate alarak."
