abstract: "ÖZET İSLAM BANKALARINDA ŞER'İ DENETİM YÖNETİMİ (AFGANISTAN ÖRNEĞİ) Sharifullah İBRAHİMİ Doktora, İslam İktisaddı ve Hukuku Tez Danışmanı: Doç. Dr. Ashraf Mohammad Dawaba Haziran, 2020 - 267 + i – xv Sayfa Tamamen Şeriat'a uygun bir bankacılık sistemi için düzeltici önlemler önermek amacıyla gerçekliği ile ilke ve standartlarının uygulanmasının tespitini amaçlayan bu araştırmanın ana teması Afganistan İslam Bankalarındaki Şeriat Denetiminin Yönetimidir. Şeriat yönetiminin bu bankalardaki sorunları, zorlukları ve zayıflıkları tespit edilerek ele alınmaya çalışılmıştır. Bulgular temelinde, İslam bankalarına tüm bileşenlerini dahil etmek ve bunları modernize etmek için Şeriat Denetiminin Yönetimi için kapsamlı bir öneride bulunulmuştur. Araştırmada, Afganistan'daki İslam bankalarının gelişmesi ve ardından bankacılık sistemindeki değişimler yoluyla tarihsel yaklaşım metodolojisi takip edilmektedir. Çalışmada ayrıca, bunun için teorik çerçeveyi oluşturmak amacıyla Arapça ve yabancı kaynaklar için kütüphane araştırması yöntemini içeren tanımlayıcı analitik yaklaşım da takip edilmiştir. Çalışmada, İslam bankalarının yönetim sisteminde tüm paydaşların dikkate alması gereken birçok zayıflığın olduğu sonucuna varılmıştır. Bu nedenle, tüm bileşenleri kapsayan Şeriat'a uyumlu bir yönetim sisteminin kurulmasında sırasıyla yerel yasa ve yönetmeliklerin yanı sıra AAOIFI standartlarını ve IFSB ilkelerini sıkı bir şekilde takip etmek gerekmektedir. Bu çalışmanın sonuçlarının İslam bankalarında Şeriat denetiminin kurumsal yönetim uygulayıcıları, müşteriler ve merkez bankası ve diğer ilgili paydaşlar dahil olmak üzere finansal düzenleyiciler için faydalı olması beklenmektedir."
