abstract: "Dönemin önde gelen Hanefî âlimlerinden biri olan Bedruddîn Aynî; hadisçi, tarihçi ve dilci olduğu kadar aynı zamanda çok önemli bir fakihtir. Ömründe iki defa Hanefî başkadılığı da yapmış olan Aynî'nin fıkhî yönünün ortaya konması konumuzu önemli hale getirmektedir. Bu çalışmada Aynî'nin fıkıh anlayışını etkileyen kırılma noktalarını, onun hangi çevreden etkilendiğini, fıkıhçılığında öne çıkan husûsiyetleri, Hanefî fıkhında hangi konumda kabul edildiğini, öne çıkan bazı görüşlerini ve bu görüşlerinde rol oynayan temel saikleri tespit etmeyi amaçladık. Sonuç olarak Aynî, Mısır'da aldığı hadis eğitiminden dolayı muhaddis Hanefi fakihler arasında kabul edilmiştir. Hadisçi olması, onun fıkıh anlayışının bu yönde gelişmesini sağlamıştır. Hatta bazen hadislerden dolayı mezhebe muhalefet bile etmiştir. Aynî, Hanefî mezhebinde önemli bir fakih olup kendisine birçok meselede atıfta bulunulmuştur. Bunun yanında kendisinden sonraki Hanefi fakihlerini de etkilemiştir. Anahtar Sözcükler Bedruddîn Aynî, Hadisle İstidlâl, Tabakât-ı Fukahâ, Tercih, Memlükler."
