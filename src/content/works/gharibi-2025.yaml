abstract: "Küçük ve orta ölçekli işletmeler (KOBİ'ler), ekonomik büyümenin temel dinamiklerinden biridir. Özellikle gelişmekte olan ülkelerde işsizlikle mücadele ve kalkınmayı teşvik etmek amacıyla bu işletmelerin desteklenmesi ekonomik ve sosyal bir öncelik haline gelmiştir. Katar'daki KOBİ'ler, büyümelerini ve sürdürülebilirliklerini engelleyen finansman zorluklarıyla karşı karşıyadır. Bu nedenle, geleneksel finansman kaynaklarından farklı, bu işletmelerin doğasına uygun alternatif finansman çözümlerinin, özellikle İslami finansman yöntemlerinin araştırılması gerekmektedir. Çalışma, Katar'daki İslami bankaların KOBİ'ler için finansman mekanizmalarını geliştirmeyi ve rekabet güçlerini artırmayı amaçlamaktadır. Araştırma, tanımlayıcı ve analitik yöntem kullanılarak gerçekleştirilmiştir. Veriler, Katar'daki İslami bankalarla çalışan 60 KOBİ'den anket yoluyla toplanmıştır. Sonuçlar, katılımcıların çoğunluğunun İslami bankaların çalışanlarıyla etkileşimlerinden ve murabaha oranlarından memnun olduklarını göstermiştir. Ancak mevcut finansman mekanizmalarının KOBİ'ler için uygun olmadığı, ödeme yöntemleri ve teminat gereklilikleri açısından çeşitli zorluklarla karşılaşıldığı belirlenmiştir. Çalışma, mevcut finansman mekanizmalarının gözden geçirilmesi ve KOBİ'lerin ihtiyaçlarına uygun hale getirilmesi, İslami finansman ürünlerine erişimlerinin artırılması ve hükümet destekli finansman programlarının başlatılması gerektiğini önermektedir. Ayrıca, bu işletmelerin faaliyetlerini sürdürülebilir kalkınma hedefleriyle uyumlu hale getirecek düzenlemeler yapılmalı, kamu ve özel sektör iş birliğiyle ortak finansman programları oluşturulmalıdır. Bu öneriler, ekonomik, sosyal ve çevresel açıdan sürdürülebilir getirilerin sağlanmasına katkı sunacaktır."
