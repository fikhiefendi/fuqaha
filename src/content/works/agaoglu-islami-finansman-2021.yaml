abstract: "Küresel finans ve ekonomik sistemde yaşanan ve süreklilik arz eden kriz ve sıkıntılar sistemin köklü bir ıslah ve güncellemeye ihtiyacını göstermektedir. Bu bağlamda Bir bütüncül olarak İslami finans geniş finansman araçları ve iş modelleri ile tartışılan alternatifler arasında yer almaktadır. İslami finansman araçlarının reel ekonomiye ve finansal istikrara teorik olarak olumlu katkılar sunması alternatif olma yönünde konumunu güçlendiriyor. Son küresel krizde İslami finans kuruluşlarının konvansiyonel müesseslere kıyasla göreceli olarak gösterdikleri olumlu performans dikkat çekmektedir. Bu performans finans ve akademi çevrelerinin dikkatini çekmiştir. Ülkemiz açısından bakıldığımızda git gide artan finansman ihtiyacı, günden güne artan borçlanma maliyeti ve zorlaşan kredi koşulları bizi alternatif üretmeye ve finansman seçeneklerimiz genişletmeye zorlamaktadır. Ayrıca dünyada yaşanan toplumsal değişimler, sosyal sarsıntılar ve sınırları aşan sorunlar bu arayışları daha da önemli kılmıştır. Ancak İslami finansın inanç temelli olması ve nispeten daha az esneklik göstermesi sürekli değişen toplumlara ayak uydurmakta kısıtlı kalmasına neden olmaktadır. Aynı zamanda İslami finans müesseselerinin konvansiyonel müesseselere rekabet etmeye çalışması ve oradaki ürünleri İslami finans çerçevesine uyarlaması farklılıklarını yok ederek alternatif olma iddialarını zedelemektedir."
