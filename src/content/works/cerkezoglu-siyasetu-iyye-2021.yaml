abstract: "ÖZET SİYASETÜ'Ş-ŞER'İYYE BAĞLAMINDA MERCÜH GÖRÜŞÜ ALMAK KARŞILAŞTIRMALİ FIKIH ARAŞTIRMA Islam Ahmed Mohamed ZAYED Yüksek Lisans, Temel İslam Bilimleri Tez danışmanı: Dr. Öğr. Üyesi. MAGOMEDBASIR GASANOV Mayıs, 2021 - 161 Sayfa + xii Sayfa. Elimizdeki bu Usulü Fıkıh araştırması, mercuh görüş ile fetva vermenin önemi ve İslam siyasi fıkhında kendisine duyulan ihtiyaç boyutundan bahsetmektedir. Zira mercuh görüşler her zaman amelsiz kalmaz; zayıflık mertebesinden kuvvet mertebesine götüren gereksinimlerin bulunması durumunda bazen amel edilmesi tercih edilir hale gelir. Böylece tercih edilmeme durumu tercih edilmeye dönüşür. Ben de bu tür görüşlerin mahiyet, bölüm, koşul ve amel etme kurallarını belirledim. Ayrıca müçtehitleri mercuh görüşle fetva vermeye sevk eden; maslahata riayet, zaruret, örf, netice ve tedbir gibi en önemli sebeplerini dile getirdim. Teklifi hükmün uygulanması sırasında vaz'i hükmü de harekete geçirerek kaynak ve uygulamayı bir araya getirdim. Zira bu tasarrufları daha disiplinli hale getirmektedir. Araştırmamızda bir gereksinime bağlı olarak mercuh görüşün racih olanın önüne geçtiği bazı şeri siyasi model ve uygulamaları örnek olarak getirdim. Bu örnekler aynı zamanda İslam fıkhının esnekliğini ve yenilenebilir olduğunu göstermesi açısından önemlidir. Böylece Müslüman yönetici ve siyaset adamı, siyasi davranışları sırasında kendi tercihiyle değil de darda kaldığında, mercuh görüş de olsa şeri tasarruf dairesi içerisinde kalabilmektedir. Öte yandan kendisine fıkhi ve siyasi davranışlarda geniş ve kapsayıcı bir bakış açısı sağlamaktadır. Çalışmamız dört bölümden oluşmaktadır. Önsöz niteliğinde olan birinci bölümde araştırma konusu, önemi, öz değeri, alanı, içeriği, temel problemleri, teorileri, hedefi, araştırma yöntemi ve geçmiş araştırmalar gibi konuları inceledim. Kaynak bölümünden ibaret olan ikinci bölüm ise iki konudan oluşmaktadır. Birinci konuda araştırma kavramları tarif edilirken, ikinci konuda ise şeri siyasetin temelleri, gereksinimleri ve görevleri incelenmiştir. Üçüncü bölüm de iki konudan oluşmaktadır. Birinci konuda racih ve mercuh görüş ifadelerinin anlamları ve mercuh görüşün bölümleri açıklanmış, usuli bakış açısına göre amel edilmesinin hükmü ele alınmıştır. İkinci konuda ise mercuh görüş ile amel etmenin koşul ve kuralları ve bu ameli gerektiren en önemli gereksinimler değerlendirilmiştir. Dördüncü bölümde ise şeri siyasette mercuh görüşlerin tercih edildiği bazı uygulama örneklerine yer verilmiştir. Araştırmamız en öne çıkan sonuç ve tavsiyelerle son bulmuştur."
