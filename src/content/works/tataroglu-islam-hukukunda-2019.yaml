abstract: "İslâm hukukunda evlenmenin alt ve üst yaş sınırlarının belirlenmesinde net bir çözüm söz konusu değildir. Bu nedenle İslâm Hukukunda bu konuda çeşitli farklı görüş-lerin olması makûl karşılanabilir. Ancak kanaatımca konunun sosyal ve kültürel yönü ağır bastığından, meselenin, değişen zamanın ve toplumun, sosyal, ahlaki ve yasal değerlerine uygun olarak yeniden değerlendirilmesi de bir okadar makûl görülmelidir. Yüce Kitabımız Kur'an-i Kerimde ( Nisâ, 6 )“evlenme çağı”adında bir gerçek-tek bahsedilmektedir. Bununla evlilik için Yüce Yaradıcı tarafından belli bir alt yaş sını-rının belirlenmiş olduğu anlaşılmaktadır. En güzel ahlâki hükümleri ihtiva eden İslâm Dini açısından bu dikkate alınması gereken hassas bir konudur. İslâm Hukukunda yaşla bir ilgilerinin olmadığı halde hukuki karışıklığı önlemek amacıyla temyîz ve rüşt için yaş sınırları belirlenmiştir. Ayni şey bir ehliyet konusu olan ve çok tartışmalara neden olan küçüklerin evlilik meselesi içinde yapılmalıdır. Bu anlamda hukuki çalışmalar İslâm medeniyetleri içerisinde yer yer yapılmaya çalışılmıştır. Çalışmaların önemlisini, Osmanlı devletinin medeni kanunlarında görmekte-yiz. Bu mesele üzerine yapılan çalışmalar, İslâm Dininin mükemmelliğini gösteren, önem-li adımlardandır."
