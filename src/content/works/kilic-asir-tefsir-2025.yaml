abstract: "Bu tez, ilk üç asır tefsir literatürünü sözlük bilgisi ve furûk disiplinleri açısından incelemektedir. Çalışmaya dahil edilen örneklemlerin kelime anlamları tespit edilmiş ve benzer lafızlar arasındaki nüanslar ortaya konulmuştur. Tefsir-sözlükbilim etkileşiminin incelenmesinin hedeflendiği bu tezde ilk üç asırdaki sözlük birikimi, Taberî'nin (ö. 310/923) tefsiri dahil on dört eser ve Taberî sonrasında iki eserde karşılaştırmalı olarak ele alınmaktadır. İki bölümden oluşan tezin ilk bölümünde sözlük bilgisi ve furûk kavramları ile bunların tefsirle olan ilişkisi incelenmiştir. Tezin ikinci bölümünde ise Fatihâ Sûresi ve Bakara Sûresi'nin ilk beş ayeti temsil kabiliyeti yüksek tefsirlerde sözlük bilgisi ve furûk açısından mukayeseli olarak ele alınmıştır. Çalışmada sonuç olarak ilk üç asır tefsirlerinin sözlük bilgisi açısından genel anlamda zayıf kaldığı, Taberî'nin onlardan kısmen beslenerek ama özgün katkılar yaparak önemli bir dönüm noktası teşkil ettiği görülmüştür."
