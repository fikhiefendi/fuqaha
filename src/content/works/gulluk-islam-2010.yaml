abstract: "Fıkıh, hayatın her alanında nasıl yaşanması ve hareket edilmesi gerektiğiyle ilgili yollar gösteren, sınırlama ve düzenlemeler getiren bir bilim dalıdır. Bir iletişim ve eğlence aracı olan sinema hakkında, İslam'ın ve İslam hukukunun kendine ait özel bir bakış açısının olduğu bir hakikattir. Bu hakikatin boyutlarının incelenmesi, araştırılması ve ortaya çıkarılması büyük önem arz etmektedir.Sinema filmleri ve televizyon dizileri, İslam medeniyet tasavvuru ve fıkhın verileri ışığında ele alınıp teorik olarak yeniden gözden geçirilmiştir. Araştırmamızın birinci bölümünde, sanat ve sinema, İslam tasavvuru açısından ele alınmıştır. Yine bu bölümde sinema fıkıh ilişkisi ve meşruiyet tartışmaları incelenmiştir. Bu bölümde, özellikle sinemada temsil, rol, oyun ve eğlence kavramları üzerinde durulmuştur. İkinci bölümde, yapım ve çekim aşamasında ortaya çıkan problem ve tartışmalar İslam hukukunun verileri açısından değerlendirilmiştir. Bu bölümde sinemada kadın konusuyla, sinemada sözlü ve fiili tasarruflar konusu, fıkıh perspektifi açısından ele alınmıştır. Son bölümde, İslam hukuku açısından sinema sanatının temel ilke ve prensipleri üzerinde durulmuştur. Bu prensiplerden, günümüzde çok tartışılan, mahremiyet kavramı irdelenmiştir."
