abstract: "İslam tarihinde gerek itikadî gerek fıkhî yönüyle temayüz etmiş birçok mezhep bulunmaktadır. Bu mezhepler çeşitli nedenlerle Sünnî ve Şiî ayrımını oluşturmuş ve bu ayrım zamanla belirgin ve dikkat çekici bir hâle gelmiştir. Araştırmanın konusu olan Caferî mezhebi ise Şiî fırkalarından sayılmakla birlikte, itikadî görüşlerinin yanısıra fıkhî yönüyle de önemli bir yere sahiptir. Bu araştırmada ise Caferî ve Hanefî mezhep fıkıhları mukayese edilerek İslam aile hukukunda önemli yere sahip olan talâk yani boşanama konusu ele alınmıştır. İki mehzebin bu konuda benzer ve farklı fikirleri mukayese edilerek araştırılmıştır. Mukayese edilirken mezheplere ait temel eserler tercih edilmiş ve onlardan faydalanılmıştır. Eserlerin talâk bölümlerinde muhâlea, zîhar, ilâ, liân, iddet, hidâne ve nafaka bahislerine yer verilmesi dikkate alınarak bu araştırmanın içeriği düzenlenmiştir. Sadece erkeğin boşaması anlamına gelen talâk ile sınırlandırılmamış, boşanmanın diğer türlerine ve kadının sahip olduğu boşama hakkına yani tefvîz-i talâka da yer verilmiştir. Araştırmanın ilk bölümünde Caferî ve Hanefî mezhepleri tarihi hakkında genel bilgiler verilmiştir ve ikinci bölümde evliliğe son verme şekilleri olan talâk, muhâlea, zîhar, ilâ ve liân incelenmiştir. Üçüncü ve son bölümde ise evliliğin sona ermesinin sonucu olan iddet, hidâne ve nafaka konuları mukayese edilmiştir. Elde edilen bulgular, iki mezhebin benzerliklerinin olduğunu ancak farklılıklarının da önemli bir yere sahip olduğunu göstermiştir."
