abstract: "Katılım ve Mevduat bankacılığı ile ilgili bu çalışma Sivas Cumhuriyet Üniversitesi Sosyal Bilimler Enstitüsü Muhasebe Finans Bankacılık bölümünde yüksek lisans tezi olarak hazırlanan ''Katılım ve Mevduat Bankalarının Farkındalık Düzeyinin Karşılaştırılması: İç Anadolu Bölgesinde Bir Araştırma'' konulu çalışmada kullanılmak üzere hazırlanmıştır. Bankacılık sektörünün Türkiye'deki tarihine bakıldığında iniş çıkışlarla dolu bir geçmiş söz konusudur. Banka kullanıcıları tarafından Konvansiyonel Bankacılık daha çok tercih ediliyor olsa da Faizsiz bankacılığın piyasadaki önemi gün geçtikçe artmaktadır. İlk kuruluş aşamasında Katılım bankacılığı şube ve kuruluş sayısı olarak yok denecek kadar azdır şu anda ise 5 tane Katılım Bankası Türkiye'de 30 yılı aşkın süredir faaliyet göstermektedir. Bu faaliyet süresince Katılım Bankacılığı sadece faiz hassasiyeti olan insanların tercihinden çıkmıştır. Artık sadece tutucu kesimin tercih ettiği bir banka algısından çıkmıştır. Türkiye dışındaki Faizsiz Bankaların ve Mevduat Bankalarının ne için tercih edildiğine dair birçok araştırma yapılmış olmasına rağmen Türkiye'deki Katılım ve Mevduat bankalarının ne için tercih edildiğine dair çalışma yok denecek kadar azdır. Katılım Bankacılığının İç Anadolu Bölgesinde araştırılmasının temel sebebi daha fazla muhafazakar müşteri portföyünden oluşmasıdır. İç Anadolu Bölgesindeki bir il ile Ege, Akdeniz vb. bölgesindeki iller arasında müşteri tercihi açısından farklılık gözlemlenebilmektedir. Bu gözlemin kaynak ve tespiti Bankacılık Düzenleme ve Denetleme Kurumu'nun resmi sitesinde Fintürk verilerine bakılarak net bir şekilde görülmektedir. Bu çalışmanın hedefi İç Anadolu Bölgesinde Katılım ve Mevduat Bankalarının ne için tercih edildiğine dair literatüre katkıda bulunmaktır. Aynı zamanda banka müşterilerinin katılım ve mevduat bankaları üzerindeki memnuniyet derecesi ölçülecektir. Bu amaçla: İç Anadolu Bölgesinin 13 ilindeki (Eskişehir, Çankırı, Ankara, Kırıkkale, Kırşehir, Konya, Aksaray, Nevşehir, Yozgat, Kayseri, Sivas, Niğde, Karaman) katılım bankasının müşterileri ve mevduat bankasının müşterileri arasından ana kütle seçilmiştir. Her il bazında nüfus sayımı yapılmış olup, 1068 kişiden oluşan ana kütle üzerinde anket tekniği uygulanarak veri toplanmıştır. Anket çalışmasının bir kısmı link üzerinden bir kısmı yüz yüze görüşülerek yapılmıştır ve araştırmada katılımcıların isimleri gizli tutulmuştur. Araştırma kapsamında toplanan veriler, sadece bilimsel amaçlar doğrultusunda kullanılacak olup araştırmanın dışında ya da başka bir araştırmada kullanılmamıştır. Toplanan veriler SPSS 22 programında değerlendirilmiştir."
