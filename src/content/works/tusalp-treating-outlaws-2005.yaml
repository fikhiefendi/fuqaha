abstract: "Bu çalışma 17. ve 18. yüzyıllarda verilen şeyhülislam fetvalarından yola çıkarakklasik dönem sonrası Osmanlı toplumunda var olan ?sapkınlık? durumlarını ve bunlarınhukuki alanda nasıl ele alındıklarını incelemektedir. Bu tezin bir amacı şeyhülislamfetvalarına konu olmuş, basit sosyal uyumsuzluklardan zamanında dini sapkınlıklaitham edilen vakalara uzanan çizgideki davranış biçimlerini sergilemektir. Bu çerçevedeyapılan çalışma sonucunda fetvaların ve bunları içeren fetva mecmularının Osmanlısosyal tarihi icin ne derece önemli birer kaynak oldukları bir kez daha vurgulanacaktır.Öte yandan, hukuki bir zemin olarak fetvahanenin, sadece danışma işlevi gören ikincilderecede yasal bir merci olmadığı, aksine Osmanlı toplumundaki eğilimleriyönlendirme ve kontrol etmede kullanılan kanuni ve ahlaki araçları/söylemleri üretenbir merkez olduğu iddia edilmektedir. Bu çalışmanın temelini oluşturan kaynaklarsırasıyla Fetava-yı Feyziye me'an-nukul, Fetava-yı Ali Efendi, Behçetü'-l fetava,Fetava-yı Abdurrahim, ve Neticetü'l-fetava me'an-nukul isimli şeyhülislamfetvalarından oluşan fetva mecmualarıdır."
