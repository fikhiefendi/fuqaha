abstract: "Alrujoubi, Adnan. İlgili muhasebe teknikleri açısından kurumsal yönetim ve risk yönetiminin tyürkiye'de islami bankalar ve geleneksel bankaların performans üzerine etkisi, Doktora Tezi, Ankara, 2021. Bu çalışmanın en temel amacı Türkiye'de İslami bankalar (İB) ile geleneksel bankaların (GB) performanslarını etkileyen değişkenler arasında regresyon analizi yaparak iki banka türü arasındaki korelasyonları belirlemektir. Çalışmanın diğer önemli amacı ise CAMELS modeli kullanmak sureti ile bu banka türlerinin performanslarını karşılaştırmaktır. Bu çalışmanın önemi, banka performanslarının çok geniş kapsamlı kitleleri etkiliyor olmasından kaynaklanmaktadır. Takip eden kısımda araştırmanın ana başlıkları yer almaktadır: 1) Kurumsal yönetişim (KY), risk yönetimi (RY) ile ilgili teorilerin çoğu, iyi KY ve RY uygulamak için fikir birliğine sahip olan ve performans üzerinde mükemmel faydalar sağlayacak olan ekonomik teorilerdir. 2) Türk bankacılık sisteminin temel sorunları bankacılık sektöründe yabancı sermayeye bağımlılık, likidite krizleri ve faiz oranlarının hükümet kurallarıyla değişmesi nedeniyle yerel para birimi enflasyonu olarak sıralanabilir. 3) IB ve GB'ler arasındaki temel farklılık faiz oranlarıdır. Bunun sebebi İslami mevzuatın kullanımıdır. Bu farklılığı ikame etmek için Kar-Zarar Paylaşım (KZP) araçları kullanılmaktadır. Bu nedenle, onları karşılaştırmamız halinde sonuçlarda farklılık beklenir. Çalışma verileri Türkiye Bankalar Birliği'nin internet sitesinden elde edilmiştir. Üç İslami banka ve 19 mevduat bankası çalışmaya dahil edilmiştir. Korelasyonları belirlemek için SPSS programı ve 2010-2017 yıllarına ait panel verileri kullanılmıştır. Tüm hipotezler kabul edildiğinde, IB'lerin performansının genel olarak daha sağlıklı olduğu gösterilmiştir, bu bulgular IB'lerin geleceğinin muadil GB'lere kıyasla hala sağlam bir proje umudu verdiğini düşündürmektedir."
