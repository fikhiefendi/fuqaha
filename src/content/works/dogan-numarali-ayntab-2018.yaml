abstract: "Şer'îyye sicilleri, Osmanlı Devleti'nde yargı yetkisine sahip olan kadılar tarafından verilmiş olan kararları, tuttukları zabıtları, idari, siyasi ve hukuki yazışmaları içeren vesikalardır. Siciller, ait olduğu şehrin eski yerleşim birimlerini, buradaki insanlara verilen lakapları, insanların birbiriyle olan ticari münasebetlerini, sosyal yaşamlarını, ekonomik durumlarını, hukuki münasebetlerini içermekte ve şer'î mahkemeler hakkında önemli bilgiler vermektedir. Belli bölgelere ait ayrı ayrı tutulan bu vesikalar Osmanlı tarihinin derinlemesine incelenmesi ve araştırılması açısından önemli kaynaklardır. Halep Vilayeti'ne bağlı bir sancak olan Ayntâb'a ait 174 tane şer'îyye sicili bulunmaktadır. Hicri 1129-1130 ve miladi 1717-1718 tarihli, 68 Numaralı Ayntâb Şer'îyye Sicili toplam 536 sayfadan oluşmaktadır. Bu çalışma, şer'îyye sicilinin ikinci yarısını oluşturan 178 sayfanın transkripsiyonu ve değerlendirmesini içermektedir. Tezin transkripsiyon bölümünde her belgenin üst kısmına sayfa numarası, belge numarası ve o belgenin konusu ve türü hakkında bilgi verilerek belgelerin daha pratik bir şekilde kullanılması ve tasnif edilmesi sağlanmıştır. Bu çalışma sonucunda XVIII. yüzyılın ilk çeyreğinde genelde Osmanlı özelde ise Ayntâb'ın içerisinde bulunduğu siyasi, iktisadi, fiziki ve kültürel ahval bir nebzede olsa aydınlatılmaya çalışıldı."
