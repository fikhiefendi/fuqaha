abstract: "Fıkıh ilminin önemli meselelerinden biri olan şahitlik, kişinin tanık olduğu bir konuyu mahkemede haber vermesi demektir. Bu tanıklığın geçerliliği, mezheplerce belirlenmiş birtakım niteliksel şartların yanı sıra şahit sayısı gibi niceliksel unsurlara da bağlıdır. Nicelik fıkhı bağlamında ele alınan bu çalışma, şahit sayısının yalnızca miktarla sınırlı bir mesele olmadığını, aynı zamanda adaletin sağlanması ve delillerin gücünü pekiştiren bir unsur olduğunu da ortaya koymaktadır. Şahit sayısı, İslâm hukukunda sıkça başvurulan edille-i şer'iyye ile temellendirilmiş bir kavram olup, hukuki süreçlerin sağlıklı işlemesi ve adaletin tesisi açısından büyük önem arz etmektedir. Çalışmada, şahit sayısının fıkıh usulü ve fürû-ı fıkıh alanındaki yeri, Kur'ân-ı Kerîm, sünnet, icmâ ve kıyas gibi şer'î deliller çerçevesinde değerlendirilmiştir. Ayrıca, şahit sayısının ispat yükümlülüğü ve hukuki süreçlerdeki güvenilirliğe katkısı vurgulanmış, bu bağlamda mezheplerin farklı görüşleri karşılaştırmalı olarak ortaya konulmuştur. Özellikle zina, kazf ve hırsızlık gibi ukūbât konularında ve nikâh, talâk, borçlanma ve vasiyet gibi muâmelât meselelerinde şahit sayısına ilişkin fıkhi hükümler incelenmiştir. Bu çerçevede, şahit sayısının belirlenmesi ve uygulanması, hem delil sistematiğinin hem de adaletin sağlanmasının anahtar unsurlarından biri olarak öne çıkmaktadır."
