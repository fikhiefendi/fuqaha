abstract: "Hiç kuşkusuz Sadruşşerî'anın“el-Vikaye Şerhi”hanefi fıkıh literatüründe çok önemli bir konuma sahiptir. Öyle ki Osmanlı Devleti döneminde başucu eğitim eserlerinden birisi olmuştur. Zira önemini mezhebin muteber metinlerinden birisi üzerine yazılan en meşhur şerh olmasından kazanmıştır. Fıkıh âlimleri,“el-Vikaye”adlı eseri öğrencilerine ezberletmek ve okutmakla yetinmemiş, eser üzerine birçok şerh ve haşiye çalışması yapmak üzere özel bir ilgi göstermişlerdir. Asırlardır söz konusu esere gösterilen bu büyük ilgiye ve kendisinden sonraki eserlere önemli ölçüde kaynaklık yapmış olmasına rağmen eser üzerine yapılan çok kıymetli onlarca şerh ve haşiye çalışmaları henüz elyazma kütüphanelerinde gün ışığına çıkarılmayı ve itinayla çalışılmayı beklemektedir. Zira ilim ehlinin, bu eser üzerine yapılan çalışmalardan fıkıh, hukuk, tarih ve sosyal bilimler alanlarında pek çok yönden istifade etmesi mümkündür. Bu nedenle Sadruşşerî'anın“el-Vikaye”adlı eseri üzerine yapılan haşiye çalışmalarını araştırmaya koyuldum. Bu araştırma sonucunda elliden fazla haşiye çalışması tespit ettim. Bunlar arasında hanefi mezhebine katkısı yönünden ayrıcalığı olan bir haşiye arayışına girdim. Tahkik ve tahlil etmek üzere Osmanlı Devleti âlimlerinden olan dönemin İznik müderrisi Muhyiddin Muhammed b. Ali el-Karabâğî'nin (942/1535)“Şerhu'l-Vikaye”üzerine kaleme aldığı önemli bir haşiyesine ulaştım. Söz konusu haşiyenin,“el-Vikaye”şerhinde karşılaşılan zor ve kapalı meseleleri çok yönlü, doyurucu ve kolay bir üslupla ele alışı ve mühim faydaları barındırmasıyla müellifi Karabâğî'nin fıkıh ilmine vukufiyeti yanında, nahiv, sarf, belagat, beyan ve mantık gibi alet ilimlerinde de derin bir birikime sahip olduğu görülmektedir. Onun bu çok yönlülüğü eseri bir yandan ilmi açılardan zenginleştirirken diğer yandan fıkıh öğrencilerine fıkıh tahsilinde karşılaştıkları zorlukları kolaylaştırmıştır. Ayrıca müellifimiz Karabâğî'nin bu haşiyenin yanısıra; fıkıh, tefsir, akide ve münazara gibi alanlarda kaleme aldığı başka şerh ve haşiye çalışmaları da bulunmaktadır. Dolayısıyla Osmanlıların altın çağında yaşamış olan müellifi tanıtmak, fıkıh düşüncesini ortaya koymak, hem de önemine binaen söz konusu haşiyeyi tahkik ve tahlil etmek, bu eserin ilim ve akademi dünyasına kazandırılmasını ve böylelikle onu daha ileri düzeyde incelemek isteyen araştırmacıların istifadesine sunulmasını sağlayacaktır."
