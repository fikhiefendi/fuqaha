abstract: "Yükselen teknolojik gelişmeler ve mobil cihazların yaygınlaşması, yaşantımızda önemli değişikliklere yol açarak dijitalleşmeyi hayatımızın her alanında vazgeçilmez bir unsur haline getirdi. Bu büyük değişim ve dijitalleşme, finans piyasalarını da büyük ölçüde etkiledi. Finansın teknolojiyle birleşmesinden doğan finansal teknolojilerin (fintek) gelecekte İslami finans dünyasında da belirgin bir rol oynayacağı bu çerçevede öngörülmektedir. Finans teknolojisini Şeriat prensipleriyle birleştiren ve küresel finansal ekosistemin hızla genişleyen bir bileşeni olan İslâmi Finans teknolojisi, finans sektöründe bir devrimci güç olarak öne çıkarak, teknolojiyi İslam'ın derin etik prensipleriyle bütünleştirerek artan finansal katılımı, ekonomik gelişmeyi ve etik ve ahlaki kurallara uygun birçok verimli, şeffaf, Şeriat uyumlu finansal çözümü vadetmektedir. Bu çalışma aynı zamanda İslâmi Finans Teknolojisinin kökenlerini, uygulamalarını ve düzenleyici yönetişimi ele almaktadır. Şeriat uyumlu dijital bankacılık, kitle fonlaması ve P2P kredi platformları gibi yenilikçi uygulamalarının yanı sıra, risk değerlendirmesi ve yatırım stratejileri için yapay zekâ ve makine öğrenme, İslâmi kripto paralar için blokzincir teknolojisi ve İslâmi sigorta ürünlerinin akışkan dağıtımı için ileri teknolojilerin entegrasyonunu vurgulamaktadır. Bu çalışma, dünya ve Türkiye fintek ekosisteminin gelişimi ve İslâmi finansa etkilerini analiz etmektedir. Türkiye'de fintek üzerine birçok araştırma yapılmış olmasına rağmen, İslâmi fintek alanında literatürde çok sınırlı sayıda çalışma bulunmaktadır. Bu çalışma, mevcut az sayıdaki araştırmaya katkıda bulunarak literatür zenginleştirmeyi hedefleyerek İslâmi fintek üzerine yeni bir kaynak sunmayı amaçlamaktadır. Bu tez çalışması, İslâmi Fintek alanındaki teknolojilerin ve uygulama alanlarının inceleyerek, dünya genelinde ve Türkiye'de sektörün durumu hakkında bilgi sunarak uluslararası danışmanlık firmalarının sektörle ilgili raporları, düzenlenen seminerlerden elde edilen veriler Türkiye fintek ekosistemi'nin gelişimi ve İslâmi finansa katkısını tetikleyen unsurlar konusunda bilgiler içermektedir. Bu noktada, İslâmi Fintek alanındaki gelişmeler detaylı bir şekilde açıklanıp sektördeki mevcut durumu değerlendirilirken özellikle Türkiye'nin bu alandaki rolünü daha geniş bir perspektiften incelenmektedir. Sonuç olarak İslâmi Finans ile Fintek'in yükselişinin küresel çapta dikkat çektiği ve özellikle faizsiz ve risk paylaşımı odaklı İslâmi finansın, geleneksel finansal yapıların değişiminde etkili olduğu görülmüştür. Fintek'in sağladığı inovasyon ve erişilebilirlik artışı, mobil bankacılık, dijital ödemeler ve yatırım platformları gibi uygulamalarla İslâmi finansın geniş kitlelere ulaşmasını sağlamış ve sürdürülebilir finansal çözümleri teşvik etmiştir. Ancak, bu gelişmelerin düzenlenmesi, denetlenmesi ve olası risklerin azaltılması için yeni ve esnek yaklaşımlara ihtiyaç vurgulanmıştır. Gelecekte, büyük veri, yapay zekâ, kuantum hesaplama gibi teknolojilerin Türkiye'nin İslâmi Fintek sektöründe daha etkin kullanılması gerektiği ve bu sektörün kurumsal ve sermaye piyasalarıyla uyum içinde ilerlemesi gerektiği belirlenmiştir. Ayrıca, devletlerin düzenleyici adımlarıyla finansal kuruluşların iş birliklerinin, İslâmi Fintek'in büyümesi ve istikrarı için kritik olduğu sonucuna varılmıştır."
