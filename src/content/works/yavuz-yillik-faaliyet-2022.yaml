abstract: "Faizsiz bankalar, İslam dininin temel kaynakları ve temel ilkeleri doğrultusunda fon sağlayan ve bu fonları kullandıran İslami finans sektörünün en önemli kuruluşlarıdır. Faizsiz bankacılık varlıklarının yıllar itibariyle arttığı dikkate alındığında bu bankaların paydaşlarının beklenti ve taleplerine ne ölçüde cevap vereceği de önem kazanmaktadır. İşletmeler faaliyet sonuçlarını, kurumsal raporlar aracılığıyla paydaşlarına sunmaktadır. Finansal raporlama, belirli bir tarihteki varlıkları, kaynakları ve özkaynakları gösteren bilanço (finansal durum tablosu), faaliyet sonuçlarını gösteren gelir tablosu (kâr veya zarar ve diğer kapsamlı gelir tablosu), nakit giriş ve çıkışlarını gösteren nakit akış tablosu (nakit akım tablosu) ve özkaynaklardaki değişimi gösteren özkaynak değişim tablosu gibi sadece finansal bilgileri içeren finansal tablolardan oluşmaktadır. Finansal raporlama, dünyada artan küreselleşme olgusu, finansal darboğazlar, sosyal, çevresel, ekonomik risklerin artması sonucu paydaşların bilgi ihtiyacını karşılamada yetersiz kalmış ve kurumsal raporlama anlayışı sürdürülebilirlik raporlamasına doğru evrilmiştir. Geniş paydaş grubunun bilgi ihtiyacını karşılamada; işletmelerin faaliyetlerinin çevresel, sosyal, yönetişimsel ve ekonomik faktörler üzerindeki etkisini ve bunlardan nasıl etkilendiğini gösteren sürdürülebilirlik raporlaması, raporlama anlayışında önemli bir unsur haline gelmiştir. Finansal raporlama, kurumsal raporlamaya finansal bilgiler açısından yaklaşırken sürdürülebilirlik raporlaması sürdürülebilirlik konularını içermektedir. Entegre raporlama ise, finansal ve finansal olmayan bilgileri tek bir rapor altında birleştirerek, kısa orta ve uzun vadede değerin nasıl yaratıldığı, yaratılan değerin nasıl korunduğu veya tüketildiği ile ilgili bilgi veren bütüncül bir kurumsal raporlama türüdür. Entegre Raporlama tek rapor olarak adlandırılsa da içerisinde finansal raporlama ve sürdürülebilirlik raporlaması bilgilerini içermektedir. Çalışmanın amacı; faizsiz bankacılık ve entegre raporlamanın incelenmesi, küresel faizsiz bankacılık sektöründe faaliyet gösteren faizsiz bankaların entegre raporlamadaki mevcut durumunu tespit etmektir. Bu amaçla öncelikle faizsiz bankacılığın teorik çerçevesi, faizsiz bankacılığın mevcut durumu ortaya konmaya çalışılmış; entegre raporlamanın teorik çerçevesi, entegre raporlama ile ilgili çerçeveler, entegre raporun güvencesi ve güvenilirliğine değinilmiş, entegre raporlamanın mevcut durumu incelenmiştir. Çalışmanın araştırma bölümünde ise faizsiz bankacılık sektöründe faaliyet gösteren faizsiz bankaların entegre raporlamadaki durumu 2020 yılına ait yıllık faaliyet raporları incelenerek tespit edilmeye çalışılmıştır. Araştırma evrenine dâhil edilen Türkiye ve çeşitli ülkelerde 76 faizsiz bankanın yıllık faaliyet raporu üzerinden yapılan içerik analizi sonucunda; faizsiz bankaların ortalama entegre rapor skorunun yaklaşık 0,55 (%55) ve 76 faizsiz bankanın %57'sini temsil eden 43 faizsiz bankanın entegre rapor skorunun 0,50 (%50) ve üzerinde olduğu sonucuna ulaşılmıştır."
