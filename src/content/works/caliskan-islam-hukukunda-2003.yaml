abstract: "ISLAM HUKUKUNDA HADLERDE GÖZETİLEN MASLAHATLAR ÖZET Bu çalışma, İslâm Ceza Hukuku sahasında kişi ve toplum hukukunu yakından ilgilendiren, Kitap ve Sünnet metinleriyle meşru kılınan had suçlarına karşı öngörülen cezaları ve bu cezaların konulusunda gözetilen amaç ve faydaları araştırmak üzere gerçekleştirildi. Cezaların hakimin takdirine bağlı olarak değiştirme yoluna gidilememesi, kölelik, hastalık, hamilelik ve özür gibi bazı hallerde hafifletilmeye gidilse de yerlerine alternatiflerinin konulamaması ve bütün için parçanın (toplum için ferdin) feda edilmesi, bu cezaların, toplumsal yapıyı bozulma ve kötülüklerden koruma amacına yönelik olan uygulamalar olduğunu göstermiştir. İlâhi kaynaklı İslâm Hukukunun insan tabiatının suça meyledebileceği ve zafiyetlerini bilmesi, Hz. Peygamber' in (sav) kişilerden cezaların mümkün mertebe kaldırılması konusundaki talepleri, bu hukuk sisteminin incelik ve insana merhamet yönünü göstermesi bakımından kayda değerdir."
