abstract: "Şer'iyye sicilleri Osmanlı Tarihi kaynakları arasında önemli bir yere sahiptir. Bu kaynaklar o dönem mahkemelerde verilen kararları ve tutulan kayıtları ihtiva etmektedir. Hukukî açıdan değerli olduğu kadar kültürel, ekonomik, ticarî, idarî, dinî ve sosyal hayat hakkında da somut veriler sunmaktadır. Bu sicilller köyler, mahalleler, kullanılan isim ve eşyalar, gıda maddeleri, hayvanlar, aile hayatı gibi birçok alanda bilgi vermektedir. 1311-1313 (1893-1895) yıllarını kapsayan 4 No'lu Niğde Şer'iyye Sicili'nde 470 adet belge bulunmaktadır. Araştırmada bu belgeler ışığında Aksaray'ın o dönemki durumu hakkında bilgi verilmeye çalışılmıştır. Çalışma giriş ve dört bölümden meydana gelmiştir. Giriş bölümünde Aksaray'ın tarihi ve şer'iyye sicillerinin önemi üzerinde durulmuş, 4 No'lu Niğde Şer'iyye Sicili tanıtılmıştır. Diğer dört bölümde ise Aksaray'ın sosyal, hukukî, ekonomik ve idarî tarihi hakkında tespitlerde bulunulmuştur."
