abstract: "Müşteri kavramı, modern pazarlamanın birinci aşaması olan kitlesel üretim ile müşteriden önce üretilen ürünün ön plan çıkması, ikinci aşaması ürünün önemini koruması ile birlikte müşteri önceliklerinin önem kazanmaya başlaması, üçüncü aşaması ürün geliştirmeden önce müşteri tercihlerinin dikkate alınarak müşteri ile uzun vadede birliktelik oluşturmasıdır. Dördüncü aşamada ise müşteri sadece mal veya ürün satılan bir birey olmaktan çıkarak pazarlama süreçlerinin içerisinde yer alan ve farklı deneyimleme yaşayan bir konum almıştır. Bu değişim İslami finans hizmeti veren bankalarda da görülmeye başlamış müşteri ile hem şube bankacılığı ve mobil banka hizmetlerinde başarılı bir deneyim oluşturmak için ürün geliştirme ve pazarlama süreçlerine dâhil edildiği uzun dönemli ve çok yönlü bir ilişki kurmaya başlamışlardır. Bu araştırmanın konusu Türkiye'de 2021 yılında faaliyet gösteren18-55 yaş aralığında ki katılım bankası mobil uygulama kullanan müşterilerin, müşteri deneyimini etkileyen faktörleri anlamak amacıyla, hizmet sektöründe müşteri deneyimini ölçmek için Klaus (2010) oluşturduğu literatürde güvenirlik ve geçerliliği kabul görmüş EXQUAL ölçeği kullanılarak anlamaya çalışılmıştır. Araştırma sonucunda yapılan istatistiksel analizler de normal dağılım gösteren ve iki grup mukayesesinde Student t testi, üç ve üzeri grubu mukayesesinde Anova testi kullanıldı. Gruplar arası farklılık olduğu durumlarda ise Bonferroni düzeltmesi tesit kullanıldı. Çalışma sonucunda EXQUAL ölçeğinin alt boyutları olan içsel huzur boyutu, sonuç odağı, karar anı ve ürün deneyimi boyutunun; cinsiyet, gelir durumu, mobil uygulama kullanım sıklığı, mobil uygulama kullanım amacı ve müşterisi olduğu bankaya göre incelendiğinde kullanıcıların deneyiminin oluşmasında alt boyutların farklılık gösterdiği görülmüştür."
