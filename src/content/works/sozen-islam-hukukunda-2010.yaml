abstract: "Bu çalışma İslam dininin en önemli esaslarından biri olan zekât ibadetinin bir kolu olan gayrimenkul malların zekâtı konusunu ele almaktadır. Bu konu İslam'ın en önemli esaslarından birini teşkil etmekle beraber en çok tartışılan konularından da başında gelmektedir.Tezimiz iki ana bölümden oluşmaktadır. Gayrimenkul malların zekâtını esas almakla beraber öncesinde zekâtın tüm yönlerini ele almaya çalıştık. Bundan dolayı da birinci bölümde zekât hakkında genel birtakım bilgiler verdik. Zekâtın nelerden ibaret olduğu, asıl gayesinin neler olduğunun ortaya çıkması açısından bu konuların zorunlu olduğunu düşünmekteyiz.İkinci bölümde ise asıl konumuz olan gayrimenkul malların zekâtı konusunu ele aldık. Burada özellikle günümüzde ortaya çıkan fabrika, ulaşım araçları, yük taşımacılığında kullanılan gayrimenkul mallar üzerinde genişçe durmaya ve hem klasik hem de modern kaynaklar ışığında çözüm bulmaya çalıştık."
