abstract: "Bu tez çalışmasının amacı, katılım model portföy endeksinde yer alan firmaların finansal risklerinin hesaplanmasıdır. Bu kapsamda araştırmanın örneklemini İslami kurallara göre faaliyet gösteren halka açık 13 şirketin dahil olduğu Katılım Endeksi firmaları oluşturmaktadır. Analizlerde ilgili firmaların 2016-2017 yılları arası günlük frekanstaki hisse senedi fiyat verileri kullanılmıştır. Analiz kapsamında öncelikle hisse senetlerine ilişkin tanımlayıcı istatistikler hesaplanmış, müteakiben katılım endeksine dahil firmaların hisse değerleri arasındaki korelasyon analiz edilmiş, son olarak regresyon analizi ile hisse senetlerinin sistematik riskleri hesaplanmıştır. Analiz sonuçları katılım endeksinin araştırmaya dahil edilen 13 hisse üzerinde istatistiksel açıdan anlamlı bir etkiye sahip olduğunu göstermektedir. Araştırma sonuçları, İslami Finans kapsamına giren varlıklara yatırım yapma eğiliminde olan yerli ve yabancı yatırımcılar için Katılım Endeksinin bir portföy çeşitlendirme aracı olarak kullanılabileceğini göstermektedir. Yüksek risk alan yatırımcılar tarafından beta katsayısı yüksek olan Emlak Konut, Ege Seramik, Erbosan, Ereğli Demir Çelik ve Kütahya Porselen gibi hisselere, yüksek riskten kaçınan yatırımcılar tarafından ise piyasa riski görece daha düşük olduğu sonucuna ulaşılan Akçansa, Albaraka Türk, Çemtaş, Nuh Çimento, Pınar Et ve Un, Pınar Süt, Selçuk Ecza ve Soda Sanayii gibi hisselere yatırım yapılabilir. Sonuç olarak, araştırma İslami Finans varlıklarına ilişkin sınırlı literatürü özellikle gelişmekte olan ülkeler açısından genişletmiş ve İslami Finansal varlıkların risk değerlerinin inceleyerek literatüre katkı yapmıştır."
