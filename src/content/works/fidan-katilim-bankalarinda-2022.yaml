abstract: "İslami Bankalar, ülkemizdeki adıyla Katılım Bankaları temelde faizsiz çalışma prensibi ile ön planı çıkarlar. Bu bankalar, gerçekleştirdiği ve gerçekleştirmeyi planladığı tüm faaliyetlerde İslami prensipleri rehber alırlar. İslami prensiplere aykırı bir hususun sisteme dâhil edilmesi bu sistemi çökertecektir. Bu sebeple, İslami finans kurumları tüm faaliyetlerinde İslami prensiplere sıkı sıkıya bağlı kalmalı ve faaliyetlerini uyumlaştırmalıdır. Çalışmamızda, ülkemizdeki katılım bankacılığı alanındaki faizsiz finans ilke ve standartlarına ilişkin gelişmeler ve düzenlemeler ortaya konulmuş, bu düzenlenmelere uyumu sağlayacak olan fonksiyonların gerekliliğine ve geliştirilmesine yönelik önerilerde bulunulmuş ve bu sayede literatüre katkı sağlamak amaçlanmıştır."
