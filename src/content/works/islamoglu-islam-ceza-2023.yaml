abstract: "İnsanın en değerli yönleri olan onur ve şeref gibi kişilik haklarına sözlü saldırı, bu saldırının kişi ve toplumlarda oluşturduğu travmatik etki ve sonuçlarını içeren“İslam Ceza Hukukunda Kazf (İffete İftira) Suçu ve Cezası ”konulu tezimizde suçun unsurları, cezası ve liân bölümlerine yer verilmiştir. Tezimizin giriş kısmında konunun önemi, amacı, yöntemi, sınırlandırılması ve kaynakların değerlendirilmesi konuları işlenmiştir. Giriş kısmının dışında çalışmamızı üç ana bölüm halinde şekillendirmeye çalışıldı. Birinci bölümde suç ve suç kavramının tanımı, Kur'an'da suç kavramına karşılık gelen kelimelerin kısa açıklamaları, cezanın tanımları, amacı ve cezanın tasnifi ile birlikte cezanın özellikleri bölümünü incelemeye tâbi tutuldu. İkinci bölümde kişilerin manevi şahsiyetlerinin korunması adına İslam hukukunun üzerinde titizlikle durduğu, kişilerin iffet ve onuruna saldırı niteliğinde olan ve had suçları arasında düzenlenen kazf suçunu ve cezasını inceleyerek bu suçun hukuki sonuçları ortaya konmaya çalışılmıştır. Üçüncü bölümde kazf suçunun eşler arasında gerçekleşmesi sonucunda cezai müeyyide olarak liân konusu işlenmiştir. Eşlerin, karşılıklı olarak iddialarını ispat veya suçsuz olduklarını beyan anlamında, lanetleşme (mülâane) yaparak kendilerini temize çıkarma hususu incelenmiş; mülâanenin evliliğe etkisi anlatılmıştır. Bu bölümler kapsamında, söz konusu iffete iftira suçunun, şahıs ve toplumlara verebileceği zararlar veya suçun önlenmesi sonucunda kişi ve kitlelerin korunması hususuna yeri geldikçe temas edilmiştir."
