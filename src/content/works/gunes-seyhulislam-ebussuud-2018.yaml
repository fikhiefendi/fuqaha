abstract: "Tarihsel süreçte Kelam ilmi farklı sistematik ekoller yoluyla gelişimini sürdürmüştür. Mutezile, Eş'arîlik ve Mâtürîdîlik farklı yorum yöntemleriyle kendi tarzlarını oluşturmuşlardır. Bu bağlamda kelam ilmi, bu ekoller vasıtasıyla belirli yöntem tarzlarıyla kendine has bir disiplin haline gelmiştir. Bu ekoller İslam düşünürleri vasıtasıyla yorumlarını zenginleştirmişler ve bu alanda belirli bir kültür oluşturmuşlardır. Bu kültürel atmosferde Ebussuûd Muhammed b. Muhammed el-İmâdî(1490-1574)'nin, İrşâdu'l-akli's-selîm ilâ mezâya'l-kitâbi'l-kerim isimli tefsirinden ve görüşlerine dair yapılan diğer çalışmalardan hareketle Kelâmî görüşlerini sunmayı amaçladık. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde Ebussuûd'un Ulûhiyet anlayışı; varlık, tevhid, yaratma, tenzih, sıfatlar meselesi ve istivâ anlayışı etrafında işlenmiştir. İkinci bölümde Nübüvvet ve Meâd konuları; vahiy, peygamber göndermenin imkanı, peygamberde bulunması gereken nitelikler, mucize ve keramet, Hz. Muhammed'(s.a.v.)'in peygamberliği, yeniden dirilme, kabir azabı, cennet ve cehennem, şefaat ve Allah'ın ahirette görülmesi şeklinde değerlendirilmiştir. Üçüncü bölümde ise Ebussuûd'un insan anlayışı; insanın yaratılışı, onun fiilleri, hidayet ve dalâlet, iman, rızık ve ecel konuları bağlamında ele alınmıştır. Ebussuûd'un kelam ilmine dair görüşlerini irdelerken onun kelam ekollerinden hangi yorum tarzını benimsediği ve hangi delilleri kullandığı da işlenmiştir. Bu bağlamda onun kelam düşünce tarihinde hangi mezhebi tavırla hareket ettiği ortaya konmuştur. Ayrıca onun; Mutezile, Eş'arîlik ve Mâtürîdîlik yorum yöntemlerinden hangisini benimsediği ve hangi açılardan diğerlerinden ayrıldığı konusu da irdelenmiştir."
