abstract: "Yargı yetkisine sahip olan kadıların vermiş oldukları kararları, tuttukları zabıtları, idarî, siyasî ve hukukî yazışmaları içeren tarihî vesikalar olan şer'iye sicilleri, XV. yüzyılın ikinci yarısıyla XX. yüzyılın ilk çeyreği arsındaki döneme ait Osmanlı tarihi ve kültürünün ilk elden kaynaklarıdır.Çalışmamızın temel kaynağı olan Kırşehir Şer'iye Sicilleri'nin mikrofilmleri, Ankara Milli Kütüphane'de bulunmaktadır. 17 Numaralı Şer'iye sicili Çiçek Dağı Şer'iye sicili olarak geçmektedir ama Çiçek Dağından ziyade tamamen Kırşehir'e özgü bir şer'iye sicili olup çalışmalarımızı Kırşehir üzerine yoğunlaştırmış bulunmaktayız. Sicili, Milli Kütüphane'den fotokopi yoluyla temin edilmiş olup her ne kadar H.1324-1326 tarihli Şer'iye sicili yazsa ise de incelediğimizde anlaşılmıştır ki (H.1324-1328 Miladi 1906-1910) yıllarını kapsamaktadır.Kırşehir Şer'iye Sicilinin Transkripsiyon ve Değerlendirilmesi adıyla günümüz harflerine çevrilmiş, değerlendirilmiş ve kaynakça taraması yapılmıştır. Ayrıca bütün belgeler konularına göre tasnif edilmiştir. Tezin sonunda yer alan ekler kısmında teze konu olan sicilin orijinali fotokopi ile çoğaltılarak bir nüsha halinde verilmiştir.Bütün bu düşünce ve çalışmalar sonucunda Kırşehir'in ve aynı zamanda Osmanlı Devleti'nin idari, içtimai, siyasi, askeri ve iktisadi tarihine ışık tutabilecek bilgiler elde edilmiştir."
