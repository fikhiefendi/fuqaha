abstract: "Bu çalışmada, günümüz modern finansal araçlarından“El Birliği Sistemi, Borsa ve Dijital Para”nın İslam Hukuku esaslarına göre uygunluğu incelenmiştir. Bu doğrultuda ne tür düzeltmeler yapılabileceği ve İslam hukukuna nasıl uygun hale getirilebileceğine dair çeşitli önerilere yer verilmiştir. Dünya'da olduğu gibi ülkemizde de yatırımcıların genel tercihlerinden olan borçlanma araçları piyasasında tahvil ve hazine bonoları faiz temelli olması dolayısıyla, bu yönde yatırıma izin verilmediği hususu İslam Hukukunda belirtilmiştir. Benzer şekilde, borsada hisse senetleri işlem gören bir şirketin faaliyet alanı İslam'ın haram kıldığı işlerle ilgiliyse, o şirketin hisse senetlerini almanın veya bu şirketin ortağı olmanın da İslam hukukuna uygun olmadığı açıklanmıştır. Ancak, faaliyetleri İslam hukukuna uygun, faizli işlem yapmayan, haram malların (içki, faiz, uyuşturucu, domuz eti vs.), ticaretini yapmaması durumunda ise bu şirketin hisse senetlerini almanın ve bu şirketin ortağı olmanın, İslam hukukuna uygun olabileceği aktarılmıştır. Ancak, borsada yine de spekülasyon, aldanma, manipülasyon vs. gibi durumlar söz konusu olabildiği için bazı uzmanların, borsadan uzak durulması gerektiği görüşünde bulunmaktadırlar. Bu tezde yapılan değerlendirmeler neticesinde İslam hukuku çerçevesinde faaliyetlerini sürdüren, ayrı bir borsanın kurulmasının uygun olduğu düşünülmektedir. Dijital para konusunda belirsizlik, aşırı dalgalanma, güvenlik açıkları ve otorite eksiklikleri gibi çeşitli sorunların mevcut olduğu gerekçesiyle bu tür para birimlerinin caiz olmadığına dair görüşler bulunmaktadır. Bununla birlikte, dijital paraların mevcut finansal sistemden daha güvenilir ve düşük maliyetli olabileceği yönünde görüş belirten bazı uzmanlar, belirli eksikliklerin (devlet otoritesinin sağlanması, dalgalanmanın kontrol altına alınması vb.) giderilmesi durumunda dijital paraların caiz olacağını ifade etmektedir. Tezimizin son araştırma konusu olan“El Birliği Sistemi”nde ise firmaların almış olduğu organizasyon ücreti ve katılım bankalarının haricinde diğer bankalarla da çalışması gibi bazı konuların sakıncalı olduğu ifade edilmiştir. Sıkıntıların çözüm bulması el birliği sistemini daha güvenli hale getirecektir."
