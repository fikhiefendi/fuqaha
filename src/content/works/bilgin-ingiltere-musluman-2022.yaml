abstract: "İngiltere aldığı dış göçlerle içerisinde Müslümanlar, Hindular, Yahudiler ve Sihler gibi farklı dini azınlık grupların yaşadığı, hukuki çoğulculuk anlayışının var olduğu Hıristiyan bir ülkedir. İngiltere içerdiği farklı dini gruplara 1996' daki Tahkim Yasası kapsamında dini uyuşmazlıklarının çözümü için bazı haklar tanımıştır. Bu yasa kapsamında kurulan ve İngiltere'deki Müslümanlar için önemli bir kurum olan Müslüman Tahkim Heyeti (MAT) Nuneaton 'da 2007 yılında kurulmuştur. Tezimde incelediğim kurum olan MAT, Anglo- Sakson Hukuku (Common law) ile İslam hukukunu mezceden senkretik bir hukuki iç yapıya sahiptir. İslam aile hukukunun formel ve informel uygulayıcılarından biri olan bu heyet sistemi, İngiltere'deki Müslümanların aile ve iş hukukuna dair davalarının çözümünde önemli bir role sahiptir. Bu tezde MAT 'ın evlilik, aile içi uyuşmazlıklar, boşanma, muhāleʿa ve hidane gibi arabuluculuk ve tahkime konu olabilen davaları ele alınacaktır. Ayrıca bildiride, MAT 'a başvuran Müslüm topluluğun diyani ve yasal sorunlarını çözerken başvurdukları metotlar ve yaklaşımlara değinilerek arabuluculuk ve tahkim pratiklerine de yer verilecektir."
