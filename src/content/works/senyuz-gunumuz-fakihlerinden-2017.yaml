abstract: "Halil Günenç, günümüzde ülkemizin ve tüm İslâm âleminin seçkin fakihlerindendir. Fıkıh alanında temayüz etmiş olsa da tefsir, hadis, akaid, sarf, nahiv, belagat, mantık gibi pek çok ilme vâkıftır. Suriye'de geleneksel medrese eğitimi aldıktan sonra ülkesine geri dönerek önce fahrî sonra Diyanet İşleri Başkanlığı'na bağlı olarak çeşitli hizmetlerde bulunmuştur. Haseki Eğitim Merkezi'nde yetiştirdiği öğrencilerinin bir kısmı Türkiye'nin hemen her şehrinde müftülük, vaizlik görevini üstlenmişken diğer bir kısmı da İlahiyat Fakültelerinde öğretim üyeliği yapmaktadır. Te'lif ettiği eserleri ve gece gündüz telefonla kendisine yöneltilen soruları en hızlı ve güvenilir şekilde cevaplandırması onun“Türkiye Müftüsü”olarak anılmasına vesile olmuştur. Halil Günenç ilerleyen yaşına ve sağlık sorunlarına rağmen irşad ve tedris faaliyetlerine devam etmektedir. Bu çalışmada Halil Günenç'in fıkhî görüşleri ve fetva yöntemi ile birlikte onun fıkhî görüşleri bağlamında klasik dönemde yapılan tartışmalara modern dönemdeki bakışın tespit edilmesi amaçlanmıştır."
