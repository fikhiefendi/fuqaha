abstract: "Araştırmamızda, Yusuf el- Karâdâvi'nin fıkıh ve fıkıh usûlünü tecdîd kavramıyla harmanlayarak mezheplerarası bir yaklaşımla kaleme aldığı“Fetavâ'l-muâsıra”adlı eserinde ele aldığı ibadetler hakkındaki fıkhi tercihleri esas alınmaktadır. Konular mezhep imamları, kadim ve muasır alimler ve son olarak Karâdâvi'nin tercihleri etrafında izah edilecektir. Konulardaki farklı görüşleri mukayeseli olarak incelemeyi hedeflemekteyiz. Bunun sonucunda fıkhi ayrılık ve çekişmelerin ana kaynağının nedenlerini de zikretmiş olacağız. Çalışmamızda eserin müellifi Yusuf el-Karâdâvî'nin konuyla ilgili tercihlere ulaşırken kullandığı metodolojiyi de tespit edeceğiz. Araştırmamız Karadâvi'nin hayatı, ilmi serencamı, fetvadaki metotlarını ele aldığımız giriş bölümü ile başlamaktadır. Akabinde bedeni ibadetlerdeki görüşleri birinci bölümde, mali- hem mali hem bedeni ibadetlerdeki görüşleri ise ikinci bölümümüzde ele alınacaktır. Birinci ve ikinci bölümde ele alınan fıkhi konularda önceliğimiz Karadâvî'nin hükme varırken kullandığı delilller ve tercihler olacaktır. Konu etraflıca izah edildikten sonra kadim alimlerimizin tercih ve delillleri zikredilecektir. Son olarak ise günümüz fıkıhçılarının görüşleri de ele alınarak zamanın değişmesine paralel hükümlerin değişme serüvenine de şahitlik etmiş olacağız. Yusuf el-Karâdâvi ilmi çalışmalarının yanısıra aktivistlik, öğretmenlik, vakıf temsilcilikleri yönleriyle de topluma ışık tutan bir fakih olmuştur. Fıkıh alanındaki tercihlerinin çoğunluğu kolaylık ilkesi ile İslam'ı daha büyük kitlelere sevdirerek tanıtmak ve fıkhî incelikleri öğretmek amacını taşımaktadır. Fıkhi konularda insanları mu'tedil olmaya davet etmiş ve fıkhî mezhep görüşleri arasında delil merkezli analizle en güçlü ve zamanın maslahatına en uygun olanının tercih edilmesi gerektiğini savunmuştur. İbadeti ilgilendiren hususlarda bütüncül ve her nevi görüşü sahih olması ve delilin kudreti şartı ile eserinde zikrederek delil göstermiştir. Karâdâvinin, mezhep alimleri ve hocalarının aksine görüşleri de mevcuttur. Çalışmamızda objektif olmak kaydıyla tenkit edilerek eleştiriye maruz kaldığı tercihlerini de ele alacağız.“el-Fetavâ'l-muâsıra”eseri birçok dile çevrilerek genç neslin rağbet ettiği bir kaynak haline gelmiştir."
