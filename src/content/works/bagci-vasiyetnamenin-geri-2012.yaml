abstract: "?Vasiyetnamenin Geri Alınması? başlıklı çalışmamızda; öncelikle konunun önemi açıklanmış, ardından konuya ilişkin eski yasal düzenlemeler Roma Hukukundan başlanarak incelenmiştir. Keza, İslam Hukukunun meseleyi ele alış tarzı da özet olarak verilmiştir.TMK 542 vd. hükümlerine göre vasiyetname 4 yoldan geri alınabilir:1) Saf geri alma vasiyetnamesi ile2) İlki ile çelişkili 2. vasiyetname ile3) Yok etmek ile4) Vasiyetnameye konu edilen malın sonradan sağlararası tasarrufa konu edilmesi ile.Vasiyetnamenin geri alınmasına ilişkin bu dört usul, Yargı kararları ve İsviçre ? Alman Hukuku ile karşılaştırmalı olarak incelenmiş; vasiyetnamenin geri alınmasının kısmi olabileceği gibi şarta bağlı da olabileceği ifade edilmiştir."
