abstract: "Bu tezin amacı teorideki İslam Hukuku ile pratikteki İslam Hukukunu karşılaştırmaktır. Temel kaynak olarak 1625-1650 yılları arasındaki Manisa Şer'iye Sicilleri ve klasik fıkıh literatürü kullanılmıştır.Giriş bölümünde tezin amacı, yöntemi, ele alınan dönemin genel karakteristiği ve sicil defterleri üzerine yapılmış önemli çalışmalar üzerinde durulmuştur.Birinci bölümde ise İslam ve Osmanlı hukukunda kaza ve kâdılık müessesesi ele alınmış, Osmanlı hukukuna etki eden temel fıkıh kaynakları tanıtılmıştır. Aynı zamanda bu bölümde Osmanlı hukukunun yapısı, mahkemelerin işleyişi ve şer'iye sicillerinin önemi vurgulanmıştır.İkinci bölümde Manisa Şer'iye Sicillerinde tespit edilen Aile hukuku uygulamaları, İslam aile hukuku prensiplerine göre irdelenmiş ve değerlendirilmiştir.Üçüncü ve son bölümde yine Manisa Şer'iye Sicilleri defterlerinde tespit edilen cezâ hukuku uygulamaları, İslam ceza hukukunun genel prensipleri çerçevesinde ele alınıp değerlendirilmiştir."
titleTranslation: {"en": "Judicial registers of Manisa in terms of Islamic Law implementations (1625-1650)"}
