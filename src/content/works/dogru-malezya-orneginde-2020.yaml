abstract: "İslam, aile kurumuna çok büyük önemler atfetmiş ve aile birliğinin dağılmasını önlemek için inananlara rehberlik etmiştir. Aile neredeyse tüm zamanlarda toplumun en temel birimi olarak kabul edilir. Toplumun temel yapı taşı olan aile kurumunu korumak da her bireyin görevidir. Bu durum çerçevesinde aile içi ihtilafların giderilmesi için toplum tarafından çeşitli çözüm yolları uygulamaya konmuştur. Toplum tarafından geleneksel olarak uygulanan çözüm yöntemleri uzun zaman sonra devlet eliyle de uygulanmaya başlanmıştır. Bu çalışmada aile içi ihtilafların çözüm yöntemlerinin başında yer alan arabuluculuk faaliyeti incelenmiştir. Aile arabuluculuğu uygulamalarının, meydana gelen aile uyuşmazlıkları ve boşanmalar üzerindeki olumlu etkileri tespit edilmeye çalışılmıştır. Çalışmanın birinci bölümünde arabuluculuk müessesesi İslam hukuku bağlamında tahkim usulü ile birlikte ele alınmış ve incelenmiştir. Çalışmanın bu bölümünde aile arabuluculuğu ve aile hakemliği arasındaki bağlantı da ortaya konmaya çalışılmıştır. İkinci bölümde arabulucu-hakemlik kurumunun aile uyuşmazlıkları bağlamında konumu işlenmiştir. Ayrıca yine bu bölümde aile uyuşmazlıkları ve boşanmalarda aile mahkemelerinin rolü ortaya konmaya çalışılmıştır. Çalışmanın son bölümünde ise etnik ve hukuki açıdan Türkiye'yle benzer özellikler taşıyan Malezya, arabulucu-hakemlik uygulamaları açısından incelenerek ülkemizde uygulanması beklenen aile arabuluculuğu için model önerisi getirilmeye çalışılmıştır."
