abstract: "Sukuk son dönemlerde yatırımcılar tarafından rağbet gören faizsiz bir yatırım aracıdır. Özellikle Körfez ülkeleri ve Malezya'da devlet veya özel girişimlerin tarafından finansman sağlamak amacıyla kullanılmaktadır. Sukuk Türkiye piyasasında Kira Sertifikaları olarak adlandırılmaktadır. Ülkemizde bu sertifikaların ihracı 2010 yılında Sermaye Piyasası Kurulu tarafından yayınlanan tebliğe istinaden gerçekleşmektedir. Türkiye'de sukuk piyasası oldukça yenidir. Sertifikalar Hazine Müsteşarlığı ve katılım bankaları tarafından çıkarılmaktadır. Fakat ilgili mevzuatın uluslararası standartlara uygun hale getirilmesi ve yatırımcıların bu konuda bilgilendirilmesi gerekmektedir. Kira sertifikalarıyla ilgili fıkhi tartışmalar da Türkiye'de hala devam etmektedir ve henüz konuyla ilgili ortak bir kanaate varılamamıştır. Çalışmamızda bütün bu konular üzerinde durulmaktadır."
