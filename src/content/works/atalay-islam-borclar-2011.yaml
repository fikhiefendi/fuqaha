abstract: "Trafik kazaları hem borçlar hem de ceza hukukunu ilgilendiren konulardandır. Konuyu İslam hukuku açısından tetkik ederken Türk borçlar ve ceza hukukuyla da mukayeselerde bulunduk. Trafik kazarlını haksız fiiller kapsamında ele almak gerekir. Bu fiilden doğan mesuliyetten bahsedebilmek için fiil, zarar ve illiyet bağının bulunması gerekir.İslam hukuku açısından bakıldığında trafik kazalarına cinayet ve tazminat hükümleri uygulanır. Trafik kazaları mal ve canı ilgilendirdiğinden bu fiil mübaşereten ve tesebbüben meydana gelmesine göre farklı sonuçlar doğurur. Burada şuna işaret etmek gerekir ki mala gelen zararların tazmini için kasıt unsuru aranmazken tesebbüp halinde kusur şartı aranmaktadır. Bedene gelen zararlarda ise hata ve kasıt ayrımı yapılmaktadır. Hataen meydana gelen trafik kazalarındaki ölüm ve yaralamalarda kusur oranlarına göre diyet, kasten meydana gelen kazalarda ise kısas söz konusudur. Fiilin kasıtla işlenmesinden dolayı buna kaza denemez ise de trafikte gerçekleştiği için böyle bir ifade kullanılmıştır.Konuyla ilgisinden dolayı şuna da işaret etmeliyiz ki usulüne uygun olarak yasama organınca çıkarılan trafik kurallarına uymak aynı zamanda dini bir vecibedir. Çünkü bu tür kuralların konulması ve ihlali durumunda cezalarının belirlenmesi zaman ve zeminin ihtiyacına göre yasama organının (ülü'l-emr) takdirine bırakılmıştır. Trafik sigortasını da bu çerçevede değerlendirmek gerekir."
