abstract: "Vicdani kanaat, yargılamayı yapmakla yetkilendirilmiş makamda bulunan kişi veya kişilerin, bakmakta oldukları davada bulunan delilleri değerlendirdikten sonra yaptığı yargılama faaliyeti sonucunda aklını rehber edinerek, hukuk kuralları çerçevesinden çıkmaksızın, vardığı kanaati ifade etmektedir. Yargılama makamında bulunan kişinin bakmakta olduğu olayda kanun metinlerini insanileştirip, hakkaniyete uygun bir şekilde karar vermesi gerekmektedir. Aksi durumda hukuk teknisyenliğinin ötesine geçmeyecek bir yargılamanın yapılmış olacağı açıktır. Bu çalışmada Türk ceza muhakemesi hukuku ile İslam ceza hukukunda hakimin vicdani kanaati, sınırları ve verilen karara etkisi karşılaştırmalı olarak ele alınmıştır. Vicdani kanaat, Türk ceza muhakemesi açısından delil serbestisinin benimsenmesi sebebiyle vazgeçilmez bir yere sahiptir. Ancak vicdani kanaatin sınırlarının belirlenmesinin güçlüğü, verilen kararın keyfi verilip verilmediği hususunda tartışmalara sebep olabilmektedir. İslam ceza hukuku açısından ise doğrudan bir karşılığı bulunmasa da dolaylı olarak karşımıza çıktığı görülmektedir. Çalışmamızda her iki hukuk sisteminde karar verme süreçleri, vicdani kanaatin nasıl oluştuğu, hangi esaslara dayanması gerektiği ve sınırları anlatılmıştır. Delillerin değerlendirilmesinde vicdani kanaatin tarihin her döneminde güncelliğini koruyan bir konu olması dolayısıyla bu konu üzerinde titizlikle çalışılması gerekmektedir. Konuyla ilgili olarak kaynak taraması yapılmıştır. Tarama sonucu elde edilen veriler analiz edilmiştir. Sonuç olarak Türk ceza muhakemesi hukukunda ve İslam ceza hukukunda deliller ve değerlendirilmesi ile vicdani kanaatin genel olarak karşılaştırması yapılmış ve hükme etkileri ayrıntılı olarak ele alınmıştır."
