abstract: "İslâm fıkhının temel kaynaklarını teşkil eden Kitap ve Sünnetin, bize bir dil yoluyla ulaşmış olması sebebiyle, lafzî istinbat metotları, fıkıh usulünde ayrıntılı olarak ele alınmış ve dilbilimi ilgilendiren birçok mesele fıkıh usulünün mevzusu haline gelmiştir. Fıkıh usulü eserlerinin bir kısmında ?el-Mebadiü'l-luğaviyye/ Lüğavi prensipler? başlığı altında ele alınan mevzulardan birisi de ?emir ve nehiy?dir. Dinî hükümlerin özünü teşkil ettiği ve Şâri'in maksadının anlaşılabilmesi büyük ölçüde emir ve nehiylerin delâlet ettiği anlamın kesinlik derecesinin bilinmesine bağlı olduğu için emir ve nehiy bahsi İslâm hukuk usûlünde önemli bir yere sahiptir. Bu nedenle, emir ve nehiyle alakalı birçok tartışma usûl âlimleri tarafından enine boyuna işlenmiş ve tezimizin konusunu oluşturan ?emir ve nehyin zıtlarına delâleti? meselesi de bu tartışmaların arasında yerini almıştır.Bir yüksek lisans tezi olarak hazırlanan bu çalışma bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde, emir ve nehiy hakkında genel bilgiler verilmiştir. İkinci bölümde ise, emir ve nehiy sîğalarının zıtlarına delâleti incelenmiştir. Bu bağlamda İslâm hukuk usulünde ?zıt? kavramına yüklenenen anlam ele alınmış; ayrıca mantık ve usûl-ü fıkh disiplinlerine göre delâlet kavramı hakkında genel bilgiler verilmiştir. Emir ve nehyin zıtlarına delâletiyle alakalı belli başlı usûli tartışmalar gerekçeleriyle birlikte tahlil edilmiş; problemin kelâmi ve lüğavi arkaplanları incelenmiş; emir ve nehyin zıtlarında gerektirdiği hükümlerle alakalı ihtilaflar ele alınmıştır. Bu bölümün sonunda, mevzunun mefhûmu'l-muhâlefe ile olan bağı mukayeseli olarak tahlil edilmeye çalışılmıştır."
