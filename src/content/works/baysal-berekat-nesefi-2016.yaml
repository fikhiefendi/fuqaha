abstract: "Ebu'l-Berekât en-Nesefî'nin Medâriku't-Tenzîl ve Hakâiku't-Te'vîl Adlı Eserinde Tefsir-Te'vîl İlişkisi Medârik gibi içinden türedikleri toplumların sosyal, psikolojik, ekonomik, tarihi ve antropolojik vakıasını tefsire taşıma kabiliyetini haiz ideolojik yanları ağır basan spesifik metinler, tefsir-te'vil ilişkisinin özgün örneklerini ihtiva eden dirayet türünde kaleme alınmış hususi metinlerdir. Medârik'i hususi kılan unsur ise yaslandığı epistemolojilerin çeşitliliğidir. Nitekim onda tefsir rivayetlerini istihdam eden nakil merkezli aklın yanı sıra analiz, sentez, soyutlama, kıyas gibi veri işleme yöntemlerini ustalıklı bir biçimde kullanan, kuşkulanan, sorgulayan, eleştiren ve gerektiğinde nassı tevil etmekten kaçınmayan başka bir aklın disiplinli ve uyumlu bir şekilde işlediğini görürüz. Bu akıl, kimi zaman kelâmî–fıkhî (beyânî) kimi zaman felsefî-mantıkî (burhânî) kimi zaman da imgelemci (irfânî) bir forma bürünür. Ancak bu bilgi türleri birbirlerinin alternatifi değil, bilakis diyalektik prensiplerle işleyen bütünlüklü bir yapının biri diğerinin yerine ikame edilemez, iç içe geçmiş, aynı kurucu metinleri açıklamak ve yorumlamak görevini üstlenen hayati parçaları mesabesindedirler. Bu sırada yazar, bütün bu görüngüleri belagat ilminin sağladığı yüksek edebi standartlarda ama okuru merkeze çekmeyi öngören bir aydın sorumluluğuyla sunmaya büyük bir özen gösterir."
