abstract: "Bu çalışmanın amacı, Irak Savaşının ardından Irak'ta ve bölge coğrafyasında görülen değişimi açıklamak ve anlamak için literatüre katkı sağlamaktır. Çalışma Irak Savaşıyla beraber Irak ve bölge coğrafyasında yaşanan radikalleşmenin bölge güvenliğine etkilerini ortaya koymayı amaçlamaktadır. Bu bağlamda bu çalışma, Irak Savaşı sonrasında Irak'ın yeniden yapılanmasındaki uygulamaları incelemeyi amaçlayarak, söylem analizi ve literatür taramasından yararlanmış, dönemin siyasi isimlerinin Irak'ın işgali ve sonrasındaki gelişmelere dair anıları, görüşleri ve gerçekleştirdikleri mülakatları incelemiş, Irak'ta İkinci Körfez Savaşı ile Nuri El Maliki'nin Başbakanlık dönemi arasındaki süreçte Sünni gruplarda meydana gelen radikalleşmenin nedenleri sorgulanmıştır. Çalışmanın temel iddiası, Irak Savaşı'nın bölgedeki radikal unsurların artışında büyük etkiye sahip olduğu; Irak'ta uygulanmak istenilen demokrasinin ülke içerisindeki Sünni ve Şii gruplar arasında öteki oluşturduğu; siyasi istikrarsızlığın Irak'ın ekonomisinde, eğitiminde, sağlık sisteminde olumsuz etkilere neden olduğu ve radikalleşen bölgede göç ve mülteci krizlerinin artmış olduğudur."
