abstract: "Kurulmalarının üzerinden yarım yüzyıl geçmemesine, karşılaştıkları zorluklar ve engellere rağmen, katılım bankalarının bankacılık sektörü içindeki rolü günler gittikçe daha önemli hale gelmektedir ve dünya finans piyasasındaki payını artırmaktadır. Bugün katılım bankacılığı sadece İslam ülkelerinde değil; İngiltere, Almanya, Avrupa ülkeleri ve Amerika Birleşik Devletleri gibi ekonominin çok ileri düzeyde olduğu ülkelerde de bulunmaktadır. Bu çalışmada, katılım bankacılığı kavramının ne olduğuna, bu kavramın içeriğine ve detayına değinildikten sonra dünyadaki 21 katılım bankası seçilip performansları ölçülmüştür. Bu ölçüm 2009-2013 yılları arasını kapsamaktadır. Bu ölçüm yapılırken öncelikle katılım bankaları bilanço ve gelir tablolarından veriler elde edilmiştir. Bu verilerden gereken oranlar hesaplanmıştır. Analizde kullanılan oranlar: Likidite oranlar, karlılık oranlar, faaliyet oranlar (verimlilik oranlar) ve finansal yapı oranlarıdır. Bu oranlar hesaplandıktan sonra gerek ağırlıklandırılarak gerekse de AHP metodu kullanılarak Topsis ve Promethee yöntemleriyle performans puanları hesaplanmış ve bu puanlara göre bankaların puanı sıralanmıştır. En yüksek puanı alan bankalar birinci sıralara yerleşmiş ve bunun tersine en düşük puanı alan bankalar son sıralarda yer almıştır."
