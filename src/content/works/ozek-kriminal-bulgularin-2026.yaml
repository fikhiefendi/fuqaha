abstract: "Bu çalışma, suçların aydınlatılması ve ispatında modern bilimsel teknikler ile İslâm yargılama hukukunda önemli bir yere sahip olan karîne müessesesi arasındaki ilişkiyi incelemeyi amaçlamaktadır. Kriminoloji ve kriminalistik alanındaki gelişmeler ile İslâm ispat hukukunda yer alan yardımcı delil sistemi karşılaştırmalı olarak analiz edilmiş; disiplinler arası bir yaklaşımla klasik fıkıh literatürü ve çağdaş bilimsel veriler birlikte değerlendirilmiştir. Tez iki ana bölümden oluşmaktadır: Birinci bölümde, modern ceza adalet sisteminde kriminoloji ve kriminalistiğin teorik ve uygulamalı boyutları ele alınmıştır. Kriminolojinin suçun nedenlerini araştıran teorik bir disiplin olduğu; kriminalistiğin ise suçun çözümüne yönelik maddi delil toplama, inceleme ve analiz süreçlerine odaklanan uygulamalı bir bilim dalı olduğu vurgulanmıştır. Kriminalistiğin tarihsel gelişimi incelenmiş; fiziksel, biyolojik ve dijital delillerin modern hukuk sistemlerindeki ispat değeri ve yargılama süreçlerine etkisi değerlendirilmiştir. Delillerin hukuki kabul edilebilirliği, teknik güvenilirliği ve metodolojik temelleri detaylı olarak açıklanmıştır. İkinci bölümde ise İslâm yargılama ve ispat hukukunun temel kavramları sistematik olarak incelenmiştir. Delil, ispat, karîne ve yardımcı ispat vasıtaları klasik ve çağdaş fıkıh kaynakları ışığında analiz edilmiş; hâkimin takdir yetkisi ve tecrübe temelli çıkarımlar değerlendirilmiştir. Bu bağlamda, adli toksikoloji alanında zehirlenme vakaları, ilaç ve madde suistimali, biyokimyasal analizler ve toksik madde tespit yöntemlerinin suçun tespiti ve ispatındaki rolü ele alınmıştır. Bilimsel bulguların güvenilirlik, objektiflik ve hukuki geçerlilik kriterleri çerçevesinde İslâm hukukundaki karîne sistemiyle uyumu tartışılmıştır. Modern kriminal tekniklerle elde edilen verilerin makâsıdü'ş-şerîa ilkeleri doğrultusunda yardımcı delil olarak değerlendirilip değerlendirilemeyeceği analiz edilmiştir. İslâm yargılama hukukunun karîne merkezli yapısının, belirli şartlar altında modern kriminalistik ve adli toksikoloji verilerini yardımcı ispat vasıtası olarak değerlendirmeye imkân tanıyabilecek esnekliğe sahip olduğu; klasik fıkhî birikim ile çağdaş bilimsel gelişmeler arasında metodolojik bir uyum zemininin mümkün olduğu sonucuna ulaşılmıştır."
