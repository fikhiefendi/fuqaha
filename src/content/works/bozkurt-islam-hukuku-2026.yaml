abstract: "Genelde İslam düşüncesini özelde ise geniş anlamıyla İslam hukukunu temelinde Wael B. Hallaq'ın modernite eleştirisini çalıştığımız bu tez, giriş, modern özne ve şeriatın öznesi, modern devlet ve modernite öncesi İslami yönetim, oryantalizm, sömürgecilik ve İslam Hukuku'nda yapısal kırılma bölümlerinden oluşmaktadır. Tezimizin bağlamı, moderniteyle birlikte dar, teknik bir alana sıkışan bir İslam hukuku değil, kuşatıcı bir ilim olarak fıkıhtır. Bu noktanın bilinmesi tezin doğru okunabilmesi için hayatidir. Ayrıca İslam hukuku ve şerat kavramlarını ayırt etmeden birbirinin yerine kullanılmaktadır. Araştırmamız nitel bir araştırmadır ve doküman analizi yöntemi uygulanmıştır. Geri plan oluşturmak için girişten sonra ilk bölümde modernitenin tarihine ışık tuttuk. Hallaq düşüncesinde modern özneyi Şeriatın öznesi ile karşılaştırmalı olarak işledik. İkinci bölümde modern devlet ve hukuku ile modernite öncesi İslami yönetim ve hukuku yine karşılaştırmalı olarak işledik. Son bölümde modern paradigmatik unsurlar olarak oryantalizm, sömürgecilik ve İslam hukukunda 19. yüzyılda yaşanan yapısal kırılmaya neden olan vakıf sisteminin bozulması, fıkhın metinselleşmesi ve kanunlaştırmayı ele aldık. Araştırma Müslümanlar için fıkıh tarihini ve fıkhın doğasını sahici olarak okuyabilmeleri ve dolayısıyla kendilik bilinçlerini geliştirmesine imkan vermesi bakımından önemlidir. Tezin bulguları, modernitenin oryantalist gözünden şeriat okumasının Müslümanının kendi fıkıh tarihini yanlış değerlendirmesine sebep olduğudur. Modernitenin tüm insanlık için bir kırılma ve sürdürülemez bir olgu olduğu bulgusuna ulaşılmıştır. Müslümanların kendilik bilincine varmalarının, İslam hukukunu doğru okuyabilmelerinin ve hatta moderniteye alternatif olarak sunabilmelerinin kıymeti tespit edilmiştir."
