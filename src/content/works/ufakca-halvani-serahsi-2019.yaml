abstract: "Halvani ve Serahsi'nin el-Mebsut adlı Eserlerinin Nikah Bölümlerinin Mukayesesi isimli bu tez, bir giriş, iki bölüm ve bir değerlendirmeden oluşmaktadır. Giriş bölümünde konunun önemi, sınırları ve araştırmanın yöntemi belirtilmiştir. Birinci bölümde Halvani ve Serahsi'nin hayatları, hocaları, talebeleri, eserleri gibi konular hakkında bilgi verilmiş olup, ikinci bölümde ise müelliflerin el-Mebsut isimli eserlerinin nikah bölümü mukayese edilmiştir. Değerlendirme bölümünde de benzer-farklı yön ve yöntemlere temas edilmiştir."
