abstract: "TÜRKÇE ÖZET Devletler hukuk temeli üzerinde kaimdirler. Hukuka kanunların tatbikatı ile ulaşıldığından dolayı, beşerî hukuklarda kanunların anlaşılıp yorumlanması için birtakım usûller geliştirilmiştir. İşte bunun gibi, İslâm Hukuku'nda da kanunlara temel teşkil eden nass'ların, Sâri' in iradesi doğrultusunda en güzel şekilde anlaşılıp yorumlanması için birtakım usûller geliştirilmiştir. İslâm Hukuku'nda bu usûller temelde iki yaklaşıma dayanmaktadır. Bunlardan biri Fukahâ Ekolü diye bilinen Hanefi, diğeri de Mütekellimîn diye bilinen Şafii Ekolü'dür. Her iki ekol de Kur'an ve Sünnet nass'larının yorumlanması hususunda iki ana taksime gitmişler, bunu,“nass'ın bir bütün olarak cümle halinde yorumlanması”ve“nass'ın parçalanarak kelime kelime yorumlanması”şeklinde ifade etmişlerdir. Yine,“nass'ın bir bütün olarak cümle halinde yorumlanması”m da iki ana bölüme ayırmışlardır. Fukahâ Ekolü buna“Sözlü Olmayan Delâlet”ve“Sözlü Olan Delâlet”derken, Mütekellimîn Ekolü“Sözün Delâleti”ve“Mananın Delâleti”adım vermiştir. Bu çalışmanın temelini; Fukahâ Ekolü'nün“Sözlü Olan Delâlet”içinde mütâlâa ederek“Delâletü'n-Nass”, Mütekellimîn Ekolü'nün“Mananın Delâleti”içinde mütâlâa ederek“Mefhûm-ı Muvafakat”dedikleri konu teşkil etmektedir. Her iki ekolden örnek birer kitap alınarak“Serahsî'nin el-Usûl'ü”ve“Gazzâlî'nin el-Müstasfâ'sı”na göre bu çalışma yapılmıştır. vı"
