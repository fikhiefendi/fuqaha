abstract: "Kıssaların Fıkhı- Hz. Salih Kıssası Örneği-? adlı bu tez, Kur'andaki kıssa ayetlerini fıkhi/hukuki bakımdan ele almaktadır.Kur'an-ı Kerim farklı konular içermektedir. Bu konular arasında yer alan kıssalar, geçmiş, şimdiki zaman, gelecek hakkında insanların karar vermesine yardımcı olur.Kıssalar, hem geçmiş zaman kesitlerinde gerçekleşmiş olayları hem de insanoğlunun ortaya koymuş olduğu davranışları ve bunların sonuçlarını ifade eder. Kıssalar Kur'an-ı Kerim'de çok önemli yer tutmaktadır. Kıssaların anlatılış amacı, salt tarihi bilgi vermek/ olayları hikâye etmek değildir. Asıl amaç, muhatapları murad-ı ilahi doğrultusunda yönlendirmektir. İslam hukukçuları Kur'an'ın önemli bölümünü dolduran kıssalardan yararlanma cihetine gitmişler ve kimi kuralları kıssalara istinad ettirmişlerdir.Bilindiği gibi İslam fıkhının menbaı/kaynağı Kur'an-ı Kerimdir. Kur'an- ı kerim salt akide kitabı değildir. Hayatın her alanını kapsayıcı mesajlar içeren bir kitaptır. İçerdiği mesajların bir kısmı gerek bireysel, gerek toplumsal hayatı tanzim etmeye yöneliktir. Kur'an'da Mesajların iletimi doğrudan olduğu gibi, kıssalar vasıtasıyla örnek olay/kıssa yöntemiyle verilmiştir. Zira kıssa üslubu en etkili anlatım yöntemlerinden birisidir.Kıssalar yakından incelendiğinde, kıssalarla biz muhataplara bir tarih perspektifi ve tarih bilinci verilmek istendiği rahatlıkla görülecektir. Kıssaların fıkhi/hukuki yönünün açığa çıkarıldığı pek söylenemez. Bu çalışmada kıssaları, barındırdığına inandığımız fıkhi yönlerini ortaya koymaya ve kıssaları aktüel hale getirmeye çalıştık. Kur'an geçmiş dönemlerin araştırılıp elde edilecek sonuçlar hususuna çokça önem vermektedir. Hz Salih kavminin helak süreci, toplumların ilerleme ve gerileme nedenlerini ortaya koymada kapsayıcı bir örnektir. Kıssaların araştırılması neticesinde elde edilecek verilerle toplum kendisini test etmeli, bulunduğu halin tesbitini yaparak gelecek perspektifini oluşturmak için çıkarsamada bulunmalıdır."
