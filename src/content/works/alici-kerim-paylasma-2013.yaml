abstract: "KUR'AN-I KERİM'DE PAYLAŞMAYüce Yaratıcının muhatabı olan insan, bu dünyaya onu imar ve inşa etme sorumluluğuyla gönderilmiştir. Bu sorumluluğun önemli bir kısmını ise toplumsal ahlaki bir düzenin kurulması teşkil etmektedir.Kur'an-ı Kerim,nüzül süreci boyunca toplumsal dayanışmanın ve yardımlaşmanın önündeki engelleri kaldırmayı emir, teşvik ve tavsiye ederek, onların yerine sosyal bütünleşmeyi ikame edecek prensipler getirmiştir. Allah Kur'an'da, insanların ellerindeki maddi imkanları muhtaç kesimlerle paylaşmalarını istemiştir. Aksini yapanları kınamış hatta tehdit etmiştir. Bu durum hem formel ibadetler, hem de ahlaki esaslarla ilişkilendirilerek sürekli gümdemde tutulmaya çalışılmıştır. Nmaz, oruç, infak, zekat, sadaka, kefaretler, ihsan, birr, hayr ve isar gibi terimlerin içeriği, hep bu amaca hizmet etmektedir.Yüce Allah Kur'an'da mülkün kendisine ait olduğunu ve onu insana emeneten verdiğini ifade eder. Allah, maddi nimetleri,insanlara ve diğer canlılara cömertçe verdiği gibi, insanlarında aynı ahlaki vasfa sahip olarak paylaşmalarını istemiştir. Kur'an'da bunun örnekleri çokça işlenmiş ve insana olumlu bir model sunulmuştur. Ayrıca olumsuz örnekler sunularak da, paylaşmamanın çirkinliğinin boyutu anlatılmıştır.Maddi paylaşımın anlamlı olabilmesi için, dini ve ahlaki anlamda,belirli şartlerı taşıması gerekir. Bunlar; paylaşırken Allah rızasını gözetmek, samimi olmak, hiçbir kimseden karşılık beklememek, gösteriş yapmamak vb. prensiplerdir."
