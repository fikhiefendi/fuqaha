abstract: "Bu çalışmada, Hukûk-ı Âile Kararnâmesi ile Lübnan'daki Ahvâl-i şahsiyye (kişisel kanun) mevzuatının karşılaştırması konu edinilmiştir. Hukūk-ı Âile Kararnâmesi, aşağıdaki maddelerde açığa çıkan büyük önemi nedeniyle seçilmiştir: Birincisi, Hukûk-ı Âile Kararnâmesi, İslam hukukundaki evlenme ve boşanma konularıyla ilgili hükümlerin kodlanmış bir şeklidir. İkincisi, bu kanunun maddeleri, her ne kadar daha baskın şekilde Hanefî mezhebinin görüşlerini içerse de dört mezhebin (Hanefi, Şafii, Maliki ve Hanbeli) görüşlerini yansıtacak şekilde bir araya getirilmiştir. Üçüncüsü, ilgili kanun Müslümanların evlilik ve boşanma hükümlerini içerdiği gibi Hıristiyanlar ve Yahudilerin de evlilik ve boşanma ahkamını içermektedir. Çalışmada karşılaştırma modeli olarak Lübnan'ın tercih edilmesinin sebebi, Lübnan toplumunun bünyesinde barındırdığı din ve mezheplerin çeşitliliği ve bu sebeple mahkemelerinde mevcut olan kişisel statü mevzuatının farklılığıdır. Bu çalışma Lübnan'daki kişisel mevzuatlar ile Hukûk-ı Âile Kararnâmesi arasındaki uyumun ne ölçüde olduğunu keşfetmek ve birbirinden farklı bu mevzuatların, gerekirse bazı düzeltmelerde bulunarak“Aile Kanunu”gibi tek bir kanun çerçevesinde birleştirilmesinin mümkün olup olmadığı noktasında bilgi elde edebilmek ve karşılaştırmanın neticesinde ortaya çıkan sonuçlarını analiz etmek için gerçekleştirilmiştir. Bu da, Lübnan'ın, şeriata uygun olmayan diğer medeni kanunlarının yerini alacak şekilde ilahi kanunlara münasip ve aynı zamanda ülkedeki farklı grupların da uyum sağlayacağı ortak ve kapsamlı bir ahvâl-i şahsiyye kanunu çıkarmayı amaçlamaktadır."
