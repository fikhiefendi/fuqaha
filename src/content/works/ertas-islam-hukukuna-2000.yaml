abstract: "ÖZET İslam'a giren bir kişi yalnızca yeni bir dine girmiş olmaz. Aynı zamanda İslam toplumunun bir üyesi de olur. İslam geniş kapsamlı bir kardeşlik tesis etmek ister. Bu amaçla kendisine inananların uyması gerekli kurallar ortaya koymuştur. Bu kardeşlik iyiliği emretmek ve kötülükten sakındırmak yoluyla gerçekleşmektedir. Böylelikle kötülük İslam toplumuna giriş için yol bulamayacaktır. İslam hukuku bu örnek toplumu oluşturmak.için bazı kurallar koymuştur. Toplumun ahlaki gelişiminin sağlıklı ve güvenli olabilmesi için kadın erkek arasındaki ilişkiler bu kurallara göre düzenlemiştir. İslam, kadın ve erkek için farklı faaliyet alanları belirlemiş ve fertlerin kendilerini maddi ve manevi alanlarda geliştirmesi için imkan sağlamaya çalışmıştır. Kadın-erkek ilişkilerine bir ölçü getirmiş ve kadının mahremleri haricindeki yabancı erkeklerle (namahrem) serbestçe bir araya gelmesini uygun bulmamıştır. Namahremlerin birbirleriyle görüşmesini kadın ve erkeğin tesettür vb. bazı kurallara uymaları şartıyla kabul etmiştir. Kadın evinden çıktığı zaman gerekli tesettüre sahip olmalıdır. Bununla birlikte erkekler de namahrem kadınlardan bakışlarını çevirmekle yükümlü tutulmuşlar ve gerekli olmayan bakışlardan geri durmaları konusunda uyarılmışlardır. Gerekli olan ilişkiler İslam'ın getirdiği kurallara bağlı kalmak şartıyla engellenmemiştir. Kadın ve erkeğin ruhi tekamüllerini sağlamaları kendilerinin kötülüklerden arındırabilmeleri için evlilik meşru kılınmış ve yine bu amaçla erkeklerin diz kapaklan ile göbekleri arasını ve kadınların el ve yüzleri hariç tüm bedenlerini kapatmaları emredilmiştir. Fakat bu örtü konusunda da mahrem ve namahrem ayrımına gidilerek yakın akrabayla olan ilişkilere belli bir rahatlık getirilerek sosyal hayat düzenlenmiştir. VII"
