abstract: "Küreselleşen ve giderek büyüyen ekonomik sistemin olmazsa olmaz koşullarından biri, sağlıklı ve güçlü bir finansal sistem ve bankacılık sitemidir. Bankacılık sisteminin asli unsuru; tasarrufların değerlendirilmesi, toplanan kaynakların ekonomiye finansman desteği-kredi olarak sunulması ve ekonomik faaliyetler sürecinde finansal işlemlerin gerçekleştirilmesine aracılık etmesidir. Dini hassasiyetler nedeniyle faizin yer aldığı bankacılık sistemine katılmak istemeyen birey ve toplumların, sisteme katılmasının önü faizsiz bankacılık veya katılım bankaları yoluyla açılmıştır. Günümüzde dünya bankacılığında giderek büyüyen ve İslami esaslar doğrultusunda faaliyet gösteren katılım bankaları, atıl fonların ekonomiye kazandırılması işlevi ve faizsiz finansman modelleri ile ekonominin gelişmesine katkı sağlamaktadır. 1980'li yıllarda Türk bankacılık sektöründe yer almaya başlayan katılım bankacılığı, günümüzde beş katılım bankası ile Türk ekonomisine katkı sağlamaktadır. Bu çalışmada; katılım bankacılığının Türk bankacılık sektöründeki yeri, güçlü ve zayıf yönlerinin belirlenmesi amaçlanmıştır. Bu doğrultuda, katılım bankacılığının ürün ve hizmetler ile sayısal verileri değerlendirilmiş ve bankacılık sektörü ile kıyaslanmıştır. Ulaşılan bulgular doğrultusunda katılım bankalarının; mevduat ve ticari bankalara alternatif bir bankacılık türü olmadığı, bankacılık sektöründe çeşitlilik sağlayan İslami esaslara uygun finansal ürünler ile Türk bankacılık sektörüne ve Türkiye ekonomisine katkı sağladığı sonucuna ulaşılmıştır."
