abstract: "Bu çalışma, Çağdaş İslam düşüncesinin ve tefsir ilminin 21. yüzyıldaki temsilcilerinden biri olan Prof. Dr. Mehmet Zeki Duman’ın Beyânu’l-Hak: Kur’ân-ı Kerîm’in Nüzûl Sırasına Göre Tefsiri adlı eserinde ahkâm âyetlerinin yorumlanış biçimini ve müellifin fıkhî yaklaşımını incelemeyi amaçlamaktadır. Araştırmanın temel hedefi, klasik ve çağdaş yaklaşımları birlikte ele alan müellifin ahkâm âyetlerine yaklaşımını ve fıkhî değerlendirmelerini ortaya koymaktır. Çalışmada, Beyânu’l-Hak tefsirinde yer alan ahkâm âyetleri sistematik metin analizi yöntemiyle incelenmiştir. Araştırmanın temel kaynağını, üç ciltlik Beyânu’l- Hak tefsiri oluşturmuştur. Bunun yanında müellifin diğer eserleri, makaleleri ve konuyla ilgili akademik çalışmalardan da yararlanılmıştır. İnceleme sırasında Kur’ân-ı Kerîm’de yer alan ahkâm âyetleri ibadet, muâmelât ve ukûbât başlıkları altında tasnif edilerek değerlendirilmiştir. Duman, yorumlarında klasik tefsirler, ahkâm tefsirleri ve çağdaş tefsir literatüründen geniş ölçüde yararlanmıştır. Bu nedenle çalışmada söz konusu kaynaklardaki görüşler ayrıca karşılaştırılmamış, değerlendirmeler Duman’ın yorumuyla sınırlandırılmıştır. Duman, “tefsirde iktisat” ilkesi gereği ihtiyaç fazlası ayrıntılardan kaçınmış, yorumlarında kısa ve net bilgi ortaya koymuştur. İbadetlerde şekilden ziyade bilinci merkeze alan müellif; çok eşliliği sosyal bir ruhsat, miras paylarındaki farklılığı ise erkeğin malî sorumlulukları üzerinden bir adalet dengesi olarak tanımlamıştır. Ceza hukukunda ise yaptırımların mutlak caydırıcılık (tenkil) işlevini ön plana çıkardığı saptanmıştır"
