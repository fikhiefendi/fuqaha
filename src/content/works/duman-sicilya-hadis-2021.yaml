abstract: "“Sicilya'da Hadîs İlmi ve Sicilyalı Muhaddisler”adını verdiğimiz bu çalışmada, Müslümanların Sicilya'yı fetihlerinden (212/827) itibaren adanın İslam hâkimiyetinden çıkıp (484/1091) Norman idaresine girdiği dönem de dahil olmak üzere Hicri III. Miladi IX. Yüzyıl'dan Hicri X. Miladi XVI. Yüzyıl'a kadar Sicilya'da var oluşları ve adaya ilmi ve kültürel anlamda sağladıkları katkılar genel olarak incelenmiştir. Özelde ise İslami ilimlerden hadîs konusunda yaptıkları çalışmalar ele alınmıştır. Bu anlamda Sicilyalı Muhaddisler hakkında bilgi verilmiş ve az da olsa var olan bilgiler ışığında çalışmaları tanıtılmıştır. Çalışmanın temel konusu: Sicilya'da Hadîs İlmi'nin yeri ve Sicilya'yı Hadîs İlmi açısından etkilemiş veya Sicilya'daki ilmî hayattan etkilenmiş olan âlimler hakkında bilgi vermektir. Bu hususta Sicilya'nın fethiyle beraber adadaki ilmî ve kültürel değişime dikkat çekilmiş, bu değişime sebep olan unsurlar üzerinde durulmuş ve bu birikime Sicilya içinden veya dışından katkı sağlayan âlimlerin bazı çalışmalarına yer verilmiştir. Birinci bölümde: Sicilya'nın ismi, coğrafi yapısı, stratejik konumu ve Müslümanların fethi öncesi adanın siyasi, iktisadi, dinî ve sosyal durumu hakkında genel bilgiler verilmiştir. İkinci bölümde ise: adanın fethi ile beraber Müslüman hâkimiyetindeki Sicilya'nın siyasi, iktisadi ve sosyal durumu hakkında kısa bilgilere yer verilmiş, dinî açıdan ise Sicilya'da bulunan mezhepler ve adadaki etkin mezhep üzerinde durulmuştur. Sicilya'da ilmî hayatın ve Hadîs İlmi'nin vücut buluşu, gelişimi ve gelişimine etki eden unsurlar hakkında bilgiler verilmiş adanın İslam hâkimiyetinden çıkıp; Normanlar (Vikingler) idaresine girdiği dönemde Sicilya'da kalan Müslümanların durumu ve ilmî hayatın bu durumdan nasıl etkilendiği araştırılmış, elde edilen bilgiler paylaşılmıştır. Üçüncü bölümde: Sicilya ve Hadîs ilmi ile ilgisi tespit edilmiş olan âlimlerin isimleri verilmiştir. Son olarak araştırmada yer verdiğimiz bilgiler ile ilgili değerlendirmelerde bulunulmuştur."
