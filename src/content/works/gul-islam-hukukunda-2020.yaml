abstract: "Çalışmaya mevzu edilen vekâlet konusu geçmişte olduğu gibi günümüzde de Müslümanlar açısından önemini korumaya devam etmektedir. Fıkıhçılar, bu konudaki nassları ve İslam'ın genel prensiplerini göz önünde bulundurarak değişik yaklaşımlar sergilemişlerdir. İslam hukukunda bu değişik yaklaşımlarının tespit edilmesi ve Fukahanın bu meseleyi ele alış tarzının belirlenmesi önem arz etmektedir. Bu doğrultuda“İslam Hukukunda Alışverişte Vekâlet”konusu ilmi bir disiplin içerisinde ele alınıp incelenecektir. Bu çalışma: Giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde tezin amacı, önemi, konusu, tezin yöntemi, sınırları ve kaynaklarına değindik. Birinci bölümde İslam hukukunda alışveriş ana başlığı altında İslam hukukunda akit, alışveriş, alışverişin rükünleri, alışverişin meşruiyeti, alışverişin şartları, alışverişin çeşitleri başlıklar halinde incelendi. İkinci bölümde İslam hukukunda vekâlet başlığı altında genel olarak vekâletin; sözlük, terim, anlamı verildi ve sonrasında mezheplere göre tanımı yapılarak vekâletin mahiyeti ve hukuki dayanağı olan kitap, sünnet, icmaya dayanan meşruiyeti ve hukuku ile ilgi mezhep görüşleri ele alındı. Ardından vekâletin; hükmü, rükünleri, şartları, konusuyla ilgili şartları, çeşitleri, ücret karşılığı vekâlet ve vekâletin sona erme halleri üzerinde duruldu. Üçüncü bölümde ise İslam hukukunda alışverişte vekâlet, vekâlet vermede cehalet, satın almada vekâlet, satın alma hususunda müvekkil ile vekilin tasarrufları, vekâlet veren ile vekil arasındaki ihtilafları, satın almada vekillerin birden çok olması ve satış yapmada vekâlet bahisleri incelendi. Sonuç kısmında ise çalışmanın genel bir değerlendirmesi yapıldı."
