abstract: "Tanzimat Dönemi kanunlaştırma faaliyetleriyle beraber Osmanlı Devleti adliye teşkilatında batının da etkisiyle bazı reformlar yapılmıştır. Bunların içerisinde en önemlisi Ahmed Cevdet Paşanın başkanlığındaki Mecelle-i Ahkâm-ı Adliye çalışmasıdır. Hazırlanışı itibari ile batıdan etkilenmeyen ve yerli olan bu eserin birçok şerhi vardır. Onlardan biri ve en meşhuru Ali Haydar Efendi'nin“Dürerü'l-Hükkâm Şerhu Mecelleti'l-Ahkâm”adlı eseridir. Bu eserin ilk basımı 1892-1898 yılları arasında on altı kitap olacak şekilde yayımlanmıştır. İkinci basımı ve çalışmamızın kaynağı olan eser, 1911 yılında İstanbul'da dört cilt olarak basılmıştır. İçerik açısından İslam ve Osmanlı hukuku külliyatı mahiyetindeki bu eserin on dördüncü kitabı Kitâbü'd-Dava çalışmamızın ilgili bölümüdür. Bir mukaddime, iki bab olan dava kitabındaki alt başlıklardan, Davanın Sıhhat Şartları'nda, davacı ve davalının uyması gereken şartlar on beş maddede açıklanmıştır. Aleyhine dava açılan kişinin Karşı Dava (Def') açmak istediğinde dava şekilleri ve uyması gereken kurallar üç maddede açıklanmıştır. Hasım Olanlar ve Olmayanlar başlığı altında dava sürecinde husumeti söz konusu olan taraf ve aslen hasım olmayan taraf hakkındaki şartlar on üç maddede açıklanmıştır. Davanın geçerli olma şartlarından tenâkuzda, davacının davasının seyrini olumsuz yönde etkileyecek birinci sözü ile çelişen ikinci bir sözün söylenmesi olup on üç maddede açıklanmıştır. Son alt başlığımız, kazanılmış bir hakkı veya dava açabilmeye engel olan süreyi ifade eden (Mürûr-ı zeman) zaman aşımıdır. Süreleri konularına göre farklılık gösteren, bir ay, iki yıl, on yıl, on beş yıl ve otuz altı yıl gibi zamanları ifade eden zaman aşımı on altı maddede açıklanmıştır."
