abstract: "Bu araştırmanın amacı Sebîlürreşâd ve önceki adıyla Sırât-ı Müstakîm mecmualarında yer alan ailenin kurulması ve korunmasına dair meseleleri dönemin sosyal gelişmeleri ile hukuki yenilikleri bağlamında incelemektir. Araştırmada, mecmualarda yer alan makaleler nitel araştırma yöntemlerinden doküman analizi tekniği ile incelenmiştir. Çalışma kapsamında, dergilerdeki makalelerde ele alınan nikâhın ehliyet şartı, icra ediliş şekli, geçerliliği, evlilikte eş sayısı ve mehir ile ailenin korunması konuları incelenmiştir. Ayrıca eşlerin hak ve sorumlulukları konuları da çalışma kapsamında yer almıştır. Mezkur mecmuaların yayınlandığı 1908 – 1925 yıllarındaki Batılılaşma düşünceleri, aile hukuku alanında yapılan yeni hukuki düzenlemeler ile yaşanan savaşların doğurduğu sonuçların makalelerdeki tartışmaları şekillendirdiği tespit edilmiştir. Söz konusu dönemde güçlü bir aile yapısının; ailenin İslâm hukuku normlarına uygun bir şekilde kurulması, ailenin zararlı fikir ve davranışlardan uzak tutulması ve ebeveynlerin İslâm'ın kendileri için tanımladığı hak ve yükümlülüklere uygun yaşamasıyla mümkün olacağı yönünde bir kanaat hakim olmuştur."
