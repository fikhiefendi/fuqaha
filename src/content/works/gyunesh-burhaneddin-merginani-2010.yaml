abstract: "Burhaneddin el-Merginani'nin (511/1117-593/1197) kaleme aldığı Muhtaratu-Nevâzil adlı eseri İslam Hukuku alanında önemli bir konuma sahiptir. Bu eser hicrî beşinci ve altıncı yüzyıllarda yaşamış Belhli, Buharalı ve Semerkandlı Hanefi fakihlerin görüşlerini içermektedir. Ancak ifade edilmelidir ki bu görüşler Hanefî ekolün fıkhî görüşlerini yansıtan temel Hanefî hukuk literatüründe yer almamaktadır. Bu eserde Hanefi imamları ve Hanefi mezhebi hakkında bilhassa Belh meşayıhından gelen rivayetler kaydedilmiştir. Daha önceki nevazil eserlerinden farklı olarak, bu eserde her fıkıh babına, söz konusu babın başlığının lugat ve ıstılahi anlamlarının açıklanması ile başlanmaktadır. Ayrıca eserde zahir ve nadir rivayetler nispeten daha fazla yer almaktadır. Eserde istisnai de olsa Hanefi olmayan mezhep imamlarının görüşlerine de yer verilmiştir. Muhtaratu'n-Nevâzil, ele aldığı bir çok meselenin delillerini de zikretmektedir.Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde müellifin hayatından, hocalarından, öğrencilerinden ve eserlerinden bahsedilmiştir. İkinci bölümde ise, Muhtaratu'n-Nevâzil adlı eserin edisyon kritiği sunulmuştur. Metin, eserin Fatih ve Carullah Kütüphaneleri'nde bulunan iki nüshası karşılaştırılmak sureti ile oluşturulmuştur. Eserde geçen ayet, hadis, Farsça ibareler ve şahıs isimleri hakkında dipnotlarda açıklamalarda bulunulmuştur."
