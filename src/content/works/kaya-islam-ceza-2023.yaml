abstract: "İslam hukukunda insanın görevleri, hakları ve hürriyetleri belirlenmiş, özelde insanın genelde toplumun düzeninin korunması esas alınmış ve bu doğrultuda çizilen sınırları aşanlara karşı birtakım tedbirler konmuştur. Bu tedbirler İslam ceza hukukunda had, kısas ve ta'zîr cezaları olmak üzere üçlü tasnife tabi tutulmuştur. Söz konusu cezalar vaz edilirken birtakım gayelere ulaşmak hedeflenmiş ve bunların uygulanması esnasında gayelerle uyumlu ilkeler benimsenmiştir. Bu bağlamda İslam muhakeme hukuku, bir yandan dini müeyyidelerle destekleniyor olması, diğer yandan ceza tasnifi ve muhakeme adabı bakımından kendine özgüdür. Bu çalışmada İslam ceza muhakeme hukukundaki temel ilkeler ele alınmıştır. İlk olarak klasik kaynaklardaki bilgiler derlenmiş ve daha sonra Türk ceza muhakemesi hukukundaki ilkelerin tasnifleriyle karşılaştırılmıştır. Bu arada ilgili ayetlere ve hadislere kimi zaman metni zikrederek kimi zaman dipnotta atıfta bulunarak yer verilmiştir. Türk ceza muhakemesi hukukundaki ilkeler için Anayasa maddeleri ve uluslararası sözleşmeler de dikkate alınmıştır. Çalışmamızın giriş bölümünde tezimizin konusu, amacı, yöntemi ve kapsamı hakkında kısaca bilgi verilmiştir. Birinci bölümde, suç ve ceza teorisi bağlamında maddi ceza hukuku anlatılmış, burada suç ve ceza kavramlarının unsurları ele alınmış, suçun türleri çeşitli bakımlardan incelenmiştir. İkinci bölümde, ceza muhakemesi hukukunun tanımı, hukuki dayanağı, konusu, sistemi, amaçları araştırılmış ve İslam ceza muhakemesi hukukuna etki eden bazı faktörler üzerinde durulmuştur. Üçüncü bölümde, insan haklarının korunması, muhakemenin hazırlanması ve şekli ile ispat yükü bakımından ceza muhakemesindeki ilkeler araştırılmıştır."
