abstract: "Hicri ikinci asrın başlarında İmam Şafiî'nin er-Risale adlı ilk usulü eserini telif etmesiyle birlikte fıkıh alanındaki çalışmalar yeni bir ivme kazanmıştır. Yeni usul eserlerinin telifiyle beraber fukahâ ve mütekellimin metotları oluşmaya başlamış ve hicrî dördüncü asra gelince fıkıh usulü ilmi sistematik hale gelmiştir. Tezimizin amacı Maliki mezhebi özelinde fıkıh usulü ilminin sistematik döneminde kullanılan“İstihsân”kavramın, usul ilmi nazariyatı henüz ortaya çıkmamışken el-Müdevvene çerçevesinde ilk dönem furû eserlerinde nasıl ve ne sıklıkta kullanıldığına tanıklık etmektir. Çalışmanın hedefi ise Maliki mezhebinin temel kaynağı el-Müdevvene'de uygulanışına dair örneklerden hareketle İstihsânın mezhebin fıkıh geleneğinde kullanım sıklığını ve biçimini ortaya koymaktır. Çalışmayı diğerlerinde farklı kılan en önemli özelliği fıkıh usulü nazariyatının henüz kavramsallaşmadığı dönemde kullanılan yöntemlerin uygulanışını somut örneklerle ortaya koyması ve bunu yaparken de ülkemde (Fildişi Sahililer) fazla çalışmamış bir mezhebi konu edinmiş olmasıdır."
