abstract: "Tezin konusu Makasıdı Şeria teorisinin teorik kökenlerini Hanefi fakih Ebu Bekir Al-Cessas'ın eserlerinde aramaktır. Tez üç ana bölümden oluşmaktadır. Birinci bölüm Cessas'ın ve eselerinin tanıtımını, makasıd teriminin farklı anlamları açıklanıp tartışılmasını içeren alt başlıklardan oluşur. Genel anlamda tezin konusuna hazırlık olarak tasarlanmıştır. İkinci bölüm fıkıh usulünün farklı konularının makasıdı şeria teorisiyle ilgisi açıklanmış usul alimlerinin ihtilaflarında bu teoriyle uyuşan görüşün hangisi olduğu ve Cessas'ın bu tartışmalarda nerede durduğu tespit edilmeye çalışılmıştır. Cessas'ın ele aldığı tüm usul konularını içerir. Üçüncü ve son bölümde ise makasıd teorisinin teorik temelleri ve bu temellerle ilgili teorik sorunlar tartışılmıştır. Fıkıh usulünün yapısı, alternatif yaklaşımlar, hüsün-kubuh tartışması, maslahat ilkesinin geçerliliği ve sınırları, beyan ilkesi, lafız-mana ilişkisi, asıl mana- yan mana ayrımı, icazı Kur'an, teşri 'in mucize yönü gibi teorik tartışmalar bu konuların başlıcalarıdır. Bazı"
