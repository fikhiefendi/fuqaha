abstract: "İmam Muhammed b. el-Hasan eş-şeybani h. II. yüzyılda yaşamış en önemli fıkıh âlimlerinden biridir. Onun fıkıh usulünün oluşumunda önemli katkılarının yanı sıra Hanefi mezhebinin teşekkülünde de önemli etkileri vardır. Bunu bariz bir şekilde eserlerinden anlamak mümkündür. Bu çalışmanın amacı da İmam Muhammed eş-Şeybani'nin Hanefi mezhebi içerisinde Ebu Hanife ve Ebu Yusuf'tan farklı görüşlerini belirleyerek onun aracılığıyla mezhebin ictihat anlayışına ve inceliklerine vakıf olmaktır. Ayrıca bu çalışma Hnaefi mezhebinin erken dönem usul anlayışının özelliklerini de ortaya çıkarmaya katkıda bulunmaktır. Araştırmamız bir giriş ve iki bölümden oluşmaktadır. Çalışmamızı tanıttığımız giriş bölümünün ardından birinci bölümde İmam Muhammed'in hayatı, metodu genel bir bakışla ele alınmış, eserleri tanıtılmıştır. İkinci bölümdeyse İmam Muhammed'in Hanefi mezhebi içerisinde Ebu Hanife ve Ebu Yusuf'tan farklı görüşleri tespit edilmiştir. Çalışmanın sonucunda gerek içtihatlarıyla gerek mezhebin görüşlerinin zenginleşmesi ve günümüze ulaşılmasına vesile olması sebebiyle İmam Muhammed'in mezhepteki önemine dikkat çekilmiştir. İmam Muhammed'in görüşleri başta Hanefi mezhebi olmak üzere diğer mezheplere de ışık tutmuştur."
