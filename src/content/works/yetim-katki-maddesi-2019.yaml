abstract: "Bu çalışma,“istihâle”ve“istihlâk”terimlerini gıda helalliği açısından ele almaktadır. Bu yöntemlerin gıdaların helalliğini ve haramlığını belirleme noktasında bir olanak sağlayıp sağlamayacaklarının tespit edilmesi amaçlanmaktadır. Çalışma, istihâlenin maddelerin mahiyetindeki değişikliği ifade ettiğini; istihlâkın ise fiziksel karışım ve erime ile bir nesnenin miktar olarak kendisinden daha çok olan başka bir nesne ile karışarak onun içinde varlığını korumakla birlikte rengini, tadını ve kokusunu kaybetmesini ifade ettiğini ortaya koymuştur. Bu iki yöntemin, bir ara çözüm olduğu ve daha iyi bir yönteme ulaşmak için bir geçiş formülü olarak değerlendirilebileceğini gösterilmiştir."
