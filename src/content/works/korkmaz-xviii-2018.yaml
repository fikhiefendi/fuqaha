abstract: "XVIII. Yüzyılda Adana mahkemelerinde kayıt altına alınan 72 şer'iyye sicili defteri, klasik fıkıh eserleri ve dönemin fetva mecmuaları çerçevesinde hazırlanan bu çalışma, aile hukuku uygulamalarını ele alarak karşılaşılan problemleri ve bu problemlere sunulan çözüm yollarını göstermeyi ve bilimsel/doğru verilerden hareketle Osmanlı aile yapısıyla ilgili isabetli sonuçlara ulaşmayı amaçlamaktadır. Giriş, sonuç ve üç bölümden meydana gelen bu çalışmanın giriş bölümünde araştırmanın konusu, amacı, yöntemi, kaynakları ve Adana'nın kısa tarihçesi üzerinde durulmuştur. Birinci bölümde Adana'nın idari, sosyal ve hukukî hayatı ele alınmış, mülki yapılanması, mahalleleri, demografik yapısı hakkında bilgi verilerek Adana'da XVIII. yüzyılda görev yapmış kadılar, müftüler ve nakibü'l-eşraflar hakkında kısaca bilgi verilmiştir. İkinci bölümde ailenin teşekkülü, üçüncü bölümde ise evliliğin sona ermesi Adana şer'iyye sicillerinden tespit edilen uygulamalar çerçevesinde ele alınmıştır. Sonuç bölümünde ise ulaşılan sonuçlara yer verilmiştir."
