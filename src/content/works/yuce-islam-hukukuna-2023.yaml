abstract: "Toplumların sağlıklı bir şekilde devam ve nizamı aile müessesesinin işletilmesine ve korunmasına bağlıdır. Huzurlu bir toplum ancak aile müessesesiyle inşa edilebilir. İslam Hukuku ibadetten muamelata, muamelattan ukubata hayatın yekününe nüfuz eden her alanda söz söylemiştir. Cemiyette düzen, sekinet ve selametin tesis edilmesi İslam Hukukunun ana düsturlarından sayılmıştır. Bu yüzden İslam Hukuku aileye ve onun korunmasına ayrı bir ehemmiyet vermiştir. Aile, İslam Hukukunda muamelat başlığı altında ele alınmıştır. İslam Hukuk tarihinde ailenin korunması fertlerin İslam'a ve hukukuna olan bağlılıklarından mütevellit vicdanı ve devlet eliyle hukuki ve cezai yollarla sağlanmıştır. Bu bağlamda toplumu ve daha özelde aileyi münkerâttan koruyan üç müeyyide vardır. Bunlar: Cibilli/fıtri, dini ve devlet gücüne dayalı yaptırımlardır. İslam, cemiyeti münkerâttan korumayı ne salt dini yaptırımlarla ne de sadece devlet gücüne dayalı yaptırımlarla sağlamıştır. Üç amili de en iyi şekliyle müesses kılarak toplumu mefsedetlerden muhafaza etmiştir. Evlenme ve Boşanmanın tescili de aileyi hukuki olarak istenmeyen durumlardan korumaya yardımcı olan amillerden biridir. Tescilin hukuki olarak zaruriliği, tescilsiz evlenme ve boşanmaların tamamen yok sayılması yahut cezai yaptırımlarla engellenmesi bilhassa son dönem İslam Hukukçuları tarafından tartışılmıştır. Biz de bu tezimizde evlenme ve boşanmanın tescilini ayet ve hadislerden yeni içtihat yaparak değil, İslam hukukunun maslahat-ı mürsele, örf ve seddi zera-i ilkeleriyle temellendirerek hukuki ve cezai boyutuyla mütalaa edeceğiz."
