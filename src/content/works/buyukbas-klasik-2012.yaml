abstract: "“Klasik İslam Hukukçularına Göre Cezalandırmanın Gayesi”adını taşıyan bu tez cezaların konuluşundaki gayeleri araştırmaktadır. Tez iki bölüm ve bir sonuçtan oluşmaktadır. Birinci bölümde cezalandırmanın geleceğe dönük amacı araştırılmış ve tartışılmıştır. Bu bölümde toplum menfaatinin korunması, caydırıcılık ve ıslah ilkeleri incelenmiştir. İkinci bölümde cezalandırmanın geçmişe yönelik amacı ele alınmıştır. Bu bölümde keffâret ilkesi, adalet ilkesi ve mağdurun ve toplum vicdanının teskin edilmesi ele alınmıştır."
