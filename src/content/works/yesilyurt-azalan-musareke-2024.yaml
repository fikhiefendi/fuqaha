abstract: "Bu çalışma, İslami finans prensiplerine uygun bir şekilde taşıt finansmanı sağlamaya yönelik bir finansman modeli sunmayı amaçlamaktadır. İslami finans prensipleriyle finansman sağlayan mevcut yöntemlerde genellikle borç temelli yaklaşımların kullanılması, taşıt finansmanı alanında İslami finans prensipleriyle uyumlu ve ortaklık temelli alternatif modellerin geliştirilmesi sonucunu doğurmuştur. Bu çerçevede çalışmada, azalan müşareke yöntemi incelenmiş ve Türkiye için taşıt finansmanına yönelik bir model önerisi sunulmuştur. Araştırma, nitel doküman analizi yöntemiyle gerçekleştirilmiş olup bu yöntem sayesinde azalan müşareke ile taşıt finansmanı hakkında kapsamlı bilgilere ulaşılmıştır. Çalışmada, azalan müşarekenin tanımı, özellikleri, tarihsel gelişimi, uygulama örnekleri ve fıkhi görüşler ele alınmıştır. Ayrıca, Türkiye'deki mevcut taşıt finansmanı modelleriyle karşılaştırılarak, azalan müşarekenin uygulanabilirliği ve potansiyel katkıları değerlendirilmiştir. Araştırma sonucunda, azalan müşareke yönteminin İslami finans prensiplerine tam uyumlu, ortaklık temelli ve uygulanabilir bir finansman modeli olduğu sonucuna varılmıştır."
