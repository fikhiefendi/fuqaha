abstract: "İbn Kadî Simâvna'nın (v. 823/1420) kaleme aldığı Câmiu'l-Fusûleyn adlı eseri İslâm Hukuku alanında önemli bir konuma sahiptir. Câmiu'l-Fusûleyn üzerine onlarca çalışma yapılmıştır. Bu çalışmaların pek çoğu yazma eser halinde kütüphane raflarında mahsur kalmaktadır. Bu eserlerin en önemlilerinden biri, çalışma konumuz Zeynüddin İbn Nüceym'in (v. 970/1653) Hâşiye 'alâ Câmiu'l-Fusûleyn'idir. Câmiu'l-Fusûleyn'de kısa ve öz olarak anlatılan konular Hâşiyetü Câmii'l-Fusûleyn'de ayrıntılı bir biçimde bazı kaynaklara da atıf yapılarak ele alınmıştır. Kitapta her hükmün kaynağı (müellif/eser), isim veya rumuzuyla gösterilmiştir. Eserde Câmiu'l-Fusûleyn'den farklı olarak ekseriyetle Hanefi mezhebi baz alınmıştır.Çalışmamız dirase (araştırma), tahkik ve tahlil (değerlendirme) bölümlerinden oluşmaktadır. Birinci bölümde İbn Kâdî Simavna ve İbn Nüceym'in hayatı, hocaları, öğrencileri, çocukları, eserleri ve kendileri ile ilgili yapılan çalışmalardan bahsedilm-iştir. İkinci bölümde ise, Câmiu'l-Fusûleyn'in tanıtımı ve İbn Nüceym'in Hâşiyetü Câmii'l-Fusûleyn'inin tahkik ve tahlîli sunulmuştur. Metin, eserin Süleymaniye, Kayseri Raşid Efendi, Konya Bölge Yazma Eserler ve Millet Kütüphaneleri'inde dört nüshası karşılaştırılmak suretiyle oluşturulmuştur. Hâşiyede geçen kitap, şahıs, isimleri ve Farsça ve Türkçe cümleler ile alakalı dipnotlarda açıklamalarda bulunulmuştur. Üçüncü bölümde de tahkîkli metin, karşılaştırması yapılan dört nüshadan ikişer sayfa eklemeler, sonuç ve bibliyografya ile tezimiz suna ermektedir."
