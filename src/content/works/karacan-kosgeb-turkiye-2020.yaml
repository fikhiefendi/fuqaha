abstract: "KOSGEB'in KOBİ'lere sağladığı 2012 – 2017 dönemine ait verilen desteklerin değerlendirilmesi esasına dayanan bu çalışmada toplam döneme ait toplam destek tutarının ülkemiz dış ticaretine etkisi üzerine durulmuştur. Tez çalışması kapsamında öncelikle KOBİ kavramı, KOBİ'lerin problemleri, KOBİ'lerin desteklenmesinin ekonomi üzerindeki önemi ve Türkiye'de KOBİ'lere sağlanan destekler değerlendirilmiş ve KOSGEB tarafından KOBİ'lere sağlanan destek programları sunulmuştur. KOSGEB'in 2012 – 2017 dönemlerine ait temel destek göstergelerinin ele alındığı bu araştırmada, Türkiye'de 2012-2017 yılları arasında Thomdon Reuters'ın Eikon Datastream veri tabanları kullanılarak Türkiye'nin dış ticaret verileri analiz edilmiştir. Bu doğrultuda, KOSGEB desteklerinin ithalat, ihracat, işsizlik oranı, enflasyon, ABD Dolar kuru, üretim ve tüketici duyguları endeksine etkisi analiz edilerek değerlendirme yapılmıştır. Çalışma sonuçlarına göre; KOSGEB desteklerinin dış ticaret hacmine pozitif etki ettiği görülmüştür. Bu doğrultuda KOSGEB destek programlarında yer alan destek kalemlerinin nitelikli insan kaynağı, araştırma geliştirme, tanıtım ve markalaşmaya yönelik olarak arttırılması, dış ticaret hacminin büyümesinde sürdürülebilir bir etki yapmasını sağlayacaktır."
