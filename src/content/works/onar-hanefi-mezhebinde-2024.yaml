abstract: "Tarihin en eski zamanlarından beri insanlar arasında ekonomik farklılıklar sosyolojik bir gerçeklik olarak karşımıza çıkmaktadır. İnsanlara bir hayat düzeni sunan İslam, zekât emriyle zengin ve fakir arasında bir köprü oluşturarak aralarındaki ekonomik mesafenin azaltılması hedefiyle toplumsal huzur ve barışa katkı sağlamıştır. Toplumun en önemli gelir kaynaklarından biri olan tarım ürünleri de zekât verilecek mallar kapsamında değerlendirilmiştir. Tarım ürünlerinin zekâtını ifade eden öşrün farziyeti ayetle sabit olup hükümleri Hz. Peygamber (s.a.v.)'in sözlü ve fiilî uygulamalarıyla şekillenmiştir. Bu da rivayet temelli birtakım görüş farklılıklarını beraberinde getirmiştir. Çalışmamızın birinci bölümünde öşür ile ilgili meseleler Hanefî mezhebinin kurucu imamı Ebû Hanîfe ile iki öğrencisi Ebû Yûsuf ve İmam Muhammed'in görüşleri çerçevesinde incelenmiştir. Günümüz dünyasında teknolojinin gelişmesi ve tarımsal faaliyetlerin farklılaşması sonucunda öşürle ilgili oluşan sorulara cevap bulmaya çalışılmıştır. Bu anlamda öşrün temel meseleleri Hanefî mezhebinin klasik kaynaklarına başvurularak ele alınmış günümüz tartışmaları için fetva kurulları ve günümüz araştırmacılarının görüşlerine yer verilmiştir. İkinci bölümde ise zekâtın kurumsallaştığı ülkelerdeki öşür uygulamalarına odaklanılarak hem literatürdeki tartışmaların yansımaları incelenmiş hem de günümüzde oluşan farklılıkların uygulamaya etkisi tespit edilmeye çalışılmıştır. Bu ülkelerdeki öşür uygulamaları ele alınırken varsa kanun metinleri veya ülkede itimat edilen fetva kurullarının sitelerine başvurulmuştur. Zekâtın devlet eliyle yönetilmesinin günümüz şartlarında imkânını gözlemleme fırsatı bulduğumuz bu çalışmada, kurumsallaşmanın zekâtın etkinliğinin artırılmasında ve bireylerde zekât bilincinin oluşmasında olumlu etkisi olacağı sonucuna ulaşılmıştır. Öşürle ilgili meselelerin günümüz şartlarında tarım sektöründeki değişimler dikkate alınarak yeniden ele alınması gerektiği sonucuna ulaşılmıştır."
