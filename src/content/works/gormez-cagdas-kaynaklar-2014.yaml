abstract: "Ortaçağ İslâm iktisat düşüncesinin içeriğinin ve niteliğinin düşünür, eser ve bâzı iktisâdi tartışma konuları bazında incelenmesi, ortaçağ İslâm iktisat düşüncesine eserlerinde yer vermeyen ya da çok az yer veren birçok modern dönem batılı iktisâdi düşünce tarihçisinin bu yaklaşımlarının arkasında yatan sebebin araştırılması ve de ortaçağ İslâm dünyasında iktisat zihniyetinin ve iktisat ahlâkının ana hatlarıyla incelenmesi bu çalışmanın konularıdır. Çalışma beş bölümden oluşmaktadır. Birinci bölümde, Avrupa merkezli bakış açısı kısaca incelenmiş ve eleştiriye tâbi tutulmuştur. Akabinde ise modern dönem batılı iktisâdi düşünce tarihi çalışmalarında ortaçağ İslâm iktisat düşüncesine karşı gösterilen olumsuz yaklaşım ve bu yaklaşımın sebepleri incelenmiştir. İkinci bölümde, ortaçağ İslâm dünyasında iktisat zihniyeti ve iktisat ahlâkı, ortaçağ İslâm düşünürlerinin iktisâdi meselelere yaklaşımları ve ortaçağ İslâm iktisat düşüncesinin özellikleri ana hatlarıyla incelenmiştir. Üçüncü bölümde, ortaçağ İslâm bilim dünyasında kaleme alınmış ve iktisâdi düşünce içeren eserler bir sınıflandırmaya tâbi tutulmuş ve her sınıfın ortaçağ İslâm iktisat düşüncesi açısından önemi ana hatlarıyla açıklanmıştır. Dördüncü bölümde, ortaçağ İslâm dünyasında yaşamış ve iktisâdi düşünce beyan etmiş düşünürler ve bu düşünürlerin iktisâdi düşünceleri hakkında bilgi verilmiştir. Beşinci bölümde, hem modern dönem batılı iktisâdi düşünce tarihçilerinin hem de ortaçağ İslâm düşünürlerinin incelediği tartışma konularından bazıları detaylı olarak incelenmiştir. Birinci ve ikinci bölümlerin yanı sıra, ortaçağ İslâm iktisat düşüncesinin içeriğinin ve niteliğinin araştırılması amacına dönük üçüncü, dördüncü ve beşinci bölümlerde de İngilizce veya Türkçe kaleme alınmış kaynaklardan yararlanılmıştır. Çalışmanın neticesinde, modern dönem batılı iktisâdi düşünce tarihçilerinin Avrupa merkezli bakış açısının etkisiyle ortaçağ İslâm iktisat düşüncesine eserlerinde ya hiç yer vermedikleri ya da çok yüzeysel olarak yer verdikleri ve de ortaçağ İslâm iktisat düşüncesinin düşünür, üzerinde tartışma yapılmış iktisâdi mesele ve iktisâdi düşünce içeren eser açısından oldukça zengin olduğu sonuçlarına varılmıştır."
