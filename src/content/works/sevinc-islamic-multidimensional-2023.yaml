abstract: "Bu çalışma, çağdaş İslami ve çokboyutlu bir yoksulluk çerçevesini kavramsallaştırma girişimidir. İlk olarak, bir ön çalışma niteliğinde, çeşitli disiplinlerin literatürlerini kullanarak bir model önermiş ve ilgili bir temel oluşturmuştur. Daha sonra uzman görüşmesi yöntemi ile modelin geçerliliğini test etmiş; yani, sekiz küresel yoksulluk uzmanının önerilen model hakkındaki görüşlerinden faydalanmıştır. Üçüncü olarak, özellikle önerilen modele atıfta bulunarak mevcut endekslerin eksikliğini göstermek için Türkiye için mevcut yoksulluk ölçümlerini ve verilerini toplamıştır. Dördüncü olarak, Osmanlı İmparatorluğu'ndaki zekat uygulamasını yeniden incelemiştir. Zekatı, önerilen model doğrultusunda yoksullukla mücadelede olası bir strateji olarak görmüş, ayrıca Türkiye'yi Osmanlı'nın önemli bir varisi olarak değerlendirmiştir. Gelecekteki bir çalışma, aynı yönde bir yoksulluk endeksi oluşturmak için kalan adımları tamamlayabilir. Bu adımlar şu şekildedir: boyutların ağırlıklandırılması, göstergelerin seçilmesi, yoksulluk içerisinde bulunan insanların tespiti- yani, seçilen her gösterge için yoksulluk sınırının belirlenmesi ve boyutların olası bir bileşik endeks şeklinde birleştirilmesidir."
