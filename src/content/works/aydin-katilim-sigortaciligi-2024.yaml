abstract: "Tekâfül/katılım sigortacılığı, konvansiyonel sigortaya karşı alternatif olarak sunulmuş bir risk yönetimi anlayışıdır. Retekâfül de aynı doğrultuda fıkhî uyum iddiasıyla sigorta sisteminin ayrılmaz bir parçası olan reasüransa alternatif olarak ortaya çıkmıştır. Tekâfül sisteminin gücü ve istikrarı retekâfül şirketlerinin mali kapasitelerine ve aynı zamanda retekâfül uygulamalarının İslam hukuku ilkeleri ile uyumuna bağlıdır. Katılım finansın konvansiyonel sistemden ayrıştığı önemli bir husus olan şerʿî yönetişim retekâfül programının uygulanmasında belirleyici olmalı ve retekâfül anlaşmalarının düzenlenmesinden programlarının uygulanmasına sürecin her aşamasında aktif biçimde yürütülmelidir. Tekâfül sigortacılığının ilk yıllarında sektörün sürdürülebilirliği amacıyla retekâfül operatörlerinin sayı ve kapasite bakımından yetersiz oluşu zaruret bağlamında konvansiyonel reasüransla iş birliği uygulamalarına yol açmıştır. Bu çalışmada retekâfül sistemi tüm boyutlarıyla ele alınırken zamanla ticari bir esnekliğe dönüşen uygulamaların sistemin bağımsızlaşmasına ve gelişmesine olan negatif yansımaları araştırılmıştır. Nitel yöntem ve keşifsel araştırma deseni kullanılarak retekâfülün işleyişi ve gelişimi geleneksel reasürans ile mukayese edilerek incelenmiştir. Sektör raporları, şirket faaliyet raporları, ilgili mevzuatlar, standartlar ve resmi web sitelerinden elde edilen veriler aracılığıyla uygulamalar değerlendirilmiştir. Bu çalışmada önceki çalışmalardan farklı olarak retekâfül bütüncül bir bakış açısıyla ele alınmış, retekâfül için olması planlanan sistem ile uygulamanın karşılaştırılmalı analizi yapılmaya çalışılmış, uygulamadaki problemlere bazı çözüm önerileri sunulmuştur. Bu kapsamda zaruretin varlığının dahi tartışıldığı ancak zaruret bağlamında değerlendirilen uygulamaların reformuna yönelik çabaların yetersiz olduğu öne çıkmaktadır. Zaruret fetvasının uygulanması sürecinde bazı parametreler geliştirmenin ve standartlar belirlemenin fıkhî uyumu ve buna bağlı olarak retekâfül sistemini güçlendireceği öngörülmektedir. Öte yandan retekâfül sisteminin yeterince gelişememesinin arka planında retekâfülün teberru akdi üzerinden temellendirilmesi ve bu eksende tasarlanan işletme modellerinin karmaşıklığı ve teknik maliyetlerinin görece yüksek olması da yer almaktadır. Bu çerçevede önemli referans kaynağı olan ancak realiteyi tam anlamıyla yansıtamayan AAOIFI ve IFSB retekâfül standartlarının revize edilmesinin de olumlu sonuçlar doğuracağı öngörülmektedir."
