abstract: "Bu tezde, Kur'ân'daki ahkâm âyetlerinde bulunan esmâ-i hüsnâ fâsılaların, hükümlere ne tür bir etkisi olduğu ortaya konulmaya çalışılmıştır. Ahkâm âyetleri, İslam hukuku açısından çok büyük bir yere sahip olduğundan, usul ve füru bakımından yüz yıllar boyunca incelenmiştir. Ancak fark edildiği kadarıyla genellikle bu incelemeler âyetlerin emir ve yasak bildiren ilk üslupları üzerinden olmuştur. Fakat âyet sonlarıyla alakalı kısımlar araştırıldığı zaman buralarda hükümlerle kuvvetli bir bağ içerisinde olduğu görülmekte ve ilk dönem eserlerde müstakil olarak değil parça parça değinildiğine şahit olunmaktadır. Dolayısıyla bu çalışma ahkâm âyetlerinde tespit edilen hükümlerin fâsılalar tarafından tekit edildiğini ortaya çıkarması bakımından önem arz etmektedir. Tez iki bölümden oluşup ilk bölümde fâsıla kavramı hakkında genel bilgi sunulmuş, ikinci bölümde ise, fâsılanın hüküm âyetleri üzerindeki etkisi üzerinde durulmuştur."
