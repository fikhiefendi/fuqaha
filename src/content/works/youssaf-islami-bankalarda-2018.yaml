abstract: "Araştırma için Şeriatın yatırım anlaşmaları, İslam bankaları; araştırma özellikleri önemli açıklama bakın, en önemli kriter denetimleri kılavuzu davranışı İslam yatırımcı uygun aslında, İslam, ayırma kavramı, yatırım ve dünya değerleri ve ilkeleri elde etmek amacıyla, sokak bilge yatırım süreci böylece genel refah, bireysel ve topluluk ve sosyal ve ekonomik büyüme ve istikrar, Ve zorluklar ve riskler karşısında, FSA ve mekanizması, İslami bankalar ve arama bir demet bulgular ve öneriler."
