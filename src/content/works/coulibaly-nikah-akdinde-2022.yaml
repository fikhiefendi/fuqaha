abstract: "Sosyal düzen kurallarından oluşan İslam Hukuku, bu niteliğiyle Müslümanların ibadet hayatı yanında sosyal ve iktisadi hayatına dair ayrıntılı hükümler ihtiva etmektedir. Muâmalât bölümünde yer alan evlilik, fıkıh bilimi içinde önemli bir yere sahiptir. Günümüzde olduğu gibi, İslam Hukukunda da yuvanın tesisi görüşme, söz kesimi, evlilik hazırlığı ve nikâh akdi gibi birtakım aşamalardan geçer. Biz bu incelememizde fıkıh literatüründe nikâh konusunu, Hanefî mezhebi ile Malikî mezhebi arasındaki ihtilaflı meseleleri mukayeseli şekilde ele alarak fıkıh araştırmalarına katkıda bulunmayı amaçladık. Nikâh akdi konusunda mukayeseli inceleme olan bu çalışmamız, bir giriş ve iki bölümden oluşmaktadır. Giriş kısmında: Araştırmanın amaç, yöntem, problemi ile kaynaklarına dair bilgiler vermenin yanında, konunun fıkıh içindeki konumuna ve kapsamına değinilmiştir. Birinci bölüm içinde Nişan ve Nikâh Akdiyle İlgili İhtilaflı Meseleler, başlığı altında nişan, nikâhta velayet, denklik ve şahitlik, mehirle ilgili meseleler ele alınmıştır. İkinci bölümde ise geçersiz evlilikler konusunda Hanefî ve Malikîler arasında tartışmalı meseleleri ve eşler arasında haklar konusunda tartışmalı meseleler irdelenmiştir. Çalışmamız, ulaştığımız neticeleri ve önerilerimizi içeren bir sonuç bölümüyle tamamlanmıştır."
