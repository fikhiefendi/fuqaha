abstract: "Tez, Kur'an-ı Kerim ve Hz. Kur'an-ı Kerim'in anlamı ve Peygamber Efendimiz'in sünneti, ardından fakirlik kelimesi ve Kur'an-ı Kerim'deki eş anlamlıları, çalışma birinci bölümde manevi, maddi ve bilimsel açıdan fakirlik çeşitlerini ele almıştır. fakirlik, sonra açlık ve borcun tezahürü ile fakirliğin tezahürleri, ardından ikinci bölümde Kur'an-ı Kerim'de fakirliğin sebepleri, faiz yemek, Allah'ın indirdiği ile hükmetmekten vazgeçmek ve zekatı engellemek, sonra Peygamber Efendimizin Sünnetindeki sebepler, Zorluksuz, günahsız, hastalıksız insanlara ve fakirliğin imana, ahlaka ve güzel ahlaka ve Müslüman aileye tesiriyle yarattığı sonuçları sorarak, ardından üçüncü bölümde I. Kur'an-ı Kerim'de ve Peygamber'in Sünnetinde yoksullukla mücadele yollarını, emeğin rolü ve standartları ve onun tarımsal, endüstriyel ve ticari kaynakları, ardından zekatın yoksullukla mücadeledeki rolü ve devasa mali gücü aracılığıyla ele aldı. Eğer iyi toplanır, yatırılır ve hak edenler arasında adil bir şekilde dağıtılırsa, fakirler ve muhtaçlar için halkın geneline fayda sağlayan kollar, daha sonra Allah rızası için cihadın rolünü tartışmak, barış onun üzerine olsun, rolü aracılığıyla. ganimet Son olarak, sonuç bölümünde araştırmacının ulaştığı en önemli bulgu ve öneriler yer almaktadır."
