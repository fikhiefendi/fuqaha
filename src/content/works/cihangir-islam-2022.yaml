abstract: "Bu tezin amacı, âdil yargılamanın gerektirdiği prensiplerin, İslam hukuk sistemindeki karşılığını bulmak ve bu sistemde yer alan adalet ilkelerinin yeterliğini saptamaktır. Bu amaç doğrultusunda, çalışmanın ilk bölümünde, yargı ve adalet ile ilgili tanımlamalara yer verilmiş, devleti oluşturan yasa, yönetim ve yargı gibi temel unsurların adalet ile olan yakın ilişkisi ele alınarak incelenmiştir; ikinci bölümde, âdil yargılamanın esasını oluşturan temel ilkelerin ve âdil yargılamayı engelleyen faktörlerin tespitine yer verilmiştir. Hukuk devletini meydana getiren temel ilkelerin başında âdil yargılama ilkesi gelmektedir. Herkes, kanunla yetkilendirilmiş mahkemelerde bağımsız, tarafsız ve hakkaniyete uygun bir şekilde yargılanma hakkına sahiptir. Yargı makamları ise, yargılamanın bütün aşamalarında taraf tutmaksızın, her türlü iç ve dış etkenlerden bağımsız hareket etmekle yükümlüdür. Tezimizde, İslam hukuk sisteminde adaletin hassas terazilerle ölçülmek suretiyle mahkemelerde uygulandığı, yargı karşısında her türlü yetkinin ve gücün etkisiz olduğu saptanmıştır. Bu bağlamda İslam hukuk teorisinin, insan hakları düzleminde âdil yargılamayı sağlayıcı türden pek çok ilkeye sahip olduğu, ancak pratikte yargısal adalet mekanizmalarının fonksiyonel bir şekilde işletilememesinden kaynaklanan eksikliklerin İslam'ın adalet imajını zedelediği anlaşılmaktadır."
