abstract: "Bu çalışma giriş ve üç bölümden oluşmaktadır. Çalışmanın girişinde kelam ve fıkhın tanımlarında geçen ortak unsurlar açıklanmış ve din bilimleri içinde kelam ve fıkıh usûlünün yeri ele alınmıştır. Çalışmanın birinci bölümü İslam hukuk teorisinin kelamî temellerine ilişkindir. Burada özellikle hüküm problemi üzerinde durulmuş ve hükümle ilişkili olmak üzere hâkim bahsi incelenmiştir. Öncelikle genel hukuk teorileri bakımından hukukun kaynağı, akabinde İslam hukuku açısından hukukun kaynağındaki irade değerlendirilmiştir. Bu bağlamda İslam hukukunun kaynağında ilahî irade mi beşerî irade mi bulunduğu yoksa hukukun, akılla olgunun kavranmasından mı ibaret olduğu açıklanmıştır. Hukukun kaynağı nedir sorusunun kelamî/felsefî bir problem olduğu husn-kubh meselesi üzerinden dile getirilmiştir. İkinci bölümde fıkıh usûlünün kaynakları olarak kabul edilen Kitab ve sünnete yer verilmiştir. Bu doğrultuda Kitab ve sünnetin tanımına kelamın etkisi, Kitab ve sünnetin kaynaklık niteliği ve dinde otorite oluşları incelenmiştir. Kitab'ın tanımını yapan kelam yine aynı konuyla ilişkili olmak üzere Allah'ın kelamının kadîm mi hâdis mi olduğu problemini değerlendirmiştir. Söz konusu problem kelamda ele alındığı şekliyle ilişkili olarak fıkıh usûlünde de kullanılmıştır. Buna göre birinci bölümde geçtiği üzere, Allah'ın hitabının kadîm mi hâdis mi olduğu problemi emir, umum ve nesih gibi konular bağlamında bu bölümde incelenmiştir. Çalışmanın üçüncü bölümünde fıkıh usûlünün yöntemlerini belirlerken kelamdan ne ölçüde yararlandığı ele alınmıştır. Bu bölümde fıkıh usûlünün icma, kıyas, istihsan, maslahat gibi yöntemlerinin belirlenmesinde kelamın etkisi üzerinde durulmuştur. Kitab ve sünnetten şer'î delillerin çıkarılması işlevini gören ya da söz konusu şer'î delillerin kesinlik düzeyini belirlemede kendilerine başvurulan icma, kıyas, istihsan gibi fıkıh usûlü tarafından kullanılan yöntemler hem şer'î delil olarak isimlendirilmekte hem de yöntem niteliğinde kabul edilmektedir. İşte burada da kelamın etkisi gözükmektedir."
