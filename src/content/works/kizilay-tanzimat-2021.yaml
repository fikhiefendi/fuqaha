abstract: "Tanzimat ile birlikte Osmanlı Devleti hukuk ve yargı sisteminde birtakım değişikliklere gitmiştir. Bu kapsamda fıkhi birikim kanunlaştırılmaya başlanmıştır. Fıkhi açıdan ele alınıp tartışılan ve bugün haksız fiil sorumluluğu kapsamında ifade edilen konular da Tanzimat Dönemi'nde kanun metni hâline getirilmiştir. Çalışmamızda Hanefî fıkhında haksız fiil sorumluluğunu ele alarak konu özelinde Osmanlı Devleti'nin fıkhi birikimi nasıl kanunlaştırdığını ve bunları nasıl uyguladığını tespit etmeye çalıştık. Bunun için öncelikle Tanzimat ve sonrasındaki süreci anlamaya gayret edip kanunlaştırma olgusu üzerinde durduk. Haksız fiil sorumluluğunun Tanzimat ve sonrası dönemdeki uygulamasını görmek için kanun metinleri ile birlikte kanunların uygulandığı mahkemelere ait dava kayıtlarını inceledik. Gerektiğinde arşiv kayıtlarına da müracaat ettik. Buralardan elde ettiğimiz verileri işlediğimizde Tanzimat ve sonrasında haksız fiil sorumluluğu açısından Hanefî fıkhına bağlı kalındığını gördük. Kanunlaştırma esnasında Hanefîliğe ait bazı klasik görüşlere yer verilmediğini söyleyebiliriz. Lakin bu, kanunlaştırmanın etkisinden ziyade mezhebin toplumsal ihtiyaçları dikkate alarak yeni olay ve olgular karşısında hareket kabiliyeti sunan sisteminden kaynaklanmaktadır. Zaman içerisinde birçok aklın süzgecinden geçerek tutarlılığını korumuş olan bu sistem, Tanzimat ve sonrası dönemde de kendini göstermektedir."
titleTranslation: {"en": "Tort responsibility in Ottoman practice after the Tanzimat"}
