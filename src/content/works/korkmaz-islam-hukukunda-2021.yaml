abstract: "Tez, giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi, sınırlandırılması, yöntemi, literatürü ve sunumu hakkında bilgiler verildi. Birinci bölümde evliliğin sona ermesi ile ilgili konularda çok fazla detaya girmeden klasik ve günümüz kaynaklarından istifade ederek genel bilgiler verildi. İkinci bölümde ise tezimizin asıl konusunu teşkil eden İslâm hukukunda evliliğin sona ermesi bağlamında Talâk Sûresi'ni tahlil etmeye çalıştık. Başta Kur'ân ve Sünnet olmak üzere, klasik dönem İslâm kaynaklarından, günümüzdeki kaynaklardan istifade ederek konumuz hakkında tahliller yapıldı. Karşılaştırmalar yapılıp, farklılıklar veya benzerlikler ortaya konuldu. İçerik olarak talâk, talâkta ve ric'atta şahitlik, iddet, iddet esnasında kadının nerede kalacağı, boşanma durumunda erkek ve kadının çocuğun emzirilme konusundaki sorumlulukları, kadının iddet esnasında nafaka hakkı gibi konular değerlendirildi. Sonuç bölümünde genel değerlendirme ile araştırmamız tamamlandı."
