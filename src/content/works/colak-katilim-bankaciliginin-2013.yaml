abstract: "Türk bankacılık sektörü için 2001 krizi bir milat olmuştur. Çalışma da 2001 sonrası dönemde yeniden yapılanma sürecine giren Türk bankacılık sektörü için ilgili sürecin bir düzene kavuşması ve özel finans kurumlarının katılım bankası unvanına sahip olarak tanınır duruma gelmesi 2005 yılını bulmuştur. Çalışma da bu nedenle 2005-2012 dönemi için sektörün durumu ve katılım bankalarının durumu incelenmeye çalışılmıştır. Performans göstergeleri ve finansal istikrar unsurları üzerinden değerlendirilen katılım bankacılığı hakkında sektördeki durumu ve finansal istikrara katkısı üzerine değerlendirmeler yapılmıştır. Katılım bankacılığı sektör içerisinde performans kriterleri ve istikrar unsurları açısından değerlendirildiğinde genel olarak olumlu sonuçlara ulaşılmıştır. Ancak katılım bankaları sektördeki payları sebebi ile gereken sinerjiyi yaratamamaktadırlar. Sektördeki paylarının az oluşu piyasa da istedikleri yönde uygulamalar gerçekleştirmelerini engellemektedir. Bunun için piyasaya rekabeti arttıracak yeni katılım bankalarının girmesi alınacak olan payı arttırması yönünden önemlidir. Piyasaya giriş yapan yeni katılım bankaları ile bilinirlik artacak ve buna bağlı olarak arkasından güveni getirecektir. Piyasada payını arttırarak uygulamalar gerçekleştirebilecek konuma gelen katılım bankaları spekülatif amaçlı işlemlerin azalmasına, piyasada fonların yatırım, üretim faaliyetlerine kaymasına neden olarak finansal istikrarı sağlarken ekonomiye de gereken katkıyı yapacaktır."
