abstract: "Bir ülkeye yasadışı giriş yapmak veya bir ülkede yasadışı şekilde kalmak anlamına gelen düzensiz göç, yabancıların çeşitli yaptırımlara tabi tutulmaları sonucunu doğurmuştur. Söz konusu yaptırımlardan bir tanesi sınır dışı etme müessesesidir. Müessesenin, yabancıların yaşam, işkenceye uğramama ve özel ve aile hayatına saygı hakları gibi temel insan haklarını etkilemesi, uluslararası düzenlemelerde bu konunun ele alınması sonucunu doğurmuştur. Göç alan devletler de mezkûr konuya, yine aynı sebeple ulusal düzenlemelerinde yer verme ihtiyacı duymuşlardır. Uluslararası anlamda yabancıları sınır dışı edilmeye karşı koruyan en etkili düzenleme AİHS'tir. Sözleşmede doğrudan sınır dışı etme müessesesini konu alan tek düzenleme Ek 4 No'lu Protokol'ün yabancıları topluca sınır dışı edilmeye karşı koruyan 4'üncü maddesidir. Buna karşın sözleşmenin muhtelif maddeleri yabancıları sınır dışı edilme tehlikesine karşı dolaylı bir şekilde korumaktadır. Bu hakları ihlal ettiği düşünülen idari işlem ve eylemlere karşı başvurulabilecek etkili bir yargı yolu, yani AİHM'nin bulunması da AİHS'nin yabancıları sınır dışı edilmeye karşı koruyan en etkili düzenleme olarak ön plana çıkmasına sebep olmaktadır. Göç eden yabancılar için hedef veya transit ülke konumunda olan Türkiye, bilhassa Suriye iç savaşından sonra büyük bir göç dalgasına maruz kalmış ve bu sebeple kapsamlı bir düzenleme yapma ihtiyacı doğmuştur. Bu doğrultuda 04/04/2013 tarihinde 6458 sayılı YUKK kabul edilmiştir. Kanunun 53'üncü maddesinde sınır dışı etme kararına karşı, kararın tebliğinden itibaren yedi gün içinde idare mahkemesine başvurabileceği belirtilmiştir. Kanunun yeni olması ve idare mahkemelerinin, uzmanlaşmadıkları bir alanda bir anda büyük bir yük altında kalmaları birçok uyuşmazlıkta hukuka aykırı karar verilmesi sonucunu doğurmuştur. Söz konusu probleme dikkat çekmek adına yapılan bu çalışmada, sınır dışı etme müessesesinin AİHS ve Türk hukuku bağlamında değerlendirilmesi ve Türk idare mahkemeleri tarafından verilen kararların AİHM içtihatlarına uygunluğunun incelenmesi amaçlanmaktadır. Çalışmanın ilk bölümünde sınır dışı etme kavramı ele alındıktan sonra sınır dışı etme müessesi ile bağlantılı olan geri gönderme yasağı, toplu sınır dışı etme yasağı ile suçluların iadesi, geri çevirme ve terke davet kavramları kısaca incelenecek ve sınır dışı etme müessesesinin bazı uluslararası düzenlemelerde nasıl ele alındığı üzerine durulacaktır. İkinci bölümde sınır dışı etme müessesesi bilhassa bazı AİHM içtihatları üzerinden AİHS bağlamında değerlendirilecektir. Bu bölümde mahkemenin yaşam hakkı, işkence yasağı ve aile ve özel hayatın korunması hakları bağlamında yapılan başvuruları hangi kriterler üzerinden değerlendirildiği incelenecektir. Çalışmanın üçüncü ve son bölümünde ise öncelikle sınır dışı etmenin Türk hukukunda, 6458 sayılı YUKK'de nasıl ele alındığı incelenecek ve Türk idare mahkemelerinin sınır dışı etme konusunda aldığı kararlar AİHM içtihatları çerçevesinde ele alınacaktır."
