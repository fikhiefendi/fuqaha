abstract: "Giriş bölümünde, incelenen konunun anlaşılmasını kolaylaştıracak temel bilgiler verilmiştir.İkinci bölümde, İslam hukuku açısından insan hakları konusu incelenmiş, İslam'da“insan”tanımı, temel hakların yaratılıştan Allah tarafından verildiği, temel hakların İslam'da temellendirilmesi, İslam açısından öteki kavramı, İslam Âlemindeki insan haklarını yazılı belge haline getirme çalışmaları, İslam ve Batı dünyasındaki evrenselciler ve cemaatçiler, Batılı anlamdaki insan hakları alanındaki çelişkiler işlenmiştir. Daha sonra, kavramsal olarak insan hakları, tanımı, tarihi gelişimi, çok yönlülüğü, evrensellik iddiası, 18. y.y. dan itibaren gelişimi, Batılı Devletlerin tutumu ve bu hususlardaki eleştiriler genel olarak incelenmiştir. Sonrasında ise, ayrımcılık yasağının tanımı ve ilişkili kavramlar olan, Önyargı, Taciz, Mağdurlaştırma, ötekileştirme, Hak, Adalet ve Eşitlik kavramları irdelenmiştir.Üçüncü Bölümde, cinsiyet temelli ayrımcılığın tarihi kökenleri inceleme konusu yapılmış, Roma, Yunan, Ortaçağ, Uzakdoğu, Arap Cahili toplumlarında ve günümüz toplumlarındaki toplumsal ve felsefi kökenleri tespit edilmeye çalışılmıştır.Dördüncü Bölümde, İslam'ın genel olarak kadın ve erkeğe bakışı ve medeni haklar açısından, en çok itiraz konusu yapılan, kadının tanıklığı, miras payı ve boşanma hakkı konuları incelenmiştir.Bu bölümün ikinci kısmında ise, Siyasi haklar konusu incelenmiş, kadının seçme ve seçilme hakkı, devlet başkanlığı, hâkimliği ve diğer kamu görevlerini yapabilmeleri konuları incelenmiştir.Beşinci bölümde ise, cinsiyet temelli ayrımcılıkla ilgili Uluslararası anlaşmalar, Avrupa İnsan Hakları Sözleşmesi ve Avrupa İnsan Hakları Mahkemesi kararlarındaki uygulama yönüyle konu irdelenmiş ve Türkiye toplumunu yakından ilgilendirmesi sebebiyle Leyla Şahin AHİM. Kararı genişçe incelenmiştir."
