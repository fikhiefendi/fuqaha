abstract: "İslam ceza hukukunda suçlu için çeşitli cezalar öngörülmüştür. Bu cezaların bazıları Şari' (Allah) tarafından belirlenmiş olmakla beraber pek çok ceza ve uygulaması ise Kur'an ve sünnette kesin bir şekilde açıklanmamıştır. Bu durumun başlıca sebepleri zamanın geçmesi ile maslahatlarda ve mefsedetlerdeki değişimler ve Yüce Allah'ın suç ve cezalarla ilgili bırakmış olduğu bilinçli boşluklardır. Yüce Allah tarafından bırakılan bu bilinçli boşluklar İslam hukuk tarihinde devlet başkanları veya hakimler tarafından belirlenen çeşitli kanun ve nizamnameler çerçevesinde doldurulmaktadır. İslam ceza hukukunda devlet başkanı tarafından belirlenen suç ve cezalar için“ta'zir”kavramı kullanılmaktadır. Elinizdeki çalışmada biz ta'zir cezalarından sayılan para cezaları üzerinde durmaya çalıştık. Para cezalarının klasik dönemde ve Osmanlı döneminde uygulanması çeşitli farklılıklar arz etmektedir. Bazı fıkıh âlimleri para cezalarının İslam hukukunda meşruiyet kaynağının Kur'an ve sünnet olduğunu kabul etmekle birlikte; Ebu Hanife, Muhammed b. Hasan eş-Şeybânî ve çoğu Hanefî fakihi para cezalarını meşru olarak kabul etmemişlerdir. Bunun yanı sıra Ebu Yusuf gibi bazı Hanefî âlimleri, çeşitli Malikî ve Hanbelî âlimleri mali cezaların ve bu arada para cezasının İslam hukukunda uygulanabileceğini savunmuşlardır. Osmanlı devleti ceza uygulamasında ise para cezaları büyük önem arz etmiş ve pek çok suçta cezai yaptırım olarak kabul edilmiştir. Elinizdeki çalışmada bunun örnekleri kanunnameler üzerinden incelenerek değerlendirmeye tabi tutulmuştur."
