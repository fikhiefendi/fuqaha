abstract: "Birçok medeniyete ev sahipliği yapan Sofya, XIV. yüzyılda Osmanlı Devleti'nin hâkimiyetine girmiş ve Rumeli Eyaleti'nin Paşa sancağı olmuştur. Ticarî yollar, menzil ve ulaşım yolları üzerinde, sosyal, ekonomik ve askerî açıdan önemli bir merkez haline gelmiştir. Diğer kazalarda olduğu gibi Sofya kazasında da görülen davalar kadıları tarafından Şer'iyye Sicillerine kaydedilmiştir. Şer'iyye Sicilleri, sosyo-ekonomik, askerî ve siyasî açıdan yazıldıkları dönemi yansıtan mühim kaynaklardır. Çalışmamızın kaynağı, Bulgaristan Milli Kütüphanesi'nde bulunan“Hicri 1151-1152, Milâdi 1738-1739”tarihlerine ait olan S 20 Numaralı Sofya Şer'iyye Sicili'dir. Defterde bulunan konuların çoğunluğunu 1736-1739 Osmanlı - Rus ve Avusturya Savaşı'nın sefer hazırlıkları oluşturmuştur. Sefer hazırlıkları haricinde vergi, miras, borç, kefalet davalarını içeren belgeler de bulunmaktadır. Transkripsiyonu yapılan sicil, içeriğindeki konulara göre değerlendirmeye tabi tutulmuştur. Çalışmanın amacı Sofya'nın Osmanlı askerî teşkilatlanmasındaki yerini gösterebilmek, yerel tarihine kaynaklık edebilmektir."
