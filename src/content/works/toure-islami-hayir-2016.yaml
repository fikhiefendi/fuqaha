abstract: "Allah'a hamdeder, kendisinden peygamber gelmeyen Muhammed (sav)'e salat ve selam ederim. Peygamber (sav)'in ailesine ve arkadaşlarına kıyamet gününe kadar salat ve selam olsun. Bir merhamet, kucaklaşma, şefkat ve dayanışma dini olması, İslam'ın üzerinde durulması gereken özelliklerindendir. İlk ortaya çıktığı günden beri İslam, çeşitli özelliklerinin yanında bu özellikleriyle özdeşleşmiştir. Merhamet Peygamberiyle yola koyulan İslam, birbirlerine merhametli ashab (ra)' la yoluna devam etmiş ve bu güzel özellikleriyle de hâlâ yolculuğunu sürdürmektedir. Müslümanlar ilk sıralarda çok zayıflardı. Bu sırada Allah kendilerini oldukları yerde sağlamlaştırıncaya kadar birbirlerine dayanıyor, birbirlerinden güç alıyorlardı. Rasulullah (sav) Mekke'den Medine'ye hicret ettiğinde yaptığı işlerden ilki ashabın birbirlerine kefaletini emretmek olmuştu. Ardından Ensar ve Muhaciri tarihin hiçbir evresinde görülmeyecek şekilde kardeş kıldı. İşte bu olaylar, bu dinin temelinin dayanışma ve kucaklaşma olduğunun açık bir işaretiydi. Onlar, Allah Teala'nın ayetinde övdüğü“birbirlerine merhametli olanlar”idiler. Rasulullah da onlar için,“Mü'minleri , birbirlerini kucaklamada ve merhamette tek bir beden olarak görürsün. Organlardan biri sızladığında diğerleri de hemen ateşlenir ve rahat edemez.”buyurmuştu. Geçen asırlar boyunca ve İslam aleminin genişlemesiyle birlikte bu değer değişime uğradı. Bireysel durumdan kurumsal duruma geçtiler. Böylece bağışları yönetmek daha iyi ve hoş seviyeye ulaştı. İşte bu hayırlı çalışmanın önemine biaen araştırmamızı günümüzde ortaya çıkan İslami hayır kurumlarına tahsis ettik. Nitekim bu hayır kurumları gıda maddeleri ve ayni mallar ile birlikte yetimlerin, esirlerin, fakirlerin ve zorda kalmışların uğrunda yaptıkları faaliyetlerle ayakta durmakta ve aynı zamanda acil durumlarda zarar gören bölgelere mahalli yardımları ve devlet yardımlarını ulaştırmaktadırlar. Anahtar Kelimelre: Ġslamî fHayır Kurumları, Vakıf, Zekat, Sadaka, Sosyal Adaleti,Mezheplerin görüĢleri."
