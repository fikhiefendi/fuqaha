abstract: "İnsanlığın varoluşundan bu yana sosyal ve ekonomik ihtiyaçların karşılanabilmesi için çeşitli mübadele araçlarına ihtiyaç duyulmuştur. Geçmişten günümüze kadar gerçekleşen bu tarihi serüven içerisinde deniz kabukları, altın, gümüş, banknot gibi birçok çeşitli araç kullanılmıştır. Teknolojinin gelişmesiyle birlikte bilgisayar ortamına giren para elektronik cihazlara aktarılarak işlem görmeye başlamış ve sanal ortamda birçok çeşidi çıkmıştır. Bu paraların belirli bir kısmı devlet otoritesi ile piyasaya sürülen paraların dijital temsilini sağlarken, bir kısmı ise herhangi bir otoriten bağımsız bir şekilde üretilmiştir. Zaman içinde kullanım zorluğu ve gelişen teknolojiyle birlikte birçok kez şekil değiştiren para, günümüzde büyük tartışmalara neden olan yeni bir para birimi olarak nitelendirilmek istenilen Kripto para birimlerini gündeme getirmiştir. 2009 yılında piyasaya sürülen ilk Kripto para birimi olan Bitcoin ademi merkeziyetçi yapısıyla dikkatleri üstüne çekmiş ve kullanıcılar tarafından yoğun ilgi görmüştür. Kripto para birimleri hızlı transfer ve düşük maliyet avantajları tercih edilme sebebi olurken, merkezi olmayan bir yapıya sahip olması, yasal düzenlemelerinin olması, değerindeki aşı dalgalanmalar olması gibi birçok riski de beraberinde getirdiği için soru işaretlerine neden olmuştur. Bu risklerle birlikte kullanımın uygun olup olmaması özellikle İslami finans açısından birçok dini kurum ve İslam âlimi tarafından görüş ayrıklarına sebep olmuştur. Bu çalışmada; Geçmişten günümüze kadar değişim gösteren paranın tarihi serüveni ele alınmış ve İslami finans ilkeleri incelenerek literatür ve görüşler doğrultusunda kripto para birimleri ile ilişkilendirilerek değerlendirilmiştir."
