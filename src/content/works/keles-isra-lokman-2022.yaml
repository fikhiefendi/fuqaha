abstract: "İsrâ ve Lokman Sûreleri Kur'ân-ı Kerîm'de bulunan Mekkî sûrelerdendir. İçerik bakımından da iman ve ahlak ile ilgili çarpıcı âyetlere yer verirler. Bu sûrelerde bulunan konuların çoğu Kur'ân-ı Kerîm'den önceki ilahi kitaplarda da yer alan temel dini ve Ahlakî esaslardır. Bahsedilen esaslar sayesinde gündelik yaşantımızda da bu konuların önemini bir kere daha vurgulayıp alışkanlıklarımızdan çıkarmamamız gerektiğini hatırlatarak çalışmamıza başlayacağız. Çalışmamızda iman ve ahlakın tarifinden başlanıp surelerin tanıtımlarına yer verilmiştir. Son olarak da karşılaştırma yapılarak incelenme tamamlanmıştır. İncelememiz neticesinde sûrelerdeki ortak yönlerin fazla olduğu, her iki sûrede de Müslüman bir bireyin sahip olması gereken tutum ve davranışları içerdiği tespit edilmiştir. Bu sûrede, Allah'ın kullarına uyarılarına ve bu uyarılara uymayanlara verilecek cezalara yer verilmiştir. Bununla birlikte Allah'ı bir bilmek, Allah'a şirk koşmamak, kibirli ve riyakar olmayıp iyi niyeti muhafaza etmek de verilen mesajlar arasındadır. Özellikle Lokman Sûresinde dikkat çeken bir yön ise bu uyarıları bir babanın oğluna bizzat yapmasıdır. Baba oğluna nasıl merhamet ediyorsa Allah da kullarına öyle merhametlidir. Bu yüzden rahmetinden ümit kesmeyip uyarıları göz önünde bulunmalıdır. Ayrıca kul, Allah'a olan sağlam inancını kaybetmeyip insanlarla olan samimiyet ve güzel sözünü kesmeden çevresine örnek olmalıdır. Böylelikle bir kez daha özümüze ulaşabiliriz."
