abstract: "Bu tezin amacı, katılım bankaları ile konvansiyonel bankaların farklarını ortaya koymak ve gençler arasında katılım bankacılığının algısını belirlemektir. Bu amaçla tez çalışmasında katılım bankacılığını fon toplama, fon kullandırım ve geleneksel bankalardan farkları özetlenmiştir. Anket uygulaması yapılan çalışmada üniversite okuyan gençlerin katılım bankası hakkındaki bilgi ve algıları üzerine bir araştırma yapılmıştır. 463 öğrenci ile yapılan anket verileri Anova ve t-testi uygulanarak yorumlanmıştır. Yapılan çalışmanın sonucunda katılım bankalarının toplum ve özellikle gençler arasındaki bilinirliğini ve konvansiyonel bankalar ile rekabet edilebilirliğini artıra bilmeleri için yeteri kadar tanıtım yapılmadığı bu yüzden katılım bankalarının tanıtım ve reklamlarla bilinirliklerini artırmaları gerektiği bulgusuna ulaşılmıştır. Ayrıca Katılım bankası yöneticilerinin bankacılık konseptine sadece dini açıdan yaklaşmamaları ilaveten getiri beklentisi olan ancak dini açıdan faiz hassasiyeti olmayan potansiyel müşterileri de kazanmak üzere hizmet tasarımlarını geliştirmeleri gerektiği düşünülmektedir."
