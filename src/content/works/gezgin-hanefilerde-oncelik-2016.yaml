abstract: "Hanefiler, fıkıh mezhepleri içerisinde istihsan yöntemini en belirgin şekilde kullanmışlardır. Kural olarak istihsanı kıyasa önceleyen Hanefiler, bazen kıyası istihsana takdim etmişlerdir. Kıyasın istihsana öncelendiği yerlerdeki istihsanın aslında hafi kıyas istihsanı olduğu bir gerçektir. Hafi kıyas istihsanının, kıyas olduğu düşünüldüğünde takdim edilen kıyasın illeti burada işlevseldir. Zira illetin kuvvet ve zayıflığı kıyasın veya istihsanın tercih edilme tarafını belirleyicidir. Bu araştırmada kıyasın istihsana öncelendiği 11 örneğin tahlili yapılmış olup, bu örneklerde kıyas veçhi, istihsan veçhi ve kıyasın tercih edilme sebepleri açıklanmıştır. Zaruri olarak istihsanın delil oluşunu, bunu kabul eden ve etmeyen ekollerin tez ve antitezlerini de araştırmacılar bu çalışmada bulabilirler."
