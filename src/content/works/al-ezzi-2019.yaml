abstract: "Elinizdeki çalışma Ebû Ya'lâ el-Ferrâ'nın (ö. 458/1066) el-Ahkâmü's-sultâniyye isimli kitabı ile Cüveynî'nin (ö. 478/1085) Gıyâs̱ü'l-ümem adlı eserlerini incelemeyi hedeflemektedir. Bu amaçla adı geçen iki eserde mevcut bulunan yönetim teorisi ile ilgili fikirler analiz yönteminin teknikleri kullanılmak suretiyle mukayeseli olarak tahlil edilmek istenmektedir. Ayrıca yönetim teorisi ile ilgili bazı âlimlerin telif ettikleri eserler ve bu eserlerdeki görüşler de çalışmamızın kapsamı alanındadır. Ebu Ya'lâ ve Cüveynî'nin yönetimle ilgili birçok konuda ittifak halinde oldukları görülmüştür. Bununla birlikte Cüveynî, konuları açıklama noktasında daha detaylı bilgi vermekte ve karşıt görüşleri de eserine alarak konuları tartışmaktadır. Cüveynî'nin kendi eserinde uyguladığı yönteme bakıldığında yönetim konusunda zannî ve katî' ayrımını ilk yapan kişinin kendisi olduğu görülmektedir. O, toplumda neşet eden siyasi olayları iki kısma ayırmaktadır. Bunlar, sayısı az olan sabit meseleler ile sayısı çok olup toplumun maslahatını gerçekleştirmekle bağlantılı değişkenlik gösteren konulardır. Toplumun maslahatını gerçekleştirmekle bağlantılı değişkenlik gösteren konular hakkında da ya doğrudan bir ayet veya hadis yoktur ya da olan ayet ve hadislerin konuya delaletleri kesin değildir. Ebu Ya'lâ ise yönetim ile ilgili fikirlerinde başka mezhepleri zikretmeksizin sadece Ahmet b. Hanbel'in görüşlerine dayanmaktadır. Buna karşılık Cüveynî, Hanbeli mezhebi dışındaki diğer tüm mezheplerin yorumlarından da istifade etmiştir. Bu durum bizlere Şafii ve Hanbeli mezhepleri arasında yönetim konusunda vaki olan ihtilafın hangi boyuta ulaştığını göstermektedir. Çalışmamızda, Ebu Ya'lâ ile Cüveynî'nin yönetim konusundaki birçok fikirlerinde anlayışlarını şekillendiren ana referanslarının Hulefâ-yi Râşidîn'in yönetime getirilmeleri yöntemleri ile onların kendi dönemlerindeki devleti yönetme anlayışlarındaki farklılıklar olduğu görülmüştür. Ebu Ya'lâ ile Cüveynî'nin eserlerini telif ederken yaşamış oldukları çağdan, kültürden, coğrafyadan ne kadar etkilenerek fikirlerini oluşturduğu da çalışmamızda ulaşmak istenilen konulardandı. Sonuçta bu iki eserinde kendi çağlarının bir ürünü olduğu görülmüştür."
