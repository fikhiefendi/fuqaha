abstract: "İslam hukuku insanların dünya ve ahiret hayatını düzenleyen ona bir takım kurallar getiren hukuk nizamıdır. Bu nizam kişilerin hayatlarında dengeli bir hayat sürmelerini ister. Bunun için mü'minin ifrat ve tefritte değil, orta yol üzere yaşamasını hedefler. Azîmet ve ruhsat Müslüman'ın dinî-hukukî hayatında uyabileceği iki kavramdır. Azîmet bütün zaman ve mekâna hitap eden, tüm mükellefler için geçerli olan küllî kaidelerdir. Ruhsat ise, gerekli şartların bulunmasına bağlı olarak bazı mükellefler için geçerli olan hükümlerdir. Kişi dinî hayatında yerine göre azîmetle hareket ederken, şartları oluştuğu zaman ruhsatla amel edebilmektedir. Bu durum dinî hayatın sürekliğini, kulların yükümlülüklerden kurtulmasını sağlarken insanların problemlerine çözüm bulma işini kolaylaştırmaktadır. Tezimiz bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde, genel bir girişten sonra konunun takdimi, sınırlarının tespiti ve kaynakların tanıtımı ile değerlendirilmeler yapılmıştır. Birinci bölümde teklîfî ve vaz'î hükümler, azîmet ve ruhsatın kısımları ele alınmıştır. İkinci bölümde ruhsatlara temel teşkil eden hukukî prensipler ve ruhsat sebepleri incelenmiştir. Üçüncü bölümde uygulama örnekleriyle ibadetler ve muamelât alanındaki örnekler verilerek konunun fürû yönü işlenmiştir. Çalışmamızın gayesi azîmet ve ruhsatı tanıtmak, ruhsatın tatbikat yönlerini vererek, azîmetin her zaman üstün olmadığını, bazı durumlarda ruhsatla amelin tercih edilmesi gerektiğini göstermektir."
