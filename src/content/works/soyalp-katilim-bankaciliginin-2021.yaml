abstract: "İslami finansın, dünyada gelişim süreci esasen 1970 de çıkan petrol kriziyle gündeme gelmiştir. Petrol İhraç Eden Ülkeler örgütü ya da kısaca OPEC in petrol fiyatlarında meydana gelen artışlar sonucu yoğun sermaye birikimi olmuştur. OPEC e üye olan ülkeler halkı Müslüman olan Arap ülkelerdir. Oluşan bu yoğun sermaye birikimi İslami bankacılık alanına yatırımlara neden olmuştur. İslami bankacılığın Türkiye'de gelişim süreci 1980 sonrası dönemde meydana gelmiştir. Özel Finans Kurumları (ÖFK) olarak bilinen İslami bankalar 2005 yılına kadar çalışmalarına devam etmişlerdir. 2005 yılından sonra BDDK (Bankacılık Denetleme ve Düzenleme Kurumu) kanununda yapılan değişiklikler sonucu ÖFK'ler banka statüsüne getirilmiş, bu kurumlara katılım sözcüğü eklenerek, katılım bankacılığı olarak çalışmalarına devam etmişlerdir. Bu çalışmanın temel amacı, katılım bankalarının ekonomik büyüme üzerindeki etkisini araştırmaktır. Bu araştırmanın verileri Bankacılık Denetleme ve Düzenleme Kurumunun resmi internet sitesinden alınmıştır. Alınan veriler 2006 yılı ocak ayı ve 2020 yılı ocak ayı arasındaki zaman dilimini kapsamaktadır. Verilerin analizinde eviews programı yardımıyla zaman serisi kullanılarak Quarter yöntemiyle üç aylık veriler halinde işlenmiştir. Katılım Bankacılığını Ortaya Çıkaran Nedenler Ve Katılım Bankacılığının Ekonomik Büyümeye Etkisinin araştırıldığı bu çalışmada, veriler durağanlık testi, birim kök testi, çoklu yapısal eşbütünleşme testi, uzun dönem eşbütünleşme katsayıları tahmin testi, hata düzelte modeli testi ve garanger nedensellik analizi testi uygulanmıştır. Araştırmanın amacı doğrultusunda yapılan testlerde bağımsız değişkenlerin bağımlı değişken olan GSYH üzerinde uzun dönemli bir etkiye sahip olduğu görülmektedir. Bunun yanı sıra ÖZK ve AKTK'nın GSYH nın garanger nedeni değildir. MEV, KRE, SER GSYH üzerinde çift taraflı nedensellik görülmüştür."
