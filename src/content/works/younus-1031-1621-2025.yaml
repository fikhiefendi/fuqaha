abstract: "Bu araştırma, büyük âlim Zeynüddîn Abdurraûf b. Tâci'l-Ârifîn el-Münâvî'nin (ö. 1031/1621) Şerhu Kitâbi'l-Ubab isimli eserinin Kitâbu'l-Hac bölümünü inceleme ve tahkik etmektedir. Bu şerhin önemi, Safiyyüddîn Ahmed b. Ömer el-Müzecce'in (ö. 930) el-Ubab adlı eserinin öneminden kaynaklanmaktadır. Zira el-Ubab adlı eseri İmam Nevevî'nin Ravdatü't-Tâlibîn adlı kitabındaki meselelerin çoğunu içermekle kalmayıp, üzerine İbnü'l-Mukrî el-Yemenî eş-Şâfiî'nin (ö. 837) Ravdü't-Tâlib adlı kitabındaki meseleleri ve Tecrîdü'z-Zevâid adlı eserinden eklemeler de bulunmuştur. Ayrıca, Şâfiî mezhebinin iki imamı olan er-Râfiî ve Nevevî'nin tercihlerini, daha çok da Nevevî'nin tercihlerini zikretmiştir. Bu sayede eser, İmam Şâfiî'nin ve ashabının görüşlerinin çoğunu bir araya getirmiştir. Tahkik çalışmasında iki el yazması nüsha kullanılmıştır. Zeynüddîn Abdurraûf el-Münâvî'nin biyografisi ve ilmî kişiliği araştırılırken betimleyici-tarihsel bir metot izlenmiştir. Tahkik bölümünde ise, el yazması nüshaları karşılaştırmaya dayanan karşılaştırma metodu kullanılmıştır. Nüshalar arasındaki farklılıklar tespit edilmiş, aynı şekilde metinde geçen âlimlerin görüşleri, ayet ve hadisler kaynaklarından tahric edilip dipnotta belirtilmiştir. Kısaca Zeynüddîn Abdurraûf el-Münâvî, Kur'an, Sünnet ve âlimlerin sözlerinden deliller getirmeye büyük önem vermiştir ve âlimlerin görüşlerinden yaptığı nakilleri kaynaklarına dayandırmış, Şâfiî fıkhının temel eserlerine ve Şâfiî mezhebi imamlarına atıfta bulunmuştur. Aynı şekilde eser, fıkıh metinlerinde bulunmayan ayrıntıları da içermektedir. Zeynüddîn Abdurraûf el-Münâvî'nin eserindeki metodu, Şafii mezhebi imamlarının görüşleri arasından seçim yapmak ve ardından bu görüşler arasında Kur'an, Sünnet veya küllî kaidelerinden gelen sabit delillere göre tercihte bulunmaya dayanmaktadır. Ayrıca Zeynüddîn Abdurraûf el-Münâvî, diğer mezheplerin, özellikle de Mâlikî ve Hanefîlerin farklı görüşlerini de aktarmıştır. Sık sık hükümlerin illetlerini zikretmiş ve bu illetlere bağlı hükümleri açıklamıştır. Bu durum, yazarın geniş bir kültüre sahip olduğunu gösterir. Eserindeki tercihlerinden bazısı şunlardır: Hac masrafını bulan kimse için Hacc'ı, evliliğe tercih etmesidir ki bu kimse günaha düşmekten korkuyorsa, nefsini korumak için evliliği öncelikli tutmuştur. Bir diğeri ise, Mekke'nin yeryüzünün en faziletli yeri olduğunu, ancak Peygamberimizin kabrinin bulunduğu yerin bu hükmün dışında olduğudur. Anahtar Kelimler: İslam Hukuku, Fürû-i Fıkıh, Şâfiî Fıkhı, el-Münâvî, İthâfu't-Tullâb, Hac."
