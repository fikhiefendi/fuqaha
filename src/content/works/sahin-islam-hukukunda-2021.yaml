abstract: "Nikâh akdinin gelişigüzel gerçekleştirilemeyeceği bütün hukuk sistemlerinde yer alan kanunlar yoluyla tespit edilebilmektedir. Tek bir ferdi ilgilendiren bir mevzu olmaması hasebiyle toplum nezdinde bilinmesi gereken bir meseledir. Bu durum, çok eski toplumlarda ilk oluşturulan kanunlardan başlayıp ilahi dinlerde ve günümüze uzanan hukuk kaynaklarında zikredilmektedir. Aynı şekilde İslam hukukunun bu konu üzerinde hassasiyetle durduğu görülmektedir. İslam hukuk sisteminde konular üzerinde uygulanan metotlar birbirinden farklıdır. Yıllar boyunca yapılan katkılarla İslam hukuk sisteminin literatür kapsamı oldukça genişlemiştir. Konumuz olan evlendirme yetkisi de İslam hukuku kaynaklarında ayrıntılı bir şekilde yer almaktadır. Tabii olarak bu geniş kapsamlı literatür içerisinde konunun bütün kaynaklarda incelenmesi zor olacağından belirli bir sınırlandırma gerekmektedir. Çalışmamızda evlendirme yetkisiyle ilgili temel kaynaklar incelenmiştir. Evlendirme yetkisinin İslam hukukunda nasıl ele alındığına imkanlar çerçevesinde değinilmeye çalışılmıştır. Ayrıca konunun medeni hukukta yer alan yönlerine değinilerek, karşılaştırma yapma imkânı elde edilmiştir. Hukuk sistemlerinin farklı olması hasebiyle konunun her yönünün medeni hukukta olmasını bekleyemeyiz. Konuyla ilgili kısımlarda medeni hukuka yer verilmiştir. Konunun tarihsel süreciyle başlanarak ilahi dinlerdeki uygulamalar ile günümüz hukuk sistemlerinde ve İslam hukukundaki uygulamaları karşılaştırmak mümkün olmuştur."
