abstract: "Hanefî hadis anlayışı alanında önemli yaklaşım ve değerlendirmelerde bulunan Tahâvî'nin Şerhu meâni'l-âsâr'ı fıkhî konulara göre yazılmış eserlerden biridir. Önceki Hanefî imamlarının yöntemlerinden istifade eden Ebû Ca'fer, ihtilaflı hadisleri çözme hususunda bazı yöntemler geliştirmiş ve belli başlı prensipler ortaya koymuştur. Dolayısıyla ikinci asırda yaşayan Hanefî imamlarının hadislere olan yaklaşımını Tahâvî vasıtasıyla öğrenmek mümkündür. İşte bu çalışmada Hanefî hadis anlayışının bel kemiğini oluşturan Tahâvî'nin Bedreddîn Aynî'ye etkisi ele alınmıştır. Bu bağlamda Bedreddîn Aynî'nin Tahâvî'den usûl, üslûp ve kaynak açısından ne kadar etkilenip etkilenmediği ortaya konmaya çalışılmıştır."
