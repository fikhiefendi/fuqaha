abstract: "Defter 60 varak ve 116 sayfadan oluşmaktadır. Defterin transkripsiyonunu yaparken sayfa numaraları takip edilmiş tarafımızdan verilen numaralandırılma da ise öncelikle belge numarası esas alınmış ikinci olarakta hüküm numarası verilmiştir (belge no.1, Hüküm no.1). 1-1, 1-2, .... vb. şekilde gösterilmiştir.Defterde yer alan belge çeşitlerine baktığımızda çoğu hüccetlerden oluşup,tereke, vakfiye, ferman türü belgeler yer almaktadır. Çalıştığımız şer'iyye sicilinde siyah ve bozuk olarak karşılaşılan bazı satırların okunamayan kelimeleri (?) işareti ve şüpheli okunanları (?) işareti gösterilmiştir. Metinde `ayn (?) harfi (`) ile, hemze( ? ) işareti (') ile, uzatmalarda ise (^) işaretleri kullanılmıştır.Birinci bölümde Rodoscuk'un tarihinden ve bu bölgenin Osmanlı hakimiyetine girişi. İkinci bölümünde Osmanlı mahkemeleri ve bu mahkemelerin yargıçlık görevini yerine getiren kadı ve yardımcılarının vazifeleri. Üçüncü bölümünde ise şer`iyye sicillerinin tanımı,kapsamı ve sicillerde görülen belge türleri hakkında bilgi. Dördüncü bölümünde 1596 Numaralı Rodoscuk (Tekfurdağı) şeriyye sicilinin değerlendirmesi anlatılmış Ekler bölümünde ise 1596 Numaralı Rodoscuk (Tekfurdağı) transkripsiyonu yapılmıştır."
