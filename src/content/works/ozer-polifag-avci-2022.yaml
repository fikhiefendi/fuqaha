abstract: "Bu çalışmada predatör böcek Orius vicinus'un örtüaltı sebze yetiştiriciliğinde polifag bir zararlı olan B. tabaci'nin ergin öncesi dönemleri üzerinde beslenen Orius vicinus'un yumurta açılma süresi, nimf gelişme süresi ile canlılık oranı, Preovipozisyon süresi (APOP), toplam preovipozisyon süresi (TPOP), fekunditesi ve dişi ile erkek bireylerin ömür süreleri ve yaşam çizelgesi parametreleri, kalıtsal üreme yeteneği (r), üreme gücü (R0), ortalama döl süresi (T), artış oranı sınırının () belirlenmesi amaçlanmıştır. Ayrıca O. vicinus'un B. tabaci'nin yumurta, larva ve pupa dönemleri üzerindeki işlevsel tepkisi ayrı ayrı belirlenmiştir. Denemeler 26 ± 1º C sıcaklık ve 16:8 aydınlık-karanlık koşullarında yürütülmüştür. Orius vicinus'un yumurta açılma süresi 4.67± 0.06 gün, toplam nimf gelişme süresi 13.65±0.13 gün ve nimf canlılık oranı %77.32, dişi başına bırakılan ortalama yumurta sayısı 60.89±2.76 adet olarak bulunmuştur. Dişi bireylerin yaşam uzunluğu ortalama 16.48 gün ve erkek bireylerin ortalama yaşam uzunluğu 12.27 gün olarak tespit edilmiştir. APOP 4.12± 0.12 gün, TPOP 22.67±0.23 gün ve ovipozisyon süresi 11.23 gün olarak gözlemlenmiştir. Yaşam çizelgesi parametreleri“r”0.113 net gün-1,“R0”24.8 gün-1,“”1.119 gün-1 ve“T”28.4 gün-1 olarak belirlenmiştir. İşlevsel tepki çalışmaları sonucunda B. tabaci'nin yumurta, 1. larva, 2. larva, 3. larva dönemlerinin farklı yoğunlukları üzerindeki işlevsel tepkisi Holling disk metoduna göre Tip III olarak belirlenirken pupa dönemine karşı işlevsel tepkisi Tip II olarak belirlenmiştir. Çalışma sonuçlarına göre, O. vicinus'un B. tabaci'ye karşı yüksek etkinliğe sahip olduğu düşünülmektedir. Bu sonuçlar O. vicinus'un, B. tabaci'nin biyolojik mücadelesinde ümitvar bir doğal düşman olarak kullanılabileceği kanaati oluşturmuştur."
