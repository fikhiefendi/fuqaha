abstract: "İmam Şirvani, İslam fıkhında önemli bir etki bırakmış en önde gelen Şafii alimlerinden biridir. İmam İbn Hacer el-Heytemî'nin“Tuhfetü'l-Muhtâc”adlı eserine yazdığı derinlemesine açıklamaları ile tanınır. Bu eser, İmam Nevevi'nin“el-Minhâc”adlı metninin en önemli şerhlerinden biridir. Araştırmanın amacı, İmam Şirvani'nin fıkhî hükümleri istinbat etme yöntemini incelemek, onun şer'î delillerle çalışırken izlediği yolu analiz etmek ve fıkhî meseleleri sunma biçimini, görüşleri tercihe dayalı olarak nasıl tartıştığını ortaya koymaktır. Araştırma, şerhindeki fıkhî metinlerin incelenmesinde tümevarım yöntemini, açıklama ve istidlal tarzını ele almak için analitik bir yaklaşımı benimsemiştir. Birinci bölümde, temel kavramların tanımları yapılmış, fıkıh ve metodoloji hakkında genel bir açıklama yapılmıştır. Ayrıca, İmam Şirvani ve Şafii fıkhına yaptığı katkılardan bahsedilmiş,“Tuhfetü'l-Muhtâc”eseri tanıtılmıştır. Bu bölümde, Şirvani'nin eserine yaptığı katkılar vurgulanmış ve kitabın Şafii mezhebindeki önemi, İslam dünyasında fetva kaynağı olarak kabul edilmesi ele alınmıştır. Şirvani, sadece geleneksel bir açıklama yapmamış, fıkhî meselelerin derinlemesine analizini sunarak zamanının önemli fıkıh âlimlerinden biri haline gelmiştir. İkinci bölümde, İmam Şirvani'nin şer'î delillerle istidlal etme yöntemi incelenmiştir. Bu bölüm iki ana kısmı kapsamaktadır: İlk kısımda, Kur'an-ı Kerim, Sünnet, icma ve kıyas gibi üzerinde ittifak edilen şer'î deliller üzerine yoğunlaşılmıştır. Şirvani'nin bu delilleri nasıl dengeli bir şekilde kullandığı ve hem nakil hem de akıl unsurlarını nasıl bir araya getirdiği açıklanmıştır. İkinci kısımda ise ihtilaflı deliller, örneğin istihsan, maslahatlar ve istishab ele alınmıştır. Şirvani'nin bu delilleri nasıl pratik örneklerle açıklayarak, esnek bir yaklaşım Üçüncü bölümde, İmam Şirvani'nin fıkhî meseleleri nasıl sunduğu ve görüşleri nasıl tercih ettiği ele alınmıştır. Şirvani'nin yaklaşımı, objektif ve tarafsızdır. Farklı alimlerin görüşlerini, şer'î delillerle destekleyerek sunmuş ve ardından bu görüşler arasında delilin gücüne dayanarak en güçlü olanını tercih etmiştir. Şirvani, âlimler arasındaki ihtilafları açıklığa kavuşturmuş, fıkhî meselelerin derinlemesine anlaşılmasını sağlamıştır. Araştırma, Şirvani'nin özellikle abdest ve namaz gibi konularda, Şafii mezhebi içindeki farklı görüşlere dair yaptığı açıklamaları ve tercih ettiği görüşleri detaylı bir şekilde ele almıştır. Bu, onun şer'î temelleri ne kadar derinlemesine anladığını ve pratikte şer'î maslahatları gözeterek nasıl tercih ettiğini ortaya koymuştur. Araştırma, İmam Şirvani'nin metodunun hem geleneksel hem de çağdaş fıkıh anlayışını birleştiren hassas bir bilimsel yaklaşım olduğunu ortaya koymuştur.“Tuhfetü'l-Muhtâc”üzerindeki haşiyesi, yalnızca fıkhî bir kitabın açıklaması değil, aynı zamanda fıkhî meselelerin derinlemesine analizini ve şer'î delillerin kapsamlı açıklamasını içeren bir çalışmadır. Bu yaklaşım, İmam Şirvani'nin Şafii fıkhını geliştirerek, hem şer'î temellerin korunmasını hem de pratikteki ihtiyaçların karşılanmasını sağladığını göstermektedir. Bu nedenle, haşiyesi, fıkıh karşılaştırması ve İslam fıkhı üzerine çalışan araştırmacılar için önemli bir başvuru kaynağı olmuştur."
