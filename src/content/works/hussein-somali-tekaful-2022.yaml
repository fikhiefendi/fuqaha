abstract: "Bu araştırmada Somali'de risk yönetimi açısından sigorta (tekafül) sisteminin işleyişi, gelişimi ve sorunlarıyla ilgili vatandaşların görüşlerinin belirlenmesi amaçlanmıştır. Araştırmanın modeli nitel araştırmalarda kullanılan durum çalışması modelidir. Araştırmanın verileri Somalili 12 vatandaştan yüz yüze görüşme tekniğiyle toplanmıştır. Görüşme formunda yarı yapılandırılmış 16 adet soru yer almaktadır. Sorular araştırmanın amacına uygun olarak detaylı bir şekilde veri elde edebilmek için açık uçlu olarak sorulmuş ve elde edilen veriler içerik analizi tekniği kullanılarak analiz edilmiştir. Yapılan analiz neticesinde Somalililerin sigorta/tekafül sistemine ihtiyaç duydukları, sigorta/tekafül sisteminin risklere ve zararlara karşı koruma sağladığına inandıkları, sigortanın güvenli olmadığını düşünenlerin sınırlı sayıda olduğu, sigorta yaptırmanın oranının yüksek olduğu ve en çok tercih edilen sigorta türlerinin sağlık ve araç sigortası olduğu, önceki sigorta tecrübelerinin beklentileri karşılamaması nedeniyle sınırlı sayıda olumsuzluklar yaşanmış olsa dahi genel olarak sigorta/tekafül sistemine bakışlarının olumlu olduğu belirlenmiştir. Ayrıca Somalililerin sigorta/tekafül sisteminin yeterince gelişmemiş olduğuna ve bilinirliğinin ve kullanımının az olduğuna ve sistemin potansiyelinin yüksek olduğuna, gelişmeye açık olduğuna ve gerekli adımlar atılırsa bu sistemin gelişeceğine inandıkları, devletten sigorta şirketleri için teşvik edici uygulamalar geliştirmesi ve devletin sigorta/tekafül sisteminin gelişmesi için yasal düzenlemelerin yapılması gerektiğine inandıkları belirlenmiştir. Çalışmadan elde edilen bu bulgular doğrultusunda sigorta/tekafül sisteminin potansiyelinin tam olarak ortaya çıkartılabilmesi için sigortacılığın halka yaygın ve etkili bir şekilde anlatılması ve sigortanın fayda ve zararlarının ortaya konulması, sigorta ve sigortacılıkla ilgili lise ve üniversitelerde eğitimlerin verilmesi, etkili, şeffaf ve adil bir sigorta sisteminin kurulması, sigorta şirketlerinin açılması için teşvik yapılması ve sigorta şirketleri için etkili yaptırımların getirilmesi önerilmiştir."
