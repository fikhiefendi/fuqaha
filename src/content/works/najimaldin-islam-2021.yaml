abstract: "Müslüman toplumlarda kâr amacı gütmeyen kuruluşlar ciddi anlamda gelişme kaydetmiş, görmezden gelinmesi ve inkâr edilmesi imkânsız bir gerçeklik haline gelmiştir. Kâr amacı gütmeyen kuruluşlar, özellikle günümüz müslüman toplumlarda, devlet yönetimlerinin yaptığı finansal, bilimsel, sağlık ve sosyal bakımlardan birçok görevleri ifa etmektedirler. Bu kurumların kaynakları zekât, vakıf ve bağış gibi farklı unsurlardan oluşmakta olup, bu kurumların çalışmalarını sürdürebilmeleri için en önemli ekonomik kaynaklar olarak kabul edilmektedir. Bu araştırmanın problemi zekât ve vakıf gibi kaynakların bu kurumlar tarafından nasıl değerlendirildiğidir. Aynı şekilde bu kurumların birçoğu gerek özel sektör kurumları (şirketler), gerekse de kamu kurumlarıyla birlikte çalışmaktadırlar. Kamu ve özel sektörde yer alan bu kurumların pek çoğu ise, alkol şirketleri, faizli işlem yapan şirketler, keyif verici madde üreten şirketler, kabareler, internetteki pornografik siteler, kumar şirketleri vb. yasadışı faaliyet yürüten ve İslamiyetin haram saydığı işler yapan kuruluşlarla iş tutmaktadırlar. İşte bu çalışmada İslam hukuku açısından bu fonları kullanmanın ve bu fonlarla kâr amacı gütmeyen kuruluşların hayır projelerini desteklemenin hükmü ortaya konulmuştur. Tezde varılan en önemli sonuçlardan biri, kâr amacı gütmeyen kurumların devlete doğrudan doğruya bağlı olmamaları, demokratik bir idare ile yönetilmeleri ve belirli bir fayda veya kâr elde etme düşüncesi olmaksızın topluma ve vatandaşa hizmet etmeye çalışmalarıdır. Ayrıca bu çalışmada kâr amacı gütmeyen müessese kurmanın, izlenen çalışma yöntemine bağlı olarak vacip, haram, mendup ve mekruh hükümlerinden birini alabileceği gösterilmiştir. Kâr amacı gütmeyen kuruluşların bazı âlimlere göre zekâtın toplanması ve dağıtımı konusunda, zekât âmilleri sınıfından sayılabileceklerine dair görüşlere yer verilmiştir. Son olarak da vakıf mallarının yatırım araçlarında değerlendirilmesine dair farklı görüşler zikredilerek tartışılmıştır. Anahtar kelimeler: İslam Hukuku, Kalkınma, Değerlendirme, Mali Kaynaklar, Kâr Amacı Gütmeyen Kuruluşlar."
