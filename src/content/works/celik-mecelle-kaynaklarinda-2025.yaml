abstract: "Bu çalışmada fıkhî hükümlere yansıyan asıl-fer' ve metbû-tâbi ilişkisinin Mecelle ve kaynakları bağlamında tespitine odaklanılmış ve araştırmamız neticesinde on altı küllî kaide ve altmış yedi hüküm maddesinin doğrudan veya dolaylı olarak bu ilişkiyi barındırdığı tespit edilmiştir. Kaide ve hüküm maddelerinin belirlenmesi aşamasında tezimizin aslî iki kaynağından ilki olan Ali Haydar Efendi'nin Dürerü'l-Hükkâm şerhu Mecelleti'lAhkâm'ından, Mecelle'nin bir nevi fihristi olan Serkiz Orpilyan'nın Miftâhu'lMecelle'sinden, Ali Himmet Berki'nin Açıklamalı Mecelle'sinden, Kuyucaklızâde Mehmed Âtıf Efendi'nin Mecelle-i Ahkâm-ı Adliyye Kavâid-i Külliyye Şerhi'nden, Muharrem Önder'in Mûcez fi Şerhi Kavâidi'l-Mecelleti'l-Külliyye'sinden yararlanılmıştır. İkinci olarak tespit edilen bu kaide ve maddelerin Hanefî mezhebi fıkıh literatüründeki kaynaklarına, tezimizde esas aldığımız iki şerh olan Ali Haydar Efendi'nin Dürerü'l-Hükkâm şerhu Mecelleti'l-Ahkâm'ı ve Mesud Efendi'nin Mir'ât-ı Mecelle'si çerçevesinde yer verilmiştir. Tezin hazırlanması aşamasında Mecelle üzerine yazılan Osmanlı Türkçesi, Modern Türkçe ve Arapça eserlerden istifade edilmiştir. Sonuç olarak bu tez Mecelle üzerinde çalışma yapan araştırmacılara, tespit edilebilenler çerçevesinde asıl-fer' ve metbû-tâbi ilişkisini yansıtan küllî kaide ve hüküm maddelerini toplu olarak görme, faydalanılan şerhler çerçevesinde farklı örnek ve açıklamalarına vâkıf olma ve temel iki kaynağımız arasında bir karşılaştırma yapma imkânı sunmaktadır."
