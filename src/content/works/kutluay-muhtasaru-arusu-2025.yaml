abstract: "Bu çalışmada, Arap belâgatındaki şerh ve hâşiye geleneği içerisinde önemli bir konuma sahip olan, Sa'düddînet-Teftâzânî'nin (ö.792/1390) Muhtasarü'l-Me'âni'si ile Bahâüddîn es-Sübkî'nin (ö.773/1372)'Arûsü'l-Efrâh isimli eserlerinin bedî' bölümleri karşılaştırmalı olarak analiz edilmiştir. Her iki eser, es-Sekkâkî'nin (ö.626/1229) Miftâhü'l-'Ulûm'nun belâgat ilmiyle ilgili üçüncü bölümünü özetleyerek kaleme alan Hatip el-Kazvînî'in (ö.739/1338) Telhîsü'l-Miftâh isimli eserine yazılmış şerhler olup, Arap belâgatının gelişiminde önemli bir rol oynamıştır. Bu çalışmada, söz konusu şerhlerin bedî' ilmine dair yaklaşımları, metodolojik farklılıkları ve klasik belâgat literatürüne katkıları sistematik bir şekilde ele alınmıştır. Çalışmamızın temel amacı, her iki müellifin bedî' sanatlarını nasıl yorumladığını, hangi ölçütlere öncelik verdiğini ve Telhîsü'l-Miftâh'taki teorik çerçeveye ne tür katkılar sunduğunu ortaya koymaktır. Ayrıca, bu iki şerhin Arap belâgatı tarihindeki konumu ve sonraki dönemlere etkisi de değerlendirilecektir. Bu bağlamda, çalışma mukayeseli bir yöntem izleyerek, hem metinler arası benzerlik ve farklılıkları tespit etmeyi hem de Arap belâgatındaki şerh ve hâşiye geleneğinin işleyişine dair bir perspektif sunacaktır."
