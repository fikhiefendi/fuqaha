abstract: "Günümüzde hızlı bir şekilde ilerleyen teknoloji her alanda hayatın odak noktası haline gelmiştir. İslami finansın kullanıcı sayısının giderek artması ve İslami finansal araçların en çok kullanım alanı bulduğu katılım bankacılığının her geçen gün pazar payını artırmasında teknolojinin desteği büyüktür. Son dönemlerde teknolojik anlamda adını sıkça duymaya başladığımız farklı sektörlerde kullanım alanı bulan blok zincirin İslami finans alanında ne denli etkisi olacağı konusunda genel bir çerçeve çizmek için bir saha araştırması ihtiyacı doğmuştur. Çalışmada ilk olarak blok zincir teknolojisinin işleyişine değinilerek İslami finans alanında kullanım alanları, uygunluğu konularına değinilmiştir. Araştırmada, nitel araştırma tekniklerinden doğrudan görüşme yöntemi kullanılmış olup önceden literatür taramaları ve sektör temsilcileriyle yapılan görüşmeler neticesinde hazırlanan sorular Türkiye'de faaliyette bulunun 6 katılım bankasının farklı illerde bulunan şube müdürlerine yöneltilmiştir. Görüşmelerin bir kısmı ses kaydı ile bir kısmı yazılı bir şekilde olmak üzere toplam 14 görüşme kayıt altına alınmıştır. Yapılan değerlendirmeler sonucunda katılım bankalarının ürün çeşitliliğinin her geçen gün artmakta olduğu ve güncel teknolojiyi (yapay zeka, Big Data) kısmen aktif olarak kullandıkları ve daha da adapte olmak açısından çalışmalar yaptıkları söylenebilir.Blok zincir teknolojisinin, katılım bankacılığı sektöründe yönetici pozisyonunda olan kişilerin değerlendirmeleri dikkate alındığında çeşitli çekinceler olmakla birlikte kullanılabileceği, kripto para konusunda ise İslam hukukuna uygunluk noktasında gerekli prensiplere bağlı kalmak kaydıyla entegre olabileceği bazı yöneticilerce ifade edilse de sektörün konuya uzak durduğu söylenebilir. Ayrıca şuanda yasal dayanaktan yoksunluk ve devlet otoritelerince mesafeli bir konu olması nedeniyle katılım bankalarının blok zincir ve kripto para alanlarından uzak durduğu da ayrıca ifade edilebilir. Ancak gerek blok zincir teknolojisi gerekse kripto para kavramları şeffaflık ve güvenilirlik noktasında ön plana çıktıkları göz önüne alındığında katılım bankalarının, bir çok sektörün dönüşüm yaşadığı günümüzde bu kavramlarla daha da yakından ilgilenmeleri gerektiği aksi halde dönüşüme ayak uyduramayan bir noktada sonucu öngörülemeyen tehditlerle karşı karşıya kalınabileceği yapılan değerlendirmeler sonucunda söylenebilir."
