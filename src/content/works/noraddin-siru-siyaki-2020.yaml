abstract: "Bu çalışma, Kuran bağlamının dilsel farklılıkları, fiilleri ve isimleri ortaya çıkarmadaki etkisini içerir. Kur'an-ı Kerim'de bahsedilen kelimenin anlamına odaklanır. Kur'an'daki kelimenin iki anlamı vardır: sözcüksel anlam ve bağlamsal anlam: Bağlamın cümlesinde veya içerdiği metinde neye hükmettiği. Bir kelimeyi çevreleyen bağlam ona anlamını verdiğinden ve dilsel farklılıklar bakımından zengindir. Kur'an kelimeleri, sanki bir kelime iki farklı bağlamda görünüyormuş gibi çevreleyen bağlamın etkisine sahiptir, her bağlam onun üzerinde anlamını gizler, bu nedenle bir kelimenin anlamı, göründüğü ırklara göre değişir."
