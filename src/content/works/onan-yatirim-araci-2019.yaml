abstract: "Parayı takas aracı olarak gören, bir meta gibi alınıp satılmasını yasaklayan İslam dinine mensup toplumların finansal sistemde faiz yasağına uyarak yer alma ihtiyaçları, bu kesimin sahip olduğu sermaye birikiminin reel ekonomiye kazandırılması, finansal sistem içinde bir fon sunucusu ya da fon kullanıcısı olarak yer alma ihtiyacı, konvansiyonel bankacılık sistemine alternatif bir finans sisteminin ortaya çıkmasına neden olmuştur. İslami finansman enstrümanlarının, finans sektöründe yer alan diğer plasman-yatırım araçları arasındaki payının yıllar itibariyle oranı incelendiğinde, henüz istenilen seviyelere ulaşmadığı ülkemiz finans sektöründe hacimsel olarak %6 dolaylarında pay aldığı görülmektedir. Sadece ülkemizde değil küresel piyasalarda da söz konusu durum benzerlik göstermektedir. Son yıllarda ülkelerarası sermaye hareketlerinin; gerek teknolojik gelişmeler ve gerekse de yeni finansal ürünlerin yatırımcıya sunulması ile birlikte, geçişkenliğinin daha da hızlandığı, özellikle sermayeye ihtiyaç duyan ekonomilerde, sukuk vb. yeni yatırım araçlarının artmasıyla birlikte daha uzun vadede daha ucuz fonun ekonomiye kazandırıldığı görülmektedir. Bu çalışmada ülkemizde, tasarrufların artırılması ve kaynakların ülke ekonomisi adına etkin şekilde kullanılmasında, sukuk ihraçlarının sermaye piyasalarımızda aktif rol üstlenmesinden hareketle, sukuk ihracının yatırımcılar açısından doğru değerlendirilmesine olanak sağlayacak hukuksal ve vergisel analizlerinin yapılması amaçlanmıştır. Çalışmanın sonucunda elde edilen bulgular ışığında önerilerde bulunulmuştur."
