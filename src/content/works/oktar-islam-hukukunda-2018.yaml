abstract: "Sürgün kelimesi akla gelen ilk manasıyla, ilk insan kadar tarihi seyri olan bir kavramdır. Lakin farklı kavramlarla ilişkilendirildiğinde daha geniş manaları da ihtiva eder. Bu açıdan 21. yüzyılda bile kendisinden söz ettirmektedir. Tarih boyunca sürgünün nasıl ve ne şekilde uygulandığı gerçekten merak konusudur. Fakat bu konuyu aydınlatacak yeteri kadar çalışma bulunmamaktadır. Bu sebeple konumuzu seçmemizdeki faktörlerden biri de budur. Çalışmamızda tarih boyunca sürgünü kısmen ele aldık. Osmanlı Devleti'nde sürgün ve sürgünün ne şekilde uygulandığını, sürgün-iskan ilişkisini anlatıp bu duruma dikkat çektik. Osmanlı Devleti'nin hukuk yapısını, İslam hukuku bağlamında açıklayıp; Osmanlı'da hukuksal olarak sürgünleri de ele alıp, 18. yüzyıl Osmanlı Devleti'nde hukuksal olarak sürgünlere ağırlık verdik. İlk olarak sürgün kavramının farklı anlamlarını ele aldık. Bu bağlamda nasları nazara alıp İslam hukukunda sürgünü inceledik. Osmanlı Devleti hukuk yapısını da açıkladıktan sonra, Osmanlı Devleti'nde cezai müeyyide olarak sürgünlere geçtik. Tarih boyunca sürgün ve sürgüne sebep olan suçları genel-yüzeysel olarak ele aldık. Daha sonra Osmanlı Devleti'nde cezai müeyyide olarak sürgünleri, Mukayeseli İslam Hukuku ve Osmanlı hukuku ile birlikte ele alıp bir arada sunduk. Tarih boyunca sürgünün mahiyeti ve cezai müeyyide olarak sürgün cezasının uygulanışı hakkında toplu bir bilgi sunduk. Çalışmamızda öncelikle İslam'ın temel kaynağı olan Kur'an'ı Kerim ve sünnete başvurduk. Sahabe ve Hulefa-i raşidinin uygulamalarından da faydalandık. Konuyla ilgili yerli ve yabancı kaynaklardan, İslam hukuku klasik kaynaklarından, Başbakanlık Devlet Arşivleri Genel Müdürlüğü Osmanlı Arşivi Daire Başkanlığı'nda bulunan vesikalardan, padişah fermanlarından, şeyhülislamlara ait fetva mecmualarından ve Osmanlı kadı sicillerinden istifade ettik."
