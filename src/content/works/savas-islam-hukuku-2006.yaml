abstract: "Sözlesme iki taraflı bir hukuki islemdir. Borçlar Hukuku alanında sözlesmelerin kurulması ve geçerliligine iliskin genel kurallar bulunmaktadır. Bununla birlikte aile hukuku alanında özellikle evlenme sözlesmesinin kurulmasına ve geçerliligine yönelik farklı sartlar ve kurallar getirilmistir. Getirilen bu kurallara aykırı davranmanın yaptırımı da borçlar hukuku alanındakilerden daha farklı düzenlenmistir. Evlenme sözlesmesinin kurulması için farklı cinsiyetteki kisilerin yetkili memur önünde bizzat kendileri tarafından iradelerini beyan etmeleri gerekmektedir. slam Hukuku da yetkili memur dısında aynı sartları aramaktadır. Türk Hukuku tarafların temyiz gücünden sürekli olarak yoksun olmamalarını, evlenmelerine engel olacak derecede akraba olmamalarını, evli olmamalarını, evlilige engel olacak derecede akıl hastası olmamalarını istemektedir. Bunlara uyulmazsa evlenmeyi mutlak butlanla batıl saymakta ve sona erdirmektedir. Tarafların temyiz gücünden geçici olarak yoksun olmaları durumunda, taraflardan birisinin iradesinin hata, hile ve ikrah sebebiyle fesada ugramıs olması durumunda ve kanuni temsilcinin izninin olmamsı durumunda ise nispi butlanın oldugunu kabul etmis, ilgili tarafa iptal hakkı tanımıstır. slam Hukuku da evlenme için tarafların temyiz gücüne ve evlenme ehliyetine sahip olmalarını, iradelerinin uyusmasını, bunların aynı mecliste yapılmasını, kesinlik ifade etmesini aramaktadır. Bunlara riayet edilmeden yapılan evlenmeleri de batıl saymaktadır. Ayrıca evlenme sözlesmesinin akıllı, balig olmus, hür ve Müslüman iki sahit önünde yapılmasını, irade beyanlarının fesada ugramamıs olmasını ve sözlesmenin süreli olmamasını da aramaktadır. Bunlara uyulmazsa sözlesmeyi fasid olarak nitelendirmektedir. Türk Hukuku yok olan evliliklere herhangi bir sonuç yüklemezken batıl olan evlenmelere sona erinceye kadar geçen süre içinde geçerli olan bir evliligin tüm sonuçlarını yüklemektedir. slam hukuku da batıl evlenmeler hiç bire sonuç yüklemezken fasid olan evlenmelere bazı hukuki sonuçlar yüklemekted"
