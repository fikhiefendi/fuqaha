abstract: "İslâm, semavi dinlerin sonuncusudur. Bütün semavi dinler, kaynağını Allah'tan aldığına göre İslâm hukuku ile önceki şeriatlar arasında birçok benzerliğin bulunması tabiîdir. Bununla beraber önceki şeriatlarda bulunup da İslâm'da bulunmayan bazı hükümler de bulunmaktadır. Bu tez hem benzerliklere hem de farklılıkları dikkate alarak önceki şeriatların İslâm hukukuna olan yansımalarını ele almayı hedeflemiştir. Bu tezde, şeriat kavramı ayrıntılı bir şekilde incelenerek tarifi ve fıkhi analizi yapılmıştır. Daha sonra önceki şeriatlar hakkında detaylı bilgi verilmiştir. Önceki şeriatlar tabiriyle her ne kadar Yahudilik ve Hıristiyanlık anlaşılsa da bu kavramın her ikisinden daha geniş olduğu açıktır ve bu husus tezde izah edilmiştir. Ayrıca, önceki şeriatların İslâm hukuku açısından delil kabul edilip edilemeyeceği sorgulanmış ve Hz. Peygamber'in bisetten önce ve sonraki tutumuna göre fukahanın sözleri ifade edilmeye çalışımıştır. Öte yandan, önceki şeriatlardan neshedilen ve neshedilmeyen hükümler araştırılarak bunun İslâm hukukuna olan yansımaları ortaya konulmuştur."
