abstract: "Tezimizin konusu Hanefî ve Şâfiî Usûlcülerin Sünnet Anlayışı (Debûsî ve Sem?ani Örneği)?dir. Tez çalışmamızda Sünnet kavramı ve kaynak değeri hakkında bilgi verildikten sonra Hanefî usûlcü Debûsî ve Şâfiî usûlcü Sem?ani?nin sünnet anlayışı, Sem?ani?nin, Debûsî?ye itiraz noktaları ve eleştirileri üzerinde durulmuştur. Tez çalışmamız bir giriş ve iki bölümden oluşmaktadır. Girişte konunun önemi, sınırları ve sunulması üzerinde durulmuştur. Birinci bölümde; Debûsî ve Sem?ani?nin hayatları, eserleri ve yaşadıkları dönemin tarihi arka planı hakkında bilgi verilmiştir. Yine bu bölümde Sünnet kavramı ve Sünnet kavramının kaynak değeri hakkında bilgi verilmiştir. İkinci bölümünde ise tezimizin asıl konusu olan Hanefî ve Şâfiî Usûlcülerin Sünnet Anlayışı (Debûsî ve Sem?ani Örneği) ayrıntılı bir şekilde incelenmiştir. Bu bölümde Debûsî öncesi Hanefî sünnet anlayışı, Debûsî?nin sünnet anlayışı, Sem?ani öncesi Şâfiî sünnet anlayışı, Sem?ani?nin sünnet anlayışı işlenmiş ve sonrasında Kavatiu?l-edille eseri esas alınarak Sem?ani?nin, Debûsî?ye eleştirileri ele alınmıştır. Böylece Şâfiî ve Hanefî sünnet anlayışı arasındaki farklar ve ayrıldıkları noktalar tesbit edilmeye çalışılmıştır. Bu çalışmada şu üç yöntem izlenmiştir. 1-Sünnet Kavramı ve Kaynak Değeri olması hakkında bilgi verilmiş, 2-Debûsî ve Sem?ani?nin sünnet anlayışları tesbit edilmiş, 3-Debûsî ve Sem?ani örneğinden hareketle Hanefî ve Şâfiî usûlcüleri arasındaki temel farklar, ayrıldıkları noktalar ve bunların nedenleri tesbit edilmeye çalışılmıştır."
