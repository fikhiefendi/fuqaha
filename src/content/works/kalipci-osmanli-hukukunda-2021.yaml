abstract: "Bu tez çalışması, Osmanlı hukukunda yaygın bir uygulaması olan nezir usulünü konu almıştır. Nezir usulü, kişilerin taahhütleri üzerine bina edilmiş, devlet tarafından işletilen bir toplumsal denetim mekanizmasına karşılık gelmektedir. Çalışmada, arşiv belgeleri merkeze alınarak ilk bölümde kurumun kavramsal ve tarihsel açıdan incelemesi yapılmıştır. İkinci bölümde kurumun hukuki mahiyeti şer'î ve örfî hukuk cephesinden irdelenmiştir. Üçüncü bölümde nezir usulünün uygulama sahası izah edildikten sonra, dördüncü bölümde uygulama şekli ortaya konmuştur. Nihayet beşinci bölümde nezir usulünün ilgası ele alınarak çalışma tamamlanmıştır."
