abstract: "Dünyada büyük bir gelişim trendine giren faizsiz bankacılık prensiplerinin pratiğe aktarılması konusundaki girişimler, 1970'li yıllarda düşünce aşamasından çıkıp uygulama alanı bulmaya başlamıştır. `Faizsiz Bankacılık' adı altında yaygınlaşan katılım bankaları, başlangıçta müslüman ülkelerde faaliyet gösterirken bugün tüm dünyada, tasarrufların değerlendirilmesi ihtiyacıyla gün geçtikçe önem kazanmaktadır.Türkiye'de 1983 yılında Kanun Hükmünde Kararname ile kurulmasına izin verilen ve `Özel Finans Kurumu' diye adlandırılan bu kuruluşlar; 5411 sayılı Bankacılık Kanunu'nda yapılan değişiklikle 2006 yılından itibaren yeni adıyla `Katılım Bankaları' olarak son on yıldır büyük bir gelişme kaydetmiştir. Yapılan değişiklikle katılım bankalarının, Bankalar Kanununa tabi ve ticari bankalar ile eşit haklara sahip olmasının gelişiminde büyük etkisi vardır.Rekabetin sürekli arttığı günümüz koşullarında bankaların fark yaratabilmek ve başarılarını arttırabilmek için yoğun çalışmalarda bulunduğu kaçınılmaz bir gerçektir. Modern pazarlama anlayışından yola çıkarak, bankaların başarılarını arttırabilmek için öncelikli amacı müşteri memnuniyetini en üst seviyeye taşımaktır.Çalışmamızda katılım bankalarının dünyadaki ve Türkiye'deki gelişim sürecine değinilmiş, bu bankaların faaliyet alanları, ekonomiye katkıları ve karşılaştığı sorunlar hakkında bilgiler verilmiş ve müşteri memnuniyeti üzerine Türkiye Finans Katılım Bankası üzerinde anket çalışması yapılmıştır. Anket soruları; Türkiye Finans Katılım Bankası şubelerinin bulunduğu başta Denizli ili olmak üzere; İstanbul, Bursa, Ankara, Isparta, Antalya, Manisa, Uşak, İzmir, Rize, Adıyaman, Kahramanmaraş illerinde uygulanmıştır."
