abstract: "Bu araştırma, İslam iktisadı açısından yenilikçi bir yaklaşım olan vakıf modeline dayalı Tekâfül sigortasını incelemektedir. Bu araştırma, vakıf prensiplerinin Tekâfül sigortasıyla entegrasyonunu ele alarak, mevcut Tekâfül sigortası modellerinde karşılaşılan fıkhi sorunlara çözüm sunabilecek alternatif bir model geliştirmeyi amaçlamaktadır. Vakıf modeline dayalı Tekâfül sigortası üzerine sınırlı sayıda akademik çalışma bulunmasına rağmen, bu çalışma bu alanda önemli bir literatür incelemesi sunmaktadır. Bu tez, sigortanın ortaya çıkışını ve İslam iktisadı çerçevesindeki gelişimini genel bir bakış açısıyla ele almakta ve İslam hukukuna uyumlu alternatif çözümler geliştirme çabaları çerçevesinde İslam hukukçularının sigorta üzerine yaptığı çalışmalara değinmektedir. Bu bağlamda, İslam hukukçuları tarafından benimsenen Tekâfül sigortası modelleri ve bu modellerin fıkhi açıdan karşılaştığı sorunlar detaylı bir şekilde incelenmiştir. Ayrıca, bu çalışma vakfın Tekâfül sigortasındaki rolünü ve önemini vurgulayarak, vakıf temelleri ile Tekâfül sigortası sektörü arasındaki temel benzerliklere dikkat çekmektedir. Bu tezde, vakıf modelinin Tekâfül sigortası uygulamalarında karşılaşılan fıkhi zorluklara çözüm sunma potansiyeline sahip olduğunu ve İslam iktisadı açısından daha uyumlu bir yapıya sahip olduğunu ortaya konmuştur. Vakıf modelinin, Tekâfül sigortasının temel dayanağı olarak kullanılması durumunda, mevcut uygulamalardaki birçok sorunun aşılabileceği ve bu modelin daha etkin bir şekilde uygulanabileceği sonucuna varılmıştır. Bu araştırma, Pakistan ve Güney Afrika'daki vakıf modeline dayalı Tekâfül sigortası uygulamaları incelenmiş ve bu modelin diğer modellerde karşılaşılan birçok zorluğun üstesinden gelmede daha etkili olduğunu göstermiştir. Bu çalışma, vakıf modeline dayalı Tekâfül sigortasının daha geniş çapta benimsenmesi ve uygulanması yönünde önemli bir adım olarak değerlendirilebilir. Ayrıca, vakıf modelinin hem fıkhi hem de ekonomik açıdan önemli avantajlar sağlayabileceği sonucuna varılmıştır."
