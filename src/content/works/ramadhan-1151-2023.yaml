abstract: "Bu araştırmanın amacı Ahmed b. Ömer ed-Deyrabî el-Guneymî'nin Şâfiî fıkhına dair Hâşiye alâ Ğâyitü'l-merâm fî mâ yeteallaku bi enkihati'l-enâm isimli eserini tahkik etmektir. Eser Şâfiî fıkhına dair fıkhın üçüncü bölümü olarak kabul edilen nikahla ilgilidir. Eser, içerisinde bulunan birçok nakil ve istidlâl sebebiyle Şâfiî fıkhının en önemli kitaplarından kabul edilmektedir. Aynı zamanda 11 ve 12. Asrın fıkıh birikimini de yansıtmaktadır. Eserin tahkikinde Ezher üniversitesi kütüphanesinde bulunan iki ayrı mahtût nüsha esas alınmıştır. Müellifin şahsi ve ilmi hayatı incelenirken betimleyici tarihsel metot kullanılmıştır. Guneymî'nin eserde kullandığı metot tespit edilirken tahlil yöntemi, müellife yöneltilen eleştiriler işlenirken eleştirel yöntem tercih edilmiştir. Araştırmada şu sonuçlara ulaşılmıştır: Kitap helal ve haram olan nikahlarla ilgili meseleleri uzun uzadıya ele alması, detaylı teferruatlar içermesi ve fıkıhî konulara göre yapılmış, eşsiz taksim ve tertibi ile bilinmektedir. Müellif değişik dönemlere ait Şâfiî fıkhının önemli kaynaklarından nakiller yapmış, nakillerin ana kaynaklardaki yerleri göstermiş, hocaları ile tartıştığı dönemin yeni konularına delalet eden nakiller yapmıştır. Müellifin istidlâl konusundaki metodu, kitap, sünnet ve icmâ ile ihticâc etmeye dayanmaktadır. Hilâf konulularında Şâfiî mezhebine bağlı kalmış, diğer mezhepleri az eleştirmiştir. Kitap aynı zamanda ıstılahların terim manasını tespit etme, küllü kaideler ve mühtelif ilimlere dair konulara değinmesiyle meşhurdur. Benzer konuları ve aralarındaki farklılıkları sunmaya dikkat etmiştir. Bazen istidrâk ve tercih konularında eleştiriler yapmıştır. Yeni meseleleri sunarken asrında görülmeyen tarzda detaylı bilgi vermiştir. Farazi fıkıhla ilgili detaylı bilgi verme ve fıkhi delillere değinmemesi sebebiyle eleştirilse de bu durum kitabın öneminden bir şey eksiltmez."
