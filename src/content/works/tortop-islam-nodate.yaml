abstract: "“İslâm ve Türk Ceza Hukukuna Göre Suç Genel Teorisinde Suçun Manevi Unsurları”adlı bu çalışmada, beşerî ve Türk ceza hukukuna ait kavramlar olan suç genel teorisi ve manevi unsurun İslâm hukukunda lafzi veya anlamsal bir karşılığının bulunup bulunmadığı ve suç olgusunun İslâm hukukunda yöntemsel açıdan nasıl tetkik edildiği inceleme konusu edilmiştir. Türk ceza hukuku suç genel teorisinde suç, hukuki bir yapı olarak ele alınmakta; bir davranışın suç sayılabilmesi için gereken niteliklerin tespitine çalışılmaktadır. Söz konusu niteliklerin herbir suçu kapsayabilmesi maksadıyla ceza kanunlarının özel kısmında yer alan suç türleri genel olarak tetkik edilmektedir. Bu bağlamda öncelikle özel suçların özel unsurları tamim edilmekte ve böylece meydana gelen genel unsurlardan genel bir suç tipine ulaşılmaktadır. Sonrasında ise özel suç türleri, genel suç tipine irca edilerek unsurları sistemlere bağlanmaktadır. İslâm ceza hukukunun, genel ve özel şeklinde taksim edilmemesinden anlaşılacağı üzere klasik fıkıh eserlerinde genel bir suç teorisi ortaya koyma şeklinde telifsel bir metot benimsenmemiştir. Ancak bu durum özel ve genel ceza hukukuna ait konuların İslâm hukukunda tetkik edilmediği anlamı taşımamaktadır. İslâm hukukunda unsur ve tezahür şekilleri teorilerine ait meseleler, bizzat özel suç türlerinin ele alındığı başlıklar altında değerlendirilmektedir. Türk ceza hukukunda manevi unsur ise fail ile fiili arasındaki psişik irtibatı ifade etmektedir. 5237 sayılı TCK'nın yürürlüğe girmesinden sonra doktrinde kasıt, olası kasıt, bilinçsiz ve bilinçli taksirin suçun manevi unsurları olduğu yönündeki anlayış güçlenmiştir. İslâm ceza hukukuna göre davranışın suç teşkil etmesindeki illet manevi unsur yani kasıttır. Ancak kalbin fiili olan kastın bilinemez bir niteliğe sahip olması sebebiyle onun keyfiyetini gösteren objektif ölçütlerin bulunması gereklidir. Bu nedenle suç tiplerinin belirlenmesinde maddi unsur ile manevi unsur arasında kurulan delalet ilişkisi önem arz etmektedir. Bu meyanda temel manevi unsur kasıt olmakla birlikte hataen işlenen cinayet suçlarında taksir de söz konusu edilebilmektedir. Ayrıca klasik fıkıh eserlerinde kastın, manevi unsur olarak değil, ya mücerret bir biçimde kullanıldığı ya da darb, katil, telehhî gibi sıfatlarla nitelendiği görülmektedir."
