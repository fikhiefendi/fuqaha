abstract: "Şer'i ahkâm lafızlar ile beyan edilmiştir. Lafızların ise konuluşları bakımından anlama delâletleri farklıdır. Usul ilminin en önemli meselelerinden biri lafzın anlamını sahih bir şekilde tespit etmektir. Çünkü şari'nin iradesinin anlaşılması, çoğu kez lafızların doğru bir şekilde tespit edilmesiyle mümkündür. Buna karşılık lafızların anlama delâletleri ise tek değildir. Konuluş ve kullanılışları, açıklılıkları ve delâletleri bakımından lafızlar farklılık gösterirler. Lafzın konuluşu esas alınarak yapılan tasnifin en önemli parçalarında biri âmm lafızdır. Âmm lafzın anlama delaleti çerçevesinin de fıkıh usulünde ele alınan en önemli konularından biri, âmm lafzın tahsisidir. Âmm lafzın tahsisinde Hanefi usulcüler ile mütekellim usulcüler arasında tartışma konusu olan muhassıslardan birisi ise akıldır. Tezimizde akıl ile tahsis konusunu savunan Hanefi usulcülerin görüşleri ile buna karşı çıkan usulcülerin görüşleri incelenmiştir. Tartışmanın temel dayanağı ve sonuçları gösterilmeye çalışılmıştır."
