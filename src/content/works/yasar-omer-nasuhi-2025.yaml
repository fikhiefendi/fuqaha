abstract: "Fıkıh, fürû fıkıh ve usûlü fıkıh olmak üzere iki ana bölümden oluşmaktadır. Fürû fıkıh, fıkhın pratik boyutundaki meseleleri ele alırken, usûlü fıkıh; içeriğinde, fıkhın özünü ve mantığını oluşturan deliller ve yöntemlerin yanı sıra küllî kâideleri de içermektedir. Küllî kâideler, usûl ile fürû ilişkisinin kurulması ve anlaşılması noktasında yardımcı olmakla beraber, fıkıh ilminde önemli bir alt literatürü de oluşturur. Hukukun temel esaslarından biri olarak kabul edilen küllî kâideler, birçok fıkhî meseleyi kapsamasıyla hukuk tatbikatını kolaylaştırmakta, fürû fıkhın daha işlevsel ve anlaşılır olmasına katkı sağlamaktadır. Ayrıca, mezhepler bağlamında kullanılan usûlün tutarlılığını ortaya koyması bakımından başta Hanefî mezhebi olmak üzere diğer mezhepler tarafından da büyük bir önem atfedilmiştir. Küllî kâidelerin oluşumu ve gelişimi, fıkhın ilk dönemlerinden itibaren başlamış ve günümüze değin devam etmiştir. Klasik fıkıh anlayışının son dönemde özgün bir şekilde yansıtıldığı fürû fıkıh alanında yazılmış olan Ömer Nasuhi Bilmen'in,“Hukûk-ı İslâmiyye ve Istılâhâtı Fıkhiyye Kâmusu”adlı eseri bu özelliğiyle ayrı bir yere sahiptir. Bilmen'in, bu eserde, izlediği yöntem bağlamında Hanefî mezhebine göre meselelerin çözümüne yönelik olarak küllî kâidelere yer verdiği görülmektedir. Tezimiz, dört ana bölümden oluşmaktadır. İlk bölümünde, Bilmen'in hayatı ve eserlerine yer verilmiştir. İkinci bölümde, tezin konusunu oluşturan kavramlar üzerinde durularak bir giriş yapılmıştır. Burada ilk dönem fıkıh tarihi içerisinde, küllî kâideler literatürünün gelişimi ve fürû fıkıh ile ilişkisi ele alınmıştır. Üçüncü bölümde, Bilmen'in“Hukûk-ı İslâmiyye ve Istılâhâtı Fıkhiyye Kâmusu”adlı eserinin genel bir tanıtımı yapılmış ve ardından Hanefî mezhebi literatüründeki yerine değinilmiştir. Dördüncü ve son bölümde ise, söz konusu eserin münâkehât ve müfârekât cildindeki aile hukukuna dair küllî kâidelerin neler olduğu tespit edilmiş ve fürû fıkıhla ilişkisi kurulmuştur."
