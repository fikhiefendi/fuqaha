abstract: "Osmanlı hukuk sistemi esas itibariyle İslam hukuku ile bu hukukun ulü'l-emre tanıdığı alanlarda zaman içerisinde oluşturulmuş olan örfî hukuktan ibarettir. İslam hukukuna göre ulü'l-emrin yasama yetkisinin en geniş olduğu alan ceza hukukudur. Bu saha içinde had ve kısas cezaları müstesna, tazîr cezasının keyfiyeti ve miktarı ulü'l-emre bırakılmıştır. Tazîr cezası içinde yer alan nefy, işlediği suça karşılık kişinin kendi rızasının dışında ikamet ettiği yerden sürülerek başka bir yerde süresiz, geçici veya ömür boyu ikamet ettirilmesi manasındadır. Kısas ise, İslam hukukunda kas¬ten işlenen adam öldürme veya yaralama suçuna karşılık suçlunun denk bir ceza ile cezalandırılması demektir. Osmanlı ceza hukukunda tazîr cezası olarak uygulanan sürgün cezası Tanzimat döneminde etkin bir ceza yöntemi olarak kullanılmış, o dönemin ceza kanunnamelerinde yerini almıştır. 1840'dan itibaren nefy ve kısas cezalarının hüküm ve uygulamaları için ayrı defterlerin tutulmasıyla da 1256/1840-1279/1863 dönemini kapsayan 5 adet Nefy ve Kısas Defteri teşkil edilmiştir. Çalışmamıza kaynaklık eden ve 1843-1848 dönemi ceza ve af/ıtlak kayıtlarını içeren 2 Numaralı Nefy ve Kısas Defteri'ndeki hükümlere göre sürgün cezasının çoğunlukla kanuna aykırı hareket eden, halka zulmeden, rüşvet alan, zimmetine para/mal geçiren devlet görevlilerine, halk içinde huzursuzluk çıkaranlara, hırsızlara, eşkıyalara, din ve mezheplerine aykırı hareket eden zimmîlere uygulandığı görülmüştür. Ayrıca haksız yere adam öldüren kişilere de, maktûl yakınlarının kararına göre kısas ya da diyet cezası verildiği anlaşılmıştır."
