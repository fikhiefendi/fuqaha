abstract: "Bu tez çalışmasında, 1888- 1890 (H. 1306- 1307) yıllarına ait“42/1783 Numaralı Samsun Şer'iyye Sicil Defteri”nin transkripsiyonu yapılarak, defterde bulunan belgeler ışığında adı geçen dönemde Samsun'daki sosyal, kültürel, ekonomik, dini ve idari yapı değerlendirilmeye çalışılmıştır. Çalışmamız iki bölümden meydana gelmiştir. İlk bölümde \"42/1783 Numaralı Samsun Şer'iyye Sicili Defteri'nin transkripsiyonlu metni yer almaktadır. İkinci bölümde, defteri oluşturan belgeler konularına göre ayrılmış, daha sonra her bir konu bu belgeler çerçevesinde ayrı ayrı değerlendirilmiştir. 1888- 1890 yıllarında Samsun şehrinin sosyal, kültürel, ekonomik ve idari yapısı hakkında transkripsiyonu yapılan belgelerden istifade edilerek bilgiler verilmiştir. Bu çalışmamızın hazırlanmasında zamanını ve bilgisini esirgemeyen, gerek transkripsiyon gerekse değerlendirme aşamasında bana yardımcı olan, kaynaklara ulaşmamda yol gösteren değerli hocam ve tez danışmanım Prof. Dr. İsrafil BALCI'ya teşekkür ederim."
