abstract: "Yüce Allah (c.c.), Kur'an'ı Kerim'de“Allah, kimseyi gücünün yetmeyeceği şeyle sorumlu tutmaz.”(Bakara, 2/286) buyurarak insanı gücünün yettiği kadarıyla sorumlu tuttuğunu ve ona altından kalkamayacağı hiçbir şeyi yüklemediğini beyan etmiştir. Son din olarak gönderilen İslâm, insanların ibadet, mu'amelât, ahlak gibi hemen her konuda Allah (c.c.) -insan ve insan-insan arası ilişkilerini düzenleyen büyük bir kanunla gelmiştir. İslâm'ın hükümleri, baştan sona insanlar için kolaylıklarla doludur. İslâm'ın hiçbir hükmü insanlar için zor ve yapılamaz değildir. İslâm'ın hükümlerinin insanlara ilk ilan edildiği dönemde bile insanların takati ölçüsünde hükümler getirilerek mükellefler için emir ve yasaklama bildiren âyetler aşama aşama devreye sokulmuştur. İnsanlar bu şekilde İslâm'ın kanunlarına hazır hale getirilmiştir. Allah (c.c.)“Biz, seni bütün insanlık için sadece bir rahmet olarak gönderdik.”(Enbiya, 21/107) buyurarak âlemlere rahmet olması için gönderdiği Hz. Peygamber (s.a.v.) de ümmeti için asla meşakkat verici hükümler koymamıştır. Hz Peygamber (s.a.v.) insanlar için zor denebilecek bazı durumlar oluştuğunda ise, bu meseleleri mümkün olduğu ölçülerde kolaylaştırmalar yaparak çözüme kavuşturmuştur. Hz. Peygamberden (s.a.v.) sonraki dönemlerde gelen müctehid imamlar da, Müslümanların sorunlarına kolaylık ilkesi temelinde çözüm yolları aramışlardır. Çalışmamızda, İslâm hukukunda yeralan Kur'an, sünnet, icma ve kıyastaki hükümlerin Hanefî mezhebinin fetvalarında ve el- Hidâye adlı eserde nasıl geçtiğini kolaylık prensibi çerçevesinde açıklamaya çalıştık. Bu çalışmamızla İslâm'ın insanlar için çok kolay ve yaşanılabilir bir din olduğuna bir kez daha vurgu yaptık."
