abstract: "Tezimiz, Giriş (Araştırmanın Genel Tanıtımı ve İmâm-ı Âzam Ebû Hanîfe ile Câ'fer es-Sâdık'ın Hayatları), iki bölüm (Birinci Bölüm:“Zekât”, İkinci Bölüm:“Humus”), Değerlendirme ve Sonuç başlıklarından oluşmaktadır. Giriş bölümünde Hanefi ve Câferî mezheplerinin kurucu imamları olan İmâm-ı Âzam Ebû Hanîfe ve Câ'fer es-Sâdık'ın yaşadıkları dönem, hocaları, talebeleri ve eserleri hakkında bilgi verilmiştir. Birinci bölümde zekât müessesesine söz konusu mezheplerin yaklaşımları, zekâtın şartları, zekâta tabi olan mallar, zekâtın verileceği ve verilemeyeceği yerler açıklanmıştır. İkinci bölümde mezhepler açısından humus müessesesinin önemi anlatılmıştır. İki mezhep arasında yer alan görüş ayrılıkları delilleriyle izah edilmeye çalışılmıştır. Humusa tâbî mallar ve bunların harcanma yerleri açıklanmıştır. Değerlendirme ve Sonuç bölümünde ise iki mezhep açısından zekât ve humus müessesesinin mukayesesi yapılmıştır."
