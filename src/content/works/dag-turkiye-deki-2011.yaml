abstract: "Bankacılık sistemi, paranın muhafaza edilmesi için güvenli bir ortam sağlanması, tedavüldeki paranın toplanması ve ödenmesi gibi işlemleri gerçekleştirmek, çek ve akreditif muameleleri yapmak, müşteri adına menkul kıymet alım satımı yapmak, kefalet ve teminat mektubu vermek, kiralık kasa hizmeti vermek, seyahat çeki ve kredi kartı gibi konularda danışmanlık yapmak, iş adamlarına banka referans mektubu vermek ve çeşitli faturaların tahsilini yapmak üzere faaliyet göstermektedir. Diğer yandan Dünya'da ve Türkiye'de bankacılık sektörü faizli sistem üzerine inşa edilmiştir. Faiz, İslam dinine göre haram (yasak) kılındığı için Dünya'da ve Türkiye'de Müslüman olan ve dini hassasiyetleri gözetenler faizli bankacılık sisteminden uzak kalmaktadır. Bu yüzden de bu tasarruf sahiplerinin ekonomiye aktarılması için dünyada ve ülkemizde faizsiz bankacılık kurumları yani Katılım Bankaları faaliyet göstermektedir. Görüldüğü üzere bankacılık sektörü, finansal sistemin en önemli aktörlerinden biridir. Bankacılık sektörünün etkinliği, ekonomik ve sosyal bakımdan önemlidir. Bu yüzden çalışmada 2006- 2009 yılları arasında, bankacılık sektöründe faaliyet gösteren katılım bankaları ile özel sermayeli mevduat bankalarının etkinliği, ölçeğe göre değişken getiri varsayımı altında girdi odaklı VZA ve Malmquist toplam faktör verimlilik endeksi ile karşılaştırılmıştır. Bankaların etkinliğinin araştırılmasıyla 3 girdi (Mevduat / Toplanan Fonlar, Faiz Giderleri / Kâr Payı Giderleri ve Personel Giderleri) ve 3 çıktı (Krediler, Plasman Toplamı / Kullandırılan Fonlar, Faiz Gelirleri / Kâr Payı Gelirleri ve Net Ücret Gelirleri) değişkeni kullanılmıştır. Analiz sonucunda katılım bankaları ile özel sermayeli mevduat bankalarının etkinlikleri detaylı bir şekilde ortaya konulmuştur. Etkinsiz olan bankaların etkin olabilmeleri için politika önerilerinde bulunulmuştur. Ayrıca bu çalışmada, katılım bankalarının özel sermayeli mevduat bankalarına göre etkinlik anlamında daha başarılı bir performans gösterdiği tespit edilmiştir.Katılım bankalarının, ekonomiye en çokta reel sektöre fon yaratan önemli bir kaynak olmaları, aynı zamanda bireylerin dini hassasiyetlerini göz önünde alarak ülke üretiminin ve refahının artırılmasına katkı sağlamaları nedeniyle bankacılık sistemindeki payları arttırılmalıdır."
