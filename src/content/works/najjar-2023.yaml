abstract: "Fâtiha suresi müfessirlerin önem verdiği surelerdendir. Bu durumun sebebi, surenin önemli bilgiler ihtiva etmesi, Ümmü'l-Kur'ân olması, Seb' u'l-mesânî olarak isimlendirilmesi ve Kur'ân'nın en faziletli surelerinden olmasındandır. Bu araştırmada Fâtiha suresine iki önemli tefsir olan Taberî'nin Câmiu'l-beyan ve Alûsî'nin Rûhu'l-meâni isimli eserleri aracılığıyla ışık tutmaktadır. Araştırmada müfessirlerin ayetlerle ilgili görüşleri serdedilmiş, konuyla ilgili söyledikleri bir araya getirilip, sonrasında iki kitap arasında mukayese yapılarak ittiafak ve ihtilaf ettikleri hususlar belirtilmiştir. Müfessirlerin isrâiliyyâta bakışları nahiv, lügat, usul, fıkıh ve akîde konularındaki görüşleri kıyaslanmıştır. Araştırmada karşılaştırmalı, analitik tüvevarım yöntemi kullanılmıştır. İki müfessirin hayatı, ilmî durumları ve kitapları tanıtılırken betimleyici tarihsel yöntem kullanılmıştır. Araştırmada varılan sonuçlardan önemlileri şunlardır: Fâtiha suresi özelinde yapılan karşılaştırmanın verilerine göre Taberî âsâra; Alûsî ise özellikle akâdile ilgili konularında rey, mantık ve kelam ilmine daha fazla yer vermiştir. Bilindiği gibi Taberî âsârla tefsiri usul olarak benimseyen müfessirlerdendir. Alûsî ise kozmik olaylara ve hususlara odaklanması ile benzersizdir. Taberî tefsirinde ise bu özellik bulunmamaktadır. Taberî, Kaderiyye ve Mu'tezile gibi muhalif mezheplere de birçok konuda cevaplar vermiş, Alûsî ise daha çok fıkıh meseleleriyle ilgilenmiştir. O belirli bir ekole bağlı kalmamış, delile göre tercih yapmıştır."
