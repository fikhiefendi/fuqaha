abstract: "İnsanın yeryüzüne gönderildiği andan itibaren mukaddes bir bölge kabul edilen Harem bölgesi, Kâbe'nin Hz. İbrahim tarafından inşasıyla birlikte dini yaşantıda daha mühim bir yer bulmuştur. Öyle ki süreç içerisinde kendisine özgü bir fıkıh literatürü bile hâsıl olmuştur. İşte bu çalışmamız Harem bölgesinin kendisine özgü olan değerler pazılının bir parçasını teşkil eden Mekke evlerinin satışı ve kiralanması ile ilgili kaynakların ele alınması ve ilim çevrelerince nasıl değerlendirildiği ile ilgili bilgi edinmeyi amaçlamaktadır. Çalışmamız tezin konusunu, amacını, önemini, metodu ve kaynaklarını ele alan giriş bölümü ile başlayıp takip eden üç bölüm ile teşekkül etmiştir. Tezimizin birinci bölümünde konunun daha iyi anlaşılması için ihtiyaç duyulan bazı kavramsal ve tarihi verilere yer verilmiştir. Çalışmamıza konu olan Mekke evlerinin bulunduğu yer itibari ile sınırları belirli bir alanı işaret etmesi ilesöz konusu bölgeyi doğrudan ilgilendiren yahut bu bölgenin sahip olduğu değere katkı sağlayan unsurlarla ilgili bilgilere geniş bir yer ayırmak uygun görülmüştür. Bunu yaparken de verilerin genelden özele olacak şekilde bir tertip ile ele alınmasına dikkat edilmiştir. İkinci bölüm konuya kaynaklık eden rivayet müktesebatının tespitine ayrılmıştır. Mevcut haberler evlerin satışı ve kiralanmasına red - onay verenler şeklinde iki ana başlıkta değerlendirilmiştir. Her iki başlıkta da yer alan rivayetler sıralanırken sıhhat yönünden daha güçlü kabul edilenlere öncelik vermeye çalışılmıştır. Ayrıca hadis âlimlerinin bu rivayetlere bakış açıları ele alınarak hadislerin nasıl konumlandırıldığına dikkat çekilmiştir. Üçüncü bölümde ise Mezhep imamlarının ve takipçilerinin konuya yaklaşımlarına ve delil kabul ettikleri rivayetleri nasıl değerlendirdiklerine yer verilmiştir. Aynı zamanda karşı görüş için ortaya konan tenkitler de bu bölümde kendisine yer bulabilmiştir. Sonuç olarak konuyla ilgili bütün rivayetler ve bunlara dair görüş ortaya koyanların düşünceleri çerçevesinde probleme bir açıklık getirilmeye çalışılmıştır."
