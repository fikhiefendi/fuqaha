abstract: "Nesih konusu başta fıkıh ve tefsir olmak üzere İslâmî ilimlerin ana konularından birini oluşturur. Bununla birlikte bu konu ilk dönemlerden itibaren İslam ilim ve kültür tarihinin çok tartışılan meseleleri arasında yer almıştır. Neshin mahiyeti ve keyfiyeti başta olmak üzere Peygamberlerin şeriatları arasındaki mevcudiyeti, son peygamber Hz. Muhammed'in (s.a.v.) kendi şeriatındaki varlığı, neshin ilişkili olduğu diğer kavramlarla olan münasebeti gibi hususlarda tarihi süreçte tartışmalar yaşanmış olsa da Kur'an'daki mensûh âyetlerin niceliği konusu bu tartışmaların başını çekmektedir. Mensûh âyetlerin niceliği hususunda yaşanan ihtilaflar genel olarak neshin kavramsal çerçevesine ve tahakkuku için öne sürülen şartlara dayanmaktadır. Nesih kavramı tarihi süreçte mütekaddimûn dediğimiz ilk iki asırda tahsîs, takyîd, tebyin, tefsir, tafsil ve istisna gibi birçok hususu ifade etmek üzere kullanılmış hatta bedel, sıfat ve şart gibi hususlar nâsih olarak telakki edilmiştir. Tabii olarak mensûh âyetler ilk dönemin nesih tasavvuruna bağlı olarak kabarık bir liste teşkil etmiştir. Müteahhirûn döneminde ise bu kavram anlam daralmasına uğramış, sınırları belirlenip kendisine bir çerçeve çizilmiş ve buna bağlı olarak nâsih-mensûh sayısında peyderpey düşüşler yaşanmıştır. Müteahhirûn döneminde nesih kavramı anlam daralmasına uğramış olsa da mensûh âyetlerde ve sayısında ittifak sağlanamamıştır. Bu ise temelde iki meseleye dayandığı görülmüştür: 1. Selef'in nesih anlayışının etkisinin devam etmesi 2. Neshin tahakkuku için öne sürülen ve pratikte bağlı kalınan şartlar. Müteahhirûn dönemine denk düşmesine rağmen selef'in nesih anlayışını sürdüren kimi isimler mensûh âyet sayısını yüksek tutarken, dönemin nesih anlayışına bağlı kalanlar ise bu sayıyı aşağıya çekmişlerdir. Keza bazı isimler neshin gerçekleşmesi için bazı şartları ileri sürerek nesih alanını daraltırken bazıları ise bu tür şartları lazım görmez veya teoride söylem birliği içinde olsa da pratikte buna bağlı kalmayarak diğerlerine nisbeten neshin kapsamını daha geniş tutmuşlardır. Nesih tasavvuru ve mensûh âyetlerin niceliği hususunda klasik ulemâ arasında yaşanan bu ihtilafların modern döneme yansıması ise iki şekilde olduğu görülmüştür: 1. İhtilafların neshin tarihi süreçteki gelişimi zemininde okunması 2. İhtilafların yüzeysel okunup neshin reddine gerekçe kılınması. Bu çalışmada ise nesih kavramının sözlük ve terim anlamları ile tahakkuk şartları açıklanıp tarihi süreç içerisinde geçirdiği değişim ve dönüşüm incelenmiştir. Neshin tarihi süreci, kavramın geçirdiği değişim ve dönüşüme bağlı olarak dönemlere ayrılmış ve her dönemin nesih tasavvurunun mensûh âyet sayısına olan etkisi gösterilmeye çalışılmıştır."
