abstract: "Bu çalışmada, Arap dilinin İslam hukuku içerisindeki merkezi rolü göz önünde bulundurularak emir ve nehiy sîgalarının anlam dünyası, meânî ve usûl-i fıkıh ilimleri ekseninde incelenmiştir. Zira nasın doğru anlaşılması, kelime ve cümlelerin anlamına dair güçlü bir dil yetkinliği gerektirmektedir; bu da Arapçanın anlam derinliği ve ifade incelikleriyle kurulan sıkı bir ilişkiyi zorunlu kılmaktadır. Özellikle hüküm çıkarmada kullanılan delalet türlerinin ve sîgaların farklı yorumlara açık olması hem mezhepler arası ihtilaflara hem de bireysel metodolojik ayrılıklara yol açmıştır. Çalışmanın ana amacı, belâgat ve usûl âlimlerinin emir ve nehiy sîgalarına yükledikleri anlamları karşılaştırmalı biçimde analiz etmek ve bu iki ilmî disiplinin aynı dil formlarını nasıl farklı yönlerden değerlendirdiğini ortaya koymaktır. Mevcut literatürde genellikle tek bir ilim disiplini yahut tek bir müellif özelinde yapılan çalışmalardan farklı olarak, bu tezde Sa'düddîn Mes'ûd b. Fahriddîn Ömer b. Burhâniddîn Abdillâh el-Herevî el-Horâsânî et-Teftâzânî (ö. 792/1390) ve Ebû Abdillâh Celâlüddîn Muhammed b. Ahmed b. Muhammed el-Ensârî el-Mahallî (ö. 864/1459) özelinde iki farklı yaklaşım benimsenmiştir. Belâgat açısından el-Mutavvel, usûl-i fıkıh açısından ise el-Bedrü't-Tâliʿ fî Halli Cemʿi'l-Cevâmiʿ temel metin olarak seçilmiş; ayrıca Ebü'l-Meâlî Celâlüddîn el-Hatîb Muhammed b. Abdirrahmân b. Ömer b. Ahmed el-Kazvînî (ö. 739/1338) ve Ebû Ya'kūb Sirâcüddîn Yûsuf b. Ebî Bekr b. Muhammed b. Alî el-Hârizmî es-Sekkâkî (ö. 626/1229) gibi klasik belâgatçıların görüşlerine de yer verilmiştir. Çalışmanın birinci bölümünde, Teftâzânî ve Mahallî'nin hayatları, hoca-talebe ilişkileri, fıkıh ve belâgat ilmindeki konumları ile bu alanlara katkıları ele alınmıştır. Teftâzânî; belâgat, kelâm ve mantık alanlarında derin etkiler bırakmış, müteahhir dönem ilim geleneğinin kurucu isimlerinden biri olarak öne çıkmaktadır. Mahallî ise keskin zekâsı ve usûle dair nüfuz edici yaklaşımıyla Şâfiî fıkhında otorite kabul edilmiştir. Bu özellikleri dolayısıyla her iki müellif, çalışma kapsamında karşılaştırmalı analiz için tercih edilmiştir. İkinci bölümde, emir sîgası ve bu sîgayla ilişkilendirilen anlam katmanları, Mahallî ve Teftâzânî özelinde ele alınmış; iki müellifin farklı yaklaşımları ayrıntılı biçimde analiz edilmiştir. Üçüncü bölümde ise nehiy sîgası benzer bir yöntemle incelenmiş, müelliflerin ilgili metinlerdeki tutumları karşılaştırılmış ve farklı kaynaklarla desteklenerek derinleştirilmiştir. Bu tez, belâgat ve usûl-i fıkıh ilimlerinde emir ve nehiy sîgalarının nasıl yorumlandığını karşılaştırmalı biçimde incelemeyi, ortak yönleri ortaya koymayı ve görüş ayrılıklarını belirlemeyi amaçlamaktadır. Emir ve nehiy sîgaları, dil (belâgat) ve fıkıh ilişkisi bağlamında incelenmiş; tespit edilen anlam farklılıklarının hüküm çıkarmaya etkileri değerlendirilmiştir. Çalışma, elde edilen bulguların yorumlandığı bir sonuç bölümüyle tamamlanmıştır."
