abstract: "Tez özet Türkçe Bu çalışma, 2014–2024 döneminde seçilmiş makroekonomik göstergelerin Irak'taki geleneksel ve İslami bankalar ile Türkiye'deki geleneksel ve katılım bankalarının kârlılığı üzerindeki etkilerini incelemektedir. Banka kârlılığı özsermaye kârlılığı (ROE) ve aktif kârlılığı (ROA) ile ölçülmüştür. Doğal logaritması alınan Reel GSYH, TÜFE enflasyon oranı, politika faiz oranı, döviz kuru ve işsizlik oranı makroekonomik değişkenler olarak kullanılmıştır. Her ülke için 11 yıllık sektör düzeyinde gözleme dayanan veriler, betimsel-analitik yöntem ve basit OLS regresyon modelleriyle analiz edilmiştir. Gözlem sayısının sınırlı olması ve değişkenler arasında yüksek çoklu doğrusal bağlantı belirlenmesi nedeniyle her makroekonomik gösterge ayrı bir modelde tahmin edilmiştir. Türkiye'de değişen varyans belirlenen modeller için Newey–West HAC düzeltmesi uygulanmış, ülkeler arasındaki katsayı farklılıkları ise standartlaştırılmış katsayılara dayalı Wald testiyle incelenmiştir. Irak'a ilişkin sonuçlarda döviz kuru, dört kârlılık modelinde negatif ve anlamlı etki göstererek en güçlü değişken olarak öne çıkmıştır. Enflasyonun etkisi genel olarak negatifken, politika faizi ve Reel GSYH için anlamlı bir etki belirlenmemiştir. İşsizliğin negatif etkisi banka türüne ve kârlılık göstergesine göre farklılaşmıştır. Türkiye'de politika faizi ve döviz kuru kârlılık üzerinde pozitif ve anlamlı, işsizlik oranı ise negatif ve anlamlı etki göstermiştir. Reel GSYH ve enflasyon için sağlam bir anlamlı etki tespit edilmemiştir. Wald sonuçları, ülkeler arasındaki temel farklılığın döviz kuru ve enflasyon etkilerinde ortaya çıktığını göstermiştir. Bulgular, makroekonomik etkilerin ülkenin ekonomik ve parasal koşulları çerçevesinde değerlendirilmesi gerektiğini ortaya koymaktadır"
