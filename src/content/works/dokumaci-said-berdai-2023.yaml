abstract: "Bu araştırmada Bağdat Hanefî fakihlerinin son halkası sayılan ve Hanefî fıkhı kurucu fakihlerinin fıkhî mirasını onlardan sonra sürdüren üçüncü nesil fakihlerden Ebû Saîd el-Berdaî'nin fıkhın alt dalı olan hilâf ilmi üzerine telif ettiği Mesâilü'l Hilâf adlı eseri üzerinden fıkıhçılığı, konu edilmiştir. Hanefî fıkıh literatürü incelendiğinde sözü edilen yazarın hayatının yalnızca bir ansiklopedi maddesinde yer aldığı görülmüştür. Ebû Saîd el-Berdaî'nin hayatının yanı sıra fıkıhçılığının da ortaya konulması gerekmektedir. Bu bağlamda araştırmada Ebû Saîd el-Berdaî'nin Mesâilü'l Hilâf adlı eseri üzerinden fıkıh usûl ve fürûu hakkındaki görüşlerinin tespit edilmesi amaçlanmaktadır. Araştırmada literatür taramasına ek olarak el yazma eserin bilgisayar ortamına aktarılmasıyla beraber belirlenen hususların karşılaştırılmasının ve değerlendirilmesinin ortaya konulmasında tümevarım yöntemi ve içerik analizi yöntemine yer verilmiştir. Ebû Saîd el-Berdaî'nin fıkıhçılığı bağlamında umum lafzın delaleti hakkında tavakkuf görüşünü benimsediği nakledilmesine karşın, Hanefî mezhep anlayışına uygun olarak umum lafzın delaletinin katîlik arz ettiği, Kur'an'ın mana ve lafız olarak değerlendirmesinde mananın önemli olduğu, umumî fıkhî küllî kaidelerin oluşumuna öncülük eden fakihlerden olduğu ve yalnızca dört husus dışında diğer tüm meselelerde Hanefî fıkhı kurucusu Ebû Hanîfe'nin görüşlerine katılarak onun gerekçelerinin neler olabileceği hakkında bilgiler verdiği sonucuna ulaşılmıştır."
