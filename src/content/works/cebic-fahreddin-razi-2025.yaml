abstract: "Değişen zaman ve koşulların tabii bir sonucu olarak ortaya çıkan yeni fıkhî problemlere dinin ilke ve esasları çerçevesinde cevap verebilmek maksadıyla başvurulan içtihat ve ta'lîl, dinin hukuk sisteminin dinamik yapısını devam ettirmek adına önem verilen faaliyetlerdendir. İçtihat ve ta'lîl bağlamında hükümlerin sebepleri ve konuluş amaçları da bu iki unsurun devamı için gerekli temel yapı taşlarıdır. Fukaha arasında, genel anlamda hükmün nedeni olarak tanımlanan illetinin ve hükmün konuluş amacı olarak tanımlanan hikmetinin ne olduğu, nasıl tespit edileceği ve istidlâlde hangisinin esas alınacağı hususunda temelde kelâmî görüşlere dayanan birtakım görüş ayrılıkları mevcuttur. Çalışma, fıkıh usûlü alanında görüşleriyle önemli bir yer tutan ve sonraki dönemlere büyük etki bırakmış âlimlerden biri olan Fahreddin er-Râzî'nin (ö. 606/1210), öne çıkan eseri el-Mahsûl başta olmak üzere fıkıh usûlü eserlerinde geçen“hükmün muarrifi”olarak tanımladığı illete ve“hükmün ve illetin konuluşunda asıl etkili unsur”olarak açıkladığı hikmete dair görüşleri üzerinedir. Bu bağlamda illetin tanımı, illetin tespitine ilişkin zikredilen yollar ve bir vasfın illet olmadığını gösteren yöntemler Râzî'nin düşünceleri istikametinde ele alınacaktır. Onun hikmetle ta'lîlin mutlak anlamda caiz olduğuna dair kanaati ise; hükmün asıl müessiri olarak kabul ettiği hikmet tasavvurundan kaynaklanmaktadır."
