abstract: "Son 20-30 yıldır ülkeler arasındaki fiziki ve teknolojik sınırların kalkması, ülkelerin siyasi işbirlikleri ile birlikte ekonomik işbirliklerinin de artmasını beraberinde getirmiştir. Ekonominin temel aktörlerinden bankacılık sektörü de bu olumlu süreçten faydalanmış, dünyada ve Türkiye'de bankacılık sektörü hızla büyümüştür. Bu büyümenin sonuçlarından biri olan ve faize duyarlı Müslümanların ellerindeki fonları piyasaya kazandırmak amacıyla dünyada 1970'lerde ortaya çıkan, Türkiye'de ise 1980'li yıllarda şekillenmeye başlayan İslami bankacılık sisteminin rakamsal ve hacimsel boyutları günümüzde gittikçe büyümektedir. İslami bankacılık sistemi her ne kadar konvansiyonel bankacılık sisteminde olduğu gibi topladığı fonları kredi olarak kullandırıp kâr elde etme amacına dayansa da konvansiyonel bankalardan farklı bazı araçlar ve yöntemlerle çalışmaktadır. Çalışmanın amacı gittikçe büyüyen İslami bankacılık alanında katılım bankalarının sorunlarının, sektördeki pazar payının incelenmesi ve Türkiye'nin en önemli bölgelerinden biri olan Ege Bölgesi'ndeki katılım bankası müşterilerinin katılım bankalarına olan talep yapısının analizini gerçekleştirmektir. Çalışmanın bu alana yönelmesindeki en önemli etkenlerden biri, dünyada farklı ülkelerde katılım bankası müşterilerinin talep yapısının araştırılması ve analiz edilmesi noktasında farklı akademik çalışmalar gerçekleştirilmişken, ülkemizde bu alan üzerinde yeteri kadar makro bazda çalışmalar yapılmamış olmasıdır. Aynı zamanda Türkiye'de katılım bankalarının talep yapısının belirlenmesine yönelik yapısal eşitlik modellemesi çerçevesinde doğrulayıcı faktör analizi yardımıyla bir modelin oluşturulmaması da gerçekleştirdiğimiz doktora çalışmasına dayanak teşkil eden bir diğer temel faktördür. Dolayısıyla çalışmada“Katılım Bankaları Tercih Sebepleri”adıyla 4 boyut altında yer alan 21 madde aracılığıyla ölçülebilen yeni bir ölçek modeli doğrulanarak; bu konuda araştırmacılara, akademisyenlere ve genel olarak faizsiz bankacılığa yönelik yeni bir model kazandırılmış, aynı zamanda da pratiğe yönelik olarak katılım bankalarının da kendi müşteri ve ürün politikalarını belirlerken faydalanacakları yeni bir kaynak oluşturulmuştur. Çalışmada katılım bankalarının tercih edilmesinde etkili olan faktörler ulusal ve uluslararası literatür çerçevesinde incelenmiş, Ege Bölgesi'ndeki katılım bankası müşterileri üzerinde uygulanan ölçek sonucunda katılım bankaları talep nedenlerinin tespit edilmesi için istatistiksel programlarla yapısal eşitlik modeli çerçevesinde doğrulayıcı faktör analizi ile birlikte cronbach's alpha, t-test, varyans ve korelasyon analizleri gerçekleştirilmiştir."
