abstract: "Bu çalışmanın amacı, birçok alanda nadide eserler telif eden Sadrüşşeria'nın, fıkıh usûlüne dair yazdığı Tavzîh adlı eseri bağlamında hukukçuluğunu değerlendirmektir. Çalışmamız, giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında fıkıh usûlünün tarifi, şer'î deliller ve fıkıh usûlü ilminin Sadrüşşeria'ya kadar olan tarihi seyri gibi konular özetlenmiştir. Birinci bölümde Sadrüşşeria'nın yaşadığı dönem ışığında ailesi, hayatı, tahsili, hocaları, talebeleri ve ilmi kişiliği ele alınmıştır. İkinci bölüm de ise fıkıh usûlü bakımından Tavzîh adlı eser tanıtılmış ve Sadrüşşeria'nın fıkıh usûlü konularına yaklaşımıyla onun usûl anlayışı incelenmek suretiyle şer'î deliller ve ahkâm konularıyla ilgili düşüncelerine yer verilmiştir. Hür ve mutlak ictihadın durakladığı, Kitap ve Sünnet kaynaklarından hukukî ve dinî hayata doğrudan çözümler getiren çalışmaların azaldığı, onun yerini taklitçilik ruhunun aldığı, mezhebe bağlılığın yerleştiği ve ictihad kapısının kapandığı bir dönemde yaşayan Sadrüşşeria, Hanefîliğin günümüze kadar sağlıklı bir şekilde ulaşmasını sağlayan önemli müctehidlerden biridir. Moğol istilasından sonra harabeye dönen Buhâra'nın tekrar ilmin merkezi haline gelmesinde onun büyük katkısı olmuştur. Sadrüşşeria'nın yetiştirdiği öğrenciler ve İslami ilimlerin hemen her dalında kaynak mahiyetinde yazdığı eserler etkisini günümüze kadar sürdürmüştür. Sadrüşşeria'nın eserleri, İbn Mübarek Şah gibi talebeleri vasıtasıyla tüm İslam âlemine yayılmış, özellikle çalışmamızın merkezindeki \"Tavzîh\" adlı eseri de Osmanlı'nın ilk medresesi olan İznik medresesinden itibaren cumhuriyet dönemine kadar temel fıkıh usûlü eseri olarak okutulmuştur. Fukahâ ve mütekellimin mesleklerini mezcederek ele alınan Tavzîh, memzûc (karma) fıkıh usûlü eserlerinin en güzel örneklerinden biridir. Hanefî-Mâtürîdî ekolünün Gazzâlî'si olarak nitelendirebileceğimiz Sadrüşşeria bu eserinde bir ilmin birden fazla konusu olabileceği savından hareketle felsefe ve mantık ilmini, fıkıh usûlü ilmine dâhil etmiştir. Sadrüşşeria aklı, nakil karşısında daha aktif hale getirmek suretiyle müctehidlerin, ictihad alanını genişletmiştir. Anahtar Sözcükler: Sadrüşşeria, Tavzîh, fıkıh, usûl ve müctehid."
