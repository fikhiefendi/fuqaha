abstract: "Bu çalışmada hicrî 5. yy'ın en önemli Caferî fıkıh âlîmlerinden biri olan Ebû Ca'fer eṭ-Ṭûsî'nin eserlerinde fıkıh usûlünün temel kavramlarından biri olan neshin mahiyeti ve pratiğini inceledik. 385/995 yılında Horasan'da dünyaya gelen Ṭûsî,“ahbârîler”ve“usûlîler”olarak isimlendirilen iki ana ekolün yöntemlerini birleştirerek şîî fıkhında bir çığır açmıştır.“Ebû Ca'fer eṭ-Ṭûsî'nin Tefsirinde Nesh”adlı tezimiz giriş, iki ana bölüm ve sonuç bölümünden oluşmaktadır. Girişte Şia mezhebinin Kur'ân hakkındaki görüşleri anlatılmıştır. Birinci bölümde farklı nesh tanımları ve Ṭûsî'nin neshin mahiyeti ile ilgili görüşleri anlatılmıştır. Ṭûsî, Kur'ân'da neshi ('metni mensûh hükmü bâkî', 'hükmü mensûh metni bâkî' ve 'hükmü ve metni mensûh' şeklinde) kategorik olarak ayırmakta ve el-'Udde fī Uṣūli'l-Fıḳh isimli eserinde detaylı bir biçimde bu konuyu incelemektedir. Ṭûsî, Kur'ân ve Sünnet'te neshi kabul ederken; icmâ ve kıyasın neshini reddetmektedir. İkinci bölümde Ṭûsî'nin tefsirinde âyetler arasında neshi nasıl incelediğini anlattık. Ṭûsî tefsirinde çoğunlukla İbn 'Abbâs (ö. 68/687) ve tâbiûn dönemi müfessirleri'nin görüşlerine yer verirken; bazen kendi kanaatlerini dile getirmektedir. Aynı zamanda bu durum Ṭûsî'nin nesh konusundaki görüşlerini tespit etmemizi zorlaştırmaktadır. Sonuç kısmında genel bir değerlendirme yapılmıştır. Tespitlerimize göre tefsirinde 6 yerde neshi sözlük anlamıyla kullanan Ṭûsî, 119 âyette neshi (ıstılahî anlamda) konu edinmiştir. Ṭûsî'nin tercihlerini dikkate aldığımızda 11 âyeti nâsih ve 11 âyeti mensûh kabul ettiği sonucuna ulaşıyoruz."
