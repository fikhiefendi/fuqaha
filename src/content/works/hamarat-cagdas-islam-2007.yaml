abstract: "Bu çalışmanın konusu çağdaş İslam âlimlerinden Muhammed Hamidullah'ın İslam hukukuna dair görüş ve açılımlarıdır. Bu çerçevede, Muhammed Hamidullah'ın hayatı, şahsiyeti ve eserleri hakkında bilgi verilmiş daha sonra Hamidullah'ın İslam hukukuna dair mevzularda ifadelendirmiş olduğu görüş ve tercihleri belli başlıklar altında tahrir edilmiştir. Bu çalışma; giriş dışında üç bölümden oluşmaktadır. Giriş bölümünde; konunun önemi, sınırları ve kaynakları belirtilmiştir. Birinci bölümde; Muhammed Hamidullah'ın hayatı, şahsiyeti ve eserleri ele alınmış, İslam hukuk ile ilgili yazıları hakkında belli tespitler ortaya konulmuş, diğer alanlarla ilgili çalışmaları ise isim olarak tespit edilmeye çalışılmıştır. İkinci bölümde; fıkıh usulüyle ilgili görüş ve açılımları değerlendirilmiştir. Burada Fıkıh Usulü'nün mahiyeti ve tarihi gelişimi, bu gelişime katkısı olan bazı şahıslar ile ilgili Hamidullah'ın değerlendirmeleri konu edinilmiştir. Üçüncü bölüm ise, Hamidullah'ın fıkha dair tespit ve görüşleri başlığını taşımaktadır. Bu başlık altında kamu hukuku özel hukuk ayrımı dikkate alınmadan, Hamidullah'ın; İbadetler, İslam İktisadı, Anayasa ve Devletler Hukuku konularındaki görüşleri ele alınmıştır"
