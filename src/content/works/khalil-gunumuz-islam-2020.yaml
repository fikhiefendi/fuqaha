abstract: "Bu çalışmada, günümüzde birçok ülkede faaliyet gösteren İslamî bankalardaki murâbaha uygulamalarının fıkhî açıdan tahlil ve değerlendirilmesi amaçlanmaktadır. Tezde, klasik fıkhî anlayış yanında, bu amaçla kurulmuş modern uluslararası kuruluşlar tarafından belirlenmiş olan şer'i standartlar esas alınmıştır. Çalışmanın giriş kısmında konuyla alakalı gerekli tanımlamalara yer verilmiş ve daha anlaşılır hale getirilmek için bazı örnekler üzerinde durulmuştur. Ayrıca Faizsiz Finans Kuruluşları Muhasebe ve Denetim Kurumu (AAOIFI) gibi finans kurumlarının standartlarını belirleyen bazı kuruluşlara değinilmiş ve bu kuruluşlar hakkında genel bilgiler verilmiştir. Birinci bölümde İslamî bankaların bazı murâbaha uygulamaları tanımlanmış ve detaylı bir şekilde analizleri yapılmıştır. İkince bölümde ise analizi yapılan uygulamaların birinci bölümde fıkıh kurallarına göre değerlendirilmesi yapılmıştır. Bankaların murâbaha uygulamaları yine bu kurallar çerçevesinde birbirleriyle karşılaştırılıp genel bir sonuca ulaşılmaya çalışılmıştır."
