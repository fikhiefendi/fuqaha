abstract: "Bu çalışmamızda, H. 29 Cumadiye'l Ahir 1332- H. 4 Cumadiye'l ula 1333 (M.1914-1915) tarihleri arasını içeren 648 Numaralı Karahisar-ı Sahip Şer'iyye Sicili incelenmiştir. Şer'iyye sicillerinin şehir tarihi açısından taşıdığı önemden dolayı, çalışmış olduğumuz Karahisar-ı Sahip Şer'iyye Sicili'nde bulunan 273 adet belge basit transkripsiyon ile günümüz alfabesine çevrildikten sonra dikkatli bir plan dâhilinde tasnife tabi tutularak değerlendirmiştir. Defterden, Karahisar-ı Sahip'in idari ve fiziki yapısı ile ilgili olarak belirtilen yıllara ait merkeze bağlı ve diğer kazalara ait, nahiye, köy, mahalle isimleri ile bazı yer isimlerini tespit etmek mümkün olmuştur. Bu durum sadece Afyonkarahisar ile sınırlı kalınmamış Osmanlı Devleti'nin değişik yerlerindeki şehir, mahalle ve yer isimlerini de öğrenmek mümkün olmuştur. Bunun yanı sıra incelediğimiz dava kayıtlarından sosyal hayatla ilgili olarak; Türk ve Ermenilere ait şahıs isimleri, bulunduğu mahalleler, evlenme, boşanma, miras ve nafaka hukuku gibi toplumsal yapıya ışık tutabilecek önemli bilgilere de ulaşılmıştır. Ayrıca devletin değişik birimlerindeki görevliler, kadı, muhtar vb. ile bu görevlilerin görev yerleri de ortaya çıkarılmakla beraber Afyonkarahisar'dan savaşa katılanları tespit etmek mümkün olmuştur. Çalışmamız, XX. Yüzyılın ilk çeyreği gibi önemli bir zaman dahilinde, Afyonkarahisar'ın sosyo- ekonomik durumuna az da olsa ışık tutmuş olması açısından son derece önemlidir."
