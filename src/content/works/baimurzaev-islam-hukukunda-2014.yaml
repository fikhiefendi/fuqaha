abstract: "Baimurzaev, Chyngyz, İslam Hukukunda Zina Dışındaki Cinsel Suçların Hukuki Sonuçları, Yüksek Lisans Tezi, Danışman: Doç. Dr. Ahmet Ünsal, 78 s. Bu çalışmada, arasında nikah bağı olmayan kadın ve erkeğin meşru olmayan cinsel ilişkisi olarak tanımlanan zina suçu ve hükümleri haricindeki cinsel suçların önce tıbbî ve psikolojik analizi yapılarak, sonra da İslâm hukukunun verdiği hükümler farklı mezheplere göre tespit ederek değerlendirmeye çalışılmıştır. Tez, giriş kısmıyla beraber iki bölümden oluşmaktadır. Tezin giriş kısmı konunun önemi, sınırlandırılması, araştırmada kullanılan yöntem ve araştırmanın sunulmasını içermektedir. Birinci bölümde, nikah bağı bulunan kimselerin yapmış olduğu suç mahiyetin taşıyan cinsel faliyetler ele alınmıştır. Bunları, hayız ve lohusalık halinde cinsel ilişkide bulunmak, zıhar yaptıktan sonra temas etmek, oruçluyken veya ihramda iken cinsel temas, hanımıyla yasak yoldan ilişki kurmak ve azl yapmak şeklinde sıralamak mümkündür. İkincisi bölümde ise, aralarında nikah bağı olmayan kimselerin ve tek şahıs tarafından meydana gelen suç mahiyeti taşıyan cinsel faliyetlerin İslam Hukukuna göre hukukî sonuçları değerlendirilmeye çalışılmıştır. Ayrıca, bu kategoriye giren bazı cinsel faliyetlerin bir takım ortaya çıkış nedenleri de maddeler halinde sıralanmıştır."
