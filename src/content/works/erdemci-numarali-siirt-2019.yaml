abstract: "Şer'iyye sicilleri Osmanlı hukuk sistemi içerisinde oldukça önemli bir yer edinir. Nitekim şer'iyye sicilleri, kayda geçirildikleri bölgelerin sosyal, ekonomik, kültürel, askeri ve idari yönlerini anlamamız açısından önem teşkil etmekle birlikte Osmanlı Devleti'nin sahip olduğu hukuk yapısının ana hatlarını anlamamız açısından da ayrıca önemlidir. Bu yönleriyle üzerinde çalışılan şer'iyye sicilleri kayda değer bir durum yaratmaktadır. Şer'iyye sicilinin yapılan değerlendirmesi sonucu 1896 ve 1898 yılları arasında Siirt'in sosyal, kültürel, ekonomik, askeri, idari ve hukuki durumu tespit edilmeye çalışılmıştır. Buna bağlı olarak bölgeye ait genel tespitler yapılırken durumun izahatını kolaylaştırmak için çeşitli tablolar oluşturulmuştur. Şer'iyye sicilinde yapılan değerlendirmenin daha sağlıklı olabilmesi için hükümler içeriklerine göre çeşitli başlıklar altında toplanmış ve bunların şer'iyye sicili içerisindeki oranı ise pasta grafiğinde belirtilmiştir."
