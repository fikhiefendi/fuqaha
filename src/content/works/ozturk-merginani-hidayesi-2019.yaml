abstract: "el-Hidâye, Merginânî'nin“Bidâyetu'l-Mubtedî”adlı eserinin şerhi olarak yazılmış bir eserdir. Bu çalışmada temizlik, ibâdet ve nikâh konularında İmâm Muhammed'in İmâm Ebû Hanîfe ve İmâm Ebû Yûsufkarşısında tek kaldığı görüşler ele alınmıştır.İmâm Muhammed, bir konuda karar verirken müctehidinictihâdındayanılabileceğini kabul ederek farklı bir delille karşılaştırılınca o hükmün değiştirilebileceğini söylemiştir. O, bütün problemlerde her zaman nasların lafzıyla çözüme gidilmeyeceğini bildiği için lafzî kuralların yanında aklî prensipleri de dikkate alarak çözüme gitmiştir.EbûHanîfe'nin öğrencilerine sağlamış olduğu serbest tartışma ortamı onların görüşlerini daha rahat söylemelerine vesile olmuş böylece de ictihâd seviyesine çıkabilmişlerdir. Ve onların bazı konulardaki görüşleri zaman içerisinde müftâ bih görüş olarak uygulamaya konulmuştur. Bu çalışmanın amaçlarından biri, mezhep içi müftâ bih olan veya olmayan görüşlerle diğer mezhepleri de karşılaştırarak ihtiyaç anında İmâmA'zâm dışında cumhûrla örtüşen mezhep içi ictihâtların da tercîhedilebileceğine kapı aralamaktır."
