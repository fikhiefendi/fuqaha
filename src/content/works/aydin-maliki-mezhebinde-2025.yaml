abstract: "Bu çalışmada, Mâlikî mezhebinde genel (âm) ifade taşıyan nasların, maslahat ilkesi doğrultusunda tahsis edilmesi meselesi ele alınacaktır. Kur'ân ve Sünnette yer alan birçok lafız, kapsamına giren tüm bireyleri kuşatan genel ifadeleri barındırmaktadır. Mâlikî fakihler ise kamu yararını önceleyen maslahat düşüncesiyle bu lafızların kapsamını bazı durumlarda daraltmış, yani tahsis etmiştir. Her ne kadar benzer uygulamalar diğer mezheplerde farklı adlarla veya belirli şartlar altında görülse de Mâlikî mezhebi maslahat temelli yaklaşımıyla bu konuda daha sistemli ve dikkat çekici bir yöntem geliştirmiştir. Ülkemizde doğrudan doğruya Mâlikî usûl anlayışında nassın maslahatla sınırlandırılması konusuna odaklanan bir akademik çalışma bulunmamaktadır. Bu durum, çalışmanın Mâlikî mezhebi ekseninde derinleştirilmesini gerekli kılmıştır. Araştırmanın temel amacı, Mâlikî mezhebine ait klasik kaynaklardan hareketle maslahatla tahsis uygulamasının teorik zeminini ortaya koymak ve bu yaklaşımın fürû literatürdeki yansımalarını örneklerle somutlaştırmaktır. Böylece“nassın bulunduğu yerde içtihada yer yoktur”şeklindeki genel kabul gören prensibin, maslahat ilkesi çerçevesinde ne ölçüde esnetilebileceği ve hangi şartlarda içtihada imkân tanındığı ortaya konulmaya çalışılacaktır. Bu bağlamda çalışmamız, naslara bağlılık düşüncesinden ödün vermeksizin maslahat gerekçesiyle esneklik sağlayan, kurallı ve dengeli bir içtihat anlayışının imkâna ilişkin tartışmalar bağlamında somut bir veri tabanı ortaya koymayı amaçlamaktadır. Bu yönüyle araştırma, İslam hukuk geleneği içerisinde içtihada dair dengeli yaklaşımların çağdaş tartışmalara katkı sunabilecek potansiyelini örneklemektedir."
