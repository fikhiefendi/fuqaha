abstract: "Bu çalışma, çağdaş selefilerin nassları yorumlamadaki aşırılıklarını gözler önüne sermeyi ve bu yorumların İbn Teymiyye'nin tefsirleriyle karşılaştırmalı bir tahlilini sunmayı hedeflemiştir. Çalışmada esas problem ve temel hedefler şunlardır: 1. Dini aşırılığın genel nedenleri ve özellikle metinlerin tefsirindeki aşırılığın sebepleri; 2. Çağdaş Selefiliğin özellikle tekfîr ve cihâd meseleleriyle ilgili Kur'ân naslarını tefsir etme yöntemi bakımından İbn Teymiyye ile benzeştiği ve farklılaştığı noktalar; 3. Aşırı yorumların Tefsir Usulü açısından değerlendirilmesi. Birinci bölümde aşırılığın tanımı, sebepleri ve çağlar boyunca değişen görünümleri ele alınmıştır. İkinci bölümde Tefsirdeki aşırılıkların seyri ile önde gelen çağdaş selefi müfessirlerin yorum yöntemleri tetkik edilmiştir. Burada aşırılığın İslâm tarihinde nassların zahirine katı bir bağlılıkla metinlerin deruni manalarını ihmal ederek yapılan tefsirlerin bir neticesi olarak ortaya çıktığı belirtilmiştir. Üçüncü bölümde tekfîrle ilgili ayetler Tefsir ilmi ve yöntemleri açısından karşılaştırmalı olarak tahlil edilmiştir. Dördüncü bölümde ise Müslüman olmayanlara karşı muameleleri ve cihâd olgusunu içeren âyetlerin tefsiri, özellikle de müfessirlerin kılıç ayetiyle ilgili tartışmaları işlenmiştir. Neticede çalışmada çağdaş selefiliğin metinleri aşırı şekilde yorumlamasından, özellikle de 'kâfir' kelimesinin anlamındaki dilsel evrimi göz ardı etmesinden kaynaklandığı tespit edilmiştir. Ayrıca cihâdın ve mürtedlerin öldürülmesinin gerekçesinin esas olarak 'hirâbe' (yani toplumsal düzene isyan) olması gerektiği, kılıç ayetinin neshiyle ilgili iddiaların ise zayıf olduğu ortaya konmuştur."
