abstract: "Öz TÜRKİYE'DE İSLAMİ İKTİSAT AHLAKI'NIN YÜKSELİŞİ, RASYONALİTE VE KAPİTALİZM: KONYA ÖRNEĞİ Demirpolat, Anzavur Doktora, Sosyoloji Bolümü Tez Yöneticisi: Associated Prof. Dr. Yusuf Ziya Özcan Mart 2002, 346 sayfa Konya'da yürütülen saha çalışmasına dayanan bu çalışma, dini değerlerin Türkiye'de yeni bir Müslüman girişimci profilinin yükselişindeki rolünü anlamaya çabalar. Diğer bir deyişle, bu çalışma yükselen Müslüman girişimci profilinin 'iktisat ahlakı'nı ve onların 'iktisat ahlakı'nı etkileyen unsurların anlaşılmasını amaçlar. Bu amaçla, tezin teorik kısmında, Weber ve Sombart'ın dini değerler ve rasyonel kapitalizm ilişkisi hakkındaki görüşleri değerlendirilecektir. Özellikle, tezin ikinci bölümünde Weber' in temel sorunsalı tartışıldıktan sonra Weber'in 'iktisat ahlakı' kavramının temel boyutları ortaya konulacaktır. Ayrıca, tezin teorik bölümlerinde, klasik İslam dünyasında rasyonel bir 'iktisat ahlakı'nın gelişiminin olmayışının nedenleri İslam ve kapitalizm üzerine ortaya konan Weberci ve Rodinsoncu tezler değerlendirilerek, kritik bir biçimde tartışılacaktır. Ayrıca, tezin teorikkısımda, geleneksel Müslümanların 'iktisat ahlakı'nın değersel ve toplumsal temelleri ve niteliği, bu teorik yaklaşımların çerçevesinde kalınarak irdelenecektir. Bu nedenle, geleneksel Müslüman toplumların 'iktisat ahlakı'nı ortaya koymak için şehirli Müslüman esnafın ve küçük burjuvazinin ahlaki ve dini değerleri tarihsel bir yaklaşım içerisinde değerlendirilecektir. Aynı zamanda, bu tez sadece klasik İslam dünyasında, rasyonel bir 'iktisat ahlakı'nın olmayışının nedenlerini değil, Türkiye'de 1980'lerden sonra dini guruplar arsında yükselmeye başlayan yeni bir girişimci profiline katkıda bulunan unsurlarında araştırılmasını amaçlar; böylece yükselen Müslüman girişimcilerin geleneksel Müslüman tüccar ve esnafın 'iktisat ahlakı'ndan her hangi bir paradigmatik kopma gösterip göstermediklerini belirlemek mümkün olabilecektir. Dolayısıyla, tez Konya'da yükselen Müslüman girişimcilerin dini değerlerinin ve 'iktisat ahlakı'nın ampirik bir analizini de içerir."
