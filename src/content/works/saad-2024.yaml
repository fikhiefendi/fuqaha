abstract: "Bu çalışma, İslâmî bankalarda borç temerrüdüne yol açan nedenleri belirlemeyi, İslâmî bankacılığın özelliklerini ve temerrütleri önlemedeki koruyucu rolünü netleştirmeyi, sorunlu/temerrüd borçlarla başa çıkma yollarını bilmeyi ve bu sorunu çözmek etmek için bir sonuç çıkarmayı amaçlamaktadır. Çalışmada borç temerrüdü kavramının teorik yönü, aşamaları ve formları incelenerek betimsel yaklaşım; ardından bilgi toplamak amacıyla dağıtılan anketten elde edilen istatistikler analiz edilerek analitik bir yaklaşım izlenmiştir. Ayrıca bu veriler, sosyal bilimler için istatistiksel yazılım paketi (SPSS) tarafından da işlendi. Çalışma, Libya'daki İslâmî bankalarda yüksek düzeyde borç temerrüt nedenlerine ulaşmıştır. Bunun yanı sıra İslâmî bankalardaki borç temerrüdünün en yaygın nedenleri öncelikle yatırımdan kaynaklanmaktadır. İkinci derecede finansmana, üçüncü derecede ise bankalarla ilgili nedenlerden kaynaklanmaktadır. Bunun nedeni ise bankacılık garantilerinin zayıflığı, İslâmî bankada bağımsız bir şerî organının bulunmamas ı, finansman konusunda doğru bilgi eksikliği ve İslâmî bankalar tarafından finanse edilen projeler için ekonomik fizibilite çalışmalarının düşük kalitede olmasıdır. Çalışmada, müşterilerin finansmanına karar vermeden önce müşterilerinin koşullarını öğrenmek için bankalar arasında koordinasyonun gerekliliği ve müşterilerin sunduğu projeleri finanse etmeden önce incelemek için ekonomik fizibilite çalışmaları alanında ihtisas komiteler inin oluşturulması tavsiye edildi ve ayrıca finanse edilmek için sunulan projelere finansman verilmeden önce saha ziyaretlerinin yapılmasını ve sağlanan garantilerin değerinde meydana gelen değişikliklerin sürekli olarak takip ve değerlendirilmesinin sağlanması tavsiye edilmiştir."
