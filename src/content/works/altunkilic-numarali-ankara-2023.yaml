abstract: "Çalışmanın konusu 168 numaralı Ankara Şer'iyye Sicili defterinin latin alfabesine aktarılması ve içeriği konusunda tahlillerin yapılmasıdır. Araştırmanın en önemli amacı Ankara'nın belirtilen dönemdeki sosyal yaşamını, mahalli olaylarını, ekonomik, idari ve hukuki durumunu doğru ve detaylı bir şekilde ortaya koymaktır. Ailenin oluşumu, halkın özellikleri, toplumun uğraş alanları, mirastan mal paylaşımı, mehir durumu, boşanma ve nafaka, vasi tayini, vesayet, dini ve sosyal yaşama dair bulguları inceleyerek veriler sunmaktır. Tez, toplamda üç bölümden oluşmaktadır. İlk bölümde; neden Ankara şer'iyye sicilleri? Ankara neden önemli? vb. sorulara cevap niteliğinde Ankara ile ilgili çeşitli bilgiler verilmiştir. Ayrıca bu başlık içerisinde şer'iyye sicilleri ve kadılara dair bilinenler farklı örnekler ve açıklamalar ile verilerek, sonraki bölüm için bir temel oluşturulmuştur. İkinci ve çalışmanın ana bölümünde ise; 168 Numaralı Ankara Şer'iyye Sicilindeki tüm veriler değerlendirilerek çeşitli sınıflandırmalara tabi tutulmuş ve çoğunlukla tablolar halinde açıklayıcı bir şekilde ortaya konulmuştur. Bazı tablolardaki bilgiler sicilde kaydedildiği haliyle yazılarak, dönemin Ankara'sının sosyal ve kültürel yapısının daha iyi anlaşılabilmesi amaçlanmış olup, bu tabloların dipnotlarında tablodaki veriler hakkında açıklamalar yapılmıştır. Son bölümde ise sicilin transkripsiyon metini yer almakta olup, sicildeki hükümlerin geniş özetleri bulunmaktadır. Şer'iyye sicillerinin içerik bakımından sosyal, kültürel, iktisadi, idari, hukuki, demografik yapı gibi birçok önemli alana dair veriler içermesi, ait olduğu yerleşim birimiyle ilgili incelenen defter ve tarih aralığına bağlı olarak bütünsel çıkarımlar yapılması hususunda önemlidir. Çalışma, genel olarak Ankara'nın ve Osmanlı Devleti'nin durumu hakkında bilinmeyen veyahut az bilinen konularına ışık tutmaya çalışacak olup, özelde ise Ankara iline dair araştırmalara katkıda bulunabilecektir."
