abstract: "İmam Muhammed (v. 189/805) Hanefi mezhebinin tedvininde en önemli görevi üstlenmiştir. Mezhebin görüşlerini gelecek nesillere aktarmayı başarmıştır. Bu eserler Zâhirür'r-rivâye ve Nâdirü'r-rivaye olarak iki kısma ayrılmaktadır.Hâkim eş-Şehîd, (v. 334/945) İmam Muhammed'in Zâhirür'r-rivâye eserleri arasında en kapsamlı ve en önemli olan el-Asl kitabını el-Kâfî ismiyle ihtisar etmiştir. Bununla birlikte yer yer el-Asl dışındaki diğer Zâhirü'r-rivaye eserlerinden, nevâdirlerinden ve İmam Ebû Yusuf (v. 182/798) gibi diğer bazı Hanefi imamlarının eserlerinden nakillerde bulunarak istifade etmiştir. Hanefi mezhebinin en önde gelen âlimlerinden Serahsî'nin (v. 483/1090) el-Kâfî'ye şerh yazması ve birçok kaynak eserde kitaba atıf yapılması eserin önemini göstermektedir. Eserin müellif nüshası günümüze ulaşmamışsa da pek çok yazması kütüphanelerde mevcuttur. Çalışmamızda, müellifin hayatı, eserleri hakkında bilgiler verildikten sonra yazma nüshalara göre el-Kâfî eserinin Kitabü'n-nikâh kısmının tahkikini yapmak suretiyle aslına en yakın metni hazırlamayı amaçladık. Tahkikte tercih metodu kullanılmış olup nüshalarda bulunan farklılıklar dipnotlarda belirtilmiştir."
