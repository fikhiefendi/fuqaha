abstract: "TÜRKÇE ÖZET Çalışmamızın konusu“İslâm ve Osmanlı Hukukunda Kadın”dır. Yüzyıllardır topluma hakim olan değer yargılarıyla, kurallarla ve toplumsal sistemde kendine biçilen rollerle kuşatılan kadın, erkek öznenin belirlediği ve yön verdiği tek kutuplu bir dünyanın nesnesi olmuştur. Toplumsal sistemde siyasal, ekonomik ve yasal iktidar biçimlerinde beliren tüm iktidar şekillerinde üst ve baskın öğeyi temsil eden erkek, toplumsal dokunun ataerkil yapısının dinsel metinlere de yansıması ile iktidarını pekiştirmiştir. Kuran-ı Kerim'de“mümin insan”ve“hukukun öznesi”olarak varlıksal ve hukuksal açıdan kadının nasıl tanımlandığı ve Kuran-ı Kerim' i yorumlayan müçteh idlerin kadının hukuki statüsüne nasıl yön verdiği; Osmanlı Devleti'nîn serî hukuk-öıfî hukuk teori ve pratiğinde kadının statüsünün nasıl çizildiği bu çalışmada cevaplandırılmaya çalışılan ana sorulardır. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde, Orta Asya Türk Devletlerinde ve eski Anadolu uygarlıklarında kadının hukuki statüsü; ikinci bölümde İslâm hukukunda kadın konusu incelenmiştir. Bu bölümde, cahiliye döneminde kadının toplumsal ve hukuki statüsü, İslâm hukukuna giriş ve İslâm hukukunda kadın üç anabaşlık altında incelenerek Islâmiyetin kadının toplumsal ve hukuki statüsüne getirdiği yenilikler belirlenmiştir. Üçüncü bölümde, Tanzimat öncesi ve sonrası, I. ve II. Meşrutiyet dönemi Osmanlı hukuk kuramı ve pratiğinin İslam hukuk teorisinden farklı noktaları tespit edilerek, müçtehidler-egemen irade-kültür üçgeni içinde yaşayan Osmanlı kadının hukuki statüsünün belirlenmesi amaçlanmıştır. 120"
