abstract: "YAZAN: YAŞAR KOÇY Ğ TTEZ N ADI: SLAM HUKUNDA B R HÜKÜM VE KÜLL KA DEKAYNAĞI OLARAK ST SHABÖZETSözlükte“beraber olmak”,“beraberliğin devamını istemekanlamlarına gelen istishab kelimesi terim olarak ise ”önceden varolan bir durumun varlığının, yok olan bir durumun da yokluğununesas alınması“ anlamında kullanılmıştır.slam Hukukunda deliller hiyerarşisinde genelde son sıradaele alınmış olan istishab delili mahiyeti itibariyle bir taraftanmevcut hükümlerin (hukukun) korunmasında etkin olurken diğertaraftan ibahayi asliye yönüyle de slam hukukunun yeniliklereaçık olmasında dolayısıyla dinamizminde etkin bir unsur olmuştur.stishabın geçerliliği konusunda slam mezhepleri arasındayer yer tartışmalar yaşanmıştır. Ancak bu tartışmalar çoğunluklalafzi ihtilaflardır ve genelinde istishabın hem defi hem de isbattadelil olması konusunda yaşanmıştır. Bu da istishabla yeni birhükmün konulamıyacağı yaklaşımından kaynaklanmıştır.Bu tartışmaların da etkisiyledir ki bazı mezheplerhükümlerinde istishab metoduna çok yer verirken bazıları daha azyer vermişlerdir.Bu delilin anlaşılmasında ve etki alanınıngörülebilmesinde, sunduğu perspektifin gereği olarak, ya da onauyumlu ortaya çıkan ”şekk ile yakin zail olmaz\" gibi çok sayıdakikülli kaideler büyük önem taşır."
