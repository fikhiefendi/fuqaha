abstract: "Geleneksel bankacılık sistemiyle kıyaslandığında henüz çok yeni sayılan faizsiz bankacılık sistemi ciddi bir büyüme süreci içerisindedir. Yaşanan son mali krizle birlikte dikkatleri daha çok üzerine çeken faizsiz bankacılık, bugün dünyada 51 ülkede yaklaşık 300 milyar doları yönetmektedir. İslami prensipler çerçevesinde hareket eden faizsiz bankaların yükselen büyüme trendinin devamı için, dini yükümlüklerini yerine getirmenin yanında, ticari bir kurum olarak müşteri memnuniyetini artırmaya yönelik stratejiler de geliştirmelilerdir.Bankacılık sektörünün içerisinde bulunduğu yoğun rekabet şartları, bankaların başarısında yatan en önemli unsurlardan birisinin müşteri memnuniyeti olduğunu ortaya koymaktadır. Geleneksel bankalar gibi faizsiz bankaların da artan rekabet karşısında varlıklarını sürdürebilmek, pazar paylarını kaybetmemek ve karlılıklarını artırabilmek için, müşteri memnuniyeti konusuna öncelik vermeleri zorunlu hale gelmiştir. Müşterileri iyi tanıyan, onların beklenti ve ihtiyaçlarını karşılayarak kaliteli hizmet sunabilen bankalar rekabet üstünlüğü sağlayarak pazardaki paylarını artırabileceklerdir.Dünyada faizsiz bankacılık olarak isimlendirilen bankacılığın ülkemizdeki uygulayıcıları olan katılım bankalarının müşterilerinin banka tercihleri, faizsiz bankacılık ürün ve hizmetlerinden memnuniyetleri bu araştırmanın özünü oluşturmaktadır. Bu çalışmada, katılım bankalarının müşterilerine yönelik anket yöntemi uygulanmıştır. Müşterilerin demografik özellikleri, bu bankaları tercih nedenleri, finansal ürün ve hizmetlerden yararlanma düzeyine ilişkin elde edilen veriler istatistiksel olarak analiz edilmiştir. Buna ilaveten müşterilerin demografik özellikleri ile katılım bankalarının sunmuş oldukları finansal ürün ve hizmetlerden memnuniyetleri ki-kare testi uygulanarak ilişkilendirilmiştir."
