abstract: "İnsan, hayatının belli dönemlerinde, özellikle çocukluk döneminde ve kısıtlılık halinde, bazı yardımcılara ihtiyaç duymaktadır. Çocukluk ve kısıtlılık gibi durumlarda kişinin ihtiyaç duyduğu yardımlar, genellikle velileri tarafından sağlanırken, bunların yokluğu veya bazı ârızi durumlarda bunu vasî olarak isimlendirilen kişiler üstlenmektedir. Bu noktada birey ve toplum menfaati doğrultusunda düzenlenen vesâyet akdi, küçük ve kısıtlı kimselerin ihtiyaçlarına cevap vermeyi amaçlamıştır. İşlevselliğini her dönem koruyan vesâyet akdi günümüz hukukunda bir kamu görevi olarak görülmektedir. İslam hukukçuları, diğer konulara olduğu gibi vesâyet akdi konusundaki meselelere de çözümler üretmişlerdir. Tarihsel süreçte, sahip oldukları yöntem ve bulundukları zaman ve toplumun etkisi ile bu meselelerin önemli bir kısmında islam hukukçuların farklı görüşleri, alternatif çözümleri bulunmaktadır. Modern hukukta ise vesâyet akdi sürekli yenilenen bir yapıya sahiptir. Zira hayatın değişen şartları içerisinde toplumsal ihtiyaca cevap verme noktasında bu yenilikler zorunludur. Modern hukuktaki diğer bir nokta ise hakimlere tanınan yetki sınırıdır. Zira kanunda genel olarak belirlenen hükümlerin teferruatı hakkında hakimlere karar verme yetkisi tanınmıştır. Böylece karar verme sürecindeki olası aksaklık ve durağanlığın önüne geçilmiştir. Tezimizde vesâyet akdinin tanımı, şartları, vesâyeti gerektiren sebepler, vesâyetin sona ermesi gibi hususlarda islam hukukçularının görüşleri verilecek, bu noktada islam hukuku ile modern hukuk arasındaki benzerlik ve farklılıklar ortaya konularak mahiyetleri ortaya konulacak ve bazı değerlendirmeler yapılacaktır."
