abstract: "Osmanlı Devleti'nde XVI. asrın sonlarında, Haremeyn Evkaf Nezaretinin tesis edilmesiyle Haremeyn vakıfları başta olmak üzere hanedan ve devlet adamlarının kurduğu vakıfların idaresinde önemli bir düzenlemeye gidilmiştir. Zira bu dönemde, hanedan ve devlet adamları vakıfları ile reayanın kurmuş olduğu Haremeyn vakıflarının idaresi, başında Darüssaade Ağası, onun altında da çeşitli kalemlerin bulunduğu Haremeyn Evkaf Nezaretine verilmiştir. Nezaret kurulduktan hemen sonra bu vakıflar özelinde geniş çapta teftiş faaliyetleri başlamıştır. Bu süreçte vakıflarla ilgili çok sayıda emir ve fermanlar da çıkartılarak vakıfların idaresindeki aksaklıklar giderilmeye ve varsa suistimallerin önüne geçilmeye çalışılmıştır. Haremeyn Evkaf Nezareti bünyesinde tesis edilen kalemlerden birisi olan Haremeyn Müfettişliği ise Nezaretin idaresindeki vakıfların tüm şer'î işlemlerini takip etmek ve davalarını dinlemekle yükümlü tutulmuştur. Bunun yanında, surre defterleri, vakıfların gelir ve gider kayıtları ile mütevellilere ait muhasebelerin kontrolleri de yine müfettişler tarafından gerçekleştirilmiştir. Müfettişliğin, Haremeyn Evkaf Nezareti ile birlikte kurulduğuna yönelik genel bir kanı bulunsa da arşiv kayıtları irdelendiğinde Nezaretten sonra tesis edilmiş olduğu anlaşılmaktadır. Bu çalışmada da müfettişliğin kendi tuttuğu siciller ve arşiv kaynakları baz alınarak hem Haremeyn Müfettişliğinin kurumsal yapısı hem de kuruluşundan sonra görev yapmış olan ilk 4 müfettişin kimliği belirlenmiştir. Ayrıca Nezaret bünyesinde görev yapan Haremeyn mütevellilerinin çalışma usulleri ortaya konulmuştur. Yine vakıflarla ilgili davaların türleri ile vakıf meselelerinin çözümlerine dikkat çekilerek, akarların kiralamaları, tamir ve keşiflerinin detayları da ele alınmıştır. Çalışmada, Haremeyn Müfettişliği sicillerinin yanı sıra diğer arşiv belgeleri ile İslam hukuku eserlerinden de yararlanılmıştır"
