abstract: "Hidane, çocuk ve çocuk hükmünde olan kişilerin bakımını, himayesini, eğitimini içeren bir kavramdır. Hidane, İslam Hukukuna özgü bir teridir. Medeni Hukuktaki karşılığı, çocuk himayesi ve velayeti olarak tanımlanabilir. Evlilik devam ederken çocuğun bakımı ve himayesi aile ortamında yapılır. Ölüm, boşanma vb. ayrılıklarda çocuk bakımı ve himayesi bir problem olarak karşımıza çıkar. Bu durumda hidane, bu problemin çözümünü içerir. Hidane hakkı, çocukla yakın akrabalığı olan tüm kişilere ait bir haktır. Prensip olarak; çocuğun hidanesi anneye, çocuğun velayeti babaya aittir. Hidane hakkı, kanun koyucu tarafından verilmiş bir haktır. Çocuğun sahipsiz kalması durumunda; kimse bu hakkından vazgeçemez. Böyle bir durumda hidanenin görev boyutu karşımıza çıkar. Yargı, bu görevi yerine getirmesi için taraflara müeyyideler uygulayabilir. Hidane, çocuğun yemesini, içmesini, giyinmesini vb. ihtiyaçlarını kendisi karşılayabileceği yaşa gelinceye kadar devam eder. Bu sürenin bitiminden sonra çocuk velisine teslim edilir."
