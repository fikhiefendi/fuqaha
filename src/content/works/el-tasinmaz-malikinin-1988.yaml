abstract: "ÖZET Tezimizin konusunu oluşturan ve Medeni Kanunun 656. ncı maddesinde düzenlenen“Taşınmaz Malikinin Sorumluluğu”bahsini VII bölüm halinde incelemeye çalıştık. Birinci bölümde ; taşınmaz malikinin sorumluluğunun düzenleniş biçimini, niteliğini ve dayandığı esası inceledikten sonra, bu sorumluluğun 2872 sayılı Çevre Yasasında düzenlenen, çevrenin kirletilmesinden doğan sorumlulukla karşılaştırarak incelemeye çalıştık, ikinci bölümde; taşınmaz malikinin sorumluluğunun koşullarını iki başlık altında toplayarak, bu koşulların neler olabileceğini aydınlatmaya gayret gösterdik. Olumlu koşulların kapsamının ne olabileceğini belirlerken, M.K. m. 656 hükmünün, salt taşınmazlara uygulanabilir olup olmadığını, mülkiyet hakkının hangi hallerde aşılmış sayılıp sayılamıyacağını ve taşkınlığın belirlenmesinde rol oynayan M.K, 661. maddesinde öngörülen ölçütleri incelemeye çalıştık. Yine bu bölümde, sözleşmeden doğan sınırlamalara aykırılığın, doğal olaylar sonucu oluşan zararların, mülkiyet hakkının kötüye kullanılmasının ve hukuka uygun zarar verme olaylarının var olduğu durumlarda, M.K. m. 656 hükmü anlamında bir sorumluluğun doğup doğmadığını belirlemeye çalışarak, Hukuka uygun zarar verme durumlarında uygulama alanı bulan Fedakarlığın Denkleştirilmesi ilkesini inceledik. Yine, hukuka aykırılık sonucu oluşan zararın ya da zarar tehlikesinin, ne tarz bir nitelik taşıyabileceğini araştırmaya çalıştık.Sorumluluğun doğumu için uygun nedensellik bağının bir olumlu koşul olduğunu, ancak bu bağının varlığının mücbir sebep, zarar görenin kendi kusuru ve üçüncü kişinin kusurunun varlığı halinde, ortadan kalktığını, olumsuz koşulların içeriğinde gördük. Tezimin üçüncü bölümünde ise, M.K. m.656 hükmünde düzenlenen davaların taraflarını kimlerin oluşturabileceklerini incelerken, komşu kavramının kapsamını oluşturmaya çaba gösterdik. Birden fazla kişinin M.K. m.656,ya dayanabileceğini, somut olayda birden fazla sorumluluğun koşullarının ger çekleşebileceğini ve bu tür durumlarda, sorumlulukların yarışmasının sözkonusu olabileceğini gördük. Yine bu bölümde, kimlerin pasif dava ehliyetine sahip olabileceklerini, bu arada Devlet ve diğer kamu tüzel kişilerinin M.K, m.656 ya tabi olup olamayacaklarını saptamaya çalıştık. Dördüncü bölümde $ M.K. m. 656 ile düzenlenen davaları incelerken, zararın oluşması halinde, tazminat davasını ve diğer durumlarda ne tür davaların açılabileceğini ve bu davaların içeriğinin ve istemlerinin neler olabileceğini belirlemeye çalıştık. Beşinci bölümde; ispat yükünü, altıncı bölümde dava konusunu oluşturan istemlerin zamanaşımına tabi olup olamıyacağını, yedinci ve sön bölümde ise, M. E, m. 656 uyarınca açılacak davalarda görevli ve yetkili mahkemeleri tespite çalış tık. Tezin bölümlerinde, diğer kusursuz sorumluluk düzenlemelerini yer yer karşılaştırarak, bazen de sorunların çözümüne ulaşmak amacıyla yer vermeye çalıştık."
