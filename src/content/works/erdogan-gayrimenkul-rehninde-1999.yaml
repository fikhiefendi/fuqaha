abstract: "En yalın haliyle; rehin alacaklının sahip olduğu bir ayni teminat olup, borçlunun ödeme yapmaması, kısmi ödeme yapması veya kötü ödeme yapması hallerinde alacaklının zararlarını ve alacağını karşılayabilmesi için kendisine verilmiş bir haktır. Bu hakkın, teminat ve gayrimenkulun ekonomik değerinin tedavülü şeklinde iki önemli işlevi vardır. Rehin hakkı; menkul mallar (taşınır bir mal, bir hak, alacak veya canlı hayvanlar) veya gayrimenkul mallar üzerine kurulur. Bu hak tescilli ve tescilsiz olmak üzere iki şekilde doğabilir. Bilindiği gibi gayrimenkul rehni MK. 765-887 maddelerinde düzenlenmiştir. Hak sahibine alacağını gayrimenkulun değerinden elde etme yetkisi veren, borcun ifa edilmemesi halinde alacaklıya gayrimenkulun icra vasıtasıyla sattırıp satış değeri üzerinden alacağını öncelikle tahsil etme hakkı veren bir ayni haktır. Mutlak bir ayni hakka sahip olan alacaklı, bu hakkını tüm üçüncü kişilere ve gayrimenkul malikinin diğer alacaklılarına karşı ileri sürebilir. MK. m. 765“Gayrimenkul rehni ipotek, ipotekli borç senedi ve irat senedi şeklinde tesis olunabilir. Bundan başka herhangi bir biçimde gayrimenkul rehni yasaktır.”Madde metninden de anlaşılacağı üzere Türk Hukuk sisteminde gayrimenkul rehni çeşidi sınırlı sayıdadır, yasanın saymış bulunduğu ipotek, ipotekli borç senedi ve irat senedi dışında herhangi bir gayrimenkul rehni çeşidi kurulamaz. Bu durum, Medeni Kanunun sınırlı ayni haklar için getirmiş olduğu Numerus Clausus (Adette Belirlilik) ilkesinin rehin hukukundaki özel bir uygulamasını teşkil eder. Gayrimenkul rehnedilirken, MK. m. 766 uyarınca belirli bir alacak miktarı için rehnedilebilir bu alacakta belirlilik ilkesinin bir sonucu olup, emredici bir kuraldır. Ayrıca, üzerine rehin kurulacak taşınmazın belli olması ve tapu kütüğüne de kayıtlı olması gerekir. Bu da, taşınmazda belirlilik ilkesinin bir sonucudur. Gayrimenkul rehni tapu kütüğüne yapılacak tescille kurulur. (MK.m.771) Bu işlem, hakkın doğmasınısağladığı gibi, hakkı alenileştirirde. Buna da, kamuya açıklık yani aleniyet ilkesi denir. Gayrimenkul rehni, taraflar arası sözleşmeyle, ölüme bağlı tasarruf ile, tek taraflı bir hukuki işlemle, Mahkeme Kararıyla veyahut kanundan doğan bir hakla kurulabilir. Rehin hakkı kural olarak tescille doğmaktadır. Ancak, doğrudan doğruya kanundan doğan tescilsiz rehin haklarıda bulunmaktadır. (MK. m.780-781 ve 791) Gayrimenkul rehni, terkin, taşınmazın yok olması ve taşınmazın kamulaştırılmasıyla son bulur. Gayrimenkul rehnin derecesi ve sırası konuları doktrinde görüş birliği içinde açıklanmış değildir. Derece ve sıranın eş anlamlı olduğu, rehnin derecesinin aynı zamanda sırasını da gösterdiği ileri sürülmektedir. Derece; maddi anlamda taşınmazın herhangi bir rehin hakkına tahsis edilmiş değer payını, şekli anlamda tapu sicili tekniğine göre ayrılarak sınırlandırılmış ve tescil edilmiş, değer payını ifade etmektedir. Sıra; maddi anlamda bir rehin hakkının taşınmazı yükleyen diğer rehin hakları irtifaklar ve taşınmaz mükellefiyetleri karşısındaki öncelik durumunu, şekli anlamda ise rehin hakkının tapu kütüğünde işgal ettiği derecenin taşıdığı sıra numarasını gösterir. Doktrindeki bir takım yazarların,“sıralı derecede”rehin hakkı deyiminin bizce de daha doğru olacağı kanaatindeyiz. Sınırlı ayni hakların önceliği sorunu sıra kavramının önemini artırmaktadır. Bu nedenle de, gayrimenkul üzerinde sınırlı ayni haklar arasındaki öncelik ilişkisi sırasına göre belirlenir. Kural olarak sınırlı ayni haklar kuruluş tarihlerine göre öncelik kazanırlar (MK. 930). Ancak, bütün ilgililerin muvafakati ile aksine yapılacak bir sözleşmeyle bu kural bertaraf edilebilir. 11MK.; aynı gayrimenkul üzerinde kurulmuş birden fazla rehin hakkı arasındaki sıra konusunda; zamanca önce olan, sırada önce olur. (Prior Tempore Potior Jure) ilkesinden ayrılarak derece sistemini kurmuş ve gayrimenkul rehnedilirken hangi ipotek derecesine kayıt edilirse o derecenin ifade ettiği kuvvetle teminat teşkil eder hükmünü getirmiştir. (MK. m. 785) Rehin derecesi, rehin alacaklısının alacağının gayrimenkulun bir kısmı ile sınırlandırılması olayıdır. Rehin taşınmazın değerinin farazi bölümlerini gösteren ve kendi aralarında belirli bir sıra düzenine bağlanmış bulunan bağımsız derecelerden biri üzerine kurulur ve bu derecenin miktarı ile sınırlı bir güvenceye sahip olur. Gayrimenkul maliki taşınmazının herhangi bir derecesinde alt rehinler kurabilir. Kurulan bu alt rehinlere alt derece denilmektedir. Aynı rehin derecesi içinde o derecenin farazi değerini aşmayacak şekilde kurulacak birden fazla rehinle tesis olunabilir. Görüldüğü gibi gayrimenkul rehninde sıra ve derece kavramları farklı içerikte olmakla beraber, birbirleri ile sıkı ilişki içindedirler. Taşınmaz üzerinde tek bir rehin kurulduğunda çok önem arz etmeyen derece ve sıra kavramları, birden fazla rehin kurulduğunda önem kazanmaktadırlar. Rehin dereceleriyle ilgili olarak, ülkelerin uygulamış oldukları farklı sistemler bulunmaktadır. Bunlar, ilerleme sistemi, malik rehni sistemi ve ülkemizde uygulanmakta olan taşınmazın eşit veya farklı ekonomik değerlere farazi olarak bölünmesi, bölünen her parçanın belirli bir alacağı güvence altına alabilecek şekilde rehin hakkının kurulabilmesi imkanını sağlayan sabit dereceler sistemidir (MK. m. 785). Özet olarak çalışmamızda, rehin kavramını, türleri olan menkul ve gayrimenkul rehnini, gayrimenkul rehni çeşitleri olan ipotek, ipotekli borç senedi ve irat senedini, gayrimenkul rehninde dereceler, alt dereceler ve sıra kavramlarını, birbirleri ile olan ilişkilerini, derecelere ilişkin sistemleri ve istisnalarını incelemiş olduk. üi"
