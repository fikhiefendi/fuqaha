abstract: "“Türk Ceza Hukukunda Feminist Avukatlık”başlıklı bu tez, iki bölümden oluşmaktadır. Tezin birinci bölümünde feminizm, feminist hukuk teorisi ve feminist hukuk metodolojisi ele alınmıştır. Bu bağlamda, öncelikle ataerkillik, toplumsal cinsiyet ve kamusal-özel alan ayrımı gibi temel kavramlar tartışılmış; ardından liberal, kültürel, radikal, postmodern ve İslami feminizm gibi farklı feminist akımlar detaylı bir şekilde incelenmiştir. Ayrıca, feminist hukuk teorisinin temel ilkeleri ve metodolojik yaklaşımları ele alınarak, feminist hukukçular tarafından uygulanan pratik akıl yürütme, kadın sorusu sorma ve bilinç yükseltme gibi yöntemler analiz edilmiştir. Tezin ikinci bölümdeyse, Türk Ceza Hukuku çerçevesinde feminist avukatlık konusu irdelenmiştir. Türk Ceza Hukuku'nun kadına yönelik bakış açısı, yasa koyucu düzenlemeleri ve yargı kararları üzerinden analiz edilmiştir. Yapılan bu analiz doğrultusunda, feminist avukatın savunma sürecinde karşılaşabileceği zorluklara dikkat çekilmiştir. Bu çalışmada, Türk Ceza Hukuku feminist bir perspektifle ele alınmış ve özellikle erkek şiddeti, cinsel şiddet, ekonomik ve psikolojik şiddet gibi toplumsal sorunlar üzerinden eleştirel bir değerlendirme yapılarak çözüm önerileri sunulmuştur. Bunun yanı sıra, haksız tahrik ve örselenmiş kadın sendromu gibi kavramların hukuki boyutları incelenmiş ve feminist avukatların savunma stratejileri analiz edilmiştir. Ayrıca, bu bölümde avukatların savunma sürecinde etik sorumluluğa sahip olup olmadığı tartışılmış ve savunma etiğinin nasıl uygulanabileceğine dair öneriler geliştirilmiştir. Sonuç bölümünde, feminist hukuk düşüncesinin Türk Ceza Hukuku'na entegrasyonu ve kadınların maruz kaldığı farklı şiddet türlerine karşı daha etkin bir hukuki koruma sağlanmasına yönelik öneriler sunulmuştur. Bu çerçevede, feminist avukatlık yalnızca bir savunma pratiği olarak değil, aynı zamanda toplumsal cinsiyet eşitliği mücadelesinin ayrılmaz bir parçası olarak ele alınmıştır."
