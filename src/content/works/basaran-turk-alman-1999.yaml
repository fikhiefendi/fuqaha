abstract: "188 ÖZET VE SONUÇ: 1. Gerek alman vergi kanunlarında gerekse türk vergi kanunlarında, bilançolama ve buna bağlı olarak gayrî maddi iktisadi kıymetlerin aktifleştirilmesi konusunda yeterli düzenleme bulunmamaktadır. Ancak bu sorun, vergi bilançosu düzenlenirken ticaret hukukunun düzene uygun muhasebe ilkelerinin ölçek alınmasını emreden ölçek olma ilkesiyle (§ 5 II EStG) Alman Vergi Bilançosu Hukuku'nda büyük ölçüde aşılmıştır; özellikle HGETdeki bilançolamaya ilişkin ayrıntılı hükümler vasıtasıyla gayri maddi iktisadi kıymetlerin aktifleştirilme şartları kolaylıkla tespit edilebilmektedir. Buna karşılık, Türk Vergi Bilançosu Hukuku'nda konu önceleri VUK'daki defter tutma ve değerlemeye ilişkin hükümler çerçevesinde bir çözüme kavuşturulmaya çalışılmış, ancak 1 994 yılında yürürlüğe giren ve ticari bilanço düzenlenirken de takip edilecek olan 1 Sıra No'lu MSUGT ile yazılı bilanço kavram ve ilkelerine ulaşılmıştır. Alman Bilanço Hukuku'nda ölçek olma ilkesi şiddetli eleştirilere maruz kalırken, sistemimizde hem vergi bilançosu hem de ticari bilanço bakımından geçerli olacak ortak muhasebe ve bilanço ilkelerinin üstelik bir Tebliğ ile getirilmesinin isabetliliği -özellikle iki bilanço arasındaki amaç farklılığı karşısında- tartışmaya açıktır. Fakat, mevcut hukuki durum gereğince, vergi kanunlarına uygun olduğu sürece MSUGTdaki düzenlemelerin gayri maddi iktisadi kıymetlerin aktifleştirme şartlarının tespitinde dikkate alınmaları gerekmektedir. 2. Her ne kadar 1 Sıra No'lu MSUGTda -uluslararası gelişmeler ışığında- anglo-amerikan sisteminin bazı ilke ve kurallarına yer verilmişse de, gerek VUK, GVK ve KVK'nın gerekse TTICnın Kıta Avrupası sistemine dahil kanunlar olmaları nedeniyle buradaki düzenlemelerin esas itibariyle bu sisteme uygun şekilde yorumlanması gereklidir. Bu bağlamda, VUK ve MSUGT çerçevesinde saptanan gayri maddi iktisadi kıymet kavramı ile -yine Kıta Avrupası sistemine dahil- Alman Vergi Bilançosu Hukuku'nda ortaya konulan gayri maddi iktisadi kıymet kavramının temelde aynı kavramlar olduğunu söylemek mümkündür; gayri maddi iktisadi kıymet, bağımsız şekilde değerlendirilebilen ve -hukukumuz bakımından- sözleşme veya yararlandıncı bir idari işleme konu olabilen kavranabilir gayrî maddi iktisadi değerdir. Anglo-amerikan sisteminin aksine, aktifleştirilebilir giderlerin gayri maddi iktisadi kıymet olarak kabulü mümkün değildir. 3. Gayri maddi ikitsadi kıymetler sadece duran varlığa değil, döner varlığa da ait olabilirler. Döner varlığa ya da duran varlığa ait olup olmama, iktisadi kıymetin kullanım amacıyla bağlantılıdır, yoksa onun niteliğine bağlı değildir. Bu nedenle, -türk- doktrin(in)de kullanılan ve gayri maddi iktisadi kıymetlerin yalnızca duran varlık içinde bulunabilecekleri intibaını yaratan“gayri maddi sabit varlık/maddi olmayan duran varlık”terimi hatalıdır. Bu bağlamda, 1 Sıra No'lu MSUGTda da gerekli değişikliğin yapılması ve gayri maddi varlıklara döner varlık içinde de yer verilmesi şarttır. 4. Gayri maddi iktisadi kıymetin aktifleştirilebilmesi için, verginin mali güçle orantılı olması ilkesi gereğince onun hem bilançolamayı yapan tacire hem de onun işletmesine ait olması gereklidir (sübjektif-objektif aidiyet). Gayri maddi iktisadi kıymetin tacire ait olup olmadığına karar verilirken, iktisadi yaklaşım ilkesi gereğince iktisadi mülkiyet esas alınacaktır. Alman Vergi Bilançosu Hukuku'nda,189 mükellefin, olağan kullanım süresince gayri maddi iktisadi kıymet üzerinde hukuki malikin etki göstermesini imkansızlaştıracak derecede gerçek bir hakimiyete sahip olması halinde onun iktisadi malik olduğu kabul edilmektedir. Bu tanım hukukumuz bakımından da kabul edilebilir. İsletmeye aidiyet bakımından ise alman ve türk sistemlerinde farklı kriterler ileri sürülmektedir. Ancak, nihayetinde, gayri maddi iktisadi kıymetin işletmenin kazanç sağlama amacını gerçekleştirmesinde etkili olduğunun objektif olarak onanabildiği durumlarda, iktisadi kıymetin işletmeye ait olduğunu kabul edebilmek mümkündür. 5. Gayri maddi iktisadi kıymetlerin aktifleştirilmesi konusunda Türk Vergi Bilançosu Hukuku'nun Alman Vergi Bilançosu Hukuku'ndan ayrıldığı en önemli nokta, Almanya'da ivazlı iktisap edilmemiş duran varlığa ait gayri maddi iktisadi kıymetlerin aktifleştirilmesinin yasaklanmış olmasına karşılık ülkemizde böyle bir aktifleştirme yasağının -işletme değeri hariç- bulunmamasıdır. Kanaatimizce, sistemimizde gayri maddi iktisadi kıymetlerin aktifleştirilmelerinin ivazlı iktisap şartına bağlanmamış olması, uluslarası gelişmeler de dikkate alındığında gayet olumlu bir durumdur ve üst vergileme ve bilanço ilkelerine uygundur. 6. Son olarak burada, sistemimizdeki özellikle bilanço ilke ve kavramlarına ilişkin eksikliklerin en kısa süre içinde tamamlanarak Türk Vergi Bilançosu Hukuku'nun kanuni temellerinin güçlendirilmesi temennimizi dile getirmek istiyoruz. Böylece, dinamik bir alan içinde bulunan gayri maddi iktisadi kıymetlerin aktifleştirilmesi konusundaki belirsizlik ve sıkıntılar da büyük ölçüde ortadan kaldırılabilecektir."
