abstract: "Finans, ekonomik hayatın en önemli unsurlarından biridir. Finans, mal ve hizmet üretimi, tüketimi, dağıtımı, tasarrufu, yatırımı, borçlanmayı, ödemeyi, sigortayı, yardımlaşmayı, kalkınmayı, refahı ve daha pek çok faaliyeti etkileyen bir araçtır. Finans, aynı zamanda, insanların hayat tarzlarını, değer yargılarını, ahlaki tutumlarını, sosyal ilişkilerini, kültürel özelliklerini, siyasi tercihlerini, dini inançlarını ve daha pek çok yönünü de belirleyen bir etkendir. Finans, bu kadar önemli ve etkili bir alan olması sebebiyle, her zaman ilgi odağı olmuş, farklı sistemler, kurumlar, ürünler, hizmetler, modeller, teoriler, yaklaşımlar, üretmiştir. İslami Finans ise, İslam hukukunun temel ilkelerine dayanan, faizsiz, adil ve paylaşımcı bir finansal sistemdir. İslami Finans, İslam'ın ekonomik hayata getirdiği kurallar, değerler, amaçlar, hedefler, yöntemler, kurumlar, ürünler, hizmetler, modeller, teoriler ve yaklaşımlar bütünüdür. İslami Finans, ekonomik hayatı, insanın yaratılış gayesi, dünya ve ahiret dengesi, Allah'ın rızası, toplumun refahı, adaletin tesisi, paylaşımın artırılması, emanetin korunması, helalin tercih edilmesi, haramdan kaçınılması, zararın önlenmesi, faydanın sağlanması, maslahatın gözetilmesi, zaruretin dikkate alınması, kolaylığın sağlanması, zorluğun giderilmesi, gibi temel ilkeler doğrultusunda düzenlemeyi amaçlayan bir sistemdir. Faiz esasına bağlı ekonomik sistemler, İslami finans açısından birçok insani ve finansal sorunlara sebep olmaktadır. Bu sorunlar arasında, servetin adaletsiz dağılımı, gelir eşitsizliği, yoksulluk, borçluluk, enflasyon, spekülasyon, belirsizlik, etik olmayan yatırımlar, sosyal adaletsizlik, savaşlar, ahlaki çöküntü, insan haklarının ihlali, gibi bir çok sorun bulunmaktadır. İslami Finans, günümüz dünyasında hakim olan faiz esasına bağlı kapitalist ekonomik sistemlere alternatif bir sistem sunmaktadır. İslami Finans, sınırsız ihtiyaç ve kıt kaynak tanımını reddederek, sorunun kaynak kıtlığı değil, paylaşım olduğunu savunmaktadır. İslami Finans, son yıllarda küresel ölçekte büyük bir gelişme göstermiş ve hem Müslüman hem de gayrimüslim ülkelerde büyük bir ilgi görmeye başlamıştır. Ancak İslami Finansın yaygınlaşması ve rekabet edebilmesi için bazı uluslararası engelleri aşması gerekmektedir. Küresel ekonomik alanda, merkez bankaları, uluslararası finansal kuruluşlar, bankacılık düzenleme kurumları ile faize dayalı bankacılık üzerinden dayatılan haksız standartlar ve kısıtlamalar, İslam ülkelerini ve İslami finansı dar bir alan da hareket etmeye zorlamaktadır. Blokchain teknolojisi ve kullanım alanları ise bu anlamda bu dar çerçeveyi aşmak için yapısı itibariyle çok önemli fırsatlar sunmaktadır. Blokchain teknolojisi, İslami finans sektöründe farklı uygulama alanlarına sahip olabilir. Finans sektöründe ödemelerin hızlı ve güvenli bir şekilde yapılması, ticari finansman, dijital kimlik, sukuk, zekât, takâful gibi birçok finansal ürün ve hizmetlerin sunumunu ve yönetimini iyileştirebilir. Ve kredi raporlama gibi işlemlerin verimliliğini ve şeffaflığını artırmayı sağlayabilir. İslami finans sektörünün faiz, kumar, spekülasyon, belirsizlik ve etik olmayan yatırımlar gibi İslam'ın yasakladığı unsurlardan uzak durmasını kolaylaştırabilir. İslami finans sektörünün küresel rekabet gücünü artırabilir, müşteri memnuniyetini yükseltebilir ve İslami finans ilkelerine uygunluğu sağlayabilir. Blokchain Bitcoin ile beraber sadece kripto paralar özelinde finansal piyasalarda yeni bir çığır açmıştır. Kripto paralar, transfer uygulamaları, ticari mutabakatlar, veri kayıt, tedarik zinciri, internet bankacılığı, gibi birçok alanda kullanılabilen blokchain, İslami finans ve katılım bankacılığının bu sürece dâhil olmasını bir zaruret haline getirmektedir. Kripto para birimleri, dijital ortamda kullanılan, merkezi bir otoriteye bağlı olmayan, kriptografik yöntemlerle güvenliği sağlanan, paraya alternatif bir değişim aracı olarak tanımlanabilir. Kripto para birimlerinin ilki ve en popüleri olan Bitcoin, 2008 yılında Satoshi Nakamoto takma adlı bir kişi ya da grup tarafından yayınlanan bir makale ile ortaya çıkmış ve kısa sürede küresel bir fenomen haline gelmiştir. Bugün ise, Bitcoin'in yanı sıra, Ethereum, Ripple, Litecoin, Tether gibi pek çok sanal para birimi piyasada yer almaktadır."
