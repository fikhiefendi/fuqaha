abstract: "Bu çalışma, Türkiye bankacılık mevzuatında yer alan uyum fonksiyonunun yapısını ve işleyişini, özellikle katılım bankacılığı bağlamında, uluslararası standart belirleyici kurumlar (BCBS, ESMA, AAOIFI, IFSB) tarafından geliştirilen yaklaşımlarla karşılaştırmalı olarak değerlendirmeyi amaçlamaktadır. Dokuz tematik alana dayalı karşılaştırmalı analiz yöntemiyle, hem konvansiyonel hem de faizsiz bankacılık sistemine ilişkin düzenlemelerin güçlü yönleri ve gelişime açık alanları ortaya konmuştur. Elde edilen bulgular, Türkiye'deki uyum fonksiyonunun iç sistemler, insan kaynağı ve yönetişim yapısı açısından olgun bir kurumsal çerçeve sunduğunu; ancak şer'î uyum, risk yönetimi entegrasyonu, etik ilkeler ve teknoloji kullanımı gibi bazı alanlarda daha bütüncül ve sistematik düzenlemelere ihtiyaç duyulduğunu işaret etmektedir. Özellikle şer'î uyumsuzluk riskinin kavramsal olarak tanımlanması, kurumsal risk sistemlerine entegre edilmesi ve katılım bankacılığına özgü etik ilke setinin oluşturulması önerilmektedir. Sonuç olarak, Türkiye bankacılık sisteminin kurumsal altyapısı, uluslararası uyum standartlarıyla büyük ölçüde örtüşmektedir. Bununla birlikte, katılım finans ekosisteminin özgün ihtiyaçları dikkate alınarak, daha yönlendirici, esnek ve uygulamaya dönük düzenlemeler geliştirilmesi, sektörün kurumsal uyum kapasitesini güçlendirecektir."
