abstract: "Bu çalışmada Bahailikle ilgili sadece kendi yayınları üzerinden bir araştırma yapılmıştır. Bahailiğin genel tanımı onların kendi ifadeleri üzerinden yapılmış ve Bahailiğin ortaya çıkışı ve gelişimi sürecinde yer alan önemli kişilerin hayatlarına yer verilmiştir.Tarihi süreç anlatılırken, kendi kaynaklarında geçenve dikkat çekebilecek bazı olay ve durumlara ve onlara ait argümanlaraözellikle yer verilmeye çalışılmıştır. Bahailiğin, Tanrı, peygamber, melek, kutsal kitap, ahiret, kaza ve kader inancıüzerine söyledikleri, öncelikli olarak Bahaullah, Abdülbaha ve Şevki Efendi'nin kendilerinin yazdıkları üzerinden ele alınmaya çalışılmıştır. Çalışmanın devamında Bahailikte ibadet konusu ve bazı fıkhı yaklaşımlar yer alır. Bahai kaynaklarında fıkhi uygulamalara dair metodolojik bir yöntem takip edil-mediği için sadece, kaynaklarda ulaşılabilen başlıklara yer verilmiştir. Çalışmanın son bölümünde Bahailiğin dünya görüşüne ait bazı başlıklar ve toplumsal hayatın dayanaklarına dair Bahaihareketine ait açıklamalar yer almaktadır."
