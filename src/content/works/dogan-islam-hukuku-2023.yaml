abstract: "İslam hukuku açısından fikrî mülkiyet haklarının ele alındığı bu çalışmada, İslam hukukunun, fikrî mülkiyet haklarını oluşturan telif hakkı ve sınaî mülkiyet haklarına yaklaşımı incelenmiştir. Fikrî mülkiyet hakları, teknik, ekonomik ve sosyal şartların gelişmesiyle birlikte özellikle 19. yüzyıldan sonra önem kazanan bir konu haline gelmiştir. Çalışma, bir giriş, iki bölüm ve bir sonuçtan oluşmakta olup giriş bölümünde çalışmanın konusu, amacı ve yararlanılan kaynaklara değinilmiştir. Birinci bölümde fikrî hak kavramı ve telif hakkıyla alakalı teorilerin sıralanmasından sonra telif hakları hakkında genel bilgiler zikredilmiştir. Sınaî mülkiyet hakkı ile ilgili de bilgiler verildikten sonra ikinci bölüme geçilmiş; burada fikrî mülkiyet hakları, şer'î ve malî açıdan incelenmiştir. Hak, mal ve mülkiyet kavramlarının modern hukuk ve İslam hukukundaki mahiyetiyle alakalı karşılaştırmalı bilgiler verilerek, çalışmanın malî yönü ortaya koyulmaya çalışılmıştır. Fikrî mülkiyet haklarının fıkhî değerlendirmesi de yapılmış; bu bağlamda mezheplerin görüşlerine, kurum fetvalarına ve çağdaş İslam hukuku araştırmacılarının görüşlerine yer verilmiştir. Bu çalışmanın neticesinde, fikrî mülkiyet haklarının İslam hukukunda hak ve mülkiyet müesseseleri içerisinde yer aldığı, günümüzde malî bir değere sahip olduğu ve hukukî işlemlere konu olabileceği sonucuna ulaşılmıştır."
