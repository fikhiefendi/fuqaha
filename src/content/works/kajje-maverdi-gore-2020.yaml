abstract: "Nâsih ve Mensûh İlmi en önemli Kur'an ilimlerindendir. Âlimler bu konunun Kur'an'da varlığı konusunda ihtilafa düşmüşlerdir. Kimileri nâsih ve mensûh konusunun Kur'an'da oldukça fazla yer aldığını iddia ederken kimileri de bunun sadece birkaç örneğinin olduğunu savunmuşlardır. İmam Mâverdî fıkıh, usul-i fıkıh ve tefsir imamlarının büyüklerinden olup“en-Nüketü ve'l-Uyûn”isimli bir tefsir ve“el-Hâvi'l-Kebîr”isimli Şâfiî Mezhebine göre yazdığı geniş bir fıkıh kitabı telif etmiştir. Bunun dışında muhtelif ilimlerle ilgili birçok kitap daha te'lif etmiştir. Bu çalışmanın amacı Mâverdî'nin yazdığı el-Hâvi'l-Kebîr'i üzerinden ve en-Nüketü ve'l-Uyûn eserinden örnekler getirerek nesih anlayışına ışık tutmaktır. Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde ilmî ve siyasi açıdan Mâverdî'nin hayatından, ilmi şahsiyeti ve yerinden kısaca bahsedilmiş olup en-Nüketü ve'l-Uyûn tefsirinde neshin olduğu yerlerdeki açıklama metodu vurgulanmıştır. İkinci kısımda neshin mahiyeti ele alınmış olup Mâverdî'nin bu konudaki görüşleri açıklanmıştır. Üçüncü kısımda ise neshin çeşitleri ve Mâverdî'nin bu konudaki görüşleri ele alınmıştır."
