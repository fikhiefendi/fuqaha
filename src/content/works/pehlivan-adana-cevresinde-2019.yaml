abstract: "Bu çalışmada, Adana ili ve çevresinde Orius ve thrips türleri ile mevsimsel yaygınlıkları, yoğunlukları ve ayrıca açık alanda bazı yazlık sebze türlerinde popülasyon değişimleri incelenmiştir. Bunun yanında laboratuvar çalışmalarıyla da Orius vicinus (Ribaut)'un bazı biyolojik özellikleri araştırılmıştır. Yapılan sörvey çalışmaları sonucunda Orius niger Wolff'in en yaygın avcı türü olduğu bulunmuştur. Bu çalışma kapsamında 27 adet thrips türü belirlenirken, en fazla tespit edilen tür Frankliniella occidentalis (Pergande) olmuş ve onu Thrips hawaiiensis (Morgan, 1913) izlemiştir. Popülasyon takibi çalışmalarında ergin thripsler en fazla patlıcandan, sonrasında ise biber ve domatesten örneklenmiştir. Ergin thrips ve larvalarının genelde popülasyon seviyeleri düşük olup, ekonomik zarar eşiğine ulaşmadıkları saptanmıştır. Av: avcı oranları dikkate alındığında Orius türlerinin thrips türlerini baskılamada önemli bir faktör olabileceği kanaatine varılmıştır. Orius vicinus'un yumurta verimi açısından en etkin olduğu sıcaklığın 25°C ve gün uzunluğunun ise 14 s olduğu belirlenmiştir. Bu türün kısa gün koşullarında üreme diyapozuna girmediği, özellikle sıcaklığın yumurta bırakmasını etkilediği ve 15°C'nin üzerindeki sıcaklıklarda böceğin yumurta bırakabileceği düşünülmektedir."
