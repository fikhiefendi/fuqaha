title: "Adana İli ve Çevresinde Avcı Orius (Hemiptera: Anthocoridae) Türleri, Bazı Yazlık Sebzelerde Thripslerle (Thysanoptera) Birlikte Popülasyon Değişimleri ve Orius Vicinus (Ribaut)'un Bazı Biyolojik Özellikleri"
titleTranslation: {"en": "Predatory orius (Hemiptera: Anthocoridae) species in Adana province, their population fluctations with Thrips (Thysanoptera) species on summer vegetables, and some biological characteristics of Orius vicinus (Ribaut) at laboratory conditions"}
