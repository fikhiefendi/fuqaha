abstract: "Afganistan'da hâkim olan gelenek-görenek ve bazı uygulamalardan dolayı birçok kadın çeşitli zorlamaya maruz kalmakta veya temel haklarından mahrum bırakılmaktadır. Bu uygulamaların da çoğu ya İslam dinine mal edilmekte veya en azından din adamları tarafından İslam Hukukuna ters olduğu insanlara bildirilmemektedir. Din adamları bu haksızlığa karşı çıkmaları gerekirken ne yazık ki çoğu zaman bu uygulamaları fiilleri ile onaylamaktadırlar.Tezimizin amacı, günümüz Afganistanı'nda kadınların haksızlığa maruz kaldıkları söz konusu uygulamaları ele alarak İslam Hukuku açısından değerlendirmektir.Tezimiz iki bölümden oluşmaktadır: Birinci bölümde kadınların özel hukuk alanında maruz kaldığı bazı uygulamaları, ikinci bölümde ise kamu hukuku alanında maruz kaldıkları bazı uygulamaları ele aldık. Her konuyu ele alırken de ilk önce Afganistan'daki uygulamaları tespit ettik, ardından da söz konusu uygulamanın Afgan Kanunlarındaki yerini ve İslam hukuku açısından meşruiyetini değerlendirdik.Sonuç olarak, detaylı bir şekilde ele alıp İslam Hukuku ile mukayese ettiğimiz uygulamaların bazılarının tamamen cahiliye döneminden kalmış İslam'ın yasakladığı uygumlalar olduğu ve bazılarının da asıl itibarı ile İslam hukukunda bulunup fakat kötüye kullanıldığı kanaatine vardık."
