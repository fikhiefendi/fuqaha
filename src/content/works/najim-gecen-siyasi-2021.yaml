abstract: "Sosyal bir varlık olan insanın yaşam biçiminin düzenlenmesi ve sosyal hayatın sorunsuz şekilde sürdürülebilmesi için gerekli yasaların yapılması sanatı olarak özetlenebilecek siyaset kavramı, İslam'ın üzerinde önemle durduğu kavramlardan biridir. Özellikle yeni bir toplum inşa etme iddiasıyla ortaya çıkan İslam dini, müslümanların gerek kendi aralarında gerekse de diğer din müntesipleriyle ilgili olarak yaşam biçimini düzenlemeye yönelik evrensel ilkeler ortaya koymuştur. Bu çalışmada İslam toplumunun temel kaynağı olan Kur'ân'da geçen siyasî kavramlar İslam fıkhı ışığında tahlil edilmiştir. Bu bağlamda Kur'ân'da geçen siyasî kavramlar öncelikle iç ve dış siyasetle ilgili kavramlar olmak üzere iki ana bölümde incelenmiş ardından da ulu'l-emr, halîfe, bey'at, şûra ve emri bi'l-marûf, barış, emân, cizye, esîr, ganimet gibi tali başlıklar altında her birisi ele alınmıştır. Üçüncü bölümde ise adalet ilkesi ile cihât kavramları detaylıca incelenmiş, adaletin esasları, toplumsal ve bireysel adalet, cihadın amacı, hükmü, cihad ile harb ve terörizm arasındaki farklar, gibi konular fıkhî açıdan irdelenmiştir."
