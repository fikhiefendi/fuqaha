abstract: "“İmam Malik Sonrası Muvatta Nüshaları ve Nüsha İsnatları”adlı çalışmada Mâlikî mezhebinin imamı, büyük müctehid ve muhaddis olan Mâlik b. Enes'in (v. 179/795) sahih rivayetleri derlediği ilk hadis kaynaklarından olan Muvatta kitabının nüshaları ele alınmıştır. Muvatta kitabı geçmişten günümüze kadar türlü çalışmalara konu olmuştur. Ne var ki kitabın nüshalarında bulunan ihtilaflara ve bu ihtilafların sebeplerine yönelik geçmişten günümüze müstakil ve kapsamlı bir çalışma kaleme alınmamıştır. Bu çalışmada ise temel hatlarıyla bu konu ele alınacaktır. Çalışmanın birinci bölümünde Muvatta rivayetlerinin nüshaları tespit edilerek nüsha sahipleri kaydedilmiştir. Nüshalar ilgili rivayetlerine göre tertip edilmiştir. Ardından nüshalarda bulunan farklılıkların sebepleri tespit edilerek Muvatta'nın günümüz baskıları incelenmiştir. Çalışmanın ikinci bölümünde ise tespit edilen farklılıklar Yahya b. Yahya el-Leysî rivayeti özelinde örneklendirilmiştir. Çalışmanın en sonunda ise tespit edilen nüshalar hoca-talebe ilişkisine göre şemalandırılmıştır."
