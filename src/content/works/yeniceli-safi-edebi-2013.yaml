abstract: "islam âleminde eş-Şâfi`î'nin ismi anıldığı zaman hemen akla onun mezhep imamlığı ve fakihlik yönü gelmektedir. Buna mukabil onun şâirliği, fıkıhçı kimliğinin gerisinde kalmıştır. eş-Şâfi`î'nin dîvânını incelemek suretiyle ortaya koyduğumuz bu çalışmayla bir nebze de olsa onun bu yönünü ilim dünyasına yansıtmaya çalıştık. Arap diline ve şiirine hâkim olan eş-Şâfi`î, çeşitli vesîlelerle şiirler söylemiştir. Daha sonraki dönemlerde, bu şiirler araştırmacılar tarafından derlenerek eş-Şâfi`î'ye ait çeşitli dîvânlar ortaya çıkmıştır. Biz de yaptığımız bu çalışmayla onun şiirlerini şekil ve içerik yönünden incelemeye gayret ettik. Böylece eş-Şâfi`î'nin fıkıhta olduğu gibi Arap dili ve edebiyatı alanında da önemli bir yere sahip olduğunu ortaya koyduk."
