abstract: "Çalışma kapsamında, Osmanlı Devletinin kurulduğu ilk günden beri varlığını koruyan Şeyhülislamların verdikleri fetvalar bazında kurumun Osmanlı devlet idaresine etkisi incelenmiştir. İslam devletlerinde din ve siyasetin etkinliği ve sıkı bir ilişki içerisinde oluşu, Hz. Peygamber ile başlamakta ve Osmanlı Devletinde de devam etmektedir. İslam devletleri büyüdükçe karar alıp uygulama ve ya alınan kararların dine uygun olup olmadığının sorgulanması bir ihtiyaç haline gelmeye başlamıştır. Bu nedenle İslam devletlerinde ilk dönemlerinden itibaren farklı isimler veriliş olsa da Şeyhülislamlık Kurumu'nun ortaya çıktığı anlaşılmaktadır. Bu çerçevede çalışmada, Şeyhülislamlık Kurumu'nun ortaya çıkışı, tarihsel süreç içerisindeki gelişimi ve Osmanlı Devletinden önceki Şeyhülislamlık kurumu ve benzerleri incelenmiştir. Sonrasında Osmanlı Devlet yönetimindeki Şeyhülislamlık Kurumu'nun kırılma noktaları ile tarihsel süreç anlatılarak Şeyhülislamlık Kurumu'nun devlet teşkilatındaki yeri ve Şeyhülislamlar tarafından verilen fetvaların, din ve devlet ilişkisi birlikte ortaya konulmuştur. Osmanlı Devletinden önceki İslam devletlerinde de varlığından çokça söz ettiren kurum olan bu yapının, Osmanlı Devleti zamanında statüsü en üst seviyeye ulaşmıştır. Osmanlı Devletinin çok uzun yıllar varlığını devam ettirebilmesinin en önemli nedenlerinden biri de teokratik bir yönetim anlayışını benimseyen devlet idarecilerinin aldığı kararları Şeyhülislamlık Kurumu vasıtasıyla halk ve din nezdinde meşrulaştırmasıdır. Çalışma kapsamında cihat, arazi ve tımar, vergi ve beytülmal, hal ve katl ile yargı alanlarında Şeyhülislamların verdikleri seçilmiş fetvalar incelenmiştir. İncelenen fetvalar kapsamında dini kuralların etkinliği önemli biçimde hissedilen Osmanlı Devletinde dini kurum olan Şeyhülislamlık Kurumu'nun aslında yönetim için önemli bir karar mekanizması haline dönüştüğüne ve yönetimin kararlarını dini açıdan meşruiyet kazandırdığı sonucuna ulaşılmıştır."
