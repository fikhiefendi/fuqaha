abstract: "Bu çalışma, İslami finans kurumlarında Murabaha ve Tawarruk sürecinde meydana gelen zorluklara ve suistimallere ışık tutmayı, bunlara çözüm bulmayı ve hem Murabaha hem de Tawarruk bankacılığına ilişkin şeriat hükümlerinin delillerini ortaya koymayı ve şeriatın bu konudaki yönünü aydınlatmayı amaçlamaktadır. Harekete geçirici ve makul olandan hüküm vermekte olup, çalışma aynı zamanda alimlerin banka kredilerine bir alternatif (Murabaha ve Tawarruk) sunma girişimlerinin boyutunu da bilmeyi amaçlamaktadır ve çalışma sadece hükümleri listelemekle sınırlı kalmamış, daha da ileri gitmiştir; Hükmün açıklığa kavuşturulması ve meşruiyetinin açıklığa kavuşturulması açısından, daha sonra üründe meydana gelen suistimallerden bahsetmek ve onları kelimenin tam anlamıyla meşru bir alternatif olarak düzeltmek. Araştırmacı, anket yöntemiyle Almanya'daki bazı İslami finans kurumlarının Şeriat Uygulama Departmanındaki bazı çalışanlar ve yetkililerle bir dizi kişisel görüşme yaptı ve ardından analitik yöntemi kullanarak Murabaha ve Tawarruq'un uygulama görüntülerini analiz etti. kurumlara sözde İslami yatırım. Son olarak, çalışmada Gana Cumhuriyeti'nde İslami finansal işlemlerin karşılaştığı bazı zorluklara ve engellere değinildi ve çalışma, Gana Devleti'ndeki İslami finansal işlemleri idari bir bakış açısıyla kolaylaştırmak için bu potansiyel zorlukların üstesinden gelmek için stratejiler önerdi, Ayrıca bu çalışma, hem Murabaha hem de Tawarruk sürecinde İslami finansal işlemlerin zengin bir objektif değerlendirmesini birçok açıdan bir araya getiriyor ve bu çalışma, Murabaha ve Tawarruk'u banka kredilerine alternatif olarak sunmanın zorlukları hakkında önemli bir bilgi kaynağı olarak hizmet edecek. Gana'daki İslami finansal işlemlerin zorlukları hakkında, özellikle Gana Bankası, politika yapıcılar, İslami finans uygulayıcıları ve İslami finans araştırmalarıyla ilgilenen akademisyenler ve uygulayıcılar için önemli bir kaynak olacaktır."
