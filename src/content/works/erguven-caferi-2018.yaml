abstract: "Sınırlı sayıdaki nasslar ışığında ve onların ruhuna uygun belirlenen ölçülerle sınırsız sayıdaki meseleleri halletmek için olanca gayreti göstermek fıkıh usulü ilminde ictihâd olarak ifade edilmiştir. Bizler bu çalışmamızda, Ehl-i Sünnet'ten sonra en büyük fırka olarak kabul edilen Şîa ekolünden Câferî mezhebi âlimlerinin ictihâd anlayışını mezhep içi kaynaklar ışığında ortaya koymaya çalıştık. Çalışmamızın birinci bölümünde, Câferî âlimlerin görüşleri ışığında konunun kavramsal çerçevesi ile tarihi seyri içerisinde ictihâd kavramına yükledikleri anlamı belirlemeye çalıştık. Ayrıca, Hz. Peygâmber'den (s.a.s) günümüze kadar dönemler halinde Caferiler'de ictihâd tarihi konusunu işledik. İkinci bölümde Câferî âlimlerin ictihâdın/müctehid'in kısımları ile müctehidde aradığı şartları ortaya koymaya çalıştık. Üçüncü bölümde ise ictihâd kapsamında Câferiler'e göre ictihâdın hükmü ve zarureti, ictihâdda hata ve isabet meselesinin mahiyeti, müctehidin ictihâdının değişmesi durumu, kat'i meselelerde ve usûlü'd-din konusunda ictihâdın varlığı, zamanın ve mekânın değişmesiyle ahkâmın değişip değişmediği konusu, ictihâd kapısının açık mı yoksa kapalı mı olduğu gibi konuları ortaya koymaya çalıştık."
