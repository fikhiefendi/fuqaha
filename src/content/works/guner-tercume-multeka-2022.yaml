abstract: "Bu çalışmada Hanefî Mezhebinin temel görüşlerini ele alan bu yönüyle Osmanlı Medreselerinde ders kitabı olarak okutulan ayrıca müftîlerin fetvâ kaynağı olarak kullandıkları İbrâhim el-Halebî'nin Mülteka'l-ebhur isimli eserinin Türkçe'ye yapılan ilk ve en meşhur tercümesi ele alınmıştır. Tezimizin ana konusu bu eserdeki Osmanlı tercüme-şerh geleneğine bağlı kalınarak yapılan izahların kaynaklarına ilişkindir. Müellifin gösterdiği bu kaynakları incelemeye çalıştık. Bunları yaparken fıkıh bahislerinin tamamı yerine sadece ibâdât bahislerini sınır olarak belirledik. Çalışmamızda müellifin şerhine mesned olan kaynakları tespit etmenin yanında bu kaynaklarla ilgili hangi bölümde ne kadar kullanıldıklarına dair istatistikî verileri ortaya çıkartıp tablolar ile bunları görselleştirdik. Bunlara ilâveten müellifin meseleleri fıkhî olarak değerlendirme tarzını da gücümüz nispetinde ortaya çıkarmaya çalıştık. Bütün bunlar, özel tespitlerin ele alındığı ikinci bölümde ve özel tespitlerden ulaşılan genel tespitlerin sunulduğu üçüncü bölümde ifade edildi. Müellifin hayatıyla ilgili çok az mâlûmat bulunmaktadır. Muhtelif tarih eserlerinde parça parça bulunan bilgileri kronolojik bir sıraya tâbi tutup toplayarak müellifin hayatına dair şimdiye kadarki en geniş çalışmayı yapmış olduğumuz kanaatini taşımaktayız. Ayrıca Hanefî Mezhebi'nin önemli kaynaklarından bir tanesi olan Mülteka'l-ebhur'un tercümesi olan bu eserin kaynaklarının ortaya çıkarılması ve bu vesileyle Osmanlı tercüme-şerh geleneğine yaptığımız vurgu kanaatimizce ilim dünyasına sunulacak önemli katkılar mahiyetindedir."
