abstract: "Dünya genelinde 1970'li yıllar itibari ile gelişme göstermeye başlayan Faizsiz Bankacılık yapısı, Türkiye'de 1983 yılında“özel finans kurumu”adıyla ortaya çıkmıştır. Özel Finans Kurumları 2005 yılında Türkiye'de“Katılım Bankacılığı”olarak bankacılık sektöründe yer almaya başlamıştır. Şu an itibari ile gelişimin devam ettirmekte olan Faizsiz Bankacılık Sistemi, aynı zamanda işlem hacmini ve ürün çeşitliliğini de geliştirmeye devam etmektedir. Katılım Bankacılığı, faizsiz çalışma ilkelerine dayalı olarak çalışan, kâr ve zarara katılma esasına göre piyasadan fon (mevduat) toplayan ve finansal kiralama, ortaklık ve ticaret yöntemleriyle topladığı fonları kullandıran bir sisteme sahiptir. Bu yönüyle katılım bankacığı, bankacılık sektörü içerisinde kendine has yöntemleriyle farklılık göstermektedir. Katılım bankaları Ticari bankaların sahip olduğu ürünlerin tamamına sahip olamasa bile farklı istek ve ihtiyaçlara cevap verebilmek adına her geçen gün kendisini geliştirmektedir. Türkiye'de dört (4) adet Katılım Bankası olmakla birlikte; Faizsiz Bankacılık Sektörüne duyulan talepten dolayı ilerleyen dönemlerde Faizsiz Bankacılık Sektörüne yeni bankaların katılacağı da beklenmektedir."
