abstract: "Ceza hukukunun genel prensipleri ceza hukukuna hâkim olan temel ilkelerden ibarettir. Azerbaycan Ceza Kanunu ceza hukukunun genel prensiplerine hâkim olan ilkeler çerçevesinde düzenlenmiş bir kanundur. Bu çalışmada ceza hukukunun temel prensipleri esas alınarak Azerbaycan Ceza Kanunun tarihten günümüze kadarki gelişim süreci, kanuna hâkim olan temel kaynaklar, doktrindeki görüşler ile yeni ceza kanununun yapısı, sistemi, uygulanma alanları bütün yönleriyle gözetilerek incelenmesi amaçlanmıştır. Arap hilafetinin hâkimiyeti altında bulunduğu dönemlerde Azerbaycan coğrafyasında İslam dini kaynaklı hukuk sistemi uygulanmıştı. 10 Şubat 1828 tarihinde Türkmençay Antlaşması ile Kuzey Azerbaycan toprakları Rusya tarafından ilhak edilmiş ve Kuzey Azerbaycan'da İslam dini kaynaklı hukuk sisteminden Çarlık Rusya'da geçerli olan hukuk sistemine geçiş süreci başlamıştı. Bu dönemde 1845 tarihli“Cinayet ve Islah Cezaları Hakkında Kanunname”ceza hukuku içerikli en önemli belgeydi. Bu Kanunnameyle ceza mevzuatı ilk kez genel ve özel hükümler olmak üzere ikiye ayrılmıştı. Sovyet Rusya dönemi Kanunlarında ise sosyalist düşünce etkisi hâkim olmuş ve 1958 tarihli“Esaslarla”ceza hukukunun temel ilkeleri kanunlarda yer almaya başlamıştır. Azerbaycan'ın yeni Ceza Kanunu 1 Eylül 2000 tarihinde yürürlüğe girmiştir. Yeni Ceza Kanunun tasarısı hazırlanırken Rusya'nın, Fransa'nın ve Avrupa'nın diğer ülkelerinin yürürlükte olan ceza kanunlarının sistemi, ilkeleri ve normları dikkate alınmıştır. Yeni Ceza Kanunu bağımsızlığını kazanan Azerbaycan'ın ilk ceza kanunudur. Yeni Kanun demokratikliği, yenilikçiliği ile önceki kanunlardan ayrılmaktadır. Kanun Genel ve Özel Hükümler olmak üzere ikiye ayrılmaktadır. Kanunun Genel Hükümler kısmı altı bölümden, on yedi fasıldan, 99 maddeden ibarettir. Yeni Ceza Kanununun doğrudan kaynakları Azerbaycan Cumhuriyeti Anayasası, Azerbaycan Cumhuriyetinin taraf olduğu uluslararası sözleşmeler ve Cinayet Mecellesidir. Yeni Ceza Kanunu diğer eski ceza kanunlarından farklı olarak ceza hukukunun en temel prensipleri olan kanunilik, kanun önünde eşitlik, kusura göre sorumluluk, adalet ve hümanizm ilkelerini benimsemiştir. Yeni Ceza Kanunuyla kıyas yasağı getirilmiş, suç tiplerinin ve ceza sorumluluğunun belirlenmesinin yeni özellikleri düzenlenmiştir."
