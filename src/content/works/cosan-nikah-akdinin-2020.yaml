abstract: "Çalışmamızın konusu, nikâh akdinin bağlayıcılığı ve bağlayıcılık (lüzûm) şartlarını taşımaması durumunda taraflar için söz konusu olan muhayyerliklerdir. Araştırmalarımız sonucunda bu konuda yapılmış bir çalışma olmadığını tespit ettik. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde nikâh akdinin mâhiyeti ile taşıması gereken şartlarını ve bağlayıcılık kavramı ile nikâh akdinin bağlayıcılığını ele aldık. Aynı zamanda nikâhta söz konusu olan muhayyerlikleri tespit ettik. İkinci bölümde ise Hanefî, Şâfiî, Mâlikî ve Hanbelî mezhepleri çerçevesinde nikâh akdine ait muhayyerlikleri detaylı bir şekilde inceledik. Bu araştırmayı yaparken dört mezhebin temel kaynaklarından, aile hukukunu ele alan ahvâl-i şahsiyye eserlerinden ve konumuzla ilgisi nispetinde bazı çağdaş kaynaklardan faydalandık. Yaptığımız çalışma sonucunda bir nikâh akdinin esasen bağlayıcı olduğu ve taraflara evliliğin gereklerini yerine getirme sorumluluğu yüklediği görülmektedir. Aynı zamanda bir akdin bağlayıcı olması, tarafların kendi iradelerine dayalı olarak sonlandıramayacakları anlamına gelmektedir. Fakat bağlayıcılık şartlarında bir eksiklik bulunan nikâh, bağlayıcılık sonucunu doğurmamakta ve gayr-ı lâzım olmaktadır. Bir akdin bağlayıcılık sonucunu doğurmaması, muhayyerlik hakkının bulunması ile de yakından ilgilidir. Muhayyerlik hakkına sahip olan taraf, kendi iradesine dayalı olarak evliliği sonlandırabilmektedir. Muhayyerlik sebebiyle meydana gelen ayrılıklar, çoğunlukla mahkeme kararına dayalı olarak gerçekleşmektedir."
