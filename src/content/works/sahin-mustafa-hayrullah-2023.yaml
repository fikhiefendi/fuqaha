abstract: "Bu çalışma Osmanlı son dönemi ile Cumhuriyet'in ilk yıllarında yaşamış olan Mustafa Hayrullah'ın Tabâbet-i Adliye-i Mecânîn adlı eserinin fıkhi açıdan değerlendirilmesini hedeflemektedir. Çalışma bir giriş ve iki bölümden oluşmaktadır. Girişte tezin konusu, amacı, yöntemi ve sınırlarından bahsedilmiştir. Bu kapsamda genel olarak adli tıp ve adli psikiyatri hakkında kısa bilgiler verilmiştir. Birinci bölüm, tezin araştırma kısmını oluşturmaktadır. Bu bölümde Mustafa Hayrullah'ın hayatı, kişiliği ile kaleme almış olduğu eserler ve fikirleri incelenmiş, yazmış olduğu bazı eserlerle ilgili bilgilere yer verilmiştir. Daha sonra ise eserin fıkhi açıdan değerlendirmesi yapılmıştır. Söz konusu değerlendirmeler müellifin belirlemiş olduğu bölümler çerçevesinde yapılmıştır. Burada önce eserin ilgili bölümü hakkında genel bilgiler verilmiş, sonra konunun fıkıh eserlerinde ve özellikle çağdaş çalışmalarda nasıl ele alındığına temas edilmiştir. Son olarak Mustafa Hayrullah'ın görüşleri bu çerçeveden değerlendirilmeye çalışılmıştır. Bu bölümün sonunda ise sonuç başlığı altında genel bir değerlendirme yer almaktadır. Üçüncü bölüm eserin günümüz Türkçesi alfabesine aktarımından oluşmaktadır. Zira Tabâbet-i Adliye-i Mecânîn adlı eser Osmanlı Türkçesi ile yazılmıştır. Aktarım yapılırken serbest metod ile latinize edilmiştir. Metnin orijinali ile kolay karşılaştırma imkanı vermesi amacıyla sayfa numaraları metnin içerisinde verilmiştir."
