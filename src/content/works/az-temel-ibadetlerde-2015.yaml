abstract: "Bu çalışmada“temel ibadetlerde niyabet”konusu incelenmiş ve niyâbetle ilgili zikredilen rivayetlerin fukahâ tarafından nasıl değerlendirildikleri ve mezheplerin konuya yaklaşımları tetkik edilmiştir. Niyâbetin hangi ibadetlerde, hangi şartlarda mümkün olduğu da konumuzun kapsamı içerisindedir. Araştırmamızda konu edindiğimiz niyabet meselesi asli kaynaklarda sarih ya da işaret yoluyla değinilmiş bir konudur. Gerek Peygamber Efendimizin hayatını, gerek sahabe hayatını, gerekse de tabiûn uygulamalarını konu edinen eserleri incelediğimizde niyabet konusuyla ilgili rivay etlere rastlamaktayız. Buna göre asr-ı saadette ibadetlerde niyâbet konusuyla alakalı yaşanan gelişmeler mercek altına alınmıştır. Ağırlık noktası ise dört mezhebe göre müçtehitlerin konuyla ilgili görüş ve değerlendirmeleri ile mezheplerce kabul gören görüşün ne yönde olduğudur. Beş bölümden oluşan bu çalışmanın birinci bölümünde ibadetin mahiyeti ve çeşitleri hakkında genel bilgiler verilmiş, ikinci bölümde niyâbetin mahiyeti ve kısımları ele alınmış, üçüncü bölümde ise ibadetlerde niyâbet konusuna değinilmiştir. Dördüncü bölümde de niyabetle ilgili olması hasebiyle ıskat ve devir konusu ele alınmıştır. Çalışmanın sonuç bölümünde ise temel ibadetlerde niyabet ile ilgili müçtehit âlimlerin görüşleri değerlendirilerek, hâsıl olan kanaat ortaya konmuştur."
