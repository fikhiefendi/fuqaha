abstract: "Hac, İslam'ın en temel ibadetlerinden biri olup fert, toplum ve ümmetin hayatına dokunan sonuçlar doğurmaktadır. Haccın diğer ibadetlerden farklı olarak çok sayıda ritüel içerdiği görülür. İslâm'da kadın ve erkeğin kulluk noktasında eşit olduğu ve aynı derecede teklife muhatap olduğu bilinen bir hakikattir. Ancak kadının, erkeğin ve fiilin taşıdığı bazı özellikler sebebiyle bazı ibadetlerin îfâ biçiminde bu iki cins arasında farklılıklar bulunmaktadır. Bu çalışmanın amacı, hac ibâdetinde, kadınlara mahsus hükümleri ve bu hüküm farkının hikmetlerini ortaya koymaktır. Çalışmada haccın edâsıyla ilgili mezhepler arası ihtilafların detaylarına girilmemiş, kadınlarla ilgili hüküm ve uygulama farklarına ağırlık verilmiştir. Ancak bu farkların daha iyi kavranabilmesi için, hac ibadetine ve hikmetlerine genel bir bakışla teze başlanması uygun görülmüştür. Tezin ana gövdesini oluşturan kısımda ise öncelikle haccın şartları ve niyâbet gibi henüz hac menâsiki başlamadan önceki aşamada kadına mahsus hükümler zikredilmiştir. Ardından ihrâm, tavaf sa'y vb. hac menâsikinin edâsında kadına mahsus hükümler ve maksatları incelenmiştir. Son olarak ise haccın edâsında yapılan ihlâller ve keffâretler gibi, kadına mahsus diğer hükümlere, hikmetleriyle birlikte yer verilmiştir. Çalışmada, kadınların haccı ile ilgili hükümlerin maksatları ve şer'î teklifte kadının konumu hakkında önemli sonuçlara ulaşılmıştır."
