abstract: "İslam hukuku geniş bir coğrafyada ve uzun yıllar içinde gelişmiş zengin bir literatüre sahiptir. İslam hukukunun sahip olduğu bu zengin muhteviyatın derinlemesine kavranması ve daha iyi anlaşılması fıkıh ilminin temel kavramlarının anlaşılmasına bağlıdır. Bu bağlamda çalışmada semen ve kıymet kavramları klasik fıkıh literatürü çerçevesinde ele alındı. Çalışmada semen Hanefî literatüründe alışverişlerde satılan malın karşılığında verilen edim anlamında ıstılahî anlamıyla ele alınırken, kıymet ise malların satış bedelinden bağımsız olarak piyasadaki gerçek değeri anlamındadır. Bu çalışmanın amacı semen ve kıymet kavramlarını özellikle muâmelât konuları içerisinde incelenerek aralarındaki bağlantının ortaya konulmasıdır. Bu nedenle kavramların literatür içinde terminolojik olarak anlam çerçevesinin tespitine ve füru-u fıkıh mesâili içerisinde nasıl işlendiğinin belirlenmesine çalışılmıştır."
