abstract: "Bu araştırmada İslâm'da kadına verilen haklar ve sorumlulukları ile İslâm dışı bir akım olan feminizmin ortaya koyduğu kadın anlayışı ele alınıp işlenmeye çalışılmıştır. Feminizm kavramı incelenirken; anlamı, tarihçesi, çeşitleri ve pratik dünyadaki karşılığının olup olmadığı ortaya konmaya çalışılmıştır. İslâm'da kadına verilen haklar, çocukken, evliliğinde, anne olduğunda, boşandığında ve sosyal hayatında olmak üzere başlıklandırılmış, kadının hakları karşılığında da belli sorumluluklarının olduğu da vurgulanmıştır. Kadının sorumlulukları Allah ve Rasûlü'ne (s.a.s.) , kendine, kocasına, çocuklarına ve topluma şeklinde tasnif edilerek sunulmuştur. Son olarak ise feminizmin İslâm hukuku açısından kısa bir değerlendirmesi yapılmıştır."
