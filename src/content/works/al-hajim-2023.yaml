abstract: "Allah C.C. , Ümmete Allah'ın kitabının hizmetinde çaba sarf eden bir çok alim bağışlamıştır, bunlardan biri ise Ebu Ali el-Farsi'dir, yazdığı kitaplardan biri“Al-Halabiyyat”, bu çalışmamda kitabın içerdiği tefsir ayetlerini ortaya koymaya çalıştım, tefsir etkilerini topladım ve içindeki gizemi açıkladı. Araştırma, önsöz , kapanış ve üç bölümden oluşmaktadır. Önsözde Allah C.C.' a hamd ve sena ve peygamberine salavat bulunmaktadır, kitap ile ilgili yazı, kitabın seçme nedeni ve hedefler yer almaktadır, daha önce ele alınmadığı ve araştırma yöntemi belirtilmiştir. Birinci Bölüm : Bir çok araştırmada Farisi'nin tercümesini ele aldım, adında , eserlerinden yetişmesinden ve ülkelerdeki bilim seyahatlerinden bahis ettim, daha sonra hocaları, öğrenciler ve ölümünden bahis ettim. İkinci Bölüm :“El-Masaail Al-Halabiyyat”adlı kitabında tefsir sözlerini ele aldım, topladım ve Kuran Kerime göre düzenledim, daha sonra beyan ettim, açıkladım ve metinin gereklilerini anlattım. Üçüncü bölüm :“Al-Halabiyyat”kitabından çıkardığım tefsirlerinden tefsir çapaları, mezhep ve etkileri aldım, ezhep nahavi, fıkhı ve akaididir, tefsirindeki etkiler ise (fenkalat) ve (Hadisiye) dir. Kapanış : elde edilen sonuçlardan bahis ettim, Kaynak ve referanslar ."
