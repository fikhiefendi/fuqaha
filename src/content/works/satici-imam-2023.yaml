abstract: "İmam Serahsi'nin Hanefi fıkhının temeli olan İmam Şeybani'nin eserleri üzerine yaptığı şerh çalışmaları çok meşhur olmuştur. Kaynak kitap olduğu için eserleri İslami konularda yapılan çalışmalar için önemini korumaktadır. İslami iktisada ilişkin konular da İslamiyet'e dair eserlerin içinde günümüze kadar ulaşmıştır. Serahsi'nin meşhur kitaplarından biri El-Mebsut'tur. Bu tezde Mebsut'ta yer alan iktisat ile ilgili görüşlerden yola çıkarak İmam Serahsi'nin iktisadi görüşleri ortaya çıkarılmaya çalışılmıştır. Konuya ilişkin olarak çalışmamıza kaynaklık eden Mebsut kitabı, İmam Şeybani tarafından telif edilen kitabın İmam Searhsi tarafından şerhidir. Günümüze şerh edilen eserin aslı ulaşmadığı için İmam Serahsi'nin İktisadi görüşleri olarak ileteceğimiz konuları, iki imamın görüşlerinin toplamı olarak görmek gerektiği unutulmamalıdır. Biz İmam Serahsi'nin İmam Şeybani'nin görüşlerini de benimseyip, onları desteklemek için sistemli bir çalışma yapması ve gerektiğinde kendi görüşlerini de belirterek eklemeler yapmasından dolayı görüşleri kendi ifadelerinde bir araya getirdiğini görmekteyiz. Burdan yola çıkarak, İmam Şeybani'nin attığı temeli unutmadan, İmam Serahsi'nin iktisadi görüşlerine yer verilmeye çalışılacaktır."
