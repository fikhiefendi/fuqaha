abstract: "ÖZET Bu çalışma, düzensiz göç olgusunu, uluslararası hukukla karşılaştırmalı fıkhî ve makāsıd merkezli bir perspektiften ele almakta; canın korunması (ḥifẓ al-nafs) amacının bu çağdaş olgunun fıkhî değerlendirilmesindeki belirleyici rolünü ortaya koymaktadır، Artan insani riskler ve karmaşık sosyo-hukuki gerçeklikler bağlamında çalışma, canın korunması amacının düzensiz göçün hükmünü belirlemede ne ölçüde düzenleyici olduğu sorusuna odaklanmaktadır. Araştırmada, şer'î metinler ve fıkhî kaidelerin analitik incelemesine dayalı bütüncül bir yöntem benimsenmiş; değerlendirmelerde şeriatın genel amaçları ve muhtemel sonuçlar dikkate alınmış; ayrıca uluslararası hukuk düzenlemeleriyle mukayeseli analiz yapılmış ve düzensiz göç güzergâhlarına ilişkin istatistiksel ve olgusal veriler incelenmiştir. Çalışma sonucunda, canın korunması amacının düzensiz göçle ilgili şer'î hükümlerin değerlendirilmesinde temel ve belirleyici bir ölçüt olduğu; bu hükümlerin mutlak olmadığı, risk derecesi, muhtemel sonuçlar ve zaruret şartlarının gerçekleşmesine bağlı olarak değişkenlik gösterdiği tespit edilmiştir. Ayrıca, ölüm riskinin baskın olduğu durumlarda düzensiz göçün ilke olarak şeriatın amaçlarıyla bağdaşmadığı; uluslararası hukukta insan hayatının korunmasına yönelik teorik vurguya rağmen uygulamada, özellikle düzensiz göçmenler bakımından ciddi eksikliklerin bulunduğu ortaya konulmuştur. Bu bağlamda, makāsıd merkezli yaklaşımın daha dengeli ve gerçekçi bir değerlendirme çerçevesi sunduğu sonucuna ulaşılmıştır."
