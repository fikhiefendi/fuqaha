abstract: "Bu çalışmamızda tarihsel süreçte ve dinlerde kadınlara verilen haklar ile Mer'i hukukunun kadınlara verdiği haklar incelenecektir. Tarihsel süreç içerisinde kadının ruhunun var olup olmadığını tartışılmışken İslam dini kadına temel hak ve hürriyetlerini vermiştir. Günümüzde özellikle Batı toplumlarında kadın aleyhtarı gelenek ve görenekler İslam dininin bir parçası olarak gösterilmektedir. Halbuki Kur'an-ı Kerim'in 14 asır önce kadına verdiği haklar ile günümüzdeki var olan hukuk sisteminin kadına verdiği haklar aynı doğrultuda gitmektedir. Bu çalışma ile İslam Hukuku ve Mer'i hukukun kadına verdiği haklar karşılaştırılacak ve kadınlara İslam gelinceye kadar verilmemiş olan hakların tahsis edildiği ispatlanacaktır."
