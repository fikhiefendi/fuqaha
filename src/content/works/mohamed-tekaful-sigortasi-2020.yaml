abstract: "Bu çalışma İslami tekâfül sigortacılık sistemini bir nizam ve bir akit olarak kavramasının yanı sıra, İslami tekâfül sigortacılık hedefleri, genel ve özel ilkeleri, geleneksel sigortacılık ile tekafül arasındaki temel farklar üzerinde durmayı amaçlamaktadır. Ayrıca, İslami tekâfül sigortacılığının güçlü yanları ve karşılaştığı zorlukları tespit etmektir. Bu çalışmada, Müslüman alimler tarafından izin verilen sigorta fetvası formülü, tekâfül sigortasının modelinin yargı yetkisi, sigorta kavramı ve başlangıcı, sigorta türleri ve kategorileri, İslam sigortası kurulmasından bu yana deneyimini incelemekte, Sudan'da sigortanın ortaya çıkışı ve gelişimi, Sudan'da sigorta piyasası ve sigorta piyasasında faaliyet gösteren şirketler, Sudan'ın temel sigorta düzenlemeleri ve finansal standartları, Sudan'ın tekâfül sigorta şirketleri ile ilgili bir vaka çalışması yapılmaktadır. Şirketlerin hizmetlerinin coğrafi yayılımı ve pazarlama mekanizmaları, şirketler tarafından sağlanan sigorta ürünleri vb. tekâfül sigortasının büyüme fırsatları ve Sudan'daki tekâfül piyasasında iş performansı göstergeleri ele alınarak Sudan'daki tekâfül sigortasının geçmişi ve mevcut durumu incelenmiştir. Bu çalışmada Sudan'da kişi başına düşen sigorta harcaması, yani sigorta yoğunluğunun çok düşük olduğu tespit edilmiştir. Bunun sebebi toplumun sigorta ile bilgi ve birikiminin yetersiz olması ve sigorta bilincinin artırılması noktasındaki eğitimlerin yetersiz kalmasıdır. Sigorta kültürünün yayılabilmesi ve bilincin artırılabilmesi için sigorta ve sigortacılık faaliyetleri ile ilgili topluma eğitim verilmesi önem arz etmektedir. Denetleme Kurulu ve sigorta şirketleri, sigorta kültürünü yayma, sigorta bilincini artırma ve sigortacılık faaliyetleri ile ilgili eğitim verilmesi konusunda sorumluluk almaları gerekmektedir."
