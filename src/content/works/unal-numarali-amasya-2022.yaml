abstract: "Şer'iyye Sicilleri, içeriğinde bulunan idarî, siyasî, askerî ve sosyal nitelikli belgelerden dolayı Osmanlı Tarini'ne ışık tutan kaynaklar niteliğindedir. Siciller ait oldukları yerin eski yerleşim birimlerini, buradaki insanların lakaplarını, birbirleriyle olan ticari ilişkilerini, ekonomik durumlarını, hukuki münasebetlerini içermektedir. Hazırlamış olduğum Yüksek Lisans tezi 44 Numaralı ve H. 1159-1161/M. 1746-1748 tarihlerini ihtiva eden Amasya'ya ait Şer'iyye Sicilidir. Defter 44 numaralı sicilin transkripsiyonunu ve değerlendirmesini içermektedir. Çalışma beş bölümden meydana gelmektedir. İlk bölümde Osmanlı Devleti'nin hukuku ve Osmanlı'da kadılık kurumu ile ilgili bilgi verilmiştir. İkinci bölümde Amasya şehrinin tarihi, üçüncü bölümde belgelerin özet ve tasnifi, dördüncü bölümde Amasya'nın idari yapısı ve sosyal hayat ile ilgili bilgilere yer verilmeye çalışılmış ve son bölümde defterin transkripsiyonuna yer verilmiştir."
