abstract: "Delaletü'l-hitap, meskût anhin hükümde mantûk bihin sabit hükmüne muhalif bulunmasıdır. Bu durum Mefhum-i muhalif olarak isimlendirilir. Bu, Hanefiler hariç, Mâlikîlerin de arasında bulunduğu cumhurun şer'i hükümleri istinbat etmede kullandığı delâletler arasında yer alır. Mâlikîler bununla en çok amel eden mezhepler arasında yer alır. Buna rağmen Mâlikî âlimleri bazı fıkhi meselelerde bununla amel etmeyi yasaklamışlardır. Bundan ötürü tez çalışmamızın, Mâlikîlerin mefhum-i muhalifle amel etmekten vazgeçtikleri fıkhi meseleler, vazgeçme nedenleri ve delilü'l-hitabın hücciyeti hakkında olmasını istedik.Çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümü, üç alt başlık içermektedir. Birinci bölümde mefhum-i muhalif tanımı ve onunla amel etme koşulları, İkinci bölümde, Mâlikî mezhebinin özetle neşetine ve gelişim aşamalarına değinilmiştir. Üçüncü bölümde Mâlikîlere göre mefhum-i muhalifin hüccet oluşu ve onu delil göstermekten vazgeçmeleri konusu ele alınmıştır. Çalışmanın uygulama bölümü ise iki kısma ayrılmıştır. Birinci bölüm: Mâlikî mezhebinin namaz konusunda mefhûmi muhâlifle amel etmekten vazgeçtikleri meseleler. İkinci bölüm: Mâlikî mezhebinin taharet konusunda Mefhûmu muhâliflele amel etmekten vazgeçtikleri meseleler. Ardından mefhum-i muhalifle amel edenlerin delilleri ve bu meselelerde mefhum-i muhalifle amel etmekten vazgeçen Mâlikîlerin delilleri zikredilmiştir. Daha sonra mezheplerin görüşlerinin değerlendirmesini yaptık. Bazı Mâlikîlerde olduğu gibi, temelden itiraz etme ve kabul etmeme nedeniyle değil ancak bazı meselelerde mefhum-i muhalifle amel etmemeyi gerektiren nedenler bulunmaktadır. Mâlikîler, mefhumu'l-hitapla amel etme konusunda aralarına bazı engeller girmiş olsa da onu hüccet olarak göstermeye bağlıdırlar."
