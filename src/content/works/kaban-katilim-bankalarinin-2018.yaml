abstract: "Bu çalışmanın amacı; katılım bankalarının kurumsal müşterilerinin İslami finans ve İslami pazarlama anlayışları arasındaki ilişkiyi ortaya çıkarmaktır. Araştırmanın evreni Düzce ilinde faaliyet gösteren inşaat şirketlerinden oluşmaktadır. Çalışmada nicel araştırma yöntemi kullanılmış ve veriler yüz yüze anket tekniği kullanılarak elde edilmiştir. Araştırmada tam sayım yöntemine gidilmiş ve 200 kişiye anket formu verilmiştir. 200 anket formundan 189 tanesi katılımcılar tarafından doldurulmuştur. Toplanan 189 anket formundan analiz için 176 tanesi uygun bulunmuştur. Bu kapsamda veri analizinde kullanılan anket sayısı 176'dır. Elde edilen verilere frekans, faktör, korelasyon, ANOVA, t-test analizleri yapılmıştır. Veriler analiz edilirken SPSS paket programı kullanılmıştır. Faktör analizi bulgularına göre İslami finans değişkeninin 3 boyuttan oluştuğu görülmüştür. Bu boyutlar; imaj, algılanan dini hassasiyetler ve algılanan hizmet kalitesi 'dir. İslami pazarlama değişkeni ise 5 boyuttan oluştuğu görülmüştür. Bu boyutlar; İslami dağıtım kanalları, İslami ürün, İslami tutundurma faaliyetleri, İslami fiyatlandırma ve insan 'dır. Korelasyon analizi sonuçlarına göre İslami finans anlayışı ile İslami pazarlama anlayışı arasında anlamlı bir ilişki çıkmıştır. Diğer yandan algılanan hizmet kalitesi ile İslami ürün, İslami fiyatlandırma ve insan boyutları arasında pozitif ilişki olduğu görülmüştür. İslami finansın diğer bir boyutu olan algılanan dini hassasiyetler ile İslami ürün arasında pozitif bir ilişkiye rastlanılmıştır. İslami finansın son boyutu olan imaj ile İslami pazarlamanın boyutları olan İslami dağıtım kanalları, İslami ürün, İslami fiyatlandırma ve insan arasında pozitif bir ilişki olduğu ortaya çıkmış ve imaj ile İslami tutundurma faaliyetleri boyutu arasında negatif ilişki çıkmıştır. Katılımcıların demografik özelliklerine göre İslami finans ve İslami pazarlama arasında anlamlı farklılıkların olup olmadığını ortaya çıkarmak için ANOVA ve t-testleri yapılmıştır. Katılımcıların yaş gruplarına, eğitim düzeylerine, medeni hallerine, gelir durumlarına, kurumdaki mevkilerine, sektördeki deneyim sürelerine ve katılım bankaları haricinde geleneksel bankaları da kullanma durumları gruplarına göre İslami finans ve İslami pazarlama anlayışları arasında anlamlı farklar ortaya çıkmıştır."
