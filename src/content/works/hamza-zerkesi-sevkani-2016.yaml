abstract: "Fıkıh UsulündeĢerî deliller arasındaki tearuzun manası, belli bir konu hakkında Ģerîbir delilin belirli bir hükmü gerektirmesi ve aynı meselede baĢka bir delilin baĢka bir hükmü gerekli kılmasıyla delillerin çatıĢması anlamında kullanılır. Delillerin kuvvet dereceleri ve elde ediliĢ biçimleri konusu ise bu alanın tercîh boyutunu oluĢturmaktadır. Ayrıca sadece kuvvet bakımından birbirine eĢit bulunan deliller arasında teâruzun olabileceğinin de unutulmaması gerekir. Biz de“Zerkeşî ve Şevkânî'ye Göre Teâruz ve Tercîh”adı altına söz konusu her iki usulcünün görüĢlerini çok titiz ve objektif bir Ģekilde ele almaya çalıĢarak ilgili alanda müstakil bir çalıĢma ortaya koymak istedik. Bu minvalde birinci bölümde üzerinde sıklıkla durmaya çalıĢtığımız konu baĢlıklarını Ģöyle sıralayabiliriz: ZerkeĢî, ismi, nesebi, künyesi ve lakabı, doğumu,hayatı ve ilmi serüveni, meĢhur hocaları, meĢhur talebeleri, ilmi kiĢiliğ, itikadî ve amelî mezhebi, eserleri ve vefatı, içinde bulunduğu ve yetiĢtiği ortam, aynı Ģekilde ġevkânî, ismi ve nesebi, doğumu,hayatı ve ilmi serüveni, meĢhur hocaları, meĢhur talebeleri, ilmi kiĢiliği, itikadî ve amelî mezhebi, eserleri ve vefatı, içinde bulunduğu ve yetiĢtiği ortamın yanı sıra, Osmanlı Devleti, Safevî Devleti, Mısır‟daki Mehmed Ali PaĢa Devleti, Necd‟deki Suudi Devleti, Hicaz‟daki EĢraf Devleti, Yemen‟deki Kasimiye Devleti. Ġkinci bölümde“teâruz ve tercîh mefhumlarını,teâruzun sözlük ve terim anlamı ve aralarındaki iliĢki, teâruz ile teâdul arasındaki fark, teâruz ile tenâkuz arasındaki fark, tercîhin sözlük ve terim anlamı, dilciler ve usulcülere göre tercîh, usulcülere göre teâruzu giderme yolları ve tercîh, cumhurun teâruz hakkındaki görüĢü, kat‚î deliller arasında teâruzun caiz olamayacağı görüĢünü savunanlar, usulcülere göre teâruzu giderme metodu, usulcülerin çoğunluğunun benimsediği yol, Hanefi usulcülerinkâhir ekseriyetinin benimsediği yol, bazı Hanefilerin farklı yaklaĢımları, ZerkeĢî ve ġevkânî‟nin görüĢü”Ģeklinde bazı baĢlıklar altında konuyu değerlendirmeye çalıĢtık. Üçüncü bölümde ise ZerkeĢî ve ġevkânî‟nin bakıĢ açılarıyla teâruz ve tercîhi,teâruzun Ģartlarını,teâruzunçeĢitlerini, teâruzun yeri ve zamanını, belli bir meselede müçtehidin iki farklı görüĢünü, tercîhin tanımını,ZerkeĢîve ġevkânî‟ye göre bazı Ģartlarını, rivayetlerdeki farklılıkların sebebi ve arka planını, isnat açısından 5 tercîhi, râvî‟nin durumuna göre tercîhi, rivâyetin zamanına göre tercîhi, rivâyetin keyfiyetine göre tercîhi, haberin vurûd vakti sebebine göre tercîhi, metin açısından tercîhi, lafız itibariyle tercîhi, medlûl/mana itibariyle tercîhi, dıĢ etkenler sebebiyletercîhi, metin cihetiyle tercîhi, kıyasa göre tercîhi, illete dayalı tercîhi anlatarak araĢtırmada öne çıkan sonuçlar üzerinde durmaya çalıĢtık. Netice olarak baĢlangıçtan itibaren fıkhî meseleleri çözüme bağlarken dayanılacak iki ana kaynağın Kur‟ân-ı Kerîm ile Hz. Peygamber‟in sünneti olduğu hususunda herhangi bir görüĢ ayrılığı bulunmayan söz konusu usulcülerdenġevkânî‟nin duruĢunu, fıkıh anlayıĢını belirleyen prensipler nasların zâhirine bağlılık, sahih senedliâhâd hadisi âyete denk bir delil değerinde sayma, ictihadın sürekliliğini ve taklidin reddini esas alma ve mezheplere karĢı çıkma Ģeklinde özetleyebiliriz. ZerkeĢi‟yi ise Ġmam ġâfiî‟nin görüĢlerine öncelik vermekle birlikte gerek farklı düĢünen ġâfiîusulcülerinin gerekse diğer mezhep mensubu muhalif usulcülerin görüĢlerini de gerekçeleriyle birlikte veren ve eleĢtirel bir bakıĢ açısıyla bunlara iliĢkin değerlendirmelerde bulunan birisi olarak aktarabiliriz."
