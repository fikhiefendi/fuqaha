abstract: "Bu tez, İstanbul kadı sicillerinde yer alan para vakfı kayıtlarını inceleyerek Osmanlı Devleti'nde para vakıflarının kuruluş, işletme ve uygulama biçimlerini ortaya koymayı amaçlamaktadır. Çalışmada, İSAM'ın İstanbul Kadı Sicilleri Projesi ile İBB Kültür A.Ş. ve Medipol Üniversitesi Hukuk Fakültesi iş birliğiyle yayımlanan toplam yüz ciltlik transkripsiyonlu sicil defteri taranmış; XVI. ve XVII. yüzyıllara ait 741 para vakfı kaydı tespit edilerek içerik ve hukukî mahiyetlerine göre altmış başlık altında sistematik biçimde tasnif edilmiştir. Araştırma, para vakıflarını klasik fıkıh literatüründeki teorik ve mezhepsel tartışmalar yerine, mahkeme kayıtlarına yansıyan fiilî uygulamalar üzerinden ele almaktadır. Tez dört bölümden oluşmaktadır. Birinci bölüm para vakıflarının kuruluşunu, hukukî tescilini ve türlerini; ikinci bölüm vakıf sermayesinin bey' bi'l-vefâ, bey' bi'l-istiğlâl ve tecdîd-i muâmele gibi usullerle işletilmesini ve kredi uygulamalarını; üçüncü bölüm tereke, aile ve sosyal koruma bağlamında vakıf alacaklarını; dördüncü bölüm ise vakıf idaresini, denetim mekanizmalarını ve hukukî ihtilafları incelemektedir. Bulgular, para vakıflarının belirli hukukî usullere bağlı, mahkeme denetimi altında faaliyet gösteren kurumsal yapılar olduğunu; nakit vakfının meşruiyetine dair fıkhî tartışmaların Osmanlı yargı pratiğinde büyük ölçüde çözüme kavuştuğunu göstermektedir. Vakıf kurucuları arasında hânedan mensupları, ulema, esnaf, kadınlar ve gayrimüslimler yer almış; vakıflar borç verme işlevinin yanı sıra eğitim, ibadet ve yetim mallarının korunması gibi sosyal hizmetler de sunmuştur. Sonuç olarak para vakıfları, Osmanlı toplumunda hukukî güvenceye sahip, toplumsal dayanışmayı destekleyen köklü kurumlar olarak faaliyet göstermiştir."
