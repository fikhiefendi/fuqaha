abstract: "Bu tez çalışması, İslami Sukuk (İslami Tahvil ve Bonoları) ile ilgili olup, beş bölümden oluşmaktadır. Birinci bölümde konu ile ilgili önceki çalışmalara yer verilmiştir. İkinci bölümde İslami bonolar, üçüncü bölümde İslami Bankacılık ve İslami Sukuk konusumda ayrıntılı bilgiler verilmiştir. Dördüncü bölümde Borsa İstanbul (BİST) ve Dubai uygulaması farklılıları ve benzerlikleri ortaya konulmuştur. Sonuç bölümünde ise BİST'in ve Dubai Borsasının genel bir değerlendirilmesi yapılıp, öneriler getirilmiştir. Tezde sukuk kavramı ve çeşitlei ayrıntılı bir şekilde açıklandıktan sonra, İslami bankacılık ve İslami bono geniş bir şekilde ele alınmıştır. Tezin esas bölüminü oluşturan dördüncü bölümde ise, Borsa İstanbul İle Dubai Borsası arasındaki farkları; BİST'in kullandığı raporlar, istatistikleri ve mali programları konulu çalışmaları analiz edilmiştir. Bunun yanında veri analizlerine, İslami bono ve tahviller üzerine yapılan çalışmalara, araştırmalardan ulaşılan sonuçlara da değinilmiştir. Türkiye, Dubai ve diğer Ortadoğu ülkelerine öneriler getirilmiştir. Tezde özellikle Türkiye'deki sukuk kullanma şekline ağırlıkla değinilmiştir. Çalışmada BİST ve Dubai borsası arasında önemli farlıklıkların olduğu tesbit edilmiştir."
