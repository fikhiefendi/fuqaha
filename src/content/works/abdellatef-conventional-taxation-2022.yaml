abstract: "Vergilendirme, konvansiyonel anlayışta refah ve gelir ve servetin yeniden dağılımını elde etmeyi amaçlayan herhangi bir modern ekonominin ayrılmaz bir parçasıdır. İslam'daki vergi teorisinde, zekât, geleneksel vergilendirmenin aynı amacını gerçekleştirme ve vergilerin yerine getiremeyeceği eksik adaleti, ahlaki ve manevi bir boyutla, düzeltmeye sahip benzersiz bir aracıdır. UNCHR'nın insani yardım bütçesinin neredeyse tamamını karşılayabilecek resmi bir mülteci zekât fonu oluşturması, zekâtın potansiyel ekonomik gücünü göstermektedir. Tez, geleneksel ve İslami vergilendirmenin temel özelliklerini eleştirel bir şekilde karşılaştırmaktadır. Bazı benzerlikler paylaşsalar, çalışmada da zekâtın kavramı, yaptırımı ve amaçları bakımından vergilerden ayıran bir“Girdi-Çıktı”zekât modeli sergilenmektedir. Aynı zamanda tez, zekât'ın Türkiye'deki olası uygulama zorluklarına ilişkin ampirik kanıtlarla mevcut literatüre katkıda bulunmaktadır. 142 Türk vatandaşının cevaplarını analiz ettikten sonra, sonuçlar, mevcut katılımcıların zekât ödememeye yönelik davranışlarının başlıca sebeplerinin dini farkındalık ve kanun uygulama eksikliği olduğunu ortaya koymaktadır. Ayrıca, çalışma Türkiye'de Zekât toplayan ve dağıtan özel kurumlara duyulan güven eksikliğini, zekât fonlarının yanlış tahsis edilmesi ihtimaline işaret ederek, Türkiye'de zekât tahsilatının potansiyelinin altında olmasının olası bir nedeni olarak tanımlamaktadır. Sonuçlar, katılımcıların zekât ödemelerini toplamak ve dağıtmak için güvenmeye istekli oldukları kurumları da belirler. Son olarak, tez, zekât ödemesini Türkiye'de daha iyi bir konuma getirerek, politika yapıcılara bu sorunları ele almada yardımcı olabilecek tavsiyeler sunmaktadır."
