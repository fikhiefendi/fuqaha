abstract: "İslâm fıkıh mezheplerinin ilk kaynağı olan Kur'ân-ı Kerim, sahih kıraatların bütünüdür. Bundan dolayı fıkhî mezhepler kıraatlar ile ihticacda bulunmuştur. Kıraatları fıkhî istinbatta ihticac edenler arasında Câmiu'l-Beyân sâhibi büyük müfessir ve fakih olan Taberî (ö.310/923) ile Ahkâmü'l-Kur'ân sâhibi büyük müfessir ve fakih olan Cessâs (ö.370/981) bulunmaktadır. \"Ahkâm Âyetleri Bağlamında Fıkıh-Kıraat İlişkisi: Taberî ve Cessâs Örneği\" isimli bu çalışma, Taberî ile Cessâs'ın kıraatlara bakış açılarını ve ahkâm âyetlerinde kıraatlar ile fıkhî istinbât metodlarını tespit etmeye yöneliktir. Bu çalışma giriş ve üç bölümden oluşmaktadır. Çalışmanın ilk bölümünde Taberî ve Cessâs'ın hayatı hakkında kısa bilgi verilmiştir. Çalışmanın ikinci bölümünde Taberî ve Cessâs'ın tefsirlerinde naklettikleri kıraatlar üzerinden kıraat anlayışları ortaya konulmuştur. Bu bağlamda Taberî ve Cessâs'ın kıraatları kimlerden naklettikleri, kıraatları tasnifleri ve kıraatları tercih yöntemleri ortaya konulmuştur. Üçüncü bölümde ise kıraat anlayışlarının ahkâm âyetlerinde fıkhî istinbâtlara etkisi mukâyeseli olarak tespit edilmeye çalışılmıştır. Tespit edilen altmış küsür örnek ile Taberî ve Cessâs'ın fıkıh-kıraat ilişkisi mukâyeseli olarak izah edilmiştir."
