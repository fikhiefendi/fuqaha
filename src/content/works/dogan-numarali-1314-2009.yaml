abstract: "Tezimizin konusu 13 Numaralı Çorum Şer'iyye Sicilinin Transkripsiyon ve Değerlendirmesidir. İncelediğimiz bölüm H.1314 (M.1896) yılına ait kayıtları ihtiva etmektedir. Bu bölüm 70 sayfadan ibaret olup içerisinde 132 belge bulunmaktadır. Bu sicil Çorum'a ait diğer Şer'iyye Sicilleriyle birlikte Ankara Milli Kütüphanesinde muhafaza edilmektedir.Tez; önsöz, kısaltmalar, giriş, üç bölüm ve sonuçtan oluşmaktadır. Tezimizin sonuna kaynakça ve ekler kısmı ilave edilmiştir.Giriş kısmında kadılık müessesesi ve şer'i mahkemelere değinilmiştir.Ayrıca Osmanlı Şer'iyye Sicillerinin tarihi önemi, Çorum Şer'iyye Sicilleri ve incelenen sicil hakkında bilgi verilmiştir.I. Bölümde belgeler konularına ve türlerine göre tasnif edilerek belge özetleri verilmiştir.II. Bölümde 13 numaralı H.1314 (M.1896) Çorum Şer'iyye Sicilinin Transkripsiyonu yapılmıştır.III. Bölümde Şer'iyye Sicilindeki kayıtların değerlendirilmesi yapılmıştır. Burada idari yapı; Çorum'a bağlı kaza ve nahiyeler, köyler, mahalleler, sosyal durum; aile, evlilik, şahıs isimleri, lakap ve ünvanlar ve Çorum'un iktisadi yapısı incelenmiştir.Tezimizin sonunda kısa bir değerlendirme ile sonuç, kaynakça ve belgelerden örnekler sunulmuştur."
