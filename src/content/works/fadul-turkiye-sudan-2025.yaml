abstract: "Bu çalışmanın temel amacı, Türkiye ve Sudan'daki İslami Bankaların finansal performanslarının karşılaştırmalı analizini kapsamakta olup, ayrıca İslami Bankaların kârlılığını etkileyen faktörlerin belirlenmesi de amaçlanmıştır. Çalışmada Türkiye ve Sudan'daki İslami Bankaların 2015-2023 dönemine ait yıllık finansal verileri kullanılmıştır. Çalışmanın analizinde elde edilen sonuçları güçlendirmek amacıyla üç farklı yöntem kullanılmıştır. Bu yöntemler, finansal oran analizi, veri zarflama analizi ve panel veri analizidir. Finansal oran analizinde kârlılık, likidite, risk ve ödeme gücü oranları kullanılmıştır. Veri zarflama analizinde, girdi değişkenleri olarak toplam aktifler, özkaynaklar ve toplanan fonlar, çıktı değişkenleri olarak ise dönem net kârı ve kullandırılan fonlar kullanılmıştır. Panel veri analizinde ise bağımsız değişkenler olarak kaldıraç oranı, sermaye yeterliliği ve kullandırılan fonlar/toplam aktifler oranı bağımlı değişkenler olarak da aktif kârlılık oranı ve özkaynak kârlılık oranı kullanılmıştır. Oran analizinde, Sudan'ın en yüksek aktif ve özsermaye kârlılığına, Türkiye'nin ise en yüksek kâr-gider oranına sahip olduğu tespit edilmiştir. Türkiye en yüksek nakit mevduat oranına, Sudan ise en yüksek nakit aktif oranına sahiptir. Kredi-mevduat oranı Türkiye'de dalgalı, Sudan'da istikrarlıdır. Sudan, en yüksek borç-özsermaye ve borç oranına sahiptir. Mevduat-kredi oranı Türkiye'de dalgalı, Sudan'da ise daha stabildir. VZA sonucunda; etkinlik değerlerine göre, Türkiye ve Sudan'daki İslami bankalar tüm yıllarda tam etkinliğe ulaşamamış, ancak Türkiye 2023 yılında tam etkinlik göstermiştir. Verimlilik Sudan'da tüm yıllarda artış gözlemlenmiş, en yüksek değer 2023'te 1,034 olmuştur. Türkiye'de ise 2019 ve 2020 hariç diğer yıllarda artış yaşanmış, en yüksek seviye 2017'de 1,103 olarak kaydedilmiştir. Panel analizinin sonucuna göre, İslami bankaların aktif kârlılığı üzerinde kaldıraç oranı, sermaye yeterliliği ve kullandırılan fonlar/toplam aktifler oranı pozitif yönde etkili olmuştur. Özsermaye kârlılığı üzerinde de aynı değişkenlerin pozitif etkide bulunduğu tespit edilmiştir."
