abstract: "Günlük hayatta sıkça yapılan sözleşmelerden biri de alım-satım sözleşmesidir. Sözleşmelerin hukuka uygun olması insanların problemsiz olarak yaşamalarını sağlar. Çeşitli hukuk ekollerine ait bilgi edinilmesi insanların hukuksal düşüncelerinin gelişmesine yardım eder.Bu çalışmada Hanefî ve Şâfiî mezheplerinin alım-satım sözleşmesindeki ihtilafları anlatılmaktadır. Bu konuda bir çalışma bulunmadığı için bu eksikliği gidermek ve iki mezhep arasındaki ihtilaflı meseleler hakkında bilgi verilerek İslâm hukuku öğrenimi ve öğretimi için bu meseleler üzerine başkalarını kıyas etme olanağı sunmak amacı olan bu çalışma iki mezhebe ait klasik fıkıh kitapları ve hilâfiyyât kitapları incelenerek meydana getirilmiştir. İlk bölümde Hanefî ve Şâfiîlere göre alım-satım sözleşmesine dair genel nitelikte bilgi verilmiştir. İkinci bölümde ise İki mezhep arasındaki alım-satım sözleşmesindeki belli başlı 60 ihtilaflı mesele açıklanarak, ihtilafların kaynaklarından bahsedilmiştir. Sonuçta bu ihtilafların genel olarak, hadislerin ravilerini mezheplerin farklı değerlendirmesinden kaynaklanan ihtilaflar, iki mezhebin hadislerle amel etme şartlarının farklı olmasından kaynaklanan ihtilaflar, iki mezhebin hukuk metodolojilerinin farklılığından kaynaklanan ihtilaflar olduğu tespit edilmiştir."
