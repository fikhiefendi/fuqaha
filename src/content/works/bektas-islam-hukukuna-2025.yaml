abstract: "Tarih boyunca savaşlar, iç çatışmalar, ekonomik krizler ve siyasî baskılar gibi sebeplerle göçler yaşanmıştır. Son yıllarda da İslâm coğrafyasından Müslümanların hâkimiyetinde bulunmayan ülkelere yönelik göçler artmıştır. Bu göçler, yalnızca fiziki bir yer değişikliğini değil; Müslüman fert ve ailelerin inançlarını koruma, ibadetlerini yerine getirme, çocuklarına dinî eğitim verme ve kültürel kimliklerini muhafaza etme gibi alanlarda ciddi problemlerle karşılaşmalarını da beraberinde getirmektedir. Bunlardan bir kısmı göç edilen ülkelerde ibadet özgürlüğü, aile değerlerinin yaşatılması, İslâmî eğitime erişim ve kültürel asimilasyona direnme konularında yaşanan zorluklardır. Bunlar hem ferdî hem de içtimâî boyutları olan ve çözüm bekleyen fıkhî meselelerdir. Bu bağlamda, özellikle“fıkhu'l-ekalliyyât”yaklaşımı çerçevesinde geliştirilen çağdaş yorumlar öne çıkmaktadır. Taha Câbir el-Alvânîe gibi âlimlerin yaklaşımları ile Avrupa Fetva ve Araştırma Konseyi gibi kurumların çalışmaları, klasik fıkıh mirası ile günümüz şartları arasında köprü kurmaktadır. Klasik literatürdeki hicret ve seyahat hükümleri incelenerek, günümüz Müslümanlarının karşılaştığı fıkhî problemlere uygulanabilir çözüm yollarının değerlendirilmesi ve ilgili çağdaş yaklaşımlar ve çözüm önerileri sunulması çerçevesinde konuyla ilgili müstakil bir akademik çalışmaya ihtiyaç duyulmuş ve“İslâm Hukukunda Müslümanların Hâkimiyetinde Bulunmayan Ülkelere Hicret”başlıklı bu yüksek lisans tezinin hazırlanması uygun görülmüştür."
