abstract: "Kitlesel fonlama platformları, gelişen fintek (finansal teknoloji) sistemi ile birlikte mevcut geleneksel yöntemlere alternatif olarak yenilikçi bir finansman hizmeti sunmaktadır. Bu platformlar girişimcileri, şirketleri ve yatırımcıları bir araya getirerek projelerini gerçekleştirme imkânı sağlamaktadır. Bu bağlamda, İslami finansa uygun kitlesel fonlama platformlarının oluşturulması; sosyal girişimciliğin, yenilikçi fikirlerin ve işletmelerin desteklenmesi açısından önem taşımaktadır. Bu çalışmada, kitle fonlamasının işleyişine ve mevcut İslami kitlesel fonlama platformlarının incelenmesine yer verilerek Türkiye'deki kitle fonlaması kurumlarının İslami finans açısından değerlendirilmesi yapılmış ve İslami kitle fonlaması ekosisteminin geliştirilmesi için öneriler sunulması amaçlanmıştır. Çalışma hem nicel hem de nitel veriler kullanılarak ele alındığı için yöntem olarak karma araştırma yöntemi belirlenmiştir. Araştırmanın nitel boyutunda, mevcut uygulamaların uygunluğunu değerlendirmek ve İslami finansa uyumlu platformlar için görüşlerini almak amacıyla bu alanda uzman kişiler ile mülakatlar gerçekleştirilmiştir. Nicel boyutunda ise, Türkiye'de fonlanan paya dayalı kitle fonlaması projelerinin TKBB ve AAOIFI standartları kapsamında analiz edilerek, fonlanan projelerin kriterler açısından uyumluluğunun incelenmesi hedeflenmiştir. Araştırma sonucunda, toplanan veriler ile araştırma sorularına yönelik öneriler geliştirilerek değerlendirmelerde bulunulmuştur. Bulgularda; İslami finansa uyumlu kitle fonlaması platformları için denetim ve yönetişim mekanizması önerileri sunulmuş ve platformların sorunları değerlendirilmiştir. Kitle fonlaması projelerinin İslami finansa uyumluluklarının incelenmesi noktasında; mevcut standartların tüm aşamalar için yeterli olmadığı ve projelerin finansal göstergelerinin kitle fonlamasına özel kriterler kapsamında değerlendirilmesi gerektiği sonucuna varılmıştır."
