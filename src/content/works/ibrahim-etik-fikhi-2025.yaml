abstract: "Bu çalışma kadın infertilitesinde bir çözüm ve tedavi olarak uygulanan yardımcı üreme tekniklerinden oosit donasyonunun doğurduğu etik ve hukukî problemleri ortaya koyarak donasyonun İslâm hukuku açısından değerlendirilmesini amaçlamaktadır. Çalışmada donasyonun doğurduğu nesep problemi teorik olarak incelenmiş, uygulamanın yasal olduğu ülkelerden Kuzey Kıbrıs Türk Cumhuriyeti esas alınarak pratik uygulama ortaya konmuştur. İslâm hukuku insan neslinin muhafazasını öncelikli gayeleri arasında belirlemiş ve nesebin sahih nikâh bağıyla birbirine bağlı olan eşlere bağlanmasını istemiştir. Aile kurumu içerisinde gerçekleşmesi beklenen ve istenen üremeye üçüncü tarafların dahil olması, söz konusu tarafların tamamı için pek çok hakkın ihlal edilmesine ve kaybolmasına yol açmaktadır. Bu durum, donasyonun tam olmamakla birlikte zina unsuru taşıdığını ve doğan bebeğin nesebini şüpheli hale getirdiğini göstermektedir."
