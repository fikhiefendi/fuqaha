abstract: "Bu tez, İslâm kültüründe önemli bir yere sahip olan mübarek gün ve gecelere dair rivayetlerin mevzûât edebiyatındaki görünümünü ve bu rivayetlerin sahih hadis kaynaklarıyla ilişkisini incelemektedir. Ramazan ayı, Kadir gecesi, Şâban ve Berat gecesi, Cuma günü, Mi'râc, Mevlid, Pazartesi-Perşembe günleri, Muharrem ve Âşûrâ gibi zaman dilimlerine ilişkin rivayetlerin ele alınması, halk arasında yaygınlık kazanan bazı dinî anlatıların hadis ilmi açısından değerlendirilmesi bakımından önem taşımaktadır. Araştırmanın amacı, mevzûât literatüründe mübarek gün ve geceler etrafında zikredilen rivayetlerin ortak tema ve anlatım özelliklerini belirlemek, bu rivayetleri temel hadis kaynaklarındaki bilgilerle karşılaştırmak ve aralarındaki benzerlik ya da farklılıkları ortaya koymaktır. Bu doğrultuda çalışmada nitel araştırma yöntemi benimsenmiş; doküman incelemesi, betimleyici analiz ve karşılaştırmalı değerlendirme yöntemlerinden yararlanılmıştır. Araştırma sonucunda, mübarek gün ve gecelere dair mevzû rivayetlerde fazilet, sevap, bağışlanma, özel namaz, belirli rekât ve sûre sayıları ile kesin mükâfat vaatlerinin öne çıktığı görülmüştür. Sahih hadis kaynaklarında ise bu zamanlara ilişkin rivayetlerin daha ölçülü ve genel ibadet ilkeleriyle uyumlu bir çerçevede yer aldığı tespit edilmiştir. Bu durum, mübarek zamanlara yönelik dinî duyarlılığın sahih rivayetlerle desteklenen bir yönü bulunmakla birlikte, mevzûât literatüründe zaman zaman abartılı ve problemli rivayetlerle genişletildiğini göstermektedir."
