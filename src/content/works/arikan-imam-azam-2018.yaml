abstract: "Son dönem Osmanlı Âlimlerinden olan Mehmed Emîn el-Üsküdarî'nin Ebû Hanîfe'nin el-Fıkhu'l-ekber isimli eserine yazmış olduğu Şerhu'l Fıkhi'l-ekber isimli şerhini ele aldığımız bu çalışma, bir giriş, üç bölüm, sonuç ve ekler kısmından oluşmaktadır. Kelâm ilminin oluşum sürecinde yazılmış olan el-Fıkhu'l-ekber isimli risâleye şerh olması münasebetiyle Giriş kısmında kelâm ilminin oluşum sürecine ve şerhlerin kısaca tanıtımına yer verdik. Birinci bölümde Ebû Hanîfe'nin hayatı, ilmi kişiliği ve el-Fıkhu'l-ekber isimli eserin tanıtımına; ikinci bölümde Mehmed Emîn el-Üsküdarî'nin tanıtımı ve eserlerine; üçüncü bölümde ise Şerhu'l-Fıkhu'l-ekber'in latinizesi ve değerlendirmesine yer verdik. Sonuç kısmında ise genel bir değerlendirme yapılmıştır."
