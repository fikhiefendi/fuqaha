abstract: "Bu çalışmada Tahâvî'nin hadislere yaklaşım konusunda Cessâs'a etkisi Şerhu Meâni'l-âsâr ve Şerhu Muhtasari't-Tahâvî isimli eserler özelinde tespit edilmeye çalışılmıştır. Çalışma giriş dışında iki bölümden oluşmaktadır. Birinci bölümde çalışmaya zemin oluşturması amacıyla müelliflerin hayatları, hadis ve sünnet anlayışları ve araştırma konusu eserler genel hatlarıyla tasvir edilmiştir. İkinci bölümde ise hadislere yaklaşımı konusunda Tahâvî'nin Cessâs'a etkisi, örneklem olarak seçilen eserler bağlamında sened, metin ve muhtevâ açısından olmak üzere üç başlık altında incelenmiştir. Sened başlığında müelliflerin isnad değerlendirmeleri, kullandıkları rivayet lafızları ve râvilerin cerh-taʽdil durumları tahlil edilmiş, birbirleriyle örtüşen yönler tespit edilmiştir. Metin başlığının birinci kısmında Cessâs'ın Tahâvî'den naklettiğini belirttiği rivayetlerin Tahâvî'nin Şerhu Meâni'l-âsâr'ında bulunduğu tespit edilerek mezkûr rivayetler arasında sened ve metin açısından farklılık olup olmadığı irdelenmiştir. İkinci kısımda öncelikle Cessâs'ın şerhinde delil olarak kullandığı muallak hadislerin bir kısmını Tahâvî'nin Şerhu Meâni'l-âsâr'ından iktibâs ettiği kanaati ve bu kanaatin oluşmasındaki etkenler üzerinde durulmuştur. Konu detaylı bir şekilde tartışılıp temellendirildikten sonra Cessâs'ın Tahâvî'den naklettiği tahmin edilen rivayetler aktarılarak mukayese edilmiştir. Üçüncü kısımda, Cessâs'ın senedini tam verdiği rivayetlerin Şerhu Meâni'l-âsâr'daki rivayetlerle benzerliği sened ve metin açısından incelenmiştir. Muhtevâ açısından başlığında ise her iki âlimin aynı hadis üzerine yaptıkları yorumlar incelenerek etkileşimin varlığı tespit edilmeye çalışılmıştır. Bu bağlamda tespit edilen benzerliklerden hareketle hadislere yaklaşım konusunda Cessâs'ın Tahâvi'den önemli ölçüde etkilendiği sonucuna ulaşılmıştır."
