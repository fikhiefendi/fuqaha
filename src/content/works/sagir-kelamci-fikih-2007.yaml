abstract: "Tezimizin konusu, Kelamcı Fıkıh Usulcülerinin Nesih Anlayısıdır. Kelamcı Fıkıh Usulcülerinin, nesih anlayısını ortaya koymaya çalıstıgımız tezimiz, bir giris ve üç bölümden olusmaktadır. Giriste; tezin konusu, tezin amacı, tezin sınırlandırılması, tezin yöntemi ve tezin bölümleri hakkında bilgiler verilmistir. Birinci bölümde; neshin kelime ve ıstılahî anlamı, nesih ile tahsisin iliskisi, nesih ile bedâ iliskisi, neshin cevâzı, neshin vuku bulması, neshin rükünleri ve sartları ele alınarak nesih kavramı ve mahiyetinin ne oldugu ortaya konmaya çalısılmıstır. kinci bölüm ise; iki ana baslıktan olusmaktadır. Birinci ana baslık, deliller arası nesih iliskisidir. Bu ana baslık altında, âyetin bir baska âyetin hükmünü neshetmesi; sünnet ile âyetin hükmünün neshedilmesi; âyet ile sünnetin hükmünün neshedilmesi; sünnet ile sünnetin neshedilmesi; haber-i vahid ile mütevatir nassın hükmünün neshedilmesi; icma ile neshin gerçeklesmesinin mümkün olup olmadıgı; nassa kıyas ile sabit olmus hükmün nesih edilmesi ve sahabe sözü ile neshin gerçeklesmesinin mümkün olup olmadıgı ele alınmıstır. kinci ana baslıkta ise, Kur'an âyetlerinin nesih açısından tasnifi yapılmıstır. Bu ikinci ana baslık altında ise; hükmü mensuh tilaveti baki olan âyetler; hükmü baki tilaveti mensuh olan âyetler; hem tilaveti hem de hükmü mensuh olan âyetler konuları ele alınmıstır. Üçüncü bölüm ise, nesih ile ilgili konulardan olusmaktadır. Bu ana baslık altında, neshe konu olan hükümler; haber-i cümlelerin neshi, ebed lafzı ile mukayyed hükmün neshi; nass üzerine ziyadenin nesih olup olmadıgı; ibadetin bir cüzünün neshe konu olması; neshin tarihinin tespiti; hükmün nesih haberi kendisine ulasmamıs kimsenin nesih karsısındaki konumu alt baslıkları yer almaktadır."
