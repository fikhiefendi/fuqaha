abstract: "Bu tezin amacı, gabin ( aşırı yararlanma) kavramını hem Türk Borçlar Hukuku açısından, hem de İslam Hukuku açısından incelemek, iki hukuk sisteminin gabinle ilgili hükümlerine yer vermek, gabinle ilgili verdikleri hükümler itibariyla birbirne benzeyen ve birbirinden ayrışan hükümlerini tespit etmektir. Gabin müessesesi aliş-verişlerde aldanmayı önlemek ve insanların karşılıklı muamelelerinde mağbunun içinde bulunduğu durumun istismar edilmesini engellemek amacı taşımaktadır. İslâm hukukunda gabin denince“bedeller arasindaki oransızlık”anlaşılmaktadır. bu oransızlık Türk Borçlar Hukukunda da nerdeyse aynı manadadır. Gabin, objektif ve sübjektif unsurların varlığıyla meydana gelir.“objektif unsur”iki hukuk sisteminde de hemen hemen aynı iken“sübjektif unsur”telakkisi farklıdır. Türk Borçlar Hukukunda“sübjektif unsur; hiffet, müzayeka, tecrübesizlik ve bu hallerin istismarı”olarak kabul edilirken, İslam Hukukunda“tağrîr (aldatma)”“sübjektif unsur”olarak kabul edilmiştir. Gabinin sonuçları da iki hukuk sistemi arasındaki farklılıklardan biridir. Türk borçlar hukukunun bu noktada kapsamı daha geniştir. Tezimiz dört bölümden oluşmaktadır. Birinci bölümde gabin kavramı, tarihi gelişimi, hukukî niteliği ve çeşitli hukuk sistemlerinde gabine yapilan tanımlardan bahsettik. İkinci bölümde gabinin dayandiği esas ve gabinin unsurlarını İslam Hukuku ve türk – isviçre borçlar hukuku karşilaştirilarak inceledik.Üçüncü bölümde, İslâm Hukukçularının gabinle birlikte mutlaka tağrir (aldatma) fiilinin olmasını şart koşmaları münasebetiyle aldatma konusunu ele aldık.Dördüncü bölümde ise gabn-i yesir ve gabn-i fahişin akitlere tesirinin ve gabnin hukuki sonucuyla ilgili olarak mezheplerin görüşlerine yer verdiK."
