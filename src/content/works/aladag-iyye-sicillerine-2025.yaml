abstract: "Bu çalışma, 1839-1917 yılları arasındaki Osmanlı şer'iyye sicillerine dayanarak Osmanlı toplumunda evlilik, nikâh ve mehir uygulamalarını incelemektedir. Tanzimat Fermanı ile başlayan modernleşme süreci, toplumsal hayatın pek çok alanında olduğu gibi aile yapısı ve evlilik kurumunda da önemli değişimlere yol açmıştır. Bu bağlamda, şer'iyye sicilleri hem dönemin hukuki düzenlemelerini hem de günlük yaşamdaki evliliği yansıtan birincil kaynaklar olarak değerlendirilmiştir. Bir evliliğin geçerli sayılabilmesi için nikâhın kıyılması gerekir. İslam hukukuna göre nikâh, erkek ve kadının hayatlarını birleştirmek amacıyla yaptıkları dinî ve hukukî bir sözleşmedir. Bu sözleşme ile evlilik, belirlenen kurallar çerçevesinde geçerlilik kazanır. İslam dini, nikâhı teşvik etmiş; evlilik dışı ilişkileri yasaklayarak neslin korunmasını, toplum düzeninin sağlanmasını ve ahlaki değerlerin sürdürülmesini hedeflemiştir. Nikâh, yalnızca iki bireyin bir araya gelmesi değil, aynı zamanda taraflara birtakım hukuki ve ahlaki sorumluluklar yükleyen bir akittir. Bu sorumluluklardan biri de erkeğin kadına vermekle yükümlü olduğu mehirdir. Mehir, evlilikte kadına ekonomik güvence sağlayan ve onun toplumsal konumunu güçlendiren önemli bir haktır. Araştırmada, farklı şehirlerden (Antalya, Bursa, Malatya ve Urfa) seçilen şer'iyye sicilleri incelenmiş; bu kayıtlarda evliliklerin gerçekleştirilme biçimi, nikâhın uygulanışı ve mehir miktarlarının sosyal kesimlere göre değişimi değerlendirilmiştir. Elde edilen bulgular, Tanzimat'tan sonra evlilikte hem geleneksel İslami kuralların devam ettiğini hem de modern hukuk düzenlemelerinin etkisinin arttığını göstermektedir. 1839-1917 yılları arasındaki şer'iyye sicilleri Osmanlı'da evliliğin yalnızca bir dini akit değil, aynı zamanda sosyal, ekonomik ve hukuki bir kurum olduğunu ortaya koymaktadır. Bu çalışma, Osmanlı aile yapısının dönüşümünü anlamada önemli bir katkı sunmayı amaçlamaktadır."
