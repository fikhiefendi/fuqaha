abstract: "Bu çalışma, Hanbeli mezhebinin tarih içinde belirmesini sağlayan sosyal-siysal faktörleri, mezhebin doğuş ve gelişim seyrini ortaya koymayı amaçlamaktadır. İslam düşünce tarihini önemli ölçüde etkileyen Hanbeli mezhebi, İslam tarihinin ilk dönemlerinde ortaya çıkmış, günümüze kadar da varlığını devam ettirmiştir. Mihne hadiselerinin etkisiyle ön plana çıkan Ahmed b. Hanbel'in etrafında oluşan Hanbelilik, ortaya çıkış süreci itibariyle itikadi bir mezheptir. Bu itikadi yapı, etkisini bugün de sürdürmektedir. Ahmed b. Hanbel'in vefatıyla birlikte onun talebelerinin ve arkadaşlarının ona ait rivayetleri bir araya getirme çabaları, Hanbeli mezhebine ait literatürün oluşmasını sağlamıştır. Bu faaliyetler, daha sonraki nesiller tarafından sürdürülmüş, hicri dördüncü asrın başlarından itibaren Hanbelilik, teşekkülünü tamamlamış bir ekol görünümü kazanmıştır. Büveyhilerin Bağdat'ı ele geçirmeleriyle birlikte Hanbeliler bir taraftan ilmi faaliyetlerini sürdürmüş diğer taraftan sosyal hayatta daha da görünür hale gelmişlerdir. Bu süreçten itibaren Hanbeliler, Büveyhilere ve onların Şii yanlısı politikalarına karşı çıkmışlardır. Bu tavır, Hanbelilerle Abbasi halifeleri arasında bir yakınlaşma oluşturmuş, Hanbelilerle Hilafet'in ortak bir politika geliştirmesini sağlamıştır. Hanbelilerle Abbasi halifeleri arasındaki bu ortak siyasi tavır, Hanbeliliğin bir“devlet mezhebi”ne dönüşmesiyle sonuçlanmıştır. Bu durum, mezhebin gelişiminde de önemli derecede etkili olmuştur."
