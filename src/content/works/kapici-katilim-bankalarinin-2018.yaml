abstract: "İslam hukukunda satım akdinde malın kabzı üzerinde özellikle durulmuş ve müşterinin satın aldığı malı kabzetmeden önce satması konusunda birtakım sınırlamalar getirilmiştir. Doktrinde tartışılan kabz konusu ve malın kabzdan önce satımı meselesi, günümüzdeki katılım bankacılığı işlemleri çerçevesinde önem arz etmektedir. Uygulamada, katılım bankalarının fıkıh doktrininde öngörülen şekil ve şartlara aykırılık taşıyan birtakım işlemleri olduğu görülmektedir. Katılım bankalarının, kredi vermek amacıyla sıkça başvurduğu murabaha uygulamasında malı fiilen teslim almadan ve fatura, tapu gibi belgeleri kendi adına düzenletmeden müşteriye satması da bu aykırılıklar arasında yer almaktadır. Katılım bankalarının depolama, nakliye ve vergi gibi masrafları azaltarak kâr oranlarını artırmak amacıyla başvurduğu söz konusu uygulamalar, bazı alimler tarafından İslam'da satım akdinin gereklerinden olan kabz unsurunu ihlal ettiği ve bankayı, diğer bankalar gibi sıradan bir finansör durumuna getirdiği gerekçesiyle eleştirilmiştir. Bu eleştiriler çerçevesinde bu çalışmada gayrimenkul ve menkul mallarda teslimin ne ile gerçekleşeceği, bankanın teslim için müşterisine vekalet vermesinin caiz olup olmadığı, tapu ve ruhsat gibi kayıtların kabz yerine geçip geçmediği, kabzedilmeyen mal üzerinde ne gibi tasarruflar yapılabileceği sorularına cevap aranmıştır. Ayrıca söz konusu probleme alternatif bir çözüm önerisi mahiyetinde olan bağlı kredi sözleşmesine değinilmiştir."
