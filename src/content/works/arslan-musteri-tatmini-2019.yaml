abstract: "Bu araştırmanın amacı Antalya'da faaliyet göstermekte olan helal turizm konseptli turizm işletmelerini ziyaret eden otel müşterilerinin tatmin düzeyleri ile fiyat duyarlılığı arasındaki ilişkinin incelenmesidir. Araştırmanın örneklemini Antalya ilinde faaliyet yürüten helal turizm konseptli turizm işletmelerini ziyaret eden otel müşterileri oluşturmaktadır. Araştırmada veri toplamak için anket formu kullanılmıştır. Anket formları 2018 Haziran-2019 Haziran ayları arasında otel müşterileri tarafından doldurulmuştur. Anket formları katılımcılarla yüz yüze görüşülerek doldurtulmuştur. Araştırmada kullanılan müşteri tatmini ve fiyat duyarlılığı ölçekleri geçerlilik, güvenilirlik ve normallik testlerine tabi tutulmuştur. Araştırma sonuçları incelendiğinde, müşteri tatmininin alt boyutu olan sosyal tatmin değişkeninin fiyat duyarlılığına olumsuz yönde anlamlı bir etkisinin olduğu bulgulanmıştır. Diğer yandan müşteri tatmininin alt boyutu olan ekonomik tatmin değişkeninin fiyat duyarlılığına olumsuz yönde anlamlı bir etkisinin olmadığı sonucuna ulaşılmıştır. Ayrıca araştırmanın amacı doğrultusunda ekonomik ve sosyal tatmin ile fiyat duyarlılığı arasındaki ilişkide cinsiyet faktörünün düzenleyici bir etkisinin olup olmadığı araştırılmıştır. Elde edilen sonuçlara göre cinsiyet faktörünün ekonomik ve sosyal tatmin ile fiyat duyarlılığı arasında anlamlı bir düzenleyici etkiye sahip olmadığı tespit edilmiştir. Araştırma kapsamında elde edilen sonuçların helal konseptte çalışan konaklama işletmelerinin müşteri ilişkileri çalışmalarına yönelik katkı sağlaması beklenmektedir"
