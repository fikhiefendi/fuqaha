abstract: "Vasiyet, kişinin hayatta iken kendi mal varlığı üzerinde ölümü sonrasındaki süreç için de serbestçe tasarrufta bulunma hakkını ifade eder. İslam hukukunda vasiyet konusunda çeşitli düzenlemeler yapılmış olup, mirasçıların ve vasiyet edilen kişilerin haklarının korunması gibi konular hükme bağlanmıştır. Mirasın üçte birinden daha fazla olan veya varislerden herhangi biri lehine yapılacak vasiyetin geçerliliği ise diğer varislerin iznine bağlı kılınmıştır. Osmanlı hukukunda vasiyetin hukuki geçerliliği ve uygulanışında İslam hukuku ile bir paralellik ve benzerlik görülmektedir. Osmanlı hukukunda vasiyetin yapılması için herhangi bir şekil şartı aranmamıştır. Vasiyet sözlü veya yazılı olarak yapılabilir. Ancak, vasiyetin ispat edilmesi açısından yazılı vasiyetin tercih edilmesi daha uygundur. Çalışmamızda vasiyet ve vasiyetin hukuki kanıtı niteliğinde olan vesikalar, Osmanlı hukuku özelinde İslam hukuku açısından ele alınmıştır. Bu bağlamda vasiyetin tarihi, diğer toplumlardaki durumu, içeriği, vasiyetçi, varisler ve vasiyet edilen kişiler açısından hukuki geçerliliğinin temel şartları ele alınmıştır. Konu ayrıca Türk modern hukuku açısından da ele alınarak aralarındaki ortak ve özgün yönlerinin ortaya konulması hedeflenmiştir."
