abstract: "Bu çalışmada Ebüssuûd Efendi'nin İrşâdü'l-ʿaḳli's-selîm ilâ mezâya'l-Kitâbi'l-Kerîm isimli tefsirindeki rivayetlerin tahric ve değerlendirilmesi yapılmıştır. Ebüssuûd Efendi yaşadığı dönemde şeyhülislamlık yapan, ilmî çalışmalarıyla adından söz ettiren ve fetvaları ile devrine damga vuran büyük bir şahsiyettir. Başta İrşâdü'l-ʿaḳli's-selîm olmak üzere bütün eserleri ilim ehlinin hep gündeminde olmuştur. Coğrafyamızın önemli âlimlerinden olması ve İrşâdü'l-ʿaḳli's-selîm üzerine herhangi bir tahric çalışması yapılmamış olması dikkatimizi çekmiştir. Bundan dolayı eserin II. cildindeki Âl-i İmrân ve Nisâ surelerinde yer alan rivayetler değerlendirilmiştir. Giriş bölümünde araştırmanın önemi, amacı ve metodu açıklanmış, Ebüssuûd Efendi'nin hayatı, ilmî kişiliği ve eserleri incelenmiştir. Birinci bölümde Âl-i İmrân, ikinci bölümde ise Nisâ suresindeki hadislerin tahrici ve değerlendirilmesi yapılmıştır. Genel değerlendirme kısmında hadislerin kritiği yapılmış ve Ebüssuûd Efendi'nin hadis kullanım metodu üzerinde durulmuştur."
