abstract: "Bu çalışmanın amacı, farklı bir banka türü olan katılım bankalarının bölgesel performanslarını şube temelinde ölçmek ve bu şubelerin birbirleri ile göreceli etkinlik düzeylerini tespit etmektir. Bu bağlamda, katılım bankacılığı sektöründe faaliyet gösteren bir katılım bankasının Doğu Anadolu ve Doğu Karadeniz bölgesinde bulunan 16 şubesinin etkinliği analiz edilmiştir. Teknik olarak etkinlik ölçme yöntemlerinden biri olan Veri Zarflama Analizi (DEA) ve temel Veri Zarflama Analizi (DEA) modellerinden BCC yaklaşımı kullanılmıştır. Etkinlik çalışmamız kredibilitelik, piyasa payı ve kârlılık modelleri üzerinden değerlendirilmiş olup kredibilitelik modeli BCC ortalama etkinlik skoru 0.775; piyasa payı modeli ortalama etkinlik skoru 0.739; kârlılık modeli ortalama etkinlik skoru ise 0.926 olarak ölçülmüştür. Üç modelde de etkin olan 5 adet şube bulunmaktadır. Bu şubeler: Erzurum, Trabzon, Of, Gümüşhane ve Değirmendere şubeleridir. Bu şubeler personel kalitesi, kurumla aynı dili konuşabilme ve hedeflere odaklanarak takım ruhu oluşturma konusunda başarılı olmuştur. Diğer şubelerin bazılarının ise birçok kalemde hedefe çok yakın olduğu ve küçük düzenlemeler ile etkin duruma gelebileceği tespit edilmiştir."
