abstract: "Hz. Peygamber'in sünneti sahih bir şekilde tespit etmek, maksadını uygun biçimde anlamak ve nesilden nesile ulaştırmak, İslam âlimlerinin en temel gayelerinden biri olmuştur. Bu anlamda, sünnetin tespitine yönelik çalışmalar içinde hadis ilmi her zaman merkezi bir yer tutmuştur. Bu çalışmada, Şâfiî usûlcüsü olan Ebû İshâk eş-Şîrâzî'nin hadis ve sünnet anlayışı, onun usûle dair telif ettiği eserleri çerçevesinde incelemiştir. Bu incelemede, ona göre haber ve kısımları, mütevâtir ile âhâd haberlerin kabul şartları ve reddedilme nedenleri ele alınmıştır. Şîrâzî, haber ve sünnet kavramları etrafında gelişen tartışmalara katılarak, genellikle Şâfiî mezhebinin görüşlerini aklî ve naklî delillerle savunmuştur. Karşıt görüşlerin delillerini de tenkit süzgecinden geçirerek aklî ve naklî delillerle eleştirmiştir. Şîrâzî'nin eleştirileri ağırlıklı olarak Hanefî mezhebine yönelik olmakla birlikte, Mâlikî, Mu'tezile, Zâhirî, muhaddisler ve diğer bazı mezheplere dair görüşleri tenkit edilmiştir. Şîrâzî'nin haber ve sünnet anlayışına ilişkin ortaya koyduğu görüşler, genel hatlarıyla muhaddislerin yaklaşımıyla paraleldir. Bununla birlikte bazı noktalarda dikkate değer farklılıklara da rastlanır. Nitekim muhaddislerin genelinin aksine hadis rivayetinin bir ücret karşılığında yapılmasını caiz görmüştür. Tezimiz giriş, üç bölüm ve sonuçtan oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı, yöntemi, kaynakları ve Şîrâzî'nin hayatı ile ilmî kişiliği ek alınmıştır. Birinci bölümde Şîrâzî'nin haber anlayışı ve bu çerçevede ele aldığı meselelere yer verilmiştir. İkinci bölümde Şîrâzî'nin râvî, rivâyet ve mervî ile ilgili görüşleri incelenmiştir. Üçüncü bölümde ise Şîrâzî'nin sünnet anlayışı ve ilgili konular analiz edilmiştir. Sonuç bölümünde de çalışmada ulaşılan tespitlere yer verilmiştir."
