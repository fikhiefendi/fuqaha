abstract: "İslâm-Osmanlı hukuk çalışmaları bakımından şer'iyye sicilleri son derece önem arz etmektedir. Bu siciller sayesinde İslâm hukuku ve örfî hukukun nasıl uygulandığı, sicillerin ait olduğu tarih ve coğrafyada hukuk hayatının nasıl olduğu tespit edilebilmektedir. Biz bu çalışma ile 1959/145 numaralı Trabzon şer'iyye sicilinin aile hukukuna dâir kayıtlarını İslâm-Osmanlı aile hukuku çerçevesinde tasnifleyip bir tahlile tabi tuttuk. Çalışma kapsamında öncelikle sicil Osmanlı Türkçesinden latin harflerine aktarılmıştır. Daha sonra sadece aile hukukuna dâir olan kayıtlar; evlenme, evliliğin sona ermesi ve çocuklara dâir olmak üzere üç ana başlık içerisinde temel İslâm hukuku kitapları, Türk Hukuk Tarihi eserleri ve fetvâ mecmuaları ışığında yorumlanmıştır."
