abstract: "Siyaset teorileri, birtakım temel sorunlarla karşı karşıya kalmakta; bu sorunları kolayca aşmak da mümkün olmamaktadır. Bu sorunlar, söz konusu teorilerin İslam hukuku açısından olduğu gibi benimsenmesini zorlaştırmaktadır. Bu noktada siyaset teorilerinin derinlikli bir şekilde analiz edilmesi ve ilgili sorunların İslam hukukuna göre anlaşılması meselesi önem arz etmektedir. Siyaset teorileri arasında en bâriz olan ve en çok dikkat çeken yönetim sistemi, şüphesiz ki demokrasidir. Demokrasi, siyasi otoritenin meşruiyetini halkın iradesinden aldığı ve bu iradenin, özgür ve âdil seçimler yoluyla yansıdığı bir yönetim sistemidir. Demokratik sistemin de kendi doğasından kaynaklanan ve farklı toplumlarda uygulanmasıyla ortaya çıkan birçok sorunu bulunmaktadır. Söz konusu sorunlar arasında siyasî çoğulculuk, âdil siyasi temsil, azınlık hakları ve siyasî istikrar gibi zorluklar yer almaktadır. Tezimizde, demokrasinin tarihi gelişimi ve karşılaştığı sorunlar, demokrasinin çağdaş İslam hukuk düşüncesindeki yeri ve bu düşünce sisteminde yer edinmesi için gerekli şartlar ve problemler, demokrasi modelinin savunucuları ve muhâliflerinin görüşleri karşılaştırmalı bir kisvede ele alınmıştır. Ayrıca Batı siyaset teorilerinin karşı karşıya olduğu ciddi sorunlar göz önünde bulundurularak, İslami değerler ve prensiplerle uyumlu olabilecek bazı çözümlere dikkat çekilmiştir."
