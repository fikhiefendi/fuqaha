abstract: "TEZ OZETI Birsin, Mehmet, Mâverdî'nin Devlet Anlayışı, Doktora Tezi, Danışman: Prof. Dr. İbrahim Çalışkan, 291 s. A. MAVERDI'NIN DEVLET ANLAYIŞI Tezimizde 450h./1058m yılında vefat etmiş olan Mâverdî'nin devlet anlayışı umumi amme hukukunun konuları çerçevesinde incelenmiştir. Doğrudan Mâverdî'nin görüşlerini tespit etmek amacıyla tüm eserleri taranmıştır. Konu ile ilgili düşünürlerin görüşlerine işaret edilmiştir. Mâverdî'nin devlet kavramına bakış açısı, devlet olgusunu incele yöntemi ve devlet anlayışını oluşturan temel ilkeleri saptanmaya çalışılmıştır. Mâverdî'nin devlet kavramının menşei ve gerekliliği ile ilgili görüşleri tartışılarak, devletin işlevleri hakkındaki görüşleri ele alınmıştır. Devleti meydana getiren unsurlar ile ilgili yaptığı tespitler değerlendirilmiş ve diğer Islamî mezheplerin görüşleri ile karşılaştırılmıştır."
