abstract: "Bu tezde H. 1321 (M. 1902-1903) yılına ait 2166 numaralı Şer'iye sicilindeki belgelerin öncelikli olarak transkripsiyonu yapılmış ve bu belgeler numara sırasına göre değerlendirmeye alınmıştır. Çalışmamızın giriş kısmında Zonguldak'ın coğrafî, tarihî, idarî ve ekonomik özellikleri ile ilgili geniş bilgilere yer verilmiştir. Daha sonra birinci bölümde Osmanlı Devleti'nde kadılık teşkilatının nasıl olduğu, şer'iyye mahkemelerinin Osmanlı hukukundaki yeri ve şer'iyye sicillerinde hangi tür belgelerin bulunduğu, ikinci bölümde ise bizim ele aldığımız 2166 numaralı Şer'iye sicilinde benzer veya farklı belge türlerinin bulunup bulunmadığı analiz edilmiş, ikinci bölümün devamında şeri'iye sicilinde geçen Zonguldak'a bağlı kaza, nahiye, karye ve mahalleler ile sosyal yaşam içerisinde yer alan Müslüman - Gayri Müslim kadın, erkek isimleri, devlet adamlarının isimleri, takma isimler, meslek isimleri tablolar halinde verilmiş, üçüncü bölümde ise belgeler hakkında kısa özetlere yer verilmiştir. Yine belgeleri daha iyi anlamak ve analiz edebilmek adına bu belgelerde geçen Arapça sayılar, hicrî ve rumî takvimler de tablolaştırılarak verilmiştir. Son aşamada ise elde edilen verilerin genel bir değerlendirilmesi ve karşılaştırılması yapılarak çalışmamız bitirilmiştir."
