abstract: "Ulûmu'l-Kur'ân, müfessire tefsir faaliyeti esnasında ihtiyaç duyduğu tikel verileri sunan ilimdir. Ulûmu'l-Kur'ân içerisinde yer alan esbâb-ı nüzûl ilmi ise Kur'ân-ı Kerîm'in anlaşılması noktasında ihtiyaç duyulan tarihsel arka plan bilgilerini günümüze ulaştırmaktadır. Esbâb-ı nüzûl ilmi erken dönemlerden itibaren hem müstakil kitaplarda hem de ulûmu'l-Kur'ân literatürü içerisinde ele alınmıştır. Bununla birlikte zaman içerisinde esbâb-ı nüzûl ilmine dair çeşitli tasnifler de yapılmıştır. Ulûmu'l-Kur'ân literatüründe esbâb-ı nüzûl ilminin metodolojik olarak tartışılmadığı görülmektedir. Bu noktada“Ulûmu'l-Kur'ân, esbâb-ı nüzûl ilmini neden metodolojik olarak ele almamaktadır?”ve“Bu durum ulûmu'l-Kur'ân için bir eksiklik midir?”sorularına cevap verilmesi önem arz etmektedir. Bu soruların cevabı ulûmu'l-Kur'ân'ın ve esbâb-ı nüzûl ilminin yapısında aranmalıdır. Esbâb-ı nüzûl ilmine dair tasniflerin çeşitlilik göstermesi, konunun diğer şer'î ilimlerin araştırma alanına giren çokboyutlu yapısından kaynaklanmaktadır. Esbâb-ı nüzûl ilmine dair metodolojik bütün soru ve sorunların ulûmu'l-Kur'ân içerisinde cevaplanmaması şer'î ilimler arasındaki hiyerarşik yapı ve otantik irtibatın bir sonucu olduğu ileri sürülebilir. Bu düşünceden hareketle bu çalışmada sebeb-i nüzûl tasnifleri bağlamında esbâb-ı nüzûl ilminin diğer şer'î ilimlerle olan ilişkisinin ortaya çıkarılması amaçlanmaktadır. Araştırmamızda esbâb-ı nüzûl ilminin kelâm, hadis usûlü, fıkıh usûlü ve tefsir ilimleriyle ilişkili olduğu sonucuna ulaşılmıştır. Bununla birlikte nâsih-mensûh gibi bazı ulûmu'l-Kur'ân konularının diğer şer'î ilimlerle olan ilişkisinin araştırılma gerekliliğine işaret edilmiştir."
