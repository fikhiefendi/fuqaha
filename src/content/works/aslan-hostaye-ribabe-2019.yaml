abstract: "Kültür ve müzik, toplumların hafıza oluşumlarında iki temel olgudur. Kültür, bir toplumun bütün öğelerini içerisinde barındırır ve bu toplum, mevcut kültür birikimi sayesinde hafızasını kalıcı hale getirir. Müzik ise toplumların kültürünün bir alt hafıza katmanı olarak önemli bir konuma sahip olmakla birlikte çoğunlukla toplumların 'hafıza-özne' görevini de üstlenip bilinçli ya da bilinçsiz, hafızayı kalıcılaştırmada önemli roller oynar. Kürt müziğinde önemli bir yeri olan“Dengbêjlik”de tarihsel taşıyıcı hafıza konumunu üstlenmiş olup, Kürt halkının geçmişinin bütün gündelik, siyasi, tarihi ve sosyolojik öğelerini günümüze taşımıştır. Miradê Kinê, Turabdin bölgesinin ünlü bir dengbêjidir. Bu bölgenin dengbêjleri bir müzik enstrümanı olan rebabı (ribab) kullanmalarıyla diğer dengbêjlerden ayrılırlar. Miradê Kinê, bu enstrümanı ustaca kullanışıyla bilinen en önemli dengbêjdir. Şer, lawik ve dîlok olmak üzere üç temel müzik formunu kullanmış ve stranlarını bu formlarla icra etmiştir. Miradê Kinê'nin“Şerê Osê Zerî”adlı şerinin konusu bir halk hikâyesine dayanmaktadır. Miradê Kinê zaten mevcut olan bu hikayeyi yeniden yorumlayıp şer formunda stranlaştırmıştır. Bu şer onun sanatında icra ettiği formlar arasında folklorik şerlere bir örnektir. Tez çalışmamız giriş ve sonuç kısımlarının yanı sıra üç temel bölümden oluşmaktadır. Birinci bölümün girişinde müzik sanatı hakkında genel bir bilgi verilmiştir. Müziğin geçmişi, müziğin başlangıcı hakkındaki teoriler, müzik ve folklorik öğelerin ilişkisi ve aynı zamanda müziğin diğer disiplinlerle olan ilişkisi belirtilmiştir. Ardından Kürt müziği hakkında genel bilgi verilmiştir. Kürt sözlü kültürü ve Kürt müzik kültürü arasındaki ilişki ve Kürt müziğinde kullanılan enstrümanlar ve makamlar üzerinde durulmuştur. Bu bölümün sonunda çalışmanın ana unsurlarından olan dengbêjlik geleneği; dengbêjliğin tanımı, geçmişi, Kürt kültürünün gelişimindeki rolü ve başlıca formları açısından ele alınmıştır. İkinci bölümde saha araştırması yöntemiyle Miradê Kinê'nin hayatı araştırılmış ve bu araştırma neticesinde elde edilen verilerle biyografisi oluşturulup yazılmıştır. Halk arasında çoğunlukla yanlış bilinen, yanlış kullanılan ve Miradê Kinê'ye atfedilen Mıtırb, Kurd ve Qereçi kavramları tartışılmıştır. Miradê Kinê'nin toplum içerisinde nasıl nam saldığı, ekonomik durumunun yaşamı ve sanatını nasıl etkilediği, bunun yanı sıra hayatının önemli dönüm noktaları incelenmiştir. Ardından sanatı ve stranlarının özelliklerinin daha iyi anlaşılması açısından Turabdin bölgesinin kültürü ve bu bölgedeki dengêjlik geleneği araştırılmıştır. Şer, lawik, dîlok gibi Miradê Kinê'nin kullandığı formlar yorumlanmıştır. Kaydedilen bantlarının sistematiği etraflıca izah edilip istatistikleri çıkarılmıştır. Rebab enstrümanı, Miradê Kinê'nin bu enstrüman ile olan ilişkisi ve çalış tarzı üzerine araştırma yapılmıştır. Bu bölümün sonunda ise komşu müzik kültürlerinin Miradê Kinê üzerindeki etkisi ile onun Kürt müziği ve Kürt sanatçılarının üzerindeki etkisi anlatılmıştır. Üçüncü bölümde motiflerin yapılandırılması çerçevesinde bir halk hikayesine dayanan Şerê Osê Zerî û Xanê Bedlîsî adlı epik hikayenin, özellikle şer ile bağlantısı olan motifleri üzerinde çalışılmıştır. Şer'in kapsadığı bu motîflerin analiz edilebilmeleri için on bir önemli motif ve bazı çeşitli motifler tespit edilip değerlendirilmiştir. Bu bölümde Şerê Osê Zerî'nin motiflerinin tespit edilmesi, sınıflandırılması ve değerlendirilmesi Stith Thompson'ın Motif Index of Folk Literature (Halk Edebiyatı Motif İndeksi) adlı çalışması temel alınarak yapılmıştır. Ayrıca motiflerle ilintili olarak öne çıkan Kürt halk hikâyelerinin ortak noktaları, Kürt halk hikâyeleri ve destanlarındaki ortak motiflerin örneklendirmeleriyle aktarılmıştır. Sonuç bölümünde ise genel bir değerlendirmeye gidilerek çeşitli tespitlerde bulunulmuştur. Ayrıca tez çalışmamıza katkı sağlayacağından tezin sonuna Miradê Kinê'nin ailesinin seceresi, fotoğrafı, bantlarının sınıflandırılması, bantlarında yer alan stranların fihristi ve folklorik şerlerinden Şerê Osê Zerî'nin deşifrasyonu gibi tarafımızca hazırlanan tablolar ve ekler iliştirilmiştir."
