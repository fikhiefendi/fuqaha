abstract: "Arnavutlar, yüzyıllardır farklı dinlere mensup insanlarla birlikte hoşgörüye dayalı ‎bir toplumsal anlayışa sahiptir. Bu durum, günümüzde de devam etmekte, Arnavut ‎halkının en temel ve ayırt edici özelliğini teşkil etmektedir. 1912 yılında Arnavutluk ‎Cumhuriyeti'nin kurulmasıyla, devleti kuran devlet erkânı ve toplumun önde gelen ‎Müslüman, Hıristiyan vb. dinî liderleri birçok temel ilke ve değerin korunmasına önem ‎verdikleri gibi insanın temel haklarından biri olan inanç özgürlüğünün korunmasını da ‎vurgulamışlardı. 1944 yılına kadar toplumun en temel özgürlüklerinden biri olan kendi ‎dinî inançlarını hür bir şekilde yaşama imkânı, komünist rejimin kurulmasıyla ‎vatandaşların elinden alınmıştır.‎ Ülkenin komünist rejime geçmesiyle, dinlere karşı her türlü baskı ve engellenme ‎yaşanmaya başlamıştı. Arnavutluk'ta yaşayan dinî liderler, komünist rejiminin ‎uygulandığı diğer ülkelerdeki uygulamalardan yola çıkarak, bu rejimin dinlere karşı sert ‎bir tutum takınacağını öngörmüşlerdi. Komünist rejim, sadece laik bir yönetim şekli ‎olmayıp aynı zamanda insanların hayatlarından dinî inançları yok edip ateist (inançsız) ‎bireyselliği amaçlıyordu. Nitekim bu amaçla dinî liderlerin toplumdaki otoritelerini sarsıp ‎onları etkisiz hale getirmeye çalıştılar ve bunun için onlara karşı çeşitli baskılar ve yeri ‎geldiğinde de şiddet uyguladılar. 1967 yılında camilerin ve kiliselerin kapatılmasıyla ‎Arnavutluk, insanların dinî inançlarını özgürce uygulanmasının yasak olduğu ve bu hakkı ‎onların elinden alan dünyadaki tek ülke oldu.‎ Komünist rejimin dine karşı bu sert tutumunun sonuçlarından biri, Müslümanların ‎kendi dinî inançlarını hür bir şekilde yaşamaları için ülkelerini terk etmek oldu. Bu ‎nedenle Arnavutluk'tan ayrılanlardan biri Süleyman Gavoçi ve ailesidir. Ailesiyle ‎birlikte Suriye'ye göç eden Süleyman Gavoçi, orada İslamî ilimler alanında eğitim alma ‎fırsatı yakaladı. Süleyman Gavoçi, kendisini İslamî ilimlerde geliştirerek saygın Arnavut ‎kökenli âlimlerinden biri oldu. Kitapları ve sohbetleriyle memleketinde yaşayan ‎Müslümanların İslamî bilgiler hususunda bilgilenmelerine katkı sağladı. Vehbi Gavoçi, ‎çalışmalarıyla Arnavut dünyasında bilinmekle birlikte yazdığı Arapça eserlerle dünya ‎âlimleri tarafından tanınmış ve tezimizde belirteceğimiz gibi âlimlerin takdirini de ‎kazanmıştır.‎"
