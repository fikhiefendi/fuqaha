abstract: "Bu çalışma, öncelikle mezheplerin teşekkül sürecinde fıkıh-siyaset ilişkisini ve birbirlerini nasıl etkilediklerini konu edinmektedir. Çalışmada üzerinde durulan diğer bir konu ise siyasetin mezheplerin teşekkülünü ve birbirleri ile ilişkilerini nasıl etkilediği meselesi olmuştur. Bu çalışma literatür, metin ve doküman tarama yani nitel bir araştırma yöntemi kullanılarak yapılmıştır. Sosyal bir varlık olarak kabul edilen insanın, hayatını güvenli ve sorunsuz bir şekilde sürdürebilmesi onun bir toplum içerisinde yaşamasını gerektirdiği gibi, toplumun bir güven ve düzen içerisinde yaşaması da siyaset ve hukuk (fıkıh) kurumlarının varlığını gerekli kılmıştır. İslam düşüncesinde siyaset, imâmet/hilâfet kurumlarından beklenen bir misyon olmuş ve sadece dünyevî değil, dînî hayatın da tam ve eksiksiz yaşanabilmesi için zorunlu bir kurum olarak görülmüştür. İslam düşünce ekolleri içerisinde siyaset kurumunun gerekliliğine kayda değer bir itiraz olmamıştır. Sahip oldukları güç ve karşılıkların farklılığından kaynaklı olarak bu iki kurum arasındaki ilişki ve etkileşimde daha çok fıkıh ve fukaha aleyhine bir eşitsizliğin yaşandığı görülmüştür. Siyaset ve fıkıh birbirlerinin meşrûiyetine karşılıklı olarak katkıda bulunmuşlarsa da siyaset sahip olduğu iktidar gücünü de kullanarak bazen fukahadan meşru olanı değil, istediğini meşrulaştırmasını talep edebilmiştir. Siyaset, kendilerinden beklenen ve istenen şekilde davranmadığında fukahaya karşı son derece acımasız olmuş ve muhalefetlerinin sertliğine ve ciddiyetine göre kendilerine içtihat ve tedrisat faaliyetleri başta olmak üzere çeşitli konularda kısıtlamalar, hapis ve darp gibi ağır cezalar ve yaptırımlar uygulamıştır. Fukahanın, zulümleri sebebiyle meşruiyetleri tartışılan idarecilere karşı tavrı daha büyük bir fitneye (iç savaş) sebep olacağı endişesiyle halka sabretmeyi ve onlarla bir müddet idare etmelerini telkin etmek olmuştur. Siyasetin, mezheplerin de hem teşekkülüne hem de sosyal ve siyasi meşrûiyetine ciddi etkisi olmuştur. İdare tarafından tercih edilen mezhepler bir takım devlet imkânlarından faydalandırılmışlar bu da onları rakipleri karşısında daha güçlü ve avantajlı hale getirmiştir."
