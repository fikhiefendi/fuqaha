abstract: "Selçuk Bey komutasındaki Selçuklu ailesi Cend'e vardıklarında İslam dini ile tanıştılar. Bu tanışma onların da kısa bir süre içerisinde İslamiyet'i kabul etmelerine vesile oldu. İlk yerleştikleri bölgenin baskın şekilde Hanefîlerden oluşmasından dolayı Hanefîliği benimsediler. Zamanla Horasan ve Maverünnehir bölgelerinde uyguladıkları siyasi politikalar sayesinde de güçlü bir devlet haline geldiler. Şüphesiz Sünnî İslam dünyasının siyasi koruyuculuğunu üstlenmiş olmaları da onları güçlü kılan bir etkendi. Şâfiîler, Büyük Selçuklunun önemli merkezlerinde olmak üzere devlet sınırları içerisinde kalabalık bir nüfusa sahiptiler. Nitekim Şâfiîler, devletin siyasi ve idari alanında vezirlik, kadılık, elçilik gibi önemli görevlerde bulundular. Selçuklu Sultanları Alparslan ve Melikşah'ın vezirliklerini yapan Nizâmülmülk de Şâfiî mezhebindendi. Nizâmülmülk, Nizamiye Medreselerini inşa ettirerek burada Şâfiî âlimlerin müderrislik yapmasını sağladı. 11. yüzyılda Bağdat, Horasan ve Maveraünnehir bölgelerinde yoğun bir şekilde mezhepsel çatışmalar yaşanmaktaydı. Bu çatışmalar içerisinde Şâfiîler de yer alıyorlardı. Şâfiîler, Hanbelîlerler ve itikadî ekollerle çoğu zaman fiili çatışma yaşarlarken Hanefîlerle ise daha çok zihinsel bir çatışma halindeydiler. Büyük Selçuklu Devleti, fıkhî mezheplerin hem kendi aralarında hem itikadî ekollerle olan bu kavgalarında herhangi bir tarafın yanında durmamaya özen gösterdiler. Ancak olaylar devlet için tehlike arz edebilecek boyuta geldiği vakitlerde müdahaleden kaçınmadılar. Tuğrul Bey döneminde Şâfiî âlimlerin de Eş'arîlerle beraber baskı görmeleri olayı dışında Selçuklu sultanlarının Şâfiîlere yaklaşımı hep pozitif yöndeydi. Şâfiî fakihler, Büyük Selçuklu döneminde Sünnî İslam dünyası için büyük bir tehlike arz eden Batınîlik gibi pek çok bidatçı düşüncenin karşısında durdular."
