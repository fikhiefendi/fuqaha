abstract: "Hz. Osman; İslamiyet'i ilk kabul edenlerden biri ve Raşid halifelerin üçüncüsüdür. Hz. Peygamber'in iki kızıyla evlenmiş, bundan dolayı kendisine iki nur sahibi anlamına gelen“Zinnûreyn”lakabı verilmiştir. Habeşistan'a iki kez hicret etmiş, Hz. Peygamber'in yanında Bedir savaşı hariç bütün seferlere katılmıştır. Henüz hayattayken cennetle müjdelenen on sahabeden biri olan Hz. Osman, on iki yıl süren devlet başkanlığında önemli hizmetlerde bulunmuş, en önemli hususlardan biri olarak günümüze kadar mütevâtir olarak nakledilen Kuran'ı cemetmiştir. Hz. Osman, hac menasikini en iyi bilen, miras hukuku alanındaki sahabe icmâsını bozan görüşleri ve devlet başkanı sıfatıyla vermiş olduğu fıkhi içtihatları ile sahabe arasında ön plana çıkmıştır. Bundan dolayıdır ki Hz. Osman'ın fıkıh alanında temayüz eden müçtehit bir sahabe olması ve bu yönde bulunduğu içtihatlarla sonraki dönemlere kaynaklık etmesi sebebiyle fıkıhçı kimliğini ortaya koymak amaçlanmıştır. Onun tüm fıkhî görüşleri değil daha ziyade diğer müçtehit sahabelerden farklı düşündüğü ve müçtehit imamların görüşlerine delil teşkil eden ve daha sonraki dönemlerde mezheplerin şekillenmesine öncülük ettiği görüşleri ele alınmış ve değerlendirmeye tabi tutulmuştur. Yine onun devlet başkanı sıfatıyla vermiş olduğu hükümlerde ayrı bir başlık altında ele alınarak değerlendirmeye tabi tutulmuştur. Ayrıca bu çalışmamızda Hz. Osman'ın hüküm istinbâtında kullandığı deliller çeşitli örnekler muvacehesinde açıklanmaya çalışılmış ve vermiş olduğu hükümlerden hareketle hüküm istinbâtında gözetmiş olduğu ilkeler de tespit edilmeye çalışılmıştır."
