abstract: "Bu çalışma, İshak b. Ali b. el-Hasen'e ait olan ve günümüze yalnızca tek nüshası ulaşan“Hulâsatü't-Tefâsîr”adlı eserde yer alan ahkâm âyetlerinin incelenmesini konu edinmektedir. Eserin tek nüsha oluşu ve daha önce ilmî bir çalışmaya konu edilmemiş olması, araştırmanın gerekliliğini artıran temel unsurlardır. Bu çerçevede çalışmanın başlangıcında ahkâm âyetleri üzerine yapılan klasik ve modern tefsir faaliyetleri hakkında genel bilgi verilmiştir. Araştırmada yöntem olarak nitel analiz benimsenmiş; metin merkezli inceleme, karşılaştırmalı analiz ve klasik tefsir literatürüyle mukayese teknikleri kullanılmıştır. Eserde yer alan ahkâm âyetleri içerisinden özellikle İshak b. Ali b. el-Hasen'in hüküm çıkarma sürecini ayrıntılı şekilde temellendirdiği ayetler seçilerek değerlendirilmiştir. İshak b. Ali b. el-Hasen'in yaklaşımının daha iyi anlaşılabilmesi için ilgili ayetler öncelikle“Hulâsatü't-Tefâsîr”'deki şekliyle analiz edilmiş; ardından Taberî'nin Câmiu'l-Beyân'ı, Zemahşerî'nin el-Keşşâf'ı ve Sabûnî'nin Ahkâmü'l-Kur'ân'ı başta olmak üzere diğer klasik ve çağdaş kaynaklarla mukayese edilmiştir. İshak b. Ali b. el-Hasen, yorumlarında çoğu zaman farklı mezheplerin görüşlerine yer vermektedir. Eserde kıraat farklılıklarına işaret edilmekle birlikte herhangi bir tercih belirtilmemiştir. İshak b. Ali b. el-Hasen ayrıca nasih-mensuh, mücmel, sebeb-i nüzûl gibi tefsir usulü kavramlarını aktif biçimde kullanmakta; ayetin ayetle tefsiri, sünnetle tefsir, şiirle istişhâd gibi klasik yöntemlere de yer vermektedir. Kelimelerin sarf ve nahiv tahlilleri yapılmış, metin içinde doğabilecek muhtemel sorulara cevap verilmiştir. Bu durum eserin, hem öğretici hem de pratik problemlere çözüm üretme amacı taşıyan bir tefsir niteliğinde olduğunu göstermektedir. Eserin tek nüsha olması ve herhangi bir tahkik çalışmasına konu olmaması, araştırmanın özgün değerini artıran önemli bir unsurdur. Bu çalışma, söz konusu nüsha üzerinden ahkâm âyetlerine ilişkin yorum geleneğini ortaya koymayı, İshak b. Ali b. el-Hasen'in düşünce sistematiğini açığa çıkarmayı ve klasik fıkhî tefsir geleneğine ilmî bir katkı sunmayı amaçlamaktadır."
