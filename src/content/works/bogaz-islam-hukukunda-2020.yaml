abstract: "Kefalet İslam hukuku'nda“Muamelat”genel başlığının altında yer almakla beraber İslam hukuku ve Borçlar hukuku içinde önemli yere sahiptir. Hukukçulardan bazıları İslam hukuku'nu sadece ibadetleri düzenleyen mefhumlar olarak görür iken, bazıları da ahiretle ilgili işleri düzenleyen kaideler gözüyle görmektedirler. Oysa İslam dini ortaya çıkardığı hukuk kuralları ile beşeri hayat olan bu dünya hayatının münasebetlerini de tazmin etmektedir. Aslında her alanda İslam'a uygun yaşamak beşeri ve ebedi hayat için yeterli olacaktır. Ticari hayatımızda teminat akitleri kullanılmakta ve her geçen gün artmaktadır. Teminat akitleri arasında yer alan kefaletin özel bir önemi bulunmaktadır. İslam hukukunda akd-i tedamün ismi verilen teminat sözleşmeleri kefalet, rehin ve bey'-i vefa olmak üzere üçe ayrılmaktadır. Biz tezimizde kefalet akdini ele aldık. Tezin amacı, kefaletin ticarette kullanılan akit olması nedeniyle, İslam hukukunda kefaletin yerini ve önemini, modern hukuk ve mezhep görüşleri açısından nasıl değerlendirildiğini, günümüzde İslami bankacılık yapan katılım bankalarının kefalet ile kullandırdıkları kredileri, katılım bankaları açısından kefaletin önemi ve faydalarını incelenmeye çalıştık. Kefaletin meşruluğunun nasıl gerçekleştiği ve hangi delillere dayandığı tespit edilmeye çalışılmış, asli hükümlerde kefaletin çerçevesi ve sınırları çizilmiştir. Mezheplerde kefalet akdi incelenmiş kefalet akdinin sahih olduğunu sonucuna ulaşılmıştır. Kefaletin İslami açıdan uygun bir akit olması ile İslam bankacılığında da önemli bir yere sahip olması, insanların birbirine güven duymayı ögretmesi ve kredi kullandırımları ile ekonomiyi canladırıcı etkisinin olduğu ortaya çıkmıştır."
