abstract: "İslam fıkıh tarihinin klasik döneminde hayızlı kadının oruç tutamayacağı görüşü hâkimdir. Öyle ki bu konuda icmanın varlığı ileri sürülmektedir. Günümüzde ise bu hâkim fıkhî görüşün aksine konu hakkında farklı yorumlar yapılmaktadır. Hazırladığımız bu tezmizde klasik dönem bilginlerinin, hayızlı kadının oruç tutup tutamayacağı konusunda nasları anlama ve yorumlamada konu hakkında ileri sürdükle-ri gerekçeler ile günümüz bilginlerinin ileri sürülen bu gerekçelere karşı ortaya koyduk-ları görüşlerin analizi yapılarak bir sonuca varılması hedeflenmiştir."
