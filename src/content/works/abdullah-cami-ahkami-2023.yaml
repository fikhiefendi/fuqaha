abstract: "En büyük gayelerden biri, ilimle uğraşmak ve dinde fakih olmaktır.“el-Câmi' li-Ahkâmi'l-Kur'an Tefsiri Bağlamında İmam Kurtubî'nin Keffaret Hükümlerindeki Tercihleri (Derleme ve İnceleme)”başlıklı tezin konusu, İmam Kurtubî'nin kefaret hükümleri konusuna yaklaşım tarzını ele almaktır. Bu çalışma karşılaştırılmalı, tümevarımsal ve analitik bir incelemedir. Önce kefaret hükümleri ile ilgili Kur'ân ayetleri araştırılıp derlenmiş ve sonra her bir unsuru analitik olarak incelenmiştir. Bu hükümleri bölümlemeyi, akli ve nakli delillerle İmam-ı Kurtubî'nin tercihlerini açıklamayı, resmi tamamlamak için diğer müfessirlerin ve âlimlerin görüşlerini sunmayı amaçlamıştır. Araştırmacı, Kurtubî'nin tercihlerini açıklamaya yetecek kadarıyla yetinmiştir. Keffâretler konusu, İslâm hukukunun önemli fıkıh meselelerinden biri olup kişinin günahlarına kefaret için her zaman ihtiyaç duyduğu bir ilim olduğu için konunun derinliği ve içerdiği deyimlerin çokluğu nedeniyle yavaş ilerlemiştir."
