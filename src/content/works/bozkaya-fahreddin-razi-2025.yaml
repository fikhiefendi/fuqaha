abstract: "İslâm hukuku, diğer hukuklardan farklı olarak, isminden de anlaşılacağı üzere ilâhî kaynaklardan beslenen bir hukuk sistemidir. İslâm hukukunda vaz' edilen hükümler, asıl itibariyle müctehidlerin bizzat ihdas ettikleri hükümler değildir. Aksine müctehidler, Cenâb-ı Hakk'ın Kitâb'ında ve Hz. Peygamber'in (s.a.v.) sünnetinde yer alan naslardan hareketle, hakkında açık bir hüküm bulunmayan meselelerin şer'î hükmünü usûl kaideleri çerçevesinde istinbât etmektedirler. Usûlcüler bunu yaparken bir sistem izlemiş ve gelişigüzel bir şey yapmaktan kaçınmışlardır. Onların benimsedikleri usûlî yaklaşımların oluşumunda, ilmî birikimleri ile yetiştikleri medrese geleneğinin belirleyici etkisi olmuştur. Nitekim bir usûlcünün kabul ettiği bir delil, bazen diğer usûlcüler tarafından reddedilmiştir. Böylece İslâm hukukunda usûlcüler tarafından dayanak olarak kullanılan bazı deliller üzerinde ittifâk edilmişken bazıları üzerinde ihtilâf edilmiştir. Bu deliller daha sonra usûlcüler tarafından müstakil başlıklar halinde eserlerde ele alınmıştır. Söz konusu usûlcülerden biri de Fahreddîn er-Râzî'dir. Bu kapsamda Fahreddîn er-Râzî'nin usûl düşüncesindeki ihtilâflı deliller tezin konusu olarak belirlenmiştir. Çalışmada nitel araştırma tekniklerinden doküman analizi tekniği kullanılarak, Râzî'nin üzerinde durduğu on tane ihtilâflı delil hakkındaki görüşlerinin ele alınması amaçlanmıştır. Bu çalışma iki ana bölümden oluşmaktadır. Birinci bölümde üzerinde ittifâk edilen deliller ve tezin sınırını aşmaması için üzerinde ihtilâf edilen yedi meşhûr delil ele alınacaktır. Tezin asıl konusunu oluşturan ikinci bölümde ise Râzî'nin ihtilâflı delillere yaklaşımı ele alınacak; bu çerçevede kendisine yöneltilen eleştiriler ve bunlara verdiği cevaplar incelenecektir. Râzî, asıl delili, istishâbü'l-hâl delili gibi bazı delilleri kabul ederken; sahâbî kavli, istihsân gibi delilleri reddetmekte, tefvîzî hüküm konusunda tevakkuf edilmesi gerektiğini ifade etmekte ve bu deliller üzerinde detaylıca tartışmaktadır."
