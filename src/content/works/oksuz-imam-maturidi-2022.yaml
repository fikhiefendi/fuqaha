abstract: "Tezimizde İmâm Mâtürîdî'ye göre bir şeyin insanın tabiatına uygunluğunun veya aykırılığının o şeyin şer'î hükmüne etkisi incelenmiştir. Tezimiz üç bölümden oluşmaktadır. Giriş bölümünü oluşturan birinci bölümde araştırmanın konusu, önemi, amacı, kaynakları, yöntem ve teknikler hakkında bilgiler verilmiştir. Sonra İmâm Mâtürîdî'nin hayatı, eserleri, hocaları, talebeleri ve ilmî kişiliği ele alınmıştır. Ayrıca konumuzla ilgisi oranında şer'î hüküm kavramı ve şer'î hükmün çeşitleri ele alınmıştır. İkinci bölümde insanın tabiatı kavramı, insanın tabiatına uygunluk ve aykırılığın ölçüsü, insanın tabiatının aslî yaratılışı, bu tabiatın değişme potansiyeli, insanın tabiatının akıl ile olan ilişkisi, hüsün kubuh meselesi ile bağlantısı, âlimlerin ve özellikle Mâtürîdî'nin bu konulardaki görüşleri incelenmiştir. Üçüncü bölümde ise Mâtürîdî'nin eserinde temas ettiği örnekler incelenerek bir şeyin insanın tabiatına uygunluğunun veya aykırılığının onun şer'î hükmüyle ilişkisine ve şer'î hükmene etkisine dair yaklaşımları tespit edilmeye çalışılmıştır. Sonuç olarak Mâtürîdî'ye göre insanın tabiatına uygunluğun veya aykırılığın belli ölçütlere bağlı olduğu belirlenmiştir. Mâtürîdî'nin verdiği örnekler ve yaptığı değerlendirmelerden elde ettiğimiz veriler sonucunda onun bir şeyin insanın tabiatına uygunluğunu veya aykırılığını şer'î hükmü belirleyen bir ölçüt olarak kabul etmediği, fakat şeriatin yerine göre insanın tabiatını dikkate alarak, bazen ona uygun bazen de farklı hükümler koyduğunu kabul ettiği, bir şeyin tabiata aykırılığı ile akla aykırılığının farklı değerlendirilmesi gerektiğine ve dinin imtihan boyutuna dikkat çektiği tespit edilmiştir."
