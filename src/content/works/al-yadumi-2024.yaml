abstract: "Yemen Merkez Bankasının dualitesi ve Yemen'deki faaliyet gösteren bankaların performansı üzerindeki etkisinin incelenmesi araştırmanın amacını oluşturmaktadır. Yemen Merkez Bankasının dualitesi ve bu dualitenin Yemen bankalarının üzerindeki etkisinin ele alındığı bu çalışmada, Yemen İslami bankaları örneği üzerinde durulmaktadır. Yemen Merkez Bankasının yaşamış olduğu bu dualiteyi ve bölünmeyi analiz edebilmek ve onun neticesinde Yemen bankalarının üzerindeki ortaya çıkan etkileri değerlendirebilmek için bankaların yıllık raporlarında bulunan ikincil verilere ulaşıp verilerin analizinde betimsel analiz yöntemi kullanılmıştır. Bununla beraber, Yemen bankacılık sektöründeki çalışanlara verilmiş olan anketi incelemek için istatistiksel analiz yöntemi de kullanılmıştır. Araştırmanın verileri sonucunda, Aden'deki Yemen Merkez Bankası ile Sana'a'daki Yemen Merkez Bankası arasındaki karar alma süreçlerinin ayrılması ve kararların dualitesi, bankaların dış dengelerini karşılama kapasiteleri, para sızıntısı, nakit likidite krizinin kötüleşmesi, karaborsa faaliyetlerinin genişlemesi ve mevduat sahiplerinin güveninde bir krizin ortaya çıkması konusunda olumsuz bir etkiye sahip olduğu sonucuna ulaşılmıştır. Araştırma, para ve bankacılık otoritesi bölünmesinin ortadan kaldırması ve kararların dualitesine bir son verilmesi için Yemen Merkez Bankasının yönetimi aynı çatı altında yeniden birleştirmesi ve çeşitli mekanizmalarını ve işlevlerini yeniden etkinleştirmesi önermektedir."
