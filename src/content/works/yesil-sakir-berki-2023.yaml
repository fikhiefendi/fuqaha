abstract: "Osmanlı Devleti'nde haklarla ilgili problemler şer῾î hukuk ve örfî hukuk çerçevesinde çözüme kavuşturulur, ictihada açık alanda ictihad mekanizması sürekli açık tutulurdu. İmparatorluğun gücünü kaybettiği dönemin elbette tek sorumlusu askeri sahadaki bozulma değildir. Siyasi, iktisadi, sosyal ve dinî alanda, karar ve uygulama sahasında da hatalar olmuş ve Osmanlı çöküş dönemine girmiştir. Aynı dönemde Batı Medeniyeti yükselmeye başlamış veh geçmişte yaptığı hatalardan çıkardığı derslerle problemlerinin birçoğunu çözüme kavuşturmuştur. Osmanlı yer yer yanı başındaki örnekten istifade etmeye çalışsa da devletin içindeki karışıklık istenilen neticelerin alınmasını engellemiştir. Düşünen, çalışan, kazanan ve başarmaya çalışan yeni Türkiye Cumhuriyeti toplumsal yapıyı yeniden inşa ederken yüzünü Batı'ya dönmüştür. Islah yetersiz kalacak ve zaman kaybına neden olacaktır. Bu bağlamda yapılması gereken alternatif kurumlar oluşturmaktır ve hemen yanı başında başarılı olmuş bir Batı medeniyeti örneği vardır. Burada önemli olan bu“örnek medeniyet”taklit mi edilecek yoksa bu milletin değer yargılarına uyarlanacak mıdır? Medeni Kanun İsviçre'den taklit yoluyla alınmış, din eğitimi Cumhuriyetin ilk yıllarında önce ilk ve orta öğretim sonra da yüksek öğretim sahasından çıkarılmıştır. Tezimizde Medeni Kanun çerçevesinde eğitim görmüş, Ankara Üniversitesi Hukuk Fakültesi mezunu bir medeni hukukçu olan merhum Şakir Berki'nin akademik bilgi, ölçü ve kalitesinden taviz vermeden, medeni hukukumuzu tahkir etmeden yürürlükte bulunan kanunlarımızın eksikliklerinin İslâm hukukundaki çözüm önerileriyle tamamlanabileceğini örnekleriyle ortaya koymasını ele almaya çalıştık. Şakir Berki, bir ilim adamı olmasının üzerine yüklediği sorumluluk duygusuna yakışır şekilde İslâm hukukunun Batı toplumlarında mukayeseli hukuk alanı içerisinde yer bulmasına rağmen; memleketimizde görmezden gelinmeye çalışıldığını ifade etmiş ve İslâm hukukunun tutarlı, evrensel ve her dönemde uygulanabilir olduğunu örnekleriyle açıklamıştır."
