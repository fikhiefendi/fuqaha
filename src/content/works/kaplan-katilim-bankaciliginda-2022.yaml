abstract: "Dünya ekonomik sisteminde finansal piyasalar açısından bankacılık sektörü yüksek öneme haizdir. Ülkemizde de benzer şekilde finansal piyasalarda bankacılık sektörünün ağırlığı yüksektir. Her ne kadar mevduat bankalarının aktif büyüklükleri katılım bankalarına kıyasla yüksek olsa da, katılım bankaları sunmuş olduğu ürün ve hizmet çeşitliliği ile finansal piyasalarda kendine yer edinmiştir. Bu da sektör içinde bulunmanın avantaj ve dezavantajlarını beraberinde getirmektedir. Avantajlardan yararlanmak ve dezavantajları bertaraf etmek için özkaynak yapısı güçlü, sürdürülebilir, sağlam ve uygulanabilir risk yönetimi ile beraber iç kontrol ve denetim sistemlerinin mevcut olması gerekmektedir. Gerek ulusal gerekse uluslararası düzeyde iktisadi olaylardan doğrudan veya dolaylı bir şekilde etkilenen katılım bankaları kredi, faiz ve kâr payı, piyasa, kur, operasyonel, likidite ve şer'i risklere maruz kalmakta ve faaliyetlerini bu riskleri yöneterek sürdürmektedir. Bu minvalde mali istikrarın sağlanması ve bankacılık faaliyetlerinin devamlılığı açısından katılım bankalarının likidite riskini nasıl yönetmeye çalıştıkları önem arz etmektedir. Bu çalışmanın temel amacı, katılım finans sektöründe önemli büyüklüğe sahip olan katılım bankalarının likidite riskinin yönetilmesinde bu riski etkileyen faktörlerin belirlenmesidir. Literatür incelendiğinde likidite riskiyle ilgili çalışmaların konvansiyonel bankalar üzerinde yoğunlaştığı görülmektedir. Bu çalışmada Türk bankacılık sektöründe faaliyette bulunan katılım bankalarında likidite riskini etkileyen içsel değişkenler belirlenmiştir. Bu kapsamda Türkiye'de faaliyette bulunan 5 katılım bankasının 2016-2020 yılları arasındaki çeyrek dönemlik verileri panel regresyon analizi yöntemiyle analiz edilmiştir. Çalışmada, bağımlı değişken Likidite Riski (LRİSK), bağımsız değişkenler ise Aktif Karlılığı (ROA), Özsermaye Karlılığı (ROE), Aktif Büyüklüğü (AKBUY), Sermaye Yeterlilik Oranı (SYR) ve Dış Finansman (DFİN) olarak seçilmiştir. Analiz sonucunda, bankalara özgü ROE, SYR ve DFİN değişkenleri 1 birim arttığında likidite riski sırasıyla 0.26, 0.22 ve 0.21 düşmekte ve AKBUY 1 birim arttığında likidite riski 0.46 yükselmektedir."
