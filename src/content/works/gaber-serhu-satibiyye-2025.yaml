abstract: "Yazmış olduğu eserlerin ve kıraatler ile ilgili derlemiş olduğu kitapların da işaret ettiği gibi, İmam Şu'le olarak bilinen Ebû Abdullah Muhammed b. Ahmed el-Mevsılî (ö. 656/1258), arkadaşları, çağdaşları ve kendinden sonra gelen âlimlerin şahitliğiyle Kur'ân-ı Kerim ve Kur'ân ilimlerine hizmet etme şerefine nail olan âlimlerden sayılmaktadır. Fıkıh, lügat ve diğer İslamî ilimlerin birçok sahasında oldukça fazla eser vermiştir. Bu tezdeki çalışmamızın konusu, İmam İmam Şu'le'nin kırâât-i seb'a ilimleri hakkında yazmış olduğu es erlerinden bizim üzerinde araştırma yaptığımız bir eseri olacaktır. Tezin ismini de“Şerhu Şu'le 'Ala'ş-Şâtıbiyye (Kenzu'l-Me'ânî fî Şerhi Hırzi'l-Emânî)'nin Aidiyeti, Tahlil Ve Tahkiki: Usul Kısmı”şeklinde oluşturduk. Kendi materyal ve sahasında oldukça büyük yeri olan bu şerhi, doktora tezimin araştırma konusu olarak seçmede Yüce Allah beni muvaffak etti. Ve şimdi ben Yüce Allah'tan yardım, muvaffakiyet ve doğruluk istiyorum."
