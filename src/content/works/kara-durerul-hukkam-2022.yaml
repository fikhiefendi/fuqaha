abstract: "Erken dönemlerden itibaren fakihler muteber ve otorite sahibi bir metin üzerine şerh ve haşiye yazarak fıkhî birikimini ortaya koymuşlardır. Osmanlı dönemine intikal eden bu ilim anlayışı Osmanlı fıkıh teliflerini de doğrudan etkilemiş ve 15. asrın son çeyreğinde telif edilen Dürerü'l-hükkam; ilim ve telif kültürü, müellifi Molla Hüsrev'in muteber ve otorite bir kişiliğe sahip olması ve eserin medrese metni olmasının etkisiyle sonraki üç asır boyunca en çok şerh edilen metinlerden olmuştur. 16. asrın başından itibaren risale ve ta'likât ile başlayan bu süreçte Dürer üzerine muhtelif türde çalışmalar yapılmıştır. Genel itibariyle tedrisat zemininde gerçekleşen bu çalışmalar Osmanlı döneminde fıkıh bilgisinin nasıl üretildiğini göstermesi açısından kazâ bölümü esas alınarak kronolojik bir şekilde incelenmiştir. 16. asırdan sonra Osmanlı kadılık sistemi öncesine kıyasla daha sistemli ve hiyerarşik bir yapıya kavuşmuş, kadıların sayısı artmış ve bununla irtibatlı olarak kadılarla ilgili şikayetler ve eleştiriler de daha yüksek sesle dile getirilmiştir. Bu durum hilafet makamını da üstlenen Osmanlı Devleti için bir adalet problemi olmuştur. 16. asırdan 18. asra kadar olan süreçte Osmanlı Devleti'nin adalet meselesi, yönetim ve idari alanlardaki krizlerinin yansımaları kazâ bölümüne dair şerhlerde kendini belli etmektedir. Dürer haşiyeleri dönemin ihtiyaçları ve etkileriyle metni çeşitli açılardan ele alarak geçmiş fıkıh birikimini yeniden tahkik ve tashih etmektedir. Bu da fıkıh meselelerinin ve ahkâmının inkıtasız bir şekilde her dönemde şartların etkisi ve ihtiyaçları doğrultusunda yeniden ifade bulduğunu göstermektedir."
