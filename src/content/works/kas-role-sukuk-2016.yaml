abstract: "İslami finans araçları son yıllarda hızlı bir şekilde gelişmektedir. Bu gelişim ile birlikte bu araçlara, başta İslami finans piyasaları olmak üzere, küresel piyasalarda da karşılaşılmaktadır. Şüphesiz, bunların günümüzdeki en önemli olanı Sukuk olarak ifade edilen faizsiz borçlanma senetleridir. Dünya genelinde Körfez ülkeleri başta olmak üzere Malezya ve Türkiye'de popüler bir enstrüman olan Sukuk, devlet ve özel şirketler tarafından sermaye piyasalarında finansman sağlama aracı olarak kullanılmaktadır. Özellikle Türkiye'de kira sertifikası olarak adlandırılan bu enstrüman, Katılım Bankaları ve Hazine Müsteşarlığı tarafından kurulan varlık kiralama şirketleri aracılığıyla piyasaya ihraç edilerek, faiz hassasiyetine sahip olan yatırımcıların fonlarının finansal sisteme kazandırılmasına yardımcı olmaktadır. Bu çalışmada kira sertifikası detaylı bir şekilde ele alınarak, kira sertifikasının orijini ve gelişim süreci, çeşitleri ve yapısı, gelişen sermaye piyasalarındaki rolü hakkında detaylı araştırma yapılmıştır. Buna ek olarak, kira sertifikası enstrümanının açık piyasa işlemlerinde Katılım Bankaları tarafından kullanılarak, piyasadaki geçici likidite açığına karşı mücadele edebildikleri görülmüştür. Bu sayede Türkiye Cumhuriyet Merkez Bankası, bankacılık sisteminde yer alan oyuncuların tamamıyla iletişim halinde kalarak, piyasadaki likiditeyi sağlam ve güvenilir bir şekilde kontrol edebilir durumda olduğu gözlemlenmiştir. Son olarak, sukuk ve bono arasında bazı temel farklılıkların olduğu gösterilmiştir. Ayrıca Sukuklara ait getirilerin bonoların getirilerinden farklı olması ile ilgili bir analiz yapılmıştır. Bu analizde ise, sukukların getirilerinin düşük hacimli olmaları ve piyasada henüz likit varlık olarak görülmemelerinden dolayı farklı olduğu anlaşılmıştır."
