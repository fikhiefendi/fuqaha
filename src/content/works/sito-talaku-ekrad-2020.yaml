abstract: "Bu çalışma, Molla Abdullah el-Betvâtî'nin“Talâku'l-Ekrâd ve Talâku's-Selâs ve Talaku's-Sekrân ve Tuğyâni'l-Evliyâ'i fi'l-Enkiha”adlı eserinnin tahkik ve incelenmesini konu edinmiştir. Çalışmamız üç bölüm halinde hazırlanmıştır: Birinci bölümde müellifin hayatı ve ilmî kişiliği üzerinde durulmuştur. Bu bölümde müellifin adı, künyesi, doğumu, yetişmesi, hocaları, talebeleri, itikadi ve amelî mezhebi, eserleri ve vefatı hakkında bilgi verilmiştir. İkinci bölümde müellifi adı geçen eseri tanıtılmıştır. Bu bölümde eserin ismi, müellife nispeti, telif sebebi, konusu, kaynakları, yöntemi ve esere yöneltilen bazı eleştiriler gibi hususlar üzerinde durulmuştur. Üçüncü bölümde ise adı geçen eserin tahkiki yapılmıştır. Tahkike ayırılan bu bölümde ayet ve hadislerin tahricinin yanı sıra müellifin eserde yer verdiği fıkhi konuların da fıkıh mezheplerinin muteber kaynaklarından tahric edilmiştir. Ayrıca eserin gerekli yerlerine açıklama, hazf ve ekleme gibi bazı değerlendirmelerde bulunulmuştur Araştırdığımız kitapta, insanlar arasında bazı boşanma meselelerinin ele almaktadır. Yazar bu kitapta Kürtler tarafından kullanılan boşanma kelimelerini bahsetmektedir. Ayrıca boşanma ahkamları ve çeşitleri her birini tanımılmıştır. Yazar üç çekim, ihlal etme şertlerini ve dört mezhebe göre sarhoş halinde boşanma meselelerini göstermektedir. Sonra evliliğin esası ve sütunları, kötülüğün durumu hakkında yazıp baba kızını evlenmeye zorladı zamanda ve küçük yaşta evliliği onaylanmayıp ve bu konular hakkında onun asrında mevcut olan bazı geleneklere ve bazı fetvalara itiraz etmiştir."
