abstract: "Bu tezde bir kadının yanında eşi veya mahrem bir yakını olmadan yolculuk yapması meselesi İslâmî açıdan ele alınmış ayrıca sefer ruhsatları açısından kadının erkekten farklı bir yönünün olup olmadığı incelenmiştir. Araştırmamızın birinci bölümünde, seferîlik kavramının sözlük anlamı ve terim anlamına yer verilmiş ardından seferîlik hakkında mezhepler tarafından belirtilen ölçüler delilleriyle beraber özetlenmiştir. İkinci bölümünde, seferîlik sebebiyle İslam dinin getirdiği bazı kolaylıklar (namazların kısaltılması, Ramazan orucunun ertelenmesi vb.) hakkında bilgi verilmiş konu ile ilgili incelemelerde kadının erkekten farklı bir yönünün olmadığı görülmüştür. Araştırmamızın üçüncü bölümünün birinci kısmında, öncelikle Hz. Muhammed'in (s.a.v) kadının yanında eşi veya mahrem bir yakını olmadan yolculuk yapmasına dair hadisleri taksim edilmiştir. Ardından bu hadisler çerçevesinde dört mezhep ulemasının klasik fıkıh kitaplarında yer alan görüşleri ve günümüz ulemasının görüşleri aktarılmış ve sonunda bir değerlendirme yapılmıştır. Üçüncü Bölümün ikinci kısmında, bir kadının yanında eşi veya mahrem bir yakını olmadan hac ibadetini yerine getirmek için yolculuk yapmasına dair Hz. Peygamberin hadisleri serdedilmiş bununla bağlantılı olarak hac ibadetinin kadına farz olup olmadığı dört mezhep ulemasının görüşleri doğrultusunda ele alınmıştır. Sonuç kısmında ise bölümlerin özeti yapılmıştır."
