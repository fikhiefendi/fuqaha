abstract: "Bu çalısmanın amacı, Devletler Özel Hukukunun üç temel kısmından birini olusturan Kanunlar htilafı sisteminde göndermenin tanımlanmasıdır. Bu nedenle, göndermenin unsurlarının neler oldugunun, hangi durumlarda ve ne sekilde gerçeklestirildiginin tespit edilmesi sureti ile slam Hukukunda gönderme teorisinin imkanı meselesi ele alınacaktır. Gönderme, yabancı unsurlu olarak nitelendirilen hukukî ihtilaflarda söz konusudur. Yabancı unsurlu ihtilaflarda, ihtilafa taraf olan hukuk sistemlerinden hangisinin uygulanacagı, baglama kurallarından hareketle tespit edilir. Bunun neticesinde yetkili görülen yabancı hukuka gönderme yapılır. Yabancı unsurla kastedilen, bir ülke devletine nispetle diger ülke vatandaslarının bir ihtilafa taraf olması, ihtilaf konusu seyin yabancı ülkede bulunması, ihtilafa neden hukukî eylemin yahut sonuçlarının burada gerçeklesmesidir. Gönderme kanunlar ihtilafı kuralları ile gerçeklestirilir. Göndermenin yetkili yabancı hukukun kanunlar ihtilafı kurallarına yahut iç hukuk kurallarına yapılmasına ya da yetkili hukukun baska bir hukuk sistemini yetkili görüp buraya gönderme yapmasına baglı olarak gönderme çesitleri ortaya çıkmaktadır. ç hukuk kuralları ile milletlerarası nitelikte gönderme gerçeklestirilemez. Uygulanma alanını özel hukuk ihtilaflarının olusturdugu gönderme, ihtilafa taraf olan ülkeler arasındaki negatif yetki ihtilaflarına baglı olarak ortaya çıkar. slam Hukukunda göndermenin varlıgı, yabancı ülke hukukunun yetkili görülüp, ihtilafın hallinin bu ülke hukukuna bırakılmasına baglıdır. Gönderme neticesinde yetkili yabancı hukuk, ihtilafın getirildigi mahkeme tarafından uygulanmaktadır. Buna karsılık slam mahkemesinde slam Hukukundan baska bir hukukun uygulanmayacagı ilkesi kabul edilmistir. Göndermenin amacı, ihtilafla en sıkı iliski içerisinde olan hukukun tespit edilmesi suretiyle, adâletin saglanmasıdır. slam Hukukuna göre, yabancı unsurlu olsun ya da olmasın herhangi bir hukukî ihtilafa uygulanacak en adil hukuk slam hukukudur. Yapılan göndermenin kamu düzenine aykırı olması halinde yabancı hukukun uygulanmasından vazgeçilir"
