abstract: "Şer'î delillerin kesinliği problemi, fıkıh usûlünün en önemli konularındandır ve Şârî'in buyruğunun temellendirilmesi de buna bağlıdır. Râzî'yle birlikte ilk defa gündeme gelen bu tartışmada, Karâfî, İbn Teymiyye ve Sadrüşşerîa gibi sonraki dönem usulcüler bazı delillere dayanarak şer'î delillerin yakin ifade ettiği görüşünü benimseyerek Râzî'ye eleştiri getirmişlerdir. Râzî, şer'i delillerin kesinlik ifade etmediğini“dille ilgili bilgilerin intikali, bağlamsal unsurlar ve dilde kesinliğe engel durumlar”gibi faktörlere dayandırır. Ona göre şer'î delillerin kesinliğinden bahsedebilmek için bu üç faktörün bulunmaması gerekir. Bu çalışma, Fahreddin er-Râzî'nin Şer'î delillerin kesinlik ifade etmemesi için varlığını zorunlu gördüğü unsurlardan dilde kesinliğe engel durumların mevcudiyeti halinde bunlar arasındaki tercih kriterlerini ortaya koymayı hedeflemektedir. Bu amaçla Râzî tarafından dilde kesinliğe engel durumlar olarak sayılan iştirak, nakil, izmar, mecaz ve tahsis konuları Râzî'nin el-Mahsûl ve el-Meâlim isimli eserleri ve bunlar üzerine yazılan bazı şerhler çerçevesinde ele alınmıştır. Öncelikle Râzî'nin dilde kesinliğe engel durumların mâhiyeti ile ilgili görüşleri kendi metinlerinden hareketle ortaya konmuş ardından bu teorik çerçevenin fıkhî hükümlere yansımaları Karâfî'nin“Risâle fî meseleti te'âruzi'l-ihtimâlâti'l' aşreti'l-muhille bi'l-fehm fi't-tehâtub: el-mezkûra fî kitâbi'l-Mahsûl fî ilmi'l-usûl li'l İmâm Fahreddîn er-Râzî”risalesindeki örnekler üzerinden değerlendirilmiştir."
