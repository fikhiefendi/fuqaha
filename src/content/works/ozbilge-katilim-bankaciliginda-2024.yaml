abstract: "Çalışma kapsamında Türkiye'de katılım bankacılığının bankacılık sektörü içindeki yeri ve karlılığı etkileyen faktörlerin belirlenmesi amaçlanmıştır. Çalışmada, 5 katılım bankasının 2016-2024 yılları arasında çeyreklik verileri panel veri analizi ile incelenmiştir. Veriler Türkiye Katılım Bankaları Birliği'nin Veri Peteği veri tabanından üzerinden temin edilmiştir. Çalışmada bağımlı değişken olarak aktif karlılığı ve özsermaye karlılığı kullanılmıştır. Bağımsız değişken olarak ise Aktif Büyüklük Artış Oranı (BYKL), Kullandırılan Fon/ Toplam Aktif (FON1), Kullandırılan Fon/ Toplam Aktif (FON2), Türk Parası Kullandırılan Fon/ Toplam Kullandırılan Fon (FON3), Toplam Kullandırılan Fon/Toplam Toplanan Fon (FON4) ile Kar Payı Geliri (KARPGEL) kullanılmıştır. Analiz sonuçlarına göre karlılık ile banka büyüklüğü, kullandırılan toplam fonlar (FON4), kullandırılan Türk Lirası fonların (FON3) ve kar payı gelirlerdeki arasında pozitif anlamlı bir ilişki tespit edilmiştir. Çalışma sonuçlarına göre katılım bankalarının yabancı para işlemlerinde beklenen karlılığı sağlayamadığı görülmektedir. Benzer şekilde konvansiyonel bankaların sundukları borçlu cari hesap kredisi (BCH) yine işlemin mal/hizmet karşılığında yapılması gerekliliğinden dolayı katılım bankalarında kullanılamamaktadır. Katılım bankalarının, konvansiyonel bankaları ile rekabet halinde olması nedeniyle konvansiyonel bankaların sundukları finansal ürünlerin benzerlerini şartlara uygun olmak kaydı ile oluşturmaları gerektiği değerlendirilmiştir. Ayrıca katılım bankalarının güçlü yönlü olan finansal kiralama işlemlerinin geliştirilerek yabancı para kullandırımlarının artırılabileceği düşünülmektedir."
