abstract: "İslam Ceza Hukukunda Suça Misliyle Mukabele Prensibi? isimliçalışmamızda Kur'an'da suça misliyle mukabele prensibinin ne şekilde ele alındığı,hadislerin konuya nasıl yaklaştığı, ayetlerle hadisler arasında bir bütünlüğün olupolmadığı, İslam hukuk bilginlerinin konuyu ne şekilde değerlendirdikleri,hukukçuların söylemi ile nasların vaz'ının örtüşüp örtüşmediği gibi sorulara yanıtaranmaktadır.İslam hukukunun en temel kaynağı olan Kur'an'da suça misliyle mukabeleedilmesi gerektiğine dair 9 ayet yer almaktadır. Çalışmamızda, konumuzla doğrudanbağlantılı olduğunu düşündüğümüz dört ayeti referans aldık.Bu ayetlerin her biri kendi içinde iki anlam sahası oluşturacak mahiyetesahiptir. Buna göre ayetlerin ilk yarısı suça ceza verme hakkından ve bu cezanın dasuçun dengi kadar olması gerektiğinden bahsederken; ayetlerin ikinci yarısı, sözkonusu ceza verme hakkının kullanılmayıp suçlunun affedilmesinin kişi için dahahayırlı olacağından, böylesi bir davranışta bulunan kimseye Allah'ın yardımedeceğinden bahsetmektedir.Hadis mecmualarında ulaşabildiğimiz kadarıyla suça misliyle mukabeleedilmesi gerektiğini ifade eden üç tane hadis mevcuttur. Hadislerle ayetler birliktedeğerlendirildiğinde, naslar arasında herhangi bir tenakuz veya nesh söz konusuolmayıp, suça misliyle mukabele prensibinin varlığı belirginleşmektedir"
