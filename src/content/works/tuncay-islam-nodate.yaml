abstract: "ÖZET On dokuzuncu yüzyılın sonlarına doğru ortaya çıkan kredi kartları, klasik dönem fukahâsının karşılaşmadığı yeni bir meseledir. Bu çalışmada kredi kartları sisteminin işleyişi, kredi kartının altı tarafı arasındaki ilişkinin fıkhî niteliği ve hükümleri değerlendirilmiştir. Çalışma, bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, önemi, amacı; meselelerin irdelenme yöntemi ve kaynaklarına dair bilgilere yer verilmiştir. Birinci bölümde kredi kartının kavramsal çerçevesi, ortaya çıkışı ve tarihsel gelişimi, kredi kartları ve benzeri kart türleri, ülkemizde BKM'nin kuruluşu ve kredi kartı sisteminin işleyişi ele alınmıştır. İkinci bölümde kredi kartının altı tarafı arasındaki ilişkinin fıkhî durumu tespit edilmeye çalışılmıştır. Buna göre kart çıkaran kuruluş ile kart hamili, kart çıkaran kuruluş ile üye işyeri, kart hamili ile üye işyeri, üye işyeri anlaşması yapan kuruluş ile üye işyeri, üye işyeri anlaşması yapan kuruluş ile kart çıkaran kuruluş ve kartlı sistem kuruluşları ile üye kuruluşlar arasındaki ilişkilerin fıkhî temellendirilmesi araştırmaya tabi tutulmuştur. Üçüncü ve son bölümde ise İslam hukukunun akid teorisine göre kredi kartları için yapılan işlemlerin veya bu kartlarla işlem yapılması sonucunda doğan hükümler incelenmiştir. Çalışma, varılan neticeleri ve önerileri içeren bir sonuç bölümüyle tamamlanmıştır. Anahtar Kelimeler: İslam hukuku, akid teorisi, kredi kartı sistemi, fıkhî tahlil,"
addedAt: 2026-09-24
