abstract: "İnsanlığın varoluşundan itibaren, insanlar kendilerinde ve elleri altındaki hayvanlarda ortaya çıkan hastalıklara çareler aramışlardır. Bununla birlikte hayatını daha kaliteli bir şekilde sürdürebilmek veya daha uzun bir ömür (ölümsüzlük) için tıp ilmiyle uğraşmışlardır. Tıp ilminin gelişmesiyle kök hücre ve klonlama üzerinde araştırmalar yapmışlardır. Böylece insan hayatını ve neslini, çevre popülasyonunu ilgilendiren biyoteknolojik araştırmalar ortaya çıkmıştır. Bu araştırmalar beraberinde biyoetik tartışmaları gündeme getirmiştir. Biyoetik tartışmaların gündeme gelmesiyle de, İslam dünyasında bu gelişmelere yönelik tartışmalar ortaya çıkmıştır. İnsan embriyosu kullanılarak yapılan kök hücre ve klonlama çalışmaları İslam dünyasında farklı görüşlere sebep olmuştur. Kendini yenileyebilen ve birçok hücreye dönüşebilen yapılara kök hücre denir. Kök hücreler; yetişkin ve embriyonik hücreler olmak üzere ikiye ayrılırlar. Yetişkin kök hücreler kordon kanı, plesenta, kalp, kemik iliği, beyin, akciğer, karaciğer, böbrek, pankreas, deri, göz, testisler, meme ve ovaryum gibi dokulardan oluşturulmaktadır. Embriyonik kök hücreler dört beş günlük embriyolardan, blastocyst yapısındaki iç hücre kütlesinden elde edilmektedir. Kök hücreler, zarar görmüş dokuların iyileşmesinde önemli rol oynamaktadırlar. Klonlama aynı kökten yeni bir dal elde etmek anlamda olan klon kelimesinden gelmektetir. Terim anlamında ise; vücut hücresi ve DNA' nın çekirdeği çıkartılmış yumurta hücresi içerisine konulması ve elektrik şoku yardımıyla bölünüp, büyüyüp gelişmesinin sağlanmasıyla yeni bir canlı elde etme işlemidir. Çekirdek nakli ve embriyo ayrılması olmak üzere iki şekilde yapılmaktadır. Hayvan ıslahında, tarımda üretimin artmasında ve insanların tedavilerinde kullanılmak amacıya klonlama yapılmaktadır. Kök hücre ve klonun embriyodan elde edilmesi ve canlılık kazanıp kazanmadığı konusu sonucunda embriyonun bir canlı gibi yaşamı olduğu düşüncesi bir çok tartışmaya sebeb olmuştur. Devletler kendi hukuklarında kanun ve yönetmelikler ile bu konuya açıklama getirmek istemişler ancak konu yeni olduğu için netlik oluşturamamışlardır. İslam dini açısından, döllenme anı ve rahim duvarına tutunması anından itibaren (döllenme olduktan kırk gün veya yüzyirmi gün öncesi) embiryonun kullanılması veya kullanılmaması üzerine farklı fikirler ortaya çıkmaktadır. İslam insanları araştırmaya ve yeni buluşlar bulmaya izin veren ve teşvik eden bir dindir. Bu konu ile ilgili ayet ve hadislerde, toplumun bir kısmının ilim öğrenmesinin farz-ı kifaye niteliğinde olduğu belirtilmektedir. Ancak insanın şerefli bir varlık olduğunu hatırlatarak onun şerefine, onuruna zarar verecek davranışlardan kaçınılmasını istemektedir."
