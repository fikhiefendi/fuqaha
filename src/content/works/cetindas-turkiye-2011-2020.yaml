abstract: "Yıllardır süregelen mevcut bankacılık ve finans sistemine alternatif bir sistem olarak geliştirilen İslami bankacılık ve finans sistemi sayesinde dini hassasiyeti yüksek olan yatırımcıların ekonomik sisteme katılmaları sağlanmıştır. Risk paylaşımına dayalı ve insan odaklı bu yeni sistem yakın bir geçmişe sahip olsa da hızla büyümüş hem Müslüman hem de Müslüman olmayan bireyleri kendine çekmeyi başarmıştır. Faizsizlik prensibini esas alan İslami finans sistemi dini hassasiyeti yüksek yatırımcılar için birçok sermaye piyasası araçları geliştirmeyi başarmıştır. Bunlardan birisi belli sınırları ve kuralları olan İslami endekslerdir. Dünya üzerinde ilk İslami endekslerin kurulmasıyla yatırımcılara büyük kolaylıklar sağlamak amaçlanmıştır. Belli bazı büyük endeks sağlayıcıları tarafından oluşturulan Dow Jones İslami Piyasa Endeksleri, FTSE Küresel İslami Endeks Serileri ve Kuala Lumpur Şeriat Endeksi bu sistemin dönüm noktası olmuştur. Ülkemizde ise ilk örneği dört katılım bankasının sponsorluğu ile 2011 yılında İslami kriterlere uygun olarak geliştirilen Katılım 30 Endeksidir. 2014 yılına gelindiğinde Katılım 50 ve Model Portföy Endeksleri oluşturulmuştur. Günümüzde BIST'te işlem gören üç İslami endeks bulunmaktadır. Araştırmada İslami endeks ile konvansiyonel endekslerin risk ve getirilerinin ayı ve boğa piyasaları açısından karşılaştırılması amaçlanmıştır. Çalışmanın diğer bir amacı ise iki endeks türü arasındaki nedensellik ilişkisini ve risk yayılımını ortaya koymaktır. Buna yönelik olarak çalışmada Katılım 30, Katılım 50 ve BIST 100 endeksinin performansları Sharpe Rasyo, Minimum Kabul Edilebilir Risk ve Sortino performans ölçütleri kullanılarak karşılaştırılmıştır. Endekslerin getiri performansının karşılaştırılmasında MS-ARMA modelinden, risk performansının karşılaştırılmasında ise MS-GARCH modelinden yararlanılmıştır. Ayrıca endeksler arasındaki nedensellik analizi için geleneksel nedensellik testlerinden ve varyansta nedensellik testinden yararlanılmıştır. Elde edilen bulgulara göre Katılım Endeksleri, BIST 100 endeksinden daha düşük riske sahiptir ve daha yüksek getiri sağlamaktadır. Araştırmanın sonucunda Katılım Endeksinin, BIST 100 endeksinden daha iyi performans gösterdiği bulgusuna ulaşılmıştır."
