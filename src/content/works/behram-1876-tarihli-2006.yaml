abstract: "ÖZETOsmanlı mparatorluğunda III. Selim ile başlayan ilk ciddi reform girişimi,zaman zaman kesintiye uğramış olsa dahi Mustafa Kemal liderliğinde kurulan TürkiyeCumhuriyetine kadar devam etmişti. Bu reformlar iç ve dış baskılar sonucu oluşmuştu.Baskılar sonucu oluşan en önemli reformlardan biri hukukun modife edilmesi veAnayasanın ilanıydı. Sened-i ttifak ile başladığı kabul edilen bu süreç, Tanzimat veIslahat Fermanları ile devam etmişti. Ancak bunlar da istenilen sonucu vermemiş,Osmanlı Devletini içinde bulunduğu zor durumdan kurtaramamıştı. Bunun üzerine siyasi,idari, ve hukuki yapıda kanunlaştırma hareketine girişilmişti. Bunun sonucunda ilkOsmanlı Anayasası olan Kanun-i Esasi kabul edilmişti. Ancak yine aynı Anayasa dayanakgösterilerek Meclis kapatılmış ve otuz yıl sürecek meclissiz bir yönetim başlamıştı.1909'da II. Meşrutiyet'in başlamasıyla 1876 Anayasasında bazı değişiklikler yapılarakdemokratikleştirilmişti.Ülkenin işgali bu Anayasanın da uygulanmasına fırsat vermemiş, yeni kurulanTürkiye Devletinin ilk Anayasası olan 1921 Teşkilat-ı Esasiye Kanunu kabul edilmişti.1924'te eksikleri giderilen bu Anayasa 20 Nisan 1924'te BMM tarafından kabul edilmişti.ANAHTAR KEL MELER: 1876 Kanun-i Esasi, Sened-i ttifak, 1924 Teşkilat-ı Esasi,Anayasa, Islahat Fermanı, Tanzimat Fermanı"
