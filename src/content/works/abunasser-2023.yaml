abstract: "Hz. Ebu Bekir ve Hz. Ömer Dönemlerinde Siyasi Karar Almayı Etkileyen Faktörler Fıkıh Açısından Bir Analiz. Bu araştırmada Ebu Bekir ve Ömer dönemlerinde siyasi karar almayı etkileyen faktörler ele alınmakta ve bu kararlar siyasi bağlam içerisinde fıkıh bakımından analiz edilmektedir. Bu analizden önce iki husus ele alınmaktadır; ilk olarak siyasi kararın tanımı, özellikleri ve o dönemde hangi kavrama karşılık geldiği belirtilmiştir. Yanı sıra mülk, hilafet vazifeleri ve imamın yetkilerini temel alarak o dönemdeki siyasi alanın sınırları belirtilmeye çalışılmıştır. Böylece o dönemdeki siyasi kararlar ile Ebu Bekir ve Ömer'in diğer tasarrufları ayırt edilmiştir. İkinci husus olarak Ebu Bekir ve Ömer'in siyasi karar alma sürecinin fıkhi analizi ele alınmıştır. Bu siyasi kararları ele alan çağdaş fıkıh çalışmalarının konuyu içtihadın üç bölümü altında ele aldığı tespit edilmiştir. Bu sınıflandırma, siyasi karar sürecine yönelik fıkhî bir analiz olarak değerlendirilmiş ve siyasi çerçeve dikkate alınmadan yapılan bu analizin sorunları ortaya konmaya çalışılmıştır. Daha sonra, siyasi kararın fıkhî içtihattan farklı olduğu ama aynı zamanda onunla birkaç yönden bağlandığı tespitimize dayanarak bu sürece siyasi bağlamda yeni bir fıkhi analiz sunulmuştur. O dönemdeki siyasi karar alma sürecini analiz etmek, siyasi kararı etkileyen faktörlerin belirlenmesine katkı sunmuş ve çalışmada bu faktörler (1) referans ve meşruiyet, (2) karar vericinin kişiliği, (3) şura ehli, (4) çevredeki koşullar ve makâsıdü'ş-şerîa şeklinde dörde ayrılmıştır. Bu faktörlerin her biri örnek üzerinden tahlil edilmiş ve siyasi ve fıkhi yönlerin birbirine nasıl bağlandığı ortaya konmaya çalışılmıştır."
