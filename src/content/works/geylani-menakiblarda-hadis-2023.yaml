abstract: "Menkıbe İslam Tarihinde önemli şahsiyetlerin biyografilerinin anlatıldığı eserlere verilen addır. İmam Ebu Hanife ve İmam Şafii de yaşamış önemli iki şahsiyettir. Her ikisinin de kurucusu oldukları mezheplerin çok sayıda müntesibi bulunmaktadır. Bu iki önemli şahsiyetin mezheplerini savunan müntesibleri onların hayatlarını ele alan eserler yazmışlardır ve bu eserlerde onlar hakkında söylenmiş hadisleri eserlerine almışlardır. Bu çalışmada bu hadislerin sıhhat değeri ele alınmış ve gerekli araştırmalar yapılmaya çalışılmıştır. Hadis Hz. Peygamber'in söylemiş olduğu sözlerdir ve çok önem arzeder. Hadisin önemini bilen bazı kişiler hadis uydurma gibi bir işleme girişmişlerdir. Hadis uydurmanın sebepleri çoktur. Kimi zaman fırka ve mezhebi müdafaa gayretinden dolayı hadis uydurulurken kimi zaman da İslam'a hizmet düşüncesi veya İslam'a zarar düşüncesiyle hadis uydurulmaktadır. Bu çalışmada mezhebi öne çıkartmak için uydurulan hadisler incelenmeye ve iki imam olan Ebu Hanife ve Şafii'nin menakıpları üzerinden bu amaca ulaşmaya çalışılacaktır. Çalışmada bazı menakıblarda kullanılan uydurma ve zayıf rivayetler tespit edilip bunların tahric ve tahlili yapılmak suretiyle sahih hadisleri bunlardan ayırmak hedeflenmektedir. Bu çalışmanın asıl amacı bu eserlerdeki kıymetli bilgileri hatalı bilgilerden arındırarak iki imam hakkında sağlam biyografilere sahip olmaktır. Böylece bu çalışma neticesinde menakıblarda hadis rivayet etmenin sebepleri daha iyi anlaşılacak ve hadis uydurmacılığının arka planı ortaya çıkacaktır."
