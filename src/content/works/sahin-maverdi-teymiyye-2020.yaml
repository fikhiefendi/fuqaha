abstract: "Mâverdî'nin el-Âhkâmu's-Sultaniyye ve İbn Teymiyye'nin es-Siyasetü'ş-Şeriyye eserlerinde müelliflerin devlet yönetim anlayışı üzerine ele aldığı konular karşılaştırmalı analiz metoduyla incelenmiştir. Bu çalışma iki bölümden oluşmaktadır. Girişte çalışmamızın amacı, konusu, çalışma sürecinde izlenen yöntem ve bu çalışmaya kaynaklık eden başlıca eserler ve diğer tüm yardımcı kaynaklar tanıtılmaya çalışılmıştır. Birinci bölümde fıkıh literatüründe Ahkâm-ı Sultaniyye geleneğinin ortaya çıkışı ve geçmişten günümüze bu alanda telif edilmiş klasik ve modern çalışmalara örnekler verilmiştir. Mâverdî ve İbn Teymiyye'nin eserlerinin de bu gelenekteki yerlerinin önemi belirtilmeye çalışılmıştır. Eserleri kaleme aldıkları dönemin siyasi ve ictimaî durumu,müelliflerin hayatları ve telif ettikleri diğer eserler tanıtılmış özellikle söz konusu eserleri yazma amaçları yine bu bölümde ele alınmıştır. İkinci bölümde çalışmamızın ana konusu olan iki eserin ortak ve farklı konuları karşılaştırmalı olarak analiz edilmiştir. Karşılaştırma yapılırken konu çeşitliliği ve eser hacmi daha fazla olan Mâverdî' nin eseri temel alınmıştır. Konuların eser içindeki düzeni de onun ele aldığı biçimde verilmiş fakat bazı bölümler konu bütünlüğünü bozmamak adına İbn Teymiyye' nin tercih ettiği şekilde de başlıklandırılmıştır. Anahtar Sözcükler; Devlet, Yönetim, Siyaset Felsefesi, Devlet Başkanlığı, İmamet, Mâverdî, İbn Teymiyye, el-Ahkâmu's-Sultaniyye, es-Siyasetü'ş-Şer'iyye"
