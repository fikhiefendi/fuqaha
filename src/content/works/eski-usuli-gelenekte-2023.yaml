abstract: "Şiî-İmâmiyye içerisinde Ahbârîlik ile Usûlîlik iki farklı bakış açısını temsil etmektedir. Rasyonel yöntemi esas alarak dinî meselelerde nakille birlikte aklî delillere de yer veren Usûlîlik, genel olarak İmâmî düşünce tarihinde hakim bir konumda olmuştur. Usûlî düşünce ortaya çıkmasından günümüze kadar olan süreçte birçok alimin katkılarıyla şekillenmiş ve gelişmiştir. Şehîd-i Evvel lakabıyla bilinen Ebû Abdillâh Şemsüddîn Muhammed b. Mekkî el-Âmilî (ö. 786/1384) bu hususta öne çıkan alimlerden biridir. Giriş, üç bölüm ve sonuç kısmından oluşan bu çalışmada Şehîd-i Evvel'in ilmî kişiliği ve benimsediği görüşleri bakımından Usûlî düşünceye katkıları konu edilmiştir. Bu bağlamda yetiştiği ve bir ilim geleneğinin kurulmasına öncülük ettiği Cebel-i Âmil bölgesinin Şiî-Usûlî gelenekteki yerinin ortaya koyulması amaçlanmıştır. Şahıslar ve fikirler üzerine derinleşme prensibine bağlı kalınmış ve kaynaklardan elde edilen bilgilerin değerlendirilmesiyle sonuca ulaşılmaya çalışılmıştır. Şehîd-i Evvel, Usûlî düşünceyi geliştirmiş ve ictihad hareketini devam ettirmiştir. Akıl deliline önem verip bununla neyin kastedildiğine dair kendinden önceki alimlerden daha fazla açıklama yapmış ve kapsamını genişletmiştir. Ayrıca gaybet döneminde fakihin Cuma namazını kıldırma hususunda imamın iznine sahip olduğunu söylemesi, fakihin zekâtı talep etme hakkı olduğuna işaret etmesi ve humusu idare edecek fakihten mutlak anlamda“gaybet nâibi”olarak bahsetmesi gibi görüşleriyle fakihlerin otoritesinin genişlemesine katkı sunmuştur. Şiî fıkhında kavâid literatürünün ilk örneği olan el-Kavâ'id ve'l-Fevâ'id başta olmak üzere eserlerinde takip ettiği metot ve içerikle gelenekte önemli bir rol oynamıştır."
