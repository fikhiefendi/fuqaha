abstract: "Osmanlı tarihinin mühim kaynakları arasında olan şer'iyye sicilleri, mahkeye intikal eden dava kayıtlarının yanı sıra devlet merkezi ve eyaletlerden gönderilen belgelerin kadı tarafından kopya edilmesi ile teşekkül etmiş defter serileridir. Dolayısıyla hem şehir tarihi araştırmaları hem de genel tarih çalışmaları için önemlidir. Bu çalışmada, Gaziantep tarihine önemli katkılar sağlayacağı düşünülen H. 1098-1099/M. 1686-1687 tarihli 36 Numaralı Ayıntab Şer'iyye Sicilininin (1 ile 107 sayfaları arası) transkripisyon ve değerlendirmesi yapılmıştır. Sicilde, 1686-1687 yıllarında Ayıntab'ın siyasi, idari, askeri, iktisadi ve sosyal tarihine dair önemli kayıtlar yer almıştır."
