abstract: "Çalışmanın amacı, hangi kira sözleşmelerinin 6098 sayılı Türk Borçlar Kanunu?nun konut ve çatılı işyeri kiralarına ilişkin hükümlerinin kapsamında olduğunun tespiti ve kimlerin, hangi hallerde konut ve çatılı işyeri gereksinimi sebebiyle kira sözleşmesinin sona erdirilmesini talep edebileceğinin ve bunun hangi yolla yapılacağının belirlenmesinden ibarettir. Çalışma, giriş ve üç bölümden oluşmaktadır: Birinci Bölümde; 6098 sayılı Türk Borçlar Kanunu?nun konut ve çatılı işyeri kira sözleşmeleri kiraları hakkında özel hükümlerin uygulama alanı ele alınmıştır. İkinci Bölümde; 6098 sayılı Türk Borçlar Kanunu kapsamında konut ve çatılı işyeri gereksinimi sebebiyle kira sözleşmesini talep edebilecek kişiler, zorunlu konut ve çatılı gereksiniminin hangi şartlarda varlığının kabul edileceği, dava açma süresi, yeni malikin konut ve işyeri gereksinimi sebebiyle kira sözleşmesinin sona erdirilmesini talep şartları ve tüzel kişinin konut ve çatılı işyeri gereksinimi sorunu ele alınmıştır. Üçüncü Bölümde; 6098 sayılı Türk Borçlar Kanunu kapsamında konut ve çatılı işyeri gereksinimi sebebiyle açılacak davanın tarafları, davanın görüleceği mahkeme ve davanın sonuçları ele alınmıştır. Anahtar Sözcükler 1- 6098 sayılı Türk Borçlar Kanunu?nun Konut ve Çatılı İşyeri Kiralarına İlişkin Hükümleri 2- Kira Sözleşmesi 3- Konut Gereksinimi 4- İşyeri Gereksinimi 5- Yeni Malikin Gereksinimi 6-Tüzel Kişinin Konut ve İşyeri Gereksinimi"
