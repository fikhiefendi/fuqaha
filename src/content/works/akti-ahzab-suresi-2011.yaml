abstract: "İslam Hukuku Câhiliye ahkâmının hükümlerini kimi zaman olduğu gibi devam ettirmiş, kimi zaman ıslah ederek yeni bir şekil vermiştir. Bu iki durumun mümkün olmadığı veya câhiliye ahkâmının ele almadığı meselelerde ise İslam Hukuku yeni hükümler vaz etmiştir.Ahzâb Sûresi bu bağlamda câhiliye hukukundaki zıhar ve evlatlık hükümlerini tanımamış, bunun yerine talak konusunu ayrıntılı bir şekilde işlemiş, evlatlık alanında ortaya çıkan boşluğu ise yetimi gözetme, lakît, mevlâ gibi müesseselerle doldurmuştur. Kadının örtünme hususunda ise toplumun bir kesiminde var olan cilbâb ve hicâb uygulamasını gün yüzüne çıkararak teberrüc kavramı ile birlikte kadının kıyafetinin mâhiyetini yeniden belirlemiştir. İctimâî hayatta özel hayatın gizliliği ilkesinin korunması için isti'zân meselesini gündeme getirmiş, câhiliyedeki uygulamayı eleştirmiştir.Daha çok aile hukukuna dair hükümler içeren Ahzâb Suresi Hz. Peygamber'in hayatına dair birçok bilgi vermekte kendisine ve ailesine özel olarak vaz edilen hükümleri zikretmektedir. Hz. Peygamber'in örnekliği ve hüküm koyma yetkisi üzerinde durmakta mü'minlerin onun karşısındaki konumuna vurgu yapmaktadır.İslam Hukuku içerisinde müstakil bir hata nazariyesi olmamasına rağmen hataen yapılan tasarrufların hükmünün ne olacağı sûrede yer alan âyete göre belirlenmiştir."
