abstract: "Bu çalışmada Azerbaycan Türkçesinde ilk tefsir olma özelliğini taşıyan Bakuvi (ö. 1938)'nin Keşfü'l-Hakayık an-Nüketi'l Ayati ve'd-Dakayık isimli tefsirinde ahkam ayetleri mukayeseli olarak değerlendirilmiştir. Şii ve Sünni müfessirlerin görüşleri Bakuvi'nin görüşleri ve tercihleri ile karşılaştırılmıştır. Çalışmanın en önemli amaçlarından biri mezhep çatışmalarının arttığı bir zamanda taassuptan uzak birleştirici bir üslupta yazılmış bu tefsiri tanıtmak ve yüz yıl önce olduğu gibi şimdi de ümmeti ittihat ve ittifaka çağırmaktır. Giriş ve iki bölümden oluşan çalışmamızın ilk bölümünde müfessirin şahsiyeti, faaliyetleri ve ilmi kimliği araştırılmış, eserleri tanıtılmıştır. İkinci bölümde ahkam ayetleri, Şii ve Sünni kaynaklar ve klasik tefsirler kullanılarak delillendirilmiş, Bakuvi'nin de bu konulardaki görüşleri nakledilmiştir. Bu çalışmada Azerbaycan Türkçesinde ilk tefsir olma özelliğini taşıyan Bakuvi'nin Keşfü'l-Hakayık isimli tefsirinde ahkam ayetleri ile ilgili görüşlerinin değerlendirilmesi amaçlanmaktadır."
