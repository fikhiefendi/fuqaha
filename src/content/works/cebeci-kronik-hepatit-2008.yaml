abstract: "Kronik hepatit C infeksiyonu dünyadaki yaygınlığı, bulaş şekillerinin tam olarak bilinmemesi ve karaciğer sirozu ve hepatoselüler kanser ile yakın ilişkisi nedeni ile çok önemli bir toplum sağlığı sorunudur. Halen tek etkili tedavi seçeneği interferon alfa ve ribavirin kombinasyonu şeklinde uygulanan immünomodülatuvar/antiviral tedavidir. Tedaviye yanıtın önceden tahmin edilmesi, gereksiz/etkisiz tedavi uygulamalarını engelleyerek kişiye göre en uygun maliyet etkin tedavi olanağı sağlamaktadır.Çalışmaya Ocak 2004 - Haziran 2008 tarihleri arasında GATA Haydarpaşa Eğitim Hastanesi'nde tedavi alan, yaşları 24 ile 67 arasında değişmekte olan toplam 34 kronik Hepatit C virus infeksiyonlu hastalar alındı. Tamamına PEG-interferon + ribavirin tedavisi uygulandı. Tedaviye yanıtta etkisinin olabileceği tahmin edilen tedavi öncesi parametreler (yaş, cinsiyet, vücut kitle indeksi, karaciğer enzimleri, lipid profili, HCV-RNA yükü, genotip, karaciğer biyopsi incelemeleri) değerlendirildi. Bu parametreler ile kalıcı viral yanıt arasında ilişki araştırıldı.Bulgularımız daha genç, düşük kilolu, düşük histolojik aktivite ve fibrozis derecesine sahip, GGT düzeyleri ve GGT/ALT oranı düşük, HCV-RNA yükü daha az olan ve erken viral yanıt alınabilen hastalarda kalıcı viral yanıt oranlarının daha yüksek olduğunu düşündürmektedir. Çalışmamızda nüks etmiş hastalarda yeniden standart kombine tedavi uygulanması ile başarı şansının arttığını ve PEG-interferon alfa 2a ve ribavirin ile uygulanan standart kombine tedavide sonuçların ümit verici olduğunu da gözledik."
