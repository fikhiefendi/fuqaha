abstract: "İmam Şâfiî hayatının önemli bir bölümünü teşkil eden ilim yolculuğu ve arayışları neticesinde bugün kendisine izafe edilen mezhebinin temellerini atmıştır. Onun bu arayışları neticesinde fıkhî kanaatlerinde olduğu gibi mala dair tasavvurları da şekillenmiştir. Bu çalışmada İmam Şâfiî'nin sahip olduğu mal tasavvuru ve bu tasavvurun fürû-i fıkıh sahasında ne gibi neticeler doğurduğu, gerekli görülen bazı hususlarda sonraki dönem Şâfiî kaynaklarından da istifade edilerek tespit edilmeye çalışılmıştır. Neticede İmam Şâfiî'nin mal tasavvuru ortaya konacağından Şâfiî mezhebinin mal anlayışının ana çerçevesi bir arada görülebilecektir. Zira sonraki dönemlerde kaleme alınan Şâfiî kaynaklarına bakıldığında İmam Şâfiî'nin ortaya koyduğu mal anlayışının, bazı hususlarda değişim ve dönüşümler yaşanmakla beraber genel olarak takip edildiği tespit edilmiştir. İmam Şâfiî, mal anlayışı bakımından birçok âlime çeşitli açılardan muhalefet etmekle birlikte en esaslı değerlendirmelerini yönelttiği kesimlerden biri de Hanefî mezhebine müntesip âlimlerdir. Bundan dolayı İmam Şâfiî'nin mal anlayışının bağlamının tespit edilebilmesi için Hanefî mezhebinin erken dönemindeki mal tasavvurları üzerinde durulmuş ve gerekli yerlerde sonraki dönem çalışmalarından da istifade edilmiştir. Diğer birçok âlim gibi İmam Şâfiî de şeylerin mal sahasında değerlendirilebilmesi için çeşitli kriterler öne sürmüştür ki bunları; insanlara fayda sağlamak, şer'an mübah olmak, satım akdine konu edilebilmek ve teaddî halinde hukuki koruma altına alınabilmek şeklinde özetlemek mümkündür. Koşulan bu şartlar dikkate alındığında satım akdine konu edilebilecek şer'an mübah malî kıymet taşıyan şeylerin, mal kabul edildiği belirtilebilmektedir. İmam Şâfiî, şeylerin mal kabul edilebilmesi için bahsi geçen şartları koştuğundan dolayı Ehl-i kitabın mal edindiği domuz ve şarabı, onlar açısından da mal kabul etmeyerek hukuki koruma sağlamamış ve tahir olmayı bir mal kriteri olarak öne sürmüştür. Ancak tahâret vasfından yoksun olan köpek ve necis yağ gibi bazı şeyleri mal kabul etmediği halde ihtisas hakkına konu ederek bunlardan mübah yollarla istifade edilmesinin kapısını aralamıştır. Ayrıca mal sahasında değerlendirilebilmek için mübah bir malî kıymet taşımayı yeterli gördüğünden fiziki bir varlığa sahip olmayı şart koşmamıştır ki zikredilen bu gibi hususlar, İmam Şâfiî'nin mal tasavvuru bakımından Hanefî âlimlerden farklı bir kanaat benimsediği temel noktalardır. Onun bu anlayışında genel olarak naslara, özelde ise hadislere yaklaşım biçiminin etkili olduğu tespit edilmekte, benimsediği usûlî arka planın diğer bazı etkenlerle birlikte İmam Şâfiî'nin özellikle de Hanefî âlimlerden farklı bir mal anlayışı benimsemesine sebebiyet verdiği görülmektedir."
