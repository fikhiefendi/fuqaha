abstract: "Osmanlı Devleti, temeli adalet olan güçlü bir teşkilattır. Bu yapı, büyük bir titizlikle korunmaya çalışılmıştır. Bunu en iyi o döneme ışık tutan hukuki belgeler sayesinde öğrenmekteyiz. Osmanlı Hukuki belgelerinin bir türü olan şer' iye sicilleri, dönemin birçok açıdan aydınlatılmasında yardımcı olmaktadır. Bu çalışmanın konusu olan 55 numaralı Kütahya şer'iye sicil defteri, ait olduğu H. 1297-1298-1299 /M. 1880-1881-1882 yıllarında Kütahya ve çevresinin dolayısıyla Osmanlı Devleti'nin sosyal, siyasal, ekonomik ve kültürel yapısı ile ilgili bilgiler vermektedir. 55 numaralı Kütahya şer' iye sicili, mahkeme kayıtlarını içermektedir. Mahkeme kayıtlarını; tezkere, vakıf, miras, tereke, müzekkere, resmi yazışmalar ve vekil tayini gibi belgeler oluşturmaktadır. 49 varaktan oluşan bu belgelerin bazı sayfalarında yazılar silik çıktığı için buralar (…) işareti ile gösterilmiştir. Çalışma: Özet, içindekiler, giriş, birinci bölüm (Türk Hukuk Tarihi'nin Anahatları), ikinci bölüm (55 numaralı Kütahya şer'iye sicilinin transkripsiyonu), genel bir değerlendirmenin yapıldığı sonuç kısmı ve kaynakçadan oluşmaktadır."
