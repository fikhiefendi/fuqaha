abstract: "Bu çalışmada klasik devir Osmanlı hukukundaki hükümet gelirlerinden ve şer'î vergilerden biri olan cizye ele alınmıştır. Cizye, Osmanlı İmparatorluğu'nun askerlik yapabilecek pozisyonda olan gayrimüslim vatandaşlarından, zimmet akdi çerçevesinde alınan bir baş vergisidir. Cizye veren vatandaşlar, askerlik vazifesiyle mükellef tutulmamaktadır. Vergi olması itibarıyla cizyede takdir edilme yolu, tahakkuk vakti, mükellef, muaf, miktar, tahsil vakti, tahsil usulü, tahsildar, harcandığı yer ve mükellefiyetin sona ermesi gibi hukuki unsurlar vardır. Osmanlı devrinde kullanılan kitâbü'l-harâclar, fıkıh kitapları ve fetva mecmuaları kullanılarak bu unsurlar tespit edilmiş, vatandaşlık ve vergi hukuku disiplinlerinde cizyenin teorik zemini gösterilmiştir. Cizye, teorinin yanında Osmanlı İmparatorluğu'nun klasik devrinde şer'î esaslar gözetilerek geniş bir sahada tatbik edilmiştir. Tatbikatın görülmesi için devre ait mahkeme kayıtları, kanunnameler, arşiv vesikaları ve seyahatnameler kullanılmıştır. Elde edilen bilgiler hukuki tasnif ile derli toplu bir şekilde ortaya konmuştur. Cizyenin yalnızca bir gelir kalemi olmadığı, hukuki sistematiğe sahip bir vergi olduğu ve teori ile pratiğin uyuştuğu anlaşılmıştır."
