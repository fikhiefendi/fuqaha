abstract: "Davranışsal finans, davranışsal ve bilişsel psikolojik teoriyi geleneksel ekonomi ve finans ile birleştirerek insanların ekonomik kararları için açıklamalar sağlamaya çalışan, nispeten yeni fakat hızla genişleyen bir alandır. Davranışsal finans araştırmalarının gelişimini hızlandıran, rasyonel yatırımcıların etkin piyasalar çerçevesinde geleneksel beklenen fayda maksimizasyonunun birçok ampirik modeli açıklamadaki yetersizliği olmuştur. Davranışsal finans, hem bireysel hem de grup olarak insan davranışına dayalı açıklamalar getirerek bu tutarsızlıkları çözmeye çalışmaktadır. Davranışsal finans, duygu, bilişsel önyargılar ve diğer psikolojik faktörlerin finansal karar verme ve dolayısıyla finansal piyasalar üzerindeki etkisini inceleyen davranışsal iktisat ile yakından ilgili bir alandır. Özellikle davranışsal finans, bu tür faktörlerin irrasyonel yatırım davranışında oynadığı rolü ve bunun piyasa dalgalanmalarındaki sonuçlarını vurgulamaktadır. Bu çalışmanın amacı Katılım Bankacılığında davranışsal finans etkisinin ortaya konulmasıdır. Bu amaç doğrultusunda gerçekleştirilen anket çalışmasına Katılım Bankalarında çalışan 372 kişi katılmıştır. Araştırma sonucunda katılımcıların yaşı, eğitim durumu, medeni durumu, kurum hizmet yılı, mesleki kıdem ve gelir durumu ile Davranışsal Finans Etkisi bakımdan anlamlı olarak farklılaşmakta iken; katılımcıların cinsiyet durumu ile Davranışsal Finans Etkisi bakımdan anlamlı olarak farklılaşmadığı sonucuna ulaşılmıştır."
