abstract: "Her geçen gün yeni çalışmalarla gelişen yapay zekâ özellikle tahminleme çalışmalarıyla belirsizlik içinde yaşadığımız anları aydınlatmaktadır. Öngörünün son derece önemli olduğu finans alanında gelecek durum ve rakamlarla ilgili tahmin yürütebilmek hayati olduğundan dolayı; bankacılık, sektör olarak yapay zekadaki gelişmelerin önde gelen takipçilerinden olmuştur. Konvensiyonel bankacılık sisteminde agresif uygulamalara ve alternatiflere açık olsa da katılım bankacılığında İslami prensiplerin oluşturduğu kısıtlarla hareket alanı daralmakta ve aksiyonların en doğru seçenek olması önem kazanmaktadır. Bu çalışmanın amacı yapay zekâ destekli modellerle katılım bankacılığının gelişimine katkı sunmaktır. Bu amaç doğrultusunda konuyla ilgili detaylı araştırmalara yer verilip analizler yapılmış, uygulama olarak kümeleme ve birliktelik analizi ile yapay zekâ destekli ürün önerme modeli kurulmuştur. Bu modelle her bir müşteriye en doğru ürünün önerilmesiyle müşteri aktifliği ve sadakati arttırılması amaçlanmaktadır."
