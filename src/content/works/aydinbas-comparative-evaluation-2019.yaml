abstract: "İnsanlık tarihinin farklı dönemelerinde mülkiyet olgusunun üretim-bölüşüm-tüketim organizasyonundan başlayarak, toplumsal yapıya, devletin rolü ve organizasyonuna kadar geniş bir alanda etkili olduğu gözlemlenebilmektedir. Mülkiyet sadece hukuki bir hak değil; aynı zamanda sosyal ve iktisadi bir kurumdur. Mülkiyet anlayışının, üretim araçları üzerindeki denetim hâkimiyetini belirleyen hiyerarşi üzerinden; üretim organizasyonundan toplumsal tabakalaşma formalarına kadar birçok iktisadi ve sosyal dinamikte belirleyici olduğu söylenebilir. Bu çalışmada modern kapitalist mülkiyet anlayışı, insanlık tarihinin farklı dönemlerinde mülkiyet anlayışında meydana gelen değişimler üzerinden ortaya konulmuştur. İslam'ın mülkiyet anlayışı, İslâm İktisat Düşüncesinin temel kaynaklarından hareketle belirginleştirilmeye çalışılmış, modern kapitalist mülkiyet anlayışı ile arasındaki farklar ve bu farklılıkların sebep olduğu sosyal, hukuki, iktisadi etkiler üzerinden karşılaştırmalı bir analiz yapılmıştır."
