abstract: "Ashâb-ı Kirâm (r.a.) Rasulüllah'ın (s.a.v.) ilk muhataplarıdır. Bu insanlar, Kur'ân-ı Kerîm ve hadis-i şeriflerde pek çok defa övülmüştür. Müslümanlar için örnek bir nesil olmuştur. Onların içinde bazısı sahabenin büyüklerinden sayılmıştır. Bir kısmı da Rasulüllah'ın (s.a.v.) ağzından cennetle müjdelenmiştir. Bunlardan on kişi aşere-i mübeşşere adıyla meşhur olmuştur. Tezimizin odağı olan Abdullah b. Mesud (r.a.) hem sahabenin büyüklerinden addedilmiş hem de bir rivayete göre cennetle müjdelenen on kişi içinde yer almıştır. Kendisi ilk Müslümanlardandır. Rasulüllah (s.a.v.) dönemindeki bütün savaşlara katılmıştır. Bütün bu meziyetleri yanında kendisinin ashap içinde öne çıktığı yönü ise ilmidir. İbn Mesud (r.a.) sahabenin fakihlerinden sayılmıştır ve bu hususta Efendimiz'in (s.a.v.) duasına mazhar olmuştur. Ayrıca günümüze kadar gelen dört fıkıh mezhebinden Hanefî mezhebinin ilmî silsilesi kendisine dayandırılmıştır. Ebû Hanife'nin (rh.a.) fıkıh ilmindeki silsilesi sırasıyla Hammad b. Ebû Süleyman, İbrahim en-Nehaî ve Alkame b. Kays vasıtasıyla Abdullah b. Mesud'a (r.a.) bağlanmaktadır. Öte yandan Hanefîler ondan gelen rivayetlere ayrı bir önem atfetmiştir. Tercihleri genelde onun tercihleri ile paralellik göstermiştir. Aradaki bu ilişkinin teorik olmadığı, bilakis pratikte birebir gözlemlendiği, işbu tezde ortaya konulmak istenmiştir. Bu amaç doğrultusunda Hanefîlerin fıkıh alanındaki temel kaynaklarından Serahsî'nin Mebsût adlı mutavvel eseri, çalışmanın merkezine alınmıştır. Zira mezkûr eser Abdullah b. Mesud'un (r.a.) fıkhını izhar eden rivayetleri içerme ve bunlar hakkında Hanefîlerin takındığı tavrı gösterme açısından büyük önemi haizdir. Bu doğrultuda, Abdullah b. Mesud'un (r.a.) el-Mebsût'ta bulunan fıkhî rivayetlerinin tespit edilip söz konusu rivayetlerin müellif tarafından hangi suretlerde değerlendirmeye tabi tutulduğunun ana hatlarıyla ortaya konulması planlanmıştır. Hanefîlerin bu rivayetleri ne şekilde değerlendirdiğinin tespiti, Mebsût'ta ve seçilen diğer Hanefî kaynaklarında verilen açıklamalar muvacehesinde yapılmaktadır."
