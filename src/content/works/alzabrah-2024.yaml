abstract: "Günümüz dünyası, birçok ekonomik kriz ve sorunlarla karşı karşıyadır. Bunun temelinde, her insanın istikrar arzusu ve bilinmez gelecekten korkusu yatmaktadır. Bu nedenle İnsanoğlu, kurtuluşunu sağlayacağını düşündüğü sistemler oluşturulmaya girişti. Oysaki, İslam, dünya ekonomik sorunlarını çözen kapsamlı bir sistem getirmiş ve ekonomik sınıflandırmayı ortadan kaldırarak adalet ve eşitliği sağlamıştır. Bu bağlamda, tezimiz, İslam'ın yoksulluğu ve sınıflandırmayı ortadan kaldırmadaki rolünü açıklamaya çalışmaktadır. Tezimiz üç bölüme ayrılmıştır. Birinci bölümde, ekonomik sınıflandırma ele alınmaktadır. Farklı ekonomik sistemlerin, kapitalizmin, sosyalizmin ve İslam'ın tanımıyla ilgili ve her bir sistemin kendine özgü özelliklerini fikirlerini ve değişik versiyonların ele almaktadır. Bölüm, İslami sistem ve iktisadi hayatı kapsayıcılığı mevzusuyla sona ermektedir. Tezimiz, ikinci bölümünde, ekonomik sistemleri tarihsel olarak ele almakta ve bunların ekonomik sınıflandırmayı oluşturmada veya bunları çözme üzerindeki etkilerini tartışmaktadır; Reform hareketlerinde ve geleneksel sistemlerdeki önemli değişiklikleri irdelemekte, ortaçağlardan Rönesans'a kadar geçmişten günümüze kadar sınıflandırmayı besleyen ve yeni bir küresel ekonomik çağa temel oluşturan önemli aşamaları incelemektedir."
