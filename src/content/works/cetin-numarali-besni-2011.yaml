abstract: "Siyasal olaylar bölgelerin sosyo-kültürel ve ekonomik gerçeklerinden ayrı düşünülemez. Bu olgular birbirlerini etkilemektedir. Transkripsiyon ve değerlendirmesi yapılan 196 Numaralı Besni Şer'iyye sicilinde 1910?1912 yılları arasında bölgenin sosyal, kültürel ve ekonomik durumlarına ait tespitlerde bulunulmuştur. Bu değerlendirmeler neticesinde bölgede asayiş sorunlarına rastlanılmamıştır. Kadının toplum hayatındaki etkinliğinin yanında din değiştirme hareketlerine karşı Gayr-i Müslim ahalinin önyargılı hali görülmüştür. İdare mekanizmasının ve Müslüman ahalinin dini konulardaki hassas tavrı belgelere yansımıştır. Mahkeme süreçleri, bölgenin ekonomi yapısı, Müslim ve Gayr-i Müslim ahali arasındaki ilişki, vakıflar ve mahalli yapılanma konusunda tespitlerde bulunulmuştur. Şer'iyye Sicilleri bu açılardan tarihe kaynaklık eden kıymetli belgelerdir."
