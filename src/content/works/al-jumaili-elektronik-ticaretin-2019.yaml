abstract: "İslam Dininin bakış açısına göre modern ekonomik ve mali işlemlerle ilgili bir çalışma yapılmasının önemli olduğunu düşündüğim için böyle bir çalışma yapmayı uygun gördüm. Çünkü İslam'ın temel kaynağı olan Kitap ve Sünnet nassları müsteşriklerin iddia gibi sadece kendi dönemine has olarak gelmemiş aksine sözü geçen nasslar bütün zamanları kapsayacak şekilde gelmiştir. Araştırmamızda Kitap ve Sünnet naslarının fıkıh usulündeki içtihat ve kıyas alanı biryana kendi yapısı gereği geniş boyutlu ve kapsayıcı özellikte olduğuna değinilmiştir. Günümüzde İslam dini mensuplarının mali ve ekonomik yönden birçok problemle karşı karşıya kaldığı görülmektedir. Bu çalışmada tespit ettiğimiz bazı sorunlar açıklığa kavuşturulmaya çalışılmışıtır. Birincisi, günümüzde finansal işlemlerin nasıl yürmekte olduğu ele alınmış, ardından çağdaş finansal işlemlerle ilgili İslam dini'nin ve fıkıh usulünde hükme ulaşma yöntemlerinden biri olarak görülen kıyasın söz konusu finansal işlemlerle ilgili bir hükmünün olup olmadığı ele alınmıştır. Şayet İslam dini ve kıyasa göre sözü geçen problemlerin bir hükmü varsa o hükme nasıl ulaşıldığı konusuna değinilmiştir. Günümüzde uygulanan, elektronik mali ve bankacılık işlemler açık ve basit bir şekilde hatta her okuyanın rahatlıkla muhtevasını anlacağı bir üslupta ele alınmıştır. Tezin giriş bölümünde ekonomik ve finansal faaliyetler yer almaktadır. Ayrıca İslam Dininin ekonomik sistemine, anapara sistemine ve ekonomi ile ilgili malumat veren ekollere yer verilmiştir. Birinci bölümde insanlar arasındaki işlemlerde nakit paranın kullanımı konusuna değinilmiştir. İkinci bölümde ise daha çok elektronik ticaret konusu işlenmiştir. Üçüncü bölümde elektronik paranın kullanımı ve bu bağlamda (kredi kartı borsa ve Forex) konuları açıklanmıştır."
