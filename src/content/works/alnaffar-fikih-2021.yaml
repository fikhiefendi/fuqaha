abstract: "Bu çalışma şer'i siyasette fikih üsülü yöntemini ele almıştır. Bu yöntem İmamü'l Harameyn Abdulmelik bin Abdullah el-Cüveynî'nin (ö. 487/1085) temayüz ettiği ve diğerlerinden ayrıldığı bir yöntemdir Mukaddimede araştırmacı çalışmanın konusunu, sorunu, sorularını, sınırlarını, gerekliliklerini, önemini, konunun seçilme nedenlerini, hedeflerini, yöntemini, kaynaklarını, önceki çalışmaları ve araştırma planını ele almıştır. İlk bölümde ise araştırmacı çalışmanın kavramlarını, İmam Cüveynî'nin hayatını, Selçuklu veziri Nizamülmülk'e ulaşan siyasi ve usuli telifleri, şer'i siyaset ile genel olarak İslam siyasi mirasında fikir usullerinin karşılaştırılmasına dair yöntemi ve İmam Mâverdî'nin üslubunu işlemiştir. İkinci bölümde çalışmada Kuran, sünnet, ve ikisi ile ilgili istinbat kaideleri ele almıştır, ayrıca icma delilini ve bu üç delilin İmamü'l Harameyn'e göre şer'i siyasetteki etkisi ele alınmıştır. Üçüncü bölümde ise çalışmada kıyas delili, ve diğer ferii deliller İmamü'l Harameyn'e göre şer'i siyasete olan etkisi ele alınmış ve bu bölüm İmamü'l Haremeyn'in şeriat fakültelerinin ve amaçlarının açıklanması hususundaki görüşleri ve şer'i siyasete olan tesirinin incelenmesiyle sonlandırılmıştır. Hatime kısmında araştırmacı bu çalışmanın en önemli sonuçlarını aktarmıştır. Anahtar kelimeler: Usulü fıkıh, Şer'i siyaset, fıkıh üsülü delileri, İmam Cüveynî, Gıyasü'l-ümem, El-bürhan fi üsülüfkh, fıkıh üsülü etkisi T.C. NECMETTİN ERBAKAN ÜNİVERSİTESİ Sosyal Bilimler Enstitüsü Müdürlüğü"
