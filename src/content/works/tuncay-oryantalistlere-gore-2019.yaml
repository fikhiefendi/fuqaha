abstract: "Bu çalışmada oryantalist yada şarkiyatçı olarak adlandırılan batılı İslam araştırmacılarının, Müslümanların ortak şuuru olarak bilinen ve asli deliller arasında Kitab ve sünnetten sonra üçüncü sırada yer alan icmâ hakkındaki görüşleri ele alınmaktadır. Bu itibarla çalışmamızın asıl amacı oryantalistler ve eserleri hakkında kısa bilgi sunarak onların icmâ ile ilgili yaptıkları çalışmaları, çalışma usûllerini ve icmâ ile ilgili görüşlerini ortaya çıkarmaktır. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte konunun amacı, önemi, kaynakları, yöntemi ifade edildikten sonra birinci bölümde genel olarak oryantalizm kavramı üzerinde durulmuş, oryantalizmin çıkış sebepleri ve tarihsel gelişimi ele alınmıştır. Yine bu bölümde icmâ kavramı açıklandıktan sonra icmânın rükünleri, gerçekleşme imkânı, türleri, kaynak değeri, hükmü işlenerek icmâ örneklerine yer verilmiştir. İkinci bölümde ise Goldziher, Hurgronje, Schact, Coulson, Bernand, Makdisi, Johansen, Calder ve Hallaq'ın icmâ deliline dair yaklaşımları tahlil edilmiş, elde edilen sonuçlar ifade edilerek çalışma sonlandırılmıştır."
