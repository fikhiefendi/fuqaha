abstract: "Bankacılık geçmişten günümüze kadar finans sektörü için her zaman kritik öneme sahip olmuştur. Dünyada ve Türkiye'de hacmini gittikçe arttıran katılım bankacılığı toplumda bütün kesimlerin bankacılığa yönelik ihtiyaçlarının karşılanması amacıyla modern anlamda 1950'lerden sonra finans sektöründe yerini almıştır. Bu çalışmada, AAOIFI (İslami Finansal Kuruluşlar İçin Muhasebe ve Denetim Organizasyonu) tarafından bağımsız denetim uygulamaları kapsamında yayımlanan ve KGK (Kamu Gözetim, Muhasebe ve Denetim Standartları Kurumu) tarafından Türkçeye çevrilen faizsiz finans denetim standartlarının iç denetime olabilecek katkıları incelenmiştir. Çalışmada ayrıca Türkiye'de katılım bankacılığında uygulamalarda standardın sağlanmasına yönelik TKBB (Türkiye Katılım Bankaları Birliği) bünyesinde kurulan merkezi danışma kurulu ile bankaların danışma komiteleri incelenmiştir. Katılım bankacılığı bağımsız denetim ile iç denetim uygulamaları karşılaştırmalı olarak ele alınmıştır. Son yıllarda Türkiye'deki katılım bankaları tarafından sıkça kullanılan teverruk ürününün iç denetim yapılanması vaka olarak ele alınmıştır. Temelde nakit para elde etmek için kullanılan teverruk ürünü Türkiye'deki katılım bankaları tarafından borcunu ödeyemeyen müşterilerin borçlarını yapılandırmada, likidite teminine yönelik ve fatura olmadığı durumlarda kredi vermek için kullanılmaktadır. Çalışmada, teverruk için denetim rehberi oluşturulmuş riskler belirlenmiştir. TKBB ve AAOIFI teverruk standartlarından faydalanarak kontrol noktaları oluşturulmuş iç denetçi tarafından yürütülecek saha denetimi faaliyetleri vaka olarak gerçekleştirilmiştir. Bulgular ve sonuçlar elde edilerek yönetici özetine taşınacak hususların ve önerilerin yer aldığı raporlama faaliyeti ile iç denetim uygulaması sonuçlandırılmıştır."
