abstract: "Hicrî VII. asrın sonları ile VIII. asrın ilk yarısında Şam bölgesinde yaşamış ve kendisinden sonra gelen birçok alimi etkilemiş olan büyük İslam hukukçusu İbn Kayyim el-Cevziyye'nin gerek fıkıh ilmindeki yeri gerekse ileri sürdüğü fıkhî görüşleri hakkında tartışmalar günümüzde de devam etmektedir. Onun mutlak müctehid olduğunu iddia edenlerin yanında, özelde hocası İbn Teymiyye'nin genelde ise Hanbeli mezhebinin görüşlerini olduğu gibi taklit eden bir fıkıhçı olduğunu söyleyenler de bulunmaktadır. Bu çalışmamızda şer'î hükümlerin istinbatı yahut mahkemede iddia edilen davanın ispatı için gerekli olan \"şer'î delilleri\", bu delillerin mâhiyet ve keyfiyetine dair İbn Kayyim el-Cevziyye'nin görüşlerini ve delillerden hüküm çıkartırken takip ettiği ilke ve esasları fıkıh usulü sistematiğine göre incelemeye çalıştık. Araştırmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde konunun önemine, araştırmanın kaynaklarına ve araştırmada takip edilen metoda değinilmiştir. Birinci bölümde İbnü'l-Kayyim'e göre \"delil\" kavramı tanımlanmış, hükmü ispat eden delillerin özellikleri zikredilmiş ve şer'î delillerin farklı açılardan taksimatı yapılmıştır. Fıkıh usulu sistematiğine göre Kitap, sünnet, icmâ, kıyas, sahabî kavli, mesâlih-i mürsele, istihsan, sedd-i zerâi', şer'u men kablenâ, örf gibi şer'î delillere dair İbnü'l-Kayyim'in görüşleri ele alınmıştır. Birinci bölümün son kısmında deliller arası teâruz durumu ve teâruzu gidermede İbnü'l-Kayyim'in takip ettiği metot konusu, buna bağlı olarak da nesih ve nassa ziyâde meseleleri temas edilmiştir. İkinci bölümde ise İbnü'l-Kayyim'in istinbat metodlarını tespit etmek için öncelikle onun Kur'an ve sünnet lafızlarının umum, husus, iştirak, nas, zâhir, mücmel, müevvel, hakikat, mecâz durumu hakkındaki görüşleri incelenmiş, mücmel lafızların beyânı ve nassların sahih bir şekilde tevili hakkında İbnü'l-Kayyim'in görüşleri zikredilmiştir. Bu meyanda mantûk ve mefhûm olmak üzere lafızların manaya delâlet şekilleri ele alınmış ve İslam hukukunun ana gayeleri hakkında İbn Kayyim'in görüşleri incelenmiştir."
