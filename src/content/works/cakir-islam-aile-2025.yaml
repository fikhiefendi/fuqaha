abstract: "Hayreddin Karaman, Türkiye'nin önde gelen İslam hukukçularından biridir ve fıkıh alanındaki çalışmalarıyla dikkat çekmektedir. İslam aile hukuku alanında kaleme aldığı çok sayıda eserin yanı sıra çeşitli platformlarda yayımlanmış makale ve köşe yazıları da mevcuttur. Karaman, klasik fıkıh birikimini esas almakla birlikte çağın toplumsal gerçeklikleri dikkate alan bir yaklaşıma sahip olmasıyla ön plandadır. Bu çalışmada Hayreddin Karaman'ın aile hukukuna ilişkin görüşleri ele alınarak, klasik fıkıh kaynakları ışığında değerlendirilmiştir. Çalışmamız üç ana bölümden oluşmaktadır. Birinci bölümde Karaman'ın hayatı ve ilmi kişiliği ele alınmıştır. İkinci bölümde evlilik akdi, evlilik öncesi süreç ve evlilik akdinin neticelerine dair görüşleri değerlendirilmiştir. Üçüncü bölümde ise boşanma konusundaki yaklaşımları analiz edilmiştir."
