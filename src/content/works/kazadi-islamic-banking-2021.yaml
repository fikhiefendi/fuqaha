abstract: "Bu çalışma, Demokratik Kongo Cumhuriyeti (DKC) örneği ile gelişmekte olan ülkelerdeki İslami Finans ve Bankacılık Sistemi'nin bir analizini yapmaktadır. İslami Finans Sistemi'ni sadece klasik finansal sistemine iyi bir alternatif olarak değil, aynı zamanda DKC örneğinde olduğu gibi gelişmekte olan ülkelerde bir orta sınıfın yaratılması için iyi bir araç olarak sunmaktadır. Diğer birçok çalışmadan farklı olarak, bu çalışma, Afrika'da gelişmekte olan ekonomilerde sadece İslami Fnans Sistemi'nin alternatif yanını sunmakla sınırlı kalmadan, Islami Finansal ve Bankacılık Sistemi'ni orta sınıf kavramıyla uzlaştırmaya yönelik daha spesifik bir analiz sunmaktadır. Orta sınıfın oluşturulmasının gelişmiş ülkelerin kalkınmasındaki ispatlanan rolünden yola çıkarak gelişmekte olan ülkelerde orta sınıfın yaratılmasınında İslami Finans Sistemi'nin rolü ele alınmaktadır."
