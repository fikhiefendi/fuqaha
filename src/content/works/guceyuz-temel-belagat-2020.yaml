abstract: "Araştırmanın temel amacı belâgat ilminin hakim-tanımlayıcı kavramları olan fesahat, belâgat, meânî, beyân ve bedî' terimlerinin teşekkülünü ele almaktır. Bu temel amaç çerçevesinde bahsi geçen terimlerin oluşum sürecinin kırılma noktalarını belirlemek ve tarihsel analizini yapmak ise araştırmanın alt amaçlarındandır. Belâgat terimlerinin geçirdiği süreçlere dönemsel olarak işaret eden çalışmaların oldukça sınırlı olması, literatürdeki çalışmalarda belâgat sanatlarının hangi ilimlerin altında ele alındığına kronolojik ve ayrıntılı olarak temas edilmemesi ve belâgat tarihi konusunda yapılan çalışmalarda terminoloji gelişiminin yeterince göz önünde bulundurulması nedeniyle bu araştırma önemlidir. Dilbilim açısından art süremli ve eş zamanlı yöntem bir arada kullanılmıştır. Her bir terim kök anlamından ve Câhiliye dönemindeki kullanımından alınarak, belâgat ilmi bağlamında ıstılâhî bir hüviyet kazandığı sürece kadar tarihî olarak ele alınmıştır. Belâgat kavramlarının gelişimini ve özelliklerini ortaya koymak belâgat mirasının doğru anlaşılması ve aydınlatılması işlevini üstlenmektedir. Çalışmada belâgat terimlerinin çokluğunun sebepleri, terimlerin yapıları, belâgat konularına dağılımı, anlam ortaklığı, terimleşme bağlamında belâgatın dönemleri ve özellikleri gibi hususlar üzerinde durulmuştur. Belâgat terimlerinin teşekkülü, yüzyıllara göre kronolojik olarak incelenmiştir. Her bir yüzyılda terimlerin nasıl anlaşıldığı araştırılmış ve ortaya konulmuştur. İlk dönemde genellikle eş anlamda kullanılan terimler, sonraki süreçte müstakil bir anlam alanı kazanmıştır. Ayrıca ilk dönem Araplarının konuşmalarında uygulama olarak var olan sanatların, sonraki dönemlerde teorik çerçevesi çizilmiş ve isimleri konulmuştur. Terimlerin teşekkülü açısından her bir dönemin karakteristik özellikleri üzerinde durulmuştur. Belâgat terimlerinin teşekkülü ile ilgili yüzyıllar arasında mukayese yapılarak, bu dönemlerin birbirinden ne tür farklar içerdiği tespit edilmiştir. Belâgat terimlerinin oluşumuna diğer ilimlerin ne oranda etki ettiği tartışılmış ve belâgatın ilk dönemlerde nahiv, nakd ve Kur'ân çalışmalarıyla beraber ele alındığı ortaya konulmuştur. Temel belâgat terimlerinin altında yer alan sanatların tarihî süreçte hangi ilimlerin kapsamında değerlendirildiği açıklanmıştır. Ayrıca meânî, beyân ve bedî' ilimlerine ait sanatların isimlerinin ilk defa hangi âlim tarafından kullanıldığı tespit edilmeye çalışılmıştır. Hicrî beşinci yüzyıl ve özellikle de hicrî yedinci yüzyıldan itibaren, belâgata kayda değer bir katkı yapılmadığına dair iddiaların gerçeğe uygun olmadığı ortaya konulmuştur. Tarihî teşekkülüne ışık tutması bakımından, her bir terimin dönemsel olarak nasıl tanımlandığına yer verilmiştir. Bu bağlamda ilk dönemlerden itibaren âlimlerin belâgat anlayışları, etkinlendikleri faktörler ve terim yöntemleri ayrıntılı olarak işlenmiştir. Hicrî sekizinci yüzyılda temel belâgat terimleri şekillenmiş olduğu için bu tarihten sonra ayrıca bir dönemlendirme yapmaya ihtiyaç duyulmamıştır. Bu çalışma belâgat terimleri bağlamında dildeki anlam değişim ve dönüşümünü de göstermektedir. Elde ettiğimiz bulgular ışığında belâgat terimlerinin ve sanatlarının terimleşme süreçlerini zaman boyutuyla ele alan pek çok çalışmanın yapılmasına ihtiyaç olduğu görülmüştür."
