abstract: "Kimi durumlarda vakıf mallarının değişimi kaçınılmaz olsa da tarihsel süreç içinde Hanefî vakıflarının yok olmasına sebebiyet verme pahasına istibdâl fetvâsını istismar eden kadılar çıktığı da bir gerçektir. Bu tez Şemseddîn İbnü'l-Harîrî (728/1328), Cemâleddîn İbnü't-Türkmânî (769/1368) ve Kınalızâde Ali Efendi'nin (979/1572) yazmış olduğu istibdâl risâlelerinin tahkikli metninin neşrini amaç edinmektedir. Bunun yanı sıra, tartışmanın nasıl geliştiğini göstermek amacıyla bu risâlelerin içerikleri erken ve klasik dönem Hanefî doktriniyle mukayese edilmiştir. Araştırma giriş dışında üç bölümden oluşmaktadır. Birinci bölümde istibdâl meselesinin Hanefî mezhebi içerisinde nasıl geliştiği incelenmiştir. Takip eden bölümde risâleler hakkında arka plan bilgisi verilmiştir. Üçüncü bölümde ise sözü edilen risâlelerin tahkikli metinleri sunulmuştur."
