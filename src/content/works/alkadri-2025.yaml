abstract: "Fetva, İslam'da ilim ve içtihat ehli için en önemli şer'i görevlerden biridir. Bu görev, ilahi bir misyon ve nebevi bir vazifedir. Âlimler, peygamberlerin vârisleridir; onlardan ilmi miras almışlar ve tebliğ ile beyan görevini devralmışlardır. Fetva, şer'i hükmün bildirimi olması hasebiyle, İbn Kayyim'in ifade ettiği üzere, âdeta Allah Teâlâ adına imza atmak hükmündedir. Şatibi'ye göre ise müftü, ümmet içinde Hz. Peygamber'in (sav) makamında bulunmaktadır. Fetva, siyasi karar alma süreçlerini etkilemiş; tarih boyunca önemli olayların oluşmasında ve yapısal değişimlerin meydana gelmesinde rol oynamıştır. Müftülerin bu ilişkiye yaklaşım metodolojileri farklılık göstermiş, bu da fetvanın siyasi konularla ilişkisinde birçok sorunu gündeme getirmiştir. Bu çalışma hem fetva hem de siyasi karar kavramlarını açıklamayı, aralarındaki ilişkinin mahiyetini ortaya koymayı, siyasi alandaki fetvayı denetleyecek ve yönlendirecek bir fıkhi çerçeve oluşturmayı ve fetva ile siyasi karar ilişkisini kuşatan temel problemleri tespit etmeyi amaçlamaktadır. Bu çalışma, fetvanın siyasi karara olan etkisini; mahiyetini, biçimlerini, sınırlarını ve sorunlarını ortaya koymakta; fetva ile siyasi alan arasındaki ilişkiyi düzenleyen en önemli fıkhi kuralları belirlemekte; bu ilişkinin temel problemlerini, bu problemlerin nedenlerini ve doğurdukları sonuçları tespit ve tahlil etmektedir."
