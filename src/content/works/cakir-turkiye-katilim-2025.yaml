abstract: "Faizsiz bankacılık, İslami bankacılık ya da Türkiye'deki adıyla katılım bankacılığı; faizli işlemlere karşı duyulan dini hassasiyetler doğrultusunda gelişen, tasarruf sahiplerinin birikimlerini değerlendirmelerine ve finansal ihtiyaçlarını karşılamalarına olanak tanıyan alternatif bir finans sistemidir. Dünya genelinde İslami bankacılık faaliyetleri 20. yüzyılın ortalarından itibaren gelişim göstermeye başlamış; Türkiye'de ise bu sistemle ilk tanışma 1980'li yıllarda“özel finans kurumları”adıyla gerçekleşmiştir. Özellikle 2015 yılından sonra sektöre yeni katılım bankalarının dâhil olmasıyla bu alan ciddi bir büyüme sürecine girmiştir. Bu çalışmada, bankacılık ve katılım bankacılığı tarihi, bugünü hakkında bilgiler verilmiş, analiz kısmında 2016–2023 yılları arasında faaliyet gösteren katılım ve geleneksel (mevduat) bankalarının performansları CAMELS metodolojisi çerçevesinde finansal oranlar yardımıyla analiz edilmiştir. Ayrıca, CAMELS çıktılarının yanı sıra çeşitli mikro analizler yapılmış ve bu verilerin anlamlılığı t-testi uygulanarak istatistiksel olarak değerlendirilmiştir."
