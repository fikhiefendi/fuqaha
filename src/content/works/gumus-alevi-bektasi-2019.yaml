abstract: "Alevîlik, geçmiş ile günümüz arasında birçok yönden farklılaşma yaşamıştır. Yaptığımız çalışma Alevîlerin farklılaşmaya maruz kalmalarında etken rol oynayan sebepleri ve bu sebeplerin doğurmuş olduğu sonuçları görebilme çabasıdır. Bir toplumun dini kimlik ve hassasiyetini, o toplumun ibadet anlayışlarına bakarak anlayabilmek mümkündür. Alevî toplumunun dini kimliğini görebilmek adına araştırmamızın konusu Alevî-Bektâşî Kaynaklarına göre ibadetlerdir. Bu çalışmada İslâm dininin ibadetlerinden olan namaz, oruç, hac, zekat ve kurban ibadetleri, Alevî-Bektâşîlerin ana kaynakları merkeze alınarak incelenmiş, ve günümüz Alevî toplumunun yazılı kaynakların neresinde durdukları mukayese edilmiştir."
