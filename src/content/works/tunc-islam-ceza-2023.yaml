abstract: "Bu araştırma, İslâm Yargı Hukuku'nda Berâet-i Zimmet olarak geçmektedir. Daha sonra Türk Medeni Hukuk kaynaklarına“Suçsuzluk Karînesi”adıyla geçmiştir. İslam Hukuku'nda özellikle Türkçe kaynaklarda pek az rastlanan bir konu olan“Ceza Hukukunda Suçsuzluk”ve“Suçsuzluğun Yargıya Etkisi”“Şüpheden sanık yararlanır”ilkesinin temelinin“şüphelerle haddleri düşürün”hadisinin bir sonucu olarak ortaya çıktığı düşünülmektedir. Tezimizde bu ilkeye dayanarak, kanunen“kanıt”olarak kabul edilen deliller ispat edilene kadar suçsuzluğun devam ettiği vurgulanmıştır. Yargılamada yeminin davalıya, ispatın davacıya ait olacağı prensibine değinilmiş bunlar hakkında örnekler verilmiştir. Berâet-i Zimmet'in ne olduğu, yargılamaya etkisi, sanığın suçsuzluğunun kendisine tanıdığı hakları, Ceza ve Borçlar Hukuku'nda Berâet-i Zimmet'in etkilerini içermektedir. İslâm Ceza Hukuku'nda sanığın belli alanlardaki dokunulmazlığı, sanığın sicilinin süreç içerisindeki olumlu veya olumsuz etkisi ele alınmıştır. Bunların yanı sıra İslam Hukuk kaynaklarından ve özellikle Osmanlı Şer'iyye sicillerinden de zaman zaman faydalanarak somut örnekler getirilip konunun daha anlaşılır olması hedeflenmiştir."
