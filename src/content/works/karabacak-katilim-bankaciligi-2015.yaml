abstract: "Doğuşundan itibaren bankacılık, tıpkı yaşayan bir organizma gibi gelişimini sürdürebilmek için farklı ve yeni enstrümanlara ihtiyaç duymuştur. Finans sisteminin faiz esaslı parçalarından biri olan konvansiyonel bankacılık, yıllar yılı rakipsiz kalmış, dolayısıyla sektörde üretilen hemen hemen tüm enstrümanlar faize dayalı araçlar olmuştur. İslami değerlere uygun bankacılık sisteminin doğuşu ile birlikte, katılım bankacılığının temeli atılmış ve zaman içerisinde gelişerek finansal sistemin önemli faizsiz unsurlarından biri haline gelmiştir. Katılım bankacılığının sektör içindeki yaygınlaşma çabası ve gelişiminin sürdürülebilir kılınması, ürün portföy çeşitliliğinin sağlanması, farklı ürün ve hizmetlerin sunulabilmesi ile finansal sistemden inançları gereği uzak duran yatırımcıların sektöre katılımının sağlanabilmesi amacı faizsiz finansal araçların üretilmesini zorunlu kılmıştır. Faizsiz finansal araçlar arasında hızlı bir büyüme gerçekleştiren, dünya genelinde başta Malezya olmak üzere önemli ihraç rakamlarına ulaşan ve faizsiz finans sisteminin önemli bir enstrümanı haline gelen sukuka olan ilgi her geçen gün artmış ve bu enstrüman arz edilen rakamların çok üzerinde talep toplamıştır. Türkiye'de faizsiz yatırım araçlarına duyulan ihtiyaç ve talep neticesinde, sukuk, ülkemizdeki adıyla“Kira Sertifikası”önemli bir faizsiz enstrüman haline gelmiştir. Dolayısıyla, bu çalışma ile sukuk ürünü ve işleyişi incelenmiş, Türkiye piyasasına özgü versiyonu olan kira sertifikası süreçleri detaylı bir şekilde açıklanmıştır. Bu çalışmada katılım bankacılığının Türk bankacılık sektörü içerisindeki yeri, faaliyetleri ve gelişim seyri incelenmiştir. Türk bankacılık sektörünün Cumhuriyet öncesi ve sonrası tarihsel gelişim süreci hakkında araştırmalar yapılmış, günümüz finans sistemindeki banka türleri ve bu bankaların üstlendiği fonksiyonlar açıklanmıştır. Sonrasında katılım bankalarının tarihsel gelişim süreci, bu bankaların doğuşunu getiren sebepler, kullanılan fon toplama ve fon kullandırma faaliyetleri incelenmiş ve son olarak Türkiye'de faizsiz finansman aracı olarak literatüre giren kira sertifikaları (sukuk) incelenmiştir."
