abstract: "“Hizmet Sektörü Projelerinin Finansmanı ve İşletilmesinde yeni bir islami model: Aynî Muşâ' hisseler”isimli bu çalışmanın amacı dünyada gelişmekte olan İslamî finans alanında yeni bir modeli tanıtmaktır. Bu modelin en önemli özelliklerinden finansın İslamî kurallar ve ölçüler çerçevesinde verilmesidir. Aynî Hisseler, kâr ve menfaat üretebilen belirli sabit mallarının aynı miktdarda kısımlarına sahip olunduğu hisselerdir. Çalışma yeni modeli tanıtırken üzerine kurulduğu temeller, ihtiva ettiği sözleşmeler, hak ve yükümlülükler ve pıyasanın ihtiyaç duyduğu esneklikler ele alınmıştır. Çalışma esnasında bazı uygulamalı örneklere değinlidi ve İslamî finansı zenginleştirecek katkılarından bahs edilmiş, real pıyasada Aynî Hisselerin maruz kalabileceği risk ve zorluklar anlatılmıştır. Şerî' bakımdan bu yeni model İslam hukukundaki fıkhî konulara uyumu, şerî' risklere girmeden uygulanabildiği beyan edilmiştir. Zamanımızda yatırımcıların karşılaştığı bir çok soruna İslam hukukundaki ayn ve iş temeline dayalı muzaraa yöntemine göre çözüm getirmiştir. Böylece fıkhı ile gerçek hayattaki uygulamaları bağlamıştır. Nitekim bu yöntem İslamî finanstaki yöntemlerden gözard edilmiş İslamî finanstaki önemi ve hayata uyumu ihmal edilmiştir. Çalışmanın sonunda tavsiye ve sonuçlar zikr edilmiştir. Bu araştırmada anlatım, analitik ve eleştirel yöntemleri kullanılmıştır."
