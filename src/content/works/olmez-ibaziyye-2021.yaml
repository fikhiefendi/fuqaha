abstract: "Hicrî birinci asırda meydana gelen bazı olaylar, bir takım siyasi fırkaların oluşmasına neden olmuştur. Bu fırkalar arasında olan ve radikal tutumlarıyla tanınan Hâricîler, sonraları kendi arasında da fırkalara ayrılmıştır. Hâricîlerin bir fırkası olarak ifade edilen İbâzîler, Hâricî olarak tanıtılmaktan hoşnut olmamakla birlikte, kendi kaynakları dışındaki tüm kaynaklar onları Hâricîlerin ılımlı kolu olarak tanıtmıştır. Bundan ötürü fıkhî bir mezhebe sahip olma yönleri sürekli göz ardı edilen bu mezhep ağırlıklı olarak Mezhepler Tarihi ve Kelâm alanı kapsamında çalışılmıştır. Daha açık bir ifadeyle kronolojik olarak ilk fıkhî mezhep olan İbâziyye mezhebi nitelikli bir müktesebat ve zengin bir fıkıh literatürüne sahip olmasına rağmen bu yönü yeterince önemsenmemiştir. Öte yandan Abdullah b. İbâz'a nispet edilmesine rağmen İbâziler tarafından mezhebin kurucusu olarak kabul edilen Câbir b. Zeyd'in tabiîden olması ve birçok sahâbeyle karşılaşıp onlardan ders alması İbâziyye mezhebinin önemini artıran unsurlardandır. Ancak ülkemizde böylesine önemli bir mezhebin fıkhı neredeyse hiç çalışılmamıştır. Bundan dolayı İbâziyye mezhebinin bilinirliği yalnızca Hâricîlerin bir kolu olmayla sınırlı kalmıştır. Gerek zengin fıkıh literatürüyle gerekse de kendine has fıkhî anlayışıyla müstakil ve munzabıt bir mezhep olan İbâziyye mezhebi kendine özgü önemli bir takım fıkhî görüşlere sahiptir. Bu çalışmada İbâziyye mezhebinin Hanefî, Mâlikî, Şâfiî ve Hanbelî mezheplerinden temayüz ettiği konular ele alınarak bilhassa sahip olduğu farklı görüşler delilleriyle izah etmeye çalıştık. Çalışmada farklı bir görüş olarak zikrettiğimiz konular dışındaki görüşleri dört mezhepten biriyle muvafık olduğu görülmektedir. Çalışmamızın sınırlarını belirlerken konumuzu İbâziyye mezhebinin ibâdât kısmıyla sınırlı tutmayı uygun gördük. Zira bir fıkhî mezhebin bütün görüşlerinin dört mezheple mukayese edilerek bütün yönleriyle çalışılması pek ihtimal dâhilinde görünmemektedir. Ancak şu husus da unutulmamalıdır ki, İbâziyye mezhebinin diğer mezheplerle olan ihtilafları diğer mezheplerin kendi aralarındaki ihtilaflardan fazla ve farklı değildir."
