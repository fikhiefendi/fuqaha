abstract: "14. yüzyılda ortaya çıkan sigortacılık sistemine,“belirsizlik, kumar, faiz”gibi İslam hukukuna uygun olmayan gerekçelerle, Müslümanlar çok sıcak bakmamıştır. Ancak mevcut ekonomik düzen ve ticari anlayış gereği ihtiyaç duyulan sigorta için katılım veya tekafül sigortacılığı alternatif bir ürün olarak ortaya geliştirilmiştir. Temelinde kişilerin birleşerek oluşturacağı yapıyla, herhangi bir üye istenmeyen durumla karşılaştığında sıkıntısının giderilmesi, zararının tazmini için geliştirilen katılım sigortacılığı orta-uzun vadede büyük potansiyel taşımaktadır. Başta Müslüman ülkeler olmak üzere, finansal faaliyetlerde dünyanın önde gelen ülkelerinde ilgi her geçen gün artmaktadır. Bu çalışmada, katılım sigortacılığı literatürü gözden geçirerek, Birleşik Krallık'taki katılım sigortacılığı uygulamaları ile Türkiye'deki uygulamalar incelenmiş, güçlü ve zayıf yanları ile fırsatlar analiz edilmiştir. Çalışmanın neticesinde Türkiye için güçlü ve zayıf yönler ile fırsat ve tehditler irdelenmiş Birleşik Krallık ile tek tek karşılaştırılarak bir SWOT (Strengths, Weaknesses, Opportunities, Threats) analizi ortaya konulmuştur. 2017 itibarı ile çıkartılan Katılım Esasları Çerçevesinde Sigortacılık ve Bireysel Emeklilik Faaliyetlerine İlişkin Yönetmelik gibi, sigortacılık hakkındaki düzenlemelerin çok önemli bir etken olacağı ve avantaj sağlayacağı hususu öngörülmektedir. İlgili düzenlemeler tekafül sigortasının gelişimine katkı sağlayacak içeriktedir. Ancak bunu destekleyen bir veri henüz bulunmamaktadır. Bu durumda yeni yapılacak çalışmaların nicel olarak derlenmesi önerilmektedir."
