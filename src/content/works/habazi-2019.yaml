abstract: "Para vakfı, yararlılığı, beklentileri ve halkın hem ulusal hem de resmi düzeyde sunulan fırsatlar açısından İslami ekonominin en önemli konularından biridir. Bu makalede araştırmacı para vakıflaının geliştirme yolları vurguladı. Konuyla ilgilenen bir dizi bilimsel metodolojiyi, indüktif yöntem, dedektif yaklaşım, ve zihinsel çıkarım yöntemiyle takip etmiştir. Araştırmacı, Klasik ve çağdaş fakihlerin bu konudaki farklı görüşlerini gözden geçirdi. Sonuçları ve tavsiyeleri çizmek için çalışma ve teklif edilen politikları içinde bağlantı ile ilgili kutumsel zihinsel akıl yürütme yoluyla araştırma prblemi sonuçlarının ait tanı çalışmalarında gelmiş kullanılmıştır endüktif parça. Araştırmacı, bu araştırmasında hem tarihsel olarak bu konuda yapılan çalışmalar hem de arap ve Islam dünyasında bu konu ile ilgili modern çalışmalara dair bir değerlendirme yapmıştır. Çalışma bir dizi tavsiyeyle sonuçlandı."
