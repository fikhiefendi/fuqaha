abstract: "Tefsir, Temel İslam Bilimleri içerisinde dinin temel kaynağı olan Kur'an'ı inceleme alanı edinmesinden dolayı önemli bir yere sahiptir. İşârî tefsir de rûhî tecrübeye ve ilhâmî işâretlere dayanması nedeniyle tefsir çeşitleri içersinde önem kazanmıştır. Üçüncü ve dördüncü hicrî asırlar tasavvufun önde gelen isimlerinin yetiştiği ve tasavvufun ilk eserlerinin verildiği bir zaman dilimidir. Sülemî de dördüncü hicrî asırda Horasan bölgesinin Nişabur şehrinde yetişmiş bir âlim ve sûfi şeyhidir. Uzun seneler hadisle meşgul olan Sülemî'nin hadis, tarih, tabakat ve tasavvuf alanlarındaki eserlerinin yanında Hakâiku't-Tefsir adında bir tefsiri de vardır. Hakâiku't-Tefsir, müfessirin ayetlerin hakikatini anlamak amacıyla yazdığı, kendinden önceki ve zamanındaki sûfi görüşleri bir araya getirdiği eseridir. Sülemî'nin“Hakâiku't-Tefsir adlı eseri örneğinde tasavvufî tefsirlerin ahkâm ayetlerine yaklaşımının”ele alındığı çalışmamız giriş, üç bölüm, sonuç ve kaynakçadan oluşmaktadır. Birinci bölümde, Sülemî ve onun Hakâiku't-Tefsir adlı tasavvufî tefsiri ele alınmıştır. Bu çerçevede ilk olarak Sülemî'nin hayatı, eserleri ve Hakâiku't-Tefsir hakkında bilgi verilmiştir. Daha sonra tasavvufî/işârî tefsir tanıtılmıştır. İkinci bölümde ahkâm ayetleriyle ilgili teorik bilgiler verilmiş ve bazı kavramlar açıklanmıştır. Üçüncü bölümde Sülemî'nin ahkâm ayetlerine yaklaşımı tespit edilmeye çalışılmıştır. Bu çerçevede Sülemî'nin tefsirinde yer verdiği ibadet, muamelat, ahlak ve bunların dışında kalan diğer bazı ahkâm ayetlerinin hangi hükümler içerdiği üzerinde kısaca durulduktan sonra Hakâiku't-Tefsir'de bu ayetlerin nasıl yorumlandığı belirlenerek değerlendirilmiştir."
