abstract: "Girişimcilerin geleneksel olarak kullandığı finansman yöntemlerine alternatif olarak sunulan kitle fonlama sistemi, son dönemde oldukça popüler olmuş ve yeni platformların kurulmasıyla birlikte girişimcilik ekosistemine oldukça katkı sağlamıştır. Yapılan kavramsal çerçevelerle girişimcilik, girişimciliğin finansmanı, kitle fonlaması, İslami finans sistemi açıklanmaya çalışılmıştır. Kitle fonlama sisteminin, İslami finans ürünleriyle birçok yönden uyumlu özellik taşıdığı görülmüştür. Kitle fonlama sisteminin türleri olan bağış, ödül, borç ve paya dayalı sistemlerde, İslami finans ürünlerinden hibe, karz-ı hasen, müşareke ve mudarebenin karşılaştırılmaları yapılmıştır. Kitle fonlama sisteminin dünyadaki ve ülkemizdeki durumu örneklerle açıklanmıştır. Nihai olarak yapılan kavramsal çerçeve, kitle fonlama sistemi ve İslami finans ürünlerinin uyumu, dünyada oldukça fazla kullanılan ancak ülkemizde daha örneği bulunmayan borçlanmaya dayalı kitle fonlaması sistemine; karz-ı hasen ve müşareke temelli iki farklı model önerilmiştir. Önerilen modellerin dünyada kullanım alanlarının olduğu ve ülkemizde de mevzuatsal düzenlemelerin akabinde hızlı bir şekilde İslami finans ekosisteminde yer bulup, katkı sağlayacağı düşünülmektedir."
