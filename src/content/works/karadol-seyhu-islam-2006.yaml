abstract: "Bu tez XVII. yy Osmanlı şeyhülislâmlarından olan Minkarû-zâde Yahya Efendi'ninaile hukuku ile ilgili fetvâlarının bir bölümü olan evlilik ile ilgili fetvâlarının günümüzTürkçesine çevrilmesini, onun fetva verirken izlediği metodu, en çok kullanmış olduğukaynakları ve bu dönemde en çok karşılaşılan problemleri açıklamayı amaçlamaktadır.Araştırma, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümü araştırmanınkonusunu, amacını, yöntemini açıklamayı amaçlamaktadır. Birinci bölüm, Minkarû-zâdeYahya Efendi'nin hayatını ve eserlerini kısaca tanıtmayı ayrıca, Minkarû-zâde YahyaEfendi'nin evlilik ile ilgili fetvâlarının tahlillerinin yapılmasını amaçlamaktadır.İkinci bölümde, Minkarû-zâde Yahya Efendi'nin nikâh akdi ile ilgili fetvâlarınınOsmanlıca olan kısımları transkribe edilmiş, Arapça olan fetvâların açıklamalarını içerenbölümler de tercüme edilmiştir. Bu bölüm, Kitâbu'n-Nikâh, Kitâbu'r-Rızâ fi'l-Muharremât,Bâbu'l-Mehr, Mâ-li'z-Zevc ve'z-Zevce en yef`alâ, Fi'l-Cehâz ve Mesâilu'n-Neseb fi'l-İstûlâdkonularından oluşmaktadır.Araştırmanın sonuç bölümünde Minkarû-zâde Yahya Efendi'nin fetva verirken izlediğiyöntem, en çok kullandığı kaynaklar ve bu dönemde en fazla karşılaşılan problemlerin ortayakonması amaçlanmaktadır."
