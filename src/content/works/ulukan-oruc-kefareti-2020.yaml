abstract: "Bu çalışmanın amacı, Oruç kefareti, fidye ve fıtır sadakası ile ilgili hususları, İslâm âlimlerinin görüş ve içtihatları doğrultusunda ele alıp incelemektir. Kefaretlerin varlığı Kur'an ayetlerine dayanır. Bu kefaretlerin uygulamaya yönelik esaslarından bir kısmı sünnet tarafından belirlenmiştir. Ancak oruç kefareti diğer kefaretlerden bir yönüyle ayrılmaktadır. Hükmü ve uygulama esasları sünnete dayanan oruç kefareti, birtakım tartışmaları beraberinde getirmiştir. Rivayetlerden yola çıkarak oruç kefaretinin dinen sabit olduğu, ancak usul farklılığından dolayı mezhepler arasında farklı uygulamaların ortaya çıktığı söylenebilir. Hüküm ve uygulamada yaşanan tartışmalar, ileri sürülen görüş ve deliller incelenerek ele alınmıştır. Fıkıh literatüründe fidye ve fıtır sadakasıyla ilgili teferruat sayılabilecek birçok ayrıntı mevcuttur. Bu iki konuda dikkat çeken ortak nokta, bir kimsenin günlük gıda ihtiyacını karşılayacak miktarın tespitidir. Çalışmamızda güncel fitre miktarı belirlemenin gerekliliğine ve burada takip edilecek metodun esaslarına işaret edilmiştir. Ulaşılan tüm sonuçlar klasik kaynak ve modern çalışmalara başvurularak elde edilmiştir. Tüm konu ve kavramlar dört mezhep esas alınarak incelenmeye gayret edilmiş, ayrıca gerekli görülen yerlerde diğer mezhep ve âlimlerin görüşlerine de yer verilmiştir."
