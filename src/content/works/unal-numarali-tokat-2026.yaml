abstract: "Çalıştığımız dönem olan 2 Numaralı Tokat Şer'iyye Sicili (76-153 varaklar) M.1795- 1797 (H.1210-1212) tarihleri arasını kapsamaktadır. Çalışmamızın başında şer'iyye sicillerinin tanımı, kapsamı ve hazırlanması, Osmanlı'daki gelişim süreci ve şer'iyye sicillerinin önemine değindik. Daha sonra konumuzla bağlantılı olması nedeniyle şer'i mahkemelerin durumu ve burada görevli memurların yetki ve sorumluluklarını ortaya koymaya çalıştık. Milâttan önce IV. ve V. yüzyıla kadar uzanan bir tarihin parçası olan Tokat, Osmanlı hâkimiyetine girişinden sonra da önemini korumuş bir şehirdir. Bu önemli şehrin sosyal ve kültürel tarihine ışık tutmak maksadıyla incelemiş olduğumuz defterde toplam 356 adet belge bulunmaktadır. Bu belgelerin otuz beş adet tereke kaydıdır. Terekelerden başka çeşitli hüccet ve belgeler defterde yer almaktadır. En çok kaydı bulunan belge ibrâ ile vâsi/nafaka tayinidir. Bununla beraber ferman, berat, buyruldu, mektub, salyâne ve masarifat defteri vs. kayıtlar da defterde yer almaktadır. İncelediğimiz sicil defterinin belge çeşitliliği açısından oldukça zengin bir defter olduğu söylenebilir. Çalıştığımız dönemde Tokat'ta Ermeniler, Rumlar ve Müslümanlar bir arada yaşamışlardır. Bir İslam devleti olan Osmanlı'da İslam hukukunun yanında örfî hukukun da uygulandığı, gayri müslimler için bir asimile politikası olmadığı görülmektedir. En azından çalışmış olduğumuz defterden yola çıkarak bunları söyleyebiliriz. İncelediğimiz defterdeki otuz beş tereke kaydının on sekizi Müslümanlara, on yedisi ise gayrimüslimlere ait olup terekelerdeki mal varlıklarında her iki grup arasında belirgin bir servet farkının olmadığı müşahede edilmiştir."
