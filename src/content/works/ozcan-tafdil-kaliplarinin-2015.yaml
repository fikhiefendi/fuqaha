abstract: "Giriş, iki bölüm ve sonuçtan oluşan bu çalışma, İslam dininin temel kaynağı olan Kur'an-ı Kerim'deki ism-i tafdil kalıplarını tespit etmekte ve sıklıklarını göstermektedir. Birinci bölümde hem sarf hem de nahiv ilminin konusu olan ism-i tafdilin genel özelliklerine yer verilmiştir. İkinci bölümde ise Kur'an-ı Kerim'de bulunduğu tespit edilen 62 farklı kökten türetilmiş 767 ism-i tafdilin kökleri tek tek açıklanmış, morfolojik(sarf açısından), sentaktik(nahiv açısından) ve kullanım çeşitleri açısından ele alınmış, sıklıkları verilmeye çalışılmıştır. Ve bu ism-i tafdiller ayetler ile örneklendirilmiştir. Bu çalışmamız ile Kur'an-ı Kerim'de yer alan ism-i tafdillerin kullanım şekillerini saptamayı hedefledik. Kur'an-ı Kerim'de kaç tane ism-i tafdil bulunmaktadır? Bu ism-i tafdiller neye göre en üstün ya da daha üstünlük anlamı ifade etmektedir? Hangileri daha sık kullanılmıştır? gibi sorulara cevaplar arayarak ilahi vahiydeki ism-i tafdilleri incelemeye çalıştık."
