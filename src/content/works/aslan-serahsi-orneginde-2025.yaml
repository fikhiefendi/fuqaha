abstract: "Tez, Giriş ('içerik ve yöntem', 'Serahsî'nin Hayatı', 'Serahsî'nin Eserleri', 'Serahsî'nin Yaşadığı Dönem' ve 'Hukuk Anlayışı'), iki bölüm (Birinci Bölüm: 'Hukuk ile Ahlâk İlişkisi', İkinci Bölüm: 'Serahsî'de Hukuk ile Ahlâk İlişkisi'), Sonuç ve Bibliyografya'dan oluşmaktadır. Tezde Serahsî Örneğinde Hukuk ile Ahlâk İlişkisi ele alınmıştır. Hukuk ile ahlâk ilişkisi hakkında Hanefî mezhebinin başta gelen fakîhlerinden olan Serahsî'nin ortaya koyduğu yaklaşım incelenerek bu yaklaşımı çerçevesinde geliştirdiği görüş ve ulaşılmıştır. Konuyu, Serahsî'nin başlıca eserleri olan el-Mebsût ve Usûlü's-Serahsî isimli eserleri ile sınırlı olarak ele alındığı tezimizde, Serahsî'nin hukuk ile ahlâk ilişkisi çerçevesinde; önemli görüş, örnek ve temellendirmeler ortaya koyduğu görülmüştür. Tezin Birinci Bölümü'nde genel kapsamda hukuk ile ahlak ilişkisi ele alınmıştır. Böylece; kavramsal çerçevede hukuk ve ahlâk, İslâm hukuku ile ahlâk ilişkisi, hukuk ile ahlâk ilişkisinin boyutları bağlamlarında tez konusu bakımından bir zemin sağlanmaya çalışılmıştır. Tezin İkinci Bölümü'nde ise, Serahsî'nin Usûlü's-Serahsî ve el-Mebsût eserlerinde, tespit edilen ve hukuk ile ahlâk ilişkisi bakımından değer ifade eden zengin içerik incelenmiştir. Böylece tespit edilen hususlar, kategoriler halinde sistematize edilerek ortaya konulmuştur."
