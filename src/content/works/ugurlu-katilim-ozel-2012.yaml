abstract: "Tüm dünyada olduğu gibi Türkiye'de de finansal sektörün en önemli aktörü bankacılık sektörüdür. Hızla gelişen dünya ekonomisinde bankacılık sektörünün önemi her geçen gün artmaktadır. Bankaların tasarruf sahiplerinden topladıkları fon fazlalarını fon ihtiyacı olanlara kullandırdıkları krediler ise bankaların en temel ürünüdür.Bir ekonomideki kredi miktarı ve artış hızı ile makroekonomik göstergeler arasında yakın bir ilişki vardır. Kredi miktarının artması satın almayı kolaylaştırır ve bu sayede birçok göstergeyi önemli ölçüde etkiler. Kredi piyasasının etkinliğini artırmak için atıl durumda bulunan fonlar finansal sisteme dâhil edilmelidir.Yapılan çalışmada, gayrisafi yurtiçi hasıla ve hanehalkı nihai tüketimi üzerinde katılım bankalarının pazarladığı krediler daha fazla etkili iken; ithalat, ihracat ve yatırım üzerinde özel sermayeli bankaların pazarladığı kredilerin daha fazla etkili olduğu tespit edilmiştir. 1992?2009 yılları arasında Türkiye'de kullandırılan kredilerin makroekonomik göstergeler üzerindeki etkisi çoklu regresyon analizi yardımıyla incelenmiştir. Analizde bağımlı ve bağımsız değişkenlerin logaritmik değerleri kullanılıp tüm modeller log-log formatında kurulmuştur. Yapılan analizler neticesinde katılım bankaları ve özel sermayeli bankaların pazarladıkları kredilerin seçilen makroekonomik göstergeler üzerinde beklentiler yönünde etkilerinin olduğu sonucuna varılmıştır."
