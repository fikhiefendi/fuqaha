abstract: "Bu çalışma, UTAUT2 (Unified Theory of Acceptance and Use of Technology 2) modelini kullanarak düzenleyici değişkenler olarak katılım ve dindarlık ile İslami mikrofinans fintech almaya yönelik sürekli niyet üzerindeki davranışsal niyetin öncüllerini incelemektedir. Kullanıcıların davranışsal niyetlerini etkileyen belirleyicileri ve bağlılık ile dindarlığın ılımlı etkilerini anlayarak, bu araştırma, İslami mikrofinans fintech'in başarılı bir şekilde uygulanmasına ilişkin önemli perspektifler sunmayı amaçlamaktadır. Bu araştırma, SmartPLS (v. 3.2.9) kullanılarak test edilen çok değişkenli analiz, PLS-SEM (Partial Least Squares - Structural Equation Modeling) kullanır. Mikro, Küçük ve Orta Ölçekli İşletmeler kategorisindeki 750 üyeye bir anket gönderildi. Toplam 294 cevap alındı; ancak bu yanıtlardan 44'ü çeşitli veri kısıtlamaları nedeniyle geçersiz sayıldı. Sonuç olarak, istatistiksel analiz, 250 geçerli yanıttan oluşan temsili bir alt küme üzerinde gerçekleştirilir. Bulgular, Performans Beklentisinin, Kolaylaştırıcı Koşulların ve Alışkanlığın, İslami mikrofinans alanında fintech almaya yönelik Davranışsal Niyet üzerinde önemli bir pozitif etkiye sahip olduğu sonucuna varmıştır. Ayrıca, Davranışsal Niyetin Sürekli Niyet üzerindeki önemli doğrudan etkisini de ortaya çıkardı. Bununla birlikte, dahil olma ve dindarlığın ılımlı rolleri, Davranışsal Niyetin Sürekli Niyet üzerinde herhangi bir ılımlı etkiye sahip değildir."
