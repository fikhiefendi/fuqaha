abstract: "Kur'ân-ı Kerim, fıtratı gereği cinsel istek ve arzusu olan erkek ve kadının, birbirleriyle sükûnet bulması için yaratıldığını, aralarına sevgi konduğunu haber vermiş, bu sükûnet ve sevgi sonucuyaşanacak birliktelikten doğacak çocuğun kime ait olduğunun bilinmesini de önemsemiştir. Ayrıca, soyun karışmaması için yasaklar koymuş ve çocuk sahibi olmanın ancak helal yollarla mümkün olabileceğini haber vermiştir. Meşrû olmayan yollardan zinayı; hayâsızlık olarak ifade etmiş, ona götüren yolları yasaklamış, livâta ve lezbiyenlik gibi zina türlerinden de bahsetmiştir. İnsanların bedeninin, iffetinin ve neslinin korunması için belirli düzenlemeler getirmiş, bu kapsamda iffetli Müslümanlara atılan zina iftirasına ve zina suçu işleyenlere verilecek cezaları çok net biçimde açıklamıştır. Yine Kur'ân-ı Kerîm, erkek erkeğe cinsel ilişki şeklinde tarif ettiğimiz ve çirkin bir iş olan livâta suçunu işleyen bir kavmin toplu halde helâk olduğunu haber vermiştir. Kur'ân, cinsel suçlar kapsamında değerlendirdiğimiz zina suçunun cezasını celde olarak tayin etmiş olmakla birlikte bu suçu işleyen bazı Müslüman ve Yahudilerin Hz. Peygamber (s.a.s) tarafından recmedildiği hadislerle sabit olmuştur. Bu çalışmada, büyük günahlardan sayılan zina, livâta, kazf ve bir tür zina olan lezbiyenlik suçu ve cezaları incelenmekte, cahiliye dönemi ve diğer dinlerde işlenen zina suçları ve ceza uygulamaları anlatılmaktadır. Bu suçların geçtiği âyetler hakkında müfessirlerin görüşleri ve mezhep imamlarının ilgili suç ve cezaların uygulanmasıyla ilgili hükümleri ayrı ayrı sunulmaktadır."
