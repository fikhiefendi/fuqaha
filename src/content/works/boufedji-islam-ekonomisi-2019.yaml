abstract: "Bu çalışma, görsel medya konusu ve Moritanya, Fas, Cezayir, Tunus ve Libya'dan Mağrip ülkelerinde İslami ekonomik ilişkiler ile ilgilenen izleyiciler arasında İslami ekonomik farkındalığın gelişimindeki rolünü ele alıyor. Araştırmanın değişkenleri, cinsiyet, yaş, bilimsel nitelikler, ikamet ettiği ülke ve ekonomik gelir gibi değişkenlere dayanarak; Görsel medya ve Görsel medyanın Mağrip ülkelerindeki izleyicilere İslami ekonomik farkındalığın geliştirilmesindeki etkisi. Verilerin sunumu, analizi ve yorumlanmasından sonra, çalışmanın ana sonuçları aşağıdaki gibidir: - Çalışma görsel medyanın Mağrip ülkelerinde büyük bir izleyici kitlesini çektiğini, çoğunluğunun genç ve her iki cinsiyette olduğunu vurguladı. - Çalışma, görsel medyanın izleyicilerin farkındalığını geliştirmede büyük bir rol oynadığını ve hatta mahkumiyetlerini değiştirmede önemli bir rol oynadığını ve İslami ekonomik meselelerin bilgisinin% 73.33'ünü karşıladığını göstermiştir."
