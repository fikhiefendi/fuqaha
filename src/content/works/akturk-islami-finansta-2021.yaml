abstract: "Finans ve teknoloji kelimelerinin birleşmesi ile oluşan FinTek kavramı finans hizmetlerini teknoloji ile birleştirerek mobil ödeme, para transferleri, gelir gider takibi, kredi ve kitlesel fonlama gibi alanlarda hizmet üretir. Büyüyen FinTek pazarında göz ardı edilmemesi gereken alanlardan biri de İslami FinTek'lerdir. Her geçen gün FinTek girişimleri küresel ölçekte giderek büyümekte, yatırımlar almaktadır. Yatırımlara ek olarak şirketler FinTek'ler için ayrı platformlar kurmaktadır. Bu gelişmelerle birlikte İslam dünyasının ekonomisi FinTek'ler için pek çok fırsatlar sunmaktadır. Bu sunulan fırsatların Türkiye'de göze çarpan örneklerini ise katılım bankalarının kurmuş olduğu Lonca Teşkilatı ve Albaraka Garaj oluşturmaktadır. Teknolojide belirleyici güç olan inovasyonun yükselişi ve dijital dönüşümün hız kazanması FinTek girşimlerinin artmasına sebep olmaktadır. Finansal piyasalarda FinTek girşimlerinin ekosisteme sunmuş oldukları yenilikçi, güvenli, güçlü, müşteri deneyimini esas alan ürün ve hizmetleri İslami Finans ve bankacılık sektörüne farklı bir bakış açısı kazandırarak finans kuruluşlarının ve bankaların uygulamış oldukları geleneksel iş yapılarına modernize çözümlerle katkı sağlamaktadır. Tezimde İslami Finans'ta FinTek'lerin ne aşamada olduğu ve Türkiye'de öne çıkan platformların İslami Finans sistemine nasıl çözümler getirdiği araştırılmıştır. Bu tezde FinTek'lerin hızla büyüyen ve artan hacmi ile Türkiye'de ve dünyada derinleşen İslami Finans'ın ihtiyaçlarına yönelik getirmiş olduğu teknolojik çözümlerin İslami Finans ekosistemine ne ölçüde fayda sağladığı analiz edilmiştir. Türkiye'de katılım bankalarının kurmuş olduğu Lonca Teşkilatı ve Albaraka Garaj'ın temel çalışma mantıklarını İslami Finans ekosistemi okurlarına kazandırmak amaçlanmıştır. Amaca yönelik geliştirilen çözüm önerilerine ilişkin teknik bir anket çalışması yapılmıştır. Çalışmada anket uygulama yöntemi seçilerek nicel veriler elde edilmiştir. Araştırma konusu somut bilgilerle desteklenerek bu doğrultuda katılımcılardan alınan dönütler çerçevesinde savunulan fikirlere katkı sağlanmıştır."
