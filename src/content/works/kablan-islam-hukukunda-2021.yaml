abstract: "Toplumun temel taşı olan aile; klanları, milletleri, devletleri oluşturan bir kurumdur. Aileye dinlerin birçoğunda olduğu gibi İslâm dininde de büyük bir önem atfedilmiştir. Temel prensip ailenin sağlıklı bir şekilde kurulması ve devam etmesidir. Ancak her zaman istenen olamamakta ve aile kurumu değişik şekillerde son bulabilmektedir. İşte biz bu tezimizde aile kurumunu sona erdiren hukuki ayrılma gerekçeleri üzerinde durmaya çalıştık. Bu tezimizde daha çok dört sünnî mezhebin görüşlerine ağırlık verilmiş ve zaman zaman da mezhepler arası farklı görüşlere ve gerekçelerine yer verilmiştir. Tezimizin başlığı olan boşanma gerekçeleri incelenirken giriş bölümünden sonra birinci bölümde aile ve evliliğin önemine vurgu yapılmış ve boşanmayı önleyici tedbirlerden bahsedilmiştir. İkinci bölümde boşanma çeşitleri ve gerekçeleri güncel ve klasik kaynaklara bağlı kalınarak işlenmiş sonuç bölümünde de çalışmamızın genel bir değerlendirmesi yapılmıştır. Bu çalışmamızın amacı, İslâm Hukukunun ailenin ve evliliğin önemine verdiği değerin ortaya konulması ve aile birliğinin sona ermesi gereken durumlarda da nelere dikkat edilmesi gerektiğinin ve ayrılma gerekçelerinin neler olduğunun incelenmesidir."
