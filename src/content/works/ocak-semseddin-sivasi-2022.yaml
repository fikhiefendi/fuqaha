abstract: "Şemseddin Sivâsî, Arapça Türkçe ve Farsça olarak dini tasavvufi eserler yazdığı gibi nahiv ilminde de istifadeli eserler kaleme almıştır. Nahiv ilminin kaidelerini ihtiva eden eserlerden birisi de Hallü me'âkıdi'l-kava'id isimli kitabıdır. Sivâsî, söz konusu eserini ele alırken istişhâd kaynaklarından Kur'ân'ı Kerîm'i, hadisi şerifi, Arap şiiri ve Arap nesrinden çok fazla istifade etmiştir. Şemseddin Sivâsî'nin Hallü Me'âkıdi'l-Kava'id İsimli Eserinde İstişhâd adlı tez çalışmamız giriş, üç bölüm ve sonuç faslından meydana gelmektedir. Birinci bölümde; Şemseddin Sivâsî'nin hayatı, ailesi, ahlaki kişiliği, ilmi ve tasavvufi yolculuk serüveni, halifeleri ve eserlerini ele aldık. İkinci bölümde; İstişhâdın lügat ve istilâh anlamı, istişhâdın ortaya çıkışı, istişhâdın önemi ve istişhâdın kaynaklarını açıkladık. Üçüncü bölümde ise; Şemseddin Sivâsî'nin Hallü Me'âkidi'l-Kava'id İsimli Eserinde İstişhâd başlığı altında tezimizin asıl konusunu teşkil eden Şemseddin Sivâsî'nin söz konusu eserinin muhtevası ve istişhâd metodunu inceledik."
