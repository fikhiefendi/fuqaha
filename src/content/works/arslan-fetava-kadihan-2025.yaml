abstract: "Kâdîhân, yaşadığı dönemde ilmî çalışmalarıyla adından söz ettiren ve fetvaları ile devrine damga vuran büyük bir şahsiyettir. Başta Fetâvâ Kâdîhân olmak üzere bütün eserleri ilim ehlinin hep gündeminde olmuştur. Hanefî Mezhebinin önemli âlimlerinden olması ve Fetâvâ Kâdîhân üzerine herhangi bir tahric çalışması yapılmamış olması dikkatimizi çekmiştir. Bundan dolayı eserde yer alan rivayetlerin tamamı değerlendirilmiştir. Giriş bölümünde, konunun önemi, amacı, yöntemi ve kaynakları ele alınmıştır. Daha sonraki bölümlerde, müellif ve eserleri ile ilgili bilgiler verildikten sonra Fetâvâ Kâdîhân'da bulunan hadislerin tahrîci yapılarak hadis usulü ve cerh ta'dîl kaideleri açısından sahihlik-zayıflık yönleri incelenmiştir. Sonuç kısmında ise, araştırmada varılan sonuçlar ortaya konarak bir tablo ile Fetâvâ Kâdîhân'daki hadislerin genel değerlendirilmesi yapılmıştır."
