abstract: "Bu tez, şer'î hükümleri Arap dilini anlamaya bağlı olarak nasıl etkilendiğini ortaya koymayı hedeflemektedir. Araştırmacı, bu tezinde Arap dilinin önemini ve diğer diller karşısındaki üstün konumunu ispat etme, ortaya çıkışını ve ilgili ilimleri beyan etmeye, bu çerçevede Arap dili hakkında farklı ilim adamlarını görüşlerini zikretmeye, ayrıca fıkıh ilmi, doğuşu ve muteber mezhepleri hakkında bilgi vermeye önem vermektedir. Arap dilini öğrenmenin hükmü, Araplar açısından ve Arap olmayan Müslümanlar açısından değerlendirilmekte, Arap dilini öğretmenin hükmü de bu çerçevede araştırılmaktadır. İslam hukukçularının ve usulcülerin şer'î ve ilmî meselelerde farklı görüşlere varmasında etkili olan bir unsur olarak Arap dili ele alınmakta, keza Arap dilinin bilinmemesi halinde ortaya çıkacak olan şer'î hükümleri bilmedeki zafiyete değinilmektedir. Halifenin Arap ve Kureyşli olması konusunun ve müçtehidin Arapça bilmesi şartının konuyla bağlantısı da ayrıca ele alınan konular arasındadır."
