abstract: "slâm Hukuku'nun medenî hukuk alanında ilk kanunlastırma örnegiMecelle'dir. Mecelle yalnız ülkemizde degil, Tunus, Irak, srail, Fas gibi birçokülkenin de medenî hukukunun olusmasında ilham kaynagı olmustur. ste bundandolayı anlasılabilmesi için Mecelle üzerine birçok serh yazılmıstır. Çalısmamızınkonusunu olusturan Ali Haydar Efendi'nin ?Dürerü'l-Hukkâm SerhuMecelleti'l-Ahkâm? adlı eseri de Mecelle'nin en önemli serhlerinden birisidir.Çalısmamız ?Dürerü'l-Hükkâm? adlı eserin büyû` bahsi ile alâkalı bilgileriiçeren 101-229. maddelerinin kaynaklarının tespit ve tahkikinden olusmaktadır.Kaynakların tespit ve tahkikini yapmadan önce ilgilenenlerin metindenfaydalanmalarını kolaylastırmak amacıyla metni latinize ettik. Bunu yaparkenmümkün oldugunca metnin aslına sadık kalmaya özen gösterdik.Tezimiz giris ve ana bölümden olusmaktadır. Ana bölüm ise Ali HaydarEfendi'nin hayatı ile çalısmamızın konusunu olusturan maddelerin latinize vetahkikinden olusmaktadır.Çalısmamızın amacı zikrettigimiz bölümün latinize ve kaynaklarınıntahkik çalısmasını yaparak slâm hukukçularının ve slâm hukukuyla ilgilenenlerinbu eserden faydalanmalarını kolaylastırmaktır."
