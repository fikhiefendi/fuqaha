abstract: "Ta'lîl olgusu birçok disiplini ilgilendiren derin ve kompleks bir konudur. Tezimiz Hicrî IV- VIII. asırlarda yaşayan usulcülerin şer'î hükümlerin ta'lîli konusunda ortaya koydukları görüş ve tartışmaları konu edinmektedir. Çalışmamız ele aldığı konunun yeterli düzeyde anlaşılması amacıyla bu görüş ve tartışmaların felsefî ve kelamî arka planını da irdelemektedir. İslam filozoflarının (Farabî, İbn Sinâ) gâî ta'lîl anlayışları illet anlayışlarına dayanırken, illet anlayışları da temelde varlık anlayışlarına dayanmaktadır. Filozoflara göre Vacib Varlık, varlıkları gaye edinmez, varlıklar O'nu gaye edinir. Her mümkün varlık bir gayeye varmak için hareket eder ve bu gaye fikri kâinatın bütününde müşahede edilmektedir. Kelamcıların ta'lîl konusunda birbirinden farklı görüşler ileri sürmeleri, hikmet ve abes kavramlarına yükledikleri anlamların farklılığından kaynaklanmaktadır. Mutezilî kelamcılara göre ilahî fiillerin kullara dönük birtakım maslahatları içermesi Yüce Yaratıcı'ya vaciptir. Eş'arî ve Maturîdî kelamcılar ise maslahat içerikli ilahî fiillerin birer ilahî ihsan ve rahmet olduğunu söylemektedirler. Bu kelamcılara göre hiçbir şey Allah Teâlâ'ya vacib değildir. Zira vücub kavramı ilahî irade kavramıyla bağdaşmaz. Eş'arîlerin hüsün-kubuh konusunda temel savunusu aklın, vahiy gelmeden önce herhangi bir fiilin sevab ve ikabı gerektireceği hükmünde bulunmasının mümkün olmadığı şeklindedir. Eş'arîlerin karşı çıktıkları ta'lîl Mutezilenin kabul ettiği ta'lîldir. Eş'arîlerin ilahî fiillerden nefyettikleri amaç ve gayeler, faili fiilleri işlemeye sevk eden ve bu işlemeyi aklî açıdan zorunlu kılan amaç ve gayelerdir (garaz). Mutezile ilahî fiillerin vuku bulması için ilahî iradeyle birlikte başka nedenlerin (dâî) de var olması gerektiğini söylerken, Eş'arî ve Maturîdîler ilahî fiillerin vuku‟ bulması için ilahî iradeyi yeterli görmektedirler. Usulcülerin ta'lîl anlayışları illet tasavvurlarına, illet tasavvurları da temelde kelamî ta'lîl anlayışlarına dayanmaktadır. Usûlcülerin ta'lîl anlayışlarının kelâmî ta'lîl anlayışlarını yansıtması da buradan kaynaklanmaktadır. Genelde Eş'arîlerin özelde Râzî'nin ta'lîli inkâr ettiğine dair ileri sürülen söylemler gerçeği yansıtmamaktadır. Bu söylemler Eş'arîlerin kullandıkları kavram ve ifadelerin bağlamlarından ayrı ele alınmasından ileri gelmektedir. Bütün usulcüler, şer'î hükümlerin kullara dönük birtakım maslahatları içerdiğini tartışmasız kabul etmekle birlikte, bunu farklı şekillerde ifade etmektedirler."
