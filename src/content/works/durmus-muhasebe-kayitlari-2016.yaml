abstract: "Osmanlı'da vakıf müessesesi, cemiyet hayatının her safhasını kuşatarak Osmanlı toplumunun şekillenmesinde ve gelişmesinde en önemli rolü oynayan müessese olarak karşımıza çıkmaktadır. Topluma hizmet ederek Allah rızasına nail olmak gayesiyle kurulan bu müesseseler günümüzde önemli ölçüde devletlerin yerine getirdikleri, en başta dini hizmetler olmak üzere altyapı, eğitim, sağlık ve sosyal güvenlik gibi pek çok alanda önemli bir boşluk doldurmuşlar ve böylece devletin sırtındaki yükü bir hayli azaltmışlardır. Eğitimden sağlığa, alt yapıdan sosyal güvenliğe, dini hizmetlerden finansmana kadar halkın ihtiyaç duyduğu pek çok alanda hizmetler icra eden vakıflar, hem toplumun refahına hem de devletin ekonomik durumuna çok önemli katkılarda bulunmaları sebebiyle elbette devlet tarafından teşvik edilmişlerdir. Pek çok devlet adamı ve askeri zümre mensubu olan kişilerin kurdukları vakıflar bunun göstergesidir. Tezimizin konusu olan para vakıflarını diğer vakıflardan ayıran en temel özellik, adından da anlaşıldığı üzere menkul bir mal olan paraya sahip olmaları ve bu parayı işletmekten gelir elde etmeleridir. Nakit sermayesi bulunan ve bu sermayenin işletilmesinden gelir elde eden her vakfın para vakfı olduğunu söylemek mümkündür. İncelediğimiz muhasebe kayıtları ışığında para vakıflarının nakit sermayelerini işletme yöntemlerinin muamele-i şer'iyye ve istiğlal akitleri olduğu tespit edilmiştir. Bunun yanında vakıfların sahip oldukları gayrimenkulleri genellikle icâreteyn olmak üzere, icâre-i vahide veya mukâtaa usulleriyle kiraya verdikleri ve bunun neticesinde de kira geliri elde ettikleri görülmektedir. Bu çalışmanın amacı 1184-88/1770-74 yılları arasında Üsküdar Para Vakıflarının muhasebe kayıtlarının incelenerek bu kayıtlarda yer alan bilgilerin tespit edilmesi ve günümüze aktarılmasıdır. Çalışmada elde edilen sonuçlara göre;  Para vakıfları, faize bulaşmadan toplumun finansman ihtiyacını gidermek için Osmanlı fukahası tarafından geliştirilmiş özgün bir kurumdur.  Para vakıfları borç verecekleri kişilerin sosyal statülerinden ziyade güvenilirliklerine önem göstermişlerdir. Yani para vakıfları güvenilir olduktan sonra, ister askeri zümre mensubu ister reaya olsun; ister zimmi ister Müslüman olsun; ister erkek ister kadın olsun toplumun her kesimine borç vermişlerdir.  Para vakıfları borç verirken devlet tarafından üst sınır olarak belirlenen yüzde on beş oranını aşmamak kaydıyla vakfiyede belirtilen ortak bir ribh oranıyla (kar payı) toplumun her kesimine borç vermişlerdir.  Para vakıfları muamele-i şer'iyye işleminde genelde borçlulardan rehin, kefil veya temessük gibi teminatlar istemişlerdir. Bu teminatlardan bir kaçının beraber istenmesi muhasebe kayıtlarında rastlanılan bir durumdur.  Vakıfların nakit sermayeleri işletilirken daha ziyade muamele-i şer'iyye, gayrimenkulleri kiralanırken de icâreteyn akdi tercih edilmiştir.  Para vakıfları, nakit sermayelerini işletmekten ve vakıf mülklerin kiralanmasından elde ettikleri gelirlerin en büyük bölümünü gayelerine yönelik alanlara sarf etmişlerdir. Buradan hareketle para vakıflarının amaçlarına uygun faaliyet gösterdiklerini söylemek mümkündür.  Para vakıfları çeşitli alanlarda hizmetler icra etmişler ve bu hizmetleri icra etmek için de pek çok kişiyi bünyelerinde istihdam ettirmişlerdir. Bu da vakıfların topluma çok yönlü olarak katkı sağladıklarını göstermektedir."
