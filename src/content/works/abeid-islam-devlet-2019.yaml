abstract: "Tezde, genel olarak İslam hukuku, özel olarak siyaset-i şeriyye (İslami yönetim) eksenin olup müslümanların hayatındaki idare etme ve edilme hususlarında onlara güzel yolu göstermeyi hedeflemektedir. Tez, giriş ve iki bölümden oluşmaktadır. Giriş kısmında tezin konusunun önemi ve amacından, konu ile ilgili kaynakların değerlendirilmesinden, bir de konunun kapsamı ve yönteminden bahsettik. Birinci bölümde şeriatı maksatlarına ayırdık. Bu kapsamda ilk önce maksatların kavramlarını, ilk dönem kaynaklarda kullanılmasını, gelişmesini ve maksatların değişik açılardan taksimatını daha iyi anlaşılabimesi için gerekli temel tanıtılmıştır. İkinci bölümü üç kısma ayırdık. İlk önce; devletin unsurları, ikinci kısm İslam devlet teorisi ve devlet başkanının kavramsal mahiyetini, İslam'ın ilk dönemlerinde itikadi ve siyasi akımlar, fukaha ve filozoflar tarafından ne anlamda kullanıldığını, yöneticilikle ilgili hükümleri ve dinamikleri inceledik. Bu bölümün son kısmında ise, yöneticiliğin maksatlarını ele aldık. Bu kapsamda, dini koruma maksadı, dine dayalı yönetim sergileme maksadı, eşitliğin ve özgürlüğün gerçekleşmesi maksadı ve milletin siyasi birliği, bütünlüğü maksadını açıkladık."
