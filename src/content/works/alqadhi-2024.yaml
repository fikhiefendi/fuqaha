abstract: "MS 2014 ile 2022 yılları arasında Yemen'de vakıf fonlarının sürdürülmesinde Dokümantasyon ve onay rolünü bilmek; Çalışmada, İslam ve Yemen vakıflarının açıklanması, her birinin aşamalarının sırayla açıklanması, Yemen hukukunda vakıf, belge ve delillerle ilgili mevzuatın tespit edilmesi ve ardından incelenen dönemdeki rolünün sonuçlandırılması amaçlanmıştır. Çalışma aynı zamanda şu hedeflere ulaşmayı amaçlar; Kelime dağarcığının tanımlarının izini sürmek ve bunları özel ve basitleştirilmiş bir şekilde formüle etmek için betimleyici tümevarımsal yaklaşım, genel olarak vakıf tarihinin ve Yemen vakıflarının çoklu aşamalar ve yakın dönemler boyunca izini sürmeye yönelik tarihsel yaklaşım , ardından anket aracılığıyla hedef kitleye ulaşılmış ve onların görüşleri toplanmıştır. Toplanan veriler, istatistiksel yöntemler kullanılarak analiz edilmiş ve sonuçlar sade bir dille betimlenmiştir. Bu sayede, vakıflara ilişkin mevcut veriler göz önünde bulundurularak net bir şekilde ortaya konmuştur. Çalışma, belirtilen dönemde Yemen'deki savaş koşullarında vakıf fonlarının sürdürülmesiyla ilgili olarak Dokümantasyon ve onay arasında güçlü bir ilişki olduğunu ortaya koymuştur. Ayrıca, vakıf kayıtlarının ve belgelerinin korunmasına yönelik önleyici tedbirlerde ve vakıf çalışanları üzerinde denetimde belirgin bir zayıflık olduğu tespit edilmiştir. Savaşın neden olduğu yeni zorluklar vakıf mallarını olumsuz etkilemiş, belge ve delillendirmede ve vakıf belgelerinde eksiklikler ve zayıflıklar ortaya çıkmıştır. Bu olumsuz gelişmelere karşı yetkililerin yetersiz kaldığı da gözlemlenmiştir. Sonuç olarak, çalışma şu önerileri sunmaktadır: Dokümantasyon ve onay yöntemlerinin ilişkin yasaların geliştirilmesi, vakıf fonlarını sürdürülmeye yönelik araştırma projelerinin desteklenmesi, devlet belgelerinin korunması, vakıf kurumunun tarafsızlığının sağlanması, denetleme mekanizmalarının etkinleştirilmesi, savaşın etkilerini incelemek ve Çözümler geliştirip yasalar çıkarması için özel komisyonların kurulması, vakıfların önemi konusunda farkındalığın yayılması."
