abstract: "Bu tez, Hicri onuncu asır Hanefî fukahasından İmam Birgivî'nin“Şerhu Şurûti's-salâh”olarak isimlendirdiği kitabını tahkik ve incelemeyi amaçlamaktadır. Bu kitabında ibadetlerle ilgili tüm meseleleri ele almıştır. Çalışma,“Şurûti's-salâh”Babından“Ğaslü'l-mesnûn”bölümüne kadar olan kısmı kapsamaktadır. Kitabın tahkik sürecinde üç el yazması kullanılmıştır. Çalışmada İmam Birgivî'nin kişisel ve ilmî hayatı aktarılırken ve yaşadığı dönemdeki cereyan eden olayları bağlamı verilirken“tarihî niteleme”yöntemine başvurulmuştur. Çalışmanın tahkik kısmında ise genel anlamda edisyon kritik kurallarına riayet edilmiştir. Diğer bir ifadeyle, bu kısımda metnin nüshalar arasında karşılaştırmasını yapmak suretiyle yazıya geçirilmesi, farklılıkların yorumsuz bir şekilde dipnotta belirtilmesi, ayet ve hadislerin tahrici ve metinde geçen kavillerin kaynağına isnad edilmesi şeklinde çeşitli aşamalar izlenmiştir. Bu çalışma ana hatlarıyla şu sonuçlara ulaşmıştır: İmam Birgivî yaşadığı dönemde Hanefî fukahanın en önemlilerinden olup Şerhu Şurûti's-salâh isimli kitabı, o dönemde Hanefi mezhebinde muteber ve namazla ilgili konuları ele alan en meşhur kitaptır. Kitap, Kur'an, hadis ve tanınmış alimlerin görüşlerinden alınan delilleri düzenli ve sistematik bir şekilde sunar. İşte bu yüzden kitap, Hanefi mezhebinin önde gelen alimlerinden, örneğin İmam el-Hasûnî tarafından da yararlanılan bir kaynaktır. Yine kitap, namazın şartlarını şerh sadedinde Hanefî mezhebinin ana kitapları olan Serahsî'nin el-Mebsût'u, İmam Muhammed'in el-Asl'ı, Dehlevî'nin el-Fetâva'l-Hâniyye'si gibi kitaplara birçok yerde atıf yapmaktadır. Eserde müellifin aynı zamanda bilimsel etiğe ne denli önem verdiği, yapmış olduğu alıntılardan anlaşılmaktadır. İşte bu sebeple Hanefî mezhebinde dikkate alınması gereken bir eser olmaya devam edecektir."
