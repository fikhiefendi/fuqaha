abstract: "Olası kast ve bilinçli taksir kavramları seküler anlamda hayatımıza yeni girmiş kavramlardır. Ancak bu kavramlar kasıt benzeri ve hakiki hata şeklinde İslâm hukuku klasik kaynaklarında asırlar öncesinden beri yerini bulmuştur. Amacımız seküler hukukta yoğun bir şekilde tartışılan ancak modern İslâm hukuku sahasında pek de derinlemesine incelenmeyen olası kast ve bilinçli taksir kavramlarını incelemektir. Ayrıca hem İslâm hukuku hem de Türk Ceza Kanun'unu olası kast ve bilinçli taksir bağlamında mukayeseli olarak işleyip benzer ve farklı yönlerini ortaya koymaktır."
