abstract: "2006 yılında Cibuti Cumhuriyeti'nde İslami bankacılık sektörünün kurulması ülkenin ekonomik dinamiklerini değiştirmiştir. Cibuti'nin ekonomisi ağırlıklı olarak hizmet sektörüne dayanmaktadır. Buna karşın finans sektörü ekonomide merkezi bir rol oynamaktadır. Konvansiyonel ve İslami bankalardan oluşan bankacılık sektörü, finans sektörüne hâkim bir yapıdadır. Ülkede dokuzu konvansiyonel ve üçü İslami olmak üzere 12 banka bulunmakta olup İslami bankacılık 2006'da başladı ve kurulduğu günden bu yana nispeten hızlı bir şekilde büyüme göstermektedir. Bugüne kadar İslami bankaların varlıklarının büyüklüğü 50 milyar Cibuti frangı'na ulaşırken İslami bankaların aktifleri %20 artış göstrmiştir. İslami bankaların varlıkları, mevduatları ve kredileri ise sırasıyla %20, %15 ve %14 artış göstrmiştir. İslami bankaların önemli başarılarına rağmen Cibuti'deki İslami finansın çeşitli zorlukları vardır. Öncelikle İslami finans coğrafi, sektörel ve ticari olarak çeşitlendirilmemiştir. Bununla birlikte İslami finansın ikinci sınırlaması, düzenleme eksikliğidir. Bu nedenle Cibuti'deki İslami bankalar tam potansiyellerini gerçekleştirememektedirler. Çünkü İslami bankaların finansmanının üçte ikisi sadece müşareke ve murabaha İslami finans hizmetleri vermektedir. İslami bankaların tam potansiyellerini gerçekleştirmeleri için İstisna, Ijara ve Salam gibi İslami finans hizmetlerini genişletmeleri ve çeşitlendirmeleri gerekiyor. Bu bilgiler ışığında Cibuti'de İslami finansın daha olgunlaşmadığını görülmektedir. Anahtar Kelimer: Bankacılık sektörü, İslami finans, Risk yönetimi, Cibuti."
