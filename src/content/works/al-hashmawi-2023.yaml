abstract: "Bu tezde hicri 6. asrın önemli âlimlerinden biri olan ve Radıyyüddîn İbnü'l-Hanbelî diye bilinen Muhammed b. İbrâhîm b. Yûsuf b. Abdurrahmân'ın (öl. 971/1564) Zübâletü's-Sirâc alâ Risâleti's-Sirâc adlı eserinin edisyon kritiği yapılmıştır. Eser, Hanefi fıkhında miras üzerine yazılan hacimli ve ansiklopedik bir çalışma mahiyetindedir. Bu özelliğinden dolayıdır ki, mezhepte önem verilen ve dikkate alınan kaynak eserlerden biri olduğu görülmektedir. Bu öneme sahip bir eserin tozlu raflardan gün yüzüne çıkarılmasının ve ilim erbabının istifadesine sunulmasının üzerimize düşen bir görev ve sorumluluk olduğu kanaatindeyiz. Çalışma dirase ve tahkik olmak üzere iki ana bölümden oluşmaktadır. Dirase kısmında yazarın hayatı, ilmi yönü ve eserleri ele alınmıştır. Tahkik kısmında ise mahtutanın en eski tarihli üç nüshasına ulaşılmış; aralarında karşılaştırma yapılarak en doğru metin bilgisayar ortamına aktarılmıştır."
