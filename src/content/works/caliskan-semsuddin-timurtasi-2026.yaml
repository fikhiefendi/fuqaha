abstract: "XVI. yüzyıl Osmanlı ilim geleneğinin önemli isimlerinden olan Şemsüddîn et-Timurtâşî, sahip olduğu ilmî birikim ve kaleme aldığı eserleriyle döneminin önde gelen fakihlerinden biridir. Akâid, fıkıh, fıkıh usulü, tasavvuf ve Arap dili gibi farklı alanlarda telifleri bulunan müellif, özellikle fıkıh alanındaki derinliği ve eser çeşitliliği ile dikkat çekmektedir. Nitekim o fıkhın sadece fürû alanıyla sınırlı kalmayıp usul, fürû, tahrîcü'l-fürû 'ale'l-usul, yargı hukuku ve fetâva gibi farklı disiplinlerine dair de pek çok eser kaleme almıştır. Özellikle fürû alanında Tenvîrü'l-ebsâr adlı eseriyle klasik dönem muhtasar geleneğinin güçlü bir temsilcisi olarak temayüz eden Timurtâşî, kendinden sonraki dönemlerde şerh ve hâşiyelere konu olarak fıkıh literatüründe kalıcı bir etki bırakmıştır. Hanefî mezhebi mensubu bir fakih olarak klasik fıkıh geleneğinin usul ve kâidelerini benimseyen Timurtâşî'nin, fıkıh faaliyetlerini bu çerçevede sürdürerek fıkhın hem teorik hem de uygulama alanlarında önemli katkılarının bulunduğu anlaşılmaktadır. Timurtâşî'nin fıkıh eserleri üzerinden gerçekleştirilen bu çalışmada, müellifin klasik fıkıh mirasına olan yaklaşımı ve bu birikimi değerlendirme yöntemi dikkate alınarak onun fıkıh faaliyeti bütüncül bir bakış açısıyla ortaya konulmaya çalışılmıştır. Bu bağlamda, müellifin usul eserleri üzerinden usule yaklaşımı tahlil edilirken, fürû eserleri ve fetvaları çerçevesinde ise ictihad faaliyetinin bir tezahürü olarak tahrîc ve tercihleri örnekler üzerinden incelenmiştir. Sonuç olarak Timurtâşî'nin fıkhî istidlâl metodunun mezhep içi tercih üzerine yoğunlaştığı ve gerek kullandığı tercih lafızları gerekse delil merkezli tercih sebepleri ile sistematik bir tercih faaliyeti yürüttüğü görülmüştür. Bunun yanı sıra az sayıda da olsa tahrîc faaliyetinde bulunduğu tespit edilmiş ve bazı örnekler üzerinden gösterilmiştir. Dolayısıyla onun yürütmüş olduğu bu fıkıh faaliyeti ile Hanefî mezhebindeki konumu belirlenmeye çalışılmış ve tabakâtü'l-fukahâdan mezhepte müctehid konumunda olabileceği anlaşılmıştır."
