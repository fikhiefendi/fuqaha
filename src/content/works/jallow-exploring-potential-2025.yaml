abstract: "Son zamanlarda, İslami sosyal finans (ISF) üzerine yapılan araştırmalar araştırmacılar arasinda özel bir ilgi görmektedir. Bu sektörde, İslami mikrofinans, zekat ve vakıf, yoksullar arasinda finansal katılım, yoksulluğun azaltılması ve ekonomik güçlenmenin artırılmasında önemli bir rol oynamaktadır. Bununla birlikte, Gambiya gibi gelişmekte olan bir ülkede, nüfusun yaklaşık %95'i Müslüman olmasına rağmen, İGF araçları hakkinda sinırlı benimseme ve farkindalık ile İGF az gelişmiş olmaya devam etmektedir. Dolayısıyla, bu çalışma Gambiya'da İslami mikrofinans kullanma niyetini etkileyen faktörleri keşfetmeyi ve aynı zamanda ülkedeki İslami mikrofinans kurumlarının karşılaştığı zorlukları araştırmayı amaçlamaktadır. Çalışma ayrıca, bu kurumların zekat ve vakfın fon seferberliği aracı olarak kullanımına ilişkin algılarinı araştırmayı amaçlamaktadır. Çalışmada karma bir metodoloji yaklaşımı kullanılmış, nicel yaklaşım 518 katılımcı ile yapılan ankete dayalı olarak yapısal eşitlik modeli kullanılarak analiz edilmiştir. Ayrıca, İslami mikrofinans kurumlarının yöneticileri ile mülakat yapmak için nitel yaklaşım kullanılmıştır. Nicel analizden elde edilen bulgular, tutum, öznel norm ve algılanan davranışsal kontrolün Gambiya'da İslami mikrofinans kullanma niyeti üzerinde önemli bir etkiye sahip olduğunu ortaya koymuştur. Ayrıca analizler, tutumun farkindalık ve bilgi ile İslami mikrofinans kullanma niyeti arasinda önemli bir aracılık rolü oynadığını ortaya koymaktadır. Bu arada, nitel görüşmelerden elde edilen bulgular, İslami mikrofinans kurumlarının karşılaştığı yasal zorluklar, farkindalık eksikliği ve İslami finans uzmanlığindaki kapasite kısıtlamaları gibi zorlukları vurgulamaktadır. Ayrıca nitel analiz, İslami mikrofinans kuruluşlarının yoksullara ve girişimcilere yönelik şeriata uygun hizmetleri geliştirmelerini desteklemek amacıyla fon seferberliği için zekât ve vakıflardan henüz yararlanılmadığinı göstermektedir. Bulgular ışığında bu araştırma, İslami mikrofinansin benimsenme davranışı üzerine teorik ve pratik katkılar sunmaktadır. Çalışma, düzenleyiciler, İslami mikrofinans kurumları ve politika yapıcılar için önemli tavsiyeler sunmaktadır. İslami mikrofinansin büyümesini teşvik etmek ve nihayetinde Gambiya'da finansal kapsayıcılığı ve yoksulluğun azaltılmasinı sağlamak için kamuoyu bilinçlendirme programlarının geliştirilmesine, düzenleyici çerçevelerin iyileştirilmesine ve zekat ve vakfin stratejik kullanımına ihtiyaç vardır."
