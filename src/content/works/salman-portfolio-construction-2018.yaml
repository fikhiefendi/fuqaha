abstract: "Bu çalışma, parçacık sürü optimizasyon tekniği kullanılarak, portföy seçimi için deneysel bir yaklaşımı sunmaktadır. PSO, sosyal davranışların bir portföy optimizasyon problemine entegrasyonu kullanılmıştır. PSO'nun entegrasyonu ile finansal varlıkların getirileri, matematiksel nedenler olarak, algısal düzeyde ele alınma şansına sahiptir. Temel hedef, MATLAB yazılımını kullanarak, beklenen portfolyo getirisini maksimize etmek ve aynı zamanda portfolyo riskinin varyansını en aza indirgemektir. Birbirine benzer başka geleneksel seçim modellerini tespit etmek için, diğer portföy optimizasyon teknikleri koda uygulanmaktadır. Kod, ana pso komut dosyası ve altı diğer fonksiyon dosyası tarafından oluşturulmuştur. Çalışma verileri BIST 30 endeksinin katılımcıları olan altı hisse senedinden oluşmaktadır ve 31 Aralık 2010'dan 30 Aralık 2015'e kadar test edilmiştir. Bir karşılaştırma olarak, ortalama-varyans modeli ve parçacık sürüsü optimizasyonu karşılaştırılmıştır. Ortalama-varyans modelinin temel problemi, ağırlıkları yalnızca iki ölçüt üzerine dağıtmaktadır ve kısa satış uygulaması içermemektedir. Aksine, PSO sınırlandırılmamış arama alanında, portföye ağırlık dağıtımı yapmak için daha uygun bir teknik gibi görünmektedir."
