abstract: "İslam hukukçuları belirli bir problem hakkında ulaşılan hukukî çözümlerden birisinin mi yoksa tamamının mı doğru olduğu noktasında görüş ayrılığına düşmüşlerdir. Bu tartışmanın temelinde ictihadî konularda doğrunun tekilliği ya da çoğulluğuna dair belirsizlik yatmaktadır. Namazın farziyeti, inanç esasları, hırsızlığın ve zinanın yasak olması gibi hükmü açıkça belirtilen dinî konularda doğrunun tek olduğunda şüphe yoktur. İslam bilginleri, hükmüne dair kaynaklarda belirleyici bir kural bulunmayan şer`î meselelerde ise tartışmışlardır. Bir kısım Eş`arî ve Mu`tezile bilginlerinin oluşturduğu Musavvibe, sonuç ne olursa olsun bütün ictihadların doğru olarak niteleneceği görüşünü benimsemiştir. Dört mezhep imamı ve cumhur ulemanın desteklediği Muhattıe fikrine göre ise, birbirine zıt görüşlerden sadece birisi için doğru ifadesi kullanılabilir. Dolayısıyla bu görüşe göre bir şey, aynı kişi için ve aynı zamanda hem helal hem haram olamaz."
