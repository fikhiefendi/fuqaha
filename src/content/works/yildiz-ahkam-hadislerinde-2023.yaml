abstract: "İslâm hukuku insanların ihtiyaçlarına çözüm bulmayı amaçlamaktadır. İslam'ın doğuşu esnasında yeryüzünde ibadet amacıyla yapılan ilk mâbed olan Kâbe'den dolayı Mekke Arap yarımadasının merkezi haline gelmişti. Bundan dolayı ticari faaliyetler oldukça yaygınlaşmıştı. Bu ticari faaliyetler aracılığıyla insanlar birbirinin ihtiyacını gidermekteydi. Dolayısıyla diğer insanların ürettikleri mal veya hizmeti alabilmek için hemen hemen her bir birey, az çok ticari hayata katılmaktaydı. Ticari faaliyetler toplumdaki kazanç yollarının en başında gelmektedir. Bireysel ve toplumsal hayatta bu kadar önemli olan ticari faaliyetler, Kur'an ve Sünnetin belirlediği hak, hukuk ve adalet ilkelerine uygun bir şekilde yapıldığında hem birey hem de toplum bunlardan fayda görmektedir. Bunun tersi söz konusu olduğunda ise bireysel ve toplumsal zarar, aldanma ve aldatma söz konusu olmaktadır. Hz. Peygamber'in (s.a.v.) peygamber olarak görevlendirildiği dönemde ticaretle meşgul olan Arap toplumunun kendilerine has cahiliye döneminden kalma birçok ticari faaliyetleri vardı. Arap toplumunda çok yaygın olarak yapılan bu alışverişlerden bazısı, İslam'ın özüyle uyuşmadığı için Hz. Peygamber (s.a.v.) tarafından yasaklandı. Bu bağlamda özellikle hadis kaynaklarında yer alan Ahkâm Hadislerinde Hz. Peygamber tarafından yasaklanan akit türlerinin neler olduğu tespit edilecek ve bu akit türlerinin temel özellikleri incelenecektir. İslam hukukuna göre bir ticari faaliyette bulunması gereken temel ilke ve prensiplerin neler olduğu böylece anlaşılmış olacaktır."
