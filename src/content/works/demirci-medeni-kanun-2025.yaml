abstract: "XXI. yüzyıl Türkiye'sinde fıkıh, orta ve yükseköğretim müfredatında belli ölçüde yer almakta, teorik ve akademik çalışmalara konu olmakta, uygulamada ise ibadetler ve helal-haram bilgisi şeklinde varlığını sürdürmektedir. Bugün İslam hukuku adıyla da anılan fıkhın bu dönüşümü, hukuk gibi doğası gereği pratik hayata dokunan bir disiplin için dikkat çekici bir kırılmayı temsil etmektedir. Fıkhın çağın gereklerine cevap veremediği ve donmuş bir yapıya sahip olduğu yönündeki eleştiriler, XIX. ve XX. yüzyılda İslam dünyasının birçok coğrafyasında çeşitli biçimlerde dile getirilmiştir. Kimileri fıkhın yeniden yapılandırılmasıyla bu sorunun çözüleceğini ileri sürerken, bazıları da onu hukuktan bütünüyle ayırarak bireyin vicdanına hasredilmesi tezini öne sürmüştür. Bu tartışmaların yoğun biçimde yaşandığı dönemlerden biri de Osmanlı'dan Cumhuriyet'e geçiş sürecidir. Siyasal rejimdeki dönüşüm, hukuk alanında köklü bir değişimi de zorunlu kılmış; bu bağlamda Cumhuriyet'in erken dönem hukukçuları yeni hukuk düzenini inşa ederken fıkhı sıklıkla çağın gerisinde kalmış, modern toplum ihtiyaçlarını karşılamaktan uzak ve reformlara engel bir sistem olarak tanımlamışlardır. Bu çalışmanın temel amacı, söz konusu hukukçuların fıkha yönelttikleri eleştirilerin mahiyetini ve arkasında yatan sebepleri ele almaktır. Bu doğrultuda tezin birinci bölümünde, Cumhuriyet'in kuruluş sürecinde fıkha bakışı şekillendiren düşünsel ve tarihsel arka plan analiz edilmiştir. İkinci bölümde ise Medeni Kanun'a geçiş döneminde öne çıkan hukukçulardan Mahmut Esat Bozkurt (1892-1943), Ebü'lulâ Mardin (1881-1957), Mustafa Reşit Belgesay (1887 -1969) ve Hıfzı Veldet Velidedeoğlu'nun (1904-1992) fıkıh anlayışları incelenmiş; bu anlayışların söz konusu düşünsel ve tarihsel bağlam içindeki yeri değerlendirilmiştir."
