abstract: "Özelleştirme, devletin vazife ve işlemlerinin imkân ölçüsünde en aza indirilmesi, özel kesime devredilmesidir. İslam Hukukunda ihyâü'l-mevât, iktâ' ve vakıf müesseseleri gibi konular birer özelleştirme benzeri uygulamalar olmanın yanında, iktisadî canlılık ve kalkınmanın önemli fırsatları olmuşlardır. Ülkenin mamur hâle gelmesindeki yöntemlerden biri olan bu uygulamalar, kişilere şahsi teşebbüs hürriyeti ve ferdî ekonomik refah kazandıran önemli uygulamalardır. Bunlar, günümüzdeki özelleştirme uygulamaları ile birebir örtüşmese de kamu malının imar ve ihya etmeleri için özel kişi ve sektörlere tahsisi, bu varlıkların bazılarına karşılıksız olarak verilmesi bir çeşit özelleştirme olarak değerlendirilebilir. İslam iktisadında devlet, özel teşebbüsleri engellemediği gibi eğitim, teftiş, emniyet, gözetim ve düzenleme görevleriyle onları sürekli üretime teşvik eder. Ekonomide millileşme faaliyetlerinin artırılması için İslam ülkelerinin asli unsuru olan Müslüman girişimciler özellikle teşvik edilmeli ve bunun tüm halk tabanına ulaştırılması hedeflenmelidir. Millî menfaatler gözetilerek, stratejik alanların yabancıların eline geçmemesi için gerekli tedbirlerin alınması gerekir. Devlet tekeline son verme adına, özel sektör tekeline de yol açılmamalıdır. Kur'ân'ın ifadesi ile \"zenginler arasında dolaşan\" bir servet hâlini almamalıdır. Haksız bir zengin tabakanın oluşmasına meydan verilmemelidir. Sermayeyi tabana yaymak için devlet, vatandaşlarına her türlü kolaylığı sağlamalı ve destek olmalıdır. İşletim hakkının farklı yöntemlerle özel kişi ve sektörlere devri yapılsa da bunların devletin malı olarak kalmasının kamu menfaatine daha uygun olacağı söylenebilir. Bununla birlikte kamu sektörü ile özel sektör bir araya gelerek, sermaye emek ortaklığı (mudarebe), arazi ziraat ve tarım ortaklıkları (muzaraa) gibi birçok şirket kurarak el birliği ile ekonomik kalkınmaya ivme kazandırılabilir."
