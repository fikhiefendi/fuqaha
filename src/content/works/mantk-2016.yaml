abstract: "Şüphesiz ki insanların huzurlu bir şekilde yaşayabilmeleri için bireysel ve toplumsal olarak üzerlerine düşen görevleri sorunsuz bir şekilde yerine getirmeleri gerekir. Zira toplum içerisinde düzenin sağlanabilmesi, belirli kuralların herkes tarafından benimsenmesi ve bu kurallara riayet edilmesi ile mümkündür ki gerek beşeri kanun gerekse dini metinler bunları düzenlemeye çalışmıştır.Hukuk kurallarının yok sayılması durumunda devreye giren en önemli yaptırım ise cezalandırmadır. Bu sebeple, gelişmişlik durumu ve kültür seviyesi ne olursa olsun bütün toplumlarda suç ve suçlu her zaman bulunabilir. Öte yandan kapitalist sistem belli bir zaman diliminde ödemesi gereken bir miktar paranın ertelenmesi durumunda alacaklının gecikme süresinin uzunluğuna göre ekstra bir ödeme de talep etme hakkına sahipken böyle bir durum İslâm hukukunda asla söz konusu bile olamaz ki bu durum İslâm hukukunun sıklıkla üzerinde durup ve reddettiği bir cahiliye âdetidir.Bu itibarla bizde hukuk kurallarıyla doğrudan ilintili olacak şekilde araştırmamızı, şer'i açıdan gecikmeli borçlar ve bu düzlemde icra edilmesi gereken kanunları izah ve açıklama düzeyinde yapmaya çalıştık.Bilindiği üzere gecikmeli borç meselesi günümüz dünyasında önemli konular arasında sayılır. Çünkü genel olarak alışverişlerde gecikme söz konusu olabilir. Ayrıca bu konu çağdaş İslam hukukçuları arasında da tartışmalıdır. Bundan dolayı biz de bu çalışmamızda malların güvenli bir şekilde korunma keyfiyetini açıklamaya çalıştık. Çalışmamızın üst ve alt başlıklarını şöyle sıralayabiliriz. Ğaramenin kavramsal çerçevesi ve çeşitleri, gecikmeli ğarame ve nedenleri, gecikmeli ğarame, özellikleri, şartları, faydaları ve zararları, çağdaş âlimlerin gecikmeli ğaramenin hükmüne yönelik görüşleri, ta'vîdin hükmü ve riba ile arasındaki farkı, İslam hukukunun borçların geciktirilmesi hususundaki yaklaşımı, borcun garanti altına alınması, borcunu geciktiren kişiye verilen cezalar, bedenî ve psikolojik cezalar, mali cezalar, Kuzey Irak hukukunda gecikmeli ğarame hususunda bazı örnekler, taksitli alışverişlerde gecikmeli ğarame, istisna' (işçilik) akitlerinde gecikmeli ğarame, istisna' akitlerinde gecikmeli ğaramenin hükmü ve cezai koşulu, sözleşme akitlerinde gecikmeli ğarame ve hükmü, su, elektrik ve doğal gaz tüketiminde gecikmeli ğarame, telefon ve internet kullanımında gecikmeli ğarame, gayrimenkullerdeki gecikmeli ğarame, ziraat ürünlerindeki gecikmeli ğarame ve endüstriyel sektördeki gecikmeli ğarame.Buna ilaveten araştırmamız, geciktirilmesi söz konusu olan mali işlemlerin geri ödemelerinde ana sermayenin üstünde bir miktarın alınıp alınamayacağı konusunda fukahânın çeşitli görüşlerini etraflı ve objektif bir şekilde ele alır ve değerlendirilme ihtiyacı duyulan mevzularda da önemli tespitlerle beraber doyurucu bir sonuç ortaya koyar."
