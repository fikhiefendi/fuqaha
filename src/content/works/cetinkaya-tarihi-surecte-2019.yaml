abstract: "Mevlid, sözlük mânâsını muhtevî, sade bir kelime olmayıp, Hz. Peygamber'in, doğumu vesilesi ile, O'nun, mutlak Kur'ân'a dayalı hayat pratiği etrafında, sevgi ve saygı çerçevesinde birleşildiğinin ifadesi olarak, İslâm âleminde asırlarca itibâr görmüş bir kavramdır. Bu itibâr, bazen siyâsî, bazen fıkhî, bazen sosyo-kültürel sebeplerle, renk ve biçim değiştirse de, içinde bulunduğu topluma ve zamanın icâblarına göre, daima varlığını korumuştur. Zirâ, mevlid, dinî bir görev olmamakla birlikte ezanın bir beldede okunuyor olmasının, o beldenin müslüman toprağı olduğunun bir çeşit ilânı ve zımnen kabulü, aynı zamanda teminatı sayılabileceği türden bir işleve sahib olmuştur. Kısaca denilebilir ki, mevlid, tarih içinde, müslüman bir toplumun, derin şuurunun, tıpkı ezan gibi bir diğer mühim unsuru olmuştur. Bu unsur, yaşadığımız modern zamanın telâkkîleri ile ton kaybına uğrasa da, aslî rengini muhafaza etmeye muhakkak devam edecektir. Özellikle, mevlidi, bir kavram olarak, başka müslüman toplumlardan daha ziyade mânâlandırmış, ona adeta bir medeniyet zarâfeti yüklemiş bizim gibi bir Türk-İslâm toplumunda, mevlid, birleştirici dinî duygunun ve hassâsiyetin göstergesi olmayı daima sürdürecektir."
