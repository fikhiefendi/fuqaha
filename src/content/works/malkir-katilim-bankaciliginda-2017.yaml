abstract: "Çalışmanın amacı, Türkiye'de katılım bankalarının geleceği açısından ürün çeşitliliğinin yeterliliği ne düzeyde kullanıldığı ve Türkiye'deki katılım bankalarının konvansiyonel bankalara göre potansiyelinin etkin kullanılıp kullanılmadığı konusunda bilgi vermektedir. Elde edilen verilere uygulanan“tarihsel süreç yöntemi”ile katılım bankacılığı araçlarından bazıları değerlendirilmiş ve çeşitli analiz sonuçları elde edilmiştir. Bu sonuçlar doğrultusunda yıllar içerisinde katılım bankacılığının geliştiği ve bu gidişin kamu kurumlarının yaptığı çalışmalar ile desteklendiği görülmüştür. Ayrıca oran analizi yöntemi ile seçtiğimiz altı bankanın sektörlere ayrılmış şekilde karşılaştırılması yapılmıştır. Böylece elde edilen verilerde katılım bankalarının klasik bankalara oranla ne kadar yakın veya uzak bir ilişki içerisinde olduğunu ve bununla birlikte ikisini birbirinden ayıran faiz etmeninin, ülkenin katılım bankacılığına ilişkin önceki uygulaması ile de karşılaştırılarak yeni bir sistem ve mevzuat geliştirilmesine işaret ettiği düşünülmektedir."
