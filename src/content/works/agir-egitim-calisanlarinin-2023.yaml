abstract: "Günümüzde katılım bankalarının hizmetlerinde gelişmelerin olduğu görülmektedir. Bankaların şube sayılarının artmasının yanında sundukları hizmetlerin çeşitliliği de çoğalmaktadır ve bütün işletmelerde olduğu gibi bankacılık sektöründe de yoğun rekabet şartları vardır. Bankacılık sektöründe rekabet şartlarına uyum sağlayabilmek için bankaları başarıya taşıyacak en önemli etkenlerden birinin müşteri memnuniyeti olduğu düşünülmektedir. Bu nedenle yapılan çalışmada eğitim çalışanlarının katılım bankalarını tercih etme nedenleri araştırılmıştır. Katılım bankalarını tercih etme nedenleri müşteri profiline göre farklılaşabilir bu çalışmada müşteri profili olarak eğitim çalışanları seçilmiştir. Eğitim çalışanlarının tercih edilmesinin nedeni; incelenen yerli ve yabancı literatürde katılım bankaları tercihine yönelik eğitim çalışanlarıyla ilgili herhangi bir çalışmaya henüz rastlanılmamasıdır. Böylece kullanılan örneklemle gerçekleştirilen çalışmanın literatüre fayda sağlayacağı tahmin edilmektedir. Araştırmanın örneklemi; Aksaray ilinde görev yapan tesadüfi yöntemle belirlenen 502 eğitim çalışanından oluşmaktadır. Çalışmanın ölçeği; Anaç (2015) ve Arpacık (2019)'un yapmış olduğu çalışmalardan geliştirilmiştir. Çalışmada kullanılan ölçeğin güvenilirliği Cronbach's Alfa katsayısı ile ölçülmüş ve 0,980 bulunmuştur. Bunun anlamı ölçeğin yüksek derece güvenilir bir ölçek olduğuna işarettir. Ayrıca basıklık ve çarpıklık değerleri ile de güvenirlik katsayısına bakılmış ve sonucun -3 ile +3 arasında olduğu görülmüştür. Bu sonuç ölçeğin normal dağılım gösterdiğini ortaya koymaktadır. Ardından araştırmadaki ölçeğin yapı geçerliğini saptamak için açımlayıcı faktör analizi kullanılmıştır. Ölçeğin faktör analizine uygun olup olmadığı KMO ve Bartlett testi ile tespit edilmiştir. Bu testin sonucunda verilerin faktör analizi için uygun olduğu sonucuna varılmıştır. Faktör analizindeki boyutların belirlenmesi için Scree Plot grafiği yapılmış ve ölçeğin iki faktörlü yapı gösterdiğine karar verilmiştir. İki faktörlü yapıdan oluşan ölçeğin birinci faktörü,“Ürün ve Hizmetler”ve ikinci faktörü ise“Katılım Bankası Olması”olarak tespit edilmiştir. Dolayısıyla çalışmada ortaya çıkan sonuç; eğitim çalışanlarının katılım bankalarını tercih etmelerinin;“Ürün ve Hizmetler”ile“Katılım Bankası Olması”gerekçelerine göre belirlendiğini göstermektedir."
