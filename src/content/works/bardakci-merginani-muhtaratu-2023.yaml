abstract: "Mâverâünnehir hicrî 7. yüzyılın sonuna kadar Hanefî mezhebi için çok eser veren alimlere ev sahipliği yapmıştır. Mezhep imamlarından aktarılan birikimi yorumlayan ve kendi zamanlarında ortaya çıkan yeni meselelere dair hükümler veren fukahâ, mezhebin teşekkül sonrası gelişimine önemli katkılar sunmuştur. Meşâyıh adı verilen bölge fukahâsının, mezhebe katkılarının yer aldığı meseleleri, Hanefî fıkıh terminolojisinde karşılayan kavram nevâzildir ve aynı zamanda bu meseleleri ihtiva eden literatürün de adıdır. Mâverâünnehir bölgesinde de nevâzil literatüründen çok sayıda eser kaleme alınmıştır. Bu eserlerden biri olan Muhtârâtü'n-Nevâzil ise, mezhepte tercihleriyle muteber olan ve el-Hidâye'si ile meşhur Mergînânî'ye aittir. Bu tezde, Mergînânî'nin Muhtârâtü'n-Nevâzil'inin nevâzil literatüründeki yeri ve muhtevası, eserin özellikleri, literatürde nasıl kullanıldığı, hangi konularda daha çok atıf aldığı, müellifin hangi isim ve eserlerden istifade ederek telif ettiği, istidlalde hangi metotları kullandığı, eserin müellifin diğer bir eseri olan el-Hidâye ile karşılaştırıldığında nerede durduğu soruları çerçevesinde incelenmiştir. Bunlara ek olarak, Muhtârâtü'n-Nevâzil'in günümüze ulaşan nüshalarının sayısı, nerelerde bulunduğu, mevcut nüshaların durumları ve nüshaların versiyonları da araştırmaya dahil edilmiştir. Nihayetinde eserin günümüze ulaşan 136 adet nüshasının bulunduğu, nüshalarının 2'si hatalı 3 versiyondan oluştuğu, eserin hicri 11. yüzyılda şöhret bulduğu, sonraki literatür tarafından (i) Mergînânî'nin el-Hidâye'deki sözlerinin açıklanması, (ii) Mergînânî'nin el-Hidâye'deki veya başka bir meseleye dair zikrettiği özgün hükümleri içermesi, (iii) Mergînânî'nin tercihlerini yansıtması gibi işlevlerle kullanıldığı; daha çok ibâdât meselelerinden atıf aldığı ve el-Hidâye ile meselelerinin yarısından fazlasının ortak olduğu sonuçlarına ulaşılmıştır."
