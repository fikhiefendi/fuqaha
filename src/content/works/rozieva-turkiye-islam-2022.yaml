abstract: "Bu tezde, günümüzün en önemli meselelerinden olan evlilik ve boşanma konuları her yönüyle incelenmektedir. Laik düzen içerisinde dinen geçerli olan evliliğin yok sayılıp sayılamayacağı sürekli tartışılmaktadır. Bu tezin birinci bölümde aile kurumunun önemine, Müslüman toplumların ilk aile kanun layihası olan Hukuk-ı Aile Kararnamesi'ne ve döneminin sorunlarını çözmek için getirmiş olduğu yeniliklere yer verilmiştir. Nikâh akdi alışageldiğimiz imam nikâhı ya da dini nikâh ve medeni nikâh şeklinde tasnif edilmeden, tezin de savunduğu argümanlar gereği kanuni ve imam nikâhı başlıkları ile tasnif edilmiştir. Bir diğer husus, yargısal olanla vicdani olan ayrımının sadece laik düzenle birlikte ortaya çıkmış olmadığı, önceden de ispat imkânı vermeyen veya yeteri kadar ispat edilemeyen konularda benzer bir taksimin mevcut olduğu vurgulanarak diyâni hüküm ve kazaî hüküm ayırımı yapılmıştır. Yargı kararı, müftînün görevleri, fetvânın bağlayıcılık mahiyeti, fetvânın tarihsel ve kurumsal işleyişi, fetvâ görevini resmi olarak üstlenen kurum olarak Diyanet İşleri Başkanlığı ve onun fetvâ aktarma görevlerini en yoğun olarak yürüttüğü birimleri hakkında bilgiler verilmiştir. İkinci bölümde ise İslâm aile hukukunun gayrı resmi olarak uygulandığı alanlar ve ortaya çıkan sorunlara yer verilmiştir. Ana bölüm nişanlılık, nikâh akdi ve boşanma başlıkları ile üç kısma ayrılmış ve her bir kısımda mevcut problemlerle önerilen çözümler ve çözüm argümanları zikredilmiştir. Önerilen çözümler 2017-2020 seneleri arasında Ankara Müftülüğü Aile ve Dini Rehberlik Bürosu'na gelmiş olan aile ile ilgili 8327 soru esas alınarak incelenmiştir."
