abstract: "Bu çalışmada Kur'an'da en çok değinilen ve büyük önem verilen toplumsal bir yapı olan aile konusundan bahsedilmiştir. Ailenin değeri, ayetler ve hadisler ışığında açıklanmıştır. Kur'an'da yaklaşık 127 yerde“ehl”kelimesiyle anlatılan ailenin; insanlığın, toplumların ve özelde bireyin huzuru, kurtuluşu, dünya ve ahiret saadeti için ne denli önemli olduğu aktarılmıştır. Birinci bölümde tarih boyunca ailenin farklı toplum ve inançlardaki tezahüründen, konumundan, aile bireylerinin rollerinden, aile içi ilişki ve statülerden, kadına verilen değerden bahsedilmiştir. İnsanlığın gelişimi ile şekillenen ve değişen ihtiyaçların aile üzerindeki etkisi aktarılmıştır. İkinci bölümde âyet ve hadisler ışığında tefsir ilminin temel kaynaklarından yararlanılarak ailenin temel bileşenleri olan anne, baba ve çocukların aile içerisindeki önem ve rollerinden, hak ve sorumluluklarından bahsedilmiştir. Allah Resulü'nün örnek aile hayatından kısa kesitler sunulmuştur. Tüm bu deliller ışığında günümüzde yaşanan birçok ailevi probleme çözüm yollarının neler olabileceği anlatılmıştır. Üçüncü bölümde kadın ve erkeğin helal birlikteliği, temiz nesillerin oluşumu ve yetişmesi için nikâhın önemi anlatılmıştır. Nikâh ile ilgili âyetlerin müfessirler tarafından nasıl anlaşıldığı ortaya konmuştur. Evliliğin sonlandırılması ve buna bağlı olarak ortaya çıkan boşanma, iddet, nafaka ve miras gibi konulardaki âyet ve hadisler tefsir kaynakları rehberliğinde işlenerek çalışma nihayete erdirilmiştir."
