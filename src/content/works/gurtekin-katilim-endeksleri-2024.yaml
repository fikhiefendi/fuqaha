abstract: "Bu çalışma, faiz hassasiyetine sahip yatırımcıların, borsada listelenen katılım endeksleri ve bu endeksler için uygulanan arındırma işlemleri hakkında bilgi sahipliği ve bu konular hakkındaki tutum düzeylerini ölçmek üzere yapılmıştır. Ağustos 2024 itibariyle Borsa İstanbul yatırımcı sayısı 7.385.324 kişi olmakta ve bu araştırmanın çalışma grubunu da bu evren içerisinde kolay örnekleme yolu ile ulaşılan katılımcılardan oluşmaktadır. Kolay örnekleme yolu ile 725 kişiden oluşan örneklem sayısına ulaşılan bu çalışmada hedeflenen amacı ortaya çıkarmak için anket çalışması yöntemi kullanılmıştır. Araştırmanın ölçme araçlarının istatistiksel güvenilirliği Cronbach's Alpha katsayısı incelenerek değerlendirilmiştir. Elde edilen bulgulara göre araştırmanın bütün ölçme araçları 0.70 üzerinde yeterli bir istatistiksel güvenilirliğe sahip olmaktadır. Çalışma grubunun araştırmanın ölçme araçları olan faiz hassasiyeti, katılım endeksi ve arındırma işlemi bilgi düzeyleri ve katılım endeksi ve arındırma işlemleri tutum düzeylerine dair elde edilen bulgular şu şekilde gerçekleşmiştir; katılımcıların faiz hassasiyetlerinin yüksek bir düzeyde olduğu tespit edilmiştir, bu bulguya göre katılımcıların faiz içeren finansal işlemlerden kaçındıkları, dini sebepler ile faizsiz finansal enstrümanlara yöneldiği ifade edilmektedir. Bununla birlikte katılımcıların katılım endeksi ve arındırma işlemlerine dair de yüksek bir bilgi düzeyine sahip olduğu görülmüş ve son olarak da benzer bir şekilde araştırma katılımcılarının katılım endeksleri ve arındırma işlemlerine yönelik yüksek düzeyde olumlu bir tutuma sahip oldukları tespit edilmiştir."
