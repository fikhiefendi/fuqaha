abstract: "Bu çalışmada hekimlerin tıbbî alandaki haber ve görüşlerinin kabul şartları İslam hukuku açısından ele alınmıştır. Çalışma dört bölümden oluşmaktadır. İlk bölümde araştırmanın konusu, amacı, önemi ve metodu hakkında bilgi verilmektedir. İkinci bölümde ise tıp ilmi, hekimlik mesleği, hekimlerin görüşlerinin hangi başlıklar altında değerlendirilebileceği ve tıbbî bilgi ile amel etmenin meşruiyet zemini ele alınmıştır. Ardından hekimlerin görüşleri ilk olarak haber bağlamında ele alınmış ve hekimlerin bu görüşlerinin İslam hukuku açısından kabul edilme şartları incelenmiştir. Üçüncü bölümde ise hekimlerin görüşleri şahitlik, bilirkişilik ve içtihat bağlamında değerlendirilip kabul şartlarına değinilmiştir. Hekimlerin görüşlerinin haber, şahitlik, bilirkişilik ve içtihat bağlamında ele alınırken her birinin kendine has kabul şartları ve sonuçlarının olduğu tespit edilmiştir. Dördüncü bölümde ise ulaşılan sonuçlar ele alınmıştır."
