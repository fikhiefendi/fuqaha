abstract: "En yaygın Sünni mezhep olan Hanefi mezhebinin kurucusu İmam Ebu Hanife'nin de hocalarından biri olan İmam Cafer-i Sadık, Caferiye, İsna Aşere ve İmamiye diye isimlendirilen mezhebin kurucusu ve en önemli simalarından biridir. Bu itibarla, onun Kur'an-ı Kerim'in tefsiriyle ilgili çeşitli konulardaki görüşleri ve yorumları, tespitleri hem genel anlamda İslami sahih gelenek için ve hem de özel anlamda İmamiye geleneği için son derece önemlidir. Hz. Peygamber ve İmamlardan gelen tefsir rivayetleri, en güvenilir tefsir kaynaklarından biridir ve Kur'an'ın bazı ayetlerini tefsir etmenin en emin yoludur. Kur'an'ın Kur'an'la tefsiri, Kur'an'ın Sünnetle tefsiri, Kur'an'ın mecazi ifade ve aklî kurallarla tefsiri İmam Sadık'ın tefsirinde kullandığı yöntemler arasındadır. Bu çalışmada amaç, İmam Sadık'ın tefsir rivâyetlerinden itikadi, ahlâki ve fıkhî ilkeler çıkarmaktır. Altıncı İmam'ın tektanrıcılık, peygamberlik, imamet, diriliş ve adaletle ilgili Kur'an ayetleri hakkındaki yorumlarını ele almaktır. İmam Sadık tarafından tefsir edilen ve dini olarak güvenilir kaynaklarda adı geçen Kur'an-ı Kerim'in bazı ayetleriyle ilgili tefsirleri çalışmamızın temel konusu teşkil etmektedir. O, bu tefsirleriyle kendisini, insanların dünya ve uhrevi mutluluğunu elde etmeye adadı. Altı bölümden oluşan çalışmamızda Giriş'te araştırmanın konusu, önemi, metodu ve kaynaklarına temas edildikten sonra birinci bölümde İmam Sadık'ın hayatı ve mücadelesi çeşitli yönleriyle ele alınmıştır. İkinci bölümde itikadi konularda kendisine isnad edilen rivayetlere; üçüncü bölümde fıkhi konulardaki rivayetlere; dördüncü bölümde çeşitli ahlaki konulardaki rivayetler aktarılmıştır. Çalışma ile İmam'a ait sahih rivayetlerle ona isnad ve izafe edilen mevzu ve şaz görüşlerin birbirinden tefriki yapılarak ilim dünyasına mütevazı bir katkıda bulunmak hedeflenmiştir."
