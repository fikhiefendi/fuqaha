abstract: "Onarıcı ceza adalet sistemi, suç fiilinin yol açtığı hasarların ve kayıpların giderilmesini amaçlamakta, bu yönüyle geleneksel ceza adalet sisteminin aksine mağdurun süreçten mümkün olduğunca tatmin olmasını hedeflemektedir. Geleneksel ceza adalet sistemi, yalnızca faili cezalandırma üzerine kuruludur. Onarıcı adalet, faili cezalandırmaktan çok uyuşmazlığın taraflarının memnun olduğu bir mutlak adaleti sağlamaya çalışmaktadır. Uzlaştırma, bugün dünyada bilinen en yaygın onarıcı adalet yöntemidir. Anglo-Sakson temelli bir kurum olan uzlaştırma, mağdur ile şüpheli arasında mücadeleci sistem anlayışının bir yansıması olarak kendisini göstermektedir. 1970'li yıllarda mağdur merkezli Anglo-Sakson ceza hukukunun bir görünümü biçiminde Kanada'da ve Amerika Birleşik Devletleri'nde denenen uzlaştırma uygulamaları, kurumun gelişmesinde öncü rol oynamış, ilerleyen yıllarda birçok ülkeye kurumun ihracı sağlanmıştır. Türkiye'de 2005 yılından bu yana uygulanan uzlaştırma kurumu, özellikle 26.11.2016 tarih ve 6763 sayılı kanunla yapılan değişiklikle işlevselliğini arttırmıştır. Ülkemizde uzlaştırmacıların kontrolünde yürütülen uzlaştırma müzakereleri sonucunda birçok uyuşmazlık yargılama makamlarını meşgul etmeksizin çözülmektedir. Bu da kuşkusuz yargının iş yükünü ve yargılama masraflarını azaltmakta; failin ve mağdurun uzun süren yargılamalarla karşı karşıya kalmasını önlemektedir. Anglo-Sakson ülkelerinde ceza adaleti makamlarına geniş takdir yetkisi veren maslahata uygunluk ilkesi, bu ülkelerde uzlaştırma uygulamalarını sisteme çabuk bir şekilde adapte etmiştir. Kıta Avrupası ülkelerindeyse; ceza hukuku sisteminin belirleyici özelliklerinden olan kanunilik ilkesi ve kovuşturma mecburiyeti ilkesi, uzlaştırmanın Anglo-Sakson ülkelerine nazaran daha yavaş ilerlemesine neden olmuştur. İslam öncesi Arap toplumunda“wasta”kelimesiyle özdeşleştirilen uzlaştırma, İslam ile birlikte“sulh”kelimesiyle anılmaya başlanmıştır. Sulh; nefret ve düşmanlığa son verme, ıslah, daha iyi ve faydalı hâle getirme anlamlarını karşılamaktadır. Kuran'da iki Müslüman topluluğun çatışması halinde çatışmanın tarafı olmayanlara bu grupların barıştırılması ve uzlaştırılması emredilmiş; çatışmanın tarafı olanlardan gerekirse fedakârlık yaparak ihtilafı sonlandırmaları istenmiştir. Sulh, İslam'da özellikle tavsiye edilen bir müessesedir. Geçmişte Osmanlı Devleti'nde de uygulanan sulh, şeriatın hüküm sürdüğü İslam ülkelerinde uyuşmazlıkların çözümü için hâlihazırda uygulanmaktadır."
