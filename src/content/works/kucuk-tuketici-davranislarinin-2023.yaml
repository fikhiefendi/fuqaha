abstract: "Değişen ve dönüşen tüketim kültüründe tüketim davranışlarını anlamak, etki eden değerleri incelemek araştırmacılar ve işletmeciler açısından oldukça önemli bir konudur. Dinler de insan hayatının bütün alanlarına ilişkin her konuya temas eden geçmiş dönemlerden bu yana devam eden değerlerdir. Tüketim ve din veya inanç, ibadet ve değerler, tarihsel süreçte farklı etkileşim içinde bulunmuşlardır. Modern toplumun dönüştüğü tüketim kültürü etkisi ile dini değerlerde farklı dönüşümlere uğramıştır. Bu nedenle özellikle günümüz tüketim toplumu yapısında İslam dininin tüketim davranışları üzerindeki etkisi önemli bir faktör olarak değerlendirilmektedir. Bu çalışmanın amacı da tüketici davranışları ile dindarlıkları arasındaki ilişkileri incelemektir. Ayrıca tüketicilerin dindarlık düzeyleri ve tüketim davranışlarının demografik değişkenler (cinsiyet, yaş, eğitim seviyesi, medeni hâl ve gelir durumu) yönünden farklılaşıp farklılaşmadığını ortaya koymakta çalışmasının diğer bir amacıdır. Çalışma nicel araştırma modelinde hazırlanmıştır. Katılımcıların demografik değişkenlerin çeşitlenmesi amacıyla farklı şehirlerdeki bireylere ulaşım sağlanmıştır. Bu araştırma anket tekniği ile gerçekleştirilmiş ve frekans analizleri, bağımsız t-testi, tek yönlü ANOVA testi ve çoklu doğrusal regresyon analizlerinden yararlanarak analiz edilmiştir. Çalışmadan elde edilen sonuçlara göre, dindarlık ve tüketim davranışlarının demografik değişkenlere göre anlamlı farklılaşmalar gösterdiği tespit edilmiştir. Araştırmadan elde edilen diğer bulgulara göre, katılımcıların dindarlığının tüketim davranışlarından hedonik tüketim, faydacı tüketim, gösterişçi tüketim, savurgan tüketim, İslam' a uygun tüketim boyutları ile ilişkisi olduğu, rasyonel tüketim boyutu ile ilişkisinin olmadığı görülmüştür. Ayrıca analiz sonuçlarında çalışmaya katılan Müslüman bireylerin namaz kılma ve Kur'an okuma ibadetlerini gerçekleştirme ortalamalarında en düşük orana sahip olmalarına rağmen, bu ibadetlerin tüketim davranışı boyutlarından savurgan tüketim, gösterişçi tüketim, hazcı tüketim boyutlarında negatif yönde ilişkisi bulunan, açıklayıcı gücü en yüksek ve en önemli etken olması dikkat çeken sonuçlardandır."
