abstract: "Yargılama hukuku binlerce yıldır var olan davaların yürütülmesinde esas alınan kural ve ilkeleri inceler. Deliller de hâkimin önüne gelen bir davayı çözüme kavuşturması için ona yardımcı olan araçlardır. Tanıklık ise davanın ispatı için kullanılan delillerin en önemlilerindendir. Tarihi süreçte incelendiğinde davalarda kullanılan delillerin en çok başvurulanının tanıklık olduğu görülecektir. Tanığın durumunun Osmanlı hukuku açısından incelenmesi ile de bu önemli kurumun gelişiminin gösterilmesi sağlanabilir. Osmanlı hukukunda da İslam hukuku uygulandığı için İslam hukukunda tanıklık incelenmiş, Osmanlı uygulamasından da örnekler verilmiştir. Osmanlının Klasik devri denilen Tanzimat Fermanı'na (1839) kadar olan dönem bu çalışmada esas alınmıştır. Tanıklık delili tamamen insana dayanır. İnsana dayandığı için güvenilirlik konusunda diğer delillere göre daha sorgulanabilir durumdadır. Bu yüzden pozitif yargılama hukukunda hâkimler tarafından tanıklık deliline çok güvenilmez ve hükme gerekçe olarak en son çarede başvurulur. İslam hukukunda ise günümüz hukukuna göre tanık olmak, mahkemede geçerli olacak şekilde beyanda bulunmak çok zorlaştırılmıştır. Belirli kişilerin tanıklığı hiç kabul edilmezken, belirli kişilerin ifadelerinde töhmet bulunabileceği için hâkim tarafından kabul edilmemesi kurallaştırılmıştır. Bu çalışmada tanıklığın tarihi, tanık olabilmek için gereken şartlar ve tanık ifadesinde bulunması gerekenler ve ifadenin alınış şekli Osmanlı hukuku klasik devir ekseninde gösterilmiştir."
