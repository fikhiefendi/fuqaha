abstract: "Bu çalışma makâsıdü'ş-şeria bağlaımnda vahye muhatap olmuş, Hz. Peygamber'in yaşantısını yakından takip etmiş ve bu vesile ile Şârînin maksatlarına en iyi hâkim olmuş olan hulefâ-i raşîdîn dönemini incelemeyi konu edinmiştir. Bu esnada râşit halifeler döneminde çıkarılan yasaların, o döyapılan içtihat, kaza ve verilen fetvaların makâsıd çerçevesinde naıls gerçekleştiği değerlendirilmeye çalışılmıştır. Kur'an'ın birçok ayetinde kâinatta belirli bir nizamın olduğu, hiçbir şeyin boşuna yaratılmayıp bir gayeye dayandığı, âlemde tüm varlıkların insanın hizmetine verildiği vurgulanmaktadır. Fıkıh kaynaklarında makâsıdü'ş-şeria, Kur'an ve sünnetteki tüm hikmet ve gayelerin bilinmesi manasında kullanılmıştır. Râşit halifeler vahyin ilk muhataplarıdır ve kendilerinden sonraki nesillere kitap ve sünneti aktaran köprü görevi üstlenmişlerdir. Onların makâsıda bakış açıları şekil, mana ve maksat bağlamında olmuştur. Çalışma iki bölümden oluşmaktadır. Birinci bölümde makâsıdü'ş-şerianın kavramsal çerçevesi ele alınıp tanımı, önemi, çeşitleri ve makâsıd ile ilgili bazı kavram tahlilleri ele alınmıştır. Bunların yanı sıra halifelerin hayatları kısa bir şekilde ele alınarak şer'î maksatları nasıl bir ortamda kulandıkları gösterilmek istenmiştir. İkinci bölümünde râşit halifeler döneminde makâsıdü'ş-şerianın uygulama alanları usûlü fıkıh ve furû-ı fıkıh bakımından iki başlık altında değerlendirilmiş ve konular örneklerle desteklenmiştir. Sonuç kısmında ise yapılan çalışmadan elde edilen değerlendirmeler sunulmuştur."
