abstract: "Trablusgarp halkının şehre savaş açmış olan ve burayı işgal etmek isteyen Aziz John Şövalyeleri ordusuna karşı koyabilmek için Osmanlılardan yardım istemesiyle birlikte Libya, 1551 yılında tarihçilerin ortak ifadesiyle Birinci Osmanlı Dönemi'ne girmiştir. Osmanlı'nın bölgedeki birinci hakimiyeti dönemi yaklaşık iki yüzyıl sürmüş ve 1711'de sona ermiştir. Hakimiyetleri boyunca Osmanlılar, devletlerinin bütün kurumlarıyla ilgilenmiş, mimari yapılar ve camilerin yanı sıra cami, medrese ve hastaneleri içine alan vakıf binaları inşa etmişlerdir. Tarihçi ve eleştirmenler Osmanlı'nın bölgedeki hakimiyetinin boyutu ve Kuzey Afrika üzerindeki ekonomik, toplumsal, eğitimsel ve mimari kültür sahalarındaki etkisinin niteliği konusunda farklı düşüncelere sahiptir. Bu bağlamda, Trablusgarp'taki vakıf binalarını belgelendirme ve niteliklerini inceleme yoluyla akıllarda yer eden sorulara cevap vermenin önemli olduğunu düşünmekteyiz. Çalışmamızda da Osmanlı idaresinin araştırma konusu olan Trablusgarp şehrinin idaresinde oynadığı rolü ve şehirde bıraktığı etkiyi ele alacağız. Osmanlı'nın Trablusgarp'taki ilk camilerinin teknik standartlarına dair temel özellikleri bilmemizi sağlayacaktır. Söz konusu yapılarda zaman içerisinde bir takım restorasyon ve genişletme çalışmaları yapılmıştır. Dargut Camii ve Şaibu'l Ayn Camii gibi büyük camilerde bu tür çalışmalar yapılmış olup, namazgahlarında düzenlemeler gerçekleştirilmiştir. Bu camilerde uzun sütunlar, İslam mimarisinin tacı olan yuvarlak sonlu yapılar kullanılmıştır. Ayrıca camilerin çoğunda su şebekeleri ve tuvaletler inşa edilmiş, bunların bazıları silindirik yapıda tasarlanmıştır. Burada üzerinde durulması gereken bir nokta, Osmanlı ekolünün Trablusgarp şehrinin yeni çehresi ve Osmanlı Döneminde inşa edilen camileri üzerinde gözle görülür bir etkisinin olmasıdır. Bu dönemde yeni inşa edilen yapıların yanı sıra eski ve tarihi birçok yapı da restore edilmiştir. Aynı şekilde çatı sistemlerinde eşit kubbeler kullanılarak yerel malzemelerden etkilenildiği de görülmektedir. Bu yapı modelinde camilerin minareleri, yerleşim yerlerine yakın bölgelerde çok yüksek olmamakta, böylece müezzinin sesinin anlaşılır olması sağlanmaktadır. Osmanlı Devleti'nin resmi akidesini takip eden cami ve medreseler gibi dini kurumlar tesis edilmiş, bu kurumlar da şehirlerin düzen ve idare işinde rol almıştır. Söz konusu kurumlarda görev alan imamların Hanefi olması şartı aranmaktadır. Cami imamlığı görevini iki kişi üstlenmekte, bir kişi beş vakit namaz için imamlık yaparken, diğeri ise Cuma namazında imamlık yapmaktadır. Genellikle de öğrencilerin idare ettiği bir takım medreseler bulunmaktadır. Türk idareciler bu yeni ve modern medreseleri Hanefi mezhebini yaymak için kullanmış, buralardaki eğitim için İstanbul ve Mısır'dan getirdikleri Hanefi hocalarından yararlanmışlardır. Vakıfların etkisi, öne sürdükleri şartlarda kendisini açık bir şekilde göstermektedir. Vakıflar eğitim süreçlerine yahut diğer bir ifadeyle eğitim yöntemlerine ve eğitim kadrosunda bulunması gereken şartlara, yine idari ve mali yönetmeliklere müdahale etmektedir. Aynı şekilde bu kurumların Osmanlı idare sistemindeki (kadılık, müftülük, hatiplik, imamlık, katiplik, müderrislik gibi) siyaset, eğitim, din ve yargı görevlerinin çerçevesini çizme sorumluluğu bulunmaktadır. Türk idareciler ayrıca, büyük ilim adamlarını hatiplik, imamlık ve müderrislik gibi bu kurumlarla ilişkili önemli noktalara atama konusunda son derece hassastır. Osmanlı Döneminde mimarinin Ortaçağ'da hakim olan tekniklerden farklı dekorasyon tekniklerini esas aldığı dikkat çekmektedir. Böylece işlemeler ve mermer nakışlar büyük oranda bu dönemde Avrupa'da hakim olan tekniklerin etkisi altında kalmıştır. Çalışmada bahsi geçen dönemde Osmanlı'nın doğrudan ancak sınırlı olan etkisinin işaretleri göz önüne çıkarılmakta, Türklerin kimliklerini ispat etmek için (merkezi kubbe, silindirik ya da sekizgen minare, mermer minare gibi) ırk ve aidiyet temelli bazı mimari tarzları benimsediği ortaya koyulmaktadır. Bu tutumun amacı ise hakimiyeti elinde bulunduran Türklerin üstünlüğünü vurgulamaktır. Bu hususta Hanefi mezhebini kabul etmiş olmaları ve kendi camilerinde namaz kılmaları yardımcı bir unsur olmuştur. Nitekim mimari ve sanat bu bağlamda siyasi otoritenin hizmetinde kullanılmıştır. Böylece bölgedeki devasa mimari kazanımlar, Türk üstünlüğüne vurgu yapan bir işaret taşı niteliği taşımaktadır."
