abstract: "Bu tez, sûfi şeyhi Şeyh Yahyâ bin Abdullah Fahreddîn er-Rûmî el-Edirnî el- Hanefî'nin (ö.h. 864)“Ferâidü'l-Leâlî adlı kitabının ”Suçlar Bölümü“nden, ”Müftü'nün Uyacağı Kurallar Bölümü“ne kadar olan kısmının araştırma ve incelenmesini içermektedir. Kitap, yazar tarafından şerhlerin ve fetvaların derlendiği, fıkıh bölümlerine göre düzenlenmiş, Hanefi fıkhının fetvalarından oluşan muhtasar bir eserdir. Bu kitap, içerdiği fetvâlarda ”umum-i belvâ\" gibi özel meselelerin bulunması ve insanların bunları mütehassıslara ve alimlere sorma ihtiyacından dolayı önemlidir. Aynı şekilde Hanefi âlimlerin arasındaki garip, nadir ve tartışmalı fetvaları da içermektedir. Araştırmacı inceleme bölümünde, Şeyh Yahyâ bin Abdullah er-Rûmi'nin ilmî ve şahsî kişiliğine ilişkin her şeye atıfta bulunmuş ve yaşadığı dönemin siyasî, sosyal ve entelektüel yönlerini betimleyici- tarihsel yaklaşımla irdelemiştir. Tahkik bölümünde ise; metnin yazımı ve harekelendirilmesi, nüshaların karşılaştırılması ve metinler arasındaki farklılıkların tespit edilmesi, meselelerin geçtiği yerlerin ve diğer kaynaklardan yapılan alıntıların tespit edilmesi ve dipnotlarda belirtilmesi, incelemesi ve araştırılmasında bilimsel metot izlemiştir. Bu çalışmadan çıkan en bariz sonuçlar şunlardır: Müellif söz konusu fıkhî meseleleri delillendirirken rey ve kıyasa önem vermiştir. Kur'an-ı Kerîm ve Peygamberin sünnetinden alıntı yapıp onlarla delillendirmesi nadirdir. Bu durum ise Hanefi mezhebinin kıyasa ve akla verdiği önemi ve itibar ettiği ilk ilkelerden olduğunu ve İslâmi hükümlerde kullanılabilen güvenilir bir kaynak olarak kabul edildiğini teyit etmektedir. Aynı şekilde kitabını bâblara, bâbları da kolaylıkla istifade edilmesi için meselelere bölmesindeki hüneri, yine hadisleri nakletmedeki ve delillerin durumuna göre hangisini tercih edeceği hususundaki mahareti, Şeyh Yahyâ er- Rûmî'nin üstün yeteneğini göstermektedir. Farsça pek çok fetvayı zikretmesiyle, Farsça'ya da oldukça hâkim olduğu anlaşılmaktadır. Son olarak; nikâh, talâk, nesep, ehlü'z-zimme, ridde ve mîras meselelerinde; günümüz ilim talebelerine, âlimlerine ve hukuk insanlarına faydalı olacak pek çok önemli fetvâ bırakmıştır."
