abstract: "Bu araştırmada, İslam kültür ve medeniyeti açısından önemli bir yere sahip olan Endülüs'e İslam mezheplerinin girişi, bölgedeki yayılma faaliyetleri, siyasi ve itikâdî iz düşümleri tarihsel veriler ışığında incelenmesi konu edinmektedir. Endülüs'ün fethinden itibaren hem fıkhi hem de siyasi ve itikâdî mezhepler bölgeye taşınmıştır. Endülüs'ün kendine özgü yapısı ile etkileşime giren mezhepler bölgede ana unsurlarını korumanın yanında farklılaşma ve değişme sürecine de girmişlerdir. Endülüs'te dini anlayışlar ve etnik çeşitlilik, iktidarın belirlenmesinde önemli etkiye sahip olmuşlardır. Bu durumun bir sonucu olarak Endülüs tarihinde birbirinden farklı yönetim anlayışlarına sahip olan beş dönem ortaya çıkmıştır. Endülüs'ün bu değişken yapısı içerisinde Mâlikîlik, neredeyse bütün dönemlerde etkisini ve gücünü hissettirerek ana mezhep haline gelmiştir. Endülüs'te temsil imkânı bulan diğer mezhepler bu durumdan sürekli etkilenmiş ve bu dinî yapıya uygun olarak gelişim ve değişim gösterebilmişlerdir. Üç bölümden oluşan araştırmanın, birinci bölümünde Endülüs siyasi tarihi, ikinci bölümünde fıkhi mezhepler, üçüncü bölümünde ise itikâdî mezhepler incelenmektedir."
