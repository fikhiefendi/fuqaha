abstract: "Faiz, insanlık tarihi kadar eski ve tüm medeniyet havzalarında geçerlilik bulacak kadar şayi bir muameledir. Mukaddes kitaplarda faiz yasak olduğu halde felsefe, kültür ve ideolojilerde meşruiyeti tartışmalı bir konudur. Kökeni ilkçağa kadar uzanan bu tartışmalar, önceleri faizin ahlakiliği ve meşruiyeti üzerine iken iktisadî hayatın gelişmesi ve iktisadın müstakil bir ilim haline gelmesiyle birlikte tanımı, çeşitleri, kapsamı ve modern finans uygulamalarının faiz yasağı açısından değerlendirilmesi hususlarında yoğunlaşmıştır. Bu çalışmada, faiz ve faizli işlemlere dair Din İşleri Yüksek Kurulu'nun karar, mütalaa ve fetvalarının tespit edilmesi ve kategorize edilerek tasvir edilmesi suretiyle bir araya getirilmesi amaçlanmıştır. Bu çalışma bir giriş ve iki bölümden müteşekkil olup birinci bölümde Din İşleri Yüksek Kurulu, yapısı, görevleri, tarihi, faaliyetleri ve fetva verirken dikkate aldığı siyasetle tanıtılmıştır. İkinci bölümde faiz ve faizli işlemlerin tanımından, çeşitlerinden ve faize konu olan hükümlerin illetinden bahsedilerek faiz ve faizli işlemlere dair karar, mütalaa ve fetvaların tespit ve tasviri yapılmıştır."
