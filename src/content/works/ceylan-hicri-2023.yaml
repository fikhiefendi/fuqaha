abstract: "İslam hukukunun asli kaynakları Kur'an ve Sünnet (nass) tir. İslam hukukçularının akli çabalarını içine alan kıyas delili genelde icmadan sonra dördüncü delil olarak kabul edilmektedir. Karşılaşılan yeni bir meselenin hükmünü ortaya koymak için ilk olarak asli kaynaklara başvurulur. Nasslarda sabit bir hüküm bulunmadığı takdirde müçtehit, içtihat yoluyla mesele için hüküm aramaya koyulur. Nassların kapsamına girmeyen şerʽi ameli bir meselenin çözümünde gerçekleştirilen içtihat faaliyetinde, müçtehidin hangi metot veya metotları kullanacağı usûl ilminde önemli bir husustur. Zira Muâz hadisinde geçtiği gibi hakkında nass olmayan hiçbir olayın çözümsüz kalmayacağı önemli bir gerçek olup, İslam'ın kapsayıcı bir din olduğuna dair önemli bir işaret olarak kabul edilmektedir. Kıyas,-karşı çıkanlar olsa bile- İslam hukukunda içtihat faaliyetinin en önemli unsurlarından biri olup, nasların kapsam alanını genişleten bir delildir. Bu çalışma, İslam hukukunda kıyas delilinin akademik açıdan incelenmesini amaçlamaktadır. Kıyas delili, nasslarda açık bir hüküm olmadığı durumlarda benzer durumları karşılaştırarak hüküm çıkarma yöntemidir. Tez, kıyasın tanımını, dayanağını, yöntemini, uygulama alanlarını, tartışmalarını, beyân içtihadı ve diğer delillerle ilişkisini ele alacaktır. İslam hukuku içinde kıyas delilinin önemi, nassların kapsamını genişleten bir delil olarak kabul edilmekte ve hakkında nass olmayan hiçbir olayın çözümsüz kalmayacağı gerçeğiyle desteklenmektedir. Bu çalışmanın amacı, kıyas delilinin İslam hukukundaki yerini daha iyi anlayarak, gelecekte yapılacak çalışmalara katkıda bulunmaktır."
