abstract: "Bu çalışma, İslam hukuku çerçevesinde biyoetik meseleleri zaruret ve maslahat ilkeleri bağlamında ele almakta ve özellikle genetik müdahaleler gibi modern biyoteknolojik konuların etik boyutlarını değerlendirerek, İslam hukukunun bu tür çağdaş sorunlara nasıl yaklaşım sergilediğini analiz etmektedir. Tezimiz biyoetik disiplinin tanımını, tarihsel seyrini ve ilkelerini detaylandırarak başlamış; özerklik, zarar vermeme, fayda sağlama ve adalet gibi biyoetik ilkelerinin İslam hukuku ile kesişim noktalarını ortaya koymuştur. Ayrıca insan onuru ve insan hayatının kutsallığı gibi temel kavramlar ışığında, İslam hukuku ile biyoetik arasındaki ilişkiler değerlendirilmiştir. Tezimizde genetik müdahalelerin biyoetik bağlamda tartışılması, zaruret ve maslahat ilkeleri çerçevesinde ele alınmış ve İslam hukukunun bu gibi durumlarda hangi çözüm yollarını sunduğu ortaya konulmuştur. Bu mivalde zaruret ve maslahat kavramlarının, biyoetik meselelerin çözümünde oynadığı kritik role vurgu yapılmıştır. Bununla birlikte tezimiz, İslam hukukunun dinamik yapısının biyoetik meselelerdeki çözüm odaklı yaklaşımını gözler önüne sererek, modern bilimsel gelişmelerin, etik ve dini yaklaşımlarla uyumlu bir şekilde ele alınabileceğini göstermektedir."
