abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de şer'iyye sicilleridir. Şer'iyye sicillerinde, devlet merkezi ile olan yazışmalar, halk dilekleri, fermanlar, ilamlar, hüccetler, beratlar vs. gibi konulara ait bilgilerin yanı sıra, bölgede yetişen ürünler şehir ve kasabaların tahmini nüfusu, salgın hastalıklar ve aile hayatı gibi konular da bu defterlere kaydedilmiştir. Araştırma H. 1274 - 1280 / M.1857 - 1863 yılları arasını kapsamaktadır. Çalışmamızın konusu olan 1774/20 Numaralı Samsun Şer'iyye Sicili'nin mikrofilmleri Milli Kütüphane'de bulunmaktadır. Söz konusu defterin mikro filmi buradan alınmıştır. Bu çalışmayla 19. yüzyılın son döneminde Samsun bölgesinin dini, sosyal, ekonomik ve kültürel açıdan durumunun tespitine katkıda bulunmayı hedefledik. Tez, girişle birlikte üç bölümden oluşmaktadır. Giriş kısmında, araştırmanın problem ve önemi, veri toplama araçları, araştırmanın sınırlılıkları ile kullanılan yöntemler hakkında bilgi verilmiştir. Şer'iyye sicillerinin tanımı ve Samsun mahkemelerinde tutulan şer'iyye sicil defterleri ve bunlar üzerinde günümüze kadar yapılan çalışmalar belirtilmiştir. Çalışmamızın girişten sonraki birinci bölümünde 1774/20 numaralı belgenin transkribini yaptık. İkinci bölümde de kısa bir değerlendirme yaparak Samsun'un sosyo-ekonomik ve kültürel yapısı hakkında bilgi vererek çalışmamızı sonlandırdık. ANAHTAR KELİMELER Samsun, arşiv, Şer'iyye Sicili, mahkeme, Canik Sancağı"
