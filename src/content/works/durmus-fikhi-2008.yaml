abstract: "Günümüzde ?döviz alım-satım işlemleri? adı ile anılan para mübadelelerini spot ve türev (vadeli) işlemler olmak üzere iki grupta toplamak mümkündür:Spot döviz satımları, peşin kur ile yapılan işlemlerin genel adıdır. Araştırmalarımız sonucu banka hesabına kaydetmenin ?hükmî kabz? mahiyetinde olduğu tespit edilmiştir. ?Marjlı döviz satım işlemi?nde banka müşteriye kredi tanıma karşılığında gelir elde etmektedir. Karzdan gelir sağlama yasağı ihlal edildiği için bu işlemin caiz olmadığı görülmüştür. Döviz alım-satımlarının getiri amacıyla yapılması tartışma konusu olmuştur. İncelemelerimize göre fıkıhtaki ilgili şartlara riayet edildiği sürece böyle bir amaç bizâtihî mahzur teşkil etmez.Türev (vadeli) döviz işlemlerinin başlıca türleri, döviz forward, döviz future, döviz swap ve döviz opsiyon işlemleridir. Döviz forward ve döviz future işlemleri teknik bazı farklılıkları dışında özü itibariyle aynıdır. Bu işlemlerde fıkıhtaki ?vade (nesîe) faizi? yasağı ihlal edilmektedir. Konu derinlemesine tetkik edildiğinde vade faizi ile karz (borç) faizi arasında yakın bir bağ olduğu görülmektedir.Döviz swap işlemi ise biri spot, diğeri forward iki ayrı döviz satım muamelesinin birleştirilmesi ile meydana gelir. Dolayısıyla döviz forward işlemiyle ilgili mahzurlar bu işlem için de geçerli olmaktadır.Döviz opsiyon işleminde belirli bir bedel karşılığında ileri bir tarihte önceden tayin edilen kur ile döviz alma ya da satma hakkı satın alınmaktadır. Bu işlemin, sarf akdi kuralları ve hak satımı bağlamında caiz olmayacağı anlaşılmıştır.Vadeli döviz işlemlerinden döviz forward ve döviz future için önerilen ?döviz satım vaadleşmesinin? caiz olmadığı, döviz swap işlemi için önerilen ?karşılıklı karz işlemi?nin ise elde edilen yararların eşit olması halinde caiz olduğu sonucuna ulaşılmıştır."
