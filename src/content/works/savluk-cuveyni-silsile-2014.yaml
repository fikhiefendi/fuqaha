abstract: "İmam Şafiî'nin görüşlerinin tearuz ettiği iddiası Şafiî âlimlerce reddedilmiş, söz konusu iddianın sebebi olarak gösterilen İmam Şafiî'nin kadîm ve cedîd görüşlerini izah eden birçok eser kaleme alınmıştır. Bu eserlerden bir tanesi de Abdullah b. Yusuf el-Cüveynî'nin kaleme aldığı es-es-Silsile kitabıdır. Eser, farklı görüşlerin aslını bilmek, bu asıl üzerinden başka meseleleri anlamak ve kavleyn ifadesinden kastedilen anlamın ne olduğunu tesbit etmek hususunda son derece önemlidir. Eser, Halid b. Nevvar tarafından doktora tezi olarak çalışılmış ve ilim dünyasına kazanılmıştır. Çalışmamızda eserin yazarı Rüknü'l-İslam Cüveynî'yi tanıtmayı hedefledik. Kavleyn ile ilgili izahlarda bulunduk son olarak da Silsile'de ele alınan bölümlerden bazı meseleleri belirleyip sonuçlar elde etmeye çalıştık."
