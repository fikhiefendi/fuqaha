abstract: "Bu çalışmada müşterilerin katılım bankacılığını tercih etme nedenleri araştırılmıştır. Bu kapsamda çalışmada öncelikle çalışmanın teorik alt yapısı geniş bir şekilde açıklanmıştır. Sonra Gaziantep'teki katılım bankalarını kullanan müşterilerden anket tekniği kullanılarak elde edilen 248 veri analiz edilmiştir. Elde edilen bu verilerin analizi sonucunda; müşterilerin demografik özellikleri ile katılım bankacılığını tercih etme nedenlere ilişkin görüşlerin farklılık gösterdiği tespit edilmiştir. Ayrıca müşterilerin gelecekte katılım bankalarını çalışmaya devam etme niyetleri ile katılım bankalarını tercih etme nedenleri arasında görüş farklılığı olduğu tespit edilmiştir."
