abstract: "Ebu't-Tayyib et-Taberî (450/1058), hicri V. asırda Bağdat'ta kadılık yapmış ve Irak Şâfiî fukahasının otoritesi kabul edilen, münazaracı kişiliğiyle ön plana çıkmış önemli bir alimdir. Pek çok alanda eser telif etmiş olan Taberî'nin günümüze ulaşmış önemli eserlerinden biri Muhtasaru'l-Müzenî'ye şerh olarak telif ettiği et-Ta'lîkatü'l-kübrâ fi'l-füru' isimli eseridir. Çalışmamızda bu eserin tanıtılmasına katkı sağlamanın yanı sıra hilâf eserlerine benzer yönlerini ortaya koymak hedeflenmektedir. Müellifin mukaddimesinde, ihtilaflı meselelere yoğunlaşacağını belirttiği şeklindeki hedefi başta olmak üzere cedelî üslupla yazılan hilâf mesâilinin eserde geniş yer tutması ve ''ta'lîk/ta'lîka'' ifadesinin genellikle ihtilaflı meselelerin derlendiği ders notlarını isimlendirmede kullanılan bir kavram olması dikkate alındığında; bu eserin ilm-i hilâf nitelikleri baskın bir eser olduğu dolayısıyla hilâf açısından incelenmeye uygun olduğu anlaşılmaktadır. İki bölümden oluşan tezimizin ilk bölümünde Ebu't-Tayyib et-Taberî'nin hayatı, ilmi kişiliği ve et-Ta'lîkatü'l-kübrâ'nın genel özellikleri ortaya konmuştur. İkinci bölümde ise Ta'lîka'nın hilâf eserlerine yakınlığı, müellifin kullandığı cedel yöntemleri ve hilâf mesâiline etkisi gasp bölümü özelinde incelenip tahlil edilerek aktarılmıştır. Bu etkinin somut olarak tespiti için Ta'lîka'nın gasp bölümündeki hilâf mesâili; Taberî'nin öğrencisi Ebu İshak eş-Şîrâzî'nin (476/1083) en-Nüket ve Taberî ile münazaraları kayıtlara geçen çağdaşı Hanefî alim Kudûrî'nin (428/1073) et-Tecrid isimli hilâf eserleri ile yine Taberî'nin çağdaşı Şâfiî fakih Mâverdî (450/1058)'nin Muhtasaru'l-Müzenî şerhi olarak yazdığı el-Hâvi'l-kebîr isimli eserindeki ihtilaflı meselelerle mukayese edilerek incelenmiştir."
