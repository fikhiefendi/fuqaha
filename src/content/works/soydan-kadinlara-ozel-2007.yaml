abstract: "Kadınlara özel hallerle ilgili hükümlerin slam Hukuku açısından degerlendirildigi bu çalısma önsöz, giris, iki ana bölüm ve sonuç kısımlarından olusmaktadır. Önsözde kadınlara özel hallerle ilgili hükümleri bir arastırma konusu yapan süreçten bahsedilmis ve çalısmanın amacına vurgu yapılmıstır. Giris kısmında konunun önemi üzerinde durulmus, çalısmanın sınırları ve içerigi hakkında bilgi verilmis, ayrıca kaynakların nasıl degerlendirildigi belirtilmistir. Birinci bölümde kadınlara özel haller geçmisten günümüze tıbbî, psikolojik ve sosyolojik açıdan incelenmeye çalısılmıstır. Bunu yaparken farklı inançlar ve bu inançların etkilesimi de dikkate alınarak konunun bir bütün halinde ele alınması hedeflenmistir. kinci bölümde ise mübâseret, namaz, oruç, hacc, mescide girme, mushafa dokunma ve Kur'ân okuma gibi meselelere kadınlara özel haller olan hayız, nifas ve istihâzanın yaptıgı etkiden bahsedilmistir. Çesitli yorumlar bir araya getirilerek söz konusu hükümlerin geçerliligi tespit edilmeye çalısılmıstır. Bazen hükmün geçerliligi tespit edilmis, bazen seçenekler arasında tercih yapılmıs, bazen de delilleriyle birlikte bu konuda verilmis hükümlerden farklı bir hüküm öngörülmüstür. Sonuç kısmında ise genel bir degerlendirme yapılarak çalısmanın sonunda gelinen nokta ve bazı temenniler belirtilmistir."
