abstract: "Geçmişte eşcinsel davranış sergileyen kişiden bağımsız olarak hemcinsler arası cinsel ilişkiyi ifade eden eşcinsellik kavramı, günümüze gelindiğinde eşcinsel bireyin duygu, düşünce ve davranışlarını da kapsayan daha geniş bir kavramsal içerik kazanmıştır. Bu bağlamda çalışmamızın amacı eşcinsellikle ilgili kavram kargaşasını açıklığa kavuşturmak, eşcinsellik algısını dönüşüm kodlarıyla birlikte tahlil ederek İslam hukuku açısından eşcinsellik kavramını değerlendirme noktasında daha isabetli sonuçlara varmaktır. Tezde eşcinsellik meselesini sadece eşcinsel ilişkiyle ve eşcinsel ilişkiye yönelik cezâî hükümerle sınırlandırmaksızın eşcinselliği psikolojik, davranışsal ve sosyal yönleriyle de ele alarak konuyu daha geniş bir perspektiften değerlendirmek hedeflenmiştir. Böylelikle meseleye daha kapsamlı ve daha gerçekçi çözümler sunmak mümkün olacaktır. Araştırmamızda öncelikle, günümüzde türetilen kavramsal içeriğiyle eşcinsellik tanımlanarak bu kavramın İslam hukukunda karşılık bulan anlamı ortaya konmuştur. Modern dönemde psikoloji ve sosyoloji alanındaki bazı bilim çevreleri tarafından bir problem olarak ortaya konulan, eşcinselliğin insan doğasına aykırı olup olmadığı meselesine ya da insanın normali midir sorusuna İslam hukuku perspektifinden çözüm aranmıştır. Bu bağlamda eşcinselliğin fıtratla ilişkisi incelenmiş ve İslam hukuku açısından eşcinselliğin, bazı psikolojik ve sosyolojik faktörlerin etkisiyle insanın yaşamında sonradan meydana gelen ve insan fıtratına aykırı olan bir durum olduğu tespitine varılmıştır. Fıtratı değiştirmek yönüyle eşcinselliğin hükmü beyan edilmiştir. Hemcins cinsel birliktelikler, zina suçu gibi aileyi ve nesli olumsuz etkileyen toplumsal bir suç olarak İslam ceza hukuku kapsamında değerlendirilmiştir. Eşcinsel ilişki konusunda fakihlerin ortaya koydukları cezâî hükümler, delilleri ve fakihlerin yorumlarıyla birlikte ele alınarak bu hususta isabetli hükme varılması konusunda katkı sağlanmıştır. Bunun dışında eşcinsellik, eğilim, tavır ve davranış olarak da İslam hukukunun alanına girmektedir. Bu hususta da İslam hukukunda, toplumu ve aileyi koruma refleksiyle eşcinsel duyguların tavır ve davranış olarak ortaya konmasını kısıtlayıcı bazı tedbirler ortaya konmuştur. Çalışmamızda daha önce çalışılmadığını düşündüğümüz bu alana katkı sunmak amaçlanmıştır."
