abstract: "Bu yüksek lisans tezimizde, Mâlikî Fıkhı ile Fransız Medeni Hukuku -özellikle 1804 senesinde ortaya çıkan Napolyon Kanunları- arasındaki münasebetleri inceleyip akabinde Malikî Fıkhının, Fransız Medeni Kanunu üzerinde bir tesiri bulunup bulunmadığını, eğer tesiri bulunmuş ise bunun hangi alanlarda ve ne surette olduğunu etmeyi hedeflemekteyiz. Bu yüksek lisans tezi, giriş, üç bölümden oluşan bir gelişme ile sonuç bölümünden müteşekkildirbölümde, Malikî fıkıh ekoünün teşekkülü, kendi içeresindeki yer alan fıkıh ekolleri, usulü ve temel özellikleri ele alınmıştır. İkinci bölümde ise, Fransız medeni hukukunun menşei, tarihsel gelişimi ve temel esasları konu edilmiştir. Üçüncü bölümde ise Malikî fıkhı ve Fransız medeni hukuku arasındaki ilişkiler incelenerek bu iki hukuk sistemlerinin birbirinden ne derece etkilendiği ortaya koyulmuştur. Aynı bölüm içerisinde Fransız medeni hukukunun Malikî fıkhından etkilenmiş olduğunu gösteren borçlar hukukuna dair bazı meseleler ele alınmıştır. Sonuç bölümünde ise elde edilen ve tartışılan verilerin değerlendirmesi yapılmıştır."
