abstract: "Bu çalışmada, konvansiyonel bankalar ile katılım bankaları arasındaki farklılıkları araştırılmaktadır. Bu kapsamda bankaların finansal tablolarının karşılaştırmalı analizi ve makroekonomik değişikliklere karşı dayanıklılığını araştırılmaktadır. Türkiye'nin en büyük ticari bankalarını 2013 yılının 4. çeyreği ile 2020 yılının 4. çeyreği arasındaki çeyreklik finansallarını inceliyorum. Aynı dönemde makroekonomik değişkenleri de analiz edip ve makroekonomideki değişimlerin konvansiyonel ve katılım bankalarını nasıl etkilediğini araştırıyorum. Analiz sonuçların konvansiyonel ve katılım bankalarının ürün yapısı, varlık kompozisyonu ve verimlilik açısından birbirinden farklı olduğuna dair bazı kanıtlar olduğunu göstermektedir. Analizim ayrıca konvansiyonel ve katılım bankalarının makroekonomideki değişikliklere farklı direnç seviyeleri sergilediğini de göstermektedir. Bu farklılıkların birçoğu katılım bankalarının uyması ve takip etmesi gereken İslami Finans sisteminin getirdiği kurallardan kaynaklaklanmaktadır. Çalışmamın sonucunda katılım bankalarının makroekonomik değişikliklere karşı daha dirençli ve sağlam göründüğü sonucuna vardım. Veri setimdeki diğer bankalara kıyasla, makroekonomideki değişikliklerden ortalama olarak daha az etkilendiklerini söylemek mümkündür."
