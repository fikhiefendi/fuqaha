abstract: "Her mezhebin kendine göre bazı yöntemleri bulunmaktadır. Mezhep imamları amelî ahkâm alanında hüküm verirken bu yöntemlere riayet ederler. Söz konusu metotların klasik literatürdeki karşılığı fıkıh usûlüdür. Fıkıh usûlü anlayışı mezhepler arası farklılıklar gösterebilmektedir. Bazen bu farklılıklar yanlış anlaşılabilmekte, bunun sonucunda ise bazı mezhepler bir takım tenkitlere maruz kalmaktadır. Bütün mezheplerin önde gelen âlimleri tenkit edildikleri noktalar başta olmak üzere, birçok açıdan mezhebi savunmak için çok sayıda eser kaleme almışlardır. Dolayısıyla Hanefî mezhebinde de mezhepler arası mukayese yapan ve Hanefî mezhebinin delillerini savunan çok sayıda füru'-ı fıkıh kitabı mevcuttur. Bu eserlerden birisi de Hanefî fakihi Ali el Kârî'ye ait olan Fethu Bâbi'l-İnâye isimli eserdir. Müellif bu kitapta Hanefî mezhebinin dayandığı delilleri açıklamaktadır. Hanefî mezhebinin en çok eleştirildiği noktalardan birisi de hadîs kullanımı konusunda olduğu için, mezhebin hadîs kullanımı konusundaki tutumunu ele almaktadır. Ali el-Kârî, muhaddis kimliği de olan bir âlimdir. Bu kimliği sayesinde kitabında hadîsleri tutarlı bir şekilde ele almayı başarabilmiştir. Eserde Hanefî mezhebinin delil olarak kullanmadığı hadîslerin de kullanılmama sebeplerini açıklamaktadır."
