abstract: "Hicrî ikinci ve üçüncü asırda yaşamış olan, daha çok kelamcı kişiliği ile tanınan Ebû Mansûr Mâturîdî'nin (ö. 333/944), fıkhî yönü ortaya konulmaya çalışılmıştır. İmam Mâturîdî'nin günümüze kadar ulaşan iki eserinden biri olan Te'vîlâtü'l-Kur'an adlı eseri fıkhî görüşlerini bulabileceğimiz en kapsamlı eserdir. Çalışmamızda Nisa Suresi'nde yer alan fıkha dair görüşlerini inceledik. Çalışmamız giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Birinci bölümde İmam Mâturîdî'nin hayatı, ilmi şahsiyeti, hocaları, öğrencileri ve eserleri tanıtılmıştır. İkinci bölümde İmam Mâturîdî'nin fıkhî kişiliği, hanefî fakihi oluşu ve hanefî fıkhına katkıları üzerinde durulmuştur. Üçüncü bölümde ise Nisa Suresi'nde yer alan görüşlerine yer verilmiş ve hanefî mezhebine uygunluğu incelenmiştir. İmam Mâturîdî'nin kullandığı genel kaideler tespit edilmeye çalışılmıştır. Yapılan inceleme sonucunda Ebû Hanife'nin rey metoduna sahip çıktığı, ayetleri tefsir ederken Ebû Hanife'nin çizgisini takip ettiği görülmüştür."
