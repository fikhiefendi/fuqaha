abstract: "Bu çalışmada Türk ceza muhakemesi hukukunun modernleşme başlangıcı incelenmiştir. Ceza muhakemesinin modernleşmesi olgusu, dünyada 1808 tarihli Fransız Ceza Muhakemesi Kanunu (Code d'instruction criminelle) ile oluşturulmuştur. Türkiye'de ise diğer kıta Avrupası ülkelerinde olduğu gibi, adı geçen kanunun bazı değişikliklerle 1879 tarihinde Usûl-i Muhâkemât-ı Cezâiye Kânûn-ı Muvakkati adıyla kabul edilmesiyle bu modernleşme süreci başlamıştır. Kıta Avrupası'nın ceza muhakemesinin gelişimi ve modernleşmesi birden olmamış, zamanla ve diyalektik bir süreçle ortaya çıkmıştır. Çalışmada bu süreç, 1808 tarihli Fransız Ceza Muhakemesi Kanunu'na gidilen yol olarak ifade edilmiş ve bu yolların aşamaları belirtilmiştir. Antik Roma'daki ceza muhakemesi uygulamaları, Cermen kavimlerinin ceza muhakemesi pratikleri ve Roma Katolik kilisesi merkezinde Kanon hukuku çevresinde şekillenen engizisyon usulü, kıta Avrupası'nın ceza muhakemesi gelişiminde etkili adımlar olmuştur. Engizisyon usulünün, maddi hakikati arama yolunda sanığı hukuki güvencelerinden yoksun bırakması ve işkenceyi bir araç olarak kullanarak insan haklarını sistematik şekilde ihlal eden mekanizmaları saat gibi işletmesi, zamanla eleştirilere muhatap olmasına ve Fransız İhtilali döneminden sonra bu eleştirilerin kuvveden fiile çıkmasıyla yeni bir ceza muhakemesi sistemi arayışına vesile olmuştur. Bu yolun adı tüm kıta Avrupası ceza muhakemesi hukukunu doğrudan etkileyen Code d'instruction criminelle'dir. Modernleşme süreci Avrupa için bu kanunla başlamıştır. Türk ceza muhakemesi hukukunun modernleşme süreci, Avrupa ceza muhakemesinin iç dinamiklerinden farklı bir çerçevede gerçekleşmiştir. Bu kapsamda, Türk ceza muhakemesi hukukunun gelişimi, zamana, coğrafyaya, sosyal yaşam koşullarına ve siyasi yapıya bağımlı olarak şekillenmiştir. Bu bağlamda klasik öncesi dönemdeki Türk ceza muhakemesi hukuku, göçebe hayatın getirdiği pratik bir karakter taşırken klasik dönemde İslam hukukunun kurumsallaşmasıyla daha sistematik bir paradigmaya geçmiştir. Tanzimat Fermanı sonrası yapılan hukuk reformları çerçevesinde ceza muhakemesi hukukunun iyileştirilmesi için Fransız hukukunda Code d'instruction criminelle'in büyük oranda iktibas edilmesi Türk ceza muhakemesi hukukunu yeni bir paradigmaya dahil etmiştir. Bu yeni paradigma modern ceza muhakemesidir."
