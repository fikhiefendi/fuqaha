abstract: "Münâvî'nin, Feyzu'l-Kadîr isimli eseri, Suyûtî'nin el-Câmi'us-Sagîr adlı eserinin serhleri arasında en fazla ragbet görenidir Bu eserde, Münâvî, öncelikle eserinde genel hatlarıyla dil problemlerine ve fıkhî ihtilaflara dalmadan hadisten kastedilen anlamı kısaca açıklamıs, varsa hadisin sebeb-i vürûdunu zikretmistir. Ayrıca hadisleri açıklarken zaman zaman siirlere, benzer anlamı tasıyan hadislere ve muhtevayı destekleyen hadislere ve ayetlere yer vermistir. Daha sonra hadislerin sıhhat durumunu belirtmek amacıyla tahrîc ve degerlendirmede bulunmustur. Ancak, hadislerin tahric ve degerlendirmesini yaparken bazen Suyûtî'nin hadis hakkında vermis oldugu hükme itirazda bulunmustur. lim dünyasının yakından tanıdıgı Suyûtî'nin el-Câmiu's-Sagîr'i ile onun serhini ve kritigini yapan Münâvî'nin Feyzu'l-Kadîr'ini tanıtmak, özellikle mevzû haberlerin tespiti konusunda yöneltilen tenkitlerin, verilen bilgi ve malzemelerin mahiyeti ortaya konularak onların bilimsel degerlerinin arastırılması tezin baslıca hedefidir. Münâvî,, Süyûtî'ye olan itirazlarını üç sekilde dile getirmistir: Birincisi, ? Musannıf bunu kitabına almakla hata etti', vehm etti?, ?Musannıf aldanmıstır.? gibi açıktan itirazda bulundugu hadislerdir. kinci olarak, senetteki râvîlerle ilgili cerh ve ta'dîl imamlarının söylemis oldukları cerh ifadelerini zikrederek dolaylı olarak itirazda bulundugu hadislerdir. Üçüncü olarak ise; bnü'l-Cevzî'nin `lâ yasihhu, lâ yesbütü' degerlendirmesinde bulundugu hadislere Münâvî'nin itirâzi bir beyânının olmamasıdır. Çalısmanın önemli kısmını olusturan itirazlar da iki sekilde incelenmistir. lk olarak, Suyûtî'nin hasen ve zayıf olarak degerlendirdigi rivâyetlerden Münâvî'nin itirazda bulundugu ve uydurma olduguna isarette bulundugu tahrici ve degerlendirilmesinde bulunulmustur. Daha sonra ise Süyûtî'nin sahîh, hasen ve zayıf dedigi hadislere Münâvî'nin itirazda bulundugu rivâyetler incelenmistir. Tahrîc ve degerlendirmede Suyûtî'nin hadisleri tahrîc ettigi kaynaklar zikredilmis, daha sonra da Münâvî'nin Suyûtî'ye itiraz ederken kendisini destekleyici nitelikte oldugunu kabul ettigi bilgiler, kaynaklardan kontrol edilmistir. Ayrıca bu bilgilerin kaynakları da gösterilmistir"
