abstract: "Biz bu araştırmamızda İslâm Hukukunda geçerliliği şahısların icâzetine bağlı olan sözlü tasarrufları üzerinde durduk. Yapılan tasarrufun doğrudan geçerli olmayıp da geçerliliğinin icâzete bağlı olmasının sebepleri nedenleri vardır. Birinci bölümde icâzet kavramı ile ilgili genel bilgiler verdikten sonra bu sebepleri göz önüne alarak geriye kalan konumuzu üç ayrı bölümde inceledik. İkinci bölümde tasarrufta bulunan şey üzerinde başkasının da hakkının bulunması sebebiyle geçerliliği icâzete bağlı olan tasarrufları inceledik. Üçüncü bölümde karşılıklı yapılan tasarruflarda bir tarafın temsil yetkisine sahip olmaması dolayısıyla geçerliliği icâzete bağlı olan tasarrufları ele aldık. Dördünü bölümde ise irâde oluşumunun fesâdı ile ehliyet eksikliğinden dolayı geçerliliği icâzete bağlı olan tasarrufları inceledik. Araştırmamızda klasik fıkıh kitaplarından faydalandığımız gibi imkanlarımız ölçüsünde gerek günümüzdeki İslâm Hukukçularının, gerekse Modern Hukukçuların eserlerinden yararlanarak konuları mukayeseli olarak ele almaya çalıştık. Özellikle Türk Medeni ve Borçlar Hukukunda yer alan ilgili maddeleri belirtmeye özen gösterdik."
