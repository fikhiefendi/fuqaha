abstract: "Bu çalışmada Molla Hüsrev'in“Dürerü'l-hükkâm”adlı eserinin“ibadetler bölümünde”Şafiî mezhebine isnat ettiği 47 görüş ele alınmış, bu isnatlarda herhangi bir hatanın olup olmadığı tespit edilmeye çalışılmıştır. Şafiî mezhebi kaynaklarında yaptığımız araştırmaya göre Molla Hüsrev'in bu isnatların 37'sinde tam, geriye kalan 10 isnatta ise genel anlamda isabet ettiği tespit edilmiştir. Şöyle ki, 10 isnadın 4'ünde Şafiî mezhebinde var olduğu halde mezhepte tercih edilmeyen görüşler isnat edilirken, geriye kalan 6 isnatta ise mezhebin görüşlerinin Molla Hüsrev'in ifadesinden daha ayrıntılı olduğu anlaşılmaktadır. Ele alınan bu asıl konuya zihinsel hazırlık olmak üzere iki bölüm açılmıştır. Birinci bölümde; Molla Hüsrev'in yaşadığı dönem, ilmî ortam, hayatı, ilmî şahsiyeti ve eserleri; ikinci bölümde; Şafiî mezhebinin doğuşu, gelişimi, istikrara kavuşması, öne çıkan âlimleri ve önemli kaynakları tanıtılmıştır."
