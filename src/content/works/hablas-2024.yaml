abstract: "Bu çalışma, geleneksel bankalardaki mevduatların İslam hukuku ve yasal mevzuat açısından keyfiyetini teorik temellendirme yoluyla aydınlatmayı amaçlamaktadır. Bu bağlamda, mevduatın mahiyetini fıkhi ve hukuki açıdan anlama ve değerlendirme çabasına odaklanmaktadır. Yine çalışma, fakihler ve hukukçular arasındaki banka mevduatının mahiyeti konusundaki farklılıklara odaklanmıştır. Konunun bizzat hukukçular arasında ihtilaflı olduğu saptanmıştır. Söz konusu ihtilaf, bazılarının bunu bir borç olarak tanımlaması, diğerlerinin ise istisnai bir mevduat şeklinde görmesiyle ortaya çıkmıştır. Bazıları da bunun gerçek bir mevduat veya özel bir niteliğe sahip bir sözleşme olduğunu savunmuştur. Yine çağdaş fakihler arasında da bu konunun ihtilaflı olduğu tesbit edilmiştir; çoğunluk bunu bir borç olarak tanımlarken, diğerleri gerçek bir mevduat olarak nitelendirmiştir. Az bir kısmı ise bunun özel bir niteliğe sahip bir sözleşme olduğunu, adlandırılan sözleşmelerden biri olmadığını savunmuştur. Çalışmada tümevarımsal, tanımlayıcı ve analitik yöntemler izlenmiştir. Bu yöntemler, hukukçılar ve çağdaş fakihler arasındaki görüş farklılıklarını, argümanlarını, tartışmalarını, ve buna verilen yanıtları ortaya koymak, ayrıca banka mevduatı sözleşmesinden kaynaklanan etkileri, yükümlülükleri ve karşılıklı hakları ele almada kullanılmıştır. Araştırma, banka mevduatı sözleşmesinden kaynaklanan etkileri geniş bir şekilde ele almıştır. Söz konusu etkiler arasında mülkiyetin devri, mevduatın güvence altına alınması, karşılıklı olarak iade etme hakkı, bankanın mevduatı kullanma, bundan yararlanma, karşılıklı hesaplaşma talebinde bulunma, yatırılan paraların iadesi ve bu paraların güvencesi gibi konular bulunmaktadır. Son olarak araştırmacı, banka mevduatının krediye tercih edildiği ve faiz içeren bankacılık uygulamalarının haram olarak değerlendirildiği sonucuna varmıştır."
