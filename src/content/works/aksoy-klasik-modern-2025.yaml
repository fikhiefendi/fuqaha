abstract: "Kur'an ve sünnetten sonra üçüncü delil olarak ele alınan icmâ, temel şer'î deliller arasında yer almaktadır. Bu denli önemli olan icmâ, usûl alimleri tarafından incelenmiş ve farklı değerlendirmelere tabi tutulmuştur. İcmâın hakkında doğru değerlendirme yapılabilmesi için geçmişten günümüze icmâın nasıl anlaşıldığını anlamak gerekmektedir. Bu çalışmamızda icmâ kavramının daha net anlaşılması için klasik ve modern dönem usûl alimlerinin icmâ anlayışları tespit edilmeye çalışılmış ve birbiriyle mukayese edilmek suretiyle geçmişten günümüze icmâ tasavvuru aktarılmaya çalışılmıştır. Çalışma iki ana bölümden oluşmaktadır. İlk bölümde, klasik dönemin temel usul eserlerinden seçilen temsil gücü yüksek örnekler incelenerek Pezdevî, Gazzâlî, İbn Kudâme, Karâfî, Şevkânî, es-Sübkî ve Bihârî'nin icmâ anlayışları ele alınıp birbiri ile mukayese edilmiştir. İkinci bölümde ise, modern dönemdeki usul literatürü arasında seçilen eserler çerçevesinde Abdülvehhâb Hallâf, Muhammed Ebû Zehre, Abdülkerîm Zeydân ve Zekiyüddin Şâban'ın icmâ anlayışları incelenip birbiri ile mukayese edilmiştir. Daha sonra, klasik ve modern dönem arasındaki benzerlikler ve farklılıklar ortaya konmak suretiyle, icmâ anlayışının tarihi süreç içerisindeki nasıl ele alındığı tespit edilmiştir. Çalışma neticesinde şu kanaate ulaşılmıştır: Klasik dönemde genel kanaat icmâın hüccet olması ve her dönemde gerçekleşmesi yönündedir. Modern dönemde ise icmâın şer'î bir delil olması hakkında ihtilaf yok iken genel kanaat sahâbe döneminden sonra icmâın gerçekleşmesinin mümkün olmaması yönünde olmuştur. Şevkânî ise herkesten farklı bir tutum sergileyerek icmâın hüccet dahi olmadığını ifade etmiştir. Araştırmaya konu olan müelliflerin icmâ algılarında bazı farklılıklar olduğu gözlemlenmektedir. Nitekim icmâın şartları ve rükünleri hakkındaki detaylarda birçok ihtilaf bulunmaktadır. Bu durum ise icmâın, dinin temel meselelerini koruma altına alma işlevine sahip olduğunu, dinin temel meselelerin dışındaki konularda ise ideal manada icmâın gerçekleşmesinin tartışmaya açık olduğu sonucuna ulaştırmaktadır."
