abstract: "Tarih boyunca fıkıh alanında birçok büyük âlim yetişmiş ve ilim sahasında ön plana çıkmıştır. Bu âlimlerden biri, Hicri 340 (Miladi 951) yılında vefat eden İmam Ebû İshak el-Mervezî'dir. Şafiî mezhebinin öncü âlimlerinden biri olan el-Mervezî, hayatını ilme, öğretime ve telife adamış, fıkhî konularda birçok değerli eser kaleme almıştır. Bu eserler zamanla muteber kaynaklar haline gelmiştir. Bu çalışma, özellikle“katl, av, kurban ve gıda”gibi fıkıh meselelerine odaklanarak el-Mervezî'nin görüşlerini derlemektedir. Bu derleme, İmam el-Mâverdî'nin (Hicri 450 / Miladi 1058) değerli eseri“el-Hâvî”esas alınarak yapılmıştır. Çalışma, öncelikle İmam el-Mâverdî ve el-Mervezî'nin şahsiyetleri, ilmi konumları ve eserlerinin değerlendirilmesiyle başlamış, ardından el-Mervezî'nin hayatı ve Şafiî mezhebindeki konumu detaylı bir şekilde ele alınmıştır. Araştırma ayrıca el-Mervezî'nin görüşlerini, diğer Şafiî âlimlerin yaklaşımlarıyla karşılaştırmış ve geniş bir bakış açısıyla ele almıştır. Çalışma sonucunda, İmam el-Mervezî'nin derin bir içtihat anlayışı ve titiz ilmî metodolojisi olduğu ortaya konmuştur. Onun ilmî görüşleri, şahsi eğilimlerden veya körü körüne taklitten uzak, derin içtihadi analizlere dayanmaktadır. Mezhebin esaslarına bağlı kalarak meseleleri kapsamlı ve geniş bir şekilde değerlendirmiştir."
