abstract: "ÖZET îslâm devletler (umumî-hususî) hukuku' nun, bir devletin, diğer devletlerle olan banş esasma ve hususî hukuka dayalı gündelik ilişkileri ile ilgili konulan, İslâm devletler hususî hukukunu oluşturmaktadır. Hem İslâm devletler hususî hukuku, hem de Türk devletler hususî hukuku, kişiler arasındaki yabancı unsur içeren hususî hukukla ilgili ilişkileri düzenleyen ve anlaşmazlık durumunda hangi devletin hususî hukukunun uygulanacağını gösteren hukuk kurallanmn bütünü şeklinde tanımlanmaktadır. Hem İslâm devletler hususî hukukunun, hem de Türk devletler hususî hukukunun konusunu, vatandaşlık, yabancılar hukuku ve kanunlar ihtilâfı oluşturmaktadır. Bir hukuk terimi olarak ihtilâf, belli bir davanın inceleme organını belirleme konusunda iki yargı organı arasındaki anlaşmazlığı İfade etmektedir. İslâm devletler hususî hukukunda, müslümanların dışındaki insan unsurunu oluşturan ve yabancı unsur kabul edilen gayrimüslimler, a) Ehl-i harb (Müslümanlara karşı savaş halinde olanlar, harbîler), b) Ehl-i ahd (Müslümanlarla antlaşma yapmış olanlar) şeklinde ikiye aynlmaktadırlar. Ehl-i ahd olanlar da: 1) Zimmîler (İslâm devletinin himayesini kabul edenler, ehl-i zimme), 2) Muâhedler (kendileriyle banş yapılmış olanlar), 3) Müste' menler (kendilerine eman verilmiş olanlar, ehl-i emân) olmak üzere üç sınıf oluşturmaktadırlar. Hem İslâm devletler hususî hukukunun, hem de Türk devletler hususî hukukunun konusunu, vatandaşlık, yabancılar hukuku ve kanunlar ihtilâfı oluşturmaktadır. Hem İslâm devletler hususî hukukunda, hem de Türk devletler hususî hukukunda, yabancının hukukî durumunu belirten kendi kanunlan332 bulunmakla birlikte, bunun yanında antlaşmalar ve milletlerarası hukuk tarafından kabul edilmiş yabancıları koruyan bir çok kural bulunmakta ve her iki hukuk sistemi de, esas olarak, yabancılar hukukunu tanımakta ve göz önünde bulundurmaktadırlar. Hemen her hukuk sisteminde, milletlerarası hukukî ortaklığa katılan ülkeler arasındaki ilişkilerde, yabancı kanunlara uygulama alam belirlenmiş bulunmaktadır. Bu nedenle, belirli bir problemle ilgili iki veya daha fazla kanunun yetkisi hakkında tereddüt edilmesi durumuna \"kanunlar ihtilâfı \" denilmektedir. İslâm devletler hususî hukuku kuralları, hukukîlik, ahlâkîlik, adalet, eşitlik, ahde vefa ve dini tebliğ gibi başlıca temel ilkelerin yerine getirilmesi özelliği taşımaktadır. Hem İslâm devletler hususî hukuku, hem de Türk devletler hususî hukuku, kişiler arasındaki yabancı unsur içeren hususî hukukla ilgili ilişkileri düzenleyen ve anlaşmazlık durumunda hangi devletin hususî hukukunun uygulanacağını gösteren hukuk kurallarının bütünüdür. Her iki hukuk sistemi de, hususî (özel) hukuk ve aynı zamanda iç hukuk niteliğindedir. İslâm devletler hususî hukukunda yabancı unsur denildiğinde, gayrimüslimler, Türk devletler hususî hukukunda yabancı unsur denildiğinde ise, hukukî ilişkiye taraf olan kişilerin en az birinin veya hepsinin yabancı olması veya hukukî ilişkinin yabancı bir ülkede meydana gelmiş olması anlaşılmaktadır. Hem İslâm devletler hususî hukukunun, hem de Türk devletler hususî hukukunun konusunu, vatandaşlık, yabancılar hukuku ve kanunlar ihtilâfı oluşturmaktadır. Her iki hukuk sisteminde de, kanunlar ihtilâfının doğmasına sebep, farklı vatandaşlık veya farklı yabancı hukukların varlığıdır. Bu nedenle kanunlar ihtilâfı, yabancı hukuku dikkate alan ve devletler hukuku bakımından da, yabancı333 hukuk sistemlerinin tanınması esasına bağlanmıştır. Ayrıca her iki hukuk sisteminin de kaynaklarını, temelde iç hukuk oluşturmaktadır. İslâm devletler hususî hukukunda olsun, Türk devletler hususî hukukunda olsun, her kanunlar ihtilâfı kuralı, düzenlediği ilişkinin niteliğine göre, içerikleri farklı da olsa, belirli bağlanma noktalan esas alınarak kabul edilmektedir. Ayrıca, her iki hukuk sisteminde de, atıf (gönderme) teorisi kabul edilmektedir. Devletler hususî hukuku, çeşitli hukuk sistemlerinin yan yana bulunmasından doğan problemleri, milletlerarası medenî usûl hukuku ise çeşitli mahkeme organlarının yan yana bulunmasından doğan problemleri çözmektedir. Hem İslâm milletlerarası medenî usûl hukuku, hem de Türk milletlerarası medenî usûl hukuku, yabancı unsurlu özel hukuk anlaşmazlıkları ile ilgili, yargısal faaliyeti içermektedir. İslâm milletlerarası medenî usûl hukukuna göre, yabancı unsurlu hususî hukuk ihtilâflarında yetkili mahkeme, devletin yetkili kıldığı yargı organıdır. Türk milletlerarası medenî usûl hukukuna göre de, devletin yetkili kıldığı yargı organı olan Türk mahkemesidir. Bununla birlikte, her iki hukuk sistemi de, mahallî (yerel) hukuk olarak kabul edildiği için, hâkimin uygulamak zorunda olduğu hukuk, hâkimin kendi hukukudur. Ayrıca, her iki hukuk sisteminde de, hakemlik, yabancı unsurlu hukuk anlaşmazlıklarının çözümlenmesinde başvurulan yargı dışı bir yoldur. İslâm devletler hususî hukukunda, Türk devletler hususî hukukunun aksine nişanlılık tanınmamaktadır. Bununla birlikte, müslümanlarla ilgili nişanlılık ilişkisi, bazı hüküm ve sonuçlar doğurmakta,"
