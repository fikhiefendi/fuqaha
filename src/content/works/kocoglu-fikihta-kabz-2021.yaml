abstract: "Toplumda yaygın olarak kullanılan alım satım akdinin konuluş amacına uygun olarak sonuçlanması taraflar açısından büyük önem arz eder. Kabz da alım satım işlemlerinin sonuçlanabilmesi açısından gereklidir. Fıkıhta bir malda tasarruf yetkisine sahip olmak anlamında kullanılan kabz, alım satım işlemlerinin tamamlanabilmesi açısından gereklidir. Zira alım satım işlemlerinde kabz olmadığında işlemin asıl maksadı gerçekleşmez. Günümüzde teknolojinin gelişmesine bağlı olarak da kabz şekilleri değişmektedir. Bu işlemlerden biri de emtia türev işlemleridir. Emtia türev işlemlerinde işleme konu varlığın bir başkasına satılması kabzedilmeksizin gerçekleşir. Fıkıhta alım satım işlemlerinin sonuçlanıp maksadına uygun gerçekleşebilmesi için şart koşulan kabzın günümüz emtia piyasalarında iktisadi anlamda gerekip gerekmediği tartışma konusudur. Bu çalışmanın temel amacı fıkıhta kabz'la ilgili görüşlere, tartışmalara yer vermek ve tartışmaların sonucu olarak ortaya konan kabz öncesi satım yasağının maksadını ele almak ve ardından kabzın emtia piyasaları üzerindeki etkilerini ortaya koymaktır. Sonuç olarak bu çalışmada emtia türev sözleşmelerinde alım satım sözleşmelerinin amacının yerine gelmesi açısından kabzın gerektiği ve kabz gerçekleşmediğinde bu sözleşmelerin birtakım iktisadi problemlere yol açacağı sonucuna varılmıştır."
