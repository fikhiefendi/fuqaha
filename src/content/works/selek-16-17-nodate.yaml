abstract: "Bu çalışma, Hanefî fıkhının en etkili metinlerinden biri olan Burhâneddin el-Mergînânî'nin el-Hidâye adlı eserinin Osmanlı ilim dünyasındaki yerini ve 15. yüzyıl sonlarından 17. yüzyıl sonlarına kadar etrafında şekillenen eserleri ele almaktadır. Araştırmanın temel amacı, el-Hidâye'nin Osmanlı telif geleneğine etkisini tespit etmektir. Bu bağlamda medrese sistemindeki merkezî yeri çerçevesinde bu dönemde üretilen şerh, hâşiye, ta'lîka, ihtisar, tercüme ve tekmile türündeki çalışmaları tespit etmek ve mevzubahis çalışmalar çerçevesinde yürütülen ilmî tartışmaları inceleyip değerlendirerek Osmanlı fıkıh anlayışının temel dinamiklerini açığa çıkarmaktır. Çalışmada tespit, tahlil ve mukayese yöntemleri birlikte kullanılmaya çalışılmıştır. Osmanlı medreselerindeki fıkıh tedrisatı ve literatür üretim süreçleri birincil kaynaklar üzerinden incelenmiş, eserler arasındaki ilişkiler, ilmî tartışma gelenekleri ve yorum farklılıkları karşılaştırmalı biçimde ele alınmıştır. Tezimiz dört ana bölümden oluşmaktadır: Birinci bölümde genel olarak el-Hidâye'nin Osmanlı'ya intikali, fıkıh geleneğindeki yeri ve medreselerdeki fıkıh tedrisatına etkisi incelenmiştir. İkinci ve üçüncü bölümlerde, şerh ve hâşiyelerden başlanarak ilgili eserler tespit edilerek tanıtılmıştır. Son bölümde ise Osmanlı'da el-Hidâye üzerine yazılan eserlerin öne çıkanlarını bütüncül bir şekilde mukayeseye imkân verdiği düşünülen buyû' bölümü merkeze alınarak, bu kısım üzerine yapılan yorumlar ve tartışmaların seyri, beş mesele etrafında tahlil edilmiştir. Ulaşılan bulgular, el-Hidâye'nin Osmanlı medrese sistemiyle güçlü bir ilişki içerisinde olduğunu ve belirtilen zaman aralığı boyunca fıkıh tedris ve telif geleneğinin merkezinde yer aldığını göstermiştir. Yalnızca ilgili zaman aralığında el-Hidâye etrafında ikincil literatürde zikredilenlerden çok daha fazla eserin ortaya konulduğu anlaşılmıştır. Çok katmanlı şerh, hâşiye ve ta'lîka çalışmalarının büyük ölçüde geçmiş birikimi sorgulama ve metnin“doğru yorumunu”belirleme amacına yöneldiği, el-Hidâye'nin ve şerhlerinin gelişen medrese sistemine eklemlenmiş bir metin olarak müzakere edildiği anlaşılmıştır. Bu süreçte mantık, münazara ve belâgat gibi Osmanlı ilim dilinin temel unsurlarının etkisi açıkça hissedilmiş, böylece el-Hidâye bir fıkıh metni olmasının yanında metodolojik ve tartışmacı yönüyle Osmanlı ilim anlayışının yansıdığı otorite-çerçeve bir metin olarak öne çıkmıştır. 11/17. yüzyıl sonlarından itibaren ise el-Hidâye etrafındaki bu üretkenliğin azaldığı ve tartışma ağırlıklı hâşiyelerin yerini açıklama odaklı şerhlerin aldığı gözlemlenmiştir."
