abstract: "Hukmu Tevelli'l-Mer'eti Fi'l-Vezaifi's-Siyadiyye Ve Muşaraketuha Fi'l-Ameli's-Siyasi Fi'ş-Şeria Ve'l Kanun / İslam Hukuku Ve Modern Hukuk Açısından Kadının Yönetim Ve Siyasete Katılımının Hükmü adlı bu çalışmada varılan sonuçlar şunlardır: İslâm'ın kadına bakışı cinsiyet ayrımı olmaksızın insana verdiği saygıdan kaynaklanmaktadır. İslâmî kanunlar insanlar arasında eşitlik ilkesini benimsemiş olup özel bir durum olmadıkça hiç kimseye ayrı bir statü tanımamıştır. Zira Şeriat genel ve kapsayı bir mahiyete sahiptir. 1. Yaratılışta ve sorumlulukta kadın erkek eşitliği esastır. Mevcut olan bazı farklar ise istisnai durumlar olup kuralı bozmamaktadır. 2. Siyaset hayatın her alanını kapsayan Şeriatın ayrılmaz bir parçasıdır. İbn Kayyimʼin de vurguladığı gibi 'siyaset sadece Şeriatın uygun gördüğüdür' demek yerine aleyhte şerʻi bir delil bulunmayan her türlü siyasi faaliyet şeriata dahil olduğunu söylemek daha doğrudur. 3. Şerʻi açıdan kadını siyaset, hukuk ve (hisbe) toplum yararına olan faaliyetlerden alıkoyan bir delile rastlanmamıştır. Kadının siyaset alanına girmesini uygun görmeyenlerin öne sürdüğü deliller de kadının siyaset alanında sorumluluk almasına engel teşkil edecek derecede kuvvetli değildir. 4. Şerʻî hukukta hilafet makamı hariç siyasi görevlerin tümü erkek veya kadın fark etmeksizin o görevi yapacak bireylerin üstlenmesine herhangi bir engel bulunmamaktadır. Fakat kadınlar hangi yerde görev alabileceği konusu ise ülkelerin karar mercilerine kalmıştır. Örneğin başbakan, kadın veya erkek bakan atayabilir. Seçimlerde kadın veya erkek meclis üyeleri seçilebilir. Bunları kısıtlayan şerʻî bir kanun yoktur. Önemli olan toplum yararıdır. 5. Şerʻî kanunlar İslâm toplumunun inşasında herhangi bir gruba kısıtlama getirmediği gibi kadınlar için belli bir kontenjan da öngörmemiştir. Burada esas olan İslam toplumunun ve devletin ihtiyacı ve maslahatıdır. Kadının siyasete ve yönetime katılımı mubah dairesinde olup belli bir kontenjanla da sınırlı değildir."
