abstract: "Osmanlı Devleti'nin temel hukuki metinlerinden olan İstanbul Kadı Sicilleri; hukuk tarihi, sosyoloji, iktisat ve ilahiyat bilimleri gibi pek çok alana önemli veriler sunmaktadır. Bu araştırmada, 16-20. yüzyıl arasını kapsayan ve 100 ciltten oluşan İstanbul Kadı Sicillerinde hadislerin varlığı konu edilmiş, çalışma doküman incelemesi, tasnif ve tematik analiz yöntemleriyle ele alınıp hadis ilminin tenkit usulleri kullanılarak incelenmiştir. Hadislerin hangi konularda yoğunlaştığı, bir hukuk dili içerisinde nasıl alımlandığı ve hangi kaynaklardan intikal ettiği sorularına cevaplar aranmıştır. Çalışmada temel amaç, hadislerin Osmanlı hukuk metinlerinden olan kadı sicillerine nasıl ve ne biçimde yansıdığını ortaya koyarak hadis kullanımlarının hukuki işlemlere etkisini belirleyebilmektir. Tespit edilen hadislerin hangi kaynaklardan intikal ettiğini açığa çıkararak Osmanlı hadis bilgisinin kaynaklarını konumlandırmak araştırmanın bir diğer amacını oluşturmaktadır. Sicillerde yer alan tereke kayıtlarını kullanarak Osmanlı halkının okuduğu hadis kitaplarını belirlemek, bu eserlerin rivayetlerin sicillere intikalindeki rolunü tespit etmek de çalışmanın amaçları arasındadır. Araştırma sonucunda kadı sicillerinde tekrarları ile birlikte 300 hadis rivayeti tespit edilmiştir. Bu rivayetlerin 16 farklı konu altında toplanabildiği görülmüş, bunlar arasında ağırlığı köle azadı ve vakıf konularının çektiği saptanmıştır. Bazı hadislerin hukuk diline alımlanırken takdim-tehir, kelime değişikliği ve taksîr gibi değişikliklere uğradığı görülse de genel olarak yapılarının muhafaza edildiği anlaşılmıştır. Sicillerdeki hadislerin genellikle hukuki işlemin anlamını kuvvetlendirmek ve etkisini artırmak amacıyla kullanıldığı görülmüştür. Hadislerin sicillere intikalinde ise Meṣâbîḥu's-sünne, el-Câmiʿu'ṣ-ṣaġîr, Meşâriḳı'l-envâr ve bunların bilinen temel şerhlerinin merkezde konumlandığı anlaşılmıştır."
