abstract: "Şîa, arkadaş-taraftar anlamına gelen bir kelime olup daha sonrasında Hz. Muhammed'in vefat etmesiyle halifelik makamının“nass ve tayin”yoluyla Hz. Ali'nin hakkı olduğunu düşünen ve bu kurumu masum imamların devam ettirdiğini iddia eden grupların ortak adıdır. Genelde Şiîliğin bel kemiğini oluşturan“İmâmet nazariyesi”bu mezhep için önemli bir husus olarak karşımıza çıkmaktadır. Nass ve tayin ile günümüze kadar ulaşan imamların sayısını on iki şeklinde sınırlandıran İsnâaşeriyye, kişinin iman etmesini bu on iki imama inanmakla eşdeğer tutmuş hatta inanç sistemini bu husus üzerine inşa ederek fırka için ne denli önemli olduğunu göstermiştir. On iki imam prensibinin önemine vurgu yaptığımız çalışmamız giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde; çalışmanın kapsamı, araştırmanın amacı ve önemi, araştırmanın yöntemlerine yer verdik. Birinci bölümde; Şiîlik kavramının anlamı, Şiîliğin teşekkül süreci ve Şiî fırkalar hakkında genel bir bilgi verdik. İkinci bölümde; Şiîlik ve bugün Şiîlik dendiği zaman umumiyetle akla gelen İmâmiye fırkasının temel doktrinini oluşturan“imâmet kurumu ve on iki imamın hayatına”yer verdik. Üçüncü bölümde; Şiî ekoller arasında belirgin özellikleri ile ön plana çıkan ve konumuzun ana fırkasını teşkil eden İmâmiye Şîa'sının isimlendirilmesine, teşekkül sürecine, inanç esaslarının neler olduğuna ve on iki imamın önemi konusunda bilgi verdik. Sonuç da, varlığını Hz. Peygamber'den öncesine götürüp imama olan ihtiyaçla beraber yeryüzünün hüccetsiz kalmayacağını aklî ve naklî delillerle ispat etmeye çalışan bu fırkanın kıyamet'e kadar bu sistemin devam edeceğini bunun da on iki imam vesilesiyle gerçekleşeceğini iddia etmiştir. Bu doğrultuda İmâmiyye'nin, Şîa'dan farklı olarak imâmet doktrinine imamların sayısını ve gaybet hususunu eklemiş olduğu neticesine vardık."
