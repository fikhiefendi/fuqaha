abstract: "Sosyal medyanın cinsel suçlar üzerindeki etkisinin İslâm hukuku dinî hükümler bağlamında fıkhî açıdan değerlendirilmesinin ele alındığı bu çalışmamızda, geçmişten günümüze değişime uğrayan iletişim araçlarının, özellikle de kontrolsüz kullanılan sosyal medyanın, yaşantımız ve davranışlarımız üzerindeki olumsuz etkisi üzerinde durulmuştur. İnsanın olduğu her yerde ihlâl ve suçların kaçınılmaz olduğu, bir taraftan da bu ihlallere karşılık kişilerin haklarının korunması için hukuk sisteminin zorunluluğu bir gerçektir. Sosyal medya aracılığı ile işlenen cinsel suçlarda, Modern hukuk ve İslâm hukukunun verdiği cezaların birbirinden farklı olduğu görülmektedir. Cinsel suçlar Türk Ceza Kanunu'nda“Cinsel saldırı”,“Çocukların cinsel istismarı”,“Reşit olmayanla cinsel ilişki”, ve“Cinsel taciz”olarak değerlendirilirken, İslâm hukukunda ise evlilik dışı her türlü cinsel ilişki yasaklanmış ve bütün cinsel suçlar da zina kapsamında değerlendirilmiştir. Ayrıca Hz. Lut (a.s.)'dan itibaren çok tartışmalı bir konu olan eşcinselllik, patolojik sebeplerine girilmeden sosyal boyutuyla hem Modern hukuk hem İslâm hukuku açısından değerlendirilmiş, ilâhî dinlerin eşcinselliğe bakış açıları da kendi kutsal kitaplarına göre verilmiştir."
