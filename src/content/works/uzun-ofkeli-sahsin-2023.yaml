abstract: "“Öfkeli Şahsın Boşamasının İslam Hukukundaki Yeri (Kadına Şiddet Bağlamında Analitik Bir İnceleme)”adlı tez çalışmasında öfke anında verilen talâkın İslam hukukunda geçerliliği konusu ele alınmıştır. Konuyla alakalı deliller incelenmeye çalışılıp değerlendirme yapılmıştır. Tez çalışması bir giriş ve üç bölümden oluşmaktadır. Girişte, araştırmanın konusu, amacı, kapsamı ve sınırları açıklanmıştır. Birinci bölümde öfke ve şiddetin tanımı, nedenleri, belirtileri, öfke duygusunun dereceleri, işlevleri, Kur'an-ı Kerim ve hadis-i şeriflerde öfke kavramı işlenmiştir. Ayrıca günümüzde kadına şiddet olayları ele alınmıştır. İkinci bölümde İslam hukukunda talâkın tanımı, meşruiyeti, talâka olan ihtiyaç, talâkın yapılış şekilleri, talâk çeşitleri ve boşanmanın sonuçlarına yer verilmiştir. Üçüncü ve son bölümde ise öfkeli şahsın talâkının geçerliliğine yönelik görüşlere delilleriyle beraber yer verilmiş olup, mezhepler arası mukayese yapılmıştır. En sonunda ise konuyla alakalı varılan sonuç belirtilmiştir."
