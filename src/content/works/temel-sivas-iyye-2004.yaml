abstract: "ÖZET Şer'iyye Sicilleri genelde hukuk tarihi, özelde İslâm hukuk tarihi içerisinde önemli bir yer tutmaktadır. Diğer taraftan bu belgeler toplumların sosyal, ekonomik, siyasi, dini ve ahlaki yönleri hakkında da bilgiler sunmaktadır. Araştırma, Sivas Şer'iyye Sicilleri'nin M. 1792-1799 yıllan arasım kapsamaktadır ve bu dönem içerisinde Sivas şehrinde görülen ceza davalarım konu almaktadır. Böylelikle, araştırma hem şer'iyye sicilleri hem de Osmanlı ceza hukuku ile ilgili bilgiler içermektedir. Araştırma, bir giriş ve iki bölümden oluşmaktadır. Birinci bölüm, şer'iyye sicilleri ve Osmanlı ceza hukukuna dair genel bilgileri ihtiva etmektedir. Bu bölümde, şer'iyye sicillerinin tanımı, sicillerde yer alan belge çeşitleri, Osmanlı ceza hukukunda suç sayılan fiiller ve bu fiillere verilecek olan cezalar vb. konular yer almaktadır. İkinci bölüm, Sivas Şer'iyye Sicilleri'nde yer alan ceza davalarına ayrılmıştır. Bölüm, M. 1792-1799 yıllan arasındaki mahkeme kayıtlarından seçilen sekiz adet belgenin incelenmesinden oluşmaktadır. Belgelerin incelenmesine geçmeden önce Sivas Şer'iyye Sicilleri'nde ( M. 1792-1799 ) yer alan belgelerle ilgili genel bilgiler verilmiştir. Belgeler konularına göre tasnif edilerek sicillerde hangi konuya ait kaç adet belge olduğu belirtilmiştir. Bu kısa açıklamanın ardından ceza davalarına geçilmiştir. Tespit edilen belgeler, adam öldürme, müessir fiil, cenin aleyhine işlenen suçlar, tıbbi müdahaleden doğabilecek zararlar, yol kesme, tezvir, suça teşvik, sövme ve iftira konularını işlemektedir. Her belge, belgenin günümüz alfabesiyle yazılışı, sadeleştirilmesi, temel öğeleri ve incelemesi şeklinde dört başlık altında incelenmiştir. Bu bilgilerden sonra sicillerde yer alan diğer kayıtlara örnekler ve bölüm ile ilgili değerlendirme yer almaktadır."
