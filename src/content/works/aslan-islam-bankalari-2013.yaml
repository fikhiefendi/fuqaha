abstract: "Günümüz bankacılık sisteminin faiz üzerine kurulu olması İslami prensiplere uygun bir bankacılık sisteminin geliştirilmesini kaçınılmaz hale gelmiştir. Dünya nüfusunun yaklaşık yüzde 30'unu Müslümanların oluşturması ve Ortadoğu'da artan petrol gelirlerinin değerlendirilmesi gereksinimi de yeni bir bankacılık anlayışının oluşturulmasını zorunlu hale getirmiştir. Bu doğrultuda, ilk denemelerin ardından 1975 yılında 7 ülkenin girişimiyle İslam Kalkınma Bankası kurulmuş, bu da İslami bankacılığın ilk örneğini teşkil etmiştir. Bunun ardından, 35 yıllık bir geçmişi olmasına rağmen, İslami bankacılık sistemi hızla yayılarak dünya üzerinde 300'den fazla faizsiz bankacılık hizmeti veren kurum kurulmuş, bunların toplam aktif büyüklüğü de 1,2 trilyon dolara ulaşmıştır. Dünyada hızla gelişen faizsiz bankacılık sistemine Türkiye de zaman içerisinde adapte olmuştur. Nitekim günümüz itibariyle Türkiye'de hizmet veren dört katılım bankasının toplam bankacılık sektöründeki payı yüzde 5,1'e ulaşmıştır. Bu çalışma ile dünyada ve Türkiye'de İslami bankacılığın her geçen gün daha da büyüdüğü, faizsiz bankacılık sisteminin toplam bankacılık sektörü içinde küçük bir paya sahip olmasına rağmen istikrarlı bir gelişme göstererek payını arttırdığı anlatılmaya çalışılmıştır. Bu gelişimin nedenleri arasında faizsiz sistem finansal araçlarının reel proje ve yatırımlara yönelik olması ve prensip olarak faizden kesin olarak uzak durulması bulunmaktadır."
