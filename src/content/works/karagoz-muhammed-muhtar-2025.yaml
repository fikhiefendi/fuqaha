abstract: "Dr. Muhammed b. el-Muhtar eş-Şankıtî, İslam hukuk alanında geleneksel mirası modern çağın ihtiyaçlarına uyarlayan yenilekçi perspektife sahip önemli düşünürdür. İbadetleri düzenleyen İslam hukuku aynı zamanda toplumsal ve ahlaki bir rehberdir. Şankîtî İslam siyaset düşüncesini, tarihî vakıaların yorumlanması ve şer'î değerlerin çağdaş bağlamda nasıl yeniden işlevselleştirileceği sorusu üzerinden kurgular. Şankîtî'nin siyaset fıkhına dair önerdiği model, İslam'ın temel değerleri olan adalet, özgürlük, eşitlik ve şûrâ ilkeleriyle yeniden yapılandırılmış siyasal sistemin mümkün olabileceğini savunmaktadır. Bu yönüyle çalışmada İslam siyaset düşüncesinde yaşanan tarihsel kırılmalar ve bunların anayasal düzene etkisi, anayasal kriz kavramı etrafında tartışılmış; özellikle hilafetin saltanata dönüşmesi, siyasi ridde, fitne söylemi ve dış siyasal etkilerin İslam medeniyetindeki normatif bozulmalara etkisi vurgulanmıştır. Şankîtî'nin bu yaklaşımı, klasik fıkıh metinlerinde zaman zaman karşılaşılan istibdat ve zaruret temelli yönetim anlayışlarını aşmayı hedeflemektedir. Bu yönüyle onun yaklaşımı, fıkhın usûl ve maksat boyutlarını siyasi alanla irtibatlandıran normatif okumadır. Özellikle Muaviye'nin iktidarı ele alış tarzını siyasi ridde kavramı çerçevesinde değerlendirmesi, siyasi iktidarın meşruiyetinin ahlaki ve şer'î ilkelere bağlılık temelinde yargılar. Böylece Şankîtî, klasik fıkıh geleneğiyle irtibatlı kalmakta ve bu mirası, çağdaş siyasal sorunları çözebilecek normatif çerçeveye dönüştürmektedir."
