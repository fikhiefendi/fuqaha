abstract: "Osmanlı Devleti'nin ikinci başkenti olan Edirne, tarih boyunca önemli bir yerleşim merkezi olmuştur. Kadılık müessesesi, Osmanlı şehirlerinin özellikle yargı mekanizmasını yürüten çok yönlü önemli bir kurumuydu. Kadı yargı, idari, beledi ve noter gibi muhtelif görevleri yerine getirmekteydi. Kadı sicilleri, özellikle sosyal tarih olmak üzere çeşitli çalışmalara birinci el yazılı kaynak teşkil etmektedirler. Çalışmamıza konu olan 1825-1827 yıllarını kapsayan Edirne şer'iyye sicili daha çok Osmanlı halkının günlük yaşamını içeren konulardan oluşmaktadır. Defter mülk satışı ve icarı, alacak, boşanma, nafaka, nikâh, cinayet, hırsızlık, yaralama, tecavüz, mahalleden ihraç, müsadere, ihtida, köle, miras, hizmet bedeli, ölüm keşfi, vakıf icarı, esnaf anlaşmazlığı, keşif ve hakaret davaları gibi konuları içermektedir. Araştırmanın başlıca kaynağı 341 nolu Edirne şer'iyye sicili olup, çalışmayla alakalı kitap ve makalelerdir."
