abstract: "Mukâtil b. Süleyman hakkında tabakât ve biyoğrafi kitaplarında yer alan rivayetlerden anlıyoruz ki; gerek hayattayken gerekse ölümünden sonra isminden çok bahsedilen, ehli ilim arasında saygın yeri olan, yaşadığı hicri ikinci asrın tartışılmaz tefsir otoritelerindendir. Onun ?Tefsiru'l-Hamse Mieti Âyetin-Mine'l-Kur'ân? adlı eseri fıkıh ağırlıklı tefsir hareketine öncülük etmiştir. Bu eser ilk tedvin edilen fıkhî tefsirdir. Tezimizin konusu olan bu eserin incelenmesi, fıkhî tefsirlerin günümüze kadar geçirdiği gelişme sürecine katkısı olacaktır. Her ne kadar Mukâtil, zamanında haberlerin nakli hususunda uyulan yola aykırı bir yol takip etmişse de, onun meydana getirdiği bu eser, zamanındaki tefsir kitaplarının bir hülasası olması bakımından ehemmiyeti haizdir.Müfessirimiz, ahkâm âyetlerini açıklarken, âyeti âyetle, Hz. Peygamber'in sünnetiyle, sahabe ve tabiin kavilleriyle açıklamakta, âyet aralarına girerek yapmış olduğu kısa izahlardan başka, ahkâm âyetlerini, ihtiva ettiği hükümle ilgili olarak ihtilaflara temas etmeden kendi şahsi görüşünü belirtmektedir. Kıraat farklılıklarının ahkâm âyetlerinin anlaşılmasında mühim rol oynadığını belirtmekte, yine âyetlerin açıklanmasında sebeb-i nuzûl ve nesh meselelerinden faydalanmak suretiyle açıklamalar yapmaktadır.Mukâtil, birçok siyasî ve itikadî mezheplerin kaynaştığı bir ortamda doğmuş ve tahsilini orada tamamlamıştır. Bu sebeple o devrin siyasî ve itidakî fikirlerinden hiç etkilenmemiş olması mümkün değildir. Fakat çalışmamızda verdiğimiz örneklerde de görüleceği üzere onun eserlerinde, hakkında iddia edilen mezheplerin görüşlerini te'yid edecek herhangi bir açıklama bulunmamaktadır. Aslında o dönemde yaşamış kişiler hakkındaki değerlendirmelerin, dönemin fikrî ve siyasî durumundan kaynaklandığı da söylenebilir."
