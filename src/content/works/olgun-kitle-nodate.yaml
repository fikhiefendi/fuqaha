abstract: "Kitle fonlaması, girişimcilerin projelerinin kitle fonlamasına aracılık eden bir platformun internet sitesi üzerinden yapılan açık çağrı ile yatırımcılar tarafından fonlanması şeklinde tanımlanabilir. 2008 küresel ekonomik krizinden sonra özellikle girişimcilik finansmanı noktasında insanların başvurmuş olduğu alternatif finans kuruluşlarından birisi olan kitle fonlaması sistemi, konvansiyonel yapıda ortaya çıkmış ve bu formuyla yaygınlık kazanmıştır. Son yıllarda Malezya, Endonezya gibi ülkelerde kitle fonlamasının konvansiyonel uygulamasına alternatif olarak şer'î uyumlu platformların da kurulduğu müşahede edilmiştir. Ülkemizde ise yakın zamanda yapılan mevzuat düzenlemeleri ile konvansiyonel tarzda faaliyet gösteren paya dayalı kitle fonlaması platform sayısının her geçen yıl artış gösterdiği buna mukabil şer'î uyumlu bir kitle fonlaması platformunun bulunmadığı tespit edilmiştir. Kitle fonlamasının yapısındaki dayanışma ve imece güdüsü ile risk paylaşımı üzerine kurulan ortaklık yapısının İslâm iktisadının karakteristik yapısıyla büyük ölçüde örtüşüyor oluşu ülkemiz için şer'î uyumlu model üretilmesi hususunda hareket noktası olmuştur. Mevcut sistemin yeterince tahlili yapılmadan sağlıklı bir model önerisinde bulunulamayacağı öncülünden hareketle, tezin ilk bölümleri kitle fonlamasının tanıtılması ve yaygın uygulama türlerinin araştırılıp fıkhî açıdan tahlil edilmesine ayrılmıştır. Bu kapsamda tezin ilk bölümünde öncelikle kitle fonlaması sistemi genel hatlarıyla tanıtılmıştır. İkinci bölümde kitle fonlamasının farklı uygulama türlerinde karşılığı olan fıkhî akidler genel hatlarıyla zikredilmiştir. Üçüncü bölümde kitle fonlamasının konvansiyonel ve şer'î uyumlu uygulamalarının mukayese edilebilmesi için bağış, ödül, borçlanma ve paya dayalı kitle fonlaması türlerinde, alanında tanınmış platformlar seçilerek işleyiş tarzları ortaya konulmaya çalışılmıştır. İslâmî finansta öncü ülkelerden biri olması hasebiyle şer'î uyumlu platformlar Malezya'dan seçilmeye çalışılmış, tez kapsamında hazırlanan proje desteğiyle Malezya'ya gidilerek platform yetkilileri ile görüşme sağlanmıştır. Araştırmalar neticesinde elde edilen veriler ışığında mevcut uygulamanın genel hatlarıyla fıkhî tahlili gerçekleştirilmiştir. Dördüncü bölümde ise ülkemiz için müşâreke ve teşvik kitle fonlaması olmak üzere şer'î uyumlu iki kitle fonlaması modeli sunulmuştur. Çalışma neticesinde, şer'î uyumlu faaliyet gösterdiğini ifade eden platformların, konvansiyonel platformlardan farklı olarak, kabul ettikleri şer'î uyum standartları bağlamında projeleri şer'î taramadan geçirdikleri ve fıkhî danışmanlık veren kurumlardan destek alarak süreçleri yürüttükleri tespit edilmiştir. Girişim şirketlerinin projelerini şer'î uyum açısından değerlendirmede kullandıkları standartların, AAOIFI, SAC gibi kurullar tarafından hisse senetlerinin şer'î olarak izlenmesinde esas kabul edilen şer'î uyum standartları ile benzer oranlar ve fıkhî gerekçelendirmeler üzerine bina edildiği saptanmıştır. Çalışmada önerilen iki model çalışma usulü, aktif şekilde süreçlerde yer alacak şekilde tasarlanan fıkıh danışma kurulu, şer'î uyum tarama formu gibi özellikleri ile mevcut şer'î uyumlu kitle fonlaması platformlarından farklılık göstermektedir. Modellerin ülkemizde uygulamaya geçirilmesi durumunda, İslâmî hassasiyet sahibi girişimci ve yatırımcıların modellere rağbet göstereceği, üretim ve teknoloji alanında birçok projenin hayat bulmasına vesile olacağı ve faizsiz finansın gelişimine katkı sağlayacağı düşünülmektedir. Şer'î uyumlu kitle fonlaması sisteminin ülkemizde yaygınlık kazanabilmesi için araştırmacılar tarafından farklı modellerin de tasarlanması tavsiye edilmektedir."
