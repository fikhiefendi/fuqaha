abstract: "Bu çalışmada“Tasavvuf ve Şamanizm'de Eğitim”arasında mukayese yapılmıştır. Tasavvuf, Hz. Peygamber (s.a.v.)'in sünneti ve Kur'ân-ı Kerîm'in güzel ahlâk ile ilgili ayetleri ışığında gelişmiştir. Şamanizm'in ise yazılı bir kaynağa sahip olmadan sözlü kültür çerçevesinde, Türk kültürü ve çevresel etkenler etrafında geliştiği görülmüştür. Sûfîlerin ve şamanların halka dönük olmaları toplumda önder, sözü dinlenen ve itibar edilen kişiler olmalarını sağlamıştır. Halkın manevî, rûhsal ve gaybî alanla irtibatlarını sağlamışlardır. Halka dönüklük Şamanizm'de şamanın görevleri arasında yer alır. Sûfîler ise tasavvufa halk için değil Allah için girerler. Sûfînin ve şamanın eğitim anlayışında amaca ulaşabilmek için arınma ve yeniden doğma gibi benzer durumlarla karşılaşılabilmektedir. Ancak eğitimin amaçları birbirinden farklı olduğu gibi eğitimde yapılan uygulamalar da farklıdır. Tasavvufî Eğitim mürşid rehberliğinde Kur'ân-ı Kerîm'in ve Hz. Peygamber (s.a.v.)'in sünnetinin kaynaklık ettiği kurallar çerçevesinde oluşmaktadır. Tasavvufî eğitimde her tâlibin özellikleri aynı olmadığından öğrenciye göre eğitim verilmektedir. Bu durum Tasavvufî Eğitim'in uygulanmasında farklılıklara sebebiyet verse de Tasavvufî Eğitim'in bütünsel ve kuralsal genel yapısına aykırı değildir. Şamanizm'de eğitimin, tasavvufta olduğu gibi uyulması gereken bir kaynak ve genel geçer kabul edilmiş bir kurallar bütünü bulunmamaktadır. Şamanizm'de eğitimin büyük bir boyutu gözle görülmeyen rûhlar âleminde gerçekleşmektedir. Bu durum da şaman eğitimine büyük bir mistik hava katmaktadır. Bu çalışma altı ana başlık ve sonuçtan oluşmaktadır. Birinci bölümde, Tasavvuf ve Şamanizm'in tanımı yapılmış, kısaca tanıtılmıştır. İkinci bölümde, Tasavvufî Eğitim'e değinilmiştir. Tasavvufî Eğitim'de; Tasavvufî Eğitim'e giriş, Tasavvufî Eğitim'e hazırlık ve Tasavvufî Eğitim'in konusu alt başlıklarından oluşmuştur. Üçüncü bölümde, Şamanizm'de eğitim konusu ele alınmıştır. Dördüncü bölümde, Tasavvuf ve Şamanizm'de Eğitim'in sonlandırılması başlığında ele alınmıştır Beşinci bölümde, Tasavvuf ve Şamanizm'de eğitimin kazanımları ayrı başlıklar halinde ele alınmıştır. Altıncı bölümde, genel bir değerlendirme yapıldıktan sonra sonuç bölümüne geçilmiştir."
