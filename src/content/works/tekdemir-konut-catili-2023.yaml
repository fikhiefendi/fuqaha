abstract: "Kiraya verenin bir şeyin kullanılmasını veya kullanmayla birlikte ondan yararlanılmasını kiracıya bırakmayı, kiracının da buna karşılık kararlaştırılan kira bedelini ödemeyi üstlendiği sözleşme olarak tanımlanan kira sözleşmesi, Türk Borçlar Kanunu'nda“Genel hükümler”,“Konut ve çatılı işyeri kiraları”,“Ürün kirası”olarak üç başlık altında düzenlenmiştir. Yeni yasa, mülga 6570 sayılı GKHK'nın aksine, kiralanın niteliğini esas almıştır. Tezimizin konusu oluşturan konut ve çatılı işyeri kiraları da TBK'da düzenlenmiş olup, uygulamada en sık karşımıza çıkan sözleşme türüdür. Konut ve çatılı işyeri kira sözleşmelerine ilişkin düzenlemelerde kiracının kiraya verene göre daha çok korunduğu görülmektedir. Bu durumun en belirgin örnekleri kira sözleşmelerinin sona erdirilme hallerinde görülmektedir. Gerçekten kiraya verenin kira sözleşmesini sona erdirmesi kiracıya kıyasla çok daha zordur. Buna rağmen, kiraya verenin de bazı şartların varlığı halinde kira sözleşmesini sona erdirme hakkı vardır. Konut ve çatılı işyeri kira sözleşmelerinin konusunu oluşturan konut ve çatılı işyeri kavramı tezimizin ilk bölümünde açıklanmaya çalışılmıştır. Sonrasında konut ve çatılı işyeri kira sözleşmelerinin sona erme halleri incelenmiştir. Konut ve çatılı işyeri kiralarında sona erme halleri 6098 sayılı Türk Borçlar Kanunu'nun 347 – 356. maddeleri arasında düzenlenmiştir. Bu çerçevede hem belirli hem de belirsiz süreli kira sözleşmelerinin kiracı ve kiraya verenin ayrı ayrı bildirimli ve bildirimsiz fesih halleri ele alınmıştır. Çalışmamızın son bölümde ise, konut ve çatılı işyeri kira sözleşmesinin dava yoluyla sona erdirilmesi incelenerek öncelikle kiracıdan kaynaklanan sebepler açıklanmıştır. Bu sebepler tahliye taahhüdü, iki haklı ihtar ve kiracının veya eşinin oturulabilir konutunun bulunması başlıkları altında incelenmiştir. Sonrasında kiraya verenden kaynaklanan sebepler ise gereksinim, yeniden inşa veya imar ve yeni malikin gereksinimi başlıkları altında açıklanmaya çalışılmıştır. Ancak konut ve çatılı işyeri kiralarında tahliye sebepleri konut ve çatılı işyeri kira sözleşmelerinin sona ermesine özgü düzenlenen hükümleri ile sınırlı olmayıp ayrıca Türk Borçlar Kanununun genel hükümlerde düzenlenen sona ermesi sebepleri ile, konut ve çatılı işyeri kiralarının sona ermesi için özgülenen hükümlere aykırı düşmediği hallerde, sözleşme sona erdirilebilir. Bununla beraber, İcra İflas Kanunu'nda da bazı tahliye sebepleri düzenlenmiştir. Çalışmamızın son bölümde bu hallerden de bahsederek konut ve çatılı işyeri kiralarında tüm tahliye sebeplerini incelenmiştir."
