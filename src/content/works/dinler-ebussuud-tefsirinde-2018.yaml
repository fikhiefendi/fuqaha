abstract: "Tezimizin konusu, aralarında tenâkuz olduğu zannedilen âyetler ile anlaşılmasında zorluk bulunan âyetlerin ele alındığı müşkilü'l-Kur'ân'dır. Bu konudaki âyetler Ebussuûd Efendi'nin (v. 982/1574)“İrşâdü'l-῾akli's-selîm ilâ mezâya'l-Kitâbi'l-Kerîm”adlı tefsiri üzerinden tespit edilip çözümlenmiştir. Bu tezde, müşkilü'l-Kur'ân ilminin kavramsal çerçevesi tartışılmış, bu ilmin doğuşu ve bunu hazırlayan faktörler ile hicrî III ila X. (IX-XV.) yüzyıl arasında geçirdiği anlam daralması incelenmiştir. Ebussuûd Efendi'nin bu tartışmadaki yeri tespit edilmiş ve müşkilü'l-Kur'ân anlayışı ortaya konulmuştur. Âyetlerde işkâlin sebepleri Ebussuûd Tefsiri üzerinden hareketle oluşturulmuştur. Onun, müşkil âyetleri, telif (uzlaştırma), tevil, tahsis, umûmu nesih ve nesih gibi beş yolla çözümlediği tespit edilmiştir. Ayrıca müfessire göre Kur'ân'da müşkil âyetler bulunmasının hikmetleri ve bu müşkili gidermenin hükmü üzerinde durulmuştur. Müşkilü'l-Kur'ân konusunda günümüze kadar yapılan çalışmaların kronolojik bibliyografyası verilerek literatür değerlendirmesi yapılmıştır. Müfessirin biyografisi kapsamında kısaca hayatı, eserleri ve tefsirindeki metodundan bahsedilmiştir. Ebussuûd Tefsiri baştan sona okunarak onun tespit ettiği müşkil âyetler ve ortaya koyduğu çözümler konularına göre tasnif edilmiştir Müellifin bu bağlamda, ilâhiyat, yaratılış, nübüvvet, kulların âhiretteki durumu, farklı inanç grupları, gayb âlemine ait varlıklar, iman-amel münasebetleri ve benzeri konularla ilgili müşkiller üzerinde durduğu görülmüştür. Bu tez, bir mukâyese çalışması olmamakla birlikte özellikle Zemahşerî, Râzî, Beyzâvî ve Âlûsî'nin tefsirlerine müracaat edilerek karşılaştırmalar yapılmış, gerektiğinde onların tahlillerinden yararlanılmıştır. Bütün bunlar neticesinde Ebussuûd Efendi'nin müşkilü'l-Kur'ân ilmine sağladığı katkı ortaya konulmaya çalışılmıştır."
