abstract: "Çalısmamızın amacı, Sam müftüsü Mahmûd Hamza Efendi (el-Hamzâvî)'nin (v. 1305) hayatını, sahsiyetini ve eserlerini ortaya koymak ve onun, Tanzimat döneminde kısas cezalarının infazı konusunda Osmanlı mahkemelerinde yasanan problemler hakkındaki görüslerini ele almaktır. Çalısmamızda Mahmûd Hamza Efendi'nin hayatı kaleme alınırken, XIV. yüzyılda Suriye'de yasayan alimlerin hayatını anlatan biyografik eserlerden istifade edilmistir. Bunun yanı sıra Osmanlı Arsivleri'nde mevcut bulunan Mahmûd Hamza Efendi ile bilgiler incelenmis önemli görülen hususlar teze alınmıstır. Ulasabildigimiz eserleri detaylı bir sekilde incelenmis ve hangi konularda ve ne maksatla yazıldıgı açıklanmıstır. Çalısmamızın ikinci bölümünde Ahmet Cevdet Pasa evrakı incelenmistir. Onun Atatürk Kitaplıgı'ndaki 32. nolu evrakında Mahmûd Hamza Efendi ile Fetvâhâne'de görevli Abdüssettâr Efendi arasında infazın yargı kararının bir parçası olup olmadıgı hususundaki tartısma anlatılmıstır. Arastırmamız sonucunda Mahmûd Hamza Efendi'nin Osmanlı'nın son döneminde ifa ettigi görevleri incelerken onun Devlet erkanı ile arasındaki münasebetin iyi bir noktada oldugunu tespit ettik. Onun müftü olarak Osmanlı Adliyesi'ndeki cezaların infazı konusunda ortaya koydugu çözümün dönemin sorunlarına iyi bir öneri oldugunu müsahede ettik."
