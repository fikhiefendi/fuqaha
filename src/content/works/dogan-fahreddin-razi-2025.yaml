abstract: "İslâm hukukunun teorik temellerini oluşturan usûl-i fıkıh disiplini içerisinde zamanla farklı fıkhî istinbât usulleri gelişmiş ve bu yaklaşımlar, genel olarak Fukahâ ve Mütekellimîn ekolleri şeklinde iki ana çizgiye ayrılmıştır. Bu iki ekol, şer'î hükümlere ulaşma yöntemleri bakımından farklı usûllere dayanmakta ve bu farklar, usûl literatüründe belirgin şekilde kendini göstermektedir. Bu araştırma, söz konusu iki ekolü temsil eden iki seçkin âlimin, Fukahâ ekolünü temsilen Fahreddin er-Râzî'nin ve Mütekellimîn ekolüne mensup Ebü'l-Berekât en-Nesefî'nin, umum (âmm) lafızlara ilişkin yaklaşımlarını karşılaştırmalı bir yöntemle ele almaktadır. Çalışma, üç ana bölümden oluşmaktadır. İlk bölümde Fahreddin er-Râzî ve Ebü'l-Berekât en-Nesefî'nin biyografilerine, ilmî kimliklerine, eğitim aldıkları âlimlere, yetiştirdikleri öğrencilere ve telif ettikleri eserlere yer verilmiş; onların ilmî birikimlerini oluşturan temel dinamikler ile bu birikimin sonraki dönem ilmî çevreler üzerindeki etkileri analiz edilmiştir. İkici bölümde, lafız kavramı merkezinde anlam, delâlet ve lafız-kelâm ilişkisi gibi temel meseleler teorik bir çerçevede sunulmuş; ayrıca kelime, kelâm, anlam türleri, delâlet çeşitleri, usûl ekolleri, mutabakat ve tazammun gibi alt başlıklarla bu konular ayrıntılandırılmıştır. Üçüncü bölümde ise, umum lafızların delâlet yönüyle değerlendirilmesi merkeze alınmış; bu bağlamda, farklı usûl âlimlerinin bu konuya dair görüşlerine yer verilmiş ve nihayetinde, Râzî ile Nesefî'nin âmm lafızlara yönelik yorumları mukayeseli biçimde analiz edilerek, bu iki âlimin yaklaşım tarzları ortaya konmuştur. Bu çalışmanın amacı, hem umum lafızlar konusunu daha derinlemesine incelemek hem de klasik usûl literatürü içerisinde önemli yere sahip olan iki âlimin bu meseleye dair bakış açılarını gün yüzüne çıkarmaktır."
