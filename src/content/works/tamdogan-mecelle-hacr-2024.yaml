abstract: "Osmanlı Devleti'nde devrin medenî hukuk ihtiyacını karşılamak amacıyla Mecelle-i Ahkâm-ı Adliyye meydana getirilmiştir. Bu kanun metninde Hanefi hukuku esas alınarak hükümler arasında tercihlerde bulunulmuş ve mezhep dışı görüşlere yer verilmemiştir. Sıkı bir mezhep tutuculuğu çerçevesinde hazırlanan bir kanun metninin mezhebin mevcut eserleri baz alınarak incelenmesi önem arz etmektedir. Zira bu inceleme ile Mecelle'nin hangi hükümleri tercih ederek kanunlaştırdığı ortaya çıkmış olacaktır. Çalışmamızda karşılaştırmasını yapacağımız eserleri Muhtasaru'l-Kudûrî, Mecmau'l-Bahreyn, Vikâyetü'r-Rivâye, Kenzü'd-Dekâik ve el-Muhtâr şeklinde seçerek Mecelle'nin en güvenilir kaynak olarak meşhur olan bu temel metinlerden ne şekilde yararlandığı tespit edilecektir. Araştırmada karşılaştırma konusu belirlenirken günümüze hitap eden bir konunun olmasına dikkat edilmiştir. Zira içinde bulunduğumuz bu devir insanların en çok kendi menfaatlerini düşünüp başkalarının haklarını ve menfaatlerini ihlal ettikleri bir dönemdir. Hacir hükümleri ile bu kişilerin tasarruflarının engellenerek menfaatlerin korunması amaçlanmaktadır."
