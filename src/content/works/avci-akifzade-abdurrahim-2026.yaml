abstract: "Osmanlı ilmiyye teşkilatında önemli görevler üstlenen Âkifzâde Abdürrahîm Efendi'nin (1177-1231/1763-1816) İstanbul Bâb Mahkemesi kadılığı esnasında telif ettiği Mecelletü'l-mehâkim adlı fıkıh eseri bu araştırmanın konusunu oluşturmaktadır. Mübtedî kadı ve müftülere rehberlik etmek amacıyla kaleme alınan çalışma; XIX. yüzyıl başlarında bir Osmanlı fakihinin mevcut fıkıh, fetva ve nakil müktesebatını nasıl işlediğini analiz etmeye imkân tanımaktadır. Bu monografik araştırmanın temel amacı, Mecelletü'l-mehâkim'i şekil, muhteva ve yöntem bakımından inceleyerek dönemin Osmanlı fıkıh düşüncesini ve yargı pratiğini ortaya koymaktır. Metin analizi yöntemiyle yürütülen çalışmada, eserin fürû fıkıh ve fetva kaynaklarından yapılan nakillerin yanı sıra, müellifin özgün şerh, tahrir ve tahlillerini barındırması bakımından benzer mecmualardan daha ileri ve sistematik bir yapıya sahip olduğu tespit edilmiştir. İhtilaflı meselelerde dönemin fetva ve amel sahasında esas alınan müftâ bih ve ma'mûl bih görüşleri öne çıkaran açıklayıcı bir üslubun benimsendiği görülmüştür. Bu yönüyle çalışma, cari hukuki uygulamaları ve mahkeme ortamındaki pratik ihtiyaçları görünür kılmaktadır. Ayrıca eserde şeyhülislâm fetvalarının ekseriyetle er-Revâyihu'z-zekiyye gibi ihtisar formundaki telhis mecmualarından aktarıldığı saptanmıştır. Bu bağlamda, fetva telhislerine ve telhis yöntemiyle oluşturulan fetâvâ fihristi mahiyetindeki kaynakların literatürdeki işlevine dikkat çekilmiştir. Sonuç olarak Mecelletü'l-mehâkim'in, bir kadının perspektifinden dönemin Osmanlı hukuk pratiğini yansıtan, teorik birikim ile kazâ sahasındaki cari uygulamalar arasındaki ilişkiyi takibe imkân veren özgün bir kaynak olduğu ortaya konmuştur."
