abstract: "Fıkıh usûlü'nün ilk tedvininden sonra zamanla mütekellîmin, fukaha ve karma/memzûc olarak temelde üç ayrı yazım metodu olduğu kabul edilmiştir. Fakihlerin usûl konularının ele alış yöntemleri, eserlerinde yöneldikleri ana hedefler ve eserlerinin kapsamları birbirinden ayrı oduğu için usûl yazımı bu şekilde tasnif edilmiştir. Fakat yazılan bütün fıkıh usûlü eserleri bu tasnif kapsamınsa alınmamıştır. Ebû İshâk eş-Şirâzî'nin eserleri, bu metot tasnifi içerisinde kabul edilmeyen biridir. Şirâzî'nin usûl yazımında Şâfiî çağdaşlarından farklı yönleri incelenmektedir. Bu çerçevede ilk bölümde Şirâzî'nin hayatı, kişiliği, eserleri, yaşadığı dönem ve Şâfiî çağdaşlarının hayatı anlatılmıştır. İkinci bölümde metotların tasnifi ile mütekellîmin, fukaha ve memzûc metotlarının temel özellikleri, bu metotlara göre yazılan eserler ve metotların tasnifine yönelik eleştiriler işlenmiştir. Şirâzî'nin eserlerinin incelendiği son bölümde ise Ebu İshâk eş-Şirâzî'nin usul yazımında Şâfiî çağdaşlarından kitapların başladığı konu itibariyle, bölümlendirme açısında, kullandığı kavram ve terimler açısında, mezhebe bağlılık açısında, atıf yaptığı âlimler açısında, fıkıh usûlü-kelam, mantık ve celed ilişkisindeki farkı ve ele alıp almadığı konular açısında farklı yönleri ele alınmşıtır. Varılan sonuçta Şirâzî'nin takip ettiği metot Sâfiî'nin metoduyla aynı aldoğudur."
