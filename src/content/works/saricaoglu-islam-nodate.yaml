abstract: "Günümüzde İslâm hukuku alanında karşılaşılan problemlerin çözümüne dair çabalar ve arayışlarda ihmal edilmemesi gereken noktalardan birisi, fıkıh literatüründe usûl ve fürû kaideleri olarak ortaya konan küllî nitelikteki prensiplerin dikkate alınmasıdır. Bu düşünceden hareketle çalışmamız, hükümlerin anlaşılması ve yorumlanmasında önemli role sahip olduğunu düşündüğümüz usûl ve fürû disiplinlerinde kendisine sıkça başvurulan ekseriyet prensibinin incelenmesine hasredilmiştir. Söz konusu prensibe,“bir şeye nicelik veya nitelik bakımından üstün olmak”manasını ifade eden tüm kaideleri içermesi amacıyla“ekseriyet prensibi”isminin verilmesi uygun görülmüştür. Bu prensip, İslâm hukuku alanında yazılan ilk dönem eserlerde“gâlib”ve“nâdir”kavramları etrafında şekillenmektedir. Çalışmamızda“gâlib”in“ekser”i,“nâdir”olanın ise“ekall”olan tarafı içermesi konusu üzerinde durularak her bir kavramın diğeriyle ilişkisi ve sınırları ortaya konmaya çalışılmıştır. Fıkıh ve usûl eserlerinde“çok”olan tarafa göre düzenlenen hükümler bir hayli fazla olmakla beraber bu niteliği taşımayan pek çok hükmün“az”olan tarafa göre düzenlendiği görülmektedir. Çalışmamızda bu yerlerin tespit edilmesini ve ekseriyet prensibinin dikkate alınmadığı yerleri gerekçeleriyle açıklamayı hedeflemekteyiz. Ekseriyet prensibinin kapsamındaki kavramları değerlendirme neticesinde, bu prensibin nitelik ve nicelik açısından iki ayrı şekilde mütalaa edilmesinin daha doğru olacağı sonucuna ulaşılmıştır. Ulaştığımız bu sonucun hukukta çözüm aracı olarak kullanılan ekseriyet prensibi hakkında yapılan sübjektif yorumlamaların önüne geçeceği düşüncesindeyiz. Ekseriyet prensibinin mantıksal analizinin yapıldığı bölümde ekseriyetin yeter-sebep ilkesiyle bağlantısı ortaya konmuş, zihinde zan oluşturmasının hükmü gerektirip gerektirmediği gibi konular ontolojik ve epistemolojik açıdan tartışılmıştır. Bu ilkenin araştırmasıyla özelde fürû fıkhın neredeyse tamamında etkin olan bu prensibin metodolojik ve mantıkî sınırlarının tespit edilmesi; genelde ise ekseriyet prensibinin usûl ve fürû fıkıhta öncelenme kriterlerine vurgu yapılması hedeflenmiştir. Çalışmamız neticesinde ulaştığımız ekseriyet prensibinin“ihtiyatla amel etme”ve“zorluğun giderilmesi”ilkeleriyle sıkı bir bağlantı içinde olduğunu vurgulamak isteriz."
