abstract: "Hicri 1322- 1323 (M.1904-1905) tarihli, 159 Numaralı Ayntap Şer'iyye Sicili Toplam 250 varaktan oluşmaktadır. Bu çalışmada son 125 varağın son 60 varagının trankripsiyonu yapılmıştır. Bu tarih 5 Rebiülevvel 1322'de başlayıp 1 Rebiülevvel 1323 tarihinde son bulmaktadır. Bu kısımda toplam 166 dava tespit edilmiştir. Bu davalar; tereke, müderris, imam, vekâlet, vasi tayini, nafaka, alım-satım, gasb, hırsızlık gibi konuları ihtivâ etmektedir. Bu konular da hüküm konuları başlığında okuyucuya tablolar halinde sunulmuştur. Çalışılan Şer'iyye sicilinden haraketle Ayntab'ın sosyal, siyasal, ekonomik hayatı hakkında okuyucuya bilgi sunulmak amaçlanmıştır. Hükümler içinde tespit edilen köy, mahalle, askeri bölükler tespit edilerek Ayntab'ın o dönemki coğrafyasına ışık tutulmuştur.Ayrıca 159 Numaralı Ayntab şer`îyye sicili içerisinde Ermeni isimleri tespit edilmiştir ve bunlar toblolar halinde okuyucuya sunulmuştur. Bunun yanı sıra Ermenilerinde sorunlarını Şer'i Mahkemeler kanalı ile çözdükleri de tespit edilmiştir."
