abstract: "Araştırmamız, İslam Mezhepleri Tarihinde önemli bir yer tutan Câ'ferîlik mezhebinin yayınlarından biri olan Caferiyol Dergisi ve Âşûrâ özel sayıları üzerine odaklanmaktadır. Çalışmada, Câferîlik mezhebinin tarihsel gelişimi, inanç esasları ve Türkiye'deki Câ'ferîlerin durumu ele alınmaktadır. İslam mezhepleri tarihine genel bir bakışla başlanılan çalışmada, Câferîlik mezhebinin tarihsel gelişimi ve temel inanç prensipleri detaylandırılmıştır. Bu inanç esaslarından olan; Tevhid, Adalet, Nübüvvet, İmamet, Mead, Bed'a, Rec'at ve Takiyye gibi temel inanç prensipleri açıklanmıştır. Türkiye'deki Câ'ferîler ve bu mezhebin kullandığı yayınlar analiz edilmiştir. Caferiyol Dergisi'nin kavramsal çerçevesi, tarihçesi ve yazar kadrosu hakkında bilgi verilmiştir. Türkiye'deki Câferîlik mezhebinin tanıtımında, televizyon, yayınevleri ve internet sitelerinin rolü tanıtılmıştır. Ayrıca, derginin Âşûrâ konusunu ele alış biçimi ve bu konudaki makalelerin analizi yapılmıştır. Daha sonra çalışma kapsamında ele alınan konular özetlenmiş ve genel bir değerlendirme yapılmıştır. Bu çalışma, Câferîlik mezhebinin tarihsel ve güncel durumu hakkında kapsamlı bilgiyi Caferiyol Dergisi üzerinden sunmayı amaçlamaktadır. a sonra doldurulacaktır\""
