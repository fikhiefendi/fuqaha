abstract: "Bu çalışmanın amacı, Habermas'ın iletişimsel-rasyonellik ilkeleri açısından Türkiye'deki katılım bankaları ile geleneksel bankaların kendi çalışanlarına ve müşterilerine nasıl yaklaştıklarını ve davrandıklarını kıyaslamaktır. Bu çalışma ile özellikle yönetici kesim tarafından firma ailesini oluşturan çalışanların, müşterilerin ve tedarikçilerin insanî değerlerinin, demokratik haklarının, özgürlüklerinin (negatif-pozitif), onurlarının ve kimliklerinin hangi ölçüde dikkate alındıklarının belirlenmesi amaçlanmıştır. Çalışmada, iletişimsel-rasyonellik bakımından bankaların durumunun tespitine gayret edilmiştir. Veriler, nitel çalışmalarda kullanılan kolay ulaşabilirlik yöntemine göre Rize ilinden elde edilmiştir. Veriler hem banka yöneticileriyle hem de banka müşterileriyle yarı yapılandırılmış görüşme formları ile mülâkatlar yapılarak toplanmıştır. Daha sonra veriler; içerik ve betimsel analiz sürecinden geçirilerek amaçsal ve iletişimsel rasyonellik ana faktörleri altında alt temalar belirlenmiştir. Tüm bu kavramsal analizde Habermas'ın iletişimsel-rasyonellik kuramı temel alınmıştır. Analiz sonucunda, geleneksel bankalar içerisinde, kamu sermayeli bankaların diğer banka türlerine göre iletişimsel-rasyonellik özelliklerine daha yakın olduğu, geleneksel ve katılım bankaları açısından bakıldığında ise kamu bankalarının bu varsayıma daha yakın olduğu anlaşılmıştır. Ayrıca kapitalist sistem içerisinde, müşterilerin araçsal bir meta olmaktan çıkarılıp onların bir amaç hâline getirilebilmesi için tüm bankacılık sektörü tarafından iletişimsel-rasyonel eylemlerin daha çok tercih edilmesi gerektiği sonucuna ulaşılmıştır."
