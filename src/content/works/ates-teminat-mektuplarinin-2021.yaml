abstract: "Finansman ihtiyacı, iktisadî hayatın temel unsurlarından biridir. Modern bankacılıkta bu ihtiyaç yalnızca nakdî kredilerle değil, teminat mektubu, akreditif ve aval/kabul gibi gayrinakdî kredi ürünleriyle de karşılanmaktadır. Bu ürünler içinde teminat mektubu, bankanın müşterisi lehine üçüncü kişiye karşı belirli şartlar altında ödeme taahhüdünde bulunduğu önemli bir finansal araçtır. Teminat mektupları konvansiyonel bankalar yanında katılım bankaları tarafından da kullanılmakta; ancak bu işlemin fıkhî mahiyeti ve karşılığında alınan ücretlerin hükmü İslam hukuku bakımından tartışmalı bir alan oluşturmaktadır. Bu tezde banka teminat mektuplarının hukukî ve fıkhî niteliği İslam hukuku çerçevesinde incelenmektedir. Çalışmada klasik fıkıh literatüründe kefalet akdinin mahiyeti, ücret karşılığında kefalet tartışmaları, modern bankacılıkta teminat mektubunun işleyişi ve çağdaş İslam hukukçularının konuya ilişkin yaklaşımları ele alınmaktadır. Araştırmada teminat mektubunun yalnızca hangi akit türü altında değerlendirileceği değil, bankanın fiilen neyin karşılığında gelir elde ettiği de dikkate alınmaktadır. Bu bağlamda, teminat mektubunda bankanın üstlendiği yükümlülüğün kredi/karz taahhüdü niteliği taşıması sebebiyle alınan komisyonun borç verme taahhüdünden menfaat elde edilmesi sebebiyle faizle benzerlik taşıdığı sonucuna ulaşılmıştır."
