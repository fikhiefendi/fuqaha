abstract: "İnsanlar yaratılışları açısından birbirlerinden farklı mizâç ve karakterlere sahiptirler. Faydayı talep etme ve zararı def etme hususunda benliklerini ön plana almışlardır. Kişilerin attıkları adımlarda ilk önce kendilerini düşünmeleri bazen başkalarının haklarını ihlâl etmelerine sebep olabilmektedir. Bazı durumlarda hakların ihlâli söz konusu olmasa da insanlar haklarını kendi başlarına elde edememektedirler. Söz konusu durumlarda insanların aralarında meydana gelen uyuşmazlığı ortadan kaldıran, hak sahiplerine hakkını teslim eden, hak ihlâlinin önüne geçen davalar kaçınılmaz olmuştur. Devletlerin bir görevi de mahkemeler aracılığı ile yargı gücünü kullanarak insanların aralarında çıkan uyuşmazlıkları dava yoluyla çözüme kavuşturmaktır. İslâm hukuku toplumda düzeni sağlamak ve insanlar arasındaki ihtilafların çözüme kavuşması için dava yoluna başvurmayı meşru görmüştür. Tüm hukuk sistemlerinde olduğu gibi İslam hukukunda da davaların görülmesi için belli şartlar ve usûller belirlenmiştir. Adâletin tecelli etmesi ve hak sahibine hakkının verilmesi açısından bu kurallara uyulması ciddi önem arz etmektedir. Bu çalışma“İslâm Hukukunda Davanın Sıhhat Şartları”başlığını taşımaktadır. Bu çalışma ile İslam hukuk muhâkeme usûlünde davanın sıhhat şartlarının tespiti amaçlanmıştır. Birinci bölümde dava şartlarının sınırlarını belirlemek amacıyla İslam hukukunda muhâkeme hukukun yeri, dava ve ilgili kavramların tanımları, mahiyetleri, ispat vasıtaları incelendi. İkinci bölümde İslâm hukuku muhâkeme usûlünde davanın sıhhat şartları ortaya konmaya çalışıldı. Dava şartı olarak modern hukukta da bulunan maddelerin benzer ve farklı yönleri ortaya konularak, mukayese yapmaya gayret edilmiştir."
