abstract: "Hanbelîlik, Mihne sürecinin sona ermesiyle beraber İslam düşünce tarihinde yerini alan bir mezheptir. Ebû Bekir el-Hallâl, hicrî III/IX. yy.'ın sonuyla IV/X. yy.'ın başlarında yaşamış, Hanbelî mezhebi için önemli bir âlimdir. Merrûzî'nin talebesi olan Ebû Bekir el-Hallâl, mezhebin ilmî temelini oluşturan ve mezhebi sistemleştiren âlimlerden birisidir. Hallâl, mezhebin kurumsallaşması aşamasında yetiştirdiği talebelerin yanı sıra ortaya koyduğu eserlerle, mezhebin itikâdî alt yapısının oluşmasında ciddi bir katkı sağlamıştır. İşte bizim çalışma konumuzu teşkil eden Kitâbu's-Sünne, Hallâl'ın kaleme aldığı eserleri arasında önemli bir yere sahiptir. Eser içerisinde Ehlü'l-Hadis mensuplarının, muhaliflerine karşı sert davranışları dikkat çekmektedir. Eserin muhtevasında, Ehlü'l-Hadis'e muhalifi mezhepler ayrı başlıklarda ele alınmaktadır. Özellikle Mürcie, Mu'tezile, Cehmiyye, Ravâfız, Haricîlik mezhepleri söz konusu eleştirilerin en başta gelen muhatablarıdır. Ayrıca Ca'd b. Dirhem, Cehm b. Safvân, Ebû Hanîfe ve Kerâbîsî gibi mezhepler tarihi sahnesinin bilinen şahsiyetlerinin de yapılan sert eleştirilerden paylarına düşeni aldıkları görülmektedir. Bu çalışmada söz konusu meseleler, İslam mezhepleri tarihinin kendine özgü metoduyla incelenecektir. Hallâl'ın muhalif tavrına değinilecek, ele aldığı mezhepler ve şahıslar hakkındaki görüşleri objektif bir bakış açısıyla ortaya konulacaktır."
