abstract: "Faizsiz finans anlayışı çerçevesinde faaliyet gösteren katılım bankacılığı sistemi, Türkiye'de alternatif bir bankacılık modeli olarak gelişimini sürdürmektedir. İslami finans ilkeleri doğrultusunda çalışan bu bankalar, faiz yerine kâr-zarar ortaklığı, murabaha gibi yöntemlerle fon kullandırmakta, reel ekonomiyle uyumlu, etik temelli bir yaklaşımı benimsemektedir. Bu çalışmanın temel amacı, Türkiye'de faaliyet gösteren katılım bankalarının finansal performanslarını karşılaştırmalı olarak analiz etmek ve aralarındaki performans farklılıklarını ortaya koymaktır. Bu amaç doğrultusunda, çok kriterli karar verme tekniklerinden biri olan TOPSIS yöntemi kullanılarak 2021–2023 yılları arasındaki üç yıllık döneme ait finansal veriler değerlendirilmiştir. Analiz sürecinde, bankaların kamuya açık finansal tablolarından elde edilen temel performans göstergeleri esas alınmıştır. Çalışma bulgularına göre, Kuveyt Türk Katılım Bankası (KT) tüm dönemlerde en yüksek performansa sahip banka olarak öne çıkarken, Vakıf Katılım Bankası (VK) her yıl ikinci sırada yer almıştır. Kuveyt Türk'ün üst üste üç yıl boyunca zirvede kalması, bankanın sürdürülebilir ve dengeli bir performans sergilediğine işaret etmektedir. Elde edilen bulgular doğrultusunda, sektör paydaşlarına yönelik stratejik öneriler sunulmuştur."
