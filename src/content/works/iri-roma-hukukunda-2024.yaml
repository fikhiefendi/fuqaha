abstract: "Zapttan sorumluluk kavramı, Roma hukukundan günümüze ulaşan bir sorumluluk türü olarak karşımıza çıkmaktadır. Satış konusu mal üzerinde üçüncü bir kişinin aynî hak talep etmesine; örneğin, kendisine ait olan bir malı bir rei vindicatio (istihkak davası) ile alıcıdan talep edip almasına zapt (evictio) adı verilmektedir . Türk Hukuku'nda zapttan sorumluluğa denk gelen, Roma hukukunda satıcının evictio nedeniyle sorumluluğu, gelişen hukuk zihniyetinin bir ürünüdür. Iustinianus Dönemi (M.S. 527-565)'nde kodifiye edilen Corpus Iuris Civilis'in bölümlerinden biri olan Digesta'nın 21. Kitabının 2. Faslı ile yine aynı kodifikasyonun diğer bir bölümü olan Codex'in 8. Kitabının 45. ve 46. bölümleri; alıcının, satış sözleşmesi sonucu karşılaşabileceği tehlikeleri ve hukuka aykırılıkları konu edinmektedir . Modern hukuklar da özellikle satış sözleşmesinde, zapttan sorumluluğa yer vermektedirler . Zira alıcı, satıcının kendisine sattığı mala hukukî bir koruma sağlanmasını talep etme yetkisine sahiptir. Üstün hak sahibi kimsenin satılana el koyması gibi durumlarda bu koruma sağlanamamakta ve alıcı bu nedenle elinde hiçbir şeyin kalmaması gibi oldukça ağır sonuçlarla karşılaşabilmektedir. Günümüzde mülkiyetin kazanılmasında iyiniyetin korunması ilkesi geçerli olduğundan, zapttan sorumluluk hükümlerinin uygulaması oldukça sınırlı bir hale gelmiştir. Ancak yine de malikin rızası olmadan elinden çıkan mallar için zamanaşımı süresi geçmemişse, alıcı zapttan sorumluluk hükümleri kapsamında satıcıya başvurabilmektedir. Yine satılan şey üzerinde bulunan ipotek ve intifa gibi sınırlı aynî haklar da alıcının mülkiyet hakkını kullanmasına engel teşkil eden ve satıcıya başvurmasına sebep olan haklardandır."
