abstract: "İslam hukukunda zarûrât-ı hamse olarak adlandırılan din, can, akıl, nesil ve malın korunması temel amaçlardır. Bu maslahatları dünyada koruyan eyleme dönük araçlar ise caydırıcı cezalardır. İslam hukukunda cezalar, faydacı ve geleceğe dönük bir yapı sergiler. Bütün ceza türlerinde birincil amaç caydırıcılıktır. Bununla birlikte caydırıcılık yalnızca hukuki normlara dayanmaz. Kökleşmiş ahlaki normlar ve vahiy kaynaklı hükümlerin sağladığı güçlü bir içsel denetimle desteklenir. Dolayısıyla İslam ceza hukukunda caydırıcılık, ceza tehdidinin yanı sıra dinî ve ahlaki bilinç ile şekillenir. Had ve kısas cezaları, caydırıcılığın kesinlik, hızlılık ve şiddet unsurlarının tamamını bünyesinde barındırır. Ta'zîr cezaları ise hâkimin takdir yetkisinde olduğu için kesinlik ilkesine yeterince uyum sağlamaz ve had cezasının miktarını geçmesi caiz görülmediği için sınırlı bir caydırıcı etkiye sahiptir. Had ve kısas cezalarında genel caydırıcılık işlevi, ta'zir cezalarında ise özel caydırıcılık işlevi ön plana çıkmaktadır. İslam hukukçuları, ceza hukuku konularının neredeyse tamamında caydırıcılığın hangi koşullar altında etkili olabileceğini, kapsam ve sınırlarını tartışmışlardır."
