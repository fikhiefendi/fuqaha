abstract: "Emevi halifelerinin sekizincisi olan Ömer b. Abdülaziz, 99-101 (717-720) yılları arasında hilafette kaldı. İdârî, sosyal ve mâlî alandaki hususlarda, Hz. Peygamber ve Hulefâ-yı Râşidîn'in uygulamaları doğrultusunda hareket etti. Gayrimüslimlerden alınan cizye ve harâc vergilerini düzenledi. İhtida eden mevâlîden cizye alınmasına son vermesiyle çok sayıda zimmi Müslüman oldu. Mülk olmayan harâc topraklarının satışını yasaklaması, bu arazilerin, özel mülk alanı olmak suretiyle vergiden muaf araziler haline gelmesinin önüne geçti. Müslümanlardan toplanan zekâtın toplandığı yerde sarf edilmesiyle, refah seviyesi yükseldi. Bütün Müslümanlara devamlı ve düzenli maaş tahsis etti. Dağıtımdan sonra kalan miktar, maddi yetersizlik sebebiyle evlenemeyenlerin evlendirilmesi ve borçların ödenmesi için harcandı."
