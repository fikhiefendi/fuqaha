abstract: "Bu çalışma Mâlikîlerin nikahta şahitlik ve ilân konusuna bakışını, delillerini ve bu hususta cumhurdan ayrılan görüşlerini tespit etmeyi amaçlamaktadır. Çalışma üç bölümden oluşmaktadır. Öncelikle giriş bölümünde genel hatlarıyla İslam hukukunda şahitlik konusu üzerinde durulmuştur. Mâlikîlerin görüşüyle karşılaştırmak maksadıyla birinci bölümde cumhurun nikahta şahitlik ve ilân hususundaki görüşleri incelenmiştir. Bu bağlamda cumhur alimlerinin nikah şahitliğine yaklaşımı tahlil edilmiştir. İkinci bölüm Mâlikî kaynaklarında nikahın ilânı konusuna ayrılmış, Mâlikî fakihlerin bu husustaki görüşü ve cumhura karşı itirazları kendi kaynaklarından hareketle kronolojik olarak incelenmiştir. Son bölümde Mâlikî kaynaklarında nikah şahitliği ve nikahu's-sir (gizli nikah) hususu derinlemesine tahlil edilmiş, bu konuda cumhurla olan ihtilafları ele alınmıştır."
