abstract: "İslam medeniyeti, yapısını İslam hukukundan türetilmiş bir metodolojiye dayandırdı; bu metodoloji daha önce teorize edilmemişti. Bu nedenle, çalışma bu metodolojiyi teorize etmeyi amaçladı ve İslam dünyasında ekonomik bağımlılık sorununu ele aldı. Araştırma, bu bağımlılığın ana nedeninin bu metodolojinin uygulanmasının ihmal edilmesi olduğunu sonuçlandırdı. Bu özgün yaklaşım, insan gelişimiyle birlikte arazi gelişimine odaklanırken, optimal bir üretken ortam sağlayan benzersiz ve çeşitli araçlara sahipti. Birleşik İslam devletinin birkaç ülkeye bölünmesinden sonra egemen devletler, kaynakları işgal etmeyi, kontrol etmeyi ve sömürmeyi kolaylaştırmak için bu metodolojinin uygulanmasını kasti olarak engelledi. Bu durum, gelişmeyi engelleyen birçok olumsuz etkiye neden oldu. Çalışma, İslam kentsel metodolojisinin, her koşulda uygulanabilir olan fıkhi esneklik özelliği sayesinde geri dönüşünün mümkün olduğu sonucuna vardı. Bu bağlamda, çağdaş dönemin koşullarını ve hızlı değişimlerini dikkate alan bir öneri geliştirildi ve bu amaçla çaba harcandı. Ayrıca, bağımlılık sorununa çözümler sunularak, çağdaş medeniyetin seviyesine ulaşma hedefiyle uyumlu ve gelişmenin temeli olan ekonomik bağımsızlığın yeniden tesisini sağlayacak çözümler geliştirildi. Araştırma, ekonomik bağımlılık boyutlarını belirlemek için tümevarımcı, tümdengelimci ve analitik bir yaklaşım izlerken, önerilen modellerin ve çözümlerin, İslam dünyasındaki mevcut kaynaklar çerçevesinde uygulanmasının ekonomik etkilerini öngörmek için kestirimci bir yöntem kullandı."
