abstract: "Hadis ilminin temel gayesi olan rivayetlerin Rasûlullah'a aidiyetinin tespiti, hem dinî hükümlerin sıhhatine hem de ilim mirasının güvenilir biçimde aktarılmasına doğrudan etki etmektedir. Bu çalışma, İmam Gazzâlî'nin tasavvuf alanında kaleme aldığı Eyyühe'l-veled isimli eseri kapsamında ele alınmıştır. Risalede yer alan hadislerin kapsamlı bir şekilde tahrîcini yapmak, mezkûr hadisleri sened ve mânâ açısından incelemek bu çalışmanın amaçları arasındadır. Araştırmanın ortaya koyduğu tespitlerin, hem hadis ilmine hem tasavvufî literatüre katkı sunması hedeflenmektedir. Söz konusu risalede kullanılan merfu', mevkûf ve maktu' rivayetler incelenmiş, bu rivayetlerin temel hadis kaynaklarındaki yerleri belirlenmiş ve sened–metin yönünden değerlendirilmiştir. Ayrıca İmam Gazzâlî'nin hadis naklindeki metodunu, başvurduğu rivayet kaynaklarını ve eser içinde yer alan rivayetlerin ilmî değerini ortaya koyma gayreti de gösterilmiştir. Çalışma sırasında hadis, tasavvuf, ricâl ve tabakât literatüründen, yazma ve matbu nüshalardan, modern akademik araştırmalardan imkan dahilinde yararlanılmıştır. Bu yararlanma; incelemesi yapılan hadisin sıhhati ve muhtevası açısından, hadis ve rical kitaplarından istifade etmek suretiyle olurken, metnin lafzî farklılıklarının giderilmesi hususunda da yazma ve farklı baskı nüshaların marifetiyle gerçekleşmiştir. Araştırmanın sonunda, risalede kayda alınan 27 adet rivayetin 19'unun merfu', 2'sinin mevkûf ve 6 sının da maktu' olarak kaydedildiği tespit edilmiştir. Bu rivayetlerden merfu' olanların 13'ünün makbul, 6 adedinin zayıf ya da mevzu' olduğu, mevkûf ve maktu' rivayetlerinse genelde senedsiz olarak nakledildiği sonucuna varılmıştır."
