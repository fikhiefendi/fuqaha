abstract: "Fetvâ, soru soranın halinin ve çevre şartlarının göz önüne alınarak hükmün sözlü veye yazılı olarak soru üzerine açıklanmasıdır. Hz. Peygamber dinî bir hükmü açıklamayı gerektiren bir soru ile karşılaştığında ya vahiy gelmesini bekler veya bizzat kendisi cevaplandırırdı. Ashâbın fakih olanları da kendilerine sorulan herhangi bir konuda ilk olarak Kur'an ve sünnette yer alan hüküm ile cevap verirdi. Bu iki kaynakta açıkça bir hüküm yok ise, Hz. Peygamber'den öğrendikleri prensiplere göre hüküm verirlerdi. Yani şâri'in maksadına uygun şekilde kendi içtihad ve re'yleri ile cevap verirlerdi.İlk iki halife döneminde sahabeler, Mekke ve Medîne dışına zaruret olmadıkça çıkmamışlar; fethedilen yerlere gitmemişlerdi. Hz. Osman döneminde sahabeler değişik şehirlere dağılmış ve gittikleri yerlerde insanların problemlerine çözüm aramışlardır.Sahâbeyi takip eden tâbiîn nesli içinde yetişen bilginler, Ehl-i hadis ve Ehl-i re'y diye ikiye ayrılmışlardı. Ehl-i re'y'e mensup olanlar, problemleri Kur'an ve sünnet'i esas alarak çözüme kavuştururlardı. Ehl-i hadis ise, zaruret olmadıkça reye dayanarak görüş bildirmezlerdi. Fetvâ verme işi, resmî bir nitelik taşımadığı için fetvâ verme yetkisine sahip olan uzmanlar, fetvâ verirlerdi.İlk dönemlerden itibaren ihtiyaç duyulan fetvâ verme görevi, İslâm kültür ve medeniyetine paralel olarak kurumsallaşmıştır. Zamanla fetvâ makamında görev alanların taşımaları gerektiği şart ve vasıflar belirlenmiştir. Bunun yanında, vatandaşların dîni problemlerini çözüme kavuşturmak amacıyla kaynak kitaplar da kaleme alınmıştır."
