abstract: "كثيراً ما يتم الجدال حول شرعية المعاملات البنكية الإسلامية والتشكيك بفاعلية نظام الهيئات الشرعية, لذلك تهدف هذه الدراسة إلى التعرف على نظام الهيئات الشرعية وأنواعها، وصلاحيتها، وتقييم تطبيقاتها في الواقع والمعوقات التي تواجهها. كما تتطرق الدراسة إلى استعراض نماذج الهيئات الشرعية المطبقة لبعض البلدان العربية والإسلامية. وقد أوضحت الدراسة أهمية تقنين الفتاوى الشرعية في البنوك الإسلامية، لكي تحد من الآثار السلبية لاختلاف الفتوى بين الهيئات الشرعية من مؤسسة مالية إلى أخرى, وأوضحت أهمية الاستقلالية التي يجب أن تتوفر للهيئات الشرعية، وإلزامية فتواها الصادرة. الكلمات المفتاحية الهيئات الشرعية، البنوك الإسلامية، البنوك التشاركية، الاقتصاد الإسلامي."
