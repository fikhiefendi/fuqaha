abstract: "Aile hukuku, dinlerin hayatı düzenleme anlayışının en belirgin tezahür ettiği alanlardan biridir. Özellikle evliliğin sonlandırılmasına ilişkin hükümler, ailenin korunması ile bireylerin hak ve sorumluluklarının dengelenmesi bakımından büyük önem arz etmektedir. Bu bağlamda boşanma, semavî hukuk sistemlerinde belirli ilke ve sınırlamalar çerçevesinde meşru görülen bir çare olarak öne çıkmaktadır. Çalışma, Yahudi ve İslâm hukukunun boşanmaya ilişkin hükümlerini mukayeseli ele almayı amaçlamaktadır. Araştırmada iki dinde boşanmanın meşruiyet temelleri, boşama yetkisinin dağılımı, boşanmanın gerçekleşme biçimi, kullanılan lafız ve belgeler, tarafların rızası, boşanma türleri, sebepleri ve hukukî sonuçları incelenmiştir. Tevrat ve Talmud hükümleri ile Kur'an, sünnet ve fıkhî mezheplerin yaklaşımları karşılaştırmalı olarak değerlendirilmiştir. Çalışmada Yahudi hukukunun kazuistik ve ritüelistik bir yapıya sahip olduğu, İslâm hukukunun ise bütüncül bir teşrî' anlayışı ortaya koyduğu tespit edilmiştir. Yahudi hukukunda boşanmanın geçerliliğinin karşılıklı rızaya ve ritüel niteliği taşıyan get belgesinin usulüne uygun şekilde kadına teslimine bağlı olduğu, İslâm hukukunda ise boşama yetkisinin temelde kocaya tanınmakla birlikte kazâî tefrik kapsamında hâkimin, belirli durumlarda kocanın rızasını aramaksızın evliliği sonlandırma yetkisine sahip olduğu ortaya konulmuştur. Sonuç olarak iki hukuk sisteminin neslin korunması, çocuğun yararının gözetilmesi, zayıf tarafın muhafazası ve tarafların onurunun teminat altına alınması gibi temel maksatlarda birleştiği, ancak bu hedeflere ulaşmada başvurdukları hukukî araç ve mekanizmalarda farklılaştığı sonucuna ulaşılmıştır. Bu yönüyle çalışma, iki hukuk sisteminin boşanma konusundaki benzerlik ve farklılıklarını bütüncül bir perspektifle ortaya koymayı, aile kurumunun korunması ve bireysel hakların gözetilmesi noktasında hukukî denge anlayışının nasıl tesis edildiğini göstermeyi hedeflemektedir. Araştırmanın, mukayeseli yaklaşımı sayesinde hem İslâm hukuku hem de karşılaştırmalı dinler ve hukuk alanlarında akademik literatüre katkı sağlayacağı düşünülmektedir."
