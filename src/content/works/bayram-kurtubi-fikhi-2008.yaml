abstract: "Ebû Abdillâh Muhammed b. Ahmed el-Kurtubî, Endülüs'ün Kurtuba şehrinde doğmuştur.Doğu İslâm dünyasının Moğol, Endülüs'ün ise haçlı istilâsı sonucu kesin olarak elden çıktığı ve İslâm dünyasının sürekli haçlı seferlerine maruz kaldığı VII./XIII. Asırda Mısır, hem doğudan ve hem de batıdan, ülkelerini terketmek zorunda kalan pek çok âlimin sığındığı yer olmuş ve Kahire ve Dımaşk, İslâm dünyasının en önemli iki ilim merkezi haline gelmiştir. Kurtuba'nın işgalinden sonra Mısır'ın güneyinde yer alan el-Minye'ye yerleşen Kurtubî, burada daha çok kitap telifiyle meşgul olmuştur. Müfessirin, el-Câmi li-âhkâmi'l-Kur'ân adlı fıkhî tefsirini de Mısır'dayken ve kuvvetle muhtemel olarak el-Minye'nin sâde ortamında telif ettiğini söylemek mümkündür. Kurtubî, en önemli eseri olan bu ahkâm tefsirinin yanında, İslâmî ilimlerin çeşitli sahalarında ilmî kıymete haiz birçok eser daha kaleme almıştır. Ahlâki erdemlere çok önem veren ve dünyaya karşı zühd sahibi olan Kurtubî, fıkıh, lugat ve kıraat alanlarındaki birikimini ansiklopedik özellikteki fıkhî tefsirinde ortaya koymuştur. O, Mâlikî mezhebine mensup olmakla birlikte objektif bir ilim adamı tutum ve davranışı sergileyerek mezhep taassubundan uzak kalmıştır. Tefsirinde hukuk normlarını belirlerken İslâm hukukunun kolaylık prensibini göz önünde bulundurmuş ve hadise ve me'sûr tefsire öncelik vermiştir. Aynı zamanda müfessir Ehl-i sünnet dışındaki ekol ve inkârcıların görüşlerini tenkit etmiş ve yaşadığı çağın ictimâî ve sosyal olaylarını değerlendirmiştir.Kurtubî, genellikle hadislerden âyetlerin tefsiri ve konuların izah edilmesi amacıyla yararlanmaktadır; hadisler esas mesele incelenirken istifade edilen örnek ve şâhitler olarak öne çıkmaktadır. Genellikle sahih hadisleri kullanan müfessir, az da olsa zaman zaman zayıf ve mevzu olanlara da yer vermektedir.Hem Doğu hem de Batı medeniyetinde yetişen Kurtubî'nin, ilim tahsiline Endülüs'te başlayıp sonra da tefsirini Mısır'da telif etmesi hususunun günümüz açısından önem arzettiği ve bu yönden araştırılması gerektiği kanaatindeyiz. Çünkü müfessirin yaşadığı zaman dilimi Doğu ve Batı değerlerinin birbirleriyle yakından tanışıp yüzleştiği bir çağ olup onun eseri de böyle bir asrın çok önemli bir tanığıdır. Kurtubî bu eserinde, şeriatın umûmi maksad ve gâyelerini ve ictimâî değişimleri maslahat ekseninde değerlendirerek İslâm hukukundaki ahkâmın değişmesi prensibini fonksiyonel hale getirmiştir. Küreselleşen dünyamızın hemen her alanında baş döndürücü bir değişim söz konusudur. İslâm hukukunun süreklilik ve değişime açık olma özelliği açısından Kurtubî Tefsîri, çağımıza yeni bir yaklaşım getirerek günümüz İslâm hukuk felsefesine ışık tutacak ilmî birikim ve veriye haizdir.Kurtubî, 9 Şevvâl 671/29 Nisan 1273 tarihinde el-Minye'de vefat etti ve buraya defnedildi.Anahtar Sözcükler1.el-Câmi li-Âhkâmi'l-Kur'ân ve'l-Mübeyyinü limâ Tadammenehû mine's-Sünneti veÂyi'l-Furkân2.Ebû Abdillâh Muhammed b. Ahmed el-Kurtubî3.Tefsir ve Tefsir Usûlü4.Hadis ve Hadis Usûlü5.Fıkıh ve Fıkıh Usûlü6.Endülüs ve Kurtuba"
