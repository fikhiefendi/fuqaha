abstract: "Bu Araştırma, İslâm hukukunun dikkat ettiği en önemli konulardan biri olan kadının reşit olmayan çocukları üzerindeki velayetini Makâsıdu'ş-Şerîa'da karşılaştırmalı metod ile ele almıştır. İslâm toplumunun temel meselelerinden biri olan reşit olmayan çocuklar konusunu ehemmiyet arz etmektedir. Makâsıdu'ş-Şerîa'da reşit olmayan çocukların İslam'a göre gelişmesine, dininin rahatça yaşamasına, eğitimine, mallarının korunmasına önem verilen konular arasında yer almıştır. Bu araştırmada, iki sorun ele alınmıştır. Birincisi, İslâm fıkhının, bu konuyu çözme konusunda yetersiz olduğuna dair ortaya atılan şüpheleri çürütmek; ikincisi ise Libya medenî kanununun, velâyet hakkı konusundaki hakkaniyet sorununu çözme konusunda iddia edildiği gibi bu sorunu çözmede İslam fıkhını aşamadığını açıklamaktır. Çoğu medeni kanunu metni, aslen İslam fıkhının hükümlerinden alınmış ve sadece batılı toplumlara uygun hale getirilmiştir, bu da İslam toplumlarından ve özgünlüklerinden oldukça farklıdır. Fıkhî yönüne dönersek, Anne ve baba bir arada bulunduğu müddetçe çocuğun velâyeti konusunda herhangi bir ihtilaf söz konusu olmamaktadır. Esas sorun anne ve baba arasında boşanma olduğunda veya babanın vefat etmesinden sonra ortaya çıkmaktadır. Çocuğun velâyeti kimde olmalıdır, ayrılık durumunda hangi ebeveyn daha yetkili olmalıdır? Birinci duruma göre reşit olmayan çocuğun yaşına bakılır. Fıkıh âlimlerinin ittifakına göre küçük çocukların bakımının velayeti anneye verilir. İkinci durum reşit olmayan çocukların ergenliğe kadar devam eden süreçte velayetinin sorunudur. Bu araştırmada babanın vefatından sonra veya boşanma sonucunda çocuğun velayetinin kime verileceği hususu tümevarımsal, analitik ve mukayese yöntemleriyle fukahânın görüşleri ile Libya medeni kanuna mukayese edilerek araştırılmıştır. Araştırmanın konusuna bağlı olan şeri metinler tümevarımsal yöntemle incelenmiştir. Daha sonra annenin velayeti ile alakalı meselelerin hükümlerini çıkartmak için analitik yöntem izlenmiştir. En son kısımda ise İslam fıkhının görüşleri ile Libya medeni kanuna mukayese edilerek annenin velayeti meselesi araştırılmıştır. Araştırmanın sonucunda Libya medenî kanunu ile İslâm fıkhının reşit olmayan çocukların velayeti hususunda birçok maddede ittifak halindedir. Libya medenî kanunu ehliyet şartları bulunduğu müddetçe kadının velayeti erkeğe eşit olduğunu göstermektedir. Ehliyetin bulunmaması durumunda çocuğun velâyetine kadın daha layıktır. Bununla birlikte, velâyet altındaki annenin ücrete hak kazanamaması gibi nassın olmadığı durumlarda fıkıh âlimlerinin aksine Libya hukukunun içtihatlara atıfta bulunduğu bazı konularda fikir ayrılığına düşmüşlerdir. Annenin reşit olmayan çocuklarının parası üzerindeki velayeti konusunda da Libya hukuku, bir maddeyi onaylayıp diğer maddeyi İslam âlimlerinin aksine reddettiği gibi diğer sonuçlar da vardır."
