abstract: "Çalışmanın amacı ATM'lerin maliyetlerini analiz ederek ATM'lerin ve bankacılığının geleceğini incelemektir. Çalışmada ATM'lerin ödeme sistemleri içerisindeki yeri ve önemine değinilerek ATM'lerin tarihsel gelişimi açıklanmıştır. ATM maliyetleri, Türkiye'deki ATM sahibi bankaların işleyişi, ATM pazarındaki konumları ve gelişimleri analiz edilmiştir. Nitel Araştırma Yöntemi kullanılan bu çalışmada; ATM endüstrisindeki gelişmeler ile ATM endüstrisinin önündeki engeller ortaya konularak Dünya'da ve Türkiye'de bankacılık sektörünün ve ATM'lerin geleceği ile ilgili öngörüler tartışılmıştır. Ayrıca, Türkiye'de ATM'lerin sahipliğinin değişmesi tartışılmış ve çözüm önerileri sunulmuştur."
