abstract: "XXVII numaralı Antalya Şer'iyye Sicili defterinden yararlanılarak 1883-1886 yıllarıarası Antalya'nın idarî, sosyal, ekonomik ve kültürel yapısı ortaya konulmaya çalışılmıştır.600 yıl boyunca üç kıtada hüküm sürmüş bir dünya devleti olan Osmanlı Devleti'ninsiyasi zaferlerinin ardında yatan temel dinamikleri ve tebaasının yaşam tarzlarının bir kesitiXXVII numaralı Antalya Şer'iyye Sicili defterinde yer alan bilgiler ışığında ortaya konulmayaçalışırken Antalya şehir tarihçiliğinin de bir dönemine ışık tutulmaya gayret edilmiştir.1839 Tanzimat Fermanı, 1856 Islahat Fermanı, 1876 Meşrutiyet'in ilanı ile idari,sosyal, ekonomik ve kültürel alanlarda kurumlarıyla birlikte büyük değişimlere uğrayanOsmanlı Devleti, bir yandan içine düştüğü sıkıntılardan kurtulmaya çalışırken diğer yandan daAvrupalı Devletlerin desteğini almak, ayakta kalmayı sürdürebilmek için, Avrupa devletlerineve tebaasından olan gayrimüslimlere birçok tavizler vermek, kurum ve kuruluşlarını yenidentanzim etmek zorunda kalmıştır. Ele aldığımız XXVII numaralı Antalya Şer'iyye Sicilidefterinde yer alan 1883-1886 yılları dönemindeki Antalya, XIX. yüzyıldaki bu köklüdeğişimlerin yansıdığı bir şehir olmuştur.Yaşanan tüm değişikliklere rağmen, sağlam ve köklü bir geçmişe sahip olan OsmanlıDevlet kurumları incelediğimiz dönemde, yeni kurumların yanında varlığını ve etkisinisürdürürken, İslam hukuku ve Türk örf ve gelenekleriyle yoğrulmuş olan halkın toplumsal,kültürel ve ekonomik yaşantısı da herhangi bir köklü değişime uğramadan varlığını devamettirebilmiştir."
