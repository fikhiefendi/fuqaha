abstract: "Bu tez, Türk hukuku ve İslam hukukundaki hükümler ışığında katılım bankalarında (İslami banka) uygulanan cezai şartın hukuki ve fıkhi mahiyetini incelemeyi, cezai şartın bu iki hukuk sistemine göre tarafları ilgilendiren sonuçlarının neler olduğunu tespit etmeyi ve katılım bankalarında uygulanan şekliyle cezai şartın fıkhi hükümlere uygun olup olmadığını sorgulamayı amaçlamaktadır. Araştırmacı çalışma kapsamında betimleyici analitik yöntem ve karşılaştırmalı yöntem kullanmıştır. Betimleyici yöntemde bir şey olduğu gibi betimlenir, araştırmacı bir konuya ilişkin açıklamaları alıntılar ve başkalarının görüşlerini nakleder. Karşılaştırmalı yöntem ise iki şeyin mukayese edilmesi veya aralarında belirli yönlerden denge kurulması, bunun yanında benzer ve farklı yönlerinin belirtilmesi şeklinde gerçekleşir. Cezai şart, Türk hukukunda borçlunun asıl taahhüdünü gerektiği şekilde yerine getirmemesi nedeniyle alacaklının uğradığı zararın tazmin edilmesi yönünde öne sürülen bir tür koşuldur. İslam hukuku eserlerinde de bu tanıma benzer şekilde, akdin taraflarına ait olan ve borçlunun borcunu yerine getirmemesi veya ifasında gecikmesi halinde, alacaklının borçludan alacağı tazminatı belirleyen koşul şeklinde açıklanır. Araştırmanın ulaştığı en önemli sonuçlar şu şekilde ifade edilebilir: Cezai şart tarafların anlaşmalarıyla sözleşmeye eklenen takyidi bir şarttır. İhtiva ettiği asli edim yükümlülüğü mahiyeti itibariyle verme borcu özelliği taşımayan sözleşmelerde borcunu gerektiği şekilde ifa etmeyen borçlunun mali bir ceza ödemesi yönünde cezai şartlar öne sürülebilir. Asli edim yükümlülüğü verme edimi şeklinde gerçekleşen sözleşmelerde ise borcunu gerektiği şekilde ifa etmeyen tarafın ilave bir maktu veya oransal ödeme yapmasını öngören cezai şartların öne sürülmesinin caiz olmadığı konusunda İslam hukukçuları hemfikirdir. Bu konuda ifayı geciktiren borçlunun ödeme gücüne sahip olması ve olmaması arasında bir ayrım da gözetilmemiştir. Cezai şart, iki taraf arasındaki bir anlaşmaya istinaden belirlenen bir tazminat takdiridir. Bu takdire konu olan tutar, alacaklının uğrayabileceği zarara karşılık taraflarca önceden kararlaştırılan herhangi bir miktardır. Dolayısıyla kanunun gerekli gördüğü tazmine alternatif olmanın ötesine geçmeyen bir tür sorumluluk sözleşmesidir."
