abstract: "Krizlerin artışı ve ekonomik olumsuz etkilerinin belirginleşmesi, bu olumsuz etkilerin temel nedeni olan geleneksel finansal sistemlere alternatif ve çözüm arayışlarının önünü açmıştır. Bu tür dalgalanmalar geleneksel finansal sistemin bir ürünü olduğundan, İslami finans sisteminin krizi yavaşlatmak, etkisini azaltmak ve ekonomik dengeyi sağlamak için uygun bir alternatif olduğu kanıtlanmıştır. 2008 krizi dünya genelinde birçok ekonomiyi ciddi şekilde etkilemiş; finansal piyasaları, bankaları ve işletmeleri derinden sarsmıştır. Kriz sırasında İslami finans kurumlarının bazı geleneksel finans kurumlarından daha iyi performans gösterdiği ve bu durumun yatırımlar ve genel olarak ekonomi üzerinde büyük bir etki bıraktığı görülmüştür. Bu finansal krizin ardından İslami finansal hizmetlere olan talep artmış, yeni ve daha verimli finansal araçların geliştirilmesi ve yenilenmesi gerekliliği ortaya çıkmıştır. Bu geliştirme ve yenilik süreçleri, İslami finans mühendisliğinin bir parçası olarak kabul edilmektedir. Bu çalışma, İslami finansta finansal krizlerin önlenmesi ve etkilerinin azaltılması için alınabilecek önleyici tedbirleri belirlemeyi amaçlamaktadır. İslami finansla hem mortgage kriziyle hem de COVID-19 sağlık kriziyle başa çıkılabileceği değerlendirilmektedir. Çalışmada geleneksel finans mühendisliği ile İslami finans mühendisliği arasında, finansal kriz ve sağlık krizine ilişkin kavramsal bir çerçeve önerilmektedir. Krizlerin nedenlerini ve bu etkileri yönetme süreçlerini analitik yaklaşımlarla açıklayarak, İslami finansın ekonomiyi etkileyen sorunlara çözüm üretmedeki rolü ortaya konulmaktadır. Çalışma, İslami finansın, İslami şeriat ilkelerine dayanan ürün çeşitliliği sayesinde küresel ekonominin dengesini tehdit eden krizlerin etkilerini azaltabileceği sonucuna varmaktadır."
