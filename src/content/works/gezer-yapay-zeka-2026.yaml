abstract: "Yapay zekâ (YZ) teknolojilerinin veri toplama, otomatik karar alma ve üretken YZ mekanizmaları, birey ile teknoloji şirketleri ve devlet kurumları arasında sert bir güç dengesizliği yaratmakta ve bireyin mahremiyetini ciddi biçimde tehdit etmektedir.Bu çalışma; algoritmik sistemlerin doğasında barındırdığı kitlesel gözetim, davranışsal profil çıkarma, insan denetimini dışlayan otonomi, sistematik önyargı, şeffaflıktan uzak“kara kutu”opaklığı ve karanlık desenler aracılığıyla yürütülen bilişsel manipülasyon tehditlerini temel problematik olarak kurgulamaktadır. Çalışmanın ana amacı, mevcut yasal düzenlemelerin bu çok katmanlı tehditler karşısındaki etkinliğini ve yeterliliğini sorgulamaktır. Bu bağlamda, Avrupa İnsan Hakları Sözleşmesi'nin (AİHS) 8. maddesinde düzenlenen özel hayata saygı hakkının yeni teknolojik gerçekliğe uyarlanma kapasitesi incelenmekte ve Avrupa İnsan Hakları Mahkemesi'nin (AİHM)“yaşayan belge”ilkesine dayanan dinamik yorum metodu analitik bir yaklaşımla değerlendirilmektedir. Yargısal denetimin hız ve etkinlik açısından yetersiz kaldığı noktalarda, Avrupa veri koruma otoritelerinin (özellikle EDPB ve İtalyan Veri Koruma Otoritesi Garante) algoritmik ihlallere karşı geliştirdiği proaktif ve tavizsiz refleksleri, yeni normların inşasında yol gösterici referans noktaları olarak ele alınmaktadır.Bu yaklaşım, bireylerin mahremiyetini korumada yalnızca normatif düzenlemelerin değil, aynı zamanda idari otoritelerin hızlı ve kararlı müdahalelerinin de belirleyici olduğunu ortaya koymaktadır. Tezin hukuki odak noktası, Avrupa Birliği Yapay Zekâ Yasası ve Avrupa insan hakları ile veri koruma rejimi merkezli olmakla birlikte, karşılaştırmalı bir metodolojiyle küresel perspektife genişletilmektedir. Amerika Birleşik Devletleri'nin piyasa odaklı ve sektörel esnekliği, Çin'in devlet merkezli algoritmik otoriterliği, OECD'nin yumuşak hukuk standartları, Güney Kore'nin inovasyon odaklı hibrit regülasyon modeli ile Türkiye'nin KVKK ve Ulusal YZ Stratejisi eksenindeki statükosu incelenerek farklı ekollerin güçlü ve zayıf yönleri karşılaştırmalı biçimde analiz edilmektedir. Bu bütüncül değerlendirme, otonom algoritmaların insan onurunu araçsallaştırmasına karşı, 'insan merkezli' ve 'tasarımdan itibaren hak temelli' bir İnsan Merkezli Hukuk Devleti prensibinin inşa edilmesi gerektiğini savunmaktadır."
