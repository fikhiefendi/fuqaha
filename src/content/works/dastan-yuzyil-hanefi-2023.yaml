abstract: "Tez başlığında adı geçen Muhammed Emîn b. Ömer İbn Âbidîn (ö. 1836), Osmanlı Devleti'ne bağlı eyaletlerden biri olan Şâm'da yaşamış bir Hanefî fakihidir. Yetkin bir fakih olarak onun mezhep mesailini bir süzgeçten geçirerek kendi döneminin ve yaşadığı coğrafyanın şartları bağlamında bazı yeni yaklaşımlara ve fıkhî tercihlere sahip olduğu görülmektedir. Ne var ki İbn Âbidîn hakkında hazırlanan mevcut çalışmalar, büyük oranda onun fetva usûlü ve örf hakkındaki iki meşhur risalesini konu edinmekle sınırlı kalmıştır. Eser yazımında değişik türlere dahil olan haşiye, fetva ve risale türündeki geniş hacimli fıkıh külliyatının ise henüz detaylı bir şekilde, farklı boyutlarıyla ele alındığını söylemek güçtür. Buna binaen hazırlanan bu çalışma da bahsi geçen risaleleri özet bir şekilde konu edinmektedir. Ayrıca ilgili risaleleri, ana cümleleri ve iddiaları açısından onun fürû-i fıkıh alanındaki yaklaşımlarıyla mukayeseli bir biçimde değerlendirmeye tabi tutmaktadır. Bu amaçla vakıf hukuku ile alakalı meseleler bir anlamda teori-pratik mukayesesi için örnek alan olarak belirlenmiştir. Yapılan incelemeler neticesinde İbn Âbidîn'in, hukukta bir kaynak olarak örfü ana merkeze yerleştirmekten ziyade fürû-i fıkıhta daha dengeli ve sınırlı bir alan tanıdığı ileri sürülmüştür. Ek olarak vakıfta bağlayıcılık için tescil uygulaması, paranın vakfı, beşik ulemalığı, arazinin öşrünün kimden alınacağı ve yazılı belgenin delil olma değeri gibi daha birçok meselede yeni birtakım değerlendirmelere ve farklı tercihlere sahip olduğu tespit edilmiştir."
