abstract: "Faize konu mallar meselesi fıkıhta önemle üzerinde durulan konulardan birisi olmuş ve bu konuda çok farklı görüşler ileri sürülmüştür. Konu fıkıh kaynaklarında genelde hem“Kitabu'l-büyû'”hem de“Kitabu'l-büyû'”bölümünde“Bâbü'r-riba”başlığı altında“altı mal hadisi”diye bilinen meşhur rivâyet çerçevesinde ele alınmıştır. Bu durum faize konu olan malların ne tür mallar olması gerektiği sorusunu gündeme getirmiştir. Dolayısıyla konuya tüm ayrıntılarıyla temas edilmesi ve meseleye açıklık getirilmesi son derece önemlidir. Bu problemin çözümü amacıyla faize konu mallar meselesine işaret eden ilgili naslar ve konunun fıkıhtaki yeri tespit edilerek Kur'an ve Sünnet çerçevesinde meseleye açıklık getirilmesi tezin temel hedefini oluşturmaktadır. Bu çalışmada, öncelikle konuya ilişkin temel kavramlar üzerinde durulmuş, daha sonra ilgili naslar ışığında meselenin Kur'an ve Sünnet'teki yeri incelenmiş ve en sonunda meseleye dair hem klasik mezhep fukahası dışındaki alimlerin hem de klasik mezhep fukahasının görüşlerine yer verilmiştir. Faize konu malların kapsamı kimi zaman geniş tutulurken kimi zaman dar tutulmuştur. Yapılan değerlendirmeler sonucunda, faizin standardize edilebilen bütün mallar üzerinde söz konusu olabileceği kanaatine varılmıştır."
