abstract: "Osmanlı idare yapısının en önemli adli memuru olan kadılar, tuttukları siciller vasıtasıyla devletin hukukî, toplumsal, kültürel ve ekonomik yapısı hakkında önemli bilgiler vermektedir. Bu kaynaklara Şer'iyye sicili denmektedir. Bunlar kadar büyük önem arz eden diğer bir kaynak ise Sakk mecmuaları'dır. Kadıların baktıkları davalarda verdiği hükümlerin yazıya nasıl geçirileceğini ve yönteminin ne olacağını gösteren bu belgeler şer'iyye sicillerinin bulunmadığı bölgelerde onların boşluğunu doldurmaktadır. Bu mecmualar haiz oldukları değer bakımından kendilerine has bir tarzda yazılmıştır. Bu işlemi tecrübeli kadı ve naipler tarafından yapılmaktaydı. Şer'iyye sicillerinden titizlikle seçilmiş konuları ele alan bu mecmualarda genellikle fıkıh kitaplarında yer alan veraset, vefat, hibe, rüşvet, mehr, kefalet, cami inşası gibi konular; hüccet, i'lâm, mürâsele, tereke, mukataa ve iltizam gibi belge türleri bulunmaktadır. Sakk mecmuaları bu konuları ve belge türlerinin yazıya nasıl geçirileceği konusunda önemli bir zenginliğe sahiptir."
