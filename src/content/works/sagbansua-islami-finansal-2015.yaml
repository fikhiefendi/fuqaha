abstract: "Bu çalışmada İslami finans ve İslami finansın günümüz piyasalarındaki yeri incelenmiş; gelecek yıllara yönelik tahminler analiz edilmiştir. Bunun yanında İslami finansın sunmakta olduğu alternatif enstrümanlar irdelenerek klasik enstrümanlarla olan farklılıkları ortaya konmuştur. Çalışmanın birinci bölümünde İslami finans kavramı ele alınmış; tarihçesi, teorik altyapısı, dünyadaki ve Türkiye'deki konumu ayrı ayrı incelenmiştir. Bu anlamda katılım bankacılığı, sigortacılık (tekafül) ve İslami sermaye piyasaları özelinde bilgiler paylaşılmıştır. Ayrıca İslami finansın geleneksel finans arasındaki farklar sunularak kavramların ayrıştırılmasına çalışılmıştır. İkinci bölümde İslami finans sisteminin en çok ilgi gören ürünlerinden biri olan sukuk sertifikaları hakkında temel bilgiler ortaya konarak detaylandırılmıştır. Burada da klasik bonolar ile sukuk sertifikaları arasındaki farklılıklar ortaya konulmuştur. Üçüncü bölümde ise bazı sukuk uygulamaları ile beraber İslami finans ve geleneksel finans kuruluşlarının sundukları getirileri ve finansman maliyetlerinin yanı sıra tüm bankacılık sektörüyle karşılaştırmalı olarak katılım bankalarının rasyo analizleri sunulmuştur."
