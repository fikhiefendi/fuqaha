abstract: "Bu tez, zekât, sadaka, karz ve diğer katılım finans kavramlarının temelinde yatan sosyal, ekonomik ve ahlaki değerlerin, sosyal girişimciliğe yönelik potansiyelini araştırmaya çalışmaktadır. Ayrıca, çalışma ile bu kavramların katılım finans yoluyla sosyal girişimcilik için nasıl destekleyici bir mekanizmaya dönüştürülebileceğine dair bir model önerilmektedir. Tezin ilk bölümünde, katılım finansın kavramsal çerçevesi ve temel öğelerinden bahsedilmiş olup, katılım sosyal finans araçları detaylı bir şekilde incelenmiştir. Bu araçların topluma sosyal ve ekonomik açıdan fayları kapsamlı biçimde araştırılmıştır. Ayrıca bu bölümde, katılım finansın çalışma prensiplerini bir çerçeveye koyan ve onu konvansiyonel finans sisteminden ayıran temel ilkelerden ayrıntılı olarak bahsedilmiştir. İkinci bölümde, sosyal girişimciliğin kavramı, özellikleri, toplumsal kalkınma üzerindeki faydalı etkileri ve dünya üzerinde uygulanan başarılı modelleri anlatılmıştır. Takip eden bölümde ise katılım finans araçlarının sosyal girişimcilik alanında nasıl bir potansiyele sahip olduğu derinlemesine incelenmiştir. Dördüncü bölümde ise, zekât, sadaka ve karz temelinde bir sosyal girişimcilik modeli önerilmiştir. Bu model kapsamında hem çiftçilere yönelik eğitim, proje ve pazarlama destekleri verilerek kırsal kalkınmaya nasıl katkıda bulunulacağı hem de sosyal girişimciliğin farklı bir alanda nasıl geliştirilebileceği gösterilmeye çalışılmıştır. Bu tez, zekât, sadaka, karz gibi katılım finans araçlarının sosyal girişimcilik alanında daha etkin bir şekilde kullanılarak toplumsal kalkınmaya katkıda bulunmayı amaçlamaktadır."
