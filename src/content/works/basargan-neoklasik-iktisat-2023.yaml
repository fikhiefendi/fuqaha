abstract: "İktisat ve psikoloji biliminin birleşimiyle oluşan davranışsal iktisat, son dönemde varsayımları ile dikkat çekmektedir. İktisat biliminin ana ayaklarından birini oluşturan Neoklasik iktisadın savunduğu rasyonel birey kavramı davranışsal iktisatla birlikte yeniden gündeme gelmiştir. Rasyonel birey yaklaşımında, iktisadi sistemin parçası olan tüketicilerin davranışlarını incelenirken bireyin birçok duygusu göz ardı edilir. Halbuki davranışsal iktisat insanı, onu var eden duygularıyla beraber herhangi bir kısıtlama yapmadan araştırmalarına dahil etmiştir. Yapılan bu güncel çalışmalar doğrultusunda iktisat bilimi, insanın sosyal hayatını ve davranışlarını inceleyen psikoloji ve sosyoloji gibi disiplinlerle, insan hayatına yön veren dini inançlarla doğrudan ya da dolaylı bir bağlantı kurarak, insanların karakterlerinin birbirinden farklı olduğunu ve bu farklılıkları iktisadi kararlarına yansıttıklarını göstermiştir. İktisadi durumlarda etik ve ahlaki değerler ile dini inanç ve piyasa uyum içinde olduğundan, toplumun refahı ve adil bölüşüm gibi konular da fonksiyonda yer almalıdır. Aynı şekilde davranışsal iktisadın teorileri de iktisadi analizlere dahil edilmelidir. Böylelikle iktisadi olayların daha anlaşılır olmasına ve daha iyi analizinin yapılmasına imkan sağlanacaktır."
