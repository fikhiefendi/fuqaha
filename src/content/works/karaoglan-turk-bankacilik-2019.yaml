abstract: "Kamunun özellikle finansal, bankacılık sektörüne girme sebepleri değişik nedenlere bağlanabilmektedir. Öncelikle 1980'li yıllardan itibaren katılım bankacılığına devlet daha fazla önem vermiş ilk bakışta özel sektör aracılığı ile kurulmalarına öncülük etmiştir. Yakın dönemde de kamu katılıma devletin ağırlık vermesi devletin İslami finans gibi önemi bulunan bir sektörde bulunması, ekonomik kalkınma ve sektörün gelişimi için şart olduğu düşüncesi ön plana çıkmıştır. Keynes'in gerektiğinde devletin finansal sisteme müdahale etmesi fikri, finansal piyasaların ve hususen bankacılık sektörünün diğer piyasalardan faklı konuma sahip olması, kamunun bankacılık kesimde yer edinmesinin finansal sisteminin ve ekonominin gelişimine olumlu etki yapacağı kanısı, özellikle devlet bürokrasisinde yaygınlık kazanmıştır. Kamu katılım bankacılığı dönüşüm programı kapsamına alınarak bir devlet politikası haline getirilmiştir."
