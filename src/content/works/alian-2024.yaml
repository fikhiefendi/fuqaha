abstract: "Araştırma, altına endeksli kripto para birimleri konusunu ele almaktadır; nakdin evrimini mallardan ve takastan, metal ve kağıt paralara ve son olarak dijitale geniş bir bakış açısıyla sunar ve modern teknolojilerin, altının geleneksel para birimi istikrarını ve dijital para birimlerinin esnekliğini birleştiren yeni para biçimlerini nasıl ortaya çıkardığını açıklar. Araştırma, genel olarak dijital para birimlerinin ve özellikle altına endeksli olanların teorik çerçevesiyle başlar, türlerini ve yaygın olanları gözden geçirir, sonra özelliklerini ve metal, kağıt ve desteksiz dijital para birimlerinden farklarını analiz eder. Ayrıca, araştırma para kavramını ve İslam fıkhındaki hükümlerini, kağıt para ve dijital para birimlerinin fıkhi düzenlemelerini açıklar ve sonra İslam fıkhında paranın işlevlerini ve altına endeksli dijital para birimlerinin bu işlevleri ne ölçüde gerçekleştirdiğini belirtir. Daha sonra, araştırma 2008 küresel krizi sonrası finansal ve dijital dönüşümleri ele alır, mevcut ve öngörülen merkezi ve merkezi olmayan dijital para birimlerinin uluslararası para sistemine ve küresel para politikalarına etkisini inceler, fırsatlar ve beklentiler sunar. Ayrıca, araştırma altının parasal bir standart olarak önemini, küresel bir rezerv varlık olarak rolünü ve altına endeksli dijital para birimlerinin finansal istikrarı nasıl sağlayabileceğini ele alır. Son olarak, araştırma altına endeksli para birimlerinin teknik, hukuki ve düzenleyici zorluklarını gözden geçirir ve genel olarak merkezi dijital para birimleri, özellikle altına endeksli olanlar için birkaç olası senaryoyu ele alır; uluslararası bir para birimi olarak kapasitelerini analiz eder, yenilik yayılma teorisinden hareketle yeni bir fikir olarak yayılma kapasitelerini değerlendirir. Ayrıca, genel kabul ve güvenliklerini sağlayacak düzenleyici ve hukuki çerçevelerin geliştirilmesinin önemini vurgular, böylece küresel ve İslam ekonomisinde bir değişim aracı ve zenginlik deposu olarak kabul görebilirler"
