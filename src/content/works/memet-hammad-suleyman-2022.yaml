abstract: "Tâbiûn ulemâsının önde gelen şahsiyetlerinden Hammâd b. Ebû Süleyman, fakihliğinin yanı sıra muhaddis kimliği ile de ön plana çıkmıştır. Kûfe'nin fakihi olarak anılan Hammâd, pek çok hadis rivayetinde bulunurken, merviyyâtının ekseriyeti ahkâm hadislerinden oluşmuştur. Hanefi mezhebinin ilim silsilesinde önemli konumda yer almış, Abdullah b. Mes'ûd'dan aldığı ilmî mirası İbrahim en-Nehaî vasıtasıyla Ebû Hanîfe'ye aktarmıştır. Bu çalışmada öncelikle Hammâd'ın hayatına ve ilmî kişiliğine yer verilmiştir. Akabinde rivayet ettiği hadisler incelenmiş, sened ve metinleri değerlendirilmiş ve sıhhat durumları araştırılmıştır. Hammâd b. Ebû Süleyman'ın hadis ilmindeki yerini ele aldığımız söz konusu araştırma, giriş ve iki bölümden oluşmaktadır. Girişte çalışmanın önemi, metodu ve kaynaklarından bahsedilmiş, ardından birinci bölümde tezin konusu teşkil eden Hammâd'ın hayatı ele alınmıştır. İkinci bölümde Hammâd'dan sadır olan rivayetler incelenmiş ve değerlendirme kısmında hoca ve talebelerinin cerh ta'dîl durumları zikredilmiştir."
