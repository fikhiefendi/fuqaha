abstract: "ÖZET İslam ekonomisi, dinsel olanla rasyonel olanın bir araya getirilmesiyle ortaya çıkmıştır ve bu nedenle, bir çok çelişki içeren bir yapı oluşturmaktadır. Bu çelişki çeşitli yerlerde ortaya çıkmaktadır: İslam ekonomi yazınının kaynak metinlerle ilişkisinde, modem iktisat kuramıyla ilişkisinde, kullanılan dilin yapısında, seçilen meşrulaştırma araçlarında. Her dinin kendisine özgü iktisadi modeli olamayacağından, İslam ekonomisinin de iktisada ilişkin kendi sözü yoktur. Bu nedenle, İslam iktisadı yazını oluşturulurken, bazı unsurlar modern iktisat kuranımdan, bazıları ortaçağ iktisat tartışmalarından, bazıları da İslami kaynaklardan alınmakta ve sonuçta, uyumsuz parçalardan oluşan bir bütün ortaya çıkmaktadır. İslam ekonomistleri,hem dinsel hem de bilimsel olan bir kuram üretmeyi amaçlarken, sonuç, ne dinsel ne de bilimsel olabilmiştir. Üretilen kuram, pek çok yerde aklın müdahalesi işe karıştığı için, dinsel değildir. Kuramsal yapıda iman, ahlak ve ideolojik unsurlar bazen merkezi rol oynadığı ve çözümlemeden çok düzenleme amaçlandığı için, bilimsel de değildir. Çözümlemenin olduğu ender yerlerde ise çözümlenen, hayali bir bilim nesnesidir. Faiz konusundaki sözde-muhalif tavır ise, faizle karın ve bu ikisiyle de gölge fiyatların ilişkisi görmezden gelindiği için, faizin başka adlar altında yeniden kabulüyle sonuçlanmaktadır."
