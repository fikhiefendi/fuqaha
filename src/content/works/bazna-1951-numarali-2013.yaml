abstract: "Şeriyye Sicilleri Osmanlı tarihi açısından birinci elden kaynaklardır. Bu açıdan Yüksek Lisans Tezi olarak 1951/137 Numaralı (1810-1811 M. Tarihli) Trabzon Şer'iyye Sicilini çevirmeye çalıştık. Bu çalışma 1810-1811 tarihleri arasında Trabzon tarihinin ekonomik, idari, sosyal ve hukuki yönlerini sunmak için ortaya konulmuştur.Tez dört bölümden meydana gelmektedir. Tezde öncelikle Şeriyye Sicillerinin tanımı, önemi ve ihtiva ettiği belge çeşitleri gibi konular hakkında kısaca bilgiler verilmiştir. Daha sonraki bölümlerde kısaca belge özetleri verilmiş ve metnin transkripsiyonu yapılmıştır. Defterde 551 belge bulunmaktadır. Çalışmadaki toplam 551 belgenin içeriğinde nikah hücceti, tereke tesbiti, ihtida hücceti, ibra hücceti, vasi hücceti, vakfiye hücceti gibi konular bulunmaktadır. Bunlar içerisinde nikah hücceti belgelerin çoğunluğunu oluşturmaktadır."
