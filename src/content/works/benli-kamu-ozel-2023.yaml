abstract: "Çalışma genel olarak istihbarat olgusu bağlamında istihbaratın İslam hukukundaki yeri temel alınarak özel ve kamu hukuku açısından istihbarat faaliyetlerinin incelenmesini ele almaktadır. Bu bağlamda istihbarat tanımı, tarihi ve türleri açıklanarak İslam kültürü etrafında istihbari faaliyetlere bakılarak tanımlamalara yer verilmiştir. Örneğin; tecessüs, zan, adalet ve cihat terimlerinin tanımları yapılarak istihbarat bağlamında değerlendirilmiştir. İstihbaratın kavramsal ve niteliksel yönleri ile ele almanın yanı sıra bu boyutlar düzleminde istihbarat kültürü kavramını açıklamak ve bu kavram ile İslam hukuku, kamu ve özel hukuku çerçevesinde istihbarat yapılanmasını ortaya koymaktır. Öncelikle konu gereği istihbarat tarihi kapsamında İslam hukukundan örnek istihbarat faaliyetlerine yer verilmiştir. Söz konusu yapılan araştırmaların ardından, kamu ve özel hukuk ele alınarak bu bağlamda istihbaratın yeri, rolü ortaya konulması amaçlanmıştır. Genel anlamda İslâmiyet öncesi ve sonrası olarak ele alınan çalışmada İslam öncesi istihbari faaliyetler ve İslam suç ve ceza hukukunda istihbaratın hukuksal boyutuna değinilmiştir. İstihbarat denildiğinde akla gelen terimlerden olan casusluk, ihanet, suikast gibi kavramlar ele alınarak İslam hukukundaki karşılıkları ile açıklanmaya çalışılmıştır. Devamında çalışma sadece İslam hukuku, kamu ve özel hukuk alanlarıyla yetinmeyip çağımızın getirmiş olduğu teknolojinin bir eseri olan ve istihbarat açısından önemli bir yere sahip yapay zeka ve istihbarat ilişkisi de ele alınarak değerlendirmede bulunulmuştur."
