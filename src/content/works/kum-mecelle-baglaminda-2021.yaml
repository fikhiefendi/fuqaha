abstract: "İnsanlar aralarında ortaya çıkan uyuşmazlıkları çözüme kavuşturabilmek için mahkemeye müracaat ederler. Hâkimler ise karşısına gelen davayı adil bir şekilde çözüme kavuşturabilmek için ispat vasıtalarına ihtiyaç duyarlar. Hâkimlerin davayı çözüme kavuşturabilmek için kullandığı ispat vasıtalarından birisi olan ikrar, en köklü ve en çok kullanılan ispat vasıtalarından birisidir. Temellerini İslam ve Osmanlı hukukundan alan Mecelle, Tanzimat Fermanı'ndan itibaren Osmanlı Devleti'nde özel hukuk sahasında yapılmış en önemli kanunlaştırma çalışmalarından biridir. Mecelle, ağırlıklı olarak borçlar hukuku, eşya hukuku ve yargılama hukuku alanlarını içine almaktadır ve on altı kitaptan oluşmaktadır. Başta Mecelle'nin on üçüncü kitabı olan“Kitâbü'l-İkrâr”olmak üzere Mecelle'nin çeşitli maddelerinde ikrar ile ilgili hükümler bulunmaktadır. Mecelle'ye göre ikrar, bir kimsenin diğer bir kimsenin kendisinde olan hakkını haber vermesidir. İkrar, ikrara konu olan hakkın, lehine ikrar beyanında bulunulan kimseye ait olduğunu ortaya çıkarır. İkrar beyanında bulunan kimse, yapmış olduğu ikrardan sorumludur. Bunun yanı sıra davaya bakan hâkim de şartları yerine getirilmiş bir ikrar karşısında diğer ispat vasıtalarına ihtiyaç duymadan söz konusu ikrar ile davayı hükme bağlamalıdır. Bu çalışmada ikrar, Mecelle maddeleri üzerinden incelenmiştir. Mecelle'nin ikrar ile ilgili şartları, ikrarın yapılış şekli, ikrar ile ilgili özel durumlar, ikrarın hukuki sonuçları ve ikrarın hükmünün sona ermesi çalışmanın ana başlıklarını oluşturmaktadır."
