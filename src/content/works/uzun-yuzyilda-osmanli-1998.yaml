abstract: "XV. Yüzyılda Osmanlı Toplumunda Kölelik adını verdiğimiz bu çalışmamız da kölelik ve cariyelik çeşitli yönleriyle ele alınmıştır. İnsanlığın tarihi kadar eski olan kölelik bir manasıyla güçlünün zayıfa hükmetmesidir. Bu nedenle de insanın hak ve hürriyetlerini sınırlayan, ona aykırı düşen bir haldir. Eski medeniyetlerde kölelik oldukça yaygındır. Hatta kölelik sebeplerinin 9 - 10'a kadar çıktığı devletler dahi vardır. Doğu ve Batı medeniyet dairesine mensup, eski zamanlarda kurulan devletlerde, kölelerin çok değer verilen unsurlar olmadığı görülen bir gerçektir. İslam hukukunun köleliğe getirdiği sınırlamalar vardır. İslamiyet köleliğin sebeplerini doğum ve savaş esirliği sonucunda köle statüsüne konulma olarak ikiye kadar indirmiştir. Teorik olarak İslamiyet'in bu konudaki temel amacı zaman içerisinde köleliğe son vermektir. Savaşta esir alınan insanların tamamı köle yapılmazdı. Bu konuda devlet başkanına verilen beş yetkiden sadece birisi bu olup, burada da kamu yararını gözetme şartı vardır. Kölelikle ilgili Kur'an'daki temel ayetler ve konusuna göre Hz. Peygamber'in uygulamaları bunun en açık örnekleridir. İslam hukuku köle azad etmeyi teşvik etmiştir. XV. yüzyıl Osmanlı Devleti'nde yapılan fetihler sonucunda alınan esirler köle statüsüne konularak, devletin askeri, idari ve zirai işleri yanı sıra, saraylarda ve toplumdaki fertlerin evlerinde, tarlalarında ve diğer hizmetlerinde kullanılmışlardır. Temelde İslam hukukundaki uygulamaları esas alan Osmanlı'da daha önceki İslam devletlerinde örneği olmayan uygulamalargeliştirilmiştir. Bu uygulamaların İslam hukukuna ters olup olmadığı halen tartışılan bir konudur. Osmanlı'da kölelere yapılan muamele daha önceki medeniyetlerde olduğu gibi insanlık dışı değildir. XV. yüzyılda ve XVI. yüzyılın ilk yarısında görülen ortakçı kullar Avrupa feodalitesi ile kıyaslanabilecek tek örnektir. Osmanlı toplumu içerisinde köleler yerine ve zamanına göre çok şanslı oldukları kadar, kötü halde de olmuşlardır. Bu insanların da zaman zaman istismar edildikleri görülmektedir. Ancak çoğu zaman Batıdaki aynı kaderi paylaşan insanlardan çok daha iyi şartlarda yaşadıkları da bir gerçektir."
