abstract: "Bu çalışma, İslam Ceza Hukukunda suç ve ceza arasındaki dengeyi başta Kur'an ve Sünnet olmak üzere diğer deliller ışığında ele almaktadır. Kur'an ve Sünnette had suçları bağlamında ayrıntılarıyla zikredilen zina, zina iftirası, hırsızlık, içki içme, yol kesme ve İslam dininden dönme ve kurulu düzene başkaldırı cezaları; adam öldürme ve yaralama suçları bağlamında zikredilen kısas cezaları; kısas cezalarının belli sebeplerle uygulanamayıp onun yerine geçen ekonomik boyut bağlamında zikredilen mali cezalar; daha çok ibadet ve ceza bağlamında ele alınan keffaret cezaları ve cezaî takdir hakkının yetkili otoriteye bırakılması bağlamında ta'zir cezaları, suç ve ceza arasındaki denge açısından detaylıca ele alınmakta ve mezheplerdeki gerekçeli görüşler ve cezanın genel prensipleriyle karşılaştırması yapılmaktadır. Ayrıca denge anlamına gelen terimler ve hukuki dayanağı da araştırmada ihmal edilmemektedir. Keza önceki toplumlarla ve modern hukukla da mukayese yapılabilmesi için suç-ceza dengesinin tarihi arka planı ve konuyla ilgili kavram ve karşılaştırmalara da değinilmiştir. Anahtar Kelimeler; Suç, Ceza, Denge, Kur'an, Sünnet, Suç-Ceza Dengesi"
