abstract: "Bir tarafta eğitiminde yoğun olarak felsefeyle ilgilenen ve bunun sonucunda tefsirinde bu alanla ilgili bilgilere yer veren Râzî, diğer tarafta Antik Yunan'dan miras alınan mantık ilminin öğrenimine mesafeli yaklaşan Suyûtî. İkisinin tefsirde önem verdiği hususların ve zihin dünyalarını belirleyen etkenlerin farklı oluşu, Suyûtî'yi Rȃzî'ye 'Râzî'nin tefsirinde, tefsir dışında her şey var' şeklinde bir eleştiri yöneltmesine ve tefsir uygulamasında tefsirin sınırlarına sadık kalmadığını vurgulamasına yöneltmiştir. Bu eleştiri tefsir ilminin neliği ve sınırları meselesini ortaya çıkarmaktadır. Mevcut tenkit noktalar, iki müfessirin zihin dünyası, ilmi geleneği, tanım ve uygulamadan oluşan tefsir anlayışlarını araştırmayı gerekli kılmaktadır. Eleştirinin bilimsel değeri ve tefsir geleneğindeki yeri ancak bu şekilde belirlenmiş olacaktır. Bilimsel değeri belirleyebilmek için bu saydığımız konular dışında ayrıca Râzî'nin tefsirindeki felsefî bilgilerin tefsir değeri konusu da önemlidir. Eleştirinin tarihte başka âlimler tarafından da yinelendiği onun daha ziyade bir düşünce geleneğinin ürünü olduğu ve tanımı ile sınırları belli klasik tefsir anlayışını yansıttığı düşündürebilir."
