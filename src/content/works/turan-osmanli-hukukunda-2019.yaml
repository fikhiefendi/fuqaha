abstract: "Osmanlı Devleti, İslam hukukunu kendi gelenekleriyle birleştirmiştir. Böylece şer'î ve örfî hukukun beraberce uygulandığı bir sistem oluşmuştur. Toplumda meydana gelen suç tiplerine şer'î ve örfî hukuk kurallarına göre farklı yaptırımlar uygulanmıştır. Osmanlı hukukunda unsurları ve ispat şartları gerçekleşen had ve kısas suçlarına belirlenen cezalar uygulanmaktadır. Had ve kısas suçlarının dışında kalan ta'zîr suçları ve cezaları kanunnameler ile belirlenmektedir. Aynı şekilde had ve kısas suçlarının unsurları oluşmadığında onlara uygulanacak cezalar da kanunnameler ile belirlenmektedir. Böylece suçların kanuni unsuru oluşturulmaya ve ta'zîr cezaları uygulanırken keyfilik ortadan kaldırılmaya çalışılmıştır. Ancak cezaların infazında keyfiyet ortadan kaldırılamamıştır. Çünkü ta'zirde devlet başkanının emri ile infaz gerçekleştirilirdi. Çalışmamızda Osmanlı ceza hukukunu oluşturan temel kavramlar ve cezaların infazına ilişkin çeşitliliğin görülmesi mümkündür."
