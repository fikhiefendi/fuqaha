abstract: "Bu çalışmada, Şâtıbî'nin benimsemiş olduğu manevî istikrâ yönteminin, tarihî arka planı gözetilerek ve usûl anlayışıyla bağlantısı kurularak bütünlük içerisinde ortaya konulması amaçlanmıştır. Giriş ve sonuç kısımları dışında dört bölümden oluşan bu çalışma kapsamında; manevî istikrânın fikrî temelleri ve fıkıh tarihindeki bazı tezahürleri, Şâtıbî'yi bu yöntemi benimsemeye sevk eden temel sebepler, manevî istikrânın mahiyeti, ilgili olduğu temel kavramlar ve manevî istikrâ yöntemiyle ispat ve temellendirilmesi yapılan küllî asıl/ilke ve maksatlar incelenmiştir. el-Muvâfakât'ın esas alındığı bu çalışmada içerik analizi ve mukayese yöntemleri izlenmiştir. Çalışma neticesinde, manevî istikrânın köken itibariyle manevî tevatür, istikrâ ve karîne unsurlarına dayanan; asıl, küllî, umûm, âdet ve kat'î kavramlarıyla yakın ilişkisi bulunan; cüz'î delillerin anlamsal birlikteliği esası üzere işleyen ve şer'î alanda kat'î küllî neticeler üretebilen bir istidlâl yöntemi olduğu sonucuna ulaşılmıştır. Manevî istikrâ yöntemi ve bu yöntemin ait olduğu usûl anlayışının modern zamanda naslara ve nasların konusu olan insan hayatına dair parçacı ve öznel yaklaşımların ortaya çıkardığı problemlerin giderilmesinde bir çözüm kaynağı olabileceği düşünülmektedir."
