abstract: "Türkiye'deki Kamu Sermayeli Katılım Bankalarının Çok Kriterli Karar Verme Yöntemleri ile Performans Analizi, Yüksek Lisans Tezi Nevşehir, 2025. Bankacılık sektörü, Türkiye ekonomisi için oldukça büyük öneme sahiptir. Günümüz ekonomi yönetimi kapsamında katılım bankacılığına olan ilgi artmakta ve bu bankaların performanslarını ölçmek/değerlendirmek yatırımcılar, uzmanlar ve bankalar için önem arz etmektedir. Bu nedenle çalışmada 2020-2024 yılları arasında faaliyet gösteren 3 adet kamu sermayeli katılım bankasının performanslarının Çok Kriterli Karar Verme (ÇKKV) yöntemleri ile değerlendirilmesi amaçlanmıştır. Bu temel amaç doğrultusunda belirlenen on kriter CRITIC yöntemi kullanılarak ağırlıklandırılmış; elde edilen ağırlıklar ARAS ve WASPAS yöntemine entegre edilerek bankalar performansları açısından sıralanmış ve değerlendirilmiştir."
