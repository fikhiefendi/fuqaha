abstract: "SOUMANA, Youssoufa, İslam Aile Hukukunda Sedd-i Zerai' ve Hukuki Sonuçları, Yüksek Lisans Tezi, (Danışman: Prof. Dr. İbrahim ÇALIŞKAN), Ankara Üniversitesi, 2014. VII+109 sayfa. Tez, Giriş (İçerik ve Yöntem), Üç Bölüm (Birinci Bölüm: 'Seddu'z-Zerâi'nin Hakikati ve Mahiyeti', İkinci Bölüm: 'Evlilikte Seddu'z-Zerâi'nin Hukuki Sonuçları' Üçüncü bölüm: 'Boşanmada Seddu'z-Zerâi'nin Hukuki Sonuçları'), Sonuç ve Bibliyografya'dan oluşmaktadır. Tezin Birinci Bölümü'nün kendi içerisinde dörde ayrılması uygun görülerek ilk kısımda usul ilminde seddu'z-zerâi'nin mahiyeti, ikinci kısımda zerâi' ile sebep, vesile ve hile kavramları arasındaki ilişki, üçüncü kısımda zerîanın rükünleri, şartları ve çeşitleri, dördüncü kısımda ise seddu'z-zerâi'nin hücciyeti hakkında fıkhî mezheplerin görüşleri ele alınmıştır. Tezin İkinci Bölümü'nde nişanlanma sürecinde, nehiy edilen evlilik çeşitlerinde ve evlilik hayatı üzerindeki İslam hukukçularının görüşleri açıklanarak seddu'z-zerâi'nin hukuki sonuçları incelenmiştir. Tezin Üçüncü Bölümü'nde ise, bazı boşanma çeşitleri ve iddet bekleyen kadının hakları meselelerinde seddu'z-zerâi' ilkesi ortaya koyularak seddu'z-zerâi'nin hukuki sonuçları ele alınmıştır."
