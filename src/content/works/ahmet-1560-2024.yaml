abstract: "Bu tez, hicri onuncu asrın meşhur Hanefi alimlerinden olan Taşköprüzâde'nin (ö. 978/1560) Şerhu mukaddimeti's-salât li Fenârî isimli eserinin tahkik ve analizini yapmayı hedeflemektedir. Eserde rükünleri, şartları, şekilleri ve kısımları dahil olmak üzere namazla ilgili bütün konular bir araya getirilmiş ve delilleri zikredilmiştir. Mezhep imamı Ebû Hanîfe'nin görüşleri yanında Ebû Yusuf, İmam Muhammed, Serahsî ve diğer alimlerin çoğu mahtut olan eserlerde geçen görüşlerine yer verilmiştir. Fenârî'nin namazla ilgili mukaddimesi Hanefi mezhebinin meşhur şerhleri arasında yer alır. Fenârî'nin bu eseri üzerine el- Kuhistânî (ö. 950/1543), el-Akhisârî (ö. 1025/1616) ve Nablusî'nin (ö. 1143/1730) şerhleri bulunmaktadır. Araştırmada eserin yazma nüshaları toplanmış, tahkikte 12 yazma nüsha esas alınmıştır. Çalışmada Fenârî ve Taşköprüzâde'nin şahsi ve ilmi biyografileri ele alınırken betimleyici tarihsel metot; nüshaları birbiriyle kıyaslayıp, farklılıkları dipnotta belirtirken ve görüşlerin asli kaynaklardaki yerlerini gösterirken karşılaştırma yöntemi kullanılmıştır. Araştırmada birçok önemli sonuca ulaşılmıştır. Ulaşılan sonuçlardan önemlileri şunlardır: Taşköprüzâde, Kur'ân, sünnet ve alimlerin görüşleri gibi delilleri yazmıştır. Muhammed Kaşkârî'nin Münyetü'l-Musallî isimli eserine bolca atıf yapmıştır. Şârih, uzun şerhlerin birçoğunun ihmal ettiği cümle terkiplerinin usullerini çokca zikretmiştir. Edep, sünen ve mekruhlar gibi birçok şârihin bahsetmediği konulara değinmiştir. Bunlar da alimlerin bu kitaba verdikleri değer ve tedriste bu kitabı kullanmalarının sebebini izah etmektedir. Şarihin metodu, Hanefi alimlerinin görüşlerini naklederek, içlerinden kitap, sünnet ve küllî kaideler gibi delillerden uygun olanını seçme şeklinde tarif edilebilir. İhtilaflı konularda diğer mezheplerin, özellikle de Şâfiî mezhebinin görüşlerini vermeye özen göstermiştir. Hükümlerin illetlerini sık sık dile getirmesi ve bunlarla ilgili hükümleri açıklaması, müellifin geniş bir kültüre sahip olduğunu göstermektedir."
