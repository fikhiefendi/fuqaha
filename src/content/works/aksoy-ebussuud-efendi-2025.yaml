abstract: "İslam dünyasında dini eserlerde kullanılan manzum biçim Osmanlı Devleti'nde fetvâlarda da uygulanmıştır. Bu uygulamanın büyük ölçüde sorunun manzum biçimde sorulması veya fetvâyı veren şeyhülislâmın şair olmasıyla ilgili olduğu düşünülmektedir. Ebu'-s-su'ûd Efendi, Osmanlı Devleti'nde en uzun süre ile şeyhülislâmlık yapmış, bu süre içerisinde vermiş olduğu fetvâlarla birçok meseleyi çözmüş, devlet ve toplum üzerinde önemli etkilere sahip bir devlet adamıdır. Bu çalışmada aynı zamanda şair olan ve XVI. asırda verdiği fetvâlarla dönemin önemli şeyhülislâmlarından olan Ebu'-s-su'ûd Efendi'nin fetvâlarının edebi unsurlar açısından incelemesi yapılmaktadır. Çalışma ile edebiyat açısından zayıf görülen bu fetvâların özellikleri ele alınarak sanatsal yönleri ortaya konulmaya çalışılmaktadır. Bu doğrultuda ilk olarak Ebu'-s-su'ûd Efendi'nin gerek şekil gerek muhteva olarak bu unsurları içeren fetvâları belirlenmiştir. Giriş bölümünde tezin amacı, önemi, fetvâ kavramı, fetvâ kurumu ve bu kurumu temsil eden şeyhülislâmlık makamı ele alınmıştır. İkinci bölümde Ebu'-s-su'ûd Efendi'nin hayatı ve eserleri ile ilgili bilgilere değinilmiştir. Çalışmanın esasını teşkil eden üçüncü bölümde ise Ebu'-s-su'ûd Efendi'nin belirlenen manzum fetvâları ve konusu dil ve edebiyatla ilgili olan fetvâlar olarak farklı başlıklarda incelenmiştir. Sonuç bölümünde ise incelenen fetvâlar ile ilgili çalışmanın genel bir değerlendirmesi yapılmıştır."
