abstract: "Son yıllardaki finansal krizler, İslami finansın özellikle de islami bankacılık sisteminin ekonomik ve finansal dünyadaki önemini ve gücünü etkili bir şekilde göstermiştir. Sistemin bu gücü, akademik araştırmacılara ve finans kurumlarına İslami bankacılık sisteminin etkinliğini ve performansına odaklanmayı sağlamıştır. Bu nedenle araştırmanın temel amacı, Türkiye'de Katılım bankaların performans ve etkinliğini Malezya'daki İslami bankalarla karşılaştırarak analiz etmektir. Bu amaçla, Türkiye'den üç katılım bankası ve Malezya'dan yedi İslami banka analize dahil edilmiştir. Canlı bulguları elde etmek için literatürde sık kullanılan iki analiz tekniği kullanılmıştır. İlk olarak, kârlılık, likidite ve risk ve borç ödeme gücünü belirlemek için oran analizi kullanılmış, diğer yandan etkinlik skorlarını hesaplamak amacıyla Veri zarflama analizi yöntemi girdi ve çıktı odaklı CCR ve BCC modelleri ile kullanılmıştır. Her iki teknikten elde edilen bulgulara göre, Türkiye'deki Katılım bankalarının etkinlik skorları yüksek olmasına rağmen likidite, risk ve borç ödeme güçleri olması gerektiği kadar güçlü değildir. Bununla birlikte, kârlılıkları Malezya İslam bankalarına göre çok daha yüksektir."
