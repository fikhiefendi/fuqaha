abstract: "Çalışmanın konusu bir Osmanlı âlimi olan Ahmed b. Muhammed et-Tokâdî'nin Şerhu Telhîsi usûli'l fıkh adlı eserinin tahkik ve tahlilidir. Bu eser medreselerde okutulan ders kitabı niteliğinde yazılmış bir muhtasardır. Kütüphanelerimizde bulunup varlığı bilinmeyen kıymetli eserlerden sadece biri olan Şerhu Telhîsi usûli'l fıkh metnini inceleyip tahkik ederek onu gün yüzüne kavuşturmak ve ondan yararlanmak üzere okuyucu ile buluşturmak bu tezin amacıdır. Aynı zamanda Ahmed b. Muhammed et-Tokâdî gibi ilme hizmet etmiş lakin hakkında herhangi bir malumatın bulunmadığı âlimlerimize olan vefa borcumuzu da ödemek suretiyle hayatı ve eserleri ile ilgili bulguları paylaşmak bu çalışmanın gayelerindendir. Osmanlı mirasının bir parçası olan bu eser anlaşılır hale getirilerek, tevsik ve tahkik edilerek ilim ile iştigal edenlerin faydalanması temennisiyle bu alana kazandırılmaya çalışılmıştır. Tahlil ve tahkik olmak üzere iki ana bölümden oluşan bu çalışmanın tahlil kısmı bir giriş ve bir bölüm içerirken tahkik kısmı tahkik edilen metni ihtiva etmektedir. Giriş bölümünde çalışılan konunun önemi, amacı ve tezin yöntem ve kaynakları belirtilmiştir. Birinci bölümde müellifin yaşadığı döneme tekabül eden m. XVI-XVII. yüzyıl. Osmanlı'sında muteber olan fıkıh usûlü eserleri ve genel olarak medreselerde okutulan kitaplar incelenmiştir. Daha sonra Tokâdî'nin hayatı ve eserleri hakkında elde edilen bilgi ve ipuçları değerlendirilmiştir. Eserin müellife nisbeti ve telif sebebi, konuların tertibi, uslüp özellikleri, kaynakları, üzerinde yapılan çalışmalar ve menhec incelemesi yapılmıştır. Daha sonra tahkikte kullanılan nüshaların tanıtımı yapılarak tahkik yöntemi belirtilmiştir. İkinci bölüm olan tahkik kısmında bir nüshayı asıl kabul etmek üzere üç nüshanın karşılaştırması yapılarak metin tahkik edilmiştir. Son olarak da araştırmadan elde edilen sonuçlar ortaya koyulmuş ve bir değerlendirme yapılmıştır."
