abstract: "Finansal kapsayıcılık, yatırımı, girişimciliği, iş yaratmayı, eğitimi ve sağlık hizmetlerini teşvik ederek geniş tabanlı ekonomik ilerlemeyi tetikleyici olarak görülmektedir. Sonuç olarak, gelir eşitsizliklerini azaltma, yoksulluğu hafifletme ve kadınların kapsayıcı ekonomik büyümeye katılmasını sağlama potansiyeline sahiptir. Bununla birlikte, dünya çapında giderek daha fazla tanınan İslami finansın ortaya çıkması, özellikle Moritanya gibi gelişmekte olan ülkelerde finansal kapsayıcılığı teşvik etmek için umut verici bir yol sunmaktadır. Ancak, İslami finans prensiplerine bağlılık ve İslami finansal ürünlerin kullanımının Moritanya'da resmi finansal hizmetlere erişimin geliştirilmesine ne ölçüde katkıda bulunduğu henüz tam olarak incelenmemiştir. Bu nedenle, bu çalışma, İslami finansın Moritanya'da finansal kapsayıcılığı artırmada oynayabileceği rolü araştırmayı amaçlamaktadır. Bunun için, çalışma İslami finansın teorik arka planını ve finansal kapsayıcılıkla olan ilişkisini; finansal kapsayıcılık faktörlerini, bireylerin algılarının İslami finans ürünlerinin kullanımına etkisini keşfetti. Çalışma, hem nitel hem de nicel yöntemleri kullanarak, birincil ve ikincil verilere dayanarak yapılmıştır. SPSS yazılımını kullanarak istatistiksel analiz, finansal kapsayıcılık faktörlerini, bireylerin algılarının İslami finans ürünlerinin kullanımına etkisini ve İslami finansın finansal kapsayıcılığı artırma etkisini incelemek için kullanılmıştır. Bu, toplumun çeşitli kesimlerine (çalışanlar ve öğrenciler dahil) uygulanan anketin nitel analizi yoluyla gerçekleştirilmiştir. Çalışma sonuçları, İslami finansın finansal entegrasyonla pozitif bir ilişkisi olduğunu, hem nitel hem de nicel analiz yoluyla gözlemlendiğini göstermektedir. Çalışmada yapılan deneysel araştırmalar, finansal entegrasyonun faktörlerinin (cinsiyet, yaş, gelir ve eğitim düzeyi) finansal entegrasyonu etkilediğini göstermektedir. Çalışma ayrıca, finansal kapsayıcılığın farkındalığının İslami finans farkındalığı tarafından daha da arttığını ortaya koymuştur. Ayrıca, Moritanyalıların önemli bir bölümünün entegrasyona dini nedenlerle direndiğini, bu nedenle finansal kapsayıcılık için İslami finansın farkındalığının artırılmasının gerekliliğini belirtmiştir. Ayrıca, çalışma, Moritanyalıların İslami finans kurumları aracılığıyla entegrasyonu tercih ettiğini sonuçlandırmıştır. Ancak, Moritanya'daki deneyim bu alanda oldukça yeni ve geleneksel kurumlardan farklı yasal ve işletme ortamına sahiptir, bu da bazılarının İslami doğasını sorgulamasına neden olmuştur. Bu bilimsel mesaj, Moritanya'da İslami finans ürünlerinin kullanımının belirleyicilerini ve İslami finansın finansal kapsayıcılığı artırmadaki etkisini inceleyerek finansal kapsayıcılık literatürüne teorik ve deneysel olarak katkıda bulunmaktadır. Bunlar, bireylerin ve paydaşların algıları ve İslami finanslarının kullanımı yoluyla İslami finansın finansal kapsayıcılık üzerindeki etkisinin nicel ve nitel ölçümünü içerir. Bu nedenle, çalışma, Moritanya'da finansal kapsayıcılık ve İslami finans konusundaki politika yönelimlerine katkıda bulunmuştur."
