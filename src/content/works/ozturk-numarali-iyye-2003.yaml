abstract: "Hamid Sancağı, tarih boyunca çok hareketli bir dönem geçirmiş ve birçok medeniyetlere kaynaklık etmiştir. Bölgede yapılan kazı çalışmalarında; Üst Paleolitik, Mezolitik ve Neolitik dönemlere ait olan kalıntılar çıkarılmıştır. Bölge Fenikelilerin, Lidyalılar'ın ve Persler'in hakimiyetleri altında kalmıştır. Türklerin bu bölgeye yerleşmelerinden sonra bölge tamamen Türk kültürünün ı etkisi altında kalmış ve bunun sonucu olarak Camiler, Mescitler, Kervansaraylar. Medreseler inşa edilmiştir. Osmanlı hakimiyetinden sonra bölge, Hamid Sancağı veya Hamid İli olarak isimlendirilmiştir. Osmanlı Devleti zamanında sancakta 16 kaza, 28 mahalle ve 12 köyden ibaretti. Cumhuriyet döneminde ise İsparta ismini almıştır."
