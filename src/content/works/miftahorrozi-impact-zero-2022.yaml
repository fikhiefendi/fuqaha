abstract: "Endonezya hükümeti, ülkedeki atık miktarının hızla artmasıyla atık miktarını azaltmayı hedefleyen yönetmelikler çıkardı. Endonezya'nın şehirlerinden Malang, sağlıklı bir çevre için sıfır atık (ZW) girişimleri başlatmıştır. ZW programıyla başlamak üzere Malang,“Malang'ın Atık Bankası”(WBM) veya“Bank Sampah Malang”(Endonezya) olarak bilinen bir banka kurmayı tercih etmiştir. Bu çalışmada, ZW düzenlemelerinin sosyal-ekonomik kalkınma üzerindeki etkisinin analiz edilmesi ve bu asil amaca ulaşmada atık bankalarının etkinliğinin, maqasid al-Shariʻah gözüyle değerlendirilmesi amaçlanıyor. Araştırmada betimleyici-nitel bir yaklaşım benimsenmiş ve hem birincil hem de ikincil veriler kullanılmıştır. Birincil veriler derinlemesine görüşmeler yoluyla elde edilirken, ikincil veriler web sitelerinden, bültenlerden, kitaplardan, raporlardan ve diğer yayınlardan elde edilir. ZW düzenlemeleri ve işletim WBM, topluluğun ekonomik ve sosyal refahına önemli ölçüde katkıda bulunur. Aynı şekilde WBM, müşterilerinden topladığı atıkları azaltarak, yeniden kullanarak ve geri dönüştürerek atıkları başarılı bir şekilde yönetti. Kâr paylaşım sözleşmesi ile bankamız, geri dönüşümü sağlanan atıkları, uzmanlaşmış bir firmaya sattığında müşterileri, atık bankasından kazanç elde ediyor. ZW projelerinin hayata geçirilmesi, atık bankasının maqasid al-Shariʻah ile uyumlu hale getirilmesi gibi kavramlar."
