abstract: "Köln Eyalet Mahkemesi 7 Mayıs 2012 tarihli gerekçeli kararında gayri mümeyyiz çocuğun dinî nedenle sünnet edilmesini haksız müdahale yani yaralama olarak değerlendirmişti. Karar özellikle Almanya'da yaşayan Müslümanların ve Yahudilerin tepkisini çekmekle beraber hukuk camiasında sünnetin hukuka uygun olup olmadığının tartışılmasına neden olmuştu. Aynı zamanda Köln Eyalet Mahkemesinin sünneti yaralama olarak değerlendirmiş olması hekimleri mesleklerini icra etme noktasında zor durumda bırakmıştı. Çünkü hekimlerin, mahkeme kararı sonrası sünnet etmeye devam etmeleri riskli olup yargılanma ihtimalini barındırmaktaydı. Nitekim sünnet konusundaki hukukî belirsizlik nedeniyle, Berlin Yahudi Hastanesinde dinî nedenle yapılan sünnetlerin durdurulduğu açıklanmıştı. Federal Hükûmet, hukukî belirsizliğin bir an önce giderilmesi için Alman Etik Kurulunun tavsiyelerinin hemen hepsini içeren bir kanun tasarısı hazırlamıştı. Hem söz konusu kanun tasarısında yer alan sünnetin hukuka uygun olma şartları, hem de mahkeme kararına dair ortaya çıkan hukukî tartışmalarda ileri sürülen argümanlar, bu çalışmada fıkıhta velayet hakkının erkek çocuk sünnetini kapsayıp kapsamadığı ve fıkıhta tıbbî müdahalenin meşru olmasının şartlarının incelenmesini zorunlu kılmıştır. Bu nedenle fıkıhta velayet hakkının erkek çocuk sünnetini kapsayıp kapsamadığı ve tıbbî müdahalenin fıkha uygun olmasının şartları ele alınacaktır. Çünkü hem ileride sünnet kanunu olarak yürürlüğe girecek sünnet hakkındaki kanun tasarısında, hem de mahkeme kararına dair ortaya çıkan hukukî tartışmalarda ileri sürülen argümanlarda, bahsi geçen konular üzerinde durulmuştu. Bu nedenle sözü geçen konuların fıkıh bölümünde ele alınmış olması, hem sünnet hakkındaki kanun tasarısında sünnetin hukuka uygun olmasının şartlarının, hem de mahkeme kararına dair ortaya çıkan hukukî tartışmalarda ileri sürülen argümanların fıkhî açıdan daha kolay bir şekilde kıyaslanarak değerlendirilebilmesini sağlamıştır. Dolayısıyla bu çalışmanın hedefi Alman hukuk literatüründeki görüşlerin fıkıh ile karşılaştırılıp değerlendirilmesidir. Nitekim Köln Eyalet Mahkemesinin sünnet kararını desteklemeyen hukukçular sünneti velayet hakkı kapsamında değerlendirmişlerdir. Dolayısıyla bu görüş fıkhın çocuk sünnetine bakışına benzemektedir. Aynı şekilde mahkeme kararını desteklemeyen hukukçular, ebeveyn rızasının sünneti hukuka uygun hale getireceğini belirtmişlerdir. Fıkıhta da gayri mümeyyiz çocuğun sünnet edilebilmesi için velisinin rızasına başvurulmalıdır."
