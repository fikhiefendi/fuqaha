abstract: "Çalışmanın konusu, İslami finansın Kırgızistan örneği üzerinden Orta Asya ülkelerindeki gelişimi, oluşturmaktadır. Bu kapsamda, Orta Asya ülkeleri tecrübesini de dikkate alarak Kırgızistan'da İslami finansın gelişiminde yaşanan sorunlar ile fırsatların ortaya konulması ve bu sorunlara çözüm önerileri sunulması amaçlanmaktadır. Araştırmada, İslami finans kurumlarının uzmanları, uygulayıcıları ve temsilcileriyle yarı yapılandırılmış derinlemesine mülakatlara dayanan nitel bir araştırma yöntemi olan derinlemesine görüşme (deep interview) tekniği ve SWOT analiz aracı kullanılmıştır. Görüşmeler 1 Kasım 2024- 1 Mayıs 2025 tarihleri arasında yüz yüze ve çevirim içi şeklinde Kırgızistan ve Türkiye'de gerçekleştirilmiştir. Görüşme, alana yönelik farklı gruplardan oluşan 8 kişiyle yapılmıştır. Görüşme yapılan kişiler düzenleme ve denetim grubu, İslami finans kurumları uzmanları, akademisyenler ve araştırmacılardan seçilmiştir. Görüşme esnasında tüm katılımcılar ses kaydı alınmasına izin vermiştir. Yapılan derinlemesine görüşmeler sonucunda, İslami finans sisteminin gelişimini kısıtlayan temel sorunları yansıtan yedi ana konu başlığı belirlenmiştir. Bu konu başlıkları mülakat katılımcılarının görüşleri, gözlemleri ve değerlendirmeleri temelinde oluşturulmuştur. Bu bağlamda Kırgızistan'da İslami finansın gelişimini engelleyen sorunlar: sınırlı yasal ve düzenleyici çerçeve; Şeriat kurullarının bağımlılığı; halkın farkındalık düzeyinin düşük olması; güven eksikliği ve meşruiyet tartışmaları; devlet desteğinin yeterli olmaması; İslami sermaye yatırımlarının teşvik edilmemesi ve siyasi istikrarsızlık; nitelikli kadro eksikliği şeklindeki başlıklar altında değerlendirilmişitir. Çalışma doğrultusunda Kırgızistan'ın İslami finans alanında önemli bir potansiyele sahip olduğu ancak bunun kurumsal yönlendirme, insan kaynakları eğitiminde reform, yatırım için teşviklerin oluşturulması ve düzenleyici çerçevenin geliştirilmesi gibi stratejilerin uygulanmasıyla gerçekleşeceği sonucuna varılmıştır."
