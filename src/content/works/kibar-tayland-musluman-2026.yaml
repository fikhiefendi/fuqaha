abstract: "Tayland Devleti önemli bir Müslüman azınlığı bünyesinde barındırmaktadır. Bu Müslüman nüfusun büyük çoğunluğu Tayland'ın güneyinde bulunan Pattani, Yala, Narathiwat ve Satun illerinde yaşamakta; aile ve miras hukuku davalarında resmî olarak İslam hukukuna tâbî olmaktadır. İslam hukukunun devlet yargısı içinde sınırlı bir alanda uygulanması, hukukî ve kurumsal açıdan çeşitli tartışmaları beraberinde getirmektedir. Bu tez, söz konusu uygulamanın hangi tarihsel ve normatif temellere dayandığını, Tayland Devleti'nin mevcut hukuk sistemi içerisinde nasıl konumlandırıldığını, hangi kurumlar aracılığıyla yürütüldüğünü ve bu çerçevede ortaya çıkan tartışma alanlarını ortaya koymaktadır. İnceleme kapsamında, başta 1946 tarihli düzenleme olmak üzere ilgili mevzuat, Tayland hukuk sisteminin genel yapısı, mahkemelerde kullanılan“Aile ve Mirasa İlişkin İslam Hukuku Kılavuzu”, Yargıtay kararları, Devlet Konseyi görüşleri ve konuya ilişkin akademik literatür ele alınmıştır. Tez kapsamında, İslam hukuku uygulanma alanının kişi, konu ve coğrafya bakımından sınırları; dato' yutitam kurumunun hukukî statüsü ve yetki alanı; Kılavuz'un normatif niteliği; mahkeme içi ve mahkeme dışı uygulamalar arasındaki ilişki ile Müslümanların arabuluculuk kurumlarındaki uygulama değerlendirilmektedir. Bu yönüyle çalışma, Tayland örneği üzerinden modern bir ulus devletin hukuk sistemi içerisinde İslam hukukunun sınırlı ve parçalı biçimde yer almasının ortaya çıkardığı tartışmaları analiz etmeyi hedeflemektedir."
