abstract: "Şeyhülislam Kadızâde Mehmed Tâhir Efendi (1747-1838) Tokat'ta dünyaya gelmiştir. Babası kadı Ömer Efendi'dir. İlk eğitimini babasından almıştır. Babası adındanda anlaşılacağı üzere kadı olarak Osmanlı İmparatorluğunda görev yapmıştır. Daha sonra İstanbul'a giderek devrin tanınmış âlimlerinden ders görmüştür. Mehmed Tâhir Efendi 1196/1782 yılında girmiş olduğu ruûs imtihanını kazanarak müderris olmuştur. Bu görevden sonra kadılığa terfi etmiş olup Anadolu ve Rumeli'nin birçok ilinde kadı olarak görev yapmıştır. Sırasıyla; Osman Paşazâde İzzet Bey'in Teşrîfatçılık memurluğunda bulundu ardından Yenişehr-i Fenâr Kadılığına getirildi. Mekke pâyeliğini elde etti. 1818 yılında İstanbul kadılığına getirildi. 1824 senesinde Anadolu kazaskeri oldu. 1824 yılında Mekkîzâde Âsım Efendi'den sonra Şeyhülislam olarak göreve getirildi. Padişah II. Mahmut zamanında Şeyhülislam olarak görev yapmıştır. İki buçuk yıl bu görevi sürdürmüştür. En büyük hizmeti devlete karşı isyan eden yeniçeriler hakkında vermiş olduğu fetvasıdır. Devletin yanında mânevi olarak durarak padişahın teveccühünü kazanmıştır. Yaşlılığından dolayı görevinden ayrılmıştır. Bu ayrılıştan sonra Şeyhülislam, Risâle-i Nûriye adlı eseri yazmıştır. Tasavvufa dair kırk bir konudan bahseden bu eseri biz tez çalışmamız olarak ele alıp üzerinde çalıştık. Tez çalışmamız iki bölümden oluşmaktadır. Birinci bölümde Kadızâde'nin hayatını, eserlerini, ikinci bölümde kısaca tasavvufun tanımını, amacını, gayesini ve tasavvufi görüşünü ele aldık."
