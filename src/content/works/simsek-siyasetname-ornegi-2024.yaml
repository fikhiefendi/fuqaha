abstract: "İdare etme sanatı olan siyaset, cemiyet hayatı için çok ehemmiyetlidir. Bu ehemmiyetine binaen siyasete dair esaslar önce sözlü olarak ardından yazılı olarak nesilden nesle aktarılmıştır. İslam tarihinde siyasete dair meseleler fıkıh, felsefe, sosyoloji gibi farklı cihetlerden ele alınmıştır. Siyasetnamelerin ise kendilerine ait hususiyetleri vardır. Muhtevalarında fıkha dair hükümler barındırması sebebiyle fıkıh temelli eserlere benzemekle beraber içeriğinin tavsiye niteliği taşımasından ötürü onlardan ayrışmaktadırlar. Fıkıh hükümlerinin yanı sıra hem İslam tarihinden hem de İslam öncesi devirlerden misaller getirmeleri siyasete dair diğer eserlerden temeyyüz etmelerini sağlamıştır. Kendi dönemlerinin sorunlarına yoğunlaşan siyasetnameler arasında Koçi Bey'in risalesinin önemli bir yeri bulunmaktadır. Risalenin yazıldığı dönemde otorite boşluğundan kaynaklı ciddi sorunların olması, IV. Murad gibi gözünü budaktan sakınmayan bir hükümdara karşı sorunların çekinmeden ifade edilmesi, önceki eserlerin aksine tenkitlerin yanına tahlil ve tekliflerin de eklenmesi eseri orijinal yapmaktadır. Bu çalışmada, risalenin İslam hukukunda sultanın salahiyeti açısından değerlendirilmesi yapılmaya çalışılmıştır."
