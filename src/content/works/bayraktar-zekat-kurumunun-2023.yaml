abstract: "Bu çalışmanın asıl amacı modern dönemde ulus devletinin zekât ibadetini bir kamu maliyesi aracı olarak seküler politikalarının aracı haline getirmesinin eleştirel bir anlayışla analizini yapmaktadır. Bu amacı gerçekleştirmek için modern öncesi ve modern dönem toplumlarını değerlendirmiş ve egemenlik, hâk ve sosyal yapı üzerinde durulmuştur. Bu aşamada analizimizi yaparken, modern dönem öncesi yapıyı açıklamak için El-Şatıbi, Gazali, Ebu Ubeyde gibi isimlerle klasik kaynaklara odaklanılmış, çağdaş dönemdeki değişimi analiz etmek için Polanyi, Poggi, Hallaq gibi isimlerden faydalanılmaya çalışılmıştır. Daha sonra, İslam Ekonomisi teorik çerçevesi kullanılarak modern kamu maliyesinde zekâtın ontolojik düzeyde eleştirel bir değerlendirmesini yapılacak ve İslam ekonomisi bağlamında zekât kavramının nasıl olması gerektiği ortaya konulacaktır. Toplumda yaşanan dönüşümler sonucunda Avrupa'da yaşanan 18. yüzyıla kadar doğrudan insanın sosyal ilişkisinin piyasaya gömülme süreci, 20. Yüzyılda müslüman toplumlarda görülmeye başlamıştır. Batı Avrupa'da dahi yaşanılan krizler bütünü Müslümanlarca yaşanılması kaçınılmaz olup ithal bir anlayışla belirlenen zekâtın konumu varoluşsal olarak sorun yaratmaktadırlar. Zekât, sadaka, kefaret gibi kurumlar dini müesses nizamın birer enstrümanı olarak değil her biri bir şekilde, bazen muhteviyatı hususunda şüphe uyandıracak şekilde finansallaştırılmaktadır."
