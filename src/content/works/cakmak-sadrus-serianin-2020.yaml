abstract: "Fahreddin er-Râzî'nin açık bir biçimde gündeme getirdiği dilin kesinliği problemi, İslâmî ilimler metodolojisi ile ilgili önemli bir problem alanını ortaya koymaktadır. Dil-mantık, lafız-anlam ilişkilerinin ekseninde yer alan bu tartışma, özellikle hakikat bilgisinin nasıl elde edileceği sorusunun bir tezahürü olarak dile getirilmiştir. Bu doğrultuda Râzî önemli ve derinlikli metodolojik bir eleştiri yaparak nihaî kesinliğin izini sürmüştür. Bu çaba hakikat bilgisinin sağlanması adına önemli bir adım olmakla birlikte, dilin kesinlik taşımadığı iddiası; şer'î bilginin esasını oluşturan lafzî delillerin geçerliliğini tehlikeye atmaktadır. Bu nedenle dilin kesinlikten uzak olduğu görüşü, birçok âlim tarafından eleştirilmiştir. Bu iddiayı Hanefî usûlüne taşıyan Sadrüşşerîa da bu âlimler arasında olup, Râzî'den daha farklı bir kesinlik anlayışını vurgulayarak dilin kesinlik imkânını sistematik bir biçimde ortaya koymuştur. Bu kapsamda çalışma; Sadrüşşerîa'nın görüş ve eserleri merkezinde dilin kesinliği tartışmasının arka planını, temellerini ve içeriğini konu edinmektedir. Çalışmada teorik çerçevesi incelenen problem, fıkıh usûlünde yer alan dil meseleleri kapsamında da tetkik edilmiştir. Böylece çalışmada, temel Hanefî usûl eserleri dikkate alınarak, Sadrüşşerîa'nın dilin kesinliği problemine yaklaşımının fıkıh usûlündeki izdüşümleri analiz edilmiştir."
