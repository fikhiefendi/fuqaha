abstract: "HEPAT T C'L HASTALARDA R BAV R NE BAĞLI ANEM DE S-ADENOZ LHOMOS STE N H DROLAZ GENET K VARYASYONLARININ VEMET LENTETRAH DROFOLAT REDÜKTAZ GEN POL MORF ZMLER N NETK SZÜHAL MERT ALTINTAŞGünümüzde kronik hepatit C infeksiyonu tedavisinde interferon ve ribavirinkullanılmaktadır. Ancak bu hastaların %10'unda ilaç kesmeyi gerektirecek kadar şiddetli anemigelişmektedir. Ribavirinin eritrositlerde S-adenozilhomosistein hidrolaz (AHCY) aktivitesiniinhibe ettiği bulunmuştur. Bu çalışmanın amacı AHCY gen varyasyonlarının vemetilentetrahidrofolat redüktaz (MTHFR) gen polimorfizmlerin ribavirin anemisindekietkisini araştırmaktır.Kronik C hepatiti tanısı nedeniyle interferon ve ribavirin tedavisi almış olan hastalarçalışmaya dahil edildi. Veriler; başlangıç hemoglobin, platelet sayısı, AST, ALT, GGT veLDH değerleri ile vücut kitle indeksi hastane kayıtlarından temin edildi. Hemoglobinseviyelerinde â¥2 gramlık düşmeye göre iki gruba ayrıldı. MTHFR için C677T ve A1298Cpolimorfizmleri ve AHCY1 5'UTR -34 CâT, AHCY2 112 CâT, AHCY4 143 AâGvaryasyonlarına bakıldı.Anemi sıklığı 52/85 (% 61.17) olarak bulunmuştur. Gruplar arasında risk faktörlerinebakıldığında sadece yaş açısından belirgin bir ilişki olduğu belirlendi. Yaş arttıkça anemi riski1.112 (OR) kat artmaktaydı ve bu sonuç istatistiksel olarak anlamlıydı (p=0.009). Gruplararasında bakılan gen polimorfizmleri ve genetik varyasyonlar yönünden bir ilişki bulunamadı.MTHFR C677T gen polimorfizmine ait T/T genotipinin anemi olanlarda C/C genotipine göre6.029 kat daha fazla görüldüğü belirlendi ancak bu sonuç istatistiksel olarak anlamlıbulunmadı (p=0.137). MTHFR A1298C gen polimorfizmine ait C/C genotipinin anemiolanlarda A/A genotiplilere göre 3.586 kat fazla olmakla birlikte bu fazlalık istatistiksel olarakbulunmadı (p=0.124).MTHFR C677T için T/T genotipine ve A1298C için C/C genotipine anemi olanlarda dahasık rastlanmasına rağmen. MTHFR gen polimorfizmleri ve AHCY genetik varyasyonlarıribavirinle ilişkili anemi için bir risk faktörü değildir. Yaşla birlikte ribavirinle ilişkili anemiriski arttığı için bu gruba tedavi verilirken daha dikkatli olunmalıdır.Anahtar kelimeler; interferon, ribavirin, anemi, metilentetrahidrofolat redüktaz, S-adenozilhomosistein hidrolaz, gen polimorfizmi."
