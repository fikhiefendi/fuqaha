abstract: "Bu tez, bir Giriş ve iki Bölümden oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir.İlk bölümde İbn Hazm'ın hayatı ve ilmî kişiliği üzerinde durulmakta ve bunların İbn Hazm'ın ortaya koymuş olduğu düşünce üzerinde ne gibi bir etkiye sahip olduğu tartışılmaktadır. Bunun yanında İbn Hazm'ın savunduğu metot anlayışının tarihi arkaplanı ele alınmakta ve İbn Hazm'ın gerek Zâhirîlik gerekse Endelüs fıkıh düşüncesindeki önemi vurgulanmaktadır.Tezin ikinci bölümde ise İbn Hazm'ın kaynaklara bakışı ve usûl anlayışının karakteristik özellikleri ele alınmakta, kıyâs ve ta'lîl bağlamında İbn Hazm'ın hakim usul anlayışına yönelik eleştirilerine yer verilmektedir."
