abstract: "Hz. Peygamber'in gönderildiği ortam cahiliye olarak adlandırılmış, herhangi bir devlet geleneği bulunmayan bir topluluktan müteşekkildi. Hz. Peygamber ise hicretten sonra dini tebliğin yanında bu toplumun idari, siyasi, askeri, hukuki işleriyle de ilgilenmek zorunda olan bir idareci olmuştur. Biz tezimizde Hz. Peygamber'in gönderildiği toplumun birer üyesi olan gayr-i müslimlerin ona arz ettikleri on davayı inceledik. Hz. Peygamber'in bu topluma temellerini attığı yargı kurumunun dayanaklarının ise; Kur'an, Tevrat, cahiliye örf ve adetlerine bazen de Hz. Peygamber'in içtihadına dayandığına ulaştık. Lakin yirmi üç yıllık bir serüvenin on davayla sınırlanamayacağı aşikâr olmakla birlikte dayanaklarının sağlamlığı ve birçok kaynakta geçmesi hasebiyle araştırmamızı on dava üzerine yoğunlaştırıp genel bir bakış açısı sunmaya çalıştık. Nitekim yargılamada amaç cezalandırmak değil, suçu ortadan kaldırmaktır. Hz. Peygamber (s.a.v.)'in de hükümlerini bu amaç doğrultusunda verdiğini görmekteyiz. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş kısmında öncelikli olarak araştırmanın metodu ve kaynaklarına, daha sonra yargı kavramına yer verip cahiliye döneminin o zamanki sosyo-kültürel yapısı hakkında bilgi verdik. Birinci bölümde cahiliye dönemindeki yargı, hakemler ve yargılama usullerine değinip Hz. Peygamber dönemindeki yargı anlayışı ve usulünü gözler önüne serdik. İkinci bölümde Hz. Peygamber'in Müslüman ve gayr-i müslim davalarındaki çözüm önerilerini ve bunların dayanaklarını bölümler halinde inceledik."
