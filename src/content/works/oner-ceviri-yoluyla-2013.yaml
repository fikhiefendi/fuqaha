abstract: "`Çeviri yoluyla kanun yapma' olgusunu konu edinen bu tezde, Osmanlı İmparatorluğu Tanzimat Dönemi'nde, 1810 tarihli Fransız Ceza Kanunu'nun çevrilmesi yoluyla oluşturulan 1858 tarihli Osmanlı Ceza Kanunu vaka olarak incelenmiştir. Tezde, modern Osmanlı/Türk ceza hukukunu şekillendiren ve çeviribilim alanından bir araştırmacı tarafından incelenmemiş olan Kanun bağlamında, `çeviri yoluyla kanun yapma' olgusunun çeviribilim içine dâhil edilmesi ve çeviribilim çerçevesinde geliştirilen yöntem ve yaklaşımlar aracılığı ile ele alınması gerekliliğini ortaya koymak ve çeviri üst söyleminin önemli konularından biri olan özgün-çeviri ilişkisi/karşıtlığını 1858 tarihli Osmanlı Ceza Kanunu vakası özelinde yeniden düşünmek amaçlanmıştır.Özgün-çeviri ikili karşıtlığı başta olmak üzere, çeviri üst söylemine ait ikili karşıtlıkların, teze konu olan vakada nasıl tezahür ettiği; 1858 tarihli Osmanlı Ceza Kanunu ile 1810 tarihli Fransız Ceza Kanunu arasında nasıl bir çeviri ve eşdeğerlik ilişkisi olduğu; 1858 tarihli Osmanlı Ceza Kanunu'un içinde üretildiği tarihsel koşulların, metnin oluşturulmasında kullanılan çeviri stratejilerini nasıl şekillendirdiği sorularına cevaplar aranmıştır.1858 tarihli Osmanlı Ceza Kanunu metninin betimleyici çözümleme yöntemi kullanılarak 1810 tarihli Fransız Ceza Kanunu metni ile karşılaştırılması, bu Kanun'un çeviri yoluyla oluşturulmasında birden fazla çeviri stratejisinin izlendiğini, 1810 tarihli Fransız Ceza Kanunu'nun farklı bölümlerinin farklı stratejilerle, ancak belli bir düzenlilik yaratacak şekilde çevrilmiş olduğunu göstermiştir. Kanunların, suç ayrımı açısından karşılaştırılması, 1810 tarihli Kanun'da bulunan suç ayrımının 1858 tarihli Kanun'a aynen aktarıldığını, suç-ceza denkleminin ise değiştirilerek alındığını ve cezaların sistemli biçimde hafifletildiğini ortaya koymuştur. Kanunların ceza tanımları, cezaların infazı ve dönüştürülmesi konularına ilişkin maddelerinin karşılaştırılması, Kanunlar arasında yeterlik kutbu ile kabul edilebilirlik kutbu arasında konumlanan bir eşdeğerlik ilişkisi bulunduğunu göstermiştir. Devletin iç ve dış güvenliğine karşı suçlar ve ilgili cezalar açısından yapılan karşılaştırma, Kanunlar arasında yeterlik kutbuna yaklaşan bir eşdeğerlik ilişkisi bulunduğunu; şahıslara karşı suçlar ve ilgili cezalara ilişkin karşılaştırma ise Kanunlar arasında kabul edilebilirlik kutbuna yaklaşan bir eşdeğerlik ilişkisi bulunduğunu göstermiştir.Kanun metinlerinin karşılaştırılmasından çıkan sonuçlar, İslam hukuku ile örfi-sultani hukuktan oluşan mevcut Osmanlı hukuk dizgesinin, Osmanlı batılılaşması ile özdeşleştirilen Tanzimat Dönemi'nde geçirdiği dönüşüm bağlamında değerlendirilmiş; 1858 tarihli Osmanlı Ceza Kanunu'nun üretilmesi sırasında alınan çeviri kararlarının, rastgele değil, bilinçli şekilde alındığı ortaya konmuştur. Kanunlar arasında, şahıslara karşı suçlar bölümünde görülen, kabul edilebilirlik kutbuna yaklaşan eşdeğerlik ilişkisi, bütün suç ve cezaları batılı bir kanuna göre tanımlamaya çalışan doğulu bir kanunun, şer'i hukuk ağırlıklı mevcut hukuk dizgesinden bir anda kopamamasının sonucu olarak değerlendirilmiştir. Devlete karşı suçlar bölümünde gözlemlenen, yeterlik kutbuna yaklaştığı belirlenen eşdeğerlik ilişkisi ise Osmanlının modern, merkezi bir devlete dönüşme amacıyla hukuka yüklediği işlevin yansıması olarak değerlendirilmiş, 1858 tarihli Kanun'un, bu amaç doğrultusunda, mevcut Osmanlı hukuk dizgesindeki boşluğu doldurmak üzere kullanıldığı ve Osmanlı-Türk `hukuk çoğuldizgesi' içinde oluşan `çeviri hukuk' dizgesine ait olduğu ileri sürülmüştür.Ulaşılan bulgular ışığında, 1858 tarihli Osmanlı Ceza Kanunu'nun, kaynak ve sadakat odaklı geleneksel çeviri yaklaşımının ikili karşıtlıkları ile açıklanamayacak bir çeviri olduğu görüşü ortaya konmuştur. Bu durum da çeviri yoluyla yapılmış herhangi bir kanunun, çeviri olsa bile, erek-dizgede çeviri olmak/çeviri olarak sunulmak ve algılanmak üzere üretilmemiş bir çeviri olmasından kaynaklanmaktadır. Dolayısıyla, özgün-çeviri ikili karşıtlığının, `çeviri yoluyla kanun yapma' olgusunda geçersiz hale geldiği; çeviri yoluyla yapılan bir kanunun, erek dizgede hukukun kendisi olması itibariyle, aynı anda hem özgün hem de çeviri olduğu savunulmuştur."
