abstract: "V ÖZET YÜKSEK LİSANS TEZİ NÜZUL VE VÜRÛD SEBEPLERİNİN AHKÂM'A ETKİSİ Zeki KOÇAK DANIŞMAN: Prof. Dr. Hamza AKTAN 1997. s.259 Jüri: Prof. Dr. Hamza AKTAN İslâm hukukunun ve hukuk ilminin tarihî oluş seyrinin tetkikine yönelik olan çalışmamızın amacı, hukukî hükümlerin doğuşunda ve gelişiminde etkili olan sosyal realitenin yönlendiriciliğini ortaya koymaktır. Bu bağlamda İslâm hukukunun temel metinleri olan âyet ve hadislerin buyruluş niteliklerini, pozisyonlarını ve değerlendirmelerini kavrayarak, vaz etmiş oldukları umumi prensiplerin çağımızdaki hususi problemlere nasıl yansıtılacağını yorumlamaya çalıştık. Konumuz, hukukun-teorik ve pratik bütün yönlerini kapsayacak bir karakterde olmasına rağmen, biz daha ziyade metodolojik bir yaklaşımı esas aldık. Fakat, tez bütünlüğü içerisinde yeri geldikçe pozitif örneklerle bakış açısı sunmaya yöneldik. Hukukun olgusal vasfı dikkate alındığında, esbâb-ı nüzul ve esbâb-ı vürûdun, hukukî olayları yorumlamadaki değeri ortaya çıkarken, bu işlemin yapılabilmesi için başta hukuk ve tarih ilmi olmak üzere, diğer bütün sosyal disiplinlerden faydalanmanın gerekliliği anlaşılmıştır."
