abstract: "Çalışma 3 bölümden oluşmaktadır; Birinci bölümde; oruç kavramı açıklanmış, orucun mahyeti, tarihi, çeşitleri, mezheplerin oruç tutma ve oruçlu kişi ile ilgili görüşleri gibi oruç ile ilgili genel bilgilere yer verilmiştir. İkinci bölümde; Kütüb-ı Sitte'de(Bûhari, Müslim, Tirmizî, Ebû Dâvûd, İbn Mâce ve Nesâî) yer alan oruçlu kişi (صائم و الصائم kavramları çerçevesinde) ile ilgili rivayetler tespit edilmiş ve bu rivayetler Türkçe manalarıyla beraber verilmiştir. Tespit edilen rivayetlerin önce sened tenkidi yapılmış, sonra rivayetlerin genel bir değerlendirmesine yer verilmiştir. Üçüncü bölümde ise, söz konusu rivayetlerin, metinlerinin değerlendirmesi yapılmıştır. En son olarak da genel bir sonuç değerlendirmesi yapılmıştır."
