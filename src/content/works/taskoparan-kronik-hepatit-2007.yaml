abstract: "İnterferon (INF) tedavisinin çesitli kardiyak yan etkilere yol açtığı gösterilmistir. INF tedavisi sırasında arteryel kan basıncı değerlerinde yükselmeler beklenebilir. Bu çalısmada, peginterferon-alfa 2b ve ribavirin tedavisinin kan basıncı (KB) üzerine olan artırıcı etkilerini ve KB ile iliskili olabilecek insülin direnci de dahil kardiyovasküler risk parametrelerinin incelenmesi amaçlandı. Çalısmaya 29 kronik hepatit C'li (KHC) hasta (16 kadın, 13 erkek; median yas: 56,5 yıl)alındı. Tedavi öncesi, tedavinin birinci haftası ve sekizinci haftası sonunda olmak üzere 24- saat ambulatuvar KB monitorizasyonu kayıtları alındı. Tedavinin sekizinci haftasında; lipit profili,insülin direnci (ĐR), vücut kitle indeksi (BMI), tam kan sayımı, transaminazlar yeniden değerlendirildi. ĐR için HOMA-IR metodu kullanıldı. Hipertansif hastalar takip boyunca kullanmakta oldukları anti hipertansif ilaçlara devam ettiler. Tedavi öncesinde 15 hasta hipertansif, 14 hasta normotansif idi. Hastaların tümünde birinci hafta ve sekizinci hafta ölçülen gündüz, gece, ortalama, sistolik ve diyastolik KB değerleriile bazal değerler arasında anlamlı farklılık saptanmadı. Hipertansif hasta grubunda tedavi öncesi, tedavinin birinci haftası ve sekizinci haftası median (minimum-maksimum) sistolik KB ((sırasıyla, 134 (119-150), 133 (104-169), 132 (109-145) mmHg p= 0.07)) ve median diyastolik KB'da ((sırasıyla, 78 (70-96), 79 (57-92), 79 (58-89) mmHg p= 0.25)) anlamlı farklılık gözlenmedi. Tedavinin sekizinci hafta kontrolünde BMĐ, total kolesterol, LDL, HDL, hemoglobin, lökosit, trombosit, AST ve ALT düzeylerinde istatistiksel anlamlı düşüş saptandı (p<0,05). Serum trigliserid düzeyinde anlamlı yükselme (p < 0,0001), HOMA-IR'da ise istatistiki anlama ulasmayan azalma (p= 0,07) gözlendi. Sonuç olarak peginterferon-alfa 2b ve ribavirin tedavisinin kronik hepatit C'li normotansif ve hipertansif hastalarda erken dönemde anlamlı KB yükselmesine neden olmadığı ve bu tedavinin insülin direncinde değisikliğe yol açmadığı saptandı."
