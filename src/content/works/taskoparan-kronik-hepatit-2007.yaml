title: "Kronik Hepatit C'li Hastalarda Peginterferon ve Ribavirin Tedavisinin Kan Basıncı ve İnsülin Direnci Üzerine Erken Etkisi"
titleTranslation: {"en": "Early effect of peginterferon plus ribavirin treatment on blood pressure and insulin resistance in patients with chronic hepatitis C"}
