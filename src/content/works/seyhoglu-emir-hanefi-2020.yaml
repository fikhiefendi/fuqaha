abstract: "Tez üç bölümden, sonu, içindekiler bölümlerinden oluşmaktadır. Birinci bölüm konuya ilişkin başlangıçlar, giriş, bu araştırmanın önemiyle ilgili, seçilme nedeni, araştırma mekanizması. İkinci bölüm daha çok kitabın yazarı İbn Emir El-Haj El-Hanefi ile ilgili, kitabın tanıtımı. Üçüncü bölüm ise kitabın tahkiki içermektedir. Son sözde en önemli sonuçlar ve tavsiyeler yazılmıştır. İçindekiler bölümünde kaynakları, referansları, araştırma içerikleri, bayrakları, ülkeleri listelemesini yaptım. Vardığım kanata göre ve bu kitabın en titiz İslami vakfı detaylarını içermesinden genel İslam iktisadı ve özel olarak İslami vakfı okumak isteyenlere en önemli kaynaklardan biridir araştırmacı İslam iktisadı ile ilgili olan mahdutları toplanması önemle vurguluyor çünkü bu mahdutlar İslam iktisadı için bir direk olarak sayılıyor."
