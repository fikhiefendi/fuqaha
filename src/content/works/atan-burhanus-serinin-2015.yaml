abstract: "Çalışmamızın konusu, hicrî VII. yüzyıl Hanefî fakihlerinden Burhânüşşerîa'nın \"Vikâyetü'r-rivâye fî mesâili'l-Hidâye\" adlı eserinin tahkîk ve tahlilidir. Vikâye, Merğinânî'nin el-Hidâye'sindeki meselelerin derlenmesiyle oluşturulan muhtasar bir metindir. Çoğu hicrî VII. yüzyılda kaleme alınan ve \"mütûn\" (metinler) diye de ifade edilen muhtasarlardan biri olan bu eserin, Hanefî literatüründe önemli bir yeri vardır. Üç metin (mutûn-i selâse), dört metin (mutûn-i erba'a) ve altı metin (mutûn-i sitte) şeklinde gruplandırılan bu metinlerin tümünde Vikâye bulunmaktadır. Osmanlı ve diğer coğrafyalarda uzun süre fetva kaynağı olan ve ders kitabı olarak okutulan Vikâye, söz konusu metinler arasında -şerh, hâşiye, ta'lîk, ihtisâr, risâle, reddiye ve tercüme olarak- üzerinde en çok çalışma yapılan eserlerdendir. Kütüphanelerde yazma halde bulunan Vikâye'den yararlanmak, onu incelemek ve ona diğer muteber metinlerle mukayeseye giderek analizler yapmak gayesiyle hazırlanan bu tez, iki ana kısımdan oluşmaktadır. Birinci kısım, eserin tahlili ile ilgilidir. Üç bölümden oluşan bu kısımda; birinci bölümde, müellifin yaşadığı dönemin siyasî ve ilmî durumu, hayatı, Vikâye adlı eseri ve bunun Hanefî literatüründeki yeri incelenmiş ve kendisine nispet edilen eserler hakkında bilgiler verilmiştir. Ayrıca genel olarak Hanefî literatüründe muhtasarlar ve metinlerle ilgili bilgiler aktarılarak Vikâye'nin bunların arasındaki yeri belirtilmiştir. İkinci bölümde, Vikâye'nin şekil ve muhteva özellikleri üzerinde durulmuştur. Üçüncü bölümde de, özellikle el-Hidâye başta olmak üzere diğer temel metinlerle mukayese edilerek tahlillerde bulunulmuştur. Arapça olan ikinci kısımda ise, Vikâye'nin kronolojik olarak en eski nüshaları tespit edilip bunlar temel alınarak eserin tahkîki gerçekleştirilmiştir. ANAHTAR SÖZCÜKLER: Vikâye, Burhânüşşerîa, Mütûn, Hanefîlik, Fıkıh."
