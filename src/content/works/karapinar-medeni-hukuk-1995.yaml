abstract: "ÖZET Yüsek Lisans Tezi MEDENİ HUKUK VE İSLAM HUKUKU'NDA KADININ BOŞANMA HAKKI (MUKAYESELİ) Halil KARAPINAR Danışman: Prof. Dr. Hamza AKTAN 1995, sayfa: 1Z3 Jüri: Prof. Dr. Hamza AKTAN Medeni Hukuk'ta boşama hakkı, ne kadına ne de kocaya verilmemiş, bu hakime tanınmıştır. Hakim, bütün şartları göz önünde bulundurarak boşanmak isteyen karı-kocanın davasını ya olumlu ya da olumsuz olarak karara bağlayacaktır. İslam Hukuku'nda ise karısını boşamak isteyen kocaya (boşama neticesinde karşı karşıya kalcağı olayları hatırlatarak) bu hak kocaya verilmiştir. Buna mukabil kocasından boşanmak isteyen kadına da şartlar vukubulduğunda hakime müracaat etme hakkı tanınmıştır. Bu isteği değerlendiren hakim boşanma davasını olay doğrultusunda olumlu ya da olumsuz karara bağlayacaktır."
