abstract: "Genel hukuk literatürü içerisinde özgün bir yapıya sahip olan slâm hukukmetodolojisi (usÃ»l-i fıkıh), slâm hukukunun (fıkhın) önemli konularından biri olan emirve nehiy konusunu ayrıntılarıyla incelemektedir. Zira emir ve nehiy konusu, fıkhınkısımları olan ibadet, muamelat ve ukubat (ceza hukuku) konuları ile yakından ilgilidir.Bu nedenle, slam hukuku geleneğinde önemli bir yere sahip olan mam Serahsû, otuzciltlik meşhur el-MebsÃ»t'unu imlâ ettirdikten sonra, bu eserde ele aldığı fer'û meselelereait konulara temel teşkil etmesi için telif ettirdiği el-UsÃ»l adlı eserinde, emir ve nehiykonusunu farklı görüşlere de yer vererek ele almıştır. Dolayısıyla, ? slâm HukukMetodolojisinde mam Serahsû'ye Göre Emir ve Nehiy? adlı tezimizde sözü edilenkonunun, bu kaynak eserde ne şekilde ele alınıp, hangi esaslar çerçevesindetemellendirildiği incelenmiştir.Danışman: Prof. Dr. Y. Vehbi YAVUZ Sayfa Sayısı: 127"
