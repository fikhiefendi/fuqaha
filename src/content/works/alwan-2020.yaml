abstract: "Şer'î hükümlerin bilinmesi ve anlaşılması Yüce Allah'ın topluma farz kıldığı hususlardandır. Bu bilginin bireyler tarafından elde edilmesi ise işin ehli olan müftülerden fetva istenmesi ve onların da fetva vermesiyle gerçekleşir. Yüce Allah İslam ümmetine rabbânî âlimler ihsan etti. Bu niteliklere haiz alimler her devirde insanların yolunu aydınlattı ve halef selefini aratmadı. Bu rabbânî âlimler her nesilde Allah'ın dinini aşırılık yanlısı fanatiklerin tahrifatından, bâtıl ehlinin sahtekârlıklarından ve câhillerin keyfî yorumlarından korudular. İnsanların anlamakta zorlandıkları hususları açıkladılar, tartışmalı konular ile ilk kez karşılaşılan meseleler hakkında fetvalar verdiler. Âlimlerimiz yeni meseleler, gelişen olaylar ve diğer hususlarda fetva vermek isteyen kimselerin verdikleri fetvaların isabetli olması için uymaları gereken kural ve kaidelerle, izlemeleri gereken yol ve yöntemleri ortaya koymuşlardır. Fetvâ işinin önemi ve denetim altında olma zorunluluğu nedeniyle müftînin, şer'î hükümleri doğru biçimde anlamasını sağlayacak; onu, bu hükümlerin istinbat usul ve teknikleri ile tikel meselelere ve vakıalara uygulanması konularında ehil kılacak bazı şartlara haiz olması gerekir. Ancak bu şekilde, ehil olmayan kimselerin fetva müessesesini itibarsızlaştırmasının önü alınabilir. Diğer yandan yeni meselelerde fetva verme hususunda müftînin bir disiplin içerisinde uyması gereken kural ve kaidelerin yanı sıra, onu şaz fetvalar vermeye sevk edebilecek ve kaçınması gerekli bazı vesîlelerin varlığını da açıkladık. Meçhul, yani ehliyeti hususunda kesin bilgi sahibi olunmayan kimseden fetva alınması, Selef-i Sâlihîn'in izlemiş olduğu ve bize rehberlik ettiği yollardan birisi değildir. Günümüzde yaygınlaşan radyo ve televizyon kanalları ile diğer modern iletişim araçları kullanılarak fetva istenmesi ve verilmesi sürecinde hem fetva isteyenin hem de müftünün bağlı olacağı bir disiplin olmalıdır. İşte biz bu tezimizde radyo ve televizyon istasyonları ile diğer modern iletişim araçları kanalıyla gerçekleştirilen fetva isteme, verme sürecinde karşılaşılan sorunları irdeleyerek bu sorunlara çözüm önerileri sunduk. Bunu yaparken, bu süreçlerdeki fetva sorunlarının ve şaz fetvanın nedenlerinin ortaya konulması maksadıyla Müftü'nün şartlarını konuştuk araştırmamızı müftîü ile ilgili olumsuz hususlar üzerinde yoğunlaştırdık. Çünkü fetva makamında olan veya o makama konulan kimilerinin yanlışlarının ve olumsuz özelliklerinin bilinip anlaşılmasının fetva konusundaki sorunların çözümüne kapı aralayacağını düşünüyoruz."
