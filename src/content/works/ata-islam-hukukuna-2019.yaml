abstract: "Erkek ve kadının birbirlerine karşı beslediği hisler sünnetullah gereğidir. İslam dini ise bu duyguların tatmin edilmesi için sünnete uygun olarak birtakım şartları taşımak ve riayet etmek suretiyle evliliği emretmiş ve bunun dışındaki meyilleri yasaklamıştır. Mehir başta olmak üzere nikah akdi ile tarafların hukuku korunarak güven altına alınmıştır. Gayesi, şuurlu ve nitelikli nesillerin yetişeceği huzurlu bir aile kurmak olan evlilik kurumu, hastalık, geçimsizlik, münaferet, eşlerin biribirine muhabbet duymaması, anlaşamama gibi eşlerden kaynaklanan engeller, evliliğin asıl gayesinden uzaklaşıp ihtiyaç ve zaruri hallerde evliliğin sonlanmasına neden olmaktadır. Bu doğrultuda evliliğe, erkek tarafından doğrudan veya boşanma hakkını elinde tutan kadın tarafından, hakim veya hakem kararıyla son verilebilir. Bununla beraber erkek, evlilikte olduğu gibi iddet süresi içinde de kadının nafakasını ödemekle sorumlu tutulmuş ve boşanmanın güzel bir şekilde, tarafların birbirini kırmadan gerçekleşmesi emredilmiştir. Kendisinden kaynaklanmayan sebeplerle boşanılan kadının yaşadığ üzüntü ve eleme karşılık mut'a verilmesi tavsiye edilmiştir. Biz de her ne kadar İslam fıkıhı içinde maddimanevi tazminat olarak isimlendirilmese de çalışmamızda alametlerini ortaya koymaya çalışacağız"
