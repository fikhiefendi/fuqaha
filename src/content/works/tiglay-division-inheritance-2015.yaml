abstract: "Thomas Piketty'nin araştırmalarından yakın zamanda gelen bulguların ışığında, kuşaklar arası para transferinin sermaye birikimi için önemi son on yılda daha çok vurgulanmıştır. Araştırma eksikliğinden dolayı, Osmanlı İmparatorluğu'nda miras yoluyla kalan paranın payı belirsiz kalmıştır. Bu konuya ışık tutmak için bu tez, tereke defterlerine dayanarak Osmanlı Bursa'sında arada 20 yıl boşluk olmak üzere 1700'den 1840'a kadar herbiri 20 yıldan oluşan ardışık dört dönem içindeki miras paylaşımını izlemeyi amaçlamaktadır. Şeriyat'taki önceden belirlenmiş varis listesine rağmen bu tez teoriyi pratikten ayırmayı ve belirtilen dönemde gerçek varis sayısını ve türünü tespit etmeyi hedeflemektedir. Beş farklı servet grubunun toplam varis sayılarını hesaplamanın yanı sıra, bu konu altında çalışılan İslam hukukunda belirtilen birincil varis listesinden yola çıkarak, her bir servet grubu için miras üzerinde birincil ve daha büyük hak iddia eden varis sayısına ait veriler de analiz edilmektedir. Timur Kuran'ın Osmanlı İmparatorluğu'nda Şeriyat'ın eşitlikçi miras dağılımı öne sürülerek sermaye birikimi eksikliği üzerine kurulan argümanının tersine, bu tezin bulguları varis sayısında dönemler ve özellikle varlıklı gruplar arasında, daha fazla servet birikimini ima eden, aşamalı bir daralmayı işaret etmektedir. Her ne kadar kuşaklar arası sermaye birikiminin diğer şehirlerde de çalışılması gerekse de, bu tezin bulguları Şeriyat'ın pratik sonuçlarını yorumlamak ve Bursa'daki servet birikimini betimlemek açısından önem taşımaktadır."
