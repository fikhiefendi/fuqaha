abstract: "“Vehhâbîlikte Bid'at Anlayışı ve Bazı Fıkhı Uygulamalarda Bid'at İddiaları”adlı bu çalışmada, Vehhâbîliğin ortaya çıkışını, Muhammed b. Abdülvehhâb'ın hayatını ve kendisinin ve takipcilerinin bid'at anlayışlarını ve bazı bid'at olarak gördükleri konuları işledik. Konuyu çalışırken birincil ve ikincil kaynakları taradık. Verileri toplayarak analiz ettik ve Kur'ân, Sünnet ve sahabe uygulamaları ışığında değerlendirdik. Bu değerlendirmede, müçtehit imamların ve fakihlerin görüşlerine de işaret ettik. Terâvîh namazı, ikindi, yatsı ve cuma namazlarının ilk sünnetleri ve Zikri tesbih veya herhangi bir vasıta ile çekmek gibi konuları inceledik. Bid'atin sözlük ve terim anlamlarına ve arasındaki farklara işaret ettik. İslâmi ilimlerde bid'at kavramının hangi anlamlarda kullanıldığını tespit ettik. Hadislerde geçen bid'at kelimesinin anlamını ve bu bağlamda Hz. Peygamber (s.a.v.) ve sahabe dönemlerinde her yeni uygulamaya bid'at denilmediği ve bir aslı bulunmayıp Kur'ân ve Sünnete aykırı uygulamaların bid'at olarak görüldüğü hususunu ortaya koyduk. Tezimizi oluşturan meselelerin asılları bulunduğu için bunların bid'at olarak değerlendirilmelerinin doğru olmadığını gördük."
