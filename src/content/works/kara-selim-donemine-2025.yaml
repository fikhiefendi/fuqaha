abstract: "Bir malın mâliki tarafından dinî, içtimaî ve hayrî bir gayeye ebediyen tahsisi şeklinde tanımlanan vakıf, İslâm coğrafyasında şekillenen medenî hayatın sürdürülmesinde önemli işlevler görmüş, vakıflarla desteklenmiş hayır müesseseleri kamu alanında birçok ictimaî vazifeleri yerine getirmenin yanında cami, medrese, tekke, zâviye, köprü ve yollar gibi eserlerin yapımında ve işleyişinde etkin rol oynamışlardır. Söz konusu hizmetlerin devamlılığı açısından düzenli bir gelir kaynağı oluşturan vakıfların harcamalarını karşılamak için birtakım mallar vakfa devredilmiş; devredilen bu mal ve arazilerin (çiftlikler, tarlalar, bahçeler vs.) tasarruf hakkını alanlar, elde ettikleri gelirlerin bir kısmını vakıf görevlisine teslim ederek devlet hazinesinden gider kaybı yaşanmadan vakıf şartlarına uygun olarak hizmetlerin devam etmesini sağlamışlardır. Muhtelif zamanlarda yapılan tahrirlerle oluşturulan evkâf defterleri, geçmişte vakıf işlemini gerçekleştiren kişiler, vakfedilen araziler ve arazide yetiştirilen ürünler gibi hususlarda önemli bilgiler içerirler. Asıl olarak II. Selim dönemine ait 547 Numaralı Bolu Livası Evkâf Defteri'nin Onikidîvan, Ulus-Amasra ve Yenice kısmının çeviri yazısını içeren bu çalışmada da, geçmişte yörede vakfedilmiş arazileri ortaya koymak ve buna dayanarak vakıfta bulunan kimselerin bölgeyle ilgilerini ve bölgede yetiştirilen ürünleri tespit etmek hedeflenmiştir. Bugün Karabük ve Bartın illeri dâhilinde bulunan bu yerleşim birimlerinde etkili olmuş sultan, bey ve emir gibi siyasî hüviyete haiz kişiler, ilim adamları, şeyh, kadı ve fakihler ile varlıklı ve nüfuzlu mahallî kişilerin tespitiyle bölgenin tarihsel geçmişine dair çıkarımlarda bulunmak ve yörenin geçmişteki üretim kabiliyetini tespit etmek mümkün hâle gelecektir."
