abstract: "Günümüzde menkul kıymet borsalarında birçok farklı finansal işlem gerçekleştirilmektedir. Bunlardan birisi de menkul kıymetlerin açığa satılması işlemidir. Açığa satış işlemi bir finansal ürün olarak fıkhî açıdan tahlile muhtaç çeşitli konular barındırır. Fıkhî açıdan başlıca temel konular; gerek açığa satış işleminin başlangıcında gerekse sonlandırılması aşamalarında rehin bırakılan menkul kıymet veya nakdi gelirden faydalanılması konusu, mülkiyette olmayan menkul kıymetlerin satılması ve bir akit içinde başka bir akdin veya menfaatin şart koşulmasıdır. Bu tezin birinci bölümde açığa satış işlemiyle ilgili kavramlara ve kısaca tespit edilen fıkhî konulara, ikinci bölümde işlemin aşamalar şeklinde uygulanışına, türlerine ve iktisadi açıdan işlemle ilgili ileri sürülen görüşlere, üçüncü bölümde ise tespit edilen fıkhî konuların klasik ve modern kaynaklardaki işlenişi ve bu çerçevede ortaya çıkan görüşler açısından açığa satışın fıkhî tahliline yer verilmiştir."
