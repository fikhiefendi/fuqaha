abstract: "Bu çalışma mehir konusu özelinde Hanefî fürû fıkıh literatürünün tarihi seyrinin incelenmesini konu edinmiştir. Hanefî fürû fıkıh literatürünün tarihi süreçteki değişim ve gelişiminin tespiti ve bu doğrultuda bir değerlendirme yapılması çalışmanın ana hedefidir. Bununla beraber fürû fıkıh eserlerinin çokluğu nedeniyle çalışmanın kapsamında sınırlamaya gidilmiş, el-Asl, Şerhu Muhtasari't-Tahâvî, el-Mebsût, Bedâiu's-sanâi' ve Reddü'l-muhtâr eserleri üzerinden belirli bir konuya yoğunlaşarak inceleme ve değerlendirmeler yapılması tercih edilmiştir. Seçilen eserler daha ziyade mezhebin ana kaynaklarının oluşturulduğu dönemi yansıtmaktadır. Reddü'l-muhtâr ise son dönem ile mukayeseyi sağlamak amacıyla teze dahil edilmiştir. Çalışmamız Hanefî fürû fıkıh geleneğinin istikrarlı ancak bir o kadar da dinamik bir gelişime sahip olduğunu literatür üzerinden ortaya koyması açısından alana katkı sunacak önemli bir çalışmadır. İki ana bölümden oluşan çalışmamızın giriş bölümünde Hanefî fürû literatürü ve mehir meselesi kısaca tanıtılmakta, ardından birinci ve ikinci bölümlerde mehrin fürû fıkıh eserlerindeki yeri ve kapsamı ile mehir konusunun eserlerde ele alınış yöntemleri incelenmektedir. Sonuç olarak elde edilen veriler ışığında fıkhın geleneğe bağlı istikrarlı bir yapı arz etmesinin yanı sıra dinamik bir seyre sahip olduğu görülmüştür."
