abstract: "İslam'ın hukuki yönünü araştıran ve normların konulma gayelerini temellendiren ilim dalı İslam hukuk felsefesidir. Bu ilim dalı önceleri klasik fıkıh usulü ilminin bir kısmını oluşturuyordu; Şatıbi'nin etkisiyle fıkıh usulünden ayrılarak müstakil bir ilim dalı altında incelenmeye başlandı. Şâtıbi, bu ilmi müstakil bir eserde ele alıp konuyu bütün yönleriyle işlemiştir. Fakat o makasıdı, fıkıh usulüne alternatif değil yardımcı ve tamamlayıcı bir ilim olduğunu kabul etmiştir. Şâtıbi 'den sonra İbn Âşûr Makâsıdu'ş-Şerîati'l-İslamiye eserini kaleme almış ve makâsıdı fıkıh usulünden ayrı bir ilim dalı olarak kabul etmiştir. Makâsıdı her fakîhin bilmesi gerektiğini, avamın ise bilmesine gerek olmadığını belirtmiştir. O, makâsıd fikrini geliştirmiş ve fıkıh usulü ilmine alternatif kabul etmiştir. Ona göre usul ilmi dinin gayelerini bilme noktasında bir fayda sağlamamaktadır. Çünkü usul ilmi, naslardan çıkarılan normların belirlenmesi için gerekli olan lafız, tearuz ve tercih bahsini ve istinbat yollarını açıklayan bir ilimdir. Makâsıd ise Şâri'in normları koymadaki hedef, gaye ve hikmetini araştıran bir ilimdir. İbn Âşûr hukukun gayelerini temel alıp tüme varımla gayelerin ortaya konması ve bunlar üzerinden ihtilafın azaltılması gerektiğini söyler. Bu gayelerin kat 'î gayeler olduğunu savunarak makâsıdın usulden ayrı bir ilim dalı olması yönünde çaba gösterir. Bu ilim sayesinde eksik olan gaye merkezli anlayışın kemale ulaşması sağlanır. İbn Âşûr bu eser ile usulcülerin eksik bıraktığı makâsıd açığını kapatmayı hedeflemiştir."
