abstract: "TOK, Ahmet. Türk Hukukunda Katılım Bankalarının Fon Toplama ve Kullandırma slemleri le Klasik Bankacılık slemleri, Yüksek Lisans Tezi, stanbul, 2006. Tezimiz giris ve sonuç bölümü dısında üç bölümden mütesekkildir. lk bölümde; faizsiz bankacılıgın ortaya çıkısı, gelisimi, tarihçesi, varlık nedenleri, prensipleri ve fonksiyonları incelenmis ve dünya'da farklı ülkelerde ne sekilde uygulandıgı irdelenmistir. kinci bölümde; katılım bankalarının fon toplama faaliyetleri, fon kullandırma faaliyetleri ve klasik bankacılık faaliyetleri ile bu faaliyetlerin isleyisi ve yasal altyapısı anlatılmıstır. Türkiye'de faaliyet gösteren katılım bankaları, Özel Cari Hesaplar ve Kar ve Zarara Katılma Hesapları yoluyla fon toplamakta ve bu fonları temel olarak Üretim Destegi Saglanması, Kar ve Zarara Katılma Yatırım Akdi ve Finansal Kiralama yöntemleriyle kullandırmaktadırlar. Üçüncü bölümde; slami bankacılıgın Türkiye'deki uygulaması ile katılım bankaları ile mevduat bankaları arasındaki farklılıklara deginilmistir. Sonuç olarak, üç bölümde incelenen hususların kısa bir özetine yer verilmis ve çalısma nihayete erdirilmistir."
