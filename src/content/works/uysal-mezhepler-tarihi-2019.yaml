abstract: "Mezheplerin oluşumuna psikososyal, politik ve görüş ayrılığı gibi pek çok etken zemin hazırlamıştır. Aynı zamanda dini farklılaşmanın ürünü olan mezhepler içinde geliştikleri ortamın da izlerini taşırlar. Bu durum mezhepler açısından önemlidir. Zira mezhepler, kurucuların ve ilk mensupların görüşleri etrafında şekillenir; geniş bir topluluk tarafından sahiplenildiği ölçüde de varlığını sürdürür. Varlığını sürdüren fakat kendisine akademik düzeyde yeterli ilgi bulamayan bir mezhep olan Neccâriyye bu anlamda dikkatimizi çekmiş ve araştırmamızın konusu olmuştur. Araştırabildiğimiz kadarı ile tezimiz, Neccâriyye mezhebini akademik se-viyede müstakil olarak inceleyen ilk araştırmadır. Bu araştırmada Neccâriyye mez-hebinin müstakil bir mezhep olup olmadığı sorusuna cevap aranmıştır. Bu bağlamda araştırmamızın amacı; ilk dönem İslam dünyasında ortaya çıkan gruplardan Neccâriyye mezhebinin siyasi ve dini ihtilaflara bakışını, düşünce ve görüşlerini yan-sıtmak olmuştur. Neccâriyye mezhebinin lideri Hüseyin b. Muhammed en-Neccâr'ın hayatı, şahsiyeti, görüşleri ve etkileşim içinde olduğu isimler araştırılmıştır. Neccâriyye mezhebinin teşekkül süreci, alt grupları, iman, kader, sıfatlar, halku'l-Kur'ân, ru'yetullah gibi konulardaki görüşleri diğer mezheplerle mukayeseli şekilde tahlil edilmiştir. Bu bağlamda mezhebin bazı konularda kendine has, orijinal görüşlere sahip olduğu tespit edilmiştir. Araştırmamızda Mezhepler Tarihi'nin hem hicri II. ve VII. asırlar arası ana ve tali kaynaklarından hem de modern dönem eserlerinden yararlanılmıştır. Sonuç kıs-mında genel bir değerlendirmede bulunulmuştur."
