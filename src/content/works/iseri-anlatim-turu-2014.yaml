abstract: "Şuurlu her insanın ve maksatlı herbir ifadenin elbette bir üslûbu vardır ve olmalıdır. İnsanlığın dünyevî hayatlarını tanzim eden, dünya ve ahiret mutluluklarını temin eden ilâhî kitapların ve onların sonuncusu ve en kapsamlısı olan Kur'ân-ı Kerim'in de elbette kendisine has bir anlatım üslûbu bulunacaktır. Kur'ân-ı Kerim, mevzusuna, muhataplarına ve makamına göre anlatım üslûbunu değiştirir ve çeşitlendirir. Her bir makamda o makama münasip ayrı bir anlatım türü ve üslûbu kullanır. Açıklayıcı, tasvir edici, öğütleyici, kanıtlayıcı, öyküleyici, tartışmacı, temsîlî ve mukayese edici gibi anlatım üslupları vardır. Bunlardan biri olan mukayeseli anlatım üslubu ve Kur'ân'daki mukayeseler önemli bir mevkiye sahiptir. İşte bu çalışmamız iki bölümden oluşmaktadır. Birinci Bölümde anlatımla ilgili kavramlar ve Kur'ân'ın anlatım türleri izah edilmiş ve bu anlatım türlerinden biri olan mukayeseli anlatım türü detaylıca incelenmiştir. İkinci bölümde ise yukarıda ana hatları belirtilen, Kur'ân'daki mukayese türleri konu başlıkları altında âyet veya âyetler grubundan örnekler verilmek suretiyle izah edilmiştir. Kur'ân'daki mukayeseler ana hatlarıyla“Mukayeseye Konu Olanlar Bakımından”ve“Mukayese Tarzı Bakımından”olmak üzere ikiye ayrılır. Mukayeseye konu olanlar da yine kendi içinde“İnanç Gruplarının Birbiriyle Mukayesesi”ve“Fertler Arası Mukayeseler”olmak üzere iki grupta toplanır. Mukayese Tarzı Bakımından yapılan mukayeseler de yine kendi içinde“Doğrudan Yapılmış Mukayeseler”ve“Teşbih ve Temsiller Yoluyla Yapılmış Mukayeseler”olmak üzere iki gruba ayrılır. İçerisinde mukayeselerin yapıldığı her bir âyet veya âyetler grubu bazen pek çok konuyu ihtiva edebilecek kadar kapsamlı ve manâ yüklüdür."
