abstract: "Molla Ahmed en-Nerâkî (1185/1771-1245/1829) Şii Usûli ekolün 19. yy'daki önemli temsilcilerinden birisidir. İran'da Kaçar Hanedanlığının hâkimiyeti döneminde yaşamış olan Molla Ahmed en-Nerâkî iktidara yakınlığı ve İran siyaseti üzerindeki etkisiyle öne çıkmış bir isimdir. Dönemin önemli âlimlerinden ders alan Nerâkî, ulemanın siyaset ve halk tabanı üzerinde etkili olduğu bir dönemde yaşamış olmasından dolayı İran siyasetine yön veren âlimlerden olmuştur. İktidarla yakın temas kuramayan ve sorunlarını yöneticilere iletmekte zorlanan halk, çözümü ulemaya yakınlaşmakta ve onları devletle aralarında bir köprü gibi kullanmakta görmüştür. Bu da ulemanın devlet ve halk arasında önemli bir pozisyonda durmasına, dolayısıyla önemli düzeyde bir güç elde etmesine sebep olmuştur. İşte böyle bir dönemde yaşayan Nerâkî, kendisinden önce sınırlı da olsa görece güçlü olan ulemanın dini olduğu kadar siyasi bir gücünün de olması gerektiği tezini savunmuş ve daha sonra Humeyni döneminde sistematik olarak uygulanacak olan“velayet-i fakih”düşüncesinin temellerini atmıştır. Bu düşünceye göre fakihlerin de siyasi gücü olmalıdır. Hatta doğrudan siyasete müdahil olmalıdırlar. Bu düşünce gaybet döneminin uzamasıyla siyasette etkisini kaybeden Şii ulemaya güç kazandıracaktır. Zira fakih imamın gaybetinde onun temsilcisi konumundadır. İran devleti için ileride bir dönüm noktasını oluşturacak olan bu düşüncenin teorik izleri ilk olarak Nerâkî tarafından“Avâidu'l- Eyyâm”adlı eserinde dile getirilmiştir. Her ne kadar yaşadığı dönemde bu düşünceleri pratik olarak hayata geçmese de İran İslam Cumhuriyeti'nin kurulma sürecinde ve Ayetullah Humeyni'nin İran İslam Cumhuriyeti'nin fikri ve siyasi duruşunu meydana getirmesinde önemli etkiler barındırmaktadır. Yaşadığı dönemde de hükümdar Feth Ali Şah üzerindeki etkisi ve Ruslara karşı verdiği cihad fetvası göz önünde bulundurulursa Nerâkî ve diğer ulemanın günümüz mollalarına ne denli güç kazandırdığı görülebilir. Bu çalışmayı hazırlarken ana kaynak olarak kullanılan“Avâidu'l-Eyyâm”eseri Nerâkî'nin velayet-i fakih anlayışını doğrudan yansıtmaktadır. Bu teori doğrultusunda İmamiyye Şiası'nın siyasi düşüncesinin gelişimi takip edilmeye, günümüz İran'ına ve Şii mezhebine yeni bir yön veren bu anlayışın ilk nüveleri tahlil edilmeye, Şii ulemanın fıkhi-siyasi gücü ortaya konulmaya çalışılmıştır."
