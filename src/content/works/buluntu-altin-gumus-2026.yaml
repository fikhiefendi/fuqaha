abstract: "Altın ve gümüş, tarih boyunca hem iktisadî bir değer ölçütü hem de estetik bir unsur olarak bireysel ve toplumsal hayatta önemli bir yer edinmiştir. İslâm fıkhı, bu madenlerin kullanımını sosyal adalet, ahlaki denge ve iktisadî işlevleri çerçevesinde ele almıştır. Bu çalışma, altın ve gümüşün klasik kullanım alanlarının yanı sıra modern dönemde ortaya çıkan gıda, kozmetik ve sağlık alanlarındaki uygulamalarını fikhî kriterler doğrultusunda incelemeyi amaçlamaktadır. Araştırmada nitel yöntemlerden doküman analizi kullanılmış; Kur'ân-ı Kerîm, sünnet, klasik fıkıh eserleri, çağdaş fetvalar ve akademik çalışmalar esas alınmıştır. Çalışmamız Hanefi mezhebinin görüşlerine göre şekil almış olup zaman zaman diğer mezhep görüşlerine de yer verilmiştir. İnceleme sonucunda altın ve gümüş kullanımına dair hükümlerin cinsiyet ayrımı, kullanım amacı, zaruret hali ve ekonomik fonksiyon kriterleri etrafında şekillendiği tespit edilmiştir. Modern dönemde özellikle gıda ve kozmetikte lüks amaçlı kullanımın israf ve gösteriş sınırlarıyla ilişkilendirildiği, sağlık alanındaki uygulamaların ise maslahat ilkesi çerçevesinde değerlendirildiği sonucuna ulaşılmıştır."
