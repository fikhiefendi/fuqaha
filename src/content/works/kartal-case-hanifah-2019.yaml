abstract: "Ebu Hanife İslam dünyasının yetiştirmiş olduğu en etkili mütefekkir alimlerden biridir. Gerek ortaya koymuş olduğu politik mücadelesi gerekse de geliştirmiş olduğu fıkıh sistemi günümüze ışık tutmaya devam etmektedir. Bu çalışmada, Ebu Hanife'nin bilgi, toplum, devlet ve iktidar anlayış ve felsefesi çerçevesinde bir fakih ve ulema olarak iktidar ve emir sahipleri karşısındaki konumu siyasal ve felsefe açıdan ele alınacak ve Ebu Hanife'nin siyaset teorisinin temel kavramlarına bakış açısı analiz edilecektir."
