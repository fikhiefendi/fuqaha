abstract: "İnsanların ihtiyaçlarını karşılayan önemli kurumlardan biri satım (alış veriş) akdidir. Yüce Allah'ın helal kıldığı bir ticaret olan satım akdi, aynı zamanda insanlar arasındaki ticari muâmelelerin en yaygın olanı ve taraflara karşılıklı borç ve hukuki sorumluluklar yükleyen bir sözleşmedir. Satım akdinin hukuk düzeninde varlık kazanması ve kendine bazı sonuçlar bağlanabilmesi için birtakım şartları da taşıması gerekir. Bu şartların amacı,“taraflar arasındaki anlaşmazlıkları önlemek, tarafların karşılıklı menfaatini korumak, aldanma riskini ortadan kaldırmak ve bilinmezliğin yol açabileceği haksızlığı gidermektir”şeklinde sıralanabilir. İslam hukukçuları, akdin rükün, şart ve vasıfları kendisinde toplamasının, akdin sıhhatine (geçerliliğine) delâlet ettiği noktasında ittifak etmişlerdir. İslam Hukukçularının (fakihlerin) ihtilaf ettikleri nokta, satım akdinin geçersizliği noktasında olmuştur. İslam Hukukçularının çoğunluğu (Cumhûr) akitlerdeki geçersizliği yekpâre bir durum olarak görmüşler, akitleri fâsid ve bâtıl diye bir ayrıma tabi tutmamışlardır. Zira onlara göre, eksikliğin akdin esasına ilişkin olup olmaması arasında fark yoktur. Hanefîler ise geçersiz akitleri –çoğunluğun (Cumhûrun) aksine- fâsid ve bâtıl şeklinde bir ayrıma tâbi tutmuşlardır. Hanefîlere göre akitte var olan eksiklik veya bozukluk, akdin aslına (özüne) ilişkin ise akit mutlak hükümsüzlük (butlân) ifade eder ve hiçbir hukuki sonuç doğurmaz. Şayet akitte var olan eksiklik, akdin aslına (özüne) değil, vasfına (sıhhat şartlarına) ilişkin ise akit fesad ifade eder. Zira onlara göre fâsid olmanın zorunlu sonucu, akdin hukuken yokluğu, ya da mutlak hükümsüzlüğü değildir."
