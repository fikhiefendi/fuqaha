abstract: "Tarihi geçmişe ve zengin kültüre sahip olan Kırgız toplumunda aile müessesesi ‎tarihi süreçte kendine özgü çeşitli normlarla düzenlenegelmiştir. İslamiyet'i ‎kabulünden önce (960) örf ve adet oluşturmuş ise de kabulünden sonra İslam ‎hukuku, aile hukukunun düzenlenmesinde geniş bir yer edinmiştir. Sovyetler Birliği ‎döneminde, rejimin gerektirdiği ideoloji sebebiyle sosyalist hukuk uygulanmıştır. ‎Bağımsızlıktan sonra Kıta Avrupa hukuk sistemi benimsenmiş ve uygulanmaya ‎başlanmıştır.‎ Bağımsızlığın ilan edilmesiyle birlikte din özgürlüğünün kabul edilmesi, 70 yıl ‎ateist ideolojisiyle zehirlenen Kırgız toplumu geçmişine, kültürüne, din ve inançlarına ‎geri dönmesini sağlamıştır. Dini susuzluğunu, hayatının bütün alanlarında İslam ‎dininin hükümleriyle yaşamakla gidermeye çalıştı. Neticede İslam dinin hükümlerine ‎olan ilgi her gün artmaktadır. İstatistiksel verilere göre, günümüzde Kırgız toplumun ‎‎%90'ı İslam dinini/inancını kabul edenler oluşturmaktadır. Onların %35'i İslam ‎hukukunu tamamıyla kabul edilmesini, %65'i özel hukuku, özellikle aile hukuku ‎alanında İslam hukukunun yürütülmesini istemektedir.‎ Bu bağlamda yüksek lisans tez çalışmamız, mevzuattaki Kırgız aile hukuku ile ‎İslam aile hukukunu analiz etmek hasebiyle“İslam Aile Hukuku ile Kırgız Aile ‎Hukukunun Mukayesesi”olarak tespit edilerek iki hukuk sistemi mukayese edilmiştir."
