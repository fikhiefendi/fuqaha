abstract: "Hicri 5. ve 6. yüzyıl arasında yaşayan Hanefî fakîhi, imam, kâdı Ebü'l-Feth el-Velvâlicî (ö. 540/1146), bir çok alanda yetkili bir âlim olsa da fıkıh ve fetvâ alanında temayüz etmiş biri olduğunu göstermiştir. Özellikle“el-Fetâvâ'l-Velvâliciyye”isimli eseri zengin bir fıkıh koleksiyonu olarak Belh, Buhara ve Semerkant bölgelerinin fıkıh müktesabatını bir araya toplamıştır ve kendisinden sonraki âlimleri çok fazla etkilemiştir. Elimize ulaşan“el-Fetâvâ'l-Velvâliciyye”isimli eser, Hanefî mezhebi fetvâ ve nevâzil literatürüne önemli katkılar sunmaktadır. Eser, İslam hukukunda yer alan ibadetlerle ilgili fetvalar dahil muamelât, kadâ ve ceza gibi konuları kapsamaktadır. Bu kıymetli eser üzerinde yeterince çalışma yapılmaması sebebiyle biz ibadetlerle ilgili fetvâların incelenmesine geyret ettik ve bir nebze de olsa bu eserin İslam hukuku alanına katkılarını ortaya koymaya çalıştık. Çalışmamız giriş ve üç ana bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu, amacı, yöntemi ve literatür değerlendirmesi ele alındı. Birinci bölümde el-Velvâlicî'nin hayatı, hocaları, öğrencileri, eserleri, ilmi şahsiyeti ve yaşadığı devrin portresi hakkında bilgiler verildi. İkinci bölümde genel olarak fetvanın tanımı, meşruiyeti, şartları, özellikleri ve“el-Fetâvâ'l-Velvâliciyye”isimli eserin hanefî fetva literatürü içerisindeki yeri, yöntemi, kaynakları ve atıfta bulunduğu eserler ele alındı. Üçüncü bölümde ise taharet, namaz, zekât, oruç ve hac ile ilgili fetvâlar usül ve furû kaideleri çerçevesinde incelendi."
