abstract: "Bu Çalışmada, kelam ilmi ile fıkıh usulü arasındaki ilişkinin özel bir yönü aydınlatılmaya çalışılmıştır. Özellikle, fıkıh usulü araştırmacısının, kelam çalışmalarında öğrendiği ve incelediği kelami araçlar ve öncüllerden nasıl etkilendiği ele alınmıştır. Çalışma, kelam âlimlerinin“genel meseleler”(el-umûru'l-âmme) başlığı altında inceledikleri mahiyet konularını merkeze almıştır. Araştırma, bir âlimin belirli bir bilim dalında uzmanlaşırken ve çalışırken farklı bilimlere bakışının önemini vurgulamıştır. Özellikle tercih ve istidlal konularında bu iki bilim dalı arasındaki güçlü bağlantıya dikkat çekilmiştir. Çalışma, bu ilişkiden hareketle, mahiyet konusu ile has ve âmm kategorileri arasındaki bağlantıyı incelemiş ve aralarındaki ilişkiyi analiz etmiştir. Ayrıca, mahiyet konusundaki kelami yaklaşımı temel alarak, usulcülerin bu meselelerdeki görüşlerinden birini tercih etmenin gerekçelerinden birini ortaya koymuştur."
