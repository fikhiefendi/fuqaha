abstract: "Katılım bankacılığı, geleneksel bankacılık sisteminden farklı olarak İslami prensiplere dayalı bir finansal modeli sunmaktadır. Y ve Z kuşağı, teknolojinin hızlı gelişimi ve dijitalleşmenin etkisiyle finansal hizmetlere erişimde ve kullanımda öne çıkan bir demografik yaş grubudur. Bu araştırma ile Y ve Z kuşaklarının katılım bankacılığı algısının tespit edilmesi amaçlanmıştır. Katılım bankacılığı algısında Y ve Z kuşakları arasındaki ilişkiyi inceleyerek, genç nesillerin katılım bankacılığına yönelik tutumlarını, bilgi düzeylerini, güven seviyelerini ve tercih sebeplerinin araştırılması hedef olarak belirlenmiştir. Çalışmada veri toplama aracı olarak anket yöntemi kullanılmıştır. Ankette 600 katılımcı yer almıştır. SPSS programı ile frekans analizi, faktör analizi, güvenirlik analizi, ANOVA analizi, tukey testi, t testi, korelasyon ve regresyon analizi elde edilen verilere uygulanmıştır. Analiz sonucunda elde edilen bulgular, katılım bankacılığına yönelik algıların bu kuşaklar arasında çeşitlilik gösterdiği bulgusuna ulaşılmıştır."
