abstract: "Mustafa Ahmed ez-Zerkâ' 1325/1907 yılında Suriye'nin Halep şehrinde doğdu. Dinî ilimleri aldığı Hüsreviyye Medresesi'nden sonra Fransız mektebine devam etti. Yüksek öğrenimine Dımaşk Üniversitesi'nde başladı. Adı geçen üniversitenin Hukuk ve Edebiyat Fakültelerinden mezun oldu. Üniversite eğitiminden sonra Halep'te bir süre avukatlık yaptı. 1944 yılında Dımaşk Üniversitesi'ne öğretim üyesi olarak tayin edildi ve burada İslâm hukuku dersleri verdi. Emekli olduğu 1966 yılına kadar bu üniversitede çalıştı. 1971-1989 yılları arasında Ürdün Üniversitesi'nde İslâm hukuku dersleri verdi. Ardından 19 Rabi`ulevvel 1420/03 Temmuz 1999 tarihindeki vefatına kadar Suudî Arabistan'ın Riyad şehrinde yaşadı.O İslâm hukukunun tedavi, koruma ve yönlendirme olmak üzere üç görevi olduğunu zikreder. İslâm hukukunun bütün zamanların ve mekanların ihtiyaçlarını karşılayacak niteliklere sahip olduğuna inanır. İctihadı İslâm hukukunun ruhu ve hayat kaynağı olarak görür. Günümüzde şûrâ ictihadının yapılması gerektiğine inanır. Hiçbir mezhebin tek başına İslâm dinini temsil edemeyeceğine inanır. İslâm hukukuyla ilgili konuları ele alırken kolaylaştırma, sedd-i zerâi`, zaruret gibi İslâm hukukçularının tamamı tarafından dikkate alınan ilkelere yer vermiştir. Fıkhî hükümlerin, İslâm dininin genel maksatlarıyla bağlantısını kurarak onları hikmet ve illetleriyle birlikte zikretmesi onun fetva verirken izlediği metodlardandır. Fetvalarını küllî kaidelerle temellendirmesi, soru soranı daha geniş bilgi elde edebileceği kaynağa yönlendirmesi, haram olan hususlarda mubah alternatiflere işaret etmesi ve değişik vesilelerle karşılaştığı arkadaşlarıyla istişare etmesi onun başvurduğu yöntemlerdendir."
