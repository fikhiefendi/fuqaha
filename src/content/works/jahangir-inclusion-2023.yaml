abstract: "Türkçe'de gün olarak bilinen rotating savings and credit association (ROSCA) uygulamaları, bireylerin finansal kaynak temini için başvurduğu uzun geçmişi olan bir tasarruf biçimidir. MÖ 200'den beri, bu kavram dünya çapındaki toplulukların ihtiyaçları doğrultusunda gelişmiştir. Gelişim sürecini takiben, kavram, yirminci yüzyılın son on yılında Türkiye'de farklı bir isim ve doğa ile tanıtılmış ve tasarrufa finans (SBF) olarak adlandırılmıştır. Bu araştırma, önerilen modeller üzerinden ROSCA'nın İslami finans ekosistemi içine dahil edilmesini değerlendirmeyi amaçlamaktadır. Bunun yanında araştırma, bireylerin İslami Finans Okuryazarlığı (IFL) seviyelerini doğru bir şekilde ölçmek için bir IFL ölçeği geliştirir. Ayrıca, finansal olarak savunmasız bireyleri yükselten ve ulusal düzeyde doğal afetlere çözüm sağlayan bir SBF-merkezli Zekat fonu yönetim modeli önermektedir. Bu çalışmada sunulan Mahr (mehir) modeli, kadınların özel finansal haklarını alma sürecini kolaylaştırıcı ve sonunda finansal olarak güçlenmelerini ve aile bağlarının güçlendirici bir katkı yapabilir. Son olarak bu çalışma, nano-girişimciliğe finansal destek sunan, böylece ekonomik büyümeyi artıran ve sürdürülebilir kalkınma hedeflerine katkıda bulunan sürdürülebilir bir finansman modeli önermektedir. Bu tezde önerilen finansal modeller, infak (harcama) ve ta'awun (karşılıklı yardımlaşma) kavramlarıyla işbirliği ve dayanışma kavramlarını merkeze alır."
