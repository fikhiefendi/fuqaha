abstract: "Bireysel finansman, ihtiyaç duyulan fonların sağlanması olarak adlandırılan finansal bir üründür. Ülkemizde 1983 yılında kurulan ilk finans kurumu Albaraka Türk özel finans kurumu 1985 yılında faaliyete başlamıştır. Gelişen faizsiz finans sektörü, insanların islami hassasiyetleri çerçevesinde yeni bir alternatif daha üretmiş ve elbirliği sistemi 1991 yılında araç teslimine başlamıştır. Elbirliği sistemi günümüzde konut finansmanın başını çektiği bir sisteme dönüşmüştür. Ortak yönlere sahip elbirliği ve katılım bankalarının sunduğu bireysel finansman ürünleri olan araç ve konut finansmanı kapsamında müşteri tercihlerinin belli başlı başlıklar halinde farklılık göstermesi kaçınılmaz bir gerçek olmuştur. Çalışmada, Erzincan ilinde faaliyet gösteren elbirliği sistemi müşterilerine yönelik 270 adet anket uygulanmıştır. Sonuç olarak, dindarlık, İslami finans okuryazarlığı ile ELBİSİ müşteri tercihleri arasında ilişkiler saptanmıştır. Dindarlık eğitimi uygulama ve İslami finans okuryazarlığının ELBİSİ müşteri tercihleri tüm boyutları üzerinde pozitif etkisi saptanmıştır. Yalnızca dindarlık uygulama boyutunun pazarlama ve müşteri iletişim yöntemi boyutu üzerinde negatif etkisi saptanmıştır. Son olarak, demografik özelliklerden eğitim ve gelir düzeyinin güven boyutunda, yaş aralığının ise pazarlama ve müşteri iletişim yöntemi boyutunda farklılaştığı diğer tüm demografik ve sosyo – ekonomik özelliklerin ise İslami finans okuryazarlığı boyutlarında farklılaştığı tespit edilmiştir."
