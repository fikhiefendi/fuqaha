abstract: "Bu çalışmada mütûn-i erbaa eserlerinin büyû' bölümlerinin karşılaştırılması konu edilmiştir. Çalışmanın amacı Hanefî mezhebinde itibar görmüş mütûn-i erbaa olarak bilinen eserler arasındaki farklılığı ve daha önce telif edilen eserlerden ne ölçüde etkilendiğinin tespitidir. Çalışmanın Hanefî fürû fıkhının muteber metinlerindeki farklılığı ortaya koyması açısından alana katkı sunacağı kanaatindeyiz. Çalışma iki bölümden oluşmaktadır. İlk bölümde Hanefî mütûn geleneği, mütûn-i erbaa ve müellifleri kısaca ele alınmaktadır. İkinci bölümde ise mütûn-i erbaa eserlerinin büyû' bölümlerinin mukayesesi ve mütûn-i erbaa öncesi eserlerden ne ölçüde etkilendiğine odaklanılmıştır. Sonuç olarak mezhebin muteber eserleri olmasına rağmen mütûn-i erbaa eserleri arasında farklılık bulunduğu ve bazı hususlarda mütûn-i erbaa öncesi eserlerden etkilendiği tespit edilmiştir."
