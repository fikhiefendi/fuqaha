abstract: "Hadis alanında iktisat ve iktisadi düşünce bağlamında özel olarak sermaye ve emek kavramlarının incelendiği çalışmaların az olması nedeniyle bu alanda daha çok bilimsel çalışmaya ihtiyaç duyulmaktadır. Bu çalışmada Hz. Peygamber'in (sas) sünneti ışığında İslâm iktisadının sermaye ve emek kavramlarına bakışı incelenmiş ve bu kavramların Modern iktisat düşüncesinde nasıl anlaşıldığı araştırılarak bu iki düşünce arasında ki benzerlikler ve farklar karşılaştırma yapılarak, ele alınmıştır. Çalışmanın ilk bölümünde, modern iktisatta sermaye ve emek kavramlarının iktisadi açıdan nasıl değerlendirildiğini; batı iktisadi düşüncesinin temelini oluşturan İlk Çağ filizoflarının konuyla ilgili düşüncelerini, Eski Roma ve Orta Çağda ki uygulamaları, süreç içerisinde ortaya çıkan farklılıkları aktararak, Merkantilizm, Fizyokrasi, Sosyalizm ve günümüzde hâkim olan Kapitalist düşünceye kadar incelenmiştir. İslâmî iktisatta ise Kur'an-ı Kerim'den başlayarak, Hz. Peygamber (sas) dönemindeki iktisadi faaliyetler ve uygulamaları ele alınmaktadır. İkinci ve üçüncü bölümlerde ise sermaye ve emek kavramlarını İslâm iktisadı açısından, Kur'an'dan sonra en önemli referans olan Hz. Peygamber'den (sas) gelen rivayetlerle birlikte Müslüman düşünürlerin bu kavramlar konusundaki görüşlerine yer vererek modern iktisatta ve İslâm'da sermaye ve emek kavramlarına yaklaşımın nasıl olduğunu hadisler çerçevesinde karşılaştırmalı olarak değerlendirmektedir."
