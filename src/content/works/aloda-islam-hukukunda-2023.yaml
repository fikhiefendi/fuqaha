abstract: "“İslam Hukukuna Göre Nesep İspatı ve Irak Hukukunda Uygulanması”isimli bu tezde toplumsal hayatla ilgili önemli, fıkhî bir konu ele alınmıştır. Nesebin ispatı veya reddi, miras ve nafaka konusunda bir hak veya ödevi doğurduğu için hangi toplumda olursa olsun sonuçları itibariyle tehlikeli olabilmektedir. İslam şeraiti fakih ve alimlerin içtihatları yoluyla kural ve kayıtlar koyarak neseplerin karışması, hak ihlalleri, zina, kötülük ve ensest ilişkiyi engellemeye; bilinmeyen kimlik ve nesep sorunu sebebiyle ortaya çıkabilecek kötü etkilerini azaltmaya çalışmıştır. Fıkıh ve hukuk alanındaki yasa koyucular, bu kategorideki çocuklar yararına yasalar çıkarmaya, delil olduğu müddetçe çocuğu erkek eşe (babaya) nispet etmeye çalışmışlar, nesebi ispat eden sebepleri genişletmiş, inkar olanaklarını sınırlandırmışlardır. Topluma kazandırmak hedefiyle çocuklara isim, kimlik vererek onların onurunu korumuşlardır. Fıkıh kitaplarındaki konuyla ilgili görüşler toplanırken, nesep ispatı meselesi, nesep ispatının eski ve yeni vasıtalarına ilişkin delilleri sıralanırken ve konu hakkındaki hüküm tespit edilirken betimleyici ve analitik metot kullanılmıştır. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Şeriat, zina, evlat edinme gibi nesebin karışmasına sebep olup, topluma zarar veren hususlarla mücadele etmiştir. Evlat edinme yoluyla oluşacak akrabalık bağını kaldırmış, yerine din kardeşliği bağını getirmiştir. Şeriat nesep ispatı için belli başlı vesileler tespit etmiştir. Sahîh evlilik akdi, fasit evlilik akdi, şüphe ile cinsel ilişki bu vesilelere örnek olarak verilebilir. Irak hukukunda ise fasit nikah, şüpheyle cinsel ilişki, rici, bâin talakla boşama, eşin ölümü ile nesep ispatına dair herhangi bir yasa bulunmamaktadır. Şüphesiz bu durum Irak yasasının bir eksiğidir. İslâm hukuku nesep kanıtlama konusunda yatak birlikteliği, ikrar, şer'î delil gibi yöntemlere dayanmaktadır. Liân ve uygulayanların adil olması şartıyla dna damgalama yolu ve erkeğin kadının kendisinden hamile kalmadığına dair delille ispat edilebilir kesin kanaati ile nesebin reddi sabit olur. Fıkha göre dna damgalama yoluyla nesep inkârı caiz değildir. Nesep inkârı için tek geçerli yol liândır. Irak yargısı ise nesep ispatının bir kısmında fıkıh ilmi ile mutabık kalmış, fıkıhta caiz olmayan başka vesileleri de kabul etmiştir. Yazılı delil, ikrar, sorgulama, şahitlik, yemin, muayene bilirkişi, dna damgalama yolları, Irak hukukuna göre meşru olup, yargı karinesi ile ispat olarak tanımlanır. Çocuğun babaya nispet edilmesinde sahîh evliliğin şart koşulması hususunda Irak yasası, Şâfiî, Mâlikî, Hanbeli, Zâhiriyye ve"
