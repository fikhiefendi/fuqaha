abstract: "İslami finans özellikle son zamanlarda, İslami bankacılık, tekaful, vakıf ve sukuk gibi bir çok alanda hızlı bir büyüme göstermektedir. İslami finans İslam ülkelerinin yanında, Singapur, Güney Kore, Japonya, Avrupa, Avustralya, Brezilya ve Amerika Latin gibi İslami olmayan ülkeleri de kapsayacak şekilde dünyanın dört bir yanından, gittikçe daha fazla farkındalık ve ilgi kazanmaktadır. İslami Finansal Hizmetler Kurulu (IFHK) ve 2016'da Ernst & Young raporuna dayanarak, İslami finans sektörünün 2015 yılına kadar brüt 1,88 trilyon ABD doları değerine ulaştığını belirttimektedir. Üstelik bu sektörün büyüme hızı, düşük enerji fiyatlarının sürmesine, jeopolitik çatışmalara ve ekonomik belirsizliğe rağmen, çift haneli büyüme oranlarını korumuştur. Örneğin, 2017 yılına ait Küresel İslami Finans Raporunda, Aralık 2016'da küresel İslami finansal hizmet sektörünün 2,293 trilyon ABD doları bulduğu raporlanmıştır. El-Qorchi'ye (2005) göre İslami finansa geçiş konusunda üç motivasyon bulunduğu vurgulamaktadır: Şeriat uyumlu ürün ve hizmetlere yönelik güçlü talep, Körfez bölgesindeki petrol zengini uluslardan gelen Şeriat uyumlu yatırım için talep ve ve son olarak Şeriat uyumlu ürün ve hizmetlerin rekabet gücünden etkilenen gayrimüslim yatırımcıların ilgisi. Ayrıca, 1958'den bu yana geliştirilen ve MM Teorisi ile başlayan ve Takas Teorisi (Trade-Off Theory), Finansman Hiyerarşisi Kuramı (Pecking Order Theory), Vekâlet Maliyeti Teorisi (Agency Theory) ve Piyasa Zamanlama Teorisi (Market Timing Theory) ile devam eden çok sayıda sermaye yapısı teorisi vardır. Örnek olarak Takas teorisi, firmaları borcun faizinden faydalanmak için birikmiş karlar ve özkaynak finansmanı yerine, borç finansmanı kullanmaya teşvik etmektedir. Bu teorilerinin her birinin sermaye yapısı kararını yönetmek ve denetlemek için farklı bir yaklaşımı vardır. Bu çalışmanın temel amacı, finansal kriz döneminde sermaye yapısının kurumsal performans üzerindeki etkisini incelemektir. İlk olarak, bu çalışma Şeriat uyumlu şirketlerin (ŞUŞ) sermaye yapısının Şeriat uyumlu olmayan şirketlerden (ŞUOŞ) ne kadar farklı olabileceğini belirlemeyi amaçlamaktadır. Sermaye yapısı üzerinde çok sayıda çalışma yapılmıştır. Bununla birlikte, çalışmaların çoğu sermaye yapısı belirleyicileri, sermaye yapısının finansal performans üzerindeki etkileri, verginin finansal yapıdaki sermaye yapısını ve kısa vadeli borçları nasıl etkilediğine odaklanmıştır. Bu geçmiş çalışmalarda örneklem olarak, finansal kurumlar, küçük ve orta ölçekli işletmeler ve halka açık şirketler kullanmaktadır. Ancak Şeriate Uygun Şirketlerin sermaye yapıları ve sermaye yapısının finansal performans üzerindeki etkisi konusunda az sayıda çalışma vardır. Özellikle ŞUŞ'lerin sermaye yapıları göz önünde bulundurulduğunda, bu şirketlerin kriz döneminde daha avantajlı olmaları beklenmektedir. Ancak ŞUŞ'lerin finansal yapılarının, fiannsal kriz döneminde onlar için nasıl bir avantaj sağladığı bugüne kadar bir araştırma konusu yapılmamıştır. Bu nedenle, araştırma boşluğunu doldurmak için, ŞUŞ'lerin örnek olarak kullanıldığı, finansal kriz sırasında sermaye yapısının finansal performans üzerindekini araştıran bir çalışma yapılması gerektirmektedir. Bildiğimiz kadarıyla, bugüne kadar yapılmış böyle bir ampirik çalışma yoktur. Şeriat uyumlu şirketler (ŞUŞ), finansman faaliyetlerini yürütürken Şeriat ilkelerine, kurallarına, değerlerine ve kısıtlamalarına uymaktadır. ŞUŞ'in tüm Şeriat ilkelerine uyması, ayrıca riba, masyar ve gharar gibi yasaklanmış unsurlardan arındırılmasını sağlamak için, Şeriat Danışma Kurulu (ŞDK) ŞUŞ'lerin faaliyetlerini izlemek üzere kurulur. Bunlara ek olarak İslami endekste listelenmeden önce, tüm şirketler, endeks sağlayıcısı tarafından belirlenen tarama süreci için nitel ve nicel kriterlere uymalıdır. Bu çalışmada kullanılan örneklem, FTSE şeriat küresel sermaye endeksinde yer alan şirketlerden oluşturulmuştur. Bu endeks sağlayıcısı altında, tarama süreci de dahil olmak üzere Şeriat konularının ele alınmasında Yasaar Ltd. tarafsız bir danışmanlık ve lider otorite olarak kabul edilmektedir. Şirketlerin Şeriat uyumlu statüsünü elde edebilmesi için, nicel tarama başlığı altında, uyması gereken bir dizi finansal kriterler de vardır. Haron ve Ibrahim'e (2012) göre, endeks sağlayıcı tarafından belirlenen kriter nedeniyle, ŞUŞ'ler sermaye arttrırımı yoluyla finansmanı tercih etmek durumunda kalmaktadır. Ampirik olarak, özkaynağa dayalı finansmana daha fazla ağırlık veren firmalar, finansal krizler sırasında daha dirençli olma eğilimindedir. Gitman ve Zutter (2012, s.508) sermaye yapısını“firma tarafından tutulan borç ve özkaynak karışımı”olarak tanımlar. Bu tanım doğrultusunda asıl amaç, borç ve özkaynak finansmanını çeşitli bileşimleri ile sermaye yapılarının nasıl optimum hale getirileceğidir. Ayrıca, sermaye yapıları aslında borç sahiplerini borç sahipleri olarak, özkaynakları ise hissedarlar veya hissedarlar olarak temsil etmektedir. O halde ortaya çıkan soru, şeriat ilkeleri uyarınca en uygun sermaye yapısı teorisi hangisidir? Firmaların veya finansal yöneticilerin, şirket performansını en üst düzeye çıkarabilmelerini sağlamak için optimum sermaye yapısını nasıl belirlediğine dair daha önce yapılmış çok sayıda çalışma vardır. Ampirik sonuçlar, kârlılık, büyüme, büyüklük, maddi varlık, vergi, kaldıraç, likidite ve sanayi gibi finansman kararını vermek için firmayı ve finans yöneticisini etkileyen çok sayıda faktöre sahip olduğunu göstermektedir. Bu arada, bu çalışmada, çalışmanın amacına ulaşmak için bazı finansal ölçütlere odaklanılacaktır. Bu örnekte, bu çalışmada kurumsal performans, borç / özsermaye oranı, borç finansman oranı, maddi duranlık oranı, nakit artı hesap alacakları oranı, büyüme oranı ve büyüklük oranı kullanılmıştır. Kurumsal Performans Bu çalışmada, kurumsal performansı ölçmek için iki bağımlı değişken kullanılmıştır. Şirketin kurumsal performansını ölçmek için il olarak vergi ve/veya zekat öncesi karın toplam varlığa olan oranıyla elde edilen ve varlıkların vergi öncesi getirisi (Vergi Öncesi Varlık Getirisi- Pre-tax Return of Asset) denilmektedir. Bu oran, işletmenin varlıklarına yaptığı yatırımdan elde ettiği getiri ile işletmenin etkinliğini ölçer. Diğer bir deyişle, işletmenin varlıklarını gelir veya kârı elde etmek içine ne kadar etkin kullandığını gösterir. Önceki çalışmalarda olduğu gibi şirketin finansal performansını ölçmek için toplam aktifler üzerinden faiz ve vergi öncesi kazanç (faiz ve vergi öncesi kâr) kullanılmıştır. Öncellikle, bu çalışma, şirketin vergi veya zekat veya her ikisini birden ödemesi durumunda, işletmenin kurumsal performansının bundan önemli derecede etkilendiğini göstermeyi amaçlamaktadır. ŞUŞ'lerin Şeriat yönergelerine göre 'zekat' olarak adlandırılan, kâr veya gelirden yüzde 2,5 sabit oranda ödenen özel vergilere tabidir. Ancak, günümüze kadar zekat Müslüman ülkelerin çoğunda hala gönüllü olarak kullanılmaktadır. Bu çalışmadaki örneklem ile ilgili olarak, zekat sistemini uygulayan tek ülke Malezya'dır. Ancak burada da gönüllülük temeline dayanmaktadır ve örneklemdeki şirketlerin hiçbiri mali tablolarında zekat miktarını göstermemektedir. Bu çalışmada, firmanın kurumsal performansını temsil eden ikinci bağımlı değişken, özkaynak karlılığı (ÖKK) oranıdır (Return Of Equity-ROE). Önceki çalışmalara dayanarak, çalışmalarında ÖKK'nı ölçmek için vergi sonrası toplam özsermaye üzerinden net kar kullanılmıştır. Bu nedenle, bu çalışma daha önceki çalışmalarla aynı ölçümü kullanmaya karar verilmiştir. Bu oran, faiz, vergi ve imtiyazlı temettü sonrası net karın kullanılması suretiyle şirketin kârlılığına göre hesaplanır. ÖKK oranı, firmanın olağan hissedarlarına odaklanan ve kazanılan kar ile sermayelerini karşılaştıran ana karlılık oranlarından biridir. Bazı yatırımcılar bu oranı firmanın adi hisse senedinin cazibesini ölçmek için kullanmaktadır. Borç / Varlık Oranı Bazı İslami Finans Endeksleri, örneğin Dow Jones Küresel İslam Endeksi (DJIM) tarafından yapılan nicel gözetimde, finansal kriterlerden biri özkaynak oranıdır. Toplam borç, toplam özkaynağa göre % 33'ten az olmalıdır. Bununla birlikte, bu çalışmanda kullanılan 'FTSE Global Equity Shariah Index' serisi bu oranın gözetim sürecine dahil etmemektedir. Bundan dolayı, bu çalışmada, ŞUŞ'ler ve ŞUOŞ'ler arasında önemli farklılıklar olup olmadığını genel olarak görmek için, bu oranın kullanılmasına karar verilmiştir. Toplam borcun toplam özkaynağa bölünmesiyle bulunan özkaynak oranını, bağımsız bir değişken olarak çalışmada yer almıştır. Margaritis ve Psillaki (2010) ve Memon ve diğerleri, (2012) gibi diğer bazı çalışmalar özkaynak oranı için, aynı ölçümü kullanmışlardır. Bu oran, borç / özkaynak veya tamamen sahip olunan fonlara dayalı şirket finansman derecesini ölçerek, bir şirketin finansal kaldıracını değerlendirmektir. Bu gösterge, şirketin bir finansal sorun yaşaması halinde, özkaynakların şirketteki tüm borçları karşılama kabiliyetini ölçer. Borç Finansmanı FTSE Global Equity Shariah Index nicel gözetimi kapsamında borç oranı, toplam varlıkların yüzde 33'ünden az olmalıdır. Bu çalışmanın amacı nedeniyle, finansal kriz sırasında etkisini daha ayrıntılı görmek amacıyla, borç oranı ikiye ayrılmıştır. Nitekim Fosberg (2013), ABD'de borsada işlem gören şirketler üzerinde bir çalışma yürütmüş ve kısa vadeli borç finansmanının 2006'da yüzde 1,3'ten 2008'de yüzde 2,2'ye yükseldiğini ve bunun 2008'de meydana gelen finansal kriz nedeniyle 34 milyon dolarlık bir artışı temsil ettiğini bulmuştur. 2008 yılında borsada çöktüğünde, kredi arzının sınırlı olmasından dolayı, şirketlerin borçlanma gücünün daha önce olduğundan daha zayıf hale geldiği sayısız çalışma ile desteklenmiştir (bakınız Brealey ve ark., 2008; Almeida ve ark., 2011; Federal Rezerv, 2012; Fosberg, 2013). Bu nedenle, firmalar finansal zorluklar sırasında KVYK finansmanını daha çok kullandılar. Hassan ve Samour (2016) sermaye yapısı finansman kararının finansal kriz sırasında etkili olduğunu açıkça belirtmişlerdir. Cheema ve arkadaşları (2017) ve Shahar ve Shahar (2015), ŞUŞ'lerin uzun vadeli borç finansmanını kısa vadeli borç finansmanından daha fazla kullandığını bulmuşlardır. Bunun nedeni, Şeriat yönergelerine göre sınırlı ilgi ve risk paylaşımının kısıtlanması olabilir. Bununla birlikte, ŞUOŞ'ler, işletme sermayesi ihtiyacını karşılamak için daha fazla KVYK kullanmaktadır. Ancak Sahudin, Ismail, Sulaiman, Rahman ve Jaafar (2019) tarafından yapılan çalışma, ŞUŞ'lerin UVYK'a kıyasla daha fazla KVYK kullandığını buldurmuştur. Malezya'daki ŞUŞ'ler uzun vadeli borcuna kıyasla daha yaygın olarak kısa vadeli borç kullanılmaktadır, çünkü İslami borçlanma araçlarının çoğu uzun vadeli borçtan ziyade kısa vadelidir (Aggarwal ve Yousef, 2000). Bu aynı zamanda, kısa vadeli borç fonksiyonunun, borcu kontrol etme ve acente sorununu azaltma mekanizması olarak haklı kıldığı kurum teorisini de destekler. Bu nedenle, bu çalışma özellikle finansal kriz öncesinde, sırasında ve sonrasında finansman modellerindeki önemli farklılıkları incelemeyi de amaçlamaktadır. Maddi Varlık Oranı Maddi duran varlıklar, bankaların finansal krizden sonra işletmelerin yaşayabilirliğini ölçtükleri için daha popüler hale gelmektedir. Bunun nedeni maddi duran varlıkların maddi olmayan duran varlıklara göre daha fazla likidit olmasıdır. Charalambakis ve Garrett (2012) maddi duran varlıkların firma içindeki sermaye yapısını açıklamada ana nokta olduğunu belirtmiştir. Sonuç olarak, maddi duran varlıklar piyasada daha yüksek değere sahiptir ve firmalar finansal problemleri olsa veya iflas ederse bile, firmalar maddi varlıklarını kolayca ve hızlı bir şekilde satabilmektedirler. Scott (1977) ve Titman ve Wessels (1988), daha az kârlı firmanın maddi duran varlıkların yüksek değerine sahip olma eğiliminde olduğunu ve firmaların maddi duran varlıklarını daha fazla borç almak veya daha fazla borç almak için teminat olarak kullandıklarını belirtmiştir. Bu nedenle, daha yüksek somutluğu olan herhangi bir firma daha fazla borç alacaktır. Bu işletmenin daha fazla borç finansmanı sağlayarak verginin avantajından faydalanması gerektiğini vurgulayan değiş tokuş teorisine uygun şekilde, işletmenin daha fazla kâr elde etmesini sağlar. Ahmad ve Azhar (2015) bunun borcunda temerrüde düşüren işletmelere, iflastan kaçınmak için bu maddi varlığı kullanmaları için bir seçenek oluturduğunu eklediler. Nakit ve Alacak Toplamı Oranı Önceki çalışmaların çoğu, işletmelerin kısa vadeli finansal yükümlülüğünü yerine getirme kabiliyetini ölçmek için likidite oranını kullanmıştır. Thabet ve Hanefah (2014) da çalışmalarında likiditenin işletmelerin kurumsal performansı üzerinde etkili olan faktörlerden biri olduğunu bulmuşlardır. Bu oran, işletmenin aşırı nakit veya nakit eksikliğinden kaçınmak için, nakit ve alacakları için bir limit belirlemek açısından önemlidir. Buna ek olarak, temsil maliyetini de düşürmektedir. Bildiğimiz kadarıyla bu çalışmamızda, nakit ve alacaklar toplamı, toplam varlıklar içindeki yerinin (CashAR) kurumsal performansa etkisini inceleyen ilk çalışmadır. Bu değişken, ŞUŞ için İslami endekste listelenmesi için yerine getirmesi gereken bir ölçüt olduğu için, bu çalışmada bağımsız bir değişken olarak seçilmiştir. Farooq ve Alahkam (2016), İslami esaslara dayanan ekonomi nedeniyle, İslami finansal sistemin daha istikrarlı ve dayanıklı olduğunu çalışmalarıyla desteklemişlerdir. Büyüme Oranı Bu çalışmada, cari yılki satış eksi geçmiş yılki satışların cari yılki satışlara bölünmesi, işletme büyüme oranının bir göstergesi olarak kullanılmıştır. Çalışmalarında büyüme oranı için aynı ölçümü kullanan önceki çalışmalar (Salim ve Yadav, 2012; Bundala, 2012; Proença ve diğerleri, 2014; Cheema ve diğerleri, 2017) bulunmaktadır. Titman & Wessel'e (1988) ve Rajan & Zingales'e (1995) göre, gelecekteki büyümesi yüksek olan firmaların finansman kararlarında daha az kaldıraç kullanıldığını göstermektedir. Çünkü firma borç finansman yerine özkaynakla finansmanı tercih edecektir. Ayrıca, büyüme firmanın karlılığını etkileyecektir. Bu çalışma Güneydoğu Asya'dan Malezya, Endonezya, Vietnam, Singapur ve Tayland gibi seçilmiş ülkelere odaklanacaktır. Örneklem seçimi, Güneydoğu Asya bölgesindeki İslami sermaye piyasasının en ilerici bölgelerini içermektedir (Yakcop, 2002). Bu çalışmanın başlangıcında, Güneydoğu Asya'da sanayi sektörü altındaki Halka Açık Şirketlerden 595 örnek tespit edilmiştir. Bununla birlikte, tamamlanmamış finansal tablolar ve hesap dönemi boyunca muhasebe yılı değişikliği gibi çeşitli nedenlerden dolayı 114 şirket, örneklemden çıkarılmıştır. Bu nedenle, seçilen son örnekler ŞUŞ'lerden 197 ve ŞUOŞ'lerden 284 halka açık şirketten meydana gelmektedir. Tüm örnekler, Thomson Reuter Eikon tarafından yayınlanan DataStream aracılığıyla toplanmıştır. Bu çalışma, amacına ulaşmak için bilanço, gelir tablosu ve nakit akım tablosu gibi tüm finansal tabloları bir araya getirmektedir. Bu çalışmada veriler, Python Pandas yazılımı kullanılarak analiz edilmiştir. Bu, sermaye yapısının finansal kriz sırasında kurumsal performans üzerindeki etkisini analiz etmek için Python Pandas'ın kullanıldığı ilk çalışmadır. Pandas veri işleme ve analiz için Python programlama dili için yazılan yazılım kütüphanesidir. Pandas sayısal tabloları ve zaman serilerini değiştirmek için veri yapıları ve işlemler sunar. Bu nedenle, bu çalışma için gerekli olan kodlama sistemini oluşturmak, verileri analiz etmek için ilk adım olarak gerçekleştirilmiştir. Bu çalışmada amacına ulaşmak için regresyon denklemleri aşağıdaki gibi geliştirilmiştir: 1. Y (Pretax ROA) = β0 + β1D/Eit + β2Tangit + β3STDit + β4LTDit + β5CASH/ARit + β6GRWit + β7BOYUTit + β8(X) + ε 2. Y (ROE) = β0 + β1D/Eit + β2Tangit + β3STDit + β4LTDit + β5CASH/ARit + β6GRWit + β7BOYUTit + β8(X) + ε Vasıtasıyla: Pre-tax ROA = Vergi oranından önce varlığın getirisi ROE = Özkaynak karlılığı D/E = Borç / Özkaynak oranı STD = Kısa vadeli borç oranı LTD = Uzun vadeli borç oranı TANG = Maddi varlık oranı CASHAR = Nakit artı alacak oranı GRW = Büyüme oranı BOYUT = Boyut oranı ε = Hata terimi X = kukla değişken 0: Şeriat Uyumlu Olmayan Şirketler (ŞUOŞ) 1: Şeriat Uyumlu Şirketler (ŞUŞ) Analiz, çoklu doğrusallık testi ile başlar ve bu testin amacı, değişkenler arasında çoklu doğrusallık sorunu bulunmadığından emin olmaktır. Sonuçlara göre, tolerans değerlerinin hiçbiri 0,2'den az ve hiçbir Varyans Enflasyon Faktörü (VIF) 10'dan büyük değildir. Bu nedenle, bu çalışma için çoklu bağlantı sorunu yoktur denilebilir. Analizlere, tanımlayıcı istatistik analizleri ile devam edilmiştir. Şeriat uyumlu şirketlerin (ŞUŞ) kurumsal performansının mali kriz sırasında ve her iki bağımlı değişken için de, vergi öncesi varlık karlılığı (vergi öncesi AK) ve özkaynak kârlılığı (ÖKK), finansal krizden sonra şeriat uyumlu olmayan şirketlerde (ŞUOŞ) daha yüksek olduğu tespit edilmiştir. Ancak bağımsız değişkenler, borç / özkaynak oranı için kısa vadeli borç oranı, uzun vadeli borç oranı, nakit artı hesap alacakları hesap oranı, SCC'nin finansal öncesi, sırasında ve sonrasındaki tüm dönemler için daha düşük bir orana sahip olduğunu göstermektedir. Bu sonuçlar, niceliksel tarama işlemi sırasında endeks sağlayıcı tarafından belirlenen koşullar nedeniyle beklenen bir durumdur. Ayrıca Şeriat endeksinde yer almak ve Şeriat statüsü kazanmak için bir ŞUŞ'in, her zaman söz konusu koşulların yerine getirildiği takip etmesi gerekir. Bu nedenle, ŞUŞ'lerin ŞUOŞ'lere kıyasla her zaman daha düşük kaldıraç oranına sahip olduğunu gözlemleyebiliriz. Bu oranların düşük olması daha iyidir, çünkü yüksek kaldıraç oranı veya borç finansman oranı, şirketin ödeme gücü ve istikrarsızlık riskini arttırabilir. ŞUŞ için maddi varlık oranı finansal kriz öncesinde, sırasında ve sonrasında ŞUOŞ'lerden daha yüksektir. Bu oran mali kriz döneminden sonra, daha da önem kazanmaktadır. Çünkü, bankalar şirketin yaşama yeteneği için bu oranı dikkate alırlar ve şirketin teminat seviyesinin göstergesidir. Bu nedenle, daha yüksek maddi varlık oranına sahip ŞUŞ'e daha fazla borç verebilir. İflas durumunda daha güvenli hale gelir, şirketler, borçlarını ödemek için maddi duran varlıklarını satabilir. Toplam nakit ve alacak oranı, finansal kriz öncesinde, sırasında ve sonrasında ŞUOŞ'den daha düşüktür. Her ne kadar yüksek likidite ile daha fazla kredi hacmine ulaşmayı ve yöneticilerin yatırım yapmasını kolaylaşsa da, bu durum yüksek bir iflas riskini ve yüksek ödeme yapmama riskini beraberinde getirir. Ek olarak, düşük likidite temsil sorununun artmaması açısından bir avantaj sağlar. Öncesinde ve mali kriz döneminde ŞUOŞ'lerin ŞUŞ'lerden daha yüksek bir büyüme oranına sahip olduğunu göstermektedir. Ancak, mali kriz döneminden sonra ŞUŞ'ler, ŞUOŞ'lerden daha yüksek bir büyüme oranına sahiptir. Finansal kriz döneminden sonra ŞUŞ'lerin daha iyi büyüdüğünü göstermektedir. Ayrıca, finansal kriz döneminden sonra ŞUŞ'lerin yatırımcıdan daha fazla ilgi gördüğü kanıtlanmıştır. Kurumsal performans için ilk bağımlı değişken olarak, vergi öncesi AK'na dayalı çoklu regresyon analizinden elde edilen ikinci önemli bulgu, finansal kriz döneminden önceki borç / özkaynak oranı hariç tüm bağımsız değişkenlerin istatistiksel olarak önemli olduğunu ortaya koymuştur. Ancak finansal kriz döneminde sadece uzun vadeli borç oranları anlamlı değildir ve finansal kriz döneminden sonra hem kısa vadeli borç hem de uzun vadeli borç değişkenleri istatistiksel olarak önemli değildir. Şeriat uyumlu şirketler ancak finansal kriz döneminden sonra önemli bir seviyeye sahiptir. Sermaye yapısının vergi öncesi AK için ŞUŞ üzerindeki etkisi, finansal kriz döneminden sonra ŞUOŞ'lerden 1,6617 kat daha yüksektir. Kurumsal performansın ikinci bağımlı değişkeni ÖKK'dır. Finansal kriz döneminden önce borç / özsermaye oranı ve nakit artı hesap alacak oranı hariç, finansal kriz dönemi içinde ve sonrasında uzun vadeli borç oranı hariç tüm bağımsız değişkenler ÖKK açısından istatistiksel olarak önemlidir. Finansal krizden önce ÖKK ile ŞUŞ önemli ölçüde artmakta ve sermaye yapısının ÖKK için ŞUŞ üzerindeki etkisinin finansal kriz döneminden önce ŞUOŞ'lerden -2.9264 kat daha düşük olduğunu göstermektedir. Ancak, finansal kriz döneminden sonra, sermaye yapısının ÖKK için ŞUŞ üzerindeki etkisi ŞUOŞ'lerden 4.3171 kat daha fazladır. Bu çalışmada elde edilen bulgular, akademisyenler, araştırmacılar, düzenleyici kurumlar ve özellikle ŞUŞ ve ŞUOŞ gibi şirketlerin yönetimi için daha fazla araştırma yapmalarının gerektiğini sonucunu doğurmuştur. Bu çalışma düzenleyici kurumlara ve ilgili devlet kurumlarına, şeriat uyumlu statüye ilişkin yönergeler ve çerçeve çıkarmaları rehber olabilir. Bu nedenle, yeni düzenleme ve kılavuz ilkeler oluşturmak için, bu kurumların daha fazla yatırımcı çekmek için yeni kılavuzlar geliştirmek amacıyla yatırımcıların ihtiyaçlarını ve ŞUŞ'lerin özelliklerini anlamaları gerekmektedir. Malezya'da hükümet beş yıl vergi muafiyeti ile yeni ŞUŞ'lere teşvik vermektedir. Ayrıca, İngiltere ve Fransa'da ŞUŞ'ler de dahil olmak üzere İslami finans sektörü için vergi yapılarını değiştirdiler. Bu çalışmanın yürütülmesinde bazı sınırlamalar bulunmaktadır. Bu çalışmada, finansal piyasadaki farklı düzeylerde gelişme, hükümet politikaları ve o ülkenin dış olaylara duyarlılığı nedeniyle Asya'daki finansal krizin ülke genelinde farklı olduğu göz önünde bulundurulmamıştır. Buna ek olarak, ülkeler arası bu çapraz çalışma nedeniyle, farklı hukuk sistemleri ve düzenlemeleri, bürokrasi, şirketlerin her ülkede karşılaştığı farklı maliyetler ve faydalar nedeniyle farklılıklar beklenmektedir. Bu sınırlamalar gelecekteki araştırmaların yolunu açmaktadır. Dolayısıyla, gelecekte sermaye yapısı alanındaki araştırma boşluğunu doldurmak için bu sınırlamaları dikkate alınmalıdır."
