abstract: "Bu tezde filozof Emer de Vattel'i ve Hukûk-ı Nâs adlı eserini Türk düşüncesindeki karşılıklarıyla incelemeye çalıştık. Vattel'in Türk kamuoyunda bilinmeyen şahsını, felsefesini ve eserini tanıtmak öncelikli bir hedefti. Ardından Türk düşüncesinde eserin çevirisini ve mütercimini araştırdık. Doğal hukuk kuramının bir temsilcisi olan Vattel, uluslararası hukuku doğal hukuk çerçevesinde sunmaktadır. Bunu yaparken uygulanabilir öğütler verip, herkesin üzerinde uzlaşabileceği kurallar ortaya koymaktadır. Bu sebeple, felsefe tarihinde olduğu kadar hukuk tarihinde de yer almıştır. Türk düşüncesindeki ilahi adaletin batıda farklı bir terennümünü verdiğini düşünerek aradaki benzerlikleri sergiledik. Türk düşüncesinde hukukun temsilcisi sayılan Namık Kemal'de birebir aynı ifadeler gördük. Namık Kemal'in şahsına odaklandık ve eserdeki fikirlere mukabil onun hukuk düşüncesini işledik. Hukuk felsefesi, doğal hukuk kuramı, uluslararası hukuk düşüncesinde Vattel'in yeri, Vattel'in hayatı, çalışmaları ve felsefedeki konumu gibi elzem bilgiyi sunmak istedik. Osmanlıca yayımlanan cildi inceleyerek, Osmanlı düşüncesine arz edilen fikirleri gösterdik. Nihayetinde İslâm ve Osmanlı hukukunun eserdeki mukabil düşüncelere nazaran anılmasına ve bizde doğal hukukun temsilcisi olan Namık Kemal'in idrak edilmesine çabaladık. KEY WORDS Registered Share Capital, Capital Increase, Decisions of the Board of Directors,Cancellation of Board Decisions."
