abstract: "Döviz dalgalanmaları ve borcun geri ödemesi üzerindeki etkisini fıkhi perspektiften ele almak, konuyu analiz etmek ve ekonomik ve sosyal zorluklarını daha derinlemesine anlama fırsatı sunmaktadır. Tez, bir giriş üç bölüm ve bir sonuç eklinde planlanmıştır. Birinci bölümde, maddi veya işlevsel açıdan farklı Para birimlerinin mahiyetini belirlemeye yönelik bakış açılarını ele almaktadır. bölüm, medeniyetin ve teknolojinin ilerlemesini yansıtan bir ayna olarak para türlerinin tarih boyunca gelişimine ışık tutmakta olan bu bölümde, İslam hukukçularının paranın niteliğine dair farklı görüşlerini tartışılmaktadır. Bağımsız, tek başına bir para olduğu görüşünün ağırlıkta olduğuna dair tercih edilen görüş vurgulandıktan sonra bölümde paranın işlevlerine değinilerek önemi vurgulanmakta, adil ekonomik ve ticari istikrarın sağlanması için etkili bir para politikasının harekete geçirilmesinin gerekliliğine işaret edilmektedir. İkinci bölümde paranın değeri tartışılmaktadır. Bu bölümde paranın değerinin boyutları, nominal, reel ve dış değer açıklanarak, paranın değerini etkileyen faktörler analiz edilmektedir. Arz ve talep, fiyat düzeyi, politik ve ekonomik kararlar gibi sebeplere binaen parada meydana gelen değişim türlerine değinilmektedir. Bölümde, resmi para birimleri ve para birimleri sayesinde meydana gelen durgunluk ve kesinti olgusunun günümüzde nadir, hatta imkansız hale geldiği belirtilmektedir. Bölümde aynı zamanda yüksek fiyatların ve ucuzluğun borç satın alma ve geri ödeme kabiliyeti üzerindeki etkisine de değinilmekte ve İslam hukukçuların bu konudaki yaklaşımları analiz edilmektedir. Üçüncü bölümde ise Yemen para biriminin uzun tarihi süreçte para birimlerinin çeşitliliği vurgulanmaktadır. Yemen para biriminin son zamanlarda karşılaştığı ve değerinde önemli bir bozulmaya yol açan zorluklar ile bunların altında yatan sebeplere vurgu yapmaktadır. Bu bölümde, döviz krizine çözüm bulmak için önemli bir adım olarak savaşı sona erdirmenin ve merkez bankasını birleştirmenin önemine dikkat çekilmektedir. Bölüm, Yemen para biriminin döviz kurundaki değişiklik ve eşitsizliğe ilişkin karar örneğinde olduğu gibi Yemen para birimine ilişkin fıkhi hükümlerin neler olduğu ile sona ermektedir. Yemen para biriminin bir tek para türü olduğunu ve takasta aralarında ayrım yapılmasının caiz olmadığını, bir para biriminden kredi verip başka bir para birimine tescil ettirmenin caiz olmadığına işaret ederek, tefecilik ve kur farklarının önlenmesi için çözüm önerilerinde bulunmaktadır."
