abstract: "Konvansiyonel bankacılık ve finans alanındaki gelişmelerle birlikte, İslami açıdan faaliyet gösteren finansal kurumlarda ve ürünlerde artış görülmektedir. Bankacılık ve finans faaliyetlerinin İslami açından değerlendirilmesi esnasında, kullanılan ürün ve hizmetlerin İslami değerlere uygunluğu baz alınmakta, uygun olmayan ürünler ya kabul görmemekte ya da İslami değerlere uygun hale getirilmeye çalışılmaktadır. İslami finans sisteminde finansman ihtiyaçlarının karşılanması için ortaya çıkan finansman yöntemlerinden biri de vekalet sözleşmesi denilen akit türüdür. Bu yöntemde yatırımcı ücreti karşılığında bir vekil tayin eder, vekil de daha önceden belirlenen bir yüzdede getiri elde etmek için bu sermaye ile ticaret yapar. Çalışmanın temel amacı, yeni bir fon toplama yöntemi olarak 'Vekalet' yöntemini hukuki, fıkhi, iktisadi açından değerlendimek ve İslami finans kurumları için İslami ilkelere uygun standart bir model önerisi sunmaktır. Türkiye'de özellikle katılım bankaları tarafından kısa vadeli ve yurtdışı kaynaklı fon temini amacıyla kullanılan 'vekalet' ürününün, henüz yeteri kadar uygulama alanı bulmadığı veya uygulansa dahi kısıtlı bir düzeyde olduğu ve uygulanan kısmının ise doğru olarak sisteme entegre edilmediği gözlemlenmektedir. Faizsiz bankacılık ilkelerine ve İslami değerlere uygun bir şekilde uygulandığı takdirde 'Vekalet Usulüyle Fon Toplanması ve İşletilmesi' yönteminin, birey bazında fon sahiplerinin âtıl fonlarının ekonomiye kazandırılması açısından önemli bir yöntem olduğu ve faizsiz bankacılık alanında katma değer oluşturacağına kanaat getirilmiştir. Araştırma kapsamında bu finansman türünün içeriği, hukuki ve fıkhi dayanakları, dünya ve Türkiye finans sistemindeki yeri, diğer akit türleri ile farkı incelenmiştir. Ortaya çıkan sonuçlar ve değerlendirmeler, sektör yöneticileri ile araştırmacılar için bilgiler ve politika yapıcıları için öneriler sunmaktadır."
