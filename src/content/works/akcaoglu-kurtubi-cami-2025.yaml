abstract: "el-Câmiʿ li-ahkâmi'l-Kurʾân ve'l-mübeyyin limâ tezammenehû mine's-sünneti ve âyi'l-furkân isimli tefsir, İslâmî ilimler sahasında önemli bir eser olarak kabul edilir ve Kurtubî'nin derin dini ve dilbilim bilgisini ortaya koymaktadır. Bu tezde yirmi ciltten oluşan el-Câmi- li'-Ahkâm adlı tefsirde Sîbeveyhi'nin gramer teorilerinin işlevi ve yansımaları detaylı bir biçimde incelenmiştir. Bu bağlamda Kurtubî, dil ve gramer bilgisi açısından dönemin önde gelen dil bilimcilerinden biri olan Sîbeveyhi'ye üç yüz altmış üç defa referansta bulunmakta olup bu referanslar konu başlıklarına göre sistematik bir şekilde kategorize edilerek tahlil edilmiştir. Bu referansların bazıları tefsirin farklı yerlerinde aynı mesele veya benzer mesele için tekrarlanmıştır. Sîbeveyhi'nin özellikle Arapça dilinin kuralları ve yapısı konusundaki katkıları, Kurtubî'nin tefsirine ciddi bir derinlik katmıştır. Bu yönüyle, Kurtubî'nin tefsirinde Sîbeveyhi'nin konumu şematize edilmiş, hangi alanda ne kadar yer verdiği belirlenmiş, İslâmî ilimler ve Arap dili üzerindeki tesiri ile Kurtubî'nin ayet yorumlarında anlam inşasında nasıl işlev gördüğü ortaya konmaya çalışılmıştır."
