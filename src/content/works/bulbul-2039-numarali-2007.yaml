abstract: "ÖZ[BÜLBÜL, Mustafa]. [2039/225 Numaralı Trabzon Şer'iyye Sicilinin (Vr. 71-123) Transkribi ve Değerlendirilmesi], [Yüksek Lisans tezi], Samsun, [2007].Osmanlı Tarihi ile ilgili yerel çalışmalarda Şer'iyye Sicilleri birinci el kaynakolma özelliğine sahiptir. Bu çalışma Trabzon şehrinin 1886-1888 yıllarındakidurumuna ışık tutmak ve söz konusu tarihlerde Trabzon'un siyasal, sosyal,ekonomik ve kültürel durumunun aydınlatılmasına katkı sağlamak amacıylahazırlanmıştır.Bu çalışmada 2039/225 Numaralı Trabzon Şer'iyye Sicilinin 71-123. varaklarıarasında bulunan metnin transkripsiyonu ve değerlendirilmesi yapılmıştır.İncelenen kısımda 172 kayıt bulunmaktadır.1886-1888 tarihleri arasında tutulan bu kayıtlar; tereke tespit ve taksimhücceti, satış ilamı, izinnameler, vekâlet, nafaka, şaban hilalinin görülmesinedair şühüdnameler, alacak davaları, verâset ve vekâlet davalarındanoluşmaktadır. Bunlar içinde vekâlet davaları çoğunluktadır.Anahtar kelimeler; Trabzon, Şer'iyye Sicili, kayıt, belge, tarih."
