abstract: "Bu tezin amacı Osmanlı sonrası Arnavutluk'ta kurulan şer'iyye mahkemelerinin terihçesini, yapısını, Arnavutluk hukuk sistemindeki yerini, muhâkeme usulünü ve uygulamalarını ele alarak medenî hukuk alanındaki Osmanlı'dan tevarüs edilen İslâm hukukunu incelemektir. Temel kaynak olarak 1912-1929 yılları arasındaki Arnavutluk Diyanet İşleri Şer'iyye Sicilleri ve arşiv belgeleri, Arnavutluk arşiv belgeleri, Arnavutluk ve Arnavutluk hukuk tarihi temel eserleri ve İslâm hukukunun klasik kaynakları kullanılmıştır. Giriş bölümünde tezin konusu, önemi, amacı, sınırlılıkları, yöntemi ve özellikle arşiv belgelerinin özelliklerini anlatarak temel kaynakları üzerinde durulmuştur. Birinci bölümde Arnavutluk hakkında genel bilgiler, 1912-1929 seneleri arasında hukuk ile ilgili kurumlar, İslâm dini kurumları ve Osmanlı'da şer'iyye mahkemeleri hakkında genel bilgilere yer verilmiştir. İkinci bölümde geniş bir perspektif ile İslâm dini kurumlarının en önemli dönüm noktaları ve değişimleri üzerinde durularak şer'iyye mahkemelerinin tarihçesi ele alınmıştır. Üçüncü bölümde şer'iyye mahkemelerinin yapısı, Arnavutluk hukuk sistemindeki yeri, görev ve yetkileri, muhâkeme usulü ve kullanılan dil meseleleri incelenmiştir. Dördüncü ve son bölümde Arnavutluk arşiv belgelerinde ve Şer'iyye Sicillerinde nikâh, talâk, miras ve bunlarla ilgli tespit edilen Aile hukuku uygulamaları irdelenmiş ve temel İslâm hukuku kaynaklarıyla karşılaştırılarak uygunlukları değerlendirilmiştir. Ekler bölümünde şer'iyye sicilleri ve arşiv belgelerinden örnekler, ayrıca Yüksek Şer'iyye Mahkemesi'nin organizasyonuyla ilgili en önemli tüzüklerin tercümeleri eklenmiştir. Çalışmamaızın sonucunda şer'iyye mahkemelerinin 1916-1929 seneleri arasında zaman zaman değişen uygulama ve iç organizasyonuyla Osmanlı'dan sonra Arnavutluk'ta baskın bir şekilde İslâm hukukunu uyguladığını tespit etmiş bulunuyoruz."
