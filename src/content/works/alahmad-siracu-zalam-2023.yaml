abstract: "Bu çalışma, Hanefî mezhebine mensup Yemenli Ebû Bekir b. Ali b. Muhammed el-Hâddâd el-Abbâdî ez-Zebîdî'nin (ö. 800 h.)“Sirâcü'z-Zalâm ve Bedrü't-Tamâm”isimli kitabının namaz bölümünün tahkiki ve incelenmesini konu edinmektedir. Bu eser, Merğînânî tarafından hazırlanan“Bidâyetü'l-Mübtedî”isimli metnin manzumesi olan“Dürrü'l-Mühtedî ve Zuhrü'l-Muktedî”nazmının şerhidir.“Bidâyetü'l-mübtedî”metni, Hanefî mezhebinin en temel ve en önemli metinlerden biri olarak kabul edilir. Bu metin hakkında pek çok şerh yazılmıştır. Yazılan şerhlere de şerhler ve haşiyeler eklenmiştir. Hiçbir dönemde bu kitaptan bağımsız bir eser kaleme alınamamıştır. Yemenli İmam el-Hâmilî, mezkûr metni kapsamlı bir şekilde yazıp ona:“Dürrü'l-Muhtedî ve Zuhrü'l- Muktedî fi nazmi Bidâyeti'l-Mubtedî”ismini vermiştir. Bu eser“el-Hâmiliyye”ismiyle meşhur olmuştur. Daha sonra ünlü âlim, tefsir ve diğer pek çok meşhur eserin yazarı olan öğrencisi Ebu Bekir el-Haddâd bu manzumeyi şerh etmiştir."
