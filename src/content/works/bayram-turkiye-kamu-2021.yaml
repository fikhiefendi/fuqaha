abstract: "Geçmişten günümüze devletler ülke refahını yükseltmek ve ülkelerini kalkındırmak için çeşitli yatırımları içerisinde bulunur. Kimi zaman bu yatırımlar mevcut maddi sermaye ile gerçekleşirken kimi zaman borçlanılarak ve ülke kaynakları teminat gösterilerek yapılmakta kimi zaman ise özel sektör ile antlaşma sağlanarak yapılmaktadır. Toplumun ihtiyaç duyduğu yatırıma ulaşmasını sağlayacak alternatif bir model olması hasebiyle ve İslam ekonomisinde yer alan Müşareke modelinin tanıtılması maksadıyla Gebze-Orhangazi-İzmir Otoyolu projesi incelenmiştir. Mevcut uygulama Müşareke modelindeki gibi ortaklık esaslıdır. Fakat sözleşmese açısından İslam ekonomisine uygunluğu bilinmemektedir. Ayrıca proje için faizli kredi kullanılmıştır. Müşareke ile uygulandığında ise faiz yükü yerine ilk yöntem olarak finansör ortak bulunmuştur. Faiz dolayısıyla katlanılan finansman gideri ortadan kalkmış ve proje maliyeti düşmüştür. Böylece atıl sermaye üretime katkıda bulunmuş ayrıca gelir dağılımı sağlanmıştır. Diğer uygulamada ise yatırım projesine Müşareke Sukuk ile finansman sağlanmıştır. Bu uygulama ile yastık altı olarak tabir edilen tasarrufların kamu yatırımına finansman olabileceği saptanmıştır. Bireysel ve kurumsal yatırımcılar için alternatif yatırım imkanı sağlamaktadır. Ayrıca halkının kendi menfaatine olan yatırımları finanse etmesi ve bundan gelir sağlaması bu yöntem mümkün kılmıştır. Müşareke'den yola çıkılarak geliştirilen Azalan Müşareke mikro ve makro ölçekli uygulanabilmektedir. Fakat yaygın uygulamalar içerisinde yer almamaktadır. Kanun ve mevzuatların eksikliği, risk alıp ticari faaliyete girmektense kesin gelir olan faize para yatırma anlayışı ve ortaklık sistemi olarak tanınmaması sebebiyle Müşareke ve Azalan Müşareke yöntemini arka plana atmaktadır. Müşareke modelini tez konusu olarak seçmekteki amacımız Müslüman kesimin yoğun olarak yaşadığı ülkemizde toplumun her kesimini ilgilendiren kamu yatırımlarına uygulandığında nasıl bir katkısı olacağını belirlemektir."
