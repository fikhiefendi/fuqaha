abstract: "Geleneksel tahvillere alternatif bir borçlanma aracı olarak geliştirilen sukuk İslami finans sisteminin öne çıkan unsurlarından birisidir. Sukukun teorik altyapısı menkul kıymetleştirme sürecine dayanmaktadır. Sukuk piyasası özellikle 2000'li yıllarda önemli düzeyde bir gelişim kaydetmiştir. Başlangıçta kullanımı birkaç Asya ve Orta Doğu ülkesi ile sınırlı olan sukuk, bugün itibarıyla Afrika'dan Avrupa'ya çeşitli ülkelerde kullanılan bir finansal araç haline gelmiştir. Türkiye de küresel finans krizinden sonra sukuk piyasasına giriş yapmıştır. Yalnızca icara sukuk türünü içeren ilk yasal düzenleme 2010 yılında yapılmış, sonrasında söz konusu düzenleme diğer sukuk türlerini kapsayacak şekilde genişletilmiştir. Sukuk, Türk mevzuatında kira sertifikası olarak adlandırılmaktadır. Uygulama tarafında ise ilk özel sektör ihracı 2010 yılında, ilk kamu sektörü ihracı 2012 yılında yapılmıştır. Bu çalışmanın birincil amacı, sukuk ile geleneksel tahvillerin piyasa risklerinin ne şekilde farklılaştığını Türkiye örneğinde ortaya koymaktır. Bu amaç doğrultusunda; Türkiye'de ihraç edilmiş olan kira sertifikası (sukuk) ve tahvillerin ikincil piyasa davranışları incelenmiş, seçilen kira sertifikası ve tahvil örneğinde karşılaştırmalı risk analizi yapılmıştır. Oluşturulan üç portföyün riskliliğini analiz etmek amacıyla her bir portföy için günlük YTM (vadeye kadar getiri) verileri kullanılarak hesaplanan getiri değişim oranı serisi oluşturulmuştur. Elde edilen serilerin varyansları uygun ARCH-GARCH (Autoregressive and Generalized Autoregressive Heteroskedasticity) modelleri ile tahmin edilmiştir. Ardından parametrik VaR (riske maruz değer) yöntemi ile portföylerin risklilik durumları incelenmiştir. VaR modellerinin doğruluğunu sınamak içinse geriye dönük test uygulanmıştır. Sonuç olarak, Türkiye'de yabancı para birimi cinsinden kira sertifikası ve tahvilin YTM değişimleri arasında güçlü bir pozitif doğrusal ilişki olduğu tespit edilmiştir. Söz konusu ilişki, bu iki menkul kıymete ayrı ayrı yatırım yapıldığı durumdaki toplam riske maruz değer üzerinde aşağı yönlü bir etki oluşmasını sağlamıştır."
