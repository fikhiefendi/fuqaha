abstract: "Bu tez, bir Giriş ve İki Bölümden oluşmaktadır. Girişte tezin içeriği ve hazırlanmasında izlenen yöntem hakkında bilgi verilmektedir.İlk bölümde İslam Ceza Hukukunda şahidin ve şahitliğin mahiyeti, şahitte aranan şartlar alimlerin görüşleri ışığında tartışılmaktadır.Tezin ikinci bölümünde ise rücü' kavramı, şahitlikten rücü' sonucunda ortaya çıkan durumlara yer verilmektedir."
