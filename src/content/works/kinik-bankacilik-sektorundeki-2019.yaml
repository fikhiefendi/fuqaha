abstract: "Ülke ekonomisini ayakta tutan finans sektörü ve bu sektörde dengeyi sağlayan da bankalardır. Katılım bankaları da bu sektörde gün geçtikçe daha da güçlü bir şekilde yerini almaktadır. Sadece İslam ülkelerinde değil, dünyada yaygınlık gösteren Katılım bankaları, Türkiye'de de artık kalıcı bir yer edinmiştir. Bu çalışmada; katılım bankacılığı kavramının tanımı, felsefesi, özellikleri, tarihi, ortaya çıkış nedenleri, amaçları, önemi, hizmetleri, türleri, katılım bankalarının fon kaynak ve kullanımları, katılım bankalarının ekonomiye etkileri ve sorunlarından bahsedilmiştir. Türkiye'de faaliyet gösteren beş katılım bankasının performansları karşılaştırılmıştır. Karşılaştırma 2010 – 2017 yıllarını kapsamaktadır. Bu kapsamda beş bankanın Türkiye Bankalar Birliğindeki rasyo verilerinden yararlanmıştır. Analizde Topsis yöntemi kullanılarak, seçilen 28 rasyo ile analiz tamamlanmıştır. Analiz sonucunda bankalar, aldıkları puana göre sıralanmıştır. En yüksek puanı alan banka birinci sırada, en düşük puanı alan banka ise beşinci sırada yer almıştır."
