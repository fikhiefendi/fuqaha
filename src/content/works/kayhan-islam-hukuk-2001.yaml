abstract: "ÖZET Kayhan, Seyit Ahmet, İslâm Hukuk Metodolojisinde Lafiz-Mana İlişkisi (Delâlet Yollanl Yüksek Lisans Tezi, Danışman: Doç. Dr. Şamil Dağcı, 188s. Tez olarak ele aldığımız konuda, Kur' ân ve sünnetten hükümler çıkarılırken önde gelen İslâm hukuk usûlcü ve bilginlerinin lafiz ve ibarelerle bunlara yüklenen manaları nasıl irtibatlandırdıklannı ortaya koymaya çalıştık. Ele aldığımız konu etrafında İslâm hukuk usûlcü ve bilginleri arasında ortaya çıkan ilmî, fikrî ve felsefî görüşler ile metodolojik görüş ayrılıklarını ve farklılıklarını tespit etmeye çalıştık. Ayrıca konumuzla anlama ve yorumlama faaliyetleri açısından yakından ilgisi bulunan çağdaş anlambilim (semantik) ve yorumbilim (hermeneutik) gibi ilim dallarını da çalışmamıza dahil ettik. Çalışmamız iki bölümden ve sonuç kısmından oluşmaktadır. Birinci bölümde lafiz-mana ilişkisi ile ilgili kavramsal çerçeveye yer verdik. Bu başlık altında lafiz-mana ilişkisi etrafinda İslâm hukuk metodolojisi ile ilgili kavramları ele aldık. Mukayese yapılabilmesi için çağdaş anlambilim (semantik) ve yorumbilim (hermeneutik) ile ilgili kavramları tanımlamaya, taşıdıktan anlamlan tespit ve tahlil etmeye çalıştık. İkinci bölümde, İslâm Hukuk Metodolojisinde Lafiz-Mana İlişkisi adlı konuyu ele aldık. İslâm Hukuk Metodolojisinde Anlama Yöntemleri başlığı altında, hukukta kullanılan yorum metodlannı, usûl-i fikhın farklı ekollerine göre anlama yöntemini örneklerle ve karşılaştırmalı olarak ele aldık. Sonuç bölümünde ise değerlendirme, tespit ve önerilere yer verdik. 186"
