abstract: "Modern çağa kadar insanların tartışmasız bir şekilde erkek ya da kadın cinsiyetinde olduğunu ima eden cinsel dimorfizm, insan cinselliği hakkındaki verilerimizin çoğunu açıklıyor gibiydi. Günümüzde cinsiyet çeşitliliğine ilişkin birçok biyolojik çalışma, bu düzenleyici ikili metaforun yeterliliğini sorgulayan sonuçlar veriyor. Birçok interseks kişi -yani kromozom anomalileri, gen mutasyonları, hormon reseptör bozuklukları gibi nedenlerden ötürü hem erkeksi hem de kadınsı özellikler taşıyan kişiler- bu paradigmanın kendi varlıklarının gerçeğini aydınlatma yeteneğini sorguluyor. İnterseksüaliteye İslam hukuku penceresinden bakmayı hedefleyen bu çalışmada konunun, modern tıp ve etik alanındaki verilerle yeniden okunmasıyla İslam dininin cinsiyet algısının yansıtılması denenmiştir. Bunun için tıbbî bağlamda interseksüalitenin anlamı, çeşitleri ve tanı ve tedavi yöntemleri gibi konular ele alınmıştır. Bunun yanında interseksüalitenin gözetiminde benimsenen, gerek tıp camiasının optimal bakım standartları gerekse insanların toplumsal tabularının etik boyutu sorgulanmıştır. Nihayetinde konu hakkında tıp ve etik disiplinlerinin verileriyle inşa edilen temelin üzerine İslam hukukundan elde edilen doneler değerlendirilmiştir. Bu değerlendirme esnasında klasik dönem İslam hukukunda interseksüalitenin tıbbî, etik ve hukukî açılardan ele alınış şekliyle birlikte modern dönem İslam hukukunun konuya yaklaşımı da yansıtılarak, zaman içerisinde meselenin algılanışındaki değişim ortaya konmaya çalışılmıştır. Ayrıca modern cerrahideki teknik ilerlemelerin beraberinde getirdiği cinsiyet düzeltme operasyonlarının dinî açıdan meşruiyeti konusunda çağdaş dönem İslam hukukçularının değerlendirmelerine yer verilmiştir. Bu bağlamda söz konusu operasyonların kapsamına hangi bireylerin dahil edilebileceği ve dinî çerçeveye uygunluğu için hangi parametrelerin gözetileceği gibi soruların cevaplanması hedeflenmiştir. İslam hukukunun kendi içinde benimsediği özgün interseksüalite algısının, modern tıp ve etik alanlarının sağladığı bilgilerle uyuşan ve farklılaşan yönleri analiz edilerek konu hakkında genel bir dinî paradigma oluşturma denemesi yapılmıştır. Bir anlamda İslam hukukunun sağladığı veriler, tıbbî ve etik bilgilerle filtrelenerek interseksüalite için benimsenen dinî bakım standardının tanıtımı yapılmıştır. Böylece merkeze İslam hukuku alınarak interseksüalitenin ait olduğu diğer alanlarla bağlantılar kurulup konu ile alakalı interdisipliner bir bakış açısı sunulmaya çalışılmıştır."
