abstract: "ÖZETTicaret, insanlık hayatında önemli bir uğraştır. İnsanlığın yerleşik hayata geçmesiyleberaber işbölümü başlamış, ticaret yaygınlaşmıştır. Ticaretin gelişimine paralel olarak ticariaraçlar da gelişme göstermiştir. İnsanlık tarihinde, ticari alışverişlerde takas, para, çek gibiödeme araç ve metotları görülmüş ve sonunda plastik kredi kartları kullanılmaya başlanmıştır.Günümüzde Akıllı(smart)plastik kart, mal ve hizmet alımı ve kredili işlerde kullanılan enmodern ticari araçtır.İslam dini, insan hayatını düzenleyen bir kurallar bütünü olduğundan dolayı insanhayatının bir uğraşı olan ticaretin de kurallarını çıkarmıştır. Kredi kartları sonradan kullanılanbir ticari araç olduğu için tabii olarak Kuran ve Sünnette ele alınmaz, ancak bunların genelkuralları ışığında, kıyas gibi metotlarla araştırılacak konulardan biridir. İslami kurallarauygunluğunun tespit edilmesi, konu ile ilgili kurumların çalışma sisteminin bilinmesi veişlemlerin İslam fıkhında hangi akde girdiği konusunun kavranmasıyla mümkündür. Busebeple kredi kartı ile ilgili hukuki araştırmaya yönelik hazırlanmış olan tezimizde bankakartları ve kredi kartlarının çeşitleri ve sistemlerinin işleyişi hakkında da bilgiler verilerekhukuki yönünün daha kolay kavranılması amaçlanmıştır. Bunun gibi modern hukukta dahukuki ilişkilere değinilmiş, 5464 sayılı Banka Kartları ve Kredi Kartları Kanunu'nun metnieklenip etrafındaki değerlendirmelere de geniş yer ayırarak konunun pratik olarak ta faydalıolacağı düşünülmüştür.Son zamanlarda alışverişin bir parçası haline gelmiş olan banka kartları ve kredikartlarının yeni olması, kartların gerek kullanım amacı ve gerekse de nitelikleri bakımındandeğişik olmalarından dolayı uygulamalarının çoğu tartışmalı olmaya devam etmektedir.Çalışmamız da bunlar değerlendirilmektedir."
