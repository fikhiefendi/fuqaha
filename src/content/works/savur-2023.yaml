abstract: "Mekke ve Medine'deki Uygur Vakıfları, Uygurların ülkeleri dışında yaptıkları en önemli hayırlı işlerden biridir. Bu vakıflar, Uygurların eğitim, sosyal dayanışma vb. alanlardaki türlü ihtiyaçlarını karşılama amaçlı ekonomik kaynağı olmakla beraber, onların çeşitli masraflarını karşılayarak ekonomik yükünü hafifletmede önemli bir unsurdur. Bu çalışmada, söz konusu vakıflar tanıtılmakla birlikte, onların Uygurlar üzerindeki ekonomik etkileri; yıkım, vasıflarının değiştirilmesi, sermaye birikimleri, çok eskirimesi sebebiyle kullaılamayacak hale gelmesi ve yatırım gibi, kuruluşundan beri uğradığı değişim ve yeniliklerle beraber, Uygurların onlardan istifade etmesini etkileyen faktörler üzerinde durulmuştur. Ardından söz konusu yeniliklerin şeriat ahkamlarına uygun olup olmadığı, vakıfların şeriatta belirlenen kıstaslara uygun şekilde idare edilip edilmediği gibi konular incelenmiştir. Çalışma boyunca nicel ve nitel metoda başvurularak, vakıf ahkamları fıkhın ana kaynaklarından alındı; vesikalara erişmek, mülakatlar ve saha araştırmaları yapmak gibi yollarla söz konusu vakıflar hakkında malumatlar elde edildi. Yeri geldiğinde Uygur vakıflarıyla ilgili bazı fıkhî ahkamlara değinildi. Ardından Mekke ve Medine'de Uygurların otuz beş vakfı olduğu tespit edilerek, söz konusu vakıfların vakfedicileri, coğrafî konumları, vakıf şartları ve onların Uygurlar üzerindeki ekonomik etkileri üzerinde duruldu. Daha sonra söz konusu vakıflar,“yıkılan vakıflar”ve“yatırım amaçlı olarak değiştirilen vakıflar”şeklinde kategorilere ayırarak, bunların, vakfın şeri ahkamlarına uygun olup olmadığı açısından tartışıldı. Ardından Uygurların söz konusu vakıflardan ne derecede yararlanabildiği konusu incelendikten sonra, Uygurların o vakıflardan layıkıyla yararlanamadığı sonucuna varıldı ve bunun nedenleri ortaya konulmaya çalışıldı. Son olarak vakıf mesullerinin, bu konudaki sorumluluklarını layıkıyla yerine getirip getirmedikleri konusu tartışıldı ve değerlendirildi. Bu çerçevede bazı mesullerin, sorumluluklarını layıkıyla yerine getirdikleri, bazılarının ise vazifelerini ihmal ederek, halel getirdikleri tespit edildi ve onların ihmal ettiği noktalar gösterilmeye çalışıldı. Ancak bazı vakıf mesullerinin, sorumluluklarını yerine getirip getirmediği konusunda yeterli malumat elde edilemedi ve bunun sebepleri de ortaya konuldu."
