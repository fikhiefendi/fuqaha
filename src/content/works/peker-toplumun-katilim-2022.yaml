abstract: "Finansal Dünyada güçlü bir gelişim ivmesi yakalayan“katılım bankacılığı”ilkelerinin uygulamaya başlanılması ile ilgili çalışmalar,1970'lere kadar dayanmaktadır. İslami finans adıyla finans dünyasında yer alan katılım bankaları, ilk etapta Müslüman devletlerde uygulanmışken günümüzde dünya ülkelerinin birçoğunda yer almakta uygulama, birikimlerin değerlendirilmesi açısından her geçen gün önemi artan bir finansal kurum halini almaktadır. İslami finans günümüzdeki tabiri ile katılım bankacılığı dünya finans sektöründen almış olduğu payı her geçen gün artırmaktadır. Katılım bankacılığı öyle cazip hale gelmiştir ki konvansiyonel bankaların bile katılım bankacılığı işlemleri yapmak için mevcut sistem içerisinde faizsiz finans işlemleri için segment açmaya başladıkları görülmektedir. Dünya finans sektöründe İslami bankaların tercih nedenleri üzerine birçok çalışma yapılmış olmasına rağmen Türkiye'deki katılım bankalarının tercih nedenleri üzerine yapılan çalışma sayısı son yıllarda artmaya başlasa da tatmin edici seviyelerde değildir. Bu çalışmanın amacı katılım bankaları hakkındaki bilgi düzeyi ile katılım bankaları hakkındaki görüşler arasındaki ilişkinin ortaya konulmasıdır. Finansal sistem içerisinde yer alan kullanıcılar bu araştırmanın belirleyici unsurunu oluşturmaktadır. Bu nedenle banka kullanıcıları arasından nicel araştırma yöntemine uygun olarak basit tesadüfü örneklem yöntemi tercih edilmiş ve örneklemden hareketle katılımcılardan gönüllülük esasına dayalı olarak araştırma verileri anket tekniği ile toplanmıştır ve SPSS paket programı ile analiz edilmiştir.Yapılan çalışma sonucunda katılım bankacılığının payını artırması ve etki alanını geliştirmesi, sunduğu finansal ürünlerinin çeşitliliği, katılım bankacılığının tanınırlığı ve müşteriler nezdinde bırakılan olumlu imaj ile ilişkili olduğu sonucuna varılmıştır.Toplum nezdinde katılım bankacılığı hakkındaki bilgi düzeyi arttıkça tercih eden müşteri sayısı da artmaktadır."
