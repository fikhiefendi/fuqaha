abstract: "İslami Bankacılık ve bu süreçleri destekleyen kurumlar, geçtiğimiz on yılda sürekli artmaktadır. Bu da, İslami bankaların geleneksel meslektaşları üzerinde sahip olduğu benzersiz özellikleri ortaya çıkarmak isteyen bankacılık sektöründeki akademisyenlerin ve uygulayıcıların dikkatini çekti. Bu nedenle mevcut çalışmalar, İslami bankacılığa dahil olan doğa ve süreçlere odaklanmıştır ve bankalarının dünyanın farklı bölgelerindeki performansının karşılaştırmalı çalışmalarına çok az önem verilmiştir. Bu çalısma, 2016-2018 yılları arasında Katar, Pakistan, Suudi Arabistan, Türkiye ve Bahreyn'deki bankaların performanslarını karşılaştırmakatadir. Çalıma vaka çalışması ülkelerinden seçilen beş İslam bankası ile beş konvansiyonel bankanın performansındaki benzerlik ve farklılıkları (her ulke icin bir konvansiyonel banka ve bir İslam Bankası). incelemek için Finansal Oran Analizi yaklaşımını icermektedir. Bu kurumların her birinin karşılaştığı likidite, karlılık, ödeme gücü ve riski ölçmek ve karşılaştırmak için yedi gösterge kullanarak, bir performans göstergesi elde edilir. Bulguların önemini test etmek için, süreçte bir T testi uygulanır. Çalışma, geleneksel ve İslami bankalardaki performansın seçilen eyaletlerde farklılık gösterdiğini ortaya koymaktadır. Özellikle, bulgular İslami bankalarda geleneksel finans kurumlarına göre daha az kar, daha fazla çözücü, daha az risk ve daha likittir."
