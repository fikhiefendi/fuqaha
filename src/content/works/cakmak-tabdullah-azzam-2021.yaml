abstract: "Selefîlik, İslâmın ilk üç kuşağının inanç alanındaki görüşlerini olduğu gibi muhafaza etmeyi ilke edinen itikâdî/siyâsî nitelikli, İslâmî bir düşünce okuludur. Selefî düşünce, daha çok Ahmed b. Hanbel'in (ö. 241/855) kurucusu olduğu Hanbelî mezhebi içinde varlığını sürdürmüştür. Sünnet odaklı, itikâdî konularda te'vil karşıtı bu damar, İbn Teymiyye (ö. 728/1328) ile birlikte siyâsî iktidara ve düşünsel muhaliflerine karşı sert bir retorik kullanan, siyasal/toplumsal olaylarda insiyatif alarak iktidar ve topluma yön verme çabası içine giren bir ekol kimliğine bürünmüştür. Selefîlik, Muhammed b. Abdilvehhâb (ö. 1206/1792) ile birlikte İbn Teymiyye ve takipçilerinin benimsediği üslubun ötesine geçerek, tekfîr ve şiddeti birer mücâdele, ikna ve tebliğ mekanizması olarak kullanan bir ekol kimliğine bürünmüştür. Afganistan'ın 1979'da Sovyetler tarafından işgal edilmesi üzerine Filistinli bir akademisyen olan Dr. Abdullah Azzâm, (ö. 1989) bölgeye intikâl ederek Mektebu'l-Hıdemât li'l-Mücâhidîn'i (Mücahitlere Hizmet Bürosu) kurmuş ve Üsâme b. Ladin'in (ö. 2011) desteğini de alarak Selefî orijinli on binlerce gönüllünün bölgeye intikâlini sağlamıştır. Kendisini Selefî olarak tanımlayan Azzâm, söz konusu teşkilatın faaliyetleri aracılığıyla Selefîliğin evrildiği son aşama olan Cihâdî Selefîliğin fizikî alt yapısının, cihad hakkında kaleme aldığı eserler aracılığıyla da Cihâdî Selefîliğin fikrî alt yapısının temellerini atmıştır. Arapça bir sıfat terkîbi olan;“السلفية الجهادية/es-Selefiyyetü'l-Cihâdiyye”, lugat itibariyle;“Cihatçı Selefîlik”manasına sahiptir. Terim manası ise; akîdevî boyutta Selefî öğretiyi, hareket metodu boyutunda cihad mefhumunu merkeze alan el-Kâide, DÂİŞ ve uzantıları tarafından temsil edilen modern İslâmî akımı ifade etmektedir. Azzâm'ın 1989 yılında öldürülmesinin ardından Üsâme b. Ladin'in Azzâm'ın temelleri attığı fizikî/beşerî alt yapıyı büyük ölçüde devralması sonrasında Cihâdî Selefîlik bir anlamda teşekkül sürecini tamamlamış, bir devleti olmayan ancak çok geniş bir tabanı ve etkinlik alanı olan küresel bir aktöre dönüşmüştür. Bu çalışmamızda Cihâdî Selefîliğin teşekkül sürecini, fikrî arka planını, temel hedef olarak da Azzâm'ın teori ve pratikleri itibariyle Cihâdî Selefîliğin teşekkül sürecinde oynadığı rolü ele almaya çalıştık."
