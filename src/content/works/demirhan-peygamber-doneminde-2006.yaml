abstract: "TEZ ÖZETİTEMEL İSLÂM BİLİMLERİ ANABİLİM DALIİSLAM HUKUKU BİLİM DALIYahya DEMİRHANVergi, tarihi ve sosyal bir olgudur. Günümüz toplumlarında en gelişmişhaliyle görülen vergileme süreci ve kurumu, özellikle binlerce yıllık insanlıktarihinde, giderek gelişen toplumsal ve ekonomik nedenlere ve şartlara bağlıolarak bu güne kadar gelmiştir.İnsanlık tarihinde ilk rastlanan vergi ödemeleri, bireylerin emeği ile katılmaşeklinde toplumsal yaşamdan doğan genel ve toplumsal ihtiyaçları gidermesişeklinde kendisini gösterir. Toplumda mülkiyetin genel esaslarının ortaya çıkmayabaşladığı ikinci aşamada bireyler kamu hizmetlerinin görülmesine ve toplumsalihtiyaçların karşılanmasına mal ve ürün olarak ödemeler şeklindekatılmaktadırlar. Üçüncü aşamada ise bireyler ve topluluklar vergi niteliğindekiödemelerini artık para ile yapmaktadırlar. Bu uygulama günümüzde de bu şekliyledevam etmektedir.İslâm vergi sistemi yaklaşık yirmi senelik bir düzenlemeye ve uygulamayabağlı bir gelişim sonunda kurumlaşmıştır.İslâm vergi sisteminde vergilerin isim ve nispetleri, vergi mükellefinindurumuna göre değişir. Bu da büyük ölçüde Müslüman devletin vatandaşı olankişinin müslim veya gayr-i müslim olmasına bağlıdır. Bu bakımdan, İslâmdünyasında vergiler genel olarak; Müslümanlarla ilgili vergiler ve Gayr-imüslimlerle ilgili vergiler olmak üzere iki kategoride incelenir.Hz. Peygamber devletin mali yapısının temel taşı olan verginin kurumlaşmasıilgili olarak şu düzenlemeleri yapmıştır:Müslümanların ödemek zorunda oldukları vergiler ile Müslümanolmayanların ödemek zorunda oldukları vergiler ayrılmıştır. Zekâta tabi olanmalların Müslümanlara ait olan mallar olduğu, bu mallardan hangi oranda vergialınacağı ve zekât yükümlülüğü gerektirecek olan nisap miktarları belirlenmiştir.Zekât mallarının toplanma zamanı belirlenmiş, düzenli bir şekildetoplanması için görevliler atanmış, toplanan zekâtlar kayıt altına alınmış, titizliklekorunmuş ve Kur'an'da belirtilen yerlere dağıtılmıştır.Hz. Peygamber vergi kurumu ile ilgili olarak her aşamada kurumlaşmanıntemellerini atmış ve böylece toplanan vergilerle devletin mali yapısının temelioluşturulmuş, kamu harcamaları karşılanmış, ordunun ihtiyaçları giderilmiş veihtiyaç sahipleri korunup gözetilmiştir."
