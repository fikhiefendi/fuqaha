abstract: "İslam tarihinin önemli şahsiyetlerinden bir olarak Ömer b. Abdulaziz'in yönetim hayatında önemsediği temel hususları ele aldığım,“Ömer b. Abdulaziz'in Yönetim Sistemi: İslami Siyaset Anlayışının Tarihi Perspektiften İncelenmesi”başlıklı bu tez çalışmam üç bölüm ve bir sonuçtan oluşmaktadır. Tezim üç bölüm ve bir sonuçtan oluşmaktadır. Birinci bölümde Ömer b. Abdulaziz'in hilafet öncesi hayatı ile hilafeti döneminde izlediği politikayı konu aldık. Bu bağlamda birinci bölümde onun doğumu, nesebi, ailesi, karakteristik özellikleri, ilmi seviyesi, hocaları, vefatı, hilafete gelmeden önceki yaşam tarzı, kendinden önceki halifeler dönemindeki rolü, halifeliğe gelişi, yönetimde izlediği politika vb. hakkında bilgiler yer almaktadır. İkinci bölümde, yönetim kelimesinin sözlük ve kavramsal anlamları açıklanmış, Ömer b. Abdulaziz'in bir yönetici olarak sahip olduğu karakter ve idarede gözettiği ilkeler hakkında bilgiye yer verilmiştir. Üçüncü bölümde Ömer b. Abdulaziz'in brokratik atamalarda izlediği metod ve belirlediği kurallar yer almaktadır. Bu bağlamda bu bölümde onun valilerin tayininde benimsediği kriterler, valileri imtihana tabi tutması, görev ve vazifelerini belirlemesi, valilere verdiği yetkiler, valileri yolsuzluk ve usulsüzlüklere karşı uyarması, valileri görevden alma kriterleri (ki, halife tarafından verilen bir emre isyan, makamına yakışıksız söz ve davranışta bulunmak, reayaya acımamak veya valinin kendi istifası bu kriterler arasında yer alır) hakkında bilgiler yer almaktadır. Ayrıca bu bölümde Ömer b. Abdulaziz'in en meşhur valileri hakkında bilgiler ile alimlerin ve tarihçilerin kendisi ve yönetimi hakkındaki görüşlerine yer verilmektedir. Sonuç bölümünde ise bu mütevazi çalışmamda elde ettiğim en önemli sonuç ve bulgulara yer verdim. Bu mütevazi çalışmamın ilim sevdalılarına faydalı olmasını temenni eder, kusursuzluğun yalnızca Allah'a mahsus olduğu bilinciyle çalışmamın kusursuz olduğu iddiasından imtina ederim."
