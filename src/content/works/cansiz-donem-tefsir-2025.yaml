abstract: "Bu çalışma, Şiî tefsir geleneğinde ahkâmü'l-Kur'ân literatürünü; tarihî süreç, metodoloji ve ilmi dayanakları açısından incelemeyi amaçlamaktadır. Kur'an'ın ahkam âyetlerinin Şiî yorumunun sistematik bir biçimde ortaya konulması, bu araştırmanın temel hedefini oluşturmaktadır. Bu çerçevede, ilk olarak hicri altıncı asırdan günümüze kadar ortaya çıkan ahkâmü'l-Kur'ân türü eserlerin tespiti ve tanıtımı yapılmış, ardından ilk fıkhî tefsir ve onun beslendiği erken dönem rivayet ve dirâyet ağırlıklı eserler üzerinden Şiî fıkhi tefsir geleneği metodolojik açıdan olarak incelenmiştir. Araştırma, Şiî tefsir anlayışının temelini oluşturan rivayet-dirâyet ilişkisinin, özellikle imâmet doktrininin otoritesi altında şekillendiğini ortaya koymaktadır. Şîa'nın imamları masum kabul etmesi, onların söz, fiil ve takrirlerini aslî kaynak hâline getirmiştir. Çalışma, Şiî müfessirlerin ahkâm âyetlerinin yorumunda başvurdukları yöntemleri sistematik başlıklar hâlinde ele almıştır. Bu kapsamda, âyetin zâhirinden hüküm çıkarma, âyetler arası irtibat kurma, sünnetle yorumlama, imamların ahbârıyla hükme gitme, kıraat farklılıklarını delil olarak kullanma, filolojik ve lügavî tahliller, şiirle istişhâd gibi yöntemler ayrıntılı biçimde değerlendirilmiştir. Araştırmada ayrıca, ahkâm âyetlerinin yorumunda Şiî-Sünnî mukayese de yapılmıştır. Buna göre genelde ibadetle ilgili bazı âyetlerin tefsirinde iki gelenek arasında ittifak bulunduğu; ancak imamların yetkisi, velayet, toplum düzeni ve cezalar gibi daha çok itikada ve muamelata taalluk eden âyetlerin tefsirinde ise ihtilaf alanları daha belirgin hâle geldiği görülmüştür. Sonuç olarak bu çalışma, Şiî ahkâm tefsirlerinin tarihî seyri, metodolojik temelleri, mezhep içi farklılıkları ve Sünnî tefsir gelenekleriyle ilişkisini bütüncül bir şekilde değerlendirmekte; Şîa'nın fıkhî âyetleri yorumlarken takip ettiği usûlü, sistematik biçimde ortaya koymaktadır. Elde edilen bulgular, hem Şiî fıkıh düşüncesinin Kur'ânî referanslarını anlamaya hem de mezhepler arası karşılaştırmalı ilmî çalışmalara teorik bir zemin sunmaktadır."
