abstract: "Ürdün'deki kanunları düzenleyenler, ahvâl-ı şahsiyeye dair kanunları belirlerken İslam Şeriatını kendilerine dayanak olarak alıp onu tek esas olarak kabul etmişlerdir. Ancak bu işi yaparken dört mezhebin genel kabul gören fıkhi görüşleriyle yetinmemiş, bazı kanunlar hususunda zaman zaman bunların da dışına çıkarak şaz fıkhi görüşleri almışlardır. Bunu yaparken de kendi usullerine uygun yeni içtihatlara dayanmış ve böylece sosyolojik ve ekonomik birçok değişimin yaşandığı asrımızın bilimsel gerçeklerine daha muvafık düşen sonuçlara ulaşmışlardır. Bu araştırma da, Ürdün ahvâl-ı şahsiye kanununda evlilik ve boşanma konularına dair şaz fıkhi görüşleri bir araya getirmekte ve bunları karşılaştırmalı fıkıh kaidelerince inceleyerek şaz olma boyutunu ele almakta, ayrıca Ürdün'deki kanun düzenleyicilerin bu şaz görüşleri tercihlerinde isabetli olup olmadıklarını, delillerinin kuvvetini ve koydukları kanunlarının vakıaya uygun olup olmadığını tahlil etmektedir."
