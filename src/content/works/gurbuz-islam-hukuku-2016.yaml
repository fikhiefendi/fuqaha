abstract: "İlk çağlarda temel ihtiyaçlarını tabiattan karşılayan insanlar, rahat bir hayat sürmek ve hayat şartlarını iyileştirmek adına bazı arayışlara girmişlerdir. Bunun sonucunda ortaklık, alışveriş, satın alma, borçlanma, kiralama gibi bir takım usulleri geliştirerek ihtiyaçlarını bu yollarla karşılamaya çalışmışlardır. İlk zamanlarda takas yöntemi ile ticaret yapan insanoğlu, ilerleyen süreçte parayı icat ederek ticari hayatını daha da kolaylaştırmıştır. Tarih boyunca altın, ticarette ve sermaye edinmede insanlar tarafından en çok tercih edilen ve kullanılan madenlerden birisi olmuştur. Bu süreç içerisinde hem yatırım hem de tasarruf aracı olan altın, son zamanlarda ise bankaların da ilgi alanına girmiştir. Başlangıçta sadece mevduat hesapları üzerinden altın işlemlerini gerçekleştiren bankalar; zamanla bu işlemleri eksperler yardımıyla vadeli, vadesiz, câri, katılma ve altın depo hesapları seçenekleri ile toplumun hizmetine sunmaya başlamışlardır. Altın hesapları fıkhî noktada işleme konu olan nesnenin altın olması yönüyle sarf akdinin, satın alınan kaydî nitelikteki altınların bankaya yatırılması yönüyle de karz akdinin özelliklerini ve hükümlerini bünyesinde barındırır. Dolayısıyla altın hesapları, her iki akdin özelliklerini bünyesinde bulunduran ve karşılıklı rızaya dayanan güncel ve karma bir akittir. Mevduat ve katılım bankalarında farklı hesaplar olarak açılan altın hesapları fıkhî açıdan açılan hesap türüne göre değerlendirilmektedir. Vadesiz- câri altın hesapları TL ya dolar karşılığı açılan hesaplar gibi fıkhî olarak karz akdi; vadeli altın hesapları, faiz unsurunu bünyesinde bulunduran karz akdi; altın katılma hesapları ise mudârabe akdi olarak değerlendirilmektedir."
