abstract: "Usul meselelerinin klasik mantık-felsefe diliyle ifade edildiği ve yeniden ele alındığı bir dönemde yaşayan Sübkî, mütekellimîn usul geleneğinin kendisinden önceki birikimini eseri Cem'u'l-cevâmi'e taşımıştır. Nitekim söz konusu birikimi mütekellimîn usul düşüncesinde klasik sonrası dönemde ortaya çıkan, Râzî ve Âmidî'ye dayanan iki farklı çizgi üzerinden tevarüs etmiştir. Bu anlamda Sübkî'nin eserinde yer alan lafız-tümel ilişkisi Gazzâlî'den itibaren usul düşüncesine girmekle beraber bu ilişkinin detaylandırılması Râzî ve sonraki dönem usulcüler tarafından gerçekleştirilmiştir. Bu tezde, literatürde tümel kavramıyla ilişkilendirilen âmm lafzın delâleti ele alınmış ve klasik mantığın delâlet şekillerinden hangi delâlet türünün altında yer aldığına dair tartışmalar konu edilmiştir. Bunun yanı sıra mantık-felsefe disiplinine ait tümel kavramının mutlak lafızlar ve emir sigaları bağlamında ne şekilde ele alındığı ve usulcülerin tümellerin ontik gerçekliği üzerinden benimsedikleri nazarî tavrın onların mutlak lafız ve emir sigaları hakkındaki tasavvurlarına nasıl etki ettiği ortaya konulmuştur."
