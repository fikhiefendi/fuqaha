abstract: "1750-1843 yılları arasında Siirt'te yaşayan Molla Halil Es-Si'irdî, gerek düşünce ve fikirleriyle gerekse de muhtelif alanlarda ortaya koymuş olduğu eserleriyle son dönem Osmanlı ilim ve fikir hayatına büyük katkılar sunan alimler arasında yer almıştır. Müellif fıkıh, hadis, tefsir, tasavvuf gibi İslami ilimlerin birçok alanında eser telif etmiş velut bir alimdir. Ortaya koymuş olduğu bu eserlerinin bazısı sadece isim olarak bilinse de diğer bir kısmı matbu olarak o gün bugündür kimi medreselerde ders kitabı olarak okutulmaktadır. Ayrıca Siirt'in 18. ve 19. yüzyılda ilim ve kültür merkezi olmasında Molla Halil'in büyük katkısı olmuştur. Bizim bu araştırmadaki amacımız Es-Si'irdî'nin el-Kâfiyetü'l-Kübrâ fi'n-Nahv adlı eserinde Kur'ân âyetleriyle yapmış olduğu istişhâdların İbnü'l-Hâcib'in el-Kâfiye fi'n-Nahv adlı eserdeki âyet istişhâdlarıyla mukayesesinin yapılıp aralarındaki farkın ortaya konulmasıdır. Bu minvalde çalışmamız üç bölümden oluşacaktır. İlk bölümde her iki müellifin hayatı, hocaları, eserleri ve bu eserlerin muhtevaları hakkında bilgiler verilecektir. İkinci bölümde ise Arap Edebiyatındaki istişhâd kavramı ve çerçevesi genel anlamda ele alınacaktır. Araştırmamızın asıl konusu olan üçüncü bölümde ise bahsi geçen eserde Molla Halil'in nahiv kurallarını ortaya koyarken Kur'ân-ı Kerim'den yapmış olduğu istişhâdları tek tek tahlil edilerek daha sonra İbnü'l-Hâcib'in, el-Kâfiyesi'de aynı konuda hangi âyetleri istişhâd ettiği ve her iki müellifin ortak-farklı yönleri ortaya konulacaktır. Öyle umut ediyoruz ki bu araştırmamız Molla Halil'in nahivdeki yöntemiyle alakalı literatüre mütevazi bir katkıda bulunur."
