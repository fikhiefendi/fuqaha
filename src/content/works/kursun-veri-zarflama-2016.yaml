abstract: "VERİ ZARFLAMA ANALİZİ İLE PERFORMANS DEĞERLENDİRME: KATILIM BANKACILIĞI SEKTÖRÜNDE BİR UYGULAMA Seda KURŞUN İstanbul Ticaret Üniversitesi Fen Bilimleri Enstitüsü Endüstri Mühendisliği Anabilim Dalı Danışman: Yrd. Doç. Dr. Ali Osman KUŞAKÇI 2016, 97 sayfa Performans değerlendirmesi çalışmalarında hangi birimin etkin olduğunun bulunması, etkin olmayan birimlerin etkin hale gelebilmeleri için ne gibi aksiyonlar alması gerektiği belirlenmelidir. Bu iş çok sayıda girdi ve çıktının söz konusu olduğu sistemlerde oldukça zordur. Bankacılık sektöründe yaşanan rekabet, bankaların kaynaklarını etkin şekilde kullanmasını gerektirmektedir. Bu durum bankaların sıklıkla kapsamlı performans ölçüm çalışmaları yapmalarını zorunlu kılmaktadır. Birçok farklı yöntemin yanında bankacılık sektöründe yer alan kurumların performansının değerlendirmesinde Veri Zarflama Analizi (VZA) yaygın olarak kullanılan bir yöntemdir. Bu çalışma Katılım Bankacılığı Sektöründe yer alan üç ana müşteri tipine (bireysel, ticari ve kurumsal müşterilere) hizmet vermekte olan 135 şubesinin etkinliği VZA yöntemi ile ölçülmüştür. Şubeler mevcut müşteri sayılarına göre gruplara ayrılmış ve her bir grup içerisinde yer alan şubelerin etkinliği o grupta yer alan şubelere göre CCR (Charnes-Cooper- Rhodes) ve BCC (Banker-Chaenes- Cooper) yöntemleri ile ölçülmüştür. VZA çalışması sonucu elde edilen bulgular ışığında bağıl verimliliği düşük olan şubelerde nasıl iyileştirilmeler yapılabileceği tartışılmıştır."
