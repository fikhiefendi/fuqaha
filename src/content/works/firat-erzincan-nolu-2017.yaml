abstract: "Şer'iyye sicilleri; Osmanlı Devleti ile ilgili, devletin işleyişi ve halkın o dönem-deki sosyal ve kültürel hayatı ile ilgili başvurabileceğimiz en önemli kaynaklardan biri-dir. Bu defterler; halk arasındaki her türlü hukuki ve cezai uyuşmazlıkların çözülerek kayda alındığı ve akd, vekâlet gibi işlemlerini de kapsayan kayıt defterleridir. Bu bakımdan şer'iyye sicillerinin incelenmesi ve tahlil edilmesi hem tarihimize hizmet hem de İslam Hukukunun Osmanlı Devletinde uygulanışı hakkında aydınlatıcı bilgi vermesi açısından önem taşımaktadır. Erzincanꞌa ait günümüze ulaşabilmiş sadece dört adet şer'iyye sicili bulunmaktadır. Çalışma konusu olarak aldığımız defter; Erzincan C-55 Numaralı Şer'iyye Sicili adıyla Ankara Milli Kütüphane arşivinde kayıtlıdır. Çalışmamızı dört bölüme ayırdık. Birinci bölümde; Şer'i mahkemeler ve şer'iyye sicilleri hakkında bilgi verdik. İkinci bölümde; defterimizi ve davaların işleyiş sürecini tanıttık. Üçüncü bölümde; İslam Hukukuna göre davaları değerlendirmeye çalıştık. Dördüncü bölümde ise orijinal metnin transkripsiyonu yer almaktadır. Çalıştığımız dönemde Erzincan'da müslümanlar ile gayr-i müslim tebaadan olan Ermenilerin bir arada yaşadıkları görülmüştür. Gayr-ı müslimlerle Müslümanlar arasında alacak-verecek içerikli 2 dava dışında önemli bir olayın olmaması, dini kimliği farklı olan insanların bir arada mutlu ve huzurlu yaşadıklarını göstermektedir. Belgelerden, mahkemelerin işleyiş süreci ve verilen kararların İslam Hukukuna göre uygulandığını görmekteyiz. Bu da, İslam Hukukunun pratik hayattaki uygulamalarını kavramamıza ve teorik yönünü daha iyi anlamamıza yardımcı olmaktadır."
