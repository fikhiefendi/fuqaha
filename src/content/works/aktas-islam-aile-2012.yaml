abstract: "Bu tez, Cumhuriyet Üniversitesi Sosyal Bilimler Enstitüsü'nde Yüksek Lisans Tezi olarak hazırlanmıştır. Bu tezde, talâk kavramı, talâk çeşitleri, ehliyet arızaları ve bu arızaların talâk üzerine etkileri incelenmiştir. Bu tez, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde, ehliyet kavramı, ehliyet çeşitleri, talâk kavramı ve talâk çeşitleri hakkında ana hatlarıyla bilgi verilmiştir. Birinci bölümde, semâvi arızaların talâk üzerine etkileri işlenmiştir. İkinci bölümde, müktesep arızalarından sayılan hallerin talâk üzerine etkileri ele alınmıştır. Sonuç bölümünde, çalışmamızla ilgili genel bir değerlendirme yapılmıştır."
