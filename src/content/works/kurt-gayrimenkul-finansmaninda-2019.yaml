abstract: "Bu çalışmada, faizsiz bir gayrimenkul finansman yöntemi olan elbirliği modeli ayrıntılı bir şekilde incelenmiştir. Katılım bankaları, gayrimenkul finansman sektöründe yeterli paya sahip değildir. Artan maliyetler ve rekabet güçlüğü katılım bankaları için gayrimenkul finansmanını cazip kılmamaktadır. Çalışmanın uygulama bölümde, katılım bankalarının gayrimenkul finansman yöntemi ile elbirliği modeli karşılaştırılmıştır. Sonuç olarak katılım bankalarının elbirliği modeli ile gayrimenkul finansmanı sağlamalarının klasik yöntemlere göre daha avantajlı olduğu saptanmıştır. Katılım bankasının klasik yöntemlerle 10 yıl vadeli, 100.000 TL gayrimenkul finansmanı sağlamasının vade sonundaki getirisi 137.224,15 TL olarak hesaplanmıştır. Katılım bankasının elbirliği yöntemlerinden biri olan peşinatsız çekilişli yöntem ile 10 yıl vadeli 100,000 TL gayrimenkul finansmanı sağlamasının vade sonundaki getirisi 2.884.152,78 TL olarak hesaplanmıştır. Katılım bankasının elbirliği yöntemlerinden biri olan peşinatlı çekilişli yöntem ile 10 yıl vadeli 100,000 TL gayrimenkul finansmanı sağlamasının vade sonundaki getirisi 4.118.868,51 TL olarak hesaplanmıştır. Katılım bankasının elbirliği yöntemlerinden biri olan vade ortası teslim yöntemi ile 10 yıl vadeli 100,000 TL gayrimenkul finansmanı sağlamasının vade sonundaki getirisi 3.598.672,49 TL olarak hesaplanmıştır. Katılım bankasının elbirliği yöntemlerinden karma bir yöntem oluşturularak peşinat verilmeden vade ortası teslim ile 10 yıl vadeli 100,000 TL gayrimenkul finansmanı sağlamasının vade sonundaki getirisi 796.200,44 TL olarak hesaplanmıştır."
