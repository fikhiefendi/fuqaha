abstract: "Çalışmamız kapsamında, günümüz Türkiye'sinde yürürlükte bulunan Türk Miras Hukuku ile İslam Miras Hukuku, anne baba mirasçılığı ve ölüme bağlı tasarruflar bakımından mukâyese edilmiştir. İki hukuk sisteminde yer alan farklılıklara temel oluşturabilecek bazı faktörler incelenmiş, İslam Miras Hukuku ve Türk Miras Hukuku'na etkileri ortaya konulmuştur. Toplumun temel taşı olan aile kurumunu bir arada tutmak konusunda en önemli etkenlerden biri olan miras müessesesini, tezimizi oluşturan konular özelinde mukâyese edilmesi amaçlanmıştır."
