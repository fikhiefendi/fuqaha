abstract: "Endülüs'te amelî bid'at tartışmaları, İslâm düşünce tarihinde çoğu zaman teorik çerçevede ele alınan bid'at meselesinin belirli bir coğrafya ve tarihî bağlam içindeki somut görünümlerini ortaya koymaktadır. İbn Vaddâh'ın el-Bida' ve'n-Nehyü anhâ, Turtûşî'nin Kitâbü'l-Havâdis ve'l-Bida' ve Şâtıbî'nin el-İ'tisâm eserleri etrafında şekillenen bu birikim, bid'at kavramının Endülüs'te yalnızca ilmî bir tartışma olarak değil, ibadet hayatından mescit düzenine, toplumsal ilişkilerden idarî uygulamalara kadar çok yönlü bir mesele olarak ele alındığını göstermektedir. Endülüs coğrafyasında farklı asırlarda yaşayan bu üç müellifin bid'at anlayışları mukayeseli biçimde değerlendirildiğinde hem ortak bir sünnet hassasiyetinin hem de tarihî süreçte giderek genişleyen bir tartışma alanının olduğu söylenebilir. Çalışmanın ilk bölümünde müelliflerin hayatları, ilmî şahsiyetleri, içinde bulundukları siyasî ve toplumsal çevre ile eserleri, ağırlıklı olarak tabakât ve tarih kaynakları üzerinden tetkik edilmiştir. Nitekim bu incelemeyle İbn Vaddâh'ın Endülüs'te hadis merkezli anlayışın yerleşmesinde öncü bir rol üstlendiğini, Turtûşî'nin bid'at meselesini toplumsal ıslahla irtibatlı biçimde ele aldığını, Şâtıbî'nin ise aynı meseleyi daha sistematik bir çerçeveye kavuşturduğu ortaya konmuştur. İkinci bölümde bid'at kavramının câhiliye şiirindeki ve lügatlerdeki örnekleri, Kur'ân-ı Kerîm'deki kullanımı, hadislerdeki bağlamı ve sahâbe ile tâbiîn dönemindeki kullanımları ele alınmıştır. Bu çerçevede kavramın sözlükte“ilk defa ortaya çıkma”ve“sonradan ihdâs etme”gibi bir anlam alanına sahip olduğu; hadislerde ise sünnetin mukabili olan bir dinî muhteva kazandığı tespit edilmiştir. Aynı bölümde literatürde iki ana yaklaşımın teşekkül ettiği görülmüştür: Şer'î esaslara aykırı olmayan bazı yenilikleri olumlu bir çerçevede değerlendiren geniş kapsamlı yaklaşım ile özellikle ibadet alanında selef uygulamasına dayanmayan ihdâsları bid'at ve dalâlet kapsamında gören dar kapsamlı yaklaşım. Endülüslü üç müellifin bu ikinci çizgide yer aldığı sonucuna ulaşılmıştır. Üçüncü bölümde Endülüs'te bid'at kavramının somut ve amelî tezahürleri, ibadetlere dair meseleler ile sosyo-kültürel hayata dair meseleler şeklinde iki ana eksende değerlendirilmiştir. Mescitlerin süslenmesi, bazı özel gün ve gecelerin ihyası, mevlid kutlamaları, gayrimüslimlerin bayramlarına iştirak edilmesi, hutbede sultanın isminin zikredilmesi, halktan haksız vergi alınması, idarî makamlara liyakatsiz görevlendirmeler yapılması gibi başlıklar üzerinden bid'at söyleminin yalnız ibadet biçimleriyle sınırlı kalmadığı ortaya konulmuştur. Bu yönüyle İbn Vaddâh, Turtûşî ve Şâtıbî'nin eserleri birlikte okunduğunda, bid'at literatürünün, yalnızca fıkhî tartışmaları değil, Endülüs toplumunun ilmî, ahlâkî ve siyasî gelişmelerine de ışık tutan önemli bir kaynak hüviyeti taşıdığı anlaşılmıştır."
