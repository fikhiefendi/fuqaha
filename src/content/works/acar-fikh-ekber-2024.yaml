abstract: "Ebû Hanîfe'ye nispet edilerek oğlu Hammâd tarikiyle gelen Fıkh-ı Ekber risâlesine özellikle Osmanlı zamanında pek çok şerh yazılmıştır. Osmanlı ulemasının risâleye gösterdiği bu ilgiye karşı Ebu'l-Müntehâ el-Mağnisavi de kayıtsız kalmamış ve biri mufassal diğeri muhtasar olmak üzere iki şerh telif etmiştir. Bu şerhler Osmanlı coğrafyasında yayılmış, ulema ve talebe tarafından teveccüh görmüştür. Bir giriş ve üç ana bölümden oluşan bu çalışmada Mağnisâvî'nin hayatına ve onun Fıkh-ı Ekber şerhlerine odaklanılmıştır. Çalışmanın ilk bölümü, Mağnisâvî'nin ve onun Fıkh-ı Ekber şerhlerinin literatürdeki yerini tespit etmek amacıyla Fıkh-ı Ekber risâlesine ve Osmanlı döneminde bu risâle üzerine yapılan şerh çalışmalarına ayrılmıştır. İkinci bölümde çalışmanın ana unsurunu oluşturan müellif Ebu'l-Müntehâ'nın hayatı, ilmi kişiliği ve eserleri ile onun Fıkh-ı Ekber şerhleri incelenmiştir. Bunun yanında şerhlerin yazılış amaçları hakkında bilgi verilmiş, muhtasar şerhin isimlendirilmesi ve ona aidiyeti konusunda problemler oluşturularak çözüm arayışına girilmiştir. Üçüncü bölümde ise mufassal ve muhtasar şerhin ayırt edici özellikleri ve literatürdeki yerleri tespit edilmeye çalışılmış, sonuç kısmında konu ile ilgili değerlendirmede bulunulmuştur."
