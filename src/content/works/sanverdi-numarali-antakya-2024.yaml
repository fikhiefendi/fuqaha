abstract: "Şer'iyye sicilleri, kayıt kaydı alındıkları dönemdeki ilgili yerleşim birimlerine ait siyasi, ekonomik ve sosyal bölümler hakkında detaylı sunulan veriler ve kaynaklardır. Bu kayıtlar, kadılar veya kadıların yardımcılığını yapan naiplerin gözetiminde kaleme alınan siciller, bir bölge şeri mahkemelerinde kayıtlı hukuki davaları içerden şehir tarihi açısından elzem öğeleri barındırmaktadır. Başta bölgenin giyim kuşamı olmak üzere dini, etnik ve siyasi yaşantısı hakkında önemli ip uçları barındırmaktadır.“19 Numaralı Numaralı Antakya Şer'iyye Sicili Transkripsiyon ve Tahlîli”adlı bu çalışmanın kapsamı, H. 1235-1243 M.1819-1828 yılları arasındaki dönemleri içermektedir. Bu çalışmaya konu olan 19. Antakya şer'iyye sicilinin orijinal metni, Ankara'da bulunan Milli Kütüphane'den temin edilmiş olup, Latin Alfabesi ile transkripsiyonu gerçekleştirilmiştir. Bu araştırma; 1819-1828 yılları arasında Antakya Kazası'nın siyasi, ekonomik ve toplumsal yapısı başta olmak üzere birçok konuda bilgi içermektedir."
