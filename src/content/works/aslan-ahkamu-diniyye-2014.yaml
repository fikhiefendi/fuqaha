abstract: "Bu çalışmada 16. yy'da yaşamış olan Hüseyin b. Abdullah eş-Şirvani'nin Rafızi-Kızılbaşlarla ilgili görüşleri ele alınmıştır. Birinci bölümde bu taifenin sözlerine, fiillerine, inançlarına, bu taifenin ikfarına fetva verenlere, insanları mezheplerini kabule zorlamalarına ve Müslümanların ülkelerine saldırmalarına, ikinci bölümde Hazreti Hüdavendigar'ın bu taifeye karşı izlemiş olduğu yönteme, bu taifeyi irşat etmenin gerekliliğine, Şah İsmail'in ilahlık iddiasına, Şeyh Cüneyt ve Şeyh Haydar'ın durumlarına, üçüncü bölümde de üzerinde çalıştığımız eserin tahkikine yer verilmiştir."
