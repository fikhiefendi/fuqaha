abstract: "Bu çalışma, IMF politikalarının gelişmekte olan ülkelerdeki ekonomik kalkınma üzerindeki etkilerini incelemektedir. Özellikle Yemen örneği üzerinden, IMF'nin dayattığı reform programlarının finansal göstergelerde belirli iyileşmeler sağlasa da, halkın çoğunluğu için ekonomik ve sosyal açıdan ağır maliyetler doğurduğu vurgulanmaktadır. Reformların uygulanması sonucunda Yemen'de yoksulluk oranlarının artması, işsizlik seviyelerinin yükselmesi ve yerel para biriminin değer kaybetmesi gibi olumsuz sonuçlar gözlenmiştir. Çalışma, IMF politikalarının kapsamlı ve sürdürülebilir bir ekonomik kalkınmaya katkıda bulunup bulunmadığı sorusuna yanıt aramakta ve bu politikaların kırılgan ekonomiler üzerindeki uzun vadeli etkilerini değerlendirmektedir. Ayrıca, bazı ekonomik göstergelerdeki iyileşmelerin IMF politikalarına değil, petrol fiyatlarındaki artış gibi dış faktörlere bağlı olduğuna dikkat çekilmektedir. Devletin IMF gereklilikleri doğrultusunda rolünü sınırlaması, kriz dönemlerinde halkın ekonomik refahını koruma konusunda yetersiz kalmış ve uluslararası anlaşmalar ile ulusal anayasalar arasındaki dengede sorunlar yaratmıştır. Sonuç olarak, IMF politikalarının kısa vadeli mali iyileşmeler sağlayabilse de, kalkınma ve sosyal refah açısından istenen sonuçları vermediği, aksine ekonomik kırılganlıkları daha da derinleştirdiği belirtilmiştir. Bu bağlamda, alternatif politikalar ve dengeli bir kalkınma yaklaşımı sunmanın önemine dikkat çekilmektedir."
