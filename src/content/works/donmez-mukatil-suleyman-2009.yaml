abstract: "Bu eser çevresinde tespit ettiğimiz kadarıyla Mukâtil'in fıkhî yaklaşımı şu şekildedir:Mukâtil fıkhı oluşturan ilmi sırayla Kur'an, Hadis, meşhur Sahabe ve nadiren de meşhur Tabiîn âlimlerinden alır. Fıkıh anlayışı ise temelde Kur'an üzerinde ve etrafında oluşup, şekillenmiştir. Meseleler karşısında Sahabe ve Tabiin reyine mutlaka müracaat eden Mukâtil otoritelerin bittiği yerde bizzat kendisi rey ve hüküm üretir. Ancak sistematik bir yöntemle fıkhî yorum üretmemiştir. Ancak sorunlar ve ihtiyaçlar seviyesinde kalmıştır. Fıkhî malumatı bütünlük içinde kullanmış, rey ortaya koyarken naslardan bağımsız hareket etmemiştir.Mukâtil daima Kur'an ayetlerinin dilini, bazen de hadislerin dilini açıklar. Zira nasların sadece okunması, anlaşılması için yeterli olmaz. Bundan dolayı Mukâtil nastan doğrudan reye, içtihada geçmemektedir. Istılah açıklamaları, takdim ve tehir, vücuh ve nezâir, nasların anlamını tespit için titizlikle kullanılır. Fıkhî konuların dayandığı farz, vacip, sünnet, nafile, tatavvu, helal, haram, maruf, münker gibi temel fıkhî hükümleri ve kavramları nasıl anlamlandırdığı da Mukâtil'in ifadelerinden hareketle anlaşılmaktadır.Nasların konumunu sebeb-i nuzül, tarihi ortam, ilgili ayet ve hadisler ile sistemli bir tefsir faaliyeti ile açan Mukâtil bunun arkasından naslar arası ilişkiler ağını başta nesh olmak üzere, ruhsat, istisna ve tahsis gibi bağlar içinde açıklar. Göründüğü kadarıyla Mukâtil'in başta Kur'an olmak üzere fıkhî malzemeyi teşkil eden naslara dair olan dil ve bağlam bilgisi onun en ayırdedici özelliğidir."
