abstract: "İlmihaller \"yaygın eğitim\" dediğimiz halkın dini açıdan bilgilendirilmesi konusunda özel bir öneme sahiptir. Ayrıca mahalle mektepleri dediğimiz temel dini eğitimin yapıldığı okul ve kurslarda da temel programı teşkil etmiştir. İlmihal kitaplarında iman, abdest, namaz, oruç, zekât, hac, helal-haram, gibi temel bilgiler yer alır. Bu yönüyle ilmihal, fıkıh ilminin özellikle ibadetlerle ilgili bölümünü teşkil eder. Bu bilgiler her Müslüman'ın günlük hayatta mutlaka bilmesi gereken temel konulardır. İlmihal kitaplarını yazan âlimler bu konuları derli toplu ve ihtilaflardan uzak bir şekilde kolay ve anlaşılır bir üslup içerisinde müstakil kitaplar haline getirmişlerdir. Osmanlı devletinin kuruluş döneminde yaşayan Kutbuddin İznikî, dönemin medreselerinde dersler vermiş önemli bir âlimdir. Mukaddime isimli eseri ilk Türkçe ilmihal kitaplarından birisi olması hasebiyle özel bir öneme sahiptir. Ayrıca bu eser daha sonra yazılan ilmihallere esin kaynağı olmuş değerli bir çalışmadır. Bu çalışma ile müellifi ve eserini tanımaya çalışarak eserin özelliklerini tespite gayret ettik. Müellifin bu çalışmada kullandığı kaynakları tetkik ederek o dönemin fıkıh bilgi kaynaklarını tespite çalıştık. İlk ilmihallerin günümüzdeki ilmihallerle mukayese edilmesine örnek teşkil eden bu çalışma ile ilmihal eserlerinde bulunan konuların nasıl bir seyir takip ettiğini ortaya koymaya çalıştık. Ayrıca eserin tahkiki ile birlikte o zamanki dilde kullanılan kelimelerle günümüzde kullanılan kelimeler arasında nasıl bir gelişme ve değişme olduğunu da ortaya çıkmış oldu."
