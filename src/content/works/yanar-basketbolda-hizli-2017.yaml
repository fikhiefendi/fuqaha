abstract: "Bu araştırma, basketbolda hızlı hücum oyununun müsabaka sonucu üzerine etkisi ve bu etkide savunma ribaundu ve top çalma tekniklerinin aracılık rolününün incelenmesi amacıyla ele alınmış, genel tarama modeli ve ilişkisel tarama modeli kullanılarak hazırlanmıştır. Araştırmada birinci hedefimiz, basketbolda hızlı hücum oyununun müsabaka sonucuna etkisi üzerine kurgulanmış, ikinci hedef olarak bu etkide top çalma teknikleri ile savunma ribaundu tekniklerinin aracılık rolü incelenmiştir. Araştırmaya, 2014-15 Türkiye Beko Basketbol Ligi' nde yer alan 16 takım alınmıştır. Araştırma, 2014-15 Türkiye Beko Basketbol Ligi' nde yer alan 16 takımın çift devre lig usulü oynadığı 1. ve 2. yarı müsabakalarından birer müsabaka ve play off müsabakaları ile sınırlı tutulmuştur. Araştırma verileri, Türkiye Basketbol Federasyonu izin onayı ile 2014-15 Beko Basketbol Ligi Müsabaka görüntüleri üzerinden e-analyze–basketbol e-spor programı kullanılarak görüntü izleme yöntemiyle elde edilmiştir. Müsabaka görüntüleri alınan 16 takımın her bir maçı, hem birinci devre, hem de ikinci devre ve play off müsabakalarının görüntüleri izlenmiş ve analiz programı (e-analyze–basketbol, e-spor) ile değerlendirilmiştir. Araştırma sonuçları, basketbol müsabaka sonuçlarına göre, top çalma, hızlı hücum oyun anlayışı ve ribaunt kazanma ile elde edilen puanlar arasında pozitif yönlü anlamlı bir ilişki olduğunu göstermiştir (r=,386). Bu sonuca göre, basketbolun, hızlı hücum oyun anlayışının top çalma ve ribaund tekniklerinin etkin uygulanmasına dayalı bir taktiksel oyun kurgusu olduğu söylenebilir. Bu doğrultuda basketbol antrenörleri, tüm oyuncularının katıldığı iyi savunma neticesinde, top çalma ve ribaunt kazanma sayısını arttıracak ve hızlı hücum oyun anlayışını ile taktiksel oyun anlayışını benimseyerek, antrenman planlamalarını bu yönde yapmaları önerilmiştir."
