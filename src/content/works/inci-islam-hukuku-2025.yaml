abstract: "Modern dönemde artan ulaşım araçları, ölümlü ve yaralamalı trafik kazalarını beraberinde getirmiştir. Trafik kazaları tüm dünyada her yıl yaklaşık 1,19 milyon insanın ölümüne ve 50 milyon insanın yaralanmasına sebep olmaktadır. Ayrıca trafik kazalarının tüm dünyada meydana getirdiği maddi zarar yıllık ortalama 518 milyar dolar olarak hesaplanmaktadır. Dolayısıyla trafik kazalarının modern zamanın büyük bir problemi olduğu ortadadır. İslam hukukunun klasik dönemlerinde trafik kazaları gibi yaygın bir problem olmasa da İslam hukukunun bünyesinde bu modern probleme çözüm üretecek, üzerine hukuki hükümler ihdas edebilecek potansiyel mevcuttur. Özellikle çalışmamızın asıl konusu olan trafik kazaları sonucunda taksirle öldürme suçu açısından bakıldığında fıkıh kitaplarında kıyas yapılabilecek örneklere rastlanmaktadır. Bu örnekler genelde fıkıh kitaplarında“Diyetler”başlığı altında ele alınan“hata ile öldürme suçu”incelenirken zikredilmektedir. Trafik kazaları sonucunda meydana gelen öldürme suçu modern ceza hukukunda taksirle öldürme olarak ele alınmaktadır. 5237 sayılı TCK'nın 85. maddesinde düzenlenen bu suça karşılık iki yıldan altı yıla kadar hapis cezası öngörülmüştür. İslam hukukunda ise aynı suç tipi,“hata ile öldürme, hata hükmünde olan öldürme ve sebep olarak öldürme”şeklinde üç tür olarak ele alınmaktadır. Bu çalışmada İslam hukukunda ve modern hukukta taksirle öldürme suçu, trafik kazaları özelinde ele alınmıştır. İki hukuk sisteminin trafik konusuna bakışı, taksir ve hata kavramları arasındaki fark, taksirle öldürme suçunun unsurları ve taksirle öldürme suçuna verilen ceza incelenmiştir. Çalışma boyunca mukayeseli bir metot izlenmiştir. Özellikle İslam hukuk sisteminin trafik kazalarında meydana gelen taksirle öldürme suçuna uygulanabilirliğini ortaya koymak adına pratik örnekler verilmeye çalışılmıştır. Taksirle öldürme suçuna yönelik çeşitli çalışmalar yapılmış olsa da bu çalışmanın farkı, konuyu trafik kazaları bağlamında ele alıyor olmasıdır. Böylece modern bir problem olan trafik kazaları ve taksirle öldürme suçu, İslam hukuku açısından açıklanmaya çalışılmıştır."
