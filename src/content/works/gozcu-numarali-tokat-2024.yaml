abstract: "Osmanlı İmparatorluğu bilindiği üzere üç kıtaya hakim olarak yüzyıllarca bu kıtaları yönetmiştir. Bu denli önemli bir imparatorluk askeri, siyasi, sosyal ve ekonomik olarak merak konusu olup, birçok araştırmacının araştırma konusu olmuştur. Ancak büyük bir imparatorluğu bir bütün olarak ele alıp araştırmak oldukça zor olduğundan dolayı bölgesel ve şehirsel araştırmalar günümüzde daha rağbet görmektedir. Şehir araştırmaları için en önemli kaynaklardan bir tanesi Şer'iyye Sicilleridir. Şer'iyye Sicilleri araştırdığımız şehir hakkında geniş yelpazede bilgi aktarır. İçerisinde bulunan belge kayıtları vasıtasıyla o şehrin siyasi, iktisadi ve sosyal hayatları hakkında bilgiler sunar. Özelde şehir tarihçiliği ve genelde Osmanlı İmparatorluğu tarihine katkı yapmak için Tokat'a ait olan 8'Nolu Şer'iyye Sicilini araştırma konusu olarak belirledik. Ele aldığımız tez, giriş kısmı ile birlikte üç bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında Şer'iyye Sicilinin tanımı, önemi ve Tokat'a ait mevcut siciller hakkında bilgiler verilmiştir. Birinci bölümde, araştırma konusunu teşkil eden 8 numaralı Tokat Şer'iyye Sicilinin ayrıntılı bir şekilde tanıtımı yer almaktadır. 3 başlıktan meydana gelen ilk bölüm H. 1217- 1219/M. 1802-1805 tarihli Tokat Şer'iyye Sicili, sicilde bulunan belgelerin konulara göre tasnifi ve transkripsiyonu yapılıp ardından özetleri çıkartılan belgelerden oluşmaktadır. İkinci bölüm bizlere Tokat şehrinin tarihi, coğrafi ve idari yapısı hakkında genel çerçevede bilgiler vermektedir. Son bölümü oluşturan üçüncü bölümde de Tokat'ın sosyo-ekonomik yapısı ve müesseseleri hakkında incelediğimiz Şer'iyye Sicili doğrultusunda değerlendirmeler yapılmıştır. Sonuç kısmında ise ele alınan ve yazılan tezin genel değerlenmesi yapılıp sonuca bağlanmıştır."
