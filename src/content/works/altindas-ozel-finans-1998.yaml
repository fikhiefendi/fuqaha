abstract: "Faizli Bankalara Alternatif olarak kurulan Özel Finans Kurumlan 2. Dünya savaşını müteakip Hint Yarımadasındaki Müslüman alimlerin teorik çalışmalarına dayalı olarak ilk defa Mısır, Hindistan ve Güney Afrika'da denenmiştir. Daha sonraları Arap sermayesiyle Dünya'nın çeşitli yerlerinde ticari bankalara benzer tarzda örgütlenerek faaliyete geçen Özel Finans Kurumları Sudan, İran ve Pakistan'da organizeli çalışma göstermişlerdir. Türkiye'de ise 15 yıldan bu yana faaliyet gösteren Özel Finans kurumlarının Türkiye finans sektöründeki önemi büyüktür. Özel Finans Kurumlarının kuruluşu, diğer bankalara nazaran çok kısa olmasına rağmen bankacılık sektörüne göre çok kısa sayılabilecek bir süre içinde ulaşılan bu yüksek pazar payını tamamen; Türkiye 'nin nüfusunun %99 gibi çoğunluğunun müslüman olmasından ve bazı kesimlerin faize sıcak bakmamasından elde etmiştir. Özel Finans kurumlarının Türkiye'de kurulmasına izin verilmesinin nedeni; petrol üreticisi İslam ülkelerinde biriken önemli döviz rezervlerinin (petro dolarların) ülkemize kazandırmak için ve yurt içinde faize karşı olan kesimlerin elinde bulunan tasarrufların finans sistemine aktarılması düşüncesinden kaynaklanmıştır. İşte bu yüzden Makro ve Mikro seviyede ülke ekonomisi açısından önemli olduğu düşüncesiyle Özel Finans Kurumlarını tez konusu olarak seçtim. Çalışmamı 4 bölüm altında incelemeye çalıştım. Tezin birinci bölümünde Faiz ve Finans kavramları üzerinde bilgiler verildi. Tezin ikinci bölümünde ise ; İslam Bankacılığının tanımı, tarihçesi, kuruluşu, amaçları, hedefleri ve bu alanda öne sürülen teorilerden ve bu teorilerin değerlendirilmesinden oluşmuştur. Ayrıca Faizli ve Faizsiz bankaların karşılaştırılması üzerinde duruldu. Tezin Dördüncü Bölümünde ise; Dünya'daki ve Türkiye'deki Özel Finans Kurumları ele alındı. Ayrıca Türkiye'deki Özel Finans Kurumları ayrı ayrı incelendi. Tezin Sonuç Bölümünde ise ; Elde edilen bilgiler ışığında Özel Finans Kurumları değerlendirildi."
