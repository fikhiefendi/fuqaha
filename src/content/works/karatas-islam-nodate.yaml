abstract: "Bilgi teorisi, bir mantık ve kelâm konusu olarak kabul görmesine ve tedvîn edilen ilk dönem fıkıh usulü eserlerinde müstakil olarak yer verilmemesine rağmen İslâm hukuku açısından önemli bir yere sahiptir. Özellikle şer'î delillerin sübût ve delâlet açısından ifade ettiği bilginin kat'i ya da zannî olması, İslâm hukuku açısından önemlidir. Sübut ve delâlet açısından kat'î olan deliller, ictihada ve yoruma kapalıdır. Zannî olan deliller ise ictihad alanıdır. İhtilafın yaşandığı alan da bu alandır. Zannî bilginin delil değeri etrafında sürdürülen tartışmalar yeni bir durum değildir. Bilhassa sünnet bağlamında bu tartışmaların, imamlar dönemi dediğimiz dönemde de var olduğunu İmam Şâfiî'nin eserlerinden anlamaktayız. En başından itibaren ciddi bir ilmi temele dayandırılmadan zannî bilginin delil olamayacağıyla ilgili ortaya atılan iddialar, âlimler tarafından ilmi olarak cevaplandırıldığı halde sebebi anlaşılmaz bir şekilde hâlâ bazı kesimler tarafından devam ettirilmektedir. Biz de bu tezde, âlimler tarafından değişik konu başlıkları altında işlenen zannî bilginin delil değerini detaylı bir şekilde araştırdık. Araştırma, temelde üç ana bölüm ve bir sonuç kısmından oluşmaktadır. Birinci bölümde, İslâm hukuku alanında bilgiye genel bakış üzerinde durulmuştur. Bu kapsamda, usûlcülere göre bilginin mahiyeti, tanımı, kısımları, değer kapsamında ilişkili olduğu kavramlar ve bilginin kaynakları işlenmiştir. İkinci bölümde, İslâm hukukunda zannî bilginin delil değeri üzerinde durulmuştur. Bu kapsamda, delil ve delil ile ilgili kavramlar, bilginin dereceleri, nasslarda zannî bilginin bulunma şekli, ittifak edilen ve ihtilaf edilen delillerde zannî bilgi ve değeri işlenmiştir. Üçüncü bölümde, İslâm hukukunda zannî bilgiyle amel etmenin hükmü üzerinde durulmuştur. Bu kapsamda, itikâdî ve amelî alanlarda zannî bilgiyle amel etmenin hükmü, zannî bilgiyle amel etmeyi gerekli kılan naklî ve aklî deliller, zannî bilginin delil olabilmesinin şartları, teâruz halinde zannî bilgiyle amel, zannî bilgiyle amel etmeyi reddetmenin hükmü ve zannî bilgiyi reddetmenin dini alanda doğuracağı sonuçlar işlenmiştir. Araştırmamıza sonuç kısmıyla son verilmiştir."
