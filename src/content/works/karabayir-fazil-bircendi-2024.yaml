abstract: "Yazıldığı dönemden itibaren hemen her hukuk eğitiminin temel usul dinamiklerinden olan Ebu'l Berekât en-Nesefî'ye ait Menâru'l Envâr adlı eserin, çok yönlü bir alim olan Fâzıl Bircendî tarafından yapılan şerhinin günümüz neşir standartlarına uygun olarak incelenmesi bu çalışmanın temelini oluşturmaktadır. Bununla birlikte Fâzıl Bircendî'nin şahsiyeti, hocaları, eserleri ve yaşadığı dönem de bu çalışmayla tanıtılacaktır."
