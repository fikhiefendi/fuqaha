abstract: "Üslup özelliklerinden hareketle bir eseri meydana getiren hakkında kanaat sahibi olmak, o eserin edebî değerini ve muhataplar üzerindeki etkisini tespit etmek mümkündür. Bu itibarla Kur'an'ın üslup özellikleri bir taraftan onu meydana getirenin ulvîyetini, Kur'an'ın ilahî kaynaklı olduğunu, icazını ortaya koymakta bir taraftan da iletilmek istenen mesajın anlaşılmasını sağlamakta ve insanları ifade güzellikleriyle etkisi altına almaktadır. Bu durum Kur'an'ın üslup özelliklerinden olan mukayeseli üslup içinde geçerlidir. İşte biz de bu çalışmada ilahî mesajın anlaşılmasına katkı sağlama, Kur'an'ın eşsizliğini ve güzelliğini ortaya koyma, Kur'an nazmının beşer özellikleri doğrultusunda oluştuğuna dikkat çekme, kişilerde vahiy muhteva ve nazmına ait yüksek edebî özelliğin zevkini uyandırma amaçlarını taşıdık. Bu amaçlar doğrultusunda üslup ve mukayese kavramları ile ilgili bilgiler ile Kur'an ayetlerini değerlendirdik. Yaptığımız değerlendirme neticesinde Kur'an'ın mukayeseli üslubuna ait özellikleri tespit etmeye çalıştık. Mukayeseli üslup özelliği olarak fiillere, edatlara, bağlaçlara yer verildiğini, ayetlerin konteksi ve taşıdıkları manalar itibariyle mukayeseli üslup kullanıldığını, bu üslubun Kur'an'da itikat, ahkam, ahlak konuları çerçevesinde olduğunu gördük. Sonuç olarak, mukayeseli üslubun tespit ettiğimiz özellikler doğrultusunda Kur'an'ın üslup özellikleri arasında yer almasını önermekteyiz."
