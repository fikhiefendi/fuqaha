abstract: "Bu çalışmada; dinî ve din dışı türleriyle mûsikî hakkında Osmanlı şeyhülislâm ve müftüleri tarafından verilen fetvaların tespit edilip tasnifinin yapılarak değerlendirilmesi amaçlanmıştır. Çalışmada; fetva, şeyhülislâm/müftü ve mûsikî kavramları ele alınarak Osmanlı şeyhülislâmlarına ait bilinen ilk fetva mecmuasından en son fetvanın yayınlandığı mecmuaya kadar (Arapça-Osmanlıca, matbu-mahtût ayrımı yapılmaksızın) temin edilen fetva mecmualarının tanıtımı yapılıp bu eserlerde bulunan dinî ve din dışı mûsikî ile alakalı fetvalar tespit edildi. Tespiti yapılan fetvalar, içeriklerine ve/veya bugünkü mûsikî bilimine göre tasnife tabi tutuldu. Osmanlı toplumundaki dinî kurum ve kişilerin bu konuda neler söyledikleri, her türü ile mûsikîye nasıl baktıkları, fetvaların verildiği dönemdeki dinî ve din dışı mûsikî kültürü, buna bağlı olarak sosyal hayat ve eğlence hayatının özelliklerinin neler olduğu gibi sorulara fetva penceresinden bakılarak cevap aranıp bir sonuca ulaşılmaya çalışıldı. Çalışma neticesinde; Osmanlı'da şeyhülislâm ve müftülerin çoğunun mûsikînin aleyhinde fetva verdikleri buna rağmen mûsikînin toplumun hemen hemen her kesiminin dinî ve/veya din dışı yaşantısının tamamında her zaman mevcudiyetini muhafaza ettiği görüldü."
