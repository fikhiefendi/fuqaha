abstract: "İlmihal türünün en geniş ve muteber eserlerinden biri olan Mehmed Zihni Efendi'nin Ni'met-i İslâm isimli eserinin mezhep içi tercih usulü kaidelerine göre inceleneceği bu çalışma giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi ve amacı, yöntemi ve kaynakları ele alınmıştır. Birinci bölümde Mehmed Zihni Efendi'nin hayatı ve Ni'met-i İslâm ile birlikte diğer eserleri incelenmiştir. İkinci bölümde belirli tercih usulü kuralları hakkında bilgiler verilmiş ve Ni'met-i İslâm'da bu kurallara uymayan meseleler, mezhebin temel kaynaklarından istifade edilerek incelenmiştir. Sonuç başlığı altında ise elde edilen verilere temas edilmiştir."
