abstract: "Modern dönemdeki küresel çaplı insan hakları hareketi ile birlikte muhakeme alanındaki işkence uygulamalarının önüne geçmek üzere çeşitli ölçeklerde, çok sayıda faaliyet yürütülmektedir. Bu da işkence olgusu üzerine ilmi çalışmalar yapılmasını beraberinde getirmiştir. Konunun İslam hukuk sistemi açısından incelenmesi de önem arz etmektedir. Bu çalışma öncelikle fail, mağdur ve fiil açısından belli niteliklerle sınırlandırılmış modern işkence kavramının klasik fıkıh birikiminde var olan bir tasavvur/şema olup olmadığı sorusu üzerinden kavramsal bir inceleme yapmayı hedeflemektedir. Ardından muhakeme sürecinde, hapis, dayak, korkutma, tehdit vb. fiillerin, davalıyı itirafa zorlamak amacıyla uygulanmasına dair klasik fıkıh doktrinindeki tutumlar mümkün olduğunca objektif biçimde sunulmaktadır. Bu kapsamda itirafı hukuken geçersiz kılacağı düşüncesiyle mutlak olarak işkenceye karşı çıkan menfi yaklaşım ile maslahat ve siyâset-i şer'iyye kavramlarına dayanarak sınırlı bir serbestlik alanı açan müspet yaklaşım ayrıntılı olarak incelenmiştir. Neticede“toplum menfaati ve sanık menfaati”çatışmasında hangisine öncelik verileceğinin, işkenceye karşı tutumlarda belirleyici olduğu sonucuna varılmıştır. Doktrin görüşlerini daha anlaşılır hale getireceği düşüncesiyle, Hz. Peygamber döneminden başlayarak modern döneme kadarki tarihi süreçte yaşanan bazı işkence örnekleri ve bunlara dair yaklaşımlar da bu çalışmada ele alınan bir diğer konudur. Bu araştırma, modernizm sonrası Müslüman araştırmacılar tarafından yapılan akademik çalışmalarda işkence konusunun ele alınma biçimi, klasik doktrinin kullanılması ve yorumuna dair problemlere de temas etmektedir."
