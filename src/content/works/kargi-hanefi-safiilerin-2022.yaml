abstract: "İslam hukuk sisteminde şer'i hükümler kitap, sünnet, icma ve kıyas dediğimiz asli delillerden ve istihsan, istishab, kavli sahabi gibi tali delillerden elde edilir. Edille-i şer'iyye denilen bu kaynaklar, müçtehit imamlarımızın hüküm istinbatında başvurduğu temel kaynaklar ve yöntemlerdir. Bunun neticesinde farklı görüşler ortaya çıkmıştır. Fıkhi mezhepler arasında doğan ihtilaflı meselelerin temelinde müçtehit imamlarımızın usul farklılıkları yatmaktadır. Bu farklılıktan kaynaklanan ihtilaflar insanlara rahmet olmuştur. Bu farklı görüşlerin irdelenip gün yüzüne çıkarılması güncel hayatımızda birçok problemin çözülmesine yardımcı olmaktadır. Yapılan bu çalışmada, İslâm hukukunun önemli dallarından olan Miras Hukuku ile ilgili hususlarda fıkıh hazinemizin iki değerli mezhebi Hanefî ve Şâfiî mezheplerinin farklı görüşleri tespit edilerek her iki mezhebin yaklaşımları incelenmiş ve pratikteki neticeleri tespit edilmiştir. Bu ihtilaflar ve delilleri tespit edilirken bu alanda yazılmış olan muteber eserler ve yapılan çalışmalar esas alınmış ve iki mezhep arasındaki farklı görüşler tahlil ve mukayese edilmiştir. Tezimiz bir giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Girişte araştırma konusu ve kapsamı, araştırmanın önemi, kaynak araştırma ve yöntemi gibi konulara değinilmiştir. Birinci bölümde miras hukukunun mahiyeti ve miras hukukunun genel konuları ana başlıklar altında ele alınmıştır. İkinci bölümde ise Hanefîler ve Şâfiîler arasında meydana gelen ihtilaflar incelenmiştir. Sonuç bölümünde ise miras taksiminde ortaya çıkan problemlerin mezheplerin ortaya koyduğu yöntemlerle nasıl çözüldüğü ve neticeleri belirlenmiştir."
