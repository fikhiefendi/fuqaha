abstract: "Bilişim teknolojisi ve kitle iletişim araçlarındaki ilerlemeler, günlük yaşantımızı önemli ölçüde dönüştürmektedir.“Yeni medya”olarak adlandırılan bu araçlar, karşılıklı etkileşim imkânları sunarak dünyayı küresel bir köy haline getirmiştir. Ancak, bu teknolojik gelişmelerin, topluma sunduğu faydalar ve olanakların yanı sıra bazı olumsuz etkileri de bulunmaktadır. Sanal dünya, kontrol edilemezlik ve sınırların belirsizliği ile karakterize edilen bir yaşam alanı olarak insanların daha özgürce faaliyet gösterebildiği bir platformdur. Ancak, ifade özgürlüğü gibi temel haklar yasal çerçevelerle sınırlıdır. Sosyal hayatta olduğu gibi, hukukî normlar insanları korumak üzere, dijital ortamda da uygulanmalıdır. Bu mecradaki eylemler“sanal”görünse bile doğurduğu sonuçlar gerçektir. Nitekim sanal medyadaki siber zorbalığın;“nefret söylemi”nin,“hedef gösterme”nin,“iftira”nın,“yalan haber”in neticeleri sosyal hayatta daha ağır sonuçlarla karşımıza çıkmaktadır. Dolayısıyla bu da beraberinde, simülasyon olan bu ortamdaki insan ilişkilerini ve sonuçlarını hukukun konusu haline getirmektedir. Dijital platformlarda güncellenen yasal çerçeveler, siber suçlar ve dijital hukuk konularının giderek artan önemini yansıtmaktadır. Bu çalışmada İslâm hukuku açısından dijital medyada kişisel hakların kullanımı ve korunması ele alınmaktadır. Birinci bölümde dijital medya ve İslâm hukuku açısından iletişim esasları; ikinci bölümde dijital medyada makâsıdü'ş-şerîa bağlamında hak ve hürriyetlerin tespiti; üçüncü bölümde ise, dijital ortamda kişisel hakların ihlâl edilmesi ile ortaya çıkan suçlar ve müeyyideleri incelenmektedir"
