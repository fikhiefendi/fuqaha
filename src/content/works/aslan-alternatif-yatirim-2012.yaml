abstract: "Dünya ekonomisinin büyümesiyle birlikte, finansal piyasalar gelişmekte ve her geçen gün yeni bir finansal ürün piyasaya girmektedir. Son yıllarda bu ürünlerin başında faizsiz finansal ürünler gelmekte ve bir çok çeşit sunmaktadır. Faizsiz finansal ürünlerin; portföyleri çeşitlendirmek, farklı ürün ve hizmet sunmak ve piyasadan inançları gereği uzak duran yatırımcıları piyasaya çekmek için iyi bir alternatif oluşturduğu görülmektedir. Faizsiz finansal ürünler arasında en hızlı büyümeyi gerçekleştiren sukuk, Türkiye piyasasına yeni bir ürün olarak sunulmaya çalışılmaktadır. Ülkemizdeki ekonomik durumun istikrarlı olması ve son yıllardaki ekonomik büyümenin dünya ortalamasının üstünde gerçekleşmiş olması dolayısıyla sermaye piyasalarını da olumlu etkilemiştir. Bu nedenle Türkiye piyasası gelişme göstermektedir. Katılım bankalarının, kendi prensipleri gereği faizli finansal piyasa araçlarından uzak durmalarından dolayı Türkiye piyasası faizsiz finansal araçlara ihtiyaç duymaktadır. Sukuk ile bu alandaki açık bir anlamda giderilmeye çalışılmaktadır. Sukuk, Türkiye piyasasına ?kira sertifikası? olarak sunulmuştur. Bu çalışma ile Türkiye piyasasına sunulan sukuk ürünü detaylı bir şekilde ele alınmış, yapısı ve işleyişi anlatılmıştır. Elde edilen nitel ve nicel veriler ışığında sukukun, Türkiye piyasasına iyi bir alternatif oluşturacağı ancak çeşitli eksiliklerinin olduğu görülmüştür. Bu eksiklerin giderilmesi ve sukuk piyasasının etkili bir şekilde büyüyebilmesi için çeşitli öneriler sunulmuştur."
