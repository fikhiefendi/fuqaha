abstract: "Küresel finansal sistemde, bankacılık sektörü genel ekonominin en önemli unsurlarından biridir. Finansal sistemin sağlıklı işleyebilmesi için bankacılık sektörünün ulusal/uluslararası krizlere karşı dayanıklı bir sermaye yapısına sahip olması gerekmektedir. Bundan dolayı bankaların karşılaşabileceği muhtemel risklere karşı, G10 ülkeleri uluslararası denetim standartlarını geliştirmişlerdir. Bankacılık sektörünü muhtemel risklere karşı koruyup, etkin bir risk yönetimi ve denetimi sağlamayı amaçlayan Basel uzlaşıları, Basel Komitesi tarafından ilk olarak 1988 yılında Basel I Uzlaşısı, daha sonra Basel II Uzlaşısı (2004) ve nihayetinde 2010 yılında Basel III Uzlaşısı yayımlanmıştır. Basel III olarak yayımlanan uzlaşıda sermayenin niteliğinin ve niceliğinin artırılması, sermaye koruma tamponu, risk temelli olmayan kaldıraç oranı ve likiditeye ilişkin değişiklikler yapılmış ve Basel III'ün 2019 yılına kadar tüm bankacılık sisteminde kademeli olarak uygulanmasına karar verilmiştir. Basel uzlaşıları çerçevesinde, Sermaye Yeterliliği Kavramı, bir bankanın iflas etmesi halinde mevduat sahiplerinin karşılaşabileceği maliyetleri minimuma indirgemek için asgari olarak tutulması gereken sermaye miktarı üzerine odaklanmış olup, bu yaklaşım küresel bankacılık anlamında risk ölçümüne karşı atılmış önemli bir adım olmuştur. Öte yandan, bankaların karşılaşabileceği muhtemel krizleri önlemek amacıyla banka müşterilerini korumak ve bankacılık sisteminin sağlıklı bir şekilde sürdürülebilirliğini sağlamak adına, bankaların aldıkları riskleri minimize etmek amacıyla getirilen nicel kısıtlamalara ise, sermaye yeterlilik oranı denilmektedir. Diğer taraftan, Türkiye'de son çeyrek yüzyılda önemli bir gelişim gösteren ve göreceli olarak daha muhafazakâr yatırımcıların finansal tercihi olan katılım bankacılığı, makroekonomik açıdan kayıt dışı ekonomiyi önlemeleri ve devletin vergi gelirlerini artırmaları, reel ekonomi açısından topladıkları fonları ticari ve sınaî faaliyetlerde kullanmaları açısından stratejik öneme sahip bir bankacılık türüdür. Bu çalışmanın amacı, Basel Uzlaşılarında yer alan sermaye yeterlilik kavramının stratejik önemi çerçevesinde, Türkiye'de faaliyette bulunan katılım bankalarının Basel III uzlaşısı açısından sermaye yeterlilik oranlarının, grafik analizleri yöntemiyle değerlendirilmesi ve finansal, ekonomik ve siyasi krizler karşısında katılım bankalarının finansal yapılarına olan duyarlılığının betimleyici analiz yöntemiyle incelenmesidir."
