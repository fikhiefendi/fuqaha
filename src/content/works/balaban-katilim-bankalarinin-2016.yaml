abstract: "Katılım Bankaları son yıllarda hızla büyümektedir. Bu büyümenin sonucu olarak ta birçok yeni araştırma için popüler bir alan haline gelmiştir. Kurumsal İtibar ve Örgütsel Vatandaşlık Davranışı (ÖVD) kavramları da son dönemin ilgi çeken araştırma konularıdır. Bu araştırmanın amacı Kurumsal İtibar ve Örgütsel Vatandaşlık Davranışı terimleri arasındaki ilişkiyi Katılım Bankaları üzerinde incelemek ve bu ilişkiyi açıklamaktır. Çalışmada, araştırmaya uygun anket yöntemi kullanılmıştır. Araştırmanın evreni Türkiye'de faaliyet gösteren 4 Katılım Bankasından oluşmaktadır. Uygulanan anketler sonucunda toplam 362 geçerli anket elde edilmiştir. Anketler SPSS programı ile analiz edilmiş ve elde edilen bulgular anlatılmıştır. Yapılan analizler sonucunda Katılım Bankalarının Kurumsal İtibarı ile Örgütsel Vatandaşlık Davranışı arasında pozitif, anlamlı ve orta düzeyde bir ilişkinin olduğu tespit edilmiştir. Bunun yanında Kurumsal İtibar ile Örgütsel Vatandaşlık Davranışı'nın beş alt boyutu arasındaki ilişki incelenmiştir. Araştırma sonucunda Kurumsal İtibar bağımsız değişkeni ile ÖVD'nin 5 alt boyutundan 3'ü olan Sadakat Davranışı, İtaat Davranışı ve İşlevsel Katılım arasında pozitif ve anlamlı ilişkiler olduğu sonucuna varılmıştır."
