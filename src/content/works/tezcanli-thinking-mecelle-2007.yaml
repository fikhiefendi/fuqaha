abstract: "Bu tez, 19. yüzyılın ikinci yarısında hazırlanan ve toplam altıkitaptan oluşan Osmanlı medeni kanunu Mecelle-i Ahkam-ıAdliyye üzerine odaklanarak, imparatorluğun hukuksal yapısının bu dönemde geçirdiği dönüşüme dair genel bir değerlendirme yapmayı amaçlamaktadır. Bu çalışmada, ilk olarak Fransız Medeni Kanunu'nun aynen alınarak uygulamaya konulmasını savunanlar ile İslam hukukunun kodifiye edilerek çağın ihtiyaçlarına ayak uydurabileceğini söyleyenler arasındaki tartışmanın anlamlandırılması hedeflenmektedir. Daha sonra, bu tartışmanın ilerisine gidilerek, artan ticari ilişkiler ile şekillenen bu dönemde özel mülkiyetin ve piyasa ilişkilerinin Meccelle'nin dili içinde nasıl tanımlandığına bakılacaktır. İlk bölümde hukuk sistemi içinde genel bir referans noktası yaratmayıamaçlayan kanunlaştırma hareketine dair genel problemlere değinilmektedir. İkinci bölümde ise, Osmanlıİmparatorluğu'nda gerçekleştirilen hukuki reformlara ve Mecelle'nin hazırlanmasına ilişkin ayrıntılıbilgiler veren anonim bir layiha üzerinden imparatoluğun 19. yüzyılda geçirdigi hukuksal dönüşüme dair alternatif bir bakışsunulacaktır. Son bölümde ise Mecelle-i Ahkam-ıAdliyye, kanunu hazırlamakla görevli olan komisyonun müsvedde notları ile beraber incelenecek ve ticari muamelelerin hukukun genel dili içinde nasıl düzenlendiği ve fiyat, spekülasyon, faiz gibi konuların ne ölçüde tanımlandığıizlenmeye çalışılacaktır. Bu çalışma Mecelle'nin hazırlanmasınısiyasi merkezileşme ve kapitalist pazar ilişkileri bağlamında yeniden düşünerek piyasa ilişkilerinin İslam hukukunun dili içinde nasıl tanımlandığınıanlamayıamaçlamaktadı"
