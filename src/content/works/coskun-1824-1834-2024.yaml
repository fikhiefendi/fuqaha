abstract: "Osmanlı Devleti bâkiyesine ait çok çeşitli arşiv metinleri bulunmaktadır. Önemli bir kayıt türü olarak şer'iyye sicilleri bünyesinde; sosyal, iktisadî, siyasî ve idârî konular barındırmaktadır. Bu anlamda Osmanlı Devleti için önemli bir eyâlet olan Halep Eyaleti'nin, en önemli kazâ merkezlerinden olan Ayntab'a dair, 142 numaralı şer'iyye sicili elbette oldukça kıymetlidir. Böylesi kıymetli olan 142 numaralı GŞS'nin transkripsiyonunu yaparken, belgeleri düzenli biçimde sunabilmek adına her belge için müstakil tablolar oluşturulmuş ve tablolara, hükümlere ait konular özet şeklinde yazılmıştır. Ayrıca belgenin diplomâtik özellikleri, hicrî ve miladî târihleri oluşturulan tablonun sağ üst kısmına eklenmiştir. 142 numaralı GŞS'de çalıştığımız 254-456. sayfaları arasında bulunan toplam 203 sayfada, 225 adet idâri hüküm ve 142 adet hukukî hükmün transkripti yapılıp, hem Ayntab'ın yerel târîhi hemde Osmanlı Devleti'nin mâli ve idâre tarihi açısından kıymetli bilgiler tespit edilmiş olup, hükümler konularına göre usûlünce taksîm edilip, genel hatlarıyla yorumlanmıştır. Böylece H. 1239-1249/ M. 1824-1834 yılları arasında, Ayntab'ın siyasî, sosyal ve iktisadî hayatına dair elde edilen bilgiler, araştırmacıların istifâdesine sunulmuştur."
