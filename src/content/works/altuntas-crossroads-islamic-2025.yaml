abstract: "Bu tez, İslamî ve Batılı insan onuru anlayışları arasındaki çatışmalı ve örtüşen ilişkiyi ve bu ilişkinin yargısal cezalar üzerindeki etkilerini incelemektedir. İnsan hakları literatürüne ağırlıklı olarak odaklanan mevcut kapsamlı çalışmalardan farklı olarak, bu tez insan onurunu uluslararası ve bölgesel insan hakları belgeleri ile İslamî literatür çerçevesinde kavramsallaştırmakta ve bu kavramsallaştırmanın ölüm cezası, bedensel cezalar ve hapis cezası gibi yargısal yaptırımlar üzerindeki sonuçlarını analiz etmektedir. Bu belgelerin hazırlanma sürecindeki müzakereler ve ilgili içtihatların analizi yoluyla tez, insan onurunun anlamını ve cezalarla ilişkisini temel-onur, onura-ilişkin-hak ve aşağılayıcı-onur çerçevesi üzerinden açıklığa kavuşturmaktadır. İslamî onur anlayışları bu değeri reddetmemekte; aksine, kerâmet (karāma) kavramı üzerinden tutarlı bir insan onuru anlayışı inşa etmeye çalışmaktadır. Bununla birlikte, zaman içerisinde insan onurunun uygulanışı, ilk metinleri kaleme alanlar arasındaki uzlaşıdan sapmış ve Şeriat cezalarının uygulanmasıyla gerilimler doğurmuştur. Uluslararası Ceza Mahkemesi'nde (UCM) görülen Al Hassan davası, bu sonucun somut bir örneğini teşkil etmekte; Şeriat cezalarının uluslararası insan hakları belgeleriyle tamamen bağdaşmaz olduğunu ileri sürerek bu cezaları işkence ve insanlığa karşı suçlar kapsamında sınıflandırmaktadır. Tez, sonuç olarak, insan hakları belgelerinin Avrupamerkezci olarak yorumlanmasında yer alan ve ayrışmanın kökeni olarak görülebilecek ilk günahın yeniden gözden geçirilmesini önermektedir. Bu bağlamda, Yargıç Tomoko Akane'nin hukuki çoğulculuk çağrısı, UCM'nin dünya genelindeki ceza biçimlerinin çeşitliliğini dikkate alması için uygun bir başlangıç noktası olabilir."
