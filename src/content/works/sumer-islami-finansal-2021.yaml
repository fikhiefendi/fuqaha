abstract: "Finansal Varlık Fiyatlama Modeli, 1952 yılında Harry Markowitz tarafından geliştirilmiştir. Modern portföy teorisi üzerine inşa edilen model zaman içerisinde yapılan eleştiriler doğrultusunda gelişim göstermiştir. Portföyün beklenen getirisinin sadece risksiz faiz oranı tarafından etkilenmediğini varlıkların değerini etkileyen birden çok faktörün bulunduğu varsayımı üzerine Arbitraj Fiyatlama Modeli geliştirilmiştir. Modelde yer alan risksiz varlık parametresinin İslami finans prensipleri ile uyumlu olmaması üzerine de İslami Finansal Varlık Fiyatlama Modeli geliştirilmiştir. Bu çalışmanın amacı, İslami Finansal Varlık Fiyatlama Modeli ile Arbitraj Fiyatlama Modelinin Katılım 50 Endeksi'ne uygulanabilirliğini test etmektir. Risksiz varlık yerine enflasyon oranı kullanılarak oluşturulan modellerin panel analiz ile test edildiği bu çalışmada, oluşturulan her iki modelin de 2014Q4-2020Q3 zaman aralığında oluşturulan portföylerin beklenen getirilerini hesaplamak için kullanılabileceği sonucuna ulaşılmıştır. Son yıllarda İslami finans alanında yapılan çalışmalardaki artış göz önünde bulundurulduğunda bu çalışmanın İslami finans literatürüne önemli bir katkı yapacağı düşünülmektedir. Çalışmanın sonunda İslami Finansal Varlık Fiyatlama Modelinde risksiz varlık yerine kullanılabilecek değişken önerileri sunulmuştur."
