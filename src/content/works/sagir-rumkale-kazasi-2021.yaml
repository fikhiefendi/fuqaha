abstract: "Bugün yerel tarih araştırmalarında ön plana çıkan şer'iye sicilleri tarih araştırmalarında birinci elden kaynak durumundadır. Sicil defterleri, sözlükte“kadı defteri”,“kadı sicilleri”,“zabt-ı vekâyi”, veya“şer'iye sicil defterleri”gibi çeşitli adlarla anılmaktadır. Bu defterler muhteva açısından çok zengin arşiv kaynaklarıdır. Osmanlı'da bir mahallin en üst yöneticisi olan kadıların tuttukları kayıtlar o yörenin hem adlî hem de idarî çalışmaları ile ilgili olduklarından, her türlü konuyu kapsamaktadır. Tanzimat dönemi sonrasındaki süreçte Şer'iye Mahkemelerinin haricinde Nizamiye Mahkemeleri adı altında yeni bir adlî kurum teşkil olunmuştur. Çalışmada Nizâmiye mahkemelerinin en alt adlî birimi olan kaza idaresindeki Meclis-i Deavî'sinin tutanakları incelenmiştir. Rumkale Kazası Meclis-i Deâvîsinin kayıtları,“Rumkale Kazası Vuku'ât Ceridesi”başlığı altında incelenmiştir. Çalışmada Rumkale (Halfeti) Kazası Vukû'ât Ceridesi'nin transkripsiyon ve değerlendirmesi (H. 1287-1299 / M. 1871-1884) yapılarak, Osmanlı'da bir taşra kenti olan Rumkale Kazası'nın sosyal ve kültürel dokusu üzerine değerlendirmeler yapılmıştır. Konumuz kapsamındaki vukû'ât ceridesinden, kentin iç dinamikleri, aile hayatı, adlî, idarî, ekonomik durumu, Müslüman ve Gayrımüslim ilişkileri ve bu ilişkilerin Tanzimat sonrası dönemdeki yansımaları irdelenmiştir. Tutulan kayıtların günümüz alfabesine çevirisi yapılıp, içerisinde yer alan belgeler sınıflandırılmıştır. Ayrıca belgelerde yer, şahıs ve aşiret isimleri tespit olunup başlıklar altında belirtilmiştir. Bunun yanında Vuku'ât Cerisdesi'ndeki belge ve dava türleri de sınıflandırılmıştır. İncelenen defterde aile içi şiddet, kadın cinayeti, hırsızlık, gasp, evden kaçma, kız kaçırma, darp, yaralama, cinayet, ahalinin malına zarar verme, alacak-verecek, ahalinin huzurunu bozma, sened, şikâyet dilekçesi, hükumetin çağrısına uymama ve diğer belgelerden oluşmak üzere toplam üç yüz doksan adet dava kaydına rastlanmaktadır. Bunlar içerisinde bazı davalar birbirlerinin tekrarı olup kâtip efendi tarafından ikişer defa kaydedilmiştir. Ayrıca davaların yanı sıra merkez idareden gönderilen düzenlemeler ve tebligatlar da defterdeki kayıtlar içerisinde yer almaktadır. Çalışma, yerelde Rumkale (Halfeti) Kazası'nın tarihine ve toplumsal yaşantısına genelde ise Osmanlı Devleti'nin hukukî ve idarî yapısına ışık tutmaktadır."
