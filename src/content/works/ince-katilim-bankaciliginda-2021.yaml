abstract: "Bu araştırmanın amacı, katılım bankalarında dijital dönüşümün müşteri memnuniyetine ve müşteri sadakatine etkisini belirlemektir. Bu amaç doğrultusunda çalışmada nicel yöntem takip edilmesi uygun görülmüş ve nicel araştırma yöntemine başvurulmuştur. Değişkenler arasındaki ilişkilerin belirlenmesi amacıyla nicel araştırma yönteminin ilişkisel tarama modeli tercih edilmiştir. Araştırmanın evrenini Kuveyt Türk Katılım Bankası'nın dijital aktif müşterileri oluşturmaktadır. Evrene göre örneklem büyüklüğü hesaplanarak 385 katılımcıya ulaşılması amaçlanmış ve araştırma kapsamında 389 kişiden veri toplanmıştır. Veri toplama aracı olarak katılım bankalarında dijital dönüşümü ölçmek için“Müşteri Deneyimi Ölçeği”,“Müşteri Tatmini Ölçeği”ve“Müşteri Sadakati Ölçeği”kullanılmıştır. Ayrıca katılımcıların demografik özelliklerini belirleyebilmek için literatür taraması sonucunda oluşturulan demografik bilgi formu kullanılmıştır. Veri toplama sürecinde anket yöntemi tercih edilmiş ve ölçekler Google Formlar aracılığıyla web ortamına taşınmış ve elde edilen anket linki katılımcılarla e-posta aracılığı gönderilmiştir. Verilerin analizinde SPSS 25.0 paket programı ve Microsoft Excel kullanılarak tanımlayıcı ve anlam çıkarıcı istatistiksel bulgular oluşturulmuştur. Değişkenlere ait gruplar arası kıyaslamalarda Mann Whitney U ve Kruskal Wallis testinden yararlanılmıştır. Gruplar arasında farkın hangi gruplardan kaynaklandığını belirlemek için posthoc Bonferroni düzeltmeli Mann Whitney U testi kullanılmıştır. Yapılan analiz sonucunda; katılım bankalarında dijital uygulamalarla ilgili müşteri deneyiminin, müşteri memnuniyetinin, müşteri sadakatinin olumlu düzeyde olduğu sonucuna ulaşılmıştır. Katılım bankalarında dijital uygulamalarla ilgili müşteri deneyimlerinin bağımsız değişkenlerden cinsiyete, yaşa, eğitim durumuna, medeni duruma, dijital uygulamaları kullanma sıklığına göre değiştiği; gelir durumuna göre değişmediği sonucu tespit edilmiştir. Katılımcıların müşteri memnuniyetinin bağımsız değişkenlerden cinsiyete, yaşa, eğitim durumuna, gelir durumuna, medeni duruma ve dijital uygulamaları kullanma sıklıklarına göre değiştiği tespit edilmiştir. Müşteri sadakati ölçeği puanlarının bağımsız değişkenlere göre farklılaşıp farklılaşmadığı incelendiğinde cinsiyete, yaşa, eğitim durumuna, gelir düzeyine, medeni duruma ve dijital uygulamaları kullanma sıklığına göre farklılaşma olduğu tespit edilmiştir. Araştırmanın değişkenleri arasındaki ilişkiler incelendiğinde, dijital dönüşüm ile müşteri sadakati arasında pozitif yönde anlamlı ilişki tespit edilmiştir. Dijital dönüşüm ile müşteri memnuniyeti arasındaki ilişkinin yüksek düzey pozitif bir ilişki olduğu bulunmuştur. Son olarak regresyon analiz sonucuna göre katılım bankalarında dijital dönüşümün müşteri memnuniyetine ve sadakatine etkisinin olduğu tespit edilmiştir."
