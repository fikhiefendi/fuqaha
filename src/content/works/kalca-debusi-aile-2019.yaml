abstract: "Hicri IV. asırda Mâverâünnehir'de yaşamış fıkıh âlimlerinden olan Debûsî, hem usûl hem de fürû ilmindeki yetkinliğiyle tanınmıştır. el-Esrar adlı eseri Hanefî mezhebine mensup müellifin Şâfiî mezhebine de vukûfiyetinin geniş olduğunu okuyucuya göstermektedir. Bu çalışmada inceleme konusu edilen eser hilâf ilmine dairdir. Müellif, mensup olduğu mezhebi münazara usûlü ile savunmaktadır. Eserde delilleri ile ele alınan konular Hanefîler ve Şafiîler arasındaki ihtilaflı konulardır. Eserde Hanefîler ve Şâfiîlerin görüşleri mukayese etmekle yetinilmeyip; Mâlikî ve bazı mutlak müçtehitlerin görüşlerine de yer verilmiştir. Eserin, Kitabu'n-Nikâh bahsine dair seçtiğimiz meselelerin değerlendirilmesini içeren çalışma, giriş ve iki bölümden oluşmaktadır. Girişte hilâf ilmi, birinci bölümde Debûsî ve el-Esrâr adlı eseri hakkında bilgi verilmektedir. İkinci bölümde ise Nikâh bölümü, muhteva ve metot yönünden değerlendirilmektedir. Son kısımda Kitabu'n-Nikâh'tan seçilen örnekler üzerinden meseleler tahlil edilerek Debûsî'nin hükümleri temellendirme metodu ve mezhebini savunma yöntemi hakkında tahlillere yer verilmektedir."
