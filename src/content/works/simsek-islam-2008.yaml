abstract: "Hz. Peygamber'in, asıl vazifesi olan Allah'tan aldığı ilâhî vahyi insanlara olduğu gibi aktarma görevinin (risâlet/teblîğ) yanı sıra, duruma göre onları tefsir etmek, ayetlerin delalet ve işaretlerinden anlaşılan hükümleri bildirmek, insanların sorularına cevap vermek (fetvâ), halk arasında vuku bulan ihtilafları halletmek (kazâ) ve kamu işlerini tanzim etmekle de (imâmet) görevli bulunduğu kabul görmektedir. Bu arada bir insan olmanın doğal sonucu olarak gerçekleştirdiği beşerî tasarruflarıyla, Allah'ın seçtiği bir elçi olması münasebetiyle kendisine ihsan edilen veya husûsî yükümlülükler getiren bir takım özel statü ve şartlar gereği gerçekleştirdiği tasarruflarının da (hasâis) varlığı bilinmektedir. Şüphesiz bu tasarruflar arasında mahiyet ve sonuçları itibariyle bazı farklılıklar bulunmaktadır.Teorik açıdan bakıldığında tez konusunun, şer`î nasları anlama ve yorumlama yetkisinin, yani Rasûlullah'ın vefatından sonra onun siyâsî ve teşrî`î otoritesinin sonrakiler için anlamı ve bu iki fonksiyonun kimler tarafından ne şekilde devam ettirileceği problemiyle doğrudan bağlantılı olduğu anlaşılmaktadır.Çalışma bir giriş ve iki bölümden oluşmaktadır. Girişte kısaca konunun amacı üzerinde durulduktan sonra konuyla doğrudan ilişkili birkaç temel kavram, sadece konuyla bağlantısı açısından izah edilmiştir. Ayrıca girişte konunun tarihî açıdan meşruiyetini, gerçekliğini ve gerekliliğini ortaya koymak amacıyla Hz. Peygamber'in tasarruflarının ayrıma tâbî tutulmasının tarihî süreçteki gelişimi etraflıca açıklanmıştır.Birinci bölümde konunun teorik çerçevesini oluşturan Hz. Peygamber'in ictihadının mahiyet ve meşruiyeti ele alınmıştır. Bu bölümde usûlcülerin konuyla ilgili tartışmalarına detaylı şekilde yer verilmiş, konuyla alâkalı deliller etraflıca incelenerek, Hz. Peygamber'in ictihadının meşruiyeti, sınırları ve onun tasarruflarının tasnifindeki temel rolü ortaya konulmuştur.İkinci bölümde ise önceki bölümlerde zikredilen temele dayalı olarak, İslam hukukunda bağlayıcılık bakımından Hz. Peygamber'in tasarrufları konusu üzerinde detaylı bir şekilde durulmuştur. Bu bölümde İslam hukukçularının konuyla ilgili görüşleri tespit edilmeye çalışılmış, özellikle bu ayrımdan doğan hukukî sonuçlara işaret edilmeye gayret gösterilmiştir. Bu bölümde Hz. Peygamber'in tasarrufları genel itibariyle hukuk kaynağı olma ve hukûkî değer taşıma (teşrî`) açısından değerlendirilmiş, özellikle bu tasarruflardan çıkan hükümlerin süreklilik taşıyıp taşımadığı dikkate alınmıştır."
