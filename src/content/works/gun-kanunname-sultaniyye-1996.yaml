abstract: "14 GÜN, Doğan, Ş3nûnnâme-i Sulfâniyye, Yüksek Lisans Tezi (Danışman: Prof. Dr. Yaşar YÜCEL) ÖZET Elimizdeki Kanunname, Kanuni Sultan Süleyman'ın şeyhü'l-İslamı olan Ebu's-Su^d Efendi'nin yorumladığı kanunname olmakla birlikte, her şeyden önce çeşitli padişah hükümlerinin bir araya getirilmesiyle oluşturulmuş bir kanun mecmucasıdır. Eski ve yeni kanunnamelerin derlenmesiyle oluşturulan bu ka nunname, kanun adamlaranın elleri altında bulundurdukları ve ihtiyaç duy duklarında bilgi edinmek amacıyla açıp baktıkları bir rehber kanun kitabı ma hiyetindedir. Kanunname-i sultaniyye adlı kanunnamemizin birinci bölümünde; Os manlı Devleti'nin hakim olduğu çok geniş sınırlar içinde, ne kadar Beylerbeyi, ümera, defter kethüdası ve tımar defterdarı olduğu, her beylikte kaç sancak ol duğu, sancaklardaki umar, zecamet ve kılıç sayısı, beylerbeyleri sancak beyleri ve diğer görevlilere tahsis edilen haslar, bu kişilerden alman vergiler belirtilmiştir. Bununla birlikte en büyük yönetim birimleri olan eyaletler ele alınmış ve bey lerbeyi tararından yönetilen bu yerleşim birimlerinin nitelikleri, yürürlükteki ka nunları, hangi durumlarda kanuna göre nasıl hareket edileceği, ayrıca toprak da ğıtımının hangi hallerde kanuna uygun veya aykırı olacağı rakamlar ve örneklerle ayrıntılı bir şekilde açıklanmıştır. Kanunnamenin,“Risale-i Diğer ve Kanunname-i Cedid”olarak geçen ikinci kısmında ise; Osmanlı toplumsal düzeninin kanunlarla nasıl sağlandığı ve sosyo ekonomik yapısının başlıca hukukî temelleri görülmektedir. Ticari faaliyetin uy gulanışına ve zanaatkarlara ilişkin kurallar, ceza hukukuna ait sorunları dü zenleyen kanunlar şehir ve köy kesiminden üretim biçimine göre reayadan alınan vergiler, değişik hukuk alanlarına ait belirli padişahların verdikleri emir ve fer manlar vardır. Son bölümde; Miri arazî, Tımar ve zecametlere dair Sultan Süleyman za manında konulan ve Ebu's-SuWun fetvalarına dayanan kararlar, ek olarak da arz-ı cöşriye, haraciye ve Arz-ı Memleket hususundaki Ebu's-Su°ud'un fetva su retleri, o devirde karşılaşılan sorunlar ve bu sorunlara Ebu's-Su'ııd'un verdiği ce vaplar detaylarıyla kanunnamede yer almaktadır."
