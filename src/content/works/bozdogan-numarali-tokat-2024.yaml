abstract: "Tokat, Osmanlı Devleti'nde Müslüman ve gayrimüslim halkın bir arada yaşadığı tarım, hayvancılık ve maden işlemeciliği açısından önemli bir üretim şehirdir. Transkripsiyonu ve değerlendirilmesi yapılan 64 Numaralı Tokat Şer'iyye Sicili Defterinde de bu durum görülmektedir. Transkripsiyonu ve değerlendirmesi yapılan 64 Numaralı Tokat Şer'iyye Sicili defteri giriş bölümü hariç üç bölümden oluşmaktadır. Giriş bölümünde Tokat şehrinin tarihi hakkında kısaca bilgi verilerek, İlkçağ'dan, Cumhuriyet dönemine kadar Tokat şehrinde olan tarihi gelişmeler kısaca anlatılmıştır. Ayrıca Osmanlı hukuku hakkında açıklama yapılarak, mahkemelerinin işleyişi, görevlileri ve mahkemelerde tutulan şer'iyye sicilleri hakkında bilgi verilmiştir. Birinci bölümde 64 Numaralı Tokat Şer'iyye Sicili Defteri'nde yer alan belgeler ve konular tablo halinde gösterilmiş ve Tokat Şer'iyye sicilleri hakkında yapılan yüksek lisan çalışmalarına yer verilmiştir. Ayrıca defterde geçen mahalle, köy, nahiye isimleri, sosyal, ekonomik ve aile yapısı hakkında değerlendirmeler yapılmıştır. İkinci bölümde defterde bulunan belgelerin dava özetlerine yer verilmiştir. Üçüncü bölümde ise defterin transkripsiyonu yapılmıştır."
