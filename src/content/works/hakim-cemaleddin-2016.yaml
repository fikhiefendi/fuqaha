abstract: "Fetva literatürü hicrî IV. yüzyıldan itibaren klasik fıkıh ilmi literatürü içerisinde, ayrı bir tür olarak gelişmiştir. Bu literatür uygulayıcılara, fazla tetkike gerek kalmaksızın işlerini rahatlıkla görme imkanı sunmuştur. Ayrıca fetvalar üzerinde değişik biçimde literatür ortaya çıkmıştır. Evvela devrin ilmi otoriterlerine sorulan fetvalar öğrencilerinin veya resmi memurların gayretleriyle toplanıp çeşitli şekillerde tertip edilerek mecmualar oluşturulmuştur. İslam Hukuku sahasında âlimler tarafından verilen fetvalar, zamanla derlenip \"el-Fetava\" ismiyle kitap haline getirilmiştir. Bu tür eserlerin İslam hukuku tarihi açısından büyük ehemmiyeti olduğu gibi bunlar, devletin sosyal, siyasi ve ekonomik yönüne ışık tutmaları bakımından tarihi öneme de sahiptir. Bu tür eserlerin bir kısmı matbu olmasına karşın maalesef ekseriyeti yazma halinde kütüphanelerde gün yüzüne çıkmayı beklemektedir. Doktora çalışması olarak planladığımız Ebü'l-Mehâsin'e ait olan el-Gunye fi'l-Fetâvâ da Hicrî VIII. yüzyılda kaleme alınmıştır. Bu eser üzerinde şu ana kadar herhangi bir tahkik çalışması yapılmamıştır. Türkiye'nin değişik yazma eserler kütüphanelerinde 174 ila 304 arasında değişen \"el-Gunye fi'l-Fetâvâ\" adlı eserin nüshaları mevcuttur. Asıl nüsha ile karşılaştıracağımız nüshaları tespit edebilmek için bu nüshaların tamamını elde etmem gerekiyor. Bu proje Türkiye'nin değişik kütüphanelerinde bulunan konumuzla alakalı yazma eserlerin fotoğraflarının teminini amaçlamaktadır. Eserlerin fotoğraflarının tespit ve temini yaklaşık 1 yıl sürecektir. Anahtar Kelimeler: Hanefî mezhebi, Fıkıh, Fetva, Cemâleddin, Konevî."
