abstract: "Afgan ceza hukukunda çocuğa karşı işlenen suçların nasıl düzenlendiği, İslâm Hukukunda çocukların korunması için çocuklara karşı işlenen bu suçlara karşı nasıl tedbirlerin ele alındığı, Afgan ceza hukukunun İslâm Hukukuyla uyum sağlayıp sağlamadığının tespit edilmesi, incelenmesi gereken konulardandır. Afgan ceza hukukunda çocuğa karşı işlenen suçlar ve bunların İslâm Hukuku açısından tahlili konusunun değerlendirilmesi sonucunda Afgan ceza hukukunda toplumun temelini teşkil eden çocuğun haklarına özen gösterildiği, çocuğun haklarına yönelik işlenen ihmalkâr fiillerin suç kapsamında değerlendirildiği, bu fiiller için öngörülen cezaların uygulanmasıyla çocuğun haklarının ve menfaatinin korunmasının amaçlandığı görülmektedir. Uzun bir gelişim sürecine sahip olan Afgan ceza hukukunun esas kaynağını teşkil eden İslâm Hukuku, çocuğu himaye altına alarak ona karşı işlenen suçları azaltmak amacıyla koruyucu tedbirler düzenlemiştir. Afgan ceza hukukunda çocuğa karşı işlenen suçlar için belirlenmiş yaptırımların birçoğu Hanefî fürû literatürünün hükümleriyle uyum içindedir. Bu çalışma giriş bölümü dışında iki bölümden oluşmaktadır; birinci bölümde Afgan ceza hukukunun gelişimi ve genel yapısı hakkında bilgiler verilmiştir. İkinci bölümde Afgan ceza hukukunda ceninin düşürtülmesi, çocuğun askeri birliklerde istihdam edilmesi, çocuğun eğitim, öğretim ve sağlık hizmetlerine erişim hakkından mahrum edilmesi, çocuğun dövülmesi, çocuğun çalıştırılması, çocuğun şahitlik yapmaya veya ikrarda bulunmaya zorlanması, çocuğun bakım ve düzenli beslenmeden mahrum bırakılması, çocukların cinsel istismarı, çocukların kaçırılması gibi suçlar ele alınıp İslâm Hukuku açısından değerlendirilmiştir."
