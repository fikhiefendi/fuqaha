abstract: "Mahmud Es'ad Seydişehrî Medrese eğitiminin yanı sıra döneminde yeni açılan okullarda müspet ilimleri de öğrendi. Müderris, Hukukçu ve Devlet Adamı olarak üstlendiği tüm görevleri başarıyla yerine getirdi. Geleneksel usûl-i fıkıh anlayışına bağlı kaldı. Ders kitabı olarak hazırlamış olduğu Telhîs-i Usûl-i Fıkıh adlı eseri, fıkıh usûlü konularını özet olarak içeren, bu alanda genel malumat almak isteyenler ve ıstılahlarla tanışmak isteyenler için orta seviye başvuru kitabıdır."
