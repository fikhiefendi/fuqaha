abstract: "Kur'an ve Sünnet naslarının şerʻî ahkâmı anlamada aslî kaynaklar olması nedeniyle bu naslardaki lafız ve mana arasındaki irtibatı ve lafzın hükme delâleti büyük önem arz etmektedir. Nasları doğru bir şekilde yorumlamak, lafzın manaya delâletini anlamakla sıkı bir şekilde bağlantılıdır. Bu nedenle usul âlimleri, eserlerinde lafızlar konusuna öncelik vermiş ve detaylı bir şekilde tartışmışlardır. Bu tartışmalarla hukukta subjektiflikten kaçınıp dil ve mantık kuralları çerçevesinde objektif bir hukuk metodolojisi ortaya koymaya çalışmışlardır. Ancak çeşitli ilmî tutumları nedeniyle lafızların taksiminde mütekellimîn, fukaha (Hanefî) ve memzûc metod lafızları kendi doktrinleri çerçevesinde incelemişlerdir. Hanefî usûlcüleri lafızlar taksiminin son kısmı olan lafzın manaya delâlet şekilleri ibarenin delaleti, işaretin delaleti, nassın delaleti ve iktizanın delaleti şeklinde dört kısma ayrılmaktadır. Bunlar, anlama aynı düzeyde delâlet etmemektedir. Bu nedenle herhangi iki tür arasında teâruz söz konusu olduğunda manaya delâleti kuvvetli olan, diğerine tercih edilir. Her bir türün manaya ne derecede delâlet ettiğini gösteren bir takım özellikleri vardır. Bu çalışmada Hanefî usûlcülerinin yapmış oldukları tanımlar ve verdikleri örneklerden hareketle bu dört delalet şekli etrafında gerçekleşen tartışmalar incelenecektir. Ayrıca bunların arasındaki temel farklardan yola çıkarak, teâruz durumunda hükme delaleti hususunda hangisinin daha öncelikli olduğunu, bu önceliğin tanınmasında etkili olan kriterlerin tespit edilmesi hedeflenmektedir."
