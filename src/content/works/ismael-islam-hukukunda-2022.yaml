abstract: "“İslâm Hukukunda Gayr-İ Menkul Malların Gasbı Ve Hukuki Sonuçları”başlıklı bu çalışmamız bir giriş, iki bölüm ve sonuç kısmından oluşmaktadır. Birinci bölümde gasb ile ilgili kavramlar ele alınmıştır. Gasbın tanımı gasbın hukuki hükmüne değinilmiştir. Gasba konu olan mal kavramı ve malların menkul ve gayr-ı menkul diye tasnifi yapılmıştır. Ayrıca gasbla yakın anlam içeren teaddi, itlaf, ihtilas sirkat ve hirabe kavramları da incelenmiştir. Yine Irak medeni kanununa göre gasb konusuna değinilmiş islam hukuku ile mukayese yapılmıştır. Gasb fiili fıkıh mezhepleri açısından değerlendirilmiş, mezheplerin kendi kaynaklarına müracaat olunarak analiz yapılmıştır. Ayrıca gasbın tarifi ve unsurları gasbın oluşum şartları ele alınmıştır. Gasbın Kur'ân-ı Kerim, sünnet icma ve diğer şeri delillerdeki hükmü açıklanmaya çalışılmıştır. Bu meyanda gasb fiilinin gerçekleştiği malların menkul, gayrı menkul şeklinde tasnifi yapılmış gayrı menkullerdeki artışlar ile menfaatlerin gasbı ayrıca gasb olunan malda aranan şartlar, malın mütekavvim olması, dokunulmaz olması ve maddi bir mal olması şeklinde ayrımı yapılmıştır. Gasb olunan malların menfaatleri ile ilgili mezheplerin görüşleri temel kaynaklara gidilerek irdelenmeye çalışılmış vakıf malları, küçüklerin malları, kiralık mallar ve menfaatlerin mal sayılıp sayılmayacağı hususuna değinilmiştir. Yine gâsıbla ilgili terettüp eden hükümler ve gasb olunan mala yönelik hükümler incelenmiştir. İkinci bölümde gasb olunan mallar üzerindeki tasarruflar ele alınmıştır. Gasb fiilinin hükmü, gasb olunan malın gasıba ve ikinci şahsa satışı, hibe edilmesi gibi hususlar incelenmiştir. Gasb olunan arazide ibadet etmenin hükmü, kamuya ait olan arazinin gasbedilmesi ve bu arazi üzerinde tasarrufta bulunulması, örneğin arazinin ekilmesi, üzerinde ağaç dikilmesi, bina inşa olunması ve arazi içerinde kuyu kazılması gibi konular incelenmiştir. Gâsıbın gasb ettiği mala vermiş olduğu zarar ve bu zararların tazmininin nasıl olacağına dair hükümler üzerinde durulmuştur. Gasb edilen malın ya aynı ile iade edilmesi veya misli yahut kıymetiyle tazmin edilmesi ile hükümler fıkıh mezheplerine göre mukayeseli olarak incelenmiştir. Ayrıca tazmin yükümlülüğünü kaldıran fiilllerden söz edilmiştir. Asıl maldaki eksikliğin nasıl telafi edileceği, bu telafi şeklinin tazmin zamanı mı yoksa gasb zamanına göre mi olacağı, gasb olunan mallardaki artışların nasıl tazmin edileceği hususları ayrıntılı olarak izah edilmeye çalışılmıştır. Sonuç bölümünde tezde ulaşılan netice ve bunun delillendirilmesi yoluna gidilmiştir. Tezde kullanılan kaynaklarla tez nihayete erdirilmiştir."
