abstract: "Mevsılî, Irak bölgesinde yetişen Fıkıh ve usûl alanında devrin otoriteleri arasında yer alan bir alimdir. Aynı zamanda mezhep içinde kuvvetli görüşleri zayıflarından ayırt edebilecek derecede ilmî yeterliliğe sahip fakihlerden (Ashâbü't-Temyîz) sayılmıştır. Mevsılî fıkıh alanında dört eser kaleme almış, bunun içerisinde üçü günümüze kadar ulaşmıştır. Mevsılî'nin eserleri arasında ilim çevrelerinde çokça okunup ve okutulduğundan dolayı meşhur hale gelen el-İhtiyâr li-ta'lîli'l-Muhtâr adlı eserini araştırma konumuz olarak seçtik. Bu eser ile ilgili çeşitli çalışmalar yapılmış olmasına rağmen, eserde kullanılan usûl kaidelerinin tespiti ve onun fıkıh usûlü açısından değerlendirilmesi hususunda yapılan herhangi bir özel araştırmaya muttali olamadık. Bu tezimizde ilk olarak Mevsılî'nin ilmi hayatını inceleyerek onun mezhep içindeki konumunu tespit etmeye çalıştık. İkinci olarak usûl kaidesinin tanımı, kaynağı, özelliği, önemi, benzer kavramlarla olan alakası, tarihçesi ve bu alanda yapılan çalışmaları ele aldık. Son olarak ise el-İhtiyâr li-ta'lîli'l-Muhtâr adlı eserden tespit ettiğimiz usûl kaidelerini fıkıh usûlü ilmi açısından değerlendirerek Mevsılî'nin bu kaideleri hangi fer-i mesele için kullandığını beyan etmeye çalıştık. Varılan neticeye göre, Mevsılî'nin eserinde tafsili delillerden hüküm istinbat etmek için başvurulan usûl kaidelerine her bölümde yer verildiği ve bu kaidelerin tamamının hanefî usûlü bağlamında olduğu görülmektedir. Ayrıca usûl kaidelerinin farklı yorumlanması neticesinde ortaya çıkan iftilafi meselelerde genel olarak mezhep içindeki İmam Ebû Hanife ve öğrencilerinden imam Züfer, imam Ebû Yusuf ve imam Muhammed'lerin görüşleri esas alındığı, imam Şafii'nin ihtilafına metinde rumuzlarla işaret edilmiş ise de şerhte çok nadir rastlanıldığı gözlemlenmektedir."
