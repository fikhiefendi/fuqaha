abstract: "Bu çalışma Âlûsî'nin Rûhu'l-Me'ânî isimli eserinin ahkâm tefsiri ile ilgili yönünü ele almaktadır. Tefsirin bu yönünden başka işârî ve lugavî yanı da bulunmakta olup dirayet tefsiri sınıfındandır. Bu çalışmamızın birinci bölümünde Âlûsî'nin hayatını, ilmî kişiliğini ve eserlerini, ayrıca bir istatistik ile de tefsirin kaynaklarını ele aldık. Buna göre Âlûsî, fıkıhta Hanefî, i'tikâtta Selefî, fıkıhta mukârenetü'l-mezâhibe hâkim, taasup sahibi olmayan hür fikirli, iyi bir ahlakî kişiliğe sahip bir müfessirdir. Rivâyî tefsirde en çok istifade ettiği müfessir Taberî'dir. Dirâyet tefsirinde ise en çok yararlandığı müfessirler sırasıyla Ebû Hayyân ve Zemahşerî gibi dil âlimleridir. İkinci bölümde Âlûsî'nin ahkâm tefsiri yaparken müracaat ettiği Kur'ân ilimlerini gösterdik. Buna göre Âlûsî'nin bu ilimleri hüküm âyetlerinin daha iyi anlaşılmasında etkili bir şekilde değerlendirdiğini tesbit ettik. Üçüncü bölümde usûl ve fürû fıkıh yönü ile hüküm âyetlerine yaklaşımını ele aldık. Buradan elde ettiğimiz sonuca göre Âlûsî usûl-ı fıkıh uygulamalarından ziyade fürû fıkha ağırlık vermiştir. Âlûsî Dört Mezhebin yanında Zâhiriler, Şiâ, Mu'tezile ve Haricîlerin fıkhî yaklaşımlarını da göstermiştir. Mezhebî taassup sergilemeden doğru bulduğunu tercih etmiş, yanlış bulduklarını da ifade etmekten geri durmamıştır. Ahkâm tefsirlerinden istifade etmiş, onların fıkhî istidlallerini yer yer değerlendirmiştir. Hüküm âyetlerini tefsir ederken 'işaret', 'iş'âr', 'nükte', 'tenbih', 'remz' gibi lafızlarla tâlî mânalar çıkarmış ayrıca hüküm âyetlerine işârî-tasavvufî yorumlar da getirmiştir."
