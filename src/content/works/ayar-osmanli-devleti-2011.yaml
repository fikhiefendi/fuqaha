abstract: "Bu çalışmanın amacı, Fetvâ Eminliği'nin belli bir dönem içerisindeki yapı ve işleyişini ortaya koymaktır. Tez bir giriş, üç bölüm ve sonuç kısmından oluşmaktadır.Giriş kısmında, çalışmanın konusu, sınırları, amacı ve metodunu açıkladık ve kaynaklar hakkında bilgi verdik. Ayrıca Şeyhülislamlık kurumunun yapısına ana hatlarıyla işaret etmeye çalıştık.Birinci Bölüm'de, fetvânın tanımını yapıp tarihsel sürecini ortaya koyarak Osmanlı hukukundaki yerini tespit etmeye çalıştık. Bununla birlikte fetvâ hizmetinin yürütüldüğü Fetvâhâne'nin kurumsal yapısını ve işleyişini inceledik.İkinci Bölüm'de, Fetvâ Eminliği'nin kuruluşunu, gelişim sürecini, iç işleyişini ve bu dairenin sorumlusu konumunda bulunan fetvâ eminlerinin görevlerini ve ekonomik durumlarını izah etmeye çalıştık.Üçüncü Bölüm'de, çalıştığımız dönem içerisinde Fetvâ Eminliği görevine getirilen isimleri belirledik ve bu isimler hakkında bilgi verdik.Sonuç kısmında ise, ilk fetvâ emininin Kânûnî Sultan Süleyman döneminde atandığını, resmî olarak bu unvanın Osmanlı merkez teşkilatında şeyhülislama fetvâ konusunda yardımcı olan görevliye ait olduğunu, Osmanlının son yüzyılında Fetvâ Eminliği'nin kurumsal yapıya kavuştuğunu ifade ettik. Aralarında yapı itibariyle önemli farklılıklar bulunmakla birlikte, fetvâ konusunda Fetvâ Eminliği'nin yürüttüğü misyonu günümüzde, Diyanet İşleri Başkanlığı bünyesinde görev yapan Din İşleri Yüksek Kurulu'nun yürüttüğü sonucuna vardık."
