abstract: "Satılan bir akarı ortaklık veya bitişik komşuluk sebebiyle, müşteriden cebren alıp mülkiyete geçirmek olan şüf'anın meşruiyeti ile ilgili Kur'ân'da bir hüküm yoktur. Şüfânın meşruiyet delili Hz. Peygamber'in (s.a.v.) hadisleri ile ümmetin icmasıdır. Şüf'a hakkı, kişinin kendi mülkü üzerindeki tasarruf yetkisini sınırlayan meşru bir müessesedir. Bu hakkın meşru kılınış gayesi de bireyler arasındaki muhtemel zararı önlemektir. Şüf'a hakkının sebebi, malın kendisinde ortaklık, irtifak haklarında ortaklık ve bitişik komşuluktur. Hanefiler'e göre şefîiler arasındaki derece farkı, sebebin kuvvetine dayanır ve aynı gruba ait şefîiler, meşfu malı aralarında eşit paylaşırlar. Mâlikî, Şâfiî ve Hanbelîler'e göre ise şüf'a hakkının tek sebebi vardır ve şefîiler, meşfu malı ana maldaki hisse oranına göre paylaşırlar. Cumhura göre şüf'a sadece taşınmazlarda olur. Taksim edilemeyen malların şüf'a konusu olup olmaması ise âlimlerin şüf'anın amacından ne kastettiklerine göre değişir. Şefîin, satımı haber alır almaz şüf'a talebinde bulunması gerekir. Aksi halde şüf'a hakkını kullanamaz. Şefî, şüf'a hakkını talep etmeden ölürse şüf'a hakkı ortadan kalkar. Şüf'a hakkının vârislere geçip geçmeyeceği konusunda ise ihtilaf vardır. Meşfû malda kendiliğinden meydana gelen ziyadeler müşterinin; insan fiili ile meydana gelen ziyadeler ise bedeli karşılığında şefîin olur."
