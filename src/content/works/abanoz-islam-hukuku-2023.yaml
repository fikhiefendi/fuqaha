abstract: "Toplumun ve milletin temel yapı taşlarından biri olan aile, içinde bulunduğu toplumun güçlü olmasında önemli rol oynamaktadır. Ailenin oluşmasının ilk adımı ise nişanlanmayla başlamaktadır. Nişanlanma genel itibariyle iki kişinin birbirine evlenme vaadinde bulunmaları şeklinde tanımlanmıştır. Bu süreçte nişanlılar ve aileler aralarındaki samimiyeti artırmak ve toplumun geleneklerine uygun olarak hediyeleştiği görülmüştür. Ancak nişanın sona ermesiyle birlikte taraflar arasında birtakım sorunlar ortaya çıkmaktadır. Bu sorunlar nişanlılık döneminde tarafların birbirlerine verdiği hediyeler ve nişanlılık döneminde peşin olarak ya da bir kısmı verilen mehrin ne olacağı hususu ile uğradıkları zararın tazmin edilme talebi olmuştur. Bu çalışmada, söz konusu hususların Türk Medeni Hukuku'nda ve İslam Hukuku'nda nasıl değerlendirildiği ele alınmaya çalışılmış ve konuyla ilgili Osmanlı dönemindeki bazı uygulamalara yer verilmiştir. Bu çerçevede Türk Medeni Hukuku'nda da nişanlılık döneminde verilen hediyeler ve tazminatla ilgili düzenlenme bulunmasına rağmen mehirle ilgili herhangi bir düzenlenme bulunmadığı görülmüştür. İslam hukukunda ise bu dönemde verilen hediyelerle ilgili mezhepler farklı görüşlerde bulunmuş, verilen mehrin ise geri iade edilmesi gerektiği konusunda ittifak etmişlerdir. Tazminat meselesi ise klasik dönem İslam hukukçuları tarafından, o dönemde nişanın bozulmasının tarafları pek zarara uğratmamış olması gibi muhtemel sebeplerden dolayı ele alınmamıştır. Günümüzde ise nişanın bozulmasıyla birlikte birçok sorun ortaya çıktığı için son dönem İslam hukukçuları tarafından değerlendirilmiş ve İslam'ın zararla ilgili temel prensipleri ölçü alınmak suretiyle farklı görüşler öne sürülmüştür. Bu kapsamda nişanın bozulmasıyla birlikte verilen zararın tazmin edilmesi gerektiğini savunanların yanı sıra nişanlanmanın evlenme vaadi olduğunu ve bu vaadden dönmenin söz konusu olabileceğini ifade ederek sorumluluğunun ortaya çıkmayacağını savunanlar olmuştur. Bu görüşler doğrultusunda nişanın haksız bir fiille bozulması ve zararın meydana gelmiş olması halinde bu zararların tazmin edilmesi gerektiği kanaatine varılmıştır."
