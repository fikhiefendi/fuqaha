abstract: "Toplum hayatında asayiş ve güven oluşması için toplumdaki her bireyin hak ilkesine samimi olarak bağlı olması zorunludur. İslam hukukunda, hak düzeninin korunması ve kanıtlanması amacıyla ikrar gibi bazı ispat vasıtalarına yer verilmiştir ki, insanın zimmetinden başkalarının haklarını düşürür ve hak sahibin hakkını almasını sağlar. İkrar İslam hukukunda hakkı ispatlamanın en önemli delillerinden biridir. Afganistan Medeni Kanunu'nda da bu ispat araçlarından olan ikrar şartlarına uygun olarak yerine getirilmesi durumunda başta gelen delillerdendir. Çünkü İslamiyet sonrası Afganistan'da yargılamalar İslam hukukuna göre yapılmıştır. Daha sonra kanun şeklini almıştır. Nitekim Afganistan Anayasasının da belirttiği gibi, Afganistan'da İslam dinine muhalif hiçbir yasa çıkarılamaz Bu nedenle,“İslam Hukukunda İkrar ve Afgan Medeni Kanunu İle Mukayesesi”başlıklı konuyu tez çalışması olarak çalışmaya karar verdik. Araştırmamız iki bölüm ve sonuçtan oluşmuştur. Birinci bölümde,“İslam Hukukunda İkrar Kavramı ve Şartları”başlığı altında İslam hukukuna göre ikrarın tanımı, inşâ veya ihbâr olduğu ile ilgili tartışmalar, ikrarın hukukî dayanakları, rükünleri, şartları ve çeşitleri incelenmiştir. İkinci bölümde“Afganistan Medeni Hukukunda İkrar ve Hükümleri”başlığı altında Afganistan Medeni Kanunu hakkında kısaca bilgi verildikten sonra Afgan Medeni Hukukunda ikrarın kaynakları, rükünleri, çeşitleri ve ikrarın en çok kullanıldığı nesep, nikâh, miras gibi bazı özel durumlarda ikrarın hükümleri, İslam Hukuku ile mukayese edilerek benzerlikleri ve farklılıkları üzerinde durulmuştur."
