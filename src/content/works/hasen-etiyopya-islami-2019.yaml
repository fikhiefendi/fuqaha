abstract: "İslami bankacılık (faizsiz bankacılık) dünya genelinde hızla gelişmektedir. İslami bankacılığın temel amacı, bankacılığı faizi yasaklayan, bununla birlikte alkollü içkiler, domuz eti, uyuşturucu maddelerin vb. üretimi, dağıtımı ile tüketimini ihtiva eden ticari işlemleri yasaklayan şer'i hükümlere uygun hale getirebilmektir. Günümüzde faizsiz bankacılığın önemi, Müslümanların yaptıkları ticari ya da ekonomik aktivitelerin şer'i uygunluğunun sağlanmasının da ötesindedir. İslamî bankacılığın ekonomik avantajları, dini inançlarından bağımsız olarak, çok sayıda yatırımcının da ilgisini çekmektedir. Etiyopya, bilinmeyen nedenlerle İslamî bankacılığın kurulması konusunda Müslüman topluluğun talebini reddetmiştir. Etiyopya Ulusal Bankası, İslamî bankacılık sistemini getirmek yerine tüm ticari (geleneksel) bankaların faizsiz bankacılık faaliyetleri de yürütebilmesi için bir düzenleme getirmiştir ve buna“Faizsiz Pencere Bankacılığı”denilmektedir. Bağımsız İslam bankalarının sınırlamaları, akıllarda“hükümetin mevcut pozisyonunun yasallığı ve Anayasa'ya uygunluk”sorularının oluşmasına sebebiyet verebilir ki bunlar, Müslüman topluluğun dinî ve ekonomik hakları üzerinde etki gösterir. Ancak“Faizsiz Pencere Bankacılığı”nın Müslümanlar tarafından çok uzun süreden beri talep edilen bağımsız faizsiz bankaların yerine geçip geçemeyeceği tam olarak bilinememektedir. Bu çalışma, aşağıdaki soruları cevaplandırmayı hedefler: 1. Etiyopya Hükümeti tarafından bağımsız faizli bankaların yasaklanması anayasal mıdır? 2. İslami Bankaları kurma ve işletme hakkını reddetmenin Müslüman toplum üzerindeki etkileri nelerdir? 3. Faizsiz Pencere Bankacılığı, Etiyopya'da faizsiz bankacılığın taleplerini karşılamak için uygun ve yeterli midir? Görüldüğü üzere bu tez; FDRE Anayasası, Uluslararası İnsan Hakları Sözleşmeleri ve Etiyopya'nın SGB/51/2011 Direktifleri gibi yerel yasalar çerçevesinde ele alınmış olup, işbu ilgili yasal belgeler incelenip analiz edilmesi neticesinde yukarıdaki soruların cevaplandırılması amaçlanmıştır. Ayrıca, bahsi geçen direktiflerin uygulanmasının pratik sonuçları da çalışmamız içerisinde değerlendirilmiştir."
