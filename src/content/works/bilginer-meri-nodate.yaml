abstract: "İslâm hukukunda ve mer'î hukukta üzerinde önemle durulan nafaka, sadece aile ve akrabalık nafakasıyla sınırlı olmayıp mülkiyet ilişkisinden kaynaklanan canlılar ve cansız varlıklar için yapılan harcamaları da içine almaktadır. Bu nedenle çalışmanın ana mihverini, İslâm hukukundaki bütün nafaka çeşitlerinin incelenmesi ve bunların mer'î hukukla mukayesesi oluşturmaktadır. Araştırmanın genelinde nafakanın her çeşidi ele alınmış olsa da çalışmanın odağında aile-birey-nafaka ilişkisinden kaynaklanan nafaka çeşidi yer almaktadır. Çalışmada bu ilişkinin daha net bir şekilde ortaya konulabilmesi için kavramsal çerçeve bağlamında nafaka ile ilişkili mehir ve mut'a kavramı; mer'î hukuktaki tedbir, iştirak ve yoksulluk nafakası kavramları incelenmiştir. Çalışmada evlilik ve iddet nafakası, evlilik nafakasının kapsamı ve evlilik nafakasını düşüren haller; akrabalık nafakası ve mülkiyet ilişkisinden kaynaklanan hayvanların bakım ve gözetimi, cansız varlıkların tamiri, bakım ve imarı gibi hususlar da mer'î hukukla mukayese edilerek incelenmiştir. Özellikle günümüzde sıkça tartışılan süresiz nafaka meselesi de tartışılmış, konuya İslâm hukuku mihverinde çözüm önerileri getirilmeye çalışılmıştır. Sonuç ve tartışma kısmında elde edilen bulgular değerlendirilerek bu hususların mer'î hukukla mukayesesi yapılmıştır. Son tahlilde zamanın ve şartların değişimiyle nafakanın kapsamının değişebileceği, mer'î hukukta nafakanın süresine yönelik kanunlaştırma çalışmalarında, İslâm hukukunun içtihatlarından yararlanılması gerektiği ve bunlara benzer başka sonuçlara ulaşılmıştır."
