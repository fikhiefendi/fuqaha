abstract: "İslami finansal ürünler ve hizmetler, doğası gereği farklıdır yasal ve düzenleyici çerçeveye ek olarak İslam'ın gerekliliklerine uygun ürün geliştirilmesi gerekmektedir. Bu nedenle, İslami finansta yenilik yapmak daha da zor hale gelmektedir. İslami finansta ürün geliştirirken ürünün hem İslami kurallara uyması hem yasal mevzuata uyması hem de ticari karlılık sağlaması göz önünde tutulup bir denge sağlanarak ürün üretilmelidir. Bu bağlamda katılım bankaları ürün geliştirirken birçok risk ve engel ile karşılaşmakta ve ürün geliştirmede istenilen başarı sağlanmamaktadır. Bu araştırmanın amacı katılım bankalarının ürün geliştirme sürecinde karşılaştıkları risk ve engellerin neler olduğunu ve nelerden kaynaklandığını tespit etmektir. Bu çalışmada, Türkiye'deki katılım bankalarının ürün geliştirme bölümü çalışanlarına, danışma komitesi üyelerine, TKBB ilgili departman yöneticilerine, TKBB danışma kurulu üyelerine, BDDK ilgili departman yöneticilerine ve bağımsız akademisyenlere derinlemesine mülakat yöntemi uygulanarak katılım bankalarının ürün geliştirme süreçlerine ilişkin elde edilen bulgular yer almaktadır. Çalışma ile şu sonuçlara ulaşılmıştır: Bankaların risk almak istemeyen üst yönetimi özgün ürün geliştirilmesinin önündeki temel engellerden biridir. Ülkenin konjonktürel durumu kaynaklı katılım bankaların belli kurum ve kuruluşlardan talep ettiği mevzuata dair düzenlemeler ikinci planda kalmakta, hızlı çözüm üretilememekte bu da belli ürünlerin geliştirilmesinin önünde bir engel oluşturmaktadır. İslam'ın gerekliliklerine uygun ürün üretmek daha pahalı ve daha riskli olabilmekte böyle durumlarda ise bazı firmalar İslami gerekliliklerinden ödün veren ürünleri tercih edebilmektedirler."
