abstract: "Bu çalışma, Şeriat'ın cezalardaki amaçlarını, özellikle de mürteci öldürme uygulamasını ele almaktadır. Çalışmanın temel amacı, İslam ceza hukukunun Şeriat amaçlarını vurgulamak, İslam'daki ceza felsefesini ortaya koymak ve had cezalarının dünya ve ahiret açısından insanlara sunduğu faydaları belirtmektir. Araştırmanın odak noktası, Şeriat amaçlarını tanıtmak, had ve irtidat cezalarının amaçlarını açıklamak ve bu cezalarla ilgili şüpheleri gidermektir. İnceleme konuları arasında İslam'da ceza felsefesi, suç ve suçlu üzerine İslam'ın görüşleri, özellikle irtidat cezası ve had cezaları hakkında dile getirilen bazı endişelerin ele alınması, fıkıh alimlerinin irtidat cezası ve mürteci öldürülmesi konusundaki görüşlerinin ve mürtecinin tövbe etmesi gibi yan meselelerin detaylı bir şekilde incelenmesi yer almaktadır. Çalışma, indüktif ve analitik yöntemlerle yürütülmüştür. Bilgiler, fıkıh ve usul kaynaklarından toplanmış, analiz edilmiş ve Şeriat'ın amaçları doğrultusunda değerlendirilmiştir. Araştırma, cinayetler ve had cezaları üzerine fıkıh ve hukuk metinlerinin incelenmesi, fıkıh alimlerinin görüşlerinin karşılaştırılması ve analiz edilmesiyle ilerlemiştir. Şüphelere, fıkıh alimlerinin eserleri ve kitaplarında bulunan dini ve mantıki kanıtlarla yanıt verilmiştir. Çalışma sonucunda, irtidat cezasının Şeriat amaçlarının, dinin ve toplumun korunması, fitnenin önlenmesi ve istikrarın sağlanması yönünde olduğu sonucuna varılmıştır. Ayrıca, İslam'da bu cezaların uygulanmasının adalet, kamu yararı ve sosyal güvenlik gibi Şeriat amaçlarına uygun olduğu vurgulanmıştır. Son olarak, mürtecinin öldürülme cezasının hikmeti ve amacı ile uygulanmasının faydaları açıklanmıştır."
