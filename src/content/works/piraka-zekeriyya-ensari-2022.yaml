abstract: "Fıkhi kaideler, fıkıh ilminin ürettiği önemli ürünlerden bir tanesidir. Fıkhın genel mantığını yansıtan, bir veya birçok konudaki hükümlerin teşekkülündeki gerekçeleri veciz bir şekilde ifade eden bu kaideler, fıkıhla ilgilenen her seviyedeki ilim insanına ilim tahsili ile ifta/ictihad faaliyetlerinde kolaylık sağlamaktadır. Fıkhi kaidelerle ilgili çok sayıda çalışmadan oluşan geniş bir literatür bulunmaktadır. Bu literatürü oluşturan bazı araştırmalar, fıkıh kaynakları içerisinde dağınık halde bulunan külli kaidelerin tespitine yöneliktir. Bu metotla yapılan bu tezde Zekeriyyâ el-Ensârî'nin Esne'l-Metâlib adlı eserinin ahvâl-i şahsiyye bölümlerinde geçen fıkhi kaidelerin tespiti ve değerlendirmesi yapılmıştır. Çalışma, bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde konunun önemi, amaçları, sınırları ve konuyla ilgili önceki çalışmalar zikredilmiştir. Birinci bölümde, müellifin biyografisi ve eserleri anlatılmış, çalışmanın ana kaynağı olan Esne'l-Metalib adlı eseri tanıtılmıştır. İkinci bölümde fıkhi kaide kavramı ele alınmış; fıkhi kaideler ile fıkhi zâbıtlar arasındaki farklar, fıkhi kaidelerin rükünleri, şartları, delil değeri ve kaynakları incelenmiştir. Çalışmanın ana konusunu teşkil eden son bölümde ahvâl-i şahsiyye bölümlerinde geçen fıkhi kaidelere yer verilmiş, tespit edilen 19 kaide zikredilmiştir. En son olarak araştırmada elde edilen sonuçları içeren Sonuç bölümü bulunmaktadır."
