abstract: "Çalışmamızda XVIII. yüzyılın önemli fetva kitaplarından olan Fetâvâ-yı Feyziyye, Behcetü'l-fetâvâ ve Netîcetü'l-fetâvâ adlı eserlerin aile hukuku kısımları incelenmiştir. Bu eserler Osmanlı Fetvahanesi tarafından muteber kabul edildiği ifade edilen mecmualar içerisinde yer alıp hem kendi dönemine hem de sonraki dönem eserlerine kaynaklık etmiştir. Bu çalışmada aile hukuku başlığı altında nikâh, radâ', talâk konularındaki fetvaların Osmanlı toplumundaki uygulanışı hakkında bilgi verilmiştir. Klasik fıkıh kitaplarından yararlanılarak hükümlerin, şart ve durumlara göre nasıl yorumlandığı görülmüştür. Ayrıca, dönemin sosyolojisinin ve aile yaşantısının fetvalara yansıyan kısımları ortaya çıkarılmıştır. XVIII. yüzyıl Osmanlı halkının din ile olan ilişkisi, örf ve gelenekleri, evlilik ve boşanma süreçleri, kadın ve erkeklerin bu süreçteki rolleri, nikâh ve talâk sonrası mali yükümlülükleri gibi hususlar, danışılan meseleler üzerinden çözümlenmiştir. Araştırmamızda, literatür incelemesi ve karşılaştırmalar yapılıp fetvalar yorumlanarak ele alınmıştır. Bu çalışmanın, İslam aile hukuku ve Osmanlı tarihi üzerine yapılan çalışmalara ışık tutucu bir kaynak olması amaçlanmaktadır."
