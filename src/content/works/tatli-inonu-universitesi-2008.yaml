abstract: "JAK-STAT (janus kinase- signal transducers and activators of transcription )50'den fazla sitokin ya da büyüme faktörü ile aktive olan çeşitli hücresel fonksiyonlardaönemli rol oynayan sinyal yoludur. JAK'lar reseptör ilişkili tirozinaz kinaz olup bunlarSTAT'ları aktive eder. STAT'lar karaciğerde antiviral defans, karaciğerde hasara karşıkoruyucu etki, karaciğer regenerasyonu, iskemi perfüzyon hasarının inhibisyonundakritik rol oynarlar. Karaciğerde, IL-6 hepatositleri çeşitli akut faz reaktanlarını yapmasıiçin uyarır, ek olarak IL-6 karaciğer rejenerasyonunda önemli rol alır ve karaciğerhasarına karşı korur. IL-6 özellikle STAT3 aktivasyonunu indüklemektedir. IL-10'daSTAT'ların aktivasyonunda rol oynamaktadır.Biz çalışmamızda 2007 yılında İnönü Üniversitesi Tıp Fakültesi, Turgut ÖzalTıp Merkezi'nde HBV ve HCV'ye bağlı siroz nedeni ile karaciğer transplantasyonuyapılan 45 olguyu çalışmamıza dahil ettik. Hastalar Tx öncesi kullandıkları ilaçlarabağlı olarak 3 gruba ayrılmıştır (n=15). Grup A Lamuvidin, Grup B Adevofir, Grup Cİnterferon veya interferon+ ribavirin tedavisi almıştır.Hepatektomi materyaline ait dokulara immunohistokimyasal olarak STAT1,2,3,5,5a,5b,IL-6 ve IL-10 uygulanmıştır. Hepatositler, safra yolu epiteli, lenfositler,portal alandaki makrofajlar, Kupffer hücreleri ve stromadaki fibrobast, endotelboyanmaları incelenmiştir. STAT 2, 3 ve IL-6 ekspresyonları Lamivudin alan gruptahepatositlerde anlamlı olarak fazla bulunmuştur. STAT 2 için Adefovir kullananhastalarla interferon kullanan hastalar karşılaştırıldığın da anlamlı fark mevcut olup,STAT 3 ve IL-6 ekspresyonları arasında bu iki grup arasında anlamlı farklılıksaptanmamıştır.STAT 5a akspresyon yönünden STAT 2 ekspresyonu ile ters ilişki mevcut olup,interferon alan grupda en fazla, lamivudin alan grupta en az STAT 5a ekspresyonusaptanmıştır. STAT 1 ve 5 ekspresyonu tüm gruplarda zayıf olup gruplar arası anlamlıfark yoktur. STAT 5b ekspresyonu tüm gruplarda yüksek derecelerde olup gruplar arasıanlamlı fark yoktur. IL-10 ekspresyonu interferon grubunda en az olup, adevofir velamivudin grupları arasında anlamlı fark mevcut değildir.KC Tx'dan sonra bazı hastalarda erken dönem rejeksiyon görülürken bazıhastalarda immun tedavi ihtiyacı minimum olmaktadır. Primer hastalık nüksü de Txsonrası bir diğer problemdir. STAT'lar karaciğerde antiviral defans, karaciğerde hasarakarşı koruyucu etki, karaciğer regenerasyonu, iskemi perfüzyon hasarının inhibisyonugibi pek çok fonksiyona sahiptir. Farklı ilaç kullanan hastalarda; STAT ve STAT'larınİL ekspresyonu üzerindeki etkisi immunmodulasyonda Tx sonrasında önemli roloynayabilir. Bu durumun hasta izlemlerinde göz önünde bulundurulması gerektiğinidüşünmekteyiz."
