abstract: "Günümüz neoliberal iktisadi sistemi, üretim konusunda ciddi başarılar elde etmiş ve zenginlik üretmiştir. Ancak bu zenginlik dünya nüfusunu kapsayan bir refaha dönüşememiş, dünya nüfusunun en az yarısının fakir kaldığı ciddi bir gelir dağılımı bozukluğu meydana getirmiştir. Bu problemin kaynağında yatan çatışmacı / yarışmacı dünya görüşünün ve her bireyin kendi çıkarını maksimize etme anlayışının hâkim olduğu paradigmaya karşı, sistemi dengelemeye yönelik dayanışmacı / yarışmacı öneriler hem mikrofinans gibi kurumsal bazda hem de İslam ekonomisi gibi sistemsel düzeyde ortaya konmaktadır. Günümüz hibrit ekonomik anlayışı içerisinde bu iki farklı düzlemdeki önermeler, İslami mikrofinans kurumlarında bir araya gelmiştir. Bu kurumlar arasında tamamen karz-ı hasene dayalı olanları, fakir girişimcinin üzerindeki kâr yükünü de kaldırmalarından ötürü oldukça başarılı olmuşlardır. Ancak bu kurumların da bağış dışında gelir üretememeleri, kurumsal sürdürülebilirlik ve modelin küçük topluluklar tarafından kolayca adapte edilememesi gibi bazı problemler oluşturmaktadır. Tez kapsamında küçük topluluklarca kolayca örgütlenerek otonom olarak faaliyet gösterebilecek, kendi kendine yeten ve sürdürülebilir bir karz-ı hasene dayalı İslami mikrofinans modeli üzerinde çalışılmıştır. Bu amaçla İslami mikrofinansın en yaygın olarak kullanıldığı bölgelerin başında gelen Güney Doğu Asya ülkelerinden Endonezya, Malezya ve Singapur'da saha ziyaretleri yapılarak derinlemesine mülakatlar gerçekleştirilmiştir. Yapılan teorik ve saha incelemeleri sonucunda“Karz-ı Hasene Dayalı Finans / Mikrofinans (KHDF/M) Modeli”ortaya konmuştur. Model çerçevesinde; mikrofinansın uygulandığı teavün birimi ve gelir durumu iyi olan birey ve kurumların karşılıklı karzlaştığı, aynı zamanda modele gelir üreten tekarüz birimi olmak üzere iki ana birim oluşturulmuştur. Sac ayağı eğitim birimi ile tamamlanmaktadır. Eğitimlerde fakir girişimcilerin; teknik, finansal, etik, sosyal girişimcilik ve dayanışmacı / yarışmacı bir iktisat paradigmasını içselleştirmelerini hedefleyen dersler verilmesi ve ayrıca sağlanacak koçluk desteği ile kapasite inşası hedeflenmektedir."
