abstract: "VIII ÖZET Çalışmamızın konusu düzenleyici idari işlem niteliğindeki imar planlan ve bunlara dayanarak yapılan kamulaştırmalardır. İmar kamulaştırmaları her ne kadar imar planlarına dayansa da bu planlara dayanılarak yapılacak kamulaştırmalarda İmar Kanunu' nun öngördüğü esaslar doğrultusunda 2942 Sayılı Kamulaştırma Kanunu uygulanacaktır. Bu sebeple çalışmamızda İmar Kanunu yanında Kamulaştırma Kanunu'nun ilgili hükümlerini İmar Kanunu'yla bağlantılı olarak incelemiş bulunuyoruz. Çalışmamızın ilk bölümünde genel olarak, idarenin yapmakla yükümlü olduğu görevlerin yerine getirilmesinde büyük önem taşıyan kamu malları, kamu mallarının türleri, kamu hizmetinin görülmesinde kamu mallarının tahsisi, kamu hizmetine özgülenecek malların temininde kamulaştırmanın yeri ve kamulaştırma işlemine bağlı kamulaştırma süreci üzerinde durulmuştur. İkinci bölümde, idarenin imar planlan uyarınca kamu hizmetlerine özgülenecek taşınmazları belirleme işlemi olan imar planlan, imar mevzuatının kamu düzenine ilişkin emredici niteliği, İmar Kanunu ile getirilen kısıtlamaların niteliği, imar planların normlar hiyerarşisindeki yeri, genel olarak imar planlarına karşı kanun yolları ve imar planlan uyarınca umumi hizmetlere ayrılan yerler kavramım inceledik. Son bölümde ise imar planlan uyarınca kamulaştırma işlemine bağlı hüküm ve sonuçlar üzerinde durulmuştur. Bu bağlamda imar planı ile umumi hizmetlere ayrılan yerlerde kamulaştırma anma kadar malikin sahip olduğu haklar, umumi hizmetlere ayrılan yerlerin idarece kamulaştırma yükümlülüğü ve kamulaştırma yükümlülüğüne aykırılığın sonuçlan, umumi hizmetlere ayrılan yerlerde mülkiyet ve irtifak hakkı kamulaştırmasına ilişkin özellikler ve İmar Kanunu hükümlerince yapılacak kamulaştırmaya ilişkin uygulanacak özel hükümler üzerinde durulmuştur."
