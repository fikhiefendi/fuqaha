title: "İmar Kanunu Çerçevesinde Özel Hukuka Tabi Taşınmazların Kamulaştırılmasına Bağlı Hüküm ve Sonuçlar"
titleTranslation: {"en": "In accordance with zoning law; The provision and results of exproprition of real property subject to private law"}
