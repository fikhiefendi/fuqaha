abstract: "Bu tezde Abdurrahman Efendi'nin Sefînetü'l-fetâvâ eseri incelenmiş, eserin hacimli olması nedeniyle aile hukuku özelinde fıkhî analizi yapılmaya çalışılmıştır. 21 yaşında Erzurum Müftüsü olan ve bu görevi 20 yıl sürdüren Abdurrahman Efendi, Erzurum kadılığı, Erzurum, Ankara ve birçok yerde valilik yapmıştır. Müftülüğü esnasında vermiş olduğu fetvaları düzenleyip bir araya getirerek Sefînetü'l-Fetâvâ adlı eserini telif etmiştir. Müellif, fetvalarının tamamına Hanefi Mezhebi'nin muteber kitaplarından kaynak göstermiş ve mezhebin görüşleri çerçevesinde hareket etmiştir. Geniş hacmi ve zengin kaynakları ile birlikte, farazi meseleleri değil de dönemin gerçek olaylarını, sosyal, kültürel, hukuki problemlerini farklı yönleriyle ortaya koyması ve çözüm bulması özelliğiyle de değerli bir eserdir. Bu yönüyle eser bilimsel açıdan incelenmeye değer bir niteliğe sahiptir. Erzurum Müftüsü Abdurrahman Efendi'nin mezkûr eseriyle fıkıh/İslam hukuku çalışmalarına önemli katkılar sağlayacağını söyleyebiliriz."
