abstract: "İlk zamanlarda kefalet, tazmin gibi farklı anlamlarda kullanılan damân kavramı giderek“kişinin genel mali yükümlülükleri”şeklinde daha kapsayıcı bir anlam kazanmıştır. İslâm hukukunun oldukça geniş bir şekilde ele aldığı“kişinin genel mali yükümlülükleri”anlamına gelen damân sorumlulukları ilk zamanlarda yazılan fıkıh kitaplarda müstakil bir başlık altında ve toplu bir şekilde değil meseleler arasına serpiştirilmiştir. Hanefî fıkıh eserlerinde dağınık duran bu hükümleri Gânim el- Bâğdâdi (ö.1032/1623) Mecmaʿu'd-damânât fî mezhebi'l-İmâmi'l-Aʿzam Ebî Hanîfe en-Nuʿmân isimli eserinde bir araya toplamaya çalışmıştır. Bağdâdî'nin eseri alanında yazılmış ilk müstakil eser olarak zikredilse de Fudayl Çelebinin (ö. 991/1583) ed- Damânât isimli eserini Bağdâdî'den daha önce yazdığı bilinmektedir. Bağdâdî'nin eseri kendisinden sonra yazılan birçok esere ilham kaynağı olmuştur. Modern dönemde yazılan eserlere Ali el-Hafîf'in (1891-1978) ed-Damân fi'l-fıkh'il-İslâmi ve Vehbe Zuhâyli'nin (1932-2015) Nazariyyetü'd-damân isimli eseri örnek olarak verilebilir. Türkiye'de damân kavramını çeşitli şekillerde ele alan yüksek lisans ve doktora tezleri bulunmaktadır. Biz çalışmamızda yapılan diğer çalışmaları inceleyerek damâna sebep olan sözlü ve fiili tasarrufları kısaca tanıtarak bunlardan doğan mali cezaların miktarlarına ve ödenme şekillerine değinmeye çalıştık. Bununla beraber bu güne kadar toplu bir halde ele alınmasına rastlayamadığımız ehliyet arızalarının bu mali sorumluluklara etkisini, tespit edebildiğimiz ölçüde belirleyerek, özgün bir çalışmayı literatüre kazandırmaya çalıştık."
