title: "İbn Rüşd'ün Bidayetü'l-Müctehid Nihâyetü'l-Muktesıd Adlı Eserinde Ebû Yûsuf, İmam Muhammed ve İmam Züfer'e Nispet Edilen Görüşler ve Bunların Hanefi Mezhebi Açısından Değerlendirilmesi"
