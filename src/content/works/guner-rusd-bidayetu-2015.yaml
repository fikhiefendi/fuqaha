abstract: "“İbn Rüşd'ün Bidayetü'l-Müctehid Nihâyetü'l-Muktesıd Adlı Eserinde Ebû Yusuf, İmam Muhammed ve İmam Züfer'e Nispet Edilen Görüşler ve Bunların Hanefi Mezhebi Açısından Değerlendirilmesi”adlı tezimiz giriş ile dört bölümden oluşmaktadır. Giriş bölümünde İbn Rüşd, Bidâyetü'l-Müctehid, Ebû Yûsuf, İmam Muhammed ve Züfer b. Hüzeyl hakkında kısaca bilgi verilmiştir. Birinci bölümde Bidâyetü'l-müctehid'de bulunan ibâdât bölümüyle alakalı, ikinci bölümde nikâh ve boşama bölümüyle alakalı, üçüncü bölümde alış veriş bölümüyle alakalı, dördünce bölümde ukûbât bölümüyle alakalı Ebû Yûsuf, İmam Muhammed ve Züfer'e ait olan görüşler tahkik edilmiştir. Tezimizde Ebû Yûsuf, İmam Muhammed ve Züfer'e ait yetmiş altı görüş tahkik edilmiş ve bu görüşlerden dört tanesinin İbn Rüşd tarafından yanlış nakledildiği sonucuna ulaşılmıştır."
