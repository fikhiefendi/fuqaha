abstract: "Türkiye'de aile hukukunun gelişiminin Osmanlı toplumundan hareketle yeniden düşünülmesi gerekmektedir. Zira bir yandan yenilikleri iktidara mal etme, diğer taraftan ise toplumsal sorunları İslam dininin içeriği ile açıklama eğilimi, haliyle bir yandan Türkiye'de kadın haklarının ilk kez Cumhuriyet'in ilanıyla beraber yapılan düzenlemeler çerçevesinde tanındığı, diğer taraftan ise Osmanlı'da aile hukukuyla ilgili kadınların sıkıntılarının olmadığı ve Osmanlı'da bu yönde düzenleme yapılmadığı gibi bir algı oluşturmuştur. Bu çalışma hem bu iki algının dışına çıkması hem de hayatın en önemli öğesi olan ailenin evlenme, boşanma gibi en temel özelliklerinin gelişiminin arz ettiği öneme rağmen henüz örneklerinin çok görülmemiş olması bakımından önemlidir. Çalışma Medeni Kanun öncesinde Osmanlı'da bir aile hukuku arayışı olduğunu iddia etmektedir. Bu yönüyle tez, Osmanlı'da bir yandan Hanefi hukukuna göre boşanma imkanları yok denecek kadar az olan kadınların istemedikleri evliliklerinden kendilerini azad etmek için hileler yapmak, bedel ödemek, diğer taraftan hukukçular ve devlet adamlarının kadınların müşkiliyetlerini gidermek için diğer mezheplerden istifade etmek, zorlama metodlar kullanmak gibi dolambaçlı yollara başvurmak zorunda kalmaları vb. nedenlerle yeni bir aile hukukuna ihtiyaç duyulurken; reformlar ve ard arda yaşanan savaşların şehri, insanları, ilişkileri, insanların evlenme, boşanma, aile anlayışlarını değiştirmesinin ve geleneksel yapıyı belirli nispette sarsmasının yeni bir aile hukukuna duyulan ihtiyacı daha da şiddetlendirdiğini ortaya koymaya çalışmaktadır. Aile hukuku arayışının birden fazla ayağının olması dolayısıyla bu çalışmanın da birden fazla amacı bulunmaktadır: Kadınların neden ve nasıl boşandıklarını, neler yaşadıklarını kendi ifadelerinden vermek, Osmanlı'da boşanma konusundaki yanlış eğilim ve algıları düzeltmek, siyasi, sosyal, kültürel, ekonomik gelişmelerin insanları, insanların ise birbirlerini ve kanun yapıcıların fikir ve uygulamalarını nasıl etkilediklerini ortaya koymak, Medeni Kanun'un öncesinde Osmanlı toplumunda kadınların aile hukukları için mücadele ettiklerine dair bir tarihlerinin olduğunu açığa çıkartmak. Ki bu aynı zamanda aile hukuku reformunun sadece devletin projesi olmayıp, toplumun talep, ihtiyaç ve çabaları doğrultusunda ortaya çıktığı anlamına gelmektedir. Son olarak Osmanlı Devleti'nin aileye zaman zaman müdahalede bulunduğunu ve kadınların haklarını aradığını göstermek. Çalışmada ilk önce İslam Osmanlı hukukuna göre kadınların boşanmalarının nasıl olduğu ve Osmanlı uygulaması için şer'iyye sicilleri ve belgeler üzerinden mevcut hukukun ihtiyaçları ne kadar karşıladığı saptanmaya çalışıldı. İkinci aşamada toplumdan, özellikle kadınlardan bu konuda şikayet yahut yeni bir hukuk oluşturulması konusunda talep gelip gelmediği, reformlar ve savaşlarla değişen koşulların toplumu, toplumun ihtiyaç ve beklentilerini, kadın-erkek ilişkilerini, aileye karşı fikirleri nasıl etkilediği gibi sorulara süreli yayınlar üzerinden cevap arandı."
