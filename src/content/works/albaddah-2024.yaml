abstract: "Tez özeti Tez, H. 758 yılında vefat eden İmam Amir Kateb Al-Itqani'nin (Açıklama hedefi, zamanın sonunda nadirdir) başlıklı bilimsel bir makalenin bir kısmının incelenmesidir. İbadet fıkhının başlangıcından mali işlemlere ve sınırlara kadar İmam Ebu Hanife el-Numan'ın öğretisine ilişkin İslam fıkhı araştırmalarını içeren Hanefi fıkhına ilişkin bir kitaptır. Tez bir giriş ve iki bölüme ayrılmıştır: Giriş: Şunları içermektedir: (Kitabın Hanefi fıkıhındaki önemi, konuyu seçme nedenleri, karşılaştığım zorluklar ve daha önce yapılan çalışmalar). Birinci bölüm: Çalışma bölümü şunları içerir: (Kitabın ve yazarın tanıtımı, yazarın kitaba yaklaşımı ve kitabın kaynakları). Ayrıca elde ettiğim yazma nüshaları anlatıp, önem sırasına göre ayırdığımdan ve kitabı incelerken hangi nüshalara güvendiğimden de bahsettim. İkinci bölüm: Sınırlar Kitabı'nın aşağıdakileri içeren bir bölümünü düzenledim: 1- Zinanın cezası (Hanefi fıkhında zinayla ilgili her şeyi kapsar) 2- İçkinin sınırı (Hanefi fıkhında alkol içmeyle ilgili her şeyi kapsar). Tezin sonunda bu bilimsel çalışmada ulaştığım sonuçlardan ve önerilerden bahsettim."
