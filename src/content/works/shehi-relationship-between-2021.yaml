abstract: "Bu çalışmanın temel amacı, piyasa riskinin seçilen belirleyicileri ile Türkiye'deki katılım bankalarının finansal performansı arasındaki ilişkiyi araştırmak ve konvansiyonel bankalarla karşılaştırmaktır. Piyasa riski belirleyicileri, faiz oranı (INT), döviz kuru (FX), enflasyon (INFL) ve kişi başına GSYİH'dir ve her iki banka için finansal performans belirleyicileri, varlıkların getirisi (ROA) ve özkaynak getirisidir (ROE). Türkiye'de faaliyet gösteren 3 katılım bankası ve 5 konvansiyonel banka için kullanılan ikincil veriler bulunmaktadır. Çalışmanın dönemi 2010-2019 yılları arasındadır. Çalışmada uygulanan testler, Artırılmış Dickey Fuller Birimi Kök testi, Johansen eş-bütünleşme testi ve Granger Nedensellik testi gibi panel veri testleri uygulanmıştır.Çalışmanın sonuçları, Türkiye'deki katılım bankalarının aktif getirisi ve özkaynak karlılığı ile faiz oranı, döviz kuru, enflasyon oranı ve kişi başına GSYİH'nin son derece önemli pozitif uzun dönemli bir ilişkiye sahip olduğu sonucuna varmaktadır. Ancak, değişkenler kısa vadede birbirleriyle önemli ölçüde ilişkili değildir. Geleneksel bankalar için uzun vadede katılım bankalarına kıyasla daha az önemli olumlu etki görülmektedir. Türkiye'deki katılım ve konvansiyonel bankaların finansal performansının belirlenmesinde örneklem büyüklüğünün artırılması ve daha fazla belirleyici faktörlerin yer alması ilerideki çalışmalar için önerilmektedir."
