abstract: "Bu çalışma, İslami ekonomik eğitime yönelik çağrıyı yenilemeyi ve Siyonist hegemonya altında hem aile hem de Kudüs okullarında uygulamanın pratik gerçekliğini belirlemeyi amaçlamaktadır. Bu çalışmanın amaçlarına ulaşmak için, çalışmanın teorik çerçevesi ile ilgili literatürün gözden geçirilmesine yardımcı olan tümevarım metodolojisi, betimsel ve analitik metodolojiler gibi çeşitli araçlarıyla betimsel yaklaşım kullanılmıştır. ekonomik eğitimin uygulanmasının pratik gerçekliğini ve Siyonist hegemonya altında hem ailede hem de Kudüs okullarında analizini tanımlamadaki alakaları. Ayrıca, bir anket aracının kullanıldığı bir saha çalışması yapılmış ve (300) form, Kudüs ailelerinden rastgele bir örneklem olarak dağıtılmıştır. Bunların hepsi %100 oranında geri alındı. Kudüs vilayetinde eğitim alanındaki dokuz okul müdürü ve karar verici ile de çeşitli görüşmeler yapılmıştır. Ardından, tümdengelim metodolojisi, Siyonist hegemonyanın boyutlarına ve Kudüs'teki pazar, toplum ve ailelere yansımalarına karşı bir gelecek eğitim vizyonu ve bir tedavi planı sunmak için metodolojik bir araç olarak kullanıldı. Çalışma, Siyonist hegemonyanın Kudüs'teki cemaat için iki yanında en büyük gerçek zorluğu oluşturduğu sonucuna varmıştır: çocuklar için ekonomik eğitimin uygulanmasında aile ve okul ve gelecek nesilleri işgücü piyasasına hazırlamada. Çalışma ayrıca İslami bir yatırım fonunun kurulması ve öğrenciler tarafından yönetilmesi için bir vizyon önerdi."
