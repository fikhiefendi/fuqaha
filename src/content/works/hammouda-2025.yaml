abstract: "Bu çalışma, Türkiye'deki İslami bankacılık sektöründe İslami finans mühendisliğinin rolünü değerlendirmeyi amaçlamaktadır. Kuveyt Türk Katılım Bankası'nı örnek alarak, İslami finans araçlarının operasyonel verimlilik, müşteri ihtiyaçlarını karşılama, ekonomik verimlilik sağlama, risk yönetimi ve rekabet gücünü artırma üzerindeki etkileri incelenmiştir. Araştırma, tümevarımsal ve betimsel analiz yöntemlerine dayanmakta olup, Kuveyt Türk'ün 2021-2024 yılları arasındaki finansal verileri kapsamlı bir şekilde analiz edilmiştir. Ayrıca, banka çalışanlarından veri toplamak için yapılandırılmış anketler ve bankanın İslami finans mühendisliği araçlarının etkinliğini ve şeriata uygunluğunu değerlendirmek amacıyla kıdemli bir satış yöneticisiyle planlı bir görüşme gerçekleştirilmiştir. Araştırma sonuçları, Kuveyt Türk Katılım Bankası'nın İslami finans mühendisliği araçlarını uygulamasının, bankanın hizmet kalitesini ve operasyonel süreçlerini geliştirerek ekonomik verimliliğini artırdığını, likidite ve risk yönetimini iyileştirdiğini ve Türkiye'deki bankalar arasında onuncu sıraya yükselmesine katkı sağladığını ortaya koymuştur. Çalışma, İslami finansal mühendisliğin Türkiye bankacılık sektöründe etkili ve rekabetçi bir alternatif olduğunu ortaya koymuştur. Ancak bunun için yasal düzenlemelerin İslami bankacılık yapısına uygun geliştirilmesi ve finansal inovasyonun artırılması gerekmektedir"
