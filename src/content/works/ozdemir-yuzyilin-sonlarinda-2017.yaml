abstract: "16. yüzyılın ikinci yarısında Osmanlı topraklarında artan yabancı gümüş miktarı, nüfus artışı, fiyat yükselişleri, uzun süren askerî mücadeleler Osmanlı para düzenini ve değerlerini etkilemiştir. Ayrıca 1585'te akçe, gümüş içeriği kayda değer miktarda azaltılmak suretiyle tağşiş edilmiştir. Tağşiş işleminden sonraki dönemde sikkelerin değerleri ve birbiri karşısındaki kurları konusunda yaşanan anlaşmazlıklar kadı sicillerine yansımıştır. Tezde, bu sorunların bir uzantısı olarak Hanefî âlimi Şemseddin Timurtâşî'nin (v.1599) dönemindeki para ve mübadele hareketlerine dair hukukî tahlillerini kaleme aldığı Nükûd Risalesi incelenmiştir. Bu risale 16. yüzyılın sonlarında sikkelerin değerindeki değişmelerin özellikle muâmele-i şer'iyye gibi akitlerde meydana getirdiği problemleri tasnif ve tahlil eder. Tezde, dönemin para ve mübadele sorunlarının kaynaklarından birinin de kadıların hüküm verme usûlündeki farklılıklar olduğu tespit edilmiştir. Timurtâşî'nin sorunlara dair çözüm önerisi aktarılıp değerlendirilmiştir. Orijinali Arapça olan Nükûd Risalesi tercüme edilmiş ve orijinaliyle beraber çalışmaya ek olarak sunulmuştur."
