abstract: "Kûfe şehri hicri 17. yılda Halîfe Ömer b. el-Hattâb'ın emriyle Sa ` d b. Ebî Vakkâstarafından askerî garnizon olarak kurulmuştur. Kûfe, kısa sürede bu garnizon kimliğindensıyrılarak bir şehir kimliğine bürünmüştür. Hanefî mezhebinin oluşum sürecinin ilksafhası olan re'y ekolü de Kûfe şehri merkezli olarak teşekkül etmiştir. Kûfe şehrinin DörtHalife, Emeviler ve İlk Abbasî dönemlerinde Kuzey-Güney Arapları, Emevî-Abbasiçekişmeleri, isyan hareketleri gibi siyasî mücâdelelerin yanında, Arap-Mevalî çekişmesivb. sosyal; vergi mükellefiyetindeki değişiklikler gibi iktisâdî olaylara sahne olduğubilinmektedir. Bu şehirde yetişen ve ileride Hanefî mezhebinin önde gelen imâmları olanfakîhlerin verdikleri fetvâlarda şehirdeki sosyo-kültürel zeminden etkilendiklerigörülmektedir. Tezimizde bu etkilenme, fıkhın siyer başlığı altında yer alan irtidâd(dinden dönme), arâzî hukuku (bu bağlamda sevâd arâzisi) ve esirlere yapılacak muâmelekonularında ortaya konulmaya çalışılmıştır"
