abstract: "Bu tez, İslam Hukukunun önemli konularından birisi olan“İslam Hukukunda Nikâh Akdinde Şahitlik”konusunu ele almaktadır. Araştırmacı, bu araştırmada şahitliğin anlamını, meşruluğunu, tahammül ve eda bakımından hükmünü, rükünlerini, tahammül ve edasının şartlarını açıklamaya gayret etmiştir. Daha sonra araştırmacı nikâhın anlamını, nikâh akdini ilan etmenin zaruretini ve nikâh akdinde şahitlik şartını açıklamış, sonra da İslam Hukukunun gizli nikâh karşısındaki tutumunu ortaya koymaya çalışmıştır. Ayrıca tezde, nikâh akdinde kadının rızası şartına ve şahitlerde bulunması gereken; Müslüman olmak, mükellef olmak, gözü görmek, konuşma yeteneğine sahip olmak, adil olmak vb. şartlara değinilmiştir. Sonra da iletişim kavramı ve modern iletişim araçları, şahitliğin söz konusu araçlarla eda edilmesinin hükmü ve bu araçlarla yapılacak olan şahitlikte göz önüne alınması gereken kriterler ele alınmıştır. Araştırmanın sonunda, nikâh akdinde şahitliğin modern iletişim araçlarıyla eda edilmesi konusunda alimlerin görüşlerine ve bunlara bağlı şer'î hükümlere değinilmiştir. Araştırmanın sonunda ise araştırmacının varmış olduğu en bariz sonuçları ihtiva eden bir Sonuç bölümü ile Kaynaklar yer almıştır."
