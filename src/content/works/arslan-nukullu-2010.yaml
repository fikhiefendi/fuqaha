abstract: "Tezimizde öncelikle Osmanlı Devleti'nde Fetvâhâne'nin ortaya çıkışı, kurumsallaşması ve bu dairede görev yapan kişilerin vasıflarını ele alacağız. İkinci olarak nukûllü fetvâ mecmûalarını, Osmanlı Devleti'nde Fetvâhâne tarafından muteber kabul edilen dört fetva mecmûası (Fetâvâ-yı Ali Efendi, Fetâvâ-yı Feyziyye, Behcetü'l-fetâvâ, Netîcetü'l-fetâvâ) özelinde, nüsha farklılıkları, nukûllerini derleyenlerin nitelikleri ve nikah-talak-radâ` bölümlerinde kullandıkları kaynaklar bakımından inceleyeceğiz. Bu çalışmada ayrıca mezkûr dört mecmûadan Behcetü'l-fetâvâ'nın nakillerini çıkaran, döneminin tartışılan meseleleri hakkında risâleler telif eden Fetvâ Emîni Mehmed Fıkhî el-Aynî'yi hayatı, eserleri ve bilhassa el-Ecvibetü'l-kâni`a ani'l-esileti'l-vâkı`a adlı eserinin özellikleri, kullandığı kaynaklar ve ele aldığı konuların hususiyetleri bakımından tetkik edeceğiz."
addedAt: 2026-09-24
