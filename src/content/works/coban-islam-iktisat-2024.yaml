abstract: "Dinamik bir bilim olan iktisat, her daim değişim ve gelişim içerisindedir. Temelleri Hz. Peygamber dönemine dayanan ve 20. yüzyılda şekillenmeye başlayan İslam İktisadı da dönemin şartlarına ve gereklerine uygun olarak ortaya çıkmış bir iktisadi sistemdir. İslam İktisadı, temelini cinsiyetçi bir kaynaktan almamasına rağmen erkek egemen bir iktisat sistemi olma yolunda varlığını sürdürmektedir. Dört bölümden oluşan tez kapsamında ilk bölümde Modern İktisat düşüncesinde kadının konumu ele alınmıştır. Çalışmanın ikinci bölümünde İslam İktisadı bağlamında kadının konumuna değinilmiştir. Üçüncü bölümde İslam'ın kadınının çalışmasına bakış açısına yer verilmiştir. Dördüncü bölümde ise literatür taraması yapılarak alanda yapılan çalışmalar incelenmiştir. Akabinde Web of Science veri tabanı üzerinden elde edilen 558 çalışma, VOSviewer programı aracılığıyla analiz edilerek elde edilen veriler görselleştirilmiştir. Çalışmanın sonucu göstermektedir ki, İslam İktisat düşüncesinde kadının konumu, İslam'ın ilkeleri göz önüne alındığında, teorik olarak oldukça iyiyken uygulama kısmında ikincil planda kalmaktadır. Bunun yanı sıra Müslüman kadınların çalışma hayatındaki yerine bakıldığında Hz. Peygamber döneminde birçok işte çalışan kadınların, günümüz dünyasında Müslüman erkekler tarafından din öne sürülerek daha geri planda tutulduğu görülmektedir. Bu da Müslüman ülkelerin ekonomik olarak geri kalmışlıklarının sebeplerinden bir tanesini oluşturmaktadır."
