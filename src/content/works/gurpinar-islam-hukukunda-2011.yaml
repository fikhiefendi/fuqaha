abstract: "İslam Hukukuna göre boşanma sonrasında erkek kadına boşanma nafakası vermelidir. Evliliğin kadının kusuru sebebiyle son bulması ve kadının geçimsiz (naşize) olması durumunda kadın bu hakkını kaybeder.İslam hukukuna göre boşanan kadının iddetini kocasının evinde geçirmelidir. Ancak mazeret ya da zaruret durumlarında evinden çıkabilir. Kadının çalışması ise zaruret dâhilinde değerlendirilmiş tğm izin yollarına başvurulduktan sonra evinden çıkmasına ruhsat verilmiştir.Kocanın nafakayı vermekten kaçınması ya da kayıp olması halinde kadın mahkemeye başvurarak nafaka temin talebinde bulunabilir.İslam Hukukunda ?maddi tazminat? mut'a ya benzetilerek meşru görülürken ?yoksulluk nafakası? nafaka sebeplerinin yok olması nedeniyle caiz görülmemektedir."
