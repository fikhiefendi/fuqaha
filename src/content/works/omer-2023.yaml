abstract: "Bu tezde kış mevsimiyle ilgili en önemli fıkhı içtihadları tartıştım, mezheplerin güvenilir kitaplarındaki en doğru sözlerine yer vererek öne alınan görüşleri tercihettim ve bu hükümlerin bilinmesi ibadetlerin en büyüğüdür ki Allahın insanı yarattığı amaça varmasına vesilsidir. Tez; giriş, önsöz ve iki bölümden oluşmaktadır.Giriş bölümünde araştırmanın önemi, seçmemin ve tezi yazma amaçlarından önceki çalışmalar ve araştırma metodolojisinden sözetmekti. Girişte (kış) mevsemi anlatıp lisan ehli ve fakihler arasında tanımını zikrettim, ardından kış mevsiminde yapılan ameller, içerdiği hadislere ve fazileti bakımından sahabe ve tabiinlerin sözlerine ve fakihlere atıfta bulundum. Kitaplarında kışla ilgili bazı kurallardan bahsetmişler, bende bunu yazıp açıkladım ve (kış) sözcüğüne bağladım. Birinci bölümde kış mevsimi ile ilgili temizlik hükümlerini ele aldım, bunun üzerine sokaktaki çamurun hükmünü ve bu konuda fakihler arasındaki ihtilafları sıraladım ve teyemmüm gerektiğinde hükmünü zikrettim. Soğukta teyemmüm almanın meşakkatini ve soğukta teyemmüm etmenin hükümlerini fakihlerinin görüşleriyle açıkladım. İkinci bölümde ise kış mevsimi ile ilgili namazın hükümlerini yazdım. Başlangıçta ezanın tanımı ve iki namazı cem' ederken (evlerde kılın) demenin hükmünü ve iki namazı bir araya getirmenin çeşitlerive fukahaları arasında tartışılan görüşlerin racih ve mercuh onun dışında yağmur ve kar özürlü namazı gerektiren durumlar ve yağmur geciktiğinde(istiska) namazın hükümler. ve Son olarak Oruçla ilgili hükümler az olduğu için namaz bölümünde bahsettim."
