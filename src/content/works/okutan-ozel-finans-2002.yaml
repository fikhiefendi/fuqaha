abstract: "ÖZET Personelin performansından tam olarak yararlanılması için personelin amaçlarıyla kurumun amaçlarının uyumlu olması yani bir anlamda kişi ve örgütün bütünleşmesinin sağlanması gerekir. Personelin performansını artırması, örgüt amaçlarını benimsemesi, bunun için yönlendirilmesi iyi motive olmasıyla mümkündür. Performans değerleme yapmadan personelin gelişimini sağlamak, ihtiyaçlarını tespit etmek mümkün değildir. Çalışanların gelişimini sağlamak, mevcut durumlarını tespit etmek, zayıf yönlerini görmek iyi bir şekilde uygulanacak performans değerlendirmesinden geçmektedir. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde çalışanların performans değerlemesi detaylı bir şekilde ele alınmıştır. İkinci bölümde ise, öncelikle dünyada ve ülkemizde faizsiz bankacılık uygulamaları hakkında bilgi verilmiştir. Daha sonra araştırmayı yapmış olduğumuz Özel Finans Kurumu tanıtılmıştır. Son olarak da sözkonusu Özel Finans Kurumunda performans değerleme esaslarından bahsedilmiştir. IX"
