abstract: "İmar hukukuna aykırı yapının kişilere zarar vermesi halinde yapı malikinin İmar Kanunundan doğan sorumluluğunun yanında özel hukuktan doğan sorumluluğu da gündeme gelecektir. Zira imar hukukuna aykırı yapılar çevresine zarar verici etkilere neden olabilirler. Bu kapsamda, imar hukukuna aykırı yapının zarar verici niteliğinden dolayı Türk Medeni Kanunu ve Türk Borçlar Kanunu hükümleri uyarınca yapı malikinin zarar görenlere karşı sorumluluğu bulunmaktadır. Literatürde imar hukukuna aykırı yapılardan dolayı İmar Kanunu gereğince uygulanan yıkım ve para cezası yaptırımları incelenmiş, ancak bu yapılardan dolayı zarar gören kişilere karşı yapı malikinin özel hukuktan doğan sorumluluğu incelenmemiştir. İmar hukukunun özel hukuk ile yakın ilişkisi göz önüne alındığında bu konudaki eksikliğe tezimde ışık tutulmaya çalışılmıştır."
