abstract: "Allah Teâlâ Kur'ân-ı Kerîm'i indirirken ve Hz. Peygamber (sav) İslâm'ı tebliğde bulunurken bir takım hükümlere ve konulara öncelik vermişlerdir. Kur'ân-ı Kerîm, 23 yılda yaşanan olaylara ve olgulara binaen peyderpey Hz. Peygamber'e (sav) indirilmesi, Mekke'de indirilen hükümler ile Medine'de indirilen hükümler arasında belirgin farklılıklar bulunması, Kur'ân-ı Kerîm'de bazı âyet ya da sûrelerin indirilme sebeplerinin olması ve kimi zaman bir hükmün başka bir hükümle kaldırılması bazı konulara öncelik verildiğinin açık delilidir. Mekke döneminde imanî ilkeler tüm durumlara öncelenmiştir. Dinin en temelinin itikad olduğu ortaya konulmuştur. Allah Teâlâ'nın varlığı, birliği, kudreti, âhiret gününe iman ve peygamberlere iman Mekkî sûrelerde en çok ele alınan konulardandır. Mekkî sûrelerde imanî ilkeler dışında en çok söz edilen diğer bir husus ahlâktır. Dünya hayatına tamah etmemek, takvâ sahibi bir mümin olmak, gerektiği durumlarda sabır ve sebat gösterebilmek, cimrilik yapmamak, eli açık gönlü geniş olmak, böbürlenmemek ve başka kimseleri ezmemek, adaletli davranmak, yaratılışta tüm insanların eşit olduğunu ve eşitliği hak ettiği bilmek, ölçüde ve tartıda hakkaniyetli olmak, yetimleri ve yardıma muhtaçları gözetmek, anne ve babaya iyi davranmak temelahlâkî değerlerdendir. Medeni sûrelerde ise en çok cihadın, Allah Teâlâ için çabalamanın üzerinde durulmuş ve öncelenmiştir. Bu sûrelerde İslâm dinin ibâdât ve muamelât kısmı tamamlanmıştır."
