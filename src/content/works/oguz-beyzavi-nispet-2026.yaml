abstract: "Kur'ân-ı Kerîm'in ahkâm âyetlerini tefsir ederek bireysel ve toplumsal hayata dair hükümler çıkarmayı amaçlayan Ahkâmü'l-Kur'ân ilmi, tefsir literatürünün önemli bir parçasını oluşturmaktadır. Nitekim Kur'ân hükümlerinin izahı ve hayata aktarılması gaye-siyle kaleme alınan pek çok eser mevcuttur. Bu eserlerden biri de çalışmaya konu olan Kütahya Vahit Paşa Kütüphanesi Vahit Paşa Koleksiyonunda 1686 demirbaş numarasıyla kayıtlı bulunan Kitâbu Ahkâmi'l-Kur'ân Te'lîfü'l-Âlimi'l-Âllâme el-Kadî el-Beyzâvî isimli el yazması ahkâm tefsiridir. Çalışmanın temel amacı söz konusu eseri şekil, muhteva ve metodoloji açısından bütüncül bir yaklaşımla ele almaktır. Çalışmada nitel araştırma yön-temlerinden doküman incelemesi kullanılmış; ilgili âyetlerin tefsiri temel kaynaklarla mu-kayese edilerek incelenmiştir. Yapılan mukayeselerin teferruatına girilmeksizin, bu incele-melerden elde edilen nihai tespite yer verilmekle iktifa edilmiştir. Bununla birlikte, kütüp-hane kayıtlarına göre tek nüsha olduğu değerlendirilen bu yazma eserin incelenip tanıtıl-ması, ilgili literatüre katkı sağlaması bakımından önem arz etmektedir. Sonuç olarak eserin künyesinde zikredildiğinin aksine Kâdî Beyzâvî'ye ait olmadığı tespit edilmiş, ancak ger-çek müellifin kimliği ise meçhul kalmıştır. Buna binaen mahtut eserin, başta Zemah-şerî'nin el Keşşâf ve Beyzâvî'nin Envâru't-Tenzil ve Esrâru't-Tevil adlı tefsirleri olmak üzere belirli kaynaklardan iktibas edilerek telif edilmiş dirâyet ağırlıklı muhtasar bir tefsir olduğu neticesine ulaşılmıştır."
