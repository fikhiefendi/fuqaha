abstract: "Bu çalışmada İmâmiyye Şîa'sına göre 'İsmet' kavramı, delilleri, buna olan akideleri ve kimler hakkında geçerli olacağını çalıştım. İsmet kavramı ve delillerine ek olarak 'Ma'sûm'un ismetliğinin(ma'sûmiyetinin) dereceleri ve bunu kabul ve red durumlarını da beyan ettim. Bundan sonra İmamiyye Şîa'sı ve diğer İslam mezheplerinin akideleri arasındaki alaka ve benzerlikleri açıklamaya çalıştım. Ayrıca 'hilafet' meslesindeki inançlarını da ele aldım. Bu bağlamda her bir bölümde ma'sûmiyetin kimler tarafından nisbet edildiğini tek tek ele aldım. Zira İmamiye Şîa'sı, 'İsmet'i sadece peygamberlere has kılan diğer İslâmî ekollerden ayrışıp yalnız kalmaktadır. Ancak İmamiyye ise -isminden de anlaşılacağı üzere- ma'sûmiyeti kendilerince 'İmâm' olarak nitelendirdikleri kimselere isnat etmektedirler. Ve ma'sûmiyetin 'velayeti fakîh' sahibi kişiyle ilişkilendirilmesi onlarda ortaya çıkmıştır. Her konuyu tüm bölümlerde onların ifadeleri ve delilleriyle açıkladım. İmamiyye Şîa'sının tanımı, mezhepleri, gelişimi, nübüvvet meselesine dair bazı akidevî tarifleri gibi konulardaki gerekli açıklamaları her bir bölümde ekledim. Bunun yanında 'İmâmet' bahsi ve felsefesi hususunda doyurucu açıklamalarda bulundum. Son bölümde ise; modern dönem Şia muhitlerinde geniş bir tartışmaya sebep olan 'velâyet-i fakîh' meselesini ele aldım. Ve 'İsmet' kavramı çevresinde gelişen 'velâyeti fakîh' konusuna dair Şi'î merkezlerinde ve diğer İslam coğrafyalarında gelişen tartışma, kabul ve redde dair görüşleri açıkladım."
