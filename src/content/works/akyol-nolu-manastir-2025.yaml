abstract: "Bu çalışmada Osmanlı tarihinin en önemli arşiv kaynakları arasında yer alan Şer'iyye sicilleri temelinde Manastır sancağının idari, sosyal ve ekonomik yapısının incelenmesi amaçlanmaktadır. Bu amaç çerçevesinde 1797-1798 yılları arasını kapsayan 75 numaralı Manastır şeriyye sicili esas alınmıştır. Söz konusu sicilin transkribi yapılarak belgelerin özetleri çıkarılmış ve bu belgeler temelinde değerlendirmelerde bulunulmuştur. Transkribi yapılan sicil diplomatik özellikleri bakımından tereke (34), ferman (27), buyruldu (16), fetva (8), ihtida (2), mürasele (2), berat (1), temessük (2) ve narh (1) olmak üzere 93 belgeden oluşmaktadır. Bu noktada Manastır sancağına bağlı kaza ve karye gibi idari birimler, sancakta yürütülen ekonomik faaliyetler ve sancağın sosyal durumuna dair birtakım veriler ortaya konulmuştur. Bu çerçevede sicilde yer alan muhallefat kayıtlarından halkın kullandığı gayrimenkuller, ev ve mutfak eşyaları, savaş aletleri, giyim kuşam, takıları ve kitapları gibi hususlarda bilgiler verilmiştir. Ayrıca halkın beslediği hayvanlar ve ödedikleri vergilere dair bilgiler de çalışmada ele alınmıştır. Bunların yanı sıra çalışmada mehir, miras, alacak-verecek ve vakıflara ilişkin de değerlendirmelerde bulunulmuştur. Belgelerde özellikle Paspanoğlu Osman şahsında Manastır sancağındaki eşkıyalık olaylarına detaylı bilgiler verilmiştir. Çalışmada ortaya konulan tüm bu verilerin Manastır sancağının en azından 18. yüzyılın sonlarındaki tarihinin ortaya konulmasına katkı sağlayacağı düşünülmektedir."
