abstract: "Türkiye'de temelleri 1983 yılında“Özel Finans Kurumları”adıyla atılan katılım bankacılığı, son yıllarda hızlı bir gelişme göstermiştir. Bu hızlı gelişmenin en önemli nedeni 2005 yılında yürürlüğe girmiş olan 5411 sayılı Bankacılık Kanunu'dur. Bu kanun ile beraber katılım bankaları mevduat bankaları ile aynı düzenlemelere tabi olmuştur. Olumlu ekonomik koşulların ve yapılan olumlu düzenlemelerin dışında katılım bankalarının gelişimlerini sürdürebilmeleri için finansal tablolarının ve faaliyetlerinin anlaşılabilirliği önemlidir. Bu çalışmanın amacı, Türkiye'de faaliyet gösteren katılım bankalarında uygulanan finansal raporlamanın anlaşılabilirliğinin tespitidir. Bu amaç doğrultusunda, ilgili katılımcılara anket uygulanmış ve konu ile ilgili algıları belirlenmiştir. Sonrasında veriler faktör analizi, Kruskal-Wallis H Testi ve Mann-Whitney U Testi gibi istatistik yöntemlerle değerlendirilmiş ve elde edilen sonuçlar yorumlanmıştır. Son olarak, araştırma ile ilgili sonuçlar ifade edilmiş ve önerilerde bulunulmuştur."
