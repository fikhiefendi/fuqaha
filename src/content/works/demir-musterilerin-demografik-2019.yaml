abstract: "Bu çalışma ile bireylerin katılım bankalarını tercih ederken hangi faktörleri, ne ölçüde göz önünde bulundurdukları tespit edilmeye çalışılmıştır. Demografik değişkenlerin, tercih faktörleri üzerindeki etkisi tespit edilmeye çalışılmıştır. Bu amaçla Gaziantep ili merkez ilçelerinde (Şehitkâmil, Şahinbey) 274 katılım bankası müşterisi ile yüz yüze anket yöntemi ile uygulama gerçekleştirilmiştir. Çalışmanın analizi için, IBM SPSS Statistics 23 Programı kullanılmış, açıklayıcı faktör analizi, t- testi, f- testi, Welch, Brown ve Forsythe testinden yararlanılmıştır. Araştırmanın analiz sonuçlarına bağlı olarak durum tespiti yapılmış; bankacılık sektörüne ve özelinde katılım bankalarına tavsiyelerde bulunulmuştur. Çalışmanın sonucunda müşterilerin katılım bankası tercihlerini etkileyen değişkenler beş faktör altında toplanmıştır. Bu faktörler şunlardır: ''Kurumsal İmaj Faktörü'', ''Finansal İmkânlar Faktörü'', ''Şube ve Alternatif Kanal Ağ Faktörü'', ''Banka ile ilgili Fiziksel özellikler Faktörü'' ve ''Personel ile ilgili Özellikler''dir. Tercih faktörleri ile demografik değişkenler arasında anlamlı farklılıklar bulunmuştur."
