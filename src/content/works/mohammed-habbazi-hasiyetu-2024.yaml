abstract: "HABBÂZÎ'NİN HÂŞİYETÜ'L-HİDÂYE ADLI ESERİNİN TAHKİK ve TAHLİLİ (Kitâbu't-Tahâre'den Kitâbu'ş- Şerike'ye Kadar) Shakhawan Shaban Mohammed MOHAMMED Erciyes Üniversitesi, Sosyal Bilimler Enstitüsü Doktora Tezi, Ekim 2024 Danışman: Doç. Dr. Menderes GÜRKAN ÖZET Bu çalışma, bir değerlendirme ve Hanefî fıkhına dair İmâm Merginânî (ö. 593/1197) tarafından yazılan meşhur el-Hidâye isimli eser üzerine yazılan önemli şerhlerden biri olan Habbâzî'nin (ö. 691/1292) Hâşiyetü'l-Hidâye isimli eserinin Kitâbu't-Tahâre'den Kitâbu'ş-Şerike'ye kadar olan kısmının tahkikini içermektedir. Bu eserde Habbâzî, el-Hidâye'nin problemli yerlerini şerh etmiş, kapalı olan yerleri açıklamış ve bu sebeple de Hanefî mezhebinde hüsn-ü kabul görmüş ve şöhret kazanmıştır. Bu çalışmanın önemi, Hanefî mezhebine ait yazma olarak bulunan fıkıh kitaplarından birinin tahkik edilmesinde ve Hanefî fukahası içerisinde fakih ve usulcü yönüyle tanınan İmâm Habbâzî'nin fıkhî yönünü ortaya koymasında yatmaktadır. Çalışma; bir giriş, üç bölüm ve tahkik kısmından oluşmaktadır. Giriş kısmında ele alınan konunun önemi, hedefi, araştırmada izlenen yöntem üzerinde durulmuş ve araştırmanın planına yer verilmiştir. Ardından birinci bölümde kısaca İmâm Merğinânî'nin hayatından ve Hidâye adlı eserinden bahsedilmiş, ikinci bölümde Habbâzî ve Hidâye üzerine yazdığı haşiye hakkında daha detaylı bir bilgi verilmiş, üçüncü bölümde ise tahkikte izlediğimiz yöntem hakkında bilgi verilmiş ve tahkikte yararlandığımız 4 nüsha tanıtılmıştır. Bundan sonra da söz konusu eserin tahkik kısmı yer almaktatır. Çalışmada 4 nüsha esas alınmış olup tahkik kurallarına uygun olarak mümkün olduğunca doğru ve hatadan uzak bir metin oluşturulmasına özen gösterilmiştir."
