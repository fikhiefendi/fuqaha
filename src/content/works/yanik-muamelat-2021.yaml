abstract: "Tarihî vetirede ezilen, zorbalığa mâruz bırakılan ve haklarından mahrum edilen kadını cinsiyet, toplumsal cinsiyet, hak ve ödevler bağlamında hak ettiği konumuyla buluşturan İslâm'dır. İslâm Fıkhı'nın el-ahvâlü'ş-şahsiyye kapsamında kalan konularını ilgilendiren muâmelât, hak ve sorumluluklarına bağlı olarak kadın ve erkek varlıkları arasındaki farkın en bâriz şekilde ortaya çıktığı hukukî alanı temsil etmektedir. Nikâh, talâk, velâyet, nafaka, mehir, şahitlik, miras gibi pek çok başlıkta kadın-erkek arasında bireysel ve sosyal adâlet temelli bir rol dağılımı esas olup, bilhassa kadın lehine özel bir takım uygulama ve ayrıcalıklar söz konusudur. Hem kadın lehine pozitif kayırma/ayrım ile hükmedilip hem de cinsler arasında adâletin korunabilmesi İslâm hukukunun ilke ve prosedürlerinin orjinalitesiyle ilgilidir. Muâmelât fıkhını ilgilendiren konu başlıkları ile özel uygulamalarda ortaya çıkan kadın-erkek farkını İslâm hukuk doktrinleri bakımından görüş ve delilleriyle ortaya koymayı amaçlayan bu çalışma, aynı hukukî konuların mer'î kanunlar kapsamında nasıl değerlendirildiğini de tahlil etmeye yönelik düzenlenmiştir."
