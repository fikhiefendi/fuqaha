abstract: "Kurumlar bir devletin olmazsa olmazlarıdır. Varlıkları bakımından tüm kurumlar ihtiyaçtan doğar ve devlet için önem arz eder. Ancak i?levleri bakımından bazı kurumlar daha fazla öneme sahiptir. Adalet kurumu da bu ?ekilde öneme sahip olan kurumlardandır. Osmanlı Devleti de kurumsalla?masını tamamlayıp devlet olma vasfını ele aldıktan sonra adalet konusuna oldukça önem vermi?tir. Adalet ve bunun simgesi olan mahkemeler her zaman bağımsız ?ekilde görev yapmı?lardır. Buralarda görülen davalar ve bunların içerikleri ise sonraki zamanlarda itirazlara meydan vermemek amacıyla kayıt altına alınmı? ve taraflarla ?ahitlere ayrı ayrı imzalatılmı?tır. Bu uygulama ise“?er'iyye sicili”kavramını ortaya çıkarmı?tır. Transkripsiyonunu yaptığımız 312 Nolu Diyarbakır ?er'iyye Sicili de bu defterlerden biridir ve 1881 - 1883 yılları arasında Osmanlı Devleti'nin eyaletlerinden biri olan Diyarbakır'da görülen bazı davaları içermektedir. ?ncelediğimiz sicil defterinde toplamda 341 adet hukuki mesele i?lenmektedir. Bunlar arasında miras tayini, alacak verecek konuları vb. ağırlıktadır. Sicilde yer alan bilgiler yerle?im yeri, mahalle, köy gibi detayları da içerdiği için bahsi geçen dönemde eyalete bağlı olan birimler hakkında da bilgiler elde edilmektedir. Ayrıca davalı tarafların veya ?ahitlerin yaptıkları i?lerin kaydedilmesi temel ekonomik faaliyetler hakkında da bilgi vermektedir."
