abstract: "Özet İmam Şa'rânî 16.yy.'da yaşamış mutasavvıf bir şafii fakîhidir. Başta tasavvuf ve ahlak olmak üzere pek çok alanda eserler telif etmiştir. Şarânî'nin fıkıh alanında telif ettiği eserlerinden biri olan el-Mîzân İslam fıkıh tarihi, teori ve uygulaması konularında özgün bir bakış açısı teklif eder. Bu yüzden modern araştırmacıların da dikkatini çekmiştir. Şa'rânî her mezhep ve müçtehidin görüşünün doğru (musîb) olduğunu ifade eden Musavvibe görüşüne nazari ve itikadi bir temellendirme getirmiştir. Şa'rânî ortaya koyduğu“mizan”metoduyla müçtehid imamların, onların görüşlerini takip edenlerin (mukallid) ve kıyamet gününe kadar gelecek müçtehidlerin içtihadlarında isabetli olduklarını ifade eder. Özetle ifade etmek gerekirse usulüne uygun yapılan tüm içtihadları Şâri'in bizzat murad ettiğini ve şeriatını bu ihtilaflara neden olacak şekilde indirdiğini düşünür. Ona göre bu ihtilaflar şeriatın genişliğine sebeptir ve Allahın rahmetinin bir tecellisidir. İhtilaflı olan tüm meseleler mizanın iki mertebesi olan teşdid ve tahfife rücu eder. Bu hükümlerden uygulaması zorluk içerenler (teşdîd) iman açısından ve bedenen kuvvetli mükellefe, daha kolay olanlar (tahfîf) her iki açıdan zayıf mükellefe hitap etmektedir. el-Mîzân üzerine ülkemizde ve ülke dışında bazı çalışmalar yapılmış olmakla birlikte görebildiğimiz kadarıyla Şa'rânî'nin ortaya koyduğu Mizan metodunun tüm vecheleriyle tasviri ve değerlendirmesi yapılmamıştır. Mevcut çalışmalardaki tespit ettiğimiz bir takım eksikler ve yer yer önemli hatalar yanında bize göre en önemli olumsuzluk, eserin ve içerdiği düşüncelerin tam bir tasvirinin yapılmamış olması ve bu düşüncelerin yorumunda yazarının sufi kişiliğinin aşırı bir şekilde vurgulanmasıdır. Mevcut çalışmaların büyük bir bölümü konuyu bu bakış açısıyla ele almış, bu yüzden eseri yazarın sûfî karakterinin bir yansıması olarak değerlendirmiş, dolayısıyla eserin yazarın bulunduğu sufi-ilmi ortamın ihtiyacı doğrultusunda zorlama yorumlarla kaleme alındığı izlenimi verilmiştir. Eserin yazarın kişiliğiyle ilişkisini reddetmemekle birlikte, kanaatimizce, bunun aşırı bir şekilde vurgulanmasının yazarın düşüncelerinin özgünlüğünü ve sahip olduğu içkin değeri görmeyi engelleyebileceği hususu göz ardı edilmemelidir. Bu yüzden biz tezimizde Şa'rânî'nin el-Mîzân'da dile getirdiği temel düşünceleri şahsın kişiliğinden ve çevresel faktörlerden bağımsız bir şekilde ve kapsamlı olarak ele alacak, böylece müellif ve eserle ilgili alternatif bir yorum teklif etmeye çalışacağız. Bu bağlamda Şa'rânî'nin fasıllar başlığı altında ele aldığı meselelerin kapsamlı bir tasvirini ve Mizan metodunun fıkhî meselelere ne şekilde yansıdığını değerlendirmeyi hedefliyoruz."
