abstract: "Son yıllarda küresel düzeyde faizsiz bankacılığın yaygınlaşmaya başlaması ile birlikte bankacılık sistemleri içerisinde faizsiz bankaların da yer aldığı ülkelerin merkez bankaları, para politikalarını ve para piyasalarını yönetmek için çeşitli faizsiz finansal ürünler kullanmaya başlamışlardır. Bu çalışmamızda, faizsiz finans alanında dünyanın çeşitli bölgelerinde öncü olan ve faizsiz bankalarla aktif olarak çalışan Malezya, Bahreyn ve İngiltere başta olmak üzere bazı diğer Körfez Ülkeleri'nin merkez bankaları araştırma kapsamına alınmış ve bu merkez bankalarının hangi ürünlerle faizsiz bankacılık üzerinden para politikası hedeflerine ulaştıkları ve para piyasalarını yönettikleri araştırılmıştır. Türkiye Cumhuriyet Merkez Bankası (TCMB) ise son yıllarda, Türkiye'deki katılım bankalarına faizsiz bankacılığa özgü bazı ürünler sunmuş olmakla birlikte bu ürünlerin bazıları faizsiz bankacılık ilkeleriyle çelişmektedir. Bununla birlikte TCMB, konvansiyonel bankalara sunduğu birçok imkânı ise, henüz katılım bankalarına sunmamıştır. Çalışmamızda, dünya örneklerinin araştırılması sonucunda TCMB'ye; hem faizsiz bankalara sunduğu mevcut faizsiz bankacılık ilkeleriyle çelişen ürünlere alternatif ürünler, hem de katılım bankalarına henüz sunulmamış fıkhi açıdan uygun yeni ürünler önerilmiştir. Ayrıca tez sonunda, TCMB'ye ikili (dual) finansal sisteme işlerlik kazandırabilecek farklı bir yaklaşım sunulmuştur. Bu yaklaşıma göre; TCMB, belirleyeceği politika getiri oranı sayesinde, reel sektörü desteklemekle görevli olan katılım bankaları üzerinden kredi kanalı yoluyla parasal aktarım mekanizmasını çalıştırarak piyasadaki para-mal dengesinin kurulmasına katkı sağlayacaktır."
