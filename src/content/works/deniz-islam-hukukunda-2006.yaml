abstract: "ÖZETYazar : Abdülbaki DENİZÜniversite : Uludağ ÜniversitesiAnabilim Dalı : Temel İslam BilimleriBilim Dalı : İslam HukukuTezin Niteliği : Yüksek Lisans TeziSayfa Sayısı : xiii + 150Mezuniyet Tarihi : / / 2006Tez : Prof. Dr. Yunus Vehbi YAVUZdanışman(lar)ıİSLAM HUKUKUNDA İLLET KAVRAMI VE FAİZİN İLLETİBu çalışma, gelenek ile modernizm ikilemi arasında kendine yer bulmayaçalışan kavramlardan biri olan ?faiz ve illeti problemi? ile ilgili olarak ortayaçıkmıştır. İslam Hukukunda değişik değerlendirmelere konu olan faiz olgusu veonun felsefi altyapısını oluşturan ?illet? kavramı detaylı bir şekildearaştırılmaktadır. Bu çalışmada faizin mahiyeti ve tarihçesi, İslam'da faize bakışkonularıyla birlikte illet olarak ifade ettiğimiz faizin teorik gerekçesi üzerinde birçok açıdan odaklanılmıştır. Genel olarak semavi dinlerin faize bakışı, aralarındaOsmanlıların da bulunduğu bazı beşeri sistemlerin pratikte faiz problemine nasılbaktıklarına değinilmiştir. Bu arada Kur'an ve Sünnet'te faiz ve illeti hususundabilgi verildikten sonra illet hakkında değişik mezhep ve alimlerin görüşlerine yerverilmiştir.Şüphesiz sosyo-ekonomik bir olgu olan faiz problemi ile ilgilideğerlendirmeler devam edecektir. Zira faiz olgusu ile ilgili olarak ?Ekonomininbel kemiği ve lokomotifi? şeklinde yapılan değerlendirmeler yanında?Ekonomileri iflasa götüren sömürü aracı? gibi ifadeler iktisadi hayatın bilinengerçeklerindendir. Buna dini argumanları da kattığımızda gerçekten içindençıkılması zor bir durum ortaya çıkmaktadır. Bu arada faizin oran, zaman vezemini ile ilgili ortaya atılan değişik görüşler bazılarının kendi dünya görüşünütemellendirirken başvurduğu önemli malzemeler olarak değerlendirilmiştir.Sonuçta günümüzdeki faiz probleminin sadece İslami hassasiyetlere sahipinsanların değil bütün herkesin problemi olduğu genel kabul gören bir gerçektir.Bu hassasiyete binaen bu çalışmada özellikle illet kavramı ile ilgili klasikfıkıh kitaplarında ortaya atılan bazı izahlar sorgulanmakta ve faizin illetine yenibir bakış açısı kazandırılmaktadır. Böylece faizin nitelik ve kapsamı bağlamındayeni bir tanımlama denemesi yanında özellikle illet kavramını günümüz iktisadigerçeklerine uygun bir tarzda değerlendirmenin önemine vurgu yapılmaktadır.Anahtar SözcüklerFaiz problemi İllet Faizin mahiyetiiii"
