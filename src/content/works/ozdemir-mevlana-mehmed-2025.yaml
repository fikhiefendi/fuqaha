abstract: "Bu çalışmada, İzmîrî'nin İbrâhim el-Halebî'nin (ö.956/1549) Osmanlı coğrafyasında geniş şöhret kazanarak kadı ve müftülerin temel başvuru kaynaklarından biri hâline gelen Mülteka'l-ebhur adlı eseri üzerine kaleme aldığı Kemâlü'd-dirâye ve cemü'r-rivâye ve'd-dirâye adlı şerhi ele alınmaktadır. Çalışmanın temel amacı, Kemâlü'd-dirâye'de başvurulan şerh metodunu ortaya koymak ve eserin dayandığı kaynakları tespit etmektir. İzmîrî Kemâlü'd-dirâye'de Mülteka'nın sistematiğini büyük ölçüde takip etmiş, metindeki meseleleri örnekler aracılığıyla detaylandırmış, anlaşılması güç ifadeleri açıklamış ve hükümleri Hanefî mezhebinin istidlâl metotları çerçevesinde delillendirmiştir. Ayrıca gerek mezhep içi gerek mezhep dışı görüşleri aktarıp değerlendirmeye tabi tutmuştur. Araştırma neticesinde İzmîrî'nin bunların yanı sıra esere üslûp ve muhteva açısından katkılarda bulduğu görülmüştür. Nitekim O, bazı meselelerin başında konunun ana çerçevesini çizmiş, metinde geçen kavramları karşılaştırmalı bir şekilde tahlil etmiş, soru-cevap yöntemiyle muhalif görüşleri tartışmış, konu sonunda meseleyi özetlemiş, gerektiğinde önceki ve sonraki açıklamalarına atıfta bulunmuş, konu geçişlerine işaret etmiş ve meselelerin inceliklerine dikkat çekmek amacıyla zaman zaman okuyucuya hitap etmiştir. Böylece metni belirli bir sistematik içinde şerh ederek konular arası bütünlüğü sağlamaya çalışmıştır. İzmîrî metinde ele alınan meseleleri ve bunların dayandığı teorik zemini tartışmış, mezhepler arası ve mezhep içi ihtilafları değerlendirerek tercihlerde bulunmuş, görüş ayrılıklarının dayandığı delil ve kaidelere müracaat ederek muhalif görüşlerin isabetsizliğini ve benimsediği usûlün isabetini ortaya koymuş, Kur'an, Sünnet ve mezhebin istidlâl metotları çerçevesinde içtihatta bulunarak eserinde bu doğrultuda verdiği fetvalara değinmiş; zaman zaman gerek Halebî'ye gerekse daha önce telif edilen eserlere muhalefet etmiş, metinde değinilmeyen meselelere ve dönemin tartışma konularına yer vererek dönemin gereklerine cevap vermeye çalışmıştır. Ayrıca daha çok erken dönem Hanefî eserine başvurmakla birlikte mezhebin teşekkülünden kendi dönemine kadar uzanan oldukça geniş bir literatürden istifade etmiştir."
