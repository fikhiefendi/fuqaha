abstract: "Roma Hukuku kuralları imparatorluk sınırlarını aşmış ve birçok hukuk sistemini etkileyerek kanunlaştırma çalışmaları açısından bu hukuk sistemlerine kaynaklık etmiştir. Roma Hukukunun modern hukukumuzu en çok etkilediği alan Borçlar Hukuku alanıdır. Borçlar Hukukunda yer alan borç, sözleşme, sorumluluk vb. kavramlar Roma Hukuku'na dayanmaktadır. Çalışmamızın konusunu oluşturan Ariyet Sözleşmesi de Roma Borçlar Hukuku'nda düzenlenmiş ve günlük hayatta geniş bir uygulama alanı bulmuştur.Türk Hukuku'nda ariyet sözleşmesi, Mecelle'de Kitabü'l Emânât başlığı altında altıncı kitap olarak vedia sözleşmesiyle birlikte düzenlenmiştir. Ariyet sözleşmesi, İslam-Osmanlı Hukuku'nda da hayırseverlik esasına dayanan bir sözleşme türü olmuştur.818 Sayılı Borçlar Kanunumuzun 299 ve devamındaki maddelerinde de ariyet sözleşmesi düzenlenmiştir. 1 Temmuz 2012 tarihinde 818 Sayılı Kanunun yerini alacak olan 6098 sayılı yeni Borçlar Kanunumuzun 379. maddesinde ariyet kelimesi yerine“kullanım ödüncü”tabiri kullanılmıştır. Fakat iki kanun karşılaştırıldığında, iki kanun arasında ariyet sözleşmesi ve hükümleri açısından kanun maddelerinin arılaştırılması dışında bir fark yoktur.Bu tezin amacı, Roma Hukuku'nda düzenlenen ariyet sözleşmesi ile Türk Hukuku'nda düzenlenen ariyet sözleşmesi hakkında ve 1 Temmuz 2012 tarihinde 818 Sayılı Borçlar Kanunumuzun yerini alacak olan 6098 sayılı yeni Borçlar Kanununda yer alan“kullanım ödüncü”sözleşmesinin nasıl düzenlendiği hakkında genel nitelikte bilgi vermek; ariyet sözleşmesi açısından Roma Hukuku ile Türk Hukuku arasındaki benzerlik ve farklılıkları ortaya koymaktır.Tez, giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde ariyet sözleşmesi hakkında genel olarak bilgi verilmiş ve konunun işleniş sırasından bahsedilmiştir. Birinci bölümde Roma Hukuku'nda borçların kaynakları ve akitten doğan borçlar; ikinci bölümde Roma Hukuku'nda ariyet akti ve hükümleri üçüncü bölümde de Türk Hukuku'nda ariyet akti ve hükümlerinden bahsedilmiştir. Sonuç bölümünde ise ortaya konulan bütün bilgilerden sonra iki hukuk sistemi açısından ariyet aktinin bir mukayesesi yapılmıştır. Ayrıca sonuç kısmında tez hakkında kısa bir özet de yer almaktadır."
