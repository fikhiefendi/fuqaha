abstract: "İslam Şeriatı Dünya'da ve Ahiret' te kulların menfaatlerini gözetmek, işlerini düzenlemek ve hayatlarını kolaylaştırmak için Allah Teala tarafından vaz' edilmiş kanunlar bütünüdür. Bundan dolayı İslam Hukuku'nda adalet ve rahmet kavramları büyük öneme haizdir. Gelmiş geçmiş bütün ümmetlerin, hayatlarını düzene koyan ve uydukları bir takım kurallar var olagelmiştir. Çünkü insanların olaylara bakış açıları farklılık arz etmektedir ve eğer herkesin uyacağı belli kurallar bütünü olmazsa ayrılığa düşmeleri ve çatışmaları kaçınılmaz hale gelir. Bu yüzden Allah Teala İslam ümmetine yollarını aydınlatması için kanunlar vaz' etmiştir. Her ne kadar bazıları Allah'ın vaz' ettiği kanunları terk ederek İlahi olmayan kanunlarda adalet arayışına girse de bu çabalar boşunadır. Araştırmacı bu çalışmada İslam Hukuk'unda yer alan İslami Düzenin özelliklerini ortaya koymaya çalışmıştır. Bu çalışma İslam Düzeninin özelliklerini belirleyerek, yapısını ve maksatlarını açıklamayı hedeflemektedir. Ve aynı şekilde araştırmacı bu çalışmada İslam Kamu Düzeni kapsamına giren pek çok fıkhi meseleleri açıklamayı hedeflemektedir. Bu yüzden araştırmacı bu çalışmada, kamu düzeni kavramını, usulünü, delilliğini ve maksatlarını ele almıştır. Aynı şekilde fıkıh kitaplarını inceleyerek ve kamu düzeni ile ilgili hükümleri çıkartmak suretiyle, kamu düzeni altında yer alan fer'i konuları da ele almıştır."
