abstract: "Fukaha arasında sahâbe döneminden itibaren gittikçe artarak koyulaşan ihtilaflar, tebe-i tâbiîn döneminde ehl-i hadîs ve ehl-i re'y adlarıyla ekolleşmiş ve her bir ekolün içerisinden birden fazla mezhep ortaya çıkmıştır. Ehl-i hadîs geleneği içerisinde yetişen Dâvûd ez-Zâhirî, geçmişten beri var olan ihtilafları ve yaşadığı dönemde ortaya çıkan karmaşa ortamını sonlandırmak ve hukukta keyfîliği gidermek için Hicrî III. yüzyılda zâhirîliğin ekolleşmesini başlatmış ve mezhebin kendine has dinamiklerinin oluşmasını sağlamıştır. Bu çalışmada sahâbe döneminden itibaren Dâvûd ez-Zâhirî'nin yaşadığı döneme gelinceye kadar fukaha arasında ortaya çıkan ihtilaflar ve bu ihtilafların nedenleri, ayrıca Hicrî üçüncü yüzyılda zâhirîliği ekolleşmeye sevkeden olaylar üzerinde durulmuş, bu bilgilerin neticesinde de zâhirî düşüncenin ekolleşmesini sağlayan âmiller tespit edilmeye çalışılmıştır. Dâvûd ez-Zâhirî'nin fıkıh usûlüne dair görüşleri ise fürû-ı fıkha dair günümüze ulaşan tüm fetvaları gözden geçirilmek suretiyle istikra yöntemiyle belirlenmeye çalışılmıştır. Onun usûle ilişkin görüşleri eş-Şâfiî ile mukayese edilerek daha önce mensûbu olduğu mezhebin görüşlerinden ne kadar ayrıldığı ve usûlünü oluştururken eş-Şâfiî'nin etkisinin hangi oranda olduğu belirlenmeye gayret gösterilmiştir. Ayrıca Dâvûd ez-Zâhirî'nin fürû-ı fıkha dair bazı görüşleri diğer fukahanın fetvalarıyla karşılaştırılarak onun zâhirîliğinin varmış olduğu aşama tespit edilmeye çalışılmıştır."
