abstract: "İbn Teymiyye, yalnızca günümüzde değil, yaşadığı dönemde içinde ve dahasonraki yıllarda hep tartışmaların odağında yer almış bir isimdir. Talak ve yeminkonusu başta olmak üzere, üzerinde icma olduğu ileri sürülen farklı alanlardakiiçtihatlarıyla, tekfir derecesine varacak boyutta ithamlara maruz kalmıştır. Kendisineyöneltilen ağır eleştiri ve tenkitler, fıkhû tercihlerinden çok, Kitap ve sünnet eksenindenuzaklaşan batıl ve sapık akımlara karşı giriştiği sert muhalefetten kaynaklandığıgörülmektedir.İbn Teymiyye üzerinde ilmi etütler yapan âlimlerin geneli, O'nu; Hanbelûmezhebine müntesip bir müçtehit olarak değerlendirmişlerdir. Hakkında ortayakonulan bu müşterek kanaat, onun usulde ve furuda Hanbelû mezhebinin bütüniçtihatlarını benimsediği anlamına gelmez. O; ne kullandığı usulde, ne de ulaştığıiçtihadû sonuçlarda mukallit değildi. çtihat ve fetvalarından anlaşıldığı üzere, farklıgörüşleri mukayese edip tercihler yapmış, ulaştığı sonuçlar genellikle Hanbelûmezhebinin içtihatlarıyla örtüşürken, dört mezhebe muhalif ictihadû sonuçlar daulaşmıştır. Şahsına özgü içtihatlarında dikkati çeken en önemli özellik; vardığı ilmisonuçları Kitap ve sünnete istinat etmesi, bu iki temel kaynağı selefin yorumlarıylaanlamaya çalışmasıdır. Selefi anlayışı, ümmetin birliğinin temel ekseni olarak kabuletmiştir. Ona göre uyulması gereken delilin kendisidir. Kitap ve sünnetin ötesinde hertürlü şartlanmaya, mezhep taassubuna karşı mücadele etmiş, geleneğe bağlı kalarakyenilikçi olmanın sentezini ortaya koyarak, ıslahatçı bir çizgi izlemiştir.Akla ve nassa ters düştüğü gerekçesi ile nasların ihmal edilmesini reddedip, Şer'inasların mana ve mefhumlarını, şeriatın temel amaç ve ilkelerini göz önüne alarakyorumlamayı esas almıştır. O'na göre, gerçek akıl ile sahih nas arasında asla çelişkiolamaz. Ortada bir çelişki söz konusu ise, bu; ya akıl yürütmeden kaynaklanan birkusur, ya da; nassın yorumundaki bir tutarsızlıktan ibarettir. Cüziyyâtı küllû kaideleriçinde ele alarak, kulların maslahatları ihmal edilmeden toplumdaki her türlüyozlaşama ve kötülüğün önüne geçilmelidir."
