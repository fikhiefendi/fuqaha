abstract: "İtikâdî, ahlâkî ve iktisâdî problemler toplum olmanın vazgeçilmez unsurlarıdır. Âlimler her dönemde gerek devlet desteğiyle gerek kendi imkânlarıyla bu ihtiyaçları Kur'an ve Sünnet ışığında karşılamaya çalışmışlardır. Kur'an ve Sünnet'te kesin olarak delil bulamadıklarında, nasslara da muhâlif olmamak kaydıyla ictihâd yapmışlardır. Bu âlimlerden bir tanesi de H. 4. asırda yaşayan Buhâralı Hüseyin b. Yahya ez-Zendevestî'dir. Hüseyin b. Yahya ez-Zendevestî yaşadığı dönemin öncü âlimlerinden olup birden fazla eser kaleme almıştır. Ravzatü'l-'Ulemâ' ve Nüzhetü'l-Fudalâ' esas itibariyle bir fetva kitabı olup günün şartları ve ihtiyaçlarına göre kaleme alınmış bir eserdir. Müellif, yaklaşık yüz bâbtan oluşan eserin her bâbında Hanefî imamlarının görüşlerini âyet ve hadislerle delillendirerek İmam Şâfiî'nin (r.h.) görüşleri ile mukayese eder. Müellif, konunun devamında sadece fetva ile kalmayıp âyetler, hadisler, bazı müfessirlerin yorumları, bazı âlimlerin görüşlerinden faydalanmış yer yer kıssalarla da pekiştirme yapmıştır. Tezde, Zendevestî'nin, Ravzatü'l-'Ulemâ' ve Nüzhetü'l-Fudalâ' eserinin önemli bir kısmını tercüme etmeye çalıştık."
