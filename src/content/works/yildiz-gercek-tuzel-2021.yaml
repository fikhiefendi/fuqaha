abstract: "İbn-i Haldun'a göre devletin kurulduğu ilk yıllarda, halka yüklenen vergi azdır. Ancak bu düşük vergi oranlarına mukabil daha çok vergi toplanır. Oysa devletin yıkılma döneminde vergi oranları çok olur ama daha az vergi toplanır. Çünkü devlet, vergileri düşük tutarsa halk, daha çok çalışma yoluna giderek devleti kalkındıracaktır. Ancak vergiler ağır olursa çalışma şevki kırılan halkın üretime katkısı az olacaktır. Yasalarımızda çok yüksek vergi oranları bulunmaktadır. Halk bu yüksek vergi oranlarını ödemekte ciddi zorluklar ile karşılaşmaktadır. Halkımızın bu yüksek vergileri ödemekte zorluk çektiğinin en önemli göstergesi devletimizin 1980 yılından itibaren ortalama 1,5 yılda bir vergi affı çıkartmak zorunda kalmasıdır. Bu sebeple vergi yaslarımızda köklü reformlara ihtiyaç duyulmaktadır. Gerçek kişi mükellefler ile tüzel kişi mükellefler yasal zorunluluklardan dolayı ödemek zorunda olduğu vergilerin yanında vicdani sorumluluklarından dolayı da %2,5 zekât vergisi ödemek zorunda kalmaktadır. İnanç esaslı hareket eden gerçek ve tüzel kişi mükelleflerin gelir ve kurumlar vergisi matrahlarının nisap miktarına (85 gram altın karşılığı TL) ulaşması koşulu ile zekât oranı (%2,5) kadar yasalarımız çerçevesinde ispat edebilecekleri zekât ödemelerini, ödeyecekleri vergi tutarından indirim konusu yapabilmelidirler."
