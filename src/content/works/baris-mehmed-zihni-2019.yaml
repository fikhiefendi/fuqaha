abstract: "Mehmet Zihni Efendi, Osmanlı'nın son döneminde yaşamış, İslâm hukuku, Arapça, İslâm tarihi, hadis, akâid, tasavvuf gibi İslâmî ilimlerin birçoğunda eser telif etmiş olan bir Osmanlı âlimidir. Müellifin Ni'met-i İslâm adlı eseri, Türkiye'deki ilmihallerin kaynağını oluşturmaktadır. Diğer ilmihallerde olmayan evlilik ve boşanma konularını da içermesi açısından önem arz etmektedir. Eser Hanefî görüşlerini eas almaktadır. Osmanlı Hukuk-ı Aile Kararnâmesi de Ni'met-i İslâm ile aynı dönemde hazırlanmış bir kanun metnidir. Hanefî mezhebine göre yazılmasına rağmen bazen Hanefî uygulamasından ayrılarak, diğer mezheplerin görüşlerini kabul etmiş, bazı konularda kendine has tercihlerde bulunmuştur. Birçok İslâm ülkesinin de aile hukukuna etki etmiş ve bazı ülkelerde yakın zamana kadar uygulanmıştır. Bu iki eserin aile hukuku alanında önem arz eden, hassas bir mevzu olan ve günümüzde de ciddi bir problem olan talâk hususunda ortaya koymuş olduğu esasları, incelemek, karşılaştırmak ve çıkarımlarda bulunmak fayda sağlayacaktır."
