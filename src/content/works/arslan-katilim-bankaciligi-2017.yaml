abstract: "Mevduat sahiplerine belirli bir getiri sağlamayı garanti eden konvansiyonel bankaların aksine kar-zarar ortaklığı ile toplanan fonları reel ekonomiye kanalize etme, faiz getirisi yerine kurulan ortaklıklardan pay dağıtma yöntemini kullanan katılım bankaları ile bu bankaların işleyişi, Türk Finans Sistemi içerisindeki durumları, dünyadaki örnekleri bu tezde ele alınan konulardır. Çalışmanın yöntemi olarak literatür taramasıyla birlikte BDDK, TBB ve TKBB gibi kuruluşların veritabanlarından faydalanılmıştır. Katılım Bankaları Türkiye ekonomisine önemli katkıları bulunan bankalardır. Katılım Bankalarının finansal sistem içerisine alınamayan atıl fonların sisteme kazandırılması yoluyla tasarruf sahiplerine kazanç sağladığı, gelir dağılımını düzenleyici etkilediği, kayıt dışı ekonomik faaliyetlerin kayıt altına alınmasında etkili olduğu, reel sektöre kaynak aktarılarak ekonominin gelişmesine katkıda bulunduğu, kurumlar vergisi, KDV ödeyerek kamu maliyesine katkı sunduğu, reel sektöre fon sağlaması ile istihdama olan katkısı ve sosyo-kültürel faaliyetlere etkisi bulunduğu anlaşılmıştır. Katılım bankacılığı sisteminin yani faizsiz bankacılığın önemli bir deneyim olduğu ortadadır. Kurulduğu günden bu yana ekonomiye olan katkıları düşünülecek olursa gelişmesinin süreceği söylenebilir. İstikrarlı büyümenin sürmesi için şubeleşme ve personel sayısının artırılması gerekmektedir."
