abstract: "Ser`iyye sicilleri, tarihin en önemli sâhitlerinden olup arsiv malzemeleri arasında önemli bir kaynak teskil etmektedir.Ser`iyye Sicilleri, merkezden gönderilen her konudaki ferman, berat, i`lâm, hüccet gibi kadıların ser`i ve hukukî vazifesine ait davalarda verdigi hükümleri içermektedir. Ser`i mahkemelerden kalan ve ser`iyye sicilleri olarak adlandırılan bu defterlerde , devletin hukukî, iktisâdî, askeri ve idarî müesseseler hakkında önemli tarihi belgeler bulunmaktadır. Ser`iyye sicilleri ait oldukları bölgenin sosyal ve iktisâdi hayatını yansıtan mahkeme kararlarının yanı sıra daha birçok belge çesidini kapsamaktadır. Çünkü Osmanlılarda, herhangi bir vilâyet, liva ve kazaya çesitli konularda gönderilen ferman ve buyrulduların birer sûreti ser`iyye siciline mutlaka kaydedilirdi. Tüm bu düsünce ve çalısmalar sonucunda Yozgat'ın dolayısıyla Osmanlı Devleti'nin siyasî, askerî, malî, idarî ve içtimaî tarihine ısık tutabilecek bilgiler elde edilmistir. Özellikle de Osmanlı bayragı altında ve Osmanlı hosgörüsü içerisinde yasayan Müslim ve Gayr-i Müslimlerin kanunlar çerçevesinde büyük bir uyum içerisinde yasadıkları birkez daha gösterilmistir."
