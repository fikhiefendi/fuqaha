abstract: "Bu çalışma, İslam hukukunda yer alan fıkhî kaideler“el-kavâidü'l-fıkhiyye”ve fıkhî zabıtların“ed-davabitü'l-fıkhiyye”, aile hukukunun nikâh bölümünde nasıl bir etkiye sahip olduğunu ortaya koymayı amaçlamaktadır. İslam hukukunda nikâh, yalnızca bireylerin özel yaşamlarını değil, aynı zamanda toplumsal yapıyı da doğrudan ilgilendiren temel bir kurumdur. Dolayısıyla, bu kurumu düzenleyen fıkhî kuralların derinlemesine incelenmesi, İslam aile hukukunun daha iyi anlaşılmasına katkı sağlamaktadır. Çalışma üç ana bölümden oluşmaktadır. Tezin birinci bölümünde, kavramsal çerçeveyi oluşturmak amacıyla fıkhî kaide ve zabıt tanımlanmış, bu iki kavram arasındaki temel farklar açıklanmış ve her birinin şer'î delillere dayanan hücciyeti tartışılmıştır. Ayrıca bu alandaki literatür taranarak, klasik ve çağdaş dönemde yazılmış en önemli eserler tanıtılmış, fıkhî kuralların tarihsel gelişim süreci incelenmiştir. İkinci bölümde ise aile kurumunun İslam hukukundaki yeri açıklanmış; evliliğin sosyal, ahlaki ve hukuki boyutları değerlendirilmiş; nikâhın şer'î hükümler bağlamında önemi ve kutsallığı ifade edilmiştir. Bu çerçevede, nikâh akdinin geçerlilik şartları, tarafların hak ve sorumlulukları ve nikâhın korunması için öngörülen tedbirler ele alınmıştır. Ayrıca fıkhî zabıtların aile içerisindeki ilişkilere nasıl yön verdiği örneklerle açıklanmıştır. Üçüncü bölümde ise nikâh babında doğrudan etkili olan en önemli fıkhî kurallar ve zabıtlar detaylı bir şekilde incelenmiştir. Her bir kural ve zabıt; tanımı, şer'î dayanakları, klasik fıkıh kaynaklarındaki yeri ve uygulama örnekleri ile birlikte ele alınmıştır. Bu araştırmada istikrarlı ve sistematik bir şekilde fıkhî kuralların aile hayatına nasıl yön verdiği, özellikle de evlilik ilişkilerinden doğan meselelerde bu kuralların nasıl rehberlik ettiği ortaya konulmuştur. Çalışmada istidlal metodu ile delillerin analizi yapılmış, istişhâdî örneklerle fıkhî zabıtlar desteklenmiştir. Ayrıca klasik fıkıh kaynakları ve çağdaş akademik literatür karşılaştırmalı olarak kullanılmıştır. Sonuç olarak, fıkhî kaideler ve zabıtların yalnızca teorik değil, aynı zamanda uygulamalı yönleri de bulunduğu ve evlilikle ilgili birçok temel meselede bu kuralların belirleyici bir rol üstlendiği görülmüştür. Bu yönüyle çalışma, aile hukuku alanında yapılacak yeni araştırmalara öncülük edecek ve katkı sağlayacak niteliktedir"
