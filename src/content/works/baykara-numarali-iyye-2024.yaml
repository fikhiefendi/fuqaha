abstract: "Bu çalışmanın konusunu 672 numaralı Denizli şer'iyye sicili ışığında; Denizli'de sosyal hayatın nasıl olduğu, hangi olayların sosyal hayatı etkilediği ve sosyal hayat içerisinde kullanılan ögelerin neler olduğuna ilişkin bilgilerin tespiti oluşturmaktadır. Araştırma, Denizli'nin sosyal hayatı üzerine durmaktadır. Bu çalışmada araştırma yöntemlerinden“literatür taraması”kullanılmıştır. Bu araştırma yöntemine ek olarak“nitel araştırma”türü olan belge inceleme yöntemi de kullanılmıştır. İçerisindeki çeşitli tereke kayıtları, fermanlar vb. belgelerle Denizli'de o dönemin sosyal hayatı hakkında dinî, ailevî, siyasî, ilmî konularda bilgiler edinilmiştir. Denizli'de çeşitli unsurların yaşadığı ve bunların hayatı hakkında bilgiler tespit edilmiştir. Yeme içmeye yönelik çeşitli dükkanların o zamanda da olduğu, zenginliğin sadece erkeklere has olmadığı, bazı kadınların da zengin ve varlıklı olduğu ve mehirlerin genel olarak mehr-i mu'accel olarak ödenip altın mislinde olduğu tespit edilmiştir."
