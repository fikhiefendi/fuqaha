abstract: "Bu çalışmada, İbnü'l-Fasîh'in (ö. 755/1354) Müstahsenü't-Tarâik fî Nazmi Kenzi'd-Dekâik isimli kitabı tahkik edilmiştir. Hanefi mezhebinin önemli ve muteber muhtasarlarından Kenzü'd-dekâik'in manzum hâli olan bu eser; ibâdât, muamelât, terikât ve ukûbât konularının tamamını kapsamakla birlikte eserde delil ve gerekçelendirmeye (talîl) başvurulmamıştır. Söz konusu kitap, nesr türünün aksine öğrencilerin kolaylıkla ezberleyebileceği elfiyye türünde yazılmış bir manzûmedir. Bu kitabı kıymetli kılan husus, remz, lafız ve meselelerde aslına uygun olması gibi pek çok özelliğiyle diğer manzûmelerden ayrılmasıdır. Bunun sebebi muhtemelen müellif İbnü'l-Fasîh'in, yarım asırdan fazla bir süre Meşhed-i Ebû Hanîfe, Kassâin ve Reyhâniyye medreselerinde ilimle iştigal etmiş bir âlim olmasıdır. Bu kitap, yöneticilerin ilmî faaliyetleri desteklediği ve eser telifinde hareketliliğin yaşandığı Memlükler döneminde kaleme alınmıştır. Tez iki ana bölümden oluşmaktadır. İlk bölümde müellifin özgeçmişine ve ilmi hayatına değinilmiştir. Ardından eserle ilgili kısma geçilerek eserin önemi ve Hanefi fıkhında muhtasar ve manzûm eserler arasındaki yeri ile eserin müellife nispeti konularına yer verilmiştir. Daha sonra eser üzerine yazılmış mevcut şerhlere ve eserin yazma nüshalarına değinilmiştir. Tezin ikinci bölümünde ise ondan fazla nüsha arasından dikkat ve titizlikle seçilen üç nüsha üzerinden eserin tahkiki yapılmıştır. Tahkik yapılırken Türkiye İslam Araştırmaları Merkezi'nin (İSAM) Tahkikli Neşir Esasları (İTNES) takip edilmiştir."
