abstract: "“İslam Ceza Hukukunda Uhrevi Sorumluluk”adlı bu çalışma giriş ve iki bölümden oluşmaktadır. Girişte araştırmanın konusu, önemi, amacı ve kaynaklarına ilişkin bilgiler yer almaktadır. Burada çalışmanın amacı ve hangi kaynaklara başvurulduğu belirtilmektedir. Birinci bölümde sorumluluk ve ahiret kavramları tanımlanmış ve sorumluluk bölümlere ayrılarak anlatılmıştır. Ayrıca uhrevi sorumlulukla kusurlu ve kusursuz sorumluluk ilişkisine temas edilmiş ve kazaî ve diyanî hükmün uhrevi mesuliyete etkisi incelenmiştir. İkinci bölümde İslam hukukuna göre cezalar taksim edilmiş ve dünyada infaz edilen bir cezanın ahiretteki sorumluluğa etkisine yer verilmiştir. Bu alanda İslam hukukçularının görüşleri tüm taraflarıyla ele alınmış ve konuyu temellendirmedeki delillerinden bahsedilmiştir. Bununla beraber konuyla ilgisinden dolayı ceza infaz edildikten sonra İslam anlayışının suçluya yaklaşımı da anlatılarak çalışmaya son verilmiştir."
