abstract: "Uzun zamandır iç savaş ve siyasi istikrarsızlıkla boğuşan Somali'de sosyal ve çevresel sıkıntıların artışı sınırı geçmiş durumdadır. Bu çalışmada iki ana problem ele alınarak olası en uygun çözümler araştırldı. Çalışmaya göre en büyük sorun sosyal istikrarsık iken ikincisi ise hem önceki sorunun müsebbibi hem de yıkıcı ayrı bir sorun olarak değerlendirilen çevresel problemlerdir. Araştırmada, son yıllarda çok büyük ilgi gören Islami finansın bu sorunlara getirebileceği katkılar üzerine çok gidildi. Çevre içi anket kullanılarak binin üzerinde, farklı geçmişleri olan bir kitleden veri toplandı. Entelektüel ve tecrübeli insanların bulunduğu belli WhatsApp ve Telegram gruplarda anket soruları paylaşıldı. Yanıtları MS Excel'de filtre edilerek uygunsuz olarak nitelendirilen bazı veriler çıkarılıp temiz olanlar analize alındı. Toplanan tüm verilerin analizi için SPSS progrmaı kullanıldı ve aralarındaki ilişkiler incelendi. Çalışmadan çıkarılan sonuç, insanların çevreye verdiği tavır ve girişimlerinin ağır olduğu, çevrenin de getirdiği sorunların sosyal hayata çok zarar getirdiği, ve araştırmamızın ana hedefi olan Islami finansın her iki soruna getirdiği faydalı katkıları incelendi. Çok mühim olduğu nedeniyle seçilen belli faktörlerin çevre sorunlarını çok tetikleyici olduğu sonucuna varıldı. Belli neticeler ve felaketlerin alarm haline geldiği öğrenildi. Islami finansın özü itibarıyla bu sorunların giderilmesi gerektiği ve onlara uygun etkin çözümleri güçlendirildi. Islami finans hem sosyal refahı hem kişisel özgürlüğü hem de yaşadıkları çevre korumasını titizlikle vurgulamaktadır. Dolayısıyla bu anlayışın önerdiği çözümler derinden etki yaratabilmektedir."
