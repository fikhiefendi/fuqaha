abstract: "Bu çalışma;“ümmetimin ihtilâfı rahmettir”rivayetinin genelde İslam kaynaklarında özelde ise“hadis literatüründe”ne tür bağlamlar içerisinde tüketildiği ve bu kullanımlarda hangi kalıplar içerisinde sunulduğu, hangi anlamları içerdiği, hangi başlıklar etrafında tartışıldığı ve hangi formlara evrildiğini ortaya çıkarmak için gerçekleştirilmiştir. Bu çalışma gerçekleştirilirken bu rivayeti referans gösteren veya bir şekilde bu rivayete göndermede bulunan, bu rivayetin anlamsal katmanlarına katkı sunan her türlü kaynak (Sünnî, Şiî, Doğu, Batı fark etmeksizin) incelenmeye tabi tutuldu ve bu noktada analiz edilen kaynaklar uygun başlıklar altında kategorize edildi. Birincil ve ikincil kaynaklar taranmakla beraber, bu çalışma özü itibari ile söz konusu“referans kaynaklarında”bu rivayetin menşeini, kapsamını ve anlamsal sınırlarını tayin etmeye yaradı. Türkçe olarak (dolayı göndermede bulunan birkaç makale dışında) bu alanda şimdilik tek olan bu çalışma, esasında henüz müstakil olarak çalışılmamış bu rivayetin kaynaklarını, isnad ve metinlerinin tespitini ve hangi konular bağlamında gündeme geldiğini ortaya koymaya amaçlamaktadır. Modern toplum anlayışının bir parçası haline gelen uzlaşma kültürünün izleri İslami kaynaklarda bu rivayet eksenli olarak arandı. Bu çalışmada“çoğulculuk ve uzlaşı”kültürünü“ictihad ve kıyas”kavramları ile ilişkilendirirken, bu çalışma da ictihad kavramının oldukça işler olduğu bu zamanda sıklıkla vurgulanan ve aynı zamanda bu kurumun bütünleyeni olan“ümmetin ihtilafı rahmettir”rivayeti üzerine odaklandı. Böylelikle bu rivayetin hangi kaynaklarda hangi anlamsal kalıplar içerisinde kullanıldığı araştırmaya tabi tutuldu. Çalışma bütünsel olarak bu rivayetin hangi sıklıkla rivayet ediliği ve neden birçok farklı mezhepler tarafından benimsendiğini açıklamak için yapıldı."
