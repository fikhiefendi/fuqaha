abstract: "Bu çalışmada, Hanefî fıkıh literatüründe önemli bir yere sahip olan ve mezhep imamlarının görüşlerine rehberlik eden“itibar gâlib-i şayiadır nadire değildir”ilkesi ele alınmaktadır. Mecelle'de önemli bir yere sahip olan gâlibiyet ilkesinin kullanım alanlarının tespiti öncelikli amaçlardan biridir. Araştırmanın giriş bölümünde“araştırmanın konusu ve alanı”belirtilerek çalışma süresince kullanılan“kaynaklar”ve“takip edilen metod”hakkında bilgilere yer verilmiştir. Araştırmanın birinci kısmında gâlibiyet ilkesiyle önemli ilişkisi dolayısıyla örf ve bu bağlamında“âdet muhakkemdir”kaidesi ve şamil olduğu diğer kaidelerin muhtevası değerlendirildi. Bunun yanı sıra kavaid-i külliyenin İslam hukukundaki yerine ve mezhepler arası ihtilaflardaki rolüne temas edilmektedir. İkinci bölümde ise Hanefî fıkıh kaynaklarının birçok alanında, fakihlerin meselelerin çözümünde kendisinden istifade ettiği gâlibiyet ilkesine yer verilmiştir. Araştırmamızda belirtildiği üzere gâlibiyet ilkesinin klasik fıkıh eserlerinde,“hüküm nadir olana değil gâlip olana bina edilir”,“az olan çoğa tabidir”,“nadir karşılaşılan bir durumda kaçınılması zor olan şey (belva) gibi değildir”,“hüküm çoğunluğa göredir”,“nadir olan yok hükmündedir”ve“yaygın olan nadir olanı içinde eritir”şeklinde farklı biçimlerde ifade edildiği görülmektedir. Sonuç bölümü araştırma konusu üzerinde genel bir değerlendirme yapılarak tamamlanmıştır. Çalışmamız ortaya koymaktadır ki İslam hukukunun önemli kaynaklarından Mecelle'nin külli kaidelerinden“gâlibiyet ilkesi”, Hanefî fıkıh literatüründebirçok içtihadın dayanağı olarak gösterilmiştir. Örneğin savunulan görüşü temellendirmek için destekleyici bir delil olarak kaidelere başvurmuşlardır. Ayrıca nassların yorumlanmasında bu kaidelere müracaat edilmiştir. Sonraki dönem hukukçularının belli bir görüşü tercih ederken kaidelerden yararlandıkları görülmektedir. Nassın bulunmadığı meselelerde kaideler delil hükmünde sayılmıştır."
