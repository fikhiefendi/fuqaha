abstract: "Günümüzde olduğu gibi 19. yüzyıl sonu ile 20. yüzyıl ilk yarısında İslâm dünyasının Batı karşısında gerileme içinde bulunduğu bir hakikattır. Söz konusu gerilemeyi, ilerleme ve terakkîye dönüştürebilmenin yolu, dönemin siyaset, ilim ve fikir dünyasının en önemlileri arasında bulunan Efgânî, Abduh, Rızâ, Kevserî ve Sabri Efendi tarafından yoğun bir şekilde tartışılmıştır. Adı geçen âlimler, İslâm dünyasının Batı karşısında gerileme içinde bulunduğu konusunda müttefik iken terakkî ve ilerleme teklifleri ile gerileme sebepleri konusunda düşünceleri uzlaştırılamayacak derecede birbirinden uzaktır. Haklarındaki yaygın kanaatı dikkate alarak klasik İslâm modernistleri olarak değerlendirdiğimiz Efgânî, Abduh ve Rızâ, gerileme sebepleri arasında geleneksel İslâmî düşünceyi baş sorumlu görüp yıkılması gerektiğini; Kur'ân'a başvurularak muâmelât alanının çağımız ihtiyaçlarına cevap verecek şekilde maslahat ilkesi gereği tekrar yorumlanması gerektiğini öne sürmektedirler. Buna mukâbil Sabri Efendi ve Kevserî'den oluşan gelenekselcilerin ise savunulan maslahat anlayışına yönelik sert eleştirileri bulunmaktadır. Dolayısıyla dönemin en popüler ve problematik konularından birisini maslahat düşüncesi oluşturmaktadır. Bu düşüncenin ise tespit ve mukayesesine yönelik mezkûr âlimler özelinde herhangi bir çalışmanın yapılmadığı görülmektedir. Bundan dolayı araştırmada modernizmin, geleneğe ilk tahaddisinin adı geçen âlimler özelinde maslahat anlayışlarına yansımalarının tespiti, karşılaştırılması ve değerlendirilmesi amaçlanmıştır. Bu minvalde teorik ve pratiğe yansıyan maslahata âit görüşleri, öncelikle doküman analizi yöntemi ile toplanmış, sonra karşılaştırılması yapılarak tümevarım yöntemiyle bir sonuca ulaşılmaya çalışılmıştır. Elde ettiğimiz bulgulara göre modernistlerin, nassların maslahatlarının tarihselliğini savundukları; kat'î nassa karşı takdim ve tahakküm edilebilen aşırı bir maslahat düşüncesi benimsedikleri, bunun da muâmelâta âit nassları, metni bâkî hükmü nesh olmuş konumuna düşüreceği görülmektedir. Gelenekselcilerin ise“Mevrid-i nassda ictihâda mesağ yoktur.”düşüncesinde oldukları; nass ile geçmiş âlimlerin ittifak ettikleri meseleleri şer'î ve zarûrî maslahata dayalı ruhsat tarzı değişiklikler hâriç her türlü değişime kapadıkları; ihtilâf edilen meseleler ile nevâzil fıkhında maslahata itibar ettikleri ve nassların maslahatlarının ebedîliğini savundukları anlaşılmaktadır. Yine gelenekselcilerin sahiplendiği maslahatın“nass odaklı/illete bağlı olan maslahat”; modernistlerin savunduğunun ise“hikmet ve akıl odaklı maslahat”olduğu anlaşılmaktadır."
