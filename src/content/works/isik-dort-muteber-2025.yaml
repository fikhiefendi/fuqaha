abstract: "İnsan kendisine verilen akıl nimeti ve hür irade ile diğer canlılardan ayrılan bir varlıktır. İnsanın sahip olduğu bu özellikler hem birtakım hakları elde etmesini hem de dünyevî ve uhrevî açıdan yapıp ettiklerinden sorumlu tutulmasını beraberinde getirmektedir. Dolayısıyla insanın fiillerinde merkezi bir rol üstlenen akıl ve irade kavramları İslam hukuku alanında da araştırma konusu olarak dikkat çeken kavramlar olmuştur. Kişinin hukuki işlemler sırasında ortaya koyduğu irade kimi zaman gerçek iradesinden farklı olmakta, bu durumda irade bozuklukları meydana gelmektedir. İrade bozuklukları İslam hukukunda galat, tağrîr ve ikrah kavramları ile ifade edilmiştir. İrade bozuklukları konusu farklı çalışmalara konu olmuşsa da fetva mecmualarında yer alan örnekler kapsamında yapılan bir çalışmanın bulunmadığı tespit edilmiştir. Bu sebeple araştırmada irade bozuklukları konusunun fetvalar üzerinden incelenmesi ve farklı bir bakış açısıyla ele alınması amaçlanmıştır. Araştırmanın birinci bölümü irade bozuklukları konusunun kavramsal çerçevesine ayrılmış, ikinci bölümünde dört muteber Osmanlı fetva mecmuasında irade bozuklukları kapsamında değerlendirilebilecek olanlarla ilgili bazı fetva örnekleri incelenmiştir."
