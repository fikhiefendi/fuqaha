abstract: "Dünya ekonomisi hızla gelişerek büyüyen bir ekonomidir. Son yıllarda gerek İslam gerekse batılı finans piyasalarında faizsiz sabit getirdi yatırım araçlarına doğru arz ve talebin arttığı görülmektedir. Finansal piyasalar da bu değişime paralel olarak yeni finalisai ürünleri piyasaya sunmaktadır. Faizin yasak kabul edildiği İslam ülkelerinde, menkul kıymetleştirme faizsiz İslam yatırım araçları piyasanın temelini oluşturmaktadır. Faizsiz finansal ürünlerin, inançları gereği finansal piyasalardan uzak duran yatırımcıları piyasaya çekmek için ideal bir seçenek olduğu görülmektedir. İslami sermaye piyasası araçları özellikle Körfez sermayesinin Türkiye'ye çekilmesinde önemli bir etken olarak önem kazanmaktadır. Bu çalışmada, İslam finans piyasasının gelişimi ile İslami borçlanma aracı sukuk incelenerek, Türk sermaye piyasası ile İslam sermaye piyasası yapısı ve büyüklükleri değerlendirilmektedir. Türkiye ekonomisine katkı sağlamak için İslam sermaye piyasası araçlarının Türk sermaye piyasasında uygulanabilirliği ile ilgili kanun ve mevzuat İncelenmektedir. Türk finans piyasasına kazandırılmaya çalışılan sukuk, yapısı ve işleyişi açısından ele alınmaktadır. Elde edilen veriler doğrultusunda sukukun şuanda mevcut olan bazı eksikliklerinin giderilmesinden sonra Türkiye finans piyasası için iyi bir alternatif oluşturacağı görülmektedir."
