abstract: "Bu çalışma, Korona virüsünün yayılmasının görüldüğü ve Türkiye Cumhuriyeti'ni olumsuz yönde etkileyen yıllar (2016-2021) arasındaki zaman diliminde Türkiye Cumhuriyeti'nde faaliyet gösteren katılım bankalar ile konvansiyonel bankaların etkinliklerini analiz etmeyi ve karşılaştırmayı amaçlamaktadır. Etkisi o kadar şiddetli oldu ki, uluslararası alanda tam bir kapanmaya neden oldu ve Türkiye'de bankacılık sistemi verimliliği etkiledi. Bankaların yayımladığı mali tablo ve raporlardan belirlenen döneme ait gerekli veriler toplanıp dört girdi (banka şube sayısı, çalışan sayısı) seçilerek katılımcı ve geleneksel bankaların etkinliğini ölçmek amacıyla veri zarflama analizi (VZA) modeli kullanılmıştır, net sabit kıymetler ve müşteri mevduatları) ve iki çıktı kalemler (Bilanço dışı, net faaliyet geliri), Türkiye Cumhuriyeti'nde faaliyet gösteren (5) katılımcı banka ve (9) bankadan oluşan bir örneklem için uygulanmıştır ) düzenli yerel bankalar (3 devlet bankası, 6 özel banka). Çalışma, katılım bankalarının COVID-19'un yayılması öncesinde daha düşük verimlilikle çalıştığını ve COVID-19 pandemisi sırasında daha yüksek verimlilik gösterdiğini ortaya koydu. Bunun aksine, Konvansiyonel bankalar virüsün yayılması öncesinde daha yüksek verimlilik sergiledi ve COVID-19 pandemisi sırasında daha düşük verimlilik gösterdi."
