abstract: "Tez, giriş ve üç bölümden oluşmaktadır.Giriş kısmı, tez ile ilgili teknik bilgilere ayrılmıştır.Birinci bölümde, ikrah konusunun hukuki mahiyetinin belirlenmesinde yardımcı olan, ikrahın hukuki zeminde uygulanma alanı bulması imkânını veren ehliyet, sorumluluk ve akit kavramları konu ile ilgili oluşları oranında açıklanmıştır.Konunun esasını teşkil eden ikinci bölümde ise ikrahın hukuki nitelikleri hakkında bilgi verilmiştir. Bu kısımda öncelikle ikrahın tanımı, türleri, sınırları ve unsurları gibi temel bilgiler sunulmuştur. Tarihsel süreçteki ve günümüzdeki hukuki sistemlerinin ikraha bakış açıları da bu kısımda izah edilmiştir. Bu bölümde ayrıca ikrahın hukuken gerçekleşmesi için gereken şartlar ve bir zorlama türü oldukları halde hukuksal açıdan ikrah kategorisi dışında kalan durumlar üzerinde durulmuştur.İkrahın hukuki sonuçları, üçüncü bölümde ele alınmıştır. Bu bölümüm ilk kısımlarında ikrahın ehliyete ve sorumluluklara etkileri, sonraki kısımlarda ise hukuki işlemlere etkisi ve buna bağlanan sonuçlar detaylıca incelenmiştir."
