abstract: "ÖZET İctihad, Cüveynî'nin en çok önemsediği konulardandır\". Bunun göstergesi, onun el-Gıyâsî, el-Burhân ve et-Telhîs gibi Fıkıh Usulü eserlerinde içtihadı ayrıntılı olarak işlemesi ve hatta ictihadla ilgili I bölümün eserinin en önemli kısmı olduğunu belirtmesidir. Cüveynî'nin bu kadar önem verdiği bir konuyu araştırmak için üç bölümden oluşan tezimizin birinci bölümünde onun eserlerini tanıtmaya çalıştık. Cüveynî Fıkıh Usulü ve Fıkıh'la ilgili çok önemli eserler vermesine ve bununla beraber önemli bir Fıkıh alimi olmasına rağmen bu yönüyle pek bilinmemektedir; o daha çok Kelam alimi olarak tanınmıştır. Cüveynî'nin fıkıhçı yönüne dikkat çekmek için, bu bölümde bu konuyla ilgili eserlerine öncelik verdik. İkinci bölümde Cüveynî'nin kavramsal ve tarihi açıdan içtihada bakışını araştırmaya çalıştık. Cüveynî içtihadın hem sözlük, hem de terim anlamları üzerinde fazla durmamaktadır. Onun önem verdiği ve vurgulamak istediği nokta içtihadın İşlevsellik kazanmasıdır. Üçüncü bölümde ise, müctehid kavramı ve buna bağlı olarak taklid konuları ve mezheple ilgili Cüveynî'nin yaklaşımlarını konu edindik. Tezimizde, yukarıda zikrolunan konulan ayrıntılı olarak incelemekten ziyade Cüveynî'nin bu konularla ilgili farklı görüşlerini yansıtmaya çalıştık. Cüveynî, eserlerinde ictihad ve ilgili konulardanteknik olarak bahsetmek yerine, bu konudaki endişelerini dile getirmekte ve taklidin yaygınlık kazanmasından şikayet etmektedir."
