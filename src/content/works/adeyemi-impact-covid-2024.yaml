abstract: "Bu araştırma, Afrika'daki İslam İşbirliği Teşkilatı (İİT) üyesi ülkelerde COVID-19 salgınının finansal tabana yayılma üzerindeki etkisini incelemektedir. Araştırmacı, Dünya Bankası'nın 2011 – 2021 Küresel Findex araştırmasından elde edilen verileri kullanmıştır. Bu çalışma, yetişkinlerin finansal hizmetleri ödemeler, tasarruflar, borçlanma ve büyük harcamalar veya gelir veya gelir kaybı gibi önemli mali olayların ele alınmasıyla ilgili farklı şekillerde nasıl kullandığını bilmeyi amaçlayan dünya çapındaki bir araştırmaya dayanmaktadır. Bu makale, regresyon ve diğer istatistiksel yöntemleri kullanarak, hane halkı tasarruf kalıplarındaki değişikliklerin yanı sıra pandemi öncesi ve sonrasında dijital finansal hizmetlerin ve işlemlerin kullanımındaki değişiklikleri analiz etmektedir. Bulgular, pandemiden sonra tasarruflarda, dijital ödeme kullanımında, mobil para hesabı sahipliğinde ve borçlanmada artışlar dahil olmak üzere finansal davranışlarda önemli değişiklikler olduğunu gösteriyor. Bu gelişmeler, bu krizin getirdiği ekonomik zorluklara, insanların ve onların finansal sistemlerinin hızla yeni koşullara uyum sağlamasıyla dinamik bir tepki verildiğini gösteriyor. Genel olarak bu çalışma, COVID-19 salgınının ardından değişen finansal manzaraya ilişkin bilgi birikimine katkıda bulunuyor ve bölge genelinde ekonomik güçlenmeyi teşvik etmeye, yoksulluğu azaltmaya ve ortak refah oluşturmaya yönelik önlemlere ilişkin içgörüler sağlıyor. Ek olarak bulgular, İslami finansın dijital yeniliklerden yararlanma ve finansal katılımı teşvik etme ve aynı zamanda borçlanmayla ilgili zorlukları çözme potansiyelinin altını çiziyor."
