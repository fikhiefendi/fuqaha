abstract: "Katılım bankalarının esas amacı faizsiz bir sistem oluşturmak olduğundan katılım bankaları, İslam hukukunun ilkelerine bağlı kalarak faaliyetlerini sürdürmektedir. Bankaların faizsiz hedeflerini gerçekleştirmesini sağlayan en önemli organ danışma komitesidir. İslam dininde faiz, haram kabul edilmiştir ve ticaret helal kılınmıştır. Bu nedenle katılım bankaları, İslam hukuku kuralarına bağlı kalarak fon kullandırma ve toplama yapmaktadır. Katılım bankalarının vazgeçilemez birimi olan ve en üst düzeyde önem taşıyan danışma komitesi, bankanın şer'i amacını sağlayan en önemli organıdır. Danışma komitesi, fıkıh muamelat deneyimli ve uzman olan kişilerden oluşmakta ve bankadan bağımsız olarak kararlar almaktadır. Bu kararlar ve hükümler, Kur'an ve sünnete dayanarak alınmaktadır. Dolayısıyla katılım bankalarında İslam hukuku, Kur'an ve sünnet esas alınarak uygulama yapılmaktadır fakat uygulama aşamasında bazı engel ve zorluklarla karşı karşıya kalınmaktadır. Bu çalışmada katılım bankalarının tabi oldukları Bankacılık Kanunu incelenmiş, Türkiye'de mevcut katılım bankaları ile gerçekleştirilen mülakatla katılım bankalarının şer'i uyumuna engel olabileceği zorlukları ortaya çıkarmak hedeflenmiştir."
