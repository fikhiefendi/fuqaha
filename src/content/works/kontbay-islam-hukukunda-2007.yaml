abstract: "slam hukukunda cezalarda gözetilen amaçlar ısıgında suçla mücadele ve suçluların ıslahı ile ilgili bu çalısma, bir giris ile iki bölümden ve sonuç kısmından meydana gelmektedir. Giris kısmında ?içerik ve yöntem? baslıgı altında konunun önemi, sınırlandırılması, sunulması ve kullanılan kaynakların degerlendirilmesi hakkında bilgi verilmistir. Konunun anlasılmasına yönelik genel bilgileri içeren birinci bölümde konuyla ilgili olan suç ve ceza kavramları açıklanmıstır. Daha sonra suçla mücadele edebilme ve suç isleyenlerin ıslahını gerçeklestirmede en temel unsur olan suçun sebepleri konusuna deginilmistir. Bu çerçevede insan davranıslarına etki eden bütün faktörlerin suç sebepleri arasında sayılabilecegi belirtilmistir. kinci bölümde suçla mücadele ve suçluların ıslahı kavramları açıklandıktan sonra suçla mücadele ve suçluların ıslahı açısından cezalar slam hukukuna göre degerlendirilmistir. Sonuç bölümünde ise genel bir degerlendirme yapılarak ulasılan netice belirtilmistir."
