abstract: "İnsanlar yaratılış gereği üreme ve bu sayede neslini devam ettirme güdüsüne sahiptir. İslâm dini de insanlığın neslini meşru yollarla devam ettirmesini ve korumasını elzem görmüş ve bu doğrultuda müntesiplerini çocuk sahibi olmaya teşvik etmiştir. Çocuk sahibi olmak çoğu insan için evliliğin temel gayelerinden biri olarak görülmektedir. Gerek dinî gerek toplumsal açıdan bu derece önemli görülen üreme olgusu, birtakım sebeplerden dolayı doğal olarak gerçekleşmeyebilir. Günümüz tıp dünyasının geliştirmiş olduğu bazı yöntemler, tabii yolla çocuk sahibi olamayan çiftlerin de çocuk sahibi olabilmelerinin önünü açmıştır. Bireylere uygulanan bazı tıbbi müdahaleler, çocuk sahibi olamamakla ilgili problemleri çoğunlukla ortadan kaldırmış ve insanlığın neslini devam ettirmesinde önemli bir rol oynamıştır. Söz konusu üremeyi sağlayan tedavi yöntem ve şekiller insanlar nezdinde dini ve ahlâki açıdan sorgulanmıştır. Çalışmamız, doğal yollarla çocuk sahibi olamayan bireylere yönelik bilim dünyasının üremeye dayalı sunduğu yöntem ve şekillerin hem fıkhî hem ahlâki açıdan meşruluğunu değerlendirme amacı taşımaktadır. Araştırmada neslin devamlılığına yardımcı yaygın olarak kullanılan yöntemlerin açık ve anlaşılır bir şekilde aktarımı ve ilgili yöntemlerin dinî hükümleri yer almaktadır."
