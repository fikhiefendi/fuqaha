abstract: "Ġslâm ekonomik düzeni, temeli doğruluk ve dürüstlük olan bununla beraber fert ve topluma hizmet anlayıĢının da yegâne gaye olduğu bir sistem üzerine kurmuĢtur. Malın, üreticiden tüketiciye intikâli demek olan ticârî faâliyet helâl kılınmıĢtır . Diğer taraftan Ġslâm inancının dayandığı beĢ temel amelî esasın hac ve zekât gibi en ehemmiyetli iki tanesi, zengin olan mümine mahsustur ki, bunlar da aynı zamanda meĢru yoldan zengin olmanın teĢviki mâhiyetindedir. MeĢru yoldan diyoruz çünkü rekabet anlayıĢı bir tarafa bırakılırsa bir Ģeyi fiyatı yükselsin diye bekletmek ve tedavülden alıkoymak baĢka bir ifadeyle karaborsacılık yapmak Ġslâm hukukunda kesin bir Ģekilde yasaklanmıĢtır . Bu itibarla günümüz ticaret dünyasında çok fazla gündeme gelmesi hasebiyle biz de araĢtırmamızı ihtikâr (art niyetle stoklama) ve münafese (rekabetçilik) kavramları, mefhumları ve hükümleri üzerinde yoğun bir Ģekilde zaman geçirerek ele almaya çalıĢtık. AraĢtırmamızda, ihtikârın haram ve mekruh oluĢu hususunda fakihler arasında oluĢan ihtilaflara ayrıca küvetli delillere sahip olması bakımından haram olarak görülmesi gerektiği görüĢün tercihe daha Ģayan olması hususunu da etraflıca değerlendirdik. Öte yandan araĢtırmamız, fukahaya göre ihtikârın vakti, islâm hukuku ve beĢeri iktisatta ihtikârın tedavi yolları, ticaret kervanlarıyla buluĢmayı engelleme ve merkezde bulunanların kırsaldaki kesime olan satıĢı, piyasaya müdahil olma, muhtekirin (kara borsacılık yapanın) ta'ziri, ta'zîr hakkında fakihlerin görüĢü, ekonomik dalgalanmalar, vergi zorunluluğu ve ihtikârla olan bağlantısı, vergilerin temel kuralları ve çeĢitleri, resmi kanuna göre verginin zorunluluğu, ihtikar ve kolları, tekel ihtikarı, ortak ihtikar, hükümetlerin ihtikarı, bir ülkenin diğer ülkeye uyguladığı ihtikar, ihtikar ve olumsuz etkilerine objektif bir Ģekilde değinmekle kalmayıp münafese (rekabet) mahiyeti ve kısımları, islâm hukuku ve beĢeri iktisatta münafese, münafesenin amacı, münafesenin kuralları, resmi ve iktisadi kurallar, münafesenin islâmî iktisattaki kuralları, münafesenin imanî kuralları, devletin münafesedeki mütedahilliği ve ilkeleri, devletin islâmî iktisattaki müdahilliği, devletin çağdaĢ iktisatlardaki müdahilliği, devletin beĢeri ve islâmi iktisattaki münasefe kurulları ve münafesenin ihtikarla olan alakansa kapsamlı bir Ģekilde değinerek ilgili alanda bilgi sahibi olmak isteyenlere doyurucu cevaplar vermektedir. Ġhtikârın ticarette olan olumsuz etkileri ve dini boyutuna da dikkatleri çeken araĢtırmamız rüĢvet ve karaborsacılığın, toplumu temelinden sarsan ve onun içten içe yıkılmasına neden olan en tehlikeli sosyal hastalıklardan olduğuna deniyor."
