abstract: "Osmanlı Devleti'nin hem iktisadi hem de içtimai hayatı hakkında bizim için mühim kaynak niteliği taşıyan tereke kayıtları, Osmanlı hukuk sistemine göre, ölen kişilerin geride bıraktıkları eşya ve mallarının tespit ve taksimi kadıların görevleri arasında yer alır. Sözlükte ise“geride kalan; geriye bırakılan”anlamlarına gelen muhallefin çoğulu olan muhallefât kelimesi yerine belgelerde tereke (terike) ve metrûkât da geçer. Tez çalışmamızın ana konusu, Tokat Gaziosmanpaşa Üniversitesinde görev yapmakta olan Sayın Prof. Dr. Alpaslan Demir'in Tokat Müzesinde“Tokat Müzesi gelen-giden evrak kayıt defteri”nde yapılan araştırmalar sonucunda tespit etmiş olduğu Merzifon Şer'iyye Sicilindeki 1877-79 yılları arasını kapsayan tereke kayıtlarıdır. Bu çalışmada 112 tereke kaydında geçen hükümler hakkında detaylı bilgi verilmiş ve bu bilgileri gerek nicelik gerekse nitelik açıdan değerlendirilmiştir. Tez; giriş, dört bölüm ve sonuçtan oluşmuştur. Tezimizin giriş kısmında genel bir değerlendirme yapılıp, bilgi verildikten sonra birinci bölüme geçilmiştir. Birinci bölümde çalışmanın amacı, yöntemi ve izlenilen yol ile ilgili bilgi verilmiştir. İkinci bölümde, şer'iyye sicilleri ve Osmanlı Devleti'ndeki yeri ve önemi hakkında bilgi verilmiştir. Üçüncü bölümde, şer'iyye sicillerine tereke kayıtlarının nasıl yapıldığı ve terekedeki bilgiler aktarılmıştır. Dördüncü ve son bölümde ise İslam hukukuna göre mirasın, mirasçının tanımı yapılmış ve terekedeki bulgular hakkında bilgi verilmiştir. Sonuç kısmında ise elde edilen tüm bilgiler değerlendirilmiştir."
