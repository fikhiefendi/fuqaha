abstract: "Bu çalışma, İslam hukuku ve amaçları ışığında Fas katılımcı finansal sözleşmelerinin şeriat denetiminin rolünü göstermeyi ve kendisine emanet edilen görevleri yerine getiren bir iç veya dış organ olması nedeniyle şeriat denetiminin mekanizmalarını bilmeyi amaçlamıştır. Fas katılımcı bankalarının buradaki rolü, Yüksek Bilim Kurulu tarafından yayınlanan görüşleri izlemek, denetlemek ve bunlara uymak olduğu için, Bank Al-Maghrib'in görüşünü alıyor. Bu çalışmada, Faslı katılımcı bankalar tarafından ele alınan katılımcı finansal sözleşmeler ele alınmıştır: Alıcının satın alması için murabaha sözleşmesi, İcara, Muşaraka, Mudaraba, Salam ve İstisna. Bu nedenle, bankalarda uygulanan katılımcı finansal sözleşmeleri tahmin etmek için tümevarımsal yaklaşımı izledik. Faslı katılımcı, ardından Bank Al-Maghrib'in bankacılık işlemlerinde benimsediği en önemli sözleşmeleri, sözleşmelere ilişkin yasal bakış açısı ve kapsamı, kullanım yöntemleri ve teknik açıklamalar açısından betimleyici yaklaşım ve son olarak analitik yaklaşım. Katılımcı finansal sözleşmelerin Fas bankacılık kanunu ve şeriat kanunu ışığında analizi yoluyla. Bu çalışmamızda ayrıca Fas katılım bankalarında şeriat denetimi sürecini yürüten organ veya komiteleri ele alarak, şeriat denetimi mesleğini icra ederken yerine getirdikleri en önemli görev ve işlevlere değindik. Çalışma sonucunda, yetkililerin Fas yasalarında kendilerine verilen görevleri yerine getirmeleri, karar vermekte gecikmemeleri ve belirlenen süre içinde tamamlamaları gibi bir dizi sonuç ortaya çıktı. Ekonominin ve katılımcı finansmanın bel kemiği olan İslam hukukunun kural ve ilkelerine uyulmasının yanı sıra bu, yasal denetim sürecinin ihmal edilmemesinden kaynaklanmaktadır ve Fas bankacılık yasası, merkez bankasının buna uyması gerektiğini vurgulamaktadır."
