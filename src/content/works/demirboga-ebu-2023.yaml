abstract: "Ebû Hanîfe ve İmâmeyn arasındaki muhalefetin usulden ziyade fürûa ilişkin konularda olduğunu söylemek mümkündür. Hanefi fıkıh usulü eserlerinde ihtilaflı olarak zikredilen meselelerdeki görüş ayrılıklarının ise temel usûlî kaidelere ilişkin olmaktan ziyade detaya ilişkin konulardan kaynaklandığı söylenebilir. Ebû Hanîfe ve İmâmeyn arasındaki muhalefetin mahiyeti genel olarak böyle olmakla birlikte Hanefi fakihler fürûa ilişkin bazı meselelerde ihtilafın delilden değil zaman farklılığından kaynaklandığını ifade etmişlerdir. Zaman ve asır ihtilafı olarak ifade edilen bu husus bazı meselelerle ilgili olsa da tartışma konusu olan bütün meselelerin zamanın değişmesine indirgenmesi ve bunun ihtilaflı bütün meselelere teşmil edilmesi isabetli değildir. Hanefi imamların görüşleri büyük ölçüde sonraki diğer Hanefi fakihler tarafından temellendirilmiştir. Bu temellendirmenin kapsamlı ve sistematik bir şekilde yapılması hicri dördüncü asrın ortalarına tekabül etmektedir. Cessâs ve Ebü'l-Leys Semerkandî gibi önde gelen fakihler tarafından temellendirilen görüşler daha sonraki Hanefi fakihler tarafından da hemen hemen aynı şekilde temellendirilmiştir. Bu yönüyle Hanefi fakihlerin değerlendirmelerinin büyük ölçüde birbirini izlediğini söylemek mümkündür. Temellendirmenin benzerliği konusunda Irak, Mâverâünnehir, Mısır, Şam ve Anadolu Hanefi fakihlerinin büyük ölçüde hemfikir olduğu görülmektedir. Yazdıkları eserlerin mahiyeti itibarıyla Hanefi fakihlerin gerekçeleri arasında bazı nüanslar bulunsa da bunun az olduğunu söylemekte yarar vardır."
