abstract: "İnsanoğlu, tarih boyunca hastalıkların tedavisi için farklı yollar denemiş, çeşitli maddeleri şifa aracı olarak kullanmıştır. İlk dönemlerden itibaren insan bedenine ait bazı parçaların tedavi amacıyla kullanıldığı bilinmektedir. Günümüzde ise tıbbî ve teknolojik gelişmelerle birlikte insan bedeni, farklı şekil ve yöntemlerle tedavi sürecine dâhil edilmektedir. Modern tıpta organlardan hücrelere kadar insan bedenine ait unsurlar“İnsan Kökenli Biyolojik Madde”(İKBM) olarak adlandırılmakta ve bu unsurlar, tedavi ve araştırma süreçlerinde yüksek tıbbî değer taşıyan biyolojik materyaller olarak kabul edilmektedir. İnsan kökenli biyolojik maddelerin modern tıp ve tamamlayıcı/alternatif uygulamalardaki artan terapötik kullanımı, meselenin fıkhî esas ve sınırları bakımından değerlendirilmesini gerekli kılmaktadır. Bu çalışma, insan kökenli biyolojik maddelerin doğrudan terapötik amaçla kullanımını fıkhî açıdan incelemeyi hedeflemektedir. İnceleme kapsamı, bedenden doğal olarak ayrılan yahut ayrılması doğrudan tedavi/araştırma kastına dayanan cerrahî bir işleme dayanmayan unsurların terapötik ajan olarak kullanımıyla sınırlandırılmıştır. Bu nedenle, doğrudan cerrahî müdahale gerektiren ve amacı işlevsiz hale gelmiş organ veya dokuların yerini alacak yeni bir organ veya dokunun transfer edilmesi olan organ nakli uygulamaları çalışmanın kapsamı dışında bırakılmıştır. Kök hücre tedavileri de çalışmanın kapsam ve sınırlarını aşan ayrı bir inceleme alanı oluşturduğundan kapsam dışı bırakılmıştır. Örneklem olarak İKBM'lerden anne sütü, plasenta, kan, idrar ve gaita seçilmiştir. Çalışmanın ilk bölümünde, konunun teorik çerçevesini oluşturmak üzere, fıkhî açıdan insan beden parçalarının hukukî statüsü, bedenden ayrılan parçalar üzerinde tasarrufun sınırları ve haramla tedavi meseleleri klasik fıkıh literatürü ve çağdaş yaklaşımlar ışığında tartışılmaktadır. Daha sonra müstakil başlıklar altında örneklem olarak seçilen beden unsurları ile gerçekleştirilen tedaviler tıbbî ve fıkhî yönleriyle ele alınmaktadır. Her bir bölümde ilgili unsurun temel özellikleri, geleneksel/alternatif ve modern tıptaki kullanımları özetlenmekte; ardından klasik literatür ve çağdaş fetvalar temelinde her bir tıbbî pratik fıkhî açıdan değerlendirilmektedir. Bu çerçevede, HAMLET kompleksi, fekal mikrobiyota transplantasyonu (FMT), idrar terapisi, amniyotik membran nakli ve plasentofaji gibi uygulamaların fıkhî hükmü zaruret–ihtiyaç, tayyibât/necâset ve maslahat–mefsedet kavramları etrafında tartışılmaktadır."
