abstract: "İlim tasnifinde dînî ilimler veya İslâmî ilimler olarak sınıflandırılan üç üretici ilim kabul edilen fıkıh, kelâm, tasavvuf aynı kaynaktan çıkan ilimlerdir. Bu ilimlerin arasındaki ilişkinin ilmî metotlarla ortaya konulması önemlidir. Bu tezde bu üç ilimden fıkıh ile tasavvufun birbiri arasındaki ilişkiyi incelenmiştir. İlk oluştuğu dönemden itibaren tasavvuf ve bunun tezahürleri tartışma konusu olmuş ve olmaya devam etmektedir. Fakîhler ile sûfîler arasındaki çekişmeler meşhurdur. Bu çekişmelerin bir dönem Osmanlı'da kavgaya dönüştüğü, tarihte de idamlara yol açan ihtilafların yaşandığı bilinmektedir. Her ne kadar önemli oranda uzlaşmaya varılmış olsa da fakîhler arasında sûfîlerin bidatlerle, hurafelerle meşgul olduğu kanaati, sûfîler arasında da fakîhlerin \"zâhir âlimi\" olduğu söylemi halen devam etmektedir. Tezde tasavvuf ve fıkıh ilişkisi, imkân nispetinde, hem teorik hem de pratik açıdan incelenmeye çalışılmıştır. Tezin teorik bölümü sahabe dönemi ile başlatılmış, tasavvufun ilim olarak tamamlanma süreci kabul edilen Gazzâlî ile bitirilmiştir. Daha sonraki tarikat dönemine atıflar ancak gerektiği zaman yapılmıştır. Ancak tezin son bölümünde dönem sınırlaması yapılmamış, özellikle günümüzde de devam eden tasavvufun fıkıh alanına giren meselelerinin fıkhî hükümleri ortaya konmuştur. Bunun dışında tasavvuf fıkıh ilişkisinin ortaya konulması bağlamında biyografilerine yer verilen şahsiyetler seçilirken tasavvufu veya fıkhı üst düzeyde temsil ettiği kabul görmüş ve meşhur olmuş kişiler seçilmiştir. Üç ana bölümden oluşan tezin birinci bölümünde fıkıh ve tasavvuf kavramları üzerinde durulmuş; bunların tarihî gelişimleri verilmiştir. Ayrıca tasavvufun belli başlı öğretileri de incelenmiştir. Bu bölümde aradaki ilişkiye kısmen değinilmiştir. İkinci bölümde tasavvuf fıkıh ilişkisi teorik düzeyde incelenmeye gayret edilmiştir. Bu bölümde, hem fıkhın ve tasavvufun birbiri ile konu düzeyinde ilişkisi, hem de temsilcileri üzerinden ilişkisi gösterilmeye çalışılmıştır. Üçüncü bölümde ise tasavvufun fıkıh alanına giren belli başlı meselelerinin fıkhî hükümleri ortaya konmaya gayret edilmiştir. Fıkhî hükümler ortaya konarken öncelikle sûfîlerin konuya bakışı özetlenmiş, sonra fakîhlerin görüşleri özellikle dört mezhebi kapsayacak şekilde verilmiş daha sonra da kendi tercihimiz ve fikrimiz olabildiğince açık ortaya konmaya çalışılmıştır. Kendi görüşümüz ortaya konulurken fıkhî kaidelere ve usûle uymaya gayret edilmiştir."
