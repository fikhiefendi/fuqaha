abstract: "Ceza, Yüce Allah'ın, mükellef insanlara, emre muhalefetin karşılığı olarak vermiş olduğu bir yükümlülüktür. Keffaret cezaları da bu yükümlülüklerden biridir. Ancak keffaretlerin diğer cezalardan farklı bir yanı bulunmaktadır; nitekim ceza olmak üzere konmuş olsa da keffaretler, ifa edilişi bakımından bir ibadettir. İbadet ve ceza boyutu olan bu yükümlülük, araştırma konumuzu teşkil etmekte ve tezimizde her iki yönüyle incelenmektedir. Konuyu ağırlıklı olarak İslam ceza hukuku bakımından incelediğimizden, keffaretlerin daha ziyade ceza boyutu üzerinde durulmuştur.Kur'an ve Sünnette dayanakları bulunan keffaret cezalarının, genel olarak altı çeşidi vardır. Bu çalışmada kefaret cezaları daha ziyade Hanefi içtihatları ışığında incelenmiştir."
