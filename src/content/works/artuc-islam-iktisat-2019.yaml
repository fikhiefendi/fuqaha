abstract: "İslâm iktisadının ayrı bir bilim dalı olarak ortaya çıkması yaklaşık bir asrı bulmasına rağmen düşünce olarak İslâm'ın ilk yıllarına kadar götürülmesi mümkündür. Kur'an ve Sünnetin iktisadî hayata dair getirdiği ilkeler, canlı bir ekonomik hayatın içinde olan ilk Müslümanların uygulamalarıyla ete kemiğe bürünmüştür. İslâm'ın çalışmayı ve ticareti ibadetleştiren bakış açısı, zaman içinde iktisadî konuları içeren çok sayıda eserin ortaya çıkmasını sağlamıştır. Bu çerçevede İslâm ilim geleneğinin yazılı kaynaklarına bakıldığında zengin bir muhteva ile karşılaşılmaktadır. Bu muhtevanın büyük bir bölümünü hiç şüphesiz fıkıh literatürü oluşturmaktadır. Bu eserlerin incelenmesi hem batılı iktisat tarihçilerinin ifade ettiği iktisadın karanlık çağını ortaya koymak hem de günümüz iktisat düşüncesinin gelişimine katkı sunmak açısından önemi haizdir. Bu tezde, İslâm iktisat düşüncesinin fıkhî kaynaklarına bir örnek olarak İmam Şâfiî'nin görüşleri ele alınmaktadır. Bu çerçevede İmam Şâfiî'nin yaşadığı dönemin iktisadî yapısı ve onun görüşlerini bulabildiğimiz el-Üm adlı eserinden hareketle onun, toprak mülkiyeti, arz-talep, faiz ve para, selem, kırâd ve icare gibi konulardaki yaklaşımları tahlil edilmiştir"
