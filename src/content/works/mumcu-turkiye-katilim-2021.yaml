abstract: "Günümüzde katılım bankacılığı, faaliyette bulunduğu ekonomik sistem içerisinde, İslami usuller doğrultusunda, ulusal ve uluslararası düzeyde finansal uygulamalarda bulunmakta ve sayıları giderek artmaktadır. Bu kurumsal yapılar, faizsizlik prensibine mukabil İslam dininin kabul ettiği finansal faaliyetlerde bulunarak, konvansiyonel finans piyasasına aktarılmayan fonların İslami esaslar gözetilerek finans sektörüne kazandırılmasını sağlamaları açısından oldukça önemlidir. Bu çalışma, günümüzün ekonomik düzeni içerisinde, katılım bankacılığını, katılım bankacılığı ile konvansiyonel bankacılık uygulamaları arasındaki farklılıkları Albaraka Türk Katılım Bankası özelinde örneklemeye giderek açıklamaya çalışmaktadır. Türkiye'de faizsiz bankacılığa öncülük ederek 1984'te kurulan Albaraka Türk Katılım Bankası A.Ş.'nin kuruluşundan bugüne kadar olan süreç, Albaraka'nın kurulduğu dönemin siyasi iklimi, kurucuların, siyasilerin, tüketicilerin beklentileri, bankacılık uygulamaları ve faaliyetleri, Albaraka Türk'ün dünü, bugünü bu çalışmada açıklanmaya çalışılmıştır. Araştırmanın sonucunda; Albaraka Türk Katılım Bankası'nın Türkiye'nin iktisadî hayatında yepyeni bir dönemin başlatıcısı olduğu, Türk ticaret sektörüne yeni aktörlerin girmesini sağladığı, faizsiz bankacılıkta modern çağın ihtiyaçları doğrultusunda güçlü bir gelenek ve birikimin oluşmasını sağladığı, bireysel açıdan özellikle faiz hassasiyeti olan tüketicilerin ihtiyacını karşılarken toplumsal açısından da ulusal ekonomik yapının önemli dinamiklerinden biri olarak kendine yer bulduğu kanaatine varılmıştır."
