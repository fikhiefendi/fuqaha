abstract: "Gölge bankacılık ile ilgili tartışmalar küresel finans krizi sonrası yoğunlaşmış ve finansal sistemin düzenlenmesi ile ilgili tartışmaların merkezine oturmuştur. Bu tez kapsamında gölge bankacılık kavramsal olarak tartışılmış ve Türkiye'de gölge bankacılıktan katılım bankası adı ile regüler bankacılığa geçiş yaparak finansal sistem içindeki önemini artıran özel finans kurumlarının regüler bankacılığa geçişi ekonometrik bir model yardımı ile ortaya konmuştur. Ayrıca geçiş sonrası dönemde geçiş öncesine göre seçilen performans kriterlerinin negatif etkilendiği elde edilen ampirik bulgular yanında trend eğilim grafikleri ile de gösterilmiştir."
