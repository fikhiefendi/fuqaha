abstract: "Bu çalışma, Özbek Hanlıkları'ndaki vakıf kurumunun tarihsel ekonomik işlevini incelemekte ve modern Özbekistan'ın kamu hizmeti sunumundaki zorluklara çözüm potansiyelini değerlendirmektedir. Uzman görüşmeleri ve tarihsel analize dayalı nitel bir yaklaşım kullanan araştırma, öncelikle Özbekistan'ın devlet merkezli modelindeki bütçe açıkları ve devlet dışı aktör katılımının sınırlılığı gibi temel kısıtları tespit etmektedir. Ardından, tarihsel vakıf sistemini yeniden inşa ederek, onun eğitim, sağlık, altyapı ve sosyal koruma gibi temel sektörleri, verimli mekânsal ve ekonomik kümeler aracılığıyla finanse eden sofistike ve kendi kendini idame ettiren bir sistem olduğunu ortaya koymaktadır. Çalışma, vakf kurumunun canlandırılmasının, Özbekistan'ın bu kilit sektörleri geliştirme çabalarını tamamlayacak derin kültürel temelli bir mekanizma sunduğunu hulasa etmektedır. Ancak bunun, sistematik bir arşivsel bilgi birikiminin ihyası ve modern bir İslami finans ekosisteminin geliştirilmesi ile birlikte temel bir yasal reform gerektirdiğini vurgulamaktadır. Tez, vakfı kamu mallarının sağlanmasında devletin mali yükünü hafifletmek, servet dağılımını sağlamak ve toplum kalkınmasını desteklemek için sürdürülebilir bir araç olarak konumlandıran aşamalı bir canlandırma modeli önermektedir."
