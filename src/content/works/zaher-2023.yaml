abstract: "İslami finans endüstrisi, hem kâr hem de hayrı amaçlayan ve İslam hukukunun ilkelerine ve amaçlarına dayalı olan yönleri içermesi bakımından diğerlerinden farklıdır. İslam dünyası, kâra ve mal üretimine dayalı alanlarda eş zamanlı olarak hem adaletin gerçekleştirilmesi hem de finansal imkânların arttırılmasını hedefleyen ahlakî bir çerçeve kurma konusunda görece bir başarı elde etmiş olmakla birlikte toplumların gelişimine önemli katkı sağlayan hayrî vakıf müessesesini yeterince etkin kılamaması bakımından toplumsal sorumluluk konusunda bir eksiklik hissedilmektedir. Araştırmamız esas olarak İslamî finansı geliştirme ve bunun vakıf müessesesinin gelişimine uygulanmasının imkânını Türkiye Vakıf Katılım Bankası örneği üzerinden ele almaktadır. Bunun sebebi sürdürülebilir gelişme konusunda devamlılığı sağlamada, vakfın toplumsal sorumluluklar konusunda önemli bir rol üstlenmesini sağlamak suretiyle kâr ve hayır yönlerinin birleştirilebileceği bir yapı meydana getirmektir. Bu araştırma, vakıf mallarının yatırımı için uygun finansal ürünleri incelemeyi, kârın arttırılması ve hayır yönlerini birleştirmeye sağlayabilecek bir mekanizmaı belirlemeyi ve bu birleşmenin önünde engel oluşturabilecek durumları ortaya koymayı amaçlamaktadır. Ayrıca bankacılık kurumlarının bu iki sektörü entegre etme kabiliyetini incelemeyi ve bu entegrasyonu sağlamak için bir mekanizma önermeyi hedeflemektedir. İslami finans ürünleri kullanılarak kârın ve hayra yönelik faaliyetlerin birleştirilmesine yönelik oluşturulabilecek mekanizmaya tespit edebildiğimiz kadarıyla herhangi bir ilimsel uygulamalı bir çalışma bulunmamaktadır. Ayrıca, sosyal sorumluluğu yerine getirmede vakfın bir alternatif olarak ortaya konulmasını ele alan veya alandaki tecrübî birikim ve istatistiksel çalışmalara işaret eden tümevarımsal analiz, mukayese ve eleştirel yöntemleri kullanan herhangi bir çalışma da bulunmamaktadır. Bu araştırmanın en önemli sonucu vakıf mallarının bankalar aracılığıyla değerlendirilip geliştirilmesine uygun İslamî finans ürünlerinin netleştirilmesidir. Bu ürünler kapsamında mudarebe, müşâreke, leasing, tarımsal ortaklıklar (müzaraa, müsakat, muğârese), Murabaha, selem, her iki türüyle ıstısnaʻ, taksitli satım, karz-ı hasen, âdî teverruk, menkul kıymetler, her iki türüyle icare, cuâle, vakıf fonları, cârî ve yatırım hesapları, Yap-İşlet-Devret (YİD) modeli, gelişme konusunda İslam hukukunun amaçlarına dayalı ve uygun bankacılık işlemleri, bankanın sosyal sorumluluğu gerçekleştirecek bir alternatif olarak ortaya konulmasıdır. Araştırmamızda vakıf müsessesesinin gelişiminin önündeki en önemli eksiklikler ve bunların çözümleri ortaya konulmuş, Türkiye Vakıf Katılım Bankası tecrübesinin dünyadaki diğer İslam ülkeleri için de genelleştirilmesi tavsiye edilmiştir."
