abstract: "“İslâm Hukukunda Devlet Bakanlığı Seçimi”adındaki bu tezimiz bir giriş ve beş bölümden oluşmaktadır. Giriş bölümü araştırmanın konusu, amacı, önemi, yöntem ve sınırlılıklarından meydana gelmektedir. Araştırmamızın birinci bölümümde devlet başkanlığı ile ilgili konular kavramsal çerçevede ele alınmaktadır.“Seçim”,“bey'at”ve aralarındaki benzer ve farklılıklar da kısa bir şekilde işlenmektedir. İkinci bölümde Hulefâ-i Raşidîn Dönemi'ndeki halifelerin devletin başına geçme usûllerine değinilmektedir. Üçüncü bölümde İslâm hukukunda devlet başkanlığı ile ilgili meseleler, Kur'ân-ı Kerime, Sünnette ve sahâbe uygulamalarına dayandırılarak klasik ve çağdaş hukukçuların görüşleri çerçevesinde işlenmektedir. Bu bölümde devlet başkanının gerekliliği üzerinde durulmakta ve çağdaş siyasî akımların etkisi neticesinde fukahânın bu konudaki farklı görüşleri ve tavırları ele alınmaktadır. Ayrıca bey'atin mahiyeti, meşruîyyeti, hukukî boyutu ve çeşitleriyle beraber şûrânın mahiyeti, hükmü, alanı ve şûrâ heyeti üzerinde ayrıntılı bir şekilde durulmaktadır. Akabinde de devlet başkanının seçim yöntemleri açıklanmaktadır. Dördüncü bölümde gününüzde uygulamakta olan“Başkanlık”,“Yarı Başkanlık”ve“Parlamenter”gibi çağdaş sistemler ve bu sistemlerin seçim yöntemleri ele alınmaktadır. Son bölümde ise İslâm hukuku açısından çağdaş devlet başkanlığı seçimi değerlendirilmektedir. Bununla beraber İslâm'daki seçim usûlleri, çağdaş seçim şekilleriyle mukayese edilmekte ve aralarındaki benzerlik ve farklılıklara değinilerek konu bitirilmektedir."
