abstract: "Gözeler, Esra, Samî Dinî Geleneğinde Salât. Savm ve Zekât Kavramlarının Semantik İncelemesi. Yüksek Lisans Tezi, Danışman: Prof. Dr. Mehmet Paçacı, 135 s. ÖZET Araştırmamız Kur'an'da ibadet kavram sahasında yer alan salât, savm ve zekât kavramlarının semantik yöntemle incelenmesidir. Araştırmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi ve yöntemi hakkında bilgiler sunduk. Araştırmamızda salât, savm ve zekât kavramlarını ayrı bölümlerde inceleyerek etimolojik yapılarını, Kur'an'da ve Samî dinî geleneğinde sahip oldukları anlamları ve bu metinler arasındaki paralellikleri belirledik. Böylece bu dinî teknik terimlerin Kur'an'da özel anlamlara sahip olduğunu ve Samî dinî geleneğinde bu kavramların Eski Ahid'den Kur'an'a kadar birbirine benzeyen teknik terimlerle aktarıldığını ortaya koyduk. Dinî teknik terimler bağlanımda Kur'an'ın, Süryanice yazı tekniğini devam ettirmiş olduğunu söylemek mümkündür."
