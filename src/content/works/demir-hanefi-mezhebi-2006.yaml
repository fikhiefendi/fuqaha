abstract: "Hanefi Mezhebi Fıkıh Usulü'nde Sünnet Anlayışı adlı bu çalışma söz konusumezhebin Fıkıh usûlü çalışmalarında önemli bir yere sahip olan Hicrî beşinci asrın,üç önemli müellifi Debûsî, Serahsî ve Pezdevî'nin usûl eserlerini merkeze almıştır.Çalışmada bu üç müellifin eserlerinin sünnet bölümleri incelenmiş böylece Hanefîusûlcülerin sünnetin tarifi, mahiyeti, tespiti ve değeri konusundaki düşünceleribelirlenmeye çalışılmıştır. Çalışmada yeri geldikçe elde edilen sonuçların diğermezhep mensuplarının düşünceleriyle karşılaştırılması da yapılmıştır.Çalışmada Hanefîlerin Kur'ân'dan sonra İslâm'ın ikinci kaynağı olarakgördükleri sünnete büyük önem verdikleri ve özellikle âhâd yollardan elde edilensünnetin tespiti için hadis usûlcülerinin kriterlerinden farklı sistemler geliştirdiklerimüşahede edilmiştir."
