abstract: "Bu çalışma, esas olarak İran hukukunda evliliğin sona ermesi meselesini ele almakta ve bazı hallerde meselenin Türk hukukuyla karşılaştırmasını yapmaktadır. Buna göre, çalışmada, İran Medeni Kanunu'ndaki boşanma, ayrılık ve evliliğin feshi gibi konular, İslam hukuku ve günümüz İran hukukunun normatif düzenlemeleri çerçevesinde değerlendirilirken Türk Medeni Kanunu hükümleriyle arz ettiği bazı benzerlik ve farklılıklara da işaret edilmiştir. Her iki hukuk sisteminde evliliğin sona ermesinde karşılaşılan hukuki problemler, kültürel ve dini farklılıklarla şekillenen toplumsal yapılar dikkate alınarak incelenmiştir. Çalışma, evliliğin sona ermesine dair mahkeme kararlarının gerekçelerini, boşanma sonrası tarafların yükümlülüklerini ve çocuk haklarının korunmasıyla ilgili düzenlemeleri genel bir değerlendirmeyle bir bütün olarak ele almaktadır. Elde edilen bulgular, İran hukukunda evliliğin sona ermesine ilişkin süreçlerin İslam hukuku ve modern hukuk arasında bir denge arayışında olduğunu, Türk hukukunun ise laik hukuk sistemi çerçevesinde kurumsallaşmış bir yapı sunduğunu göstermektedir."
