abstract: "Son yıllarda, Şeriat kurallarına ve etik değerlere dayanan katılım finansı olarak da bilinen İslam finansı, sadece Türkiye'de değil küresel ölçekte önemli gelişmeler ve ilerlemeler kaydetmiştir. Katılım finansının en önemli parçası olan katılım bankaları özgün yapısı ve iş modelleriyle konvensiyonel bankalardan ayrılarak bireylere, işletmelere ve kurumlara cazip bir alternatif ve sürdürülebilir bir finansal araç olarak dikkatleri her geçen gün üzerine çekmeye devam etmektedir. Finansal istikrar ve kredi riski yönetimi bankalar için oldukça önem arzetmektedir. Altman Z-Skor modeli, şirketlerin finansal istikrarını değerlendirmek için en yaygın kullanılan bir araçtır. Bu çalışmada Türkiye'de fiziki teşkilatlanmaya sahip katılım bankası olarak faaliyet gösteren; Kuveyt Türk, Albaraka Türk, Türkiye Finans, Ziraat, Vakıf ve Türkiye Emlak katılım bankalarının iflas profillerini analiz etmek için Altman Z-Score modelinin gelişmekte olan pazarlar için geliştirilen Emerging Market (EM) Score metoduyla, kredi riskini ve yönetimini değerlendirmek için Takipteki Krediler Oranı (NPL) uygulanarak, daha bütüncül ve destekleyici bir bakış açısı elde edilmeye çalışılmıştır. Bu iki model karşılaştırmalı olarak katılım bankaları ile mevduat bankalarına da uygulanmıştır. Karşılaştırmalı analizdeki amaç daha kapsamlı bir çalışma yürütmek ve katılım banklarının rekabet avantajına sahip olabileceği veya finansal istikrarını ve risk yönetimini sağlamak adına kendilerine mahsus olabilecek zorlukları ve noktaları görmelerini sağlamaktır. Gerekli finansal veriler Türkiye Katılım Bankaları Birliği (TKBB) ve Bankacılık Düzenleme ve Denetleme Kurumu (BDDK) resmi sitelerindeki verilerden ve raporlardan elde edilmiştir. Son olarak, söz konusu iki model arasındaki ilişki incelenmiş bankacılık sektörü açısından finansal istikrarın daha iyi anlaşılması hedeflenmiştir. Deneysel nitelikteki bu çalışma, banka yatırımcıları, banka paydaşları ve politika yapıcılar için önem arz etmekle beraber literatüre değerli katkılar sunmaktadır."
