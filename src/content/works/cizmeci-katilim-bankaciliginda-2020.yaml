abstract: "Dünyada yükselen İslami Bankacılık veya Türkiye'de bilinen adıyla Katılım Bankacılığı finansal piyasalardaki payını yıllar geçtikçe daha da arttırmaktadır. Hassasiyetleri dolayısıyla mevduat bankalarını tercih etmeyen belli bir kesimi ekonomiye katması dolayısıyla fonksiyonel olarak da ekonominin önemli bir parçası olmuştur. Türkiye'de sektörün büyümesi ise Katılım Bankalarının hissedarlarının bu alana daha fazla yatırım yapmasıyla olacaktır. Bu kararı alırken hissedarların gözeteceği en önemli parametrelerden biri de özkaynak karlılığı(ROE) dir. Bu tezde Katılım Bankaları açısından özkaynak karlılığını (ROE) etkileyen mikro ve makro etkenler ekonometrik modellerle tespit edilmeye çalışılmıştır. Toplamda 21 bağımsız değişken GLS random effects metoduna göre değerlendirilmiştir."
