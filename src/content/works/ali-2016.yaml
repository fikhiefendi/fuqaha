abstract: "Bu tez önemli yerleşik bazı kavramların tanımı hakkındadır. Tezde bu kavramların incelenmesi ile birlikte bu geniş alanda Kuran'ın öngördüğü ekonomik düzeni tehdit eden unsurlara cevap verilmektedir. Bu çalışma Önsöz, Giriş, Üç bölüm ve Sonuç kısımlarından oluşmaktadır.Giriş bölümünde tezin başlığında yer almakta olan tehdit, iktisat ve Fıkıh gibi temel kavramların tanımlarına yer verilmektedir. Birinci bölümde günümüz dünyasının önemli ekonomi sistemleri olan kapitalizm, komünizm ve İslami ekonomi sisteme dair bilgi verilmekte; söz konusu ekonomi sistemlerinin temel özelliklerine dair açıklamalar yer almaktadır. Bu sistemler arasında İslam ekonomi sisteminin en önemlisi olduğu ortaya çıkmaktadır. Çünkü İslam şeriatına dayanan hâkim değerler bu istemde ortaya çıkmıştır.İkinci bölümde Kuran-ı Kerim'de yer verilen ekonomik istikrarı açık olarak tehdit edici faiz (ribâ), israf (tebzîr) ve tekelcilik (ihtikâr) gibi kavramlar incelenmiştir. Üçüncü bölümde Kuran-ı Kerim'de yer verilen ekonomik istikrarı zımnen tehdit edici yolsuzluk ve rüşvet ile birlikte geçersiz (fâsid) ekonomik işlemler ve bu işlemlerin ekonomiye etkisinin açıklaması gibi konulara yer verilmiştir. Sonuç bölümü ise tezde yer verilen konuların incelenmesi ile ortaya çıkan en önemli neticeleri kapsamaktadır."
