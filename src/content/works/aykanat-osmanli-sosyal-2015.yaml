abstract: "Sosyal güvenlik hukuku, genç bir hukuk dalıdır. Ancak insanlar, insanlığın başlangıcından itibaren sosyal güvenliğe başvurmuşlardır. Sosyal risklerle karşılaşan insanlar bu riskleri telafi etme yolları aramışlardır. Osmanlı Devletinde bireyler ve devlet, sosyal risklere karşı önlem almışlardır. Osmanlılar, sosyal güvenlik işlevine sahip kurumlar aracılığıyla vatandaşlarına sosyal güvence sağlamışlardır. Türk İslam kökenli kurumları değiştirerek ve geliştirerek kendilerine uyarlamışlardır. Tanzimat öncesi dönemde yararlananların katkı sağlamadığı vakıf, nafaka ve yardım kurumları sistemin temelini oluşturmuştur. Tanzimat sonrası dönemde klasik kurumlardan oluşan sisteme yararlananların katkı sağladığı tekâüd sandıkları eklenmiştir. Osmanlı kurumları modern sosyal güvenlik penceresinden incelendiğinde sahip oldukları sosyal güvenlik işlevi ortaya çıkmaktadır."
