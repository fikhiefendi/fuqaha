abstract: "İslami Ekonomik Düzen, Kuran'da bulunan bir dizi ilkeye dayanıyor. İçinde İslam ekonomisi, mücadelenin yerini işbirliği yaparak değiştirdi. İşbirliği sadece bir hareket. Aynı zamanda bir motif ve psikoloji. Aynı zamanda bir neden ve bir rehberlik prensibi olan bir mantık ve ruh hali insan girişiminin tüm alanlarına yayılıyor. İslam bir din değildir. Sınırlı bir anlamda kelime ancak insan hayatının her yönünü kapsar ve ister. Geliştirmek istiyor insanda yeni bir ahlaki kişilik, entegre bir toplumsal varoluş ve yeni bir sosyo-ekonomi ve siyasi düzen. Ekonomik-kavramlar, hedefler, yöntemler, yasalar ve araçlar. İslami ekonomik sistem doğrudan ya da kapitalizm ya da sosyalizm ya da komünizmin herhangi bir türü. Temel fark şu: İslami ekonomi ilahi rehberliğe dayanıyor; buna karşın kapitalist ve sosyalist ekonomi dine atıfta bulunmadan belirli bir insani eylem önermektedir. İslamcı Ekonomi kavramı mülkiyeti yöneten temel ilkelerden kaynaklanmaktadır. Var Allah'ın servet ve mülk hakkında koyduğu açık ve kesin yasalar. Endişe ediyorlar edinme, kullanma ve elden çıkarma ve mülkiyetin her biçimi ile ilgili olması özel kullanım, ticaret, tarım, endüstri veya başka herhangi bir amaç için. Hükümet kurallarını Propety'nin edinimi, Helal ifadesinde özetlenmiştir. İslam korur ve korur tüm koşulların hâkimiyeti. İslam, rekabete izin verir, ancak mükemmellik konularında. Sosyal ticarette Rehberlik ilkesi bu işbirliğidir. Bir ortak taahhüt altındaki adamların birleşmesi enterpnse; İstenilen sonuca ulaşmak için farklı beceri, yetenek ve varlıkların kombinasyonu ile mutabık kalınan oranlarda tam sorumluluk, güven ve fayda payı; ve basit bir başkasının ihtiyaçlarına hitap ederek yaşamak isteyen hareket,Ekonomik işbirliği. Bu ekonomik işbirliği, eşitlik doktrinlerine ve adil muamele. İslamiyet öncesi Arapların parasal sistemi yoktu ve paraları yoktu. Prensip olarak Aralarında Fars ve Bizans paraları yasal ihalelerdi. Ve bu madeni paralar nadir ve eşit olmayan ağırlıklar, İslam öncesi Arabistan'da para, bazen de olsa taşır Parasal ödeme ile, gerçekte bir banker anlaşmasıydı. İslam'ın erken dönem ticareti tamamen ekonomik bir hareket olarak değil, aslında bir ahlâki eylemi olarak görülüyordu. Bankacılık yeni olmadığı gerçeği göz ardı edilmemeli; erken dönemlerde bile varoldu Hazreti Ömer, Beyt'l Mal'ı kurdu ve bu da Kard'l Hasna'yı sadece kişisel tüketim için değil aynı zamanda iş için de muhtaçtır. Kâr hem taraflarca paylaşıldı banka ve tüccar. Daha sonra, Abbasiler döneminde bir dizi banka kuruldu hangi lahbaza denir. Bu bankalar sadece mevduat kabul etmekle kalmıyor aynı zamanda işadamları ve verilen ve kabul edilen çekler, taslaklar. Bu nedenle, İslami finansal sistem, Riba, ancak yalnızca İslami sosyal adalet ilkelerini benimseyerek ve kanunları getirerek, uygulamalar, usuller ve adalet, hakkaniyet ve faimess. Bankacılık operasyonlarının nah.rre'u herhangi bir finansal sistemin işleyişinde merkezi. Birçok İslami finans kuruluşu şimdi Müslüman dünyanın çeşitli paru işler durumda. Bu kurumların hedefleri Müslümanlar tarafından istenen tüm finansal operasyonların taahhüdünü, İslam hukukunun ilkeleri ve kuralları; bu fonlardaki yatırımları kapsar İslam bağlamı, Helal kâr nesiller ve konsolidasyon, tanıtım veİslami mali operasyonların uluslararası işbirliği. Günümüzde işlev gören çeşitli İslami finans kuruluşları, bankacılık, finansman ve yatırım perasyonlarının rekabetçi bir temele dayandırılması. -Bankacılık sistem cari hesaplar, hesaplar tasarruf, sistematik tasarruf hesapları, sabit yatırım hesapları ve çağrı yatırım hesapları. Finansman çeşitli alanlarda yapılmaktadır. yolları. Kısa vadede ticaret, kabul * d hir. satın alma. üzerinde ben orta vadede kredi, canlanma gelişme kredileri ve kira finansmanı konularını kapsar. üzerinde Uzun vadeli olarak, mortgage, öz sermaye finansmanı ve proje finansmanına kadar uzanır. bir uluslararası bankacılık işlemleri, para ve emtia alım satımı, para transferi, ihracat finansmanı, akreditifler ve teminat mektupları. Geleneksel bankacılık sisteminde kişisel veya kurumsal krediler yapılır basit bir finansman mekanizması aracılığıyla. Finansal aracı olarak hareket eden bankalar, kamuoyundan depozitler çıkartıp ödünç verenlere ödünç verirler. Borçlular, bireylerdir veya kurumlardır. Bankaların kârı esas olarak depozitlerle harcanan (ödenen) faiz ile kazanılan faiz (alınan) arasındaki fark borçlulardan. İslami bankacılık sisteminde"
