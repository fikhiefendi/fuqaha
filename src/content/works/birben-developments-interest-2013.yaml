abstract: "Bu tez genel olarak Türkiyede faizsiz bankacılık sisteminin Türk bankacılık sektörüne girişi ve sistemin kendi içerisindeki ihtiyaçları ve büyüme potansiyeli doğrultusunda geçmişten günümüze bu sisteme dahil olan yeni faizsiz bankacılık ürünlerinin gelişimi ve bu ürünlerin içeriği ile ilgili bilgiler vermektedir. Çalışmam da öncelikle Dünyada faizsiz bankacılık sisteminin doğuşu ile ilgili bilgiler verdim ve küreselleşen ekonomi doğrultusunda bu sistemin Türkiye ye gelişini ve Türkiye deki gelişimini aktarmaya çalıştım. Bu çalışmada hangi yeni faizsiz bankacılık ürünlerinin sisteme dahil olduğunu ve faizsiz bankacılık sisteminin ürettiği yeni faizsiz bankacılık ürünleri ile müşterilerinin hangi ihtiyaçlarına, nasıl cevap verdiğini aktarmaya çalışacağız. Son yıllarda yeni bir faizsiz bankacılık ürünü olarak sisteme katılan ve faizsiz bankacılık sisteminin geliştirdiği en önemli ve yeni enstrümanlarından biri diyebileceğimiz. Sukuk? un Dünya ve Türkiyede ki işleyişi üzerinde detaylı bir şekilde duracağız. Sonuç olarak Türkiyede faizsiz bankacılık sisteminin - üretilen ve sektöre dahil olan yeni bankacılık enstrumanlarının da etkisi ile- büyüme rakamlarından bahsedeceğiz. Anahtar Kelimeler (Türkçe) 1)Katılım Bankası 2)İslami Bankacılık 3)Faizsiz Bankacılık 4)Sukuk"
