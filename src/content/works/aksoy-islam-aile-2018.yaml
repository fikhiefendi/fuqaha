abstract: "Allah Teâlâ yeryüzünde bir halife yaratmayı murat etmiş, bu ilahi iradenin tecellisi olarak da insanı yaratmıştır. Cemiyet halinde yaşayan insanın, varlığını koruyabilmesi için kaçınılmaz olan bazı değerler vardır. Bu değerler yitirildiği takdirde hayatın düzeni yok olur, bozgunculuk ve kötülükler her tarafa yayılır. İnsanın yaratılış gayesi olan kulluk vazifesi unutulur ve kişi ahiret hayatının ebedî saadetinden mahrum olur. Bu değerlerin başında aile kurumu gelmektedir. Aile hukuku, ceninin ana rahmine düşmesi ile başlayıp ölümden sonra miras olarak bırakılan malların paylaşımıyla sona eren sürecin tamamıyla ilişkisi bulunan çok geniş bir hukuk alanıdır. İslâm hukukuna kendinden önceki hukuk sistemlerinden bazı hükümler gelmiştir. Fakat bu durum İslâm hukukunun, önceki hukuk sistemlerinin veya dinlerin kopyası olduğu anlamına gelmez. Tam aksine onlardan tahrife uğramamış hükümlerin bir kısmının İslâm hukukunda da muhafaza edildiği anlamına gelir. Bu çalışmada, İslâm hukuku, Câhiliye dönemi hukuk sistemiyle, aile hukuku bağlamında karşılaştırılarak İslâm hukukunun özgünlüğü tespit edilmeye çalışılmıştır."
