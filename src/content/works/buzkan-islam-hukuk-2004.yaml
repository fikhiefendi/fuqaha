abstract: "94 ÖZET Bu çalışmamızda hukuk tarihi açısından da önemli bir yere sahip olan“gayeci yaklaşımın”küllî kaidelerin oluşumundaki etkisini ve küllî kaidelere yansımasını bilimsel bir yaklaşımla ele almaya çalıştık. Çalışmamız giriş ve üç bölümden oluşmaktadır. Tezimizin giriş bölümünde Batıda ortaya çıkmış olan hukuk ekollerinde, gaye kavramının yerini açıklamaya çalıştık daha sonra tezimizi üç ana bölümde ele aldık. Birinci bölümde İslâm hukuk tarihinde gaye kavramına bağlı olarak Makâsıd, maslahat ve mefsedet kavramım açıkladık. İkinci bölümde İslâm hukuk tarihinde gayeci yaklaşımın küllî kaidelere etkisi ve İslâm hukukunun, temel maksadım ve felsefesini ihata eden küllî kaideleri ve bu kaidelerin ortaya çıkış sürecini ele aldık. Sonrasında da bu kaidelerin İslâm hukukundaki yeri ve önemini açıkladık. Üçüncü bölümde ise külli kaidelerden Makâsıda yönelik olanlarını Mecelledeki Kavâidi Külliyeyi esas alarak tek tek inceledik ve ardından da bu kaidelerin açıklamalarının sonunda makâsıdla bağlantısını kurduk."
