abstract: "Bankacılık sektörü, finansal sistemin en önemli unsurlarından biridir. Son yıllarda, faizsiz bankacılık sistemi faize dayalı bankacılık sisteminden çekinen insanların tasarruflarını ekonomiye aktarmak amacıyla dünya üzerinde oldukça yaygınlaşmıştır. Faizsiz bankacılık sektörü son yıllarda hızlı büyümesinden dolayı etkinlikleri üzerine araştırmalar için artan bir ihtiyaç vardır. Bu çalışmada faizsiz bankacılık sektörünün etkinliğini uluslararası düzeyde incelenmektedir. Çalışmada 2010 ile 2013 yılları arasında 24 farklı ülkeden 86 faizsiz bankanın etkinlik skorları ölçülerek analiz edilmiştir. Bankaların etkinlikleri parametrik olmayan yöntemlerden veri zarflama analizi tekniği kullanılarak ölçülmüş, etkin ve etkin olmayan karar verme birimleri belirlenmiştir. Etkinlik skorları toplam teknik etkinlik, saf teknik etkinlik ve ölçek etkinliği olarak hesaplanmıştır. Sonuçlar seçilen faizsiz bankaların toplam etkinliklerinin dört yıllık ortalamasının %45,8 olduğunu gösterir. Saf teknik etkinlikleri ve ölçek etkinlikleri toplam teknik etkinlikten yüksektir ve sırasıyla %64.4, %71.1 dir. Modellerin çözüm aşamasında ise VZA özel yazılımlarından biri olan DEA Solver kullanılmıştır. Etkinlik değerleri bulunduktan sonra bankaların girdi ve çıktı değişkenleri için potansiyel iyileştirmeler belirlenmiştir. Sonuç olarak etkin olmayan bankaların düzeltilmesi için öneriler verilmiştir."
