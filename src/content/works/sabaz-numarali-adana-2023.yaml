abstract: "Şer'iyye sicilleri Osmanlı Devleti'nin hüküm sürdüğü coğrafyalarda yaşayan halkın sosyal, kültürel ve iktisadi hayatı hakkında bize en net bilgiler veren kaynaklardır. Bu kayıtlarda, kadı veya ilgili görevliler tarafından mahallinde tutulan kaynaklar olduğundan dolayı, ilgili vilayet, kasaba veya köy gibi bölgelerin yöresel özellikleri ön plana çıkmaktadır. Aynı şekilde kaydedildiği bölge hakkında birinci elden gelen bilgiler barındırdığından günümüz tarihçileri açısından paha biçilemez belgeler konumundadırlar. Bu değer, sadece günümüz Türkiye'si için değil, Osmanlı sınırlarının ulaştığı tüm coğrafya için geçerlidir. Hicri 1286-1289 / Miladi 1869-1873 yıllarını kapsayan 91 Numaralı sicilde, Adana'nın idari, sosyal ve ekonomik yapısına değinilmiştir. Bu çalışmada belgelerin transkripsiyonu yapılmış; kayıtların özetleri hazırlanarak Adana vilayetinin belirtilen tarihlerde, içerisinde bulunduğu idarî, sosyal ve ekonomik durum gözler önüne serilmeye çalışılmıştır. İncelediğimiz sicilde genel itibari ile yer alan davalar şunlardır: Alacak-verecek meseleleri, tereke kayıtlarına dayalı veraset davaları, nikâh kıyma, boşanma, aile içi anlaşmazlıklar, taşınmaz malların satışı, icâreye verilmesi veya aile içi paylaşımlardan doğan anlaşmazlıklar, yaralanma, darp ve gasp gibi konuları ihtiva etmekle beraber büyük çoğunluğu alacak-verecek davaları. Şeri'iye sicilleri, özellikle Osmanlı Devleti'nin idarî, sosyal, kültürel ve iktisadi hayatı hakkında araştırma yapmak isteyen yerli ve yabancı araştırmacıların vazgeçilmez ana kaynakları durumundadır. Transkripsiyonunu yapmış olduğumuz 91 Numaralı Adana Şer'iyye sicili (Hicri 1286-1289 / Miladi 1869-1873) ile literatüre katkıda bulunulmaya çalışılmıştır."
