abstract: "Bu çalışma, Osmanlı ilmiye sınıfının önde gelen şahsiyetlerinden ve uzun yıllar Şeyhülislâmlık makamında bulunmuş olan Ebüssuûd Efendi'nin (ö. 982/1574) İrşâdü'l-ʿakli's-selîm adlı tefsirinde yer alan peygamber kıssalarına dair İsrâilî rivayetleri incelemektedir. Çalışmada, Ebüssuûd Efendi'nin tefsiri başlıca kaynakları olan Zemahşerî'nin (ö. 538/1144) el-Keşşâf'ı ile Beyzâvî'nin (ö. 685/1286) Envârü't- tenzîl ve esrârü't-teʾvîl adlı eserleriyle mukayeseli olarak değerlendirilmiştir. Araştırmanın temel amacı, Ebüssuûd Efendi'nin söz konusu iki kaynaktan etkilenmesine rağmen İsrâiliyat'tan ne ölçüde etkilendiğini ortaya koymak ve onun İsrâiliyat'a yaklaşımını tahlil etmektir. Ayrıca, İbn Kesîr (ö. 774/1373) ile zirveye ulaşan İsrâiliyat eleştirisinin sonraki dönemlerde ne ölçüde sürdürüldüğü sorusuna da cevap aranmıştır. Metodolojik olarak, İsrâilî rivayetlerin en yoğun biçimde bulunduğu peygamber kıssaları merkez alınmış, ilgili âyetlerdeki rivayetler tespit edilerek Ebüssuûd Efendi'nin bu rivayetlere yaklaşımı incelenmiştir. Araştırmanın sonucunda Ebüssuûd Efendi'nin tefsiri ile Zemahşerî ve Beyzâvî'nin tefsirleri arasında İsrâiliyat açısından belirgin bir farklılık bulunmadığı görülmüştür. Bununla birlikte Zemahşerî ve Beyzâvî bazı rivayetleri eleştirerek uydurma olduklarını belirtmişken Ebüssuûd Efendi'nin genellikle bu tür rivayetleri değerlendirmeden nakletmeyi tercih ettiği tespit edilmiştir. Ayrıca, Ebüssuûd Efendi'nin zaman zaman kaynaklarında yer almayan bazı İsrâilî rivayetleri de tefsirinde kullandığı dikkati çekmiştir."
