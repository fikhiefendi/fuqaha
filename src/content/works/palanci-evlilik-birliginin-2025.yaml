abstract: "Aile arabuluculuğu, aile içi uyuşmazlıkların çözümünde kullanılan dünya genelinde kabul görmüş alternatif bir uyuşmazlık çözüm yöntemidir. Kökleri eski tarihlere dayanan ve her toplumun kendi kültürel ve inançsal yapısına göre şekillenen bu uygulama Türkiye'de henüz hayata geçirilmemiştir. Fakat aile arabuluculuğu kurumunun Türkiye'de de uygulamaya konulması için çalışmalar devam etmektedir. Yapılan çalışmalar ve konuyla alakalı literatür, uygulanması planlanan sistemin genellikle Avrupa standartlarını temel aldığını göstermektedir. Ailede sulhu ve birliğin devamını esas alan uygulamalarıyla aile arabuluculuğu sürecine büyük katkılar sağlama potansiyeli bulunan İslam aile hukukunun zengin birikimden yeterince faydalanılmadığı gözlenmiştir. Türkiye'nin aile kurumuna bakışı ve aileye atfettiği önem Avrupa'dan önemli ölçüde farklıdır. Bu sebeple Türkiye'ye özgü bir aile arabuluculuğu sistemi geliştirilirken, modern arabuluculuk prensipleri toplumun kültürel ve inançsal dinamikleri göz önünde bulundurularak değerlendirilmelidir. Üç bölümden oluşan çalışmanın ilk bölümünde evlilik birliği, evlilik birliğinin korunması, aile, arabuluculuk ve aile arabuluculuğu kavramlarının ayrıntılarına yer verilmiştir. İkinci bölümde mukayeseli hukuktaki aile arabuluculuğu uygulamaları Malezya, Fas, Suudi Arabistan ve İngiltere (Müslüman Tahkim Heyeti'nin uygulamaları ile beraber) ile sınırlı olmak üzere incelenmiştir. Bu tercihin temelinde, İslam hukukunun evlilik birliğinin korunmasına verdiği önem ve bu amaca yönelik olarak geliştirdiği kendine özgü mekanizmalar yatmaktadır. İslam hukukunda aile, kutsal bir müessese olarak kabul edilmiş ve evliliğin devamlılığını sağlamak için çeşitli hukuki ve ahlaki düzenlemelere yer verilmiştir. Bu nedenle İslam hukukunun uygulandığı ülkelerdeki aile arabuluculuğu veya benzeri alternatif çözüm yöntemlerinin incelenmesi, evlilik birliğinin korunması amacına yönelik farklı kültürel ve hukuki yaklaşımları anlamak bakımından önemlidir. Üçüncü bölümde ise Türk hukukunda aile arabuluculuğu incelenmiş ve mukayeseli hukuktan değerlendirmeler ve önerilerde bulunulmuştur."
