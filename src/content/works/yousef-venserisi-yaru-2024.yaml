abstract: "Tarihsel araştırmaların çoğu, temel olarak tarihsel bilgi kaynaklarına ve tabakat, nesep ve siyer kitaplarına dayanmaktadır ve genellikle bu kaynaklar yönetici, lider ve siyasetçi tabakalarıyla ilgilidir ve onlara büyük önem verir. Ancak nevâzil fıkhı kitapları, -bu kitaplar tarihsel alana ilişkin olmamakla birlikte- yalnızca toplumun günlük yaşamıyla ilgilenmekle kalmayıp geleneksel tarihsel kaynakların çoğunda bulunmayan önemli derinlikler ve gizemleri ortaya koyan tarihsel bilgiler içermesi açısından zengin bir kaynak kabul edilir. Nitekim nevâzil fıkhı aslında vakıa fıkhıdır, dolayısıyla çok değerli bir tarihsel bilgi kaynağıdır. Belki de el-Mi'yâr el-Mu'rib adlı eser, yeni bir tarihsel kaynak olarak en değerli nevâzil kitaplarından biridir. Bu konuyu seçmemdeki en önemli nedenlerden biri, değerli hocam Prof. Dr. Murat AĞARI'nın bu yöndeki yol göstericiliğiydi. Daha önceki çalışmalarda hiç almayan bu önerisi, bu araştırma konusunun seçilmesinde teşvik edici olmuştur. Ayrıca tarihi bir kaynak olarak fetva kitaplarının kullanılması önde gelen çalışmalardan biri olarak edilmektedir. Nevâzil kitapları, kaleme alındıkları dönemde toplumsal, siyasal, tarihsel, askeri ve dini olguların tespit edilmesini sağlamak açısından önemlidir, çünkü diğer eser türlerinde bu yönlere pek değinilmez. Nevâzil kitapları, bilimsel sınıflandırma açısından tarih alanında kabul edilmez, ancak tarihsel metinler, zengin bilgiler ve değerli nüansların yanı sıra geleneksel tarih kitaplarında pek bulunmayan önemli ve nadir belgeler içermektedir. Bu nedenle nevâzil kitaplarında hak ettiği değer ve önemin gösterilmesi gerekmektedir. Nitekim araştırmacının yaşanmış bir olayın derinlerine inmesine yardımcı olarak tarihsel bilgi kaynaklarında bulunabilen boşlukların doldurulmasına katkıda bulunmaktadır. Dolayısıyla belki de İslam ümmetinin tarih boyunca gündelik yaşamında ve genel meselelerinde karşılaştığı yeniliklerin yanı sıra toplumsal ve ekonomik olgular daha iyi anlaşılabilmektedir. el-Mi'yâr kitabı üzerinden el-Venşerisî'nin ele aldığı fetvaların dönemin vakıasına ne denli uygun olduğu görülebilmektedir. Bu oldukça önemlidir, zira kimi zaman fıkıh ilmi, şer'î hükümlere tabi olan ancak vakıaya uygun olmayan varsayımlarda bulunabilmekte, buna binaen fıkıh mezhebine göre o meseleye ilişkin fetva verebilmektedir. el-Mi'yâr kitabında ise vakıası olmayan, yani varsayıma dayalı herhangi bir meselede hiçbir inceleme veya fetva bulunmamaktadır. Bu yaklaşım, esere büyük bir ilmi değer katmakta, aile, toplum, ekonomi ve kültür boyutlarıyla gündelik yaşama ışık tutan zengin bir tarihi haline getirmektedir."
