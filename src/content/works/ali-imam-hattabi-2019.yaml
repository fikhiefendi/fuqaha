abstract: "Çalışmamız (İmam Hattabi ve Mealim-üs-sünen kitabı, namaz bölümündeki fıkhi görüşleri) üzerinedir. Giriş bölümünde hadis ilmi ve peygamber (SAV)'in hadislerinin konumu ve önemine değinerek konuyu seçme nedeni, araştırmada kullanılan metot, daha önce yapılan araştırmalar ve araştırmacının karşılaştığı sıkıntılara işaret edilmiştir. Ardından birinci bölümde; İmam Hattabi'nin yaşamı, adı ve künyesinin belirlenmesi, aile şeceresi, doğumu, özellikleri, takva ve zühdü, işi, vefatı, diğer alimlerin hakkında beyan ettikleri görüşler, yetişmesi, bilimsel seyahatleri, mezhebi, farklı ilimlerdeki eserleri, şeyhleri ve öğrencileri ile şimdiye kadar basılmayan ederleri gibi hususları ele aldık. İkinci bölümde, İmam Hattabi'nin Mealim-üs-Sünen, namaz bölümdeki görüşlerini inceledik ve genel olarak namaz ve şartları, elbise temizliği, salat-ı vüsta, namazın uyuya kalma sebebiyle kaçırılması veya namaz kılınmayı unutmak, müstehaza namazı ve vitir hükümleri gibi konulara yer verilmiştir. Daha sonra namaz vakitleri, namazın caiz olmadığı konuları; mezarlıklarda ve devenin kaldığı ve beslendiği yer olmak üzere ikiye ayrılarak incelenmiştir. Son bölümde ise; ezan hükümleri, ezana karşı ücret alma, bilgilendirme“ilam”, cemaatle namaz kılmak, kimin imamlığı hak ettiği, cemaatle namaz kılmayı bırakmak, namaz kılmak için uğraşmak, okur yazarı olmayan ve acemin okuma karşılığı elde edeceği sevap, secde ve ruküde tesbihatın hükmü, peygamber (SAV)'e selat vermek, namaz sırasında çalışmak, namazı hafifleştirmek, köylerde Cuma namazı, namazda kunut, cenaze, ay ve güneş tutulma namazları, konularına değinilmiştir. Sonuç bölümü, araştırmanın ulaştığı önemli sonuç ve bu konuyla ilgili önerileri içermektedir."
