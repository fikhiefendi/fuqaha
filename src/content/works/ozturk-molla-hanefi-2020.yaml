abstract: "Bu çalışmada, 15. yüzyıl bilginlerinden Muhammed Molla Hanefî et-Tebrizî'nin Hâşiye 'ala Risâle fî İsbati'l-Vâcibi'l-Kadîme isimli eserinin edisyon, kritik ve analizi yapılmıştır. Birinci bölümde ana metin sahibi Celâleddîn Devvânî ve şârih Molla Hanefî'nin hayatı ve ilmi şahsiyetleri hakkında bilgi verilmiştir. Eserin yazma nüshaları tanıtıldıktan sonra kaynakları hakkında bilgi verilmiş ve eserin genel muhteva analizi yapılmıştır. Çalışmamızın ikinci bölümünde eserin tahkiki yapılmıştır. Eserde Molla Hanefî ana metni takip ederek müstakil bölüm ve başlık açmamıştır. Ana metne göre iki bölüm ve bir hatimeden oluşan eserde, hudûs ve imkân delilleri ve devir-teselsülün iptali üzerinden Allah'ın varlığını kanıtlamak manasına gelen İsbât-ı Vâcib meselesi ele alınmıştır. Birinci bölümde hudûs ve imkân delilleri kullanılarak Allah'ın varlığı ispat edilmeye çalışılmış; ikinci bölümde ise burhân-ı tatbîk, burhân-ı tezâyüf ve burhân-ı 'arşî yöntemleriyle devir ve teselsül çürütülerek Allah'ın varlığı ispat edilmeye çalışılmıştır."
