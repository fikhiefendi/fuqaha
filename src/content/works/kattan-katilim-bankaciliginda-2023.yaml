abstract: "Murâbaha, ticaret yapan kişinin ticaret malını satın aldığı fiyatın üzerine koyarak satmasıdır ki, bu fazlalığa ribh/kâr denir. Eğer murâbaha akdinden önce taraflar arasında herhangi bir vaatleşme söz konusu olmamışsa bu akit klasik murâbaha diye isimlendirilir. Eğer murâbaha akdi bir katılım bankası üzerinden yapılmışsa ve banka ile müşteri arasında öncesinde bir vaatleşme durumu bulunuyorsa, bu işlem modern murâbaha diye isimlendirilir. Katılım bankalarının gerçekleştirdiği murâbaha işlemlerinde uyulması gereken modern murâbaha standartları, İslami Finans Kuruluşları Muhasebe ve Denetleme Kurumu Şer'i Kurulu tarafından“Şer'i Standart No 8; Murâbaha”adı altında yayımlanmıştır. Çalışmamızın konusu, Türkiye'deki katılım bankalarında murâbaha uygulama mekanizmasını ele almakta olup, bu kapsamda Kuveyt Türk Bankası'nda uygulanan murâbaha sözleşme modelinin standartlara uygunluğu incelenmiş ve analiz edilmiştir. Araştırmamızın problemi“Katılım bankalarında murâbaha sözleşmesi standartlara uygun olarak uygulanıyor mu? ayrıca modern murâbaha standartlarına uymayan uygulamalar nelerdir?”sorularında özetlenmiştir. Bu çalışmada karşılaştırmalı analiz metodu izlenmiştir. Bu anlamda banka murâbahası ile ilgili geçmiş çalışmalara göz atılmış ana kitaplarda geçen âlimlerin ve fakihlerin sözlerinden de istifade edilmiştir. Ayrıca Kuveyt Türk'ün murâbaha sözleşmesi ile alakalı birtakım bilgiler toplanmış ve bunlar incelenmiştir. Ardından murâbaha sözleşmesinin bahsi geçen bankada uygulama adımları üzerine odaklanılmış ve yetkili kuruluşlar tarafından yayınlanan ve katılım bankaları açısından kabul edilen murabaha standartları ile karşılaştırılmıştır. Son olarak çalışma ile ilgili sonuçlara değinilmiştir. Kuveyt Türk'ün bazı uygulama farklılıklarla birlikte standartlara bağlı kaldığını ve bu farklılıkların yasal sebeplerden kaynaklandığını tespit edilmiştir. Çalışmanın sonucunda, bazı yasal değişikliklerin yapılması ve İslami standartlara tam uyum sağlamak için uygulamanın adımlarına yeni bir göz atma ihtiyacı bulunduğu konusunda yetkili makamlara gerekli öneriler sunulmuştur. Anahtar Kelimeleri: İslami Bankacılık, Kuveyt Türk, Katılım Bankacılığı, Murâbaha, Türkiye."
