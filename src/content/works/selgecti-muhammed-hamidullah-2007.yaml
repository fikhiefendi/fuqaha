abstract: "Muhammed Hamidullah, İslamî bilimlere bütüncül bir bakış açısıyla yaklaşan ve birçok alanda değerli eserler kaleme alan çok yönlü bir İslam âlimidir. O, 20. yüzyılda yaşamış bir İslam bilgini olarak dünyanın geçirmiş olduğu değişim ve dönüşüme tanık olmuştur. İslam Devletlerinin bu değişim ve dönüşümde kendileri olarak kalabileceklerini göstermek amacıyla onların geçmişleri itibariyle önemli bir bilgi ve deneyime sahip olduğunu ortaya koymaya çalışan Hamidullah, ömrünün son anlarına kadar bu amaç doğrultusunda çalışmalarını sürdürmüştür. Çalışmanın içeriğinin ve sistematiğinin oluşturulmasında günümüz hukuk sistematiği dikkate alınmıştır. Zaten ülkemizde son zamanlarda yapılan İslam Hukuku çalışmaları da Hamidullah'ın da benimsemiş olduğu bu esas üzerine yürümektedir. Bu çalışma, Hamidullah'ın Kamu Hukukunun en önemli bir dalı olan Anayasa Hukuku ile ilgili görüşlerinin belirlenip değerlendirmeye tabi tutulmasına yöneliktir. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş'te tezin konusu ve sınırları, yararlanılan kaynaklar ve çalışmada esas alınan metod üzerinde duruldu. Birinci bölümde Hamidullah'ın hayatı, eserleri ve hukukun kollara ayrılması hukuk sistemlerinin sistematiği ve bu sistematik içerisinde anayasa hukukunun yeri ve özelde Anayasa Hukuku ile ilgili bazı temel bilgiler verildi. Tezimizin asıl kısmı olan ikinci bölümde ise Hamidullah'ın İslam Anayasa Hukuku ile ilgili görüş ve değerlendirmeleri ele alınmış olup bunların günümüze olan yansımaları üzerinde durulmuştur."
