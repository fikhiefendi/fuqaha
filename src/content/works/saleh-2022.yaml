abstract: "Bu tez, İmam İbnü'l-Cevzi'nin“Tafsir Zad Al-Masir”adlı kitabında iki imam olan, Mücahid ve Katade arasındaki farklılıkları ve tefsir yorumlarını içeren Maide Suresi'nin ayetlerinin incelenmesi ile ilgili karşılaştırmalı bir çalışmadır. Araştırmacının araştırmasındaki yöntemi, farklı sözler arasında karşılaştırma yöntemi olmuştur. Bu konunun değeri, tefsirdeki sözler arasından doğruya en yakın olan yorumu elde etmekle ilişkilidir. Ve bu, hadisleri tartışıp delillerini genişlettikten ve her bir sözün aslının ne olduğunu inceledikten sonra gelen adımdır. Zira bu ilim ehlinin delillerine ve kaidelerine göre hakka (doğruya) daha uygundur. İşte bu tezdeki araştırmacının çalışması (İbni'l-Cevzî'nin Zad'ül-Mesir tefsirinde Mücahid ile Katade arasındaki ihtilaflı meseleleri ve Mâide Suresi'nin bir model olarak mukayeseli çalışmasıdır). Araştırmacı, İbnü'l-Cevzî'nin tefsirinde kendine özgü bir metodolojiye sahip olduğunu ve Za'dül -Masir eserinin, birden fazla sözü ve yorum farklılıklarını bir meselede zikrettiğini ve bunların tefsirinde üzerinde uzlaşılan hususlar olduğu gibi, bilhassa mücâhid ile katâde arasında tefsirde ihtilâfa düşen meseleler de bulunduğunu keşfetmiştir. Maide suresinde nüzul sebepleri ve bir kelimenin mânâlarının çokluğu da dahil olmak üzere on beş ayrı mesele bulunmaktadır ki bunların çoğu fikir ayrılığı değil farklılık, çelişki değil çeşitlilikten kaynaklanmaktadır. İbnü'l-Cevzî'de kendi yaklaşımına göre bu yorumları uzlaştırmış, bazen birini diğerine tercih etmiş, çoğu zaman da tercih etmemiştir. Araştırmacı, yaptığı inceleme sonucunda Mücahid ve Katade'nin tefsir ilmine ilgi duyan büyük müridler arasında ve bunların en ünlülerinden olduğunu ve Mücahid'in bazı hadislerde Katade'den önde olduğunu, çünkü O'na en yakın imam olduğunun sonucuna varmıştır. İmam Mücahid; İbn Abbas, Aişe, Ebu Hureyre, Abdullah bin Ömer ve diğerleri gibi sahabelerden hadisleri işitmiş ve aktarmıştır. Böylece İmam Mücahid Al- Taberi hadis mucemmasında diğerlerinden daha fazla hadis bulundurmuştur ve belki de bu hadis kitabı bundan sonra bu iki muhterem takipçinin/imamın sözlerine bir referans olmuş ve aynı zamanda Mücahid ve Katade'nin yorumunun mükemmelleştirilmesinde bir anahtar niteliğine ulaşmıştır."
