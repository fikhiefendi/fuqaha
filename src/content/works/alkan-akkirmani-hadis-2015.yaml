abstract: "Bu çalışmada ilk yedi hadisi Birgivî (ö. 981/1573) tarafından şerhedilen, Akkirmânî'nin (ö. 1174/1760) Şerhu'l-Ehâdîsi'l-Erbaîn adlı eseri özelinde hadis şerh metodu incelenmiştir. Bu eser kırk hadis şerh edebiyatının genel özelliklerini taşımaktadır. Akkirmânî, Birgivî'nin sekiz başlık altındaki yöntemiyle hadisleri şerhetmiştir. Akkirmânî, kelime ve cümlelerin anlamı ile gramer yapısı üzerinde durmuştur. Hadis metinlerini belâgat kuralları açısıyla incelemiştir. Akkirmânî, rivâyet metinlerini sıhhat açısından incelemiştir. Metin içi ve metin dışı bilgilerden yararlanmıştır. Üslup ve muhteva benzerliğini temel alarak âyet, hadis ve şiirle istişhadda bulunmuştur. Rivâyetler arası teâruzda cem' ve te'lîf yöntemini kullanmıştır. Akkirmânî, Hanefî ve Mâturîdî mezhebinin ilkelerini şerhine yansıtmıştır. Hanefî fıkıh literatürünü etkin bir şekilde kullanmıştır. Akkirmânî, sosyal hayatı ilgilendiren konulara kayıtsız kalmamıştır. Karşılaştığı meseleleri uzlaştırıcı bir anlayışla çözmeye çalışmıştır. Şerhu'l-Ehâdîsi'l-Erbaîn adlı eser, içerdiği bilgilerin yanı sıra sistematiği ve anlatım tarzı yönüyle kırk hadis edebiyatının en güzel örneklerinden biri olarak yerini almıştır."
