abstract: "Eş'ari (260-324/874-936) yılları arasında yaşamış ve Eş'ariliğin kurucusu olarak kabul edilir. Kendisi birçok eser yazmış ancak günümüzde ilmi çalışmalarda kullanılan telifleri Ehl-i Sağr, İstihsan, Makalat, Luma' ve İbane eserleridir. Bütün bu eserler Eş'ari'ye aittir. Bu eserleri Mutezileden ayrıldıktan sonra yazmıştır. İbane eseri elimizdeki şekliyle bütün içeriğiyle Eş'ari'ye ait olduğunu söylemek güçtür. Muhtemelen yazar dışından esere bazı müdahaleler olmuştur. Ancak müdahalenin boyutlarını tespit etmek mümkün değildir. Bu nedenle Eş'ari'nin fikirlerini sadece bu esere dayanarak ortaya koymak sakıncalıdır. İbane eseri Eş'arinin fikri dönemlerinin tespitinde araştırmacılar için önemli bir problem oluşturmaktadır. Tespit edebildiğimiz kadarıyla Eş'ari'nin iki fikri merhalesi olmuştur. Bunlardan birincisi Mutezililik olup sonradan bundan dönmüştür. İkincisi ise İbn Küllâb'a tabii olup Mutezile ile Ashâbu'l-Hadîs arasında orta yolu tuttuğu ve sonradan Eş'arilik olarak bilinen fikri merhalesidir. Eş'ari'nin Mutezileden ayrılışına zemin hazırlayan bir çok unsur olmakla birlikte Mutezileden ayrılmasının asıl nedeninin Eş'ari'nin kendi fikri problemlerine çözüm arayışıdır. Eş'ari'nin geçirdiği fikri merhalelerinde samimi olmadığını gösteren geçerli bir kanıt yoktur. Düşünce açısından Eş'ari ile Eş'arilerin farklı olduklarını söylemek güçtür. Çünkü Eş'ari'nin kendi görüşleri ile Bakıllani, Cüveyni gibi önde gelen Eş'arilerin görüşleri karşılaştırıldığında temel ilkeler açısından ciddi sayılabilecek bir farklılığın olmadığı görülür. Mezhebin temel ilkelerinde Eş'arilerin, tamamen Eş'ari'ye muvafakat edip onun yolundan gittikleri rahatlıkla söylenebilir."
