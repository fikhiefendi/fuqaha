abstract: "Altın Orda Devleti (1227-1502), Moğol İmparatorluğu'nun kurucusu Cengiz Han tarafından oğlu Cuci'ye verilmiş olan Doğu Avrupa topraklarında, Cuci'nin oğlu Batu Han tarafından kurulmuştur. Batu, babasının ölümü (1227) sebebiyle, dedesi Cengiz'in kendisini görevlendirdiği Batı Seferi sonrasında ele geçirdiği bölgede, İtil kıyısında başkent Saray şehrini kurmuş ve devletin temellerini atmıştır. Karadenizin kuzeyindeki bu hareketli topraklara hâkim olan Altın Orda, bölgenin eski sakinleri olan Hazar, Bulgar ve Harezmşahlardan devraldığı teknik, kültür ve medeniyet mirasını da etkili bir şekilde değerlendirmiştir. Ayrıca Altın Orda Hanlarının özellikle ticarete yönelik etkili politikaları, devleti iktisadî açıdan daha güçlü bir konuma getirmiş, bölgeden geçen İpek Yolu'nun da eskisine nazaran daha güvenli ve aktif hale gelmesini sağlamıştır. Bu sayede Altın Orda Devleti Ortaçağ'da yaklaşık üç asır boyunca doğu-batı arasında bir köprü vazifesi görmüş, neredeyse tamamı önemli pazarlar niteliğindeki şehirleri ile büyük bir ticaret merkezi haline gelmiştir."
