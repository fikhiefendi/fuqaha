abstract: "İslâm mezhepleri tarihinin temel literatürünü makâle, fırak ve milel-nihal türü eserler oluşturmaktadır. Müellifler bu eserler aracılığıyla hem kendi zamanlarındaki hem de geçmiş dönemlerindeki fırkalara dair görüşlerini belirtmişlerdir. Bunu da genellikle bir fırka şablonu üzerinden yapmışlardır. Şablonun biçimi ve içeriğine göre de farklı fırka gelenekleri ortaya çıkmıştır. Bunlardan en meşhuru Eş'arî ile Doğu Hanefî fırak geleneğidir. Sahip oldukları bilgi değeri tartışmaya açık olsa da söz konusu geleneklerdeki fırka tasnifleri, İslâm mezhepleri tarihinin en temel bilgi kaynağı konumundadır. Bu bağlamda çalışmanın konusu 15 ve 16. yüzyılda Osmanlı coğrafyasında yaşamış Osmanlı âlimlerinin müstakil olarak veya eserinde bir yer ayırarak telif ettikleri fırka tasniflerinin tespit edilmesi ve incelenmesidir. Başka bir deyişle klasik dönemdeki mezhepler tarihi literatürünün Osmanlıdaki yansıması ortaya çıkarılmaya çalışılmıştır. Buna göre ilgili yüzyılda yaşadığı tespit edilen dokuz müellif ve on üç fırka tasnifi incelenmiştir. Ele alınan on üç tasnifin hepsinin müellifine nispeti kesin değildir. Bunlardan yedi tanesi kesin, altı tanesi şüphelidir. Otantikliğin ciddi bir sorun olduğu bu dönemdeki literatürü ortaya çıkarmayı amaçlayan çalışmada, metinlerdeki fırka tasnifleri geçmişle de mukayese edilerek Osmanlı mezhepler tarihi yazıcılığı hakkında çıkarımlarda bulunulmuştur. Hem Doğu Hanefî hem Eş'arî fırak geleneğini takip eden yazıcılıkta müelliflerin en çok etkilendikleri isimler; Doğu Hanefî gelenekte Ebû Mutî' (ö. 318/930), Eş'arî gelenekte Şehristânî (ö. 548/1153) ve daha çok Âmidî (ö. 631/1233) olmuştur. Tasniflerin içeriği söz konusu olduğunda Doğu Hanefî geleneğindeki metinler daha korumacı davranarak kendilerine ulaşan metni olduğu gibi aktarma tavrını benimserken Eş'arî geleneğine tâbi müellifler yeni tasnif denemelerinde bulunmuşlardır. Türkçe fırak yazıcılığının da başladığı bu dönemde, Osmanlı âlimlerinin elinde şekillenen müstakil bir Osmanlı mezhepler tarihi yazıcılığından bahsetmek mümkündür."
