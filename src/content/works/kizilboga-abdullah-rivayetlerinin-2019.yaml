abstract: "Abdullah b. Mes'ûd, peygambere yakınlığı, zekâsı, ilmî yeteneği, Kur'an ve sünnete olan hâkimiyeti ile öne çıkan sahâbîlerden birisi olmuştur. Müslümanlığı ilk dönemlerde kabul edişi ve Hz. Peygamber'e olan yakınlığı vesilesiyle ondan birçok hadis duymuş ve rivayet etmiştir. Çalışmamız, İbn Mes'ûd rivayetlerinin Hanefî fıkhının oluşumundaki etkisini ortaya koymaya yönelik bir çalışmadır. Bu çalışmamız, üç ana bölüm ve sonuç kısımlarından oluşmaktadır: Birinci bölümde öncelikle, çerçeveyi belirlemek amacıyla tezimizin konusu, amacı ve tezin yöntemi hakkında bilgi verildi. Sonra İbn Mes'ûd'un hayatı, ilmî kişiliği ve Hanefî fıkhının oluşumundaki etkisine değinildi. İkinci bölümde, Hanefîlerin amel ettikleri ve kaynak gösterdikleri İbn Mes'ûd rivayetleri konu edildi. İki ana bölümden birincisini oluşturan bu kısımda fıkhî hükümler; ibadet, muâmelât ve ukûbat genel başlıkları atında ele alındı ve İbn Mes'ûd rivayetleri ilgili genel başlıklar içerisinde alt başlıklar halinde incelendi. Üçüncü bölümde ise, İbn Mes'ûd'dan gelen ve Hanefîlerin kaynak göstermedikleri rivayetler üzerinde duruldu. Bu bölüm de kendi içinde iki kısma ayrıldı. İlk kısımda mezheb görüşüyle uyumlu olmasıyla beraber kaynak gösterilmeyen rivayetlere yer verildi. İkinci kısımda ise mezheb görüşüyle uyuşmayan, aksi yönde fetva verilen rivayetlere yer verildi. İki ana bölümden ikincisini oluşturan bu kısımda da aynı şekilde fıkhî hükümler; ibadet, muâmelât ve ukûbat genel başlıkları atında ele alınarak İbn Mes'ûd rivayetleri ilgili genel başlıklar içerisinde alt başlıklar halinde incelendi. Sonuç bölümünde de incelenen Abdullah b. Mes'ûd rivayetlerinin Hanefî fıkhını hangi oranda etkilediği konusunda ulaşılan kanaatler zikredildi."
