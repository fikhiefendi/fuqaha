abstract: "İmam Şâfiî (ö.204/819) kendi dönemine kadar fıkhî bir yapıya da sahip olan sünnetin işlevsel yönünü genişleterek İslam hukuk ilminin ilk gelişimine ciddi katkılarda bulunmuştur. Onun bu alanda getirdiği açılım daha sonra gelen Cüveynî (ö.478/1085), Şirazî (ö.476/1083), Sem'anî (ö.489/1096) ve Gazzâlî (ö.505/1111) gibi Şâfiî usûlcülere ilham kaynağı olmuş ve onların metodolojilerinin sağlam ve sistematik bir yapıda kurulmasına zemin hazırlamıştır.İmam Şâfiî ile Şâfiî usûlcülerin Kur'an ve sünneti beyan ederken ortaya koyduğu temel ilke; nassların zahiri halleriyle anlaşılmasının gerekliliğidir. Ancak bunun gerçekleşmemesi halinde, Kitab'ı Kitap'la veya sünnetle açıklama yoluna gitmiştir. Ayrıca ictihadla yorum ilkesini de bu iki temel kaynak çerçevesinde ele almışlardır.Hem İmam Şâfiî hem de Şâfiî usûlcüler tahsis işlemini prensip olarak benimsemekle beraber, sınırlarını geniş bir alana yayarak, yani nasslar arasında bir ayrım yapmadan, Kur'an ve mütevatir sünnetin umum manasının ahad haberle hükmünün daralmasını neredeyse bu mahiyete uygun olan her konuda uygulamışlardır.İmam Şâfiî ile Şâfiî usûlcülerin nesh işlemini temel bir ilke olarak benimsedikleri ve nesh neticesinde bazı meselelere dair hükümlerin, yeni bir hükme dönüşmesini hukukta uyguladıkları ortaya çıkmıştır.İmam Şâfiî'nin haber-i vahidin delil olma yönüne akli ve nakli deliller getirmesi ahad haberin gücünü esas alan bir anlayışa sahip olduğunu göstermektedir. Zira o, er-Risale'de bu konuya ilişkin iki bölüm ayırarak önemini vurgulamaya çalışmıştır. Şâfiî usûlcülerin özellikle bu konuda imamlarının yolunu takip ettiklerini ve ravinin şartlarına ilişkin bazı meseleler dışında imamların prensiplerine uygun hareket ettikleri söylenebilir."
