abstract: "Zekât, vergi ve negatif gelir vergisi fonksiyonları, ilkeleri ve unsurları itibariyle birbirleriyle bağlantılı kavramlardır. Ayrıca fakir ve muhtaçların sağlık, eğitim, sosyal güvenlik gibi hizmetlerinin büyük bir kısmı hem zekâtın hem de negatif gelir vergisinin harcama kalemleri arasında yer almaktadır. Çalışmamızda bu konuların, klasik ve güncel kaynaklardan yararlanılarak yorumlanması amaçlanmıştır. Zekât ve negatif gelir vergisinin çağdaş iktisadi sistemlerde bulunan gelir dağılımındaki eşitsizlik ve yoksullukla mücadelede oluşan boşluğu, adaletli gelir dağılımı ve yoksullukla mücadele problemine karşı sağladığı katkıya vurgu yapılmıştır. Bu çerçevede zekât ve negatif gelir vergisinin, temel prensipler ve ilkeler bağlamında benzer ve farklı yönleri üzerinde durulmuştur. Zekâtın, teşrî sürecinden başlayarak Emevi ve Abbasi dönemlerine kadar devlet eliyle toplanıp ayette belirtilen sarf yerlerine dağıtılan önemli gelir kaynaklarından biri olduğu bilinen bir husustur. Ancak Hz. Osman'ın hilafeti döneminde zekât kapsamında olan malların zahirî ve batınî olarak ayrılması, batınî malların zekâtının mükelleflere bırakılması, zekâtın daha sonraki dönemlerde yavaş yavaş devlet elinden çıkarak, mükelleflerin yaptığı gönüllü malî bir yardıma dönüşmesi açısından kırılma noktası olmuştur. Bu durum mükelleflerin zekâtlarını dağıtıp dağıtmama hususunda özgürce hareket etmesine zemin hazırlamıştır. Sonraki dönemlerde de zekâtın dağıtımı günümüzde olduğu gibi tamamen mükellefin irade ve vicdanına bırakılmıştır. Bu çalışmada ilk dönemlerde olduğu gibi ülkemizde de zekâtın kurumsallaşmasının önemine vurgu yapılarak yeni bir model önerisinde bulunulmuştur. Önerilen bu model ile sistemli bir organizasyon ile var olan zekât potansiyelinden daha geniş kitlelerin pay almasının sağlanması hedeflenmektedir. Böylelikle zekât zengin ve fakir arasındaki gelir farkının azalmasında ve yoksullukla mücadelede daha etkin bir rol üstlenmiş olacaktır. Ayrıca zekâtın devlet tarafından organize edilmesi durumunda harcama kalemlerinden olan âmil, müellefe-i kulûb, ibni sebil ve fî sebilillâh sınıflarının da dağıtılan zekâttan pay alma imkânı sağlanmış olacaktır. Anahtar Kelimeler: Zekât, Vergi, Negatif Gelir Vergisi, Kurumsallaşma, Sosyal Güvenlik."
