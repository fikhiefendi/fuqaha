abstract: "Hâkimlik bütün hukuk sistemlerinde önemli ve dikkate değer bir yere sahiptir. İnsanların tarihin başlangıcından beri yaşadıkları ortak kültürün bir parçası da uyuşmazlıklardır. Dolayısıyla insanlık bu uyuşmazlıkları çözecek hâkimlere ihtiyaç duymuştur. Bizim tezimizde ise tarihin akışı içinde ve özellikle de İslam ve Osmanlı Hukuku çerçevesinde hâkimlerin gelişimleri ve bu gelişim içinde hâkim olmak için aranan niteliklerin değişimi izlenecektir. İslam hukukunda ilk hâkim Hz. Muhammed'dir. İslam ve Osmanlı hukukunda hâkimlerde olması istenen niteliklere bakıldığında ise Hz. Peygamber bu konuda müelliflere örnek olmuştur. İslam hukukuna göre iyi bir hâkimde bulunması gereken nitelikler, Hz. Peygamber'de bulunan niteliklerdir. Kuşkusuz hiçbir kimsenin Hz. Peygamber'in bütün niteliklerine sahip olması düşünülemez. Fakat hâkimler veya hâkim olmayı düşünenler Hz. Peygamber'in bu niteliklerini öğrenmeli ve hâkimlik yaparken de bu davranışları örnek almalıdırlar. Hâkimlerde bulunması gereken nitelikler bakımından İslam hukukunda müellifler arasında bazı farklılıklara rastlanmaktadır. Bu durum oldukça normaldir. İslam hukukundaki dört temel mezhep hâkimlerde bulunması gereken nitelikler açısından birbirinden farklı içtihatlara sahiptirler. Osmanlı hukukundaki uygulamaya bakarsak, bahsedilen dört mezhepten Hanefi okulunun görüşlerini benimseyen Osmanlı devleti de bu okulun görüşlerine bağlı kalmış ve Hanefi mezhebi bakımından hâkimlerde aranan nitelikleri benimsemiş ve hâkimlerin atanmasında da bu görüşlere uymuştur."
