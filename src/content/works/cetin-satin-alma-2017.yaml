abstract: "Tüketici piyasası gün geçtikçe talepler ile şekillenmekte ve bu doğrultuda yeni pazarlar oluşturulmaktadır. Üreticiler, tüketici eğilimleri ile belirlenen bu durum karşısında ürünleri kişisel beklentiler ve ihtiyaçlar ön planda olacak şekilde arz etmektedir. Finans sektörü içerisinde yer alan katılım bankacılığı ürün ve hizmetleri içinde aynı durum söz konusudur. Tüketici eğilimleri bu piyasada yer alan satın alma davranışları ile paralel olup nihai sonuç ve karar aşamasında etkilidir.Bu çalışmanın amacı, satın alma davranışlarını etkileyen faktörlerin tüketici tercihleri noktasında etki durumunun katılım bankacılığı ürünlerine olan yansımasını araştırmaktır. Müşterilerin katılım bankacılığını tercih sebepleri ve onları bu duruma yönlendiren karar mekanizmalarını incelemektir. Bu doğrultuda 01-28 Haziran 2017 tarihleri arasında Karaman ilinde faaliyet gösteren 3 büyük katılım bankası Türkiye Finans, Kuveytturk ve Albarakatürk katılım bankalarının toplam ortalama 30.000 müşterisi içerisinden müşteri olma potansiyeli yüksek 258 kişi üzerinde anket çalışması yapılmıştır. Kota örneklem yöntemi ile tüketicilerin katılım bankacılığı ürünlerine olan talep durumu incelenmiştir. SPSS istatistik program kullanılarak veriler analiz edilmiştir. Bireylerin kişisel, ekonomik, psikolojik, sosyal ve kültürel eğilimleri ile bunların satın alma biçimlerine etkisi ölçülmüştür. Bunun sonucunda veriler karşılaştırılmalı olarak incelenmiştir.Araştırma sonucunda genel olarak müşteri ile yakın ilişki kurulması müşterinin psikolojik olarak satın alma tercihlerine etki eden önemli faktörler arasında yer aldığı sonucunu göstermektedir. Bu noktada banka personelinin müşteriye karşı ilgili olması, güvenilir bilgi verilmesi bu kategoride yer almaktadır. Katılım bankacılığı şubelerine ulaşımın kolay olması, internet bankacılığı üzerinden işlem kolaylığı ve masraf alınmaması genel anlamda katılım bankacılığı ürünlerine olan talebi pozitif yönlü etkilediği gözlemlenmiştir. Bireysel olarak tüketici karar mekanizmasında olumlu etki yapan faktörlerin dürüst ve açık bilgi verilmesi talepleri yukarı yönlü çekmekte olduğu sonucuna ulaşılmıştır."
