abstract: "Zekât İslâm'ın en önemli ibadetlerinden birisidir. Ancak zekâtın mali bir boyutu olduğu için sadece ibadet alanı ile bağlantılı bir konu olmayıp ekonomik göstergeler ışığında değişkenlik arz eden bir durumu da söz konusudur. Klasik fıkıh kitaplarında sadece yazıldığı dönem itibarı ile mevcut olan ekonomik değerlerin zekatından bahsedilmiştir. Ancak ekonomi ve iktisat canlı bir organizma gibidir. Dolayısıyla devamlı gelişim ve değişim göstermektedir. Bu değişim neticesinde bazı dönemlerde, önceden varlığı bulunmayan birtakım ekonomik değerler ortaya çıkmaktadır. İslâm hukuku doğası gereği bu ekonomik değerler ile alakalı hüküm vermek zorundadır. Fikri mülkiyet hakları bu bahsettiğimiz değerlerden olup ilk dönem klasik eserlerde ekonomik boyutu itibarıyla zikredilmemiştir. Ancak sonraki dönem İslâm hukukçuları bu haklarla alakalı değerlendirmelerde bulunmuşlar ve bu hakları ekonomik olarak olması gereken yere konumlandırmışlardır. Konunun hukuk gündemine yeni girmiş olması, zekâtı ile alakalı değerlendirmelerinde daha geç dönemde yapılmasına sebep olmuştur. Tezimizde evvela fikri mülkiyet haklarını İslâm hukuku ve modern hukuk açısından değerlendirdik. Sonrasında İslâm hukuku açısından fikri mülkiyet haklarının konumunu belirledik. Konu ile oldukça yakın bağlantısı olması itibarıyla hak, mal ve menfaat kavramlarını inceleyip fikri mülkiyet haklarını bu çerçevede ele aldık. Sonrasında çağdaş İslâm hukukçularının fikri mülkiyet haklarının zekâtı ile alakalı söylemlerini değerlendirip, en son olarak bu hakların ticaret malı olarak kullanılması durumunda ticaret malı gibi zekâta tabi olacağını belirttik."
