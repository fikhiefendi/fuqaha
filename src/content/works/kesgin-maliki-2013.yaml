abstract: "Son dönemlerde Mağrib kütüphanelerinde yazma olarak bulunan nevâzil telifleri üzerine çalışmaların yoğunlaştığı göze çarpmaktadır. Son olarak henüz yakın zamanda bir doktora çalışması olarak tahkik edilip fıkıh alanına kazandırılmış olan Ebu'l-Velîd el-Kurtubî'nin (ö. 606) el-Mufîd li'l-hükkâm fîmâ yu'radu lehum min nevâzili'l-ahkâm isimli nevâzil eseri bunun en güzel göstergesidir. Bu tür çalışmalara ilginin artmasında fıkhın hayattan kopuk olduğu iddialarının payı büyüktür. Özellikle fıkhu'n-nevâzil konu başlığının güncel fıkhî meselelere tekabül eden bir muhtevaya sahip olması araştırmacıları, klasik dönemde kaleme alınan nevâzil teliflerini de gün yüzüne çıkarmaya yönlendirmiştir. Bu çerçevede son zamanlarda Mağrib ve Endülüs'e dair nevâzil telifleri tahkik edilerek neşredilmeye başlanmıştır. Bu durum fıkhın tatbik sahasına ait verilerin açığa çıkarılması ve hükümlerin meselelere nasıl tatbik edildiğinin belirlenmesi bakımından oldukça önemli bir gelişmedir. Ancak gördüğümüz kadarıyla bu telifler üzerinde yapılan araştırmalar ağırlıklı olarak tahkik çalışmalarıdır. Tahkik çalışmalarının kütüphane raflarında yok olmaya mahkum edilmiş eserlerin gün yüzüne çıkarılmaları bakımından zaruri derecede öneme sahip olduğu inkar edilemez. Fakat bu tür teliflerin tahlil edilerek fıkıh sahası bakımından değerleri de ayrıca önemi olan bir mevzudur. İşte esasen Endülüs nevâzil telif geleneğinin tahliline dayalı olan bu çalışmamız, söz konusu teliflerin hukuki, tarihi ve toplumsal değeri temasını işlemeye çalışmaktadır. Bu bağlamda genelde fıkıh alanında özelde ise Mâlikî Endülüs ekolü içinde ürünlerini vermiş olan bu geleneğin, bulunduğu bölgelerde nasıl bir işlevselliğe sahip olduğu araştırılmaktadır. Endülüs fukahasının söz konusu bu edebiyattan Endülüs fıkıh/hukuk sistemi bağlamında nasıl faydalandıkları ifade edilmeye çalışılarak fetvâ verme metodları nevâzil eserlerindeki örnekler üzerinden ortaya koyulmaya çalışılacaktır. Bu durum fıkhın tatbik sahasına ait verilerin açığa çıkarılması ve hükümlerin meselelere nasıl tatbik edildiğinin belirlenmesi bakımından oldukça önemlidir. Anahtar Kelimeler: Mâlikî, Endülüs, Nevâzil, Fıkıh"
