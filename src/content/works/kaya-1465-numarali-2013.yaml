abstract: "Şer'iyye sicilleri tarih alanında yapılan çalışmalarda birinci elden kaynaklardır. Özellikle incelenen yörenin ve dönemin aile yapısı, toplum yapısı, dinî hayatı, ekonomik hayatı ve insanlar arası ilişkileri incelerken bizlere çok önemli veriler sunmaktadır. Bu çalışmada, 1465 numaralı şer'iye sicil defterindeki kayıtların ele alınmasıyla, o dönemin önemli kazâ merkezlerinden Mesudiye'nin sosyal-kültürel ve ekonomik hayatına dair bilgilere ulaşılmıştır. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmamız hakkında kısa bir bilgi verdikten sonra Osmanlı şer'iyye mahkemeleri, bu mahkemelerdeki görevliler ile şer'iyye sicilleri ve şer'iyye sicillerinin içeriğinden bahsedilmiştir.Birinci bölümde sicilden elde edilen veriler ışığında H.1323-1325 tarihleri arasında Mesudiye'nin aile yapısı, toplum yapısı, Mesudiye'nin fizikî ve mimarî yapısı, Müslim-gayr-i Müslim münasebetleri, halkın kullandığı eşyalar, halkın kullandığı ünvanlar, vakıf müessesesi, meslekler, halkın geçim kaynakları, miras işlemleri konuları ele alınmıştır.İkinci bölümde ise 1465 numaralı Mesudiye şer'iyye sicilinin transkripsiyonu verilmiştir."
