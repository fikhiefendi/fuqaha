abstract: "Faizsiz bankacılık ve İslam ekonomisi ilkeleri dahilinde faaliyet gösteren katılım bankaları, faaliyete başladıkları 1985 yılından günümüze kadar ki süreçte birçok aşamadan geçerek, finans sisteminin önemli aktörlerinden biri haline gelmişlerdir. Katılım bankaları faiz hassasiyeti bulunan mevduat sahiplerinden topladıkları fonları faizsiz bankacılık faaliyetlerinde kullanarak elde edilen kar ya da zararın paylaşılması esası ile hareket etmektedirler. Katılım bankaları dış ticaretin finansmanı alanında da önemli bir role sahiptir. Katılım bankaları dış ticaretin finansmanında mevcut klasik fon kullandırma yöntemlerini kullanabiliyorken, dış ticarete özgü ürünlerini de müşterilerinin hizmetine sunmaktadır. Katılım bankalarında dış ticaretin finansmanında kullanılan ürünler arasında Türk Eximbank uygulamaları da yer almaktadır. 2014 yılına kadar katılım bankalarından bir kısmı Türk Eximbank'a hitaben müşterilerine verdikleri teminat mektubu ile Türk Eximbank uygulamalarına ulaşım sağlıyorken, bazı katılım bankaları danışma kurullarının onay vermemesi nedeni ile Türk Eximbank kaynaklarına erişimde kullanılmak üzere müşterilerine teminat mektubu vermiyorlar ve Türk Eximbank ile ilgili bir uygulama sunmuyorlardı. 2014 yılında Türk Eximbank Sevk Öncesi İhracat Kredisi programı Faizsiz Finans Standartları dahilinde düzenlenerek, katılım bankalarının aracılığı ile ihracatçı müşterilerin kullanımına sunulmaya başlanmıştır. Bu çalışmada Türk Eximbank uygulamalarının katılım bankalarındaki etkinliği değerlendirilmiştir. Mevcut kullanımda olan ürünler konvansiyonel bankalarla karşılaştırılmış, Faizsiz Finans Standartları dahilinde değerlendirilmiş, finansal açıdan büyüme rakamları ortaya konulmuş ve kullanımda olmayan diğer Türk Eximbank ürünlerinin de katılım bankalarında uygulanabilirliği değerlendirilmiştir."
