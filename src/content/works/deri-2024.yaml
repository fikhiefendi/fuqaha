abstract: "Bu araştırma, Abdürrezzak el-Kâşânî'nin (736/ 1336)“Hakāiku't-Te'vîl Fî Dekāiki't-Tenzîl”adlı eserindeki metodunu incelemektedir. Tefsir ilminin ve tasavvufun önde gelen âlimlerinden biri olan Kâşânî, İlhanlı Devleti döneminde, VII. yüzyılın ikinci yarısı ile VIII. yüzyılın ilk yarısı arasında yaşamıştır. Devlete yakın olup, bazı eserlerini dönemin veziri Gıyâseddin Muhammed el-Hemzânî'nin önerisiyle yazmış, ilmî müktesebatı nedeniyle âlimlerin ilgisini çekmiştir. Tefsir ve hadis ilimlerini tahsil ettikten sonra aradığı derinliği bulamayan Kâşânî, tasavvufu anlamaya yönelmiş ve bu amaçla dönemin tasavvuf ve irfan âlimlerinin izinden giderek Bağdat'a seyahat etmiştir. Kâşânî'nin,“Teʾvîlü'l-Kurʾân”adlı eseri işârî tefsir alanında önemli bir kitap ve kaynak sayabileceğimiz çok ehemmiyetli bir eser olarak bizlere bırakmıştır. Ancak müellif bu eserde işarî manalara odaklandığı için eserin metodu ve tefsirle ilgisi geniş çapta tartışılmıştır. Ancak Kâşânî'nin“Teʾvîlü'l-Kurʾân”adlı eseri“Hakāiku't-Te'vîl”adlı eserin bir özeti sayılabilir. Bununla birlikte“Hakāiku't-Te'vîl”, hem zahir hem batın manaları bir arada içermesine rağmen“Teʾvîlü'l-Kurʾân”eseri kadar tanınmamıştır. Bu nedenle Kâşânî'nin“Hakāiku't-Te'vîl fî Dekāiki't-Tenzîl”adlı eserinde takip ettiği metodu alana tanıtmak ehemmiyet arz etmektedir. Bu çalışma, Kâşânî'nin zahir ve batın tefsirleri nasıl birleştirdiğini ve Kâşânî'de asıl olanı, takip ettiği metodu, dil, gramer, belagat, tefsir ve te'vil yaklaşımını, tefsirinin rivayet veya dirayet esaslı olup olmadığını ve Kur'an ilimlerinden nasıl yararlandığını açıklamayı amaçlamaktadır. Bu nedenle Kâşânî'nin metodunu incelemek için tümevarım ve analitik yöntemi benimsedik. Araştırmamızın birinci bölümünde, Kâşânî'nin yaşadığı dönemin siyasi ve ilmî gelişmeleri inceledik; ardından yazarın hayatını, hocalarını, talebelerini, kitaplarını ve“Hakāiku't-Te'vîl”adlı eserin Kâşânîye aidiyetini, biyografi ve tabakat alimlerinin görüşlerine dayanarak tespit ettik. İkinci bölümde, Kâşânî'nin beş bölüme ayırdığı tefsirinde her bir ilmi tarihsel gelişimi içerisinde alanda yazılmış en önemli eserler eşiğinde inceledik. Bu minvalde“Hakāiku't-Te'vîl”'den örnekler vererek tespitlerimizi temellendirmeye çalıştık. Üçüncü bölümde ise, yazarın Ulûmü'l-Kur'ân'da kullandığı metodu inceledik. Bu bağlamda müfessirin ihtiyaç duyduğu ve müellifin geniş bir şekilde değindiği ilimleri zikrettik. Neticede Kâşânî'nin tefsirde asıl yaklaşımın zahiri anlam olduğu, batınî anlamı ise ikincil ve ilahi bir ilham olarak kabul ettiği; zahir bölümünde Zemahşerî ile aynı görüşte olup onun mutezilî fikirlerine muhalefet ettiği sonucuna vardık."
