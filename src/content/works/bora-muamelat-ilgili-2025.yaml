abstract: "Bu çalışma, Mâlikî fıkhının önde gelen âlimlerinden İmâm Karâfî'nin el-Furûk adlı eserinde yer alan muâmelât ile ilgili kâideleri tespit etmek amacıyla hazırlandı. Çalışmamız literatür taraması eksenli bir çalışma olup, öznel yargı ve değerlendirmelere oldukça az yer verilerek kaleme alındı. Bu çalışma giriş, iki bölüm ve sonuçtan ibarettir. Çalışmanın giriş kısmında araştırmanın konusu, araştırmanın amacı, araştırmanın yöntemi ve Şehâbeddîn el-Karâfî'nin hayatı ele alındı. Birinci bölümde kâide kavramının kelime anlamı âyetlerdeki kullanım biçimleri de dikkate alınarak özet bir şekilde açıklandı. Ardından âlimlerin kâide kavramının terim anlamına ilişkin yaptıkları tanımlara yer verildi. Terim anlamından hemen sonra kâide ile ilgili kavramlar kısaca açıklandı. Kâidelerin tarihsel gelişimi ilk oluşum döneminden günümüze kadar olan gelişimi yy. bağlamında incelendi ve bu dönemlerde yazılan eserlere yer verildi. Kâidelerin özellikleri, kâidelerin sınıflandırılması ve kâidelerin önemi kısaca açıklandı. Küllî kâideler literatürü mezheblere göre incelendi. İkinci bölümde ise bu çalışmanın asıl konusunu oluşturan“el-Furûk”adlı eserin genel tanıtımı yapıldı. Bununla birlikte bu eser üzerinde yapılan çalışmalar açıklandı. Eserin tanıtımından sonra muâmelâtla (akidler ve münâkehât) ilgili kâideler tek tek ele alınıp gerek Karâfî'nin görüşleri gerek eserdeki atıf yapılan kişilerin görüşleri incelendi."
