abstract: "?Mâ Cerâ Bihi'l-`Amel? Endülüs Mâlikî coğrafyasında gelişmiş bir tercih yöntemidir. Mâlikî hukuk düşüncesinin temelleri arasında yer alan amel kavramıyla bağlantılı olarak ortaya çıkan kavram zamanla temel bir yöntem haline gelmiştir. İlgili kavramın içeriği ve işleyişi hakkında yeterli oranda çalışma bulunmamaktadır.Bu çalışmanın temel hareket noktası Maliki hukuk düşüncesi içerisinde ilgili kavramın ne anlama geldiğinin tespit edilmeye çalışılmasıdır. Bu doğrultuda ulaşılmak istenilen hedefler şu şekilde sıralanabilir:a.ilgili kavram tarihsel bağlamda nasıl oluştuğu.b.Kavramın mezhebi hukuk düşüncesi ile benzerliği.c.Kavramın işlevselliği.Çalışma yapılırken kavramla ilgili literatür taramasına ek olarak, gerek ortaya çıkışı ve gerekse de işleme konulması bakımından kavramın ilgili olduğu farklı kaynaklar da araştırmaya dahil edilmiştir. Buna ek olarak konunun teorik kısmı yanın da daha iyi anlaşılıp anlatılabilmesi adına Endülüs Mâlikî hukuk geleneği için oldukça önemli olan el-Mi`yâru'l-Mu`rib adlı eserden de örnekler sunulmaya çalışılmıştır.Araştırma sonucunda ilgili kavramın kavram olarak ortaya çıktığı dördüncü asırdan daha önce zihni ve fiili olarak var olduğu, mezhebin genel karakteristlik özelliğine uygunluk arz ettiği, çıkış noktasından daha fazla yerde işlevsel olduğu ve hukuk tarihi açısından hukuksal kaosun oluşmasını engellemek adına yöresel etmenlerden yararlanarak bir birlikteliğin sağlanmış olduğu sonucuna ulaşılmıştır. İlgili bulgularla hukuki alanda topluma hızlı bir adaptasyonun olduğu da anlaşılmıştır."
