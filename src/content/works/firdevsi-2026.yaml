abstract: "Özet Bu çalışma, İslam hukuk usulünün temel meselelerinden biri olan ve ikincil bir teşrî kaynağı olarak kabul edilen“istihsan”kavramını ele almaktadır. Araştırma, Alâüddîn es-Semerkandî'nin Tuhfetü'l-Fukahâ adlı eserinde istihsana başvurulan meseleleri sistematik biçimde derleyip incelemeyi amaçlamaktadır. Araştırmacı, müellifin istihsan ile delil getirdiği bütün meseleleri bir araya getirerek istihsan türlerini ve dayandığı delilleri tahlil etmektedir. Çalışmada ayrıca istihsan ile kıyas arasındaki ilişki mercek altına alınmakta; müellifin kıyastan istihsana ya da istihsandan kıyasa geçişinin ardındaki gerekçeler aydınlatılmakta ve istihsan ile istidlal yöntemi çok yönlü biçimde ortaya konulmaktadır. Buna ek olarak, müellifin hayatı, ilmî birikimi ve içinde yetiştiği entelektüel ve toplumsal çevre hakkında özlü bilgi sunulmaktadır. Bu çalışma, Tuhfetü'l-Fukahâ özelinde istihsana odaklanan ilk akademik araştırma niteliğini taşımakta olup İslam hukukunun kolaylaştırıcı boyutunu ve çağımızdaki uygulanabilirliğini gözler önüne sermek açısından özgün bir katkı sunmaktadır. Bunun yanı sıra araştırmacılara, istihsan delilini ve fıkhî sonuçlarını kavramayı kolaylaştıracak somut ve uygulamalı örnekler sağlamaktadır. Tuhfetü'l-Fukahâ'nın şerhi mahiyetindeki Kâsânî'ye ait Bedâiu's-Sanâî'nin şöhret bakımından asıl eserin önüne geçmiş olmasına rağmen, Tuhfetü'l-Fukahâ Hanefî fıkhında köklü ve belirleyici bir konuma sahiptir; bu durum söz konusu kıymetli eserin akademik araştırmalara konu edilmesini zorunlu kılmıştır. Çalışmada aynı zamanda bu alanda daha önce yapılmış herhangi bir araştırmanın bulunmaması ve müellifin pek çok meselede istihsanın gerekçesini (vechi) açıkça belirtmemesi gibi metodolojik güçlüklere de değinilmektedir. Çalışma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş kısmında müellifin biyografisi ve ilmî hizmetleri ele alınmaktadır. Birinci bölüm istihsanın teorik temellerine, ikinci bölüm meselelerin uygulamalı incelenmesine, üçüncü bölüm ise müellifin izlediği yönteme ayrılmıştır. Sonuç kısmında ise temel bulgular ve öneriler bir araya getirilmiştir. Çalışmada bilimsel verilerin toplanmasında tümevarım (istikrâî) yöntemi, terimlerin tanımlanmasında betimleyici (vasfî) yöntem ve istihsan vecihlerinin ile delillerinin ortaya konulmasında ise istinbatî (analitik/çıkarımsal) yöntem kullanılmıştır."
