abstract: "Osmanlı tarihinde önemli bir yere sahip olan şer'iyye sicilleri, yerel tarihin incelenmesinde büyük önem arz etmektedir. Sicil defterleri, Osmanlı döneminin mahalli hayatına dair siyasi, sosyal, kültürel ve ekonomik bilgilerini tarihlendirdiği ve bizzat kadılar ve naipler tarafından tutulduğu için birinci elden kaynaklar arasında sayılmaktadır. Gaziantep şehrinin yerel tarih çalışmalarına katkıda bulunmak amacıyla Hicri 1012-1014/Miladi 1603-1605 yıllarını kapsayan 10 Numaralı Gaziantep Şer'iyye Sicili transkrip edilerek değerlendirilmiştir. Bu defter toplam 204 sayfadan oluşmakta ve bu çalışma ise defterin ilk 3-101 sayfasını kapsamaktadır. Çalışmada Antep şehrinin siyasi, sosyal, kültürel ve ekonomik yapısına ışık tutan 792 mahkeme kaydı bulunmaktadır. Transkrip edilen mahkeme kayıtlarında okuyucuya kolaylık sağlamak amacıyla her kayıt öncesinde konu başlığı ve mahkemeye konu olan kaydın özeti verilmiştir. Ayrıca araştırmacılara kolaylık sağlamak amacıyla da dördüncü bölümün sonuna konu ve belgede bulunan sayı adedi ile birlikte konu başlıkları ve konuyla alakalı sayfa/hüküm numaraları iki ayrı tablo şeklinde sunulmuştur."
