abstract: "İslam Hukuku Doktrininde zaten mevcut olan kadının aile birliğini sona erdirme yollarını, Klasik İslam Hukuku Kaynaklarıyla Günümüz İslam Hukuku Alimleri'nin konuyla ilgili çalışmalarını da dikkate alarak bir bütün halinde ortaya koymaya çalıştık. Nitekim aile birliğinin sona erdirilmesi hususundaki mevcut meselelerin birçoğunun zikredildiği böyle bir çalışma, ilerde yapılasını temenni ettiğimiz teferruatlı araştırmalar için Fukaha'nın birçoğunun görüşünün zikredilmeye çalışılması itibariyle temel teşkil etme niyetiyle hazırlanmıştır. Bu çalışmada İslam Hukuku Temel Kaynaklarında zaten mevcut olan kadının aile birliğini sona erdirme yollarının çeşitliliğine vurgu yapılmıştır. Ayrıca çalışmamızda İslam Hukuku Doktrininde bu hususun ne kadar detaylı ve çok yönlü ele alındığını ortaya koymaya çalıştık. Çalışmamızda boşanma çeşitleri, boşanma prosedürü ve neticeleriyle ilgili görüşlerin yer aldığı klasik fıkıh kaynakları, bunların delillerinin zikredildiği tefsir ve hadis kaynakları, bunların şerhleri, ayrıca günümüz fıkıh eserleri dokümantasyon tekniği kullanılarak karşılaştırmalı olarak ele alınmıştır. Sonuç olarak çalışmamızda, günümüz hukuk sistemlerinin mevcudiyeti dikkate alınarak aile birliğinin sona erdirilmesi sırasında karşımıza çıkan güncel problemler için sunulabilecek mevcut çözüm önerileri incelenerek, tercihe şayan görüşleri günümüz toplumunu dikkate alarak belirlemeye çalıştık."
