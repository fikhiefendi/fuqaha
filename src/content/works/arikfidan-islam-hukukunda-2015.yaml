abstract: "Bu araştırmada İslâm'da kadının korunmasına yönelik tedbirler incelenmiştir. Çünkü geçmişten günümüze kadar var olan her medeniyette kadın, hayatı boyunca bir çok olumsuz durumla karşı karşıya kalmış hattı bazı dönemlerde bilindiği üzere yaşam hakkı dahi elinden alınmıştır. İslâm'ın gelmesiyle beraber İslâm'ın insana verdiği değer bağlamında kadının değeri ortaya çıkmıştır. Kadının değerinin korunmasına yönelik bir çok tedbir dini gereklilik olarak karşımıza çıkmıştır. Bu araştırmada sadece kadının evlilik kurumunda değil, çocukluğundan başlayarak evlilik öncesinde, evliliği esnasında, boşanma aşamasında, boşandıktan sonra, sosyal, ekonomik, siyasal ve aile hayatında ve fizyolojik olarak korunmasına yönelik tedbirler sırası ile incelenmiştir. Bu tedbirlerin arasında mehir, nafaka, evlilikte kızın rızasının alınması, iddet, mesken, eğitim, miras; boşanma çeşitlerinden tefviz, muhalea, fesih gibi unsurlar sayılabilir."
