abstract: "Barınma ihtiyacı insanın en temel ihtiyaçlarından biridir. Toplumlar eskiden beri bu ihtiyacını gidermek için satış sözleşmesinin yanı sıra kira sözleşmesine de başvurmuşlardır. Bu sebeple konut kira sözleşmesi, diğer hukuk sistemlerinde olduğu gibi hem İslam hukukunda hem de 6098 sayılı Türk Borçlar Kanunu'nda incelemeye konu olmuştur. Ancak günümüzde şehirleşmenin artması, çekirdek aile yapısının yaygınlaşması ve ekonomik sebeplerden dolayı barınma ihtiyacı ve konut sıkıntısı toplumsal bir sorun haline dönüşmüştür. Bu durum kiracı ile kiraya veren arasında birçok soruna sebep olmaktadır. Ortaya çıkan bu sorunların temelinde ise kira sözleşmesinin, tarafların hak ve sorumluluklarını net bir şekilde ortaya koyacak şekilde düzenlenmemesi yatmaktadır. Dolayısıyla araştırmamızın temel hedefi de konut kira sözleşmesinin, taraflara tanıdığı haklar ve yüklediği sorumlulukları tahlil edip İslam hukuku ile 6098 sayılı Türk Borçlar Kanunu hükümleri bakımından mukayese etmektir. Bu doğrultuda çalışmamızda kira sözleşmesine dair genel bilgilere yer verilip konut kira sözleşmesi sürecinde ve sona ermesi durumunda tarafların elde ettiği haklar ve yüklendiği sorumluluklar incelenmiştir."
