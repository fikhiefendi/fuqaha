abstract: "Bu çalışmanın temel konusu Ebû Hanîfe Müsnedleri ve bu Müsned'lerin çoğunu cem' eden Ebü'l-Müeyyed el-Hârizmî(ö. 655/1258)'nin Câmiu'l-mesânîd adlı eseridir. Ebû Hanîfe Müsnedleri'ni bir araya getiren en tanınmış eser olarak Câmiu'l-mesânîd, yazıldığı dönemden itibaren âlimler arasında hüsnü kabul görmüş ve sonraki nesillere intikal ettirilmiştir. Eserin müellifi Hârizmî'nin de yetkin bir Hanefi âlim olması esere ayrı bir değer katmıştır. Çalışma üç bölümden oluşmakta olup ilk bölümde Ebû Hanîfe ve Hârizmî'nin hayatları ve ilmî kişilikleri üzerinde durulmuştur. İkinci bölümde Ebû Hanîfe Müsnedleri müellifleriyle beraber incelenmiş ve bu Müsned'ler üzerine yapılan çalışmalar ele alınmıştır. Üçüncü bölümde Câmiu'l-mesânîd incelenmiş, Hârizmî'nin bu eseri oluştururken nasıl bir yöntem benimsediği ve eserin ilmi niteliği değerlendirilmiştir. Çalışmada ilgili kaynaklar taranmış ve yer yer karşılaştırmalar yapılmıştır. Sonuçta Ebû Hanîfe Müsnedleri ve Câmiu'l-mesânîd hakkında genel bir değerlendirme yapılmıştır."
