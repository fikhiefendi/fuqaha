abstract: "Osmanlı mahkeme kayıtları olan şer'iye sicilleri bölgesel ve şehir araştırmaları tarihinde son derece önemli bir yer tutmaktadır. Bu siciller kayıt altına alındığı yerin iktisâdi içtimâi siyâsi ve idâri yapısı hakkında önemli bilgiler ihtiva eden resmi kayıtlar olduğu gibi içerisinde yer alan tereke defterleri de resmi nitelik taşıyan devlet arşivleridir. Tereke defterleri ölen kişilerin toplumsal konumlarını, demografik yapılarını, medeni hallerini, aile yapılarını, sahip oldukları her türlü menkul, gayrİmenkul mallara ait önemli bilgiler sunmaktadır. Çalışma konumuz olan 152 numaralı Edirne Şer'iye sicili de Edirne'nin bölgesel, şehirsel, sosyal, ekonomik, kültürel yapısını bizlere ulaştıran önemli bir kaynaktır. Hicri 1166-1169, Miladi 1753-1756 yılları arası tarihleri kapsayan bu defter 96 sayfa 172 hükümden oluşmaktadır. Defter Edirne şehrinin mahallelerinin sosyal yapısını, ekonomik faaliyetlerini, bu dönemde kullanılan unvân ve lakapları, dini inanışları yine siyasi, idari, demografik yapı vb. birçok yapılarına ışık tutan bilgiler içermektedir. Dört bölümden oluşan tezin birinci bölümünde genel hatlarıyla kadılık kurumu Şer'iye sicili ve Şer'iye mahkemeleri hakkında bilgiler verilip özelliklerinden bahsedilmiştir. İkinci bölümde Edirne tarihi, Edirne'nin coğrafi, sosyal ve ekonomik durumu hakkında bilgiler verilmiştir. Üçüncü bölümde değerlendirmenin yanı sıra millet sistemi, idari birimler ve sosyal hayat hakkında bilgiler verilip belgeler özetlenmiştir. Dördüncü ve son bölümde ise defterdeki hükümlerin transkripsiyonu mevcuttur."
