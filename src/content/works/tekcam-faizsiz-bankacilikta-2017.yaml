abstract: "Faizsiz bankacılık sistemi dünyada hızla büyümekte ve gelişmektedir. Bu sistemin temel özelliği bankacılık işlemlerinin ve faaliyetlerinin faizsiz bankacılık prensiplerine uygun şekilde gerçekleştirilmesidir. Faizsiz bankaların bankacılık faaliyetlerini söz konusu prensiplere uygun şekilde gerçekleştirdikleri yönünde başta müşterileri olmak üzere tüm paydaşlarına güvence vermeleri gerekmektedir. Böyle bir güvence ancak denetim aracılığıyla ile sağlanabilir. İyi bir şekilde yapılandırılmış ve kurumsal hale getirilmiş faizsiz bankacılık prensiplerine uyum denetiminin faizsiz bankaların varlığını sürdürmesi ve büyümesi için gerekli olduğu düşünülmekle birlikte dünya genelinde ve ülkemizde bu noktada yeterli olgunluğa ulaşılmadığı, hatta bu alanın ihmal edildiği görülmektedir. Bu çalışmamızda Türkiye'de faizsiz bankacılık alanında faaliyet gösteren katılım bankalarının denetim personeline yönelik anket uygulanmış ve anket sonuçlarından istifade edilmek suretiyle Türkiye için faizsiz bankacılık prensiplerine uyum denetimi konusunda bir model önerilmiştir. Model ile ortaya konulan denetim yaklaşımının Türkiye'de faizsiz bankacılık sisteminin güvenli bir şekilde büyümesine katkı sağlayacağı düşünülmektedir. Çalışmamızda faizsiz bankacılık sisteminin ortaya çıkışı ve gelişiminden, faizsiz bankalar tarafından gerçekleştirilen faaliyetlerden bahsedilmiş, denetim olgusu ele alınmış, faizsiz bankacılık prensiplerine uyum denetimi anlatılmış ve son bölümde Türkiye için bir model önerisi ortaya konulmuştur."
