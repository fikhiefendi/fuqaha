abstract: "Çalışmamız, entelektüel bir kişiliğe sahip olup İslâmî ilimlerin her alanında eserleri bulunan Süyûtî'nin Tedrîbü'r-râvî isimli hadis usûlü eseri özelinde, hadis usûlü kavramlarının oluşumu ve gelişimine dair bir incelemedir. IX. asrın mahsullerinden olan Tedrîbü'r-râvî, hadis usûlü literatürünün en muteber ve muhtevası en geniş eserlerindendir. Çalışmanın hedefi, Tedrîbü'r-râvî'de hadis usûlü kavramlarının ıstılâhî anlam kazanma süreci hakkında yer alan bilgileri tespit etmektir. Toplam üç bölümden oluşan çalışmanın ilk bölümünde Süyûtî'nin hayatı ve ilmî şahsiyeti hakkında bilgi verildi. İkinci bölümde, Süyûtî'nin hadis ilmindeki yeri, Tedrîbü'r-râvî isimli eserde takip ettiği şerh metodu ve kitabın muhtevası hakkında tespitlerde bulunuldu. Çalışmanın ana konusunu oluşturan üçüncü bölümde ise hadis usûlü kavramlarının ıstılâhî anlam kazanma süreçleri hakkında Tedrîbü'r-râvî'de yer alan bilgiler tespit edilerek değerlendirilmeye tabi tutuldu. 93 konu başlığından oluşan Tedrîbü'r-râvî'nin 53 başlığı hadis ilimlerine dair olup diğer 40 başlık hadis usûlü ıstılahlarıyla ilgilidir. Süyûtî'nin zikrettiği 40 başlıkta toplamda 46 hadis usûlü ıstılahı yer almaktadır. Söz konusu ıstılahlar bu tezin ana konusunu oluşturmaktadır. Yapılan araştırma sonucunda Süyûtî'nin Tedrîbü'r-râvî isimli eserinde hadis usûlü kavramlarının ıstılâhî anlam kazanma süreçleri hakkında izlediği yol ve yöntemler ortaya konmuştur. Bu tezin, söz konusu alanda yapılacak yeni çalışmalara bir nebze katkı sunacağını ümit ediyoruz."
