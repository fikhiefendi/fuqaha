abstract: "Araştırmamız üç ana bölümden oluşmaktadır. Birinci bölümde; katılım bankacılığının tanımı, Türkiye'de katılım bankacılığının ortaya çıkışı ve bileşenleri, ikinci bölümde; katılım bankaları ile konvansiyonel bankalar arasındaki farklar, fon toplama ve kullandırma yöntemleri, faiz ve kâr payı, denetim ve şer'i denetim arasındaki farklılıklar ve Türkiye katılım bankaları birliği, üçüncü bölüm ise üç ana aşamadan oluşmaktadır. Üçüncü bölüm Türkiye'de faaliyet gösteren özel katılım bankalarının (Albaraka Türk, Kuveyt Türk, Türkiye Finans) 2010 yılından 2019 yılının sonuna kadarki faaliyet raporlarını inceleyerek kamunun bu sektöre girmeden önceki periyot ile girdikten sonra aralarında özel katılım bankalarının ele aldığımız değişkenlerin (net kâr, toplanan ve kullandırılan fon miktarı) nasıl bir değişim gösterdiği ortaya konmuştur. Sonra 2015'ten 2020'ye kadar kamunun özel sektör üzerindeki etkisini incelemek amacıyla kamu katılım bankalarının (reklam ve ilan giderleri, şube sayısı, alınan ve ödenen kâr payı oranlarını) özel katılım bankalarının (net kârı, toplanan ve kullandırılan fon miktarı) da pazar payı üzerindeki etkisinin çıkarılması için çoklu regresyon analizi (Multiple Regression Analysis) kullanılmıştır. Akabinde özel katılım bankalarının kamu katılım bankaları piyasaya girmeden önce ve girdikten sonra, kullandırılan fon konusunda hangi sektöre yönelik verdiği önem ortaya konmuştur."
