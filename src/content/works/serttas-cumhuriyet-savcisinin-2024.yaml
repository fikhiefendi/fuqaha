abstract: "Savcılık kurumu dünyada hemen her ülkede bulunmakla birlikte suçların kovuşturulmasına ilişkin çeşitli sistemsel farklılıklar bulunmaktadır. İçerisinde Türkiye'nin de bulunduğu kimi ülkeler; işlenen her suçun kamuyu ilgilendirmesi sebebiyle mutlaka kovuşturulması düşüncesine dayanan“Kovuşturma mecburiyeti”ilkesini kabul ederken, diğer bazı ülkeler ise, işlenen suçların kovuşturulmasında kamu yararının bulunup bulunmadığına ilişkin savcıya geniş takdir yetkisi tanıyan“Maslahata uygunluk”ilkesini kabul etmektedir."
