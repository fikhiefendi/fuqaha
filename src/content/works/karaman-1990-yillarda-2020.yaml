abstract: "Bu araştırma 1990'lı yıllarda İslamcıların temelde kapitalizme, özelde ise hem dönemin iktisadi gündemine, hem de bir dizi iktisadi kavrama ve olguya bakışlarını ele almaktadır. Türkiye'de 1980 yılında öne çıkan 24 Ocak ve 12 Eylül tarihleri beraberinde önemli değişim ve dönüşümleri meydana getirmiştir. Bu değişimlerin ve dönüşümlerin muhafazakâr bir parti ve lider öncülüğünde gerçekleşmesi meseleyi din - dindarlar, İslam - İslamcılar bağlamında önemli hale getirmektedir. Özellikle 1990'lı yıllardan itibaren yükselişe geçen İslamcılık da mezkûr dönüşümden etkilenmiştir. İslamcılığın siyasal ve toplumsal yükselişinin yanı sıra iktisadi yükselişi, İslam-iktisat ilişkisinin ve bu ilişkinin alt başlıklarının mesele haline gelmesine sebep olmuştur. O dönemde İslamcıların kapitalizm bağlamında sermaye, piyasa, bankacılık, faiz, girişimcilik, özelleştirme, gümrük birliği, tekelleşme, liberalizm, kültür, ahlâk, tabakalaşma ve eşitsizlik gibi kavramların dergilerde tartıştığı görülmektedir. Türkiye'de İslamcılık hareketi 2. Meşrutiyet döneminden itibaren ortaya çıkışıyla birlikte daima temel olarak dergiler üzerinden varlığını sürdürmüş, gelişimini sağlamıştır. Bu çalışmada da 1990'lı yıllar boyunca yayın yapmış İslamcı dergilerden Çerçeve, Haksöz, İktisat ve İş Dünyası ve İzlenim'in bağlamı ele alınıp İslamcıların kapitalizme ve kapitalizmden doğan bir dizi olgu ve meseleye bakışları incelenmiştir."
