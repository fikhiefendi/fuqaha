abstract: "Son yıllarda, ESG skorları ile finansal performans arasındaki ilişkiye yönelik akademik ilgi artmaktadır; ancak İslami bankacılık sektörü bu bağlamda sınırlı düzeyde incelenmiştir. Bu çalışma, ESG skorlarının İslami bankaların finansal performansı üzerindeki etkisini küresel ölçekte, özellikle Güneydoğu Asya ve MENA bölgesine odaklanarak incelemektedir. Araştırmada, temel finansal göstergeler olarak varlık getirisi (ROA) ve özkaynak getirisi (ROE) kullanılmış, ESG bileşenleri bağımsız değişkenler olarak analiz edilmiştir. Veriler Refinitiv Eikon Thomson Reuters veri tabanından alınarak panel veri analizi uygulanmıştır. Bulgular, ESG skorlarının ROA üzerinde pozitif ve anlamlı bir etkisi olduğunu, ESG uygulamaları ile uzun vadeli varlık verimliliği arasında güçlü bir ilişki bulunduğunu göstermektedir. Buna karşılık, ESG skorlarının ROE üzerinde anlamlı etkisi bulunmamış, bu da sürdürülebilirlik uygulamalarının kısa vadeli kârlılıkla uyumunun sınırlı olduğunu ortaya koymuştur. Çevresel performansın etkisi anlamsız bulunurken, sosyal performansın ROA üzerinde zaman zaman tutarsız etkiler yarattığı görülmüştür. En dikkat çekici bulgu ise yönetişimin en etkili ESG bileşeni olmasıdır; yönetişim, verimliliği artırmakta ve riskleri azaltmaktadır. Bu sonuçlar, MENA ve Güneydoğu Asya'daki karar vericiler için yönetişim uygulamalarının güçlendirilmesine öncelik verilmesi gerektiğini göstermektedir. Genel olarak, sağlam yönetişim çerçeveleri İslami bankacılıkta sürdürülebilir finansal performans için kritik önemdedir."
