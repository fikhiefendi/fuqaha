abstract: "Bu tez, cinsel dönüşüm operasyonlarını ve fıkıh imamlarının kadim fıkıh kitaplarında ortaya koydukları delillere dayanarak ilgili konunun şeri hükmünü konu alan bir araştırma çalışmasıdır. Ayrıca tezde ehli ilim ve öngörü sahibi çağdaş alimlerin görüşlerine de yer verilmektedir. Aynı şekilde uzman doktorların delillerini ve görüşlerini esas aldım. Sadece Arap doktorların görüşleriyle yetinmeyip dünyanın dört bir tarafından doktorların görüşlerine yer verdim. Bu tür cinsiyet değiştirme operasyonlar modern çağın getirilerinden birisi olarak kabul edilir. Zira kadim zamanlarda tıp bugün ulaştığımız yeniliklere ulaşmamıştı. Bu mesele mütekaddim fukahâ tarafından fıkıh kitaplarında bu günkü geniş manasıyla ele alınmayan meselelerden birisi kabul edilir. Bu tezimde erkeklikten kadınlığa ve yahut da tam tersi cinsiyet değiştirme amacıyla yapılan operasyonların çeşitlerini açıklamaya çalıştım. Bugün modern tıp, daha önce olması muhtemel olmayan cerrahi operasyonları gerçekleştirebilecek kabiliyete erişmiş olması, bu operasyonların yasallaşmasını talep edenlerin çoğalması, destekleyen ve karşıtların olması sebebiyle (hassasiyetine rağmen) bu konuyu ayrıntılı bir şekilde ele alıp araştırmak zorunla hale geldi. Bunun için araştırmanın temel kavramlarını açıkladım. Ardından cinsel dönüşüm operasyonlarını benzerlerinde ayırdım. Sonra erkek ve kadın arasındaki farktan bahsettim. Sonra cinsel dönüşüm operasyonlarına yönelen vakalar üzerinde durdum. Her vakayı İslam şeriatı perspektifinden cerrahi operasyonlarla tedavisinin hükmüne ulaşmak için ayrı ayrı, tarihini, nedenlerini ve tedavi yöntemlerini açıklayarak inceledim. Çalışmamda, bu vakaların hakikatini anlayabilmek için çeşitli tıbbi görüşlere ve araştırmalara dayandım. Daha sonra, şer'î hükmün ilmî ve fıkhî açıdan isabetli olması için konuyu, Mütekaddim ve müteahhir fukahânın görüşelerine dayanarak şeriat terazisine sundum. Resmin tamamı hem tıbbi hem de şer'î açıdan benim için netleştikten sonra, delilleri ayrıntılı olarak tartıştım ve şeriatın, mantığın ve aklı selimin gerektirdiği sonuca ulaştım ve bu sonuca kani oldum."
