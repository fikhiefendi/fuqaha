abstract: "Hiç bir şeye ihtiyacı olmayan Allah, insanları birbirlerine muhtaç olarak yaratmıştır. Savaşlar ve doğal afetler çocukların yetim, kadınların dul kalmasına sebep olmuştur. Ancak bunların dışında, Allah'ın meşietiyle dul ve yetim kalanların varlığı da bilinmektedir. Böylelikle her zaman yetimler, hiç de azımsanmayacak kalabalık bir kitle halinde toplumun önemli bir unsuru olmuşlardır. Toplumun huzur ve mutluluğu ancak bu kitleyi sahiplenmek, ihtiyaçlarını gidermekle gerçekleşebilir. Mekke döneminin başlarında nazil olan Duhâ suresinin 6. ayetinde Yüce Allah, Peygamber (s.a.s.)'a hitaben:“(O Rabbin) seni yetim bulup da barındırmadı mı?”buyurmaktadır. Bu dinin peygamberinin kendisinin bir yetim olduğunu ve İslâm'la barındırıldığını hatırlatarak, 9. ayette“Öyleyse sakın yetimi üzme!”ayetiyle tüm yetimler için tembihte bulunmaktadır. Ayrıca yetimlerin İslâm'ın yayılıp yükselmesinde önemli temel taşı oldukları da bu ayetlerin işaretleri arasındadır. İslâm tarihi dikkatle incelendiğinde, yetimlerin de bu dinin temelinde oldukları, hizmette emeklerinin büyük olduğu görülecektir. Hz. Peygamberin evinde barınan birçok yetim vardı. Üvey çocukları, yetim kalmış sahabi çocukları ve terk edilmiş kimsesiz çocuklardan oluşan bu muhtaçlar, Peygamber (s.a.s.)'ın evinde ve O'nun gözetiminde yetişmiş yetimlerdir. Kendi çocukları olmayan Hz. Aişe (r.a.), odasında barındırdığı 4 yetim yeğenine annelik ederek Hz. Peygamber'in uygulamasını sürdürmüştür. Bu yetimler büyük âlimler olmuşlar ve İslâm'ın hizmetinde önemli konuma gelmişlerdir. Peygamber (s.a.s.) yetimlerden bir kısmını bizzat evinde barındırmış bir kısmı için de mescidinde bir yurt açmıştır. Bunun yanında, yetimleri korumaya ve gözetmeye yönelik emir ve tavsiyeleri çoktur. Peygamber (s.a.s.)'ın yetime iyilik etmekle ilgili teşvikler ve yetime haksızlık etmekle ilgili tehditlerine rağmen, genel olarak ümmetin gerekli duyarlılığı göstermediğinden dert yanmıştır,“Allah'ım, ben iki zayıfın hakları konusunda zorlanıyorum: yetim ve kadın”buyurmuştur. Yetimleri gözetmek dinin emridir. Ne yazık ki bu emir, azınlık bir istisna dışında, kitaplarda, vaazlarda kalmış, sohbet konusu olmaktan öteye gitmemiştir."
