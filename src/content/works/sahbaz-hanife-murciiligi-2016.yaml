abstract: "Mezheplerin nüvelerinin ortaya çıktığı ve itikadi görüşlerin tartışmaya açıldığı bir dönemde yaşamış olan Ebû Hanîfe, bu zorlu süreçte itidali korumaya çalışmış, Kur'an-Sünnet çizgisinden ayrılmamış mezhep sahibi bir âlimdir. Yaşadığı dönemde fitneler zuhur etmiş, Müslümanlar birbirlerinin kanlarını akıtmış ve bunun neticesinde birbirlerini küfürle itham eder hale gelmiştir. Ebû Hanîfe, böyle çalkantılı bir zamanda ehl-i beyte olan aşırı sevgisinin yanında ehl-ı kıble olan herkesi Müslüman kabul etmiş ve bir kişi bütün günahları işlemiş olsa da bunları helal kabul etmedikçe imanını kaybetmeyeceği hükmüne varmıştır. Dolayısıyla o, bu gibi konularda insanları yargılamaktan uzak durulması ve onların durumunun Allah'a bırakılması gerektiği görüşündedir. Bu düşüncenin neticesi olarak da imanı amelden ayırmış, amel olmasa da imanın olabileceğini savunmuştur. O dönemde amel-iman noktasında Ebû Hanîfe gibi düşünen Mürciî görüş sebebiyle Ebû Hanîfe de bazı gruplarca Mürcie'ye nispet edilmiştir. Biz çalışmamızda İslam Mezhepler Tarihi'nin metodu üzere ve klasik kaynaklardan faydalanarak bu konuyu izah etmeye gayret ettik. Ebû Hanîfe'nin kendi görüşlerini ve onun ashabının-tabilerinin izahlarını esas alarak bu mezhebe aidiyetini tartıştık. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın amacından, yönteminden, kapsamından ve Mürcie kelimesinin etimolojik-ıstılahî anlamından bahsettik. Birinci bölümde Mürciî fırkalar ve özellikle bu fırkalarım ayrım noktası olan iman tanımı üzerinde durduk. İkinci bölümü Ebû Hanîfe'nin hayatı ve itikâdî görüşlerine ayırdık. Bu bölümde Ebû Hanîfe'nin itikâdî görüşlerini Mürciî görüşlerle mukayese ederek değerlendirmelerde bulunduk. Son bölümde ise Ebû Hanîfe hakkındaki bu verilerden ve olumsuz rivayetlerin asılsızlığı ya da yanlışlığından hareketle Mürciî olarak kabul edilemeyeceğini savunduk."
