abstract: "Dinsel ve etnik azınlıkların uyumu ulusal ve uluslar arası politikada önemli bir araştırma konusu olmuştur. Bugün Avrupa'daki en büyük azınlık topluluğu Müslüman azınlıklardır. Bugün Müslüman azınlıkların Avrupa ülkelerinin dış politikalarına ve bu politikaların azınlıkların durumuna etkisi oldukça büyüktür. Bu azınlıkların hakim topluma entegrasyonu Avrupa'da çok tartışılan bir konudur. İslami finans ve bankacılık gibi mevzular hemen her Avrupa ülkesinde kabul edilirken bazı ülkeler Müslüman azınlıkların haklarını daha da genişletmişlerdir.Yunanistan kurulusundan itibaren Müslüman bir azınlığa sahip olan ve uluslararası anlaşmalara bağlı olarak, bu azınlığın uyumu için Müslümanlar arasında İslam hukukunu tanıyan bir ülkedir. Diğer yandan İngiltere, Müslüman azınlığın entegrasyon ve uyumu için kısa bir zaman önce İslam hukukunun ve İslami mahkemelerin uygulanmasını tanımıştır.Yunanistan bu hakları uluslararası anlaşmalar gereğince yüzyıldan uzun bir suredir tanırken, İngiltere uluslararası bazı gelimseler sebebiyle sadece kısa bir suredir tanımaktadır. Irak'ın işgali, 9 eylül ve 7 temmuz saldırıları ve benzer olaylar İngiltere'de Şeriat'ın uygulanması ile ilgili devam eden tartışmaları hızlandırmış ve 2007'de İslami hukukunun ve İslami mahkemelerin tanınması ile sonuçlanmıştır. Her iki durumda da İslami hukuk olarak uygulanan İslam Medeni Hukuku'dur ve bunun yanında diğer bazı benzerlikler ve farklılıklar da vardır.Bu çalışmada Yunanistan ve İngiltere'deki İslam Hukuku uygulamalarının arkasındaki nedenleri analiz ediyorum ve bu iki örneğin farklılık ve benzerliklerini ortaya koymaya çalışıyorum. Son olarak amacım azınlıkların, özellikle Müslüman azınlıkların, Avrupa `da ve diğer ülkelerdeki entegrasyon süreçlerine faydalı öneriler ortaya koyabilmek."
