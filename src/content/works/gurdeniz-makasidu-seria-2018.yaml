abstract: "Kur'an-ı Kerim'in birçok ayetinde evrende bir nizamın bulunduğu, hiçbir şeyin boşuna yaratılmayıp bir amaca dayandığı, kâinattaki tüm varlık ve olayların insanın hizmetine verildiği vurgulanmaktadır. Makâsıdu'ş-Şeria fıkıh kaynaklarında Kur'an ve sünnetteki tüm hikmet ve gayelerin anlaşılması manasında kullanılmıştır. Şarî'in hükümleri vâz' etmedeki gayeleri bilinmesi gerekir. Evlilik meşrû yoldan neslin devamını sağlar, neseplerin karışmasını önler. Şehveti teskin etmesi, zinadan koruması, eşler arasında sevgi, ülfet ve ünsiyet meydana getirmesi gibi birçok faydası vardır. Evlilik birçok sosyal duygunun düzeyli ve korunaklı olarak yaşanmasını sağlar. Bu da çiftlerin fiziki ve ruhi gelişimlerini olumlu yönde destekler. Evlilikle ilgili hükümleri makâsıd açısından bilinmesi evlilik kurumunun daha iyi anlaşılmasına sağlayacaktır. Evlilikle ilgili hükümlerde korunulması gereken temel maksadlar ve bu maksadları destekleyici tabii maksatlar bulunmaktadır. Evlilik kurumunun kalitesinin muhafazası nesillerinde korunması demektir. Bu nedenle evliliğin keyfi, nefsi veya kültürel bir uygulama olmadığının anlaşılması için evliliğin temel maksadları ve tabii maksadları araştırılarak evlilikle ilgili hükümlerdeki maksadların ortaya konulması gerekmektedir."
