abstract: "Osmanlı toplumunun çok yönlü tahlili açısından şer'iyye sicilleri hayati önem arz etmektedir. Dolayısıyla bu arşiv vesikaları, kaydedildikleri dönemde devletin hukuki uygulamaları, adalet sistemi, sosyo-ekonomik yapısı, kültürel ve dini uygulamaları, yerel yönetim ve idare sisteminin tüm yönleriyle anlaşılabilmesine olanak sağlamaktadır. Araştırmanın amacı, belirli bir döneme ait belgelerin içeriğini analiz etmek ve Malatya'nın hukuki ve sosyal yapısını anlamak için kullanılan metodolojiyi açıklamaktır. Malatya şehrine ait 6410 numaralı, Miladi 1899-1900 tarihli Şer'iyye Sicilinin transkripsiyonu ve değerlendirmesini konu edinen bu çalışmada; Malatya tarihi, Osmanlı hukuku, Osmanlı Devleti'nde kadılık kurumu, şer'iyye mahkemeleri ve şer'iyye sicilleri hakkında genel bilgiler verildikten sonra, Malatya Şer'iyye sicilinin transkripsiyonu yapılmış, belgeler özetlenmiş ve konulara göre tasnif ve değerlendirme yapılmıştır. Çalışmaya konu olan Malatya Şer'iyye sicilinde yaygın bir şekilde karşılaşılan konular; vasi tayini, nafaka tespiti, miras dağılımı ve anlaşmazlıkları, alım-satım, alacak-verecek, borç alma ve ödeme, mal davaları, vekil tayini, evlenme, hırsızlık, darp, ölüm olayları ve asayişi bozan olaylardır. Söz konusu sicilde yer alan vaka verileri kullanılarak Malatya şehrinin sosyo-ekonomik, askeri, idari, dini ve kültürel yapısı hakkında önemli bulgulara rastlanmıştır. Son olarak incelenen kadı sicilinde yer alan köy, mahalle, kasaba ve mevki adları münferiden tespit edildikten sonra ayrıntılı bir analize tabi tutulmuş ve tablo haline getirilerek çalışmaya eklenmiştir. Bununla birlikte Malatya ve civarında yaşayan, farklı sosyal tabakalara mensup şahsiyetlerin unvan ve lakapları da listelenmiş olup çalışmaya dahil edilmiştir."
