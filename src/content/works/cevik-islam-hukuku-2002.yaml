abstract: "öz İslâm hukukunun kültür tarihimiz, hukuk tarihi ve mukayeseli hukuk açısından incelenmesi önem taşımaktadır. Özellikle İslâm hukukunda içtihad konusu İslâm hukuku araştırmalarının omurgasını teşkil eder. İçtihad merkezli bir kaynak araştırmasında öncelikle İslâm hukukunun kaynaklarının genel olarak incelenmesi lüzumundan hareket ederek aslî ve fer'î kaynakları açıkladık. İçtihad konusuna, tarihî seyri içindeki gelişmeleri göz önüne alarak genişçe yer verdik. Buna bağlı olarak hukuk ekollerini (Fıkhı mezhepleri) ele aldık. Özellikle dört Sünnî fıkıh mezhebi ile kurucuları üzerinde durduk. Bu mezheplerin hukuk kaynaklarını, içtihad görüşlerini belirttik. Her mezhebin anlayışları doğrultusunda içtihadlarından örnekler vererek görüşlerini somutlaştırdık. İslâm hukukunda içtihadın durağanlaşması sebepleriyle içtihad kapısının kapalı veya açık olduğu tartışmaları Üzerinde durduk. Bir içtihad ürünü olarak ortaya çıkan hukuk ekollerinin (Mezheplerin) içtihad kapısının kapandığı yorumuna bağlı olarak nasıl taassup kurumları hâline geldiğini açıkladık. Mezhep taassubunun hukukî gelişmeye nasıl engel teşkil ettiğini ve mezhep taassubunun kötülüklerini ortaya koyduk. Zaman içinde Mezheplerin görüşünün Kur'an'ın ve Sünnet'in önüne geçtiğini tesbit ettik. Mezhep görüşünün Osmanlı uygulamasını açıkladık. İslâm-Osmanlı hukukunda bir sapma olarak ortaya çıkan Kadızadeler hareketi üzerinde durduk. Ayrıca İslâm hukukunda içtihadın değişik bir anlayış içinde siyasî aksiyon haline gelen“Velâyet-i fakîh”kurumuna temas ettik. Humeynî ile noktalanan Şia'nın İmâmiye görüşündeki bu kurumu tarihî seyri içinde açıklamaya çalıştık. m"
