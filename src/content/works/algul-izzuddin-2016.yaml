abstract: "Bu çalışmada, İzzüddîn b. Abdüsselâm'ın fıkıh anlayışı ele alındı. Başta yazmış olduğu eserler olmak üzere ilgili bütün kaynaklardan istifade edilerek onun yetişmesinde önemli bir faktör olan ilmi, kültürel, siyasal ve sosyal çevre ile hocaları hakkında bilgi verildi. Onun usul ve içtihat anlayışı, delillerden hüküm istinbat etmede ve meseleleri çözümlemede takip ettiği metot ve kullanmış olduğu yöntem ve teknikler, fıkhî görüş ve tercihleri ve bunlara etki eden nedenler tespit edildi. Yer yer değerlendirmelerde bulunuldu. Üstlendiği görevler, yazdığı eserler, yetiştirdiği talebeler, hayatı boyunca her zaman ve zeminde çizdiği örnek âlim profili ile tarihe geçen ve içtihat derecesine ulaştığı tespit edilen İzzüddîn b. Abdüsselâm'ın fıkıh anlayışının daha çok irdelenerek günümüz İslam toplumunun değişik sorunlarının çözümünde müspet bir rol üstleneceği kanaati hâsıl oldu."
