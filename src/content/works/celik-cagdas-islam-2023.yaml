abstract: "Sömürgecilik süreci ile başlayan“nahda”hareketlerinin devamı olabilecek nitelikte, 20. yüzyılın önemli iki düşünürü Seyyid Kutub ve Ali Şeriati'nin toplumların felahı için kurdukları İslam temelli siyasal-toplumsal formülasyonları siyaset teorisi dâhilinde incelenmiştir. Kurtuluş odaklı düşünen iki düşünür insanların nasıl bir toplumsal yapıda yaşaması gerektiğini, temelini varoluşçu öğelere dayanan bir çözümleme ile kurarak bir siyasal alan düşüncesi ortaya koymuşlardır. Bu bağlamda çalışmada“siyasal”olan kavramı ontolojik düzeyde incelenmiş ve daha sonra siyasalın siyaset boyutuna geçilirken ara alan olarak“egemenlik”kavramı siyasal ile dinsel olanın bağlantısını kurmak için ortaya konmuştur. Bu minvalde 19. yy. sonrası toplumsal ve siyasal sitemler üzerinde hakim siyasal ve iktisadi paradigma olan Liberalizm'in herkes için iyi olanın nasıl sağlanacağına tarafsız kamu alanı noktasında getirdiği cevaplar incelenmiştir. Bu cevapların insani, toplumsal ve siyasal manada yarattığı krize karşı başlatılan yeniden düşünme tarzı siyasal alanda bir çözüm olarak dine yeniden dönüş tartışmalarını başlatmıştır. Çalışma bu bağlamda 1960'lı yılların sonlarından itibaren yükselişe geçen özgürlük teolojisinin yaşanan laiklik krizine ve sonrasında“dinin dönüşü”tartışmalarına karşı bir çözüm olarak belirdiği düşünülerek açıklanmış ve çalışmada özgürlük teolojisi analitik bir araç olarak kullanılmıştır. Çalışma toplumsal ve siyasal bazda yaşanan bu liberal krize karşı İslam ülkelerinde durumun ne olduğu sorgusundan hareketle, İslam düşünürlerinin görüşlerini özgürlük teolojisinin sınırları içinde incelenmeye almıştır. Ortak iyinin nasıl sağlanabileceğine ve nasıl iyi bir siyasal yapılanma ile kurtuluşa ulaşılır konusuna yönelik olarak sundukları projeler değerlendirilmiştir."
