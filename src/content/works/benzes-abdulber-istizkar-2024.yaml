abstract: "İbn Abdülber (ö. 463/1071), fıkıh ve hadis alanlarında önemli eserler vermiş Endülüslü bir âlimdir. Hadislerin sıhhat derecelerinin tespitinde önemli rol oynayarak İslam dünyasında hadis kritiği metodunun gelişmesine katkıda bulunan müellifin fıkıh ilmine de önemli katkılarda bulunduğu görülmektedir. el-İstizkâr adlı eserinde fıkhî görüşleri tahlil ve tenkidinde bulunan İbn Abdülber, konuyla ilgili sahabe ve bazı mezhep müçtehitlerinin görüşlerini nakletmiş ve bunları analiz etmiştir. Müellifin naklettiği görüşlerin başında ise Şafii mezhebinin kurucu imamı sayılan İmam Şâfiî'ye nisbet ettiği görüşler gelmektedir. İbn Abdülber'in İmam Şâfiî'ye nisbet ettiği görüşlerin tespit edilerek tahlil edilmesi önem arz etmektedir. Bu çalışmada dokuman analiz ve tümevarım yöntemleri kullanılarak İbn Abdülber'in İmam Şâfiî'ye (ö. 204/820) nispet ettiği görüşlerin sıhhat derecesi, İmam Şâfiî ve Şafii mezhebine müntesip fakihlerin eserlerinde arz edilerek doğruluğu tespit edilmeye çalışılmıştır. Böylece İbn Abdülber'in ilgili mezhebe nispet ettiği görüşlerin mezhep açısından sıhhati belirlenmeye çalışılmıştır. Ayrıca müellifin referans aldığı kaynaklar ve varsa mezhebe ait olmadığı halde Şâfiî mezhebine nispet edilen görüşler tespit edilerek bu konuya açıklık getirilmeye çalışılmıştır. Elde edilen bilgilere göre İbn Abdülber'in mezkûr eserinde İmam Şâfiî ve Şafii mezhebine nispet ettiği görüşlerin önemli bir kısmının isabetli olduğu görülmüştür. Ancak İmam Şâfiî'ye nispet edilen bazı görüşlerin ise isabetli olmadığı anlaşılmıştır."
