abstract: "Bu çalışma, girişimciliği yalnızca ekonomik kazanç elde etme süreci olarak değil; tarihsel, kurumsal ve zihniyet temelli bir toplumsal kurum olarak ele almaktadır. Hem Batı hem de İslam dünyasında tarih boyunca benzer işlevleri üstlenen tüccar sınıfı üzerinden gelişen girişimcilik, coğrafi, siyasi ve düşünsel koşullara göre farklı biçimlerde şekillenmiştir. Çalışma, girişimcilik kurumunun evrensel bir öz taşımasına rağmen, her toplumda dinî düşünce, ahlaki değerler ve kurumsal yapılarla birlikte yeniden biçimlendiği hipotezinden hareket etmektedir. Niteliksel ve tarihsel karşılaştırmalı analiz yöntemiyle yürütülen araştırmada, Batı'da Reform sonrası gelişen seküler ve birey temelli girişimcilik modeli ile İslam dünyasında Ehl-i Rey'den Ehl-i Hadis'e evrilen zihniyetin girişimcilik üzerindeki etkileri karşılaştırmalı olarak incelenmiştir. Bu çerçevede, ahlaki sorumluluk ile çıkar motivasyonu arasında denge kuran özgür ve hesap verebilir bir girişimci modeli önerilmiştir.“Etik felç”ve“çıkar zehirlenmesi”kavramlarıyla desteklenen model, oyun teorisinden Tit-for-Tat stratejisiyle ilişkilendirilmiş ve İslam girişimciliği için teorik bir çerçeve sunulmuştur. Bu bağlamda tez, İslam dünyasında girişimciliğin gelişebilmesi için sadece faizsiz finansal araçların değil; zihniyet dönüşümü, kurumsal inşa ve kamu politikalarının birlikte ele alınması gerektiğini savunmaktadır. Çalışma, literatürdeki normatif ve teknik yaklaşımların ötesine geçerek girişimciliği etik, tarihsel ve yapısal boyutlarıyla ele alan bütüncül bir katkı sunmaktadır. Bununla birlikte, ampirik saha verisine dayanmaması ve geniş medeniyet havzalarını karşılaştırırken kaçınılmaz bazı genellemeler içermesi, çalışmanın temel sınırlılıkları arasında yer almaktadır."
