abstract: "Tezimizin konusunu,“6098 Sayılı Türk Borçlar Kanunu'na Göre Konut ve Çatılı İşyeri Kira Sözleşmelerine Özgü Sona Erme Sebepleri”oluşturmaktadır. Tezimizin birinci bölümünde; konut ve çatılı işyeri kira sözleşmelerinin bildirim yoluyla sona ermesi açıklanmaya çalışılmıştır. Bu bağlamda, belirli ve belirsiz süreli sözleşmelerde, kiracı ve kiraya veren tarafından kira sözleşmesinin bildirim yoluyla sonra ermesi ayrı ayrı ele alınmıştır. Tezimizin ikinci bölümünde ise, konut ve çatılı işyeri kiralarının dava yoluyla sona ermesi incelenmeye çalışılmıştır. Bu bölüm, kiraya verenden ve kiracıdan kaynaklanan sebeplerle olmak üzere iki başlık altında açıklanmıştır. Kiraya verenden kaynaklanan sebepler başlığı altında; gereksinim, yeniden inşa veya imar ve yeni malikin gereksinimi sebebiyle sözleşmenin sona ermesi halleri ele alınmıştır. Kiracıdan kaynaklanan sebepler başlığı altında ise; tahliye taahhüdü, iki haklı ihtar ve kiracının veya eşinin oturulabilir konutunun bulunması sebebiyle sözleşmenin sona ermesi izah edilmiştir. Türk Borçlar Kanunu'nun sistematiği dikkate alınarak, TBK 347-352 maddeleri arasındaki hükümler doğrultusunda çalışılmıştır."
