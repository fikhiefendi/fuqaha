abstract: "ÖZET YÜKSEK LİSANS TEZİ İSLAM BORÇLAR HUKUKU AÇISINDAN ADİ KİRA VE HASILAT KİRASI Nurullah ŞİMŞEK Danışman: Yrd. Doç. Dr. Murtaza KÖSE 2002- Sayfa:90 Jüri: Yrd. Doç. Dr. Murtaza KÖSE Prof. Dr. Davut YAYLALI Doç. Dr. Fahrettin KORKMAZ Klasik fıkıh kitaplarında kira akdi müstakil bir akit tipi olarak incelenmeyip kompleks bir akid olan icare akdi bünyesinde incelenmiştir. Kira akdi fıkıh kitaplarında zamanın ve şartların anlayışına göre işlenmiştir. Dolayısıyla kira akdinin modern hukukta olduğu gibi adi kira ve hasılat kirası şekliyle bir ayrımına rastlanmaz, ancak İslam hukuk tarihinde her iki kira tipi uygulamalarına rastlanmaktadır. Günümüzde sahası oldukça genişleyen kira akdi hususunda İslam borçlar hukukunun temel prensipleri göz önünde bulundurularak yeni düzenlemeler yapılmasının gerektiği kanaatindeyiz."
