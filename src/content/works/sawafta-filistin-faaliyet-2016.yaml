abstract: "Filistin'deki bankacılık sistemi, ekonominin gelişmesinde hayati bir rol oynamaktadır. Filistin Para Politikası Kurumu (PMA)'nun 1994 yılında kurulmasından bu yana bankaların sayısı düzenli bir şekilde artmış ve 2013'ün sonlarında 232 şube ve ofisi olan 17 bankaya ulaşmıştır. Filistin'de faaliyet gösteren 7 yerel banka (Batı Şeria ve Gazze Şeridi'nde faaliyet gösteren yerel bankalardan sadece 2'si İslami bankadır) ve 10 yabancı banka bulunmaktadır. Yabancı bankaların arasında 8 Ürdün, bir Mısır ve HSBC'nin sahip olduğu bir banka bulunmaktadır. Filistin'deki son eğilimler destek akışlarla faaliyetini sağlamanın yanında gelişmeyi kolaylaştırmakta ve ekonomik faaliyetlerin canlanması tarafından desteklenmektedir. PMA şimdi kararlı bir şekilde iyi işleyen bir bankacılık sistemi devreye sokmaktadır. Filistin'deki bankacılık faaliyeti toplam değer açısından artış göstermiştir. 2010 yılında 6,8 milyar ABD doları tutarındaki müşteri mevduatı 2013 yılında yaklaşık 8,1 milyar ABD dolarına yükselmiştir. Toplam aktifler 2010 yılında 8,5 milyon ABD dolarından 2013 yılında 10,6 milyar dolara yükselmiştir. Doğrudan kredi olanaklarındaki büyüme 2010 yılında 2,7 milyar ABD dolarından 2013 yılında 4,3 milyar ABD dolara yükselmiştir. Toplam öz kaynaklar ise 2010 yılında 8,3 milyar ABD dolarından 2013 yılında 10,6 milyar dolara yükselmiştir. Bu çalışma, Filistin'deki yerel ve islami bankalar ile yabancı bankalar arasındaki kredi riskini karşılaştırmayı amaçlamaktadır. Bu çalışmada, yabancı bankaların yerel bankalardan daha düşük kredi riski taşıdığı uygulamalı olarak ortaya konmaktadır. Kredi riski, 2007'den 2013'e kadar olan temerrüde uzaklık (DD) ile temerrüde düşme olasılığını (DP) ölçmek için kullanılan ve Black ve Scholes opsiyon fiyatlandırma formülüne dayanan Merton modelini kullanarak 8 yabancı ve 7 yerel (bunlardan 2'si İslami bankadır) banka için hesaplanmaktadır. Yerel ve islami bankaların temerrüde uzaklık ortalaması (4,77) iken, yabancı bankaların ortalaması (7,26) ile daha yüksektir. Yerel ve islami bankaların temerrüde düşme olasılık ortalaması (2.86E-04) iken, yabancı bankaların ortalaması (3.43E-06) ile daha düşük, yerel bankalardan daha yüksek olmakta; bu da daha yüksek kredi riski olduğunu ortaya koymaktadır. Bu çalışma, temerrüde düşme olasılığını temerrüde uzaklıktan elde etmek için kümülatif lojistik olasılık dağılımlarını kullanmaktadır. Kümülatif olasılıklar bir alt sınıra kadar kullanıldıklarında sonuçlar daha tatmin edici olmaktadır: 2007-2013 lojistik dağılımı kapsamında temerrüde düşme olasılığı dağılımının daha geniş uçları bulunmaktadır. Örneklem seviyesinde, temerrüde düşme olasılığı, (4.23E-03) olan yabancı bankalarla karşılaştırıldığında, yerel ve islami bankalar için (1.67E-02) seviyesinde ve halen yüksek olmaktadır."
