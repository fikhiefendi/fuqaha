abstract: "Teklîfî hükümlerde makâsıd, özelde İslam hukuk usûlünde, genelde ise İslam dininde önemli konulardan biridir. Bu durumda, teklîfî hükümlerde makâsıd, emir ve nehiyden her bir teklîf için dünya ve ahirette kulların maslahatlarını hedefleyen bir gaye olduğu anlamına gelir. Bu konu şerîatta hikmet ve azâmetin varlığını ortaya koymaktadır. Bu çalışma, Sadruşşerîa el-Mahbûbî'ye göre teklîfî hükümlerde gözetilen amaçlardan bahsetmektedir. Sadruşşerîa bu konuya önem veren usûlcülerin başında gelmektedir ve makâsıd ile ilgili genel çerçeveyi çizmiştir. Kendisinden sonra gelen hanefî usûlcüler de bunu geliştirmiştir. Çalışmada Sadruşşerîa ve diğer usûlcülere göre teklîfî hükümlerde makâsıd konusu mukayeseli bir biçimde incelenmiştir."
