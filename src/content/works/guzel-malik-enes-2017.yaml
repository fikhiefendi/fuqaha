abstract: "Müslümanlar, Allah'ın insanlığa en son hitabı olan Kur'an'ı, indiği ilk andan itibaren anlama ve yaşamlarına aksettirme gayesiyle her yönüyle incelemişlerdir. Kur'an'ın ilk tefsiri onun ilk muhatabı ve mübelliği Hz. Peygamber (a.s.) tarafından yapılmıştır. Onun başlattığı bu faaliyet, ashap tarafından genişletilerek sürdürülmüş ve onlardan intikal eden bu tefsir mirasını Tâbiûn devralmıştır. Bu dönemde tefsir faaliyeti bir hayli genişlemiş, bu alanda önemli şahsiyetler yetişmiş ve Kur'an yorumuna ilişkin veriler kayıt altına alınmaya başlamıştır. Sahabe, Tabiun ve Tebe-i Tabiîn dönemini içeren bu erken dönem tefsir mirası, Kur'an'ın ilk dönem muhataplarınca ortaya konulmuş olması açısından sonraki nesil Kur'an araştırmacıları için büyük öneme sahiptir. Hadis âlimi ve Maliki mezhebinin kurucusu olan Malik b. Enes(ö. 179/795), Tebe-i Tabiîn dönemi tefsir faaliyetleri açısından önemli şahsiyetlerden birisidir. Emeviler ve Abbasiler döneminde Medine'de yaşam süren ve hadisçi ve fıkıhçı kimliği ile tanınan İmam Mâlik tefsirci yönü de bulunan bir âlimdir. Bununla birlikte bu yönü hadisçi ve fıkıhçı kimliklerinin gölgesinde kalması sebebiyle ihmal edilmiştir. Kaynaklarda Malik b. Enes'e ait bir tefsirden söz edilse de bu eser elimizde mevcut değildir. Onun tefsire ilişkin rivayetleri muasır araştırmacılardan Muhammed b. Rızk b. Tarhûnî ile Hikmet Beşir Yasin tarafından hazırlanan Merviyâtü'l-İmâm Malik fit-Tefsir adlı eserde bir araya getirilmiştir. Ebû Bekir İbnü'l-Arabî'nin (ö. 543/1148) el-Kabes fi Şerhi Muvattâi Malik b. Enes adlı eserin tefsir bölümünde de İmam Malik'in tefsire ilişkin rivayetlerine yer verilmektedir. Biz bu çalışmada, bu iki eser başta olmak üzere çeşitli kaynaklardan da yararlanarak Tebe-i Tâbiîn dönemi âlimlerinden Mâlik b. Enes'in tefsir anlayışını ortaya koymayı amaçlamaktayız."
