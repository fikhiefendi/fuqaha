abstract: "İnsanlık tarihi kadar geçmişe sahip olan mülkiyet müessesesi sosyal hayatta da büyük öneme sahiptir. Tarihin değişik evrelerinde birbirinden farklı hukuk sistemleri varolmuş ve mülkiyet müessesesine yön vermiştir. Bu hukuk sistemleri ilahi ve beşeri kaynaklı olmakta ve mülkiyet hakkı konusunda farklılık arz etmektedir.İnsan hak ve özgürlüklerini ilgilendirme bakımından Sosyalist hukuk sisteminde fertler açısından mülkiyet hakkı kısıtlanmıştır. Toplumda sosyal eşitliği sağlama amacıyla gerçekleştirilen bu uygulama aslında insanın doğal hakkı olan mülkiyet hakkını kısıtlamış ve bazen de bundan mahrum bırakmıştır. Özel mülkiyet hakkı, toplum içerisinde eşitsizliğe ve haksızlığa neden olacağı ve insanlar arasında birbirilerine karşı zulüm ve baskı aracı olarak kullanılacağı için kısıtlanmıştır.İslam Hukuku mülkiyet hakkını insanın en doğal hakkı ve ilahi lütuf olarak görür. İlahi kanunlar çerçevesinde kazanılan her türlü mülkiyet meşru sayılmıştır. Fert ve toplumun bu konudaki hakları ihmal ve ihlal edilmediği sürece her hangi bir kısıtlama sözkonusu değildir.Tarih içerisinde Zerdüştlük, Hırıstiyanlık ve İslam Hukuku gibi hukuk sistemlerine tanıklık eden Azerbaycan, 20. Yüzyılda sosyalist hukukla idare olunmuştur. Sovyetler Birliği sonrası bağımsızlık kazanan Azerbaycan Respublikası kapitalist hukuk sistemini benimsemiş ve en son mülkiyet müessesesi buna göre düzenlenmiştir.Araştırmanın amacı, sözkonusu hukuk sistemlerinde mülkiyet müessesesinin konumunu, fonksiyonunu ve avantajlarını belirlemektir.Murad OSMANOV29. 08. 2009Üsküdar-İstanbul"
