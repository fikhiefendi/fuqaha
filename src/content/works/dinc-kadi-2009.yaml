abstract: "Fıkıh usûlü ilminde memzuc usulle Sadruşşerîa tarafından tedvîn edilen et-Tavzîh bu ilmin temel eserleri arasında yer almış, kendisinden sonraki usûl düşüncesini derinden etkilemiştir. Bu eser üzerine yapılan çalışmaların en meşhuru olan et-Telvîh'te Teftâzânî, Sadruşşerîa'nın ortaya koyduğu görüş ve delilleri tenkide tabi tutarak reddetmiştir. Bu tenkitlerin bir kısmında Teftâzânî'nin benimsediği mezhep görüşünün isabetli olduğunu ispat etmeyi amaçladığı görülmektedir. Teftâzânî'nin bir kısım tenkitleri ise dil, mantık, belagat ilimlerinin meseleleri ve Sadruşşerîa'nın çoğunluktan farklı olarak ortaya koyduğu görüşleri ile alakalıdır.İlerleyen süreç zarfında birçok Hanefî âlim et-Telvîh'e hâşiye yazarak, bilhassa bu eserdeki Hanefî görüşünü hedef alan tenkitlere cevap vermeye teşebbüs etmiştir. Kadı Burhâneddin'in Tercîhu't-Tavzîh'i de sözkonusu eser üzerine yazılan cevabî mahiyette bir hâşiyedir. Ancak, et-Tavzîh'in kapalı kısımlarının açıklandığı ve nadir olmakla birlikte Sadruşşerîa'nın eleştirildiği meseleleri de muhtevidir.Bu çalışmada Tercîhu't-Tavzîh isimli eserin iki nüshası esas alınarak tahkiki yapılmıştır. Çalışmanın ilk bölümünde tarihte iz bırakmış bir hükümdar ve şair olan Kadı Burhâneddin'in hayatı, ikinci bölümünde Tercîhu't-Tavzîh'in kaynakları olan et-Tavzîh ve et-Telvîh isimli eserler, bu eserlerin müellifleri ve sözkonusu eserler üzerine yapılan çalışmalar ele alınmıştır. Üçüncü bölümde eser hakkında genel bilgiler verilmiş, eserdeki meselelerin yazılış sebepleri örneklerle tanıtılmıştır. Ayrıca bu bölümde tartışmalarda riayet edilen kurallar ve konu bütünlüğü içinde örnek tartışmalar yer almış, diğer hâşiyelerde Tercîhu't-Tavzîh'e yapılan atıflara değinilmiş, eserin nüsha tavsifleri yapılmıştır. Tercîhu't-Tavzîh'in Arapça metni tezin son kısmındadır."
