abstract: "İktisadî bir faaliyette İslam'a uygun ve aykırı usul ve anlayışlar İslam iktisadî düşünce literatürünü oluşturur. İslam iktisat düşünce tarihine baktığımızda vergilendirme faaliyetinin nasıl olması, neleri dikkate alması gerektiği, ilgili İslamî ilkelerin neler olduğu, kimlerden, ne üzerinden, nasıl ve niçin vergi alındığı, hâsılı vergilendirme anlayışının özelliği önemli bir yer tutmaktadır. Betimleyici, tanımlayıcı, yönlendirici yaklaşımlar benimsediğimiz, nitel, tümevarım ve tümdengelim araştırma yöntemlerini kullandığımız tezimizde, İslamî vergilendirme anlayışını idrak etmek için İslam hukukunun temel kaynaklarını teşkil eden Kur'ân, Hz. Peygamber ve Raşid Halifeler dönemindeki vergi (zekât, harâc ve cizye) uygulamaları ile Kur'ân ve Sünnete dayalı olarak yazılan klasik ve çağdaş eserlerden faydalanılmış olup, bu anlayışın güncel vergi uygulamalarımıza yansıyıp yansımadığı, Türk vergi kanunlarıyla (vergileme usulleri ile Gelir Vergisi, Kurumlar Vergisi, Özel Tüketim Vergisi, Katma Değer Vergisi, Emlak Vergisi ve Motorlu Taşıtlar Vergisi özelinde) kesişen ve kesişmeyen noktalar ortaya konmaya çalışılmıştır."
