abstract: "İslam toplumunun inşasında Müslüman aile ilk ve temel yapı taşı olarak kabul edilir. Ailenin salahı ve kenetlenmesi ışığında toplumun salahı, ardında da ümmetin salahı oluşur ve belirginleşir. Bu nedenle toplumun temel birimi olan aileye odaklanmak, onu korumak ve yaşatmak zorunlu bir durum olmuştur. İslam'ın, dini öğretileri içerisinde ilk andan itibaren sağlam temeli ve inşası, aile içinde yıkıcı tartışmalara yol açacak muhtemel gerginlikleri gidermek için koruyucu ve tedavi edici yöntemler geliştirmesi, sonra da devamlılığını sağlamaya çalışması, aile sözleşmesinin bozulmasına ve ailenin parçalanmasına doğrudan veya dolaylı katkıda bulunan sosyal hastalıkların sirayet etmesine izin vermemesi çerçevesinde aileye önem vermesi şaşırtıcı değildir. Bu nedenle İslam, makâsıd ve beş ilkesinden Müslüman ailenin ırz ve şerefini korumak için temel prensipler oluşturmuştur. Bu çalışmada İslam hukukunun ana kaynağı olan Kur'ân metodunu tercih etmemiz, sosyal mevzuatı, özellikle de aile hayatını ilgilendiren konuları türetmek için gerekli olmuştur. Dolayısıyla bu mütevazı çalışma, aile hayatının başlangıcından sonuna kadar ilgili Kur'ân âyetlerini değerlendirmeyi amaçlamaktadır. Çalışma, ailenin bir yönünü ilgilendiren Kur'ân âyetlerinin makâsidî bir incelemesine odaklanmaktadır ve konu, üç ana aşamaya ayrılmaktadır:Birinci aşama: Aile kurulmadan önce bir eşin diğerine seçilmesi ve seçim için arzu edilen kriterlerin belirtilmesine dair Kur'ân-ı Kerîm'in metodu. İkinci aşama: Ailenin kurulmasından sonra ve normal hayat sırasında Kur'ân-ı Kerîm'in metodu. Üçüncü aşama: Ailenin yıkılması durumunda Kur'ân-ı Kerîm'in metodu ve tedavisi. Ayrıca çalışmada Kur'ân-ı Kerîm'in aileyi kurma, koruma ve yıkılmaktan kurtarmadaki en belirgin ve önemli makâsıd ve hedefleri ele alınmaktadır. iyi anlaşılması adına en önemli makasıdî tefsirlere işaret etmiştir. Çalışmada genel olarak şunlar açıklanmıştır: Kur'ân-ı Kerîm, hayatın tüm meselelerine bütüncül bir metot olarak kabul edilmektedir. Bu meselelerin en önemlileri arasında kamusal yaşamın kendisine dayandığı ve kendisiyle devam ettiği aile hayatı yer almaktadır. Bu da hayat arkadaşı seçimi şeklinde bu projenin başlangıcından itibaren aile ve oluşumuna yönelik Kur'ân'da yer alan eksiksiz ve kapsamlı yönlendirme ve kurallar ile gerçekleşmektedir. Kur'ân-ı Kerîm bu aşamayı dini esasları içerisinde tasvir etmiş ve bu aşama için Kur'ân-ı Kerîm'de belirtilen temel ve arzu edilen dini ve ahlaki standartlar dâhilinde eşlerden her birinin birbirini nasıl seçmesi gerektiğini açıklamıştır. Daha sonra evlilik projesinin pratik aşaması yani günlük aile hayatı gelir. Kur'ân-ı Kerîm bu konuyu detaylandırmış, eşlerin sahip olduğu tüm hak ve görevleri açıklamış, ayrıca aile hayatı kervanının nihai varış noktasına ulaşana kadar güvenli ve huzurlu bir şekilde ilerlemesi için çocukların haklarını, leh ve aleyhlerinde olan şeyleri de zikretmiştir.Dünya hayatının, problemlerden, sıkıntılardan ve engellerden uzak, mükemmel bir hayat olmadığını biliyoruz. Aile hayatı, hukuki bir temele ve toplumsal kural ve yönlendirmelere dayanmasına rağmen, yaşamın doğasının bir parçası olan dünyevi sorun ve engellerden yoksun olmayan büyük tehditlerle karşı karşıyadır. Nitekim Yüce Allah (cc)“Sizi bir imtihan olarak hayır ile de şer ile de deniyoruz (Enbiyâ, 21/35)”şeklinde buyurmaktadır. Aile, eş ve çocuklar da dâhil olmak üzere tüm üyeleriyle birlikte, toplumdaki gerek aile hareminde gerekse aile haremi dışındaki aile yaşamlarında engellere ve zorluklara maruz kalabilmektedir. Bu sorunların mutlaka çözülmesi ve tedavi edilmesi gerekmektedir. Bilindiği üzere Kur'ân-ı Kerîm, zikretmediği veya atıfta bulunmadığı hiçbir şey bırakmamıştır. Nitekim Yüce Allah (cc)“Küçük, büyük her şey satır satır yazılmıştır (Kamer, 54/53)”şeklinde buyurmuştur. Bu nedenle Kur'ân-ı Kerîm, sorunlar, ister eşler ve çocuklar arasındaki duygusal boşluk, aile içi şiddet, zihâr, îlâ', kazıf, li'ân, boşanmaya ve ayrılığa yol açan eşler arasındaki geçimsizlik gibi dâhili olsun, ister şartlar yerine getirilmediği takdirde bazen aile ve toplumda kaos ve karışıklığa yol açan çok eşlilik gibi toplum meydanında harici olsun aile hayatında ailenin karşılaştığı sorunlardan ve engellerden bahsetmiştir.Toplumsal aile sorunlarından biri de evlilikteki sadakatsizliktir ve maalesef her geçen gün acı verici sebeplerden dolayı artmaktadır. Aile sorunları arasında genç erkeklerin bahsettiğimiz nedenlerden ötürü evlenmek istememeleri The third stage: The Holy Qur'an's approach and treatment of the family at the time of its collapse.This is with great emphasis on the most prominent and important purposes and objectives of the Holy Qur'an in forming the family, protecting it and preserving it from collapse.Kur'ân-ı Kerîm, bu ümmetin ebedi kitabı, kapsamlı anayasası, gerçek ve sadık rehberidir. Çalışmamın ortasında evlilik projesinin oluşması, ailenin inşası, yeryüzünün iskân edilmesi, insan neslinin korunması, toplumun kötülüklerden ve ahlaki bozulmalardan korunması, sosyal tanışıklık, eşler ve aile bireyleri arasında sosyalleşme, sevgi ve şefkatin sağlanması ve buna benzer konularda Kur'ân-ı Kerîm'in en önemli amaç ve hedefleri mümkün mertebe geniş bir şekilde ele alınmıştır. Aileyi korumayı ve oluşturmayı hedeflediklerini öne süren pozitivist teoriler tarafından ortaya atılmış, ancak gerçekte birçok kusur ve eksiklikle dolu olan ve arkasında Müslüman aileyi yok etmeye, yolsuzluğu teşvik etmeye ve toplumu çökertmeye çalışan habis bir niyete karşın Kur'ân-ı Kerîm'in açıklamalarında İslam ümmeti için kifayet ve şifa vardır."
