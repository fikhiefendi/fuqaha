abstract: "İslami bankacılık, yalnızca bir finans modeli değil, aynı zamanda ekonomik ve sosyal adaleti teşvik eden bütüncül bir sistemdir. Faizsiz finans ilkelerine dayanan bu yaklaşım, risk paylaşımını esas alarak gelir eşitsizliklerini azaltmayı ve ekonomik aktiviteleri daha kapsayıcı hale getirmeyi amaçlar. Ancak bu sistemin ekonomik büyümeye olan katkısı, ülkelerin finansal altyapılarının sağlamlığı, kaynak yönetimindeki etkinlik ve uygulanan politikalarla doğrudan ilişkilidir. Bu bağlamda çalışmanın amacı İslami bankacılık ve ekonomik büyüme arasındaki ilişkinin Türkiye ve Malezya ülkeleri için incelenmesidir. Çalışmada 2010:Q1-2024:Q1 dönemine ilişkin çeyreklik veri seti kullanılarak; GSYİH bağımlı değişken İslami bankaların varlıkları, toplanan ve kullandırılan fonları ise bağımsız değişken olarak seçilerek ARDL sınır testi yöntemi uygulanmıştır. Ayrıca aralarındaki nedensellik ilişkisini belirleyebilmek adına Granger Nedensellik testi uygulanmıştır. Sonuç olarak Türkiye'de uzun dönemde kullandırılan ve toplanan fonların ekonomik büyüme üzerinde negatif ve anlamlı, varlıkların ise pozitif ve anlamlı etkisinin olduğu tespit edilirken, Malezya'da toplanan fonların ekonomik büyümeye etkisinin negatif olduğu ancak varlıklarının pozitif şekilde etkilediği tespit edilmiştir. Granger nedensellik testi sonucuna göre ise hem Türkiye'de hem de Malezya'da İslami bankacılıktan ekonomik büyümeye doğru nedensellik ilişkisi belirlenmiştir."
