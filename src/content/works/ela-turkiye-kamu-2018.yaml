abstract: "İslami finans piyasası son yıllarda önemli bir gelişim hızı göstermiştir. İslami finansın bu gelişim hızını yakalamasında son dönemlerin ilgi çeken enstrümanı olan sukukun payı oldukça fazladır. Nitekim sukuk, 2001 yılından itibaren tüm dünyada önemli bir atılım göstermiştir. Öyle ki sukuk 2014 yılında 120 milyar doları aşan ihraç tutarlarına ulaşmıştır. Sukukun son yıllarda hızla büyümesinin ardında hiç şüphesiz devlet sukuklarının payı oldukça fazladır. Nitekim, özellikle 2009 yılının ardından sukuk piyasasına devlet sukukları hakim olmaya başlamıştır. Global olarak artan devlet sukuku ihraçlarına paralel olarak Türkiye, devlet sukuku ihracına 2012 yılında başlamış ve 2016 yılında yaklaşık 9 milyar dolarlık sukuk ihracı ile dünya piyasasında öne çıkmıştır. Devlet sukukları, kamu borç yönetimi açısından devletlere birçok avantajlar sağlamaktadır. Ancak devlet sukuklarının kamu borç yönetiminde kullanılabilmesi için daha düşük maliyetli olması gerekmektedir. Sukuk ihraç maliyetlerinde ve getirilerinde yaşanacak bir azalma ise ancak sukuk problemlerinin çözümü ile gerçekleşebilecektir. Vatikan'ın İslami finansa kulak verin çağrısından ve Birleşik Krallık'ın sukuk merkezi olmak için çabasından esinlenerek Türkiye'de devlet sukukunun alternatif bir fon olarak sağlayacağı faydalara ve Türkiye'nin bu yönde ele alabileceği önlemlere değinen bu çalışmanın amacı Türkiye'ye devlet sukukunun alternatif bir fon kaynağı olarak sağlayacağı avantajlar ve Türkiye'nin atması gereken adımları incelemektir."
