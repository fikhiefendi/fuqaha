abstract: "Memlük Devleti (648-923/1250-1517), stratejik coğrafi konumu sayesinde yalnızca İslâm dünyasında değil, Türk tarihinde de müstesna bir yere sahip olup, en karmaşık ve çalkantılı dönemlerin birinde sahneye çıkmıştır. Moğol saldırıları ve Haçlı Seferleri sonucu birçok âlimin Mısır ve Suriye başta olmak üzere Memlük topraklarına göç etmesi, bölgede ilmî hayatın beklenmedik bir ivme kazanmasına zemin hazırlamıştır. Memlük dönemi hem siyasi hem de ilmî bakımdan İslâm tarihinin kritik kırılma noktalarından birini teşkil etmiş; mezhep temsili, fıkhî çoğulculuk ve kurumsal yargı düzenlemeleriyle özgün bir hukuk geleneği inşa edilmiştir. Memlük yönetimi, Eyyûbî mirası ve Abbâsî hilâfetinin sembolik otoritesinden beslenerek, öncesindeki İslâm devletlerinin mezhep temelli hukuk anlayışı ve fıkhî tecrübelerini devralmış; bu birikimi özellikle Sünnî dört mezhebin yargı mekanizmalarına entegre etmesiyle dikkat çekmiştir. Memlük döneminde Sünnî mezheplerin idarî ve toplumsal alandaki etkileri büyük önem taşırken, dönemin yargı ve adlî otoritelerin merkezi rolleri, hukuk sisteminin işleyişini ve yapısını kavrayabilmek açısından kritik bir konumda olmuştur. Sultan Baybars'ın (öl. 676/1277) dört Sünnî mezhebin yargıda resmen temsil edilmesine imkân tanıyan düzenlemeleri, dönemin fıkıh anlayışını doğrudan etkilemiş; mezhepler arası çoğulculuğu hukuki bir kurguya dönüştürerek geniş bir toplumsal yansıma meydana getirmiştir. Bu durum, beraberinde taklit, taassup ve telfîk gibi kavramların Memlük ilmî atmosferinde daha yoğun biçimde tartışılmasına ve gündemde yer bulmasına zemin hazırlamıştır. Memlük Devleti'nde eğitim faaliyetleri yalnızca medreselerle sınırlı kalmayıp, camiler, hankahlar, zâviyeler ve çeşitli ilim meclisleri aracılığıyla geniş bir toplumsal tabana yayılmıştır. Yönetici kadroların ilmî faaliyetlere verdiği destek hem dinî hem de kültürel bir canlılık sağlamış; bu sayede Memlük Devleti, Türk-İslâm medeniyetine önemli katkılar sunmuştur. Özellikle dönemin fakihlerinin yalnızca eserleri değil, hayat tecrübeleri de hukuki yapının temel taşlarını oluşturmuş; toplumsal ve siyasi meselelerde geliştirdikleri fikirlerle hem çağdaşlarına hem de sonraki nesillere ışık tutmuşlardır. Memlükler, yalnızca geçmişin mirasını aktaran değil, aynı zamanda özgün katkılar sunan, metodolojik zenginlik ve tartışma kültürüyle öne çıkan dinamik bir hukuk ve ilim atmosferi meydana getirmiştir."
