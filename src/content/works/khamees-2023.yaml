abstract: "Bu araştırmanın ana konusu insanlara musallat olan hastalık ve salgınlarla mücadelede makâsıdu'ş-şerîanın konumunu ortaya koymak ve toplumların başına gelen pek çok musibetin giderilmesidir. Araştırmanın felaketler ve yeni gelişmelerin çoğaldığı, hastalık ve salgınların sosyal, ekonomik, meselelerde hatta dini konularda köklü bir değişikliğe yol açtığı bir dönemde yapılması dikkat çekicidir. Salgın ve hastalıklar yeni soruları gündeme getirmiştir. En büyük felaketler, enfeksiyon yasası ve ölümcül hastalıklarla ilgili olarak ortaya çıkanlardır. Müctehidin insan hayatının devamını sağlamak, menfaatlerini temin etmek ve zararlardan korumak için bu salgın hastalıklara makâsıdu'şşerîa açısından bakması, bu felaketleri dikkatli şekilde tavsif etmek ve doğru yoğunlaşmayı sağlanmak için disiplinli bir içtihadla gözden geçirmesi gereklidir. Bu çalışmanın önemi, salgın ve yeni ortaya çıkan hastalıklarda şeriatın hükmünün açıklanmasından kaynaklanmaktadır. Araştırmanın hedeflerini gerçekleştirmek için fakih ve usulcülerin bulaşıcı hastalıklar konusundaki görüşlerinin tespiti, bulaşıcı ve salgın hastalıkları makâsıdü'ş-şerîa açısından ele alıp, şer'î hüküm tahil edilirken betimleyici analitik yöntem kullanılmıştır. Araştırmada ulaşılan sonuçların önemlileri şunlardır: İslam hukukunun esnekliği sayesinde gelişmeleri ve salgınları kontrol altına alma, musibetleri absorbe etme, bunlara etkili çözümler bulma ve gerektiğinde müdahale etme yeteneği olduğu görülmüştür. Salgın ve hastalık gibi acil durumlarda müçtehit ve fetva verenlerin sıhhat ve emniyete daha yakın olabilmek için şeriat sınırlarını aşmama prensibine uymaları gereklidir. Koruyucu hekimlik, insanların kendilerini salgınların kötü sonuçlarından koruyabilmesi için temizliğe, kişisel hijyene, çevreyi korumaya, bulaşıcı hastalıkları tedavi etmeye ve toplu yaşamdan kaçınmaya dayalı sahih bir Kur'anî ve nebevi yaklaşımdır. Makâsıd yönüyle şeriata göre nefsi koruma dini korumadan, kamu yararı da kişisel faydadan önce gelmektedir. Bu sebeple hastalıklardan zarar görenler ve bulaşıcı hastalık kapanların karantinaya alınmaları, topluluklara, camiye ve insanların yoğun olarak bulundukları mekanlardan uzak tutulmaları gerekmektedir. Buna ek olarak, hem İslam hukukunun hoşgörüsü hem de insanların korumaya çalışan çağdaş görüş, bu hastalıkların tedavisine izin vermiş, cemaatle namaza gitmemeye müsaade etmiş, alkollü sterilizatörlerin kullanılmasına meşru kabul etmiştir. Aynı şekilde toplum ve bireyi korumak için temizlik, hijyen, çevrenin korunması ve ellerin yıkanması her bir bireyin görevidir."
