abstract: "Tezimiz, İslam hukukunda harama dair yer alan hükümlerin zaman ve mekân açısından incelenmesini konu edinmektedir. Bu bağlamda çalışmada, İslam hukukundaki temel anlayışın istishab mantığından hareketle helaller olduğu, haramların ise istisnaî nitelik taşıdığı düşüncesi temel alınmış; haramlar, zaman ve mekân fikri ekseninde analiz edilmiştir. Çalışmamızın birinci bölümünde, haramların temelini teşkil eden teklifi hükümler incelenmiş ve böylece haramların İslam hukuk usulündeki yerinin gösterilmesi amaçlanmıştır. Birinci bölümün devamında, haram hüküm kategorisi daha detaylı tarzda analiz edilmiş, böylece çalışmanın ikinci ve üçüncü bölümleri olan zamana ve mekana dair haram hükümlerin fikrî arka planı ortaya konmuştur. İkinci bölümde ise çalışmanın ana konularından olan haram hükmünün zamansal analizi yapılmış, İslam hukukunda belli zaman dilimlerinde yer alan haram hükümlerden haram aylar, mekruh vakitler, bayram günleri, Cuma vakti ve mukaddes günler ele alınmış; önce o hükümlere kaynaklık eden deliller incelenmiş, daha sonra ise delillerden elde edilen hükümler gösterilmiş, konu sonlarında hükümlerin hikmetlerinde dair tahliller yapılmıştır. Çalışmanın üçüncü bölümünde ise haram, mekan ekseninde araştırılmış, Mescid-i Haram, Mescid-i Nebevî, mescitler, özel meskenler ve uluslar arası toplumun tasnifini ifade eden darulharb, darulislam haram-mekan ilişkisi kapsamında değerlendirilmiştir. İkinci bölümde olduğu gibi, öncelikle bu konuların dayandığı deliller sunulmuş, ardından meselelere dair hukukî tahliller ortaya konulmuştur. Bir önceki bölümde olduğu gibi bu bölümde de hükümlerin hikmetlerine dair analizlere yer verilmiştir. Sonuç bölümünde, elde elde edilen neticeler sunulmak suretiyle çalışma tamamlanmıştır."
