abstract: "Ortadoğu ve Müslüman ülkelerinin finans dünyasında karşılaştıkları en dikkate değer gözlemlerden biri, son otuz yıl içerisinde küresel gelişimdeki büyümeye bağlı olarak İslami sermaye piyasalarının varlık yönetimindeki artışta gözlemlenen performans ve kapasitesinin artmasıdır. Bu çalışmanın amacı, İslami servet planlamasının geleneksel modelden nasıl farklılaştığına dair temel anlayışları analiz etmek, İslami varlık planlaması ile geleneksel varlık planlaması arasındaki farkı ortaya koymaktır. Bu çalışmada şu soruların ele alınmaktadır: Kuran'dan türetilen bilginin İslami varlık yönetimi geleneksel varlık planlaması, yatırım, emeklilik planlaması, yaşam tarzının korunması, tekafülün planlanması, portföy tahsisi, geleneksel hisse senetleri, emtianın optimize edilmiş Portföy 'üne ait risk getiri profili ile nasıl kıyaslanabilir? İslami varlık yönetimi özel bankalarda Müslüman müşteri için tercih sebebi olmaktadır. Bundan dolayı bu çalışmada servet yönetimiyle alakalı yaklaşımlar kullanılmıştır. Saha araştırması olarak J.SAFRA SARASIN Bankası'ndaki gözlemlerden yararlanılmıştır. Bu banka hem islamî hem de geleneksel varlık yönetimi hizmetleri sunan, İsviçre'deki en eski özel bankalardan birisidir. İslami finans ilkeler ve hedefler bakımından geleneksel modelden farklıdır. Müslüman yatırımcılar için dini prensiplere dayalı, alternatif bir varlık yönetimi sistemi ihtiyacını karşılamıştır."
