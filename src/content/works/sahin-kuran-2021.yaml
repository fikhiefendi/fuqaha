abstract: "Ceza yargılamasında kabul edilen ispat vasıtalarını Kur'ân ve sünnet bağlamında ele alan bu çalışma bir giriş ile üç bölümden oluşmaktadır. Giriş bölümünde bu tezin yazılmasına sevk eden âmiller ile tezin amacı, sınırları, yöntemi ve literatür gibi teknik konular üzerinde durulmuştur. Ceza hukukunun amacı, ilkeleri, ceza yargılamasında kullanılan deliller ile hâkimin bu delilleri değerlendirirken uyması gereken temel ve etik ilkeler, ceza hukukunun önemli temel taşları olarak tezin muhtevasını oluşturmaktadır. Birinci bölümde ceza yargılamasının önemi ve meşruiyetini naslar açısından ele aldıktan sonra, cezanın amacı konu edilmiştir. Cezanın amacı üç başlık altında ele alınmış; Batı kaynaklı hukuk ekollerinin ilk çağlardan itibaren cezanın amacına dair teorileri ve İslâm doktrininde cezanın amacının kısaca sunulmasının akabinde Kur'an naslarında kelime tahlilleri yapılmak suretiyle ceza ile ulaşılmak istenen hedefler ortaya konmaya çalışılmıştır. İkinci bölümü oluşturan ispat ve ispat vasıtaları, İslâm doktrinindeki görüşler ve delilleri, getirilen eleştiriler ile birlikte verilmeye çalışılmıştır. Ayetlerin birbirini açıklaması usulü ile bir hikmete ulaşılabildiğinde bu bölümler \"naslarda kadının şahitliği, Kur'ân-ı Kerîm'de gayrimüslimin şehâdeti, Kur'ân âyetleri ışığında karînenin taksimi, bilirkişilik gibi başlıklar altında işlenmiştir. Üçüncü bölümde, hakimin delil değerlendirmesinde temel alması gereken denge, adâlet ve hakkaniyet kavramları üzerinde durulmuş, etik ilkelerin ışığında hâkimin konumu ve yargılaması arasındaki bağlantıya yer verilmiştir. Ceza hukuku sistemlerinde görülen bir takım yanlış uygulama ve haksızlıklar bu tezin yazılmasına bizi sevk etmiş, evrensel adalete ve huzura bir katkıda bulunmak niyeti ile yola çıkılmıştır. Yer yer Batı kaynaklı hukukların, yer yer klasik İslâm hukuk doktrininin ve çağdaş fakihlerin görüşlerinin eleştirel bir şekilde ele alındığı bu çalışmada, cezanın amacı, kadının ve gayrimüslimin şehadeti, karînenin yeri, İslâm ceza muhakemesinde ispat sistemi, hâkimin takdir yetkisi ve delil değerlendirmesinde uyması gereken ilkeler hususunda Kur'ân ve sünnet ışığında öneriler getirilmiştir. İspat vasıtalarından hâkimin şahsî bilgisinin meşruiyetinin olmadığı, ceza hukukunda önemli bir yer işgal etmeyen yazılı delillerin bilimsel gelişmeler sayesinde kesinlik kazanması sebebiyle takdirî deliller arasında sayılması gerektiği ortaya konulmuş, ikrar ve yemin konularında ise yeni bir görüş sunulamamış, genel bilgi verilmekle yetinilmiştir. Anahtar kelimeler: Cezanın amacı, ceza hukuku ilkeleri, ispat, kadının ve gayrimüslimin şahitliği, yazılı deliller, hâkimin şahsî bilgisi, karîne, bilirkişi, denge, adâlet, hakkaniyet, kıst, etik ilkeler."
