abstract: "Araştırmamızda Bûtî'nin hayatı, eserleri, ilmî kişiliği ve eserlerinde ortaya ‎koyduğu fıkhî çözümlemelerden hareketle hukuk anlayışını ortaya koymaya çalıştık. ‎Araştırmamız bir giriş, üç bölüm, sonuç ve kaynakçadan meydana gelmektedir. ‎ Birinci bölümde, Bûtî'nin hayatı, kişisel yönü, ilmî kişiliği ve eserleriyle beraber ‎Bûtî'nin faaliyetlerini, onu etkileyen şahsiyetleri, tasavvuf anlayışı ve onunla ilgili ‎yapılan çalışmaları ele aldık. ‎ İkinci bölümde, Bûtî'nin usûl-ı fıkıhla ile ilgili görüşlerine yer verdik. Ayrıca, ‎Bûtî'nin içtihâd, tecdît, ve mezheplerle ilgili görüşlerini ele aldık.‎ Üçüncü bölümde ise, Bûtî'nin furû-ı fıkıhla ilgili önemli bazı görüşleri, ‎gündemdeki tartışmalı dînî konular ve çağdaş meseleler hakkında verdiği bazı ‎fetvalarına yer verdik.‎ Anahtar Kelimeler ‎ Bûtî, fıkıh, ictihâd, selefî, mezhep"
