abstract: "Çalışmamız; anlaşmalı boşanma davalarını konu edinmekle, anlaşmalı boşanma davalarının tarihsel gelişim içindeki yerini, anlaşmalı boşanmanın İslam Hukuku, Roma Hukuku ve Kara Avrupası'ndaki yeri ile özellikle Türk Hukukundaki yerini, anlaşmalı boşanma davasının şart ve usullerini, çekişmeli boşanma davaları ile kıyasen incelenmesini, anlaşmalı ve çekişmeli boşanma davalarının doğurduğu hukuki sonuçlar ile eşler ve çocuklar yönünden kişisel ve mali sonuçları yer almaktadır. Konumuza ilişkin yürürlükten kalkan Medeni Kanun ile yürürlükteki Medeni Kanun karşılaştırma ve değişikliklerine de değinilmiştir. Gerek anlaşmalı boşanmalarda gerekse de çekişmeli boşanma davaları neticesinde özellikle çocuklar yönünden ortaya çıkan sonuçları ile eşlerin çocuklara ve birbirlerine karşı görev ve yükümlülüklerinden de ayrıca bahsedilmiştir. Çocuklar yönünden; velayet, velayetin kaldırılma ve değiştirilme sebepleri ile kişisel ilişki konuları da gerek anlaşmalı boşanmada gerekse de kıyasen çekişmeli boşanma davalarında örnekler verilerek irdelenmiştir. Hukukumuza yeni giren ortak velayet kavramı ve getirdiği yeniliklere de anlaşmalı boşanma yönünden değinilmiştir. Eşler yönünden ise hem anlaşmalı hem çekişmeli boşanma davalarında mali ve kişisel doğacak sonuçlardan bahsedilmiştir. Arabuluculuğa ve özellikle aile arabuluculuğuna da değinilmiştir. Çalışmamız sırasında doktrinden ve hukuk duayenlerinin görüşlerinden ve özellikle Yargıtay kararlarından yararlanılmış ve kıyaslamalar yapılarak karşılaştırılmalı görüşlere de yer verilmiş, konulara ilişkin kanaatlerimiz ile uygulamadan örneklere de yer verilmiştir."
