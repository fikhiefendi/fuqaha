abstract: "Osmanlı kadı sicilleri, sadece mahkemeye intikal etmiş hukukî anlaşmazlıkları ve kriminal hadiseleri değil, davaların içeriğine bağlı olarak dönemin idarî, malî, iktisadî, içtimaî ve kültürel hayatına dair de birçok bilgiyi içerirler. Birinci el kaynak hüviyeti taşıyan bu siciller, bilhassa ilgili oldukları şehrin tarihini aydınlatmada ve şehir tarihi çalışmalarında büyük katkılar sunarlar. Şehir tarihiyle ilgili kaynakların sınırlı olması da, şer'iyye sicillerini dikkate almayı zorunlu hâle getirir. Türkiye Cumhuriyeti Cumhurbaşkanlığı Devlet Arşivleri Başkanlığı'nda Düzce Şer'iyye Mahkemesi tarafından tanzim edilmiş 1885-1908 yıllarına ait 33 adet şer'iyye sicili bulunmaktadır. Bu şer'iyye sicilleri, akademik çalışmalarda yapılan sınırlı sayıdaki atfın dışında henüz herhangi bir çalışmaya konu olmuş değildir. Bu yönüyle alanında ilk olma özelliği taşıyan bu çalışmada 1153 numaralı Düzce Şer'iyye Sicili ele alınarak Düzce tarihiyle ilgili sınırlı sayıdaki literatüre katkıda bulunmak amaçlanmıştır. Çalışma konusunu oluşturan 1153 numaralı Düzce Şer'iyye Sicili, Hicrî 14 Recep 1312 ila 28 Zilkade 1312 (Miladî 11 Ocak 1895 ila 23 Mayıs 1895) tarihleri arasını yani takriben 5 aylık bir zaman dilimini içine alır. Toplam 48 yapraktan ibaret olan bu Şer'iyye Sicili transkribe edilmiş ve ortaya çıkan veriler ışığında 1895 yılı Düzce'sinin idarî, iktisadî, içtimaî, demografik ve kültürel hayatına dair tespitlerde bulunulmaya çalışılmıştır. Öyle görünüyor ki 1895 Düzce'sinin kadı nâibi verâset, nikâh, talak ve nafaka gibi aile hukukuna müteallık meselelerin yanında satış, alacak-verecek, kayıp hayvan, isbât-ı rüşd ve vakfiye konularıyla da ilgilenmek durumunda kalmıştır."
