abstract: "Tanzimat Dönemi boyunca gerçekleşen kanunlaştırma hareketleri ve aile hukuku alanında yapılan irâde-i seniyye, nizamname, ilanname gibi düzenlemeler Hukuk-ı Aile Kararnamesi'nin hazırlanmasıyla neticelenmiştir. Yerli bir kanun olan Hukuk-ı Aile Kararnamesi Osmanlı Devleti'nde sonuçları görülecek kadar uzun süreli olamasa da İslam dünyasında uzun vadeli ve önemli etkiler bırakmıştır. Hukuk-ı Aile Kararnamesi Müslüman, Hıristiyan ve Yahudi olmak üzere üç din mensuplarıyla ilgili evlilik ve boşanmaya dair hükümler ihtiva etmektedir. Kararname'de Müslümanlara ilişkin hükümler zamanın şartlarının değişmesi ve ortaya çıkan bazı problemlere Hanefî mezhebi içerisinde çözüm bulunamaması gerekçesiyle Hanefî mezhebine bağlı kalınmadan diğer Sünnî mezheplerden -Şâfiî, Mâlikî, Hanbelî- ve gerektiğinde mezhepler dışına çıkılarak İbn Şübrüme gibi müçtehitlerin görüşlerinden istifade edilerek hazırlanmıştır. Kararname'de Müslümanlar için mevcut hükümler gayrimüslimler için geçerli değilse bu takdirde onların kendi dinlerine uygun hükümler konulmuştur. Bu çalışmada Osmanlı Devleti'nin Tanzimat Dönemi'ndeki kanunlaştırma hareketlerinden başlanmış, aile hukukuna dair düzenlemelerle yer verilmiş ve Hukuk-ı Aile Kararnamesi çeşitli yönleriyle ele alınmıştır. Konuya hazırlık olması açısında bahsedilen minvalde genel bilgiler verildikten sonra Hukuk-ı Aile Kararnamesi'nin evlilikle ilgili hükümleri incelenmiştir. İlgili hükümler İslam mezheplerine muvafık oluşu yönüyle tahlil edilmiş bunun yanı sıra yeri geldiğinde tercih edilen görüşün kanunlaştırma gerekçelerinden de bahsedilmiştir. Ayrıca diğer din mensuplarına dair hükümler bu dinlerin kaynaklarına uygunluğu yönüyle analiz edilmiştir. Sonuç olarak Kararname'nin Müslümanlarla ilgili hükümlerin büyük çoğunluğu Sünni mezheplere dayandırılsa da İslam hukukuyla tam uygunluk arz etmeyen hükümlerin varlığı da mevcuttur. Bunda hazırlandığı dönemin etkileri büyük rol oynamıştır. Gayrimüslimlerle ilgili hükümlerde az da olsa Kararname'nin kendi içerisinde çelişkilerin olduğu görülmüştür."
