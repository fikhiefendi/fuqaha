abstract: "Şer'iyye sicilleri, Kadıların görevleri gereği mahkemelerde verdikleri hükümleri, merkezden gelen belgeleri ve sorumlu oldukları yerlerdeki önemli olayları kaydettikleri defterlerdir. Bu siciller, kadı ve naiblerin mahkemelerde hüccet, ilâm, maruz, mürasele şeklinde kaydettikleri hükümleri, tayin beratlarını, buyruldu, tezkire, tahrirleri geçtikleri kaza, kasaba ve köylerde olan önemli olaylara dair kayıtlar ihtiva etmektedir. Şer'iyye Sicillerindeki konular bir kaza idaresinde meydana gelebilecek her türlü olay ve düzenlemeler ile tarihi gerçekleri kapsar. Şer'iyye sicillerinden, o dönemin ekonomik, sosyal, kültürel ve hukuki durumunu, askerlikle ilgili bilgileri, savaş öncesi ve sonrası toplumsal olaylarını çıkarmak mümkündür. Bu çalışmada, 163 Numaralı Arapgir Şer'iyye Sicil Defterinin tanıtımı, sicilin kaydedildiği Arapgir hakkında değerlendirme, hükümlerin özeti ve hükümlerin konulara göre tasnifi yapılmıştır. 163 No'lu defterden yararlanılarak 1308–1311 (1892–1895), üç yıl içerisindeki Arapgir'in sosyal, kültürel, ekonomik, hukuki ve siyasi hayatı hakkında bilgi sahibi olmaktayız."
