abstract: "Osmanlı Devleti'nin son döneminde yetişen en önemli hukukçularından birisi hiç şüphesiz Ali Haydar Efendi ve en önemli İslam hukuku kaynaklarından birisi de onun Mecelle üzerine yazmış olduğu, Mecelle'nin resmi yorumu derecesine yükselen ve İslam hukuku konulu araştırmaların yakın tarihe ait başvuru kaynağı Dürerü'l-Hükkâm şerhidir. Ali Haydar Efendi'nin bu eseri İslam Hukuku'na vakıf olabilmek için incelenmesi gereken eserlerin başında gelir. Hazırlanan bu çalışma böyle bir gayretin neticesidir.Tez iki bölümden oluşmaktadır. Birinci bölümde müellifin hayatı, ilmi şahsiyeti ve eseri Dürerü'l-Hükkâm ve bu eserin Kitabü'l-İkrar bölümünde, Ali Haydar Efendi'nin alıntı yaptığı kaynak eserler hakkında kısa bilgiler verilmiştir.İkinci bölümde ise Kitabü'l-İkrar bölümünün latinizesi yapılmış ve müellifin atıfta bulunduğu kaynak eserlere ulaşılıp alıntıların bu eserlerin hangi cilt ve sayfalarından yapıldığı belirtilmiştir."
