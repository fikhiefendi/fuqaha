abstract: "Bu çalışmada, İsmâîl es-San'ânî'nin“Sübülü's-Selâm Şerhu Bulûği'l-Merâm”adlı eserinde Hanefi mezhebine ait görüşlerin isabetli olup olmadığının tespit edilmesi amaçlanmıştır. Çalışmamız giriş ve iki bölümden oluşmaktadır. Çalışmamızın giriş kısmında araştırmanın konusu, amacı, kaynakları ve yönteminden bahsedilmiştir. Birinci bölümde San'ânî'nin hayatı, eserleri ve Zeydi mezhebinin karakteristik özelliklerinden bahsedilip ardından tezin kaynağını oluşturan, Sübülü's-Selâm Şerhu Bulûği'l-Merâm adlı eseri tanıtılmıştır. Daha sonra, San'ânî'nin bağlı olduğu belirtilen Zeydiye'nin Hadeviyye koluna ait bazı fıkhi görüşler örnek verilmiştir. İkinci bölümünde ise Sübülü's-Selâm adlı eserde Hanefi mezhebine ait olduğunu ifade ettiği görüşler tespit edilip Hanefi mezhebinin kaynaklarından bu görüşlerin nispeti tahkik edilmiştir. Tezde toplam 314 görüş incelenmiş, bu görüşlerin 29 tanesinin hatalı olduğu görülmüştür. Bu hatalar daha çok namaz, alışveriş, nikâh, cinâyetler ve cihad bahsi konularında bulunmaktadır."
