abstract: "Finansal dâhil olma ya da finansal erişim bireylerin her hangi bir finans kuruluşunda hesabı olması olarak ifade edilmektedir. Yapılan akademik çalışmalar, yüksek finansal dahil olma oranına sahip olan ülkelerin daha yüksek refah düzeyinde olduklarını göstermiştir. Bu nedenden dolayı finansal dahil olma oranının yüksek olması ülke refahının artırılması için kaçınılmazdır. Ancak finansal dahil olma oranının artmasının önünde arz ve talep yönlü olmak üzere engeller vardır. Düşük finansal okuryazarlık düzeyi, finansal dahil olmanın önündeki talep yönlü engellerin başında gelmektedir. Diğer taraftan Dünya'da %7 olan dini nedenlerden dolayı finansal dâhil olmama davranışı oranı, D-8 ülkeleri grubunda %9,7 olarak ölçülmüştür. İslam Bankaları (Türkiye'de ki adı ile Katılım Bankaları) Dini hassasiyeti olan bireylere dini kurallara uygun biçimde, mevduat bankası hizmetlerinin benzerlerini sunarak bu kişilerin finansal dahil olma eğilimlerini artırmada en önemli arayüz olarak karşımıza çıkmaktadır. Dini hassasiyet taşıyan bireylerin finansal dahil olma düzeylerini artırabilmek adına finansal okuryazarlık düzeylerinin bilinmesi son derece önemlidir. Bu çalışmada İslam finans okuryazarlığı düzeyinin artırılabilmesi adına, mevcut durumu ortaya koymak üzere bir İslami finans okuryazarlığı endeksi çalışması yapılmıştır. Bu amaçla İslami finans okuryazarlığı genel endeksi yanında 3 ayrı endeks oluşturulmuştur. Çalışma sonunda İslami finans okuryazarlığı genel endeksi %58 olarak hesaplanmıştır."
