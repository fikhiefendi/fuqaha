abstract: "İsticrar satışı, bir diğer adıyla açık hesaplı satım, peyderpey alınan malların bedelinin başta yahut sonda toplu bir şekilde ödendiği alışveriş silsilesidir. Teâti yoluyla teslim edilen ve bedelinin ödendiği esnada ma'dûm hâle gelen malın, ödeme anındaki piyasa değeri üzerinden satışa konu edildiği akitleri de kapsamına aldığından isticrar; teâti, ödeme anındaki piyasa değeriyle satış, tüketilmiş malın satışı gibi hususlarla özdeşleştirilmiştir. Hatalı bir yaklaşımın mahsulü olan bu durum, isticrar kapsamında olmayan çağdaş uygulamaların isticrar hükümleri bağlamında ele alınmasına yol açmıştır. Bu çalışma, isticrarın klasik fıkıh kaynaklarındaki karşılığını tespit ederek isticrar ile ilişkilendirilen çağdaş uygulamaları fıkhî açıdan analiz etmeyi amaçlamaktadır. Çalışmada, tedarik sözleşmeleri ile ön ödemeli araçların tamamının doğrudan isticrar olarak değerlendirilemeyeceği ortaya konulmuştur. Su, elektrik, doğal gaz gibi mal alımlarına dayanan abonelik sözleşmeleri, ön ödemeli ve/veya sonradan ödemeli isticrar olarak değerlendirilmiş; internet ve telekomünikasyon gibi hizmet alımlarına dayanan abonelik sözleşmeleri ise isticrar olarak değerlendirilmemiştir. Tarım ürünlerinin ürün senedi mukabilinde emanete bırakılması ve yeniden değerlendirme metoduyla konut satımı uygulamalarının da isticrar kapsamında olmadığı kanıtlanmıştır. Ayrıca isticrar, hâlihazırdaki küçük hacmine rağmen katılım bankacılığı sisteminde murâbahanın alternatifi olma potansiyelini barındırmaktadır. Ancak isticrarın finansal bir ürün olarak yapılandırılmasında uygulama ve anlayış birliği mevcut değildir. Bu doğrultuda isticrara dayalı finansal ürünler tahlil edilmiş, finansal ürün olarak kurgulanan isticrara dayalı işlemlerin murâbahadan bağımsızlaştırılması gerektiği kanaatine varılmıştır."
