abstract: "İnsanın var olduğu ilk günden beri insan hayatını etkileyen en önemli ve en büyük unsurlardan biri kuşkusuz ekonomidir. Ekonomi ister bireysel isterse de toplumsal olsun hayatın her alanına etki etmiştir. Bireyi ve toplumu etkileyen her unsur da ekonomiyi de etkiler. Kapitalizm ve komünizm arasındaki mücadeleye son iki asırda ekonomi de dâhil edilmiştir.Mevdûdî, özellikle ekonomi yönünden bu aşırı ideolojinin baskısı altında bulunan insanlığa İslâm ekonomisini alternatif olarak İslâmî bir sistemin var olduğunu bildirmek istemiştir. Mevdûdî,İslâm ekonomisinin kaynağı Kur'ân-ı Kerîm'de bulunan zekât, fidye, sadaka ve infakı; sünnet-i seniyyede var olan bütçeleme, vergi sistem gibi uygulamaları bu iki kaynaktan besleyerek ictihadî hükümler ortaya çıkararak vermiştir.Özellikle yaşadığı bölge olanHaydarabad/Hindistan'da İslâm Para Fonu ve İslâm Bankacılığı'nın ilk uygulamalarının çıkıp geliştiğini zikretmektedir. Ayrıca tüm semavi dinlerin faizi haram kıldığını ve özellikle İslâm dininin faizi haram kılmasının yanında çözüm yollarını da sunduğunu aktarmaktadır. Bu konuda en önemli çözüm yolukarz-ı hasendir. Mevdûdî, göre faiz ve bu iki ideolojiyle mücadele etmenin birçok yönteminin yanında devlet arazisinin tahsisi, ahlaklı ekonomi, müşterek borçlanmanın devletin elinde olması gibi yöntemlerin olduğuna dikkat çekmiştir. Mevdûdî'nin ekonomik meseleler üzerine yazdığı eserler beş ana temel üzerinde durmaktadır. Bunlar; insancıl, verimli ve adil ekonomi, disiplinler arası yaklaşım, verimlilik, yeni fikir ve yaklaşımlar ve paranın ekonomide birincil rol oynamasıdır. Diğer taraftan faize karşı karz-ı hasen, mudarebe(kâr paylaşımı) ve zekât uygulamalarının var olduğunu savunmaktadır."
