abstract: "XVI yüzyılda Osmanlı balkan coğrafyasında yaşamış olan Üskübî Pîr Mehmed Efendi İstanbul'da ki ilim tahsilinden sonra Üsküp şehrine yerleşmiş ve burada vefat edene kadar uzun yıllar fetvâ ve ilim ile meşgul olmuştur. Bulunduğu müftülük vazifesi esnasında hayatın her yönü ile ilgili kendisine yöneltilen soruları“Muînu'l-Müftî Fi'l-Cevâb Ala'l-Müsteftî”eserinde toplamıştır. Bu eser uzun yıllar kendisine başvurulan bir kaynak haline gelmiştir. Yaptığımız çalışma ile biz, bu kıymetli eserin derlenmesi esnasında ve Osmanlı döneminde ilmî bir eserin meydana getirilmesi anında istifade edilen kaynakları ve bu dönemde Osmanlı-Balkan coğrafyasında mevcut olan ailevî, ticarî, toplumsal, kültürel ve idarî yapıyı yansıtan eserin gün yüzüne çıkarılmasıdır. Bu yönü itibariyle eser zengin bir muhtevaya sâhiptir."
