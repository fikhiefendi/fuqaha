abstract: "Ebussuud Efendi, 30 Aralık 1491 tarihinde Çorum'un İskilip ilçesinde doğdu. İskilipli Şeyh Muhyiddin Mehmed Efendi'nin oğludur (anne tarafından da Ali Kuşçu'nun torunudur.). 1530'larda İstanbul, Bursa ve Rumeli'de kadılıklarda bulundu. Rumeli Kazaskerliği?nden sonra Sultan I. Süleyman devrinde 1545 tarihinde Şeyhülislamlığa getirdi. Başarılı olduğu için ölümünden sonra II. Selim devrinde de görevini sürdürdü. Kıbrıs'ın fethi gibi olayların kabulünde önemli rol oynadı. Sadece Osmanlı topraklarında değil bütün İslam coğrafyasında itibar sahibi ve eserleri günümüzde de kıymetini koruyan büyük bir İslam âlimidir. Önemli fetvalar hazırlayan Mehmed Ebussuûd, aynı zamanda bir şairdi. Birçok âlim yetiştirdiği için İlmiye sınıfı daha uzun bir müddet zayıflamadı. İrşadü?l-Aklu?s-Selim ila Mezaye?l-Kitabi?l-Kerim adlı tefsiri yüzyıllardır alanında en önemli eserlerden biridir. Cihad sözcüğü c-h-d kökünden türemiş,"
