abstract: "Bireysel emeklilik sisteminde yapılan değişiklik ile faiz içermeyen yatırım araçları sisteme dahil edilmiştir. Faiz içermeyen sermaye piyasası enstrümanlarının sisteme dahil edilmesi ile katılım yatırım fonları oluşturulmuştur. Katılım bankaları tarafından bireysel emeklilik şirketleri hassasiyeti bulunan bireyler sisteme dahil olmaya başlamıştır. Katılım emeklilik şirketinin kurulması ile diğer emeklilik şirketleri ve Katılım emeklilik şirketi ile katılım emeklilik yatırım fonları hızlı bir şekilde oluşturulmuştur. Bireysel emeklilik fonlarının amacı, bireysel emeklilikte uzun vadeli olarak istikrarlı bir getiri elde etmektir. Bu çalışmada, Türkiye'de faaliyet gösteren bireysel emeklilik şirketlerinin katılım fonları ile katılım dışı fonlar karşılaştırılmıştır. Fonların karşılaştırılmasında benchmark modeli kullanılmıştır. Bu fonlar kendi aralarında sınıflama yapılmış ve getirileri karşılaştırılmıştır."
