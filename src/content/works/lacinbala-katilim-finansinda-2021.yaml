abstract: "Kişi ve kurumların finansmana erişim ihtiyacı, finansal sistemlerin kurulmasını zorunlu kılmıştır. Finansal sistemde kredi (borç) sistemi ve ortaklık sistemi olmak üzere iki tip finansman modelinden bahsedilebilir. Geleneksel finans anlayışı daha çok borç sistemine dayanmakta olup, aynı zamanda sistemin sürekli kriz üretmesinin de başlıca nedenleri arasındadır. Katılım finans anlayışının ortaklık finansmanını teşvik eden yapısı, ekonomik sistemin sürekli kriz üretmesine yönelik önemli bir çözüm sunmaktadır. Mevcut katılım finans uygulamaları daha çok kredi sistemini çağrıştırsa da, katılım finansın özündeki mesaj, ortaklık sistemine işaret etmektedir. Ancak mevcut katılım finans uygulamalarına bakıldığında,“kopyala-yapıştır”anlayışının ötesine geçilemediği ve öze değil şekle odaklanıldığı görülmektedir. Dolayısıyla, bu çalışmada finans teorisinin üç temel sac ayağı olan bankacılık, sigortacılık ve sermaye piyasaları özelinde bu taklitçi yapıya yönelik tespitler, piyasa başarısızlıkları dikkate alınarak sunulacaktır. Akabinde, faiz ile kar payı arasındaki korelasyonu kıran ve kar payının, faiz yerine ticari karı kıstas (benchmark) ölçüsü olarak kullandığı ve kredi sistemi yerine ortaklık sistemine dayalı bir model önerilecektir. Bu modelin işlerliği devletin düzenlemesine ve desteğine ihtiyaç duymaktadır. Kurulacak sistemin temelinde devlet yer alacaktır. Dolayısıyla, önerilecek sistemin kamu ekonomisi ilkelerini benimsemesi ve kamusal müdahale yöntemlerinden kamu girişimciliğine dayanması gerekecektir."
