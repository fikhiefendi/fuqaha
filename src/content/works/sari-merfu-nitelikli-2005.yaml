abstract: "Tezin konusu, riba ile ilgili merfu hadislerin sıhhat derecelerini tespit ve tenkitetmektedir. Amacı ve önemi ise riba gibi tamamı hadis üzerine bina edilmiş birkonunun hadislerinin sıhhat dereceleri tespit ederek bu konudaki hükümleringüvenilirliğine de bir açıklık getirmektirTezin birinci bölümünde ribayı tarif eden hadisleri ele aldık Alt başlıklar olarak ta,ribe'l-fadl, ribe'n- nesieye ve kalitesiz hurma karşılığı kaliteli hurma almaya dairhadislere yer verdik.kinci bölümde ribayı kötüleyen hadisleri ele aldık. Alt başlıklar olarak ta, riba yiyenilanetleyen-nehyeden hadisler, yedi ve doku günahı sayan hadisler, ribanın tozununbulaşamadık insan kalmayacağıma dair hadisler, cahiliyye ribasının ortadankaldırıldığına dair hadisler ve ribayı kötüleyen diğer hadislere yer verdik.Üçüncü bölümde riba ayetleriyle ilgili hadisleri ve riba ile ilgili diğer hadisleri ele aldık.Alt başlık olarak, riba ayetinin nazili esnasında olanlara dair hadisler, riba ayetinin nazilolan son ayet olduğuna dair hadisler ve riba ile ilgili diğer hadislere yer verdik. Sonbölümdede hadislerin genel bir değerlendirmesini yaptık.Sonuç olarak, ribaya dair yapılan çalışmalarda hadislerin metinleri dikkate alınıpsenedlerinin sıhhatine bakılmadığı, bu durumunda yanlış sonuçlara ulaştırdığınıbelirledik."
