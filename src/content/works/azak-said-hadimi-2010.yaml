abstract: "Ebû Saîd el-Hâdimî'nin Mecâmiu'l-Hakâik adlı usûl-i fıkha ait eserinin son kısmında yer alan 154 adet kavâid-i külliyelerin, İslam hukuku literatürü içindeki yeri ve önemi ortaya konulmak istenmiştir. Bunun için fıkhın tedvin dönemi öncesinden başlayan kavâid-i külliyelerin zaman içerisinde gelişmesi ve ilerlemesiyle oluşan kavâid mirasının son noktası olan Mecelle'ye etkisi araştırılmaya çalışılmıştır.Bu çalışmanın sağlıklı bir şekilde yapılabilmesi için Hâdimî'ye kadar oluşan kavâid literatürünün genel olarak tespit edilmesi gerekmektedir. Bu sebeple kavâid alanında yazılan kitaplar (Eşbâh, Kavâid, furûk, Fevâid?) ile furû fıkıh kitapları (özellikle Hanefî fıkıh kitapları olan Mebsût, Bedâyî, Hidâye) ve usûl-i fıkıh kitapları (Serahsî ve Pezdevî'nin usûl'ü ile Taftazâni'nin Telvîh'i) içerisinde yer alan kâideler tespit edilmeye çalışılmıştır. Ayrıca kavâid ilminin doğuşu, gelişmesi ve bu alanda eser yazanlar hakkında sistematik bilgi verilmeye çalışılmıştır.Hâdimî kâidelerini yazarken kendisinden önce hangi müelliflerden ne oranda faydalanmıştır? Hâdimî kavâid literatürüne ne kadar kâide kazandırmıştır? Kavâid yazarları kendilerinden öncekilerden ne kadar kâide almış ve kendisi buna ne kadar ilave yapmıştır? Mecelle hazırlanırken Hadimî'den ne kadar istifade edilmiştir? Bunlar bizim için merak konusu olmuştur. Bu sorulara cevap ararken literatürdeki kavâidler bilgisayar ortamına aktarılmış, tarihsel gelişim sırasına göre gruplamalar yapılmış, Hâdimî'nin kâideleri ile karşılaştırılması yapılmıştır. Bu karşılaştırmalar İbn Nüceym, Süyûtî, İbn Receb el-Hanbelî, Bedreddin ez-Zerkeşî, Tacuddin es-Subkî, Hidâye, Bedâyî, Mebsût ve Usûl-i fıkıh arasında yapılmıştır.Bu çalışmalar sonucunda Hâdimî'nin kâidelerinin ilk defa ortaya çıkışı ve tarihi süreç içerisinde kimler tarafından kullanıldığı ve Hâdimî'nin kendisinin bunlara ne kadar ilavede bulunduğunu tespit etmiş olduk. Ayrıca Mecelle'nin 99 maddesinin ne kadarının Hâdimî'nin kitabından ve bizzat kendisinin oluşturduğu kâidelerden alındığının tespiti bu tezimizle ortaya konmaya çalışılmıştır."
