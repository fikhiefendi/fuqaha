abstract: "Endonezya, kamu iktisadi teşebbüsleri BRI Syariah, BNI Syariah ve Bank Mandiri Syariah adlı üç İslami bankayı Bank Syariah Indonesia adı altında birleştirmiştir. Bu birleşme, sınırlı sermaye, yüksek fon maliyeti ve genellikle aşırı likidite yaşayan İslami bankacılığın durumu gibi, İslami bankacılığın karşılaştığı sorunların üstesinden gelme girişimidir. Bu nedenle, bu çalışma birleşme öncesi ve sonrasının etkinliğini ve sağlamlığını analiz etmenin yanı sıra birleşme öncesi ve sonrasının etkinlik ve sağlamlık durumunu karşılaştırmayı amaçlamaktadır. Ayrıca, kullanılan veriler Mali Hizmetler Otoritesinden ve bankaların birleşme öncesi ve sonrası 2017-2022 dönemine ait mali tablolarından alınmıştır. Veriler banka etkinliği için veri zarflama analizi ile analiz edilirken; banka sağlamlığı risk profili, iyi kurumsal yönetim, kazanç ve sermaye (RGEC) yöntemi ile analiz edilmiştir. Bulgular, birleşme öncesi bankaların 2017'nin ikinci çeyreğinde, 2018'de ve 2019'un üçüncü çeyreğinde üç etkinsizlik durumuna sahip olduğunu göstermektedir. Birleşme sonrası bankalar ise 2020'nin üçüncü çeyreğinde 0,99 ve 2021'in dördüncü çeyreğinde 0,98 etkinlik değeriyle iki etkinsizlik koşuluna sahiptir. Dolayısıyla, birleşme öncesi ve sonrası İslami bankalar arasındaki etkinlik karşılaştırma testi sonucunda, birleşme sonrası bankaların daha iyi etkinliğe sahip olduğu bulunmuştur. Çalışma, birleşme öncesi ve sonrası bankaların sağlamlığının sağlık durumlarını ifade ettiğini bulmuştur. Ayrıca, çalışma bankaların birleşme öncesi ve sonrası sağlamlıklarında dolaylı bir fark olduğunu bulmuştur."
