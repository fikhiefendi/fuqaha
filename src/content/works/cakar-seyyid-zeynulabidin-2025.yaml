abstract: "Bu çalışmada Osmanlı padişahı IV. Murad (1623/1640) döneminde Mekke'de meydana gelen Büyük Sel (1039/1630) hadisesi sonrasında Kâbe'nin temelden yıkılıp yeniden inşa edilme süreci ele alınmış, bu hadiseyi aktaran Seyyid Zeynülâbidîn b. Nûreddîn el-Kâşânî'nin (ö.?) kaleme aldığı Müferrihetü'l-Enâm fî Te'sîsi Beytillahi'l-Harâm adlı eseri incelenmiştir. Bu çerçevede eserin Türkçe'ye çevirisi ve değerlendirmesi yapılmış, dil ve üslup özellikleri başta olmak üzere nitelik bakımından eser incelenmiştir. Müellif eserinde bizzat katıldığı bu imar sürecini gün gün kayıt altına almış, en önemlisi de XI/XVII yüzyıl Mekke'sinde bulunan kutsal mekânları irdelemiştir. Eser özellikle Şiî âlimler arasında büyük bir itibar görmüştür. Müellifin Kâbe'nin yeniden inşa sürecine doğrudan katılması ayrıca önemli görülmüştür. Çalışmada Seyyid Zeynülâbidîn b. Nûreddîn'in hayatına değinilmiş, bunun yanı sıra Kâbe'nin XI/XVII yüzyılda yaşanan yıkım ve yeniden imar süreci ele alınarak bu süreci anlatan diğer dönem kaynakları incelenmiştir. Böylece önemli bir tarihi olaya ışık tutulmuş, Kâbe'nin imar tarihine ilişkin süreç incelenerek bu mukaddes yapının tarihsel gelişimi ve mimari evreleri ortaya konulmaya çalışılmıştır."
