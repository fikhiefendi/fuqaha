abstract: "Bu çalışmada, kamulaştırılan taşınmazın, kamu yararı amacı ortadan kalktıktan sonra, eski malikine geri verilmesinin hangi usul ve koşullara bağlı olarak ger- çekleşebileceği konusunda değerlendirmelerde bulunulmuştur. Bununla birlikte geri alma hakkının ortaya çıkışından başlayarak günümüzdeki uygulanabilirliğine kadar uzanan, tarihsel bir süreç ele alınmıştır. Bu kapsamda, Kamulaştırma Kanunu ve di- ğer kanunlardaki geri alma hakkına ilişkin düzenlemeler irdelenmiştir. Ayrıca AİHM ve Yüksek Mahkeme Kararları sonucunda ortaya çıkan somut durumun yasal düzenlemelere olan etkisi incelenmiştir."
