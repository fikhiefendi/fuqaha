abstract: "Nikah; hukukî usullere ve şartlara uyarak evlenmek demektir. İslam dini nikahı (evlenmeyi) helal, zinayı ise haram kılmıştır. Gaye, nikah yolu ile temiz nesil yetiştirmektir. Toplumun düzeninin sağlanması ve korunması için nikahın kaidelerine riayet ederek aile kurmak gereklidir. Tezimizde nikahın duyurulması ve ilan edilerek toplum emniyetinin sağlanması hususu ele alınmış ve önemi vurgulanarak günümüz meselelerine ışık tutmak amaçlanmıştır. Bu amaçla, nikahın tanımı, şartları, günümüzdeki uygulama şekilleri ele alınmış ve tartışmalı konulara yer verilerek günümüz meselelerine çözümler getirilmeye çalışılmıştır."
