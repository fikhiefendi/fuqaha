abstract: "Avrupa Fetva ve Araştırmalar Meclisi; Kur'an, sünnet, icmâ gibi dinin temel delillerine ve kıyas, istihsan, sedd-i zerîa ve maslahat gibi yöntemlere dayanmak suretiyle daha ziyade Avrupa'da vuku bulan ve oradaki müslüman azınlıkları ilgilendiren olay ve sorunlar hakkında kolektif olarak fetva ve karar vermektedir. Bu araştırma, ilgili kurumun verdiği karar ve fetvaları mezheplerin temel kabulleriyle kıyaslamak suretiyle bilimsel değerlendirme yapmayı amaçlamaktadır. Araştırmanın Giriş kısmında fetva, hüküm, içtihat ve aralarındaki farktan söz edilerek heyet içtihadının ne olduğu ifade edildi. Bölüm I'de Avrupa Fetva ve Araştırmalar Meclisi'nin kurumsal yapısı tanıtılarak Meclis'in fetva ve kararlarında ilke edinmeyi taahhüt ettiği iç tüzüğünden bahsedildi. Sonrasında ise Meclis'in yayımladığı araştırma, dergi, oturum, karar ve fetvaları hakkında istatiksel açıklamalarda bulunuldu. Bölüm II'de ise Meclis'in gündemine aldığı bazı fetva ve kararlar, Meclis'in her bir fetva ve kararı çıkarırken itimat ettiği dayanaklara göre kısımlara ayrılıp incelendi. Denilebilir ki Meclis, hüküm kurarken kendi iç tüzüğüne sadık kaldığı gibi Sünnî fıkıh mezheplerinin yaklaşımlarına da bağlı kalmıştır. Buna mukabil çok az meselede dört mezhebin dışına çıkılarak bazı sahabî ve tâbiîn alimlerinin görüşlerine uygun fetva verilmiştir. Ayrıca Meclis'in verdiği bir çok fetva ve kararda maslahat ve örf vurgusu dikkat çekmektedir."
