abstract: "Küreselleşme ve artan rekabet ortamında örgütlerin sürdürülebilirliği, nitelikli işgücünü elde tutabilmelerine ve çalışanların motivasyonunu sağlamalarına bağlıdır. Bu bağlamda araştırma, İslami çalışma ahlakının (İÇA); çalışanların ücret tatmini, örgütsel bağlılık düzeyleri ve işten ayrılma niyetleri üzerindeki doğrudan ve dolaylı etkilerini bütüncül bir model çerçevesinde incelemeyi amaçlamaktadır. Özellikle manevi bir unsur olan İÇA'nın, maddi bir çıktı olan ücret tatmini ile ilişkisi ve bu mekanizmanın örgütsel bağlılık ve işten ayrılma niyetini nasıl şekillendirdiği araştırmanın odak noktasını oluşturmaktadır. Nicel araştırma yönteminin benimsendiği çalışmada, Sakarya ilinde özel sektörde faaliyet gösteren işletmelerdeki 521 çalışandan amaçlı ve kolayda örnekleme yöntemiyle ve anket tekniği kullanılarak veri toplanmıştır. Elde edilen verilerin analizi, yapısal eşitlik modellemesi (PLS-SEM) yöntemiyle gerçekleştirilmiştir. Analiz bulguları, İÇA'nın çalışanların hem ücret tatmini hem de örgütsel bağlılık düzeyleri üzerinde pozitif ve istatistiksel olarak anlamlı bir etkisi olduğunu ortaya koymuştur. Ayrıca yüksek ücret tatmini ve güçlü örgütsel bağlılığın, işten ayrılma niyetini doğrudan azalttığı tespit edilmiştir. Modeldeki aracılık etkileri incelendiğinde; İÇA'nın örgütsel bağlılık üzerindeki etkisinin kısmen ücret tatmini aracılığıyla gerçekleştiği, işten ayrılma niyeti üzerindeki ters yönlü etkisinin ise örgütsel bağlılık üzerinden sağlandığı görülmüştür. Ancak İÇA'nın işten ayrılma niyetini azaltma sürecinde ücret tatmininin tek başına aracı bir rol oynamadığı sonucuna ulaşılmıştır. Bu bulgular, İÇA sahibi bireylerin kazancı sadece maddi bir miktar olarak değil, helal kazanç perspektifiyle değerlendirdiklerini ve kurumda kalma kararlarında manevi sadakatin de belirleyici bir unsur olduğunu ortaya koymaktadır."
