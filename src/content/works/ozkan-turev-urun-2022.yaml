abstract: "Bankacılık kavramının ortaya çıkışı, insanların yerleşik hayata geçtiği ve henüz paranın kullanılmadığı eski çağlara dayanmaktadır. Yerleşik hayata geçiş ile birlikte oluşan ihtiyaç fazlası birikimlerin saklanabilmesi amacıyla bugünkü bankalar ile benzerlik gösteren kurumlara gerek duyulmuştur. Modern anlamda bankacılık faaliyetlerinin ise 1600'lü yıllarda Avrupa'da görülmeye başladığı kabul edilmektedir. Söz konusu bankalar faiz esasına göre faaliyet gösteren kurumlar olarak kurulmuşlardır. Faiz; geçmişten günümüze sosyal, ahlaki ve ekonomik açıdan en çok tartışma konusu olan kavramlardan biri olmuştur. Faiz kavramı, ilkçağ ve orta çağda toplumsal ve ahlaki yönüyle ele alınırken sonraki dönemlerde iktisadi hayatta meydana gelen gelişmelerle birlikte ekonomik yönüyle de incelenmeye başlamıştır. Günümüzdeki mevcut finans sektörü, faiz esasına göre çalışan bir sistem olarak kurulmuştur. Faizsiz bankacılık ise mevcut bankacılık sistemine dâhil olmak istemeyen gerçek ve tüzel kişilerin taleplerini karşılamak üzere alternatif bir finans sistemi olarak ortaya çıkmıştır. Dünyada faizsiz bankacılık, insanların birikimlerini faiz esasına dayalı işlemler ile değerlendirmek istememesi veya birikimlerini faizsiz olarak güvenli bir yerde saklama ihtiyaçlarından doğmuştur. Tarihteki ilk faizsiz finans faaliyetlerinin M.Ö. 20. yüzyılda Babil'de yapıldığı kabul edilmektedir. Modern anlamda faizsiz bankacılık faaliyetleri ise 1960'lı yılların başlarında Mısır'da kurulan Mit Ghamr Tasarruf Bankası ile başlamıştır. Bu banka, dünya genelinde faizsiz bankacılık faaliyetlerinin gelişmesinde önemli bir rol oynamıştır. Önceleri sadece Müslüman nüfusun yoğun olduğu ülkelerde görülmeye başlayan faizsiz bankacılık faaliyetleri günümüzde ABD ve Avrupa ülkelerinde uygulama alanı bulmuştur. Türkiye'de modern anlamda faizsiz bankacılık faaliyetleri ise 1983 yılında yayımlanan Bakanlar Kurulu Kararnamesi uyarınca Özel Finans Kurumları (ÖFK)'nın kurulmasına izin verilmesi ile başlamıştır. Türev ürünler; genellikle riskten korunma veya kâr sağlama amacıyla belirli bir zamanda, belirli özelliklere sahip ve belirli tutardaki bir finansal varlığın belirli bir bedel karşılığında alım-satım işleminin gerçekleştirilmesi için düzenlenen sözleşmelerdir. İlk türev ürün işlemlerinin ilkçağda tarım ürünlerine yönelik yapılan opsiyon işlemleri olduğu varsayılmaktadır. Türkiye'de ise türev ürünlere dair işlemler 1980'li yıllardan itibaren görülmeye başlamıştır. Küreselleşmenin etkisiyle rekabetin arttığı günümüz Türkiye'sinde finansal piyasalardaki belirsizliklerden kaynaklanabilecek risklerden korunabilmek ve bu belirsizliklerden yararlanarak kâr elde edebilmek amacıyla gerçek ve tüzel kişilerin bankalar aracılığı ile türev ürünleri kullanmaya başladığı görülmektedir. Bu çalışmada, Türkiye'de faaliyetlerini sürdürmekte olan katılım bankalarının etkinliklerinin Veri Zarflama Analizi aracılığıyla ölçülmesi ve elde edilen etkinlik skorları içerisinde katılım bankalarının türev ürün kullanımının etkili olup olmadığının SPSS programı kullanılarak uygulanan Spearman Sıra Korelasyon Analizi ile belirlenmesi amaçlanmaktadır."
