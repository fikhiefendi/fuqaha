abstract: "Kur'ân-ı Kerîm'in anlaşılmasında hadislerin ayrıcalıklı bir yeri bulunmaktadır. İlk telif edilen tefsirlerden günümüze pek çok müfessir Kur'ân'ı tefsir ederken rivâyetlerden istifade etmiştir. İbn Akîle kendi dönemine kadar telif edilen rivâyet ağırlıklı tefsirlerden farklı olarak, el-Cevheru'l-manzûm adını verdiği eserini yalnızca merfû ve hükmen merfû rivâyetlerle sınırlandırmayı amaçlamıştır. Tefsirinin mukaddimesinde bu özgün iddiayı dile getiren İbn Akîle, eserinde hiçbir şekilde yoruma yer vermeyeceğini bildirmiştir. Bu çalışmada İbn Akîle'nin mezkûr hedefini ne kadar gerçekleştirebildiğinin ortaya çıkarılması ve bu yöntemle yapılan açıklamaların pratikte nasıl bir sonuca vardığının tespit edilmesi amaçlanmaktadır. Ancak el-Cevheru'l-manzûm'un yaklaşık bin altı yüz varaktan müteşekkil beş ciltlik yazma bir tefsir olması dolayısıyla, eserin bir yüksek lisans tezine konu olabilmesi için sınırlandırılması gerekmektedir. Rivâyet yönteminin, fıkhî hükümleri ihtiva eden âyetlerde daha belirgin bir şekilde tespit edileceği düşünülmektedir. Öte yandan İbn Akîle'nin Hanefî mezhebine mensup olması ve Hanefî mezhebinin hüküm istinbâtında re'ye önem veren bir mezhep olduğu göz önünde bulundurulduğunda, örneklem olarak seçilen ayetlerin ahkâma dair olması anlam kazanmaktadır. Kur'ân-ı Kerîm'de ahkâma dair çok sayıda ayetin bulunması nedeniyle, konu ukûbat âyetleri bağlamında ele alınmıştır. İki bölümden oluşan tezin ilk bölümünde öncelikle İbn Akîle'nin hayatı ve ilmî kişiliğine kısaca değinilmekte ardından el-Cevheru'l-manzûm muhteva, yöntem ve içerdiği temel tefsir meseleleri açısından incelenmektedir. İkinci bölümde ise İbn Akîle'nin kitaplardan hadis tahrîc etme suretiyle telif ettiği tefsiri, ukûbâta dair âyetler üzerinde tümevarım ve metin analizi yöntemleri uygulanarak incelenmektedir. Konunun disiplinlerarası bir alana tekâbül etmesi nedeniyle İslam ceza hukuku açısından İbn Akîle'nin naklettiği hadislerin bilgi değeri tespit edilmeye çalışılmaktadır. Ukûbât âyetleri bağlamında yapılan araştırma sonucunda İbn Akîle'nin merfû hadislerle birlikte çok sayıda mevkûf ve maktû rivâyetleri de tefisine kattığı, özellikle kırâat farklılıkları ile ilgili açıklamalarında lugavî tahlillere girdiği tespit edilmiştir. Öte yandan İbn Akîle'nin birbiriyle telif edilmeyecek derecede farklılık arz eden rivâyetleri aynı ayetin açıklamasında, yorum yapmadan sıralamasının âyetin içerdiği hükümlerin anlaşılmasını zorlaştırdığı tespit edilmiştir."
