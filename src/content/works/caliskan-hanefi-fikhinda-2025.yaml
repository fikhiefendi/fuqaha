abstract: "Tez, Hanefî fıkhında mülkiyetin sözleşmeyle naklini konu edinmekte olup fıkıh eserlerinde farklı bablarda yer bulan mülkiyete ilişkin kavram ve kullanımlara sözleşme hükümleri bağlamında yaklaşmaktadır. Çalışma aynı zamanda klasik Hanefî füru-ı fıkıh eserlerinde sözleşmelere dair hükümlerin mülkiyet ilişkileri üzerinden okunmasını konu edinmesiyle, klasik füru-ı fıkıh eserlerinin sistematiğinde takip edilmemesi bakımından özgün olarak nitelenebilecek bir bakış açısı sunmayı amaçlamaktadır. Tez, giriş ve sonuç haricinde üç bölümden oluşmaktadır. Giriş bölümünde mülkiyet kavramının dilsel ve terim anlamına yönelik incelemelerde bulunulmuş, tezdeki analizlere alt yapı sağlayabileceği düşünülen bazı kavramsal izah ve karşılaştırmalara yer verilmiştir. Mülkiyetin sözleşmeyle nakline dair genel ilkeler de giriş bölümünde paylaşılmış, mülkiyetin sözleşmeyle nakli dışında kalan hususlara işaret edilerek tez konusunun kapsamının sınırlarına dikkat çekilmiştir. Tezin birinci bölümünde mülkiyetin nakli hükmünü doğuran temel sözleşmeler incelenmiştir. Bu sözleşmeler aynın ivazlı temliki olan beyʿ, aynın ivazsız temliki olan hibe, menfaatin ivazlı temliki olan icare ve menfaatin ivazsız temlikini ifade eden ariyet akitleridir. İkinci bölümde mülkiyetin naklini gerektirmekle birlikte, ya hükümleri birinci bölümdeki sözleşmeler üzerinden izah edilmekle ya fıkıh eserlerinde birinci bölümdeki sözleşmeler kapsamında ele alınmakla ya da mülkiyetin naklinde geçerli bazı ilkelere aykırı özellikler taşımakla ikincil konumda kalan sulh, kısmet, istıṣnāʿ, sadaka, ʿariyye, ʿumrā, ruḳbā ve vasiyet sözleşmeleri incelenmiştir. Üçüncü bölümde tarafların sözleşme üzerindeki tasarruflarının ve sözleşmenin fesih ve ikale yoluyla sona ermesinin mülkiyetin nakli bakımından sonuçları ele alınmıştır."
