abstract: "Dinimizde aile birliğinin kurulması gibi sona ermesi de hukukî ve ahlâkî ilkelere bağlanmıştır. Boşanma da evliliğin hukukî olarak sona ermesidir. İslâm hukukunda aile birliğinin sona erdirme şekillerinden biri de talâktır. Boşanmada talâkın veriliş şekli ve buna ilişkin hükümler talâkın sınırlarını belirlemektedir. İslâm hukukunda bir mecliste verilen üç talâk ile boşanmanın geçerli olup olmadığı hususunda görüş ayrılığı vardır. Bir mecliste verilen üç talâk konusunda islâm hukukçuları farklı görüştedirlerdir. Bizde bu çalışmamızda islâm hukukçuların görüşleri ve dayandığı delilleri inceleyerek çalışmamızı sürdüreceğiz. Ku'rân-ı Kerîm'den, sünnetten, icmâ ve kıyastan deliller verilerek açıklamalar yapılmıştır. Biz de bu konu hakkında çeşitli kaynaklardan yararlanarak tahliller yapmaya çalışacağız."
