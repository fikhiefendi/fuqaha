abstract: "Şeyh Bedreddin (ö. 823/1420), Mecdüddîn el-Üsrûşenî'nin (ö. 637/1240) el-Fusûl'ü ile Zeynüddîn el-Mergînânî'nin (ö. 670/1271) Fusûlü'l-ihkâm fî usûli'l-ahkâm adlı eserini bir araya getirdiği, Osmanlı'da uzun seneler kadılar için müracaat kaynağı olan Câmi'u'l-Fusûleyn isimli bir eser yazmıştır. Şeyh Bedreddin bu eserinde Hanefi mezhebinin temel metinlerinde yer alan bazı meselelerde âlimlere itiraz ve eleştirilerde bulunmuş, sonraki devirlerde müellifin bu itiraz ve eleştirilerine cevap olmak üzere eserler kaleme alınmıştır. Bu eserlerden birisi de Nişancızâde Mehmed'in (ö. 1031/1621) Nûru'l-'Ayn fî Islâhi Câmi'u'l-Fusûleyn adlı eseridir. Bu çalışmada anılan eserin elfâz-ı küfür konusuna tahsis edilmiş olan 40. faslının tahkik ve tahlili gerçekleştirilmiş ve bu çerçeve ile sınırlı olmak üzere Nişancızâde'nin Câmi'u'l-Fusûleyn'e katkısı ortaya konmaya çalışılmıştır. Araştırmamız üç bölümden oluşmakta olup; ilk bölümde Nûru'l-'Ayn fî Islâhi Câmi'u'l-Fusûleyn'e kadar Hanefi mezhebi metinlerinde elfâz-ı küfür konusunun nasıl ele alındığına ve Osmanlı döneminde kaleme alınan başlıca risalelere genel bir bakış yapılmış, ikinci bölüm Nûru'l-'Ayn'ın 40. faslının incelenmesine ve Câmi'u'l-Fusûleyn'in 38. faslı ile karşılaştırmasına ayrılmış, son bölümde ise Nûru'l-'Ayn'ın 40. faslı iki farklı müellif nüshasına dayanılarak tahkik edilmiştir."
