abstract: "TCK'nin 22. maddesinde dikkat ve özen yükümlülüğüne aykırılık olarak tanımlanan taksir; İslam hukukçuları tarafından aynı içeriğe sahip olmak üzere“hata”kavramı içerisinde inceleme konusu yapılmıştır. Teknolojik gelişmelerin beraberinde getirmiş olduğu tehlikelerle özellikle son yüzyıllarda daha da önem kazanan taksirden doğan cezai sorumluluk, İslam hukukunun en başından beri bilinmekte ve kabul edilmektedir. Taksirle öldürme suçunda temel düzenleme Nisâ 4/92 ayetidir. Buna göre taksirle öldürme sonrasında mağdurun yakınlarına diyet ödenmesi gerekmekte, fail kefaret ile yükümlenmektedir. Ayrıca İslam hukukçuları failin, mağdurun mirasından mahrum bırakılacağını ve yetkili yasama organının takdirinde olmak üzere failin tazir cezası ile cezalandırılabileceğini de ifade etmişlerdir. Bu çalışmanın amacı, taksir kavramı ve taksirle öldürme suçuna ilişkin olarak İslam ceza hukuku kurallarını günümüz ceza hukuku bakış açısıyla incelemek ve zaman zaman karşılaştırmalar yaparak iki hukuk sistemine ilişkin benzer ve farklı yönleri ortaya koyabilmektir. Bu itibarla, ilk olarak İslam hukukunda suç ve ceza kavramları, daha sonra taksir kavramının tanımı, hukuki niteliği, tarihsel gelişim süreci ve taksirin türleri modern ceza hukuku ile harmanlanarak incelenmiştir. Son olarak ise taksirle öldürme suçu kanuni, maddi, manevi ve hukuka aykırılık unsurları; suça karşılık öngörülen diyet, kefaret, miras ve vasiyetten mahrumiyet ve tazir cezası yaptırımları ve suçun yargılama süreci incelenmiş ve İslam, Osmanlı ve günümüz hukuk uygulamasından örnekler ile somutlaştırılmaya çalışılmıştır."
