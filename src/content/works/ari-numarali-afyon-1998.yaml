abstract: "TÜRKÇE ÖZET Osmanlı İmparatorluğu'nun XVII. asır sonlarında Avrupa devletleri ile giriştiği uzun süreli savaşların etkisini, incelediğimiz defterde görmek mümkündür. Osmanlı İmparatorluğu bu savaşlar sonunda ilk toprak kaybına uğramış ve Duraklama döneminden Gerileme dönemine girmiştir. 525 numaralı Afyon Şer'iyye Sicili'nde Osmanlı imparatorluğu'nun çöküşünde etkili olan faktörleri görebiliriz. Defterdeki belgeleri konularına göre dört gruba ayırabiliriz; Birinci gurubu oluşturan ferman ve buyruldularda ordunun sefere çağırılması, sefere iştirak etmeyip Anadolu'da eşkiyalık yapan Sekbanların üzerine gidilmesi ve sefer masraflarının karşılanması için halktan toplanan vergiler konu edilmektedir. İkinci grubu tımar ve vakıf tevcihatına dair beratlar oluşturmaktadır. Üçüncü gurubda kadılık muamelatını içeren belgeler vardır. Dördüncü grupta müteferrik konular yer almaktadır. Belgelerden XVII. yüzyıl sonlarındaki Afyon'un idari, askeri, ekonomik, dini vedemografik durumu hakkında bilgi almak mümkündür."
