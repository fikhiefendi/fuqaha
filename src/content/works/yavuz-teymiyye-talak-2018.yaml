abstract: "Çok yönlü ilmi kişiliği ile İslam âlimleri arasında temayüz eden İbn Teymiyye, pek çok alanda olduğu gibi İslam hukuku alanında da gerek Hanbelî mezhebi dâhilindeki gerekse haricindeki fikirleri ile öne çıkmıştır. Çalışmamızda onun çok defa eleştiriye maruz kalmasına sebep olan talak ile ilgili görüşleri tespit edilmeye gayret edilmiştir. Araştırmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmamızın konusu, amacı ve önemine yer verilmiştir. Ayrıca yöntem, kapsam ve sınırlılıklarından bahsedilmiş olup araştırmada yararlanılan kaynaklara da değinilmiştir. Araştırmamızın içeriği gereği talak mevzûu, İbn Teymiyye özelinde işleneceğinden çalışmamıza onun hayatını ve yaşadığı dönemi ele alarak başlamayı uygun gördük. İkinci bölümde, talakın tanımı, tarihçesi ve çeşitlerine yer vererek farklı mezhep ve âlimlerin talak hususundaki ittifak ve ihtilaf ettiği konuları delilleriyle ortaya koyduk. Üçüncü bölümde ise İbn Teymiyye'nin talak ile ilgili görüşlerini, öne sürdüğü deliller, diğer âlimlere getirdiği eleştiriler ve verdiği yeni hükümler bağlamında inceledik. Onun, talak sınıflandırması, üç talak, talaka yemin ve talak dışında evliliği sona erdiren durumlar hakkındaki görüşlerini işleyerek çalışmamızı tamamladık."
