abstract: "Osmanlı tarihi araştırmaları için şer'iyye sicilleri vazgeçilmez bir kaynaktır. Çalışma konusu olarak tespit ettiğimiz Üsküdar Mahkemesi 750 numaralı Şer'iyye Sicili de, 08 Muharrem 1314 (19 Haziran 1896) - 12 Şevvâl 1314 (16 Mart 1897) tarihleri arasındaki dava kayıtlarını içermektedir. Bu çalışmada; öncelikle defterin tamamı titizlikle okunup günümüz harflerine aktarılmış, daha sonra söz konusu dönemde Üsküdar'ın idârî, iktisâdî ve ictimâî yapısı incelenmiştir. Özel olarak ise bu araştırmada şer'iyye mahkemeleri, Üsküdar Mahkemesi, şer'iyye sicilleri, 750 numaralı Üsküdar Şer'iyye Sicili ve Üsküdar tarihine kısaca değinilmiştir. Ayrıca Üsküdar'ın idârî yapısı ve defterde adı geçen Üsküdar ve Üsküdar dışındaki mekanlar kısaca tanıtılmıştır. Mahkeme kayıtlarının tek tek değerlendirilmesi sonucunda elde edilen veriler ışığında Üsküdar'ın o günkü sosyal hayatı, kadın, gayrimüslimler ve aile hayatı üzerinde durulmuştur. Üsküdar'da ekonomik hayat, iktisadî hayatla ilgili defterde geçen bazı kavramlar, esnaf ve sanatkarlar, farklı meslek mensupları, defterde geçen para birimi ve ölçüler bu tezin ilgilendiği diğer konular arasında yer almıştır."
