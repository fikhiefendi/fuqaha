abstract: "Kur'ân-ı Kerim'in hatırı sayılır bir bölümü, insanlara ders ve ibret olmak üzere anlatılan geçmiş peygamberlerin ve milletlerin kıssalarıdırKur'an'ı Kerim'de kıssaların nakledilmesindeki gaye, Kur'ân'ın indiriliş maksatlarını gerçekleştirmektir. Kur'ân Allah'a davet eden bir kitaptır. Kıssa da, bu daveti duyurma ve insan kalbine iyice yerleştirme vasıtalarından biridir.Kur'an, birçok yerde bizden düşünmemizi, öğüt ve ibret almamızı talep etmektedir. Geçmiş milletlerin başına gelen olayları, Allah'ın yolundan sapan milletlerin uğradıkları felaketleri ders ve ibret almak için zikretmekte, aynı akıbete uğramamız için onların yaptıkları kötü şeylerden kaçınmamızı istemektedir. Kur'an bu kıssalarla toplumların aykta kalabilmeleri, medeniyet ve uygarlıklarının çökmemesi için uyulması gereken ilkelere ve bu konudaki değişmeyen yasalara da işaret etmektedir.Ayrıca kıssanın insan eğitiminde büyük rolü vardır. Geçmiş insanların başından geçen olayları ve sebeplerini anlatmak, bugünün insanına da yol gösterir, ders verir. Çünkü insan, yaratılışı, eğilimleri ve zaaflarıyla aynı insandır. Tarihte yaşamış insanlar ve milletler için sözkonusu olan, bugünün insanı için de sözkonusudur.Kur'an'da“en güzel kıssa”(ahsenü'l-kasas) olarak anlatılan Hz. Yûsuf'un Kıssası'nda çok yönlü dersler vardır: Sabır ve sıkıntılara katlanmanın büyük mükâfatı, Allah'tan hiçbir zaman ümit kesmemek, nefsin ve şeytanın kötü isteklerine uymayarak Allah'a bağlanmak, bilmeyerek kötülük yapanları affederek onlara güzel ahlâk dersi vermek, üzerine aldığı görevi en iyi şekilde yerine getirerek güvenilir olduğunu isbat etmek, emânete hiyânet etmemek ve üzerinde hakkı olanların hakkını gözetmek gibi.Allah, kullarına ahlâk ilkelerini ve tarihin kanunlarını anlatıp öğretmiştir. Bu da tarihte yaşanan hâdiseleri, dinî ve ahlâkî bir muhtevayla insanların önüne koyan kıssalar yoluyla anlatılmıştır. Bu kıssalarla ahlâk ve terbiye ilkelerinin pekiştirilmesi hedeflenmiştir. Çünkü kıssalarda, daha önceki dönemlerde doğru yol üzerinde bulunan kimselere mükâfat verildiği, kötü ve yanlış yoldakilerin de cezalandırıldığı bildirilip öğretilmiştir."
