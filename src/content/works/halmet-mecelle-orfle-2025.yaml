abstract: "Bu çalışma, Osmanlı Devleti'nin son döneminde yürürlüğe giren ve İslam hukuku çerçevesinde hazırlanmış kanunlaştırma çalışması olan Mecelle-i Ahkâmı Adliye'de örf kavramının nasıl kullanıldığını incelemeyi amaçlamaktadır. Araştırmada Mecelle'de örfe ne ölçüde yer verildiği, örfün hukuki normlar üzerindeki etkisi ve Mecelle'nin örfü nasıl bir hukuk kaynağı olarak değerlendirdiği incelenmektedir. Tarihsel süreçte İslam hukukunun iki temel kaynağı Kur'an ve sünnetin dışında örf ve âdetler, bir hükme varılırken başvurulan delillerden biri olmuştur. Çünkü örf ve âdetler halkın günlük hayatında uyguladığı, nesilden nesile aktarılarak oluşan bilgi birikimidir. Mecelle'de örf konusunu çalışmak hem İslam hukukunun değişen şartlara nasıl cevap verdiğini görmek hem de Osmanlı hukuk sisteminin toplumsal yapıyla kurduğu ilişkiyi anlamak bakımından önem taşır. Ayrıca Mecelle'de örf konusu, hukukun toplumla ne derecede bütünleştiğinin de bir delilidir. Mecelle'nin örfü bağımsız bir hukuk kaynağı olarak kabul etmediği, ancak örfün ictihatlarda ve hüküm çıkarmada tamamlayıcı bir unsur olarak dikkate alındığı görülmüştür. Ayrıca örfün değişen şartlara uyum sağlamasından dolayı Mecelle'de esnek bir yorum alanı sunduğu anlaşılmıştır. Araştırmadan elde edilen bulgular doğrultusunda günümüz hukuk sistemlerinde yerel örf ve âdetlerin dikkate alınmasının toplumsal uyum ve hukuki meşruiyet açısından önemli olduğu ve modern kanunlaştırma hareketlerinde de örfe yer verilmesi gerektiği önerilmektedir. Ayrıca Mecelle, İslam hukuku kurallarının muamelatla ilgili kısmının uygulanışını ve anlaşılmasını kolaylaştırmıştır. Bu açıdan Mecelle'yi daha yakından tanıyıp anlamak adına Mecelle dersleri yapılması bir ihtiyaçtır. İslam hukukunun muamelatla ilgili kurallarını öğrenmek, toplumun huzur içinde yaşaması için önemlidir."
