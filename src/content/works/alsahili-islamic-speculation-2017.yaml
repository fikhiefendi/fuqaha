abstract: "Bu çalışmanın hedefi, İslami yatırım formüllerinin“spekülasyon formülü”nden yararlanmasını sağlamak ve çıkarlarının iptali için alternatif olarak kabul edilen, çalışma toplumlarının Jamhouria bankası müşterileriyle olan ilişkisinde Libyalı iş adamlarının temsil edilmesinin fizibilitesini belirlemektir. Aynı zamanda çalışmada, problemlerin Libyalı iş adamlarınca Jamhouria bankası müşterileri tarafından kabul edilme esnasındaki farklı yatırımların finanse edilmesi için spekülasyon formülünün kullanımına da karar verilmiştir. Araştırma içeriğinde, analitik tanımlayıcı kavramının metodolojiyi benimsemiş olması üzerine ve Trablus bölgesi içinde yer alan, ilgilendikleri alanın bankacılık olduğu iş adamlarının ve şirketlerin rastgele sınıflandırma örneği üzerine tasarlanmıştır. Ardından bu örneklerin dağıtılmış olan anket formları alındıktan sonra (80) bunlar üzerine araştırma yapılmıştır. Spekülasyonun projeleri finanse etmek için bir İslami fon aracı olarak kullanılması ihtimalinde, Libyalı iş adamlarının bu spekülasyonu kullanma konusundaki inandırıcılığının doğrultusu, yatırımcıların Libya işadamlarının görüşlerini topladıkları ve doğruladıkları durumda ortaya çıkacaktır. Spesifikasyon fonlama formülünü aktarma konusunda Libyalı iş adamlarının önerilerinin bu aktarma kapsamında yer alan doğrulamaların yanı sıra, farklı yatırımlarını da fonlama konusunda formül kullanmalarını ve ayrıca iş adamlarının spekülasyon formülünün farklı yatırımlarını finanse edilmesi için yapılan teşviklerin doğrulanması yer almaktadır. Hedefe ek olarak yapılan, spekülasyon fonlama formülünün uygulanmasına yönelik olarak fırsatların ve engellerin tanımlanmasıyla bunların çözümüne yönelik bir yenilik önerisinde bulunulmasıdır. Seçilen örnekler içinde 'SPSS' istatistik programı kullanılarak bazı tanımlayıcı ve istatistiksel yaklaşımlar kullanılmıştır. Çalışma içerisinde, Jamhouria bankası müşterilerinin farklı yatırımlarını fonlamak için aşağıdaki sonuçları temel alan olumsuz yöndeki menfaatleri için bir alternatif olarak; İslami yatırım formülünün spekülasyon formülünü benimsenmesi için bir fizibilite varmış gibi görülmektedir. Bunlar: (1) Libya iş adamlarının farklı yatırımlarını finanse etmesi için spekülasyon formülünün kullanımındaki teşviklerin varlığı. (2) Libya'daki iş adamlarının, spekülasyon formülünü farklı yatırımlarının İslami bir kaynağı olarak kullanmaya ikna olmaları."
