abstract: "Bu çalışma, İslam Mezhepler Tarihi'nin önde gelen iki klasik alimi Eş'arî (ö.324/935/36) ve İbn Hazm'ın (ö.456/1064) Şiîlik hakkındaki görüşlerini karşılaştırmalı olarak analiz etmeyi amaçlamaktadır. Çalışmanın temel amacı, doğuda Basra bölgesinde yaşamış olan Eş'arî ile batıda Endülüs'ün Kurtuba bölgesinde yaşamış ve hiç doğuya seyahat etmemiş olan İbn Hazm'ın Şiîlik hakkında verdiği bilgi ve Şiî mezhepleri tasnifindeki benzerlik ve farklılıkları tespit etmektir. Çalışma ayrıca bu alimlerin yaşadıkları coğrafi, kültürel ve siyasi bağlamların Şiîlik algılarını nasıl etkilediğini incelemektedir. Çalışmanın kapsamını, Eş'arî'nin Makâlâtü'l-İslâmiyyîn adlı eseri ve İbn Hazm'ın el-Fasl adlı eseri oluştursa da yazarların diğer eserlerine de başvurulmuştur. Çalışma, bu iki yazarın Şiîlik anlayışlarını, fırka tasniflerini ve metodolojik yaklaşımlarını inceleyerek bu bağlamdaki benzerlikleri ve ayrışan noktaları sistematik olarak ele almaktadır. Bu çalışma, Eş'arî ve İbn Hazm'ın birincil kaynaklarını kullanarak ve bunları ikincil literatürle destekleyerek karşılaştırmalı bir analiz yöntemi kullanmaktadır. Çalışma, kapsamlı bir değerlendirme sağlamak için tarihsel ve metodolojik bir çerçeve izlemektedir. Çalışmanın bulguları, Eş'arî ve İbn Hazm'ın Şiîliğe yaklaşımlarının, içinde yaşadıkları sosyo-politik ve kültürel bağlamlardan bağımsız olarak değerlendirilemeyeceğini ortaya koymaktadır. Eş'arî'nin doğrudan Şiî etkisinin olduğu bir bölgedeki gözlemleri detaylı ve deneye dayalı veriler sağlarken, İbn Hazm'ın uzak bir coğrafi bağlamda şekillenen değerlendirmeleri daha teorik ve literatüre dayalı bir analizi yansıtmaktadır."
