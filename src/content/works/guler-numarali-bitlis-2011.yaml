abstract: "Bu Çalışma H. 1311-1321 M.1893-1903 yılları arasını ihtiva eden 411 Numarlı Bitlis Şer'iyye Sicili incelenmesinden oluşmaktadır. 411 Numaralı Bitlis Şer'iyye Sicili Osmanlıca metninin günümüz Türkçesin çevrilmesinde metne sadık kalındı, kelimeler değiştirilmeksizin cümle kuruluşları aynı şekilde verildi. Ana metin basit transkribe tekniği ile okundu. Metinde geçen Farsça, Arapça ve Türkçe sıfat ve tamlamalar bu dillerin gramer kurallarına göre yazıldı. Osmanlıca metinde geçen, ayın harfi: (') işareti, hemze (elif) harfi: (') işareti, uzun a: â harfi, uzun i: î harfi, uzun u: û harfi ile yazıldı. Sicilde geçen 192 belgenin tamamının transkripsiyonu yapılarak değerlendirildi. Belgede yer alan hükümlerin özeti tablo halinde verildi. Çalışmamızın özet tablosu, dava hakkında ki bütün sorulara cevap verebilecek niteliktedir. Sicilin başlıca konuları: verâset, vesâyet, mihir-boşanma, mütevelli tayinleri, hırsızlık gibi konulardan oluşmaktadır.Bilindiği üzere şer'iyye sicilleri kayıt edildiği dönem hakkındaki en orijinal bilgileri içermektedir. Bu bilgiler ışığında dönemin sosyal, idarî, hukukî, iktisadî ve kültürel yapısı hakkında ki bilgilere ulaşmak mümkündür. Bu amaç doğrultusunda sicilde yer alan yer isimleri, idarî görevlilerin isimleri, askerî görevlilerin isimleri, imam, muhtar ve papazların isimleri birer birer tespit edildi. Yine sicilde geçen cami, medrese ve diğer dini yapılar birer birer tespitti yapıldı. Sicilden dönemin soysal yapısı hakkında bilgiler verildi. Dönemin giyim-kuşamını ve kullandıkları eşyaların tespitti yapıldı. Yine dönemin iktisadî yapısı hakkında genel bilgiler verilip meslek grupları, çarşı ve esnaf dükkanları tespit edildi. Dönemin eşya fiyatları ve hayvan fiyatlarına ulaşıldı."
