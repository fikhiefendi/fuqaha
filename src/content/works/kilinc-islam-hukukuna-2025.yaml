abstract: "İslâm hukukunda evlilik, toplumsal düzenin korunması, neslin devamı ve ahlâkî yapının sürdürülmesi gibi amaçlara hizmet eden köklü bir kurumdur. Kur'ân-ı Kerîm'de evlilik vesilesiyle insanlar arasında sevgi ve merhametin var edildiği bildirilmiş, bu müessesenin dinî bir anlam taşıdığı vurgulanmıştır. Bu yönüyle nikâh, kişilerin önem vermesi gereken dinî ve ahlâkî bir yükümlülüktür. Nikâh akdine atfedilen önem gereğince, tezde İslâm hukukuna göre formalite evlilikler ve hükümleri konusu ele alınmıştır. Birinci bölümünde, nikâhın tanımı, rükünleri ve şartları, nikâh türleri ile diyânî ve kazâî hükümler incelenmiş, ayrıca evliliğin ibadet yönü ve mezheplerin nikâh anlayışına yer verilmiştir. İkinci bölümde ise, çeşitli hukukî ve sosyal gerekçelerle yapılan formalite evlilik türleri işlenmiş, bu evliliklerin niyet temelli geçerliliği ortaya konulmuştur. Söz konusu birlikteliklerin birey, aile ve toplum üzerindeki etkileri, fıkhî hükümlerle ilişkilendirilmiş ve bu uygulamaların fâsid yahut bâtıl nikâh kapsamında nasıl değerlendirilebileceği tartışılmıştır. Tezdeki temellendirmeler İslâm hukuku esas alınarak yapılmış, buna ek olarak modern hukuk sistemiyle ilişkili olan hususlara kısaca değinilmiştir. Sonuç olarak şeklen geçerli olsa da dinî açıdan tartışmalı olan formalite evliliklerin sakıncalarına dikkat çekilmiş, nikâhın şekli şartlara indirgenmemesi gerektiği, esas belirleyicinin niyet, samimiyet ve süreklilik olduğu açıkça ifade edilmiştir."
