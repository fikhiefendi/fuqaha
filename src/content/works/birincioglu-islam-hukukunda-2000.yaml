abstract: "Bu çalışmada, İslam Hukukunda Düşünce ve Davranış özgürlüğünün alanı tespit edilmeye çalışılmıştır. 'Giriş'te hak ve özgürlük kavramlarının kısaca tahlili yapılmış ve görülmüştür ki, her iki kavram da dini literatürde anlam zenginliğine kavuşmuştur. 'Hak' kavramının hukuki olduğu kadar teolojik ve tasavvuf! anlamlan da vardır. Keza özgürlük, İslam'da sadece maddi ve görünür cenderelerden kurtulmak değil, belki de ondan daha fazla manevi tutsak oluşlardan sıyrılmaktır. Birinci bölümde, düşüncenin özgürlüğü temellendirilirken, maddi ve manevi bir takım menfi faktörlerini düşünme faaliyetinin özgürce cereyan etmesine etkileri belirtilmiş, Kur'an ve Sünnet'in bu durumla ilgili uyan ve yönlendirmelerine temas edilmiştir. Aynca, Kur'an'm düşünmeye teşviki, Resulüllah (s.a.v.)'in aynı yönde çabalan zikredilmiştir. Bu bölüm düşünce açıklama özgürlüğüne naslann yüklediği anlamlar çerçevesinde, şura, emr-i bi'1-ma'ruf, nehy-i ani'l-münker, içtihat ve nasihat gibi prensiplere temas edilerek tamamlanmıştır. Asr-ı Saadet'te, düşünme ve davranışlara! ne gibi bir özgürlük alanı bulduklan ikinci bölümümüzün konusu olmuştur. Bu inceleme göstermiştir ki, kamu düzenine aykın ve genel ahlakı ifsat edici delillere Hz. Peygamber (s.a.v.)'in toleransı olmamıştır. Fakat dini davet noktasında aldığı talimata uygun alarak, vicdanlarda baskı kurmamış, halkasını tebliğ dışında bir yöntemle genişletmeye kalkışmamıştır. O'nun devleti, dünyevi işlerde istişare ile yürüyen bir sisteme dayanıyordu. Resulüllah (s.a.v.) hakkında vahiy olmayan her konuda farklı düşüncelere müsamaha ile yaklaşırdı. Dini tebliğin haricinde kalan mevzularda herkese fikir hürriyeti, insiyatif ve içtihat hakkı tanıyordu. Üçüncü bölümde irtidat ve isyan fiillerinin düşünce ve davranış özgürlüğü açısından farklı değerlendirildiğini gördük. Kimi konumuz açısından irtidatın bir dünyevi cezasının olmadığını, fitne ve düşmanlık amaçlı irtidatın, bu niteliğiyle cezalandınldığını söylerken, bazılan dini asıllarda böyle bir ceza olmadığını, bazılan ise onun ta'zir kapsamına girdiğini söylemişlerdir. Bağy ise meşru muhalefet sınırlan içinde tanımlanmamıştır. tCTtoattuCarrtmamuui IX OOtfOMAfftASYON unuz}"
