abstract: "Çalışmanın amacı, Rodosçuk kentinde H.985-986 M.1577-1578 yılları arasında mahkemenin yoğunluğunu ortaya koymak, ne tür belgelerin tutulduğunu belirlemek ve belgeleri konu bakımından inceleyerek değerlendirmektir. Literatür incelendiğinde günümüze ulaşan 244 tane Rodosçuk Şer'iyye Sicilinden çok az bir kısmının transkripsiyonunun yapılarak incelendiği ve bu alanda bir eksiklik olduğu görülmüştür. Amaçlarımızdan birisi bu eksikliği gidererek literatüre katkı ve alanda çalışan kişilere kaynak sağlamaktır. Çalışmamızda Başbakanlık Osmanlı Arşivinde bulunan 1526 Numaralı Rodosçuk Şer'iyye Sicili temin edilerek, transkripsiyonu yapıldıktan sonra belge örneklerinden yola çıkılarak mahkemenin yoğunluğu, belge türleri ve belgelerin konuları incelenmiş ve sayısal veriler halinde sunulmuştur. Davalar türlerine göre ayrılırken merkezden taşraya gönderilenler suret, Rodosçuk mahkeme görevlileri tarafından düzenlenen belgeler ise zabıt başlığı altında incelenmiştir. Suret ve zabıtlar incelenerek mahkeme yoğunluğu belirtilmiş, belgeler konu bakımından ekonomi ve adli olmak üzere iki başlık altında değerlendirilerek tablo ve grafik halinde gösterilmiştir. Bu şekilde sicilin tanıtımı yapılmış olup elde edilen veriler sayesinde değerlendirmelerde bulunulmuştur. Sicilin tanıtımı sayesinde bölge ve dönem özelinde sosyal-ekonomik bilgiler elde edilmiş ve analizi yapılmıştır. İnceleme sonucunda 985 yılının Zilkade ayı ve 986 yılının Muharrem ayı mahkemede en yoğun olan aylardır. Sicil içinde en fazla yer tutan belge türü zabıtlardır. Öte taraftan ekonomi konulu davaların daha ağırlıklı olduğu görülürken adli konulu davalara (hırsızlık, darp, cinayet) az rastlanmıştır. Ekonomi konulu davalarda borç konulu davaların defterin yarısından fazlasını oluşturduğu tespit edilmiştir. Dönem özelinde halkta borç alma eğiliminin yüksek olduğu söylenebilir."
