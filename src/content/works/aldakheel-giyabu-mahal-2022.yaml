abstract: "Usûl-i fıkıh meselelerinden biri olan“Gıyâbu'l-Mahal ve Hükme Etkisi”adlı bu araştırma iki bölümde kaleme alınmıştır. İlk bölümde mahal kavramının sözlük ve terim manaları ve usûl ilmindeki yeri açıklanmıştır. Daha sonra 'mahal' kavramının şart, sebep, nesih ve illet gibi usûl-i fıkhın önemli terimleriyle arasındaki ilişkiye dikkat çekilmiş, bazı durumlarda aynı şeyi ifade etmeleri, bazı durumlarda ise farklılıkları ve nahiv ilmindeki“irab mahalli”mevzuu ile arasındaki benzerlik üzerinde durulmuştur. 'Mahal' ve 'Gıyâbu'l-mahal' kavramının ibadetlerle alakalı pratik örneklerin verildiği ikinci bölümde bizzat şart veya sebep manasına delalet ettiğini görülecektir. Mahal ve yokluğu hakkında çokça misal bulmak mümkündür fakat bu bölümde -zihinlerde netleşmesi maksadıyla- taharetten, namazdan, oruçtan, zekâttan ve hac konularından her bapta üç misal verilerek iktifa edilmiştir."
