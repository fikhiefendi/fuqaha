abstract: "Günümüz iktisat sisteminin, ekonomik açıdan güçlü olan devletlerin ve sermayedarların sömürü ve kazanç mekanizmasının temel kaynaklarından biri faizdir. Paranın kirası ya da parayı parayla satmak olarak tanımlayabileceğimiz faizin birçok tanımı yapılmış olmasına rağmen üzerinde uzlaşılan genel geçer bir tanımı yapılmamıştır. Faizin başlangıcı çok eski medeniyetlere kadar uzanmaktadır. Bilinen ilk faizli işlemler tapınaklarda rahipler tarafından yapılmaya başlanmış daha sonraları hükümdarlar ve onların saraylarında da kendini göstermiştir. Tarihsel süreçte büyük sermaye sahiplerinin ve zengin ailelerin de faizle borç vermeye yönelmesi ile faiz geçmişten günümüze sistemli bir yapıya dönüşmüştür. Bu çalışmada yeryüzünde tebaaları bulunan üç büyük dinin faize bakış açısı ele alınmıştır. Faizin toplumun sosyal ve ekonomik yapısı üzerindeki olumsuz etkilerini önlemek ya da faizi sistemli hale getirmek için hem toplumlar hem devletler çeşitli düzenlemeler yapmıştır. Ancak Faizin toplumsal zararlarını önlemeye yönelik en net tedbir ve yasaklar semavi dinlerce alınmıştır. İslam inancına göre tahrifata uğradığı kabul edilen gerek Yahudilik ve Hıristiyanlık dinleri gerekse son hak din olan İslam dini faizi net bir dille yasaklamıştır."
