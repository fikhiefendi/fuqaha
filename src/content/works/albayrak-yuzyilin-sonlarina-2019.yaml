abstract: "Osmanlı Devleti'nin sosyal, ekonomik ve kültürel tarihi açısından birinci el kaynaklar içinde kabul edilen şer'iyye sicillerinden Kastamonu Vilayeti'ne ait 140 numaralı Şer'iyye Sicil Defteri bu çalışmanın ana kaynağıdır. Çalışmamız H.1302-1304/ M.1885-1887 yılları arasını kapsamaktadır. 140 Numaralı Sicil'deki belgeler incelenerek Kastamonu'nun XIX. yüzyılın sonlarına doğru sosyo-ekonomik ve kültürel tarihi hakkında bilgiler verilmektedir. Çalışmamızın giriş bölümünde tarihsel süreç içerisinde mahkeme, yargıçlık görevi dışında birçok idari ve beledi görevi olan kadı ve kadı sicilleri olarakta anılan mahkeme kayıtları olan şer'iyye sicillerinin genel özellikleriyle birlikte 140 numaralı Şer'iyye Sicili'nin fiziki özellikleri hakkında bilgiler verilmektedir. Birinci bölümde ise öncelikle Kastamonu'nun coğrafi özelliklerine yer verilmiştir. Kastamonu'nun tarihsel süreci Osmanlı hâkimiyetinden önce ve sonra olmak üzere iki ana başlık altında incelenmiştir. Daha sonra Osmanlı idari yapısı içinde Kastamonu'nun idari gelişim ve değişim süreci ele alınmıştır. Son olarak bu bölümde Kastamonu'nun sosyal ve kültürel hayatı hakkında bilgilere yer verilmiştir. Çalışmamızın ikinci bölümünde 140 Numaralı Şer'iyye Sicili'nde elde edilen bilgiler doğrultusunda öncelikle Kastamonu'nun sosyal hayatına dair aile yapısı, evlilik, mehir, boşanma, nafaka, vasi tayini, vesayetin kaldırılması gibi konulara yer verilmiştir. Daha sonra zengin ve itibarlı ailelerin yanına yatılı olarak çalışmaya gönderilen kız çocuklarının hakları ve çalış koşuları hakkında bilgiler sunulmuştur. Bir hayır kurumu olan vakfın, o dönemdeki genel durumu ve işleyişi üzerinde durulmuştur. Diğer davalar başlığı altında sunduğumuz kısımda ise sicilde bir veya iki adet olan belge türlerine yer verilmiştir. Ayrıca tereke, verâset, miras, hibe, alım satım, vekil tayini ve borçla ilgili belgelerin içeriği doğrultusunda Kastamonu'nun iktisadî hayatı ortaya konulmaya çalışılmıştır. Sunduğumuz tablolarla belge türlerinin sayıları, şahısların kullandıkları isim, unvanlar, ikamet bilgileri ve dava açma sebepleri gibi bilgilere yer verilmiştir. Üçüncü bölümde ise 140 Numaralı Şer'iyye Sicili'nin transkripsiyonu bulunmaktadır. Sonuç bölümünde yapılan çalışmada elde ettiğimiz veriler doğrultusunda genel bir değerlendirme yapılmıştır. Ekler bölümünde ise tablolar ve orijinal metinden örnekler sunulmuştur."
