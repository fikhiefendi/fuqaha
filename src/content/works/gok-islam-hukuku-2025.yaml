abstract: "Gıda gereksinimi, tarih boyunca tüm toplumların en önemli konusu olarak görülmüştür. Gıdanın kıtlığı ya da bolluğu kadar onun niteliği de fazlasıyla önem taşımıştır. Her dine ilişkin belli başlı gıda ilkeleri bulunmaktadır. Bu araştırmanın temel amacı, İslâm hukuku ve Yahudi hukukunda helâl ve haram olarak kabul edilen gıdaların karşılaştırmalı analizini gerçekleştirmektir. Araştırmada belirlenen bu amaç doğrultusunda ilk olarak konuyla ilgili kapsamlı bir literatür taraması gerçekleştirilmiştir. Yapılan literatür taraması sonucunda ulaşılan temel kaynaklar ve güncel metinlerden elde edilen bilgilerden yararlanılarak araştırmanın kavramsal çerçevesi oluşturulmuştur. Daha sonra yapılan incelemelerde, İslâm hukukundaki helâl ve haram gıdalar ile Yahudi hukukundaki helâl ve haram gıdalar belirlenmiş ve karşılaştırılmıştır. Bu süreçte özellikle iki hukuk sisteminde yer alan temel ilkeler, kutsal metinlerdeki dayanaklar ve gıdaya dair hükümlerin şekillenmesinde etkili olan ortak kriterler dikkate alınmıştır. Bu karşılaştırmadan elde edilen bulgulara çalışmanın sonuç bölümünde yer verilmiştir. Bu araştırma, İslâm hukuku ve Yahudi hukukunda yer alan helâl ve haram gıdalar tespit edilerek iki farklı dinin gıdaların helâllik ve haramlığı hakkındaki görüşlerinin karşılaştırmalı bir şekilde analiz edilmesini amaçlamaktadır. Literatür içerisinde İslâm hukuku ve Yahudi hukukunda ayrı ayrı helâl ve haram gıdaları ele alan pek çok araştırma bulunmasına rağmen, bahsedilen iki hukukun birbirleriyle karşılaştırmalı analizini gerçekleştiren çalışmaların neredeyse hiç bulunmaması sebebiyle bu boşluğun doldurulması çalışmayı önemli kılmaktadır. Ayrıca araştırmanın, ileride konu ile ilgili yapılacak akademik çalışmalara katkı ve yön gösterme potansiyeli taşıdığı değerlendirilmektedir."
