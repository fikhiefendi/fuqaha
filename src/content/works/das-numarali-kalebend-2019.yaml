abstract: "Bir ceza türü olarak XVIII. yüzyıldan itibaren yaygın bir biçimde kullanılmaya başlanan kalebend cezalarına dair kayıtların tutulduğu defterlere Kalebend Defterleri denilmektedir. Osmanlı Devleti'nde suç olarak kabul edilen eylemler, suçluların sosyal statüleri ve cezalandırılma usulleri hakkında doğrudan bilgi edindiğimiz bu defterler Osmanlı Tarihi açısından oldukça önemli bir arşiv kaynağıdır. Ele aldığımız 37 Numaralı Kalebend Defteri H. 1238-1239 / M. 1823-1824 yılları arasındaki kayıtları içermektedir. Kalebend cezalarının yanı sıra nefy(sürgün), palankabendlik, ikamet, manastırbendlik gibi çeşitli cezalara ve suçluların affına yönelik hükümlere de defterde yer verilmiştir. Bu cezalarla toplumun güvenliği ve huzuru tesis edilmeye çalışılmıştır. Tezimizin temelini teşkil eden Kalebend Defteri vasıtasıyla Osmanlı hukuku ve toplumu hakkında çıkarımlar yapmamız mümkün olacaktır."
