abstract: "Döneminin önemli tasavvuf âlimlerinden İsmâil Hakkı Bursevî'nin yirmi üç yılda tamamladığı Rûhu'l-Beyân fî tefsîri'l-Kur'ân adlı eserindeki ahkâm âyetlerini inceledik. Rûhu'l-Beyân çok yönlü bir tefsir olması sebebiyle ahkâm tefsirinin özelliklerini de taşımaktadır. Çalışma“giriş”le birlikte dört ana bölüm ve“sonuç”kısmından oluşmaktadır. Giriş kısmında araştırmanın konusunu, önemini, amacını ve metodunu açıkladık. Birinci bölümde Bursevî'nin hayatı ve eserlerinin yanı sıra yaşadığı dönemin siyasî ve fikrî yapısını ele aldık. İlmî ve tasavvufî kişiliği üzerinde durduk, eserlerini tanıttık. İkinci bölümde Bursevî'nin ibadetlerle ilgili ayetleri yorumlama yöntemi abdest gusül teyemmümle ilgili taharet hususundaki hükümler namaz, zekat, oruç, haç, kurbanla ilgili hükümleri açıklamaya çalıştık. Çalışmamızın ana konusu“ahkâmü'l-Kur'an”olduğu için Bursevî'nin ahkâm âyetlerini açıklarken kendine özgü yönlerini, ahkâm âyetlerinin tasavvufî açıdan nasıl değerlendirdiğini ve faydalandığı kaynakları tespit etmeye çalıştık. Üçüncü bölümde Rûhu'l-Beyân'daki ahkâmü'l-Kur'ân meselelerinden olan,“muamelatla İlgili Ahkâm Âyetlerinin Tefsiri”,“Devletler Hukukuyla İlgili Ahkâm Âyetlerinin Tefsiri”,“Yenilmesi ve İçilmesi Yasak Olan Yiyeceklerle İlgili Ahkâm Âyetlerinin Tefsiri”gibi birçok ana meseledeki tefsir yöntemini inceledik ve bunları tasavvufla nasıl bağdaştırdığını ele aldık. Ayrıca bunları Bursevî'den önce yaşamış klasik ahkâm müfessirlerinin tefsirleriyle mukayese ederek önceki dönemle Bursevî tefsirindeki farklılıkları göstermeye çalıştık. Dördüncü bölümde Bursevî'nin ceza hukukuyla ilgili ayetleri yorumlama yöntemine geçildi. Burada adam öldürme, hırsızlık, yol kesicilik, zina gibi had gerektiren hükümleri açıklamaya çalıştık. Daha sonra sonuç bölümüne geçtik. Böylece İsmâil Hakkı Bursevî'nin, Rûhu'l-Beyân adlı tefsirinde Hanefî ve diğer mezheplerin ahkâm âyetleriyle ilgili işârî yorumlarına da vâkıf olduğunu bunlarıda gün yüzüne çıkarttığımızı düşünüyoruz."
