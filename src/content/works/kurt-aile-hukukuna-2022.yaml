abstract: "Aile, insanlığın başlangıcından itibaren varlığını sürdüren bir kurumdur. Bu nedenle Allah, Hz. Âdem'i yarattığında eşi olarak Hz. Havva'yı da yaratmıştır. Böylece ilk aile kurulmuştur. Aile olmak, insanın en temel ihtiyaçlarından biridir. Çünkü insan, fıtratı gereği sosyal bir varlıktır. Allah, aile kurumunun oluşmasından bozulmasına kadar her safhayı Kur'ân-ı Kerim'de ayrıntılı olarak açıklamıştır. Genel olarak İslam hukukuna baktığımızda aile hukuku, klasik fıkıh kitaplarında geniş şekilde yer alır. İslam hukuku açısından aile hukuku,“muamelât”ana bölümünün“münâkehât”kısmında işlenmektedir. Kur'ân'ın aile hukukuyla ilgili hükümleri, İbn Âşûr'un“et-Tahrîr ve't-Tenvîr”isimli tefsiri esas alınarak, onun bu hükümleri nasıl değerlendirdiği ortaya konulmaya çalışılmıştır. İbn Âşûr, aile hukukuyla alakalı ayetlerin genelini değerlendirmekle birlikte hıtbe (nişanlanma), evlilikte ehliyet ve velâyet, süt akrabalığı hariç diğer evlilik engelleri konularını genel olarak işlemiştir. Fakat evlilik engellerinde sütkardeşliği, süt akrabalığı, süt çağı ve din farkına bağlı evlenme engeli konularını, evlilikte karı-koca hakları hususunu, mehir, talâk ve iddet konularını detaylı bir şekilde işlemiştir. İbn Âşûr, aile hukukuyla ilgili ayetleri değerlendirirken genel olarak şu esasları ortaya koymuştur: Üvey kızın annesi ile nikah ardından zifafa girildiğinde üvey kız üvey baba evinde olsun olmasın üvey babaya haram olur. Ancak üvey kızın annesi ile zifaf gerçekleşmeden boşanma olmuşsa üvey baba ile üvey kız evlenebilir. Evlat edinmek açık bir şekilde yasaklanmış olup, bir kimsenin evlatlığının boşadığı eşiyle evlenmesi de helaldir. Ancak vahiy dönemindeki bu uygulamanın Hz Muhammet üzerinden gerçekleşmesi, bu tür evliliklerin helal bile olsa hoş görülmemesi düşüncesini yıkma amacına dönüktür. Evlilikte din farkı hakkında mümin kadınlarla evlenmenin, Ehl-i kitaptan iffetli kadınlarla nikâhlanmaktan daha uygun olacağını belirtmiştir. Karı-koca hakları konusunda erkeğin kadından bir derece daha üstün olduğunu açıklayan ayeti erkeğin kadına üstünlüğü ancak nikâh akdiyle gerçekleşir. Dolayısıyla bu üstünlüğü, evlilikte erkeğe yüklenen sorumluluk sebebiyledir, şeklinde yorumlar. Nafakanın artırılıp artırılmayacağı hakkında nafaka verilecek kadının durumu iyi olsa da olmasa da erkekten nafaka yükümlülüğü düşmez, şeklinde bir tespitte bulunmuştur. Bu çalışmada İbn Âşûr'un tefsiri özelinde aile hukukuyla ilgili ayetler esas alınarak İslam aile hukukunun temel ilkeleri inceleme konusu yapılmıştır."
