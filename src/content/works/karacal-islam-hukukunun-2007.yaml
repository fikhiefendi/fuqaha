abstract: "Tam ad ; Ebû Osman Rebî'a b. Ebû Abdurrahman ? Faruk et-Teymî'dir. Medine'de yaşamış bir fıkıh alimidir. 136/753 tarihinde Medine'de vefat etmiştir. Rebî'a özellikle hakk?nda nass bulunmayan konularda eskilerin hükümlerinin yerine kendi re'yi ile karar vermek hususunda oldukça dikkat çekmiştir. Kendisine sorulan konular hakk?nda, kendi re'yini söylemekten çekinmemiş, öncekilerin bu konu hakk?ndaki düşüncelerini söyleyerek itiraz edenlere de ?Bunun kendi görüşü olduğunu, isteyenin alıp isteyenin almayacağını? rahatlıkla söylemiştir. Bu nedenle de ?Rebî'atü'- re'y? olarak anılmıştır. Mâlik'in hocalar?ndand?r. Daha sonra özellikle re'y de kullandığı metot nedeniyle Mâlik hocasına muhalefet etmiş ve onun ders halkasından ayrılmıştır. Her ne kadar hocas?na muhalefet etse de Mâlik'in f?kh?nda Rebî'a'n?n etkisi aç?kça görülmektedir. Özellikle fıkıhta re'yi kullanmak anlamında ilklerden olmuştur. Rebî'a'nın görüşleri müstakil olarak bir mezhep şeklinde ortaya çıkmamış da olsa, ortaya çıkan mezheplere ve kendinden sonrakilere ışık tuttuğu bir gerçektir."
