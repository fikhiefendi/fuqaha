abstract: "Bu tezde Mehmed Sâdık b. Mustafa Şânîzâde'nin (ö. 1791) Bedâyiü's-Sukûk adlı sakk mecmuası tarihî bir metin olarak incelenmiştir. 18. yüzyılda kaleme alınan mecmuanın mukaddimesinde, nadir olan davalara da yer verildiğinin belirtilmesi bu mecmuayı diğer sakk mecmualarından ayırmaktadır. Şânîzâde'nin olağan davaların dışında, benzerine çok da rastlanamayacak davalara yer vermesi, kadılara yol gösterme konusundaki gayretinin bir sonucudur. Hem içerik hem de şekil bakımında oldukça özenli derlenmiş bu mecmuada ilâmlar çoğunlukta olmak üzere, hüccet ve vakfiye örnekleri ile elkâb suretleri, davet tezkireleri ve vakfiye imza suretlerine yer verildiği görülmektedir. Mecmuanın Beyazıt Devlet Kütüphanesi, Beyazıt nr. 2675'te bulunan yazma nüshası üzerinde yapılan bu çalışmada tamamı incelenmiştir. Mecmuada bulunan nadir davalar, devlet adamlarıyla ilgili davalar ile elkâb suretleri, davet tezkireleri ve vakfiye imza suretleri bu çalışmanın ana bölümleridir. Her bir kayıt kadı için neden önemli olabileceği sorusu üzerine değerlendirilerek, Osmanlı kadısının çalışma şekli hakkında çıkarımlarda bulunulmuştur. Yapılan bu çalışma sonucunda sakk mecmualarının kadı için meslekî bir kılavuz olmasının yanı sıra, içinde bulunan dava konularının çeşitliliği dolayısıyla pek çok alanda tarihi tamamlayıcı bir kaynak niteliğinde olduğu ve tarih çalışmalarında önem arz eden birincil kaynaklar olduğu görülmüştür."
