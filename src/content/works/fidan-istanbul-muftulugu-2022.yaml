abstract: "Tarih araştırmalarında siyasi tarih çalışmalarının yanında sosyal, kültürel, ekonomik ve yerel tarih araştırmaları da büyük bir öneme sahiptir. Bu araştırmalar içinde miras hukukunun konusu olan kassâm defterleri, muhtevası sebebi ile çok önemli arşiv kaynaklarını teşkil etmekte ve özellikle Osmanlı'nın sosyal ve iktisadi tarihi açısından birinci derecede önemli veriler sunmaktadır. Kassâm (Tereke) kayıtları, şer'iyye sicillerinin içerisinde yer alır, bazen de müstakil defterler halinde tutulurlardı. İstanbul Mahkemesi'ne ait olan 98 numaralı bu sicil de müstakil bir kassâm defteridir. Terekeler, tutulduğu dönemin aile yapısı, ailelerin maddi durumları ve servetleri, mahalle, meslek isimleri vb. konularda fikir sahibi olmamızı sağlamaktadır. İstanbul Kısmet-i Askeriyye Mahkemesi'ne ait olan 98 Numaralı Kısmet-i Askeriyye defteri H. 1160 ( M. 1747) tarihinde kaleme alınmıştır. Bu çalışmada 98 numaralı defterin vr.1a-50b kısmının transkripsiyonu ve değerlendirmesi yapılmıştır. Defterin vr.1a-50b kısmında 204 hüküm bulunmaktadır. Defterimizde tereke kayıtlarının yanında veraset ispatı, vasi tayini ve vesayet işlerine dair hükümler de yer almakta ve bu hükümler Osmanlı miras hukukunu aydınlatması açısından önem arz etmektedir."
