abstract: "Lafızlar hakikat manalarının haricinde de kullanılmaktadırlar. Bir toplum tarafından kullanılan herhangi bir lafız, örfün değişmesi, mana genişlemesi, mana daralması veya mana kayması gibi nedenlere bağlı olarak zamanla farklı manalara delalet edebilir. Bu tür lafızlar içerisinden muhtemel manalarından herhangi biri için kullanımı yaygınlık kazanmış bir lafzın telaffuz edilmesi durumunda, manasının anlaşılması herhangi bir karineye ihtiyacı gerektirmez. Söz konusu lafzın hakikat veya mecaz manasında kullanılmış olması müsavidir. Bununla beraber özellikle lafızlardaki mana değişim sürecinde bir lafzın taşıdığı her mana, örfün belirleyici etkisine bağlı olarak toplumun bütün fertleri tarafından hemen anlaşılmayabilir. Bu gibi durumlarda, konuşanın, o lafızdan hangi manayı irade ettiğinin anlaşılması çeşitli karinelere ihtiyacı gerektirir. Bunların başında niyet ve delalet-i hal gelmektedir. Kinâyeli lafızların fıkhi sonuçları özellikle İslam aile hukukunda üzerinde en fazla ihtilaf olan konulardan bir tanesidir. Ayrıca zaman, mekan ve örf etkenlerine bağlı olarak kinâyeli lafızların toplumdan topluma değişkenlik göstermesi sebebiyle, müctehid imamlar tarafından belirlenen kaidelere göre hareket edilmesi şer'î hükümlerde tutarlılık ve adalet açısından önemlidir."
