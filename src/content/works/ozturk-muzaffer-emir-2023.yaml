abstract: "Usûlül'l-fıkıh ilminde yer alan emir ve nehiy konusu önemli bir yer tutmaktadır. Zira Şâri'in mükelleften talep ettiği hükümlerin anlaşılması ve tatbik edilmesi için mühimdir. Ayrıca Şâfiî usûlcülerden biri olan Ebû'l-Muzaffer Mansûr b. Muhammed b. Abdilcebbâr et-Temîmî el-Mervezî es-Sem'ânî'nin usûlî görüşleri kendisine muâsır ya da halef olan birçok âlimi etkilemiş olup ve onların övgüsüne mazhar olması, bizi Sem'ânî'nin usûl ile ilgili eserinden emir ve nehiy meselesini çalışmaya sevk etmiştir. Biz de tezimizi bu alanda kaleme aldık. Çalışmamızda, Sem'ânî'nin fıkıh usulünde emir ve nehye dair görüşleri irdelenmiş ve üç bölümden müteşekkildir. Birinci bölümde Sem'ânî'nin hayatı, ilmi kişiliği, hocaları, öğrencileri ve eserleri ele alınmıştır. İkinci bölümde ise genelde emire dair meseleler özelde ise Sem'ânî'nin emir hakkındaki görüşleri irdelenmiştir. Üçüncü bölümde ise genelde nehiy ile ilgili konular, özelde ise Sem'ânî'nin nehiy hakkındaki görüşleri incelenmiştir. Bu çalışma neticesinde Sem'ânî'nin daha ziyade klasik dönem Şafiî âlimlerin ortaya koyduğu görüşlere bağlı kalmakla birlikte çok sınırlı yerlerde İmam Şâfiî'ye ve Şâfiî usûlcülerine muhalafet ettiği sonucuna ulaşılmıştır. Fıkıh usûlünün mihenk taşı mesabesinde olan emir ve nehiy konularını Sem'ânî'nin Kavâtı'u'l-Edille Fî'l-Usûli'l-Fıkh adlı eseri temel alınarak emir ve nehiyle alâkalı görüşleri ortaya konulmuştur. Anahtar Kelimeler İslâm hukuku, Sem'ânî, Emir, Nehiy, Fevr, Terâhî"
