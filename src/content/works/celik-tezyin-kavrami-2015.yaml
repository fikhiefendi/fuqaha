abstract: "İnsan, Allah'ın değer verdiği ve en güzel şekilde yarattığı varlığıdır. Yaratılış gâyesi, Yaratana kulluktur. O, hayır ve şerle denenmektedir. Günahlar, yaratana kulluk yolunda ortaya çıkan aksaklıklardır. Allah, bu yolda ortaya çıkabilecek engelleri ve engelleyicileri, kitabında bildirmiştir. Araştırmanın amacı, günahların ve kötü amellerin insana câzip gelen yönlerine, Kur'ân'ın bu konudaki uyarılarına dikkat çekmektir. Araştırma, giriş ve üç bölümden oluşmaktadır. Çalışmanın birinci bölümünde, tezyîn ve tezyînle ilgili kavramlar, tezyînin fıkhı yönü, tezyînin Kur'ândaki kullanım alanları, hadislerde tezyîn, tezyîn ve kötü amel ilişkisi, tezyinin psikolojik yönü gibi konular üzerinde durduk. Burada, tezyînle ilgili birçok konu ve kavramın var olduğunu gördük. Farklı tezyîn türleri ile karşılaştık ve bunlara dikkat çektik. Çalışmanın ikinci bölümünde, amel kavramı, iyi ve kötü ameller, günah kavramı, insanın günahlarla imtihanı ve insanın sorumluluğu, kötülük problemi, insanı günaha sevk eden amiller, günahların insanın ruh sağlığı üzerindeki etkisi ve Günahların meşru görünmesi gibi konular üzerinde durduk. Burada, çeşitlenen dünyevî süsler karşısında, insanın çetin bir imtihanla karşı karşıya olduğunu; şeytan, kötü nefis, dünya hayatının cazibeliği ve ahiret hayatının unutulması gibi insanı günaha sevk eden birçok amilin var olduğunu gördük. Üçüncü ve son bölümde ise, kötü amellerin ve günahların câzipliği konusu üzerinde yoğunlaştık. Kur'ân âyetleri ışığında, kötü amellerin insanlara nasıl câzip ve güzel göründüğünü, şeytanın kötü amelleri güzel göstererek insanı nasıl yoldan çıkardığını, insanın dünya hayatına ve dünya hayatının geçici güzelliklerine nasıl aldandığını, şehevî arzuların, günah ve kötü amellerin uhrevî gâyenin önünde nasıl bir engel teşkil ettiğini belirtmeye çalıştık."
