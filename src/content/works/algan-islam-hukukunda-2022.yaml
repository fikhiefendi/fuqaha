abstract: "İnsan ömrünün hızla uzadığı ve nüfusun büyük bir bölümünü yaşlıların oluşturduğu günümüzde bakım konusu hassasiyetle ele alınması ve incelenmesi gereken bir mesele olmuştur. Tarih boyunca yaşlılara bulundukları toplumun şartları çerçevesinde bakılmış, bakım meselesi bugünkü boyutta bir problem boyutuna ulaşmamıştır. Ancak günümüzde yaşlı nüfusun hızlı bir şekilde artışı, yaşam koşullarının değişmesi gibi faktörler dünya genelinde bir problem haline gelen bakım meselesinin yeniden ele alınmasını ve yaşlı bakımı ile alakalı sorumlulukları bilmeyi icap ettirmiştir. Konunun İslam Hukuku açısından ele alınarak incelenmesinin gerekliliği saikiyle araştırmayı uygun gördüğümüz \"İslam Hukukunda Yaşlı Bakımı\" konusu giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş kısmında araştırmanın amacı, önemi, metodu ve kaynakları tanıtılmıştır. Birinci bölümde yaşlı ve bakım kavramları irdelenerek yaşlı bakımından kastın ne olduğu konusunda bilgi verilmiştir. İkinci bölümde İslam Hukukunda yaşlı bakımının temel ilkeleri ve bakım esnasında meydana gelen durumlar irdelenmiştir. Üçüncü bölümde İslam Hukukunda yaşlı bakımı ile alakalı sorumluluklar üzerinde durularak araştırma tamamlanmıştır. Sonuç bölümündeyse araştırma boyunca elde edilen bulgular özetlenerek önerilere yer verilmiştir. Böylece yaşlıların İslam Hukukuna göre bakılma haklarının olup olmadığı varsa bununla mükellef olanların kimler olduğu ve kendilerine ne tür sorumluluklar yüklendiği temel kaynaklar ışığında tespit edilmiştir. Araştırma neticesinde yaşlı bakımının dinî ve hukukî bir yükümlülük olmasının dışında her şeyden önce insanî ve ahlâkî bir sorumluluk olduğu, ancak ne din, ne de hukukun bu mükellefiyeti insanların vicdanına terk etmeyerek gerekli düzenlemeleri gerçekleştirdiği ve bireyleri dinî-hukukî olarak bu sorumluluğun yerine getirilmesi noktasında zorladığı sonucuna ulaşılmıştır."
