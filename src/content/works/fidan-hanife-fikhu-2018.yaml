abstract: "Bu çalışma, İmâm Ebû Hanîfe Nûman b. Sâbit'e atfedilen el-Fıkhu'l-ekber adlı risâlenin aidiyetine dair tartışmaları ele almaktadır. Hicrî sekizinci yüzyıldan sonraki dönemde İslâm Coğrafyası'nda yaygınlaşan bu eserin müellifine olan nispeti ile muhtevasına yönelik eleştiriler yapılmış, bunun neticesinde bu risâlenin günümüzdeki şekliyle Ebû Hanîfe'ye ait olamayacağına dair bir kanaat oluşmuştur. Risâlenin içeriğine yöneltilen eleştiriler dikkate alınarak bu eserin Ebû Hanîfe'ye olan nispeti, muhtevasının sonradan değiştirilip değiştirilmediği, risâlede geçen konuların ne ölçüde onun görüşlerini yansıttığı gibi temel konulara değinilmiştir. Bu doğrultuda yazma eserler ve ilk dönem kaynaklar incelenerek eserin müellifine olan aidiyetinin doğru olup olmadığı ortaya konulmaya çalışılmış, diğer yandan el-Fıkhu'l-ekber'in muhtevası ile Ebû Hanîfe'nin akaide dair görüşlerinin karşılaştırılması yapılarak bu risâledeki bilgilerle inanç konularındaki görüşleri arasında var olan benzerlik ve farklılıklar tespit edilmiştir. Ayrıca Ebû Hanîfe'ye el-Fıkhu'l-ekber adıyla iki farklı eser nispet edilmektedir. Bu iki ayrı risâle içerisinde hangisinin ona ait olduğunun araştırılması ise çalışmanın ana konularından birisini oluşturmuştur. Böylece erken döneme ait eserlerde el-Fıkhu'l-ekber ismi geçtiğinde hangisinin esas alınması gerektiği konusu netleştirilmeye çalışılmıştır. Ebû Hanîfe'nin diğer akaid risâlelerine yönelik eleştirilere de değinilerek bunlardan hangisinin aidiyetinin daha kuvvetli olduğuna dair oluşan kanaatler zikredilmiştir."
