abstract: "Günümüzden yaklaşık olarak 50 yıl önce hayatımıza ilk kez düşünce olarak giren faizsiz bankacılık sistemi, 1970'li yıllarda düşünce aşamasından çıkıp ilk olarak 1976'da, Mısır'da uygulanmaya başlanmıştır. Ülkemizde 1983 yılında Kanun Hükmünde Kararname ile kurulmasına izin verilen o dönemki unvanları ile Özel Finans Kurumları yeni unvanları ile Katılım Bankaları, dünya genelinde ve ülkemizde özellikle son on yılda çok büyük bir gelişme kaydetmişlerdir.Bugün Dünya'da sadece İslam ülkelerinde değil özellikle dünya finans piyasalarında yaşanan entegrasyon sonucunda İngiltere ve ABD gibi gelişmiş finans piyasalarına sahip ülkelerde de faizsiz bankacılık sistemi çok ilerlemiştir. Dünyanın sayılı bankaları, bünyelerinde faizsiz bankacılık bölümleri açarak Ortadoğu'da atıl durumda bulunan petro-dolarları bünyelerine katmaya çalışmaktadırlar.Ülkemizde katılım bankaları özellikle 2001 yılından sonra büyük bir atılım içerisine girmiş ve diğer ticari bankalar ile rekabet edebilir hale gelmişlerdir. Bunda, 1999 ve 2001 yıllarında yapılan değişiklik ile katılım bankalarının, Bankalar Kanunu'na tabi olması ve katılım bankalarının ticari bankalar ile mevzuat bağlamında aynı hak ve yükümlülüklere kavuşmasının büyük katkısı bulunmaktadır.Çalışmada Türkiye'de, katılım bankalarının bankacılık sektörü içerisindeki büyüklüğü ile katılım bankacılığı ve katılım bankalarının kuruldukları dönemden itibaren hizmet çeşitliliği, rakamsal oranlar ve mudilere dağıtılan kâr payları gibi unsurlar açısından sergiledikleri performansın ticari bankalar ile karşılaştırması yapılarak katılım bankaların bankacılık sektörü içerisinde başarılı olup olmadıkları ortaya konmaya çalışılmıştır. Ayrıca çalışmada katılım bankalarının Türkiye'deki hukuki dayanaklarının değişimine de değinilmiştir.Çalışmada, Türkiye'deki katılım bankalarının fon toplanan hesapların ve toplanan fonların işletilmesinin ticari bankalara göre farklılıklar arz ettiği, katılım bankalarının payının bankacılık sistemi içerisindeki %4'ler düzeyinde olduğu, kârlılık açısından ticari bankalara göre daha iyi durumda olan katılım bankalarının müşterilere sunulan hizmet ve ürün çeşitliliği ile likidite açılarından daha kötü durumda olduğu ortaya konulmuştur."
