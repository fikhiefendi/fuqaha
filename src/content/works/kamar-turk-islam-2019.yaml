abstract: "İsyan suçu, siyâsî bir suçtur. Tüm siyâsî suçlar gibi isyan da, gerçekleştiği dönemin tarihî şartları ve o devirde geçerli hâkimiyet telâkkileri ile sıkı sıkıya irtibatlıdır. Gerek Avrupa tarihi, gerek Türk-İslâm tarihinde görülen uygulamalar, bu umumî hükmün birer teyidi mahiyetindedir. Böylece, isyan suçunun ve bu suçun faillerine tatbik edilen müeyyidelerin anlaşılması bakımından o devirde geçerli bulunan hâkimiyet telâkkisinin bilinmesi gereklidir. Türk hâkimiyet telâkkisinde, hâkimiyet hakkı Hakan ailesine mahsustur. İlâhi bir tavzif mahiyetinde bulunan“kut”bu ailede tecelli eder. Bu telâkkinin bir yansıması olarak isyan girişimleri tarih boyunca genel olarak hanedan mensupları tarafından, yahut onlar namına gerçekleştirilmiştir. Yine bu telâkkinin bir yansıması olarak isyanlarda hanedan mensuplarına daha müsamahakâr bir tutum gösterilirken, diğer kişilere karşı sert ve tavizsiz müeyyideler tatbik edilmiştir. İslâm hâkimiyet telâkkisi ise hâkimiyeti emanet vasfında gören, yöneticilerin mes'uliyeti esasına dayanan meşveret eksenli yapısı nedeniyle –bilhassa hulefâ-i raşidîn döneminde- muhalefete karşı hoşgörülü bir uygulama örnekliği gösterir. Fakat hilâfetin saltanat esasına dönmesi ile birlikte, kadîm Arap kabile gelenekleri, Sasanî ve Bizans tesirleri hâkimiyet telâkkisini dönüşüme uğrattığından siyâsî suçlulara ve bilhassa bağîlere karşı daha sert uygulamalar görülür. İslâmiyet sonrasında kurulan tüm Türk devletleri'nde olduğu gibi Osmanlı Devleti'nde de şer'î hukuk geçerlidir. Bunun yanında şer'î esaslara aykırı olmamak üzere padişah iradesi ile ortaya konulan kanunnâmeler de mevcuttur. Ta'zîr suçu mahiyetinde bulunan bağy suçu da klâsik dönem uygulamasında öncelikle şer'î hukuka, cezalandırmada takdir yetkisinin kullanımı bakımından da padişah iradesine dayandırılmıştır. Bunun yanında XVIII. asra kadar - isyan tehlikesinin önlenmesi kaygısıyla bir siyâsî tedbir olarak ve bütünüyle örfî hukuk mahiyetinde olmak üzere - kardeş katli müessesesi de mevcuttur. Tanzimat Fermanı'nın kabulü ile birlikte ise, isyan suçu ceza kanunları ile düzenlenmeye başlamış, mahkeme önünde tarafsız bir yargılama yapılmaksızın kimsenin öldürülemeyeceği esası benimsenmiştir. Mutlak idare biçiminde kendisini gösteren hâkimiyet telâkkisinden meşrutî idare biçimine doğru gerçekleşen bu tedricî dönüşüm süreci içerisinde, isyancılara uygulanan hukukî rejim ve verilecek cezalar bakımından da önemli sayılabilecek ölçüde bir yumuşama gözlenmektedir."
