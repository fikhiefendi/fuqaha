abstract: "Ahkâm Defterleri, halkın şikâyet ve problemlerini çözüme kavuşturmak ve adaleti tesis etmek amacıyla Divân-ı Hümâyun'da alınan kararların kaydolunduğu defterlerdir. Dîvân-ı Hümâyûn'a ulaştırılan şikâyetlerle alakalı olarak düzenlenen Ahkâm Defterleri, yerel mercilerin yada makamların mahallinde çözemediği için merkezî hükûmet oraganınca üretilen çözümleri ihtiva eder. Bu sorunlara devletin en yetkili organının getirdiği çözümleri ve bakış açısını temsil etmektedir. Adalet ve devlet mekanizmalarının en iyi şekilde işlemesinde re‛ayadan gelen şikâyetlerin önemli ölçüde etkinliği söz konusudur. Bu şikâyetler, oto-kontrolün sağlandığının göstergesidir. Divan-ı Hümayûn'a intikal eden sorunların burada çözüme kavuşturulup sonuca bağlanması ve alınan kararların birer suretlerinin kayıt altına alınması sonucu, süreç içerisinde Mühimme defterleri, Şikâyet defterleri, Name-i Hümayûn defterleri, Ahkâm defterleri vs. defter serileri tutulmaya başlanmıştır. Maraş Ahkâm Defterleri 1155/1294-1742/1877 yılları arasını kapsayan toplam 6 defter bulunurken III numaralı Maraş Ahkâm Defteri 1196/1229-1782/1814 tarihleri arasında Maraş'la ilgili hükümlerin yanında Ayıntab, Adıyaman, Malatya, Hısn-ı Mansur, Elbistan, Kayseri ve Adana gibi sancak ve kazalarla ilgili hükümleri de ihtiva etmektedir. Çalışmada tespit edilen hüküm sayısı 243 olup, en çok hükümün gönderildiği idari birim 107 ile Maraş, 49 hükümle Ayıntab'dır. İlgili hükümlerin şikayet konuları ise asayiş problemleri şeklinde izah edebileceğimiz eşkıyalık ve gasp gibi meseleler, vakıf müessesesine ilişkin meseleler, mali ve tarım politikalarına (tımar, mukataa, iltizam, malikâne) dair meseleler, miras meseleleri ve son olarak muhtelif meseleler şeklinde tasnif edilmiştir. Çalışmamız kapsamında Maraş'ın sosyal, ekonomik, askerî, beledî, hukukî, idarî vs. durumlarını bu belgelere dayanarak ortaya koymaya ve Kahramanmaraş Tarihi ile ilgili araştırmalara bir nebze de olsa katkı sağlamaya çalışılmıştır."
