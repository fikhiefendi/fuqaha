abstract: "Bu tez, günümüzde daha çok ''Helâller ve Haramlar'' şeklinde ifade edilen ''İstihsân ve Kerâhiyye'' başlığının tarihi gelişim sürecini ve özellikle önemli fetvâ kitaplarından biri olan el-Fetâva't-Tatarhâniyye'deki bu bölümün tahlilini konu edinmektedir. el-Fetâva't-Tatarhâniyye, yararlandığı kaynaklar ve kendisinden sonra çokça atıf alması itibari ile önemli bir noktada bulunduğundan detaylı bir incelemeyi gerektirmiştir. Tezimizin amacı, çok hacimli bir eser olan el-Fetâva't-Tatarhâniyye'nin İstihsân ve Kerâhiyye başlığı altında ne tür fetvâlara yer verildiğini tespit etmek, konu yelpazesini belirlemek, yeni fıkhî olaylara dönem itibari ile nasıl yaklaşıldığını gösterip sonraki dönemlere etkisini ortaya koymaktır. Bir giriş, üç ana bölüm ve bir sonuçtan oluşan tezin giriş bölümü, tezimizin konusu ve önemi, kapsamı ve yöntemi, literatür değerlendirmesi ve tezin literatüre katkısına temas edilmiştir. Birinci bölümde el-Fetâva't-Tatarhâniyye müellifi, telif edildiği dönem, telif süreci ve üzerine yapılmış çalışmalar hakkında bilgiler verilmiştir. İkinci bölümde İstihsân ve Kerâhiyye bölüm başlığının tarihi gelişim seyri, bu bölümde atıf yapılan eserler, isimler ve bölümün sistematiği olmak üzere genel durumu incelenmiştir. Üçüncü bölümde ise el-Fetâva't-Tatarhâniyye, İstihsân ve Kerâhiyye özelinde tahlil edilmiştir. Çalışmamızın çıktıları ise sonuç bölümünde aktarılmıştır."
