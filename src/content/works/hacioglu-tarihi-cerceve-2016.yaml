abstract: "Bu tez; alemlere rahmet olarak gönderilen Hz.Peygamber'in, elçilik belgesi olan Kur'an-ı Kerim'in bölümlerinden Mekke dönemine ait İsrâ ve Medine döneminden Mâide Sûresi'ni bir bütün halinde incelemeye çalışmıştır. Sûrelerin barındırdıkları dokuyu temaşa edebilmemizi,hayatımıza yansıyan yönlerinin neler olduğunu ya da olması gerektiğini, kısacabu iki sûreyi yakından tanımayı, bir tefekkür ve te'lif çalışması olan tefsir penceresinden yapmayı hedef almıştır. Takip edilen metotta, öncelikle Ulûmu'l-Kur'ân ve Mekkî-Medenî sûreler hakkında bilgilere değinilmiş, devamında her iki sûre için ilk etaptakendilerine has özellikleriyle tanımlama yoluna gidilmiş, sonrasında özel başlıklar altında tarih, nüzul ortamı, üslup ve muhtevalarını oluşturan konuları incelemiştir. Yapılan çalışma sonucunda, Mâide ve İsrâ Sûreleri yukarıda zikri geçen başlıklar altında karşılaştırmaya tabi tutularakortak ve farklı yönleri ortaya çıkarılmaya çalışılmış ve sûrelerin kaynaklarındaki sonsuzluk, misyonlarındaki ebedîlik uçları arasında günümüze yansıyan ilke ve hakikatlerin barındırdığı mesajlar belirlenmeye çalışılmıştır."
