abstract: "Şer'iyye sicilleri eski dönemlerde olduğu gibi Osmanlı'nın da kendi şer'iyye sicilleri kendi tarihinin aydınlatılmasında en önemli kaynaklardandır. Şer'iyye sicillerinin ihtiva ettiği bilgiler tahlil edildiği döneme ışık tutar. Dönemin idari ve askeri yapısı, soysa-ekonomisi hakkında detaylı bilgiler sunmaktadır. Nitekim araştırma çalışmamıza konu olan 181 envanter numaralı Harput şer'iyye sicili tarih araştırmacılarına yazıldığı dönemin yukarıda saydığımız konular hakkında detaylı bilgiler sunar. 181 numaralı Harput şer'iyye sicilinde; satış akdi, alacak-verecek meselesi, miras paylaşımı, nafaka ve hibe gibi davalar yoğunluktadır ve bu davalar şer'i hukuka göre kadı tarafından hüküm verilip daha sonra muhkem neticeye ulaşan dava kayıtlarını ihtiva eder. Mahkemeye sicil incelendiğinde anlaşılacağı üzere hem müslim hem de zimmîler eşit haklarla başvurup haklarını şer'i mahkemede şer'i hukuka göre arayabilmişlerdir. Dolayısıyla şer'iyye sicilleri döneme ışık tutması açısından çok ehemmiyetli kaynaklardandır."
