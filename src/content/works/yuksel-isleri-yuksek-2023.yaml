abstract: "Modern dönemlerde teknoloji alanındaki gelişmelerin sağladığı imkanlar, pek çok farklı alanda yeni gelişmelerin kaydedilmesine sahne olmuştur. Tıp ve biyoteknoloji alanı da bu gelişmelerin yaşandığı sahalardandır. Bu alanlardaki söz konusu gelişmeler, insan bedeni üzerinde gerçekleştirilen tıbbî uygulamalar alanında başarılı sonuçlar elde edilmesini sağlarken, beraberinde dinî ve etik açıdan bazı yeni sorunların doğmasına da neden olmuştur. Bu sorunları gündemine alarak, karmaşık ve çözüm bekleyen tıbbî meselelerin fıkhî hükmünün ortaya konması ve halkı dinî açıdan aydınlatma görevi fetvâ kurumlarına aittir. Ayrıca bu kurumlar, tıp ve sağlık alanında ortaya çıkan yeni soru ve meseleleri cevaplandırma amacıyla belirli periyotlarda alan uzmanı hekimlerle bir araya gelerek birtakım çalışmalar yapmaktadır. Söz konusu fetvâ kurumlarından biri de resmi olarak dinî konularda fetvâ verme ile sorumlu olan, aynı zamanda İslam camiasındaki diğer muteber fetvâ kurumlarının çalışmalarını ve kararlarını takip ederek, müsteftînin tıbbî sorularını cevaplandırma görevi bulunan, ülkemizdeki Diyanet İşleri Başkanlığı'na bağlı Din İşleri Yüksek Kurulu'dur. Giriş ve dört bölümden oluşan bu çalışmada, Din İşleri Yüksek Kurulu'nun tıbbî ve biyoteknolojik meseleleri konu edinen tıp ve sağlıkla ilgili fetvâlarına yer verilmektedir. Çalışmamızın ilk bölümü, Din İşleri Yüksek Kurulu ve fetvâ metodolojisi başlığı altında Kurul'un tarihî süreç ve işleyişine, fetvâların serdedilme sürecinde takip ettiği yönteme, esas aldığı ilke ve kriterlere hasredilmiştir. Bu sayede konularına göre çeşitli başlıklar altında tasnif edilen tıbbî fetvâların, hangi yöntem ve kriterler esas alınarak serdedildiği anlaşılır kılınmaktadır. İnsan bedenine müdahaleye yönelik meselelerin ele alındığı ikinci bölümde, tedavi ve estetik maksatlı bedene müdahaleye dair karar ve fetvâlara değinilmektedir. Kadın ve kadın sağlığı ile ilgili meselelere odaklanılan üçüncü bölümde, âdet (regl), menopoz, gebelik ve lohusalık, doğum kontrol yöntemleri, kürtaj, hekimlik ve etik konularına yönelik verilen karar, mütalaa ve fetvâlar değerlendirilmiştir. Çalışmanın son bölümünde ise hayatın başlangıcı ve sonuna yönelik meselelerin konu edinildiği embriyo, tüp bebek, beyin ölümü, ötanazi, dnr (don't resuscitate), organ bağışı, otopsi ve kadavra konularına yönelik serdedilen karar, mütalaa ve fetvâlar ele alınmıştır. Şunu da belirtmek gerekir ki çalışmamızın muhtevası tıbbî meselelerle ilgili fetvâları içerdiğinden dolayı hastalıkların ibadetlere olan etkisini ele alan fetvâlar, doğrudan konu edinilmemiş fakat konu gereği bazı örnekler üzerinde durulmuştur."
