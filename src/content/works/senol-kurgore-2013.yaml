abstract: "Hayvansal gıdalardan hangilerinin helal, hangilerinin haram olduğu hususu asırlardır insanların zihnini meşgul eden önemli konuların başında yer almaktadır. Kur'an'da da bu konuya yer verilmiş, yiyecekler temiz ve pis olanlar diye ikiye ayrılmış; temiz olanlar helal, pis olanlar haram kılınmıştır. Haramlar; kesilmeden ölmüş hayvan, akıtılmış kan, domuz eti ve Allah'tan başkasının adı anılarak kesilenler şeklinde açıklanmıştır. Ayrıca Hz. Peygamber'den nakledilen bazı hadislerde birtakım hayvansal gıdaların yasaklandığı görülmektedir.“Kur'an'a Göre Hayvansal Gıdalarda Helallik Ölçüleri”adı verilen bu tezde işte bu konular incelenmiştir. Birinci bölümde helal gıda ile ilgili önemli kavramlar, ikinci bölümde önce Kur'an'da haram kılınan hayvansal gıdalar, ardından bazı hadislerde bulunan hayvansal gıda yasakları konusu incelenmiştir. Üçüncü bölümde ise hayvan kesimi ve bununla ilgili güncel meselelere yer verilmiştir."
