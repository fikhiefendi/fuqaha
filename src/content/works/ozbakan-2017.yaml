abstract: "Bu tez çalışması, Hicaz Demiryolu'nun halk veya devlet eliyle olsun dışardan ve içeriden sadaka, kredilerden finanse edilmesini incelemektedir.Araştırmacı bu çalışmasında Tarihi açıklama yöntemini kullanmıştır.Çalışma sonunda araştırmacı Osmanlı Devleti bütçesi'nin açık verdiği ve müsebbibleri olan siyasi, iktisadi, etkenlerinin olduğu bu sebepten ötürü devlet bütçesinden bu proje finanse edilememiştir.Bundan dolayı başka finans araçları bulma ihtiyacı doğmuştur.Başlıcaları devletin içinden ve dışından alınan bağışlar.Padişah ve vezirleri tarafından olsun veya islam coğrafyasından olsun finans edilmeye uğraşılmıştır. Kredi şeklinde borçlanmanın az bile olsa Ziraat Bankasından faizle olması İslam İktisadında caiz değildir.Aynı zamanda bu projenin vakfedildiği ve kamu yararına sömürgeci devletlerin isteklerini gözler önüne serer.Hicaz Demiryolunun geçtiği devletlerde bir daha Şam'dan Hicaz'a doğru faaliyete geçmesini tavsiyede bulunur.Araştırmacı bu proje için İslam ahkamıyla uyuşan birkaç finans yöntemi sunmaktadır. Bunlardan;Vakıf Sukuku üzerinden finanse edilmesi, selem ve istisna' akitlerinden finansı, Katılım müesseselerinin toplu finans yöntemini uygulamalarıdır. Anahtar Kelimeler; Hicaz Demiryolu, II.Abdülhamid, Finans, İslam İktisadı"
