abstract: "Bir düşünce, duygu ya da doğa olayını ifade etmek amacıyla, ölçülü ve uyumlu seslerin belirli bir sanatsal anlayış dâhilinde, ritimli ya da ritimsiz bir araya getirilmesiyle oluşan müziğin, İslam'daki hükmü geçmişte olduğu gibi günümüzde de önemli tartışma konuları arasında yer almaktadır. İslam'da bazı konuların helâlliği ve haramlığı hakkında şüphe yokken müziğin hükmü konusunda ihtilaf vardır. İslam Alimleri müziği helâl ve haram olmak üzere iki ayrı kısımda incelemişlerdir. Bu noktada İslam âlimlerinin istisnai durumlar dışında müziği genel olarak yasakladığı görüşlerinin yanında müziğin İslam hukuku ilkelerine uygun olması halinde helal olabileceğini savunan görüşler de vardır. Bu çalışmada müziğin aleyhinde ve lehinde rivayet edilen hadis-i şeriflerin ışığında Zâhirîlik mezhebinin müziğe bakışının araştırılması ele alınmıştır. Giriş bölümünde konumuzun önemi, kapsamı ve işleniş yöntemi bulunmaktadır. Birinci bölümde Zâhirî mezhebinin doğuşuna, yayıldığı yerlere, mezhebin görüşlerine ve ünlü Zâhirî âlimlerine yer verdik. İkinci bölümde mûsikî ile ilgili ayet ve hadisler hakkında Zâhirîlerin yorumları bulunurken sonuç bölümünde ise incelediğimiz konunun genel değerlendirilmesi yapıldı. Zâhirîlerin mûsikî ile ilgili görüşleri hakkında ulaştığımız sonuçlara değinilirken Zâhirîliğin diğer mezheplere göre farklılıklarını değerlendirdik."
