abstract: "Şerh geleneği İslâm ilimlerinde önemli bir telif türüdür. Genellikle önemli âlimlerin eserlerini daha iyi anlaşılır hale getirmek amacıyla ortaya konulan bu yazım türünün en yaygın örneklerinden birisi el-Fıkhu'l-ekber risâlesi ve şerhleridir. Hammâd b. Ebû Hanîfe tarafından rivayet edildiği öne sürülen bu muhtasar metnin Ebû Hanîfe ile ilişkilendirilmesi üzerine dikkatleri üzerine çekmiş ve dokuzuncu asırdan itibaren şerh edilmeye başlanmıştır. Araştırmalar sonucunda çoğunluğu Arapça ve Osmanlı Türkçesi olmak üzere farklı dillerde yazılan elliye yakın şerh, ta'lîkât ve tercüme tespit edildi. Bunların müellif bilgisi, kütüphane kayıtları ve yazım amaçlarına dair bilgiler sunuldu. Nüsha araştırmasında katalog bilgisi ile yetinilmeyip bizzat nüshanın kendisine ulaşıldı. el-Fıkhu'l-ekber risâlesi üzerine yazılan ilk şerhin belirlenmesi de bu çalışmanın ana konularından birisidir. Tetkikler neticesinde Mâverâünnehir kökenli bir âlim olan Ahmet b. Seyfettin en-Nesefî es-Semerkandî'nin yazdığı Şerhu'l-Fıkhi'l-ekber adlı eser tespit edilerek tahkiki gerçekleştirildi. Muhtevası konu başlıklarına göre tasnif edilerek tahlil ve değerlendirmesi yapıldı. Şerhin çizdiği çerçeve doğrultusunda özellikle kelâm mezhepleri ile İslâm filozofları arasında ihtilaf konusu olan meseleler analiz edilerek şârihin Ehl-i Sünnet dışı fırkalara yönelik eleştirilerine yer verildi."
