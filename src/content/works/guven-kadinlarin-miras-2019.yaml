abstract: "Miras kavramı, ölen bir kişinin terekesinden yakınlarına intikal eden mal veya malları ifade etmektedir. Miras Hukuku ise mal varlığının akibetini düzenleyen kurallardır. Çağdaş hukuk ile İslam hukukunun birleştirilmeye çalışıldığı Osmanlı Devleti'nin medeni kanunu Mecelle 1868-1876 yılları arasında Ahmet Cevdet Paşa tarafından hazırlanmıştır. İsviçre Medeni Hukukunun Türk Medeni Hukuku'na uyarlanmasıyla birlikte daha önceki İslam Miras Hukuku uygulaması Mecelle yürürlüklükten kaldırılmıştır. İslam dininin düzenlediği müesseselerden biride miras konusudur. Miras konusunda İslam Hukuku modern hukuktan farklı hükümler içermektedir. Kur'an'ın koyduğu mali hükümler genel olarak külfet nimet dengesini gözetmektedir. Miras Hukuku da bu kapsamda değerlendirilmektedir. Ancak toplumda Miras Hukuku konusunda kadına yönelik bir eşitsiz durumun olduğuna dair algı da bulunmaktadır. Bu çalışmada hem İslam Hukuku ve Medeni Hukukta miras konuları teorik olarak ele alınmış hem de uygulamalı araştırma kısmında kadının miras hukukundaki haklarının toplumsal yansımalarını belirlemek amacıyla hazırlanan ölçek Karabük ilinde 400 bayana uygulanmıştır. Bayanlar yaşları itibariyle üç kategoriye ayrılmıştır. Verilen cevaplar ile bağımsız değişkenler arasında çapraz ilişki tabloları incelenmiştir. Anlamlı ilişki bulunan her tablo tek olarak ele alınmış ve sosyolojik olarak yorumlanmıştır. Anlamlı ilişki bulunmayan veriler ise yorumlanmamıştır. Araştırma sonucunda elde edilen verilerin bu alanda araştıma yapan araştırmacılara ve alanyazına katkı sunacağı düşünülmektedir."
