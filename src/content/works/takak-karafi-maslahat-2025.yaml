abstract: "Bu çalışma, Mâlikî fakihlerinden Şehâbeddin el-Karâfî'nin maslahat ve mefsedet teorisinin mahiyetini ve İslâm hukuku düşüncesi üzerindeki etkilerini incelemektedir. Araştırmada, öncelikle maslahat kavramının fıkıh usûlündeki yeri, tarihsel gelişim süreci ve Karâfî'den önce yaşamış alîmlerin maslahat ve mefsedetle ilgili farklı anlayışları ele alınmıştır. Karâfî'den önce yaşamış Sahâbe ve Tâbiîn döneminden itibaren önemli usûlcülerin görüşleri incelenerek Karâfî'nin düşünce dünyasının arka planı ortaya konmuştur. Çalışmanın yöntemi literatür taramasına dayanmaktadır. Kaynak eserler ve ikincil literatür üzerinden yapılan analiz de, Karâfî'nin maslahat ve mefsedet teorisini sistemli bir yapıya kavuşturduğu, teorisini küllî kaideler ekseninde inşa ettiği ve siyaset fıkhı gibi alanlarla ilişkilendirdiği tespit edilmiştir. Ayrıca onun yaklaşımının, çağdaş hukuk kodifikasyonu girişimlerinde ilham kaynağı olduğu ve sonraki dönem âlimleri üzerinde derin izler bıraktığı sonucuna ulaşılmıştır. Araştırma bulguları, Karâfî'nin teori inşasında tutarlı bir metodoloji izlediğini, maslahat–mefsedet dengesini kurarken hem şer'î nasları hem de toplumsal yararı gözettiğini göstermektedir. Onun yaklaşımı, Şâtıbî, İbn Âşûr, Tûfî, İbn Teymiyye ve diğer pek çok âlimin düşünce çizgisini etkilemiş; ayrıca maslahatın modern dönemdeki uygulanabilirliği açısından da önemli bir teorik zemin oluşturmuştur."
