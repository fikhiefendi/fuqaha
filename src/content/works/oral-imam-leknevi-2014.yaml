abstract: "Halkın ilgi ve sevgisini kazanmış ilim adamları hiçbir dönemde onların sorun ve sıkıntılarına bigane kalamamış, bu sıkıntılarını gidermek için fetva kitapları kaleme almışlardır. Geçmişten günümüze önemini hiç kaybetmeyen iftâ ve bunları bir kitapta toplama geleneği son dönemlerde de yine âlimlerce kullanılmıştır. 19. Yüzyıl âlimlerinden fakih, muhaddis, mütekellim, usûlî Abdülhay b. Abdülhalim el-Leknevî de kendisine sorulan fetvaların cevaplarını topladığı bir eser meydana getirmiştir. Bizim bu çalışmamız Fetâva'l-Leknevî ismiyle maruf Nef'u'l-müftî ve's-sâil bi cem'i müteferrikâti'l-mesâil isimli bu eserin incelenmesini, değerlendirilmesini, genel özelliklerinin sıralanmasını ve kullandığı yöntemlerin tespitini ihtiva etmektedir."
