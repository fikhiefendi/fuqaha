abstract: "Bu tezde Ebu'l-Abbâs Ahmed b. Ömer ed-Deyrabî'nin (ö. 1151) Gâyetü'l-Murâd Limen Kasurat Himmetuhû Mine'l-Ibâd isimli Şâfiî fıkhına dair eşsiz bir eserinin tahkik ve analizi yapılmıştır. Müellif eserde ümmü'l-veledle alakalı özgürleştirme, satma, rehin, istifade etme nesep vb. gibi fıkıh kitaplarında yer alan konuları ele almıştır. Araştırmanın önemi, Deyrabî'nin ilmi konumundan kaynaklanmaktadır. Müellifin Şâfiî fıkhındaki konumu ve eserleri şerh etmedeki becerisine delalet eden birçok kitap ve risalesi mevcuttur. Eserin belli bir konuyla ilgili olmasına rağmen nadir bulunan kaynaklara yapılan atıflar, eserde yer alan birçok fıkhi görüş, deliller ve hilaf ilmine dair bilgiler kitabın önemini artırmıştır. Müellif alimlerin farklı görüşlerini nakletmiş, ayrı düşündükleri konuları beyan etmiştir. Araştırmada Ezher Kütüphanesinde yer alan iki yazma nüsha esas alınmıştır. İmam Deyrabî'nin şahsi ve ilmi hayatı yazılırken betimleyici tarihsel metot kullanılmıştır. Konuyla ilgili fıkhi görüşlerin bir araya getirilmesi, istidlâl ve tercihte fakihin hangi metodu kullandığını ortaya koyacak şekilde hükmün açıklanmasında betimleyici analitik tümevarım yöntemi tercih edilmiştir. Metnin yazılması ve dipnotta yorumlanmasında talik ve tahkik yöntemi kullanılmıştır. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Eser Deyrabî'nin ümmü'l-veledle ilgili yapmış olduğu bir şerh çalışmasıdır. (Satım, rehin, özgürleştirme, nesep, çocuklarının ve efendilerinin hükümleri) Zekeriye el-Ensârî'nin Şerhu Kitâbi't-Tahrîr isimli eserinin son bölümünden seçilerek oluşan eserde meseleler kısa ve sağlam bir şekilde ele alınmıştır. Eser bu yönüyle memzûc şerhler kategorisinde sayılabilir. Zira müellif eserde metin ile şerhi birbirlerinden ayırmadan iç içe vermiştir. Bahsedilen konuyla ilgili Mâverdî, Begavî, Nevevî, İbn Raf'a ve Zerkeşî gibi Şâfiî alimlerin görüşleri verilmiştir. Zaman zaman naklettiği görüşleri eleştirmiş, görüşleri tartışarak istidlâl ve fıkhi kaidelere uygun olanını tercih etmiştir. Araştırma Deyrabî'nin eserinin kaynaklar yönüyle zengin olduğunu kanıtlamıştır. Müellif, Ramlî, İbn Hacer, Hatîb Şerbînî gibi mezhebin önemli alimlerinden nakiller yapmıştır. Lügat ve nahiv konularına önem vermiş, müşkil lafızlar konusun üzerinde durarak doğru harekeyi sarf yönüyle izah ederek tespit etmiştir. Şerhü't-Tahrîr isimli eser geçen bazı kelimelerin irabı üzerinde durmuştur. Müelilfin yaşadığı dönemde ortaya çıkan, cevap verilmesi gereken yeni meseleler ele alınmış, bu konular hocaları et-Tûhî, el-Beşîşî ve eş-Şebramlesî ile tartışmıştır. Özetle eser, Deyrabî'nin fıkhi konumu, istidlâl ve tercih konularındaki maharetine delalet etmektedir. Fıkıh, hadis, ferâiz, siyer, itikat, astronomi ve tıp gibi çeşitli ilimlerde kaleme aldığı çok sayıda eserde ortaya çıkan ansiklopedik bir kültüre sahip olması ve kendisine ait olmayan bir şey isnat edilerek sahtekarlığa düşmekten sakınması, kitabına büyük bir ilmî değer kazandırmıştır."
