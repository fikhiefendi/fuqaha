abstract: "Osmanlı Devleti'nde İslâmi hukuk kuralları geçerliydi. Bütün hukukî olaylar kadıların verdikleri karar suretleri, hüccetler ve yargıyı ilgilendiren çeşitli yazılı kağıtlar Şer'iyye sicillerine kaydedilirdi. Şer'iyye Sicilleri zengin içeriği ile Türk tarihinin en önemli kaynaklarından biridir. Kadılar ve onların yerine görevlendirdikleri naiplerin kararları devlet merkezinden gönderilen emir ve fermanlar, dönemin iktisadî, idarî, hukukî ve sosyal yönlerini aydınlatacak belgeler, Şer'iyye sicillerinde bulunmaktadır. Şer'iyye Sicilleri, Osmanlı tarihinin yazılmasında önemli kaynaklar arasındadır. Oluşturulan eser, 1879-1881 tarihleri arasındaki Maraş tarihinin sosyal, ekonomik, idarî ve hukukî yönlerini, araştırma yapan kişilerin faydalanması amacıyla oluşturulmuştur. Osmanlı tarihinde Maraş ile ilgili yapılacak çalışmalarda Şer'iyye sicillerine başvurulmadan yapılacak çalışmalar, yetersiz kalacaktır. Çalışmada 8983 numaralı Maraş Şer'iyye Sicilinin 1-105. sayfalarının transkripsiyonu, değerlendirilmesi ve özeti hakkında bilgi verilmiştir. 8983 Numaralı Maraş Şerʻiyye Sicil defteri içerisindeki belgelerde alacak-verecek(borç), alım satım, miras, vâris ve vasî tayinleri, atama, görev tevcihi, yağmalama, hırsızlık gibi konular bulunmaktadır. Belgeler içerisinde alacak-verecek ve vasî tayinleri davaları en fazla olanlardır."
