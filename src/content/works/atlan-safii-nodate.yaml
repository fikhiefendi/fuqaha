abstract: "Bu çalışma, İslâm Hukuku'nun mühim sahalarından biri olan kavâid ilmini Şâfiî mezhebi çerçevesinde ele almakta; bu ilmin teşekkülünü, tarihî seyrini ve fıkhî muhakeme içerisindeki yerini incelemeyi amaçlamaktadır. Araştırma, Şâfiî geleneğinde bu ilmin çok erken dönemlerde belirgin bir usûlî istikrar kazandığını ortaya koymaktadır. Bu bağlamda, kavâid ilminin usûl ve furû' meselelerde hüküm muhakemesini yönlendiren esaslar olarak kullanıldığı; kâidelerin ilk formülasyon örneklerinin, deliller arasındaki tertip ve mezhep içi istidlâl anlayışı çerçevesinde İmam Şâfiî'nin yaklaşımında açık bir şekilde görülebildiği değerlendirilmektedir. Bu itibarla, İmam Şâfiî'nin usûl-i fıkhın tedvinindeki kurucu rolünün, kavâid düşüncesinin teşekkülünde de belirleyici bir mahiyet taşıdığı anlaşılmaktadır. Çalışmada, kavâid ilminin kâideleştirme süreci, hüküm istinbâtındaki işleyişi ve fıkhî muhakeme içindeki fonksiyonu bakımından, İmam Şâfiî'nin yaklaşımının erken ve etkili örnekler sunduğu tespit edilmektedir. Zira onun tarafından vaz' edilen birçok küllî ilkenin, zamanla mezhep sınırlarını aşarak fıkhî müşterekler arasında yerini aldığı görülmektedir. Bu yaklaşımın somut bir yansıması olarak, Şâfiî mezhebi âlimlerinin eşbâh ve nezâir, furûk, davâbıt, külliyyât, makâsıd kâideleri ve tekâsîm-i fıkhiyye gibi sahalarda, söz konusu alanları müstakil telif konusu hâline getiren ilk fakihler arasında yer aldıkları anlaşılmaktadır. Üç bölümden müteşekkil olan çalışmanın birinci bölümünde kavâid ilmine dair genel bir çerçeve çizilmekte; bu kapsamda kavâid ilminin tarifi, kaynakları, fıkıh usûlü ile ilişkisi ve eşbâh ve nezâir literatürü başta olmak üzere kavâidle irtibatlı ilim dalları ele alınmaktadır. İkinci bölümde, kavâid ilminin müstakil bir disiplin hâline gelmeden önceki tarihî seyri, Şâfiî mezhebinin usûl yapısı, fıkıh kâidesinin teşekkül unsurları ve şartları ile kâidelerin türleri ve mezhep içindeki gelişim süreci incelenmektedir. Üçüncü bölümde ise Şâfiî kavâid literatürünün tedvin ve tertip süreci, bu ilmin mezhep içerisinde kazandığı kurumsal mahiyet, kâidelerin delil değeri, istisnâların konumu, kâide-istisnâ-kıyas ilişkisi ve diğer istidlâl yollarıyla olan irtibatı tatbikî örnekler çerçevesinde ele alınmaktadır."
