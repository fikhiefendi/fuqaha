abstract: "Bankacılık işlemleri modern yaşamın vazgeçilmez bir parçası haline gelmiş olup, bu işlemlerin çoğu yatırım ve fon geliştirme amaçlıdır. Ancak bu tür işlemler İslami bankalarda klasik konvansiyonel bankalardan farklıdır. Bu bankalar kalkınma esaslı faaliyetlerinin çoğunu haram kılınmış olan faiz temelleri üzerinde yönetirken, İslami bankalar mali işlemlerinin çoğunu, her türlü riba kirliliğinden uzak, meşru ticaret ilkeleri üzerine kurarlar. Bu bağlamda Murabaha, İslami bankaların yatırım yapmak ve fon geliştirmek için kullandıkları en başarılı ve önemli yöntemlerden biridir. Bu gaye ile tezde, İslam şeriatının ruhuna uygun bir şekilde ele alıp istenilen gelişmeyi sağlayan şeri murabahanın en önemli yönlerini Allah'ın ve Resulü'nün (s.a.v.) yasakladığı şeylerden kurtulmanın nasıl mümkün olduğunu gösteren murabaha satışlarından örnekler toplamaya çalıştım. Dolayısıyla araştırma, murabaha kavramını, meşruiyetini, esaslarını ve şekillerini açıklamak açısından bankacılık sektötündeki haliyle murabahayı açıklamayı amaçlamaktadır. Ayrıca bankacılık murabahasının hükmünü ve mahiyetini açıklamayı ve İslami bankalarda murabaha yoluyla gerçekleştirilen finansmanın yüzdesini netleştirmek de tezin amaçlarındandır. Tezde her ne kadar fıkhi murabaha hakkında yazıp hükmünü detaylı olarak anlatsam da, özellikle Murabaha lil amiri biş-şira veya bankacılık murabahası denen şekliyle Murabaha konusuna özen gösterdim. Bunun yanında benden önce konuyu doğrudan benim gibi ele alan kimsenin olmadığını da görmüş oldum. Bu çalışma ile Yüce Allah'tan beni faydalandırmasını ve bu mütevazi çalışmayı okuyanların da istifa etmelerini sağlamasını temenni ediyorum."
