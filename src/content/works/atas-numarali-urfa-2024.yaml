abstract: "211 Numaralı Urfa Şer'iyye Sicilinin incelendiği bu çalışma, H. 1292-1293/M. 1875-1876 tarihleri arasındaki dava tutanaklarını tahlil eder. İki yüz yirmi sekiz sayfadan oluşan sicil defterinde; tereke taksimi, vasi/vasiye tayini, alacak-verecek işlemleri, miras, mehir ve nafaka davalarını konu alan kayıtlar mevcuttur. Mahkemeye intikal etmiş hukuki işlemleri içeren bu kayıtlar bir yıllık bir süreyi kapsamaktadır. Mahkemeye başvuruların geneli şehir merkezindeki mahalle sakinleri tarafından yapılmış olup, az da olsa kırsal bölgelerden Urfa kadı mahkemesine başvuruların olduğu görülür. Tereke kayıtları maddi kültür öğelerini barındırdığından, gündelik hayatta kullanılan pek çok kişisel eşya listelenebilmiştir. Hukuken çocukların hak ve gözetimini konu alan vasi/vasiye tayin işlemleri ise bakıma muhtaç bir yetimin rüşt yaşına kadar muhafaza biçimini ortaya koymaktadır. Şehir sakinlerinin birbirleriyle alacak-verecek işlemleri ise dolaylı şekilde dönemin ekonomik durumuna ayna tutmaktadır. Miras bölüşümleri, aile üyelerinin reflekslerini görmeye, mehir ve nafaka davaları ise Urfa kadınlarının hak arayış biçimlerini tahlile imkân tanımaktadır. Dolayısıyla yerel tarih araştırmaları için son derece önemli bilgiler içeren bu kayıtlar; dönemin sosyal, ekonomik ve kültürel hayatı hakkında fikirler verecek nitelikte kaynaklar olarak öne çıkmaktadır."
