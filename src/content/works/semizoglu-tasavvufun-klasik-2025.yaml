abstract: "İslâm düşünce tarihinde sosyal hayata olan etkisi sebebiyle tevekkül-kesb ilişkisi tartışma konularının başında gelmektedir. Zira“Allah'a dayanmak ve güvenmek”anlamına gelen tevekkül ile“çalışmak, mal toplamak”manasını ihtiva eden kesb arasında bir zıtlık olduğu düşünülmekte ya da bu konuda ölçünün ne olacağı hakkında farklı yorumlar dikkat çekmektedir. Çalışmanın amacı hicri ilk beş asırda yaşamış (Gazzâlî'ye kadar) zühd, vera' ve helal kazanç konusunda oldukça titiz davranan sûfîlerin söz ve davranışlarına binaen kesbin tevekküle engel olup olmama meselesini izah etmektir. Bu nedenle ilk olarak hicri ikinci asırda yazılan İmam Muhammed Şeybânî'nin Kitâbü'l-Kesb'i ile hicri üçüncü asırda kaleme alınan Hâris el-Muhâsibî'nin el-Mekâsib ve'l-vera'ı çalışmanın temel referanslarıdır. Nitekim bu iki müellifin zühdde aşırıya varan sûfîlerin davranışlarını eserlerinde yeme, içme, giyme, dilenme ve çalışma üzerinden tenkit ettikleri müşahede edilir. Birinci bölümde Şeybânî ve Muhâsibî'nin kitaplarından yola çıkılarak tevekkül-kesb çerçevesinde dinî ve tasavvufî düzlemde gelişen bu tartışmalara yer verilmiştir. Bilhassa tevekkülün öncüleri olarak zikredilen İbrâhim b. Edhem, Şakīk-ı Belhî, Hâtim el-Esam, Ebû Türâb en-Nahşebî ve Ahmed b. Hadraveyh'in tevekkül-kesb konusundaki tutumları bu kısımda değerlendirilmektedir. İkinci bölümde Şeybânî ile Muhâsibî'nin tevekkül-kesb kavramlarına yapmış oldukları yorumlar mukayese edilerek tevekkül-kesb konusunda problemli bulunan ve çözüm üretilen meseleler incelenmiştir. Son bölümde ise Şeybânî ve Muhâsibî'nin hicri dördüncü ve beşinci asırda tasavvuf metin yazarlarına olan etkileri tahlil edilmektedir. Bu eserlerin incelenmesinin sonucunda görülmüştür ki hicri dördüncü asır müelliflerinin tevekkül-kesb konusunda eleştirilen sûfîlerin tevekkül-kesb düşüncelerine yer vermedikleri gibi onların eserlerinde melâmet bahsine de rastlanılmamıştır. Hâlbuki beşinci asra geldiğimizde tasavvuf metinlerinde bu sûfîlerin tevekkül-kesb görüşleri taltif edilmekle beraber çoğu tasavvuf metinlerinde melâmet konusuna da müstakil olarak başlık açtıkları tespit edilmiştir."
