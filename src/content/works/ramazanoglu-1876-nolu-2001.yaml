abstract: "ÖZET Çalışmamızın, biri Trabzona ait 1876 nolu şer'iyye sicili ve bu sicildeki sulh kayıtlan diğeri de sulh teorisini ortaya koyan kaynaklar olmak üzere iki temel dayanağı bulunmaktadır. Bu çalışmada, işaret etteğimiz derlerde yer alan sulh kayıtlarını ele alıp, buradaki uygulamalarla hem İslam hukuk teorisindeki, hem de modern hukuktaki sulhu karşılaştırdık. Maksadımız bir yandan o döneme ait hukuk pratiğini görmek diğer yandan da mahkemelerin ve halkın hukukî ilişkileri çözüme kavuşturmada izledikleri önemli yollardan birini ortaya koymaktı. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde genel olarak şer'ryye_şjcjlleıini, bu sicillerde bulunan belge çeşitlerini, sicillerin tarihî geüşirnini ve önemini ele aldık. Bu arada Trabzon şer'iyye sicilleri ve özellikle 1876 nolu sicil hakkında bilgiler verdik. Aynca sulh akdinin hukuk sistematiği içerisindeki yerine işaret ettik. Birinci bölümde sulh akdini; tarifi, hukuki dayanakları, hükmü, rükünleri ve şartlan açısından ele aldık. Aynca sulhun ibra, tahkim, af gibi yakın kavramlarla ilişkisini inceledik. İkinci bölümde önce sulh akdini farklı yönleriyle taksime tabi tuttuk. Mahiyeti açısından sulhu, davalı tarafin dava konusu şeyi ikrar edip etmemesi ya da iddiayı susarak karşılaması yönüyle ele alıp inceledik. Taraflar arasında ya da mahkemede icra edilmesi açısından da sulhu, adî ve kazaî olmak üzere ikiye ayırdık. Aynca dava konusu haklan ve bu arada sulh bedelinin neler olabileceğini ve bunlar üzerinde gerçekleşen sulhla ilgili hususlan ele aldık. Bunları“aynî mal davasından sulh”,“deyn davasından sulh”,“menfâat davasından sulh”ve“ayn, deyn ve menfâat dışı davalardan sulh”olmak üzere dört kısma ayırdık. Aynca veli ya da vasinin, vekilin veya fûzûlinin yaptıktan sulhu,“başkası adına yapılan sulh”başlığı altında inceledik. Son olarak da sulhta geçerli olan muhayyerliklere ve sulh akdinin feshedilmesine yer verdik. Konulan ele alırken bir tarafdan İslam hukuku kaynaklarından istifade edip farklı mezheplerin görüşlerini, yeri geldikçe modern hukukla da karşılaştırarak, tesbit etmeye; diğer taraftan da bunlarla defterdeki sulh kayıtlan arasında ilgi kurmaya gayret ettik. Böylece hem teorik hem de pratik yönüyle sulh sözleşmesini incelemeye çalıştık. vm"
