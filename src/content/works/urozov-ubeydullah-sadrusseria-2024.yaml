abstract: "Bu çalışmamızda Hanefî fıkıhının önde gelen şahsiyetlerinden biri olan ve“İkinci Sadrüşşerîa”lakabıyla şöhret kazanan Buhâralı İslâm âlimi Sadrüşşerîa Ubeydullah b. Mes'ûd'un (ö. 747/1346) fıkıh ilmeindeki yeri ve“Şerhu'l-Vikâye”isimli eseri incelenmiştir. Sadrüşşerîa'nın bu eseri ilim çevrelerince ilgi görmüş ve güvenilir bir kaynak olarak ilim taliplerince asırlar boyunca istifade edilen bir eser olmuştur. Mâverâünnehir bölgesinde, XIII. ve XIV. yüzyıl âlimleri arasında müstakil ictihadlarda bulunabilen ve Hanefî mezhebinin usûl ve esaslarının korunması konusunda önemli bir yeri olan Sadrüşşerîa Ubeydullah b. Mes'ûd, yaşadığı dönem itibarıyla müctehidler arasında çok saygı gören bir fıkhî kişiliktir. Ubeydullah b. Mes'ûd'un anne ve babasının meşhur bir ulemâ ailesinden geldiğini gösteren bir şeceresi nakledilmektedir. Büyük dedelerinden Cemâleddin Ubeydullah b. İbrâhim el-Mahbûbî (ö. 630/1233),“Ebû Hanîfe es-Sânî”diye tanınan ve döneminde Hanefîlerin lideri konumunda olan bir âlimdir. Sadrüşşerîa'nın hem baba hem anne tarafından dedelerinin babası da Sadrüşşerîa diye tanındığı için büyük dedesinin lakabına 'el-Ekber' ve 'el-Evvel', kendisininkine 'el-Esgar' veya 'es-Sânî' sıfatları eklenmiştir. Aslı Arapça“Şerhu'l-Vikâye”adlı eserin çeşitli el yazmaları arasından, Türkiye'de Ankara'daki Milli Kütüphane'de ve Özbekistan'da İmam Buhârî Uluslararası Araştırma Merkezi'nde bulunan Arapça orjinal nüshalarından faydalanılmıştır. Genel olarak, tezimizde Dr. Salâh Muhammed Ebü'l-Hâc tarafından tahkik edilen“Şerhu'l-Vikâye: Müntehe'n-Nükâye 'alâ Şerhi'l-Vikâye”adlı nüsha esas alınmıştır.“Şerhu'l-Vikâye”eserinin İslâm hukukundaki yeri ve yazıldığı dönemin şartları üzerine değerlendirmeler yaparak, eserin fıkıh literatüründeki konumunun belirlenmesi amaçlanmıştır. Ayrıca, Sadrüşşerîa'nın İslâm hukukuna katkıları, fıkha kaynaklığı, yöntemi, eserinde vurguladığı noktalar, kendisinden önceki hukukçuların görüşleriyle ilişkisi gibi konuların“Şerhu'l-Vikâye”temelinde incelenmesi çalışmamızı önemli kılmaktadır."
