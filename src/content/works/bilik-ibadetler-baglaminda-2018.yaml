abstract: "Hz. Âişe'nin ilim sevgisi, sorularını sormaya gelen kadınlara refâkât ve aracılık etmesi, onu teorik ve pratik ilimlerde ileri bir seviyeye çıkarmıştır. Böylece sahabe arasında önde gelen fakihler arasında sayılmıştır. Fıkhi meselelerde O, Raşit halifelerin, sahâbenin ve diğer Müslümanların görüşüne başvurduğu önemli şahsiyetlerden biri olmuştur. Hz. Âişe özellikle kadınlara ait özel meseleler ile ibadetler konusunda Hz. Peygamber'den bazı rivâyetler naklettiği gibi bu konularda içtihatlarda da bulunmuştur. Kendisine sorulan sorulara verdiği cevaplar ve fıkhi konulardaki görüşleri zamanına ışık tuttuğu gibi sonraki dönemlerde yaşayan mezhep imamlarına da kaynaklık etmiştir."
