abstract: "Hz. Peygamber dönemi sonrasında hadisleri tedvin ve tasnif eden birçok muhaddis yetişmiştir. Sahâbe, tâbiîn ve tebeu't-tâbiîn dönemlerinde hadis ilmi üzerine değişik alanlarda çalışmalar yapılmış ve birçok hadis kitabı telif edilmiştir. Bu çalışmada tebeu't-tâbiîn döneminde telif edilmiş olan Rebî' b. Habîb'in Müsned'i ile İmam Mâlik'in Muvatta'ını metin yönünden karşılaştırmaya çalışılmıştır. Tezimiz giriş ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, önemi, metodu ve kaynakları üzerinde durulmuş, İbâdiyye mezhebinin teşekkülü, görüşleri ve hadis kaynakları hakkında bilgi verilmiştir. Birinci bölümde, Rebî' b. Habîb'in hayatı, hocaları, öğrencileri ve eserleri hakkında bilgi verilmiştir. İlmî kişiliği ile muhaddislerin Rebî' b. Habîb hakkındaki görüşlerine de yer verilmiştir. Ayrıca İmam Mâlik b. Enes'in hayatı, eserleri ve Muvatta' hakkında bilgi verilmiştir. İkinci bölümde Rebî' b. Habîb'in Müsned'i rivayet ve dirâyet açısından tahlil edilmiş, eserin tarihçesi, tasnif metodu ve eserdeki rivayetler hakkında bilgi verilmiştir. Daha sonra Rebî' b. Habîb'in Müsned'i ile Mâlik b. Enes'in Muvatta'ı, metin yönünden karşılaştırılmış her iki muhaddisin birbirlerinden hadis rivayet edip etmedikleri, hadislerin metinleri arasındaki benzerlikler ve farklılıklar tespit edilmeye çalışılmıştır."
