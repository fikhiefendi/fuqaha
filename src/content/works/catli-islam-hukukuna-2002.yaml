abstract: "Evlenecek çiftin birbirine layık, uygun ve denk olması genel çizgileriyle hemen bütün toplumlarda aranan, gerekli görülen bir husustur. Denklik düşüncesi her yanı ile toplumlara mahsus değer hükümlerine, diğer yanıyla da evlenmenin maksadına dayanmaktadır. İslam'ın temel kaynaklan olan Kur'an-ı Kerim'de ve Sünnet'te evleneceklerin, herhangi bir ölçüye göre birbirlerine denk olmaları gerektiğini ifade eden bir nass yoktur. Müçtehitler yaşadıkları devirlerde hakim olan örf adetler ile sosyal değer hükümlerine bakarak evlilikte denkliğin yerini tespite çalışmışlardır. Denkliği evliliğin mutluluk sigortasıdır. Bu konu eş seçimi safhasında dikkate alınmıyor ama çok geçmeden problemler başlayınca her şey anlaşılıyor. Denklik dine, iktisada, sosyal seviyeye, örf ve adete, tarafların bilgi ve kültür seviyelerine, gördükleri eğitime, benimsedikleri değerler sistemine göre vb. bir çok değişiklik tablolar meydana getirmektedir. Bu tablolar içerisinde şüphesiz en önemlisi din ve ahlak noktasında olanıdır. Bütün mezheplerde bu noktada ittifak etmişlerdir. Kadın daha çok kocasının bakım ve himayesine muhtaç olduğu, erkeğe vakar ve onur kazandırdığı için denklik erkekte aranır. Buna rağmen eşler arasındaki denklik ortak özelliklerinin fazlalığı ne kadar kuvvetliyse evlilik o kadar sağlıklı yürür. Günümüz açısından daha birçok şartlan eklemek mümkündür."
