abstract: "İslam dininin, Kur'an'dan sonra ikinci temel kaynağı olan hadisler, özellikle naklî ilimler bakımından mühim bir referans kaynağı olmuşlardır. İslamî ilimler geleneğinin önemlilerinden olan fıkıh usûlü ilmi de bu temel kaynağı değerlendirmiştir. Fakihler özellikle bir takım metotlarla hadislerden hükümler çıkarmışlardır. Bu metodolojik çaba özellikle hadisin bir delil olarak kullanıldığını göstermektedir. Bu çalışma ile Hanefî fıkıhçısı Debûsî'nin Takvîmü'l-edille adlı eseri merkeze alınarak ehl-i reyin ve ehl-i hadisin hadise bakışının ele alınması amaçlanmıştır. Yapılan değerlendirmelerde hadisçilik tekniği ile hadisler ele alınmaya çalışılmış, sonrasında Takvîmü'l-edille'deki hadislerin hangi bağlamda hadis kitaplarında yer aldığı ve Debûsî'nin hadislere yer verme amacı tespit edilmeye gayret edilmiştir. Böylelikle iki tarafın hadisi değerlendirme amacı ile ilgili bir karşılaştırma yapılmaya çalışılmıştır."
