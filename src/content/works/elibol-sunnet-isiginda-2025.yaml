abstract: "Tayyibât bireyin nefsine ve duygularına hitap eden hoş ve güzel şeyler olarak ifade edilir. Habîsât ise çirkin ve değersiz oluşu nedeniyle insan tabiatına hoş gelmeyen şeyler olarak tanımlanır. Konunun önemine binaen Kur'ân-ı Kerîm'de ve hadislerde tayyib olanın tercih edilmesi, habîsten ise kaçınılması gerektiği sıkça vurgulanır. Tayyibât ve habîsât kavramları Müslüman bireyin hayatında büyük bir öneme sahiptir. Söz konusu kavramlar, günlük yaşamda sıkça karşılaşılan meseleler arasında yer almakta ve zamanla bu çerçeveye yeni konular dahil olmaktadır. Bu durum, tayyib ve habîs kavramlarının kapsamının günümüz koşullarında yeniden değerlendirilmesini zorunlu kılmaktadır. Bu doğrultuda, tayyibât ve habîsât kavramlarının değerlendirilmesinde belirleyici bir unsur olarak helâl belgelendirme ve akreditasyon süreçleri ön plana çıkmıştır. Türkiye'de ve dünya genelinde büyük bir etkiye sahip olan helâl belgelendirme ve akreditasyon günümüzde gıda, kozmetik, turizm, iktisat ve finans gibi birçok alanda büyük bir öneme sahiptir. Helâl belgelendirme ve akreditasyon süreci ürün ve hizmetlerin İslâmî ilke ve prensiplerine uygun şekilde tayyib ve habîs olarak değerlendirilmesine imkân tanır. Çalışmamızda öncelikle söz konusu kavramların kavramsal çerçevesi belirlenmiştir. Daha sonra, bu kavramlar gıda, kozmetik, turizm, iktisat ve finans gibi farklı alanlarda tayyib/habîs bağlamında değerlendirilmiştir.Sonuç olarak, tayyibât ve habîsât kavramları, İslam ahlakının ve hukukunun temel ilkelerinden biri olup, Müslüman bireyin hayatını şekillendiren önemli ölçütlerdir. Günümüzde hızla değişen yaşam koşulları göz önüne alındığında, bu kavramların içerdiği hükümleri anlamak ve uygulamak, İslâmî ilke ve prensiplere uygun bir yaşam sürdürmek adına önem arz eder."
