abstract: "oz Dünya' da 1963 yılından itibaren, ülkemizde ise 1985 yılından bu yana, dünyada İslam Bankacılığı“islamic Banking”, Türkiyede“Özel Finans Kurumlan”adıyla faaliyetlerini sürdüren finansal kuruluşlar çalışmamızın özünü teşkil etmektedir. Çalışmada Özel Finans Kurumlarının temel teorik ve felsefik esasları, tarihi süreci ve gelişimi, uygulamada kullanılan enstrümanlar ve bu enstrümanların Türkiyede uygalamş biçimleri, genel anlamda anlatılmıştır. Teorik yapısı genel anlamda belirlendikten sonra, Türkiyede faaliyet gösteren Özel Finans Kurumlan tanıtılmış, hukuki bakımdan geçirdikleri yasal süreç ve faaliyet yaparken dayandıkları temel yasal mevzuat özetlenmiştir. Özel Finans Kurumlarının mali yapısı ve finansal büyüklükleri, 1999, 2000 yıl sonlan ve 2001 yılı Eylül ayı itibarıyla karşılaştırmalı olarak analiz edilmiştir. Özel Finans Kurumlarının mali sistem içindeki yeri, mali sistemin en önemli aktörü olan bankacılık kesimi ile karşılaştınlarak incelenmiştir. En son bölümde çalışma tezinin esasım teşkil eden“Düşük Enflasyonist Ortamda Özel Finans Kurumlan'nın Karşılaşacağı Sorunlar ve Çözüm Önerileri”incelenmiştir. Yapılan bu incelemede ilk olarak enflasyon teorik olarak ele alınmış, ikinci olarak enflasyonun Türkiye ekonomisine ve mali kesimine etkileri incelenmiştir. Son olarak ise gerek kuruluşlanndan bu yana karşılaştığı ve gerekse düşük enflasyonist ortamda Özel Finans Kurumlarının karşılaşacağı sorunlar ve bu sorunlara getirilebilecek çözümler ele alınmıştır."
