abstract: "Tezimiz, bir giriş, iki ana bölüm ve bir sonuçtan meydana gelmektedir. Tezimizin giriş kısmında araştırmanın konusu, sınırları, amacı, önemi ve tezde izlenen yöntem hakkında bilgi verilmiştir. Bu kısımda ayrıca tezimizin daha sağlıklı anlaşılması ve iş- lenmesi için hakikat ve mecazla ilgili kavramsal bir çerçeve oluşturulmaya çalışılmıştır. Tezimizin birinci bölümünde Hanefî usulcülerin hakikat ve mecaz anlayışı teorik dü- zeyde ele alınmıştır. Bu bölümde Hanefî usulcülerin hakikat ve mecaz anlayışının teorik yönü elden geldiğince çok örnek verilerek anlaşılır kılmaya çalışılmıştır. Tezin ikinci bölümünde Hanefî usulü çerçevesinde hakikat ve mecazın lafızla ilgili konulara ve o konuların hakikat ve mecaza etkisi incelenmiştir. Hanefî usulcülerin hakikat ve mecaz anlayışı ile lafız ilgili konulara bakış açıları arasındaki ilişki, benzerlik ve farklılıklar göz önünde bulundurularak ele alınmıştır. Varılan sonuçlar tahlil edilmiş ve bu sonuçların fıkıhta elde edilen hükümlere etkisi üzerinde durulmuştur. Tezimizin sonuç bölü- münde ulaşılan neticeler özet bir şekilde sunulmuştur."
