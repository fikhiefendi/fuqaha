abstract: "Bu araştırmada, Filistin'de faaliyet gösteren İslami bankaların tanıtımı, kökenleri ve kaynaklarından bahsedilmiş olup yatırım kavramlarını belirterek en belirgin bankacılık yatırım hizmetleri açıklandı. Ayrıca Mudaraba kavramının meşruiyeti, şekilleri, şartları ve unsurlarının günümüzde toplumların kalkınmasını ve ilerlemesini amaçladığı, aynı zamanda mal ve hizmetlerin sağlanmasına katkıda bulunan en önemli finansal yatırım kanallarından biri olarak kabul edildiği gösterilmiştir. Araştırma, Mudaraba sözleşmesi için yasal kriterlerini belirleyerek, Filistin'deki İslami bankaların bu kurallara ne kadar uyduğu, çağdaş yaşamdaki önemi ile Mudaraba sözleşmesini tamamlamak için Filistin'deki İslami bankaların uyguladığı prosedürleri ele aldı. Buna ilaveten, Filistin'de İslami bankalarda dini denetimin İslami bankaların Şeriat standartlarına uymaları konusundaki rolü ele alınmıştır. Şeriat Denetleme Kurulu açıklığa kavuşturulmuş ve Şeriat Denetleme Kurulu ile ilgili öneriler açıklanmıştır. Araştırma en belirgin bulgu ve önerileri içerir. Çalışma sonuç ve önerlirle tamamlanmıştır. Fıkıh ilminde Mudaraba: Bir kişinin parasını bir başkasına ticaret yapması için vermesi ve kazanç olduğu zaman para sahibi bundan bir pay alır gerisi ticaret yapanındır.Fakat kazanç kazanmaması durumunda paranın aslı sahibinindir."
