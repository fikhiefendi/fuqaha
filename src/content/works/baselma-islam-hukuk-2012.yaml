abstract: "Akılla vahiy arasında ne tür bir münasebetin bulunduğu konusu İslam düşüncesinin önemli tartışma konularındandır. Bu tartışmanın yansımalarından birisi olan hüsün-kubuh meselesi, iyilik ve kötülüğün kaynağının ne olduğu (akıl mı vahiy mi) sorusuna cevap aranan mühim bir meseledir.Bu çalışmada İslam düşüncesinin iki önemli entelektüel disiplini olan Kelam ve fıkıh usûlü ilimlerinde kendisine yer bulmuş hüsün-kubuh probleminin, İslam hukuk metodolojisinde ne şekilde ele alındığı incelemiş, İslam hukukçularının emir ve nehiy normlarını hüsün-kubuh açısından temellendiren yaklaşımlarına yer verilmiştir.Hüsün-Kubuh meselesi fıkıh usûlü ilminde? hukuki sorumluluğun kaynağı? bağlamında ele alınmış ve tartışılmıştır. Tartışmanın taraflarından birisi olan Mu'tezilenin teorisine göre hüsün-kubuh nitelikleri fiillerin zâtî nitelikleri olup, söz konusu nitelikler fiillerde aklen bilinebilir bir şekilde ilahi hitaptan önce mevcuttur. Akıl fiillerdeki hüsün ve kubuh niteliklerini ilahi hitap olmadan da idrak edebilir. Bu yönüyle hüsün-kubuh aklîdir. Ayrıca aklın bu idraki kişi için bağlayıcıdır ve hukuki sorumluluk doğurmaktadır. Mütekellimîn usulcüleri ise hüsün-kubuh vasıflarının fiillerin zatından kaynaklanan vasıflar olmadığını ve ilahi hitap neticesinde ortaya çıktığını savunmaktadırlar. Buna göre akıl, fiillerdeki hüsün ve kubuh niteliklerini şer'i hitap olmaksızın idrak edemez. Yani hüsün ve kubuh aklî değil şer'idir. Dolayısıyla hukuki sorumluluğun kaynağı da akıl değil şer'dir. Hanefî-Ma'turidî hukukçuların kanaatine göre ise hüsün ve kubuh niteliklerinin fiillerde ilahi hitaptan önce bulunması ve aklın bunları idrak etmesi mümkünse de, aklın bu bilgisi hukuki sorumluluk doğurmak için yeterli değildir. Bir kimsenin hukuki manada sorumlu tutula bilmesi için şer'i hitap gereklidir. Bu sebeple hukuki sorumluluğun kaynağı akıl değil şer'dir."
