abstract: "Bu çalışmada, Hollanda'da lise, lisans ve yüksek lisans öğrencilerine verilen burs ve krediler incelenmiştir. Öğrencilere verilen burslar, asıl itibariyle borç niteliğindedir ve ekonomik koşullara bağlı olarak bu borçlara faiz eklenebilir. Öğrencilerin belirlenen şartlara uymaları halinde, borçları hibeye dönüşmektedir. Öğrenciler, eğitimlerine devam ettikleri sürece kendilerine mahsus kılınan borç sisteminden faydalanma hakkı kazanırlar. Ancak bu borçların hibeye dönüşme durumu yoktur ve yıl sonunda belirlenen faiz miktarından etkilenmektedir. Bu kanunları ilk bölümde açıklamamızın ardından, ikinci bölümde borç ve faiz gibi konular İslam hukuku açısından ele alınmış, alimlerin görüşleri ve bu görüşlere dayanak oluşturan deliller tahlil edilmiştir. Çalışmanın son bölümünde, Hollanda'nın söz konusu kanunlarının şer'î kıstaslara ne derece uygunluk göstediği,, öğrencilerin bu sosyal hizmetten yararlanmalarının caiz olup olmadığı belirlenmeye çalışılmıştır."
