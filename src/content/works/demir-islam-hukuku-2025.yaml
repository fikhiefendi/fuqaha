abstract: "Asr-ı Saadet'ten uzak yüzyıllarda yaşadığımız günümüzde, İslâmî değerlere uygun bir yaşam sürdürme gayretinde olan bireylerin çeşitli zorluklarla karşı karşıya kaldıkları görülmektedir. Değişen hayat şartları, bilimsel ve teknolojik gelişmeler, siyasi olaylar ve bunların etkisiyle sosyal ve iktisadi yapıdaki kaçınılmaz değişim, beraberinde birçok problemi getirmekte ve çoğu zaman İslâmi olan ile İslâmi olmayanın birbirine karıştığı bir durum ortaya çıkarmaktadır. Günümüz dünyasında İslâm'ın temel ilkelerini doğru bir şekilde aktaran, aynı zamanda çağın ortaya çıkardığı güncel meseleleri İslâm hukuku ve düşüncesi çerçevesinde değerlendiren ve bu konularda çözüm önerileri sunabilen âlim ve mütefekkirlere duyulan ihtiyaç her zamankinden daha fazladır. Baş döndürücü bir hızla değişen ve bireylerin tutum ve davranışlarını şekillendiren günümüz dünyasında, ekonomik sistemler ile İslâm hukuku arasındaki ilişki hem teorik hem de pratik açıdan önemli tartışmalara yol açmaktadır. Bu çerçevede, Hayreddin Karaman'ın iktisadi düşünceleri, ortaya koyduğu içtihadi hükümler ve İslâmi perspektifte konumlandığı alan, modern ekonomide İslâmi ilkelerin uygulanması ve Müslümanların kendilerini konumlandırabilecekleri sahalar bakımından değerli bir referans sunmaktadır.“İslâm Hukuku Açısından Hayreddin Karaman'ın İktisadi Görüşleri”adıyla hazırladığımız bu çalışma dört bölüm olarak planlanmış, birinci bölümde hayatı ve ilmi kişiliği, ikinci bölümde borçlar hukuku, üçüncü bölümde bankacılık ve son bölümde güncel iktisadi meseleler hakkındaki düşünceleri ele alınmıştır. Bu çalışmanın amacı, Hayreddin Karaman'ın iktisadi görüşlerini İslâm hukuku perspektifinden incelemek ve onun düşüncelerinin günümüz ekonomik meselelerine olan katkılarını ortaya koymaktır."
