abstract: "Kazakistan bölgesinde XVIII yüzyıldaki sosyal, siyasi ve iktisadi sorunlara çözüm üretmek adına Tavke Han'ın yürüttüğü siyaset ve yaptığı düzenlemeler Kazak hanlığının tarih sahnesinden silinmemesine önemli katkılar sunmuştur. Bu düzenlemeler halk önderleri olarak kabul edilen bîler, aksakallar ve sultanlar tarafından her sene yapılan kurultaylarda istişare edilmiş olup halk arasında“Tavke Hanın kanunları”veya“Jeti Jargı”ismiyle meşhur olmuştur. Düzenlenen bu kurallar, hem Tavke Han'dan önceki hanların döneminde oluşturulan bazı yasaları hem de yeni ihdas edilen kuralları içeren“ilk Kazak Anayasası”niteliği taşımaktadır. Eski Kazak örfünün kurallarından müteşekkil olan Jeti Jargı'nın genel olarak İslam hukuku ile uygunluk arz ettiği görülmektedir. Bununla birlikte bazı düzenlemeler İslam hukukuna aykırıdır. Bazı düzenlemeler ise İslam hukukunun cevaz alanını teşkil eden ve toplumların kendi örflerine uygun olarak düzenleme imkânına sahip olduğu alanlara ilişkindir."
