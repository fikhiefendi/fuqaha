abstract: "Bu çalışmayla 19. yüzyılın son döneminde Samsun bölgesinin dîni, sosyal, ekonomik ve kültürel açıdan durumunun tespitine katkıda bulunmayı hedefledik. Samsun?la ilgili kırk üç adet şer?iyye sicil defteri bulunmaktadır. Bu defterlerden şuana kadar tespit edebildiğimiz on dört tanesi ile ilgili çalışma yapılmıştır. Yaptığımız bu çalışmayla hem Samsun?un tarihine katkıda bulunduk hem de bu şer?iyye sicillerinden birini transkribe ederek ilim dünyasına kazândırdık. Çalışma 1775/21 numaralı ve 1875-1878 tarihlerini içeren Samsun şer?i mahkemesine ait şer?iyye sicil defterinin tahlîlidir. Tez giriş hariç iki bölümden oluşmaktadır. Giriş kısmında, araştırmanın problem ve önemi, veri toplama araçları, araştırmanın sınırlılıkları ile kullanılan yöntemler hakkında bilgi verilmiştir. Birinci bölümde şer?iyye sicillerinin tanımı ve Samsun mahkemelerinde tutulan şer?iyye sicil defterleri ve bunlar üzerinde günümüze kadar yapılan çalışmalar belirtildikten sonra, 1775/21 numaralı Samsun şer?iyye sicil defterinde geçen kayıtlardan yola çıkarak, Samsun?un 19. yüzyıl sonlarındaki sosyal, kültürel, ekonomik ve idârî yönlerden değerlendirmesi yapılmıştır. Çalışmamızın ikinci bölümünde orjinal metnin latin harflerine transkripsiyonu yapılmıştır. Transkripsiyon yapılırken kayıt başlarında içerikle ilgili kısa özet verilmiş ve kayıtlar numaralandırılmıştır. Sonuç kısmında incelediğimiz şer?iyye sicil defterinden çıkarılan sonuçlar kısaca belirtilmiştir.İncelediğimiz 1775/21 numaralı defterde 318 adet kayıt bulunmaktadır. Kayıtlar vekil, kefil, vasî ve nafaka tayini, alacak-verecek davası, arsa, tarla, ev ve hisse satışı, tereke taksimi, kamu görevlisi tayini, çalınmış veya kaybolmuş mallarla ilgili hükümlerden oluşmaktadır. Çalışma 1875-1878 yıllarında Samsun şer?i mahkemesine intikal eden olayları kapsamaktadır."
