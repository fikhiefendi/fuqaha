abstract: "Bu tez Muhammed b. Hasan eş-Şeybânî'nin Kitâbu'l-Asl isimli eserinin Kitâbu'l-Buyû` ve's-Selem bölümünde istihsan metodunun nasıl uygulandığı konu edinen bir çalışmadır. Söz konusu eser Hanefî Mezhebi'nin fıkıh mirasını günümüze aktaran en önemli kaynaktır. Çalışma 3 bölüm ve bir ekten oluşmaktadır. Birinci bölümde imam Muhammed'in biyografisi, çalışmamıza konu olan eseri hakkında bilgiler verilmiştir. İkinci bölümde İslam hukukunda istihsan metodu ve bey` ve selem akitleriyle ilgili genel bilgiler yer almaktadır. Üçüncü bölümde İmam Muhammed'in söz konusu eserinin ?Kitâbu'l-Buyû` ve's-Selem? bölümünden seçilen istihsan örnekleri detaylı olarak işlenmiştir. Ayrıca ekte örnek olarak işlenen farazi meselelerin metin ve tercümeleri yer almaktadır."
