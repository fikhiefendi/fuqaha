abstract: "Faizin illeti konusunda mezhepler arasında fikir ayrılığı mevcutsa da faizin her türünün haram olduğu konusunda cumhur ittifak etmiştir. Faiz yasağının doğru bir şekilde anlaşılabilmesi için, faiz ile ilgili ayet ve hadislerin doğru anlaşılması; fıkhi mezheplerin bu konudaki görüş ve dayanaklarının doğru bir şekilde tahlil edilmesi oldukça önemlidir. Hanbeli mezhebinde faizin illeti ile ilgili olarak üç farklı görüş bulunmaktadır. Bu görüşlerden en çok kabul göreni, Hanefilerin görüşlerine yakın olandır. Mezhebin kabul gören diğer görüşü ise Şafiî ve Maliki mezhebi doğrultusunda gelişen görüştür. Faiz yasağı ile ilgili özellikle Hanbelilerin görüşlerini ele aldığımız bu çalışmada diğer fıkhî mezheplerin de görüşleri delilleriyle ele alınmıştır. Ribânın konusu olan mallarda tespit edilen illetler örnekler üzerinden incelenmiştir. Ribâ olasılığı olan alışveriş çeşitleri ve ribâ ile ilgili ihtilaflı konulardan biri olan“daru'l-harp'te ribâ”konusuna da kısaca değindikten sonra çalışma sonlandırılmıştır."
