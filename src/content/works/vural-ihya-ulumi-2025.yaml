abstract: "Bu tez çalışması,“İḥyâʾu ʿulûmi'd-dîn Adlı Eseri Çerçevesinde Gazzâlî'nin Fıkhî Meselelerin Ahlaki Temellerine Dair Görüşleri”başlığı altında, İmam Gazzâlî'nin İḥyâʾü ʿulûmi'd-dîn' deki fıkhî meseleleri ahlaki bir perspektiften ele alış biçimini incelemeyi amaçlamaktadır. Tez üç bölümden oluşmaktadır. İlk bölümde İmam Gazzâlî'nin hayatı, medrese dönemi ve ilmî şahsiyeti ve yaşadığı dönemin ilmî, siyasî ve sosyal şartları değerlendirilmiş; özellikle onun ahlâk ve tasavvuf anlayışı üzerinde durulmuştur. İkinci bölümde İḥyâʾu ʿulûmi'd-dîn'in genel yapısı, sistematiği ve içerdiği konular hakkında bilgi verilmiş, ayrıca eserin İslâm ilim geleneğindeki yeri ve etkileri de ele alınmıştır. Son bölümde ise İḥyâʾda mevcut bazı fıkhî meseleler odaklı bir inceleme yapılmıştır. İbadetler (namaz, oruç, zekât, hac, tövbe), talâk ve aile hukuku, helâller ve haramlar gibi konular, İḥyâ'nın ilgili bölümleri esas alınarak detaylı şekilde incelenmiş; Gazzâlî'nin bu meseleleri ahlâk ve tasavvuf boyutuyla nasıl bütünleştirdiği ortaya konularak, karşılaştırmalı bir yöntem benimsenmiş ve Gazzâlî'nin kendine özgü yaklaşımı belirginleştirilmiştir. Sonuç olarak, Gazzâlî'nin fıkhî meselelerde ahlâk merkezli yaklaşımı ön plana çıkarılarak İslâm hukukuna derinlik kazandırdığı tespit edilmiştir."
