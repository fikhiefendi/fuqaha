abstract: "Kur'ân; Allah ile insan arasında hidayet bağı tesis eden ve benzeri bulunmadığına kanaat getirilen ilahi bir kelâmdır. Bu eşsizliğin mahiyetine yönelik araştırmalar, i'câzü'l-Kur'ân adı altında şekillenmiştir. Kur'ân'ın mucîzevî yapısını temellendiren yönlerden biri de Allah ile insan arasındaki ontolojik farklara rağmen, ortaya koyduğu anlamlı ve sağlıklı iletişimde yatmaktadır. Kemâleddin Abdülvâhid b. Abdilkerîm ez-Zemlekânî'nin (ö.651/1253) el-Burhânu'l-Kâşif an İ'câzi'l-Kur'ân eseri de Kur'ân'ın söz konusu yönünü i'câz olarak konu almaktadır. Eser, Kur'ân vahyinin ne nazma ne de nesre benzeyen lafız-mana ilişkisinin rastlantısal değil, bilinçli ve hidâyet amaçlı bir tercihin sonucu olduğunu ortaya koymaktadır. Bu doğrultuda Kur'ân'daki lafızlar; Kur'ân'ın temel hedeflerini barındıran makâsıdu'l-Kur'ân merkezli hassas bir düzenekte şekillenmiştir. Böylece eser, Kur'ân'daki i'câz yapısını yalnızca lafız merkezli değil; aynı zamanda amaç ve hedef odaklı sunmaktadır. İşte bu açılım i'câz literatüründe görülmeyen özgün bir girişime imkân tanımakta, bu yönüyle çalışılmaya değer görünmektedir. Bu çalışmada ise; Zemlekânî'nin i'câz yaklaşımının, Kur'ân içerisinde ne ölçüde uygulanabileceği sorgulanmış, eserde geçen âyetler i'câz ve makâsıd bağlamında değerlendirilmiştir. Değerlendirmeler sonucunda; müellifin beyânî yapıların imkânlarını kullanarak, âyetler üzerinden açığa çıkardığı nazmî yapının, her ne çeşitte olursa olsun makâsıdu'l-Kur'ân'dan farklı bir mecraya çıkmadığı tespit edilmiştir. Buradan hareketle denilebilir ki, müellifin temellendirdiği makâsıd düşüncesi, i'câz yapısına uymuş, âyetler üzerinde sağlıklı sonuçlar vermiştir. Böylelikle ilgili yaklaşımın, i'câz literatürüne eklemlenecek sağlam bir teorik zemin oluşturduğu tespit edilmiştir."
