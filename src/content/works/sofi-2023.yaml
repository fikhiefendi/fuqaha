abstract: "İmam Tacüddin İbnü's-Sübki'nin Cem`u'l-Cevami` adlı kitabı, ilim çevrelerinde kabul görmesi ve usûl kitapları arasında nadir görülen şerhler ve şemalarla sunulmasıyla öne çıkmaktadır. Bu şerhler arasında İmam Ahmed el-Kûrâni'nin ed-Dürerü'l-Levami` adlı kitabı da bulunmaktadır. Bu çalışmada, el-Kûrâninin yalnızca şerhinin mukaddimesinde yer alan itirazlar toplanmış, açıklanmış ve âlimlerin görüşlerine uygun şekilde değerlendirilip analiz edilmiştir. Araştırmacılar ve ilim talebeleri usûli konulardaki ihtilafları anlamak ve çözmek için ilmi yeterliliğe ve bilgi birikimine şiddetle ihtiyaç duyduklarından ötürü bu araştırma büyük bir öneme sahiptir. Çünkü fıkıh usûlü ilmindeki ihtilaflı konular çoktur ve bunların bir kısmı delil ve burhanlarla çözülebilir. Bu nedenle bu çalışmada, el-Kûrâni'nin İbnü's-Sübkî'ye yaptığı itirazlara (Allah onlara rahmet etsin) mümkün olduğunca çözüm üretilmeye gayret edilmiştir. Şimdiye kadar hiçbir şarihin Cem`u'l-Cevami` itirazları üzerine müstakil bir çalışma yapılmamış olması bu araştırmayı özgün kılmaktadır. Araştırma, İmam el-Kûrâni'nin itirazları, ihtilaf konusunun ve yerinin açıklığa kavuşturulması, metnin ve itirazın açıklanmasıyla sınırlıdır. Araştırmada tümevarımsal ve analitik bir yöntem benimsenmiştir. İmam El-Kûrâni'nin itirazları ve görüşlerini sunma metodu incelenirken tümevarım yönteminin takip edilmesinin yanında, bu itirazlar analiz edilip değerlendirilmiştir. Araştırma sonucunda Cem`u'l-Cevami`'in mukaddimesinin yirmi itiraz içerdiği; ve itirazların yıkıcı değil yapıcı olduğu; ve ihtilafın aradaki dostluğu zedelemediği anlaşılmıştır."
