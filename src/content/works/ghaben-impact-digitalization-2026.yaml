abstract: "Bu çalışma, Filistin ekonomisinde dijitalleşmenin piyasa verimliliği ve piyasa işleyişi üzerindeki etkilerini incelemektedir ve özellikle Filistin Borsası'na kayıtlı şirketlere odaklanmaktadır. Araştırma, bankacılık, hizmet ve sanayi sektörlerinden 389 katılımcıya uygulanan anket verilerini topladı ve ayrıca üç farklı sektörden PSE'ye kayıtlı altı şirketin 15 yıllık finansal ve işlem verilerini analiz etti. Bu yöntem, dijital benimseme, operasyonel verimlilik ve piyasa performansının bütüncül bir şekilde değerlendirilmesini sağladı. Bulgular, dijital dönüşümün piyasa işleyişi üzerinde güçlü ve olumlu bir etkisi olduğunu göstermektedir; finansal performansı, şeffaflığı ve uyum yeteneğini artırmaktadır. Bununla birlikte, dijitalleşme piyasa verimliliği üzerinde orta düzeyde olumsuz bir etkiye sahiptir; bu da benimsemenin ilk aşamalarında şirketlerin yüksek operasyonel maliyetler ve geçici verimlilik düşüşleriyle karşılaştığını göstermektedir. Sektör bazlı bulgular belirgin farklılıklar ortaya koymaktadır. Sanayi sektöründe, dijitalleşme piyasa işleyişini doğrudan iyileştirirken, otomasyon ve altyapı yatırımları nedeniyle başlangıçta verimliliği azaltmaktadır. Hizmet sektöründe, piyasa işleyişi açısından fayda sağlanmakla birlikte verimlilik olumsuz etkilenmektedir; bu durum, benimseme süreci ve beceri eksikliklerinin yarattığı zorlukları yansıtmaktadır. Bankacılık sektöründe ise piyasa işleyişi üzerinde anlamlı doğrudan bir etki gözlenmemiştir; bu durum, dijital girişimlerin olgun bir aşamaya ulaştığını ve ek çabaların kısa vadede sınırlı kazanç sağladığını göstermektedir. Sonuç olarak, Filistin bağlamında dijitalleşme garanti edilmiş bir çözümden ziyade stratejik bir güçlendirici olarak hareket etmektedir. Piyasa işleyişi üzerindeki olumlu etkisi açıktır; ancak verimlilik iyileştirmeleri dikkatli yönetim gerektirmektedir. Şirketler, dijitalleşmeyi yönetişim, risk yönetimi ve operasyonel hazırlık ile entegre ederek tüm sektörlerde sürdürülebilir performans ve maksimum fayda elde etmelidir."
