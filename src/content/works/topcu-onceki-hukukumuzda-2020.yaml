abstract: "Vakıf hukuku sistemi, her yönüyle vakfın varlığının ve işleyişinin ebedi şekilde devam etmesi amacı üzerine bina edilmiştir. Bu amacın gerçekleşmesi, yalnızca vakfın hukuki yahut maddi varlığına yönelen her türlü müdahalenin engellenmesi ile mümkün olabilir. Ancak vakıf kurumu, az veya çok miktarda maddi varlığı idare eden ve mahiyeti gereği birçok kişinin farklı şekillerde menfaat sağlamasına olanak tanıyan bir oluşum olarak her dönemde müdahalelerin hedefi olmuştur. Bu çalışmada Osmanlı hukuk pratiğinde son derece geniş bir yer işgal eden, bununla beraber teorik düzlemde müstakil olarak incelenmemiş olan vakfa müdahale kavramı, hem şer'i hükümleri içeren fıkıh literatürü, hem fetva mecmuaları, hem de mühimme defterleri ile ahkam-ı şikayet defterleri detaylı şekilde incelenerek her iki yönüyle de anlaşılmaya çalışılmıştır. Çalışmanın iki temel hedefi bulunmaktadır: i) Vakfa müdahale fiilinin unsurlarının, bu fiilin haksız fiil kimliği ekseninde hukuki analizinin yapılması. ii) Vakfa müdahale fiillerinin olası faillerinin ve gerçekleştirilme şekillerinin tespit edilerek söz konusu haksız fiilin Osmanlı hukuk pratiğindeki görünümlerinin örneklendirilmesi."
