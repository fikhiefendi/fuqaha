abstract: "İnsanın geçimini sağlamak amacıyla çalışması, temel bir ihtiyaç olması bakımından büyük bir öneme sahiptir. Bu bağlamda emek ve çalışma kavramları, Kur'ân ve Sünnet ışığında özel olarak ele alınmış ve dinî bir perspektifle değerlendirilmiştir. Günümüzde ise tevekkül ve çalışma anlayışına dair bazı yanlış kanaat ve uygulamalar, İslâmî söylemlerle meşrulaştırılmakta ve bu durum toplumsal hayatta çeşitli problemlere yol açmaktadır. İnsan hayatının sürdürülebilirliği açısından emeğin ve çalışmanın dinî, ahlâkî ve toplumsal boyutlarıyla ele alınması son derece gereklidir. Bu çalışmada, söz konusu kavramların daha sağlıklı anlaşılmasına katkı sunmak amacıyla Ebû Bekr el-Hallâl'in el-Hassü ʿalâ't-Ticâre ve's-Sınâʿa ve'l-ʿAmel adlı eseri merkeze alınacaktır. Söz konusu eser, emek, çalışma ve tevekkül gibi kavramlara dair zengin bir hadis ve eserî rivayet içeriğine sahiptir. Bu yönüyle kesb (kazanç elde etme) kavramının teorik ve pratik yönlerinin anlaşılmasına önemli katkılar sağlayacağı düşünülmektedir. Bu tez, ilgili eserden hareketle İslam düşüncesinde kesb kavramını sistematik bir şekilde incelemeyi ve konuya dair güncel yanlış anlayışlara karşı ilmî bir perspektif sunmayı amaçlamaktadır. Bu çalışmanın amacı, İslam dünyasında farklı görüşlerin ortaya çıktığı“kesb”kavramını incelemek ve Ebû Bekr el-Hallâl'in el-Hassü alâ't-Ticâra ve's-Sınâ'a ve'l-'Amel adlı eserinde sunduğu deliller ışığında bu kavramı Hanbelî mezhebi açısından değerlendirmektir."
