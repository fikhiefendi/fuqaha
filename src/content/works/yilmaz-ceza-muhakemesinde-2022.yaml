abstract: "Tez çalışmasının konusu, ceza muhakemesinde pazarlık yöntemleri ile Türk ceza muhakemesinde kovuşturmaya alternatif bir yol olarak düzenlenen seri muhakeme usulüdür. Günümüzde Anglo-Sakson ceza adalet sistemleri ile birlikte Kıta Avrupası ceza adalet sistemlerinde, şüpheli/sanık ile savcının anlaşmasına dayanan, cezada indirim sağlayan ve mahkemelerin onayına tabi olan pazarlık yöntemlerinin uygulanmasına izin verilmektedir. Anglo-Sakson ceza muhakemesi sistemlerinde süreç içerisinde uygulamanın bir ürünü olarak ortaya çıkan yöntemler, özellikle 21. yüzyılın başlarından itibaren birçok ülkede yasal zemine kavuşturulmuştur. Böylece ceza muhakemesinin hızlandırılması ve özellikle mahkemelerin iş yükünün azaltılması amaçlanmaktadır. Türk ceza muhakemesi sisteminde de karşılaştırmalı hukuktaki gelişmelere paralel şekilde, muhakemenin basitleştirilmesi ve hızlandırılması ile ceza adalet sisteminin etkinliğinin sağlanması amaçlarıyla değişiklikler yapılmış ve geleneksel ceza muhakemesine alternatif teşkil eden yeni yöntemler kabul edilmiştir. 7188 sayılı Kanun ile daha önce muhakeme sistemimizde yer almayan yeni bir yöntem, seri muhakeme usulü adıyla Ceza Muhakemesi Kanunu'nun 250. maddesinde düzenlenmiştir. Çalışmanın amacı, son yıllarda birçok ülkede uygulama alanı bulan iddia pazarlığını ve pazarlığın Türk hukukundaki görünüm şekli olan seri muhakeme usulünü tüm yönleriyle ele almaktır. Bu doğrultuda ceza muhakemesi sistemleri, olağan ceza muhakemesinin yürüyüşü ve muhakemeye katılan süjelerin hak, yetki ve görevleri ortaya konulduktan sonra iddia pazarlığının ceza muhakemesi sistemlerinde doğuşu, gelişimi, diğer alternatif yöntemlerden farkları, kabul edilme gerekçeleri, eleştirilen yönleri, karşılaştırmalı hukuktaki modeller incelenmekte ve ayrıca pazarlık bazı temel hak ve ilkeler yönünden değerlendirilmektedir. İddia pazarlığının genel çerçevesi ortaya konulduktan sonra, Türk ceza muhakemesi sisteminde yeni uygulanmaya başlayan ve iddia pazarlığının Kıta Avrupası sisteminde dönüştürülmüş örneklerinden biri olan seri muhakeme usulü inceleme konusu yapılmaktadır. Bu çerçevede seri muhakeme usulünün sisteme dâhil edilme süreci ve gerekçeleri ile hukuki niteliği üzerinde durularak, yasal düzenlemeler kapsamında şartları ve uygulanması, karşılaştırmalı hukuktaki benzer modellerden de yararlanılarak tüm yönleriyle ele alınmakta ve bu konularda çeşitli eleştiriler ve öneriler getirilmektedir. Farklı ülkelerde uygulanan pazarlık yöntemleri, temel bazı ortak özellikler taşısa da uygulandıkları ceza muhakemesi sistemlerine bağlı olarak kendine özgü bazı özellikler göstermektedir. Nitekim ceza muhakemesi alanında bu yöntemlerin özellikleri ve uygulanması, ülkede geçerli olan muhakeme sistemi ve kuralları ile yakından ilişkilidir. Aynı zamanda ceza muhakemesinin yürüyüşüne ilişkin esaslar ve muhakeme süjelerinin ceza muhakemesindeki konum, yetki ve görevleri her bir sistemde farklılık göstermektedir. Bu hususlar ise ülkede uygulanan alternatif yöntemlere ilişkin kuralların şekillenmesinde ve uygulanmasında dikkate alınmaktadır. İtham sisteminin geçerli olduğu Anglo-Sakson ceza adalet sistemleri ve işbirliği sisteminin geçerli olduğu Kıta Avrupası ceza adalet sistemleri farklı özellikler göstermektedir. Kural olarak iddia, savunma ve yargılama faaliyetlerinden oluşan ceza muhakemesinde, suç şüphesi üzerine araştırmalar başlamakta ve belirli şüpheye ulaşan muhakemede mahkeme tarafından yargılama yapılarak hüküm verilmektedir. Ceza davası açılarak uyuşmazlığın mahkeme önüne getirilmesi, ülkelerde benimsenen sisteme göre kamu davasının mecburiliği veya maslahata uygunluk ilkeleri çerçevesinde şekillenmektedir. Mahkeme huzurunda yapılan yargılamalarda, doğrudan doğruyalık, sözlülük, alenilik ve maddi gerçeğin araştırılması ilkeleri geçerlidir. Geleneksel ceza muhakemesine yargılama makamı olarak hâkim/mahkemeler, iddia makamı olarak savcı, bireysel savunma süjesi olarak şüpheli/sanık, savunma makamı olarak müdafi ve ayrıca mağdur ile suçtan zarar gören katılmaktadır. İddia pazarlığı, en temel şekliyle daha az ceza alma veya daha hafif bir suçla itham edilme karşılığında şüpheli/sanığın kabulüne dayanan ve iddia ile savunma makamları arasında gerçekleşen anlaşmanın mahkeme tarafından onaylanması üzerine şüpheli/sanık hakkında hüküm kurulmasını ifade etmektedir. İddia pazarlığının tarihi gelişimi dikkate alındığında, yöntemin pratik ihtiyaçların bir ürünü olarak Anglo-Sakson sistemlerinde ortaya çıkıp uygulamada gelişim gösterdiği, yüksek mahkeme kararları ile meşruiyet kazanmaya başladığı ve daha sonra yasal zemine kavuşturulduğu görülmektedir. İddia anlaşması genellikle daha hafif bir ceza, daha az ceza gerektiren bir suç ile itham veya savcılık ile işbirliği karşılığında yapılmaktadır. Temel olarak ceza muhakemesini hızlandırma amacı doğrultusunda mahkeme önünde yargılanmaya alternatif bir yol olan pazarlık yöntemleri, ceza muhakemesinde uygulanan bazı alternatif çözüm yolları ile benzer özellikler gösterse de mağduru ve toplumu tatmin etmeye veya faili toplumu kazandırmaya yönelik amaçlar taşımamaktadır. Bu bakımdan ceza uyuşmazlığının mahkeme önünde çözümlenmesine alternatif teşkil eden, onarıcı adalet yaklaşımı taşıyan ve şüpheli/sanığın iradesine bağlı olarak uygulanan diversiyon uygulamalarından, uzlaşma, önödeme ve kamu davasının açılmasının ertelenmesi yöntemlerinden ayrılmaktadır. Aynı zamanda ceza kararnamesi ve etkin pişmanlık uygulamalarından farklıdır. Başta zaman ve kaynak tasarrufunun sağlanarak iş yükünün azaltılması olmak üzere iddia pazarlığının birtakım faydaları üzerinde durulmaktadır. Bunlar ceza muhakemesi sistemlerinde iddia pazarlığı ve benzeri yöntemlere yer verilmesinin temel gerekçelerini oluşturmaktadır. Bununla birlikte, pazarlık yöntemleri özellikle ceza adalet sistemlerinde önemli sakıncalar doğurması ve bazı temel hak ve ilkeleri ihlal etmesi gerekçeleriyle eleştirilmektedir. Bu noktada günümüzde pazarlık yöntemlerinin birçok ceza adalet sisteminde yer bulması nedeniyle uygulanmasının tamamen yasaklanması gerçekçi bir yaklaşım olarak değerlendirilemeyeceğinden, iddia pazarlığında muhakemenin adilliğini sağlayan birtakım güvencelerin getirilmesi önem arz etmektedir. Anglo-Sakson sisteminde ortaya çıkan iddia pazarlığı, Anglo-Sakson ülkelerinde geniş şekilde uygulama alanı bulmaktadır. Bugün Amerika Birleşik Devletleri'nde iddia pazarlığı, ceza uyuşmazlığını çözüme kavuşturmak bakımından sistemin temelini oluşturmakta ve mahkeme/jüri önünde yargılama yapılması istisna teşkil etmektedir. Aynı zamanda İngiltere ve Kanada'da da ceza muhakemesi sistemlerinin tamamlayıcı bir parçası olarak uygulanmaktadır. Kıta Avrupası ülkeleri ise pazarlık yöntemini, kendi muhakeme sistemlerine uygun şekilde dönüştürmüştür. Bu kapsamda Kıta Avrupası ülkelerinden İtalya, Fransa, Almanya, İsviçre ve İspanya gibi ülkelerde yöntemlerin adlandırılması ve birtakım özellikleri farklı olsa da iddia pazarlığının görünüm şekilleri uygulama alanı bulmaktadır. Kıta Avrupasındaki uygulama ağır nitelikte olmayan suçlarla ve ceza konusunda anlaşma yapılması ile sınırlandırılmakta, pazarlık için genellikle suç ikrarına değer atfedilmişken bazı ülkelerde cezanın kabul edilmesi yeterli görülmekte, yasal düzenlemelerde cezada yapılacak azami yasal indirimler belirlenmekte, anlaşma çoğunlukla savcı ve şüpheli/sanık ile müdafi arasında gerçekleşmekte ve mahkeme tarafından denetlenerek onaylanmakta ve ayrıca genellikle anlaşma öncesi yasal bir müzakere sürecine yer verilmemektedir. Şüpheli/sanığın kabulüne bağlı olan iddia pazarlığına benzer yöntemler, ad hoc mahkemeler olan Eski Yugoslavya Uluslararası Ceza Mahkemesi ve Ruanda Uluslararası Ceza Mahkemesi yargılamalarında uygulanmış ve henüz tek bir örnek dava olsa da Uluslararası Ceza Mahkemesi önünde de suç ikrarına dayalı iddia pazarlığı yöntemi kullanılmıştır. Avrupa ülkelerinde pazarlığın görünüm şekli olan alternatif yolların uygulanmasının AİHS ile güvence altına alınan hakları ihlal edip etmediği, AİHM tarafından adil yargılanma hakkı yönünden incelemektedir. Adil yargılanma hakkı kapsamındaki haklardan feragat edilmesini geçerli kabul eden AİHM, bu yöntemlerin belirli güvenceleri sağlamak koşuluyla adil yargılanma hakkının gerekleriyle uyumlu olduğu sonucuna ulaşmaktadır. Buna göre, pazarlık dava konusu olaylar ve yasal sonuçlar tam olarak anlaşıldıktan sonra ve gönüllü bir şekilde kabul edilmeli ve aynı zamanda pazarlığın içeriği ile taraflar arasında kabul edildiği yöntemin adil olup olmadığı yeterli bir yargısal denetime tabi olmalıdır. Pazarlığın uygulanması durumunda mahkeme huzurunda genel hükümlere göre bir yargılama yapılmamakta ve şüpheli/sanığın ceza muhakemesinde sahip olduğu birtakım temel hak ve ilkelerden feragat etmesi gerekmektedir. Bu çerçevede iddia pazarlığının; çatışma içerisinde olduğu iddiası ile ön plana çıkan adil yargılanma hakkı, masumiyet karinesi, kendi kendini suçlamaya zorlanamama ve susma hakkı ile birlikte, ceza muhakemesi ilkelerinden kamu davasının mecburiliği ilkesi, alenilik ilkesi, maddi gerçeğin araştırılması ilkesi ile doğrudan doğruyalık ve sözlülük ilkeleri yönünden değerlendirilmesi önem arz etmektedir. Türk ceza muhakemesi sisteminde, dünyadaki gelişmelere paralel şekilde ve iş yükünün azaltılması ile muhakemenin kısaltılması ve hızlandırılması amaçlarıyla bazı önemli değişiklikler yapılmıştır. Bu kapsamda mahkeme huzurunda gerçekleşen kovuşturma evresine alternatif bir yöntem olarak seri muhakeme usulü, Ceza Muhakemesi Kanunu'nun 250. maddesinde hüküm altına alınmış ve ayrıca 250. maddenin uygulanmasına ilişkin usul ve esasların belirlenmesi amacıyla yürürlüğe giren Ceza Muhakemesinde Seri Muhakeme Yönetmeliği, seri muhakeme usulüne ilişkin düzenlemeler getirmiştir. Seri muhakeme usulü; sınırlı sayıda suç bakımından uygulama alanı bulan, şüphelinin savcının seri muhakeme usulünün uygulanmasına ilişkin teklifini kabul etmesine sonuç bağlayan, cezada indirim yapılmasını sağlayan ve mahkemenin denetim ve onayına tabi olan özel ve istisnai bir muhakeme yöntemidir. Böylece şüpheli, mahkeme huzurunda yargılanma gibi ceza muhakemesindeki bazı haklarından feragat etmekte ve ceza muhakemesi kamu davası açılmadan önce, soruşturma evresi sonunda mahkûmiyet hükmü ile sonuçlandırılmaktadır. Esas olarak muhakeme ekonomisine hizmet eden seri muhakeme usulü, özellikleri nedeniyle birçok açıdan eleştirilmekle birlikte, seri muhakeme usulü kavramının seçilmesi dahi eleştiri konusu yapılmaktadır. Türk ceza muhakemesi sistemine yabancı olan bu yöntemin karşılaştırmalı hukukta yer alan pazarlık yöntemlerine benzer yönleri bulunduğu ve genel olarak Fransız ceza muhakemesinde uygulanan suçluluğun ön kabulü üzerine duruşma yönteminden dönüştürüldüğü düşünülmektedir. Seri muhakeme usulü, iddia pazarlığının çeşitlerinden ceza pazarlığının görünüm şekli olarak nitelendirilebilecek sui generis bir ceza muhakemesi kurumudur. Soruşturmadan sonuç çıkarma aşamasında iddianame düzenlemek için yeterli delile ulaşıldığı ve kamu davasının açılmasının ertelenmesine karar verilmediği takdirde, savcı tarafından seri muhakeme usulünün uygulanması zorunludur. Aynı zamanda 250. maddede sayılan sınırlı sayıda suç bakımından uygulama alanı bulur ve önödeme ve uzlaştırma kapsamındaki suçlar hakkında uygulanamaz. Seri muhakeme kapsamındaki suçlar, genellikle topluma karşı işlendiği kabul edilen suçlar arasından seçilmiştir ve basit, belirli bir önem derecesinin altında ve ispatı kolay suçlar olarak nitelendirilmektedir. Kanunda listelenen suçlar bakımından seri muhakeme usulü kapsamındaki suçların, suç olmaktan çıkarma eğilimi açısından değerlendirilmesinin ve gerekirse idari yaptırım gerektiren eylemlere dönüştürülmesinin daha uygun bir çözüm yolu olduğu düşünülmektedir. Kovuşturma öncesi alternatif bir çözüm yolu olarak öngörülen seri muhakeme usulü, kovuşturma evresinde mahkeme tarafından uygulanamaz. Ancak bu durum, iddianame kabul edildikten sonra suçun seri muhakeme kapsamında olduğunun anlaşılması ve kovuşturma evresinde suçun niteliğinin değişmesi hallerinde bazı adaletsiz sonuçlar yaratacak niteliktedir. Seri muhakeme usulünün uygulanabilmesi için kamu davasının açılmasının ertelenmesine karar verilmemiş olması gerektiğinden, bu yöntemin genellikle mükerrirler bakımından uygulama alanı bulacağı düşünülmekte ve bu durum eleştiri konusu yapılmaktadır. Seri muhakeme usulünün uygulanması için gerekli şartlar sağlanmışsa, savcı öncelikle şüpheliyi davet etmektedir. Bununla birlikte, şüphelinin talebi üzerine uygulanma olanağı da bulunmaktadır. Davet edilen şüpheli öncelikle, seri muhakeme usulü hakkında bilgilendirilmelidir. Her ne kadar kolluk görevlilerinin de bilgilendirme yapabileceği düzenlenmiş olsa da bilgilendirmenin soruşturmadan sonuç çıkarma aşamasında savcı tarafından yapılması esas olmalı ve bilgilendirme kapsamında dava konusu olaylar ve yasal sonuçlar; ayrıntılı, kapsamlı ve şüphelinin anlayacağı şekilde öğretilmelidir. Bilgilendirme aşamasından sonra savcı, seri muhakeme usulünün uygulanmasını şüpheliye teklif etmektedir. Bu noktada teklifin yazılı olmasına veya tutanağa bağlanmasına ilişkin bir düzenleme öngörülmediğinden, savcının teklife ilişkin görüşme esnasında da yaptırımı belirleme olanağına sahip olduğu değerlendirilmektedir. Usulün uygulanabilmesi için şüphelinin teklifi özgür iradesi ile kabul etmesi gerekmektedir. Şüpheli teklifi değerlendirerek usulün uygulanmasını kabul edebileceği gibi, reddetme imkânına da sahiptir. Şüphelinin kabulü, suçun ikrar edilmesi anlamına gelmemektedir. Şüphelinin kabule, serbestçe ve gönüllü olarak karar vermesi gerektiğinden özgür iradeyi sakatlayacak yöntemler uygulanamaz. Bununla birlikte, seri muhakeme usulünde şüphelinin indirimli ceza alacak olmasının dahi özgür iradenin oluşumunu etkileyebileceği değerlendirilmektedir. Teklifin yapılması sırasında müdafi bulunması zorunlu olmasa da teklifin müdafi huzurunda kabul edilmesi, seri muhakeme usulünün geçerlilik koşullarından biridir. Böylece ceza muhakemesi sisteminde yeni bir zorunlu müdafilik durumu yaratılmıştır. Ancak hakların etkin olarak kullanılabilmesi bakımından bilgilendirme ve teklif aşamaları da dâhil olmak üzere, seri muhakeme usulünün tüm aşamalarında zorunlu olarak müdafi hazır bulunmasına imkân sağlanmalıdır. Ayrıca avukat yardımından yararlanma hakkının etkinliğinin sağlanabilmesi açısından müdafiin dosyayı inceleyebilmesi ve şüpheli ile görüşebilmesi gerekmektedir. Şüpheli Türkçe bilmiyorsa veya engelli ise; bilgilendirme, teklif, kabul ve mahkeme önündeki aşamaların tümünde bulunmak üzere tercüman atanacaktır. Şüphelinin teklifi kabul etmesi halinde kabul tutanağı düzenlenmekte; teklifin reddi üzerine ise soruşturmaya genel hükümlere göre devam edilmekte ve kural olarak şüpheli hakkında iddianame düzenlenmektedir. Seri muhakeme usulünde teklif konusu yaptırım savcı tarafından belirlenmektedir. Seri muhakeme usulüne getirilen en önemli eleştirilerden biri, yargısal bir görev olan yaptırımı belirleme ve cezada indirim yapma yetkisinin savcıya tanınmış olmasıdır. Savcı, Türk Ceza Kanunu'nun 61. maddesinin birinci fıkrasında belirtilen hususları göz önünde bulundurarak temel cezayı tespit edebilmekte ve şartları bulunduğu takdirde zincirleme suça ilişkin hükümleri uygulayabilmektedir. Temel cezanın belirlenmesinde birinci fıkrada yer verilen ölçütler dışında yalnızca zincirleme suça ilişkin hükümlerin uygulanmasına olanak sağlanmış olması eleştiri konusudur ve özellikle cezanın belirlenmesinde teşebbüs ve iştirak hükümlerinin uygulanamayacak olması çeşitli sorunlar yaratmaktadır. Cezanın belirlenmesinden sonra cezada yarı oranında indirim yapılması zorunludur. Aynı zamanda savcı koşulları var ise belirlediği yaptırıma ilişkin olarak hükmün açıklanmasının geri bırakılması hükümlerini uygulama, belirlediği hapis cezasını seçenek yaptırımlara çevirme veya erteleme ve ayrıca güvenlik tedbiri belirleme yetkisine sahiptir. Teklifin kabul edilmesi üzerine savcı tarafından talepname düzenlenerek, görevli ve yetkili mahkemeden şüpheli hakkında seri muhakeme usulünün uygulanması talep edilmektedir. Denetim ve onay makamı olan mahkeme, kanunda belirtilen belirli hususlar yönünden yaptığı incelemeden sonra talepnamenin iade edilmesini gerektiren bir hal bulunmadığı kanaatinde ise, şüpheliyi müdafi huzurunda dinleyerek kararını vermektedir. Anayasa Mahkemesi, mahkemenin şartlar sağlandığı takdirde talepte belirlenen yaptırım doğrultusunda hüküm kurma zorunluluğuna ilişkin hükmü iptal ederek, talebin etkin bir yargısal denetime tabi olması gerektiğini ifade etmiştir. Bunun üzerine yapılan kanun değişikliği ile mahkemeye, dosyadaki deliller mahkûmiyet kararı verilmesini gerektirdiği takdirde hüküm kurma ve sınırlı da olsa yaptırımı değiştirme yetkisi tanınmıştır. Mahkeme tarafından teklif ve kabule ilişkin şartların gerçekleştiği, eylemin seri muhakeme usulü kapsamında olduğu ve dosyadaki delillere göre mahkûmiyet kararı verilmesi gerektiği kanaatine varılması halinde, talepte belirlenen yaptırımdan daha ağır olmamak üzere hüküm kurulmaktadır. Bu koşulların gerçekleşmediği kanaatine varılması halinde ise talep reddedilmektedir. Talebin reddi halinde dosya savcılığa gönderilmekte ve soruşturma genel hükümlere göre sonuçlandırılmaktadır. Seri muhakeme usulünde kurulan mahkûmiyet hükmü, mahkeme huzurunda yapılan yargılama sonucunda verilen hüküm ile aynı sonuçları doğurmaktadır. Her ne kadar kanunda düzenlenmemiş olsa da yönetmelik uyarınca, seri muhakeme usulüne ilişkin bilgilendirme ve teklifin, şartları var ise SEGBİS yöntemi veya istinabe yoluyla yapılabilmesi kabul edilmektedir. Ancak bu yolların kullanılmasının istisnai niteliği göz önünde bulundurulmalıdır. Seri muhakeme usulünde mağdur, yalnızca hükmü bilme ve bu hükme karşı kanun yoluna başvurma hakkına sahiptir. Seri muhakeme kapsamındaki bazı suçlar bakımından ayrıca gerçek kişilerin de mağdur veya suçtan zarar gören olabilmesi ve benzer yöntemler bakımından karşılaştırmalı hukuktaki suçların kapsamının genişletilmesi eğilimi dikkate alındığında, seri muhakeme usulünde mağdurun bilgilendirilmesi ve/veya dinlenilmesine izin verilerek sürece dâhil edilmesi uygun olacaktır. Bu kapsamda mağdurların hak ve yetkilerinin yeniden değerlendirilmesi gerekmektedir. Şüpheli, gönüllülüğün esas olduğu seri muhakeme usulünün uygulanmasına yönelik iradesinden vazgeçebilme imkânına sahiptir. Bu durumda soruşturma evresi genel hükümlere göre sonuçlandırılmaktadır. Seri muhakeme usulünün herhangi bir sebeple tamamlanamaması veya uygulanamaması halinde, şüphelinin kabul beyanının ve usulün uygulanmasına dair belgelerin kullanılmasını yasaklayan özel bir delil yasağı düzenlemesi getirilmiştir. Bu noktada bu bilgi ve belgelerin dosyadan ayrı tutulmasına yönelik bir düzenleme getirilmesinin ve delil yasağı düzenlemesinin kapsamının genişletilmesinin uygun olacağı değerlendirilmektedir. Ceza Muhakemesi Kanunu'nda seri muhakeme usulünün uygulanamayacağı bazı özel durumlar kabul edilmiştir. Bu kapsamda iştirak halinde işlenen suçlarda şüphelilerden birinin seri muhakeme usulünün uygulanmasını kabul etmemesi; seri muhakeme usulü kapsamına giren bir suç ile bu kapsama girmeyen bir suçun birlikte işlenmesi; yaş küçüklüğü, akıl hastalığı ile sağır ve dilsizlik hallerinin bulunması ve ayrıca resmî mercilere beyan edilmiş olup da soruşturma dosyasında yer alan adreste bulunmama veya yurt dışında olma ya da başka bir nedenle şüpheliye ulaşılamaması durumlarında, seri muhakeme usulü uygulanamamaktadır. Seri muhakeme usulünün uygulanamayacağı hallere ilişkin düzenlemeler, genel olarak yerinde görülmekle birlikte birtakım tartışmaları da beraberinde getirmektedir. Seri muhakeme usulünün uygulanması halinde savcı tarafından iddianame düzenlenmediği gibi, bu kapsamdaki suçlar bakımından usulün uygulanmasına başvurulmadan iddianame düzenlenmiş ise iddianamenin iadesine karar verilir. Bu doğrultuda seri muhakeme usulü aynı zamanda bir ceza muhakemesi şartıdır. Seri muhakeme usulünde verilen hükme karşı, genel hükümler uyarınca itiraz kanun yoluna başvurulması kabul edilmektedir. Hükme karşı istinaf kanun yoluna başvurma hakkının tanınmaması ve itiraz yoluna başvurmanın çeşitli sakıncalar doğurması genellikle eleştiri konusu yapılmaktadır. Kanun yoluna ilişkin olarak ceza muhakemesi sistemi ile uyumlu bir düzenleme getirilmesi gerekmektedir. Bununla birlikte, şartlarının bulunması halinde kanun yararına bozma ve yargılamanın yenilenmesi gibi olağanüstü kanun yollarına başvurulması mümkündür. Sonuç olarak, seri muhakeme usulünün uygulanmasında sorun teşkil eden ve ceza muhakemesi sistemine aykırı olduğu gerekçesiyle eleştirilen hususların, genellikle yöntemin kovuşturma evresine alternatif olarak düzenlenmesinden kaynaklandığını söylemek mümkündür. Ceza muhakemesi sistemine de uygun olacak şekilde, seri muhakeme usulünün kovuşturma evresini hızlandıran bir yöntem olarak öngörülmesinin ve şartları varsa kovuşturma evresinin başında mahkeme tarafından uygulanmasına imkân sağlanmasının daha yerinde olacağı düşünülmektedir."
