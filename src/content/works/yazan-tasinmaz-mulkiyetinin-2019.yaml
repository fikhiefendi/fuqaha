abstract: "Tez çalışmamızda, Türk Medeni Kanunu'nun 713. maddesinde düzenlenen mülkiyet hakkının olağanüstü zamanaşımı yoluyla kazanılması incelenmiştir. Bu amaçla, öncelikli olarak mülkiyet hakkını kazanma yolları, mülkiyet hakkının tescil edilmesi, mülkiyetin tescilden önce kazanılması ve olağan zamanaşımı yoluyla kazanma konuları ele alınmıştır. Müteakiben, taşınmaz mülkiyetinin olağanüstü zamanaşımı ile kazanılması için gerekli şartlar incelenmiştir. Bu kapsamda, özel mülkiyete elverişli olan ve olmayan taşınmazlar, tapu kütüğüne kayıtlı olmayan taşınmazlar, maliki tapu kütüğünden anlaşılamayan taşınmazlar, maliki hakkında yirmi yıl önce gaiplik kararı verilmiş taşınmazlar, zilyetliğe ilişkin hususlar ayrıntılı şekilde irdelenmiştir. Son olarak mülkiyet hakkının tapu kütüğüne tescili amacıyla açılacak olan tescil davasının niteliği, konusu tarafları, yetkili mahkeme, ilan, itiraz, ispat yükü, hüküm ve sonuçları ele alınmıştır. Tez çalışmamız kapsamında Türk Medeni Kanunu'nun zilyetlik, mülkiyet ve kazandırıcı zamanaşımına ilişkin hükümlerin yanı sıra Kadastro Kanunu başta olmak üzere çeşitli Kanunlardaki hükümler, Yargıtay Kararları ile birlikte değerlendirilmiştir."
