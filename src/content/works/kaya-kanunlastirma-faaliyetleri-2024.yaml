abstract: "Günümüz kanununda önalım ifadesi ile geçen şüf'a, tarihten günümüze kadar pek çok hukuk sistemi içerisinde farklı normlarda yer alan ve İslam hukukunun şefî'e mülkiyet konusunda yetki verdiği geniş kapsamlı bir haktır. Şüf'a, belirli bir bedel ile hukuken geçerli bir satım akdine konu olan taşınmazın, alıcıya malolan bedel üzerinden şefî'e cebren temellük edilmesidir. Şüf'a, aynı taşınmaz üzerinde ortaklık, irtifak ortaklığı ve komşuluk gibi sebepler üzerinden aynı derecelendirme sırası esas alınarak talep edilebilmektedir. Şüf'anın ana gayesi, satıcı veya alıcının tasarruf yetkisini kısıtlamak değil aksine meşfû'u satın alan yeni malikten çevreye karşı gerçekleşme ihtimali olan zarar veya mağduriyetlerin giderilmesi ile aynı malda çoklu mülkiyetin önüne geçilmesidir. Şüf'aya dair Kur'ân-ı Kerim'de terim anlamı üzerinden herhangi bir hüküm bulunmamaktadır. Ancak şüf'a, İslam âlimleri tarafından temel kaynaklar olan sünnet, hadis ve icma bağlamında değerlendirilmiş; bu hakka dair mahiyet, gaye, meşruiyet, sebep, şart ve kullanılma hükümleri geniş bir perspektifle ele alınmıştır. XIX. Yüzyılda Batı'da başlatılan kanunlaştırma faaliyetlerinin, özgün bir hukuk sistemi oluşturmak ve uygulanan hukuk sistemi ile adaletli bir merkezi devlet yönetimi inşa etmek gibi ana hedefleri bulunmaktadır. Konumuz olan şüf'a bahsi de Osmanlı Dönemi kanunlaştırma faaliyetleri bağlamında, Fransız Kanunu'nun (Code Civil) mevcut hukuka iktibas edilme çabalarına karşın, Hanefî mezhebi esas alınarak Osmanlı merkezli kanun olan Mecelle ve Mısır merkezli kanun çalışması olan Mürşidü'l-Hayrân bağlamında değerlendirilmeye ve mukayese edilmeye çalışılmıştır."
