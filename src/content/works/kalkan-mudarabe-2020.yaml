abstract: "Bu çalışma, katılım bankacılığı fon toplama işleminde esas alınan mudârabenin mahiyetini, uygulamasını ve kârını tartışmaktadır. Tezimizde mudârabe ve kârı üç aşamada ele alınmış ve bu aşamalar aynı zamanda tezin ana bölümleri olarak tasarlanmıştır. Birinci bölümde klasik mudârabenin ortaklıktan ziyade kendine özgü bir akit olduğu vurgulanmış ve faizsiz bankacılık sisteminde uygulanmakta olan mudârabe ile mukayesesi yapılmıştır. Ardından kâr ve kârla ilgili kavramlar ele alınmış ve fıkıhtaki kâr oluşum sebepleri, iktisattaki kâr oluşum teorileriyle karşılaştırılarak incelenmiştir. İkinci bölümde klasik mudârabe kârının tahakkuku, istihkakı ve dağıtımı ele alınmıştır. Bu bölümde tarafların işletim sürecindeyken kâr üzerindeki haklarının niteliği belirlenmiş, mudârabe kârı ve kârının dağıtımı ile ilgili meseleler ayrıntılı bir şekilde tahlil edilmiştir. Tezin üçüncü bölümünde faizsiz bankacılık sisteminde tatbik edilen mudârabenin mahiyeti, işleyişi ve tartışmalı konuları ile katılma hesabının kârının tahakkuku, hesaplanması ve dağıtımı ele alınmıştır. Buna bağlı olarak katılma hesabından ayrılan rezervlerin, karşılıkların, masrafların, vadesinden önce çekilen sermayenin kârının ve bankanın havuzdan günlük olarak aldığı kâr payının fıkha uygunluğu tartışılmıştır."
