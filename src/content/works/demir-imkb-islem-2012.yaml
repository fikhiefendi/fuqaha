abstract: "Çalışma, iktisadi alanda da güncelliğini koruyan büyüklük ile karlılık arasında bir ilişki olduğu yönündeki genel kamuoyu algısının doğruyu yansıtıp yansıtmadığını gözlemlemek için yapılmıştır. Büyük firmaların karlı olduğu, rekabetçi oldukları ve krizlere karşı daha dayanıklı olduğu varsayımı ile birlikte birçok küçük girişimci yatırım yapmaktan vazgeçmekte, yatırıma niyetlenen birçok girişimci de etraflarındaki oluşan negatif yaklaşımların etkisinde kalarak yatırım kararlarından vazgeçmektedirler.Bu algı sadece kamuoyunu değil ülke yönetimindeki kişileri de etkilemekte ve bunlar çalışan sayısını artıran firmaları teşviklerle daha fazla desteklemekte ve böylelikle belki de verimsiz yapıları büyütmeye çalışırken asıl verimli yapılara teşvikler verilememektedir.Bu algının doğru olup olmadığını incelemek için İMKB'de işlem gördükleri için verileri sağlam kabul edilen ve ayrıca BDDK incelemesine tabi olan bankalar üzerinde 2003-2011 yılları arasını kapsayan bir araştırılma yapılmasına karar verildi. Değişik büyüklük ve karlılık analizleri sonucunda büyüklük ile karlılık ve verimlilik arasında bir ilişki olup olmadığı incelendi ve sonuç olarak bazı bankalarda bu konuda hiçbir ilişki bulunamazken bazı bankalarda pozitif yönlü bazı bankalarda negatif yönlü bir ilişki tespit edildi. Elde edilen verilerin ağırlığı büyüklük ile karlılık arasında ya hiç ilişki olmadığını ya da negatif bir ilişki olduğunu gösterdi. Pozitif ilişki bulunan banka sayısı çok düşük sayıda kaldı.Bu küçüklü, büyüklü bankaların ayrıca 2008 ? 2009 yıllarında yaşanan krize nasıl bir tepki verdiği de incelenerek büyük bankaların krize daha mı dayanıklı olduğuna bakıldı. Elde edilen sonuçlar bankaların büyüklük, küçüklük veya mevduat, katılım bankaları olmaksızın hepsinin krizden farklı şekillerde etkilendiğini gösterdi.Sonuç olarak büyüklük ile karlılık arasında veya büyüklük ile krize karşı dayanıklılık anlamında genel kanaatin aksine sonuçlar elde edilmiş oldu."
