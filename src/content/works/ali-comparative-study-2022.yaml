abstract: "Günümüzde bankalara duyulan ihtiyacın artmasıyla birlikte, finansal istikrarın iyileştirilmesi amacıyla bankaların performansının değerlendirilmesi büyük önem kazanmıştır. Uluslararası literatür son yıllarda bu konuya özel bir ilgi göstermiştir. Bu makalenin temel amacı, Cibuti'deki iki büyük bankacılık sistemi olan konvansiyonel ve İslami bankacılık sistemleri arasındaki temel farklılıkları tartışmak olup, karlılık gibi özel bir konuya vurgu yapılmaktadır. Bunu başarmak için toplam dört banka seçilmiştir (iki İslami ve iki konvansiyonel), çalışmanın ana verileri bu bankalardan toplanmış ve analiz dört yıl boyunca (2017-2020) gerçekleştirilmiştir. Uygulanan yöntem, iki girdi değişkeni ve iki çıktı değişkeni kullanan Veri Zarflama Analizidir. Bulgular, bu dört yıl içerisinde İslami bankaların karlılık analizi açısından genel olarak konvansiyonel bankalardan daha verimli olduğunu ortaya koymuştur."
