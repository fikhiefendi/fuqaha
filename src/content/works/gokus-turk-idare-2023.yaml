abstract: "Bu tez merkezine İstanbul'daki çeşitli mahkemelere ait 67 adet şer'iyye sicilini ve bu şer'iyye sicillerindeki 40.420 adet kaydı alarak, şer'iyye sicillerinin geçmiş kamu yönetimini incelemek için başvurulması zorunlu kaynaklar olduğunu göstermeyi amaçlamaktadır. Tez, aslında bir idare tarihi denemesi niteliğini de taşımaktadır. Şer'iyye sicilleri tezin merkezinde yer almakla beraber bu kaynakların çeşitli birincil kaynaklar tarafından desteklenme ihtiyacı bulunması tezde mühimme defterleri ve diğer çeşitli belgelerin kullanılmasını gerektirmiştir. Tez üç bölüme ayrılmaktadır. İlk bölümde Osmanlı öncesi İstanbul'un tarihi ve XVI-XVIII. yüzyıllar arasındaki Osmanlı Siyasi Tarihi anlatılmaktadır. Bunların ardından tezin temel kavramlarından olan şer'iyye sicilleri ile kadılık başlıklarına da bu bölümde yer verilmektedir. İkinci bölümde şer'iyye sicillerine dayalı olarak idari teşkilat gösterilmektedir. Burada kamu görevlileri, yetki çatışması, yerel yönetim faaliyetleri, yolsuzluk gibi kamu yönetiminin temel konularına değinilmektedir. Üçüncü bölümde ise şer'iyye sicillerine dayalı mali ve ekonomik konular anlatılmaktadır. Buradaki ekonomiden kasıt topyekûn bir ekonomi tarihi olmayıp ekonomideki devlet müdahalesinin varlığını ortaya koymaktır. Bu amaçla bu bölümde vergiler, muafiyetler, para düzenlemeleri, esnaf ve iş ilişkilerine devletin müdahalesi, İstanbul'un iaşesi ve ordunun ihtiyaçları anlatılmaktadır."
