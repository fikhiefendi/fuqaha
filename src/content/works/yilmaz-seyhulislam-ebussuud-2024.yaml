abstract: "Anne ve babasını ya da her ikisini de kaybetmiş kimseler için genel itibariyle yetim ve öksüz ifadeleri kullanılmaktadır. Bu çalışmada 16. yüzyılın önemli meşayihlerinden İbn-i Kemal ve Ebussuud Efendilerin“yetimlik”üzerine vermiş oldukları fetvaların genel değerlendirmesi ve mukayesesi yapılacaktır. İlk bölümde; konu kavramsal çerçeve açısından değerlendirilecektir. Öncelikle lügat manası ve kökenleri incelenecektir. Akabinde literatürdeki manasına değinilecektir. Yetimlikle alakalı ayet ve hadisler üzerinden ise konunun İslami perspektifi açığa çıkarılacaktır. İkinci bölümde; konu yetimliğin fıkhi yönü değerlendirilecektir. Konunun tarihsel süreci İslam öncesi dönemden itibaren ele alınarak günümüze kadar muhtelif dönemlerdeki yetimlik üzerine gerçekleştirilmiş hukuki ve kurumsal çalışmalar irdelenecektir. Ayrıca bu bölümde toplumun süreç içerisinde yetimlere karşı tutumu ve bakış açısı ele alınacaktır. Üçüncü bölümde; araştırmada değerlendirmeye tabi tutulacak fetvaların sahipleri olan İbn-i Kemal ve Ebussuud Efendilerin hayatı hakkında bilgiler verilecektir. İlk başta çocukluk ve gençlik yıllarına değinilecek ve akabinde ise ilmi yönleri ele alınacaktır. Son bölümde ise İbn-i Kemal ve Ebussuud Efendilerin yetimlik üzerine vermiş oldukları fetvaların fıkhi değerlendirmesi ve mukayesesi yapılacaktır."
