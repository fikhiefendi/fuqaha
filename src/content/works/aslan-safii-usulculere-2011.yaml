abstract: "Tezimiz, usûl tarihi açısından en verimli olan hicri beşinci asır ve daha sonra gelen tanınmış Şafiî usûlcülerin, ?edille-i erbâa?dan sonra beşinci delil diye adlandırdıkları istidâl delili hakkındaki görüşlerini işlemektedir. Bu dönemlerde yaşayan usûlcülere göre istidlâl kavramının ne anlama geldiği hakkındaki düşünceleri, istidlâlin dayanağı olarak zikrettikleri delilleri, istidlâl ile ilgili aralarında vuku bulan ihtilâflar ve istidlâl için getirdikleri örnekleri sunmaktadır.Eser, önsöz ve giriş dışında üç bölüm ile sonuç bölümünden ibarettir.Girişte hicri V. asra damgasını vuran Şafiî ekolüne tabi bazı usûlcülerin hakkında bilgi verilmiştir.Birinci bölümde istidlâlin tanımı ve mahiyeti ele alınmıştır.İkinci bölümde istidlâlin hücciyeti konusundaki görüşler üzerinde durulmuştur.Üçüncü bölümde istidlâlin kısımları ele alınmıştır.Yine bu bölümün sonunda hicri V. asırdan sonra gelen usûlcülerin ?istidlâl ile irtibatlı olan deliller? diye açıkladıkları şer'î delilerden kısa da olas bahsedilmiştir."
