abstract: "Arrest with a warrant has constituted one of the biggest problems in the Turkish criminal system for years. Turkey has been condemned by the European Court of Human Rights many times. Only in 2012, Turkey was second on the Court's list of countries found culpable of violating the right to liberty and security. Today, the violations arise from two different points: the Turkish codes and the practice of the Turkish courts. However, these problems are not unsolvable. The vulnerable provisions in the codes must be renewed and factors affecting the attitude of the courts should be abrogated. Moreover, radical changes in the Turkish judiciary system, such as plea bargaining, may avoid future violations"
