abstract: "Bu tezde Hanefi fıkhına göre Ehl-i Kitapla ilişkilerin nasıl kurulacağından söz edilmektedir. Bu amaçla belirli tarihlerden seçilen Hanefi fıkhına ait kitaplardan yola çıkılarak konu ele alınmıştır.Hanefi fıkhında Kur'an ve sünnete dayanılarak Müslümanlar ile Ehl-i Kitap kimselerin birlikte yaşayabileceği ifade edilmektedir. Bu durumun bir sonucu olarak Hanefi hukukunun çeşitli alanlarında Ehl-i Kitapla ilgili bilgiler yer almaktadır.Ehl-i Kitap kimseler İslâm ülkesi ile yaptıkları bir anlaşma ile vatandaşlık hakkı kazanırlar. Vergilerini belirtilen miktarlarda ödemeleri ile dini, şahsi, sosyal hak ve özgürlükleri korunur. Ehl-i Kitap kimselerin dini farklılıkları hukukun çeşitli alanlarında haklarının korunmasına engel değildir.Bu tezde Müslümanlar ile Ehl-i Kitap kimseler arasındaki ilişkilerin tarihte nasıl yaşandığı ele alınmıştır. Bunun tarihte pek çok örneği mevcuttur. Köken birliği olan bu dinler arasında tarih içinde ilişkilerin devam ettiği görünmektedir. Bundan sonraki süreçte de devam edeceği görünmektedir. İslâm dininin diğer dinlere bakışından karşılıklı hoşgörü ile birbirlerinin farklılıklarını kabul edip, saygı göstererek birlikte yaşanılabileceği anlaşılmaktadır."
