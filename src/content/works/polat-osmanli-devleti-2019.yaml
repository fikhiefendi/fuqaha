abstract: "İnsanlığın tarihi kadar geçmişi olan sürgün cezasını Osmanlı Türkleri de hukuklarına dâhil ederek uygulamışlardır. Şartları İslâm hukukunun şemsiyesi altında belirlenen bu cezayı özellikle de son asırlarında tazir kapsamında tatbik etmişlerdir. Önceleri daha çok batıya doğru yapılan fütuhâtın kalıcı hâle gelmesini temin etmek amacıyla yapılan toplu sürgünler zamanla eşkıyalık yapan bazı aşiretlerin cezalandırılmasında da kullanılmıştır. Osmanlının orta zamanlarında çıkarılmış olan kanunnâmelerde bazı adi suçlar için bir yaptırım olarak karşımıza çıkan nefy cezasının süresi ve şartlarıyla sarih olmayacak bir şekilde yer almış olduğunu görmekteyiz. Sürgün cezasının hukukî bir çerçeveyle süresinin ve şartlarının açık bir şekilde ortaya konduğu ceza kanunnâmeleri ancak Tanzimat sonrasında vaz edilmiştir. II. Mahmud zamanında çıkarılmış olan 1838 tarihli“Tarik-i İlmiyeye Dair Ceza Kanunâmesi”ile Osmanlı idaresi ilk defa sürgünü yalnızca padişahın veya sadrazamının kararıyla verilen ceza olmaktan çıkararak somut suçların karşılığı olarak bir zümreye tatbik edilebilir bir ceza hâline getirmiştir. Suçların ilk defa tasnifinin yapıldığı en kapsamlı ceza kanunnâmesi olan 1858 tarihli Ceza Kanunnâme-i Hümâyun ile hangi suçun karşılığının ne kadar süreyle sürgün cezası olacağı açıklanmıştır. Aynı kanunda bir kimsenin bulunduğu yerden başka bir yere gönderilerek müebbed veya muvakkat ikamet ettirilmesi olarak tanımlanan sürgün cezası; siyasî suçlar başta olmak üzere zimmete para geçirme, rüşvet alma veya verme, mahkeme kararlarına müdahale etme, katl-i nüfus, hedk-i ırz, gasp, zulmetme, asker kurasına muhalefet etme, görevini suistimal, isyan veya buna yönelik tahrik, haramları açıktan işleme, yasaklı yayınları dağıtma benzeri suçlarda da tatbik edilmiştir. 19. yüzyılda Orta Anadolu'nun doğusunda yer alan Eyâlet-i Rûm'da bulunan Sivas paşa sancağı ile eyâletin diğer iki sancağı Amasya ve Tokat'ın sürgün mahalleri olarak tercih edilmelerinin iklimleri ve merkezden uzaklıkları kadar sahip oldukları sağlam kaleleriyle de irtibatlı olduğu bir gerçektir. Bu merkezlerin sürgünlerin olduğu kadar kalebend veya ruhbanlardan manastırbend edilenlerin de cezalandırılmak üzere sürgün edildiği yerler olmuştur. Özellikle II. Mahmud zamanında başarısız paşaların ikamete memur edildiği bir yer hüviyetindeki bölge; heterodoks şeyhlerin ve dervişlerin ıslahı için de tercih edilen bir yer konumuna gelmiştir. Osmanlı donanmasının kürekçilere ihtiyacı olduğu bir zaman diliminde suçlulara taziren kürek cezasının revaçta bir ceza olması gibi; Osmanlı Devleti'nin dağılma ve inkırazının asrı olan bu yüzyılda da muhaliflerin ve suçluların en çok cezalandırıldıkları yöntem sürgün olmuştur. Tanzimat sonrasında siyaseten katl cezasının yerini alan bu cezaya, siyasî suçluların kazanılması veya te'dibi için özellikle de yüzyılın son çeyreğinde daha sık müracaat edilmiştir. Çalışmada suçluların sürgün gerekçelerinden, menfâlarına sevklerinden ve bununla ilgili görevlilerden, menfîlerin af talepleri ve gerekçelerinden, devletin ıtlak olunan sürgünlerden beklentilerinden, sürgünlere yönelik çıkartılan özel ve genel aflardan, sürgünlerin menfâlarında hastalık ve geçim sıkıntısı gibi sıkıntlardan, ailelerinin ise memleketlerinde yaşadıkları başta iktisadi olmak üzere menfilerin aflarına sebep teşkil edecek birçok sıkıntıdan bahsedilmiştir. Sürgün bulundukları yerin hava şartlarından ve burada geçinememekten şikâyetçi olan birçok sürgünün hâline merhamet edilerek kendilerine yevmiye veya maaş bağlandığı; bazı kalabalık sürgün mahkûmlarının da hayata tutunabilmeleri için kendilerine toprak ve ziraat aletinin dağıtıldığı da bu çalışmada gösterilmiştir. Böylece devletin soğuk yüzünü gören sürgünlere sonrasında merhamet edildiği ve birçoğunun ceza süresini ikmal etmeden ıtlak edildiği de konunun sınırları içerisinde incelemiştir."
