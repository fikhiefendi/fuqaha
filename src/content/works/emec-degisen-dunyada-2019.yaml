abstract: "Bu doktora tezi, ekonomi politik gelişmelerle finansman yöntemleri arasındaki ilişkileri incelemektedir. Finansman tarihi süreçte dini, sosyal, çevresel etmenlerle birçok form değişiklikleri geçirmiş ve değiştirmeye devam etmektedir. Bu çalışmada endüstri 4.0, teknolojik dönüşüm ve dijitalleşme ile gelişeceği düşünülen yeni iş modelleri, ortak kaynak kullanımı ve bu gelişmelerin finansman bacağındaki yansımaları incelenmiştir. Tezin hipotezlerinden biri olan ortaklık temelli finansmanın yaygınlaşacağı önermesi bağlamında, ortaklık temelli finansmanın İslam İktisadındaki tarihselliği, İslam İktisadının ortaklık ve borç temelli finansmana olan yaklaşımı tartışılmıştır. Sonrasında, katılım bankalarındaki mevcut ürün ve hizmetleri ortaklık ve borç temelli olmaları bakımından değerlendirilmiş, katılım bankalarının yeni gelişen finansman paradigmasına olan yaklaşımları analiz edilmiştir. İslam İktisadının özünde yer alan risk paylaşımı ve ortaklık temelli finans yaklaşımının katılım bankalarının finansman bacağında ciddi bir karşılık bulmadığı bilinen bir gerçekliktir. Bu bağlamda, yarı yapılandırılmış derinlemesine mülakat yöntemi ile katılım bankalarının yöneticileri gözünden katılım bankalarının ortaklık temelli finansman yerine borç temelli finansmana odaklanmalarının gerekçeleri analiz edilmiştir. Yine katılım bankaları yöneticileri gözünden katılım bankalarının ortaklık temelli finansmanı yaygınlaştırması ile elde edecekleri potansiyel kazanımlar tartışılmıştır. Ardından katılım bankalarının ortaklık temelli finansmanı yaygınlaştırabilmeleri adına model önerisinde bulunulmuştur."
