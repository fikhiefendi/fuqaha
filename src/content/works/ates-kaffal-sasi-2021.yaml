abstract: "Abbâsîler devrinde ayrı bir hanedan kuran Sâmânîler'in hakimiyetindeki Mâverâünnehir ilim havzasında pek çok meşhur âlim yetişmiştir. Bunlardan biri de Hicri 291 yılında Şâş'ta doğan Kaffâl eş-Şâşî'dir. Kaffâl, dönemin önemli ilim merkezlerinde bulunmuş, meşhur âlimlerinden ders almış ve birçok öğrenci yetiştirmiştir. Mâverâünnehir bölgesinde Şâfiîliğin intişarındaki etkisi büyük olmuştur. Kaffâl, tefsir, hadis, fıkıh, usûl, kelâm ve cedel ilimlerinde eserler vermiş, fıkha dair kaleme aldığı Mehâsinu'ş-şeriâ adlı eseriyle makâsıd düşüncesinin önemli simalarından biri olduğunu göstermiştir. Mezkûr eserinde akıl ile vahiy arasındaki ilişkiden söz etmiştir. Bilhassa şer'î hükümlerin illet ve hikmetlerinin bir maksada dayandığını ortaya koymuştur. Eserde fürû' fıkhın temel konularını makâsıdü'ş-şerîa temelinde serdetmiş ve kendinden önceki fakihlerden farklı bir yöntem geliştirmiştir. Bu bağlamda Mehâsinu'ş-şeriâ adlı eserinde yer alan İslâm aile hukukuna dair konular dikkatimizi çekmiştir. Kaffâl, burada evlenme akdi öncesi, evlilik süreci ve akdin sona ermesi durumlarını nass, akıl ve örf temelinde hikmet ve şer'î makâsıdları ortaya koyarak açıklamayı hedeflemiştir. Bu çalışmada bahsi geçen hususların yanı sıra Kaffâl eş-Şâşî'nin hayatı ve yaşadığı döneme ilişkin siyasî, sosyal, ekonomik, ilmî ve kültürel durumlar hakkında birtakım bilgilere yer verilmiştir. Bilhassa Mehâsinu'ş-şeriâ adlı eserde ailenin kuruluşundan dağılmasına kadar yer alan konulara dair müellifin illet ve hikmet yaklaşımları tespit edilmeye ve bu çerçevede şer'î maksatların mahiyet ve sınırları incelemeye çalışılmıştır."
