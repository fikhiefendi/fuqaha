abstract: "İslam hukukuna göre Zaruret Ve Hacet Kavramlarının Mali Muamelelere Etkileri başlıklı bu çalışmada, İslam'ın temel gayelerinden birisi olan“maslahatın temini”ve belli şartlar dahilinde“ihtiyaçların karşılanması”için önemli bir rol oynayan“zaruret ve hâcet”in mâlî muamelelerle irtibatı incelenmeye gayret edilmiştir. İslam'ın korunmasını hedeflediği ve“din, can, mal, ırz ve namus”tan oluşan beş şey için istisnaî ilkelerde koymuştur. Bunlar da zaruret ve hâcetin oluşmasıdır. İbadetlerde kolaylık ilkesi olarak değerlendirilen bu iki durum, mâlî muameler için de gerekçe oluşturmaktadır. Bu araştırmada bu iki haller varsa mâlî işlemlerin hangi şartlar ve hükümlerle sahihe yakın olabileceği incelenmiştir. Ferdî ve toplumsal boyutları bulunan zaruret, şer'î delillerin yardımıyla oluşan ilkelerin, can güvenliği ya da organ eksikliği gibi hayati bir tehlikeye maruz kalındığında istisnaî olarak istifade edilecek adeta kurtuluş kavramlarından birisidir. Hâcet ise giderilmediği zaman kişiyi ya da toplumu daha tehlikeli duruma yani zarara sürükleyecekse bu da yine zarurete dönüşmektedir. Zaruret ve hâcet kavramları birbirine girift hatta örf, adet, mekân, coğrafya farklılıkları gibi sebeplerle bazen birbirlerinin sınırlarını ihlal eden iki kelime olduğu tespit edilmiştir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Girişte çalışmamızın amacı ortaya konularak daha önce bu konuda yapılan çalışmalara işaret edilmiştir. Birinci bölümde zaruret ve hâcet kavramları tarif edilmiş, aralarındaki benzer ve farklı yönlerle irtibatlı diğer ıstılah hakkında bilgi verilmiştir. İkinci bölümde zaruretin mali işlemlere olan etkisi seçilen örnek üzerinden izah edilmeye gayret edilmiştir. Üçüncü bölümde hâcet mali işlemlere etkisi seçilen örnekler üzerinden detaylandırılmıştır. İslam hukukunda temel ihtiyaçlar“zarurî, hâcî ve tahsînî”olmak üzere üç kısımda ele alınırlar. İnsanlar ve kurumlar da harcamalarını genellikle bu sıralamaya göre yaparlar. Zarurî olanlar daha az sayıda iken, hâcet daha geniş bir alanı oluşturur. İbadetlerle ilgili meselelerde, insan hayatı söz konusu olduğunda ve mâlî muameleler icra edilirken zaruret hali bazen mahzurlu bir şeyin yapılmasını da mubah kılabilir. Bu zaruretin sürekli mi geçici mi olduğuna bazen kişinin kendisi bazen de fakihler karar verirler. Bu tasnife rağmen, zaruret ve hâcet/ihtiyaç kelimelerinin birbirinin yerine yahut birbirini teyit amaçlı kullanıldığına şahit olunmuştur. Mâlî muamelelerin temelinde asıl mubah olma esası bulunmakla birlikte, yeni ortaya çıkan ihtiyaçlar ve koşullar doğrultusunda bazı haram işlemler zarûret veya şiddetli hâcet sebebiyle geçici olarak mübah hale geldiği tespit edilmiştir. Bu durum, İslam hukukunun maslahat ve meşakkatleri kaldırma ilkesiyle uyumludur. Zarûret ve hâcet ilkeleri, çağdaş mâlî muamelelerde dinî sınırların esnek ve insanî ihtiyaçlara duyarlı şekilde yorumlanmasını sağladığı söylenebilir. Böylece İslam hukuku, hem temel şer'î prensiplere bağlı kalmakta hem de modern çağın ekonomik ve sosyal gerçeklerine pratik çözümler sunmaktadır. Sonuçta, her Müslümanın zaruret, hacet ve tahsiniyat durumunu iyi araştırması, ehliyle istişare etmesi ve ona göre mâlî muamelede bulunması, ma'siyete düşmemek için en ehven yol olduğu kanaatine ulaşılmıştır."
