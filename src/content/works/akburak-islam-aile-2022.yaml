abstract: "Hukuk, toplumun düzenini sağlamak, bireyler arasındaki ilişkileri belirlemek ve davranışları düzenlemek için oluşturulan kuralların bütünüdür. Hukuk; adaleti sağlama, hakları koruma ve anlaşmazlıkları çözme amacı taşır. Aile hukuku ise aile içi ilişkileri düzenleyen hukuk dalıdır. Evlilik, boşanma, velayet, mal paylaşımı, evlat edinme gibi konuları kapsar. Ayrıca miras, nafaka ve aile üyelerinin hak ve sorumluluklarını da içerir. Aile hukuku, aile üyelerinin haklarını ve çıkarlarını korumayı amaçlar ve aile ilişkilerinin adil ve düzenli bir şekilde yürütülmesini sağlar. Bu çalışmada Fransız aile hukukunun tarih boyunca geçirdiği reformlar ve dönüşümleri göz önünde bulundurularak İslam aile hukukuyla karşılaştırılmıştır. Böylece iki hukuk sistemi ve uygulamaları arasındaki benzerlikleri ve farklılıkları ortaya çıkarmak amaçlanmıştır. İlk bölümde evlilik öncesini ilgilendiren kavramları, evliliğin mahiyeti ve şartları, evlilik çeşitleri, evlilikten doğan hak ve sorumlulukları, nesebin sübutu ve neticeleri ele alınmıştır. İkinci bölümde boşanma hakkında genel bilgileri ve çeşitlerini tespit ettikten sonra evliliğin sona ermesinden doğan neticeleri incelenmiştir. Sonuç kısmında çalışmamızda ulaşılan neticeler ortaya konulmuştur. Araştırma, farklı inançların, kültürlerin ve hukuki sistemlerinin nasıl farklı sonuçlar üretebileceğini göstermiştir. Tarihten bugüne kadar Fransız aile hukukunda derin değişimlerin olduğu tespit edilmiştir. Bir taraftan toplumun gelişmesi sebebiyle aile kurumu hususunda değişen zihniyetlere alternatifler getirmek diğer taraftan Kilise hukukunun getirdiği kısıtlamalardan sıyrılma arzusu hukukun yeniden düzenlemesine sebep teşkil etmiştir. İslam aile hukukunda buna benzer değişimlerin olabilmesi olanaksızdır. Zira İslam hukukunun dinamik bir hukuk olmasına rağmen Kitap ve Sünnet'te tafsilatlı hükümlere yer verilmesi aile telakkisinin değişmesini önlemiştir."
