abstract: "İslami finansal ürünlere olan talep, son yıllarda dikkat çekici gelişmeler göstermiştir. Bu ürünlerin piyasa payları geleneksel finansal ürünlere kıyasla hala nispeten küçük olmasına rağmen, paylar hızla büyümektedir ve bu ürünler umut verici bir geleceğe sahiptir. İslami finansal ürünlerin gelecekte finans endüstrisinde önemli bir rol oynaması ve genel olarak ekonomiye katkı sağlamaları beklenmektedir. Çalışma, piyasa risklerinin yönetiminde birçok finans mühendisliği ürününün İslami kurallara uygun olmaması sorununu incelemekte ve bu sorunun portföy sigortası ile çözümünü önermektedir. Bu araçların piyasa riskinin yönetimi için kullanımı İslami finans alanında daha önce incelenmemiş olduğu için çalışma literatüre katkıda bulunmaktadır. Bu çalışmada; sabit getirili enstrümanlar üzerindeki portföy sigortası tekniklerinin İslami Portföy Performansı üzerindeki etkisinin araştırılması amaçlanmıştır. Bu amaca ulaşmak için, 2015-2020 döneminde Malezya Menkul Kıymetler Borsası'ndaki günlük hisse fiyatları kullanılarak hisse senetleri ile Şeriat uyumlu ve Şeriat uyumlu-olmayan yatırım portföyleri oluşturulmuş ve Opsiyon Bazlı Portföy Sigortası (OBPI) ve Sabit Oranlı Portföy Sigortası (CPPI) stratejilerinin performansı üç düzeyde (yüksek, orta ve düşük oynaklık) karşılaştırılmıştır. Çalışmanın sonuçları, İslami portföylerin piyasa riskinden korunmasında hem opsiyon bazlı portföy sigortası (OBPI) hem de sabit oranlı portföy sigortası (CPPI) stratejilerinin kullanılmasının önemini göstermektedir."
