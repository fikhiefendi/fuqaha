abstract: "Ülke ekonomilerinin sağlıklı gelişebilmeleri için bankacılık sektörünün etkin bir şekilde faaliyet göstermesi gerekir. Etkinlikten kastedilen bankaların daha kârlı ve krizden minimum etkilenir düzeyde önlemler alabilecek şekilde bir yapıya sahip olmasıdır.Bu çalışmada; katılım bankacılığı ve ticari bankacılık kavramlarının neler olduğuna, bu kavramların içeriklerine ve detaylarına değinildikten sonra Türk bankacılık sektörünün kârlılık performansları kıyaslanmış ve bunun için 4?ü katılım 4?ü ticari banka olmak üzere toplam 8 bankanın kârlılık performansları ölçülmüştür. Bu ölçüm 2003-2011 yılları arasını kapsamaktadır. Bu ölçüm yapılırken öncelikle katılım bankaları ve ticari bankaların bilanço ve gelir tablolarından veriler elde edilmiştir. Bu veriler bu analizde kullanılacak rasyoların ölçümü için gereklidir. Analizde kullanılan rasyolar: aktifin kârlılığı, özkaynakların kârlılığı, özkaynaklar / toplam aktif, net faiz (kâr payı) geliri / toplam aktif, vergi öncesi kâr / pasif toplamı, takipteki krediler / toplam krediler, toplam krediler / toplam aktif. Bu rasyolar bulunduktan sonra Topsis yöntemiyle performans puanları hesaplanmış ve birtakım sonuçlara ulaşılmıştır. Analiz sonucunda tüm yıllar irdelendiğinde performansı en yüksek çıkan bankalar Bank Asya ve Finansbank?tır. Performansı en düşük çıkan banka ise Bank Mellat?dır. Tüm bankaları incelersek; katılım bankalarının ticari bankalardan daha yüksek performans skorlarına ulaştıkları ve daha kârlı oldukları sonucuna ulaşılmaktadır."
