abstract: "slam borçlar hukukunun en önemli kısmını akitler olusturur. Bunun sebebi, akitlerin içerisine aldıgı konuların genis olmasıdır. Tezin temel hedefini, akitlerde meclis unsurunun tespit edilmesi olusturur. Bu noktada akit meclisine baglı olan muhayyerlikler ve mahiyetleri tezin tamamlanmasında ele alınan konulardır. Akit meclisi, akdi meydana getiren tarafların içerisinde bulundukları, irade beyanlarının akdin konusu üzerinde birlestigi zaman dilimidir. Meclis için zaman dilimidir yargısı, modern iletisim araçları ile kurulan akitler düsünüldügü zaman daha isabetlidir. Akit meclisi, icapta bulunan tarafın irade beyanıyla baslar. Bu sekilde baslayan meclis, akit tamamlanınca sona erer. Meclis ayrıca akdin bir sebeple bozulması halinde de sona erer. Akit meclisi içinde dogan muhayyerlikler, akit ile ilgili problemleri çözmek noktasında önemlidirler. Meclis muhayyerligi, tarafların meydana getirdikleri akdi, birbirlerinden ayrılmadan önce tek taraflı olarak bozup bozmama serbestligine sahip olmalarıdır. slam hukukunda akitlerin karsılıklı irade beyanları temeli üzerine kuruldugu düsünülür. Bu yönden bakıldıgı zaman meclis muhayyerliginin varlıgına dair olan görüs daha iyi anlasılır. Modern iletisim araçları kullanılarak akit olusturuldugu zaman meclis, kullanılan aracın yapısı dikkate alınarak belirlenir. Eger araç, es zamanlı iletisime imkan veriyorsa akit, hazır olan kimseler arasındadır. Burada meclis, tarafların irade beyanlarını ögrendikleri zaman dilimidir. letisim aracı es zamanlı iletisime imkan tanımıyorsa akit, gaip olan kimseler arasındadır. Bu durumda akit meclisi ilk irade beyanının karsı tarafa ulastıgı zaman dilimi olacaktır."
