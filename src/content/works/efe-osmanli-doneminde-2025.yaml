abstract: "Bu çalışma, Diyarbakır'da bulunan gayrimüslim cemaatlere ait kiliselerin Osmanlı hukuk statüsü çerçevesinde tamir-tadilat ve yeniden inşa sürecini arşiv belgeleri olan salnameler, şer'iye sicilleri ve mühimme defterleri gibi birincil kaynaklar ışığında ortaya koymayı amaçlamaktadır. Araştırma, Diyarbakır Sur ilçe merkezinde bulunan kiliseler hakkında bilgi vermektedir. Ayrıca, Osmanlı yönetiminin Diyarbakır eyaletindeki kiliselerin tamir ve yeniden inşasına yönelik uyguladığı kararlar ile bu sürecin işleyişini kapsamaktadır. Yöntemde iki temel yaklaşım benimsenmiştir. Birincisi, konuya ilişkin daha önce yayımlanmış çalışmalarda yer alan ve çevirisi yapılmış Osmanlı arşiv belgeleri, literatür taraması yoluyla incelenmiştir. Böylece kiliselerin tamir ve yeniden inşa sürecine dair mevcut bilgi birikimi değerlendirilmiştir. İkinci aşamada ise Diyarbakır'da bulunan kiliseler hakkında Osmanlı arşiv belgeleri doğrudan taranmış, konuya delil teşkil eden kayıtların transkripsiyonu gerçekleştirilmiştir. Arşiv belgeleri, Diyarbakır özelinde incelendiğinde bölgedeki kiliselerin tamir ve yeniden inşa süreçlerinde uygulanan prosedürlerin Osmanlı Devleti'nin genel uygulamalarıyla paralellik gösterdiği anlaşılmaktadır. Klasik dönemde süreç, şer'î hukukun etkisiyle Şeyhülislamın verdiği fetvalar doğrultusunda ve Divân-ı Hümâyun'dan alınan resmi izinle yürütülmüştür. Başvuru sürecinde, söz konusu yapının mevcut ve kadim bir kilise niteliği taşıdığı belirtilmesi zorunlu tutulmuştur. Genişletme veya değişiklikler yeniden inşa kapsamında değerlendirildiği için merkezi otorite tarafından engellenmiştir. Tanzimat döneminde modernleşme politikalarının etkisiyle daha esnek bir uygulama benimsenmiştir. Tamir ve yeniden inşa talepleri, büyük ölçüde Babıâli'de verilen kararlarla onanmıştır. Arşiv kayıtlarında tamir izinlerinin çoğunlukla“eski hali üzere”şartıyla verilmesi, Osmanlı idaresinin yapıların özgün mimari formunu koruma yönündeki hassasiyetini ortaya koymaktadır. Diyarbakır'daki kiliselerin korunmasına yönelik Osmanlı'nın uyguladığı politikalar, kültürel mirasının sürdürülebilirliği açısından da önem arz etmektedir. Bu yapılar, toplumsal belleğin somut taşıyıcıları olarak kentin tarihsel kimliğinin şekillenmesinde belirleyici bir rol üstlenmektedir. Ayrıca, inanç ve diaspora turizmi bağlamında Diyarbakır'ın çekiciliğini artırarak ulusal ve uluslararası ziyaretçilerin ilgisini çekmektedir. Bu yönüyle kiliseler hem tarihsel hem de sosyo-kültürel açıdan stratejik bir değer taşımaktadır."
