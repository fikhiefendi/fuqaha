abstract: "İslam hukukunda nassın hükmünü genişletmenin en yaygın yöntemi kıyâstır. Kıyâs işleminin yapılabilmesi için hükmü belirlenmiş asıl ile hakkında hüküm bulunmayan fer' arasında ortak bir vasfın tespit edilmesi gerekmektedir. Belli bazı yöntemler dâhilinde tespit edilen bu vasfa/illete hükmün bağlanabilmesi için bazı şartlar taşıması icap etmektedir. Tüm bu faaliyetler fıkıh usûlü literatüründe ta'lîl kavramı ile ifade edilmektedir. Ta'lîlin kabulü hususunda usûlcüler arasında görüş birliği bulunmakla birlikte, vasfın tespitinde kullanılacak yöntemler ve gerekli şartlar konusunda görüş birliğinden bahsetmek mümkün değildir. Bu konudaki görüş ayrılığı, farklı fıkhî mezhebe bağlı usûlcüler arasında bulunduğu gibi aynı mezhebe bağlı usûlcüler arasında da bulunmaktadır. Bunun en bariz örneği Şâfiî usûlcü Seyfuddîn el-Âmidî'dir (ö. 631/1233). Âmidî'nin ta'lîl konusundaki anlayışının ele alındığı bu araştırma, giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş kısmında araştırma hakkında genel bazı bilgiler verilmiştir. Birinci bölümde, fıkıh usûlünün tedvin asrı olarak kabul edilen hicri üçüncü asır ile tahkîk asrı kabul edilen hicri yedinci asra kadar illet ile hüküm arasında kurulan ilişkinin mahiyeti tespit edilmiştir. İkinci bölümde, şer'î hükümlerin ta'lîlinin dayanağı kabul edilen hüsün-kubh ve ilâhî fiillerin ta'lîli ile illetin tartışmalı olan şartlarına Âmidî'nin bakışı ve diğer usûlcülerden ayrıldığı noktalar belirlemeye çalışılmıştır. Üçüncü bölümde Âmidî'nin illetin tespit yol/yönetmeleri ve illeti geçersiz kılmaya yönelik itirazlar hususundaki görüş ve tercihleri ele alınmıştır. Sonuç kısmında ise, araştırmada varılan neticeye yer verilmiştir."
