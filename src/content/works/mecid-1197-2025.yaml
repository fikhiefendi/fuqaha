abstract: "Tezimiz İmam Burhaneddîn Ebü'l-Hasan Ali b. Ebû Bekir b. Abdülcelil el-Mergînânî'nin (ö. 593/1197) ''et-Tecnîs ve'l-mezîd'' isimli eserinin on bir bölümünün araştırma ve tahkikini içermektedir. Daha çok el-Hidâye adlı fıkıh eseriyle tanınan Mergînânî pek çok ilimde uzmanlaşmış ve geride büyük bir ilmî miras bırakmış Hanefi mezhebine mensup büyük âlimlerden biridir. En önemli eserlerinden olan et-Tecnîs ve' l-mezîd'de kendisinden önceki Hanefi âlimlerinin fetvalarını derleyerek kendi görüş ve tercihlerine de yer vermiş ve güzel bir şekilde tertip ederek eseri daha kullanışlı hale getirmiştir. Tez giriş, üç bölüm ve sonuçtan oluşmaktadır: Girişte tezin bilimsel açıdan önemi, konuyu seçmenin nedenleri, tezin hedefi ve tahkik yöntemi, önceki çalışmalar ve tahkikte yapılan işlemlere yer verilmiştir. Birinci bölümde müellifin hayatı, ilim yolculukları, hocaları, talebeleri, eserleri, ilmi konumu ve vefatına yer verilmiştir. İkinci bölünde yazmanın müellife olan nispetinin tespiti, ilmi değeri, tasviri ve eserin tanıtımıyla birlikte tahkikte faydalanılan kaynaklara yer verilmenin yanı sıra müellifin eseri kaleme alma yöntemi, yazmanın özellikleri ele alınmış ve diğer fetâvâ ve nevâzil eserleriyle mukayese edilmiştir. Üçüncü bölümde tahkik edilen metne yer verilmekte olup Mefkûd, İbâk, Gasb, Vedîa, Âriye, Şerike, Sayd, Zebâih, Udhiye, Vakıf, Hibe ve Sadaka konularını içermektedir. Sonuç kısmında ise tezde ulaşılan en önemli sonuçlar yanı sıra ileride yapılabilecek çalışmalara ilişkin olarak araştırmacılara öneriler sıralanmıştır."
