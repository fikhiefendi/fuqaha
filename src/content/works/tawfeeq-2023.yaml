abstract: "Bu araştırmanın konusu, Çağdaş hayattaki entelektüel sermayenin önemine dayanmaktadır. Çağdaşlık unsurlarında ve üretim araçlarındaki müthiş ilerleme ve gelişim ile edebi, sanayi ve fikri haklar ile ilgili hukuki konularda bilim adamları için daha ciddi alınması gereken konu oldu. Bilim adamları tarafından bu konularda yapılan derin araştırmalar sonunda üretim ve düşünce çalışmaları ile ilgili yasal çözüm yöntemlerin bulunmasına yardımcı olmuştur. Bu araştırma, aktif alanlarda yapılan bilimsel araştırmalar olup entelektüel sermayenin yetki denetimindeki etkilerinin belirlenmesi için yapılmıştır. Ayrıca çağdaşlık unsurunun İslami boyutunu en aza indirmektedir. Hal böyle olunca entelektüel sermayenin yeni boyutları yeniden çizilmiştir. Bu işlem, bilim adamları tarafından bilimsel analiz ve tarihsel açıdan ele alınmış olup düşüncenin önemini belirlemek için yapılmıştır. Çünkü bu işlemler medeni ve insani haklar ile ilgili olup bu hakların korunması gerekmektedir. Bu nedenle araştırmacı, bu konuya hukuksal araştırmaları yapmak için çaba sarfetmiştir. Bu araştırmaların amacı, yazarların telif haklarını ve patent haklarının korunmasından ibarettir. Ayrıca aktif çalışmalardaki entelektüel sermayenin önemine vurgu yapmaktadır. Bunu gerçekleştirmek için Bağdat iline bağlı Al-Rasafe ilçesinde bulunan anonim şirketlerde çalışan müdür ve işçiler arasında anket çalışması yapılmıştır. Bu anketin amacı, entelektüel sermaye üzerindeki ekonomik etkenlerden biri olan rekabet avantajının yaratılması sırasında entelektüel sermayenin korunması üzerindeki etkenlerin ortaya çıkarılması hedeflenmiştir. Bunu belirlemek için araştırmacı, Bağdat'ın doğu yakasında anonim şirketler üzerinde alanda aktif olarak çalışmalar yapmıştır. Ayrıca çalışanlar üzerinde muhtelif düzeyde anket çalışması yapmıştır. Bu çalışmanın amacı, entelektüel sermayenin en önemli etkeni olan rekabet unsurunun yaratılması ve bu unsurun ekonomik yönden entelektüel sermeye üzerindeki önemi için yapılmıştır. Varsayımlar üzerinde yapılan deneme araştırmaları sırasında yapılan tanımlayıcı araştırma endeksleri sonunda entelektüel sermayenin korunması ile rekabet avantajının yaratılması arasında %5 oranında manevi bağ olduğunu ve bu oran ile iki unsur arasında güçlü ilişkinin bulunulduğu ortaya çıkmaktadır. Bu sonuç ile entelektüel sermayenin ekonomik etkilerinin önemini ortaya çıkararak bu anlayışın hukuksal uyumu açıdan önemli bir unsur olduğu anlaşılmıştır. Araştırma kapsamına giren Irak kökenli anonim şirketlerin entelektüel sermayeleri, maddi varlıkların hacimleri ile illerdeki şube sayıları ile veya elde ettiği geçici gelirlerin hacimleri ile ilintili olmayıp entelektüel sermayenin kapsamına girmektedir. Diğer bir ifade ile çalışan kadronun sahip oldukları değerlerden ibarettir. Çünkü şirketlerde çalışanların bu değerleri kamu yatırım alanında beşeri verimlilik yatırımları yolu ile düşünce ve icatların katma değere dönüşmesine neden olmaktadırlar. Anket sonuçlarına göre araştırmacı nezdinde oluşan kanaatin özetinde, entelektüel sermayenin anonim şirketlerdeki rekabet avantajını yaratmakla en büyük kaynak olduğu görüşü hakim olmuştur çünkü entelektüel sermayenin şirketin muhasebe kayıtlardaki değerler ile görünen değerler arasında geniş alan"
