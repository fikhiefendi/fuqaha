abstract: "Peygamberlik konusu, insanlığın inanç tarihi içerisinde gerek farklı dinler arasında gerekse de aynı dinin muhtelif düşünce ekolleri arasında tanımı, konumu, gerekliliği ve ispatı gibi birçok açıdan tartışılmış ve önemini daima korumuş bir konudur. Peygamberlik konusu, aynı zamanda İslâm'ın temel konularından da birisidir. İslâm âlimleri nübüvvet hakkında birbirinden farklı görüşler belirtmişlerdir. Bu açıdan İslâm âlimlerinin nübüvvet anlayışlarının doğru anlaşılması önem kazanmaktadır. Nübüvvet konusunda pek çok çalışma yapılmakla beraber İmâm Mâtürîdî'nin ve Ebü'l-Yüsr Muhammed Pezdevî'nin nübüvvet hakkındaki görüşleri karşılaştırmalı olarak incelenmemiştir. Bu yüzden bu çalışmada Mâtürîdîliğin kurucusu olan İmâm Mâtürîdî'nin ve Mâtürîdîlik ekolünün önemli temsilcilerinden olan Pezdevî'nin nübüvvetle ilgili görüşlerinin objektif bir şekilde incelenip karşılaştırılması amaçlanmıştır. Bu çalışmada fikirler üzerine derinleşme prensibinden hareketle İmâm Mâtürîdî'nin ve Pezdevî'nin nübüvvet anlayışları tarafsız olarak ortaya konulmaktadır. Konunun daha iyi anlaşılması amacıyla şahıslar üzerinde derinleşme prensibinden hareketle İmâm Mâtürîdî'nin ve Pezdevî'nin hayatına ve şahsiyetine kısaca temas edilmiştir. Bu araştırmanın sonucunda, İmâm Mâtürîdî ile Pezdevî'nin peygamberliği ispat yöntemleri, mûcizeye yaklaşımları ve nübüvvetin gerekliliğine dair gösterdikleri naklî deliller gibi çoğu noktada ortak görüşte oldukları sonucuna ulaşılmıştır."
