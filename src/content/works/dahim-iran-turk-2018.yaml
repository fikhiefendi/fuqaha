abstract: "Nikah akdi eski zamanlardan beri varlığını sürdüren bir akittir. Nikah akdi kavramını, aile kurumu, nişan ve evlilik kavramlarıyla birlikte düşünmek gerekmektedir. Bu kavramları açıklamak için öncelikle dünyada hüküm sürmüş eski medeniyet ve kültürleri dikkate almamız gerekmektedir. Çünkü nikah akdi, her ülkeye özgü örf ve adetlere bağlıdır. Nikah hem hayatın hem de nesillerin devamı açısından önemli olması sebebiyle, hukukun en fazla ilgi duyduğu ve düzenleme yaptığı alanların başında gelmektedir. Nikah konusunda ülke'den ülke'ye bir kısım farklılıklar bulunmaktadır. Bu çalışmanın amacı, nikah akdinin zorunlu olması dışında, bazı ülkeler'de pek önem verilmeyen bu kutsal akdin ve aile kurumunun önemini ortaya koymak ve böylece onun daha iyi anlaşılmasına katkıda bulunmaktır. Bu çerçevede günümüz İran hukukunda nikah akdini ve İslam dünyasında çeşitli tartışmalara yol açan Mut'a nikahını tartışmak ve değerlendirmek tezimizin temelini oluşturmaktadır."
