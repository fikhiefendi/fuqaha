abstract: "ÖZET Beytü'l-Mal (Hazine), ilk defa Müslümanların kullandığı ve günümüzdeki devlet hazinesi anlamına gelen bir kavramdır. Hz. Peygamber döneminde fazla dikkat çekmeyen Beytü'l-Mal, birçok atılım ve yeniliklerin gerçekleştiği Hz. Ömer döneminde yeni kurulan divanlarla genişletilmiş ve düzenli bir hale getirilmiştir. Beytü'l-Mal'ın kaynakları, vergiler ve vergi dışı gelirlerden oluşmaktadır. Devlet başkanı, vatandaşların maslahatına olacak şeylerde Beytü'l-Mal'dan harcama yetkisine sahiptir. Gerek Hz. Peygamber ve gerekse Hulefâ-i Râşidîn, kendilerini yetim malını çalıştıran bir veli gibi görmüş ve devlet hazinesinden yaptıkları harcamalarda halkın genelinin maslahatını gözetmişlerdir. Devlet başkanları eğitim, bayındırlık siyasî ve askerî alanlarda yapılacak birçok çalışma için devlet hazinesinden ödenekler ayırmışlardır. Hz. Ömer'in bizzat kendi çizdiği projelerle Utbe b. Gazvan'a kurdurduğu Basra şehri, Ebu'l-Heyyâc'a kurdurduğu Küfe şehri ve Mısır valisi Amr b.As'a- kurdurduğu Fustat şehri bu çalışmalara birer örnektir. Şehirleşme ve imarla ilgili projeleri ve bu alandaki gayretlerinden dolayı Hz, Ömer'in, İslâm tarihindeki ilk belediye başkanı olarak da nitelendirilebileceği kanaatindeyiz. Beytü'l-Mal'dan halkın maslahatına yönelik her türlü harcama yetkisi verilen devlet başkanlarının, bu yetkilerini genelde suistimal etmediklerini ve Hz. Osman gibi zengin olan bazı halifelerin devletten maaş bile talep etmediklerini görmekteyiz..,,, Beytü'l-Mal'dan yapılan harcamalar hep kamu yararına olmuş tek tek şahıslar değil toplumun geneli gözetilmiştir. Vatandaşlar arasında hiçbir ayırım ı yapılmadan herkesin sosyal güvenlik şemsiyesi altına girmesi sağlanmış ve bundan Yahudi ve Hıristiyan vatandaşlar da faydalanmıştır.Delet başkanı, kamu yararına olan hizmetleri yaparken, yasama,yürütme ve yargı organlarınca da denetlenmek suretiyle harcamalar sınırlandırılmıştır. r*srai «««fir-"
