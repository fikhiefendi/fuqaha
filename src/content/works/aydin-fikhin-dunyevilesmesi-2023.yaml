abstract: "Dünyevileşme, genel anlamda ahlakî, sosyal ve ticari konularda kişinin emeğini, imkanını dünyevi unsurlara yoğunlaştırması; bu hususlarda dinî değerleri gözetmeyişi ya da çok az gözetmesi; insanın kendini dünyanın çekiciliğine kaptırması şeklinde tanımlanabilir. Dünyevileşme, insanın hayat tarzından düşünme biçimine, varlıkları algılamasından olaylara ve olgulara bakış açısına kadar birçok konuyu kapsamaktadır. Dinî inanç, sembol ve değerlerin hayatın dışına itilmesi anlamına gelen dünyevileşme gerek bireysel hayatta gerekse de toplumsal hayatta dinin etkisinin zayıflaması ya da kaybolması anlamına gelmektedir. İslam'ın ilk dönemlerinde fıkıh kavramı“Kişinin lehine ve aleyhine olan şeyleri bilmesi”şeklinde tanımlanmakta ve tanımdan da anlaşılacağı üzere bireyin hayatının itikadi, ameli ve ahlaki bütün yönlerini kapsamaktaydı. Ancak özellikle de disiplinlerin birbirinden ayrılmasıyla birlikte fıkıh kavramı anlam daralmasına uğramış ve daha önceleri bireyin hayatıyla ilgili bütün yönleri kapsarken artık şer'i amelî hükümleri ifade eder hale gelmiştir. Zaman içerisinde de şer'i amelî hükümlerin zahiri yönü daha ön plana çıkmış ve ahlak kuralları geri planda kalarak etkisini yitirmeye başlamıştır. Bu da fıkhın modern hukuk gibi dünyevi bir ilim olarak algılanmasına sebep olmuştur. Bugün kullanılan İslam hukuku tabiri de bu düşünceyi ortaya koymaktadır. Nitekim İslam hukuku tabiri günümüzde akademik alanda fıkıh kavramı yerine kullanılsa da fıkhın aksine ibadet konuları hukuk alanından ayrılarak daha çok ilmihal türü eserlerde ele alınmaya başlanmış, İslam hukukunda ise muamelat ve ukûbat alanını ilgilendiren konular işlenmiştir. Tezimizde de fıkıh kavramının yaşamış olduğu değişimi, İslam hukuku tabirine geçişle beraber hukukla arasındaki benzerlik ve farklılıkları, fıkhın dünyevileşmesine sebep olan faktörleri ve bu dünyevileşmenin yansımalarını tespit ederek bunları incelemeyi hedefledik."
