abstract: "228 NUMARALI URFA ŞER'İYYE SİCİLİ'NİN TRANSKRİPSİYONU VE DEĞERLENDİRİLMESİ( H.1288-1289/M.1871-1872) Bu çalışma, 228 Numaralı Urfa Şer'iyye Sicilini incelemektedir. 19. yüzyılda Urfa'nın sosyal, kültürel ve ekonomik hayatının tespit edilmesi amaçlanmaktadır. Çalışma ile Urfa'nın Halep'e bağlı bir sancak olduğu ve Urfa'ya bağlı dört kazanın bulunduğu (Birecik, Halfeti, Harran, Suruç) tespit edilmiştir. Ayrıca, bu dönemde Urfa'da farklı etnik ve dine mensup halkın (Türkler, Kürtler, Araplar, Ermeniler, Süryaniler) bir arada yaşadığını, nüfusun çoğunluğunun Müslüman Türklerden oluştuğunu, Müslim ve gayrı Müslim halk arasında çok ciddi sorunlar çıkmadan barış ve huzur içinde yaşadıkları belirlenmiştir. Kadının toplumsal hayatın içinde olduğu, sosyal, ekonomik faaliyetlerde bulunduğu ve gerekli olduğu durumlarda bizzat mahkemeye başvurabilme hakkının olduğu gösterilmiştir."
