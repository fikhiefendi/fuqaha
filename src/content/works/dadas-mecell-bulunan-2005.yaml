abstract: "Mecelle'de Bulunan Hukuk-Dil İlişkisine Yönelik Külli KaidelerinÇözümlemeleriTam adıyla Mecelletu Ahkâmi'l-Adliyye (Adli Kaideler Kitabı) akitler ve borçlarhukuku ile sivil muhakeme usulünü maddeler halinde ihtiva eden bir kanunnamedir.Toplam 1851 maddeden oluşan Mecelle'nin hazırlanışında, başta Ahmet Cevdet Paşaolmak üzere devrin seçkin hukuk otoriterli görev almıştır. Mecelle'nin hazırlanmasında siyasi,hukuki ve iktisadi etkenler göze çarpmaktadır. Mecelle, alanında bir yenilik arz ettiğinden, bugünkü Türkiye sınırları dışında da uygulanmıştır. Nihayet Türkiye'de 1926 yılında kabuledilen yeni Medeni Kanun ile beraber yürürlükten kaldırılmıştır.Külli kaideler, ifade ettikleri anlam ve yapıları bakımından fıkhın geliştiği asırlarda,büyük hukukçuların eliyle tedrici olarak ortaya çıkmış ve tekamül etmiştir. Bu kaidelerinmetinlerinin ilk olarak, Peygamber Efendimize ait olanları dışında, kimler tarafındansöylendiği de bilinmemektedir.İslam Hukukçuları nassın (hukuk kuralı-metin) ne istediğinin ortaya konulmasındagünümüz hukukunda ?Lafzi Yorumlama Yöntemi? ya da ?Deyimsel Yorumlama Yöntemi?denilen klasik Fıkıh Usulü tabiriyle ?Usulu'l Kavaidi'l Luğaviyye? ?Usule Ait Dil Kaideleri?ni kullanmışlardır.Hukuk-dil ilişkisi bakımından Mecelle'deki külli kaidelerin çözümlemeleri, dil iledoğrudan ilgili olanlar ile dolaylı olarak ilgili olanlar şeklinde yapılabilir. Mecelle'dedoğrudan dil ile ilgili olarak tespit edilen kaideler on bir tane olup, dolaylı olarak tespitedilenler ise iki tanedir.Dil ile ilgili kaideler, Mecelle'deki yasaları etkilemiştir, bir başka deyişle, bu kaidelerdayanılarak Mecelle'de maddeler meydana getirilmiştir. Ancak, bunda, kaidelerin her birininaynı derecede Mecelle'deki maddelere etki etmediği görülür."
