abstract: "Muhaddis, usûlcü Salâhuddîn el-Alâ'î, hicri sekizinci yüzyılın âlimlerinden biri olup usûl ile füruu, menkul ile maʻkûlu cemetmiştir. Hadis ilmindeki büyük çabaları hem önceki hem de sonrakilerin dikkatini çekmiş, ancak fıkıh usûlü ile ilgili görüşleri üzerinde gerekli araştırma ve inceleme yapılmamıştır. el-Mecmûʻu'l-müzheb fî kavâʻidi'l-mezheb adlı kıymetli çalışması, eser ile nazarı birleştirmenin ehemmiyetine şahitlik etmekte, Alâ'î'nin kaide ve fürû açısından fıkıh ilminin derinliklerine dalacak üstün ilmi gücünü ortaya koymaktadır. Alâ'î'nin usûlî görüş ve tercihlerini ortaya koymayı hedefleyen bu çalışma; bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş iki kısımdan oluşmakta; birinci kısımda araştırmanın problemi, amaçları, önemi, yöntemi ve konuyla ilgili daha önce yapılmış çalışmalar yer almaktadır. İkinci kısımda ise Alâ'î'nin hayatı ve ilmî kişiliği ile el-Mecmûʻu'l-müzheb fî kavâʻidi'l-mezheb adlı eseri hakkında bilgi verilmektedir. Birinci bölüm, Alâ'î'nin şer'î hüküm ve şerʻî delil konularına ilişkin usûlî görüşlerine tahsis edilmiştir. İkinci bölümde lafızların delâleti, müellifin içtihat, taklît, tearuz, tercih ve nesih ile ilgili usûlî görüşleri ele alınmaktadır. Sonuçta ise araştırma neticesinde elde edilen önemli veriler belirtilmektedir."
