abstract: "Toplum içinde çıkan sorunların çözümü için toplumların gelişimine bağlı olarak kurumlar oluşmaya başlamıştır. Çünkü bu ihtiyaç zaman kavramı hissedilmeksizin bütün dünya kavimleri için bir zaruret oluşturmuştur. İnsanlar arasında meydana gelen anlaşmazlıkları bir sonuca ulaştırmak, diğer bireylerin huzuru için de bir gereklilik arz etmektedir. Bu tür olayların kontrol altına almak ve disipline etmek amacıyla kurumlar oluşturulmuştur. Bu kurumların oluşum aşamaları uzun zamanlar alabilmektedir. Bazı toplumlar adalet kavramını doğaüstü güçler ile uyuma; bazı toplumlar kendi içlerinden bir şahsı; bazı toplumlarda adalet beklentisini tanrıya havale etmiştir. Şer'i mahkemeler Osmanlı Devleti'nin en önemli yargı organı olan mahkemelerdir. Padişahın ülkenin en ücra köşesine kadar adaleti sağlamak amacı ile görevlendirmiş olduğu kadılar vasıtasıyla bu mahkemelerde insanlar kendilerini savunmuş veya hak arama taleplerinde bulunmuşlardır. Bu davaların sonuçlarının kayıt edildiği evraklara şer'iye sicilleri denmektedir. Bu siciller toplumun, sosyal ve hukuki hayatı hakkında çok önemli bilgiler vermekle birlikte Türk Kültür ve Tarihi hakkında da çok ciddi bilgiler muhteva etmektedir. Bu çalışmamızda 246 numaralı Adıyaman kadı sicili (h.1329/m.1911) 1-70 sayfalarının transkripsiyon ve değerlendirmesini yapmaya çalıştık. İncelemiş olduğumuz defterde mevcut konular içerisinde darp, kadın kaçırma, hakaret, bağ ve bahçe tahribatı, aile içi şiddet, hırsızlık ve yaralama davalarının yanında kamu davaları da yer almaktadır. Çalışmamızın başında Osmanlı hukuk sistemi hakkında genel bir değerlendirme ve Osmanlı hukukunu oluşturan unsurlar hakkında bilgi vermeye çalıştık. Kadılık Kurumu, ortaya çıkışı, kadıların görevleri, yargılama şekilleri, Şer'iye Sicilleri ile ilgili bilgi verip, incelediğimiz 246 numaralı Adıyaman Kadı sicilinin 1-70 sayfalarına dayanarak Adıyaman'ın sosyal ve ekonomik durumu hakkında bilgi vermeye çalıştık."
