abstract: "Osmanlı Devleti'nin İslâm hukukunu tatbiki meselesi hukukçular ve tarihçiler arasında uzun süredir tartışılan bir konudur. Özellikle batılı araştırmacılar Osmanlı Devleti teorik anlamda İslâm hukukuna riayet etmiş olsa da bu hukuku uygulamadığını iddia ederken bazıları da Osmanlı Devleti'nin bu hukuku tam şekilde uyguladığını ve kâdıların İslâm hukukuna uygun hükümler verdiğini söylemektedir. Bu anlamda Osmanlı Devleti'nin İslâm hukuku uygulaması problem olduğu ortaya çıkmaktadır. Bu çalışmamızda Osmanlı Devleti'nin İslâm hukukunu uygulayıp uygulamadığını kazf ve hakaret suçları bağlamında değerlendirdik. Bu amaçla ilk olarak İslâm hukuk doktrinindeki kazf ve hakaret suçlarını klasik fıkıh kitapları, Osmanlı fetva mecmuaları ve Osmanlı kanunnameleri ekseninde inceledik. Devamında ise İstanbul ve Üsküdar mahkeme kayıtlarında yer alan kazf ve hakaret suçlarını araştırdık ve İslâm hukuk doktrindeki kazf ve hakaret suçlarıyla uyuşup uyuşmadığını mukayese ettik. Böylece Osmanlı Devleti'nin bu hukuku uygulayıp uygulamadığına dair bir kanaate varılmak istenmiştir."
