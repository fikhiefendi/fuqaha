abstract: "Katılım bankacılığı, dünyada İslami bankacılık olarak bilinen faizsiz finansal hizmetler sunan bir bankacılık türüdür. Katılım bankacılığı sektörü 1960'lı yıllardan itibaren ciddi girişimlere sahne olmuştur. Bugün ise toplam İslami bankacılık varlıklarının küresel bankacılık varlıklarından almış olduğu pay %6'dır. Türkiye özelinde ise bu oran %6,3'tür. Bu çalışmada, katılım bankalarının finansal performansları uluslararası olarak değerlendirilmiştir. Çalışmanın temel amacı, Türkiye'de son dönemlerde katılım bankacılığı sektöründe yaşanan gelişmeler ve bu gelişmeler doğrultusunda atılan adımların bankaların finansal performansında ne gibi sonuçlar meydana getirdiğini incelemektir. Türkiye katılım bankacılığı konusunda bazı Ortadoğu ve Asya ülkelerine göre henüz küçük bir paya sahiptir. Türkiye'nin finansal performansını bu ülkelerle karşılaştırmak ise çalışmanın bir diğer amacını oluşturmaktadır. Çalışmada çok kriterli karar verme yöntemlerinden TOPSIS yöntemi kullanılmıştır. 2012-2019 yıllarını kapsayan çalışma sonucunda en başarılı bankalara sahip ülkelerin Suudi Arabistan, Birleşik Arap Emirlikleri (BAE) ve Kuveyt olduğu tespit edilmiştir. Türkiye'de faaliyet gösteren Kuveyt Türk Katılım Bankası ise diğer ülkelerin bankaları arasında önemli bir başarı yakalamıştır."
