abstract: "İnsanlar ihtiyaçlarını karşılamak amacıyla çalışmaktadırlar. Bu ihtiyaçlarını karşılamak için önce toplayıcılık ve avcılıkla uğraşmışlar, daha sonra tarım ve sanayi ile uğraşmaya başlamışlardır. İlk çağlarda tarım sektörü insan ihtiyaçlarını karşılamak için yeterlidir. Ancak zaman içerisinde insan nüfusu artış göstermiştir. İnsanlar ürettikleri veya ellerinde olan malları başka mallar ile takas etmeye başlamışlardır. Bu takas işlemleri ile ihtiyaç duydukları malları edinmişlerdir. Piyasada takas edilen malların sayısının artması nedeniyle işlemleri kolaylaştıracak bir araç ihtiyacı ortaya çıkmıştır. Bu araç ise para olmuştur ve para sayesinde piyasada alım satım işlemleri kolaylaşmıştır. Paranın ortaya çıkması ile takas ekonomisi ortadan kalkmıştır. Ticaretin ve üretimin artması sonucu finansal kurumlara ihtiyaç duyulmuş ve bankalar böylece ortaya çıkmıştır. Kapitalizm ve faizli bankacılık zaman içerisinde sermayenin belli ellerde toplanmasına, gelir dağılımı adaletinin bozulmasına neden olmuştur. 1970'li yıllardan itibaren Müslüman ülkelerin çoğu petrol ve doğalgaz gelirleri sayesinde zenginleşmişlerdir. İslam dininin faizli bankacılığı yasaklamış olması ise Müslümanların petrolden elde ettikleri gelirleri değerlendirmek için içinde faizin olmadığı finansal sistem arayışlarına girişmesine neden olmuştur. Bu süreçte İslami Bankacılık (Katılım Bankacılığı) ortaya çıkmış ve günümüze kadar gelmiştir. 1980'li yıllarda Türkiye'de faaliyete başlayan katılım bankaları zaman içerisinde gelişmişlerdir. Ancak Müslüman bir ülke olmasına rağmen Katılım bankalarının Türkiye bankacılık sektöründeki payı istenilen seviyeye ulaşamamıştır. Katılım bankaları, Konvansiyonel bankalara nazaran krizlere daha dayanıklıdırlar ve reel kesime daha etkin destek verirler. İslami hassasiyetler nedeniyle bankacılık sektörüne girmeyen fonları sistem içerisine sokmaktadırlar. Katılım bankalarının bankacılık sektöründe potansiyelinin altında gelişme sağlamış olmasının nedeni önemli bir sorundur. Tezimin amacı Katılım bankalarına KOBİ'lerin bakış açılarının incelenmesidir."
