abstract: "Aile müessesesi, toplumun temel yapı taşlarından biri olup İslam dini, aile kurumuna büyük bir önem vermiş bu sebepten dolayı da evliliği teşvik etmiştir. İslam dini aile kurumunu sevgi, saygı, merhamet, hoşgörü ve adalet gibi temel değerler üzerine inşa etmiştir. Bu temeller üzerine kurulan evlilikler genellikle sürdürülebilir olsa da, zaman zaman karı-koca arasında çıkan sorunlar evliliğin idamesini zorlaştırmaktadır. Aile birliğinin bozulması, İslam dinince hoş karşılanmayan bir durumdur; bu nedenle İslam hukukunda, talâk öncesinde aile birliğinin sağlıklı, huzurlu ve mutlu bir şekilde devam etmesi için çeşitli önlemler alınması gerektiği vurgulanmıştır. Talâk, son çare olarak kabul edilmiştir. Talâk, nikâh akdinin belli lafızlarla hemen ya da gelecekte tek taraflı olarak ortadan kaldırılmasıdır. Talâk, geçmişten günümüze güncelliğini kaybetmeyen bir konudur. Bu tez çalışmasında Osmanlı Devleti'nin XVI. asırda öne çıkan şeyhülislamlardan İbn Kemal ve Ebuussuûd Efendi'nin talâkla ilgili fetvalarına yer verilmiş ve talâk sorunlarına getirdikleri çözümler değerlendirilmiştir. İbn Kemal ve Ebussuûd Efendi, talâk konusundaki meselelerin çözümünde önceki fetvaları dikkate alarak genellikle Hanefî fukahasının ictihadlarını benimsemiş olup bazı durumlarda diğer mezhep fukahasının ictihadlarına göre de hüküm verdikleri görülmüştür. Sonuç olarak iki şeyhülislamın da yaşadıkları dönemin siyasi ve sosyal yapısını göz önünde bulundurarak evlilikleri idame ettirme yönünde fetva vermeye çalıştıkları görülmüştür."
