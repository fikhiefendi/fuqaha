abstract: "Kur'ân-ı Kerîm'in farklı kıraatlerle okunması, İslam hukukunun birçok alanında olduğu gibi ahvâl-i şahsiyye hükümlerinde de önemli fıkhî görüş farklılıklarının ortaya çıkmasına zemin hazırlamıştır. Kıraat farklılıkları, âyetlerin lafız ve anlam boyutlarında meydana gelen çeşitlilik sayesinde fakihlerin farklı yorumlar geliştirmelerine ve bu doğrultuda çeşitli hükümlere ulaşmalarına imkân tanımıştır. Bu çerçevede ortaya çıkan fıkhî ihtilâflar, özellikle ahvâl-i şahsiyye ile ilgili meselelerde daha belirgin bir şekilde kendini göstermektedir. İslam hukukunda merkezi bir konuma sahip olan ahvâl-i şahsiyye; evlilik, boşanma, iddet, nesep, süt hısımlığı ve miras gibi bireyin ailevi ve şahsî durumunu düzenleyen temel bir hukuk alanını ifade etmektedir. Günümüzde aile hukuku açısından büyük önem taşıyan bu alanın, kıraat farklılıkları bağlamında ele alınması, hem klasik fıkhî birikimin daha iyi anlaşılmasına hem de güncel problemlerin değerlendirilmesine katkı sağlamaktadır. Bu ihtiyaç, çalışmanın temel hareket noktasını oluşturmaktadır. Bu çalışma; giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde çalışmanın konusu, amacı, yöntemi ve kullanılan kaynaklar hakkında bilgi verilmiştir. Birinci bölümde ahvâl-i şahsiyye, fıkıh, kıraat ve ihtilâf kavramları ele alınmış; ikinci bölümde fıkhî ihtilâfların sebeplerinden bazıları incelenmiş; üçüncü bölümde ise ahvâl-i şahsiyye hükümlerinde kıraat farklılıklarının etkisi sonucunda ortaya çıkan fıkhî görüşler detaylı bir şekilde analiz edilmiştir. Bu bölümde, örnekler ele alınırken öncelikle ilgili âyet zikredilmiş, ardından kıraat imamlarının söz konusu âyete dair farklı okuyuşları ortaya konmuş; sonrasında bu farklı okuyuşların doğurduğu fıkhî hükümler açıklanarak elde edilen sonuçlar değerlendirilmiştir."
