abstract: "Bu çalışmamızda“Arap Dili Furûk Nazariyesi Bağlamında Kur'an'da Boyun Eğme Yakınanlamlıları ve Nüansları”başlığı altında boyun eğmeye delalet eden kelimeleri ve bu kelimelerin aralarındaki farkları/nüansları ortaya koymaya çalıştık. Tarihi seyir içerisinde Kur'an'ı daha iyi anlayabilmek için Kur'an ilimleri adı altında bazı ilimler ortaya çıkmıştır. Hicri ikinci asırdan sonra çıkmaya başlayan“el-Furûk Fi'l-Luğa veya el-Furûk'ul-Luğaviyye”ilmi de, Kur'an ilimleri arasında sayılmaktadır. Furûk Nazariyeside denilen bu ilim, dilsel farklar adı altında topladığı bir grup kelimenin arasındayakınlıklar/teradüfler ve nüanslar/farklar üzerinden incelemelerde bulunan bir ilim dalıdır. Çalışmamız giriş, üç bölüm ve sonuç olmak üzere toplamda beş fasıldan oluşmaktadır. Birinci bölümde konumuzun temelini teşkil eden Furûk Nazariyesine genel bir bakış atmaya çalıştık. İkinci bölümde konumuzla alakalı olarak Kur'an'da geçen Boyun Eğme lafızları ile ilgili 42 tane kelime tespit edip bunları anlamlandırmaya çalıştık. Üçüncü bölümde bulduğumuz bu kelimelerin arasındaki farkları ortaya koymaya çalıştık."
