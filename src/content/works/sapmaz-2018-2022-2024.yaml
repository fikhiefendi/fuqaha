abstract: "Yarım asırdır süregelen bir sistem olan Katılım Bankacılığı özellikle 1970'li yıllardan yaşanan petrol krizi sonrasında pik yapmış ve hızlı bir biçimde gelişim göstermiştir. Gü-nümüzde uluslararası düzeye yayılan katılım bankacılığı sistemi ulusal finans piyasaların-da ciddi bir ağırlık kazanmış olduğu görülmektedir. Ulusal anlamda 4983 yılında Ortadoğu'da yer alan atıl sermayenin ülke sınırları içe-risine dahil edilebilme umudu ile kuruluşlarına izin verilen Özel Finans Kurumları 2000 yıllarına kadar bankacılık sektörü şeklinde ilerleyememesi nedeni ile gelişiminde %2 ra-kamını bile görememiştir. Özel finans Kurumlarının denetlenmesi ve faaliyetlerdeki yetki sorumluluklarının siyasi liderlere bağlı olması nedeni ile her zaman belirsizlik içerisinde varlık sürdürmeye çalışmıştır. Ancak 1999 yılında çıkarılan kanun ile yeni adıyla katılım Bankalarının, Bankalar Kanunu'na dâhil edilmesi ile bu kurumlara olan güven ve talebi arttırmıştır."
