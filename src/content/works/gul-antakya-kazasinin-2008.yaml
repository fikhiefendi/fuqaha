abstract: "Bu çalısmada, XVIII. yüzyılda Antakya Kazası'nın sosyal, ekonomik, idarîve demografik yapısı ele alınmıstır. Çalısma dört ana bölüme ayrılmıs olup giristeAntakya Kazası'nın tarihçesinden bahsedilmis ve kullanılan ser'iyye sicilleri vearastırma kaynakları tanıtılmıstır.Arastırmanın birinci bölümünde; Antakya Kazası'nın idarî taksimatı, kazayönetimi ve demografik yapısı incelenmistir. kinci bölümde sehirdeki sosyalhayatın bir parçası olan vakıf, hamam, medrese gibi dini ve sosyal kurumlardanbahsedilmistir. Üçüncü bölümde sehirdeki esnaf grupları, zanaat ve ticaret yerleri,para ve fiyat meseleleri ve kazada tahsil edilen vergiler konusu incelenmistir.Çalısmanın dördüncü bölümü; güvenlik ve dogal afetler baslıgını tasımaktadır.XVIII. yüzyıl boyunca kazadaki eskıyalık hareketleri ve sosyo-ekonomiksonuçlarının yanı sıra, adî suçlar olarak adlandırılan kanun dısı diger hadiselerdeincelenmis ve dogal afetler ile dogurdugu sonuçlar hakkında bilgiler verilmistir."
