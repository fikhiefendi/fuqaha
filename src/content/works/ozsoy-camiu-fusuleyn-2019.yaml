abstract: "Osmanlı Devleti'nin en hassas dönemlerinden Fetret Dönemini takiben, cereyan etmiş olan ve Şeyh Bedreddin Hadisesi ile ünlenen Bedreddin Simâvî aynı zamanda İslâm hukuku alanında önemli eserler vermiş bir ilim adamıdır. Biz bu çalışmamızda onun İslâm yargı hukukuna dair Câmiu'l-Fusûleyn adlı eserini ele alıp İslâm aile hukukuna dair görüşlerini inceledik. Klasik tarih kaynaklarında hakkında yeterli bilgi verilmemiş olması sonraki dönem çalışmalarında da problemlere sebep olmuştur. Lehte ve aleyhte birçok yorum yapılmış; ancak bu yorumların konuyu netleştiremediği aksine daha karmaşık hale getirdiği görülmüştür. El-Üsrûşenî ve el-İmâdî'nin“el-Fusûl”başlığıyla telif ettikleri iki eserin derlemesi olan Câmiu'l-Fusûleyn, Bedreddin'in özgün görüşlerini de içermektedir. Kendi görüşlerini“Ekûlü (Ben derim ki)”ve benzeri tabirlerle ifade eden Şeyh Bedreddin, bu çalışmasında her iki eseri tekrarlara girmeden birleştirmiş; zaman zaman eserlerin metinlerine dönük açıklama ya da eleştirilerde bulunmuştur. Bunun yanında genel olarak Hanefî fıkhına dair tenkit, tahriç ve tercihlerde de bulunmuştur. Onun yaptığı bu değerlendirmelere sonraki dönem Osmanlı uleması tenkit ya da savunma yaparak katkıda bulunmuşlardır. Bu çalışmada Şeyh Bedreddin'in hukukçuluğu İslam âile hukuku zemininde ele alınarak incelenmiş ve ilim dünyasına tanıtılmıştır."
