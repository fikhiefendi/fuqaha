abstract: "Zeydiyye mezhebi, ismini aldığı ve kurucusu olduğu Zeyd b. Ali b. Hüseyin'e tabi olanların mezhebidir. Zeydiyye mezhebi, itikadi ve ameli mezheplerden farklı olarak siyasi yönü ağır basan bir mezheptir. Bununla beraber gerek fıkıh gerek kelam eserlerinde Zeydîler, Zeydiyye adını kullanmışlar ve mezhebe olan aidiyetlerini özellikle belirtmişlerdir. Aynı şekilde fıkıh usulünde de Zeydîler eserlerinde kendi mezhebi aidiyetlerini açıkça dillendirmişlerdir. Başlangıcından günümüze kadar Zeydî usul eserleri incelendiğinde, emir bahsinde“emrin tekrara delâleti ve gayrimüslimlerin fürû fıkha dair emirlerden mesuliyeti”, umum-husus teorisinde“tahsisin müstakil ve munfasıl olmasının gerekmesi, tahsisin umum bildiren bir lafızdan sonra gelebilmesi”, nesih konusunda“mutlak anlamda nassa ziyadenin nesih sayılması ile te'bîd (ebedilik) lafzıyla mukayyed hükmün neshinin caizliği”ve lafzın manaya delâleti konusunda“mefhûmu'l-muhâlefenin sahih bir istidlâl yöntemi olarak kabul edilip edilmemesi”gibi fıkıh usulünün temel konuları hakkında Zeydîlerin tutumlarında ve kabullerinde dönemden döneme mezhebin geneline yayılan bir değişme görülmüştür. Bu tezde ise Zeydî usulündeki değişim, söz konusu meseleler arasından mefhûmu'l-muhâlefe bahsi üzerinden incelenecektir. Fıkıh usulünde lafzın manaya delalet yöntemlerinden olan mefhûm, lafzın, sözde zikredilmeyen manaya delalet etmesini ifade eder. Mefhûm, lafızda doğrudan ifadesi bulunmayan mananın lafızda ifade edilen manaya uygun düşmesi itibariyle mefhûmu'l-muvâfaka ve bunun aksine uygunluğun bulunmadığı durumda mefhûmu'l-muhâlefe olmak üzere ikiye ayrılır. Dil çalışmalarında“karşıt kavram kanıtı”olarak bilinen mefhûmu'l-muhâlefenin insan sözünde delil olması itibariyle usulcüler arasında bir ihtilaf olmamakla beraber dini naslarda delil olup olmaması hakkında mezhepler arasında ihtilaf bulunmaktadır. Şafiî, Malikî, Hanbelî mezhepleri genel olarak mefhûmu'l-muhâlefeyi dikkate alınması gereken geçerli bir anlama biçimi olarak kabul ederken Hanefî ve Mutezile mezhepleri bunu fasit bir delil sayarlar. İstisnaları olmakla beraber bir müellifin mefhûmu'l-muhâlefe hakkındaki görüşleri o müellifin hangi mezhebe daha yakın olduğu hususunda bilgi vermesi açısından ayırt edici konulardan biridir. Bu sebeple Zeydî usulünde zaman içindeki değişimin tespit edilmesi ve başka mezheplerin anlayışlarıyla mukayesesi bakımından mefhûmu'l-muhâlefe konusu, araştırmada esas alınabilecek bir alan olarak karşımıza çıkmaktadır. Bu tezde öncelikle Zeydî usul kitaplarında mefhûmu'l-muhâlefe bahsinin nasıl kurgulandığı ve hangi dönemlerde bunun sahih bir delil yöntemi olarak kabul edilip hangi dönemlerde kabul edilmediği tespit edilmiştir. Ayrıca mukayese amacıyla Hanefî, Malikî ve Şafiî usulcülerin aynı dönemdeki eserleri incelenerek bu eserlerde mefhûmu'l-muhâlefe konusunun sahih bir delalet yöntemi olarak kabul edilip edilmediği gözden geçirilmiştir. Son olarak Zeydîlerin zamanla usul anlayışlarında ortaya çıkan bazı değişimler üzerinde sahip oldukları sosyal ve siyasi ortamların etkileri üzerine birtakım değerlendirmeler yapılmıştır. Tezin temel hedefini oluşturan mefhûmu'l-muhâlefe üzerinden Zeydî usulünün geçirdiği değişimleri tespit etmek, Zeydîleri usulde değişime götüren sosyal sebepleri anlamak bakımından önemli ipuçları barındırmaktadır."
