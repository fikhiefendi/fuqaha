abstract: "Bu çalışma, Kur'ân'ı Kerîm'in 30. sûresi olan Rûm sûresini, Sünnî ve Şiî kaynaklar bağlamında karşılaştırmalı olarak tefsir etmeyi amaçlamaktadır. Çalışma giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezin konusu, amacı, sınırları, uygulanan yöntem ve teknikler ortaya konmakta, konuyla alakalı daha önce yapılan çalışmalar tasnif edilerek maddeler halinde sıralanmaktadır. Birinci bölümde mezhep ve mezhebi tefsirin tanımı yapılmış, mezheplerin ortaya çıkış sebepleri ele alınmıştır. Mezhebe mensubiyetin tefsire yansımaları ele alınarak değerlendirilmiştir. İkinci bölümde ise; belirlenen tefsirler çerçevesinde Rûm sûresi kendi içinde anlam bütünlüğü olan pasajlara ayrılarak bölümler oluşturulmuştur. Bu bölümler içinde âyetlerin ihtiva ettiği konulara göre başlıklar oluşturulmuştur. Belirlenen Sünnî ve Şiî tefsir kaynaklar dikkate alınarak âyetler karşılaştırmalı olarak işlenmiş, aralarındaki benzerlik ve farklılıklar ortaya konmuştur."
