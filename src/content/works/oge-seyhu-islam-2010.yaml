abstract: "İbn Kemal Osmanlı devletinin en ünlü alimi ve şeyhü'l-islamıdır. O, Osmanlı devletinin yükselme dönemlerinde yaşamıştır. Dönemine damgasını vuran olaylarda yer almıştır. Hem alim hem de askeriyeye mensub bir aileden gelmiştir. Önce askeriyeye sonrada ilmiye sınıfına geçmiştir.300 e yakın eser kaleme almıştır. Çok çeşitli ilim dallarında eser yazmıştır.Özellikle ehl-i sünneti savunmuştur. Bu savunma özelliğini en çok yansıtan olaylar: Şah İsmail'le olan mücadelesi, Molla Kabız hakkında verdiği hükümler ve daha çok asıl mecrasından çıkmış olan sûfilerle olan mücadelesidir. İbn-i Arabi hakkında verdiği fetva tasavvufa tamamen karşı olmadığının delilidir. Peygamberimizin üstünlüğü ve anne-babasıyla ilgili görüşleri yaşadığı dönem dini ve sosyal olayları hakkında bize ipuçları vermektedir.Orijinal görüşleri de vardır. Haşir inancıyla ilgili 7 li görüşü İzmirli tarafından da kabul edilmiştir.Klasik ulemanın yolundan ayrılmayan İbn Kemal sentezci bir alim olarak bilinmektedir. Öldüğünde hem İstanbul'da hem de İslam aleminde gıyabi cenaze namazları kılınmıştır."
