abstract: "Gayrimüslim devletlerde yaşayan müslümanların dini sorunları modern dönemlerde kazâî yönleriyle birlikte kimi açılardan yeni ve farklı bir şekilde ele alınmaya başlanmış ve bu doğrultuda oluşan özel başlığa“Müslüman azınlıklar fıkhı”(fıkhü'l-ekalliyyâti'l-müslime) adı verilmiştir. Bu çalışmada ilk olarak Müslüman azınlıklar fıkhının tanımı, kapsamı ve dayanakları etrafında ortaya çıkan muhtelif tartışmalar ele alınacak; konuyla ilgilenen günümüz fıkıh bilginlerinin görüş ve yaklaşımları belli bir plan dâhilinde sunulacaktır. Ardından söz konusu tartışmaların Balkanlardaki tezahürleri incelenecek ve bu alanda söz sahibi addedilen Balkan coğrafyasından üç düşünürün konuya yaklaşımları ele alınacaktır. Çalışma, Balkan Müslümanları açısından azınlık kavramının ne anlama geldiğini ve azınlık fıkhı kapsamında ne tür problemlerin yaşandığını teorik ve pratik veçheleriyle ele almaktadır."
