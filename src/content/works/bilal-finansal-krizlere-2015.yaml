abstract: "Özellikle 1980'li yıllardan sonra başlayan küreselleşme hareketlerine paralel olarak artan finansal serbestleşme hareketleri, finansal sistemin yapısını önemli ölçüde değiştirmiş ve geliştirmiştir. Finansal sisteme yeni fon kaynakları ve yatırım araçları dâhil olurken, finansal kurum ve kuruluşların da yapısı farklılaşmıştır. Yaşanan bu değişim ve gelişmelerle birlikte, ekonomilerde yaşanan krizlerin karakteri farklılaşmış, yayılma hızları artmış ve etkileri derinleşmiştir. Bu bağlamda, finansal piyasalarda faize dayalı finansal yapıyı tercih etmeyen İslami kesim tarafından kullanılan ve faizsiz finansal sistemde yaygın şekilde kabul gören faizsiz ürünler, diğer ekonomiler tarafından da büyük ölçüde rağbet görmektedirler. Bu araştırmada, finansal piyasalarda yaşanan gelişmeler, değişen finansal yapı, yeni finansal sistemin getirdiği riskler ve yaşanan finansal krizler ortaya konmuştur. Yaşanan değişime bağlı olarak, faizsiz finansal yapının yeni finansal sistemdeki yeri değerlendirilmiş, sukuk özelinde faizsiz finansman araçlarının rolü ve krize karşı bir önlem olarak ele alınıp alınamayacağı tartışılmıştır. Ayrıca çalışma da vak'a çalışması yaklaşımı yöntemi uygulanmıştır."
