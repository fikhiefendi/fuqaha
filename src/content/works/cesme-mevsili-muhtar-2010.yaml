abstract: "Çalışmamızda el-Mevsılî'nin el-Muhtar adlı eserinde İmam Züfer'e ait görüşleri tahkik etmeye ve müellifin eserde yer vermediği Züfer'in ihtilafına dair görüşleri vermeye çalıştık. Tezimizde 202 mesele ele almış olup, bunların 67 tanesi müellifin işaret ettiği meselenin tahkiki, 135 taneside el-Mevsılî'nin yer vermediği fakat Züfer'in muhalefetinin bulunduğu meselenin incelenmesidir.Yaptığımız çalışmanın neticesinde el-Mevsıli'nin Züfer'in görüşlerine işaret ettiği meselelerde isabet ettiğini tespit ettik. Ayrıca çalışma esnasında, el-Muhtar metni dışında birçok Züfer görüşünün kaldığı görülmüş, Züfer'e ait ictihadların tamamının tespit edilip derlenmesi şeklinde bir çalışmanın faydalı olacağı kanaatine varılmıştır."
