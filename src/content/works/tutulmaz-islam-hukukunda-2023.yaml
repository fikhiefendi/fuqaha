abstract: "Çalışmamız, İslam hukuku çerçevesinde sigaranın hükmü üzerine yapılan tartışmaları ve bu bağlamda Ahmed Âdanavî'nin“Risâletun fî Şürbi'd-Duhân”adlı risalesini konu edinmektedir. Çalışmamız bir giriş, iki bölüm, sonuç ve ekler kısmından meydana gelmektedir. Giriş kısmında çalışmanın konusu, önemi, amacı, yöntemi ve kaynakları hakkında genel bilgiler verilmiştir. Birinci bölümde sigara ve tütün mamullerinin sağlığa etkileri, anayasa, kanun ve diğer mevzuatlarda sigaraya yönelik alınan tedbirler, anayasal hükümler, kanun metinleri ve yönetmelikler ele alınmıştır. Ayrıca İslam hukukunda sigara ve tütün üzerine yapılmış lisansüstü tez ve makale gibi akademik çalışmalar, Osmanlı döneminde sigara ve tütün üzerine yazılmış risaleler ile diğer İslam ülkelerinde yapılmış olan çalışmalar incelenmiştir. İkinci bölümde İslam hukukunda sigaranın hükmü üzerine yapılan tartışmalar incelenmiştir. Bu bağlamda sigaranın mübah/helal olduğunu savunanların, mekruh olduğunu ileri sürenlerin ve haram olduğunu söyleyenlerin görüşleri ele alınıp incelenmiştir. Ayrıca Ahmed Âdanavî'nin“Risâletun fî Şürbi'd-Duhân”adlı risalesi tercüme edilip değişik yönlerden analiz edilmiştir. Sonuç kısmında ise İslam hukukuna göre sigara ve tütün mamullerinin kullanımı hakkında ortaya konulan görüş ve düşüncelerin hülasası verilmiştir."
