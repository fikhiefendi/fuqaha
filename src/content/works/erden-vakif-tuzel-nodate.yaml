abstract: "Bu çalışmada, vakıf adına istidânenin Osmanlı hukukunda nasıl uygulandığını ve modern hukukla nasıl ilişkilendirilebileceği araştırılmıştır. Çalışmanın amacı, vakıf adına istidânenin Osmanlı hukukundaki konumu, işleyişi ve sonuçlarını incelemek, kişi ya da mal topluluğunun tüzel kişilik kabul edilmesi için son derece önemli olan borçlanma ehliyeti açısından Osmanlı vakıflarının tüzel kişiliğini değerlendirmektir. Bu çalışma, Osmanlı vakıf hukuku ile modern hukuk açısından yeni bir bakış açısı sunmakta, vakıf adına borçlanmanın, XIX. yüzyılda ortaya çıkmış tüzel kişilik ile ilişkisini ortaya koymaktadır. Çalışmanın kapsamı XVI.-XVIII. yüzyıllardır. Çalışmada, başta fetva mecmuaları ve kadı sicilleri olmak üzere istidâne ile ilgili pek çok kaynak incelenmiş ve tüzel kişilik hakkında çok sayıda kaynak analiz edilmiştir. Çalışmanın bulgularına göre vakıf adına istidâne, Osmanlı hukukunda teoride yer bulan ve pratikte sıkça karşılaşılan bir uygulama olup vakıfların hayatta kalabilmeleri için gerekli mali kaynağı sağlamada son derece kritik bir rol oynamıştır. Tüzel kişilik sahibi vakıflardan farklı olarak, Osmanlı vakıflarının bağımsızlık vasfı ve borçlanma yeteneği bulunmamaktadır. Ayrıca, tüzel kişilikleri olan vakıfların aksine, Osmanlı vakıflarında, mütevelli tarafından gerçekleştirilen borç doğuran hukuki işlemler ve görev sırasında meydana gelen haksız fiillerden vakıf değil mütevelli sorumludur. Ancak, gerçek kişilere ait bazı özellikleri taşıması nedeniyle, Osmanlı hukukunda vakıfların, insan dışı varlıklardan farklı, nevi şahsına münhasır bir varlık olarak kabul edildiği söylenebilir."
