abstract: "ÖZET YÜKSEK LİSANS TEZİ İSLAM HUKUKU AÇISINDAN NİŞANLANMA Hüseyin ERTUÇ Danışman: Mustafa BAKTIR 1999 - Sayfa: 109 Jüri: Prof. Dr. Mustafa BAKTIR Toplumu meydana getiren en küçük sosyal birlik ailedir. Bu sosyal birlik ise evlenme ile oluşmaktadır. Evlenme de bir kurum olarak bir çok hazırlığı gerektirir ve bu anlamda yapılan en önemli hazırlıklardan biri de nişanlanmadır. Şüphesiz ki, bütün bu hususlar aynı zamanda hukuk ile de ilgilidir. Zira hepsi de bir takım hukuki düzenle meleri gerekli kılmaktadır İslam hukuku açısından da durum aynıdır. Burada da gerek evlilik, gerek nişan lanma olsun her iki konu da aile hukuku çerçevesinde bir değerlendirmeye tabi tutul muştur. Böylelikle başlangıçta hıtbe olarak bilinen bu mesele daha sonra İslam aile hu kukuna dahil olmuştur. Bu hukuki konunun toplumumuzda hiç şüphe yok ki son derece önemli bir yeri vardır. Çünkü nişanlanma aynı zamanda sosyal bir faaliyettir. Evliliğe bir ön hazırlık olduğu için de çeşitli sebeplerle sona ermesi de mümkündür. Bu durumda da pek çok problem yaşanabilmektedir. Bilhassa tek taraflı olarak nişanın bozulması durumunda mehir, hediyelerin iadesi, maddi ve manevi tazminat gibi meseleler büyük önem taşı maktadır. Biz de bu çalışmamızda İslam hukuku açısından bu hususları incelemeye gayret ettik. Burada çeşitli mezheplerin görüşlerine yer vererek ve zaman zaman da diğer hu kuk sistemlerine atıfta bulunarak bir mukayese yapmaya özen gösterdik. Böylelikle so nuçta, konunun araştırılabilir pek çok yanının olduğuna dikkat çekmeye çalıştık."
