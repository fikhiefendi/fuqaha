abstract: "Gerek yerel Afganistan gerek dünya ve gerekse Türkiye basınında, ayrıca sosyal medyada, Afganistan ülke sınırları içerisinde zina fiiline yönelik olarak uygulanan recm cezaları popüler bir tartışma konusuna dönüşmüştür. Bu yüzden zina fiiline yönelik olarak tatbik edilen Afganistan uygulamalarının ele alınması önem arz etmektedir. Nüfusunun geneli Müslümanlardan oluşan bir İslâm ülkesi olan Afganistan'da çıkarılan kanunlar, Hanefî metinleri temel alınarak hazırlanmaktadır. Dolayısıyla Afganistan sınırları içerisinde zina fiiline uygulanan cezaların, düzenlenen kanunlara ve Hanefî fıkhına uygunluğu ve ne şekilde uygulandığı oldukça mühimdir. Çalışma, Afganistan devleti sınırları içerisinde zina cezasına yönelik uygulamaların bir bütünlük ve sistem içerisinde olup olmadığı, farklı uygulamalar var ise bu uygulamaların kanunî dayanağı, kaynağı ve kanunların hazırlanma süreçleri üzerinde durmaktadır. Dolayısıyla bu tez Afganistan'da uygulanan recm cezalarının, devlet otoritesinin güçlü olduğu bölgeler ile zayıf olduğu bölgelerde nasıl, ne şekilde ve hangi kriterlere göre uygulandığını ve bu uygulamanın Afganistan'da genel kabul görmüş Hanefî mezhebinin ilkeleri ile mukayesesini içermektedir."
