abstract: "Bu tezin merkezini oluşturan 420 numaralı Siirt Şer'iyye Sicil Defteri, şer'î mahkemelerin yargı alanının daraltıldığı bir dönemin (1312-1317/1894-1900) şer'î mahkeme kayıtlarıdır. Defterin başlıca konuları öncelikle aile ve buna bağlı olarak, boşanmalar, nafaka ve mehir talepleri, verâset ve yine buna bağlı olarak tereke ile eytâm sadıkları ve eytâm idâreleri vâsıtasıyla yetim çocukların para ve mallarının korunması, çocukların vasîler kontrolünde büyütülmesi gibi konuları içermektedir. Defterde bir vakfiye kaydı bulunmaktadır. Ancak çeşitli vesileler ile bahsi geçtiği için idârî yapı üzerinde de duruldu. Defterdeki verilerden yola çıkarak, Siirt'teki aile yapısı ve çocuk sayısı bulunmaya çalışıldı. Mahkemenin işleyişinden dolayı, şer'î mahkeme görevlileri anlatıldı. Mahalle imâmları öncelikli olmak üzere imâmlar, muhtarlık teşkilâtı; muhtar ve ihtiyâr hey'etlerinin önemine işâret edildi. Defterde bahsi geçtiği kadar Siirt gayr-ı Müslim cemâatlerine temas edildi. Tereke kayıtlarına istinâden, Siirt'te, bu tarihlerde görülen mal ve eşya fiyatları tesbit edildi. Yine defterdeki muhtelif kayıtlardan yola çıkılarak, Siirt evleri üzerinde duruldu. Tezimizde özellikle dikkat ettiğimiz husus, kişi ve kurumların öne çıkarılmaya çalışılmasıdır."
