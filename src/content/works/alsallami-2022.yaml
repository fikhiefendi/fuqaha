abstract: "Bu tez sayesinde, parasal değişimler ışığında borca ve borçla tefecilik enflasyonu arasındaki ilişkiye ışık tutulmuştur. Din ve dilde ve deyimsel olarak dinin ne olduğu konusuyla başladığımız yerde, İslam'ın dine bakış açısını ve tefsirini Kuran-ı Kerim ayetlerine ve hadislere göre ele aldığımızda; Dini meşrulaştırır ve tefeciliği yasaklar. Daha sonra sahabe ve müritlerin görüşlerini aldık. Araştırmamızın birinci bölümünde de görüldüğü gibi, faizi, faizin tanımı, batıllığı ve İslam'da yasaklanması konuları da Kur'an-ı Kerim ayetleriyle desteklenerek faizin yasaklandığını belirtmek için ele alınmıştır. İslam fıkıh âlimlerinin görüşlerine göre tefecilik ve bunun toplum ve Müslümanlar üzerindeki etkileri ile ilgili konuları fıkıh alimlerinin görüşlerine göre kredi ile kredi çekerken ele aldık. Daha sonra ikinci bölümde para ve bankalar konusunu ve banka kredisi verirken bankalarda tefecilikten paranın nasıl etkilendiğini ve toplumun ilgilendiği para türlerini, İslami banka ve bankaları ve diğerlerini ekonomik açıdan ele aldık. krediler ve kredilerdeki paraya yüklenen kâr yüzdesi. Üçüncü bölüm, İslami olmayan bankaların yanlış finansal işlemlerle zengin olmaya çalıştıklarında, kredinin geri ödenmesi durumunda piyasada ve toplumda enflasyona veya durgunluğa neden olan bankalarda tefeciliğin geliştiği finansal enflasyonun gerçek önemini açıklamaktadır. Tevbe Suresi, 00. ayet ve zekat ihtiyacı olanlara göre sekiz tip insandan , yani bankalardan alınan borç zekat parası o zaman araştırma sonunda ve özette bahsettiğim şeye göre banka faiz oranı ona uygulanır.Aksine bankanın şirkete kredi veren grafiği yükseliyor, çünkü banka Sermaye şirketleri ile arasındaki ortaklığa göre giriyor ve burada bankanın sürdürülebilirlik hedeflerine ulaşmak için şirketlere ve fon sahiplerine koyduğu bankacılık faizinde yükselen bir grafiğe göre değişen kârlar var. bankaların ana ortağıdır. İslami bankalara yatırılan zekat parasıdır ve konu İslami bankaların bu para üzerinde çalışanlar arasında hak sahibi olmalarıdır Tevbe Suresi 00. ayet."
