abstract: "“Ebû İshâk Şirazî ve Usûlcülüğü”ismini taşıyan bu tezde Şafiî mezhebinin önde gelen âlimlerinden biri olan Şirazî'nin fıkıh usulüne dair görüşleri ve fıkıh usûlünde takip ettiği yöntem konu edinilmiştir. Bir giriş ve üç bölümden oluşan tezin birinci bölümünde Şirazî'nin hayatı, hocala-rı, öğrencileri ve eserleri yanında onun yaşadığı siyasî ve ilmî ortam ele alınmıştır. İkinci bölümde ise Şirazî'nin usûl-ü fıkha dair görüşleri kapsamında Şafiî mezhebi içerisinde ihtilaflı meselelerde tercihleri, değer verdiği ve atıfta bulunduğu âlimler, tenkit ettiği mezhepler ve görüşler zikredilmiştir. Şirazî'nin usûl düşüncesinin temel özellikleri adını taşıyan son bölüm ise, onun usûlde takip ettiği yöntem, Tabsıra ve Lüma'daki farklı gö-rüşleri, usûl konularının tasnifinde benimsediği yöntem, hangi metodla usûl eseri yazdığı gibi konulardan oluşmaktadır."
