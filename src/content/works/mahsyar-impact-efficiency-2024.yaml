abstract: "İmalat sektörünün faaliyetleri iklim değişikliği sorunlarına katkıda bulunmaktadır. Paydaşlar, insan olarak sorumlulukları olduğu için sorunların ele alınmasına aktif olarak katılmalıdır. Bu araştırma tezi, eko-verimliliğin firma değeri üzerindeki etkisini araştıracaktır. Çalışma, eko-verimlilik uygulamasının 2013'ten 2022'ye kadar Endonezya şeriat hisse senedi endeksinde listelenen imalat şirketlerinin firma değerine doğrudan etkisini gözlemlemeyi amaçlayacaktır. Çalışmada ılımlı regresyon analizi kullanılacak, ılımlı değişkenler olarak kaldıraç, karlılık ve bu araştırmanın yeni yönü olarak yaş kullanılacaktır. Sonuçlar, eko-verimliliğin firma değeri üzerinde negatif bir etkisi olduğunu göstermektedir. Ayrıca, kaldıraç eko-verimlilik, firma değeri arasındaki ilişkiyi güçlendirebilirken, karlılık bu ilişkiyi zayıflatabilir. Bu çalışmanın sonucu, şirket paydaşlarının eko-verimliliğin etkinliğini ve verimliliğini artırmak için eko-verimlilik uygulama stratejisini yeniden değerlendirmeleri gerektiğini göstermektedir. Bu, ISO 14001'in uygulanmasında bir değerlendirme sürecinin varlığı göz önüne alındığında özellikle önemlidir. Ayrıca, hükümetin özellikle Endonezya'da çevreyi en çok kirleten şirket için sürdürülebilir iş politikalarını sıkı bir şekilde uygulaması zorunludur."
