abstract: "İslam hukukunun aşamalı bir şekilde geliştiğini söylemek mümkündür. Zira hicri ikinci ve üçüncü dönemlerde yaşayan âlimler/müctehidler, karşılaştıkları problemleri zamanının verileri ve ilmi anlayışlarıyla çözmeye çalışmış ve bir metot ortaya koymaya gayret etmişlerdir. Ancak her bir fakih, şahsına münhasır bir anlayışa sahip olduğu için vakaları farklı şekillerde değerlendirmiş ve doğal olarak birbirleriyle ihtilaf etmişlerdir. İslam Hukuk tarihinde Ehl-i Hadis ve Ehl-i Re'y ekollerinin oluşması, bu ihtilafın sonuçlarından birisidir. Ehl-i Medine'nin imamı ve temsilcisi Malik b. Enes (ö.179/795) iken Ebû Hanîfe (ö.150/767) de Re'y ekolünün imamı ve temsilcisi kabul edilmektedir. Bu çalışmada mezkûr fakihlerin yetiştirdiği en önemli talebelerden İmam Muhammed eş-Şeybânî (ö.189/805) ile İmam Şâfiî'nin (ö.204/820) birbirleriyle ilişkileri ve karşılıklı eleştirileri ele alınmaktadır. Tarafların İmam Malik'ten ders görmeleri ve Şâfiî'nin İmam Muhammed'e talebelik yapması gibi hususlar iki fakihin müstakil olarak ele alınmalarını yararlı hale getirmektedir. Çalışmada iki fakihin eleştirileri üzerinde bir okuma ve anlama amaçlanmıştır. Tez, giriş ve iki ana bölümden oluşmaktadır. Girişte konunun başlığı, amacı, önemi ve yöntemi hakkında bilgilerin yanı sıra ihtilafa, ekollere dair de muhtasar olarak bilgi verilmiştir. Tezin birinci bölümünde tarafların eleştirilerini daha iyi anlama adına, onların biyografilerine, usûl anlayışlarına ve birbirleriyle etkileşimlerine yer verilmiştir. Ayrıca bu bölümde İmam Muhammed'in Ehl-i Medine âlimleriyle yakınlığı ve etkileşimi sonucunda onlar gibi veya benzer şekilde mütalaa ettiği meselelere de yer verilmiştir. İkinci ve son bölümde ise, tarafların münazaraları, İmam Muhammed'in Ehl-i Medine fakihlerine eleştirileri ve İmam Şâfiî'nin bunlara cevabı ile hocasına yönelttiği eleştiriler irdelenmiştir."
