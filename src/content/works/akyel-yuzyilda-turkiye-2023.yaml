abstract: "İctihad kapısının açık ya da kapalı olmasıyla ilgili tartışmalar asırlar öncesine dayanmış olsa da meselenin en üst düzeyde tartışılmaya başlaması 19. yüzyıl sonlarından itibarendir. Bir kısım İslâm âlimine göre ictihad kapısı kapalıdır, bazılarına göre ise ictihad kapısı kıyamete kadar açıktır. İşin özünde bazı istisnalar hariç, tarafların büyük çoğunluğu ictihad kapısının kıyamete kadar açık olduğu konusunda hemfikirdir. Ancak günümüzde ictihad yapılamayacağı iddiasında bulunanlar ictihad şartlarının oluşması konusunda birtakım çekinceler ileri sürmüşlerdir. Bu düşüncede olanlarla ictihadın devamını savunanlar arasında söz konusu yaklaşımlara bağlı olarak cereyan eden bazı tartışmalar olagelmiştir. Elbette ülkemizde yetişen âlimlerimizde bu tartışmalara duyarsız kalmamışlar ve konuyla ilgili lehte ve aleyhte görüş bildirmişlerdir. Çalışmada, 20. yüzyıl başlarından günümüze kadar geçen süre içerisinde, Türkiye'de ki İslâm âlimlerinin, ictihad kapısının açık ya da kapalı olmasıyla ilgili görüşleri yansıtılmış ve değerlendirilmiştir."
