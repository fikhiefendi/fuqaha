abstract: "Faiz, insanlığın para kazanmaya başladığı ilk çağlardan beri gündemde olup çokça tartışılmıştır. Dini, sosyal, ekonomik ve hukuki boyutlarıyla tarihin hemen hemen her döneminde farklı uygulamalara konu olmuştur. Yasal anlamda ilk defa Hammurabi Kanunlarıyla sınırlamalara tabi tutularak, faizsiz ekonomik araç haline getirilmiştir. Bu tez, faizin ve faizsiz finans sisteminin toplumlarda yarattığı yaygın etkiyi ve gerekliliği ortaya koymak amacıyla kaleme alınmıştır. Faizsiz küresel bir ekonomi mümkün müdür sorusundan hareket edilmektedir. Buna göre çalışmanın kapsamı, iki ana araştırma konusu üzerine oturtulmaktadır. İlkini tarihi süreçte kapitalizmin ve para kazancı olarak faizin gelişimi oluşturmakta iken ikinci ana bölümü faizsiz finans uygulamaları oluşturmuştur. Bu çerçevede, faizin ve kapitalizmin gelişimi, Osmanlı ve Türkiye'deki uygulamalar, İslami bankacılığın geleneksel bankacılıktan ayrılan özellikleri, İslami finans yöntemlerinden beklenen faydalar, İslami Bankacılığın tarihi, nasıl mütevazi ölçekte başlayarak nasıl uygulanabilir ve verimli kurumlar haline geldiği açıklanmaktadır. Faizsiz enstrümanları kullanan ülkelerin bu alandaki sektör payları ve gelişimleri, karşılaştırma ve betimleyici yöntemler kullanılarak niteliksel araştırmalarla desteklenmektedir. Tez araştırma yöntemi olarak nitel araştırma yöntemleri kullanılmıştır. Literatür taramasına başlamadan önce, İslam ekonomisi altındaki faizsiz finans sektörünün yaygınlaşmasının, başta kapitalizmin gücü ve faizin yaygınlığı karşısında hiç şansı olmayacağı düşüncesi akla gelebilmektedir. Fakat çalışma sonuçlandırıldığında görülmektedir ki faizsiz sistemler, pek çok faizli ve faizsiz oluşumlarla birlikte ekonomilerde yer almış ve küresel olarak kendine büyümekte olan bir alan açmıştır. Faiz de alternatifleri karşısında vazgeçilebilir/alternatif bir araç haline gelmiştir. Bu tez, İslami Bankacılığın artık Uluslararası düzeyde iyi kurulduğunu, ülkelerin teorik ve pratik verileri, piyasa paylarının artışı üzerine sonuçlandırmış bir çalışmadır. Teorik çerçevede ilerleyen İslam ekonomisi alanı, yapılan çalışmalar ve sonraki dönemlerde sayısı artırılacak simülasyon çalışmaları ve piyasa uygulama sonuçlarıyla, ampirik (deneysel) literatür kıtlığından çıkarılmaktadır. Literatür taramalarında gelinen aşamada artık İslami finansın, teori ve modern deneyselliğin harmanlandığı çalışmalarla ele alındığı görülmektedir. İslam iktisadı ve finansı, akademik çevrelerce temel bir disiplin olarak kabul görmeye başlamıştır. Avrupa'da faizsiz bankacılık ve İslam ekonomisi alanında sayısı artırılmış pek çok akademik çalışmaya rastlanırken, Türkiye'nin, alanda uzmanlaşmış insan ihtiyacı ve özellikle son yirmi yılda literatüre katkı sağlamaya başladığı halde akademik çalışma sayısının halen yetersiz bulunduğu görülmüştür."
