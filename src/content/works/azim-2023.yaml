abstract: "İtibaru'l meal terim olarak ilk defa İmam Şâtibi ile ortaya çıkmıştır. Konuya dair çeşitli bilgileri toplayarak önemini ortaya koymuş ve bunun üzerine önemli usül kaideleri inşa etmiştir. Birçok alim ve araştırmacı da nevazil ve yeni ortaya çıkan durumlar için hüküm ortaya koymak için bu usulü ayetlerle desteklemişlerdir. Ancak bu konu, bir surenin tamamı bağlamında ele alınmamıştır. Bu çalışma, iki bölümden oluşmaktadır. İtibaru'l meal'i usül olarak tarif eden, usül kaidelerini ve makasıdı Kur'an-ı Kerim'in tefsiriyle açıklayan teorik bölüm ile Ahzab Suresi'nin tamamında surenin bazı anlam ve makasıdı üzerine eğilerek İtibaru'l meal'i araştıran ve ortaya koyan uygulamalı bölüm. Çalışmanın sonunda, İtibaru'l meal'in, hüküm verilirken fiilin sonucuna bakılması olduğu, Şeriat'ın akla uygunluğu ve hikmetiyle alakalı usül kaidelerinin olduğu ortaya konmuştur. Ayrıca Kur'an-ı Kerim'in hükümleri, akaidi, ahlakı ve kıssaları büyük hikmet ve maksatlara sahiptir. Makasıd ilmiyle ilgilenen alimler bunları ortaya koymuş ve bunların ışığında Kur'an-ı Kerim'i tefsir etmişlerdir. Kur'an-ı Kerim'deki makasıdullahı açıklamaya önem vermek, hükümlerindeki itibaru'l meali incelemek, evlat edinme ve zıharın haram kılınması, örtünmenin farziyeti ve Ahzab Suresi'nde geçen diğer benzeri konularda teşrideki maslahat yönlerini açıkça ortaya koymakta, insanların kafa karışıklığını giderip Allah'a mutmain bir şekilde ibadet etmelerini sağlamaktadır. Çalışma, bu hususlar ile Kur'an-ı Kerim'in tefsirinde açık ve büyük bir etkisi olan usül kaidelerini de ortaya koymaktadır. Bu usül kaideleri, lafızların anlamları ve delaletlerini birleştirmiş, hikmetlerini ve istinbatlarını ortaya koymuş, makasıdullahı korumak için müfessiri ve müctehidi sınırlandırmış, Kur'an-ı Kerim'deki lafızların anlamlarının, suistimal edilmekten ve tahrif edilmekten korunması konusunda yardımcı olmuştur."
