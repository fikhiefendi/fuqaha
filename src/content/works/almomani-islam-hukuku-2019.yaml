abstract: "Bu tezde İslam hukuku içerisindeki hicret göç ve iltica kavramlarını inceleyerek Hicretin sadece bir yer değişikliği olmadığını aynı zamanda imanla iç içe girmiş bir kavram olduğunu ortaya koyduk. Bununla beraber göç ve iltica kavramlarının hicretten farklı olarak çeşitli sebeplerle iltica edenleri himayeye yönelik modern kavramlar olduğunu izah ettik. Böylece günümüz Müslümanlarının birçoklarının zihninde oluşmaya başlayan Hz. Peygamberin devrinde gerçekleşen hicret gibi günümüzdeki göç ve iltica olaylarının hicret sayılıp sayılmayacağına dair sorulara cevap arayarak hicretin doğru yorumunu ortaya çıkarmaya çabaladık. Bu esnada Hicret ve iltica kavramlarına yönelik İslam fıkıh mezheplerinin görüşlerini ortaya koyarak değerlendirdik. Gayri müslim ülkelerde Müslüman olup hicret etmeyenler meselesini fıkhi yorumlar ışığında ele aldığımızda fıkıhçıların gayri müslim ülkelerde ikamet süresinin uzaması sonucunda oluşabilecek sorunlar üzerinde durduklarını tespit ettik. Gayrı müslim bir ülkeye göç etme konusunda ise kişinin kendi canı malı ve sair hususlarda endişe ediyor ve bundan başka bir çıkış yolu bulamıyorsa ve yine müslim bir ülkeden müslim bir ülkeye iltica edilemediği takdirde ancak o zaman mümkün gördüklerini tespit ettik. Tez üç bölümden oluşmuştur. Birinci bölümde hicret göç ve iltica kavramları incelenmiş aralarındaki uyum ve uyumsuzluklar gösterilmiştir. Günümüzde hicret ve iltica kavramları etrafında seyreden güncel tartışmalara cevap aranmıştır. İkinci bölümde hicretin meşruiyetine dair deliller ortaya konularak ekonomi, eğitim, ırkçılık gibi sebeplerle meydana gelen göçlerin üzerinde durularak sınıflandırılması yapılmıştır. Üçüncü bölümde ister gayri müslim isterse müslim bir beldeye hicret edenlerin durumları ele alınarak değerlendirilmiştir."
