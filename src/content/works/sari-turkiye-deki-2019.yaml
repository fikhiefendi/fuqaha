abstract: "Türkiye'de Katılım Bankacılığı sistemi ilk olarak 1983 yılında özel finans kurumları adıyla faaliyet göstererek finansal sistem içerisindeki yerini almıştır. Gelecek yıllarda yapılan dü-zenlemeler ile gelişen katılım bankacılığı, günümüzde finansal sistem içerisinde çok büyük öneme sahiptir. Muhafazakâr, faiz hassasiyeti olan kesimin atıl durumda bulunan fonlarını ekonomiye kazandırmak, İslam ülkeleri ile olan ticareti canlandırmak, finans sistemi içeri-sindeki bankacılık faaliyetlerini çeşitlendirmek gibi birçok önemli faaliyeti olan katılım ban-kalarının gelişimi ve güçlenmesi için performanslarının belirlenmesi büyük önem arz et-mektedir. Çalışmamızda 2010-2017 yıllarında Türkiye'de faaliyet gösteren katılım banka-larının VZA Window yöntemi ile performans değerlendirmesi yapılmıştır. Katılım bankacılığı sektörünün 2010-2017 yılları arasında belirlenen girdi ve çıktı kümeleri üzerinde etkinlik skorları belirlenerek yapılan değerlendirmede görülmüştür ki; bankaların verimliliği her yıl farklılaşmaktadır. Bu durum, bankaların uyguladığı yönetim ve finans programları ile doğrudan alakalıdır. Çalışmamız değerlendirmesine göre katılım bankaları elde ettikleri fonlarla etkin ve verimli faaliyette bulunmak için bilanço verilerine göre yapılan performans değerlendirmelerini dikkate almalı, şube sayısı artırımı, personel sayısı, öz kaynak, toplam aktiflerdeki artırımları net kar ve toplam kredi verimliliklerine göre, etkinliği kaybetmeyecek seviyede yapmalıdır. Katılım bankalarının yatırım araçlarını çeşitlendirmesi, şube ve per-sonel sayısı artırımı, toplam aktif ve kredileri arttırarak kar odaklı faaliyet sürdürmesinin etkinliği sağlayacağı görülmüştür."
