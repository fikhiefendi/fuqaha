abstract: "Sekkâkî'nin (ö. 626/1229) Miftâhu'l-ulûm adlı eseri, belâgat ilminin standart biçimini almasında bir dönüm noktası olmuştur. Öyle ki sonraki asırlarda belâgat ilmi gelişimini uzun müddet onun belâgat ilimlerini ihtiva eden üçüncü kısmı üzerine yapılan şerh, hâşiye, ihtisar, telhis vb. tamamlayıcı çalışmalar üzerinden sürdürmüştür. Bu çalışmalardan biri de Bedrüddîn İbn Mâlik'in (ö. 686/1287) Ravzu'l-ezhân fî ilmi'l-beyân adlı eseridir. Bu araştırmanın amacı, Miftâhu'l-ulûm üzerine erken bir dönemde yapılmış önemli bir ihtisar çalışması olan Ravzu'l-ezhân'ı ilmî usullere göre tahkik ve tahlil ederek ilim dünyasının istifadesine sunmak ve eserin belâgat çalışmaları arasındaki yerini ortaya koymaktır. Bu amaca yönelik olarak nitel araştırma yöntemi benimsenmiş, dokümantasyon ve karşılaştırmalı metin incelemesi tekniği kullanılmıştır. İnceleme sonucunda, Ravzu'l-ezhân'ın Miftâh üzerine yapılan çalışmalar arasında günümüze ulaşan en eski eser olduğu, müellifin bu çalışmasında Miftâh'ın üçüncü kısmını ihtisar ederek müstakil bir belâgat eseri ortaya koyduğu tespit edilmiştir. Ayrıca eserin muhteva ve yöntem bakımından yer yer Miftâh'tan ayrıştığı ve müellifin özgün belâgat anlayışını yansıttığı görülmüştür. Öte yandan Ravzu'l-ezhân'ın, Bedrüddîn İbn Mâlik'in daha sonra kaleme aldığı el-Misbâh isimli eserinden önce yazıldığı anlaşılmıştır. Araştırmamızda müellifin farklı tarihlerde ama aynı konuda kaleme aldığı bu iki eser ile her ikisinin de asıl kaynağı olan Miftâhu'l-ulûm çeşitli yönleriyle mukayese edilmiş, müellifin belâgat düşüncesinin zaman içerisindeki gelişiminin izleri sürülmüştür."
