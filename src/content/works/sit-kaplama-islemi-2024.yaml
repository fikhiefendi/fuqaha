abstract: "Gürültü kirliliği, işitme sağlığını ve yaşam konforunu etkileyen bir sorun olarak görülmektedir. Bu sorunun önlenmesi amacıyla tedbirlerin alınması gerekmektedir. Tekstil malzemeleri, gürültünün azaltılması için tercih edilen malzemeler arasında yer almaktadır. Bu tez çalışmasında, düz atkılı örme kumaşlar üretilmiştir. Kumaşların üretiminde polyester iplikler kullanılmıştır. Tela kesilerek akrilat esaslı binder bulunan pat ile kaplanmıştır. Daha sonra, üretilen örme kumaşlara kaplanmış telalar yapıştırılmıştır. Bu tez çalışmasında, 5 farklı örgü yapısı kullanılmıştır. Düz atkılı örme kumaşların ses yutumu üzerinde kaplanmış tela yapıştırma işleminin etkisi araştırılmıştır. Ses yutum katsayısı ölçümlerinde empedans tüp cihazı kullanılmıştır. Yapılan testler sonucunda ses yutum katsayısı-frekans grafikleri oluşturulmuştur. Tela içermeyen numuneler ve kaplanmış tela içeren numunelerin iki farklı (kaplanmış telalı ve telasız) tarafı için 250 Hz, 500 Hz, 1000 Hz ve 2000 Hz frekanslarda ölçülen ses yutum katsayılarının aritmetik ortalaması hesaplanarak gürültü azaltma katsayıları elde edilmiştir. Tela yüzeyindeki kaplama maddesinin varlığının incelenmesi için taramalı elektron mikroskobu kullanılmıştır. Kaplanmış tela yapıştırma işlemi sonucunda, ses yutumunda farklılık meydana geldiği görülmüştür. Çalışmada; gürültü azaltma katsayıları arasında en yüksek çıkan 8 değer kaplanmış tela içeren numunelerin kaplanmış telalı tarafından kaydedilmiştir. Ses dalgasının ulaştığı tarafın, kaplanmış tela içeren numuneler için ses yutumunu etkileyen bir faktör olduğu belirlenmiştir. Örgü yapısının ses yutumunu etkilediği tespit edilmiştir."
