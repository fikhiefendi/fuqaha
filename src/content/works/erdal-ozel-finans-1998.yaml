abstract: "ÖZET özel Finans Kurumlarına 16.12.1983 gün ve 83/7506 sayılı kararname ile kurulmalarına izin verilmiş ve İslam bankacılığı özel Finans Kurumlan adıyla Türkiye'nin ekonomik ve mali sistemine 1984 yılı sonlarına doğru girmiştir. Özellikle 1990 yılından sonra faaliyetlerine hız veren özel Finans Kurumlan yeni bankacılık hizmetleriyle ekonomi içerisindeki ağırlığım özellikle mal ve hizmete dönüşmeyen atıl fonların ekonomiye kazandırılması noktasında kısa süre içerisinde hissettireceği topladığı ve kullandırttığı fon miktarlarındaki yüksek orandaki artışlardan görmek mümkündür. Özel Finans Kurumlan, cari ve katılma hesaplan adıyla, TL veya döviz cinsinden değişik vade gruplarında açılabilen iki farklı hesapta fon toplayabilmektedirler. Toplanan bu fonlar kâr ve zarara katılma üretim desteği, leasing ve mal karşılığı olan vesaikin alım satımı yoluyla kullandırılarak mal ve hizmet üretimine kanalize edilebilmektedir. Özel Finans Kurumlan bununla beraber sayıca değişik bölgelerde açılmakta olan şubeleri ve anlaşmalı oldukları yurt içi ve yurt dışındaki ticari bankalar aracılığıyla teminat mektubu verebilmekte, havale ve transfer işlemleri yapabilmekte, akreditif açma, döviz alım satımı ve her türlü döviz işlemleri yapma, seyahat çeki düzenleme, her türlü ithalat ve ihracat işlemlerini kısmen veya tamamen finanse etmek gibi ticari bankaların yaptığı bankacılık hizmetlerini de yapabilmektedirler. özel Finans Kurumlan faaliyet alanları ve faaliyet türleri değiştikçe daha fazla tasarruf sahibine ulaşmak amacıyla farklı bölgelerde şube açmak zorunda kalmaktadırlar. Artan şube sayısı şube yöneticilerine özellikle fon kullandırtırla bazı yetkiler verilmesini gerektirecektir. Bu durum tamamen merkezden yönetimin ve ya tamamen yetkilerin şube yöneticilerine verildiği bir yönetim biçimi ya da en çok uygulanmakta olan her İM yönetim biçiminin kurumun yapısına uygun bir şekilde uygulanmasını gerektirmektedir. Bankacılık sektörü içerisinde faaliyet gösteren ÖFK'ı çok hızlı ve büyük değişiklikler gösteren mali ve sosyal bir ortam içerisinde faaliyette bulunmaktadır. Bu ortam, enflasyon, sürekli dalgalanan yatırım ve ortaklık alanları, büyük farklılıklar gösteren kişisel tercihler ve devamlı değişen pazarlama teknikleri, yasal düzenlemelerle beraber yöneticilerin kullandıkları yöntemlerin de değişmesi, karar verme ve kontrol açısından planlamanın önemim daha da arttırmaktadır. Kurum, uzun ve kısa vadeli planlarda başarılı olabilmek için, planlama sürecinin organizasyon yapısına uygunluğunun sağlanmasını ve kontrol aşamasında fiili sonuçlan ölçebilecek iyi bir muhasebe sisteminin kurulmasını temin ederek, kurumun kapasitesine ve ihtiyaçlarına cevap verebilecek nitelikte olmasını sağlamaktadır. Planlanan değerlerle fili sonuçların karşılaştırılması şubenin performansım ortaya koyacaktır. Kuramların performans değerleme yapabilmeleri için elde edilen sonuçlan değerlendirebilmesi gerekir. Performansın ölçülebilmesi için kurum genelinde her şube için ayrı olmak üzere uygun göstergelerin ve standartların tespit edilmesi gerekmektedir. Bu konuda kurumlarda farklı göstergeler uygulanmakta olsa bile genel itibariyle TL ve yabancı para olarak toplanılan cari ve katılma hesapları, toplanan bu fonları kullandırılma oranlan, fazla fonların diğer şubelere transfer edilmesiyle elde edilen nemalar ve şubelerin faaliyetleri neticesinde elde ettiği kâr ve zarar en önemli kriterleri oluşturmaktadır. ÖFK'da şubelerin performanslarının ölçülmesi; şube yöneticilerinin faaliyetlerinin yönlendirilmesini sağlayarak yol gösterici olması, faaliyetlerin genel merkez tarafından kontrol edilmesiyle şube yöneticisinin vereceği olumsuz kararların minimum seviyeye indirilmesi ve şubenin genel durumu hakkında genel merkeze bilgi vermesi açısından oldukça önemlidir. Performans değerleme, şubenin şimdiki durumuna ve geleceğine ait lehine kararlar alınmasını sağlayarak kurulan performans değerleme kurumun ve şubenin organizasyon yapısının oluşmasına da yardımcı olmaktadır."
