abstract: "Bu çalışmanın gayesi, bankacılık sektöründe faaliyet gösteren bir katılım bankasındaki çalışanlar üzerinde Örgütsel Sessizlik ve Etik Liderlik arasındaki ilişkide Kurum kültürünün düzenleyici etkisinin araştırılmasıdır. Çalışmanın, ilk üç bölümünde Etik Liderlik, Örgütsel Sessizlik ve Kurum kültürünün teorik çerçevesi ortaya konulmuştur. Beşinci bölümde söz konusu katılım bankasında çalışan 182 çalışandan edinilen veriler SPSS 22.0 programında istatistiksel yöntemlerle analiz edilmiştir. Araştırmada, Etik Liderlik ile Örgütsel Sessizlik ve kabullenici ve savunmacı sessizlik arasında negatif ve anlamlı bir ilişki bulunmuştur. Etik Liderlik ile İlişkisel Sessizlik arasında ise literatürle uyumlu şekilde pozitif ve anlamlı bir ilişki bulunmuştur. Diğer yandan, Kurum kültürünün, Etik Liderlik ile Örgütsel Sessizlik arasındaki ilişkide düzenleyici (moderatör) rol üstlenmediği tespit edilmiştir. Ayrıca Örgütsel Sessizlik davranışının cinsiyete göre farklılaşmadığı tespit edilmiştir (p<0,227). Örgütsel Sessizlik boyutlarına bakıldığında Kabullenici ve Savunmacı Sessizliğin kadın ve erkek arasında anlamlı bir şekilde farklılaşmadığı (p<0,649), İlişkisel Sessizlik alt boyutunun ise kadın ve erkek arasında anlamlı bir şekilde farklılaştığı (0,013<p) görülmüştür. Ayrıca Örgüt Sessizlik davranışı katılımcıların eğitim durumlarına göre farklılaşmadığı (p<0,169) görülmüştür. Bu bulgular sonuç ve öneriler bölümünde yorumlanmıştır."
