abstract: "“1501 numaralı Rize Şer'iyye Siciline göre Rize'de Sosyal Hayat (1891 1894)”başlığı altında yaptığımız bu tez çalışmasının amacı, bahsi geçen sicilin günümüzde kullanılan Türk alfabesine dil içi çeviri yapılarak sicilde geçen belgelerin içeriğinin değerlendirilmesiyle Rize'nin sosyal hayatıyla alakalı tarihi verilerin gün ışığına çıkarılmasını ortaya koymaktadır. Çalışma üç bölümden meydana gelmektedir. İlk bölümü Rize ilinin tarihi kayıtlarında ulaşılan ilk dönemlerinden itibaren Cumhuriyet dönemi dahil olmak üzere Rize tarihi hakkında bilgi verilmiştir. Birinci bölümün ikinci kısmında ise Osmanlı Devleti'nin yargı teşkilatının önemli bir unsuru olan Şer'iyye Mahkemeleri ve bu mahkemelerdeki yargılama usulünden, şer'iyye sicillerinin muhtevasından bahsedilerek bu sicillerdeki belge çeşitleri hakkında bilgi verilmiştir. Tezin ikinci bölümü ise 1501 numaralı sicilde kaydedilmiş dava kayıtlarında var olan bilgilerden yola çıkarak Rize'nin sosyal, ekonomik ve dini hayatıyla alakalı tarihi bilgiler tahlil edilmeye çalışılmıştır. Üçüncü bölüm ise 1501 numaralı Rize Şer'iyye Sicilinin orijinal metni dil içi çeviri metoduyla günümüzde kullanılan harflerle transkripsiyonu sağlanmıştır."
