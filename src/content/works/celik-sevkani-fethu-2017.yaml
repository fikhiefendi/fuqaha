abstract: "Hazırlamış oldumuğuz yüksek lisans tezimiz Şevkânî'nin tefsirinde Furkân ve Şuarâ sûrelerindeki kıraat farklılıklarını konu edinmektedir. Çalışmamızın giriş bölümünde öncelikle kıraat ilminin tarifini, konusunu ve günümüze kadar bu rivayetleri bizlere ulaştıran kıraat imamlarının hayatını anlatmaya çalıştık. Tezimizin birinci bölümünde Şevkânî'nin hayatı, ilmi şahsiyeti, eserleri ve Fethü'l-Kadîr tefsirindeki metodu incelenmiştir. İkinci bölümde Furkân ve Şuarâ sûreleri hakkında bilgi vererek müfessirin bu sûrelerde değinmiş olduğu kıraat farklılıklarını aktardık. Yine bu sûrelerdeki meşhûr ve mütevâtir kıraatleri tespit ettik ve vücûhâtlarını şema halinde derledik. Son bölümde ise Şevkânî'nin tefsirindeki kıraat metodunu ve kaynaklarını ele alarak tefsir-kıraat ilişkisi hakkında kısaca bilgiler verdik. Kelimeler: Kıraat, Şevkânî, Furkân, Şuarâ, Fethü'l-Kadîr."
