abstract: "Katılım Bankacılığının Türkiye'deki sektör payı her geçen yıl artış gösterse de henüz istenen düzeyde bulunmamaktadır. Bunun sebeplerini araştırmaya yönelik pek çok akademik çalışma bulunmaktadır. Bu tezin amacı ise Katılım Bankacılığı tercihinin Davranışsal İktisat perspektifi ile değerlendirilerek“çerçeveleme etkisi”altında nasıl değiştiğini ve bu durumun Katılım Bankacılığına olan etkisini incelemektir. Araştırmada deneysel çalışma gerçekleştirilmiş olup, kontrol grubu ve deney grubu olarak iki gruptan oluşmaktadır. Her iki gruba da Katılım Bankacılığı tercihine yönelik aynı finansal sonucu oluşturan soru yöneltilmiştir. Ancak deney grubuna sorudan önce çerçeveleme etkisi içeren metin ön okuma yaptırılmıştır. Elde edilen sonuçlara göre; kontrol grubu %69 Konvansiyonel Banka, %31 Katılım Bankacılığı tercihinde bulunurken; deney grubu ise %72 Katılım Bankacılığı, %28 Konvansiyonel Banka tercihinde bulunmuştur. Bu sonuç çerçeveleme etkisinin Katılım Bankacılığı tercihinde ciddi bir değişim oluşturduğunu göstermektedir. Aynı şekilde deneyin devamında katılımcıların Katılım Bankacılığı algı düzeylerini ölçen sorulara verilen yanıtlarda da %9'luk pozitif bir değişim gözlemlenmiştir. Elde edilen sonuçlar neticesinde Katılım Bankacılığının daha geniş kitleler tarafından benimsenmesine yönelik politika önerileri sunulmaktadır. Çalışma, Davranışsal İktisat yaklaşımının ve özelde çerçeveleme etkisinin finansal tercihlerde etkisi olduğunu ortaya koymakta ve Katılım Bankacılığı alanında daha etkili iletişim ve pazarlama stratejileri geliştirilmesine katkıda bulunmaktadır. Çalışmanın Katılım Bankacılığı algı yönetiminde ve tercihin artırılmasında uygulamaya yönelik önemli çıktılar sunarak, Katılım Finans Strateji Belgesi'nde de yer alan Algı ve Farkındalık temasına katkı sunacağı değerlendirilmektedir."
