abstract: "God Almighty has provided imams and interpreters preoccupied with learning and teaching the Holy Qur'an to people. Some of these scholars were known and famous; others, their manuscripts kept on shelves in libraries, among them the scholar Shams Al-Din Al-Misri, the author of the manuscript of the interpretation of the Great Qur'an, which we sought to study and bring it out in a scientific way to be at the fingertips of Knowledge Seekers.This research deals with investigating and studying an important interpretation, the interpretation of the Holy Qur'an, from Surah Al-Najm to the end of Surah Al-Waqi'ah (Study and Investigation). We tracked the proof of the difference with all accuracy and scientific honesty, in addition to studying the author's approach and sources in his interpretation. Our study relied on the isam approach (Islamic Research Center), so we transcribed the entire manuscript following the current spelling rules. Then, we matched it with the second one. Through our study, we reached several results, including Imam Shams al-Din relied on a variety of sources, still, he transferred a lot from Tafsir al-Qurtubi (may God Almighty have mercy on him), there is a diversity in his mention of Hadiths between the true and weak, sometimes the Hadith is entirely mentioned, but sometimes is partly said. Finally, the reader of the interpretation of Imam Shams al-Din finds that the linguistic sciences have taken a large part of his interpretation, as he was interested in explaining the parsing aspects and the syntactical differences."
