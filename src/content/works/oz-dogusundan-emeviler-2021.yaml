abstract: "Bu çalışmada ibadet olarak zekâtın birtakım hususiyetleri aktarılıp müesseseleşme süreci ele alınmış ve Hz. Peygamber, Hulefâ-yı Râşidîn ve Emevîler dönemlerinde zekât müessesi uygulamaları incelenmiştir. İslâm dininin beş şartından birini teşkil eden zekât, toplum içindeki muhtaçların ihtiyaçlarının giderilmesi açısından önemli bir yere sahiptir. Nitekim zekât müessesesi toplumda zengin ile fakir arasında bir köprü konumundadır. Bu sayede zenginlerin sorumluluklarını yerine getirmesi sağlandığı gibi muhtaçların da ihtiyaçlarının minnet altında kalmadan ve onurları incitilmeden giderilmesi mümkün kılınmıştır. Ayrıca bu sayede zenginden fakire merhamet, fakirden zengine hürmet hislerini güçlendirerek toplumsal çatışmaların önüne geçilmesi de zekâtın bir diğer faydası olarak zikredilebilir. Zekâtın müesseseleşme süreci incelendiğinde görülecektir ki Mekke Dönemi'nde zekât işleri kurumsal bir organizasyonla yürütülmemiş; bu sorumluluk bireye bir başka ifadeyle her Müslüman'ın kendi inisiyatifine bırakılmıştır. Mekke Dönemi'nde mutlak olarak yardımlaşmayı ve Allah'ın verdiği nimetleri Allah rızasını umarak muhtaçlara vermeyi kasteden zekât, Medine'ye hicretle beraber farklı bir boyut kazanmıştır. Genel kabule göre hicretin ikinci yılında kesin bir emir olarak vazedilen zekât ibadeti, Medine Dönemi'nde nisâbı ve ölçüleri belli olarak devlet eliyle toplanan ve yine devlet eliyle Kur'ân'ın belirlediği ihtiyaç sahibi sekiz sınıfa dağıtılan bir ibadet olarak kurumsal bir mahiyet kazanmıştır. Hz. Peygamber, Tevbe Sûresi 103. ayetindeki“Onların mallarından zekât al.”emri gereğince zekâtı ya bizzat kendisi alıp, verilmesi gereken yerlere vermiş ya da görevlendirdiği zekât memurları vasıtasıyla bunu gerçekleştirmiştir. Hz. Peygamber'den sonra gelen Hulefâ-yı Râşidîn Dönemi'nde uygulama Resûlullah'tan tevarüs eden esaslar üzere devam ettirilmiş ve dönemsel olarak -nasların belirlediği asıl ilkelerle ters düşmeyecek- birtakım farklı uygulamalar da ortaya çıkmıştır. Hulefâ-yı Râşidîn'den sonra iktidara gelen Emevîler Dönemi'nde de zekât devlet eliyle toplanan ve gerekli yerlere dağıtılan bir ibadet olarak devam etmiştir. Emevîler Dönemi'nde zekât mallarının harcanmasıyla ilgili esasa mugayir birtakım hatalı uygulamalar olmuşsa da bunlardan Müslüman halkın şiddetli itirazları sonucunda vazgeçilmiştir."
