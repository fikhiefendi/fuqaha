abstract: "Bu çalışmada Osmanlı döneminde Cezayir'deki ilmî hayata ışık tutulmaya çalışılmıştır. Bu bağlamda Osmanlı dönemi Cezayir'inin önemli ilim merkezleri, bu merkezlerde bulunup fıkıh alanında eser veren özellikle de nevâzil-i fıkhiyye alanında çalışmaları bulunan önemli ve meşhur şahsiyetler ele alınmıştır. Bu çalışmada Nevazilü Kasantîna örnek alınarak konunun esas yönü olan fıkhî tarafa yoğunlaşılmıştır. Ayrıca Osmanlı dönemi boyunca Cezayirli âlimlerin fetva üretme metotlarını ve nevâzil kitaplarını yazma tarzları ve cevap verme metotları da incelenmiştir. Bu tezde, Osmanlıların Cezayir'e girişinin Cezayir'deki ilmî hareket ve gelişme üzerinde etkisini, devletin mezhebi olarak resmileştirdikleri Hanefi mezhebi ile mevcut olan halkın mezhebi Makili mezhebi arasındaki etkileşimi de incelenmiştir. Örnek alınan Nevâzilü Kasantîna eseri incelenip eserin önemi, derleme işinin nasıl yapıldığı, Kasantîna şehri başta olmak üzere Cezayir şehirlerinin ilmi, sosyal durumu, Abdulkerim Lefgûn'un vermiş olduğu fetvalarda kullandığı üslup ve fetva verirken takip ettiği metodu da izah edilmeye çalışılmıştır. Anahtar Kelimeler: İslam hukuku, Cezayir, Osmanlı Dönemi, Nevâzil, Fetvâ, Lefgûn."
