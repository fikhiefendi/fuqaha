abstract: "Diğer Türk-İslâm devletlerinde olduğu gibi Osmanlı Devleti'nde de henüz kuruluş aşamasında dini meselelerin çözümü amacıyla müftüler görevlendirilmiş ve zaman içinde başkentteki baş-müftü ?şeyhülislâm? olarak anılmaya başlanmıştır. Bürokratik bir müessese olarak II. Murad döneminde ihdas edilmiş olduğu düşünülen Şeyhülislâmlık, ulemâ sınıfının en üst mercii olarak devlet ve toplum yaşamında önemli bir nüfûz ve etkinliğe sahip olmuş; özellikle Zenbilli Ali Efendi, Kemalpaşazade ve Ebussuud Efendi dönemlerinde önemli bir nüfûz kazanmıştır. Ancak 17. yüzyıl ile birlikte ilmiye teşkilatındaki bozulmalar şeyhülislâmlık kurumunu da olumsuz etkilemiş; şeyhülislâmlar, kuruluş misyonlarının dışına çıkarak ve giderek siyasete müdahil bir konum alarak, kurumun yozlaşmasına zemin hazırlamışlardır. Bu durum onların sık sık azledilmelerine ve hatta katledilmelerine sebep olmuştur. Osmanlı devletinde ulemâ sınıfının ?siyaseten katl?den bağışık olmasına rağmen bu zümrenin en üst mercii olan ve gerek devlet idaresinde ve gerekse toplum yaşamında müstesna bir mevkiye sahip olan şeyhülislâmların katledilmesi oldukça ilginç bir durum arz etmektedir. İslâm hukuku devlet başkanına ölüm cezasına hükmetmek yetkisini tanımıştır. Osmanlı padişahları ise örfî tasarruflarına dayanarak bu yetkiyi fazlasıyla kullanmışlar ve çoğu zaman da ulemânın fetvâsına başvurmuşlardır. Padişahın siyaseten katle dair pek çok sebebi vardır; özellikle siyasal suçlar bunun içerisine girmektedir. Osmanlı Devleti'nin tek ve mutlak hakimi olan padişahın meşruiyetini sorgulamak ya da onu tahttan indirmeye teşebbüs etmek açık bir siyaseten katl sebebidir. Maktûl şeyhülislâmların da bu tür bir girişim sonucu katledildikleri görülecektir. Osmanlı devletinde padişahın emriyle katledilmiş üç şeyhülislam vardır. Bunlardan Ahîzade Hüseyin Efendi (ö. 1634) IV. Murad zamanında, Hocazâde Mes'ud Efendi (ö. 1656) IV. Mehmed zamanında ve Feyzullah Efendi (ö. 1703) III. Ahmed zamanında padişahın fermanı ile katledilmişlerdir. Ahizâde Hüseyin Efendi ve Hocazâde Mes'ud Efendi padişahı hal' edecekleri suçlamasıyla, Feyzullâh Efendi ise daha çok padişah üzerindeki nüfuzunu kendiçıkarlarınak kullandığı için katledilmişlerdir."
