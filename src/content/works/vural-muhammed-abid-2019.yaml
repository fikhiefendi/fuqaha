abstract: "Muhammed Âbid el-Câbirî ( v. 2010) son dönemde İslam düşüncesi hakkında birçok eser ortaya koymuş önemli mütefekkirlerden birisidir. İslam-Arap düşüncesini eleştirel gözle yeniden okuyan Câbirî, İslam düşüncesinin geçirdiği düşünsel ve sosyal buhranları incelemeye ve nedenlerini ortaya koymaya çalışmıştır. Câbirî'nin İslam kültür mirasını okuma biçimini, geleneğe yönelik eleştirilerini ve İslami ilimlerdeki bilgi teorisine yönelik tespit ve değerlendirmelerini anlamak, çağdaş İslam dünyasının problemlerini anlamaya yardımcı olacaktır. Bu çalışma, onun İslam düşüncesinin şekillenmesinde etkili olduğunu ifade ettiği bilgi sistemlerini ve bu bilgi sistemlerinin (özellikle beyâni bilgi sisteminin) Fıkıh ilmi ile ilgisini ele almaktadır. Bu amaçla icma, kıyas ve maslahat konuları Câbirî ilgili eserleri çerçevesinde ele alınmıştır. Bu bağlamda icma ve kıyas delilinin tanımı, otoritesi, bilgi değeri, illet-ta'lil problematiği, hükümlerin maslahat ekseninde anlaşılma çabası ve yeni bir içtihad anlayışı ile gerçekleşecek olan yeniden yapılanmaya dair belli başlı meselelere yer verilmiştir."
