abstract: "Bu çalışma Sultan III. Mehmet döneminde (1003-1011/1595-1603) Osmanlı Anadolu şehirlerinde tarihsel isyan ve eşkıyalık olgularına yargısal tepkinin çok katmanlı olduğunu ve Hanefi fıkıh eserlerinde tesis edilmiş olan faktörlerden bağımsız etkilendiğini göstermek suretiyle ceza hukuku alanında Osmanlı hukuk uygulamasını daha iyi anlamayı hedeflemektedir. Bu çalışma isyan ve eşkıyalık alanlarında tesis edilmiş olan fıkıh kurallarının detaylı bir hukuk doktrini sergilediğini ve bu geleneksel İslam hukuk doktrininin adâletnâmeler, kanûnnâmeler, siyâsetnâmeler ve aynı zamanda mühimme defterlerinde belgelendiği şekliyle Dîvân-ı Hümâyunun hukuki kararları ile desteklendiğini göstermektedir. Bu saltanat kanunları ihtiyaç duyulduğunda İslam hukuk doktrininden belli bazı sapmalar için esneklik imkânı tanımıştır. Buna ilaveten bu çalışma fıkıh, şeriat gibi terimlerin tanımlarını ve hukuk doktrininin uygulandığı sistem ve kurumların bir bağlama oturtulmasını sunmaktadır. Son olarak bu çalışma kanunlar dönemin sosyo-ekonomik, siyasi, çevresel, ekonomik, ve askeri gerçekleri gibi tarihsel faktörlerden bağımsız oluşması söz konusu olamayacağı için devletin yaklaşımının bu gibi faktörlerden nasıl etkilendiğininim analizini yapmadan tam olamazdı."
