abstract: "Bankalar ekonomik hayatta önemli bir rol oynarlar, modern ekonomik sistemin temelini oluştururlar ve artık ekonomik veya ticari işlemleri onlardan ayrı düşünmek mümkün değildir. Kapitalist ekonomik sistemlerde faizsiz bankalar, ortaya çıktıklarından günümüze kadar genelde bireylerin özelde kapitalist ülkelerin hayatında önemli bir rol oynadıkları için bankacılık sisteminin ayrılmaz bir parçası olarak kabul edilmektedir. Bu, tefeci olmayan bankaların bireylere ve ekonomik kuruluşlara gerekli finansman ihtiyaçlarını sağlamada oynadıkları etkin rol bir yana, müşterilerine hizmet sunmak ve müşterilerin birçok işlevini yerine getirmek yoluyla, onlara borçlulardan (mudilerden) aldıkları faizsiz çeşitli krediler vererek gerçekleşmektedir. Faize dayalı olmayan bankaların bu işlemlerin getirisi olarak gördükleri ve dolayısıyla tefeci olmayan bankaların Arap ve İslam dünyasının ve dünyanın geri kalanından Müslümanların isteklerini karşılamadaki rolü, işte budur. İslam Şeriati'ne göre çalışan ve işlemlerinde tefecilikle uğraşmayı reddeden İslam Bankaları, orta ve düşük gelirli gruplardan ve ayrıca dindarlardan tasarruf toplayabilmektedirler. İslam bankacılığı müşterilerine sundukları en önemli hizmet olarak kabul edilen finansman sağlamanın yanı sıra, kâr ve zarar paylaşımına dayalı çeşitli formül ve yöntemlere göre hizmetler de sunmaktadır. İslam ülkelerinde olduğu kadar kapitalist ülkelerde de faize dayalı olmayan bankalara yer verilmektedir. Tez çalışması dört bölüme ayrılmıştır. Birinci bölümde kapitalist ekonomik sistemi kavramı, bu sistemin temelleri, kuruluşu, avantajları ve dezavantajları açısından ele alacağız. İkinci bölüm, kapitalist ekonomideki bankacılık sistemine ayrılacaktır. Üçüncü bölümde ise İslami banka kavramı, İslami bankaların geçirdiği aşamalar ve İslami bankaların özellikleri ile amaçları açısından İslami bankacılık sektörü ele alınacaktır. Dördüncü bölüme gelince, bu son bölüm İslami bankacılığın kapitalist sistem içinde yürüttüğü çalışmaları incelemeye ayrılmıştır. Sonuç'ta, tez çalışmasında varılan yargılar ile öneriler sıralanmaktadır."
