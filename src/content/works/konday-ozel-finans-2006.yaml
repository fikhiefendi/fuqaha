abstract: "ÖZETTezli Yüksek Lisans ProjesiÖzel Finans Kurumlarının Türkiye' Deki Gelişimi Ve Bir UygulamaMünire KONDAYDokuz Eylül ÜniversitesiSosyal Bilimler Enstitüsüİşletme Ana Bilim DalıFinansman ProgramıBu tez kapsamında faizsiz bankacılık ve Türkiye'deki Katılım Bankalarıincelenmiştir. Çalışma içerisinde faizsiz bankacılık kavramı Türkiye'deki gelişimi veuygulamalar dört bölüm olarak ele alınmıştır.İlk bölümde; bankacılık ile ilgili genel bir bilgi verilmiş, dünyada veTürkiye'de bankacılık sistemi anlatılmıştır. Türkiye'deki gelişim Cumhuriyet öncesive Cumhuriyet dönemi dönem olarak iki bölüme ayrılmıştır ve bu kapsamda bilgiaktarılmıştır.İkinci bölümde; faizsiz bankacılık kavramları, fon toplama yöntemleri, fonkullandırma yöntemleri anlatılmıştır. Ayrıca faizsiz bankacılığın dünyadaki veTürkiye'deki gelişimi de bu bölümde incelenmiştir.Üçüncü bölümde; Türkiye'de faizsiz bankacılık konusu detaylı olarakanlatılmıştır. Faizsiz bankacılık sisteminin gelişimine katkıda bulunan olaylar,kanunlar ve faizsiz bankacılık sisteminde yer alan kurumlar bu bölüme dahiledilmiştir. Katılım Bankaları, Türkiye Katılım Bankaları Birliği, BankacılıkDenetleme ve Düzenleme Kurumu ve Tasarruf ve Mevduat Fonu hakkında bilgiverilmiştir. Bölüm içerisinde Katılım Bankalarının hizmetleri de ele alınmıştır.Çalışmanın son bölümünde Türkiye'deki katılım bankaları genel yapılarıitibariyle tanıtılmıştır. Bu kapsamda kuruluşları, ortaklık yapıları, şube sayıları veürünleri hakkında bilgi verilmiştir. Ayrıca bölüm içerisinde katılım bankalarınınmali tablolarına konsolide olarak yer verilmiştir.Anahtar kelimeleriÖzel Bankacılık, Finans, Gelişim"
