abstract: "Ana akım paradigmanın konvansiyonel iktisadi problemleri çözmede başarılı olamadığı konusundaki görüşler yaygınlık kazanmıştır. İktisadi problemlerin çözülmesi için yapılan arayışlara çözüm sunan alternatif yaklaşımlardan biri de İslam iktisadı ve finansı yaklaşımıdır. İslam ekonomisi ve finansı literatürü konvansiyonel iktisadi problemlere çözüm üretmek için yeterince zengin olmakla birlikte İslam ekonomisi ile ilgili literatür incelendiğinde, çalışmaların genel olarak finansal ağırlıklı olduğu görülmektedir. İslam iktisadı ile ilgili literatür göz önüne alındığında iktisadi teorik çalışmaların yeterli olmadığı kabul edilmektedir. İslam ekonomisi teorik anlamda konvansiyonel iktisadi teoriden çok farklı yapısal dinamiklere sahiptir. Bunun en başında faiz yasağı gelmektedir. Faiz yasağının olduğu bir ekonomik model inşa etmek İslam iktisadı ile ilgili teorik çalışmalara önemli bir zemin oluşturacaktır. Bu çalışmada İslam ekonomisi için teorik olarak faiz yasağının uygulandığı bir model tasarlanmıştır. Modelde faiz yerine parasal aktarım aracı olarak kâr- zarar ortaklık (mudarebe) finansman yöntemi kullanılmıştır. Buna göre modelde hane halkları sahip oldukları sermayeleri firmalara vermekte ve üretim sürecine kâr- zarar ortaklığı esasına göre katılmaktadır. Çalışmada küçük açık ekonomi modeli için dinamik stokastik genel denge (DSGD) analizi temel alınmıştır. Küçük dışa açık ekonomi için Türkiye verileri kullanılmış, dış ekonomi için ise ABD ekonomik verileri baz alınmıştır. Türkiye ile ilgili veriler TÜİK verileri, ABD ile ilgili veriler ise FED verileridir. Elde edilen veriler mevsimsellikten arındırılarak Bayesyen tahmin yöntemiyle analize dahil edilmiştir. Bu analizin sonuçlarına göre faizsiz bir ekonomi kurgulamak mümkündür. Böyle bir ekonomide reel faaliyetler ön planda olmakta ve daha istikrarlı bir ekonomik yapı görülmektedir. Çalışma literatürdeki önemli bir boşluğu dolduracağı için önemlidir."
