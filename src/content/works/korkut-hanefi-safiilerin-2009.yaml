abstract: "Bu çalışma Hanefî ve Şafiî mezheplerinin namaz konusundaki ihtilaflarının dayandığı delillerden bahsetmektedir. Bu ihtilafların temelinde öncelikle Hz. Peygamber'in farklı söz fiil ve tavırları vardır. İkinci olarak bu söz, fiil ve tavırlardan birini diğerine tercih etme konusunda, her iki mezhep farklı usulleri esas almıştır. Böylece her mezhep farklı usullere dayanarak bunlardan birini diğerine tercih etmiş böylece namaz konusunda ihtilaf ortaya çıkmıştır. Çalışmanın amacı bu mezheplerin görüş ayrılığının dayandığı delilleri ortaya koymak ve usul açısından bunları incelemektir. Her biri meşru delillere dayandığından İslam Fıkıh mezheplerinin hepsi hak mezheplerdir. Mezheplerin bu görüş ayrılıkları, Müslümanlar için kolaylık sağlamıştır."
