abstract: "Bu çalışma, Türkiye'de faaliyet gösteren 16 bankayı (devlet bankaları, özel bankalar ve katılım bankaları) kapsamakta ve 2015–2024 yılları arasındaki dönemde banka verimliliğini etkileyen faktörleri incelemektedir. Araştırmada, bankacılık performansının ölçümünde bağımlı değişkenler olarak ROA (aktif kârlılığı) ve ROE (özsermaye kârlılığı) kullanılmış, bağımsız değişkenler ise likidite oranı, sermaye yeterliliği oranı, varlık kalitesi ve operasyonel verimlilik olarak belirlenmiştir. Panel veri analizi yöntemi kullanılarak, havuzlanmış EKK, sabit etkiler ve rastgele etkiler modelleri değerlendirilmiş; F testi ve Hausman testi sonuçlarına göre her iki model için rastgele etkili modelin uygun olduğu belirlenmiştir. Analizler, bankacılık verimliliği göstergeleri arasındaki ilişkilerin değişken düzeylerde anlamlı olduğunu ortaya koymuştur. ROA modeli için sermaye yeterliliği ve operasyonel verimlilik, ROE modeli için ise varlık kalitesi ve operasyonel verimlilik değişkenlerinin anlamlı olduğu tespit edilmiştir. Bulgular, sermaye yapısının güçlülüğü, varlık kalitesi ve operasyonel etkinliğin bankaların kârlılık ve verimlilik performansında belirleyici rol oynadığını göstermiştir. Çalışma sonuçları, bankaların sürdürülebilir kârlılığı sağlamak için sermaye yeterliliğini güçlendirmeleri, varlık kalitesini iyileştirmeleri ve operasyonel süreçlerini optimize etmeleri gerektiğini ortaya koymaktadır. Ayrıca, dijitalleşme ve süreç otomasyonu gibi stratejik yatırımların hem konvansiyonel hem de katılım bankacılığı uygulamalarında bankacılık performansını artırmada kritik öneme sahip olduğu sonucuna ulaşılmıştır. Elde edilen bulgular, Türkiye'de hisse senedi finansmanı uygulamalarının bankacılık türlerine göre verimlilik ve kârlılık üzerindeki etkilerini karşılaştırmalı olarak değerlendirmek için önemli veriler sunmaktadır."
