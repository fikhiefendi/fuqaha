abstract: "18. yüzyılda yaşamış olan Ceceli Müftü İbrahim Efendi'nin hayatı hakkında şuara tezkireleri ve biyografik eserlerde herhangi bir malumat yoktur. Şairin hayatı, şahsiyeti ve edebî kişiliği hakkındaki bilgiler, üçü manzum üçü mensur olan eserlerinden yola çıkılarak edinilmiştir. Kastamonu'da yirmi yıl müftülük yapan şairin, Şâfî isimli eserinin farklı kütüphanelerde otuzu aşkın nüshası mevcuttur. Bu çalışma, klasik Türk edebiyatı döneminde yazılmış manzum fıkıh eserleri ile Ceceli Müftü İbrahim Efendi'nin“Şâfî”adlı eserinin karşılaştırmalı metnini ve incelemesini kapsamaktadır. Çalışmanın birinci bölümünde klasik Türk edebiyatı dönemi içerisinde manzum olarak yazılmış fıkıh eserleri tanıtılmış; ancak manzum olarak yazılmış olan fetvalar çalışmaya dahil edilmemiştir. İkinci bölümde tanıtılan manzum fıkıh eserlerinin kaynakları üzerinde durulmuş, üçüncü bölümde şairin hayatı ve eserleri tanıtılmıştır. Dördüncü bölümde eser incelenmiş, beşinci bölümde ise eserin, karşılaştırmalı metin çevirisi yapılmıştır. Bu çalışma, klasik dönem şairlerinin fıkıh ilmi üzerine telif ve tercüme birçok manzum eserinin olduğunu ortaya koymuştur. Klasik dönem şairlerinin geniş ve çetrefilli bir disiplin olan fıkıh ilmi üzerine hemen her asırda ve üç dilde de manzum eser yazmaları, bu nitelikte eser yazmanın gelenek hâline geldiğinin göstergesidir. Bu durum, Türkçe'nin ilim dili olduğunu ve klasik Türk edebiyatının sınırlarının ne kadar geniş olduğunu ortaya koymuştur. Bunun yanı sıra,“Şâfî”isimli eserin müellifi Ceceli Müftü İbrahim Efendi ve diğer eserleri ayrıntılı olarak tanıtılarak okurların dikkatine sunulmuştur."
