abstract: "İslam düşüncesinde Kur'ân-ı Kerîm'i anlama ve yorumlama çabasının bir neticesi olarak ortaya çıkan belâgat ilmini, modern dilbilimin alt dalı edimbilim açısından inceleyen bu çalışma, iki farklı geleneğe ait bu iki ilmin ortak noktalarını ortaya koymaktadır. Dili konuşur, dinleyen ve bağlam esaslı inceleyen bu iki ilim, farklı tarihsel dönemlerde ortaya çıkmalarına rağmen benzer amaç ve yaklaşımlar benimsemektedir. Modern bir disiplin olarak 20. yüzyılda ortaya çıkan edimbilimin birçok kuramının, klasik belâgat eserlerinde farklı terimlerle ve kavramsal çerçevelerle ele alındığı görülmektedir. Bu bağlamda çalışmada öncelikle, belâgatın temel kavramları olan müsned, müsnedün ileyh, kasr, îcâz-itnab ve fasl-vasl konuları, edimbilimin söz edimleri, örtük anlam, bağlam ve konuşma ilkeleriyle karşılaştırmalı olarak incelenmiştir. Yapılan detaylı analiz sonucunda her iki disiplinin de dilin kullanım boyutuna odaklandığı, benzer teorik yaklaşımlar geliştirdiği ve dil-anlam ilişkisini benzer perspektiflerden ele aldığı tespit edilmiştir. Özellikle belâgattaki“makam”ve“muktezâ-yı hâle riayet”kavramlarının, edimbilimin kuramları ve konuşur-dinleyici etkileşimiyle yakından ilişkili olduğu görülmektedir. Araştırmanın diğer önemli bir bulgusu da edimbilimin sözeylem, işbirliği, sezdirim, önvarsayım, çıkarım, gösterim ve nezaket gibi modern kuramlarının, belâgat ilminde terimleşmemiş olsa da farklı isimlerle yer aldığıdır. Bu durum, İslam medeniyetinde belâgat, tefsir, fıkıh usulü gibi ilimlerdeki dil çalışmalarının derinliğini ve özgünlüğünü göstermesi açısından dikkat çekicidir. Müslüman dilcilerin dil-bağlam ilişkisini sistematik bir şekilde ele almaları ve geliştirdikleri kavramsal çerçeve, modern dilbilim çalışmalarıyla önemli paralellikler göstermektedir. Sonuç olarak bu araştırma, belâgat ilminde ileri sürülen dile dair görüşlerin modern dilbilim yaklaşımlarıyla örtüşen zengin bir teorik altyapıya sahip olduğunu ve modern dilbilime katkı sağlayabilecek özgün bir birikim barındırdığını ortaya koymaktadır. Her iki geleneğin kavramsal çerçevelerinin karşılaştırmalı incelenmesi, dilbilim ve dil felsefesi alanlarına yeni bakış açıları kazandırmaktadır. Bu karşılaştırmalı yaklaşım, hem klasik belâgat çalışmalarının daha iyi anlaşılmasına katkı sağlamakta hem de modern dilbilim teorilerinin tarihsel arka planına ışık tutmaktadır."
