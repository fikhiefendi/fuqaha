abstract: "Bu çalışma, Mevsılî'nin el-İhtiyar li-Ta'lîl'il Muhtâr isimli eserinde ibadetler özelinde mezhep içi görüş ayrılıklarını araştırmayı amaçlamaktadır. Hanefî mezhebi kurucusu Ebû Hanîfe ve onun öğrencileri Ebû Yusuf, İmam Muhammed ve İmam Züfer arasında; tahâret, namaz, zekât, oruç ve hac konularında ortaya çıkan ihtilâflı meseleler tespit edilmeye çalışılırken dayandıkları gerekçeler delillendirilerek ortaya konmuştur. Çalışmanın asıl amacı, ihtilâfların tespiti ve delillendirilmesi sonucu ortaya çıkan mezhep içi ictihad çeşitliliğini gözler önüne sermektir. Araştırmada nitel yöntem uygulanmıştır. Bu yöntem uygulanırken eser; çeviri yoluyla incelenmiş, Hanefî mezhebi literatürü taranmış, klasik kaynaklardan okumalar yapılmıştır. İhtilâflar tek tek tespit edilmiş ve sistemli bir biçimde sınıflandırılmıştır. Tezimizde ihtilâflı olan meseleleri 5 ana başlık ve 61 alt başlık olacak şekilde tahkik ettik. İhtilâf sebeplerinin; nasların yorumu, hadislerin dereceleri ve aynı fıkhî meseleye farklı ictihad yöntemlerinin uygulanmasından veya aynı yöntem uygulanmış olsa bile uygulama farklılığından kaynaklı olduğunu tespit ettik."
