abstract: "Bu çalışmada, İslâm borçlar hukuku alanındaki birçok konuda söz konusu olan hak ve sorumlulukların yerine getirilmesinde bu hak ve sorumlulukların ihtiyat prensibi ile bağlantısı ele alınmaya çalışılmıştır. Şüphe ve belirsizlik olgusunun bulunduğu birçok konuda sıkça karşımıza çıkan ihtiyat kavramı, İslâm fıkıh literâtüründe müstakil bir delil olarak ele alınmamıştır. Ancak usûl-u fıkıh'taki sedd-i zerâyi, istihsan, hilâf gibi ferî delillerle ilişkisinin olduğu hatta kimi zaman onların yerine kullanıldığı gibi görüşler usûl âlimleri tarafından ileri sürülmüştür. Zira literatürde müstakil bir delil olarak ele alınmamasına rağmen böylesi önemli bir yere sahip olması ihtiyatın hem usulde hem de furû da kayda değer bir yerinin olduğunu göstermektedir. İhtiyatın Furû'u fıkıhta yoğun kullanımı ve ifade edildiği gibi bazı ferî deliller ile güçlü irtibatı, İslâm borçlar hukuku alanındaki borç alacak ilişkileri, akidler, muhayyerlikler gibi önemli mevzularda sıkça karşımıza çıkmaktadır. Özünde hak ve sorumluklardan oluşan İslâm borçlar hukuku'nda ihtiyat prensibi gerek tarafların korunması, garanti altına alınması gerekse karşılıklı yapılan akidler de bazen tek tarafın bazen her iki tarafın haklarının, mallarının yahut canlarının korunmasını sağlamaktadır. Netice itibariyle İslâm hukukunun muamelât kapsamı çerçevesinde ele alınan borçlar hukuku, gündelik hayatta karşılaşılan sorunların yoğunluğu ve vazgeçilmez bir unsur olması bakımından önemli bir yere sahiptir. Bu nedenle kamu düzeninin sağlanması, ihtiyaçların karşılanması ve kişiler arasında adaletin sağlanması bakımından İslâm'ın tavsiye ettiği dengenin gözetilmesi borçlar hukukunun zeminini oluşturur. Dolayısıyla İslâm'ın diğer birçok konuda olduğu gibi borçlar hukukundaki düzenlemeleri ve tavsiyeleri doğrultusunda ihtiyatın işlevselliği ve nerede nasıl kullanılması gerektiği konumuzun mevzuunu oluşturmaktadır."
