abstract: "Bu tez, Tefsir alanında Kur'an-ı Kerim' den Meryem ve Taha sûrelerini inceleme ve tahkik etme hususunda yapılan bir çalışmadır. Konuları açısından bahsettiğimiz sûreler içerikli bu çalışmada kaynak olarak muteber, klâsik Tefsir kitaplarına müracaat edilmiştir. Ayrıca müellifin hayatı ve tefsirinin anlatım bölümünde ise tezin bib-liyografya kısmında adı geçen eserler, maddelerden istifade edilerek yazılmıştır."
