abstract: "Müslümanların istikamet üzerinde hayatlarını sürdürebilmeleri için İslâm'ın emir ve yasaklarına göre yaşamaları gereklilik arz etmektedir. İslâm dininde vârid olan emirlerin dikkate alınıp yerine getirilmesi Müslümanların hem dünya hayatı hem de ahiret hayatı açısından önem arz etmektedir. İslâm'ın emirlerine muhalefet ettikleri takdirde ise hem dünyevî hem de uhrevî cezaya maruz kalacaklardır. İslâm hukuk usûlünde emir konusu önemli bir alanı oluşturmaktadır. Mükellef kimselerden talep edilen fiiller, hükümler ile ifade edilmiştir. Bu hükümler de emir ve yasaklardan meydana gelmektedir. İslâm'da vârid olan emirlerin anlaşılması ve hangi mânaya delâlet ettiği oldukça önemlidir. Nitekim Müslümanlar bu emirleri uygulamakla mükelleftirler. İslâm hukukunda emir ve emre muhalefetin doğurduğu sonuçlar adlı çalışmada, emrin ana özellikleri ve emre muhalefetin doğurduğu sonuçların neler olduğu ele alınmıştır. Çalışmanın birinci bölümünde emrin tanımı ve çeşitleri, emir sîgâları, emrin delâletinin çeşitleri, emrin delâlet ettiği mânalar, yasaktan sonra gelme durumundaki emrin konumu, emrin tekrara delâlet edip-etmeme husûsu, emrin ifâ edilmesi, emrin fevrî mi yoksa terâhîyi mi ifade ettiği gibi konular incelenmiştir. İkinci bölümde ise emre muhalefetin kapsamı, emre muhalefetin dereceleri, ilahi emirden dolayı kulların emrine muhalefet, emre muhalefetin dünyevî ve uhrevî ceza doğurması, emre muhalefetten doğan müeyyidelerin ortadan kalkması ve ibadet bağlamında emre muhalefet edildiğinde ne gibi sonuçların ortaya çıktığı tespit edilmeye çalışılmıştır. Namaz, zekât, oruç, hac ve kurban gibi emirlere aykırı hareket edildiğinde bunun fıkhî, bireysel ve toplumsal sonuçları tespit edilmeye çalışılmıştır."
