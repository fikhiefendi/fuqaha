abstract: "Bu çalışma, hicrî onuncu yüzyılda önemli ilim merkezlerinden olan Mekke'de yetişen önde gelen dil alimlerinden Cemâluddîn el-Fâkihî'nin (ö. 972/1564) hayatını, ilmî kişiliğini ve nahiv ilmindeki yerini incelemektedir. Ayrıca onun nahiv ilminin kavram, terim ve tanımlarına dair ele aldığı Şerhu Kitâbi'l-hudûd fî'n-Nahv isimli eseri de bu çalışmada değerlendirilmektedir. Araştırmada, Memlük yönetiminden Osmanlı idaresine geçiş sürecinde Hicaz bölgesindeki ilmî hareketliliğin arka planında, Fâkihî'nin dil ve gramer alanındaki yeri ve eserinin yöntemsel özgünlüğü ele alınmıştır. Kaynak taraması, metin analizi ve karşılaştırmalı yöntemlerin kullanıldığı çalışmada, müellifin nahiv terimlerini mantık disiplininin (cins, fasıl vb.) kavramsal araçlarıyla yeniden yapılandırarak terminolojik bir istikrar sağlamıştır. Araştırmada Fâkihî'nin nahiv terimlerini tanımlarken, efrâdına câmi' ağyârına mâni' prensibine titizlikle bağlı kaldığı, çoğunlukla Basra dil ekolünün kavramlarını benimsemekle birlikte Kûfe dil ekolünün görüş ve kavramlarına da yer veren eklektik ve öğretici bir üslup tercih etmiştir. Ayrıca eserdeki nahiv ilmine dair kural, terim ve tanımları, ayet, hadis, şiir ve nesirden getirdiği istişhâdlarla güçlü bir şekilde temellendirmiştir. Söz konusu eserinde metin ile şerhi güzel bir şekilde birleştirip mezc usulünü başarıyla tatbik etmiştir. Dolayısıyla bu çalışma, Fâkihî'nin klasik nahiv ve terim bilimi (hudûd) geleneğinin tekâmülündeki merkezî rolünü ve özgün katkısını literatüre kazandırmaktadır."
