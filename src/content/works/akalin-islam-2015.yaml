abstract: "Tarihte birçok devlet, kendi içinde yaşanan isyanlar sebebiyle yıkılmıştır. İslam tarihi boyunca var olan devletler de aynı sosyal olguyla karşı karşıya kalmıştır. Bu çalışmada devlete isyan suçu İslam hukuku açısından incelenmiştir. Bunun için İslam dininin temel kaynakları ve İslam hukukçularının bu kaynaklara getirdiği yorumlar esas alınmıştır. Yapılan araştırmada isyanın, temel İslam kaynaklarında siyasî bir suç sayıldığı görülmüştür. Araştırmada suç ve suçlu ile mücadele kapsamında isyan suçunun oluşum safhası ve hukukî sonuçları İslam hukuku açısından ortaya konmuştur."
