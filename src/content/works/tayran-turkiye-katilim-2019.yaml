abstract: "Küreselleşmenin getirdiği rekabet etkisinde işletmeler hizmet kalitesine yönelik olarak daha fazla hassasiyet sergilemektedirler. Bankacılık sektöründe de bu yaklaşım önem arz eden bir nitelikte kabul görmüş ve finans işletmeleri müşteri memnuniyetine yönelik yoğun çabalar ortaya koymaktadırlar. Bu çabalar, teknolojik ürünlerle müşterilerine daha iyi hizmetler verme ile birlikte şubelerde birebir iletişim kurulan müşterilere de hem personel yeterliliği hem de müşteriye karşı sergilenen tavır bağlamında önem kazanmaktadır. Katılım bankacılığında hizmet kalitesine ilişkin yapılan analizler neticesinde eğitim düzeyi, medeni durum, gelir düzeyi ve tercih edilen bankacılık sistemi gibi değişkenlerin hizmet kalitesi algısını etkiledikleri görülmektedir. Bunun yanı sıra teknolojik yeterlilik, personel yeterliliği ve müşteri odaklılığın hizmet kalitesi algısını büyük ölçekte şekillendirdiği sonucu da yine katılım bankacılığı için araştırmanın elde edilen sonuçlarındandır."
