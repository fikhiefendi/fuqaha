abstract: "Mâverdî birçok alanda yazdığı eserlerle yaşadığı dönem ve sonrasında dikkat çeken isimlerden biri olmuştur. Kıraat-i seb'a anlayış ve kabulünün yaygın olduğu bir dönemde yazmış olduğu tefsiri de kıraat ilmi açısından önem arz etmektedir. Tefsir, yazılış yöntemi ve içerdiği bilgiler açısından birçok alanda dikkat çektiği gibi ihtiva ettiği kıraatler ve bu kıraatlerin tefsire etkileri bakımından da önemli görülmektedir. Bu sebeple en-Nüket ve'l-uyûn isimli tefsirin kıraatler açısından incelenerek müfessirin kıraatlere yaklaşımının ve kıraat farklılıklarını tefsirinde değerlendirme yönteminin tespit edilmesinin alana faydalı olacağı düşünülmüştür. en-Nüket ve'l-uyûn adlı tefsirdeki kıraatlerin konu edildiği bu çalışma üç bölümden oluşmaktadır. Birinci bölüm Mâverdî'nin hayatı, ilmî kişiliği, eserleri, tefsiri ve metoduna ilişkin konuları içermektedir. İkinci bölümde tefsirde geçen kıraatler, lehçeler, fonetik ve ferş ihtilafları bağlamında ele alınmıştır. Üçüncü bölümde ise kıraatlerin tefsire olan etki ve katkılarıyla kıraatlerden istifade edilen yönler örneklerle incelenmiştir. Söz konusu eserde Mâverdî, sahih kıraatlerin yanı sıra şâz kıraatlere de değinmektedir. Bununla birlikte genellikle dönemin kabul gören kıraat anlayışı doğrultusunda, sadece kıraat-i seb'a imamlarının isimlerini zikrederek kıraatleri nakletmektedir. Kıraat ihtilaflarını ve bunlara dair açıklamaları, şahıs isimlerine atfederek ve sıralayarak vermeye özen göstermektedir."
