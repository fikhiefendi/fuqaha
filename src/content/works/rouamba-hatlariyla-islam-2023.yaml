abstract: "Bu araştırmada evlilik nafakası, bu nafakayı hak etme şartları, hükmü, meşru olmasına dair deliller ve İslam hukukuna göre koca nafaka vermediği zaman ortaya çıkan sonuçlar incelenmiştir. Fakihlerin bu konudaki görüşleri, ihtilafları ve görüşlerine dair delillerine yer verilmiştir. Bu çalışma neticesinde kadın kocasıyla birlikte kalsın veya ayrı kalsın, zifaf gerçekleşsin veya kadının rızası olduğu halde zifaf gerçekleşmesin sahih bir nikah akdi sonucu kadının nafakasının koca üzerinde vacip olduğu sonucuna ulaşılmıştır. Bu çalışmada ayrıca kocanın gaip olması durumunda da onun kendi eşine nafaka vermesi gerektiği sonucuna ulaşılmıştır. Nafaka ile ilgili fakihlerin görüşleri, Kitap ve sünnetten delilleri zikredildikten sonra Burkina Faso Aile Hukuku'nun nafakayla ilgili tutumuna yer verilmiştir. Bu konuda İslam Hukuku ve Burkina Faso Aile Hukuku karşılaştırılmıştır. Bilindiği üzere Burkina Faso, Fransa sömürgesi altında olduğundan onun Aile Hukuku'nun çoğu Fransa devletinin Aile Hukuku'nda alınan pozitif bir hukuktur. Yapılan karşılaştırma neticesinde Burkina Faso Aile Hukuku'nun çok az meselede İslam Aile Hukuku'na benzediği görülmüştür. Bu çalışma iki bölümde ele alınmıştır. Birinci bölümde evlilik nafakasının tanımı, hükmü, bu nafakayı hak etme durumları ve şartları ele alınmıştır. İkinci bölümde kadının nafaka hakkı, kocanın bu nafakayı vermemesinin cezası, kendisine nafaka verilmeyen kadının boşama talebinde bulunma hakkı konusu incelenmiştir."
