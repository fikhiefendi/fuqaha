abstract: "Şer'iyye sicilleri; Osmanlı kent toplumunun hukuki, sosyal ve idari işleyişini ortaya koyan temel başvuru kaynakları arasında yer alır. Söz konusu defterler, bireylerin kendi aralarındaki ilişkilerinin yanı sıra devletle kurdukları hukuki bağları da görünür kılarak, özellikle yazılı ve sözlü hafızanın sınırlı kaldığı durumlarda geçmişe dair önemli veriler sunar. Bununla birlikte, Mardin özelinde şer'iyye sicillerine dayalı çalışmaların sınırlı olması bu zengin kaynakların henüz yeterince değerlendirilmediğini göstermektedir. Çalışma, 1890-1892 yıllarına ait hükümleri ihtiva eden 185 Numaralı Mardin Şer'iyye Sicili defterinin transkripsiyonu ve analizi üzerinden, Mardin'de hukuki temsil (vekalet) uygulamalarını merkeze almaktadır. Çünkü defterin muhtevası incelendiğinde kayıtların büyük ölçüde dava vekili (avukat sınıfı) tayinlerine ilişkin olduğu görülmektedir. Bu durum, Mardin'de dava vekilliği müessesesinin yaygın bir kullanım alanı bulduğunu ve henüz kurumsal bir baro yapısı oluşmamış olsa da belirli bir uzmanlık zümresinin fiilen varlık gösterdiğini ortaya koymaktadır. Çalışmada, dava vekilliği uygulamaları üzerinden Mardin toplumunun mahkemeye erişim ve hak arama pratikleri analiz edilerek dönemin hukuki pratikleri çerçevesinde Müslim ve gayrimüslim unsurların birbirleriyle ve devletle kurdukları ilişkiler değerlendirilmektedir. Bu yönüyle araştırma, şer'iyye sicillerinin yalnızca birer hukuki kayıt değil aynı zamanda taşrada hukuk kültürünün oluşumuna ışık tutan tarihsel belgeler olduğunu göstermeyi amaçlamaktadır."
