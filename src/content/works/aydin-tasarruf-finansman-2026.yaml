abstract: "Türkiye'de 1990'lı yılların başlarından itibaren ortaya çıkan tasarruf finansman şirketleri, uzun süre boyunca özel ve bütüncül bir hukuki düzenlemeye tabi olmaksızın faaliyet göstermiştir. Bu süreçte sektörün niceliksel olarak büyümesi, yeterli denetim ve normatif altyapının bulunmamasıyla birleşerek çeşitli uygulama sorunlarının ve müşteri mağduriyetlerinin ortaya çıkmasına neden olmuştur. Faiz yasağı ilkesini esas alan tasarruf finansman sistemi, bireylerin belirli bir organizasyon çerçevesinde tasarruflarını ortak bir havuzda bir araya getirmeleri ve söz konusu kolektif birikim aracılığıyla finansmana erişmelerini mümkün kılan özgün bir finansman modelidir. 07.03.2021 tarihinde yürürlüğe giren Kanun ile“ Tasarruf Finansman”adı altında hukuki kimlik kazanan sistemin temelini oluşturan“Tasarruf Finansman Sözleşmesi”; yapısal özellikleri, taraflar arasındaki hukuki ilişkiyi belirleyici niteliği ve katılım esasına uygun finansman araçlarına yönelen bireyler bakımından giderek artan uygulama alanı nedeniyle bu çalışmanın ana inceleme konusunu teşkil etmektedir. Çalışmamızda,“Tasarruf Finansman Sözleşmesinin”Türk hukukundaki uygulama biçimi yürürlükteki mevzuat kapsamında değerlendirilmiştir."
