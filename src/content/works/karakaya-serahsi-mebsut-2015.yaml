abstract: "Hicrî IV. ve V. asır müellifleri olan Cessâs ve Serahsî Zahirü'r-Rivaye'nin muhtasarı mahiyetindeki el-Kâfî ve Muhtasaru't-Tahâvî isimli eserleri şerh etmektedirler. Şerhu Muhtasaru't-Tahâvî ve Mebsût isimli bu şerhler aynı kaynaktan beslenmiş fakat farklı asırlarda yazılmışlardır. Bu çalışmada ilgili eserlerin Edebü'l-Kâdî bölümü mukayese edilmiştir. Öncelikle müellifler tanıtılmış, müelliflerin hayat şartlarının eserin ilgili bölümüne yansımaları değerlendirilmiştir. Cessâs ve Serahsî'nin eserlerinin Edebü'l-Kâdî bölümünde kullandıkları sistematik incelenmiştir. Ayrıca uslüp ve dil açısından ilgili bölüm mukayese edimiştir. Edebü'l-Kâdî bölümündeki konular tespit edilip ihtiva ettikleri konular mukayese edilmiş Mebsût'ın ilgili bölümünün daha şamil olduğu sonucuna varılmıştır. Hükümler paralel bir biçimde incelenmiş hükümler açısından benzerliklerin yanında farklılıklarında olduğu gözlenmiştir. Hükümlerin dayanak noktaları incelendiğinde Cessâs ve Serahsî'nin Hanefî Ekolünden olmasının etkisi olarak Hanefî âlimlerin görüşlerine sıkça yer verdikleri ve hükümleri açıklama noktasında farklı delilleri kullandıkları görülmüştür."
