abstract: "Bu tez Cumhuriyet Üniversitesi Sosyal Bilimler Enstitüsü'nde Yüksek Lisans Tezi olarak hazırlanmıştır.Bu tezde, İslam'a göre nikahın hangi hallerde tamamen geçersiz olduğu, hangi hallerde nikahın devam ettiği ve hangi hallerde sona erdiği incelendi.Bu tez bir giriş ve üç bölümden oluşmaktadır.Giriş bölümünde ana hatlarıyla nikah ile ilgili bilgilere yer verilmiştir.Birinci bölümde mutlak butlan ve nisbi butlanın tanımı ve aralarındaki farklar izah edilmeye çalışılmıştır.İkinci bölümde batıl nikah kapsamına giren evlilik çeşitleri detaylı bir şekilde ele alınmıştır.Üçüncü bölümde batıl nikahın hukuki sonuçları ve cezai yönü izah edilmeye çalışılmıştır.Sonuç bölümünde ise konu ile ilgili değerlendirme yapılmıştır."
