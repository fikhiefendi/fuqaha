abstract: "Fıkıh, insanlara nasıl ibadet edeceklerini öğrettiği için ilim talep edenin öğrenmesi gereken en önemli ilimlerdendir. Araştırmacıyı bu konuyu incelemeye sevk eden en önemli saik budur. Gerek mukayeseli İslam hukuku gerekse de Hanbelî fıkhını araştıranların Ebu'l-Hattâb'ın tahâret ve namazla ilgili görüşlerine itibar etmeleri de bu konunun seçilmesinde etkili olmuştur. Ebu'l-Hattâb'ın tahâret ve namazla ilgili görüşleri tespit edilirken tümevarım, görüşlerle ilgili deliller tartışılırken analitik yöntem kullanılmıştır. Görüşler birbiriyle kıyaslanıp, günümüz için en uygun görüşü tercih ederken karşılaştırma yöntemine müracaat edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Araştırmada elli iki başlık seçilmiş, bu başlıklar ilmi bir şekilde ele alınmış, başta Ebu'l-Hattâb olmak üzere konuyla ilgili görüşler sıralanmış, her görüşün dayandığı deliller açıklanmış, sonuçta da görüşlerden biri tercih edilmiştir. Ebu'l-Hattâb, serdettiği görüşlerden %36.54 inde Hanbelî mezhebinin görüşünü tercih etmişken; %63.46 sinde muhalif bir görüş benimsemiştir. Bu durum onun mezhebe körü körüne bağlanmadığını, bağımsız düşünebildiğini göstermektedir. Ebu'l-Hattâb'ın fıkhın ince konularını detaylı bir şekilde tartışması, onun mahareti ve fıkıh ilmindeki önderliğini göstermektedir. Hanbelîler onun görüşlerini önemsemiştir. Onun mezhebe muhalif görüşleri bile Hanbelî fıkıh kitaplarında yer almaktadır. Araştırmacı, Ebu'l-Hattâb'ın muamelât, ahkâm, aile hukuku, hadler ve ceza hukukuyla ilgili henüz araştırılmayan diğer görüşlerinin de araştırılmasını tavsiye etmektedir."
