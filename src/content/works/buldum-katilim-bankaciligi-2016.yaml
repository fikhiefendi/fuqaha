abstract: "Türklerin, bankacılık faaliyetlerine başlaması 19. Yüzyılda Osmanlı Devleti Dönemi ile gerçekleşmiştir. Daha sonrasında Türkiye Cumhuriyeti Devleti'nin kurulması ile birlikte bankacılık üzerine birçok yenilikler ortaya çıkmıştır. Dünyada 1970'li yıllarda etkisini gösteren katılım bankacılığı, Türkiye'de ilk olarak 1983 yılında çıkan Kanun hükmünde kararname ile özel finans kurumlarının kurulmasına izin verilmesi ile birlikte tanınmaya başlamıştır. 2005 yılına kadar özel finans kurumları olarak adlandırılan katılım bankaları 2005 yılında çıkarılan 5411 sayılı Kanun ile birlikte ''Katılım Bankaları'' unvanını alarak ticari bankacılık faaliyeti gösteren diğer bankalarla daha yoğun bir şekilde rekabet etmeye başlamıştır. Çalışmada, özellikle 2005 yılı sonrası Türkiye'de katılım bankacılığının son durumu, katılım bankacılığı ürünlerinin tanıtımı, katılım bankacılığının Dünya ve Türkiye tarihindeki gelişimi ile birlikte, son yıllarda gözde yatırım aracı olarak görülen sukuk (kira sertifikası) ürünün; tarihi, gelişimi ve türleri anlatılarak Kuveyt Türk Katılım Bankası A.Ş. bankasının ihraç ettiği kira sertifikaları uygulamalı olarak anlatılmıştır."
