abstract: "Kadınlar için ibadetlerde mükellefiyetin başlangıcı sayılan âdet, aynı zamanda kadının ibadet hayatını etkileyen en önemli faktördür. Tıbbi müdahalelerden bazıları kadının âdet döngüsünü değiştirerek âdet düzenini olumsuz etkilemekte ve bu durum kadının ibadete hayatına yansımaktadır.“Modern Doğum Kontrol Yöntemlerinin Kadının İbadet Hayatına Etkileri”başlığı ile ele alınan bu çalışmada kullanılan yöntemlerin kadının âdet düzenini değiştirmesi sonucunda ibadet hayatına olan etkileri ve bu durumda yapılan ibadetlerin geçerliliği araştırılmıştır. Son yıllarda özellikle kadınların hac ve umrede âdet olmadan bu dönemlerini geçirmek istemeleri âdet geciktirici ilaçların kullanımında artışa sebebiyet vermiştir. Doğum kontrol haplarıyla benzer etkileri olması sebebiyle âdet geciktirici ilaçlar da araştırma kapsamına dâhil edilerek bu şekilde yapılan ibadetlerin meşruiyeti incelenmiştir. Üç bölüm olarak ele alınan bu çalışmanın birinci bölümünde doğum kontrol yöntemi, aile planlaması ve nüfus planlaması arasındaki farklara değinilerek son yıllarda doğum kontrol yöntemlerinin artış göstermesinde, modern paradigmaların etkilerine yer verilmiştir. İkinci bölümde İslâm'ın doğum kontrol yöntemlerine bakışı araştırılarak konuyla ilgili hadisler ve mezheplerin görüşleri incelenmiştir. Aynı zamanda günümüzde yaygın olarak kullanılan modern doğum kontrol yöntemleri tıbbi açıdan araştırılarak uygulanan bu metotlar İslâm hukuku açısından değerlendirilmiştir. Üçüncü bölümde modern doğum kontrol yöntemlerinin kadının âdet düzenini değiştirmesi açısından hangi ibadetleri etkilediğine değinilmiştir. Ayrıca âdet halinde muaf olunan ibadetleri yapmak gayesiyle âdet geciktirici ilaç kullanılmasının zarûriyyâtı ve bu şekilde yapılan ibadetin geçerliliği araştırılmıştır. Kadınların âdet düzeni ile ibadet hayatı arasında bağlantı olması sebebiyle âdetin doğal döngüsüne yapılacak müdahalelerden kaçınılması, ibadetlerin gönül huzuru içerisinde eda edilebilmesi için fıtrata uygun davranılması, karşılaşılan sorunların çözümüne katkı sağlayacaktır."
