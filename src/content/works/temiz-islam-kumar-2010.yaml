abstract: "Kumarın haram olduğu hususunda İslâm âlimleri hemfikirdir. Ancak, kumarı yasaklayan ayet ve hadislerde geçen ?meysir? kelimesinin kapsamı tam olarak tespit edilebilmiş değildir.Bir gurup İslâm hukukçusu, nassların o dönemde mevcut olan meysiri yasakladığını ileri sürerken, çoğunluk ise, meysir adındaki oyunla birlikte buna benzeyen bütün uygulamaları yasakladığı görüşündedir.İnsanlar arasında düşmanlığa, kine ve nefrete sebep olması, Allah'ı anmaktan ve namazdan alıkoyması, malın batıl yollarla harcanması kumarın yasaklanma gerekçeleri arasında yer almaktadır. Kumara benzeyen ve kumarın yasaklanma gerekçelerini taşıyan bazı çağdaş muameleleri de kumar kapsamında değerlendirmek ve yasaklanmış olduğunu söylemek mümkündür."
