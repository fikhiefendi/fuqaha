abstract: "İmam Mâlik, hem geride bıraktığı ilmî mirasla hem de talebeleriyle İslâm hukuku tarihinde önemli bir mevki elde etmiş ender şahsiyetlerden biridir. İmam Mâlik ayrıca günümüzde yaşayan dört büyük mezhepten biri olan Mâlikîlik mezhebini kuran önemli müçtehitlerden biridir. Hadis-fıkıh karışımından oluşan Muvatta'yı yazan Mâlik, fıkıh usûlünün teşekkül etmesinde önemli bir rol oynamıştır. Bu açıdan fıkıh usûlünün fer'i ve aslî delillerini etkin bir şekilde kullanan İmam Mâlik, fer'i deiller arasında yer alan sahâbe kavlini de hüccet olarak kullanmıştır. Sahâbe görüşü, sahâbe fetvası anlamında kullanılan sahâbe kavli fıkıh usûlü fer'i kaynakları arasında yer alan bir delildir. Bir çok müçtehit gibi İmam Mâlik de sahâbe kavliyle ihticac etmiştir. İmam Mâlik, fıkıh usûlünün oluşumuna etki eden sahâbe fetvalarından müstağni kalmamıştır. İmam Mâlik, sahâbe kavlini belli kriterle çercevesinde hüccet olarak kullanmıştır. Belli bir sistematiğe sahip olan İmam Mâlik, özellikle Amel-i Ehl-i Medîne delili karşısında sahâbe kavlini ciddi bir kirite tabi tutmuş; Amel-i Ehl-i Medîne'ye aykırı sahâbe kavliyle amel etmemiştir."
