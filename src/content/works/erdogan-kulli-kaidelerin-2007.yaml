abstract: "Islam Hukuku iki ana temel iizerine bina edilmistir. Bunlardan biri taabbudi konulardir ki tartisma gotiirmez konular olup nass (Kuran ve Siinnet) la sabitlenmislerdir. Digeri ise muamelat konulandir. 1. Muamelat'in konulan zaman ve zemine gore degisebilmektedir. Muamelat'in ana konulanndan olan Kitabii'l-Biiyii, Kitabii's-Sarf, Kitabii'l-icare, Kitabii's-Serike, Kitabii'l-Mudarabe, Kitabu'l-Muzaraa bolumleri zaman ve zemine gore sekil ve icerik acisindan en cok degisebilen konulardir. 2. Hanefi Fikhi ise fikih ekollerinin ilki ve en cok mensubu olan bir ekoldur. Bu ekoliin ilk otoritelerinin goruslerini toplayan ve kendinden sonrakilere kaynaklik eden hacimli bir eser olan Imam Serahsi'nin Kitabu'l-Mebsut ismli eseri Islam Hukukunda cok onemli bir mevkiyi haizdir. 3.Kulli kaidelerin Islam Fikh'inda yuksek hukuki degerleri vardir. Bu kaideler Fikih'ta Kuran ve Sunnetten sonra en cok kullanilan gerekcelerdir. Bu cahsmada yukandaki iic yargidan hareketle Imam Serahsi'nin Kitabu'l-Mebsut ismli eserinde, bu konular islenirken kiilli kaideler kullamlmis mi? Kullamldiysa hangi sikhkla kullamlmis? Nasil kullamlmis? Hanefi ekolii cagimn problemlerini cozerken kulli kaidelerden ne sekilde faydalanmis? v.b. sorulara cevap bulmaya cahsilmistir. Bu sorulara bulunan cevaplar bizi; a. Gecmiste medeniyetler kuran Islam dunyasimn beyin takimimn yani ulemamn olaylarabakisacisimanlamaya, b. Gunumuz problemlerini cozmede bir ufuk kazanmaya, c. Hukuk tarihi acisindan Islam Hukuku'nun zenginligini kesfetmeye, d. Hukuk'ta gerekcenin onemini anlamaya e. Islam hukukcularimn degisim yaklasimlarim kavramaya yardimci olmustur. Bu cahsma bir giris ve iic bolumden olusmaktadir. Giris bolumunde cahsma ile ilgili temel kavramlar incelenmis bu kavramlarm mahiyeti ortaya konmaya cahsilmistir. Bunlar 'kulli kaideler', 'kulli kaidelerin mahiyeti' 'buyii kavram. ve bu kavram.n kapsam.', 'icare' ve 'serike' ele kavramlar.d.r. Bu kavramlar konularm daha iyi anlasilmasi icin on bilgi olusturacak kadar incelenmistir. Birinci bolumde Serahsi'nin Kitabu'l-Mebsut adh eserinin Buyii ve bunun alt kapsaminda Selem Sarf bolumleri taranmis ve bu bolumlerde kullanilan kulli kaideler ortaya konulmaya cahsilmistir. ikinci bolumde aym islem icare kismi icin yapilmistir. Ucuncu bolumde ise Sirketler, Mudarabe ve Muzaraa bolumleri taranmistir. Bunun sonunda Hukuk Tarihi acisindan islam Hukuku'nun; basit bir cahsma ile bile doktrinel malzeme acisindan ne kadar zengin oldugu anlasilmistir. Bu zenginlik sadece Muslumanlarm degil insanhgin ortak mahdir."
