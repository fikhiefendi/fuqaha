abstract: "Hâfız Kutbüddîn el-Haydırî (894/1489), el-Ğarâm bi edilleti'l-ahkâm adlı eserini, fukahânın metoduyla ve Şâfiî mezhebine uygun şekilde te'lif etmiştir. Eserine bir mukaddime ile başlamış, orada yöntemini ve kitabında kullandığı kaynaklarını anlatmış; ardından İslâm kavâidinin esası olduğu ifade edilen hadîsleri verdiği bir bâb ile giriş yapmıştır. Eserde 2136 hadîs içeren 28 fikhî bölüm (kitâb) zikretmiş ve bir sonuç (hâtime) bölümü ile tamamlamıştır. Hâtime'de, mükerrer hadîslerin seçiminde, onlara hüküm verilmesinde ve mânalarının açıklanmasındaki yöntemini izah etmiş, sonrasında da Câmiu'l-mehâsin adını verdiği ve güzel edeblerden bahseden hadîsleri zikrettiği bir bâb ile kitabını bitirmiştir. Müellif eserini, konuyla ilgili hacimli eserlere müracaat etmekten, temel birçok meseleyi araştırmaktan talebeyi müstağni kılacak şekilde muhtasar tutmuş ve böylece istifâde kolaylığını temine çalışmıştır. Müellif Kutbüddîn el-Haydırî, Şeyhu'l-İslâm Hâfız İbn Hacer el-Askalânî (852/1448)'nin yakın talebelerindendir. Bizzat hocası onu“Hâfız”diye vasfetmiştir. Hatta el-Haydırî, İbn Hacer'in kendilerine özel nasihatlerde bulunduğu on kişiden birisidir. Müellif kitabını, hocasının kitabı olan Bülûğu'l-merâm'ın tarzı üzere yazmıştır. Ondan hem istifâde etmiş hem de bazı önemli ilavelerde bulunmuştur. Bununla birlikte hocasının bir takım hatalarına notlar (istidrâk) düşmüştür ki biz de iki kitap arasında mukâyese yaptığımız bölümde bunlara dikkat çektik. Müellif el-Haydırî, eserine aldığı ahkâm hadîslerinin mânalarını ve garîb kelimelerini açıklamış, münekkit muhaddislerin sözlerinden istifâde ederek isnâdlardaki illetler ve râvîler hakkında değerlendirmelerde bulunmuş, çoğu yerde onların hadîsler hakkındaki hükümlerini tahkîk etmiş ve hadîslerin tahrîcinde bir takım önemli ve yararlı malumâta (letâif-fevâid) dikkat çekmiştir. Böylece tahrîc, ilel, cerh-ta'dîl ve hadîslerin mânalarını izah hususunda ilmî yöntemin gereğini hakkıyla ifa etmiştir. Bütün bunlar, el-Haydırî'nin eserine, aynı alandaki diğer çalışmaların çoğundan daha üstün bir özellik kazandırmıştır. el-Ğarâm bi edilleti'l-ahkâm üzerine yaptığımız bu çalışma, iki bölümden oluşmaktadır. Birinci bölümde; müellifin hayatı, en önemli eserleri ve üstlendiği vazifeler ele alınmış, hem bu eser hem de ilgili önceki eserler ile nüshalar tanıtılmış, arkasından el-Ğarâm ile Bülûğu'l-merâm'ın“muhtevâ, kitablar, bâblar ve tahrîc”bakımından mukâyesesi yapılmıştır. İkinci bölüm ise, kitabın iki farklı yazma nüshaya dayanan tahkîkli neşrini içermektedir ki bu yazmalardan biri müellifin hattıyla, diğeri ise kendisi hayatta iken kaleme alınmıştır. Yaptığımız tahrîc çalışması, isnâdlar hakkındaki hükümleri, el-Ğarâm'daki hadîsler ile Bülûğu'l-merâm'daki hadîslerin mukâyesesini içermektedir. Bizi bu çalışmayı tamamlamaya muvaffak kılan Allah'a hamd ederiz."
