abstract: "Bir sahâbînin fıkhî bir mesele hakkında vaki olan uygulamasına, fetvasına veya kazasına sahâbî kavli denilmektedir. Hüccet sayılıp sayılmaması tartışmalı olduğu için bir ictihadda bulunurken kaynak olarak kullanılması kimi fakihler tarafından çeşitli yönlerden eleştiriye maruz kalan delillerden birisi sahâbî kavlidir. Bu çalışmada, kaynak kişi olarak sahâbîden Abdullah b. Mes'ûd'un ictihadlarının, Şâfiî'nin fıkıh mirasına olan katkısı ve yansımaları benimsenen veya benimsenmeyen kanaatleri temel ibadetler bağlamında detaylı bir biçimde ele alınmıştır. Çalışma neticesinde Şâfiî'nin sahâbî kavlini hüccet olarak kabul ettiği ve kıyasa öncelediği ortaya konmaya çalışılmıştır. Çalışmamızda bir giriş ve iki bölüm bulunmaktadır. Giriş kısmında konunun amacı ve önemine, sınırlandırılmasına, araştırmanın yöntemi ile kaynaklarına dair genel bilgiler yer almıştır. Çalışmanın birinci bölümünde Abdullah b. Mes'ûd'un İmam Şâfiî tarafından benimsenen ictihadları tahâret, namaz, zekât ve hac başlıklarının altında yer alan on beş konu etrafında incelenirken; ikinci bölümde Şâfiî tarafından Abdullah b. Mes'ûd kaynaklı ictihadların benimsenmeyenleri on üç başlık halinde tahâret ve namaz üst başlığı ekseninde delilleriyle birlikte tartışılmıştır. Mukayeseli fıkıh yöntemiyle ele alınıp incelenen her meselenin son kısmında tarafımızca bir değerlendirme yapılmış, çalışmanın nihayetinde on bir maddeden müteşekkil bir sonuca ulaşılmıştır."
