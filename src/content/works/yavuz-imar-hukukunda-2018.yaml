abstract: "Anayasa ve Avrupa İnsan Hakları Sözleşmesi ile korunan mülkiyet hakkının kamu yararı nedeniyle sınırlanması mümkündür. Sağlıklı ve düzenli kentleşme için hazırlanan imar planları ile bazı kişilerin mülkiyet hakkı kısıtlanabilmektedir. İmar planlarında kamusal alana ayrılması suretiyle taşınmaz malikinin mülkiyet hakkının uzun yıllar kısıtlanması halinde kamulaştırmasız el atma kavramı karşımıza çıkmaktadır. Kamulaştırmasız el atma önceden yalnızca fiili el atma olarak kabul edilmekteydi. Yargı kararlarıyla taşınmazın imar planlarında kamusal alana ayrılması ve uzun yıllar kamulaştırılmaması nedeniyle mülkiyet hakkının ihlal edilmesi de kamulaştırmasız el atma olarak kabul edilmeye başlanmıştır. Yargı içtihatlarıyla şekillenen kamulaştırmasız el atmaya ilişkin son yapılan kanun değişikliği ile düzenlemeler getirilmiştir. Kamulaştırmasız el atmanın tanımı yapılarak unsurları, hukuki niteliği ortaya konularak Avrupa İnsan Hakları Mahkemesi, Anayasa Mahkemesi, Uyuşmazlık Mahkemesi, Yargıtay ve Danıştay tarafından verilen kararlar ışığında son yapılan değişikliklerle birlikte geçirdiği süreç incelenmiştir."
