abstract: "II/VIII. asırda Endülüs'e İmam Mâlik'in Mısırlı talebelerinden intikal eden Mâliki mezhebi, zamanla bölgede hâkim mezhep haline gelmiş ve Endülüs'ün düşüşüne kadar bu coğrafyada varlığını sürdürmüştür. İmam Mâlik'in Medineli öğrencilerinden ders alan Endülüslüler ise bu coğrafyaya hadis ve âsârı taşımış ve böylece Endülüs'te bir rey-hadis mücadelesi yaşanmış; sonuç olarak İbnü'l-Kâsım'ın görüşlerini esas alan ve mesâile ağırlık veren Mısır ekolü, Yahya el-Leysî'nin etkisiyle Endülüs'te baskın hale gelmiştir. Bu iki ekol arasındaki gerilim III/IX. asrın sonlarına gelindiğinde hafiflemiştir. İbn Abdilberr (ö. 463/1071), böyle bir ilmi ortamda dünyaya gelmiş ve V/XI. asrın Endülüs'ünde Mâlikî mezhebinin önemli temsilcilerinden biri olmuştur. Bu çalışmada, 95 yıllık ömründe pek çok alanda telifte bulunan İbn Abdilberr'in el-Kâfî fi'l-fıkh isimli muhtasarı şekil ve muhteva açısından incelenerek mezhep içindeki yerini ortaya konmuştur."
