abstract: "İslâm borçlar hukukunda önemli ve geniş bir yere sahip olan vekâlet akdinin türlerinden birisi olan dâva vekâleti, dâvanın taraflarından biri olan müvekkilin mahkeme huzurunda temsil edilmek için verdiği vekâlettir. Günümüzde avukatlık adı altında önemli bir yeri olan bu hukuki işlem, çalışmamızda özellikle vekil ve müvekkil arasındaki iç ilişki vurgulanarak incelenmiştir. Dâva vekâleti hakkında literatürde yer alan bilgiler ışığında hem borçlar hem de usul (yargılama) hukuku konusu olan dava vekâletine dair fıkıh âlimlerinin benimsedikleri prensipler anlaşılmaya çalışılmıştır. Tezde, toplumdaki hukuki ve iktisadi ilişkilerin gelişmesine paralel olarak günümüzde ücretli olarak gerçekleştirilen vekâletin bu türüne dair, İslâm hukukunda da benzer imkanların olduğu ortaya konmuştur. Ayrıca, fıkhın erken dönem kaynaklarından başlayıp, Osmanlı'da Tanzimat'ın ilanı ile başlayan hukuki reformlara kadar dâva vekâletinin hukuki gelişimi tespit edilmeye çalışılmıştır. Bu bağlamda Osmanlı hukukunda dâva vekâletine ilişkin günümüzdeki avukatlığa geçiş mahiyetinde önemli adımlar atıldığı görülmüştür."
