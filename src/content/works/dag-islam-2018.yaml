abstract: "Bu çalışmada, akdi inşa eden tarafların sübjektif gayelerinin akitlerin hukuki sonuçlarına etkisi, İslam hukuku açısından ele alınmaktadır. Batı hukuk sistemlerinde hukuk-ahlak ilişkisi çerçevesinde ele alınan bu problem, çeşitli nazariyelere konu olmuştur. Oluşum ve gelişim şartları itibariyle genel teoriler geliştirme eğiliminde olmayan klasik İslam hukuku eserlerinde ise bu konunun teorik alt yapısı \"niyet\", \"kasıt\", \"makâsıdu'l-mükellef\" terimleri etrafında şekillenmiştir. Çağdaş İslam hukuku araştırmacıları ise pozitif hukuk çalışmalarının etkisiyle \"tarafları akit yapmaya sevk eden şahsî gaye\" anlamında \"sebep\" ve \"bâis\" kavramlarını kullanmayı tercih etmişlerdir. Objektif geçerlilik şartlarını taşıyan bir akdin, tarafların şer'an meşru ve muteber kabul edilmeyen maksat ve niyetleri sebebiyle hükümsüz bırakılıp bırakılamayacağı şeklindeki tartışma, klasik fıkıh eserlerinde nehyin fesada delâleti meselesi ile itibâru'l-meâl delili ve sedd-i zerâi kaidesi çerçevesinde ele alınmıştır. Ayrıca diyânî hüküm-kazâî hüküm ve uhrevî hüküm-dünyevî hüküm şeklindeki ikili hüküm anlayışı da birçok mevzuda tarafların gerçek niyetini tespit etmeye dayalı tartışmalara dayanmaktadır. Fakihler, tarafların şahsî gayelerinin akit ve diğer hukukî işlemlerin uhrevî hükmü üzerinde etkili olduğu hususunda ittifak halindedir. Fakat hangi şartlar altında bunların dünyevî hükmü üzerinde etkili olacağı hususunda aralarında ihtilaf vardır. Mâlikî ve Hanbelî mezhepleri bu hususta sübjektif kriterleri esas almışlardır. Onlara göre taraflardan birini hukuki muamelede bulunmaya sevk eden şahsi gaye, şer'î esaslara aykırı olduğu takdirde, akdi hükümsüz bırakır. Bunun için söz konusu gayeyi, karşı tarafın bilmesi veya bilme imkânının olması yeterlidir. Hanefî ve Şâfiî mezhepleri ise daha objektif kriterler belirlemişlerdir. Onlara göre tarafların şahsî gayelerinin akitler üzerinde etkili olabilmesi için ya irade beyanında şart koşma şeklinde sarahaten zikredilmiş olması ya da akdin mahallinin tabiatından anlaşılabilir nitelikte olması gereklidir. Bu hususta Zâhirîler, irade beyanını esas alan bir yaklaşıma sahiptir. Zeydî fakihlerin görüşleri ise bazı meselelerde Hanefîler, bazı meselelerde ise Şâfiîler ile benzerlik taşımaktadır. Caferî fakihler de genellikle objektif kriterleri esas almışlardır."
