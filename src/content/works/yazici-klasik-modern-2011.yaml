abstract: "İslam dininin temel kaynağı olan Kur'an'ın anlaşılması ve pratiğe dökülmesi İslamî bir hayatın inşası için büyük önem arz etmektedir. Bu önemin farkında olan Müslüman ilim adamları Kur'an'ı anlama ve uygulama noktasında ortaya koydukları eserlerle çok zengin bir literatür oluşturmuşlardır. Bu literatürün en temel eserleri ise Kur'an'ı baştan sona bir düzen dâhilinde ele alıp yorumlayan tefsirlerdir.Kur'an'ı anlama ve uygulama noktasında tefsirlerin rolü yadsınamaz. Çünkü tefsirler hem Kur'an'ı doğru bir şekilde anlamanın anahtarı hem de onun mesajını zaman ve mekan mefhumu olmaksızın insanlara ulaştırmanın en iyi araçlarıdır. Bu nedenle her dönemde Kur'an'ı yeniden tefsir etme ihtiyacı hasıl olmuştur.Geçmiş dönemlerde telif edilen tefsirlerin muhatap kitlesi ilim erbabı iken, matbaanın icadı, kitaba ulaşımın kolaylığı ve okur-yazarlığın artması gibi sebeplerle son dönemlerde telif edilen tefsirlerin önemli bir bölümünde muhatap kitlesi olarak halk seçilmiştir. Bu bağlamda sadece cumhuriyet döneminde ülkemizde telif edilen tefsir sayısı yirmiyi aşmıştır. Telif edilen bu çalışmaların usul ve muhteva açısından incelenip okurların hizmetine sunulması ise önem arz eden bir husustur.Ülkemiz halkının tefsir ihtiyacına cevap vermek amacıyla kaleme alınan Bilmen ve Ateş tefsirlerinin mukayesesini konu edinen bu çalışma üç bölümden oluşmaktadır. Birinci bölümde Allah Resûlü ile başlayan tefsir faaliyetinin günümüze kadar geçirmiş olduğu merhaleler, belli başlı tefsir metodları ve modern dönem tefsir ekolleri incelenmiştir. İkinci bölümde mukayeseye esas aldığımız her iki müfessirin hayatları, eserleri, tefsir formasyonları ve tefsir metodları ele alınmıştır. Üçüncü bölümde ise her iki müfessirin Kur'an ilimlerine, fıkhî ve ilmî tefsire, ehli kitaba ve tartışmalı bazı meselelere yaklaşımları ele alınıp mukayese edilmiştir.Anahtar Kelimler: Ömer Nasuhi Bilmen, Süleyman Ateş, tefsir, klasik, modern."
