abstract: "Taliban, Afganistan'a hâkim olduktan sonra birçok Afganlıyı ve Müslüman dünyasını dehşete düşürecek biçimde, Şeriat'ın yasaklamadığı bazı kuralları, yasaklamış gibi gösteriyordu. Nitekim bu doğrultuda bütün kız okullarını kapatmış, kadınların alışveriş maksadıyla olsa dahi evlerinin dışına çıkmasına çok sınırlı biçimde izin vermeye başlamıştı. Ayrıca müzik, televizyon, video, çocukların uçurtma uçurtması gibi, spor ve oyun dâhil olmak üzere her türlü eğlence yasaklanmıştı.Afgan cihadının parlayan ışığı altında doğan ve gelişen Taliban hareketinin dini anlayışı, zihni alt yapısı İslâm düşünce sistemi içerisinde dar dini anlayışı temsil eden Hâricîliğin bir tezahürü olarak karşımıza çıkmaktadır. Netice itibariyle Taliban, Pakistan medreselerinin ideolojisiyle yetişenler tarafından yönetilen bir oluşumdur. Taliban'ın uygulamaları, Batı'da `İslâmî yönetim' olarak sunulmuş ve İslâm, Taliban'ın nezdinde mahkûm edilmeye çalışılmıştır. Taliban'ın gücü elinde tuttuğu dönemde halka uyguladığı sert muamele ve onlara baskı yapmaları onların İslâm tarihindeki Hâricî hareketiyle paralellik arz ettiğini göstermektedir.Amerika Birleşik Devletleri'nin Afganistan'a Taliban'ı iktidara getirmesinin asıl amacı; bu hareket vasıtasıyla Afganistan'dan Orta Asya ülkelerini denetim altına almaktır. Bununla birlikte İran'ı tehdit ederek, Türkmenistan, Kazakistan ve Azerbaycan gibi ülkelerin petrol ve doğalgazlarına benzeyen yer altı zenginliklerini Afganistan üzerinden geçirerek dünya pazarlarına satması gibi planlar yatmaktaydı. Amerika ilk önce Taliban'ı her açıdan destekleyerek, sonuna kadar kendilerine bağlı kalacağını düşünüp birtakım plan ve hedeflerini bu hareketin vasıtasıyla gerçekleştireceğini ummuştu. Fakat daha sonra Amerika Taliban'dan istediği gibi sonuçları elde edemeyince kendi elleriyle iktidara getirmiş olan dünkü samimi dostunu, artık yok etmeye çalışarak tüm dünyayı bunlara karşı cephe almaya çağırmıştır. Bu gerçek Amerikan'ın ikiyüzlü politikasının sonuçlarını, dini bilmeyen zavallı ve cahil Müslümanların sırtına yüklemek gibi çirkin bir siyasetin örneği durumundadır."
