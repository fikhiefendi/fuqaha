abstract: "ALTERNATİF BİR FİNANSMANKAYNAĞI OLARAK SUKUK Günümüzün yeni yeni önem kazanmaya başlamış gözde finansal kaynak yaratma araçlarından biriside Sukuk uygulamalarıdır. Genellikle körfez ülkelerindeki yatırımcılar tarafından tercih edilen ve İslami kurallara göre şekillendirilmiş Sukuk uygulamaları alternatif bir yatırım aracı olarak diğer ülkelerde de yaygınlık kazanmaya başlamıştır. Bu bağlamda dünya genelinde birçok ülke, Sukuk ile ilgili mevzuat düzenlemeleri yapmakta ve Sukuk fonlarını kendi ülkelerine çekmeye çalışmaktadır. Sukukun uygulanabilir birçok çeşidi bulunmaktadır. Başta Almanya ve Fransa gibi gelişmiş ülkelerde olduğu gibi, Türkiye'de finansal kaynak yaratma aracı olarak, Sukuk uygulamalarına ilişkin uygulama esaslarına kanuni düzenlemelerinde yer veren ülkelerden bir tanesidir. Bu amaçla, Türkiye'de sukuk fonlarının ekonomiye akışının sağlanması adına ve uygulamanın teşvik edilmesi adına bir takım düzenlemeler yapılmaktadır. İlk aşamada vergi kanunlarıyla ilgili yapılan düzenlemelere rastlanmaktadır. Bu çalışma üç ana bölümden oluşmaktadır. Çalışmanın birinci bölümde sukukun genel tanımı, özellikleri, sukuk fonlarının kullanım alanları, sukuk çeşitleri ve sukukun avantajları ve dezavantajlarına yer verilmiştir. İkinci bölümde dünyanın çeşitli ülkelerindeki sukuk uygulamaları ile ilgili bilgilere kısaca yer verilmiş ve Türkiye'deki sukuk ihraçları ve sukuk uygulamaları hakkında değerlendirmelerde bulunulmuştur. Üçüncü ve son bölümde Türkiye'deki sukuk uygulaması olarak adlandırılan kira sertifikaları ile ilgili ayrıntılı bilgilere yer verilmiş ve Kira sertifikalarının tanımı, vergi mevzuatındaki yeri ve kira sertifikalarının vergilendirilmesi ile ilgili yapılan düzenlemeler Türkiye deki uygulamaları açısından ele alınmıştır. Sonuç ve Yorumlar kısmında ise sukuk uygulamalarının ülkemiz açısından genel bir değerlendirmesi yapılmış ve vergi alanında yapılan düzenlemelerin yeterli olup olmadığı yönündeki görüşlerimiz açıklanmıştır. Bu çalışmada amaçlanan, Kira Sertifikaları adıyla uygulama alanı bulan Sukuk'un ülkemiz SPK ve vergi mevzuatında ne gibi değişiklikler meydana getirdiğini ve bu değişiklerin yeterli olup olmadığını belirtmek ve çözüm önerileri sunmaktır."
