abstract: "Bu çalışma, İslami bankalar ve finansal kurumlar için finansal muhasebe kavramları ile ilgili İslami Finans Kurumları Muhasebe ve Denetim Kurumu (AAOIFI) tarafından 1993 yılında yayınlanan (2) sayılı Finansal Muhasebe Tablosunu tanımayı amaçlamaktadır. Ayrıca, Libya'daki İslami bankalarda finansal risklerin yönetilmesinde ilişkinin türünü ve niteliksel özelliklerin rolünü belirlemeyi amaçlamıştır.Çalışmanın sorunu, Libya'daki İslami bankalarda risklerin azaltılmasında Kurumun standartlarına göre muhasebe bilgilerinin özelliklerinin rolünü bilmek olup, amacına ulaşmak için analitik ve betimleyici bir yaklaşım benimsemiştir. Çalışma konusunu destekleyensonuçsal anlamlara ulaşmak için istatistiksel program (SPSS) ve uygun istatistiksel testler ve işlemler kullanılarak çıkarılmış ve analiz edilmiş olup, Çalışma bir dizi sonuca ulaşmıştır, bunların en önemlileri: Muhasebe profesyonellerinin görüşlerinin istatistiksel analizi yoluyla, (AAOIFI) kurulu uyarınca muhasebe bilgilerinin niteliksel özelliklerini elde etmeye finansal muhasebe sisteminin katkısı konusunda sorgulanların geniş bir desteğibulunmaktadır. Bu ise, Libya İslami bankalarının muhasebe bilgilerini kullanıcılarının tahmin etmesi ve karar vermesi için daha kullanışlı hale getirmektedir. Bu ise İslami finans kurumlarının iki tür riskle karşı karşıya olduğunu göstermiştir.Birincisi, kredi, piyasa, likidite ve operasyonel riskleri geleneksel bankalarla paylaşır, İkinci türe gelince, İslami bankalar, varlıklarının ve yükümlülüklerinin ayırt edici doğası nedeniyle kendisine özgüdür.Bu riskler, risk yönetimi süreçleri ve yöntemleri izlenerek önlenebilir.ve muhasebe bilgilerinin kalitesinin yalnızca muhasebe bilgilerinin niteliksel özelliklerine bağlı olmadığı, onları karar vericilerinözellikleriyle ilgiliolarak aşmaktadır. Son olarak, AAOIFI Kurumuna göre muhasebe bilgilerinin niteliksel özellikleri, Libya İslami bankalarında mali tabloların kalitesinin sağlanmasına katkıda bulunmaktadır.Ancak, kaliteyi etkileyen başka faktörler de vardır (yasal, politik, ekonomik, kültürel ve sosyal faktörler, bilgi ile ilgili faktörler ve denetim kalitesi)."
