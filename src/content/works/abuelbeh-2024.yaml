abstract: "Risk kültürü ve kurumların performansı arasındaki ilişki, özellikle risk kültürü ve kurumun performansı ile ilgili mevcut çalışmaların risk kültürünün kurumsal performans üzerinde etkisi olduğunu gösterdiği küresel finansal krizden sonra araştırmacıların dikkatini çeken önemli ilişkilerden biridir. Ne yazık ki, bu çalışmalar az ve gelişmiş ülkelere odaklanıyor. Organizasyonda etkin bir risk yönetimine katkıda bulunan tüm faktörlerin kapsamlı bir şekilde kapsanması nedeniyle risk kültürü için Finansal İstikrar Kurulu modelini benimseyen bu tez, risk kültürü ve Filistin'de faaliyet gösteren bankaların performansı üzerindeki etkisi ile ticari bankalar ve bankalar arasındaki karşılaştırmayı incelemiştir. İslam. Bu bankaların ve bankaların performansını ölçmek için finansal ve finansal olmayan önlemler kullanılmıştır. İki ana değişken için tüm faktörler: bir risk kültürü ve kurumsal performans beş likertli bir ölçek skoru ile ölçülmüş ve daha sonra tanımlayıcı istatistiksel ölçümler kullanılarak analiz edilmiştir. İstatistiksel veriler, yerel ve ithalatçı Filistin'deki lisanslı bankalardan ve 14 banka ve bankadan elde edilen bankalardan elde edilmiştir. Bu çalışma öncelikle farklı riskler kültürünün farklı boyutlarının Filistin'de faaliyet gösteren ticari bankaların ve İslami bankaların finansal ve idari performansı üzerindeki etkisini incelemektedir. Risk kültürü çerçevesinin dört boyutu ve bağımsız değişkenleri olduğundan, performans iki bağımlı değişkene bağlıdır: finansal ve finansal olmayan (idari) performans"
