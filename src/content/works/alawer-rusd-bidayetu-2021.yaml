abstract: "İbn Rüşd el-Hafid, adı Bidâyetü'l-Müctehid ve Nihâyetü'l-Muktesid Kitabı ile ilişkilendirilen Maliki mezhebinin öne çıkan âlimler arasında sayılmaktadır. Bu kitap, mezhepler arası karşılaştırmalı bir fıkıh kitabıdır. Kendisinin Maliki fıkhında herhangi bir kitabı bilinmemektedir. Müellif, Bidâyetü'l-Müctehid ve Nihâyetü'l-Muktesid kitabında meseleleri dört mezhebin görüşlerine arz etmekte, sonra ihtilaf nedenlerini her mezhebin delillerini ortaya koyarak açıklamaktadır. Ardından bu görüşler arasında tercihte bulunmaktadır. Bazen de herhangi bir tercihte bulunmadan sadece meselenin arzıyla yetinmektedir. Çalışmada, İbn Rüşd'ün, mensup olduğu Maliki mezhebi ile irtibat derecesini ve Maliki mezhebinden aktardığı görüşlerin sıhhat derecesini ortaya koymak istedim. Bununla birlikte tercih ettiği görüşlerin mezhebinin görüşlerine uygunluk derecesini de açıklamak istedim. Bu amaçla namaz kitabında yer alan bazı meseleleri inceledim. Çalışma önsöz, iki bölüm ve bir sonuç bölümünden oluşmaktadır. İlk bölümde İbn Rüş'ün biyografisinden, mezhebinden, Bidâyetü'l-Müctehid kitabından, Maliki mezhebi ve gelişim aşamalarından, mezhepte itimat edilen kitaplardan, İbn Rüş'dün Maliki mezhebindeki konumu ve ondan etkilenme derecesinden bahsettim. Uygulamalı bölüm olan ikinci bölümde, beş ana başlık altında on üç meseleyi ele aldım. Her meseleyi iki başlık altında inceledim. a) Mâlikî mezhebinden aktarılan görüşün sıhhat derecesi b) İbn Rüşd'ün tercihi ve bunun mezhebe uygunluğu. Daha sonra hatime bölümünde elde ettiğim sonuçları zikrettim. Bunların en önemlisi, İbn Rüşd'ün, Maliki mezhebi âlimleri arasındaki konumu, kendisinin Bidâyetü'l-Müctehid ve Nihâyetü'l-Muktesid kitabı mezhep içerisinde itimat edilen bir kitaptır. Bunun yanında tercihleri, onun mezhebine bağlı kalmadığınıa delalet etmektedir."
