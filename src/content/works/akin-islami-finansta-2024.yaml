abstract: "1970'li yıllarda artan petrol fiyatları petro-dolar zengini İslami bir kesimin oluşmasını sağladı. 2008 küresel kriz döneminde batılı sistemler zarar görürken İslami finans sisteminin sağlam duruşu dikkatleri üzerine çekmiştir. Dünyada Müslüman nüfus büyüklüğü ve işlemsel hacim genişliği birçok batılı kuruluşu İslami finansa yöneltmektedir. Bu bağlamda ekonomide İslam prensiplerinin uygulanması olan İslami finans, bankacılık, sigortacılık, yatırım fonu, menkul kıymetler vb. alanları içinde barındıran ve gün geçtikçe sistem içine dahil olanlarla kârtopu misali büyüyen bir sektördür. Bu çalışmada, dindarlık ve İslami finansal okuryazarlık düzeylerinin İslami finansta yatırımcı davranışlarının algılanması ve sisteme güven duyulması üzerine etkilerini düzenli gelire sahip kamu çalışanları üzerinden ortaya konulması amaçlanmıştır. Bu bağlamda dindarlık algısı, güven algısı, faiz algısı, İslami finansal okuryazarlık algısı, İslami finans algısı ve İslami finansal tanıtım algısı ölçekleri hazırlanmıştır. Anket aracılığı ile Haziran- Temmuz 2024 tarihleri arasında Türkiye'nin 81 ilinde bulunan 1005 kamu çalışanından toplanan veriler SPSS ve Mplus programı aracılığı ile analiz edilmiştir. 6 adet ölçek ile cinsiyet, yaş, eğitim ve yaşanılan bölge değişkenlerinin yer aldığı Yapısal Eşitlik Modeli 985 anket verisi üzerinden test edilmiştir. Analiz neticesinde, dindarlık algısının İslami finansal okuryazarlığı etkilediği ve bu sayede bireysel yatırımcının İslami finans sektörüne olan güven algısının etkilendiği görülmektedir. Erkeklerin kadın katılımcılara göre dindarlık ve İslami finansal okuryazarlık düzeylerinin yüksek olduğu sonucu elde edilmiştir."
