abstract: "Bu çalışma, modern ekonomilerin temelini oluşturan kaydi para sisteminin İslam iktisadı perspektifinden değerlendirilmesini amaçlamaktadır. Araştırma, kaydi para sisteminin kredi yaratma mekanizmasının İslam iktisadının temel prensipleriyle, özellikle faiz yasağı (riba) ile uyumlu olup olmadığını incelemektedir. Kaydi paranın tarihsel gelişimi, fonksiyonları ve çeşitleri ele alınmış, konvansiyonel kredi sisteminin İslam iktisadı ile karşılaştırılması yapılmıştır. Ayrıca, Murabaha, Mudarebe, Müşareke ve Sukuk gibi İslam iktisadına uygun alternatif kredi modelleri analiz edilmiştir. Bu modellerin kaydi para sistemine alternatif veya tamamlayıcı yaklaşımlar sunup sunamayacakları değerlendirilmiştir. Araştırma, kaydi para üretiminin ekonomik ve sosyal etkilerini, özellikle enflasyon, gelir dağılımı ve finansal istikrar üzerindeki etkilerini İslam iktisadı açısından incelemektedir. Sonuç olarak, kaydi para sisteminin bazı yönlerinin İslam iktisadı prensipleriyle çeliştiği ve faizsiz finans ilkelerine dayalı alternatif modellerin geliştirilmesinin önemli olduğu sonucuna varılmıştır."
