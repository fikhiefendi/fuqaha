abstract: "Fıkıh, İslâm'ın, evrensel prensiplerle insan hayatını her zamanda ve her mekânda düzenleme yeteneğini ortaya koyan önemli bir ilimdir. Özellikle çağımızda fıkıh, bu prensipleri değişen yaşam koşulları çerçevesinde anlamak ve uygulamak için geniş bir perspektif sunar. Onun için güncel fıkhî meselelerin incelenmesi büyük önem arz etmektedir. Söz konusu önemine binaen son çağda yetişmiş önemli İslâm hukukçularından olan Yûsuf el-Karadâvî, bu alanda çalışmalar ortaya koymuştur. Üzerinde en fazla durduğu meselelerden biri de azınlıklar fıkhıdır. Bu bağlamda gayrimüslim ülkelerde yaşayan Müslüman azınlıkların, İslâmî kimliklerini koruyarak ve yaşadıkları toplumlardan izole olmadan dinlerine uygun bir yaşam sürdürmelerinin nasıl mümkün olacağını ele almış, bu konuda İslâm hukukunun temel ilkeleri ve maksatları doğrultusunda çeşitli fetvalar vermiştir. Böylece Müslüman azınlıkların karşılaştığı sorunlara pratik çözümler sunmuştur. Karadâvî, azınlıklar fıkhını, Müslümanların gayrimüslim devletlerde dinî ve sosyal haklarını korumalarını, barışçıl bir birliktelik tesis etmelerini, dinî ve kültürel kimliklerini muhafaza etmelerini ve çağdaş meselelere İslâm hukuku çerçevesinde çözümler üretmelerini sağlayan önemli bir alan olarak görmektedir. Bu alandaki çalışmalarında ictihad yapma, küllî fıkıh kaidelerine dayanma, toplumu odağa alma, çağın gerçeklerini anlama, yararı gözetme, kolaylaştırmayı benimseme, tedricîlik yoluna gitme, zaruretleri merkeze alma ve mezhepsel taassuptan uzak durma gibi temel ilkelere dayanmıştır. Çalışma, Karadâvî'nin görüşlerinin, İslâm hukukunun temel prensiplerine ve çağdaş ihtiyaçlara uygunluğunu ortaya koyarken, Müslüman azınlıkların fıkhî sorunlarına yönelik pratik ve uygulanabilir çözümler sunma çabasını da vurgulamaktadır. Bu yönüyle çalışma hem akademik camiaya hem de gayrimüslim ülkelerde yaşayan Müslümanlara yol gösterici bir kaynak olma niteliği taşımaktadır."
