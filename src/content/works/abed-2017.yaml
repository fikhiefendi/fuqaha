abstract: "Araştırma, İslami bankalar tarafından üretilen banka ürünlerinin yaygınlaştırılmasına ve araştırmaya etkisinin gösterilmesini, İslami bankalardaki tanıtım hedeflerini , önemi ve Şeriat kontrollerini beyan edilmesini ve bu ürünlerin yaygınlaştırılmasında oluşan engelleri göstermeyi amaçlıyor. Araştırma çok sayıda sonuca ulaştı; bunların en önemlileri İslami bankaların çalışmalarının ve devamlılığının pazardaki rekabet etme yeteneklerine bağlı olduğunu , bu rekabetin esas olarak pazarlama yeteneklerine bağlı olduğunu , pazarlama yeteneğinin ve kabiliyetinin her geçen gün artmakta olduğunu ve pek çok kontrol ve unsura sahip olduğu gibi sonuçları ortaya koyulmuştur.Ek olarak İslami bankacılık pazarlamasının hedefleri kısmen geleneksel muadillerinden farklıdır. Çünkü İslami bankalar ekonomik taraftaki pazarlama hedefleriyle sınırlı değil, aynı zamanda başarılı bir bankacılık pazarlaması yaparak elde edilebilecek kültürel ve sosyal hedefleri de içerir. İslami finansal kurumun rolü toplumda onları harekete geçirmenin yanı sıra islam ülkelerinde sürdürülebilir kalkınma ve geliştirmeye büyük katkıda bulunmaktadır. Araştırma önerileri ayrıca islami bankaların çeşitli faaliyetlerinde bankacılık pazarlamasını benimsemelerini ve fikir konseyleri tarafından onaylanan yasal yönergeleri, özellikle de tanıtım kavramı ve hedeflerine ulaşmak için çeşitli araçlar ile pazarlama için geleneksel araçları geliştirmelerini önerdi. İslami bankacılık ve İslami bankalar tarafından benimsenen strateji ve politikaları geliştirmek ve geleneksel bankaların geçmişteki pazarlama deneyimlerini incelemek ve temel alınan İslami bankaların ilkelerini korumaktır"
