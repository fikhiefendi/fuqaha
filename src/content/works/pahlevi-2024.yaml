abstract: "Fikri mülkiyet haklarının sona ermesi, bu dönem dışında, özellikle de son yıllarda bilinmeyen yeni bir konudur. Bu konunun önemi, günümüz insanının bu haklara aşina olması ve artık bu haklara maddi faydalar içermesidir sahibi tarafından faydalanılabileceği gibi başkasına da aktarma yapılabilir, ve aktarma yollarından biri de vakıftır. Bu çalışma, fikri mülkiyet haklarını vakfedilmesi hukuka uygunluğunu İslam hukuku perspektifinden ve Endonezya hukuku perspektifinden ve Endonezya'daki uygulama kapsamını tespit etmeyi amaçlamaktadır. Çalışmanın en önemli sonuçları arasında şunlar yer almaktadır: (1) Endonezya hukuku açısından fikri mülkiyet haklarının bağışlanması yasal meşruiyete sahiptir. Bunun ayrıntıları, yedi hak türünün her birine bağışlamanın hukuka uygun olduğu ve bunun izin verilebilirliği için şart koşulduğudur. Fikri mülkiyet haklarının korunmasına ilişkin kanuna gelince, kanuni olan ve öngörülen üç şey vardır: şekiller, diğer dördüne izin verilmez veya yasaklanmaz. (2) Fikri mülkiyet haklarının durdurulmasının hukuki şartlarından biri, bağış sözleşmesinde imtiyazı verenin haklara sahip olduğunu gösteren delillerin gösterilmesidir. (3) Endonezya hukukunun fikri mülkiyet haklarını durdurmaya yönelik mevzuatı, bağış çemberinin genişlemesine yol açmakta ve tutuklanan kişiler için finansman kaynaklarında artışa yol açmakta, bu da toplumsal dayanışmanın sağlanmasına katkıda bulunmak anlamına gelmektedir. Bu yeni moratoryumun anlaşılmasını ve uygulanmasını kolaylaştırmak amacıyla, fikri mülkiyet haklarının durdurulmasının ayrıntılarını tüm yönleriyle açıklayan kapsamlı mevzuat"
