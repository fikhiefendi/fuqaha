abstract: "Bu makale, ideale benzerlik tercih sıralama tekniğini kullanan Ürdün İslâmi bankalarının finansal performans sıralamasının bulgularını belgelemektedir. Önerilen yaklaşımla, incelenen bankaların finansal performansını etkileyen kriterler belirlenmektedir. TOPSIS ve EDAS yöntemleri, kriterlerin önem ağırlığının ve bankaların performans puanının belirlenmesinde kullanılmaktadır. Bu çalışma, analiz edilen Ürdün İslami bankaların EDAS ve TOPSIS performans puanlarında dalgalanmalar olduğunu keşfetmektedir. Bu sonuç, yalnızca dikkate alınan bankaların performans istikrarsızlığını ortaya koymamaktadır, aynı zamanda günümüzün yoğun rekabet ortamında performans testlerinin önemini göstermektedir."
