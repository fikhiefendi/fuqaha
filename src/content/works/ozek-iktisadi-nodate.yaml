abstract: "Bireysel olarak ibadet kapsamına giren zekât; sosyal, kültürel, siyasi ve ekonomik boyutuyla toplumun iktisadi gelişmesine katkı sağlayacak niteliktedir. Âyet ve hadislerin delaletiyle idareciler tarafından yürütülmesi gereken bir görev olmasına rağmen Müslüman ülkelerin birçoğunda devlet eliyle uygulanmaması, zekâtın sağlayacağı faydaların tam olarak görülmesine engel olmaktadır. Bu çalışmada, önce zekât ve iktisadi gelişme kavramları ilgili diğer kavramlarla birlikte, aralarındaki ilişkiler de dikkate alınarak araştırılmış, sonra zekâtın iktisadi sistemdeki yeri vergi bağlamında ele alınıp mukayesesi yapılmış ve ardından zekâtın kısaca tarihine değinilmiştir. Zekât malları ve harcama kalemleri fıkhi ve iktisadi açıdan incelenmiştir. Ayrıca zekâtın iktisadi dengeler, makro değişkenler ve gelişme göstergeleri üzerindeki etkisi de tetkik edilmiştir. Sonuçta zekâtın anlamının gelişme olduğu, birey ve toplumu maddi-manevi geliştirdiği ve tüm ilahi kitaplarda emredilen bu görevin tarihin belli dönemlerinde de uygulandığı tespit edilmiştir. Hakikaten veya hükmen çoğalan malların temel ihtiyaç ve borçlar çıkarıldıktan sonra nisap miktarına ulaşan kısmından bir yıl sonra belli oranlarda zekât alınmasının, iktisadi anlamda mükellefi sıkıntıya sokmadığı gibi topluma birçok yarar da sağladığı anlaşılmaktadır. Servet ve gelirden alınan zekâtın tüketimden alınmaması, çarpan etkisi, tüketiciye yansıtılamaması ve faizli işlemlere mâni olabileceği gibi tespitler de iktisadi açıdan önemli bulgulardır. Zekât alan ve verenin tüketim ve tasarruf kararlarını etkileyerek yatırım ve istihdamı artırması da ulaşılan başka bir sonuçtur. Zenginlerden harcama kalemlerine aktarılan kaynağın sadece bireyin değil toplumun savunma, eğitim, ulaşım gibi ihtiyaçlarını karşıladığı, gelir dağılımında adaletsizlik, fakirlik, işsizlik, enflasyon gibi sorunların çözümüne katkıda bulunduğu, sosyal güvenlik ve refahı tabana yaydığı görülmüştür. Bu sebeple İslami vergi olarak uygulandığında gerek toplanması gerekse dağıtılmasıyla iktisadi gelişmeyi sağlayacağı ve tüm dünyada uygulanabileceği kanaatine varılmıştır."
