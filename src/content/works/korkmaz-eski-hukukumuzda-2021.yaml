abstract: "Bu çalışmada bir kredi temin yöntemi olarak kullanılan muamele-i şer'iyye, 17. asır Osmanlı kaynakları başta olmak üzere diğer kaynaklar da göz önüne alınarak ele alınmıştır. Günümüz müellifleri bu muameleyi umumiyetle, faizi gizlemek için bir kılıf olarak görmektedir. Şer'iyye sicilleri, arşiv vesikaları, devrin fıkıh/fetvâ kitapları incelendiğinde konuyla ilgili çok sayıda muamele-i şer'iyye ile karşılaşılmış ve çok ciddi bir tatbik sahası görülmüştür. Çalışmada bu kaynaklar incelenerek, muamele-i şer'iyyenin hakikaten faize bir kılıf olarak mı; yoksa faizden kaçınmak için bir ruhsat olarak mı kullanılıp kullanılmadığı açığa çıkartılmaya çalışılmıştır. Osmanlı Devleti'nin bu hukukî muameleye bir tatbik sahası vermekle birlikte çok sayıda düzenleme ile müdahalede bulunduğu müşâhede edilmiştir. Muamele-i şer'iyyenin hususen günümüz faizsiz bankacılık faaliyetleri çerçevesinde de tatbik sahası olduğu düşünüldüğünde, meselenin ortaya konulması bir kat daha ehemmiyet kazanmaktadır."
