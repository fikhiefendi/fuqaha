abstract: "Toplum ve kent tarihi araştırmalarında oldukça büyük bir önemi bulunan Şer'iyye Sicilleri'nden faydalanmadan bir şehrin tarihi hakkında bilgi edinmek mümkün değildir. Çalışmamız 571/161 numaralı Kastamonu Şer'iyye Sicili'nin transkripsiyonu üzerine yapılmıştır. Sicilde mahkeme kayıtları ve belgelerden yararlanılarak sosyal, kültürel, toplumsal, iktisadi ve idari bilgiler elde edilmeye çalışılmıştır.571/161 numaralı Kastamonu Şer'iyye Sicili içerisinde veraset kayıtları, maruzlar ve çeşitli konularda hüccetler bulunmaktadır. Sicilin incelenmesi ile Kastamonu'da bulunan nahiyelerin, mahallelerin, divanların, kasabaların ve kazaların isimlerine ulaşılmıştır. 571/161 numaralı sicil içerisinde yer alan belgelerin doğru bir şekilde transkripsiyonu yapılmaya çalışılmıştır."
