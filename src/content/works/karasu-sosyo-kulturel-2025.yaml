abstract: "Sosyo-kültürel şartların değişmesiyle fıkhî hükümlerde de değişimin kaçınılmaz olduğunu konu edinen bu çalışma, Mecelle-i Ahkâm-ı Adliyye ile Hukûk-ı Âile Kararnâmesi esas alınarak dar bir çerçeveye odaklanmıştır. Çalışmanın ana muhtevası, İslâm hukukunda sosyal, iktisadî, idarî ve kültürel hayata ilişkin fıkhî hükümlerin, örfî hukukla mezcedilerek kanun metinleri haline getirilmesi ve bu metinlerin zamanla sosyo-kültürel şartlara göre değişim göstermesi üzerine inşa edilmiştir. Bu kapsamda, çalışma, Mecelle-i Ahkâm-ı Adliyye ile Hukûk-ı Âile Kararnâmesi'ne kadar olan kanunlaştırma faaliyetlerini ele alarak, konunun tarihsel arka planını ve gelişim sürecini aydınlatmayı amaçlamıştır. Bu amaçla, çalışma üç bölümden oluşmaktadır. Birinci bölümde, Batı dünyasında ve İslâm öncesi Türkler'de gerçekleştirilen kanunlaştırma çalışmaları incelenmiştir. Bu bölümde, öncelikle konuyla alakalı bilinmesi gereken kavramlar tanımlanarak temel oluşturulmuştur. Daha sonra, Batı dünyası ve İslâm öncesi Türkler'de dikkat çeken kanunlaştırma faaliyetleri hukuk sistemleri hakkında bilgiler verilmiştir. İkinci bölümde İslâm devletlerinde ve Osmanlı'da kanunlaştırma faaliyetleri ele alınmıştır. İslâm hukuku çerçevesinde hazırlanan kanunnâmelerin tarihi gelişim süreci üzerinde durulmuş ve özellikle Osmanlı dönemindeki kanunlaştırma faaliyetlerine odaklanılmıştır. Üçüncü bölümde, çalışmanın ana eksenini oluşturan Mecelle-i Ahkâm-ı Adliyye ile Hukûk-ı Âile Kararnâmesi incelenmiştir. Osmanlı hukukunun modernleşme süreci çerçevesinde gerçekleştirilen bu kanunlaştırma faaliyetleri, dönemin sosyo-kültürel olayları neticesinde ortaya çıktığı belirtilerek, İslâm hukukundaki reform niteliğindeki önemi vurgulanmıştır."
