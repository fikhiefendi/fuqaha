abstract: "Osmanlı devleti kendinden önce tarih sahnesinde yerini almış diğer Türk devletlerinden aldığı hukuk mirasını ve kültürel mirası İslam hukuku ile birleştirmiştir. Osmanlı Devleti'nin büyük ölçüde Anadolu Selçuklu, Büyük Selçuklu ve Abbasi Devletleri esas itibariyle İslam hukukuna dayanan bir hukuk düzenine sahiptir. Bu durum da şer'i hukukun yanı sıra örfî hukukun da beraberce uygulandığı bir sistemin oluşturduğunu göstermektedir. Böylece toplum içerisinde meydana gelen suç tiplerine şer'i ve örfî hukuk kurallarına göre farklı yaptırımlar uygulanmıştır. Kısas cezaları, en ağır cezalardan birini teşkil etmektedir.Kısas davaları Osmanlı adli sistemi içerisinde nerdeyse hataya yer vermeyen bir alanı içermekte olup, uygulanacak cezalar da kanunnameler tarafından belirlenmektedir. İncelemiş olduğumuz 10 Numaralı Kısas Defteri'nde Osmanlı adli sisteminin hata affetmeyen bu dalında nekadar adil ve hızlı bir yargılama yapmış olduğunu göreceğiz."
