abstract: "Tez çalışmasında kamulaştırmasız el atmaya ilişkin temel hususlar teorideki fiili ve hukuki el atma ayrımı dikkate alınarak ele alınmış ve her iki ihtimalde mülkiyet hakkı ihlal edilen taşınmaz malikinin açabileceği davalar ile bu davalardan biri olan bedel davasında sıkça karşılaşılan sorunlar incelenmiştir. Yargı içtihatları ile şekillenerek uygulamada kabul gören kamulaştırmasız el atmaya yönelik birtakım kanuni düzenlemeler de çalışmamız içerisinde değerlendirilmiştir. Bu düzenlemelerden bir kısmı; uluslararası sözleşmeler, Anayasa ve kanunlarla korunan temel hak ve hürriyetleri belirli açılardan ihlal ettiği, özel olarak da mülkiyet hakkına esaslı müdahale teşkil ettiği gerekçesiyle iptal edilmiştir. Çalışmamız kapsamında söz konusu iptal kararlarının ve akabinde getirilen yeni düzenlemelerin de detaylı olarak üzerinde durulmuştur. Sıkça yapılan kanun ve içtihat değişiklikleriyle son derece dinamik ve ne yazık ki sağladığı hukuk güvenliği bakımından 'güvensiz' bir alan olan kamulaştırmasız el atmaya dayalı ortaya çıkan sonuçlar incelenmiştir. Kamulaştırmasız el atmaya dayalı olarak açılabilecek davaların hukuki nitelikleri, tarafların teşkili usulü, zamanaşımı ve hak düşürücü süreler ile yargılamaya ilişkin çeşitli hususlar çalışma kapsamında değerlendirilmiştir. Kamulaştırmasız fiili ve hukuki el atmadan kaynaklı açılabilecek bedel davalarında; taşınmazın gerçek değerinin takdir edilmesi, harç ve vekalet ücretlerinin hesabı, yargı kararlarının icra edilebilirliği ile görevli mahkemenin tayinine dayalı sorunlar detaylı olarak çalışmada ele alınmıştır."
