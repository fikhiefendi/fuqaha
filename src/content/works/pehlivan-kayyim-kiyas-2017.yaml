abstract: "Hanbelî mezhebi ekseninde bir fıkıh anlayışına sahip olmakla birlikte selefî geleneği referans kabul eden İbn Kayyim, şer'î hükümlerin Kur'ân ve Sünnet olmak üzere iki kaynağının olduğunu ve diğer delillerin bu iki asla dayandığını savunmakta, şer'î deliller hiyerarşisinde naslardan ve sahâbe kavlinden sonra yer verdiği kıyas metodunun kullanılmasını ise zaruret halinde kabul etmektedir. Kıyas metodunu asr-ı saâdet, sahâbe ve tâbiîn dönemlerinde kaynaklardan hüküm çıkarmada başvurulan aklî istidlal yöntemlerinden re'y içtihadı ile ilişkilendiren İbn Kayyim'in kıyas düşüncesinin temelinde, nasların şer'î hükümlerin tümünü ihtiva ettiği ve şeriatta kıyasa aykırılığın olmadığı düşünceleri yer almakta ve bu iki temel prensibin yansımaları onun kıyası tanımlamasında, taksiminde ve kıyasın hucciyetini delillendirmesi aşamalarında kendisini açıkça göstermektedir."
