abstract: "İslâm hukukunda çeşitli boşanma şekilleri ve her şeklinde tabi olduğu birtakım usuller vardır. Bu boşanma şekilleri bazen karşılıklı rızaya dayanırken bazen ise taraflardan birinin zannı çerçevesinde vuku bulur. Zina sebebiyle boşanma da tarafların zannı sebebi ile vuku bulan boşanma çeşitleri çerçevesinde değerlendirilmiştir. Zina sebebiyle boşanma daha çok erkek tarafından çocuğun nesebini inkâr etmek için veya erkeğin kendisinde meydana gelen zina zannını gideremediğinden dolayı erkeğin başvurduğu bir boşanma çeşididir. Fakat çok nadir olmakla beraber erkekte meydana gelen zina zannının kadında da meydana gelmesi sebebiyle, kadının mahkemeye başvurmasından dolayı mahkemenin verdiği ayırma kararıyla gerçekleşen boşanma çeşidi de zina sebebiyle boşanma olarak değerlendirilmiştir.“Fıkha Göre Zina Sebebiyle Evliliğin Sonlanması”adlı tezimiz üç bölümden oluşmaktadır. Tezin ilk bölümünde, boşanma ve zina kavramları açıklandı ve bu kavramların tarih sahnesindeki yeri incelendi. Zina fiilini işleyenlerin eski zamanlardan beri ağır bir şekilde cezalandırıldığı görüldü. Bu fiili işleyenlerin boşanma ile karşı karşıya kaldıkları görülmekle birlikte ebedi olarak evlenememe cezası verenlerin olduğu ortaya çıktı. İkinci bölümde, zina sebebiyle boşanmanın hangi şartlarda gerçekleşebileceği, usulleri ve ispatlanamamasının hangi sonuçlar doğuracağı üzerinde duruldu. Liân kavramı konuyla doğrudan bağlantılı olduğu için liân hakkında geniş izahatlar yapıldı. Bu araştırma ve izahatlar neticesinde mezheplerin zina fiiline bakışlarının farklı olduğu gözlemlendi. Bazı mezhepler uygunsuz her hali zina sayıp boşanmaya sebep olduğunu savunurken, bazı mezhepler ise sadece erkek ve kadının gayrimeşru bir şekilde birlikte olmasını zina olarak değerlendirdiği tespit edildi. Son bölümde ise, zina sebebiyle boşanmanın hangi sonuçlar doğurduğu mezhepler bağlamında ortaya konuldu. Miras hukuku, nafaka ve iddet ile alakalı kısımlar değerlendirildi. Zina sonucu meydana gelen çocuğun durumu incelendi. Son zamanlarda tartışma konularından biri olan taşıyıcı annelik meselesi ele alındı. Ayet ve hadislerden yola çıkarak asıl annenin yumurta sahibi olan kadın olduğu ortaya konuldu. Sonuç olarak tarihin her döneminde zinaya karşı bir tavır alındığı görüldü. Bu tavrın alınmasının en temel sebeplerinden biri, dini değerlere aykırı olması, diğeri ise toplum yapısında bozulmaya sebep olması olarak tespit edildi."
