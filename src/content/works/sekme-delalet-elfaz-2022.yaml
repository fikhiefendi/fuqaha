abstract: "İslam ilim geleneği içerisinde delalet ve elfaz bahisleri bilhassa fıkıh usulü ilminin temel meselelerinden birini oluşturmaktadır. Konunun ana kaynakları niteliğindeki fıkıh usulü eserleri, delalet ve elfaz bahislerini çoğunlukla Kur'ân hitabını merkeze alarak işler. Bu ilmin, delalet ve elfaz bahislerine Kur'ân'ı anlama ve yorumlama noktasında işlevsel bir rol biçtiğini söylemek mümkündür. Temel uğraş alanı Kur'ân'ın anlaşılması ve yorumlanması olan tefsir ilmi de bu hususlara aynı zaviyeden yaklaşır. Her iki ilim içerisinde delalet ve elfaz bahisleri Kur'ân'ı anlama ve yorumlamada istihdam edilen araçlar olarak tezahür eder.“Delalet ve Elfaz Bahislerinin Kur'ân'ı Anlama ve Yorumlamada Metodik Kullanımı: Taberî ve Cessâs Örnekliğinde Analitik Bir Çalışma”başlığını taşıyan bu tezde tefsir ve fıkıh usulü ilimlerinin ortak zeminlerinden biri olan delalet ve elfaz bahislerinin, Kur'ân'ı anlama ve yorumlamada kullanımı ele alınmış; söz konusu bahislerin anlama ve yorumlama ameliyesinde ne tür bir fonksiyon icra ettiğinin tespiti amaçlanmıştır. Konunun genişliği gereği sınırlama yoluna gidilerek araştırma, Taberî ve Cessâs tefsirleri çerçevesinde gerçekleştirilmiştir. Bu eserlerin belirlenmesinde zamansal öncelik, fıkhî yetkinlik, telif türlerindeki farklılık gibi kriterler esas alınmış; böylece farklı perspektiflerin delalet bahislerini ele alma biçimlerindeki farklılıkları ve bunların Kur'ân metnini anlama ve yorumlamada kullanımı noktasında ne tür sonuçlar doğurduğunu görme imkânı elde edilmiştir."
