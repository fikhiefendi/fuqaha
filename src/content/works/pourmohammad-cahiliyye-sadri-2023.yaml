abstract: "Bu çalışmada, eski Arap edebiyatında aşk konusu incelenmiştir. Giriş bölümünde, Câhiliyye Dönemine tarihi, Arap edebiyatının tarihi ve eski Arap şiirinin konuları, edebi ve tarihsel olarak incelenmiştir. Birinci bölümde , insanşn temel duyuları, sevgi sözlüğü ve Muallakatın temel özelliklerini açıklar. İkinci bölümde, İslam öncesi ve sonrası aşk şiirinin evrimi ve kadınların eski Arap şiirindeki yeri anlatılmaktadır. Üçüncü bölüm gerçek aşkı (Tanrı ve Peygamber ve Ehl-i Beyt Sevgisi) ve bu sevginin Kuran ve hadis açısından kişisel ve toplumsal özelliklerini ve etkilerini açıklar. Bu bölümde hadisler çerçevesinde“Hz. Muhammed Sevgisi”işlenmektedir. Ayrıca Hz. Peygamber'in bu konudaki hadisleri Kütüb-ü Sitte çerçevesinde tespit edilmiş ve bunların daha iyi anlaşılması için konu ile ilgili hadis şerhlerine müracaat edilmiştir. Dördüncü Bölüm aşkı alimler açısından tanımlar ve Ibn Sînâ (filozof) ve Mevlana'nin (Sufi) teorilerini bu konu ile karşılaştırır ve sevgi ile güzellik arasındaki ilişkiyi ve aşk faktörlerini açıklar."
