abstract: "Tezimizin adı, ?Cumhuriyet Dönemi Türkçe Tefsirlerde Aile Hukuku İle İlgili Ayetlerin Yorumunun Mukayeseli İncelemesi? dir. Bu konuyu incelerken nikah ve boşanma ana başlıkları altında araştırdık.Bu çalışmanın amacı; Cumhuriyet'in ilk yıllarından günümüze kadar yazılan tefsirlerde aile hukuku ile ilgili ayetlerin yorumunu mukayese yaparak, benzer ve farklı yanlarını ortaya koymaktır.Giriş kısmında, konunun önemi, yöntem ve kaynaklar, amaç ve sınırlar hakkında bilgi verilmiştir.Birinci bölümde; Cumhuriyet dönemindeki Türkçe tefsirler ve genel özellikleri hakkında bilgi verilmiştir.İkinci bölümde; Kur'an-ı Kerim ve ahkam ayetleri değerlendirilmiş, aile ve aile hukuku kavramları incelenmiştir. Kur'an-ı Kerim'de aile hukuku ile ilgili ayetler hakkında bilgi verilmiştir.Son bölümde ise; konu edilen tefsirlerde aile hukuku ile ilgili ayetler nikah ve boşanma ana başlıkları etrafında mukayeseli bir şekilde incelenmiştir."
