abstract: "İslam hukuku hayatın her alanında söz sahibidir. Her güncel meselenin fıkhi hükmü Müslümanlar açısından önem teşkil etmektedir. Estetik cerrahi meselesi de bu güncel meselelerden bir tanesidir.Bu nedenle cerrahi olarak yapılan tüm estetik operasyonları tıb bilimindeki uygulama biçimi ile genel hatlarıyla tanıttıktan sonra fıkhi olarak incelemeye çalıştık. Bu kapsamda tez üç bölümden oluşmaktadır. Birinci bölümde beden ve estetik başlığı altında dinlerde ve beden ile hususi ilişkisinden dolayı antik yunan'da bedenin nasıl algılandığı ve ne konumda olduğunu inceledik. Ardından estetik başlığı ile estetik adına tarihte yapılan uygulamalara ve günümüzde güzellik algısının nasıl olduğuna değindikten sonra İslam'ın estetiğe bakışını vermeye çalıştık. İkinci bölümde estetik cerrahinin ne zamandan beri var olduğunu ve dinlerin bu operasyonlara ne yorum yaptığını aktardık. Sonrasında kısaca estetik cerrahiye başvurma nedenlerini inceledik. Ardından ise cerrahi olarak nitelenen her estetik operasyonu tıb bilimindeki ayrıntılarıyla ele aldık. Bu noktada tıp fakültesinde kendileriyle mülakatlarda bulunduğum hocalarıma teşekkür ederim. Son bölümde ise estetik operasyonların hem modern hukuk hem de fıkıhtaki hükmünü ele aldık. İslam hukukunda bu konu tek başına değerlendirilemeyeceğinden dolayı öncelikle ilgili meseleleri müstakil başlıklar halinde inceledik. Bu konuya dair verilmiş fetvalara ulaşabildiğimiz kadarıyla gerek arapça gerekse ingilizce eserlerden tercüme ederek okuyucuya fikir vermesi açısından yer verdik. Araştırma sonucunda ortaya çıkan neticeyi belirttik."
