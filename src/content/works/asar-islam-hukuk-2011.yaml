abstract: "Para vakıfları, bir dönem Osmanlı ekonomisinin vazgeçilmez finansman kaynaklarından biri olmuştur. Ancak var olduğu müddetçe hakkındaki tartışmalar son bulmamıştır. İslam âlimlerinin bir kısmı bu tür bir vakfın olamayacağını, faize bulaşmış olduğu için uzak durulması gerektiğini ifade ederken, diğer bir kısmı caiz olduğunu ve topluma yarar sağladığını söylemişlerdir.Para vakıflarının modern dönemde uygulanabilir hale getirilip getirilemeyeceğini tespit etmek, krediye ihtiyacı olan müslümanların başvurabileceği bir kurumu yeniden canlandırabilmeyi mümkün hale getirecektir."
