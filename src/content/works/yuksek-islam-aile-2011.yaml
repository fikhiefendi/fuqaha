abstract: "Toplumun en küçük birimi ailedir. Evliliğin amacı, ailenin ömür boyu mutluluk ve huzur içerisinde yaşaması ve neslin devamıdır. Fakat çeşitli sebeplerle eşler arasında problemler oluşur. Boşanmalar gerçekleşir. İslam aile hukukunda boşanma çeşitleri ve üç talak adlı tezimizde boşanma çeşitleri ve üç talak hükümlerini ele aldıkÇalışmamız bir giriş, iki bölümden oluşmaktadır. Girişte genel manada talâkın tarihçesi ve boşamaya duyulan ihtiyaçtan bahsedilmiştir. Birinci bölümde; talâkın tanımı, çeşitleri, hikmeti ve hükmü incelenmiştir. İkinci bölümde, üç talâkın yapılış şekli, hükmü ve bir defada verilen üç talâkın geçerliliği konusundaki görüşler, bunların delilleri ve bu delillerin değerlendirilmesi üzerinde durulmuştur. Sonuç bölümünde ise konunun genel bir değerlendirilmesi yapılarak, tercih edilen görüş belirtilmiştir.Konu Hanefi mezhebi esas olmak üzere, mezhepler arası mukayeseli olarak incelenmiştir."
