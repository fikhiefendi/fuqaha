abstract: "Sukuk, özü itibarıyla bir çeşit varlığa dayalı bir menkul kıymetleştirme işlemidir. 1970 yılından itibaren kullanılmaya başlayan sukuk enstrümanının büyüme hacmi yıllar itibarıyla önemli ölçüde artmıştır. Sukuk piyasalarının son on yıldaki büyüme ivmesi ise katılım finansın finansal piyasalardaki pazar payının artmasında önemli bir rol oynamıştır. Bu çalışmada, Ülkemizde kira sertifikası olarak mevzuatsal altyapısı oluşturulan sukukların son on yıllık süreçte katılım bankalarının finansal tablolarına etkileri incelenmiştir. Çalışmada öncelikle kira sertifikalarının bankalar için katılım fonuna alternatif bir fon kaynağı olup olmadığı ortaya konulmuştur. Bununla birlikte hem maliyet hem de aktif-pasif yönetimi açısından ne gibi etkilerinin olduğu irdelenmiştir. Kira sertifikası ihraçlarının karlılık üzerindeki etkisine yönelik panel veri analizinin de yer aldığı çalışmada ayrıca banka bazlı inceleme de yapılarak biri kamu biri özel olmak üzere iki katılım bankası özelinde kira sertifikalarının etkileri araştırılmıştır. Söz konusu çalışma hazırlanırken hem nitel araştırma yöntemlerinden biri olan içerik/doküman analiz yöntemi hem de nicel araştırma yöntemlerinden betimsel analiz yöntemi kullanılmıştır. Yapılan literatür taramasında, kira sertifikası ihraçlarının etkilerine ilişkin farklı yaklaşımlar olmakla birlikte katılım bankalarının finansal tablolarına etkilerine ilişkin kaynaklar sınırlıdır. Bu bağlamda, söz konusu çalışma ile birlikte literatüre katkıda sağlanacağı düşünülmektedir."
