abstract: "M. 1501-1551/906-958 yılları arasında Üsküdar ve Bursa mahkemelerine ait şer'iyye sicillerine dayanan çalışmada , Osmanlı hukukunda sulh sözleşmesi incelenmiştir. Osmanlı hukukunun İslam hukukuna dayanması sebebiyle, öncelikle İslam hukuku kaynakları çerçevesinde teorik olarak incelenen sulh sözleşmesi, Üsküdar ve Bursa mahkeme sicillerinde tutulan kayıtlar esas alınarak Osmanlı hukuku uygulamasına yansıyan yönleriyle de ele alınmıştır. İslam hukuku teorik eserlerinin yanı sıra dönemin şeyhülislamlarının fetvaları da kaynak olarak alınmıştır. Ayrıca sulh sözleşmesinin Roma hukuku, Common Law hukuk sistemi ve Türk hukukundaki görünümleri de incelenerek elde edilen sonuçlar, Osmanlı hukuku uygulaması ile mukayese edilmiştir. Yapılan çalışma neticesinde, teorik İslam hukuku kaynakları ile mahkeme kayıtları arasında bir çelişkiye rastlanmamış olup teori ve uygulama arasında büyük bir uyum gözlenmiştir."
