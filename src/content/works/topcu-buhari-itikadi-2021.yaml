abstract: "İslâm tarihinde erken dönemden itibaren tartışılan konular arasında itikadî meseleler kendisine önemli bir yer bulmuş, bunun sonucunda farklı fırkalar oluşmuş, birbirine zıt düşünceler ortaya atılmıştır. Bu çalışma, itikadî tartışmaların en hararetli zamanlarında yaşayan İmam Buhârî'nin itikadî görüşlerini tespit etmeyi konu edinmektedir. Tezimiz bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde, araştırmamızın konusunu, amacını, metodunu, planını ve kaynaklarını ele aldık. Birinci bölümde Buhârî'nin hayatı, hocaları, öğrencileri, ilmi kişiliği ve eserleri hakkında bilgiler verdik. Daha sonra Buhârî döneminde siyasî ve ilmî gelişmelere değindik. İkinci bölümde ise Buhârî döneminde itikadî tartışmaların ortaya çıkış sebeplerine ve sonrasında oluşmuş itikadî ekollere yer vererek ekollerin görüşlerini tanıttık. Çalışmamızın en önemli kısmı olan son bölümünde ise Buhârî'nin el-Câmiu's-sahîh ve Halku ef'âli'l-ibâd adlı eserleri ve yardımcı kaynaklar incelenerek muhaddisin itikadî görüşlerini tespit ettik."
