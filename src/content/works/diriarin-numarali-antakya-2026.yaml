abstract: "Bu tez çalışması, Antakya'ya ait 10 numaralı Şer'iyye Sicili'nin (H. 1210–1220 / M. 1796–1805) transkripsiyonunu ve değerlendirmesini içermektedir. Sicil, geç Osmanlı döneminde Antakya'nın sosyal, ekonomik, hukuki ve idari yapısına dair önemli bilgiler sunmaktadır. Çalışmada sicilde yer alan kayıtlar sistematik biçimde tasnif edilmiş; vakıflar, miras davaları, mülk satışları, esnaf faaliyetleri, aile yapısı, toplumsal ilişkiler ve şehir ekonomisine dair veriler analiz edilmiştir. Araştırmanın amacı, Antakya'nın söz konusu dönemdeki toplumsal yapısını birincil kaynaklar üzerinden ortaya koymak ve sicilin tarihsel değerini bilimsel bir çerçevede değerlendirmektir. Çalışma, hem bölgesel tarih çalışmalarına hem de Osmanlı şehir tarihi literatürüne katkı sağlamayı hedeflemektedir."
