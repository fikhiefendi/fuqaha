abstract: "Bu araştırmanın amacı insanların ilahi vahye muhatap oldukları ilk anlardan günümüze değin devam eden Kur'an'ı anlama süreçlerinde onun üzerinde düşünmek, makasıdına uygun anlamak ve Hz. Peygamberin örnekliğinin onayladığı anlama boyutunu ortaya koymaktır. Kur'an, okunmak, üzerinde düşünmek ve anlaşılmak için gönderilmiştir. O, okunup anlaşılmak, tefekkür edilmek suretiyle bireysel ve toplumsal hayatı yeniden kurgulayarak indiriliş amacını insan üzerinden gerçekleştirmiştir. Okunup anlaşılmayan bir metnin, insanların değişim ve dönüşümlerine, itikat, ibadet, ticaret, muamelat gibi yaşam safhalarını doğru bir şekilde düzene sokmasına imkân bulunmamaktadır. Bu çalışmada, Kur'an-ı doğru anlamanın önemi ile Resulüllah'ın da içinde bulunduğu ilk dönem yaklaşımlarının günümüz anlayışları ile anlama merkezli yönlerini test edip ortaya koymaktır. Bu amaçla tefsir sahasında önemli bir yeri olan“Ulumu'lKur'an”eserleri başta olmak üzere bu alandaki kitap, makale, sempozyum vb. çalışmalardan yararlanılmıştır. İlk dönem okumaları ve ashabın bundan anladıkları ile bizim toplum olarak okumak ve anlamaktan anladıklarımız arasında ciddi farkların ortaya çıktığı görülmektedir. Her obje ve yazının bir amaç ve hedefi bulunur. Her satır bir mesaj ve amacı gerçekleştirmek için kaleme alınır. Bu, Kur'an için de böyledir. Ancak anlama boyutu ve mesajına yoğunlaşma, Kur'an okumalarında fazlaca ihmal edilmiştir. Okuma ve anlamaya yüklenilen anlamlar farklı farklı sonuçlar doğurmuş bazen onun makasıdına da zarar verme ve anlaşılmasını unutturacak noktaya kadar gelebilmiştir. Dinin temel kaynağı olan kutsal bir kitabın bu kadar farklı anlaşılması, doğru anlaşılmasının ne kadar önem arz ettiğini göstermektedir. Netice olarak; anlamayı hedeflemeyen Kur'an okumaları, Kur'an'ın gönderiliş amacına uygun düşmemektedir. Bu anlayış, Kur'an'ın araştırılması, etüt edilmesi, hayatı inşa etmesi ve doğru anlaşılmasını da güçleştirmektedir. Kur'an-insan iletişimindeki bu tarz yaklaşım, onun kendini gerçekleştirmesine imkân vermemektedir. Bu anlayış, indiriliş amacına uygun olmayıp, Kur'an'ın yaşamın merkezine alınıp anlaşılmasını da güçleştirmektedir."
