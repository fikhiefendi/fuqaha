abstract: "Gusül, ergenlik çağından itibaren bütün Müslümanları ilgilendiren temel bir ibadet olmakla beraber fıtrî bir ihtiyaç olması sebebiyle, ilahî kaynaklı olmayan geleneksel inanışlarda; Câhiliye müşriklerinde, Zerdüştlük'te, Eski Mısır dininde, Hinduizm'de ve Irak Sâbiîleri'nde (Mandeanlar) benzer uygulamalarla görülen bir temizlik çeşididir. Bunun doğal bir sonucu olarak; yeni Müslüman olan kimselerin eski inanışlarındaki ve kültürlerindeki uygulamaları devam ettirmesi, ehl-i kitaptan art niyetli propagandistlerin sûret-i haktan görünüp bilgisiz Müslümanları kandırmaları, İslam coğrafyasının genişlemesiyle Müslümanların farklı din ve millet mensuplarıyla içtimai ilişkiler geliştirmesi ve bunun doğal bir sonucu olarak bilgi alışverişinde, dinî ve kültürel etkileşimde bulunmaları, dini tahrif veya dine hizmet maksadıyla hadis uydurmalarının artması, İslam dininin temel kaynakları olan Kur'ân-ı Kerîm ve sünnetin eksik veya yanlış anlaşılmasından kaynaklanan cehalet vb. sebeplerle dinle alakalı bütün konularda olduğu gibi gusül konusunda da bir çok hurafe, batıl inanç ve uygulamalar ortaya çıkmış ve dinden olduğu telakki edilerek İslam tarihi boyunca ısrarla yapılagelmiştir. Gusülle ilgili bütün meseleler sünnette en ince ayrıntısına kadar belirtilmiş olmakla beraber sünnette delili olmayan bilgi ve uygulamalar da zamanla halk arasında dini birer bilgi olarak kabul edilmiştir. Hz. Peygamber'in tebyin, temsil ve davet görevinin doğal bir sonucu olarak benzer konularla ilgili farklı uygulamalarının olabilmesi, gusülle ilgili aynı duruma matuf farklı uygulamaların görülebilmesine sebep olmuştur. Zamanla halk arasında mensup olunan mezhebin dışındaki mezheplerin uygulamalarının yaygınlık kazanması, sünnette delili olmayan hurafe ve batıl inançların mezhepsel yaklaşımlar olarak telakki edilmesine sebep olabildiği için bu tür bidatlerin sahih bilgi ve uygulamalardan temyiz edilmesini de zorlaştırmıştır. Bununla beraber Kur'ân ilimlerini, hadis ilimlerinin usûlünü, fürûunu bilmeyen, bunlardan hüküm çıkarma ehliyetine sahip olmayan, din konusunda yeterli temel bilgiye bile sahip olmayan bazı insanların, Kur'ân ve sünnetten fıkıh öğrenme, hüküm çıkarma ve bunları dini yaşayışa hakim kılma çabalarının doğal bir sonucu olarak dinin temel kaynakları yanlış anlaşılmış, din dışı bidat, hurafe ve batıl inançlar halk arasında yaygınlık kazanmıştır. Müslümanların günlük yaşamında ve ibadetlerinde büyük bir yeri olan gusül ibadeti de bu süreçten payını almış, Kur'ân ve sünnet temelli olmayan batıl inanç ve hurafeler halk arasında dinî bilgi ve uygulamalardan daha fazla rağbet görmüştür. Bu durum namaz, oruç, Kur'ân okumak gibi farz ibadetlerin aksamasına hatta terkedilmesine yol açacak kadar vahim sonuçlar doğurabilmektedir. Bu çalışmada gusülle ilgili sahih bilgi ve uygulamalar kaynaklarıyla birlikte ele alınacak, halk arasında yaygın olan ve İslâmiyet'in ilk zamanlarından beri süregelen bilgi ve uygulamaların rivâyetler ekseninde tahlil ve tenkidi yapılacaktır. Giriş ve iki kısımdan oluşan çalışmamızın giriş kısmında, çalışmanın konusu, önemi, amacı, kullanılan kaynaklar, yöntemi ve bilim dünyasına katkılarına değinilmiştir. Birinci kısımda gusül konusunun kavramsal çerçevesi ele alınmış, guslün lugat ve ıstılah anlamları, farzları, sünnetleri, mekruhları, haramları ve guslü gerektiren hususlar gibi fıkhî yönleri delilleriyle incelenmiştir. İkinci kısımda yapılan anket çalışmasıyla tespit edilen, halk arasında gusülle ilgili var olan bilgi ve uygulamaların kaynağı araştırılmış ve bunların konuyla alakalı rivayetler ekseninde tahlil ve tenkidi yapılmıştır."
