abstract: "İlk insandan günümüze kadar herkesin ve her dinin yakından ilgilendiği ya da ilgilenmek zorunda olduğu bir kavramla ?vakit kavramıyla- Müslümanların ilgilenmemesi düşünülemez.Şarii İslamdaki birçok ibadet için özel vakitler tayin etmiştir. Kendisine vakit tayin edilen ibadetlerin kabul olma şartlarından biri de tayin edilen vakti içinde yerine getirilmesidir.Tez, bu noktadan hareketle, vakit kavramını ele alıp; ibadetler için belirlenen vakitler konusundaki farklı görüşlere yer vermeyi amaçlamıştır. Bedenî, malî ve hem bedenî hem de malî ibadetlerin vakitle ilgili hususlarına ve bu konudaki tartışmalara değinilerek bu konudaki mezhep görüşlerine ve bunların delillerine yer verilmiştir.Temel fıkıh kitapları ve ilmihaller taranmaya çalışılarak hazırlanan bu tezde vaktin ibadetle olan ilişkisi ve buna bağlı olarak ortaya konan hükümler hakkında bilgiler ortaya koyulmaya çalışılmıştır."
