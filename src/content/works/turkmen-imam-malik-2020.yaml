abstract: "Bu araştırma, İmam Mâlik'in başlıca eseri olan Muvatta'ının tefsir ilmi penceresinden değerlendirilmesi amacıyla yapılmış olup, bu çerçevede İmam Mâlik'in müfessir yönü üzerinde de durulmuştur. Daha önce gerek ülkemizde gerekse dünyada Muvatta'ın tefsir ilmi perspektifiyle bir değerlendirmesinin yapılmamış olması ve İmam Mâlik'in müfessir yönü üzerinde duran sınırlı sayıda araştırma bulunması nedeniyle araştırmamız önem kazanmaktadır. Araştırmamızda Batı'da ve Arap dünyasında gerek mukaddem dönem eserlerinde gerekse muasır eserler üzerinde geniş bir tarama yapılarak, İmam Mâlik'in yaşadığı dönemde tefsirin ilmî bir disiplin olarak gelişimi, Muvatta'ı telif süreci ve gerekçeleri, kendisinden sonra yaşayan öğrencilerinin ve sonraki dönem âlimlerin ona nispet ettikleri tefsir rivâyetleri derlenmiştir. Bu rivâyetler ve bilgiler, tefsir yöntemi ve Kur'ân ilimleri ekseninde incelemeye tabi tutulmuş ve bilginin bütünlüğü kuramı çerçevesinde değerlendirilmiştir. Araştırma neticesinde, İmam Mâlik'in Kur'ân'ı ana bilgi kaynağı olarak benimsediği, Kur'ân'ın yorumlanması hususunda geniş bir yetkinliğe sahip olduğu ve Muvatta başta olmak üzere ona atfedilen rivâyetlerin derlendiği pek çok eserde tefsire dair materyal bulunduğu belirlenmiştir. Ancak yaşadığı dönemde tefsir ilminin henüz müstakil bir ilmî disiplin olarak tekemmül etmediği ve kendisinin tefsir tedvini niyetiyle bir eser ortaya koymadığı, ona atfedilen tefsir kitaplarının ise aslında kendisinden sonraki dönemlerde kaleme alınan tefsire dair rivâyetlerinin derlenmesinden ibaret olduğu anlaşılmaktadır."
