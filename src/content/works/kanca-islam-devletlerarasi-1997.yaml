abstract: "İslam Devletler Hukuku İslamın siyasal güç olarak ortaya çıkışından bu yana, başka bir deyişle İslam Devletinin kuruluşundan bu yana varolagelmiştir. İslam Devletler Hukuku barışçıl, ahde vefa gösteren, anlaşmalarına sadık kalan, her türlü devlete eşit muamelelerde bulunan bir İslam Devletini öngörmektedir. Tezin asıl konusu olan mukabele bi'l misil de, devletler arasında adaletle muamelenin bir neticesi olarak ortaya çıkmıştır. Mukabele bi'l misil ticaret, diplomasi, savaş, esir alma gibi çok çeşitli konularda geçerli olmakla beraber, İslam Hukuku mukabele bil misil'in de sınırlandırıldığı konulardan bahsetmektedir. İslam Hukuku'nun bu konuda ne kadar insancıl ve barış esaslarına dayanan bir yapıya sahip olduğu yukarıdaki ifadelerle daha da açık anlaşılmaktadır. vı"
