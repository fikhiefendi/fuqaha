abstract: "ÖZET YÜKSEK LİSANS TEZİ 456 NUMARALI ELBİSTAN ŞER' İYE SİCİLİ H.1302-1308 / M.1885-1891 DEĞERLENDİRME VE TRANSKRİPSİYON U. FİLİZ KORKARER K.S.Ü SOSYAL BİLİMLER ENSTİTÜSÜ TARİH ANABİLİM DALI DANIŞMAN : Yrd.Doç.Dr.Faruk SÖYLEMEZ Yıl :2002, Sayfa: 231 Jüri : Yrd.Doç.Dr.Faruk SÖYLEMEZ : Yrd.Doç.Dr.İIyas GÖKHAN : Yrd.Doç.Dr.Lütfi ALICI Osmanlı Devleti' nde, sancak ve kazaların adlî ve idarî birim olarak başlıca temsilcisi kadılardı. Kadılar buraların dinî, hukukî, içtimaî ve idarî sorumluluğunu taşırlardı. Medreselerde eğitim gören kadılar, bir süre tecrübeli kadıların yanında staj gördükten sonra en alt dereceden başlamak üzere görev yerlerine atanırlardı. Araştırma konusu olan Elbistan'ın 456 numaralı Şer'iye sicili;sırtı kahverengi meşin, satıhları kırmızı üzerine sarı puanlı, yırtık bez kaplı bir defter olup H. 1302-1308, M. 1885-1891 yıllarını kapsamaktadır. Milli Kütüphane'ye Adana Müzesi 'nden gönderilmiştir. Bu tarihte Elbistan, Halep vilâyetine bağlı Maraş sancağının bir kazasıydı. Araştırmada 96. ve 157. sayfalar arasında bulunan 215 adet belge incelenmiştir. 456 numaralı defterde incelenen 215 adet belgenin 84 adeti tereke ve veraset işlemleri, 79 adeti alacak ve borç işlemleri, geriye kalan 52 adet belge ise tevcihat, vekâlet, sirkat, vasi tayini, ticaret, evlilik, boşanma, nafaka, mehir ve vakıf işlemleri ile ilgili kadıya getirilen davalardır. Osmanlı Ülkesinde yaşayan gayr-ı müslim milletlerin de bazı davaları bu mahkemelerde görülürdü. İncelenen 215 adet belgenin dörtte üçü müslümanlar, dörtte biri ise gayr-ı müslimler ile ilgili davaların kayıtlarıdır. Bu belgelere bakıldığında müslüman ve gayr-ı müslim halkların bir arada hoşgörü içinde yaşadıkları görülecektir. Kadılar, bir çeşit jüri sistemine benzer“Şuhûdü'l Hâl”olarak adlandırılan, çevrede tanınmış ve bilinen kişilerin önünde karar alarak mahkemenin güvenilirliğini korurlardı.İncelenen 215 adet belge M. 1885-1891 yılları arasında Elbistan tarihinin sosyo ekonomik, dinî, hukukî, idarî, askerî ve demografik yapısı hakkında ayrıntılı bilgiler elde etmemizi sağlayacaktır Genel tarih yazılırken şehir tarihi bilgilerinden yararlanmak gerekmektedir. Şer'iye sicilleri de şehir tarihi konularının yüzde yetmişini kapsamaktadır. Bu da şer' iye sicillerinin tarihçiler için önemli kaynaklardan biri olduğunu göstermektedir."
