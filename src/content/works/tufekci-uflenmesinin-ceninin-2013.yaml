abstract: "Bu araştırma, Kur?ân-ı Kerim ve hadislerdeki bilgilere göre cenîne ruhun üflenmesinin ne zaman gerçekleştiğini ve bu olayın cenînde oluşturduğu etkileri, son olarak da bu durumun onun şahsiyeti problemine dair ne gibi açılımlar yarattığı ve bunun hukuki yansımalarının neler olduğunu incelemektedir. Üç bölüm halinde sunduğumuz bu çalışmanın birinci bölümünde Kur?ân ve hadislerde geçen ruh kelimelerinin kısaca anlamları üzerinde durulmuş ve insanın ruh ve bedenden müteşekkil bir varlık olduğu vurgulanmıştır. İkinci bölümde âyetler, hadisler ve tıp temelinde cenîne ruhun üflenme zamanının ne olduğu belirlenmeye çalışılmış ve onu diğer canlıların cenînlerinden farklı olarak insan yapan özellikler, sem? ebsâr, ef?ideh kavramları Kur?ân âyetleri ışığında incelenmiştir.Çalışmamızın üçüncü bölümünde cenîn kavramıyla ilgili çeşitli yaklaşımlara yer verilerek cenînin şahsiyeti meselesi üzerinde durulmuş, hak ehliyeti noktasından hareketle çalışmamız çerçevesinde iskât-ı cenîn konusundaki farklı görüşler ele alınmış, bunların genel bir değerlendirmesi yapılmıştır. Konu embriyoloji bilimi ile bağlantılı olmasından dolayı, Kur?ân ışığında yapılmış çalışmaların yanında, medikal embriyoloji eserlerinden ve hadis, tefsir ile çeşitli fıkıh kitaplarından yararlanılmıştır."
