abstract: "ÖZET İslimi esaslar doğrultusunda faaliyetlerini yürüten İslâm Bankacılığı' nda faiz haram olup, bu sistemde faizin yerini eşit kâr ve risk paylaşımı almaktadır. Henüz 20-30 yıllık bir geçmişe sahip olan İslâm Ban kacılığı, Uluslararası düzeyde büyük gelişmeler göstererek genellikle islâm ülkelerinde büyük banka ve yatırım şirket leri şeklinde kurulmakta ve faaliyetlerini sürdürmektedir. ülkemizde de 83/7506 Sayılı Kanun Hükmünde Kararname ile kuruluşuna isin verilen Özel Finans Kurumları, ülkemizde ki bankaların yaptığı birçok faaliyeti yapabildiği halde, Bankalar Kanunu' na tabi değildir, özel Finans Kurumları çı karılan Kanun Hükmünde Kararname ve buna ilişkin olarak T.C. Başbakanlık Hazine ve Dış Ticaret Müsteşar ligi* nın 25 Şubat 1984 Tarih, 18323 Sayılı Resmi Gazete ve T.C. Merkez Banka sı' nm 21 Mart 1984 Tarih 18348 Sayılı Resmi Gazete ile ya yımlanan Tebliğlerine tabidir. özel Finans Kurumlarının verimlilik ve riskini sap tamaya yönelik olan bu çalışmamızda iki özel Finans Kurumu* nun ve seçilen beş yatırım aracının getirileri 1.1.1986-11 30.9.1987 Tarihleri arasında 3'er aylık 7 dönem halinde tes pit edilmiş ve bu verilerin beklenen (ortalama) getiri, var- yans, standart sapma ve değişim katsayıları hesaplanarak verimlilik ve riskleri karşılaştırılmıştır. Daha sonra iki özel Finans Kurumu ve beş yatırım ara cı getirilerine ilişkin Kovaryans ve Korelasyon katsayıları hesaplanarak, kurumlar ve yatırım araçları getirilerinin bir birleriyle olan ilişkileri belirlenmiştir. Tasarrufçunun hangi yatırım ^araçları portföyünden daha yüksek verim ve daha az risk elde edebileceğini görebilmek için de, portföy denemesi yapılarak sonuçlar değerlendiril miştir."
