abstract: "Mutʿa nikâhı uygulaması bir câhiliye âdetidir. İslâm'ın gelişiyle beraber tüm câhiliye uygulamalarında olduğu gibi, mutʿa nikâhı uygulaması da yasaklanmıştır. Vârid olan rivâyetlerden anladığımız kadarıyla, sefer zamanı eşlerden ayrı geçen uzun zaman dilimlerinde, Rasûlüllah'a (a.s) başvuran kimi genç sahabîlerin, zarûret gereği mutʿa yapma isteklerine kısa bir zaman için ruhsat verilmiş ve hemen akabinde kıyâmete kadar haram kılınmıştır. İslâm ümmetinin, Şia'nın Caʿferiye kolu hariç tamamı, yasaklandığı bilgisi kendilerine ulaştıktan sonra bu uygulamayı terk etmişlerdir. Mutʿa uygulamasını rivâyetle ortaya çıkan ruhsata değil de âyete dayandıran Caʿferîler, âyeti nesh eden başka bir âyetin gelmediğini iddia etmişler, konuyla alakalı olarak ta sadece ehl-i beyt tarikiyle gelen hadîsleri dikkate alarak mutʿa nikâhının ümmet için rahmet olduğu tezini savunmuşlardır. Hem mutʿa ile alakalı gelen hadisleri rivâyet tekniği açısından ele alıp incelemek, hem de mutʿanın mubahlığına delil kabul edilen Nisa 4/24. Âyeti merkeze alarak tezimizi hazırlamaya çalıştık. Çalışmayı yaparken nikâh, câhiliyede nikâh çeşitleri, sünnî kaynaklarda mutʿa ile alakalı vârid olan hadisler ve tahric ve tenkidi incelememizin kapsamını oluşturdu. Sonuç bölümünde ise, mutʿanın nesh olan bir câhiliye âdeti olduğu ve müslümanlar arasında, kitap ve sünnet çerçevesinde haram olduğunun -Şia hariç- kabul edildiği vurgulanmaya çalışılmıştır."
