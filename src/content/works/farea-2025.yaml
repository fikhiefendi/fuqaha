abstract: "Bu çalışma, bazı Arap ülkelerinde İslami bankaların tarım sektörünün gelişimine katkılarını ortaya koymayı amaçlamaktadır. Bu çerçevede, İslami bankaların tarımsal finansmandaki rollerinin analiz edilmesi ve bu sektöre uygun İslami finansman yöntemlerinin ne ölçüde uygulandığının belirlenmesi hedeflenmiştir. Çalışma, tarım sektörünün ekonomik kalkınma ve gıda güvenliği açısından taşıdığı öneme odaklanmakta; muzâraa, müsâkât ve mugârasâ gibi İslami finansman yöntemlerini ele almaktadır. Araştırmacı, çalışmasında birincil ve ikincil kaynaklardan elde edilen verileri analiz etmek için betimsel yöntemi, İslami bankaların finansal tablolarından elde edilen verileri yorumlamak ve analiz etmek için ise analitik-tümevarımsal yöntemi kullanmıştır. Bulgular, incelenen bazı Arap ülkelerinde tarım sektörüne yönelik İslami finansmanın oldukça sınırlı olduğunu ve İslami bankaların tarımsal ortaklık modellerini fiilen kullanmadığını göstermektedir. Bununla birlikte, İslami finansman araçlarının bu sektörü desteklemede önemli potansiyele sahip olduğu, ancak yeterince değerlendirilemediği de ortaya konmuştur. Çalışma, İslami bankaların tarımsal kalkınmaya katkısını artırmak ve gıda güvenliğini sağlamak amacıyla yenilikçi tarım finansman ürünlerinin geliştirilmesi ve uygun şer'î finansman yöntemlerinin etkinleştirilmesi gerektiğini önermektedir. Ayrıca, İslami finansmanın, eğer açık kalkınma planları çerçevesinde etkin bir şekilde kullanılırsa, bu hayati sektöre önemli katkılar sağlayabileceği vurgulanmaktadır."
