abstract: "Batının birçok Arap ve İslam beldesini işgalinden sonra İslam Ümmetinin içine düşmüş olduğu bilgisel duraklama ve geri kalmışlık, Batı modernizminin fikirlerinin tesirinde ve batının kazanımlarının etkisinde kalan modernist bir düşünce eğiliminin- yönelişinin ortaya çıkmasına sebep olmuştur. Bu eğilim, İslâm dinini ortadan kaldırmaya, hükümlerini, menhecini ve ilimlerini bağlamından koparmaya çalışmış, Batıcı ve Batı fikirlerini ve metotlarını zoraki kabul ettirmeyi ettirmeye gayret etmiştir. Yine bu akım, kendisinden hiçbir batılın sadır olmadığı naslar hakkındaki teorilerini İslam toplumuna kabul ettirebilmek için farklı kılıflara bürünmüştür. Bu manada ne İslâm Şeriatında ne de İslam müktesebatında heva ve hevesini gerçekleştirme ve Modernist projelerini yürürlüğe koyma noktasında kendisini destekleyecek hiçbir delil bulamamıştır. Bu doğrultuda Makasıd Teorisine yönelmiştir. Makasıd'ı amacı dışına çıkarmış, bütünsel ve parça parça nasları bağlamından koparmıştır. Tüm bunları da asıl olanın Maslahatın gözetilmesi olduğu iddiasıyla yapmıştır. Makasıdı kendi anlamak istediği üzerinden anlamış ve Şar-i'nin kastı ikinci planda kalmıştır. Böylece insanların zihinlerini Batılı fikirlerle doldurmuştur doldurmuşlardır. Makasıd eş-Şeria'yı, Usul ve Kavaidul Fıkhiyye'ye ve 14 asır boyunca ulemanın takip etmiş olduğu ilm-i menhece alternetif alternatif görmüşlerdir. Hiç şüphesiz ki bu Modernist eğilimin, Makasıd, İçtihad ve Tecdid kavramlarından kastı, açık bir şekide ortadadır ki oda İslam Şeriat'ını ve hükümlerini âtıl durum düşürmek, Fıkıh ve Usul ilimlerini kısıtlamak, muhkem ve mukaddes nasları yürürlükten çıkarmak, bu nasları bütünsel ve parçasal olarak yavaş yavaş devre dışı bırakmak ve bu şekilde helali haram, haramı da helale kolayca çevirebilmektir. Bu tez, Makasıd eş-Şeria'da çağdaş modernist eğilimi işlemekte ve bu konuyu farklı yönleriyle ele almaktadır. Bu akımın öncülerini ve temsilcilerini, görevlerini, başlıca kaynaklarını, usul ve hedeflerini işlemekte, bu modernist akımı inceleme ve eleştiriye tabi tutmakta, teorilerini, fikir ve düşüncelerini, makasıd ilmi hakkındaki görüşlerini tetkik etmekte ve irdelemektedir. Bu makalede Batı modernizmini tanımladım, bu akımın birçok batılı temsilcisinin hayatını tercüme ettim, orijinal kaynaklarına müracaat ettim ve gözden geçirdim. Arap modernistlerini inceledim. Arap modernizmi ile Batı modernizmi arasındaki benzerliği ifade ettim ve bu iki modernizm anlayışının tek kaynaktan geldiğini belirttim. Makasıd eş-Şeria ilmini tanımladım, genel kurallarını, kendisine başvurma ve amel etme şartlarını, kendisinden hüküm çıkarma yollarını bir araya getirdim. Aynı zamanda Makasıd eş-Şeria'da etkisi görülen bu modernist eğilimi incelemeye çalıştım. Yine bu eğilimin yöntem ve özelliklerini tahlil etmeye çalıştım. Usul ve tatbikini tenkit ettim. Bu tezde betimsel ve analitik-eleştirel bir yaklaşımı takip ettim."
