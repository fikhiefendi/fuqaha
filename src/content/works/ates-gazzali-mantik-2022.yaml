abstract: "İslam ilim ve düşünce geleneğinde erken ile geç dönem ayırımının merkezindeki isim olan Gazzâlî, İslâmî ilimlerin metodolojik tekâmülü hususunda büyük bir önemi haizdir. Zira tahsil ettiği fıkıh usulünden sonra mantık ilimini de öğrenerek hem dinî ilimlerin hem de aklî ilimlerin bilgi üretme metodolojilerini kendi ilmî müktesabatında cem etmiştir. Bu çalışma hem fıkıh usûlü hem de mantık geleneğini tevarüs etmiş olan Gazzâlî'nin mezkur iki metodolojiye dair tevarüs ve inşa ettiği tsavvurların ve onlar arasında kurduğu ilişkinin mahiyetini onun eserleri çerçevesinde ele alıp açıklığa kavuşturmayı hedeflemektedir. Gazzâlî'nin fıkıh usûlü ilmi ile mantığı mezcetme faaliyeti üzerine yoğunlaşacak olan çalışma üç bölümden oluşmaktadır. Birinci bölümde Gazzâlî'nin mantık tasavvuruna yer verilmiş ve tevarüs ettiği mantık düşüncelerinden etkilenme keyfiyeti açığa çıkartılmıştır. İkinci bölümde Gazzâlî'nin fıkıh usûlü tasavvuru incelenmiş ve mütekellim usûl yöntemine aidiyeti ve katkıları ele alınmıştır. Üçüncü bölümde ise Gazzâlî'nin mantık ile fıkıh usûlü arasında kurduğu ilişkinin mahiyetine yönelik düşünsel inşalar yapılarak onun bu iki ilmi mezcederken kullandığı yöntemsel ve icraî araçlar vuzuha kavuşturulmuştur. Ayrıca bu ilişki hususunda etkilendiği alimler tespit edilmiştir."
