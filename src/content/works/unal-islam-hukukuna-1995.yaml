abstract: "m ÖZE T Hayatın bir ucu doğum diğer ucu da ölümdür. Vasiyet etmek ölüme bağlı bir tasarruftur. Kişinin gerek Allah'a ve gerekse insanlara karşı bir takım sorumlulukları vardır. Bazen sadece kendisinin bildiği, yakınlarının bile haberdar olmadığı borçlan olabilir. Bazen de böyle bir borcu olmadığı halde, yapmış olduğu iyiliklerini artırarak iyi bir kul olabilmek için, malının bir kısmım muhtaç durumdaki insanlara veya toplum yararına harcamak isteyebilir. Bu istek, kişinin hayır yapma arzusundan doğar. Ama bu borçları ödemek ve arzu edilenleri gerçekleştirmek, ölüm geldiği zaman mümkün olmamaktadır. Neticede bu insanlar mallan olduğu halde arzu ettikleri hayırlı işleri yapamamak ve üzerlerinde olan bir takım borçlan ödeyememek gibi müşkil bir durumla karşılaşmaktadırlar. îşte böylesi durumlarda bu kişilerin vasiyet etmeleri, onlar için bir çare olmaktadır. Çünkü arzu ettikleri şeylerin, ölümden sonra gerçekleştirilmesi fırsatı doğmaktadır. Görüldüğü gibi vasiyet, vasiyet eden kimse için, iyilik yapmak ve faydalı olmaktan dolayı huzur bulma, dînî yönden tatmin olma, psikolojik açıdan rahatlama sebebidir. Vasiyet edilen bakımından da dayanışma, yardım görme demektir. Böylece, vasiyet yolu ile toplum yaran ön plana çıkmaktadır. Konunun bu önemini dikkate alarak araştırmamızda vasiyeti inceledik. İslâm hukuku içindeki yerini, farklı mezhebler ve görüşler ile ortaya koymaya çalıştık. Aynı zamanda Türk Medeni Kanunu'ndaki vasiyet ile karşılaştırmalar yaptık. Çalışma üç bölümden oluşmaktadır. Birinci bölümde önce vasiyetle ilgili genel bilgilere yer verdik. Vasiyetin tarihçesi, meşruluğu ve hükmünü anlattık. Daha sonra İslâm hukuku ve Türk Medeni Kanunu'na göre vasiyetin çeşitleri ve şekilleri hakkında bilgiler verdik. Son olarak da vasiyetin yapılışı ve yerine getirilişi ile ilgili olan hususları ele aldık. Araştırmanın ikinci bölümünde önce vasiyette aranan şartlan inceledik. Çünkü vasiyette; vasiyet eden, kendisine vasiyet edilen ve kendisi vasiyet edilen şeylerde bazı şartlar aranmaktadır. îşte bu şartların neler olduğunu açıklamaya çalıştık. Daha sonra vasiyetin miktarı hakkında bilgi verdik. Vasiyetin miktarı İslâm hukukuna göre terekenin üçte biri ile sınırlıdır. Türk Medeni Kanunu'na göre ise; mahfuz hisseli mîrasçıları olmayan bir kişi, bütün malını vasiyet yolu ile harcayabilmektedir. Tezin son bölümünde ise, önce vasiyetten dönmek ve vasiyetin batıl olması konulan işlendi. Ardından ölüm hastalığında yapılan teberruların hükmü üzerinde duruldu. Son olarak da vasî konusu ele alındı. Burada da vasî hakkında kısaca bilgiler verildi."
