abstract: "Bu tez, Ebussuûd el-İmâdî'nin (ö. H. 982 / M. 1574) Tefsiri'nde aile konusunu incelemeyi amaçlamaktadır. Hicri 10. asırda Kur'an müfessirlerinden biri olan müellif tefsirine“İrşâdü'l-ʿaḳli's-selîm ilâ mezâya'l-Kitâbi'l-Kerîm”adını vermiştir. Bu çalışmanın önemi Kur'an-ı Kerim bağlamında konulu araştırma olmasıdır. Günümüzde aile meselesi ve sorunlarının öne çıktığı düşünüldüğünde, özellikle modern çağda toplumlardaki hızlı değişmeyle birlikte Kur'an'ın aile eğitimi ve hukuk nazariyesini inceleme ihtiyacı ortaya çıkmıştır. Araştırmanın bir başka açıdan önemi ise Ebussuûd tefsirinin tefsir ve Kur'an ilimleri alanında uzmanlaşmış ilim talebeleri için vazgeçilmez bir kaynak olarak kabul edilmesinden kaynaklanmaktadır. Araştırmanın amaçlarına ulaşmak için İmam Ebussuûd el-İmâdî'nin biyografisi ve yaşadığı dönemin özellikleri araştırılırken tarihi kaynaklardan tümevarıma dayalı tahlil yöntemi benimsenmiştir. Bu yöntemle müellifin kitabından aile ve adâb kuralları hakkındaki hükümler çıkarılmıştır. Onun aile eğitimi nazariyesi, Kur'an naslarından hareketle ortaya çıkarmaya çalışılmıştır. Araştırmada ulaşılan en önemli sonuçlarda bazısı şu şekildedir: Üslub ve ifadelerindeki zorluğuna rağmen Ebussuûd tefsirinin büyük ilmî kıymeti vardır. Ayrıca aldığı sağlam ilmî eğitim, bağımsız entelektüel kişiliğinin gelişmesinde, Kur'ân lafızlarının tanımına dikkat etmesinde ve her birine yer vermesinde etkili olduğu söylenebilir. O, tefsirinde temel kaynaklara ulaşmaya özen göstermiştir. Ancak bunlarla yetinmemiş bilakis zengin ilmi birikimi ve engin kültüründen hakereketle ilavelerde bulunmuştur. Bu birikim onun aile hükümlerine ilişkin düşüncesinin açıklığa kavuşmasında etkili olmuştur. Nafaka, emzirme, âdab kuralları gibi aile hükümlerinin anlatılması sırasında kelime anlamlarını tefsir ederken Kurân'ın siyâkına özen göstermiştir. O tefsirinde İslam'da ailenin önemini, Kur'an'ın bireyler arasındaki ilişkilere özen gösterdiğini açıkça ortaya koymuştur. el-İmâdî'ye göre Müslüman ailenin birçok görevi vardır. Bunlardan bazıları toplumsal, eğitim, ahlaki ve neslin devam etmesi şeklindedir. O, ebeveynler ve çocukları arasında merhameti tavsiye etmek suretiyle aile bağlarını güçlendirmeye çalışmıştır. Bu durum Kur'an kıssalarında; Hz. İbrahim'in babası ve oğluyla olan kıssada yine Hz. Yakup'un oğlu Yusuf'la (a.s.) olan kıssada görülmektedir. el-İmâdî, eşler arasındaki sorunların kaynağını eşlerden birinin diğerinin hukukunu ihlal etmesi yüzünden başladığını değerlendirmektedir. Allah'ın onlardan birine nafaka diğerine itaati farz kılmıştır. Dünyada devamlılığı sağlamak ve ahirette ise sonsuz saadete kavuşmak için neslin eğitimi ve bakım sorumluluğu Allah'ın bizlere yüklediği en büyük görevlerden biridir."
