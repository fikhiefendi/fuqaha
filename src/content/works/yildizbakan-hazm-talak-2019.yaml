abstract: "Bu çalışma İbn Hazm'ın el-Muhallâ adlı eserindeki \"talak'' hükümlerinin incelenmesini konu almaktadır. Çalışmanın ilk bölümünde İbn Hazm'ın hayatı, eserleri, ilmi çalışmaları, usul anlayışı ve Zâhirî metodolojisine katkılarına değinildi. Yine aynı bölümde el-Muhallâ adlı eserinin muhteva ve sistemetiği hakkında bilgi verilmektedir. İkinci bölümde talak kavramının tanımı, Kuran, Sünnet ve icmadaki delillerine, talak ile fesih kavramlarının benzer ve farklı noktalarına yer verilmiştir. Ayrıca talakla ilgili kavramların ve çeşitlerinin lügat ve ıstılahî tanımı yapılmış ve bu kavramlar hakkında genel bilgi verilmiştir. Üçüncü bölümde İbn Hazm'ın el-Muhallâ adlı eserindeki talak çeşitleri ile talak hükümlerinin incelenmesine ve diğer mezheplerin bu konular hakkındaki hükümlerine yer verildi. Dördüncü bölümde kazâî boşanma sebepleri ve el-Muhallâ'daki hükümleri ve diğer mezheplerin görüşleri incelendi. Bu çalışmanın sonucunda İbn Hazm'ın, diğer fıkhî konularda olduğu gibi talak konusunda da Zâhirî mezhebinin görüşlerinden ziyade kendi özgün metodolojisini yansıttığını görmekteyiz. Zira usul ve fürûdaki tutarlılığını, diğer mezhep imamlarına karşı eleştirisel yaklaşımını, meseleleri işleyişindeki yöntemi ve sert tutumunu bu eserde talak bölümünü işlerken de yansıtmıştır."
