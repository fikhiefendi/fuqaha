abstract: "Saçaklızâde'nin Eserleri ve Teshîlü'l-Ferâiz Adlı Eserin Tahkiki adlı tez çalışmasında, Osmanlı İmparatorluğu'nun duraklamaya yüz tuttuğu, ilmiye sınıfının yozlaşmaya başladığı, akli ilimlerin ikinci plana atıldığı bir dönemde yetişen ve zamanının önemli âlimlerinden ve velûd müelliflerinden olan Saçaklızâde Mehmed Efendi'nin hayatı, eserleri, fıkıhçılığı ve Teshîlü'l-Ferâiz adlı eseri incelenmiştir. Çalışma üç bölümden oluşmaktadır. Birinci bölümde, Saçaklızâde Mehmed Efendi'nin hayatı, ilmi kişiliği, eserleri incelenmiş ve literatürde adı geçen eserlerinin uzun bir listesine yer verilmiştir. İkinci bölümde Teshîlü'l-Ferâiz adlı eserin genel olarak tanıtımı yapılmıştır. Eserin adı, müellife nispeti, yazılış nedeni ve eserin önemi gibi çeşitli konulara değinildi. Üçüncü bölümde ise Teshîlü'l-Ferâiz adlı eserin tahkiki yapılmış, söz konusu eserin örnek nüshalarına yer verilmiş, Teshîlü'l-Ferâiz tercüme edilerek Türkçe'ye tercüme edilmiştir."
