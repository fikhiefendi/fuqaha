abstract: "İslâmî finans İslâmî bankacılık, tekafül, mikrofinans, yatırım fonları, sermaye piyasası gibi sektörleri içine barındıran bir yapı olup onun faaliyetleri yürütürken gözettiği ilke ve kurallar, İslam'ın öngördüğü ilke ve değerlere ve İslam hukuku literatüründe geliştirilen akit ve hükümlere dayanmaktadır. Etik finans dini, etik, toplumsal, çevresel ve sürdürülebilirlik kıstaslarına dayalı yatırım yapmayı veya finansal faaliyet yürütmeyi ifade eden şemsiye bir kavramdır. Bir kısım etik finans kuruluşları kendi ilkelerini belirlerken belirli bir inanç sistemini referans olarak alırken, çoğunluğu insan, toplum ve çevre konusundaki bireysel sorumluluğa atıfta bulunmaktadır. Ancak her ikisinde de temel hedef, etik duyarlılığa sahip tasarruf sahiplerinin fonlarını etik bakımdan sorun teşkil etmeyen alanlara yönlendirmektir. Çalışmamızda etik finans ve İslâmî finans sektörleri içerisinde yer alan çeşitli kuruluşlardan yola çıkarak her iki sistemin temel ilkelerini, benzer ve ayrıştığı yönleri tespit etmeye çalıştık. Ayrıca bu iki sistemin artı ve eksik gördüğümüz yönlerini kıyaslayarak, birbirinden faydalanabileceği hususları öneri olarak sunmaya gayret ettik."
