abstract: "Osmanlı Devleti tarihinin kaynakları arasında birinci derecede öneme sahip kaynakların başında şer'iyye sicilleri gelmektedir. Bu çalışmada H.1254-1255 (M.1838-1839) yılları arasını kapsayan 101 Numaralı Kastamonu Şer'iyye Sicili incelenmiştir. Bu dönemde Kastamonu, Sancak Beyliği durumundadır. Şer'iyye sicilleri, kadıların görevleri gereği mahkemelerde verdikleri kararları, merkezden gelen belgeleri ve sorumlu oldukları yerlerdeki önemli olayları kaydettikleri defterlerdir. Bu kayıtların kaza merkezlerinde kaydedilmiş olması, onları yerel tarih çalışmaları açısından önemli bir kaynak haline getirmektedir. Çalışılan sicil ve belirtilen dönem aralığında Kastamonu Sancağında görevli önemli isimler, Mültezimler, Mutasarrıflar, Kadı ve Ayanlar, Müderrisler; Kastamonu nahiye ve köyleri, kazalar, mahalleleri, o dönemde hizmet veren vakıflar, toplanılan vergiler gibi Kastamonu kent tarihine ışık tutacak önemli bilgilere ulaşılmıştır."
