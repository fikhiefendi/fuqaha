abstract: "Araştırmada Batman?da görev yapan Şafii ilköğretim Dkab öğretmenlerinin 2011-2012 eğitim-öğretim yılında okutulan Dkab ders kitaplarına ilişkin görüşleri alınmıştır. Buna göre; Ders kitaplarının, geçmiş yıllara göre metin ve görsellik açısından daha iyi hazırlanmasına rağmen, birçok konuda eksiklikleri vardır. Kitabın konu anlatımında uzun paragraflara yer verilmesi, birçok konunun öğrencilerin seviyesine uygun olmaması, tekrar edilen konuların olmasına rağmen din eğitimi açısından önem arz eden birçok konunun kitapta yer almaması, dilin akıcı olmaması, bazı örneklerin günlük hayattan uzak olması, kitapta güncelliğin sağlanamaması, ayet ve hadislerin anlaşılmasını etkileyen unsurların bulunması ve en önemlisi mezheplerüstü bir anlayışa sahip olması gereken kitabın gerçekte bu özellikleri taşımıyor olması, Dkab ders kitabına yöneltilen eleştiriler olarak tespit edilmiştir."
