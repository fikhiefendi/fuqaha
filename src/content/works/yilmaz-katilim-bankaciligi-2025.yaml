abstract: "Bu çalışma Türkiye bankacılık sektöründe faaliyet gösteren katılım ve konvansiyonel bankaların finansal performanslarını CAMELS bileşenleri olan sermaye yeterliliği, varlık kalitesi, yönetim kalitesi, kârlılık, likidite, piyasa risklerine karşı duyarlılık üzerinden karşılaştırmayı ve iki model arasındaki bütüncül başarı hiyerarşisini ortaya koymayı amaçlamaktadır. Çalışma 2018-2024 faaliyet dönemini kapsamakta ve Türkiye'de faaliyet gösteren beş katılım bankası (Kuveyt Türk Katılım Bankası A.Ş., Türkiye Finans Katılım Bankası A.Ş., Ziraat Katılım Bankası A.Ş., Vakıf Katılım Bankası A.Ş. ve Albaraka Türk Katılım Bankası A.Ş.) ile beş konvansiyonel banka (ING Bank A.Ş., Türk Ekonomi Bankası A.Ş. (TEB), QNB Bank A.Ş., Şekerbank A.Ş. ve Anadolu Bank A.Ş.) çalışmanın örneklemini oluşturmaktadır. Çalışma verilerinin analiz edilmesinde öncelikle katılım ve konvansiyonel bankaların CAMELS rasyoları üzerinden ölçülen finansal performansları arasında istatistiki olarak bir farklılık olup olmadığını belirlemek için Bağımsız Örneklem T-Testi uygulanmış daha sonra ise tüm kriterler ağırlıklandırılarak bütüncül performans skoru Ri ve nihai başarı sıralamasını belirlemek üzere AROMAN (Additive Ratio Assessment with Multi-criteria Normalization) yöntemi kullanılmıştır. Yapılan bağımsız örneklem t-testi bulguları, varlık kalitesi (LPR, NPLA), kârlılık (ROA, ROE), likidite (LAR) ve sermaye yeterliliğinin (CAR) rasyoları bağlamında iki banka türü arasında istatistiki olarak anlamlı bir farklılık tespit edilememiştir. Bu bulgular, iki modelin de temel finansal çıktılar ve yasal yükümlülükler açısından rekabetçi düzeyde benzediğini göstermektedir. Ancak çalışmada, sermaye yeterliliği (EAR), yönetim kalitesi (OCA, NIRA), likidite (LDR) ve piyasa risklerine karşı duyarlılık rasyoları (MRSFX, MRSTL) açısından istatistiki olarak anlamlı farklılıkların olduğu belirlenmiştir. EAR, MRSTL %1 düzeyinde, OCA, NIRA, MRSFX % 5 düzeyinde ve LDR ise %10 anlamlılık düzeyinde anlamlıdır. Özellikle katılım bankalarının faaliyet dışı gider kontrolünde ve piyasa risklerine karşı duyarlılıkta döviz riskine karşı konvansiyonel bankalara göre daha verimli olduğunu gösteren OCA MRSTL ve MRSFX oranlarındaki üstünlük dikkat çekicidir. Bireysel ayrışmaların bütüncül başarıya yansımasını analiz eden AROMAN yöntemi ile gerçekleştirilen performans sıralamasında en yüksek başarı skoruna sahip bankanın konvansiyonel gruptan Anadolu Bank olmasına karşılık, bu bankayı Kuveyt Türk ve Vakıf Katılım gibi iki güçlü katılım bankasının takip ettiği görülmüştür. Bu bulgular, finansal başarıdaki farklılıkların model türünden ziyade bireysel bankacılık stratejilerinden meydana gelebileceğini ve katılım bankacılığı modelinin, çok kriterli değerlendirme neticesinde konvansiyonel bankacılık ile rekabet edebilir düzeyde olduğunu bilimsel olarak desteklemektedir."
