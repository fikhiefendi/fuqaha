abstract: "Bir toplumun kültürünü incelerken, o topluma mensup insanların kitap ile olan ilişkileri sorgulanmadan yapılan değerlendirmeler eksik kalacaktır. Zîrâ kitaplar, dinlenerek ya da okunarak insanların sosyal hayat pratikleri ve iç dünyaları üzerinde bir takım etkiler bırakmakta ve bu etkiler neticesinde gelişen fikirler insanların kültür dünyalarını şekillendiren unsurları oluşturmaktadır. Bu yüksek lisans çalışmasında da Osmanlı Devleti?nin önemli yerleşim yerlerinden biri olan Üsküdar?ın XVII. yüzyılda var olan kültür hayatı, Kadı Sicilleri?nden hareketle gözlemlenmeye çalışılmıştır. Bu bağlamda siciller üzerine yapılan incelemeler neticesinde, Üsküdar toplumunun kitap sahipliği noktasında yeterli düzeyde olmadığı gözlenmiştir. Elde edilen 49 adet tereke sahiplerinin büyük bir çoğunluğu Kur?an-ı Kerim dışında bir kitaba sahip değildir. Yüzyılın başı ile sonu kitap rakamları açısından incelendiğinde ortantılı bir artışa ya da düşüşe rastlanmamıştır. Mahalleler bazında yapılan incelemelerde ise hem kitap sayısı hemde kitap fiyatları açısından önce çıkan mahalle Hoca Hatun Mahallesi?dir. Varılan neticelerden biri de, kitap sahiplerinin yalnızca ilmiye sınıfına mensup kişiler olmadığı, farklı meslek gruplarından insanların da özel merakları dolayısıyla ya da ticaret amaçlı olarak, ?kitaba? sahip olmak derecesinde ilgi duydukları ve terekelerinde çok sayıda kitaba rastlanan kişilerin genellikle belirli bir gelir düzeyine sahip olduklarıdır. Dikkat çeken bir başka konu ise, bu yüzyılda en çok fıkıh alanında kitaplara sahip olunduğu, bunu tasavvuf/edebiyat ve Kur?an ilimleri alanlarınının takip ettiğidir. Bu çalışma XVII. yüzyıl kitap kültürünü tamamıyla ortaya koymak iddiasında olmamakla beraber, Üsküdar?da mevcut olan yazılı kültür tarihine ufak da olsa bir katkı sağlamayı amaçlamıştır."
