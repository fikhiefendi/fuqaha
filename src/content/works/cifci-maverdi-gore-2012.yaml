abstract: "Bu çalışmada, on birinci asırda yaşamış bir Şafii fakihi ve aynı zamanda dönemin etkili bir siyasi figürü olan, Sünni devlet geleneğinin teorisyenlerinden biri olarak kabul edilen Maverdi'nin, din-devlet ilişkisinin nasıl olması gerektiği konusundaki görüşleri incelenmiştir. İslam tarihinde din-devlet ilişkilerinin büyük bir kırılma yaşadığı bu asırda fikir üreten Maverdi, ortaya koyduğu görüşleriyle bu değişimin önüne geçmeye çalışmış, dönemin problemlerine çözüm aramıştır. Yaşadığı dönemde fikirleri pratiğe dökülmemiş olsa da; kendisinden sonra şekillenen devlet geleneklerini etkilemiş, uzun bir süre İslam dünyasında hâkim görüş olarak kabul edilmiştir."
