abstract: "Bu çalışma, mevcut ekonomik yapıda, ticarî mal kavramının kapsam ve sınırlarını tespit etme ve ticarî kapsamda yer alan birbirinden farklı faaliyet türlerine uygulanacak zekat hükümlerinin, klasik ticaret malı hükümleri ile her açıdan aynı olup olamayacağı konularını inceleme amacı taşımaktadır.Günümüzde ticarî hayat, gelişen ekonomik yapıya paralel olarak düne nispetle büyük ölçüde alan genişlemesi yaşamış ve mal değişimine aracılık etmenin yanı sıra, üretim ve tüketim faaliyetlerini de içine almıştır. Gelinen noktada üretim alanında faaliyete yönelmiş sınaî işletmelerle (sanayi sektörü), otel, özel hastane, kara, hava ve deniz işletmeciliği gibi hizmet işletmeleri (hizmet sektörü) geleneksel ticarî faaliyet olan menkul mal alım satımının yanında ticarî kapsamda yer almaktadırlar.Gerek Kur'an-ı Kerimde gerekse Hz. Peygamberin hadislerinde, ticaret mallarının zekat hükümleri (nisap, yıllanma, oran vb. konularda) ile ilgili herhangi bir net bilgi mevcut değildir. Bu alanla ilgili hükümler, Kur'an ve sünnetteki genel esaslar ile sahabe ve tabiin uygulamalarına dayandırılmaktadır. Klasik fıkıh bilginleri, sahabe ve tabiîn uygulamalarına dayanarak bu alana uygulanacak zekat hükümlerinin, paranın zekat hükümleri ile aynı olduğu yönünde ortak bir yaklaşım sergilemişlerdir. Klasik fıkıh müktesebatında zekat hükümleri incelenen ticaret malı, ağırlıklı olarak, para ve canlı hayvan dışındaki menkul mallardır. Ancak günümüzde ticarî kapsamda yer alan ticarî faaliyetlerin tümü, fıkıh kitaplarında incelenen ticarî faaliyetlerle aynı olmadığı için, bu alanlara uygulanacak hükümlerin de paranın hükümleri, dolayısıyla klasik ticaret malı hükümleri ile her açıdan aynı olmaması işin tabiatı gereğidir. Birbirinden yapısal farklılığı olan mevcut ticarî alanlar, sermaye artı kazancın (toplam aktif) yahut sadece gelirin zekata tabi olma durumuna göre özellikle yıllanma, nisap ve oran konularında farklı hükümlere tabi olurlar."
