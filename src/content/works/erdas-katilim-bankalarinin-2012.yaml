abstract: "Günümüzde, sadece İslam ülkelerinde değil, tüm dünya ülkelerinde özellikle ABD ve İngiltere gibi finans sektörünün çok iyi ilerlemiş ülkelerde dahi hızla yaygınlaşan faizsiz bankalar, diğer klasik bankaların yaptıkları işlemleri faiz olgusuna yer vermeden yerine getiren kurumlardır.50 yıl önce düşünce olarak dünyamıza giren faizsiz bankacılık sistemi 1970 yıllarda düşünce aşamasından çıkıp uygulanma aşamasına geçmiştir. Dünyada ilk 1970'li yıllarda İslami bankaların faaliyete başlamaları ile birlikte dünya çapında çeşitli kuruluşlar oluşturulmuştur. Türkiye'de ise 1980 sonrasında alınan kararalar ve düzenlemelerle finansal serbestleşme hareketleri başlamıştır. Bu hareketler doğrultusunda faizsiz bankacılık 1983 yılında Kanun Hükmünde Kararname ile ülkemizde kurulmasına izin verilmiştir. Türkiye'de 1985 yılında kurulan ilk faizsiz banka Özel Finans Kurumları yeni adıyla Katılım Bankaları dünyada özellikle son on yılda çok büyük bir gelişme göstermişlerdir.Ülkemizde Katılım Bankaları, özellikle 2001 yılından sonra büyük bir atılım içerine girmiş ve diğer klasik bankalar ile rekabet edebilir bir konuma gelmiştir. Bunda 1999 ve 2001 yılında yapılan değişiklik ile Katılım Bankalarının, Bankalar Kanununa tabi olması Katılım Bankalarının diğer klasik bankalarla mevzuat açısından aynı hak ve yükümlülüklere sahip olmasının büyük katkısı bulunmaktadır.2005 yılında yürürlüğe giren bankacılık kanunu ile Özel Finans Kurumları'nın adı katılım bankası olarak değiştirilmiştir. Katılım bankaları bu dönemde finans sektörünün alternatifi olmadıklarını tamamlayıcı olduklarını belirtmeye çalışmışlardır. Bu değişikle birlikte Katılım Bankaları, bankacılık sektöründe diğer bankalarla birlikte faaliyet göstermeye başlamıştır.Bu tez çalışmasında katılım bankacılığının Türk bankacılık sektörü içerisindeki durumu incelenmektedir. Katılım bankalarının dünyada ve Türkiye'deki tarihsel gelişim sürecine değinilmiş, katılım bankalarının esasları, teorileri, fon toplama ve fon kullandırma yöntemleri ile dünyadaki durumu hakkında bilgilere yer verilmiştir. Son olarak, Türkiye'de faaliyette bulunan katılım bankalarının hem kendi aralarında hem de Türk bankacılık sektörü içerisinde performans değerlendirmesi ve analizleri yapılmıştır."
