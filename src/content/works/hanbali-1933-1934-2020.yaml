abstract: "Şer'î sicillerin incelenmesi, İslâm ümmetinin tarih boyunca yaşadığı vakıayı tahlil edebilme açısından büyük öneme sahiptir. Bu sicillerin araştırılmasıyla birlikte insanların birbiriyle olan alım, satım, evlenme ve boşanma gibi muamelelerinin keyfiyetinin yanı sıra meselelerini ve ihtilaflarını çözmede dini esaslara nasıl dayanmış oldukları anlaşılmaktadır. Bu yüzden biz de İslâm Araştırmaları Merkezi'ndeki (İSAM) sicillerden biri olan ve Dımaşk (Şam) Kasrüladli Sicilleri arasında 250/56 numarasıyla mevcut bulunan Şeyh Abdülmuhsin el-Üstuvânî sicilini inceledik. Çalışmamızda adı geçen sicilin tamamını hiçbir değişiklik yapmaksızın kopyaladıktan sonra üzerinde fıkhî açıdan incelemelerde bulunduk. Bu kapsamda dirâse bölümünde sicildeki meseleleri İbrahim el-Halebi'nin Mülteka'l-Ebhur ve onun Damad Efendi'ye ait şerhi olan Mecme'u'l-Enhur adlı eserlerine uygun olarak fıkıh bâblarına göre tasnif ettik. Ardından Dimeşk'teki şer'î sicillerden ve onların İSAM Kütüphanesi'nde ve Dimeşk Tarihi Vesikalar Merkezi'ndeki mevcut durumundan bahsettik. Sonrasında incelemiş olduğumuz sicilin sahibi olan Şeyh Abdülmuhsin el-Üstuvânî ve ona yardımcı olan kadı ve danışmanların biyografilerine yer verdik. Daha sonra genelde Osmanlı Devleti'nde, özelde ise Dimeşk'teki yargının tarihine dair özet bilgiler sunduk. Bundan sonra da meseleleri fıkhî açıdan tahlil ettik."
