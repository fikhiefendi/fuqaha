abstract: "Bağdat ulemasının önde gelen şahsiyetlerinden olan Kudûrî, el-Muhtasar eseriyle şöhret kazanmış ve Hanefî mezhebindeki yetkinliğini ortaya koymuştur. Öyle ki mezhepte kitâb denildiğinde bu eser anlaşılmaktadır. İlm-i hilâfa dair kaleme almış olduğu et-Tecrîd adlı eserinde ise Kudûrî, Hanefîler ile Şâfiîler arasındaki ihtilâfları müdellel bir şekilde ele almıştır. Böylece Hanefî mezhebinin yanında Şâfiî mezhebine de son derece vâkıf olduğunu göstermiştir. Eserin kitâbü's-sıyâm bölümüne dair yaptığımız bu çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş kısmında çalışmanın amacı, önemi ve metodundan bahsedilerek literatür değerlendirilmesi yapılmıştır. Birinci bölümde ilm-i hilâf ve Kudûrî hakkında bilgi verilmiş aynı zamanda Tecrîd tanıtılmıştır. İkinci bölümde kitâbü's-sıyâm kısmındaki otuz dört mesele tahlil edilmiştir. Üçüncü bölüm ise ikinci bölümde tahlil edilen meselelerin istidlal bakımından değerlendirilmesine ayrılmıştır. Böylece eserin sistematiği ortaya konularak okuyucunun Tecrîd'in sistematiğine, ilm-i hilâfa ve Kudûrî'nin ilmî birikimine dair bilgi sahibi olması hedeflenmiştir."
