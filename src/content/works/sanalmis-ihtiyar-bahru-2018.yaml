abstract: "Mevsılî'nin el-İhtiyâr adlı eseri ve İbn Nüceym'in el-Bahrü'r-râ'ik adlı eserleri Hanefî mezhebinde oldukça önemli bir yere sahip fıkıh eserleridir. Gerek Hanefî mezhebinin klasik fıkıh usûlü eserlerinde gerek muâsır usûl eserlerinde Hanefî mezhebinin örfe en fazla önem veren mezhep olduğu belirtilir. el-İhtiyâr ve el-Bahrü'r-râ'ik; örfe dair kavramların, kullanımların, kâidelerin ve örneklerin zikredildiği, zaman zaman örfle ilgili farklı anlayış ve uygulamaların ifade edildiği iki önemli eserdir. İncelemiş olduğumuz iki eserin müellifinin Hanefî mezhebi içerisinde meşhur olmaları ve farklı beldelerde yaşamış olmaları da örf ile ilgili hükümlerin daha iyi anlaşılması ve tespiti açısından önemlidir. Biz de araştırmamızda, ilk etapta İslâm Hukukunda örfün yeri ve önemini ve Hanefî mezhebinin örfe bakışını teorik olarak ele aldık. Örfün özellikle Hanefî mezhebi içerisinde akışını tatbiki olarak da el-İhtiyâr ve el-Bahrü'r-râ'ik adlı eserler çerçevesinde inceledik. Çalışmamız; İslâm hukukunun her zaman ve mekânda dinamik oluşunun tespiti, örfün teorik ve pratik anlamda özellikle Hanefî mezhebi içerisindeki oluşumu, örfe dair hükümlerin değişebilirliği, farklı zaman ve mekânların, beldelerin, insanların ihtiyaçlarının, toplumlardaki zaruretin, toplumlardaki bazı bozuklukların, farklı yaşam tarzlarının, luğavi kullanımların fıkha olan etkisini ifade edebilme açısından önemlidir."
