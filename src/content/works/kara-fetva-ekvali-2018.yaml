abstract: "Fıkıh ilmi şeri ilimlerin en önemlilerinden biridir. Çünkü İslam şeriatı emir ve nehiylerden oluşmaktadır. Kişinin ne zaman bir fiil ile emredilmiş, ne zaman o fiilden nehyedilmiş ve ne zaman o fiili yapmak ve terk etmek arasında muhayyer bırakılmış olduğuna hükmeden ilim Fıkıh İlmidir. Âlimlerimiz (Allah Onlardan Razı Olsun) tarih boyunca yeni meselelerde Allah Teâlâ'nın hükümlerini beyan etmek için büyük çaba sarf etmişlerdir. Ancak âlimlerin tek bir hüküm etrafında ittifak ettikleri meseleler ihtilaf ettikleri ve farklı görüşlerin ortaya çıktığı meselelere göre çok azdır. İhtilaf ettikleri meselelerde verdikleri hükümler racih ve meşhur görüşleri kapsayan sahih kaviller ve şaz ve mercuh görüşleri kapsayan zayıf kaviller olmak üzere iki kısma ayrılmaktadır. İlk dönem âlimlerimiz bizi şaz görüşleri almak ve onlarla fetva vermek konusunda uyarmasına rağmen modern dönemde işlerinde ve fetvalarında bu görüşlere dayanan müftüler bulunmaktadır. Bundan dolayı ben bu tezimde şaz görüşün ıstılahi manasını açık bir şekilde açıklamaya, onun kural ve kaidelerini belirtmeye ve sonrasında şaz görüş ile amel etmenin ve onunla fetva vermenin hükmünü açıklamaya çalıştım. Anahtar"
