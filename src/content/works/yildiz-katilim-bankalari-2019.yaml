abstract: "Bankacılığın kuruluşu faiz prensibi üzerine, bir tarafın daima zarar ettiği, paradan para kazanma yöntemiyle kar elde etme şeklinde olmuştur. Dini hassasiyetleri sonucu faizden (riba) uzak duran kesimin elinde atıl sermaye artmaya başlamıştır. Küreselleşme ile birlikte körfez ülkelerinde ki petrolün dünyaya yayılması burada ki sermayenin geniş kitlelere aktarılmasıyla birlikte İslam'a uygun bankacılık faaliyetlerinin araştırılmasına sebep olmuş ve 1963 yılında Ahmed en-Naccar tarafından Mısır'da ilk İslami banka örneği kurulmuştur. 1971 yılında Mısır'da“Nasr Sosyal Bankası”devlet desteğiyle kurulmuş ve kurulan ilk faizsiz ticari banka olmuştur. Katılım bankacılığından önce ise İslam kesiminde Beytü'l-mal, Cehbezler, Sarraflar ve Dostluk ve Yardımlaşma kurumları ile günümüz katılım bankacılığı işlemleri yapılmıştır. Dünya'da 2017 sonu itibariyle 69 ülkede toplam 1389 faizsiz finans kurumu yer almakta ve toplam 2.44 trilyon USD varlıkları bulunmaktadır. 2023 hedefi ise 3.8 trilyon USD'dir. Türkiye'de 2019 itibari ile 6 tane katılım bankası mevcuttur. 2018 sonu itibari ile faaliyet gösteren 5 katılım bankasının 1122 şube ve 15654 çalışanı bulunmaktadır. Katılım Bankaları 2009-2018 dönemi arası %22 sektör büyümesi ile toplam 206.806 milyon TL aktif ile sektörün %5,3'üne sahiptir."
