abstract: "Kur'an, çeşitli kavramları kullanarak insanın olumlu ve olumsuz kişilik özelliklerini anlatır. Suçlu kavramıda bu kavramlardan biridir ve olumsuz özelliklerle yüklüdür. Dolayısıyla İslam hukukunun tasnifi, amme hukuku ve hususi hukuk ayrımı yerine ibadetleri de içine alarak şeklinde farklı bir ayrıma tabi tutulmuştur. Buna göre fıkhı hükümler,“İbadat”“ Muamelat”ve“ Ukubat”olmak üzer üç ana guruba ayrılır. İslam ceza hukuku“Ukubat”bölümünde ele alınır. Hz. Peygamber (s.a.s)'in suç hakkındaki uygulamalarına bakıldığında belirli ilkeler çerçevesinde hareket edildiği görülür. Bu ilkeler kendi içerisinde tutarlılık arz ettiği gibi birbirleriyle de uyum içerisinde bir bütünün parçaları gibidirler. Hz. Peygamber (s.a.s) döneminde her suçun kendisine has unsurları, cezaları teker teker ortaya koyulmuştur. Bu hususlar sonradan gelecek ümmetine uygulamalı olarak öğretilmiştir."
