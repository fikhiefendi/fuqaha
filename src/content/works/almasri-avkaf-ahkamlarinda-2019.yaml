abstract: "Bu tezde vakıf mallarının takası ve kiralanması konusu detaylı bir şekilde ele alınarak bu konun açığa kavuşturulması hedeflenmektedir. Fakihler geçmişte bu iki meseleyi makasıd ilmi bakış açısıyla beyan etmeye çalışmışlardır ve bu hususta belirli fıkhi kaideler vaz etmişlerdir. Kınalızade Ali Efendi; Vakıf Ahkamı adlı risalesinde“AVKÂF AHKÂMLÂRINDÂ İSTİBDÂL VE İSTİCÂR HAKKINDA RİSÂLE TAHKİK VE İNCELEME”vakıflaların takası ve kiralanmasının cevazı ile ilgili olumlu ve olumsuz görüşleri naklettikten sonra bu görüşleri detaylı şekilde incelmeye tabi tutup cevazını şartları ile zikretmektedir. Ayrıca cevazına karşı verilen bazı fetvaları naklettikten sonra o fetvalara reddiye mahiyetinde cevap vermiştir. Kınalızade efendi bu risalesinde vakıfların kiralanması ile ilgili sekiz görüş zikretmiştir. Risale bir mukaddime iki makaleden oluşur. Birinci makale dört fasıldan oluşmakta olup vakıfların takası ve satışı hakkındadır. İkinci makale ise dört baptan oluşmakta olup vakıfların kiralanmasının hükmünü ihtiva etmektedir. Bir Osmanlı fıkıh âlimlerinden olan Kınalızade Hanefi mezhebin geçmiş ulemasından ve çağdaşı olan âlimlerden değerli nakillerde bulunmuş olması ve ek olarak rivayet nakletmesi , Şam'da kadılık makamında bulunmuş olduğundan vakıfların kayıt altına alınması meselesinde kendine ait görüş belirtmesi hasebiyle Hanefi mezhebinde önemli bir konuma sahiptir ve kendine ait tespitleri olması açısından Hanefi mezhebinde önemli bir konuma sahiptir. Bu çalışmada Kınalızade'nin hayatı, metodu ve kaynakları ile ilgili inceleme ve üç nüshayı karşılaştırarak risalesinin tahkikini yaptım. Yüce mevla'dan makbul olmasını ve Muvaffakiyetler dilerim."
