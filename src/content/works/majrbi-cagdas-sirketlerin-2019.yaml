abstract: "Araştırma amacı ışık çağdaş şirketlerin sözleşmeleri ve bunların hükümleri ve bunların uygulamaları, ve bilinç ne ölçüde uygun kriterleri meşruluğu, yanı sıra bilgi, teoriler, sözleşmeler, İslam ve laik yasalar ve hazırlanan sözleşmeler, İslam ve görev elde şirketler tarafından İslam, yanı sıra biliyoruz, genel hükümler, çağdaş şirketler, ve sonra bir dizi çözümleri şirketleri katkıda bulunmak için gelişmeler, çağdaş İslam ekonomisi. Bu araştırmacı ve ardından bir grup bilimsel yöntemleri hangi tema, açıklayıcı bir yaklaşım, araştırmacı, sözleşmeleri ve şirketlerin İslam, Kutsal Koran; chunk kayak, hükümler ve sunna peygamber ve açıklamalar ve deyen juris çağdaş şirketler için adresleme esas fikirler ve görüşler, denenmiş tanımlamak için kavramları, modern şirketlerin İslam ve karşılaştırma şirketler arasında, İslam ve şirketlerin pozitif ekonomi, stand bazı unsurlar. stand, yansıyan, çalışma, çaba olası göstermeye çalıştık, tüm tema, İslam, denge ve itidal ve damga, bir araştırmacı, sonuçlar ve öneriler. Bu araştırma beş bölümden oluşmaktadır. Birinci bölüm araştırmanın giriş kısmıdır. Bu kısımda araştırmanın sorunu, hedefleri, önemi ve hipotezler, metodoloji, araştırmanın yapısı, konu hakkında yapılmış geçmiş çalışmaların yanı sıra konusunun seçilme sebebi işlenir. İkinci bölüm ise İslam fıkhında ve çağdaş kanunda akdin tanımı işlenir. Üçüncü bölüm“Ortaklıklar”başlığını taşır, dördüncü bölümde de fıkıhta ortaklıklar ve çağdaş ortaklıklar konusu işlenir. Son olarak, beşinci bölüm sonuç bölümüdür, çıkarımlar, öneriler, kaynaklar, referanslar ve özgeçmiş mevcuttur."
