abstract: "Câhiliye dönemi ceza hukuku ve İslâm ceza hukukuna etkisini konu edinen bu çalışma giriş, genel değerlendirme, sonuç ve üç bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu, amacı, önemi, kapsamı ve sınırlılıkları ele alınmıştır. Câhiliye kelimesinin tanımı ve döneminin ele alındığı birinci bölümde, hukukun malzemesi olan insan ve toplumun etnik ve sosyal yapısıyla beraber yarımadanın bölgeleri incelenmiştir. Câhiliye dönemi ceza hukukunun oluşmasına etki eden faktörlerin, dönemin hukukunun ilkelerinin, uygulanmasındaki zorlukların ve dönemin ceza muhâkeme usulünün incelendiği ikinci bölümde, dönemin hukukunun oluşumu, keyfiyeti ve tarihi serüveni ayrıntılı bir şekilde irdelenmiştir. Dönem içindeki suç kavramının tanımı, unsurları ve türleri ile birlikte, ceza kavramının tanımı ve çeşitlerini ele aldığımız üçüncü bölümde ise, suç ve cezalandırmaya dâhil olan uygulamalar, ilgili konu başlıklarının altında irdelenmiştir. Genel değerlendirme kısmında ise suç ve cezalar kısmında ilgili konu başlıkları altında ayrıntılı bir şekilde incelediğimiz iki hukuk sistemi arasındaki etki, icmâli bir şekilde derlenmiştir. Çalışmanın sonuç kısmında ise ulaştığımız tespitlerle ilgili genel bir değerlendirme yapılmıştır."
