abstract: "Tezimizde XVIII. yy. Osmanlı Şeyhülislamlarından Menteşzade Abdurrahim Efendinin“Fetâvâ-yı Abdurrahim”isimli fetva kitabının bir bölümünü içeren Aile hukuku kapsamında evlilikle ilgili fetvalarının latinize edilerek değerlendirilmesi yapılmıştır. Fetvalardan hareketle dönemin sosyo kültürel yapısı aile hukuku bağlamında tahlîl edilmiştir. Araştırmamız bir giriş ve iki bölümden müteşekkil olup giriş kısmında amaç, yöntem, konunun sınırları ile Abdurrahim Efendi'ninin hayatı ve fetva kavramı üzerinde durulmuşur. Birinci bölümde Evlilik /Nikah akdinin genel hususları, ikinci bölümde evlilik akdinin neticeleri incelenmiştir. Fetvalar latinize edilmiş, doktrin ve uygulama bazında değerlendirilmiştir. Dönemin hukuki uygulamalarında Hanefi mezhebinin dışına çıkılmayıp, mezhebe bağlı kalmaya özen gösterildiği görülmüş olup, sonuç kısmında da evliliğe ilişkin dikkat çeken konular ele alınmış dönemin sosyal dokusu tahlil edilmeye çalışılmıştır."
