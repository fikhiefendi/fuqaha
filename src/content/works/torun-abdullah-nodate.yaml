abstract: "“Ebu Hanife'ye Göre İstihsanü'n-Nass [Serahsi'nin el-Mebsut Örneği]”ismini taşıyan bu tezde Ebû Hanîfe (r.a.)'in Fıkıh Usûlü ilmindeki delil/yöntemlerden istihsanın bir çeşidi olan istihsânü'n-nassa dair anlayışı Şemsüleimme Serahsî'nin el-Mebsût adlı eseri çerçevesinde ele alınmıştır. Konunun işlenişinde Ebû Hanife (r.a.)'in sünnete verdiği önem merkeze alınmıştır. Tez, bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde tezin konusu, kaynakları ve amacından bahsedilmiştir. Birinci bölümde istihsan kavramıyla ilgili birkaç başlık altında ön bilgiler verilmiştir. İkinci ve son bölümde ise Mebsut'ta Ebû Hanîfe (r.a.)'in istihsanü'n-nassa başvurduğu yerler örneklendirilmiş ve her örnek açıklanmıştır."
