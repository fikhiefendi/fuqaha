abstract: "Bu araştırma, Türkiye'deki katılım bankacılığı sisteminde özel cari hesapların İslam hukuku açısından değerlendirilmesini konu almaktadır. Hesapların işlevleri ve fıkhi statüsü, İslam hukuku açısından net olarak belirlenmemiştir, bu da çeşitli fıkhi sorunlara yol açmaktadır. Araştırmanın amacı, bu hesapların doğru bir şekilde tanımlanması ve fıkhi açıdan değerlendirilmesi ihtiyacını karşılamaktır. Araştırmada betimsel ve nitel yöntemler kullanılmıştır. Tasvir yöntemşiyle özel cari hesapların tanımı, işlevleri ve hukuki çerçevesi ayrıntılı olarak ele alınmıştır. Nitel yöntemle ise, bu hesapların İslam hukuku açısından nasıl değerlendirileceği incelenmiştir. Ayrıca, mevcut uygulamalarla en uyumlu fıkhi değerlendirmeyi sunmak için klasik fıkhi metinler ve ilgili literatür gözden geçirilmiştir. Araştırma, İslam hukuku açısından özel cari hesap sözleşmesinin yeni bir sözleşme türü olarak değerlendirilmesinin en uygun görüş olduğu sonucuna varmıştır. Zira özel cari hesap sözleşmesi, vedia veya karz gibi İslam hukukundaki isimli sözleşmelerle tamamen örtüşmez. Özel cari hesapların İslam hukuku açısından yeni bir sözleşme olarak değerlendirilmesi, bankalar ve müşteriler arasındaki hak ve yükümlülüklerin daha net belirlenmesine olanak sağlayacaktır. Bu değerlendirme sayesinde katılım bankacılığı ürünlerinin İslam hukukuna uyumunun, şeffaflığının ve güvenilirliğini arttırması beklenmektedir."
