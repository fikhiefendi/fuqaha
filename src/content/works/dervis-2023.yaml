abstract: "Hızla gelişen ekonomilerden birine sahip olan Türkiye, başta Araplar olmak üzere yabancı yatırımcıların ilgisini çekmiş, bu da kaliteli ve güvenilir bankacılık ihtiyacını doğurmuştur. Bu noktadan hareketle çalışmamız, Türkiye'deki Katılım bankaların Arap müşterilerine sundukları bankacılık hizmetlerinin kalite düzeyini belirlemeyi, amaçlamıştır. Çalışma, bankacılık hizmetlerinin kalitesini, bu bankaların yetkililerinin bakış açısıyla değil, Katılım bankaların müşterilerinin bakış açısıyla ele almıştır. Bu da çalışmayı sonuç olarak daha değerli kılabilir. Analitik tanımlayıcı bir yöntemin izlendiği çalışmada, konunun kapsamına giren rastgele seçilmiş 373 kişiden oluşan bireyler üzerinde anket uygulanmış, sonuçlar spss programı aracılığıyla veriler işlenerek analiz edilmiştir. Çalışmanın sonuçları, Katılım bankaların iyi bir itibara sahip olduğunu ve Katılım bankaların sunduğu hizmetlerden memnuniyet yüzdesinin yüksek olduğunu göstermektedir, bu da sunulan hizmet kalitesi ile müşteri memnuniyeti arasında güçlü bir ilişkiye işaret etmektedir. Sonuç olarak, çalışma, Türk Katılım bankalarının yönetiminin, Arap müşterilerine sundukları hizmetlerin kalitesini iyileştirme hususunda netice almak ve onların güvenini kazanmak için hizmetlerini Arapça dilinde sunmaya ve alınan sonuçları sürekli değerlendirmeye tabi tutmaya özen göstermeleri gerektiğini tavsiye ediyor."
