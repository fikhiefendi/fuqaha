abstract: "Çalışmamızda Milli Eğitim Bakanlığı İslam Ansiklopedisi (İA) ile Türkiye Diyanet Vakfı İslam Ansiklopedisi'ndeki fıkıh usûlü ile ilgili maddelerin tesbitini, tasnifini ve mukayesesini yapmaya çalıştık. Giriş kısmında araştırmanın amacı ile yöntemi yanında İslam Ansiklopedisi ve bu ansiklopedinin aslı olan The Encyclopaedia of Islam ile TDV İslam Ansiklopedisi hakkında ayrıntılı bilgi verdik. Birinci bölümde her iki ansiklopedide geçen fıkıh usûlü ile ilgili genel maddeleri tesbit, tasnif ve tanıtımını yaptık. İkinci bölümde ise her iki ansiklopedide geçen fıkıh usûlü ile ilgili özel maddelerin tesbit, tasnif ve tanıtımını yaparken Mısırlı hukukçu Abdülvehhâb Hallâf'ın (ö. 1956) Usûli'l-fıkıh adlı kitabını esas aldık."
