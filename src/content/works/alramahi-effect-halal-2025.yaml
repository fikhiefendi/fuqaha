abstract: "Bu çalışma, Türkiye'nin helal dostu turizm sektöründe Müslüman turistlerin deneyimlerini, algılarını ve davranış niyetlerini incelemektedir. Türkiye'nin büyüyen küresel Müslüman turizm pazarı; kültürel yakınlığı, İslami mirası ve artan helal hizmet çeşitliliğiyle şekillenmektedir. Çalışmanın amacı, helal dostu destinasyon özelliklerinin Müslüman turistlerin algıladığı değer, güven, memnuniyet, tutum, destinasyon imajı ve yeniden ziyaret etme niyeti üzerindeki etkisini anlamaktır. Yaş, cinsiyet ve önceki seyahat deneyimi gibi demografik faktörler de turistlerin helal turizm bağlamındaki değerlendirme ve davranışlarını etkilemektedir. Araştırmada, Türkiye'de fiili seyahat deneyimine sahip on bir Müslüman turist ile yarı yapılandırılmış görüşmeler gerçekleştirilmiştir. Bulgular; helal yiyecek, ibadet imkânları, cinsiyet ayrımına uygun tesisler ve saygılı kültürel ortamın turist memnuniyetini artırdığını ortaya koymuştur. Katılımcılar, Türkiye'yi duygusal ve manevi açıdan kendilerine yakın, güvenli ve kültürel olarak tanıdık bir destinasyon olarak değerlendirmiştir. Destinasyon imajı, helal dostu hizmetler ile davranış niyetleri arasında aracı unsur olarak belirlenmiştir. Çalışmada; Türkiye'de helal turizm hizmetlerinin tanıtımı için merkezi sistemlerin kurulması, hedefe yönelik pazarlama faaliyetleri, daha şeffaf helal sertifikasyonu ve güçlü iletişim stratejilerinin geliştirilmesi önerilmektedir. Kişisel, kültürel ve dini değerler; Müslüman turistlerin seyahat memnuniyetini ve sadakatini önemli ölçüde etkilemektedir. Bu çalışma, helal turizm konusundaki akademik literatüre katkı sağlamakta ve Türkiye'nin Müslüman dostu bir destinasyon olarak konumlandırılmasında turizm politika yapıcılarına, konaklama işletmelerine ve pazarlamacılara pratik bir rehber niteliği taşımaktadır."
