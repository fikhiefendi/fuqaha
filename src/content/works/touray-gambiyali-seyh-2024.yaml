abstract: "Bu çalışma, Şeyh Ali Badara Fayı (1885-1965)'nın yaşamını ve İslam Hukuku'na ait görüşlerini inceleyip anlatarak; Şeyh'in Gambiyalı alimlere bir örnek teşkil etmesini ve böylece Gambiya halkı arasındaki sorunların çözülmesine katkı vermeyi hedeflemektedir. Bu çalışmamızda ilk olarak, Şeyh Ali Badara Fayı'nın hayatı ve ilmi kişiliği anlatılmakta; eğitimi, hocaları, öğrencileri ve ardında bıraktığı eserler hakkında özlü bilgiler verilmektedir. Gambiya'nın yetiştirdiği en büyük alimler arasında yer alan Şeyh Ali Badara Fayı, hayatını İslam'ı öğrenmeye ve öğretmeye adamıştır. Gambiya'da başladığı tahsil hayatına Senegal'de devam eden Şeyh, çağının önemli alimlerinden farklı alanlarda ders alma fırsatı bulmuştur. Özellikle tefsir, fıkıh, şiir, ve astroloji konularına önem göstermiştir. Senegal'deki eğitimini tamamladıktan sonra Gambiya'ya dönüp dersler vermiştir. Şeyh Ali Badara Fayı'nın güzel ahlakı, öğrencilerinin ve çağdaşı diğer alimlerin saygısını kazanmasını sağlamıştır. Öğretimde Sünni İslam'ın metodunu benimseyen Şeyh, döneminin zor kitaplarını okumalarında öğrencilerine sağladığı yardımlarla, büyük alim anlamına gelen ve o dönemde çok az kişiye verilen“Karamo”ünvanına layık görülmüştür. Çalışmamızın ikinci kısmında, Gambiyalı Şeyh Ali Badara Fayı'nın Bazı Güncel Fıkıh Problemlerine İlişkin Görüşleri“Fıkıh-İbadet ”ve“Fıkıh-Muamelat”adıyla iki başlıkta incelenmekte olup Şeyh'in fıkhi görüşleri, öncelikle mümkün olduğunca Kur'an ayetleri ve sünnet delilleriyle ortaya konmaktadır. Sonrasında söz konusu görüşler fıkhın diğer delilleriyle desteklenmektedir. Fıkıh-İbadet bağlamında Şeyh'in, cami inşası, onarımı ve camide yapılması uygun olmayan davranışlar vb. konular hakkındaki görüşleri detaylıca anlatılmış ve analizi yapılmıştır. Fıkh-Muamelat bölümünde ise Şeyh Ali Badara Fayı'nın evlilik hukuku konusundaki görüşleri ele alınmaktadır. Şeyh, nikah konusunda tartışmalı olan durumlar üzerine kendi görüşlerini, Maliki mezhebiyle temellendirerek belirtmiş ve bu soruların cevap bulmasına yardımcı olmuştur."
