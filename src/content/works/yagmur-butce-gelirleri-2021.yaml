abstract: "Tarihin ilk çağlarından itibaren devlet olma niteliğini kazanmış her yapının, toplumsal hayatın gereği olarak birtakım görevleri ve işlemleri yapması gerekir. Devlet olmanın gereği olarak yerine getirilmesi gereken işlerin yapılması da devletin gelirlere sahip olmasını kaçınılmaz kılmıştır. Bu amaçla hangi ideolojiye sahip olursa olsun her devlet kendisi için birtakım gelirler oluşturmuştur. İnsan hayatının her alanını ilgilendiren çözümlere, hayat sistemine sahip olan İslam dini de devlet gelir ve giderleri hakkında çözümler ortaya koymuştur. İslam hukukunda beytülmâl kavramı içerisinde ele alınan bu gelirlerin nelerden meydana geldiği ve diğer hususlar tüm detaylarıyla belirtilmiştir. Aynı zamanda toplanacak olan gelirlerin nerelere ne miktarlarda ve ne şekilde harcanacağı da netleştirilmiştir. Özetle İslam hukuku devlet gelir ve giderleri hakkında yeterli miktarda tafsilata yer vermiştir. Bu tezde, İslam hukukunda bütçe bağlamında devlet gelirlerinin nelerden meydana geldiği, İslam fıkhında kamu mülkiyeti kavramı, kamu mültiyeti gelirleri, madenlerin hukuki statüsü, vergilendirme ilkeleri ve bunların harcama yönleri ele alınmıştır."
