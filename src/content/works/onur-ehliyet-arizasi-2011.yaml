abstract: "Bütün insanlar hukuken korunan ve sahibine bu korunmadan yararlanma yetkisi tanıyan hak sahibi birer şahsiyettirler. Ancak herkes hak sahibi olmakla tasarrufta bulunma yetkisine sahip olamaz. İslam Hukukçularına göre kişi sefîh olmadığı, rüşdüne erdiği andan itibaren tüm tasarruflarında serbest hale gelir.Şer'i bir ehliyet arızası olarak sefeh; malı akıl ve iz'anın onaylamayacağı biçimde telef etmektir. Kısaca sefeh, görüş ve düşüncede hevâ ve hevese uymak, akıl ile değil zevk ile hareket etmektir.Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde sefehle ilgili kavramsal çerçeve, ikinci bölümde ise sefehin hukuki boyutları ele alınmıştır. Birinci bölümde sefehle ilgili kavramsal çerçevenin belirlenmesi şu şekilde yapılmıştır:Ehliyet teriminin tanımı, ehliyetle ilgili bazı terimler, ehliyet çeşitleri, insan hayatının gelişim aşamaları ve ehliyetlere etkisi ve ehliyet arızaları klasik yaklaşımdan farklı bir bakış açısıyla işlenmiş, sefeh teriminin sözlük ve terim anlamları anlatılmış ardından sefeh kelimesinin Kur'an ve hadislerdeki kullanımı üzerinde durulmuş ve sefehle bağlantılı terimler detaylandırılmıştır. İkinci bölümde sefehin tesbiti ve hukuki sonuçları, sefehin dini-hukuki sonuçları ve günümüz Türk Hukuku açısından sefeh ele alınmış ve en sonunda bir sonuca ulaşılmaya çalışılmıştır."
