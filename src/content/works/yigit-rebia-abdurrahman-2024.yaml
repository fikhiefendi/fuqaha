abstract: "Medineli tâbiîn âlimlerinden biri olan Rebîa b. Ebû Abdurrahmân (ö.136/753) hocaları arasında bile ilimle temayüz etmiştir. Ehl-i hadise mensup biri olarak onun hadis ilmindeki yeri yanında, sünnet-hadis yurdunda yetişmesine rağmen, re'yi öne çıkarmasının gerekçeleri de merak uyandırmaktadır. Bu sebepten Rebîa'nın kullandığı re'yinin öncülleri de araştırılmıştır. Rebîa'nın rivâyetlerinin tamamı gözden geçirildiğinde onun rivâyetlerinin bir kısmının müsned, bir kısmının da mürsel ve munkatı olduğu görülmektedir. İlk dönem âlimlerinde yaygın olarak gözlemlendiği üzere Rebîa'nın düşüncesinde de adem-i ittisalinin tek başına hadisin sıhhatine zarar vermeyeceği hükmünün yer aldığı görülmektedir. Ancak bu durum, onun senedlere önem vermediği anlamına gelmemektedir. Rebia'nın sünnet anlayışıyla ilgili göze çarpan en önemli husus, amel-i ehl-i Medine ve umûmü'l-belvâyı, haber-i âhâda tercih etmesidir. Rebîa'nın:“Bin kişinin bin kişiden nakli, bir kişinin bir kişiden rivâyetinden bana daha iyidir; çünkü bir kişin bir kişiden rivâyeti sünnetin elinizden kayıp gitmesine yol açar.”şeklindeki sözü onun toplumda karşılık bulan yerleşik sünnetin gücüne, âhâd haberden daha fazla değer verdiğini ortaya koymaktadır. Elbette onun Medinelilerin amelini, haber-i vâhide tercih etmesi, yerleşik uygulamanın sünnete dayanma ihtimalini haberi vâhidden çok daha güçlü kabul etmesindendir. Ayrıca onun bu görüşü birkaç kişi tarafından nakledilen, insanların çoğu tarafından bilinmeyen, şâz olan bir hususun sünnet olarak isimlendirilemeyeceği şeklinde de yorumlanabilir. Rebîa,“Sika olmayan ravilerden rivâyette bulunmayı”İslam ümmeti hakkında en çok korktuğu hususlar arasında saymaktadır. Hadîs uydurma faaliyetlerinin yol açtığı zararlar ve bu tür faaliyetlerin hadîse karşı güvensizliğe sebebiyet vermesi aslında onun bu endişelerinde ne kadar haklı olduğunu ortaya çıkarmış bulunmaktadır. Rebîa, meselelerin çözümünde nasların yanısıra insan aklını, idraki ve düşünmeyi öne çıkarmaktadır. Rebîa'nın“Allah kitap indirdiği halde nasıl ki sünnete bir yer ayırmışsa Hz. Peygamber de sünnet ortaya koyduğu halde re'ye bir yer ayırmıştır.”sözü, onun re'ye bakış açısının temelini oluşturmakta ve re'yini nasıl gerekçelendirdiğini ortaya koymaktadır. Rebîa, bazı konularda sahâbe ve tabiinin görüşlerine muhalif bir görüş serdettiği, re'yi cesaretle kullandığı ve geçmiş âlimlerin görüşlerini kabul etmeyi zorunlu görmediği için başta Mâlik olmak üzere birçok öğrencisi onun derslerini terk etmiştir."
