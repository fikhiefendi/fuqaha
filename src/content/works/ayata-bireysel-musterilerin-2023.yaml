abstract: "Ülkemizde hizmet sektörünün en önemli kollarından bir tanesi bankacılık sektörü olup, bu grubun üyelerinden biri de katılım bankalarıdır. Bu bankaların işleyiş prensibi ve hizmet anlayışı birçok müşterinin katılım bankalarını tercih etmesinde rol oynamıştır. Bu çalışmanın amacı, bireylerin katılım bankalarını tercih etme nedenleri ile cinsiyet, yaş, medeni durum, meslek, gelir ve eğitim durumu gibi demografik faktörler arasında anlamlı bir farklılık olup olmadığını ortaya koymaktır. Araştırmanın amacı doğrultusunda, Şanlıurfa ilinde faaliyet gösteren katılım bankalarından hizmet alan 410 bireyden veri toplanmıştır. Araştırmada ihtiyaç duyulan veriler online ve yüz yüze anket yöntemi ile elde edilmiştir. Verilerin normal dağılıp dağılmadığını belirlemek amacıyla faktörlerin basıklık çarpıklık değerleri kontrol edilmiştir. Ulaşılan değer -2 ile +2 arasında yer aldığından verilerin normal dağılım gösterdiği kabul edilmiştir. Bu doğrultuda araştırmada analizler, parametrik testler (t testi ve Anova) kullanılarak yapılmıştır. Müşterilerin katılım bankalarını tercih etme nedenlerinin alt faktörlerinden olan hizmet ve ürün politikası, faizsizlik prensibi ve tanıtımı ve alternatif dağıtım ve tutundurma kanalları ile cinsiyet arasında anlamlı bir farklılık bulunmuştur. Medeni durum açısından ise alternatif dağıtım ve tutundurma kanalları ve tahsis politikası ile medeni durum arasında anlamlı bir farklılık tespit edilmiştir. Yaş ile bireylerin katılım bankalarını tercih etme nedenlerinin alt faktörlerinin tamamı arasında anlamlı bir farklılık tespit edilirken, meslek açısından ise kart politikası alt faktörü hariç diğer tüm alt faktörler ile yaş arasında anlamlı bir farklılık tespit edilmiştir. Gelir durumu açısından ise hizmet ve ürün politikası, alternatif dağıtım ve tutundurma kanalları ve tahsis politikası ile gelir arasında anlamlı bir farklılık bulunmuştur. Ve son olarak ise eğitim ile bireylerin katılım bankalarını tercih etme nedenlerinin tüm alt faktörleri arasında anlamlı bir farklılık bulunamamıştır."
