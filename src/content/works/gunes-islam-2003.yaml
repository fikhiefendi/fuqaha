abstract: "IV ÖZET DOKTORA TEZİ İSLAM KAMU HUKUKUNDA FİKİR VE İNANÇ HÜRRİYETİ Ahmet GÜNEŞ Danışman: Prof. Dr. Beşir GÖZÜBENLİ 2003-SAYFA : IX + 178 Jüri : Prof. Dr. Beşir GÖZÜBENLİ Prof. Dr. Hamza AKTAN Doç. Dr. Şamil DAĞCI Bu çalışmada, İslam hukukunda din ve vicdan özgürlüğü konusu incelenir. Öncelikle konunun temel kavramları tanıtılır. Din, bir çok sosyal bilimlerin konusu olduğu için günümüzde birinci derecede konunun ilgili olduğu alanlar tespit edilmeye çalışılır, İslami literatürdeki yerini belirleme hedeflenir ve sistematizeye önem verilir. Birinci bölüm dine girme özgürlüğünü kapsar. Bu gerekçeyle Kur'an'da inanç esaslarının fikri boyutunu ilgilendiren ayetler düşünce özgürlüğü açısından değerlendirilir. İlgili ayetlerin üslubuna, Kur'an'da davet metotlarına ve zorlama yasağına vurgu yapılır. İkinci bölümde dini inanç özgürlüğü araştırılır. Farklı dini inanç mensuplarıyla dünyevi ilişkileri, bireysel ve siyasal ilişkiler olarak iki ana gruba ayırır. Siyasal ilişkiler, hem uluslararası ilişkileri hem de ulusal ilişkileri içerir. Savaşlar birinci grubta, zimmet akdi ise ikinci grupta mütalaa edilir. Üçüncü bölümde dinden dönme ve ibadet özgürlüğü anlatılır. Klasik fıkıh literatürümüzdeki irtidatla ilgili bilgilerin siyasi, hukuki ve dini yönleri tartışılır. İbadet özgürlüğünde namazın kasten terki ve orucun açıktan yenilmesi meselelerini konu edinir ve hukuki niteliğinin belirlenmesine gayret gösterilir. Sonuçta ise ulaşılan kanaatler belirtilir."
