abstract: "Deniz Ticareti sektörü, günümüzde gemilerin ülke içinde bir limandan öteki limana çeşitli amaçlarla yaptığı yolculuktan öteye geçmiş denizlerin sağladığı güvenli, ucuz ve tek seferde taşınabilecek en çok yükü taşıyabilmesi gibi taşıma imkânlarından yararlanarak bir ülkenin kıyısından başka bir ülkenin kıyısına yük ve yolcu taşıması ticaretine dönüşmüştür. Ülkemiz ekonomisi açısından oldukça büyük öneme sahip olan deniz ticareti sektöründe birçok aktör rol almaktadır. Bu aktörlerin kullandığı ana araca gemi adı verilmiş ve gemiler vasıflarına göre ticaret gemisi, yolcu gemisi, yük gemisi, savaş gemisi gibi sınıflara ayrılmıştır. Yolcu ve yük taşımacılığında gemide taşınan yolcu ve yüklerin gemide çalışanların, güvenli bir şeklide bir limandan başka bir limana taşınması amacıyla taşıma öncesi ve taşıma sırasında taşıyan tarafa birçok görev yüklenmiştir. Bu kimselerin görev ve yükümlülüklerinin oldukça geniş alana yayılması dolayısıyla faaliyet sundukları sektörün her türlü bilgisine vakıf olmaları kendilerinden beklenemez. İşte Uluslararası konum itibariyle taşıyanın farklı ülke limanlarına gönderdiği deniz aracı ile içindeki yükün gittiği limanda görev ve sorumluluğunu üstlenen, yükün cinsini miktarını o ülkenin ilgili kurum ve kuruluşlarına bildiren, müvekkilinin adına ve hesabına işlem yapan, onun çıkarlarını gözeten gerçek ve tüzel kişilere gemi acentesi denilmektedir. Gemi acenteliği, gemi taşımacılığında gemi malikinin, gemiyi işletenin veya kiralayanın, kaptanın, adına ve hesabına yaptığı işlemler ile gerek bu kimselerin ilişki kuracağı üçüncü kişiler, gerekse de geminin gittiği limanın kurum ve kuruluşlarına karşı müvekkilinin hak ve menfaatlerini, belirli bir bölge içinde koruyan, gemiye ve yüke hizmet sunan ve bunun karşılığında asgari ücret tarifesinde belirtilen miktar dahilinde ücret alan meslek koludur. Donatan, gemiyi işleten veya yük sahipleri gemi acenteleri sayesinde kendilerinin ulaşamayacakları limanlarda menfaatlerini koruduğu hissiyle duyulan güven ortamında denizcilik sektöründe faaliyet göstermeye devam ederler. Ayrıca, hakkında yeterli sayıda kaynak olmamakla birlikte, denizcilik sektörünün temel yapı taşlarından biri olan gemi acenteliği kurumunun hukuki çerçevesi, yapısı, acentenin ücret hakkı ve sorumluluğuna yönelik olarak kanunlar ve yönetmelikler ile alt düzenleyici işlemler arasında çelişkilerin olması, mevzuatların çeşitlilik ve karmaşıklık göstermesi ile özellikle gemi acentelerinin ilişkili olduğu kurum ve kuruluşlar ile farklı alanlara dağılmış sorumluluğunun ve bu konudaki yargı kararlarının tek kaynakta toplanmasının gerekliliği hususu çalışmanın niteliği açısından önem arz etmektedir. Sonuç olarak bu çalışma ile gemi acenteliği konusuna yönelik düzenleyici işlemlerin derlenip değerlendirilerek mevzuatlar arasındaki çelişkilerin yargı kararları doğrultusunda açıklanması ve uygulamada gemi acentelerinin gemi maliki ve gemiyi işletenler ile karıştırılması ve taşıyan gibi sorumlu tutulmasından dolayı gemi acentesinin sorumluluğunun konu bazına indirgenerek bu sorumluluğun ana sınırının ortaya konulması amaçlanmaktadır."
