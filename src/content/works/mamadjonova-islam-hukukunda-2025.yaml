abstract: "Günümüzde modernizmin dayattığı islamofobi akımıyla güçlendirilmeye çalışılan İslamın kadını ikinci plana attığı iddiası gerçeklikten çok uzaktır. Sanılanın aksine kadına en çok değer veren ve onu korumayı gaye edinen din, İslam dinidir. Bu bağlamda, kadının güvenliğini sağlamak amacıyla ortaya konan hükümlerden biri de kadının“mahremsiz yolculuk yapmaması”dır. Kadının mahremsiz yolculuk yapması hususunda fakihler farklı görüşlere sahiptirler. Bu farklılığının nedeni naslardaki lafız ve mana farklılıklarıdır. Özellikle günümüzde teknolojik gelişmeler seferin ihtiyaç duyulduğu şartlar ve durumlar değişti. Bundan dolayı seferin bazı hükümlerinin düzenlenmesi ihtiyaç haline gelmiştir. Biz de bu çalışmada,öncelikle seferin sözlük ve terimsel anlamlarına değinerek sefer mesafesinin ne olduğunu mezheplerin dayandırdığı delillere göre açıkladık. Fakihlerin hepsi bir kadının mahremsiz yolculuk yapması hususunda aynı hükmü vermemişlerdir. Onların bu konuda ittifak ettiği hususlar olduğu gibi, ihtilaf ettiği hususlar da olmuştur. Biz de bu tez de fakihlerin ihtilaf etme sebeblerini araştırarak delilleriyle birlikte ortaya koymaya çalıştık. Müslüman bir erkek veya bir kadının, İslam dışı ülkelere yolculuk yapması ve Darü'l- küfr olan bu ülkelerde ikamet etmeleri hususunda hangi hükümlere tabi olacaklarını bu konudaki rivayetlere dayanarak beyan ettik. Sonrasında ise, kadınların İslam dışı ülkelere seyahat etmesi meselesinden çıkarılan genel hükümleri örneklerle açıkladık."
