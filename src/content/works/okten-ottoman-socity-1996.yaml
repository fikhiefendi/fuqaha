abstract: "t ÖZET Fetvalar tarih çalışmalarında toplum ve devlete ışık tutan kaynaklardır. Bu tezde fetvaların bu amaçla kullanılmasına çalışılmıştır. Örnek olarak Şeyhü'l-İslam İbn Kemal'in fetvalarına bakarak Osmanlı İmparatorluğunda yaşamış Rafızîlerin (Kızılbaşlar) tarihi hakkında bir fikir edinmek mümkündür. İbn Kemal günümüzde Rafızîleri bir homojen kitle olarak kabul eden düşüncenin aksine Onları sadece Osmanlılar'ın politik düşmanları olan Safavilere taraftar oldukları zaman bir tehdit unsuru olarak görmüştür. Kızılbaş İbn Kemal için mutlaka sapık inançlı kişi demek değildi. İbn Kemal'in fetvalarında Sûfiler de sıklıkla görülür. İbn Kemal Ortodox Sünni İslamla bağdaşmayan vahdet-i vücud veya devran gibi Sûfi inanış ve tatbikatlarına karşı çıkmıştır. Her iki tarafın zaman zaman siyasi otoriteyi ilgilendiren iddialar ortaya koymaları sûfilikle ilgili problemlerin oldukça köklü problemler olduğunu gösterir. İbn Kemal'in fetvalarında dinsel farklılıkların belirleyici rol oynadığı Osmanlı genel toplum yapısını da görmek mümkündür. Peygamber neslinden gelenler ve devlet görevlilerinin meşruluğu/korunmalan ile ilgili tartışmadan İbn Kemalin devletin Sünni ideolojisini ve otoritesini korumaya çalıştığı izlenimi edinilmektedir. Şeriata karşı Şeriat dışı hukuk konusunda İbn Kemal'in kanun kavramına hiç de yabancı olmadığı ileri sürülmüştür. Geleneksel bir vergi olan çift resmini Şeriat çercevesince almaya kalkması O'nun bir Şeyhü'l-İslam olarak devlet mekanizmasına hizmet ettiğini gösterir. Bu çalışmanın sonunda İbn Kemal'in yazdığı 220 civarında eserin isimleri verilmiştir."
