abstract: "Osmanlı Devleti'nde merkezde ve taşrada, her tabakadan insanlar arasındaki hukukî ilişkilere dair kayıtları içeren şer'iye sicileri, Osmanlı'da aile, toplum, ekonomi ve hukuk gibi birçok alanın tarihi için önemli kaynaklardandır. Bu sebeple,“1681-1682 Tarihlerinde Konya'da Sosyal ve Ekonomik Hayat”başlıklı bu tezin ana kaynağını, 26 numaralı Konya Şer'iye Sicili oluşturmaktadır. Bu tezde, kâdı defterindeki konular Konya'daki sosyal, siyasî, ekonomik ve hukukî hayatla bağlantıları açısından ele alınmıştır. Çalışmanın konu başlıklarından olan Sosyal yaşamla ilgili konular; Konya'da sosyal yapı ve sosyal hiyerarşi, nüfus, aile, sosyal huzursuzluk ve sosyal suçlar, eşkıyalık ve hırsızlık olarak belirlenmiştir. Ekonomik hayatla ilgili olan konularda; Konya'daki mülk satışları, kira ve vergi gibi meseleler yer almaktadır. İdarî yapı ile ilgili konularda; Osmanlı taşra idaresi ve Konya şehri, taşradaki yöneticiler ve merkez-taşra ilişkisi hususlarında çeşitli tespitlerde bulunulmuştur. Hukukî işleyişe ait konuları ise; Konya'da mahkeme ve kâdı, miras, boşanma, nafaka takdîrleri, vasî ve vekîl tayinleri, mahkeme tarafından yapılan keşifler, köle ve câriye azâdı, hastalıkların tedavisi için rıza senetleri, suçluların cezalandırılmaları gibi konular oluşturmaktadır. Bu çalışmadaki amacımız, 26 nolu Konya şer'iye sicilini esas alarak Konya şehir tarihçiliğine katkıda bulunmaktır. Bir başka deyişle amacımızı, defterde bulunan kayıtlardan hareketle yukarıdaki sayılan konuları ele alıp, defterin ait olduğu tarihler arasındaki dönemin Konya tarihine ışık tutmak diye tanımlayabiliriz."
