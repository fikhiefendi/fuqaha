abstract: "Tezimizde Kültepe tabletleri ışığında Asur Ticaret Kolonileri Çağı'nda Asurlu ve Anadolu'nun yerli halkının miras anlayışı ve uygulamaları ele alınmıştır. Bu çalışmayı hazırlarken başlıca çivi yazılı kaynaklar, mevcut kitap bölümleri ve makalelerdeki bilgiler bir araya getirilerek bir takım değerlendirmeler yapılarak dönemin insanlarının miras anlayışları aydınlatılmaya çalışılmıştır. Çalışmamızda miras uygulamasının doğmasına sebep olan özel mülkiyet kavramı, çivi yazılı belgelerde geçen miras ile ilgili başlıca terimler, Asur Ticaret Kolonileri Çağı öncesi Sumer ve Sami kanunlarının ilgili hükümlerine dayanarak bu topluluklardaki miras anlayışı ve uygulamaları, çivi yazılı belgelere dayanarak Eski Asur Dönemi miras anlayışı ve uygulamaları, bazı Asurlu tüccar ailelerinin arşivlerinde yer alan miras içerikli dosyalar, Eski Asur Dönemi ve öncesine ait miras hukuku sistemlerinin Tevrat ve İslam miras hukuku sistemleri ile mukayesesine yer verilmiştir."
