abstract: "ÖZET Çalışmada % 100 pamuk elyafi kullanılarak elde edilen Ne 20/1 iplikler kullanılmıştır. Bu ipliklerle üç farklı örgüdeki Ribana kumaşların, çekim ve sıklık farklılıkları ile kumaşlara uygulanan rahatlatma işlemlerine bağlı olarak göstermiş oldukları farklılıklar ortaya çıkarılmaya çalışılmıştır. Araştırma dört ana bölümden oluşturulmuştur. 1. Bölümde; Temel örmecilik bilgileri ve literatür özetlerini içermektedir. 2. Bölümde; Araştırmada kullanılan örgü kumaşları ürettiğimiz hammaddelerin özellikleri ve örme makinelerinin genel özellikleri bulunmaktadır. 3. Bölümde; Kullanılan örgü makinesinin özellikleri, numune kumaşlara uygulanan rahatlatma yöntemleri ve araştırmada yapılan testler ile bu testlerde kullanılan cihazların özellikleri verilmiştir. 4. Bölümde ise testler sonucunda elde edilen değerler tablolar ve grafikler halinde verilerek değerlendirme yapılmıştır. n"
