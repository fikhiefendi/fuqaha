abstract: "KOBİ'lerde (küçük ve orta ölçekli işletmeler) sürdürülebilir girişimcilik kavramı, sürdürülebilir kalkınmanın yanı sıra bir bölgede daha iyi sosyal gelişmelerin sağlanması için bugünlerde yeni bir önem kazanmıştır. KOBİ'ler, Birleşmiş Milletler Sürdürülebilir Kalkınma Hedeflerine (SKH'ler) ulaşılabilmesi için çevresel ve sosyal konuları iş modellerine dahil edebilirler. Bu çalışma, Pakistan ve Türkiye'deki gençlerin davranışları üzerine bir uygulama ile geleneksel ve İslami yaklaşımın karşılaştırmalı bir analizi yoluyla KOBİ sektöründe sürdürülebilir girişimciliği incelemektedir. Sürdürülebilir girişimcilik üzerine yapılan araştırmalar dünya çapında artmaktadır, ancak çalışmaların çoğu seküler modellere odaklanmakta, dolayısıyla İslam'ın etik ve adalet odaklı ilkelerini göz ardı etmektedir. Bu araştırma, Planlı Davranış Teorisi'ni adl (adalet), şura (katılım) ve felah (amaca yönelik refah) ile birlikte kullanarak sürdürülebilirlik odaklı girişimcilik davranışını anlamak için daha iyi bir çerçeve sağlamayı amaçlamaktadır. Araştırmada karma yöntem tasarımı kullanılmıştır. İslami finans akademisyenleri ve KOBİ paydaşlarıyla yapılan uzman mülakatları, normatif motivasyonlar ve kurumsal gerçeklikler hakkında bilgi vermek için niteliksel içgörüler üretmiştir. Bunu, Pakistan ve Türkiye'den 500'den fazla üniversite öğrencisi ve erken aşama girişimciden anket verileri toplamak için nicel bir aşama izlemiştir. Verilerin Yorumlanması. Veriler, girişimciliğe yönelik tutumların, sosyal normların, algılanan engellerin, öz yeterliliğin ve niyetin sürdürülebilir girişimcilik davranışı üzerindeki etkisini belirlemek için Kısmi En Küçük Kareler Yapısal Eşitlik Modellemesi (PLS-SEM) ile analiz edilmiştir. Sonuçlar, tüketici davranışına ilişkin ana akım düşüncede bilişsel ve çevresel faktörlerin desteklendiğini göstermiştir. Ancak İslami yaklaşımlar daha fazla ahlaki grup boyutu eklemiştir. Araştırma çalışması, girişimcilik niyetinin sürdürülebilir davranış üzerinde nasıl olumlu bir etkiye sahip olduğunu ve girişimcilik eğitimi ve kurumsal destek tarafından nasıl yönetildiğini göstermektedir. Özellikle, Türkiye'den katılımcılar Pakistan'dan katılımcılara kıyasla daha yüksek davranışsal niyetler göstermiştir. Bunun nedeni daha destekleyici bir eğitim altyapısı ve elverişli durumsal faktörlerdir. İçgörüler, her iki bağlamda da sürdürülebilir girişimciliği desteklemek için politika tasarımı, müfredat geliştirme ve ekosistem oluşturma için somut çıkarımlar öneren temel boşlukları ve fırsatları ortaya koymaktadır."
