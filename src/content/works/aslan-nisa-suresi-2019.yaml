abstract: "Bu çalışmada“Nisa Suresi 105-115. âyetlerin İslâm Hukuku Açısından Yorumu”konusu incelenmiş olup söz konusu âyetlerin sebeb-i nüzûlleriyle ilgili rivâyetlerin, müfessirler tarafından nasıl değerlendirildikleri ve bu âyetlerin yorumlarından çıkan fıkhî hükümler mercek altına alınmıştır. Ayrıca söz konusu âyetlerin, yargılama hukuku ve fıkıh usûlü ile ilişkisi de konumuzun kapsamı içerisindedir. Giriş ve sonuç ile birlikte üç bölümden meydana gelen bu çalışmanın giriş kısmında araştırmanın konusu, amacı, yöntemi ve kaynakları üzerinde durulmuştur. Birinci bölümde önce Kur'an-ı Kerim'i anlamada esbâb-ı nüzûlün önemi ele alınmış olup ilgili âyetlerin meali ve tefsiriyle birlikte iniş sebebine dair rivâyetlere yer verilmiş, sonra da Medine'nin sosyal ve dini yapısı tanıtılmıştır. İkinci bölümde söz konusu âyetlerden çıkan yargılamaya dair fıkhî genel hükümlere temas edilmiştir. Üçüncü bölümde ise ilgili âyetlerin fıkıh usûlü ile ilişkisi ele alınmıştır. Sonuçta mezkûr âyetlerin yargılama hukuku alanında normatif kurallar içeren birçok hükme esas teşkil ettiği tespit edilmiştir. Aynı şekilde fıkıh usûlü alanında da bazı delillerin temellendirilmesinde referans alındığı görülmüştür."
