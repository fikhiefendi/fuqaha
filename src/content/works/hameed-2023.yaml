abstract: "Bu çalışma, ana hatlarıyla İmam el-Cessas'ın İmam el-Kiya el-Herrasi'nin hayatları ve onların Ahkamu'l-Kur'an adlı kitaplarının tanıtımını ele almaktadır. Çünkü her iki imamın Ahkamu'l-Kur'an kitabı da ahkâm âyetlerini tefsir etme alanında birer hazine sayılmaktadır. Bu çalışma bu yazarların tefsirdeki yaklaşımlarını ve kaynaklarını açıklayarak, iki kitabın kendisiyle temeyyüz ettiği yüksek ilmi değeri bize açık hale getirmektedir. Yine bu iki âlim delil çıkarmada, hüküm istinbat etmede, ahkâmın kanunlarına riayet ederek fıkıh ve usul kurallarını açıklamada kendilerinden sonra gelen âlimlere öncülük etmişlerdir. Bu nedenle ahkâm ayetleri açısından İslam Fıkıh mirasına katkıda bulundukları fikirleri ve görüşleri çok önemlidir. Bu çalışma, seçtiğimiz bazı meseleler çerçevesinde bu iki âlimin görüşlerini ve her biri farklı bir ekolü temsil ettiğinden, kendi görüşleri aracılığıyla mezheplerinin yaklaşımlarını açıklamayı amaçlamaktadır. Ayrıca iki imamın görüşlerini birbiriyle karşılaştırdık. Yine mezheplerinin görüşlerini de mezheplerinin ana kitaplarına ve kaynaklarına başvurarak yaptık. İki imam arasında seçilen bu konulardaki ihtilafın özü üzerinde durduk. Böylece her ikisinin de bakış açıları ve muhakeme yöntemleri açığa çıkmış oldu. Neticede ise delil bakımından en güçlü, bizce en doğru ve günümüz realitesine en uygun ve en doğru görüşü gösterip ona itimat edilmesi gerektiğini açıkladık."
