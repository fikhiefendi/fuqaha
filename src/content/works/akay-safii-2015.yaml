abstract: "Dini nasları anlama ve yorumlama metodolojisi olan usûl-i fıkıh iki temel metoda dayanmaktadır. Bunlardan biri tespit edilmiş asıllardan hareketle cüz'î meselelere çözüm getiren Mütekellimîn/Şâfiîyye metodudur. Diğeri ise fer'î meselelerden yola çıkarak usûlî kaideleri ortaya koyan Fukahâ/Hanefiyye yöntemidir. Farklı metotlar arasında ihtilafların varlığı kaçınılmaz olduğu gibi aynı metod mensupları arasında tartışmaların olması da doğaldır. Bu çalışma, İmâm Şâfiî'ye atfedilen metodolojik görüşler ile Şâfiî usûlcülerin muhalif olarak ortaya koydukları yaklaşım ve delilleri tespit etmeyi amaçlamaktadır. Tezimizde \"Şer'î Deliller Bağlamında İmâm Şâfiî'ye Muhalefet Edilen Hususlar\" başlığı altında Kitab, Sünnet, icmâ, kıyas ve bunlara ilişkin tartışmalar üzerinde durulmuştur. Bu ana başlıklar altında: Beyân kavramına yüklenen anlamlar, beyânın mertebeleri, Kur'ân'da Arapça dışında kelimelerin varlığı, nesh, Hz. Peygamber'in fiilleri, haber-i vâhid, mürsel haber, icmânın dayanakları, sükûtî icmânın delil olması, kıyas/ictihâd kavramları, kıyasın hücciyyeti, birden fazla illet ile hükmün ta'lîli konular gibi öne çıkan meseleler tartışılmıştır. Çalışmamızın \"İstinbât Metotlarında İmâm Şâfiî'ye Muhalefet Edilen Temel hususlar\" başlığını taşıyan bölümde ise harflerin manaları, emir-nehiy, âmm-hâss, mefhûm gibi daha çok \"lâfız-mana-hüküm\" merkezli lisânî tartışmalar serdedilmiştir. Bu çalışmamızda, Şâfiî usûlcülerin, genelde usûlün özüne halel getirmeden konuları farklı bir formatta ele aldıkları sonucuna varılmıştır. Nesh gibi sınırlı sayıda konu hariç genelde söz konusu ihtilaflar hakiki olmaktan ziyade lâfzî düzeyde kalmıştır. Bunun yanısıra pek çok tartışmanın, müşterek bir hükmü farklı açılardan ispat etme gibi olumlu sonuçları beraberinde getirdiği de tespit edilmiştir. Anahtar Kelimeler: İmâm Şâfiî, Şâfiî usûlcüler, İhtilâf, Metodoloji/Usûl, Fıkıh."
