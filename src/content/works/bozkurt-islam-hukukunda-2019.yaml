abstract: "İslâm dîni genel itibariyle insanlar için bir takım prensipler belirlemiştir. Kimi prensiplerin uygulanması açık, kesin ve bağlayıcı hükümlerle belirtilmişken, kiminin uygulanması ise açık, kesin ve bağlayıcı bir hükümle belirtilmemiştir. Şûrâ ve istişâre prensibi de İslâm'ın Hz. Peygamber (S.a.s) nezdinde tüm Müslümanlara bir emir ve tavsiyesidir. Bu emir bizzat Hz. Peygambere (S.a.s) hitap gibi görünmüş olsa da aslen tüm müminlere bir hitap ve tavsiyedir. Çalışmamızın amacı, Allah'ın Kur'ân'da açıkça emretmiş olduğu şûrâ ve istişâre emrinin içeriğini, önemini ve kapsamını her yönüyle ortaya koymaktır. Çalışmamızda öncelikle şûrâ ve istişâre konusuyla ilgili bu zamana kadar yapılan çalışmalar incelenerek, daha önce değinilmemiş veya eksik kalan yönler tespit edilmiş ve bu eksik yönler tamamlanmaya çalışılmıştır. Yine daha önceki çalışmalarda değinilmiş olan konular da genişletilerek farklı bir bakış açısıyla İslâm Hukûku perspektifinden ele alınmıştır. Özetle, çalışmada şûrâ ve istişâre emrine muhâtap olan insanın özellikleri, yeryüzündeki konum ve görevleri, şûrâ ve istişârenin genel olarak anlam ve önemi, İslâm dînindeki yeri, İslâm Hukûkunun kaynakları olan aslî delillerdeki konumu, mezheplerin ictihadi olarak bakış açıları, devlet idaresinde şûrâ ve istişârenin durumu, uygulanma biçimleri ve herhangi bir yaptırımının olup olmadığı vb. hususlara değinilerek, konularla ilgili görüşler sunulmuş, çözüm yollarıyla ilgili öneriler ortaya konulmaya gayret gösterilmiştir."
