abstract: "Bu tez, pazarlama karmasının İslami bankaların performansı üzerindeki etkisini ele almış ve bankacılık pazarlamasının ve sunduğu hizmetlerin modern anlamda önemli bir yer haline geldiği ilkesinden hareket etmiştir. Bu, hizmet pazarlama karması ve bunun İslami bankaların performansı üzerindeki etkisinin araştırılmasını gerektiren şeydir. Bu çalışma, hizmet pazarlama karmasının unsurlarının Libya'daki İslami bankaların performansı üzerindeki etkisini açıklamak ve analiz etmek amacıyla Libya'da hizmet pazarlama karmasının yedi unsurunu (hizmet - fiyat - tanıtım - dağıtım - bireyler - işlemler - fiziksel olanaklar) inceleyen ilk çalışmadır. Araştırmacı, anketi üst ve orta düzeydeki yöneticiler, bölüm başkanları ve çalışanlardan oluşan araştırma örneklemlerinden veri toplamak için bir araç olarak kullanmış ve araştırmanın amaçlarına ulaşmak için nicel yaklaşımında betimsel yaklaşımı izlemiştir. Çalışma; Jumhouria Bankasında görevli 43 örneklem ve Nuran Bankasında görevli 23 örneklem üzerinde uygulanmıştır. Araştırmacı, çalışma değişkenleri arasındaki ilişkiye ulaşmak ve hipotezleri kanıtlamak için istatistiksel analiz programı (SPSS); kontrol değişkenini analiz etmek ve sonuçlara ulaşmak için ise istatistiksel analiz programı (PLS SEM) kullanmıştır."
