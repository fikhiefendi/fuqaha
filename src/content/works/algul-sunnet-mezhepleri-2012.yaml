abstract: "Bu çalışma Ehl-i Sünnet diye bilinen Hanefi, Maliki, Şafii ve Hanbelî Mezhepleri ile Şia'dan İmamiyye Mezhebinin Aile hukuku bağlamındaki fıkhi farklılıklarından ve dayandıkları delillerden bahsetmektedir. Söz konusu beş mezhebin fıkhi konularda ihtilaf etmelerinin temelinde şer'i delillerden hüküm istinbat ederken dayandıkları delillerin farklı olması hususu yatmaktadır. İlerde de açıklanacağı üzere her mezhep farklı bir usul vazetmiş ve bu usule göre şer'i delillerden hüküm çıkarmaya çalışmıştır. Böylece diğer konularda olduğu gibi aile hukukunda da ihtilaf meydana gelmiştir. İşte çalışmamızın amacı İmamiyye mezhebinin söz konusu dört Sünni mezhepten aile hukukunda farklı düşündükleri konuları ele almak, onların farklı düşünmelerine etki eden usul, yöntem, kaynak ve faktörleri yer yer açıklamak, böylelikle onları daha iyi tanıyıp onlar hakkında doğru ve sağlıklı analiz edebilme imkânına kavuşmaktır. Şüphesiz mezheplerin bu fıkhi konulardaki görüş ayrılıklarında müslümanlar için bir rahmet ve kolaylık vardır."
