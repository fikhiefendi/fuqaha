abstract: "Finans sektörü ülkelerin ekonomik gelişimleri için büyük öneme sahiptir. Türkiye'de mevduat, kalkınma ve yatırım bankalarından oluşan bankacılık sektörüne, son yıllarda önemli bir büyüme yakalayan katılım bankaları eklenmiştir. Faizsiz bankacılık çerçevesinde faaliyet gösteren katılım bankaları, sektöre alternatif finansal ürünler ve hizmetler sunmaktadır. Her finans kuruluşunda olduğu gibi katılım bankaları da çeşitli riskler ile karşı karşıyadır. Bu risklerin yönetilmesi, bankanın faaliyetlerinin sürdürülebilir olması için hayati önem taşımaktadır. Bu çalışmanın amacı, Türkiye'de faaliyet gösteren katılım bankalarında risk yönetiminin finansal performans üzerindeki etkilerini değerlendirmektir. Çalışma üç bölümden oluşmaktadır. Çalışmanın birinci bölümünde, öncelikle risk ve risk yönetimi kavramları incelenmiştir. Risk çeşitleri, çeşitli risk yönetim enstrümanları ve risk yönetimine ilişkin çeşitli bakış açıları değerlendirilmiştir. İkinci bölümde, katılım bankacılığı temel ilkelerine değinilmiş, faaliyet yapısı ve sektöre sunduğu alternatif finansal ürünler hakkında bilgi verilmiştir. Ayrıca, katılım bankaları ile konvansiyonel bankaların farkları incelenmiştir. Üçüncü bölümde risk yönetimi ve finansal performans arasındaki ilişki Panel Veri Analizi yöntemi ile incelenmiştir. Hedef kitle, Türkiye'de faaliyet gösteren beş katılım bankasıdır. Çalışmada kullanılan veriler, bahse konu bankaların yıllık raporlarından elde edilmiştir. Veriler çeyreklik olup, Mart 2016-Aralık 2020 dönemlerini kapsamaktadır. Risk yönetiminin en temel amacı, bankaların finansal performansını artırmaktır. Bu çalışmada, Sermaye Yeterlilik Oranı, Likidite Riski ve Kredi Riskinin, Aktif Karlılık ve Özsermaye Karlılığına etkisi araştırılmıştır. Sonuç olarak, risk yönetimi ve finansal performans arasında güçlü bir pozitifi ilişki tespit edilmiştir."
