abstract: "Kur'ân-ı Kerim'in anlaşılması, Müslümanların ferdi, ailevi ve ictimai alanlarda başta olmak üzere hayatın her alanında büyük önem arz etmektedir. Bu bağlamda Kur'ân ayetlerinin maksadına uygun bir şekilde anlaşılması Kur'ân-ı Kerîm'de ifade edilen dilin inceliklerinin öğrenilmesiyle doğrudan alakalıdır. Ayetlerden çıkacak hükümleri anlayabilmek ve doğru bir şekilde yorumlayabilmek için, nahiv ilminin kapsamına giren harf-i cerler konusuna vakıf olmak gerekmektedir. Cümleye kattığı anlam zenginliği ve çeşitliliği bakımından Arapçanın en kapsamlı konularından biri olan harf-i cerler, ilahi muradın sahih bir şekilde anlaşılmasına ve yorumlanmasına da yardımcı olmaktadır. Bu çalışmada Ebu Ca'fer et-Tahâvî'nin (ö. 321/933) Ahkâmü'l-Kur'ân adlı tefsirindeki müellifin hüküm istinbatı alanında harf-i cerlerin üstlendiği fonksiyonları ve ahkâm ayetlerine sağladıkları anlamsal katkı konusu çalışılmıştır. Çalışmada nahiv ilminde önemli bir yere sahip olan harf-i cerlerin Tahâvî'nin Ahkâmü'l-Kur'ân adlı tefsirindeki ahkâm ayetlerinin anlamlarına nasıl yansıdığı incelenerek değerlendirilmeye tabi tutulmuştur. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Birinci bölümde, Arap dilinde harf-i cerlerin tanımı, önemi, ifade ettiği manalar ve cümle terkibinde kullanımları ele alınmıştır. İkinci bölümde, Ebû Ca'fer et-Tahâvî'nin hayatı, şahsiyeti, ilmi kişiliği hakkında genel bilgiler verilmiş, Ahkâmü'l-Kur'ân isimli tefsirinde harf-i cerlerin ahkâm ayetlerinde manaya etkileri, Tahâvî'nin bu çerçevede ahkâm ayetlerine bakış açısı ve tercihleri incelenmiştir. Sonuçta ise araştırma neticesinde ortaya çıkan hususlar zikredilmiştir."
