abstract: "Bu çalışmada İslami bankalarda yürütülen finansman anlaşmalarının sağladığı şeri maksatları açıklamak hedeflenmektedir. Söz konusu anlaşmalarda herhangi bir aksaklık durumu olduğunda malın korunması prensibi ve ona bağlı yan başlıklar çerçevesinde maksatçı bakış açısıyla nasıl bir ictihad (içtihat) yürütüleceği ve aksaklıkların giderileceği konusunun aydınlatılması amaçlanmaktadır. Tezimizde İslami bankalarda yürürlükte olan finansman anlaşmalarına dair meşhur örneklere değinilmektedir. İlgili sözleşmelerin mahiyetini tanımak ve onlar hakkında sağlıklı bir tasavvur oluşturmak bağlamında satın alma emri veren kişiler için murabaha akdi, teverruk, selem akdi, istisna' akdi, mudarabe ve azalan ortaklık benzeri meseleler incelenmektedir. Mallarla alakalı olan en önemli dini kriterler saptanmakta ve finansman anlaşmalarına uygulanma biçimi araştırılmaktadır. Araştırmamızda malın korunması (hıfzu'l-mal) maksadından türetilen yan amaçlar açıklanmış, sağlıklı bir şekilde uygulanması halinde İslami bankalardaki finansman sözleşmelerinin doğuracağı sonuçlar tartışılmıştır. İslami bankaların akitlerden umulan faydaların gerçekleşebilmesi için dini ölçülere bağlı kalma noktasında özenli olması benzeri öneriler sunulmuştur."
