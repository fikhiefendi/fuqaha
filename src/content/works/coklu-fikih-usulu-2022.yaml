abstract: "Cessâs, Bâkıllânî ve Kādî Abdülcebbâr, ömürlerinin ilmî bakımdan en verimli dönemlerini hicrî 4. asırda Bağdat şehrinde geçirmişlerdir. İmam Şâfiî istisna edilirse günümüze ulaşan en eski fıkıh usûlü eserleri sözü geçen bu alimlere aittir ve her biri neredeyse fıkıh usûlü ilminin bütün konularını ayrıntılı bir şekilde içeren hacimli eserler vermişlerdir. İlaveten bu üç âlim konuları fıkıh usûlü ve kelâm ilişkisi çerçevesinde ele almalarıyla dikkat çekmektedirler. Onların sözü edilen eserlerinde ele aldıkları ve ayrıntılı bir şekilde işledikleri konulardan biri şüphesiz âm lafızlar bahsidir. Bu üç usûlcünün farklı itikadî ve fıkhî mezheplerin müntesibi bulunmaları, âm lafızlarla ilgili meseleleri oldukça hararetli bir tartışma ortamında ele almalarıyla sonuçlanmıştır. Ayrıca onlar, ilmî faaliyetlerini çeşitli etnik grupların ve farklı mezheplerin beraberce yaşadığı bir coğrafyada sürdüren âlimler olarak sadece kendi görüşlerini temellendirmekle kalmamışlar, buna ilaveten herkes tarafından kabul edilebilecek bir din anlayışı oluşturma çabasına girişmişlerdir. İşte bu çalışmada, sözü edilen bakış açısıyla Cessâs, Bâkıllânî ve Kādî Abdülcebbâr'ın âm lafızlarla ilgili görüşleri mukayese edilmektedir. Onların umûm konusundaki görüşlerinin tespit edilmesinden başka bu görüşlerin arka planda taşıdıkları itikadî temellere yer verilerek açıklanması bu çalışmayı benzerlerinden ayıran en önemli yöndür. Çalışmada ilk olarak Cessâs, Bâkıllânî ve Kādî Abdülcebbâr'dan her birinin delalet anlayışlarını üzerine bina ettikleri itikadî konulara yer verilmiş, bu kapsamda hüsün-kubuh meselesi, halku'l-Kur'ân-kelâm-ı nefsî tartışması ve dillerin kökeni meselesi incelenmiştir. Daha sonra umûm ifade eden lafzın tanımı, mahiyeti ve tahsisiyle ilgili konular işlenmiş, en sonunda da tartışmanın devamı niteliğindeki konulardan teâruz, umûm-mecâz ilişkisi ve umûm-mücmel ilişkisi konuları ele alınmıştır."
