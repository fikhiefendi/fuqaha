abstract: "İnsanların haklarını koruyup adaleti tevzi edecek olan“Adli Yargı Birimi”bir devletin en önemli kurumlarından biri sayılır. Bu sebeple asr-ı saadetten itibaren İslam devletlerinde her zaman adaletin sağlam bir şekilde yürütülebilmesi için her türlü tedbir alınmıştır. Bunlardan birisi mahkeme kayıtlarının düzenli bir şekilde tutulmasıdır. Osmanlı Devleti zamanında kayda geçirilen şer'iyye sicilleri muhafaza edilmiş ve çoğu günümüze ulaşmıştır. Söz konusu siciller, İslam tarihi, ve özellikle de Fıkıh tarihi açısından büyük önem arz etmektedir. Ayrıca bu belgeler, Fıkıh ilminin teorisinin pratikteki uygulamasını da gösteren birinci el kaynaklardır. Bu siciller arasında, İstanbul Şer'iyye Sicillerinden sonra sayı ve içerik bakımından Bursa Şer'iyye Sicilleri ikinci sırayı almaktadır. Çalıştığımız Bursa Şer'iyye Sicili, Milli Kütüphane'de C-147 numara ile kaydedilmiş olup h. 1313-1315 yıllarında Bursa'da“Şer'i Mahkeme'ye”intikal eden dava, ilâm, hüccet, ferman ve beratları içermektedir. Söz konusu sicil, imkân nispetinde hatasız bir şekilde okunmuş ve latinize işlemi yapılmıştır. Bu esnada konu taraması yapılarak konular tasnif edilmiştir. İlgili dönemin kanun kitabı olan Mecelle ve en çok başvurulan Hanefi fıkıh kaynaklarına dayanılarak kayıtlar tahlil edilmiştir."
