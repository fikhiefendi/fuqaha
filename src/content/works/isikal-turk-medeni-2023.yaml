abstract: "Ülkemizde genellikle hukuki ve ekonomik riskleri daha az olduğu için, arsa malikleri ile yatırımcılar üst hakkı sözleşmesi yerine arazi alım satım sözleşmesi yapmayı veya aynı gerekçelerle kat karşılığı inşaat sözleşmesi veya hasılat paylaşımı sözleşmesi yapmayı tercih etmektedirler. Bundan dolayı da özel hukuk kişileri arasında uygulamada üst hakkına nadiren rastlanmaktadır. Genellikle taşınmaz maliki olarak bir tarafın kamu idaresi, diğer tarafın da özel hukuk kişisi yatırımcı hallerde taraflar arasında üst hakkı sözleşmeleri yapıldığına tanık olunmaktadır. Biz bu çalışmamızda temelde üst hakkını ele alacağız. Ancak özellikle üst hakkı sözleşmelerinin bir tarafının kamu idaresi olması halinde taraflar arasındaki ilişkinin hususiyet arz eden yönlerini de inceleyeceğiz. Kamu Hukuku mevzuatında düzenlenen üst hakkı hükümleri ile Türk Medeni Kanunu'nda düzenlenen üst hakkı hükümleri arasında çelişen durumlar mevcuttur. Kamu hukuku mevzuatında, üst hakkı ile ilgili olarak, Türk Medeni Kanunu'na uygun şekilde bir genel hukuki düzenleneme yapılması uygun olur. Bu hususta bizim tavsiyemiz; üst hakkına ilişkin düzenlemeleri içeren tüm kamu mevzuatına, yüklü taşınmaz malikinin ve üst hakkı sahibinin Türk Medeni Kanunu'nda belirtilen haklara sahip olduğu şeklinde açıklayıcı ek bir madde eklenmesidir."
