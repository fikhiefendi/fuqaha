abstract: "İnsan sosyal bir varlıktır. Bu yüzden içinde yaşadığı toplum tarafından kabul edilen kurallara uymak zorundadır. Bu kurallar bazen din, bazen yasa, bazen de örf-adet kaynaklı olabilir. İslam dini ve getirdiği ahlaki umdeler, insana, toplumda nasıl yaşayacağını açıklamıştır. Bu çalışmada farklı boyutlarıyla İslam dini, İslam Hukuku açısından şiddet ve terör olguları, bu olgular bağlamında çatışma ve diyalog kültürleri ile insan hakları araştırılmıştır. Çalışmamızda konuyla ilgili Kur'an ayetlerine, hadislere yer verilmiş ve bu konuda yazılmış diğer kitaplardan da yararlanılmıştır. Çalışmalarımızın neticesinde görülmüştür ki; şiddet insanın fıtratında vardır. İslam, getirdiği hukuki ve ahlaki umdelerle insan fıtratındaki bu şiddet eğilimini asgariye indirgeyerek, dünyadaki tüm insanların barış, adalet, emniyet, müsamaha ve diyalog kültürü içinde, bir arada nasıl yaşayabileceğini ortaya koymaktadır. Hukuki açıdan can, din, akıl, nesil ve malın korunması için, önleyici tedbirler alınmış, cezai müeyyideler getirilmiş, gerektiğinde ve başka çare kalmadığında savaşa da izin verilmiştir. Şiddetin en acımasız ve gayrı ahlaki boyutu ise terördür. Menfaatler çatışması terörün, terör ise kaos ortamının kaynağıdır. Şiddet, terör ve kaos çatışma kültürünün ürünüdür. Çatışma kültüründe ise hedefe ulaşmak için her şey mübahtır. İslam dini, terörü kesinlikle reddeder ve lanetler. İslam hem bireysel hem de toplumsal hayatta emniyet ve istikrar vaad edip, kaos ve çatışmayı meneder. Daha huzurlu bir gelecek için öncelikle terörün genel kabul görebilecek bir tanımının yapılması, akabinde tüm gerçek ve tüzel kişiler ile oluşumların samimi bir şekilde teröre karşı ulusal ve uluslararası düzeyde işbirliği yapması gerekmektedir. İslam'a göre tüm insanlar eşit olup, üstünlüğün ölçüsü Allah'a yakınlıktadır."
