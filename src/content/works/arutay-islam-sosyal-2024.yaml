abstract: "Bu çalışma, İslam'da önemli bir yere sahip olan sosyal yardımlaşma anlayışını, karz-ı hasen modeli özelinde ele alarak bu modelin toplumsal ve ekonomik etkilerini ortaya koymayı amaçlamaktadır. Tezin odak noktası, faizsiz borç verme uygulaması olarak tanımlanabilecek karz-ı hasenin yerel düzeyde hangi şekillerde uygulandığı ve sosyal dayanışma mekanizmalarına nasıl katkı sunduğu sorularına cevap aramaktır. Bu çerçevede, Türkiye'nin doğusunda yer alan Bingöl ili, söz konusu modelin güncel ve geleneksel biçimleriyle hâlen yaşatıldığı sahici bir örnek alan olarak seçilmiştir. Çalışmada nitel araştırma yöntemi benimsenmiş, veri toplama aracı olarak yarı yapılandırılmış mülakatlardan yararlanılmıştır. Farklı sosyoekonomik düzeylerden katılımcılarla gerçekleştirilen görüşmeler aracılığıyla, yerel halkın karz-ı hasen algısı, uygulama biçimleri, karşılaştığı zorluklar ve bu uygulamanın bireylerin ekonomik hayatına etkileri analiz edilmiştir. Elde edilen veriler tematik analiz yoluyla incelenmiş, katılımcı ifadeleri doğrultusunda anlamlı temalar ve kodlar oluşturulmuştur. Araştırmanın sonucunda, karz-ı hasenin sadece bir borç verme aracı değil, aynı zamanda dayanışma, güven ve karşılıklı sorumluluk temelli bir toplumsal ilişki biçimi olduğu görülmüştür. Ayrıca, bu uygulamaların sosyal dışlanmayı azaltıcı, ekonomik kırılganlıkları hafifletici ve toplumsal birlikteliği güçlendirici etkileri olduğu bulgulanmıştır. Bu yönüyle tez, İslam ekonomisinin ahlaki temelli yaklaşımlarının modern toplumlar için hâlâ geçerli ve işlevsel olduğunu ortaya koymakta; özellikle sosyal adaletin güçlendirilmesi ve ekonomik eşitsizliklerin azaltılması bağlamında karz-ı hasen modelinin yeniden değerlendirilmesi gerektiğini önermektedir."
