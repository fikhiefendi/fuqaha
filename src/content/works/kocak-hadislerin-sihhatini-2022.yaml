abstract: "Hadîslerin sıhhatini belirlemenin ictihâdî oluşunu konu alan tezimizle, rivâyetlerin sıhhatinin tespitinde ictihâdın rolü ortaya konulmaya çalışılmış, bu bağlamda; muhaddislerce ve fakîhlerce hadîsleri değerlendirmede etkin rol oynayan kriterlerin ictihâdî olduğuna, ictihâdın âlimlerin hadîslere farklı hüküm vermelerindeki etkisine değinilmiştir. Bu bilgilerden hareketle de aynı rivâyetin, sahîh, hasen, zayıf ve mevzû gibi birbirinden farklı hükümlere konu olmasındaki sebebin ne olduğunun anlaşılması hedeflenmiştir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Girişte araştırmanın konusu, amacı, kaynakları ve yöntemi hakkında bilgilendirmede bulunulmuş, Tezin Birinci Bölüm'ünde konu ile ilintili bazı kavramlara ve bunlara ilişkin açıklamalara yer verilmiştir. Çalışmanın İkinci Bölüm'ünde, tarihî süreçte ictihâd kapısının açık olup olmadığı tartışmaları bağlamında İbnü's Salâh'ın görüşüne temas edilmiş, ayrıca âlimlerin onun görüşüne yaklaşımları kronolojik olarak özetlenmiştir. Bununla birlikte hadîslerin sıhhatini tespitte özellikle hadisçilere göre etkin rol oynayan hadîs usûlü ve cerh-ta'dil ilminin teşekkülünde ictihâdın etkisi ele alınmıştır. Araştırmanın Üçüncü Bölüm'ünde ise hadisçilere ve fıkıhçılara göre sahîh hadîsin şartlarına ve fıkıhçıların zayıf hadîsleri sahîh olarak kabul etmelerine yol açan bazı alternatif metotlara yer verilmiş, ayrıca bu bölümde aynı ilmî disipline mensup âlimlerce rivâyetlerin farklı hükümlere konu olmasına örneklerle temas edilmiştir. Tüm bu verilerden hareketle de hadîslerin sıhhatini tespitte ictihâdın rolü ortaya konulmaya çalışılmıştır. Çalışmamızda son olarak ulaştığımız bazı tespitlere yer verilmiştir."
