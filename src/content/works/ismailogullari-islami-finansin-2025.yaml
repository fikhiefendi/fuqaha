abstract: "Araştırma, İslami finansın KOBİ'lerin gelişimi üzerindeki etkisini, Bingöl İli örneği üzerinden spesifik olarak incelemektedir. Küçük ve orta büyüklükteki işletmeler, (KOBİ) ekonomik büyüme ve istihdam açısından önemli bir role sahip olmakla birlikte, finansmana erişimde çeşitli sorunlarla karşılaşmaktadır. Bu bağlamda faizsiz finans ilkelerine dayanan İslami finans, KOBİ'ler için beklentileri karşılayabilecek bir finansman modeli olarak ön plana çıkmaktadır. Araştırma İslami Finansın KOBİ'lerin gelişimi üzerindeki etkisini ortaya koymayı amaçlamıştır. Araştırma verileri, Bingöl ilinde faaliyet gösteren 271 KOBİ'den kolayda örneklem yöntemi ile anket aracılığı ile elde edilmiştir. Elde edilen veriler istatistiksel yöntemler kullanılarak analiz edilmiş ve sonuçlar tablolar halinde sunulmuştur. Anket kapsamında KOBİ'lerin İslami finansa yönelik farkındalık düzeyleri, kullanım oranları, tercih nedenleri ve karşılaştıkları sorunlar değerlendirilmiştir. Araştırmada elde edilen verilere göre, KOBİ'lerin büyük bir kısmının İslami finans kavramına yabancı olmadığı, ancak bu farkındalığın faaliyete yeterince yansımadığı tespit edilmiştir. Katılımcılar, İslami finansı konvansiyonel bankacılıktan ayıran en önemli unsurun faizsiz finans olduğunu belirtmişlerdir. Anket sonuçlarında İslami finansın KOBİ'lerin büyümesine ve finansal sürdürülebilirliğine katkı sağlayabileceği yönünde genel bir kanaat oluştuğu görülmüştür. Ayrıca bilgi eksikliği, tanıtım yetersizliği ve katılım bankalarına erişim sorunları, İslami finansın yaygınlaşmasının önündeki temel engeller olarak tespit edilmiştir. Sonuç olarak bu araştırma, İslami finansın KOBİ'ler açısından önemli bir potansiyele sahip olduğunu ortaya koymakta; ancak bu potansiyelin yeterince kullanılmadığını göstermektedir."
