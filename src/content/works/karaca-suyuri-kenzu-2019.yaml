abstract: "Bu araştırmada es-Suyûrî'nin Kenzü'l-İrfân fî Fıkhi'l-Kur'ân adlı tefsiri kıraatler bağlamında ele alınmıştır. Bu kıraatler sadece tesbit edilmekle kalmayıp bunların Kur'ân'ı anlamaya ne gibi bir etkisi olduğu incelenmiştir. Üzerinde çalışmış olduğum tezi farklı kılan bir özellik ise eserin Şiî bir müfessir tarafından yazılan bir tefsir olmasıdır. İşte bizim buradaki amacımız Ehli sünnet müfessirlerinin tefsirinden ziyâde, Şiâ tefsirini ve Şii müfessirlerin Kur'ân'ı tefsir ederken nasıl bir yol takip ettiklerini, özellikle ahkâm tefsirlerinde ahkâm ayetlerini kıraatler çerçevesinde nasıl değerlendirdiklerini gün yüzüne çıkarmak ve kıraatin Kur'ân'ın anlamına ne gibi bir etkisi olduğunu incelemektir. Çalışma iki bölümden oluşmaktadır. Birinci bölümde öncelikle Suyûrî'nin hayatına, eserlerine ve öğrencilerine değinilmiştir. Yine bu bölümde Suyûrî'nin üzerinde çalışmış olduğumuz Kenzü'l-İrfân fî Fıkhi'l-Kurân adlı eserinin gerek içeriği gerekse kullandığı metot, kaynaklar vb. gibi konular genişçe ele alınmıştır. İkinci bölümde ise bu kıraatler eserdeki bulundukları bölümler alt başlığında bir bir açıklanmış ve bu kıraatlerin Kur'ân'ın anlamına ne gibi bir etkisi olduğu incelenmeye çalışılmıştır. Çalışma sonuç ve kaynakça ile bitirilmiştir."
