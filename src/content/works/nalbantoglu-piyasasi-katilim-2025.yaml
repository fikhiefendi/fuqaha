abstract: "Küresel ekonominin gün geçtikçe daha da karmaşık bir yapıya bürünmesiyle birlikte finansal sistemde de benzer bir gelişme yaşanmaktadır. Üretim ihtiyaçlarının karşılanması ve ekonomik paydaşların sistemde etkin bir rol üstlenebilmesi için güçlü bir finansal sisteme duyulan ihtiyacı daha da belirgin bir hale getirmektedir. Geleneksel finans modeli, risk paylaşımı açısından barındırdığı riskler barındırması ve faiz temelli çalışma modeline sahip olmasından ötürü ekonomik kriz dönemlerinde hem makroekenomik açıdan hem de firmalar açısından riski bertaraf etme konusunda, bilhassa derinliği ciddi boyutlara varan finansal buhranlarda, barındırdığı finansal enstrümanların nitelikleri ve risk paylaşımı göz önüne alındığında, yeterli olamamıştır. İslami finansın kâr zarar paylaşımı ve faiz yasağı ilkeleri ve risk transferi konusunda geleneksel yönteme nazaran daha yapıcı ilkeler barındırması İslami finansa olan ilgiyi artırmıştır. Şer'i hükümler kullanılarak belirlenen katılım endeksleri, makroekonomik gösterge olmaları nedeniyle büyük bir öneme sahiptir. Bu çalışmada otoregresif varyans modeli kullanılarak Türkiye ve Endonezya'da yer alan katılım endekslerinin performansları incelenmiş ve ülkemizde yer alan katılım endekslerinin Endonezya'ya kıyasla krizlere karşı daha dirençli olduğu tespit edilmiştir."
