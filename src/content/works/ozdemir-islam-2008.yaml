abstract: "İslam hukukunun bir cüzü olan İslam devletler hukuku, nazariyede aynıkaynaklara dayanmıs ve bir çok ayet ve hadis ile desteklenmistir.Tez giris kısmı dısında üç bölümden olusmaktadır. Birinci bölümdeuluslararası iliskilerde temel prensipler açıklanmıs daha sonra devletlerarasıiliskiler ve tarihî süreç ele alınmıstır. Fıkıh mezhepleri, Müslümanlarlagayrimüslimler arasındaki iliskide asıl olanın düsmanlık hali oldugunu iddiaetmistir.İkinci bölümde İslâm'ın uluslararası kamu düzenine etkilerini tespitedebilmek için cihadın manası, cihad çesitleri, savası mesru kılan sebepler, savasahazırlık, savas ilanı mevzuları açıklanmıstır.Üçüncü bölümde savasta yapılması yasak ve mubah olan davranıslar,zimmîlerin statüsü ve eman (güvenlik vaadi) kavramı izah edilmistir. Daha sonraise savasın gayesi ve savası sona erdiren durumlar açıklanmıstır.Anahtar Kelimeler: Cihad, devletler hukuku, eman, esir, ganimet, savas, sulhanlasması, uluslararası kamu düzeni, zimmî."
