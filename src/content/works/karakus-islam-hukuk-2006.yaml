abstract: "KAHRAMANMARAŞ SÜTÇÜ İMAM ÜNİVERSİTESİSOSYAL BİLİMLER ENSTİTÜSÜTEMEL İSLAM BİLİMLERİ ANABİLİM DALIÖZETYÜKSEK LİSANS TEZİİSLAM HUKUK KAYNAKLARINDAKİ FAİZKAVRAMININ MODERN EKONOMİBAĞLAMINDA YENİDEN EĞERLENDİRİLMESİAbdil KARAKUŞDanışman: Yrd. Doç. Dr. İzzet SARGINYıl :2006, Sayfa: 82Jüri : Yrd. Doç. Dr. İzzet SARGIN: Yrd. Doç. Dr. Nuri KAHVECİ: Yrd. Doç. Dr. Halil APAYDINBu çalışmada, İslam hukuku kaynaklarındaki faiz kavramına modern ekonomibağlamında yeniden bir bakış amaçlanmıştır.Faiz kavramı üzerinde, İslam hukuku kaynaklarından Kur'an, sünnet vemezhepler çerçevesinde durulmuştur. Modern ekonomiler konusunda da liberalist vekapitalist düşüncedeki faiz anlayışları verilmeye çalışılmıştır. Verilen bu bilgilerdoğrultusunda yapılan değerlendirmelerle çalışma tamamlanmıştır.Çalışma süresince Temel İslam kaynakları, Müslüman bilginlerin konuyla ilgiliyapmış oldukları çalışmalar, dinler tarihi ve iktisat bilimi kaynaklarındanyararlanılmıştır."
