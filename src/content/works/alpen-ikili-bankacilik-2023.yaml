abstract: "İktisadi büyüme kavramı toplumun yaşam koşullarının artması açısından oldukça önemli iken literatüre Sanayi Devrimi sonrasında girmiştir. Bu dönemden sonra iktisadi büyüme üzerine yapılmış birçok akademik çalışma söz konusu olmuştur. Günümüzdeki en yaygın hali ile İslami ve ticari bankaların aynı ekonomik yapı içerisinde faaliyet göstermesi olarak açıklanabilecek ikili bankacılık sistemi kavramı da literatürde yer edinmiştir. Bu çalışmada ikili bankacılık sisteminin uygulandığı ekonomilerde, bu sistem ile iktisadi büyüme arasındaki ilişkinin ampirik olarak analiz edilmesi amaçlanmaktadır. Analizde ikili bankacılık sistemindeki kanallar üzerinden ekonomi içerisindeki belirli sektörlere sağlanan finansmanların iktisadi büyüme üzerindeki etkisi incelenmektedir. Belirli kıstaslar neticesinde çalışmaya dahil edilecek ülkeler Türkiye ve Malezya olarak seçilmiştir. Analize dahil edilecek sektörler ise tarım, madencilik, imalat, turizm ve inşaat olarak belirlenmiştir. İkili bankacılık sistemini İslami ve ticari bankalar tarafından ilgili sektörlere sağlanan finansman verileri temsil ederken, iktisadi büyümeyi temsilen Gayri Safi Yurtiçi Hasıla verileri kullanılmıştır. 2005:1 ile 2019:4 arasındaki çeyrek dönemlik veriler Türkiye için BDDK ve TÜİK veri tabanları kullanılarak derlenirken, Malezya için Bank Negara Malaysia (Merkez Bankası) veri tabanı kullanılarak temin edilmiştir. Ekonometrik analiz aşamasında kullanılacak en uygun model panel ARDL olarak belirlenmiş, İslami ve ticari olmak üzere iki ayrı model kullanılmıştır. Panel ARDL modeli öncesinde homojenliğin analiz edilmesi adına Pesaran ve Yamagata testi uygulanmış ve her iki modelde de kullanılan katsayıların heterojen olduğu sonucuna ulaşılmıştır. Birim kök analizi neticesinde her iki modelde kullanılan değişkenlerin düzeyde durağan oldukları sonucu elde edilmiştir. Eş bütünleşme testi olarak Durbin-Hausman testi uygulanmıştır, her iki modelde de ele alınan değişkenler arasında uzun vadeli bir ilişki olduğu ifade edilebilmektedir. Panel ARDL analizi neticesinde elde edilen unsurlar ülkeler için ayrı ayrı değerlendirildiğinde şu sonuçlara ulaşılmıştır. Türkiye'de iktisadi büyümeye en büyük katkıyı İslami bankalar tarafından turizm sektörüne kullandırılan fonlar sağlarken, en düşük katkı ise iktisadi büyümeye olumsuz yönde etki eden ve İslami bankalar tarafından inşaat sektörüne kullandırılan fonlar tarafından sağlanmıştır. Türkiye ekonomisi için genel değerlendirme yapıldığında İslami bankacılık kanalı ile sağlanan fonların görece daha iyi bir sonuç ortaya koyduğu ifade edilebilir. Malezya ekonomisi özelinde iktisadi büyümeye en büyük katkı ticari bankalar tarafından inşaat sektörüne kullandırılan fonlar üzerinden sağlanırken, en düşük katkı ise iktisadi büyüme olumsuz yönde etki eden ve ticari bankalar tarafından tarım sektörüne kullandırılan fonlar üzerinden sağlanmıştır. Malezya ekonomisi için genel değerlendirme yapıldığında ticari bankacılık kanalı ile sağlanan fonların görece daha iyi bir sonuç ortaya koyduğu ifade edilebilir."
