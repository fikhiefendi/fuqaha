abstract: "Modern çağda savaşlardan kaçınmak neredeyse imkânsız hale gelmiştir. Kullanılan stratejilerin ve yüksek tahrip gücüne sahip silahların altında en temel insan haklarını korumak ve sürdürmek, kabiliyetlerimizi aşarak insanlığı zor durumda bırakmıştır. Bunun üzerine uluslararası toplum bir araya gelerek savaşlar ve onların nasıl yapılması gerektiği üzerine çeşitli anlaşmalar ve düzenlemeler ortaya koymuşlardır. Böylece Uluslararası insancıl hukuk, savaş zamanlarında savaşçıların ve sivil şahısların en temel hak ve özgürlüklerini koruyan bir hukuk dalı olarak öne çıkmaya başlamıştır. Uluslararası insancıl hukuka hayat veren temel ilkelerin ışığında, koruma sistemi geliştirilmiş ve imzalanan antlaşmalarla birlikte güvence altına alınmıştır. Dünya üzerindeki her bir medeniyet, kendi kültürel kodları çerçevesinde bu alana önemli katkılar sunmuştur. Bu katkıların en önemlilerinden birisi İslam Dini tarafından sağlanmıştır. İslam'ın bu konudaki pozisyonu uluslararası insancıl hukukun gelişimi açısından önem taşımaktadır. İslam dini, savaş ve çatışmalar esnasında insanlığa ve en temel hak ve özgürlüklere saygı duyarak sivilleri, savaşta aktif yer almamış kişileri ve artık savaşmayanları korumaktadır. Bu değerlerin korunmasında şeriatın en temel hedefleri doğrultusunda büyük özen gösterir. İnsancıl hukuka benzer şekilde, İslam savaş hukuku da savaşta sivillere verilen zararın en aza indirilmesini hedefler. Savaşlarda kadın, çocuk, yaşlı ve artık savaşmayan kişilerin korunmasını üstün tutar. İslam zorunlu olmadıkça savaş çıkartan taraf olmamak ister çünkü İslam hukukçularının çoğunluğuna göre savaşı meşru kılan şey, İslam'a yönelik bir saldırının varlığıdır. Ayrıca İslam, savaş türlerini ve bu türlerin her birisinin hukuki durumlarını ve sonuçlarını da detaylıca inceler. Ortaya koyduğu kurallar ve düzenlemeler, kendi çağının oldukça ötesindedir. Gerek korunan kişilere, gerek de savaş esirlerine sağladığı insaniyet ve diğer ilkeler ışığındaki korumalar, bazı noktalarda uluslararası insancıl hukukun da üzerindedir."
