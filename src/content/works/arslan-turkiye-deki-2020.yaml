abstract: "Temel görevi, ekonomik birimler arasında fon akışlarına aracılık etmek olan bankalar, topladıkları fonları kredi mekanizmasıyla üretim ve istihdam alanlarına aktararak ekonomik büyümeye katkı sağlamaktadır. Türkiye'de 1985 yılında Özel Finans Kurumları ile başlayan, 2005 yılından itibaren de“Katılım Bankaları”tarafından gerçekleştirilen faizsiz bankacılık faaliyetleri, geleneksel, kalkınma ve yatırım bankalarının yanı sıra ayrı bir tür olarak Türk Bankacılık Sektörü'nde faaliyet göstermektedir. Katılım bankalarının Türk bankacılık sektörü içindeki performansını inceleyen bu çalışma, katılım bankalarının finansal gelişmeye ve ekonomiye katkılarını ortaya koymayı amaçlamaktadır. Bu amaç doğrultusunda katılım bankalarının faaliyet yöntemleri ve esasları araştırılarak, ekonomik gelişmeye sağladıkları katkılar bakımından değerlendirilmiştir. Bu çalışma ile katılım bankacılığı sektörünün gelişmesi için gerekli düzenlemelere dikkat çekilmiştir. Araştırma konusu için yapılan analiz sürecinde, katılım bankalarının 2010-2018 dönemine ait temel finansal rasyo ve göstergeleri kullanılarak geleneksel bankalarla karşılaştırma yapılmıştır. Çalışmada, katılım bankaları kullandığı yöntemler ve esas aldığı prensipler itibarıyla teoride tamamen farklı görülmektedir. Katılım bankaları, uygulamaları ile geleneksel bankaların faizle ilgili olmayan hemen her bankacılık hizmetini verebilmeleriyle geleneksel bankalara benzer özellikler gösteren ve geleneksel bankaları tamamlayan kurumlar olarak ifade edilmektedir. Katılım bankaları, faiz hassasiyeti olan müşterilerin ihtiyaçlarına cevap vermesiyle ise, geleneksel bankacılık hizmetlerine alternatif kurumlar olarak görülmektedir. Katılım bankaları, 2010-2018 döneminde başarılı bir performans göstermesine rağmen, Türk bankacılık sektörü içinde ve ekonomideki tamamlayıcı etkilerini yerine getirmede küçük bir paya sahiptir. Katılım bankalarının başlıca katkıları Türkiye'de faize duyarlı kesimlerin atıl fonlarını finansal sisteme kazandırarak ekonomik gelişmeyi pozitif yönde etkilemesi ve kullandığı faizsiz bankacılık yöntemleriyle finansal sistemde derinlik ve hizmet çeşitliliğini artırmasıdır. Türkiye ekonomisine ilave fon yaratma ve bu fonun kullanımına sürdürülebilir katkı sağlama açısından katılım bankaları, önemli bir potansiyele sahiptir."
