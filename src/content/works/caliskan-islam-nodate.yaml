abstract: "Bu çalışma İslam hukukunda kolaylaştırma ilkesinin zarurat-ı hamse ile ilişkisini konu edinmektedir. Dolayısıyla çalışmanın amacı da kolaylaştırma ilkesinin zarurat-ı hamse açısından önemini ortaya koymaktır. Bu da insan yaşamının zorluklarını gidermek, kolaylaştırıcı ilkeler sunarak insanlık için yaşanabilir bir hayatı temin etmekle mümkündür. İnsanı ilgilendiren maslahat ve mefsedetin değerlendirilmesi, İslam hukukunun prensipleriyle uyumlu olmalıdır. Bu sorumluluk Kur'an ve Sünneti iyi özümsemiş, İslam hukukunun amaçlarını anlamış hukukçulara düşmektedir. İslam hukukunda kolaylaştırma ilkesinin zarurat-ı hamse ile ilişkisi nedir? sorusu tezin temel problemini oluşturmaktadır. Çünkü insanın tabiatı, kolaylaştırma ilkesinin zorluk ve sıkıntıya tercih edilmesini gerektirmektedir. İnsan tabiatının önemsenmemesinden dolayı kolaylaştırma ilkesinden uzaklaşılmış, maslahat- mefsedet dengesi bozulmuş ve insan hayatı zorlaştırılmıştır. Kolaylaştırma ilkesinin İslam hukukundaki yerini ve İslam hukukunda insanın ve onun fıtratının dikkate alındığını göstermesi açısından bu çalışma önemlidir. Dökümantasyon yönteminin izlendiği bu tezde şu sonuca ulaşılmıştır: İslâm hukuku aşırılıktan uzak, dengeli bir kolaylaştırmayı tercih etmiştir. İslam hukuku din, can, akıl, nesil ve mal gibi değerleri kolaylaştırma ilkesi ile korumayı güvence altına almıştır."
