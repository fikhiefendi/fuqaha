abstract: "Hukuk sistemi olarak İslam hukukunu uygulayan Osmanlı devletinin en önemli yargı organı şer'i mahkemelerdir. Ayrıca kasabaların beledi işleri, noterlik görevleri, hükümetin herhangi bir mahalli konu hakkında göndermiş olduğu fermanların tatbiki bu mahkemelerde kadılar tarafından uygulanmaktaydı. Araştırma konusu olan 1292 H/ 1875 M Tarihli Sivas 50 numaralı şer'iyye sicili bunlardan biridir. İncelenen defter Sivas ve kazalarının Sosyo-iktisadi ve idari yapısını gösteren örneklerden müteşekkildir. Söz konusu defterde tereke kayıtları, miras ve mülk paylaşımı, evlenme, boşanma, nikâh akdi, vakıflara dair bilgiler, muhtelif kurumlara görevli tayini, borç, kız kaçırma ve katil davaları vb. konulara ait hükümler yer almaktadır. Bu vesikalardaki bilgiler ışığında şehir tarihi araştırmalarında şehrin idari, hukuki, iktisadi ve içtimai alanlara dair birçok konu incelenebilmektedir."
