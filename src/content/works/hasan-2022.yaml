abstract: "Bu tez، fakih ve muhaddis İmam Zeynüddîn Kasım bin Kutluboğa el- Hanefi'nin şerhu'n-Nikâye kitabının“kısme”،“hibe”،“icâre”ve“âriye”bâblarının bulunduğu bölümünün tahkikini içermektedir. İbn Kutluboğa، İmam Ubeydullah bin Mes'ud el-Mahbûbî el-Hanefî'nin (ö.h.747) en-Nikâye adlı kitabını şerh etmiştir. Bu şerh önemini şerh edilen kitaptan almaktadır. Çünkü en-Nikâye، fıkıh ilminde en muteber kabul edilen kaynaklardan biri olan ve İmam el-Mergînânî'nin ed- Dirâyesi'nin şerhlerinden biridir. ibn Kutluboğa'nın kitabı، ayrıca، el-Mahbûbî'nin kitabında bulunmadığı gibi ibn Kutluboğa'dan önce kimsenin de bahsetmediği bazı önemli metinlerin ve ayrıntılı meselelerin tafsilatlı açıklamalarını da kapsamaktadır. Çalışmada، iki imam el-Mahbûbî ve ibn Kutluboğa'nın şahsi ve ilmi hayatı zikredilirken betimleyici analitik metodu; tahkik kısmında ise metnin harekelenmesi، nüshaların karşılaştırılması، metinde geçen bazı ifadelerin sahibine nispetinin belirlenmesi، metinde geçen meselelerin nerede geçtiğinin belirlenmesi ve onların dipnotlarla belirtilmesinin yapıldığı inceleme ve yorumlama metodu takip edilmiştir. Bu çalışmanın ulaştığı en önemli tespitler şu şekilde ifade edilebilir: Bu şerh yukarıda zikredilen bablarla alakalı olan meselelerle ilgili، hanefi ulema ve diğer mezhep imamlarının tercih edilen görüşlerini içermektedir. Bu şerh; ibn Kutluboğa'dan önceki el-Hidâye ve el-Vikâye şarihlerinin de problemli gördükleri ve çözemedikleri meselelerin burhan yoluyla açıklanarak çözümlendirildiği önemli şerhlerden biridir.İbn Kutluboğa، şerhinin genelinde asıl kaynaktan nakil yaparken، anlam bakımından müellife sadık kalmış ancak lafız bakımından kendi ifadelerini kullanmıştır. Müçtehit imamlardan sayılan ibn Kutluboğa; şerhinde sadece nakil yapmamış aksine delil ve hüccete göre tercihte bulunuştur. Yapmış olduğu bu tercihlerde diğer mezhep imamlarına uygun olan veya muhalefet eden önemli görüşler bulunmaktadır."
