abstract: "ÖZET Vakıfların daha ilk çağlardan beri değişik şekil ve adlar altında insanların dini duygularının bir yansıması olarak ortaya çıktığı kabul edilmektedir. Ancak bizim anladığımız manada hayır ve sevap kazanmak amacıyla yapılan vakıflar İslamiyetle gündeme gelmiş ve tüm dünyaya yayılmıştır. Devletin kamu hizmetlerini karşılamada yetersiz kaldığı günümüzde eğitim ve sağlık hizmetleri devlete yük getiren organların başında gelmektedir. Son yıllarda yapılmaya çalışılan özelleştirme ile devletin küçültülmesi amaçlanmaktadır. Zira devlet ülkenin en ücra köyüne, hatta mezrasına varıncaya kadar küçüklü büyüklü eğitim ve sağlık konuşunu taşımak zorundadır. Bu ise büyük bir maliyet ve organizasyon gerektirir. Oysa Osmanlı toplumunda diğer sosyal hizmetleri yanında eğitim ve sağlık hizmetleride vakıflar tarafından yapılıyor ve böylece devlet büyük bir mali yükten kurtulmuş oluyordu. Öte yandan Osmanlı döneminde piyasanın finans ihtiyacını karşılamak amacıyla çok sayıda para vakti kurulduğunu biliyoruz. Çalışmamızda vakıf paraların günümüz ekonomik şartlarında bir finansal araç olarak kullanılabileceği, en azından Risk sermayesi sektörüne kaynak aktarabileceği konusunda bir sonuca varmış bulunuyoruz. Bunun en ideal şekli, dünyada en çok kabul görmüş özel sektör yatırım araçlarından olan Risk sermayesi (Venture Capital), İslam dünyasında aynı işlevi gören İslam bankaları (Türkiye'de Özel Finans Kurumlan) ile İslam bankası bünyesinde kurulması düşünülen para vaktinin koordineli bir şekilde çalışmasıdır. Bunu şu şekilde özetlemek mümkündür: İslam bankası bünyesinde kurulan bir vakıf, elinde bulunan nakidlerle bir portföy oluşturarak çeşitli Risk sermayesi şirketlerinin hisse senetlerini satın alır. Risk sermayesi şirketleri, elde ettikleri uzun vadeli finansman ile desteklenmesi gereken yüksek teknolojiye sahip girişimci şirketlerin hissi senetlerini satın alır. Girişimci şirketlerin büyümesine paralel olarak Risksermayesi şirketlerinin elinde bulunan hisse senetlerinin değende artacaktır. Risk sermayesi şirketleri ellerinde bulunan bu senetleri borsada yüksek fiyattan satacaklar ve büyük miktarda kâr elde edeceklerdir. Vakfin elinde bulunan ve Risk sermayesi şirketlerine ait olan senetlerde değerleneceği için vakıfda büyük miktarda kâr'a kavuşacaktır. Öte yandan vakıf, istediği zaman elindeki Risk sermayesi şirketine ait senetleri satarak başkalarını satın alabilir. Bu işbirliği ile hem vakıflar, hem İslam bankaları ve hem de Risk sermaye şirketleri kazançlı çıkacaklardır. Ana hedef ise yüksek faiz ve yüksek enflasyon vb nedenlerle zayıflamış olan özel sektör yatırımlarını, Para vakıfları-Risk sermayesi ilişkisi çerçevesinde artırmaktır."
