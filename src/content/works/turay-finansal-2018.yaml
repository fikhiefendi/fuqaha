abstract: "Bu tezin amacı, İslam borçlar hukukunu finansal açıdan incelemek suretiyle, ideal anlamda İslâmî finans teorisini, finansman ve yatırım yöntemleri düzeyinde tespit etmektir. Bu amaçla çalışmamızda mukayeseli bir yöntem izlenmiştir. Öncelikle giriş kısmında kavramsal bir çerçeve sunulmuş, ardından birinci bölümde modern finans sistemi ve günümüzde kullanılan finansman yöntemleri; temel özellikleri ve fıkhî boyutları bakımından incelenmiştir. İkinci bölümde, İslâmî finansın temelini teşkil eden İslam borçlar hukukunun genel hükümleri ve üçüncü bölümde İslam sözleşmeler hukukunda finansal boyutu bulunan akitler incelenmiştir. Tezimizde ulaştığımız sonuçlara göre, modern finans ve ideal anlamda İslâmî finans arasında köklü farklılıklar bulunmaktadır. Buna göre ideal anlamda bir İslâmî finans sisteminde; fon arz ve talebinde bulunan taraflar, finansal kurumlar ve finansal araçlar gibi temel unsurların bulunması mümkün olmakla birlikte; modern finansın sacayaklarını teşkil eden faiz veya spekülatif işlemlere yer yoktur. Ayrıca ideal İslâmî finans yöntemleri, reel ticaret/üretim ve risk paylaşımı esasına dayandığı için modern finansta olduğu üzere reel sektörden kopuk bir İslâmî finans sistemi tasavvur edilemez. Bu bağlamda günümüz İslâmî finans kurumlarının bütün iyi niyetli çabalarına rağmen, fıkhî meşruiyet açısından önemli problemlerinin bulunduğu ve ideal uygulamalara nispetle ciddi sapmalarının mevcut olduğu anlaşılmaktadır."
