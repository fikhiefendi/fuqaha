abstract: "Bu çalışmanın amacı Türkiye'de Katılım Bireysel Emeklilik sistemi çerçevesinde faaliyet gösteren Katılım Emeklilik Yatırım Fonlarının getiri performanslarını farklı performans ölçüm tekniklerinden yararlanarak ölçmek ve karşılaştırmalı analizlerini yapmaktır. Ölçüm için Türkiye'de faaliyet gösteren faizsiz emeklilik yatırım fonları içinden, toplam portföy değeri en yüksek 15 fon seçilmiştir. Çalışma 2016-2018 yıllarını kapsamaktadır. Seçilen fonların, 2016-2018 yıllarına ait günlük fiyat hareketlerinden aylık ortalama getirileri hesaplanmıştır. Seçilen fonlara ait aylık ortalama getiriler, faklı performans ölçüm teknikleri kullanılarak analiz edilmiştir. Bu çalışmada performans ölçüm teknikleri olarak Jensen (Alfa) Ölçütü, Beta Oranı, Sharpe Ölçütü ve Sortino Ölçütü kullanılmıştır. Fonların getiri performansları genel olarak değerlendirildiğinde: Jensen ölçütüne göre 2016 yılında sade üç fon piyasa karşısında pozitif bir getiri performansı gösterirken, 2017 ve 2018 yıllarında bu fon sayısı ikiye düşmektedir. Beta ölçütüne göre ise fonların tamamı pozitif bir getiri performansı sergilerken, Sharpe ölçütüne göre bu fon sayısı dört adet olarak gözlenmiştir. Son olarak Sortino performans ölçütüne bakacak olursak, 2016 yılında dört adet fon piyasanın üzerinde bir getiri performansı gösterirken, 2017 yılında bu sayı ikiye düşmüş, fakat 2018 yılında dörde adete yükselmiştir. 2016-2018 yıllarını kapsayan analiz sonucunda Jensen, Sharpe, Sortino ölçütüne göre çoğu fon piyasanın altında bir performans göstermiştir."
