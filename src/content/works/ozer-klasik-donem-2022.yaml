abstract: "Bu çalışma, İslam Devletler hukuku alanına ait klasik dönemde telif edilmiş olan müstakil eserlerin incelenmesi ve tanıtılması konusunu ele almaktadır. İslam devletler hukuku hakkında genel bilgilendirme yapmak ve söz konusu eserlerin muhtevası ve önemi hakkında bilgi vermek çalışmanın genel amacını oluşturmaktadır. Çalışma iki bölümden oluşmakta olup birinci bölümde İslam devletler hukuku alanı hakkında genel bilgilendirme yapılmıştır. Bu ilmi alanın oluşum sürecinden itibaren tarihsel seyri, alanın temel ilke ve unsurları, genel hukuk tarihindeki yeri ve modern dönemdeki gelişmeler bu bölümde izah edilmeye çalışılmıştır. İkinci bölümde, çalışmanın temelini oluşturan modern öncesi dönemde İslam devletler hukuku alanı üzerine kaleme alınmış eserler incelenmektedir. Eserlerin her birinin ayrı ayrı ele alındığı bu bölümde, eserlerin muhtevaları ve müellifleri hakkında bilgiler yer almaktadır. Ayrıca eserler hakkında değerlendirmeler yapılmış, aralarındaki benzerlik ve farklılıklara da değinilmeye çalışılmıştır."
