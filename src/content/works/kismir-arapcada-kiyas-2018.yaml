abstract: "Bu araştırma Arap dilinde kıyası incelemiş ve Basra ve Kûfe dil ekollerindeki rolünü tespit etmeyi amaçlamıştır. Çalışma giriş ve sonuç kısımları hariç iki bölümden oluşmaktadır. Giriş kısmında araştırmanın amacı, kapsamı, yöntemi ve kaynakları üzerinde durulmuştur. Birinci bölümde kıyas kavramının tanımı, rükünleri ve çeşitleri ele alınmıştır. İkinci bölümde ise kıyasın Basra ve Kûfe dil ekollerindeki rolü farklı nahiv konuları üzerinden tespit edilmeye çalışılmıştır. Bu çalışmayla Basra ve Kûfeli nahivcilerin dil çalışmalarında kıyası etkin bir şekilde kullandıkları görülmüştür. Ayrıca bu araştırmayla kıyasın gerek aynı ekol içerisinde gerekse iki ekol arasındaki nahiv tartışmalarının yaşanmasında ve farklı görüşlerin ortaya çıkmasında önemli bir etkiye sahip olduğu da tespit edilmiştir."
