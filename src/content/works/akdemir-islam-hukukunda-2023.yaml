abstract: "Fıkıhta satım, kira gibi akitlerde tarafları olası zararlardan korumayı hedefleyen bir dizi hükümler bulunmaktadır. Akid konusunun somut bir varlık olarak akid esnasında bulunmamasını ifade eden maʻdûmun satım yasağı, tarafları akid sonucunda uğrayacakları muhtemel zararlardan korumayı hedefleyen hükümler arasında zikredilebilir. Bu çalışmada da maʻdûm ile ilgili temel kavramlara, maʻdûm kavramının terimleşme sürecine, fıkıh literatüründe maʻdûmun satımının yasak görülmesine rağmen illeti ve kapsamı hakkında farklı görüşlere, dayandırıldığı naslara ve bu yasağın günümüz emtia vadeli sözleşmeleri açısından incelenmesine yer verilmiştir. Giriş kısmında tezin çerçevesinin belirlemesi amacıyla araştırmanın konusuna, amacına, sınırlandırılmasına ve araştırmada yararlanılan kaynakların değerlendirilmesine dair bilgiler kaydedilmiştir. Birinci bölümde maʻdûm terimi ile yakından ilgili olduğu düşünülen temel kavramlar ele alınmıştır. Ardından ikinci bölümde maʻdûmun terimleşme süreci kronolojik olarak incelenmiştir. Ayrıca maʻdûm kapsamı, çeşitleri ve illetine yer verilmiştir. Bu bölümde son olarak maʻdûmun satım yasağı hususunda fıkıh mezheplerinin yaklaşımı ve atıf yaptıkları naslara temas edilmiştir. Üçüncü bölümde konunun klasik literatürde işlenişi üzerinde durulmuştur. Çalışmanın dördüncü bölümü ise, maʻdûmun satım yasağının emtia vadeli işlemler özelinde değerlendirilmesine ayrılmıştır. Bu bölümde emtia vadeli sözleşmelerin tanımı, ortaya çıkışı ve tarihi seyri, organize piyasalarda uygulama yöntemlerinden olan fizikî teslimle sonuçlanan işlemlerin fıkhî değerlendirmesinin yanı sıra işlem sonunda fizikî teslimle sonuçlanmayan uygulamanın fıkhî değerlendirmesine yer verilmiştir. Çalışmamız, vardığımız neticeler ve önerilerimizi içeren bir sonuç bölümüyle son bulmuştur."
