abstract: "Hizmet ve mallara ucuz ve hızlı şekilde ulaşmak, sanayi devrimi sonrası toplumun en temel hedeflerinden birisi haline gelmiştir. Küreselleşme, ulaşım olanaklarının artması ve iletişim kanallarının gelişmesiyle birlikte yerel bazdaki işletmeler denizaşırı ticarete başlamışlardır. Müşteri memnuniyeti olgusuna önem verme hususu da bu denkleme eklenince tedarik zinciri sistemi kurmak zorunlu hale gelmiştir. Dolayısıyla tedarikçiden nihai müşteriye kadarki malzeme, bilgi ve finansal akışın hepsini ifade eden tedarik zincirinin, başarılı bir şekilde işleyebilmesi için sürecin etkin biçimde finanse edilmesi gerekmektedir. Özellikle 2008 krizi sonrası klasik“faktoring, forfaiting,”gibi yöntemlerin bu amacı gerçekleştirme noktasında yetersiz kaldığı gözlemlenmiş, finansal yapıları zayıf olan KOBİ'ler için yeni yöntem arayışları gündeme gelmiştir. Bu arayışlar neticesinde ilk etapta Türkiye'de konvansiyonel finans kurumları bünyesinde, 2020 yılından itibaren ise faizsiz finans sistemi kapsamında tedarik zinciri finansmanı veya diğer adıyla tedarikçi finansmanı yöntemi uygulanmaya başlamıştır. Yeni bir finansal enstrüman olması sebebiyle bu çalışma literatürdeki eksikliği doldurmak amacıyla katılım bankaları tarafından uygulanan tedarikçi finansmanı yöntemini İslam hukuku açısından analiz etmeyi amaçlamaktadır. Bu bağlamda katılım bankaların halka açık dokümanlarından ulaşılan verilerden hareketle işlem adımları, tarafların hak ve sorumlulukları, kurulan ilişkilerin hukuki niteliği ve fıkhi hükmü hakkında değerlendirmelerde bulunulmuştur. Son olarak tedarikçi finansmanı alacağın satışı çerçevesinde incelenmiş ve murâbaha işlemine olan benzerliği ortaya koyulmuştur."
