abstract: "İslam Fıkhı'nda özel bir öneme sahip olan zekât konusu, ana hatlarıyla, saime hayvanların,meyve ve ziraat ürünlerinin, ticari malların ve madenlerin zekâtı ile fitre ve zekâtın kimlere farzolduğu konularını içermektedir.ki Muhtasar'ın mukayesesini yaptığımız bu çalışmamızda, öncelikle, tezimize konu olanMuhtasar'ların müellifleri olan Ahmed b. Muhammed Et-Tahavi ile smail b. Yahya El-Müzeni'nin yaşadıkları dönemlerin siyasi, sosyal, iktisadi ve ilmi yapılarını, müelliflerinhayatlarını, ilmi şahsiyetlerini ve fakihler arasındaki konumlarını ele aldık.Her iki Muhtasar'la ilgili ön bilgi sağlaması amacıyla, Tahavi'nin Muhtasar'ının en önemlikaynağı olan ve `Zahiru'r Rivaye' diye bilinen eserleri ve bu eserlerin müellifi mamMuhammed'in hayatı ile Müzeni'nin Muhtasar'ının kaynağı olan `El-Ümm' adlı eseri ve bueserin müellifi mam Şafii'nin hayatını inceledik.Muhtasar'ların zekât bölümleri, muhteva ve bab başlıkları altında işlenen meseleler ile bumeselelerin işleniş şekilleri açısından incelenmiştir.slam Fıkhı eserlerinin zekât bölümünde işlenen konular, genel olarak, mukayesesini yaptığımızMüzeni ve Tahavi'nin Muhtasar'larında da işlenmiştir. Her iki Muhtasar'ın zekât bölümü, anahatlarıyla, saime hayvanların, meyve ve ziraat ürünlerinin, ticari malların ve madenlerin zekâtıile fitre ve zekâtın kimlere farz olduğu konularını içermektedir.Muhtasar'ların, zekât bölümleri dikkate alınarak, temel özellikleri, müelliflerin konuları işleyişşekilleri, mezhep imamlarının görüşlerine yer vermeleri, kendi görüşlerine yer vermeleri vehadis naklindeki metotları karşılaştırmalı olarak sunulmuştur."
