abstract: "İslami Bankacılık, öz sermaye veya gelecekteki firma kazançlarının bir kısmı üzerindeki haklar karşılığında para şeklinde veya değerlerini geri ödeme taahhüdü karşılığında sunulan ürün ve hizmetler şeklinde finansmanın sağlandığı bir sistemdir. sonraki tarih. İslami finans, geleneksel finanstan farklı olarak beş temel sütuna dayanmaktadır: faiz yasağı, garar yasağı, kumar yasağı, kar ve zarar paylaşımı ve tüm finansal işlemlerin fiziksel varlıklara dayanması gerekliliği. Çalışmanın amacı, Somali İslami bankacılık sektörünün karşılaştığı zorlukları ve fırsatları analiz etmektir. Çalışma ayrıca, İslami bankacılığın ülke içinde yayılmasını engelleyen bir dizi ana konuya ve çeşitli potansiyel çözümlere odaklanmayı amaçlamaktadır. Birincil veriler çalışmada gerçekleştirilen anket ile toplanmış ve Stata programı ile analiz edilmiştir. Çalışmamızın hedef kitlesi, Somali'deki İslami bankaların sorunlarının ve fırsatlarının nedenleri ve çeşitleri hakkında geniş bir anlayış ortaya koymak için Somali'deki İslam Bankası çalışanlarından oluşmaktadır. Ayrıca araştırma makaleleri, ders kitapları, web siteleri ve yayınlanmamış tezler, çalışma ile ilgili ek bilgiler elde etmek için kullanılmıştır. Anket bulgularına göre, Somali'nin İslami bankalarının henüz tam potansiyellerine ulaşmadığı ortaya çıkmıştır. Çalışanlar tarafından dile getirilen sorunlar arasında, fetvalar ve diğer gerekli yasalar gibi tüm bankacılık konularını ele alan uyumlu bir SSB'nin olmaması, teknolojiye daha hâkim profesyonel çalışanların eksikliği ve diğer proje yönetimi yer almıştır. Diğer önemli sorunlar ise toplumda farkındalık eksikliği, düzenleyici sorunlar, yüksek finansman maliyeti, İslami sigorta eksikliği, düşük getiri oranı, Ar-Ge eksikliği, mobil şirketlerin rekabeti, piyasa bilgisi eksikliği ve küresel bankalarla bağlantı eksikliğidir. Son olarak, çalışanlar tarafından ifade edilen en önemli risk çeşitleri kredi riski, likidite riski, getiri oranı riski, teminat riski ve kur riski olmuştur. Buna karşılık, bulgular İslami bankacılığın Somali'de önemli bir fırsata sahip olduğuna işaret etmektedir çünkü Somali toplumunun İslami bankacılığı kabulü geleneksel bankalardan daha yüksektir."
