abstract: "Katılım finans kurumları, gerek sektörel açıdan gerekse mevzuat açısından gelişmeye devam etmektedir. Bunun sonucu olarak hali hazırda mevcut olan sorumluluklarına ilaveten özellikle mevzuat açısından yükümlülüklerin de eklendiği görülmektedir. Söz konusu düzenlemelerle katılım finans kurumlarında yürütülen faaliyetlerin fıkhî açıdan denetlenmesi zorunlu hale gelmiştir. Bu durum, ilgili kurumlarda fıkhî denetim faaliyetinin nasıl yapılacağı sorusunu gündeme getirmiştir. Fıkhî denetim mekanizmasının oluşturulması, onun doğru bir şekilde işlediği anlamına gelmeyeceği için bu mekanizmada tatmin edici ve doğru sonuçlar ortaya koyan güvenilir bir sistemin inşa edilmesi elzemdir. Çalışmada ele alınacak ana konu, fıkhî denetimin mahiyeti, katılım finans kurumlarında gerçekleştirilen işlemlerin bağlı olduğu akitlerin fıkhî denetime nasıl konu olacağı ve fıkhî denetim faaliyetinden elde edilen çıktıların İslam hukuku perspektifinden nasıl değerlendirileceği ve sınıflandırılacağını ortaya koymaktır. Bu kapsamda, çalışmanın birinci bölümünde denetim kavramı üzerinde durularak teorik zemin bakımından denetim türleri ele alınmıştır. İkinci bölümde, fıkhî denetim kavramı, amaçları, kaynakları, özellikleri ve yaklaşımı üzerinde durulmuştur. Çalışmanın üçüncü bölümünde, katılım finans kurumlarının gerçekleştirdiği işlemlerin bağlı olduğu akitlerin, sahip olduğu şartları göz önünde bulundurularak fıkhî denetim faaliyetinde incelenmesi gereken hususlar belirlenmeye çalışılmıştır. Çalışmanın son bölümünde ise fıkhî denetim faaliyetinden tespit edilen hususların nasıl değerlendirilip sınıflandırılacağına dair bir model önerisi sunulmuştur."
