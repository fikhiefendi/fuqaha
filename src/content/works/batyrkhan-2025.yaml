abstract: "Tez, Muhtasaru'l-Menâr metni üzerine Şihâb el-Müneynî'nin şerhini, Bâbü Vucûhi'l-Beyân'dan Şer'î Delillerden İkincisi (Sünnet)'in sonuna kadar olan kısmı tahkik etmeyi hedeflemektedir. Çalışma, risâleye; metin yazarı (mâtn), şârih, metin ve şerhin değeri ile metin üzerine yapılan akademik çalışmalar hakkında bir incelemeyle başlamakta, ayrıca Allâme Kāsım'ın şerhi ile Şihâb el-Müneynî'nin şerhi arasında mukayeseli bir analiz sunmaktadır."
