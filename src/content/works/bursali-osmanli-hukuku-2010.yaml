abstract: "1791-1795/1206-1210 yılları arasında Galata ve İstanbul Mahkemeleri'ne ait mahkeme kayıtlarına dayanan çalışmada, Osmanlı Hukuku'nun önemli bir veçhesi olan kefalet sözleşmesinin mala kefalet türü incelenmiştir. İslam Hukuku eserlerinde yer alan kefalet bahislerindeki teorik hukuki açıklamaların ışığında hukukun teorisi ve uygulaması arasındaki ilişki ele alınmıştır. İslam Hukuku eserlerinin yanında dönemin muteber fetva mecmualarında mala kefalet sözleşmesi konusunda verilen fetvalar da dikkate alınmıştır.Yapılan çalışma sonucunda, hukuki metinlerle uygulama kaynakları arasındaki ilişkinin zıtlıktan ziyade bir ahengi bünyesinde barındırdığı gözlenmiştir. Kişiler arasındaki hukuksal ilişkilere ?her zaman bu çerçevenin gereklerine uygun davranılmasa da? bir teorik çerçeve içinde yaklaşılabileceği görülmüştür. Böyle durumlarda kişiler arasındaki uyuşmazlıkların mahkeme önüne geldiği ve bir teorik çerçeveye atıfla problemin çözülmeye çalışıldığı anlaşılmaktadır. Ancak çerçeve ile uygulama arasında mutlak bir örtüşmenin bulunduğu da söylenemez. İslam Hukuku eserlerinin kefalet bahislerinde kendisine yer verilen, fakat inceleme konusu yapılan yıllara ait mala kefalet sözleşmesini içerdiği tespit edilen mahkeme kayıtlarında rastlanmayan bazı hususların bulunması, örtüşmeyi engelleyen durumlardır. Bu nedenle bir ahengin varlığından söz edilebilir."
