abstract: "Bu çalışma, işgal altındaki Filistin topraklarında İslami bir bakış açısıyla sürdürülebilir kalkınmanın sağlanmasında sivil toplum kuruluşlarının rolünü göstermeyi amaçlamaktadır. Ayrıca Filistin'deki sivil toplum kuruluşlarının, ekonomik güçlenme ve sosyal kalkınmayı sağlamak için sunduğu çeşitli faaliyetler ve programlarla kalkınmada oynadığı rolü vurgulamayı amaçlamaktadır. Çalışma, Filistin'deki sivil toplum kurumlarının mahiyetini ifade etmekle beraber sömürgeci işgale uğramış bir toplumda İslami bir bakış açısıyla“Sürdürülebilir Kalkınma”kavramını açıklamayı da hedeflemiştir. Tüm bunlara ek olarak işgal altındaki Filistin topraklarında sürdürülebilir kalkınmanın sağlanmasında sivil toplum kuruluşlarının karşılaştığı zorlukları da tespit etmektedir. Çalışma konuyla ilgili bilgileri incelerken tümevarımcı ve tarihsel yöntemi takip etmiş, bunun yanı sıra İslam ve Batı anlayışında kalkınma ve sivil toplum kavramını incelerken de analitik yöntemi kullanmıştır. Çalışma, Filistin'deki sivil toplum kuruluşlarının uluslararası bağış ve yardımlara bağlı olması sebebiyle sürdürülebilir finansman eksikliğinden muzdarip olduğu sonucuna ulaşmıştır. Çalışma, sivil toplum kurumlarına canlılığın geri kazandırılmasında etkin katkısı hasebiyle Filistin'deki bağış sisteminin ıslahı üzerine çalışmayı, bu kurumların devamlı olarak kendilerini yenilemelerini, hükümet kontrolünden ve dışa bağımlılıktan kurtulmalarını tavsiye etmiştir. Sürdürülebilir kalkınmayı Makasıdu'ş-Şeria'ya, maddi etkisi olan kalkınma projelerine dayanmaya ve bu alanda gerek İslam ülkelerinde gerek başka yerlerdeki deneyimlerden yararlanmakla ilişkilendirmiştir."
