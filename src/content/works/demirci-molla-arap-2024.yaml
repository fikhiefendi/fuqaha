abstract: "Molla Arap, 16. yüzyıla ilmi kişiliği ve vaazlarıyla damga vurmuş, üç Osmanlı padişahı, bir Memlük sultanı olmak üzere dört devlet adamının sevgisini kazanmış, bu sultanlara kitaplar sunmuştur. Bu çalışmada Molla Arap'ın hayatı, vefatı, ilmi kişiliği, topluma katkıları ve özellikle hadis kitaplarından yola çıkarak hadisçiliği tespite çalışılmıştır. Çalışmada müellifin Erbaîn, Tehzîbu'ş-şemâil, el-Mekâsıd fi fazli'l-mesâcid ve özellikle es-Sedâd fi fazli'l-cihâd adlı eserleri dikkate alınmış ve bu eserler çerçevesinde görüşleri ve rivayet metodu tespit edilmeye çalışılmıştır. Yaptığımız çalışma iki bölümden oluşmaktadır. İlk bölümde; Molla Arap'ın hayatı, eserleri, vefatı, hocaları ve talebeleri; ikinci bölümde; hadisçiliği, eserlerinde hadis terimlerini ve rivayetlerini isnad ve metin açısından kullanımı, diğer âlimlerin görüşlerini aktarması ve eserlerindeki hadislerin rivayet ilmi açısından değerlendirilmesi olmak üzere örnekler üzerinden değerlendirmeler yapılmıştır."
