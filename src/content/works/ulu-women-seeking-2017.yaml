abstract: "Bu tez, 1930'lar ve 1970'ler arasında Libya'nın Ecdebiyye ve Kufra şehirlerinin Şeriat Mahkeme kayıtlarını temel kaynak olarak kullanarak İslam Hukuku'na göre boşanma pratiklerinin bu dönem içerisinde nasıl gerçekleştiğine odaklanacaktır. Aharon Layish tarafından çevrilen ve yayına hazırlanan kaynaklar içerisinden özellikle kadınların boşanma talepleriyle açılan davalar seçilmiştir. İslam Hukuku'na göre boşanmanın yapısı ve çeşitleri hakkında bilgi verildikten sonra terk edilme, aile içi şiddet, mehir anlaşmazlıkları ve nafaka gibi nedenlarden dolayı açılan bazı davalar, konular içerisinde örnek vaka olarak incelenecektir. Bütün bu örnek olaylar incelendikten sonra, onları İslam Hukuku ve toplumsal cinsiyet bağlamındaki genel tartışmanın içerisine nasıl oturtacağımıza değinilecektir. Kadınların mahkemlerde ne tür enstrümanlar ne tür yöntemler kullandığına bakılacak, yalnızca Maliki mezhebine göre değil diğer mezheplerden de benzer ve farklı noktalar sunularak karşılaştırmalı bir bakış açısı ile konu işlenmeye çalışılacaktır. Genel olarak yirminci yüzyılda Libya'da Müslüman kadınların hukuki aktörler olarak toplumda var olup olmadıkları sorusu etrafında şekillenen tez, incelenen dokümanların verdiği somut örnekler sayesinde cevap bulacaktır. Kadınların mahkemelerde müddei sıfatıyla verdikleri mücadelenin sınırlarının yalnızca İslam Hukuku çerçevesinde çizilmediği Libya'da bu dönemde çok güçlü olan ve zaman zaman şeriat hukukuyla iç içe geçen geleneksel hukukun da bu konuda etkili olduğunu söylemek gerekir. Libya'nın kendine özgü hukuk sistemi içerisinde Müslüman kadınların verdiği mücadele, onları birer hukuki aktör olarak değerlendirmemize imkan verecektir."
