abstract: "Bankacılık sektörü ekonominin ayrılmaz bir kısmı olmakla, uzun zamandır sürdürdüğü geleneksel faaliyetine, dünya genelinde 1972, Türkiye genelinde ise 1985 yılında faaliyete başlayan faizsiz bankacılıkla farklı bir ivme kazandırdı. İslami bankacılık olarak da tanımlanan bu bankacılık Türkiye'de 2005 yılından sonra katılım bankacılığı olarak tanımlanmaya başladı. Özellikle İslami ülkeler açısından büyük önem arz eden bu bankacılık türü atıl fonların ekonomiye kazandırılmasında önemli etki yaratmaktadır. Gerek faaliyet alanlarını genişletmekle, gerek de hizmet ve ürün çeşitliliğini arttırmakla sektördeki %5 civarında seyir eden payını arttırmayı hedefleyen katılım bankacılığı Türkiye'de 2019 yılı itibariyle toplam 6 katılım bankasıyla faaliyetini sürdürmektedir. Çalışmanın temel amacı olarak, Anadolu Üniversitesi Öğretim Elemanlarının katılım bankacılığına bakış açısı ele alınarak, bu bankacılığı türünü kullananlar ve kullanmayanların kullanım ve kullanmama sebepleri belirlenmeye çalışılmıştır. Yapılan bu çalışmanın ilk kısmında geleneksel bankacılık, ikinci kısmında katılım bankacılığı hakkında bilgilendirmenin ardından üçüncü, uygulama kısmında anket yöntemiyle bakış açısı değerlendirilmiştir. Anadolu Üniversitesi Öğretim Elemanlarına yönelik anket çalışmasının sonunda 202 katılımcıdan elde edilen sonuçlarla farklı bakış açılarının olduğu, bunun değişik sebeplerden kaynaklandığı görülmüştür. Katılım bankacılığı kullanım düzeyinin düşük olmasında ki en önemli neden katılım bankacılığının çalışma şekli konusunda yeterli bilgilendirilme ve tanıtımın olmadığı belirtilmiştir."
