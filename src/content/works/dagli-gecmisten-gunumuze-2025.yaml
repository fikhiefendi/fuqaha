abstract: "İslam hukukunun gerçekleştirmek istediği temel gayeler (makâsıdü'ş-şerîa), zarûriyyât, hâciyyât ve tahsîniyyât şeklinde üçe ayrılmış, bu gayelerin en önemlisi olan zarûriyyâtın can, mal, nesil, din ve akıl emniyetinden oluştuğu ve bu beş esasın sadece İslam hukukunda değil diğer millet ve şeriatlarda da korunduğu hususu XI. yüzyıldan bu yana İslam hukukçuları tarafından kabul edilmiştir. Bu esasların diğer toplumlarda da korunduğu ile ilgili önermenin dayanağı bir araştırma değil, bu esasların korunmadığı bir toplumun hayatiyetini sürdüremeyeceği düşüncesidir. Çalışmamız, bu beş esasın gerçekten diğer hukuk sistemlerinde korunup korunmadığını ortaya çıkarmayı hedeflemiştir. Bunun için günümüz hukuk sistemleri olan Sosyalist hukuk, Kıta Avrupası hukuku ve Anglosakson hukuk ile beraber hukuk tarihçilerinin incelemeye değer buldukları kadim dönemlerdeki Mezopotamya, Hitit, Mısır, Çin, Hint, İbrani, İran, Kilise, Roma ve Türk-Moğol hukukları ele alınıp incelenmiştir. Araştırmanın sonunda can ve mal emniyetinin kimi eksikliklere rağmen tüm dünya hukuk sistemlerinde korunmaya çalışıldığı görülmüştür. Ancak bireyi devlete karşı koruyacak mekanizmaların yetersizliği sebebiyle can emniyeti ve faiz serbestisi sebebiyle de mal emniyeti sıklıkla ihlal edilmiştir. Nesil emniyeti konusunda tarihi hukuk sistemlerinde önemli düzenlemeler bulunurken günümüz hukuk sistemlerinde nesil emniyetini sağlayacak tedbirlerin yetersiz kaldığı sonucuna ulaşılmıştır. Korunacak din ile kast edilenin İslam dini olduğu ihtimali esas alınırsa hiçbir hukuk sisteminde din emniyetinin var olduğu söylenemez. Ancak farklı bir yorumla din emniyetinden kast edilenin din ve vicdan hürriyeti olduğu kabul edilirse, tarihi hukuk sistemlerinde kısmen, günümüzde ise daha yoğun bir şekilde bu hürriyetin korunmaya çalışıldığı görülmüştür. İçki yasağı çerçevesinde anlaşılan akıl emniyeti de aynı şekilde hiçbir hukuk sisteminde mevcut değildir. Zarûriyyâtların ihlali halinde hayatın çekilemez derecede zorluklarla karşılaşacağı kabulü ile İslam hukuku dışında hiçbir hukuk sisteminde içki yasağının bulunmadığı sonucu bir arada değerlendirildiğinde akıl emniyetinin zarûriyyât seviyesinden hâciyyât seviyesine düşürülmesi ihtimali; değerlendirilmeye açık görünmektedir."
