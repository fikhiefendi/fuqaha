abstract: "Zemahşerî (ö. 538/1144), Abdülkâhir el-Cürcânî'nin (ö. 471/1078) Kur'an'ın i'câzını açıklamak üzere geliştirdiği nazım teorisini tefsir ile buluşturmuş, tefsir literatürü içerisinde belâgat yönteminin oluşmasına öncülük etmiştir. Zemahşerî sonrası müfessirlerin tefsir teliflerinde yöntem ve içerik açısından el-Keşşâf'ı esas almaları ve bu çerçevede şerh ve hâşiye yazmaları ile daha özelde el-Keşşâf geleneği teşekkül etmiştir. Osmanlı dönemi Şeyhülislâmlarından İbn Kemal Paşa (ö. 940/1534) bu yöntem ve geleneği takip ederek tefsir telif eden müfessirlerden biridir. Bu tez, İbn Kemal tefsirinin el-Keşşâf geleneğindeki yerini, dil ve belâgat ilimleri bağlamında tespit etmeyi amaçlamaktadır. Tez, giriş ve iki bölümden oluşmaktadır. Birinci bölümde İbn Kemal'in tefsir alanındaki çalışmaları kategorize edilip tanıtılmış, tezin ana konusunu oluşturan müstakil tefsiri hakkında ulaşılabilen veriler değerlendirilerek tefsirin yazılış amacı, yazım tarihi, yöntem ve içeriği hakkında genel bilgiler verilmiştir. Tezin asıl konusunu oluşturan ikinci bölümde ise dil ve belâgat ilimlerinin alt disiplinlerini oluşturan her konu için önce İbn Kemal'in bu konulara genel yaklaşımı ele alınmış, ardından Besmele, Fâtiha ve Bakara sûresi ilk altı âyeti özelinde İbn Kemal tefsiri; el-Keşşâf ve doğrudan el-Keşşâf takip edilerek yazılmış telif eserler olan Envâr ve Medârik ile karşılaştırmalı olarak incelenmiştir. Sonuçta dil ve belâgat konularında onun, yöntem açısından el-Keşşâf ve Envâr'ı takip ettiği, içerik açısından ise bu iki tefsiri tahkik tavrı ile yeni bir okumaya tabi tutarak el-Keşşâf çizgisine önemli katkılar sağladığı tespit edilmiştir."
