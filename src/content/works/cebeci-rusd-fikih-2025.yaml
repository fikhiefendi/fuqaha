abstract: "Bu çalışmada, felsefeciliği ile tanınan, aynı zamanda önemli bir fıkıhçı ve başkadı olan İbn Rüşd el-Hafîd'in fıkıhçılığı ortaya konulmaya çalışılmıştır. İbn Rüşd'ün fıkıhçılığı, ed-Darûrî ve Bidâyetü'l-Müctehid adlı eserlerinden tespit edilmiştir. Beş temel bölümden oluşan çalışmanın birinci bölümünde; İbn Rüşd'ün hayatı kısaca ele alınarak kendisine nisbet edilen yirmi sekiz fıkıh eseri hakkında bilgi verilmiştir. İkinci bölümde; İbn Rüşd'ün hüküm teorisi kapsamında, vâcib, mendûb, haram, mekrûh, mubâh, sıhhat, fesâd/butlân, edâ, kadâ', i'âde, azîmet ve ruhsat konularına/terimlerine yer verilmiştir. Üçüncü bölümde; İbn Rüşd'e göre İslam hukukunun ittifak edilen kitâb, sünnet, icmâ, istishâb ve kıyas delilleri ile ihtilaflı kabul edilen sahabe sözü, şer'u men kablenâ, istihsân, maslahat, sedd-i zeri'a ve amel-i ehl-i Medine delilleri işlenmiştir. Dördüncü bölümde; İbn Rüşd'ün delâlet anlayışı kapsamında lafızların, mefhûmun ve karînenin delâletleri konu edinilmiştir. Ayrıca lafızların delâleti kapsamında nass, mücmel-mübeyyen ve zâhir-müevvel lafızların delâleti; mefhûmun delâleti kapsamında da iktizânın, mefhûm-ı muvafakâtın, hitâbın ve emir ile nehyin delâleti ele alınmıştır. Son kısımda karînenin delâleti bağlamında Hz. Peygamber'in, fiil ve takrîrlerinin delâleti konusu ele alınmıştır. Çalışmamızın beşinci bölümünde ise, İbn Rüşd'ün ictihad ve taklid anlayışı, şer'î delillerin sıralaması ve tearuz konuları işlenmiştir. Bunların yanında, her bölümde ele alınan usûl konularının furû fıkha yansıması örneklendirilerek İbn Rüşd'ün fıkıh anlayışındaki usûl furû ilişkisi Mâlikî mezhebi ile mukayeseli olarak ortaya konulmuştur."
