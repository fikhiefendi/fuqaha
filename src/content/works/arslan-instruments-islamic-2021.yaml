abstract: "Bu tez, İslami finans enstrümanlarının Türkiye örneği üzerinden geleneksel finans araçlarından farklı olup olmadığı sorusunu cevaplamayı amaçlamaktadır. Bu nedenle İslami finansın geleneksel finans ve araçlarından kavramsal ve uygulamadaki farklılıklarını belirlemek için, bir dizi İslami finans enstrümanı için kapsamlı bir analiz yapılmıştır. En önemli İslami finans enstrümanları, teorilerine ve uygulamada kullanımlarına göre derinlemesine açıklanır ve İslami finans enstrümanlarının hangi geleneksel finans enstrümanlarının yerini almaya çalıştıklarını gösterilir. Analiz, Türk İslami bankalarının geleneksel finans araçlarını yerine geçebilmek adına İslami Finans ürünlerini oluştururken İslami Finans teorisini uygulama yollarını bulduğunu göstermiştir. Ayrıca, Türk İslami bankalarının bir aylık katilim hesabi getirileri ile Türk geleneksel bankalarının bir aylık vadeli mevduat faiz oranları karşılaştırılmıştır. Test sonuçları, Türk İslami bankalarının bir aylık katilim hesabi getirileri ile Türk konvansiyonel bankalarının bir aylık vadeli faiz oranları arasında anlamlı bir fark olduğunu göstermektedir. Sonuç olarak, İslami finans araçlar ile geleneksel finans araçları arasında bir benzerlik söz konusu, özellikle İslami finans kuruluşlarının geleneksel finans kuruluşlarının rekabet içinde olması ve İslami finans araçlarının geleneksel finans araçlarına alternatif olmaya çalışmaları bu duruma yol açmaktadır. Fakat, bu tez aynı zamanda İslami fi-nansın güvenilirliği ve özellikle İslami finansın geleneksel finansı taklit ettiğine yönelik eleştiriler açısından önemli olan İslami finans araçları ile konvansiyonel finans enstrümanları arasındaki anlamlı farklılıkları ortaya koymaktadır."
