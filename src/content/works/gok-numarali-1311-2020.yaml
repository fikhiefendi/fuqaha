abstract: "Tezimizin ana eksenini oluşturan 421 Numaralı Siirt Şer'iyye Sicili M.1893-1907 tarihleri arasını kapsayan mahkeme kayıtlarından oluşmaktadır. Sicilin başlıca konuları arasında miras ve terekeler, nafaka ve mehir talepleri, çoğunlukla boşalan eytam müdürlüklerine yapılacak olan vekil tayinleri, eytam müdürlükleri vasıtasıyla yetim çocukların varsa mirasları ve mallarının vasi tayini yoluyla korunması, yine bu vasiler vasıtasıyla bu çocukların büyütülmesi gibi kayıtlara rastlanmıştır. Bunun dışında defterde mübarek üç ayların başlangıcının çeşitli sebepler yüzünden belirlenememesinin yetkili makamlara bildirilmesi, vakfiyelere yapılacak olan tayinler ve bu tayinler sırasında çıkan anlaşmazlıklara da rastlanılmıştır. Bu defterin incelenmesi özellikle şehir tarihçiliği bakımından önem arz etmektedir. Böylelikle şehrin sosyo-kültürel, ekonomik, idari ve tarihi yönleri çalışmamızda aydınlatılmaya çalışılmış hukuk, mahkemeler ve kadı defterleri olarakta adlandırılan şer'iyye sicillerinin muhtevası hakkında bilgiler verilmiştir. Çalışmamız giriş ile birlikte, şehrin tarihi serüveni, sicilin transkripsiyonu ve değerlendirmesi olarak üç bölümden oluşmaktadır."
