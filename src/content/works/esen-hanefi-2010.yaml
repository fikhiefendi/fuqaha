abstract: "Çalışmada, Hanefî fıkıh usulü eserlerinin ictihad bahislerindeki teorik meseleler incelenmiştir. Hanefîlerin, fıkıh usulünü müctehidlerin faaliyetlerinden söz eden bir ilim olarak tasavvur ettikleri görülmektedir. Bu sebeple Pezdevî öncesi klasik dönemde, mukallidlere yol gösterici nitelikte bir taklid bahsi, yer almamıştır. Hanefi usul eserlerindeki ictihad, kesin nassın bulunmadığı yerde fıkhî hükmü ortaya koymak için başvurulan bir faaliyettir. Re'y ictihadı tabiriyle ictihad tabiri eş anlamlı görülmektedir. İctihad eden kişinin sahip olması gereken ehliyetten bütün usulcüler söz etmektedir. Ancak ikili ayrımlar haricinde, Hanefî usul eserlerinde detaylı bir müctehidler tasnifine rastlanmamaktadır. Müctehid fi'l-mezheb tabirinin ise, genellikle mukallidler hakkında ve hakikat anlamı dışında kullanıldığı anlaşılmaktadır. Hanefîler, doğrunun tek olduğu fikrine sahiptirler ve musavvibe ya da muhattıe tarafında yer almak bakımından aralarında bir ayrılık yoktur. Semerkandî'nin görüşü ise doğrunun tekliğini kabul edenler arasındaki alt bir ihtilafla ilgilidir. Bu konuda Hanefîlere yapılan eleştiriler, mezhep dışından olup sadece belli usulcüleri değil genel olarak Hanefilerin ictihadda isabet görüşünü hedef almaktadır. Klasik dönemden sonra memzuc eserlerin ortaya çıkmasıyla birlikte Hanefî usulcülerin bazı konularda seleflerinden farklı düşünmeye başladıkları da görülmüştür. Öte yandan memzuc eserlerde, Hanefîlerin kendi görüşlerini delillendirmesinde İbnü'l-Hacib gibi mütekellimin usulcülerinin büyük tesirinin bulunduğu da hissedilmektedir."
