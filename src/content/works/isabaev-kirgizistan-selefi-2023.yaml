abstract: "Kırgızistan'daki Selefî lideri Şamsuddin Abdıkalıkoğlu'nun mezheplere olan yaklaşımını ele aldığımız bu çalışmamızda, Kırgız toplumunun Selefîlikle tanışma şekli, Kırgızistan'a Selefîliğin giriş süreci, bu sürecin tabii neticesi olarak oluşan ve Hanefîlik adı altında kamufle olan Selefî zümrenin lideri konumundaki Abdıkalıkoğlu'nun Selefî fikrini yayma çabası ve Kırgız toplumundaki etkisini aydınlatmayı hedefledik. Buna altyapı oluşturmak adına öncelikle Kırgızistan'ın İslamlaşma süreci incelenmeye çalışılmıştır. Bunu müteakip bağımsızlık sonrası Kırgızistan'a giren dinî akımların biri olan Selefîliğin üzerinde durularak Selefîlerin faaliyet ve öğretileriyle, Abdıkalıkoğlu üzerinden, Kırgız toplumundaki etkileri, Mezhepler Tarihi'nin bize sunduğu yöntemler çerçevesinde incelenmiştir. Araştırmamız iki bölümden müteşekkildir. Giriş bölümünde çalışmanın konusu, amacı, önemi ve yöntemi hakkında bilgilere yer verildi. Birinci bölümde, Selefîlik ve Selefî kimliğe sahip şahıslar hakkında genel bilgiler verilerek Kırgızların İslam'la tanışması ve Selefîliğin Kırgızistan'a girişi ele alındı. İkinci bölümde, Kırgızistan'da Selefî-Hanefî lider olarak tanılan Şamsuddin Abdıkalıkoğlu'nun hayatı, eserleri, dinî düşünceleri, mezheplerle ilgili tasavvuru ve bunların Kırgız toplumuna etkisi incelendi."
