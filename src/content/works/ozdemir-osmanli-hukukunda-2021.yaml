abstract: "Tarihi vesikalara dayanılarak yapılan araştırmalar, fıkhın salt teorik düzlemde geliştiği ve hukukun güncel uygulamalarının ondan bağımsız bir şekilde varlığını sürdürdüğü yönündeki iddiaların hukuk tarihi verileri ışığında analizler yapılarak değerlendirilmesine ihtiyaç bulunduğunu göstermektedir. Klasik fıkıh kitapları, fetvâ mecmuaları ve kadı sicillerini mercek altına alarak küçüğün velâyeti konusunu inceleyen bu çalışma, Osmanlı'da 16-19. yüzyıllar arasında İslam hukukunun nasıl uygulandığının, değişim gösterip göstermediğinin, teorik ve pratik alanın birbiriyle örtüşüp örtüşmeyen yönlerinin neler olduğunun, hukukun uygulanmasında fıkhın ne derecede payının olduğunun tespit edilmesine -belirli bir çerçevede- katkıda bulunmayı hedeflemektedir. Üç bölümden oluşan bu araştırmanın birinci bölümünde küçüğün şahsı üzerindeki velâyet, ikinci bölümünde küçüğün malı üzerinde velâyet, üçüncü bölümünde ise küçüğün bakım ve terbiyesi (hidâne) ele alınarak konu, teori ve uygulama yönüyle ortaya koyulmaya çalışılmıştır."
