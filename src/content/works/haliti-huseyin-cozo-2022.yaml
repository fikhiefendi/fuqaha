abstract: "20. yüzyılın ikinci yarısında Yugoslavya'daki İslâm Birliğinin en önemli şahsiyetlerinden biri Hüseyin Cozo'ydu. İslâm hukuku alanında eğitim almış olmasına rağmen, İslâmî ilimlerin diğer alanlarındaki katkısı da ölçülemeyecek kadar büyüktür. Yirmi yılı aşkın sıkı bir çalışmayla 900'e yakın fetva yayınlayan Cozo, 250'den fazla makale yazmış ve Kur'an-ı Kerim'in ilk dört cüzünün tefsirini yapmıştır. Bunların yanı sıra İslâm İlâhiyat Fakültesi'nin kurulması fikrini ortaya atan isim olduğu gibi, bazı İslâmî dergilerin kuruculuğunu ve baş editörlüğünü yapmıştır. İctihadı yeniden canlandırmaya çalışmak, taklide karşı mücadele etmek, ıslaha ve tecdide çağrıda bulunmak, onun itici gücü ve temel belirleyici özellikleriydi. Bunun en iyi göstergesi de kendisini her fırsatta Hanefî mezhebine bağlı olduğunu vurgulamasına rağmen, fetvalarında diğer mezheplerden de istifade etmesidir. Bu çalışmada onun fıkhî görüşleri gösterilmiş ve en karakteristik fetvalarının tahlili yapılmıştır. Onun özgünlüğünün en iyi görüldüğü ve kendisinin en çok tanındığı fetvalardan biri de onun dinî kurumların ihtiyaçları için zekât ve sadakatü'l-fıtrenin toplanmasıyla ilgili olan fetvasıydı. O dönemlerde siyasi iktidarın sebep olduğu, kendilerini son derece ağır bir finansal krizin içinde bulan Müslümanlar için onun bu fetvası sayesinde yardımların toplanması, söz konusu fetvasının çok önemli bir araç olduğunu göstermektedir."
