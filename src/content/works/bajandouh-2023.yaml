abstract: "Çalışma, Suudi Arabistan Krallığı'ndaki İslami bankacılık kurumlarında sosyal girişimcilik projelerinin yenilikçiliği ve güçlendirilmesinde İslami finans formüllerinin uzun orta ve kısa vadede rolünü belirlemeyi amaçlamaktadır. Çalışmanın amacına ulaşmak için, tanımlayıcı analitik yönteme ve çalışma araçları aracılığıyla (anket ve röportaj) saha çalışması yöntemine dayanılmıştır. Araştırma evreninde/örnekleminde Bank Al-Jazira, Al-Rajhi, Al-Inma, Al-Bilad ve Al-Ahly kullanılmış ve çalışma verileri toplandıktan sonra istatistiksel analiz programına (SPSS) başvurulmuştur. Çalışma, araştırma örnekleminin kurumlarında İslami finansman formüllerinin analizinin sonuçlarının orta seviyeye gelen kısa, orta ve uzun vadeli finansman formüllerinde boyutlarının uygulanması sonucunda orta derecede uygulama ile geldiği sonucuna varmıştır. Aynı şekilde sosyal girişimcilik projelerinin inovasyon ve güçlendirme analizinin sonuçları, çalışma örnekleminin kurumlarının küçük projelerdeki, yenilenebilir enerji gereksinimlerindeki ve çevresel projelerdeki rollerindeki ortalama uygulamalarında ne yaptıklarına dair orta derecede bir uygulama ile gelmiştir. Suudi Arabistan Krallığı'ndaki resmi ve sivil İslami bankacılık kurumlarında sosyal girişimcilik projelerinin yenilikçiliği ve güçlendirilmesinde İslami finansman formüllerinin rolünün istatistiksel olarak anlamlı bir korelasyonu ve istatistiksel olarak anlamlı bir etkisi olduğu ortaya çıktı. Çalışmanın sonuçlarına dayanarak, çalışma tüm boyutlarıyla İslami finansman formatlarında çalışmanın teşvik edilmesini ve çalışma örnekleminin kurumlarında sosyal girişimcilik projelerinin yenilikçilik ve güçlendirme rolünün teşvik edilmesini tavsiye etti."
