abstract: "Endonezya, toplam altı yıl üst üste dünya çapında en hayırsever ülke olarak kabul edilmiştir. Endonezya'da yardımseverlik ve merhametin sağlamlığı ağırlıklı olarak dini bağlılık ve atalardan gelen mirastan etkilenmektedir. Bu çalışma, Endonezya'da din ve aile geleneğinin özgeci davranış üzerindeki etkisini araştırmayı amaçlamaktadır. Bu araştırma ayrıca, bağışları optimize etmede ve bağışçı beklentilerini karşılamada zorluklarla karşılaşan Endonezyalı İslami hayırseverlik kuruluşlarını incelemeyi amaçlamaktadır. Bu araştırma nicel ve nitel metodolojileri eş zamanlı olarak uygulamaktadır. Bu araştırma, bilgi birikimine ve genel pratiklere önerilerde bulunarak katkıda bulunacaktır. Sonuçlar, içsel dindarlığın özgeci davranış üzerindeki etkisinin dışsal motivasyondan önemli ölçüde daha güçlü olduğunu göstermektedir. Ayrıca, bireyler birincil hedeflerine ulaşmak için zaman zaman dini sebepleri istismar edebilmektedir. Özgeci davranış, aile geleneklerini etkileme söz konusu olduğunda, kurumsal olarak yönlendirilen özgecilik üzerinde kişisel özgecilikten daha önemli bir etki sergilemektedir. Aile geleneğinin özgeci davranış üzerindeki etkisi dindarlıktan daha fazladır. Bu bulgular, ailenin birden fazla nesil boyunca itaat ve cömertliğin geliştirilmesinde hayati bir rol oynadığını göstermektedir. İslami STK'ların iyi yönetim, güçlü liderlik, güçlendirilen sistemler, kültürel içselleştirme, kamuya açıklık ve bağışçı beklentilerini karşılayacak etkili bir aracı kuruluş olarak hesap verebilirlik açısından yeteneklerini geliştirmek için yapılması gereken çok şey vardır. Yararlanıcıların daha müreffeh hale gelmesini sağlama ve yoksulluğu veya zayıflığı önleme rolü ile İslami STK'lar, kuruluşun kapasite geliştirmesini hızlandırmalıdır."
