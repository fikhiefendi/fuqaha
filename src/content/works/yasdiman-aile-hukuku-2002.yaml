abstract: "Bu tezin amacı, İslâm Aile Hukuku'nda kullanılan hadislerin tahlilini, tenkidini yapmak ve bunun yanı sıra söz konusu hadislerin mezheplerce nasıl değerlendirildiğini incelemektir. Bu çerçevede yaptığımız araştırmanın Giriş bölümünde,“Araştırmanın Konusu ve Alanı”belirtilmiş, araştırma sürecinde kullanılan“Kaynaklar”ve“Takip edilen Metot”hakkında bilgi verilmiştir. Birinci Bölümde, Nikâhın Tanımı, Nikâhın Şartları ve bu bağlamda İcâb ve Kabul Sözleri, Evlenme Mânilerinin Bulunmaması, Bekâr Kız ve Dul Kadının Evliliğe Rızası, Nikâh Akdini Taraf Olarak Kadının Yerine Velînin İcra Etmesi, Şahitlerin Bulunması ve Evliliğin İlânı ile Resmî Nikâhın Hükmü gibi konular incelenmiştir. İkinci Bölümde,“Kadının Maddî Haklan”başlığı altında Mehir, Mehir Kavramının Tanımı ve Hukukî Yönü, Mehrin Çeşitleri ve Miktarı, Nafakanın Tanımı ve Hukukî Yönü, Nafakanın Konusu ve Miktarı, Nafakayı Gerekli Kılan Şartlar, Nafaka Yükümlülüğünün İfa Edilmemesi konuları ele alınmıştır. Üçüncü Bölümde,“Kadının Mehir ve Nafaka Dışındaki Hakları”ile ilgili olarak Cinsel İlişki Hakkı, Azil ve Doğum Kontrolü, Kadının Kendi Malında Tasarrufu, Kadının Kocasının Malında Tasarrufu, Güzel Muamele konuları işlenmiştir. Sonuç bölümünde, genel bir değerlendirme ile araştırma tamamlanmıştır. Araştırmamız ortaya koymuştur ki, Aile Hukuku ile ilgili kullanılan sahih hadislerin önemli bir miktarı örfe göre yorumlanmış, delil gösterilen bir kısım hadisler ise zayıf hükmünü almıştır. Hakkında nas bulunmayan durumlarda ise, bazen kadınların lehine bazen de aleyhine hükümler verilmiştir. Biz bu çalışmanın, kadınlarla ilgili olarak diğer konularda da günümüze ulaşmış rivayetlerin“daha dikkatli”gözden geçirilmesi gerektiğine dair bir anlayışın oluşmasına katkı sağlayacağı inancındayız. Mil"
