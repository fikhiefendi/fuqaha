abstract: "Âşıklık geleneği, kökü mazide olup atiye doğru uzanan bir sürecin olgusudur. İslamiyet'ten önce Şamanizm'e kadar dayanan bu gelenek, İslamiyet'ten sonra da bu dinin kabulüyle heteredoks bir yapıya bürünmüş ve tekke, cami ekseninde varlığını sürdürmeye devam etmiştir. XVI. yüzyıldan itibaren dinî ve tasavvufî bir söylemden uzaklaşan saz şairleri, bireysel deneyimlerinden ve toplumsal olaylardan hareketle daha realist şiirler söylemeye başlamışlardır. Kendilerine âşık adını veren bireysel ve toplumsal olayları şiirlerinde ele alan âşıklar, sanatkârlıklarının verilmesini de ilahi bir kaynağa bağlamışlardır. Sanatkârlıklarını ispat etmek ve adlarını duyurmak için taşradan merkeze seyahat esnasında konakladıkları her yerde sanatlarını icra eden bu âşıklar, hissi duyguların ifade edilmesinin yanı sıra kolektif anlatıların taşınmasına ve aktarılmasına da hizmet etmişlerdir. Bu yönüyle âşıklar, sözlü kültürün taşıyıcıları olarak kolektif belleğin bölgeden bölgeye, nesilden nesle aktarılmasında önemli rol oynamışlardır. Anadolu topraklarında âşıklık geleneğinin canlı olarak devam ettiği birkaç merkezden biri de Malatya'dır ve yörede yüzyıllar boyunca gelenek içinde birçok âşık yetişmiştir. Bu çalışmada da Malatya'da yetişmiş önemli âşıklardan biri olan, Âşık Hanefi Ünver'in hayatı ve sanatı hakkında bilgi verildikten sonra şiirleri; muhteva, üslup, dil ve edebî sanatlar açısından incelenerek Âşık Hanefi'nin, gelenek içindeki edebî yeri ve etki alanı tespit edilecektir."
