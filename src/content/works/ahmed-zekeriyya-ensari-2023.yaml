abstract: "Bu çalışmada büyük ve değerli ilimlerden biri olan fıkhî kaideler ilmi ele alınmıştır. Bu ilim sayesinde dağınık cüzi ve feri meseleler az kelimeyle muhafaza altına alınıp toplanmıştır. Bu da fetva verenlerin ve ilim talebelerinin cüzilere dalmadan daha azla bir zahmetle fıkha başvurmalarını kolaylaştırmıştır. Özellikle satışlar konusunda fıkhî kaidelerin toplanması büyük bir ehemmiyet arz etmektedir. Çünkü, özellikle bu, İslam fıkhı hükümleri konusunda uzman olmayan kimselerin satış ile ilgili bölümlerin hükümlerine ulaşmasını kolaylaştırmaktadır. Bu tez, (Ense'l-Metâlib Şerhu Ravdati't-Tâlib) adlı eserde yer alan satış meselelerinden fıkıh kaidelerinin çıkarılmasını odak noktası olarak alıp bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde konunun önemi, hedefleri, çalışmanın sınırları ve önceki çalışmaların tanıtımı yer almaktadır. Daha sonra birinci bölümde Şeyh Zekeriya el-Ensari'nin hayatı, adı, yetiştirilme tarzı, kişisel yaşamı, ilmi yolculuğu ve Ense'l-Metâlib dahil olmak üzere eserlerinin tanıtımı yer almaktadır. Ayrıca fıkhî kaidelerin tanımı, fıkhî kaide ile fıkhî zabıt arasındaki fark, bunlarla alakalı diğer fıkhî ıstılahların ilişkisi ve kaidelerin rükünleri, şartları, delilliği ve kaynakları ele alınmaktadır. İkinci bölüm ise, söz konusu kitapta yer alan satış konularına ilişkin fıkhî kaidelerin çıkarılmasını içermektedir ki, bunlar on bir kural olup her biri tek tek şerh edilmiş, lafızları açıklanmış ve furuları ortaya konulmuştur. Tez boyunca fıkıh alanındaki ana kaynaklara başvurulmaya özen gösterilmiştir. Son olarak sonuç kısmında, çalışmanın ulaştığı en önemli neticelere yer verilmiştir."
