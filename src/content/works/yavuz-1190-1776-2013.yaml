abstract: "Osmanlı Devleti'nin en önemli yargı organı olan Şerʻi Mahkemelerde tutulan şerʻiyye sicilleri özellikle tutulduğu yıllara ve tutulduğu bölgenin tarihteki konumuna dair birçok bilgiyi içerir. Şerʻiyye sicilleri muhtelif devirler ve bölgeler hakkında bize çok değerli hukuki, iktisadi, dini askeri ve idari belgeler bırakmışlardır. Niğde, tarihî açıdan önemli bir ilimizdir. Osmanlı Devleti'nin hâkimiyetine girdikten sonra, Niğde'nin şehir hayatında hızlı bir canlanma meydana gelmiştir. Bu canlanmayla birlikte Niğde'de şer'iyye sicil defterlerindeki vesika çeşitliliği de artmaya başlamıştır. Bor, Karaman Eyaletine bağlı Niğde Sancağının sınırları içinde kendi adıyla anılan bir kazanın merkezidir. Bu merkez büyük bir köy durumundadır. Zaman içerisindeki sosyal ve ekonomik olaylara bağlı olarak kazanın gelişimi değişmektedir.“H.1190/M.1776 Tarihli Bor Şerʻiyye Sicili (inceleme-metin)”başlığı altında yaptığımız bu tez çalışmamızın amacı, ele aldığımız şerʻiyye sicilinin günümüz Türkçesine çevrilmesi ve sicilde yer alan vesikaların değerlendirilmesiyle bölgeye ve kayıtların tutulduğu tarihlere dair çalışma yapacak araştırmacıların istifadesine sunmaktır. Bu manada çalışmamız iki bölümden oluşmaktadır. Giriş bölümünde Bor kazasının tarihin ilk dönemlerinden şerʻiyye sicilimizin kaydının tutulduğu döneme kadar genel tarihinden, XVIII. Yy. son çeyreğindeki Osmanlı Devleti'nin genel durumu ve şerʻiye sicillerinin önemi, içeriği ve sicillerdeki belge çeşitlerinden söz edilmekle beraber Niğde ve Bor şerʻiye sicilleri üzerine bilgi verilmiştir. İkinci bölümde ise şerʻiyye sicili'nin, transkripsiyonu ve sicilin orijinal metni verilmiştir."
