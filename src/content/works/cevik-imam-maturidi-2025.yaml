abstract: "Hanefî ulemânın öncü isimlerinden İmam Mâtürîdî, hicrî üçüncü yüzyılın ortalarında günümüz Özbekistan'ında bulunan Semerkant'ın Mâtürid köyünde dünyaya gelmiş ve buraya nispetle“Mâtürîdî”diye isimlendirilmiştir. Mâtürîdiyye mezhebinin kurucusu olmasından ötürü daha çok kelam ilmiyle ilişkilendirilse de tefsir, fıkıh, fıkıh usulü, mezhepler tarihi ve Kur'an kıraati alanlarında çalışmalarının olduğu bilinmektedir. Bu alanlarda çok sayıda eser telif eden Mâtürîdî'nin eserlerinden yalnızca Kitâbu't-Tevhîd ile Te'vîlâtü'l-Kur'ân günümüze ulaşabilmiştir. İmam Mâtürîdî'nin bu çalışmaya kaynak teşkil eden eseri Te'vîlâtü'l-Kur'ân'ın, sûrelerin mushaftaki sırasına göre baştan sona tefsir edildiği ilk dirayet tefsiri olduğu düşünülmektedir. O, ayetleri tefsir ederken öncelikle nassa müracaat etmiş, fıkhî meseleler içeren ayetlerde Hanefî bakış açısıyla izah yolunu seçmiştir. İhtilaflı konularda mezhebinin yaklaşımını savunmuş ve deliller öne sürerek karşıt görüşleri eleştirmiştir. Nûr Sûresi, sosyal ilişkilerde uyulması gereken görgü kurallarına temas edilen ve ahlâkî yaşantının hükümlerle desteklendiği medenî bir sûredir. Bu hükümlerden zina, kazf ve liân birbiriyle doğrudan bağlantılı olup ilk dokuz ayette peşpeşe zikredilmiştir. Zina ve kazf suçları had olarak tayin edilmiş, eşler arasındaki zina isnadı ise lian hükümleriyle çözümlenmiştir. Nûr Sûresine Te'vîlât'ta geniş bir yer veren Mâtürîdî, ahkâm ayetlerini detaylarıyla ele almış, naklî ve aklî delillerle meseleleri izah etmiş, konuların fıkhî yönünü ön plana çıkarmakla kalmayıp vurgulanan mesajların hikmet boyutunu da açıklamaya gayret etmiştir. Mâtürîdî'nin ahkâm ayetlerini te'vîlinde, mezhebinin taraf olduğu görüşleri savunurken bazen isim vermeden İmam Şafiî'yi eleştirmesi, Mu'tezile'ye atıfta bulunması, ayrıca Ebû Hanîfe'nin sıkı bir takipçisi olmasına rağmen bazı meselelerde farklı görüşler beyan etmesi ve hatta kimi tercihlerinde tamamen yalnız kalması dikkat çekmektedir."
