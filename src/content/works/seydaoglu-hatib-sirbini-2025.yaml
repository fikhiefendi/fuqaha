abstract: "Bu çalışmada Hatîb eş-Şirbînî'nin usul anlayışı incelenmiştir. Hatîb eş-Şirbînî hicri 10./miladi 16. yüzyılda Kahire'de yaşamış önemli bir Şâfiî fakihi, müfessir, edip ve dil bilimcidir. Müellif, tefsir, hadis, akide, fıkıh, usûlü'l-fıkh, nahiv gibi birçok ilim dalında 27 eser kaleme almıştır. Fıkıh alanındaki en meşhur eserlerinden“el-İkna”ve“Muğni'l Muhtac”ilim çevrelerinde büyük ilgi görmüştür. Hatîb eş-Şirbîni, fıkhın yanı sıra usûlü'l-fıkh alanında el-Bedrü't-tâliʿ fî halli elfâzi Cemʿi'l-cevâmiʿ adında önemli bir eser kaleme almıştır. Bu eser, Tâcuddîn es-Sübkî'nin yüz usûl eserinden derleyip yazdığı Cem'u'l-cevâmi' isimli eserin şerhidir. Çalışmada Şirbîni'nin Cem'u'l-cevâmi' adlı esere nasıl yaklaştığı, muvafakat ve muhalefet ettiği hususlar, mukayeseleri, tercihleri, eleştirileri ve kendi görüşlerini akli ve nakli delillerle nasıl temellendirdiği gibi hususlardan hareketle onun usul anlayışı belirlenmiştir. Şirbînî'nin ilmî çalışmalarında Kur'an ve sünneti merkeze aldığı, aklî delilleri kullanarak görüşlerini temellendirdiği ve özellikle mukayeseli yöntemleri başarıyla uyguladığı görülmüştür. Şirbînî'nin kaleme aldığı eserlerde, ilmî titizlik ve analitik düşünme yeteneği ön plana çıkmış, ayrıca tanımlar ve tasnifler konusundaki derin analizleri dikkat çekmiştir. Şirbînî'nin usûl anlayışının, Şâfiî mezhebinin temel ilkeleri doğrultusunda şekillendiği, ancak bazı konularda farklı görüşler de sunduğu tespit edilmiştir. Özellikle mükrehin mesuliyeti, teklîfî ve vad'î hükümlerin tasnifi gibi meselelerde özgün yaklaşımlar sergilemiştir."
