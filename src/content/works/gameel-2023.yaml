abstract: "Bu çalışma, Hanefi fıkhı alanında bir el yazması konuyu ele almakta olup, başlığı \"İbn-i Hatib Zadeh'in önleme açıklaması üzerine bir dipnottur. El yazması, Hanefi fıkhının kaynaklarından biri olarak kabul edilmesi nedeniyle büyük önem taşımaktadır. Muğlaklık ve kökenleri, Hanefi mezhebinin kaynaklarının annelerine dayanmaktadır ve bu tez şu bölümlerden oluşmaktadır: bir giriş, ardından konu ve amaçların seçilme sebepleri, daha sonra da eserin önemi. konu ve araştırmacının karşılaştığı güçlükler ve problemler, ardından akademik bölüm olan ve üç bölümden oluşan birinci bölümde araştırmacı, birinci bölümde genel olarak metnin yazarı sevgili Şeriat'ın kişisel ve bilimsel biyografisi açısından bir tercümesini ele almış, İkinci bölümde araştırmacı, Şeriatu'l-Matn Sadru'l-Şeriatu'l-Mahbubi'nin kişisel biyografisi ve yaşadığı çağın özellikleri açısından bir çevirisinde, üçüncü bölümde ise araştırmacı, maiyet sahibinin kişisel biyografisini ele almıştır. maiyet sahibi, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin kişisel biyografisini, maiyet sahibinin İbnü'l-hatibzade ve yaklaşımı, dogmatik düşüncesi, doktrini ve yaşadığı toplum üzerindeki etkileri hakkındaki vahiy kalıpları, ardından ikinci bölüm: iki bölümde, birinci bölüm araştırmacının bunu başarma yaklaşımını açıklamak için İbnü'l-hatibzade'nin çevresini inceledi makale, ikinci Bölüm: Elde edilen metin, ardından araştırmacının ulaştığı en önemli sonuçlar ve en önemli öneriler"
