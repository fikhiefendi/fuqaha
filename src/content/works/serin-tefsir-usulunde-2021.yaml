abstract: "Müslümanlar Kur'ân-ı Kerim'i anlamak, yorumlamak ve hayatlarında aktif kılmak amacıyla ilk muhataplardan günümüze kadar çalışmalar yapmışlardır. Bu çalışmaların temel amacı ilahi vahyi doğru anlamak ve aktüel kılmaktır. Nitekim insanlar sürekli değişmekte ve aynı zamanda bu değişimden yaşam tarzları da nasibini almaktadır. Böyle bir durumda Kur'ân'ın muhatapları ilahi vahyi anlamak ve güncel olaylara karşı yorumlayabilmek için doğru anlamanın ve isabetli sonuçlara ulaşmanın yollarını tespit etme gayretine girmişlerdir. Kur'ân ilk muhataplarından sonraki tüm nesiller için canlı bir olgu olma durumunu yitirmekle beraber bu ikili arasındaki zamansal fark da ilerlemektedir. Böyle bir durumda Kur'ân ve muhatapları arasında ciddi bir ara oluşmakta ve bu durum da tefsirde daha dikkatli davranılması gerektiğini göstermektedir. Bu amaçla Müslüman âlim, düşünür ve mütefekkirler Kur'ân'ı doğru anlamak ve yorumlamak amacıyla çeşitli çalışmalar ve ölçüler ortaya koyma gayretine girmişlerdir. Bu konudaki çalışmalarda temel ölçü Kur'ân'ı doğru anlamak ve yorumlamak için gerekli ilke ve yöntemleri tespit etmek amaçlanmaktadır. Tefsirlerin mukaddime kısımlarında ve Ulûmu'l-Kur'ân eserlerinde bu ilke ve yöntemler zikredilmekle beraber müfessirlerin tefsir çalışmalarında dikkat etmeleri gereken ve aynı zamanda faydalanabilecekleri belirli malumatlar sunulmaktadır. Fakat bu malumatların bir metodoloji oluşturmaya yeterli olup olmadığı hususu tartışılmaktadır. Metodoloji geliştirmek amacıyla yeni yaklaşımlar günümüzde de devam etmektedir. Temel İslam bilimlerinde Fıkıh ilminin müstakil bir metodolojiye sahip olduğu malumdur. Fıkıh ilminin sahip olduğu anlama ve yorumlama yönteminin Kur'ân'ın bütün ayetleri üzerinde uygulanmasının imkân ve sınırlılıkları tespit etmek oldukça mühimdir. Bizim yaptığımız bu çalışmada Kur'ân'ı anlamak ve metodoloji sorununa çözüm oluşturmak amacıyla yazılan ve temelde Usûlu'l-Fıkh'ı esas alan Tefsir Usûlu'nün imkan ve sınırlılıklarını incelemektir. Dr. Hüseyn'in yazdığı el-Meâyîru'l-Kabûl ve'r-Red li Tefsîri'n-Nassi'l-Kur'ânî adlı çalışmamıza konu olan bu eser fıkıh usûlünü esas alan bir tefsir usûlü çalışmasıdır. Bu eserin değerlendirmesini yaparak böyle bir usûlün Kur'ân'ın anlaşılması ve yorumlanması açısından yeterliliğini, imkân ve sınırlarını değerlendirmeye gayret edeceğiz."
