abstract: "el-Ümm Adlı Eseri Çerçevesinde İmam Şâfiî'nin Dil Anlayışı isimli bu tezde İmam Şâfiî'nin dile dair görüşleri ele alınmıştır. Şâfiî'nin er-Risâle'de ortaya koyduğu beyan teorisi bu araştırmada bir metin yorum metodu olarak ele alınmıştır. Araştırma sırasında hem beyan teorisinin anlaşılması ve yorumlanmasında hem de fürû-i fıkıhta dile dayalı yorumlarının tespitinde İmam Şâfiî'nin el-Ümm isimli eserine başvurulmuştur. İmam Şâfiî'nin beyan teorisine çalışmanın birinci bölümünde yer verilmiştir. Zira Şâfiî'nin dil düşüncesi beyan kavramı çerçevesinde şekillenmiştir. Beyan teorisinin en önemli dayanaklarından biri vahiy dilinin Arabî olmasıdır. Şâfiî'nin Kur'ân'ı Arabî olarak nitelemesi vahyin mesajının Arapçaya has üsluplar çerçevesinde iletilmesi anlamına gelmektedir. Şâfiî'ye göre Arapçaya has olan bu üslupların en önemlisi Arap dilinin esnek olmasıdır. Şâfiî, bu esnekliği ittisa' olarak isimlendirmiş ve bu kavramla dilin kesinliği problemine işaret etmiştir. Şâfiî, dildeki belirsizlikten kaynaklı sorunların çözümünde beyan yetkisini Hz. Muhammed'e has kılmıştır. Böylece haber-i vahid Şâfiî'nin beyan teorisinin en önemli parçası haline gelmiştir. Bu araştırmanın birinci bölümünde Şâfiî'nin beyan teorisi; Kur'ân'ın Arabîliği, Kur'ân'ın çevirisinin imkânı ve dilde ittisa' olgusu bağlamında ele alınmıştır. Araştırmanın ikinci bölümünde Şâfiî'de umum lafızları ele alınmış ve bu konunun dil ilimleri ile ilişkisi dilde ittisa' ve vaz' ilmi çerçevesinde kurulmuştur. Böylece hem usul disiplini ile dil ilimlerinin kesişen problemleri tespit edilmeye çalışılmış hem de Şâfiî'deki vaz' düşüncesinin izleri takip edilmiştir. Çalışmanın üçüncü ve son bölümünde ise Şâfiî'ye muhtelif görüşlerin nisbet edildiği dil ile ilgili konular ele alınmıştır. Böylece Şâfiî'nin ilgili konulardaki düşüncesi kendi açıklamaları üzerinden netleştirilmeye çalışılmıştır."
