abstract: "Katılım bankaları dünyada 1963'den beri faizsiz bankacılık esaslarına göre çalışan bankalardır. Türkiye'de 1983 yılında Bakanlar Kurulu kararıyla Özel Finans Kurumu adıyla kurulan katılım bankaları 1999 yılında Bankacılık Kanununa tabi olmuş, 2005 yılında da yine kanunla katılım bankası adını almışlardır. 1983 yılından beri Türkiye'de faaliyet gösteren katılım bankaları özellikle 2002 yılından sonra istikrarlı bir büyüme sergilemekte ve bankacılık sektöründeki payını arttırmaktadır. 2002 yılından 2009 yılına kadar 4 kat büyüyen bankacılık sektörü içinde katılım bankaları 9 kat büyümüştür.Bankaların karlılıklarını arttırmada ve risklerini azaltmada mali durumlarını sürekli gözden geçirmeleri önem arz etmektedir. Banka yönetimleri için ise bankanın mali durumunu gösteren en temel araçlar banka mali tablolarıdır. Yöneticiler kendi bankalarının mali tablolarını ve diğer bankaların mali tablolarını iyi analiz ederek, mevcut performanslarını değerlendirebilir, geleceğe yönelik hedeflerini oluşturabilir; strateji ve planlar yapabilirler.Çalışmamızın amacı; katılım bankalarının son 5 yıllık mali performanslarının mali tablo analizi yöntemiyle değerlendirilmesidir. Çalışmamızın birinci bölümünde Türkiye'de ve Dünya'da katılım bankalarının kuruluşu, tanımını, kapsamı, tarihçesi, kanuni dayanakları, faaliyet alanları ve bankacılık sektöründeki durumu anlatılmıştır. Çalışmamızın ikinci ve son bölümde katılım bankalarının mali tabloları, mali tablo analiz yöntemleri anlatılmıştır ve katılım bankalarının son 5 yıllık mali tabloları karşılaştırmalı olarak analiz edilerek mevcut finansal performansları değerlendirilmiştir."
