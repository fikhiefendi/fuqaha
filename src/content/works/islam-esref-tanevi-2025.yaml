abstract: "Bu çalışma, İslam hukukunun klasik mirasını merkeze alarak çağdaş dünyada karşılaşılan fıkhî sorunlara nasıl çözümler üretilebileceğini araştırmaktadır. Hint alt kıtasında yetişmiş önemli Hanefî fakihlerden biri olan Eşref Ali Tânevî'nin fetvalarından hareketle, günümüz ibadet, muamelat ve ceza hukuku alanlarındaki güncel meselelere dair değerlendirmeler yapılmakta ve çözüm önerileri sunulmaktadır. Tespitlerimize göre, tercihlerini belirlemede yaşadığı bölgenin örfü, halkın ihtiyaçları ve maslahatı önemli rol oynamaktadır. Çalışmada âdet gören kadının Kur'ân okuması, dijital cihazlarda yer alan mushaf metninden tilavet etmesi, sahurda ezan sonrası yeme-içmenin hükmü, fâsık imamın arkasında namaz kılınması gibi bireysel ibadetlere dair meselelerin yanı sıra piramidal satışlar, süftece işlemi, mülkiyeti satıcıya ait olmayan malların satışı, gayrimüslimlerle evlilik, mahallî mahkemelerde ta'zîr cezaları, kadının zarar gördüğü durumlarda boşanma talebi gibi toplumsal ve hukukî meseleler incelenmiştir. Bu meseleler hem klasik fıkıh kaynakları hem de çağdaş fetva kurumlarının görüşleri ışığında karşılaştırmalı olarak değerlendirilmiştir. Bu yönüyle çalışma, klasik fıkıh birikimi ile güncel problemler arasında işlevsel bir köprü kurmaktadır. Tânevî'nin mezhep içi görüş farklılıkları arasında zaman zaman zayıf görüşleri tercih ettiği, bazı fetvalarında ise mezhep dışı görüşleri benimsediği tespit edilmiştir. Klasik kaynaklarda doğrudan cevabı bulunmayan bazı meselelerde ise örfe ve zamanın ihtiyaçlarına dayalı yorumlar geliştirdiği gözlemlenmiştir. Sonuç olarak bu çalışma, günümüz Müslümanlarının karşılaştığı yeni fıkhî problemlerin klasik fıkıh literatüründen kopmadan, örf, maslahat ve zamanın şartları gözetilerek nasıl çözülebileceğini göstermeyi amaçlamaktadır."
