abstract: "Fıkıhta, abdest alırken ayaklara yapılacak işlem hususunda ilk dönemden itibaren bir ihtilaf söz konusudur. Bu çalışma, Mâide 6. âyet esas alınarak abdest alırken çıplak ayağa mesh etmenin caiz olup olmadığı hususunun Kur'ân ve Sünnet ışığında tespitini kapsamaktadır. Önce mesh ile ilgili temel kavramlar ele alınmış, daha sonra Ehl-i Sünnet ve Şîa'ya ait belli başlı tefsirler incelenmiştir. Konuyla ilgili hadisler derlenerek tahlil ve tenkitleri yapılmış ve meşhur mezheplerin görüş ve delilleri tetkik edilmiştir. Yıkama ve mesh görüşlerinin değerlendirilmesinin yanı sıra abdest konusunda bir nesih olup olmadığı hususu Kur'ân-Sünnet ilişkisi açısından araştırılmıştır. Sonuçta, mesh kelimesinin yıkama anlamına gelmediği tespit edilmiş ve Mâide sûresinin 6. âyetinin ayakları yıkamayı gerektirdiğine dair getirilen deliller isabetli bulunmamıştır. Kur'ân-Sünnet bütünlüğü açısından Peygamber'in (s.a.v.) Mâide 6. âyetten önce, geçmiş şeriatlere göre abdest aldığı ve ayaklarını yıkadığı, bu âyetten sonra ise uygulamanın nesh edilerek hafifletildiği ve O'nun (s.a.v.) ayaklarını mesh ettiği sonucu çıkarılmıştır. Dolayısıyla yıkama ve mesh hadisleri arasında bir çelişki olmadığı ve ilgili âyette ayaklara meshin emredildiği kanaatine varılmıştır."
