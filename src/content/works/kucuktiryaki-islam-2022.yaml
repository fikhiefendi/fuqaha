abstract: "Çalışmamızın kapsamını özlü bir şekilde ortaya koyması bakımından İslam hukukuna göre talakın dünü, bugünü ve yarını şeklinde ifade etmek mümkündür. Birinci bölümde öncelikle boşamaya dair teoriler ve diğer bazı hukuk sistemlerinde boşama yetkisi başlığı altında konumuzla alakalı farklı din ve sistemlerdeki uygulamalar ortaya konmaya çalışılmıştır. İslam aile hukukunun genel karakteristiği ortaya konduktan sonra evliliğin erkek tarafından sonlandırılması anlamına gelen talak konusu tüm yönleriyle ele alınmıştır. Bunun yanı sıra kadının mahkeme vasıtasıyla boşanma talebinde bulunabileceği durumlar ve muhalaa, lian, ila gibi yine evliliği sonlandıran diğer önemli hususlara da temas edilmiştir. Ayrıca imkânı halinde bir sulh müessesesi olan bazı bakış açılarına göre hâkim/mahkeme gibi de işlev görebilen hakem heyeti/aile meclisi uygulaması hakkında da bilgi verilmiştir. Yine bazı durumlarda evliliğin sonlanmasıyla sonuçlanabilen zıhar konusuna da değinilmiştir.“İslam aile hukukunda boşa(n)manın dünü”diyebileceğimiz bu uygulamalara son ve asıl tartışma bölümünde birer sabite olarak işlev görecek olmaları hasebiyle temas edilmiştir. İkinci bölüm talakın kısaca tarihsel olarak geçirdiği aşamalara ve bugününe dairdir. Bu bölümde öncelikle talakın tarihsel seyrine temas edilmiş, Türk Medeni Kanununun (TMK) bazı özellikleri, karakteristiği, evliliği sonlandırma sistemi ve prosedürü üzerinde durulmuş daha sonra da diğer bazı İslam ülkelerinin aile kanunlarında benimsenen sistem ve talak yetkisinin kim tarafından nasıl kullanıldığına dair mevzuata değinilmiştir. Çalışmamızın son bölümünde, ele aldığımız konunun bir problem olarak hangi süreçte nasıl ve neden ortaya çıktığını ortaya koyabilme adına meselenin tarihsel, siyasi-fikri ve sosyololojik arka planını anlamaya çalıştık. Daha sonra erkeğin talak yetkisinin mahkemeye devri konusunda olumlu ve olumsuz fikre sahip olanların görüşlerini delilleriyle birlikte ele aldık. Nihayet gerek konuya dair görüş sahiplerinin argümanlarını ve gerekse probleme dair değinilmesi gereken ilave bir takım meseleleri değerlendirmek suretiyle neticede bir sonuca ulaşmaya çalıştık."
