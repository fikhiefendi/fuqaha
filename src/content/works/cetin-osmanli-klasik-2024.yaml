abstract: "İslam dininde, dinde zorlama yoktur ayeti gereğince gayrimüslimler Müslüman olmaya zorlanmamıştır. Bilakis din ve inanç özgürlükleri korunmuştur. Bu sebeple İslam medeniyetinin en başından itibaren gayrimüslimler İslam hukuku gereğince zimmi statüsünde Müslümanlarla beraber aynı toplumda yaşamışlardır. Çalışmamızın konusunu oluşturan kısım ise inanç hürriyetlerine sahip olan zimmilerin kiliseleridir. Konuda ilk olarak Osmanlı Devleti'ndeki gayrimüslimlerin durumu incelenmeye çalışılmıştır. Devletin kuruluşundan itibaren on altıncı yüzyıla kadar olan süreç için tarihi kaynaklardan yola çıkılarak gayrimüslimlerin toplumsal ve idari yapılandırılması ve kiliselerinin durumu incelenmeye çalışılmıştır. Sonrasında kiliselerin İslam hukukunda nasıl değerlendirildiğini görmek adına mesele Hanefi mezhebi özelinde ele alınmıştır. Kiliselerin statüsü bulundukları yerlerin nasıl fethedildiği ve şehir ya da köy oluşuyla ilgili olduğu için konu bu şekilde takip edilmiştir. Son olarak ise kiliselerin Osmanlı uygulamasında nasıl bir statüye sahip olduğu dönemin şeyhülislam fetvalarından ve kadılara gönderilen hükümler üzerinden takip edilmeye çalışılmıştır. Kilise fıkhı derken kastedilen ise fethedilen yerlerdeki kiliselerin durumu, ibkâ edilen kiliselerin ihtiyaç halinde tamiri ve yeni kilise ihdâs edilip edilemeyeceği gibi konulardır."
