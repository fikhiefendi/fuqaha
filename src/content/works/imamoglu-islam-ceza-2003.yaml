abstract: "Tez bir giriş ve üç bölümden oluşmaktadır. Tezin giriş bölümünde İslam hukukuna göre cezanın tanımını, ilkelerini ve gayelerini ele aldık. Bunu takip eden birinci bölümde kasten öldürme suçu dışında kalan diğer öldürme çeşitlerini mezheplerin görüşleri ışığında ele aldık. İkinci bölümde kasten öldürme suçunun unsurları ve cezalarını inceledik. Son bölümde ise kasten öldürme suçunun cezalarından biri olan kısası ele alıp, kısasın uygulanması için gerekli şartlan zikrettik. Tezin sonucunda konuyu kısa bir şekilde değerlendirdik."
