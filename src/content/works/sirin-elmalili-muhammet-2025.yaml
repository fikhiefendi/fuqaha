abstract: "Bu çalışma, Elmalılı Muhammed Hamdi Yazır'a nispet edilerek Sıtkı Gülle tarafından hazırlanan“Alfabetik İslâm Hukuku ve Fıkıh Istılahları Kâmûsu”adlı eserin gerçek müellifini ve eserin özgünlüğünü ortaya koymak adına hazırlanmıştır. Zira, eserin kime ait olduğu hususunda literatürde net bir görüş birliğinin bulunmaması, çalışmanın temel çıkış noktasını oluşturmuştur. Araştırmanın amacı, eserin Elmalılı Muhammed Hamdi Yazır'a ait olup olmadığını tespit etmek ve eserin ilmi özgünlüğünü ortaya koymaktır. Bu doğrultuda, karşılaştırmalı yöntem kullanılarak Yazır'ın yarım kalan“İslâm Hukuk Kamûsû”adlı el yazması nüshası ile beş cilt olarak neşredilen eser, içerik, üslup ve hacim yönünden detaylı bir şekilde karşılaştırılmış, Yazır'a ait el yazması nüshanın içerisinde bulunan terimlerin tamamının transkripsiyonuna yer verilmiştir. Yapılan inceleme ve karşılaştırmalar neticesinde, eserin üslup, içerik ve kaynak kullanımı açısından Elmalılı Muhammed Hamdi Yazır'a ait olmadığı, eserin büyük çoğunluğunun Sıtkı Gülle tarafından ilaveler yapılarak neşredildiği sonucuna varılmıştır. Çalışma, bu yönüyle eserin yanlış müellif nispetini düzeltmeye katkı sağlamakta ve literatürde şimdiye kadar kapsamlı bir şekilde ele alınmamış bir konuya açıklık getirmektedir. Bu araştırmanın, İslâm Hukuku ve Fıkıh literatüründe doğru eser-müellif eşleştirmelerine katkı sağlayacağı ve gelecekte yapılacak benzer çalışmalara bir zemin oluşturacağı düşünülmektedir."
