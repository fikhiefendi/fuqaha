abstract: "Ekonomistler ve düşünürler, gelişmiş ülke ekonomilerini etkileyen ve gelişmekte olan ve yoksul ülke halklarına gölge düşüren ekonomik krizler ışığında, çözümlerden biri olarak küçük ve orta ölçekli işletmelerin önemine dikkat çekmişlerdir. Bu projeler, krizlerin nedenlerinin, ekonomik ve sosyal sorunların ortadan kaldırılmasına, yoksulluğun sona erdirilmesi ve işsizlik oranlarının düşürülmesi yoluyla sürdürülebilir kalkınmanın sağlanmasına katkıda bulunabilir. Maddi ve insan kaynakları çoğu zaman optimal olarak kullanılmamakta ve etkin kalkınma programlarına yönlendirilmemekte ve geliştirilmekte katkıda bulunsalar bile bu gelişme yenilenebilir ve sürdürülemez değildir ve başarısız ve düşünülmemiş ekonomi politikaları nedeniyle zenginlik çoğunlukla tüketime yöneliktir. Bu araştırmada, geleneksel veya İslami, farklı yönelimlere sahip bankalar gibi finansal kurumların, bu projelerin başarıya ulaşmasına ve finansal ve para otoritesinin gözetiminde gerekli finansmanı kolay koşullarda sağlamaya devam etmesine yardımcı olmadaki rolü açıklanacaktır. Bu projelerin mevzuat ve çalışmalarını düzenleyen ve destekleyen kanunlar yoluyla korunması amacıyla Maliye Bakanlığı ve Irak Merkez Bankası tarafından temsil edilmekte ve bankaların bu projeleri destekleme ve finanse etmede karşılaştıkları zorluk ve zorluklara atıfta bulunmaktadır. Araştırma, Çalışma ve Sosyal İşler Bakanlığı'nın kurumlarından biri olan üretken iş kuluçkaları tarafından temsil edilen küçük projelerin desteklenmesinde devlet kurumlarının rolü ile ilgilidir. Araştırma, bu kurumun konseptini, yönetmeliklerini, Irak'taki küçük projeleri desteklemek için faaliyet gösterdiği kanunu ve karşılaştığı zorluk ve engelleri ele alıyor. Araştırma, sürdürülebilir kalkınma kavramını, İslam hukukuna göre sürdürülebilir kalkınma stratejisinin ne olduğunu, onu etkileyen faktörleri, onu ölçmek için göstergelerin neler olduğunu, küçük projelerin başarıları ile ilişkisini ve bu projelerin etkisi konularını ele alacaktır. Sosyal ve ekonomik kalkınmada. Daha önceki çalışmalara gelince, diğer Arap ve yabancı ülkelerdeki araştırma konusunu ve problemini ele alan kitaplar, doktora tezleri, yüksek lisans tezleri, hukuk metinleri, internet üzerinden yapılan raporlar, istatistiki veriler, formlar gibi kaynaklar mevcuttu. Araştırmada kullanılmak. Araştırmada, aşağıdaki sorulara cevap verebilmek için araştırma hipotezine ne ölçüde ulaşıldığını göstermek için anlatı analizi yöntemi kullanılmıştır: 1- Sürdürülebilir kalkınma ile ne kastedilmektedir? ve boyutları nedir? 2- İslami bakış açısına göre sürdürülebilir kalkınma kavramı nedir? 3- Sürdürülebilir kalkınmayı sağlamak için küçük projelerin karşılaştığı zorluklar ve engeller nelerdir? 4- Genel olarak finansmanın ve özel olarak İslami finansmanın sürdürülebilir kalkınmanın sağlanmasına etkisi nedir? Allah'tan bize yardım etmesini niyaz ederiz, hamd alemlerin Rabbi Allah'a"
