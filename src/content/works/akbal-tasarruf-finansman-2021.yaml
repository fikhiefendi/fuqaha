abstract: "Tasarruf finansman sistemi, katılım bankacılığı yanı sıra uzun zamandır Türkiye'de ve dünyada uygulanagelmiş bir sistemdir. Sistemin ekonomik ve sosyal anlamda düzgün ve sorunsuz işlemesi için farklı çalışmaların yapıldığı görülmektedir. Ülke ekonomisi için oldukça büyük önem arz eden bu tarz sistemler için tasarruf finansman sisteminin, yatırımcılarının rahatlıkla yatırım ve tasarruflarını yönlendirebileceği bir argüman olabilmesi için, Türkiye açısından da ele alındığında bir mevzuat eksikliği görülmüş ve devletin teminatı altında çalışması sağlanacak bir sistem haline getirilmesi için çalışılmıştır. Nihayet çıkan kanunlar, yönetmelikler, böyle bir yatırım ve tasarrufun değerlendirilmesi için oldukça pozitif katkıları içerdiği görülmektedir. Bu çalışmada, tasarruf finansman sistemine ilişkin bir literatür taraması yapılmış ve detaylı sistem analizi ile bir değerlendirilmeye gidilmiştir. Veriler ikincil veri olarak resmi kaynaklardan temin edilmiştir. Bilhassa Türkiye'de çıkartılan son kanun ve ilgili yönetmeliklerin sahada yatırımcı tasarruf sahipleri açısından güçlü, zayıf yönleri ele alınmış, sistemin işleyişi açısından fırsat ve tehditlerin neler olabileceği üzerine değerlendirmeler yapılmıştır. Bu çalışma alanında Türkiye üzerine oldukça az sayıda akademik çalışma yapılmış olması ve kanun ve yönetmeliklerin tarihlerinin oldukça yeni olması ve değerlendirmenin ilgili normları kapsıyor olması açısından özgün bir çalışmadır. Çalışma dünyada farklı ülkelerde gerçekleştirilen uygulama örneklerini de kapsamaktadır. Çalışmanın sonucunda elde edilen çıkarımlara göre, kanuni yaptırımların Tasarruf finansman şirketlerinin sürdürülebilir bir ekonomik modellemesini amaçladığı çıkarımları yapılmış, Türkiye açısından da sistemin daha da geliştirilmesi için birtakım önerilerinde bulunulmuştur. Yine bu çalışma, akademik anlamda da gelecek yayınların, sistemin nasıl daha etkin bir şekilde işleyeceği üzerine çalışmaları içermesi önerilmektedir."
