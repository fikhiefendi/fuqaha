abstract: "Yedi fakih anlamına gelen \"el-fukahâü's-seb'a\" kavramı, Medineli yedi tâbiûn fakihini ifade etmek için kullanılmaktadır. Henüz pek çok sahâbînin hayatta olduğu bir dönemde, Medine gibi sahâbe nüfusu yoğun bir şehirde yaşayan bu âlimler, Medine'nin bu ayrıcalıklı konumu sayesinde birçok sahâbî ile görüşme fırsatı elde etmiş, özellikle Zeyd b. Sâbit, İbn Ömer, Hz. Âişe, Ebû Hureyre, İbn Abbas gibi Medine ilim geleneğinin oluşumunu etkileyen önemli sahâbîlerden ilim almıştır. Fukahâ-i Seb'a, sahâbe hocalarından aldığı ilmî birikimin sonraki nesillere ulaştırılması, özellikle sünnetin, amelin, sahâbe icmâının, sahâbî kavlinin ve sahâbe ihtilafının tespiti ve aktarımı noktasında önemli roller oynamıştır. Bununla birlikte, tevârüs ettikleri ilmî birikimi kendi katkılarıyla da geliştirmişler, dönemlerindeki fıkhî faaliyetlerin yürütülmesine öncülük edip halkın fetva ihtiyacını karşılamışlardır. İçlerinden birçoğu, Ömer b. Abdülaziz'in Medine valiliği sırasında (87-93/706-712) kurduğu on kişiden müteşekkil danışma meclisinde yer almıştır. Medine'deki ilmî birikimin aktarımı ve gelişimi noktasında önemli bir halkayı teşkil eden Fukahâ-i Seb'a'dan iki kuşak sonra gelen İmam Mâlik ise, Medine ilim geleneğinin mezhep haline gelmesini sağlamıştır. Bu çalışmada Fukahâ-i Seb'a'nın hayatı ve ilmî kişiliği ele alınmış, fıkhî görüşleri analiz edilmiş ve İmam Mâlik üzerindeki etkileri incelenmiştir."
