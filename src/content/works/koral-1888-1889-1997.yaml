abstract: "Arşivler bir toplumun millî tarih ve kültürünün gerçek kaynağıdır. Bir milletin tarihiyle irtibatını ve devamlılığını sağlayan temel müesseselerden birinin arşivler olduğunda şüphe yoktur. Arşivler sadece tarih ilminin değil tüm sosyal bilim dallarının da ana kaynağıdır. Osmanlı adlî teşkilâtının en önemli organı olan mahkemelerin (dolayısıyla kadıların) kayıt altına aldıkları bütün insanlarla ilgili olayları ve bu olayları ilgilendiren mahkeme kararlarım ihtiva eden şer 'iye sicilleri bir belde halkının birbirleriyle olan hukukî, iktisadî, sosyal, dinî ve ticarî münasebetlerini en güzel bir biçimde ortaya koyan belgelerdir. Osmanlı topraklarında yaşayan hemen her tebâ'nın evlenme, boşanma miras, vasiyet, vekâlet, kefalet, alışveriş ve ortaklık gibi işlemlerin sicillerde yer alması, Osmanlı toplumunun siyasî, sosyal, iktisadî ve dini hayatını çok etkili bir şekilde sicillerden takip etme imkanı vermektedir. 19. yüzyılda Osmanlı toplumunun içinde bulunduğu sosyal, hukukî ve ekonomik şartla-u n öğrenmeye yönelik bir katkı sağlaması amacıyla yapılan bu çalışmada geçen yüzyılda İstanbul hayatının sosyal ve hukukî yönü ele alınmaya çalışılmıştır. Bu gayeyi gerçekleştirme yönünde 1888-1889 tarihlerine ait olan 1 Numaralı İstanbul Mahkemesi 265 numaralı kadı sicili esas alınmıştır. Bu dönemde yaşayan İstanbul insanının sosyal ve hukukî hayatı büyük oranda tüm. Osmanlı insanının hayat tarzının da bir göstergesidir. Çalışmamız esnasında tam transkripsiyon metodu uygulanmıştır. Orjinal kadı defteri 'i metni latinize edildikten sonra 'dönemin sosyal ve hukukî yaşantısına dair veri teşkil i? r: eden hususlar ayrı ayrı konular halinde değerlendirilmiştir. Ayrıca diğer temel kaynaklardan da yararlanma yoluna gidilmiştir. ?, Bu tez çalışması ile geçen yüzyılda, İstanbul'da yaşayan. Osmanlı insanının hayatında önemli bir yeri olan sosyal, ekonomik ve hukukî bir takım müesseselerin mahiyeti, fonksiyonları ve uygulanma biçimleri ortaya çıkarılmaya çalışılmıştır. Toplumsal hayatta çok önemli bir yeri olan vakıf müessesesi, iktisadî ve ticari hayatta büyük etkileri olan gedik sistemi ve vekalet, kefalet, ortaklık ve alışveriş gibi ticarî uygulamalar, sosyal hayatın önemli bir parçası olan evlenme, boşanma, mehir, nafaka ve vasiyet gibi hukukî-dinî uygulamalar konusunda kayda değer sonuçlar elde edilmiştir. Vİ"
