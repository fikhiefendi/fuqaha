abstract: "Canlılar aleminde bulunan varlıklar, yaşamlarını idame etmek için ekseriyetle bir çaba içerisindedirler. Küçük bir canlı olarak karınca, rızkı için bir çaba sarf ettiği gibi, şuur ve irade sahibi olan insan ve cinler de rızıklarının peşinde koşup çabalamaktadırlar. Kesb olarak niteleyebileceğimiz bu hususta akıl ve irade sahibi olarak insan ve cinler diğer varlıklardan ayrılmaktadır. Kur'an'da birçok ayette, insan ve kesb ilişkisine değinilmektedir. Nitekim bu konu ilmî bazı araştırmalarda irdelenmiştir. Diğer taraftan kesb kavramı kelam, fıkıh, hadis ve tasavvuf ilimleri açısından da incelenmeye tabi tutulmuştur. Bu kavram kelam ilminin literatüründe genellikle ihtiyarî fiillerin yaratılması ekseninde incelenmiştir. Kur'ân'a göre kesb dünya ve ahiret hayatını şekillendiren önemli bir unsurdur. Ferdi ve ictimaî açıdan mühim bir yere sahip olan kesbin muhtelif çalışmalara ilham olacağı tartışmasızdır. Üç bölümden müteşekkil olan bu çalışmanın birinci bölümünde kesb kavramı etimolojik açıdan etraflıca irdelenmektedir. İkinci bölümde ise kesb konusu Kelam başta olmak üzere İslami bazı ilimler bağlamında incelenmektedir. Üçüncü bölümde ise kavramsal ve mahiyet itibariyle Kur'ânî perspektiften kesb konusuna yer verilmektedir. Ayrıca bu bölümde kesb kavramıyla anlam yakınlığı bulunan Aml, Kedh, Ribh ve Gına kavramlarına yer verildi."
