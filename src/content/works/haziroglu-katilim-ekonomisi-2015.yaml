abstract: "Modern iktisadi anlayış, insanın ve âlemin yaratılışına aykırı bir biçimde, kaynakları kıt ihtiyaçları sınırsız gören bir ekonomik sistem ortaya koymuştur. Bu ekonomik sistem de insanı ve toplumu yaratılış hikmetinden uzaklaştırmakta ve acizleştirmektedir. Bu durumun böyle olmasının en temel sebebi, ekonomi temel alınarak toplumun, hukukun, insanın ve ahlakın tanımlanması, meydana getirilmesidir. İnsanı bir kaynak, dünyayı da elde edilmesi, üzerinde tahakküm kurulması gereken bir mülk olarak gören bu anlayışın değişmesi insanlığın kurtuluşu için zaruridir. Bu çalışma, ahlakı en derin manasıyla, yaratılışa uygunluk olarak temel alan, insanı, toplumu, hukuku ve ekonomik sistemi de bu çerçevede tanımlayan, kuran ve sürdüren bir teorik çerçeve sunmaktadır. Sonrasında ise ahlak merkezinde oluşturulan bu iktisadi anlayışın ekonomik uygulaması olarak 'Katılım Ekonomisi'ni önermekte, bu ekonomik modelin sağlayacağı olumlu yanları tartışmaktadır. Özetle makalenin temel iddiası, ahlaka en uygun din olan İslam'ın iktisadi anlayışı çerçevesinde kurulacak olan 'Katılım Ekonomisi'nin insanlığın kurtuluşu için önemli bir çözüm olacağıdır."
