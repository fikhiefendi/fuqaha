abstract: "Bu çalışma, farklı ülkelerden 14 Şer'i Kurulu üyesiyle gerçekleştirilen mülakatlara dayanarak, İslami finans alanında standartların belirlenmesi sürecinde karşılaşılan zorlukları incelemektedir. Bu zorlukların araştırılması amacıyla beş hipotez oluşturulmuş ve bu hipotezleri test etmek üzere nitel araştırma yöntemi benimsenmiştir. Mülakat yapılan kişilerin ortak özelliği, İslami bankacılık sistemleri denetiminde görev alarak, işlemlerin İslam hukukuna uygunluğunu denetleyen ve değerlendiren uzmanlardır. Araştırma kapsamında yarı yapılandırılmış mülakatlar gerçekleştirilmiş ve her biri hipotezleri kapsayan toplam sekiz soru yöneltilmiştir. Sorular, İslami finans standartların oluşumuna etki eden iç ve dış faktörleri analiz etmeye yöneliktir. Bu kapsamda hükümet politikaları, kültürel farklılıklar ve fıkhi yorum çeşitliliği gibi temel etkenler incelenmiştir. Araştırma bulguları, uzmanların karşılaştığı sorunları ortaya koyarak, İslami finans standartların daha etkili bir şekilde geliştirilmesine katkı sunmayı amaçlamaktadır."
