abstract: "Murabaha kavramı genel olarak; banka ve müşterileri arasında, malın geliş fiyatına sonradan ekleme yapma üzerine kurulan sözleşmeler ile ilgilidir ve bugün katılım bankalarında“Satın Alma Emriyle Murabaha”şeklinde uygulanmaktadır. Murabaha; peşin olarak alım yapmak için yeterli parası olmayan ama bir ürün satın almak isteyen bir kişinin, katılım bankasına gitmesi ile başlamaktadır. Bu durumda banka, anlaşılan ürünü peşin olarak satın alır ve müşterisine daha yüksek ama vadeli bir fiyat üzerinden satar. Murabaha, ekonominin gelişimine, katılım bankasının finansal büyümesine, uygulama kolaylığına ve risklerin azaltılmasına katkıda bulunması nedeniyle uygulamadaki en önemli yöntemlerden birisidir. Murabahanın payının, katılım bankalarının toplam finansmanının yaklaşık %70'ını oluşturmakta olduğu gözlemlenmiştir. Bu araştırmada; katılım bankalarında uygulanan murabaha yöntemi ve bu yöntemin bankaların finansal gelişimi üzerindeki etkileri tartışılmıştır. Murabahanın etkisini ölçmek için katılım bankalarının yaklaşık olarak son on yıllık mali (finansal) tabloları kullanılmıştır. Aynı zamanda murabahanın Afrika, Asya ve Avrupa'daki katılım bankalarının finansal büyümesini artırmadaki rolüne odaklanılmıştır. Çalışmada, katılım bankalarının daha çok murabaha yöntemini tercih ettikleri sonucuna ulaşılmıştır. Bunun sebebi, murabahanın uygulama ve takibinin kolay olması, kârının sabit ve diğer yöntemlere kıyasla risklerinin az olmasıdır. Ayrıca murabaha, gerekli likiditenin sağlanmasına yardımcı olduğu için müşteriler tarafından da tercih edilmektedir. Murabaha ile ilgili en yaygın hatalar katılım bankalarının çalışanları tarafından yapılmaktadır. Çünkü banka personeli, İslami finansal işlemler konusunda yeterli deneyime sahip değildir ve katılım bankaları, bankacılık sektöründe İslami finansman formüllerinin nasıl uygulanacağı konusunda personele üst düzey eğitim kursları yeterince vermemektedirler."
