abstract: "Osmanlı Devleti'nin, Tanzimat Devri'ndeki en önemli isimlerinden biri olan Ahmed Cevdet Paşa, bu dönemde devlet, toplum ve hukuk açısından ortaya çıkan ikilemlerin aşılması noktasında önemli bir role sahiptir. Fıkıh tahsili ve siyasi tecrübesi sayesinde, bir yandan Osmanlı birikimini koruyup diğer taraftan dönemin gerektirdiği yenilikleri yapabilmesi büyük ölçüde mümkün olmuştur. Kendisinin öncülüğünde hazırlanan ve Osmanlı Devleti'nde fıkıh alanındaki ilk kanunlaştırma olan“Mecelle-i Ahkâm-ı Adliye”isimli medeni kanun, bu açıdan en mühim misaldir. Cevdet Paşa, Mecelle'yi devletin temel kanunu olarak gördüğünden, Batılı anayasaların etkisiyle hazırlanacak ve devletin temel kanunu olacak Kānûn-ı Esâsî'ye karşı çıkmıştır. Söz konusu hususun ele alındığı ve 'Giriş' kısmının ilk bölüm olduğu bu tez çalışmasının ikinci bölümünde, Ahmed Cevdet Paşa'nın fikri alt yapısını anlayabilmek adına, onun hayatı, eğitimi ve devlet hizmetindeki görevlerine yer verilmiştir. Çalışmanın üçüncü bölümünde, Cevdet Paşa'nın devlet ve hukuk kavramlarına bakışı incelenmiş; bunun yanı sıra hukuka dair düşünceleri noktasında, Von Savigny'nin örf-âdete dayanan tarihsel bakış açısıyla benzer ve farklı yönleri ele alınmıştır. Çalışmanın dördüncü bölümündeyse; Ahmed Cevdet Paşa'nın anayasa kavramına dair düşünceleri ele alınmış; bu noktada, Fransız İhtilali ile ortaya çıkan anayasallaşma hareketindense, İngiltere'deki gibi örf-âdete istinaden zaman içerisinde oluşan yazısız anayasa fikrini daha doğru bulduğuna değinilmiştir. Ayrıca Osmanlı Devleti'ne yazılı anayasa kavramını ilk defa getiren Yeni Osmanlıların bu konudaki düşünceleri kısaca açıklanmış ve meşrutiyet kavramı da dikkate alınarak Cevdet Paşa'nın anayasa görüşüyle karşılaştırılmaya çalışılmıştır."
