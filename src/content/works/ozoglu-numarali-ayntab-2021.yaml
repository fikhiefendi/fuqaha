abstract: "Osmanlı Devleti'nde Şer'i Mahkemelerde kadılar tarafından tutulan Şer'iyye Sicilleri şehir tarihçiliği açısından birinci elden kaynaklardır. Şer'iyye Sicilleri yazıldığı dönemin sosyo-kültürel yapısı, ekonomi, siyasi ve idari yapısını ihtiva eden belgelerdir. Ayntâb 12 numaralı Şer'iyye Sicilinin tamamı 397 sayfa olup, ilgili sicilin 303-397 sayfa aralığı çalışılmıştır. Sicilde evlilik, boşanma, nafaka, miras, alım-satım davalarının yanı sıra, merkezden gönderilen ferman, berat, tezkire, mektub ve hüccet gibi resmî belgeler de kaydedilmiştir. Bu belgeler vasıtasıyla XVII. Yüzyılın başlarında Ayntâb'ın sosyo-kültürel, toplumsal, ekonomik ve idari durumu değerlendirilmiştir."
