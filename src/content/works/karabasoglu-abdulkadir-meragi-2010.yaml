abstract: "Klasik Türk Mûsikîsi teorisine dâir Abdülk?dir-i Merâgî'nin yazdığı Mak?sidu'l-elhân'ın müzikoloji alanında önemli bir yeri vardır. Bu eser, yazıldığı dönemin mûsikî anlayışını açıklamalarının yanında târihsel olaylarına, meşhur mûsikîşinas ve icrâcılarına, onların eserlerine, günümüzde kullanılan ya da kullanılmayan o dönemin çalgılarına dâir bilgiler ihtivâ etmesi bakımından, mûsikî târihi ve nazariyâtı araştırmacıları için oldukça mühimdir.Çalışmamızda müellifin yaşadığı döneme kadar yapılan mûsikî çalışmalarından sonra hayâtına, eserlerine ve yaşadığı yüzyılda yapılan mûsikî çalışmalarına dâir bilgiler yer almaktadır. Mak?sidu'l-elhân'da açıklanan ses sistemi ve îk? devirlerinin incelenmesi ile çalgılara dâir yapılan tespitlerden sonra eserin Türkçeye tercümesi, ek olarak da eserin metni verilmiştir.Eserde müellifin bahsettiği dörtlü ve beşlilerin sesleri, aralıkları, sayısal değerleri, meşhur mak?m devirleri, âvâze ve şu`beler gibi melodik yapılar günümüz notasına aktarılmıştır. O dönemde kullanılan çalgıların isimleri, bunların şekil ve yapılarıyla birlikte akort biçimlerine dâir bilgiler, meşhur mûsikîşinâslar, mûsikî icrâsında riayet edilmesi gereken husûslar ve hânendelik sanatının incelikleri de ayrı bölümlerde açıklanmıştır. Merâgî'nin îcat ettiği tel boyundan belli oranların peş peşe çıkarılmasına dayanan tarh metodu, müzik felsefesi, psikolojisi, mistisizmi gibi konulara dair görüşleri de ayrı bir bölüm olarak inceleme kısmında verilmiştir.Merâgî, diğer mûsikî nazariyâtçılarından farklı olarak bâzı özgün metodlar ortaya koymakla birlikte, Safiyyüddin'in sistemindeki unsurları detaylı bir şekilde tedkik edip sorunlu gördüğü bâzı husûsları tashih eden, kendisinin geliştirdiği bâzı yöntemlerle teyit ederek aksi görüşte olan diğer mûsikî nazariyâtçılarına karşı sıkı bir tâkipçisidir. Klasik Türk mûsikîsinde, dönemin sultanlarına ithaf edilecek kadar önemli bir yere sâhip olan Abdülk?dir-i Merâgî'nin Mak?sidu'l-elhân'ının, günümüze kadar değerini koruyan önemli bir telif olduğu düşüncesi teyit edilmiştir."
