abstract: "Hanefi mezhebi Hz. Ömer zamanında kurulan Kufe de Abdullah İbn Mesʻûd gibi büyük sahabîlerin temelini attığı bir bir medresenin ürünüdür. Hz. Peygamberden gelen ilim, Abdullah b. Mesʻud dan Alkame b. Kays, İbrahim en-Nehaî, Hammad b. Ebî Süleyman gibi büyük âlimler kanalıyla Ebû Hanîfe'ye ulaşmış ve onun kurmuş olduğu istişareye dayalı ilim meclislerinde sistematik bir hâle getirilerek sonraki nesillere aktarılmıştır. Ebû Hanîfe ve talebelerinden ders okuyanlar dünyanın farklı bölgelerine Hanefi mezhebini taşımışlardır. Bu bölgelerin en önemlilerinden birisi de Maverâünnehir bölgesidir. Seyhun ve Ceyhun nehirleri arasında kalan bu bölge, tarihi süreçte göç yolları üzerinde bulunması, sulak ve verimli arazileri sebebiyle her dönemde rağbet edilen bir merkez olmuştur. Hz. Ömer zamanında Seyhun nehri sınırlarına ulaşan Müslümanlar Kuteybe b. Müslim eliyle Maverâünnehir'in fethini tamamlamışlardır. Ebu Hafs el-Kebîr ve Süleyman el-Cüzcânî gibi fakihler de Hanefî fıkhını Maverâünnehir bölgesine taşımışlardır. Bağdat ve Basra'da zuhur eden Muʻtezile baskısı ve çeşitli nedenlerle zamanla Hanefî mezhebinin ağırlık merkezi bu bölgeye kaymış hem usûl hem de füru alanında çok değerli eserler te'lîf edilmiştir. Aynı zamanda Ehlisünnet imamlarından birisi olan İmâm-ı Mâtürîdî de bu bölgede yetişmiştir. Zamanla Maveraünnehir bölgesi âlimleri ile Iraklı âlimler arasında kelâm, usûl ve füru düşüncesinde farklı bakış açıları ortaya çıkmıştır. Biz bu çalışmamızda mezhebin aslî kaynaklarından istifade ederek usûl ve füru alanında iki ekol arasındaki farkları ortaya koymaya gayret ettik. Üç bölüme ayırdığımız çalışmanın ilk bölümünde tarihi süreçte Hanefi mezhebinin oluşum sürecini ele aldık. İkinci bölümde ise Mâverâünnehir bölgesini ve Hanefî mezhebinin oraya intikâlini ele aldık. Üçüncü bölümde ise her iki bölgede yaşayan âlimler arasında usûl ve füru konularındaki ihtilâfları değerlendirmeye çalıştık. Usûl alanındaki ihtilaflar için Irak ekolünü temsilen Cessas'ın el-Fusûl fi'l-Usûl isimli eserini temel alırken Maverâünnehir ekolünü temsilen de Pezdevi'nin Kenzü'l-Vusûl ilâ Maʻrifeti'l-Usûl isimli eserini temel aldık. Kanaatimizce usûl alanındaki farklılıklar mezhebin genel içtihat ilkeleri içerisinde asıldan tamamen farklılaşmayı gerektirmeyen meseleler olarak karşımıza çıkmaktadır. İmam Ebû Hanife'den ve ilk nesil talebelerinden bize ulaşan bir usûl eserinin olmaması ve mezhebin usûlünün fürû meselelerden istinbât yolu ile elde edilmiş olması bazı konularda farklı bakış açılarını kaçınılmaz kılmıştır. Aslında pek çok konuda ihtilafın neticede lafzî olduğu anlaşılmaktadır. Füru alanındaki ihtilafların ise daha çok örf, kültür, coğrafî koşullar gibi farklı etkenlere dayalı olarak ortaya çıktığı anlaşılmaktadır. Anahtar Kelimeler: İslam Hukuku, Hanefi Fıkhı, Ebu Hanife, Usulü Fıkıh, Mâverâünnehir, Bağdat, Irak, Semerkant, Buhârâ."
