abstract: "Tasarruf finansman sistemi Avrupa kökenli olup, dünyada farklı isimlendirmeler adı altında uzun yıllardır uygulanan alternatif bir finansman sistemidir. Sistem, varlık finansmanı temelli olup özelliği finansman kullandırılmasının katılımcının belirli bir süre tasarruf etme şartına bağlı olmasıdır. Sistemi Türkiye'de uygulayan ilk şirketlerin geçmişi 1990'lı yılların başına rastlamakta olup, dünyadaki örneklerinden farklı olarak faizsiz finansman prensibini benimsemiş olmaları nedeniyle şirketleri İslami Finans Kuruluşu olarak değerlendiren görüşler mevcuttur. Şirketler 2021 yılına kadar elbirliği, tasarrufa dayalı finans vb. adlar altında finansal kuruluşların tabi oldukları mevzuata tabi olmadan genel hükümler çerçevesinde faaliyet göstermiştir. 2021 yılında 7292 sayılı kanunla sektöre ilişkin yasal düzenleme yapılmış, sistemi uygulayan şirketler tasarruf finansman şirketi unvanı altında finansal kuruluş olarak düzenlenerek 6361 sayılı Kanun kapsamına alınmış, faaliyetlerinin yasal çerçevesi çizilmiş ve BDDK'nın denetim ve gözetimine tabi kılınmışlardır. Çalışmanın amacı, yasal düzenleme ile birlikte finansal kuruluş olarak düzenlenen tasarruf finansman şirketlerinin Türk vergi mevzuatı karşısındaki durumunu, yasal düzenlemelerin şirketlerin mali yükümlülüklerinde meydana getirdiği değişiklikler ile oluşan sorun ve belirsizlikleri araştırarak çözüm önerileri sunmaktadır. Sistemin özgünlüğü dikkate alınarak çalışmanın ilk bölümünde tasarruf finansman sisteminin kökenleri, dünyadaki ve Türkiye'deki uygulamaları araştırılmıştır. İkinci bölümde şirketlerin tabi oldukları vergi mevzuatı araştırılarak yasal düzenleme sonrası meydana gelen değişiklikler, üçüncü bölümde bağımsız denetçi raporlarından da istifade edilmek suretiyle şirketlerin vergilendirilmesinde önem arz eden hususlar ele alınmıştır. Dördüncü bölümde ise 2021 yılında yapılan yasal düzenlemelerin şirketlerin mali yükümlülüklerinde oluşturduğu sorun ve belirsizlikler araştırılmıştır. Çalışmanın sonuç bölümünde şirketlerin mali yükümlülüklerine ilişkin değerlendirme yapılarak yasal düzenlemelerin oluşturduğu sorun ve belirsizliklere yönelik çözüm önerilerinde bulunulmuştur."
