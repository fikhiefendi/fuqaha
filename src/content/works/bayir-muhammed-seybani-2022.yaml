abstract: "“Muhammed eş-Şeybânî'nin el-Hücce Adlı Eserinde Maliki Mezhebine Atfedilen Görüşlerin Tahkiki (İbadetler Bölümü Örneği)”isimli bu tezde İmam Muhammed eş-Şeybânî'nin Maliki mezhebine yönelttiği atıflar değerlendirilmiştir. Tez, giriş, iki bölüm ve sonuç bölümlerinden oluşmaktadır. Giriş bölümünde konunun önemi, amacı, yöntemi, kaynakları ve sınırları belirtilmiştir. Birinci bölümde İmam Muhammed'in hayatı anlatılmış ve tezin konusu olarak ele alınan eserin özellikleri anlatılmıştır. İkinci bölümde el-Hücce adlı eserinin İbadetler bölümünde Maliki Mezhebine yöneltilen atıflar değerlendirilerek araştırmanın asıl bölümü yazılmıştır. Bu bölümde temizlik, namaz, oruç, zekât ve hac konuları ile ilgili atıfların isabetli olup olmadıkları ile tartışılmıştır. Sonuç bölümünde yapılan atıfların isabet ve isabetsizlik oranları tespit edilerek bir oran elde edilmiştir."
