abstract: "Bu çalışma, Yemen'de işsizliğin azaltılmasına yönelik küçük ve mikro ölçekli projelerde İslami finansın rolü: analitik bir çalışma (2000-2022) bilmeyi ve tartışmayı amaçlamaktadır. Bu projelerin İyi Kredi (AlQard AlHasan), Ticari Spekülasyon (Mudaraba), çiftçilik ve işsiz gençlerin katılımı yoluyla İslami olarak finanse edilmesi, ülkelerin çöküşünün en tehlikeli faktörlerinden biri olarak kabul edilen işsizliğin azaltılmasına nasıl katkıda bulunabilir. Bu çalışmada, Yemen'deki duruma benzer şekilde Yemen'de ve diğer ülkelerde tarımla ilgilenen araştırmacıların ve tarımla ilgilenenlerin yazdıklarının okunup gözden geçirilmesi, Yemen'i vuran işsizlik olgusunun tehlikesi anlatılması ve bu durumun boyutunun gösterilmesi şeklinde betimleyici bir yaklaşım kullanılmıştır. Küçük tarım projelerinin işsizliğin azaltılmasına ne ölçüde katkıda bulunduğunu ölçen doğru istatistikler üretmek amacıyla sonuçları Dünya Bankası'nın ve diğer web sitelerden izlenecek değişkenlerin rolünün ölçülmesi ve ardından bu verilerin analiz edilmesi amacıyla istatistiksel ve analitik yaklaşım da kullanıldı. bilimsel araştırma ilkelerine göre, küçük ve mikro tarım projeleri İslami finansmanın Yemen'deki işsizliği azaltma rolü gerçekçi bir bilimsel sonuç elde ederek, belirlendi."
