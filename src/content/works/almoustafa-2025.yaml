abstract: "Bu araştırmada,“İşlerin hükmü maksatlarına göredir (الأمور بمقاصدها)”ilkesi ve bunun günümüzdeki bazı meselelerdeki fıkhî hükümlere olan etkisi ele alınmaktadır. Bunu, zamanın bütün modern alanlarda hızla değişmesi karşısında, ortaya yeni meseleler çıkması ve dolayısıyla bunlarla başa çıkarken şeriatın amaçlarının da göz önünde bulundurulması gerektiği ilkesi zorunlu hale getirmiştir. Çalışmanın önemi, adı geçen ilkenin yerini ortaya koymada ve güncel meselelerde aldığı aktif rolün belirlenmesinde kendisini göstermektedir. Araştırma aynı zamanda ilgili kaidenin temellendirilmesini, analizini ve fıkhî kaidelerin kök hücre ve Youtube ile Tiktok gibi sosyal medya platformları gibi güncel meselelerdeki etkisini ortaya koymayı da hedeflemektedir. Araştırmanın problemi ise, son dönemlerde ciddi biçimde artan ve farklılaşan güncel fıkhî meseleler ile bu meselelerde açıklanmaya ihtiyaç duyulan yerleri açıklamak ve“İşlerin hükmü maksatlarına göredir (الأمور بمقاصدها)”kaidesinin bunlar üzerindeki etkisini göstermeye odaklanmaktadır. Bu araştırmada tümevarım, karşılaştırmalı ve analiz metotlarından istifade edilmiştir. Tümevarım yöntemi konuyla ilgili metin ve görüşlerin toplanması, karşılaştırmalı yöntem konularla ilgili var olan fıkhî ihtilafların belirlenmesi ve analiz yöntemi ise ilgili kaidenin etkisinin değerlendirilmesi konusunda kullanılmıştır. Çalışmanın sonunda elde edilen sonuçlardan en önemli bazıları şöyle ifade edilebilir: Araştırmada temel olarak ele alınan kaide kök hücre nakline ilişkin konuya doğrudan etki etmektedir. Öyle ki hüküm bu işlemi yapacak olan kişinin niyetine ve maksadına bağlı olarak belirlenmektedir. Eğer amaç tedavi ve başka birinin hayatının kurtarılması ise zikredilen ilkeler ışığında meşrudur ve cevaz verilir. Ancak işlemdeki amaç sadece ticari kaygılar veya başka etik olmayan sebeplerden oluşuyor ise cevaz verilmeyip yasaklanmaktadır. Aynı zamanda çalışmada ele alınan ilgili kaide içerik üretme konusuna da doğrudan etkilemektedir. Zira üretilen içerik faydalı ise meşru kabul edilip zararlı ise yasaklanıp engellenmektedir. Son olarak bu içerik ve ilanlardan gelir elde edilmesi konusunda da yayılan ilanlar meşru değilse elde edilen gelir de yasaklanmıştır. Eğer her iki yöne de etki etmesi imkânı olan bir içerik üretilmişse, bu ve bunun ilanlarından gelir elde etmek tercih edile görüşe göre meşrudur."
