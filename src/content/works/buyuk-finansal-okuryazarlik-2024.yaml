abstract: "Bireylerin karşılaştıkları durumlara göre finansal tercihlerinin değişkenlik içerisinde olması değişen dünya ekonomisinden kaynaklanmaktadır. Bu değişiklik karşısında bireyler yeni şartlara uyum sürecindedir. Bu araştırmada, Artvin Çoruh Üniversitesinin akademik ve idari kadrolarında görev yapan personelin finansal okuryazarlık ve islami finansal okuryazarlık düzeylerinin incelenmesi amaçlanmıştır. Bunun yanında, finansal okuryazarlık ve islami finansal okuryazarlık düzeyinin katılımcıların demografik özelliklerine göre anlamlı farklılık gösterip göstermediğinin incelenmesi de hedeflenmiştir. Araştırmaya toplam 314 kişi katılım göstermiştir. Katılımcıların finansal okuryazarlık ve islami finansal okuryazarlık düzeylerini belirlemek üzere tanımlayıcı istatistiksel analiz gerçekleştirilmiştir. Katılımcıların islami finansal okuryazarlık ve finansal okuryazarlık düzeylerinin demografik özelliklerine göre anlamlı farklılık gösterip göstermediğini incelemek üzere, iki kategorili demografik değişkenler için t-testi, üç ve üzeri kategori içeren demografik değişkenler için ise ANOVA analizi kullanılmıştır.Çalışmamız sonucunda, erkeklerin islami finansal okuryazarlık ve finansal okuryazarlık düzeyinin kadınlara göre daha yüksek olduğu saptansa da kadın ve erkekler arasındaki farkın anlamlı düzeyde olmadığı görülmüştür.Evli olan katılımcıların İslami finansal okuryazarlık düzeyinin bekarlardan anlamlı şekilde yüksek olduğu tespit edilmiştir.Finansal ve İslami finansal okuryazarlık düzeyinin yaşa göre farklılaşmadığı görülmüş olmakla beraber yaştaki artışa bağlı olarak finansal ve İslami finansal okuryazarlık düzeyinde bir artış olduğu tespit edilmiştir.Gelir düzeyi 20.001-25000 arasında olanların İslami finansal okuryazarlık düzeyinin aylık geliri 30.001 ve üzerinde olanlara kıyasla anlamlı şekilde yüksek olduğu görülmüştür.Mesleki kıdeme ve ünvana göre finansal okuryazarlık ve İslami finansal okuryazarlık düzeyinde anlamlı bir farklılık olmadığı görülmüş olup, katılımcıların ünvanına göre finansal okuryazarlık düzeyinde idari personellerin İslami finansal okuryazarlık düzeyinin araştırma görevlilerine kıyasla anlamlı şekilde yüksek olduğu görülmüştür."
