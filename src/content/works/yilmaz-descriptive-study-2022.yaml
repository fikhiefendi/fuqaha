abstract: "Resmî olarak dört milyona yakın mülteci ile Türkiye, sınırları içerisinde en çok mülteci barındıran ülke olarak bilinmektedir. Toplum üzerindeki sosyal, kültürel ve -belki de en önemlisi- ekonomik etkileri bakımından bu rakam gelişmekte olan bir ülke için göz ardı edilemeyecek kadar önemlidir. Bu alanlardaki olumsuz etkilerin en aza indirilmesi için en iyi çözüm istihdam olanaklarının sunulmasıdır. Herkes gibi onların da refah, sosyal adaptasyon ve kültürel asimilasyonu yaşam standartlarına bağlıdır ve bu da doğrudan düzenli bir iş ve gelir ile ilişkilidir. 1970'lerden bu yana İslami mikrofinansın yoksullukla mücadelede bir araç olarak kullanılması tartışması devam etmektedir. Bazı araştırmacılar veya kurumlar belli dönemlerde İslami mikrofinans ürünlerini gündeme getirerek hükümetlerin kullanım önerisine sunmuşlardır. İslami mikrofinansın desteklenmesi ile ilgili çalışmalar çoğunlukla toplumun geri kalan kısmına kıyasla daha çok zorlukla karşılaşan yoksullar veya mülteciler gibi toplumun savunmasız kesimleri ile finansal engeller sebebiyle iş yaşamına entegre olamayan kadınların oranının yüksek olduğu ülkeler için yürütülmüştür. Bu tezde çok ulusluluğun olumsuz etkilerinin azaltılarak İslami mikrofinans aracılığıyla Türkiye'de mültecilerin refahının artırılması üzerine tartışılmaktadır. Tez kapsamında, mevcut sosyo-ekonomik durumun ortaya konulabilmesi için Türkiye'deki mültecilerden oluşan bir grup katılımcı ile ankete dayalı bir çalışma yürütülmüştür. Araştırma verilerinin yorumlanmasında betimleyici istatistik yöntemi kullanılmıştır. Araştıma bulguları, Türkiye'deki mültecilerin finansal kapsayıcılık süreçlerine dair problemlerinin başlıcalarının ırkçılık (yabancı olmak), dil bariyeri, diploma denkliği, çalışma izni, ücretler/maaşlar olduğunu göstermektedir."
