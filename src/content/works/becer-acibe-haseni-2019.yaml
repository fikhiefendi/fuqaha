abstract: "Bu çalışma, IX. asrın başlarında işarî tefsir literatürünün Fas'taki önemli temsilcilerinden İbn Acîbe'nin (ö.1224/1809), el-Bahru'l-Medîd adlı tefsirinde, ahkâm ayetlerinin işarî yorumunu ve bu yorumu ortaya koyarken kullandığı yöntemlerin tespit ve tahlilini içermektedir. Dört bölümden oluşan çalışmanın birinci bölümünde, Ahmed İbn Acîbe el- Hasenî'nin hayatı, ve eserleri ele alınmıştır.“Tasavvufî-İşarî Yorum Geleneği ve Bahru'l Medîd”başlığı altında, hicri II. asrın başlarından itibaren zühd ve takva hareketi sonucunda karşımıza çıkan ve ilk günden itibaren tartışılan, tasavvuf anlayışının bir ürünü olan işarî tefsirin ortaya çıkışı, meşruiyeti, kabul şartları ve işarî yoruma yönelik eleştiriler ile el-Bahru'l-Medîd'in işarî yorum geleneğindeki yeri tespit edilmeye çalışılmıştır. İkinci bölümde“Bahru'l Medîd'in Ahkâm Ayetlerine İlgisi”başlığı altında, Kur'an'da ki ahkâm ayetlerinin tespitine dair görüşler ele alınmış, Ahkâm Tefsirinde öne çıkan eserler ile ahkâm ayetlerinin tespitinde kendisinden yararlandığımız Cessas (ö.370/981) ve onun“Ahkâmu'l Kur'an”isimli tefsirine dair kısa bilgilere yer verilmiştir. Ayrıca İbn Acîbe'nin ahkâm ayetlerine yüklemiş olduğu işarî manalar tablo halinde sunulmuştur. Çalışmamızın üçüncü bölümünde, İbn Acîbe'nin ahkâmla ilgili ayetlerin işarî tefsirinde ve kavramlara yüklediği işarî manaların istişhadında izlediği yöntem tespit edilmeye çalışılmıştır. Dördüncü bölümde ise ahkâm ayetlerine ve bu ayetlerde geçen kavramlara yükledikleri manalar, bu manaların ortaya konulmasında izlenen yöntemler, yararlandıkları kaynaklar ve mezhebî görüşlerinin işarî yoruma etkisi üzerinden Bahru'l Medîd ile el-Kuşeyrî'nin (ö.465/1072) Letâifü'l-İşârât'ının karşılaştırılmasına yer verilmiştir."
