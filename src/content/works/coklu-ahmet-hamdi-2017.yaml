abstract: "Bu tezde Osmanlı Devleti'nin son dönemlerinde yaşayan ve önemli bir âlim ve devlet adamı olan Ahmed Hamdi Şirvânî'nin hayatı, ilmî kimliği ve Türkçe Muhtasar Usûl-i Fıkıh adlı eseri çerçevesinde usul görüşleri tespit edilip değerlendirilmeye çalışılmıştır. Tez, bir giriş, iki bölüm ve iki ekten oluşmaktadır. Giriş bölümünde tezin konusu, önemi, amacı ve kaynaklarından bahsedilmiştir. Birinci bölümde Ahmed Hamdi Şirvânî'nin hayatı, eserleri ve yaşadığı dönemde Osmanlı Devleti'nin genel durumu hakkında bilgi verilmiş, ikinci bölümde ise Türkçe Muhtasar Usûl-i Fıkıh adlı eserinde takip ettiği metodu tespit edilmiştir. Birinci ekte eserde geçen küllî kaideler, ikinci ekte ise Türkçe muhtasar usûl-i fıkıh'ın latinizesi verilmiştir."
