abstract: "Abdullah b. Abbâs, sâhâbîler arasında önde gelenlerden biri olarak kabul edilir. Kur'ân ve Sünnet konusunda derin bilgisi ve mükemmel açıklamaları nedeniyle Tercumânu'l-Kur'ân“Kur'ân'ın Tercümânı”olarak adlandırılır. Diğer yandan Abdullah bin Abbâs'ın mevlâsı olan İkrime, büyük tâbîîlerden biridir. Mekke'nin Fethi'nden sonra Müslüman olmuş ve ilim ve takvâsıyla tanınmıştır. Bunun sebebi, Abdullah b. Abbâs'ın Kur'ân'ın Tefsîri ve İslâm dininin anlaşılmasındaki çabasında yatar. O, Hukûk, Tefsîr ve Hadîs konularında Müslümanlar için bir referans olmuştur. Sâhâbe, imâm ve âlimler dinî meselelerde ona müracaat ederlerdi. İkrime ise zamanının önde gelen fakîh ve müctehidleri arasında yer almıştır. İkrime'nin dönemindeki âlimlerle münâsebeti onun ilmî yönden temâyüz etmesini sağlamakla kalmamış, ahkâm hadîslerinin anlaşılmasında büyük katkılar sağlamıştır. Tezimize öncelikle Abdullah b. Abbâs ve İkrime b. Abdillah el-Berberî'nin tercüme-i hâlleriye başladık. Abdullah b. Abbâs'tan İkrime'nin rivâyet etmiş olduğu Sunen-i Erbaa adıyla meşhûr olan Ebû Dâvûd (ö. 275/888), İbn Mâce (ö. 273/886) et-Tirmizî (ö. 279/892) ve en-Nesâ'nin (ö. 303/915) es-Sunen'lerinde yer verdikleri Namaz, Oruç, Hac ve Zekât ile ilgili rivâyetlerini tespit edeceğiz. Bu hadîsler, İslâm Dininin temel esaslarını ele aldığı için hem fert hem de toplum hayatına yön veren hususlardan olduğu için bu özellikle tezimize konu olarak seçilmiştir. İkrime'nin Abdullah b. Abbâs'tan rivâyet ettiği hadîslerin, hadîs imâmlarının tespitlerine göre sıhhat durumlarını da inceledik. Onun rivâyet ettiği hadîsler, şayet zayıf olarak addediliyorsa zayıflık durumlarının hangi sebepten ortaya çıktığını irdeledik ve hadîs imâmlarının bu hususta yorumlarına da yer verdik. İkrime'nin, Abdullah b. Abbâs'tan rivâyet ettiği hadîslerde zayıflık alâmetlerinden olan muallaklık, muallellik veya mursellik gibi durumlar varsa bunların da tespitini yaptık. İkrime'nin, Abdullah b. Abbâs'tan rivâyet etmiş olduğu ve Sunen-i Erbaa'da yer alan bu hadîslerin Kutub-i Sitte imâmları arasında yer alan el-Buhârî'nin (ö. 256/870) el-Câmiu'sSahîh'i ve Muslim b. el-Haccâc'ın (ö. 261/875) el-Câmiu's-Sahîh'in de yer alıp almadığını da araştırdık. Şayet bu eserlerde de aynı konularla ilgili benzer hadîsler yer alıyorsa ve bu metinler arasında farklar varsa tespit ettik. İkrime'nin, Abdullah b. Abbâs'tan rivâyet ettiği hadîsler, mursel ise bu durumda hadîs şârihlerinin İkrime'nin rivâyet ettiği bu hadîslerin mursellik durumlarıyla ilgili yorumlarını da inceledik."
