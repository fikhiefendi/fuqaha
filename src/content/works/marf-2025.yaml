abstract: "ÖZET Tezin Başlığı: ALIŞ-VERİŞ VE RİBÂ AYETLERİNİN TEFSİRİ (Fıkhî Tefsir Açısından Bir İnceleme) Tezin Yazarı : Fakhır Mohammed MARF Danışman : Prof. Dr. Naim DÖNER Anabilim Dalı: Temel İslam Bilimleri Bilim Dalı : Tefsir Bilim Dalı Kabul Tarihi : .11. 2025 Sayfa Sayısı : XI (Ön kısım) + 237(tez) Bu tez, incelenen fıkhi hükümlerin çıkarıldığı ayetleri, ayetlerin genel anlamını ve her biriyle ilişkili fıkhi ve güncel meseleleri ele almıştır. Tüm ilimler Kur'an'a dayandığı ve Kur'an ilk kaynak ve en zengin kaynak olduğu için, âlimlerin Kur'an-ı Kerim'den hüküm çıkarmaya büyük önem vermeleri kaçınılmazdı. Bu durum, Kur'an'ın konumu ve önemini göstermektedir. Âlimlerin Kur'an'a başvurma yöntemlerini ve hükümlere dair meselelerde delil getirme usullerini ortaya koymaya ihtiyacımız vardır. Bu konunun önemi, ayetlerden şer'î hükümlere en kısa yoldan ulaşmayı kolaylaştırmasında ve ümmet için ayetleri ve hükümlerini bir araya getiren özel bir kitap vasıtasıyla işleri basitleştirmesinde yatmaktadır. Bu konuyu seçmemin sebepleri arasında: Allah'ın kitabındaki hükümleri bilmeye olan bağlılık, insanlara dini ve dünyevi işlerindeki hükümleri açıklamanın büyük önemi ve çağdaş alışveriş ve faiz uygulamalarını İslam fıkhı kurallarına göre değerlendirmek yer almaktadır. Tez, bir giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş kısmı konunun önemini, seçilme nedenlerini, araştırmanın hedeflerini, çalışma planını ve metodolojisini içermektedir. Birinci bölüm“Alışveriş Ayetlerinin Tefsiri ve Hükümleri”başlığını taşımakta ve üç alt başlıktan oluşmaktadır. İkinci bölüm, Kur'an-ı Kerim'deki faiz ayetleri ve hükümlerini iki alt başlık altında incelemektedir. Son bölüm ise faiz, faiz oranı ve kâr arasındaki karşılaştırmayı ele almakta ve İslam ekonomisinde faize karşı en önemli şer'î alternatifleri üç alt başlık içinde açıklamakta, ayrıca çalışmanın en önemli sonuçlarını sunmaktadır."
