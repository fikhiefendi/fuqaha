abstract: "SOYARSLAN, Zeyneb, Tahâvî (ö.321/933) ve Cassâs (ö.371/981) Örnekliğinde İki Hanefî Ahkâm Tefsirinin Mukayesesi, Yüksek Lisans Tezi, Danışman: Prof. Dr. Ahmet Nedim SERİNSU, iv + 162 s. Bu çalışmada biri hicrî 3. yüzyılın sonları ile 4. yüzyılın başlarında yaşamış diğeri yaşamını hicrî 4. yüzyılda geçirmiş iki âlim olan Ebû Cafer et-Tahâvî ile Ebû Bekr er-Râzî el-Cassâs'ın Ahkâmu'l-Kur'ân adlı tefsirleri karşılaştırılmıştır. Bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu ve önemi, amacı ve yöntemi takdim edilmiştir. Birinci bölümde Tahâvî ve Cassâs'ın yaşadıkları ortamlar ve hayatları hakkında bilgi verilmiş ve bu bilgilerin değerlendirmeleri yapılmıştır. İkinci bölümde Tahâvî ve Cassâs'ın Ahkâmu'l-Kur'ânları mukayese edilmiştir. İkinci bölümün birinci kısmında iki tefsirin genel yöntemleri maddeler halinde sıralanarak değerlendirilmiştir. İkinci kısımda tefsirler; tefsir, hadis, fıkıh, lügat, nahiv ve tarih kaynakları açısından karşılaştırılmıştır. Üçüncü kısımda bu iki tefsir rivayet açısından incelenmiş ve Tahâvî ve Cassâs'ın tefsir ettikleri ayetleri; diğer ayetler, hadisler, sahâbe ve tâbiûn sözleri, sebeb-i nüzul, nâsih ve mensuh ilmi, kıraat farklılıkları yardımıyla nasıl açıkladıkları araştırılmıştır. Ayrıca kullandıkları senetler üzerinde durulmuştur. Dördüncü kısım olan re'y bölümünde iki tefsir hadis usulü, fıkıh ve fıkıh usulü, lügat, sarf ve nahiv yönlerinden incelenmiştir. Ardından müfessirlerin Hanefî mezhebi ve Ebû Hanîfe'ye karşı tutumları ile diğer mezhep görüşlerine karşı tutumları mukayese edilmiş ve değerlendirilmiştir."
