abstract: "Temyiz gücü, genel bir tanımla kişinin iyiyi kötüden ayırt edebilmesine imkân sağlayan yetinin adıdır. Tezimizin temel konusu, İslam hukuku açısından temyiz gücü kavramıdır. Temyiz gücü kavramı, İslam hukukunun en önemli konulardan biridir. Çünkü temyiz gücü akıl, irade, bilinç, zihin gibi psikolojik bağlantıları da bulunan bir kavramdır. Temyiz gücü, fıkıh alanında ehliyet bahsinde açıklanan bir kavram olup kişinin fiilleri açısından da önemli bir yere sahiptir. Kişinin mükellef sıfatını kazanması ve dolayısıyla bazı hak ve sorumluluklara da sahip olması, bu yetiyi elde etmiş olmasına bağlıdır. Bazı durumlar, temyiz gücünü ortadan kaldırır. Bu durumlar kişiye bazı muafiyetlerin tanınmasını sonuç verir. Söz konusu muafiyetler doğuştan olabileceği gibi sonradan da oluşabilmektedir. Çalışmamızın temel amacı, ehliyet bahsinin önemli kavramlarından biri olan temyiz gücünü bütün yönleriyle ele alabilmektir. Fakat sadece temyiz gücü değil onunla bağlantılı olan bazı kavramların da açıklanması gerekmektedir. Çünkü temyiz gücü, kendisiyle bağlantılı kavramlarla çoğu zaman karıştırılmaktadır. Bu çalışmanın ortaya konulmasında söz konusu eksikliğin doldurulması düşüncesi hâkimdir."
