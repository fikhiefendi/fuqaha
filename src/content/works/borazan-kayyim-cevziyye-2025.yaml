abstract: "Hicrî 7. asrın sonları ile 8. asrın ilk yarısında Dimaşk bölgesinde yaşamış ve kendinden sonra pek çok âlim üzerinde tesîr bırakmış olan İbn Kayyim'ın (ö. 751/1350) tarih ile ilgili yaklaşımı değerlendirilmiştir. İbn Kayyim birden çok alanda kitap telîf etmiş ve bu kitaplarıyla İslâm dünyası üzerinde önemli etkiler oluşturmuştur. Toplumun ıslahı noktasında İbn Kayyim, özellikle fıkhı aktif bir araç olarak kullanmış ve bu bağlamda önemli çalışmalar yapmıştır. Bu durum, onunla birlikte fıkıh bilgisinin sıklıkla anılmasına sebep olmuş ve ün kazanmasına katkı sağlamıştır. Ancak İbn Kayyim'in yalnızca fıkıh sahasında değil, kelâm, tasavvuf, siyer ve tıp gibi farklı disiplinlerde de eserler kaleme almış olması, onun çok yönlü bir âlim olduğunu göstermektedir. Bu açıdan, döneminin dinî, ilmî ve toplumsal meselelerine farklı açılardan çözüm sunma çabasında olduğu görülmektedir. İbn Kayyim'in fıkıh alanında temayüz etmesinde hocası İbn Teymiyye'nin katkısı inkâr edilemez. Uzun yıllar boyunca İbn Teymiyye (ö. 728/1328) ile yakın bir hoca-talebe ilişkisi olan İbn Kayyim, onun ilmî birikiminden ve metodolojisinden derinlemesine etkilenmiştir. Bu etkileşim, özellikle fıkıh sahasındaki eserlerinde kendini açıkça göstermektedir. İbn Kayyim, geniş kapsamlı fıkhî eserleri ve yenilikçi görüşleriyle tanınmasına rağmen, çok yönlü bir âlim olarak İslamî literatürün farklı disiplinlerinde de kayda değer bir yer edinmiştir. Bu disiplinlerden biri de siyer ilmidir. Siyer alanında yazdığı“Zâdü'l-Meâd”adlı eser özel bir yere sahiptir. Ancak İbn Kayyim'in siyer ilminde diğer alanlara nazaran daha az tanınmasının,“Zâdü'l-Meâd”'da siyerin, fıkıh ve hadîs gibi ilimlerle ilişkilendirilerek ele alınmasından kaynaklandığı söylenebilir. İbn Kayyim'in, siyer ve fıkıh ilimlerini birbirinden ayırmayan bir yaklaşım sergilediği; siyeri, fıkhın malzemesi ve destekleyici bir unsuru olarak değerlendirdiği görülmektedir. Bu bütüncül yaklaşımı, onun yalnızca bir alanla sınırlı kalmayıp İslamî ilimler arasında bağlantılar kurarak bilgi bütünlüğünü sağlama ve dinî meselelere geniş perspektiften çözümler ortaya koyma gayreti göstermektedir. Bu çalışmada, İbn Kayyim el-Cevziyye'nin yaşadığı dönemin ilmî ve toplumsal şartları çerçevesinde, onun hayatı ve ilmî kişiliği ele alınmıştır. İbn Kayyim'in en önemli eserlerinden biri olan“Zâdü'l-me'âd”, muhtevası, yöntemi ve kaynakları açısından ayrıntılı bir şekilde incelenmiştir. Bu çalışma, Zâdü'l-meʿâd'ın hadis, tarih, fıkıh ve tıbb-ı nebevî gibi farklı ilmi disiplinlerden yoğun biçimde yararlanılarak kaleme alındığı ortaya konulmuştur."
