abstract: "Bu tezde, Aksa Tufanı sonrası Filistin meselesine dair fıkhî fetvalar ele alınarak usûlî açıdan incelenmiştir. Araştırmacı bu konuyu, Filistin meselesinin önemi ve İslam dünyasındaki yeri sebebiyle seçmiştir. Özellikle Aksa Tufanı operasyonundan sonra çok sayıda yeni fıkhî mesele ortaya çıkmış ve bu meseleler, âlimler ve farklı fetva kurumları tarafından birçok fetva ve fıkhî beyanın verilmesini gerekli kılmıştır. Araştırmacı, bu fetvalar arasında birçok meselede ihtilaf ve farklılık bulunduğunu tespit etmiştir. Bu durum, fetvaların hangi usûllere dayandığı, ihtilafın sebepleri, siyasî, içtimaî ve medya ile ilgili şartlardan ne ölçüde etkilendikleri ve Aksa Tufanı sonrasında yaşanan hadiselerin bu hükümlere ne ölçüde tesir ettiği gibi soruların ortaya çıkmasına sebep olmuştur. Araştırmanın amacı, bu fetvaları bir araya getirmek, bu dönemde fakihlerin üzerinde durduğu önemli meseleleri tespit etmek, fetvaların dayandığı usûlî esasları tahlil etmek, aralarındaki ihtilafın sebeplerini açıklamak ve Aksa Tufanı sonrasında zaruret seviyesindeki değişimin ve ortaya çıkan olağanüstü şartların şer'î hükümlerin oluşumuna tesirini ortaya koymaktır. Araştırma dört bölümden oluşmaktadır. Birinci bölümde konunun teorik ve tarihî çerçevesi ele alınmış, temel kavramlar açıklanmış ve Filistin meselesinde fetvanın tarihî gelişimi ortaya konulmuştur. Diğer üç bölümde ise Aksa Tufanı sonrasında verilen fetvalar incelenmiştir. Bunlardan birinde Aksa Tufanı'nın meşruiyeti, ümmetin vazifesi, tehcir ve Gazze'den çıkma meselesi, Filistin halkının geri dönüş hakkı ve Filistinli gruplar arasındaki ihtilaf gibi temel meseleler ele alınmıştır. Bir diğer bölümde işgal ile ilişkilerin hükümleri incelenmiş; boykot, normalleşme, barış anlaşmaları ve işgal ile iş birliği gibi meseleler ele alınmıştır. Son bölümde ise bazı çağdaş cihadî meseleler ele alınmıştır. Araştırmanın ulaştığı sonuçlardan biri, Filistin meselesindeki fetvanın Aksa Tufanı ile başlamadığı, aksine Filistin meselesinin başlangıcına kadar uzanan uzun bir geçmişe sahip olduğudur. Ayrıca bu konudaki fetvalarda genel olarak iki temel eğilimin bulunduğu görülmüştür: Birincisi, ümmetin savunulmasına ve Filistin'in desteklenmesine önem veren hareketçi eğilim; ikincisi ise faaliyet gösterdiği ülkelerin siyasî şartlarından farklı derecelerde etkilenen resmî fetva eğilimidir. Araştırma ayrıca bu fetvaların önemli bir kısmını yönlendiren bazı usûlî esasların ve fıkhî kaidelerin bulunduğunu ortaya koymuştur. Bunların başında zaruret, vesilelerin hükümleri, makâsıdü'ş-şerîa ve fıkhî kaideleri gelmektedir. Bununla birlikte, Aksa Tufanı ve sonrasında meydana gelen hadiselerin bazı fetvalar ve fıkhî hükümler üzerinde tesirinin olduğu da tespit edilmiştir."
