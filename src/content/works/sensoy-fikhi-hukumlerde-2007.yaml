abstract: "Biz bu tezimizde, hürlerle köleler arasındaki ayrımın neler oldugunu ve bu ayırıma baglı olarak hukuki uygulamalarından örnekler vermeye çalıstık. slamiyet köleligi tamamen kaldırmamakla birlikte, onlar hakkındaki tasarrufları efendilerinin keyfi uygulamalarına da bırakmamıs ve bir ıslah müessesesi haline getirmistir. Bunun sonucunda da kölelerin tâbi oldugu genis bir hukuk mevzuatı olusmustur. Genel prensip olarak kölelerin isledigi suçlara karsı verilecek cezaların hürlerin cezalarının yarısı ile cezalandırılacagı kanaati benimsenmistir. Bu, fıkhın diger alanlarına da kıyas yapılarak uygulanmıstır. Tezimiz giris ve üç bölümden olusmaktadır. Birinci bölümde hür köle ayrımını doguran usulî ve fıkhî tartısmalar ana hatlarıyla islenmis ve ayrıca kıyas yapılması için slamiyet dısında diger sistemlerde köleligin nasıl olduguna yer verilmistir. kinci bölümde ise kölenin hukuki ehliyeti, cezai ehliyeti, sahitligi, ikrarı tasarrufları ve köle çesitleri islenmistir. Üçüncü bölümde, hür-köle ayrımının söz konusu oldugu fıkhî alanlardan ibadetler, evlilik, nesep, nafaka, miras, es sayısı, velâ, bosanma ele alındı. Cezalarda ise hür-köle ayrımının kısas, diyet ve had cezalarına olan etkisi incelenmistir."
