abstract: "Şer'iyye sicilleri; kadıların mahkemelerde vermiş oldukları kararları, merkezden gelen emir ve belgeleri, bölgelerindeki hukûkî ve önemli olayları kaydettikleri defterlerdir.Şer'iyye sicil kayıtlarından, dönemin sosyal, kültürel ve ekonomik durumunu, bölgesel tarihî olayları, devletin idârî yapısını, göç hareketlerini ve nüfus durumunu öğrenebiliriz.Son yıllarda Osmanlı Tarih Araştırmaları içerisinde, şer'î sicil çalışmalarına büyük hız verilmiştir. Araştırmacılar kendileri için Osmanlı Devleti'nde düzenli olarak tutulan kayıtların, önemini kavradıkça bu sahada daha çok çaba göstermeye başlamışlardır. Bu alanda yapılan çalışmalar sayesinde, o dönemle ilgili objektif sonuçlara ulaşma becerimiz güçlenmektedir.Hazırlamış olduğumuz bu çalışma kapsamında, Bergama şehriyle ilgili önemli bilgileri ihtiva etmesi sebebiyle toplam kırk üç adet sicil kaydının transkripsiyonlu metni verilmiş ve bu kayıtlar dînî, kültürel, sosyal ve iktisâdî açıdan değerlendirilmiştir. Ayrıca bu sicil defterinden yararlanılarak Bergama'nın XIX. yüzyıldaki idârî taksimatı ile ilgili bilgiler de verilmiştir."
