abstract: "Hanefî mezhebine göre yapılan fukahâ tasnifi İslam hukuku içerisinde önemli bir yere sahiptir. Kemalpaşazâde, Hanefî mezhebine göre fakihleri derecelendiren ilk kişidir. Daha sonra gelen çok sayıda Hanefî fakihleri ona bu konuda tabi olmuş ve bu tasnifi eserlerinde yer vermişleridir. Bununla birlikte onun tasnifine eleştirenler de olmuştur. Çalışmamızda yapılan eleştirileri tartıştık ve muhtemel cevaplar aradık. Aynı zamanda tasnifte geçen fıkhî terimleri de açıklamaya çalıştık. Tez çalışmamız bir giriş ve iki bölümden oluşmaktadır. Girişte Hanefî mezhebine göre yapılan fukahâ tasnifinin tarihçesinden, araştırmanın kaynakçasından, amaç ve yönteminden bahsedilmiştir. Birinci bölümde Kemalpaşazâde ve Kefevî gibi ona tabi olanların fukaha tasniflerine yer verdik. Ardından Dihlevî, Leknevî ve Muhammed Ebû Zehra gibi, Kemalpaşazâde'nin tasnifini eleştirenlerin alternatif tasniflerini açıkladık. Diğer mezheplere göre yapılan fukahâ tasnifleri de ele alarak, birinci bölümü tamamladık. İkinci bölümde Kemalpaşazâde'nin tasnifini eleştirenlerin tenkitleri ve onlara karşı getirdiğimiz muhtemel cevaplar ele alınmaktadır. Aynı zamanda tasnifte geçen içtihat, tahrîc, temyîz ve taklit gibi fıkhi terimlerin kastedilen manaları tartışılmıştır. Tezimiz, önerilerimizi içeren ve vardığımız neticeleri ele alan bir sonuç bölümüyle tamamlanmıştır."
