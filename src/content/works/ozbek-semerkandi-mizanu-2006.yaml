abstract: "Bu araştırmada Karahanlılar Döneminde Maveraünnehir'deyaşamış büyük Hanefi hukukçusu Semerkandû'nin hayatı ve eserlerinden olanMizanu'l-Usulündeki metodu incelenmiştir.Çalışma biri giriş olmak üzere üç ana bölümden oluşmuştur.Giriş bölümünde fıkıh usulü özetlenmiştir.Birinci bölümde Semerkandû'nin hayatı, eserleri, yaşadığıdönem, hocaları, öğrencileri ve ilmû kişiliği ele alınmıştır.kinci bölümde ise eserlerinden biri olan Mizanu'l-Usul adlıeserindeki metodu incelenmiştir."
