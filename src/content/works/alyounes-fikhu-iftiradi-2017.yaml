abstract: "Tezimizin giriş bölümünde lügatlerden ve şer'î kaynaklardan istifade edilerek; iftirâdî fıkha dair lafızlar sözlük ve ıstılah anlamlarıyla ele alındı. İftirâdî fıkıh farklı şekillerde de isimlendirilmektedir. Birinci bölümün ilk kısmında, iftirâdî fıkhın ne zaman başladığı ve hangi merhalelerden geçtiği ele alındı. Kur'ân ve sünnette yer alan iftirâdî örnekler zikredildikten sonra fıkıhçılara göre iftirâdî fıkhın oluşum süreci anlatıldı. İkinci kısmında ise fıkıh kaideleri arasında iftirâdî fıkhın yeri ve önemi üzerinde duruldu. Bunlar dört kısımda ele alınarak iftirâdî fıkhın sedd-i zerâi, sonuçlar, takdir etme ve şeriatın takdir ettikleri ile ilişkisi anlatıldı. İkinci bölümde ise fıkhın hükmü, şartları, günümüz açısından olumlu ve olumsuz yönleri ele alındı. İftirâdî fıkhın hükmü açıklanırken alimlerin görüşleri delilleriyle birlikte zikredildi. Şartları kısmında ise fıkhın şartları ve fıkıhla hangi şartlarda amel edilebileceği zikredildi. Uygulama olarak günümüz açısından olumlu ve olumsuz yönleri üzerinde durulduktan sonra iftirâdî fıkhın ortaya koyduğu müsbet ve menfî neticeleri açıklandı. Üçüncü bölümde sadece Hanefî mezhebine göre iftirâdî fıkıh uygulamalarına yer verildi. Burada örnekler fıkıh bâblarına göre tasnif edildi. Mesela taharetle ilgili konular açıklanırken Kitâbu't-tahâre konusu içerisinde ele alındı. Son bölümde ise; araştırma sonucunda ulaşılan bulgular ve tavsiyeler yer almaktadır."
