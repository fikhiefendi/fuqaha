abstract: "Bu çalışmada, Mâverdî'nin el-Ahkâmü's-Sultâniyye adlı eserinde meselelere yaklaşırken ayetleri nasıl tefsir ettiği üzerinde durulmuştur. Ayrıca araştırmamızda Mâverdî'nin söz konusu eseriyle diğer bir çalışması olan en-Nüket ve'l-ʿuyûn adlı tefsiri ve Ebû mansur el-Mâtürîdî'nin Teʾvîlâtü'l-Ḳurʾân adlı tefsiri arasında yöntem ve anlam bakımından bir karşılaştırma yapılmaya çalışılmıştır. Araştırmamızda şu sonuçlara ulaşılmıştır: el-Ahkâmü's-Sultâniyye adlı çalışmalar, genelde sultânlar tarafından kadılara yazdırılmıştır. Mâverdî'nin çalışması da bu kategoride değerlendirilmektedir. Ayrıca Mâverdî'nin el-Ahkâmü's-Sultâniyye'si bir tefsir çalışması değildir; ancak ayetler, bir fakih uslubunda ele alınmıştır. Konuyla ilgili değerlendirmelerde tefsir yöntemlerinden yararlanılmıştır. Mâverdî, gerek el-Ahkâmü's-Sultâniyye'si gerekse de en-Nüket ve'l-ʿuyûn adlı eserlerinde ayetlerin tefsirinde rivayet metodunu kullanmış, içtihad ve rey'e başvurmuştur. Ayrıca tefsir metodunda ayetler, hadisler, sahabe görüşleri ve tabiin görüşlerine de yer vermiştir. Mâtürîdîyle halifeye“Allah'ın Halifesi”kelimesinin kullanılmaması gerektiği konusunda ittifak halindedir. Her iki müfessir de halifelik makamının oluşturacağı sorunlara dirayet yoluyla yaklaşmıştır ve yer yer felsefi tahlilerde bulunmuştur. Ancak iki müfessirin sultân ve halk arasındaki iletişim konusunda yer yer ayrıldıklarına şahit olunmuştur. Konuyla ilgili detaylar çalışmanın diğer bölümlerinde verilmiştir. Araştırmamız, giriş dâhil olmak üzere üç bölümden oluşmaktadır. Giriş bölümünde araştırmamızın konusu, önemi, amaçları, yöntemi ve kaynakları üzerinde durulmuştur. Birinci bölümde ise, Mâverdî'nin hayatı, eserleri, el-Ahkâmü's-Sultâniyye'si ve en-Nüket ve'l-ʿuyûn'u ile Mâtürîdî'ye ait olan Teʾvîlâtü'l-Ḳurʾân hakkında bilgi verilmiştir. İkinci bölümde de Mâverdî'nin 108 el-Ahkâmü's-Sultâniyye adlı çalışmasında yer alan konular, onlarla ilgili ayetler ve bunların tefsirleri hakkında bilgi verilmiştir. Araştırma, çalışma boyunca elde edilen verilerin değerlendirilmesiyle son bulmuştur."
