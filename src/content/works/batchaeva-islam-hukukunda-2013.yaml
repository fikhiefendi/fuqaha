abstract: "Yetimlerin hem şahıs varlıklarının hem de mal varlıklarının Müslümanlar tarafından korunması gereken temel bir yükümlülük olduğu görülmektedir. Yetimlerin şahsiyetlerinin korunması yanında mallarının da korunması, hatta sadece korunmakla yetinilmeyip kendilerinin yararının gözetilip bununla birlikte servetlerinin de artırılması için gerekli çabanın gösterilmesinin hükme bağlanmış olması İslam?ın yetimler konusunda göstermiş olduğu hassasiyetin önemini anlamamıza yardımcı olmaktadır. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde İslam Hukuku bakımından yetim, mal ve hukuki himaye kavramları ele alınmıştır. Bu bağlamda öncelikle yetim, mal ve hukuki himaye kelimelerinin sözlük ve terim anlamları üzerinde durulmuş; mal çeşitleri ve mal üzerinde yapılan tasarruflar (akitler) hakkında konunun anlaşılmasına yönelik bilgiler verilmiş, ayrıca hukuki himaye hususu da hem şahsın himayesi hem yetim malının himayesi konuları dikkate alınarak işlenmiştir. İkinci bölümde yetimin hukuki tasarruflarının sınırlandırılması ve korunması hususu işlenmiştir. Konu iki kısımda ele alınmıştır. İlk kısımda Kur?an ve Sünnet?te yetimler ile ilgili emir ve tavsiyelere yer verilmiştir. İkinci kısımda ise velinin ve vasinin yetim ile ilgili hukuki tasarrufları işlenmiştir. Bu konu da yetimlerin şahısları ve kişilikleri ile ilgili tasarruflar ve mal varlıkları ile ilgili tasarruflar detaylandırılarak ortaya konulmuştur."
