abstract: "Sürgün cezası bir kişinin veya bir topluluğun ceza yahut güvenlik tedbiri olarak yaşadığı yerden başka bir yere belli bir süre ya da ömür boyu kalmak üzere isteği dışında gönderilmesi ve orada ikamet etmeye mecbur tutulmasıdır. Bu araştırmamızda ilk olarak İslam Ceza Hukuku kapsamında ele aldığımız“Sürgün Cezası”fıkıh sistematiğinde mezhepler arası ihtilaf konusu olmakla beraber hem had hem de tazir yönü olması açısından önemli bir cezadır. Bu ceza, hirabe ve zina haddine verilen bir ceza olup Hanefi mezhebi doktrininde ise ta'zir cezası kapsamında karşımıza çıkmaktadır. Çalışmamızda mezkûr cezayla ilgili Hanefi mezhebi incelenmekle beraber diğer mezheplerce ortaya konulan klasik fıkıh birikimi de gerektiği ölçüde incelenmiş, Hanefi mezhebinin Osmanlı'da uygulama sahası olarak kabul gördüğü gerçeği göz önünde bulundurularak cezanın pratik uygulamada nasıl bir işlev gördüğü hususuna değinilmiştir. Tarihi malzemeyle klasik fıkıh birikimini karşılaştırmayı amaçlayan bu çalışmanın başlıca kaynağı, 1840-1850 dönemleri arasında kaydedilmiş“Nefy ve Itlak Defterleri”dir. Çalışmada Osmanlı sürgün örnekleri tespit edilip klasik fıkıh kitaplarında yer alan hükümler ile aralarındaki uygunluğun derecesi ölçülmeye çalışılmıştır."
