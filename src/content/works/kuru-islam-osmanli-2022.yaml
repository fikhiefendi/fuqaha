abstract: "Bu çalışmada İslâm hukukunda cari köle azat usullerinden biri olan kitâbet akdi ele alınmıştır. Bu akit köle ve efendisi arasında kurulmaktadır. Akdin yapılması umumiyetle“efendinin kölesini kitâbete kesmesi”şeklinde ifade edilmektedir. Kitâbete kesilen köleye“mükâteb”denilmektedir. Mükâteb mal veya menfaat olabilen muayyen bir bedeli efendisine ödemeyi borçlanmaktadır. Bunun karşılığında ehliyet kısıtlılığı kalkmakta, bazı tasarruflara ehil hale gelmektedir. Ayrıca o, mülkiyet hakkına sahip olmakta, buna binaen kazandıklarına mâlik hale gelmektedir. Kararlaştırılan bedeli efendisine ödeyen mükâteb hürriyetine kavuşmakta, aksi takdirde tekrar sıradan köle olmaktadır. Dolayısıyla kitâbet akdi devam ederken mükâtebin köleliği son bulmamaktadır. Bununla beraber bazı hususlarda hür mesabesinde olmaktadır."
