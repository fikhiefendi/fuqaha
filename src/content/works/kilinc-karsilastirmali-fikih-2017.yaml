abstract: "Oruç ibadeti, önceki semavi dinlerde olduğu gibi İslam dininde de temel görevlerden birisidir. Oruç ibadeti mü'mine sabrı ve yardımlaşmayı öğretir, birlik ve beraberlik ruhunu insana aşılar. Bazı davranışlar da var ki; orucu bozar. Bu davranışlar mezheplere göre kaza veya keffâret gerektirir. Karşılaştırmalı fıkıh açısından orucu bozan ve bozmayan durumlar adlı tezimizde orucu bozan ve bozmayan şeyleri dört sünnî mezhepteki farklılıklarıyla inceledik. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde oruç ibadetinin tanımı, önemi ve tarihçesi incelenmiştir. İkinci bölümde öncelikle orucun bozulması (iftar) kavramı, sonrasında orucu bozan ve bozmayan durumlar ele alınmıştır. Üçüncü bölümde ise oruçla ilgili tartışmalı meselelere yer verilmiştir. Sonuç bölümünde de konunun genel bir değerlendirilmesi yapılmıştır."
