abstract: "Osmanlı döneminin meşhur âlimlerinden sayılan Mollâ Hüseyin b. İskender (ö. 1084/1673) fıkıh, akîde ve tecvîd ilimlerinde eserler kaleme almıştır.“Mukaddime müştemile alâ mesâili fî'l-Fıkhi ve'l-Akâidi alâ mezhebi İmâm'il-Âzam Ebî Hanîfe”adlı eseri fıkha giriş, mukaddime mahiyetinde olup, temizlik bölümüne ait meseleleri, namaz bölümüne ait konuları, bazı i'tikâdî meseleleri vd. içerir. Sözkonusu eserin Türkiye kütüphanelerinde bulunan on nüshasını inceleyerek karşılaştırdıktan sonra tercih kriterlerine göre dört nüshayı esas aldık. Edisyon kritiğini yapacağımız bu eserin ilim dünyasının istifadesine sunulması faydalı olur düşüncesiyle tahkîkinin yapılmasını istedik. Çalışma giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, araştırmanın konusu, amacı ve yararı, yöntemi ve kaynaklarına yer verilmiştir. Birinci bölümde, Mollâ Hüseyin b. İskender'in hayatı, eğitimi, hocaları, talebeleri, eserleri, ilmî kişiliği ele alınmıştır. İkinci bölümde eserin konusu, içeriği, nüshaları, bulunduğu kütüphaneler, eserde kullanılan metod ve kaynaklar hakkında bilgiler verilmiştir, ayrıca eserin tercümesi ve fıkhî değerlendirilmesi yapılmıştır. Eserin tahkîki yapılacak üçüncü bölümde ise, mevcut nüshalar karşılaştırılarak eserin asıl şeklinin ortaya çıkarılmasına çalışılmıştır. Çalışmamız sonuç ve kaynakça ile sona ermiştir."
