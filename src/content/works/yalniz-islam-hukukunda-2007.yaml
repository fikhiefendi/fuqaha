abstract: "İslam hukuk tarihine sosyolojik açıdan bakmak, slam hukukunungelişim dönemlerindeki dinamiklerinin tespitinde yardımcı olacaktır.Hukuk tarihinde sosyolojik yaklaşımın izlerine rastlamak erkendönemlerde mümkün olmakla birlikte, sistematik bir disiplin olarak hukuksosyolojisinin ortaya çıkışı için 19. yüzyılın sonlarına rastlar.Hukuk sosyolojisi başlıca üç konu ile ilgilenmektedir; hukukuntoplumsal kaynakları, değişim ve hukuk ilişkisi, hukuka ihtiyaç duyantoplumsal grupların özellikleri.Günümüzde ampirik hukuk sosyolojisi çalışmaları yanı sıra, tarihselsosyolojiye ilişkin arşiv araştırmaları da ön plana çıkmaktadır. Bu bağlamda,noterlerin eski dosyaları, hakimlerin içtihatları vb. incelenerek, hukuksosyolojisi ile ilgili bulunan olay ve konular saptanmaktadır. Bugün içingeleceğe dönük ampirik bir slam hukuk sosyolojisi çalışmasının pratikanlamı bir yana, hukuk sosyolojisi açısından fikhû içtihatların imkan nispetindeincelenebileceği görülmektedir. Elinizdeki tezde ilk müçtehitlerin dönemindekiiçtihatlarının değişime açık olup olmadığını görmek, müçtehitlerin değişimkarşısındaki tavrını tespit etmek, slam hukukunun toplumsal unsuru, kendinene kadar kaynak kabul ettiğini anlamak için istihsan kavramının kullanımı,Hanefi mezhebinin içtihatlarını toplamış olan Serahsû'nin el-MebsÃ»t adlı eseriesas alınarak, söz konusu mezhep çerçevesinde incelenmiştirBu bağlamda müçtehitlerin, i slam hukukunun gelişim sürecindeolanakları ölçüsünde sosyal realiteyi dikkate aldıkları gözlenmiştir. Hukukuntıkanması tehlikesi karşısında, onun canlılığına olanak verecek kavramlarüretilerek sosyal şartlar ile naslar arasında bir dengenin korunmaya çalışıldığıgörülmektedir."
