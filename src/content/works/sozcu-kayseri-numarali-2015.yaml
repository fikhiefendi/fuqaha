abstract: "Osmanlı Devleti kurulduğu andan itibaren adaleti kendisine ilke edinmiş ve adaletin uygulanma yeri olan mahkemelere büyük bir önem vermiştir. Şer'i hükümlerin uygulandığı şer'iyye mahkemeleri ve kadılar adalet sisteminin temelini teşkil etmişlerdir. Kadılar sadece kadılık görevi yapmamışlar bulundukları yerde devletle her türlü yazışmayı yapmışlardır. Kadılar görevleri icabı yaptıkları yazışmaları kayda geçirmişlerdir ki bu kayıtlara şer'iyye sicilleri adı verilmektedir. Şer'iyye sicilleri ait oldukları bölgenin idari-siyasi durumu, o bölgede yaşayan insanların geçim tarzları, kullandıkları eşyaları, birbirleriyle olan ilişkileri, ekonomik durumları vb. konular hakkında bilgiler veren önemli kaynaklardır. Kadılar Şer'i ve hükmi muamelatta, kendilerine verilen beratta gösterilen vazifeleri görüp, Hanefi mezhebi üzerine karar verirlerdi. Araştırmamızın konusu olan Kayseri 25 numaralı Şer'iyye Sicili 1624-1625 yıllarını kapsamaktadır. 101-160. Sahifeleri arasındaki kısım araştırma konumuzdur. Kayseri şehrinin dini, hukuki, idari ve demografik yapısı hakkında ayrıntılı bilgiler bulunmaktadır."
