abstract: "XIV. yüzyılda yaşamış Şâfiî fakihlerinden Tâcüddîn es-Sübkî, ilmî derinliği ve sistematik yaklaşımıyla fıkıh usûlü literatüründe müstesna bir yere sahiptir. Özellikle Cemʿu'l-Cevâmiʿ adlı eseri, kendisinden önceki usûl birikimini kuşatıcı bir şekilde derleyip düzenlemesi bakımından klasik dönem usûl yazımında önemli bir dönüm noktası olarak değerlendirilmiştir. Araştırmamızın ilk bölümünde Sübkî'nin ilmî kişiliği, yetiştiği ilmî çevre, görev aldığı müderrislik ve kadılık pozisyonları ile yaşadığı Memlükler dönemi bağlamında siyasi ve kültürel ortam incelenmiş; özellikle Şam ve Kahire gibi merkezlerde oluşan güçlü ilim havzasının etkisine dikkat çekilmiştir. Araştırmada nitel analiz yöntemi benimsenmiş; başta Cemʿu'l-cevâmiʿ olmak üzere Tâceddîn es-Sübkî'nin el-İbhâc, Raf'u'l-hâcib gibi diğer usûl eserleri ile birlikte, ilgili şerh ve haşiyeler karşılaştırmalı olarak analiz edilmiştir. Tâceddîn es-Sübkî'nin içtihad anlayışının, sadece teorik niteliklerle sınırlı kalmayan, müctehidlik ehliyetini sezgi, derinlik ve feraset gibi vasıflarla ilişkilendiren kapsamlı bir bakış sunduğu gözlemlenmiştir. Onun, içtihad kapısının tümüyle kapandığı yönündeki kanaatlere katılmadığı, aksine gerekli şartları taşıyan âlimlerin her çağda içtihad yapabileceğini savunduğu tespit edilmiştir. Taklîd konusunda ise, zaruret ve maslahat çerçevesinde belirli esnekliklere yer verse de, halkın ehil olmayan kimselerin fetvalarına başvurmaması gerektiğini vurgulayan ihtiyatlı bir yaklaşım geliştirdiği görülmüştür. Ayrıca müftü tercihi ve mezhep değişikliği gibi konularda da mutlak yasaklayıcılıktan kaçınarak, tarihî içtihadî tecrübeyi dikkate alan dengeli bir görüş ortaya koyduğu anlaşılmaktadır. Tâceddîn es-Sübkî'nin yaklaşımı, hem klasik usûl geleneği içindeki özgün konumunu ortaya koymakta hem de içtihad ve taklîd eksenindeki çağdaş tartışmalara katkı sunabilecek zengin bir perspektif içermektedir."
