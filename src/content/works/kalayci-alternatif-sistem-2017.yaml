abstract: "Bu çalışmada ekonomik hayatın temel yapı taşı olan finans sisteminin tanımı, amacı ve araçları incelenmiş, günümüz finans sisteminin nasıl işlediği, hangi araçları kullandığı anlatılmıştır. Ardından klasik finans sistemine alternatif olacağını düşündüğümüz İslami finans sisteminin tanımı, amacı ve ne tür araçlara sahip olduğu ele alınmıştır. Günümüz finans sisteminde faizin yeri ve önemine dikkat çekilmiş ve İslami finansın başta faiz olmak üzere temel yasakları belirtilerek klasik finans sisteminin aksayan yönlerine ne tür alternatifler yerleştirilebileceği tartışılmıştır. Ayrıca Kur'an ayetleri ve hadislerden de yardım alınmıştır. İslami finansın neden günümüzde bir ihtiyaç haline geldiğine değinilmiş, sosyal dayanışma ve yardımlaşmanın, toplumsal düzenin ve adil gelir dağılımının tesisinin İslam dinince ne denli önemli olduğu aktarılmıştır. Günümüz finans sisteminin temelini oluşturan rasyonel insan modeli (homo economicus) ile iktisadi nizamın İslam dini çerçevesinde kurulmasını hedefleyen Müslüman insan modelinin karşılaştırması yapılmıştır. Rasyonel insan ile Müslüman insan arasında ne tür farklar vardır, karar mekanizmaları nasıl çalışmaktadır gibi soruların cevabı aranmıştır."
