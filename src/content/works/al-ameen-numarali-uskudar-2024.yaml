abstract: "Şerʽiye sicilleri, Osmanlı imparatorluğundaki şeriat mahkemeleri tarafından tutulan resmi kayıt defterleridir. Bu siciller, evlilik, boşanma ve miras gibi medeni hukuka ilişkin olayların yanı sıra mahkeme karalarını da içerir. Tarih araştırmalarında önemli bir kaynak olan bu belgeler, dönemin sosyal ve ekonomik yapısını anlamaya yardımcı olurken, aile tarihçesi çalışmalarında da büyük bir rol oynar. Bu çalışma, Osmanlı İmparatorluğu'nun Üsküdar kazasına ve IV. Mehmet dönemine ait olan 1071-1072 (1661-1662) tarihli 229 numaralı şerʼiye sicilini detaylı bir şekilde incelemeyi amaçlamaktadır. Bu tez, 229 numaralı Üsküdar şer'iye sicilinin (1661-1662) transkripsiyonunu ve analizini yaparak, Osmanlı İmparatorluğu'nun IV. Mehmet döneminde Üsküdar kazasının sosyal, ekonomik ve hukuki yapısını incelemeyi amaçlamaktadır. Çalışma, Osmanlı yönetim yapısının ve toplumsal dinamiklerinin yerel mahkeme kayıtları üzerinden anlaşılmasına yönelik kapsamlı bir araştırma sunar. Söz konusu sicil, toplamda yaklaşık 330 belge içermekte olup, hüccet, ilâm, ferman ve berat gibi farklı belge türlerini barındırmaktadır. Belgeler, dönemin toplumsal ilişkilerine ışık tutarak, mülkiyet hakları, ticari anlaşmazlıklar, aile içi meseleler, alacak-borç davaları, vakıflarla ilgili düzenlemeler, nafaka ve miras işlemleri, köle ve cariye azadı gibi çok çeşitli konuları kapsar. Çalışmanın bilimsel katkısı, şer'iye sicillerinin Osmanlı hukuk sistemi, yerel yönetim yapısı ve toplumsal ilişkileri anlamada temel bir kaynak olduğunu vurgulamasıdır. Sicilin transkripsiyonunda her bir belgenin özeti sunulmuş, hicri tarihler miladi tarihe çevrilmiş ve belgeler titizlikle yorumlanmıştır. Böylece, Üsküdar'ın gündelik yaşamı, sosyal ilişkileri, ekonomik faaliyetleri ve hukuki pratikleri gibi çeşitli boyutları detaylı bir şekilde analiz edilmiştir. Sonuç olarak, bu çalışma, şer'iye sicillerinin, Osmanlı toplumunun farklı yönlerini açıklamada vazgeçilmez bir kaynak olduğunu ve dönemin sosyal bilimsel araştırmalarına önemli katkılar sunduğunu ortaya koymaktadır."
