abstract: "Çağdaş iktisat sistemleri, gelir dağılımındaki eşitsizlik ile yoksullukla mücadelede başarısız olmuşlardır. Dolayısı ile toplumun büyük bir kısmı temel ihtiyaçlarını karşılayamamakta ve zor durumda hayatlarını geçirmek zorunda kalmaktadır. Geleneksel iktisatçılara göre, kapitalizmin bu sorunları çözmek için alt yapısında değişmeler yapılmalıdır. Önerdikleri değişmelerde %2,5 civarında vergilendirilme ve faizin sıfıra getirilmesi temel olarak yer almaktadır. İslam iktisadında, genel olarak %2,5 oranında zenginlerden zekât toplanır ve faizli işlemler sarihen yasaklanmıştır. Zekât, zenginlerin mallarında fakirlere ait bir haktır ve zorunlu olarak alınır. Böylece, zenginliğin yoğunlaşması engellenir ve toplumun üst kesiminden alt kesime gelir transferi sağlanmış olur. Netice olarak gelir dağılımındaki eşitsizlik yok olur ve adil gelir dağılımı sonucunda herkes temel ihtiyaçlarına kavuşmuş olur. Geçmişte zekât, İslam ülkelerinde yoksulluğun ortadan kaldırılmasını başarmıştır. Günümüzde İslam ülkelerinde zekât potansiyeli yüksektir ama toplanan zekât miktarı potansiyelinden daha azdır. Bunun nedeni ise, sistematik ve zorunlu bir şekilde devletçe zekâtın toplanmamasıdır. Ayrıca İslam ülkeleriler, zekâtı gelişme ve yoksullukla mücadele politikalarında kullanmamaktadır. Dolayısı ile yoksulluk ve gelir dağılımında eşitsizlik sorununa maruz kalmışlardır. Çalışmanın sonucuna göre, zekât bir politika aracı olarak devletçe kullanılmalıdır. Böylece yoksulluk ve gelir eşitsizliği azaltılabilir. Ancak zekâtın yönetimindeki güçlükler ortadan kaldırılmalıdır."
