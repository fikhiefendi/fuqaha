abstract: "Usûlcüler, kapsamlarını göz önününde bulundurarak lafızları âmm, hâs, mutlak, mukayyed, müşterek ve müevvel olarak taksim etmişlerdir. Araştırmamızda bu kavramları ele aldık. Bu kavramları şafii ve fukaha usûlcülerin yaklaşımlarını göz önününde bulundurarak inceledik. Şafii usûlcülerin bu kavramlara bakışları fukaha usûlcülerden farklı olduğu için birinci bölümde fukaha usûlcülerine göre bu kavramların sözlük ve terim anlamlarını inceledik. İkinci bölümde, şafii usûlcülerin bu kavramlara bakışlarını göz önünde bulundurarak bu kavramların terim anlamlarını inceledik. Özellikle mutlak ve müşterek kavramları hakkında meydana gelen ihtilafları âyet ve hadislerden örnekler getirerek inceledik."
