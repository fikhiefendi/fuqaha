abstract: "“Kadı Ebu Yusuf'in şahadet Konusunda İmam Ebu Hanife ile Anlaşamadığı Konular”başlıklı bu araştırma bir önsöz, bir giriş ve yedi bölümden oluşmaktadır. Şahadet ilgili ihtilafların olduğu içtihat sorunlarını inceler ve bu sorunları argümanlar ve kanıtlarla destekler. Aynı zamanda anlaşmazlıkların nedenini ve hangisinin daha fazla desteklendiğini de belirtmektedir. Bunların yanında, varsa kanıtlarla birlikte diğer doktrinlerin bu konular hakkında söylediklerinden kısaca değinmektedir. Önsözde araştırma, farklılıklar kavramını, arkasındaki nedeni, yararlarını ve amaçlarını açıklamaktadır. Ayrıca Kadı Ebu Yusuf'un eğitim hayatından ve yargı alanındaki çalışmalarından da bahsetmektedir. Birinci bölümde şahadetin tanımı, yargıdaki önemi ve meşruiyeti yer almaktadır. İkinci bölüm, ifadenin uygunluğuna ilişkin dört tartışmalı konuyu tartışmaktadır. Üçüncü bölüm, bir temsilcinin niteliklerini ve onlarla ilgili altı tartışmalı konuyu kapsar. Dördüncü bölüm, şahadeti kabul etmek ve reddetmekle ilgili iki konudan bashsetmektedir. Beşinci bölüm, şahadeti tasdik edenlerin farklı bakış açılarıyla alakalı beş meseleyi ele almaktadır. Altıncı bölüm, bir şahadete yapılan şahadete ilişkin dört konuyu açıklamaktadır. Son olarak, yedinci bölüm, ifadenin geri çekilmesine ilişkin dört konuya ayrılmıştır. Bu araştırma, vardığı en önemli sonuçlara değinilerek sonuçlanmaktadır ve genel olarak içtihat, özelde şahadet ve yargı alanındaki akademisyenlere ve araştırmacılara bir dizi öneriler sunmaktadır."
