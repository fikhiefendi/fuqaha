abstract: "Günümüzde ulaşım ve buna bağlı oluşan problemler, vahyin indiği dönemdeki ulaşım biçimi ve karşılaşılan problemlerden farklılık göstermektedir. Nitekim çağımızda kullanılan trafik araçlarının çeşitliliği, yolların niteliği ve trafik yoğunluğu o dönemdeki ulaşım kültürü ve şeklinden çok farklıdır. Dolayısıyla çağımızdaki trafik problemleri ve bu problemlerin doğurduğu sonuçlar da yeni bir konu ve alan olarak karşımıza çıkmaktadır. Trafik ağlarında sürücü hataları, kullanım şekli ve kural ihlalleri sonucunda, insanların beş temel hakkının (can, din, mal, akıl, nesil) bir kısmının ihlal edildiği görülmekte ve bilinmektedir. Bu çalışmamızda İslam hukuku bağlamında çağımız trafik kuralları ve önemi; trafiğin insanların can ve mal kayıplarını nasıl etkilediği, devletin kural koyma yetkisi ve çerçevesi, trafik kurallarına karşı sorumluluklar, kural ihlalleri sonucunda meydana gelen mağduriyetler ve devletin verdiği cezalar incelenmiştir. Bu konular, vahyin indiği dönem göz önünde bulundurularak, yöntem ve tavsiyelerden ve bu kuralların ihlal edilmesi sonucunda meydana gelen can ve mal kaybı ile ilgili hükümlerden yararlanarak araştırılmıştır. O günün ulaşım hukuku ve problemlerinin nasıl ele alındığını ve olayların hangi yöntemlerle değerlendirilip sonuca bağlandığı incelenerek bu yöntemler ışığında günümüz trafiği değerlendirilmiştir."
