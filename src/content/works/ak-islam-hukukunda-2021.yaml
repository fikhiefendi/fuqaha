abstract: "Tüm dinlerin ortak ibadeti olan kurbanın İslam'da da sembol derecesinde önemli bir konumu vardır. Pek çok kurban çeşidi bulunmakla beraber kurban bayramında kesilen“udhiye”kurbanı, kitaplarda üzerinde en çok durulan kurban çeşididir. Mutlak manadaki kullanımdan bu anlaşılır. Literatürde bu ibadetin meşruluğu, sebebi, rüknü, şartları ve hikmetleri incelenmiştir. Şartlar yükümlülük ve geçerlilik bakımından taksim edilip incelenmiştir. Yükümlülük şartları; Akîl-baliğ olmak, müslüman olmak, mukim olmak, zengin olmak ve hür olmaktır. Geçerlilik için kurbanlıkta aranan şartlar kurbanlığın cinsi, yaşı, kusursuzluğu, mülkiyetiyle alakalıdır. Bu ibadetin ifası için Şari' teâlâ'nın şartlarına riayet etmek gerekir. Edilmediği takdirde ibadetten beklenen, mükellefin sorumluluğundaki ibadet, borç olarak kalmaya devam eder. İslam hukuku tarih boyunca şartlarla ilgili zamanın getirmiş olduğu yeni meselelere kayıtsız kalmadan zamanın ruhuna uygun dinamik incelemelerde bulunur."
