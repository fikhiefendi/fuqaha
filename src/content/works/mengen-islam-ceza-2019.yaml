abstract: "Araştırma İslam Ceza Hukukunda savunma hakkını ele almaktadır. Savunma hakkı en temel insan haklarından olup, aynı zamanda söz ve düşünce özgürlüğünün en önemli uygulama biçimidir. Adil bir hukuk sistemi için, şüpheli kişiler yargılama makamları önünde hiç bir endişe altında olmaksızın, haklarını iddia edebilmeli ve kendilerini savunma fırsatına sahip olmalıdır. Şayet hukuk sistemleri bu hakkı kişilere tanımazsa, yargılamada hedeflenen gerçeğe ulaşmak imkânı olmayacaktır. Bu nedenle, savunma hakkı hukuk sistemleri için oldukça önemli temel bir haktır. Aynı zamanda yargılamanın iddia, savunma ve hüküm olarak tasnif edilen, üç temel müessesesinden biridir. Savunmanın hukuk sistemleri için taşıdığı bu önemden dolayı çalışmamızda, İslam ceza hukukunda savunma hakkı incelenmiştir. Çalışmamızda öncelikle savunma hakkının tanımı, önemi ve kullanılma şekli incelenmektedir. Daha sonra, şüphelinin savunma hakkı kapsamındaki diğer hakları, savunma hakkının sınırları ve savunma hakkını destekleyip koruyan diğer haklar ve ilkeler incelenmiştir. Çalışmamızın amacı İslam ceza hukukunda savunma hakkının mevcudiyetini ispatlamak, savunma hakkının kapsamını, sınırlarını, kullanım şekline ilişkin şartları ortaya koymaktır. Bu amaçla, Kur'an-ı Kerim ve Hadis-i Şeriflerden delillere, İslam tarihinden uygulama örneklerine yer verilmiştir. Böylece İslam hukukunda savunma hakkının mevcut olduğu ve etkin bir şekilde uygulandığı tespit edilmiştir."
