abstract: "Kasamenin tarifi konusunda fıkıh bilginleri arasında görüş ayrılığı vardır. Fıkıh bilginlerinin çoğunluğuna göre kasame, ?adam öldürme suçunu işleyen kişinin kim olduğuna dair öldürülenin velilerinin ettikleri elli yemindir.? Hanefîlere göre ise kasame, ?faili meçhul bir şekilde öldürülen kişinin bulunduğu yerleşim alanından elli kişinin cinayeti işlemediklerine ve işleyeni de bilmediklerine dair ettikleri elli yemindir.? Kasame yeminleri ile akıl hastalarının ve çocukların yükümlü olmadığına dair görüş birliği vardır. Kadınların ve kölelerin bu yeminlerle yükümlü olup olmadıkları ise tartışmalıdır.Birçok adlî, idarî ve toplumsal fayda ve hikmetlere dayanan kasame, masum insanların kanının heder olmasının engellenmesi için meşrû kılınmıştır. Hatâen adam öldürmede kasâme ile hafifletilmiş diyetin; kaste benzer adam öldürmede ise ağırlaştırılmış diyetin vacip olduğunda ihtilaf yoktur. Kasten adam öldürmede kasamenin sonucunun kısas mı yoksa diyet mi olacağı konusunda görüş ayrılığı vardır. Eski İsrail hukukunda ve Câhiliye döneminde tatbik edilmiş olan kasame, Hz. Peygamber tarafından bazı değişikliklerle meşru görüldüğü tarihten itibaren Osmanlı Devleti'nin son yıllarına kadar çeşitli zamanlarda ve devletlerde uygulanmıştır."
