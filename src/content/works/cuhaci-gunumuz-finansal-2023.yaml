abstract: "Bu çalışma, finansal istikrarın önemi ve İslam iktisadının finansal istikrara katkılarını ortaya koymayı amaçlamaktadır. Yirminci yüzyılın son çeyreğinde, ekonomik ilişkilerin ilerlemesiyle birlikte finansal istikrar uluslararası düzeyde önemli bir faktör haline gelmiştir. Serbestleşme politikaları ve yapısal değişimler, finansal istikrarsızlıklara yol açmış ve ekonomik krizleri tetiklemiştir. Bu bağlamda İslami finans sistemi, faizsiz ve risk paylaşımına dayalı prensipleriyle finansal istikrarı teşvik etmektedir. İslami finans, adil bir ekonomik yapıyı teşvik ederken, finansal krizlere karşı daha dayanıklı bir yapı sunmaktadır."
