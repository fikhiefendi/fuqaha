abstract: "İctihad, İslam hukukunun temel dinamiklerinden biridir. Fıkıh tarihinde ictihad ve onunla bağlantılı olarak taklidle ilgili pek çok mesele tartışılmıştır. Bu tezde, Kazanlı Hanefî bir alim olan Şihâbüddîn Mercânî'nin ictihad ve taklide yaklaşımı konu edilmiştir. Mercânî'nin tecdid yanlısı bir alim olarak görülmesi, Kazan tecdid hareketinin karakteristiğini göstermesi bakımından ictihad ve taklidle ilgili görüşlerinin bilinmesini önemli kılmıştır. Çalışma, giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmında, çalışmanın konusu, amacı, kaynakları, yöntemi ve ilgili literatür ele alınmıştır. Birinci bölümde, görüşlerine zemin hazırlaması bakımından Mercânî'nin hayatı ve içerisinde yetiştiği ilmi çevre tanıtılmaya çalışılmıştır. İkinci bölümde, Mercânî'nin eserleri incelenerek ictihad, taklid ve bunlarla ilgili çeşitli meselelelere yaklaşımı araştırılmıştır. Bu bölümde, ictihad kapısının kapanıp kapanmadığı meselesi üzerinde durulmuş; Mercânî'nin ictihad kapısının kapanmadığını ve taklide ancak ihtiyaç anında ihtiyaç miktarınca başvurulabileceğini vurguladığı tespit edilmiştir. Belirli bir mezhebi taklid etmeyi vacip görmemesine rağmen mukallidin bir müctehidi taklid etmesini zorunlu gördüğü ve intikale olumlu baktığı anlaşılmıştır. Üçüncü bölümde, Mercânî'nin ictihad ve taklidle ilgili görüşlerini yansıtan fıkhî meseleler ele alınarak, ictihad ve taklide yaklaşımının ortaya konulması amaçlanmıştır. Farklı mezheplerden yararlanmaya olumlu bakmakla birlikte Mercânî'nin, fıkhî meselelerde ekseriyetle Hanefî mezhebinin muteber kitaplarına başvurduğu tespit edilmiştir."
