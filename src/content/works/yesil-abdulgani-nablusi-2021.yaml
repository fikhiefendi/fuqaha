abstract: "İslâmî ilimler, kaynak ve maksat bakımından bir bütündür. Dinin anlaşılmasına ve yaşanmasına yönelik çabaların birer neticesi olan fıkıh ve tasavvuf, inceledikleri konular merkez alındığında birbirinden ayrılan iki ilim dalıdır. Abdülğanî en-Nablusî'nin, Birgivî'nin et-Tarîkatü'l-Muhammediyye isimli eserine yazdığı el-Hadîkatü'n-Nediyye şerhi içerik itibariyle hem fıkıh hem tasavvuf kategorisine dahil edilen bir eserdir. Her iki alanda önde gelen isimlerden olan Nablusî, kaynakları, mensupları, gayeleri bakımından birbirinden farklı değerlere sahip bu iki sahayı eserinde ortak paydada buluşturmuştur. Araştırma, fıkıh ve tasavvufun tanımını ve ilişkisini açıklayarak başlamıştır. Nablusî'nin biyografisine değinilerek devam eden bu çalışmada, eserindeki fıkhî görüşleri incelenerek, Nablusî'nin nezdinde her iki alanın konumu, önceliği ve ortak değerleri mukayese edilerek ele alınmıştır. Yapılan tespitler sonuç bölümünde fıkhın günümüzdeki uygulanabilirlik boyutuyla değerlendirilmiştir."
