abstract: "Yüksek Lisans akademik çalışmamızın konusu insanlık tarihi kadar eskidir. İlk yaratılan erkek insan Hz. Âdem ve yaratılan ilk kadın Hz. Havva'dır. Allah (c.c.) bu iki farklı cins insanın bir arada yaşayabilmesi ve meşru yoldan insan neslinin çoğalması için nikâh akdi ile kurulan bir evliliği gerekli kılmıştır. Tüm bu sebepler nikâh konusunu önemli ve dikkat çekici kılmaktadır. Biz de İslam dünyasında var olan Sunnî ve Şia tefsirlerini örnek alarak bu konuya nasıl baktıklarını karşılaştırmak istedik. Sunnî müfessirlerden Ebu'l-Berekât en-Nesefî'nin Medârikü'tTenzîl ve Hakâikü't-Te'vîl adlı tefsiri ile Şia müfessirlerinin öncülerinden Ebû Cafer et-Tûsî'nin etTibyân fî Tefsîri'l-Kur'ân adlı tefsirini ele alarak Kur'ân'daki nikâh âyetlerini tefsir ederken ortaya çıkan farklılıkları ve ortak anlayışı ortaya çıkarmaya çalıştık. Akademik çalışmamızı yaparken sadece bu tefsirlere bağlı kalmayarak, Sunnî ve Şiî camianın diğer tefsirlerinden de örnekler vermeye özen gösterdik. Sunnî camiadan tefsirler seçerken de hem amelî hem de itikadî mezhepleri farklı olan müfessirlerin görüşlerini de yansıtarak tek mezhepli bir çalışma olmaması için gayret göstermeye çalıştık. Nikâh konusunu sadece tefsirlerle açıklamaya çalışmak konuyu eksik bırakır düşüncesi ile Şiî ve Sunnî görüşün fıkıh kitablarını araştırdık. Ayrıca konu ile ilgili akademik açıdan yazılan makale, yüksek lisans, doktara tezlerini araştırarak ve danışman hocamın tecrübe ve birikimlerinden de faydalandık."
