abstract: "İslam dini, inanç hürriyeti prensibini yerleştirerek, insanlara akıl ve fikirlerine uygun oland ini inancı benimsemelerinde tam bir hürriyet tanımıştır. Kur'ân'da inanç hürriyetinin varlığına delil olan pek çok âyet bulunmaktadır. Bu âyetler herhangi bir kimsenin İslam dinine girmeye zorlanamayacağı ve onun hayat tarzının hiç kimseye zorla kabul ettirilemeyeceği manasını taşımaktadır. İslam tarihindeki uygulamalar da bu gerçeği doğrulamaktadır. İslam'da belli bir inanca sahip olmada esas, savaş, zorlama ve taklit değil düşünme ve araştırmadır. Kur'ân'da savaş ile ilgili âyetleri, İslam'a davet için savaşın meşru olduğuna delil olarak gören âlimler bulunmaktadır. Ancak İslam'da savaş öncelikle saldırıyı püskürtmek, tecavüzü önlemek, müslümanların karşı karşıya bulundukları eziyet ve fitneleri gidermek ve güven ortamını temin etmek için yapılmaktadır. Mürtedin öldürülmesi gerektiğini söyleyen İslam hukukçularının mürtedin öldürülmesini hemen hemen aynı sebeplere bağladıkları görülmektedir. Kur'ân'ın ve sünnetin yakinen incelenmesi sonucu görülmektedir ki; İslam'la ve İslam toplumuyla savaşmayı hedeflemedikçe, İslam'ı suistimal etmek veya sömürmek istemedikçe, insanlar görüşlerini inançlarını değiştirebilmekte ve İslam'dan ayrılabilmektedirler."
