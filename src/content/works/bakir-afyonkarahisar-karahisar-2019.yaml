abstract: "Şeriye sicilleri; içerisinde dönemin sosyal, ekonomik, siyasi, hukuki ve kültürel özelliklerini barındıran, tarih çalışmalarında başvurulan kaynakların başında gelmektedir. Bu çalışmada 1732 (H.1144-1145) tarih ve 538 numaralı Şer'iyye sicili incelenmiştir. Bu defter Karahisar-ı Sâhib sancağına ait olmakla beraber, Osmanlı Devleti'ni genel olarak ilgilendiren vergi, alım-satım işlemleri, evlenme-boşanma, miras, nafaka, adli vakalar vb. konuları içerisinde bulunduran belgelerden oluşması hasebiyle ayrıca önem taşımaktadır. Defterde toplam 388 belge bulunmaktadır. Bu belgeler tek tek transkribe edilmiş ve değerlendirilmiştir. Buna göre tez giriş bölümü dışında değerlendirme transkripsiyon ve index olmak üzere üç bölümden meydana gelmektedir. Yapmış olduğumuz bu çalışma ile Afyonkarahisar ve Osmanlı Devleti hakkında yapılacak başka araştırmalara ışık tutulmaya çalışılmıştır."
