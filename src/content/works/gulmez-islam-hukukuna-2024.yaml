abstract: "Teknoloji, ortaya çıktığı günden bu yana hayatımızın ayrılmaz bir parçası haline gelmiştir. Şüphesiz bunun başta gelen nedenleri arasında teknolojinin toplumsal hayatı ileri derecede kolaylaştırması yer almaktadır. Başlarda web 1.0 ile hayatımıza giren internet teknolojisi zamanla gelişmiş ve web 3.0 ile üç boyutlu hale bürünmüştür. Üç boyutlu teknolojinin sağladığı imkanlardan biri olan Metaverse teknolojisi kullanıcılarına alışılmışın dışında deneyimler sunmaktadır. Metaverse, gerçek alemin kopyasının sanal aleme yansıması olarak tanımlanmaktadır. Bu Meta evrende sanal gayri- menkuller ve giyim mağazaları gibi pek çok alanda hizmet sunulmaktadır. Ayrıca, bu evrende NFT olarak isimlendirilen benzersiz ve değiştirilemez özelliğe sahip bir anlamda dijital sertifikalar mevcuttur. Bir ses dosyası, video ve resim gibi sanal varlıklar NFT olabilmektedir. Meta evrende alım satım işlemleri kripto paralar ile gerçekleştirilmektedir. Meta evrende yer alan dijital varlıkların İslâm hukuku açısından mal olarak kabul edilip edilmeyeceği tartışma konusu olmaktadır. Aynı şekilde bu evrende yapılan alışverişlerde kullanılan kripto paraların günümüzde tedavülde olan para birimleri gibi işlem görüp görmeyeceği konusunda farklı görüşler ortaya atılmaktadır. İslâm hukukçuları, Metaverse'te yer alan sanal ürünlerin gerçek mal kavramı içerisine dahil olup olamayacağı sorusunun kesinlik kazanmaması, bu evrende yapılan alışverişler ile ilgili gerekli yasal düzenlemelerin bulunmaması ve ortamın barındırdığı riskleri gerekçe göstererek birtakım eleştirilerde bulunmuşlardır. Bu nedenle İslâm hukukçularının bir kısmı içerisinde bulunan şüpheler nedeniyle bu evrende yapılan işlemlere sıcak bakmazken bazı İslâm hukukçularına göre teknolojinin sağladığı kolaylıklardan geri kalmamak ve çağa uyum sağlamak adına bu sorunları ortadan kaldıracak çalışmalar yürütülmeli ve bir şekilde, hayatımızda yer alması ihtimal dahilinde olan bu teknolojilerden uzak durmak yerine onu faydalı kullanmanın yolları aranmalıdır"
