abstract: "ivXIX.YÜZYIL SONLARINDA İNEGÖL(C-233 NUMARALI H.1313/M.1892 YILINA AİT ŞER`İYE SİCİLİKAYITLARINA GÖRE)Yakup YAKUTSüleyman Demirel Üniversitesi, İslâm Tarihi ve Sanatları Anabilim DalıYüksek Lisans Tezi, Şubat 2006Danışman: Prof. Dr. Murat SARICIKBu tezin amacı, M.1892 yılına ait Şer`iye mahkemesi kayıtlarından yolaçıkarak Bursa ili İnegöl ilçesi halkının XIX. yüzyıl sonlarındaki sosyal, ekonomik vedûnû yaşamını incelemektir. Tezimizi Milli Kütüphane'de bulunan, İnegöl ilçesine aitC-233 numaralı deftere dayandırdık. Bununla birlikte İnegöl'ün tarihi konusundayerel ve genel tarih kaynaklarından da yararlandık.Tez dört bölümden oluşmaktadır. Birinci bölümde, şer`iye sicilleri hakkındabilgi verilerek, genel ve yerel tarih açısından önemi işlenmektedir. Bunun yanında,Osmanlı adlû teşkilatı ve Şer`iye mahkemelerinin işleyişi hakkında bilgiverilmektedir.İkinci bölümde ise İnegöl'ün tarihi ve doğal yapısı konusuna değinilmektedir.Ayrıca bu bölümde Fatih'in sadrazamlarından İshak Paşa'ya ve İnegöl'de yaptırdığıkülliyesine yer verilmektedir.Üçüncü bölümde, XIX. yüzyıl sonlarında ilçedeki sosyal, kültürel ve dinihayata değinilmekte, müslüman ve gayr-i müslim ilişkileri incelenmektedir.Son bölümde ise, yine defterdeki belgelerden yola çıkılarak, İnegöl'ün1890'lı yıllardaki ekonomisi incelenmiştir. Aynı bölüm içerisinde ilçedeki idarisisteme değinilerek, defterde geçen mülki erkan hakkında bilgi verilmektedir."
