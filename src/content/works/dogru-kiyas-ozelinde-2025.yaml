abstract: "Fıkıh usulü, fıkhî mezheplerin iç dinamiğinin ve fikrî eğilimlerinin yansıdığı bir ayna mesabesindedir. Bu sebeple herhangi bir mezhebin karakteristik yapısı, o mezhebin usulünden bağımsız olarak okunamaz. Bu çalışma, Hanbelî mezhebi özelinde yapılacak bu türden bir okumanın önemli basamaklarından birini oluşturmayı amaçlamaktadır. Çalışmamızın konusunu Hanbelî usul düşüncesinin kurucu eserlerinin telif edildiği hicri beşinci asır oluşturmaktadır. Bu asrın usul düşüncesini bir bütün olarak yansıtmak çalışmanın hacmi açısından mümkün olmayacağından kıyas konusu bir numune olarak seçilmiştir. Bu bağlamda çalışma boyunca ilgili dönemde kıyasın Hanbelîlerce nasıl anlaşıldığı sorusunun cevabı; dönemin üç temel Hanbelî usul metni olan el-Udde fî Usûli'l-Fıkh, et-Temhîd fî Usûli'l-Fıkh ve el-Vâzıh fî Usûli'l-Fıkh eserlerinin satırlarında aranmıştır. Çalışmamızın giriş bölümünde konuya dair literatür incelenerek çalışmanın eksenini oluşturan eserler veciz biçimde tanıtılmıştır. İkinci bölümde kıyasın mahiyet ve delil değeri, üçüncü bölümde kıyasın türleri ve kapsamı, dördüncü bölümde ise kıyasın rükün ve şartları ele alınmıştır. Çalışmamız, mezkûr başlıklar doğrultusunda konuya dair net bir tasavvur ortaya koymayı ve bu yolla bilhassa yerli literatürde sınırlı sayıda çalışmaya konu olan Hanbelî usulü hakkında daha derin bir anlayış geliştirmeyi hedeflemektedir."
