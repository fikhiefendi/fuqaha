abstract: "İslâm Hukukunun iki aslî delilinden biri olan sünneti doğru anlamak, genel olarak dini ve özellikle de şer'î hükümleri doğru anlamanın en önemli basamaklarındandır. Bu sebeple sünnetin önemli bir kısmını teşkil eden Hz. Peygamber'in fiillerini incelemek ve hükme delâlet yollarını araştırmak, usûlcülerin mühim meşguliyetlerinden biri olmuştur. Hz. Peygamber'in fiillerine ittibânın hükmü ve fiillerinin ümmet hakkındaki bağlayıcılığı konusunda fıkıh usûlü âlimleri uzun mesai harcamış ve bazı detaylarda farklı yaklaşımlarda bulunmuşlardır. Bu çalışmada, 19. yüzyıl İslâm âlimlerinden Muhammed b. Ali eş-Şevkânî'nin (ö. 1250/1834) Hz. Peygamber'in fiilleri ve bunların şer'î hükümleri konusundaki görüşlerinin tespit ve değerlendirilmesi amaçlanmıştır. Bu doğrultuda öncelikle Şevkânî'den önce yaşamış meşhur usûl âlimlerinden bazılarının Hz. Peygamber'in fiillerine ilişkin görüş ve tasnifleri kronolojik olarak aktarılmıştır. Kendisinden önceki usûlcülerin konuyla ilgili bakış açılarının sunulması, Şevkânî'nin görüşlerinin zeminini ve mevcut görüşlerden farklı olup olmadığını görmeyi sağlamıştır. Ardından Şevkânî'nin sünnet anlayışına genel bir bakış yapılmıştır. Tezin son bölümünde ise Şevkânî'nin Hz. Peygamber'in fiillerine ve ümmet hakkındaki bağlayıcılığına dair görüşlerine yer verilmiştir. Çalışma sonucunda, Şevkânî'nin Hz. Peygamber'in fiilleri konusunda en ayrıntılı tasnif yapan usûl âlimlerinden biri olduğu ve yaklaşım tarzının bazı detaylarda orijinal niteliklere sahip olduğu neticesine ve konuyla ilgili diğer bazı tespitlere ulaşılmıştır."
