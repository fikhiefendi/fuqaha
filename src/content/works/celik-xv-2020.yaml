abstract: "Tavzîh Hanefî usûl geleneğinin klasik sonrası dönemini belirleyen önde gelen metinlerdendir. Sadrüşşerîa Tavzîh'te özellikle teklîfe ilişkin meselelere geniş yer ayırmış ve burada mütekellim usûl geleneğinin klasik sonrası dönem temsilcilerinin argümanlarını eleştirmiştir. Teftâzânî ise Telvîh'te Sadrüşşerîa'nın getirdiği argümanları yorumlayıp pek çok noktada itirazlar yöneltmiştir. Tavzîh 15. yy. Osmanlı ilim çevresinde, otorite isim olan Teftâzânî'nin yorum ve eleştirileri üzerinden okunmuş; ulemanın bu ilmî mirası tartıştığı en önemli zemin Telvîh hâşiyeleri olmuştur. Bu bağlamda kaleme alınan Telvîh hâşiyelerinde hararetle tartışılan alanlardan biri şüphesiz teklîf konusudur. Bu çalışma 15. yy. Osmanlı ilim çevresinde Telvîh hâşiyelerinde teklîf konusu üzerine cereyan eden tartışmaları ortaya çıkarmayı ve bunları tarihî-fikrî bağlamına yerleştirmeyi amaçlar. Çalışmada hâşiyelerdeki tartışmaların daha ziyade görüşler değil argümanlar üzerinden cereyan ettiği ve muhaşşîlerin argümanlar üzerinden gerçekleşen bu tartışmalarda otorite figürlerin ilmî mesaisiyle irtibat kurdukları ortaya konulmuştur. Hâşiye yazarları eleştiri, yorum ve nakil/derleme olmak üzere üç farklı şekilde kurdukları irtibatlar üzerinden aynı zamanda kendi yetkinliklerini göstermeye çalışmışlardır. Çalışmada otoritelerle kurulan bu irtibat şekilleri, ele alınan tartışmalar üzerinden detaylandırılarak ortaya çıkarılmıştır. İncelenen hâşiyelerde daha çok argüman değerlendirmesine ağırlık verildiği görülmekle birlikte bu eserlerin yer yer müelliflerin fikrî eğilimlerine de ışık tuttuğu tespit edilmiştir."
