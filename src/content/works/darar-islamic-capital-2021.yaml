abstract: "İslami finans, 2009 ile 2013 arasında çift haneli büyüme yaşayan bir sektör ve önümüzdeki yıl büyümesi bekleniyor. İslami finans, hem ekonomik hem de finansal sistemi içeren ve şeriat hukuku tarafından oluşturulan ve yönetilen bir sistem olarak nitelendirilir. Ayrıca son on yılda İslami finansın pazar payı yıllık bazda% 15'in üzerinde artmış ve küresel finans sisteminde daha iyi bir finansal pozisyon elde etmektedir. Sukuk, İslami finansın“simgesi”sayılan bir finans aracıdır. Ayrıca Sukuk, şu anda dünyanın en hızlı büyüyen finansal araçlarından biri olarak biliniyor. Bu nedenle, küresel İslami fonlar ve servet yönetimi endüstrisi, piyasada bulunan İslami finansal varlıkların geniş bir yelpazesi tarafından desteklenen, Şeriata uygun yatırımlara yönelik artan talebin doğal bir sonucudur. Sonuç olarak, tüm küresel İslami fon piyasasının önümüzdeki yıllarda yılda yüzde 5,05 oranında genişlemesi ve 2019'a kadar 77 milyar dolara ulaşması bekleniyor. İslami fon yöneticilerinin gelişmeleri. Malezya, İslami finansın her varlık sınıfı için etkileyici olan en önemli ülkelerden biridir ve başka hiçbir yargı makamının rekoru yakalayamadığı bir gerçektir. Kuala Lumpur, aynı zamanda, dünyadaki İslami pazarlarda insan kaynaklarının geliştirilmesi de dâhil olmak üzere inovasyona ve kapasite geliştirmeye sürekli olarak katkıda bulunan, inkar edilemez bir İslami finans merkezidir. Buna ek olarak, Yeşil Sukuk, çevre dostu projeleri finanse etmek için önemli büyüme potansiyeline sahip, türünün tek örneği Şeriat uyumlu bir yatırım aracı olarak ortaya çıktı. Ayrıca, yeşil Sukuklar, sürdürülebilir enerji ve iklim projelerini finanse etmek için kullanılan, yapılandırılmış varlığa dayalı finansal araçlardır. Bu çalışmada İslami sermaye piyasası ve İslami fonların gelişimi ve zorlukları tartışılmaktadır. Ayrıca, İslami sermaye araçlarının özellikleri de çalışmanın bir bölümünde vurgulanmaktadır. Bu tezin en kritik kısmı, İslami finans sistemi ve İslami sermaye piyasası ilkelerinin tartışılması ve analiz edilmesidir. İslami sermaye piyasaları, geleneksel piyasaların ötesine geçmeyi gerektirecektir. Ayrıca mevcut iş uygulamalarının geliştirilmesini ve reformunu gerektirecektir. Dahası, İslami sermaye piyasalarının alanı geniş ve etkileyicidir ve uzmanların, akademisyenlerin, politika yapıcıların ve büyük piyasa katılımcılarının ve yatırımcıların ilgisini kolayca çekebilir. Sonuç olarak, İslami sermaye piyasalarının gelişimi büyük zorluklarla karşılaşır: İslami finans kurumları için para piyasalarının yokluğu, veri toplama problemi ve aşırı likiditenin optimal olmayan bir şekilde dağıtılması ve son olarak likidite risklerinin değerlenmesi ve ölçülmesinde bir güçlük, dolayısıyla bir emtia olarak para ticareti yapamama ve, Geri dönüş menfaatleri ile enfekte olan menkul kıymetleştirme yapıları için şeriata uyum konusunda kılavuz ve uygulamaların eksikliği."
