abstract: "Finansal sistemin iki temel unsurunu oluşturan fon sunanların ve fon kullananların, ülkeler ve toplumlar ölçeğinde sürekli değişen ihtiyaçları ve beklentileri, finansal araçlardaki çeşitliliği sürekli artırmaktadır. İslam dinine mensup toplumların, faiz yasağını ihlal etmeden finansal sistem içinde bir fon sunucusu ya da fon kullanıcısı olarak yer alma ihtiyacı ve beklentileri, bir alternatif olarak faizsiz finans sistemini ortaya çıkarmıştır. Faizsiz finans sisteminin son yıllarda dünyada ve ülkemizde popüler olan finansal araçlarından birisi de sukuktur. İlk defa 2001 yılında Malezya hükümeti tarafından ihraç edilen sukuk, 2010 yılından itibaren gerçekleştirilen mevzuat düzenlemeleri ile birlikte“kira sertifikası”ismi ile bir faizsiz finans aracı olarak ülkemiz finans piyasalarındaki yerini almıştır. Ülkemizde, tasarrufların artırılması ve kaynakların ülke ekonomisi adına etkin şekilde kullanılmasında, sukukların sermaye piyasalarımızda aktif rol üstlenmesi amaçlanmıştır. Sukukların sermaye piyasalarında aktif bir rol üstlenebilmesinin yollarından birisi de, doğru muhasebeleştirme ve finansal tablolarda sunum ilkeleri ile yatırımcılara ve finansal tablo kullanıcılarına, sukuklarla ilgili olarak gerçeğe ve ihtiyaca uygun finansal bilgiler sağlamaktır. Bu çalışmada sukuk, muhasebeleştirme açısından tahlil edilerek, muhasebeleştirme ve finansal tablolarda sunum ilkeleri bir uygulama örneği ile açıklanacaktır."
