abstract: "Bu yüksek lisans çalışmasının amacı, İslam hukukunun kişilerin manevi bütünlüğünün korunması adına üzerinde hassasiyetle durduğu, kişilerin iffetine ve haysiyetine saldırı niteliğinde olan ve hadd suçları arasında düzenlenen kazf suçunu incelemek ve bu suçun Türk ceza kanunundaki hakaret suçuyla mukayesesine imkân sağlamaktır. Tarihi günümüzden dört bin yıl önceki hukuk metinlerine kadar giden kazf suçu İslam ve Osmanlı ceza hukuku kapsamında ele alınmıştır. Üç bölümden oluşan bu çalışmanın ilk bölümünde kazf suçunu bağlamından koparmadan ve anlaşılır şekilde anlatabilmek amacıyla Osmanlı ceza hukukunun da temelini oluşturan İslam ceza hukukunun genel esaslarına yer verilmiştir. İkinci bölümde Kazf suçu modern ceza hukuku sistematiğine uygun olarak ayrıntılı şekilde incelenmiş, bu sayede kazf ve hakaret suçlarının mukayesesini kolaylaştırmak amaçlanmıştır. Kazf suçuyla alakalı anlatılanların teorikte kalmaması ve uygulamanın nasıl olduğunu zihinlerde canlandırmak adına ilgili bölümlerde Osmanlı şer'iyye sicillerinden alınan kazf suçuna dair örneklerle çalışma zenginleştirilmiştir. Üçüncü ve son bölümde ise hakaret suçu, ikinci bölümde takip edilen sistematik göz önünde bulundurularak ve ayrıntılı şekilde ele alınmakla birlikte çalışmanın amacını ve kapsamını aşacağından dolayı hakaret suçuyla alakalı doktrindeki tartışmalara değinilmekle yetinilmiş veya hiç girilmemiştir. Yeri geldikçe Yargıtay kararlarından hakaret suçuna dair örnekler sunulmuş ve kazf suçuyla hakaret suçunun mukayesesine de hakaret suçuyla ilgili açıklamaların yapıldığı başlıkların altında yer verilmiştir. Bu kısımda tekrara düşmemek adına kendi bölümlerinde ayrıntısıyla anlatılan iki suç tipinde benzer ve farklı olan noktalara kısaca değinilmiştir."
