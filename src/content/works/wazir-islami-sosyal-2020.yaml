abstract: "Bu araştırmanın ana amacı, Faizsiz mikrofinans ürünlerinin denemesi ve faizsiz mikrofinans kurumunu etkileyen faktörlerin araştırmaktır. Yoksulluğun azaltılması, tüm dünyada hükümetlerin temel hedeflerinden biridir. Bu hedefi gerçekleştirmek için Mikrofinans artık tüm dünyada yoksulluğu azaltmak için önemli bir araç olarak kullanılmaktadır. Bu amaçla çeşitli ülkeler tarafından geliştirilen farklı ekonomik reform programları serisi, yoksulluğun ortadan kaldırılmasına yönelik sektörel politikalar, stratejiler ve planlar uygulanmıştır. Mikrofinans, dünya genelinde başarılı bir uygulama olduğu göstermiş ve birçok ülkede yoksulluğun azaltılmasında önemli rol oynamıştır. Bu çalışmada ele alınan problemler, Murabaha Faizsiz mikrofinans ürünlerinin Qard Al-Hassan faizsiz mikrofinans ürünlerine kıyasla temerrüt oranını düşürüp düşürmeyeceği, geri ödeme performansını ve faizsiz mikrofinans etkileyen faktörleri araştırması, yoksulluğun azaltılması için İslami sosyal finans kurumlarının entegrasyon olasılıklarının değerlendirilmesidir. Çalışmanın uygulama safhası için yürütülen saha deneyinde, Murabaha ve Qard Al-Hassan sözleşmelerini imzalayan toplam katılımcı sayısı 42 kişidir. Araştırmada, temel soruları cevaplamak için, anket, ikincil veri, mülakat ve deneysel testler yoluyla toplanan hem nicel hem de nitel veri türleri kullanılmıştır. Toplanan veriler, Bağımsız Örneklemler T-testi ve Tekrarlanan Ölçümler ANOVA kullanılarak analiz edilmiştir. Elde edilen sonuçlara göre, Murabaha kullanan katılımcıların geri ödeme performans seviyesinin Qard Al-Hassan'dan daha yüksek olduğunu bulunmuştur ve borçlular arasındaki temerrüt oranını düşürmek için en iyi mekanizmalardan biri olduğunu göstermektedir. Ayrıca kadınların erkeklerden daha yüksek geri ödeme performansına sahip olduğu görülmüştür. Araştırmada yaş, medeni durum ve eğitim durumunun, katılımcıların geri ödeme performans seviyesi üzerindeki etkisinin, istatistiksel olarak anlamlı olmadığı gösterilmiştir. Bu sonuçlara ek olarak, katılımcıların, çocuk sahibi olma ve olmama durumunun da, geri ödeme performans seviyesi üzerinde herhangi bir anlamlı etkisi olmadığı gösterilmiştir. Yürütülen saha deneyinde, müşterilerin taksitlerini düzenli olarak ödemelerini ve işletmelerinin kademeli olarak büyümesini engelleyen temel nedenler, sebze fiyatlarında özellikle Hıristiyan oruç aylarındaki dalgalanmalar, Müslümanların oruç tutma dönemi, Sosyal etkinliklere harcanan para,okulların açılış zaman, acil durumlar için harcanan para, siyasi istikrarsızlık, tatillerde harcanan para, yüksek elektrik faturası, kişisel kullanım için harcanan miktar,bayram günlerinde harcadıkları para,kira artışı, mevsimsel ve mevsimsel olmayan işlere, kişisel tüketim harcamaları, sosyal tören harcamaları olarak tespit edilmiştir. Son olarak çalışmada kullanılan anket ile, İslami sosyal finans temelli Faizsiz mikrofinans kurulmasına katkıda bulunacak düzenleyici bir çerçeve geliştirmek adına önemli veriler toplanmıştır. İleri sürülen modelin, İslami sosyal fonun tek bir çatı altında düzenlenerek islami sosyal finans temelli Faizsiz Mikrofinans için etkin bir şekilde uygulanmasına yardımcı olacağı ileri sürülmektedir."
