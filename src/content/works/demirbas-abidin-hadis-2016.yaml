abstract: "İbn Âbidîn eş-Şâmî olarak da bilinen Muhammed Emîn İbn Âbidîn (1198–1252, 1783–1836) Osmanlı Devleti zamanında Şam'da yaşayan seçkin bir İslam âlimi ve hukukçusudur. O, zamanının Hanefî fıkhının bir otoritesi sayılmaktadır. İbn Âbidîn elliden fazla eser kaleme almıştır. Kendisinin en ünlü çalışması Reddu'l-Muhtâr ale'd-Dürri'l-Muhtâr'dır. Bu eser hala günümüzde Hanefî fıkhının temel kaynakları arasında sayılmaktadır. Onun Hanefî fıkhında bu denli önemli bir mertebede bulunması, eserlerinin ve düşüncelerinin hadis ilmi açısından da incelenmesini gerekli hale getirmiştir. Çalışmada İbn Âbidîn'in hadis ilimlerine dâir görüşleri pek çok âlimin görüşlerine kıyaslanarak değerlendilmiş ve bunlar neticesinde İbn Âbidîn'in hadis ilmindeki yeri tespit edilmeye çalışılmıştır. Çalışmamız, giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konu, amaç, kapsam ve yönteminden bahsettik. İlk bölümde İbn Âbidîn'in yaşadığı dönemin siyâsî, sosyal ve kültürel hayatından ve kendsinin hayatı ile ilmî kişiliği hakkında bilgiler verdik. İkinci bölümü ise konuların içeriğine göre üç ana kısma ayırdık. İlk kısımda, İbn Âbidîn'in Hz. Peygamber hakkındaki görüşlerine; ikinci kısımda İbn Âbidîn ile birlikte muhaddislerin ve Hanefî fakihlerinin sünnet hakkındaki görüşlerine yer verdik. Üçüncü kısımda İbn Âbidîn'in, Hanefî fakihlerinin ve muhaddislerin hadisi ilimleriyle alakalı görüşleri hakkında bilgiler verdik Çalışmadan elde edilen tüm bilgileri sonuç kısmında özetlemeye çalıştık. Çalışmada İbn Âbidîn'in özellikle sünnete ve hadislere karşı son derece muhafazakâr bir tutum sergilediği ve hadisleri değerlendirirken hadislerin mefhûmuyla amel edilmesini de bir ölçü olarak kabul ettiği düşüncesine ulaştık. Ayrıca değerlendirilen tüm bilgiler neticesinde İbn Âbidîn'in kendisinden önce geçmiş olan âlimlerin düşüncelerine, dolayısıyla geleneğe büyük ölçüde bağlı olduğu kanâatine vardık."
