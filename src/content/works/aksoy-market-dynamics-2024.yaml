abstract: "Mikroekonomik prensipler makroekonomik analizin temelini oluşturur. Mikro temeller anlaşılmadan sağlıklı makro analizlerin yapılması zordur. Tez Yalçıntaş'ın mikroekonomi konusundaki görüşünden ilham alınarak hazırlanmıştır. Yalçıntaş'a göre“İslami değerlerin sınırları içerisinde mikro ekonomik teorinin inşası, İslam ekonomi biliminin yerine getirmesi gereken en önemli görevdir”(Yalçıntaş, 1986). Bu çalışma, bu hedef doğrultusunda mikroekonominin verimlilik, firma ve rekabet konularını İslam ekonomisi prensipleri bağlamında ele almakta ve yeni öneriler ve yapılar sunmaktadır. Bu çalışma, İslam ekonomisinin piyasa ilkelerinden yararlanarak sosyal refahı artıracak ve gelir dağılımı ve kaynak tahsisi ile ilgili günümüz problemlerine çözüm olacak bir çerçeve önermektedir."
