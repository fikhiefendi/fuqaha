abstract: "“Yusuf suresinde Tecvid: Fonemik ve Semantik Bir Çalışma”başlıklı bu araştırma, kendi içinde son derece tutarlı bir kurguya sahip ve hassas duygu imgeleriyle öne çıkan Yusuf Suresi üzerinden Kur'an metnindeki fonetik performansın semantik etkisini ele almaktadır. Araştırma, daha önce yapılan çalışmaların çoğunun Tecvid ilmini metinsel anlamından bağımsız bir şekilde ele alması veya hükümlerini surenin amaçları ve genel anlamlarıyla ilişkilendirmeden sunmakla yetinmesi probleminden yola çıkmıştır. Aynı zamanda tecvid kurallarının sözlü icrasının Yusuf Suresi'nin semantik yapısıyla nasıl bağdaştırılabileceği sorusunun; işitsel konuda kendi has özelliklere sahip Verş rivayeti üzerinden araştırılması gerekliliğini ortaya koymuştur. Çalışmada tanımlayıcı, analitik ve istatistiksel yaklaşımlardan yararlanılarak bir dizi hedefe ulaşılması amaçlanmıştır. Suredeki tecvid kurallarının tamamı sayılmış, Verş kıraatinin fonetik kökenleri incelenmiş ve bu kuralların anlamsal etkisi, ses ve anlam arasındaki bağlantıyı gösteren uygulamalı modeller aracılığıyla analiz edilmiştir. Çalışmada ulaşılan bazı sonuçlar şunlardır: Tecvid kuralları, anlamı derinleştirmeye ve yönlendirmeye katkı sağlayan fonetik ipuçları olup, aynı ayet içinde veya ayetler arasında birbirini tamamlayarak surenin genel hedeflerini vurgulamaktadır. Uygulanan modeller, Tecvid kuralları ile şeriatın hedefleri, toplumsal ilişkiler, söylem pozisyonları ve sure içindeki iç olaylar arasında çarpıcı bir uyum olduğunu ortaya koymuştur. Bu durum, Tecvid ilminin aynı zamanda bir ibadet ve semantik ilmi olma konumunu güçlendirmektedir. Buna göre çalışmada, Kur'an-ı Kerim'in icrası ile çeşitli kıraat ve rivayetlerdeki metinsel anlam arasındaki bağın araştırılma kapsamının genişletilmesi gerektiği önerilmektedir."
