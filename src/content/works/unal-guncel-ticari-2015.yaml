abstract: "Klasik kaynaklarda ve daha önceki çalışmalarda îne satışı, genel anlamda incelenmiştir. Bu çalışmada diğer incelemelerden farklı olarak, îne satışının güncel ticarî ilişkilerde, bireysel ve kurumsal anlamda uygulama alanları incelenmiştir. Bu çalışmanın amacı çok fazla cârî olan ve birçok kişi tarafından uygun görülmeyen bir alışveriş çeşidini ele alıp, uygulanış şekillerini ortaya koymaktır."
