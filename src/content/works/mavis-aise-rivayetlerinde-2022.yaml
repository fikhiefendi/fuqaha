abstract: "Bu çalışmada Hz. Âişe'nin kadın fıkhına yönelik başlıca rivayetlerini belli bir çerçeve özelinde bir araya getirmeyi ve kadınlara ilişkin rivayetlerindeki fıkıh anlayışını tespit etmeyi amaçladık. Bu bağlamda hedefimiz Hz. Âişe'nin kadın fıkhını bizzat bir kadın olarak nasıl anlayıp yorumladığını, bu rivayetlerin mezheplerin görüşlerine nasıl ve ne ölçüde yansıdığını ortaya koymaktır. Bu yönüyle çalışmanın özgün bir muhtevaya sahip olduğuna ve bu husustaki boşluğun doldurulmasına katkı yapacağına inanıyoruz. Çalışmamızda öncelikle söz konusu rivayetler verildikten sonra Hz. Âişe'nin bu rivayetlere ilişkin yorumları aktarılmakta, mezheplerin bu rivayetler bağlamında ortaya koydukları görüşlere değinilmekte ve bu rivayetlerin mezheplerin kadın fıkhına dair görüşlerinin şekillenmesindeki etkisi ortaya konulmaktadır. Hz. Âişe'den gelen rivayetlerin kadın fıkhına kaynaklık ettiği, kadına yönelik olumsuz algıyı yok ettiği ve birçok konunun izaha kavuşmasına olanak sağladığı, rivayetlerin bizlere ulaşmamış olması halinde ise hükümlerde noksanlıkların oluşacağı görülmektedir."
