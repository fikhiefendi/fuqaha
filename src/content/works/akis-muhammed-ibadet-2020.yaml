abstract: "Yüce Allah insanlık tarihi boyunca insanlara çeşitli elçiler göndererek buyruklarını bildirmiştir. Zaman içinde tevhid akidesini kaybeden dini öğretiler Yaratıcının gönderdiği bir başka elçisi ile özüne döndürülmüştür. Bu nedenledir ki insanlık tarihinde var olan ilahi dinlerde birbirine benzer ibadet ritüelleri görülebilmektedir. Çalışmamızda Rasulullah'a vahyin gelmesinden önce var olan diğer dini sistemlerde var olan ibadetlere dair yaptığımız kısa incelemeler de bunu göz önüne sermektedir. İnsanlığa gönderilen son peygamber olan Hz. Peygamber aracılığı ile Yüce Yaratıcı vahiy ekseninde kaybolan tevhid akidesini insanların hayatının her alanının temeline alarak düzene koymayı amaçlamaktadır. Genel olarak hayatın tümünü içine alan vahiy özelde ise çalışma alanımıza giren ibadet hayatına dair öğretilerin tam olarak anlaşılması ve uygulanabilmesi için Rasulullah'ın hayatının ve ibadetlerinin keyfiyetinin öğrenilmesi icap etmektedir. Zira Hz. Muhammed vahyin hayata uygulanmasının en güzel örneğidir. Bu gereklilikten hareketle yola çıktığımız bu çalışmamızda Rasulullah'ın vahiy öncesi yaşamından başlayarak ibadetlerinde İslam ile birlikte nasıl bir gelişme görüldüğü göz önüne serilmektedir. Ayrıca vahyin geldiği ve Hz. Peygamber'in yetiştiği toplumun tanınması da İslam'ın getirdiği prensipleri anlamak açısından son derece önemlidir. Bu nedenle İslami kaynaklarda Cahiliye diye anılan bu dönemde var olan ibadetler de ele alınarak Rasulullah'ın risâlet öncesi ibadet hayatına dair bilgi edinilmeye çalışılmıştır. Daha sonra başlayan vahiy süreci ile birlikte ibadetlerin geçirdiği süreç incelenerek göz önüne serilmiştir. Hz. Peygamber'in ibadetlerinin keyfiyeti ve kemiyetinin öğrenilmesi Müslümanlar açısından birçok noktaya açıklık getirecektir. Zira Rasulullah'ın vefatından sonraki ilerleyen dönemlerde ibadetler konusunda farklı rivayetler ortaya çıkmış; bu da inanların kafasında bazı karışıklıklar meydana getirmiştir. Bu nedenledir ki Hz. Peygamber'in ibadetlerine dair erken dönem kaynaklardan edinilen bilgiler bizim için büyük önem arz etmektedir. Bu çalışmamızda mümkün olduğu kadar ilk dönem kaynaklardan hareketle Rasulullah'ın ibadetleri ortaya konulmaya çalışılmıştır."
