abstract: "Geleneksel finans, insanların kararları üzerinde etkili olan psikolojik ve duygusal faktörleri ihmal ederek rasyonel olduklarını varsaymaktadır. Davranışsal finans, geleneksel finansın rasyonel insan varsayımını kabul etmemektedir. Çünkü insanların geleneksel finansın kabul ettiği şekilde rasyonel karar vermesine engel olan bilişsel, duygusal ve sosyal olmak üzere çeşitli psikolojik eğilimler bulunmaktadır. Söz konusu eğilimler, bireylerin rasyonaliteden uzak ve hatalı davranışlar sergilemesine yol açmaktadır. Geleneksel finans ve bankacılık alanından gerek insana bakış açısı gerek çalışma esasları ile farklılaşan alanlardan biri de İslami finans ve bankacılık alanıdır. İslami finans ve bankacılık alanı da insanların sınırlı rasyonel olduğunu kabul etmektedir. Çalışmanın amacı, Türkiye genelinde katılım ve geleneksel banka müşterilerinin finansal kararlarını etkileyen eğilimlerin davranışsal finans bağlamında belirlenmesi ve iki banka grubu arasında davranışsal finans eğilimleri açısından herhangi bir farklılığın olup olmadığını ortaya koymaktır. Türkiye genelinde 33 ilde 390 katılım bankası ve 465 geleneksel banka müşterisi olmak üzere toplam 855 katılımcı ile gerçekleştirilen anketten elde edilen veriler SPSS 21 istatistik programında analiz edilmiştir. Anket verilerine ilişkin frekans analizi, geçerlilik ve güvenilirlik analizi, tanımlayıcı istatistikler, hipotezlerin test edilmesi için parametrik olmayan testlerden Mann-Whitney U, Kruskal Wallis ve Ki-kare testi yapılmıştır. Elde edilen sonuçlar, katılım ve geleneksel banka müşterilerinin finansal kararları üzerinde davranışsal finans eğilimlerinin etkili olduğunu ve her iki banka grubu müşterilerinin finansal kararları üzerinde etkili olan finansal eğilimler bakımından büyük ölçüde benzer olduğunu göstermektedir. Çalışmanın bankaların hitap edeceği müşterilerin davranışsal profili hakkında bilgi sahibi olmasına ve müşterilerin sahip olduğu psikolojik eğilimlerin belirlenmesi sonucu finansal kararlar üzerinde etkilerinin azaltılmasına katkı sağlaması beklenmektedir."
