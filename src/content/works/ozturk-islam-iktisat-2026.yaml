abstract: "ÖZET Bu çalışma, İslam iktisat düşüncesinin kurucu ilkeleri ve teorik çerçevesi doğrultusunda Ahilik teşkilatını ahlaki ekonomi, kurumsal yapı ve toplumsal düzen perspektifinden incelemeyi amaçlamaktadır. Araştırmanın temel problemi, Ahiliğin literatürde çoğunlukla geleneksel bir esnaf yapısı, meslek ahlakı teşekkülü veya kültürel miras unsuru olarak değerlendirilmesine rağmen, İslam iktisadının kurumsallaşmış ve uygulamaya dönük bir modeli olarak yeterince incelenmemiş olmasıdır. Çalışma, Ahiliği ekonomik faaliyetleri ahlaki ve toplumsal ilkelerle bütünleştiren; adalet, helal kazanç, sosyal dayanışma, piyasa düzeni, kalite güvencesi, tüketici haklarının korunması ve ahlaki fail anlayışını kurumsal düzeyde içselleştiren özgün bir iktisadi yapı modeli olarak konumlandırmaktadır. Araştırmada öncelikle İslam iktisat düşüncesinin teorik çerçevesi ve kurumsal dayanakları, fıkıh, hisbe, vakıf ve fütüvvet gelenekleri ekseninde incelenmiştir. Bu süreçte Ebu Yusuf, Farabi, Mâverdî, İbn Teymiyye ve İbn Haldun gibi düşünürlerin devlet, piyasa, adalet, üretim ve toplumsal düzen anlayışlarının İslam iktisat yaklaşımına sağladığı teorik katkılar ile bu anlayışların Ahilik teşkilatına yansımaları incelenmiştir. Ayrıca Ahiliğin teşkilat yapısı, çırak-kalfa-usta ilişkileri, meslek eğitimi, kalite denetimi, üretim standartları, piyasa düzenleyici işlevleri ve sosyal dayanışma mekanizmaları detaylı biçimde analiz edilmiştir. Araştırma, nitel araştırma yöntemi çerçevesinde yapılandırılmıştır. Veri toplama sürecinde dokümantasyon analizi yöntemi kullanılmış ve fütüvvetnameler, fıkıh eserler, seyahatnameler ve çağdaş akademik çalışmalar incelenmiştir. Elde edilen veriler betimsel analiz ve içerik analizi teknikleriyle değerlendirilmiş ve iktisadi ahlak, piyasa düzenlemeleri, dayanışma mekanizmaları, kalite anlayışı, üretim standartları ve tüketici hakları gibi tematik kategoriler altında sınıflandırılmıştır. Çalışmanın literatüre temel katkısı, Ahiliği İslam iktisat düşünce ilkelerinin geçmişe dayalı kurumsal yapılarda nasıl somutlaştığını gösteren ve teori ile uygulama arasındaki ilişkiyi açıklama potansiyeline sahip özgün bir iktisadi model olarak yeniden yorumlamaktadır. Literatürde Ahilik üzerine yapılan çalışmaların önemli bir kısmı kurumsal gelişim ve meslek ahlakı ekseninde yoğunlaşırken, Ahiliği kurumsal iktisat, ahlaki iktisat ve ahlaki fail yaklaşımıyla birlikte ele alan araştırmaların sınırlı olduğu görülmektedir. Bu çalışma, söz konusu eksikliği gidermeye katkı sunmayı amaçlamaktadır. Araştırma bulguları, Ahilik teşekkülünde piyasa mekanizmasının adalet, toplumsal fayda, denge ve ahlaki sorumluluk ilkeleri temelinde kurgulandığını ve ekonomik aktörlerin davranışlarının ise salt kar maksimizasyonuna indirgenmeyen ilkeli bir çerçeve içerisinde yönlendirildiğini ortaya koymaktadır. Ahilikte iktisadi faaliyetler, kişisel çıkarların ötesinde toplumsal refahın korunması, sosyal adaletin tesis edilmesi ve toplumsal sorumluluk bilincinin güçlendirilmesi amacıyla şekillenmiştir. Ahilik, mürüvvet, dayanışma ve diğerkâmlık ekseninde inşa ettiği iktisadi özne anlayışıyla günümüz kapitalist paradigmanın ferdiyetçi ve faydacı insan tasavvurundan belirgin biçimde ayrılmaktadır."
