abstract: "Kitap ile Sünnet, İslâm hukukunun aslî kaynaklarındandır ve bu konuda her iki kaynak arasında bir bütünlük vardır. Şer'î hükümlerin delillerinden birisi olarak öncelikle kaynağını Kitap'tan alan Sünnet, müstakil teşrî fonksiyonuna da sahiptir. Sünnetin bu fonksiyonu tarih boyunca aslî kaynakların yanında hem klasik kaynaklarda hem de ilgili araştırmalarda ifade edilmiş ve bu konuda çok sayıda misal verilmiştir. Ancak bazı çevrelerce ve özellikle son zamanlarda Sünnet'in kaynak değeri ile ilgili tartışmalar yapılmış hatta onun teşrî' yetkisi olmadığına dair görüşler de ortaya atılmıştır. Bir yönüyle bunlara cevap olmak üzere Sünnet'in İslâm hukukundaki hüccet değerini ve teşrî fonksiyonu ortaya koymak amacıyla yalnızca Sünnet ile sabit olan haramlar ve tahrîmen mekruhları tespit edip toplayan müstakil bir çalışma düşünülmüştür.“Hanefî Mezhebinde ”Sünnet ile Sabit Olan Haramlar ve Tahrîmen Mekruhlar\" adlı bu tezin hazırlanması uygun görülmüştür."
