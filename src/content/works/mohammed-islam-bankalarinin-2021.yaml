abstract: "Çok kısa bir zaman içerisinde, İslami bankacılık güvenilir ve sağlam ekonomik ilkelere dayandığını kanıtlamış ve özellikle küresel finansal krizler karşısında bir seçenek olma potansiyeli haline gelmiştir. Bununla birlikte, İslami finans endüstrisi için sağlam bir düzenleyici ve yasal yapı geliştirmek için özel politika araştırmalarına ve önlemlerine ihtiyaç vardır. İslami finansı kullanma motivasyonu, İslami borçluların ve ihraççıların Şeriat hukuku ilkelerine uygunluk göstererek İslami kurumlara ve dolayısıyla daha geniş çaplı davetlilere erişebilmeleridir. Şaşırtıcı olmayan bir şekilde İslami bankacılık, Orta Doğu proje finans piyasaları için temel bir finansman kaynağı olmuştur ve bir dizi yüksek profilli petrol ve gaz proje finansmanı işlemleri İslami olarak yapılandırılmış finansmanı başarıyla içermektedir. Elde edilen sonuçlardan İslami bankalar ile geleneksel bankalar arasındaki farka ilişkin iki hipotez olduğu ortaya çıkmıştır. İlk hipotezde, etkililik veya güven açısından önemli bir fark olmadığı bulunurken, ikinci hipotezde ise erişimde farklılıklar olduğu sonucuna ulaşılmıştır. Bu çalışma, İslami bankalar ile geleneksel bankalar arasındaki hizmet geliştirmelerine yardımcı olacak farkları ve benzerlikleri göstermesi nedeniyle bankacılık sektörü literatürüne değer katmaktadır. Tüm bunlara ek olarak, bu çalışmada güvenilen istatistiksel teknikler basit yüzde analizi, faktör analizi ve T-Testi'dir."
