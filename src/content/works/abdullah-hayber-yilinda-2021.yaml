abstract: "Araplar, eskiden bir yılı o yıl içinde gerçekleşen en önemli olay ile isimlendirilirlerdi. Hicri 7 yılının Hayber yılı olması Hayber gazvesinin bu yıl da gerçekleşmesinden dolayı ismi buradan gelmiştir. Bu çalışmada“Hayber Yılında Vaz' edilen Şer'i Hükümlerle İlgili Hadislerin Tahlili”olarak araştırmacının bu yıl içinde gerçekleşen gazvenin içeriğine ek olarak bu hüküm ve hadisleri araştırıp toplanmasıyla ele alınmıştır. Bu yıl da varid olan hükümler ibadetler, alışveriş, nikah, sosyal ilişkiler, suç ve cezalar ve yemekler ile alakalıdır. Bu çalışmada, hicri 7. Yılda varid olan hükümler araştırılırken peygamber hayatına büyük önem verilmiştir. Araştırmacı bu konunun daha önce yazılmadığını düşünerek bu konuyu araştırmıştır. Araştırmacı, bu yıl içerisindeki şer'î hükümlere delalet eden peygamber hadislerini toplama sırasında yine bu yıl içerisinde gerçekleştiğini düşündüğü bazı şer'i hükümlerin de tarihini araştırmıştır. Ve burada bir yıldan daha uzun sürede verilen hükümlerin yine hicri 7 yıldan da geçtiği görülmektedir. Araştırmacı, bu çalışmada tümevarım yöntemine başvurmuş, yanlış anlaşılan ve yanlış yorumlanmış olan bazı hususları çürüterek doğru yönlerinden bahsetmiştir. Araştırmacı, üzerinde durulması ve dikkat edilmesi gereken ve liderden kaynaklanan birçok ders bulmuş ve şûra kavramını ve onunla amel edilmesini köklendirerek bu yanlış anlaşılan haberleri gerçekleşmeden önce gizlemeyi başarmıştır."
