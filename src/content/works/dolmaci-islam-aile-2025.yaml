abstract: "İslâm, aileyi toplumun temel birimi olarak görmüş ve kadınla erkeği nikâh akdi ile birbirine bağlamıştır. Kadınla erkek arasındaki bu bağdan dolayı erkek ve kadına bazı hak ve sorumluluklar vermiştir. Nikâh akdi gerçekleştiği andan itibaren kocayı, evlilikten doğan nafaka borçlusu kılmış ve kadının geçim masraflarından mesul tutmuştur. Kadını da evlilik birliği devam ettiği sürece bu nafakanın alacaklısı olarak görmüştür. İslâm evlilik birliğini kutsal görmüş ve evlilik birliğinin sona ermesini istememiştir. Ancak her ne kadar evliliğin devam etmesini istese de boşanmaya da izin vermiş ve boşanmaya da bir takım hukuki sonuçlar bağlamıştır. Nikâh akdinden dolayı kocayı nafaka sorumlusu gördüğü gibi, boşanmada da kocanın nafaka sorumluluğunu devam ettirmiş fakat bunu bir süreyle sınırlandırmıştır. Bu çalışmanın amacı her dönemde güncelliğini koruyan ve farklı ülkelerin hukuk sistemlerince de düzenlenen bir konu olan nafakanın İslâm Hukuku ve Medeni Hukuk açısından mahiyetinin bilinmesidir. Çalışmanın ilk kısmında İslâm Aile Hukuku'nda nafaka, çeşitleri, hukuki delilleri, vücub şartları, kapsamı, mehir ve iddet konuları açıklanmıştır. İkinci kısımda Medeni Hukuk'ta nafaka genel olarak incelenmiş, çeşitleri ve nafakanın genel özellikleri işlenmiştir. Üçüncü kısımda eşlerin birbirlerine karşı bakım yükümlülüğü kapsamında tedbir nafakası ele alınmış ve İslâm Hukuku'ndaki evlilik nafakası ile benzer ve farklı yönleri değerlendirilmiştir. Son kısımda ise yoksulluk nafakası konusu işlenmiş ve İslâm Hukuku'ndaki nafaka ile benzer ve farklı yönleri ele alınmış, süresiz nafaka konusu hakkında çözümler aranmıştır."
