abstract: "Bu araştırma, hac ve umre ibadetlerinin yapıldığı dönemlerde karşılaşılan sorunları ve zorlukları incelemektedir. Hac ve umre ibadetleri, İslam'da önemli bir yer tutar ve bu ibadetlerle ilgili farklı mezhep ve görüşler arasında bazı konularda farklılıklar bulunmaktadır. İslam hukuku, insanların çıkarlarına hizmet etmeyi ve zararları önlemeyi amaçlayan bir hukuktur. Genellikle, çatışan menfaatler ve farklı çıkarların bir araya geldiği durumlar sıkça karşılaşılır. Bu durumda, bir konuda tercih yapmak için kıyas yoluyla karar verilmesi gerekebilir. Bu tercih, bir konuda daha önce tercih edilen çıkarın başka bir çıkar tarafından göz ardı edilmesi anlamına gelebilir. İşte bu noktada, hükümler ve mezhep hükümleri arasında ihtilaf doğar, çünkü bu tür konularda açık bir metin bulunmamaktadır. Bu ihtilaf, müçtehidin tercih ettiği maslahatın yerini veya önemini görmemesi durumunda daha doğru bir yöntem olabilir. Bu, müçtehidin görüşünün, tercih edilen konuya yönelik tercihini diğer konunun önüne koyması anlamına gelir. Bu nedenle, hükümlerde ve mezhep hükümlerinde ihtilaf meydana gelir. Çünkü bu tür konularda açık bir hüküm yoktur. Bu, şarinin amaçları arasında yer alır. Ancak, iki konu arasındaki ihtilaf noktasını dikkate almak önemlidir."
