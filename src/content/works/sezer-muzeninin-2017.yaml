abstract: "Şâfiî mezhebinin oluşmasında ve sistematik yapıya kavuşmasında ilk öğrencilerin etkisi ve katkısı inkâr edilemez. Bu anlamda Irak'ta Zaferânî, Mısır'da ise Büveytî, Müzenî ve Rebi' b. Süleyman el-Murâdî'yi sayabiliriz. Bu öğrenciler içerisinde Müzenî, önceleri kelâmî konularla ilgilenirken İmâm Şâfiî'nin Mısır'a gelmesiyle fıkhî konulara yönelmiştir. Dört yıl gibi kısa bir süre İmâm Şâfiî'ye öğrencilik yapmıştır. Münazara ehli ve delil sunma becerisinin güçlü olması gibi özellikleri ile İmam Şâfiî'nin beğenisini kazanmış ve İmam Şâfiî tarafından mezhebin yardımcısı olarak görülmüştür. İmam Şâfiî'nin vefatından sonra birçok eser yazmış ancak“Muhtasarü'l-Müzenî”eseriyle mezhepte şöhret bulmuştur. Muhtasarü'l-Müzenî, Şafiî mezhebinin temel kaynakları arasında yer alır. İmam Şâfiî'nin el-Ümm kitabının ihtisar halini çağrıştırsa bile konu tertibinin farklı olması ve Şâfiî'nin el-Ümm'de bulunmayan görüşlerine ve kendi yorumlarına yer vermesi bakımından orijinal bir eser olarak karşımıza çıkmaktadır. Müzenî, kitabının başında“Bu kitabı Şâfiî'nin ilminden ve görüşlerinden ihtisâr ettim/özetledim.”demektedir. Bu da Muhtasar olarak isimlendirilmesinde temel etken olmuştur. Yıllarca ders kitabı olarak okutulmuş, sistematik yapısı ile kendisinden sonraki eserlere örneklik teşkil etmiş, üzerine birçok şerh ve haşiyeler yapılmıştır. Müzenî, Muhtasar'da ele aldığı her konuda ilk önce İmâm Şâfiî'nin görüşlerine yer vermiş, arkasından bu görüşleri yorumlamak suretiyle İmâm Şâfiî'nin ne kastettiğini ortaya koymaya çalışmıştır. Yaptığı yorumlarda kendi görüşlerine de yer vermiştir. Bu görüşleri mezhep görüşü olarak kabul edilmese bile değer görmüş ve birçok fıkhî eserde yer edinmiştir."
