abstract: "Halebî'nin Mültekâ adlı eseri XVI. asırda telif edilmiş ve yazıldığı asırdan günümüze kadar Hanefi fıkhının hükümlerini özet bir şekilde ele alması hasebiyle üzerine birçok şerh yazılmıştır. Bu şerhlerin en meşhurları olan Şeyhizâde Damad Efendi'nin telif ettiği Mec'maü'l-enhur, Haskefî'nin telif ettiği Dürrü'l-münteha Fî şerhi'l-mültekâ ve son olarak Mevkûfâtî Mehmed efendi'nin telif ettiği tercüme-şerh mahiyetindeki Mültekâ Tercümesi fıkıh alanında sıkça başvurulan eserlerdendir. Bu çalışma bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde yukarıda zikredilen şerhlerin müelliflerin hayatları ve Mültekâ'ya yaptıkları şerhlerle ilgili olarak genel bilgiler verilmiştir. Çalışmanın özel tespitler başlığını taşıyan birinci bölümünde Mültekâ şerhlerinde icâre bahisleri bağlamındaki her bir mesele ayrı ayrı ele alınmış ve söz konusu meseleyle ilgili bu şerhlerin açıklama usül ve metotları ele alınmıştır. Bu incelemeler sırasında ayrıca icâre akdine ilişkin dokuz temel konu merkeze alınmıştır. Bu konular ilgili bölümde yer almaktadır. Çalışmanın genel tespitler başlığını taşıyan ikinci bölümünde ise Mültekâ şerhlerinin usulüne ilşkin ulaşılan tespitler üst bir bakış sergilenmek suretiyle zikredilmiştir. Bu bağlamda başvurdukları nakli ve akli delillerin kullanım tarzı ve şekli, dil tahlilleri, şahıs ve eserlere yapılan atıflar ön plana çıkarılmıştır."
