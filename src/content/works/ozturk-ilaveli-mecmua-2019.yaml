abstract: "Bu tez, İlâveli Mecmua-i Cedîde'de (R. 1326, H. 1329, M. 1911) yer alan aile hukukunun evlenme (nikâh) ve boşanma (talak) ile ilgili fetvâlarını konu edinmektedir. Çalışma giriş ve üç bölümden oluşmaktadır. Temel amacımız, İlâveli Mecmua-i Cedîde'deki ilgili fetvâları transkribe etmek, nakillerini tercüme etmek ve ilgili fetvâları İslam hukuku açısından değerlendirmektir. Ancak daha önce fetvâ olgusunun tarihsel arka planı hakkında kısa bilgiler verilmiştir. Osmanlılar'da fetvâ uygulamaları, müftülük, şeyhülislamlık ve fetvâ eminliği gibi kurumsal yapılar incelenmiştir. Bu şekilde İlâveli Mecmua-i Cedîde'nin telif süreci öncesindeki tarihi süreç serimlenmiş ve İlâveli Mecmua-i Cedîde'nin telif süreci ele alınmıştır. Bunun dışında fetvâları veren Şeyhülislamların biyografileri, fetvâlarda atıf yapılan kaynakların tespiti de amaçlarımız arasındadır. İlâveli Mecmua-i Cedîde'nin evlenme (nikâh) ve boşanma (talak) bölümlerinde yer alan toplam fetvâ sayısı, evlenme (nikâh) ve boşanma (talak) kitabının kaç babtan oluştuğu, bablara göre fetvâ sayıları, Şeyhülislamlar'ın fetvâ sayıları gibi sayısal verilere yer verilmiştir. Bu bilgilerin bir arada gösterilebilmesi için bazı tablolar da eklenmiştir. Hanefî fıkhına göre verildiği tespit edilen fetvâların, Hukuk-i Aile Kararnamesi ile mukayese edilmesi de asli amaçlarımız arasındadır. Bu sebeple Hukuk-i Aile Kararnamesi'ndeki maddeler incelenmiş, Kararname ile İlâveli Mecmua-i Cedîde'de yer alan fetvâlardan hangilerinin düzenlediği, hangi konularda farklı uygulamaların getirildiği tespit edilmiştir. Hukuk-i Aile Karanamesi'nin ilgili maddelerine göre“nikah, vekil ve fuzûlînin nikahı, veliler, denklikler, reddetme (nikahın geçersiz kabul edilmesi), anlaşmalı boşanma ve talak”bablarındaki bazı fetvâların düzenlediği hususlarda değişikliğin yapıldığı görülmüştür. Kitâbu'n-nikâh'ta bir; vekil ve fuzûlînin nikâhı babında üç; veliler, denklikler ve reddetme babında on; Bâbu'l-Hul'î bir; Kitabu't-talak'ta ise bir fetvâ olmak üzere toplam on altı fetvâ düzenlenen hükümler tarafından değişikliğe uğramıştır."
