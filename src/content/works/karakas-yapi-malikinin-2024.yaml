abstract: "Bina veya diğer yapı eserlerinin yapılışındaki bozukluklardan veya bakımındaki eksikliklerden doğan zararlardan sorumluluk, 6098 sayılı Türk Borçlar Kanunu'nun 69'uncu maddesinde, bir kusursuz sorumluluk olarak düzenlenmektedir. İstisnai nitelikte olan bu sorumluluk halinin oluşması için genel olarak haksız fiil sorumluluğu için aranan şartlarda kusur şartı hariç geri kalanının gerçekleşmesi gerekmekte olup TBK m. 69 anlamında hukuka aykırılık unsurunu, bina ve diğer yapı eserinin yapımındaki bozukluk veya bakımındaki eksiklik olgusu oluşturur. Günümüzde kentleşmenin kat mülkiyetine konu yapılarda yaygın olması sebebiyle ilgili zararlar çoğunlukla kat mülkiyetine konu yapılardan meydana gelmektedir. İşte bu sebeple kat maliklerini yapı maliki sıfatı ile kusursuz sorumluluklarının Kat Mülkiyeti Kanunu'na özgü“ortak yer”,“bağımsız bölüm”,“eklenti”,“tahsisli alan”gibi kavramlar çerçevesinde değerlendirilmesi tezimizin konusu olarak tercih edilmiştir. Bu kapsamda tezimizin birinci bölümünde genel olarak konunun sunumu ve amacı, tez konumuzda bağlantılı kanuni düzenlemeler, terminolojiye ilişkin bilgiler ve araştırma planımız anlatılacaktır. Tezimizin ikinci bölümünde genel kavramlar çerçevesinde yapı malikinin sorumluluğunu detaylandırmak amaçlanmaktadır. Bu bölümde öncelikle kusura dayanan ve kusursuz sorumluk kavramlarına ilişkin temel bilgiler verilecek, ardından tezimizin konusunu oluşturan Yapı Malikinin Kusursuz Sorumluluğunun bu temel bilgiler içindeki yeri tespite edilecektir. Ardından TBK m. 69 hükmü kapsamında sorumluluğun unsurları özellikle bina ve diğer yapı eserinin varlığı unsuru ve hukuka aykırı fiil unsuru detaylandırılarak açıklanacaktır. Son olarak ikinci bölümde sorumluluğun sonuçları kapsamında tazminat davasına ilişkin bilgiler ele alınacaktır. Tezimizin özellik arz eden üçüncü bölümünde kat maliklerinin yapı maliki sıfatı ile sorumluluğu Kat Mülkiyeti Kanunu hükümleri esas alınarak irdelenecektir."
