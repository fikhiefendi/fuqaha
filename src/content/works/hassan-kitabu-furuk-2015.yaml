abstract: "Tezmimizin amacı, Necmüddîn Ali b. Ebu Bekir en-Nîsâbûrî'nin muhtasar bir fıkıh niteliği taşıyan ve Türkiye kütüphanelerinde yazma halinde bulunan Kitabu'l-Furûk adlı eserinin edisyonunu yapıp eserin tanıtılmasıdır. Bu amacımızı gerçekleştirmek için, tezimizi bir giriş ve üç bölüme ayırdık: girişte tezimizin amacını ve önemini anlatmaya çalıştık. Birinci bölümde Nîsâbûrî'nin eserini inceledik. Eserin Nîsâbûrî'ye aidiyetini sorguladık. Daha sonra özelliklerini, furûk ilminin doğuşunu, önemini, kullandığı terimleri, eserdeki metodu mümkün mertebe ele almaya çalıştık. İkinci bölümde müellifin hayatı ve eserleri üzerinde durduk. Ardından tahkik ettiğimiz eserin nüshalarını tanıtmaya çalıştık. Üçüncü bölümde ise çalışma konumuz olan eserin nüshaları arasında karşılaştırmalar yaparak doğru ve anlaşılır bir metin ortaya koymaya gayret ettik."
