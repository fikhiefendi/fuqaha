abstract: "Bu çalışma hicrî 5.-7. yüzyıllar arasında Hârizm bölgesinde teşekkül eden Hanefî fıkıh okulunu ve bu okulun Hanefî mezhebi havzaları içinde nereye oturduğunun tespitini konu edinmektedir. Konunun sınırlandırılması bağlamında söz konusu fıkıh okulunun öncüsü olarak kabul edilen Ebû Imrân el-Bakkālî'den (ö. 452/1060) başlayarak zirve temsilcilerinden ez-Zâhidî (ö. 658/1260) ile son bulan tarihsel süreç ele alınmıştır. Çalışmada Hârizm fıkıh mektebinin oluşumuna etki eden coğrafi, sosyo-kültürel, örfî ve siyasî arka plan ayrıntılı biçimde incelenmiştir. Ayrıca bu okulun şekillenmesinde etkin olan kelami arka planı ele alınmıştır. Bu amaçla Hârizm fıkıh mektebinin ortaya çıkışındaki saikler ve entelektüel zemin araştırılmış; bu bağlamda Horasan, Semerkant, Buhara ve Belh fıkıh okullarıyla mukayeseli bir değerlendirme yapılmıştır. Yöntem olarak tarihsel analiz ve metin çözümlemesi benimsenmiştir. Metin analizinde ise literatür taraması, belge incelemesi, tümevarım, saha verilerinin değerlendirilmesi ve mukayeseli yorumlama gibi alt tekniklerden faydalanılmıştır. Araştırma neticesinde Hârizm fıkıh okulunun kelâm ve usûl-i fıkıh alanlarında büyük ölçüde Irak Hanefîliğinden beslendiği ve bu çevreye mensup âlimlerin görüşleri ile etkileşim içinde olduğu müşahede edilmiştir. Bununla birlikte Hârizm'in kendine özgü coğrafi, tarihî ve sosyo-kültürel dinamikleri dikkate alındığında bu mektebin zamanla özgün bir dönüşüm geçirdiği ve klasik Irak Hanefîliğinden ayrışan bazı özellikler kazandığı görülmüştür. Bu okulun ayırt edici yönlerinden biri olarak kelâm ilminin etkin şekilde kullanılması ve kelâmî eğilim olarak Mu'tezile ekolünün benimsenmesi tespit edilmiştir. Ancak bu Mu'tezilî düşünce, zaman içinde bölgenin ilmî ve sosyal şartlarına bağlı olarak evrilmiş ve klasik Bağdat Mu'tezilesi'nden farklı, yerel ve özgün bir kimlik kazanmış ve Hârizm'deki bu Mu'tezilî eğilim belirgin şekilde“Sünnî eğilimli Mu'tezilî düşünce”ya da“Ehl-i Sünnet'e yakın duran bir Mu'tezilî düşünce”karakterine dönüşmüştür. Ayrıca bu okulun mensuplarının örf ve maslahata dayalı istihsan yöntemini ve kolaylık ilkesini benimsedikleri, bunu kazâ ve fetvâ alanında ortaya koydukları da görülmüştür."
