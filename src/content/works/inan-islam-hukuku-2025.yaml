abstract: "“İslam Hukuku Açısından Otizmli Bireylerin Hakları”adlı bu tez, İslam dininin temel prensipleri doğrultusunda dezavantajlı grupların haklarını koruma anlayışını merkeze alarak, özelde otizmli bireylerin İslam hukukundaki haklarını sistematik bir şekilde incelemeyi amaçlamaktadır. İslam fıkhında bu konunun dağınık bir şekilde ele alınmış olması ve modern dönemdeki artan farkındalık, bu alanda kapsamlı bir çalışmanın gerekliliğini ortaya koymaktadır. Bu çalışma, İslam hukukundaki ilgili bilgileri bir araya getirerek, otizmli bireylerin haklarını ve ihtiyaçlarını detaylı bir şekilde ele alacak ve modern hukuk sistemlerindeki benzer düzenlemelerin İslam hukukundaki köklerini bilimsel bir metotla ortaya koyacaktır.Tezin temel hedefleri, otizmli bireylerin haklarının İslam hukukundaki önemini ve bağlayıcılığını açıklamak, bu konuda aileler, toplum ve devlet nezdinde farkındalık ve sorumluluk bilinci oluşturmak, hakların teslim edilmesiyle otizmli bireylerin toplumsal katılımına katkı sağlamak ve İslam hukukunun bu konudaki kapsamlı yaklaşımını vurgulamaktır.Araştırmanın temel problemi, günümüzde sayıları artan ve karmaşık ihtiyaçlara sahip otizmli bireylerin haklarının İslam hukuku çerçevesinde nasıl ele alındığı ve bu hakların neler olduğunun belirlenmesidir. Bu amaçla tümdengelimsel ve analitik yöntemler uygulanacak, şer'i metinler incelenecek, fıkıh mezheplerinin görüşleri karşılaştırılacak, deliller değerlendirilecek ve fıkıh kuralları çerçevesinde çözümler üretilecektir. Bu çalışma, İslam hukukunda otizmli bireylerin haklarını detaylı bir şekilde inceleyerek literatürdeki boşluğu doldurmayı, farkındalığı artırmayı ve hem İslami ilimler hem de sosyal politika ve hukuk alanlarına değerli katkılar sunmayı amaçlamaktadır. İslam'ın dezavantajlı bireylere yönelik merhametli yaklaşımını bilimsel bir zeminde yeniden değerlendirerek, günümüzdeki benzer sorunlara İslami perspektiften çözüm önerileri sunma potansiyeli taşımaktadır."
