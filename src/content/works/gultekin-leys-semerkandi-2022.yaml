abstract: "ÖZET Ebü'l-Leys Semerkandî (v. 373/983) Horasan-Mâverâünnehir bölgesinde yaşamış, daha çok fıkıh ilminde tebarüz ve temeyyüz etmiş, meşhur bir Hanefî fakihi, çok yönlü velut bir âlimdir. Her biri Hanefî mezhebi edebiyatının alt dallarında kurucu metin sayılabilecek fıkıh eserlerinin yanı sıra, rivayete dayalı bir tefsiri ile mev'iza türü eserleri de vardır. Bu eserlerinde kelâmî görüşlerini de ortaya koymuş aynı zamanda bir sufi olarak meşhur olmuştur. Temel İslâm ilimlerinin hemen her alanında eser vermiş bir âlim olarak Ebü'l-Leys'in hadis ilimlerinden müstağni olduğu düşünülemez. Eserlerini büyük ölçüde merfû ve mevkûf hadislerle oluşturmuştur. Nevâzil ve hilâfiyat edebiyatının ilk örneklerinden sayılan fıkıh eserlerinde, Hanefî ulemasının hadislere dayanan görüşlerini aktarmıştır. Mâverâünnehirli fakihlerden olan Ebü'l-Leys'in ilmî metodu, ehl-i re'yin metodudur. Onun eserlerini hadis ilimleri açısından değerlendirmek, adına ilk zamanlarda ehl-i re'y denilen Hanefî ekolün IV. yüzyılda hadis ilimlerine ve sünnete bakışını tespit etmeye bir nebze yardımcı olacaktır. Zira onun eserleri ve üslubu, bu mezhebin içinde ehl-i hadise yakın bir damarın olduğunu da ispat eder niteliktedir. Ebü'l-Leys, Horasan-Mâverâünnehir Hanefîliği'nin Irak Hanefîliği'nden ayrıştığı, kendisine bir yol aradığı, yeni arayışların ve güncel ifadeyle kafa karışıklıklarının olduğu bir dönemde yaşamış ve eserler vermiştir. Bir yandan yeni Müslüman olan soydaşlarına basit, anlaşılması ve uygulanması kolay, pratik bilgiler verirken, bir yandan da fıkhî kuralları içinde yaşadığı topluma uyarlama gayesi gütmüştür. Tavsiye ettiği zühd yaşantısını ve toplumun ihtiyacı olarak gördüğü ahlakî kuralları sabit naslara oturtmak ve bu kuralları hurafe ve bidatlerden arındırmak gayreti taşımıştır. Bunun için de hadislere, ahbâr ve âsâra başvurmuş, bu arada gerek hadis ile ilgili bazı usul kuralları ortaya koymaya çalışmıştır. Bu çalışma onun tefsiri, mev'iza ve fıkıh eserlerinin üzerinden sünnete, hadise ve hadis ilimlerine yaklaşımını tespit etmek üzere yapılmıştır."
