abstract: "Taşınmaz mülkiyeti hukukun en ilkel dönemlerinde mutlak, kutsal ve sınırlanamaz olarak kabul edilmiş olsa da bu dönemlerde dahi başka hukukî dayanaklar ile malikin mülkiyet hakkından doğan yetkileri sınırlanmıştır. Günümüzde de kanun veya sözleşme ile mülkiyet hakkından doğan yetkilerin sınırlanabildiği görülmektedir. Kanunlarda öngörülen yasal sınırlamalara uyulmaması, TMK m. 730 kapsamında taşınmaz malikinin sorumluluğuna sebebiyet vermektedir. Taşınmaz mülkiyetinin yasal sınırlarına uyulmaması kanunda“taşkınlık”olarak adlandırılmakta ve taşkınlığın yerel âdete uygun ve kaçınılmaz boyutta olup olmamasına göre sorumluluk kendi içerisinde, hukuka aykırı taşkınlıklardan sorumluluk ve hukuka uygun taşkınlıklardan sorumluluk şeklinde ikiye ayrılmaktadır. Taşınmaz malikinin hukuka aykırı taşkınlıklardan sorumluluğu, TMK m. 730/I'de düzenlenen kusursuz sorumluluk türüdür. Düzenleme; sorumluluğun yaptırımı olarak tazminat davasının yanında, devam eden taşkınlığın durdurulması için eski hâle getirme davası ve zarar tehlikesi varsa giderilmesi için tehlikenin giderilmesi davası öngörmektedir."
