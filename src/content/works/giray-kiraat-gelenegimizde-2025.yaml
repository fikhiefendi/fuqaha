abstract: "Kıraat ilmi, hicrî beşinci yüzyıla kadar infirâd usulüyle tedris edilmiş olup herhangi bir sayısal sınırlamaya tabi tutulmamıştır. Ancak, hicrî beşinci yüzyıldan itibaren dokuzuncu yüzyıla değin kırâat-i sebʿa, dokuzuncu yüzyıldan itibaren ise kırâat-i aşere esas alınarak indirâc usulü benimsenmiştir. Kıraat tedrisatında kırâat-i aşere sistemine geçilmesi, İbnü'l-Cezerî'nin (ö. 833/1429) en-Neşr fi'l-kırâ'âti'l-ʿaşr adlı eserinin yaygınlaşmasıyla gerçekleşmiştir. Ancak, indirâc usulünün bir sonucu olarak kıraat vecihlerine ait tarik sayısının artması, telfîk (birleştirme) ve takyîd (sınırlandırma) gibi sorunları beraberinde getirmiş ve bu durum, tahrîrât çalışmalarını zorunlu kılmıştır. Osmanlı dönemi kıraat tedrisatına yön veren temel eserlerden olan İbnü'l-Cezerî'nin en-Neşr ve bu eserin manzum hali olan Ṭayyibetü'n-Neşr, tahrîrât araştırmalarına ve neticesinde farklı kıraat mesleklerinin ortaya çıkmasına zemin hazırlamıştır. Bu bağlamda, Osmanlı kıraat tedrisatında teşekkül eden mesleklerden Şeyh Atâullah mesleği, günümüzde İstanbul ve Anadolu coğrafyasında en yaygın olarak okutulan kıraat eğitim ve öğretim metotlarının başında yer almaktadır. Şeyh Atâullah mesleği, diğer mesleklerden usul ve ferşü'l-hurûf açısından farklılaşmaktadır. Mesleğin aşru's-suğrâ aşamasındaki kıraat vecihlerine yaklaşımında ruhsat prensibi benimsenirken, bu prensip Muhammed Ârif el-Hıfzî'nin (ö. 1238/1822) Muğni'l-ḳurrâ fî Şerḥi Muḫtâru'l-iḳra, Abdülfettâh el-Paluvî'nin (ö. 1173/1759) Zübdetü'l-ʿirfân fî vücûhi'l-Ḳur'ân ve Molla Mehmed Emin Efendi'nin (ö. 1275/1859) ʿUmdetü'l-ḫullân fi iḍâḥi Zübdetü'l-ʿirfân adlı eserlerinde ortaya konmuştur. Mesleğin aşru'l-kubrâ aşamasında ise yer yer azimet prensibinin tercih edildiği, Güllü Hâfız olarak bilinen Yusuf İmamzâde Ahmed er-Rüşdî'nin (ö. 1217/1802) Mürşidu'ṭ-ṭalebe ilâ iḍâḥi vücûhi baʿḍi âyâti'l-Ḳur'âniyye ve Mehmed Emin Efendi'nin Züḫrü'l-erîb fî iḍâḥi'l-cemʿ bi't-taḳrîb adlı eserlerinde tespit edilmiştir. Şeyh Atâullah mesleğinin aşru'l-kubrâ aşamasında azimet prensibiyle hareket ettiği durumlarda Yûsufefendizâde Abdullah Hilmi'nin (ö. 1167/1754) el-İ'tilâf fî vucûhi'l-iḫtilâf, Mustafa el-İzmîrî'nin (ö. 1154/1741) Bedâ'iʿu'l-burhân ʿalâ ʿUmdeti'l-ʿirfân adlı eserlerine başvurulduğu görülmüş ve bu durum örneklerle desteklenmiştir. Bu durum, adı geçen âlimlerin kıraat tercihlerinin Şeyh Atâullah mesleğinin aşru'l-kubrâ aşamasıyla kısmen örtüştüğünü göstermektedir. Çalışmada Atâullah mesleğinin, özellikle azimet prensibini esas alan mesleklere kıyasla günümüze kadar varlığını sürdürmesinin altında yatan nedenler incelenmiştir. İ'tilâf ve Mutkîn meslekleri azimet prensibiyle hareket etmelerine rağmen, ruhsat prensibini benimsediği düşünülen Şeyh Atâullah ve Sûfî mesleklerine göre kıraat eğitiminde neden varlıklarını devam ettiremedikleri sorusu araştırılmıştır. Şeyh Atâullah mesleği özelinde, bu mesleğin tarihsel olarak diğer mesleklere göre daha sonra ortaya çıkmış olması dikkate alındığında, ruhsat prensibine yönelik taassubî bir yaklaşım sergilemediği ve bazı durumlarda azimet prensibini de uyguladığı tespit edilmiştir."
