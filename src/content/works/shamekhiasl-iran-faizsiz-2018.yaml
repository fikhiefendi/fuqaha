abstract: "Bu çalışmada İran ve Türkiye'deki faizsiz bankacılık sistemleri karşılaştırılarak dünyada giderek yaygınlaşan faizsiz bankacılık sistemi incelenmiştir. İran'ın seçilmesinde hem İran'a uygulanan ambargonun kaldırılmasıyla dünyaya açılan İran pazar hacminin tüm Dünya ülkelerinin merceğinde olması hem de İran-Türkiye arası bankacılık sektöründe yapılabilecek yatırımların büyüklüğü etken olmuştur. Türkiye açısından da yeni fırsatlar doğurabilecek bu durum oldukça önemlidir. Bu nedenle, tezde de İran'ın bankacılık faaliyetleri, Türkiye bankacılığı ile benzerlikleri ve farklılıkları ele alınmıştır. Ayrıca, her iki ülke faizsiz bankacılık uygulamaları İslami bankacılık açısından da değerlendirilmiştir. Türkiye ve İran katılım bankacılığı uygulamaları fon toplama ve kullandırma işlemlerinde farklı adlar ile ifade edilen yöntemler ile gerçekleştirilse de; birbirleriyle farklılık ve benzerlikleri mevcut olup, İslami sistem ile de çelişmemektedir. Özellikle Türkiye açısından giderek ilgi gören ve yatırımları da giderek artan bir sistem haline gelmiştir. Son dönem yapılan düzenlemeler, reel sektörün neredeyse tamamını oluşturan KOBİ'leri daha fazla destekleyerek Türkiye'nin istikrarlı büyümesine katkı sağlayan faizsiz bankacılığın giderek daha hızlı büyüyeceğini göstermektedir. Bununla birlikte, Türkiye'nin çok uluslu mekanizmalardaki etkinliği de göz önünde tutulursa İran ile birlikte yapılabilecek projelerle uluslararası sistemin yaygınlaştırılmasına katkı sunulabilir."
