abstract: "Genel manada İslam Tarihinde, özelde ise Fıkıh Tarihi'nde büyük etkiler meydana getiren Mihne hadiseleri; mezhepler çatışmasına dönmesi, toplum içinde fırkalaşmalara yol açması, siyasal bir politika aracına dönüşmesi, bir tekfir aracı olarak kullanılması, baskı ve eziyet için kullanılması vb. nedenler sebebi ile birçok yönden üzerinde araştırma yapılması gerekli bir konudur. Bu nedenle çalışmamızda öncelikle Mihne kavramının sözlük ve terim anlamları açıklanacaktır. Mihne'nin ortaya çıkışında etkisi olan isimler ve nedenler açıklanacaktır. Çalışmamız Giriş ve Birinci Mihne Dönemi ve İkinci Mihne Dönemi, Sonuç ve Kaynakça bölümünden oluşacaktır. Mihne Dönemleri'nin fakihler üzerindeki etkisi özellikle de Hanefî kadılar üzerindeki etkisinden bahsedilecektir. Birinci bölümde 2. Mihne Dönemi hadiselerinin daha iyi anlaşılabilmesi için 1. Mihne Dönemi'nde yaşananlara ve Hanefî âlimleri ile o dönemki yaşadıklarına ve görüşlerine detaylıca değinilecektir. İkinci Bölümde ise yaşanan 2. Mihne hadiselerinin ardından Hanefî âlimlerinin yaşadığı baskı, eziyet ve zulümelere değinilecek, görevinden azledilen Hanefî Kadılar aktarılacaktır. Hanefîlerin sürgün edilip farklı coğrafyalara gitmelerinden ve bu süreçte yaşananların Hanefîler içerisinde farklı görüşlere neden olmasından bahsedilecektir. Ehl-i Hadîs'in ve Ehl-i Rey'in mücadelesinin temelindeki nedenlerden birinin de Kur'ân-ı Kerim'in yaratılmışlığı üzerinde yaşanan hadiseler olduğuna değinilecektir."
