abstract: "Bu çalışma Bağdat'ta İmâm-ı Âzam Ebû Hanîfe'nin kabrinin yanıbaşında Selçuklular tarafından kurulan İmâm-ı Âzam Medresesi'nin kurumsal tarihini konu edinmektedir. Bağdat Nizâmiye Medresesi ile çağdaş olan Meşhed-i Ebû Hanîfe'nin inşası 5 Mayıs 1067'de tamamlanmış ve eğitim-öğretime açılmıştır. Meşhed-i Ebû Hanîfe Medresesi Büyük Selçuklu Sultanı Alp Arslan'ın mâli işlerden sorumlu veziri Şerefü'l-Mülk Sa´d el-Harezmî tarafından yaptırılmıştır.Meşhed-i Ebû Hanîfe, kütüphanesi, derslikleri, mescidi, yemekhane ve yatakhane imkânlarıyla yatılı bir okul hüviyeti kazanan medreseler zincirinin ilklerindendir. Medresenin, burada bulunan öğretim ve hizmet personelinin yanında öğrencilerin de maddi ihtiyaçlarını gideren vakıf gelirleri bulunmaktaydı. Medrese yönetiminin yanında bir de vakıf yöneticisi bulunmaktaydı. Fakat bu kadro çoğunlukla medreseye atanan müderrislerin uhdesine bırakılmaktaydı. Kimi vakıf yöneticisi müderrislerin, yolsuzluklara karıştığını görmekteyiz. Bu iddialarla yargılanıp görevinden uzaklaştırılan hatta hapse atılanı bile olmuştur.Medresede okutulacak derslerin Hanefî mezhebine göre yapılması kurucu vâkıf tarafından şart koşulmuştur. Kütüphane öğrenci ve araştırmacı fakihlerin hizmetinde olup, bu şubenin başında bulunan hâzin yaptığı her işten ötürü müderrise hesap vermek durumundaydı. Müderrislerin atama ve azilleri de, Bağdat'taki siyâsî çalkantının tesirinde kalmıştır. Fakihler arası nüfuz mücadelesi siyâsî mahfillerde de karşılık bulmuş, halîfeler dahi fakihlerin nüfuzuyla meşruiyet kazanma girişiminde bulunmuşlardır.Meşhed-i Ebû Hanîfe'de Hanefî fıkıh ekolünde çok büyük şöhrete sahip Ebû Tâlib ez-Zeynebî, Ziyâüddîn et-Türkistânî, Abdullah b. Mahmud el-Mevsılî, Lamğânî, Siğnâkî, İbnü'l-Fasîh, İtkânî gibi fakihler de görev yapmıştır. Moğol İstilasından sonra da öğretime devam ettiği anlaşılan Meşhed-i Ebû Hanîfe Osmanlı Devleti zamanında yapılan yenileme ve tadilatlarla günümüze kadar gelmiştir. Binalarıyla olmasa da kurumsal yapısıyla varlığı halen devam eden Meşhed-i Ebû Hanîfe Medresesi bin yıllık tecrübesiyle köklü bir geleneğin temsilcisi konumundadır."
