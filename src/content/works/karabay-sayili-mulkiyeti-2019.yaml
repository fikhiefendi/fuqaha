abstract: "Kat Mülkiyeti, şehirleşme ve nüfus yoğunluğunun artmasıyla dikey yapılaşmanın oluşturduğu sorunlara çözüm olarak getirilmiş özel bir mülkiyet türüdür. Nüfus artışı ile birlikte yaşanan büyüme ve yine aynı hızla artan şehirleşme, bu alanda yaşayan bireylerin birtakım problemler yaşamasını kaçınılmaz kılmaktadır. Bu problemlerin çözülmesi için 23.6.1965 tarih ve 634 sayılı Kat Mülkiyeti Kanunu düzenlenmiş ve bu kanunla maliklere birtakım hak ve borçlar da yüklenmiştir. Bu hak ve borçlar Kat Mülkiyeti Kanunu'nun üçüncü ve dördüncü bölümlerinde düzenleme alanı bulmuştur. Bu bölümler ile bir yanda maliklerin, mülkiyet hakkının sağladığı menfaatlerden yararlanmasına ilişkin hükümler bir yanda ise bu hakların sınırlarını belirleyen yükümlülükler düzenlenmiştir. Bu çalışmamızda 634 sayılı Kat Mülkiyeti Kanunu ve güncel yargı kararları çerçevesinde, kat maliklerinin hak ve borçlarının neler olduğu ve hangi şartlarda bu hak ve borçlardan sorumlu oldukları incelenme konusu yapılmıştır. Bu çalışma yapılırken 634 sayılı Kat Mülkiyeti Kanunu'nun 15-16. maddeleri ve 18-25. maddeleri temel alınmış ve bu konudaki çelişkilerin giderilmesi amaçlanmıştır."
