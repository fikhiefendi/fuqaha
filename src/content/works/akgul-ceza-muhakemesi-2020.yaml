abstract: "Uzlaştırma, temellerini onarıcı adalet anlayışından alan bir alternatif uyuşmazlık çözüm yöntemidir. Onarıcı adalet anlayışına uygun olarak merkezine mağduru alır. Mağdurun hak ve taleplerine önem verir. Zira artık gelişen dünyada insanlar yargılama sürecinde söz sahibi olmayı duygu ve düşüncelerinin önemsenmesini istemektedirler. Bu istekler, oldukça uzun bir süre hukuk sistemlerindeki egemenliğini korumuş olan cezalandırıcı adalet sisteminin alternatiflerin aranmasına neden olmuştur. İşte onarıcı adalet anlayışının bir ürünü olarak uzlaştırma kurumu da Türk ceza adalet sistemindeki yerini almıştır. Uzlaştırma ile bir taraftan mağdurların yargılama sürecine daha aktif olarak katılması sağlanırken, diğer taraftan faillerin eylemlerinin neticesini görerek sorumluluk alması ve pişmanlık duyması sağlanır. Taraflar arasındaki husumetin bitirilmesi nedeniyle de toplumsal barış yeniden kurulur ve husumet dava haline dönüşmeden sonlandığı için yargının iş yükünün de azalması sağlanır. Batı hukukundan İslam hukukuna kadar birçok hukuk sisteminde genel kabul görmüş bir kurum olan uzlaştırma esasen“ortak aklın bir ürünüdür”. Küresel çapta bir gelişme gösteren kurum, hukuk sistemimize girdiği 2005 yılından bu yana da sürekli olarak değişim ve gelişim göstermektedir. Bu gelişim ve değişimlerin esas gayesi kuruma işlerlik kazandırmaktır. Bu çalışmamızda, onarıcı adalet kavramı ve alternatif çözüm yolları, uzlaştırma kavramı, hukuki niteliği, amacı ve faydaları, tarihçesi ve karşılaştırmalı hukukta uzlaştırma, uzlaştırmanın esasları ve uzlaştırmanın usulü konuları işlenmiştir."
