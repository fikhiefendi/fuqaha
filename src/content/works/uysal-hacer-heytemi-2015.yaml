abstract: "Bu çalışmada Heytemî'nin“el-Fetâva el-hadîsiyye”adlı eseri incelenmiş olup hadislerle konulara yaklaşımı ve hadis anlayışı konu edinilmiştir. Hicrî X. asırda yaşamış olan Heytemî'nin konulara hadislerle bakış açısı tesbit edilmeye çalışılmış olup hadis yorumculuğu ortaya konulmaya çalışılmıştır. Tezin birinci bölümünde Heytemî'nin Hayatı ve yaşadığı dönemin siyasî, kültürel ve sosyal olaylarının, hadisleri yorumlamasında Heytemî'ye etkileri incelenmiştir. Diğer taraftan Heytemînin hocaları ve talebeleri de ele alınmıştır. İkinci bölümde ise Heytemî'nin“el-Fetâvâ el hadîsiyye”si incelenmiş olup eserin içeriği, kullanılan kaynaklar, eser üzerine yapılan değerlendirmeler ve Heytemî'nin peygamber tasavvuru ele alınmıştır. Sonuç olarak, Heytemî eserini oluştururken problemlere yaklaşımında hadisleri yoğun bir şekilde kullandığı, çok çeşitli kaynaklardan faydalandığı, yaşadığı dönemin sosyal ve kültür yapısının üzerinde etkili olduğu ve hadislere yaklaşımında mütesahil davrandığı söylenebilir."
