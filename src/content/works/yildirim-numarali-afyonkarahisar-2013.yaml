abstract: "Genel ve yerel yönetim modeli, sosyal hayat ve iktisadi hayata dair önemli bilgilerin bulunması nedeni ile Şer`iyye Sicilleri, tarih çalışmalarının ana kaynaklarının başında gelmektedir. Bu çalışmada H.1134-1135 (M.1722-1723) yılları arasını kapsayan 535 Numaralı Karahisâr-ı Sâhib Şer'iyye Sicili incelenmiştir. Bu defter, Karahisâr-ı Sâhib Sancağına ait olmakla birlikte, Osmanlı Devleti?ni genel olarak ilgilendiren para-fiyat, alım-satım, vergi, adli vakalar vb. belgeleri muhtevi olması sebebiyle ayrıca önem taşımaktadır. Defterde bulunan 178 belgenin transkripsiyonu yapılarak değerlendirilmiştir. Buna göre tez, giriş bölümü hariç üç ana bölümden oluşmuştur. Bu çalışma ile, gerek defterdeki belgelerden ve gerekse diğer kaynaklardan faydalanılarak Afyonkarahisar hakkında yapılacak başka araştırmalara katkı sağlayacak bir tez vücuda getirilmeye çalışılmıştır."
