abstract: "Çalışmamızda, İslâm dininin temel amaç ve gayelerini ortaya koyan makâsıdu'l-Kur'ân'ın temel ahlâkî öğretilerini anlamayı ve değerlendirmeyi amaçladık. Bizi bu çalışmaya sevk eden iki sebep bulunmaktadır; ilki, Kur'ân'a göre ahlâk ilkelerinin nesnelliğinden ve evrenselliğinden bahsetmemizin mümkün olup olmadığıdır. Ahlâkın, insanın varoluşu/fıtratı ve tevhid ilkesi ile ilişkisinden doğan değerlerin bu manada bir anlamı olup olmadığıdır. İkincisi, Kur'ân'ın emir ve hükümlerini koyması ile gözettiği gayelerin ahlâkla ilişkisini ele almaktır. Makâsıdu'l-Kur'ân'ı, ulemanın belirlediği“makâsıdü'ş-şeria”daki beş tümel amaç kapsamında dinin, canın, aklın, neslin ve malın değerlendirmesi ile ele almaya çalıştık. Kur'ân'ın bu temel ilkeler çerçevesinde, herhangi bir hükme koyduğu gaye ve amacı tevhidî ahlâk üzerinden inşa etmesi ayrıca, onun ahlâk nosyonunu ortaya koymaktadır. Bu perspektifle konuya yaklaşılması, Kur'ân'ın gaye güdücü ahlâk felsefesini anlamaya katkı sağlayacağı düşüncesini de ortaya çıkarmıştır."
