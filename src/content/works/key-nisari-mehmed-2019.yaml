abstract: "Bu çalışmada, 17. yy. da yaşamış olan Nisâri Ali Efendi'nin hayatı ve el-Fevâidü'l-Aliyye eseri incelenmiştir. Eserde yer alan fıkıhla ilgili fetvalar tezin ana konusunu oluşturmaktadır. Fetva mecmuaları yazıldığı dönemin sosyal, siyasal, kültürel, iktisadi ve hukuki yapısına ışık tutmaktadır. Ele alınan fetvaların, dini problemlerin yanı sıra beşerî ilişkileri düzenleyici ve çözüme kavuşturucu bir misyona sahip olduğu anlaşılmaktadır. Bu bağlamda Nisâri Ali Efendi'nin el-Fevâidü'l-Aliyye'si önemli bir fetva mecmuası olup 17. yy. Osmanlı devletinin toplum yapısını yansıtmaktadır. Nisâri Ali Efendi gerek dini ilimler gerekse lügat bakımından donanımlı bir müftüdür. Nitekim fıkıh ilminin yanında diğer alanlardaki fetvaları bunu desteklemektedir. Fetvalarında çoğunlukla Hanefî mezhebi çerçevesinde hareket etmiştir. Görüş farklılıkları varsa bunlara değinmiş ve şahıslara atıfta bulunmuştur. Meselelere ilişkin çeşitli eserlerden nakiller getirmiştir. Birçok fetvada eser, müellif ve şeyhülislamlara atıfta bulunarak görüşlerini kuvvetlendirmiştir. Nisâri Ali Efendi, diğer dini disiplinlere vukufiyeti neticesinde fetvalarında bütüncül bir bakış açısı yakalamıştır. Müellifin görüşler arası tercihte bulunduğu da vakidir. Ayrıca zamanın değişmesi ile ahkâmın değişeceği ilkesini gözetmesi, örf, istihsan, istishab ve mesâlih-i mürsele gibi fer'î delillere yerinde müracaat etmesi fıkhın dinamikliği ve İslam hukukunun evrenselliği açısından önemli bir özellik taşımaktadır."
