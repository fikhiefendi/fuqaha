abstract: "Fıkıh Usulü, İslamî ilimlerde çalışmalar yapanlar için temel ilim olma özelliğini devam ettirmektedir. Bu disiplin zihni açan, dini nasların korumasını sağlayan, araştırma yapan ilim adamlarına sınır ve çerçeve sunan bir ilimdir. Usûlcülerin farklı metod ve yaklaşımları İslam kültür, düşünce ve medeniyetinin gelişmesi katkı sağlayan bir zenginliktir. Fıkıh Usulü İslam'ın kolaylık ve hoşgörü yönünü açığa çıkarmakla beraber dinî, amelî ve fıkhî hükümlerin açıklanmasına olanak sağlamaktadır. Bu ilim aynı zamanda fikrî ve fıkhî anlamda İslam'ın özüne karşı yapılan saldırılarda savunma görevini üstlenmektedir. Bu çalışma Tûfî'nin el-Bülbül ve Şîrâzî'nin el-Luma' adlı eserlerinin usul alanındaki farklı görüşlerini ve ortak noktalarını tespit etmeyi hedeflemektedir. Çalışmamız, Hanbelî usulcülerden Tûfî'nin usul alanındaki görüşlerini, Şafiî usulcülerden olan Şîrâzî'nin görüşleriyle karşılaştırması bakımından önem arz etmektedir. Çalışmada istikra yöntemi, analitik değerlendirme ve tanımlayıcı metotlar kullanılmıştır. Mukaddime kısmında konuyu seçme sebebinden, araştırmanın öneminden ve yönteminden bahsedilmiştir. Çalışma dört bölüm olarak ele alınmıştır. Birinci bölümde Şîrâzî'nin ve Tûfî'nin hayatı, nesebi, ilmi geçmişleri ve yaşadıkları muhitleri, ilim hayatına katkıları, fıkhî görüşleri ve vefatları açıklanmıştır. İkinci bölümde iki müellifin kitap, sünnet, icmâ, kıyas ve nesh konularındaki ihtilaflı görüşleri ele alınmıştır. Üçüncü bölümde lafız ve lafzın manaya delaleti iki müellefin görüşleri etrafında mukayeseli olarak analiz edilmiştir. Dördüncü bölümde ictihâd, tâklid ve tearuz olguları cem-telif mükellefin durumu ve sahabe kavli incelenmiştir. Çalışmamızın baştan sona bütün bölümleriyle Şîrâzî ve Tûfî'nin usul alanındaki ihtilaflı görüşleri çerçevesinde şekillenmiştir. Her konuda iki müelllifin ihtilaflı görüşleri, ittifak ettikleri görüşleriyle birlikte ele alınmıştır. Araştırmada iki ilim âlimin otuzbeş konuda farklı görüşlere sahip olduğu tespit edilmiştir. Her iki usulcünün aralarındaki ihtilafın lafzî mi öze dönük biçimde manevî mi olduğu gerekçeleriyle birlikte ortaya konulmuştur. İki müellifin ihtilaflı görüşleri, diğer usulcülerin görüş ve değerlendirmeleriyle sentezlenmiş ve ihtilaflı görüşler arasında tecihe gidilmiştir."
