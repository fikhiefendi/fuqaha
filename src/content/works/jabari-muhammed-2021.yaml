abstract: "Bu araştırma Arapça ve Türkçe olmak üzere iki kısımdan oluşmaktadır. Tezin Arapça kısmı el-Hâvî fi'l-fetâva'nın tahkikinden oluşmaktadır. Türkçe kısım bir giriş, iki bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmından sonra birinci bölümde Hasîrî'nin eseri öncesinde yazılmış fetva ve nevazil türü eserler hakkında bilgi verilmek suretiyle Hasîrî'nin eserinin fetva ve nevâzil literatürü içindeki yerinin belirlenmesine çalışılmış ayrıca birçok âlim gibi Hâsirî'nin de yetiştiği bir coğrafya olması sebebiyle Mâverâünnehir bölgesinin genel özellikleri ve tarihinden kısaca bahsedilmiştir. İkinci bölümde Hasîrî'nin hayatından söz edildikten sonra araştırmaya konu olan el-Hâvi fi'l-Fetâvâ adlı eserin ele alınmış ve müellifin fetva seçimindeki yöntemine ışık tutacak bazı örnek fetvaların tahlili yapılmıştır. Çalışmanın genel amacı hicrî V.yüzyıl Mâveraünnehir Hanefî fıkhında önemli bir yere sahip olan Ebubekir el-Hasîrî'nin, fetva literatürü arasında müstesna bir yere sahip olan el-Havî fi'l-fetâva adlı eserinin muamelat bölümünün edisyon kritiğini (tahkiki) yaparak ilim dünyasına kazandırmak ve tahkik edilen bölümün tahlilini yapmak suretiyle Mâveraünnehir Hanefî fıkıh literatürünün genel yapısı hakkında bazı tespitlerde bulunmaktır. Edisyon kritik ile daha önce yayınlanmamış olan eserin ilim dünyasına kazandırılması ve eserde yer alan ancak günümüze gelmemiş olan fetva literatürü hakkında bölge ve döneme ilişkin önemli bir veri tabanı sunmayı amaçladık. Çalışmanın tahlil bölümünde ise hem Hanefî fıkıh literatürü hem de el-Hâvî adlı eserde yer alan fetvaların seçiminde dikkate alınan hususlar öne çıkarılmaya çalışılmıştır. Eserin edisyon kritiğinde Türkiye'de bulunan yazma nüshaları esas alınmış, Türkiye Diyanet Vakfı İslam Araştırmaları Merkezi'nin (İSAM) belirlediği tahkik yöntemine uyulmuştur. Hâsîrî'nin eseri Hanefî fetâvâ literatürü alanında çok farklı kaynaklardan yararlanarak telif edilmiş olduğundan zengin bir içeriğe sahip oluğunu tespit ettik."
