abstract: "Bu çalışmanın amacı hakiki şahısların cezaî mesuliyetini Afgan Ceza Hukuku ve Caferi fıkhı ile mukayeseli bir şekilde ele almaktır. Cezaî mesuliyet ?insanın kendi seçimiyle anlamı ve sonucunu idrakinde olarak işlediği, hukuk nizamınca suç sayılan fiilin ceza niteliğindeki yaptırımlarına katlanmasını? ifade eder. Cezaî mesuliyetin şartları, yaşayan insan olmak, idrak sahibi olmak, irade hürriyetine sahip olmak, yasaklanan bir fiili işlemektir. Bu şartlardan yoksun olan şahısların cezaî sorumluluğundan bahsetmek mümkün değildir. Çalışmamız giriş, iki bölüm ve sonuçtan oluşmuştur. Çalışmamızın birinci bölümünde suç, ceza ve mesuliyet kavramları Afgan Ceza Hukuku açısından incelenmiştir. Ayrıca cezai mesuliyetin esası hakkında batılı hukukçular ve İslam âlimlerinin görüşlerine de değinilmiştir. İkinci bölümde ise cezai mesuliyeti düşüren sebepler başlığı altında yaş küçüklüğü, akıl hastalığı, ikrah ve ölüm'ün cezaî mesuliyeti etkisi Afgan Ceza Hukuk ve Caferi fıkhı ile mukayeseli bir şekilde anlatılmıştır. Yine bu bölümde cezaî mesuliyeti hafifletici sebepler başlığı altında hata, sarhoşluk, zaruret hali, uyku hali, baygınlık, unutkanlık ve cehaletin cezaî mesuliyeti etkisi Afgan Ceza Hukuku ve Caferi fıkhı açısından mukayeseli bir biçimde ele alınmıştır."
