abstract: "Tezimizin başlığı, Türk Medeni Kanunu'nda kendi malzemesini kullanarak başkasının arazisinde haksız yapı meydana getirilmesidir. Tezimiz giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Giriş kısmında, konunun önemi, tarihsel gelişimi ve bazı hukuk düzenlerinde ele alınış biçimi incelenmiştir. Bu kapsamda, Roma Hukuku ve Mecelle?ye temas edilmiş, daha sonra ise Türk Hukukunda konunun tarihsel gelişimi ortaya konularak, haksız yapı kurumunun nasıl bir gelişim geçirdiği, gerek 743 ve 4721 sayılı Medeni Kanunlar gerekse de diğer yasal mevzuat göz önüne alınarak incelenmiştir. Son olarak bazı hukuk düzenlerinde konunun düzenleniş biçimi ele alınarak, özellikle İsviçre, Alman ve Avusturya Hukuklarına değinilmiştir. Çalışmamızın birinci bölümünde, haksız yapının türleri, haksız yapının bir türü olan ve tez konumuzu da oluşturan, kendi malzemesini kullanarak başkasının arazisinde haksız yapı meydana getirilmesinin unsurları incelenerek, benzer müesseselerle karşılaştırılması yapılmıştır.İkinci bölümünde kendi malzemesini kullanarak başkasının arazisinde haksız yapı meydana getirilmesinin hüküm ve sonuçları incelenmiştir. İnceleme yapılırken, sırayla arazi sahibi ve malzeme sahibinin haksız yapı meydana getirmesi sonucu hangi hakları haiz olduğu üzerinde durulmuştur.Üçüncü bölümünde ise, kendi malzemesini kullanarak başkasının arazisinde haksız yapı meydana getirilmesine ilişkin TMK hükümlerinin diğer bazı kanunlar karşısında uygulama alanı ve hükümsüzlük veya iptal yaptırımlarına tabi tutulan sözleşmelerde haksız yapı halleri ele alınmıştır."
