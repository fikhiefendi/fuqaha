abstract: "ÖZET MIRZAİBRAIMOV, Samagan, Kadıhan el-Üzcendî ve Fetâvâ Kadıhan, Master tezi, Doç. Dr. Osman TAŞTAN, Ankara Üniversitesi, Ankara, 2002,86s. Bu master tezi, giriş, beş bölüm, sonuç, bibliyografyadan oluşmaktadır. Birinci bölüm Kadıhan'm hayatı ve eserleriyle ilgili bilgileri içermektedir. İkinci bölüm Kadıhan'ın meşhur eseri Fetâvâ Kadıhan hakkındaki çalışmaları içermektedir. Üçüncü bölüm Kadıhan'ın Fetâvâ'sında geçen Aile Hukuku ile ilgili görüşlerini içermektedir. Dördüncü bölüm Kadıhan'm Fetâvâ'sında geçen Borçlar Hukukunun bazı bölümleri ile ilgili görüşlerini içermektedir. Beşinci bölüm Kadıhan'ın Fetâvâ'sında geçen Ceza Hukukunun bazı bölümleri ile ilgili görüşlerini içermektedir. Sonuçta araştırmada ulaşılan neticeler sunulmaktadır: Zamanının büyük Hanefi fıkıh alimi olan Kadıhan el-Üzcendî, XII. asırda yaşamıştır. O taklid döneminde yaşamasına karşın, kendinden önceki fakihleri körü körüne taklid etmemiştir. Fetâvâ Kadıhan, İslam Hukuk tarihindeki en muteber fetva kitaplarından birisidir. ırm$"
