abstract: "İslâm hukukunda üzerinde en çok durulan konulardan birisi de,“Azimet ve Ruhsat”meselesidir. Bu tez bir giriş ve iki bölümden oluşmaktadır. Girişte, konunun kaynakları ve araştırma metotları hakkında bilgi verdik. Birinci bölümde, azimet ve ruhsatın ortaya çıkışını ele alarak Kur'an ve Sünnet'ten örneklerle açıkladık. İkinci bölümde, mezheplere göre ruhsatın kısımlarını, sebeplerini örneklerle incelemeye gayret ettik. Bu tezin amacı, azimet ve ruhsatın anlamlarını ilim adamlarına sunmaktır. Tezimizi hazırlarken İslâm hukukunun temel kaynaklarından istifade etmiş olmakla beraber, ortaya çıkan yeni problemler üzerinde günümüz ilim adamlarının çalışmalarından da faydalanmayı ihmal etmedik. Çalışmamızda, azimetin her zaman ruhsattan üstün olmadığını, aksine bazı konularda ruhsatın tercih edilmesi gerektiğini tespit ettik. Çoğu konularda azimete göre davranmak vacip olmasına rağmen, bazı meselelerde de ruhsata göre amel etmek vaciptir."
