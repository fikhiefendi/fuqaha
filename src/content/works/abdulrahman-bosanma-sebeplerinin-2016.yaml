abstract: "Eşlerin evlilik birliğini ve böylece ortak yaşamı sona erdirme isteklerine boşanma denilmektedir. Osmanlı Devleti döneminde İslam Hukuku kuralları uygulanmıştır. Kadının boşanma hakkı olsa da genellikle erkek ağırlıklı olan bu sistemde talak (erkeğin sebepsiz boşama hakkı) önplana çıkmıştır. 1917'de çıkan Hukuk-i Aile Kararnamesi ve 743 Sayılı Medeni Kanun bu kuralları oldukça modernleştirmiştir. 4721 Sayılı Türk Medeni Kanunu ise boşanmanın sınırlarını mümkün olduğunca net bir şekilde çizmiştir. Hakime de geniş bir takdir yetkisi tanınmıştır. Hakim boşama kararı vermeden boşanma sayılmaz. Ayrıca birçok maddede hakim vicdanen karar verecektir."
