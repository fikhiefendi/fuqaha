abstract: "İslam Hukuku'nun teşekkül döneminde yer alan iki fakihten Ebû Hanîfe ve İbn Ebî Leylâ her ikisi de Kûfe'de yaşamışlardır. İki müçtehit arasında çeşitli sebeplerden dolayı ihtilaflar meydana gelmiştir. İhtilafların değerlendirilebilmesi için iki müçtehidin hayatları ve yöntemlerinin bilinmesi gerekmektedir. Araştırmamızda iki müçtehidin kısaca hayatlarını, fetva verirken kullandıkları yöntemleri, özellikle müntesibi kalmayan İbn Ebî Leylâ'nın ulaşabildiğimiz görüşlerinden hareketle usül yöntemlerini çıkarmaya çalıştık. İki müçtehidin ihtilaf ettikleri füru meselelerini tespit edip dayandıkları delilleri aktararak kısa değerlendirmeler yaptık. Araştırmamızı giriş ve iki bölüm şeklinde gerçekleştirip giriş bölümünde konunun teorik alt yapısını oluşturmayı amaçladık. Birinci bölümde Ebû Hanife ve İbn Ebî Leylâ'nın kısaca hayatlarını,“İhtilaf-ı Ebî Hanife ve İbni Ebî Leylâ”kitabını inceledik. İkinci bölümde Ebû Hanife ve İbn Ebî Leylâ'nın ibadetler, muamelat, ukubât konularında ihtilaf ettikleri konuları tespit edip dayandıkları delilleri aktarıp kısaca değerlendirmeler yaptık. Sonuç kısmında ise araştırma sebebiyle zihnimizde oluşan kanaati maddeler halinde ifade etmeye gayret ettik."
