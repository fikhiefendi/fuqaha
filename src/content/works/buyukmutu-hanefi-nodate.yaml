abstract: "Hanefî Fetvâ Usûlünün Teşekkülü ve IV.-X. YY. Arası Teori-Pratik İlişkisi isimli bu çalışma, kavramsal ve kurumsal olarak fetvâ usûlü doktrinin ilerlemesini mercek altına almayı hedefleyen bir muhtevaya sahiptir. İlk bölümde, bir süreye kadar fetvâ ile aynı manada kullanılan ictihad ve kadâ ifadelerinin fetvâdan metodoloji olarak ayrılmasına, fetvâ usûlünü yakından ilgilendiren mezhep, taklit, tahrîc, tercih ve nevâzil kavramlarının muhteva ve tarihsel arka planına temas edilmektedir. İkinci bölüm fetvâ usûlünün tanım, muhteva, gaye ve muhatabına, dönemsel olarak fetvâ usûlünün oluşum ve gelişimine, IV. hicrî asırdan ilk müstakil Hanefî fetvâ usûlü eserinin telif edildiği X. hicrî asra kadarki süreçte fetvâ usûlü kâideleri ile ahlâkî hususlara detaylı şekilde temas etmekte ve her bir dönemi, barındırdığı farklılık ve gelişmeleri, bir önceki dönem ile mukayese ederek dönemsel özgünlükleri ortaya koymaktadır. Üçüncü bölümde ise fetvâ usûlü kâideleri, belirli bir tema çerçevesinde kâide gruplarına ayrılarak ilk dönemden itibaren ilgili kâidenin hangi dönemde nasıl bir gelişme gösterdiği ve son tahlilde neye evrildiği incelenmektedir. Bu çerçevede söz konusu kâidelerin Hanefî furû-ı fıkhına nasıl yansıdığı ve ne şekilde kullanıldığına dair örneklere yer verilmekte, kâideler misallerle açıklanmaya çalışılmaktadır."
titleTranslation: {"en": "The formation of the Hanafi fatwa method and revelance between practive and theory in the IV.-X. Century"}
