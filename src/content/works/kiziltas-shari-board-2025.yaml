abstract: "Bu tez, hem merkezi şeri kurulların hem de bankalar bünyesinde faaliyet gösteren şeri danışma kurullarının yapısal ve işlevsel boyutlarını ele almaktadır. Çalışma, 15 ülkedeki kurulları atanma ve oluşum, yeterlilik ve gereklilikler, görevden alınma süreçleri ve isimlendirme gibi temel yapısal özelliklerini değerlendirmektedir. Ayrıca, kurul üyelerinin görev ve sorumlulukları, toplantı düzenleri, kararlarının bağlayıcılığı, masrafların yönetimi, bağımsızlık ve çıkar çatışmaları gibi işlevsel yönlere de odaklanılmaktadır. Araştırmanın temel kaynağı, ilgili ülkelerdeki yönetmelikler, direktifler, akademik çalışmalar ve diğer yasal düzenlemelerden oluşmaktadır. Bu çalışmada, veri toplama, sınıflandırma, tanımlama ve analiz yöntemlerini bir arada kullanılarak konuyla ilgili kapsamlı bir bakış açısı sunulmaya çalışılmaktadır. Analiz sonucunda, ülkeler arasında şeri kurul sistemlerinin yapı ve işlevlerinde dikkate değer farklılıklar ve benzerlikler tespit edilmiştir. Tez, şeri kurulların etkinliğini artırmak ve standartları geliştirmek amacıyla birtakım öneriler sunmaktadır. Bu çalışma islami bankacılıkta şeri kurul sistemlerinin mevcut halini ortaya koymaya çalışarak kurulların yönetişim mekanizmalarına dair literatüre hem teorik hem de pratik katkılar sağlamayı hedeflemektedir."
