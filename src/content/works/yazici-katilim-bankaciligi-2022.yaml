abstract: "Günümüzde KOBİ'ler ülke ekonomilerinin lokomotifi konumundadır. Türkiye'de ticari işletmelerinin büyük bir kısmı KOBİ'lerden oluşmaktadır. Ülke ekonomisi için önemli olan bu işletmeler faizsiz bankacılık ilkeleri ile faaliyet gösteren katılım bankaları için önemli bir hedef kitledir. Bankacılık sektörü içerisindeki pazar payı içerisinde henüz istediği düzeye ulaşamayan katılım bankaları bu alanda istedikleri düzeye ulaşmak için müşterilerine birçok ürün ve hizmet sunmakta ve yeni ürün ve hizmetlerin gelişimi için gayret göstermektedir. Katılım bankaları KOBİ'lerin finansman ihtiyacını giderebilmeleri için faizsiz bankacılık ilkelerine uygun finansman ürünleri sunmaktadır. Katılım bankaları işletmelerin ihtiyacı olan bir malın veya hizmetin finansmanını sağlayabilmekte olup nakit kredi işlemlerini finanse edememektedir. Araştırmamızda katılım bankalarının KOBİ'lere sunmuş olduğu finansman ürünlerinin KOBİ'ler tarafından bilinirliğinin katılım bankası tercihlerine etkisi araştırılmıştır. Katılım bankaları KOBİ'lerin birçok finansman ihtiyacına cevap verebildiği halde finansman ürünlerinin bilinirlik durumu ve bunun katılım bankacılığı tercihine ne derece etki ettiği sorusuna cevap aranmıştır. Anket çalışmasına Aralık 2021 tarihinde başlamış olup Mart 2022 tarihinde tamamlanmıştır. Anket çalışması Türkiye'de faaliyet gösteren bankalarının KOBİ müşterileri ile yapılmıştır. Yapılan ankette toplam 100 anket formu toplanmış olup, anket online olarak işletmelere dağıtılmıştır. Çalışma neticesinde araştırmaya katılan KOBİ'ler katılım bankacılığı finansman ürünlerine hâkim olunması durumunda bu durumun katılım bankacılığı tercihlerini olumlu yönde etkileyeceğini belirtmişlerdir."
