abstract: "Bu araştırma, genel çerçevesi itibariyle İslam iktisadı, hisse senedi piyasaları ve İslami endeksler konularını kapsamaktadır. Özel anlamda, çalışmayla amaçlanan durum ise; İslam iktisadı açısından teori ve pratikte mevcut hisse senedi piyasalarının incelenmesidir. Bu amaçla; yapılan teorik çalışmanın dışında, anket yöntemi uygulanarak katılımcıların konuya bakışları incelenmiştir. Araştırmadan elde edilen sonuçlara göre hisse senedi piyasalarının, teoride pay ortaklığını ifade eden halinin İslam iktisadı prensipleriyle çelişmediği söylenebilir. Fakat, hisse senedi piyasalarının işleyiş kısmı olarak ifade edilen uygulama noktasında ise, İslam iktisadı prensiplerine uygun olmayan durumlar bulunmaktadır. Bu durumların başlıcaları; açığa satış işlemi, mahzurlu görülen alanlardan elde edilen gelirler, imtiyazlı ortaklıklar, faizli işlemler, spekülasyon gibi durumlardır. Yapılan anket sonucuna göre; katılımcıların İslam iktisadı ve hisse senedi piyasaları hakkındaki bilgi seviyelerinin yetersiz olduğu ifade edilebilir."
