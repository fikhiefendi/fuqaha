abstract: "Geleneksel iktisadın merkeze aldığı ekonomik insan figürü kendi kişisel çıkarına düşkün, rasyonel karar veren ve aldığı kararı uygulamaya geçirme konusunda herhangi bir irade zaafiyeti bulunmayan bir varsayım üzerine kuruludur. Bu varsayım insan davranışları üzerinden genel tahminler yapma konusunda belli ölçülerde işe yarar olsa da, insan fıtratındaki başka birçok bileşenin göz ardı edilmesine sebebiyet vermektedir. Nitekim bireylerin psikolojik ve bilişsel eğilimleri ile ekonomik tercihleri arasındaki ilişkiyi inceleyen davranışsal iktisadın hedefi tam da bu varsayımları gerçek hayata uyarlamaya çalışmaktır. Davranışsal iktisat bu yönleriyle geleneksel iktisadın eksikliklerini düzeltse de, dürtme tarzı politikaların piyasa sistemi içerisinde kâr odaklı faaliyetler kapsamında suistimal edilmesi, ilişkilerde rekabetin esas alınması ve davranışları etkileyen dini inançların göz ardı edilmesi gibi hususlar açısından eleştiriye açık yönler barındırmaktadır. Tez çalışması kapsamında ilgili eleştirel yönler detaylı olarak ele alınmakla birlikte kişisel çıkar kavramının entelektüel yolculuğu İslam ve Modern Batı düşünce tarihi içerisinde beş farklı dönem altında ele alınmakta ve mukayeseli olarak analiz edilmektedir. İslam iktisat düşüncesine göre toplumun ayrılmaz bir parçası olan bireyler nefis mekanizmalarını işletmelerine bağlı olarak ekonomik hayat içerisinde bencillik veya cömertlik gibi birbirine zıt tercihlerde bulunabilmektedir. İslam'a göre olması beklenen insan davranışı ise parasal ödüller karşısında bile kendi kişisel çıkarı yerine bir başkasını tercih eden, az kazandırmasına rağmen helal olan tercihi seçen bir yapı üzerine kuruludur. Teorik çerçeve içerisinde ele alınan bu hipotez oyunsal bir deney formatı ile ölçümlenerek istatistiksel bir anlamlılık içerisinde tezin önemli bir çıktısı olarak ortaya konmaktadır."
