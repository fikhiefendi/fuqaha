abstract: "Bu çalışma, Türkçe dil bilgisindeki durum zarfları ile Arapça dil bilgisindeki hâl unsurunu karşılaştırmalı olarak incelemeyi amaçlamaktadır. İlk bölümde Arapçada hâlin müfred, isim cümlesi, fiil cümlesi ve şibh-i cümle (zarf ve câr-mecrûr) olmak üzere çeşitli görünümleri ele alınmış; hâlin oluş şekilleri ve kullanım özellikleri örneklerle ortaya konulmuştur. İkinci bölümde ise Türk dilbiliminin önde gelen isimlerinin zarf tanımları, durum zarfı tasnifleri ve sundukları örnekler literatür ışığında değerlendirilmiştir. Üçüncü bölümde ise iki dildeki bu unsurlar yapısal ve işlevsel açıdan karşılaştırılmış, özellikle niteleme merkezli durum zarfı ve hâl kullanımlarının benzerlikleri ile farklılıkları ve diğer durum zarflarında ortaya çıkan benzerlikler ve farklılıklar tespit edilmiştir. Analizler, Arapça hâl yapılarındaki esneklik ve cümle içi konum çeşitliliğinin Türkçedeki durum zarfı sisteminden önemli ölçüde farklılaştığını; bu farklılıkların çeviri süreçlerinde anlam kaymalarına veya yapısal uyarlama gereksinimlerine yol açtığını göstermektedir. Arapça ve Türkçe, farklı dil ailelerine mensup iki dil olduğundan, her iki dilin sentaktik yapıları, morfolojik özellikleri ve anlamsal işlevleri farklı parametreler çerçevesinde incelenmiştir. Çalışmamız, karşıtsal çözümleme yöntemine dayalı bir dil incelemesi olarak tasarlanmıştır. Karşıtsal çözümleme yöntemi kullanılan bu çalışmada, iki farklı dil ailesine mensup bu dillerin sözdizimsel ve anlamsal özelliklerinin mukayese edildiği, çok boyutlu ve sistematik bir yöntem benimsenmiştir. Veri toplama ve derleme sürecinde oluşturulan veri tabanında, her iki dilde yazılmış edebî metinler, dil bilgisi kaynakları ve güncel dil kullanım örnekleri esas alınmıştır. Arapça için klasik ve modern dönem metinlerinden, Türkçe için ise Türkiye Türkçesi yazılı kaynaklarından örnekler bir araya getirilmiştir. Çalışmada yer alan kaynaklar arasında; Kur'ân-ı Kerim, klasik Arap edebiyatı ile Türk edebiyatı metinleri sayılabilir. Analiz tekniği açısından şunlar söylenebilir: Öncelikle her iki dil bilgisel kategori, kendi bağlamında ayrı ayrı tahlil edilmeye çalışılmıştır. Arapçada hâl (الحال) konusunun işlevleri ve yapısı, oluşum biçimleri, cümle içindeki konumu ve semantik özellikleri geleneksel Arap dil bilgisi (nahiv) literatürü ışığında sistematik olarak açıklanmıştır. Benzer şekilde, Türkçedeki durum zarflarının morfolojik yapısı, türetim yolları ve cümledeki işlevleri modern Türkçe dil bilgisi çalışmaları çerçevesinde ele alınmıştır. Birinci aşamada, tespit edilen özellikler karşılaştırmalı tablolar, şemalar ve örneklemeler yoluyla mukayese edilmiştir. Bu mukayesede benzerlikler ve farklılıklar şu parametreler üzerinden yapılmıştır: Sözdizimsel konum, morfolojik yapı, semantik işlev, zorunluluk/ihtiyarilik durumu, belirlilik/belirsizlik özellikleri. İkinci aşamada ise zarf kavramının tanımı yapılarak Türkçedeki durum zarfları sınıflandırılmış ve örnekler üzerinden incelemeler yapılmıştır. Üçüncü aşamada her iki dilde hâl ve durum zarfı işlevi gören unsurlar sistematik olarak karşılaştırılmış; kullanım sıklığı, ifade çeşitliliği ve yapılanma açısından benzerlikler ve farklılıklar ortaya konulmuştur. Çalışmada Sîbeveyhi, Zemahşerî ve İbn Ya'îş gibi alimlerin başlıca klasik Arapça nahiv kaynaklarından istifade edilmiştir. Bunun yanında güncel Arapça dil bilgisi kitaplarından, Türkçe dil bilgisi literatürü ile çeviri bilim araştırmalarından da yararlanılmıştır. Ayrıca iki dilden seçilmiş örnek cümleler karşıtsal çözümleme yöntemiyle değerlendirilmiştir. Bu analizler doğrultusunda elde edilen bulgular, hâl ve durum zarfı kullanımlarının anlamsal açıdan benzerlikler gösterdiğini; buna karşılık Arapçadaki cümle hâlin yapısal esnekliğinin ve çeşitliliğinin, Türkçedeki zarf sistemine kıyasla daha geniş bir ifade alanı sunduğu ortaya çıkmıştır. Yapısal açıdan farklılıklar bulunmakla birlikte, Arapçadaki hâl kategorisi, anlam bakımından Türkçedeki durum zarflarına karşılık gelmektedir. Bu yapısal farklılıkların Arapça–Türkçe çevirilerde kimi zaman cümlenin yeniden yapılandırılmasını, kimi zaman da anlamı tamamlayıcı açıklamalara başvurulmasını gerekli kıldığı görülmüştür. Sonuç olarak; bu çalışma, iki dildeki hâl ve durum zarfı ilişkisini bütüncül bir yaklaşımla ele alarak hem kuramsal dil bilgisi alanına hem de her iki dildeki çeviri çalışmalarına katkı sunmayı hedeflemektedir."
