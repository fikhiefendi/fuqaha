abstract: "Bu tez, şerʿî maksatlar (Maqāṣid al-Sharīʿah) ve fıkıh usulleri çerçevesinde, deprem felaketiyle ilgili fıkhî hükümleri kapsamlı bir şekilde inceleyen bir çalışmadır. Çalışma, depremin lügat ve terim anlamını, ayrıca modern bilimsel tanımlarını ele alarak başlamakta; ardından, depremin ilâhî imtihan bağlamındaki yeri açıklanmakta ve İslâm'ın korumayı hedeflediği beş zarûriyetten (din, can, akıl, nesil ve mal) hangilerine temas ettiği ortaya konulmaktadır. Bu tez, İslâm fıkhında depreme dair bütüncül bir eser bulunmaması, bu tür felaketlerin tekrarlanması ve bu bağlamda mükelleflerin ve müftülerin hükme olan ihtiyacının artması gibi gerekçelerle hazırlanmıştır. Depremlerin farklı büyüklüklerde, zamanlarda ve mekânlarda gerçekleşmesi, beraberinde yeni fıkhî meseleler doğurmakta ve bu meselelerin açıklığa kavuşturulması gerekmektedir. Araştırma, ilgili fıkhî hükümleri kaynaklardan tahlilci ve karşılaştırmalı yöntemlerle derlemiş; mezhep görüşleri arasında mukayeseler yapmış; ayrıca, maslahat ve illet tespiti yoluyla hükümler üzerinde değerlendirmelerde bulunmuştur. Tez, giriş ve kuramsal çerçevenin ardından dört ana bölümden oluşmaktadır. Birinci bölümde kavramsal çerçeve ve depreme dair kullanılan fıkhî kaideler; ikinci bölümde ibadetlerle ilgili hükümler; üçüncü bölümde malî muameleler; dördüncü bölümde ise miras, cezâ hukuku, kurtarma faaliyetleri ve gıda konuları gibi dağınık meseleler ele alınmıştır. Bu çalışmanın temel amacı, İslâm fıkhının kapsamlılığını, esnekliğini ve dinamizmini ortaya koymak; fıkhî hükümleri çağdaş vakıalara uyarlayarak mükelleflerin ve fetva ehlinin ihtiyaçlarına cevap vermek; ve İslâm hukukunun modern zamanlardaki olaylara ne derece çözüm sunabildiğini göstermektir. Bu yönüyle tez, mukayeseli fıkıh çerçevesinde özgün bir katkı sunmayı hedeflemektedir. Anahtar Kelimel :İslâm hukuku, Zaruret, Afetler, Felaketler, Deprem, Yardım,Tazmin."
