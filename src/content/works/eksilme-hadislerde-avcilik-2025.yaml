abstract: "İnsanlık tarihi boyunca avcılık, temel bir geçim kaynağı olmanın ötesinde toplumsal ve kültürel yapının önemli bir parçası olmuştur. Nitekim av, tarih boyunca insanın doğayla etkileşiminin, beslenme ve hayatta kalma mücadelesinin ayrılmaz bir unsuru olarak kendine geniş bir yer bulmuştur. Ancak avcılığın sadece biyolojik bir ihtiyaç olmaktan çıkıp, ahlaki, hukuki ve sosyal bir boyut kazanması, özellikle ilahi vahyin rehberliğinde şekillenen inanç sistemlerinde belirginleşmiştir. İslam dininde avcılık konusu, Kur'an-ı Kerim ve hadis-i şeriflerde çeşitli yönleriyle ele alınmıştır. Bu bağlamda, hadisler, Hz. Peygamber'in (s.a.v.) sözleri, fiilleri ve takrirleriyle avcılığın meşruiyeti, sınırları, etiği ve pratik uygulamalarına dair önemli birincil kaynak niteliğindedir. Bu araştırma, günümüzde çevre bilincinin ve hayvan hakları hassasiyetinin artığı bir dönemde, İslam'ın avcılığa bakış açısını temel kaynaklar olan Kur'ân ve sünnet üzerinden ortaya koymaya çalışmaktadır. Çalışma, sadece akademik bir merakı gidermekle kalmamakta, aynı zamanda avcılıkla ilgili güncel tartışmalara İslami bir perspektif çizerek, konuya dair farkındalığın artmasına katkıda bulunmayı hedeflemektedir."
