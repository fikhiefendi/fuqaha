abstract: "Şuf'a hakkı komşuluk hukukunun farklı bir görünümü olup taşınmazın bulunduğu çevreye yabancı bir kimseden gelecek muhtemel zararı def etmek maksadı taşımaktadır. Zayıf bir hak olan şuf'anın mülkiyet kazanmaya kadar giden bir sonuca yol açması sebebiyle müçtehitler tarafından sıkı şekil şartlarına tabi tutulmuştur. Nitekim Osmanlı mahkemelerindeki şuf'a davaları ekseriyetle bu şartların sağlanıp sağlanmadığı üzerinden yürümüş, şartlara tam anlamıyla riayet etmeyen davacıların talepleri kadı tarafından reddedilmiştir. Kadı sicillerinden de tespit ettiğimiz üzere kadılar bu usul ve esasa ilişkin muhakemelerini fıkıh metinlerine bağlı kalarak yapmışlardır."
