abstract: "Bu tezde, Türkiye'de faaliyet gösteren katılım ve konvansiyonel yatırım fonlarının performanslarının karşılaştırılması, küresel şoklara duyarlılıklarının ölçülmesi ve alternatif portföy optimizasyonu önerisi amaçlanmıştır. Çalışma üç ana bölümden oluşmaktadır. İlk bölümde, 31 Temmuz 2016 – 30 Kasım 2023 dönemine ait veriler kullanılarak yirmi dört yatırım fonunun getirileri COVID-19 öncesi, COVID-19 dönemi ve COVID-19 sonrası alt dönemlere ayrılarak incelenmiştir. Fonların risk ayarlı performans ölçümleri Sharpe, Düzeltilmiş Sharpe, Sortino, Treynor, M2, Jensen alfa, Bilgi oranı ve Beta katsayısı gibi metriklerle değerlendirilmiş; yöneticilerin menkul kıymet seçimi ve piyasa zamanlama becerileri Treynor-Mazuy ve Merton-Henriksson modelleri ile analiz edilmiştir. Elde edilen bulgular, COVID-19 öncesinde katılım fonlarının çeşitlendirme ve risk yönetimi açısından daha başarılı olduğunu, COVID-19 döneminde ise bazı fonların dalgalanmalara karşı dayanıklılığını sürdürdüğünü göstermiştir. İkinci bölümde, katılım ve konvansiyonel fonların küresel şoklara duyarlılığını ölçmek amacıyla, S&P 500 endeksi ile fon getirileri arasındaki kuyruk bağımlılığı 01/2022–11/2024 dönemi için günlük verilerle analiz edilmiştir. Sonuçlar, katılım fonlarının ekstrem piyasa hareketlerine karşı konvansiyonel fonlara kıyasla daha az hassas olduğunu, ancak aşırı negatif getirilerde benzer hareket etme eğilimi gösterdiklerini ortaya koymuştur. Üçüncü bölümde ise fonlar kullanılarak portföy optimizasyonu yapılmış, Markowitz Ortalama-Varyans modeli ve Hiyerarşik Risk Paritesi (HRP) yöntemleri uygulanmıştır. Bulgular, minimum volatilite ve hedef risk stratejilerinde katılım fonlarının daha düşük risk profili sunduğunu, HRP yönteminin ise özellikle katılım fonları açısından yüksek Sharpe oranları sağlayarak etkin bir çeşitlendirme aracı olduğunu göstermiştir. Sonuç olarak, katılım fonları konvansiyonel fonlara kıyasla kriz dönemlerinde daha dirençli ve düşük riskli bir alternatif olarak öne çıkmakta; HRP yöntemi ise yatırımcılar için etkin bir portföy stratejisi sunmaktadır."
