abstract: "Prof. Dr. Ahmed Fehmî Ebu Sünne, hayatını genel olarak İslami ilimlere ve özel olarak da İslam Fıkhı ve Usulü alanlarında, öğrenci yetiştirmiş ve topluma akademik nitelikte insan kazandırmış, ilmi geleneğe saygılı ve toplumsal problemleri çözmeye yönelik bir anlyaışla kendisini İslama ve Müslümanlara adamış şahsiyetli bir ilim adamıdır. Hayatı boyunca İslamî kaynaklardaki metinleri açıklamaya ve uygun çalışma materyalleri hazırlayarak öğrencilerini yönlendirmede örnek bir rehber olmuştur. Prof. Dr. Ahmed Fehmi Ebu Sünne genelde insanlığın, özelde müslümanların saosyal hayatındaki problemleri çözme husunda müctehid imamların ifa ettiği içtihat görevinin günümüzde de eda edilmesinin gerekli olduğunu savunarak ehliyetli Fıkıh alimlerinin bu görevle yükümlü olduklarını savunur ve Fıkıh Usulü kurallarının kullanılarak Şerî' Naslardan çözümler üretip toplumsal ve bireysel sorunların halledilmesini önemserdi. Kişisel olarak geri kalmışlığı kabullenmez, yozlaşmış ve meşru dayanağı olmayan görenekleri kabullenmeyerek toplumun daha berrek hayata sahip olmasını savunurdu. Bu tezde, Profesör Dr. Ahmed Fehmî Ebu Sünne, yirminci yüzyılın dörtte üçünde eğitim ve öğretimle topluma ve öğrencilere faydalı olmaya çalışmış, başta Ezher üniversitesi olmak üzeri her aşamada eğitim ve öğretime önem vermiş; gerektiğinde İslam dünyasının farklı ülkelerindeki üniversitelerde dersler vermiş ve çok sayıda ilim adamı yetişmesinde etkin olmuştur. Bu ulvi görevi yürütürken bir taraftanda İslam Fıkıh ve Usulü alanında kitaplar telif etmiştir.“el Örf ve'l ade fi rayil fukaha”,“el-Muḥâḍarât fî usûli'l-fıḳhi”,“el-Vasîṭ fî usûli'l-fıḳhi'l-Ḥanefiyye”,“Nazariyyetü'l-hak”kitapları ve birçok makalesi vardır. Biz bu kitapları ve makaleleri tanıtıp kapsamlarıyla ilgili özet bilgiler vererek O'nu, ilmi kişiliğini ve birikimini bu tez aracılıyla ilim yolcularına ve İslam dünyasına sunmaya çalıştık. Faydalı olduğuna inandığımız bu çalışmadan dolayı Allah'a hamd ederiz."
