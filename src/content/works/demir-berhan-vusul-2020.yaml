abstract: "Bu tez, İbn Berhân'ın (ö.518/1124) el-Vüsûl İle'l Usûl adlı eserinde yer alan içtihada dair görüşlerini ele almaktadır. Tezde İbn Berhân'ın hayatı, hocaları, etkilendiği kişiler, içtihat ve taklide yönelik görüşleri incelendi. Çalışmada, İbn Berhân'ın taassuba düşmediği, müstakil düşünebildiği, hocalarıyla zaman zaman aynı görüşü paylaşmadığı tespit edilmiştir. Hz. Peygamberin içtihat ettiği, müçtehitlerin sahabeyi taklit edemeyeceği, her bir müçtehidin isabet ettiği, avâmın (halkın) istediği âlimi taklit edebileceği görüşünde olduğu belirlenmiştir. Muayyen bir mezhebi taklidin zorunlu olmadığı yönünde kendisine nispet edilen görüşün doğru olup olmadığına ise ulaşılamamıştır. İbn Berhân'ın eserinde yer verdiği konular güncelliğini hala korumaktadır."
