abstract: "Bir sahâbînin kendi görüşü olan her söz ve eylemine sahâbî kavli denir. Sahâbî fetvası ve sahâbî mezhebi terimleri de aynı anlamdadır. Usulcüler arasında şer'î kaynak olup olmadığı tartışılan sahâbî kavli bir çok yönden incelenmiştir. Genel olarak üç görüş ortaya çıkmıştır. Bazıları şartsız bir şekilde sahâbî kavlini kaynak sayarken, bazıları şartsız olarak onu kaynak saymamıştır. Üçüncü görüştekilere göre ise, eğer sahâbî kavli naklî yani vahye dayanan konularda olursa kaynaktır, yok eğer ictihâdî yani akla dayanan konularda olursa kaynak değildir. Sahâbe arasında yaygın olmuş ve herhangi bir itiraz görmemiş sahâbî kavli, ictihâdî olmayan konulardaki sahâbî kavli ve ictihâdî konularda olup kıyâsa aykırı sahâbî kavli, çoğunluk tarafından kaynak sayılan çeşitlerdir. Üzerinde en fazla tartışma yapılmış olan sahâbî kavli ise, tabiûn arasında yaygınlık kazanmış kıyâsa uygun sahâbî kavli olmuştur."
