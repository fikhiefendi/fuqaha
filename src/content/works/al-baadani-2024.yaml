abstract: "Hayatta kalmanın en önemli unsurlardan biri, bir kişinin ailesiyle birlikte güven içinde yaşayabileceği normal bir standardın sağlanması ve gelecekte kendisini etkileyebilecek herhangi bir sakatlığa, ekonomik koşullardaki dalgalanmalara veya ilahi felaketlerin meydana gelmesine karşı önlem alınmasıdır. Buradan hareketle, dayanışma garantisi ilkesine dayanan sosyal dayanışma fonları, İslam dininin öğretilerinin kurallarına uygun olarak ve şirketlerin maddi menfaatini güvence altına almak isteyen geleneksel sigorta kurallarına aykırı olarak fertlerin çıkarlarını korumak için ortaya çıkmıştır. Sosyal dayanışma sigorta şirketleri, başta Arap ülkelerinde şubeleri olan Sosyal dayanışma şirketlerine sahip Ürdün olmak üzere tüm ülkelerde zaman içinde genişleyen İslami bir alternatif haline gelmiştir. Ürdün'de vatandaşların yaşam standartlarında bir düşüş olduğunu fark eden araştırmacı, bu çalışmada sosyal dayanışma fonlarını, koşullarını ve performanslarının üyelerine olumlu yansıyıp yansımadığını izlemeyi amaçlamıştır. Çalışmada araştırmacı, çalışmanın teorik çerçevesini belirlerken tarihsel; anket ve sosyal dayanışma fonlarının üyelerinden veri toplamak için bir araç olarak analiz ederken analitik; sosyal dayanışma sigorta şirketlerini ve fonlarının performansını izlerken tümevarımsal olmak üzere çeşitli yaklaşımlar izlemiştir. Çalışmanın temel bulguları, sosyal dayanışma fonlarının, üyelerinin çoğu için ortaya çıkan eksikliği kapatmada önemli bir rol oynadığını gösteriyor. Ayrıca, bu fonların performansından memnun olmayanların oranı dikkate alındığında, sigorta şirketleri arasında çeşitli ve yüksek kaliteli hizmetler için yoğun bir rekabetin olduğu görülmektedir. Bu bağlamda, sosyal dayanışma şirketlerinin, müşterilerin ekonomik koşullarına uygun yeni ve yenilikçi çözümler sunarak memnuniyetlerini ve beklentilerini karşılamak için gelişimlerini güçlendirmeleri önemlidir."
