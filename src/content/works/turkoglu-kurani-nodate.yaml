abstract: "Antropoloji, insanı ve insan yaşamını çeşitli kültürel bağlamları içinde inceleyen bir bilim dalıdır. Farklı toplumların yaşam biçimlerini, davranış kalıplarını ve kültürel yapılarını ele alarak insanlığa dair bütüncül bir anlayış geliştirmeyi amaçlar. Bu doğrultuda antropologlar tümevarım ve tümdengelim gibi yöntemleri kullanarak bilgiye ulaşarak toplulukları karşılaştırmalı ve küresel bir perspektifle değerlendirir. Böylece hem kültürel çeşitliliği kavramayı hem de insanlığın evrensel ortak yanlarını keşfetmeyi hedefler. Öte yandan antropologlar, farklı kültürlere dair edindikleri bilgiler sayesinde kendi kültürel yapılarını daha derinlemesine anlama imkânı bulurlar. Bu süreçte toplumsal kuralları, gelenekleri ve kültürler arası etkileşimleri inceleyerek bunların insan yaşamı üzerindeki etkilerini açıklamaya çalışırlar. Birey-toplum ilişkisini merkeze alarak insan davranışlarının ardındaki temel dinamikleri anlamayı amaçlarlar. Antropolojinin geniş bir alanı kapsayan çeşitli alt dalları bulunmaktadır. Bu alt dallardan biri olan Sosyal ve Kültürel Antropoloji, toplumların kültürel yapıları ve sosyal düzenleri üzerine yoğunlaşmaktadır. Hukuk Antropolojisi, Sosyal ve Kültürel Antropolojinin bir alt dalı olarak toplumsal normların ve yasal düzeneklerin işleyişini inceler. Belirli topluluklardaki özgül kuralları analiz ederek bunların altında yatan temel mantığı ve sosyal düzeni tesis etmedeki işlevlerini kavramayı amaçlar. Kapsamı kesin sınırlarla belirlenemeyen bu disiplin farklı toplumların hukuk sistemlerini karşılaştırmalı olarak ele alır ve böylece hukuksal süreçler ile kültürel çeşitliliğe dair önemli veriler sunar. Bu yönüyle Hukuk Antropolojisi, hem tarihsel hem de hukuki perspektiften toplumsal kuralların dönüşümünü anlamaya önemli katkılar sağlar. İnsanlık tarihi kadar eski olan hukuk, insanla birlikte gelişim gösterse de Mezopotamya'da çivi yazısının keşfiyle birlikte, yazılı bir forma kavuşmuş ve sistematik bir yapı kazanmaya başlamıştır. Çivi yazısının Sümerler tarafından M.Ö. 3000 yıllarında icat edilmesi, insanlık tarihinde büyük bir dönüm noktası olmuştur. Yazının icadından sonraki süreçte bazı hukuki metinlere rastlanmış olsa da düzenli ve kapsamlı hukuk metinlerinin ilk örnekleri M.Ö. 1750 civarında Sami Kralı Hammurabi'nin yönetiminde oluşturulmuştur. Yazılı hukuk tarihinde önemli bir başlangıç noktası olarak kabul edilen Hammurabi yasaları, daha sonra tarih sahnesine çıkan diğer medeniyetlere hukuki anlamda ilham kaynağı olmuştur. Yazının öğrenilmesi ve yaygınlaşmasıyla birlikte birçok farklı medeniyet kendi hukuk sistemlerini oluşturmuş ve bu metinler insanlık tarihine dair önemli bilgiler sunmuştur. Özellikle ceza hukuku alanında bu metinler cezaların şekli, suçlar ve toplumların adalet anlayışı hakkında değerli bilgiler içermektedir. Çeşitli arkeolojik keşifler ve yazılı kaynaklar hukuk tarihine dair bir anlayış geliştirilmesine katkı sağlamıştır. Antik medeniyetlerin ceza hukuku bağlamında insanlık tarihi ele alındıktan sonra, odak noktası İslam Hukuku öncesindeki Cahiliye Arapları olarak adlandırılan döneme yönlendirilmiştir. Bu döneme ilişkin hukuki veriler incelenerek Cahiliye Arap uygulamalarının İslam Hukuku üzerindeki etki düzeyi ve söz konusu uygulamaların ne ölçüde sürdürüldüğü araştırılmıştır. Tezimizin genel amacı doğrultusunda Kur'ân-ı Kerîm'deki cezai hükümler antropolojik ve tarihsel süreç bağlamında ele alınmış ve bu hükümlerin evrenselliği veya tarihselliği ile insan fıtratına uygunluğu anlaşılmaya çalışılmıştır. Araştırma neticesinde İslam öncesi Arap uygulamaları ile Kur'ân'ın cezai düzenlemeleri arasında genel bir benzerlik bulunduğu, Kur'ân'ın getirdiği hükümlerin ise evrensel nitelikte ve insan onuruna uygun hükümler olduğu tespit edilmiştir."
