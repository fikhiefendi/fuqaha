abstract: "Bu çalışma, h.896 yılında vefat etmiş olan Şemsuddîn el-Mısrî'nin İsrâ Sûresi'nin tefsirinin el yazmasının araştırmasını ve içermektedir. Müellifin, meşhur müfessirlerin metotlarından Rivayet, Dirayet ve İşari tefsir olarak bilinen bu üç temel metodu bir araya getirerek oluşturduğu zengin ilmi metodu ve engin ilmî kültürü sayesinde tefsirinde Kıraat, Hadis, Dilsel ve Fıkhî konuları kapsayan pek çok konuyu ele almasından dolayı bu el yazması; ilmi değeri yüksek bir eserdir. Çünkü tefsiri; fıkıh, hadis, kıraat ve dili kapsayan çeşitli konuları içermektedir. Kitap, Kur'an ayetlerinin açıklanması hususunda müfessirlerin ve âlimlerin ifadeleri bakımından oldukça zengindir. Manalarının delalet ettiği noktaları açıklamakla birlikte onların okunma yollarını göstermek; belagat, sarf ve nahivle ilgili dilsel meseleleri zikretmek; özellikle Kuran ayetlerini karşılaştırırken kelimelerin hem sözlük anlamlarını verip hem de açıklamak müellif için büyük önem taşımaktadır"
