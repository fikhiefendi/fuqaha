abstract: "ÖZET Şer'iye Sicilleri Türk kültür ve tarihinin temel kaynaklarının başında gelmektedir. Türk kültür tarihine ait en güvenilir bilgileri o doneme ait resmi kayıtlardan elde edebiliriz. Şer'iye sicilleri kaydedildiği yerlerde o yerleşim yeri ile ilgili siyasi, sosyal, ekonomik ve demografik konular hakkında bilgiler vermektedirler. Transkripsiyonu yapılan 75 Numaralı Şer'iye Sicil Defteri' nde Evlenme-Mehir, Nafaka-Boşanma, Alacak-verecek, Arazi, Miras, Vakıf, Vasi Tayini, Vekil Atamaları, Camiye Vaiz Atanması, Din Değiştirme, Dini Günlerin Belirlenmesi, Rüşd, Mal Gaspı, Atama Davalarını içermektedir. Evlenme akdine ilişkin belgelerde genellikle, küçüklerin anne, babası veya kadı tarafından velayet edinilerek evlendirilmesi ile gerçekleşmiştir. Boşanma ( talak ) ile ilgili davalar genellikle, kan-kocanın şiddetli geçimsizlik sebebi ile karşılıklı rıza ile ayrılmalarına yada evlilik sırasında akd edilen mehirin ödenmemesi sonucu mehir davaları açılmıştır. Nafaka davalarında ise yine boşanma sırasında ödenmesi kararlaştırılan nafakanın ödenmemesi veyahut zaman için de nafakanın ihtiyaçları karşılayacak düzeyde olmaması ve artırılması istemiyle açılmıştır. Miras hukukuna ilişkin kayıtların çoğunluğunu miras sözleşmeleri, devletin mirasçılığı ve tereke taksimleri teşkil etmektedir. Miras davalarında ölen şahsın varislerinin isteği ile müzayede yoluyla satılarak elde edilen gelirin varisler arasında paylaştırılması ile çözüme kavuşturulmuştur. Ölen şahsın bütün mal varlığı terekesinde neler olduğu küçük ve büyük baş hayvanları, tahıl ürünleri, ahır, samanhane, ev, ambar, kişisel eşyaları ve ev eşyaları sayıları ile birlikte kaça satıldığı ve varislerine ne kadar hisse düştüğü ayrı ayrı belirtilmiştir. Hem tereke taksimi hem de vasiyetle ilgili kayıtlardan, muhtelif devirlerdeki Türk ailelerinin refah seviyelerini, kullandıkları eşyaları ve fertlerin sahip olduğu mal varlıklarını, öğrenmek mümkündür. Bu konuda da tamamen şer'i hükümlerin uygulandıklarını görüyoruz. Varislerin yaşları küçük değilse onların da haklarını muhafaza etmek için vasî tayin edilmiştir. Verasetin gerçekleştirildiği sırada orada bulunmayan diğer varislerin hakları da bir memura emanet edilmiş ve geçici olarak korunmuştur. Mal gaspı davalarında ise sicilde arazi gaspı şeklinde görülmektedir. Tarla, bahçe, ev, vs. sınırlarından içeri girilmek suretiyle kısaca arazi gaspına rastlanmıştır.Vakıf davalarında, vakfın tüm işlerini yapan ve aralarında iş bolumu olan mütevelli üyelerinden birinin ölümü veya şehir değişikliği nedeniyle üyeliğinden ayrılması sonucu emanet edilmiş paranın kadı huzurunda diğer üyelere teslim edilmesi şeklinde görülmüştür. Alacak-verecek davaları ise genellikle esnaf teşkilatına, ticaret hayatına, eşya fiyatlarına, şirket, vekalet, kefalet, iflas gibi durumlarda oluşan sıkıntılar yüzünden çıktığı görülmüştür. Rüşd ispatı davalarında ise nafaka alacak çocukların yada veraset gibi durumlarda önceden vasî ilanı ile haklan korunmuşken rüşdünü tamamlayıp kendi haklarını savunma istemiyle açılmış ispat davaları olduğu görülmüştür. Camiye Vaiz Atanması davalarında ise vaizin ölümü başka bir şehre gitmesi ve çeşitli sebeplerden dolayı görevinde bulunamaması durumunda olduğu görülmüştür. Müslümanlarla zımmiler ile bir arada yaşamaktaydılar çeşitli etkileşimler dolayısıyla din değiştirme durumlarının sonucu olarak Müslümanların haklarından faydalanma sebebiyle açılmış davalardır. Dini günlerin belirlenmesi özellikle Ramazan ayının arifenin ve bayramların belirlenmesi ve duyurulması adına açılmıştır. Vekil atama davaları genellikle veraset davalarında görülmektedir. Vasi olan kişi şehir dışında olması sebebiyle, işlerinin yoğunluğu sebebiyle, çeşitli sebeplerle davalıyı görmek istememsi sonucu vekil tayin etmiştir. Hangi tip dava olursa olsun bütün davalarda davacının ifadesi, davalının dinlenmesi, şahitlerin ikrarıyla davalar çözüme kavuşturulmuştur."
