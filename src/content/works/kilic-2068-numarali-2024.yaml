abstract: "2068/254 Numaralı Trabzon Şeriye Sicil Defterinin Transkripsiyonu ve Değerlendirilmesi Şer'iyye sicilleri birinci elden kaynak olmaları bakımından Osmanlı tarihinde büyük öneme sahiptir. Kadı sicilleri de dediğimiz bu belgelerde yer alan bilgiler, bizzat olayın meydana geldiği dönemin en yakın şahididir. Tutulan kayıtların mahkemede sahitler huzurunda olması güvenirliğini daha da arttırmaktadır. Bu çalışmada 2068/254 numaralı Trabzon Şer'iyye Sicili'nin transkripsiyon ve değerlendirilmesi yapılarak genelde Osmanlı Tarihi ve özelde Trabzon Tarihi çalışmalarına katlı sağlanması amaçlanmıştır. Transkripsiyonu yapılan sicil hicri 1318-1319 miladi 1900-1901 yıllarını kapsamaktadır.“2068/254 Numaralı Trabzon Şer'iyye Sicilinin Transkripsiyonu ve Değerlendirmesi”isimli tez çalışması toplamda giriş ve iki bölümden oluşmaktadır. Giriş kısmında şer'iyye sicilinin genel özelliklerine değinilmiştir. Konunun daha iyi anlaşılması için birinci bölümde Osmanlı hukukunun genel yapısı, şer'iyye mahkemeleri, mahkeme personelleri, şer'iyye sicillerin tanımı, önemi, ortaya çıkışı, sicillerdeki belge türleri incelenmiştir. İkinci bölümün de ise sicilde yer alan kayıtların konularına göre tasnifi ve değerlendirmesi yapılarak sonuçlar tablolar ile gösterilmiştir. Çalışmanın devamında şer'iyye sicilinin tam transkripsiyon metni yer almaktadır."
