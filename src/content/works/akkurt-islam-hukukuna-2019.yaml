abstract: "İslam hukukunda şahsın her türlü hakkı güvence altına alınmıştır. Bu haklar akitler içinde geçerlidir. Akitlerde tarafların haklarının korunması için sözleşmenin meşru bir şekilde kurulmasından sonra mahallin akdin muktezasına uygun olması gerekir. Akit mahalli; kendisi üzerinde şeriata uygun olarak sözleşme yapılan şeydir. Akitlerde mahal akdin yapısına göre farklılık göstermektedir. Bey akdinde mahal mebi, nikâh akdinde mahal karı kocanın birbirinden istifade etmesi, icare akdinde mahal aynın menfaati olmaktadır. Akitlerde mahalde bulunması gereken şartlar vardır. Bunların en başında mahallin mevcut olması gelmektedir. İslam hukukunda olmayan bir şeyin satışı yasaklanmıştır. İkinci şart mahallin malum olmasıdır. Akit mahalli tarafların niza ve tartışmaya düşmelerini engelleyecek şekilde bilinmesi gerekmektedir. Mahal konusundaki bilgisizlik garar olarak ifade edilmektedir. Mahalle ilgili üçüncü şart meşru olmasıdır. Bir şeyin akde mahal olması için onun hukuken istifade edilmesine müsaade edilmiş olması gerekmektedir. İslam hukukunun yenilmesi, içilmesi yahut kullanılmasına izin vermediği şeyler akde mahal olamazlar. Akit mahalliyle ilgili dördüncü şart mahallin tesliminin mümkün olmasıdır. Akitlerde mahallin teslimi akdin geçerlilik şartlarındandır. Eğer mahallin teslimi hususunda imkansızlık söz konusu olursa bu akdin geçersiz olmasına sebep olur."
