abstract: "Bu çalışmada Suudi Arabistan'ın İslami bankacılığının fıkhi temelleri tarihi, hukuki ve iktisadi bakımdan bütüncül bir şekilde ele alınmaktadır. Suudi Arabistan'ın İslami bankacılığına dair çalışmalar genelde konunun belli bir yönüne odaklanmışken bu çalışmanın her bir bölümü krallığın İslami bankacılığının fıkhi yönlerini ortaya çıkartmak maksadıyla birbirini tamamlayıcı perspektifler sunmaktadır. Bu çalışmayla, Suudi Arabistan'daki İslami bankacılığın fıkhi özelliklerinin tarihi, iktisadi ve hukuki bir zeminde gelişiminin ve mevcut yapıya uyumunun, onun dini karakteristiği ile irtibatlı bir şekilde ele alınması hedeflenmiştir. Çalışmada Suudi Arabistan'ın İslami bankacılığının tarihi açıdan bankacılıktaki mevcut kurumsallaşmanın devamı olduğu ve mevzuat açısından kendisine has kanun düzeyinde regülasyonlar olmasa da mevcut düzenlemelere 'İslam şeriatına aykırı olmamak' kaydı ile uyum sağladığı görülmüştür. İslami bankacılığa has düzenlemelerin kanun seviyesinde olmasa da talimat/yönerge şeklinde oluştuğu vurgulanmıştır. İktisadi bakımdan petrol gelirlerinin finansal büyümeyi gerektirdiğine ve bunun neticesinde Suudi Arabistan'daki İslami bankacılığın finansal büyüme içerisinde önemli bir rolü olduğuna değinilmiştir. Krallığın İslami bankacılığı bağlamında şer'i kurul kararları üzerinden Suudi Arabistan'ın İslami bankacılığının fıkhi dinamikleri ele alınmıştır. Krallıktaki İslami bankacılıkta fetva bakımından ana akım olarak nitelenebilecek İslâm Fıkıh Akademileri ve AAOIFI'nin görüşlerinin güçlü olduğu fakat şer'i kurulun içtihat serbestisi bağlamında ihtiyaca binaen gereklilikler ve yerel unsurların da tesirinin olduğu görülmüştür. Bu kapsamda şer'i kurulların mezhep tercihinin altında krallığın İslami bankacılığının küresel bankacılığa uyumu ihtiyacının yattığına varılmıştır. Ancak küresel bankacılığa entegre olma aşamasında nassa dayalı temellendirmenin kapsamı dışında kalan maslahat gibi deliller açıklanırken bile yerel dinamikler göz önünde tutulup İbn Kayyim'in açıklamalarından yola çıkılmıştır. Bunun yanında Selefi çizginin, bireysel temsilciler ve kurumsal bakımdan Daru'l-İftâ'da somutlaşan temsiliyetle İslami bankacılıkta güçlü birer politik dengeleyici unsur olduğu vurgulanmıştır."
