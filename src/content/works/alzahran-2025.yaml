abstract: "Bu tez çalışması, zekâtın toplanması ve dağıtılması süreçlerinde blockchain teknolojisinin yönetimsel potansiyelini incelemeyi ve bu teknolojinin Katar Zekât Fonu'na entegrasyonuna yönelik bir model sunmayı amaçlamaktadır. Kapsamlı bir metodolojik yaklaşımla, zekât toplama ve dağıtma mekanizmalarında blockchain'in sunduğu avantajlar detaylı bir şekilde irdelenmektedir. Çalışma, blockchain teknolojisinin İslam hukuku hükümleriyle uyumluluğunu ele almakta, bu teknolojinin zekât sistemine nasıl uygulanabileceğini ve uygulamada karşılaşılabilecek muhtemel zorlukları analiz etmektedir. Ayrıca, zekâtın bu sistem içerisinde nasıl toplanacağı ve dağıtılacağı konuları değerlendirilmektedir. Tezin temel hedefi, zekât kavramını derinlemesine inceleyerek blockchain teknolojisinin bu alandaki uygulanabilirliğini ve uygulama yöntemlerini ortaya koymaktır. Araştırma sürecinde tümevarımsal bir yaklaşım benimsenmiş, zekât konusu kapsamlı bir şekilde incelenirken, alanında uzman akademisyenler ve vakıf yöneticileriyle mülakatlar gerçekleştirilmiştir. Blockchain teknolojisinin zekât sistemine entegrasyonu konusundaki görüşler, bu alanda uzmanlaşmış akademisyenler ve blockchain uygulamalarını kullanan firma yöneticileriyle yapılan görüşmelerle desteklenmiştir. Bu mülakatlar, blockchain teknolojisinin zekât sistemine entegrasyonunun, kullanıcılar için önemli kolaylıklar sağlayacağı sonucunu ortaya koymuştur. Bu projenin Katar Zekât Kurumu tarafından hayata geçirilmesi planlanmaktadır. Tez, zekât toplama ve dağıtma süreçlerinde blockchain teknolojisinin kullanımının, İslam hukukunun öngördüğü şekilde uygulandığında, emanete riayet ve dürüstlük ilkeleriyle uyumlu olarak güvenilirliği artıracağı ve zekâtın hak sahiplerine adil bir şekilde ulaşmasını sağlayacağı sonucuna varmaktadır. Blockchain teknolojisi, zekât veren ve alan arasında akıllı sözleşmeler oluşturarak her iki tarafın bilgilerinin gizliliğini korumakta ve zekâtın otomatik olarak ödenmesini mümkün kılmaktadır."
