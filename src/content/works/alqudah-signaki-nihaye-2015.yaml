abstract: "Fıkıh, nahiv ve kelâm alanlarında yazdığı eserlerle tanınan İmam es-Siğnâkî, VII/XII. yüzyılın sonları ile VIII/XIV. yüzyılın başlarında yaşamış çok yönlü bir âlimdir. Hanefi mezhebinde muhakkik alimlerden kabul edilir. Hanefi mezhebinin en önemli metinlerinden olan el-Hidâye üzerine yazdığı en-Nihâye, ilk şerh olması açısından önemlidir. Hanefî mezhebi çizgisinde kaleme alındığı döneme kadar oluşan fıkıh birikimden de istifade edilerek yazılan eser, el-Hidâye şerhleri başta olmak üzere kendisinden sonra yazılan birçok Hanefi eserine kaynaklık etmiştir. Taşıdığı önem sebebiyle eserin edisyon kritiğinin yapılıp değerlendirilmesi gerektiği açıktır. Bu ihtiyacı bir ölçüde gidermek amacıyla bu çalışma yapılmıştır. Çalışmamız bir giriş ve 3 bölümden oluşmaktadır. Giriş bölümünde çalışmanın planı, amacı, yöntemi ile edisyon kritikte takip edilen yöntem ele alınmıştır. Birinci bölümde metin yazarı el-Merğînânî ile şarih es-Siğnâkî hakkında bilgi verilmiş; ikinci bölümde çalışmada ele alınan en-Nihâye, geniş bir şekilde tanıtılarak değerlendirilmiştir. Üçüncü bölüm ilgili eserin temizlik ve namaz bölümlerinin edisyon kritiğine ayrılmıştır. Çalışma sonuç ve kaynakça ile sona ermektedir."
