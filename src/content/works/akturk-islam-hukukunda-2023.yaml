abstract: "Çalışmanın konusu, boşanmaya ilişkin uyuşmazlıklara yönelik İslâm aile hukuku kapsamında sunulan alternatif çözüm yollarının hukuki tahlilidir. Türk hukuk tarihimize bakıldığında yüz yıl öncesine kadar İslâm hukukundaki haliyle etkin olarak kullanılan ayrıca İslâm hukukuyla yönetilen ülkelerde de güncel olarak uygulanmakta olan söz konusu yöntemlerin, evlilik birliklerini koruma noktasında önemli olduğu görülmektedir. Özellikle Türkiye'de artan boşanma sayıları neticesinde toplumun temelini oluşturan aile kurumunun dağılmasıyla ortaya çıkan sorunların çözülmesi zaruri bir ihtiyaçtır. Gerek ilgili ihtiyacın giderilmesi gerekse de mahkemelerin iş yükünün azaltılması, hızlı ve ekonomik çözümler sunulması nedeniyle aile arabuluculuğu ya da hakemliği kurumlarının iç hukukumuzda düzenlenmesi elzemdir. Çalışmada, İslâm aile hukukundaki sulh temelli alternatif uyuşmazlık çözüm yolları, pozitif hukuktaki emsalleriyle mukayeseli olarak incelenmiştir. Bu kapsamda Türk aile hukukunda uygulanması planlanan aile arabuluculuğu veya hakemliği gibi yöntemlere, İslâm aile hukuku perspektifinden bakılarak konu farklı bir hukuk sistemi olan İslâm hukukunun yaklaşımıyla ele alınmıştır. Konuya ilişkin teorik bilginin yanı sıra çağdaş İslâm hukuku uygulamalarına da yer verilerek uyuşmazlık çözüm süreçlerinin pratiği de incelenmiştir. Çalışmada fıkıh, hadis ve tefsir kitapları, hukuki metinler bağlamında şer'iye sicilleri, fetva mecmuaları ve hukuk müktesebatımızda yer alan kanuni düzenlemeler gibi kaynakların kullanımına özen gösterilmiştir. Ayrıca güncel İslâm hukuku uygulamalarını incelemek adına farklı mezhepleri takip eden İslâm ülkelerinin konuya ilişkin hukuki düzenlemelerinden de istifade edilmiştir. Üç bölümden oluşan çalışmanın ilk bölümünde boşanma ağırlıklı olmak üzere evliliğin sona erme sebepleri güncel İslâm hukuku uygulamalarıyla ele alınmıştır. Zira eşleri ilgili uyuşmazlık çözüm süreçlerine götüren ve aile arabuluculuğu ya da hakemliği uygulamalarının başlatılması noktasında boşanma kavramının incelenmesi zaruri görülmüştür. İkinci bölümde ise ilk olarak genel anlamıyla alternatif çözüm yollarının neler olduğu, kavramların izahı, konunun tarihsel gelişimi ve aile arabuluculuğu ile aile hakemliği kurumları Türk ve İslâm hukuk sistemleri mukayese edilerek izah edilmiştir. Üçüncü bölümde ise boşanmanın hukuki sonuçlarından hangilerinin ilgili yöntemlere elverişli olduğu hususu yine Türk ve İslâm hukuku özelinde ayrı ayrı tahlil edilmiştir. Çalışmada altı farklı İslâm ülkesinin Anayasa ve aile kanunu metinlerinde yer alan konuya ilişkin hükümler de incelenmiştir. Konuya dair teorik bilgilerin yanı sıra yaşayan İslâm hukuku uygulamalarının da ele alınmasıyla konuyu daha özgün bir şekilde değerlendirme imkânı bulunmuştur. Güncel İslâm hukuku uygulamalarını kapsayarak özgünlük kazanan çalışma vesilesiyle söz konusu uygulamaların başarı oranları da ortaya konmuştur. Bu bağlamda Türk hukukunun konuya dair ihtiyaç duyduğu hukuki düzenlemelere, İslâm hukuku tarafından sunulması muhtemel katkılar daha somut bir şekilde ortaya konmuştur. Türk hukuku özelinde boşanmanın hukuki sonuçlarından olup kamu düzenini ilgilendiren ve tarafların üzerinde serbestçe tasarruf edemeyecekleri hususlarda alternatif çözüm yollarına başvurulamamaktadır. Bu noktada Türk hukukunun İslâm hukuku uygulamasına benzerliğine dikkat çekilmiştir. Boşanmaya dair uyuşmazlıklara ilişkin Türk hukukunda uygulanması muhtemel alternatif çözüm yollarının batılı emsallerinden ziyade İslâm hukuk sistemindeki modele daha uygun olduğu sonucuna ulaşılmıştır."
