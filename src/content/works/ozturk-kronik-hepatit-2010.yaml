abstract: "Dünya nüfusunun yaklaşık üçte birinde serolojik geçmiş veya güncel HBV enfeksiyonu delili vardir ve 350 milyon insan da kronik olarak enfektedir. HBV ile bağlantılı son dönem karaciğer hastalığı veya HCC yılda 1 milyon ölüme neden olmaktadır. Hepatit C virus infeksiyonu da tüm dünyada yaygın, oldukça ciddi bir sağlık sorunudur. Dünya genelinde yaklaşık 210 milyon HCV ile enfekte hasta vardır. HCV enfeksiyonu kronik karaciğer hastalığına bağlı ölümlerin major nedenlerinden biridir. Bu hastalarda tedavi, uzun donemde gelişebilecek siroz ve HCC'ye bağlı ölümleri azaltması açısından önemlidir KHB tedavisinde pegileinterferon alfa 2a/2b, lamivudin, entekavir, adefovir, tenofovir, telbivudin gibi tedavi seçenekleri mevcut olup, tedavi seçimi hastaya özel olmalıdır. KHC tedavisinde ise standart tedavi pegileinterferon ile ribavirin kombinasyon tedavisidir. İzmir Atatürk Eğitim ve Araştırma Hastanesi Enfeksiyon Hastalıklari ve Klinik Mikrobiyoloji polikliniğine Mayis 2007 ile Aralik 2008 tarihleri arasında başvuran ve tedavi başlanan 31 Kronik Hepatit B , 21 Kronik Hepatit C hastasi retrospektif olarak incelendi. KHB hastalarımızın pegileinterferon alfa tedavisine primer yanitsizlik orani %21, tedavi sonu virolojik yanıt oranları HbeAg (+) hastalar izin %50, HbeAg (-) hastalar izin %60 olarak saptandı. Entekavir ve tenofovir tedavisi alan hastalarda ise tedavi sonu virolojik yanıt oranlari sırasıyla %91, %100 olarak saptandi. KHC hastalarinda ise HVY orani %71, EVY %100, TSY %100 ve KVY %100 olarak saptandı. Çalışmamız ve literatür incelememiz gosterdi ki KHC tedavinde kullanılan pegile interferon alfa+ribavirin kombinasyon tedavisi sonuçları başarılı olsa da KHB tedavisinde yeni tedavi ajanlarına veya kombinasyon tedavilerine ihtiyaç vardır. Çalışmaya dahil edilen hasta sayısınınn azlığı göz önüne alındığında daha uzun süreli ve daha çok vaka içeren geniş serili çalışmalara ihtiyaç vardır."
