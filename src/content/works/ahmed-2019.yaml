abstract: "\"Fıkıh Usûlünde Lafzî Karîne ve Delalet Üzerindeki Etkisi\" adlı çalışmamız, şer'i naslardan ictihad yoluyla hükümlerin çıkarılması amacıyla bu nasların yorumu ve anlaşılmasında azami öneme sahip olan lafzî karineler konusunda yapılmış olan ilk çalışma özelliğini taşımaktadır. Çalışmamızın birinci bölümünde \"lafzî karine\" kavramı, tanımı, çeşitleri, benzer usül kavramlarıyla ilişkileri ele alınmış, usulcülerin eserlerinde lafzî karîneyi inceleme yöntemlerine işaret edilmiştir. İkinci bölümde ise şer'i naslarin anlaşilmasinda lafzî karinelerin etkisi ana başlığı altında lafzî karînelerin emir-nehiy mutlak –mukayyed ve amm-has lafızları açıklamadaki rolü, açık (zâhir) ve kapalı (hafî), hakikat ve mecâz lafızların delaletleri üzerindeki etkisi ile lafızların hükümlere olan delaletindeki rolleri ele alınmıştır. Ayrıca lafzî karinenin nasların yorumundaki işlevleri zikredilerek tüm bu konular Kur'ân ve sünnet naslarından örnekler vererek uygulamalı bir şekilde araştırılmıştır. Sonuç bölümünde ise fıkıh usulünde lafzî karine konusunda ulaşılan bilgi ve tespitlere yer verilmiştir."
city: "İstanbul"
