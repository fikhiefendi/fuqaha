abstract: "Üç makale biçiminde düzenlenen bu tez, İslami bütüncül dünya görüşünü esas alarak,“İslami piyasa”kavramını açıklamayı ve, giderek, konu hakkındaki son zamanlarda, özellikle Batı dünya görüşünün etkisinden kaynaklanan, yanlış anlamaları düzeltmeyi amaçlamaktadır. İlk makale, adalet ideallerini (İslam hukukunun ana kaynaklarından türetilen) temel alır biçimde geliştirilen İslami piyasa teorisini açıklamakta ve kamusal bakımdan iyi olana (yaşamın bütüncüllüğü düşüncesini içerecek kadar geniş bir biçimde tanımlanan) erişmeye odaklı İslami piyasa ideolojisinin önkoşul ve normlarını ortaya koymaktadır. İkinci makale, İslami yaşam felsefesi bağlamında (hem bireysel hem de toplumsal düzeylerde), İslami mülkiyet ve girişim hakkı kavramını tartışmakta ve maddi hedeflerin özünde manevi hedeflerle nasıl yakından ilişkili olduğunu, manevi bağlantı olmadan maddi hedefler peşinde koşmanın da neden anlamsız olduğunu tartışmaktadır. Üçüncü makale ise, İslam ile kapitalizm arasındaki farkı açık seçik bir biçimde ortaya koyabilmek amacıyla, bu iki sistemdeki farklı ahlak ve adalet anlayışlarının, nasıl farklı iktisadi özgürlük kavrayışlarını ortaya çıkardığını tartışmaktadır."
