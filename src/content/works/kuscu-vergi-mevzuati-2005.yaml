abstract: "ÖZET Finansal piyasalardaki değişim, Dünya' da iktisadi ve siyasal olarak farklılaşma yönünde zıt kutupların yaratıldığı İkinci Dünya Savaşı sonrasında görülmüştür. Dünyada yaşanan bu gelişmelere paralel olarak Türkiye'de özellikle 1980 sonrası yatırım araçları ve finansman yöntemlerinin çeşitlendirilmesi ile mali piyasalarda büyük bir değişim yaşanmıştır. Bu kapsamda bankacılık sektöründe de bankalara benzeyen, bankalara alternatif olabilecek kurumların kurulabilmesi amacıyla yasal düzenlemelere gidilmiş ve bu amaçla faizsiz bankacılık da denilen ve faizli bankacılığa bir alternatif olarak Özel Finans Kurumları kurulmuştur. Bu şekilde Özel Finans Kurumları, birçok alternatif finansman yöntemini bünyesinde barındırarak bankacılık sistemindeki yerini almıştır. Özel finans kurumlan da aynen bankalar gibi fon toplamakta, fon kullandırmakta, havale, EFT, transfer işlemleri yapmakta, çek, poliçe, emre muharrer senet düzenlemekte, kredi işlemleri yapmakta, teminat mektubu vermekte, ithalat- ihracat işlemleri gibi klasik bankacılık işlemleri yapmaktadır. Vergi mevzuatı açısından bakıldığında bankalar ile özel finans kurumlarının vergi yükümlülükleri ve sorumlulukları temelde aynı olmakla beraber aralarındaki en önemli farkı KDV mükellefiyeti oluşturmaktadır. Bununla beraber özel finans kurumlarının kuruluş ve faaliyetlerine ilişkin BDDK tarafından düzenlenen, 20.09.2001 tarih ve 24529 sayılı Resmi Gazete'de yayımlanan Yönetmelik ve 5228 sayılı bazı vergi kanunlarında değişiklik yapılması hakkındaki Kanunla yapılan düzenleme ile, özel finans kurumlarının vergilendirilmesinde köklü değişiklikler meydana gelmiş ve vergi mevzuatı açısından bankalar ile aralarındaki farklılık büyük ölçüde giderilmiştir. Yapılan düzenlemelerle vergisel açıdan bankalarla aralarında mevcut olan adaletsizlik de ortadan kaldırılmıştır."
