abstract: "Her mezhepte olduğu gibi çeşitli meselelerde ulema arasında farklı görüşler değerlendirmeler ortaya çıkabilmekte, bunlar o mezhebe zenginlik katmaktadır. Bu, Şafii ve mezhebin uleması açısından da geçerli bu husustur. Bizzat Şafii'den sonra mezhep alimlerinden bir konuda üçe varan hatta zaman zaman daha fazla görüşler nakledilmektedir. Rafii de el-Muharrer adlı eserinde bu görüşler arasında tercihte bulunmuştur. Bu eser Şafii mezhebinde yazılan muhtasarlar içinde en güzel örneklerdendir. Müellif bu eserini kaleme alırken, ihtilaf edilen konularda mezhebin çoğunluğunun benimsediği görüşe bağlı kalacağını söylemiş ve bunu büyük oranda da başarmıştır. Şafii fıkhında devrinin en büyük alimi olan, Şafii mezhebine veya sünnetin açık hükmüne aykırı bulduğu görüşleri eleştirmekten çekinmeyen Nevevi, el-Muharrer'i Minhacü't-talibin adlı eserinde özetlemiştir. Bu çalışmasında Rafii'nin racih veya zayıf görüş olarak zikrettiği seksen meseleye itiraz etmiş, kendince racih olan görüşleri belirtmiştir. Ayrıca önemli gördüğü bazı eklemelerde bulunmuştur. Bu eseri çok takdir görmüş ve beğenilmiştir. Ancak Rafii'ye yaptığı itirazların çok az bir kısmında sonraki Şafii alimlerce eleştirilmiştir."
