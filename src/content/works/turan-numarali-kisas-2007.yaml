abstract: "Bir devletin hukuk sistemini ya da hukuki yapısını ortaya koyabilmek için öncelikle, o hukuk sisteminin esasını oluşturan hukuki mevzuatı ve bunların uygulama örnekleri olan mahkeme kararlarını incelemek gereklidir. Osmanlı hukuk sistemi şer'i ve örfî hukuk olmak üzere ikiye ayrılmaktaydı. Osmanlı hukukunun temel kaynaklarından biri şeri'at olmakla beraber Osmanlı Devleti'ni klâsik anlamda bir şeri'at devleti olarak vasıflandırmak yanlış olur. Şayet öyle olsaydı Osmanlı Devleti'nin şeri'atten başka bir kanunu olmaması gerekirdi. Hâlbuki uygulamada örfî hukukun daha ağır bastığı görülmektedir. Osmanlı Devleti'nde şer'i hukukun yanı sıra bir de örfî hukukun ortaya çıkışının, İslam hukukunun oluşum biçimiyle ve Osmanlı devletinin içinde bulunduğu siyasi, idari ve hukuki şartlarla olan yakın ilişkisi azımsanamaz. Bulunduğu coğrafyada tamamen hususî şartlar altında gelişen Osmanlı Devleti, şeri'atla birlikte onun dışında bir hukuk nizamı geliştirmiştir. Osmanlı Devleti'nin etnik, dini ve kültürel farklılıklar bakımından en zengin, ama aynı zamanda da problemli olan bir coğrafyada altı asrı aşan bir süre ayakta tutan faktörlerin başında bu devletin sahip olduğu hukuki yapı ve bunu işletiş biçimi olduğunu söylemek yanlış olmadığını sanırız. Bizce Osmanlı Devleti'nin bu hususta şanslı olduğu en önemli nokta oturmuş bir hukuki yapı ve işleyiş mirası üzerine kurulmuş olmasıydı. Bu sebeple bu devleti kuranlar Roma Hukuku'nda olduğu gibi sıfırdan bir hukuki yapı kurmak zorunda kalmamışlardır. Osmanlı Devleti'nin büyük ölçüde hukuki ve kültürel mirasını devraldığı Anadolu Selçuklu, Büyük Selçuklu ve Abbasi Devletleri esas itibariyle İslam hukukuna ve sonuncusu hariç olmak üzere belirli ölçüde de eski Türk-Moğol hukukuna dayanan bir hukuk düzenine sahiptiler. Kısas cezaları, en ağır cezalardan biridir. Kısas davaları Osmanlı adli sisteminde hemen hemen hiç hatayı affetmeyen bir alanı ihtiva etmektedir. Zira infazdan sonra bir hata tespit edilirse, onun telafisi mümkün olamamaktadır. İncelemiş olduğumuz 7 Numaralı Kısas Defteri'nde Osmanlı adli sisteminin hata affetmeyen bu dalında ne kadar adil ve hızlı bir yargılama yapmış olduğunu göreceğiz."
