abstract: "Karadâvî'nin azınlıklar fıkhına dair fetvalarının klasik fıkıhla mukayesesini amaçlayan bu çalışma giriş ve sonuç kısımları dışında iki bölümden oluşmaktadır. Birinci bölümde Karadâvî'nin hayatı, azınlıklar fıkhı ve kavramları ile Karadâvî'nin azınlıklar fıkhı anlayışı incelenmiştir. İkinci bölümde ise Karadâvî'nin fî Fıkhi'l-ekalliyyâti'l-müslime adlı eserindeki azınlıklar fıkhına dair fetvaları deliller ve delillerden istifade açısından dört mezhep özelinde klasik fıkıh kaynaklarıyla mukayese edilmiştir. Çalışmada doküman analizi ve karşılaştırma yöntemleri kullanılmıştır. Mukayese neticesinde Karadâvî'nin bu alandaki fetva ve yaklaşımlarında Müslüman azınlıkların dinlerini kolaylıkla yaşayabilmelerini sağlamak ve bu bağlamda onlar için en uygun fıkhî hükümleri ortaya koymak amacıyla hareket ettiği, bu hedef doğrultusunda mevcut fıkhî birikimden yararlanmakla birlikte çeşitli ictihadlarda bulunup yeni görüşler ortaya koyduğu, bu amaç ve yöntemin doğal bir sonucu olarak Müslüman olan bir kadının gayrimüslim olan eşiyle evliliğini sürdürmesinde bir sakınca olmadığı, Müslümanın gayrimüslime mirasçı olabileceği gibi klasik fıkıhta cevaz verilmeyen pek çok meselede Müslüman azınlıklara ruhsat tanıyarak kendine özgü bir azınlıklar fıkhı anlayışı oluşturduğu tespit edilmiştir. Çalışmanın neticesinde Karadâvî'nin azınlıklar fıkhı anlayışının, yöntem ve ulaştığı sonuçlar itibarıyla klasik fıkıhtan büyük oranda farklılık arz ettiği sonucuna ulaşılmıştır."
