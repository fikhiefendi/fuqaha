abstract: "Bu çalışmada Mergīnânî'nin, el-Hidâye eseri, en önemli şerhlerinden biri olan Fetḥu'l-ḳadîr'in, Kadızâde tarafından kaleme alınan tekmilesi Netâʾicü'l-efkâr perspektifiyle incelenmektedir. Öte yandan eserin tamamını incelemek çalışmanın sınırını aşacağı için bir konu sınırlamasına gidilmiştir. Müellifinin vefatı dolayısıyla tamamlanamayan eser ancak Kitâbu'l-vekâle'ye kadar yazılmıştır. Eserin kalan kısmını ise Kadızâde Şemseddin Ahmed Efendi, Netâʾicü'l-efkâr fî keşfi'r-rumûz ve'l-esrâr isimli tekmilesiyle tamamlamıştır. Çalışmaya örnek olarak seçilen konu da Kadızâde tarafından yazılan söz konusu tekmiledeki Kitâbu'l-kerâhiyye bölümüdür. Daha önce yapılan çalışmalarda ibâdet ve nikah bahislerinin sıklıkla çalışılmış olması ve muâmelât bölümlerinin ise çalışmanın sınırlarını aşacağı düşüncesiyle daha önce çalışılmamış bir bölüm olan Kitâbu'l-kerâhiyye bahsi seçilmiştir. Çalışma boyunca Kadızâde'nin, Netâʾicü'l-efkâr eserinde el-Hidâye'yi ve el-Hidâye şârihlerini desteklediği ve itirazlarda bulunduğu noktaların tespiti yapılmaya çalışılmıştır. İncelemeler neticesinde Netâʾicü'l-efkâr'ın Hanefî fıkhına tesiri ve gerek Netâʾicü'l-efkâr'da gerekse de el-Hidâye'de geçen kavâid-i fıkhiyeler tespit edilmiştir. Çalışmada ayrıca Şeybânî'nin el-Câmiʿu'ṣ-ṣaġīr'i ile Kudûrî'nin el-Muḫtaṣar'ının, Mergīnânî'nin yazdığı Bidâyetül-mübtedî eseri üzerindeki tesirlerine de temas edilmiştir. Bununla birlikte çalışmada tekmile yazım geleneği üzerine de bazı mülahazalar getirilmiştir."
