abstract: "ÖZET DOKTORA TEZİ İSLAM HUKUK TARİHİNDE DEVLET VE FONKSİYONLARI İzzet SARGIN Danışman : Prof. Dr. Beşir GÖZÜBENLİ 2001- SAYFA XV+245 Jüri : Prof. Dr. Beşir GÖZÜBENLİ Hukuk ve devlet, düşünceyi asırlar boyu meşgul eden iki olgudur. İşlevsel açıdan büyük önem taşıyan hukuk, devlet ve kurumlar, tarihi süreçte, teori ve uygulamada farklı görünümler arzetmiştir. Çünkü değişen hayat insanların yeni modeller ve uygulamalar geliştirmelerini zorunlu kılmaktadır. Buna paralel olarak, gelişmeyi disipline etmede din de önemli bir unsurdur. Bu sebeple, bütün toplumlarda olduğu gibi, müslüman hukukçu lar ve uygulayıcılar da geçmişte bu kavramları kendi kültürel ortamlarına uygun şekilde anlamış ve yorumlamışlardır. Öyleyse günümüzde devlet ve hukuk yapılanmasında, içinde bulunulan kültürel ortam ve birikim etkili olmalıdır. Bu etkininin boyutlarını nasslar, ta rihteki uygulamalar ve son bilimsel veriler beraber belirlemelidir."
