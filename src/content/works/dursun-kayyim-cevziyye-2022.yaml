abstract: "Allah Teâla'nın yeryüzünde adaleti tahsis etmek için gönderdiği İslâm'ın hiçbir kuralı gereksiz değildir. İslâm'ın tüm kurallarında ya bir maslahatın celbi ya da bir mefsedetin def'i vardır. Alimler bunu daha teknik bir ifade olan makâsıdü'ş-şerîa olarak isimlendirmişlerdir. İbn Kayyim el-Cevziyye'nin İ'lâmü'l-Muvakkıîn isimli kitabı bir İslâm hukuk metodolojisi eseri mahiyetindedir. Bu metodolojinin Hz. Peygamber'den itibaren gelişim seyri ve genel esasları eserde ele alınmıştır. Kitapta usûl konuları detaylı bir şekilde incelenmiş, ardından konular delillerle izah edilmiştir. Bundan dolayı kitap, temel usûl eserleri içerisinde kabul edilmektedir. İbn Kayyim el-Cevziyye'nin İ'lâmü'l-Muvakkıîn isimli eserinde İslâm hukukunda yer alan maslahata dair hükümlerin tespiti önem arzetmektedir. Bu çalışmada İ'lâmü'l-Muvakkıîn eseri içerisindeki maslahat ve makâsıd temelli hükümler tespit edilmiştir."
