abstract: "Bu çalışma, kar amacı gütmeyen kuruluşların rolünü keşfetmeyi amaçlamaktadır, özellikle de Uluslararası İslami Yardım Kuruluşu deneyimini bir model olarak analiz etmeyi ve Yemenlilerin ekonomik geçimini iyileştirmekte ve istihdam fırsatları sağlamakta oynadıkları rolü açıklamayı hedeflemektedir. Ayrıca, faydalanıcıların kapasitelerini ve becerilerini artırmadaki rolünü açıklamayı, kar amacı gütmeyen kuruluşlar tarafından gerçekleştirilen ekonomik güçlendirme girişimlerinin karşılaştığı zorlukları incelemeyi ve olası çözüm önerileri sunmayı amaçlamaktadır. Çalışma, önemli kavramları tanımlamak ve çalışmayla ilgili önemli kilometre taşlarını vurgulamak için bir açıklayıcı-tarihsel metodolojiyi kullanarak karma yöntemler yaklaşımını benimsemiştir. Ayrıca, verileri anketler aracılığıyla toplayarak ve analiz ederek bir açıklayıcı-analitik korelasyonel metodolojiyi kullanmıştır. Çalışma, kar amacı gütmeyen kuruluşların Yemenlilerin ekonomik geçimini iyileştirmede ve istihdam fırsatları yaratmada önemli bir rol oynadığını, ayrıca becerileri geliştirmede ve şekillendirmede rol aldıklarını ve ekonomik rehberlik ve danışmanlık sağladıklarını bulmuştur. Ancak, aynı zamanda bu kuruluşların finansman sıkıntıları ve faydalanıcıların ulaşılmasındaki zorluklar gibi zorluklarla karşılaştığını bulmuştur. Çalışma, kar amacı gütmeyen kuruluşların faydalanıcılar ve ortaklarla güçlü ilişkiler kurmalarını, personel gelişimine yatırım yapmalarını ve modern teknolojiyi kullanmalarını, bürokrasiyi azaltmalarını önermektedir. Ayrıca, yerel otoritelerin kuruluşlarla koordine etmelerini ve gerekli kolaylıkları sağlamalarını önermektedir. Ayrıca, çalışmanın Yemenlilerin ekonomik güçlendirme ve kar amacı gütmeyen kuruluşlarla ilgili hassas masa ve alan araştırmaları yapmalarını ve sonuçları yaymalarını, anlayışı artırmalarını ve uygun önlemleri almak için gerekenleri yapmalarını teşvik etmektedir."
