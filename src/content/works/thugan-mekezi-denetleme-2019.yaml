abstract: "Bu çalışmanın konusu, Filistin Para Yönetimi'nin aldığı bir karar uyarınca sekiz yıl önce kurulan ancak Mayıs 2018 tarihine kadar uygulanmayan kararın yürürlüğe girmesi sonucunda ülkedeki İslami banka ve kurumların içindeki şer'i denetleme kurullarını denetleme rolünü üstlenmek amacıyla çalışmaya başlayan Filistin Yüksek Şeri Denetleme Kurulu'nun aktifleştirilmesidir. Çalışmanın bölümlerine geçmeden önce, araştırma esnasında ortaya çıkan bazı engellere değinilecektir: Filistinlilerin İslami bankalarda ve şer'i denetleme kurulları alanında tecrübesinin fazla olmaması ve bunun araştırma esnasında kullanılabilen veri ve bilgi kaynakların bulunmasına yansıması, zira herhengi bir araştırma dayanabileceği bir bilgi zeminine ihtiyaç duymaktadır. İslami bankacılık işlemlerini şer'i olarak denetleme alanında uzmanların az olması nedeniyle araştırmacının çalışmanın konusunu güçlendirecek görüşmeleri yapmaya çalışırken zorluk çekmiştir, çünkü şer'i denetleme konusunda akademik olarak ya da İslami bankalarda çalışanların çoğu ekonomi ya da ilahiyat bölümlerinden mezunlardır. Çalışma konusundaki kaynakların ve onu ele alan araştırmaların az olması. Bunlardan hareketle çalışmanın planı aşağıda belirtildiği gibidir: Birinci bölümde araştırmanın genel çerçevesi, kullanılan metodoloji, araçlar ve araştırmacının dayanıp temel aldığı önceki araştırmalardan söz edilmektedir. İkinci bölümde Filistin ve dünya bazındaki İslami bankaların tarihçesine değinilmektedir. vi Üçüncü bölümde Filistin ve dünya bazındaki İslami bankaların öneminden ve ortaya çıkan sorunlardan bahsedilmektedir. Dördüncü bölümde kavram, önem ve karşılaşılan sorunlar bakımından Filistin'deki İslami bankalara şer'i denetlemek konusundan söz edilmektedir. Son olan beşinci bölümde ise Filistin'in Yüksek Şer'i Denetleme Kurulu'nun rolünün aktifleştirilmesi ve İslami bankalara yüksek/merkezi şer'i denetleme konusunda bazı Arap ve uluslararası tecrübelerden bahsedilmektedir. Sonuç: Bu çalışmada, Filistin'deki yüksek kurulunun aktifleştirilmesi ve yerel İslami bankaların gelişmesinde katkı sağlayıp başarılar gerçekleştirene kadar ortaya çıkan sorunları ve engelleri aşarak işe devam etmesi gerektiği neticesine varılmaktadır. Ayrıca, yetkili makamların İslami bankalara şer'i denetleme alanında çalışabilen yetenekli ve donanımlı insan kaynaklarını sağlamak konusunda özen göstermesi gerektiği vurgulanmaktadır."
