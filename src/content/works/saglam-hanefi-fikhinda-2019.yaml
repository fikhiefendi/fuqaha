abstract: "Âlimlerin fıkhî meselelerdeki ihtilaflı görüşleri ve bunların delillerini inceleyen hilâfiyyât ilmi, fıkıh ilminin bir alt dalıdır. Hicri ikinci yüzyılda oluşmaya başlayan bu ilim, mezheplerin teşekkülü ile gelişmiş ve bu alanda fakihlerin ihtilaflarını derleyen birçok kitap telif edilmiştir. Hilâfiyyât ilmini ele alan bu tez üç bölümden oluşmaktadır. Bunlara ilaveten Ömer Nesefi'nin Matla'u'n-nücûm isimli eseri içerisinde yer verdiği hilâfiyyât eserinin tercüme ve açıklaması ek olarak verilmektedir. Birinci bölümde hilâfiyyât eserleri, yalnızca Hanefî mezhebi âlimleri tarafından kullanılmış olan özel bir metot üzerinden tasnif edilmiş ve bu tasnifin ardından Hanefî hilâfiyyât eserleri ele alınmıştır. İkinci bölümde Nesefi'nin kaleme aldığı Matla'u'n-nücûm kitabı ve bunun içerisindeki hilâfiyyât eseri incelenmiştir. Üçüncü bölümde ise çalışmamıza konu olan eserin tenkitli neşri verilmiştir. Çalışmaya ek olarak tenkitli neşri verilen eserin tercümesi ve eserdeki ihtilaflı meselelerde tarafların delilleri kısaca açıklanmıştır."
