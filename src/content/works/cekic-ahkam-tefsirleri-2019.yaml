abstract: "İnsanın tabii, fıtri, örfi veya dinî bir gerekçeyle vücudunun belli yerlerini kapatması ilk insandan itibaren her toplumda görülmüş bir gerçekliktir. Bunun uygulanması ise toplumdan topluma değişmektedir. Örtünme kimi toplumlarda geleneklere göre belirlenmiştir. İlahi dinin etkisinde olan toplumlarda ise örtünmede dinin kuralları etken olmuştur. Örtünme konusunda Kur'an'da bulunan ayetlerin anlam çerçevesi her dönemde üzerinde çalışılan bir konu olmuştur.“Ahkâm Tefsirleri Çerçevesinde Kur'an'da Tesettür”başlıklı bu tez, örtünme konusunu iki aşamada ele almıştır. Birinci aşamada tesettürün farz kılınışına kadarki süreçte gelen, tesettürün alt yapısını oluşturan Mekkî ayetler ele alınmıştır. Bu ayetlerde insanı ve toplumu ilgilendiren diğer konularda olduğu gibi tesettürün zihni ve ahlaki temellerine vurgu yapılmış, her yönden temiz bir hayat ve takva gibi önemli hedefler üzerinde durulmuştur. Bu şekilde muhatap zihnen tesettür emrine hazır hale getirilmiştir. İkinci aşamada ise tesettürü emreden ve çerçevesini açıklayan Medenî ayetler ele alınmıştır. Konu ile ilgili ayetler incelendiğinde görülmüştür ki; Kur'an ahlaklı toplum için ilk olarak erkeklere sonra kadınlara bakışlarına sahip olmalarını emretmiştir. Buna ek olarak kadınların kalbinde hastalık bulunan kişilerin kötü niyetlerinden korunmaları için kıyafetleri, konuşma ve yürümeleri gibi davranışlarına dair düzenlemeler içeren kurallar koymuştur."
