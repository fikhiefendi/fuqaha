abstract: "Ekonomide tasarruf sorunu; tasarruf oranlarının düşük olması, mevcut tasarrufların yatırımlara etkin biçimde aktarılamaması veya tasarruf oranlarının yatırım oranlarının üstünde olması şeklinde tanımlanabilir. Türkiye'deki tasarruf sorunu ise yurtiçi tasarruf oranlarının sabit sermaye yatırımlarının altında kalması, yastıkaltı tasarruf büyüklüğü ve mevcut tasarrufların etkin kullanılmaması olarak ifade edilebilir. Türkiye'de tasarruf sorunu cari açık ve sürdürülebilir büyümeyi etkilemekte ve ekonominin gizilgücünü zayıflatmaktadır. Çözüm için yurtiçi tasarrufları etkileyen değişkenlerin belirlenerek, üretilen politikaların bu değişkenler üzerinde yoğunlaşması sağlanmalıdır. Toplumsal tasarruf davranışı ile tasarrufu belirleyen değişkenler ülkeden ülkeye farklılık göstermektedir; ancak tasarruf sorununun altında yatan bazı ortak noktalar aranabilir. Bu noktaların başında ise fon arzında ve talebinde bulunanların karşılaştığı piyasa olan mali düzen gelmektedir. Mali düzen taşıdığı özellikler açısından tasarrufları yatırım ya da tüketim gibi kanallara aktararak fonların etkinliğini sağlamaktadır. Bu bağlamda mali düzenin gelişimi ve sunduğu hizmetler, tasarrufların toplanması ve kullanımı açısından önemlidir. Mali düzeninin gelişimi ise“mali derinlik”ve ekonomilerin büyük bir çoğunluğunda mali düzenin temel yapı taşlarından biri olan“faiz”kavramı ile yakın ilişkilidir. McKinnon-Shaw Varsayımı'nın öncülük ettiği“Mali Baskıcı Yaklaşım”tarafından savunulan, mali serbestleşme ve faiz tavanlarının kaldırılması yoluyla tasarruf artışının yaşanacağı savından hareketle: mali derinleşme ve reel faiz oranları Türkiye'de tasarrufu etkileyen değişkenler olarak seçilmiştir. Bu çalışmanın amaçlarından biri Türkiye'deki tasarruf sorununu tanımlayarak bu sorun çerçevesinde gerek Türkiye'de gerekse de seçilmiş ülke örneklerinde uygulanan politikaların başarısını tartışmaktır. Diğer amaç ise Türkiye'deki tasarruf sorununun çözümü için mali derinleşmenin artırılması ve faiz sınırlamalarının gevşetilmesi yoluyla tasarruf artışı sağlanacağının kuramsal ve görgül çalışmayla sınanmasıdır. Bu amaç doğrultusunda yurtiçi tasarrufların oluştuğu piyasa olan mali düzenin derinliği ve reel faiz oranının yurtiçi tasarruf ile uzun dönemli ilişkisini açıklamak ve bu ilişkinin yönünü ve anlamlılığını sınamak için ekonometrik çözümleme yapılmıştır. Çalışmanın sonucunda 1980-2015 dönemi için mali derinlik göstergesi olarak kullanılan“M3/GSYH”ve“reel mevduat faiz oranı”nın yurtiçi tasarruflar üzerinde pozitif ve istatistiksel olarak anlamlı bir etkiye sahip olduğu saptanmıştır. Bu kapsamda Türkiye'de tasarruf sorununun çözümü için; mali araç ve kurum sayısının arttırılarak toplumun her kesimini kapsayan bir mali düzenin oluşturulması gerekliliği belirtilmiştir. Bu düzenin sürdürülebilir yapıda kalması için mali okuryazarlık konusunda yeni politikalar geliştirilerek toplumsal tabanda bu eğitimin yaygınlaştırılması da sağlanabilir."
