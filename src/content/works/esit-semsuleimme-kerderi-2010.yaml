abstract: "Türkiye'deki üç farklı kütüphanede yedi tane nüshası bulunan Şemsüleimme el-Kerderî'nin ?Risâle fi'r Redd `Ale'l-İmam el-Gazzâlî? adlı eseri üzerinde yaptığımız bu çalışma giriş, üç bölüm, sonuç ve kaynakçadan oluşmaktadır.Birinci bölümde Şemsüleimme el-Kerderî'nin hayatını ve eserlerini tanıtıp, Hanefi fıkhındaki yerini belirlemeye çalıştık.Risalenin tahliline ayrılan ikinci bölümde; risâlenin Hanefi fıkhındaki yeri, risâlede ele alınana konular, risâlede kullanılan yöntem ve risalede faydalanılan kaynaklar hakkındaki çalışmamız yer almaktadır.Üçüncü bölüm ise iki ana kısımdan oluşmaktadır. risâlenin tahkikini içeren birinci ana başlıkta risâlenin elimizdeki mevcut nüshaların tanıtımı tahkikte izlene metot ve tahkikli metin yer almaktadır. İkinci ana kısımda ise risâlenin tercümesi bulunmaktadır.Tezimiz sonuç ve kaynakça ile sona ermektedir."
