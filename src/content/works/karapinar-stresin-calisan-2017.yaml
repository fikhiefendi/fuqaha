abstract: "Kişilerin içinde bulundukları sosyal ortam iş ve işyeri koşullarının meydana getirdiği etkiler neticesinde, insan vücudunda ortaya çıkan tepki durumu olarak ifade edilen stres, günümüz koşullarında birçok kişinin karşılaştığı bir durumdur. İş hayatında kişiler üzerinde stres yaratan birçok faktör bulunmaktadır. Kişilerin hem özel hayatlarında, hem de profesyonel iş hayatlarında maruz kaldıkları stres faktörünü kontrol edebilmesi oldukça güçtür. Kişilerin hedefledikleri sonuçlara ulaşabilmesi, işletmelerin ise yoğun rekabet ortamında fark yaratarak varlıklarını sürdürebilmesi ve kaliteli sonuçlara ulaşabilmesi, maruz kalınan stresin optimal düzeyde olmasıyla başarılabilir. Çalışmada stres, stres kaynakları, stresin oluşumu ve aşamaları, stresin nasıl yönetileceği ve stresin ne gibi sonuçlar ortaya çıkaracağına ilişkin bilgiler verilmiştir. İkinci kısımda performansla ilgili tanımlar, performansın nasıl yönetileceği ve performans değerleme ele alınmıştır. Üçüncü bölümde ise stres ve performans arasındaki ilişkiden bahsedilmiştir. Yapılan anket çalışmasında Türkiye'de faaliyet gösteren bir katılım bankasının çalışanlarının demografik özelliklerine, örgüt içerisinde maruz kalabilecekleri stres kaynaklarına ve performans algılarına ilişkin sorular sorulmuştur. Bu sorular neticesinde kişilerin demografik özellikleri ile örgütsel stres faktörlerinden kurumsal yapı stres faktörü ve gösterdikleri performansa ilişkin değerlendirmeleri arasında herhangi bir ilişki olup olmadığı tespit edilmeye çalışılmıştır."
