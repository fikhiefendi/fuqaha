abstract: "Evlilik ve din insanlığın önemini hiç kaybetmeyecek gündemidir. Bu nedenledin bütün sosyal kurumları etkileyen, onlara kavram kazandıran bir güce sahiptir.Toplumların vazgeçilmez değere sahip en küçük birimi olan aile, insanoğlunungeleceğinin teminatıdır. Mutluluğunun, gelişiminin teminatıdır. İslâm dini insanlarındünya ve ahiret mutluluğunu hedef edindiği için evlilikle ilgilenmiştir. Bu hedefigerçekleştirmeye yarayacak hükümler koymuştur. İslâm Aile Hukukunda evlilik engeliolarak din farkıyla ilgili hükümleri de bu noktadan ele almak gerekir. Aynı dinden olankişlerin evliliklerindeki uyum farklı dinden olanlarınkinden daha kolay olacaktır. Diğertaraftan eşler arasındaki din farklılığı çocukların yetişmesinde sıkıntılaroluşturabilecektir.İslâm Aile Hukukunda evlilik engeli olarak din farkı problemini çevreleyenilkeler vardır: Aile hukukuna hâkim ilkeler emredici olmakla birlikte, nikâh akdi hukukibir akittir.Çalışmamız boyunca elde ettiğimiz bilgilere göre, İslam dininde müşrikkimselerle evlilik Kur'anın açık delaletiyle yasaklanmıştır. Yine Kur'anın açıkdelaletiyle Müslüman erkek ehli kitap kadınlarla evlenebilir. Müslüman kadının ehl-ikitap kimselerle evliliğini açık olarak ortaya koyan Kur'an ve Sünnet ifadesi2bulunmamaktadır. Burada müşrik, ehl-i kitap, kâfir kelimeleri Kur'anın bütünlüğüiçerisinde anlaşılması gereken anahtar kelimelerdir."
titleTranslation: {"en": "The religious differentiation of couple as a prohibitivein Islamic marriage"}
