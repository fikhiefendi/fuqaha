abstract: "Tezin adı: Kuran-ı Kerimde Müminlerin Nida Ayetlerinde Şeriat Mucizesi (Karşılaştırmalı Analitik Çalışma) Amaç: Bu konunun amacı ve önemi Kuran-ı Kerimde müminlerin nida ayetleri derlemesinden, yasalarında mucize tezahürlerini vurgulayan objektif ve akademik bir çerçevede gösterilmesinden kaynaklanmaktadır. Bu da, kuranın kaynağını ve Cenabı Allah'ın tarafından indirilen bir kitabın olduğunu kanıtlamakla büyük bir hedefe ulaşmanın önemli bir yolu sayılmaktadır ve bu Muhammed'in (sallallahu aleyhi ve sellem) peygamberliğinin birçok kanıtından biridir. Yöntem: Bu araştırmada araştırmacı, çalışılan konuya bağlı olarak değişiklik gösteren birtakım yöntemi bir araya getirdi. Bunlardan biri, Medeni surelerin içinde geçen müminlerin nida ayetlerinin izlenmesi, envanter edilmesi, sınıflandırması ve araştırmanın bölümlerine dağıtılması yoluyla inceleme ve izleme yöntemidir. Araştırmacı, araştırma konusu ayetlerin mucizesi yönlerini göstermede analiz ve yorumlama yöntemini kullandı. Karşılaştırma yöntemi ise araştırmacının tarafından müminlerin nida ayetlerinde geçen hukuk mucizesinin semavi dinerin“Yahudilik ve Hıristiyanlık ”hukuku ile insan hakları ve Birleşmiş Milletler mevzuatları ve anlaşmaları gibi çağdaş pozitif hukukla karşılaştırılmasında kullanıldı. Araştırmanın konularını üç ana bölüme, yedi bölüme ayrıldı. Başta önsöz ve giriş bölümü ve son gelmektedir. Giriş bölümü üç alt bölüm içermektedir. Birinci ana bölümü akide alanında şeriat mucizesi için ayrıldım ve iki bölüm içermektedir. İkinci ana bölüm çalışmanın büyük bir kısmını almıştır. Bu yüzden bu ana bölümü müminlerin nida ayetlerinin şeriat yönündeki şeriat mucizeviliğidir. Burada demek istenilen ibadeti, muameleleri, cihadı ve cezaları kapsayan ayetlerdir. Bu da üç bölüme ayrılmıştır. Bu sıralamadan sonra son bölümü gelir ve çalışmanın vardığı en önemli sonuçları içerdi. Ardından kuran-ı Kerim ayetleri, hadisler, kaynak ve konu fihristleri gelmektedir. Sonuç ve Bulgular: Kuran-ı kerimde müminlerin nida ayetlerinin çoğu, Kuranın ve mucizevi şeraitinin sadece ahret konularıyla değil de müminlerin hayatlarını düzenlemeye, dünya ve ahrette iyi olmalarının yolunu göstermeye geldiğini, ayrıca Kuranın Allah'ın kitabı olduğunu, yasalarının mucizeviliğini ve kapsamlılığını vurgulamıştır."
