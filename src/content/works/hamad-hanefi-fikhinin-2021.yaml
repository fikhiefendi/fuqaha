abstract: "Hanefi mezhebinin, öncü fıkhı ve ictihat ile re'ye dayalı yapısı nedeniyle, çağdaş fetvaların bu mezhebin fıkhından etkilenme derecesini öğrenmek istedim. Bunu yaparken de Mısır Fetva Kurumunun mali muâmelât konusunda bey' (satım işlemleri) alanında verdiği bir grup fetvayı inceledim. Zira bu alandaki ictihat dairesi daha geniş olup fetvalar da yer, zaman ve duruma göre daha fazla değişiklik arzedebilmektedir. Mısır fetva ansiklopedisi, boyutunun büyüklüğü, meselelerinin çeşitliliği ve fıkhi fürularının, hayatın birçok sosyal yönleri ile alakalı olması nedeniyle bu sahada önemli bir örnek sayılmaktadır. Bu çalışmada 31 meseleyi ele aldım. Çalışmada, önce fetvayı sundum, ardından bu fetva ile ilgili lafız ve sözcüklerin anlamlarını verdim, ardından meseleyi daha anlaşılır hale getirmek için açıkladım ve daha sonra ele alınan konu ile ilgili İslam hukukçularının ittifak ve ihtilaf ettikleri görüşleri aktardım, son olarak da fetva ile mezhep görüşleri arasında karşılaştırma yaptım. Bu çalışma sonunda; Hanefi mezhebinin, bu fetvalar üzerinde çok büyük etkisinin olduğu sonucuna ulaştım."
