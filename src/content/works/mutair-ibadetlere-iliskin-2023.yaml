abstract: "Çalışma neshin sebepleri ve ibadet ahkamına etkisine dair olup, makâsıd ve usul eksenli bir araştırmadır. Araştırma giriş ve üç bölümden oluşmaktadır. Birinci bölümde, nesh kavramı, neshin varlığının delilleri, neshin şartları, neshin rukünleri ve neshin türleri ele alınmıştır. Çalışmada konuyla alakalı deliller ve naslar değerlendirilirken betimleyici ve tümevarımsal yönteme başvurulmuştur. Araştırmanın ikinci bölümünde, tahfîf, ahkâmda tedricilik, yer değişikliği, maslahatların celbedilip zararların defedilmesi gibi neshin sebepleri fıkıh ilmi çerçevesinde veistinbat yöntemiyle ortaya konulmuştur. Üçüncü bölümde ise neshin ibadetlerle alakalı ahkâma etkisi araştırılmıştır. Bu bölümde bir taraftan neshin tahâret, namaz, oruç, zekat ve hacla alakalı hükümlere etkisi irdelenirken, diğer yandan fukahânın ibadete dair muhtelif meselelerdeki fıkhî ihtilaflarına yer verilmiştir. Çalışma alanımızla ilgili fıkhî meseleler, dört mezhebe ait temel kaynaklardan tümevarımsal bir yöntemle sonuca ulaştırılmıştır."
