abstract: "İslami finans son zamanlarda Müslüman ülkelerdeki sermaye birikiminden ötürü giderek popüler hale gelmiş bir kavramdır. Konvansiyonel iktisadın hüküm sürdüğü ekonomilerin sürekli şekilde kriz doğuracak işlemler gerçekleştirmesinden ötürü tüm dünya ekonomik bir alternatif arayışındadır. İslami finans; faizi direkt olarak iktisadi denklemlere sokmaması, tam rezerv uygulanması sebebiyle kaydi para oluşumuna izin vermemesi, belirsizlik içeren işlemlerden uzak durulması sebebiyle spekülatif atakları hoş karşılamaması gibi sebeplerden ötürü konvansiyonel iktisada alternatif olarak görülmektedir. Bununla beraber İslami finansı uygulayan çok sayıda ülkede piyasayı konvansiyonel iktisat esaslarına uygun olarak kurulan Merkez Bankaları yönetmektedir. Bu piyasalarda ise hem katılım bankaları hem de faiz hassasiyeti bulunan yatırımcılar Merkez Bankası tarafından para politikası amaçlarına varmak için belirlenen araçları kullanamamaktadırlar. Merkez Bankası, para politikasını genelde fiyat istikrarını sağlamak amacıyla sürdürmektedir. Belirlenen politikanın başarılı olması ise piyasada yer alan tüm aktörlerin bu politikaya bağlı olarak hareket etmesine bağlıdır. Uygulamada katılım bankaları ile faiz hassasiyeti bulunan yatırımcıların faizli piyasada yer almamasından ötürü para politikası amaçlarına varabilmek için seçilen ülkelerde Merkez Bankası tarafından para politikası aracı olarak kullanılan ürünleri belirtmek bu tez çalışmasının temel amacını oluşturmaktadır. Bu kapsamda öncelikle para politikasının tanımına, tarihçesine, amacına ve araçlarına önce konvansiyonel iktisat sonrasında da İslami finans açısından yer verilecek, iki iktisadi sistemin dayandığı esaslar ve aralarındaki farklar belirtildikten sonra seçilen OIC ülkelerinde uygulanan bazı para politikası araçları değerlendirilecek ve İslami finans uygulamalarının başarılı olması için Merkez Bankası tarafından kullanılabilecek bazı para politikası araç önerilerine yer verilecektir."
