abstract: "Bu tezde, dünyanın beş farklı bölgesinde bulunan, Müslüman olan veMüslüman olmayan ülkelerdeki 2008 küresel mali kriz durumu sonrası faizsizbankacılık eğilimleri açıklanmıştır. Faiz ve türlerinin tanımlanmasını ardından,faizsiz bankacılık sistemi, mali politikaları, bu sistemin nasıl işlediği, faizsizbankacılık ve ticari bankacılık arasındaki farklar, İslami bankacılıkta yatırımaraçları ve sistem bileşenleri, Müslüman olan ve Müslüman olmayan ülkelerdefaiz bankacılık sistemi sunulmuştur.Sonuç bölümünde, İslami bankacılığın gelecekte hem Müslüman olan hemde Müslüman olmayan ülkelerde daha da yaygınlaşacağı vurgulanmıştır;ayrıca, İslami bankacılığın küresel mali krizden büyük oranda etkilenmediği,aksine yapısı gereği bu durumdan çok az etkilendiği araştırmalar sonucuortaya konmuştur."
