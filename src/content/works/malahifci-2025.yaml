abstract: "Bu araştırmada, kalıtsal hastalıkların evlilik hükümlerine etkisi konusunu çağdaş fıkhî bir bakış açısıyla ele aldım. Çünkü bu hastalıklar, İslam hukukunun temel amaçlarıyla –özellikle neslin korunması ve ailenin muhafazası– doğrudan alakalıdır. Araştırma, modern tıbbî veriler ile köklü fıkhî hükümler arasında kapsamlı ilmî bir bağlantı kurarak ve Müslüman ailelerin beşeri ve sosyal gerçeklerini de göz önünde bulundurarak konuyu ele almayı amaçlamıştır. Araştırma üç bölüm ve alt başlık hâlinde düzenlenmiştir. İlk olarak kalıtsal hastalıkların tanımı, türleri ve sebepleri gibi temel kavramları ele alınmıştır. Ardından bu hastalıkların evlilik akdi üzerindeki etkisi, evliliğin feshi için meşru bir kusur sayılıp sayılmayacağı üzerinde durulmuştur. Ayrıca evlilik öncesi tıbbî testlerin bu hastalıkların yayılmasını önlemedeki rolü konusuna da değinilmiştir. Araştırmada ayrıca, kalıtsal hastalığın çocuklara geçme ihtimali durumunda üreme ile ilgili hükümler değerlendirilmiştir. Bu bağlamda, geçici doğum kontrolü, ceninin hastalıklı olması durumunda –şer'î ölçüler çerçevesinde– kürtajın hükmü gibi konular incelenmiştir. Araştırmada evlilik öncesi tıbbî taramanın şer'î açıdan meşru bir yöntem olduğu, zorunlu hallerde eşlerin ayrılmasının veya çocuk sahibi olmalarının engellenmesinin caiz olduğu, bazı durumlarda, ruh üflenmeden önceki aşamada kürtajın mubah olabileceği sonucuna ulaşılmuştır. Çalışmada, aynı zamanda ilmi, dinî ve sosyal birtakım tavsiyeler sunmaktadır. Bu tavsiyeler; bilinçlendirmeyi artırmak, yasal düzenlemeler ile tıbbî uygulamaları ve aile danışmanlığını daha etkili hâle getirmek gibi hedefler taşımaktadır. Bu araştırma özünde, bireylerin ve toplumların, insan onurunu koruyan ve şeriatın amaçlarını muhafaza eden; ilme dayalı, dengeli ve bilinçli ailevi kararlar alabilmesini destekleyecek insani bir fıkhî bilinç inşa etmeyi amaçlamaktadır."
