abstract: "İslam hukukunda, bazı özel durumlar hariç temsil ve temsile ilişkin hükümler genel olarak vekâlet akdi içinde ele alındığından ayrıca bir düzenlemeye gidilmemiştir. Genel yapısı itibari ile temsil, temsil edenin temsil olunan yerine yetkilendirilmesi şeklinde gerçekleşmektedir. Temsil olunan temsil edeni akitle yetkilendirdiğinde vekâlet, temsiliyet ehliyet arızasından kaynaklı eksiklikten doğan durumdan dolayı ise temsil olunanın iradesine bakılmadan yetkilendirildiğinde velâyet, ehliyet eksikliği ile ilgili bir kanaatten hareketle birinin yetkilendirilmesi sureti ile gerçekleşiyor ise vesâyet söz konusu olmaktadır. Bir şahsın vekili, velisi veya vasisi hukukî temsilcisi olmadığı halde o şahıs adına hukukî işlemlerde bulunmasına yetkisiz temsil, bu doğrultuda hareket edene ise fuzûli denilmiştir. Fıkıh alimleri, fuzûlinin tasarrufunun sahih olup olmadığı hususunda ittifak edememişlerdir. Vekâlette, temsil olunanın (müvekkil) tasarruf ehliyetine haiz olması gerekirken, velâyet ve vesâyette temsil olunanın tasarruf ehliyetine sahip olma şartı yoktur. Ancak vekil, veli ve vasinin tasarruf ehliyetine sahip olması gerekmektedir. Velâyette, ihtilaflı olmakla beraber veli olmak için erkek olmak şartı varken vesâyette vasî olmak için cinsiyet şartı yoktur. Temsil, temsil edenin temsil edilen tarafından azledilmesi, temsil edenin istifası, temsil edilenin ya da temsil edenin ölmesi, temsil yetkisinin ortadan kalkması, temsil için konulan şartların sağlanmaması, temsil için verilen sürenin dolması gibi durumlarda sona erer. Vekâlet, çift taraflı gerçekleşerek taraflara akdî sorumluluk yüklemekteyken tek taraflı irade beyanı ile gerçekleşen temsilde akdî bir sorumluluk bulunmamaktadır. Vekâlet akdinde vekille müvekkil arasında iç temsil gerçekleşmektedir. Temsilde, temsil eden temsil edilen adı¬na kendisiyle işlem yaptığı üçüncü kişi arasında dış temsili gerçekleştirmektedir. Temsil yetkisi modern hukukta evlilik, boşanma ve vasiyet gibi şahsa has haklarda kullanılmazken, İslam hukukunda şahsa has haklardan olan evlilik, boşan¬ma gibi konularda temsil câiz görülmüştür."
