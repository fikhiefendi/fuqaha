abstract: "Konumuz, geçmişte olduğu gibi günümüzde de müslümanlar açısından önemini korumaktadır. Hacda vekâlet konusunun ilmi bir disiplin içerisinde ele alınıp incelenmesi, bizce bir ihtiyaç olarak tespit edilmiştir. Amacımızı gerçekleştirmek için konu bu başlıkla ele alınmıştır.Bu çalışmamız; giriş, üç bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde akit kavramı ve çeşitlerinden, ayrıca vekâletin akitler içindeki yerinden bahsettik. Birinci bölümde vekâletin sözlük ve terim anlamını, mezheplerin ve mecellenin tanımını, rükün ve aksamını, kitap, Sünnet ve icmaya dayanan meşruluğunu, vekâletin çeşitleri ve hükümlerini, ayrıca vekâletin sona erme şekillerini ele aldık. İkinci bölümde ibâdetlerde vekâlet konusunu, üçüncü bölümde ise çalışmamızın asıl konusu olan hacda vekâlet konusunu inceledik. Sonuç kısmında ise genel değerlendirmemizi yaptık."
