abstract: "Mekkî ve Medenî dönemde nazil olan ayetlerde yaklaşık 200-250'ye yakın ayetin infak ve zekatla ilgili olduğu görülmektedir. Yaklaşık 87-90 surenin Mekke'de nazil olduğu bilgisinden hareketle bu dönemde nazil olan ayetlerde yer alan doğrudan veya dolaylı infak ve zekata delalet eden ayetlerin sayısının azımsanmayacak oranda olduğu bir gerçektir.Kur'an'ın mesajının doğru anlaşılabilmesinin ön şartı, cahiliye dönemi Mekke halkının yaşantılarına dair malumatların bilinmesidir. Bundan ötürü çalışmamızın giriş bölümünde İslam öncesi Arap toplumunun ticarî, iktisadî ve sosyal yapısı ana başlıklar halinde incelenmiştir.Birinci bölümde, Hz. Peygamber'den önceki Peygamberler döneminde infak-zekat ile ilgili tavsiye ve uygulama niteliğindeki ayetlerin tespiti, Kur'an'ın infak ve zekat ile ilgili va'z ettiği hükümlerin daha iyi anlaşılabilmesi ve bu hükümlerin tarihten o güne kadar geçirdiği aşamaların neler olduğu konusunu açığa çıkarmaktadır. Bu amaç güdülerek Kur'an'da geçen peygamberlerden bir kısmının anlatıldığı sureler ve ayetler üzerinde duruldu. Zikredilen peygamberler döneminde infak ve zekata dair ayetlerin tahlili yapılmıştır. Özellikle İsrail oğulları peygamberlerinden olan Musa (a.s.) ve İsa (a.s.) dönemlerinin anlatıldığı ayetler üzerinde durulurken, Tevrat ve İncil nüshalarına başvurulup bunların Kur'an'da verilen bilgilerle mukayesesi yapılmıştır.İkinci bölümde ayetlerin indiği dönem esas alınarak bi'setin ilk yıllarında nazil olan ayetlerde yer alan ve infak olgusuna işaret eden it'am, ikram ve i'ta gibi kavramlar üzerinde durulmuştur. Bu kavramların infakın bir alt yapısını ve başlangıcını oluşturduğu görülmektedir.Üçüncü bölümde peygamberliğin 5. yılı ile 10. yılının ortalarına kadar nazil olan ayetlerde zikredilen infak ve zekat kavramlarının yanı sıra tasadduk ve ihsan kavramlarının üzerinde de durulmuştur. İnfak kavramının zekat lafzıyla aynı zaman diliminde Kur'an'da yer alması ve aralarındaki ilişkinin ne olduğu hususu da incelenmiştir. Hususiyetle zekat kavramının Mekkî ayetler bağlamında hangi anlamları kuşatabileceği konuları üzerinde yoğunlaşılmıştır. Aynı zamanda nisabı ve miktarı belirlenmeyen bir zekat gerçeğinin tespiti yapılmıştır.Dördüncü bölümde Kur'an'ın, Mekkî dönemin sonlarına doğru -bi'setin 10. yılı ile 13. yılı arası- üzerinde durduğu îta, hak, afv ve infak kavramlarının hangi anlamları kuşattığı erken dönemde kaleme alınan tefsir ve lügat kitapları dikkate alınarak incelenmiştir. Mecburî infakın temellerinin Mekkî son dönem ayetlerinde atıldığına vurgu yapılmıştır. Medine döneminde Hz. Muhammed (s.a.v.) tarafından kurumsallaştırılacak olan zekatın alt yapısının Mekkî dönemde nazil olan ayetlerle oluşturulduğu hususuna özellikle vurgu yapıldı. İnfakın zıddı olan kavramlardan iki ana kavram (israf-katr) ayetler ışığında incelenmiştir. Zekat dışı infaka delalet eden afv kavramının infakın bütün yönlerini kapsadığı, zekat verecek konuma gelemeyen fertlerin yapacakları infaka bir kapı araladığı tespit edilmiştir. Kur'an'ın olağanüstü şartlarda zekata ilave olarak ?afv? müessesesini gündeme soktuğu, bunu da çok beliğ bir lafız olan ?afv? ile ortaya koyduğu görülmektedir."
