abstract: "Kürtaj, insanoğlunun varoluşundan itibaren tartışılmakta olan en kritik konulardan birini oluşturmaktadır. Bu çalışmada, İslam hukuku çerçevesince kürtaja ilişkin çeşitli görüşlere yer verilerek; kürtajın mahiyeti, caiz olup olmaması, kürtaja cevaz verilen durumlar ayrıntılı şekilde açıklanmaya çalışılmıştır. Spesifik olarak, çağdaş İslam hukukçuları ve yaşayan Sünni mezheplerin görüşleri eşliğinde Bosna'da 1991-1995 yılları arasında çıkan iç savaş sırasında tecavüze uğrayan kadınların gebeliklerinin sonlandırılmasına ilişkin çeşitli görüşlere yer verilmiştir. Bu noktada, bu çalışma; göç ve savaş gibi olağanüstü durumlar sonucunda tecavüze uğrayan kadınlarda görülen gebelik ve gebeliğin sonlandırılması hususunu ayrıntılı şekilde ele alıp günümüzdeki güncel sorunlara ışık tutmayı hedeflemektedir."
