abstract: "İslam hukuku, yapısı itibarıyla İslam dininin temel metinleri olan Kur'an ve hadislerden hareket etmek durumundadır. Kur'an'ın mütevâtir olmasından dolayı sübutu hakkında ittifak söz konusu olup ayetlerin delaletleri noktasında bazı ihtilaflar bulunmaktadır. Ancak İslam hukuk metodolojisindeki asıl ihtilaflar haber-i vahid konusunda yaşanmıştır. Prensip olarak haber-i vahidin bilgi gerektirmeyeceği ancak amel gerektireceği kabul edilmiştir. Bunun neticesinde bütün mezhepler bazı usul ve kaideler çerçevesinde haber-i vahid ile amel etmiştir. Diğer mezhepler gibi Malikî mezhebi de haber-i vahidin amel değerini kabul etmiş ve bu haberler ile amel etmek için bazı şartlar ileri sürmüştür. İbn Rüşd'ün haber-i vahid ile ilgili görüşlerine bakıldığında genel kabule uygun bir şekilde haber-i vahidin amel gerektireceğini kabul ettiği görülmektedir. Ancak o da haber-i vahidin kabulü için bazı şartlar ileri sürmektedir. Bu şartlar incelendiğinde bunların genel olarak Malikî ekolünün kabul ettiği şartlara uygun olduğu söylenebilir. İbn Rüşd teorik olarak haber-i vahidi kabul etmiş ayrıca pratik olarak da fürû-i fıkıh alanında delil olarak kullanmıştır. Fürû fıkıh alanındaki kitabının nikâh ve talak bölümleri incelendiğinde mezheplerin bu konudaki delillerinin tahlil edildiği ileri sürülebilir. İbn Rüşd bu tahlil esnasında mezhepler arası benzerlikleri zikretmiştir."
