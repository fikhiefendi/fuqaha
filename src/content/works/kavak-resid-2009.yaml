abstract: "Bu çalışma, İslâm dünyasının Batı dünyasıyla yüzleşmeye başladığı dönemde belirgin bir hal alan ictihad, taklid ve mezhep merkezli fıkhî tartışmalara ışık tutması amacıyla modern dönem fıkıh anlayışının en önemli temsilcilerinden Reşid Rıza'nın (1865-1935) fıkıh düşüncesi çerçevesindeki görüşlerini incelemeyi hedeflemektedir.Tez, giriş, üç ana bölüm ve sonuç kısımlarından oluşmaktadır. Çalışmanın giriş kısmında konunun çerçevesi belirlenmiş, kullanılan kaynaklar tanıtılmıştır. Ayrıca son derece hacimli bir külliyata ulaşan ikincil literatür de değerlendirilmiştir. Birinci bölüm Reşid Rıza'nın ıslah projesinin temel özelliklerini ortaya koymayı hedeflemekte, bu projenin fıkıh boyutunu belirlemeye çalışmaktadır. Bu kısımda müellifin ilmî şahsiyetinin oluşumu, düşünce dünyasının kaynakları, ıslah düşüncesi ve bu düşüncenin fıkıh ilmine nasıl yansıdığı üzerinde durulmuştur.İkinci bölüm, ilk bölümde ana çerçevesi oluşturulan fıkıh düşüncesi ışığında klasik fıkıh usulü kavramlarının aldığı şekli incelemektedir. Müellifin bu çerçevede dile getirdiği düşüncelerin bir kısmı klasik dünyanın hâkim anlayışı olarak niteleyebileceğimiz anlayışla, bir dereceye kadar örtüşmektedir. Mezkûr düşüncelerin bir diğer veçhesi ise bütünüyle modern bir algının tezahüründen ibarettir. Bu durumun sebebiyet vereceği problemlerin aşılması amacıyla bu bölümde klasik fıkıh usulüne ilişkin değerlendirmelere temas edilmiş ve özellikle şerî deliller ile ictihad, taklid ve mezhep kavramlarına ilişkin görüşlere yer verilmiştir.Üçüncü ve son bölümde klasik usul kavramlarının modern bir içerikle yeniden sunumunu ortaya koymayı hedefleyen görüşlere ve bunun bazı fıkhî sonuçlarına temas edilmiştir. Böylece ilk bölümde alt yapısını hazırladığını, ikinci bölümde klasik anlayışla hesaplaşarak inşa edilmesinin önündeki pürüzleri giderdiğini ortaya koyduğumuz müellifin yeni fıkhî yaklaşımı bu bölümde tüm yönleriyle belirlenmeye çalışılmıştır.Anahtar sözcükler: Reşid Rıza, ictihad, ıslah, modernizm."
