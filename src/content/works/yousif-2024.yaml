abstract: "Bu tez, İmam Bedreddin Zerkeşî'nin (ö. 794) el-Burhân fî 'ulûmi'l-Kur'ân ve el-Bahrü'lmuhît fî 'ulûmi'l-Kur'ân adlı iki kitabını karşılaştırmalı olarak incelemektedir. Her iki kitap arasında ortak pek çok husus bulunmaktadır. Ancak nesih, muhkem ve müteşabih, umum ve husus, mutlak ve mukayyed gibi konular bu ortak konular arasında ayrıcalıklı bir yere sahiptir. Bu nedenle tez bu konular çerçevesinde ele alınmıştır. Çalışma, Zerkeşî'nin bu konulardaki görüşlerini analiz etmeyi ve karşılaştırmayı amaçlar. Bu amaca ulaşmak için, öncelikle İmam Zerkeşî'nin biyografik ve bibliyografik öyküsü araştırılmış bunun için betimsel-tarihsel yaklaşım izlenmiştir. Ardından yine aynı yolla iki kitap arasındaki ortak konulardan tefsir alanı için önemli olan temel konular ele alınmıştır. Çalışmanın temel bulgularını şöyle özetlemek mümkündür: el-Burhan fî 'ulûmi'l-Kur'ân, Kur'an ilimlerinin en önemli kaynaklarından biridir ve nâsih ve mensuh ilmi gibi tefsir usulü için önemli pek çok konuyu içerir. el-Bahru'l-muhît ise, İmam ezZerkeşî'nin dört mezhep başta olmak üzere âlimlerin sözlerini naklettiği ve bilhassa Şafiilerin görüşlerini sunmaya özen gösterdiği özgün bir kitaptır. Bu eser fıkıh ilminin kavram ve terimlerinin kapsamlı olarak açıklamasında önemli bir kaynak kabul edilir. Müellif, her iki kitapta da âlimlerin görüşlerini fıkıh usulü ve tefsir usulü ilimlerinin sınırları içerisinde tam bir açıklamayla sunmaya özen göstermiştir. el-Burhan'da muhkem ve müteşabihin tanımını ele almış, bunları bölümlere ayırmış ve ardından bu bölümlerin faydasından bahsetmiştir. Buna mukabil Bahru'l-Muhît'te, müteşabihin anlamından bahsetmiş, âlimlerden alıntılar yapmış ve onların bu konudaki ihtilaflarını yorumlamıştır. Aynı şekilde İmam ez-Zerkeşi bu eserde, umum-husus kavramlarından ve umumun şekillerinden uzun uzadıya bahsettiği bir tartışma açmış, ardından başka bir tartışmayla husus konusunu ele almıştır. el-Burhan'da ise konuyu bu kadar ayrıntılı işlememiştir. Müellifin el-Burhan'daki tarzı genel meseleler üzerine çalışma, analiz ve tartışma olmaksızın meseleden kısa bir şekilde bahsetme şeklindedir. Bu eserin teorileştirme ve kuramsallaştırma yönünden ziyade uygulamalı yönleri güçlüdür. Bu nedenle örnekler bu metinde daha çok yer almaktadır. Söz gelimi nesih konusunu işlerken neshe konu olan ayetlerin hemen tamamına yer vermiştir. Bahru'l-muhît'te ise meseleler işlenirken konunun daha teorik açıdan ele alındığı görülür. Bu eserde uygulamalardan ziyade tanımlar, alimlerin görüşleri, tartışmalı hususlar gibi yönler daha ağırlıklıdır. Yine sünnetten örneklerin çokluğu bu kitabı Burhân'dan farklı kılan yönlerdendir. Örneğin nesih konusu ele alınırken Burhân'daki hususların yanı sıra nasih ve mensuh ilminin önemi, nesih tasnifleri, neshin rükünleri, şartları gibi teorik yönlere de değinilmiştir. Sonuç olarak söylenebilir ki İmâm ez-Zerkeşî, iki kitabında teorik temel ve pratik uygulamayı birleştirerek eserini eksiksiz hale getirmiş ve fıkıh ve tefsir uzmanlarına büyük fayda sağlamıştır."
