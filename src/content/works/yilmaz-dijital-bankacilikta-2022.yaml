abstract: "Teknolojinin gelişmesiyle birlikte dünya birçok sektör bu durumdan etkilenmiş ve yaşanan değişimlere adapte olmak zorundadır. Gerçekleşen teknolojik ilerlemelerden en çok etkilenen sektörlerden biride bankacılık olmuştur. Dijital bankacılık kavramı da teknolojik gelişmelere entegre bir şekilde gelişim ve değişimine devam etmektedir. Bu çalışmada özellikle son yıllarda dijital bankacılıkta yaşanan gelişmelerle birlikte sistemleri ve süreçlerin nasıl ilerlediği anlatılmıştır. Bankacılığın Türkiye ve Dünya tarihindeki süreci, bankacılık türleri, bankacılık yapıları, dijital bankacılığın metotları açıklanmaya çalışılmıştır. Bankaların dijital bankacılığa adapte olma süreçleri zor olduğu kadar bir o kadarda hızlı olmak zorundadır. Bu durumun sebebi ise rekabetçi piyasa ortamında bankaların diğer bankalarla rekabet edebilmeleri için yaşanan değişimlere hızlı bir şekilde ayak uydurabilmeleri gerekmektedir. Bankalar bu süreçte teknolojik alt yapılarını geliştirme, bankacılığın şube hizmetlerini dijital kanallara taşıma, çağrı merkezlerinin hizmet ve ürün ağını geliştirme gibi birçok çalışmayı birlikte yürütmektedirler. Çalışmanın son bölümünde ise dijital bankacılığının, katılım bankacılığı üzerinde nasıl bir etki yapacağı, dünyada ve Türkiye'de katılım bankacılığı örnekleri, katılım bankacılığının süreçlerinin dijital kanallara aktarılması gibi süreçler incelenmiştir. Özellikle yaşanan teknolojik gelişmelerin ve gelişen dijital bankacılığın katılım bankası üzerindeki etkinliği, dijitalleşmenin sürdürülebilirliği ve denetimi gibi etkileri, Türkiye ve Dünya' da katılım bankaları örnekleri üzerinden incelenmiştir."
