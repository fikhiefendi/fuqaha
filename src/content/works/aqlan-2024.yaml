abstract: "Bu araştırma, Yemen'de vakıf yatırımı araçlarının etkin hale getirilmesine yönelik mekanizmaları analiz etmeyi ve mevcut vakıf yatırımı araçlarının etkinliğini değerlendirmeyi amaçlamaktadır. Bu araçlardan bazılarının etkili, bazılarının ise etkisiz olduğu tespit edilen araştırmada, Yemen'de vakıf yatırımı araçlarının etkin hale getirilmesi için yeni mekanizmalar da önerildi. Araştırmada betimsel içerik analizi yöntemi kullanılmıştır. Araştırma, vakıflarla ilgili yasa ve yönetmeliklerin geliştirilmesi, vakıf yönetiminden sorumlu olanların yeteneklerinin inşa edilmesi, vakıf yatırımının önemi konusunda farkındalığın yayılması ve vakıf yatırımı araçlarının çeşitlendirilmesi de dahil olmak üzere, Yemen'de vakıf yatırımı araçlarını etkin hale getirmek için birçok mekanizma tespit etti. Araştırmada vakıfların Yemen'deki en önemli malî kaynaklardan biri olduğu, eğitim, sağlık ve sosyal hizmetler gibi birçok hayati sektörün desteklenmesinde önemli bir role sahip olduğu, Yemen'deki vakıfların zayıf yatırımdan muzdarip olduğu ve bunun da hedeflerine ulaşabilmesini olumsuz etkilediği sonucuna varıldı. Araştırmada, belirlenen vakıf yatırımı araçlarının etkin hale getirilmesine yönelik mekanizmaların hayata geçirilmesi ve önerilen yöntemlerin takip edilmesi önerilmiş, bu mekanizmaların hayata geçirilmesinin vakıf gelirlerinin artırılmasına ve hedeflere ulaşılmasına katkı sağlayabileceği öne sürülmüştür."
