abstract: "CAMELS analizi birçok ülkede bankacılık sektöründe bankaların finansal durumunu ölçmek adına kullanılmaktadır. Bu çalışmada da literatürde yer alan finansal oranlar kullanılarak CAMELS puanları ve bileşenleri 2010-2022 yılları arasında aktif büyüklük açısından en büyük on mevduat banka ve faaliyette olan altı katılım bankası için hesaplanmıştır. CAMELS analizinde kullanılan finansal oranlar regresyon modelinde de kullanılarak analizin daha iyi sonuçlar verdiği karşılaştırılmıştır. İstatiksel analizlerin açıklanabilir ve daha güvenilir olması sebebiyle, bankaların finansal performanslarını ölçmek için regresyon analizinin kullanılmasının da doğru ve anlamlı sonuçlar vereceği sonucuna varılmıştır."
