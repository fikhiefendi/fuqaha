abstract: "Özellikle son dönemlerde önemi artan katılım bankacılığı ya da bir diğer adıyla İslami bankacılık, geleneksel bankacılığın yanında yıllardır devam eden bir sistem olmuştur. İslami bankaların en temel doğuş nedeni, dini hassasiyeti olan bireylerin ellerinde tuttukları fazla fonlardır. Özellikle de finansal piyasalarda fon talep eden kişilerin daha fazla fon ihtiyacının doğması, dini hassasiyeti olan ve ellerinde fon fazlası bulunan kişilerin ise sahip oldukları fon fazlalığının her geçen gün artmasına rağmen piyasalara katılamaması, bir aracıya olan ihtiyacın belirginleşmesine neden olmuştur. Dini hassasiyeti olan ve finansal piyasalarda işlem yapmaktan kaçınan bireylerin, bu piyasalarda işlem yapmamasının nedeni faiz yasağıdır. Faiz, kullanılan paraya karşılık sağlanan kar veya getiri şeklinde tanımlanabilmektedir. Faiz sadece İslamiyet'te değil, diğer semavi dinlerde de yasaklanmıştır. Yani katılım bankalarına olan ihtiyaç sadece nüfusu Müslümanlardan oluşan ülkelerde değil, başka dinlere mensup bireyler için de ihtiyaç olmuştur. Bu çalışmanın amacı farklı bölümlerde öğrenim gören üniversite öğrencilerinin İslami finansal okuryazarlık düzeylerini ölçmektir. Araştırma kapsamında toplam 617 öğrenciye anket uygulanmıştır. Anket sonuçları SPSS paket programı ile analiz edilmiştir. Analizde, 12 hipotez test edilmiştir. Analiz sonucunda 12 hipotez doğru kabul edilmiştir."
