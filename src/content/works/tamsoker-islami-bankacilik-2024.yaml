abstract: "İslami Bankacılık, faizden arındırılmış olarak insanlara fon kullandırma ve mevduatlarını değerlendirme fırsatı sağlayan bir bankacılık sistemidir. İslami Bankacılık kavramı 1940 yıllarında islam düşünürleri tarafından ortaya atılmış, 1970'li yıllarda ise uygulamaya konmuştur. Bu çalışmamda faizsiz finans sisteminin ilk prensiplerinin oluşumu ve gelişimi incelenmektedir. Fikir olarak ortaya çıktığı ilk taraflardan, Dünya ve Türkiye'deki gelişim serüveninin incelenmesi amaçlanmıştır. Katılım Bankacılığı uygulamaları geçmişten bugüne kadar bütünsel bir şekilde ele alınmıştır. Katılım Bankacılığı uygulama esasına göre evrensel bir yapıdır. İslam'ın kurallarına göre oluşan bu yapı sistemiyle, ulusal ve uluslararası birçok sermaye ve müşteri ağına sahiptir. Türkiye ve Dünya'daki uygulamaları göz önüne alınarak, geleneksel banka yapısına karşı güçlü bir seçenek olarak karşımıza çıkmaktadır."
