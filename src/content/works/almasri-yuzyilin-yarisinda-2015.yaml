abstract: "Farklı asırlarda ve özellikle İslami asırlarda desteklerden en çok nasibini alan şehirlerin başında tüm şehir ve köyleriyle Kudüs geliyordu. 1400 yıl boyunca uzanan İslam zamanında buna çok rastlarız. Efendimiz Hz. Muhammed (s.a.v.)'in miracından Ömer İbn-ul Hattab'ın fethine ve sonrasında olan haçlı savaşları ve fetihlerden 500 yıl sürecek Osmanlı hükmünün gelmesine kadar idari ve dini şehir olarak Kudüs, İstanbul'daki yöneticileri çok meşgul etti. Onu fethetmek için ordular gönderdiler, fetihten sonra halkla ve ibadethanelerle ilgilenmek için bağışlarda bulundular. Kudüs ile ilgilenen en önemli yöneticilerden biri Osmanlı sultanı Kanuni Sultan Süleyman'dı. Yaptıkları daha sonra zikredilecek. Osmanlının Kudüs'e verdiği önemin en büyük sebeplerinden biri Kudüs'ün ilmi ve dini hareketteki açıkça görünen yeri ve önemidir. Genel anlamda Filistin ve özel anlamda Kudüs fikri, hareketin eksenini içinde bulunduruyordu. İslam âleminin farklı bölgelerinden çeşitli âlimler ziyaret ve oradaki âlimlerden ilim tahsil etmek için oraya geliyorlardı. Bu şekilde Kudüs şehri ilim talep edenlerin en önemli merkezlerinden biri haline geldi. Osmanlı sultanlarının Kudüs şehrine verdikleri önemin göstergelerinden biri oradaki halka, Mescid-i Aksa ve Kubbetus-Sahra'nın görevlilerine sundukları mali yardımlardır. Bu yardımlar düzenli bir şekilde her yıl hak edenlere gönderilir hale geldi ve Surre-i sultaniye olarak bilindi. 1917 yılına kadar Osmanlı devleti bu yardımları göndermeye devam etti. Bu araştırma İstanbul'daki Osmanlı Arşivleri Müdürlüğünden“EV.d defter No: 18973”ve“EV.d defter No: 12667”numaralı (Surre Evrakları) Surre vakıflarının bazı sayfalarını ihtiva ediyor. Kudüs Mahkemesi Arşivlerinden“EV. HMK.SR 02028”ve ''EV.HMK.SR 02029'' numaralı belgeleri içeriyor. Bu araştırmada Kudüs'ün o zamanlarda ve hala günümüzde ileri gelen veya şehirde karar sahibi olan bazı aile soylarına ışık tutmaya çalıştık."
