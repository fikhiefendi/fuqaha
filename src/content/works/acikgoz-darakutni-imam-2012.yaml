abstract: "Hicrî 93 yılında Medine'de doğmuş olan İmam Mâlik, hadis ilmiyle temâyüz eden bir aile içinde yetişmiştir. Hayatının yarısını Emevîler, yarısını da Abbasiler devrinde geçiren İmam Mâlik derin anlayış, kuvvetli hafızası, sabrı, azmi, ilme karşı olan iştiyakı ve ilim aldığı kimselere karşı çok hassas davranması ile tanınan bir âlimdir. Kendisi Hadis ilmiyle uğraşanların güvenilir, salih ve hadis rivayeti için belli şartları haiz olmasını vazgeçilmez bir özellik olarak kabul etmiştir. İlmi din olarak algılamış ve dinini öğrenmek isteyen bir kimsenin bunu muhakkak sika bir râviden öğrenmesi gerektiğini vurgulamıştır.Abbasi hükümranlığı döneminde, Hicrî 306'da Bağdat'ın büyük bir mahallesi olan Darü'l-Kutn'da doğan Dârakutnî ise ilmi, takvası, dindeki derin anlayışı, zekâsı ve güçlü hafızasıyla devrindeki âlimlerin önde gelenlerinden biri olmuş ve çok az muhaddise nasip olan ?emîrü'l-mü'minîn fi'l-hadîs'' unvanıyla muttasıf olup ün kazanmıştır.Çalışmamız, İmam Mâlik'ten yaklaşık 200 yıl sonra yaşamış olan Dârakutnî'nin, İmam Mâlik'in rivayetlerine sened veya metin açısından, yönelttiği eleştirleri araştırmacıların ilgisine sunmayı hedeflemektedir."
