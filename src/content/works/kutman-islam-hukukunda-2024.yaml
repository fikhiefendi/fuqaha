abstract: "Bu çalışmada“nafaka”kavramının anlamı, mahiyeti ve kapsamı ele alınmıştır. Evlilik nafakasının neleri kapsadığı, hangi durum ve şartlarda verilmesi gerektiği değerlendirilmiştir. Evlilik, insanın fıtratında olan ve Allah'ın da insanlara tavsiye ettiği bir kurumdur. Nafaka, evliliğin huzurlu bir şekilde devam etmesi için gereklidir. Günümüzde boşanmaların birçoğunun sebebine bakıldığı zaman kocanın karısına vermesi gereken nafakayı ihmali olduğu görülmektedir. Evlilik insanlar üzerinde bazı hak ve sorumluluklar doğurmaktadır. Bunların en önemlisi nafakadır. Nafaka evliliğin daha sistemli ve tartışmalara yol açmadan Evlilik nafakası sahih bir nikâhla başlayıp boşanma ya da ölüm ile sona ermektedir. Mesken, temel gıda, sağlık giderleri ve giyim masrafları evlilik nafakasına dahil olan giderlerdir ve bunlar İslâm hukuku tarafından koca üzerine yüklenen sorumluluklardandır. Nafaka evlilik hayatının huzuru için gereklidir ve insanca yaşamanın sürdürülebilmesi için zorunludur. Bu çalışma üç bölümden oluşmaktadır. Birinci bölümde nafaka kavramı, çeşitleri ve evlilik nafakasının kapsamı; ikinci bölümde kocanın nafaka sorumlusu olmasının şartları ve kadının nafaka hakkını düşüren durumlar ve son bölümde ise iddet nafakası ele alınmıştır."
