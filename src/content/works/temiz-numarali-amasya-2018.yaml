abstract: "Bu tez çalışmasında, 1634 – 1635 (H. 1044) yıllarına ait \"3 No'lu Amasya Şerʻiyye Sicili'nin transkripsiyonu yapılarak, defterde bulunan belgelerin konularına göre tasnifi ve değerlendirmesi üzerinde durulmuştur. Tez 3 kısımdan oluşmaktadır. Birinci kısımda ilk olarak Amasya tarihi hakkında kısaca bilgi verilmiş, Şerʻiyye Sicilleri'nin muhtevası ve genel özelliklerinden bahsedilmiş ve Şerʻiyye Sicilleri'nin Osmanlı tarihi açısından önemine değinilmiştir. İkinci kısımda Amasya Şerʻiyye Sicilleri ve 3 No'lu Amasya Şerʻiyye Sicili hakkında bilgiler verilmiş ve kayıtların tasnifi ve değerlendirmesi yapılmıştır.Üçüncü kısımda ise belgelerin transkripsiyonu verilmiş ve tartışma başlığında merkezden eyalete gelen belgelerden elde edilen bilgiler ışığında Amasya'nın Revan seferi sırasında sefer organizasyonu üstesinden nasıl gelmeye çalıştığı örnekler verilerek açıklanmıştır. Bu bölümlerin dışında değerlendirme kısmından sonra sonuç bölümü, kaynakça ve son olarak ekler kısmında tezin orijinal belgeleri yer almaktadır. Okuyucuya kolaylık sağlaması için defterdeki her sayfa numarasının yanında kayıt numarası gösterilmiştir. Mesela 1/1, 1/2, 2/1, 2/2 gibi. Burada ilk rakam sayfa numarasına, ikinci rakam da kayıt numarasına işaret etmektedir. İncelenen şerʻiyye sicili defterinin transkripsiyonu yapılırken günümüz Türkçesinin imlâ kuralları içinde hareket edilmekle birlikte, metinde Ayn (ع) harfi (ʻ), elif (ا) ve hemze (ء) harfleri (') işareti, uzatma ve inceltme harfleri ise (^) işareti ile gösterilmiştir. Yapılan transkripsiyonda okuma hataları en aza indirilmeye çalışılmış, okunamayan kelimeler … ile belgede kâtiplerin boş bıraktığı yerler (boşluk), okunup tam emin olunmayan kelimeler (?) işareti ile ifade edilmiştir."
