abstract: "İslam Hukukunda cezaî hükümlerin konulmasında zararlardan korunma, menfaatleri temin amacı hedeflenir. Bütün cezalarda adaleti yerine getirme, caydırıcı olma, toplumun düzenini sağlama, suçluyu ıslâh, şahsîlik, ilâhî kaynaklı olma ve kanunilik prensipleri esastır. Cezalandırma hakkını sadece kamu otoritesine tanıyarak, kişisel cezalandırma ve intikamı önlemek, suçların kanıtlanmasını önemli şekil şartlarına bağlayarak, adlî hataları önlemek, suçluya belirlenen cezaî yaptırımlar dışında bir müeyyide uygulanmasını önleme prensiplerine de riâyet edilir. İslam ceza hukuku üç ana bölümde incelenmiştir. Bunlar; had cezaları, kısas ve diyet cezalan ile ta'zîr cezalarıdır. Özellikle, ta'zîr cezalarının esnekliği toplumun yararı için gereklidir. Zira, toplum hayatında cezası nasslarla belirtilen suçlar yanında sayısız suç meydana gelebilir. Ta'zîr cezası ile bunların engellenmesi hedeflenmiştir. İslam ceza hukukunda bazen adlî hatayı önleme bazen toplum yaran adına bazen de cezaî muhakeme şekil şartlarına uyularak hem hudûd hem kısas ve diyet hem de ta'zir cezâlarınında cezaî indirim söz konusu olabilmektedir."
