abstract: "Tahkikini yaptığımız Hüsâmü'l-Hükkâmi'l-Muhıkkîn li-saddi'l-Buğâti'l-Mu`tedîn `An Evkâfi'l-Müslimîn adlı risâle, Ebü'l-İhlâs Hasan b. `Ammar b. Ali el-Vefâî el-Mısrî eş-Şürünbülâlî tarafından 1050/1640 yılında yazılmıştır. Şürünbülâlî 994/1586 yılında Mısır'ın Menûfiye bölgesinde dünyaya geldi. Şürünbülâlî, henüz küçük yaşta iken babası tarafından götürüldüğü Kahire'ye Camiu'l Ezher'de ilk eğitimini almıştır. Muhammed el-Hamevi, Abdurrehman el-Mesîrî gibi âlimlerinden ders almıştır. Fıkıh ilmini, Abdullah en-Nahrîrî, Muhammed el-Muhibbi ve Nûreddîn Ali b. Gânim el-Makdîsî'den öğrenmiştir. İlim tahsili bittikten sonra Camiu'l Ezher'de ders vermeye başladı. Gerek verdiği dersler, yetiştirdiği öğrenciler ve eserleriyle gerekse örnek şahsiyetiyle müteahhirîn Hanefî ulemasının en gözde âlimlerinden biri oldu. Şürünbülâlî 21 Ramazan 1069/12 Haziran 1659 tarihinde Kahire'de vefat etti.Şürünbülâlî'nin kaleme aldığı bu risâlesi, vakıf bir malın satışının fasit mi batıl mı olduğu hakkındadır. Mısır'da müftülük yapan 10. asır âlimlerinden Nureddîn et-Trablusi (ö. 942/1535) ve Ahmed b. Yunus eş-Şelebi (ö. 947/1540) vakıf bir malın satılmasının batıl değil de fasit olduğuna hüküm vermişler. Şürünbülâlî ise onların verdikleri fetvalarını, Hanefî mezhebine göre açık, sahih ve güçlü kaynaklardan hareketle reddetmeye çalışıp vakıf bir malın satışının batıl olduğunu açıklamıştır. Müellif bu açıklamasıyla vakıflar konusunda hüküm verecek hâkimlere, hükümlerinde tutarlı ve isabetli olabilmeleri için yol göstermeyi amaçlamıştır. Şüphesiz bunu amaçlamakla Müslümanların vakıflarına değişik yollar ve yanlış tevillerle el uzatılmasının ve vakıf kurumunun işlevinin kaybolmasının önüne geçmek istemiştir."
