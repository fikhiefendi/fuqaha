abstract: "Hz. Ali, birkaç istisna hariç sürekli Hz. Peygamber'in yanında bulunmuş ve sahâbe arasında iyi bir fakih olma özelliği ile öne çıkmıştır. Bu sebeple o, fıkıh ekollerini büyük ölçüde etkilemiştir. Bu durum Hanefi mezhebi için daha fazla geçerlidir. Zira Hz. Ali'nin fıkhî metodu ile Ebû Hanife'nin fıkıh yöntemi büyük ölçüde paralellik arz etmektedir. Ayrıca Buhârî ve Müslim'in sahihlerinde geçen fıkıh içerikli Hz. Ali haberlerini irdeleyerek vardığımız sonuç da bunu desteklemektedir."
