abstract: "İslamcılığın doğuşundan bugüne değin İslami Devlet fikrine dair farklı yorumlar yapılmıştır. Onun aslında ne olduğundan, Müslümanlar için ne ifade ettiğine kadar çeşitli alanlarda görüşler dile getirilmiştir. Bu çalışmada Mevdudi'nin İslami devlet düşüncesi Abdülvehhab el Efendi ve Raşid el Gannuşi'nin fikirleriyle karşılaştırılarak eleştirel bir değerlendirme yapılmıştır. Mevdudi'nin temsil ettiği ana akım İslam siyaset düşüncesiyle, bu düşünceye eleştirel yaklaşıp demokrasi ve sivil toplum örgütü vurgusu yapan Efendi ve Gannuşi'nin fikirleri tartışılmıştır."
