abstract: "Bismillahirrahmanirrahim, salat ve selam Peygamberimize, Efendimiz Hazreti Muhammed'e ve onun ailesine ve tüm sahabilere olsun. Ardından,“İslam Hukuku'nda Cebir Teorisi”başlığı, bu çağda İslam Hukuku'nun gerektirdiği yeniliklerin önemli bir yönünü ele alır: İslam Hukuku'nun teorikleştirilmesi. İslam Hukuku, bu teorikleştirme için temel prensipler ve ilkeler içerir ki bu, bu dönemde Batı'nın gurur duyduğu teorileri geride bırakacak potansiyele sahiptir. Cebir terimi,“şer'i hükümlerden birinin yerine getirilmesinde meydana gelen aksaklıkları düzeltme, eksikleri tamamlama veya yasal hükümlerin uygulanmasında meydana gelen ihmali düzeltme”anlamına gelir. Bu konunun doğası, bir giriş, yedi bölüm ve bir sonuç bölümü ile sunulmasını gerektirdi. Giriş bölümü, bu konunun seçilme gerekçelerini, önceki çalışmaları, araştırma zorluklarını, yöntemini ve planını içerir. Birinci bölüm:“Cebir Nedir?”başlığı altında üç alt bölümden oluşur: Birinci alt bölümde Cebir teorisi tanımı, ikinci alt bölümde ilgili terimlerin tanımı ve üçüncü alt bölümde Cebir'in ne şekilde zorlama ile ilişkilendirildiği ele alınır. İkinci bölüm:“Cebirin Meşruiyeti”başlığı altında üç alt bölümden oluşur: Birinci alt bölümde Cebirin meşruiyet kaynakları, ikinci alt bölümde Cebirin meşruiyeti ve hikmeti, üçüncü alt bölümde Cebir için kurallar ve yönergeler ele alınır. Üçüncü bölüm:“Cebirin Unsurları”başlığı altında üç alt bölümden oluşur: Birinci alt bölümde Cebir yapan kişi, ikinci alt bölümde Cebir uygulanan kişi ve üçüncü alt bölümde Cebir ile zorlanan kişi ele alınır. Dördüncü bölüm: Cebir Koşulları, genel koşulları, zorunlu koşulları ve özel koşulları içeren dört alt bölümden oluşur. Beşinci bölüm:“Cebir Türleri”başlığı altında beş alt bölümden oluşur: Birinci alt bölümde Allah'ın haklarını zorlamak ve insanların haklarını zorlamak, ikinci alt bölümde somut ve sözel cebir, üçüncü alt bölümde belirli ve belirsiz cebir, dördüncü alt bölümde maddi ve manevi cebir ve beşinci alt bölümde hafifletilmiş ve ağırlaştırılmış cebir ele alınır. Altıncı bölüm:“Cebir Sebepleri”başlığı altında on iki alt bölümden oluşur: Birinci alt bölümde hata, ikinci alt bölümde unutma, üçüncü alt bölümde zorlama, dördüncü alt bölümde tahrip, beşinci alt bölümde bilgisizlik, altıncı alt bölümde cinsiyet, yedinci alt bölümde kasıtlı hareket, sekizinci alt bölümde saldırı, dokuzuncu alt bölümde kusur, onuncu alt bölümde hastalık, on birinci alt bölümde seyahat ve on ikinci alt bölümde diğer sebepler ele alınır. Yedinci bölüm: Cebir Kapsamı, İslam Hukuku'nun tüm alanlarını kapsayan beş alt bölümden oluşur: Birinci alt bölümde ibadetler, ikinci alt bölümde muameleler, üçüncü alt bölümde hudutlar, suçlar ve cezalar, dördüncü alt bölümde aile hukuku hükümleri ve beşinci alt bölümde İslam hukuku politikası ele alınır. Son olarak, bir sonuç bölümü sunulur ve çalışmanın önemli bulguları açıklanır. Bu çalışmada, İslam hukukunun çeşitli bölümlerindeki cebir konularını incelerken tümevarımsal yaklaşımı benimsemiştir. Teorinin koşullar, temeller, bölümler vb. bileşenlerinden bahsederken tümdengelimci yaklaşımı kullandım ve araştırmada tamamlayıcı yaklaşımı da kullandım. Eskilerin ve çağdaşların çalışmalarından yararlanıldı ve bunlar temel alındı. İslam hukukunun pratik uygulamaları konusundaki örneklerde, çalışma sekiz farklı hukuk mezhebini (Hanefi, Maliki, Şafi, Hanbeli, Zahirî, Zeydî, İbadi ve İmami) karşılaştırdı. Ayrıca, Sahabe ve Tabiin'in hukuk fikirlerini ve önceki hukuk mezheplerini de dikkate aldı. Çalışma, hadis bilginlerinin ve çağdaş araştırmacıların çalışmalarından da faydalandı. Çalışma bu farklı mezhep ve yöntemleri kullanırken, güçlü deliller ve açık göstergeler varsa, bazı meseleleri veya mezhepleri tercih etmekten çekinmedi."
