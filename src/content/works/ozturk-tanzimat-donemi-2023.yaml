abstract: "İnsanlık tarihi kadar eski olan suç her dönemin/çağın inanç, kültür, eğitim ve düşünce yapısından etkilenmiştir. İslam hukuku, anlayışı ve kültürüyle şekillenen Anadolu toplumunun tarihi süreç içerisinde yaşanan değişime uyum sağlamasına çalışılınca yeni bir döneme adım atılmıştır. Artık Osmanlı Devleti, Tanzimat dönemiyle birlikte yeni bir oluşum içerisine girmiştir. Böylece hukuk, idare, ekonomi, eğitim birçok alanda değişim ve gelişim yaşanmıştır. Bu değişim ise suç ve suçlu üzerinde belirli bir etkiye sahip olmuştur. Osmanlı Devleti'nin hukuk yapısı şer'î ve örfî hukuk sistemi dahilinde şekillenmişken Tanzimat döneminde İslam hukukundan ayrılma/farklılaşma başlamıştır. Kanunlaştırma hareketiyle laik hukuk sistemine geçiş sürecinin ilk adımları atılmıştır. Bu çalışmayla Tanzimat döneminde yaşanan değişimin suç ve suçlu üzerindeki etkisinin yanı sıra suçun ve suçluların yapılan yenilikler üzerindeki etkisi incelenmiştir. Neticesinde suçun nedenleri ve sonuçları ortaya konulmaya çalışılmıştır. Bu bağlamda ağırlık noktası mahkeme kayıtları ve Meclis-i Vâlâ-yı Ahkâm-ı Adliyye'nin incelediği suç vakalarına ait arşiv belgeleri gibi döneme ait suç belgeleri olmuştur. Bu sayede Tanzimat döneminin Anadolu'daki yaşamı suç üzerinden daha canlı bir şekilde ortaya konulmaya çalışılmıştır. Olayın geçtiği yer, zaman, kişiler (mağdur, suçlu, zanlı, yardımcı) ve belgelerde belirtilen kişilerin yaşları ve meslekleri gibi unsurların suç ve suçlu üzerindeki etkisi belirtilmiştir."
