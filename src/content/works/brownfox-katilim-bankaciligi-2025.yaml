abstract: "Dünya literatüründe İslami bankacılık olarak isimlendirilen katılım bankacılığı, faizi kullanmaması sebebiyle geleneksel bankacılıktan ayrılmaktadır. Katılım Bankacılığı, bankacılık faaliyetlerinin faizsizlik ilkesi ile bankacılık faaliyetlerini yerine getirmesidir. Bu çalışma ile bireysel banka müşterilerinin katılım bankaları tercih nedenlerinin araştırılması amaçlanmıştır. Katılım bankası bireysel müşterilerinin banka tercihlerine etki eden faktörlerin tespit edilmesi amacıyla, hazırlanan anket, İstanbul ve Bursa illerinde katılım bankalarında mevcut banka müşterilerinden seçilmiş örneklem kapsamında 390 katılımcıya, google anket uygulaması üzerinden iletilerek veriler toplanmıştır. Anketlerden elde edilen veriler Statistical Package for the Social Sciences (SPSS) programı kullanılarak analiz edilmiştir. Analizlerde, lojistik regresyon analizi, açıklayıcı faktör analizi, t-testi ve tek yönlü varyans analizi testi kullanılmıştır. Yapılan analizler sonucunda, katılımcıların çoğunluğunun evli, 36-35 yaş aralığında, lisans mezunu, özel sektör çalışanı oluşturmuştur. Katılımcıların yarısından fazlasının hem katılım bankası hem de geleneksel bankalarda hesabı olduğu görülmüştür. Banka tercihindeki en öncelikli faktör banka imajı ve bankaya olan güven olmuştur, önemli olan faktörler sırasıyla, personel kalitesi ile ürün ve hizmetler olduğu sonucuna ulaşılmıştır. Yapılan t testi ve varyans analizi sonucunda, katılımcıların cinsiyeti, meslekleri, aylık geliri açısından banka tercihlerinde anlamlı bir farkın olmadığı; yaş ve eğitim düzeyi için anlamlı bir farkın olduğu belirlenmiştir. Medeni durum ve gelir seviyesi incelendiğinde ise sadece ürün ve hizmetler faktörü bakımından anlamlı bir fark bulunduğu anlaşılmıştır. Aynı sonuç çalışma süresi ve çalışılan banka sayısı için elde edilmiştir. Sadece ürün ve hizmetler faktörü banka ile çalışılan süre ve çalışılan banka adedi ile anlamlı şekilde farklılaşmaktadır. Banka müşterilerinin katılım bankası hakkında bilgi sahibi olma oranının düşük olduğu sonucuna varılmıştır. Ancak yine 20 kavramın her biri için bilgi düzeyi frekans analizleri yapıldığında en yüksek frekans değerleri 2 ile 5 yıl arası katılım bankasında hesabı olan banka müşterilerin“müzara”kavramı hariç bilgi sahibi oldukları bulunmuştur. 2 yıldan çok ancak 5 yıldan az banka mudilerinin ürünleri ve bilgileri takip ettiği anlaşılmaktadır. Buna karşılık 10 yıldan fazla süredir katılım bankası mudilerinin bu kavramlara hakimiyeti diğer gruplardan daha azdır. Banka müşterilerinin ilk yıllardaki bilgi seviyelerini arttırmaya yönelik bankalardaki çalışmaların arttırılması gerekli olduğu göze çarparken, 10 yıldan fazladır hesabı olan müşterilerin ilgilerinin azaldığı için daha az bilgi sahibi oldukları düşünülebilir."
