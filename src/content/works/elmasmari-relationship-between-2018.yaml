abstract: "Bu araştırma, Libya merkez bankasının Libya'daki İslam bankacılığı çalışmalarının bankalar ve şubeleri ile olan ilişkisini belirtmeyi amaçlıyor. Libya merkez bankasının kontrol araçlarını Libya'daki bankalarda ve İslami bankaların yetkili şubelerinde ve bu bankaların ve şubelerin çalışmalarını düzenleyen mevzuatta sergiliyor. Ardından araştırma, bankalar ve İslami bankacılık şubelerinin merkez bankasıyla yüz yüze göründüğü en büyük sorunları gösteriyor. Araştırmacı, Libya merkez bankası tarafından Libya İslam bankalarına uygulanan kontrol araçlarına ve İslami bankaların onlardan ne kadar fayda sağladığına ulaştı. Araştırma, Libya merkez bankasının bazı kontrol araçlarında yapılan değişiklikler üzerinde ve İslami bankaların ihtiyaç ve niteliklerini yerine getiren ve yerine getiren ve İslami bankalara yatırım yapmalarını kolaylaştıran bazı unsurlara girerek katkıda bulunabilecek bazı önerilerle sonuçlandı. kârlarını artırmaya yansıyan fazla likidite ve acentelerinin hesaplarında dağıtılan gelir oranları. Araştırmacı, bu araştırmanın, yasal gereksinimlerin belirlenmesine katkıda bulunan ve yeni İslami bankacılık deneyimini benimsemek için gerekli prosedürleri ve dürüst çabaları İslami bankalara hizmet eden bankacılık mevzuatının oluşturulmasıyla sonuçlanan çerçeveyi temsil etmesini umuyor. Parasal istikrar, refah ve ekonomik büyümeye olumlu katkıda bulunmak."
