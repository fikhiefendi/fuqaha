abstract: "“el-Mebsût Bağlamında Serahsî'nin Aile Hukukuyla İlgili Hadislere Yaklaşımı”adlı çalışmamız iki bölümden oluşmaktadır: Giriş kısmında çalışmanın önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde Serahsî'nin hayatı; adı, nesebi, tahsili, ilmî şahsiyeti, hapis hayatı ve hapsedilme sebepleri, hocaları, öğrencileri ve eserleri tanıtılarak mezhep içindeki yeri hakkında bilgi verilmiştir. İkinci bölümde ise, Serahsî'nin aile hukuku ile ilişkili hadisleri“el-Mebsût”adlı eserinde hangi konular altında incelediği tespit edilerek konular başlıklara ayrılmış ve bu başlıklar altında hadisler incelerek Serahsî'nin bu hadislere yönelik değerlendirmeleri ortaya konmuş, ayrıca gerektikçe konuyla ilgili ayetlere de yer verilmiştir. Sonuç kısmında ise çalışmadan elde ettiğimiz neticeler ifade edilmiştir."
