abstract: "Hicri 4. asır, kırâat ilminin tarihinde bereketli bir dönem olmuştur. Çalışmada bu dönemin başlarında yaşamış, on kırâate dair ilk defa eser te'lîf etmiş, Kur'ân ilimlerine yadsınamayacak derecede katkı sağlayan, kendisinin tedrisatında yer almış olanlar dışında sonraki nesiller tarafından da hem ilmî hem de manevî açıdan övgülere mazhar olmuş İbn Mihrân en-Nîsâbûrî'nin (ö. 381/992) kırâat ilmindeki konumu ve kırâat-ı aşere metoduyla te'lif ettiği el-Mebsût fi'l kırâat'il-ʿaşr adlı eseri ele alınmıştır. Giriş ve iki ana bölümden oluşan çalışmanın giriş kısmında araştırmanın konusu, amacı, önemi ve yönteminden bahsedilmiştir. Birinci bölümde kırâat ilmininin önemine dair kısa bir bilgilendirmeden sonra, müellifin kırâat ilmindeki konumuna ve ilmî şahsiyetine odaklanarak söz konusu eseri çerçevesinde bu bağlamda veriler sunulmuştur. Ayrıca bu kısım içerisinde farklı okuyuşlara vâkıf olmak amacıyla yaptığı rihlelere de yer verilmiştir. Son bölümde ise eserin mühtevası üzerinde yoğunlaşarak İbn Mihrân'ın kırâatleri ele alış tarzı, tercihleri ve kitabında izlemiş olduğu metoda dair analizler yapılmıştır."
