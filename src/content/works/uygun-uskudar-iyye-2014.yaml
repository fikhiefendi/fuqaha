abstract: "Bu tez, Üsküdar Şer'iyye Mahkemelerine ait h. 1316-1317 (m.1899-1900) tarihli 761 numaralı Şer'iyye Sicili'ni konu edinmektedir. Hüccetlerden müteşekkil olan bu sicil esas alınarak, h. 1316-1317 yılları arasında Üsküdar'ın ekonomik, sosyal ve dinî-kültürel hayatı incelenmeye çalışılmıştır. Tez, bu alanda yapılan çalışmalara katkıda bulunmak amacıyla yapılmıştır.Tez giriş, beş ana bölüm, sonuç, ekler ve kaynakçadan oluşmaktadır. Giriş bölümünde, şer'iyye mahkemeleri ve şer'iye sicillerine, 761 No'lu Üsküdar Şer'iyye Sicilinin özelliklerine ve Üsküdar'ın tarihine kısaca değinilmiştir. Teze konu olan Şer'iyye Sicili'nde yer alan bilgiler ışığında, birinci bölümde Üsküdar'ın idarî durumu, ikinci bölümde Üsküdar'da sosyal hayat, üçüncü bölümde Üsküdar'da ekonomik hayat, dördüncü bölümde Üsküdar'da dinî-kültürel hayat ele alınmıştır. Beşinci bölümde ise, 761 No'lu Üsküdar Şer'iyye Sicili'nin günümüz harfleriyle yazılmış metni yer almaktadır. Sonuçta, defterdeki bilgilerin genel bir değerlendirmesi sunulmuştur. Ekler kısmında, sicilde yer alan hüccet kayıtlarının tasnifi ve defterden örnek sayfalar yer almaktadır. Son olarak tez, kaynakça kısmıyla sonlandırılmaktadır."
