abstract: "Çoğunlukla ekonomik kriz, savaş ya da pandemi gibi dönemlerde zirve yaptığı görülen belirsizlik, aynı zamanda çeşitli endekslerle ülke bazında veya global olarak ölçülebilmektedir. İslami bankaların kendilerine özgü iş modelleri sayesinde, kriz dönemlerinde konvansiyonel bankalara kıyasla daha farklı performans gösterip göstermediği literatürde sıkça araştırılmasına rağmen, belirsizliğin İslami bankalar üzerindeki etkisine dair az sayıda çalışma bulunmaktadır. Bu bağlamda, bu çalışma belirsizliğin İslami ve konvansiyonel bankalar üzerindeki etkisini kapsamlı olarak inceleyerek literatürdeki söz konusu açığın kapatılmasına önemli katkı sağlamaktadır. Bu tezde, kredi büyümesi, mevduat büyümesi ve bankaların net faiz marjı olmak üzere üç bağımlı değişken ve belirsizlik ölçütü olarak da Ahir, Bloom ve Furceri (2018) tarafından geliştirilen ülke bazındaki Dünya Belirsizlik Endeksi kullanılmaktadır. Örneklemimiz Bangladeş, Mısır, Endonezya, Kuveyt, Malezya, Pakistan, Katar, Suudi Arabistan, Türkiye ve Birleşik Arap Emirliklerini kapsayan 10 ülkeden 72'si İslami ve 287'si konvansiyonel olmak üzere toplam 359 bankanın 2011-2021 dönemindeki, 3.949 banka-yıl gözlemini içermektedir. Bu çalışmanın en önemli sonucu, konvansiyonel bankaların kredi büyümesini, mevduat büyümesini ve net faiz marjını anlamlı ve olumsuz bir şekilde etkileyen belirsizliğin; İslami bankalar üzerinde olumlu veya olumsuz bir etkisinin olmadığını ortaya koymasıdır. Buna ilave olarak bu çalışma, belirsizliğin İslami ve konvansiyonel bankalar üzerindeki etkisini, örneklemi bankaların aktif büyüklüğü, ülkelerdeki İslami bankacılık pazar payı, ülkelerdeki müslüman nüfusun yoğunluğu ve ülkelerin Körfez İşbirliği Konseyi (GCC) ülkesi olup olmamasına göre iki ayrı alt gruba ayırarak daha detaylı olarak incelemektedir. Bu incelemeler sonucunda belirsizliğin konvansiyonel bankalar üzerindeki etkisine dair dikkate değer bazı detay bulgular ortaya çıkmakla birlikte, söz konusu sonuçların genel olarak ana bulgularımızla tutarlı olduğu görülmektedir."
