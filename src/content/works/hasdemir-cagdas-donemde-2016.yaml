abstract: "Müslüman azınlıklar fıkhı, gayrimüslim hâkimiyetindeki ülkelerde yaşayan müslümanların karşılaştığı problemlere İslâm hukuk usulüne dayanarak çözüm bulma yöntemidir. Bu çalışmada müslüman azınlıklar fıkhı (fıkhü'l-ekalliyyâti'l-müslime) etrafındaki tartışmaların ortaya konması amaçlanmıştır. Çalışma, ilgili konunun teorik boyutu ile sınırlandırılmıştır. Çalışmada azınlık fıkhı tali meselelerinden örneklendirme yapılmış olmasına rağmen herhangi birini çözüme kavuşturmak iddiası yoktur. Çalışmada azınlık fıkhı ile ilgili teorik tartışma -üç dilde- kitaplar, makaleler, dergi ve gazete yazıları, uzmanlık tezleri, istatistiksel araştırmalar, raporlar, internet siteleri dikkate alınarak özetlenmiştir. Çalışma sonucunda azınlık fıkhının koordinatları ve işletim sistemi net bir şekilde ortaya konmuştur."
