abstract: "Zorunlu (compulsive) irtifaklar(easement), komşuluk (neighbourhood.) hukukundan doğan taşınmaz(taşınmaz) mülkiyeti (ownership) kısıtlamalarının (constraint) bir bölümünü oluşturur. Zorunlu irtifakların amacı maliki(possessor) veya taşınmazın ilgilisini, zaruret(necessity) durumundan kurtarmaktır. İnceleme konumuzu oluşturan zorunlu irtifaklar dört adettir. Bunlar, TMK'ndaki düzenleniş sırası itibariyle TMK'nun 725. Maddesinin(item) 2. Fıkrasında(anecdote) düzenlenen taşkın(overflowing) yapı(building) irtifakı, TMK'nun 744 vd. maddelerinde düzenlenen zorunlu mecra (channel) irtifakı, TMK'nun 747. maddesinde düzenlenen zorunlu geçit irtifakı ve TMK'nun 761. maddesinde düzenlenen zorunlu su irtifakıdır. Yasanın aradığı bütün koşullar oluşmuşsa, komşu malik, zorunlu irtifakın kurulmasına ve böylece kısıtlamanın ortaya çıkmasına karşı koyamaz. İnceleme konumuzu oluşturan taşınmaz mülkiyeti kısıtlamaları, hukukî sonuçlarını doğurduğunda, zaruret durumu ortadan kalkar. Zorunlu irtifak hakları ile ilgili birbirinden farklı hususlar, çok çeşitli uyuşmazlıklara dolayısıyla yargı kararlarının ortaya çıkmasına sebep olmaktadır. Zorunlu irtifaklar arasında yargı kararına en az sayıda konu olanı, zorunlu su irtifakıdır. Zorunlu irtifaklar dolaylı mülkiyet kısıtlamalarıdır. Zorunlu irtifaklar hukukî niteliği itibariyle birer irtifak hakkı olarak kabul edilmelidir. Zorunlu irtifaklar, rızaî irtifaklardan ayrı bir irtifak kategorisidir. Bu sebeple irtifak haklarına ilişkin genel hükümler zorunlu irtifaklara yalnızca kıyasen uygulanabilir. Zorunlu irtifaklar, birer eşyaya bağlı irtifak hakkıdır. Zorunlu irtifak haklarının kurulmasına yönelik talep yetkisi, hukukî niteliği itibariyle kanunî bir talep hakkıdır. Zaruret hakları birer irtifak hakkı olduğu için kural olarak tescil ile kurulur. Zorunlu mecra hakkı“tescil ile kurulma ilkesine”tâbi değildir Bu dava sonucunda mahkemenin verdiği yenilik doğuran karar ile zorunlu irtifak kurulur. Zorunlu irtifaklar, yükümlü taşınmaz üzerinde bulunan, sınırlı aynî ve şerh edilmiş şahsi haklar ile sıra ilişkisine tâbi olur. Zorunlu irtifak sahibi, hakkının öne geçmesi karşılığında, geride kalan hak sahiplerine bedel ödemekle yükümlüdür. Geçit zarureti, bir taşınmazdan genel yola çıkmak için yeterli bir geçidin bulunmamasıdır Mecra zarureti: İlgili mecraların, yokluğu veya yetersizliğidir. Kamu hukukunun verdiği bir yetki zaruret durumunun ortaya çıkmasını engelleyebilir. Su zarureti: Gerekli sudan yoksunluk sebebiyle taşınmazdan usule uygun olarak yararlanılamamasıdır.Taşkın yapı zarureti: Bir yapının , komşu araziye taşırılması sonucu yıkılma ihtimalinin ortaya çıkması ve tamamının veya bir bölümünün kullanılamamasıdır.Bir malik prekaristik (precaristic) izne sahip olsa bile zaruret içerisinde olduğu kabul edilebilir. Eski hukuka göre kurulmuş ve halen mevcut olan haklar, zarureti engelleyebilir. Olması gereken hukukta (de lege feranda) kanaatimizce zorunlu irtifakın kurulmasına ilişkin talebin yöneltilmesinden önce zaruretin mutlaka bir makam tarafından belirlenmesi gerekir.Olması gereken hukukta zaruretin belirlenmesi işinde idari makamların görevlendirilmesinin kanaatimizce sakıncasından çok yararı bulunmaktadır. Bu sebeple bir zorunlu irtifakın kurulmasına bağlı olarak komşuların menfaat dengeleri bozulacaksa o zorunlu irtifakın kurulması mümkün değildir. Zorunlu irtifakın kurulabilmesinin koşullarından biri de zarureti giderecek çözüm yolunun hukukî işlem veya iradî bir fiil (willkürliche Handlung) ile ortadan kaldırılmamış olmasıdır.Orantılılık ilkesi talebin yöneltileceği komşunun belirlenmesinde de kural olarak belirleyici olur. Bazı durumlarda, yükümlü hale getirilecek olan komşu taşınmaz kanun tarafından belirlenmiştir. Olması gereken hukukta talebin yöneltileceği en uygun komşunun belirlenmesinde de idarî makamlar görevlendirilmelidir. Tapuya kayıtlı olmayan taşınmazlar aleyhine zorunlu irtifak kurulması mümkün değildir. Zaruret içerisindeki malik, zorunlu irtifakın kurulması karşılığında komşusuna irtifak bedelini ödemekle yükümlüdür. Bedel yalnızca bir irtifakın karşılığı olarak kabul edilmelidir. Zaruret içerisindeki malik ile komşu malikin kurdukları zorunlu irtifak sözleşmesi, bir özel hukuk sözleşmesidir. Zorunlu irtifak haklarının kurulma yollarından diğeri de irtifakın mahkeme kararı ile kurulmasıdır. Mevzuatımızda yer alan bazı yasal düzenlemeler, bazı durumlarda, zorunlu irtifakın kurulması talebinin komşu malike karşı ileri sürülmesini engellemektedir."
