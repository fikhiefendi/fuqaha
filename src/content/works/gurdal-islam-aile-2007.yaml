abstract: "İslâm Aile Hukuku Aç s ndan htilaflar n Çözümünde Tahkim Yöntemiisimli tezimizde, hukuki ihtilaflar n çözüm yollar ndan biri olan tahkimin ne oldu uve slâm Aile Hukukundaki yeri ve önemi ele al nmaktad r.Bu ba lamda tezimiz, Hukuk Tarihinde Tahkim , Hakem , ve AileHukukunda Tahkim Yöntemi olmak üzere üç bölümden olu maktad r.Birinci bölümde, tahkimin ne oldu unu, tarihteki geli imini, hukukidayanaklar n , bu usule ba vurman n yarar ve sak ncalar n inceledik.Hakem ana ba l alt nda toplad m z kinci bölümde, hakemlerin ehliyeti,seçimi, say s , hakemlerde aranacak artlar ve hakem kararlar n n ba lay c lkonular n izah etmeye çal t k.Üçüncü bölümde ise, slâm aile hukukunun konular ndan nafaka, hidâne,mehir ve bo anmada tahkim usulünün yerini ve uygulanabilirli ini tart t k."
