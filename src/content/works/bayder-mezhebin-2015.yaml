abstract: "Kurucu imamın, mezhebin usûlünü geliştirdiği ve müntesiplerinin geliştirilen bu usûle bağlı olduğu göz önüne alındığında kurucu imama muhalefetin nasıl mümkün olduğu ve mümkünse bu muhalefetin hangi şart ve ilkeler çerçevesinde olabileceği önem arz etmektedir. Çalışma üç bölümden oluşmaktadır. Birinci bölümde 'kurucu imam' kavramı ve mezheplerin adlarını taşıdığı imamlar tarafından mı yoksa ölümlerinden sonra takipçileri tarafından mı tesis edildiği konusu irdelenmiştir. Ayrıca Hanefi mezhebinin kurucu imamının kim olduğu konusu incelenmiştir. İkinci bölümde, muhalefetin ne anlama geldiği ve kimlerin Ebu Hanife'ye muhalefet ettiği hususu ele alınmıştır. Son bölümde kurucu imama muhalefetin mahiyeti incelenmiş ve kurucu imama muhalefete rağmen müntesibin hala o mezhepte nasıl kalabildiği problemi ele alınmıştır. Fıkıh literatüründe bu konuda dile getirilen görüşlerden hareketle kurucu imama muhalefete rağmen aynı mezhepte kalmanın teorik imkânı temellendirilmeye çalışılmıştır. Buradan hareketle mezhep içerisindeki muhalefetin iki şekilde anlamlandırılabileceği sonucuna ulaşılmıştır: Birincisi mezhep-içi fakihlerin bir imama intisab etmesi, diğeri ise müntesiplerin içtihat ederken kurucu imamın usûl ve kavâidine bağlı kalmasıdır. Anahtar Kavramlar: Hanefi Mezhebi, Kurucu İmam, Mezhep-içi muhalefet, Ebu Hanife."
