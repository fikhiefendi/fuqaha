abstract: "2003 yılında Irak'ta siyaset alanında yapılan değişikliklerden sonra Irak Federal Yüksek Mahkemesi kuruldu ve anayasa yargısında merkezî denetim modeli benimsendi. Güvenlik Konseyi'nin 1483 sayılı Kararındaki kanuni yetkilere dayanarak Uluslararası Koalisyon Otoritesi tarafından çıkartılan 2004 Yılı Geçici Devlet İdare Kanunu'na istinaden 2005 yılında ve 30 sayılı Kanunla“Federal Yüksek Mahkeme”adında bir anayasa mahkemesi kurulmuştur. Uluslararası Koalisyon Otoritesi'nin görevi bittikten sonra, 2005 yılında - hâlen yürürlükte olan-“Irak Anayasası”çıkarıldı ve kanunların anayasaya uygunluğu konusunda merkezî denetim modelini benimseyen bir anayasa yargısı sistemi benimsendi. Meclisin üçte ikisinin onayı ile çıkarılan bir kanun ile hem Federal Yüksek Mahkemenin işleri düzenlenecek hem de mahkemenin yapısını oluşturan yargıçlar, İslam fıkhının uzmanları ve hukuk fakihlerinin sayıları belirlenecektir. Mahkemenin görev ve yetkileri ikiye ayrılmaktadır. Bunlardan birincisi kanunların ve nizamnamelerin Anayasaya uyumunu denetlemek ve anayasa metinlerini yorumlamaktır. Diğer görevleri ise merkezî hükümet ile bölgesel ve il yönetimleri, belediyeler ve mahallî idareler arasındaki anlaşmazlıkları çözmek, cumhurbaşkanına, başbakana ve bakanlara yöneltilen suçlamalar hakkında karar vermek, Millet Meclisi seçimlerinin nihai sonuçlarını onaylamak ve federal yargının bölgelerdeki ve illerdeki yargı kurumlarıyla arasındaki yetki anlaşmazlıklarını çözmektir. Irak Federal Yüksek Mahkemesi adlı bu araştırma dört bölüme ayrılmıştır: Birinci bölümde, anayasa yargısının nasıl ortaya çıktığı, meşruluk tartışmaları ve ülkelerin hangi modelleri uyguladığı ele alınmıştır. İkinci bölümde, Irak Federal Yüksek Mahkemesi'nin oluşumu ve üyelik sistemi incelenmiştir. Tezin amacı, Irak'ın anayasa yargısını ana hatlarıyla açıklamaktır. Bu bölümde Mahkemenin üç katagoriye ayrılan üyeleri yargıçlar, İslam fıkıhçıları ve hukuk fıkıhçıları başlıkları altında incelenmiştir. Mahkemenin üye sayısı daha sonra çıkarılacak mahkeme kanunu tarafından belirlenecektir. Mahkeme kanunu şimdiye kadar çıkarılmadığından üyelerin sayısı Anayasa çıkarılmadan önceki kanuna göre belirlenmiştir. Üçüncü bölümde ise“Irak Federal Yüksek Mahkemesi”nin Anayasanın 93. maddesinde belirtilen görev ve yetkileri incelendi. Irak Federal Yüksek Mahkemesi'nin görevlerinin neler olduğu Anayasaya, Mahkeme Kanununa ve 2005 yılında mahkemenin kendi çıkardığı iç tüzüğe göre incelendi. Dördüncü bölümde ise mahkeme tarafından alınan kararların niteliği incelendi; kararların kesinlik ve tüm merciler için bağlayıcı olduğunu açıklandı. Mahkeme tarafından çıkarılan kararların dayanaklarının neler olduğu ortaya konuldu. Mahkeme kararı çıkarılmadan önceki hukuki etkiler incelendi. Daha sonra mahkemenin kurulması, görevleri, çalışma usulleri ve kararların uygulanması ile ilgili genel bir değerlendirme yapıldı. Mahkemenin oluşma görevlerine ilişkin tavsiyeler sunuldu. Bunların en önemlileri: Mahkemenin kurulması ve görevlerini düzenleyen kanunun ivedikle yasalaştırılması, anayasayı koruyan, merkezî denetimi sağlayan bir anayasa mahkemesinin -normal ve idari yargı yetkileri içeren- bazı görev ve yetkilerinin yeniden gözden geçirilmesidir."
