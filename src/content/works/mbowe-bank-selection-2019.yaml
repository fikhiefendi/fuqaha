abstract: "Bu çalışma, Gambiya'daki müşterilerin banka seçiminde dinin etkisini incelemektedir. Snowball örnekleme kullanarak, 123 müşteri arasında yürütülen örneklemede ve analizin sonucunda banka çeşidi ve dini hassasiyet indeksi arasında zayıf bir korelasyon gözlenmiştir. Ayrıca, değişken sıralaması açısından din, kolaylık, uluslararası ödeme hizmetleri ve personel kalitesinin müşterilerin banka seçiminde önemli olduğu kanıtlanmıştır. Bu araştırmanın sonuçları, Gambiya'daki bankaların mobil ve internet bankacılığı gibi teknolojilere yatırım yapmalarını, uluslararası ödeme hizmetlerini ve personelinin niteliğini geliştirmelerini tavsiye etmektedir. Ana Kelimeleri: Banka seçimi, Din Hassasiyeti, Teknoloji, Gambiya"
