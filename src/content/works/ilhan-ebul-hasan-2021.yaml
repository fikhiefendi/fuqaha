abstract: "İslâm fıkıh tarihinin en önemli şahsiyetlerinden biri de hiç şüphesiz hicrî 364/974 yılında Basra'da dünyaya gelen, Bağdat'ta yetişen ve orada hicrî 450/1058'de vefât eden Ebu'l-Hasen el-Mâverdî'dir. Toplum tarafından siyaset, ahlâk, eğitim teorisyeni olarak bilinse de aslında o hem iyi bir müfessir hem de mümtaz bir Şâfiî fakihidir. Nitekim kaleme aldığı el-Hâvi'l-Kebîr adlı fürû fıkıh eseri bunun en bariz kanıtıdır. el-Hâvi'l-Kebîr, Müzenî'nin el-Muhtasar adlı eserinin şerhi; el-Muhtasar ise İmâm Şâfiî'nin el-Umm adlı eserinin bir nevi özetidir. Bu yönüyle el-Hâvi'l-Kebîr, Şâfiî'nin el-Umm eserinin şerhi niteliğindedir, ancak klasik manada bir şerh değildir; aksine dönemin fıkıh kültürünü ve anlayışını gösteren önemli çalışmalardan biridir. Bu eserin en önemli hususiyyetlerinden biri de Mâverdî'nin usûl ilmine dair görüş ve düşüncelerini muhtevi olmasıdır. Bu bağlamda Mâverdî'nin usûl metodolojisinin bilinmesi, Şâfiî'den sonra usûlün geldiği seviyeyi göstermesi açısından önem arz etmektedir. Bu çalışmada Mâverdî'nin el-Hâvi'l-Kebîr adlı eseri ile birlikte diğer eserleri de göz önünde bulundurularak usûl anlayışı ortaya konmaya çalışıldı. Öte yandan başta Şâfiî olmak üzere özellikle aynı zaman diliminde yaşamış olan Şâfiî usûlcülerden Şîrâzî, Cüveynî Sem'ânî ve Gazzâlî'nin usûl konularına ilişkin yaklaşımlarına kıyaslama açısından yer verildi. Yapılan çalışmada şerî kaynakların kitap, sünnet icmâ ve kıyas olduğu konusunda âlimlerin tam ittifak sağladığı ancak konular teferruatlandığında neredeyse her meselede âlimlerin ihtilâf ettikleri görüldü. Mâverdî, şâz kıraatin sahih olması durumunda haber-i vahid gibi değerlendirileceği; haberin, müstefiz, mütevâtir ve âhad olarak taksim edileceğini ve sahâbe için sükûti icmânın geçerliliğini savunmuştur. Şâfîî'nin kıyas ve ictihâdı eşitlediğine dair genel yaklaşıma ise karşı çıkmıştır. Sahâbe kavli, istishâb, umûmu'l-belvâ, delile dayalı istihsânla amel edileceğini, ictihâdın gerekli olduğunu, müctehidin diğer bir müctehidi taklîd etmesinin uygun olmayacağını ve neshin de vuku bulduğunu kabul etmiştir. Âlimler tabakasında tercih ehlinden olan Mâverdî'nin çoğunlukla mezhep içi; nadiren de olsa mezhep dışı tercihlerde bulunduğunu söylenebilir. Mâverdî çoğu zaman Şâfiî'nin ortaya koyduğu usûl anlayışını benimsemiş; fürû konularında ise tespit edebildiğimiz kadarıyla sadece beş-altı meselede Şâfiî'ye muhalefet etmiştir. Anahtar Kelimler: Delîl, Elfâz, el-Hâvi'l-Kebîr, Mâverdî, Tercih."
