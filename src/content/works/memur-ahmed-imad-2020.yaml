abstract: "Bu çalışma, Osmanlı ulemâsından Ahmed b. 'İmâd el-Hanefî el-'Ayıntâbî tarafından kaleme alınan eş-Şükriyye adlı şerhin tahkikidir. eş-Şükriyye, Nu'man b. Sabit Ebu Hanife'nin (80/150 h.) Sarf ilmi alanında yazmış olduğu Maksud adlı eserinin şerhidir. Tezimiz, giriş ve sonuç kısımları dışında iki ana bölümden oluşmaktadır. Giriş bölümünde, tezin konusu, gayesi ve yöntemi ele alınmıştır. Birinci bölümde, tahkik hakkında kısa bir bilgilendirme yapılmış, eserin metni Maksud hakkında yapılmış çalışmalar ile ilgili bilgi verilmiş ve eserin durumu, özellikleri, nüshaları ve tahkikte takip edilen yöntem hakkında açıklamalar yapılmıştır. Bu bölümde ayriyeten çalışılan eş-Şükriyye adlı eserin müellifine nispeti, müllifin kitabında izlediği yöntem, kitabın muhtevası ve eserle ilgili açıklamalar yapılmıştır. İkinci bölümde, yazma eserin farklı nüshalarının karşılaştırmalı tahkiki yapılmıştır. Tahkik yapılırken seçilen ana nüshanın metni aslına bağlı kalınarak yazılmış ve karşılaştırıldığı diğer nüshalar arasında görülen farklılıklar dipnotlar ile açıklanarak eksiklik ve fazlalıklar belirtilmiştir."
