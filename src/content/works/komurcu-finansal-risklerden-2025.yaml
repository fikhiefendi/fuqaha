abstract: "Bu çalışma, modern bir kavram olan tüzel kişiliğin İslami finans alanındaki yansımalarını ve risk kavramıyla ilişkisini İslam hukuku açısından incelemeyi amaçlamaktadır. Birinci bölümde tüzel kişiliğin tarihçesi, mahiyeti, ehliyet ve sorumluluk boyutları ele alınarak İslam hukukunda vakıflar ve kamu kurumları üzerinden gelişen hükmî şahsiyet kuramına değinilmiştir. İkinci bölümde, risk kavramı İslâmî ölçütlerle; meşru risk, garar, daman ve ahlâkî risk ayrımları çerçevesinde işlenmiş, tüzel kişiliğin“perde kaldırma”uygulamaları ve ortaya çıkabilecek şer'î riskler tartışılmıştır. Üçüncü bölümde ise Varlık Kiralama Şirketleri ve Katılım Kefalet Şirketleri modelleri vaka analizleriyle incelenmiş; bu yapılar üzerinden risk yönetimi, sınırlı sorumluluk ve şer'î uyum açısından incelenmiştir. Tüzel kişiliğin sahip olduğu sınırlı sorumluluk ve zimmet kavramları ayrıntılı olarak analiz edilmiş, tüzel kişilikle ilgili ahlaki ve etik değerler üzerine tartışmalar yapılmıştır. Çalışma sonucunda, İslam hukukunun, modern ticaretin dinamik ihtiyaçlarına uygun bir biçimde tüzel kişilik kavramını benimseyip uygulayabileceği ancak bu uygulamanın klasik fıkhın temel prensiplerine ve ahlaki değerlere sıkı bir şekilde bağlı olması gerektiği vurgulanmıştır. Çalışma, klasik fıkhî ilkeler ile çağdaş finansal yapılar arasında bir köprü kurarak, İslam hukukunun bu kavramlara nasıl yaklaşabileceğine dair bütüncül bir değerlendirme sunmaktadır. Tüzel kişiliğin tanımlanması, pratikteki varlığı ve kendi içinde yer aldığı teorik yapı bazı açılardan mükemmel bir uyuma sahip değildir. Bu durum İslam hukuku açısından tüzel kişiliğin uygunluğunu tespit etmeyi güçleştirmektedir. Günümüzde ortaklığa dair kavramların tüzel kişilik ile olan ilişkisi, bu yapının pratik işlevselliğini göz önünde bulundurarak incelenmektedir. Tezimizde bu pratik gerçekliğin dışında teorik temelleri açısından da tüzel kişiliğin konumunu tespit etmeye gayret edilmiştir. Tüm bu değerlendirmelerin bir arada yapılmasıyla tüzel kişiliğin İslam hukuku açısından değeri ve yerini tespit etmek mümkün olabilmektedir."
