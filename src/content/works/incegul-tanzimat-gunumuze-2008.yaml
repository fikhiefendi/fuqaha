abstract: "Tanzimat sonrası Osmanlı'da başlayan Batılılaşma süreci .Meşrutiyet'in ilanından sonra pek çok konunun tartışılır hale gelmesine neden olmuştur. Batılılaşmanın getirdiği hürriyet, demokrasi, Meşrutiyet, tesettür, çok evlilik kavramları, Batılılaşmayla ilk karşılaşan toplum tarafından değişik şekilde tartışılmıştır. Demokrasi, eşitlik, müsavat, hürriyet kavramları daha bilimsel çevrelerde tartışılırken, çok evlilik ve tesettür, Meşrutiyetten günümüze toplumun değişik çevrelerince tartışıla gelmiştir.Çok evlilik ve tesettür konularının çok tartışılmasında mahrem kabul edilen kadını ilgilendiren konular etkili olmuştur. Kadının mahremiyetini temsil eden tesettürün tartışılmasına toplum kısa sürede alışamamıştır.Çok evlilik ise aynı şekilde mahrem olan aileyi temsil eden bir konu olması nedeniyle tartışla gelmiştir.Batılılaşma kadın-erkek eşitliğini savunduğu için erkeğin çok evliliğini kabul etmemektedir. İslami görüş ise kadın ve erkeği eşit olarak kabul etmez. Kadın ve erkek tabiatının farklılıklarından dolayı kadının çok evliliğine imkan vermezken, erkeğin çok evliliğini savunmaktadır.İslami düşünce çok evliliği, toplum ve kadın için faydalı bir kurum olarak görmektedir. Çok evliliğin yasaklanması birçok sorunu beraberinde getirecektir.Bu tartışmalarda Meşrutiyet sonrası akımlardan, İslamcıları çok evliliği toplumun, ailenin, erkeğin, kadının ve çocukların faydası için savundukları görülmektedir.Batıcılar ise çok evliliğe kadın haklarını ihlal ettiği gerekçesiyle çok evliliğin toplumun menfaatine değil, zararına olduğunu düşünerek itiraz etmişlerdir.Türkçüler ise bu tartışmada çok fazla görüş beyan etmemekle birlikte Batıcılara yakın bir tavır sergilemişlerdir.İslamcı kanatta yer alan Çok evlilik konusu günümüzde de değişik çevrelerce tartışılmaktadır.Biz bu çalışmada çok evlilik tartışmalarını ve günümüzdeki durumunu ele alarak, inceledik."
