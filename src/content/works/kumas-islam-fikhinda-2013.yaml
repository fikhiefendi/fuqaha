abstract: "Nâfile, kişinin, kendisine zorunlu kılınmadığı halde farz ve vâcib ibadetlerin dışında yaptığı ibadetlerdir. Gerek hadis kaynaklarında gerekse değişik maksatla yazılmış bazı kitaplarda farklı zaman ve mekanlarda ifa edilmesi istenilen nâfile namazlardan söz edilir. Hem sayısal anlamda hem muhteva olarak geniş tartışmalara sebep olmuşlardır. Özellikle tasavvufî yaklaşımlarda hassasiyetle yerine getirilmeye çalışılmış, bazı çevrelerce meşruiyetleri hararetle savunulmuştur. Bazıları ise nâfile namazların sıhhati konusunda son derece titiz davranmış, bu nedenle de sayı bakımından çok daha az nâfile namazın varlığını kabul etmişlerdir."
