abstract: "Elinizdeki tez iyâü'l-Ma`neviyye `ale'l-Muqaddimeti'l-Gazneviyye adlı eserin satır altı olarak Memluk-Kıpçak diline aktarılmıs tercümesi üzerine yapılmıstır. Bu eser bizim çalısmamızdan önce kütüphane kayıtlarına Kitâb fi'l-Fıkh adıyla geçmis ve ilim alemine de bu adla tanınmıstır. Kitap Hanefî mezhebinde ibadet sekillerini ele almıs bir fıkıh eseridir. Tez dört ana bölümden olusmaktadır. &lk bölüm giriste kitabın tanıtımı, ismi, yazarı, tercüme eden sahıs, yazıldıgı yer ve tarih, niteligi, dil özellikleri, eser üzerinde yapılan çalısmalar ile Memluk-Kıpçak sahasında yapılan çalısmalar hakkında bilgileri verdik. &kinci metin bölmünde ise iki yüz altmıs altı sayfadan olusan metnin transkripsyonunu verdik. Ayrıca, satır altı tercüme olmasından dolayı bozuk cümle yapısına sahip olan metni, anlasılır olması için noktalama isaretlerinin de yardımıyla küçük cümlelere böldük. Arapça kısmında bulunup da tercüme edilmeyen bazı dua ve ayetleri oldugu gibi Arap alfabesiyle verdik. Metinde geçen bütün kelime ve birlesik kelimelerin yer aldıgı dizin kısmında kelimeleri mümkün oldugu kadar geçtigi yerlerdeki anlamlarına göre manalandırmaya özen gösterdik. Son bölümünde metnin tıpkıbasımını asıl sayfa numarasına sadık kalarak verdik. Tıpkıbasımının verilmesiyle metni, mukayeseli incelemenin yanı sıra Türkçenin imlâ tarihi için de bir malzeme teskil edecegini ve böylece çok daha kullanıslı bir hâle gelecegini düsündük."
