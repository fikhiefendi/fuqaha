abstract: "Bu tez, Afrika kıtası ülkelerinden biri olan“Mali devletinde Cahunu Bölgesi Örneği Kadının Tesettürü, Fıkhî delilleri ve Tahlilleri”konusu esas alınarak hazırlanmıştır. Giriş bölümünde konunun tercih sebepleri, önemi, hedefleri, zorlukları ile araştırmada takip edilen yöntemler, konunun sınırları ve konu ile ilgili daha önce yapılan çalışmalar ele alınmıştır. Birinci Bölümde, Hicab kavrmının sözlük ve ıstılah anlamları, tesettür çeşitleri tesettürle ilgili deliller, esaslar ve şeri hükümler incelenmiştir. İkinci Bölümde Mali Devleti Cahunu bölgesi ile ilgili bilgiler ve tahlillere yer verilip bölgede tesettür gerçeği ve fıkhi değerlendirmelere yer verilmiştir. Aynı bölümde Mali Cahunu bölgesindeki tesettür meselelerini; tarihini, yaşadığı ve aştığı farklı dönemleri, yayılmasına ilişkin önemli sebepleri, uygulaması sırasında yapılan hataları bölgede tesettür şekkilleri incelenerek İslam Hukukundaki örtünme hükümleri ile karşılaştırılmıştır. Sonuç kısmında şerî çeşitli delillere tesettürün dayandığı, konuda İslam âlimlerin ihtilafta bulunmamaları, tesettürün önemli maksadı İslam'ın toplumda kadının rolüne önem vermesi tezin vardığı önemli sonuçlarından olduğu açıklanmıştır. Mali'nin Cahunu bölgesinin müslümanların tesettür ile ilişkisinin Gana imparatorluğuna uzandığı, uygulama konusunda örf ve âdet, aile hayatı tarzının etkisi olduğu, bölgede tesettürün yayılmasına ilişkin din eğitimin ve özellikle kadın medreselerin büyük etkiye sahip olması çalışmanın elde ettiği diğer önemli sonuçlarıdır."
