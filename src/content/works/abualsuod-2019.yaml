abstract: "Bu araştırma benzer kurumlara örnek olabilmesi için vakıf kurumlarının idari temellerini geliştirmeyi hedeflemiştir، Vakıf yönetiminin vakıfları koruma، geliştirilme ve büyütmesindeki önemini vurgulamak için“Türk Yeni Dünya Vakfını”örnek bir kurum haline getirmeyi esas almıştır.“Türk Yeni Dünya Vakfı”ele alınarak en önemli özelliklerini ve sorunlarını، idari engellerini açıklayan ve detaylı çözüm yöntemlerin arz eden bir alan araştırması yaptım ve vakıf idaresine geliştirme önerileri sunarak sonlandırdım. Araştırmanın giriş bölümünde kurumun tarihi ve idari temellerinden bahsettim، birinci bölümde ise“Türk Yeni Dünya Vakfı”idari kuruluşunu ele aldım، ikinci bölümde de vakfın idari sorunlarını ve çözümlerini ele aldım، son bölümde ise vakfın idari gelişimi için sonuç ve önerilerde bulundum"
