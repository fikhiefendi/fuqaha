abstract: "Günümüzün finans sistemi ve kurumları incelendiğinde gerek dünyada gerekse Türkiye'de katılım bankalarının finansal sistem üzerinde giderek artan bir paya sahip olduğu görülmektedir. Bu nedenle, Türkiye'deki finans sistemi içinde %7'nin üzerinde bir paya sahip olan katılım bankalarının piyasadaki operasyonlarının ve bu operasyonların reel ekonomiye etkilerinin anlaşılması, merkez bankalarının para politikası araçları ve bu araçların aktarım kanallarının etkinliğinin belirlenmesi açısından önemlidir. Söz konusu öneme binaen bu çalışmanın amacı, katılım bankacılığı sistemi özelinde parasal aktarım mekanizması kanallarından banka kredileri kanalının etkinliğinin araştırılmasıdır. Bu kapsamda, Türkiye için ilgili mekanizmanın etkinliği Aralık 2005 ve Haziran 2022 dönemini içeren aylık zaman serisi veri setinden faydalanarak incelenmiştir. Çalışmada analiz yöntemi olarak Yapısal Vektör Otoregresyon (Structural Vector Autoregression - SVAR) Modeli kullanılmıştır. Analiz sonucunda elde edilen bulgular, Türkiye'de parasal aktarım mekanizmasının yaklaşık ilk üç ay için çalıştığını göstermektedir."
