abstract: "Katılım Bankaları, kâr zarar ortaklığı ve diğer faizsiz finansal araçlarla topladıkları fonları, üretim, ticaret veya bir yatırımın finanse edilmesi gibi meşru ekonomik faaliyetlerde kullanarak kâr elde ederler. Bu kâr, banka ve taraflar arasında baştan belirlenen oranlarda paylaşılmaktadır. Kâr, faizsiz kazanç olarak değil daha geniş anlamı ile helal kazanç olarak ele alınmaktadır. Fon yatırırken bir getiri taahhüdünün olmaması, kârın para ticareti ile değil ekonomik faaliyetlerden elde edilmiş olması, doğrudan reel ekonominin desteklenmesi, faaliyetlerle ilgili bir dizi dini, ahlaki kural seti ile tarafların hukukunun gözetilmesini esas alan akdî prensiplerin bulunması, katılım bankacılığını bankacılığın diğer türlerinden ayırmaktadır. Katılım bankacılığının bankacılık sektörü aktiflerinden Aralık 2020 itibarı ile aldığı %7,2'lik pazar payının 2025 yılında %15'lere çıkarılması hedeflenmektedir. Potansiyeline göre yüksek bir hedef değilse bile otuz altı yılda sektörden alınan paya göre iddialı olan bu hedef, katılım bankacılığına duyulan ihtiyaç nedeniyle üstesinden gelinmesi gereken bir hedeftir. Net bir getiri taahhüdü olmaksızın tasarruflarını katılma hesabına yatıranlar için en önemli unsur güvendir. Katılım bankacılığına olan güvenin artırılması ve sürdürülebilirliği için İslam iktisadı prensiplerine uygun, küresel faizsiz bankacılık uygulamaları ile benzer, tarafların haklarının gözetildiği, manüel müdahalelerden uzak, şeffaf bir sistemle kâr dağıtımı yapılmasının bir ihtiyaç olduğu düşünülmektedir. Bu tezle öncelikle kâr dağıtım sistemi mevzuatı ve kâr dağıtımı sürecinde aktif görev almış yetkililerle yapılan derinlemesine görüşme ile kâr dağıtımının işleyişi ortaya konulmuştur. Ayrıca katılım bankalarının çalışanı, eski çalışanı ve müşterileri ile yapılan bir anketle de katılımcıların kâr dağıtımına ilişkin tutum ve düşüncelerine yer verilmiştir. Yapılan analizlerde, katılma hesabına dağıtılan kâr paylarının alternatif yatırım araçlarına göre tercih edilebilir bir getirisi olmadığı görülmektedir. İslam iktisadının kâr yaklaşımı, kâr dağıtımına ilişkin literatür, mudârebe kâr dağıtım çerçevesi ve küresel kâr dağıtım uygulamaları baz alınarak katılım bankacılığının kâr dağıtım sisteminin problemli alanları tespit edilmiştir. Problemlerin büyük bir kısmının, banka hissedarlarının fonları ile katılma hesaplarının ayrı havuzlar yerine karıştırılarak tek bir havuz olarak işletilmesi ile çözülebileceği düşünülmüştür. Bu tezle mevcut kâr dağıtım sisteminin nitel ve nicel olarak iyileştirme alanları analiz edilmiş ve katılım bankacılığının sürdürülebilir büyümesi için yeni bir kâr dağıtım önerisi yapılmıştır. Bu tezle ayrıca katılım bankacılığı ve kâr dağıtımına ilişkin üzerinde çalışılmaya değer çok sayıda konunun akademiye kazandırılması hedeflenmiştir."
