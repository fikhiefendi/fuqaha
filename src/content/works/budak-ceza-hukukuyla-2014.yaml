abstract: "ÖZET Ceza Hukukuyla İlgili Ayetlerin İslam Hukuku Açısından Değerlendirilmesi: İbn Âşûr Örneği Abdulkadir BUDAK Ondokuz Mayıs Üniversitesi, Sosyal Bilimler Enstitüsü Temel İslam Bilimleri Anabilim Dalı, Yüksek Lisans, Temmuz/2014 Danışman: Prof. Dr. Muhsin Koçak Toplumsal düzenin sağlanması ya da bozulan toplumsal düzenin yeniden tesisinde en işlevsel hukuk kuralları ceza hukuku kurallarıdır. Kaynağını vahiyden alan ve hukukun tüm alanlarıyla ilgili hükümleri bulunan İslam Hukukunun ceza hukukuna dair kuralları da vardır. Can, mal, nesep ve haysiyet gibi toplumun devamı kendilerine bağlı hususlardaki ihlallere yönelik cezalar Kur'an tarafından belirlenmiş ve had cezası olarak nitelendirilip değiştirilemez hükümler olarak değerlendirilmiştir. Ceza hukukuyla ilgili ayetleri incelerken, tefsire ve fıkha ilişkin özgün yaklaşımları olan ve Şâtıbî'den sonra Makâsıd konusunu kaleme almış olduğu müstakil çalışmasıyla yeniden gündeme taşıyan İbn Âşûr'un“et-Tahrîr ve't-Tenvîr”isimli tefsirini esas alarak, onun ayetlere yaklaşımını ortaya koymaya çalıştık. Araştırmamızda günümüz hukuk sistemleri ve İslam hukuku açısından suç ve ceza teorilerini ortaya koymaya çalışarak, İbn Âşûr'un tefsir ve makâsıdla ilgili özgün yaklaşımlarını tespit etmeye gayret gösterdik. Elde ettiğimiz veriler ışığında İbn Âşûr'un ceza hukukuyla ilgili ayetleri ne şekilde tefsir ettiğini, hangi noktaları ön plana çıkardığını İslam hukuku açısından değerlendirmeye çalıştık. Araştırma neticesinde günümüz penceresinden bakıldığında sert ve insanlık dışı olarak değerlendirilen İslamî cezaların İbn Âşur'ca makâsıd açısından değerlendirildiği ve toplumsal düzeni tesis etme, caydırıcılığı sağlama ve adaleti gerçekleştirme noktalarında arz ettikleri rolün ortaya konduğu tespit edilmiştir. Ayrıca gerek makâsıd konusuyla alakalı özgün yaklaşımları gerekse Kur'an ayetlerini anlamadaki yöntemiyle İbn Âşûr'un önemli bir değer olduğu ve tanınması gerekliliği sonucuna ulaşılmıştır."
