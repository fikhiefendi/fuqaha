abstract: "Şahsın anne ve babasıyla olan bağını ifade eden nesep, eskiden olduğu gibi günümüzde de önemli bir kavramdır. İslam hukukuna göre doğum yapan kadın anne, bu kadının kocası baba kabul edilmektedir. Koca liân ile çocuğu reddedebilmektedir. Önceki dönemlerde bu hususta pek fazla problem meydana gelmiyordu. Ancak modern dönemde yaşanan bazı gelişmeler nesebin ispatı, reddi ve anne ve baba açısından nesebin belirlenmesi hakkında birçok güncel problemin ortaya çıkmasına sebep olmuştur. Nesebin ispatı ve reddi hakkında ortaya çıkan güncel problemler genellikle DNA analizi ve kan tahlili gibi modern ispat yöntemleriyle ilgilidir. DNA analizi diğerine göre daha kuvvetli ve yaygın bir ispat yöntemidir. DNA analizindeki genel problem kullanımının yasaklanıp yasaklanmaması değil, nesebin şer'î delilleri arasındaki konumudur. Modern dönemde üreme ve yapay döllenme teknikleri konusunda tüp bebek, taşıyıcı annelik, sperm ve embriyonun dondurulması ve üreme organları nakli gibi uygulamalar ortaya çıkmıştır. Genel olarak homolog yapay döllenme ile gerçekleşen uygulamalarda pek fazla problem bulunmazken, heterolog yapay döllenme ile gerçekleşen ve üçüncü şahsın dâhil olduğu uygulamalarda neseple ilgili birçok problem bulunmaktadır."
