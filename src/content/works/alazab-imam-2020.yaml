abstract: "Bu tezin araştırma konusu, Hicri 8. y.y Şâfiî âlimi İmam İsnevî'nin usûl yöntemidir. Usul yönteminin günümüzde arzettiği öneme binaen onun ilmi kişiliğine ve hayatına değinilmiş ve konu genel olarak usûlcüler ve özelde Şâfiî usûlcülerin görüşlerini dikkate alarak detaylı bir şekilde incelenmiştir. Bu çerçevede çalışma bir \"giriş\", \"üç bölüm\" ve \"sonuç\" dan oluşmaktadır. Giriş'te, İsnevî'nin hayatı, eserleri, ilmi seyahati, talebeleri, Arapça ve şer'i ilimleri öğrendiği hocaları ve yaşadığı dönemin siyasi, ilmi ve kültürel boyutları üzerinde durulmuştur. Birinci bölüm'de, İmam'ın İslam hukukunun kaynakları olan şer'i delillere yönelik tutumu tespit edilmeye çalışılmıştır. Bu cümleden olarak İsnevî'nin müttefakün aleyh olan Kur'an-ı Kerim, Sünnet-i Nebeviyye, İcma ve Kıyas gibi deliller hakkındaki görüşlerine değinilmiş, bunun yanı sıra sahâbi kavli, istishâb, istihsân, örf, mesalih-i mürsele, sedd-i zeria ve şerʽu men kablenâ gibi muhtalefün fih olan deliller hakkındaki görüşleri de ele alınmıştır. İkinci bölüm'de; mücmel, mübeyyen, nasih-mensuh, âmm-hâs, emir-nehiy gibi temel usûl meseleleri esas alınarak İsnevî'nin, usûl eserlerinin tamanının incelenmesiyle usûl yöntemi ve görüşleri detaylı bir şekilde tetkik edilmiştir. Üçüncü bölüm'de ise, İsnevî'nin tearuz, tercih, ictihad, taklit ve fetva gibi diğer usûl meselelerindeki görüşlerine yer verilmiş ve tahliller yapılmıştır. Ve nihayet araştırma boyunca tespit edilen ve ulaşılan bilgiler, \"sonuç\"ta bir bütün olarak hülâsa edilmiştir."
