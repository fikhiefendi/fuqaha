abstract: "Bu çalışma, 224/1 (1-158) Numaralı Urfa Şer'iyye Sicili üzerinden H. 1287- 1290/M. 1870-1873 tarihleri arasındaki dava tutanaklarının çeviri ve tahlilini amaçlar. Defter, toplam 302 sayfadır. Bu tezde ise 1-158 sayfaları arası incelenmiştir. Söz konusu sayfa aralığında 667 dava mevcuttur. Üç yıllık süre içerisinde mahkemeye intikal etmiş adlî vakalar çoğunlukta olup, hırsızlık, cinayet, darp ve cerh olayları ise ağırlıktadır. Bu suçların daha ziyade şehrin kırsalında meydana geldiği görülmektedir. Yaralama, darp ve cinayete karışan suçluların farklı gerekçeleri vardır. Genellikle küfür, zina ve tecavüz gibi şahsın onuruna dokunan fiillerin yanında gündelik ilişkilerde yaşanan anlaşmazlıklar, aile içi miras taksimi, alım-satım ve alacak-verecek gibi pek çok konular bu sebepler arasında sıralanır. Suç eğiliminin kırsaldaki yoğunluğu sosyo kültürel sebeplere dayandığı gibi güvenlik tedbirlerinin eksikliğine de işaret etmektedir. Tutanaklarda sadece erkeklerin değil kadınların da sesi duyulmaktadır. Herhangi bir davada hazır bulunurlarken nadir de olsa borç verdikleri görülür. Belde tabiplerinin hasta mahkûmlara ilişkin kayıtlarında, dönemin hapishane koşullarına ve yaşanan hastalıklara temas edilmiş olması ayrıca kıymet arz eder. İslamiyet'e geçmek üzere mahkemeye başvuran Hıristiyanların ihtida davaları üç yıllık süre içerisinde tutulmuş kadı kayıtları arasında yer alır. Söz konusu kayıtlar, mühtedilerin Müslüman olabilmeleri için sağlamaları gereken şartları ve mahkemenin izlediği yolu içermektedir. Arazî anlaşmazlıklarında taraflar arasındaki uyuşmazlıklar, alacak-verecek konularında yaşanan anlaşmazlıklar ve çözüm yollarının kayıtlar üzerinden tespit edilebilmiş olması ayrıca önemlidir. İlaveten suç cetvellerinin gönderimine dair fermanlar, uygunsuz makulesinden olarak addedilen, toplum huzurunu bozan kişilere dair belgeler defterdeki davalar arasında yer almaktadır. Nadir de olsa nafaka, kefillik, alım-satım, iflas, ticarî ortaklık, firar, memura hakaret, beledî hizmetler ve aşiretlerin tutumlarına ilişkin belgeler, Urfa kadılığınca tutulmuş kayıtlar arasında yer alır."
