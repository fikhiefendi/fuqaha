abstract: "İş sözleşmesi; işveren tarafından ödenecek ücret ve işverene bağımlı bir şekilde iş görme borcundan meydana gelmektedir. İşçinin ücreti hususu, işçiler açısından iş sözleşmesinin en önemli unsurudur. Bu sebeple iş sözleşmesinin nisbi olarak güçlü tarafını oluşturan işveren karşısında işçinin korunması amaçlanmıştır. İslam Hukukunun en temel kaynağı olan Kur'an-ı Kerim'de çalışanların ücreti; örnek birtakım olaylar ve adalet kavramı ile temellendirilmiştir. Temel kaynaklardan ikincisini oluşturan sünnetteyse ücretin tam ve ne zaman ödenmesi gerektiği gibi daha özel konular hadislerle detaylandırılmıştır. İslam Hukukundaki kapsamlı ilk kanunlaştırma çalışması olan Mecelle-i Ahkâm'ı Adliyye'de ise işçinin ücreti dâhil olmak üzere işçi işveren ilişkilerine dair kurallar sistematik bir hale getirilmiştir. Ücretin Türk İş Hukukunda normlar hiyerarşisinin tepesinde yer alan Anayasa'da düzenlenmesi, ücrete verilen önemi açıkça göstermektedir. İşçinin ücretiyle ilgili İş Kanunu ve Borçlar Kanunu'nda çeşitli hükümler bulunduğu gibi, Yargıtay da ücrete ilişkin tanımlamalar yapmış ve işçi ücretlerini koruyucu birtakım uygulamaları benimsemiştir. Bu çalışmanın amacı; işçinin ücreti konusunu İslam Hukukunda Kur'an-ı Kerim, sünnet ve Mecelle temelinde; Türk İş Hukukunda ise anayasal, yasal düzenlemeler ve Yargıtay kararları ışığında mukayeseli bir bakış açısıyla incelemektir."
