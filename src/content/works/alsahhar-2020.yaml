abstract: "Bu Tez, Kudüs Müftüsünün otuz yılı geçkin fetvaları ile Aksa Camisinin İmamlığını yapan ve Denetim Başkanı olan Müftü : Rahmetli Hassan bin Abdul Latif Al-Hosani'nin. Fetvalarının araştırmasını içermektedir. Bu araştırmanın ilk bölümünün birinci yarısında kısaca kendisini tanıtmaya çalıştım. Birinci bölümün ikinci yarısında ise bu bilimsel araştırmanın değerini açıkladım. Rahmetli Müftünün Yöntem ve Kaynaklarını ele alıp Araştırmada izlediğim yaklaşımdan bahsetmenin yanı sıra ulaşabildiğim nüshaların açıklamalarını da yaptım. Daha sonra, araştırmanın yaklaşımını açıkladığım ve detaylandırdığım ikinci bölüme başladım. Ve sonrasında ise araştırma yaptığım metnin aslını koruyarak Ayet ve Hadislerin geçtiği yerleri belirttim. Araştırmada yer alan Söz ve düşüncelerin, ait olan sahiplerine atfedilmesini sağladım. Önde gelen isim ve beldeler hakkında açıklayıcı bazı bilgileri araştırmaya ekledim. Anlaşılmayan kelimelerin anlamını açıklığa kavuşturdum. Bundan önce araştırmada konunun doğasını, önemini, seçim nedenlerini, önceki çalışmaları, karşılaştığım zorlukları, araştırma ve soruşturmanın amacını anlattığım bir giriş yaptım. Rahmetli Müftü bu Çalışmalarda Hanefi Mezhebini benimsemiştir. Ve çoğunlukla fetvalarında bu mezhebi taklit etmeye yönelmiştir. Zamının alimi olmasına ve geniş bilgi birikimine rağmen Hanefi mezhebi ekolunden ayrılmadı. Rahmetli Müftünün vermiş olduğu fetvalardanda anlaşılacağı gibi bilgi birikimi olan bir zattı. Hükümler hakkındaki bilgisi ve bu hükümlerin insanların hayatlarına dair en dataylı konulara uygunluğuna vakıf biri olduğunu belirtmiştir."
