abstract: "Bu çalışmada amacımız,Osmanlı Devleti'nin yönetimi sonrasında Balkanlar'da diğer malum ifade ile Rumeli bölgesinde Osmanlı fütûhatı vesilesi ile Müslüman olan ve iskân politikası sonucu Anadolu'nun çeşitli bölgelerinden oraya yerleşmiş olan Müslüman ahalinin, hukuki ve sosyal durumlarını incelemek ve aynı zamanda gayri müslim idare altında yönetilmeleri sonucunda hak ve özgürlüklerinin kısılıp kısılmadığını ortaya çıkarmaktı. Bu durumu bize izah edecek en iyi sonucu elbette bölgede hukuk ve yargı alanındaki çalışmalar olurdu. Bu sebeple biz, çok geniş ve zor olan bu konuyu ancak bir giriş mahiyeti taşıyacak şekilde bölgede mahkemelerin çalışmalarını ve Osmanlı döneminde kurulmuş olup sonrasında da devam ettirilen şeriyye mahkemelerini değerlendirip, aile hukuku alanında ki kararlarını ortaya çıkarmış olduk. Umarım bu çalışma ileriye dönük yeni araştırmacılara bir dayanak noktası olup çok daha kapsamlı çalışmalar elde etmeye vesile olur."
