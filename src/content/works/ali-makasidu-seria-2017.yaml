abstract: "Suçlunun yaşadığı çevreden alıkonulması ve ıslahevine gönderilmesi, hapis sebebi her ne olursa olsun sosyal değerlerinin, duygularının, insani hislerinin ve kişisel haklarının muhafazası ile birlikte eğitilmesi ve üretken hale getirilmesi, suçlunun hapsedilmesi hususunda makasıdü'ş şeria'nın en önemlilerindendir. Aynı şekilde toplumun muhafazası ve suçluların kötülüklerinden, zorbaların zulmünden korunması, hak ve emanetlerin gerçek sahiplerine iade edilmesi, insanlar arasında güven ve barışın tesis edilmesi de makasıdü'ş şeria'dandır. Bu sebepten ötürü İslam hapis cezasını meşru kılmıştır. Hapishanelere, çeşitlerine ve çevresine itina gösterilmiştir. Nitekim Rasulullah (sa) mescitte ve evlerde hapis cezasını uygulamıştır. Ashabı ve onlara tabi olanlar ise suçlarının ve davalarının farklılıklarına rağmen mahkûmların haklarının gözetilmesi ve ihtiyaçlarının temin edilmesi için zorunlu hizmetleri sağlayarak hapishanelerde makasıdü'ş şeria'ya uygun muamelelerde bulunmuşlardır. Hapsetmenin cezalandırma, tedbir alma, töhmet, şantaj… vb. çeşitleri bulunmaktadır. Makasıdü'ş şeria ve İslam gölgesindeki hapishaneler ile Rum, Pers gibi diğer kadim milletlerin hapishaneleri arasında büyük bir fark tezahür etmektedir. İlkinde mahkûmun onuru muhafaza edilmiş, özgürlük hakkı gözetilmiş, yiyecek, içecek, giyecek, temizlik ve eğitim gibi hayati ihtiyaçları karşılanmıştır. Diğerinde ise eziyet ve infaz için özel yerler ayrılmış ve bununla da kalmayarak mahkûmların çektikleri acılardan haz duyulmuştur. Serbest kalabilmek için yaptıklarından pişmanlık duyarak eğitime, ıslaha, irşada ve nasihatlere boyun eğen, topluma bir fayda sunma ve toplumdan zararı def etmek adına bir pay sahibi olabilmek için kendilerini hazırlayan suçluların bulunduğu makasıdü'ş şeria'ya uygun hapishaneler ile beşeri kanunlara dayalı, kanunların belirlenmiş süreler ile ne durumda olduklarına bakılmaksızın mahkûmlara uygulandığı modern hapishaneler arasındaki farkta olduğu gibi. Şöyle ki modern hapishanelerde, yaptıklarından pişmanlık duyup akıllanan ve hala bir türlü düzelmeyip suç işlemede ısrarcı olan kimseler eşit konumdadır. Ve suçlu kimse hapis süresi bitmeden serbest bırakılmaz. Önceki asırlarda ve günümüzde bazı Müslüman hükümdarlar tarafından hak ihlalleri yapılmıştır. Fakat bu davranışlar insanlığın sorunlarını çözme noktasında İslam Dini'nin metodunu yansıtmamaktadır. Bilakis kolaylık dininin maksatlarını aşmaktadır. Nebi'nin (sa) ve ona tabi olan Hulefa-i Raşidin'in mahkûmlara ve esirlere karşı teamülleri ise, kişi ve toplum hayatında makasıdü'ş şeria'ya bağlılık açısından örnek bir metot olarak kalacaktır."
