abstract: "ÖZETKronik HCV infeksiyonu tüm dünyada oldu u gibi ülkemizde de önemli birsa lı sorunudur. Kronik hepatit C (KHC) infeksiyonunda uzun dönemde siroz,kkaraci er kanseri geli me risklerinin ve mortalite oranı n yüksek olması tedavinıkonusunda çalı maları yo un olarak devam etmesine yol açmı tın r. Günümüzdepeginterferon- (PEG FN-Î±) ve ribavirin kombinasyonu KHC tedavisinde standartkabul edilmekle birlikte interferon- ( FN- ) indüksiyon ve ribavirinkombinasyonunu ile ilgili kar ı tıla rmalı veriler yeterli de ildir. Çalı manı amacınKHC hastalarında ribavirinle kombine FN-Î± indüksiyon tedavisi ile ribavirinlekombine PEG FN-Î± tedavisini kar ı tıla rmaktır.Çalı maya daha önce tedavi almamı KHC' li 40 hasta alı . Hastalar iki grubandıayrı . Birinci grupta 18 hastaya FN-Î± 2a (dört hafta süreyle 6 milyon üniteldı(MÜ)/gün subkutan ve 48 hafta 6 MÜ haftada üç gün) ve ribavirin 1000-1200 mg/günikiye bölünmü dozda 52 hafta süreyle verildi. kinci grupta 22 hastaya PEG FN-Î± 2a180 Âµg/hafta ve ribavirin 1000-1200 mg/gün ikiye bölünmü dozda 52 haftauygulandı Bu iki tedavinin karaci er fonksiyon testleri, virolojik göstergeler ve.karaci er histopatolojisi üzerine etkileri ara tı ldı ndüksiyon grubunda üç, PEG FNrı .grubunda be hasta ilaç yan etkileri veya çalı ma protokolüne uyumsuzluk gibi çe itlinedenlerle çalı madan çı ldıkarı .Hastaları ba langı demografik özellikleri de erlendirildi inde gruplarn çarasında ya dı ındaki cinsiyet, nekroinflamasyon derecesi, fibrozis, viral yük, a ı k,rlıvücut kitle indeksi, karaci er fonksiyon testleri ve hematolojik göstergelerbakı ndan anlamlı fark yoktu. Hastaları tamamımı n nda parenteral bula yolu tespitedildi. Viral genotip tayini yapı 34 hastanı tümünün genotip 1b ile infekte oldu ulan n83saptandı Tedavi süresince her iki grupta ALT de erlerinde birinci ayda belirgin bir.dü ü gözlendi. Bu dü ü tedavi sonuna kadar kısmen devam etti. Tedavi kesildiktensonra indüksiyon grubunda belirgin ALT artı ı saptandı Beyaz küre ve hemoglobin.ortalamalarında tedavi boyunca ba langı göre anlamlı dü ü saptanıca rken trombositdüzeyi ortalamalarında genel olarak anlamlı de i iklik gözlenmedi. Her iki gruptakihastaları erken virolojik yanı tedavi sonu yanı kalı virolojik yanı yanı zlın t, t, cı t, tsı k,alevlenme ve nüks oranları benzerdi. Bu oranlar indüksiyon grubunda sı yla %93.8,rası%80, %73.3, %20, %15.3 ve %8.3 iken PEG-IFN grubunda sı yla %90, %82.4,rası%76.5, %17.6, %17.6 ve %7.1 bulundu.Her iki grupta en sı görülen yan etkiler grip benzeri semptomlar,kgastrointestinal sistemle ili kili semptomlar, dermatolojik semptomlar, solunumsistemi semptomları ve psikiyatrik semptomlar idi. Yan etkilerin görülme sı ıklıaçı ndan gruplar arası anlamlı fark gözlenmedi.sı ndaBu veriler KHC' de yüksek doz indüksiyon tedavisi ile birlikte ribavirinuygulanması n PEG FN- tedavisi kadar etkin ve güvenli oldu unu göstermi tir.nı"
