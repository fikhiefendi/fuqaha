abstract: "Bu araştırmanın amacı; kutsal kitaplar ve bunların geleneksel yorumlarına göre yasanın/şeriatın ne anlam ifade ettiğini, Kitab-ı Mukaddes yasasının kapsamını, içerdiği hükümlerin birbirleriyle, tarihsel şartlarla ve Kur'an'daki hükümlerle olan alakasını araştırmaktır. Araştırmanın birinci bölümde; Yahudiliğin ve Hıristiyanlığın kutsal metinleriyle geleneksel yorumlarına göre yasanın anlam ve önemi, sınırları, nasıl korunduğu, otoritesi ve bu konuların Kur'an'da nasıl akis bulduğu araştırılmıştır. İkinci bölümde; Yahudiliğin Yasa Kitabı olan Tora'da yer alan hükümler, konularına göre tasnif edilerek tarihsel açıdan ve Kur'an'daki hükümlerle mukayese edilerek incelenmiştir. Son bölümde; Yeni Ahit'in Tora'daki yasa ve Yahudilerin geleneksel dini yaşantısı hakkında nasıl bir işlev gördüğü, Hıristiyanların hangi konularda bu yasadan uzaklaştıkları ele alınmıştır. Araştırmada; konuların tespit, tasnif, tahlil ve mukayesesi yapılmış ve semantik yöntem kullanılmıştır. Araştırmada ulaşılan sonuçlara göre; Kitab-ı Mukaddes, Musa (a.s.)'ya atfedilen tek bir yasa içerir ve İsa (a.s.) bu yasayı tamamlamıştır. Bu tamamlayıcılığı kabul etmeyen Yahudilik, Tora yasasına bağlı olan ebedi ahit teolojisi üzerine kurulmuştur. Bu ebedilik bahsine rağmen, çalışmada İsrailoğullarının tarihi ve antik dönem teamülleri gibi tarihsel şartlarla ilgisi ortaya koyulan Tora'daki yasanın önemli kısmı, şartların uygunsuzluğu gerekçesiyle Yahudiler tarafından uygulanmamaktadır. Hıristiyanlık'ta ise, Yahudilik'ten kopuş sürecinde yeni ahit teolojisi geliştirilmiş, buna göre İsa (a.s.)'nın tamamlayıcı misyonu, Tora'nın sivil ve seremoni alanındaki hükümlerini feshettiği anlamına çekilmiş, boşalan seremoni alanı kilisenin koyduğu uygulamalarla doldururken sivil alan beşeri yasalara bırakılmıştır. Kur'an, gerçekte kitaplardaki kurallara bağlılık amacı içermeyen ve özellikle uygulamada kitapların tahrifine varan bu ahit teolojilerini yıkarak, Kur'an coğrafyasında etkinliği olan İbrahim (a.s.)'in şeriatını, kâmil İslam olarak ihya etmiştir."
