abstract: "İslam iktisadı, Müslüman fertlerin İslam dininin benimsemiş olduğu temel prensipleri esas alarak sosyo-ekonomik ilişkilerine şekil vermesi çabasının bir başka adıdır. Disiplinin modern bir sosyal bilim olarak ortaya çıkması 1930'lu yıllara dayanmaktadır. Post-kolonyal dönemde Müslümanın dünya siyasi bağımsızlık sonrası kendilerine has ekonomik sistemlerini araştırmaya ve tatbik etmeye başlamasıyla beraber 1940-1970 yılları arasında İslam iktisadına dair teorik çaba öne çıkmıştır. 1970'li yıllara gelindiğinde ise, küreselleşen finansallaşma ile birlikte İslam iktisadı yerini hızlıca pratik bir sorun olan finansman ihtiyacına çözüm bulmanın karşılığı olan İslami finansa bırakmıştır. Dünya genelinde İslam iktisadının teorik inşasına katkı sağlayan metodolojik çalışmaların azlığı bir yana, Türkiye'de de benzer bir durum olmasına rağmen İslam iktisat metodolojisini gündemde tutan isimlerin başında Sabri Orman gelmektedir. Orman'ın önermiş olduğu“tevarüs ve inşa”kavramları, İslam dininin prensiplerine bağlı kalarak farklı medeniyetlerin geliştirdiği bilginin aktarılmasına imkân sağlayan bir metodoloji önerisi sunmaktadır. Bu yaklaşım, 1970'li yıllarda küresel bilgi birikimi ile yüzleşmek zorunda kalan Müslüman coğrafyalarda uygulanan bilginin İslamileştirilme yöntemini sergilemektedir. Yaygın olarak bilinen, Homoeconomicus'a karşı Homoislamicus'un önerilmesi bu durumun tipik bir örneğidir. Orman, bilginin İslamileştirilmesi yönteminden yola çıkarak özgün bir İslam iktisat disiplini sunmayı amaçlamaktadır. Her ne kadar geliştirdiği metodolojik çaba evrimci iktisat izleri taşısa da iktisadi, tarihsel ve fıkhi bilgi uzmanlığını bir arada tutan Orman, Türkiye'de çağdaş İslam iktisat literatürüne özgün katkısı olan nadir kimselerden olduğu için alana bakışı ve katkıları oldukça önemlidir. Bu bakış ve katkı, İslam iktisadının gelecekte özgün bir iktisadi alternatif olarak yükselmesinin önünü açması bakımından öncü bir çabadır."
