abstract: "İslam yaşamın her alanına düzenlemeler getirmekte ve tüm müslümanları görevlerini etkin bir şeklide yerine getirmeleri konusunda uyarı ve tavsiyelerde bulunmaktadır. Bu çalışmada, İslami iş ahlakı, Kuran'da belirtilen ilkeler ve Hz. Muhammed'in söz ve uygulamaları ışığında vurgulanmakta ve tartışılmaktadır. Bu değerler ve etik, iyiyi teşvik etme ve kötü davranışa direnme taahhüdünü temsil etmektedir. Çalışmanın amacı, İstanbul'da bulunan katılım Bankalarının şubelerinde İslami iş ahlakı, İslami insan kaynakları yönetimi, örgütsel performans ve örgütsel bağlılık düzeylerini incelemektir. Ayrıca İslami iş ahlakının örgütsel performans ve örgütsel bağlılık üzerindeki ilişkilerini analiz ederken İslami insan kaynakları yönetiminin bu sonuçlar üzerinde aracı değişken olarak rolü ortaya koyulmaya çalışılmıştır. Çalışmada anket tekniği kullanarak nicel bir araştırma tekniği kullanmıştır. Anketler İstanbul ilinde bulunan üç özel katılım bankası ve üç kamu katılım bankasının 500 çalışanına dağıtılmıştır. Araştırmada 452 personel tarafından doldurulan anketler kullanılmıştır. Betimsel ve çıkarımsal analizler için veriler SPSS (26) yazılımı kullanılarak değerlendirilmiştir. Elde edilen bulgular, İslami iş ahlakının islami insan kaynakları yönetimi, örgütsel performans ve örgütsel bağlılık üzerinde önemli ve olumlu etkiler meydana getirdiğine dair kanıtlar sunmaktadır. Bunların yanı sıra İslami iş ahlakı ile örgütsel performans arasındaki ilişkide ve İslami iş ahlakı ile örgütsel bağlılık arasındaki ilişkide İslami insan kaynakları yönetimi faktörünün düzenleyici rolünün pozitif yönde olduğu gözlemlenmiştir. Bulgular, kuruluşlarda, özellikle Katılım bankalarında İslami bir etik ortam oluşturmanın önemli bir görev olduğunu da açıkça ortaya koymaktadır."
