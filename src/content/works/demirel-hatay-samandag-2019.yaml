abstract: "Nusayrilik/ Arap Aleviliği, Muhammed b. Nusayr en-Numeyri tarafından kurulduğu düşünülen ve Hüseyin b. Hamdan el-Hasîbi tarafından sistemleştirilen; Şii mezhebin ile aynı temellere sahip; batıni bir İslam mezhebidir. Çalışmamızda Nusayri/ Arap Alevi mezhebinin genel hatları ile tarihsel süreci, akidesi ve fıkhı objektif bir şekilde ele alınarak aktarılmaya çalışılmıştır. Ayrıca mezhep için son derece öneme sahip olan, kutsal olarak görülüp 'Ziyaret'adı verilen mekânlar; Hatay ili Samandağ ilçesi örnekliğinde ele alınmıştır. Çalışma boyunca sahada bizzat var olmak, mezhebe mensup kişiler ile yakın ilişkiler kurmak, sürekli bir gözlem içinde olmayı ve literatürün dışında da yeni bilgiler edinmeyi sağlamıştır. Bu durum ise çalışmamızı olumlu bir şekilde etkilemiştir. Yaptığımız bu çalışmanın amacı ne dinsel ayrımcılık ne milliyetçilik nede mezhepçilik yapmaktır. Aksine elde edilen bilgilerle farklılıkları, kültürleri ve zenginlikleri tanıyarak birbirimizi anlamaktır."
