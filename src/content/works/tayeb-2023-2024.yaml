abstract: "Bu tez, Şeyh Tayyib el-Bahrki'nin fıkhî çabaları ve analizini kapsamaktadır. Çağdaşları arasında öne çıkan ve Kuzey Irak'ın önde gelen âlimlerinden biri olarak tanınan el-Bahrki, siyasi, ekonomik, bilimsel ve güvenlik alanlarında birçok dalgalanmanın yaşandığı bir dönemde bu konuları açıklamaya gayret etmiştir. Çeşitli bilim ve sanat dallarında üstün başarı gösteren el-Bahrki, birçok eser kaleme almıştır. Bu eserler şunlardır: 1. Hucecil el-Müttekîn fi Ba'zıl el-Mesâîl min Fu'd-dîn 2. İrşâd el-Muhtedîn fi Îzâh Ba'zıl el-Mesâîl min Fu'd-dîn 3. Mecma' el-Cevâhir en-Nîka fi Ba'zıl el-Mesâîl eş-Şer'iyye ed-Dakîka El-Bahrki'nin çabalarını incelerken araştırmacı, Şeyh'in hayatı, biyografisi ve akademik geçmişini tarihsel betimleyici bir yaklaşımla ele almıştır. İslam fıkhına yaptığı katkılar ve fıkhî tercihleri değerlendirilirken ise betimleyici ve analitik bir yöntem kullanılmıştır. Araştırmanın dikkat çekici bulgularından biri, el-Bahrki'nin eserlerinde dile getirdiği başlıca konuların, cahillerin fetva vermesi, yeni ve çağdaş muamelelerin ortaya çıkması, İslam'ın hükümlerine meydan okuyanlara karşı cevaplar sunulması ve aşırıcı mezheplere yönelik eleştiriler gibi başlıklarda yoğunlaşmasıdır. El-Bahrki, fıkhî tercihlerinde Şafiî mezhebine bağlı kalmıştır. El-Bahrki'nin yaşadığı dönemde verdiği önemli fetvalardan bazıları şunlardır: Zorunlu durumlar haricinde sandalyede namaz kılınmasının caiz olmaması, müezzinin huzurunda elektronik ezan okunmasının caiz olmaması, camilerde kılınamayan namazların evlerde kılınmasının uygun görülmesi. Ayrıca, salgın hastalık dönemlerinde evde namaz kılmanın caiz olduğuna ilişkin fetva da Peygamber Efendimiz dönemindeki örneklere atıfta bulunularak verilmiştir. Bankalardan emlak kredisi almanın tefecilik olarak değerlendirilmesi gibi konular da el-Bahrki'nin fıkhî düşüncesinde yer almaktadır. Bu fetvalar, yazarın fıkhî zenginliğini ve bilimsel yetkinliğini yansıtmaktadır."
