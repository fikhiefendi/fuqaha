abstract: "Hukukun temelini hak ve şahıs oluşturur. Şahıs hak sahibi olabilen ve haklardan faydalanabilen varlıktır. Şahıs denince akla önce insan gelir ve şahıslar hakikî ve hükmî şahıslar olmak üzere iki kısma ayrılır. Hakiki şahıs insanın kendisidir. Hükmî şahıslar ise belirli bir gaye için bağımsız bir varlık halinde teşkilatlanmış hukuk düzenince kendilerine hak ve borçlara sahip olma ehliyeti tanınmış şahıs ve mal topluluklarını ifade eder. Şahsın haklarından ve görevlerinden söz edebilmek için onun var olması gerekir. İslâm hukukuna göre kişinin şahsiyeti –takdiren de olsa sağ doğmak şartıyla- ana rahmine düştüğü andan itibaren başlar. O var olduğu müddetçe hak ve vecibeleri vardır, şahsiyeti bulunmadığında bunlardan söz edilemez. Bundan dolayı hukukî yönden, şahsiyetin başlangıcı kadar sonu da önemlidir. Şahsiyet ölümle sona erer. Ölümün ne zaman ve nasıl gerçekleştiğinin tespiti de önemlidir. İslâm hukukuna göre şahsiyeti sona erdiren ölümün hakiki ölüm, takdiri ölüm ve hükmî ölüm olmak üzere üç şekli vardır. Şahsiyetin sona ermesi aile, eşya, borçlar ve miras hukuku gibi birçok hukuk alanına tesir eder."
