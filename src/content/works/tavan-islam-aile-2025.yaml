abstract: "Fıkıh ilminin bir alt branşı olan aile hukukunda temel konulardan biri nikahtır. Evlenme akdinde tarafların dinen evlenmeye uygun olması yani evlenmesi yasak olan kişilerden olmaması gerekmektedir. Kur'an-ı Kerîm'de çeşitli ayetlerde“muharremât”denilen evlenmesi yasak olan kadınlar detaylıca sayılmış ve bir çerçeve oluşturulmuştur. Günlük hayatta kullanılan mahrem terimi daha geniş bir anlam ifade etmekte, evlenilmesi yasak olan erkek ve kadın hısımları kapsamaktadır. Nisâ Suresi 4/23. ayette ise kan hısımlığından, sıhrî hısımlıktan ve süt hısımlığından kaynaklı olarak erkeğin kendileriyle evlenmesi yasak olan kadınlara örnekler verilmiştir. Bu ayette geçen“kendileriyle zifafa girilen kadınların kızları olan ve evlerinde bulunan üvey kızlar”olarak açıklanan rabâib terimi sıhri hısımlardandır, yani bir evlilik bağı münasebetiyle kendisiyle evlenilmesi üvey babasına haram olmuştur. Rabîbe kelimesinin çoğulu olan rabâib ifadesi Kur'an-ı Kerim'de sadece bu ayette geçmektedir. Erkeğin eşinin furûu, alt soyu da denilen rabîbe, üvey kız demektir ve eğer annesinin evliliği fiilen başlamışsa yani zifaf gerçekleşmişse üvey kız, üvey babaya haramdır, evlenmeleri daimi olarak yasaktır. Ebeveynlerden birinin çocukla kan bağının olmadığı üvey aile yapısında ise üvey kızın üvey baba ile beraber yahut üvey kardeşleriyle beraber aynı evde yaşayıp yaşayamayacağı, rabîbenin hangi şartlar yerine getirilirse üvey babasına haram olduğu, ayette kastedilen duhûl lafzının kapsamı gibi hukuki meseleler ortaya çıkmıştır. Tezin amacı da hayatın içinden olan bu meseleye dair özel bir çalışma yaparak, konuyla alakalı karşılaşılan güncel problemlere değinmektir. Bu çalışmada öncelikle rabîbe kavramının konumunu İslam hukuku içerisinde daha iyi kavrayabilmek için muharremât konusuna değinilmiş, rabîbenin tanımı verilmiş, Türk hukukunda evlenme engellerinden ve rabîbenin medeni hukuktaki yerinden söz edilmiştir. Ayrıca bu kavramın geçtiği ayetin ışığında özellikle rabîbeyi haram kılan şartlar çerçevesinde konu detaylı olarak ele alınmış ve rabîbe etrafında şekillenen bazı hukuki neticeler, fıkhi kaynaklar ışığında derlenerek tezin temel konusunun daha anlaşılır bir halde sunulması hedeflenmiştir."
