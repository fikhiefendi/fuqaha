abstract: "Bu çalışma, Roma hukukundaki \"mutuum\" terimiyle karşılaştırmalı olarak, hicrî altıncı asra kadar Hanefî mezhebi kaynakları üzerinden karz akdinin teorik çerçevesini ele almayı amaçlamaktadır. Tezde, Hanefî fakihlerinin karz akdiyle ilgili temel unsurları, şartları ve akde bağlı yükümlülükleri nasıl şekillendirdiği, fıkhî kaynaklar temelinde analiz edilmiştir. Mukayese unsuru olarak Roma hukukundaki \"mutuum\" teriminin tanımı, temel unsurları ve amacı ele alınmış; ayrıca usul hukuku açısından himaye yollarına değinilmiş ve ahlâkî boyutu vurgulanmıştır. Araştırmada, her iki hukuk sisteminde \"karz\" ve \"mutuum\" terimlerinin, hukuki normların ötesinde toplumsal yardımlaşmanın inşasındaki işlevselliğinin altı çizilmiştir. Tez, karşılaştırmalı metodolojiyle İslam ve Roma hukuk sistemlerinin borç sözleşmelerine dair yaklaşımlarını açıklığa kavuşturmayı hedeflerken Hanefî mezhebi doktrininin gelişimine ve içtihatlarının teorik çerçevesine de ışık tutmaktadır. Bu bağlamda çalışma, İslam hukukunun borç ilişkilerine dair klasik dönem yaklaşımlarını, modern hukuk sistemleri ve tarihsel bağlamda yeniden değerlendirmek isteyen araştırmacılar için bir referans niteliğindedir."
