abstract: "İslam hukuku cezaları tasnif etmiş ve bu tasnif içerisinde haddi gerektiren suçları özellikleri itibariyle diğer suçlardan ayırmıştır. Fıkıh sistematiğinin bu genel yapısı içerisinde de ekol sistematiği açısından mezhepler, hangi suçların hadler içerisinde yer aldığı ve hadlerin niceliği hususunda ihtilaf etmişlerdir. Bu bağlamda ekol sistematiği içerisinde had ile ilgili yapılan tanımlar bu ihtilafın tebarüz etmesi açısından önem arz etmektedir. Nitekim had için yapılan bazı tanımlara göre; belirlenmiş olan had cezalarının sayısında herhangi bir değişiklik söz konusu değilken bazılarında ise yetkililer tarafından cezası belirlenen her suç had kapsamında değerlendirilebilmektedir. Bu nedenle mezhepler arasında hangi suçların hadler içerisinde yer aldığı hususunda sınırlı bir çerçevede ittifak olsa da haddin kapsamının ne kadar genişletilebileceği hususu ihtilafa konu olmuştur. Hatta öyle ki kimi zaman bu ihtilaflar mezheplerin kendi sistematiği içerisinde de vuku bulabilmektedir. Bu nedenle çalışmada Şâfiî Mezhebi merkezinde had cezaları ele alınmış ve konu Hicri 5 ile 10. asırlar arasında sınırlandırılmıştır. Bu dönem içerisinde yer alan Şâfiî kaynakları ve ilgili diğer literatür incelenmiş, hadler ve hadlerin cezalarıyla alakalı Şâfiî mezhebinin anlayışı ortaya konulmaya çalışılmıştır. Yöntemsel açıdan çalışma giriş ve üç ana bölümden oluşmaktadır. İlk bölümde suç ve cezalarla alakalı Şâfiî mezhebinin genel görüş çerçevesi literatür analizi ile ortaya konulmuştur. Bu genel çerçeve içerisinde yer alan kıstasların ve kullanılan terimlerin günümüz ceza hukukunda ve cezanın oluşumunda karşılıklarının olup olmadığı mukayese yöntemi ile tespit edilmiştir. Mezhep sistematiğine yönelik had cezaları merkezinde yapılan eleştiriler değerlendirilmiş ve hadler konusunda ortaya çıkan ihtilaflar metin analizi ile incelenmiştir. Bu incelemenin ardından elde edilen verilerden hareketle eleştiriler, ihtilaflar ve konuyla ilgili sorunlara dair çözümler getirilmeye çalışılmıştır. Çalışmanın ikinci bölümünde ise her had cezası kendi başlığı altında incelenmiş ve fürua dair ihtilaflar ilgili dönem aralığıyla sınırlı kalmak kaydıyla mezheb görüşünün ne olduğu tespit edilmeye çalışılmıştır. Son bölümde de had suçlarının tespit yöntemlerinin neler olduğu üzerinde yoğunlaşılmıştır. Özellikle de günümüzde suçların tespitinde kullanılan teknolojik temelli uygulamaların/gelişmelerin haddi gerektiren cezalarda Şafiî mezhebi merkezinde tespit aracı olarak kabul edilip edilmeyeceği ele alınmıştır. Ayrıca bu bölümde cezaların tatbiki, geciktirici etkenler ve uygulamada dikkat edilmesi gereken hususlar ayrıntılarıyla ele alınarak çalışma sonuçlandırılmıştır. Anahtar kelimeler: İslam Hukuku, Şâfiî Mezhebi, Had, Suç, Ceza"
