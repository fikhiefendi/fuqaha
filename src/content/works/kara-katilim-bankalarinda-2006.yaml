abstract: "Kurulusları seksenli yıllara denk gelen katılım bankaları, ülkemizde meydanagelen ekonomi politikalarının degisikligi sonucu olarak ortaya çıkmıslardır.Kuruldukları ilk günlerde bankaların tamamlayıcısı olarak hizmet veren katılımbankaları, bugün geldigimiz noktada ticaret bankaları ve yatırım-kalkınmabankalarının yanında üçüncü bir tür olarak bankacılık hizmeti vermektedirler.Faizsiz bankacılık alanında hizmet veren katılım bankaları ürün ve hizmetanlayısı ile diger bankalardan farklı bir konuma sahiptirler. Kuruluslar tarihleri digerbankalara nazaran çok kısa olmasına ragmen bu kısa süre içinde ulasılan bu yüksekpazar payı, tamamen ülkenin böyle bir finansal hizmete olan ihtiyacı sonucundaolmustur.Bununu bir diger nedeni ise ülke nüfusun %99'unun Müslüman olması dagösterilebilir.Finans sektöründe faaliyet gösteren katılım bankaları için en önemlidegerlerden biri de sahip oldukları entelektüel sermayedir. sletmeler için entelektüelsermaye olarak adlandırılan yetistirilmis personel uzun süreçler sonucunda eldeedilmektedir. Katılım bankalarının rekabetçi piyasa kosullarında hem kendipiyasalarında hem de diger bankaların piyasalarında daha iyi rekabet edebilmeleriiçin sahip oldukları personeli günün kosullarına göre en iyi sekilde egitmesi vegelistirmesi gerekmektedir.Bu çalısmanın konusunu katılım bankası personelinin egitimi konusuolusturmaktadır. Bu konuyu açıklamak için öncelikle katılım bankalarının özelliklerive geçirmis oldukları tarihi süreci, sonraki bölümlerde ise personel egitimi konusu vedaha sonra ise hizmet içi egitim konusu açıklanmıstır. En son bölümde ise bu konuile ilgili yapılmıs olan anket çalısmasına yer verilmis olup çözüm önerilerisunulmustur."
