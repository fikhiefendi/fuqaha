abstract: "113 Özet Azerbaycan'da Şeyhülislâmlık isimli tezimizde, Azerbaycan'da İslâm dinin yayılmasından önce halkın inanmış olduğu dinlerden ve bu dinlerin özellikleri hakkında kısa malumat vermekteyiz. İslâm dininin Azerbaycan'da yayılması ve onun topluma etkileri, Şeyhülislâmlık müessesi hakkındaki genel malumatlar Giriş bölümünde yer almaktadır. Bağımsızlık Öncesi Şeyhülislâmlığı ismindeki Birmcz bölümde, Hanlıklar zamanında Ruhanî zümresinin yeri, seçilmesi ve vazifeleri hakkında malumat verilmektedir. Çar Rusya'sı zamanında Zakafkasya Müslümanları Ruhanî İdaresinin kurulması, bu dönemde olan Şeyhülislâmların özellikleri, tayinleri, vazifelerin ayrılması, maaşı ve onların yardımcıları olan Müftüler hakkında da malumat vardır. Sovyet Hakimiyeti zamanında toplumu dinsizleştirme, dine karşı mücadele ve II. Cihan savaşından sonra Ruhanî İdaresinin yeniden faaliyete başlaması ve dönemde olan Şeyhülislâmlar ve Müftüler hakkındaki malumatlar da burada bulunmaktadır. Bağımsızlık Dönemi Şeyhülislâmlığı isimli İkinci bölümde Azerbaycan bağımsızlığını kazandıktan sonra, Din Devlet ilişkileri, devletin Ruhanîlere tanımakta olduğu haklar, Kafkas Ruhanî İdaresinin kuruluşu, hukuki yapısı, görev ve faaliyetleri hakkındaki bilgiler burada verilmektedir."
