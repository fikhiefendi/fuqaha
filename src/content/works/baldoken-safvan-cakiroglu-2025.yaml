abstract: "Bu çalışmada,“Safvan Çakıroğlu ve İbrahim Tanrıkulu'nun Kırâat İlmindeki Yeri ve Eğitim Metotlarının Mukayesesi”yapılmaktadır. Bu çerçevede, Türkiye'de kıraat ilmi alanında derin izler bırakmış iki önemli isim olan Şeyhü'l-Kurrâ Safvan Çakıroğlu ve İbrahim Tanrıkulu hocalar, ilmî birikimleri, kıraat ilmine katkıları ve özellikle de talebe yetiştirmedeki eğitim metotları açısından karşılaştırılmaktadır. Çalışmanın problemi, akademik düzeyde Safvan Çakıroğlu ve İbrahim Tanrıkulu'nun kıraat ilmindeki yerlerini ve eğitim metotlarını mukayese eden herhangi bir araştırmanın günümüze dek yapılmamış olmasıdır. Çalışmanın amacı, Safvan Çakıroğlu ve İbrahim Tanrıkulu'nun kıraat ilmindeki yerlerini ve eğitim metotlarını mukayese etmektir. Ömürlerini Kur'ân eğitim ve öğretimine adamış olan bu âlimlerin hayat hikâyelerinin, ilmi kişiliklerinin, Kur'ân eğitim yöntemlerinin ve ülkemizde yaptıkları hizmetlerin bilimsel bir araştırmaya konu edilerek kayıt altına alınması büyük önem arz etmektedir. Bu yönleriyle tezimiz, özgün bir nitelik de ortaya koymaktadır. Tezin kapsamı, Safvan Çakıroğlu ve İbrahim Tanrıkulu'nun kıraat ilmindeki yerleri ve eğitim metotları ile sınırlı tutulmaktadır. Araştırma, nitel bilgi toplama metotlarından yazılı doküman incelemesine ve nicel araştırma türlerinden görüşme/röportaj/mülakat tekniklerine dayanmaktadır. Bu kapsamda literatür taramasından elde edilen veriler, tarihî arka plan da dikkate alınarak bütüncül bir yaklaşımla incelenmektedir. Görüşme teknikleri bağlamında da Safvan Çakıroğlu ve İbrahim Tanrıkulu'nun hâlihazırda hayatta olan öğrencileri ve onların Kur'an hizmetine tanıklık eden kişilerle mülakat yapılmıştır. Araştırmanın temel kaynaklarını, Safvan Çakıroğlu ile ilgili yazılmış makaleler ve öğrencilerinin hatıraları oluştururken; İbrahim Tanrıkulu hakkında yazılı kaynakların neredeyse hiç bulunmaması, bu çalışmanın özgün değerini artırmaktadır. Tanrıkulu ile ilgili bilgiler, doğrudan öğrencilerinden alınan röportajlar, ses ve video kayıtları ile kişisel görüşmeler yoluyla derlenmiştir. Bu yönüyle tez, hem bir ilmî biyografi çalışması hem de bir kıraat eğitimi metodolojisi araştırması olma niteliği taşımaktadır. Netice itibarıyla bu çalışmada iki farklı kıraat üstadının ilmî birikimlerinin karşılaştırılmasıyla Türkiye'de geleneksel kıraat öğretiminin tarihsel sürekliliği, aktarılan yöntemler ve eğitici karakterleri ortaya konulmaya gayret edilmiştir. Sonuçlar, kıraat eğitiminde bireysel öğretimin ne derece önemli olduğunu ve her iki hocanın da bu alandaki istisnai katkılarını açıkça gözler önüne sermektedir."
