abstract: "Günümüzün teknolojik ve farmakolojik imkânları, insan, hayvan ve çeşitli diğer haram bileşenlerin farmasötik ürünlerde kullanımını mümkün kılmaktadır. Bu çalışma, haram farmasötik maddeleri merkez alarak hem klasik hem de modern dönemde haramın belirlenmesinde esas alınan ölçütleri temel alarak ilaçlarda bu maddelerin kullanımını fıkhî bir perspektifle ele almaktadır. Çalışma, ilaçlarda yer alan haram bileşenlerin tedavi amacıyla kullanımına ilişkin çağdaş tıbbî ve farmakolojik uygulamalarda karşılaşılan sorunları, fıkhî ilkeler çerçevesinde değerlendiren sağlam bir teorik zemin sunmaktadır. Ayrıca, klasik fıkhî normlar ile modern helal farmasötik uygulamalar arasında bir köprü kurarak hem teorik hem de pratikte uygulanabilir çözüm ve ilkeler geliştirilmesini hedeflemektedir. Tedavide kullanılan haram bileşenlerin hangi şartlarda meşru sayılabileceğini açıklığa kavuşturmak için hukukî bir mahiyet taşıyan zarûret ilkesi öne çıkmaktadır. Bu ilke, ekstrem durumlarda katı hükümlerin geçici olarak esnetilmesine imkân tanıyan önemli bir norm olarak, ilaçlardaki haram bileşenlerin kullanımına ilişkin istisnai durumların anlaşılmasında belirleyici rol oynamaktadır. Zarûret ilkesinin esnekliği ve uygulanabilirliği, günümüzde ilaç teknolojisinin ulaştığı ileri boyutlar ve yeni haram farmasötik bileşenlerin tedavide kullanımı bağlamında uygulanabilir bir çerçeve sunmaktadır. Ayrıca, zarûret ilkesi, helal ilaç arayışının ön koşulu olarak helal üretimi teşvik eden ve yönlendirici bir işlev görmektedir. Bu bağlamda, helal alternatiflerin geliştirilmesi ve helal ilaç anlayışının güçlendirilmesi, Müslüman bireylerin helal ilaç hakkının görünür hâle gelmesi açısından son derece önemlidir."
