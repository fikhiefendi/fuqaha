abstract: "Bu çalışmamız Muhammed b. Hasan eş-Şeybânî?nin itikadi görüşlerini tespit etmeye yöneliktir. Şeybânî, Hicri II. yüzyılda Abbasiler döneminde yaşamış, Hanefi mezhebinin Ebu Hanife ve Ebu Yusuf?tan sonra önde gelen fakih, muhaddis ve müçtehitlerindendir.Tezimiz bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde Şeybânî?nin hayatı, ilmi kişiliği, eserleri hakkında bilgi verildi. Akidetü?ş-Şeybânî adlı eser hakkında araştırma yapılarak Şeybânî?ye ait olup olamayacağı değerlendirildi. Birinci bölümde Şeybânî?nin yaşadığı dönem ve düşünce ekolleri ele alındı, ikinci bölümde de Şeybânî?nin itikadi görüşleri özellikle kendi eserleri ele alınarak tespit edilmeye çalışıldı. Bunun yanında Şeybânî?nin ircâ görüşü ile ilişkisi üzerinde durularak onun Mürcie?ye mensup olup olamayacağı yine kendi eserleri ve görüşleri bağlamında ele alınarak incelendi.Tebe-i tabiin devri selef alimlerinden olan Şeybânî, döneminde bir çok ilim merkezine seyahat ederek devrin önde gelen alimlerinden ders almış; hadiste, özellikle de fıkıhta söz sahibi olmuştur. Hanefî fıkhının tedvin ve telifinde önemli rol oynayan Şeybânî, hem fıkıhta hem itikatta hocası Ebu Hanife?nin çizgisini takip etmiştir. Bu yönüyle o, Hanefi çizgideki İslam fıkhı ve itikadının önemli ravi ve temsilcilerinden biridir. Öyleki, Ehl-i Sünnet itikadını sistemleştiren İmam Mâturîdi?ye giden süreçte rivayet zincirinin önemli bir halkasını teşkil etmektedir. İmam Şeybânî, fıkhi konularda rey ve içtihatta bulunmakla birlikte itikadi konularda rey ve içtihatta bulunmamıştır. Çünkü Şeybânî?ye göre, itikadi hususlar rey ve içtihat alanı değildir. İtikadi hususlarda nassa ve sahih hadislere bağlı kalan Şeybânî, bu konudaki açıklama ve yorumlarda ise hocası Ebu Hanife?nin çizgisini takip etmiştir. Müteşabih ayetlerin tefsir ve tevil edilmesine karşı çıkan Şeybânî, itikadî hususlarda dönemindeki düşünce ekollerinin görüşlerinden uzak durmuştur. Mürcie?ye mensubiyetine dair eserlerinde her hangi bir bilgi ve görüş ileri sürmeyen Şeybânî?nin ircâ akidesinden uzak durduğunu söyleyebiliriz. Sonuç olarak Şeybânî, Hanefî çizgide bulunarak, gerek fıkıhta gerekse itikatta nassa ve sahih rivayetlere bağlı kalmayı yeğleyen bir tutum sergilemiştir."
