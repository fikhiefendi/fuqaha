abstract: "Hukukun uygulanış biçimi olarak, görülen davaların kayıt altına alınması Osmanlı Devlet geleneğinin kadim bir parçasıdır. Bahsedilen devlet geleneği imparatorluğun muhtelif yerlerinde aktif bir şekilde uygulanmış; mal-mülk satışı, evlilik-boşanma, adam yaralama veya aile içi şiddet gibi çeşitli olaylar kadının hükmünden geçerek sicillere birer birer not düşülmüştür. 1475 yılında Kefe'nin ele geçirilmesiyle Osmanlı Devleti'nin himayesi altına giren Kırım Hanlığı da Osmanlı hukuk anlayışını devam ettirmiş ve böylelikle hukuk sisteminin bir parçası haline gelen mahkemede görülen davaların not edilmesi uygulaması burada da izlerini göstermiştir. Görev ehli kadının yargıçlığı ile neticelenip kayıt altına alınan davalar hem ihtiva ettiği dönem içerisinde yazılı birer delil görevi görmüş hem de Osmanlı hukukunun, sosyo-ekonomik yapının ve gündelik yaşamın gözlemlenip tarihçinin malzemesi haline dönüştürülmesi kapsamında birer kaynak niteliğine bürünmüştür. Biz de bu bağlamda 38 Numaralı 1116-1117/ 1704-1706 tarihli Kırım Kadı Sicili transkript ederek bahsedilen deftere göre Kırım Hanlığı'nın durumunu çeşitli başlıklar altında değerlendirdik. Birinci bölümde hanlıkta bulunan köy ve mahalleri Osmanlı Devleti'ndeki örnekleriyle kıyasladık. Mahallelerin yapısal planlamasını ve insanların bir arada yaşama dinamiklerini tartıştık. İkinci bölümde ise Osmanlı hukukunun uygulanış biçimini ve Kırım Hanlığı'nın sosyal yapısını açıkladık. Ayrıca mahkemeye yansıyan suç vakalarını meydana getiren dinamiklerden de bahsettik. Üçüncü bölümde ise hanlığın maddi kaynaklarını sıralayarak insanların geçim kaynakları tespit ettik. Son olarak Kırım Hanlığı'nda ekonomik ve toplumsal yönden önemli bir yere sahip olan kölelerin durumlarını analiz ettik. Ana kaynağımızı teşkil eden 38 Numaralı Kırım Kadı Sicili'nin çok kısa bir süre zarfını kapsamasından dolayı kaynağımızdan yola çıkarak Kırım'a dair kesin ve genel bilgiler vermek elde ettiğimiz bulguların ve çalışmanın boyutunu aşmaktadır. Dolayısıyla biz de verilerimizin ötesine geçmeden, mikro ölçekli uygulamaların ışığında Kırım'ın gölgede kalmış tarihine nispeten ışık tutmayı hedeflemekteyiz."
