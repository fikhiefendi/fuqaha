abstract: "İslami finans kuruluşlarının kendilerine özgü faaliyet yapıları, kurumsal yönetim sistemi çerçevesinde bir fıkhi uygunluk yönetim sisteminin varlığını gerektirmektedir. Bununla birlikte söz konusu sistemin kapsamı, sınırları, yapısı ve uygulanması ülke ve kuruluş bazında farklılık arz edebilmektedir. Bu çalışma, İslami finans kuruluşlarında fıkhi uygunluk yönetim sistemine ilişkin mevcut standartları ve düzenlemeleri mukayeseli olarak incelemektedir. Bunun için öncelikle literatür taraması yapılarak konunun çerçevesi belirlenmiştir. Konuya ilişkin uluslararası standartlar Türkçe'ye çevrilmiş, kapsam ve içerik açısından karşılaştırılmıştır. Diğer taraftan farklı ülkelerin konuyla ilgili yaptığı düzenlemeler taranmış ve ayrıntıları mukayese tablosunda özetlenmiştir. Netice olarak, İslami finans kuruluşlarında fıkhi uygunluk yönetim sistemine ilişkin uluslararası standartların konuya farklı açılardan yaklaştığı ve birbirlerini tamamlayıcı nitelikte olduğu belirlenmiştir. Ayrıca, mevcut durumda konuya ilişkin en ideal düzenlemelerin Malezya, Türkiye, Bahreyn, Pakistan, Ürdün, Umman ve Nijerya tarafından yapıldığı sonucuna ulaşılmıştır."
