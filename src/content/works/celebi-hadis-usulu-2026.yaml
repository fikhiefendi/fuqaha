abstract: "Kur'an-ı Kerim'den sonra İslam'ın ikinci temel kaynağı sünnettir. Bu nedenle Hz. Peygamber'den gelen rivâyetler ilk dönemden itibaren farklı yöntemlerle tenkite tabi tutulmuştur. Rivâyetler senet ve metin açısından değerlendirilmiş, adalet ve zabt yönüyle ravilerin durumları, raviler arasında inkıta olup olmadığı hadis âlimleri tarafından araştırılmıştır. Tüm bu araştırmalar neticesinde hadislerin kabul ve red açısından durumları ortaya konmuş, bu alanda farklı çalışmalar yapılarak birçok eser kaleme alınmıştır. Sünnet, İslam Hukukunun temelini oluşturması sebebiyle muhaddislerle birlikte fakihlerinde üzerinde çalıştığı en önemli alanlardan biri olmuştur. Yapılan bu çalışmalar, rivâyetleri değerlendirme de ve değerlendirilen rivâyetlerden çıkarılan hükümlerde muhaddislerle fakihlerin bazı noktalarda farklı düşündüklerini bize göstermektedir. Bu yaklaşımlarda, ilk dönemle birlikte ortaya çıkan hadis usulü kavramlarına yüklenen farklı anlamların etkisinin olduğu görülmektedir. Bu çalışmada, Hatîb el-Bağdâdî'nin el-Kifâye fî ilmi'r-rivâye adlı eseri ile Serahsî'nin Usûlü's-Serahsî adlı eserinde geçen hadis usulü kavramlarının muhaddis ve fakih bakış açısıyla mukayesesini ele aldık. Birinci bölümde, aynı dönemde ancak farklı coğrafyalarda yaşamış, kendi alanlarında otorite kabul edilen ve eserlerinden faydalanılan bu iki müellifin hayatı , ilim yolculukları, hocaları, öğrencileri ve eserleri hakkında bilgi verdik. İkinci bölümde ise el-Kifâye ve Usûlü's-Serahsî adlı eserlerde geçen hadis usulü terimlerini karşılaştırarak birleştikleri ve ayrıldıkları yönleri tespit etmeye çalıştık. Araştırmayı konuyu genişletmemesi için, zikredilen iki eserle ve bu eserlerde geçen hadis usulü kavramlarıyla sınırlı tuttuldu. Çalışmada rivâyetlere muhaddis ve fakihlerin yer yer farklı pencerelerden baktığını, muhaddislerin genel olarak rivâyetlerin naklini öncelerken, fakihlerin ise ihtiva ettiği mana yönüyle ele aldıklarını gözlemledik. Sonuç olarak her iki müellifin hadis usulü terimlerini kendi usül doktrini çerçevesinde değerlendirdiği, bu nedenle kavramlara yüklenen manaların farklı olduğu tespit edilmiştir."
