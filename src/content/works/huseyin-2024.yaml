abstract: "İslam şeriatı, dini metinlerinde hüküm belirtirken birçok konuda sınırlama belirlememiştir. Ne var ki eski alimlerin çoğu, makâsıd ilmi hakkında çokça konuşmalarına rağmen birçoğu, makâsıd konularını belli bir miktar ile sınırlandırmamışlardır. Ancak araştırmalar sonucunda alimlerin makâsıdın bir parçası olan zaruretlerin sayısına belirli bir sınırlama getirdikleri görülmektedir. Fakat zaruretlerin sayısı konusunda görüş ayrılığına düşmüşlerdir. Bazıları beş tane sayarken bazıları da daha fazla olduklarını ifade etmiştir. Araştırmada, şeriat'ın adalet, eşitlik ve insan onuru gibi değerler arasında önemli bir yer verdiği bir insani değer olarak hürriyet ele alındı. Bazıları, şeriat ve onun Makâsıd sisteminde hürriyetin önemli bir yer tuttuğunu ifade etmektedir. Öte yandan diğer bazı alimler, hürriyetin, İslam hukukunda öncelikli olmasının yanı sıra somutlaştırması ve beslemesi gereken zarûriyattan biri olarak da beş zaruri esaslara ve modern çağın en acil ve aranan insani değerleri arasına eklenmeyi hak ettiğine inanıyor. Hürriyet, kişinin, hiçbir kısıtlamaya veya zorlamaya maruz kalmadan, İslam hukukunun hükümlerine uygun olarak, başkalarının haklarını ihlal etmeden, onlara saldırmadan hareket etme, inanma ve fikrini ifade etme hakkıdır. Hürriyeti kısıtlamak ise Cenab-ı Hakk'ın kendisine bahşettiği insan haklarından haksız ve gerekçesiz olarak onu mahrum bırakmaktır. Araştırmada, hürriyete atıfta bulunan delilleri ve hukuki metinleri sunarken tümevarımsal yaklaşım ele alınmıştır. Hürriyet kavramını ve amaçlarını açıklamada, şekillerini ve uygulamalarını belirlemede ve analitik olarak incelemede de tanımlayıcı ve analitik yaklaşımı takip edildi. Araştırmayı ele alırken Şeriat hukukunun amaçlarını, tanımını, kökenini, hukukçu ve ilim adamı açısından önemi, ardından ispat yöntemleri ve bölümleri ele alındı. Daha sonra hürriyet konusu, önemi ve çeşitleri açıklandı. Özgürlüğün amacını Kur'an-ı Kerim'de, Hz. Peygamber'in sünnetinde ve şerefli sahabelerde (Allah hepsinden razı olsun) tespit ederek, özgürlüğün amacı ve makâsıd ile ilişkisi arasındaki bağlantı araştırıldı. Hürriyetin makasıdının diğer zaruri makâsıd ile örtüşmesi ve hürriyet makâsıdının şeriatın makâsıdının içindeki doğru yerinin açıklanması İslam şeriatındaki inanç, düşünce, mülkiyet, çalışma hürriyeti, seyahat ve politika gibi hürriyet türleri araştırılmıştır. Naçizane araştırmamızın ulaştığı sonuçlar arasında, İslam hukukunun başka hiçbir sistem ve hukukta bulamayacağınız genişlik ve esnekliğe sahip olduğu ve bilinen beş veya altı makâsıd ile sınırlı olmadığı yer almaktadır. Bunlar arasında zaruriyatlar en önemlileridir. Dolayısıyla şeriatın genişleyebildiği kadar makasıdlarda geniş bir yelpazeye ayrılmaktalar. Çalışmada ele alınan hürriyet makasıdı ise önem bakımından daha öncelikli olma özelliğine sahiptir. Hürriyetin amacına ilişkin çalışmadaki gayeler arasında, İslam hukukunda gerçek hürriyetin anlamını ve hedeflerini karartmayı amaçlayan kötü niyetli girişimlere karşı son derece dikkatli olunması ve İslam şeriatının kılıçla ve zorlamayla yayıldığını ifade edenlere karşı doğru bilgiye sahip olunması amaçlanmaktadır. Ayrıca millet adına karar verme yetkisine sahip olanlar, hürriyetin ezilmesinin, kısıtlanmasının haklı gösterilemeyeceğini, affedilemeyeceğini, bu eylemlerin, kibirlerin ve özgürlüklerin bastırılmasının öncelikle insan doğasına, ikinci olarak da İslam hukukuna aykırı olduğunun bilincine varmaları hedeflenmiştir. Gelişmeleri ve felaketleri şeriat hukukunun makâsıdıyla ilişkilendirmeyi esas alan objektif içtihadın hayatın her alanında devreye sokulması amaçlanmaktadır."
