abstract: "Bu çalışmada H.1098/M.1686, H.1099/M.1687 ve H.1100/M.1688 yıllarında Osmanlı Galata'sında faaliyet gösteren menkul ile gayrimenkul vakıfların mali durumlarına odaklanılmıştır. 144 numaralı vakıf muhasebe defteri aracılığıyla belirlenen 37 Galata vakfının murabaha ve kira gelirleri ile masarif ve vezaif giderleri çalışmaya yön vermiştir. Çalışma ayrıca vakıfların gelir-giderlerini nasıl kontrol ettiklerini, kâr veya zarar durumlarında nasıl tepki vererek sürekliliklerini sağladıklarını tespit edebilmeyi amaçlamaktadır. Çalışmanın sonucunda ilgili zaman aralığında Galata vakıflarının gelirlerinin yıldan yıla azalırken giderlerinin ise arttığı tespit edilmiştir. Ayrıca vakıfların zararlarını telafi etmek ve gelir-gider dengesini sağlamak için muaccele gelirlerini etkili bir şekilde kullandığı ve devletin içinde bulunduğu mali değişim ve bunalımdan etkilendiği tespit edilmiştir."
