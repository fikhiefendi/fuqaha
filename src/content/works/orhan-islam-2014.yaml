abstract: "Bu çalışma İslâm ceza hukukunda yer alan ve İslâm dininden çıkan kişilere tatbik edilen irtidad cezasını ve bu cezanın inanç özgürlüğü ile nasıl bir ilişkisi olduğunu içermektedir. Dört bölümden oluşan çalışmanın giriş/birinci bölümünde İslâm hukukundaki“suç”ve“ceza”kavramları üzerinde durduk. Bu bağlamda suç ve ceza kavramlarının tanımları, özellikleri ve suça uygulanacak cezanın oran ve şeklinin neye göre değişeceği gibi bazı teknik ayrıntılara yer verdik. İkinci bölümde din değiştirmenin hangi koşul ve şartlarda suç telakki edildiğini ele aldık. Ayrıca kişinin kâfir olmasını gerektirecek söz ya da eylemlere, inanç değiştiren kişide aranan özelliklere, din değiştirmenin suç olduğuna ilişkin getirilen delillere ve bu delillerin genel olarak değerlendirilmesine yer verdik. Üçüncü bölümde ridde suçuna uygulanan ve klasik fıkıh kitaplarında yer alan idam cezası ve bu konudaki görüş farklılıklarına yer verdik. İdam cezası yanında bu cezaya tâbi olarak takdir edilen mürtedin mirası, malî tasarrufları ve evliliği gibi konulardaki diğer yaptırımları da ele aldık. Dördüncü bölümde ise ridde cezası ile inanç özgürlüğü arasında nasıl bir ilişki olduğunu değerlendirdik. Her ne kadar cezanın hangi suç için takdir edildiği ile ilgili farklı görüşler söylenmiş olsa da bu çalışma sonunda irtidad cezasının bizatihi kalpte olan inancın değiştirilmesinden ziyade devlet rejiminin ve ideolojisinin kendisi üzerine oturtulduğu, bir bakıma vatandaşlık/kimlik bağı kabul edilen inancın değiştirilmesine takdir edilmiş bir ceza olduğu kanaatine hâsıl olduk. Beşerî sistemlerde“vatan hainliği”şeklinde tanımlanan rejime ve devlet ideolojisine karşı gelme suçuyla aynı olan bu cezanın vicdanda cereyan inanç üzerinde bir yaptırımın olmaması nedeniyle inanç özgürlüğünü kısıtlayan bir yönü bulunmamaktadır."
