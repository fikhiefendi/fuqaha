abstract: "İnsan hayatı açısından vazgeçilmez olan değerlerden birisi de adâlettir. Mülkün temeli olan adâleti ayakta tutma ve insanlar arasında dirlik ve düzeni tesis etme adına yargı erkinin varlığı zorunludur. Bütün sistemlerde olduğu gibi İslam Hukuku da yargı görevinin yerine getirilmesini zorunlu tutmuş; hatta bu görevi yerine getirmeyi ibadet olarak kabul etmiştir. Toplum hayatının düzenli bir şekilde işleyişini sağlayan bu önemli görevi yerine getirmek de hâkimlerin vazifesidir. Bütün İslam Hukukçu'ları yargı görevinin yerine getirilip; hakların sahibine teslim edilmesi için, devlet tarafından hâkim tayin edilmesinin zorunlu olduğu üzerinde görüş birliğine varmıştır.Toplum hayatı açısından son derece önemli ve bir o kadar da kutsal olan hâkimlik mesleğinin, İslam Hukuku'ndaki yerini tesbit açısından yapılan bu çalışmada, bir hukuk adamında bulunması gereken özellikler derinlemesine incelenmeye çalışılmıştır. İslam Hukuku'nda yargının yeri, önemi ve değeri, hâkimlerde bulunması gereken özellikler, hâkimlerin tayin ve azilleri, hâkimlerin bağımsızlığı ve sorumluluğu, hâkimlerin görevleri, maaşları ve teftişleri gibi konular ele alınmıştır. Ayrıca hâkimin kişili¬ği, insanlarla olan ilişkileri, söz ve davranış¬ları, hediye alıp vermesi, alış-veriş yapması ve davetlere katılması gibi özel hayatı ve resmî göreviyle ilgili konularda uyması gereken kurallar hakkında da bilgi verilmiştir. Genel olarak betimleme yönteminin kullanıldığı bu araştırmada yeri geldiğinde çeşitli eleştiriler de yapılmış ve bir hukuk adamının her haliyle örnek olması gerektiği neticesine varılmıştır."
