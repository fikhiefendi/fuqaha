abstract: "Bu çalışmada katılım bankaları özelinde İslamî finansın gelişmesi ile ekonomik büyüme arasında bir ilişki olup olmadığı araştırılmıştır. Bu sebeple İslamî finans uygulamalarının yaygın olduğu ülkelerden 11 ülkenin (BAE, Kuveyt, Umman, Bahreyn, Türkiye, Malezya, Endonezya, Pakistan, Sudan, Mısır ve Ürdün) 2013-2018 yılları arasındaki verileri kullanılarak panel veri hazırlanmıştır. Çalışmada iki farklı model kurulmuştur. Birinci model için sabit etkiler, ikinci model için tesadüfi etkiler tahmincilerinin uygun olduğu görülmüştür. Kurulan modellerdeki temel varsayımlara ilişkin sapmalar nedeniyle her iki model, Arellano, Froot ve Rogers dirençli standart hatalar tahmincileriyle tahmin edilmiştir. Bu çalışmada ayrıca, İslamî finansın özellikleri, araştırma ülkelerinde uygulanan fıkhi danışma kurulu modelleri, ekonomik büyüme kavramı ve İslam İktisadında uluslararası ekonomik büyüme değişkenlerinin yeri tartışılmıştır. Analiz sonuçlarına göre; katılım bankalarının şube sayısı, toplam finansmanları ve ekonomideki sermaye oluşumu ile ekonomik büyüme arasında pozitif ve anlamlı bir ilişki bulunmaktadır. Diğer taraftan araştırma ülkelerinde faaliyet gösteren katılım bankalarının performans göstergeleri [Likit Varlıklar /Toplam Varlık Oranı (LR), Varlık Getirisi (ROA), Öz Sermaye Getirisi (ROE), Toplam Yasal Sermaye /Riskli Varlıklar Oranı (CAR), Sermaye / Toplam Varlıklar Oranı (CA)] ve iş gücüne katılım oranları ile ekonomik büyüme arasında istatistiki olarak anlamlı bir ilişki bulunamamıştır. Çalışmada elde edilen sonuçlar, katılım bankalarının toplam finansmanları ve şube sayısındaki artışın, ekonomik büyümeyi desteklediğini göstermektedir. Diğer taraftan katılım bankalarının brüt gelir getirmeyen finansman kalemleri bilanço bozulmalarına sebebiyet vererek ekonomik büyümeyi olumsuz etkilemektedir. Bu sebeple, katılım bankalarının daha yüksek parasal hacimle faaliyetlerini sürdürebilmeleri için gerekli hukuki altyapının oluşturulması, ulusal, bölgesel ve uluslararası alanda rekabete imkân sağlayacak işbirliklerinin yapılması ve finansman risk yönetiminin profesyonel anlamda ele alınması gerekmektedir."
