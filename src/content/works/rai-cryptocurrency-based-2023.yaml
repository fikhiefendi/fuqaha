abstract: "Bu araştırma, İslami finansta kripto paraların caiz olup olmadığını incelemek için literatürün detaylı bir şekilde gözden geçirilmesi ve akademik görüşlerin ve fetvaların analizini içermektedir. Bulgular, İslami alimler arasında kripto paraların İslami prensiplerle uyumluluğu konusunda bir ayrılık olduğunu göstermektedir. Bazı akademisyenler, kripto paraların yasallaştırılmasını savunmakta, bunların meşru ödeme yöntemleri olarak potansiyellerine dikkat çekmekte ve uygun düzenlemelerin yapılmasını önermektedir. Diğer alimler ise kripto paraların yasa dışı olduğunu düşünmekte, volatilite, spekülatif doğa ve hükümet tanınmaması gibi endişeleri dile getirmektedir. Bu araştırma, kripto paralar ile İslami finans arasındaki boşluğu doldurmak için İslami esaslara uygun bir kripto para modeli önermektedir. Belirlenen endişeleri ele almakta ve İslami prensiplere uyumu teşvik etmektedir. Kripto paraların İslami finans ile uyumluluğunu değerlendirirken, çalışma şeffaflık, sorumluluk, risk paylaşımı ve İslami prensiplere uyumu vurgulamaktadır. Bu çalışma, kripto paralar ve İslami finansın kesişiminde yol alan politika yapıcılar, düzenleyiciler, finansal kurumlar ve bireylere rehberlik sağlamakta ve finansal inklüzyonu artırmayı ve dijital çağda etik finansal çözümlerin gelişimini teşvik etmeyi hedeflemektedir."
