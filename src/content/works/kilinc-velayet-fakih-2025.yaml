abstract: "Bu çalışma İran'da 1925-1979 yılları arsında hüküm süren Pehlevi hanedanlığına karşı başlayan muhalefetin şiddetlenmesi sonucunda 11 Şubat 1979/22 Behmen 1358 tarihinde başarıya ulaşan devrimin, devletleşme sürecini ve devletleşme yeteneğini ele almaktadır. Bu çalışma; giriş, iki ana bölüm ve sonuç kısmından oluşmaktadır. Giriş bölümünde izlenen yöntem ve çalışmada yararlanılan kaynaklar ele alınmıştır. Birinci bölümde Pehlevi hanedanlığının devlet politikası, devrime giden süreç, devrimin İslamî kimlik kazanma süreci incelenmiştir. İkinci bölümde İran İslam cumhuriyetinin devletselliği politik, ekonomik, sosyal göstergeler, uyum ve kültürel kimlik, manevi unsurlar göstergesi üzerinden değerlendirilmiştir. Sonuç bölümünde de elde edilen veriler, İslam ideali ile kurulan devletin anayasası ve rehberlerin söylemi de esas alınarak değerlendirilmiştir."
