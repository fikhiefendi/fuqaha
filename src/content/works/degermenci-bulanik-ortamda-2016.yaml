abstract: "Personel seçimi süreci, küreselleşen dünyada işletmelerin ayakta kalabilmek, pazar payları arttırmak ve rekabet avantajlarını korumalarında en önemli süreçlerdendir. Personel seçimi sayısal ve sayısal olmayan karar kriterlerinin bir arada kullanıldığı birçok kriterli karar verme problemidir. Bu çalışmada, personel seçimi problemi için bulanık ortamda çok kriterli karar verme yöntemi olan TOPSIS ve VIKOR yöntemleri kullanılmıştır. Çalışmada geliştirilen metotlar katılım bankacılığı sektöründe faaliyet gösteren bir firmada uygulanmıştır. Bankada uzman yardımcısı pozisyonu için beş aday, belirlenen on kriter ve beş yöneticiden oluşan karar verici grubu tarafından değerlendirilmiştir. Önerilen seçim metodu ile adayların sıralaması yapılmış ve en uygun aday seçilmiştir."
