abstract: "Bu çalışma, Etiyopya'daki insanların İslami finans konusundaki farkındalığını ve algısını analiz etmekte ve bu faktörlerin finansal katılımı sağlamak için nasıl birlikte çalıştığını araştırmaktadır. Şeriat ilkelerine dayanan İslami finans ürünleri, potansiyel olarak toplumun yetersiz hizmet alan kesimlerine ulaşabilecek faizsiz, etik, varlığa dayalı hizmetler sunmaktadır. Ancak Etiyopya'da İslami finansın potansiyeli, halk tarafından kapsamlı bir şekilde anlaşılmaması nedeniyle hiçbir zaman hayata geçirilememiştir. Dolayısıyla bu tez, Etiyopya'da halkın İslami finansa yönelik bilgi, görüş ve tutumlarını ölçmeyi ve finansal katılımı teşvik etmedeki potansiyel etkisini incelemeyi amaçlamaktadır. Bu tez için yapılan ankete katılan 322 kişiden toplanan veriler Pearson korelasyon ve t-testi analiz teknikleri kullanılarak analiz edilmiştir; sonuçlar, İslami finans konusunda halkın farkındalığı ile finansal katılım arasında istatistiksel olarak anlamlı yüksek pozitif bir ilişki olduğunu göstermektedir. Buna karşılık, halkın algısının zayıf ancak anlamlı bir negatif etkiye sahip olduğu bulunmuştur; bu da belirsizlik ve yanlış anlamanın halkın güvenini ve katılımını azaltmaya devam ettiği anlamına gelmektedir. Yaş, eğitim ve din gibi biyografik veriler analiz edilmiş ve bu faktörlerin kamu algısı ve farkındalığının şekillenmesinde önemli bir rol oynadığını göstermiştir. Bu çalışma, İslami finansın Etiyopya'nın finansal kapsayıcılık gündemine önemli ölçüde katkıda bulunabilmesi için toplumsal farkındalığı artırmanın, yanlış algıları ortadan kaldırmanın ve elverişli düzenleyici ortamlar yaratmanın kilit belirleyiciler olduğu sonucuna varmaktadır. Bu bulgular, İslami finansı etik, kapsayıcı ve sürdürülebilir finansal güçlendirme için bir araç olarak kullanmak isteyen politika yapıcılar, finans kurumları ve kalkınma paydaşları için çıkarımlara sahiptir."
