abstract: "Sekülerizm (dünyevileşme) Ortaçağ Aydınlanma Döneminden günümüze kadartartışıla gelmiştir. Din olgusunun varlığını kabul etmeyen bir düşünce olan sekülerizm insanhayatının her alanında sadece ?aklın? söz sahibi olması gerektiğini düşünür.İslâm dini ise Allah'a inanmak ve onun bildirdiklerine teslim olmaktır. İslâm dini özügereği insan hayatının maddi ve manevi her alanını düzenler. Kur'an ve Sünnet'tebulunmayan bir konuda yine bunlara uygun mantıki çözümler bulunmasını onaylar.Yeniliklere açık olmakla birlikte özünden de taviz vermeden evrenselliğini korur.İşte bu noktada sekülerizasyon anlayışı ile İslâm hukuku birbirlerinin ana hatlarınızorlar hale gelmişlerdir. Bu konuda yapılan ve yapılmaya çalışılan uzlaşma çabaları dayetersiz gibi görünmektedir. Bu iki kavramın hukukû bağlamda ele alınmasıyla ortaya çıkangerçek; Müslüman toplumun çağın gerekliliği içinde Batı Dünyasıyla ilişki içinde olduğudur.Bunun sonucunda sekülerizm bu toplumun düşünce alanına müdahale etmiştir. Dinin ise bukonudaki tavrı nettir: İnsanoğlu bu dünyaya, sadece bu dünyada yaşamak için gelmemiştir."
