abstract: "Suça teşebbüs İslam hukukunda, cezası yasama organına bırakılan tazir tipi suçlardan kabul edilir. Dolayısıyla teşebbüsün niteliği, fâilin durumu, mağdurun karşı karşıya kaldığı zarar gibi çeşitli âmiller göz önünde bulundurularak yasama organı tarafından uygun müeyyideyle cezalandırılır. Çünkü suça teşebbüsün neticesinde ya korunan hukuki bir yararın tehlikeye atılması ya da ihlali söz konusudur. Suçun ya da zarar verici bir eylemin cezasız bırakılması veya bunları önleyici bazı tedbirlerin alınmaması suça meyli olan insanları suç işlemeye teşvik olur. Bu da, ictimai hikmetle bağdaşmaz. İslam hukukunda suça teşebbüsün bilinmediği ya da cezalandırılmadığı şeklinde bir takım iddialar söz konusudur. Bu çalışmada bir taraftan naslar, sahabe tatbikatı ve klasik İslam hukuk literatürü incelenerek suça teşebbüsle ilgili pratiklerin izleri sürülmeye çalışılırken, diğer taraftan bu iddiaların isabetli olup olmadığı araştırılmıştır. Ayrıca İslam hukuk müdevvenatındaki suça teşebbüsle ilgili tespit edilen örneklerden/uygulamalardan hareketle bir takım ilkeler belirlemeye ve bunlardan yola çıkarak da bir teşebbüs teorisi oluşturulmaya çalışılmıştır. Anahtar kelimeler: İslam ceza hukuku, suç, ceza, tazir, suça teşebbüs, hukûkî yarar"
titleTranslation: {"en": "Attempt to the crime in the Islamic Criminal Law"}
