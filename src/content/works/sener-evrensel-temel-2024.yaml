abstract: "Bu çalışma, Evrensel Temel Gelir (ETG) ve İslam ekonomisindeki zekât uygulamasını karşılaştırarak yoksulluk, işsizlik ve gelir adaletsizliği gibi konulara çözüm önerileri sunmayı amaçlamaktadır. Çalışmanın I. bölümünde, ETG uygulamasının kavramsal çerçevesi çizilmiş ve tarihsel süreçte gerçekleştirilen pilot uygulamaların etkileri ele alınmıştır. Bu bölümde, ETG'nin yoksulluk ve işsizlikle mücadele ve gelir adaletinin sağlanmasındaki rolü detaylı bir şekilde analiz edilmiştir. Ayrıca, ETG'nin pilot uygulamalarının etkileri ve COVID-19 pandemisi sonrasındaki tepkiler ele alınmıştır. Bunun yanı sıra, ETG uygulaması geleneksel sosyal yardım projeleri ile karşılaştırılmış, etkinlik ve verimlilik açısından Türkiye'de uygulanabilirliği üzerine tartışmalara yer verilmiştir. Çalışmanın II. bölümünde, işsizlik, yoksulluk ve gelir adaletsizliği kavramları detaylı bir şekilde tanımlanmıştır. Bu bölümde, bu sorunların ortaya çıkış sebepleri, ekonomik ve sosyal etkileri araştırılmış ve olası çözüm önerileri sunulmuştur. Ayrıca, gelir dağılımı türleri incelenmiş, dünya genelinde ve Türkiye'de iş gücüne katılım oranları ve yoksulluğun boyutları karşılaştırılmıştır. Türkiye'de uygulanmakta olan sosyal yardım uygulamalarının maliyeti ve etkinliği de tartışılmıştır. Çalışmanın III. bölümünde, zekât müessesesinin tarihsel kökenleri, uygulamaları ve ekonomi üzerindeki etkileri ele alınmıştır. Bu bölümde, zekâta tabi malların nisapları, zekât yükümlülüğünün şartları ve zekât toplama usulleri gibi konular ayrıntılı bir şekilde tartışılmıştır. Ayrıca, zekâtın diğer semavi dinlerdeki yeri de incelenmiştir. Devamında, ETG ve zekât uygulamasının yoksulluk, işsizlik ve gelir eşitsizliği üzerindeki etkileri ARDL (Autoregressive Distributed Lag) modeli kullanılarak test edilmiş ve bu etkiler kapsamlı bir şekilde analiz edilmiştir. Bu çalışmada, Evrensel Temel Gelir modeli ile zekât müessesesinin Türkiye örneğinde işsizlik ve yoksulluk üzerindeki etkileri karşılaştırmalı olarak ele alınmıştır. 2000-2024 dönemine ait veriler, ARDL eşbütünleşme yöntemi kullanılarak analiz edilmiştir. Analiz sonuçları hem ETG'nin hem de zekât uygulamasının işsizlik ve yoksulluğu azaltıcı etkilerinin olduğunu ortaya koymaktadır. Çalışmada, Türkiye İstatistik Kurumu'nun (TÜİK) 2023 yılına ait“Gelir ve Yaşam Koşulları Araştırması Mikro Veri Seti (Kesit) (GYKA)”kullanılarak gerekli hesaplamalar yapılmış ve ekonomik göstergeler üzerinden ETG ile zekât uygulamaları arasındaki etkileşimler incelenmiştir. Bulgular, her iki sistemin de işsizlik ve yoksulluğun azaltılmasına yönelik önemli katkılar sunduğunu göstermektedir. Çalışmanın bulguları, ETG ve zekât uygulamalarının etkin kullanımının, yoksulluğun azaltılması ve gelir adaletinin sağlanması açısından önemli politika araçları olabileceğini göstermektedir. Bu sonuçlar, akademik literatüre kayda değer bir katkı sağlamakta olup, ETG ve zekât uygulamalarının, yoksulluğun azaltılması ve gelir dağılımında adaletin tesis edilmesi hususlarındaki potansiyelini vurgulamaktadır."
