abstract: "Tam İlmihal Seadeti Ebediyye isimli kitap, Hüseyin Hilmi Işık tarafından, ilmihal mantığıyla hazırlanan, halka günlük İslami hayatında yardımcı olmayı amaçladığı bilgileri öğretmek düşüncesiyle tercüme edilmiş metinlerden oluştuğu ifade edilen bir eserdir. Eserin önemli bir kısmını İmam-ı Rabbani'ye ait mektupların tercümesi oluşturmaktadır. Ehlisünnete yapılan sık vurgu, tasavvufa ait konular, fıkıh ilminin gerekliliği, İngilizlerin kurduğu Vahhabiliğin sebep olduğu kötülükler ve mevzu hadis konusuna dair yapılan açıklamalar kitabın öne çıkan başlıca konularıdır. İlk basıldığı tarihten itibaren herkese ulaştırılması hedeflenen bu kitapta diğer ilmihallere nazaran daha fazla hadis-i şerifin yer alması ve mevzu rivayetlere dair ortaya koyduğu görüşler dikkat çekicidir. Ayrıca bir ilmihalde hangi konuların yer alması gerektiğine dair yaygın bakış açısının dışına çıkılmıştır. Hüseyin Hilmi Işık'ın kimyager olması sebebiyle fen konularının da halka öğretilmesi gereken temel İslami konuların ayrılmaz parçası olarak kabul edilmiştir. Tasavvuf konularının sık işlenmesiyle birlikte, çok ince meselelerin konu edildiğine de rastlamak mümkündür. Hüseyin Hilmi Işık'ın eserinde hadise-Sünnete bakışı diğer benzer eserlerden farklılık arz etmektedir. Hadis-Sünnet bilgisi, Hadis Usulü anlayışı, Mevzu rivayetlere yaklaşımı, hadisleri aktarırken kullandığı tabirler, metotları ve kitapta kullandığı hadisleri aldığı kaynaklar vs. temelde bir hadis eğitimi almamış olması, onun hadise yaklaşımında görülmektedir. Hadis alım kriterlerinden hadis adına kullandığı tabirlere kadar daha önceden alanda kullanılmayan ifadelere yer vermesi veya kendince tanım geliştirmesi fevkalade dikkat çekicidir. Bütün bu farklılıkların Hadis İlmi'nin metodolojisi çerçevesinde incelemeye çalıştık."
