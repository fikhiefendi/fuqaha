abstract: "Kassâm (Tereke) Defterleri bize Osmanlı'nın sosyal ve iktisadi tarihi açısından birinci derecede önemli veriler sunmaktadır. Özellikle, eş ve çocuk durumu ile ailenin ekonomik durumu, geçim kaynakları, ev ve mutfak kültürü, giyim ve kuşam kültürü vb. gibi pek çok alanda bilgiler elde edilmektedir. Osmanlı Tarihi Araştırmaları için önemli bilgiler içeren (Tereke) kayıtları şer'iyye sicilleri'nin içerisinde yer aldığı gibi bazen de müstakil defterler halinde tutulmuşlardır. Üsküdar Mahkemesi'ne ait olan 760 numaralı bu sicil de ayrı tutulan bir Kassâm Defteri'dir. Yapılan araştırma sonucunda Üsküdar Mahkemesi'ne ait olan 760 numaralı bu Kassâm Defteri h. 1316-1317 (m.1899-1900) tarihinde kaleme alınmıştır. Aynı tarihli yine Üsküdar Mahkemesi'ne ait 761 numaralı Şer'iyye Sicilide mevcuttur. İncelediğimiz iki defterden anlaşıldığı üzere bu Kassâm Defteri 761 numaralı defterin bir Ek'i ve ilavesi niteliğinde diyebiliriz. Defterimiz 761 numaralı sicilden farklı olarak sadece tereke kayıtlarını içermektedir. 1899-1900 yıllarında Üsküdar'da yaşayan şahısların miras kayıtları, terekeden yapılan zorunlu harcamaları ve devletin aldığı (kısmetler) vergiler bize dönemin ekonomisi hakkında önemli bilgiler vermektedir. Miras bırakılan eşya dökümlerinden ise şahısların sosyo-kültürel yaşantılarına dair önemli ipuçları elde edilmektedir."
