abstract: "İslâm kültüründe geçmişten bugüne, önemli bir yere sahip olan vakıflara ait mal varlıkları, zaman içerisinde çeşitli nedenlerle kullanım dışı kalabilir. Bu varlıkların tekrar kullanılabilir olması adına geliştirilebilecek çözüm şekillerinden en önemlisi, söz konusu malların kullanım amacında, kullanıldıkları yerlerde, onlardan istifade eden kimseler üzerinde veya malın kendisinde yapılacak değişikliklerdir. Vakıf hukukunun klasik döneminde öne çıkan mezheplerin fıkıh ve fetva kaynaklarının yanında konuyla ilgili modern çalışmaların taranması suretiyle gerçekleştirilen bu çalışmada adı geçen değişiklikler, tağyîr ve istibdâl başlıkları altında ele alınmıştır. Malın vakıf özelliği muhafaza edilmek kaydıyla, aynında ve tahsis amaçlarında gerçekleşen her türlü değişiklik tağyîr kapsamında incelenirken; istibdâl, malın bizatihi aslının değişime konu edilmesi yönüyle diğer değişim şekillerinden ayrılmaktadır. Bu değişim vakıf mal, satış ve alım ya da takas suretiyle başka bir mala dönüştürülerek gerçekleşmektedir. Konuyla ilgili vakıf malın menkul – gayri menkul, hayrât – müstegallât ya da mescit vakfı olup olmamasına bağlı olarak çeşitlenen farklı görüşler ve delilleri üzerinde gerçekleştirilen değerlendirmeler neticesinde, vakıflarda değişikliğe karşı çıkmanın doğru bir yaklaşım olmayacağı anlaşılmaktadır. Vakıf, bir taraftan özündeki değişmezlik özelliğini muhafaza ederken, diğer taraftan ihtiyaç duyulan değişiklikler ile mevcut şartlara uygun hale getirilmelidir. Vakıf kurumlarının geleneksel hizmet ve bunun için gelir elde etme anlayışı, günün ihtiyaç, imkân ve araçlarına göre yeniden yorumlanmalıdır. Ancak vakıf mallarının korunması ve değerlendirilmesi adına gerçekleştirilen bu değişikliklerde; vâkıfa ait amaç ve araçların olabildiğince korunması önemlidir. Bu kapsamda özellikle vakıf lehtarı olan kimseler adına faydanın esas alınması gerekmektedir. Aynı zamanda birtakım kötü niyetli devlet ve hukuk adamlarının suistimallerine mani olarak, vakıfları korumak için de gerekli tedbirler alınmalıdır. Anahtar kelimeler: Vakıf, Tağyîr, İstibdâl, İbdâl, Tebdîl"
