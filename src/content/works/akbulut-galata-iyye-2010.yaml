abstract: "Osmanlı tarihini inceleyenler için Şer`iyye Sicilleri vazgeçilmez kaynaklardır. Şer`iyye sicilleri, incelenen şehre dair idarî yapı, mahalleler, köyler, ictimâî durum, ticarî vaziyet, faal olan esnaf, o gün kullanılan eşyalar, evler, dinî hayat gibi pek çok konuda bize ipuçları vermektedir. Bu kadar geniş sahalarda bizlere malzeme sunan kadı sicilleri incelenmeden Osmanlı Devleti'nin tarihini yazmak mümkün değildir.Biz de Osmanlı İstanbul'unda ticârî yönden önem arzeden ve bünyesinde çok farklı dinî ve etnik grupları barındıran Galata'nın 1203/1788-89 senelerine ait 494 No'lu Şer`iyye Sicilini inceledik.Araştırmamız, girişle berabe beş bölüm ve eklerden oluşmaktadır. Giriş bölümünde Şer'iyye Sicilleri ve Galata'nın tarihine kısaca değinilmiştir.Birinci bölümde, Galata ve tabi yerlerdeki idari durum, mahkeme görevlileri ve defterdeki taksime göre Galata'ya bağlı nahiyeler, kasabalar, köyler ve mahalleler incelenmiştir.İkinci bölümde, Galata'nın o günkü sosyal yapısı ele alınmış, toplum hayatı, gayr-i Müslimlerin durumu, işlenen suçlar, şehir yapısı ve aile hayatı incelenmeye çalışılmıştır.Üçüncü bölümde, Galata'nın ekonomik durumu, tüccar ve ticarî faaliyetler, esnaf ve lonca yapısı araştırılmıştır.Son bölümde is, Galata'da dinî hayat üzerinde durulmuştur. Galata'daki dinî yapılar, din görevlileri, vakıflar, eğitim kurumları ele alınmıştır."
