abstract: "İbn Teymiyye hem yaşadığı zaman itibari ile hem de yaşadığı yer itibari ile önemli bir konuma sahiptir. O'nun zamanına kadar İslâmî ilimlerin hepsi oluşmuş ve gelişimini tamamlamıştır. Kendisi de bu ilimleri tahsil etmiş ve bu ilimlerden istifade etmiştir. Bundan dolayı O'nun İslâm düşüncesinin gelişmesinde çok katkısı olduğu düşünülmektedir. Eserlerinde hiç çekinmeden doğru bildiği bilgiyi yazıp savunması ve verdiği fetvalarda kullandığı ağır uslübü onun hem lehine hem aleyhine konuşulmasına hatta kitaplar yazılmasına sebep olmuş, bazı gruplar onu fikirlerine dayanak olarak göstermişlerdir. Günümüzde İbn Teymiyye'yi fikirlerine dayanak göstererek tasavvufu şirkten ibaret bir ekol olduğunu söyleyenler vardır. Bu çalışmamızda İbn Teymiyye'nin Mecmûu fetâvâ eserinde tasavvuf ehline yönelttiği tenkitleri inceleyerek bu grubun İbn Teymiyye'yi kendilerine dayanak göstermelerinin tutarlı olup olmadığını tespit etmeye çalıştık. Bu tezimizin bir diğer amacı da tasavvufa yöneltilen eleştirilerin tasavvufun kendisinden mi yoksa tasavvuf ehli arasına karışmış olan farklı niyetli kimselerden vb. durumlardan mı kaynaklandığını tespit etmektir. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde kısaca tasavvufun oluşumu ve gelişiminden bahsettik. Ardından kısaca İbn Teymiyye'nin hayatını aktardık. İkinci bölümde İbn Teymiyye'nin Mecmûu fetâvâ eserinde tasavvuf ehline yönelttiği eleştirilerden birbirine içerik olarak yakın olanları tek başlık altına alarak inceledik. Her konunun sonunda“Değerlendirme”başlığı altında o konuya ait elde ettiğimiz neticeyi aktardık. Sonuç kısmında ise tasavvufu inkâr edenlerin İbn Teymiyye'yi dayanak göstermelerinin tutarlı olup olmadığı ve tasavvufa yöneltilen eleştirilerin asıl kaynağı hakkında araştırmamızın neticesini ifade etmeye çalıştık."
