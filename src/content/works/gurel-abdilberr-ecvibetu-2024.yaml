abstract: "İbn Abdilber, hiç şüphesiz Endülüs medeniyetinin yetiştirdiği önemli simalardan birisidir. Çok yönlü ilmî şahsiyeti ve muhaddis-fakih vasfıyla öne çıkan İbn Abdilber, elde ettiği müktesebat gereği hadisten fıkha, tarihten kıraate, edebiyattan ahlaka pek çok alanda eser vermiş, bir asra yakın ömründe ortaya koyduklarıyla hicrî V. asrın“İbn Abdilber asrı”olarak anılmasını sağlamıştır. Onun, el-Ecvibetü'l-müstev'abe ani'l-mesâili'l-müstağrabe adlı eseri, fıkhu'l-hadîs, müşkilü'l-hadîs ve garîbü'l-hadîs birlikteliğinin mücessem örneklerinden bir tanesi konumundadır. Bu eserde İbn Abdilber, Endülüslü Mâlikî âlim Mühelleb b. Ebî Sufra'nın Sahîh-i Buhârî'de mânası zor anlaşılan ve müşkilat arz eden yirmi iki hadis hakkında kendisine yönelttiği sorulara cevaplar vermiş ve bu hadisleri şerh etmek sûretiyle kapalılıkları gidermiştir."
