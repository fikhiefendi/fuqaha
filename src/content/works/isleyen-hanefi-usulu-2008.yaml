abstract: "Hanefî Usûlcüler de Kur'ân'ı fıkhî açıdan ele almış ve ayetlerden bu yönde hükümler çıkarmışlardır. Tarihî bilgiler ışığında, lafız-mana ve Kur'ân bütünlüğü çerçevesinde yorumlanması gereken ayetler, Hanefîler tarafından, örneğin şer'î delilleri (Kitap, Sünnet, İcma, Kıyas v.b.) temellendirirken, genellikle ayetlerin sebeb-i nüzûlünü ve lafız-mana bütünlüğünü gözetmeden ve sadece lafzı esas alarak yorumlanmıştır. Kur'ân'dan meşruiyet arama çabası, Re'y'ci ekol'ün kendine has özelliği, `Hanefiyye Metodu' gibi nedenler sonuç olarak Kur'ân'ın adeta bir fıkıh kitabı gibi değerlendirilmesine ve lafzın öncelenmesine sebebiyet vermiştir."
