abstract: "Bu tez, yenilikçi bir İslami finans modeli olan“Mahr Bank”ı tanıtarak, Kur'ânî bir evlilik yükümlülüğü olan mehir kavramını, etik servet oluşturma amacıyla yapılandırılmış bir finansal araca dönüştürmeyi hedeflemektedir. Şeriat ilkelerine dayanan bu model, tamamen dijital ve banka dışı bir finans kurumu olarak tasarlanmış olup, mehirin sukuk, vekâlet (wakalah) ve mudaraba gibi katılımcı ve varlık temelli yatırım araçları aracılığıyla değerlendirilmesini öngörmektedir. Çalışmada mehirin ekonomik, hukuki ve manevi boyutları incelenmekte; cinsiyet kapsayıcılığı açısından İslami finansta mevcut boşluklar belirlenmekte ve Mahr Bank modelinin Türkiye ve diğer İİT (İslam İşbirliği Teşkilatı) ülkelerinde uygulanabilirliği değerlendirilmektedir. Araştırma, düzenleyici analizler, kurumsal tasarım ve karşılaştırmalı finans modellerinden yararlanarak, İslam etiği ile modern kalkınma hedeflerini uyumlu hale getiren ölçeklenebilir bir çerçeve sunmaktadır. Mahr Bank, Müslüman kadınları sadece finansal sistemlerin yararlanıcısı değil, aynı zamanda sürdürülebilir ekonomik dönüşümün etkin paydaşları olarak konumlandıran, değer temelli bir alternatif finans modeli ortaya koymaktadır."
