abstract: "Yapıldığı iddia edilen zina sebebiyle gerçekleşen liân, karısının zina ettiğini ve doğan ya da doğacak olan çocuğun zinadan olduğunu iddia eden bu duruma kendisinden başka şahidi olmayan kişinin, mahkeme huzurunda karısıyla yeminleşerek evliliğini sonlandırmasıdır.“İslâm Hukukunda Lian ve Hükümleri”adlı tezimiz üç bölüm ve sonuçtan meydana gelmektedir. Girişte evlilik birliğini sona erdiren durumlar kısaca anlatılmıştır. Birinci bölümünde liân'ın tanımı, fıkhî anlamı ve bu kelimeyle ilgili kavramlar verilmiştir. İkinci bölümde liân'ın hukukî dayanakları, sebebi ve liân'ın şartları incelenmiştir. Üçüncü bölümde ise liân'ın hukuki sonuçları ve liân'ın hükmünü ortadan kaldıran durumlar açıklanmıştır. Bu çalışmadan elde ettiğimiz neticeler sonuç bölümünde ifade edilmiştir."
