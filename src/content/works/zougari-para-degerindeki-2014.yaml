abstract: "Aile hukukunda taraflar arasında mali borç ilişkisi doğuran nişan, evlilik mehri ve nafaka ile ilgili hususlarda para değerindeki değer değişikliğinin bu borca etkilerini ele alan bu çalışma üç kısımdan oluşmaktadır. Giriş kısmı, para kavramını ve İslam devletlerinde paranın tarihini irdelemektedir. Birinci bölümde, paranın değer değişikliği bağlamında söz konusu olan durumları, bu durumların, altın, gümüş ve diğer metallerden üretilen paralar ile kâğıt paraların üzerindeki etkileri incelenmiştir. Bu bölümde ayrıca konuyla ilgili kadim fukaha ile muasır İslam hukukçularının görüşleri, bunlar içinde tercihe şayan olanlar da ele alınmıştır. İkinci bölümde ise, bu konunun bir uygulama alanı olarak, paradaki değer değişikliğinin nişan hediyeleri, mehir ve nafaka üzerindeki etkileri ele alınmıştır."
