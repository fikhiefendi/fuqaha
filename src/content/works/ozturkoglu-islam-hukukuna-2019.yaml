abstract: "Nikâh, evlenme ehliyetine sahip olan ve evlenmelerinde dinî veya sosyal yönden herhangi bir engel bulunmayan bir kadınla bir erkeğin, şahitler huzurunda karşılıklı rızalarını açıklamalarından ibaret olan bir sözleşmedir. Bu sözleşmeyle birlikte hem tarafları hem de toplumu ilgilendiren birtakım sonuçlar meydana gelir. İslâm hukukuna göre geçerli bir evliliğin meydana gelmesi ve nikâhın amacına uygun olarak birtakım sonuçlar meydana getirmesi için gerekli olan şartlar vardır. Bu şartların en önemlilerinden biri de nikâhın gizli olmamasıdır. İslâm hukukçuları nikâhın alenî olması konusunda görüş birliğine varmışlardır. Ancak alenîliğin nasıl sağlanacağı, aleniyetin vasıtalarının neler olduğu ve hangi nikâhın gizli nikâh sayılacağı konuları tartışılmıştır. Gizli nikâhın tanımıyla ilgili meydana gelen görüş ayrılıkları, bu nikâhın sonuçlarını da etkilemiş ve gizli nikâhın sonuçlarıyla ilgili farklı değerlendirilmeler yapılmıştır. Tezimizde gizli nikâhın sebepleri ve sonuçlarıyla ilgili olarak İslâm hukukçuları arasındaki görüş ayrılıklarına yer verilmiş ve günümüz şartları da göz önünde bulundurularak, tarafların gizli nikâh yapmaktaki amaçları ve bunun sakıncaları ortaya konmaya çalışılmıştır."
