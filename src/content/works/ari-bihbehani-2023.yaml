abstract: "Bihbehânî döneminde akıl delili hakkında yapılan değerlendirmeleri konu edindiğimiz bu çalışmada söz konusu dönemde akıl delilinin temellendirilmesi, mahiyeti ve muhtevasındaki dönüşümler, bu delile bağlı olarak kullanılan aklî ilkelerin tahlil edilmesi amaçlanmıştır. Sağlıklı bir değerlendirme yapılabilmesi amacıyla öncelikle Bihbehânî'nin (v. 1205/1791) hayatı ve ilmî şahsiyetinin yanı sıra bu dönem öncesinde Ca'feriyye mezhebinde akıl delili etrafında yapılan değerlendirmelere yer verilmiştir. Bu kapsamda akıl delilinden dördüncü delil olarak bahseden ilk fakihin İbn İdrîs (v. 598/1202) olduğu; eserinde bu delile sıkça atıfta bulunduğu; daha sonraki süreçte Muhakkık el-Hillî (v. 676/1277) ve Şehîd-i Evvel'in (v. 786/1384) akıl delilinin kısımlarına değindikleri ve hüküm istinbatında kullanılan bazı ilke ve yöntemleri bu delilin altında mütalaa ettikleri; Fâzıl et-Tûnî'nin (v. 1071/1660) de geniş bir şekilde aklî delilleri usul eserinde ele alan ilk usulcü olduğu tespit edilmiştir. Çalışmamızın ana konusu olarak belirlediğimiz Bihbehânî döneminde akıl delili konusunda ulaştığımız sonuçlar kısaca şöyledir: Akıl delili Ca'ferî usulünde ilk defa bu dönemin usulcülerinden Mirzâ el-Kummî (v. 1231/1815) tarafından tarif edilmiştir. Bu dönemin hemen bütün usulcüleri akıl delilini, hüsün ve kubhun aklîliği temelinde ele almışlar ve aklın hüsün ve kubuh önermeleri vasıtasıyla şer'î hükme ulaşabileceğini teorik zeminde savunmuşlardır. Bu tezlerini, mülâzemet adını verdikleri ve aklın ulaştığı hükmün aynı zamanda Şâri'in de hükmü olduğu teziyle desteklemeye çalışmışlardır. İncelediğimiz dönemde kesin hükme ulaşılamadığında uygulanması gereken birtakım ilkeler de akıl delili kapsamında ele alınmıştır. İstishâb, berâet-i asliyye ve ibâha-i asliyye bu dönemdeki usulcülerin en fazla üzerinde durduğu ilkelerdir. Daha sonra bu ilkeler \"usûl-i ameliyye\" adıyla terimleşecektir."
