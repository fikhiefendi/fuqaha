abstract: "Maliki Mezhebi kuruluş tarihi Tabi unler döneminde denk gelmektedir. Dolayısıyla , Maliki Mezhebi diğer mezhepler gibi 5 dönem içerisinde tamamen mezhep oldu.Bununla birlikte, Maliki Mezhebi ilk ya da erken dönemlerde Teşekkül dönemi katkı sağlayabiliriz, bu dönem, Maliki Mezhebinin usullerinin kurucusu olan ve kendisinden sonra gelen öğrencilerine ilmi bir miras bırakan mezhebin kurucusu Malik b. Enes tarafından konulma dönemini ifade etmektedir.Gelişme dönemi ise, bu dönem, furu meselelerinin usullerine dayandırdığı ve meseleler hakkında hükümlerin mezhebin metotların çerçevesinde istinbat edildiği süreci ifade etmektedir. Uygulama dönemi ise de , bu dönem, bir önceki dönemde oluşmuş olan meselelerin gözden geçirildiği ve yeni meselelerde makasıda uygun ictihatlarda bunulduğu bir dönemdir. Gözden geçirme ve eleştiri dönemi , bu dönem, mezhep için görüşlerin değerlendirildiği rivayet ve diyaret açısından güçlü olan dellilerin itibar edildiği bir dönemdir. Toplam ve kısaltma dönemi ise de , bu dönem, Maliki mezhebi yukarıda zikredilen dönemler bitip istikrar bulduktan sonra oluşmuştur. İslamiyet'in Afrika'ya yayıldığı zaman, Hz peygamberimiz dönemine denk gelmektedir. Ancak Hebeşistan'a gelen Kureyşler Mekkeden kaçarak Afrika'ya geldikleri, islam girdiği tarihi denilebilir.Buna ilavet , Sahabeler döneminde özellikle Ukbe b. Nafi fethettiği Mısır, Emevilerin tarafından Sudan fethedildi.1. yüzyıln ikinci Necmettin Erbakan Üniversitesi Sosyal Bilimler Enstitüsü yarısından itibaren islam Afrika'ya girdiği tarihtir. Fildişi Sahilinde, islamiyet'in hicri V. Ve miladi XI. Yüzyılda Murabılar dönemine hatta tüm Batı Afrika ülkeleri denk gelmektedir. Afrika'nın Kuzey Bölgesinde ise, islam, hicri VII. Ve miladi XII yüzyılda denk gelmektedir. Dolayısıyla, Maliki mezhebinin Fildişi Sahiline girdiği sebeplerden biri bunlar söyleyebiliriz:1- Murabıtlar : miladi 1076 yılında Batı Afrika'yı açarak savaş yolunda olsun davet olsun ama bu hakkatan Batı Afrika'da çoğu insanlar bunların sayesinden müslüman oldular. 2- Hacıların rölü: bu haciler, medinede çok kaldıklarından dolayı, Maliki mezhebine itaat etmişler.3- Siyasi alanda ise, Samori Toure'nin , Alfa bah , Kanku Musa, , Şeh Ahmadu Lobbo, Haci Ömer et-tekruri, Şeh Usman Fode'nin faaliyetleri vardır. Bu büyük adamalrın çoğunu islam ve Maliki mezhebi için kurtardılar.4- Tasvvufun tüm dalları olamk üzere, Ticaniler, Kadiriler, İdrisiler ve Sanusiler. Fildişi Sahili'nin müslümanların sayisi %54 , diğerler hiristiyanalr. Maliki mezhebi %90 , Hanbeli ise %8 , Şiiler ise de %2 nufusu vardır."
