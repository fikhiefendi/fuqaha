abstract: "Çalışmamızın amacı Kur'ân-ı Kerim'de talâk âyetlerini mealler ve tefsirler üzerinden incelemek, tartışmalı konular ve günümüz uygulamalarının varsa dayanaklarını tesbit etmektir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Girişte yöntem ve kavramsal çerçeve üzerinde durduk. Birinci bölümde İslam toplumunda hayati bir öneme sahip olan evlilik müessesesine verilen önemden bahsettik Yine burada insan hayatında evliliğin esas, boşanmanın ise haksızlıkları gidermede son çare olduğunu göstermesi bakımından ailede oluşan geçimsizlik halinin iyileştirilmesine yönelik Kur'ân'ın ortaya koyduğu tedbirleri inceledik. Bütün bu tedbirlere rağmen yürümeyen aile birlikteliğinin sona erme şekillerini işledik. İkinci bölümde Kur'ân-ı Kerim'de Talâk hükümleri kapsamına giren konular üzerinde durularak konunun daha iyi anlaşılması için öncelikle talâkın gerçekleşme şekilleri ve bunların geçerliliğinden bahsedildi. Karı, koca ve hâkimin boşama yetkisi hakkında bilgi verdik. Talâk çeşitlerine yer vererek Ric'î, Bâin, Sünnî ve Bid'î Talâk'ı işledik. Talâk'ın Hukukî Sonuçları başlığı altında iddet, mehir, nafaka, süknâ ve müt'a konularında Talâk'ın doğurduğu hukuki sonuçları ele aldık. Bu bölümün son kısmında şekil olarak talâka benzemeyen, ancak sonuç itibariyle talâk gibi değerlendirilen zıhâr, îlâ ve liân konularını açıklamaya çalıştık. Üçüncü bölümde ise özellikle günümüzde tartışmaların odağında yer alan talâk konusu ile ilgili meselelerin Kur'ân-ı Kerim'den delillerle açıklanmasına, yanlış ve Kur'ânî olmayan uygulamaların tespit edilmesine ve soru işaretlerinin giderilmesine çalıştık. Bu bölümde boşama yetkisinin devri, tahkim müessesesi, dövme âyeti, boşanmadan sonra nafaka mükellefiyeti ve boşanmalarda şahit tutulması konularına değindik. Çalışmamızda elde ettiğimiz sonuçlara Sonuç kısmında yer verdik."
