abstract: "İki bölümden oluşan çalışmamızda, birinci bölümü dört büyük mezhep imâmının yaşadıkları dönem aralığı olmak üzere, Emevîler ve Abbâsîler dönemi oluşturmaktadır. Bu bölümde dört büyük imâmın yetiştiği ortamın siyâsal, kültürel ve sosyal yapısı ele alınmıştır. İkinci bölümde ise, araştırmamızın omurgasını oluşturan mezhep imâmlarının siyâsî otoriteyle ilişkisi anlatılmaktadır. Yaşadıkları dönemde birçok siyâsî olaya şahit olan mezhep imâmlarının olaylar karşısında nasıl bir tavır sergiledikleri, halîfelerle ilişkileri ve genel anlamda siyâsî duruşları ele alınmıştır."
