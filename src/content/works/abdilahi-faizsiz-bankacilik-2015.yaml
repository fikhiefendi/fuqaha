abstract: "Bu çalışmanın amacı dünyada faizsiz bankacılığın gelişimi ve gelişmekte olan İslam Ülkelerinde fon kaynağı olarak Sukuk'un yeri ve önemi ile ilgili fikir vermektir. Kapsamlı bir kaynak incelemesinin ardından Sukuk ihracının İslam Ülkelerindeki fon sağlama problemlerini azaltmada önemli bir rol oynayabileceği görülmüştür. Yapılan araştırmalar, fon sağlama probleminin pek çok İslam Ülkesi için geçerli ve önde gelen unsurların başında geldiği ortaya konmuştur. Bununla birlikte sonuçlar, Sukuk'un pek çok İslam Ülkesinde fon sağlama boşluğunu doldurabilecek uygun bir alternatif olabileceğini göstermektedir. Anahtar Söcükler: Faizsiz Bankacılık, Sukuk ve Sukuk ihracı, Fon kaynakları"
