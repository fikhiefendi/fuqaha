abstract: "İslam ekonomisi ve finansı kavramı Müslümanların ticari faaliyetlerini ve işlemlerini İslam'ın emrettiği kurallara göre yapmak istemeleri sebebiyle ortaya çıkmış ve hayatın farklı alanlarında uygulanmaya başlanmıştır. 1970'li yıllarda faaliyetlerine başlayan İslami finans sektörü özellikle son 20 yılda önemli bir büyüme kayderek hem Türkiye'de hem de dünya finans piyasalarında etkisini ve bilinirliğini artırmıştır. Bu büyüme trendinin devam ettirilebilmesi için en önemli husus, sunulan ürün ve hizmetlerin çeşitliliğinin ve niteliğinin artırılmasıdır. Buna karşılık sektörde murabahanın yoğunlukla başvurulan yöntem olduğu görülmektedir. Bunun en büyük sebebi murabahanın daha az riskli olarak değerlendirilmesidir. Bu çalışma kapsamında selem kredisi fikhi ve iktisadi boyutları ile ele alınmış ve selemin Türkiye'de faaliyet gösteren İslami finans kuruluşları tarafından uygulanabilmesi için model önerileri yapılmıştır. Selem akdine konu olan malların en en klasik olanı tarım ürünleri olmakla beraber İslam hukukçuları selemin standart niteliklere sahip tüm mallar için bir finansman yöntemi olarak kullanılabileceği konusunda ittifak etmişlerdir. Katılım Bankacılığında selem kredisinin, etkin ve doğru bir şekilde uygulanabildiği takdirde mevcut kaynakların üretime aktarılmasında önemli bir rol oynayacağı değerlendirilmektedir. Aynı zamanda selemin katılım bankacılığında KOBİ'lerin finansmanında yaygın olarak kullanılan bir yöntem haline getirilmesinin üretim temelli bir ekonomik büyüme ortamına katkı sağlayabileceği sonucuna varılmıştır."
