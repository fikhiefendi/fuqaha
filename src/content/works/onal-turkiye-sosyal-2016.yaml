abstract: "İslâm'ın İktisat anlayışının ve bunun sosyal politikayla olan ilişkisinin incelendiği bu çalışmada, İslam'ın temel esaslarının hayatın tüm alanlarını şekillendirdiği gibi iktisadı da şekillendirmiştir. İslâm inancının esası olan 'tevhid' ilkesinin bir gereği olduğundan dolayı bir inceleme yapılmıştır. İktisat, İslam'da var olan kül-cüz ilişkisi ve tevhid ilkesinin bir gereği olarak ancak İslâm içerisinde incelenebilir. İslâm, hayatın tamamını kuşatma iddiasıyla“kül”yani bütünü ifade ederken iktisat bunun içerisinde sadece bir unsur olarak“cüz”yani parça şeklinde var olabilir. İktisat, İslâm'ın içerisinde ve İslâm'ın biçimlendirdiği bir alandır. İslâm hayatın tüm yönlerini kuşattığı gibi iktisadı da kuşatmakta ve ona biçim vermektedir. İslâm'ın öngördüğü formun dışındaki hiçbir iktisadi anlayış İslam'a uygun değildir ve dolayısıyla İslam'da İktisat içerisinde değerlendirilemez. Çalışmada, İslam'da İktisat anlayışının tevhid ilkesinin bir gereği olarak kavramsal karşılığı da“İslam İktisadı”veya“İslami İktisat”değil, İslam'da İktisat şeklinde tanımlanmıştır. Bunun bütün-parça ilişkisini daha iyi yansıttığı iddiasına yer verilmiştir. Aynı şekilde bu ilişkinin bir gereği olarak İslam'da İktisadın sosyal politikaya bakan yönleri ele alınmıştır. Sosyal politika da genel anlamda İslam'da İktisat içerisinde değerlendirilmiş ve Türkiye'deki hem düşünsel hem de uygulama yönlü gelişimi İslam'da İktisadı yansıtan yönleri itibariyle ön plana çıkarılmıştır. Bu anlamda sosyal politikaya bakan boyutun düşünsel olarak Sabahattin Zaim ismini ön plana çıkardığını söylemek mümkündür. Bunun yanında uygulama yönüyle de 'resmi' bir karşılığı olan hukuksal düzenlemelere dayanmamasına karşın de facto var olagelmiş zekat, sadaka, kurban gibi birçok boyut ele alınmıştır."
