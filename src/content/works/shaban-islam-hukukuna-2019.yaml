abstract: "Kripto Para Birimi ve ilk örneği olan Bitcoin, teknolojinin finans ile birleşmesi ile geleneksel ödeme sistemlerine alternatif olarak ortaya çıkan, kişiler arası merkezi olmayan ve altyapısı Blockchain sistemine dayanan elektronik para sistemidir. Bitcoin kullanıcılarına işlemlerinde hızlı transfer ve düşük maliyet avantajları sunmaktadır. Bununla birlikte merkezi olmayan yapısı, yasalara ve düzenlemelere tabi olmaması, kullanıcıların anonim olarak hesaplarını açabilmeleri ve işlem yapabilmeleri, değerindeki aşırı oynaklık, illegal işlerin finansmanında kullanılması ve siber saldırılara açık olması gibi riskleri içinde barındırmaktadır. Bitcoin, geleneksel para sisteminden farklı olarak merkezsiz olduğu ve farklı avantaj ve riskler barındırdığı için iktisatçıların ve İslâm hukukçularının tartışmalarının odak noktası haline gelmiştir. Bu minvalde iktisatçıların Bitcoin hakkındaki görüşleri dikkate alınarak İslâm hukukçularının konu ile ilgili yaklaşımları irdelenmiş ve Bitcoin'in İslâm hukukuna göre para olma keyfiyeti farklı açılardan değerlendirilmiştir. Müslümanların on dört asırlık ilmi birikimi, yeni ortaya çıkan para çeşitleri konusundaki modern tartışmalara önemli katkı sunmaktadır. İslâm hukukçularının Bitcoin hakkında olumsuz ve olumlu yaklaşımın yanında Bitcoin hakkında temkinli davranılmasının daha uygun olduğu yaklaşımı da mevcuttur. Olumsuz yaklaşıma sahip olanlar, Bitcoin'in para olmadığı gibi mal olma şartlarını da yerine getirmediğini savunmaktadır. Olumlu yaklaşıma sahip olanların bazılarına göre Bitcoin dijital bir değerdir, diğerlerine göre ise paradır. Bitcoin'in bir dijital değer ifade ettiği, fakat şimdilik paranın fonksiyonlarını icra etmediği bilgisi öne çıkmaktadır. Bununla birlikte Bitcoin sisteminin barındırdığı risklerin bir sonucu olarak kullanıcıların servetinin haksız kazanç veya kayıp ile sonuçlanabileceği için sistemin sunacağı artılar hakkında araştırma yapılması uygun görülmüş, fakat işlem yapma konusunda temkinli davranılmasının en uygun tavır olduğu sonucuna varılmıştır."
