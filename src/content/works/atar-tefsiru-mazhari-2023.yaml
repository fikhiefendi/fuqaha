abstract: "Bu çalışma Bakara ve Nisâ sûrelerindeki ahkâm âyetleri ile sınırlıdır. Ahkâm âyetleri denince amelî hükümlerin kaynağı anlaşılmaktadır. Amelî hükümleri içeren âyetlerin tefsirine Ahkâmu'l-Kur'ân tefsiri denmektedir. Ahkâmu'l-Kur'ân kendi içerisinde ibâdât, muâmelât, münâkehât ve ukûbât şeklinde alt dallara ayrılmaktadır. Bu başlıklar altında insanın dünyevî ve uhrevî huzurunu tesis için getirilmiş emir ve yasaklar ele alınmaktadır. Dünya ve ahiret mutluluğuna erişebilmek için yerine getirdiğimiz bu hükümler hakkında erken dönemden itibaren çeşitli yorumlar yapılmıştır. Farklı asırlarda yaşamış müfessirlerin yaptığı bu yorumlar önem arz etmektedir. Biz de bu çalışmamızda Senâullah Pânîpetî'nin et-Tefsîru'l-Mazharî adlı eserinin fıkhî yönünü inceledik. et-Tefsîru'l-Mazharî'yi incelerken farklı mezhebe mensup ve farklı dönemlerde yaşamış önde gelen müfessirlerin eserlerinden söz konusu hükümleri mukâyese ederek benzerlik ve farklılıklarını araştırdık. Eserleriyle muhatap olacağımız müfessirlerimiz İmâm-ı Şâfiî, İmâm-ı Cessâs, İmâm-ı Kurtubî ve İmâm-ı Sâbûnî'dir."
