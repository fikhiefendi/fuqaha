abstract: "Toplumsal yaşamda hızlı ve sürekli bir değişimin varlığı beraberinde bazı problemleri getirir. İşte bu problemlerin çözülüp adaletin ve asayişin sağlanabilmesi için hukukun da bu nispette dinamik olması gerekir. Ne var ki hukukta her olayın önceden öngörülüp ona göre hukuk kuralının oluşturulabilmesinin imkânı yoktur. Bu sebeple hukuk sistemlerinde boşluk dediğimiz bir takım durumlar karşımıza çıkar. Hukukta oluşan boşluğun bir şekilde doldurulup uyuşmazlıkların sona erdirilmesi gerekir. Bu görev de yargılama faaliyetini yapan hâkimdedir. Türk Hukukunda hâkimin boşluk doldurması bir takım şartlara ve durumlara bağlı kılınmıştır. Hem kanunda hem de örf ve adet hukuku kuralları arasında söz konusu uyuşmazlığa uygulanacak bir kuralın bulunamaması durumunda hâkim bir kanun koyucu gibi davranarak o uyuşmazlığı sonuçlandırır. İslam hukukunda müçtehidin ilk aşamada asli kaynaklara müracaat etmesi beklenir. Dolayısıyla Kur'an ve Sünnet'ten doğrudan uygulayabileceği bir kural bulamayan müçtehidin yine asli ve tali kaynaklara dayanmak suretiyle içtihat ederek uygulanabilir bir hüküm ortaya koyması gerekir. Müçtehidin yaptığı bu faaliyet hukukta olan boşluğun doldurulması çabasıdır. Çalışmamız temelde üç bölümden oluşmaktadır. İlk bölümde Türk hukukunda hukuki boşluk durumunda hâkimin bu boşluğu doldurması anlatılmıştır. Boşluk kavramı, örf ve adet hukuku ile kuralı, hâkimin yargısal faaliyetleri ve oluşturulan hukuk kurallarının özellikleri açıklanmıştır. İkinci bölümde ise İslam Hukuku perspektifinden hukuki boşluk içtihat kavramı üzerinden anlatılmaya çalışılmıştır. Burada içtihat araçları üzerinde durulmuştur. Nihayet üçüncü bölümde ilk iki bölümde anlatılanlar metodolojik olarak karşılaştırılmıştır."
