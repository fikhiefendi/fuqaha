abstract: "Bu araştırma, geçmişten günümüze kadar, kanuni düzenlemelerin yapıldığı en önemli suçlardan olan hırsızlık suçunu ele almaktadır. Zira bu suç, insanların, sahibi olmadıkları, başkalarına ait olan ve kendilerine haram kılınan mallara bir saldırı teşkil etmektedir. Bu araştırma çerçevesinde, Kur'an ayetlerinin bu suç hakkında öngördüğü, sert ve tavizsiz cezaların var olduğu ortaya çıkmıştır. Yine bu çalışmada, bahsi geçen hırsızlık suçunu ortadan kaldırma ve tehlikelerinden toplumu koruma; bu amaçla hırsızlık suçunu kanıtlamanın İslam fıkhında ve Irak hukukundaki kural ve yöntemleri araştırılmış, aralarındaki benzerlik ve farklılıklar ortaya konulmuştur. Araştırma bir giriş ve iki bölümden oluşmaktadır. Birinci bölümde; hırsızlığın İslam fıkhı ve Irak hukukunda nasıl tanımlandığı ve mahiyeti üzerinde durulmuştur. Zira her iki kanunda da hırsızlık suçunun mahiyeti, lügat ve ıstılah açılarından tanımlanmak suretiyle bilinmektedir. İkinci bölümde ise; ele alınan konu İslam fıkhı ve Irak hukukunda hırsızlığın kapsamı açısından ele alınmıştır. Yine bu bölümde, İslam fıkhı ve Irak hukukuna göre hırsızlık iddiasının ispat yöntemleri, hırsızlık suçunun cezası üzerinde başlıklar halinde durulmuştur. Çalışmamızdan ortaya çıkan başlıca önemli sonuçları şu şekilde özetlemek mümkündür: Şer'î olarak tanımlanan ve had cezası gerektiren hırsızlık suçunda, almanın gizli olması gerektiği şart koşulmuştur. Buna mukabil Irak kanunlarında ise malın zimmete geçirilmiş olması, mağdurun rızası olmaksızın gerçekleşmesi şart koşulmaktadır. İslam hukuna gore ise malın, korunan bir yerden alınmış olması gerekir. Her iki kanunun ittifak ettiği mesele ise, hırsızlığa konu olan şeyin mal hükmünde olması gerektiğidir. Araştırmada ulaştığımız diğer sonuçlara çalışmamızda detaylı olarak yer verilmiştir. Okuyucunun istediği bilgiye daha kolay ulaşmasını sağlamak amacıyla çalışmanın sonuna bilimsel indeksler eklenmiştir."
