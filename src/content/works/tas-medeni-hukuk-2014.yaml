abstract: "Osmanlı Devleti'nde hukuk iki kısımdan oluşuyordu. Kaynağını dinden alan şer'i hukuk ve kaynağını örf-adetten alan örfi hukuk. Osmanlı medeni hukuku da bu çerçevede kaynağını dinden alarak gelişti ve 20. yüzyıla kadar uygulandı. Değişen dünya şartlarına uyum sağlamak ve yeni ihtiyaçları karşılamak için 1850'li yıllarda medeni hukukun yenilenmesi amacıyla Mecelle denilen ve kaynağını fıkıhtan alan kanunlar hazırlandı. Fakat I. Dünya Savaşında ağır bir yenilgi alan Osmanlı Devleti siyasi açıdan olduğu gibi hukuki yönden de çökmek üzereydi. Çünkü Mecelle farklı dinlere mensup Osmanlı milletinin ihtiyaçlarını karşılayamıyordu.Milli Mücadelenin kazanılmasıyla dayandığı değerler açısından yeni, farklı bir devlet kuruldu ve bu devlet siyasi anlayışında ki değişiklikleri topluma ve hukuka da yansıtmaya başladı. Bu amaçla eskisinden tamamen farklı, Avrupa sistematiğine dayanan, laik, modern bir Medeni Kanun hazırlamak amacıyla komisyonlar kuruldu. Komisyonların yaptıkları çalışmalar sonucu İsviçre Medeni Kanunu bazı değişikliklerle tercüme edilerek, TBMM'de kabul edildi ve yeni Türk Medeni Kanunu olarak benimsendi.Yeni Türk Medeni Kanunu kabul edildikten sonra doğal olarak bazı tepkilerle ve eleştirilerle karşılaştı. Çünkü din-akıl anlayışına dayalı bir toplum laiklik-akıl anlayışına dayalı yeni kanunlarla karşı karşıyaydı."
