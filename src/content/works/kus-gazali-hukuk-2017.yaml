abstract: "Önde gelen İslam âlimlerinden Gazâlî, hayatı ile örnek bir şahsiyet olup, düşünceleri ile özgün bir duruş sergileyen önemli bir ilmi şahsiyettir. Gazâlî, Eş'arî kelamcısı, Şâfiî fakihi ve mutasavvıf olup, birçok alanda kendinden sonraki dönemlerde adından söz ettirmiştir. Ortaya koyduğu görüşler günümüzde de önemini halen korumakta, eserleri akademik çevrelerce değerlendirilmekte ve hakkında müstakil çalışmalar yapılmaya devam edilmektedir. Gazâlî, hocası Cüveynî'nin el-Burhân adlı eserinde ortaya koyduğu maslahat hakkındaki görüşlerini Şifâ'ul-Galîl, el-Menhûl ve el-Mustasfâ adlı eserlerinde daha da sistematik hale getirmiş, bu konuda kendinden sonraki usulcülere örnek teşkil etmiş ve İslam hukukunda maslahat yönteminin gelişmesine büyük katkılar sunmuştur. Çalışmamız Gazâlî'nin bu üç eserinde ele aldığı“maslahat”düşüncesini ortaya koymakla beraber diğer mezheplerinde görüşlerini dile getirerek, konunun ortaya çıkma ve gelişme süreçlerini tesbit etmeye yöneliktir."
