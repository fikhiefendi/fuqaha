abstract: "Ahmet Sinan KARA tarafından hazırlanan ?Osmanlı Devleti'nin Son Yüzyılında Müftülük: Müftülerin Eğitim, Tayin, Azil ve Sosyal Hayattaki Konumları? adlı bu tezde, genel olarak Osmanlı Devleti'nde yürütülen din hizmetlerinin yanısıra, özellikle devletin son döneminde, şeyhülislamlığa bağlı bir birim olarak görev yapan merkez ve taşra müftülerinin eğitim, tayin, azil, görev ve yetkileri ile sosyal konumları ele alınmış, mali ve sosyal durumları hakkında bilgiler verilmiştir. Arşiv belgelerine dayanarak yapılan bu çalışma ile önemli görev ve yetkiler üstlenmiş bulunan müftülerin Osmanlı'nın son yüzyılında devlet içerisindeki konumu ve durumu ortaya konulmaya çalışılmıştır."
