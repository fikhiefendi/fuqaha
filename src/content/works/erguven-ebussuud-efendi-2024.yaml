abstract: "Ebussuûd Efendi'nin“İrşâdü'l-ʿaḳli's-selîm ilâ mezâya'l-Kitâbi'l-Kerîm”adlı tefsirinde muâmelât ve ukūbât ile ilgili ayetleri çalıştığımız tez; giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde tezin konusu, amacı önemi, araştırma problemleri ve araştırmanın kaynakları hakkında bilgi verilmiştir. Birinci bölümde Ebussuûd Efendi'nin hayatı, eserleri ve İslam Hukuku'na hizmetleri anlatılmıştır. Tezin ana kısmını ikinci ve üçüncü bölüm oluşturmaktadır. İkinci bölümde muamelat kavramıyla ilgili bilgi verildikten sonra Ebussuûd'un muamelat ayetleriyle ilgili yorumu; meclis muhayyerliği, borçların yazılması, şahitlik, faiz ve hacr konu başlıkları altında ele alınmıştır. Üçüncü bölümde ise ceza (ukubât) kavramı ile ilgili açıklamalardan sonra müfessirin suçlar ve cezalara dair ayetlerle ilgili yorumları; öldürme ve kısas, kasten adam öldürme ve kısas, hatayla adam öldürme, zina, zina iftirası (kazf), hırsızlık, eşkıyalık suçu ve cezası (hırâbe), yemin-i lağv konuları çerçevesinde incelenmiştir. Bu konular incelenirken bu yaklaşımların değerini tesbit etmek için diğer tefsirlerden yararlanılmıştır. Değerlendirmede müfessirin tefsirinde muamelat ve ukubat ayetlerini yorumlarken ifrat ve tefrite girmediği, dil ve belagat tahlillerine yer verdiği, yer yer sebeb-i nuzüle değindiği, fıkhî yorumlara çok fazla girmediği görülmüştür."
