abstract: "Tüketilen gıdaların helal olup olmadığı Müslümanlar için büyük önem arz etmektedir. İlk dönemlerde tüketilen gıdaların daha yalın olması sebebiyle nehyedilen gıdalardan kaçınmak yeterliyken gıdaların raf ömrünün uzatılması, ucuz, fazla ve dayanıklı üretim yapılması için çeşitli katkı maddelerinin gıdalara eklenmesiyle birlikte haram ürün ve kaçınılması gerekenlerin tespiti zorlaşmıştır. Son yıllarda ihtiyaca binaen helal gıda pazarı oluşmuş ve insanların bu pazara ilgisi artmıştır. Üreticilerinin çoğunun gayrimüslim olması sebebiyle katkı maddelerinin bazıları hamr gibi Kur'an-ı Kerim'de açıkça yasaklanan ürünler içerebilmektedir. Kur'an-ı Kerim'de alkol ifadesi değil hamr kelimesi kullanılmaktadır. Pek çok İslam alîmi de aklı bedenden uzaklaştıran ve kullanıldığında sarhoşluk veren her türlü maddeyi hamra kıyas etmiştir. Geçmişte, günümüzdeki gibi bir kullanımı olmadığından fakihler alkolün içeriği ve çeşitleri üzerinde detaylı bir şekilde durmamışlardır. Bu sebeple birçok yorumda hamr, alkolle eşit sayılmıştır. Hamrın alkole eşit sayılması tüketilebilir ve tüketilemez tüm alkol bileşiklerini de haram kabul etmek anlamına gelmektedir. Halbuki hamr alkolün türlerinden sadece biridir. Bu noktada çalışmamız, genel anlamda alkol türlerinden bahsettikten sonra türlerinden biri olan etanol üzerinde durmaktadır. Etil alkolün kullanıldığı alanlar, doğası gereği etil alkollü ürünler ve sonradan eklenenlerden bahsettikten sonra fıkıhta hamrın ve etil alkolün değerlendirilmesi konu edinir. Ayrıca yaygın olarak tüketicinin helal olup olmadığını sorguladığı bazı gıdalar ve etil alkol içeren gıdaların helal belgelerindeki kıstasları değerlendirilmektedir."
