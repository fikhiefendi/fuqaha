abstract: "İslam hukuk ve ahlak ilkelelerinin kapsamında bulunan mahremiyetin temel unsurlarından birisi de örtünmedir. Esasen bütün dinlerde var olan örtünme konusu, İslam hukukunda da Kur'an-ı Kerim ve sünnet ışığında ele alınmış, içtihada açık olan yönleri İslam hukuk kaynaklarının genelde Kerahiye, Hazr ve İbaha bahislerinde incelenmiştir. Modern dünyada cinsiyet ve buna bağlı olarak kadın-erkek ilişkileri, kadının değeri ve toplumdaki konumunun gündemi oluşturma yoğunluğuna paralel olarak tartışılan temel konulardan birisi de örtünme konusu olmuştur. Özellikle 1980'li yıllarda örtünme bağlamındaki başörtüsü yasağı ile başlayan bu tartışmalar 1990 ve 2000'li yıllarda daha da yoğunlaşarak devam etmiştir. İşte biz bu tezimizde başörtüsü yasağı tartışmalarının en yoğun olduğu dönemi kapsaması sebebiyle 1998-2010 yılları arasında dini süreli yayınlarda örtünme konusunu ele alan makaleleri bir araya getirerek, değerlendirmeye çalıştık. Toplam 28 makalenin teze konu edildiği bu çalışmada örtünmenin geçmişten günümüze tanımı ve mahiyeti açıklanmıştır. İlahi dinlere göre örtünme kuralları ve şekilleri belirtilmiş, İslam'ın temel kaynakları olan tefsir, hadis ve İslam hukuku bağlamında örtünmenin değerlendirilmesi yapılmış ve dönem içerisinde var olan başörtüsü yasağını konu edinen makaleler ele alınmıştır."
