abstract: "İslam Hukukunda akitler konusu oldukça geniş yer tutmaktadır. Akitlerin tamamlanması aşamasında ise muhayyerlikler söz konusu olabilmektedir. Çalışmamızda öncelikle muhayyerliklere genel olarak değinilmiş olup, ardından da ayıp muhayyerliği ve vasıf muhayyerliği ayrıca incelenmiştir. Çalışmamızda bir giriş ve iki bölüm bulunmaktadır. Giriş bölümünde araştırmanın genel olarak konusuna, konumuna, önemine ve amacına değinilmiş olup son olarak da kaynaklarına yer verilmiştir. Birinci bölümde genel olarak muhayyerlik kavramına değinilmiş ve kaynaklarda en sık rastlanan muhayyerlikler kısaca incelenmiştir. İkinci bölümde ayıp muhayyerliği ve vasıf muhayyerliğinin tanımları, ilgili oldukları kavramlar, delilleri, şartları, örnekleri, sonuçları, vârislere intikâli, ayıp ve vasıf muhayyerliğine verilebilecek güncel bazı örnekler gibi konulara yer verilmiş ve iki muhayyerliğin mukayesesi yapılmıştır. Çalışmamız ulaştığımız neticelerden oluşan bir sonuç bölümüyle nihayete ermektedir."
