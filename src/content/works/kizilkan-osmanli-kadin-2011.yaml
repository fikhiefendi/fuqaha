abstract: "Son yıllarda Osmanlı hapishaneleri ve buralardaki mahkûmlar hakkında yapılan akademik çalışmalar bir hayli artış gösterse de, Osmanlı'da kadın hapishanelerini ve kadın mahkûmları ele alan bu çalışma, alanında yapılan ilk çalışmadır. Klasik dönemde şer'i hukuk ve örfi hukuktan oluşan Osmanlı hukukunda, Gülhane Hattı ile başlayan süreçte gayrimüslimlerin durumu gerekçe gösterilerek Avrupa'dan alınan Batı hukuku, mahkemelerin görev alanlarında ve bazı davaların hangi mahkemede görüleceği konusunda karışıklığa yol açmıştır. Bu sebeple ilk olarak, Tanzimat öncesi ve sonrasıyla Osmanlı ceza hukukuna değinilmiş, daha sonra ceza uygulamalarının tatbik sahası olan hapishanelere ve bu uygulamaların nasıl yapıldığına dair sorular cevaplanmaya çalışılmıştır.Dünya genelinde sosyal bir dönüşümün yaşandığı on dokuzuncu yüzyılda, sadece hukukî alandaki değişimler ele alındığında bile Osmanlı için ?imparatorluğun en uzun yüzyılı? olmuştu demek mümkündür. İslam hukukuna uygun pragmatik cezalandırma yönteminden, hapis cezası ve hapishanelere doğru bir evrilme bu dönemde başlamıştır. Tarihimizde birçok yeniliğin miladı sayılan Gülhane Hatt-ı Hümayunu ile başlayan bu devrede, bedene yönelik cezalardan, hürriyeti kısıtlayıcı cezalara bir geçiş başlamıştır. 1839'dan sonra düalist bir yapıya bürünen Osmanlı hukukunda hapis cezası ve hapishanenin, XIX. yüzyıl ortalarına doğru Osmanlı ceza sistemine girdiği dikkate alınırsa, cezanın uygulanması ve ceza infaz mekânlarının anlaşılması da daha kolay olacaktır.Kısaca hapishanelerin ortaya çıkışı ve Osmanlı'nın hapishane ıslahatlarının ele alındığı ikinci bölümde, kadın mahbes ve hapishanelerinin fotoğrafı çekilmeye çalışılmıştır. Bu bölümde hapishanelerin fiziki durumu ve mimarisi, işleyişi, hapishanedeki personelin yetki ve görevleri, kadın hapishanesi olarak kullanılan mekânlarda vazife yapan gardiyanlar ve bunların mahbuslara karşı tutumu, ulaşılan kaynakların verdiği imkân ölçüsünde kadın hapishanelerindeki günlük hayat, hastalıklar ve sağlık hizmetleri, yeme-içme, giyinme, yatma-kalkma ve çalışma gibi durumlar incelenmiştir.Son olarak sıra, Osmanlı'da ceza alan kadınların işledikleri suç türlerini ortaya koymaya gelmiştir. Kadınların işledikleri suç ve aldıkları cezalar şer'i hukuktaki tasnifle verilmiş, bunlar üç grup hâlinde değerlendirilmiştir. İlk olması sebebiyle pek çok eksiği bulunması muhakkak bu çalışmada, mekândan ziyade, zaman sınırlaması yapmak doğru bulunmuştur. Çünkü modern anlamda bir kavram ve kurum olarak hapishaneye Osmanlı'da ilk kez, Gülhane Hatt-ı Hümayunu'ndan sonra rastlanmaktadır.İncelenen konuyla ilgili olarak kaleme alınan sonuç kısmında, elde edilen bilgiler ve belgeler doğrultusunda yapılan muhakeme ve değerlendirmeler yer almıştır.Çalışmada 1839'dan hemen hemen Osmanlı'nın tarih sahnesinden resmen çekildiği yıl olan 1922'ye kadar uzunca bir dönemi değerlendirme çabası gösterilmiş, bilhassa Osmanlı Arşivi'nden faydalanılmış, dönemin kadın dergi ve gazeteleri de taranmıştır."
