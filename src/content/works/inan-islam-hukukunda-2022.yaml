abstract: "İnsanın dünya sahnesine çıkışı kendi tasarrufu ile değil, Allah'ın muradı ve ebeveynlerinin vasıtasıyla mümkün hâle gelmektedir. Allah, hiçbir insana dünyaya gelişine kadar herhangi bir tercih şansı vermemiştir. Dolayısıyla ana rahmine düşüşünden doğumuna kadar tüm süreç, yaratıcının idaresi ve kontrolü altında olmalıdır. Bununla birlikte insanın doğum anına kadar olan hayat hakkını gaspedecek bir müdahaleye de izin verilmemiştir. Ancak insanlık tarihi boyunca ceninin ölümüyle sonuçlanan pek çok olay varolagelmiştir. Cenine yönelik cinâi fiillere, din ve hukuk sistemleri çeşitli önlem ve cezalar öngörmüş, engellemeye çalışmıştır. Giriş ve beş bölümden oluşan tezimiz, İslam hukukunda cenine karşı ölümle sonuçlanan müdahaleye karşılık olarak hükmedilen tazminatı kapsayan gurre kavramını incelemeyi amaçlamaktadır. Bu kavramın diğer hukuk sistemleri ile karşılaştırması yapılmış ve günümüzde ceninin haklarını korumak adına hukuki altyapı oluşturmak hedeflenmiştir. Bu hedef doğrultusunda çocuk düşürme, gurre ve ilişkili kavramlar açıklanmış, gurrenin unsurları, cenine müdahalenin diğer hukuki sonuçları, ödenme usulü ve miktarı üzerinde durulmuştur. Çalışmamızın, tespit edebildiğimiz kadarıyla gurre hakkında kaleme alınan ilk Türkçe tez olması açısından önemli bir bilimsel boşluğu doldurması ve bu konuda araştırma yapmak isteyenlere ışık tutması umulmuştur."
