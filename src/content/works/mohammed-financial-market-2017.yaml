abstract: "Son on yılda dünya, bilgi devrimi ve küreselleşmenin sonucu olarak önemli değişikliklere tanık oldu. Bu değişiklikleri gelişen ve çağımızın meselesi haline gelen ürün farklılaştırma faktörleri ve pazarlar arasındaki rekabet izlemiştir. İslami finansal piyasaların modern dünyada bölümlere ayrılması yöntemi, modern bir şekilde gerçekleştirilmek üzere formüle edilen herhangi bir stratejinin temel taşı haline gelmiştir. Bu yöntem, bir yandan üreticilerin ve pazarlamacıların hedeflerini, diğer yandan da tüketicilerin veya kullanıcıların hedeflerini gerçekleştirecektir. Bu süreç tüketiciler için yararlıdır çünkü ihtiyaçlarını karşılar ve finansal becerilerine göre satın alma arzularını tatmin eder. Bu çalışma banka sermaye varlıkları, enflasyon oranı, faiz oranı, borçlanma, geniş para artışı, mevduat faiz oranı, kredi faiz oranı, yurtiçi kredi, özel sektör gibi finansal değişkenlerin boyutları ve kişi başı GSYİH, GSYİH büyümesi, vergi gelirleri, mal ve hizmet ihracatı, mal ve hizmet ithalatı gibi ekonomik değişkenlerin boyutları ile bu boyutların İslami mali piyasalara bölünmesi ve nihayetinde pazar bölümlemesinin avantajları ile zayıf noktalarını ele almaktadır. Çalışmayı uygulamak ve hipotezlerini test etmek için dünyanın her yerinden İslam ülkelerindeki pazarlar seçilmiştir, seçilen bu piyasalar aynı zamanda İslam toplumunun yaşamındaki en önemli pazarlardandır ve bunun yanında modern İslam dünyasındaki yeni gelişmeler ile çok güçlü bir ilişki içerisindedir. Bu tezin amacı, İslamî finansal piyasalar açısından yukarıda bahsedilen konuları inceleyerek literatüre katkıda bulunmaktır. Özellikle tez, aşağıdaki soruları ele almaya çalışmaktadır: • İslami piyasalar dünyadaki piyasalara kıyasla mali göstergelerle bölümlere ayrılabilir mi, eğer ayrılabilirse hangi dereceye kadar? • Eğer İslami finansal piyasalar bölümlere ayrılabilirse, hangi ekonomik göstergeler bölümleri birbirinden ayırır? Yukarıda bahsedilenlere göre, çalışma finansal değişkenlerin boyutları ve İslami mali piyasaların bölümlenmesi arasındaki etkili ilişkinin doğasını yansıtan varsayımsal bir model ortaya koymaktadır. Buna ek olarak, varsayımsal model SPSS için küme analizi ve diskriminant analizi gibi iki analiz aracı tarafından test edilmiş birçok hipotez aracılığıyla yorumlanmıştır. Dünya Bankası Sitesinden seçilen finansal göstergelere göre İslam ülkelerini kümelemek için SPSS istatistik paket programı kullanılmıştır. Farklı kaynaklardan yeterince ulaşılabilir olan bu değişkenler döviz kuru, işlem gören hisse senetleri, banka sermaye varlıkları oranı, enflasyon oranı, reel faiz oranı, geniş para artışı, mevduat faiz oranı, borç verme faiz oranı ve yurtiçi kredidir. Bu değişkenlerle İslam ülkelerinin finansal piyasalarının bölümlere ayrılıp bırakılmayacağını anlıyoruz. İslam ülkelerini finansal göstergelerine göre iki farklı kümeye böldükten sonra, hangi ekonomik göstergelerin bu iki kesimi mükemmel şekilde ayırt ettiklerini öğrenmek yararlı olacaktır. Bu sayede, iki bölüm arasındaki farklar açıkça görülecektir ve makul bir süre sonra bu araştırmayı tekrarlamak, bu bölümlerin değişen eğilimlerini gösterecektir. Bu amaçla ayırma (diskriminant) analiz kullanılmıştır. Ayrıca analiz iki segment arasındaki her bir ülkenin mevcudiyetini anlamak için kullanılabilecek bir denklem sunacaktır. İstatistiksel analizlerin sonuçları, banka sermayesi varlıkları, enflasyon oranı, faiz oranı borçlanma, geniş para büyümesi, mevduat faiz oranı, kredi faiz oranı ve yurtiçi kredi özel sektörü ile İslami finansal piyasalarını önemli ölçüde ayırabilirken, öte yandan ekonomik değişkenler İslami finansal piyasaları ayıramamaktadır. Bunun yanında (kişi başı GSYİH, GSYİH büyümesi, vergi geliri, mal ve hizmet ihracatı ve mal ve hizmet ithalatı gibi) bazı ekonomik göstergeler, iki farklı kümeyi ayırt edebilmektedir."
