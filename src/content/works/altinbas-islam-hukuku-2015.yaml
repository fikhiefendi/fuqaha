abstract: "İslam hukuku ve Osmanlı hukukunda vakıf müessesesi adlı çalışmamızın temel amacı, İslam hukuku ve Osmanlı uygulamasında vakıf kavramının, vakfın menşeine ilişkin iddiaların, vakfın hukuki niteliğinin ve vakıfların tarih boyunca yürüttüğü hizmetlerin incelenmesidir. Bir hayır müessesesi olan vakıflar, İslâmiyet'in öğütlediği sadaka kavramı ile gelişmiş kurumlardır. Sosyal, kültürel, ekonomik pek çok alanda hizmet veren ve fıkıh hükümlerinin şekillendirdiği bu kurumlar, Osmanlı uygulamasında en üst mertebeye erişmiştir. Çalışmamız iki bölümden oluşmaktadır. Birinci bölümde ilk olarak vakıf kavramı, vakfın menşeine ilişkin görüşler, vakfın İslamiyet öncesinde ve sonrasında gelişimi ele alınmıştır. Vakfın kurulması, buna ilişkin şartların ve sonuçların da değerlendirildiği birinci bölümde, vakıfların idaresi ele alınmış, tevliyet kavramı incelenmiştir. İkinci bölümde ise vakıf çeşitleri menkul-gayrimenkul olarak değerlendirilmelerinin yanı sıra mülkiyet, mahiyet, idare, kiraya verilmesi ve yararlananlar bakımından ele alınmıştır. Son olarak vakıfların sunduğu hizmetler ve vakıf görevlileri konusuna temas edilmiştir."
