abstract: "Bu tez, beşerû hukuk sistemlerindeki, hukukun tatbiki sırasında karşılaşılan?kanun boşluğu? probleminin İslam Fıkhında mevcudiyetinin araştırılması üzerineyapılan bir çalışmadır.İslam Fıkhında ?meskÃ»tun anh? denilen nassların sustuğu bir alanın mevcÃ»diyetive bu alanın ibâha ve içtihat alanı olduğu çoğunlukla kabul edilmiştir. Bununla beraber,bu alanın beşerû hukuktaki kanun boşluğuyla tam olarak örtüştüğünü söylemek doğrudeğildir. Çünkü doktrinal anlamda her şeyi bilen bir iradenin tezahürü olan İslamHukukuyla, insan iradesinin ürünü olan beşerû hukuk mahiyet itibariyle farklıdır. İkifarklı şey arasında tam bir mukayese yapmak pek sağlıklı olmayacaktır.Hadis-i şerifin ifadesiyle, İslam'da helaller bellidir, haramlar da bellidir. İkisiarasında kalan şüpheli şeylerin hükmünü ise içtihada salahiyetli olan müçtehitler tespitederler. Helale yakın ise helal, harama yakın ise haram hükmünü verirler. Her iki tarafada bir yakınlık hissedilmiyorsa ondan kaçınılması daha iyidir şeklinde problemi açıklığakavuşturmuşlardır."
