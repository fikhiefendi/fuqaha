abstract: "Kur'ân-ı Kerîm inzal edildiği dönemden günümüze kadar geçerliliğini koruyan zihinlerde hıfzedilen, manâları üzerinde tefekkür edilen bir kitaptır. Ayet-i kerîmelerin ihtiva ettiği anlamlar üzerine pek çok tefsir eseri kaleme alınmıştır. Tezimizin konusunu oluşturan Hamdi Döndüren'e ait Ahkâmu'l-Kur'ân adlı eser de yakın dönemde yazılan tefsir eserlerinden birisidir. Çalışmamızın amacı Hamdi Döndüren'in Ahkâmu'l-Kur'ân adlı eserinde kullanmış olduğu metodu tespit etmek ve güncel meselelere bakış açısını ortaya koymaktır. Çalışmamız giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın amacı, önemi ve gerekliliği ele alınmıştır.Birinci bölümde Hamdi Döndüren'in hayatı, eserleri, makaleleri ve talebeleri konuları ele alınmıştır.İkinci Bölümde öncelikle ahkâm tefsirleri tanıtıldıktan sonra Ahkâmu'l-Kur'ân tefsirinin rivayet ve dirayet yönüne dair incelemelerde bulunulup eserden örneklerle açıklamalar yapılmıştır. Üçüncü bölümde ise yakın dönemde yazılması hasebiyle Ahkâmu'l-Kur'ân tefsirinin güncel meselelere olan bakışı tafsilatlı bir şekilde incelemeye tabi tutularak önceki tefsirlerden aynı konulara dair yorumların eklenilmesiyle birlikte geçmişte yazılan eserler ile günümüze yakın dönemde kaleme alınan tefsirler arasında ayrışan yönlere de dikkat çekilmiştir. Sonuç bölümünde eserin genel bir değerlendirmesi yapılmıştır."
