abstract: "Bu tez, Osmanlı döneminin önemli temsilcilerinden Şeyhülislâm İbn Kemal Paşa'nın kaleme aldığı tefsirinde sebeb-i nüzûl rivâyetlerini incelemeyi amaçlamaktadır. Tezde, müfessirin sebeb-i nüzûl rivâyetlerini hangi ölçütlere göre kabul ettiği, rivâyetleri âyet metni içerisinde nasıl konumlandırdığı, rivâyetleri nakletmede nasıl bir yöntem benimsediği ve rivâyetler noktasında yaptığı değerlendirmeler incelenmiştir. Bu tezde, İbn Kemal Paşa'nın sebeb-i nüzûl rivâyetlerini âyetlerin anlamını tamamen belirleyen tarihsel kayıtlar olarak değil, âyetlerin iniş bağlamını açıklayan ve anlamın anlaşılmasına katkı sağlayan unsurlar olarak değerlendirdiği görülmüştür. Müfessirin rivâyetleri kimi zaman âyetin başında, kimi zaman ortasında, kimi zaman da sonunda zikretmesi, rivâyetin ilgili olduğu lafız veya anlam unsuru ile ilişkilendirilebilir görünmektedir. Bu durum, müfessirin sebeb-i nüzûl rivâyetlerini aktarırken belirli bir düzen ve yaklaşım takip etmiş olabileceğine işaret etmektedir. Birden fazla sebeb-i nüzûl rivâyetinin bulunduğu âyetlerde İbn Kemal Paşa'nın çoğu zaman açık bir tercihte bulunmadığı; ancak âyetin bağlamı ve anlam bütünlüğüyle uyumlu gördüğü rivâyetleri öne çıkardığı, buna karşılık uyumsuz görünen rivâyetlere ise mesafeli yaklaştığı anlaşılmaktadır. Bu durum, müellifin rivâyetleri değerlendirirken isnad tartışmalarından ziyade metin ve bağlam unsurlarını dikkate aldığına işaret etmektedir. Bununla birlikte, elde edilen veriler çerçevesinde İbn Kemal Paşa'nın sebeb-i nüzûl rivâyetlerini âyetlerin anlamını açıklayan ve yorum sürecine katkı sağlayan unsurlar olarak değerlendirdiği söylenebilir. Netice itibarıyla bu tez, başta müfessirin ilmî şahsiyeti ve yetiştiği ilmî çevre olmak üzere, tefsirini kaleme alırken benimsediği yöntemi ve bu yöntemin temel özelliklerini ortaya koymaktadır. Bununla birlikte çalışmanın merkezinde yer alan sebeb-i nüzûl rivâyetleri çeşitli yönleriyle incelenmiştir. Bu kapsamda İbn Kemal Paşa'nın söz konusu rivâyetleri naklederken kullandığı ifadeler ve bu ifadelerin delâletleri değerlendirilmiş; rivâyet aktarımında başvurduğu kaynaklar tespit edilmeye çalışılmıştır. Ayrıca müellifin sebeb-i nüzûl rivâyetlerini ilgili âyetlerle ilişkilendirme biçimi ile bu rivâyetleri değerlendirme yöntemine dair bazı tespitlerde bulunulmuştur."
