abstract: "Bu doktora çalışması, Osmanlı-Anadolu kıraat tedrisat geleneğinin temsilcilerinden Sûfî mesleğinin metodolojisini, tarihî arka planını ve tercihlerini çok yönlü bir şekilde incelemeyi amaçlamaktadır. Çalışma, mesleğin kendisine nispet edildiği Reîsülkurrâ Ahmed es-Sûfî'nin (öl. 1172/1758) ilmî kimliğini, mesleğin İbnü'l-Cezerî'den günümüze uzanan isnad silsilesini, coğrafi yayılımını ve diğer tahrîrât ekolleriyle olan ilişkisini analiz etmektedir. Araştırmanın temel bulgusu, Sûfî mesleğinin kıraat tercihlerini belirlemede sentezci ve çok faktörlü bir metodoloji benimsediğidir. Bu yöntem, azîmet ve ruhsat yaklaşımlarını harmanlamaktadır. Ruhsat ilkesi, özellikle aşru'l-kübrâ tarikinde İbnü'l-Cezerî'nin otoritesine bağlılığı içerir. Azîmet ilkesi ise aşru's-suğrâ tarikinde, rivayetlerin sıhhatini titizlikle incelemeyi, infirâd ve zayıflık ihtiva eden vecihleri eleyerek cumhurun tercihine öncelik vermeyi gerektirir. Sûfî mesleği, bir vechin okunuş sırasını belirlerken alî isnad, Arap dilinde asıl kabul edilme, Resm-i Osmânî'ye mutabakat, vakf/vasl halleri ve genel usule uyum gibi birden fazla kriteri eş zamanlı kullanmıştır. Bu tercihler, Molla Emin Efendi'nin 'Umdetü'l-ḫullân adlı eseri başta olmak üzere, kürrâseler ve kavâid defterleri aracılığıyla korunmuş ve aktarılmıştır. Yapılan karşılaştırmalı analizler, Sûfî mesleğinin tercihlerde Îtilâf ve Mutkin meslekleriyle büyük ölçüde uyum gösterdiğini ancak Şeyh Atâullah mesleğiyle ve Kahire ekolünden önemli ölçüde ayrıştığını ortaya koymuştur. Aşere tarikinde infirâdâtına rastlanmazken, takrîb tarikinde diğer mesleklerden farklılaştığı bazı özgün tercihler belirlenmiştir. Çalışma, Sûfî mesleğinin tercihlerinin tahrîrât-ı zanniyye/ihtimâliyye kapsamında değerlendirildiğini, bağlayıcılığının mutlak olmayıp aḫz (üstattan öğrenme) şartına tabi olduğunu netleştirmiştir. Ayrıca Ahmed es-Sûfî'nin reîsülkurrâlık dönemini ve mesleğin günümüze kadar kesintisiz devam etmesinin sosyo-ilmî nedenlerini ortaya koyarak Osmanlı kıraat tarihi literatürüne önemli katkılar sunmuştur."
