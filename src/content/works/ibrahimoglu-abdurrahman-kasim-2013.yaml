abstract: "İmam Mâlik?in Mısır?lı önde gelen talebelerinden olan Abdurrahman İbnü?l-Kâsım İmam Mâlik?in halkasında 20 yıl kalarak onun tüm ilmî birikimini elde etmiştir. Aldığı bu birikimi Mısır?da kendi ilim halkasında özellikle Kuzey Afrika ve Endülüs?ten gelen talebelere aktararak Mâlikîliğin Mısır, Kuzey Afrika ve Endülüs?e ulaşmasını ve bu coğrafyalarda kök salmasını sağlamıştır. İbnü?l-Kâsım?ın İmam Mâik?ten edindiği fıkhî meseleler, daha sonra oluşan Mâlikî eserlerinin de temelini teşkil etmiştir. Mezhebin temel başvuru kaynağı olan el-Müdevvenetü?l-Kübrâ bu eserlerin başında gelmektedir. Tüm bunların yanı sıra İbnü?l-Kâsım sergilediği fıkhî metod ile kendinden sonra gelen Mâlikî fakihlerine mezhep içi fıkhî istidlal metodunu da göstermiştir."
