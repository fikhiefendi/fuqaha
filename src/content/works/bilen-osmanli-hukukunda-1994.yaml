abstract: "ÖZET Fıkıh, fakihlere göre kişinin leyh ve aleyhine olması gerekenleri bilmesidir. İslam hukuku asli kaynaklar ola rak, Kur 'an ve Sünnet 'e dayanır. Peygamber dönemindeki ve daha sonraki gelişmeler icma ve kıyas' ı da asli kay naklar arasına sokmuştur. Örf ve adet toplumların öteden befi getirdikleri, herkesin kabul ettiği, toplum içinde uyulması gereken kurallardır. Geçmişte geçerli olan herhangi bir örf, ge lecekte özelliğini yitirip unutulabilir veya değişir. İslam hukukuna göre örf ikiye ayrılır. Muteber örf ve fasid örf. Muteber örf, İslam hukukunun kabul ettiği örftür. Fasid örf islam anlayışına uymayan örftür. îslamdan önce kurulan, Hun, Göktürk, Uygur ve diğer Türk devletlerinde töreye dayanan bir hukuk anlayışı gö rülür. Hun ve Göktürk devletleri, askeri ve sivil teşki latlar ile memuriyetler oluşturmuşlardır. Uygurlar bir birleri ve devlet ile olan ilişkilerini düzenleyen huku ki vesikalar meydana getirmişlerdir. İslamiyet döneminde kurulan Karahanlı, Gazneli, Büyük Selçuklu, Anadolu Selçuklu ve diğer Türk-îslam devletle rinde esas olarak islam hukukuna uyulmuştur. Osmanlı hukuk yapısı hakkında çeşitli görüşler var dır. Köprülü, Barkan, İnalcık gibi tarihçiler, Osmanlı devletinde şer' i hukukdan ayrı bir örfi hukuk olduğunuii söylerler. Onlara göre bu Şeriat 'dan ayrx bir laik ya da devlet hukukudur. Osmanlı devleti bir islam devleti ol duğuna göre, hukuku da esas olarak islam hukukuna daya nır. Ancak, Osmanlı devleti değişen şartlara uyum sağla mak için kamu, askerlik, vergi, toprak ve ceza hukuku alanlarında bir örfi hukuk sistemi oluşturmuşlardır. Kanunnameler, padişah iradesiyle askeri, toprak, vergi, kamu, ceza gibi alanlarda oluşturulan hukuk mec mualarıdır. Kanunlar yapılırken uygulanacağı bölgenin örf-adet ve eski kanunlarından yararlanılmıştır. Hatta Osmanlı devleti fethettiği gayri müslim ülkelerdeki, örf-adet ve kanunlardan kendisine uygun düşeni aynen ve ya deriştirerek devam ettirmiştir. Bazı Osmanlı Kanunna melerinde,“önceki kralları zamanında”var olan vergi veya teşkilatların devam ettirilmesine dair hükümlerin olması buna örnektir. Kanunlar daha sonra gelen padişah tarafından aynen veya kısmen devam ettirilmiştir. Bu yüzden bazı kanunların kesin tarihini bilmek zordur. Os manlı hukuk sistemi içerisinde örfi hukuk ve onun neti cesi oluşan kanunnameler geniş yer tutar."
