abstract: "Filistin'de dayanıklı ekonomiyi güçlendirmek amacıyla kümelenmenin (uzmanlık alanlarına dayalı üretim) rolünü anlamayı hedefledi. analizi için nitel bir yaklaşım kullanıldı ve verilerin analizinde tarama ve türetime başvuruldu. Çalışmada ekonomi uzmanları, Filistin özel sektör temsilcileri, kamu sektörü temsilcileri ve sivil toplum kuruluşları katıldı. Verilerin toplanması için temel kaynaklardan alınan verilerle söyleşi aracına dayalı bir yaklaşım benimsendi. Araştırmada Filistin toplumu, ekonomik planlama ve kümelenme politikalarına dahil olan, konunun uzmanları olarak kabul edilen 11 kişilik bir örneklem üzerinden temsil edildi. Görüşmeler onlarla gerçekleştirildi ve sonuçlar analiz amacıyla kullanıldı. kümelenme fikrinin yerel istihdam fırsatları ve dengeli kalkınma sağlama gibi avantajlar nedeniyle dirençli ekonomiyi desteklediğini gösterdi. Kümelenme politikalarının, yerel ekonomi ve ulusal ekonominin rekabetçiliğini artırma ve ticaret dengesindeki yapısal dengesizlikleri düzeltme potansiyeline sahip olan bazı ekonomik sektörlerde (sanayi ve tarım gibi) başarılı olabileceğini belirtti. Ayrıca, Filistin bağlamında kümelenme politikalarının başarılı olabilmesi için hükümet tarafından bireyleri gruplar halinde çalışmaya teşvik eden programlara ihtiyaç duyulduğunu vurguladı. Filistin ekonomik çerçevesinde kolektif çalışma kültürünün zayıf olması nedeniyle, bu tür programların gerekliliğini belirtti. Sonuçlar, ardışık Filistin hükümetlerinin izlediği ekonomik politikaların, Filistin halkının işgal altındaki durumunu dikkate almadığı ve serbestleşmeye dayalı neoliberal ekonomik yaklaşımın uygun olmadığını gösterdi. Son olarak, araştırma sonuçları, Filistin ulusal ekonomisinin, dirençli ekonomi fikrini benimseyerek İsrail'e olan ekonomik bağımlılığı azaltma amacıyla (özellikle dönüştürücü sanayi sektöründe) yerel pazardaki payını artırarak göreceli olarak olumlu sonuçlar elde ettiğini gösterdi. onaylanmış olan kümelenme kalkınma planlarının gözden geçirilmesi gerektiğini ve bu planların her ilde daha spesifik uzmanlık alanlarını kapsayacak şekilde genişletilmesi gerektiğini önerdi. Bu, her ildeki tüm sektörler ve ilgili avantajların dikkate alınmasıyla gerçekleştirilebilir. Böylece uzmanlık alanları, her il içinde kümelenme bölgelerine toplanabilir.\"."
