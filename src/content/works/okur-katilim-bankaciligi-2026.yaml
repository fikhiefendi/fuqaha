abstract: "1980'li yılların başında Özel Finans Kurumu ismi ile kurulan ve 2005 yılı sonunda yapılan düzenlemelerle 5411 sayılı Bankacılık Kanununa tabi olarak ismi Katılım Bankası olarak değiştirilen kurumlar, kamu sermayeli bankaların da sektöre girmesi ile birlikte ülkemizde günden güne büyümekte, pazar payı ve ürün çeşitliliği artmaktadır. 2025 yılı haziran sonu itibariyle, Türkiye genelinde konvansiyonel bankaların şube sayısı 9.097 iken, katılım bankalarının şube sayısı 1.498'a ulaşmıştır. Konya ili özelinde ise konvansiyonel banka şube sayısı 207 iken, katılım bankalarının şube sayısı 51'dir.Benzer biçimde 2025 yılı ilk altı aylık FinTürk verilerine göre, ülke genelinde katılım bankalarının topladığı fonların toplam fonlar içindeki payı %9,94 düzeyindeyken, bu oran Konya ilinde %17,86'e yükselmektedir. Kullandırılan fonlar açısından da ülke genelinde katılım bankalarının payı %7,85 iken, Konya ilinde bu oran %9,92 seviyesindedir. Bu göstergeler, Konya ilinde katılım bankacılığına yönelik talebin ülke ortalamasının üzerinde seyrettiğine işaret etmektedir. Konya ilinde konvansiyonel banka şubelerinin 118 tanesi merkez ilçelerde, 89 tanesi de merkez dışı ilçelerde faaliyet göstermektedir. Konya'da ilçe düzeyinde yalnızca Ereğli ve Akşehir'de toplam 3 katılım bankası şubesi bulunmaktadır. Katılım bankalarının ilçelerde şubeleşme ağı yeterli miktarda olmamasına rağmen, toplanan ve kullandırılan fonlar açısından bakıldığında rakamlar Katılım Bankacılığına ciddi talep olduğunu göstermektedir. Bu çalışma, Konya ilindeki söz konusu yüksek talebin dinamiklerini ve müşterilerin yönelimlerini analiz etmek amacıyla yürütülmüştür. İl genelinde katılım bankası hizmetlerini kullanan 404 katılımcı ile gerçekleştirilen online anket çalışmasından elde edilen veriler; tanımlayıcı istatistikler, Keşfedici Faktör Analizi (KFA) ve Çoklu Doğrusal Regresyon yöntemleri kullanılarak incelenmiştir. Analiz sonuçları, çalışmanın temel iddialarını destekleyerek, katılım bankacılığı tercihlerinin tek bir nedene indirgenemeyeceğini ve müşterilerin çok boyutlu bir algı yapısına sahip olduğunu ortaya koymaktadır."
