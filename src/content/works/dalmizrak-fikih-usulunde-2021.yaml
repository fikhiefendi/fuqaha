abstract: "Şer'î delillerden hüküm elde etme yollarını ele alan usûl-i fıkıh, diğer ilimlerle etkileşim içerisinde olmuştur. Usûl-i fıkıh, amaç ve kapsam bakımından kendisinin tertiben üstü kabul edilen kelâm ilminden, külli delillerden tafsili hükümler çıkarması için kaideler oluşturarak malzeme sunduğu kendisinin altı kabul edilen fıkıh ilminden ve söz konusu delillerin asıl dili olması hasebiyle Arapça dil ilimlerinden mebâdî olarak kavramlaşan ilkeler edinmektedir. Bu ilkeler, genellikle usûl-i fıkıh kitaplarının mukaddime bölümlerinde yer almaktadır. Mütekaddimûn döneminden itibaren usûl-i fıkıh kitaplarında yer verilmeye başlanan mebâdî, müteahhirûn dönem usûlcüleri tarafından bir sistematiğe oturtularak devam ettirilmiştir. Çalışmamızda müteahhirûn döneminin önde gelen usûlcülerinden Subkî'nin Cem'u'l-cevâmi' adlı eserine ed-Dureru'l-levâmi' adıyla şerh yazan Molla Gürânî'nin mukaddime bölümünde yer verdiği mebâdî ve bu mebâdî üzerine yapılan tartışmalar konu edilmiştir. Tez bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde çalışmanın sınırları belirlenerek müteahhirûn dönemde ele alınan eserlerin mukaddime bölümleri üzerine bir inceleme yapılmış; Gürânî'nin mukaddimesi ile önceki usûlcülerin mukaddimeleri karşılaştırılarak konumu saptanmaya çalışılmıştır. Birinci bölümde Gürânî'nin hayatına kısaca yer verilmiş, ikinci ve üçüncü bölümde ise Gürâni'nin kelam ve fıkıhla ilgili ele aldığı mebâdî ayrıntılı olarak ele alınmış; yapılan tartışmalar ve Gürânî'nin tartışmalar sırasında tercih ettiği görüşler ve takip ettiği ekol belirlenmeye çalışılmıştır."
