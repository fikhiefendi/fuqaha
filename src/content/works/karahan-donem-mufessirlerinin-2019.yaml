abstract: "Müslüman olan bir kişi, ibadetlerinde, insanlarla ilişkilerinde, aile hukuku ile ilgili meselelerde kutsal kaynak olarak kabul ettiği Kur'an ve Sünnet'in mesajlarına uygun olarak hareket etmekle yükümlüdür. Müslüman bireylerin farklı dinden olan kimselerle evlenip evlenemeyecekleri ya da bir Müslüman için hangi din mensuplarıyla evliliğine izin verildiği konusu aynı zamanda güncel dini meseleler/problemler arasında yer almaktadır. Şöyle ki günümüz teknolojisinin ülke sınırlarını ortadan kaldırması sonucunda dünyamız büyük bir kent haline dönüşmüş; farklı din, dil, ırka mensup insanlar birbirlerine rahatlıkla ulaşabilir hale gelmiştir. Müslüman-gayrimüslim evliliği meselesi, İslam aile hukuku kapsamındadır. İslam aile hukukuna ilişkin konuların ilk kaynaklarını Kur'an-ı Kerim ve Sünnet oluşturmaktadır. Evlilikte dini inanç farkı ise geçici evlenme engelleri arasında yer almaktadır. Gayrimüslim kavramı müşrik/kâfir, mürtet ve ehlikitap gruplarını kapsamaktadır. Kur'an-ı Kerim'de Müslüman-gayrimüslim evliliği meselesiyle ilgili doğrudan ya da dolaylı olarak ilgili olan ayet-i kerimeler bulunmaktadır. Müslüman bir erkeğin, müşrik/kâfir bir kadın ile Müslüman bir kadının müşrik/kâfir bir erkekle evliliğinin yasak olduğuna dair doğrudan hüküm bildiren ayetler mevcuttur. Müslüman bir erkeğin gayrimüslim olan ehlikitap kadınlarla evliliğine izin veren ayet de bulunmaktadır. Fakat Müslüman bir kadının ehlikitap bir erkekle evliliği hakkında doğrudan hüküm bildiren bir ayet yoktur. Çoğunluk tarafından Müslüman bir kadının ehlikitap bir erkekle evliliğinin yasak olduğuna dair hükmün Kur'an'ın dolaylı ayetleri, sünnet ve icma ile sabit olduğu kabul edilmiştir. Biz de çalışmamız ile dördüncü asrın başlarında vefat eden müfessir âlim İbn Cerîr et-Taberî dâhil olmak üzere ilk dönem müfessirlerinin, gayrimüslimlerle evlilik meselesiyle doğrudan ya da dolaylı olarak ilgili olan ayetler hakkındaki yorumlarını inceleyip konu hakkındaki fıkhî hükmün başlangıç noktasına dair bir kanaat ortaya koymayı amaçlamaktayız."
