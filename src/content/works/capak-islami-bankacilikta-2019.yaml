abstract: "Bu çalışmanın amacı İslami bankacılık sistemindeki kredi yöntemleri, bu yöntemlerin nasıl işlediği ve ülkemizde İslami bankacılık sistemi ile faaliyet gösteren katılım bankacılığının sunduğu kredi türlerini detaylı olarak incelemektir. Bu çalışmada ilk olarak İslami bankacılığın tarihi, doğuş nedenleri, dünyaya yayılma nedenleri, İslam dininde faizin yeri, faiz ile kâr arasındaki farklar, faizin çeşitleri, zararları incelenmiştir. Çalışmanın ilerleyen safhalarında İslami bankacılığın dünyada ve Türkiye'deki uygulama biçimleri ile Türkiye'de faaliyet gösteren katılım bankaları ele alınmıştır. Çalışmanın son bölümünde ise İslami bankacılık sisteminde yer alan kredi yöntemleri ile ülkemizde faaliyetini sürdüren katılım bankacılık sistemindeki ürünler incelenmiştir. Çalışmanın sonuçları olarak İslami bankacılık sisteminde de konvansiyonel bankacılık sistemindeki kadar bir kitleye hitap edebilecek ürün yelpazesinin bulunduğu ve bu ürünlerin direkt olarak ülkelerin kalkınmasına etki ettiği görülmüştür. Ayrıca faiz hassasiyeti olan kişilere ait fonlarında İslami bankacılık sistemi ile ekonomiye kazandırıldığı görülmüştür."
