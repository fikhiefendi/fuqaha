abstract: "Bu tezin başlığını Al-Khatib Al-Sherbini'nin“Mughni al-Muhtaj Adlı Eserinde İçtihat Terminolojisinin Analitik İncelenmesi”olarak seçtik (İbadet Bölümü). İmam Al-Khatib Al-Sherbini'nin yazdığı Mughni al-Muhtaj adlı kitabının ışığında başta İbadet Bölümü olmak üzere iötihat terminolojisinin analitik bir incelemesiyle ele alınmaktadır. Bu çalışma İçtihat terminolojisinin tanımlanmasına büyük ilgi duyan büyük bilim adamı ve hukukçu İmam Al-Khatib Al-Sherbini tarafından yazılan kitapta bulunan hukuksal terminolojinin analizini incelemeye yönelik olup, beni özellikle ibadet konusunda incelemeye sevk etti. Bu çalışmamda, yazarın sözlerini aktardığım ve oradaki yaklaşımını gösterdiğim tümevarımsal ve analitik yönteme dayandım. Bunun yanı sıra, benimsediği ve ifadelerinde açıkça durduğu kaynakları tespit ettim. Çalışmanın doğası gereği, başlığın kelime dağarcığını tanıtmak için bu çalışmayı bir giriş bölümüne ve saflık, dua, zekat, oruç ve Hac ritüel eylemleri ile ilgili terminolojiyi incelemek için iki ana bölüme ayırdım. Bu araştırma ile bir dizi sonuç elde edildi: - İçtihat terminolojisinin anlamları tanımlanmamış gibi hukuki terminolojiyi incelemenin önemi. Bu durum yenilenme ve zamana ayak uydurma iddialarıyla din kavramının çarpıtılmasına ve onun amaç ve çıkarlarına göre manipüle edilmesine yol açacaktır. - Al-Sherbini, açıkladığı Al-Minhaj kitabında terminolojinin ilk tanımına değiniyor. İçinde bahsedilmeyen terminolojiyi biliyor olabilir. Ayrıca dilbilimsel anlamdan ve ilgili terminolojiden de bahseder. - Al-Sherbini'nin terminolojiyi açıklamak için en popüler kaynağı al-Nawawi'nin Al-Majmoo kitabı ve onun şeyhi şeyh Zakariya Al-Ansari'nin kitaplarıdır. En ünlü dil kaynakları şunları ise al-Farahidi'nin al-Ain adlı eseri, İbn Faris'in al-Moqayis al-Lugha adlı eseri ve İbn Manzur'un Lisan el-Arab adlı eserleri olup, cümleleri genellikle bu yazarların sözlerine yakındır. Sonuç kısmı yazılırken aşağıda belirtilmiş olan öneri ve tavsiyelerde bulunuldu: Bu mübarek projeyi tamamlamak ve bu yönde çalışmak için bu kitapta yer alan işlem ve suçlarla ilgili terminoloji çalışmasının tamamlanması gerekmektedir."
