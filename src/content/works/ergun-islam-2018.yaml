abstract: "Bu çalışmada İslâm hukukunda yapı mâliklerinin kusursuz sorumluluğunu inceledik. Tez konusu önemlidir. Çünkü insanlar ilk çağlardan itibaren barınma ihtiyaçlarını gidermek için basit dahi olsa, bina ve yapılar edinmeye başlamışlardır. Zamanla yaşam alanlarını daha uygar ve bayındır kılmak için de modern ve ileri teknoloji standartlarında bina ve yapılar inşa etmişlerdir. Çok tabiidir ki, bu değişim ve gelişmeler \"sorumluluk hukuku\" alanında önemli bazı hukukî neticeleri de beraberinde getirmiştir. Bilindiği üzere, Roma hukukundan başlayarak sorumluluk için \"kusur ilkesi\" aranmıştır. Kusur ilkesine göre, şahsın kusuru yoksa sorumluluğu da olmayacaktır. Ancak bu ilke, ilerleyen zaman içinde yetersiz kalmış, hakkaniyeti tesis etmemeye başlamıştır. Batı ancak 19'uncu asırda bu hakkaniyetsizliğin farkına vararak \"sebebiyet ilkesi\" ni benimsemeye başlamıştır. Oysa İslâm hukuku \"kusursuz sorumluluk\" diye de adlandırılan \"sebebiyet ilkesi\" ni işin başından beri benimsemiştir. Bu da İslâm hukukunun hukuk düşüncesine sağladığı önemli katkılardan biridir. Sebebiyet ilkesi ve diğer bazı hususlarla birlikte düşünüldüğünde, İslâm hukukunun özgün ve müstakil bir hukuk olduğunu rahatlıkla söyleyebiliriz. Çünkü kusursuz sorumluluğa göre, bir şeyden yararlanan kişi onun mukadder zararlarını da tazminden sorumlu ve yükümlü tutulmaktadır. İşte bu prensibe göre, yapı mâlikleri kusurlu fiilleri yanında bir de sebep oldukları zararları tazminle yükümlüdürler. Çünkü bu işten çıkar ve menfaati olan bizzat kendileridir. Öyleyse olası zararlarını da ödemek zorundadırlar."
