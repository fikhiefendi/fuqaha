abstract: "Hicrî 1099 yıllarında Osmanlı Devleti'nin İstanbul şehrinde yaşamış Hâcibzâde Muhammed Efendi, bir Osmanlı alimidir. Kendisi; kırâat, tecvîd ve ferâiz ilmi hususunda önemli bir yere sahiptir. Hâcibzâde, sahip olduğu kırâat ve tecvîd birikimini Kavâidü'l-Furkân fî tecvîdi'l-Kur'ân adlı eserinde sade bir üslupla telif etmiştir. Hâcibzâde, söz konusu eserinin mukaddime kısmında, kırâat tarihinin temel konularından Kur'ân'ın cemʽi ve istinsah edilmesi, yedi harf meselesi, kırâatlerin teşekkülü, kırâat imamları, Kur'ân harflerinin sayısı ve fazileti, harflerin mahreç ve sıfatları gibi temel konuları, sade bir üslupla ele almıştır. Daha sonra tecvîd kâideleri kırâat imamlarının görüşleriyle beraber zenginleştirilip aktarılmıştır. Eserin hatime kısmında ise vakf-ibtidâ meselesi ve bununla irtibatlandırılan Mushaf imlâsı ele alınmıştır. Söz konusu kısımdaki Resmi Osmanî'ye dair kelimeler, zapt edilmesi için açıklanmıştır. Eserin son kısmında da Kur'ân tilâvetinin adapları üzerinde durulmuş; Kur'ân tilâvetine başlarken hangi salavat ve duâ ile başlanmasına dair birtakım nakillerde bulunulmuştur. Eser son olarak örnek bir hatim duâsı ile son bulmuştur."
