abstract: "Günümüzde kadının sosyal hayatta daha aktif olarak rol alması, toplumdaki yerinin değişmesiyle birlikte kadın hakkındaki birçok hüküm de yeniden değerlendirilmeye başlanmıştır. Bu bağlamda Nisâ Sûresi 34. âyette yer alan“nüşûz”kavramı ve“nâşize kadın ile ilgili hükümler”de bu değişimle ilişkili olarak günümüzde tartışma konusu olmuştur. Bu çalışmada ilk olarak nikah akdi hakkında genel bilgi verildikten sonra, söz konusu âyet bağlamında nüşûz kavramı üzerinde durulacaktır. Ardından fakihlere göre kadının hangi durumlarda nâşize sayılacağı konusu ele alınacaktır. Daha sonra kocaya verilen kavvâm sıfatının bir sonucu olarak nâşize kadına uygulanacak yaptırımlar ve kocanın te`dîb hakkı incelenecektir. Nüşûz sebebiyle uygulanacak yaptırımlardan“dövme”tedbiri kadın hakları açısından günümüzde önemli bir tartışma konusu haline gelmiştir. Konuyla ilgili hem klasik hem de modern kaynaklarda yer alan fakihlerin ve müfessirlerin görüşleri ele alınacaktır."
