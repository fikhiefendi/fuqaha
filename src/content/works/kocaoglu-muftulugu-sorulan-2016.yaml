abstract: "Bu çalışma, Kayseri İl Müftülüğü bünyesindeki Alo Fetva Hattı'na ile Aile İrşad ve Rehberlik Bürosu'na yöneltilen soruları konu edinmektedir. Söz konusu soruların yöneltilmesindeki psikolojik arka plan analiz edilmiştir. Şu veya bu şekilde bir dini hayatı benimseyen bireyler, İl Müftülüğü Aile İrşad ve Rehberlik Bürosu'na yalnızca dini içerikli sorular sormakla yetinmemektedirler. Ayrıca psikolojik, fizyolojik, ailevi ve toplumsal sorunları ile ilgili de yardım istemektedirler. Bu durum danışanların, müftülükleri dini bir teşkilat olmanın yanı sıra psikolojik danışma merkezleri olarak da gördüklerinin bir göstergesidir. Çalışma, giriş bölümü ile birlikte üç bölümden oluşmaktadır. Giriş bölümünde, çalışmanın problemi, amacı, önemi, sınırlılıkları ile yöntemi ortaya konmuş ve problemleri saptanmaya çalışılmıştır. Birinci bölümde çalışmanın genel çerçevesi çizilmiştir. Çalışmanın konusunu teşkil eden temel kavramlar açıklanmıştır. İkinci bölümde bireysel dindarlık, psikolojik ve toplumsal yönleriyle ele alınmış, sosyal ortamın bireyin dindarlığına etkisinden söz edilmiştir. Aynı zamanda bu bölümde dindarlık algısının psikolojik sorunlarla olan ilişkisi ele alınmıştır. Abartılı ve saplantılı tutum ve davranışların dindarlık algısıyla bağlantısına yer verilmiştir. Üçüncü bölümde, Kayseri İl Müftülüğü'ne yöneltilen soruların genel çerçevesi çizildikten sonra, soruların konulara göre dağılımları, ağırlıklı olarak ne tür soruların yöneltildiği tespit edilmeye çalışılmıştır. Ayrıca Diyanet İşleri Başkanlığı'nın dini danışmanlık ve rehberlik konusundaki çalışmalarına değinilmiş ve bu çalışmaların yeterliliği konusunda görüşler sunulmuştur. Sonuç bölümünde ise elde edilen veriler değerlendirilmiştir. Yaptığımız değerlendirmelere göre sonuç bölümünde kadınların dini konularda erkeklere oranla daha hassas olduğu tezimiz doğrulanmıştır. Kadınların bu hassasiyetinin müftülüğe, aile ve dini rehberlik bürosuna sorulan sorulara da yansıdığı görülmüştür. Soru soranların cinsiyet, yaş ve eğitim durumlarına göre genel bir saptamada bulunulmuştur. Şu veya bu şekilde bir dini hayatı benimseyen bireyler, İl Müftülüğü Aile ve Dini Rehberlik Bürosu'na yalnızca dini içerikli sorular sormakla yetinmemektedirler. Ayrıca psikolojik, fizyolojik, ailevi ve toplumsal sorunları ile ilgili de yardım istemektedirler. Bu da danışanların, müftülükleri dini bir teşkilattan ziyade psikoljik danışma merkezleri olarak da gördüklerinin bir göstergesidir."
