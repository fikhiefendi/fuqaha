abstract: "Hicri 1300-1301 yıllarını kapsayan bu çalışmada ana kaynak olarak 24 Numaralı Antalya Şerʿiyye Sicil Defter'i kullanılarak incelenen döneme ilişkin Antalya'nın idari, hukuki, sosyo-kültürel ve ekonomik durumu aydınlatılmaya çalışılmıştır. Transkripsiyonu yapılan defterin üç bölüme ayrılarak yapılan değerlendirilmesinde ilk bölümü idari ve adli yapı oluşturmaktadır. Bu kısımda Tanzimat döneminde Osmanlı Devleti'nde yaşanan değişimlerin Antalya sancağına yansıması ele alınmıştır. XIX. yüzyılda Osmanlı Devleti'nin, dünya siyasetinde aleyhine gelişen durumdan Tanzimat'ın getirdiği yenileşmeyle kurtulma çabası birinci bölümün değerlendirilme kısmında görülebilmektedir. Sosyo-ekonomik ve kültürel yapının ele alındığı ikinci ve üçüncü bölümlerde ise miras hukuku, tarım ve hayvancılık, o dönemde kullanılan para ve eşyalar ele alınarak Osmanlı toplumsal yapısına dair özelden genele bir yargıya varmaya çalışılmıştır. Müslümanların daha çok tarım ve hayvancılık alanlarıyla uğraşırken gayrimüslimlerin ise zanaat ve ticaretle meşgul olduğu görülmektedir. Osmanlı şehirlerinden olan Antalya'da kullanılan eşyalar ve lakaplardan yola çıkılarak o dönemde konargöçer kültürün izlerinin korunmakta olduğuna ulaşılabilmektedir. Bu çalışmayla Antalya örneği üzerinden yapılan değerlendirme sayesinde Osmanlı Devleti'ndeki sosyal devlet anlayışı ve hukuka verilen önem açığa çıkarılmaktadır."
