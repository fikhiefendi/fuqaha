abstract: "?Nikâhta Rıza ve Cebir? adlı çalışmamızı tezimize konu edinmiş bulunmaktayız. Tezimizde, evlenecek bireylerin kendi iradeleriyle evlilik sözleşmelerini yapabilme durumlarını, bu bireylerin velisi konumundaki insanların yetki sistemini İslam Hukukçuları arasındaki farklı değerlendirmeler çerçevesinde ele almaya çalıştık.Çalışmamız iki bölüm halinde ele alınmış olup, birinci bölümde; Kavramsal Çerçeve başlığı altında ?Nikâh, Ehliyet, Velâyet, Rıza, Cebir, Muhayyerlik? kavramları incelenmiş; ikinci bölümde ise; Rıza ve Cebir Kapsamında Nikâh Akdiyle İlgili Hükümler değerlendirilmeye çalışılmıştır.Konuyla ilgili yapılan çalışmalarda, Hukukçuların kendi mezhepleri çerçevesinde nasslara yaklaşarak, kimi zaman nassları tahsis ederek, aynı delillerden farklı sonuçlar çıkarabildikleri için, bireylerin evlilik sözleşmesinde yetki problemiyle ilgili konulara yaklaşımlarda, nassları çağın durum ve gereksinimleri çerçevesinde yorumlamakta bir sakınca olmayacağı kanaatine vardık. Bu cümleden olarak, âkıl-baliğ kızın evliliğinde Hanefî Hukukçularla, Hanefîlerin dışındaki hukukçular arasında orta bir yol izleyerek, ortak velayet sistemini getiren İmam-ı Muhammed'in yaklaşımı, çağımızın durum ve gereksinimlerine daha uygun olacağı kanaatine ulaştık.Anahtar Sözcükler1-Evlilik sözleşmesi2-Rıza3-Cebir4-Seçme hakkı"
