abstract: "İmam Muhammed'in el-Asl adlı eserinin ibadet bölümlerinde kıyas terimini kullanmasıHer furû fıkıh eserinin arka planında müellifinin usul anlayışını barındırdığı düşünülmektedir. Şu halde ilk dönem Hanefî fıkıh ekolünün usulî görüşlerini Ebû Hanife ve Ebû Yusuf'a öğrencilik yapan Muhammed b. el-Hasen eş-Şeybânî'nin eserlerinde, bilhassa onun en kapsamlı ve ayrıntılı eseri olan el-Asl'da bulmak mümkün gözükmektedir.Şeybânî'nin el-Asl adlı eserinin ibadet bölümleri özelinde gerçekleştirilen bu çalışmada genel anlamda ilk dönem Hanefî usul anlayışında ?kıyas? terimine nasıl bir anlam yüklendiği sorusuna cevap aranmaktadır. Özelde ise ibadet bölümlerinde ?kıyas? terimini kullanmasından hareketle Şeybânî'ye fıkıh usulü edebiyatındaki ?ibadetlerde kıyas? tartışması hakkında bir görüş izafe edilip edilemeyeceği tartışılmaktadır."
