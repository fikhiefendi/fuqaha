abstract: "Hakîm İshak er-Rûmî; X. (XVI.) yüzyıl Osmanlı Dönemi âlimlerinden olup, ilmî sahada çok yönlü bir şahsiyettir. Din, tıp, edebiyat ve felsefe alanlarında yetkin biridir. Eserlerinden Hanefî-Mâtürîdî bir çizgide olduğu görülen Rûmî'nin tasavvufî yönü de bulunmaktadır. Bununla beraber Rûmî bize ulaşan eserinde herhangi bir tarikata intisabından bahsetmemektedir. Rûmî'nin kelâm alanında bize ulaşan en önemli ve tek eserleri Fıkh-ı Ekber'e yaptığı şerhin ihtisarı Muhtasar Hikmetü'n Nebeviyye'dir. Maalesef ihtisarı yapılan Hikmetü'n Nebeviyye bize ulaşmamış veya bir yerlerde keşfedilmeyi beklemektedir. Ebû Hanîfe'nin bu eserini şerh ederken meseleleri uzatmadan okuyucuya ehl-i sünnetin temel akidesini sunmaya, aklî ve naklî delillerle temellendirmeye çalışır. Yaptığı şerhinin çok uzun olmaması ve dilinin nispeten kolay olmasından dolayı akâid ilmini öğrenmek isteyen kimseler için bir başucu kitabıdır. Rûmî, Osmanlı Devleti'nin neredeyse her alanda güçlü olduğu“Yükselme Dönemi”nde yaşamıştır. Eserinde yaşadığı dönemin ve içinde bulunduğu toplumun tartışma konularının izlerine rastlanmaktadır. Bundan dolayı kimi zaman iki kelime ile izahı mümkün olan bir meseleyi uzun bir şekilde ele aldığı ve farklı şekillerde temellendirme yoluna gittiği görülür. Muhtemelen İstanbul veya Bursa'da doğup büyüyen ve burada yetişen Rûmî 1543'de vefat etmiştir. Ardında bir çok eser bırakmasına rağmen bu eserleri bize ulaşmamış veya hala kütüphanelerin tozlu raflarından birinde keşfedilmeyi bekliyor. Şuan bize ulaşan tek eseri Hanefî mezhebinin kurucu imamı Ebû Hanîfe'nin el-Fıḳhü'l- ekber'ine yaptığı Muhtasar Hikmet-ün Nebeviyye adlı şerhidir. Rûmî'nin Muhtasar Hikmet-ün Nebeviyye adını verdiği şerhindeki itikadi görüşleri bu çalışmamızın ana konusudur. Çalışmamızda ayrıca Rûmî'nin hayatı, hocaları, talebeleri ve eserleri hakkında da bilgi verilmiştir. Birinci bölümde Rûmî'nin hayatı ve ilmî kişiliği; ikinci bölümde Muhtasar Hikmet-ün Nebeviyye adlı eserine, üçüncü bölümde ise itikadi görüşlerine ve dördüncü bölümde Muhtasar Hikmet-ün Nebeviyye adlı şerhin tercümesine yer verilmiştir. Çalışmada Rûmî'nin yaşadığı dönem olan X. (XVI.) yüzyılın sosyokültürel özelliklerine de yer verilmiştir. Sonuç kısmında ise Rûmî'nin elde ettiğimiz kelâmî görüşlerine dair izahlara yer verilmiştir. Yapılan değerlendirmeyle Rûmî'nin Hanefî- Mâtürîdî bir yaklaşımla tasavvufu, felsefeyi, mantığı ve pozitif ilimlerin harmanlanması neticesinde oluşturduğu zengin mirasın daha iyi kavranması günümüz problemlerine cevap bulmada bizlere ışık tutması amaçlanmıştır."
