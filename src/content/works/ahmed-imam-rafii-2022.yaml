abstract: "İmam Râfiî Şafii mezhebini yazılı hale getiren kişi olarak görülmektedir. Şafii mezhebinde kaleme aldığı eserlerden birisi de“Fethu'l-Aziz”kitabıdır. Bu eser Gazzali'nin el-Veciz adlı eserinin şerhidir. Kendisinin bu kitapta mezhepte bazı tercihleri öne çıkmıştır. Elimizdeki çalışma; giriş, hazırlık ve üç ana bölüm ile bir sonuç bölümünden oluşmaktadır. Hazırlık bölümünde; Şâfiî mezhebinin ortaya çıkışı ve gelişmesi, imam Râfiî'nin biyografisi ve eseri“Fethu'l-azîz ve'l-maksûd bihtiyârihi fih”kitabının tanıtımı ele alınmış ve geri kalan üç bölümde namaz bölümündeki on sekiz konu incelenmiştir. Birinci bölümde, cemaati ilgilendiren konular, ikinci bölümde imamla ilgili meseleler ve üçüncü başlık altında da namaz konusundaki farklı meseleler ele alınmıştır. Herbir konu önce açıklanmış, ardından konu ile ilgili İslam hukukçularının görüşleri ve delilleri aktarılmış sonra imam Râfiî'nin konu ile tercihi belirtilmiş son olarak da konu ile ilgili araştırmacının çıkarımı ve Nevevî'nin görüşünün, Râfiî'nin görüşü ile ne derece uyumlu olup olmadığı belirtilmiştir. Araştırma sonunda birçok sonuç ve değerlendirme yapılmıştır. Bunlarden en önemlisi Nevevî'nin tercihlerindeki delillerin güçlülüğü nedeniyle birçok meselede Râfiî ile aynı görüşte olduğudur. Tercihlerinde en çok kullandığı ifade el-esah ve el-ezhar ifadeleridir. Yazar tercihlerini bir delil ya da fakihlerden birisinin görüşü ile desteklemektedir."
