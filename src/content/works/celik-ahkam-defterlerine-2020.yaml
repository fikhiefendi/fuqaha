abstract: "Çalışma, idarî ve ekonomik bakımlardan Osmanlı'nın önemli bölgelerinden biri olan Sivas eyaletinde yaşamış halkın, XVIII. yüzyılda Sivas Ahkâm Defterleri'ne yansımış sosyo-ekonomik faaliyetleri ve çeşitli sorunları üzerinden hazırlanmıştır. Böyle bir konunun tercih edilmesindeki en önemli sebep, incelediğimiz dönem ve kaynaklar üzerinde yeterli çalışmaların yapılmamış olmasıdır. Ana kaynak grubumuz olan Sivas Ahkâm Defterleri, şikâyetini sunmak için Divân-ı Hümâyûn'a gitmiş halkın sorunlarının ve bu sorunlara önerilen çözümlerin kaydedildiği divan tutanaklarıdır. Atik Şikâyet Defterleri'nin devamı niteliğinde olan bu defterler baştan sona sorun içermektedir. Ancak şikâyetini divana sunan kişi farkında olmadan çok önemli ayrıntıların kayıtlara geçmesini sağlamıştır. Sivas Ahkâm Defterleri'ne kaydedilmiş hükümlerden elde edilen bilgiler, halkın gündelik yaşamı ve sorunları hakkında malumat verirken dönemin değerlendirmesini yapma imkânı da sunmaktadır. Devletin içerisinde bulunduğu siyasî ve ekonomik durumun gerek halk gerek yöneticiler gerekse diğer görevliler üzerindeki etkilerini görmek mümkündür. Çalışmanın ortaya çıkarmayı amaçladığı konulardan biri de merkez-taşra ilişkileridir. İncelediğimiz kaynaklar hem hukukî hem de sosyo-ekonomik yönlerden bu arayışa cevap verecek nitelikte olmuştur. Kaynaklarımızın ve mekânımızın tanıtıldığı giriş kısmı haricinde iki bölümden oluşturduğumuz çalışmamızın ilk bölümünde, Sivas eyaletinde şikâyet sisteminin işleyişi, halkın Divan-ı Hümâyûn'a başvuru hakkı ve şekilleri konularına değinilmiştir. Ayrıca divana şikâyetini sunmuş kişiler cinsiyet, meslek, ikamet edilen bölge gibi çeşitli açılardan değerlendirilmiştir. İkinci bölüm ise halkın genel problemleri üzerinden şekillendirdiğimiz asayiş, toprak, vakıf, aile ve alacak verecek olmak üzere kendi içerisinde beş ana başlığa ayrılarak ele alınmıştır."
