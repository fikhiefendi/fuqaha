abstract: "İslam dünyasının kendisine maddeten terakki ve ruhen tekâmül olanağı sağlayabilecek temel öğretilerinden uzaklaşarak gerilemesi ile batı toplumunun, maddi olarak gelişme sürecini yaşaması eş zamanlı fakat ters orantılı olmuştur. Ancak dünyanın global bir şekil alması ve Batı'nın kültürel yapısı lehinde tektipleşen bir iktisadi-hukuki yapıya zorlanması, ciddi bir za'fiyet içerisinde olan müslüman toplumun buna karşı mukavemet göstermesine engel olmuş, dolayısıyla karakteristik yapısı farklı olan pek çok sorun ve sorun haline gelen batı modelli çözümlerin İslam toplumuna taşınmasına neden olmuştur. Ülkemizde 1913 Adapazarı İslam Ticaret Bankası ile başlayan İslamî finans piyasası, sonrasında ekonomik krizler karşısında göstermiş olduğu mukavemet dolayısı ile hızla büyümeye ve gelişmeye başlamıştır. Buna karşın İslam toplumu Karz-ı Hâsen, Murabaha, Mudaraba, Müşaraka, Selem, İstisnâ, İcara, Tekâfül ve Sukuk benzeri finansal araçlara mahiyetlerini tam olarak bilmemesi nedeni ile temkinli yaklaşmakta, İslamiyet'e uygunluğunu ve diğer finansal araçlardan farklılığını sorgulamaktadır. Finans kurumlarının içerisinde bulunduğu sistemin faiz barındırması nedeni ile İslamî esaslara uygunsuzluğu, bu tür finansal araçları gerekli kılmıştır. Bu nedenle çalışmada dünyanın birçok ülkesinde kullanılan ve ülkemizde de hâlihazırda ele alınan İslamî finansal araçların fıkhî mezhebler açısından nasıl ele alındığı ve uygulanmasında hangi esasların dikkate alındığı incelenmiş mahiyetlerinin ne olduğu İslam'a uygunluk ölçüsüyle ele alınarak mezheblere göre İslamî finansal araçlar karşılaştırmalı olarak analiz edilmiştir."
