abstract: "Bu çalışma, katılım bankacılığında benimsenen meslekî etik ilkelerin (şeffaflık, davranışsal güven, adalet ve ayrımcılık yapmama, dijital uygulamalar ile şer'î uyum ve hizmet kalitesi boyutları çerçevesinde) müşteri algısındaki yapısal bütünlüğünü ve söz konusu boyutlar arasındaki ilişkileri incelemeyi amaçlamaktadır. Araştırma, Türkiye'de faaliyet gösteren katılım bankalarının müşterileri üzerinde gerçekleştirilmiş olup 418 katılımcıdan elde edilen veriler IBM SPSS Statistics programı aracılığıyla analiz edilmiştir. Tüm analizlerde anlamlılık düzeyi α = 0.05 olarak kabul edilmiştir.Güvenilirlik analizi sonucunda ölçeğe ait Cronbach's Alpha katsayılarının 0.715 ile 0.900 arasında değiştiği ve ölçeğin yüksek düzeyde iç tutarlılığa sahip olduğu belirlenmiştir. Betimsel istatistikler, boyut ortalamalarının 3.24 ile 3.60 arasında değiştiğini ve katılımcı değerlendirmelerinin orta–orta yüksek düzeyde yoğunlaştığını göstermektedir. Korelasyon analizi sonuçları, tüm boyutlar arasında pozitif ve istatistiksel olarak anlamlı ilişkiler bulunduğunu ortaya koymuştur (r = 0.526–0.772; p < 0.01). En güçlü ilişkinin davranışsal güven ile dijital uygulamalar arasında olduğu tespit edilmiştir (r = 0.772).Keşfedici faktör analizi bulgularına göre KMO değeri 0.896 olarak hesaplanmış ve Bartlett küresellik testi anlamlı bulunmuştur (p < 0.001). Altı boyutun tek bir faktör altında toplandığı ve bu faktörün toplam varyansın %69.8'ini açıkladığı belirlenmiştir. Bu sonuç, katılım bankalarındaki meslekî etik uygulamaların müşteri algısında bütüncül bir yapı olarak değerlendirildiğini göstermektedir.Farklılık analizleri sonucunda cinsiyete göre anlamlı bir farklılık bulunmazken (p = 0.986), yaş değişkenine göre istatistiksel olarak anlamlı farklılık tespit edilmiştir (F = 2.879; p = 0.023). Genel olarak bulgular, meslekî etik uygulamaların kurumsal güvenin inşasında ve müşteri algısının şekillenmesinde bütünleşik bir etki alanı oluşturduğunu ortaya koymaktadır."
