abstract: "Bu çalışmanın amacı, Türkiye'de katılım bankalarının AAOIFI faizsiz finans muhasebe standartlarına uyum düzeyini ölçerek uluslararası muhasebe ve finansal raporlama standartları ile AAOIFI muhasebe standartlarının arasındaki ilişkiyi ortaya koymaktır. Bu çalışmadaki bilgilerin kaynağı 2017 yılında Türkiye ve Bahreyn İslami bankalarının yıllık finansal raporlarıdır. Uyumun ölçülmesi için ağırlıksız bir açıklama endeksi kullanılmıştır. Bu çalışmanın sonucu beklendiği gibi, Türkiye'deki katılım bankalarının mali tablolarında genel sunum ve açıklama ile ilgili AAOIFI standartlarına uyum düzeyinin, Bahreyn'deki katılım bankaları tarafından yapılan uyum düzeyinden daha düşük olduğunu göstermektedir. Türkiye'deki katılım bankalarının gösterdiği ortalama uyum düzeyi % 54,06'dır ve Türkiye'deki tüm bankaların UFRS/UMS standartlarını uygulamasından dolayı, AAOIFI ve IASB standartları arasında güçlü bir bağ/ilişki olduğu sonucuna varılmıştır. AAOIFI standartlarına uyum bakımından, Bahreyn'de katılım bankaları arasında önemli farklar olduğuna varılmıştır."
