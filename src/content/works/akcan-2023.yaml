abstract: "Fıkıh usulü, fıkhi hükümlerin kendisinden üretildiği bir ilimdir. Bu nedenle bir mezhebin fıkhi meseleleri, aynı mezhebin usul kurallarına uygun olmalıdır. Başka bir deyişle, ferî hükümlerin usul kurallarına uygun olması gerekmektedir. Fakat buna rağmen, herhangi bir nedenle mezhebin usulüne uymayan mezhebin fıkhi meseleler, o mezhepte vuku bulabilir. Bu çalışma, Hanefi mezhebinde fıkıh usulü ile uyuşmayan fıkhi meseleleri üzerinde ittifak edilen Kitap, Sünnet, İcma, Kıyas fıkhi deliller başlıklarında bulmayı, bu meselelerin ortaya çıkma nedenlerini belirlemeyi ve fıkıh usulü kitaplarında yer alan usul kurallarının fıkhi meselelere uygunluğunu belirlemeyi amaçlamıştır. Çalışmamın sonuçları şunları göstermektedir: Birinci olarak, Hanefilerde usule uymayan fıkhi meselelerin kavramı, Hanefilerin kitaplarında bulunan ve Hanefi fıkıh usulü kurallarına uymayan fıkhî meseleleri ifade eder. İkinci olarak, Hanefi imamlarının Hanefi fıkıh usulü kurallarına uygun olmayan hükümler ortaya koymaları İslam hukukuna uygun bir durumdur. Üçüncü olarak, bu fıkhi meselelerin ortaya çıkmasına yol açan sebepler arasında, imamların fıkhî meseleyi farklı anlamaları, başka bir usul kurallarını benimsemeleri, kolaylık veya ihtiyat yönünü seçmeleri ve bazı usul kuralını diğerlerine önceliklendirmeleri gibi önemli etkenler bulunmaktadır. Dördüncü olarak, usule uymayan fıkhi meseleleri Hanefi hukukçularının görüşlerini inceleyerek ve meseleyi mezhep usullerine uymadığını belirten beyanlarına başvurarak araştırabiliriz. Beşinci olarak, fıkhın ve usulün çoğu başlığı altında usule uymayan fıkhî meseleler bulmak mümkündür."
