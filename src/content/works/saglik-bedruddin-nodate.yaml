abstract: "İbn Cemâa'nın Savaş Hukuku İle İlgili Görüşleri ve Tecnidü'l-Ecnâd Adlı Eserinin Tahkik ve Tahlili Tez konumuzu belirlerken dünyada meydana gelen nice savaşların belli bir hukuka ve nizama bağlı kalmaksızın gerçekleşmesi, bizi İslam'da uygulanması gereken savaş hukuk nizamının incelikleri ve güzel yönlerini araştırmaya sevk etti. Böylece bu durum genel olarak Müslümanın savaşırken dahi İslam hukukunda riayet etmesi gereken temel insan hakları ve ilkelerini belli bir prensip içinde incelememize neden olurken özelde ise döneminin gereği bu konunun önemli ismi Bedrüddin İbn Cemâa ve onun savaş hukuku ile ilgili görüşleri mevzuunu araştırmaya bizi sevk etti. Tez çalışmamız sırasında istifade ettiğimiz başlıca kaynaklar; Kur'ân-ı Kerim, hadisler, sahabe söz ve uygulamaları ile füru fıkıh kitaplarının \"Kitâbu'l-Cihâd\" ve \"Kitâbu's-Siyer\" bab başlıkları ve \"ahkâmu's-sultâniyye\" tarzında yazılmış fıkhî-siyasi içerikli temel eserler olmuştur. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde Bedrüddin İbn Cemâa'nın hayatı, fıkhî eserleri ve literatür değerlendirmesi konularına yer verildi. Buna göre İbn Cemâa'nın hayatı başlığında onun ailesi, nesebi, çevresi, yaşadığı dönemde sosyal ve idari hayat, ilmi hayatı hakkında bilgi verildi. İbn Cemâa'nın fıkhî eserleri başlığında ise onun savaş hukukuna dair eserleri ve diğer fıkhî eserleri zikredildi. Literatür değerlendirmesi başlığında ise öncelikle genel olarak İslam'da savaş hukukunun gelişimini, bu çalışmanın hedefini, kaynaklarını ele aldık. Daha sonra çalışma konumuzun kaynaklarından olan ahkâmu's-sultâniyye tarzında yazılan eserlerin özellikleri ve konularından bahsettik. Ardından Bedrüddin İbn Cemâa'nın savaş hukuku alanında temayüz ettiği \"Tecnîdü'l-Ecnâd\" adlı eserinin özellikleri ve işlediği konular dile getirilerek bu eserin öznelliğine dikkat çekilmiştir. Ayrıca İbn Cemâa'nın bu alanda ilmi çalışmalara katkısını belirten Bshart Ali ve Hans Kofler'in makalelerine, onun hakkındaki görüş ve değerlendirmelerine yer verdik. Bu bağlamda İbn Cemâa'nın hayatı ve eserleriyle dönemindeki konumu ve sonraki dönemlere etkisi dile getirilmiştir. Çalışmamızın birinci bölümünde öncelikle İbn Cemâa'ya göre savaş hukuku başlığı altında savaş hazırlığı ve âdâbı ile ve orduyla ilgili görüşleri konuları ele alınmıştır. Savaş hazırlığı ve âdâbı başlığında; Resulullah'ın (s.a) savaş kuralları, savaşta İslâm'a davet yöntemleri, cihadın fazileti, savaşın hukuki sonuçları, casusların durumu, asilerle savaş durumu, savaş esirlerinin durumu, anlaşmalar, istihbarat faaliyetleri, elçi ve müstemen alt başlıklı konulara yer verdik. Orduyla ilgili görüşleri başlığında ise ordu komutanlığı, kumandanın özellikleri, kumandanın hakları ve görevleri alt başlıklı konuları ele alınmıştır. İkinci bölümde İbn Cemâa'ya göre savaş gelirleri ve giderleri başlığında ise öncelikle savaş gelirleri alt başlığında ganimet, fey gelirleri, harac ve ıkta arazi gelirleri, öşür ve cizye gelirleri konularına yer verdik. Daha sonra savaş giderleri başlığı altında ise devlet görevlilerinin maaşları, asker maaşları, tenfil, kadıların maaşları, devlet başkanın şahsî ve kamu malı konularını işledik. Üçüncü bölümde \"İbn Cemâa'nın Tecnîdü'l-Ecnâd Adlı Eserinin Tahkiki ve Tahlili\" başlığında onun, \"Tecnîdü'l-Ecnâd ve Cihâtu Ehli'l-Cihâd\" adlı eserinin tahkik ve tahlili çalışmamıza yer verdik. İbn Cemâa'nın söz konusu eserinin tahkiki ve tahlili başlığını, Tecnîdü'l-Ecnâd ve ilgili eserlerin kaynakları ve muhtevası ile Tecnîdü'l-Ecnâd adlı eser, muhtevası ve tahkikinde izlenen yöntem başlıkları altında inceledik. Tecnîdü'l-Ecnâd ve ilgili eserlerin kaynakları başlığı altnda İbn Cemâa'ya atıf yapılan kaynaklar, Tecnîdü'l-Ecnâd'da yer alan kaynaklar, Müstened Fi Fadli'l-Cihâd'da yer alan kaynaklar ve Tecnîdü'l-Ecnâd ve ilgili eserler başlıklarıyla konular işlenmiştir. Tecnîdü'l-Ecnâd adlı eser, muhtevası ve tahkikinde izlenen yöntem başlığı altında ise Tecnîdü'l-Ecnâd eserinin telifi, ismi, metodu, dili ve üslubu ile Tecnîdü'l-Ecnâd'ın muhtevası ve değerlendirilmesi başlıklarıyla konular işlenmiştir. Yukarıdaki birinci başlık altında eserin telifi ve ismi ile eserin metodu, dili ve üslubu konularına yer verilmiştir. Yukarıdaki ikinci başlık olan Tecnîdü'l-Ecnâd'ın muhtevası ve değerlendirilmesi başlığı altında ise Tecnîdü'l-Ecnâd'ın muhtevası, Tecnîdü'l-Ecnâd'daki konular ve değerlendirilmesi ve Tecnîdü'l-Ecnâd'ın tahkiki alt başlıklarıyla konular ele alınmıştır. Tezin son kısmında, Bedrüddin İbn Cemâa'ya ait söz konusu \"Tecnîdü'l-Ecnâd ve Cihâtu Ehli'l-Cihâd\" adlı eserin tahkikli Arapça metnine yer verilmiştir."
