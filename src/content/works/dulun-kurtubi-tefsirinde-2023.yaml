abstract: "“Kurtubî‟nin Tefsirinde Kıssa-Ahkâm İlişkisi –Hz. Yûsuf ve Hz. Mûsâ Kıssaları Örneği-”adlı bu çalışmamızda Kurtubî‟nin el-Cami‟ li-Ahkâmi‟l-Kur‟an isimli ahkâm tefsirinde Kurtubî‟nin kıssalarla alakalı takip ettiği metot üzerinde incelemelerde bulunduk. İlk bölümde kıssalar ve ahkâmla alakalı daha çok teorik denilebilecek temel meselelere yer verdik. İkinci bölümde ise Kurtubî‟nin kıssalara nasıl yaklaştığını, kıssalardan hangi hükümleri çıkardığını, hüküm çıkarırken hangi hususları gözettiğini vb. analiz ettik. Çalışmamızı Hz. Yûsuf ve Hz. Mûsâ kıssalarındaki bazı âyetlerle sınırlandırdık. Alimlerimiz Kur‟an ve sünnette çözümünü bulamadıkları meseleler hakkında içtihat yaparken farklı yollar takip etmişlerdir. Kurtubî gibi bazı alimlerin dikkatini de kıssalar çekmiştir. Sonuç olarak Kurtubî sarih âyetlerin bulunmadığı konularda kıssaları ahkâmın kaynağı olarak görmüştür. Ancak Kurtubî‟nin kıssalardan çıkardığı hükümlere bakıldığında bunların daha çok aslî hükümler değil, tâlî hükümler olduğunu görüyoruz. Çıkarmış olduğu pek çok hükmü doğrudan kıssalardan çıkarmadığını, daha önce zihninde olan hükmü kıssalardan delillendirdiğini görürüz. Belki de Kurtubî‟nin zihni sıfırlanıp, daha önce elde etmiş olduğu birikimi yok edilecek olsa sadece kıssalar üzerinden çalışmamızda da zikri geçen sonuçlara ulaşamazdı."
