abstract: "Çalışmamızda Osmanlı döneminde Hanefi ekolünün ana kaynaklarından birini teşkil eden Halebî'nin Mülteka'l-ebhur adlı eserinin önemli şerhlerinden biri olan Vahdetî Osman Efendi'nin Mühtede'l-enhür'ünün Kerâhiye bölümünün tahkiki ve değerlendirilmesi yapılmıştır. Vahdetî Osman Efendi'nin eserinden ele aldığımız bölüm yedi fasıldan oluşmaktadır. Vahdetî Osman Efendi şerhte eserin hem konularını genişletmiş hem de ayet, hadis ve muhtelif kaynaklarla desteklemiştir. Araştırmamız giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş kısmında araştırmanın amacı, önemi, kapsamı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde eserin müellifi el-Halebî ve eseri Mülteka'l-ebhur, çalışmamızın konusu olan Mülteka'l-ebhur'un şerhi, Mühtede'l-enhür'un müellifi ve eseri Mühtede'l-enhür hakkında bilgi sunulmuştur. İkinci bölümde tahkik edilen metnin tetkiki ve değerlendirmesi yapılmıştır. Üçüncü bölümde ise eserin elde edilen dört nüshası temelinde İSAM'ın tahkikli neşir esasları çerçevesinde tahkiki ve içinde bulunan ayet ve hadislerin tahrici bulunmaktadır. Sonuç bölümünde ise konunun olumlu, olumsuz yönlerine ve ilim dünyasına katkılarına yer verilerek çalışma tamamlanmıştır."
