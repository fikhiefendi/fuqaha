abstract: "Tezimiz, biri giriş olmak üzere üç bölümden oluşmaktadır. Birinci bölüm; uluslararası, uluslararası anlaşmalar ve bağlayıcılık kavramlarının tahlilî hakkındadır. Ayrıca bu üç kavramın, klasik İslam hukuku kaynaklarındaki karşılıkları kavramsal çerçeve bağlamında yine bu bölümde araştırılmaktadır. İkinci bölüm; günümüzde yapılan uluslararası anlaşmaların, İslam hukukundaki yeri hakkındadır. Müstakil bir konu olarak günümüzdeki uluslararası anlaşmalar, klasik İslam hukuku kaynaklarında bulunamamaktadır. Modern anlamda uluslararası anlaşmalar, batı hukuk sistemine göre hazırlanmış ve son yüzyılda geliştirilmiştir. Klasik İslam hukuku eserleri ise konuyu, Mütareke anlaşmaları bağlamında ele almıştır. Muvâdea, Hüdne, Muhâdene gibi kavramlar ile adlandırılan Mütareke anlaşmaları, Hanefî mezhebine göre zaruret olsun veya olmasın salt maslahat kuralı üzerine inşa edilmiştir. Şafîi, Mâliki ve Hanbelî mezheplerine göre ise bu tür anlaşmalar sadece zarurete binaen yapılabilmektedir. Ayrıca Mütareke anlaşmalarının bağlayıcılığı konusunda Hanefîler, diğer mezheplere nazaran daha Şe'niyetçi(realist) yaklaşmıştır. Üçüncü bölüm; Batı hukukuna göre uluslararası anlaşmaların durumu hakkındadır. Yapmış olduğumuz araştırmalara göre günümüz uluslararası anlaşmaların bağlayıcı olmasını sağlayacak yaptırım sistemi bulunmamaktadır. En azından güçlü devletler nazarında bu tür anlaşmaların bağlayıcı olmadığı dillendirilmektedir. Batı hukukuna göre akdedilen uluslararası anlaşmaların ana fikri birkaç teoriye göre şekillenmektedir. Özellikle Realizm ve Liberalizm teorileri, günümüzde hem diplomasiye hem de uluslararası anlaşmalara yön vermektedir."
