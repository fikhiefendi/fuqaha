abstract: "Kâsânî'nin furû' fıkha ait olan Bedâi'u's-Sanâi' fî Tertîbi'ş-Şerâi' adlı eseri bağlamında fıkıh usûlüne ilişkin görüşlerini tespit etmeyi hedeflediğimiz bu çalışmamız, Giriş, Üç Bölüm ve Sonuç'tan oluşmaktadır. Giriş bölümü iki kısımda işlenmekte olup ilk kısmında tezin amacı ve yöntemi hakkında bilgi verilirken, ikinci kısmında Kâsânî'nin hayatı ve eseri hakkında bilgiler verilmektedir. Birinci Bölüm'de Kâsânî'nin hüküm ve hükümlerin gayelerine bakışı işlenmektedir. İkinci Bölüm'de hükmün kaynakları hakkında görüşler ele alınıp eserde bunları ne şekilde kullandığına dair bilgi verilmektedir. Üçüncü Bölüm'de Kâsânî'nin nasslardan hüküm çıkarırken nasıl bir usûl takip ettiği, ictihâd ve taklid hakkındaki görüşleri, eserinde geçen görüşlerden ne şekilde tercihte bulunduğu ve onun tevakkuf kavramını kullanımı ele alınarak işlenmektedir. Sonuç bölümünde ise genel bir değerlendirme yapılmaktadır."
