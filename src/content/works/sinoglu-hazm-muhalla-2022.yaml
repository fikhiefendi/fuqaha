abstract: "Zâhirî mezhebinin önde gelen fakîhlerinden İbn Hazm ismiyle müsemma olmuş Ebû Muhammed Alî b. Ahmed b. Saîd b. Hazm el-Endelüsî el-Kurtubî V/XI. yüzyılda Endülüs'te yaşamıştır. Fıkhî eserleri ile tanınan İbn Hazm aynı zamanda kelam, hadis, edebiyat, tarih, tıp, dil, mantık gibi alanlarda da önemli eserler telif etmiştir. Bu çalışmada İbn Hazm'ın el-Muhallâ bi'l-âsâr fî şerhi'l-Mücellâ bi'l-ihtisâr adlı eserinde, Hanefî mezhebinin önde gelen fakîhlerinden ve ayrıca ilk“kâdılkudât”ünvanını alan Ebû Yûsuf Ya'kûb b. İbrâhîm b. Habîb b. Sa'd el-Kûfî'ye atfedilen görüşlerin tahkik edilmesi amaçlanarak hazırlanmıştır. On bir ciltlik el-Muhallâ adlı eserde Ebû Yûsuf'a atfedilen 185 görüş tespit edilmiş ve bu görüşler Hanefî mezhebine ait birincil kaynaklar üzerinden mukayese edilerek değerlendirilmiştir. Çalışmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı, metodu ve sınırlılıkları yer almaktadır. Birinci bölümde İbn Hazm'ın hayatı, ilmi şahsiyeti, eserleri kısaca aktarılmış olup el-Muhallâ adlı eser ayrı bir başlık altında ele alınmıştır. İkinci bölümde Ebû Yûsuf'un hayatına, ilmi şahsiyetine ve eserlerine yer verilmiştir. Çalışmamızın üçüncü bölümünde ise İbn Hazm'ın el-Muhallâ adlı eserinin tamamında Ebû Yûsuf'a atfedilmiş olan görüşler tahkik edilmiştir. Sonuç bölümünde ise tespit edilen hatalı görüş sayısı beyan edilmiş kısa bir kritiği yapılarak çalışma sonlandırılmıştır."
