abstract: "İslam dinine ait ibadetlerden namaza hazırlık için gerekli olan abdest eylemi de İslam fıkhında bir ibadet gibi kabul edilir. Bu ibadetin ve aynı şekilde İslamî ibadet biçimi olan orucun kapsamı (nasıl, hangi durumlarda yapıldığı ve hangi durumlarda bozulduğu) fıkıh literatüründe ayrıntılı olarak incelenmiştir. Abdest ve orucu bozan durumların tıbbî gelişmelere göre yeniden değerlendirilmesi adlı tezimizde İslam-tıp ilişkisi dikkate alınarak, bu iki ibadetin bozulma durumları fıkıh ve tıp açısından ele alınmıştır. Özellikle orucun bozulması sonrasında kişiye yüklenen vazifeler dört mezhebe göre karşılaştırmalı olarak incelenmiştir. Çalışmamız üç bölümden oluşmaktadır. Birinci bölümde İslam-tıp ilişkisi ele alınmıştır. İkinci bölümde abdestin kavramsal çerçevesi ile abdesti bozan durumların fıkıh ve tıp açısından incelemesi yapılmıştır. Üçüncü bölümde de orucun kavramsal çerçevesi ile orucu bozan durumlar fıkıh ve tıp açısından incelenmiştir. Sonuç kısmında ise konu ile elde edilen bilgilerin genel değerlendirmesi sunulmuştur."
