abstract: "Katılım bankacılığı, faizsiz çalışma ilkesi ile faaliyet gösteren, bu ilkeye uygun olan her türlü bankacılık faaliyetlerini gerçekleştiren, mevduat toplama ve fon kullandırma faaliyetlerinde kar ve zarara ortak etme esasına göre çalışan bir bankacılık modelidir. Ülkemizdeki adı ile katılım bankalarının isimlerindeki“katılım”sözcüğü bu bankalara kaynak sağlayan mevduat sahiplerinin kar ve zarara katılmalarını ifade etmekte olup bu modelin ticari faaliyetlerinde kar veya zarara ortak olma prensibine dayalı bir bankacılık sistemi veya modeli olduğunu vurgulamak için kullanılan bir terimdir. Katılım bankacılığı, uygulamada ülkemizde Türk Bankacılık Sistemine alternatif bir model değil, aksine sistemin tamamlayıcısı bir banka modeli olmuştur. Bu bankalar bankacılık sistemi içerisinde yer alan 'Klasik Mevduat Bankaları' ile 'Kalkınma -Yatırım Bankaları' çeşitlerine ek üçüncü çeşit bir bankacılık modelidir. Katılım bankaları işlevsel açıdan daha çok mevduat bankalarına benzemekle birlikte fonları toplama ve kullandırma yöntemlerinin işleyişindeki farklılar ile diğer bankalardan ayrışmaktadırlar. Ülkemizde kurulmasının farklı gerekçeleri mevcut olmakla birlikte bu gerekçelerden ilki halkın bir kesiminin faiz ve faiz türü kazançlardan uzak durma tercihi ve bu tercihle faizlik bankalara gitmeyen fonların atıl kalması ve ekonomiye kazandırılamamasıdır. Sistemin tanınması ,bilinmesi ve gelişmesi son yıllarda faize hassasiyeti olan birey ve firmaların iktisadi olarak güçlenmesi ve iktisadi faaliyetlerin içinde daha aktif rol oynamaya istekli olmaları ile hız kazanmıştır. Dünyada 75 in üzerinde ülkede faaliyette olan ve yabancı ülkelerde genel itibari ile İslamic Bank olarak isimlendirilen bu kuruluşlar ülkemizde ilk olarak 1984 yılında faaliyete geçmişlerdir. Anahtar Sözcükler 1. Katılım Bankacılığı 2. Bankacılık Sistemi 3. Kar ve Zarara Katılma Prensibi 4. Katılım 5. Mevduat Bankacılığı"
