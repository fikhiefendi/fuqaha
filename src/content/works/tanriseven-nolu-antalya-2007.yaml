abstract: "viÖZETİdari, adli, sosyolojik, ekonomik ve etnografik bakımdan önemli kayıtlar içeren şer'iyyesicillerinin, tutulduğu yer ve tarihlerde yerel farklılıkların ortaya çıkarılması ve bu anlamdaşehir tarihinin aydınlatılmasında çok önemli yeri bulunmaktadır.Bu tezde 1862-1864 yılları arasında tutulan XII Numaralı Antalya Şer'iyye Siciliışığında Antalya'nın idari, adli, sosyo-ekonomik görüntüsü ortaya konulmaya çalışılmıştır.İncelenen dönemde Antalya'nın Konya eyaletine bağlı bir sancak olduğu ve özellikle II.Mahmut ve Tanzimat Döneminde ortaya konan idari, adli, ekonomik ve sosyal uygulamalarınAntalya'ya aynen yansıdığı görülmektedir. Bu dönemde Antalya'nın idari yapısındakaymakamlar, adli yapıda naiblerin sorumlu olduğu ve yapılan yenileşme hareketlerine uygunolarak yeni kurumların var olduğu tespit edilmiştir.Bu dönemde devletin iktisadi politikalarının Antalya'ya ne ölçüde yansıdığınıgöstermesi bakımından tedavülde bulunan paralar, çeşitli ürünlere ait fiyatlar; ayrıca ailelerindurumu ve etnik-dini yerleşim itibariyle kentin sosyal profili ortaya konularak, Antalya'nıntipik bir Osmanlı- Anadolu kenti olma özelliği göze çarpmaktadır."
