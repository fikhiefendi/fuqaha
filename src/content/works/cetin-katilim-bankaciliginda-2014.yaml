fullText: "https://tez.yok.gov.tr/UlusalTezMerkezi/TezGoster?key=q3-d9QtLoVA2OMExHSkJpa0V6NqBnWw88SiHT8YvMkYIHOaVTV9d8SeN1-04E0oN"
abstract: "Bu araştırmanın amacı katılım bankacılığı sektöründe müşteri ilişkileri yönetimi, müşteri tatmini ve müşteri sadakati ilişkisini araştırmaktır. Bu araştırmanın evreni 2013–2014 eğitim öğretim yılında İstanbul ili Pendik (3), Kartal (3), Sultanbeyli (3), Maltepe (3) İlçesinde bulunan 12 katılım bankasından yararlanan müşterilerdir. Bu evren içinden“Oransız Eleman Örnekleme”yöntemi kullanılmıştır. Bu araştırmada da 439 kişi örneklem olarak belirlenmiştir. Veri toplamak amacıyla araştırmacı tarafından hazırlanan“Kişisel Bilgi Formu”,“Müşteri İlişkileri Yönetimi, Müşteri Sadakati ve Müşteri Doyumu Ölçeği (Demirören, 2009)”,“ kullanılmıştır. Ölçeklerden elde edilen veriler kodlanarak bilgisayar ortamında SPSS paket programı yardımıyla çözümlenmiştir. Ölçeğin birinci bölümüyle ilgili verilere ilişkin frekans ve yüzde dağılımı alınmış, öğrencilerin tutumlarının ve algılamalarının belirlenmesine yönelik olarak aritmetik ortalama ve standart sapma, tutumlar arasında farklılığı ortaya koyabilmek için ikili karşılaştırmalarda ”t\" testi, ikiden fazla değişken gruplarının karşılaştırılmasında ise tek yönlü varyans analizi kullanılmıştır. Görüşler arasında anlamlı bir farklılık olup olmadığı α = 0.05 anlamlılık düzeyinde test edilmiştir. Ayrıca Pearson korelasyon analizi ilişkisel bağlantıları belirlemek için kullanılmıştır. Araştırmadan elde edilen bulgular şunlardır; Müşteri algılarına göre katılım bankalarında müşteri ilişkileri düzeyi kararsızlık seviyesindedir. Müşteri ilişkilerinde cinsiyet, yaş, medeni durum, eğitim durumu, meslek, gelir, müşteri türü müşterilik süresi değişkenine göre gruplar arasında anlamlı farklılık bulunmamıştır. Müşteri algılarına göre katılım bankalarında müşteri sadakati düzeyi kararsızlık seviyesindedir. Müşteri sadakatinde cinsiyet değişkenine göre grupların aritmetik ortalamaları arasında anlamlı farklılık bulunmuş, farklılığın kadınlar lehine olduğu anlaşılmıştır. Kadınlar erkeklere göre daha olumlu düşünmektedirler. Müşteri sadakati yaş, medeni durum, eğitim durumu, meslek, gelir, müşteri türü müşterilik süresi değişkenlerine göre anlamlı bir farklılık göstermemektedir. Müşteri tatmini düzeyinin kararsızlık seviyesinde olduğu görülmüştür. Müşteri tatmini, medeni durum değişkenine göre grupların aritmetik ortalamaları arasında anlamlı farklılık bulunmuş anlamlı farklılığın evliler lehine olduğu anlaşılmaktadır. Evliler bekarlara göre daha fazla oranda müşteri tatmini yaşamaktadırlar. Müşteri tatmininde cinsiyet, yaş, eğitim durumu, gelir, müşterilik süresi değişkenine göre anlamlı bir farklılık gösterip göstermediğini belirlemek amacıyla yapılan bağımsız grup t testi sonucunda grupların aritmetik ortalamaları arasında anlamlı farklılık bulunmamıştır. Müşterilerin algısına göre müşteri tatmini ölçeğinin meslek değişkenine göre anlamlı farklılık bulunmuştur. Söz konusu farklılığın çalışanla emekli arasında çalışan grup lehine olduğu görülmüştür. Çalışanlar emeklilere göre daha fazla müşteri tatmini yaşamaktadırlar. Diğer gruplar arasında anlamlı farklılık görülmemiştir. Müşterilerin algısına göre müşteri tatmini ölçeği puanlarının müşteri türü değişkenine göre anlamlı farklılık bulunmuş, farklılığın bireysel müşterilerden yana olduğu anlaşılmaktadır. Bireysel müşteriler ticari müşterilere göre daha fazla oranda müşteri tatmini yaşamaktadırlar. Müşteri ilişkileri ölçeği ile hem müşteri sadakati hem de müşteri tatmini arasında pozitif yönde anlamlı ilişkinin olduğu görülmektedir. Müşteri ilişkisi puanları yükseldikçe müşteri sadakati ve müşteri tatmini puanları da artmaktadır. Aynı şekilde müşteri sadakati ile müşteri tatmini arasında da pozitif yönde anlamlı ilişki vardır."
