abstract: "Çalışmamızı, sahâbe devrinden sonra fıkıh ve hadis vesikalarının henüz yeni ortaya çıktığı, İslâmȋ ilimlerin temellerinin atıldığı, tebe-i tâbiȋn döneminin önemli şahsiyetlerinden biri olan, özellikle Şam mıntıkasının imamı ve fakihi olarak tanınan, mutlak müçtehit ve mezhep sahibi İmam Evzâȋ'nin hayatı, eserleri ve aile hukuku özelinde Hanefȋ mezhebiyle farklı düşündüğü konuların değerlendirilmesi hakkındadır. Evzâȋ, başta hadis ve fıkıh olmak üzere, İslâmȋ ilimlere ilgi duymuş, bu ilimler hakkında birçok eser telif etmiştir. Ancak bu eserlerin çoğu ya günümüze ulaşmamış ya da gün yüzüne çıkarılamamıştır. Evzâȋ'nin İslâm medeniyetinde iz bırakan asıl yönü, iki buçuk asra yakın mezhebinin devam etmesidir. Öte yandan yaşadığı dönemin ileri gelen hadisçi ve fakihleriyle bir takım münazaralara girmesi, ulemanın nazarı dikkatini celp etmiştir. Bu bağlamda Ebû Hanîfe'nin siyer hakkındaki görüşlerine karşı görüşler beyan etmiş, Ebû Yusuf da iki imamın görüşlerini karşılaştırarak kendi imamının görüşünü destekler mahiyette deliller serd etmiştir. Biz de Ebû Yusuf'un bu tarzından esinlenerek Hanefȋ mezhebiyle Evzâȋ'nin aile hukuku hakkındaki farklı içtihatlarını karşılaştırarak tarafların delillerini ele aldıktan sonra, değerlendirmede bulunduk. Böylece Evzâȋ'nin usulde dayandığı deliller ve fıkıh alanındaki etkisini ortaya çıkarmaya çalıştık. Evzâȋ'nin, füru fıkhında Siyeru Evzâȋ isimli kitabının dışında günümüze ulaşan bir eseri olmasa da birçok konu hakkındaki görüşü, başta klasik dönem hadis, fıkıh ve tefsir kaynakları olmak üzere, son dönem kaynaklarda da bulmak mümkündür. Bu çalışmamızda Evzâȋ'nin, ele aldığımız meseleler hakkındaki görüşü ve dayandığı delilleri zikrettikten sonra, O'nun görüşünün yer aldığı kaynakları tespit ederek, bu görüşlerin geçtiği yere işarette bulunduk. V Evzâȋ'nin hüküm ıstınbatında izlediği metodu hakkında elimizde bir eser bulunmamaktadır. Ancak, içtihatta bulunduğu meselelerden izlediği metot anlaşılmaktadır. Bu bağlamda Evzâȋ'nin usulde izlediği metoda değindik."
