abstract: "20. yüzyılda yaşamış mütefekkir ve ıslahatçılardan biri de hiç şüphesiz Seyyid Ebû'l- A'lâ Mevdûdî'dir. 1857 sonrası İngilizlerin Hindistan bölgesindeki hâkimiyeti, dînî, siyasi, psikolojik ve sosyolojik sorunları da beraberinde getirmiştir. İçinde bulundukları durumdan çıkış yolu arayan Müslümanlarda Kur'ân ve Sünnete dönme arzusu oluşmuş, tam da böyle bir zaman zarfında Mevdûdî, karizmatik bir lider olarak ortaya çıkmıştır. Siyasal İslâmcı bir şahsiyet olarak Mevdûdî, siyasi ve dini temellerini oluşturmaya çalıştığı İslâmî bir hükümetin mücâdelesini vermiştir. Fıkıh ve itikad konusunda selefi anlayışı benimseyen Mevdûdî, Seyyid Kutub ve Hasan el-Bennâ'da da görüldüğü şekliyle, fertten topluma ve toplumdan da devlete ulaşacak şekilde yeryüzünde İlâhî düzeni inşâ etmeye çalışmıştır. O, Yeniden tanımlayarak özgün anlamlar kazandırdığı İlâh, Rab, ibadet ve din gibi temel kavramlar üzerinden kişilere, itikâdî anlamda geniş bir bakış açısı kazandırmaktadır. İslâmî uyanışı ve dirilişi sağlamada içtihada ayrı bir önem vermekte; dinamik bir hukuk anlayışını esas almaktadır. Hadisleri anlamada Hanefi merkezli yeni bir usûl önerisi de getiren Mevdûdî, Müslümanları bölgedeki Hindulara, Sihlere ve İngilizlere karşı himâye etmek için 1941'de Cemaat-i İslami'nin kurulmasına öncülük etmiş ve 1972 yılına kadar bu organizasyonun fiili liderliğini yürütmüştür. Müslümanların din algısı, eğitim sistemi, devlet nizamı, siyaset ve cemiyet gibi alanlarda yeni bir düşünce sistemini öngörmesi, onun ıslah anlayışının bir tezâhürüdür. Mevdûdî ile başlayan hareket, Seyyid Kutub gibi fikir adamlarına ve İran inkılâbı gibi olaylara yön vermiş ve günümüzde de etkisini koruyarak devam etmiştir."
