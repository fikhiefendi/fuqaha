abstract: "Bu araştırmanın konusu genelde kripto para birimleri, özelde“Ripple”dir. Araştırmanın problematiği, kripto para birimi olgusunun var olduğu ve her gün kripto paralarla milyarlarca dolarla işlem yapıldığı gerçekliğinden yola çıkılarak, bu para biriminin fıkhî nitelik ve dinî hüküm açısından değerlendirilebilmesi için yapı ve özelliklerini araştırma gerekliliğidir. Kripto paralardan Ripple'nin fıkhî boyutuna ulaşmak için, kripto paralarla ilgili olan araştırma ve görüşler incelenmiş, başta“Ripple”olmak üzere kripto para olgusu betimlenmiş ve bu paralarla ilgili olan konular analiz edilmiştir. Araştırmada nitel, tümevarımsal ve analitik yöntem takip edilmiştir. Araştırmada, ilk olarak kripto para birimleri hakkında genel bir bilgi verilmiş daha sonra da kripto para birimlerinden“Ripple”özel olarak irdelenmiştir. Araştırmanın sonunda Ripple'nin nakit işlevi görmediği için para özellliği taşımadığı, ayrıca Ripple ağı ile Ripple para birimi arasında bir ayrım yapılması gerektiği sonucuna varılmıştır. Nitekim Ripple ağı, alım satım işlemlerini yürütmek için bir araç olarak kullanılan elektronik bir program olup İslâma göre mübah kabul edilmektedir. Ripple para birimi ise, edinilebilen, alınıp satılabilen ve ticareti yapılabilen elektronik bir emtiadır. İslam hukukunda esas ve mahiyet bakımından Ripple para biriminin haram olduğuna dair bir delil yoktur. Ripple'nin platformlarda alım satım işlemlerine gelince, işlemin Blockchain'de kayıtlı olması şartıyla anlık alım satım câizken Ripple'nin üzerinde spekülasyon yapılması câiz değildir. Araştırmada ayrıca Ripple'nin zekatının zorunlu olduğu, Ripple'yi borç vermenin câiz olduğu, Ripple'nin emtia olarak değerlendirildiği için onda fâiz tahakkuk etmeyeceği ve Ripple ile mudârabe (emek sermaye ortaklığı) yapılamayacağı, yine Ripple bir nakit para hüviyetine kavuşamadığı için başka bir kripto varlıkla takasında faiz tahakkuk etmeyeceği sonucuna varılmıştır."
