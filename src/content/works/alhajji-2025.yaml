abstract: "Nesh (nâsih ve mensûh), Kur'ân-ı Kerîm ve Sünnet-i Nebeviyye'de meydana geldiği sabit olan şer'î ilim dallarından biridir. Bu bağlamda, Kur'an'ın Sünnet tarafından neshedilmesi ve Sünnet'in Kur'an tarafından neshedilmesi, İslâm âlimleri arasında en çok tartışılan meseleler arasında yer almakta ve bu konular hakkında birçok çalışma yapılmıştır. İmam Şâfiî'nin nesh teorisi, kendine özgü metodolojik bir yaklaşıma sahiptir. Şâfiî, Sünnet'in Kur'an'ı neshetmesini reddetmiştir. Bu tutumu, Kur'an'ın asli kaynak, Sünnet'in ise ona tâbi ve açıklayıcı bir konumda olması gerektiği yönündeki usûlî bir ilkeye dayanmaktadır. Bu nedenle, Sünnet'in kendisinden üstün olan Kur'an'ı neshetmesi mümkün değildir. Aynı şekilde, Şâfiî'ye göre, Kur'an'ın Sünnet'i neshetmesi de, ancak başka bir sahih Sünnet tarafından bu neshin desteklenmesi halinde kabul edilebilir. Bu çalışma,“hadislerde nâsih ve mensûh meselesi”ni ele almakta ve özellikle İmam Şâfiî'nin nesh konusundaki ilmî yöntemini açıklamayı amaçlamaktadır. Şâfiî'nin, neshin sabit olmadığını düşündüğü bazı hadislere neden itibar etmediği konusu detaylıca incelenmektedir. Araştırmanın en önemli sonuçlarından biri, Şâfiî'nin Kur'an'ın Sünnet ile neshedildiğine dair uygulamalı ve güvenilir bir örneği kabul etmemiş olmasıdır. Ayrıca, Sünnet'in Kur'an tarafından neshedilmesi de, yalnızca bu neshi açıkça destekleyen başka bir Sünnet bulunduğunda geçerli kabul edilmektedir. Bu çalışma, Şâfiî'nin özellikle er-Risâle adlı eserinde yer alan nesih konusundaki görüşlerini takip ederek analitik tümevarımsal bir yöntem benimsemiştir."
