abstract: "Modern zamanlarda maslahat ve makasıd konusu fıkıh usulünün en çok tartışılan konuları arasında yer almaktadır. Hatta kimileri makasıdu'ş-şerianın fıkıh usulünden bağımsız müstakil bir ilim dalı olması gerektiği yönünde görüşler ortaya koymuşlardır. Makasıd ve maslahat konusunda tartışılan hususlardan birisi de klasik dönem fıkıh mezheplerinin bu kavramlarla ilişkisidir. Abbasîler, Selçuklular ve Osmanlılar gibi büyük İslam devletlerinde yöneticiler tarafından genel kabule mazhar olan ve kimi zaman \"resmî mezhep\" olarak Kabul gören Hanefî mezhebinin maslahat düşüncesi ile ilişkisi de modern dönemde araştırılan konular arasında yer almaktadır. Hanefî mezhebi usul literatüründe maslahatın şer'î deliller arasında zikredilmemesi ve gerek maslahat gerekse makasıda ilişkin bir takım terimlere doğrudan yer verilmemiş olması kimileri tarafından Hanefî mezhebinin hükümlerin maslahat düşüncesine dayalı olarak ta'lil edilmesini kabul etmediği yorumlarına yol açmıştır. Biz, bu çalışmamızda bir yandan Hanefî mezhebinin usul eserlerinde maslahat düşüncesinin ne ölçüde yer aldığını tespite çalışırken diğer yandan da Hanefî mezhebinin en önde gelen eserlerinden olan Bedâiu's-sanai'de maslahatla ta'lil yönündeki uygulamaları tümevarımsal olarak tespite ve sonrasında da analiz etmeye çalıştık. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Birinci bölümde herhangi bir mezheple bağlantısı olmaksızın genel olarak maslahatın kavramsal çerçevesi üzerinde durduk. Bu kapsamda başta maslahat terimi olmak üzere bununla eş veya zıt anlamlı terimler üzerinde durduk. Ayrıca maslahatla ta'lilin anlamı, maslahata dayalı kıyas, makasıdla ta'lil gibi kavramlar ele alınarak bunlarla benzeşen yahut aralarında fark bulunan kavramları tespite çalıştık. İkinci bölümde ise maslahatla ta'lil konusunda usulcülerin görüşlerini tespit etmeye çalıştık. Bu kapsamda \"hikmetle ta'lil\", \"maslahatla ta'lil\", \"mesâlih-I mürsele ile ta'lil\" kavramları üzerinde durarak aralarındaki ilişki ve farklılıkları tespit ettik. Ayrıca Hanefilerin hükümleri maslahatla ta'lil ettiklerine dair usul eserlerinden hareketle temellendirmeler yaptık. İstihsan, örf gibi şer'î delillerin maslahatla ilişkisini tespit ederek Hanefilerde maslahata dayanan fıkıh kaideleri incelenip maslahat ve fıkıh kaideleri arasındaki ilişkiye dair tahliller yaptık. Araştırmamızın üçüncü ve son bölümünde Hanefîlerde özellikle İmam Kâsânî'nin Bedâ'i'u's-sanâ'i' adlı eserini merkeze almak suretiyle maslahatla ta'lile dayalı uygulamaları ele alıp analiz ettik. Araştırmamız sonunda Hanefî mezhebindeki kurucu imamların her birinin hükümleri maslahatla ta'lil ettiklerini tespit ettik. Bununla birlikte Hanefî usul ve furu söyleminde \"maslahat\" terimi doğrudan kullanılmayıp maslahat timeline dayalı ta'lil ve ictihadlar istihsan, örf, sedd-i zerîa gibi şer'î deliller veya umûmü'l-belvâ, zarar ve zaruret kaideleri gibi genel fıkıh kuralları üzerinde yapılmaktadır."
