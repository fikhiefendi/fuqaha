abstract: "Osmanlı toplumunun kapalı olan birçok yönünün aydınlığa kavuşturması yönünden yazılı tarihin veri kaynaklarından birisi de şer'iyye degterleri ya da bir diğer adıyla mahkeme kayıtlarıdır. Bu defterler sadece Osmanlı kanunlarının uygulanmasını değil, gündelik hayatın, iktisadi, sosyal ve idari hayatı güzel bir şekilde gösterebilme özelliğini taşımaktadır. Bu mahkeme kayıtlarından biri olan 405 Nolu Çermik Şer'iyye Sicili ile Diyarbakır'ın Çermik ilçesinin ekonomik, sosyal ve idari durumu araştırılmaya çalışılmıştır. 405 Nolu Çermik Şer'iyye Sicillerinin Transkripsiyonu ve Değerlendirilmesi, başlıklı bu çalışma; giriş ve iki bölümden oluşmaktadır. Giriş bölümünde; Şerʻiyye Sicillerinin tanımı, ortaya çıkışı ve öneminden bahsedilmiştir. Diyarbakır ve Çermik alanında çalışılan şerʻiyye sicillerine değinildikten sonra 405 Nolu Şerʻiyye defterinde kullanılan metod hakkında bilgi verilmiştir. Birinci bölümde; 405 Nolu Şer'iyye Sicili defterinin muhtevasının yanında incelenen şer'iyye sicilinin özetleri hem ayrı olarak ve hemde koyu harflerle transkrip edilen belgelerin üst tarafında verilmiştir. İkinci bölümde ise; transkript edilmiş olan belgelerden yararlanarak 1894-1895 yıllarında Çermik Kazası'nın ekonomik, sosyal ve idari yapısı hakkında bilgi verilmeye çalışılmıştır."
