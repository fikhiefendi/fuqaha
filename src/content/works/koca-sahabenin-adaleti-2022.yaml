abstract: "Hz. Peygamber'in (s.a.s.) söz ve uygulamaları demek olan hadisler, günümüze kadar sözlü ve yazılı nakil yoluyla ulaşmıştır. İlk dönemden itibaren râvîlerin birbirinden aktarması şeklinde teşekkül eden eden senedler râvîlerin güven, dürüstlük ve zabtları ölçüsünde bir değere sâhip olmuş ve dini konularda bağlayıcılık kazanmıştır. Hadislerin sened zincirindeki en önemli halkayı ise sahâbe kuşağı teşkil etmektedir. Muhaddislerin büyük kısmı sahâbenin tümünü dürüst ve güvenilir, teknik anlamıyla âdil kabul etmişlerdir. Diğer râvîlere uyguladıkları adâlet araştırmasını sahâbe kuşağı için gerekli görmemişlerdir. Bu çalışmada öncelikle teknik bir terim olan adâlet, ele alınmış ardından da sahâbenin adâletiyle neyi kastettikleri hadisçilerin kendi ifâdeleri çerçevesinde ortaya konulmuştur. Muhaddisler, benimsedikleri“sahâbenin tümü âdildir”prensibini desteklemek adına Kur'an'dan, Sünnet'ten, icmâdan ve aklî çıkarımlardan bazı deliller getirmişlerdir. Bu delillerin kendileri ve delil değerleri birinci bölümde ayrıntılarıyla ele alınmıştır. Özellikle icmâ iddiasının geçerliliği çalışmanın birinci ve ikinci bölümünün ana temasını teşkil etmektedir. Tüm başlıklar söz konusu icmâ iddiasının geçerliliğini sorgulamak adına sevkedilmişlerdir. Birinci bölümde ele alınan sahâbe tanımı farklılıkları ve ilk dönemde sahâbeye bakış gibi konular böyle bir amaca mâtuf olarak incelenmişlerdir. Bölümün sonunda ise sahâbenin adâleti prensibinin oluşum sürecinin genel haritası ortaya konulmaya çalışılmıştır. İkinci bölümde özel olarak Ehl-i Sünnet içerisindeki farklılaşmalar konu edilmiştir. Söz konusu farklılaşmadaki en önemli taraf olan Hanefiler özel bir incelemeye tâbi tutulmuş diğer mezheplerden farklı düşünen ulema daha genel bir araştırmayla çalışmadaki yerini almıştır. Çalışmanın üçüncü ve son bölümünde haklarında fısk, nifâk ve irtidât gibi nisbetler bulunan sahâbe kuşağına mensup isimler ele alınmış bunların rivâyetleri bulunup bulunmadığı, varsa şâhit ve mütâbilerinin olup olmadığı sergilenmeye çalışılmıştır. Üçüncü bölümdeki araştırmayla, bir ihtimal olarak haklarında ta'n bulunan sahâbîler ve rivâyetleri geçersiz sayılsa bile itikâdî ve amelî ahkâmdan müteşekkil olan İslâmî paradigmanın sistemsel bütünlük ve tutarlılığını koruyup koruyamadığı test edilmiştir."
