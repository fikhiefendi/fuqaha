abstract: "ÖZET İslâm hukukunda insan, bazı görevleri yapmakla yükümlü tutulmuştur. Bu görevleri yerine getirmesi ise ancak kudret sıfatına sahip olmasıyla mümkündür. Kısaca kudret kavramı, insanın sorumluluklarını yerine getirebilme gücü demektir. Bu gücün iki temel yönü vardır. Birincisi, kişinin kendine ait unsurlar; ikicisi ise, insanın dışında bulunan unsurlardır. Kudretin temeli, kişinin kendine ait olan fiziki gücüdür. Dışındaki unsurlar ise kişinin onlara sahip olması ile kudret kapsamına girerler. İslâm hukukunda yükümlülük için varlığı şart olan kudret budur. İslam bilginlerinin mahiyeti hakkında tartıştıkları kudret ise, fiili işleme anında ortaya çıkan güçtür. Kişi sahip olduğu güç kaynaklarını kullanarak fiile yöneldiğinde ortaya çıkan bu kudret ile sorumlulukları yerine getirir. Kudret kavramı, üç yönden taksim edilebilir: Birincisi, ortaya çıkışı açısından; ikincisi, bireye ait yükümlülükler açısından; üçüncüsü ise topluma yönelik yükümlülükler açısından. Kudrete bütün yükümlülerin aynı seviyede sahip olduğu kabul edilir. Bunun yanında kudret, kişinin fiziki, aklî ve manevî durumlarına göre değişken olabileceği gibi; mükellefin bulunduğu ortama, zamana ve şartlara göre de değişkenlik gösterebilir. Böyle istisnai durumlar da dahil olmak üzere İslâm hukukunda kudrete ilişkin hüküm, mükellefiyetler karşısında herkesin, gücü oranında sorumlu olduğudur."
