abstract: "Çalışmanın konusu, hava araçları başta olmak üzere taşıma araçları üzerindeki ayni haklara ilişkin yabancılık unsuru içeren hukuki işlemlere uygulanacak hukuk olarak özetlenebilir. Bu çalışmada, bilhassa, hava araçları ve donanımlarının üzerinde yeni bir ayni teminat ve finansman sistemi öngören, uygulamada daha ziyade Cape Town Sözleşmesi (CTS) olarak adlandırılan“Taşınır Donanım Üzerindeki Uluslararası Teminatlar Hakkında Sözleşme”ile Cape Town Sözleşmesinin hava aracı donanımlarına ilişkin düzenlemelerinin yer aldığını eki niteliği taşıyan Cape Town Protokolü (CTP) hükümleri ayrıntılı bir şekilde incelenmiştir. Çalışmanın ilk bölümünde, öncelikle Milletlerarası Özel Özel Hukukun konusu ve kanunlar ihtilafı kuralları hakkında genel bilgiler verilmiştir. Bağlama konusu ve bağlama noktası kavramları ele alınmıştır. Ayrıca uygulanacak kanunlar ihtilafı kuralın tespiti için ilgili hukuki iş veya işlemin vasıflandırılması hakkında açıklamalara yer verilmiştir. Milletlerarası Özel hukukta genel bir prensip olarak vasıflandırmaya uyuşmazlığı çözmekle görevli hakimin hukuk (lex fori) uygulanır. Akabinde Milletlerarası Özel Özel Hukuk ve Usul Hukuku Hakkında Kanun (MÖHUK) Md. 21 de düzenlenen taşınır ve taşınmaz eşyalar üzerindeki ayni haklara uygulanacak hukuka ilişkin genel kura ele alınmıştır. MÖHUK Md. 21 uyarınca ayni haklarla eşyanın bulunduğu yer hukuku(“Lex Rei Sitae”kısaca“LRS”) uygulanacaktır. Eşyanın bulunduğu yer hukuku (LRS) kuralının iki istisnaları, taşınmakta olan taşınır eşyalar ve özel bir taşınır eşya türü olan ve bu çalışmanın esas konusu teşkil eden taşıma araçlarıdır. Taşınmakta olan taşınırlar için MÖHUK Md. 21/2 uyarınca varma yeri hukuku“lex transitu”uygulanacaktır. Ayrıca yer değişikliği hâlindeki taşınır eşyalar üzerinde henüz kazanılmamış aynî haklar malın son bulunduğu ülke hukukuna tâbidir MÖHUK Md. 21/3. Eşyanın bulunduğu yer hukukun ihtiyaçlara cevap vermediği ikinci durum ise ilk kez, 5718 sayılı MÖHUK'da ayrı bir madde olarak düzenlenen, taşıma araçları üzerindeki ayni haklardır. Taşıma araçları bilhassa da uluslararası ticarete özgülenen uçaklar ve ticari gemi sürekli bir ülkeden diğerine seferler yapmakta bazen aynı gün içerisinde birden çok devletin sınırları içinde bulunmaktadırlar. Taşıma araçları üzerindeki ayni hakların LRS'ye tabi tutulması söz konusu ayni haklara uygulanacak hukuki rejimin de sürekli değişmesi sonucunu doğuracaktır. Üstelik, bulundukları yerler ile arasında gerçek ve somut bir bağ bulunan taşınmazlar ve sürekli yer değiştirmeyen diğer taşınır malların aksine, ticari seferler esnasında taşıma aracının uğradığı, karasularından veya hava sahasından geçtiği yabancı devletlerin egemenliğindeki yerler ile arasında çoğu zaman tesadüften daha öte bir bağ bulunmamaktadır. Dolayısıyla hem sürekli değişkenlik arz etmesinden doğan belirsizlik ve pratik zorluklar hem de somut bir bağın taşıma aracı ile LRS arasında çoğu zaman bulunmaması nedeniyle taşıma araçlarına uygulancak hukuk“Menşe Ülke”hukuku olarak ayrık bir düzenlemeye tabi tutulmuştur. MÖHUK Md. 22/2 uyarınca, Menşe ülke, hava ve deniz taşıma araçlarında aynî hakların tescil edildiği sicil yeri, deniz taşıma araçlarında bu sicil yeri yoksa bağlama limanı, raylı taşıma araçlarında ise ruhsat yeridir. MÖHUK Md. 22 kapsamına motorlu kara taşıtları alınmamıştır Taşıma araçları üzerindeki aynı haklara ilişkin mehaz Alman Kanunu MÖHUK'da karşılığı bulunmayan bir düzenleme daha içermektedir. Söz konusu düzenleme EGBGB Md. 46 uyarınca taşıma araçları için gerek“lex regsitrati”yani sicil yeri hukukundan gerekse hareket halindeki taşınırlar için“lex transitu”yani varış yeri hukukundan (EGBGB Md. 43) daha sıkı ilişkili bir hukukun bulunması halinde, ayni haklara söz konusu hukuk uygulanabilecektir. Benzer bir hükmün Türk hukukunda yer almaması doktrinde eleştirilmiştir. Ülkemizde gemi maliklerinin önemli bir bölümünün gemilerini çeşitli mali avantajlardan yararlanmak için elverişli bayrak ülkelerinde tescil ettirdiklerini söylemek mümkündür. Elverişli bayraklı bir geminin malikinin ölümünün ardından terekedeki gemiler üzerindeki ayni hakların intikaline MÖHUK Md. 22 uyarınca, hukuki işlemin konusu ve tarafları ile hiçbir somut bağı bulunmayan sicil yeri hukukunun uygulanması maalesef olması gereken hukuk (de lege ferenda) bakımında sorunlu bir durumdur. Taşınırlar eşyalar üzerindeki tasarruf işleminin şekline uygulanacak hukuk hususunda doktrinde farklı görüşler ileri sürülmüştür. Tartışma, MÖHUK Md. 7 de düzenlenen hukuki işlemlerin şekline uygulancak genel kanunlar ihtilafı kuralının, taşınırlar üzerindeki ayni haklara ilişkin tasarruf işlemine uygulanıp uygulanmayacağı noktasındadır. CTS Md. 7 uyarınca Hukukî işlemler, yapıldıkları ülke hukukunun veya o hukukî işlemin esası hakkında yetkili olan hukukun maddî hukuk hükümlerinin öngördüğü şekle uygun olarak yapılabilir. Benzer bir tartışma taşınmazlar için söz konusu değildir zira MÖHUK Md. 21/4 uyarınca taşınmaz eşyalar üzerindeki ayni hakları etkileyen hukuki işlemin yani tasarruf işlemenin şekline uygulanacak hukuk kuralı, taşınmazın bulunduğu yer hukuku olarak belirlenmiştir. Doktrinde bir görüşe göre, taşınırlar için MÖHUK Md. 21/4 benzeri bir düzenlemenin yokluğunda doktrinde MÖHUK Md. 7'nin taşınırlar üzerindeki ayni haklara ilişkin tasarruf işlemlerinin şekline uygulanabilecektir. Bizim katıldığımız görüşe göre ise ayni hakların kazanımında MÖHUK Md. 21 ve 22'nin işaret ettiği milli hukukun eşya hukuku düzenlemelerine Md. 7 ile alternatif getirilemez . Aksi halde MÖHUK Md. 7 uyarınca (LRA) ayni hak statüsüne alternatif teşkil edecek ve tarafların ayni hak statüsünü bertaraf edebilmesine imkan sağlayacaktır. Böyle bir uygulama kanun koyucunun amacına ve kanunun ruhuna (“ratio legis”) aykırıdır. İkinci Bölümde CTS ve CTP ele alınmıştır. (CTS), UNIDROIT tarafından hazırlanmış uluslararası bir sözleşmedir. Sözleşmenin belirli bir takım özel taşınır eşyaların finansmanını uluslararası planda kolaylaştırmak ve borca ayrıklık halinde söz konusu taşınır eşyaların finansörlerinin alacaklarını en pratik, etkin ve hızlı şekilde tahsil edebilmelerini sağlamaktır. Her bir eşya grubu için ayrı bir Protokol hazırlanmıştır. Şimdiye kadar, hava araçları, demiryolu araçları, uydu, mekik gibi uzay araçları ile büyük tarım, madencilik ve inşaat makinelerine özgü dört Protokol hazırlanmıştır. Bunlardan sadece Hava araçlarına özgü Cape Town Protokolü (CTP) ile Demiryolu Araçlarına Özgü Lüksemburg Protokolü, 2024 itibarıyla yürürlüğe girebilmiştir. Bu çalışmanın ana konusu olan, CTS'nin sadece hava aracı nesnelerine özel CTP, CTS'nin hava aracı nesnelerine özel hükümler içeren eki ve bütünleyici parçasıdır. Hava aracı nesneleri söz konusu olduğunda söz konusu iki uluslararası sözleşme sadece bir arada uygulanabilir. CTS&P beraberinde sui generis, bir ayni getirmiştir;“Uluslararası (ayni) Teminat”. Söz konusu ayni hak, hava aracı nesneleri üzerinde teminat fonksiyonlu olup, teminat sağladığı alacağa bağımlıdır. Başka deyişle fer'i bir haktır. Ayrıca belirlilik ilkesine tabidir (güvence altına hava aracı nesnesinin üretici no seri numarası bilgilerinin bulunması geçerlilik şartıdır). Uluslararası teminatların bir ayni hak olarak kurucu unsurunu ve kurulma anı doktrinde tartışmalıdır. Kanaatimizce Uluslararası Teminatlar İrlanda'nın Dublin şehrinde kurulu olan ve hiçbir devlete bağlı olmayan Uluslararası Sicile (UAS) tescil ile ve tescil anında ayni hak olarak kurulmaktadır. Uluslararası Sicile tescilden önce tip sözleşmelerde öngörülen teminat sadece taraflar arsında şahsi hak olarak sonuç doğurur. Sicile tescil edilen UAT'ler, tescilsiz tüm teminatlara nazaran önceliklidir (CTS Md 29/1). CTS Md. 39 ve CTS Md. 40 da düzenlenen“Rızaya Bağlı Olmayan Hak ve Teminatlar”(RBOHT) akit devletlerin bu yönde deklarasyon yapması halinde uygulanırlar. Türkiye CTS Md. 39 ve Md. 40 uyarınca deklarasyon bulunmuştur. CTS Md. 40 kapsamına giren hak ve teminatlar Uluslararası Sicile tescil edilmedikleri halde tescilli tüm ayni teminatlardan daha önceliklidir. CTS Md. 40 kapsamına giren RBOHT'lar ise tescile tabidirler. ve sadece Uluslararası Sicile tescil edilirlerse, Uluslararası (Ayni) Teminatlarla aynı öncelik sırasından yararlanırlar. iç işlemler, yabancılık unsuru taşımayan ve önce Türk Uçak siciline tescil ile kurulan teminat fonksiyonlu ayni haklarlardır. Türk uygulamasında bu tamına sadece hava aracı ipotekleri girmektedir. Söz konusu hava aracı ipoteklerinin de Uluslararası Sicile tescili mümkündür. Bu şekilde tescil ettirilmeleri halinde CTS Md. 29'da öngörülen tescil tarihine göre öncelik sırasından tıpkı Uluslararası (Ayni) Teminatlar gibi yararlanabilirler. Buna mukabil, Türkiye Cumhuriyetinin CTS Md. 52 uyarınca verdiği deklarasyon nedeniyle İç İşlemle kurulan Ayni Teminatlar, Uluslararası Sicile tescil edilseler bile CTS'nin III. Bölümünde düzenlenen borca aykırılık hallerinde Alacaklılara tanınan yasal çarelerden ( seçimlik haklar ve CTS Md. 13'de düzenlenen özel geçici koruma tedbiri) yararlanamazlar. Bu çerçevede UAS'ye tescil edilmiş Uluslararası (Ayni) Teminatlar, iç işlemden doğan alacakları temin eden tescilli Ulusal (Ayni) Teminatlar ile CTS Md. 40 uyarınca tescile tabi RBOT'ler UAS'ye tescil ettirilen hava öncelik sırasında ikinci sırada yer alır ve kendi aralarında tescil tarihlerine göre sıralanacaktırlar. UAS'ye tescil edilmeyen veya edilemeyen diğer tüm teminatlar üçüncü sırada yer alırlar ve kendi aralarında uygulancak hukuka göre sıralanırlar. Bağlı olduğu sözleşmeden doğan borçlara aykırılık halinde UAT hakkı sahibine alacağını tahsil edebilmesi için ilave yasal çare bahşeder. Bunlar; (i)borca aykırılık halinde Teminat niteliği taşıyan hava aracı nesnenin fiili kontrolünü alacaklının ele geçirmesi, (ii) hızlı ve etkili bir şekilde hava aracı üzerinde ihtiyati tedbir kararı uygulanması ve Türkiye'deki borçlunun aczi veya iflası halinde (iii) masa mallarıyla birlikte uçağın da külli tasfiyeye girmesini önleyerek en geç 60 gün içerisinde hava aracı nesnesinin iflas masasından çıkarılarak zilyetliğinin UAT hakkı sahibi alacaklıya devrinin sağlanması olarak özetlenebilir. CTS&P üç tip hak arama yöntemi benimsemiştir. İlki yargı yollarını kullanarak, mahkeme ve icra daireleri vasıtasıyla (Court Route) , ikincisi yargı dışı (Extra-judiciairy) yoldur. Mahkeme ve icra dairelerinin müdahalesi gerekmeden idari makamların yardımıyla Alacaklı, borca aykırılık halinde tabiri caizse dava konusu eşyaya el koyabilmektedir. Bu yola başvurabilmesi için önceden Borçlunun, temerrüt ve diğer borca aykırılık hallerinde alacaklının yargı dışı yollarla rehinli veya üzerinde mülkiyet hakkı olan eşyanın zilyetliğini geri kazanabileceğini kabul etmiş olması gerekir. Türkiye'de halihazırda yürürlükte olan yegane CTS&P yargı dışı yasal çare, IDERA yolu olarak adlandırılan mekanizmadır. Buna göre, Borçlunun Gayrıkabil-i Rücû Sicilden Terkin ve İhraç Talebi yetki formunu doldurup Alacaklıyı yetkili kılması halinde ilerde temerrüde düştüğünde ya da farklı bir borca aykırılık hali söz konusu olduğunda form ile yetkili kılınan Alacaklı, Sivil Havacılık Genel Müdürlüğüne başvurarak Uçağın sicilden terkin ve yurtdışına ihracını talep edebilmektedir. Bu talep üzerine idare beş iş günü içinde talebi sonuçlandırmalıdır. Söz konusu yetkilendirme borçlu tarafından daha sonra alacaklının yazılı rızası olmadan geri alınamamakta, iptal edilememektedir. Oldukça kapsamlı ayrıntılı ve çok yönlü hukukun bir çok alanını etkileyen ve daha ziyade Common Law bakış açısıyla düzenlenen CTS&P ile Türk hukukuna bir çok yenilik gelmiştir. Bu yenilikler maalesef Türk hukuk sistemi ve geleneği ile uyumlu değildir."
