abstract: "Bu araştırma, İslami finansın Küçük ve Orta Ölçekli İşletmelerin (KOBİ'lerin) gelişimini desteklemedeki rolünün, özellikle de sürdürülebilir ekonomik büyümeyi teşvik etme potansiyelinin incelenmesi amacıyla gerçekleştirilmiştir. Buna göre çalışmada Mudarabah, Musharakah ve Sukuk gibi temel İslami finansal araçların pratik uygulaması ve bunların özellikle KOBİ'lerin finansmanına yönelik girişimcilik faaliyeti üzerindeki etkileri araştırılmaktadır. Ayrıca, bu İslami finans mekanizmalarının KOBİ'lerin finansmanı için uygunluğu değerlendirilmekte ve FinTek çözümlerinin İslami finansa entegrasyonu incelenmektedir. Buna ek olarak çalışmada, İslami finans ile Sürdürülebilir Kalkınma Hedeflerine ulaşılması arasındaki ilişki analiz edilmektedir. Bu çalışma kapsamında, VOSviewer ve RStudio yazılımları ile desteklenen bibliyometrik bir yaklaşım ile sistematik literatür taraması bir arada kullanılmış ve 1999'dan 24/02/2025'e kadar olan yayın eğilimleri incelenmiş olup İslami finans ve KOBİ'lerin gelişimi alanına yönelik akademik ilgide kayda değer bir artış olduğu tespit edilmiştir. Ayrıca bu alana katkıda bulunan en etkili yazarlar, dergiler, kurumlar ve ülkeler vurgulanmıştır. Çalışmadaki araştırma boşlukları ve düzenleyici çerçeveler ortaya koyularak gelecekteki araştırma ve politikalar için eğilimler önerilmiştir. Sonuç olarak araştırmada, İslami finansın girişimcilik üzerindeki etkisi, KOBİ'lerin finansmanı için İslami finansal araçların kullanılması, İslami finansta FinTek ve dijitalleşmenin etkisi ve İslami finans ve sürdürülebilir kalkınmanın kesişimi olmak üzere dört ana tematik küme tanımlanmıştır."
