abstract: "Birey-devlet karşıtlığı üzerine kurulan modern insancıl hukuk kuramı, insanın savaş karşısında korunması ve insan onuruna, insanın canına aykırı muamelelere maruz kalmaması için kullanılan bir terimdir. İslam'da bir kuram olarak belirlenmese de savaşın ve barışın nasıl olması gerektiğine dair belirlediği ve uyguladığı bir çerçeve mevcuttur ve bu çerçeve insan haklarını korur. Bu tezde İslam'ın silahlı çatışma hukukuna bakışı ele alınacak olup konunun uluslararası insancıl hukuka göre mukayesesi yapılacaktır. Siyasi otoritelerin etkisinden uzak, herhangi bir durum veya kuruma karşı savunma olarak değil, insanın cisim bulmasıyla sahip olduğu yaşama hakkını bilmesi ve bunun korunması adına İslam perspektifinden insancıl hukuku ve savaş prensiplerini öğrenmesi gerektiği kanaatiyle bu başlık ele alınacaktır. İnsan hakları adına çalışmalar yapan devletlerin ve sosyal politikaların da siyasi otoriteleri değil, bu fıtrî değerleri dikkate alarak muamelede bulunmasının gerekliliği ifade edilmeye çalışılacaktır."
