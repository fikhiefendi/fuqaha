abstract: "Mezhep merkezli telifin yaygın olduğu klasik devrin sonu ve modernizmden hemen önceki bir dönemde yaşamış olan İbn Âbidîn, fıkıh ve usûlüne dair çeşitli eserler kaleme almış önemli bir şahsiyettir. Hanefî mezhebinin sıkı bir müntesibi olan İbn Âbidîn'in fıkıh usûlüne dair kaleme aldığı Nesemâtü'l-eshâr haşiyesinin, neşet ettiği metin ve şerhin ortaya çıkması nazar-ı itibara alındığı takdirde eserin zengin bir usûl müktesebatının hasılası olduğundan söz edilebilir. Üç bölüm olarak hazırlanan tez çalışmasının birinci bölümünde konuya bir temel oluşturması için en genel hatlarıyla Hanefî usûlünün teşekkül tarihine ve mezhebin temel usûl parametrelerine temas edilmiştir. İkinci bölümde söz konusu haşiyenin merkezinde yer alan eserler olması hasebiyle Menâru'l-envâr metni ve onun İfâdatü'l-envâr adlı şerhinden ve müelliflerinden kısaca bahsetmek uygun görülmüştür. Ayrıca iç içe geçen metin, şerh ve haşiye yazım türlerinin birbirinden bağımsız değerlendirilemeyeceğinden ötürü fıkıh ilminin başlıca telif çeşitlerinden olan bu üç yazım türüne dair temel bilgi ve tespitlere yer verilmiştir. Üçüncü ve son bölümde ise İbn Âbidîn ve söz konusu eseri hakkında özet bir tanıtımın akabinde, müellifin haşiye özelinde usûl ilmine olan katkıları örneklerle ortaya konmaya çalışılmıştır."
