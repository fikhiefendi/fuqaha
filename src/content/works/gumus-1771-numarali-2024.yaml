abstract: "Resmi devlet görevlileri tarafından oluşturulan Şerʻiyye sicilleri, Osmanlı Devletiˈnin 15. Yüzyıldan 20. yüzyılın başlarına kadar tarihi, siyasi, hukuki, idari, malî, dini ve askeri alanlarda incelenmesi ve araştırılmasında birinci elden kaynak niteliğindedir. Bu çalışma ile H. 1288 (M.1871-1872) yıllarına ait“1771/1 Numaralı Samsun Şer'iyye Sicili”ˈnin transkripsiyonu yapılarak sicilde yer alan belgeler doğrultusunda sicilin tutulduğu yıllar aralığında Samsunˈdaki sosyal, kültürel, ekonomik, dini ve idari yapı değerlendirilmeye çalışılmıştır. Transkripsiyon ve değerlendirilmesi yapılan 1771/1 Numaralı Samsun Şer'iyye Siciliˈnin mikrofilmleri Ankara Milli Kütüphane Arşiv Bölümünde yer almaktadır. Sicil 118 yaprak olup ilk 59 yaprak üzerinde çalışma yapılmıştır."
