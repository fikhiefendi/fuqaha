abstract: "Bu tez çalışmasında, Kıbrıs'ın Birleşik Krallık idaresine bırakıldığı 4 Haziran 1878 tarihi ile Kıbrıs'ın Birleşik Krallık tarafından ilhak edildiği 5 Kasım 1914 tarihleri arasında adada kurulan vakıflar ele alınmıştır. Tez çalışması vakfiye defterleri ve şer'iyye sicilleri gibi birincil kaynaklar üzerinden yürütülmüş olup tezin ilgili bölümlerine uygun olarak nicel ve nitel usul beraber kullanılmıştır. Bu tez çalışması ile hem yeni vakıflar tespit edilmiş hem de ortaya çıkarılan tüm vakıflar hukukî, sosyal ve iktisadî şekilde bütüncül bir incelemeye tabi tutularak literatürün derinleştirilip genişlemesine hizmet edilmiştir. Çalışma metni bir giriş, dört ana bölüm ve bir sonuç şeklinde kurgulanmıştır. Giriş kısmında tezin konusu, sınırlılıkları, kaynakları ve yöntemi hakkında bilgi verilmiştir. Çalışmanın birinci bölümünde Kıbrıs adasının ilkçağlardan İngiliz dönemine kadar olan süreci aktarılmış olup Osmanlı ve İngiliz dönemlerinde adanın genel durumu özetlenmiştir. Hukukî inceleme yapılan ikinci bölümde vakıfların, uluslararası açıdan geçerli olacak şekilde hukukî istiklali olduğu tespit edilmiş olup koloni idaresi altında vakıflara yapılan müdahaleler ve tespit edilen toplam vakıf sayısı aktarılmıştır. Vakıfların sosyal olarak analiz edildiği üçüncü bölümde önce vakıf kurucuların sınıfsal pozisyonu tespit edilmiş, sonrasında bu dönemde kurulan vakıfların tevcih edildiği hizmetler eğitim-öğretim, din-ibadet, sosyal ve beledî açıdan ayrıntılı şekilde ele alınmıştır. Bu bölümde vakıfların Türk hayat biçimi ve yaşam alanındaki yayılımı ayrıntılı aktarılmıştır. Vakıfların iktisadî açıdan incelendiği bölümde akarâtın Osmanlı dönemine kıyasla küçüldüğü ve zayıfladığı gözlemlenmiştir. Para vakıflarında yapılan nicel incelme neticesinde mevkuf tipinde pound lehine para ikâmesi görülürken, Kıbrıs'taki ribh oranlarının Osmanlı'nın diğer coğrafyalarına kıyasla düşük olduğu tespit edilmiştir. Son olarak vakıflarda hizmet veren görevlilerin ve aldıkları ücretlerin aktarıldığı bölümde vakıflardaki görevlerin aslî hizmetlere tevcihinde eksiklik olduğu ve ücretlerde Osmanlı para birimlerinin tasfiye edildiği görülmüştür. Çalışmanın ana sonucu İngiliz koloni idaresinde vakıfların uluslararası hukukça tanınmış istiklale sahip olduğu ve bu dönemde kurulan vakıfların Türk toplumu için hem sosyal hem de iktisadî açıdan önemli bir direnç mekanizması olduğu şeklindedir."
