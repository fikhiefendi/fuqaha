abstract: "Bu çalışma, Türkiye'de faaliyet gösteren geleneksel ve katılım bankalarının 2018–2024 dönemine ait finansal performanslarını Entropi ve WASPAS yöntemleriyle analiz etmektedir. Analize geleneksel bankalardan Ziraat, İş Bankası, Garanti BBVA, Yapı Kredi, VakıfBank, Halkbank ve Akbank; katılım bankalarından ise Albaraka Türk, Kuveyt Türk, Türkiye Finans, Ziraat Katılım, Vakıf Katılım ve Emlak Katılım dâhil edilmiştir. Bankaların yıl sonu finansal tablolarından elde edilen ROA, ROE, Özkaynaklar/Toplam Varlıklar, fon kullandırım ve toplama oranları ile döviz ve TL varlık yapısını gösteren göstergeler kullanılmıştır. Çalışmada kriter ağırlıkları Entropi yöntemiyle nesnel olarak belirlenmiş; WASPAS yöntemiyle bankaların dönemsel performans düzeyleri hesaplanmıştır. Bulgular, farklı bankacılık modellerinin finansal göstergeler üzerinde etkili olduğunu ve makroekonomik koşulların kârlılık, fon yapısı ve aktif kalitesini önemli ölçüde şekillendirdiğini ortaya koymaktadır. Çalışma, Türkiye'de geleneksel ve katılım bankalarının performans dinamiklerine ilişkin kapsamlı bir bakış sunmaktadır."
