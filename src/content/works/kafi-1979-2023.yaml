abstract: "Yargının büyük ve tehlikeli bir konum olması, dinde yeri olması ve peygamberlerin, halifelerin ve alimlerin görevi olması nedeniyle İslam'da yargı, İslam hukukunun ilgilendiği en önemli konulardan biri olarak kabul edilir. Mezheplerin ve Resulullah'ın -sallallâhu aleyhi ve sellem- Medine Devleti'nde kendi eliyle yargıyı halk arasında, yani Müslümanlar arasında yaptığı anlaşmaya göre yeterlilik yükümlülüklerinin katı bir zorunluluktur. Ondan başka kadı yoktu, ondan kanunlar çıkardı, sonra uygulanmasını denetledi, bu yüzden kanun, uygulama ve yargıyı birleştirdi ve onun yargısı vahiy değil içtihattı ve Râşid Halifeler bu yaklaşımı izlediler, böylece Ömer yargıyı devraldı Ebu Bekir döneminde, iki yıl boyunca kendisine iki rakip gelmeden kaldı, çünkü o, sertliği ve yoğunluğuyla tanınıyor. Ömer döneminde onun emriyle yargı erki idari devletten ayrılmış ve İslam devletinin Medine, Mekke, Basra, Kûfe ve Mısır'daki bölgelerine kadı tayin edilmiştir. Bu nedenle bu tez, 1979 yılı için (160 Sayılı) Irak Adli Kanunu'ndan neyin çıkarıldığını İslami mevzuatla karşılaştırmalı olarak netleştirmeye geldi. İkinci bölüm, oturumların aleniliği, mahkeme dilinin seçimi, tercümanların kullanımı ve bir yargıç seçmenin koşulları ile ilgili olarak İslam'da davanın temel ilkelerini ele alıyor. Üçüncü bölüm, Irak Adli Teşkilat Yasası'ndaki çok katmanlı dava ve yargı organları meselesini tartışırken, dördüncü bölüm, 1979 tarihli 61 sayılı Adli Yasası'nda yapılan değişiklikleri ve bunun İslam Hukuku ile ne ölçüde uyumlu olduğunu tartışmaktadır. Kanun Araştırmacı bu çalışma boyunca aşağıdaki şekilde ilerlemek kaydıyla betimsel analitik ve karşılaştırmalı yaklaşımları kullanmıştır. 1- Çalışmaya İslam'da yargının kısa bir tanımı, tarihi ve önemi ile başlanması. 2- İncelenen maddede geçen kanunları, açıklığa kavuşturulması ve açıklığa kavuşturulması gereken hususlarda açıklamaya çalışın. 3- Hukuki materyalleri incelemek, tasnif etmek ve bölüm içinde uygun yerlerine koymak. 4- Her sûrenin, şeriat fakihleri ve hukukçularının tanımlarından hareketle başlığının kısa bir tanımını yaparak kurulması. 5- Onaylanmış hukuk ve hukuk kitaplarındaki bakış açılarıyla her bölümle ilgili içtihat ve hukuk materyallerini toplamak. 6- Çalışmada yer alan sözlerin, kitap adı, sayfa adı, bölüm numarası ve sayfa numarası verilerek, başlıklar ve bilimsel açıklamalarla birlikte kitap ve özel atıflarla belgelenmesi. 7- Hadis ve rivayetler üzerinde şu şekilde çalışın. Birincisi: Hadisleri veya rivayetleri tasdik edilmiş sünnet kitaplarından çıkarmak. İkincisi - Kenarlarda hadislerin transkriptleri, iki Sahih'ten veya varsa birinden transkripsiyonu yeterli. Üçüncüsü - Hadisler iki Sahih'te veya bunlardan birinde zikredilmemişse, hadislerden önce gelen imamlardan birinin hükmünü zikrederek onları Sünnet'in tasdik kitaplarından çıkarırız. Araştırmacı, bu çalışma vasıtasıyla 1979 Yılında Düzenlenen 160 Sayılı Irak Adli Düzenlemesi Kanunu'nu sunmuş ve birçok maddesini gözden geçirerek bunlar ile İslam hukuku hükümleri arasında gerekli dengeyi sağlamış ve ortaya koyduğu en önemli sonuçlardan biri olmuştur. Ulaşmış 1-İslam'ın başlangıcı, Arapların hukuk tarihinin başlangıcı olarak kabul edilir ve Hz. ticarette bağımlılıkları çoğunlukla geleneklere ve gelenek ve göreneklerinin hakimiyetine bağlıydı. 2- Hakimin seçilmesi için fakihler şart koymuşlardır.Bu şartların bir kısmı fakihler arasında ittifak edilenlerdir,bazıları farklıdır.Buluğ,akıl,İslamiyet,erillik ve hürriyet üzerinde ittifak edilen şartlardır. İhtilafın olduğu haller arasında adalet, çalışkanlık ve duyuların bütünlüğü vardır. 3- Toplumdaki sosyal ve ekonomik gelişmelere uyum sağlamak için hukuku uygulama ve adaleti tesis etme sorumluluğunu üstlenebilecek bir yargı sistemi oluşturmak. 4- Irak'ta yargı teşkilatı hukukunun ilkelerinden biri, duruşmaların aleni olması ve Irak'taki mahkemelerin dilinin Arapça olması ve davacılardan birinin veya her ikisinin birden konuşamaması durumunda hakimin tercüman kullanmasıdır. Arapça iyi ve hakimin mahkeme önünde iki davacı arasında eşit olduğunu.. 5- Kanun, hakime, lisansüstü eğitimini tamamlamak veya ülkede yargı işlerinin hizmet ve gelişimine katkı sağlayacak hukuk araştırmaları yapmak üzere belirli bir süre kendini adama hakkı vermektedir. 6- İdari mahkemelerin kurulmasının önemi, yetkinin saptırılmasına, işçiye tanınan yetkinin kişisel istekleri doğrultusunda kullanılmasına veya devletin kendisine verdiği görevi ihmal etmesine karşı koymakta ve dolayısıyla devletin idari aygıtındaki işçiler üzerinde denetleyici bir role sahiptir."
