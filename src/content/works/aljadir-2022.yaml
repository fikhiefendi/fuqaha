abstract: "Bu tez, köktendincilerin İmam el-Kadı el-Saymari (ö. 436 AH) Cemal el-Din el-İsnavi el-Şafi'i (ö. 772 AH)“Usul el-Fıkıh Meselelerinde Anlaşmazlık”ve“Ruhun Sonu Şerh Minhac el-Wasl”kitaplarındaki farklılıklarını ele almaktadır. Çalışmanın önemi, bu iki kitabın hukuk bilimindeki değerinden ve yazarlarının, imamlarının ve bu sanattaki ilerlemelerinin ihtişamından kaynaklanmaktadır. Ayrıca, araştırma, genel olarak köktendincilerin farklılığına yol açan motiflerin ve özellikle de iki imamın farklılığının, anlaşmazlığın varlıklardaki müctehidin görüşüne dayandığı ve bu köktendinci konulardaki anlaşmazlığa dayandığı hukuki konuları etkileyen nedenleri ortaya koymaktadırve İmam. Araştırmadaki araştırmacı, iki İmam Al- Saymari ve Jamal Al-Din Al-Isnawi'nin köktendinci sözlerini ve aralarındaki köktendinci anlaşmazlığın ifadesini ve iki İmam tarafından benimsenen kanıtların ifadesi yoluyla analitik yaklaşımı, daha sonra köktendinci doktrinlerin kanıtlarını ve bu kanıtların geçerliliğinin zayıflıklarından ve bunların öneminin ifadesini izleyerek“tümevarımsal”yaklaşımı benimsemiş ve çalışma ayrıca bazı kanıtların zayıflığını ve protesto etmeye uygun olmadığını belirterek eleştirel yaklaşımı izlemiştir. Karşılaştırmalı yaklaşım, köktendincilerin konsensüs ve ictihad bölümlerindeki doktrinlerini ve bu konuda El-Saymari ve El-İsnavi'nin doktrinini ve bir tarafta bu iki okul arasındaki karşılaştırmayı, diğer tarafta ise onlarla halkın doktrinini açıklarken de kullanılmıştır. Çalışmanın en belirgin bulguları arasında: El-Saymari protesto hadisleri Pazar günleri de dahil olmak üzere Hanefi okulunun sahiplerini daraltmak ve hadisleri kabul etmek ve almak için belirledikleri şartlara katılmaması durumunda ölçüme daha fazla güvenmeleri, El-İsnevi de dahil olmak üzere konuşmacılar okulu, belirli bir görüş veya doktrine bağlı kalmadan köktendinciliğin kurallarını çıkarmak Köktenciler Al-Sumairi ve Al-Asnawi'nin (konsensüs ve ictihad bölümü) bir model olarak farklılığının nedenleri. incelenmesi ve gerçekleştirilmesi için genel kanıtların soyut bir şekilde değerlendirilmesine dayanırken, El-Saymari ile El-Asnavi arasında konsensüs ve ictihad bölümlerinde ortaya çıkan anlaşmazlığa rağmen, bu onların üzerinde anlaşmaya varmalarını engellemedi. Bazen aynı karar, ispat yöntemleri farklı olsa da."
