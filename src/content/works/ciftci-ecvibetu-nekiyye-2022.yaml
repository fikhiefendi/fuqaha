abstract: "el-Ecvibetu'n-nekiyye 'ani'l-esileti'l-fıkhiyye adlı eserde Şanlıurfa başta olmak üzere Türkiye'nin muhtelif bölgelerinden gelen yaklaşık beş yüz soruya İslam hukukunun klasik eserlerinden faydalanılarak cevaplar verilmiştir. Çalışmamızda muâmelâta dair olup güncel olduğunu düşündüğümüz bu soru ve cevaplardan bazıları ele alındı. Eserde soru ve cevaplar Arapça yazılmıştır. Bunların bir kısmı Türkçeye tercüme edilerek halk tarafından ilgi duyulan alanlar tespit edildi. Müellifin klasik eserlerden ulaştığı sonuçlar ele alınıp günümüz İslam hukukçularının görüşleriyle karşılaştırılarak müellifin metodunun ve yönteminin güncelliği belirlenmeye çalışıldı. Müellif sorulara genel itibarıyla Hanefî ve Şâfiî kaynaklardan nakillerde bulunarak cevap vermiştir. Yapılan bu nakillere ek olarak Mâlikî, Hanbelî ve günümüz İslam hukukçularının görüşlerine yer verildi. Zaman zaman Mecme'u'l-Fikhi'l-İslâmî, Din İşleri Yüksek Kurulu ve Mısır Fetvâ Komisyonu gibi kuruluşların konuyla ilgili kararlarına değinildi. Ele aldığımız konular daha iyi anlaşılsın diye bazı meselelerin tarihi arka planı ve dünyanın farklı bölgelerindeki uygulanışları incelendi. Konunun meri hukukta karşılığı varsa ilgili kanun maddesi veya mahkeme kararı çalışmamıza alındı. Konular araştırılırken genel olarak tarafsız bir metot izlenildi. Müellifin sorulara cevap verirken klasik eserlerden yaptığı nakiller incelenerek soru ile uyumu tespit edilmeye çalışıldı. Nakillerin asıl kaynaklarına müracaat edilip gerekli görünen yerlerde bu nakillerin bağlamlarına değinildi. Müellif eserinde sorulara cevap verirken izlediği yöntem hakkında herhangi bir bilgi vermemiştir. Kazâ bahsindeki fetvâ usûlüne dair sorulara verdiği cevaplardan yola çıkılarak eserde izlenen fetvâ metodu ortaya konmaya çalışıldı. Tezimizin birinci bölümünde müellifin hayatı, eserleri ve fetvâ metoduna dair yedi soru ve cevap ele alındı. Ayrıca Şanlıurfa fetvâ komisyonu hakkında bilgi verildi. İkinci bölümünde ise İslam hukukuna dair muâmelatla ilgili yirmi sekiz soru ve cevap incelendi. Çalışmamızda toplamda el-Ecvibetu'n-nekiyye 'ani'l-esileti'l-fıkhiyye adlı eserdeki otuz beş soru ve cevap incelendi."
