abstract: "IV ÖZET DOKTORA TEZİ İSLAM CEZA HUKUKUNDA TAKSİRLİ SUÇLAR H. Murat KUMBASAR Danışman: Prof. Dr, Beşir GÖZÜBENLİ 2000- SAYFA: 155.... Jüri : Prof. Dr. Beşir GOZUBENLI Günümüzde önemi daha da artan taksirli suçlar problemi, makine ve tekniğin beşerî hayatta çok kapsamlı bir tarzda yerini almasıyla, kendini daha çok hissettirmeye başlamıştır. Trafik ve iş kazaları gibi... Taksirli suçlar İslâm hukukunda müstakil olarak değil, hata kavramı i- çinde ele alınmıştır. Ölüm, müessir fiil ya da tazmini gerektiren zararlı bir fiilden sonra o- luşan taksirli suçlar; tedbirsizlik, dikkatsizlik, acemilik, emir ve talimatlara riayetsizlik şeklinde görülmektedir. İslâm ceza hukukunda taksirli suçların aslî cezası, diyet olmakla bir likte devlet ta'ziren de ceza verebilme hakkma sahiptir."
