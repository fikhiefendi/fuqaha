abstract: "Bu çalışma, İslam ceza hukukundaki cezaî müeyyidelerden olan had cezaları özelinde ahkamın evrenselliğini konu edinmektedir. Çalışma toplamda üç ana bölümden oluşmaktadır. İlk bölümde konunun daha iyi anlaşılması için cezaî müeyyideler genel olarak incelenmiş, had cezaları ve hududullah kavramına ağırlık verilmiştir. Bu bağlamda hadlerin ceza hukuk sistemindeki yeri açıklanmaya çalışılmıştır. Had cezaları bölümünde zina, iffete iftira (kazf), yol kesicilik (eşkiyalık), hırsızlık, alkollü içkiler içmek, bağy (devlete isyan), irtidat (Dinden dönme) hadleri tek tek incelenmiş ve delilleriyle birlikte teze konu olmuştur. Bunun yanında had cezalarının kavramsal çerçevesinin daha iyi anlaşılması için kısas-diyet ve ta'zîr cezalarına da yer verilmiştir. İkinci bölümde evrenselliğin tanımı ve tarihsellikle olan ilişkisi, tarihselci düşüncenin ictihad görüşü ve bunlarla bağlantılı olarak ayetleri anlama ve nassları yorumlama metodlarına değinilmiştir. Son kısımda ise had cezaları özelinde ahkamın evrenselliği tartışmalarına nüzûl sebebi, önceki şeriatlar, fıkıh usûlü, taabbudîlik ve kelâmi açılardan bakılmaya çalışılmıştır. Bazı başlıklar altında konunun anlaşılması açısından değerlendirme yazıları yazılmıştır. Araştırma yapılırken mümkün olduğunca dört büyük mezhebin muteber fıkıh kitaplarından, yeri geldiğinde önemli tefsir kitaplarından, ilgili hadis kaynaklarından ve konuyla ilgili yazılan makaleler, bilimsel yazılar gibi güncel kaynaklardan da yararlanılmaya çalışılmıştır. Zaman zaman konuyla ilgili farklı görüş sahiplerinin görüşlerine başvurulmuş, bunların kendi ifadeleriyle yazılmasına özen gösterilmiştir. Son kısımda konuyla ilgili bir sonuç ortaya konmaya özen gösterilmiş, bilimsel ve objektif olarak konu çözümlenmeye çalışılmıştır. Anahtar kelimerler: Had, Hudud, Ahkam, Evrensellik, Tarihsellik"
