abstract: "İslam dininin bugünkü Afganistan coğrafyasında yayılmaya başlamasıyla beraber daha önce bu coğrafyada mevcut olan dinlerin yerini İslam ve bu dinlere ait hukukun yerini de İslam hukuku almıştır. Buna binaen tüm kanunların İslam hukukuna uygun olarak çıkarılması, hükümlerin de buna göre verilmesi gerektiği belirtilmiştir. Her hukuk sisteminde olduğu gibi Afgan hukukunda da olayların ispat edilebilmesi ve hükümlerin kesinlik kazanması için ispat araçlarına gerek duyulmaktadır. Bu ispat araçlarından biri olan şahitlik şartlarına uygun bir şekilde yerine gelmesi durumunda Afgan muhakeme hukukuna göre kesinlikle ispat edici olma özelliğine sahiptir.“Afgan Ceza Muhakeme Usulünde Bir İspat Vasıtası Olan Şahitlik”isimli tezimiz iki bölüm ve bir sonuçtan oluşmaktadır. Birinci bölümde muhakeme hukuku ve ispat vasıtaları genel olarak işlenmiştir. Aynı şekilde Afgan ceza muhakemesi hukukunda kullanılmakta olan ispat araçları da kısaca verilmiştir. İkinci bölümde Afgan ceza muhakeme usulünde şahitlik konusu detaylı bir şekilde incelenmiştir. Özellikle Afgan ceza muhakemesi hukukunda şahitliğin ispat değeri ve İslam ceza muhakemesi ile farklılıkları üzerine durulmuştur."
