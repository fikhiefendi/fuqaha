abstract: "Fikrî ve siyasi kırılmaların oldukça yoğun yaşandığı Tanzimat'tan Cumhuriyet'e kadarki dönem içerisinde Türkiye'nin hangi hukuki düzlemi takip edeceğine yönelik çalışmalar, Cumhuriyet'in ilk yıllarında dahi gündeme gelen bir mesele olmuştur. Bu doğrultuda Tanzimat Fermanı'nın ilan edilmesinden önce başlayarak bu fermana zemin hazırlayan ortamın ve fermanın ilanından sonra uygulanan politikalara yansıyan her türlü girişimin neticesinde Osmanlı Devleti'nin bir reform gerçekleştirme isteği değişik şekillerde vurgulanmıştır. Bu cümleden olmak üzere Tanzimat'tan itibaren özellikle hukukta gerçekleştirilmek istenen reform içerikli faaliyetler, Cumhuriyetin ilk birkaç yılına değin sürmüştür. Tanzimat'tan Cumhuriyet'e kadar süren hukukta reform çabaları değişik zamanlarda kırılmalara uğrayarak devam etmiştir. Çeşitli veçhelere konu olan bu süreçte, Cumhuriyet'in ilanından sonra bir daha ve bu sefer radikal bir değişime, bir başka ifadeyle devrime kapı aralanmıştır. Dolayısıyla bir müddetten beri süren hukukta reforma ilişkin çabalar yerini kapsamlı bir hukuki dönüşüm sürecine bırakmıştır. Bu çalışmada, Tanzimat'tan Cumhuriyet'e kadar uzanan süreçte hukuk alanında yaşanan gelişmeler tarihsel bağlamı içinde ele alınmış; Cumhuriyet'in ilk yıllarında yürütülen birtakım kanunlaştırma faaliyetleri gerek tarihsel süreklilikleri gerekse reform niteliğindeki yönleriyle incelenmiştir. Araştırmada tarihsel yöntem esas alınarak söz konusu dönemlere ait resmî belgeler, Meclis tutanakları, dönemin hukuk metinleri ve alan yazını taranarak değerlendirmelerde bulunulmuştur. Sonuç olarak, Tanzimat'tan itibaren süren hukuki reform girişimlerinin Cumhuriyet'in ilanıyla birlikte sistematik ve ideolojik bir dönüşüm sürecine dönüştüğü, bu bağlamda hukuk devriminin yalnızca normatif değil aynı zamanda toplumsal ve kültürel boyutları da olan çok yönlü bir yeniden yapılanmayı beraberinde getirdiği ortaya konulmuştur. Çalışmada, tüm bu dönüşüm süreci hem tarihsel süreklilik hem de radikal kopuş noktaları ışığında ele alınmakta, dönemin ruhu içinde anlaşılmaya çalışılmaktadır."
