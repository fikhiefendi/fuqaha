abstract: "Bu çalışmada Hanefî mezhebi âlimlerinden olan el-Muṣannifek'in, Hanefî fıkhına uygun olarak açık ve net ifadelerle kaleme aldığı, muhtasar bir eser mahiyetindeki el-Ḥudûd ve'l-Aḥkâmu'l-Fıḳhiyye adlı eserini inceledik. Bu eser, muhtasar olması ve diğer fıkıh eserlerinden farklı olarak bölümlerdeki başlıkların dil yönüyle incelenmesi bakımından öneme sahiptir. Müellif eserde bölümlere başlık olarak kullanılan kelimeleri dil açısından incelemiş, ıstılah anlamlarını ifade etmiş ve açıklamalarını Âyet-i Kerîmeler, Hadîs-i Şerîfler, bazı âlimlerin sözleriyle desteklemiştir. Çalışmamız iki ana bölümden müteşekkildir. Birinci bölümde yazarın hayatı ve eserleri, yaşadığı dönemin siyasî, ilmî ve kültürel özellikleri hakkında bilgi verilmiştir. İkinci bölümde ise el-Ḥudûd ve'l-Aḥkâmu'l-Fıḳhiyye adlı eser metodolojik açıdan ele alınmıştır. Eserin genel özellikleri, diğer fıkıh eserlerinden farkı, yazılış sebebi ve eserde kullanılan kaynaklar hakkında bilgi verildikten sonra eserde kullanılan metod, konuları ele alma biçimi, dil ve üslup özellikleri, cümle yapıları, seçilen örnekler ve kullanılan istişhadlar hakkında bilgi verilmiştir. Ayrıca bu bölümlerde kullanılan istişhadlar, Ku'ân-ı Kerîm, Hadîs-i Şerîf, atasözü, şiir ve din âlimlerinin görüşleri gibi başlıklar altında itinayla incelenmiştir."
