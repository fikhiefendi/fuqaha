abstract: "Bu tez,“İran'da İslami finansın gelişimi”üzerine odaklanmaktadır. Çalışmamız bir giriş ve üç bölümden oluşmaktadır. Giriş bölümünde, araştırmanın temeli, yani problemi, kapsamı, amaçları ve genel önemi açıklanmıştır. Birinci bölüm, İslami finans sistemine dair bir genel bakış sunmaktadır, bu çerçevede sistemin özellikleri, amaçları ve bileşenleri incelenmektedir. İkinci bölümde, İran'ın finansal piyasaları, kurumları, denetim mekanizmaları ve genel sistem değerlendirmesi ele alınmıştır. Bu bölüm, İran'ın finansal yapısını ve mevcut düzenlemelerin etkisini anlamak için kritik bir rol oynamaktadır. Üçüncü bölüm ise, İran'daki İslami finansal kurumlar, özellikle İslami bankacılık üzerinde yoğunlaşmaktadır. Bu bölüm, İslami finansın pratik uygulamalarını ve bankacılık sisteminin fon toplama ve dağıtma yöntemlerini detaylı bir şekilde inceler. Sonuç bölümünde, tezin bulguları ve araştırmanın sonuçları özetlenir ve ileriye dönük öneriler sunulur. Bu tez, İran'ın finansal altyapısında İslami finansın evrimini anlamak ve bu alanda ilerlemek için bir temel sağlamayı amaçlamaktadır."
