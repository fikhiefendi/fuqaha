abstract: "Bu araştırmada 1119/1707 yıllarında Hindistan'da yaşamış büyük bir Hanefi hukukçusu olan Muhibbuüah b. Abdişşekûr'un hayatı ve onun önemli eseri olan Müsellemü's-Sübüt'taki metodu incelenmiştir. İbn Abdişşekûr sadece fıkıhta değil aynı zamanda mantıkla da iştigal etmiş, hatta mantıkla ilgili Süllemü'1-Ulûm diye bir eser de kaleme almıştır. Çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş'te İbn Abdişşekûr'a kadar İslâm hukukunun geçirdiği devreler ana hatlarıyla ele alınmıştır. Birinci bölümde; İbn Abdişşekûr'un yaşadığı dönemin tarihi ve ilmi özellikleri, hayatı, yetişmesi, ilmi hayatı ve eserleri hakkında bilgi verilmiştir. İkinci bölümde; Müsellemü's-Sübût'un metodu incelenmiş, konuları, kaynakları, üslûbu, konuları işleyiş tarzı, hadisleri ve âyetleri değerlendirişi ile Müsellemü's- Sübût'un İslam Hukukundaki yeri hakkında bilgi verilmiştir."
