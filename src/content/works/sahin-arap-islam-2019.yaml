abstract: "Modern dönemlerde İslam'a en çok eleştiri yapılan konulardan bir tanesi kızların küçük yaşta evlendirilmesi meselesidir. Geleneksel bir algı ile İslam'ın küçük yaştaki çocukların evliliğine onay verdiği kabul görmüş ve söz konusu kabul gerek ayetlerle gerekse Hz. Peygamber'in ve sahabenin hayatından örneklerle delillendirilmeye çalışılmıştır. Arap örfünün bir örneği olan bu uygulamalar, kendi döneminin şartları içinde değerlendirilmek yerine dini bir zemine oturtularak genelleştirilmeye çalışılmıştır. Bu çalışma, Arap İslam kültüründeki erken yaşta evlilik konusunu ve bu konu ile ilgili rivayetlerin değerlendirilmesini içermektedir. Bu rivayetler üzerinden geleneksel İslam anlayışında var olan erken yaşta evlilik olgusunun dini, tarihi, kültürel ve örfi boyutu ortaya konularak Arap İslam kültüründeki tarihsel özgeçmişi gözler önüne serilmeye çalışılmıştır. Böylece, modern bakış açısına sahip Müslümanların bu rivayetler ile karşılaştığında yaşadığı zihinsel karmaşanın giderilmesine yardımcı olmak hedeflenmiştir. Çalışmamızda konu araştırması ilk dönem klasik eserlerden başlayarak günümüz eserlerine uzanan kronolojik sıra takip edilerek yapılmıştır. Referans olarak ilk kaynaklara başvurmaya özen gösterilmiştir. Tez, giriş bölümü haricinde iki bölümden oluşmaktadır. Birinci bölümde İslam öncesi Arap toplumunda var olan nikâh uygulamaları, bu uygulamaların İslami dönemdeki karşılığı ve gerek Hz. Peygamber'in gerekse sahabenin hayatında vuku bulan erken yaşta gerçekleştirilen evlilik örnekleri yer almaktadır. İkinci bölümde, kızların erken yaşta evlendirilebileceği ve evlendirilemeyeceği görüşlerinin dayandırıldığı delillerin kritiği yapılmaktadır. Sonuç bölümünde ise, bu minvalde yapılan evliliklerin Arap toplumunun kültürel ve örfi bir uygulaması olduğu ancak Peygamber ve sahabe hayatından verilen örneklerle, İslam'ın bir emriymiş gibi algılanarak, dini bir zemine oturtulduğu ileri sürülmektedir."
