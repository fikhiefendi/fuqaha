abstract: "Bu çalışmada İslâm aile hukukunda kadınlarla ilgili hükümler, psikososyal bir bakış açısıyla ele alınarak incelenmiştir. Tarih boyunca kadın, geleneksel rollerinin ötesine geçerek yalnızca anne ve eş olarak değil, aynı zamanda çalışma hayatının da bir parçası hâline gelmiş; bu durum ise beraberinde yeni sorumluluk alanlarını doğurmuştur. Kadının toplum içerisindeki konumunun değişmesiyle birlikte, haklarıyla ilgili bazı düzenlemelere gidildiği görülmektedir. Özellikle günümüz Müslüman toplumlarında, İslâm hukukunda kadınlara dair hükümler daha fazla tartışılmakta ve bu hükümlerin toplumsal karşılığı daha çok gündeme gelmektedir. Bu bağlamda çalışmamızda, İslâm hukuku hükümlerinin daha iyi anlaşılmasına katkı sağlamak ve bu hükümlerin doğduğu tarihsel, toplumsal ve kültürel zemini açıklığa kavuşturmak amaçlanmıştır. Bu amaçla; evlenme ve evlilik süreçleri, evlenme engelleri, nişanlılık, talâk, iddet, mehir, nafaka, miras, hidâne, nesep ve evlat edinme gibi konularda kadına dair hükümler, sosyal ve psikolojik dinamikler açısından değerlendirilmeye çalışılmıştır."
