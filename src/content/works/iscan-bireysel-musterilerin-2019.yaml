abstract: "Faizsiz bankacılık, dünyada büyük bir gelişim ve değişim sürecine girerek 1970'li yıllarda Mısır'da düşünce aşamasından çıkıp pratiğe geçerek uygulama alanı bulmuştur. 'Faizsiz Bankacılık' adı altında yaygınlaşan katılım bankaları, ilk olarak Müslüman ülkelerde faaliyet göstermiştir. Bugün ise tasarrufların değerlendirilebilmesi için tüm dünyada giderek önem kazanmaktadır. Türkiye'de ilk Katılım Bankası, 1983 yılında“Özel Finans Kurumu”adıyla kurulmuştur. 2006 yılından itibaren ise 5411 sayılı bankacılık kanunu ile değişiklik yapılmış ve“Katılım Bankaları”adıyla günümüze kadar gelmiştir. Bankalar Kanununa tabi olması ve ticari bankalar ile mevzuat açısından eşit haklara sahip olması klasik bankalarla rekabet edebilir duruma gelmiştir. Faizsiz Bankacılık, İslami Bankacılık olarak da anılan Katılım Bankacılığının dünya piyasasındaki yeri ve önemi giderek artmaktadır. Türkiye'de Katılım Bankacılığı ile ilgili çalışmalar son dönemde yapılmasına rağmen bireylerin kredi talebi tercihine ilişkin çalışmalara rastlanmamaktadır. Bu çalışma ile bireysel müşterilerin kredi kullanımlarında katılım bankalarını tercih etme nedenlerini tespit etmek amaçlanmıştır. Araştırmada veriler, beşli likert tipi kullanılarak kapalı uçlu sorular ile Bolu ilinde anket yöntemi uygulanmıştır. Uygulanan örneklem seçiminde farklı segmentleri tespit etmek öncelikli hedef olmuştur. Anket iki bölümden oluşmakta ve toplamda 44 soru yer almaktadır. Verilerin analiz edilmesinde SPSS programından yararlanılmıştır. İstatistiksel veriler elde edilirken örneklemin bilgilerini sayısal olarak özetleyebilmek için betimleyici analiz, ölçeğin güvenilirliği ve geçerliliğini tespit etmek için faktör analizi, değişkenlerin orta değerden farklı olup olmadığını ölçmek için t testi, bağımlı ve bağımsız değişken arasındaki ilişkinin derecesini ölçmek için Pearson korelasyon analizi uygulanmıştır. Kredi kullanımında katılım bankası tercihini etkileyen faktörlerin demografik değişkenlere göre (bağımsız değişken) farklılık gösterip göstermediğini tespit etmek için varyans analizi yapılmıştır. Varyans analizi sonucu farklılık olması durumunda, bu farklılığın hangi iki değişkenden kaynaklandığını tespit etmek için Post Hoc (tukey) testi yapılmıştır. Çalışmadan elde edilen bulgulara göre, bireysel müşterilerin kredi kullanımlarında katılım bankalarını tercih etmesini etkileyen en önemli değişken; Faizsiz bankacılık uygulamasıdır. Araştırma sonucunda bireysel müşterilerin kredi kullanımlarında katılım bankalarını tercih etmesinde demografik özelliklerinin etkilediği bulgusuna ulaşılmıştır. Yapılacak olan araştırmalar için kurumsal müşteriler de ana kütleye dahil edilerek bireysel müşterilerle kurumsal müşteriler arasında karşılaştırma yapılabilir."
