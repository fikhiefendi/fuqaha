abstract: "Son 30 yılda meydana gelen ve dünya çapında finansal krizlere yol açan kurumsal skandallar, kurumsal yönetimin önemini artırmıştır. Bu durum, yatırımcıları daha güvenli ortamlar aramaya iterken, şirketleri de etkin kurumsal yönetim uygulamaları geliştirmeye yöneltmiştir. Bu çalışma, kurumsal yönetim ile banka performansı arasındaki ilişkiyi gelişmiş ve gelişmekte olan ülkelerden kanıtlar sunarak açıklamayı amaçlamaktadır. Bu amaç doğrultusunda 7 gelişmiş ve 9 gelişmekte olan ülke olmak üzere toplam 16 ülkeden 146 ticari banka örneklem kapsamına alınmış ve çalışmanın analiz kısmında bu bankaların 2011-2021 dönemine ait kurumsal yönetim ve finansal verileri kullanılmıştır. Bu çalışmada bankaların performansı, aktif karlılığı (ROA) ve özkaynak karlılığı (ROE) ile ölçülmüştür. Çeşitli kurumsal yönetim değişkenlerinin banka performans göstergeleri üzerindeki etkileri çok boyutlu panel veri modelleri ile analiz edilmiştir. Analizden elde edilen sonuçlar, gelişmiş ve gelişmekte olan ülkelerdeki bankaların performanslarının farklı kurumsal yönetim değişkenlerinden farklı şekilde etkilendiğini göstermektedir."
