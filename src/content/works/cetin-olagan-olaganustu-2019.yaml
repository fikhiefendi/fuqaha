abstract: "Mülkiyet hakkı devren kazanılması ve mülkiyetin aslen kazanılması olmak üzere iki temel şekilde olmaktadır. Mülkiyetin aslen kazanıldığı durumlarından birisi olan, mülkiyetin zamanaşımı yoluyla kazanılmasıdır. Zamanaşımı ile mülkiyetin kazanılması hem taşınır eşya hem taşınmazlar bakımından söz konusu olabilir. Türk Medeni Kanunu'nda hüküm altına alınan zamanaşımı yoluyla mülkiyetin kazanılabileceği gibi sınırlı aynî haklar da kazanılabilir. Türk Medeni Kanunu' nda zamanaşımı, olağan ve olağanüstü kazandırıcı zamanaşımı olarak ikiye ayrılır. Olağan zamanaşımı kazanılması ile olağanüstü zamanaşımı kazanılmasının arasındaki temel fark, malın üzerinde mülkiyeti kazanmak isteyen zilyedin, zilyetliği kazandığı andan itibaren ve zamanaşımı süresi boyunca iyiniyetli olması gerekliliğidir. Oysa olağanüstü zamanaşımında mülkiyetin kazanılması bakımından böyle bir koşul aramak mümkün değildir. Zira taşınır ya da taşınmaz eşyanın olağanüstü zamanaşımı yoluyla kazanılabilmesi için zamanaşımına konu olan bu eşyanın malikinin kim olduğunun dışarıdan anlaşılamaması, tapu sicilinin aleniyetliğini kaybetmiş olması gerekir. Öyle ki, zilyet bu eşyanın gerçekte malikinin kendisi olmadığını bilir veya bilmese dahi eşyanın gerçekte malikin kim olduğunu öğrenebilme olanağından mahrumdur. Taşınmazın olağanüstü zamanaşımı yoluyla kazanılması ile olağan zamanaşımı ile kazanılmasından diğer bir farkı ise, taşınmaza zilyet olan kişinin mülkiyeti kazanması için on yıl değil yirmi yıl beklemesi gerekliliğidir. v Zamanaşımı ile taşınmazın mülkiyetinin kazanılmasına ilişkin hükümlerin günümüzde uygulanması çok da fazla karşımıza çıkmamaktadır. Özellikle de taşınmazların olağanüstü zamanaşımı ile kazanılmasına konu olması bakımından bu durum, bir yandan ülkedeki yapılan kadastro çalışmalarının neredeyse tamamlanmış olması ve diğer yandan da Anayasa Mahkemesi'nin 2011 yılında vermiş olduğu bir iptal kararı neden gösterilebilir. Çalışmamızda Türk Medeni Kanunu'nun taşınmazlara ilişkin olağan ve olağanüstü zamanaşımı ile mülkiyetinin kazanılmasına ilişkin hükümler, doktrindeki görüş ve tartışmalar ile Yargıtay' ın vermiş olduğu kararlar ışığı altında değerlendirmiş bulunmaktayız."
