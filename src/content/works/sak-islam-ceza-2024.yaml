abstract: "Çalışmanın konusu, ceza hukukuna ait uyuşmazlıklarda alternatif çözüm yolu olarak başvurulan uzlaştırma kurumunun ortaya çıkışı, İslam hukuku literatüründe düzenlenme şekli ve günümüz İslam hukukunu referans olarak gösteren bazı ülkelerde uygulanışının incelenmesidir. Yaşadığımız bu topraklarda geçen asra kadar İslam hukuku çerçevesinde uygulanma imkânı bulmuş uzlaştırma kurumunun incelenmesi, günümüz ceza hukukunda sistematik olarak 2017 yılından beri uygulanagelen uzlaştırma kurumunun dinamiklerini anlamak adına büyük bir öneme haizdir. Çalışma üç ana bölümden oluşmaktadır. Birinci bölümde uzlaştırma kurumunun beslendiği adalet anlayışı olan onarıcı adalet incelenmiştir. Onarıcı adaletin tarihsel süreçleri ve İslam hukukunun asli kaynaklarındaki yeri tespit edilmiştir. Ardından onarıcı adaletin bir yansıması olan uzlaştırma kurumunun tarihsel bakımdan ve İslam hukukunun asli kaynakları bakımından konumu ve önemi ortaya konmuştur. İkinci bölümde uzlaştırmanın İslam hukuku literatüründeki yeri tespit edilmeye çalışılmıştır. Bunun için İslam hukukunda ceza hukuku alanındaki bazı kavramlar izah edilmiş; özellikle uzlaştırmanın uygulanabildiği ve uygulanamadığı suçları gösterebilmek adına suç tipleri ve uygulanan cezalar ayrıntılandırılmıştır. Yapılan çalışma İslam hukukunda dört büyük hukuk ekolü (mezhep) olan Hanefi, Hanbeli, Şafii ve Maliki mezhepleri ile sınırlandırılmıştır. Böylelikle çalışma sahası belli hukuk ekollerine odaklanarak mevzunun dağılmasının ve karmaşıklaşmasının önüne geçilmiştir. Son bölümde ise bazı ülkelerde uzlaştırma ile ilgili yapılan günümüzdeki uygulamalara odaklanılmıştır. Zira çalışmada hedef olarak belirlenen hususlardan biri, İslam hukukunu referans olarak gösteren ülkelerdeki güncel uygulamalardır. Bu maksatla Pakistan, Katar, Endonezya ve Moritanya'da uzlaştırma ile ilgili yapılan düzenlemeler incelenmiştir. Yapılan bu inceleme anayasal düzenlemeler, yasal düzenlemeler ve diğer mevzuatlar dikkate alınarak yapılmıştır. Yeri geldikçe mahkemelerin uygulamalarından da yararlanılmıştır. Ayrıca üçüncü bölümde incelenen ülkeler; ikinci bölümde tercih edilen dört büyük hukuk ekolünden birine tâbi halkların çoğunluk olarak yaşadığı ülkelerdir. Böylece hukuk ekollerinin, ülkelerde uygulanan hukuk kurallarına etkileri de tespit edilmek istenmiştir. Bu sebeple Hanefi mezhebi için Pakistan, Hanbeli mezhebi için Katar, Şafii mezhebi için Endonezya, Maliki mezhebi için ise Moritanya seçilmiştir."
