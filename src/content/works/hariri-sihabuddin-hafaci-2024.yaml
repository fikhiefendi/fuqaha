abstract: "Bu çalışma, Şihâbuddin el-Hafâcî'nin“İnâyetü'l-Kâdî ve Kifâyetü'r-Râdî”adlı haşiyesinin İmam Beyzâvî'nin tefsiri üzerine yazılan bir bölümünün tahkikini ele almaktadır. Araştırma, giriş, üç bölüm, sonuç ve bilimsel fihristlerden oluşmaktadır. Tezde, konunun önemi, seçilme nedenleri, araştırma metodolojisi, ilgili literatür ve araştırmacının karşılaştığı zorluklar tartışılmıştır. Ayrıca, metin, şerh ve haşiye terimlerinin farkları incelenmiş ve haşiyelerin bir telif ve tasnif türü olarak ortaya çıkış tarihi ele alınmıştır. Çalışmanın birinci bölümü, İmam Beyzâvî'nin ismi, soyu, hayatı, hocaları, öğrencileri, vefatı ve eserlerini kapsamlı bir şekilde ele almıştır. Ayrıca, İmam Beyzâvî'nin tefsiri ve onun İslam alimleri arasındaki yeri tartışılmış, tefsir alanındaki katkıları vurgulanmıştır. İkinci bölümde ise, Şihâbuddin el-Hafâcî'nin ismi, soyu, doğumu, yetişmesi, hocaları, öğrencileri, vefatı, eserleri ve ilmî seyahatleri ele alınmıştır. Ayrıca, Şihâbuddin el-Hafâcî'nin yaşadığı dönemdeki siyasî ve sosyal duruma dair detaylı bir tasvir sunulmuştur. Ardından, Şihâbuddin el-Hafâcî'nin haşiyesi tanıtılmış, ona aidiyeti teyit edilmiş ve“İnâyetü'l-Kâdî ve Kifâyetü'r-Râdî”isminin anlamı açıklanmıştır. Bu bölümde ayrıca, haşiyenin, Beyzâvî tefsiri üzerine yazılmış diğer haşiyeler arasındaki yeri tartışılmış ve Şihâbuddin el-Hafâcî'nin tefsirdeki üslubu ile metodu ayrıntılı olarak ele alınmıştır. Şihâbuddin el-Hafâcî'nin, Kur'an'ı Kur'an'la, hadisle ve sahabe sözleriyle tefsir etme yöntemi incelenmiş; ayrıca, Kur'an kıraatlerine olan ilgisi, Arap dili (kelime anlamları ve türetmeleri), fıkıh, nahiv ve belâgat (beyan, meânî, bedî), Arap şiiri ve mesellere verdiği önem tartışılmıştır. Bunun yanı sıra, el-Hafâcî'nin farklı mezheplere ve fırkalara bakış açısı da ele alınmıştır. Şihâbuddin el-Hafâcî'nin haşiyede kullandığı kaynaklar ve bu kaynaklardan nasıl yararlandığı detaylı olarak açıklanmış, haşiyede yer verdiği alimlere verdiği unvanlar da incelenmiştir. Bölüm, haşiyenin ilmî değeri ve alimlerin bu haşiye hakkındaki görüşlerinin yanı sıra, haşiyeye yönelik eleştirilerin tartışılmasıyla sona ermiştir. Üçüncü bölüm, metnin tahkikine ayrılmıştır. Bu bölümde, tahkik metodolojisi açıklanmış ve tahkik için seçilen üç yazma nüsha sunulmuştur. Nüshalar, birinci nüsha (A), ikinci nüsha (B) ve üçüncü nüsha (C) olarak adlandırılmıştır. Nüshalar arasında yapılan karşılaştırmalar sonucunda, her bir nüshadaki farklılıklar ve eklemeler dipnotlar halinde kaydedilmiştir. Metnin düzenli ve anlaşılır bir şekilde sunulması amacıyla, İmam Beyzâvî'nin metni sayfanın üst kısmında kalın harflerle, Şihâbuddin el-Hafâcî'nin haşiyesi ortada ve araştırmacının notları ile dipnotları sayfanın altında yer alacak şekilde düzenlenmiştir. Tahkik edilen metin, Bakara Suresi'nin 13. ayetinden başlayarak 15. ayetine kadar olan kısmı kapsamaktadır ve İmam Beyzâvî'nin bu ayetler hakkındaki açıklamaları detaylı bir şekilde analiz edilmiştir. Sonuç bölümünde, araştırmanın en önemli sonuçlarına yer verilmiştir. Ayrıca, araştırmanın sonunda, Kur'an ayetleri, hadisler, şahıslar, şiirler, meseller, kaynaklar ve konu başlıkları fihristlerini içeren bilimsel fihristler eklenmiştir."
