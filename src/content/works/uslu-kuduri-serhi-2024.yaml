abstract: "İslâmî ilimlerin tedvin döneminde ilk olarak temel metinler kaleme alınmıştır. Temel metinlerin oluşumundan sonra yapılan en önemli çalışmalardan birisi de şerh çalışmalarıdır. Şerh çalışmasında temel metinlerdeki kapalı ifadeler açıklanır, eksik konular tamamlanır, yanlışlar düzeltilir ve konunun daha iyi anlaşılması sağlanır. Bu genel durum fıkıh ilmi içerisinde yazılan şerhler içinde geçerli olmuştur. Hanefî mezhebinde ilim ehli tarafından çokça ilgi gösterilen ve temel fıkıh kaynaklarından birisi olan Muhtasaru'l-Kudûrî üzerine çok sayıda şerh yazılmıştır. Bu şerhlerden birisi de Ebû Bekir el-Haddâd'ın el-Cevheretü'n-neyyire isimli eseridir. Eser, Haddâd'ın Muhtasaru'l-Kudûrî üzerine önceden yazdığı es-Sirâcü'l-vehhâc adlı şerhin muhtasarıdır. Şerhlerin subjektif bir özelliğe sahip olması şerhin kim tarafından yazıldığını önemli kılmaktadır. Nitekim şârihin ilmî ve fikrî özellikleri ile kullandığı metot, şerhinin değerini ortaya koymaktadır. Bu sebeple şârihin kendisinin ve metodunun bilinmesi şerhten istifade etmeyi kolay hale getirecektir. Sonuç olarak bu çalışmada Ebû Bekir el-Haddâd, hayatı ve ilmî çalışmalarıyla tanıtılmış ve el-Cevheretü'n-neyyire eseri özelinde kaynakları ve şerh metodu incelenmiştir."
