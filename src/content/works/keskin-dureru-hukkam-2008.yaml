abstract: "Ali Haydar Efendi, on dokuzuncu yüzyılın ikinci yarısı ile yirminci yüzyılın ilk çeyreği arasında yaşamış bir İslam hukukçusudur. Dolayısıyla yaşadığı yüzyıllar, Osmanlı devletinin son dönemlerine ve Cumhuriyet'in ilk yıllarına rastlamaktadır. Bu dönemde gerçekleşen kanunlaştırma çalışmaları kapsamında bir heyet tarafından Mecelle oluşturulmuş, bu heyette Ali Haydar Efendi'de yer almıştır. Sonraki yıllarda Mecelle'ye dair pek çok şerh yazılmıştır. Bunların içerisinde en kapsamlısı; Ali Haydar Efendi tarafından kaleme alınan Dürerü'l-Hükkâm Şerhü Mecelleti'l-Ahkâm adlı eserdir. Mecelle'nin değinmediği hukuki konulara değinmiş ve çözüm arayışına gitmiştir. O dönemin, hukuksal bakış açısını daha iyi anlamak açısından incelenmeye değer bir eserdir.İki bölümden oluşmakta olan tezin, birinci bölümünde müellifin hayatı, görevleri, ilmi şahsiyeti, Dürerü'l-Hükkâm Şerhü Mecelleti'l-Ahkâm adlı eser hakkında bilgi ve eserin Sulh ve İbra bölümünde geçen kaynaklar hakkında genel bilgi verilmektedir. İkinci bölümünde ise Dürerü'l-Hükkâm Şerhü Mecelleti'l-Ahkâm adlı eserin Sulh ve İbra bölümü latinize edilerek, bu bölümde geçen kaynaklara ulaşılmış ve kaynaklarda konunun hangi cildin kaçıncı sayfasında geçtiği dipnot olarak belirtilmiştir."
