abstract: "Ehl-i Sünnet ile Şîa arasında ihtilafa sebep olan belli başlı konuları Mollâ Muhsin Muhammed b. Şâh Murtazâ b. Şâh Mahmûd-ı Kâşânî'nin (ö.1090/1679) 'es-Sâfî fî Tefsîri'l-Kur'ân' adlı tefsir eseri üzerinden ele alan bu çalışmanın giriş bölümünde öncelikle Feyz-i Kâşânî'nin Şîa tefsir tarihindeki yeri belirlenmeye çalışılmış, daha sonra tefsirdeki metodu ve kaynakları incelenmiştir. Araştırmanın birinci bölümünde, her müfessirin yaşadığı çağın çocuğu olması gerçeğinden hareketle Kâşânî'nin yaşadığı dönemin dini ve kültürel durumu ele alınmış, daha sonrasında ise hayatı ve eserlerine değinilmiştir. Araştırmanın ikinci bölümünde ise her iki tarafın da kendi görüşlerinin doğruluğunu ispat etmek üzere Kur'ân'dan referans gösterdikleri âyetler incelenmiş ve tefsir ilminin kriterleri esas alınarak her iki tarafın delilleri değerlendirmeye tâbi tutulmuş, mezhebi ilke ve kriterlerin âyetlerin anlaşılmasına etkisinin olup olmadığı tespit edilmeye çalışılmıştır. Bu yapılırken mukayese etmek açısından Ehl-i Sünnet'e ait belli başlı tefsirlere de –çoğunlukla Râzî tefsiri- başvurulmuştur. Bu tarz mukayese çalışmalarında dikkati çeken objektiflik probleminin üstesinden gelmek için mümkün olduğu kadar tarafların ana kaynaklarına müracaat edilmiş, İslami ilimlerin birbirleriyle bağlantılarının dikkate alınmadığı bir araştırmanın bütüncüllükten uzak olacağı düşüncesinden hareketle interdisipliner bir çalışma yapılmıştır."
