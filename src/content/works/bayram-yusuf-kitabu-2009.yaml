abstract: "Daha Hz. Peygamber hayatta iken bazı sahâbîler tarafından onun sözleri/ hadisleri kayıt altına alınmaya başlamıştır. Hicri II. asrın başlarından itibaren de hadislerin toplandığı eserlerin tedvin ve tasnif edildiği görülmektedir.İlk tedvin ve tasnif edilen eserlerden bir tanesi de Ebû Yûsuf'un Kitâbu'l-âsâr'ıdır. 1152 hadis ihtiva eden bu eserde Ebû Yûsuf, büyük oranda hocası Ebû Hanîfe'den rivayet ettiği hadisleri toplamıştır. Bu anlamda eser aynı zamanda Ebû Hanîfe'nin Müsned'i mahiyetindedir.Ebû Yûsuf, hocasından rivayet ettiği hadisleri fıkıh bablarına göre tasnif etmiştir. Bu sebeple Kitâbu'l-âsâr erken döneme ait musannef türü bir eserdir.Kitâbu'l-âsâr, hicri II. asrın rivayet üslubunun bilinmesi ve Ebû Hanîfe ile Ebû Yûsuf'un yani Hanefi mezhebinin hadis birikiminin görülebilmesi, hadis ve sünnet anlayışının tespiti ve içtihat usûlünün bilinmesi açısından son derece önemlidir.Eserde merfu, mevkuf ve maktu rivayetler beraberce yer almaktadır. Mevkuf hadisler, merfu hadislerden daha çoktur. Maktu hadisler ise rivayetlerin yarıya yakın kısmını oluşturmaktadır. Maktu rivayetlerin büyük bir kısımı da İbrahim en-Nehaî'ye ait fetvalardır. Maktu rivayetlerin yani tâbiîn fetvalarının merfû' ve mevkuf hadislere istinat ettiği görülmektedir.İhtiva ettiği hadisler daha ziyade ibadetlerle ilgili rivayetlerdir. Çok az miktarda muamelât ve ondan biraz fazlaca da zühd ve edebe dair rivayetler yer almaktadır. Fıkhi meseleler hakkında sorulan soruların cevabı mahiyetinde olan rivayetlerin fazlalığı Kitâbu'l-âsâr'ın bir ilmihal gibi görünmesine sebep olmaktadır."
