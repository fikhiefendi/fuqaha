abstract: "Çalışmanın amacı; Türkiye'de katılım bankacılığı sisteminin gelişmesini inceleyerek, katılım bankalarında kullanılan fon kullandırma yöntemlerini ve Türkiye'de katılım bankacılığının durumu üzerinde ayrıntılı olarak bilgiler sunulacaktır. Katılım bankalarında kullanılan fonların neler olduğu, hangi fonların daha etkin bir şekilde kullanıldığı, fonları kullanırken nasıl yöntemlere başvurduğu saptanacaktır. Katılım bankaları, kaynak yaratma yöntemleri açısından geleneksel bankalara benzese de, faizi ortadan kaldırması ve karı kullanmasıyla diğer bankalardan farklılık göstermektedir. Özellikle Müslüman nüfusun yoğunluğu dikkate alındığında Türkiye'de katılım bankalarına olan ilgi artmaktadır. Bu artış katılım bankalarının sürdürülebilir olması yönünden oldukça önemlidir. Bu nedenle birçok geleneksel banka yatırım fonunu işletirken katılım bankalarını tercih etmektedir. Türkiye'de katılım bankalarının yerine ve önemine bu çalışma içerisinde yer verilmiş ayrıca bu bankaların avantaj ve dezavantajlarına değinilmiştir."
