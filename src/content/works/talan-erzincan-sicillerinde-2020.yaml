abstract: "Vakıf kurumu İslam toplumunun birlik ve beraberliği açısından son derece önemli bir kurumdur. Vakıflar Osmanlı Devleti'nde de önemli bir rol oynamış ve kurulan bu vakıflar sayesinde devletin birçok sosyal hizmeti görülmüştür. Birçok alanda olduğu gibi vakıflarla alakalı da başvurabileceğimiz en önemli kaynak hiç şüphesiz şer'iye sicilleridir. Bu bakımdan şer'iye sicillerinin incelenmesi ve tahlil edilmesi hem tarihimize hizmet hem de Osmanlı Devleti'nde İslam hukukunun uygulanışı hakkında aydınlatıcı bilgi vermesi açısından önem taşımaktadır. Erzincan'a ait dört adet şer'iye sicili bulunmakta ve bu siciller Ankara Milli Kütüphane arşivinde tutulmaktadır. Çalışmamızın giriş bölümünde bu şer'iye sicilleri ile alakalı bilgi verilmiş ve bu alanda yapılan çalışmalar anlatılmıştır. İkinci bölümde ise vakıfla alakalı bilgiler verilmiş Osmanlı'da ve İslam hukukunda vakıf kavramı incelenmiştir. Üçüncü bölümde ise Erzincan şer'iye sicillerindeki vakıf ile alakalı belgelerin teknik analizi yapılmıştır. Dördüncü ve son bölümde ise bu belgelerin fıkhi açıdan değerlendirmesi yapılmıştır. Sonuç olarak vakıfla alakalı belgelerin dokuz farklı konuyu içerdiği ve bu konuların da üç ana başlık altında toplandığı tespit edilmiştir. Belgelere baktığımızda, verilen kararların İslam hukukuna göre uygulandığını görmekteyiz. Bu da İslam hukukunun pratik hayattaki uygulamalarını kavramamıza ve teorik yönünü daha iyi anlamamıza yardımcı olmaktadır."
