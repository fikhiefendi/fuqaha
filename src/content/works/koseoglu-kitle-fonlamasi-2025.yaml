abstract: "Kitle fonlaması, geleneksel finansman yöntemlerinin yetersiz kaldığı yenilikçi projeler ve erken aşama girişimler için, dijital platformlar aracılığıyla kolektif sermaye ve pazar onayı sağlayan küresel ve dönüştürücü bir finansal inovasyondur. Bu çalışma, girişimcilik ekosisteminin en kritik finansman ihtiyaçlarından biri olan erken aşama sermaye boşluğunu dolduran Paya Dayalı Kitle Fonlaması (PDKF) modelinin Türkiye'deki başarı faktörlerini kapsamlı ve nicel bir analizle incelemektedir. Çalışma, PDKF'nin geleneksel finansmana alternatif olmaktan öteye geçerek, teknoloji ve üretim odaklı girişimlerin özsermaye yoluyla fon topladığı yeni bir finansal piyasa haline gelmesini merkeze almaktadır. Türkiye'de Sermaye Piyasası Kurulu (SPK) düzenlemeleri altında, 2021-2024 döneminde kitle fonlaması platformlarında başarıyla tamamlanmış ve başarısız olmuş 194 kampanya verisi, kampanya başarısını belirleyen dinamikleri ortaya çıkarmak amacıyla Lojistik Regresyon Analizi ile incelenmiştir. Çalışmanın temel katkısı, kampanya başarısının yalnızca hedeflenen fona ulaşmakla sınırlı olmadığını, aynı zamanda sosyal etkileşim, yatırımcı kitlesinin yapısı ve makroekonomik koşullar gibi çok boyutlu faktörlere bağlı olduğunu kanıtlamaktır. Nicel bulgular, kampanya süresince toplanan fon miktarının ve yatırımcı sayısının sosyal kanıt etkisiyle başarı olasılığını güçlü bir şekilde artırdığını göstermektedir. Öte yandan, yüksek şirket değerlemelerinin ve tek bir yatırımcıya aşırı bağımlılığın başarı üzerinde olumsuz etki yarattığı tespit edilmiştir. Makroekonomik belirsizlik dönemlerinde altın gibi“güvenli liman”varlıklarına yönelimin, kitle fonlaması başarısını negatif yönde etkilemesi ise yatırımcı davranışlarındaki hassasiyeti ortaya koymaktadır. Bu sonuçlar, girişimcilere kampanya stratejilerini optimize etmeleri, yatırımcı tabanlarını genişletmeleri ve makul değerleme politikaları izlemeleri konularında somut ve kanıta dayalı öneriler sunmaktadır."
