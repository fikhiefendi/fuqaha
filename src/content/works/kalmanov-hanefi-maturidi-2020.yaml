abstract: "İslâm tarihinde Mâverâünnehir topraklarının önemi büyüktür. Çünkü, İslâm dininin yaygınlaşmasına katkıda bulunan, değerli eserler veren meşhur âlimler buralardan yetişmiştir. Bölge fethedilmeden önce yoğun olarak Türklerin kabileler halinde yaşadığı bir yerdi. Müslüman Araplar'ın fethiyle İslâm'la tanışan bölge halkı, İslâm'ı kabul etmede geç kalmamış ve küçük gruplar halinde de olsa hemen İslâm'a girmişlerdir. Daha sonra kendi devletlerini kuran Türkler, İslâm'a büyük hizmetlerde bulunmuşlardır. Bölgede yaşayan çeşitli Türk devletleri hüküm sürdükleri esnada buraları İslâm medeniyetinin birer ilim ve kültür merkezi haline getirmişlerdir. Özellikle Buhara, Semerkand, Nesef, Şâş, Curcân ve Fârâb gibi şehirlerde bunu görmekteyiz. Örneğin, meşhur hâdis âlimi el-Buhari, filizof ve mantıkçı olan İbn Sînâ gibiler bu bölgede olan Buhara şehrinde yetişmişler ve günümüzde de çok değerli olan eserler vermişlerdir."
