abstract: "Giyim kuşam geleneği, bir toplumun sahip olduğu; kültürel ve ekonomik özelliklerin, değerler sisteminin, gelenek ve göreneklerin, inancın en önemli göstergelerinden biridir. Örtülmesi gereken yerleri örtme gayesi, insanlık tarihi kadar eskidir. Kur'an'da Hz. Âdem ile ilgili kıssada anlatıldığına göre; Hz. Âdem ve eşi Hz. Havva, yasak meyveden yedikleri zaman örtülmesi gereken yerlerinin farkına vararak ağaç yapraklarıyla örtünme ihtiyacı hissetmişlerdir. İşte fıtri bir şekilde ortaya çıkan örtünme gereksinimi, o andan itibaren hayatın bir gerçeği olmuştur. Giyim kuşam, gerek sıcak ve soğuktan korunma, gerekse ziynet ve süslenme aracı olarak ihtiyaca göre farklı ihtiyaçları aynı anda karşılamıştır. İslam öncesi dinlerde ise giyinme olgusu, dini, sosyal ve ekonomik bir ayrıştırma aracı olarak ele alınmıştır. Dolayısıyla kılık kıyafet, kişinin dinini, mesleğini, sahip olduğu sosyal statü ve grubu gösteren bir araç haline gelmiştir. Çalışmamız, bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde, çalışmamızın önemi, amacı, kapsamı ve sınırları açıklanmış; araştırma esnasında başvurulan kaynaklar belirtilmiştir. İlk bölümde, giyim kuşamın,Antik çağlardan başlayarak İslam öncesi toplumlarda ve cahiliye devrinde geçirdiği tarihsel süreç anlatılmış, Yahudi ve Hıristiyanlarda giyinme konusuna değinilmiştir. İkinci bölümde, giyim kuşam ile ilgili şer'i deliller olan Kur'an-î emirler, Hz. Peygamber'in sünnet-i seniyyesi ve günlük yaşamdaki uygulamaları, hadislerde geçen giyim kuşam tarzları; sınır, şekil, kapsam ve sakal-bıyık bağlamında ele alınmıştır. Üçüncü bölümde, mezheplerin giyim kuşam konusundaki görüşleri ve İslam fıkhında giyim kuşam konusundaki ölçütler işlenmiştir. Sonuç kısmında ise tezde ele alınan konular kısaca analiz edilmiştir. Anahtar kelimeler; kıyafet, cahiliye, din, kültür, mezhep, avret."
