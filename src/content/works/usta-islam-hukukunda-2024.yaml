abstract: "Akrabalık bağı, bireyler arasında sıkı ilişkilerin oluşmasına ve belirli sorumlulukların doğmasına sebep olur. İslam hukukunda akrabalık bağı kan, evlilik ve süt emme gibi yollarla oluşur. Oluşan bu akrabalık ilişkileri beraberinde çeşitli hükümler meydana getirir. Bu hükümler arasında akrabaları ilgilendiren birçok hak ve yükümlülük bulunur. Bazıları sadece akrabalara özgü olmakla birlikte, bazıları da akrabalara göre değişiklik gösterebilir. İslam hukukunda ibadet ve muamelat açısından zekât, fıtır sadakası, cenaze, hac, nafaka, hidâne gibi konuların yanı sıra, hibe, miras, mahremiyet, velâyet, şahitlik gibi konulara ilişkin özel hükümler akrabaları ilgilendirir. Akrabaların karıştığı suçlar ve bu suçlara uygulanan cezalar ukûbat başlığı altında ele alınır. Bu hükümler, toplumsal dayanışmayı artırmak, bireyler arasında sevgi ve saygıyı pekiştirmek ve İslam'ın adalet ve merhamet ilkelerini yansıtmak amacıyla düzenlenmiştir. İslam hukukunun akraba için hükümleri hem bireysel hem de toplumsal barışın ve huzurun sağlanmasında önemli bir rol oynar. Bu araştırma, İslam hukukunda akrabalık ilişkilerine ve akrabalara özgü hükümlere Kur'an ve sünnet ışığında bir bakış sunarak, mezheplerin ve alimlerin görüşlerine yer vermeyi hedeflemektedir."
