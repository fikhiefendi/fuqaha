abstract: "Bu araştırma 13. yüzyılda Irak-Kûfe bölgesinde yaşamış olan Mevsılî ve onun en önemli eseri olan İhtiyar hakkındadır.Bu eserde yer alan örf ve âdetle ilgili hükümler tezin ana konusunu oluşturmaktadır. Bu çalışma, giriş ve iki bölümden oluşmaktadır:Giriş bölümünde Mevsılî'nin hayatı hakkında bilgi verilmiş, hocaları, talebeleri, ilmişahsiyeti ve yaşadığı dönem hakkında genel bilgi ler verilmiştir. Birinci bölümde, örf ve âdet kavramı üzerinde durulmuş, örfün kaynak olma değeri,çeşitleri anlatılarak Hanefî mezhebinde örfün yeri konusuna ana hatlarıyla değinilmiştir. İkinci bölüm ise, tezin ana bölümünü oluşturmaktadır. Bu bölümde örf ve âdetin geçtiği konular başlıklar halinde tasnif edilerek örfle ilgili hükümler, tezin planına uygun olarak konularına göre ele alınıp incelenmiştir."
