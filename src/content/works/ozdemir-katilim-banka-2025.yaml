abstract: "Bu araştırmada, Batman Üniversitesi'nde görev yapan akademik ve idari personelin katılım bankası tercihini etkileyen unsurlar arasında yer alan İslami finans okuryazarlığı düzeyi incelenmiştir. Çalışmanın temel amacı, bireylerin İslami finansal bilgilere sahip olma düzeylerinin, faizsiz finansal kuruluşları tercih etmeleri üzerindeki etkisini ortaya koymaktır. Araştırma, ilişkisel tarama modeli ile desenlenmiş ve nicel araştırma yöntemleri çerçevesinde yürütülmüştür. Veri toplama aracı olarak 38 maddeden oluşan Likert tipi bir ölçek geliştirilmiş; ölçeğin güvenirlik katsayısı (Cronbach's Alpha) 0.955 olarak bulunmuştur. Ayrıca, Keşfedici Faktör Analizi (KFA) ile ölçeğin geçerli bir yapıya sahip olduğu belirlenmiştir. Araştırmanın örneklemini Batman Üniversitesi bünyesinde görev yapan toplam 269 katılımcı oluşturmaktadır. Veriler, SPSS programı ve Python araçları ile analiz edilmiştir. Elde edilen bulgular, katılımcıların genel olarak orta düzeyde finansal ve İslami finansal okuryazarlığa sahip olduklarını göstermektedir. Ayrıca, İslami finans okuryazarlık düzeyi ile katılım bankası tercihi arasında pozitif ve anlamlı bir ilişki (r = 0.64) bulunmuştur. Regresyon analizi sonucunda, İslami finans okuryazarlığının banka tercihini %40,8 oranında açıkladığı görülmüştür (R² = 0.408). Demografik değişkenlere göre yapılan t-testi ve ANOVA analizlerinde de bazı gruplar arasında anlamlı farklar saptanmıştır. Bu doğrultuda, katılım bankalarının toplumun farklı kesimlerine ulaşabilmesi için İslami finansal bilgi düzeyini artırmaya yönelik bilinçlendirme çalışmalarına ağırlık vermesi önerilmektedir."
