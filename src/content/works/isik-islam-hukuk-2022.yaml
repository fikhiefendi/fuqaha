abstract: "Sahâbî kavli, yıllarca Hz. Peygamber'in en yakınında bulunan ve vahiy sürecinin tamamına şahitlik eden sahâbenin fıkhî görüşleridir. Sahâbî kavli, fıkıh usûlü ile ilgili ilk yazılan eserlerden itibaren kendisinden söz edilen ve çoğu zaman müstakil başlıklarda ele alınan bir konudur. Farklı mezheplere ait usul kitaplarında konuyla ilgili en önemli tartışma, onun hücciyeti hakkındadır. Bu eserlerde sözünün delil değeri tartışılan sahâbî de, fıkhî bilgisiyle ön plana çıkmış olan sahâbîdir. Bu çalışmada sahâbî kavli konusu, dört mezhep özelinde incelenmiştir. Çalışmamızda, bu mezheplere mensup usulcülerin, onun delil olması hakkındaki görüşleri tespit edilmiştir. Bunun yanında, usulcülerin görüşlerini esas alarak meşhur dört mezhebin kurucu imamlarının konuyla ilgili kanaatleri de belirlenmiştir. Yaptığımız bu çalışma bir giriş, üç bölüm ve bir sonuçtan meydana gelmektedir. Giriş bölümünde çalışmanın konusu, önemi, amacı, kaynakları, daha önce yapılan çalışmalar ve görüşünün hüccet olması bakımından sahâbe neslinin önemi, üzerinde durulmuştur. Birinci bölümde, konuyla ilgili kavramlar incelenmiş, meşhur dört mezhep usulcülerinin sahâbî kavline bakışı kronolojik olarak ele alınmıştır. Bununla birlikte, sahâbî kavli-hadis ilişkisi, sahâbî fetvasının kıyasa takdimi ve onun umumu tahsisi konularına da bu bölümde yer verilmiştir. İkinci bölümde,sahâbî kavlinin çeşitleri, onu hüccet olarak kabul eden usulcülerle kabul etmeyenlerin dayandıkları deliller incelenmiştir. Üçüncü bölümde, fürûdan sahâbî kavline dayanan bazı fıkhî meselelerle ilgili örnekler ele alınmıştır. Araştırmamız neticesinde ulaştığımız sonuçların yer aldığı \"Sonuç\" bölümü ile, çalışmamız tamamlanmıştır. Anahtar Kelimeler: Sahâbe, Sahâbî kavli, Fetva, Hüccet, Fakih, Usulcü, Kur'an, Sünnet."
