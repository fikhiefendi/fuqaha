abstract: "Ceninin hukukî, ahlakî statüsü ve buna bağlı olarak hayatının sonlandırılması, uzun zamandır tartışılan bir mesele olarak karşımızda durmaktadır. Tıbbî bilgi ve teknolojinin ilerlemesiyle birlikte, meselenin boyutları değişmiş, yeni tartışma alanları ortaya çıkmıştır. Ceninin araştırma amacıyla kullanılması, cinsiyetine ve genetik özelliklerine müdahale ile cenindeki bazı hastalıkların anne karnında tedavi edilmesi mümkün hale gelmiştir. Böylece cenine yapılabilecek müdahalelerin sayısı artmış ve çözümlenmesi gereken yeni problemler ortaya çıkmıştır. Tez çalışmamızı, aynı zamanda Müslümanları da ilgilendiren bu sorunların İslâm hukuku açısından çözümüne katkı sunmak amacıyla hazırladık. Çalışmamızın ilk bölümünde, ceninin gelişim aşamasındaki bir insan varlığı olmasından dolayı, Kur'an ve Sünnet metinlerinde insanın yaratılışı ve tıp biliminde ceninin oluşum aşamaları ile İslâm düşüncesinde insanın mahiyeti sorusuna verilen cevaplara yer verdik. İkinci bölümde, ceninin İslâm hukukundaki konumunu tespit etmek amacıyla klâsik İslâm hukuku kaynaklarına müracaat ettik. Üçüncü bölümde ise, cenine müdahaleyi, gebeliğin sonlandırılması, ceninin araştırma ve tedavi amacıyla kullanılması, ceninin genetik özelliklerine ve cinsiyetine müdahale, cenine tedavi amaçlı müdahaleler olmak üzere beş gruba ayırarak, İslâm hukuku açısından, ceninin dokunulmazlığının hamilelik aşamaları ilerledikçe arttığı yaklaşımını benimseyerek değerlendirdik. Anahtar Kelimeler : Cenin, hayat, ruh, ıskât-ı cenin, kök hücre,genetik, cinsiyet, tedavi, müdahale"
city: "İstanbul"
