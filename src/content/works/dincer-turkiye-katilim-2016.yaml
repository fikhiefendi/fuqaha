abstract: "1970'li yıllarda Dünya'da petrole olan ihtiyacın artması sonucu Orta-Doğu ülkelerinde önemli miktarda sermayenin birikmesi ile bu sermayenin İslam'a uygun bir şekilde değerlendirilmesi amacıyla bu ülkelerde faaliyetlerine başlayan İslami bankacılık, daha sonra tüm Dünya'da faizsiz bankacılık adı altında batı ülkelerinde de hızlıca gelişmiştir. Türkiye'de İslami bankacılık 1983 senesinde ÖFK ismi ile başlamış, 2005 senesinde yeni bir bankacılık türü olarak kabul edilmiş ve gerçekleştirilen yasal düzenlemeler ile katılım bankaları, mevduat bankaları ile eşit haklara ve yükümlülüklere sahip olmuşlardır. Bundan sonra diğer bankalarla aynı şartlarda rekabet eder duruma gelen katılım bankalarının performanslarının analiz edilmesi önemli hale gelmiştir. Bu amaçla ilk olarak Türkiye'de katılım bankalarının bankacılık sektöründeki yeri, toplanan ve kullandırılan fonların, aktiflerin, öz kaynakların, şube sayılarının ve personel sayılarının gelişimi açılarından değerlendirilmiş daha sonra Türkiye'de uygulanan finansal yeniliklere yer verilmiştir. Son olarak Türkiye'de faaliyet gösteren 4 katılım bankasının 2006-2014 yılları arasındaki performansları Multi-MOORA yöntemiyle ölçülmüş ve performanslar değerlendirilmiştir. Uygulama sonucunda 2008 Dünya Ekonomik Krizi'nin katılım bankalarının performanslarını etkilediği görülmüştür. 2014 yılı için önem katsayısı ile elde edilen sonuçlar değerlendirildiğinde, finansal oranlar negatif değerler içerdiğinde Multi-MOORA yönteminin hatalı sonuçlar verdiği görülmüş ve yöntemin geliştirilmesi önerilmiştir. Multi-MOORA yöntemi ile performans ölçümü yapılırken, kullanılan finansal oranların ve bu oranları oluşturan bilanço verilerinin yıllar içindeki eğilimlerinin dikkatlice analiz edilmesi gerektiği ve elde edilen sıralamaların bu eğilimlerle karşılaştırılması tavsiye edilmiştir. Ananhtar Kelimeler: Katılım Bankacılığı, Multi-MOORA Yöntemi,Performans Analizi"
