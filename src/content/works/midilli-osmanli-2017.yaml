abstract: "İslam hukukunda Şari tarafından belirlenmiş cezalar tamamen veya kısmen bütün insanların yararı için uygulanmaktadır. Kamu otoritesi toplum yararını amaçlayan tazir/siyaset yaptırımları vazedebilmektedir. Pek çok Hanefi hukukçu kamu otoritesinin doğrudan kendi takdiri ile vazettiği cezaları siyaset olarak isimlendirmekte ve hukukun standart hükümlerinin dışında tutmaktadır. Onlar siyasi otoriteyi bütün insanların menfaatlerini gözetme konusunda Şariin vekili kabul etmektedirler. Osmanlı sultanlarının zıllullah sıfatı ile üstlendikleri nizam-ı alemi temin etme misyonu bu anlayışla yakından ilgilidir. Klasik Osmanlı ceza kanunu bu misyonun kurumsal bir tezahürü gibi görünmektedir. Klasik Osmanlı döneminde ceza kanunlarının çıkarılmasının iki temel nedeni bulunmaktadır. Bunlardan birincisi para cezalarına standart bir uygulama kazandırmaktır. Osmanlı hukuk sisteminde para cezası vergi manası bulunan örfi bir yaptırımdır. Şeri hukukun ilgili hükümlerinin dışında sultanların salt kendi takdiri ile vazedilmektedir. Bu nedenle Hanefi ceza geleneğindeki siyaset anlayışının bir yansıması olarak görülmelidir. Osmanlı kanun yapıcıları para cezasının şeriat veya kanun gereği ölüm ya da uzuv kesme gibi ağır bir ceza uygulanmadığında tatbik edilmesini istemektedirler. Ceza kanunlarının diğer sevk nedeni had ve kısas dışı ağır müeyyideleri standart hale getirmektir. Kamu otoritesinin doğrudan kendi takdiri ile vazettiği bu müeyyideler mahiyetleri ve/veya uygulandıkları suçlar bakımından standart hukuki çözümlemelere aykırı gibi görünmektedir. Bu nedenle onlar da Hanefi ceza geleneğindeki siyaset anlayışı bağlamında değerlendirilmelidir. Nitekim Osmanlı kanun yapıcıları bu anlayışı takip ettiklerini göstermek için kanunnamelerde sıklıkla siyaset terimini zikretmekte ve bazen Hanefi siyaset adaletinin en yaygın şekli olan tekerrür/itiyat formülünü kullanmaktadırlar."
