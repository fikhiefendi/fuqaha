abstract: "Mali ibadetlerden olan zekât, İslâm'ın beş temel esasından biri olarak farz kılınmıştır. Zekâtın farz olması için gerek zekât mükellefinin gerekse zekât verilecek malın sahip olması gereken birtakım şartlar bulunmaktadır. Bu şartlardan biri de mal ile ilgili olup, asli ihtiyaçlar dışında nisab miktarı mala sahip olmaktır. Bu mallara sahip kimse borçlu olması durumunda zekâtını hesaplarken borçlarını zekât nisabından düşürüp düşürmeyeceği ihtilaf konusu olmuştur. Bu çerçevede konunun etraflıca ele alınarak, özellikle klasik dönem fakihlerinin öne sürdükleri yaklaşımların tespit edilerek değerlendirilmesi ve modern dönemde ortaya çıkan yaklaşımların incelenmesi önem arz etmektedir. Bu çerçevede çalışmanın, zekâtın nisab miktarına etkisi noktasında ortaya çıkan muhtemel problemlere çözüm üretmesi amaçlanmıştır."
