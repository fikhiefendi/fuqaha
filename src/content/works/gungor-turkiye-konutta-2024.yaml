abstract: "İnsanların en temel haklarından olan, ihtiyaçlar hiyerarşisinde en önemli kademede sınıflandırılan barınma hakkının sağlanması için konut yatırımları genellikle devletler tarafından desteklenmektedir. Konutun ekonomik olarak erişilebilir hale getirilmesinde devlet desteği özellikle alt gelir grupları için yaşamsal öneme sahiptir. Bu çalışma, kent merkezlerinde bulunan mesken (içinde yaşam geçirilen konut) olma özelliğini kaybetmiş yapı stokunun yenilenmesi ve deprem riskine karşı dayanıklı hale getirilmesi için model önerisi sunmaktadır. Fatih, Beşiktaş, Üsküdar ve Kadıköy gibi eski yapı stokunun kent merkezinin önemli kısmını oluşturduğu ilçelerde kentsel yenileme çalışmalarında finansman sorunu yaşanmaktadır. Bina sahipleri dairelerini depreme dayanıklı hale getirmek için müteahhitlik karnesi olan yüklenici ile bedel karşılığı eser yapım sözleşmesi, arsa payı karşılığı inşaat yapım sözleşmesi veya her ikisini de kısmen içeren noter sözleşmesi yapmaktadır. Bu çalışma; yükleniciye verilmesi gereken bedelin geri ödemesini yapamayacağı için finansmana erişemeyen, kendisine bir daire yapılabilecek kadar 'artık arsa hissesi' bulunmayan ve fakat yıllarca yaşadığı mahalle kültüründen kopmak istemeyen maliklere yapım finansmanı için fırsat sunmaktadır. Kentsel dönüşümde en güvenilir paydaşın Çevre ve Şehircilik ve İklim Değişikliği Bakanlığı aracılığıyla Türkiye Cumhuriyeti devleti olduğu önerisini sunan araştırmalar bulunmaktadır. Bu çalışma, finansman kullanmadan ve dairesini küçültmeden yeniden yapımı karşılığında malikin kendi konutuna kamunun hissedar olmasını konu edinmektedir. Buna göre, devlet -evrensel beyannamelerle ve yasalarla tanımlanmış ödevi gereği vatandaşının konut hakkını elde etmesi için kentsel yenileme kapsamında yeniden bina yapım işini finanse ederek vatandaşına hissedar olacaktır. Bu ortaklık; İslami finansta 'azalan muşaraka' olarak adlandırılan ve ortaklardan birinin hissesinin zamanla azalacağı türden olan sermaye ortaklığıdır. Kamu kurumu, vatandaşının güvenli barınma ihtiyacını karşılamak için mesken olma işlevini kaybetmiş binasının yeniden yapımını finanse edip ilgili konuta hissedar olacaktır. Arsa maliki zaman içinde kamunun hissesini öncelikle geri alım hakkına sahip olacak veya yenilenmiş yapıyı kullanım karşılığında kendi hissesini kamuya devredecektir. Kamunun hisse sahipliği parasal kaynak sağlanması ve mali sürdürülebilirlik açısından önem arz etmektedir. Böylece yapıda nihai karar verici arsa maliki olmakla birlikte kamunun hakkı korunmuş olacak konutta transfer harcamaları nesiller arasında dengeli paylaşılmış olacaktır."
