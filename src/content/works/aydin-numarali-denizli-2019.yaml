abstract: "Şer'iyye Sicilleri şer'i mahkemelerde kronolojik sıra ile tutulan defterlerdir ki içeriğinde; mahkemelerde kadı tarafından verilen hükümler (i'lâm), alım-satım, borç, senet, ferağ, adak, vasîyet, vakfiye, tereke, vekâlet gibi her hangi mevzuda resmiyete dökülmesi gereken belgelerin (hüccet, vakfiye) kaydı bulunur. Bunların yanında merkezden gönderilen ferman, berat, mektup gibi emirler yani günümüzde noterlik işlemleri işlevini görmektedir. Kadıların hem adli, hem idari hem de şer'i görevleri vardır. Dolayısıyla bir beldede cereyan eden işlemler ve taşra ile merkez arasındaki yazışmalar şer'iyye sicillerinde yer alır. Taşrada herhangi bir idari birim içerisindeki sosyal, ekonomik ve hukuki hadiseler, bürokrasi ile ilgili yazışmalar, merkez tarafından eyalet, sancak ve kazaya gönderilen emirler bu defterlere kaydedilmiştir. Çalışmada ele alınan 185 numaralı Denizli Şer'iyye Sicili bahsi geçen unsurlar bakımından kanaatimizce güzel bir örnek teşkil etmektedir ve sözü geçen bütün unsurlara neredeyse haizdir. Araştırmada transkripsiyon işlemi yapılmış bu işlem ile birlikte gerekli tahliller yapılarak değerlendirilmiştir."
