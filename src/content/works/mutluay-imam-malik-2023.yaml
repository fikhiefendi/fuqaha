abstract: "İmam Mâlik'in Muvatta'ı bağlamında amel-i ehl-i Medine kavramı konulu çalışmamızın giriş bölümünde, araştırmanın konusu, önemi, amacı, yöntemi, sınırları ve araştırmada kullanılan kaynaklar başlıklarına yer verdik. Çalışmamızın ilk bölümünde ise amel-i ehl-i Medine'nin mahiyeti ve karamsal çerçevesi, tarihsel süreci, İmam Mâlik ve Mâlikî âlimlerinin amel-i ehl-i Medine anlayışı, çeşitleri, delil oluşu, amel-i ehl-i Medine'nin icmâ, örf ve umumu'l belva ile ilgisi, haber-i vâhide karşı delil alınması, amel-i ehl-i Medine ile umum hükmün tahsisi hakkında açıklamalar yaptık ve mezhepler arasındaki görüşleri örnek vermek suretiyle inceledik. Çalışmamızın ikinci bölümünde ise İmam Mâlik'in Muvatta'da amel-i ehl-i Medine'yi aktarırken kullandığı lafızları tespit ettik ve sınıflandırdık. Daha sonra bunlardan yaygın olan bir kısmını Muvatta'dan örnek vermek suretiyle îzâh ettik. Bununla birlikte İmam Mâlik'in yaşadığı dönemde karşılaştığı yeni meselelere karşı Muvatta'da nasıl bir yöntem izlediği hakkında da bilgilere yer verdik. Nihayetinde sonuç bölümünde, yapılan bu çalışmamız neticesinde elde edilen veriler ve İmam Mâlik'in amel-i ehl-i Medine'yi aktarırken kullandığı lafızlara ilişkin elde edilen çıkarımlar, amel-i ehl-i Medine'nin icmâ, örf ve umumu'l belva ile ilgisi ve İmam Mâlik'in amel-i ehl-i Medine'ye dayanarak yeni çıkan meselelerin fıkhî hükmü hakkındaki yaklaşımı üzerine bir değerlendirme yaparak çalışmamızı sonlandırdık."
city: "Ankara"
