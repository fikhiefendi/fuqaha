abstract: "Ehl-i Re'y okulunun kuşkusuz en önemli alimlerinden biri Ebu Hanife'dir. Dolayısıyla O'nun sevenleri ve eleştirenleri çok olmuştur. Nitekim yaşadığı dönemde ve sonrasında Ebu Hanife'yi yanlış anlayıp eleştirenler ve haset kaynaklı eleştirenler olmuştur. Yaptığı münazaralarda galip gelmesi, dini ilimlerde yeni bir yöntem ortaya koyması ve halkın teveccühünü kazanması gibi sebeplerden dolayı Ebu Hanife'yi çekemeyenler olmuştur. Neticede pek çok farklı çevreye mensup ulemanın Ebu Hanife aleyhtarlığı yaptığı anlaşılmaktadır. Biz bu çalışmamızda Osmanlı alimlerinden olan Mustafa b. İsmail el-Filornevi'nin Menakıb-ı Ebu Hanife adlı eseri tanıtmayı ve değerlendirmeyi konu edindik. Vefat tarihi 1828 olan Filornevi, Osmanlı'nın son zamanlarında milliyetçilik akımlarının yükselişte olduğu Balkanlarda yaşamıştır. Manastır vilayetine bağlı Florina'da doğup büyüyen Mustafa b. İsmail velut bir alimdir. Florina, Manastır ve Yanya şehirlerinde müftülük vazifesi ifa eden Filornevi pek çok eser telif etmiştir. Yaptığımız araştırmalar neticesinde Filornevi ya da eserlerinden biri hakkında bir çalışmaya rastlamamış olmamız onun tanınmadığını göstermektedir. Çalışmamızın konusunu oluşturan Menakıb-ı Ebu Hanife eseri, Filornevi'nin Yanya şehrinde yazdığı eserlerden bir tanesidir. Filornevi bu eseri Yanya'da ortaya çıkan ve halkı galeyana getiren bir kimseye cevap niteliğinde yazmıştır. Söz konusu kişi Ebu Hanife'yi bazı meselelerde re'y ile hükmettiğini iddia etmiş, kendisi de halka“hadis ile amel”çağrısında bulunmuştur. Halk tarafından itibar edilen bu kişi halktan pek çok kimseyi ayartarak bölgede huzursuzluk çıkarmıştır. Filornevi, temelde bu iddiaları reddetmek, Ebu Hanife'ye yöneltilen eleştirileri cevaplandırmak ve insanların zihnindeki bazı yanlış anlamaları tashih etmek niyetiyle eserini kaleme almıştır."
