abstract: "Tanzimat dönemi, diğer birçok sahada olduğu gibi hukuk sahasında da önemli değişikliklerin görüldüğü bir dönemdir. çeşitli sebepler, hukuk alanında birtakım yeniliklerin yapılmasını gerektirmiş ve bunun neticesinde hukuk mevzuatı hem biçim hem muhteva açısından ciddi ve ayrıntılı bir ilerleme kaydetmiş, mahkeme teşkilatında ıslahat yapılmış, yeni mahkemeler kurulmuştur. tanzimat Fermanı'nın ilanının ardından yirmi yıl içinde üç ayrı ceza kanunu hazırlanmış, bunların üçüncüsüyle ceza hukukunda büyük oranda Batılı ceza hukuku anlayışı ve uygulamasına geçilmiştir. Kadim Fıkıh öğretisinin suçlar ve cezalar anlayışında şahsi haklar olarak görülen kısas, diyet gibi maddelerde Şer'i hukukun etkinliğini kabul edip sürdüren bu ceza hukuku anlayışı, diğer suçların tamamını ise, devlet ve topluma yönelik bir tehdit sayarak cezalandırmış, mağdur şahısların taleplerini beklemeden re'sen soruşturmaya yetkili mahkemeler ve savcılardan var olan bir adliye yapılanması getirmiştir."
titleTranslation: {"en": "The implementation of Ottoman Criminal Law at the Tanzimat Period"}
