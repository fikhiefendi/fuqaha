abstract: "1917 tarihli Hukuk-ı Aile Kararnamesi, Osmanlı Devleti'nde aile hukukunun ilk sistematik ve yazılı kodifikasyonu olma özelliğini taşımaktadır. Aile hukuku, tarih boyunca toplumların temel yapı taşı olarak görülmüş ve İslam hukukunda özel bir öneme sahip olmuştur. İslam hukukunun zaman ve mekâna göre değişen uygulama biçimleri, aile hukukuna ilişkin düzenlemelerin de farklı dönem ve coğrafyalarda çeşitlilik göstermesine yol açmıştır. Emevîler döneminden Osmanlı Devleti'ne kadar aile hukuku alanında önemli gelişmeler yaşanmış olmakla birlikte, bu alan 1917 yılına kadar bağımsız ve sistematik bir kanun metni hâlinde düzenlenmemiştir. Tanzimat döneminde gerçekleştirilen hukuk reformları ve özellikle Ahmed Cevdet Paşa'nın öncülüğünde hazırlanan Mecelle-i Ahkâm-ı Adliye, İslam hukukunun modern kanun tekniğiyle düzenlenmesine yönelik önemli bir adım olmuştur. Ancak Mecelle aile hukukunu kapsamamıştır. 1917 tarihli Hukuk-ı Aile Kararnamesi, klasik fıkıh hükümlerini modern kodifikasyon yöntemiyle sistemleştirmiş; evlilik, boşanma, nafaka, mehir, velâyet ve gayrimüslimlerin aile hukukuna ilişkin hükümler gibi konuları düzenlemiştir. Çalışmada, söz konusu kararnamenin hazırlanış süreci, dönemin hukukî ve siyasî tartışmaları ile yürürlükten kaldırılma sebepleri incelenmektedir. Ayrıca bu düzenlemenin günümüz bazı Arap ülkelerinin aile hukuku sistemleri üzerindeki etkisi de değerlendirilmiştir."
