abstract: "Hukuk bilimi sahasında yapılan çalışmalarda, hukukun yalnızca normatif değil, aynı zamanda gâyeci/finalist olduğu da vurgulanan bir husustur. Hukûkun gâyeci özelliğini benimseyenlere göre hukuk kurallarında, hem kânun koyucu tarafından vaz' edilirken, hem de yetkili kilinan organlarca uygulanırken göz önünde bulundurulan amaç veya amaçları vardır. Ancak beşerî hukuk sistemlerinde, hukûkun amacının ne olduğu konusunda fikir birliği yoktur. Bu amaç;“güvenliğin sağlanması”,“toplumun mutluluğu veya iyiliği”,“adâlet”,“hürriyet”,“eşitlik”gibi ilkelerle ifade edilmeye çalışılmış, sonraları, bu amaçlar arasında daha önemliden daha az önemliye doğru bir sıralama yapılabileceği de belirtilmiştir. Aynı özellik, diğer hukuk sistemlerinde olduğundan daha açık bir şekilde İslâm Hukūku için söz konusudur. İlerde daha geniş bir şekilde inceleyeceğimiz gibi, İslâm hukukçularının hemen tamamına göre İslâm Hukūku'nun gâyesi, genel olarak ifâde edecek olursak,“insanların dünya ve âhiret yararlarının sağlanması”olup bu,“maslahatin temîni”olarak formüle edilmiştir İslâm Hukūku'nda maslahat', hukûkun bir kaynağı olarak da incelenmiştir. Ancak bizim konumuz, maslahatin bir hüküm kaynağı olması açısından değerlendirilmesi olmayıp, İzzuddin b. Abdisselâm'a göre İslâm Hukûku hükümlerinin gâyesi ve maksadı olması açısından olacağı için, onun maslahatla ilgili görüşlerini incelemeden önce, genel olarak“Makâsıdu'ş-Şerîa”(İslâm Hukūku'nun maksatları) ve“maslahat”hakkında giriş mâhiyetinde bilgi vermemizin uygun olacağı kanaatindeyiz."
