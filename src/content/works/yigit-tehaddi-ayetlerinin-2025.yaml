abstract: "Özellikle mucize noktasında Resûlullah (s.a.v.)'ı diğer peygamberlerden ayıran en büyük mucize hiç şüphesiz Kur'ân'ı Kerîm'dir. Cebrail (a.s.) vasıtasıyla nazil olduğu günden itibaren Kur'ân'ı Kerîm, pek çok itirazla karşılaşmıştır. Kur'ân'ı Kerîm'in muarızlarının bu itirazlarına karşı verdiği en önemli cevap, onları kendisinin bir benzerini getirmeye çağırmasıdır. Kur'ân'ı Kerîm'in muarızlarına karşı“Kur'ân'ın bir benzerini getirmesi”için meydan okuması olayına Tehâddî denilmektedir. Nitekim Kur'ân'ı Kerîm'in bu meydan okuma çağrısına ne Hz. Peygamber (a.s.m) döneminde ne de sonraki çağlarda hiç kimse muvaffak bir cevap verememiştir. Hiç şüphesiz geçmişte Kur'ân'ı Kerîm'in meydan okumasına karşın cevap verilememiş olunması bugün de gelecekte de verilemeyeceğinin açık ve sarih bir kanıtıdır. Fakat geçmişte inkârcı muarızlar, şair ve edipler, fesahat-belagat üstatları, yalancı peygamberler vb. kimselerden bazıları, Kur'ân'ı Kerîm'i taklit etmek ve onun benzerini getirmek istemişlerdir. Bu konuda da pek çok rivayet, iddia ve söylenti vardır. Nitekim biz bu çalışmamızda o iddiaları, iddiaların doğruluğunu, Kur'ân'ı Kerîm'in benzerinin getirilip getirilmediğini, Kur'ân'a karşı kimlerin muarazada bulunduğunu, Kur'ân'ı Kerîm'de bu kapsamda değerlendirilen“tehaddî âyetlerinin”, konu minvalinde görüşlerini esas aldığımız İmam Mâtürîdî ve Reşîd Rızâ müfessirlerince kronolojik manada araştırdık.“Tehaddî Âyetlerinin Te'vîlâtü'l-Kur'ân ve Menâr Tefsirlerince Mukâyeseli İncelenmesi”isimli bu tez, bir giriş ve beş bölümden meydana gelmektedir. Giriş kısmında tezin amacı ve metodu hakkında bilgi verildi. Birinci bölümde, İslâm öncesi Arap hayatı, Câhiliyye devri Araplarında sosyal-iktisadî hayat, Araplarda putperestlik inancı, Arapların sahip olduğu diğer inançlar vb. konuları ele alındı. İkinci bölümde,“câhiliyye”kelimesinin semantik tahlili, câhiliye döneminin mefhumu, câhiliye döneminde şiir ve şairin vaziyeti-konumu, Hz. Peygamber (s.a.v.)'ın, şairlere, şairlerin- Hz. Peygamber (s.a.v.)'a yönelik tutumları,“Muallakat”kavramının incelenmesi, muallaka şairleri, câhiliyye devrinde kurulan panayırlar üzerinde duruldu. Üçüncü bölüme geldiğimizde“kizb”kavramının semantik analizi, muarızların, Hz. Peygamber (s.a.v.)'a karşı inkâr ve karşı tutumları, muarızların Hz. Peygamber (s.a.v.)'a yönelik iddiaları, Muarızların karşı iddialarına karşı görüş ve delillendirmelerimiz, Atalar kültürü ve kabile bağlarının durumu ele alınmıştır. Dördüncü bölümde,“Tehaddî”kavramının semantik tahlili, i'câz kavramının ortaya çıkışı, tehaddî/meydan okuma ile ilgili kavramların kavramsal çerçevede incelenişi, Kur'ân'ı Kerîm'in Eşsizliği, Tehaddî âyetleri, Tehaddî âyetlerinin yönü, kapsamı ve özellikleri, Kur'ân'ı Kerîm'de Muaraza, Kur'ân'a meydan okuma teşebbüsleri incelenmiştir. Son olarak beşinci bölümde ise Te'vîlâtü'l-Kur'ân isimli tefsirin müellifi Ebû Mansûr Muhammed b. Muhammed b. Mahmûd el-Mâtürîdî es-Semerkandî'nin ve Menâr Tefsiri müelliflerinden Reşîd Rızâ'nın, tehaddî âyetleri- kronolojik tahlili tefsirleri doğrultusunda aktarılmıştır."
