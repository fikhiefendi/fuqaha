abstract: "Kur'ân-ı Kerîm'de geçen kevnî âyetlerin, klasik ve çağdaş tefsirlerdeki yorumlarının incelendiği ve karşılaştırmalı olarak değerlendirildiği bu çalışmamız bir giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında; araştırmanın konusu, önemi ve bu alanda çalışmalar yapan önemli şahsiyetlere yer verilmiştir. Kevnî âyetlerin tefsirinde klasik dönem tefsirleri ile modern dönem tefsirleri arasında yorum farklılıkları bulunmaktadır. Bu çalışmada bu yorum farklılıklarının nedenleri belirlenmektedir. İnsanın dış âleminde cereyan eden varlık âyetlerine“âfâkî kevnî âyetler”, insanın iç dünyasında meydana gelen varlık âyetlerine ise“enfüsî kevnî âyetler”denmektedir. Bu çalışmada konunun uzamaması için sadece âfâkî âyetler ele alınarak konu sınırlaması yoluna gidilmiştir. Yine klasik ve modern tefsirler bir hayli yekün teşkil ettiğinden burada klasik dönem müfessirlerinden başta Mukâtil b. Süleyman, Taberî ve Râzî gibi pek çok müfessirin yorumlarına başvurulmuş, daha sonra modern dönem müfessirlerinden başta Tantâvî Cevherî, Elmalılı Hamdi Yazır ve Süleyman Ateş olmak üzere çok sayıda modern müfessir ve İslam düşünürünün konu hakkındaki düşünce ve yorumlarına yer verilmiştir. Bu yorumların incelendiği çalışmamızın birinci bölümünde; kevnî âyetlerin bilimsel tefsir ile bağlantılı olduğu ve Kur'ân-ı Kerîm'in günümüz insanları tarafından daha iyi anlaşılması için Kur'an'ın çağdaş bir anlayışla yorumlanmasına ihtiyaç duyulduğu ortaya çıkmaktadır. Hatta bazı bilimsel ve teknolojik keşiflere, Kur'ân'ı Kerîm'de bazen açık bazen kapalı bir şekilde işaretler olduğu da görülmektedir. İşte Kur'an'da işaret edildiği düşünülen bu keşifler, bilimsel gelişmelerin kevnî âyetlerin anlaşılmasına, bazı kevnî âyetlerin de bilimin gelişmesine olan katkısı gibi konular bu bölümde ele alınmıştır. Bilimin ve teknolojinin hızla ilerlediği bir dönemde insanlara, Kur'an'ın tanıtılmasının ve anlatılmasının, klasik tefsir metotlarıyla yapılması zorluk arz ettiği için, insanlarla bildikleri ve anladıkları dilden konuşmanın da gerekli olduğu aşikardır. İşte çalışmamızın ikinci bölümünde bu duruma da dikkat edilerek; kevnî âyetler,“yeryüzü”ve“gökyüzü ile ilgili âyetler”diye ana başlıklara ayrılmak suretiyle, klasik ve çağdaş müfessirlerin kevnî âyetlerle ilgili yapmış oldukları izahlar incelenmiş ve bu âyetlerin yorumlanmasında bilimsel tefsirin rolü ortaya konmaya çalışılmıştır."
