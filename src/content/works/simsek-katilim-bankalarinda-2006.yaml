abstract: "Araştırmada katılım bankalarından örneklem seçilerek Servqual anketiuygulanmıştır. Anket verilerine göre örneklem şubenin hizmet kalitesi skorları veServqual boyutlarına verdikleri önem tesbit edilmiş ve değerlendirme yapılmıştır.Araştırmanın evrenini, Türkiye'de faaliyet gösteren katılım bankalarınınmüşterileri oluşturmaktadır. Araştırmada evrenin tümüne ulaşılamayacağı içinörneklem alınmıştır. Örneklemde hedef olarak Sakarya ilinde faaliyet gösterenAlbaraka Türk, Bank Asya ve Türkiye Finans Katılım Bankası müşterileriseçilmiştir. Fakat yapılan görüşmelerde iki katılım bankasından izin alınamamış veanket bir banka şubesinin müşterilerine uygulanmıştır. Ankete verilen cevaplararasında fark olup olmadığı analizler ile kontrol edilmiştir. Araştırmada anlamlılıkdüzeyi 0.5 olarak kabul edilmiştir.Araştırma sonucunda;1) Örneklem şubede, Servqual Kalite Skoru (-0,504) olarak ölçülmüştür.Müşterilerin beklentilerinin karşılanamadığı tespit edilmiştir. Sonucunnegatif olarak çıkmasının yanı sıra sıfıra yakın olması müşteri beklentileriile algılamalarının birbirine yakın olduğunu göstermektedir.2) Müşterilerce en önemli boyut olarak seçilen ?güvenilirlik?, (-0,76) ilebirinci sırada yetersiz olarak algılanmaktadır. İkinci sırada önemli boyutolarak seçilen `heveslilik', (-0,51) ile ikinci sırada yetersiz olarakalgılanmaktadır. Üçüncü olan `ilgi' boyutu, (-0,44) ile üçüncü sıradadır.Dördüncü olan güvence boyutu, dördüncü sırada yetersiz; beşinci olansomut unsurlar boyutu ise son sırada yetersiz olmuştur. Müşterilerinyüksek önem verdikleri boyutların algılanan kalitesi düşük çıkmıştır.3) Anketin üçüncü bölüm verileri incelendiğinde müşterilerin % 90'ıpersonelin görünümünden memnun olduklarını belirtmiştir. Müşterilerörneklem şubede en yüksek kaliteyi şube personelinde bulmuştur.4) Anketin üçüncü bölümünde en düşük kalite ilgi boyutundadır. Örneklemşube müşterilerinin % 19'u bankanın çalışma saatlerinin kendilerineuygun olmadığını, % 18'i kendileriyle kişisel olarak ilgilenecekpersonele sahip olmadığını belirtmiştir.Araştırma sonunda ortaya çıkan sorunlara dayalı olarak araştırmacı tarafındanortaya konulan önerilere yer verilmektedir."
