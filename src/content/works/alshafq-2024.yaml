abstract: "İbn Ebi'l-Ezz el-Hanefi ve Şerhu'l-Akideti't-Tahaviye adlı kitabı, eğitim çevrelerinde büyük bir şöhrete ve ilgiye sahip olan doktrin kitaplarından biridir. Araştırma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Araştırma konusu, İbn Ebi'l-Ezz el-Hanefi'nin Tahavi'nin doktrinine yazdığı şerhte mezhepleri eleştirirken izlediği yaklaşım, mezhepleri eleştirirken dayandığı kaynaklar, onlara nasıl cevap verdiği, Tahavi'ye katılıp katılmadığı ve mezheplerin görüşlerinin sahiplerinin doktriniyle uyumlu olup olmadığı ve onları kendi anlayışına göre nakledip nakletmediği gibi diğer bazı sorulardır. Araştırmanın amacı, Müfessir'in ilmî gruplara yaklaşımını tespit etmek, onlara nasıl cevap verdiğini göstermek, Müfessir'in onlarla ilişkisinin genel bir değerlendirmesini yapmak ve Müfessir'in kelam ve kelamcılık konusundaki tutumunu netleştirmektir. Tahaviye doktrini. Araştırmacı bu araştırmada betimsel yöntemi kullanmış ve zaman zaman analitik, tümevarımsal ve betimsel yöntem gibi bir dizi başka çalışma yönteminden de yararlanmıştır. Bu yöntem sayesinde araştırmacı ve bir dizi sonuca ulaşmıştır: Müfessir, İbn Teymiyye'nin öğrencilerinden etkilenmiş ve yaklaşımını onlardan almıştır. Tahavi, ilahi zatın kadimliği ve Allah'ı kadim kelimesiyle nitelemenin doğru olup olmadığı, ateşin yok olması meselesi, Kelam ilmini öğrenme, geçmiş olayları sıralamanın imkânsızlığı ve diğerleri de dâhil olmak üzere dokuz konuyu tartışmıştır. Diğerleri kelam ilmini küçümsedi ve öğrenilmesini yasakladı ve benimsedikleri doktrini belirlemede Kur'an ve Sünnete dayandılar, ancak ekiplere cevap verirken Kur'an ve Sünneti sundu ve sözlü ekiplere cevap verirken, kelam ilminin kuralları, köktencilik kuralları, nahiv ve diğerlerinden Arap dilinin kuralları, alimlerin ve diğerlerinin sözleri ve görüşleri gibi diğer kaynakları da kullandı ve bazen bazı sözlü ekiplerin sözlerini, onları söyleyenlerin kastettiği gibi değil, anladığı gibi aktardı."
