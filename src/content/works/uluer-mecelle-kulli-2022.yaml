abstract: "1926 yılında İsviçre hukukundan iktibas edilen Türk Medeni Kanunu'nun yürürlüğe girdiği zamana kadar Türkiye'de yarım asır boyunca uygulanmış olan ilk medeni kanunumuz Mecelle-i Ahkâm-ı Adliye'nin Avrupa'da kodifiye edilen medeni kanunlardan farklı özelliklerinden biri yüz maddeden oluşan geniş bir mukaddime bölümünü içermesidir. Bu mukaddimede“genel hukuk prensipleri”şeklinde isimlendirilebilecek hükümler yer almaktadır. Bu genel ilkelerin çoğu maddi hukuka ilişkin olmakla birlikte aralarında on üç kanun hükmünün medeni usul hukukuna ilişkin olduğu görülebilmektedir. Söz konusu hükümleri iki grup halinde toplamanın mümkün olduğu; bu gruplardan birinin ağırlıklı olarak ispat yükü meseleleri ile diğerinin ise delillerin değerlendirilmesi ile ilgili olduğu tespit edilmiştir. Usul hukukuna ilişkin bu ilkelerin günümüz medeni usul hukukunda geçerli olan kavram, terim vb. ilke düzeyindeki kurallarla benzerlikleri ve farklılıkları hem hukuk tarihi hem de karşılaştırmalı hukuk bakımından ilgi çekicidir. Çalışmada Mecelle-i Ahkâm-ı Adliye'nin mukaddimesinde yer alan medeni usul hukukuna ilişkin hükümler 2011 yılında yürülüğe giren Hukuk Muhakemeleri Kanunumuz ve bu kanunla ilgili ilmi ve kazai içtihatlar dikkate alınarak incelenmiştir. Nitelik itibariyle Mecelle-i Ahkâm-ı Adliye'nin külli kaideleri ile Kıta Avrupası medeni kanunlarındaki genel hükümler arasındaki farklılıklardan biri Mecelle'de hâkimin doğrudan doğruya külli kaideleri dayanak göstererek hüküm kurma yetkisine sahip olmamasıdır. Bu bakımdan külli kaideler nitelikçe hukuk metodolojisine ait bir rehber teşkil etmektedir."
