abstract: "Çağdaş fıkhî sorunlar özellikle tıp alanında sürekli olarak ortaya çıkmaktadır. Yeni gelişen meselelerin dini ve hukuki açıdan ele alınması büyük bir önem taşımaktadır. Bu bağlamda, günümüzün önemli konularından biri aşılarla ilgilidir. Aşının, tarih boyunca birçok ölüme ve sakatlığa yol açan salgın hastalıkların önlenmesi veya kontrol altına alınmasında kritik bir rol oynadığı genel olarak bilinmektedir. Aşının insanlar üzerinde rutin ve deneysel olarak kullanılması, tıp ve İslam hukuku alanları bakımından derinlemesine araştırma ve değerlendirmeyi gerektirmektedir. Çünkü aşıların İslam hukuku bakımından değerlendirmesi, bunların İslam toplumlarında kabulü veya reddi üzerinde önemli etkilere sahiptir. Bu çalışma, bir giriş ve üç ana bölümden oluşmaktadır. İlk bölümde, tezin ana konularına hazırlık olarak aşıların tanımı ve tarihçesi, aşı reddinin tanımı ve tarihçesi, aşı üretimi süreçleri, bağışıklık sistemi, aşılamanın çocuklarda otizme etkisi, zararlı kimyasalların kullanımı gibi konular ele alınacaktır. İkinci bölümde, koruyucu tedavi ve aşıların İslam hukuku açısından hükümleri incelenecek ve bu bağlamda aşıyı kabul eden ve reddeden İslam bilginleri ile fıkıh kurullarının görüşleri, yaklaşımları ve delilleri değerlendirilecektir. Üçüncü bölümde, ağırlıklı olarak tıbbi deneylerin fıkhi boyutları ve hükümleri değerlendirilecek, aşı çalışmalarına gönüllü katılımın ve aşıların insanlar üzerinde test edilmesinin fıkhi yönleri ele alınacaktır. Bu çalışma, kitaplar, makaleler, ilgili kuruluşların resmi verileri ve kamuya açık internet siteleri gibi kaynakları kullanarak bir kütüphane ve nitel araştırma yöntemi ile gerçekleştirilecektir."
