abstract: "Birinci dünya savaşından sonra ortaya çıkan ve son yıllarda sıkılaşarak, hacim büyüterek daha fazla yıkıma neden olan ekonomik krizler insanları yeni ekonomik sistem arayışına itmiştir. Literatür incelendiğinde borç ve faize dayalı ekonomik sistemin ömrünün azaldığı vurgulanmaktadır. Mevcut sistemde adaletsiz gelir dağılımı ve belirsizliklerin sosyal doku üzerinde de gerilimlere neden olduğu dünyanın bir kısmı lüks içinde yaşarken diğer kısmının açlıkla mücadele ettiğinden bahsedilmektedir. Yeni ekonomik sistem 'üretime dayalı, risk paylaşım odaklı ve adil gelir dağılımı vadeden' arayışlarının; 14. yy da İbn-i Haldun ile zirveye ulaşmış olan İslam ekonomik sisteminde keşiştiğini ortaya koyan çalışmalar II. Dünya savaşı sonrasında bağımsızlığına kavuşan İslam ülkeleriyle birlikte günümüzde giderek artmaktadır. Bu bilgiler doğrultusunda çalışmanın amacı bugün dünya üzerinde hızla büyüme eğiliminde olan İslami ekonomik prensiplere uygun yatırım araçlarının performansını ölçmek ve önemli makro göstergelerle ilişkilerini incelemektir. Bu amaçla Türkiye'de verilerine ulaşılabilen fıkhi açıdan birçok fakihin icazetini almış 8 adet İslami yatırım aracının 2010-2018 yılları arasındaki veri seti kullanılmıştır. Çalışmanın analiz bölümü iki aşamadan oluşmaktadır. İlk aşamada İslami yatırım aracı olarak tanımlanan; İslami yatırım fonu, altın, katılım endeksi hisse senetleri, katılım bankası katılım hesapları, sukuk, gayrimenkul ve dövizin performans analizi gerçekleştirilmiştir. İkinci aşamada İslami yatırım araçlarının makro göstergeler ile ilişkileri analiz edilmiştir. 2010-2018 dönemi her bir yıl için ayrı ayrı gerçekleştirilen performans analizleri sonucuna göre en iyi performansa sahip İslami yatırım aracı katılım bankası kar payları, devamında gayrimenkul, sukuk, dolar, euro, altın, Katılım30 endeksi ve İslami yatırım fonu şeklinde sıralanmıştır. İkinci adımdaki analiz sonuçlarına göre makroekonomik değişkenlerden BİST100, enflasyon, para arzı, ticari kredi faiz oranı ve tüketici güven endeksindeki dalgalanmalardan etkilenen İslami yatırım araçlarının; katılım bankası kar payı, sukuk ve gayrimenkul olduğu sonucuna varılmıştır. Makro göstergelere en dirençli yatırım araçlarının ise Katılım30 endeksi, İslami yatırım fonları ve altın olduğu tespit edilmiştir."
