abstract: "Hicrî II. asır İslâmî ilimlerin ve özelde hadis ilminin teşekkül edip gelişmeye başladığı bir dönemdir. Bu zaman dilimi müctehid imamların yaşadığı bir asır olması sebebiyle özellikle hadis ve fıkıh ilimleri açısından son derece önemlidir. Zira her iki ilmin temellerini teşkil eden ve sonraki çalışmalara öncülük eden ilk eserler bu süreçte telif edilmeye başlanmıştır. Ulemâ, fıkhî bilgi üretmek için bir sistem geliştirme yoluna gitmiş, bu hususta ehl-i rey ile ehl-i hadîs olmak üzere iki temel farklı yaklaşım ön plana çıkmıştır. Bu bağlamda ehl-i rey mensubu ve Ebû Hanîfe'nin önde gelen öğrencilerinden olan Muhammed Şeybânî ile ehl-i hadîse yakın duran, Mâlik'in seçkin öğrencisi Şâfiî, mezkûr grupların yaklaşımlarını sentezlemeye çalışmışlardır. Diğer taraftan Şeybânî aracılığıyla Irâk fıkıh birikimine muttali olan Şâfiî ile Şeybânî'nin bazı hadis usulü konuları hakkındaki görüşleri arasında birtakım benzerlikler bulunmaktadır. Bu doktora tezi Şeybânî'nin el-Asl ile Şâfiî'nin el-Ümm adlı furû-i fıkıh kitaplarının hadis ilmi açısından mukayesesini konu almaktadır. Çalışmada Şeybânî'nin birçok konuda Şâfiî'ye öncülük ettiği, onun zihin dünyasını şekillendirdiği ve etkilediği tespit edilmiştir. Tezde, ilk olarak Şeybânî ile Şâfiî'nin hayatları ve eserleri hadis ilmi açısından tedkik edilmiş, ardından onların kendi eserleri üzerinden bazı hadis meseleleri hakkındaki görüşleri ve yaklaşımları ile sünnet anlayışları incelenerek iki âlim arasındaki irtibatın boyutları ve sonuçlarına dair bazı tespitler yapılmıştır. Böylece Şeybânî'nin Şâfiî üzerindeki tesiri ve onu hangi hususta ne kadar etkilediği tespit edilmeye çalışılmış, hadise yaklaşımları hususunda takip ettikleri yöntem ehl-i rey ile ehl-i hadîs anlayışları çerçevesinde mukayese edilip değerlendirilmiştir."
