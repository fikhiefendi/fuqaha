abstract: "Gelişen teknolojilerle insanın geliştirilebileceği, dönüştürülebileceği hatta bir üst seviyeye çıkarılabileceği inancı yaygınlaşmaktadır. Buna hizmet edebilecek teknolojilerin başında genetik mühendisliği gelmektedir. Genetik alanındaki yetkinliğin artmasıyla fiziksel, davranışsal ve ruhsal özelliklerimiz genetik nedenlere indirgenmekte, insan, arzulara göre şekillendirilebilecek nesne konumuna sokulmaktadır. Tüm bunlar hukukî, dinî ve etik problemleri doğurmaktadır. Nitel araştırma yöntemleri ile gerçekleştirilen çalışmada, tartışmalara konu olan genom düzenleme tekniği CRISPR Cas9 teknolojisi ele alınarak İslâm hukukunun insanın geliştirilmesine ve genlerinde değişiklik yapılmasına yönelik yaklaşımının ortaya konması amaçlanmaktadır. İnsanın, kendisi veya bir başkasının genlerine müdahale etme hakkının bulunup bulunmadığı, bu hakka hangi durumlarda sahip olacağı ve tüm bunları belirlerken İslâm hukukunda hangi kriterlerin gözetilmesi gerektiği işlenmektedir. İnsan bedenindeki tasarrufların herşeyin mutlak sahibi olan Allah'ın izni doğrultusunda gerçekleştirilebileceğine dikkat çekilerek, genetik müdahalelerin İslâm'ın Kur'ân ve sünnet gibi birincil kaynaklarından türeyen“makāsıdü'ş-şerīa”prensiplerinin yanında fayda ve zarar konulu fıkhî kâideler ışığında değerlendirmesi yapılmıştır. Üreme hücreleri dışındaki genlere yapılan müdahalelerin“istıṣḥāb”yöntemine binaen başlangıç itibariyle câiz olduğu ancak düzenlemenin kişilerin yaşama hakları ve mülkiyet haklarını ihlal etmemesi, sadece dinin, canın, aklın, neslin ve malın korunmasını gerektiren zarûrî ihtiyaçları karşılaması gerektiği sonucuna varılmıştır. Bununla birlikte, yapılan müdahalenin kişide veya neslinde daha sıkıntılı genetik bozukluklara sebep olma ihtimali durumunda ister vücut ister üreme hücrelerinde olsun“sedd-i ẕerāiʿ”prensibince engellenmesi gerektiği belirtilmiştir. CRISPR Cas9 türü tekniklerle edinilecek faydanın naslar ile çatışmaması, kanun koyucunun genel maksatlarıyla uyumlu, zarûrî, küllî, katʿî ve makûl olması şartı da koşulmuştur. Geliştirme amaçlı müdahalelerle kazanılacak faydaların ise zannî ve vehmî sınıfına gireceğinden bu şartları yerine getirmediği değerlendirilmiştir. Ardından Müslümanların genetik teknolojiler karşısında geri kalmamasının, bu alanda söz sahibi olmasının, güncel meseleleri multidisiplier yaklaşımla ele almasının ve halkın bilinçlendirilmesinin önemine dikkat çekilmiştir."
