abstract: "Bu tez çalışmasında Çankırı Karatekin Üniversitesi İİBF ve İİF'de öğrenim gören öğrencilerin İslami finans okuryazarlık düzeylerinin (temel finans ve ekonomi, İslami finans prensipleri, katılım bankası ve İslami finans ürünlerine ilişkin bilgi düzeyi) belirlenmiş ve fakülteler arasındaki farklılığın tespit edilmiştir. Ayrıca bu tez çalışmasında öğrencilerin İslami finans okuryazarlık düzeylerinin bazı değişkenlere (cinsiyete, eksi bakiyeye düşme, ekonomi/finans dersi alma, İslam iktisadı ile ilgili herhangi bir etkinliğe katılma, yarı zamanlı ya da tam zamanlı çalışma, akademik ortalama, banka hesabına sahip olma durumlarına ve tercih edilen banka türüne) göre farklılık gösterip göstermediği de sınanmıştır. Çalışmada anket uygulaması ile 334 öğrenciden elde edilen veriler bağımsız örneklem t-testi ve tek yönlü ANOVA testi ile analiz edilmiştir. Buna göre öğrencilerin temel finans ve ekonomi düzeyinde 16,15; İslami finans prensipleri bilgi düzeyinde 7,38; katılım bankası bilgi düzeyinde 32,63 ve İslami finans ürünleri bilgi düzeyinde 19,67 puana sahip olduğu görülmüştür. Ayrıca İİF öğrencileri İslami finans prensipleri bilgi düzeyinde İİBF öğrencilerinden, İİBF öğrencileri de katılım bankası bilgi düzeyinde İİF öğrencilerinden daha başarılıdır. Son olarak öğrencilerin yalnızca katılım bankası bilgi düzeyi akademik ortalama değişkenine göre anlamlı bir farklılık göstermektedir."
