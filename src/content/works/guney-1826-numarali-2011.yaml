abstract: "Bu tez çalışmasının amacı, 1826 numaralı Trabzon Şer`iyye Sicili'nin transkripsiyon ve tasnifi ile ileride yapılabilecek olan Osmanlı ve Trabzon tarihine dair araştırmalara kaynak oluşturabilecek bir çalışmayı ortaya koyabilmektir.Osmanlı Devleti'ni araştırmada birinci dereceden kaynaklar olması, kayda alındıkları dönem hakkında güvenilir ve somut bilgiler sunmaları şer`iyye sicillerini tarih araştırmalarında önemli kılmaktadır. Şer`iyye sicillerinin transkribe edilerek anlaşılır hale getirilip, tasnif edilmesi ve tarih çalışmalarında kullanılması, eserlerin güvenilirliğini artıracaktır.Çalışma iki bölümden oluşmaktadır. Birinci bölümde defterde yer alan kayıtlar içerisinde geçen şahıs, yer, kurum isimleri dökümleri ile türlerine göre başlıklar altında toplanarak istatistikleri çıkarılmış, içeriklerine dair kısa tahliller yapılarak önemli görülen kısımlar belirtilmiştir. İkinci kısımda ise sicilde yer alan kayıtlar içerdikleri konulara göre tasnif edilerek yorumlanmıştır. Çalışma sonucunda elde edinilen bilgilere göre Trabzon şehri ve eyaletinin incelenilen dönem içerisindeki yerine kısaca değinilmiştir."
