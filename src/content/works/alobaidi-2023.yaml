abstract: "Bu tezde fakih, muhaddis İmam Zeynüddîn Kasım bin Kutluboğa elHanefi'nin Şerhu'n-Nikâye kitabının“Buyû”dan“Kısme”, ye kadar olan bölümlerinin tahkiki yapılmıştır. İbn Kutluboğa, İmam Muhammed b. Ahmed elMahbûbî el-Hanefî'nin en-Nikâye adlı kitabını şerh etmiştir. Bu şerh önemini şerh edilen kitaptan almaktadır. Çünkü en-Nikâye, fıkıh ilminde en muteber kaynaklardan biri olan İmam el-Mergînânî'nin ed-Dirâyesi'nin şerhlerinden biridir. Ayrıca eserde el-Mahbûbî'nin bahsetmediği bazı önemli metinlerin ve ayrıntılı meselelerin tafsilatlı açıklamaları da bulunmaktadır. Çalışmada, iki imam el-Mahbûbî ve İbn Kutluboğa'nın şahsi ve ilmi hayatı, dönemin siyasi, iktisadi ve sosyolojik durumu zikredilirken betimleyici analitik metot kullanılmıştır. Metnin harekelenmesi, nüshaların karşılaştırılması, metinde geçen bazı ifadelerin sahibine nispet edilmesi, metinde geçen meselelerin nerede geçtiğinin gösterilmesinde tahkik ve talik metodu takip edilmiştir. Çalışmada ulaşılan neticelerden önemlileri şunlardır: Eser, incelenen konulara dair Hanefi ulema ve diğer mezhep imamlarının tercih edilen görüşlerini içermektedir. Şerh, zor konuların çözümlenmesi ve bürhân yöntemiyle tercih edilen görüşün tespit edilmesinde önemli eserlerden biridir. İbn Kutluboğa, konuyu işlerken yorum yapabilmek için asıl kaynaktan nakil yaparken, lafız yönüyle değil, anlam bakımından müellife sadık kalmıştır. Müellif, müçtehid imamlardan sayılır. Sadece nakille yetinmemiş, delil ve hüccete göre tercih yapmıştır. Bunun yanında Kâsânî'nin Bedâi', Serahsî'nin Mebsût isimli eserlerinden nakil yaparken bir iki sayfayı harfi harfine aktardığı da belirtilmektedir. Sonuç olarak kitap, yazarın yaratıcılığını, geniş, ansiklopedik kültürünü yansıtan kaynaklarla zenginleştirilmiştir."
