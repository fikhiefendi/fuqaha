abstract: "Bu çalışma, Memlükler dönemi Hanefî hukukçularından Necmeddin et-Tarasûsî'nin vakıf hukukuna yaptığı katkıları, istibdâl (vakıf malının değiştirilmesi), istidâne (vakıf adına borçlanma) ve icâre-i tavîle (uzun süreli kiralama) meseleleri özelinde incelemeyi amaçlamaktadır. Araştırmanın temel sorusu, Tarasûsî'nin bu üç önemli alanda geliştirdiği özgün yaklaşımların Hanefî mezhep birikimi içindeki yerini ve sonraki dönem literatürüne olan etkisini tespit etmektir. Çalışmada, öncelikle Tarasûsî'nin ilmî şahsiyeti ve döneminin tarihsel bağlamı ele alınmış, ardından söz konusu üç mesele üzerinden onun yaklaşımları ve değerlendirmeleri detaylı bir şekilde tahlil edilmiştir. İstibdâl konusunda Tarasûsî'nin, vâkıfın yasaklayıcı şartı bulunsa dahi, maslahat gerekçesiyle ve kadı denetiminde bu işleme izin verdiği görülmüştür. İstidâne meselesinde ise vakfın borçlanma ehliyetini,“vakfın kiraya verilemez olması”şeklinde özgün bir şart ekleyerek meşrulaştırmış ve bu şart sonraki Hanefî literatüründe yaygın kabul görmüştür. İcare-i tavîlede, uzun süreli kiralama sözleşmelerinin sadece süre aşımına uğrayan kısmının geçersiz sayılması gerektiği yönündeki görüşü pratik bir çözüm önerisi olarak öne çıkmıştır. Onun istibdâl ve istidâne konularındaki katkıları Hanefî literatürüne kalıcı şekilde dahil olurken, icare-i tavîle yaklaşımının teoride yer bulsa da uygulamada aynı düzeyde benimsenmediği tespit edilmiştir. Elde edilen bulgular, Tarasûsî'nin tahrîc, tercih ve tashih gibi yöntemlerle mezhep içi görüşleri sistematize eden, uzlaştıran ve dönemin pratik ihtiyaçlarına cevap veren özgün ve görüşlerinin sonraki dönemde önemli ölçüde kabule mazhar olması bakımından etkin bir hukukçu olduğunu ortaya koymaktadır. Bu sonuçlar, Tarasûsî'nin Hanefî vakıf hukukunun teorik gelişimine ve Memlükler dönemindeki pratik işleyişine yön veren önemli bir entelektüel şahsiyet olduğunu kanıtlamaktadır."
