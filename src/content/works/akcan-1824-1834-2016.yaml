abstract: "Şer'iyye Sicilleri Osmanlı Devleti içerisinde var olan sosyal, kültürel, ve iktisadi hayatı günümüze taşıyan ve bize önemli bilgiler veren bu yönüyle geçmişe ışık tutan çok değerli yazılı kaynaklardan biridir. Osmanlı mahkemelerinde kaydedilen bu kıymetli belgeler kaleme alındıkları dönem ve bölge ile alakalı geniş ve önemli bilgiler içermektedir. Çalışmamız, Türk tarihi ve kültürü açısından büyük bir öneme sahip olan Şer'iyye Sicillerinden H.1239-1249/M.1824-1834 tarihlerini kapsayan Gaziantep'te kaydedilen Şer'î mahkeme kayıtlarını içermektedir. Toplam 456 sayfadan oluşan bu sicil defterinin 1-253 sayfa aralıklarını çalışma konumuz yaptık. Bu belgelerin 118 adedi hukuki içerikli, 288 adedi ise idari içerikli belgelerden oluşmakta olup toplam 406 adet belge bulunmaktadır. Defter tek taraflı kullanılarak merkezden gelen arzuhaller, nişân-ı şerîfler, fermanlar ve buyruldular gibi idari içerikli belgeler ile miras, nafaka, vasi tayini, boşanma, alacak verecek gibi hukuki içerikli belgeler karışık halde kaydedilmiştir. Bu defter doğrultusunda dönemin Gaziantep'inin idari, sosyal, kültürel, ekonomik durumu ortaya konulmaya çalışılmıştır. Transkripsiyonu yapılan belgelerin konuları, içerikleri, diplomâtik özellikleri, hicri-miladi tarihleri ve kısa belge özetleri tek tek tüm belgeler için ayrı bir tablo içerisinde sunularak okuyucuya kolaylık sağlanmaya çalışılmıştır."
