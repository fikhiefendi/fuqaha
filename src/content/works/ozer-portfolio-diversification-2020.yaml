abstract: "İnsanlar dini hassasiyetlerinden dolayı içinde belirsizlik olan veya dinen yasak olan (faiz, kumar benzeri, v.s.) meseleleri ihtiva eden konvansiyonel finansal araçlardan kaçınmaktadır. Böylelikle enflasyon gibi reel geliri azaltan sorunlarla karşılaşmaktadırlar. Enflasyona karşı altın gibi yatırım araçlarına yönelerek korunsalar bile kayıtdışı kalmakta ve ulusal ekonomiye katkıda bulunamamaktadırlar. Burada akla iki soru gelmektedir: Dini hassasiyeti olan yatırımcılar için finansal enstrümanlar mevcut mudur? Eğer mevcut ise, yatırımcılar bunlara yatırım yaparak enflasyona karşı korunabilir mi? Bu çalışma dini hassasiyeti olan bir yatırımcının açısından varlıkları ele alıp enflasyona karşı korunma sağlayıp sağlamadıklarını test etmiştir. Bu yatırım araçları katılım30 endeksi, döviz kurları, altın, katılım bankaları kar payı oranları, sukuk ve konut fiyatları endeksidir. Hisse senetleri bireysel olarak analize dahil edilmiştir ve enflasyona karşı test edilmiştir. Katılım bankaları olarak veri mevcudiyetine göre Albarak Türk, Kuveyt Türk ve Türkiye finans seçilmiştir. Döviz kurları olarak dolar ve euro hesaba katılmıştır. Hazine, özel kesim ve dow jones sukuk endeksi analize dahil edilmiştir. Konut fiyat endeksi merkez bankası veri sisteminden elde edilmiştir. Çalışma maksimum Mart 2003- Kasım 2019 dönemini kapsamaktadır. Bütün hesaplamalar türk lirası cinsinden yapılmıştır. Bu varlıklar enflasyona karşı test edilmişlerdir. Katılım 30 da bulunan hisse senetleri ile ilgili kısa dönemde yatırım için uygun olmadığı, 8-16 ay arasında ise enflasyona karşı korunma sağladığı tespit edilmiştir. Döviz kurları da hisse senetleri gibi kısa dönemde korunma sağlamazken, 4-8, 8-16 ay aralarında enflasyona karşı korunma sağlamaktadırlar. Katılım bankaları kar payı oranları herhangi bir enflasyondan koruma sağlayamazken, devletin ihraç ettiği sukuk kısa dönemde koruma sağlamaktadır. Konut fiyat endeksi enflasyondan korunma için uygun değildir. Aynı şekilde konvansiyonel varlıklar da ele alınmış ve bunlar karşılaştırmalı olarak analiz edilmişlerdir. Dini hassasiyeti olan yatırımcılara seçilen varlıkların konvansiyonel muadilleri olarak tahvil (2, 5, 10 yıllık), bist30 ve dow30'da işlem gören hisse senetleri ve mevduat faizleri kullanılmıştır. Bist 30, katılım 30 endeksi ile aynı özellikleri gösterdiği tespit edilmiştir. Bunun nedeni olarak Bist 30'un Türkiye'deki en önemli 30 şirketi kapsadığı söylenebilir. Bist30'daki şirketler diğer tüm şirketleri domine etmektedir. Dow30 şirketleri incelendiğinde, bu endeksteki şirketler kısa dönem haricinde orta ve uzun dönemde de enflasyona karşı korunma sağladıkları söylenebilir. Bu noktada uluslararası hisse senetlerinin ulusal hisse senetlerine izafi olarak ulusal enflasyona karşı daha iyi performans gösterdiği söylenebilir. Mevudat faizi ile ile katılım bankaları kar payı oranları çoğunlukla ilişkisiz olduğu tespit edilmiştir. Aynı özelliği göstermekle birlikte enflasyona karşı korumada yeterli olmadığı sonucuna varılmıştır. Tavhil ile sukuk karşılaştırıldığında, tahvillerin orta ve uzun dönem de enflasyona karşı koruma sağladığı tespit edilmişken, devlet sukukunun sadece kısa dönemde koruma sağladığı tespit edilmiştir. Sukuk verisinin az olmasından dolayı uluslararası sukuk endeksi analize dahil edilmiştir. Bununla tahviller karşılaştırıldığında sukukun da orta ve uzun dönemde enflasyona karşı koruma sağladığı gözlemlenmiştir. Enflasyon ile varlıklar arasındaki ilişkinin araştırılmasında Dalgacık analizi kullanılmıştır. Dalgacık analizi zaman serilerini farklı dönemlere ayırarak farklı dönemlerdeki ilişkilerin yönü hakkında bize bilgi sağlamaktadır. Bu bakımdan Dalgacık analizi dinamik korelasyonlar bulmakta ve lokal analizler yapabilmektedir. Dolayısıyla dalgacık analizi bize iyi bir iktisadi olayları hikayeleştirme imkanı sunmaktadır. Dalgacık analizinin iki türü vardır: Sürekli dalgacık dönüşümü ve Kesikli dalgacık dönüşümü. Çalışmada Sürekli Dalgacık Dönüşümü (CWT) ile kesikli dalgacık dönüşümünün bir versiyonu olan Maksimum Örtüşen Kesikli Dalgacık Dönüşümü (MODWT) kullanılmıştır. Sürekli dalgacık dönüşüm çok fazla gereksiz bilgi ürettiği için katsayı tahmininde kullanılmamaktadır. Ancak bize grafiksel olarak güzel bir görsel hazırlamaktadır. Makisimum Örtüşen Kesikli Dalgacık analizi ise bize toplulaştırılmış olarak korelasyon katsayılarını hesaplama imkanı vermektedir. Maksimumum örtülen kesikli dalgacık analiz çalışmada sonuçların kontrolü için kullanılmıştır. MODWT analizinin sonuçları istatistiksel olarak anlamlı değildir. Bunun nedeni enflasyondan dolayı veriyi aylık olarak alma zorunluğudur. Gözlem sayısının yetersizliğinden dolayı sonuçlar istatistiksel olarak anlamsız çıkmaktadır. Sonuçları anlamsız olsa bile CWT analizi sonuçlarını doğrulamaktadır. Çalışmada son olarak Markowitz portföy analizi yapılmıştır. Markowitz portföy analizi ile etkin sınır tahmin edilmiştir. Minimum riskli ve maksimum getirili portföyler tahmin edilmiş, etkin sınır üzerindeki on köşe taşı portföy tablo halinde sunulmuştur. Ayriyetten Sharpe rasyosuna göre portföy de analize eklenmiştir. Çalışmada iki farklı portföy yapılmıştır: Konvansiyonel portföy ve dini hassasiyetlere uygun portföy. Konvansiyonel portföy çalışmadaki bütün varlıkları içerirken dini hassasiyetlere uygun portföy sadece uygun varlıkları hesaba katmıştır. Markwitz portföy analizinin sonuçlarına göre her iki portföyde de en yüksek pay sukukun olmuştur. Düşük riskli portföyde iki portföy karşılaştırıldığında konvansiyonel portföyde ikinci sırayı düşük bir oranda tahviller almaktadır. Bu durum dini hassasiyeti olan yatırımcının az da olsa düşük riskte konvansiyonele göre dezavantajlı olduğunu göstermektedir. Risk arttıkça iki farklı portföyde de altına ayrılan pay artmaktadır, ancak artış dini hassasiyeti olan yatırımcıda daha fazladır. Belli bir eşiğe gelene kadar altının payı artmakta belli bir risk oranından sonra altının payı her iki portföyde de ciddi oranda düşmektedir. Döviz kurları düşük riskte çok küçük oranda tercih edilmektedir. Risk arttıkça hisse senetlerine olan yatırım artmaktadır. Bu durum iktisat teorisiyle uygun düşmektedir: Risk arttıkça getiri artar. Riskin yüksek olduğu durumda dini hassasiyetlere uygun portföyde katılım 30 endeksi en yüksek oranda paya sahipken, konvansiyonel portföyde katılım 30'un payı yarı yarıya düşmektedir. Bu durum dini hassasiyyeti olan yatırımcının yüksek riskte ciddi anlamda dezavantajlı olduğunu göstermektedir. Aynı zamanda konvansiyonel portföyde yönelim uluslararası hisse senetlerine olmaktadır. Bu durum ulusalarası hisse senetlerinin ulusal hisse senetlerinden daha iyi bir getiri sağladığını göstermektedir. Sonuç olarak sukuk dini hassasiyeti olan bir yatırımcı için çok önemli bir yatırım aracıdır. Tahvil gibi vergilendirmede, alım komisyon maliyetinde aynı olduğunu ve ikincil piyasasının da tahvil gibi likit ve ulaşılabilir olduğunu varsayarsak sukuk, hem konvansiyonel yatırımcıya hem de dini hassasiyeti olan yatırımcıya ciddi getiriler sağlayabilir. Bu noktada politika yapıcı olarak devlete sukuk piyasasının güçlendirilmesi ve derinleştirilmesi noktasında görevler düşmektedir. Altın yüksek riskte önemini korumaktadır. Hisse senetleri ise uluslararası hisse senetleri ile karşılaştırıldığında yeterince iyi olmadıkları tespit edilmiştir. Bundan dolayı hisse senetleri ihraç eden firmaların finansman araçlarına yönelik çalışmalar önem arz etmektedir."
