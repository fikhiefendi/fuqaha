abstract: "İman ve İslam kavramları kelâm ilminde üzerinde en çok durulan ve ayrıntılıbir şekilde işlenen konulardandır. Bunun sebebi, man ve slam'ın dinin merkezindebulunması ve dini hayatın bütün yönlerinin bu merkeze göre anlam ve değerkazanmasıdır. lâhi mesajın ana gayesi bir olan Allah'a inanmak ve O'nun emir veyasakları doğrultusunda hareket etmektir. Kur'an-ı Kerim'de ve muteber hadiskitaplarında imân konusuna bu ehemmiyetten dolayı oldukça fazla yer verilmiştir.Ebu'l- Muûn en- Nesefû'nin man tarifinde ?tasdik? kavramı oldukça önemlibir yere sahiptir. Ona göre manın hakikatı, kalbû tasdiktir. Diğer unsurlar (ikrar, bilgi,amel) imanın var olması için şart değildir. Fakat bunlar gereksiz de değildir. krar,bilgi, salih amel ve imana götüren başka unsurlar imanın kemâli için önemlidir.Nesefû'ye göre tasdik olmadan ne ikrar ne bilgi ne de salih ameller iman sayılmaz.Büyük günah işleyen kimsenin de eğer kalbinde tasdik mevcut ise o da Mü'mindir,Müslümandır.Nesefû'ye göre slâm, nefsini tümüyle Allah'a teslim etmek demektir. manve slam dil yönünden farklılık arz edebilirler. Fakat kendileriyle hedeflenen amaçaçısından bunların ikisi de aynı konumdadır. mân, inanılacak hususları, slam dayapılacak fiilleri ihtiva eder. Bunların ikisi de bir dinin vazgeçilmezleridir. FakatMu'tezile'nin dediği gibi bunların ikisi bir değil birbirini bütünleyen bir şeyin içiyledışı gibi ayrılmaz iki unsurudur. Dolayısıyla imân ve slam ayrı ayrı şeyler değildir.Ayrılık ancak dildeki kullanımı yönündedir. manın bütün şartlarını yerine getiren birkimsenin, Müslüman olmadığını ileri sürmek nasıl mümkün değilse, islâmın tümşartlarını yerine getiren bir kimsenin de mü'min olmadığını söylemek akıl, mantık veen önemlisi din yönünden mümkün değildir."
