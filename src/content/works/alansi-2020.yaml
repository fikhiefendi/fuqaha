abstract: "Bu çalışmanın amacı, yasal riskleri, türlerini ve biçimlerini bilmek ve aynı zamanda yatırım için finansman ve form oluşturmada ve taklitten uzakta inovasyon ve özgünlük üzerinde çalışmak için meşru riskleri yönetme ve ölçme ilkelerinin pratik yönünü tanımlamaktır. Bu araştırmanın önemi, İslam bankacılığındaki hızlı gelişmenin ve geleneksel bankalardaki işlemlerle örtüşen ve benzerlik gösteren sözleşmelerin ve işlemlerin çeşitliliğinin ışığında ortaya çıkmaktadır. Araştırma, araştırmanın konusu ile ilgili kısmi bilgileri, dört okuldaki referansların annesi olan orijinal kaynaklarından ve akademisyenlerin, geçmiş ve şimdinin sözlerini ve kaydettiğim bilginin doğruluğuna ve kesinliğine ulaştıklarından emin olduklarını kanıtlarken, orijinal kaynaklarından kısmi bilgi toplamada tümevarım yöntemini benimsedi. Arama .. Arama bir dizi sonuç ve öneri ile sona erer."
