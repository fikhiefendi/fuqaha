abstract: "İslâm hukuku, insan hayatını anne rahmine düştüğü ilk andan itibaren kutsal bir varlık olarak kabul eder. Bu anlayış doğrultusunda zarurat-ı hamse olarak insanın canı, malı, dini, nesli ve aklını korumayı esas alır. Çalışmamızda İslâm hukukunda cenin ve çocuklara tanınan haklar ele alınarak, bireyin henüz dünyaya gelmeden önce sahip olduğu hukukî statü ve haklardan başlayarak çocuğa tanınan kişisel ve sosyal haklar Kur'ân ve sünnetten hareketle ele alınacaktır.“İslâm Hukuku'nda Cenin ve Çocuk Hakları”nı konu edinen bu tez; giriş, iki ana bölüm ve sonuçtan oluşmaktadır. Çalışmamızın giriş kısmında konuya ön hazırlık olması amacıyla araştırmanın konusuna, önemine, amacına, kapsam ve metoduna yer verilerek izah edilmiştir. Birinci bölümde, konunun kavramsal tanımlamalarına ve cenin başlığına yer verilmiştir. Ceninin geçirdiği evreler Kur'ân ve sünnet ışığında ve tıp ilminde olmak üzere açıklanmıştır. Bu kavram ve tanımlamalar çalışmamızın temelini oluşturmak için önemli bir destek niteliğindedir. Çalışmamızın ikinci bölümünde ise, doğum öncesinde ve sonrasında olmak üzere çocuğa tanınan kişisel ve sosyal haklar ele alınmış, bu haklar İslâm Hukuku'nun temel kaynakları olan Kur'ân ve sünnetten hareketle ele alınmıştır. Sonuç bölümünde ise, elde ettiğimiz bulguları özetlenerek, İslâm hukukuna göre cenin ve çocuk haklarına ilişkin temel ilkeler maddeler halinde sunulmuştur."
