abstract: "Bu araştırmanın amacı, Ebussuûd Efendi'nin yazmış olduğu“İrşadü'l-Aklı's-Selim ila Mezayi'l-Kitabi'l-Kerim”adlı tefsirini, Tefsir Usûlü yönünden incelemektir. Araştırma, giriş ve onu takip eden üç bölümden meydana gelmiştir. Giriş bölümünde müfessirin hayatı, eserleri ve tefsiri üzerinde durulmuştur. Birinci bölümde, Kur'an Tarihi bağlamında ele alınan konular, Ebussuûd Tefsirinde ele alınıp işlenmiştir.İkinci bölümde“Ebussuûd Tefsirinde Tefsir Usûlü Uygulamaları”konusu mevz-u bahs edilmiş, bu cümleden olarak“Kur'an'ın Lafzı ve Anlamıyla İlgili İlimler”başta olmak üzere,“Kur'an Tarihi İlimleri”müffessirin tefsirinden hareketle ele alınıp incelenmiş, O'nun bu konular hakkındaki görüş ve düşünceleri tesbit edilmeğe çalışılmıştır.Üçüncü bölümde ise, Ebussuûd Efendi Tefsiri'nin özelliklerine ve O'nun tenkit edildiği hususlara değinilmiştir."
