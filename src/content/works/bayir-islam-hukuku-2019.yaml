abstract: "Evlilik birliğinin sonlandırılmasıyla birlikte eşlere İslam hukukunda haklar ve yükümlükler getirilmiş ve taraflardan bunların yapılması istenmiştir. Evlilik birliğinin bitmesinden hemen sonraki dönem olan iddet döneminde tarafların dikkat etmesi gereken kurallar vardır. Mehir, nafaka, maddi ve manevi tazminat boşanmanın hukuki sonuçlarındandır. Yerine getirilmesi gereken önemli yükümlülüklerden biri boşanan tarafların varsa çocuklarının bakım, eğitim ve terbiye etme işi yani hidânedir."
