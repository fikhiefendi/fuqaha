abstract: "Ağ pazarlama sözleşmeleri; geniş bir pazarlama yöntemiyle, bağımsız, doğrudan satıcılar vesilesiyle, ürünleri tüketicilere ulaştıran ve ürün satışının yanında yeni bağımsız satıcıları sisteme dahil ederek geniş ürün pazarına ulaşmak için yapılan sözleşmelerdir. Sisteme katılan doğrudan satıcılar, firma tarafından eğitim, teşvik edici ödül ve prim desteği ile bir süre sonra sisteme yeni pazarlama üyeleri kaydederek pazarlama ağını genişletmeye büyük destek olur. Bu çalışmanın amacı ağ pazarlama sisteminin ve içinde barındırdığı farklı sözleşme çeşitlerinin İslam Borçlar Hukukuna göre değerlendirilmesidir. Birinci bölümde ağ pazarlama sisteminin tanımı, tarihi gelişimi, ağ pazarlamanın benzer satış yöntemlerinden ve yasal olmayan satış yöntemlerinden farkları, sistemin işleyiş şekli ve olumsuz tarafları ele alınmaktadır. İkinci bölümde ise İslam Borçlar Hukuku açısından sözleşme kuralları, sözleşmelerin unsur ve şartları, helal kazancın önemi, benzer sözleşmelerle karşılaştırılması bakımından; ağ pazarlama hakkında alimlerin ve fetva kurullarının verdikleri fetvalar ışığında ağ pazarlama sistemi incelenmiştir. Çalışmanın sonunda İslam Borçlar Hukukuna göre ortaya çıkan sonuçlar aktarılmıştır. Sonuç olarak ağ pazarlama sisteminin İslam Borçlar Hukukuna göre içinde barındırdığı birçok problem tespit edilmiştir. Sistem, İslam Borçlar Hukukuna uygun değildir. Ağ pazarlama sisteminin ürün satışı görünümü ile pazarlama ağını genişletmek isteyen bir pazarlama yöntemi olduğu sonucuna ulaşılmıştır. Ancak gerekli yasal düzenleme ve denetmeler yardımıyla İslam Borçlar Hukukuna uygun olabileceği kanaatine varılmıştır."
