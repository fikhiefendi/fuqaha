abstract: "Çalışma, Hanefî fakîhlerin, muhaddisler tarafından zayıf olarak değerlendirilen hadisleri hüküm istidlâlinde kullanma sebeplerini konu edinmektedir. Başta Ebû Hanife ve talebeleri olmak üzere daha sonraki asırlarda yaşamış Hanefî fakîhlerin zayıf hadis kullanma sebeplerini tespit etmeyi amaçlayan bu çalışmada Mergînânî'nin el-Hidâye isimli eserindeki hadisler temel alınmıştır.Araştırmamız, giriş bölümü hariç iki bölümden oluşmaktadır. Giriş bölümünde tezin mahiyeti, zayıf hadisin ne olduğu ve el-Hidâye'de kullanılan hadislerin sıhhat durumları hakkında bilgiler verilmiştir.Birinci bölümde, Hanefîlerin, muhaddisler tarafından zayıf hükmü verilen hadisleri kullanma sebepleri arasında yer alan, hadislerin zayıf olduğunu kabul etmeme başka bir ifadeyle bu rivâyetleri makbul görme sebepleri üzerinde durulmuştur.İkinci bölümde ise, Hanefî mezhep imamlarının zayıf olduğunu kabul ettikleri bazı hadisleri buna rağmen hangi sebeplerle kullanmış olabilecekleri konusundaki öngörülerimiz sunulmuştur."
