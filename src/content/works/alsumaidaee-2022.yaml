abstract: "Hayber istilası, Muharrem ayında Hicret'in yedinci yılında gerçekleştiği gibi, Allah Resûlü'nün (sallallahu aleyhi ve sellem) önderlik ettiği istilalardan biridir ve bunun uzmanı, Medine'nin kuzeyinde bulunan, sakinleri Yahudi olan ve bu istilada Allah Resûlü'nün (sallallahu aleyhi ve sellem) tarafından işgal edilen, kale ve kalkanlarla dolu büyük ve zaptedilemez bir şehirdir. Hudeybiye'nin Kureyş'le barışması ve bu uzlaşma ile Kureyş'in tarafının güvence altına alınması, Resûl-i Ekrem ve ashabı barıştan sonra Medine'ye döndüler, bu yüzden Medine'de Dhu al-Hijjah ayını ve biraz Muharrem ayını yayınladı ve daha sonra orduyu hazırlayarak Yüce Allah'ın kudretiyle açmak niyetiyle Hayber'e gitti, bu savaşta Müslümanların yaşadığı şartlar nedeniyle birçok şeriat hükmünün indiği bir savaş. Araştırmacı, ilk bölümde Hayber'in işgalinde ortaya çıkan en önemli kararları belirleyerek ve Yahudilerle savaşmak için araştırmanın başlığını ve tüm içtihat hükümlerini seçmenin önemine değinerek, işgaldeki ganimetlerin bölünmesinin hükümlerine değinirken, ikinci bölümde araştırmamız Hayber'in işgalinde başlayan yiyecek ve çizgilerin hükümlerine ve bazı yiyeceklerin yasaklanmasının ve analiz edilmesinin nedenlerine kadar genişledi. Üçüncü bölümdeki araştırma bizi, topraktan çıkanların bir kısmı ve hükümlerinin İslam hukuku tarafından harcanan şeylerle birlikte kursların ve çiftliklerin yönetimine getirdi."
