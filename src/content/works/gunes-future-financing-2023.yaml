abstract: "Bu tez, altyapı yatırımları ve finansman yöntemleri ile ilgili bir gelecek projeksiyonu ortaya koyma vizyonuyla ileriye dönük bir bakış açısını beş ana başlık altında ele almaktadır. Birinci; altyapı nedir, türleri nelerdir, altyapının karakteri ve altyapı yatırımlarının etkileri. İkincisi; Sürdürülebilir Kalkınma Hedefleri (SKH), SKH'ler ile altyapı yatırımı arasındaki ilişki, iklim değişikliği, ESG (çevresel, sosyal, yönetişim), ESIA (çevresel ve sosyal etki değerlendirmesi) ve InfraTech'in tartışıldığı altyapı yatırımlarını etkileyen trendlerdir. Üçüncü; altyapıların yenilikçi finansman araçlarına odaklanılması, yatırım finansmanının dijitalleştirilmesi, yenilikçi İslami finans, blockchain-kripto para birimleri-CBDC'ler, yeşil tahviller ve iklim tahvilleri ilgi konularıdır. Dördüncü; iklim değişikliğinin etkisindeki dünyada altyapı yatırımlarının geleceği ile yeni, şimdi, sonraki ve altyapı yatırımlarının nelere ihtiyaç duyduğu ve gelecek projeksiyonu ortaya kondu. Çalışmada belirtilen tüm durum ve sonuçlar dikkate alındığında, altyapı yatırımları, karbon net sıfıra ulaşmak, adil ve sürdürülebilir ekonomik büyüme sağlamak ve Birleşmiş Milletler SKH'ne doğru ilerlemeyi hızlandırmak için en etkili araçlardan biridir. En önemlisi, devasa yatırım açığını kapatmak için altyapı geliştirme ve finansman hızını ve ölçeğini hızlandırmak gerekiyor. Altyapı yatırımlarının sadece bugün değil gelecekte de önemli olduğu ve altyapı yatırımları konusunda yapılması gerekenler aktarıldı."
