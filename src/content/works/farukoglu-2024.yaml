abstract: "Konunun hedefi katılım bankalarıyla finansmanın refahı sağlamadaki rolü, Türkiye'deki yaşayan Arap müşterilerin katılım bankalarındaki finansman düzenidir. Yazarın kast ettiği refah Kur'an, sünnet ve sahabi sözleridir. Ve yakın zamandaki alimlerin tanımını da içermektedir. Bu bağlamda id diner ölçümü ile aralarındaki refah seviyesini belirtmektir. Bu araştırma esnasında Türkiye'de yaşayan araplardan 70 kişiyle örnek çalışma yapılmış olup, bunlar Türkiye'de İslami Bankalardan Finansman elde etme fırsatı bulmuşlardır. Araştırmacı araştırmayı hazırlarken refah kavramını ve onun İslam ekonomisindeki köklerine ilişkin tüm bilgilerde tümevarımsal yaklaşımı kullanmaya karar vermiştir. Araştırmacının ulaşmış olduğu önemli sonuçlardan bazıları şunlardır: Özellikle İslami Finansal Bankalarda memnuniyet diğer devlet bankalarına nazaran daha fazladır, Araştırmanın ikinci ve en önemli sonucu ise güvende hissetmedir. Ve bu durum Türkiye'deki Arap müşterilerinin İslami Finansman Bankalarından elde etmiş olduğu refah seviyelerini değiştirmiştir. Bu oran % 50'yi geçmiştir. Yaklaşık %60'ı ankete katılan müşterilerin özellikle tercihi güven hissi olmuştur. %50'nin üstündeki katılımcılar İslami harcamalardan finansman sağladıktan sonra kendilerine daha iyi bir gelecek sağlama konusunda bir değişiklik hissetmişlerdir."
