abstract: "Finansal faaliyetlerin İslam hukuku kuralları çerçevesinde gerçekleştirilmesi katılım finans olarak tanımlanmaktadır. Faiz, aşırı belirsizlik (garar), kumar, haram mal ve hizmetler katılım finansın yasakları arasında yer almaktadır. Ticaret esasına, kâr zarar paylaşımı prensibine göre işleyen katılım finans ürünleri, katılım finans sisteminde kullanılan yöntemlerdir. Katılım bankaları katılım finans sistemine göre faaliyet gösteren kurumlar olarak kabul edilmekte ve faaliyetlerini katılım finans ürünlerini kullanmak suretiyle gerçekleştirmektedirler. Bu çalışmanın amacı; katılım finans ürünlerinin muhasebe kayıt süreçlerini, Türkiye Muhasebe Standartları / Türkiye Finansal Raporlama Standartları (TMS/TFRS) ve Faizsiz Finans Muhasebe Standartları (FFMS) kapsamında uygulamalı olarak açıklamak ve tartışarak öneri geliştirmektir. Kamu Gözetimi Muhasebe ve Denetim Standartları Kurumu (KGK) tarafından yayınlanan FFMS kapsamında yer alan katılım finans ürünleri çalışmanın kapsamını oluşturmaktadır. Çalışmanın amacı ve kapsamı doğrultusunda; işletme ve katılım bankalarının ticari ilişkileri bağlamında kurgulanan örneklerin uzman görüşleri dikkate alınarak çözümlemesi çalışmanın uygulama bölümünde yer almaktadır. Katılım finans ürünlerinin TMS/TFRS ve FFMS ekseninde muhasebe süreçlerine ait örnek uygulamalar ilgili standartlar çerçevesinde eleştirilerek öneriler sunulmaktadır. Aynı zamanda muhasebe süreçlerinde işletme ve katılım bankaları tarafından kullanılan mevcut Tek Düzen Hesap Planları (TDHP) da eleştirilerek katılım finans ürünleri için TDHP'de yer almayan hesaplar önerilmektedir. Ayrıca; bu çalışma katılım finans ürünlerinin, TMS/TFRS ve FFMS kapsamında muhasebe kayıt süreçlerine ilişkin öncü bir çalışma olarak literatüre ve bu alandaki uygulayıcılara katkı sağlaması açısından önem arz etmektedir."
