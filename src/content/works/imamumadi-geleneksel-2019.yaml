abstract: "Bu çalışmada büyük bozkır ile İslam medeniyeti sınırları arasında gelişen Kazak hukuk sistemi ve geleneksel Kazak toplumunda uygulanagelen hukuki kurallar İslam hukuku açısından ele alınmıştır. Klasik fıkıh kaynaklarına göre Kazak örf kurallarının değerlendirilmesi yapılmış, uygulamaların arasındaki benzerlikler ve farklılıklar tespit edilerek İslam hukuku ile ilişkisi gösterilmeye çalışılmıştır. Araştırmamız giriş ve üç bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu ve amacı, yöntemi hakkında bilgi verilmiştir. Birinci bölümde genel olarak örf ve âdet terimleri, örf ve âdetin hukukta kaynak oluşturma meseleleri ele alınmıştır. İkinci bölümde ise Kazak toplumundaki hukuki yapı, Kazak örf hukukunun özellikleri, halk mahkemesi olan \"biler\" müessesesi üzerinde durulmuş, XIX. yy.da yürütülen hukuki reformlar hakkında değerlendirmeler yapılmıştır. Ana bölümü oluşturan üçüncü bölümde ise geleneksel Kazak toplumunda en çok uygulamada olan toprak davaları, aile hukuku kuralları, suç ve ceza konularına yer verilmiş, önce Kazak hukuk uygulaması daha sonra İslam hukukundaki uygulamalara yer verilerek benzerlikler ve farklılıklar hakkında yorumlar yapılmıştır."
