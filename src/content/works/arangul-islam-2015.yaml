abstract: "Günümüzde milyonlarca müslüman, gerek çoğunluk oldukları kendi ülkelerinde gerekse azınlık oldukları gayrimüslim ülkelerde, gayrimüslimlere ait olan ya da dayanağı İslam olmayan kanunlara muhatap olmaktadırlar. Müslümanların dinî hassasiyetinin, pozitif hukukun şekillendirdiği hayatın gerçekleri ile karşılaştığı; bu ikisi arasındaki ilişkinin, uyum, gerilim veya çatışma şeklinde kendini gösterdiği örneklerle sık sık karşılaşabilmekteyiz. Bu hususta sahip olunacak doğru bilgi, hayatî bir önem arz etmekte olup İslâm dini ile pozitif hukuk arasındaki uyum, gerilim veya çatışmaların varlığı ve niteliği hususunda belirleyici bir mahiyete sahiptir. Çalışmamızda, bütün insanlığı bağlayan ortak değerlerin bulunup bulunmadığı ve bu değerlerin dünyevî ve/veya uhrevî bir sorumluluğa temel teşkil edip edemeyeceği; dinî emir ve yasakların ne kadarının, ne düzeyde bir hukukî bağlayıcılığa sahip olduğu; içinde bulunulan ülkenin, kanunların bağlayıcılığını etkileyip etkilemediği; bu zikredilenlere ve İslam hukukunun diğer –temel- kurallarına bağlı olarak, referans noktası İslam olmayan kanunların Müslümanlar üzerinde bağlayıcı olup olmadığı; modern hukuk ve tarihsel bağlam dikkate alınarak İslam hukuk literatürü çerçevesinde cevaplandırılmaya çalışılmıştır. Anahtar Kelimeler : İslâm, ülke, dârülharp, dârülküfr, dârülislâm, müslüman,gayrimüslim, hukuk, kanun, bağlayıcılık, geçerlilik, teklif, hüküm, mükellefiyet"
