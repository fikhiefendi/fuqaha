abstract: "“İSLAM HUKUKUNDA İÇTİHAT EHLİYETİ VE ŞARTLARI”adlı bu tez, herhangi bir mezhep üzerine yoğunlaşmaksızın metodolojik sınırlar içerisinde kalmakta ve başta içtihat olmak üzere fıkıh usûlünün diğer meseleleri ile münasebetler kurup bunlar hakkında hem Temel İslam Bilimleri hem de Sosyal Bilimlerden faydalanarak ortaya multidisipliner bakış açılarını getirmeye çalışmaktadır. Burada, klasik anlatımıyla içtihatta aslî konu öncüllerinin ve onlara ilişkin meselelerin araştırılması ardından alan dışı bilimlere yer verilmesi önemlidir. Çünkü, literatürde bizim tespit edebildiğimiz kadarıyla tanımlanan şekil ve içerikle içtihat şartlarını ele alan müstakil bir esere rastlanmamaktadır. Ayrıca, klasik eserlerden görüşlerin saptanması, onlar hakkında iddiacı söylemlerden kaçınmak, onları imkân nispetinde objektif olarak değerlendirmek, deliller arasında herhangi bir görüşü seçmek yerine bu tezin konusu olması hasebiyle içtihat merkezli düşüncelere ağırlık vermek, çoğunlukla irtibatlı meselelerin ve bunlara yakın mevzuların araştırılmasından kaynaklanan muhtemel eksik veya hatalı yaklaşımlardan dolayı ihtimalli ve tedbirli cümlelere başvurmak gibi unsurlara dikkat edilmiştir. Bahse konu olan araştırma, her bir içtihat probleminin birbiriyle olan sıkı bağından kaynaklı sonuçların müçtehidin varlığına, mertebelerine ve taklidine etkisinin ardında yatan sâiklerin içtihat şartlarıyla yakınlığını anlayarak mezkûr şart teorilerinin zannî değer yargılarıyla verilen birer içtihat formunda sayılabileceği, onların zamanla değişebileceği, dokunulmaz olmadıkları ve bugün ki bakış açılarının dönüşmesiyle onların da farklılaşması gibi neticeleri gözler önüne sermektedir. Elinizde ki çalışma sırasıyla giriş, üç bölüm ve sonuçtan meydana gelir. İlk bölümünde içtihat ve buna yakın konularla ilgili meseleler irdelenip müçtehit kavramıyla ilişkisi anlatılmaktadır. İkinci bölümde içtihat şartları ayrıntılı olarak ele alınmıştır. Üçüncü bölümde ise onlar Sosyal Bilimler çerçevesince incelenmiş ve son kısımda yer bulan sonuç başlığı ile hedeflenen netice betimlenmiştir."
