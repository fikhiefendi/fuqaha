abstract: "Bu çalışma, devlet kira sertifikalarının (Devlet sukûk) nazarî çerçevesini derinlemesine tahlil etmeyi ve bu enstrümanın amelî (uygulamalı) yönünü irdelemeyi hedeflemektedir. Sukûkun makroiktisadî göstergeler üzerindeki etkisi, özellikle gayrisafi yurt içi hasıla (GSYİH), bütçe açığı, para arzı ve cari işlemler dengesi üzerinden incelenmiştir. Ana değişken olarak devlet sukûku ele alınırken, bu etkinin daha sağlıklı ölçülebilmesi amacıyla ikincil bağımsız değişkenler olarak döviz rezervleri, kamu borcu ve devlet tahvilleri de modele dâhil edilmiştir. Araştırma kapsamı, 2011–2022 yılları arasında sukûk ihraçlarında önde gelen bazı İslâm ülkeleriyle sınırlandırılmıştır. Bu ülkeler Endonezya, Türkiye, Malezya, Bahreyn, Pakistan ve Katar'dır. Metodoloji açısından; çalışmada öncelikle ilgili literatürün tetkikine yönelik istikrâî (tümevarımcı) yöntem kullanılmış, devlet sukûku piyasasının işleyişi ve ekonomik fonksiyonu tasvirî-tahlilî yaklaşımla ele alınmış, örneklem ülkelerin tecrübeleri mukayeseli olarak değerlendirilmiştir. Nicel verilerin değerlendirilmesinde ise panel veri analizi yöntemine müracaat edilmiştir. Araştırma sonucunda ulaşılan temel bulgulardan biri, devlet sukûklarının GSYİH ve para arzı üzerindeki etkisinin sınırlı olması sebebiyle ekonomik büyüme ve enflasyonun kontrolü açısından müspet bir katkı sunamadığıdır. Bununla birlikte sukûkun bütçe açığının azaltılması ve cari işlemler dengesinin iyileştirilmesi noktasında kayda değer olumlu etkileri tespit edilmiştir. Ancak bu tesirin genel itibarıyla zayıf kalması, sukûk ihracının ülkelerin iktisadî hacmine kıyasla düşük seviyede gerçekleşmesi ve mevcut bazı yapısal eksiklikler ile karşılaşılan hukukî ve iktisadî zorluklara bağlanmıştır. Bu bağlamda sukûkun daha etkili bir ekonomik araç hâline gelebilmesi için uygun hukukî ve kurumsal zeminin oluşturulması gerekmektedir."
