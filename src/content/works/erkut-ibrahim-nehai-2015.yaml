abstract: "İbrahim en-Nehaî'nin ibadetlerle ilgili fıkhi görüşleri adlı tezimizde, Nehaî'nin ibadetlerle ilgili görüşlerini, ilmihâli dizilişle incelemeye çalıştık. Tezimiz giriş ve iki ana bölümden oluşmaktadır. Giriş bölümünde konunu önemi ve amacıyla ilgili bilgi verilmiştir. İlk bölümde Nehaî'nin hayatından ve fıkhî kişiliğinden bahsedilmiştir. İkinci bölümde ise tezimizin asıl konusu olan Nehaî'nin fıkhî görüşleri ibadetler bağlamında ele alınmıştır. İbrahim en-Nehaî'nin fıkhî görüşleri ilk dönem fıkıh kitapları incelendikten sonra, değerlendirilmiş ve belli bir dizilişle tezimiz içerisinde aktarılmıştır. Küfe de İbn Mesud'la beraber temeli atılan rey mektebinin bir müktesibi olarak yerini alan Nehaî, hocası ve aynı zamanda İbn Mesud'un öğrencisi olan Alkame b. Kays'tan öğrenmiş olduğu bu mektebi, öğrencisi Hammad aracılığıyla Ebû Hanife'ye aktarmış ve bu yönüyle de Hanefi mezhebinin oluşumuna katkıda bulunmuştur. Nehaî'nin görüşlerini öğrenmek bizim aynı zamanda ilk dönem fıkıh âlimlerinin fıkhî anlayışları hakkında bilgi sahibi olmamızı sağlar. Böylece ilk dönem fıkıh âlimlerini daha yakından tanıma fırsatını elde ederiz."
