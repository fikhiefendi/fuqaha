abstract: "Bu çalışmada, zimmîlere ait mâbedlere yönelik serbestlik ve kısıtlamaların hukukî alt yapısı ve söz konusu hükümlerin usûlî dayanakları tespit edilerek zimmîlere ait mâbedlerin hukukî statüsünün ortaya konması amaçlanmıştır. Tez iki bölümden oluşmaktadır. Birinci bölümde konu ile doğrudan irtibatlı olması sebebiyle İslâm hukukunda ülke ve vatandaşlık kavramları ele alınmıştır. İkinci bölümde öncelikle konuyla ilgili kavramlara ve söz konusu hukukun oluşumunda etkili olan delillere, ardından da mezheplerin görüşlerine yer verilmiştir. Mezheplerin görüşlerine yer verilirken mezhep içi ve mezhepler arası ihtilaf ve ittifak noktaları, farklı görüşler hakkındaki tercihlerin zaman içindeki seyri ve fakihler tarafından nasslar dışında ortaya konulan ve usûlî dayanakları gösteren aklî deliller incelenmiştir. Çalışma neticesinde, İslâm hukuku tarafından diğer dinlere ait mâbedlerin birer dinî sembol ve hâkimiyet alameti olarak değerlendirilmekte olduğu tespit edilmiştir. Bu bakımdan gayrimüslimlere ait mâbedler diğer bazı dinî semboller ile birlikte dinî propaganda aracı olacağı ve İslâmın hâkimiyetine şeklen rekabet ve muhalefet anlamı taşıyacağı yerlerde kısıtlanması gerektiği neticesine ulaşılmıştır. Müslümanların savaşarak kazandığı ve bizzat Müslümanların kurduğu şehirlerde arazi mülkiyetinin Müslümanlara ait olmasının da İslâm hukukçuları tarafından zimmet ehlinin mâbedleri hakkında bir diğer kısıtlama sebebi olarak değerlendirildiği görülmüştür. Zimmîlere dinen ihtiyaç duymaları sebebiyle, dinî propaganda aracı sayılmayan ve İslâm'a muaraza anlamı taşımayan yerlerde kendilerine ait mâbedler hususunda serbestlik tanınacağı sonucuna varılmıştır."
