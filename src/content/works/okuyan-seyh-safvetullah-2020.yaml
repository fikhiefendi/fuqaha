abstract: "Bu çalışma Doğunun meşhur müderrislerinden Ohin'li Şeyh Safvetullah'ın (1939-1989) Osmanlı Devleti'nin son dönem ulemâsından dedesi Şeyh Alâuddîn el-Ohinî'nin (1881-1949) fıkıh ilmi alanında yazmış olduğu manzum bir eser olan Celâu'l-Ayn adlı eserinin“Ferâiz”bölümüne yaptığı şerhin tahkik ve tahlilidir. Araştırmamızı genel çerçevede Türkçe ve Arapça olmak üzere iki kısımda ele aldık. Türkçe kısmı giriş ve iki ana bölümden oluşmaktadır. Giriş kısmında araştırma hakkında genel bilgiler verildi. Birinci bölümde; vezin/ana metin sahibi ve şerh sahibi müelliflerin hayatı ve eserleri incelenirken, ikinci bölümde ise tahkik ve tahlilini hedeflediğimiz şerh ile tahkikte takip edilen yöntem ve metot hakkında bilgilendirme yapılmıştır. Üçüncü bölümde ise eserin yazma nüshaları karşılaştırılmış, metne açıklayıcı dipnotlar eklenmiş ve tahkiki yapılan metin oluşturulmuştur."
