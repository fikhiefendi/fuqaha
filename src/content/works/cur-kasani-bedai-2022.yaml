abstract: "Bu çalışmada Kâsânî tarafından telif edilen Bedâʾi'u'Sanâi adlı eserin nikâh, talak gibi aile hukuku kapsamına giren bölümlerinde İmam Mâlik ve Mâlikî mezhebine ait görüşlerin aidiyeti incelenmektedir. Giriş ve iki bölümden oluşan bu çalışmanın giriş bölümünde araştırmanın konusu, amacı, önemi, yöntemi, kapsamı ve sınırlılıkları yer almakta, yararlanılan kaynaklara da işaret edilmektedir. Daha sonrasında Kâsânî'nin hayatı, eserleri ve Bedâʾi'u's-Sanai' fi Tertibi'ş-Şerâ'i' adlı eserin muhteva ve sistematiği tanıtılmaktadır. Giriş kısmından itibaren münâkehât ve mufârakât konuları ele alınmış olup Nikâh, Talak, Zıhâr, Rada', Hidâne ve Nafaka gibi konular işlenmiştir. Bu başlıklar altında 19 görüş açıklanmış, bunlardan 13 tanesinin isabetli, 5 tanesinin hatalı, 1 tanesininde ise nisbet edilen görüşün zayıf olduğu tespit edilmiştir. Konuya mahiyetinin anlaşılması itibariyle kısa bir giriş yapıldıktan sonra ihtilaflı olan meselenin önemli görüldüğü kadarıyla bazı yönlerine değinilmiş, sonrasında İmam Mâlik veya Mâlikî mezhebinin görüşü olarak serdedilen görüş aktarılmıştır. Bu kısım tamamlandıktan sonra görüşlerin İmam Mâlik veya Mâlikî mezhebine aidiyeti üzerinde durularak Mâlikî Mezhebinin önemli kaynaklarına inilmiştir. Beda'i'de ele alınan konunun isabet veya hata ettiği de buradan sonra sonuç olarak ifade edilmiştir. Kâsâni'nin Bedâʾi'u's-Sanâi' fî Tertibi'ş-Şerâ'i' adlı eserinde isabet kaydetmeyen bazı konular bulunsa da görülen bu noksanlıklar eserin kaynak olma niteliğini kaybettirmemiştir. Tasnif ve tertibiyle Hanefi literatüründe farklı bir konuma sahip olan bu kitap, tâli meseleler dışında Mâlikî mezhebine nispet edilen görüşler incelendiğinde genel itibariyle isabet kaydedildiği tespit edilmiştir."
