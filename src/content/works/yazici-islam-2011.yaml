abstract: "Bu çalışmanın amacı, İslâm hukukunda asabe yoluyla mirasçılığı etraflı bir şekilde ortaya koyarak asabelikle alakalı meseleleri Kur'an'daki miras hükümleri ve Peygamber (sav)'in uygulamaları çerçevesinde değerlendirmektir. Asabe yoluyla mirasçılığın Sünnî mezheplerle İmâmiyye arasındaki temel farklılık da olması nedeniyle asabelikle ilgili siyasî-tarihî arka planının da göz önünde bulundurulmasına gayret edilmiştir. Temel olarak bu çalışma, giriş ve sonuç dışında dört bölümden oluşmaktadır.İlk bölümde, ?Asabe bi-gayrihi mirasçılık? başlığı altında kız çocuk, oğlun kızı, öz ve baba bir kız kardeşlerin kendi derecesindeki erkeklerle mirasçılıklarıyla ilgili meseleler ele alınmıştır. ?Asabe maa-gayrihi mirasçılık? başlıklı ikinci bölümse kendi içinde dört alt bölümden oluşmaktadır. Maa-gayrihi asabeliğin kabul ve reddine ilişkin üç farklı uygulamaya leh ve aleyhteki delillerle yer verilerek ilgili meseleler değerlendirilmiştir. Üçüncü bölümde, ?Asabe bi-nefsihi mirasçılık? başlığı altında, asabe yoluyla mirasçılık için gerekli şart ve kurallarla asabelikle mirasçı hısımların mirasçılıklarının keyfiyeti ele alınmıştır. Dördüncü ve son bölümdeyse ?Velâ yoluyla asabelik? başlığı altında velâ yoluyla asabe olacağı kabul edilenlerin bu mirasçılıklarına ilişkin leh ve aleyhteki delillere yer verilerek tartışılmıştır. Sonuçta ise, çalışma neticesinde ulaşılan tespitlere, önerilere ve çalışmanın eksik kalan yönlerine yer verilmiştir."
