abstract: "Kadı Sicilleri, hukuk tarihi araştırmalarının temel kaynakları arasında yer almasına ve dönemin hukuki-sosyal yapısına dair zengin veriler sunmasına rağmen, bu hacimli külliyat üzerine yapılan çalışmaların derinleştirilmesine ihtiyaç duyulmaktadır. Bu çalışma, Osmanlı Devleti'nin Vidin, Ayıntab (Antep), Ankara, Tekirdağ, Trabzon ve İstanbul (Bab/Galata) gibi farklı coğrafi ve sosyal özelliklere sahip altı şehrindeki kadı (Şer'iyye) sicillerine yansıyan, 1719-1732 yılları arasındaki evlilik birliğinin sona ermesi vakalarını ve bu vakaların hukuki sonuçlarını incelemektedir. Araştırmanın temel amacı, belirtilen yedi şehirdeki kadı sicillerini merkeze alarak Osmanlı toplumunda İslam boşanma hukukunun uygulamadaki görünümlerini analiz etmektir. Bu analizle, dönemin özgün sosyoekonomik ve kültürel dinamiklerinin aile hukukuna etkileri, boşanma süreçlerinde karşılaşılan hukuki ve sosyal sorunlar, bu sorunlara yönelik geliştirilen çözüm yolları ve uygulamadaki bölgesel farklılıkların tespit edilmesine katkıda bulunulması hedeflenmektedir. Karşılaştırmalı bir metodoloji benimsenerek yürütülen bu çalışma, incelenen döneme ait boşanma pratiklerine ilişkin kapsamlı ve nüanslı bir tablo ortaya koymayı amaçlamaktadır. Elde edilen bulgular, Osmanlı hukukunda aile hukuku uygulamalarında talâk, tefrik ve muhâlea gibi yöntemlerde kadıların Hanefi usulünü sıkı bir şekilde takip ettiğini göstermektedir. Osmanlı başkenti ile diğer şehirler arasında ekonomik ve sosyal açıdan belirgin farklılıklar olduğu tespit edilmiştir."
