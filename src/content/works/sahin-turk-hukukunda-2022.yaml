abstract: "Çalışmamız kapsamında, birlikte mülkiyet ilişkisinin çoğu zaman kaçınılmaz bir sonucu olan ortaklığın giderilmesi davası ve İİK m. 121 yetkisine dayanan, paydaşların açtığı ortaklığın giderilmesinden farklı olarak kendine özgü özel dava şartları bulunan ve esas amacı alacaklının alacağını tahsil imkânı sağlayan“alacaklının açtığı ortaklığın giderilmesi”davası incelenmeye çalışılmış, Türk Hukuk Siteminde malikin mülk üzerindeki mutlak tasarruf yetkisini sınırlandıran bu özel durumun kendine özgü usulî farklılıklarına değinilmiş, bu davaya özel dava şartları ayrı başlıklar altında irdelenmiştir. Çalışmamızla alakalı olarak öğretide ileri sürülen farklı görüşlerin yanında yüksek yargı içtihatlarına genişçe yer verilmiş, önemli sayılan hususların hemen ardından konuyla alakalı Yargıtay Kararları, karar künyesiyle birlikte sunulmuş, uygulamada sıkça yapılan hatalara ışık tutulmaya çalışılmıştır. Ortaklığın giderilmesi davasına özgü tarafların davada hem davacı hem de davalı konumunda bulunmasının klasik hukuk davalarından farklı olarak yargılama giderlerinin paylaştırılmasına yansımasındaki hukuk mantığına ışık tutulmaya çalışılmıştır."
