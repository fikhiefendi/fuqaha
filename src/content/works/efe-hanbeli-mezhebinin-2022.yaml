abstract: "Hanbelî mezhebi, günümüzde hayatiyetini sürdüren dört Sünnî fıkıh mezhebinden biridir. Seçkin hadis âlimi Ahmed b. Hanbel'in (v. 241/855) fıkıh anlayışı ve fıkhî görüşleri, Hanbelî mezhebinin esasını teşkil etmiştir. Bununla birlikte mezhep, İbn Hanbel'in öğrencileri ve onları takip eden fakihlerin mesaileriyle teşekkül etmiştir. Onlar, İbn Hanbel'in fıkhî görüşlerini rivayet, tedvin ve tasnif ettiler. Bu görüşleri, bir fıkıh doktrini teşkil etmek üzere sıhhat, geçerlilik ve tutarlılık cihetlerinden incelediler. Nihayet İbn Hanbel'in ictihad metodolojisini tespit ettiler. Müteakip üç neslin tedvin, tasnif ve inşâ olarak niteleyebileceğimiz fıkhî mesaileri, hicrî IV. asrın son çeyreğinde, fıkıh doktrini ve ictihad metodolojisi tespit edilmiş bir Hanbelî mezhebinden söz etmeyi mümkün kılmıştır."
