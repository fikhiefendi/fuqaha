abstract: "Günlük yaşantımızda enflasyon olgusu ekonomik ilişkilerde hukuki açıdan mühim bir yere sahiptir. Bu önem, İslam borçlar hukukunda 1929 Dünya Ekonomik Krizi'nin ardından madenî para sisteminden kâğıt paraya geçilmesiyle farklı bir boyut kazanmıştır. Nitekim para borçlarında akit kurulduktan sonra ve borçlu ödeme yapmadan önce, enflasyon nedeniyle paranın değerinde görülen dalgalanmalar taraflar arasında kurulan akdin İslam hukuku açısından niteliği problemini gündeme getirmiştir. Bu çalışma; para ve paranın değer değişimi, borç ve faiz kavramlarını anılan problem bağlamında ele alarak fıkıh mezhepleri, günümüz fetva kurulları ve İslam hukukçularının yaklaşımlarını analiz etmektedir. Ayrıca, katılım bankaları özelinde konunun mevcut ekonomik sistemdeki uygulanışını ele almaktadır. Çalışmanın önemli yönlerinden biri de“Ebu Yûsuf'un felslerin değer değişimi hakkındaki görüşü günümüz kâğıt paraları için de geçerlidir.”şeklindeki hipotezini test etme teşebbüsüdür. Böylelikle paranın değer değişiminin akitlere etkisi konusunun metodolojik çehresi ve enflasyonun katılım bankaları gibi faizsiz finans kurumlarının uygulamalarındaki mahiyeti netliğe kavuşturulmuştur. Böyle bir çalışmanın ortaya konulmasında sosyal bilimler araştırma yöntemlerinden nitel araştırma yöntemi işletilerek meseleye dair temel kaynaklar ve güncel çalışmalardan yararlanılmıştır. İslam hukuku perspektifinden enflasyonun para borçlarına etkisini teorik ve pratik çerçevesiyle ele alma girişiminin günümüzde yapılan akademik çalışmalara katkıda bulunacağına inanılmaktadır."
