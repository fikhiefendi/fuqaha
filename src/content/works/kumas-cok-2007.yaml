abstract: "Hukukî çogulculuk düsüncesi, kültür ile hukuk arasındaki iki yönlü iliskiden hareketle kendisine düsünsel bir zemin olusturur. Bu düsünceye göre hukuk, bulundugu toplumun kültürel bir görünümüdür. Hukukun tesekkül sürecinde kültürü olusturan tüm unsurların etkisi vardır. Diger yandan kültür, ancak hukukun saglayacagı imkanlarla varlıgını sürdürebilir. Hukukî çogulculuk düsüncesinin Batı'da gelismesinde hem postmodernizmle kendini iyice gösteren Batı düsüncesindeki degisim ve dönüsümün hem de toplumları giderek çok kültürlü yapılara dönüstüren küresellesme sürecinin katkısı vardır. Bundan dolayı hukukî çogulculuk düsüncesi, postmodernizm ve küresellesme sürecine denk düsecek sekilde 1980'lerden itibaren yaygınlık kazanmıstır. Ancak bu kavramın ilkez ortaya çıkması, post-koloniyal sürece rastlar. Basta slam toplumları olmak üzere Batı dısı toplumları arastıran Batılı sosyolog ve antropologlar, hukukî çogulculuk kavramını, buralardaki sosyo-hukukî yapıyı tanımlamak için gelistirmislerdir. Hukukî çogulculuk savunucularının Batı dısı toplumlar için sosyal bir olgu olarak degerlendirdigi bu çogulcu hukukî yapı, Batı'da gelisen özgürlükçü söylem, inanç özgürlügü, azınlık hakları, kültürel haklar, çok-kültürlülük gibi kavramlarla iliskilendirilerek Batılı anlayıs ve yapılara uygun hale getirilmis olsa da, temelde slam düsüncesindeki gayrimüslimlere (zimmîler) tanınan hukukî otonomiden farksızdır. Orta Çag'ın siyaset anlayısının etkisiyle Müslümanlar zimmîleri devlet yönetiminden uzak tutmus olsalar da, onların dinlerinden kaynaklanan farklılıkları hukuken korunmus ve yüzyıllar boyunca Müslümanlarla bir bütün halinde, yan yana ve iç içe yasayabilmislerdir. Bu anlamda Batı'daki farklı kültürel degerlerin korunması amacıyla bazı hukukî düzenlemelerin yapılmasını öngören anlayıs ile slam hukukunda zimmîlere yönelik yapılan farklı hukukî düzenlemeler, temelde aynı amaca hizmet etmektedir. Anahtar Sözcükler Hukukî çogulculuk Zimmî Azınlıklar Gayrimüslim İslam Hukuku Millet Sistemi Osmanlı"
