abstract: "Kripto paralar, ortaya çıktıkları andan itibaren yenilikçi özellikleri ve orijinal merkeziyetsizlikleriyle geleneksel finans sistemlerini önemli ölçüde sarsmıştır. Bu, akademisyenler ve araştırmacılar arasında yaygın bir kafa karışıklığına ve tartışmaya yol açmıştır. Bu çalışma, kripto paraların getirdiği karmaşıklıkları ve tartışmaları değerlendirerek mevcut yargı çerçevelerinin bu zorlukları ele alma kapasitesini incelemektedir. Böylece sorunların analizi için yeni bir yargısal çerçeve önermektedir. Nitel yöntemler kullanarak, bu araştırma akademik titizliğe sahip ve yargısal bilgiye veya eşdeğer Şeriat uzmanlığına sahip, kripto para araştırmalarında aktif olarak yer alan uzmanlarla derinlemesine yarı yapılandırılmış mülakatlar içermektedir. Temel içgörüleri çıkarmak için bu tez tematik analiz yöntemini kullanmaktadır. Analiz, geleneksel öncül paradoksu ve tanımlar üzerine bilimsel anlaşmazlıklar da dahil olmak üzere kritik zorlukları ortaya çıkarmakta ve mevcut incelemelerin yüzeysel derinliğini vurgulamaktadır. Bulgular, önerilen çerçeveyi doğrulayıp optimize ederek, yargısal ve Şeriat hedefleri arasında net bir ayrım sağlamaktadır. Çalışma, kripto para düzenlemesinde etkili risk yönetiminin gerekliliğini ve dijital para alanında standartların oluşturulmasını vurgulamaktadır. Sonuç olarak, yargıçlar, kurumlar, düzenleyici organlar ve politika yapıcılar için öneriler sunmaktadır."
