abstract: "Bu çalışma, haram olan her şeyin şer'î bir alternatifi bulunduğu varsayımından hareket etmektedir. Bu varsayıma göre, aslı itibarıyla haram olmayıp haram li-gayrihî olan her şeyle ilgili haramlık hükmünü belirleme konusunda mekâsıd-ı şerîa ile çelişmeyecek şer'î bir çıkışı yolu bulmak mümkündür. Bu çalışma, şer'î açıdan haram kabul edilen bazı çağdaş malî sözleşmeler için şer'î çözümlerin araştırılmasını ve incelenmesini hedeflemektedir. Ayrıca bunların, haram sözleşmelerden kaçınan Müslümanların yaşamında ne derece öneme ve etkiye sahip olduklarını da ele almaktadır. Bunun yanı sıra İslâmî bankalar ve klasik veya modern muameler için şer'î çıkış yollarının (hile-i şeriyyelerin), çözümlerin oluşturulmasının ve bunlardan istifade etmenin ne kadar önemli olduğunu incelemektedir. Söz konusu istifadenin haram sözleşmelerin bir kısmına ilişkin şer'î çözümlerin ve çıkış yollarının bulunmasına dayalı olması, bu çözüm yollarının şer'î hükümlerinin, rollerinin ve uygulaması sırasında karşılaşılabilecek sorunların incelenmesi ihtiyacını ortaya çıkarmıştır. Söz konusu muameleler bankalarla sınırlı olmadığından bu çalışma İslamî bankacılıkla kısıtlı tutulmamış, insanlar arasındaki diğer mali muameleleri de ele almıştır. Çalışmada İslam hukuku açısından uygun görülmeyen sözleşmelere ilişkin nas ve hukuk gözetilerek, çeşitli sorunlara yönelik çözüm yolları ele alınmıştır. Çalışmada tümevarım ve çıkarsama yöntemlerine istinat edilmiştir. Tümevarım yönteminde özellikle şer'î hilelere (çözüm yollarına) dair yazılı İslâm hukuku materyalleri incelenmiştir. Çıkarsama yönteminde ise İslam hukukuna ait hükümlerle bu hükümler içinde çözüm yollarına dair olan hükümlerin çıkarsanması ve bunların finans alanındaki katkılarını tespit edilmesine çalışılmıştır. Çalışma, özet olarak; derinlemesine inceleme ile, hükümlerin ve çözümlerin İslâm hukukundan çıkarsamada bulunma ve bu hilelerin ve çıkış yollarının çağdaş bankacılık deneyimi üzerindeki olumlu etkilerini inceleme suretiyle şu sonuca varmıştır: Herhangi bir nassa aykırı olmayan ve herhangi bir hakkı iptal etmeyen haram li-zâtihî olan bir şeyi helal hale getirmeyen şer'î hilelerin caiz olduğu ve İslam hukuku açısından haram kabul edilen çok sayıdaki malî muamele için bazı şer'î çözümlerin ve çıkış yollarının bulunduğu görülmektedir."
