abstract: "Bu araştırma, İslami Finansın Somali'de tarımsal ve kırsal kalkınmadaki rolünü değerlendirmekte ve ışık tutmaktadır. Tarım sektörü Somali'de ana sektör olarak önemli olup istihdam açısından da ayrı bir yeri bulunmaktadır. Bu nedenle tarım sektöründe yapılacak iyileştirmeler, ekonomiyi genel olarak büyütecektir. Somali'de kayıt dışı ekonomi uzun süredir gittikçe azalma eğilimindedir. 2013'ten itibaren Somali ekonomisi büyük bir dönüşüm geçirmiştir. Ulusal ve uluslararası yatırımlar ülkeye akmaya başlamıştır. Bu yatırımlar genel olarak otel, emlak, ticari banka vb. diğer sektörlere de odaklanmıştır. Dikkate değer katkısına rağmen Somali'de tarım, çoğunlukla finansman eksikliği, sınırlı sulama imkanları, iklim değişikliği, güvenlik ve uzun süreli siyasi istikrarsızlık, uluslararası pazara erişim eksikliği, yeterli tarımsal bilgi, altyapı ve modern teknoloji eksikliğ gibi nedenlerden dolayı azalmaktadır. Bu araştırma, çiftçiler ve finansal kurumlar arasındaki ilişkiyi tanımlamak ve İslami Finans'ın Somali'deki tarımsal ve kırsal kalkınmaya nasıl olumlu katkıda bulunabileceğini göstermek için yapılmıştır. İslami Finans, Salam, Istisna, Müzaraa ve Müsakaat gibi tarımsal yatırımlar için özel finansman yöntemlerine ve iyi bilinen İslami finans kâr ve zarar paylaşım mekanizmasına sahiptir. Kâr ve zarar mekanizması her iki tarafın da çok çalışmasını teşvik eder. Kâr, işletmenin veya projenin başarısına bağlı olduğu için ihmali ve suistimali ortadan kaldırır. İslami finans daha önce kırsal ve tarımsal kalkınma için kullanılıyordu. Sudan ve Pakistan'da olumlu sonuçlar elde etmiştir. Somali'deki ticari bankalarının hepsi tam teşekküllü İslami Bankalardır. Ancak tarım sektörü ile minimum ilişkileri vardır. Bankalar daha az riskli ve daha çok kar getirici projelere yatırım yapmaktadır ve çiftçilerle ilişkileri sınırlı düzeydedir. Araştırma sırasında çiftçilerin uygun belge eksikliği ve sektörde yer alan yüksek risk nedeniyle ticari bankaların, çiftçilerle minimum ilişki içinde olduğunu keşfedildi. Ayrıca ticari bankalar, tüm sektörlere finansman sağlama kapasitesine sahip değildir. Ticari bankalar balıkçılığa İslami mikro finans, yani karz-ı hasen'ı ve Mudaraba büyük ölçekli çiftçilere finansman sağlamaktadır. Bunun dışında ticari bankaların tarımla hiçbir ilgisi yoktur. Finansal kuruluşlar sadece büyük ölçekli çiftçilere yatırım sunmaktadır. Bununla birlikte, Somali'deki çiftçilerin %65'i küçük çiftçilerdir ve devletten mali desteğe erişimi yoktur. Gerekli teminatı gösteremedikleri için finansal kuruluşlar tarafından sunulan kredilere erişemezler. Öte yandan, çoğu çiftçi yatırım potansiyelinden habersizdir. Araştırma sırasında çiftçilerin mülklerini ele geçirmek için aldatmaya yönelik finansman sağlayan veya yanlış anlaşılan sistem içerikleri ile dolu finansal kurumlar olduğunu gözlemlendi. Gelişmiş ve gelişmekte olan ülkelerdeki çiftçiler hükümetleri tarafından desteklenmektedir. Somali'de ise hükümet doğrudan çiftçilik sürecine dahil değildir. Bununla birlikte çiftçilerin yasal korumaya, fonlamaya, sulama ihtiyaçlarının giderilmesine ve modern tarım sistemlerinde eğitime ihtiyaçları vardır. Somali tarım sektörü ürünlerin kalitesini yükseltmek için bir değer zinciri sistemi uygulamasına ve potansiyel uluslararası pazarlar yaratmaya ihtiyaç duymaktadır."
