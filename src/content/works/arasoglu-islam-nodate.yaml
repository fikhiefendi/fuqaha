abstract: "Bu tez ile çağdaş Türk hukukunda kullanılan hâkimin takdir yetkisi kavramının içerik olarak İslam hukuk sisteminde karşılığının ne olduğunu bilimsel yöntemlerle araştırarak ortaya koymak amaçanmıştır. Bu sebepten dolayı çalışmamızda mukayeseli bir yöntem izlenmiştir. Giriş, üç bölüm ve sonuçtan oluşan tezimizin giriş kısmında konunun önemi, amacı, sınırları ve kaynakları gibi temel bilgiler verilmiş, ardından birinci bölümde çağdaş Türk hukuku ve İslam hukukuna göre mahiyeti, kapsamı ve sınırları açısından hakimin takdir yetkisi kavramı incelenmiştir. İkinci bölümde İslam hukukunda yargılama evreleri ve bu evrelerde hakimin takdir yetkisinin kullanıldığı durumlar incelenmiş, üçüncü bölümde, hakimin takdir yetkisinin ve verdiği hükümlerin denetimi konusu incelenmiştir. Tezimizde ulaştığımız sonuçlara göre, çağdaş Türk hukukunda kullanılan hakimin takdir yetkisi kavramıyla ifade edilen içerik, mahiyeti itibariyle bir tür içtihat olup, bu içerik İslam hukukunda da bulunmakta ve bu içerik“ictihadü'l-kâdî”,“nazarü'l-kâdî”,“re'yü'l-kâdî”gibi kavramlarla ifade edilmiştir. Nitekim kaynağı itibariyle evrensel olma özelliğine sahip olan içtihat hukuku da denilen İslam hukuku, dinamikliğini ve sürekliliğini, merkezinde bulunan içtihat mekanizması ve içtihadî faaliyetlerle sağlamaktadır. Hakimin takdir yetkisi kavramını içerik olarak İslam hukukunda bulunduğunun ispatı, yargılama sırasında yapılan uygulamalardır. Nitekim İslam hukukunda yargılamanın bütün evrelerindeki ilgili uygulamalar, İslam hukukunda hâkime tanınan geniş bir takdir yetkisinin bulunduğunun en büyük ispatıdır."
