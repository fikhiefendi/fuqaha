abstract: "Tez, Arap dilinden Türkçe'ye geçmiş olan tenvinli kelimelerin her iki dildeki anlamları ve cümle içerisinde üstlenmiş oldukları görevlerinin mukayesesini içermektedir ve bir girişle ve iki bölümden oluşmaktadır. Giriş bölümünde araştırmamızın konusu, kapsamı, önemi, kaynakları ve aralarındaki ilişkiyi incelediğimiz Arap dili ve Türk dili hakkında genel bir bilgilendirmeyi içermektedir. Çalışmanın birinci bölümünde Arapça ve Türkçe arasındaki etkileşim ve Arapça'nın Türkçe üzerindeki etki alanları konusunu ana hatlarıyla inceledik. Çalışmanın ikinci bölümünde ise Arapça'dan Türkçe'ye intikal etmiş olan ve kök dilde tenvinli olan ve Türkçe'de de genelde –en, -an ile biten kelimeleri hem anlamları hem de cümle içerisinde üstlendikleri görevleri bakımından mukayese etmeye ve bir sonuca ulaşmaya çalıştık."
