abstract: "Kalkınmanın finansmanı için dış kaynağa ihtiyacı olan Türkiye, bu ihtiyacını genellikle batılı hükümet ve finans kurumlarından karşılamıştır. Türkiye'nin daha bol ve daha ucuz dış kaynağa ihtiyacı devam etmektedir. Bu konuda petrodolarlar batılı kaynaklara bir alternatif olarak görünmektedir. Petrodolarların sahibi olan ülkelerle tarihî, dinî ve coğrafî bağların yanında son yirmi yıldır siyasi ve iktisadî münasebetlerimiz de gelişmiş durumdadır. Petrol üreten Müslüman ülkeler içinde Körfez ülkele rinin önemli bir yeri vardır. Bu ülkeler,, petrodolarların hemen hemen tamamına sahip oldukları gibi, Orta Doğu'daki malî piyasalar da bu ülkelerde yoğunlaşmış durumdadır. Petrol bulununcaya kadar bu ülkelerde ilkel tarım ekonomisi hakimken, petrol sonrası dönemde, petrol, ekono milerinin sürükleyici faktörü olmuştur. Petrol öncesi dönemde yılda 35 dolar olan fert başına gelir, petrol son rası dönemde büyük bir hızla artmış ve Körfez ülkeleri dün ya fert başına yıllık gelir sıralamasında en üst sıraları almışlardır. Körfez ülkeleri özellikle 1973 sonrası dönemde ellerine geçen büyük miktardaki petrodolarları, -iyi bir şekilde değerlendirme çabası içinde olmuşlardır. Bu cümle den olarak, Ülke içinde büyük çaplı kalkınma hamleleri yap mışlar, öncelikle de eksik ve yetersiz olan altyapılarına ağırlık vermişlerdir. Altyapı yatırımlarının yanında, petrol ve sanayi yatırımları yapmışlar ve sanayi şehirleri w- r'e'JÎSM,,ET,M ramı WKUMAKTASMN MK“EZ|kurmuşlardır. Hizmetler sektörüne de ağırlıklı yatırımlar yapmak suretiyle ülkelerini refah toplumları haline getir meyi hedeflemişlerdir. Körfez ülkeleri, petrodolarların tamamını dahilde kullanmaları mümkün olmadığı için, dış ülkelerde de büyük yatırımlar yanmışlardır. Eylül 1985 itibariyle toplam 410 milyar dolar tuta rındaki dış yatırımlar, batılı büyük bankalara yatırılan mevduat, büyük kuruluşların hisse senetlerinin satın alın ması, gelişmekte olan ülkelere yapılan yatırımlar, yabancı hükümetler ve kamu sektörleri menkul kıymetlerinin satın alınması, altın ve döviz alımı şeklinde gerçekleşmiştir. Bunlara ilâve olarak muhtelif fizikî yatırımlar yapılmış ve askerî harcamalar fert başına dünyada en yüksek seviyeye ulaşmıştır. Körfez ülkeleri, yardım faaliyetlerini kurdukları milli ve milletlerarası nitelikteki ”Kalkınma Fonları“ kanalıyla gerçekleştirmektedirler. Bu ülkeler, GSYÎH'nın yüzdesi olarak, dünyada en büyük yardımı yapan ülkeler durumundadırlar. Körfez ülkeleri, petrodolarların yeniden dönüşümünde rol almak ve uluslararası bankacılığın kârlarından fayda lanmak için, uluslararası nitelikte malî kurumlar kurmuş lardır. Bu konuda da çok geniş bir faaliyet alanı çizmiş ler, konvansiyonel bankaların yanında, yatırım bankaları ve şirketleri de kurmuşlardır. Son zamanlarda İslâmî yatı rım kurumları da kurulmuş ve paralarını faizsiz bir düzende yatırmak isteyenlere imkân hazırlanmıştır. Yapılan uygula malar bu tip bankacılığın uygulanabilir ve kârlı olduğunu isbat etmiştir. IITürkiye^, geniş bir alanda yatırıma dönüştürülen petrodolarlardan bugüne kadar yeterli derecede faydalanama mıştır. Türkiye'nin bu imkândan faydalanması için yeterli şartlar mevcuttur. Körfez ülkeleri, Müslüman ülkelere daha hoşgörülü davranmaktadırlar. Son zamanlarda Türkiye ile Körfez ülkeleri arasında özellikle OIC çerçevesinde siyasi ve iktisadî işbirliği önemli ölçüde artmıştır. Aynı zamanda Körfez ülkeleri ile Türkiye'nin dış ticareti büyük ölçüde artmış, özellikle îran ve Irak ithalât ve ihracatımızda birinci sıralara yükselmiştir. Bölge olarak da Müslüman ülkeler dış ticaretimizde birinci sırada gelmektedir. 1985 yılında ithalâtımızın % 24.11'i, ihracatımızın % 34.13'ü Körfez ülkeleri ile yapılmıştır. Artan iktisadî münasebet lerle birlikte malı münasebetler de gelişmektedir. Malî mü nasebetlerin gelişmesi hususunda önemli adımlar atılmış, Türkiye'de KOB, Gelir Ortaklığı Senetleri gibi araçlar ih das edilmiş, özel Finans Kurumları ve Finansal Kiralama Şirketleri kurulmuştur. Diğer taraftan, Türk Bankacılık Sistemi dışa açıl mış, Türkiye ile Körfez ülkeleri arasındaki ortak yatırım-”lar artmış, Türkiye'de Serbest Bölgeler kurulmuş ve Türk Müteahhitlik Sektörü Orta Doğu ülkelerinde yaptığı hizmet lerle ihracat, işçi dövizi ve diğer iktisadî konularda önemli gelişmeleri beraberinde getirmiştir. Bu müsbet gelişmeler, Türkiye'nin petrodolarlardan faydalanma imkânlarını arttırabilecek niteliktedir. V. BYKP'na göre, Plan dönemi boyunca 16.270 milyon dolarlık dış kaynağa ihtiyaç vardır. Türkiye, bu kaynağı petrodolar- larla karşılayabildiği takdirde -batılı kaynaklardan karşı lanmasına nisbetle- yaklaşık % 5 daha ucuza mal edebilecek tir. Türkiye'nin 1980'den bu yana kredi değerliliğinin artması, önemli bir gelişmedir. Bu olumlu gelişmenin dev- IIIlet ve hükümet başkanları seviyesindeki diyalog ve yakın ilişkilerle desteklenmesinde büyük faydalar vardır. Bununla birlikte, uluslararası mali piyasaların iyi bilinmesi, takip edilmesi ve milli seviyede uluslararası işlemler yapacak mali birimler kurulması, kalkınma fonlarından sağ lanabilecek imkânların araştırılması ortak yatırımların tarım, sanayi ve hizmetler kesimlerinde yaygınlaştırılması, Körfez ülkeleri ile mali sistemde yakınlaşma sağlayan araç ve müesseselerin çoğaltılması petrodolardan daha çok fayda lanmayı mümkün kılacaktır.. Türk Müteahhitlik Sektörü ve işgücünün Körfez ülke lerinde daha çok iş alabilmesi için gerekli teşebbüslerin yapılması ithalât ve ihracat hacminin arttırılması için gerekli tedbirlerin alınması da üzerinde dikkatle durulması gereken konulardır. OIC, ÎSEDAK, REC, Ticareti Geliştirme Merkezi, Müşterek Ticaret Odaları vb. gibi kuruluşların fonksiyonla rını bihakkın icra edebilmelerinin sağlanması için Türkiye1 nin daha aktif rol almasının gereği açıktır. Böylece, petrodolarlardan yeterli seviyede faydala nılacağı gibi, Türkiye ile Körfez Ülkeleri arasındaki müna sebetlerin önemli boyutlara ulaşması mümkün olabilecektir. IV"
