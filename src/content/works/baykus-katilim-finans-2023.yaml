abstract: "Zekât, sadaka ve karz-ı hasen İslam'ın infak ruhundan doğan ve katılım finans sisteminin sosyal yardımlaşma ve dayanışma, kardeşlik ruhu ve servetin adil dağılımı gibi ilkelerini yansıtan en önemli kurumlarıdır. Katılım finans, birçok alanda başarılı girişimler yapmış; ancak zekât, sadaka ve karz-ı hasen katılım finans sistemi içinde diğer finansman araçları kadar uygulama alanı bulamamıştır. Bu durumun temelinde zekât, sadaka ve karz-ı hasenin araçsallaşmamış ve kurumsallaşmamış olması, şeffaflığın olmaması ve bu kurumların faaliyetlerinde hâlâ geleneksel yöntemlerin kullanılması gibi faktörler yer almaktadır. Kitle fonlaması, bu sorunların çözülmesinde etkili bir yöntem olarak kullanılabilir. Kitle fonlaması, dijital teknolojiler aracılığıyla finansmana erişimde alternatif bir yol olarak kullanılmaktadır. Bu kapsamda katılım finansın yapısına uygun değişiklerle zekât, sadaka ve karz-hasen kitle fonlaması sistemine entegre edilebilir. Böylece bu kurumların kapsamının genişletmesi ve finansal ürünlerin teknolojiyle bütünleştirerek daha pratik hale dönüştürülmesi fırsatı sağlanabilir. Çalışmanın amacı, fintek yeniliklerinden yararlanarak zekât, sadaka ve karz-ı hasenin araçsallaşmasına ve kurumsallaşmasına katkı sağlamak adına bir kitle fonlaması platformu oluşturmaktır. Bu amaç doğrultusunda zekât, sadaka ve karz-ı hasen kurumları aracılığıyla fon toplanılmasına ve dağıtılmasına imkân sağlayan web tabanlı bir kitle fonlaması platformu (kitle katılım) prototipi geliştirilmiştir. Oluşturulan kitle katılım (kitlekatilim.com) platformu zekât, sadaka ve karz-ı hasen aracılığıyla fonların daha şeffaf bir ortamda toplanmasına imkân sağlayacaktır. Böylece bu kurumlar, katılım finans içerisindeki potansiyel başarısını gerçekleştirme fırsatı yakalayacaktır."
