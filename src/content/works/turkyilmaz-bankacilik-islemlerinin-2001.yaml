abstract: "“Bankacılık işlemlerinin Muhasebeleştirilmesi ve GelenekselBankacılık ile Faizsiz Bankacılık işlemlerinin· Muhasebe YönündenKarşılaştırılması”adlı tez dört bölümden oluşmaktadır. Bu çalışmayapılırken özellikle muhasebe işlemlerinin tamamı ilgili kurumlarda gözlemyapmak suretiyle hazırlanmıştır. işlemlerin ve uygulamaların çOğundakurumların ve kişilerin korunması açısından isimler değiştirilerekverilmiştir.Tezin birinci bölümünde geleneksel bankacılık ve faizsiz sistembankacılığın tanımları çeşitleri ve bu kurumların yaptıklan işlemleranlatılmıştır.ikinci bölümde geleneksel ticari bankacılık işlemlerinden mevduatişlemleri, kredi işlemleri ve diğer bankacılık iş/em/erinden havale,akreditif, çek/senet, kefalet ve teminat, ile türev ürün/eri gibi işlemlerinmuhasebeleştirilmesi örneklerle incelenmiştir.Tezin üçüncü bölümünde faizsiz sistem bankacılık işlemlerinden fontemin işlemleri olan cari hesaplar ve katılma hesapları ile fon kullandırmaişlemlerinden üretime destek sağlanması, kiralama, iş ortak/ı ğı, iştirak,azalan iştirak, tarımsalortaklık, yardım gayeli ödünç, avansa dayalı satışve vadeli satış işlemlerinin muhasebeleştirilmesi örneklerle verilmiştir.Dördüncü bölümde geleneksel bankacılık işlemleri ile ilgili biruygulama ve mali tabloların düzenlenme ilkelerinin yanı sıra faizsizbankacılık işlemleri ile ilgili bir uygulama ve faizsiz sistem bankalarınındüzenleyecekleri mali tablolar üzerinde durulmuştur.Sonuç bölümünde geleneksel bankalar ile faizsiz sistem bankalarımuhasebe yönünden karşılaştırılarak farklılıkları üzerinde durulmuş veçözüm önerileri sunulmuştur."
