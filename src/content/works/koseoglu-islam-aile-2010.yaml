abstract: "Bu çalışma İslam Aile Hukukunda kocanın nafaka yükümlülüğünü ele almaktadır. Bu bağlamda nafaka kavram olarak ele alınmış, bu esnada modern hukukla ve diğer medeniyetlerle karşılaştırma yapılmıştır. Çalışmanın esas bölümünde ise, öncelikle evlilik içinde evlilik nafakasının yükümlüsü, nafakanın delilleri, şartları ve muhtevası değerlendirilmiş, son olarak evlilik sonrasında nafaka incelenmiştir."
