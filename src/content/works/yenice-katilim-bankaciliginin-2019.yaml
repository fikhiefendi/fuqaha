abstract: "Günümüzde katılım bankacılığı, İslami kurallar dâhilinde bankacılık çalışmalarını faizsiz bir şekilde yürüten kuruluşlardır. İslami finans, muhtelif mali çalışmalarını İslam dini anlayışları dâhilinde yürüten bir sistem olarak açıklanmaktadır. İslam dininde faizin haram olarak görülmesi neticesinde seçenek olarak kabul edilen anlayıştır. Faize karşı parasını evde saklayan fertlerin, para piyasası dışına çıkarak kullanılmayan paralarını ekonomiye kazandırarak ülkenin gelişmesine katkı sağlamak katılım bankacılığının esas amacıdır. Katılım Bankaları gerçek ekonomiyi para veya kredi yoluyla destekleyerek, parasal kesimde çalışma yapan bankalardır. Türkiye'de faaliyetlerini sürdürmekte olan, kamu ve özel sermayeli olmak üzere 5 adet katılım bankası bulunmaktadır. Bu bankaların 2'si kamu sermayeli, 3'ü ise özel sermayeli bankadır. Bu çalışmada katılım bankacılığının 2015-2018 yılları arasında Türkiye ekonomisine etkileri incelenmiştir. Katılım bankacılığının, ortaya çıkmasından bu yana geçen sürede ekonomiye olan katkıları düşünüldüğünde gelişim göstermesinin devam edeceği görülmektedir. Kararlı bir şekilde büyümenin devam etmesi personel sayısının artırılması ve şubeleşmeyle gerçekleşecektir. Sonuç olarak; geleneksel bankalara göre oransal olarak daha hızlı bir büyüme trendi içinde olan katılım bankacılığı, kurulduğu günden bu yana hızlı bir şekilde yayılmakta ve finansal sistem içindeki payları Türkiye'de ve diğer dünya ülkelerinde gün geçtikçe artış göstermektedir."
