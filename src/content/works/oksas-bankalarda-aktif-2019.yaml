abstract: "Bu tezin amacı, aktif pasif yönetimi hakkında bilgiler vererek ticari bankalarda ve katılım bankalarında aktif pasif yönetimini açıklamaktır. Bu amaçla temel bankacılık hakkında kısaca bilgiler verilerek, aktif pasif yönetimi ve aktif pasif yönetiminde kullanılan teknikler açıklanmaktadır. Uygulama bölümünde T.C. Ziraat Bankası ile T.C. Ziraat Katılım Bankasının finansal tablolarından yararlanılarak CAMEL analizi, GAP analizi ve Durasyon analizi yapılarak analizlerden elde edilen sonuçlar karşılaştırılmıştır. Analiz sonuçlarına göre katılım bankasının kârlılık oranlarında ve likidite karşılama oranlarında ticari bankaya göre daha iyi olduğu sonucuna ulaşılmıştır. Katılım bankasında verilen kredilerin ve toplanan fonların ciddi şekilde artmasıyla katılım bankasına olan tercihin arttığı tespit edilmiştir."
