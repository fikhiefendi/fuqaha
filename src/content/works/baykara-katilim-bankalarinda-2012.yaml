abstract: "Finansal sistem; fon arz edenler ile fon talep edenler arasındaki etkileşimin finansal aracılar ile sağlandığı, karmaşık bir yapıdır. Bu sistemin asıl amacı devlet, hane halkı ve firmaların sahip oldukları fon fazlalarını, finansal aracılar vasıtasıyla ihtiyaç sahiplerine yönlendirmek ve ekonomide temel koordinasyon işlevini yerine getirmektir. Bir ülkede iyi işleyen bir finansal sistem, ekonomik istikrar ve büyümeye önemli katkılar sağlamaktadır.Finansal sistem içerisinde giderek önemli bir yer edinen Katılım Bankaları, faaliyetlerine ilk olarak 1983 yılında özel finans kurumları adıyla başlamıştır. Özel finans kurumlarının kuruluş amacı, toplumda faiz hassasiyeti olan kesimin tasarruflarını ekonomiye kazandırmak ve benzer nitelikteki yabancı fonların ülkeye gelmesini sağlamaktır. 2005 yılından itibaren bankalar kanunu kapsamına alınarak Katılım Bankaları sıfatını kazanan bu kurumlar, bugün itibari ile 4 banka ile Türkiye'de faaliyet göstermektedir.Etkinlik ve verimlilik günümüzde işletmelerin önemli performans göstergelerinden olup, etkinlik mevcut hedefe ulaşma seviyesini gösterirken, verimlilik eldeki kaynaklar ile elde edilen çıktının girdiye oranı olarak tanımlanmaktadır. Verimlilik ve etkinliği ölçen birçok parametrik ve parametrik olmayan teknikler mevcuttur. TOPSIS, verilen alternatifler arasında, bir alternatifin en iyi ve en kötü alternatife olan uzaklığı arasındaki mesafeyi Öklid bağıntısı mantığı ile ölçerek, ideal bir çözüm ortaya koymaya çalışan parametrik olmayan çok kriterli bir karar verme yöntemidir.Bu çalışmada, Türkiye'de finansal sistem içerisinde hızla büyüyen ve gelişen Katılım Bankalarının 2005?2011 yılları arasındaki faaliyetlerinin etkinlik ve verimlilikleri TOPSIS (Technique for Order Preference by Similarity to Ideal Solution) tekniği kullanılarak ölçülmeye çalışılmıştır. Analiz sonuçlarına göre; aynı zaman diliminde verimli olan bir Katılım Bankasının etkin olmadığı ve bir Katılım Bankasının sunduğu yatırım araçlarını çeşitlendirmesine paralel olarak etkinlik ve verimliliğinde gözle görülür bir artış sağladığı tespit edilmiştir."
