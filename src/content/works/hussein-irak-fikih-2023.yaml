abstract: "Ümmetin alimlerine İçtihâd kapısı ardına kadar açık olduğu için müctehidlerin acil meselelerin hükümlerini tespit etmeleri farzdır. Bu araştırma, genel manada fıkhın yenilenmesini özel olarak da Irak fakihlerinin yenilenmesini aydınlatmaya çalışmaktadır. Bu nedenle çalışmanın kapsamı“Çağdaş Irak Fıkhında Yenilenme”konusu ile sınırlandırılmıştır. Çalışmanın önemi, sorumluluğun gayesi ve sonucu olarak ifade edilebilecek hükümlerin vakıaya uygulanması kaynaklıdır. Buna rağmen fıkhi yenilenme ihtilaflı bir mesele olduğu için araştırma konuyu açıklamaya ihtilafın sebeplerini ortaya koymaya çalışmaktadır. Yenilenme taraftarı fıkıhçıların içtihad ve yenilenme yanlısı metotları da aynı şekilde ihtilaflı konulardandır. Araştırmada iki yöntem kullanılmıştır. Usul kaidelerine uygun olarak fıkhî görüşlerin sıralanmasında tümevarım yöntemi tercih edilmiştir. Bu görüşlerin tahlil edilip, usul kaideleri ve şer'î delillerle irtibatlarının gösterilmesi; İslâm şeriati ve çağın ruhuna uygun görüşün tercih edilmesinde analitik yöntem kullanılmıştır. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Fetvada yenilenme konusunun alanı, soru soran kişinin yer, zaman ve hal yönüyle durumunu dikkate alarak içtihadı ve değişikliği kabul eden zannî meseleler ve içtihâdî hükümlere dayanır. Mekâsidu'şşerîa ve bu esas üzerine kurulu istinbât konularını bilmeden fetva konusunda içtihad etmek doğru değildir. İslâm şeriati, Allahı'ın rahmetine dayalı ilahi hitap ve değişen şartların doğru anlaşılmasına bağlıdır. Irak Fıkıh Akademisi mensupları da evlilik akdinin belgelenmesinin gerekliliği, Fıtır sadakasının değer üzerinden verilmesinin caiz olması, evlilikle ilgili birçok hususu değiştirdiği gerekçesiyle ehl-i kitaptan olsa dahi gayrimüslim kadınla evlenmenin haram olması, fiyat artışıyla olsa dahi vadeli ve taksitli satışın caiz olması, teverruk satışının caiz olması ve çağdaş bankalar tarafından yürütülen banka teverruk yasağı gibi gayeleri gözeten birçok içtihadları vardır. Irak fakihlerinin içtihad yenilenmesini kabul eden ve yenilenme hususunda şeriatın her zaman ve her yerde geçerli olan merhamet ve esnekliğini savunan fıkıh anlayışına uygun olarak verdiği daha birçok fetva da duruma örnek olarak verilebilir."
