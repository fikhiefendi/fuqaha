abstract: "Bu çalışma، İslami finans kurumlarının karşılaştığı finansal riskleri tanımlayarak, teorik bölümde İslami bankalarda riskten korunma (Hedging) araçlarını belirtmeyi, ampirik bölümde ise bu araçların Katar'daki İslami bankalardaki finansal risk azaltma üzerindeki etkisini araştırmayı amaçlamaktadır. Çalışmanın amacına ulaşmak için, finansal risk kavramı, çeşitleri ve hesaplama yöntemleri araştırma amacıyla tümevarım yöntemi kullanılmıştır. Finansal risklerden korunma araçlarının neler olduğunu, bu araçların riskleri azaltmak veya etkileriyle başa çıkmak amacıyla İslami bankalarda nasıl kullanıldığını belirlemek için betimsel araştırma yöntemi kullanılmıştır. Ampirik bölümde ise finansal risklerin azaltılmasında riskten korunma araçlarının etkinliğini incelemek için Katar'daki İslami bankacılık uzmanlarına anketler dağıtılarak analitik yaklaşım kullanılmıştır. Bu çalışma, değişken oranlarda pek çok riskten korunma aracının Katar İslami bankalarında kullanıldığını ve bu araçların finansal risk azaltma konusunda etkili olduğu sonucuna ulaşmıştır. Sonuç olarak, Katar İslami bankaların Körfez bölgesinde en güvenilir İslami bankalar arasında ayrıcalıklı bir konuma sahip olduğu gözlemlenmiştir. Bu çalışmanın sonuçlarına dayanarak, Katar İslami bankalarının finansal risk azaltma araçlarını, ortaklığa dayalı İslami finansman yöntemleri dahil olmak üzere tüm finansman yöntemlerini içerecek şekilde uygulamaları önerilmektedir."
