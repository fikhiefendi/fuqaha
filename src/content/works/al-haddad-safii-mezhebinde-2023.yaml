abstract: "İslam hukuk tarihinde, mezheplerin teşekkülü devrinden itibaren mutlak bağımsız içtihat sona ermiş ve müctehidler mezhep imamlarının ictihadlarına ve kurallarına bağlı olarak fıkhi faaliyetlerini sürdürmüşlerdir. Bu kapsamda olmak üzere, Şafii fakihlerin İmam Şafii'nin ictihad etmediği konularda mezhep esasları çerçevesinde ortaya koydukları ictihadları, mezhepte 'vecih' (çoğulu vücûh) olarak ifade edilmiştir. Bu fakihlerin çoğu hicri IV. yüzyılda yaşamış ve ve Şafii tabakatında \"ashâbü'l-vücûh\" olarak adlandırılan üçüncü tabakayı oluşturmuşlar. Bir sonraki tabakada yer alan ve \"Şeyhayn\" olarak bilinen Râfi'î ve Nevevî ise mezhepteki bu farklı içtihatlar arasında tercih yapma sürecinde büyük önem taşımış iki fakihtir. Râfi'î ve Nevevî, mezhepteki bu içtihat farklılıklarını değerlendirerek, hukuki meselelerde hangi görüşün tercih edilmesi gerektiği konusunda kapsamlı çalışmalar yapmışlardır. Sonraki Şâfi'î fakihleri, bu iki alimin görüşlerini mezhepte ölçü olarak kabul etmiştir. Bu tez çalışması, Şâfiî mezhebinde \"vecih\" ve \"ashâbü'l-vücûh\" kavramlarını ve İmam Nevevî'nin bu mezhepteki rolünü incelemekte ve Nevevî'nin el-Minhâc adlı eserinde yer verdiği vecihleri ve bunlara dair değerlendirmelerini ele almaktadır. Çalışmanın amacı, Nevevî'nin Şâfiî mezhebindeki yeri ve el-Minhâc'ındaki vecihleri açıklığa kavuşturmaktır. Birinci bölümde Nevevî'nin hayatı ve el-Minhâc'ın önemi üzerinde durulurken, ikinci bölümde Şâfiî mezhebinde vecih ve vücûh ashâbının tanımı ve konumu ele alınmıştır. Üçüncü bölümde ise Nevevî'nin el-Minhâc'ındaki vecihleri, özellikle \"Kitâbü'l-buyû\" örneği üzerinden incelenmiştir. Sonuç kısmında ise bu çalışmanın ortaya koyduğu bulgular özetlenmiştir. Anahtar kelimeler: Şafii Mezhebi, Nevevî, el-Minhâc, Vecih, Ashâbü'l-vücûh"
