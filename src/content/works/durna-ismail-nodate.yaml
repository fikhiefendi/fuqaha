abstract: "Osmanlı coğrafyasında üzerine en fazla şerh ve hâşiye yazılan kitap Halebî (v. 956/1549)'nin Mülteka'l-ebhur adlı eseridir. Kendinden önceki hanefî fıkıh metinleri olan“mütûn-u erbaa”daki konuları daha sistematik bir hale getirmiş ve kendi zamanındaki ihtiyaçlara göre de tercihler ortaya koymuştur. Halebî'nin bu eseri kısa zamanda medreselerde ve mahkemelerde müderris ve kadıların başucu kitabı olmuştur. Kısa fıkıh metni olduğu için özellikle medrese talebeleri Mültekâ'nın şerhine ihtiyaç duymuşlardır. Bu amaçla Mültekâ üzerine 50'den fazla şerh ve hâşiye çalışması yapılmış, halka yönelik olarak da Mültekâ'nın izahlı tercümeleri yapılmıştır. İşte en önemli ve hacimli şerhlerinden birisi de İsmail b. Sinan es-Sivasî (v. 1048/1638)'nin çalışması olan Ferâidu Mülteka'l-ebhur adlı eseridir. Sivasî bu şerhinde bütün ilmî dirayetini ve tecrübelerini bu şerhe aktarmış kapsamlı ve istifadeye açık bir şerh hazırlamıştır. Biz bu çalışmamızda Kitâbu'l-Mükâteb-Kitâbu'l-Ferâiz arasının tahkik ve tahlilini yaptık. Önce Ferâid nüshalarını tespit edip sonra şerhin tahkikine başladık. Sivasî bu şerhte Mültekâ metinlerini ayetler, hadisler, kamuslar, tefsirler, tarih ve tasavvuf kitapları, ilmihal ve genel olarak temel hanefî fıkıh kitaplarından istifade ederek açıklamaya çalışmıştır. Hemen her kitap, bâb ve faslın başlangıcında konuyu ana hatlarıyla anlattıktan sonra delil ve tartışmaları aktarıp sonunda kendi görüş, eleştiri ve tercihlerine de yer vermiştir. Gerektiğinde metni eleştirmiş, bazen de metin hakkında övücü ifadeler kullanarak takdirlerini belirtmiştir. Hemen her konuda Şafiî mezhebinin görüşüne değinmiş bazen de Malikîlerin görüşlerine atıf yapmıştır. Tahlil kısmında ise önce Halebî ve eseri Mülteka'l-ebhur'u tanıttık. Daha sonra“Sivasî”ve eseri Ferâidu Mülteka'l-ebhur'u tanıtarak Sivasî'nin Ferâid 'deki sistematiğini, istifade ettiği kaynakları, kendisinden atıf yapan eserleri ve Ferâid'in fıkıh ilmindeki yerini değerlendirdik."
