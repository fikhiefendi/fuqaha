abstract: "التأمني هو النظام الذي حيمي األفراد وممتلكاهتم ضد املخاطر اليت قد حتدث هلم، وهذا النظام قد يستخدم من خالل العامل. ووجود التأمني التقليدي يضمن محاية ممتلكات املستهلكني من املخاطر اليت قد تتعرض هلا لسنوات عدة. لكن التأمني التقليدي غري مشروع ابلنسبة للمستثمرين املسلمني ألنه حيتوي على الغرر وامليسر والراب.مع ظهور التكافل )التأمني اإلسالمي(، كبديل للتأمني التقليدي ومبا يتماشى مع مبادئ الشريعة اإلسالمية، بدأ املستثمرون املسلمون يشعرون ابلثقة عند محاية ممتلكاهتم ضد املخاطر املختلفة.اهلدف من هذه الدراسة هو البحث يف نظام التكافل ومعرفة نظرة املستهلك يف التكافل يف تركيا، حيث بدأ تطوير نظام ً فيها، وللوصول هلذا اهلدف، مت اختبار معرفة املستهلكني وتصورهم ووعيهم التكافل حديثا وحساسيتهم الدينية حول التكافل، وذلك عن طريق استخدام االستبيان الذي شارك يف على نتائج ا ً ا. وبناء ً تعبئتهمائة ومخسة وعشرون شخص الستبيان، اتضح أن املستهلكني يف تركيا ليس لديهم معلومات كافية عن التكافل. كما مت التوصل إىل أنه إذا مت إعالم املستهلكني وتعريفهم ابلتكافل، فقد يفضلونه على التأمني التقليدي. وابإلضافة إىل تعريف الناس ابلتكافل، ا من قبل الدولة، فسوف تزداد حصة ال ً إنكان مدعوم تكافل يف القطاع. ابإلضافة إىل ذلك، فإن إنشاء شركة إعادة التكافل سيساهم بشكل كبري يف تطوير قطاع التكافل يف تركيا. كما ميكن القيام بدراسات مستقبلية حتت عنوان نظام التكافل يف تركيا من وجهة نظر شركات التكافل، ومناقشة التحدايت اليت تواجهها الشركات، وتقدمي اقرتاحات وحلول حلل هذه املشاكل."
