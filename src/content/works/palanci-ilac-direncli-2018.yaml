abstract: "Bu çalışmanın amacı; İn vitro ortamda ribavirin (RBV) kullanılarak dirençli Herpes simplex virus tip 1 (HSV-1) mutantı elde etmek ve saha suşunun RBV baskısı altındaki davranışları ile replikasyon kinetikleri arasındaki değişimleri incelemektir. Bu çalışmada, HSV-1 ile ilgili tüm süreçleri yürütmek amacı ile in vitro sistem olarak RD (insan rabdomiyosarkoması) ve Vero (Afrika yeşil maymun böbrek hücre hattı) kullanıldı. Çalışmanın ilk aşamasında ribavirinin hücreler için sitotoksik olmayan konsantrasyonu gerek tripan mavisi ve gerekse WST reaktifi ile tespit edildi. Bu aşamayı takiben, HSV-1 sitotoksik olmayan RBV dozu ile baskı altına alınarak ve baskı altına alınmadan üst üste 20 pasajlandı. Her pasaj için ilaç baskısı altında olan ve olmayan virusların titresi tespit edildi. Ayrıca her pasaj polimeraz zincir reaksiyonu kullanılarak (PCR) HSV-1 varlığı açısından kontrol edildi. Çalışmanın son aşamasında HSV-1 için iki spesifik gen bölgesi olan UL-23 ve UL-30 gen bölgelerinin varlıkları her pasaj için PCR yöntemi ile araştırıldı. RD ve Vero hücre kültürleri için RBV'in sitotoksik olmayan dozu 50 µM olarak tespit edildi. Birinci pasaj ile karşılaştırıldığında, ilaç baskısı altında olan virusun 20.pasaj titresinde 2 Log artışı vardı. İlaç baskısı altında olmayan virus için ise 14.pasajdan itibaren titre ve sitopatik değişiklikler (CPE) tespit edilemedi. Moleküler analizler sonucunda, UL-23 ve UL-30 gen bölgeleri ilaç baskısı altında olmayan HSV-1'de tespit edilemezken, iki gen bölgesinin ilaç baskısı altında bulunan HSV-1 için varlığı tespit edildi."
