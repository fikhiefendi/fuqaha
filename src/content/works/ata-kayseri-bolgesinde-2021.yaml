abstract: "Beslenme, barınma ve giyinme insanların yaşamlarını devam ettirebilmeleri için karşılamaları gereken en temel ihtiyaçlarıdır. Bu sebeple, gıda, inşaat ve tekstil sektörleri bir ülke ekonomisinin en stratejik üç sektöründen birisidir. Dolayısıyla, bu sektörlerin doğru bir şekilde örgütlenmesi, desteklenmesi ve büyütülmesi ekonomiler açısından büyük önem taşımaktadır. Sektörler hakkında yapılan araştırmalarda, gelişimlerinin önündeki en önemli problemin finansman sorunu olduğu görülmüştür. Çalışmamızda gıda, tekstil ve inşaat sektörlerinin finansman sorunlarının çözümünde kâr/zarar ortaklığına dayalı bir model olan katılım bankacılığının ne derece etkili olduğu sorusuna cevap aranarak gıda, tekstil ve inşaat sektörlerinin finansmanında katılım bankalarının rolünün belirlenmesi amaçlanmaktadır. Araştırmanın evrenini Kayseri'de gıda, tekstil ve inşaat sektörlerinde faaliyet gösteren işletmeler oluşturmaktadır. Araştırmada bahse konu işletmelerin finansmanında katılım bankalarının rolü, gıda, tekstil ve inşaat sektörlerine kullandırılan kredilerin miktarı ile toplam krediler içindeki payı bakımından belirlenmiştir. Kredilere ilişkin veriler 2007 Aralık ile 2019 Aralık arasında yıllık olarak, BDDK'nın (Bankacılık Düzenleme ve Denetleme Kurumu) FinTürk verilerinden yararlanılarak hesaplanmıştır. Çalışma kapsamında, Kayseri ilinde gıda, tekstil ve inşaat sektörlerinin finansmanında katılım bankalarının rolünün incelenmesi neticesinde, katılım bankalarının ilimizde gıda, tekstil ve inşaat sektöründe faaliyet gösteren işletmelere finansal kaynak kullandırma eğilimi arasında farklılık olduğu tespit edilmiştir. Çalışmada, katılım bankalarının tekstil ve inşaat sektöründe faaliyet gösteren işletmelere yönelik kredi kullandırma eğiliminin mevduat bankalarına kıyasla daha yüksek buna karşın gıda işletmelerine kredi kullandırma eğiliminin daha düşük olduğu sonucuna ulaşılmıştır."
