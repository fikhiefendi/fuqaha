abstract: "Alevilik ve onun bir kolu olan Caferilik mezhebi bizim toplumumuzun bir gerçeğidir, Caferilik mezhebinin ortaya çıkışı değerlendirildiğinde Hz. Ali'nin Halife olması gerektiği ve hakkının elinden alındığı, Hz Ali ve ailesine zulmedildiği bu sebeple Hz. Ali taraftarlığı (şiası) veya Ehli Beyt taraftarlığının oluştuğu fikri ekseriyetle kabul görmüştür. Caferilik mezhebini Ehli Sünnet mezheplerinden sayılmamasını sağlayan asıl unsurun itikadi meselelerden olan imamet inancıdır. İmamet inancının Caferi mezhebi sistematiği içerisinde kapsayıcı bir özelliği bulunmakta olup dinin kitaptan sonra ikinci nassı olan sünnet konusunda imamların beyanlarının da sünnet sayılması Caferi mezhebinde imamet inancının ne kadar ehemmiyetli olduğunu göstermektedir. Ameli boyutuna gelince abdest konusunda ayakların yıkanması veya mesh edilmesi en önemli ihtilaf meselesi görülürken, namaz konusunda ise en önemli ihtilaf meselesi namazın cem'i meselesi olduğu görülmektedir, bu konular incelendiğinde Caferi mezhebi ulemasının hüküm verirken Kuran ve Sünneti asıl kaynak kabul etmişlerdir. Bundan dolayı abdest ve namaz hususunda iki mezhep arasındaki ihtilafları içtihat farklılıkları olarak görmek gerekmektedir ki bazı mevzularda diğer Ehli Sünnet mezhepleri ile ortak görüşlerin olması bu duruma kanıt olarak gösterilebilir. Abdest mevzusunda Caferi mezhebince farz kabul edilen niyet, tertip, muvalat Hanefi mezhebinde sünnet veya müstehap olarak kabul edilmiştir. Ayakların yıkanması meselesi abdest konusunda ki en önemli ihtilaf meselesi görünmektedir. Bu konuyu araştırdığımızda meseleyi ictihat farklılığı olarak görmek gerektiği zira üzerine hüküm bina edilen Maide süresi 6.ayetinin kıraat farklılığının bu ihtilafa neden olduğu görülmektedir, Namaz mevzusunda Caferi mezhebinde farz kabul edilen; Tertip, muvalat, selam, Hanefi mezhebinde vacip veya sünnet kabul edilmektedir. Namazın cem'i meselesine gelince peygamberimizin bazı zamanlarda namazı cem etiği açıktır. Fakat Efendimizin namazı cem edişinin nedeni Hanefi mezhebi fukahasının belirttiği gibi sefer, yolculuk, karanlık, savaş gibi sıkıntılı zamanlarda mı? Yoksa Caferi mezhebi ulemasının dediği gibi ümmete kolaylık olsun diye mi? yapıldığı durumu yoruma açıktır. Bu sebeple bu mevzu ictihat farklılığı olarak görülmektedir. Caferi mezhebinde farz kabul edilen; Ayât namazı, büyük oğul üzerine farz olan namaz, Hanefi mezhebinde ayat namazı sünnet ve müstehap kabul edilmekte, büyük oğul üzerine farz olan namaz uygulaması ise Hanefi mezhebinde yoktur. Abdest ve namaz konusu tümüyle araştırıldığında birbirini küfür ile itham edecek bir ihtilafın görülmediği bu konulardaki tüm ihtilafların ictihat farklılığı olarak değerlendirilebileceği kanaati oluşmuştur."
