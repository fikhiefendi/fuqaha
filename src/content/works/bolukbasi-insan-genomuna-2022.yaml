abstract: "İnsan genomuna müdahale kapsamında uygulanan modern gen teknolojileri, teknik anlamda doğrudan fıkıh ilminin konusu değildir. Ancak fıkıh ilminin temel uğraş alanı mükellef ve mükellefin fiileri olduğu için insana dair her alanda olduğu gibi insan genetiği üzerindeki tasarruflar da sonuçları itibarıyla fıkıh disiplinin bir konusu haline gelmektedir. Dolayısıyla öznesi ve konusu insan olan genom uygulamalarından mütevellit meselelerin inceleme konusu yapılması ve buna ilişkin fıkhi bir perspektif geliştirilmesi ihtiyacı bulunmaktadır. Bu saikle tez çalışmamızda, genom uygulamaları kavramsal çerçevede anlaşılmaya çalışılmış, genoma müdahalenin fıkhın hangi ilkeleri ile ilişkilendirebileceği üzerinde durulmuş ve nihayet tespit edilebildiği kadarıyla belirlenen ilkeler doğrultusunda insanın insan olmak bakımından haiz olduğu hasletler, dinin korunmasını emrettiği zarurat ve korunması gereken maslahatlar bakımlarından genom uygulamaları hakkında değerlendirme yapılmaya çalışılmıştır."
