abstract: "Bu çalışmada, fıkhın tedvin edildiği hicrî ikinci asırda, Ebû Hanîfe tarafından hangi metinlerin yazıldığının ve yazılan her bir metnin gerçekte kime ait olduğunun tespit ve tahlili konu edilmiştir. Birinci bölümde, hicrî ikinci asırda kaleme alınan örnek metinler ışığında o asrın metinlerinin karakter tahlili yapılmış, özellikle dönemin metin yazma ve yazılan metni rivayet etme geleneği incelenmiştir. İkinci bölümde, hakim kanaatin aksine, Ebû Hanife'ye ait bir fıkıh metninin varlığından ve bu metnin el-Usûl diye adlandırılan metinlerle ve el-Câmiʻu's-sagîr ile alakasından bahsedilmiştir. Alanında ilk olan çalışmamızı yaparken klasik tabakât, menâkıp ve tarih kitapları yanında Nâtıfî'nin el-Ecnas'ı başta olmak üzere birçok fürû-i fıkha dair eser de gözden geçirilmiştir."
