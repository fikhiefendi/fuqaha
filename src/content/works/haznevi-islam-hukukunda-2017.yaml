abstract: "Cihad inatçı ve savaşan kâfirlere karşı mücadele sırasında Allah'ın dinini yüceltmek için bütün gayretini sarf etmektir. İslam'da cihad emri, tedrici olarak üç aşamadan geçmiştir. Cihadın gayesi yüce hedefler ve güzel maksatlara ulaşmaktır. Sırf kan dökmek ve maddi kazanç elde edip hükümranlık kurmak temel amaç değildir. Çalışmamızda savaş halinde İslam hukukçularının düşmana karşı yapılması caiz ve yasak olan ile hükmünde ihtilaf ettikleri fiiller ele alınmıştır. Buna göre savaşa katılan muhariplerin öldürülmesinin caiz olduğu; savaşa katılmayan çocuk ve kadınların ise öldürülmesinin caiz olmadığı hususunda İslam hukukçuları ittifak etmiştir. Din adamlarının, yaşlıların ve esirlerin öldürülmesi, düşmana ait malların telef edilmesi, hayvanları öldürüp ateşle yakma, müsle, fidye işlemleri ve kitle imha silahlarının kullanılmasının hükmü konularında ise ihtilaf vardır. İslam hukuku savaş halinde bile olsa zulüm ve haksızlıklardan uzak durmanın gerekliliğini beyan etmiştir. Tarih boyunca kural tanımadan savaşan insanlığa savaşın da bir hukukunun ve ahlâkının olması gerektiğini öğretmiştir."
