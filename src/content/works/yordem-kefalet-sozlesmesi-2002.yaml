abstract: "ÖZET“Kefalet Sözleşmesi İçinde Kefilin Hak ve Sorumlulukları”konulu bu tez çalışmasında, Türk Pozitif Hukuku esas alınmıştır. Bununla beraber, tarihçe bölümünde konu, değişik hukuk sistemlerine göre kısaca ele alınmaya çalışılmıştır. Bu çalışmamız, üç bölümden oluşmaktadır. Birinci bölümde, genel olarak sözleşme kavramı, Borçlar Hukuku Sözleşmelerinin sınıflandırılması ve kefalet sözleşmesinin tarihçesi ele alınmıştır. Tarihçede, kefalet sözleşmesi değişik hukuk sistemlerine göre öz olarak ele alınırken, önceki hukuk sistemimize, günümüz şartlarına göre yeni düşünceler baz alınarak daha çok yer verilmeye çalışılmıştır. İkinci bölümde, konu, kefalet sözleşmesinin mahiyeti, hukuki niteliği ve çeşitleri başlığı altında ele alınmıştır. Ayrıca konu ile ilgili olarak, kefalet sözleşmesinin unsurları, şartlan, benzer sözleşmelerden ayırt edilmesi ve kefalet sözleşmesinin çeşitlerine de yer verilmiştir. Üçüncü ve son bölümde, Asıl üzerinde durmaya çalıştığımız, kefalet sözleşmesi içinde kefilin haklan ve sorumlulukları konusu, geniş olarak irdelenmiş; kefilin asıl borçluya, alacaklıya karşı ileri sürebileceği deriler detaylıca anlatılmıştır. Bu konuda, değişik kefalet türlerinin konuyla ilgili özellikleri üzerinde durulmuştur. Daha sonra alacaklının kefil karşısındaki yükümlülükleri incelenmiştir. Kefalet sözleşmesinde, kefilin haklan, özellikle, uygulamadaki yaygınlığı göz önünde bulundurularak, kefilin asile rücu edebileceği ve rücu edemeyeceği haller tek tek anlatılmıştır. Ayrıca, konu ile ilgili olarak eksik' ya da yanlış bulduğumuz düşünceler eleştirilmiş, çözüm olarak yapılması gerekenler konusunda yeni fikirler belirtilmiştir. Son olarak; kefalet sözleşmesinin, asıl borca bağlı sebepler ile bağımsız ve kendine özgü sebeplerle sona erme halleri anlatılmıştır."
