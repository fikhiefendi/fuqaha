abstract: "ÖZET 1970'lerden itibaren uluslararası finans piyasalarında ağırlığını hissettirmeye başlayan faizsiz Bankacılık sistemi; bir çok ülkede atıl kaynakları harekete geçirmek suretiyle ekonomik kalkınma çabalarına sağladığı katkılar nedeniyle benimsenmiş ve giderek yaygınlık kazanmıştır. Bu gerçeği gören batılı bankalar da; Citibank'ın yaptığı gibi tamamiyle söz konusu ilkelere dayalı bankalar kurma yoluna girmiştir. Türkiye'de faizsiz bankacılığın uygulaması olan özel Finans Kurumları(ÖFK) 1985 yılında faaliyete geçmiştir. Halen Albaraka Türk, Kuveyt Türk, Asya Finans, Anadolu Finans ve Family Finans olmak üzere 5 adet ÖFK mevcuttur. Türkiye'de ancak 1984 yılında kurulabilen özel Finans Kurumları, hızlı ve istikrarlı bir gelişme göstererek ilk kuruldukları yıl olan 1985'te krediler açısından bankacılık sektörünün içinde ancak % 0,47'lik bir yer edinirken, bu oran 1999 yılında 1.2 katrilyon TL ile % 5,75 düzeyine çıkmıştır. Tez: ÖFK'lerin tuttukları nakit oranlarının, bankalara göre daha fazla olmadığını, aksine neredeyse onların yarısı kadar bir nakit düzeyi ile faaliyetlerini sürdürdüklerini; Faizsiz bankaların halen kullanmakta olduğu geleneksel finansman modellerin yanında, modern finansal yöntemlerin önemli bir kısmını bir takım şekil şartlarının değiştirilmesi ile rahatlıkla bünyelerine monte edebileceklerini ve böylece ürün yelpazelerini genişletebilmelerinin olası olduğunu ortaya koymuştur. Öte yandan, ÖFK'ler açısından ürün çeşitliliğinin sağlanması konusuna bakıldığında yasal düzenlemelerin sınırladığı dört ana fon kullandırmayönteminin bir sınır oluşturduğu da bir gerçektir. Ancak, 1983 yılındaki faizsiz bankacılığın teorik yapısına göre şekillendirilen ÖFK mevzuatının, tezde ortaya konulan bulgular ışığında revizyona tabi tutulması ile ÖFK'ler bazında yeni finansal araçların uygulamaya konulabileceği düşünülmektedir."
