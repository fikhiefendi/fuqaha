abstract: "Araştırma, İslâmî bankaların Genel Sunum ve Açıklama Standardını ve bunun Irak'ta faaliyet gösteren İslâmî bankaların finansal performansının etkinliğini değerlendirmedeki rolünü ele almıştır. Araştırmanın problemi, Irak İslâmî bankaları tarafından yayımlanan finansal tablolar incelenerek ortaya konulmuştur. İslâmî finans kurumları Genel Sunum ve Açıklama Standardı, Irak İslâmî Finansal Kurumları Muhasebe, Denetim, Kontrol ve Etik Kurumu tarafından 1993 yılından bu yana yayımlanmış olsa da, bu finansal tabloların paragrafları için genel sunum ve açıklama uygulamaları sürecinde bir standardizasyon eksikliğinin var olduğu tespit edilmiştir. Öte yandan Irak'ta faaliyet gösteren tüm İslâmî bankalar, Irak Merkez Bankası'nın şemsiyesi altında ve talimatları mucibince faaliyet gösterse de, bu İslâmî bankaların Genel Sunum ve Açıklama Standardının gerekliliklerine bağlılıkları her zaman farklılık göstermiştir. Araştırma, İslâmî finans kurumları için Genel Sunum ve Açıklama Standardının gerekliliklerini tespit etmeyi, bu standardın madde ya da paragraflarının uygulanmasının önemini vurgulamayı ve gerekliliklerine uymanın olumlu etkilerini belirlemeyi amaçlamıştır. Bu bağlamda araştırmada İslami bankacılık sektöründe 2016-2020 yılları arasında Irak'ta faaliyet gösteren 14 İslami bankanın finansal performanslarını gösteren mikro faktörler belirlenmeye çalışılmıştır. Panel Veri Analizi kapsamında öncelikle oluşturulan dört model için Sabit Etkiler ve Tesadüfi Etkiler test sonuçları, bunlardan hangisinin etkin olacağına yönelik Hausman test sonuçları gösterilmektedir. Ardından Tesadüfi Etkiler GLS Regresyon sonuçları verilmiştir. Son olarak Panel analizlerinde otokorelasyon testi için Wooldridge'in korelasyon testi kullanılmıştır. Araştırma sonuçlarına göre; Model-1 için istatistiki olarak hiçbir anlamlı sonuç bulunamazken, Model-2, 3 ve 4 için ise sonuçlar güvenilirdir. Dolayısıyla İslami finans kurumların, (2016-2020) yılları aralığını kapsayan dönemde, finansal tablolarda Sunum ve Genel Açıklama Standardına bağlılığına yönelik genel eğilimi yansıttığını söylemek mümkündür. Irak'ta faaliyet gösteren İslami bankaların, varlıkların getiri oranı, mevduat tahsis oranı, özsermaye kârlılığı ve özkaynak tutarı değerlerine göre İslami finans kurumlarının sunum ve genel açıklama standardı gerekliliklerine uydukları gözlemlenmiştir. Sonuç olarak araştırma sonuçları Irak'ta faaliyet gösteren İslami bankaların sunum ve genel açıklama standardını uygulama taahhüdünün artan önemini yansıttığını ve İslami muhasebe standartlarını uygulamalarına genel olarak bağlı kaldıklarını göstermektedir. Çalışmada, Irak'ta faaliyet gösteren İslâmî bankalardaki finansman ve yatırım işlemlerinin, araştırma sonuçlarına göre, İslâmî bankaların sunum ve genel açıklama standartlarıyla oldukça uyumlu olduğu sonucuna ulaşılmıştır."
