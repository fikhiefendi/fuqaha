abstract: "Bu çalışmada, Endülüslü fakîh İbn Hazm'ın telif ettiği ve İslam hukuku araştırmaları sırasında kendisine sıklıkla müracaat edilen bir kaynak olan el-Muhallâ'da Aile hukukuyla ilgili konularda Ebû Hanife'ye nispet edilen görüşlerin isabetli olup olmadığının tespit edilmesi amaçlanmıştır. Eserin mukayeseli hukuk türünde telif edilmiş olması ve bu tür eserlerde zikredilen muhalif görüşlerde hataların bulunması bizi bu çalışmaya sevk etmiştir. Çalışma, iki bölümden oluşmaktadır. Çalışmanın giriş kısmında araştırmanın konusu, amacı, kaynakları ve yönteminden bahsedilmiştir. Çalışmanın birinci bölümünde, ilk olarak, el-Muhallâ'nın müellifi olan İbn Hazm'ın hayatı, hocaları, öğrencileri, eserleri, şahsiyeti, fıkıh metodu ve fıkhî görüşlerinden örnekler ele alınmış; akabinde el-Muhallâ ile ilgili bilgiler sunulmuştur. İkinci bölümde, İbn Hazm'ın el-Muhallâ adlı aserinde Aile Hukuku ile ilgili konularda Ebû Hanife'ye nispet edilen 191 görüş, tahkik edilmiştir. Söz konusu görüşlerin Ebû Hanife'ye âidiyeti araştırılırken, Hanefî mezhebinin en muteber kaynaklarına müracaat edilmiş olup, yapılan incelemeler sonucunda 20 görüşün hatalı olduğu tespit edilmiştir. Bunlar: Nikâh (5), Mehir (2), Cinsî Münasebet (2) Talak (5), Ric'at (2), Zıhar, İddet, İstîlâd ve Hidâne konularındadır. Sonuç kısmında ise yapılan araştırmalardan tespit edilen değerlendirmeler sunulmuştur."
