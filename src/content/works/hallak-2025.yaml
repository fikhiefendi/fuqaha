abstract: "Bu araştırma, orijinal bir yaklaşım sunmakta olup, Kur'an-ı Kerim'in hükümleri teşri (kanun koyma) sürecinde izlediği yöntemler (sünen) konusunu ele almaktadır. Bu çalışma, Kur'an-ı Kerim'in sadece şer'i hükümleri beyan etmekle kalmayıp, aynı zamanda bu hükümlere uymayı kolaylaştırmayı ve pekiştirmeyi, onlara olan imanı derinleştirmeyi, anlaşılmalarını sağlamayı ve ilahi şeriat ile duygusal ve zihinsel bir etkileşim gerçekleştirmeyi hedefleyen teşri yöntemler belirlediğini ortaya koymaya odaklanmıştır."
