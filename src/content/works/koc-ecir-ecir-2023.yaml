abstract: "18. yüzyılın sonlarından itibaren başlayan“sanayileşme”, başta İngiltere ve çeşitli Batı Avrupa ülkelerinde seri üretime dayalı iş yerlerinin açılmasına sebep olmuş, bu iş yerlerinde çalışacak işgücü ihtiyacını doğurmuştur. Dönemin hakim zihniyeti olan liberalizm, güçlü durumda olan işverenin, zayıf durumda olan işçi sınıfını sömürmesine sebep olmuş ve zor şartlar altında çalışmaya mahkum etmiştir. 1400 yıl öncesine uzanan tarihi, medeniyeti ve hukuku ile İslam dini daima insana değer vermiştir. Hiçbir zaman İslam'da proleterya sınıfı oluşmamış, aksine işçi ile işvereni kardeş olarak tanımlamıştır. İslam hukukunda memur, avukat, berber, devlet başkanı gibi meslek grupları, statü bakımından bir üstünlük sırasına konulmamış, hepsini“işçi”kavramı altında birleştirmiştir. Aralarındaki tek fark ise, yalnızca işverenine çalışma veya her işverene iş yapabilme olanağı açısından ecîr-i hâs ile ecîr-i müşterek olarak tanımlanmalarıdır. Bu çalışmada, İslam hukukundaki ecîr-i hâs ile ecîr-i müşterek kavramları incelenmiş, arasındaki farklar ortaya konulmuştur. Türk Borçlar Kanununda ve özellikle işçi-işveren ilişkileriyle ilgili çıkarılan 4857 sayılı İş Kanununda işçi ve işveren tanımları yapılmıştır. Pozitif hukukumuzdaki işçi tanımıyla, İslam hukukundaki işçi tasavvuru arasındaki benzerlik ve farklılıkları belirtmesi amacıyla bu tez çalışması büyük bir önem taşımaktadır. Hizmet Sözleşmesi kapsamında Türk Borçlar Kanununda ve İş Kanununda tanımlanan işçi kavramı, İslam hukukundaki ecîr-i hâs kavramı ile karşılanmakta ve ecîr-i müşterek kavramının Türk Borçlar Kanununda“Bağımsız Çalışan”olarak ifade edildiği tespit edilmiştir. Pozitif hukuktaki eser sözleşmesi kavramının, İslam hukukundaki istisna' ve icâre sözleşmelerini içerisinde barındıran bir üst başlık formunda olduğu, ecîr-i müşterek kapsamında olan her icâre sözleşmesinin eser sözleşmesi olduğu lakin her eser sözleşmesinin icâre sözleşmesi olmadığı kanısına varılmıştır."
