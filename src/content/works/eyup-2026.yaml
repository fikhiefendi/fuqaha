abstract: "ÖZET ŞİRKETLERE İLİŞKİN FIKHÎ HÜKÜMLERİN BELİRLENMESİNDE CÜZ'Î ŞER'Î MAKÂSIDIN ETKİSİ Rıdvan EYÜP Doktora, İslam İktisadı ve Hukuku Tez Danışmanı: Prof. Dr. Heytem HAZNE Haziran, 2026 - 318 + xv Sayfa Bu çalışma, şer'î maksatların (Makāsıdü'ş-Şerîa) cüz'î boyutunun, fıkhî ve hukuki şirket hükümlerinin düzenlenmesindeki etkisini incelemektedir. Çalışma, şirketlerde hak ve yükümlülüklerin iç içe geçmesi ve karmaşık bir yapı arz etmesinin, İslam hukukunun malın ve hakların korunmasına yönelik amaçlarının zedelenmesine yol açabileceği varsayımından hareket etmektedir. Araştırmanın amacı, şirket hükümlerini yöneten şer'î maksatları ortaya koymak, bunların fıkhî hükümlerin anlaşılması ve tercih edilmesindeki önemini açıklamak ve farklı şirket türlerine ilişkin hükümlerin belirlenmesindeki etkisini ortaya koymaktır. Araştırmada, klasik fakihlerin şirketlere ilişkin görüşlerini temel kaynaklarından aktarmak ve çağdaş şirketlerin mevcut durumunu incelemek amacıyla betimleyici yöntem kullanılmıştır. Âlimlerin zikrettiği şer'î maksatları tespit etmek için tümevarım yöntemi, hükümlerin illetlerini ve dayanaklarını incelemek için analitik yöntem, şer'î maksatları ortaya çıkarmak ve bunların şirket hükümlerine etkisini belirlemek için tümdengelim yöntemi uygulanmıştır. Ayrıca, çıkarılan maksatlar ile fıkhî ve hukuki hükümler karşılaştırılarak bu maksatların tercih ve değerlendirme sürecindeki etkisini ortaya koymak amacıyla karşılaştırmalı yöntemden yararlanılmıştır. Araştırma sonucunda, şer'î maksatların kabulünde esas alınan metodolojik ölçütlere uygun, bütüncül bir makāsıd sistemi oluşturulmuş; bu sistemde kesin (kat'î) ve zannî maksatlar birbirinden ayırt edilmiştir. Sistem, diğer bütün maksat derecelerine yön veren kesin yüksek maksatların belirlenmesiyle başlamış, ardından kesin zarurî maksatlar ortaya konmuş ve son olarak mali işlemlere özgü maksatlar ele alınarak bunların kat'îliği şer'î delillerle temellendirilmiştir. Çalışmada ayrıca fakihlerin şirket hükümlerine ilişkin illetleri incelenmiş, bunlardan hareketle şirketlere özgü cüz'î maksatlar sağlam metodolojik esaslar çerçevesinde çıkarılmıştır. Bu maksatlar, hakların korunmasını, şirketlerin istikrarını ve güçlenmesini sağlayacak şekilde fıkhî görüşler arasında tercih yapılmasında temel ölçüt olarak kullanılmıştır. Araştırma yalnızca fıkhî boyutla sınırlı kalmamış, aynı zamanda hukuki şirketleri de makāsıd eksenli bir yaklaşımla incelemiş; bunlara ilişkin geçerli şartları açıklamış ve ilgili hukuki hükümleri şer'î maksatlar doğrultusunda değerlendirmiştir. Araştırma, şirketlerin kuruluşunda sözleşmelerin ayrıntılarına özen gösterilmesini ve bunların şer'î maksatlarla uyumunun titizlikle denetlenmesini tavsiye etmektedir. Ayrıca ticaret hukukuna ilişkin düzenlemelerin hazırlanmasında şer'î maksatların ve bunlara ilişkin metodolojik ilkelerin dikkate alınması, güncel meselelerin disiplinli bir makāsıd yaklaşımıyla araştırılması ve makāsıd ilminin eğitim müfredatına dâhil edilmesi önerilmektedir."
