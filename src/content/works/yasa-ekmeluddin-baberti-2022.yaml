abstract: "Hanefî mezhebine mensup olan Ekmelüddîn Bâbertî (ö. 786/1384) İslâm düşüncesinde fıkhın yeniden yapılanması noktasında önemli bir âlim olup, görüşlerini Hanefîliğin tecdid ve müdafaası şeklinde ortaya koymuştur. Öğretici ve savunmacı bir fıkıh anlayışına sahip olan Bâbertî'nin Hanefî mezhep âlimleri arasında önemli bir yeri vardır. O, eserleri ve risâlelerinde bu mezhebin tercih ve taklid edilmesinin önemli ve gerekli olduğunu savunmuştur. Bâbertî'nin mezhebin dışında bir ictihad anlayışı yoktur. Bâbertî Hanefîliğin ortaya koyduğu külli fıkhı öğretmeye çalışmıştır. Reycilik ithamlarına karşı savunmacı bir tavır ortaya koymuştur. O, Hanefî mezhebinin diğer mezheplerden daha önemli bir konumda olduğunu savunmuş, bu sebeple Osmanlı Devleti'nde ve genel anlamda İslâm dünyasında Hanefî mezhebinin, bir mezhep olmasının yanında bizzat İslâm düşüncesi olarak kabul edilmesinde etklili olmuştur."
