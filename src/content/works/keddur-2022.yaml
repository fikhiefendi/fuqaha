abstract: "Öz: Araştırma, Hanefilerin ahâd hadisi reddetmede dayanak olarak ileri sürdükleri meseleler ile onunla amel etmeme konusunda ihticâc ettikleri illetler hususunda her meseleye terettüp eden bazı örnekler eşliğinde fakihlerin görüşlerini ve delillerini açıklayarak söz konusu gerekçelerin hadise muhalefette ne kadar muteber olduklarını hâvîdir. Araştırma bir mukaddime, giriş, iki temel bölüm ve bir sonuçtan müteşekkildir. Mukaddime: konunun önemi, seçme sebepleri, konu hakkında geçen çalışmalar, araştırmanın zorlukları, yöntemi ve sınırlılıkları. Giriş: âlimlerin sünnetle amele dair istekleri, ahâd haber ve onunla amel etmenin hükmü, ilim mi zan mı ifade ettiği, sünnetin Kur'an'a arzı meselesi ile bu husustaki âlimlerin görüşleri ve İmam Şatibî'ye göre haberin taksimi gibi hususlar. Birinci Bölüm: Usule muhalefet illetiyle Hanefîler'in hadisi reddettikleri meseleler kapsamında Kur'an-ı Kerim'e muhalefet, meşhur sünnete muhalefet, haberin kıyasla tearüzü, nassa ziyade. İkinci Bölüm: Rivayetindeki herhangi bir şüpheden dolayı Hanefîler'in hadisi reddetmelerine sebep olan meseleler kapsamında umûmu'l-belvâ, râvînin kendi rivayetine muhalefeti, sahabenin haberle amel etmeyi terk etmesi ve haberle ilgili ihtilafları, haberin hadlerle ilgili vürudu ve şüphelerden dolayı sakıt olması. Sonuç: En önemli sonuçlar ve tavsiyeler."
