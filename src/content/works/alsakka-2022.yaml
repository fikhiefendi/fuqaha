abstract: "Yazarın bilgileri : Molla Hüseyin ibn Iskandar al-Rumi el-Hanafi, H. 1084 yılında vefat etmiş , Allah ona rahmet . etsinFıkıh ve tasavvuf âlimlerinden olup, Osmanlı Devleti âlimlerindendir.Fıkıh ve tefsir üzerine çok sayıda kitabı vardır ve tasnif konusunda çok iyi yeteneği vardı. Kitapları arasında şunlar bulunmaktadır:el cevharu-minir mecmeul-muhimmati diniyye), (Hanefi Düşünce Okulu'ndaki Dini Misyonların Bileşimi) . Bu kitap da dahil olmak üzere ve yazara atfedilmesi sabittir. (Al-Alam Al-Zarkali, Cilt 2/233), (Hidaya Al-Arifeen, Cilt 1/323) . Mahtut bilgileri : İçinde fıkıh ve inançlardaki tasnifinden bir giriş yapıldı, kitabın girişinde şöyle dedi: (Fıkıh, inançlar ve dini meseleleri içeren girişimi açıklıyordum ama içinde biraz uzun gördüm, bu yüzden onun uzun sayılarından bazılarını kısalttım ve ona güzel bir kolaylaştırma ekledim. Peygamber'in hicretinin bin altmış dört yılında mübarek Zilhicce ayı ve hamd yalnızca Allah'a mahsustur. Temizlik ve namaz ile sınırlandırılmış, inanç, tevhid ve Cenab-ı Hakk'ın bilgisi ile ilgili bir fasıldan bahsedilmiş ve fıkıh fasılları altında düzenlenmeyen çeşitli konularda bir bölüm ayırmıştır. Sık sık meydana gelenleri ve mükellefin bilmesi gerekenleri zikretmiş, meseleleri zikrettikten sonra fıkhî faydalardan bahsetmiş, söz ve fiillerde küfre düşmekten ve imanın temelini bozmaktan sakındırmaya çalışmıştır. Ve onu, (Tenveer al-Absar, Durar al-Hakem, Muniyat al-Musalla, açıklaması, al-Bahr al-Ra'iq, al-Mukhtar ve Multaqa al-Abhar) gibi onaylanmış kitaplardan seçti. ve ibadet fiillerini düzeltmekle ilgili bazı kitaplardan, örneğin: (Gaznevi , Hadiyat İbn el-İmad ve el-Kidani) Ve doktrinin doğru doktrinini açıklamaya özen gösterdi. ve ağırlık kitaplarından alınan fetvalara dayananlar, örneğin: (The Springs, Al-Mujtaba, Al-Sarraj Al-Wahaj, Tuhfat Al-Muluk, Al-Muhat Al-Burhani, Al-Jami` Al-Wajeez , Gerçeklerin Açıklanması ve Sonuç. Ve kitabın sıradan insanlara uygun olmasına ve bazı meseleleri bilmede ve kitaplardan varlık ihtimalini bilmede ilim talebeleri için bir referans olmasına özen göstermiş, bu yüzden meseleleri kolay ve sade bir şekilde zikretmiş ve bazı konuları düzenlemeye devam edebilir ve konunun kökenine değinebilir ve konuyu tam olarak bilmek isteyenler için referansına atıfta bulunabilir ve bu, sıradan insanın ruhunu bilgi aramaya ve araştırmaya yönlendirmede bir çekirdektir. Kitabın sonunda, ilim öğrenmenin fazileti hakkında bir sûreden bahsetmiş ve üslubuyla bir ibret ve nasihat olması gerektiğini söylemiş ve bundan dolayı: (cenaze namazı sûresini) Kitabın sonunda ve Dua Kitabında bahsetmedi Sonra niyeti ve Yüce Allah'a bağlılığı hakkında bir sonuç belirtti. El yazması nüshaları : El yazmasının dört nüshasını buldum : Birinci nüsha: (64) levhalarında yer alan Reşid Efendi Kütüphanesi. Üçüncü nüsha: İskenderiye'deki Belediye Kütüphanesi, (54) levhalarında yer almaktadır. Dördüncü nüsha:: Kahire'deki Üniversite Kütüphanesi, (55) plakada yer almaktadır."
