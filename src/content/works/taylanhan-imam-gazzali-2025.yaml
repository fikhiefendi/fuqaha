abstract: "İslâm düşünce geleneğinde önemli bir yere sahip olan İmam Gazzâlî, fıkıh usûlü başta olmak üzere İslâmî ilimlerin tekâmülünde metodolojik katkılar sunması nedeniyle öncü bir âlimdir. Bu çalışma muhteva açısından Gazzâlî'nin fıkıh usûlü alanındaki katkılarını açıklığa kavuşturmayı hedeflemektedir. Tespit edildiği kadarıyla Gazzâlî'nin usûl anlayışında Şâfiî geleneğinin ilmî tevarüsü ve kendi yöntemlerine bağlı özgün metodoloji hakimdir. Bu nedenle o, bir anlamda müntesip olduğu doktrinin mukallidi gibi gözükse de tahkîki yönü baskın olup usûl tedrisatına etki bırakan bir usûlcüdür. Dolayısıyla çalışma, Gazzâlî'nin usûldeki aktif rolünü somut argümanlarla ortaya çıkarmayı amaçlamaktadır. Gazzâlî'nin fıkıh usûlündeki fonksiyonunun net tespiti için kendisinden önceki ve sonraki ulemânın araştırılması gerekli görülmüştür. Bu bağlamda Şîrâzî, Cüveynî, Râzî ve Âmidî'nin başat eserleri ile Gazzâlî, mukayeseye dayalı yöntem doğrultusunda inceleme konusu olmuştur. Tez, Gazzâlî'nin genel metodolojik katkılarını ve şer'î deliller çerçevesindeki etkilerini kapsamaktadır. Ulaşılan neticeler her bölümün sonunda değerlendirme başlığı altında incelenmekte, sonuç kısmında ise temel bulgular muhtasar bir şekilde açıklanmaktadır. Araştırma, giriş, üç bölüm ve sonuç kısımlarından oluşmaktadır. Giriş bahsinde araştırmanın önemi, amacı, kapsamı, sınırlandırılması ve kaynakları gibi meseleler açıklanmıştır. Birinci bölüm, Gazzâlî'nin İslâm düşünce geleneğindeki konumu ve usûl anlayışı ile araştırma kapsamına dâhil edilen diğer usûlcülerin metodolojilerinin mukayeseli analizine ayrılmıştır. İkinci bölümde Gazzâlî'nin özellikle fıkıh usûlüne dair genel katkıları ele alınmıştır. Bu çerçevede mantığın onun fıkıh usûlünde mukaddime olarak yer edinmesi, ictihâdî yaklaşımları, hüküm nazariyesi, sistematik tasnif metodu gibi hususlar beyan edilmiştir. Üçüncü bölümde şer'î delillerin Gazzâlî açısından tasnif-telif metodu, onun diğer müellifler ile benzeştiği ve ayrıştığı noktalar açıklanmış; şer'î deliller doğrultusunda Gazzâlî'nin katkıları tespit edilmeye çalışılmıştır. Çalışma sonucunda; Gazzâlî'nin usûl metodolojisinin, önceki literatürü sistemli bir şekilde düzenlediği ayrıca Râzî ve Âmidî'ye etki eden dönüştürücü bir niteliğe sahip olduğu kanaati ortaya çıkmıştır. Dolayısıyla Gazzâlî'nin ilmin olgunlaşma sürecine yön veren önemli isimlerden biri olduğu neticesine varılmıştır."
