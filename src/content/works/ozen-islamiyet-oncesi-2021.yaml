abstract: "İslamiyet öncesi dönemde Orta-Asya'da yaşan Türkler göçebe bir yaşam tarzına sahiptirler. Toplumsal düzen, töre adı verilen sözlü bir hukuk ile sağlanmaktadır. Sekizinci yüzyıldan itibaren İslam dini ile tanışan ve gruplar halinde müslüman olan Türkler; o günden bugüne İslam dini kuralları ile yaşamışlardır. Türklerin müslüman olması ile ilgili çeşitli görüşler mevcuttur. Türklerin müslüman olmasının nedenini Türk töresinin İslam dininin kuralları ile benzer olduğunu savunanlar olduğu gibi Türklerin töresinin İslam dini ile benzer olmadığını, Türklerin müslümanlığa zorlandığını savunanlar da olmuştur. Aile ile ilgili hükümler her toplumda yaşayan ve gözlemlenebilen kurallardır. Türk töresinin aile ile ilgili kurallarını İslam hukuk bağlamında inceleyerek iki hukuk anlayışının birbirine benzerliğinin neler olduğu ortaya çıkarılmıştır. Yaklaşık on beş başlık altında incelenen bu konulardan on iki tanesinin birbirine benzediği belirlenmiştir."
