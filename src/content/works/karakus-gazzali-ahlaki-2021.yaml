abstract: "Gazzâlî; dini, ilmi, siyasi kargaşaların ve bozulmaların olduğu 11. yüzyılda yaşamış olup pek çok ilim alanında yetkin olmakla beraber döneminde ve daha sonraki dönemlerde ahlâk felsefesi hakkındaki görüşleriyle tanınmaya devam eden bu alanda otorite sahibi bir ahlâk bilgini olarak anılmaktadır. Gazzâlî'nin eserleri, İslam düşünce geleneğini anlamak için temel kaynaklardan sonra en fazla başvurulan yapıtlardandır. Gazzâlî tasavvuf klasikleri arasında her zaman önemli bir yere sahip olan, dini ilimlerin yeniden canlılığını kazanmasını sağlayan bir eser olarak tanımlanan İhyâü Ulûmi'd-dîn adlı eserini yaşadığı toplumun ahlâki bozulmalarını gidermek için yazmıştır. Çalışmamız Gazzâlî'nin bu eserini esas almakla beraber Mîzânü'l-amel, Eyyühe'l-veled, Mişkâtü'l-envâr, el-Münkız mine'd-dalâl adlı diğer eserlerinden de yararlanılarak Gazzâlî'nin ahlâki eğitim anlayışını, kullandığı metotları ve ahlâki eğitimde değerler sistemi kullanıp kullanmadığını ortaya koymayı hedeflemektedir. İhyâü Ulûmi'd-dîn adlı eserinde değerler eğitiminin nasıl gerçekleştiği hakkında bilgi sahibi olmamızı ve elde edilen verilerle Gazzâlî'nin ahlâki eğitimi ile tasavvufi eğitimin ve günümüz değerler eğitiminin benzer noktalarının olup olmadığının karşılaştırılmasını amaçlamaktadır. Çalışmamızda başından sonuna kadar nitel araştırma yöntemleri olan kaynakların toplanması, analizi, verilerin karşılaştırılması ve değerlendirilmesi, verilerin tutarlı ve anlamlı bir metin haline getirilmesi aşamaları kullanılmıştır. Çalışmamızda Gazzâlî'nin ahlâki eğitim anlayışı ile kullandığı sistemin Kur'ân ve Sünnet'e dayalı olduğu, bu çerçevede hem dünya hem de ebedi saadete erişebilecek iyi insanların yetişmesini hedeflediğini ve İhyâü Ulûmi'd-dîn adlı eseri bağlamında insanın faziletler edinip reziletlerden kurtulması için riyâzet, mücâhede, tefekkür, kalbin takvâsı ve örnek alma metotlarını kullandığı bilgisine ulaşılmıştır. Ayrıca Gazzâlî'nin ahlâk eğitimi ile ilgili görüşleriyle tasavvufi eğitim ve günümüz değerler eğitiminin gerek hedefledikleri amaçlar gerek kullandıkları metodlar birbirleriyle bağdaştığı görülmektedir."
