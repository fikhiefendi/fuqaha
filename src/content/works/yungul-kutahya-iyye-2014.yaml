abstract: "Çalışma konusu olarak seçtiğimiz 9 No'lu Kütahya Şer'iyye Sicili, hicri 1227-1229/miladi 1812- 1813 yıllarına ait Kütahya ve çevresinde hukuka intikal etmiş mahkeme kayıtlarını ihtiva eder. Çalışmamızda miras-tereke, resmi yazışmalar, vakıflar, naiblik müessesesi, vekil tayini gibi mahkeme kayıtlarının transkripsiyonu, değerlendirilmesi ve tasnif edilmesi yer almaktadır. Bilindiği gibi şer'iyye sicilleri mahkeme kararı demektir. Osmanlı döneminden günümüze kadar intikal eden bu kararlar, toplumun sosyal, siyasi ve ekonomik yapısı hakkında bize bilgi verir. Örneğin; sicillere kaydedilmiş bilgilere bakarak halkın yapısını ve ikili ilişkilerini, miras ve tereke kayıtlarına bakarak ekonomik yapıyı, merkezden gönderilen kararnamelere bakarak merkezi idare ile taşra arasındaki ilişkilerin muhtevasını öğrenebiliriz. Bu belgeler üzerinde daha fazla çalışılması ve bu çalışmaların kamuoyuna sunulması, Osmanlı toplumundaki bilinmeyen ya da eksik kalan konulara açıklık getirecektir. Defterde, Kütahya ve çevresinden mahkemeye intikal eden olayların her biri müsbet ya da menfi bir karar halinde sonuçlanmıştır. Sonuçlanan bu kararların bir kısmının altında“Şuhudu'l-hal”denilen ve o bölgenin ileri gelenleri arasından seçilen, aralarında önemli hukukçuların da yer aldığı şahitlerin olması bahsedilmesi gereken önemli bir konudur. Ayrıca cinayet ve hırsızlıkla ilgili kayıtların olmaması ya da çok az olması, halkın o dönemde bu konulardaki titizliğini göstermektedir."
