abstract: "Kurumsal Sosyal Sorumluluk kavramı son dönem işletmeciliğin ön plana çıkan kavramlarından biridir. Kavramın tanımı, kapsamı ve algısı yönünde çeşitli tartışmalar mevcuttur. Çalışmada KSS kavramına, İslami perspektiften bir çerçeve çizilmeye çalışılmaktadır. İslami perspektiften KSS tanımının, pratikteki durumunu görmek adına Türkiye'deki Katılım bankalarıyla görüşülmüştür. Bu çalışmada, Türkiye'deki Katılım bankaları örneklem kümesini oluşturmak üzere, yarı yapılandırılmış mülakat yönteminden yararlanılmıştır. Değerlendirme ölçütü olarak metnin içeriğinde bulunan başlıklardan faydalanılmıştır. Araştırmada, tanımlanan İslami perspektiften KSS kavramı ile Katılım bankalarıyla yapılan görüşmelerde ortaya çıkan KSS algısı arasında tam bir uyumun olmadığı görülmüştür."
