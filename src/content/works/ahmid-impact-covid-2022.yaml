abstract: "Dünya Sağlık Örgütü (WHO), 11 Mart 2020'de koronavirüsü (COVID-19) salgınını küresel bir pandemi olarak resmen sınıflandırdı. Teyit edilen vaka sayısı 27 Mart 2020 itibariyle 81 milyonu aştı ve artmaya devam ediyor (WHO, 2020). ABD'de teyit edilen vakaların çoğunluğu da dahil olmak üzere, etkilenen yaklaşık 220 ülke var. Salgının ekonomi üzerinde büyük bir etkisi olduğu açık. Birçok ülkenin ekonomik operasyonları, sıkı karantina düzenlemelerinin benimsenmesinin bir sonucu olarak kısa vadede ciddi şekilde kısıtlanıyor. Pandeminin uzun vadeli etkileri arasında yaygın hastalık ve ekonomik çöküş yer alabilir. Turizm ve havacılık gibi bazı sektörlerde kuşkusuz zorluklar olacaktır. Dünya ekonomisi üzerindeki kesin etkileri hala belirsiz olsa da, finansal piyasalar buna tepki olarak değişti. ABD borsasının devre kesici mekanizması Mart 2020'de on günde dört kez tetiklendi. İlk olarak Ocak 2020'de ortaya çıkan Covid-19 pandemisi, küresel olarak finans sektörü üzerinde önemli bir olumsuz etki yarattı. S&P Global Ratings, 1 Mart ile 7 Eylül 2020 arasında yaklaşık 335 banka ve banka dışı finansal işletmenin notunu düşürdü. S&P Global Ratings'e göre, birincil bankacılık sektörleri 2023 veya daha sonrasına kadar Covid-19 öncesi seviyelerine toparlanmayacak ( Gunning ve diğerleri, 2020). İslami finansal hizmetler piyasası, özellikle etik ve sosyal yatırımların daha fazla sistem geliştirici araç olarak önemini vurgulayan ipotek finansal krizinden sonra tüm ülkelerde hızlı bir büyümeye ve artan ilgiye tanık oluyor. İslami finans, 1960'larda Müslüman ülkelerde dine olan ilginin yeniden canlanması ve petrodolar Körfezi'nde döviz fazlalarının birikmesi sayesinde ortaya çıktı, ardından göçün yanı sıra artan aciliyet ve etik temelli bir sisteme duyulan ihtiyaç nedeniyle hızla uluslararasılaştı. Meşru iş kavramının artan gelişimi ve Müslümanların işlerini dini inançlarıyla uyumlu bir şekilde yürütme konusundaki farkındalıkları ile birlikte, Şeriat kurallarını uygulayan ve bunlara saygı duyan şirketlere veya borsalara yatırım yapma eğilimindedirler. Ayrıca, İslami varlıklar riskten kaçınan yatırımcılar için güvenli bir liman haline geldiğinden, İslami varlıklara yatırım yapmak için artık dini inançlar tek neden değildir. Mortgage krizi çok fazla mürekkep döktü ve İslami finansal varlıkların kriz karşısında dayanıklılığı konusu daha sonra göstereceğimiz gibi birçok çalışmada öne çıktı. İslami finansı reel ve finansal yönüyle ilişkilendirmek, onun sağlamlığını sağlayan derin köklere sahip olmasını sağladı, hatta birçok kurum için finansal başarısızlık zincirlerinden bulaşma dalgasını bozdu. Örneğin, Abdul-Rahman ve Gholami (2020), ekonominin ve işletmelerin COVID-19 ekonomik krizinden toparlanmasına yardımcı olmak için Kar-Zarar Paylaşım Sözleşmesini (PLSC) bir finansman aracı olarak kullanarak İslami finansın güzelliğini ortaya çıkardı. Buna ek olarak, Covid-19 salgını başladıktan sonra Bella (2020), İslami bir eşler arası kredi (P2P) ağı aracılığıyla MSE finansmanını birkaç şirket kategorisine ayırarak yeni bir plan oluşturmaya çalıştı. Bu, işletmelerin nakit elde etmesini kolaylaştıracaktır. Ayrıca, Sikiru ve Salisu (2020). Asya-Pasifik İslami borsasının pandemi ve salgın hastalıkların (UPE) getirdiği riske karşı yararlı bir korunma olup olmayacağını düşünün. UPE için yeni bir veri kümesine güvenerek, ancak COVID-19 salgını sırasında koruma etkinliğini azaltarak Asya-Pasifik İslami hisse senetlerinin UPE'ye karşı korunma kapasitesini destekleyen kanıtlar keşfederler. Ek olarak, veriler, UPE tahmin edicisinin uygulanmasının, hisse senedi getirilerinin örnek dışı tahminlerini iyileştirdiğini göstermektedir. Ayrıca, Gwadabe ve Ab Rahman, (2020), COVID 19 pandemisinin ekonomik etkisinin üstesinden gelmek için vakıf temelli ekonomik refah, sosyal güçlendirme ve gençlerin güçlendirilmesinde modern dünyada İslami finansın olası rollerini araştırdı. Şeriat'ın temel amaçlarından biri olan insanların acı çekmesi ve hayatların korunması. gençleri güçlendirmede vakfın potansiyeli. Çalışmanın bulguları, vakfın, küçük ve orta ölçekli işletmeleri finanse ederek Kano Halkına gençleri güçlendirme ve ekonomik güvenlik sağlayabilen bir tür hayırsever İslami güçlendirme olduğunu gösterdi. Çalışma, finansal istikrarın sağlanması ve Maqasid Şeriat'ın uygulanması için COVID 19 döneminde ve sonrasında ekonomik engellerin üstesinden gelmek için vakfın kullanılabileceği sonucuna varmıştır. COVID-19'da zekatın rolünü incelemek. Raza Rabbani ve diğerleri (2021). Mevcut çalışma, İslami finansın, salgından etkilenen ülkelere pandemi ile ilgili ekonomik krizde başarılı bir şekilde gezinmelerine yardımcı olmak için potansiyel bir strateji olarak kullanılmasını önermektedir. Bu çalışma, pandeminin her aşaması için on modern İslami finans hizmeti önerir ve dört aşamalı bir COVID-19 modeli belirtir. Ek olarak, pandeminin getirdiği mali zararı azaltmak için bu hizmetlerin çeşitli aşamalarda nasıl verimli bir şekilde kullanılabileceğini incelemektedir. Şeriat Uyumlu Paylar: Müslüman yatırımcının borsada işlem gören anonim şirketlerde hisse sahibi olmasını sağlayacak bir çözüm bulmak için, 1987 yılında bir bankacıdan Şeyh Muhammed el-Tayyib el-Najjar ve Pakistan'dan Muhammed Taki Usmani liderliğindeki bir grup bilim adamı, tarama kriterlerini belirledi. Takımın diğer üyeleri Türkiye'den Salih Tag ve Muhammad Taqi Usmani idi. İnternet balonu birçok genç Müslümanı, büyük getirilerden yararlanmak için ailelerinin servetini kullanarak borsada ticaret yapmaya çektikten sonra, 1990'larda hisse senedi gözetim fetvası başladı. Şeriat sınavı için en önemli standart 20 Mayıs 2004'te yayınlandı ve merkezi Bahreyn'de bulunan İslami Finansal Kurumlar için Uluslararası Muhasebe ve Denetim Kurumu için Şeriat Gösterge Standardı olarak biliniyor. Kural, faiz veya diğer yasadışı faaliyetlerle uğraşan işletmelere yatırım yapılmasına genellikle izin verilmediğini, ancak belirli koşullar altında bir muafiyet yapıp hisse senetlerine yatırım yapmanın mümkün olduğunu söyledi. • Tüm şeriat inceleme metodolojileri için ilk standart, alkol, domuz ürünleri, geleneksel finansal hizmetler (bankalar ve sigorta şirketleri gibi), eğlence (oteller, vb.) kumarhaneler, kumar vb.), tütün, silahlar ve savunma. Ana iş Şeriat'a uygunsa, bazı ikincil faaliyetler olmasa da inceleme, bu ikincil faaliyetlerin kabul edilebilir parametreler dahilinde olup olmadığına döner. • İkinci standart: nicel veya mali incelemeyi iki şekilde içerir: • İlk yaklaşım, şirketin ana varlıklarının çoğunlukla nakit veya nakit ile ilgili olmamasını sağlamaktır. Şirketin ana varlıkları nakit bazlı ise ve şirketin ana varlıkları borç şeklinde olmamalıdır. • İkinci strateji, işletmenin aşağıdaki gibi izin verilen limiti aşan faizle ilgili faaliyetlerde bulunmadığından emin olmaktır: • Faizli menkul kıymetlerdeki mevduattaki nakit, Şirket'in tüm özkaynaklarının piyasa değerinin yüzde otuzunu (%30) aşamaz. • Tefeci borcu şirketin piyasa değerinin %30'unu geçmemelidir. • Likit olmayan varlıkların toplam piyasa değeri, varlıkların toplam piyasa değerinin %30'unu geçmemelidir. Ayedh ve arkadaşlarına (2019) göre İslami sermaye piyasası, hisselerin Şeriat analizi ile desteklenmektedir. Hisseler için iyi bir standart oluşturmanın anahtarı, verimli ve uygulanabilir bir Şeriat değerlendirme tekniğine sahip olmaktır. Bu standarda göre hisselerin akıbeti Şeriata uygun olup olmadıklarına göre belirlenir. Şeriat uyumu ve risk alma. Analitik ve ampirik çalışmalar, İslami Şeriat ile uyumluluğun, sermaye piyasasında şirketler için makro ve mikro düzeyde riskleri azaltabilecek bir dizi önemli faydaya yol açabileceğini göstermektedir: • Yatırımcılar için çeşitlendirme olanaklarını geliştirerek likiditeyi artırmak ve bankaların dışında biriken tasarruflara dini inançlar nedeniyle erişimi kolaylaştırmak ve onları verimli yatırımlara yönlendirmek. Bu, piyasaların likiditesini iyileştirir ve yatırımcı tabanını genişletir, bu da risk paylaşımını artırır ve sermaye maliyetini düşürür. • Yönetimin bazı bilgilerin benzersiz olması ve kişisel çıkarlar için kullanılması sonucunda ortaya çıkan yönetim ve paydaşlar arasındaki bilgi asimetrisi, Şeriat'ın amaçlarına aykırıdır ve tüm bilgileri ifşa etmeye zorlar, İslami piyasaların ulaşabileceği şey budur. finansal teorinin en önemli hedefleri olan güçlü bir verimlilik düzeyi. Hearn ve diğerleri (2012). • Faiz ve aldatmayı yasaklayan, getirileri paylaşan ve finansal yatırımı gerçek yatırımla ilişkilendiren İslami finans ilkeleri, şirketin finansal piyasalardaki dalgalanmalarla yüzleşmesini sağlayan sağlam temelleri benimsemesine olanak tanır. Düşük borç ışığında, avukatlık ücretlerinden kaynaklanan vekalet maliyetleri ile ilişkili doğrudan finansal açık maliyetlerini ve sözleşmelerin ihlali maliyetlerini artırabilecek finansal kaldıraç ve bileşik faiz tahakkukları riski veya dolaylı olarak müşteri, tedarikçi kaybetme riski gibi riskler veya çalışanlar. • Borç miktarındaki kısıtlama, Şeriat uyumlu bir şirketin riskini azaltabilir, çünkü yüksek borç seviyeleri aslında şirketin işletme ödemelerini karşılama kabiliyetini sınırlar. Bu, Şeriata uyumlu şirketi, özellikle nakit ve sermaye harcamaları açısından daha rasyonel olmaya teşvik edebilir ve bu da, şirketi özellikle dışsal şoklara karşı daha dayanıklı kılan daha güçlü bir nakit rezervi yaratılmasına yol açar. maddi varlıklar. Bununla birlikte, borç miktarını sınırlamak, şirketi operasyonlarını ve yatırımlarını özkaynak ve nakit seviyelerinde daha fazla finanse etmeye zorlayabilir, bu da nakit rezervini azaltır ve daha az esnek hale getirir. Bu kısıtlamalar teşvik edebilir Ayrıca şirketin yatırımlarında daha dikkatli olması ve sadece şirkete en fazla değer katan projeleri seçmesi gerekir. Sonuç olarak, şirketin riski azaltılabilir. Şirketin çeşitli operasyonel yönleri arasındaki bu karmaşık ve önemli ilişkiler ilişkisi deneysel olarak incelenmemiştir. Cheong (2021). • Spekülatif işlerin ve yüksek riskli yatırımların yasaklanması, onu, gerçek faaliyetlerinden beklenen getirileri olan kabul edilebilir bir risk seviyesinde kılmaktadır, bu riskin gerçekleşme olasılığını belirlemek kolay olabilir, böylece önemli sapmalar olmaz Beklenen ve gerçekleşen getiriler arasında risk derecesini azaltır. Öte yandan, onu ek kazançlar elde etme fırsatından mahrum edebilir. • Nakit tutma üzerindeki kısıtlamalar, şirketlerin etkili yatırım kararları almalarına yardımcı olur, çünkü şirketlerin yöneticilerin kişisel kazanç için yatırım yapabilecekleri fazla parayı biriktirmelerini engeller, bu da yöneticiler daha az fırsatçı davranma eğiliminde oldukları için acente anlaşmazlıklarını azaltır. Üçüncü finansal oran, mevcut nakit miktarı ile ilgilidir. Şirkette, oran ne kadar düşükse, şirketin büyük sermaye harcamalarını finanse edemediğini ve daha fazla projeyi finanse edemediğini gösterir. Ancak, nakit fazlası olması durumunda yatırımcıların karları manipüle etmelerini kısıtlar. Şeriat uyumlu şirketi karakterize eden bu finansal oranların etkisi karışıktır. Ahmed ve Farooq (2018). • İslami finansman, acente maliyetlerini ve zayıf yatırımı azaltmak için uygun bir alternatiftir, bu da finansmanı bağışlayan bankalar için daha az riskli olan murabaha finansmanı başta olmak üzere finansal riski azaltır. Minhat ve Dzolkarnaini (2017). COVID-19'un durumu: Trajik bir şekilde, hepimiz artık COVID-19 pandemisinin sürekli yüksek ölüm oranının farkındayız. Hepimiz ayrıca krizin nihayetinde ekonomiyi nasıl etkileyeceği, özellikle de finansal piyasaları nasıl etkileyeceği konusunda endişeliyiz. Bu pandemi, bu tezin yazıldığı tarih itibariyle hala mevcuttur ve nihai felaketin ne kadar şiddetli olacağı belirsizdir. Bu nedenle tezimizin konusu“COVID 19 Döneminde İslami Hisse Senedi Piyasalarının Sorunları”dır. İslami finansman ilk olarak 50 yıl önce, finansal kaynaklarının Şeriat kanunlarına ve İslami ilkelere uygun olduğundan emin olmak isteyen büyük Müslüman nüfusa sahip ülkelerde ortaya çıktı. İşletme, tablo 2'de gösterildiği gibi, İslami finans sektöründeki toplam 2,88 trilyon ABD Doları tutarındaki varlıklarla 2019'daki küresel mali krizden bu yana kaydedilen en büyük artışını yaşadı. Gelecek parlak: Bunun 2024 yılına kadar 3,69 trilyon ABD Dolarına yükselmesi bekleniyor. Müslüman milletlerin sermaye susuzluğunu gidermek için şeriat finansmanına yönelmeleri, popülaritesine katkıda bulunan bir diğer faktör de şeriat finansmanının gayrimüslim ülkelerde de ilgi görmeye başlamasıdır. Moody's Investors Service ayrıca, (özellikle Körfez İşbirliği Konseyi (GCC) bölgesinde ekonomik toparlanma hızlandığından İslami finans 2022'de büyümeye devam edecek) dedi. Araştırmanın amacı: İslami finans sektörü sahada kendini empoze ediyor. Küresel ekonomik arenada büyük bir varlık elde etti. Bu endüstrinin sahip olduğu avantajlar ve İslami Şeriat hükümlerine ve standartlarına olan güveni nedeniyle. Bu başarılı sektörlerden biri de İslami endekslerin oluşturulmasıdır. Yatırımcının helale yönelik yatırımlarının yönünü belirlemesini kısıtlar. Bunun bir sonucu olarak, birçok İslami ve hatta uluslararası ülkede çeşitli İslami endeksler ortaya çıktı ve bunlar dünyanın diğer ülkelerinde hala inceleniyor. Bu endekslerin oluşturulmasındaki temel amaç, borsadaki bayi ve yatırımcılara, piyasanın imkan ve olanaklarından yararlanmalarını sağlayacak bilgileri sağlamaktır. Bu sektöre yatırım yaparken bağlı oldukları meşru vizyon doğrultusunda. Bu endeksler aynı zamanda mevcut alanları öne çıkararak İslami finans yatırımlarını piyasaya çekmeyi amaçlıyor. Ayrıca yabancı yatırımları İslam ekonomisinin avantajlarıyla tanıştırmayı amaçlıyor. Ve parayı doğru şekilde koruma ve geliştirmedeki rolü. Bu indeksler, yukarıda belirtildiği gibi belirli kriterlere bağlanmıştır. Bu, bu şirketin endekse başkaları olmadan girme koşullarını gösterir. Bu indeksler, bu standartlara dayalı olarak yayınlanmıştır. Sahiplerin borsalarda meşru bir yatırım şekli olarak gördüğü. Bu araştırmanın amacı, Covid-19 döneminde İslami hisse senedi endekslerini kapsamlı bir şekilde incelemek ve geleneksel hisse senedi endeksleriyle karşılaştırmaktır. Araştırmamız İslami ve konvansiyonel hisse senedi getiri endekslerinin COVID-19'dan nasıl etkilendiğini analiz etmeyi amaçlamaktadır. Başka bir deyişle, araştırma, COVID-19'un İslami ve konvansiyonel hisse senedi endekslerinin getirileri ve oynaklığı üzerindeki etkisini ARIMA-X ve EGARCH-X modellerini kullanarak analiz etmeye itiraz etti. Bu amaç doğrultusunda, finansal hisse senedi getirisini tahmin etmek için İslami ve geleneksel hisse senedi endeksleri kullanıldı ve COVID-19'un etkisini tahmin etmek için her ülkenin günlük vaka sayısı itibariyle kukla değişken kullanıldı. Maki (2012) toplam Covid-19 vakalarını günlük veri olarak kullanan eşbütünleşme testi ve diğer yazarlarla aynı COVID-19 yeni vakalarını kullandıkları Gao ve diğerleri (2022), Anh ve Gan (2020), Ashraf (2020), Khan ve diğerleri (2020), Ashraf (2021), Öztürk ve diğerleri (2020), Nguyen ve diğerleri (2021) ve Rabhi (2020). Çalışma, Covid-19 krizi öncesinde hem İslami hem de konvansiyonel hisse senedi endekslerinin belirsizliğini ve oynaklığını inceleyecek. İslami borsaları diğerleriyle karşılaştırmanın yanı sıra bu pandeminin onlar üzerindeki etkisi. Bu gibi durumlarda geleneksel sistem yerine İslami finans ve bankacılık çözüm mü? Bazı gazetelerde dedikleri gibi, İslami finans sistemi krizler sırasında güvenli bir limandır. Yukarıdakilere dayanarak, araştırma problemi aşağıdaki noktalarla sınırlandırılabilir: 1. İslami borsa endeksleri Covid-19 döneminde Konvansiyonel borsa endekslerinden daha fazla mı yoksa daha az mı etkilendi? 2. İslami hisse senedi piyasaları endekslerinin belirsizliği ve oynaklığı geleneksel borsa endekslerinden daha fazla mı yoksa daha az mı? Araştırmada İslami hisse senedi endeksleri alanında COVID-19'un etkisini analiz etmek için kullanılan İslami ve konvansiyonel hisse senedi endeksleri. İndekslerin günlük Logaritmik getirisi seçilmiştir. Buna ek olarak, 2 Aralık 2019'dan 22 Nisan 2022'ye kadar COVDI-19'dan önce başlayan veriler, bu nedenle fazla günleri verilerden çıkarmak için DÜŞEYARA işlevi kullanıldı. Veriler www.investing.com adresinden toplanmıştır. Endonezya, Malezya gibi 6 ülkeden 16 endeks seçilmiştir. Nijerya, Pakistan, Katar ve ABD'de 8 endeks şeriat uyumlu endeks iken, 8 konvansiyonel endeks seçilmiş ve her endeks için gözlem sayısı tablo 2'de gösterilmiştir. Endeksler her ülkede İslami endeksler açısından seçilmiştir. ve ayrıca geleneksel olandan en büyük indeksler. Finansal serilerin analizi söz konusu olduğunda, diğer finansal serilerle karşılaştırmaya izin vermek için logaritmik getiriler genellikle alınır. Ayrıca, finansal varlıkların fiyat serisi statik değildir, bu nedenle seriyi sabit kılmak için birinci farkı benimsemeye devam ediyoruz, bu da verilen modelin parametrelerini tahmin etmeye izin veriyor. Hudson ve Gregoriou (2015). Araştırma, ARIMA-X ve EGARCH-X modellerini kullanarak COVID-19'un İslami ve geleneksel hisse senedi endekslerinin getirileri ve oynaklığı üzerindeki etkisini analiz etmeyi hedefledi. Bu amaç doğrultusunda, finansal hisse senedi getirisini tahmin etmek için İslami ve geleneksel hisse senedi endeksleri kullanıldı ve COVID-19'un etkisini tahmin etmek için her ülkenin günlük vaka sayısı itibariyle kukla değişken kullanıldı. Maki (2012) toplam Covid-19 vakalarını günlük veri olarak kullanan eşbütünleşme testi ve Gao ve diğerleri (2022), Anh ve Gan (2020), Ashraf (2020) gibi vakayı kullandıkları diğer yazarlarla aynıdır. , Khan ve diğerleri (2020), Ashraf (2021), Öztürk ve diğerleri (2020), Nguyen ve diğerleri (2021) ve Rabhi (2020). Zaman serisi varsayımlarıyla uyumlu verilerin kullanılması, zaman serisi analizi yaparken dikkate alınması gereken en önemli faktördür. Normal dağılım ve seri sabitliği bu varsayımlardan ikisidir. Bu çalışmada Dickey ve Fuller (1981) tarafından önerilen ADF testleri ve Phillips ve Perron tarafından önerilen PP testleri birim kök testini (1988) incelemek için kullanılmıştır. İslami ve geleneksel end