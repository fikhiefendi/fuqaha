abstract: "T.CKAHRAMANMARAŞ SÜTÇÜ İMAM ÜNİVERSİTESİSOSYAL BİLİMLERİ ENSTİTÜSÜTARİH ANABİLİM DALIÖZETYÜKSEK LİSANS TEZİ259 NUMARALI ADIYAMAN KADI SİCİLİ H(1312)(1895)(190.SAYFALAR)CANAN YÖRÜRDANIŞMAN : Yrd.Doç. Dr. Faruk SÖYLEMEZYıl : 2006 , Sayfa: 167Jüri :Yrd.Doç. Dr. Faruk SÖYLEMEZDoç. Dr. Ahmet EYİCİLYrd. Doç. Dr. Lütfü ALICIOsmanlı tarihinin önemli kaynaklarından biri de Kadı Sicilleridir.Buaraştırmada 1895 -1896 tarihlerinde Adıyaman'ın sosyo- kültürel, idarû, ekonomik vehukukû yönleri incelenmiştir.Osmanlı hukuk tarihi alanında Kadı Sicilleri en önemli belgelerdir. Belgelerışığında Osmanlı hukukunun genel yapısı, Kadı Mahkemelerinin işleyişi, KadıSicillerinin tanımı, tarihi, Şer'iye Mahkemelerinde görevli memurlar, kadılarda arananşartlar ve Adıyaman'ın tarihi anlatılmıştır.Bu araştırmada 259 numaralı Hısn-ı Mansur Kadı Sicili'nin 1-90.sayfalarındaki44 belgenin transkripsiyonu ve özeti yapılmıştır. Belgelerin deftere kaydında kronolojiksıraya genel olarak uyulmamıştır. Belgelerin içeriğinde hırsızlık, mala el koyma, kötüsöz söyleme, darp, hakaret, izinsiz bahçeyi tahrip etme davaları yer almaktadır.Bu çalışmadaki 44 belgenin genel yapısı değerlendirildiğinde mahkemeye konuolan belgelerin çok ağır suç ve şikayetleri içermediği görülmektedir. Mahkemelerin kısasürede sonuçlanması ve mahkeme hükümlerinin ağır cezaları kapsamaması önemlidir."
