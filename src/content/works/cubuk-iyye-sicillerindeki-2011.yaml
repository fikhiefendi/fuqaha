abstract: "Ankara Milli Kütüphane, mikrofilm ünitesinde araştırmacılara sunulan, Osmanlı Döneminde ve Cumhuriyetin ilk dönemlerinde kadılar tarafından tutulan Şer'iyye Sicillerinin içindeki tereke kayıtlarında aileye özel birçok ham bilgiye ulaşmamızı sağlayacak veriler mevcuttur. Çalışmamızda ele aldığımız konu esas itibariyle kırsal kesim yani köy yaşantısı olmuştur. Bunu da Osmanlı idari sisteminin bir öğesi olan sancaklardaki kazaların çevre köy-kasaba gibi daha küçük yerleşim birimlerde kayda geçirilen köylü terekelerinden sağlamaktayız. Çalışmamızda ana kaynak 5 No'lu Uşak Şer'iyye Sicili olmuştur. XIX. Yüzyıl Osmanlı kırsal toplumunun sosyal, ekonomik ve o döneme ait demografik yapısını belgeler ışığında ortaya koymaktayız. İncelenen defterlerdeki tereke kayıtları Hicri 29 Şevval 1297(Miladi-4 Ocak 1880) ile 13 Rebi'ülahir 1300(21 Şubat 1883) tarihleri arasını kapsamaktadır. İncelediğimiz 130 tereke kaydına dayanarak, Uşak köylü toplumunun giyim-kuşam, ekonomik faaliyetleri ve demografik tahlili örneklem olarak ortaya konulmuştur.Şer'iyye sicilleri yazıldığı döneme ait sadık birer ham bilgi olduğunu varsayarsak, o döneme ait verilerden çıkarılacak yorumlar bize yerel tarihe dair bilgiler sunmaktadır. Amacımız bir nevi Uşak'ın mahalli tarihine ve yerel tarihçiliğe katkı sağlamaktır. Çalışmamız, Uşak Üniversitesi Rektörlüğü Projeleri Koordinasyon Birimi tarafından desteklenmiştir."
