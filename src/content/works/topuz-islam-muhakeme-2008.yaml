abstract: "İslam Hukukunun bir bölümünü oluşturan muhâkeme hukuku, şâhitlik, ikrar, yemin, kasâme, nükûl vb. ispat vasıtalarını konu edinir. İspat vasıtalarının en önemlilerinden biri şâhitliktir. Şâhitlik müessesesi, herhangi bir hakkı hâkim ve yargı önünde ispat etme, hakkın zâyî olmasını önleme ve adaleti ikame etme amacıyla ihdâs edilmiştir. Şâhitlik, asırlardır ispat vasıtası olarak kullanılmaya devam etmiş ve önemini günümüze kadar yitirmemiştir. Zira toplum hayatında bir çok hâdise meydana gelir ve bunlarla ilgili davalar ortaya çıkar. Bu davaların çözümünde şâhitlere ihtiyaç duyulur.Şâhit delilinin hukûkî dayanağı Kur'an-ı Kerim ve Sünnettir. Bir çok ayette ve hadiste, şehâdet ile davanın ispat edilebileceği, şâhitlik ederken adaletten ayrılınmaması ve şâhitlikten kaçınılmaması gerektiği ısrarla ifade edilmektedir.Şâhitlik, sorumluluk bilinci ile yerine getirilmesi gereken şerefli bir görev olduğundan, şâhitlik edecek kimsede âkil, bâliğ, âdil, görür, işitir, konuşur, Müslüman, mürüvvet sahibi olmak ve töhmet altında olmamak, dikkatsiz olmamak gibi bir takım şartlar aranır. Bu şartlar doğru hükmün verilip, adaletin ikame edilebilmesi için konulmuştur. Klasik kaynaklarımızda“kadâ”ve“şehâdet”bölümlerinde şâhitlikle ilgili meseleler ele alınmıştır.Biz bu çalışmamızda, İslam Hukukunda şâhitlik edecek kimsede bulunması gereken şartları inceledik ve Günümüz Türk Pozitif Hukuku ile bir karşılaştırma yaptık.Tezimize isim olarak“İslam Muhâkeme Hukukunda Şâhitte Aranan Şartlar”adını verdik. Bu bakımdan önceli olarak, İslam Muhâkeme Hukukuna göre şâhitlerde aranan şartları inceledik, ardından Günümüz Türkiye'sinde halen yürürlükte olan Ceza Muhâkemesi Kanunu, Hukuk Usulü Muhâkemeleri Kanunu, Türk Medeni Kanunu ve Türk Ceza Kanununu gibi kanunlarla bir karşılaştırma yaptık.Çalışmamızı“giriş”ten sonra iki bölüm halinde ve şu düzen üzerinde hazırladık.Şâhitlik, muhâkeme, ispat vb. konuyla ilgili kelimelerin açıklanması, genel olarak ispat vasıtaları, şâhitliğin önemi ve şehâdetin hukûkî dayanağı, hükmü, rüknü, şâhitlikte nisap gibi konuları içeren“giriş”ten sonra“birinci bölüm”de“Tahammül (Tanıklığı Üstlenme) Bakımından Şâhitte Aranan Şartlar”ı inceledik.“İkinci bölüm”de,“Edâ Açısından (Mahkemede Şâhitlik Yapabilmek İçin) Şâhitte Aranan Şartlar”ı ele aldık. Gerek tahammül gerekse edâ bakımından şâhitte aranan şartları farklı görüşlere işaret ederek inceleyip kendi kanaatimizi belirttikten sonra Günümüz Türk Pozitif Hukuku ile mukayese yaptık. Çalışmamızda elde ettiğimiz sonuçları da“sonuç”kısmında ifade ettik."
