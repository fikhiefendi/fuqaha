abstract: "Tezimiz fıkıh düşüncesinin en önemli konulardan olup modern çağda kendisine olan ihtiyaç daha da öne çıkan, Müslümanların toplumsal ve kişisel olarak fıkhî hükümleri hayatlarına uygularken hangi konulara öncelik vermeleri gerektiği hususunu belirleyen Öncelikler Fıkhı (Fıkhu'l-evleviyyât) konusuna Gazzâli'nin usul ve füru' açılarından yaklaşımını sunmayı amaçlamaktadır. Zira İslam`ın doğru anlaşılarak hayata geçirilmesi ve müslümanların yaşamakta olduğu pek çok problemin çözümü dini hükümler arasındaki dengeyi gözeterek İslami sorumluluklar arasındaki ehemmühim, öncelik-sonralık sırasını ve bu sıralamayı sağlıklı bir şekilde yapabilmek için gerekli ilkeleri isabetli bir şekilde tespit etmekten geçmektedir. Bu ilkelerin tespiti için Gazzâlî'nin ortaya koyduğu öncü ve özgün değerlendirmeler büyük önem arz etmektedir. Çalışmamızın giriş bölümünde Gâzzâlî'nin biyografisine ve Öncelikler Fıkhı (Fıkhu'l-evleviyyât) ile ilgili genel bilgilere yer verilmiş, Gazzâli'de Öncelikler Fıkhı düşüncesinin dayanakları ele alınmıştır. Birinci bölümde Gazzâlî'nin Öncelikler Fıkhı'na yaklaşımı fıkıh usulü açısından değerlendirilmiştir. İkinci bölüm ise, Gazzâlî'nin Öncelikler Fıkhı düşüncesini uyguladığı muhtelif fıkıh alanlarından örnekler içermektedir."
