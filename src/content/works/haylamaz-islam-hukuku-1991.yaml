abstract: "îslâm Hukukuna Göre Organ ve Doku Nakli konusunu dört ana bölüm halinde inceledik. Birinci bölümde din ve tıbbın arasındaki münasebetler ele alınarak, aralarındaki muta bakatı ve bunun neticesi olarak da din âlimlerinin mesele üzerinde hassasiyetle durmalarını misalleriyle göstermeye çalıştık. İslâm'ın insan sağlığına verdiği önemi anlatırken de be den yanında ruh sağlığının da ihmal edilmediğine değindik. İkinci bölümde organ ve doku nakli ile ilgili temel bilgiler ele alınarak, meselenin tıp literatüründeki yerini izahın yanında, konu incelenirken bilinmesinde fayda görülen İslâmî terimlerden bazılarını anlatmaya çalıştık. Yine bu bölümde naklin, organ ve dokulara göre tarihî gelişimini anlatmanın yanında, insan bedenine müdahale konusunu da ele aldık. Üçüncü bölümde ise, organ ve doku naklinin getirdiği fayda yanında, ortaya koymuş olduğu problemleri“Fayda-Zarar Açısından Organ ve Doku Nakli”başlığı altında incele meye çalıştık. Öncelikle naklin sağladığı faydalar ve geleceği üzerinde durduktan ve trans plantasyonla ilgili yeni gelişmelerden bahsettikten sonra, nakille birlikte gelen problemlere değindik.“Organ ve Doku Naklinin Komplikasyonları”başlığı altında da, naklin getirdiği ruhî ve dinî, problemleri ele alarak naklin, vericiyle ilgili çözülmesi gerekli müşküllerini izaha çalıştık. Bunun yanında naklin kötü maksatla kullanılabileceğine de dikkat çekerek, meseleye biraz da canlılık getirmesi bakımından nakil yaptıran hastalarla yaptığımız anketin değerlendirmesini takdim ettik. Dördüncü bölümde ise, konunun belkemiğini teşkil eden“Hukuk Açısından Organ ve Doku Nakli”konusu ele alındı. Bu noktada mevzuyu iki ana başlık altında tasnif ederek“Beşerî Hukuka Göre Organ ve Doku Nakli”ve“İslâm Hukukuna Göre Organ ve Doku Nakli”şeklinde inceledik. Birinci ana başlık altında, beşerî hukukun konu ile ortaya koy muş olduğu kanun, tüzük ve yönetmelikleri aktarmakla iktifa ettik. İkinci ana başlık altın da da meselenin fetva yönü cevaz noktasından ele alınırken, vericiye bakan tarafları, ölü den organ alınması, sun'î organ konularına da değindik. Muamele açısından konu ele alınırken de, organ ticareti, bağışı ve organ bankalarının dini mahiyetini ortaya koymaya çalıştık. Konunun açıklığa kavuşmasında büyük rolü olan“Beyin ve Kalp Ölümü”ele alınırken, ölüm hakkında bilgi vermenin yanında, kalp ve beyin ölümü fikrinin doğuşu ve bugünkü durumunu izah etmeye gayret gösterdik. Kalp ve beyin ölümünün belirti ve mahiyetini izahdan sonra“sun'î solunuma son verilmesi”konusuna da değindik. Son olarak da, nakille ilgili yazılmış müstakil eser, tez, makale, fetva ve kararlarla ilgili ulaşabildiğimiz kadarıyla bilgi vermeyi uygun bulduk."
