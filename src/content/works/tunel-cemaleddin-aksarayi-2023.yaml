abstract: "Cemâleddin Aksarâyî (ö. 791/1388-89) XIV. yüzyılda yaşamış alimlerden biridir. Soyu Fahreddin Râzî'ye (ö. 606/1210) dayanan Cemâleddin Aksarâyî Râzî ekolünün Anadolu'ya yayılmasında etkili olmuştur. Talebelerinden Molla Fenârî de hocasından aldığı ilimle Anadolu'da yeni bir sistemin oluşmasına katkı sağlamıştır. Cemâleddin Aksarâyî Aksaray'da yaşamış ve ilmi faaliyetlerini burada devam ettirmiştir. Belli bir dönem de Amasya'ya gitmiş ve orada kalmıştır. Tefsir, fıkıh, hadis, ahlak, tıp ve edebiyat alanında birçok eseri bulunan Cemâleddin Aksarâyî'nin hakkında daha çok menkıbelere yer verilir. Bu menkıbeler onun ilmi kişiliğini gölgede bırakmıştır. Aksarâyî'nin Hâşiye alâ Şerhi Mecmâ'i'l-bahreyn adlı eseri İbnü's-Sââtî'nin (ö. 694/1295) Şerhi Mecmâ'i'l-bahreyn adlı eserindeki bir takım kapalı kalan kısımları izah etmek, eksiklikleri gidermek ve o dönemdeki alimlerin dikkatini bu eser üzerine çekmek için yazıldığı ifade edilmektedir. Klasik fıkıh metinlerinin sistemiyle telif edilen eser hadislerden hareketle Hanefi mezhebi tenkidi yaptığından ve genel olarak Şafiî ekolünün Hanefî ekolüne itirazlarını ele aldığından bir nevi ekoller arası reddiye olarak kabul edilebilir. Kâle-ekûlü tarzında tertip edilen eserde itirazlar temellendirilirken ayet, hadis, kavâid-i külliye, usul ve aklî çıkarımlara başvurulmuştur. Ayrıca Aksarâyî itirazlarını temellendirirken ve naslardan hüküm çıkarırken hüküm çıkarma yöntemlerinin birçoğunu ustalıkla kullanarak itirazlarını temellendirme yoluna gitmiştir. Bu da Aksarâyî'nin alanına son derece hâkim olduğunu göstermiştir. Cemâleddin Aksarâyî'nin“Hâşiye alâ Şerhi Mecmâ'i'l-bahreyn”adlı eserinin ilmi hilaf bağlamında değerlendirilmesi amacıyla; İbadet bölümünde başın meshedilmesi, teyemmümün hangi cisimlerle alınabileceği, namazların cemedilmesi ve müellefe-i kulübe zekat verilmesi konuları, muamelat bölümünde bey'u'l-îne'nin hükmü, icâre akdinin üzerine bina edileceği me'cur, vakfın lazım veya gayri lazım bir akit olması, nikahta veli izni ve gasp edilen malın tazmini konuları, ukûbat bölümünde öldürülen kişinin diyetinin miktarı, kadınların şahitliği ve hazr ve ibaha başlığı altında satranç oynamanın hükmü konuları ele alınmıştır. Bu örneklerin seçilmesinin sebebi bu meseleleri hilaf ilmi bağlamında değerlendirirken ve bu konularda eleştirilerini ortaya koyarken Aksarâyî'nin ilmî birikiminin açıkça görülmesidir."
