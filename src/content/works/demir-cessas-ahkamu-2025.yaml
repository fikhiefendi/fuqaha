abstract: "Cessâs'ın“Ahkâmü'l-Kur'ân”Adlı Eserinde Aile Hukukuyla İlgili Şâfiî'ye Nispet Ettiği Görüşlerin Tahkiki adlı bu çalışmada Hanefî müçtehitlerinden Cessâs'ın Ahkâmü'l-Kur'ân adlı eserinde Şâfiî'ye nispet edilen görüşlerin doğruluğunun araştırılması amaçlanmıştır. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş kısmında tezin önemi, amacı ve çalışma yapılırken kullanılan yöntem ile araştırmada yararlanılan kaynaklardan söz edilmiştir. Birinci bölümde Cessâs'ın yaşadığı dönemin özellikleri, mezhepteki konumu, i'tizâlî eğilimi, hocaları, öğrencileri, eserleri ve Ahkâmü'l-Kur'ân adlı eserin İslam ilim geleneğindeki önemine değinilmiştir. İkinci bölümde ise aile hukukuyla ilgili Şâfiî'ye atfedilen görüşlerin doğruluğu, Şâfiî mezhebi kaynaklarına başvurularak tahkik edilmeye çalışılmıştır. Sonuç bölümünde ise elde edilen kanaat ve yorumlar okuyucuyla paylaşılmıştır."
