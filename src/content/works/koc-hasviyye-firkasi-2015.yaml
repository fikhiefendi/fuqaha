abstract: "Haşviyye, İslam tarihinin ilk zamanlarında var olan oluşumlardan biridir. Hicri II. asrın ikinci çeyreğinde ortaya çıkmış olan Haşviyye kavramı bugün herhangi bir oluşum için kullanılmamaktadır. Haşviyye, tam anlamıyla mezhep hüviyetine sahip olmadığı için bir zihniyet biçimidir. Haşviyye kavramı muhaliflerince ashab-ı hadis zihniyetinin içindeki aşırı kesim için kullanılmıştır. Haşviyye zihniyeti aynı zamanda Hanbeli mezhebi ile de yakın bir ilişki içerisindedir. Nakil-akıl çekişmesinin bir tezahürü niteliğindeki Haşviyye muhalifleri tarafından birçok kavram ile adlandırılmıştır.“Nâbite”,“Nâsıbe”ve“Şükkak”bu kavramlardan sadece birkaçıdır. İslam coğrafyasında özellikle Mu'tezile ve Maturidiler Haşviyye düşüncesinin karşısında yer almıştır. Aynı zamanda başta Hz. Osman ve Hz. Ali konusundaki yaklaşımları nedeniyle Şia da Haşviyye düşüncesini eleştirmekten uzak kalmamıştır. Haşviyye zihniyetinin, en temel özelliği rivayete dayalı bir yaklaşım şekli olmasıdır. Bütün rivayetler, arkasındaki anlam dikkate alınmadan; zahiri bir şekilde değerlendirilmektedir. Rivayetler üzerinde hiçbir şeklide tevil söz konusu değildir. Bu nedenle teşbih ve tecsim düşüncesine sahip oldukları yönünde büyük eleştirilere maruz kalmışlardır."
