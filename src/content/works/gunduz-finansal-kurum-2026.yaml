abstract: "Katılım bankacılığı; faizsizlik prensibiyle çalışan, yatırımları gerçek üretim süreçlerine kanalize eden ve kâr-zarar paylaşımı esasına dayanan dinamik bir finans modelidir. Etik değerleri ve somut varlıklara dayalı işlem yapısını merkezine alan bu sistem, Türkiye finans piyasasında sadece bankacılıkla sınırlı kalmamış; sukuk (kira sertifikası), katılım sigortacılığı ve KOBİ destekleri gibi geniş bir yelpazede stratejik bir dönüşüm başlatmıştır Geleneksel mevduat bankacılığına güçlü bir alternatif sunan katılım bankaları, Türkiye'de hızla gelişen bir finans dalı haline gelmiştir. Katılım bankaları, 2005'ten itibaren kriz süreçlerini başarıyla yöneterek karlılık istikrarını korumuştur. On yıl öncesine ait verilere bakıldığında bankacılık sistemindeki payı %5 dolaylarında seyretse de ulaşılan müşteri kitlesinin genişliği, katılım finansın sektördeki stratejik önemini pekiştirmiştir. Tez çalışmamda, Türkiye'de Katılım Bankacılık sisteminin İslami finans ilkeleri doğrultusunda yapısal bir analizini çalıştım. Katılım bankacılığının finans sektöründeki yerini daha iyi anlamak ve geleceğe yönelik adımlar atmak isteyen tüm ilgililere yol gösterici olacaktır. Katılım bankalarının kurum yapısı, ürün ve hizmet yaklaşımları, piyasa yoğunlaşması, Merkez Bankası ile olan ilişkisi, Türev piyasa araçlarında çalışma koşulları, KOBİ finansmanındaki rolü ve sigortacılık sistemi gibi boyutlar incelenecektir. Materyal olarak 2014–2024 dönemine ait katılım bankacılığı verileri (aktif büyüklük, fon toplama, fon kullandırma vb.) kullanılacaktır. Sonuç olarak, Türkiye'deki katılım bankacılığı, finansal teknikler ile fıkhi derinliğin aynı paydada buluşamaması ve danışma kurullarının banka yönetimlerine olan yapısal bağımlılığı nedeniyle çeşitli uygulama sorunları yaşamaktadır. Sektörün konvansiyonel bankalarla rekabet etme gayesiyle kâr odaklı hareket etmesi, bazen İslami ilkelerin esnetilmesine ve“faize bulaşma”riskine yol açmaktadır. Ayrıca, merkez bankalarının faiz temelli para politikaları, bu kurumlar için“ikili (dual) bir finansal sistem”ve özel likidite araçlarının geliştirilmesini zorunlu kılmaktadır. Sistemin sürdürülebilir bir büyüme yakalaması için mevzuat uyumunun yanı sıra hem iktisat hem de fıkıh bilgisine sahip nitelikli insan kaynağının yetiştirilmesi ve toplum nezdindeki“geleneksel bankalarla aynı”algısını kıracak bütüncül reformların hayata geçirilmesi temel bir gerekliliktir."
