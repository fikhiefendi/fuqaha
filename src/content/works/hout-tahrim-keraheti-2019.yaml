abstract: "Bu araştırma, temellendirme yönüyle usûl'ü-l-fıkıh kitaplarına, uygulama yönüyle de fıkıh kitaplarına dayanan iki ana eksenli bir çalışmadır. Usûl'ü-l-fıkıh kitaplarına dayanan temellendirme eksenli kısmında; usûlcülerin teklifî hükümler arasında inceledikleri haram ile mekrûh arasındaki farkın nelerden ibaret olduğunu, bu kavramların birbirinin yerine kullanılıp kullanılmadıklarını, her iki kavramı ifade eden ilmî terimlerin hangileri olduğunu ve bu iki kavrama dayalı olarak belirlenen sınırların boyutunu inceleyeceğiz. Fıkıh kitaplarına dayanan kısmında ise usûl açısından yapılan araştırmanın uygulaması yapılarak dört fıkıh mezhebinde zikredilen ve haram ile mekrûh terimlerini barındıran bazı örneklere yer vereceğiz. Çalışmanın amacı, yukarıda dile getirilen problemlere çözüm getirmekle beraber, haram ile mekrûhu birbirinden ayıran ana temelleri ve fıkıhçıların bu kaideleri ne oranda uyguladıklarını açığa kavuşturmaktır. Bu amaca ulaşabilmek için birçok yöntem kullandım ancak, bunlardan en belirgin olanı Hanefî ve Mütekellim II usûlcülerin usûldeki yöntemini ve dört fıkıh mezhebinin fıkıhtaki yöntemini“karşılaştırmalı yöntem”ile ele almamdır. Çalışmanın vardığı en önemli sonuçlardan bazıları şunlardır; gerek harama yakın, gerekse helale yakın olan türleriyle mekrûh için iki farklı terim kullanılmakta olup bu kavramların dayandığı ana ilkelere, özellikle Hanefiler tarafından tam olarak uyulmamaktadır. Aynı zamanda bu araştırma, haram ve mekrûhun birbirinden ayırt edilmesi için esas alınan önemli birçok prensibi ortaya çıkarmaktadır ki bunlar sayesinde İslam şeriatının temel maksatlarından olan ahlakın, âdâbın ve ibadetlerin en mükemmel şekilde korunması ve fıkhî meselelerin mezhep usûlü ile nasıl bir bağlantı içerisinde olduğu tespit edilmektedir."
