abstract: "Dirayet tefsirinin en önemli temsilcilerinden biri olarak kabul edilen, aynı zamanda Mutezilî tefsir ekolüne mensup olan Zemahşerî (ö. 538/1143)'nin \"el-Keşşâf an Hakâiki't-Tenzîl ve Uyûni'l-Akâvil fî vücûhi't-Te'vîl\" adlı tefsir kitabı hakkında çoğunluk tefsir olmak üzere, kelam, arap dili ve belâgatı, hadis ve tasavvuf alanlarında hem Türkiye'de hem Batı'da gerek kitap olarak gerek tez, gerekse de makale olarak birçok çalışma mevcuttur. Dolayısıyla birçok araştırmacının inceleme alanına giren Keşşaf tefsiri, İslam Hukuku alanında özellikle de ahkâm ayetleri bağlamında hak eden ilgiyi görmemiş olmasından hareketle eser hakkındaki bu açığı kapatmak adına böyle bir çalışma yapılması düşünülmüştür. İslam Hukuku'nun birincil kaynağı olan Kur'an'ın amelî hükümlerini içeren ayetlerin ihtiva ettiği ahkâmın doğru bir şekilde anlaşılma çabasının bir ürünü olarak ahkâm tefsir faaliyetleri doğmuştur. Böylece Kur'an'daki ahkâm ayetlerinin yeteri derecede anlaşılması hususu, Hz. Peygamber'den bu yana her dönem güncelliğini koruyan en önemli bir mesele olmuştur. Çünkü problemler sınırsız ancak ahkâm içeren ayetler ise sınırlıdır. Kur'an ise Arapça olarak indirilmiştir, bundan dolayıdır ki ahkâmın anlaşılmasında birinci planda yer alan en önemli husus Arapçaya olan vakifiyettir. Nitekim dirayet yönü ağır basan yani naklin yanında akılcılığı ile ön plana çıkan Zemahşerî'nin Arap Dili ve Belâgatinde zirve isim olması bu konuda araştırma yapmaya iten en önemli gerekçe olmuştur. Şüphesiz, Fıkıhta Hanefî mezhebine mensup olan Zemahşerî Keşşaf tefsirinde, ahkâm ayetlerini tefsir ederken mezhep taassubiyeti göstermeyerek farklı mezheplerin görüşlerine de yer vermiş ve böylece eserinde fakîhlik yönünü de ortaya koymuştur. Ahkâm ayetleri hakkında birçok tefsir mevcut olmakla birlikte Meâni ve Beyân ilimlerinde şöhret olan Zemahşerî'nin Keşşaf tefsiri, ahkâm ayetlerinin anlaşılması ve belirlenmesi hususunda önemli bir katkı yapacağı bir gerçektir. Anahtar Kelimeler: Zemahşerî, Keşşâf, İslam Hukuku, Ahkâm Ayetleri, Dirayet Tefsiri, Mutezile Tefsir Ekolü."
