abstract: "Muhtasar fıkıh metinleri tüm mezheplerde olduğu gibi Hanefî mezhebi fıkıh tedrisinde de önemli bir yere sahiptirler. Mezheb imamlarından tevarüs edilen zengin ve geniş ?mezheb birikiminin? kısa ve öz olarak tek bir metinde toplanmış olması sebebiyle tedris faaliyetlerinde tercih sebebi olan muhtasarlar, belli bir dönem sonra ?mezheb birikiminin? sonraki nesillere aktarılmasında birinci el kaynaklar haline gelmişlerdir. Bu tezde Hanefî mezhebinde ilk muhtasar müelliflerinden biri olan Irak Hanefî fukahasının merkezî şahsiyeti Kerhî?ye ait Muhtasar isimli eser incelenmiştir. Eserin Hanefi muhtasar geleneği içindeki yeri ve önemini tespit amacıyla söz konusu eser ile yine aynı bölgeden Kerhî?nin üçüncü kuşak talebeleri içinde yer alan Kudûrî?nin Muhtasar?ı şekil ve muhteva açısından icâre bölümü üzerinden karşılaştırılmıştır. Yapılan karşılaştırılma sonucunda Kudûrî?nin -klasik dönem muhtasarları üzerinde etkili olan- Muhtasar?ını telif ederken Kerhî?nin Muhtasar?ından istifade ettiği, böylece Kerhî?nin, Hanefî mezhebi muhtasar geleneğinin oluşumunda Kudûrî üzerinden dolaylı bir etkiye ve bu gelenek içinde önemli bir yere sahip olduğu neticesine varılmıştır."
