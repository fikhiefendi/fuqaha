abstract: "Hanefîlerin hadis ilmiyle olan irtibatları hadis tarihinin önemli konularından biridir. Memlükler döneminde Hanefîlerin hadisle ilgili çalışmalarının ivme kazandığı görülmektedir. Memlük Kahire'sinde yaşamış olan Hanefîler yazdıkları hadis tahrîci, hadis şerhi, cerh-tadil, hadis usulü gibi eserlerle hadis ilmine katkıda bulunmuşlar, mezhebe ve mezhep büyüklerine hadis merkezli yöneltilen eleştirilere cevap vermişlerdir. Bu çalışmada Hanefîliğin Memlük Kahire'sinde yaygınlaşma sebepleri, Kahireli Hanefîlerin çevreyle münasebetleri, mansıpları, ilim mekânları, rihleleri, önde gelen aileleri ele alınmış, bazı kriterler belirlenerek hadisçi vasıfları üzerinde durulmuştur. Ayrıca Hanefî alimlerin hadis telif ve tedris faaliyetleri, hadis merkezli tartışmaları tespit edilmiş, hadis ilmiyle irtibatları farklı açılardan mukayese edilmiştir."
