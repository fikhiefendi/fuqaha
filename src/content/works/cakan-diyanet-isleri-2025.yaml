title: "Diyanet İşleri Başkanlığı Din İşleri Yüksek Kurulu'nun Kadın ile İlgili Verdiği Fetvaların Fıkıh ve Değişim Olgusu Bağlamında Değerlendirilmesi (1965-2023 Yılları Kapsamında)"
titleTranslation: {"en": "Evaluation of the fatwas issued by the High Council of Religious Affairs of the Presidency of Religious Affairs on women within the context of fiqh and the fact of change (Within the scope of the years 1965-2023)"}
