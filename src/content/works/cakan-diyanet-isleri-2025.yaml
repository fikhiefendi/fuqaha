abstract: "Diyanet İşleri Başkanlığı'nın en yüksek karar ve danışma organı olan Din İşleri Yüksek Kurulu, oluşturulduğu andan itibaren mezhep veya farklı dinî anlayış ve uygulamalar hakkındaki yaklaşım tarzı, verdiği kararlar ve fiilî tavrı itibarıyla dinî konularda çok önemli bir konuma sahiptir. Kurul'un çalışma esas ve usullerinde, dinî konularda vereceği karar, bildireceği görüş ve önerilerde İslâm dininin temel bilgi kaynaklarını ve metodolojisini, tarihî tecrübesini, güncel talep ve ihtiyaçları dikkate alması son derece önemlidir. Yapılan anket ve araştırmalarda toplumun %80,9'u Başkanlığın din ile ilgili yapmış olduğu açıklamalara, %76'sı da Diyanet yetkilileri tarafından verilen fetvalara güvendiğini ifade etmiştir. Kurul, fetvaları yayınlarken Kur'ân ve Sünnet'in anlaşılıp yorumlanmasında tarihsel süreçte ortaya çıkmış görüş farklılıklarından ve bu tarihî-kültürel birikimlerle oluşmuş farklı mezheplerin görüşlerinden yararlanmaktadır. Kurul üyeleri tarafından konu, tahric metoduyla ele alınıp benzer meseleler incelenerek mezhep imamları veya sonraki fakihler tarafından hükme bağlanan o görüşlerden hareketle güncel meselenin hükmüne ulaşılmaya çalışılmaktadır. Geleneksel fıkıh mirasımızda cevabı bulunmayan yeni meselelerde ise, Fıkıh Usulü ilkeleri daima devrede tutulmak suretiyle konu tahlil edilmekte, uzmanlarla istişâreler yapılmakta, sonuca ulaşıldığından emin oluncaya kadar karar, mütalaa, fetva ve görüşler oluşturulup beyan edilmektedir. Bu anlamda Din İşleri Yüksek Kurulu'nun kararları, doğrudan belli bir mezhebin değil Din İşleri Yüksek Kurulu'nun kendi görüşlerini yansıtmaktadır. Özellikle son yüzyılda kadına karşı bakış açısının değişmesi, birçok alanda kadın istihdamının artması ve kadının geçmişe oranla daha çok sosyal hayata katılımı bir gerçektir. Bu gerçeklik kadınların karşılaştığı fıkhi problemlere çözüm üretilmesi zorunluluğunu da beraberinde getirmiştir. Bunun bir sonucu olarak günümüz kadın algısını, kadınlarla ilgili karşılaşılan fıkhi problemleri, bunlara nasıl çözüm üretildiğini ve bu çözümler de ahkâmın değişmesine yönelik faktörlerin hangisinin daha etkin ve daha kullanılabilir olduğunu, hükümlerdeki maslahatın ne derece uygulanabildiğini tespit ve analiz etmek üzere Başkanlığın resmi fetva kurulu değerlendirmeleri bir araya toplanmıştır. Çalışmamız, Din İşleri Yüksek Kurulu tarafından kadının bireysel ibâdet ve aile hayatı ile ilgili olduğu kadar, eğitimi, çalışması, seyahat etmesi gibi kamusal alanda var olmasını da kapsamakta, 1965 yılından günümüze kadar çeşitli sebeplerle gösterdiği değişikliklerin tespit edilmesini amaçlamaktadır. Meselâ klâsik fetva kitaplarında el, ayak gibi organlarının belirmiş olması şartı ile düşük yapan bir kadının lohusa sayıldığı ifade edilmiştir. Din İşleri Yüksek Kurulu ise düşük yapan bir kadının lohusa olup olmadığının tespit edilmesini öngören hükmü, günümüz tıp ilminin teşhisine bırakmış ve tıbbın verilerine göre organları belli olsun olmasın düşenin cenin olduğu bilindiği için düşükten sonra görülen kan da lohusalık kanı (nifas) kabul edilmiştir. Diğer yandan, kadının toplumun her alanında var olmasıyla birlikte, Diyanet İşleri Başkanlığı teşkilâtında kadın yapılanması da önemli bir gerçeklik olarak karşımıza çıkar. Değişen toplumsal yapı göz önünde bulundurulduğunda din hizmeti gibi özel bir alanda kadınların da yer alması bir ihtiyaç ve zorunluluk haline gelmiştir. Bu bağlamda Diyanet İşleri Başkanlığı bünyesinde farklı kademelerde çalışan kadın personel de istatistiksel verilere bağlı olarak araştırmamızın konusu olacaktır. 2000'li yıllardan itibaren Diyanet İşleri Başkanlığı'ndaki kadın personel sayısının artışı, farklı daire ve müdürlüklerden hatta Diyanet İşleri Başkan yardımcılığına kadar kadın personel atamalarının yapılmış olması bu ihtiyacın bir göstergesidir. Yine 2007 yılında çıkarılan bir genelgeyle, kadınların camiye daha rahat ve daha güzel imkânlarla gelebilmelerinin sağlanması için camilerde kadınlarla ilgili mekânlarda gerekli düzenlemelerin yapılması Diyanet İşleri Başkanlığı'nda kadına karşı bakış açısındaki değişimi gözler önüne sermektedir. Ayrıca Başkanlığa bağlı Din İşleri Yüksek Kurulu'nun din alanında resmi ve ilmi anlamda söz sahibi olması hasebiyle Kurul'un görüşleri ayrıca önem arz etmektedir. Kurul'daki kadın sayısının tespitine ilaveten Kurul kararlarındaki etkisi de araştırılması gereken diğer bir konudur. Çünkü fıtrat ve yaşantı bakımından kadın üyelerin, diğer kadınları anlaması ve problemlere çözüm bulması daha kolaydır. Toplumun diğer kesimini oluşturan kadınların, bireysel ve sosyal anlamda karşılaştıkları dinî soru ve sorunların cevaplanması konusunda Kurul'un zikredilen yıllar arasında verdiği fetvalar aracılığıyla fıkıh ve sosyal değişim arasındaki bağ ele alınmak suretiyle Türkiye'de resmi bir kurum olarak Diyanet İşleri Başkanlığı'nın sergilediği tavır ve buna yönelik olarak yaptığı çalışmalar ortaya koyulmaya çalışılacaktır. Bu çalışma da aynı zamanda Diyanet İşleri Başkanlığı'nın kadın yapılanmasına verdiği önem ve hassasiyetin bir işareti olması bakımından, teşkilâtın kadın konusundaki zihniyet değişimi de yıllara göre değerlendirilecektir. Ayrıca günümüzde kadınlarla ilgili birçok dinî meselenin açıklığa kavuşmasında Başkanlığın kadınlarla ilgili meselelere kadınsal yaklaşımı ve çözümlemeleri, zamanın ve sosyal değişimin etkisi ile kadınlar hakkında verilen fetvalardaki olabilecek değişiklikler ve fetvalardaki değişimlerin arka planını anlama hakkında önemli bir boşluğun doldurulması beklenmektedir."
