abstract: "İslam ulemasının asırlardır öncellikle üzerinde ihtimamla üzerinde durdukları ilimlerin başında fıkıh ilmi gelmektedir. Fıkıh ilmi ile helal, haram, ibadetlerin ifası vacipler ile sünnetlerin nasıl ifa edileceği bilinir. Fıkıh kendi içerisinde kısımlara ayrılır. Bu kısımlardan biri de“Muamelat fıkhı”dır. Muamelat fıkhı, günlük ihtiyaçlarımızın nasıl yapılacağı hususunda bilgi verir. Bu konu üzerinde ehemmiyetle duran âlimlerden biri de Osmanlı Şeyhülislâmı, Ebüssuûd Efendi (ö.928/1574) dir. Onun“Kitâbü'l-'İnâye Şerhu'l-Hidâye Şerhu Bidâyetü'l-Mübtedî li'l-Âlim el-Bâbertî”adlı yazma eseri günümüze kadar gelmiştir. Ehemmiyetine binaen bu eseri tahkik ederek üzerinde çalıştık. Çalışmamızın özet kısmında çalışmamın gayesi, risalenin ilmi değeri, çalışma esnasında karşılaştığımız zorluklar ile ulaştığımız sonuçları paylaştık. Çalışmamız bir mukaddime ile iki bölümden oluşmaktadır. Birinci kısım da Ebüssuûd Efendi'ni üzerinde çalışmış olduğu Hanefî fakihi Ebü'l-Hasen Burhânü'd-din Alî b. Ebî Bekr b. Abdilcelîl el-Fergânî el Mergînânî (ö.593/1197)'ye ait el-Hidâye'den ve tanınmış Hanefî fakihî Ekmelüddîn Muhammed b. Mahmûd b. Ahmed el-Babertî er-Rûmî el-Mısrî (ö.786/1384) 'ye ait Kitâbü'l-'İnâye'den bahsettik. İkinci kısımda üzerinde çalıştığımız yazma eser ve müellifinden, takip etmiş olduğu metottan ve muhakkikinden bahsettik. Sonuç kısmında ise üzerinde çalıştığımız yazma eserden elde ettiğimiz bulguları yazdık."
