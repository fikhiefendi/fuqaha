abstract: "Ülke ekonomisi açısından büyük önem taşıyan bankacılık sektöründe yaşanan rekabet, bankaların kaynaklarını etkin ve verimli bir şekilde kullanmasını gerektirmektedir. Bu sebeple, banka performans değerlendirilmesinin gerçekleştirilmesi ve değerlendirme neticesinde de gerekli tedbirlerin alınması gerekmektedir. Bu çalışmada Çok Kriterli Karar Verme tekniklerinden Entropi, CILOS, IDOCRIW ağırlıklandırma yöntemleri ile CoCoSo yöntemi kullanılarak katılım bankalarının 2018-2022 yılları arasındaki finansal göstergelere dayalı finansal performans değerlendirilmesinin yapılması amaçlanmıştır. Katılım bankalarının performanslarının belirlenmesinde kullanılan Entropi Kriter Ağırlık Yöntemi sonuçlarına göre; 2020 yılı için en yüksek ağırlığa sahip kriter Şube Sayısı iken, diğer yıllar için bu kriter Dönem Net Kârı olmuştur. CILOS Kriter Ağırlık Yöntemi sonuçlarına göre; 2018 ve 2021 yıllarında en yüksek ağırlığa sahip kriter Toplam Özkaynaklar ve diğer yıllarda Toplam Krediler olmuştur. IDOCRIW Kriter Ağırlık Yöntemi sonuçlarına göre ise; 2022 yılı için en yüksek ağırlığa sahip kriter Toplam Krediler iken, diğer yıllar için bu kriter Dönem Net Kârı olmuştur. Entropi, CILOS ve IDOCRIW Kriter Ağırlık Yöntemi sonuçlarına göre; katılım bankalarının CoCoSo Yöntemi ile performans sıralamaları yapılmış ve 2018-2022 yılları arasında tüm kriter ağırlıklandırma yöntemlerinde Kuveyt Türk Katılım Bankası performans birincisi olmuştur."
