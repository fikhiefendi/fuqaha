abstract: "Yeni bir metod arayışının sonuçlarından biri olan bu eser, İslam hukuk kurallarının(nass) gayelerini ortaya koymaya çalışmakla, İslâm'ın ruh ve özünün iyi anlaşılması ve anlatılması halinde varolan ve var olması muhtemel problemler karşısında mfislüman akıl ve mantığının daha dinamik ve sağlam bir yapıya kavuşmasını hedef lemekted ir. Bu çalışmamızın birinci bölümünde eserin tahlili ile beraber,“gaye”(crek) kavramının İslami kaynaklan, tarihî ve eleştirileri ortaya konulmuştur.Bukuk-adâlet, fitrat (yaratılıştan gelen özellikler) gibi kavramlar, modern hukukun da öngördüğü ile karşılaştırmalı olarak izaha çalışılmıştır. İkinci bölümde hukuk kurallarının teleolojik analizi ve gaye-sonuç ilişkisi) üçüncü bölümde ise gaye, genel ve öze! gaye konularını ihtiva eden temel kavramlar, ayrıntılı örnekleriyle ele alınmıştır. Sonuç bölümünde ise, henüz bir teori gibi görülen gaye konusu genel bir deĞerlcndirmcve tabi tutulmuştur. V"
