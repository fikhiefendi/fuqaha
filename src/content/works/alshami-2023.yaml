abstract: "Talak suresi Kur'ân'daki önemli surelerden biridir. Talak ve talakla bağlantılı iddet, emzirme, harcama, barınma, boşanmaya şahitlik ve boşanılan eşe geri dönme konularıyla ilgili hükümler ihtiva ettiği için en-Nisâu'l-Kusrâ olarak da isimlendirilmiştir. Araştırma, Kâsimî'nin Mehâsinü't-te'vil ve Tâhir b. Âşûr'un et-Tahrîr ve't-Tenvîr isimli eserlerinde bu sureyi nasıl tefsir ettikleri konusuna ışık tutmaktadır. Her iki tefsirde ayetlerin nasıl tefsir edildikleri tespit edilmiş, konuyla ilgili nakledilen görüşler verilmiş, iki tefsir arasında mukayese yapılarak; benzeyen ve farklı olan yönler ortaya konmuştur. Aynı şekilde her iki müfessirin metotları, tefsir, nahiv ve lügat konularında nasıl istidlâl ettikleri belirlenmiştir. İki tefsir mukayese edilerken karşılaştırmalı analitik tümevarım yöntemi kullanılmıştır. İki müfesirrin ilmi ve şahsi hayatı işlenirken betimleyici tarihsel yöntem tercih edilmiştir. Araştırmada ulaşılan neticelerden önemlileri şunlardır: Kâsimî ayetleri tefsir ederken Taberî tefsiri gibi genellikle eserle tefsiri tercih eden kaynaklara atıf yapmıştır. Tâhir b. Âşûr ise reyle tefsiri tercih etmiş, lügavî beyan konusuna önem vermiş, isrâilî, zayıf ve uydurma rivayetlerden uzak durmuştur. Kıraat konusunda Tâhir b. Âşûr sadece yedi kıraatle yetinmemiş, sahîh olan diğer kıraatlerle de istişhad etmiştir. Kâsimî ise bu surede kıraat konularına değinmemiştir. Sebeb-i nuzûl konusunda her iki müellifte surelerin isimleri ve isimlendirilme sebepleri üzerinde durmuştur. Tâhir b. Âşûr bu konuları daha mufassal bir şekilde ele almıştır. Kâsimî nahiv irab konularını detaylı bir şekilde işlememiş kısaca kelimelerin iraplarını vermekle yetinmiştir. Tâhir b. Âşûr ise bütün irap vecihleri üzerinde durmuş, kendisine göre sahîh olanı tercih etmiş, görüşünü desteklemek için ayetlerle istişhad etmiştir. Her iki müfessirde bu sureyi tefsir ederken şiirle istişhad etmemiştir. Belagat konularını Kâsimî detaylı bir şekilde ele almamış, herhangi bir belagat alimine atıf yapmamış, iltifat teşbih gibi bazı sanatları zikretmekle yetinmiştir. Tâhir b. Âşûr istiare, itnâb, teşbih ve diğer edebi sanatları detaylı bir şekilde ele almıştır. Özetle her iki kitapta hiçbir Müslümanın müstağni kalamayacağı çağdaş birer tefsirdir."
