abstract: "ÖZET OKUR, Kaşif Hamdı, \"İslam Hukukunda Akile Kurumu ve Sosyal Gü venlik Acısından Değerlendirilmesi\", Doktora Tezi, Danışman: Prof.Dr. İbrahim ÇALIŞKAN, TX+282 s. Âkile kurumu İslam Hukuku 'nun hem kökenlerine, hem de sosyal geli şimine ışık tutan önemli kurumlardan biridir. Tezimiz üç ana bölümden oluşmaktadır. Birinci bölümde âkile uygulamasının tarihi ve teorik arka planı üzerinde durulmuş, âkılenin İslam hukukuna eklemleniş sürecini ortaya koymak amacıyla İslam Öncesi Arap toplumunun toplumsal yapılanmasına temas edilmiştir. Bu çerçevede diyet uygulamasının tarihi kökenleri, İslam hukukuna girişi, İslam hu kukçularının bir hukuk kavramı olarak diyete yaklaşımları üzerinde durulmuştur. Diyetin hukuki niteliği incelenmiştir. İkinci bölümde âkılenin tarihçesi, İslam hukukuna eklemleniş süreci, hukuki dayanağı, şahsilik ve sorumluluk ilkeleri açısından değerlendirilmesi üze rinde durulmuştur. Klasik İslam hukuk doktrinindeki âkile ile ilgili hükümlerin tamamı ele alınmaya çalışılmıştır. Ayrıca bu bölümde âkılenin güncelleştirilmesi ile ilgili yaklaşımlar incelenmiş, bunların kritiği yapılmıştır. Üçüncü bölümde âkile ve sosyal güvenlik arasındaki ilişkiye yer verilmiş tir. Sosyal güvenliğin kökenleri, bugünkü durumu ortaya konarak Sosyal güvenli ğe İslam açısından getirilen yaklaşımların bir kritiği yapılmıştır. Âkılenin sosyal güvenlik, mali sorumluluğun sigorta edilmesi ve mağdurun korunması açısından değerlendirilmesi yapılmıştır. Sonuç olarak yaşama hakkı ve vücut bütünlüğü ihlâle uğramış bir mağ durun zararının giderilmesi konusunda İslam hukukunun iki ana ilkesi vardır: Mağdurun zararının giderilmesi ve cürmî kasıt taşımayan eylemiyle böyle bir za rara yol açan faile tazminat ödemede destek olunmuşu Âkile de bu iki önemli ilke nin uygulanmasını sağlayan başlıca vasıtadır. Bu uygulama mağdurun korunması ve cismani zararların giderilmesi bakımından mukayeseli hukuk araştırmalarına katkı sağlayacak niteliktedir."
