abstract: "Allah Teâla, Ümmeti Muhammed'e ilim ve marife sancağını taşıyan, Kuran ve Sünnet kılıcını çeken, içtihatlarını ve ilimlerini kendilerine kalkan edinen adamları hazırlamakla dinini muhafaza etmiştir. Bu adamların arasında soruları ve ilimleri bütün dünyaya yayılan Babarti dinini tamamladı ve Cenab-ı Hak beni lütfetti ve bu alimin görüşlerini Şerh-i Hidaye'den tevhid kitabında incelememe vesile oldu. ElMarghinani'nin el-Hidaye kitabını açıkladığı el-Babarti. Beni bu başlığı seçmeye sevk eden, el-İnâye fi şerhi'l-Hidâye adlı kitabının Hanefi fıkhında taşıdığı önemdir. Çünkü bahsi geçen mezhepte bu eser temel kaynaklardan biri olarak kabul edilir ve Babartî, Hanefi fıkhında önde gelen âlimlerden biridir. Bu tezdeki yöntemim, Babartî'nin kefâlet babındaki kitabındaki fıkıh görüşlerini toplamak, onları tahlil etmek, dikkate alınan fıkıh ekolleri ile karşılaştırmak, Kur'an ayetlerini ve Hadisi şerifleri tahrici yapmaktır. Aynı şekilde fıkıh veya dil sözlüklerinden istifade ederek garip kelimeleri şerh ettim: Ayrıca yazar ve okuyucu tarafından bilinmeyen âlimleri hakkında bilgi verdim. Çalışma iyi bölüme ayrılmış, her bölüm içinde alt başlıklar bulunmaktadır. Tezin sonunda elde ettiğimiz en belirgin sonuçlar şu şekildedir: Babartî, Kuran, Sünnet, icmâ ve kıyas gibi şer'î deliller, aslî delillerle sınırlı kalmayıp, kıyas, Sahâbî kavli, istihsân, Örf ve Şer'u Men Kablenâ/ bizden öncekilerin şeriatı gibi diğer ihtilaflı delillere de başvurmuştur. Yine sonuçlar arasında Babartî ele aldığı meseleleri ve görüşlerinde, verdiği deliller arasında en sahih olanı öne çıkarmaktadır."
