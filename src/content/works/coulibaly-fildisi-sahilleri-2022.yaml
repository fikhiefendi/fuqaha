abstract: "Geçmişten bugüne kadar her toplumda nikâh, önemli bir yere sahip olmuştur. Özellikle dini bir yönü de olması sebebiyle Müslüman toplumlarda bu daha da önem kazanmaktadır. Fildişi Sahili'nde farklı farklı kabileler ve dinler bulunmaktadır. Kabileler arasında nikâhlar kıyılmaktadır. Fakat hangi dine mensup olursa olsun, kabilelerin kendisine özgü adetleri bulunmakta ve pek çok alanda olduğu gibi nikâh esnasında da herkes kendi nikâh geleneğini uygulamaktadır. Müslümanlar da nikâh konusunda hem dine göre hareket etmekte hem de kendi kültürlerinde bulunan adetleri uygulamaktadırlar. Konumuz dört kabile üzerinde ele alınmıştır. Çünkü Fildişi'nde altmıştan fazla kabile bulunmakta ve bu kabileler, dilleri ve adetleri birbirlerine yakın olan kabilelere nispetle dört ana kabilenin altında toplanmaktadır. Çalışmamızda her gruptan bir kabile seçilerek araştırma yapılmıştır. Ayrıca seçtiğimiz kabileler; Fildişi Sahili'nde siyaset, ticaret ve sosyal hayat bakımından en önde gelen kabilelerdir. Söz konusu kabileler şunlardır: Senoufou, Malinke, Baoule, Bete. Bu çalışmada, bahsedilen dört kabilenin geçmişten günümüze kadar olan nikâhlama şekilleri ve aşamaları ele alınmıştır. Bu amaçla; Fildişi Sahili Medeni kanunu ve İslam Hukukuna göre nikâhın tanımı, şartları, günümüzdeki uygulama şekilleri ele alınmış ve tartışmalı konulara yer verilerek günümüz meselelerine çözümler getirilmeye çalışılmıştır."
