abstract: "Bu çalışma Muhammed b. Ahmed b. Yusuf el-İsbîcâbî'nin Zâdü'l-fukahâ isimli eserinin tahkik ve tahlilini içermektedir. Kudûrî'nin el-Muhtasar'ı üzerine yazılan bir şerh niteliğinde olan, fürû fıkha dair meseleleri delilleri ile inceleyen, fıkhın temel konularının tamamını ihtiva eden bir eserdir. Zaman zaman Şafiî ve Mâlikî mezhebinin görüşlerine ve sıklıkla Hanefî mezhebi içerisindeki farklı görüşlere yer veren eser, dönemin ilim talebeleri için bir el kitabı niteliği taşımaktadır. Tahkikini yaptığımız bölümde ilmî neşir kurallarına uygun olarak eserin ortaya çıkarılması, kaynaklarının tespit edilip, hadislerinin tahrîc edilmesine çalışılmıştır. Eserin Türkiye kütüphanelerinde bulunan nüshaları tanıtılıp nüsha örneklerine yer verilmiştir. Ayrıca Karahanlılar döneminde yaşayan ve dönemin önemli Hanefî fakihlerinden olan el-İsbîcâbî'nin hayatı ve eserleri tanıtılmıştır."
