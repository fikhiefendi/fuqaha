abstract: "Bu çalışmada, İmâmü'l-Haremeyn el-Cüveynî'nin (ö. 478/1085) el-Burhân fî uṣûli'l-fıḳh adlı eseri bağlamında lafzî delillerin kesinliği problemi incelenmiştir. Bâkıllanî (ö. 403/1013) et-Takrîb ve'l-irşâd fî usûli'l-fıkh adlı eserinde Vâkıfiyye'nin ortaya koyduğu lafzî delillerin zannîliği iddiasını savunurken Cüveynî el-Burhân'da karşı delillerle bu iddiaları çürütmeye girişmiştir. Bâkıllanî'nin temsil ettiği zannîlik taraftarları ile Cüveynî'nin temsil ettiği kesinlik taraftarları arasındaki bu tartışma; vaz' bilgisinin kesinlikten yoksun olması, söze müştereklik, mecaz, tahsis ve istisna bitişme ihtimali gibi sebeplere ve zannîliğin karinelerle giderilme imkanına odaklanmaktadır. Cüveynî'nin dilsel delillerde kesinlik problemine yaklaşımı anlam ve yorumun sınırlarını belirlemesi bakımından önemlidir. Cüveynî bu problemi tartışırken delâleti kesin olan ile delaleti zannî olanın birbirinden ayırt edilmesi gerektiğine dikkat çekmiştir. Zira delâleti kesin olanın yoruma açılması ve delâleti zannî olanın mutlaklaştırılması dilsel delillerle istidlal sürecinde yorumun bir tür ihlali olarak karşımıza çıkmaktadır."
