abstract: "Bütün dinlerde olduğu gibi İslâm dininde de mükellef olan kadın ve erkekler, Allah tarafından emredilen ibâdetleri yapmakla sorumludurlar. Ancak özel durumlar olarak tanımlayabileceğimiz bazı haller vardır ki bu durumlarda kadın ya da erkekler bazı ibâdetleri yapamazlar. Bu hallerde ibâdetlerin yapılmaması gerektiği, bu hallerin ibâdete engel bir durum oluşturması veya aklımızla kavramaktan aciz kaldığımız başka sebeplerden kaynaklanır. Bu çalışmada kadınların sahip olduğu biyolojik özellikler/farklılıklar nedeniyle yaşadıkları hayız, nifas ve istihâze gibi özel hallerinde normal zamanlarında sorumlu oldukları ibâdetlerle yükümlü olup olmadıkları, bu ibâdetleri yapmakla yükümlü olmadıkları takdirde özel halleri sona erdiğinde yapmadıkları ibâdetlerin kazasının gerekip gerekmediği konularında dört büyük amelî mezhebin, İbn Hazm ve İbn Teymiyye gibi İslâm hukukçularının görüş ve delilleri dikkate alınarak çağdaş bazı araştırmacıların fikirleri ile mukayese edilmeye çalışılmıştır."
