abstract: "İnsanoğlu fıtratı gereği sosyal bir varlıktır. Bu sebeple doğumundan ölümüne kadar etrafındaki insanlara ihtiyaç duyup onlarla beraber yaşamak durumundadır. Acz ve fakr sahibi olan insan her ihtiyacını bizzat karşılayamayacağı için etrafındaki insanların yardımına muhtaç olduğu gibi aynı yardımı başkalarından da esirgememesi gerekmektedir. Nitekim zor durumda olan insanların yardımına koşmak her Müslümanın görevi olduğu gibi aynı zamanda insani ve vicdani bir sorumluluktur. Bu sorumluluğun yerine getirildiği toplumlarda her kesimden olan insanlar daha huzurlu, insan ilişkileri daha sağlıklı ve karşılıklı güven ortamı daha yaygındır. Çünkü yardımlaşmanın yoğun olduğu toplumlarda kimsenin gözü başkasının malında olmayacaktır. Yardımlaşmanın sosyal katkılarından burada dile getirilmeyen başka yönlerinin olduğu da bir gerçektir. İslam dini bazı durumlarda zorunlu olarak bazı durumlarda gönüllü bir şekilde ama sürekli olarak yardımlaşma içerisinde bulunmamız için teşvikte bulunmaktadır. Çalışmada genel olarak malî ibadetlerin sosyal yönü ele alınmaya çalışılmıştır. Bu kapsamda yardımlaşmanın genel ve özel tanımı, İslam'da yardımlaşma, yardımlaşma ile ibadetlerin ilişkisi, zorunlu olan malî ibadetlerle zorunlu olmayan malî ibadetler üzerinde ayrıntılı durulmuştur. Bunun yanında ele alınan ibadetlerin sosyal yardımlaşmaya bakan yönü ve bu ibadetlerin sosyal yardımlaşmaya katkısı incelenmiştir. Detaylı olmasa da bu ibadetlerin kişinin manevi ve ruhî yaşantısında sağladığı faydalara da değinilmiştir."
