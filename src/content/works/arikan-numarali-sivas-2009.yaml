abstract: "Tez konumuz 3 Numaralı Sivas Şer'iyye Sicili'nin Transkripsiyon ve Değerlendirilmesidir. Bizim incelediğimiz bölüm H. 1202?1203 (MÖ 1787?1788) yıllarını içeren iki yıllık kısımdır. Defterin tamamı 144 varak 288 sayfadan oluşmaktadır. Bizim incelediğimiz kısım ise defterin 71 varak 142 sayfalık kısmınıdır. Bu sicil Sivas'a ait diğer sicillerle beraber Ankara Milli Kütüphane'de muhafaza edilmektedir.Tezimiz, önsöz, kısaltmalar, giriş, üç bölüm ve sonuçtan oluşmaktadır. Tezimizin sonuna ise kaynakça ve ekler kısmı ilave edilmiştir. Giriş kısmında Osmanlı hukuku, kadılık müessesesi ve şer'iye sicilleri konuları işlenmiştir. Birinci bölümde, Üzerine çalıştığımız belgelerin özetleri verilmiştir. İkinci bölümde, 3 Numaralı Sivas Şer'iyye Sicili'nin transkripsiyonu verilmiştir.Üçüncü ve son bölümde ise incelenen şer'iyye sicilindeki kayıtların değerlendirilmesi yapılmıştır. Bu bölüme idari yapı; Sivas'a bağlı kaza, nahiye, köy ve mahalle isimleri verilmiştir. Aile, evlilik, şahıs isimleri, lakap ve unvanlar verilerek sosyal durum değerlendirilmiştir. Nihayetinde Sivas'ın iktisadi yapısı da incelenerek değerlendirme bitirilmiştir."
