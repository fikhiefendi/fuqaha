abstract: "Kamulaştırma, bireyin temel haklarından olan mülkiyet hakkına müdahale teşkil ettiğinden, dünyada üzerinde en çok durulan ve ülkemizde de mevzuatta sıkça değişiklikler yapılan bir alan olmuştur. Kamulaştırma toplum yararı ile birey yararını karşı karşıya getirdiğinden ülkemizde Anayasa ve yasalarla, ayrıntılı bir şekilde sıkı kurallara tabi bir şekilde düzenlenmiştir. Bu kurallar çerçevesinde, malı kamulaştırılan eski malike, kamulaştırma aşamasında ve sonrasında, koşulları mevcut olduğu takdirde bir takım haklar tanınmıştır. Ancak malikin bu haklarını kullanabilmesi için yapılan düzenlemelerde, malikin haklarının kullanımının kapsamı daraltılmış ve malikin haklarını kullanımı zorlaştırılmıştır. Çalışmamızda, mülkiyet hakkına malikin rızası olmaksızın yapılan bir müdahale olan kamulaştırmaya ilişkin genel açıklamalar yapılmış, ülkemizde uygulanan usul teorik olarak incelenmiş ve kamulaştırma aşamasında ve sonrasında malikin haklarının kullanımına ilişkin uygulamada da ortaya çıkan sorunlar üzerinde durulmuş ve içtihatlar ışığında yapılan incelemelerle sorunlar çözümlenmeye çalışılmıştır."
