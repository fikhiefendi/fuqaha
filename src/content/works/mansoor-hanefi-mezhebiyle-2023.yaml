abstract: "Bir toplumun sağlamlığı, o toplumun temelini oluşturan ailelerin sağlamlığına bağlıdır. Aile içindeki üyeler arasındaki sadakat ve samimiyet, gelecek nesillerin teminatını oluşturur. Eğer bu sadakat ve samimiyet kaybolursa, bu durum ailede yetişen çocukların geleceğini de olumsuz şekilde etkileyebilir. İnsanların hayatlarını inanca devam edilebilmesi için vazgeçilmez temel haklar olarak bilinen can, mal ve ırzın himaye edilmesi gerekir. Bu kural hemen hemen bütün hukuk sistemlerinin esasını oluşturmuştur. Bu haklara haksız tecavüzde bulunanlar, farklı şekillerde de olsa bütün hukuk sistemlerinde cezalandırılmış, haksız tecavüzde bulunan kimseler, toplum tarafından da kınanmıştır. İşte bu noktadan hareketle, diğer suçlara nazaran ahlâka aykırı fiillere verilen cezalar daha ağır olmuştur. Diğer hukuk sistemlerinde olduğu gibi İslam hukukunda da konulmuş olan hükümler, insanların menfaatlerini gözetmiş ve onların en iyi bir şekilde hayatlarını devam etmesini hedef almıştır. Günümüzde Afganistan'da ceza kanunu da diğer kanunlar gibi İslam hukukuna uygun bir şekilde hazırlanmıştır. Bu bağlamda biz Afganistan ceza kanununda yer alan cinsel suçların neler olduğunu tez konusu olarak inceledik. Afgan ceza hukuku içerisinde yer alan cinsel suçların neler olduğunu incelerken de Hanefî mezhebinin görüşlerini esas aldık."
