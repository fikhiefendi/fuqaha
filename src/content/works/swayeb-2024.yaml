abstract: "Bu çalışma, sermaye yeterliliği, karlılık ve likidite gibi temel finansal oranları analiz etmek için bir dizi matematiksel denklem kullanarak Türkiye ve BAE'deki İslami bankaların finansal istikrarını değerlendirmeyi amaçladı. Çalışmanın amaçlarına ulaşmak için tanımlayıcı ve analitik yaklaşıma güvenilmiştir. Sonuçlar, Kuveyt Türk Bankası'nın çalışma örneğindeki diğer Türk bankalarıyla karşılaştırıldığında iyi bir finansal istikrara sahip olduğunu, Emirlik İslam Bankası'nın ise diğer Emirlik bankalarıyla karşılaştırıldığında iyi bir finansal istikrara sahip olduğunu gösteriyor ki, bunu açıkça görüyoruz. Kuveyt Türk Bank'ın mülkiyet hakları göstergelerinde Emirates İslam Bankası'ndan, Kuveyt Türk Bankası'nın ise kârlılık göstergelerinde Dubai İslam Bankası'ndan daha iyi performans gösterdiğini belirtti. Ayrıca, çalışmanın örneklemi olan BAE'de faaliyet gösteren İslami bankalar arasında en yüksek göstergeler olan likidite göstergeleri açısından Mashreq İslam Bankası'ndan daha iyi performans gösterdi. Çalışma aynı zamanda bu Türk ve Emirlik bankalarının kısa vadeli yükümlülüklerini verimli bir şekilde karşılayabilme yeteneklerini doğrulayan kabul edilebilir likidite oranlarını koruduklarını da gösterdi. Çalışma aynı zamanda Türk İslami bankalarının Emirlik İslami bankalarından daha yüksek düzeyde finansal istikrara ulaştığını da doğruluyor. Çalışma, Türk bankaları Al Baraka Katılım Bankası ve Katılımcı Vakıf'a sermaye yeterliliği göstergelerini iyileştirmelerinin yanı sıra Al Baraka Katılım Bankası'nın getiri oranlarını iyileştirmelerini, Mashreq İslam Bankası ve Dubai İslam Bankası'na ise sahiplik çarpanlarını ve nakit getiri oranlarını iyileştirmelerini tavsiye etti. Dubai İslam Bankası'ndaki bakiye oranı."
