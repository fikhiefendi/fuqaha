abstract: "Bu çalışmada öncelikle bankacılık kavramına değinilmiştir. Bankacılık kavramının ne anlama geldiği, tarihçesi ve bankacılık türleri yer incelenmektedir. Bankacılık sistemi tasarruf fazlası olan bireylerin fonlarının faiz kazancı veya kar payı kazancı sağlayarak toplanıldığı, toplanan fonların tasarruf fazlasına ihtiyaç duyan bireylere borç karşılığında kullandıran bir sistem olarak tanımlayabiliriz. Çalışmanın ileriki bölümlerinde bankacılık türü olan katılım bankacılığına değinilmiştir. Katılım bankacılığı tüm bankacılık işlemlerini faizsiz bankacılık anlayışı olan İslami finansa göre gerçekleştirmektedir. İslami finansa göre ticaret yapmak ve yapılan ticaretten kazanç elde etmek helaldir. Katılım bankacılığı anlayışında faiz, belirsizlik ve risk bakımından yüksek olan faaliyetlerin gerçekleştirilmesi uygun değildir. Katılım bankacılığında alkol, kumar, sigara, silah gibi konularda bankacılık işlemleri yapılmamaktadır. Katılım bankaları islami finans ilkelerine uygun olarak bankacılık faaliyetlerini gerçekleştirmek amacıyla“Danışma Komitesi”oluşturmuşlardır. Katılım bankalarının müşterilerine sunacak oldukları ürünler bankanın yönetim kurulunun onayı alındıktan sonra oluşturulan danışma komitesinden de onay almak zorundadırlar. Danışma komiteleri bağımsız olarak çalışmaktadırlar. Katılım bankaları, bankacılık sektöründe rekabet halindedirler. Ayrıca katılım bankacılığının ne anlama geldiği, katılım bankacılığının kullanmış oldukları ürünler ve son olarak faiz kazancına sıcak bakmayan insani bankacılık kavramına değinilmiştir. İnsani finans kavramı ekonomik sistemde finans başlığının altında değerlendirilen bir kavramdır. İslam dini israftan kaçınmayı ve ribayı yasaklamıştır. Aynı zamanda zekat verilmesini teşvik etmektedir. Bu durum sosyal adaletin ve bireyler arasındaki gelir dağılımının finansal faktörü olarak ekonomik sistemin oluşmasına ışık tutmuştur. Kapitalist sistemde fakirden alınarak zengine verilen finansal sistem İslam ekonomisi tarafından kabul görülmemiştir. Kapitalist finansal sistem tüketim yapmayı ve israfa teşvik etmektedir. İslam ekonomisinde bu durumun tam tersi olarak emek ile ortaklığa dayalı olan finans sistemini uygulamıştır. İslam ekonomisinin temel değerleri arasında kul hakkı yememek, israfın önlenmesi, adaletli gelir dağılımının olması, refah ve mutluluğun herkese yayılması olarak sıralanabilir."
