abstract: "Bu tez, akdi halefiyeti ele almakta ve onu hukuki ve fıkhî teoriler arasında bağımsız bir teori olarak incelemeyi amaçlamaktadır. Zira akdi halefiyet, bugüne kadar bağımsız bir teori olarak ele alınmamış; hukuki çalışmalar, akdi halefiyeti yalnızca iradî (sözleşmeye dayalı) akdi halefiyet çerçevesinde incelemekle yetinmiş ve kendiliğinden (otomatik) akdi halefiyete değinmemiştir. Bu bağlamda araştırmacı, akdi halefiyetin kendiliğinden akdi halefiyet ve iradî akdi halefiyet olmak üzere iki türe ayrıldığı yönünde bir hipotez ortaya koymuştur. Araştırmacı, öncelikle akdi halefiyet teorisinin kavramsal çerçevesini bütüncül olarak ele almış; teorinin tanımını, türlerini ve geleneksel alacağın temliki ile alt sözleşme gibi benzer hukuki kurumlarla arasındaki farkları incelemiştir. Ardından ikinci bölümde, sözleşmenin nisbî etkisi ilkesi üzerinden kendiliğinden akdi halefiyeti incelemiştir. Çalışma, kapsam ve uygulanma alanı bakımından iki teori arasındaki temel farklılıklar saklı kalmak kaydıyla, sözleşmenin nisbî etkisi ilkesinden halefiyet alanında yararlanılmasının mümkün olduğu sonucuna ulaşmıştır. Bunun ardından araştırmacı, iradî akdi halefiyeti; tanımı, hukuki nitelendirilmesi konusunda farklı hukuk ekolleri arasındaki görüş ayrılıkları—geleneksel ayrıştırıcı (analitik) ekol ile modern tekçi (üniter) ekol arasındaki yaklaşım farklılıkları—şartları ve hükümleriyle birlikte ele almıştır. Ayrıca İslam fıkhının iradî akdi halefiyet konusundaki tutumu incelenmiş; tez boyunca betimleyici-analitik yöntem benimsenmiştir. Tezin sonuç bölümünde, akdi halefiyetin bağımsız bir hukuki ve fıkhî teori olduğu sonucuna varılmıştır. Ayrıca İslam fıkhının kendiliğinden akdi halefiyeti tanıdığı ve buna ilişkin çok sayıda fıkhî uygulamanın bulunduğu tespit edilmiştir. İslam fıkhı, iradî akdi halefiyeti açıkça tanımlamamakla birlikte buna karşı çıkmamaktadır; zira iradî akdi halefiyet, İslami finansın genel ilkeleriyle uyumlu olup onlara aykırı değildir. Bu durum, İslami bankacılık ve finansal uygulamalarda bu teoriden yararlanılmasının önünü açmaktadır."
