abstract: "Bu çalışmada, İbn Cüzey'in telif ettiği ve hilafiyyat türünden sayılan el-Kavânîn'ül-fıkhiyye'nin ibadet bölümünde İmam Şâfiî'ye nispet edilen görüşlerin tahkik edilmesi ve değerlendirilmesi yapılmıştır. Çalışmamız bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde; araştırmanın konusu, önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir Çalışmanın birinci bölümünde, öncelikle, İbn Cüzey'in hayatı, kendisinden ilim aldığı hocaları, öğrencileri, kaleme aldığı eserleri, şahsiyeti incelenmiş, ardından çalışmamıza konu olan eseri tanıtılmıştır. İkinci bölümde, eserin ibadet bölümleri ile sınırlı olmak üzere el-Kavânîn'de İmam Şâfiî'ye nispet edilen görüşler incelemeye tabi tutulmuş, Şâfiî mezhebi kaynaklarına müracaat edilerek bu bilgilerin doğruluğu tespit edilmeye çalışılmıştır. Araştırma neticesinde İmam Şâfiî'ye 234 atıf yapılmış bu atıfların 206 tanesinde isabet edilirken 20 tanesinde isabet edilmediği görülmüştür. Sonuç bölümünde ise yapılan atıfların doğruluk oranı tablo halinde verilerek elde edilen bulgular paylaşılmıştır."
