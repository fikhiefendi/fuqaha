abstract: "“Katılım”sözcüğü kar ve zarara katılmayı ifade etmektedir. Dünyada katılım bankacılığı yerine faizsiz bankacılık kavramı kullanılmaktadır. Ülkemizde, 1983 yılında özel finans kurumları olarak kurulan bu yapılar, 2005 yılından itibaren katılım bankaları ismini almışlardır. Katılım bankalarının görevi, tasarruf sahiplerinden toplanan fonların faizsiz finansman prensipleri doğrultusunda ticaret ve sanayide değerlendirilerek, oluşan kâr veya zararın tasarruf sahipleriyle paylaşıldığı bankacılık sistemidir. Katılım bankalarının hem kanun koyucu tarafından zikredilmiş olması hem de doğaları gereği inancın emrettiği türden kırmızı çizgileri ve ayırt edici özellikleri vardır. Bu kırmızı çizgiler, bu bankaların ilk kuruluş yıllarında var olduğu gibi bugün de mevcuttur. Fakat katılım bankalarının ve kırmızı çizgilerin kamuoyundaki imajı karmaşıktır. Bu çalışmanın amacı; katılım bankalarındaki kırmızı çizgilerin kamuoyunda nasıl algılandığını tespit etmektir.“Değişen, büyüyen ve gelişen finans sektöründe bu kırmızı çizgiler nasıl korunabilir?”Sorusuna cevap aranmıştır. Yapılan çalışmada, ülkemizde vatandaşın algılamış olduğu faizsiz bankacılık sistemi ortaya çıkarılmaya çalışılmıştır."
