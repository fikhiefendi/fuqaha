abstract: "Bu çalışma, klasik fıkıh usulü yazımında kelamcı usulcülerin yöntemi ve fıkıhçı usulcülerinyöntemi olarak bilinen iki yöntemden kelamcı usulcülerin yöntemini konu edinmektedir.Fıkıh usulünün deliller, hükümler, delalet şekilleri ve ictihat olmak üzere dört ana konudanoluştuğu düşünülürse, bu çalışma kelamcı usulcülerin fıkıh usulünün üçüncü ana konusu olandelalet şekillerini nasıl ortaya koyduklarını araştıran bir çalışmadır.Çalışma bir giriş, iki bölüm ve bir sonuçtan oluşmaktadır. ?Delaletin Kavramsal Çerçevesi veMahiyeti? başlıklı birinci bölümde, lafzû delaletin ana unsurları olan üç kavramın; delil,medlul ve delaletin fıkıh usulü açısından ne anlama geldiği irdelenmiştir.Kelamcı usulcülerin lafzû delalet şekillerini ele aldıkları ?Hitabın Delalet Şekilleri? başlıklıikinci bölümde ise, lafzın mantuku ile delaleti ve mefhumu ile delaleti konuları incelenmiştir.Mantukun delaleti, daleleti açık olan (mübeyyen) ve kapalı olan (mücmel) olmak üzere ikibaşlık altında ele alınarak bunların tanımları, kısımları ve hükümleri üzerinde durulmuştur.Mefhumun delaleti konusu ise iktizânın delaleti, işaretin delaleti, ûmâ'nın delaleti, fahve'l-hitap (mefhumu'l-muvafaka) ve delilü'l-hitap (mefhumu'l-muhalefe) olmak üzere beş delalettüründen oluşmakta olup yine bunların tanımları, kısımları ve hükümleri üzerindedurulmuştur.Anahtar kelimeler: Delil, medlul, delalet, mantuk, mefhum."
