abstract: "Çalışma (1951-2020) döneminde“ Libya'da Tefecilik işlemleri mevzuatı”ele aldı. Tefecilik faizlerine ilişkin metinleri içeren yasaların ve ilgili yasaların karşılaştırmalı bir eleştirel analizi bağlamında, tefeciliği sınırlayan yasama aşamaları ele alındı. Bu kapsamda özellikle bazı kamu bankalarının olup olmadığı ve şahıslar arasında tefeciliğin kısmen yasaklanması ve daha sonra tamamen yasaklanmasına dair hususlar ele alındı. Çalışma, analitik eleştirel karşılaştırmalı bir yöntemi benimseyerek, metinleri araştırmak ve analiz etmek ve bunları işlem tefeciliğini önlemek için bir mekanizma açısından karşılaştırmak için bu yasaların bir envanterini ele aldı ve çalışmayı ayrıca Libya Devleti tarafından benimsenmesinin nedenlerini tartıştı. Tefeciliğin yasaklanmasında İslam şeriat hukukunun hükmüne uygun temel teşkil eden mevzuat, toplum ve ekonomi için feci etkilerin neler oluşturduğu da ele alındı. Çalışma kritik bir çerçevede, bu kanunları içeren eksikliklerin metinler açısından kısa olduğu ve hükümler detaylandırılmadan genel olarak oluşturulduğu, bunun yanı sıra dengesizliği bozan,“faiz getiren her kredi ribadır”temeline dayandırıldığı gösterilmiştir. Zira herhangi bir tefe işlemi faizi açık bir şekilde beyan etmez veya zımni olarak beyan etmezse ve gerçek bir hizmetle eşleşmediyse riba sayılacağı ve taraflar tarafından onaylandıysa ve gerçek bir hizmet olarak kabul edildiyse tefecilik statüsünden çıkacağı belirtilmiştir. Ayrıca Taraflar Arasında Unutulan Ribayı Engelleme Kanunu kapsamında, taraflardan birisinin tüzel bir kişi olması durumunda işlem kabul görmektedir. Riba İşlemlerini Engelleyen Kanun kapsamında, Libya Devletinin yabancı bankalarda bulunan paraları üzerinden ortaya çıkan faizler de önemli bir meseledir ve ihmal edilmektedir"
