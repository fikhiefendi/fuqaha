abstract: "Mülkiyet anlayışı tarih boyunca devletlerin iktisadi, hukuki ve sosyal yapılarına uygun bir biçimde, yaşanan dönemin getirdiği şartlara bağlı olarak sürekli değişim halinde olmuştur. İnsanlar toprağa tarım, barınma, ulaşım gibi ihtiyaçlarını karşılayabilmeleri nedeniyle bağımlı durumda olduklarından, uygulanan mülkiyet sistemi, toplumları ve yaşam biçimlerini de doğrudan etkilemektedir. Sanayi devrimi ile birlikte gelişen Liberalizm, 1980'li yıllardan itibaren bilgi, iletişim ve ulaştırma teknolojilerinde yaşanan hızlı değişim ve gelişim dünya geneline küresel ölçekte yayılmıştır. Ülke ekonomileri küreselleşmenin etkisiyle birbirleri ile gittikçe entegre hale gelmişlerdir. Küreselleşme ile ekonomiler ve ekonomiyi oluşturan piyasalar da birbirleri ile rekabet etmeye başlamışlardır. Bununla birlikte küreselleşme, ekonomilerin kriz yaşama sıklarını arttırmıştır. Dolayısıyla ülke ekonomileri, uluslararası düzeyde rekabet edebilmek, büyüme ve kalkınmalarını sürdürülebilir kılmak ve istikrarlı bir biçimde ekonomilerini bilgi temelli geliştirebilmek adına, ekonomiyi oluşturan piyasaları regüle etmek ihtiyacı duymaktadırlar. Türkiye sahip olduğu toprakları, İslam hukuku kurallarına göre mülkiyet yapısını oluşturan Osmanlı Devleti'nden almıştır. Ancak mülkiyet sistemini Osmanlı Devleti'nin uygulamış olduğu sistemden farklı bir şekilde geliştiren Türkiye, 1970'li yıllarda yoğun bir şekilde köyden kente doğru iç göç olgusunu yaşamış, bu durum şehirlerde büyük ölçekli konut ihtiyacını ortaya çıkarmıştır. 2008 yılında ABD'de başlayıp, diğer ülke ekonomilerine yayılan Konut Finansman Sistemi (Mortgage) krizinin ardından Türkiye, gayrimenkul piyasasını düzenleme ve denetleme ihtiyacı duymaya başlamıştır. Çalışmada, ekonomide yaşanan değişim ve gelişmelere bağlı olarak gayrimenkul piyasasının regülasyona tabi tutulması ve bu kapsamda Türkiye için bir 'Gayrimenkul Piyasası Kurumu'nun' kurulması önerilmekte, Türkiye'de gayrimenkul piyasasında meydana gelen gelişmeler, Johansen Eşbütünleşme Testi, Vektör Hata Düzeltme Modeli (VECM), Toda-Yamamoto Nedensellik Analizi ve Bootstrap Tabanlı Toda-Yamamoto Nedensellik Analizi yapılarak araştırılmaktadır."
