abstract: "İbn Hazm'ın fıkıh usulüne ilişkin temel iddialarından biri, bu disiplinin gerek kaynakları gerekse bilgi üretim süreci bakımından kesinlik zeminine oturtulması gerekliliğidir. Bu anlayış doğrultusunda ilahî mesajı taşıyan ve fıkhî hükümlerin temelini oluşturan nasların sübut açısından kesinlik arz etmesi esastır. Zira dinî alan beşerî müdahaleye kapalıdır ve bu yönüyle tamemen şer'î bildirime dayanmalıdır. Dahası İbn Hazm'a göre naslar yalnızca sübut itibariyle değil, delâlet açısından da kesin olmalıdır. Bu durumda sübutu kat'î metinlerden fıkhî hükümlere ulaşabilmek için sonuçları kesinlik taşıyan yöntemlerin kullanılması zorunlu hale gelir. İşte bu kesinliği temin etmek adına İbn Hazm, Aristo mantığını geniş bir biçimde kullanmakta ve nassın dış formunu oluşturan dil yapısına özel bir önem atfetmektedir. Bu tez, İbn Hazm'ın kesin bilgiye ulaşma hedefinin, onun genel düşünce sistemini ve Zâhirî fıkıh anlayışını şekillendiren en önemli unsur olup merkezi bir konuma sahip olduğunu ortaya koymayı amaçlamaktadır. Çalışmanın ilk bölümünde, İbn Hazm'ın kesinlik anlayışının teorik temelleri ele alınmaktadır. Bu çerçevede, onun mantık anlayışı, bilgi teorisi, beyan düşüncesi, varlık tasnifi ve dil teorisi gibi farklı disiplinlerde geliştirdiği temel kavram ve yaklaşımlar incelenerek kesinliğin kurucu ilkeleri analiz edilmiştir. İkinci bölümde, İbn Hazm'ın fıkıh usulü anlayışı çerçevesinde şer'î delillerin hücciyet ve sübut açısından kesinliğinin nasıl temellendirildiği ele alınmıştır. Üçüncü bölümde ise, kesinliği ortaya konan şer'î delillerden hüküm çıkarma süreçleri incelenerek İbn Hazm'ın kesinlik arayışının tutarlılığı ve başarısı değerlendirilmiştir."
