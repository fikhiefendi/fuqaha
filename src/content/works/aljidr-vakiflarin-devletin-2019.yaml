abstract: "Bu çalışmanın amacı, bağışın zengin ve fakir arasındaki boşluk sorununu nasıl ele aldığını incelemektir, Vakıf tarafından İslam'daki kalışın doğasını netleştirerek aralarındaki boşluğu kapatmak için izlenen en önemli strateji ve yöntemler nelerdir? Ve İslam ekonomisinde gelir ve serveti nasıl dağıtacağınızı inceleyin. Zakaah'ın vakfı nasıl etkilediğini, vakıf fonlarına yatırım yaptığını ve geliri ve serveti yeniden dağıtmada parayı durdurduğunu belirtti. Araştırma, Vakfın toplumdaki, özellikle ekonomik ve sosyal yöndeki rolünü vurgulamaktadır. Ayrıca Vakfın gelir ve refahın eşit dağılımını sağladığı en önemli stratejileri ve yöntemleri ve toplumun sınıfları arasındaki boşluğu azaltmanın önemini, bu yöntemlere ve gelişmelere ilgi göstererek ve bu amaçlara ulaşmada bunlardan faydalanmasını da araştırmaya çalıştım. Bulgular ve tavsiyeler."
