abstract: "Bu araştırmada, Zeyd b. Ali'ye nispet edilen el-Mecmûʿu'l-hadîsî ve'l-fıkhî ile Yahyâ b. Hüseyin el-Hâdî-İlelhak'ın el-Ahkâm fi'l-helâl ve'l-harâm adlı eserleri temel ibadetler çerçevesinde mukayeseli olarak incelenmiştir. İncelemenin kapsamı temizlik, namaz, oruç, zekât ve hac bahisleriyle sınırlı tutulmuştur. Çalışma giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte araştırmanın amacı, yöntemi, kapsamı, sınırları ve kaynakları belirtilmiştir. Birinci bölümde Zeydiyye'nin teşekkülü, Zeyd b. Ali ile Yahyâ b. Hüseyin'in ilmî şahsiyetleri ve iki eserin mezhep içindeki yeri ele alınmıştır. İkinci bölümde iki eserde farklı hükümlere konu olan meseleler, klasik fürû fıkıh tertibi esas alınarak karşılaştırılmıştır. İncelemede hükümlerin yanında delil kullanımı, meselelerin ele alınış biçimi ve gerekçelendirme tarzı da dikkate alınmıştır. Ayrıca sonraki Zeydî kaynaklardan yararlanılarak ilgili meselelerde mezhepte tercih edilen görüşler belirlenmiştir. Araştırma sonucunda el-Mecmûʿ'un daha kısa ve rivayet merkezli bir anlatıma sahip olduğu, el Ahkâm'da ise hükümlerin daha açıklayıcı ve gerekçeli bir fıkıh dili içinde ele alındığı görülmüştür. Sonuçta iki metin arasındaki süreklilik ve farklılıklar temel ibadetler üzerinden değerlendirilmiştir."
