abstract: "İslam toplumunun da dahil olduğu çeşitli toplumlumlarda mevcut sınıflar arasında zengin ve fakir şeklinde keskin bir eşitsizlikten behsedilebilir. Orta sınıf bireylerin önemli bir yüzdesinin fakirliğe yakın olması nedeniyle orta sınıf oranının önemli ölçüde azaldığı görülmektedir. Bunun yanında herhangi bir ekonomik sistemdeki önemli başlıklardan olan bir konunun İslami finans sistemi açısından kapsamlı bir analizinin olmaması araştırmayı önemli kılmaktadır. Temel finansal sistemin yasaları göz önüne alındığında araştırmada savunulan gelirin yeniden dağıtılması, ekonomik refahın sağlanması ve yoksulluğun ortadan kaldırılması denkleminde en önemli unsurlardan birisi olup servet dağılımındaki eşitsizliğin azaltılmasında büyük rol oynamaktadır. Servetin yeniden dağılımının genel olarak dağıtım teorisinde önemli bir unsur olduğuna şüphe yoktur. Zira yeniden dağıtım, servet dağılımı teorisinin toplumsal yapının dengesini bozabilecek sorunları hesaba katan pratik bir uygulamasıdır. Bu teorinin iktisadi düşüncedeki önemine rağmen, üzerinde yeterince çalışılmamıştır. İktisadi düşünce kitaplarında, herhangi bir iktisadi sistemde yeniden dağıtımın gerekçelerine ilişkin yeterli bir açıklama bulunmamaktadır. Bu araştırmada, İslami iktisadi düşüncesinde, Kur'an ve Peygamber'in sünnetinden çeşitli naslar ve bazı halifelerin servet ve dağıtım sistemi ile ilgili pratik uygulamaları ışığında yeniden servet ve gelir dağıtımının gerekçeleri ele alınmaktaadır."
