abstract: "Bu çalışma, ibadetler alanında ihtiyat uygulamalarını konu edinmektedir. Bu çerçevede konu Şafii mezhebiyle sınırlandırılmıştır. Gerektiğinde diğer görüşlere de yer verilmiştir. Konunun temel amacı, kendisine sıklıkla atıflar yapılan ihtiyat kuralının ibadetlerdeki etkisini Şafii mezhebi örnekliğinde gerekçeleriyle birlikte ortaya koymaktır. İhtiyati davranış, kişinin dini ve hukuki sorumluluklarını tam olarak yerine getirebilmesi için belirsizlik ve şüphe durumlarında tedbirli davranmasını ifade eder. İnsan hayatında karşılaşılan olaylar ve durumlar her zaman siyah ve beyaz olmayabilir. Zaman zaman gri alanların bulunması büyük ölçüde eşyanın tabiatında var olan bir olgudur. Böylesi durumlarda Müslüman bireyin Allah'a karşı dini/hukuki sorumluluklarını tam olarak yerine getirmiş olmanın rahatlığına erişmesi için bunu sağlayacak tarzda ihtiyatlı davranmanın dinen ve hukuken lüzumuna vurgu yapılmıştır. Çalışmada tümevarım ve tümdengelim yönteminin yanı sıra tahlil yöntemi uygulanmıştır. İhtiyatın ana sebebinin şüpheli durumlar olduğu, bu durumlarda ihtiyatlı davranmanın gerekliliği hususunda bütün fukahânın aynı kanaatte olduğu, fakat her şüpheli durumda uygulanıp uygulanmayacağı hususunda farklı yaklaşımları olduğu, Diğerlerinde olduğu gibi Şafii mezhebinde de ibadetler konusunda ihtiyata önem verildiği sonucuna ulaşılmıştır."
