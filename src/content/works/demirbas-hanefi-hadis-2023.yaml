abstract: "Bu çalışmada Hanefî hadîs usûlü anlayışının temel meseleleri ve prensipleri ile Aliyyu'l-Kârî'nin (1014/1605) bu hususlardaki görüş ve uygulamaları incelenmiştir. Araştırma teşekkül sürecinden itibaren müstakil bir anlayışa sahip olan Hanefî geleneğinin hadîs usûlünü temsil eden konularına odaklanmaktadır. Tedvîn dönemi sonrası kaleme alınan ilk fıkıh usûlü eserlerinden itibaren farklı dönemlerde yapılan çalışmalar Hanefî hadîs usûlünün anlaşılmasına ve sistemleştirilmesine öncülük etmiştir. İlk sistemli fıkıh usûlü kaynaklarından Aliyyu'l-Kârî'nin yaşadığı döneme kadar telif edilen birçok eserdeki haber ve sünnet bölümlerinin değerlendirildiği bu çalışmada, elde edilen bulgular Aliyyu'l-Kârî'nin görüşleri ile mukâyese edilmiştir. Giriş kısmında araştırmanın konusu, önemi, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Ayrıca Aliyyu'l-Kârî'nin hayatı, ilmî şahsiyeti ve yaşadığı dönemin özelliklerinden bahsedilmiştir. Birinci bölümde Hanefî hadîs usûlünün temel konuları incelenmiş, Aliyyu'l-Kârî'nin tercih ettiği görüşler vurgulanmıştır. İkinci bölümde Aliyyu'l-Kârî'nin Hanefî hadîs usûlüne dair meseleler hakkındaki uygulamalarına örnekler sunulmuştur. Böylece müellifin zikredilen prensiplere ne derece bağlı kaldığı, meseleleri hangi bağlamda ele aldığı ve Hanefî usûlünde teorinin pratiğe nasıl yansıdığı ortaya konulmaya çalışılmıştır. Üçüncü bölümde Aliyyu'l-Kârî'nin istidlâl yöntemini teşkil eden çeşitli prensipler üzerinde durulmuştur. Müellifin eserlerinden alınan örneklerle hem bu prensiplerin uygulama alanı incelenmiş hem de Aliyyu'l-Kârî'nin kendisine has olan yönteminin tespit edilmesi için çaba harcanmıştır. Ayrıca bu bölümdeki bilgilerin bütününden hareketle Hanefî bir muhaddisin riâyet etmesi gereken kâidelere örneklik edecek bir çerçeve sunmak amaçlanmıştır."
