abstract: "Bu çalışmanın amacı, Osmanlı Devleti tarafından geliştirilen ve yaygınlaştırılan para vakıflarının, Kuzey Kıbrıs Türk Cumhuriyeti'nde yeniden hayata geçmesini sağlamak üzere bir model önerisi geliştirmektir. Kıbrıs'ı 1570 yılında fetheden Sultan II. Selim'in fermanı üzerinde kurulan Kıbrıs Evkaf İdaresi ile birlikte, siviller tarafından para vakıfları kurulmaya ve çalıştırılmaya başlanmış ve bu süreç 1974 yılında kadar devam etmiştir. Geleneksel vakıflardan farkı, vâkıfların vakfettikleri kaynakların, Ebusuud efendinin fetvası neticesinde meşruluk kazanan muamele-i şeriyye yöntemi ile küçük esnafa, nakit ihtiyacı olanlara, Ribh payı ile nakit kredi vererek, elde edilen kâr ile, vakıf gayeleri arasında belirlenen sosyal yardım alanlarının fonlanmasının öngörmektedir. Bu sosyal yardım alanları da, sadakayı Cariye niteliğini sahip olup, Allah'ın rızasını aramak ve ona yakınlaşmak gayesi ile yapılmaktaydı. Günümüzde, 'Çağdaş para vakıfları' tanımı ile kurulmuş, özellikle mikto işletmelere İslam finansına uygun krediler sağlamakta ve elde ettikleri kâr ile sosyal yardım hizmetleri vermektedir. Model, anket ve görüşme yöntemleri ile birincil veriler elde etmek ve statistiki analizler yaparak, Kıbrıs'ta para vakfı potansiyelini, sakinlerinin algı ve beklentilerini ölçmeve değerlendirme yaparak hazırlamaya gayret edilmiştir. Bu çalışma ile KKTC'ne yeniden para vakfı uygulamasını kazandırmaya yönünelik bir model geliştirmek hedeflenmektedir."
