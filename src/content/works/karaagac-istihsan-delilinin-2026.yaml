abstract: "İslam hukukunda“zararın izalesi”ilkesi, temel hukuki prensiplerden birisidir. Her hukuk sistemi gibi İslam hukuku da imkânlar ölçüsünde zararın önlenmesine yönelik hükümleri ihtiva etmektedir. Daha kuvvetli bir delil sebebiyle kıyasın terk edilmesi veya açık kıyastan kapalı kıyasa dönme şeklinde özetlenebilecek olan istihsan delili de hukukun zararı önleme ilkesinin usule yansıyan yönüdür. Öyle ki istihsanın, kolaylığın sağlanıp maslahatın temin edilmesi için kıyasın terk edilmesi şeklinde yorumlanması da bunu ortaya koyar niteliktedir. İstihsanın bu yönü sadece teorik olarak değil, pratikte de göze çarpan bir husustur. Maddi ve manevi olmak üzere iki kısma ayrılan zarar; alışveriş hukukunda daha çok maddi zarar şeklinde ortaya çıkmaktadır. İstihsan prensibi ise birçok konuda, maddi zararın bir alt türü olan muhtemel zararı engellemektedir. Bu noktada istihsanın zararı önlemedeki işlevi, dayandığı hukuki temeller aracılığıyla gerçekleşmektedir. Genel kuralın bazı durumlarda terk edilerek farklı bir çözüme gidilmesi hukukun zararı önlenme maksadına daha uygun görülmüş; bu uygunlukta da yine mevcut naslar üzerinden hareket edilmiştir. Genel kuraldan sapmayı gerektiren durumlar -ki naslarda buna dahildir- Hanefi fıkhında istihsan başlığı altında ele alınmış ve hukuki bütünlük korunmaya çalışılmıştır. Ayrıca dayanağı nas olan istihsanın selem ve rehin gibi örneklerinde, istihsana dayalı zararın izalesi ilkesini görmek mümkündür. Bazı durumlarda ise insanlar arasında uygulanan muameleler dikkate alınarak kıyasın hükmü terk edilmiştir. Bu bağlamda, insanları yerleşik uygulamadan alıkoymanın doğuracağı zorluklar göz önünde bulundurulduğunda, istihsanın zararı önlediği açıkça ortaya çıkacaktır. Benzer şekilde maslahatın temini, zorluğun giderilmesi ve akitlerin olabildiğince sıhhate hamledilmesi yönündeki istihsan örnekleri yeri geldiğinde zararın izalesinin fıkıhtaki yansımaları olmuştur."
