abstract: "Osmanlı tarihinin en önemli arşiv kaynaklarından bir tanesi de Şer`iyye Sicilleridir. Ait oldukları dönem ve yer hakkında oldukça önemli bilgiler veren Şer`iyye sicillerinden faydalanma konusu bu gün için başlı başına bir problem olmaktadır. Bu durum ise sicillerden faydalanma konusunu belirli bir metoda bağlı kılmayı zaruri hale getirmektedir. Bizde bu önemli kaynaklardan biri olan 275 Numaralı Söke Şer'iyye Sicilini çalışmamıza konu edindik."
