abstract: "Bu tez, Mali Cumhuriyeti'nde Müslümanlar arasında yaşanan mezhep çatışmalarını ele almaktadır. Bu çalışmanın birinci bölümünde, İslam dininin bu bölgeye girişi, yayılması konularına temas ettikten sonra, geçmişte yaşanan mezhep çatışmalarını ve nihayetinde Maliki mezhebinin başarılı bir şekilde bölgeye hakimiyetini inceledik. Ayrıca bu bölümde, Maliki mezhebine ait ilmi-fıkhi hareketin doğuşu, gelişimi, duraklaması süreçlerine ve bunların sebeplerine temas ettik. Daha sonra Hanbeli mezhebinin bölgeye girişi ve onun yayılmasını sağlayan etkenler üzerinde durduk. İkinci bölümde, Maliki ve Hanbeli mezhepleri arasındaki çatışma konularından önemlilerine temas edilmiş, bu meseleler teorik ve pratik olarak incelenmiş, toplumda yol açtığı neticeler ve Mali halkının bu duruma karşı tepki ve davranışları analiz edilmiştir."
