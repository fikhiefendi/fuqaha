abstract: "Ali el-Kārî, hayatının büyük bölümünü, Hanefîlerin nispeten azınlıkta kaldığı Mekke havzasında geçirmiştir. Hanefî hocalarının dışında, diğer mezheplere mensup âlimlerden de ders aldığı bu vasatta, entelektüel ilgi ve ilmî-fıkhî kişiliğini şekillendirmiş, eserlerini kaleme almış ve ilmî çalışmalarını sürdürmüştür. Hadisçi kimliğiyle öne çıkan Ali el-Kārî'nin Fethu bâbi'l-ʿinâye'si, iftâ sürecinde ve fıkhî çalışmalarda başvurulan geç dönem kaynak eserler arasında önemli yer işgal eden şerh türünde bir çalışmadır. Eserini, Hanefî mezhebini hadis yönünden desteklemek amacıyla telif etmiştir. Söz konusu coğrafî, sosyal ve ilmî olguların, onun fıkıh düşüncesine ve fıkhî faaliyet türlerinden birisi olan açık ve iltizâmî tercihlerine etkisi önemli bir yerde durmaktadır. Tercih usûlü etrafında ve Hanefî füru fıkıh eserleri ekseninde, bu etkinin boyutlarını gözler önüne sermeye çaba sarf edilmiştir. Bu çalışma, Hanefî mezhebinde zaman içinde oluşmuş görüşler havuzundan ve mezhep birikiminden yararlanarak fetvaya esas görüşe ulaşabilmenin keyfiyetini göstermesi açısından örneklik teşkil etmeyi de gaye edinmiştir. Bu bağlamda çalışmamız bir giriş ve iki bölümden oluşmaktadır. Giriş bölümünde çalışmanın konusu, önemi, çalışmanın amacı, yöntemi ve literatür değerlendirmesi ele alınmıştır. Birinci bölümde ise Ali el-Kārî'nin hayat serencamına, entelektüel biyografisine ve eserlerine değinilmiştir. Bunun yanı sıra mezhep içi tercih ilke ve kuralları ortaya konmuştur. İkinci bölümde Ali el-Kārî'nin Fethu bâbi'l-ʿinâye'deki“Kitâbü't-tahâre”kısmındaki hükümler incelenmiştir. Sonuç bölümünde ulaştığımız bilgileri değerlendirerek çalışmamız nihayete erdirilmiştir."
