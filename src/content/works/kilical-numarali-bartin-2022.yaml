abstract: "Bu çalışmada 801 Numaralı Bartın Şer'iyye Sicili incelenmiştir. İsmi geçen sicil defteri 218 sayfadan ve 125 kayıttan oluşmaktadır. Kayıtlar genel olarak vekil tayini, vesayet, borç, vasi tayini, boşanma, mihr, evlilik, mal'a el koyma, alacak – verecek gibi muhtelif konulardan oluşmaktadır. Bununla birlikte bu sicil defterinin en önemli özelliği Bartın Bidayet Mahkemesi'nde görülen davaları da içinde barındırmasıdır. Bu açıdan bakıldığında incelenen sicil defteri şeri mahkemelerle nizamiye mahkemelerinin kayıtlarının birarada tutulduğunu gösteren değerli kaynak niteliğindedir. Çalışmanın ilk kısmında Şer'i mahkemelerinin işleyişi ve yapısı, Tanzimat değişim süreciyle beraber ortaya çıkan Nizamiye mahkemelerinin kuruluşu ve yapısı değerlendirilmiştir. İkinci bölümde şer'iye sicil defterinin transkripsiyonu yapılmış, lakaplar, meslekler ve yer isimleri ile ilgili tablolar hazırlanarak sicil defteri üzerinden elde edilen bilgiler değerlendirilmeye çalışılmıştır."
