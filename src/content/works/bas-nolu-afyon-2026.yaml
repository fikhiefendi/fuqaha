abstract: "Bu çalışmaya konu olan, 502 Nolu Afyon Şer'iyye Sicil Defteri H. 1061/M. 1650-1651 yıllarına ait olup transkripsiyonu yapılmış ve belge özetleri hazırlanmıştır. Belgelerden elde edilen bilgiler ışığında dönemin idarî, siyasî, sosyal ve iktisadî durumu ile dönemin önemli olayları değerlendirilmiştir. Sicil defterinde 576 belge yer almakta olup bunların çoğunluğunu hukuk davaları oluşturmaktadır. Defter üzerinde yapılan çalışmalar neticesinde kamu görevlileri, sancak, kaza, köy ve mahalle isimleri tespit edilebilmiştir. Ayrıca han, hamam, medrese, çarşı-pazar ve ibadethaneler ile ilgili bilgilere de ulaşılmıştır. Defterde sadece Afyon'a (Karahisâr-ı Sâhib) ait değil, buranın haricinde de sancak, kaza, köy ve mahalle isimleri olduğu görülmüştür. Defterin kayda alındığı tarihte devam eden Girit Seferi ve iç isyanların Afyon'a (Karahiâr-ı Sâhib) yansımaları, defterde kayıtlı belgeler üzerinden değerlendirilmiştir. H.1061/M.1650-1651 yıllarında Osmanlı İmparatorluğu'nun bir sancağı olan Afyon'un yerel tarihine dair ileride yapılacak olan yeni çalışmalar için kaynak teşkil etmesi amaçlanmıştır."
