abstract: "Teknik gelişmeler ve ona bağlı olarak tehlikelerin artması, kusuru ispat güçlüğü ve zarar görenin kusurunun bulunmadığı durumlarda, zararın bu kişinin üzerinde bırakılmaması gibi düşünceler kusursuz sorumluluk ilkesini beraberinde getirmiştir. Buna bağlı olarak, Türk hukukunda kusursuz sorumluluk halleri, objektif özen ödevine dayalı kusursuz sorumluluklar, hakkaniyete dayalı kusursuz sorumluluk ve tehlike sorumluluğu şeklinde karşımıza çıkmaktadır. Objektif özen ödevine dayalı kusursuz sorumluluklar, Türk Medeni Kanunu ve Türk Borçlar Kanunu başta olmak üzere çeşitli kanunlarda düzenlenmiştir. Bu kusursuz sorumluluklar arasında; adam çalıştıranın sorumluluğu, hayvan bulunduranın sorumluluğu, yapı malikinin sorumluluğu, ev başkanının sorumluluğu ve taşınmaz malikinin sorumluluğu teori ve uygulama açısından bir hayli önem arz etmektedir. Adam çalıştıranın sorumluluğu, hayvan bulunduranın sorumluluğu ve ev başkanının sorumluluğunda, özene dayalı kurtuluş delili getirme imkânı tanınmıştır. Yapı malikinin sorumluluğu ve taşınmaz malikinin sorumluluğunda ise bu imkân tanınmamıştır."
