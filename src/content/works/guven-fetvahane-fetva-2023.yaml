abstract: "Osmanlı Devleti, kuruluş aşamasından başlayarak hem halkını refah içinde yaşatabilmek hem de adaletli bir yönetime sahip olabilmek için bütün kurumlarının temellerinin sağlam atılmasına, yöneticilerin adil, bilgili ve kendilerini her açıdan yetiştirmiş olmasına önem vermiştir. Devlet işleyişinde yer alan kurumların teşekkülünde kendisinden önceki çeşitli medeniyetler ve devletlerinyönetim anlayışı ve kurumlarından esinlenmiştir. Osmanlı devlet teşkilatına bu kurumların kimi aynen alınırken kimi de bazı değişiklikler yapılıp uyarlanarak katılmıştır. Bu çalışmanın amacı, toplum ve devlet hayatına giren yönetici sınıflarının ve halkın günlük yaşantısının bir parçası olan dinin kurallarının günlük hayata uygulanması açısından fetva ihtiyacını karşılayan Fetvahâne'de görev yapmış memurları tanıtmaktır. Tez üç bölümden meydana gelmektedir. Birinci bölümde, Osmanlı Devleti'nde yönetici sınıflardan (seyfiye, kalemiye ve ilmiye) genel hatlarıyla bahsedilerek bu sınıflarda en üst makamlarda bulunan görevliler hakkında bilgi vermeye çalışılmıştır. İkinci bölümde, fetva kavramı, fetvahâne ve burada görev yapan memurların vazifeleri izah edilmiştir. Üçüncü bölümde, Türkiye Diyanet Vakfı İslam Araştırmaları Merkezi (İSAM) Ulema Dosyaları Veri Tabanında yer alan fetvahâne görevlilerinin dosyaları titizlikle okunarakortaya konan biyografileri sıralanmıştır. Sonuç kısmında çalışmanın genel bir değerlendirmesine yer verilmiştir. Anahtar Kelimler: Meşîhat, Fetvahâne, Ulema, Tercüme-i Hal, Sicill-i Ahval Dosyaları."
