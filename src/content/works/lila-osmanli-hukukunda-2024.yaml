abstract: "Esnaf teşkilatı, Osmanlı iktisadi sistemi içerisinde kilit rol oynayan birimlerden biridir. Esnafın faaliyetlerini sorunsuz yürütmesi, özellikle İstanbul gibi kalabalık şehirlerde halkın iaşe sıkıntısı çekmemesi adına Osmanlı Devleti'nin hususi olarak takip ettiği meselelerden biri olagelmiştir. Bu itibarla esnaf birlikleri, mesleklerini icra ederken genel anlamda devlet desteğini çoğunlukla yanlarında bulmuşlardır. Bunun yanında devletin kontrol ve denetimi de esnaf birliklerinin üzerinde olagelmiştir. Osmanlı iktisadi sistemi açısından bu denli önem taşıyan esnaf birlikleri, mesleklerini çoğunlukla vakıf dükkanlarda kiracı olarak icra etmiştir. Esnaf üyeleri vakıf dükkana kiracı olarak girerken mesleki aletlerini de beraberinde getirip yerleştirmiştir. Mesleki aletlerin vakıf dükkandaki yerleşikliği, hukuki açıdan hakk-ı karara dayalı olarak kiracı esnaf lehine birtakım özel kullanım yetkileri sağlamıştır. Ayrıca vakıf dükkanların tamir ihtiyacı da esnafın söz konusu tasarruf haklarını elde etmesinde kısmen etkili olmuştur. Çalışmanın kapsamı 16, 17 ve 18. yy'da İstanbul esnaf birliklerinde ortaya çıkıp yaygınlaşan gedik sisteminin hukuki açıdan analiz edilmesini içermektedir. Çalışmanın amacı, gedik sisteminin tarihi süreç içerisinde ortaya çıkışında etkili olan faktörlerin tespit edilerek gediğin tarihi serüveninin ayrıntılı şekilde incelenmesidir. Ayrıca gedik kavramının zamanla bünyesine kattığı farklı anlamların ve hukuki açıdan gedik hakkı sağlayan kira sözleşmesinin analiz edilmesi de çalışmanın amaçları arasındadır. Çalışmada izlenen yöntem ise; kaynak tarama, sınıflandırma, tahlil etme ve sentezleme aşamalarından oluşmaktadır."
