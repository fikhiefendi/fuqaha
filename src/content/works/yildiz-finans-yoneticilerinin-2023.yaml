abstract: "Dijital dönüşüm ile birlikte finansal teknolojilerin devingen bir yapıda gelişmesi yeni bir merkeziyetsiz finans sistemini ortaya çıkarmıştır. Yeni oluşan bu finans sisteminin omurgasını blockchain teknolojisi oluşturmaktadır. Blockchain teknolojisi ile ortaya çıkan kripto paralar, sistemin en büyük uygulaması olup, geleneksel ekonominin dengesini değiştirmiştir. Finans sistemindeki bu değişim ve dönüşümün sonucu olarak geleneksel finansa (CeFi) alternatif olan merkeziyetsiz finans (DeFi) oluşmuştur. Bu bağlamda çalışmanın amacı, finans yöneticilerinin, finansal teknolojilerin büyük bir alanını oluşturan kripto para ekonomisi ve DeFi uygulamalarına yönelik algılarının tespitini belirlemektir. Ayrıca bu olgulardan nasıl fayda saplayıp geliştirilebileceğine dair bir yeni bir çerçeve oluşturmaktır. Bununla birlikte kripto para ekonomisinin finans ve bankacılık sektörüne entegrasyonuna ilişkin zorlukların ve süreçlerin derinlemesine betimlenmesi ve yorumlanması amaçlanmaktadır. Çalışmada nitel araştırma yöntemi kullanılmış ve fenomenolojik desen ile araştırma yürütülmüştür. Araştırma öncesinde 6 finans yöneticisi ile pilot görüşmeler yapılmış ve sonrasında 21 finans yöneticisi ile derinlemesine görüşülmüştür. Söz konusu görüşmeler, MaxQDA 2022 programı ile analiz edilmiştir. Araştırma sonucunda kripto para ekonomisinin ve DeFi'nin gelecek vaad ettiği görülmüştür ancak mevcut durum itibarıyla finans yöneticilerinin olumsuz bir algı içerisinde olduğu, Türkiye'de bazı kamu ve özel sermayeli finans kurumlarında bu teknolojilere ilişkin altyapı ve entegre çalışmalarının olduğu gözlemlenmiştir. Fakat kripto para ekonomisinin hukuki dayanağının henüz olmadığı, yasal mevzuat çalışmalarının devam ettiği sonucuna ulaşılmıştır. Yasal mevzuatın oluşması durumunda görüşme yapılan finans yöneticilerinden kurumsal olarak kripto paraları benimseyerek mobil bankacılık uygulamalarına entegre edeceklerine ilişkin fikir birliğine varıldığı gözlemlenmiştir. Son olarak kripto para ve DeFi uygulamalarının kullanımında Türkiye açısından yasal mevzuatla birlikte dini faktörlerin de etkili olduğu ve katılım bankaları için dini caiziyet gerektirdiği sonucuna ulaşılmıştır."
