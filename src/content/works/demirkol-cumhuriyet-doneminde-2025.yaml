abstract: "Araştırmada Cumhuriyet döneminde (1923-2023 yılları arasında) din derslerinde uygulanan öğretim programlarında yer alan fıkhî konular tespit edilmiştir. Fıkıh, mükellefin fiillerine taalluk eden, tafsilî delillerden çıkartılmış şerî amelî hükümleri bilmek olarak tanımlanır. Fıkıh ilminin alt disiplinleri; fürû-ı fıkıh, usûl-ü fıkıh, fıkıh tarihi, fıkhın amaçları, külli kaideler ve öncü isimler olarak belirlenmiştir. Çalışmamızda ortaya koyduğumuz veriler, öğretim programları doküman inceleme ve betimsel analiz yöntemi kullanılarak hazırlanmıştır. 1924, 1926, 1930, 1948, 1956, 1967, 1968, 1976 yıllarında oluşturulan seçmeli din dersi öğretim programları; 1982 yılından itibaren ise anayasal bir zorunluluk olarak ilkokul, ortaokul ve liselerde okutulmuştur. 1982'den itibaren öğretim programları 1982, 1992, 2000, 2005, 2006, 2010 ve son olarak 2018 yılında hazırlanmış ve uygulanmıştır. Araştırmada istifade edilen öğretim programlarına ait ders içerikleri ve kazanımlar MEB Tebliğler Dergisi ve öğretim programı uygulama kılavuzlarından yararlanılarak tespit edilmiştir. İlk dönemlerde sadece Kur'ân okuma ve İslâm'ın beş şartı olarak sayılan namaz, oruç, hac ve zekât gibi ilmihal konuları müfredatta yer bulurken yıllar içerisinde halkın ve sivil toplum örgütlerinin talepleri ve siyasi iradenin pozitif yaklaşımları neticesinde fıkhî pek çok konu farklı başlıklar halinde öğretilmeye başlanmıştır. Çalışmamızda tarihi süreç içerisinde fıkhî hangi konuların öğretim programlarına dahil olduğu hangi konuların çıkarıldığı muhtemel sebepleri dikkate alınarak izah edilmiş, bunların içeriklerinin nasıl oluşturulduğu tespit edilmiştir. Tespiti yapılan konuların tasnifi gerçekleştirilmiş, fıkıh eserlerindeki konular ile karşılaştırması yapılmış ve değerlendirmeler ortaya konulmuştur."
