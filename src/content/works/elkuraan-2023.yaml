abstract: "Bu çalışma, vakıf şirketlerinin özelliklerini, vakıf şirketlerinin bölümleri ile ilgili en önemli konuları gözden geçirmeyi, vakıf şirketinin şartlarını, temellerini, türlerini ve önemini ortaya koymayı, vakıf şirketlerinin İslam Şeriatının amaçlarıyla uyumlu olan türlerini ve vakıf şirketi ile diğer benzer şirketler arasındaki farkları ortaya koymayı hedeflemektedir. Araştırmada ayrıca vakıf şirketinin kuruluş aşamaları, vakıf şirketinin yönetim, sermaye ve mali sorumluluğu gibi teknik ve hukuki yönleri, kuruluşun devamlılığını sağlamak için, şirketin çalışması ve bağışçılarının amaçlarına ulaşması gayesiyle şirketin kontrol ve yönetim sistemi üzerinde durulmuştur. Çalışma ayrıca, vakıf hisselerini kamu aboneliğine sunan bir vakıf şirketinin kurulması yoluyla vakıf finansmanı için yeni bir formül sunulması, vakıf hisselerinin yasal açıdan alım satımı, önerilen vakıf şirketi ile ilgili fıkhi konular, bağışın kalitesi, bağış şirketi tarafından ihraç edilen menkul kıymetler (normal ve primli hisse ve senetleri) ve zarar muamelesi gibi konulara temas etmiştir. Bağış şirketinin malvarlığında, vakıf şirketinin tasfiye ve feshine ilişkin gerekçeler, teklif edilen vakıf şirketinin hasılat ve hizmetlerinden yararlanma, hissedarlar ve hissedar olmayanlar üzerindeki en önemli ekonomik etkiler üzerinde durulmuştur. Araştırmacı, araştırmayı, aralarında çağdaş Vakıf şirketlerinin gelişmiş bir Vakıf yatırımı ve geliştirme yöntemleri olduğunu belirttiğimiz bir dizi önemli sonuçla tamamlamıştır. Araştırmanın sonunda araştırmacı, vakfı korumak ve geliştirmek, çağdaş yöntemleri incelemek ve geliştirmek için daha fazla seminer ve konferans düzenlenmesini, kanun koyucular ve hukukçuların, bireyi ve toplumu etkileyen, ekonomi ve kalkınmadaki olumlu etkilerinden dolayı çağdaş vakıf şirketlerinin fikrini benimsemelerini tavsiye etmiştir."
