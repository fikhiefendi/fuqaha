abstract: "Pakistan'da evlenme, boşanma ve velayet gibi aile hukukunun belirli alanlarında İslam hukukunun hükümleri uygulanmaktadır. Ülkede mer'i bulunan boşanma kanununun uygulanmasındaki aksaklıklar ve tefrik haklarının sınırlı olması, kadınların boşanmaları konusunda mağduriyetlere sebep olmuştur. Bu mağduriyetlerin giderilerek kadınların boşanma haklarının genişletilmesi amacıyla muhâleaya başvurulmuştur. Ancak muhâleanın klasik uygulamasında evlilik tarafların anlaşmasıyla sonlandırılırken Pakistan'da bu işlem yargı yoluyla yapılmaktadır. Yani evlilik kadının talebi üzerine koca rızasına bakılmaksızın mahkeme tarafından sonlandırılmaktadır. Literatürde“Yargı Yoluyla Muhâlea”olarak adlandırılan bu işlemin şer'î meşruiyeti önemli tartışma konularından birisini oluşturmaktadır. Bu çalışmada, söz konusu uygulamanın gelişimi ve meşruiyeti hakkındaki tartışmalar ele alınmaktadır."
