abstract: "İslâm dininin Kur'ân-ı Kerim'den sonra temel kaynağı hadistir. İmam Mâlik:“Bu ilim yani İlm-i hadis, dindir. Artık dininizi kimlerden aldığınıza dikkat ediniz.”Sözüyle hadisin önemini ve dinin bizzat kendisi olduğunu vurgulamaktadır. Hadisi en geniş tanımıyla, Hz. Peygamber'in ahlakı, şemâili, nübüvvetten önceki ve sonrasındaki söz ve fiilleri olarak tanımlamak mümkündür. Hadis bu geniş tanımıyla,“davranış, hal, yol, âdet, bir kimsenin hali, seciyesi ve hayat hikâyesi”anlamında ki siret/siyer ile paralellik arz etmektedir.Siyer kavram olarak Hz. Peygamber'in hayatını araştıran, nakleden ve kendine özgü metotları olan bir ilimdir. Siyer sadece Hz. Peygamber'in hayatını tanımlayan bir ilim olarak kalmamış, daha sonraları genel anlamda“Biyografi”için de siyer kavramı kullanılmıştır. Siyer ve hadis ilimlerinin ortak noktası, her iki ilmin temelinde Hz. Peygamber'in olmasıdır. Her iki ilimin gayesi Hz. Peygamber'in hayatı ve faaliyetleriyle ilgili her türlü bilgi, rivâyet ve vesikaları toplamak ve nakletmektir. Bu nedenle siyer ve hadis ilimleri birbirleriyle doğrudan irtibatlıdır. Siyer ve Hadis arasındaki irtibatı ortaya çıkarmak adına çalışmamızda İmam Mâlik'in, el-Muvatta' adlı eserinde siyer ile ilgili rivâyetler tespit edilerek bu rivâyetler siyer kaynakları ile mukayese edilmiştir. Tespit ettiğimiz rivâyetleri mukayese için muteber siyer-megâzi müelliflerinden İbn İshak (ö. 151/768), Vâkıdî (ö. 207/823), İbn Hişâm (ö. 218/833), İbn Sa'd (ö. 230/845), İbn Seyyidünnâs (ö. 734/1334), Şâmî (ö. 942/1536) ve Nûreddîn Halebî'nin (ö. 1044/1635) eserlerine başvurulmuştur. Çalışma sonucunda el-Muvatta'' da Hz. Peygamber'in siyeri hakkında birçok rivâyetin zikredildiği tespit edilmiştir. Bu durum hadis kaynaklarının siyer araştırmaları için büyük bir önem taşıdığını ortaya koymaktadır. Ayrıca mukayese sonucunda nakledilen siyer rivâyetlerinin çoğunda hadiselerin siyak-sibakı, sebep-sonuç, yer ve zaman bilgisi gibi bilgilerin tam olarak verilmediği tespit edilmiştir. Bu tür rivâyetler ancak siyer kaynakları ile karşılaştırıldığında ele alınan hadis tam olarak anlaşılmaktadır. Bu da siyer kaynaklarının hadis araştırmaları için önemini ortaya koymaktadır."
