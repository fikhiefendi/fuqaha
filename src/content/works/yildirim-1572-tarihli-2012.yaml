abstract: "Bu çalışma orijinal nüshaları Ankara'da Milli Kütüphane'de bulunan, 101 sayfadan oluşan ve içerisinde 545 adet belge bulunan H.980/ M.1572 tarihli 166 numaralı Ayıntab Şer'iyye Sicili'nin transkripsiyon ve değerlendirmesini içermektedir. Şer'iyye sicilleri Osmanlı Devleti'nin askeri, hukuki, iktisadi, dini ve idari müesseseleri hakkında önemli bilgiler içermektedir. XV. yüzyılın ilk yarısından, XX. yüzyılın ilk çeyreğine kadar olan Türk tarihine sosyo-kültürel açıdan ışık tutması sicilleri Osmanlı tarihinin en önemli kaynaklarından biri yapmaktadır. Aynı zamanda kadıların merkezle yaptığı resmî yazışmaları ve ilgili olduğu mahallin, sosyal, kültürel, ekonomik, dinsel, hukuki ve idari gelişmelerini de içermesi bakımından önemlidirler. Yine şehir tarihi ve tarihçiliği araştırmalarında da çok büyük bir öneme sahip olan şer'iyye sicilleri, toplumun günlük hayatını, evlerini, camilerini, pazarlarını, çeşitli müesseselerini, mahalle ve köylerini, örf ve adetlerini, dönemin hukuk ve tatbikatını kısaca bir toplumun hayatına dair bütün konuları ve durumlarını gösteren çok değerli bilgelerdir. Bu noktadan hareketle 1572 yılına ait bu sicildeki bilgiler dönemin Ayntab'ı tüm yönleriyle tanıtmaktadır."
