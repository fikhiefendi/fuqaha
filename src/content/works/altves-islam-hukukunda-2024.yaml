abstract: "İslam dini, insanların her yaş ve çağda ihtiyaç duyduğu ahlakî ilkelerle Müslümanların ibadet, muamelat ve ukûbâta dair eylemlerini ilgilendiren hukukî prensipler içerir. Bu hukuk sistemi, Kur'an-ı Kerim ve Sünnet üzerine teşri edilmesi sebebiyle ilahî vasfa sahip olsa da fukahânın farklı usullere, coğrafyaya, zaman ve bakış açılarına sahip olmaları sebebiyle de farklı fıkıh mezhepleri adı altında derinleştirildiğinden beşerî özelliğe de sahiptir. İslam hukuku coğrafya ve içinde bulunulan zamana göre esneklik göstermesi sebebiyle de doğma değil, esnekliğe sahip özelliklere sahip bir hukuk sistemidir. Öte yandan İslam hukukunda ibadetler ve muamelat hükümleri bakımından mükelleflerin yaşı ve dönemi gibi kişisel şartlarla çevre ve iklim şartları gibi bazı haricî etkenler bazı hükümlerin geçici, bazen de kısmen ya da daimî olarak terkedilmesi imkânı da sağlayan özelliklere sahiptir. İnsan iradesi ve gücü dışında cereyan eden bu haricî etkenlerden ikim şartları ile çevresel bazı semavî ve arazî faktörlerin hayatımızı etkilemesi kaçınılmazdır. Hava durumu ve iklim şartları gibi doğal değişkenler; ister ibadetler, ister muamelattan günlük yaşamın pratiklerine kadar birçok alanı etkileyebilir. Bu nedenle, İslam hukukunun uygulanmasında, iklim şartlarının dikkate alınması zorunluluktur. Bu araştırmada, hava durumu ve iklim şartlarının fert ve cemaat halinde icra edilen ibadetlerle ilgili dinî hükümlere olan etkileri anlaşılmaya çalışılmış ve fıkhî hükümlerdeki geçici ya da daimî değişim, mezheplere göre kapsamlı olarak analiz edilmiştir. Bu analiz, mevcut İslam hukuku kaynaklarının titizlikle incelenmesi ve fıkıh kitaplarında dağınık vaziyetteki hava durumu ve iklimle bağlantılı farklı hükümlerle uygulamaların bir araya getirilmesi suretiyle gerçekleştirilmeye gerçekleştirilmiştir."
