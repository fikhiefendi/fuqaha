abstract: "Osmanlı Devleti'nin son döneminde asrın harp teknolojisinin gerisinde kalan ve devletin sınırlarını savunacak gücü kaybetmiş donanmasının, devlet eliyle ıslahının ekonomik bakımdan mümkün olmayışı, donanmanın ıslahına yönelik farklı kaynak arayışlarının kapısını aralamıştır. Kaynak arayışı içerisine giren kimseler, Sultan II. Abdülhamid döneminde verilen devlet nişanlarının donanma lehine teberru edilmesi, müzelerde bulunan âsâr-ı atîkanın satılması, kitap ve risalelerin belli bir sayısından, süreli yayınların ise yılın bir gününden elde edilecek gelirin donanmaya verilmesi gibi çeşitli önerilerde bulunmuşlardır. Devletin gündemini meşgul eden bu meselenin çözüme kavuşturulması için çeşitli mali ibadetlere de başvurulmuştur. Özellikle zekât ve kurban paralarının donanma giderlerine harcanması fikri Osmanlı'nın son döneminde furû alanındaki tartışma konularından birini teşkil etmiştir. Bireysel arayışların yanı sıra II. Meşrutiyet döneminde kurulan Donanma-yı Osmânî Muâvenet-i Milliye Cemiyeti de halkın donanmaya iâne fikrine ikna edilmesi için konferanslar düzenlemek, gazetelerde yayınlar yapmak gibi çeşitli faaliyetlerde bulunmuştur."
