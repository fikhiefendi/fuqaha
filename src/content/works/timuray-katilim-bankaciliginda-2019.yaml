abstract: "Ülkemizde özellikle 1990'lı yıllardan sonra görülen Dünya ile entegre olma çalışmaları tüm sektörleri etkilemiş, gerek özel ve gerekse de kamu sektörünün yeniden yapılanma süreçleri hız kazanmıştır. Gelişen ve değişen Dünya'ya uyum göstermeye çalışan tüm organizasyonlar öncelikle teknolojik alt yapılarını güçlendirmeye başlamışlardır. Hızlı teknoloji transferleri organizasyonların iş yapış tarzlarını etkilemiş, otomasyon ve bilgisayar sistemlerinde ki gelişmeler neredeyse tüm sektörlerde istihdam edilen çalışan sayısının tartışılır olmasına neden olmuştur. Bu tartışmalar ilerleyen zamanlarda organizasyonlar açısından kurum içi iletişim mekanizmalarının kurulmasına neden olmuştur. Katılım bankacılığı ülkemizde ilk olarak 1985 yılında kendini göstermiş ancak 2000'li yıllara kadar bankacılık sektöründe etkisini hissettirememiştir. Son on yılda başarılı bir performans çizen bankacılık sektörü içinde katılım bankacılığı da çalışan sayısını önemli ölçüde arttırmıştır. Bu artış katılım bankalarının geleneksel yönetim tarzlarından kurtularak bilimsel metotlara dayalı modern yönetim anlayışlarını uygulamalarına neden olmuştur. Bu sebeple de katılım bankaları gerek kurum içi, gerekse de kurum dışı iletişim alanlarında kendilerini geliştirmeye başlamalardır. İşletmeler açısından iletişimin önemi hiç tartışmasız ki çok önemlidir. Gerek iç iletişim ve gerekse de dış iletişim açısından yeterli performans ve başarıyı gösteremeyen işletmelerin uzun süreli faaliyetlerini sürdürmeleri beklenemez. Bu nedenle özellikle iletişim, hizmet ve kalite birçok akademik çalışmaya konu olmuş, hakkında kitaplar yazılmıştır. Hizmet kalitesini ölçebilmek için çok çeşitli yöntemler geliştirilmiştir. Bu yöntemlerden bir tanesi de Servqual modelidir. Servqual ölçeği birçok araştırmada her ne kadar hizmet kalitesi ölçümü amacı ile kullanılmış olsa da, bu çalışmada iletişim kalitesinin ölçümü amacı ile kullanılmıştır. Bu çalışmanın amacı, kurumsal iletişim çatısı altında çok önemli bir yere sahip olan kurum içi iletişimde çalışanların beklenti ve algılarının ne ölçüde örtüştüğünü ölçmektir. Bu bağlamda fiziksel, güvenilirlik, heveslilik, güven ve empati kalite boyutlarında çalışanların düşüncelerinin nasıl etkilendiğini ortaya koymak amaçlı gerçekleştirilen araştırmada kantitatif araştırma yöntemlerinden anket yöntemi kullanılmıştır."
