abstract: "Çalışmada, son yıllarda önemi giderek artan ve daha fazla ülkede uygulama alanı bulan İslami finans sektörü ele alınmış ve İslami finans sektörünün gelişimi ile İslami finansa ilişkin yasal düzenlemeler arasındaki ilişkinin ampirik açıdan incelenmesi amaçlanmıştır Bu amaçla, dünya genelinde en fazla İslami finans varlıklarına sahip olan ve yasal düzenlemeleri çeşitlilik arz eden 15 ülkeden, verilerine ulaşılabilen 11 ülke için 2012-2022 yıllarını kapsayan bir panel veri seti kullanılarak. İslami finans sektörünün gelişimi ile İslami finansa ilişkin yasal düzenlemeler arasındaki ilişki, panel veri analiz yöntemi ile incelenmiştir. Analiz sonuçlarına göre; örneklemi oluşturan 11 ülkede, inceleme döneminde İslami finans yasal düzenlemelerine ilişkin AAOIFI standartlarını uygulamanın zorunlu olması İslami banka varlıklarını, negatif ve istatistiki açıdan anlamlı bir şekilde etkilemektedir. Hem merkezi hem Müstakil Şer'i Danışma Kurulunun varlığı, İslami finans sektörüne ilişkin, İslami finans varlıklarının GSYİH içindeki payını, İslami banka, sermaye piyasası ve takafül varlıklarını pozitif ve istatistiki açıdan anlamlı bir şekilde etkilemektedir. İslami finans yasal düzenlemeleri konvansiyonel finans yasal düzenlemelerinden ayrı olması İslami Finans sektörüne ilişkin İslami finans varlıklarının GSYİH içindeki payını ve İslami banka varlıklarını negatif ve istatistiki açıdan anlamlı bir şekilde, etkilemektedir. Hem merkezi ve hem müstakil Şer'i danışma kurullarının, İslami finans sektörünün gelişimi için önemli olduğu İslami finansa yönelik standartların şer'i öğreti ve ilkelere uygunluk açısından ayrı ayrı ele alınarak, kalite açısından gözden geçirilmesi gerektiği sonucuna ulaşılmıştır."
