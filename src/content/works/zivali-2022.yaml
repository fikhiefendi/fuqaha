abstract: "Kripto para birimlerinin ilk örnekleri, birçok ekonomik krize yol açan itibari kâğıt paralara sanki bir alternatifmiş gibi, 2008 ekonomik krizinden sonra, İslam hukuku kurallarına bakılmaksızın ortaya çıkmıştır. Dolayısıyla bu araştırma, Bitcoin örneğinde kripto paralardaki şer`i sorunları incelemeyi hedeflemektedir. Bu itibarla araştırmacı, İslam hukukuna göre mal ve paranın hakikatini ortaya çıkarmak ve Bitcoin'in durumunu İslam hukuku nazarından tahlil etmek için analitik bir yaklaşım metodu takip etmiştir. Bu çalışmada, çağdaş araştırmacıların çoğunun İslam fıkhı açısından para ve mal kavramlarını yanlış anladıkları, hatta bu hatalı anlayışlarıyla mal ve parayla ilgili modern meselelerin hükümlerine karar verdikleri tespit edilmiştir. Çünkü bu araştırma, çağdaş araştırmacıların bu iki kavram hakkındaki söylediklerinin aksine, kadim fakihlerin çoğunun nazarında, sadece malların aslında özü itibariyle bizatihi değerli ayni eşyalardan olması gerektiğini değil, aynı zamanda paraların da özü itibariyle bizatihi değerli ayni eşyalardan olması gerektiğini ortaya çıkarmıştır. Dolayısıyla klasik fakihlerin çoğuna göre menfaatler, borçlar ve hakların hakikatte mal olmadıkları, ancak zaruri ihtiyaçtan dolayı bu mefhumların ticari muamelelere konu olması hasebiyle bu fakihlerin bazıları tarafından mecazi olarak mal lafzı ile isimlendirdikleri de bu araştırmada ortaya çıkmıştır. Ayrıca, paranın, modern araştırmacıların iddialarının aksine, özü itibariyle değerli misli ayni mallardan olması gerektiği, fıkhi literatüründeki mağşuş paralardan maksadın başka madenlerle karıştırılarak üretilmiş paralar olduğu, paraların devlet tarafından bastırılmasındaki maksadın ise insanların parasal işlemlerinde doğabilecek aldatma ve aldanmayı izale etmek olduğu, ve piyasadaki rayiç olan altın ve gümüş dışındaki madeni paraların(fülüslerin), üretildikleri madenlerin zati değerleri nispetince kıymeti düşük olan eşyaların bedeli(parası) olduğu bu araştırmada açığa kavuşturulmuştur. Dolayısıyla bu araştırmada, sadece Bitcoin gibi kripto paralarla muamele etmenin batıl olduğu değil, aynı zamanda zorlama yoluyla insanlara para olarak kabul ettirilmiş olan itibari kâğıt paralarla da muamele etmenin batıl olduğu sonucuna varılmıştır. Zira her ikisi de hem özü itibariyle kıymeti olan mallardan değil, hem de misli olan ayni mallardan değildir, aksine her ikisi de İslam fıkhında riba sayılan yasaklanmış bedelsiz (karşılığı olmayan) muamelelere vesiledir."
