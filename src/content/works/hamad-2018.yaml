abstract: "'Himâyetu hukûki'l-müellif ve'l-hukûki'l-mücâviretilehâ'başlığını taşıyan bu tezde yazarın telif hakkının korunma altına alınması konusu, İslam hukuku ile modern hukuk açısından karşılaştırmalı olarak incelenmesi amaçlanmıştır. Çalışma, yazarınedebiyat, sanat veya bilimsel alanlarda ortaya koyduğu eserlerden doğan hakların güvence altında oluşuna, bunun modern ve islam hukuku açısından da sabit bir hak olduğuna ve yazarın bu eserlerinin maddî ve manevî gelirlerinden sürekli olarak yararlanma yetkisine sahip olduğuna dair alana yöneliktir. Yazar, sahip olduğu beceri ve algılama yeteneğiyle üreten, buluşlar yapan, topluma hizmet eden, buluşlarıyla toplumu bulunduğu konumdan farklı bir konuma çıkararak hayatın farklı alanlarında ona katkı sunan ve istikbalini aydınlatandır. Kanunlar ile şu anki ve gelecek nesillerin yararı ve geleceği için ürettiği değerlerin korunması hedeflenir.Bu yüzden deyazarın ve ortaya çıkardığı eserlerin korunmasını kanunlar tekellüf eder. İslam hukuku,yazarın haklarının korunmasının gerekliliği konusunda modern hukukla aynı görüştedir. Ancak islam hukuku yazarın meşru haklarının korunması hususunda ilk ve ana kaynaktır."
