abstract: "Küçük yaşta evlilik yapılmasına izin veren veya İslam dininin aile hukuku ile ilgili hükümlerini tenkit eden kesimlerin genel itibariyle iddialarını Talâk suresinin 4. âyetine dayandırma gayreti içinde olduklarını görmekteyiz. Bu çalışmanın amacı“küçük yaşta evlilik”meselesiyle ilgili sürekli dile getirilen söz konusu âyetin tefsir tarih boyunca nasıl anlaşıldığını tespit etmektir. Dolayısıyla bu çalışmanın amacı söz konusu âyetin sahih bir şekilde anlaşılmasına katkı sağlamaktır. Söz konusu âyetle ilgili ilk dönem tefsir ve fıkıh kaynaklarından başlayarak son döneme kadar yazılan birçok tefsir ve fıkıh kaynaklarını taradık. Âyette geçen“âdet görmeyenler”ifâdesiyle herhangi bir yaş sınırlandırılması söz konusu değildir. Dolayısıyla söz konusu âyette geçen“âdet görmeyenler”ifadesini“sadece küçükler”şeklindeki bir kayıttan ziyade en genel şekliyle ele almak en doğru yol olacaktır. Sonuç olarak Kur'an'da küçüklerin nikâhı ve talâkı hakkında herhangi bir âyet mevcut değildir. Lakin iddetleri hakkında bir âyet mevcuttur. İddetin olabilmesi için cinsi münasebet veya halvet-i sahîha olması gerekir. Bu da fasit olan bir nikâhta ya da şüpheli bir durumda tasavvur edilebilir. Kur'ân, mevcut bir problem olma hasebiyle bu konuya temas etmiştir. Dolayısıyla Kur'ân'da evlilik yaşı ile ilgili olarak sarih bir düzenleme gelmemiştir. Bu konu toplum içerisindeki şartların gelişimine bırakılmıştır. Küçük yaşta evlilik konusunu bu bağlamda değerlendirmek daha sağlıklı ve bilimsel bir yaklaşım olacaktır."
