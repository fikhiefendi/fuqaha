abstract: "Kıraat farklılıkları olgusu, kökleri doğrudan Hz. Peygamber (s.a.v.) dönemine uzanan, ilmî açıdan oldukça önemli bir meseledir. Medine döneminde İslam'a sonradan giren insanların Kureyş lehçesini yeterince bilmemeleri ve telaffuz problemleri yaşamaları üzerine, Hz. Peygamber'in ümmeti için kolaylık dilemesi neticesinde Yüce Allah tarafından“yedi harf”ruhsatı verilmiştir. Bu ruhsat, bazı kelimelerin farklı şekillerde okunabilmesine imkân tanımış ve böylece kıraat farklılıkları ortaya çıkmıştır. Bu çalışmada, söz konusu kıraat farklılıklarını incelemek üzere, İslamî ilimlerin gelişiminde önemli bir merkez olan Medine beldesine ait kıraatler esas alınmıştır. Bu bağlamda, on kıraat imamı arasında yer alan İmam Nâfi' ve Ebû Ca'fer'in kıraatleri mukayese halinde ele alınmıştır. Çalışmanın temel amacı, bu iki kıraat arasında hem benzerlikleri hem de farklılıkları sistematik biçimde ortaya koymaktır. Çalışma giriş, iki bölüm ve sonuç kısmından oluşmaktadır. İlk olarak, giriş kısmında kıraat ilminin ve çalışmanın muhtevasına ilişkin bilgilere yer verilmiştir. Akabinde birinci kısımda iki kârinin ilmî kişiliklerine yer verildikten sonra fonetik özellikleriyle öne çıkan usulî farklılıklar değerlendirilmiştir. Bu farklılıkların tespiti ve analizi sırasında, Aşere tarîkinin yanında Takrîb tarîkide dikkate alınarak sistematik bir yaklaşım benimsenmiştir. Çalışmanın ikinci bölümünde ise Kur'ân-ı Kerîm'de belirli kelimeler üzerinde ortaya çıkan ferşî farklılıklar ele alınmıştır. Bu farklılıklar, mana üzerindeki etkilerine göre iki kategori altında değerlendirilmiştir. Manaya etki eden ferşî farklılıklar, kelime yapılarına göre sınıflandırılmış; ardından ilgili kıraatler hüccet yöntemiyle delillendirilmiş ve bu farklılıkların mana üzerindeki yansımaları ayrıntılı biçimde verilmiştir. Manaya etki etmeyen ferşî farklılıklar ise kelime köklerine göre tasnif edilmiş, ilgili âyet bağlamında ele alınarak her iki kıraatteki farklılıklar tespit edilmiş akabinde hüccetlendirme yöntemine gidilmişitr. Çalışmanın kapsamı, es-Sebu't-Tuvel diye adlandırılan yedi uzun sûre ile sınırlandırılmıştır. Bu doğrultuda, zikredilen Medine kârîlerinin kıraatleri arasındaki farklar, hem lafız hem de mana boyutlarıyla derinlemesine incelenmiştir."
