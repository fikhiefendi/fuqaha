abstract: "Eyyûbîler Dönemi'nde Dımaşk, siyasî istikrarı ve ilmî canlılığıyla birlikte farklı mezheplerin etkileşim içinde varlık gösterebildiği önemli bir ilim merkeziydi. Araştırmada, Eyyûbîler'in ve Dımaşk şehrinin siyasi, sosyal ve ilmî durumları incelenmiş; Eyyûbî yönetiminin mezhep politikaları ve el-Melikü'l-Muʿazzam'ın Hanefîliğe verdiği destek üzerinden dönemin mezhepler arası dengeleri araştırılmıştır. Bu dönemde Hanefî ulemâ, ilmî faaliyetleri, fetvaları ve eserleriyle Dımaşk'ın ilmî kimliğine yön vermiştir. Fakihler arasında içtihad ve taklîd, fıkhî kararlarda mezhep görüşlerine aykırılık, semâ, regâib namazı, telkin duası gibi meseleler etrafında yürütülen tartışmalar, dönemin fıkıh düşüncesinin canlılığını ortaya koymuştur. Ulemânın Dımaşk'ı tercih etme sebepleri, siyasî otoriteyle kurdukları ilişkiler ve sosyal hayattaki konumları, Hanefîliğin şehirdeki köklü varlığını açıklayan temel unsurlardır. Çalışma sonucunda, Hanefîliğin Eyyûbî Dımaşk'ında sadece bireysel bir tercih ya da ilmî yönelim değil, siyasî himaye, kurumsal destek ve ilmî üretimle beslenen çok boyutlu bir gerçeklik olduğu ortaya çıkmıştır. Bu tespit, fıkıh tarihine ve İslam hukukunun kurumsallaşma sürecine dair yeni bir bakış açısı sunmakta; mezheplerin tarihî gelişiminde siyasî, sosyal ve ilmî faktörlerin birlikte değerlendirilmesi gerektiğini göstermektedir."
