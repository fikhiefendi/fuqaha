abstract: "Franchise sözleşmesi önemli sözleşmelerden biridir. Zira dünya istatistikleri, başarılı olan projelerin %80'inin franchise projeleri olduğunu ifade etmektedir. Irak kanunu Mısır kanunundan çok etkilenmiştir. Zira her iki kanunda birbirine benzer çok metinler bulunmaktadır. Ayrıca Mısır'ın franchise sistemini uygulamada büyük bir tecrübesi bulunmaktadır. Çalışmamızda franchise sözleşmesi konusuyla ilgili Arapça ve yabancı araştırmalar, incelemeler ve fıkıh kitapları incelenerek Irak, Mısır ve Türk hukukunda karşılaştırmalı bir araştırma yöntemi takip edilmiştir. Franchise sözleşmesinin taraflarını franchise veren ve franchise alan oluşturmaktır. Bu sözleşme ile franchise veren, sahibi olduğu teknik bilgi ve marka haklarını franchise alana kullandırmayı ve onu sistemine entegre etmeyi üstlenir. Franchise verenin geliştirdiği sistemi kullanan franchise alan, bunun karşılığı olarak sürümü destekleme ve bir ücret ödemekle yükümlüdür. Franchise sözleşmesi karma bir sözleşmedir. Onun hukuki niteliği diğer sözleşmelerden farklıdır. Franchise sözleşmesi bağımsız bir sözleşme sistemi olup özel bir yasal sistemine ihtiyaç duymaktadır. Irak, Mısır ve Türk hukuk sisteminde, franchise sözleşmesi ve sona ermesi ile ilgili özel yasal bir düzenleme mevcut değildir. Sürekli bir borç ilişkisi kuran franchise sözleşmesinin de, her borç ilişkisi gibi bir sonu vardır. Bu sona ermenin gerek franchise alan gerekse franchise veren açısından çeşitli sonuçları bulunmaktadır. Çalışmamızda son olarak, franchise sözleşmesinin sona ermesinin sonuçları değerlendirilmiştir."
