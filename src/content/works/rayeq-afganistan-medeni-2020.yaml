abstract: "1977 tarihli Afganistan Medenî Kânunu'nun birinci kitabının ikinci faslında aile hukuku ile ilgili konular düzenlenmiştir. Bu bölümde, aile (m. 56-59), evlilik akdi (m. 60-89), evlilikten doğan sonuçlar (m. 90-130), evliliğin sona ermesi (m.131-197) ve evliliğin sonlandırılmasından doğan neticeler (m.198-336) incelenmiştir. Kânunun 131. maddesinde evlilik birliğinin sona ermesi için dört şekil belirlenmiştir: Fesih, talâk, hul ve tefrîk. Bu çalışmada anılan dört şekilden, kânunun ilgili maddelerinin kaynağını teşkil eden fıkıhta da tartışmalı bir konu olan yargı yoluyla boşanma sebepleri incelenmiştir. Konu Afganistan Medenî Kânunu esas alınarak, beş fıkıh mezhebi (Hanefî, Mâlikî, Şafiî, Hanbelî ve Ca'ferî) ve modern İslâm aile hukuku kânunlaştırmalarıyla mukayeseli olarak ele alınmıştır. Çalışma, bir giriş, iki bölüm ve sonuçtan oluşmaktadır. Girişte Afganistan Medenî Kânunu'nun tarihçe ve muhtevası, birinci bölümde evlilik bağının sonlandırılmasıyla ilgili farklı hukuk sistemlerindeki uygulamalar, konunun kavramsal çerçevesi ve hukukî sonucu konusunda fıkıh mezheplerinin değerlendirmeleri ele alınmıştır. İkinci bölümde fıkıh ve Afgan hukuk sisteminde yargı yoluyla boşanma sebepleri incelenmiştir. Bu bağlamda fıkıh öğretisinde ve seçilmiş bazı İslâm ülkelerinde yürürlükte olan kânunlar çerçevesinde, bedensel kusur ve hastalık, şiddetli geçimsizlik ve zarar, zevcenin nafakasının sağlanmaması ve kocanın evi terk edip kaybolması gibi nedenlerden dolayı yargı yoluyla gerçekleşen tefrîk tafsilatlı bir şekilde ele alınmıştır. Bu çalışmada evliliğin tefrîk yoluyla sonlanmasının hukukî niteliğinin belirlenmesi, Afgan hukuk sisteminde tefrîke sebep teşkil eden faktörlerin belirlenmesi ve kânunun fıkhî kaynaklarının tespiti amaçlanmaktadır. Afganistan Medenî Kânunu esas itibarıyla Hanefî mezhebi esas alınarak hazırlanmıştır. Ancak, Hanefî mezhebinde kadının mahkemeye müracaat ederek tefrîk talebinde bulunabilmesinin diğer fıkıh mezheplerine kıyasla oldukça sınırlı durumlarda mümkün olması sebebiyle kânunda yer yer Hanefî mezhebi dışındaki fıkhî görüşler dikkate alınmıştır. Kânunda nadiren de olsa meşhur fıkhî mezhep görüşlerinin dışına çıkılarak halkın sosyo-ekonomik durumları göz önünde bulundurulmuş, maslahat ilkesi gözetilmek suretiyle yeni içtihatlar ortaya konmuştur."
