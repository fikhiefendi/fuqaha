abstract: "Bu çalışmada, modern dönemin önemli tefsirlerinden biri olan İbn Âşûr'un“et-Tahrîr ve't-Tenvîr”adlı eserinde kadınlarla ilgli hükümlere yaklaşımı ele alınmıştır. Bu tezde, İbn Âşûr'un kadınlarla ilgili âyetleri nasıl yorumladığını, bu yorumların klasik İslâm hukuku ve modern yaklaşımlar açısından nasıl bir anlam ifade ettiğini incelenmiştir. Araştırma, İbn Âşûr'un kadınlarla ilgili hükümlere dair görüşlerinin hem geleneksel tefsir anlayışına hem de modern, sosyal ve hukuki ihtiyaçlara nasıl bir denge sunduğunu orta koymayı hedeflemektedir. Birinci bölümde, müfessirin Kur'ân-ı Kerîm âyetlerinden hareketle et-Tahrîr ve't-Tenvîr tefsirinde kadına genel bakışı, cinsiyet statüleri açısından konumunu ve ahlâk ilkeleri çerçevesindeki değerlendirmeleri ele alınmıştır. İkinci bölümde, kadınlara özgü ibadet hükümleri incelenmiştir. Özellikle hayız, nifâs, istihâza, kadınların örtünmesi gibi konulara dair müfessirin yorumları değerlendirilmiştir. Üçüncü bölümde ise, kadınlara yönelik hukukî hükümlere yaklaşımı ele alınmıştır."
