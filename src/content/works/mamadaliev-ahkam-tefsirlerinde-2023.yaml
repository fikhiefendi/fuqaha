abstract: "Hz. Peygamber zamanından itibaren her Müslüman toplumunda, Kur'an'ın hükümlerini anlayıp hayata tatbik etmek en önemli çalışma alanı ve dinî yaşamın vazgeçilmez unsuru olmuştur. Bu durum İslâm‎i hükümlerin ana kaynağı olan Kur'an'ın hüküm bildiren ayetlerinin açıklamasını yapan ahkâm tefsirlerinin oluşmasına vesile olmuştur. Bunun yanı sıra ‎fıkhî‎ mezheplerin teşekkülünden sonra bazı âlimler mensup oldukları mezhebin görüşlerini desteklemek amacıyla ahkâm tefsirleri telif etmişlerdir. Çalışmamızda bu tür eserlerin en meşhur örneklerinden olan Cessâs, Herrâsî‎‎‎, İbnu'l-Arabî ve İbn Receb el-Hanbeli'nin yazmış olduğu ahkâm tefsirlerindeki miras ile ilgili ayetlere dair yorumlarını ele aldık ve aralarındaki benzer ve farklı yaklaşımları mukayeseli bir şekilde ortaya koymaya çalıştık. Çünkü toplumun her ferdini ilgilendiren ve İslâm‎'daki hükmü ve uygulama şeklinin bilinmemesi, akrabalar arasında ciddi anlaşmazlıklara yol açan miras ve onun paylaşımı ile ilgili hükümler, tüm zamanlarda olduğu gibi günümüzde de güncelliğini korumaktadır. Çalışmamızda bu güncel mesele ile ilgili hükümler ayetler ışığında ortaya konulmuş ve miras paylarının ayetlerle kati bir şekilde sâbit olması hasebiyle, Müslümanların hiçbir şekilde ihmal etmemeleri gerektiğine vurgu yapılmıştır. Bu çalışmamız giriş, iki bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın adı, kapsamı, amacı, önemi ve yöntemi hakkında bilgi verilmiştir. Birinci bölümde Kur'an'ın ‎fıkhî‎ boyutunu konu edinen Ahkâmü'l-Kur'an‎ tefsirlerinin özellikleri, ortaya çıkışı, gelişimi ve bu alanda yazılan ahkâm tefsirlerinin tanıtımı yapılmıştır. İkinci bölümde ise kendi mezheplerine bağlılıklarıyla bilinen müfessirlerin Ahkâmü'l-Kur'an‎ tefsirleri ışığında miras konusu ele alınmış ve ilgili ayetler çerçevesinde vâris‎‎lerin miras paylaşımındaki durumları incelenmiştir."
