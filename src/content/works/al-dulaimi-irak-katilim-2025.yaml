abstract: "Coğrafi, tarihi, siyasi ve ekonomik pek çok özelliği paylaşan Irak ve Türkiye, bölgeyi etkileyen benzer istikrarsızlık koşulları ve krizlerin yanı sıra askeri darbeler ve iç sorunlar yaşamıştır. Elbette İslam ekonomisinin bu iki ülkelere girişinin diğer İslam ülkelerine göre daha gecikmesinde yukarıda saydığımız nedenler rol oynamıştır. Bu çalışmada Irak'ta katılım bankacılığının gelişimi ve halihazırdaki işleyişi ele alınmıştır. Araştırmada, Irak'ta Türk katılım bankalarının sayısını beş kat aşan İslami banka sayısına ve Irak toplumunun İslami işlemleri teşvik eden yapısına rağmen, Türkiye'nin İslami finans alanında Irak'tan birkaç adım önde olduğu sonucuna varılmıştır. Bunun nedeni, Türkiye'nin doksanlı yıllardan itibaren aşarak imar ve gelişme aşamasına girdiği Irak'ta halen mevcut olan siyasi istikrarsızlık durumunun yanı sıra, hükümetin bu sektöre verdiği destek ve geliştirmeye yönelik çabalarından kaynaklanmaktadır."
