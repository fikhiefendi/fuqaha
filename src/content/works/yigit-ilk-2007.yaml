abstract: "Tez, bir giri? (`Giri?: Tarih, yöntem ve literatür incelemesi') ve dört ana bölümden (Birinci Bölüm: `?lk dönem Hanefî kaynaklarının tesbit ve tahlili', ?kinci Bölüm: `Ebû Hanîfe'ye göre Sünnetin anlamı, kaynak değeri, tasnifi ve ifade ettiği hüküm', Üçüncü Bölüm: `Ebû Hanîfe'nin haber-i vahidi kabulü hakkında ileri sürülen bazı ?artlar', Dördüncü Bölüm: `Sünnetin Kur'an'a göre konumu ve tearuz halindeki hadisler') olu?maktadır. Tezde genel olarak yerle?ik Hanefî usûlünde sunulan Sünnet telakkisiyle erken dönem Hanefî kaynaklarında yer alan sünnete dair usûlî bilgiler mukayese edilmi? ve yerle?ik usûldeki Sünnet anlayı?ının Ebû Hanîfe'ye nisbet edilemeyeceği sonucuna ula?ılmı?tır. Sistematik dönem Hanefî kaynaklarına göre, ahad haberler Kur'an'ın umumî ve hususî ifadelerini beyan edemez, fakih olmayan raviden aktarılan kıyasa aykırı haberler ve genel konulara ili?kin ahad hadisler kabul edilemez. Ancak ilk dönem Hanefî kaynakları incelendiğinde bu anlayı?ın Ebû Hanîfe'ye ait olmadığı ve bunun ?sa b. Ebân gibi daha sonraki Hanefî usulcülerin formülasyonuna dayandığı anla?ılmaktadır. Ebû Hanîfe'ye doğrudan öğrencilik yapan Ebu Yûsuf ve ?mam Muhammed gibi müçtehidlerin aktarımına göre, Ebû Hanîfe de cumhur gibi Sünnet'e dayanarak Kur'an'daki umumî ve hususî ifadeleri açıklayıp, Sünneti me?hur-âhâd ayrımı yapmadan esas almı?tır. Tahâvî, Maturîdî, Dehlevî ve Ke?mîrî gibi alimlerin aktarım ve açıklamaları da mevcut Hanefî usulündeki genel yakla?ımın Ebû Hanîfe'ye nisbet edilemeyeceğini ortaya koymaktadır. Ayrıca, bu alimlerin temsil ettiği usul anlayı?ı, Hanefî usûlü tarihinde yerle?ik usûlden farklı ve Ebû Hanîfe'nin içtihadlarıyla daha uyumlu bir usulî bir çizgiyi kanıtlamaktadır. Ancak tarihi süreç içerisinde bu yakla?ım gölgede kalmı?, bunun yerine sistematik yönü ağır basan, ve daha rahat öğretilebilen ?sa b. Ebân, Cessâs ve Debûsî çizgisi öne çıkmı?tır."
