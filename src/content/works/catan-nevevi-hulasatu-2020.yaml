abstract: "Bu çalışmada Nevevî'nin hayatı ve eserleri hakkında kısaca bilgi verilmiştir. Ḫulâṣatü'l-Aḥkâm adlı eserindeki yöntemi ve hadis kaynakları tespit edilmeye çalışılmıştır. Nevevî'nin bu eserde serdettiği rivayetleri, tashih ve tazᶜifte izlemiş olduğu hadis değerlendirme yöntemi, mukayeseli olarak incelenip ortaya konulmaya çalışılmıştır. Ayrıca Nevevî'nin değerlendirmelerinin tamamı tespit edilmiş ve örneklendirme usûlüyle, rivayetin sıhhati hakkındaki kanaatinin isabetli olup olmadığı incelenmiştir. Müellif rivayetleri değerlendirmede genelde otorite imamlardan faydalanırken bazen de kendisi tashih ve tazᶜifte bulunmuş ve bu noktada kendine has farklı yöntemler kullanmıştır. Genel olarak yaptığı tashih ve tazᶜiflerin isabetli olduğu fakat bazen zayıf olan bir rivayet hakkında hasen ya da sahih değerlendirmesinde bulunduğu, şâhid ya da mütabiᶜlerle sıhhat kazanan bir hadis hakkında da zayıf nitelemesinde bulunduğu tespit edilmiştir. Bunun yanı sıra müellif Buhârî ve Müslim'in sıhhat şartlarını hadis değerlendirme yöntemi olarak kabul etmiş ve bu iki muhaddisin şartlarına göre rivayetleri tashihte bulunmuştur. Nevevî'nin âlimlere yönelik eleştirilerinin tamamı tespit edilerek incelenmiş ve râvi tenkitleri münekkit âlimler nazarında mukayeseli olarak örnekler üzerinden gösterilmeye çalışılmıştır."
