abstract: "Fıkıh literatüründe çokça kullanılan, doktrin ve uygulama açısından İslam fıkhının en temel kavramlarından biride hak kavramıdır. Toplum fertleri arasında hak ve sorumlulukları adalete uygun olarak düzenlemek hukukun temel işlevlerindendir. Zamanın ve imkânın değişip gelişmesi hak ve sorunlulukların bazen değişmesine sebep olurken bazen de yeni hak ve sorumluluklar doğurmaktadır. Bu bağlamda çalışmamızda İslam hukuku ve beşeri hukuk açısından Fikrî mülkiyet hakları başlığı altında sınaî mülkiyet ve telif hakları ele alınmıştır. Çalışma bir giriş, üç bölüm ve bir sonuçtan oluşmaktadır. Giriş bölümünde öncelikle çalışmanın önemi ve amacı üzerinde durulmuş, kapsamı belirlenmiş ve bu konuya yakın çalışmalara yer verilmiştir. Birinci bölüm fikrî mülkiyetin kavramsal çerçevesi üzerine olup, fikrî mülkiyetin mahiyeti, kısımları, özellikleri ile eser sahipliği ve bağlantılı haklar genelde beşeri hukuk açısından değerlendirilmiştir. İkinci bölüm İslam hukuku açısından fikrî mülkiyet hakları ve bu haklarla bağlantılı; hak, mal, menfaat ve mülkiyet kavramlarını içermektedir. Üçüncü bölüm de ise fikrî mülkiyet haklarının satış ve icâre yoluyla bedel karşılığında intikali, hibe, miras, vasiyet ve vakıf yoluyla bedelsiz olarak intikali incelenmiştir. Çalışmamız araştırma neticesinde elde edilen bulguların yer aldığı“Sonuç”bölümü ile tamamlanmıştır."
