abstract: "Bu çalısma dinden dogan dini bir grup olan Caferileri konu edinmektedir.Caferi mezhebi, imamlara inanmayı imanın sartlarından biri olarak görürler. Onlaritikat, ibadet ve muamelatta Imam Cafer es-Sadık'ın görüslerini kabul ederler.Onlara göre, Cafer es-Sadık imamların en büyügü ve özellikle Sii fıkhını veitikadının kurucusudur. Bundan dolayı da kendilerinden bir mezhep olarakbahsederlerken Caferiyye ismini kullanmaktadırlar.Iran, Azerbaycan ve Afganistan basta olmak üzere dünyada bir çok ülkedebulunan Caferilere ülkemizde de rastlanmaktadır. Azeri kökenli olan TürkiyeCaferileri genellikle Kars ve Igdır illerinden diger sehirlere göç etmislerdir. Istanbul,Ankara ve Izmir gibi büyük sehirlere yerlesen Türkiye Caferilerin total nüfuslarıylailgili herhangi bir çalısma bulunmamaktadır. Bundan dolayı da Caferi nüfus ile ilgilifarklı rakamlar dile getirilmektedir. Caferilere ait bazı internet sitelerinde 3 milyonnüfustan söz edilirken, bazı arastırmalarda bu sayı 1- 1,5 milyon olarakverilmektedir. Bu çalısmanın arastırma alanında ise yaklasık olarak 4.500 bin Caferinüfus bulunmaktadır.Caferilerin dini ve sosyal hayatıyla ilgili olan arastırma giris ve üç bölümdenolusmaktadır. Giris kısmında arastırmanın konusu, amacı ve önemi, sayıltı vedenenceleri, kapsam ve sınırlılıkları ve yöntemi ile ilgili konular üzerindedurulmustur. Birinci bölümde grup, sosyal grup, sosyal ve dini grupların çesitleri veözellikleri, mezhep ve Caferi mezhebi, Caferilerde inanç esasları, Caferilerde ibadethayatı gibi konularda bilgiler verilmistir. Ikinci bölümde alan arastırmasından eldeedilen veriler dogrultusunda, analizler yapılarak yorumlarda bulunulmustur. Üçüncübölümde de arastırmanın sonuçlarına yer verilmistir"
