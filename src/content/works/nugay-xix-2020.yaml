abstract: "XIX. yüzyılda birçok ülke, ceza hukuku alanında önemli benzer değişimlere sahne olmuştur. Bu anlamda yerel mahkemelerden farklı olarak ceza mahkemeleri kurulduğu ve yeni ceza kodları hazırlandığı görülür. Bu çalışmanın amacı, XIX. yüzyılda benzer süreci geçiren Osmanlı Devleti'nin, ceza hukuku alanında yaşadığı değişime odaklanarak bunun sonuçlarını gözler önüne sermektir. Bunu yaparken Michel Foucault'nun değişimi, uzun bir süreçte tek bir konu üzerinden ele aldığı kuramsal çerçeve kullanılmış, bu bağlamda sürecin detaylarını daha iyi izlemek adına tek bir suç üzerine, katl suçu üzerine odaklanılmıştır. Yaşanan değişim sürecinin kendi içerisinde üç farklı seyir izlediği tespit edilmiştir. Bu süreçlerden ilki, Osmanlı taşrasında ceza meclisleri kurulduğu, 1840 ve 1851 tarihli Ceza Kanunlarının hazırlanarak yürürlüğe konulduğu, 1858'e kadar devam eden süreçtir. Meydana gelen değişim birçok ülke ile ortak olsa da meclislerin kurulma nedeni ve kanunların içeriği özgün olduğu görülmüştür. Bu değişimi, Osmanlı'nın ceza hukuku alanında yaşadığı en önemli kırılma olarak değerlendirdiğimiz 1858 tarihli Ceza Kanunu'nun yürürlüğe konması ve uygulanması süreci izler. Mezkûr kanunun uygulanması ile birlikte ceza hukukunun dilinde ve özünde önemli farklılaşmaların meydana geldiği görülmüştür. İncelediğimiz sürecin sonlarına doğru Osmanlı Ceza Hukukunda yaşanan son değişim ise XIX. yüzyıl sonları- XX. Yüzyıl başlarında ceza hukuku felsefesinde pozitivist etkinin görülmeye başlanmasıdır.Çalışmanın sonunda, birçok ülkenin ceza hukuku alanında yaşadığı benzer değişimlere Osmanlı Devleti özelinde bakılarak Osmanlı Ceza Hukukun Tanzimat'ın ilanından itibaren geçirdiği çeşitli değişimlerin doğal bir sonucu olarak 1926 tarihli Türk Ceza Kanunu'nun kabul edildiği ifade edilecek, özellikle 1858 Ceza Kanunu ile ceza hukuku dilinin süreç içerisinde değiştiği, buna hukukun şer'îliğini sağlayan halifeliğin kaldırılması da eklenmesiyle XX. yüzyılın başında ta'zîrin Türk Ceza Hukuku literatüründen kalktığı sonucuna ulaşılacaktır."
