abstract: "İslam tarafından yasaklanan faiz olgusunu dikkate alarak kurgulanan katılım bankalarında, müşterilere diğer banka türlerinden farklı olarak, faiz içermeyen yatırım ürünleri alternatifleri sunulmaktadır. Temelde kar ortaklığına dayanan ve faizden arındırılmış bu ürünlerdeki çeşitlilik, katılım bankacılığı müşterileri açısından yatırım tercihlerini şekillendiren unsurların belirlenmesi gerekliliğini ortaya çıkarmaktadır. Bu noktada müşterilerin sahip olduğu İslami finansal okuryazarlık düzeyinin hem katılım bankacılığı ürünlerini anlama da hem de buna bağlı yatırım tercihlerini şekillendirmede etkili olacağı düşünülmektedir. Bununla birlikte diğer tüm yatırım türlerinde olduğu gibi katılım bankacılığı müşterilerinin risk toleranslarının da yatırım tercihlerini şekillendiren en önemli unsurlardan olduğu bilinmektedir. Bu noktadan hareketle hazırlanan araştırmada, katılım bankacılığı müşterilerinde İslami finansal okuryazarlığın yatırım tercihlerine etkisinde finansal risk toleransının aracı rolünün belirlenmesi amaçlanmıştır. Araştırmaya katılım bankacılığı ürünlerini kullanan ve düzenli yatırım yapan, Gaziantep'te yaşayan 452 müşteri dahil edilmiştir. Hipotezlerin test edilmesi için Smart PLS 4 ile kısmi en küçük kareler yöntemi kullanarak yapısal eşitlik modellemesi yapılmıştır. Araştırmadan elde edilen bulgulara göre İslami finansal okuryazarlık düzeyi, finansal risk toleransı ile varlığın geçmiş performansı, sosyal sorumluluk ve getiriye dayalı yatırım tercihini artırmaktadır. Bununla birlikte finansal risk toleransı varlığın geçmiş performansı ve sosyal sorumluluğa dayalı yatırım tercihini artırırken; İslami finansal okuryazarlığın varlığın geçmiş performansı ve sosyal sorumluluğa dayalı yatırım tercihine etkisinde aracı rol üstlenmektedir."
