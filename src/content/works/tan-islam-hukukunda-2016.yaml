abstract: "Tez, bir Giriş ve iki Bölümden oluşmaktadır. Giriş bölümünde tezin hazırlanmasında takip edilen yöntem ve konu hakkında yapılan daha önceki çalışmalar hakkında bilgi verilmektedir. Birinci Bölüm, İslam Hukukunda İctihad Taklid ve Telfîkin Tarifi ve Mâhiyeti başlığını taşımaktadır. Bu bölümde Usulcülerin İctihâd, Taklîd ve Telfîk kavramlarını nasıl tanımladıkları tespit edilmekte bu kavramların mâhiyetlerine ilişkin olarak ortaya atılan görüşler değerlendirilmektedir. Taklid ve Telfîk İle İlişkisi Açısından İctihâd konulu İkinci Bölüm'de bu üç kavram arasındaki kavramsal ilişki ele alınmaktadır. Bu üç kavramla ilgili yaklaşımların İslam hukûkunun uygulanması açısından ne gibi pratik sonuçlar doğurduğu tartışılmaktadır."
