abstract: "Aile toplumun atomize olmuş en küçük yapı taşıdır. Aileyi meydana getiren fertlerin korunması, geleceklerini en iyi şekilde planlamaya çalışan toplumların temel amaçları arasında olmuştur. Devletler, çocuklarına verdikleri önem nispetinde geleceklerini biçimlendirebilirler. Ruhen ve bedenen sağlıklı bireyler yetiştirmek kadar neseben sağlıklı toplumlar oluşturmak da devletlerin önemli hedeflerindendir. Tarihin ilk dönemlerinden beri, çocukların korunması her toplumun önemli gündemlerini teşkil etmiştir. Zaman içerisinde, daha iyiyi ortaya koyma bakımından sistemleşme ve kurumsallaşma yolunda bu konuda önemli çalışmalar yapılmıştır. İslam hukukunda, konu çocuk ve toplum orjinli ele alınmış, nesli korumayı esas alan temel prensipler vaz edilmiştir. Buna göre neslin dolayısıyla çocukların korunması, İslam dinin en temel gayelerinden birini oluşturur. Bu çalışmada kimsesiz, yardıma ve bakıma muhtaç çocukları koruma yöntemlerinden“Koruyucu Aile”konu edinildi. Koruyucu Aile, evlat edinme konusu ile karıştırılabilmektedir. Konu, sadece İslam hukuku verileri ile değil Sosyal Hizmetler ve Medeni Hukuk ile mukayeseli olarak incelendi. Çalışmada, İslam hukuku sistematiği içerisinde“Koruyucu Aile”metodunun, dinin gerektirdiği hassasiyetler göz önüne alarak uygulandığında mahsur oluşturmayacağı kanaatine varıldı."
