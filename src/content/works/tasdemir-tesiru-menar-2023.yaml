abstract: "Allah'ın koymuş olduğu hükümlerin nihai amacı, insanların fıtrî yapılarını koruyup fert ve cemiyetin maslahatlarını gerçekleştirmektir. Böylece yararlı sonuçların elde edilmesi ve faydalı olmayanların giderilmesi hâsıl olur. Yüce Allah'ın kâinatta hiçbir şeye ihtiyacı olmadığı gibi insanların kulluğuna da ihtiyacı yoktur. İnsan imtihan vesilesi olarak dinin emir ve yasaklarıyla mükellef kılınmıştır. Gerçekleşen bu imtihan kulun yaptıklarına mukabil mükâfat veya tecziyeyle sonuçlanmaktadır. Bu çalışma çağdaş âlimlerden Muhammed Abduh ve Muhammed Reşîd Rıza'nın hayatları ve her ikisinin ortak eseri olan Tefsîrü'l-Menâr'da Hikmet-i Teşrî' yi konu edinmektedir. Hikmet-i Teşrî' konusu genelde İslâmî ilimler özelde İslâm hukukunun bir alt konusu olup hükümlerin neden ve ne için vaz' edildiği sorularına cevap veren bir ilim dalıdır. Bu ilim dalında akılla sorgulama yapıldığı için“hükümlerin felsefesi”de denilmiştir. Fıkıh usulü ilminin önemli konuları arasında yer alan bu konu, Yüce Allah'ın hüküm vaz' ederken bir maslahat ve bir gaye ya da bir fayda gözetip gözetmediği sorularına cevap veren malumatları içermektedir. Fıkıh usulü eserlerinde genellikle“makasıdü'ş-şerîa”,“makasıdü'ş-şâri'”,“makasıdü't-teşrî'”,“el-makasıdü'ş-şer'iyye”gibi tamlamalarla ifade edilen makasıd düşüncesi çağdaş bazı çalışmalarda“ehdâfü'ş-şerîa, Hikmet-i Teşrî' ve rûhu'ş-şerîa”gibi tabirlerle de ele alınmıştır. Kur'an'ın birçok âyetinde dünyada yaratılan her şeyde bir nizamın olduğu hiçbir şeyin boşuna yaratılmayıp bir gaye ve maksada binaen yaratıldığı ifade edilmiştir. Naslarda ifade edilen bu gaye ve hikmetler evrenin dizaynında olduğu gibi itikat, ibadet ve muâmelat gibi şer'i hükümlerde de mevcuttur. Kısacası Hikmet-i Teşrî' evrendeki düzen ile dini emir ve yasakların hikmetini açıklayan bir ilim olarak karşımıza çıkmaktadır. Muhammed Abduh ve Reşid Rızâ, Tefsîrü'l-Menâr adlı eserde ayetleri açıkladıktan sonra yer yer hadis ve klasik eserlerden de faydalanarak hükümlerin hikmetini açıklama yoluna gitmişlerdir. Çalışmamızın temel kaynağı olan bu eser incelenerek, şari' tarafından vaz' edilmiş hükümlerin maslahat ve hikmetlerini itikat, ibadet ve muâmelat başlıkları altında toplanmaya çalışılmıştır."
