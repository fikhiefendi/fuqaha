abstract: "Bu tezde 2015 yılında faaliyete başlayan kamu katılım bankalarının katılım bankacılığına olan etkisinin incelenmesi amaçlanmıştır. 2016 yılında faaliyetlerine son verilen Bank Asya Katılım Bankasının, katılım bankacılığına vermiş olduğu zararın tespiti ve bu zararın finans sektörüne etkisini azaltmak için kurulan kamu katılım bankalarının sektöre etkisinin incelenmesi çalışmanın bir diğer amacını oluşturmaktadır. Küresel bankacılık sistemi faize dayalı bir yapı benimsediği için dini hassasiyetleri olan kişiler tarafından pek tercih edilmemektedir. Bu kapsamda faizsiz ekonomik faaliyetler vaadeden ''finans kurumları'' Türkiye'deki ilk yolculuğuna 1985 yılında başlamıştır. 2005 yılında ''katılım bankacılığı'' ismini alan bu finans kurumları, yıllar içerisinde gelişerek finans ve bankacılık sektöründeki payını hızla büyütmüştür. Türkiye'deki yolculuğuna, 2015 yılına kadar sadece özel girişimle devam eden katılım bankacılığı sektörü, kamu kesiminin de faizsiz finans sistemine olan ilgisiyle toplam bankacılık sistemi içerisindeki payını arttırmaya devam etmektedir. 2015 yılında Türkiye'de ilk olarak Ziraat Katılım Bankası daha sonra Vakıf Katılım Bankası ve Emlak Katılım Bankası'nın kurulmasıyla üç kamu katılım bankası faaliyetlerine başlamıştır. Finansal sistem Çalışmanın amaçları ve hedeflerine uygun olarak belirlenen araştırma sorularına yanıt aranırken hem nitel hem de nicel araştırma yöntemlerinden faydalanılmıştır. Çalışma konusunun seçilmesindeki neden Kamu katılım bankalarının mali bilanço ve konsolide verileri ışığında katılım bankacılığı sektöründeki payının hesaplanmasıdır. Sonuç olarak kamu katılım bankalarının 4 yıllık faaliyet sürecinde dört özel katılım bankasının sektördeki payına ancak ulaşabildiği tespit edilmiştir."
