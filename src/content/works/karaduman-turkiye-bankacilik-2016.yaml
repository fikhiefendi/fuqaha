abstract: "Ekonomik sistem içerisinde hukuki ve sermaye yapısı güçlü bankacılık sistemi ülke gelişimine ve tasarruf sahiplerine güvenli bir ortamda yatırım yapma imkanı sağlayacaktır. Çalışmamın amacı mevduat ve katılım bankalarının verimlilik analizlerini araştırmaktır. Bu amaç doğrultusunda çalışmamızda bağımlı değişken olarak Net Dönem Kârı (Zararı)/Toplam Aktifler, Net Dönem Kârı(Zararı)/Özkaynaklar, Sürdürülen Faaliyetler Vergi Öncesi Kâr (Zarar)/Toplam Aktifler; bağımsız değişkenler olarak ise Sermaye Yeterliliği, Bilanço Yapısı, Aktif Kalitesi, Likidite, Gelir-Gider Yapısı Rasyolarından bazıları kullanılmıştır. Bağımlı ve bağımsız değişkenler arasındaki ilişkiyi tespit etmek için lojistik regresyon analizi ile değerlendirilmiştir. Çalışmamızdaki analizler 2009-2014 dönemini kapsamaktadır. Çalışmanın sonucuna göre Likidite, Gelir-Gider Yapısı ve Faaliyet Rasyosu bağımsız değişkenlerinin bağımlı değişkenler üzerindeki etkisi anlamlı iken diğer bağımsız değişkenler ise anlamlı değildir."
