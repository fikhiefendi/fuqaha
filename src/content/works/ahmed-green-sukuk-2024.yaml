abstract: "Temiz enerji çağrısının, Birleşmiş Milletler ve Dünya Bankası gibi uluslararası kuruluşlar için büyük bir görev haline geldiği, yeşil enerji kaynaklarına olan küresel çağrı göz önünde bulundurulmaktadır. Bu durum, yeşil kaynaklar için finansmanın sırasıyla SDG 7, SDG 12 ve SDG 13 ile uyumlu olmasını sağlamıştır. Yeşil finansman, İslami Şeriat'ın tüm yönleriyle toplum odaklı, kalkınma ve toplum dostu finansman biçimlerini önceliklendirdiği ile de uyumludur. Bu çalışma, Nijerya'da devam eden elektrik enerjisi kesintilerine çözüm sunmayı amaçlamakta ve bu çözüm, üç Ijarah Yeşil Sukuk finansman modelinin geliştirilmesi yoluyla önerilmektedir. Çalışmanın ilk iki bölümü, Nijerya'daki enerji sektörünün geçmiş ve mevcut kapasitelerini; üretim tesisleri, iletim kanalları, dağıtım şirketleri ve sektöre sağlanan çeşitli iç ve dış finansmanları incelemiştir. Takip eden bölümler, hem hükümet hem de kamu sektörleri tarafından yapılan çeşitli Sukuk ihracatlarını tartışmış ve tümünün ihracat, performans ve genel etki açısından %100 başarılı olduğu sonucuna varılmıştır. Ayrıca, çalışmada enerji sektörü kredileri ve bunların hizmet maliyetleri de değerlendirilmiş, sektördeki büyük mali harcamalara rağmen düşük verim alındığı belirtilmiştir. Bununla birlikte, farklı sektörlerden katılımcılarla yapılan mülakatlar, katılımcıların etik bir finansman yoluyla sürekli elektrik enerjisi için ödeme yapmaya olan ilgisini göstermiştir. Yeşil Sukuk finansmanı, Nijerya'daki enerji sektörü sorunlarına bir çözüm olarak değerlendirilmekte ve federal veya eyalet hükümetleri tarafından çeşitli topluluklara ve nüfusa güneş enerjisi sağlamak üzere kullanılacak üç Ijarah Sukuk modeli önerilmektedir. Üçüncü model bireyselleştirilmiş güneş sistemi için mülkiyetle sonuçlanan bir Ijarah kiralama şeklindedir. Güneş Sukuk'u, bireysel hane halkı, vi üreticiler, işletmeler, hastaneler, okullar vb. hizmet vermek üzere tasarlanmış güneş çiftliği ve bireyselleştirilmiş güneş sistemi şeklinde geliştirilmiştir. Sukuk yatırımı, projenin geliştirilmesinde kullanılacak fonları sağlayan yatırımcılar tarafından abone olunur ve bunlar kira şeklinde yıllık getiriler alırlar. İhraç eden hükümet, 'Kiraya Veren' olarak bir SPV kaydettirir ve bu SPV, model I, II ve model III'te güneş çiftliği geliştirme ve güneş sistemi kurulum projelerini yürütecek olan bir hükümet kurumu ve güneş sistemi üreticisini geliştirici olarak atar. Kiraya Veren, tüm modellerde elektrik tüketimi için ödeme yaparken, bireyselleştirilmiş güneş sistemi durumunda kısmi mülkiyet için de ödeme yapar. Getiriler, kira ödemeleri ve bireyselleştirilmiş güneş sisteminin mülkiyetinin kısmi ödemesi olarak yatırımcılara dağıtılır. Yapılan bir hipotez çalışması, güneş elektriğinin tüketim ve edinim maliyetinin ülkedeki geleneksel güç sisteminden çok daha ucuz olduğunu göstermektedir."
