abstract: "İslami bankacılık faaliyetlerinin yürütüldüğü ülkelerin hemen hemen tamamında konvansiyonel bankacılık sistemi de bulunmaktadır. Bu çift başlı yapı hem felsefi hem de işleyiş bakımından farklı olan iki sistemin, merkez bankalarınca aynı geleneksel politikalara maruz kalmasına neden olmaktadır. Bu duruma günümüzün en önemli para politikası araçlarından biri olan zorunlu karşılık uygulaması bir örnektir. Çoğu ülkede, İslami Bankacılık ve Finans sistemleri de bu ilke uyarınca çalışır. Çalışmanın amacı, Türkiye'de faaliyet gösteren katılım bankaları ile Türkiye Cumhuriyet Merkez Bankası arasındaki ilişkileri alternatif yeni modeller ile yeniden şekillendirmektir. Bu kapsamda, çalışmada öncelikle finansal piyasalar incelenerek teorik alt yapı oluşturulacaktır. Daha sonra faizsiz finansın vizyonu ve misyonu üzerinde durulacaktır. İslami bankalar ile merkez bankalarının ilişkileri detaylıca irdelendikten sonra, günümüzdeki mevcut uygulamalar üzerinde durulacaktır. Nihayetinde, merkez bankalarının faiz dışı elde ettiği gelirleri, İslami bankalar ile ortaklık esasına göre paylaşabilecekleri iki yeni öneride bulunacaktır. Bunlardan ilki, çalışma içerisinde“Gelir Ortaklığı Senetleri”olarak isimlendirilmiş olan yeni bir İslami menkul kıymettir. Mudâraba, Muşaraka ve İcara sukuk şeklinde ihraç edilecek olan bu menkul kıymet, Türkiye'deki katılım bankalarının TCMB'yi finanse etmesini sağlayacaktır. Daha sonra bu sistemin organizasyon altyapısı kullanılarak, katılım bankalarının zorunlu karşılıklardan elde ettikleri faiz gelirleri,“vekâlet”akdi ile kar/zarar ortaklığına dönüştürülmeye çalışılacaktır."
