abstract: "Hz. Meryem kıssası, mutasavvıf müfessirlerin dikkatini çekmiş ve söz konusu kıssa işârî yorumlarla açıklanmaya çalışılmıştır. Bu bağlamda kıssanın, Mushaf'taki tertibe riayet edilerek ve zâhîrî mâna dikkate alınarak işârî yönden incelenmesi, alana önemli bir katkı sunacaktır. Kıssaların tarihteki varlıklarını kabul edip aktaran sûfî müfessirler, âyetlere mistik mânalar vererek sembolik anlamlar yüklemişler, geçmiş toplumların yaşadıklarını birer ibret vesikası olarak değerlendirmişlerdir. Genel manada işârî tefsirlerde, müfessirlerin Hz. Meryem kıssasını keşf ve ilhama dayanarak yorumladıklarını ve ortak bir düşüncede birleştiklerini söylemek mümkündür. Hz. Meryem kıssasının içerdiği olağanüstü haller, ârifler için örnek ve insan-ı kâmil olma serüveninde yol işareti mesabesinde görülmüştür. İşârî tefsirlerde Hz. Meryem, Nefs-i Zekiyye/arınmış nefsi sembolize eder. Sûfî ârifler nefsini arındıran insanın, Nefs-i Zekiyye/Hz. Meryem gibi hak ve hakikatin sözcüsü olan kâmil rûhu doğurabileceği yorumunu yapmaktadır. İşârî tefsirleri incelerken sûfîlerin âfakî ve enfüsî âyetleri çift boyutlu incelediklerini ve insanın dışında cereyan eden olaylarla iç âleminde olan hadiseleri mezcetmiş olduklarını tespit ettik. Bu da insanın iç âleminde olanları mikrokozmik bir dramatizasyonla yorumlarken kıssalardan istifade edilebileceğini göstermektedir. Sûfî müfessirler kıssalara masal değil misal olarak baktıklarından, Hz. Meryem kıssasından alınan mesajlarla âriflerin seyr-i sülûk'ta takip edecekleri birtakım prensiplere ulaştıklarını söylemek mümkündür."
