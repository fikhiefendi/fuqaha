abstract: "Sosyal bilimler, farklı coğrafi çevrelerde insanı birbirine bağlayan toplumların ihtiyacıyla karakterize edilen insan gerçekliği çalışması dışında, karakterini örtüşmekten ve bazılarının etkisinden edinmemiştir. Para hayatın can damarıdır ve insan onu sevmeye alışmıştır, bu paraya, onu elde etmenin yolları ve harcama biçimleri ile toplumun ilerlemesine olan katkısı arasında görevler vardır.. Nedeniyle toplumlar fonksiyonu ve para rolünü ayarlamak için çeşitli katkıları var ve İslam çeşitli disiplin ve para doktrin ve hukuk için bu rolü bağlayan eşsiz olduğunu ve bugüne kadar İslam Devleti ortaya çıkmasından itibaren, farklı dönemlerden aracılığıyla ortaya hakim farklı inançlara. katkılarından diğer medeniyetler, ama insanın acı deneyimler birçok haksızlıkları uğradığı ve modern çağda Batılıların bir sosyal rolü Bhljh o parayı bulduk ve bu nedenle sermayenin toplumsal rolünün kavramını ortaya çıkarmıştır ve onlar prosedürler ve uygulamalar bir dizi üzerinden yaptıktan sonra. Arap ve İslam toplumlarımız Batı önerisini kabul etmiş ve bunu toplumlarımızda uygulamaya çalışmıştır. Ancak sermayenin sosyal sorumluluğu, başta Waqf olmak üzere pek çok mekanizmada kendini gösteren bir İslami kültürel mirastır. Araştırmacı ayrıca, İslam hukukunun öğretileriyle uyum sağlamak ve tipik yan dışına kanunun amaçları için uygulanan pratik tarafı devreye ihtiyacını, gelişmeler ve sarkıtlar hukuk sabit dikkate mali tasarruflarda bulunabilir ve onlara uygulama amaçları meşruluk ve çizmek hükümler, kurallar ve yönetmelikler önerir, amaçları meşruiyet ile ilgili bilimsel çabalarını birleştirip gereğini önerir finansal işlemler bankacılık ve araştırma, çalışmaların tahsisi ve daha doğru İslami bankacılık sözleşmelerinde bir çalışma olarak ortaya çıkan ve İslami bankaların çıkarları burada yer alan meşruiyet amaçlarını ve Şeriat sahipleri netleştirmek için"
