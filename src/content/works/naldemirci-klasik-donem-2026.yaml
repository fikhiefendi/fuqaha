abstract: "Bu çalışma, sarf konusu özelinde Hanefî fürû fıkıh literatürünün tarihsel gelişimini incelemeyi konu edinmektedir. Çalışmanın amacı, klasik dönem Hanefî fürû eserlerinde sarf konusunun ele alınış biçimini tespit etmek ve süreç içerisinde meydana gelen değişim ile gelişimi ortaya koymaktır. Sarf akdinin, ribâ yasağıyla doğrudan ilişkili olması ve İslam hukukunda önemli bir yere sahip olması, bu konunun seçilmesinde etkili olmuştur. Çalışmanın kapsamı el-Asl, Şerhu Muhtasari't-Tahâvî, et-Tecrîd, el-Esrâr, el-Mebsût, Bedâiʿu's-sanâiʿ ve el-Hidâye isimli eserlerle sınırlandırılmıştır. Çalışma iki ana bölümden oluşmaktadır. İlk bölümde sarf konusunun eserlerdeki yeri, kapsamı ve temel meseleleri incelenmiş olup ikinci bölümde ise eserlerin meseleleri ele alış yöntemleri, kullanılan deliller ve görüş farklılıkları değerlendirilmiştir. Yapılan incelemeler sonucunda, sarf konusunun bütün eserlerde önemli bir yere sahip olduğu ve zaman içerisinde hem içerik hem yöntem bakımından gelişim gösterdiği tespit edilmiştir. İlk dönem eserlerinde meselelerin daha çok örnekler üzerinden ele alındığı, sonraki dönemlerde ise daha düzenli ve sistemli bir anlatımın benimsendiği görülmüştür. Sonuç olarak çalışma, Hanefî fürû fıkıh literatürünün tarihsel süreç içerisinde hem kendi çizgisini koruduğunu hem de zamanla gelişim gösterdiğini ortaya koymaktadır."
