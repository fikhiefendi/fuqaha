abstract: "Bu çalışmada neoliberal finansal küreselleşme süreci ele alınmış, finansal serbestleşmenin krizler ile ilişkisi ve iktisadi sonuçları incelenmiş, finansal kriz teorileri hakkında bilgiler verilmiş, katılım bankalarının işleyiş sistemi, ürünleri ve konvansiyonel bankalardan ayrışan yönleri, finansal istikrara katkıları ve bankacılık krizlerini önlemedeki rolleri belirtilmiştir. Akabinde Türkiye'deki katılım bankalarının krizleri önlemedeki rolleri ve krizler karşısında kırılganlıklarının değerlendirilmesinde ve açıklanmasında 2008 krizini de kapsayan 2006-2012 dönemi ele alınmıştır. Ele alınan bu dönemde katılım bankalarının başlıca parametreler itibariyle büyüklükleri ve sektördeki payları, topladıkları mevduatları, topladıkları mevduatların krediye dönüşüm oranları, kullandırdıkları kredilerin dağılımı ve kompozisyonu gibi temel göstergeleri ile IMF ve TCMB finansal sağlamlık endeksleri kapsamında aktif kaliteleri, likiditeleri, karlılıkları, sermaye yeterlilikleri, kur riskleri ve piyasa risklerine yönelik rasyoları banka ölçekleri göz ardı edilerek mevduat bankaları ve sektör ortalamaları ile mukayese edilmiştir."
