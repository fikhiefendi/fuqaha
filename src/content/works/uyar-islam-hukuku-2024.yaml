abstract: "Kooperatif ortaklığı, bireylerin bir araya gelerek oluşturduğu, kâr amacı gütmeyen ve ortakların ekonomik güçlerini birleştirerek onları güçlendirmeyi amaçlayan bir topluluktur. Tez çalışmamızda, kooperatif ortaklıkların İslam hukuku akitleri arasındaki yeri belirlenmiş, kuruluş ve geçerlilik şartları açısından bir değerlendirme yapılmış ve kooperatif ortaklık unsurlarının fıkhi analizi gerçekleştirilmiştir. Çalışmamız, giriş ve sonuç bölümleri dahil olmak üzere beş bölümden oluşmaktadır. Giriş bölümünde konunun önemi ve çalışmanın sınırları, amacı ve yöntemi ile kaynaklarına dair bilgilere yer verilmiştir. Birinci bölümde kooperatif kavramı, temel özellikleri ile dünya ve Türkiye'deki tarihi gelişimi ele alınmıştır. İkinci bölümde, kooperatif ortaklıkların kuruluş süreçleri, kooperatif şirketin kuruluş aşamasında hazırlanması ve imzalanması gereken anasözleşme hükümleri ile anasözleşme değişiklikleri incelenmiştir. Ayrıca, kooperatif ortaklık niteliğinin kazanılması ve kaybedilmesi gibi ortaklık işlemleri de açıklanmıştır. Üçüncü bölümde ise kooperatif ortaklıkların İslam hukuku çerçevesinde ne tür bir akit olduğu, kurulma ve işleyiş aşamasında karşılaşılan hataların tespit edilmesine ve bu hataların alternatif yöntemlerle nasıl düzeltileceğine dair bir inceleme gerçekleştirilmiştir."
