abstract: "Tahkikini yaptığımız eser haşiye türü eserlerden biridir. Eserin müellifi Kalyûbî 17. yüzyılda yaşamış çok yönlü bir âlimdir. Birbirinden farklı alanlarda eser yazmış, gelecek nesillere ışık tutmuştur. Tahkik işinin kolay olmadığını ikrar etmekle birlikte, geçmiş ulemanın mirasına sahip çıkmanın yegâne yolunun buradan geçtiğini de ifade etmek gerekir. O halde bizlere düşen, önemli görülen eserlerin gün yüzüne çıkarılması ve başkalarının istifadesine sunulması için gayret etmek ve bu işi önemsemektir. Günümüzde birçok değerli eserin batılı kütüphanelerde olması, batılıların bu işe ayrı önem gösterdiğinin bir kanıtıdır. Öyle görülüyor ki ellerinden gelirse - kötü emellerine ulaşmak için - bütün ilmi mirasımızı kendi kütüphanelerinde depolamaktan geri durmayacaklardır. Tezimizin birinci bölümünde; Kalyûbî'nin hayatı, ilmî şahsiyeti ve eserleri hakkında genel bilgiler verdik. İkinci bölümde metin, şerh ve tahkikini yaptığımız hâşiye hakkında genel bilgileri verdik. Daha sonra elimizde mevcut nüshalar hakkında bilgiler verdik. Tahkikte takip ettiğimiz metot hakkında da bilgileri anlatmaya çalıştık. Üçüncü bölümde ise eserin tahkikli metnini vererek çalışmamızı sonlandırdık."
