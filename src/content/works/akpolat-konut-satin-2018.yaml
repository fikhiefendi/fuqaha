abstract: "Bu çalışmada Türkiye'nin konut politikası ile ilgili yakın tarihten bilgiler verildikten sonra konut fiyat artışlarını etkileyen etmenler istatistikî verilerle incelenmiştir. Uygulama bölümünde ise, günümüzün en popüler konut finansman aracı olan banka konut kredileri ile genellikle faizsiz olmasından dolayı İslami kesimin konut finansmanında tercih ettiği elbirliği sisteminin konut satın almak isteyen tüketicilere maliyetleri karşılaştırılmıştır. Sonuçta devlet güvencesi olmaması sebebi ile banka konut kredileri kadar talep görmeyen elbirliği sisteminin bazı durumlarda banka konut kredisinden daha avantajlı olduğu görülmüştür. 300.000 TL değerindeki bir konut için, 120 ay vade ile % 75'ine kadar finansman alınabileceği varsayımı altında konut enflasyonu, kira kaybı ve kira artışları dikkate alınarak hesaplandığında; elbirliği sisteminde, enflasyon oranının % 10 olması durumunda 45. aydan sonra finansman tutarını alan tüketicilerin banka finansmanına göre zarar etmeye başladığı görülmüştür. Enflasyon oranının % 20 olması durumunda ise 31. aydan sonra finansman tutarını alan tüketiciler zarar etmektedir. Konut değerinin % 25'i tutarında peşinatı olan tüketiciler için ise; Bankaların konut finansman maliyeti tutarı peşinat dâhil, 465.469,16 TL, elbirliği sisteminde maliyeti ise 319.470 TL olduğu tespit edilmiştir. Bu durumda elbirliği sistemi 145.999,16 TL daha avantajlıdır. Konut finansmanı ödemesi peşinatlı sistemde 120 ay vadede % 25 peşinatla 38. Aya kadar yapılmakta olduğu için; 38. Aya kadar meydana gelebilecek konut fiyat artışları, kira ödemeleri ve kira artışları, peşinat tutarının faiz veya kar payı getirileri de dikkate alındığında Elbirliği sisteminde konut finansman maliyeti 433.027,20 TL dir. Yine bankaların konut finansman maliyetine bakılarak, konut finansmanını son teslim alan kişinin bile 32.441,96 TL kar ettiği görülmüştür. Bu yöntem ile elbirliği sisteminde konut finansmanı kullanan tüm tüketicilerin, bankalardan konut finansmanı kullanan tüketicilere göre daha avantajlı olduğu belirlenmiştir."
