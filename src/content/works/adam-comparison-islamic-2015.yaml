abstract: "Bu çalışma, konvansiyonel (geleneksel) finansal muhasebe ile İslami finansal muhasebeyi karşılaştırmaktadır. Çalışmada tanımlayıcı yöntemler ve önemli analitik tarzda metodlar kullanılarak değerlendirmelerde bulunulmuştur. Çalışma iki sistem arasındaki benzerlikleri ve farklılıkları içermektedir. İki sistem de işlemleri kayıt altına alırken benzer veya aynı muhasebe tekniklerini, çift taraflı kayıt yöntemini, muhasebe varsayımlarını, tahhakkuk konseptini, niteliksel özellikleri, işletmenin sürekliliği ve dönemselliği kullanırken, teorik ilkeler, prensipler, teorik felsefe ve dünya görüşü ile uygun, kendi ilkeleri ile, oluşturulan finansal muhasebe standartları açısından farklılıklara sebep olmaktadırlar. Bu nedenle herbirinin kendine has finansman araçları ve benzer olmayan (eşsiz) yasama organları mevcuttur. Yine her iki sistemin de, tüketicileri ekonomik olarak tatmin edecek veya etmeyecek ürün ve hizmetleri mevcuttur. Öte yandan muhasebe ilkeleri dikkate alındığında her iki sistemin de bir varlık olarak kabul edilip edilmeyeceği yönünde farklı ürün ve hizmetleri bulunmaktadır. Bunlara ilaveten her iki system açısından farklılıklara bakıldığında finansal bilgi ihtiyaçları, varlık değerleme metodları, etik kavramı, tarihi maliyet-maliyet esası, varlık teorisi, hazırlanması gereken finansal tablo sayısı, gelir tespiti yaklaşımı açısından farklılıklar bulunmaktadır. Çalışmanın sonucuna göre, islami kurallar altındaki temel işlemler islami ilkelere dayanmaktadır. Bu ilkelerin kökleri finansal işlemlerde anahtar rol olan dini etik, ahlak ve eşitliğe dayanmaktadır. Oysa konvensiyonel muhasebe özün önceliği kavramına izin vermektedir. İslami muhasebe, nispeten konvensiyonel muhasebeye göre daha yeni ve gelişme aşamasında olmasına rağmen muhasebeye, ticarete ve finansa uygulanabilir olan şeriat kurallarının fırsatlarına sahiptir. Ayrıca islami muhasebe sırayla islami banka sistemini ve bir bütün olarak islami ekonomiyi etkisi altına alabilmektedir. Sonuç olarak, islami muasebe ile ilgilenen bilim adamları (islam alimleri) faizden kaçınmak için borçta artış olmaz demişlerdir. Burdan yola çıkarak sonraki araştırmacılar için;“özellikle enflasyonun olduğu ve dolayısıyla borcun değerinin nispeten azaldığı bir dönemde islami ilkeler borca nasıl yaklaşabilir”bunun farklı araştırmacılar tarafından araştırılması tavsiye edilebilir."
