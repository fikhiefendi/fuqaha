abstract: "Entegre raporlama, finansal ve finansal olmayan bilgilerin birlikte ve bağlantılı olarak sunulduğu bir raporlama türüdür. Kuruluşların sosyal, çevresel ve finansal faaliyetlerinin tek bir raporda bütüncül bir bakış açısıyla sunulduğu entegre raporlar, paydaşların kuruluş hakkında daha doğru analizlerde bulunmasına imkan tanımaktadır. Entegre raporların hazırlanması sırasında dikkate alınması gereken noktalar, Uluslararası Entegre Raporlama Konseyi tarafından 2013 yılında yayımlanan Uluslararası Entegre Raporlama Çerçevesi ile belirlenmiştir. Bugün, birçok kuruluş entegre rapor hazırlarken Uluslararası Entegre Raporlama Çerçevesi'ni baz almaktadır. Ocak 2021'de, Uluslararası Entegre Raporlama Çerçevesi basit ve net bir yapıya kavuşturulmak amacıyla Uluslararası Entegre Raporlama Konseyi tarafından revize edilmiştir. Bu çalışmada, Türkiye'deki katılım bankalarının yıllık olarak yayımlamış oldukları faaliyet raporlarının Uluslararası Entegre Raporlama Çerçevesi'nde belirtilmiş olan içerik öğelerine ve kılavuz ilkelerine yıllar itibariyle ne derece uyumlu olduğunun belirlenmesi amaçlanmıştır. Bu amaçla, Türkiye'deki 5 katılım bankasının 2018-2020 yılları için kendi resmi sitelerinde yayımlamış oldukları faaliyet raporları içerik analizi yöntemi ile incelenmiştir. Yapılan analiz sonucunda, araştırma kapsamındaki 5 katılım bankasının her üç yıl için yayımlamış oldukları faaliyet raporlarının Uluslararası Entegre Raporlama Çerçevesi ile uyumlu olduğu saptanmıştır. En yüksek entegre rapor uygunluk skoruna sahip katılım bankasının 2018 ve 2019 yılları için Kuveyt Türk Katılım Bankası, 2020 yılı için ise Albaraka Türk Katılım Bankası'nın olduğu tespit edilmiştir. Ziraat Katılım Bankası ve Vakıf Katılım Bankası ise her üç yıl için en düşük entegre rapor uygunluk skoruna sahip katılım bankaları olarak bulunmuştur. Ayrıca, her üç yıl için“Önemlilik”ve“Tutarlılık ve Karşılaştırılabilirlik”ilkeleri en yüksek skora sahip kılavuz ilkeler olarak tespit edilirken,“Performans”öğesi ise en yüksek skora sahip içerik öğesi olarak bulunmuştur."
