abstract: "Bedreddin Simâvî'nin (ö. 823/1420), Üsrûşenî'nin (ö. 632/1235) el-Fusûl fi'l-Muʿâmelât'ı ile Zeynüddin el-Merginânî'nin (ö. 670/1271) Fusûlü'l-ihkâm fî usûli'l-ahkâm'ını birleştirerek kaleme aldığı Câmiʿu'l-Fusûleyn isimli eseri, karşılaştıkları meselelerde kendilerinden önceki hükümlere bakma gereksinimi duyan kadıların el kitabı haline gelmiştir. Nişancızâde Muhyiddin Mehmed (ö.1031/1621), Câmiʿu'l-Fusûleyn isimli eserden daha iyi faydalanılabilmesi için, eserin tamamını düzenleyerek Nûru'l-ʿayn fî Islâhi Câmiʿi'l-Fusûleyn'î telif etmiştir. Bu çalışmada, Nûru'l-ʿayn fî Islâhi Câmiʿi'l-Fusûleyn'in 32. faslının tahkik ve tahlili yapılarak bu fasıl özelinde, Nişancızâde'nin iyileştirme çabası incelenmektedir. Bu çalışma, üç bölümden oluşmaktadır. Birinci bölümde, Nûru'l-ʿayn'ın 32. faslında tazminat konularına yer verildiği için“damân”terimi incelenmiş ve faslın içerdiği başlıkların her biri kısaca tanıtılmıştır. İkinci bölümde, incelenen fasıl açısından Nişancızâde'nin, ne gibi iyileştirmeler ve düzenlemeler gerçekleştirmiş olduğuna dair tespitler sistematik biçimde sunulmaya çalışılmıştır. Son olarak üçüncü bölümde ise Nûru'l-ʿayn'ın 32. faslı iki farklı müellif nüshası esas alınarak tahkik edilmiştir."
