abstract: "İmâmet din ve dünya işlerinde birey ve toplumu ilgilendiren konularda dinî ve siyasi lider konumunu temsil eden bir makam olup bu makama geçen kişi Müslümanların en üst düzey yöneticisidir. Hz. Peygamberin vefatından hemen sonra Müslümanlar arasında ortaya çıkan ilk problemdir. Bu problemin doğurduğu sorunlar pekçok teolojik meselenin doğmasına ve Müslümanların muhtelif fırkalara bölünmesine neden olmuştur. Bu çalışmada başta kelam, fıkıh ve usûlü olmak üzere pekçok alanda eserler kaleme alıp Gazâlî gibi İslam düşünce dünyasına damgasını vurmuş alimler yetiştiren İmâmü'l-Haremeyn el-Cüveynî'nin imâmet/hilafet konusundaki görüşleri teolojik açıdan incelenmiştir. Cüveynî daha önceki imâmet anlatılarında alışılagelmişin dışında bu meseleyi farklı açılardan ele alarak teoriye yeni bir perspektif kazandırmıştır. Söz gelimi o, teorisini Sünnî düşüncenin ontolojik ve epistemolojik temelleri üzerine inşa etmekle birlikte pratikte düzen kavramını merkeze alarak bu teorinin ümmetin maslahatı çerçevesinde askıya alınabileceğini ve değişen dünyada bu değişime uygun daha pragmatik teorilerin inşa edilebileceğini iddia etmiştir. Bu çalışma şu muhtelif soruların cevabını aramaktadır: İmâmet meselesi ortaya çıkan ilk problem olduğu halde Sünnîler içerisinde neden teorik olarak en son ele alınan konu olmuştur? Değişen siyasi paradigmalar, Sünnî gelenek içerisinde imâmet teorilerinin temellendirilmesine nasıl katkı sağlamıştır? Cüveynî'nin buna katkısı hangi yönlerden olmuştur? Tarihsel değişimle birlikte imâmet kurumunun işlevselliğini sürdürebilmesi için Cüveynî'nin öne sürdüğü çözüm önerileri nelerdir? Kişi imâmet makamına hangi yöntemle tayin edilir ve neye göre belirlenir? Siyasi iktidarda bulunması gereken vasıflar nelerdir? Bu vasıflar ihmal edilebilir mi?"
