abstract: "FIBA 3x3 Dünya Turu 2023 Final Turnuvası'na katılan elit basketbol takımları ve oyuncuları üzerinde gerçekleştirilen çalışmanın amacı, video analiz yöntemi ile oyun sistemlerinin belirlenmesi ve elde edilen sistemsel verilerin takımların başarı düzeyleriyle olan olası ilişkisinin incelenmesidir. Çalışmada final turuna katılan toplam 12 basketbol takımının ve 20-41 yaş aralığındaki 56 erkek sporcunun analizi yapılmıştır. Bu video analizi sırasında takımların her maç top sürme, pas verme, elden ele pas, perdeleme, topsuz perdeleme, toplu perdeleme ve perdeleme toplam sayılarını içeren 1691 hücum fazı kayıt altına alınmıştır. Bunun yanı sıra çalışmada takımların hücum oyununda farklı perdeleme stratejilerinin etkileri incelenmiştir. Çalışmada, çok perdeleme yapan oyuncular ile az perdeleme yapan oyuncular iki gruba ayrıldı. Bu grupların analizinde Man Whitney U kullanılmıştır. 12 takımın belirlenen parametreler açısından karşılaştırılması için Kruskal Wallis H analizi uygulanmıştır. Takımların ikili karşılaştırılması post hoc testlerden Dunn Bonferroni'den yararlanılmıştır. Sonuçlar, 0,05 anlamlılık düzeyine göre yorumlanmıştır. Elde edilen sonuçlar incelendiğinde az perdeleme yapan oyuncular genellikle oyunu yönlendiren ve skor yükünü üstlenen anahtar oyuncular olarak belirlenirken, çok perdeleme yapan oyuncular ise destekleyici rol üstlenerek oyun akışına ve diğer oyunculara katkı sağladığı belirlenmiştir. Bireysel performans açısından, perdeleme içeren takım organizasyonları, oyuncuları oyuna dahil ederek takımın hücum verimliliğini artırdı. Öte yandan, az perdeleme yapılan hücumlar top kaybı riskini artırırken, bireysel yeteneklere daha fazla bağımlılık yarattı. Bireysel becerilerin öne çıktığı hücumlar, genellikle oyun ritmini yakalamada etkili olabilir, ancak bu durum hücum verimliliğini olumsuz yönde etkileyebilir. Bu nedenle, çok perdeleme içeren oyun stratejilerinin, takım başarısını artırmada daha etkili olabileceği ve gelecekteki araştırmalara önemli bir referans oluşturabileceği düşünülmektedir."
