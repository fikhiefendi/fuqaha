abstract: "Katılım Bankacılığının işleyişi açısından diğer geleneksel bankacılık uygulamalarından risk yönetimi açısından daha sağlam bir yapıya sahip olması dünyada hızla yükselen bir değere ulaşmasını sağlamaktadır. Toplumun müslüman kesimindeki kaynağın inançlarından ötürü yastık altında beklemesi, Katılım Bankacılığı sayesinde ekonomiye kazandırılmak için bu alanda geleceğe dair büyük girişim ve düzenlemeler yapılmaktadır. Çalışmada Katılım Bankacılığının güçlendirilerek ürün çeşitliliğinin artırılması amacına yönelik olarak geleneksel ürünlerin yanında yeni bir ürün kazandırılabilmesi amacıyla dünyada örneği oldukça yaygın ve geliştirilmeye açık olan mikrokredi uygulamaları ele alınmış ve ülkemizdeki katılım bankacılığı ürün türleri içerisinde değerlendirilebileceği sonucuna ulaşılmıştır."
