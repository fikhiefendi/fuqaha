abstract: "Selefîler, Selef takipçileri olduklarını iddia ettikleri gibi Ebû Hanîfe'nin görüşlerinin Selefî görüşlerle örtüştüğünü de öne sürmektedirler. Tezde Selefîlik ile Selef kavramları arasındaki farka dikkat çekilerek tarihi süreçte Selefîliğin nasıl doğduğu, hangi aşamalardan geçtiği açıklanmıştır. Ebû Hanîfe'nin iddia edildiği gibi Selefî olup olmadığının, ayrıca görüşlerinin Selefilerin iddia ettikleri gibi Selefî görüşle uyumlu olup olmadığının ortaya çıkarılması amaçlanmıştır. Çalışmada Selefî görüşlerle Ebû Hanîfe'nin ve öğrencilerinin görüşleri karşılaştırılarak bu görüşler arasındaki fark gösterilmiş, iddiaların gerçeği ne kadar yansıttığı ortaya konulmuştur. Araştırmada özelde Muhammed el Hümeyyis'in Ebû Hanîfe'nin görüşleri hakkındaki değerlendirmeleri konu edilirken genelde günümüz Selefî hareketinin Ebû Hanîfe algısını ortaya çıkarmak hedeflenmiştir. Anahtar kelime"
