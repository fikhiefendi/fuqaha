abstract: "İslam Hukuku“vesâyet”kavramı altında, öksüz ve yetim çocuklar ile aklî melekesini kaybederek çocuk mesabesine inmiş, her haliyle korunmaya muhtaç yetişkin bireylerin mallarının idare edilmesini konu edinmiştir. Onların bu alandaki problemlerine ilişkin getirilen çözümler ve yaşanması muhtemel sorunlarla ilgili alınan tedbirler detaylıca işlenmiştir. Yapılan bu çalışma, fıkıh mezheplerinin muteber kaynaklarına dayanılarak hazırlanmıştır. Çalışmanın iki temel amacı bulunmaktadır. Bunların ilki, İslam hukukunda çocuklar üzerine tayin edilen vasînin yetki ve sorumluluklarını ihtiva eden“vesâyet”konusunun teorik anlamda tespitini yapabilmektir. İkincisi ise, Osmanlı Devleti klasik dönemindeki (1839 öncesi dönem) fetva mecmuaları ile mahkemelerdeki şer'iyye sicil kayıtları ışığında, Osmanlıdaki uygulamanın nasıl olduğu hakkında bir sonuca ulaşabilmektir. Araştırma giriş, sonuç ve üç bölümden meydana gelmektedir. Giriş bölümünde araştırmanın konusu ve önemi, amacı ve kapsamı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde vesâyetin tanımı, şer'î delilleri, vesâyet ile ilgili kavramlar ve vesâyetteki sınırlandırmalar konu edilmiştir. İkinci bölümde vesâyetin rükun ve şartları ele alınarak mûsî, vasî, kısıtlı, vesâyetin konusu ve irade beyanı konuları işlenmiştir. Üçüncü bölümde vasînin tasarrufları, vesâyetle ilgili anlaşmazlıklar, vesâyeti veya vasînin görevini sona erdiren haller, malların iadesi ve muhasebe işlemleri ele alınmıştır. Sonuç bölümünde ise araştırma neticesinde ulaşılan sonuçlara yer verilerek gerekli değerlendirmeler yapılmıştır."
