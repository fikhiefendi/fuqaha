abstract: "Hicrî ikinci asırla birlikte ortaya çıkan günümüze kadar varlığını devam ettiren ve İslam hukuk sisteminin temelini oluşturan dört mezhep içerisinde Hanefîlerin diğerlerine karşı tek kaldığı meselelerin ibadet fıkhı özelinde ele alındığı bu araştırma giriş, sonuç ve iki bölümden oluşmaktadır. Giriş kısmında araştırmanın konusu, amacı, kavramsal çerçevesi ve metodu izah edilmiştir. İlk bölümde araştırmanın asıl konusunu teşkil eden teferrütlerin tespitleri her bir mezhebin görüşleri zikredilmek suretiyle açıklanmıştır. İkinci bölüm iki farklı konuyu içermiş, ilk olarak mezhepler arasında var olan fıkhî ihtilafların sebepleri zikredilmiş, ikinci olarak ise genel olarak tespit edilen teferrütlerin sebep eksenli tahlili yapılmıştır. Araştırmanın amacına matuf olarak açıklanan mezhepler arasında var olan ihtilaf sebepleri aynı zamanda teferrütlerin sebeplerinin daha doğru tahlil edilebilmesi için gerekli görülmüştür. İkinci bölümün asıl konusunu oluşturan Hanefîlerin teferrüt etme sebepleri detaylıca izah edilmiş özellikle teferrütlerin konu ve sebep eksenli sayısal verileri zikredilmiştir. Tespit edilen herbir teferrütün tahrici mezheplerin asıl kaynaklarından yapılmış, herbiri için sebep analizi derin bir tahlil sonucunda ortaya konmuştur. Böylece tespit edilen teferrütlere etki eden sebepler ortak başlıklar altında bir araya getirilmiştir. İkinci bölümün son kısmında tespit edilen teferrütlerin sebep eksenli genel değerlendirilmesi yapılmış, sayısal veriler üzerinden araştırmanın amacı izah edilmeye çalışılmıştır. Sonuç kısmında ise Hanefîlerin teferrüt ettikleri mesellelerin özellikle sayısal analizi neticesinde ulaşılan sonuçlar ortaya konmuştur. Hanefî hukuk sistemine yöneltilen bir takım eleştirilerin doğruluk değerini onların teferrüt ettikleri meseleler üzerinden değerlendirmeyi amaçlayan bu araştırmada özellikle Hanefîlere yöneltilen rey ekolü anlayışı sebebiyle aklı naslara karşı önceleme eleştirisi tereddütlerler üzerinden degerlendirilmistir. Aynı şekilde onların hukuk anlayışında belirgin olan bir takım usûli farklılıklar, istinbat kaynaklarından ötürü ortaya çıkan ayrışmalar ve hadis temelli ayrılıklar tespit edilen teferrütler özelinde işlenmiş, böylece Hanefîlere yöneltilen eleştirilerin sayısal veriler üzerinden değerlendirilmesi yapılarak bunların yanlış eleştiriler olduğu ve bir takım hataları barındırdığı tespit edilmiştir."
