abstract: "Bu araştırmanın amacı, Bauspar Sistemi ile Tasarruf Finansman Faaliyetinin benzerliklerini ve farklılıklarını ortaya koymak ve lisanslama sürecinin sektöre etkilerini incelemektir. Bu hedefler doğrultusunda nitel bir araştırma gerçekleştirilmiştir. Söz konusu nitel araştırma, fenomenoloji yöntemine dayandırılmıştır. Bulguların elde edilmesi amacıyla açık uçlu mülakat formu kullanılmıştır. Katılımcılar, tasarruf finansman sektöründe aktif olarak çalışan profesyonellerden oluşmaktadır. Mülakatlar sonucunda elde edilen veriler, içerik analizi ile yorumlanmıştır. Araştırma bulguları, lisanslama sürecinin sektör gelişimine olumlu yansımaları olduğunu göstermektedir. Lisanslama sürecinin tamamlanmasıyla birlikte, tasarruf sahipleri açısından tasarruf finansman sektörü; daha güvenilir, daha itibarlı ve alternatif bir finansman yöntemi olarak anılmaya başlanmıştır. Bu gelişmeyle paralel olarak, sektörde dijital dönüşüm faaliyetleri de hız kazanmıştır. Türkiye'de her 25 haneden biri, konutunu veya taşıtını Tasarruf Finansman Faaliyeti yöntemiyle edinmektedir. Almanya'daki Bauspar Sistemi, ROSCA (Rotating Savings and Credit Associations) yöntemiyle şekillenmekte olup 100 yıllık bir geçmişe sahiptir. Sistem içerisinde 25 milyon aktif sözleşme bulunmaktadır ve her yıl ortalama 1.5 milyon yeni sözleşme eklenmektedir. Almanya'da her üç aileden biri Bauspar Sistemini tercih etmektedir. Tasarruf Finansman Faaliyeti ile Bauspar Sistemi arasında birçok benzerlik olmakla birlikte, en büyük farklılık faiz uygulamalarıdır. Bu çalışmanın, her iki sistemin gelecek projeksiyonuna olumlu katkılar sunması hedeflenmektedir."
