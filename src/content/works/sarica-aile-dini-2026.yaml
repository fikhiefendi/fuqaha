abstract: "Bu çalışmada İslam aile hukuku ile Türk medeni hukuku arasındaki farkların dini rehberlik pratiğine yansımaları Uşak ilindeki T.C. Diyanet İşleri Başkanlığına bağlı Aile ve Dini Rehberlik Bürolarına yapılan başvurular üzerinden sosyo-hukuki bir perspektifle incelenmiştir. Türkiye, Avrupa hukuk geleneğine dayanan bir medeni kanuna sahip olmakla birlikte İslam aile hukukunun normatif etkisinin toplumsal düzeyde canlılığını koruduğu bir ülke konumundadır. Söz konusu sosyo-hukuki yapı içinde Aile ve Dini Rehberlik Büroları iki ayrı hukuk düzeninin kesişim alanında kurumsal bir köprü işlevi üstlenmektedir. Araştırma, karma yöntem yaklaşımı çerçevesinde açıklayıcı sıralı desen kullanılarak gerçekleştirilmiştir. Niceliksel aşamada Uşak Aile ve Dini Rehberlik Bürolarına 2023-2024 yılları arasında yapılan 346 başvurunun anonimleştirilmiş kayıtları analize tabi tutulmuştur. Niteliksel aşamada büro personelinden 18 kişiyle yapılandırılmış görüşmeler ve çevrimiçi anket uygulanmıştır. Veriler hukuki çoğulculuk kuramı çerçevesinde değerlendirilmiştir. Bulgular, başvuruların önemli bir bölümünün boşanma ve talak konularına ilişkin olduğunu, başvuru sahiplerinin önemli bir çoğunluğunun kadınlardan oluştuğunu ve cinsiyet ile başvuru konusu arasında istatistiksel olarak anlamlı bir ilişki bulunduğunu ortaya koymaktadır. İçerik analizi, başvuruların hem dini açıdan geçerli sayılan ancak hukuki sonuç doğurmayan uygulamalara hem de hukuken geçerli olmakla birlikte dini açıdan tartışmalı meselelere ilişkin olduğunu göstermektedir. Personel görüşmelerinin tematik analizinden hukuki çoğulculuk yönetimi, cinsiyet temelli yaklaşım farklılıkları, dini-hukuki denge arayışı ve kurumsal sınır belirleme olmak üzere 4 ana tema ortaya çıkmıştır. Çalışma, hukuki çoğulculuk kuramının Türkiye bağlamına özgün bir uygulamasını ortaya koymakta ve Aile ve Dini Rehberlik Bürolarının iki ayrı hukuk düzeni arasında kurumsal bir köprü işlevi gördüğünü saha düzeyinde göstermektedir. Bulgular, Diyanet İşleri Başkanlığı'nın aile rehberliği politikalarının geliştirilmesine yönelik somut öneriler sunmaktadır."
