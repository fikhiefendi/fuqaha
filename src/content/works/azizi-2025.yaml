abstract: "Bu çalışma, para vakfı İslam hukukunda bir vakıf türü olarak ele almaktadır. Çalışma, kavramın fıkhî temellerini ortaya koyarak, türlerini ve özelliklerini açıklamaktadır. Çalışmada, nakdi vakfın meşruiyet temelleri Kur'an ve Sünnet'ten getirilen deliller, fıkhî kaideler ve dört mezhebin görüşleri doğrultusunda incelenmiştir. Çalışma ayrıca, Türkiye'deki Uygur muhacirlerinin mevcut durumuna da ışık tutmakta; karşılaştıkları sosyal ve ekonomik zorlukları ortaya koymakta ve para vakfın küçük ölçekli projelerin desteklenmesi, eğitim imkânlarının sağlanması ve kültürel-dini kimliğin korunması yoluyla bu zorlukların hafifletilmesinde etkili bir araç olabileceğini göstermektedir. Bu mekanizmanın etkinliğini değerlendirmek amacıyla, çalışmada betimsel-analitik bir yöntem benimsenmiş; Türkiye'de ikamet eden Uygur muhacirlerinden oluşan bir örnekleme anket uygulanmıştır. Amaç, Para vakıf kavramına dair farkındalık düzeylerini ve toplumsal destek mekanizması olarak bu yapıya ne ölçüde ilgi gösterebileceklerini ölçmektir. Veriler istatistiksel yazılımlar kullanılarak analiz edilmiş; böylece nicel ve nitel bulgular aracılığıyla genel eğilimler tespit edilmiştir. Sonuçlar, güvenilir kurumsal yapılar ve şeffaf uygulama mekanizmaları sağlandığı takdirde Uygur toplumu içinde nakdi vakıf uygulamasına güçlü bir eğilim olduğunu ortaya koymuştur. Bölüm, özellikle mülteci topluluklar ve dezavantajlı gruplar için nakdi vakfın kapsayıcı bir kalkınma aracı olarak benimsenmesini destekleyen bir dizi pratik öneriyle sona ermektedir. Çalışmanın genel sonucu, nakdi vakfın kırılgan grupları desteklemek ve toplumsal kalkınmayı sağlamak açısından umut verici bir model sunduğudur; ancak bu, sürdürülebilirlik, şeffaflık ve adil dağılımı temin edecek meşru ve düzenli yapılar içinde yürütülmelidir."
