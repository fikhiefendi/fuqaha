abstract: "Bu araştırma, Lübnan' daki İslami bankalardaki elektronik bankacılık hizmet kalitesinin boyutları (kullanım kolaylığı, zaman tasarrufu, gizlilik ve güvenlik) ile müşteri memnuniyeti arasındaki etkisini belirlemeyi amaçlanmaktadır. Araştırma hedeflerini gerçekleştirmek için veri toplama amacıyla araştırmacı bir anket oluşturarak bunu 212 katılımcıdan meydana gelen araştırma topluluğuna dağıttı. Bu anket (40) madde içermektedir. Bu doğrultuda, veriler toplandı, analiz edildi ve SPSS programı kullanılarak hipotezler test edildi. Likert ölçeğine tabi olan maddeler için iç tutarlılık katsayısı Cronbach Alpha hesaplandı ve tutarlılık katsayısı 0,939 olarak bulundu. Bu değer yüksek bir değer olduğu için çalışmanın amaçlarına uygundur. Bu çalışmanın sonunda, araştırmacı bazı önerilerde bulunmaktadır; Lübnan İslami bankalarının, Lübnan' daki mevcut krizler altında müşteri memnuniyeti seviyelerini korumak için o hizmetlerin kalite boyutlarına dikkat etmeleri ve bunları düzenli olarak gözlemlemeleri gerekmektedir. Bankaların, elektronik bankacılık hizmetlerinin etkililiğini ölçmek, müşteri memnuniyetini ölçmek ve korumak için periyodik çalışmalar yapmaları gereklidir. Müşteri beklentileri ve deneyimleri müşteriden müşteriye farklılık gösterdiği için, teknolojideki sürekli gelişmelere ve bankacılık sistemlerine de dikkat etmek gereklidir. Araştırmacı, yeni bankacılık teknolojilerinin gelişmelerine ayak uydurmaya yönelik çalışmalar yapmayı önermektedir. Bu doğrultuda müşteri ihtiyaçlarına uygun olarak elektronik kanallar eklemek, mevcut kanalları geliştirmek ve bu kanallar aracılığıyla sunulan hizmetlerin sayısını artırmak yararlı olacaktır. Bu sayede mevcut müşterilerin korunması, yeni müşterilerin kazanılması, rekabet avantajı elde edilmesi ve geleneksel bankalarla piyasada kalınması sağlanmış olacaktır."
