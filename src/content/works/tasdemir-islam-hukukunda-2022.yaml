abstract: "İslâm dininde mükellefe yüklenen sorumlulukların bütünüyle meşakkatten uzak olması beklenemeyeceği gibi tümüyle meşakkatle yüklü olması da düşünülemez. Çalışmamızda bu noktaya dikkat edilmiş, mükellefin sorumluluk dairesi içerisinde tahammül edilebilir meşakkat ve tahammül edilemeyen meşakkat şeklindeki ayrıma temas ve dikkat çekilmiş, bu meşakkat çeşitlerinden hangisinin şâri' tarafından kaldırılmayı veya hafifletilmeyi murat edildiği belirtilmeye çalışılmıştır. Çalışmamızda meşakkatin kavramsal olarak ihtiva ettiği saha belirlenip, Kur'ân ve Sünnette meşakkatin nasıl ve ne şekilde yer aldığı ortaya konulmuştur. Önceki ümmetlere ve Ümmet-i Muhammed'e yöneltilen hükümlerdeki meşakkatin durumu irdelenmiş, İslâm Hukukunda meşakkatin nasıl tespit edildiği, fukahânın yöntemleri ve görüşleri ile açıklanmıştır. İlâhî hitaplarda bulunan meşakkatin çeşitleri belirtilmiş, meşakkat sebebiyle hükümler üzerinde gerçekleşen ref'ul-harec/zorluğun-meşakkatin kaldırılması ve tahfif konusunun çeşitleri örnekleri ile gösterilmiştir. Meşakkatin kaldırılması veya hafifletilmesini konu alan küllî kâideler izâh edilmiş, bu konuda dinin gâyesinin meşakkat vermemek olduğu naslar ışığındaki örnekler ile sunulmuştur."
