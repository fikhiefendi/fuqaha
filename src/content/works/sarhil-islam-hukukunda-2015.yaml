abstract: "Bu çalışma; kişinin hakkını, o hakkı vermekten imtina eden kişiden mahkemeye başvurmadan, kendi eliyle almasının hükmünü farklı görüş ve bakış açılarıyla, karşılaştırmalı bir şekilde ele alıp incelemektedir. Çalışma; hak sahiplerinin, mağdur olmamak için bilmeleri gereken ve özellikle günümüzde daha çok ehemmiyet kazanan hüküm ve kuralları ele almaktadır. Bu çalışma da görülecektir ki kişinin hakkını kendi eliyle almasının bir takım şartları vardır. Bu şartların en önemlileri: Alınacak olan hak, kesin olarak ispat edilebilen bir hak olmalıdır. Çünkü kişi ispat edemediği bir hakkı kendi hakkı olduğu iddiası ile alamaz. Kişinin, hakkını kendi eliyle alması bir fitneye sebebiyet vermemeli ve bir Müslüman'ın endişeye kapılmasına neden olmamalıdır. Hakkı vermeyen kişi hakkı inkâr etmeyip vermek için uğraşan yahut zorluktan ötürü vermeyen biri olmamalıdır. Tezimizle birlikte, malı gasp olunan bir kimsenin o malını mahkemeye başvurmadan kendi eliyle almasının caiz olması noktasında ittifak olduğu da görülecektir. Ancak eğer hak, gasp değil de başkasının zimmetinde bulunan bir borç ise bunun kendi eliyle alınmasının caiz olup olmadığı noktasında ihtilaf vardır. doğru olan, ihtiyaten mahkemeye başvurmadan alınmamasıdır. Çünkü genelde bu türden hakların mahkemeye başvurulmadan alınması bir fitneye yahut bir husumete neden olmaktadır."
