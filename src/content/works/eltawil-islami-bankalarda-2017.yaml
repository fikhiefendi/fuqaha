abstract: "İslami bankacılık, geçen yüzyılın yedinci yılında İslam dünyasında ortaya çıkan yeni finansal akımlardan biridir. Malezya gibi öncü ilçelerden ortaya çıkan İslami mali konsept, İslam hukukuna uymak için birçok stratejiyi ayarlamak zorundaydı. İslam hukukunun finansal talimatlarının kalbi, sermaye sağlayıcı ile borçlu arasında çıkar ve kâr ve zarar paylaşımının yasaklanmasıdır. Bununla birlikte, böyle bir konsept, İslami bankacılık kavramını benimseyen finansal enstitünün risk yönetimi üzerinde birçok etkiye neden olmaktadır. İslami bankacılıkta kredi, piyasa, likidite ve operasyonel riskler de dahil olmak üzere geleneksel risk türleri geçerli olmakla birlikte, risk kaynakları ve azaltma stratejileri geleneksel bankacılık ile karşılaştırıldığında farklılık arz etmektedir. Ayrıca İslami bankacılığa eşlik eden, getiri oranı, hisse senedi yatırım riski, şeriat uyumsuzluk riski ve yerinden olmuş ticari risk gibi benzersiz risk türleri de vardır. Pratikte, İslami bankacılık ilkelerini benimseyen Libya bankalarında risk yönetimine ilişkin bir vaka incelemesi bir teşhis araştırması olarak değerlendirildi. Çalışmanın sonuçları, finansal olmayan birçok faktörden etkilenen ülkedeki risk yönetimi kavramındaki olgunlaşmamışlığı göstermektedir. Bu nedenle, araştırmacı Libya Bankalarındaki risk yönetimi konseptinin gelişimini güçlendirmek için tavsiyesini sunar."
