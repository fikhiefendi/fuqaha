abstract: "Osmanlı şehir tarihçiliğinin kaynaklarına baktığımızda, tahrir ve avarız defterleri gibi Osmanlı şehirleriyle ilgili on binlerce veriyi ihtiva eden değerli birincil kaynaklardaki büyük veriyi analiz edebilmek ve harita üzerine aktarmak mümkün olmaktadır. Böylece, dinî, meslekî, mülkiyet ve unvanla ilgili bu kaynaklarda yer alan devasa bilgiler ve nitelikler mekân yani mahalle düzeyinde gösterilerek şehrin sosyo-ekonomik anatomisi çıkarılabilmektedir. Bunlara ilaveten, vakıf kaynakları yoluyla şehirlerin bina-mimari stokuna, tahrir ve avarız defterleri ile insanî-toplumsal yapısına ve şer'iyye sicilleri ile gündelik yaşamına dair bilgiler bir araya getirilince bir aktörün ya da bir işlevin neden şehrin belirli mekânlarında bulunduğu, bu işlevlerin belirli bir mahallede olmasının şehrin yaşamına ne kattığı, birbiri ile ilişkili mekânların ve işlevlerin neler olduğu gibi kente dair pek çok soruya cevap bulmak mümkün olabilmektedir. Tezimizin ana odağı Selanik şehrinde sosyo-ekonomik yapısı ve servet analizi üzerine olacaktır. Tezin birinci bölümü, Selanik'in tarihî gelişimi ile birlikte 18. yüzyıl başındaki genel sosyo-ekonomik görünümünü ortaya koymaktadır. Bu bölümde, kentin Osmanlı idaresi altındaki konumu, ticari bağları, etnik ve dini yapısı gibi çerçeveleyici faktörler ele alınmaktadır. İkinci bölümde, Selanik'in mahalle kültürü ve mekânsal sosyo-ekonomik örgütlenmesi analiz edilmektedir. Bu kapsamda şer'iyye sicillerinden derlenen ev satış kayıtları, mahalle ölçeğinde işlenerek fiyat ortalamaları, satış yoğunlukları ve alıcı-satıcı profilleri üzerinden değerlendirilmektedir. Amaç, servetin kent mekânına nasıl dağıldığını ortaya koymak, hangi mahallelerin görece zenginleştiğini veya ekonomik olarak zayıf kaldığını tespit etmektir. Üçüncü bölümde ise, iltizam kayıtları üzerinden kentteki ekonomik gücün üst düzey temsilcilerini tanımlamayı amaçlamaktadır. Yine aynı bölümde Selanik'teki borç ve kredi ilişkileri üzerinden kent içi finansal ağlar çözümlenmektedir. Bu bağlamda, hem para vakıfları hem de bireysel sermayedarlar tarafından verilen borçların kayıtları incelenerek, sermaye akışının aktörleri, yönü ve hukuki dayanakları değerlendirilmiştir."
