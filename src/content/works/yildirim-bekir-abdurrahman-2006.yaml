abstract: "Medineli tabiûlerden olan EbÃ» Bekir b. Abdurrahman yaşadığı dönemin hem hadishem de fıkıh ilminde sayılı alimlerindendir. EbÃ» Bekir b. Abdurrahman'a ibadeteolan düşkünlüğü sebebiyle“Kureyş'in râhibi”lakabı verilmiştir. O, daha çok tercihedilen bir rivayete göre fukaha-i seb'ayı oluşturan yedi fakihten ve Ömer b.Abdülazûz'in Medine valisiyken oluşturduğu fetva heyetinde yer alan on alimdenbirisidir. Yedi fakihin karşılaştıkları sorunları nebevû sünnete ve hadise arz ederekçözüme kavuşturmaları, onları ehl-i hadisûn fakihleri olarak öne çıkarmış vedönemlerindeki isimlendirme ile Hicaz veya Medine ekolü olarakadlandırılmışlardır. Bu, EbÃ» Bekir b. Abdurrahman'ın ehl-i hadisintemsilcilerinden birisi olduğunu göstermektedir. Ayrıca o, Kur'an ve hadis bilgisiile, Medine ekolünün öncüsü İmam Malik'e kaynaklık eden alimler arasındabulunmaktadır. Bunlarla birlikte EbÃ» Bekir b. Abdurrahman'ın Kütüb-i Tis'a'dabize ulaşan rivayetleri sayıca çok fazla olmadığı görüldüğünden, onun hadis nakliile öne çıkmadığı söylenebilir."
