abstract: "Ebû Muhammed Ali b. Zekeriyya el-Menbecî hicri VII. yüzyılda yaşamış Suriyeli önemli hadis ve fıkıh âlimlerindendir. Değişik İslam ülkelerinde eğitim gördükten sonra Kudüs'e yerleşmiş ve buradaki medreselerde ders okutmuştur.Bir Hanefi Mezhebi mensubu olan İmam Menbecî döneminde Hanefilere ve de özellikle mezhebin kurucusu olan İmam Ebû Hanife'ye yapılan eleştirilere ilmi cevaplar vermiş ve bu mezhebi savunmuştur.Tezimizde İmam Menbecî'ye kadar olan dönemde özetle hadis-fıkıh ilişkisine değindikten sonra Menbecî'nin hayatını, hocalarını, talebelerini ve onun el-Lübâb fi'l-cem'i beyne's-sünne ve'l-Kitab adlı eserindeki hadis-fıkıh ilişkisini incelemeye çalıştık."
