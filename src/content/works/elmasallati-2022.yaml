abstract: "Çalışma, İslam fıkhını ile Libya hukukunda rehin konusunu ele alarak karşılaştırmayı, fıkıh ve hukukta mülkiyet iptotiği ve haciz kavramlarını netleştirmeyi, fıkıhta çağdaş ipotek şekillerini ve hükümlerini açıklamayı amaçlamaktadır. Bu çalışmada araştırmacı, ipotek ile ilgili konularda fakihler ve hukukçuların görüşlerini sunmak ve analiz etmek için endüktif yöntemi, analitik betimleyici yaklaşımı yollarını izlemiştir. Çalışma, Libya hukukunun metinlerinin ipoteğin bazı yönlerinde İslami içtihatla uyumlu olduğu ve diğer yönlerden farkılık gösterdiğini sonucuna varmıştır. Ayrıca, ipotekli eşyanın tutmak için rehinin alınması gerekir. Mülkiyet ipoteğinin mali hakların korunmasında en güçlü teminatlardan biri olduğu sonucuna varmıştır. Çünkü eşyalar insanlardan daha güvenlidir. Çalışma, ipotek ile ilgili hukuki metinlerin toplanarak ipotek kanunu adı verilen özel bir kanuna konulmasını tavsiye erişmiştir. Ayrıca mülkün haklarını elde etmesi için güçlü bir teminat olması nedeniyle zilyetlikte ipotek bulundurmanın gerekli bir koşul olmasını önermiştir borcu geciktirelirse."
