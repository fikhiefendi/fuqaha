abstract: "Bu çalışmada, etik bankacılık uygulamaları kapsamında Avrupa'da faaliyet gösteren Banca Etica ile Türkiye'deki katılım bankalarının iş ahlakı açısından karşılaştırılması yapılmıştır. Etik bankacılık, finansal hizmetlerin sunulmasında sosyal, çevresel ve etik sorumlulukların gözetilmesini temel alan bir yaklaşımdır. Banca Etica ve katılım bankaları, bu etik ilkeleri farklı yöntemlerle uygulamaktadır. Banca Etica, sosyal ve çevresel sürdürülebilirlik, şeffaflık ve toplumsal katılım üzerine yoğunlaşmaktadır. Banka, müşterilerine etik prensipler doğrultusunda belirlenen faiz oranları sunmakta ve sosyal sorumluluk projelerine yatırım yapmaktadır. Şeffaflık ve hesap verebilirlik politikalarıyla dikkat çeken Banca Etica, yatırımlarının ve kredilerinin etkilerini düzenli olarak raporlamakta ve kamuoyuyla paylaşmaktadır. Türkiye'deki katılım bankaları ise İslami finans ilkelerine uygun olarak faizsiz bankacılık prensiplerini benimsemektedir. Kar-zarar ortaklığı modelleri ve İslami finans kurallarına uygun ürünler sunarak müşterilerine hizmet veren bu bankalar, sosyal adalet ve yoksullara yardım etme gibi sosyal sorumluluk projelerine odaklanmaktadır. Katılım bankalarının şeriat uyumlu olma konusundaki şeffaflıkları, müşterilerine işlemlerinin İslami finans kurallarına uygun olduğunu garanti eder. Sonuç olarak, her iki banka türü de etik ilkeler doğrultusunda faaliyet göstermekte, ancak uygulama yaklaşımları ve odaklandıkları alanlar farklılık göstermektedir. Bu farklılıklar, müşterilerin tercihlerini ve bankaların topluma ve çevreye olan katkılarını belirlemektedir."
