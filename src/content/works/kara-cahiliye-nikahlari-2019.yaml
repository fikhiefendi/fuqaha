abstract: "İslâm'la tanışmadan önce cahiliye Arap toplumunun icra ettiği birçok nikâh çeşidi mevcuttu. Bunlardan en yaygın olanı, İslâm tarafından da onaylanmış olan bugünkü nikâh şeklimizdir. Bunun dışında, İslâm'ın helal kabul etmediği ve zina saydığı bütün nikâhlar ve birliktelikler yasaklanmıştır. Evlilikte kadın ve erkeğin birbiri üzerindeki hak ve ödevleri, doğacak çocuğun nesebinin tespit edilmesi gibi konular, şer'î sınırlarla belirlenmiştir. Çalışmanın birinci bölümünde İslâm'dan önceki cahiliye toplumunda icra edilen nikâhlar anlatılmıştır. İlahi dinlerin evlilik ve nikâh konusundaki öğretilerinden bahsedilmiş, Yahudi ve Hristiyanlar'da nikâh konusuna kısaca değinilmiş ve İslâm'ın kabul ve ta'dil ettiği bugünkü nikâh akdinden bahsedilmiştir. Çalışmanın ikinci bölümünde zina konusu ve parafililer başta olmak üzere zina kapsamına giren ve cahiliye nikâhlarının tezahürleri şeklinde görülen sapkın evlilikler ve ilişkiler ele alınmıştır. Farklı kültürlerin cinsel sapkınlıklarıyla ilgili bilgiler sunulmuştur. Örneğin Batı medeniyetinin temelini oluşturan Antik Yunan'da ve Antik Hint medeniyetinde normal ve yasal kabul edilen cinsel sapkınlıklar, son ilahi din olan İslâm'ın öğretileriyle karşılaştırmalı olarak aktarılmıştır."
