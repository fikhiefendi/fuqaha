abstract: "Temel İslamî bilimlerde asıl kaynak olması hasebiyle Kur'an'ın tartışılmaz bir yeri vardır. İtikadî, fıkhî ve ahlâkî hükümler ona dayandırılır. Bundan dolayı onu sağlıklı bir şekilde anlamanın önemi çok açıktır. İlk dönemden itibaren müslümanlar ayetleri anlama çabası içerisine girmişler ve bu konuda bazı metotlar geliştirmişlerdir. Tefsirde öncelikle rivayet ve dirayet metodu daha çok ön plana çıkmıştır. Rivayet metoduna göre ayetler daha ziyade rivayetlere ağırlık verilerek açıklanmıştır. Daha ilk dönemlerde ahkâm ayetlerinin fıkhî yorumları için bir metot geliştirilmiş ve ahkâm tefsirleri yazılmaya başlanmıştır. Yine erken dönemden itibaren sûfîler, ayetleri kendi mânevî tecrübelerine, kalplerine doğan manalara ve nail olduklarını beyan ettikleri bazı ilhamlara göre yorumlamışlardır. Böylece işârî tefsir metodu ortaya çıkmıştır. Bu iki anlama biçimi dirayet metodunun içerisinde değerlendirilebilir. Böyle yaparak farklı anlama biçimlerine sahip âlimler kendi anlayışlarına göre usuller geliştirmiş oldular. Sûfîlerin daha çok ilgilendikleri alan olan ahlâk ve kalbin amelleri ile alakalı ayetleri kendi mânevî tecrübelerine göre yorumlamaları normal karşılanabilir. Ancak hüküm bildiren ahkâm ayetleri hakkında yapmış oldukları te'viller konusunda farklı görüşler ortaya konulabilir. Bu tezde sûfîlerin ahkâm ayetleri hakkında yapmış oldukları ve merak edilen bu yorumlar önemli ölçüde ortaya konuldu. Bu yapılan çalışma ile sûfîlerin zâhir ilmi olarak kabul ettikleri fıkıh ilmine yaklaşımları ve yaptıkları yorumlar belirginleştirildi. Çünkü açıklanan bu durum, disiplinler arası etkileşimi göstermesi açısından önem arz etmektedir. Bu tez çalışması giriş ve beş bölümden oluşmaktadır. Giriş bölümünde konunun önemi, amacı, yöntemi ve sınırlılıkları belirtilerek bu alanda yapılmış az sayıdaki çalışmalara değinildi. Birinci bölümde bazı fıkıh tariflerine değinilip sûfîlerin fıkha bakış açıları özetlendi. Son dönemlerde gündeme getirilip tartışılan hukuk ahlâk ilişkisi de önem arzettiği için bu konuya da değinildi. Daha sonra şeriat-hakikat, zâhir-bâtın gibi tartışmalı konular üzerinde duruldu. Genel olarak âlimlerin özel olarak da sûfîlerin bilgi edinme yolları belirtildi. Ek olarak sûfîlere yöneltilen bazı tenkitlere yer verildi. Ayrıca tasavvufun tarifi, amacı ve insana bakışı incelendi. Bununla birlikte meselenin nirengi noktası diyebileceğimiz te'vil ve çeşitleri konusu açıklanarak sûfîlerin ayetler hakkında yaptıkları yorumlara te'vil denip denilemeyeceği konusu incelendi. İkinci bölümde fıkıh kitaplarının ilk konuları olan abdest çeşitleri, mutlak su, kadınların özel halleri, namazın şartları ve rükünleri, namaz çeşitleri ve fıkıh kitaplarında çok da değinilmeyen huşû konusu açıklandı. Üçüncü bölümde sûfîlerin zekât, öşür ve ilgili meselelere yaklaşımı zikredildi. Dördüncü bölümde sûfîlerin oruç ve itikâf hakkında yaptıkları yorumlara değinildi. Son bölümde ise hac ve kurban meseleleri sûfî bakış açısına göre anlatılarak tez sonlandırıldı. Bu çalışmada konu ibadetler hakkındaki ahkâm ayetleriyle sınırlandırıldığı için bu konunu dışına çıkılmamıştır."
