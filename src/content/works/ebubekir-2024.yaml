abstract: "Âdet kavramı İslam fıkıh usulünde farklı delaletlere sahiptir ve bunların en meşhur olanı ise örf manasına delaletidir. Âdet kavramının bu yaygın manasıyla ilgili çokça araştırma ve inceleme yapılmıştır. Fakat onun, tutarlılık ve tekrara delalet eden bir anlamı da bulunmakta olup hem kelam ilmi hem de fıkıh usulü ilminin en temel kavramlarından biridir.“Fıkıh Usulünde Varlık-Bilgi İlişkisi Bağlamında Âdet Teorisi”başlıklı bu bilimsel çalışma, âdet kavramının varlık ve bilgiyle ilişkisi bağlamda kökenini araştırmayı amaçlamaktadır. Bu çalışma, âdet hakkında ayrıntılı, belirgin esasları ve prensipleri olan bütüncül bir teori oluşturulmasını; onun, varlığın anlaşılmasındaki rolü ve ilişkisini İslami bakış açısı bakımından incelenmesini. Nitekim İslami varoluş perspektifi ve onun bilgideki rolü ile Batı felsefeleri arasında gerek teorik düzeyde gerekse bilgi ile ilişkili birçok önemli konuda iki bakış açısının farklılaşmasında etkileri gözüken pratik düzeyde temel bir farklılık bulunmaktadır. Bu çalışma, âdetin genel olarak insan bilgisindeki rolünün, onun özellikle dini bilgiyle olan ilişkisinin açıklanması, bilginin ve dini bilginin kaynağı olarak âdete dayanma seviyesinin ve İslam hukuk sistemi içinde fıkıh usulü ve kelam ilminde ifadesini bulan âdetin gelme düzeyinin, dini bilginin inşasında âdetin rolünü temellendirme ve onun etkilerini açıklama bakımından kıyas, icma ve umum belva gibi fıkıh usulündeki bazı önemli konularda âdetin etkilerinin açıklanmasının yanında dinin sabitliğinin ortaya konulduğu üç büyük konu olan“peygamberin sübutu”,“mucizeler”ve“mutevatir haberler”hakkında âdetin rolünün araştırılarak fıkıh usulünde âdet teorisinin yeterli düzeyde bütüncül bir görünümünün çizilmesi, onun önemi ve merkezi rolünün şüphe bırakmayacak şekilde ortaya çıkarılması amacıyla âdet teorisini inşa etmektedir. Bu çalışma, iki bölüme ayrılır: ilk bölümde varlık ile bilgi arasındaki ilişki ve âdet teorisinin temellendirilmesi ele alınırken, ikinci bölümde ise âdet teorisinin İslamî bilgi sistemine etkileri gerekli durumlarda karşılaştırmalı metodun kullanılmasının yanında çoğunlukla analitik çıkarım ile ele alınmaktadır."
