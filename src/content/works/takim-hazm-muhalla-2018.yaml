abstract: "Çalışmamızda İbn Hazm'ın el-Muhallâ adlı eserinde Ahmed b. Hanbel'e isnad edilen ibadet bahsindeki konuları tahkik etmeye çalıştık. Tezimizde 92 tane görüş ele alınmış olup, bunların 7 tanesi yanlış olarak tespit edilmiştir. Bu hatalar Taharet, Namaz, Oruç, Kurban v.b konularda tespit edilmiştir. Yanlış sayısının bu sayıda olmasının sebeplerinden biri İbn Hazm zamanında Hanbelî mezhebinin Endülüs'te bilinmiyor olması ve Ahmed b. Hanbel'in bir mezhep imamından çok bir muhaddis olarak tanınıyor olmasıdır. İncelemesini yaptığımız görüşler Hanbelî mezhebinin meşhur kitaplarından araştırılmıştır. Başlıca referans kaynağı İbn-i Kudame'nin el-Muğni adlı eseridir. Bu çalışmadan yola çıkarak her eserin tahkike ihtiyacı olduğu kanaatine varmaktayız."
