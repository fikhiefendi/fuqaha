abstract: "Bu çalışma, İslam miras hukukunda terikenin mirasçılar arasında taksimi yapılırken gözetilen maslahatları, gaye ve amaçları araştırmak üzere gerçekleştirilmiştir. Zira İslam hukukunda hükümler bir takım gaye ve hedeflere binaen ortaya konmuştur.İslam hukukunda mirasın vârislere dağıtılması hususunda adalet prensibi gözetilerek ölene olan yakınlık, mala duyulan ihtiyaç, akrabalık bağlarının güçlendirilmesi ve toplumda servetin yaygınlaştırılması esas alınmıştır.İslam miras hukukunda miras paylaştırılırken; vârislerin yüklendiği sorumluluklar, miras bırakana faydalı olma, dostluk ve yardımlaşma gibi hususlar da göz önünde bulundurulmuştur. Bu şekilde yapılan paylaştırma hem mûris (miras bırakan) hem de vârisler açısından arzu edilen, tatmin edici bir durum olarak ortaya çıkmaktadır."
