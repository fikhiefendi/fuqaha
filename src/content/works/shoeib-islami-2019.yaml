abstract: "Bu araştırma, İslami yatırım fonları ve bu fonlarla ilgili riskleri ve bu fonların çeşitli türlerini ile İslami yatırım fonların sözleşmelerinin yasal süreçleri ve sözleşme taraflar arasındaki yasal düzenlemelerin nasıl olduğuna dair bilgi vermektedir. Araştırma, ayrıca gayrimenkul , gayrimenkul çeşitlerine yönelik yeni satış yöntemlerine değinen İslami yatırım fonları için bir model olarak gayrimenkul fonlarına odaklanmaktadır. Gayrimenkul yatırım fonunun farklı unsurlarını ve baştan sona kadar yapılan işlemleri ayrıntılı olarak açıklamaktadır. Bu araştırmada, Arap bölgesi ve Türkiye'deki çeşitli fonları mukayeseli olarak analiz ederek karşılaşılan sorunları ve bunların nasıl üstesinden gelineceğine değinilmiştir. Çalışmanın sonunda mevcut fonların daha verimli ve etkili olmaları için bazı yararlı önerilerde bulunulmuştur. Çalışmada ayrıca, küçük ve orta gelirli yatırımcıların mevcut fonları gereken ölçüde talep etmedikleri , ancak yeterli bilgi sahibi olmadan yatırım portföyleri oluşturduklarını da değinmiş. Birkaç örnek olay çalışmasıyla , karşılaşılan sorunlara ve bu sorunlara getirilebilecek çözümlerin üzerinde durulmuştur. Araştırmanın sonunda, İslami fonların bulunduğu ülkede ekonomik gelişime sağlayacağı katkıyı artırmak adına bir çözüm sunan, Küçük ve Orta Ölçekli Fon adı verilen yeni bir fon türü için entegre bir model tanıtılmıştır."
