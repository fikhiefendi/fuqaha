abstract: "İslâm hukukunda hastanın tedaviyi reddetme hakkı, insanın beden bütünlüğüne ve kişisel iradesine verilen değere dayanmaktadır. Çalışmamızda, hastanın iyileşme süreci devam ederken tedaviyi reddetme kararı alması durumunda, reddetme sebepleri, kimlerin tedaviyi reddedip reddedemeyeceği veya hangi durumlarda böyle bir hakkın elde edilebileceği sorularının cevabı açıklanmaya çalışılmıştır. Bu çalışmada, öncelikle tedavi kavramı açıklanmaya çalışılarak, dini açıdan tedavinin hükmü incelenmiş, hukukî açıdan tedavinin yeri irdelenmiş ve İslami gelenekte tedavi yöntemleri ele alınmıştır. Ardından hak kavramı kapsamında hasta hakları hukukî ve fıkhî açıdan incelenerek tedaviyi ret hakkına zemin hazırlanmıştır. Son olarak hastanın tedaviyi reddetme hakkı hukukî ve fıkhî açıdan incelenerek genel bir değerlendirme yapılmıştır."
