abstract: "İşbu tez çalışması medeni hukuk bağlamında Osmanlı İmparatorluğu döneminde kurulan cemaat/azınlık vakıflarının güncel tüzel kişilik ve mülkiyet sorunlarını konu almaktadır. Çalışmamızda ilk olarak azınlık, cemaat ve vakıf kavramlarına ilişkin genel mahiyetteki bilgilere yerilecek, günümüzde cemaat vakıfları olarak adlandırılan bu kurumların iyi anlaşılabilmesi ve sorunların tespiti açısından Osmanlı ve cumhuriyet döneminde azınlıklara tanınan haklar, azınlık kurumlarının işleyişi ve özellikle de Lozan Antlaşması'nda yer alan azınlık haklarına ilişkin hükümler incelenecektir. Ardından cemaat vakıflarının geçmişten süregelen tüzel kişilik ve mülkiyet sorunları mevzuat, doktrin, içtihat ve Avrupa Birliği Türkiye İlerleme Raporları kapsamında değerlendirilecek ve çözüm önerileri sunulacaktır."
