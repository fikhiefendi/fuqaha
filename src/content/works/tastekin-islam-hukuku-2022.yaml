abstract: "Soru sorma insanlık tarihi kadar eskiye dayanır. Soru sormanın bu kadar uzun bir geçmişe sahip olması insandaki merak duygusundan kaynaklanır. Sahip olduğu merak duygusunu tatmin etmek için insan, gözünü açtığı günden bugüne kadar gördüğü, şahit olduğu her şeyi sorgular. Bu durum hem pratik hayat için ve hem de genelde bütün bilimler özelde ise araştırma konumuz olan Temel İslam Bilimleri için de aynı şekilde söz konusudur. Dini metinlerde de insandaki bu merak olgusunu tatmin edecek pek çok soru örnekleriyle karşılaşmak mümkündür. Soru sormak temelde teşvik edilen bir aktivite olmakla birlikte her zaman olumlu ve kabul edilebilir sonuçlara yol açtığı söylenemez. Biz bu araştırmamızda soru sormanın İslam hukukunda nasıl ele alındığı, olumlu/teşvik edilen soru örnekleri, olumsuz (mekruh ve haram) soru örnekleri, bu tür soru örneklerinin hukukî alana etkisi gibi konulara değindik. Birinci bölümde soru meselesinin mahiyeti, kavramsal çerçevesi ve çeşitleri üzerinde durduk. İkinci bölümde Kur'an ve Hadislerde soru, üçüncü bölümde ise İslam hukukunda soru konularını ele aldık."
