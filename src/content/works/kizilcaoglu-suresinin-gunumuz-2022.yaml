abstract: "Bu çalışmada, Allah-u Teâla'nın insanlara hidayet ve rehber olarak göndermiş olduğu mukaddes Kitabı Kur'ân-ı Kerim'in 24. sırada gelen Nûr sûresinin, günümüz insanına verdiği mesajlar incelenmiştir. Bu sûre, inananların ferdî ve içtimaî hayatını düzenleyecek, onlara kişilik ve kimlik kazandıracak ehemmiyetli emir ve nehiylerin verildiği bir sûredir. Bunların yanı sıra, aile içi ve sosyal ilişkiler ile alâkalı adab-ı muaşeret kuralları, zina ve kazf ile ilgili hükümler, insanların iffet ve namuslarını korumada İslâm toplumunu daha dikkatli olmaya davet, nikâh, bekârların evlendirilmesine teşvik konuları da sûrenin muhtevasındadır. Ayrıca Nûr sûresi, münafıkların ve kâfirlerin durumu, şeytanın ve şeytani niteliklere sahip insanların tuzaklarına karşı uyarı, sosyal ahlâk ve toplu ibadetin vazgeçilmezi camilerin önemi, Allah'a ve Peygamberine itaatin gereği, selamlaşma, evlere giriş çıkış âdâbı, tesettür, mahremiyet, edep ve iffet gibi ahlâkî olgunluk kazandıracak özellikteki esasları ihtiva eder. Bu özelliği itibariyle günümüzde ve gelecekte birey, aile ve toplumun saadet ve huzurunu sağlayacak olan ahlâkî esas ve kuralları, insanlığa ışık tutacak niteliktedir. Tezimizde Nûr sûresindeki ayetlerde verilmek istenen mesajlar belirlenerek maddeler halinde tasnif edilmiştir. Çalışma Nûr sûresi ile sınırlı olmakla beraber Kur'ân'ın genelinde konu ile alâkalı örnek teşkil eden ayetlerle pekiştirilmiştir. XII Bu gayretimizde günümüzde ferdî, ailevî ve içtimaî huzur ve barış içinde yaşamalarını sağlayacak olan bireysel ve toplumsal esasların bilinmesi, özümsenmesi amaçlanmıştır. Dolayısı ile birey, aile ve toplumlarda meydana gelen ahlâkî çöküntü, aile kavramının önemini yitirmesi, mahremiyet konularına gereken önemin verilmemesi gibi toplumun çöküşüne zemin hazırlayan kötü davranışların Kur'ân-ı Kerim'deki bu ilahî mesajlar ile çözüme kavuşabileceği bir gerçektir. ."
