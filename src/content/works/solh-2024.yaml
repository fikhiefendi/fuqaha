abstract: "Çalışma, yapay zeka kavramını, tarihini, türlerini ve çeşitli alanlarını tanımlamış; fakihler arasında hak kavramı ve bölümlerini, fikri mülkiyet haklarının fıkhi ve yasal yönlerini tartışmıştır. Ayrıca, yarar kavramını ve fikri mülkiyet haklarının yarar kapsamına girdiğini belirtmiştir. Fikri mülkiyet haklarının farklı türlerini, bunların mali değerini ve zekâta tabi olup olmadığını açıklamıştır. Son bölümde, fikri mülkiyet haklarının korunması ve bunlara yönelik ihlal türlerinden bahsedilmiştir. Bunun yanı sıra, fikri mülkiyet haklarına ilişkin çağdaş uygulamalardan bazı örnekler ve yapay zekanın en yeni gelişmelerine ilişkin çağdaş uygulamalar, örneğin derin sahtecilik (Fakedeep) ve kendi kendine çalışan mağazalar gibi uygulamalar ve bunların fıkhi hükümlerini açıklamıştır. Çalışma, fikri mülkiyet haklarını etkileyen bazı zorlukları, sonuçları ve araştırmacı tarafından yapılan bazı önerileri de içermektedir."
