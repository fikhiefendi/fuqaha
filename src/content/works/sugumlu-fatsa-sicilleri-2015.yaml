abstract: "Bu tezde, h.1320-1323/m.1902-1905 yıllarını kapsayan 72 nolu Fatsa şer'iye sicil defteri okunup transkribe edilerek sicil kayıtlarındaki bilgilerden hareketle söz konusu dönemde Fatsa'nın siyasi, idari, sosyal, kültürel ve iktisadi durumu hakkında tespitler yapılmaya çalışılmıştır. Bu çalışmadan maksadımız Fatsa tarihinin anlaşılmasına katkıda bulunmaktır. Bu bağlamda tezimizin giriş bölümünde, tezin amacı, yöntemi, üzerinde çalıştığımız şer'iye sicillerinin kayd edildiği dönem olan XX. Yüzyılın başında Fatsa'nın kısa tarihi ve mevcut hali ile genel olarak şer'iye sicillerinde yer alan belge çeşitleri hakkında bilgi verilmiştir. Birinci bölümde, tezimizin konusunu oluşturan 72 nolu Fatsa şer'iye sicil defterinin muhtevasının tanıtımı yapılmıştır. Bu çerçevede zamanla Osmanlı Devleti'nin idari sisteminde yapılan düzenlemeler ve bunların Fatsa'nın idari statüsüne ve idari makamlarında meydana getirdiği değişiklikler gösterilmiştir. İkinci bölümde, yine üzerinde çalıştığımız 72 nolu Fatsa şer'iye sicil defterindeki kayıtlardan hareketle Fatsa'nın o dönemdeki nüfus yapısını, nüfus hareketlerini ve bölgedeki yerleşim yerlerinin isimlerini tespit etmeye gayret edilmiştir. Üçüncü bölümde, sicil kayıtlarındaki bazı bilgilere göre Fatsa'nın iktisadi durumu, geçim kaynakları ve bölgenin ticari hayatı hakkında tespit ve değerlendirmeler olmuştur. Dördüncü bölümde ise, Fatsa'nın sosyo-kültürel yaşamı ve toplumsal dinamikleri incelenmeye ve şer'i mahkemelerine yansıyan bireysel ve toplumsal vakaların neler olduğu değerlendirilmeye çalışıldı. Şer'iye sicilleri, yazıldığı dönemin siyasi, ekonomik ve sosyo-kültürel durumu hakkında bizlere bilgi vermektedir. Bu nitelikleriyle şer'iye sicilleri, Osmanlı tarihinin önemli kaynaklarından biri olarak değerlendirilmelidir."
