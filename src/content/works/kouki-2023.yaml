abstract: "Bu çalışmada feminist düşünceye göre evlilik kavramının neye tekabül ettiğini ortaya koymak bununla ilgili olarak kadın ve kadınlık meselesi, aile mefhumu ve erkek ile kadın arasındaki aile bağlarının açıklanması, bunun yanı sıra annelik, beden, cinsiyet, kadının bedensel özgürlüğü, çalışma, mehir ve miras gibi kadının ekonomik özgürlüğüne taaluk eden sorunların irdelenmesi hedeflenmiştir. Bu çalışmada, feminizmin anlaşılmasına ilişkin tezdeki temel kavramları, sorunları ve konuları İslam hukukunun ilkeleri, değerleri ve kökenleri üzerinden eleştirel bir şekilde ele alındı. Betimleyici, analitik, tümevarımcı ve eleştirel bir yaklaşımın izlendiği çalışmada çeşitli sonuçlara ulaşılmıştır; bunlardan en önemlisi, tüm biçimleriyle feminist hareketlerin, İslami görüşle neredeyse tamamen çelişen Batılı felsefe ve vizyonların doğal bir seçkisi olduğudur. Temel referansı, Batı feminizminin bazı entelektüel akımlarla birleşerek sonunda kadının bedenini ve zihnini işgal eden zalim ve adaletsiz ataerkil toplumun otoritesinden kurtuluşunun ve ondan tam bağımsızlık mücadelesinin bir işareti haline gelme çabasına dayanmaktadır. Bu nedenle feminist düşüncenin evlilik konusundaki eşitlik talebi kadın ve erkek arasındaki rol ve görev farklılıklarının varlığını sürdüren doğal, biyolojik, psikolojik ve sosyal farklılıkları ihmal etmiştir. Çalışma, özellikle evlilik ve aile konusunda feminist fikir ve teoriler üzerine daha eleştirel İslami araştırmalar yapılmasını ve ilgili konulara özgün yaklaşımlar getirilmesini, kadın ve erkek arasındaki doğal ve biyolojik farklılıkların açıklığa kavuşturulmasını ve yasal hak, görev ve sorumluluklarının netleştirilmesini tavsiye etmektedir."
