abstract: "Modern sosyal medyanın ortaya çıkması ve bu modern araçların kullanımında meydana gelen gelişme nedeniyle ortaya çıkan“elektronik zina”araştırma konusu, araştırılmayı ve tahlil etmeyi hak eden bir durumdur, çünkü bu çağdaş dönemin bir problemidir. Bu problemler, tarihin belli bir kesitinden önce mevcut olmaığından mütekaddimin alimlerimiz tarafından söz konusu yapılmamıştır. Bu nedenle konunun araştırılması, hukuki hükmü, nedenleri, biçimlerinin ortaya çıkarılması ve toplumumuz üzerindeki olumlu ve olumsuz sonuçlarının ortaya çıkarılması önem arz ettiği kanaatindeyiz. Konunun dini boyutu yanında fert ve aile boyutu da önem arz etmektedir. Fertlerin fizyolojik ve psikolojik açıdan etkilerinden aile içi birden fazla açıdan sonuçlara yol açtığı da erbabının malumudur. Ayrıca yabancı erkek ve kadın arasındaki ilişkilerin kurulması gibi bazı hukuki meseleleri ortaya koymayı da gerektirir. modern sosyal iletişim araçlarıyla karşılıklı yapılan sözlü görsel iletişim vasıtasıyla dinen caiz görülmeyen, ahlaken hoş karşılanmayan ve tıbben onaylanmayan söz konusu durum(lar)ın fıkhî açıdan karşılaştırmalı tahlili gerektiği, bu konuyla direk vedolaylı alakalı olan ayet ve hadislerin dilbilim, tefsir ve ahkam açısından tahlili gerektirmektedir. Çalışmada ayrıca izin verilebilirliğin sınırlandırılmasına ilişkin hükmün beyanı ve bu araçların İslam hukukuna göre yasak olan bir şekilde ve bunlardan kaynaklanan zararlardan dolayı bir yasal vasinin kullanılmasına izin verilip verilmeyeceğine de değinilmiştir. Araştırmanın sonuçları şu şekilde ifade edilebilir. Araştırmanın ortaya çıkardığı sonuç; elektronik zina biçimlerinin İslam hukukunda dolaylı da olsa yasaklandığı anlaşılmış, ancak elektronik zina diye tabir edilen suça herhangi bir ceza öngörülmediğini ve bunun da ihtiyari ceza kapsamına girdiğini ortaya koymuştur. Hakime veya idarecilere bırakılan bir meseledir. Bu mesele çağımızda var olup, özellikle Müslüman toplumlarımızın sosyal ve değer sorunlarından biri olarak durmaktadır. Bu sorun her ne kadar tamamen ortadan kaldırılamaz ise de toplumun bu konuda bilinçlendirilmesi, sebebiyet verdiği sosyal, ailevi, dini ve ahlaki sorunların anlatılması ile bu tür girişimlerin azalması dolayısıyla sebep olduğu zararların minimize edilmesi mümkündür. Kuran ve Sünnete uyularak, ahlaki ve insanî açıdan bu eylemlerin etkilerini azaltma çerçevesinde çalışan kurumlarla işbirliği yapılarak sosyal hayata olumsuz etkileri hafifletilebilir. Söz konusu bu çalışma bu noktada bir boşluğu dolduracağı kanaatindeyiz."
