abstract: "Bu çalışma, 18. yüzyıl Hanefî fakihlerinden Muhammed el-Halebî'nin (ö. 1190/1776), Alâeddin el-Haskefî'ye ait ed-Dürrü'l-Muhtâr üzerine kaleme aldığı“Nefâihu'l-Ezhâr fî Keşfi'l-Esrâr”adlı şerhinin tahkik ve incelemesini konu edinmektedir. Araştırma, eserin“Vitr Namazı”babından başlayıp“Orucu Bozan Şeyler”babının sonuna kadar olan kısmını kapsamaktadır. Çalışma iki ana bölümden oluşmaktadır:“İnceleme”bölümünde müellifin hayatı, ilmî şahsiyeti ve eserin Osmanlı hukuk düşüncesindeki yeri tahlil edilmiştir. Bu bölümde ayrıca müellifin fıkhî metodolojisi ve ed-Dürrü'l-Muhtâr üzerine yazılan diğer şerhlerle olan münasebeti ele alınmıştır.“Tahkik”bölümünde ise eserin yazma nüshaları edizyon kritik yöntemine göre mukayese edilerek metin tesis edilmiş; fıkhî ibareler açıklanmış, hadislerin tahrici yapılmış ve mezhep içi görüş farklılıklarına dair kaynaklara atıflar eklenmiştir. Bu çalışma, geç dönem Hanefî fıkıh literatüründeki ibadet (namaz ve oruç) konularına dair ayrıntılı tartışmaları gün yüzüne çıkarması bakımından önem taşımaktadır."
