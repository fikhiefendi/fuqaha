abstract: "Fıkhın delillerinden üçüncü sırada gelen icmâ, kuvvetler sıralamasında ilk sırada yer almaktadır. İcmâ hem Kitap ve Sünnet ve hem de kıyas ve haber-i vâhit üzerine kurulduğu için bunların hepsine dâir bahisler içermekte ve bu yönüyle adeta bir çerçeve delil niteliğini almaktadır. Bu nedenle doğru bir fıkıh tasavvuru oluşturmak için icmâın tümüyle anlaşılması gerekmektedir. Bu çalışmada incelenmesi ve Hanefi fıkıh usûlü açısından konumlandırılması son derece önemli görülen iki müellifin, Pezdevî ve Semerkandî'nin icmâ anlayışları karşılaştırmalı olarak ortaya konulacaktır. Ayrıca bu çalışma Hanefi usûlünde icmâ teorisi hakkında genel bir değerlendirme niteliğindedir. Bu bağlamda icmâın tanımından icmâda neshin câri olup olmamasına kadar pek çok mesele, çalışmaya konu edilmiştir."
