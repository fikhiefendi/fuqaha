abstract: "Bu araştırmamızda Cessâs'ın“Ahkâmu'l-Kur'ân”isimli eserinde geçen Ferâiz konulu hadislerin tespîti yapılacaktır. Çalışma giriş ve iki bölüm ve sonuç bölümünden oluşmaktadır. Giriş bölümünde araştırmanın konusu, önemi, amacı, kaynakları ve metodu açıklanmıştır. Birinci bölümde Cessâs'ın hayatı, ilmi kişiliği, hocaları, talebeleri, diğer eserleri ve özellikle de Ahkâmu'l- Kur'ân isimli eseri hakkında kısaca bilgiler sunulmuştur. İkinci bölümde çalışmanın ana konusu olan Ferâizle (miras hukuku) ilgili hadislerin tespît, tahrîc ve tahlîli yapılmıştır. Sonuç bölümünde ise elde edilen veriler doğrultusunda kısaca bir değerlendirme yapılmıştır."
