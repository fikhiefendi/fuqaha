abstract: "İnovasyon, büyüme, verimlilik ve rekabet avantajı açısından önemli fırsatlar sunan FinTek akımı İslami finans ve bankacılık sektöründe giderek daha fazla ilgi görmektedir. Öte yandan teknolojinin istihdam, çevre, toplumsal doku, yaşam kalitesi ve benzeri unsurlar üzerinde oluşturduğu olumsuz etkiye dair de sürekli yeni bulgular ortaya çıkmaktadır. Literatürde söz konusu FinTek uygulamalarının İslami finans ve bankacılık sektörü paydaşları tarafından nasıl algılandığına dair çalışmalar oldukça sınırlıdır. Bu tez, FinTek'in İslami bankacılık ve finans sektörü üzerindeki etkisi hakkında merkez bankası düzenleyicileri ve Kıdemli bankacıların görüşlerini almak için uzman görüşmeleri şeklinde nitel bir araştırma tasarımı kullanmaktadır. Çalışma, FinTek'in IBF üzerinde büyük bir etkisi olduğunu ortaya koyuyor. FinTek, banka hesabı olmayan nüfusun büyük bir bölümünün finansal olarak dahil edilmesini sağlar. Çalışma ayrıca, işçilerin değiştirilmesi nedeniyle iş kaybı da dahil olmak üzere bazı olumsuz etkilerin olduğunu tespit ediyor. FinTek ayrıca banka personeli ve müşteriler arasında daha önce var olan yakın ilişkiyi de değiştirdi. FinTek'i benimsemedeki zorluklar arasında farkındalık, finansal kurumun büyüklüğü, güvenlik ve diğerlerinin yanı sıra Şeriat'a uygunluk sayılabilir. FinTek'in geleceği hem olumlu hem de olumsuz etkilere sahip olacak ve IBF, olumsuzdan çok olumlu etkiler yaşayacak."
