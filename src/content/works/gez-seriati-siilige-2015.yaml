abstract: "Bu çalışmanın amacı, İran'da belli bir döneme damgasını vuran, Sosyoloji ve Dinler Tarihi alanında birçok eseri bulunan Ali Şerîati'nin İran toplumuna vermek istediği mesajları belirlemektir. Bu çalışmadaki unsurlar anlamlı bir bütün oluşturacak şekilde sınıflandırılmış ve iki bölümde ele alınmıştır. Çalışmanın giriş kısmında araştırmanın metodu ve kaynakları üzerinde durulmuştur. Çalışmanın birinci bölümünde, Şerîati'nin hayatı, dini kişiliğini etkileyen şahsiyetler, eserleri, İmâmîyye Şiası'nın Tarihçesi, Şiîliğin ortaya çıkışı, Îmâmîyyenin Teşekkül süreci, Gaybet Teorisi ve Ahbârilik, Usûlîliğin Hâkim Olması, Safeviler Döneminde İmâmîyye, Safeviler Sonrası İmami Tarihi ve İmâmîyye Şia'sının Temel Görüşleri ele alınmıştır. Araştırmamızın ikinci bölümünde, Şerîati'nin Şiîiliğe Bakışı, Şerîati'nin İtikâdi ve Fıkhi Görüşlerive Temel Kavramlara bakışı hakkında bilgiler verdik. Şerîati' nin Şia Algısında Erken Dönemin Yeri ve Önemi üzerinde durarak Kur'an ve Peygamber anlayışına, Hz. Ali, Hüseyin ve Ehl-i Beyt anlayışına, Dört Halife ve Sahabe anlayışına, Muaviye ve Yezit konularındaki görüşlerini değerlendirdik. Son olarak da Şerîati' nin İdeal ve Gerçekleşen Ayrımı olan, Ali Şiası, Safevi Şiası ve bunların temel özellikleri konularını ele alarak Şerîati'nin Şia anlayışını belirlemeye çalıştık. Sonuç bölümünde, Şerîati'nin Şiîliğe bakışı, nasıl bir Şiî anlayışa sahip olduğu, İran toplumuna vermek istediği mesajlar, çalışma sonunda ortaya çıkan veriler ışığında değerlendirilmiştir. Çalışmada kullanılan bütün kitap, tez ve makaleler Bibliyografya kısmında bir araya getirilmiştir. Anahtar Sözcükler; Ali Şerîati, Şia, Safevi, İran, Îmâmîyye"
