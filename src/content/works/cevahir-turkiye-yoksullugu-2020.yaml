abstract: "Zekât, nisap miktarı gelire ve servete sahip olan Müslümanların dinen zorunlu olarak ödemeleri gereken mali bir yükümlülüktür. Ayette (Tevbe, 60) kendilerine zekât ödenmesi gereken sekiz sınıf içinde ilk başta yoksullar ve miskinlerin yer alması zekâtın yoksulluğu azaltıcı etkisinin açık kanıtıdır. Ancak zekâtın toplanması ve dağıtılmasını kolaylaştıran aracı bir kurum olmazsa, mükelleflerin zekâtlarını hesaplamaları ve gerçek yoksulu bulmaları hiç kolay olmaz. Ayrıca doğrudan ödeme zenginle yoksul arasında onur kırıcı bağımlılık ilişkisine yol açabilir. Zekâtı hesaplama, yoksulları tespit etme ve zekâtı dağıtma işinde uzmanlaşmış zekât kurumu olması halinde, zekât gelirleri artabilir, gerçek yoksullar daha sağlıklı tespit edilebilir ve böylece yoksulluk azaltılabilir. Zekât kurumu olması halinde, kurum zekâtı dağıtırken görevini yerine getiriyor olacağı ve ödemeler zekât havuzundan yapılacağı için onur kırıcı bağımlılık ilişkisi oluşmaz. Çalışmada zekâtın yoksulluğu azaltıcı etkisi, Türkiye örneğinde en zengin %20'nin, %40'ın ve %60'ın zekât vermesi halinde yoksullukta meydana gelecek azalma hesaplandı. Ayrıca potansiyel mükelleflerin zekât kurumu kurulması hakkındaki görüşlerini tespit etmek amacıyla, Sivas Organize Sanayi Bölgesi'nde faaliyet gösteren firmalara yönelik anket uygulandı. Ankete verilen cevaplardan firma yetkililerinin zekât kurumu kurulmasına kuvvetli bir destek vermedikleri tespit edildi. Buradan hareketle öncelikle toplumu zekât konusunda bilinçlendirmeye ihtiyaç olduğu sonucuna varıldı."
