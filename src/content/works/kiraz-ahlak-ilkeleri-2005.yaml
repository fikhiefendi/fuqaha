abstract: "TEMEL SLÂM B L MLER ANAB L M DALITEFS R B L M DALIKUR'ÂN'DA AHLAK LKELER-TEVRAT, ZEBUR VE NC L'LE MUKÂYESEL B R ÇALIŞMA-Celil K RAZ(Doktora Tezi)ÖZETTez, giriş, dört ana bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde, araştırmadaincelenen sorun, bu sorunu çözmek için kullanılan yöntem ve araştırmada yararlanılankaynaklar genel olarak tanıtılmıştır. Birinci Bölüm'de, Ahlâk lmi, Ahlâk Felsefesi ve DûnûAhlâk Anlayışları başlığı altında, ahlâk ilminin tanımı, konusu, gâyesi ve kısımları, ahlâkilminin diğer disiplinlerle ilişkisi, önemli teorik ahlâk problemleri, önemli ahlâk ekolleri veYahudilik, Hıristiyanlık ve slâm'da ahlâk anlayışı konuları incelenmiştir. kinciBölüm'de, Bireysel ve Âilevû Ahlâk lkeleri başlığı altında, Kur'ân'ın ve önceki kutsalkitapların genel olarak bireye bakışı, bireyin Allah'a karşı ahlâkû sorumlulukları,Kur'ân'ın ve önceki kutsal kitapların genel olarak âileye bakışı ve âile bireylerininbirbirlerine karşı ahlâkû sorumlulukları konuları işlenmiştir. Üçüncü Bölüm'de,Toplumsal Ahlâk lkeleri başlığı altında, Kur'ân'ın ve önceki kutsal kitapların genelolarak topluma bakışı ve doğruluk, cömertlik, iffet gibi toplumsal ahlâk ilkeleriincelenmiştir. Dördüncü Bölüm'de de Devlet, Siyâset, ş ve Ticâretle lgili Ahlâk lkeleribaşlığı altında, Kur'ân'ın ve önceki kutsal kitapların genel olarak devlet ve siyasete bakışı,devlet adamlarının ve vatandaşların ahlâkû sorumlulukları, Kur'ân'ın ve önceki kutsalkitapların genel olarak iş ve ticarete bakışı, iş ve ticaretle ilgili ahlâk ilkeleri incelenmiştir.Sonuç kısmında da, araştırmamızda vardığımız sonuçlar genel hatlarıyla zikredilmiştir.Çalışmada yararlandığımız kaynakların sıralanmasıyla da teze son verilmiştir."
