abstract: "Bu araştırmada Ömer Nesefî?nin ?et-Teysîr fî?t-Tefsîr? adlı eseri ile Ebû?l-Fütûh Râzî?nin ?Ravzu'l-Cinân? adlı tefsirleri Kur'ân yorumları açısından karşılaştırılmıştır. Müfessirlerimizden Ömer Nesefî, Hanefî-Mâtürîdî çizgiye bağlı kelam, fıkıh ve tefsir yönü oldukça güçlü bir kişidir. Ebû'l-Fütûh Râzî ise Şîî-Fârisî çizgide olup bu alanda tefsir yazan ilk müfessirdir. Çalışmamız, giriş, üç bölüm ve sonuçtan oluşmaktadır. Giriş bölümünde araştırmanın konusu, amacı, yöntemi ve kaynakları hakkında bilgi verilmiştir. Birinci bölümde ilk olarak tarihî, sosyal ve ilmi yönden müfessirlerin yaşadıkları ortam resmedilmiş, her iki müfessirin hayatları, eserleri, hocaları ve öğrencileri zikredilerek tefsirlerin adları, yazılış tarihleri, hacimleri, mukaddimelerinde işlenilen konular, ayetleri ve sureleri ele alış tarzları hakkında bilgi verilmiştir. İkinci bölümde müfessirlerin ilk ve son inen ayetler, Kur'ân?ın toplanması gibi Kur'ân tarihine ilişkin konuların yanında esbab-ı nüzul, muhkem-müteşâbih, nesh vb. konularında dile getirdikleri de incelenmiştir. Üçüncü bölüm rivayet ve dirayet tefsiri başlıklarına ayrılmıştır. Burada Kur'ân?ın Kur?an?la tefsiri, Kur'ân?ın sünnetle tefsiri, Kur'ân?ın sahabe kavliyle tefsiri rivayet bölümünde ele alınmıştır. Kur'ân?ın dilbilimsel tefsiri yanında müfessirlerin kelamî, fıkhî ve tasavvufî açıdan Kur'ân yorumları da dirayet bölümünde işlenmiştir."
