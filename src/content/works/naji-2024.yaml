abstract: "Üretim, günümüz kalkınmasının temelidir. Bu çalışma, piyasa fiyatı risklerinden korunmada etkinlik sağlayan, anlaşma üzerine belirlenen değişken fiyatla sözleşme yaparak imalat alanında yatırımı kolaylaştırmaya yönelik İslam hukukundan kaynaklanan çözümler sunmayı amaçlamaktadır. dalgalanmalar ve kredi riskleri. Çalışma, kavramların ve terminolojinin tanımlanmasında betimleyici yaklaşımı ve bu tür sözleşmelerin ve yükümlülüklerin geçerliliğini ve meşruiyetini doğrulamak için şeriat delillerine ve onun titizlik ve çıkarım ilkelerine dayanarak tümdengelimli veya tümdengelimli yaklaşımı benimsemiştir. Şu sonuca vardı: Piyasa ve kredi risklerinin ana kaynağını oluşturan değişken maliyetlerin hesaplanmasına yönelik yöntemlerin çeşitliliğine dayanan, nesnel temellere dayalı, anlık veya ertelenmiş değişken fiyat üzerinden sözleşme yapılmasına izin verilmektedir. Şunları önermektedir: İslami bankalar aracılık rolünden uzaklaşarak sanayi ve yenilik alanlarında doğrudan yatırıma yönelmeli, endüstriyel varlıklara sahip olarak birikimli olarak zenginlik oluşturmalı ve İslami bankacılığı gerçekleştirmek için şubelerinin dünya çapında yayılmasından faydalanmalıdır. Düşünce ve uygulamada mükemmellik sağlamak ve faaliyet gösterdiği toplumların gelişimine katkıda bulunmaktır."
