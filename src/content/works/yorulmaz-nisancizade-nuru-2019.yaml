abstract: "On yedinci yüzyıl Osmanlı fakîhi olan Nişancızâde, Şeyh Bedreddin'in yargılama hukukuna dair olan ve uzun yıllar hakimlerin el kitabı olarak kullanılan eseri Câmi'u'l Fusûleyn'i düzenlemek ve ıslah etmek amacıyla Nûru'l-'Ayn fi Islâhi Câmi'u'l Fusûleyn adlı eseri kaleme almıştır. Bu çalışma, Nûru'l-'Ayn'ın“Ahkâmât”faslı (33. fasıl) ile Câmi'u'l Fusûleyn'in“Ahkâmât”faslının (34. fasıl) incelenmesini ve karşılaştırılmasını hedeflemektedir. Nûru'l-'Ayn'da“Ahkâmât”faslı kırk bir adet başlıktan oluşmaktadır. Bu başlıkların bir kısmı Câmi'u'l Fusûleyn'le ortakken, bir kısmı Nişancızâde'nin fasla ilave ettiği başlıklardır. Araştırmamız üç bölümden oluşmaktadır. İlk bölümde, iki eser arasındaki ortak başlıklar üslup ve telif tarzı bakımından karşılaştırılmış, Nişancızâde'nin nerelerde ve hangi yöntemlerle ıslahta bulunduğu incelenmiştir. İkinci bölümde, Nişancızâde'nin bölüme ilave ettiği başlıklar üslup ve telif tarzı bakımından ele alınmış, bu başlıkların nereden alıntılandığı ve kapsamında bulunan konuların klasik fıkıh kitaplarındaki yeriyle ilgili genel bir çıkarım yapılmıştır. Üçüncü bölümde ise Nûru'l-'Ayn'ın 33. faslı, aralarında bazı farklar bulunan iki farklı müellif nüshasına dayanılarak tahkik edilmiştir."
