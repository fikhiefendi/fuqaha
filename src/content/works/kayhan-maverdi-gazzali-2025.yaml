abstract: "ÖZET İnsanları yönetme sanatı olarak tanımlanabilecek olan siyaset, insan ve toplum hayatının merkezinde yer alan bir olgudur. İslâm toplumunda da ilk dönemlerden itibaren siyaset önemli bir yer işgal etmiş ve gerek kelâm gerekse fıkıh alanlarında Müslüman ilim adamlarının devlet başkanlığı(imâmet/hilâfet) konusunda fikirler ortaya koyduğu bir olgu olmuştur. Mâverdî ve Gazzâlî de İslâm dünyasının yetiştirmiş olduğu iki önemli düşünür olup, genelde siyaset üzerine özelde imâmete ilişkin yazdıkları eser ve ileri sürüdükleri düşüncelerle yaşadıkları dönem ile sonraki dönemleri etkilemiş isimlerdir. Mâverdî 11. asrın ilk yarısında yaşamış önemli bir Şafii fakihi olup, öncesinde kısmen bir Kelâm meselesi olarak ele alınmış“Siyaset Teorisi ve Devlet İdaresi”ni, ilk defa İslâm tarihinde“El-Ahkâmü's-Sultâniyye”adlı meşhur eserinde müstakil ve sistemli olarak ele almıştır. Geçmiş ve günümüz toplumunun en temel problemlerinden biri olan siyaset üzerine, devlet kademelerindeki görevi dolayısıyla yaşadığı tecrübeleri de dikkate alarak değerlendirmelerde bulunan Mâverdî, özellikle kamu hukuku alanında günümüz devletlerinin kurumlaşmasını da etkilemiştir. Gazzâlî dönemindeki siyasî problemleri göz ardı etmeden siyasetin yaşanan/mevcut durumuyla ilgilenmiştir. Gazzâlî, ayrıca Batınîlik gibi İslâm toplumuna zarar veren ve bölücü faaliyetlerde bulunun hareketle, ilmi/fikri mücadele etmiş din-siyaset ve akîde noktasında Ehl-i Sünnet düşüncesinin savunucusu olmuş, aynı zamanda Müslümanların birliğini sağlama gayretinde olmuştur. Çalışmamızda Sünnî geleneğin etkin iki şahsiyeti; Mâverdî ve Gazzâlî'nin imâmet görüşleri, hayatı, ilmî kişiliği ve eserleri, ele alınmıştır. Aynı zamanda düşünce/fikir olarak beslendikleri ve etkilendikleri ilmi gelenekten bahsedilmiş, imâmet/hilâfet konusunda meşhur fırkaların görüşleri üzerinde durulmuştur."
