abstract: "Ferâiz, İslam hukukunun alt kollarından biri olan miras hukukuna verilen addır. Ferâiz-nâmeler de miras hukuku hakkında yazılmış eserlerin genel adıdır. Ölen kimsenin geride bıraktığı mal ve hakların, mirasçılar arasında belirli kurallar çerçevesinde pay edilmesine dair geniş bilgi veren bu eserler, insanoğlunun sosyal ve ekonomik hayatını düzenlemesinde yol gösterici olması bakımından önem taşır. Ferâiz ilmi ile ilgili yazılan eserlerden en ünlülerinden biri Hanefî fâkihi es-Secavendî'nin es-Siraciyye'sidir. Bu çalışmada incelenen el-Ferâʾizuʾl-Vâfîye, Hâcib-zâde Mehmed b. Mustafa İstanbûlî tarafından Secavendî'nin söz konusu eserinden tercüme edilmiştir. Eserin Milli Kütüphane, Çankırı İl Halk Kütüphanesi koleksiyonunda 18 Hk 140/4 numarada kayıtlı nüshası esas alınarak hazırlanan bu çalışmada metnin transkripsiyonu verilmiş, dil incelemesi ve sözlüğü yapılmıştır. Böylece hem miras hukuku tarihine katkı sağlanması hem de 18. yüzyıl Osmanlı Türkçesine ait bir metnin ortaya konulması, metnin incelenerek sözlüğünün ve dil özelliklerinin verilmesi amaçlanmıştır."
