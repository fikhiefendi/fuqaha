abstract: "Şevkânî, Yemen'de Zeydî ilim ortamında yetişmiş önemli simalardan biridir. Bununla birlikte fıkıh ve fıkıh usûlünde geleneğin aksine özgün düşünceler ortaya koymakla adından söz ettiren bir âlimdir. Onun, fıkhın temel kaynakları arasında genellikle üçüncü sırada yer alan icmâ deliline yaklaşımı ve önceki usûlcülerin anlayışına muhalefet etmesi, bu alandaki özgünlüğünün bir göstergesidir. Bu yönünün ortaya çıkarılmasını amaç edinen çalışmamız, giriş ve iki ana bölümden oluşmaktadır. Birinci bölümde Şevkânî'nin hayatı, eserleri, ilmî şahsiyeti ve yaşadığı dönemin siyasî, dinî ve sosyal durumları hakkında bilgi verilmiştir. İkinci bölümde ise İrşâdü'l-fuhûl adlı eseri merkeze alınmış ve başta Zeydiyye mezhebi olmak üzere Ehl-i sünnet, Ca'feriyye, Mu'tezile mezhepleri ve çağdaş âlimlerin düşünceleriyle mukayeseye gidilerek Şevkânî'ye göre icmâın tanımı, senedi, icmâ ehliyeti, şer'î kaynak oluşu hakkında tartışılan hususlar ve kaynak değeri gibi usûl konular irdelenmiştir. Bu mukayese sonucu, etkilendiği ve etkilediği âlimlerin düşünceleri de serdedilmiştir. Bu bağlamda Şevkânî'nin usûlcülerin benimsediği icmâ anlayışına karşı duruşu ve yaptığı eleştirileri delilleriyle birlikte irdelenmiş, ayrıca sahâbe icmâı özelinde belirsiz kalan düşünceleri de sahâbe kavli ile birlikte değerlendirilmiştir. Aynı şekilde bu bölümde Zeydî usûlcülerin, hâs icmâ olarak ifade ettikleri“Ehl-i beyt icmâı”hakkında dile getirdikleri deliller değerlendirilmiş, bu çerçevede bu ve benzeri özel icmâlara karşı tutumu açıklanmaya çalışılmıştır. Son olarak da Şevkânî'nin usûldeki icmâ anlayışı ile fıkhî meselelerde kullanmış olduğu icmâ delili arasındaki uyum aranarak hadis ve fıkıh eserlerindeki icmâ terimleri ve icmâ çeşitleri incelenmiştir."
