abstract: "Bilgi ve iletişim teknolojileri, Endüstri 4.0 Devrimi sayesinde hızla gelişmiştir. Bu devrimin önemli bir sonucu, daha geniş bir insan kitlesini etkili ve estetik bir şekilde bir araya getiren ve fayda sağlayan dijitalleşmedir. Sonuç olarak, zekat gibi sosyal organizasyonların hizmet sunma şekillerini değiştirmeye yardımcı olur. Bangladeş'in zekat konusunda büyük bir potansiyele sahip olmasına rağmen, etkisiz yönetim nedeniyle gerçeklik beklentilerin çok uzağındadır. Dijital zekat yönetimi, hizmet verimliliğini artırma ve en iyi zekat sonuçlarını üretme potansiyeline sahiptir. Bu nedenle, bu araştırma, Bangladeş'teki zekat yönetim sisteminde dijitalleşmenin potansiyellerini ve zorluklarını incelemektedir. Çalışma, zekat yönetimi sürecini kolaylaştıracak ve zekat fonlarının toplanması ve dağıtılması sürecinde şeffaflık, hesap verebilirlik ve verimliliği artıracak dijital teknolojilerin benimsenmesinin potansiyel avantajlarını değerlendirmeyi amaçlamaktadır. Ayrıca, ülkede etkili bir dijital zekat yönetiminin kurulmasını engelleyen mevcut zorlukları belirlemektedir. Bu amaçlara ulaşmak için, bu araştırma hem nitel hem de nicel veri toplama ve analiz yöntemlerini içeren karma yöntemli bir ardışık yaklaşımı benimsemektedir. Bunun yanı sıra, bu araştırma, Bangladeş'te zekat yönetiminin dijitalleşme potansiyelini değerlendirmek ve mevcut zorlukların üstesinden gelmek için politika yapıcılara, zekat organizasyonlarına ve diğer paydaşlara bir dizi öneri sunmaktadır."
