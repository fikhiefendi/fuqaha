abstract: "Çalışma Son Dönem Osmanlı ekonomisinde kamu finansman kaynaklarını temel edinerek, gelenek üzerine kurulmuş finansman prensiplerinin zamanla farklı dönem ve süreci takip ederek değiştiğini, farklı enstrümanlar olarak modern Türkiye ekonomisinde kullanıldığını konu edinmektedir. Konunun farklı boyutlarda ele alınması, incelenmesi, araştırılması zaman bakımından sınırlamaya neden olmuştur. Bu sınırlama kapsamında özellikle Osmanlı Son Dönemi ve Türkiye kamu finansmanı türleri ve bunların kullanılmasında İslami prensipler çalışmanın temelini oluşturmaktadır. Araştırma Osmanlı Bankasının kurulmasıyla başlayan tarihi süreçteki kamu finanmanlarını, kullanım alanını, akabinde modern Türkiye kamu finansı tarihindeki enstrüman ve prensipleri temel almaktadır. Özellikle Osmanlı son dönem kamu finansmanın oluşmasındaki temel etkenler, vakıfların üstlendiği röl ve modern Türkiyedeki kamu finansman kaynakları, her iki dönem için kullanılan yöntemler çalışmanın temelini oluşturmaktadır. Aynı zamanda kamu finansının temininde kullanılan kaynaklar, vergi sistemi de karşılaştırılmakta ve her iki dönem için benzerlik teşkil eden özellikler de çalışmaya aktarılmıştır. Sonuç olarak Osmanlı son dönemi ve Modern Türkiye için ister kamu finansman kaynakları, ister bu kaynakların kullanımındaki yöntemler, isterse de iç ve dış borçlanma enstrümanları karşılaştırılmıştır. Aynı zamanda Osmanlıdaki esham, süftece, tahvil gibi faizsiz kıymetli senetlerin günümüzdeki benzer kullanım şekillerinden olan sukukun kullanımı söz konusu olmuştur. Modern Türkiyenin de bu geleneğe ev sahipliği yapması bakımından, sukuk gibi faizsiz senetlerin kullanımı incelenmiştir."
