abstract: "Suçta tekerrür, ceza hukuku alanında eski dönemlerden beri gelişmeye devam eden bir kurumdur. Tekerrürün niteliği hakkında birçok teori ortaya konulmuş, tekerrür türleri belirlenmiş ve tekerrürün cezaya nasıl etki edeceği hakkında sistemler oluşturulmuştur.Bu tez çalışması suçta tekerrürün, Osmanlı Ceza Hukuku'ndaki gelişimini içermektedir. Bu gelişim, Osmanlı'da suçta tekerrür hâlinde verilen cezalar, Klasik dönem kanunnamelerinde ve Tanzimat Dönemi ceza kanunlarında yer alan düzenlemeler ve uygulamayı yansıtan arşiv belgeleri ile beraber incelenmiştir. Batı hukukunun Osmanlı'daki kanunları ne kadar etkilediğini göstermek amacıyla Fransa, Almanya ve İtalya ceza kanunlarındaki düzenlemeler ele alınmıştır.Suçta tekerrür yakın bir zamana kadar cezada ağırlaştırma sebebi olarak kabul edilmiş, kanunlarda bazen genel, bazen de belirli suçlar bakımından düzenleme alanı bulmuştur.Anahtar Kelimeler1.Tekerrür2.İtiyat3.İslam Ceza Hukuku4.Osmanlı Ceza Hukuku5.Ceza Kanunu"
