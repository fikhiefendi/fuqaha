abstract: "VIII./XIV. asırda İslâm dünyasının Moğollar'ın sebep olduğu tahribatları onarmaya çalıştığı bir zamanda yaşayan İbrahim el-Çârperdî, eğitimini Tebrîz'de aldıktan sonra Şam'a göç etmiş âlimlerdendir. İlhanlılar'ın başkenti Tebrîz'den hiç çıkmayan babası Ahmed el-Çârperdî ise İslâmî ilimlerin çoğunda eserler vermiş, dönemin önde gelen âlimlerindendir. Bu çalışmada öncelikle onların yaşadığı VIII./XIV. asır siyasî ve ilmî açıdan incelenmiş, ardından yaşadıkları Tebrîz ve Şam şehirleri kısaca incelenmiştir. Özellikle Tebrîz'in siyasî ve ilmî ortamı tasvir edilmiştir. Daha sonra Çârperdî ailesi ve yazdıkları eserler tanıtılmıştır. Mütedavil biyografik kaynaklarda onlar hakkında yeterli malumat bulunmamaktadır. Bu nedenle kaynaklar genişletilmiş, matbu-yazma genel tarih, şehir tarihleri, kataloglar ve icazet kitaplarına özellikle de onların eserlerinin pek çok elyazması nüshalarına da müracaat edilmiştir. Böylece şimdiye kadar bilinenlerin ötesinde yeni tespitler ve değerlendirmeler yapılmıştır. Nahiv tarihinde önemli yeri olan İbnü'l-Hâcib'in Kâfiye adlı eseri üzerinde çok sayıda çalışma yapılmıştır. Bu eser üzerinde yapılmış erken dönem şerhlerinden biri de Ahmed el-Çârperdî'nin Şükûk ale'l Hâcibiyye adlı eseridir. O bu küçük çalışmada; Kâfiye'ye, büyük kısmı zihninin ürünü olan, kısmen de daha önce dile getirilmiş olan tenkitleri ele almış ve bunları cevaplamıştır. Bunu diğer şerhlerden ayıran özelliklerden biri metinde sadece problemli noktaları ele almasıdır. Bu yüzden tam şerh değildir. Yoğun ve vecîz şekilde yazılan bu eser üzerine daha sonra oğlu İbrahim Kitâbü'l-fükûk fî şerhi'ş-Şükûk adı ile şerh yazmıştır. Metot ve muhteva itibariyle birbirine benzeyen bu iki eserde; Kâfiye'de yapılan tanımlar, ortaya konulan kurallar ve verilen örnekler âdâbü'l-bahs ilminin yöntemleri kullanılarak mantık ilmi açısından değerlendirilmiştir. Ancak Fükûk, Şükûk'u hem metot hem de muhteva açısından daha ileri seviyeye taşımıştır. Ayrıca burada suâlât literatürü değerlendirilmiş ve Şükûk'un yeri tespit edilmeye çalışılmıştır. Fükûk'un muhtevası, yöntemi, kaynakları incelenmiş sonuçta eserin disiplinlerarası bir çalışma olduğu anlaşılmıştır. Zira temelde nahiv kitabı olan bu eser mantık, âdâbü'l-bahs, usûl, vazʿ gibi ilimlerle ilişki içerisindedir. Bu çalışmada bugüne kadar bilinmeyen bu şerhin ilmî usullere uygun şekilde tahkiki yapılarak ilim dünyasının istifadesine sunulmuştur."
