abstract: "Çalışmanın amacı, X. ve XIV. yüzyıllarda İslam hâkimiyetindeki alanlarda iktisadi yapıyı genel olarak ortaya koyarak bu coğrafyada ticaretin işleyişi, ticari muameleler hususlarını aydınlatmak ve tüccarların yaşayış biçimlerini incelemektir. Dört bölümden oluşan çalışmanın giriş bölümünde ticaret algısı, ticarete bakış açısı ve ticareti oluşturan unsurlar hakkında bilgi verilmiştir. Birinci bölümde, İslam coğrafyasının iktisadi düzeni ana hatlarıyla ortaya konulmuştur. İkinci bölümde, malın satın alımdan son müşteriye teslimine kadarki tüm ticari süreçler ele alınmıştır. Üçüncü bölümde, ticari işlemler ve bankacılık faaliyetleri incelenmiş, kıymetli evrak, posta sistemi gibi konulara değinilmiştir. Dördüncü bölümde ise tüm bu faaliyetleri yürüten tüccarların yaşayışlarına, örgütlenmelerine ve dünya uygarlığı üzerinde bıraktıkları etkilere yer verilmiştir. Sonuç itibariyle, İslam uygarlığının iktisadi anlamdaki başarısının X. yüzyıldan itibaren gerilemediği, aksine sonraki birkaç yüzyıl boyunca artarak devam ettiği tesbit edilmiştir."
