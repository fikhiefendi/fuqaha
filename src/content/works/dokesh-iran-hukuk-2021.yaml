abstract: "Dünya tarihi boyunca bireylerin maruz kaldığı tavırlardan birisi ve belki de en önemlisi ayrımcılık olmuştur. Ayrımcılık, bir kişiye ya da gruba bazı özelliklerinden dolayı önyargılı davranılmasıdır. Bu davranış şekli, pozitif ya da negatif yönde olabilir. Ancak, ayrımcılık genel olarak negatif anlam taşıyan bir kavramdır. Temel insan haklarına yönelik tüm tehdit ve ihlallerin arka planında ayrımcılık düşüncesi mevcuttur. Din, dil, ırk ve cinsiyet gibi konularda yapılan ayrımcılıklar, insan haklarının ihlal edilmesine neden olmaktadır. Allah, insanı kendi ruhundan üflediği bir varlık olarak tanımlar. Irkı, dili, rengi ve cinsiyeti ne olursa olsun bütün üstün değerlere sahip kılmıştır. Bu üstün değerlere sahip olan bütün insanları hukuk karşısında eşit olmları gerektiğini söyleyebiliriz. Bu çalışmada da eşitliği esas alarak İran hukuk sisteminde kadınlara yönelik eşitsizliklerden ve ayrımcılıklardan söz edilmeye çalışılacaktır. Beyaz Devrim sonrası başlayan feminist hareketler, İran'daki kadın hareketleriyle şekillenmiştir. Kaçarlar ve Pehleviler döneminden itibaren modernleşme hareketleri ciddi bir şekilde devlet politikasında yer almıştır. Bu dönem İran'ında, Batılılaşma ve modernleşme faaliyetlerinin yanı sıra siyasal, toplumsal ve hukuki reformlara önem verilmiştir ve kadın hareketleri bu dönemde örgütlenmiş bir hareketi olarak ortaya çıkmıştır. Kaçarlar ve Pehleviler İran hukuk sistemine yenileşmesinde ve kadın hareketin örgütleşmesinde önemli katkıları olmuştur. Bu dönemde kadınların toplum içerisindeki ikincil konumu yükseltilmeye başlamış ve bunun sonucunda kadınlara bazı hak ve özgürlükler verilmiştir. Bu dönemde kadınlar, eğitim, aile hukuku gibi konularda, siyasi ve sosyal alanlarda bir takım haklar elde etmişler. 1979 İran İslam Devrimi sırasında en az erkekler kadar İranlı kadınlarında rolleri olmuştur. Örneğin, 1979 Devrimi'nde oldukça aktif rol oynayan İranlı kadınlar, Şah'ın ellerinden aldığı hicap ve örtünme gibi İslami ritüelleri tekrar kazanmak için Devrim Rehberi Ayetullah Humeyni'yi destekleyerek sokaklara çıkmışlardır. Ancak hak ve özgürlüklerini elde etmek için sokağa çıkan kadınların çabaları, çok kısa bir süre içerisinde yerini baskı sistemine bırakmıştır. İslam Devrimi'nden sonra İslam hukuku İran hukuk sistemini etkilemiş ve şeriata aykırı olan yasalar yürülükten kaldılırılmıştır. Böylece İran hukuku, şeriat ve İslam hukuku etkisiyle birçok yerde kadın haklarını kısıtlamış hatta bazı durumlarda kadın haklarının yok olmasına sebep olmuştur. Örneğin, 1979 İran İslam Devrimi öncesinde kadınların evlenme yaşları on sekizken devrimden sonra on üçe düşürülmüştür. Bu gibi kısıtlamalardan tez boyunca söz edilecektir."
