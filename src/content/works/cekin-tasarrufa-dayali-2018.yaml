abstract: "Tasarrufa dayalı finansman sistemi, geçmişi birkaç yüzyıla dayanan ve muhtelif şekillerde uygulaması bulunan bir finansman sistemidir. Sistemin temel özelliği, finansman kullandırımının belirli bir süre ve belirli bir miktar tasarruf etme şartına bağlı olmasıdır. Bu çalışma, sistemin İslami finans sistemi bünyesinde faizsiz şekilde icra edilebilmesi için taşıması gereken nitelikleri incelemektedir. Öncelikle finans ve İslami finans terimleri üzerinde durularak, sistemin değerlendirilmesi aşamasında hangi kriterlerin dikkate alındığı gösterilmiştir. Müteakip bölümde Türkiye'de sistemi icra eden firmaların uygulamaları üzerinden sistemin mevcut durumu ve muhtelif örnekleri üzerinden küresel düzlemdeki benzer uygulamaları hakkında kapsamlı bilgiler verildikten sonra, son bölümde sistemin İslami finans ilkeleri çerçevesinde değerlendirilmesine yer verilmiştir. Sonuç olarak, sistemin mevcut haliyle İslami finans ilkeleri bağlamında bir takım sakıncalar ihtiva ettiği ve dolayısıyla hâlihazırda bir İslami finans uygulaması olarak değerlendirilemeyeceği, ancak gerekli revizyonların yapılması halinde bu potansiyele sahip olduğu belirlenmiştir. Yapılacak revizyonlar esas itibarıyla sistemin İslam hukuku bağlamında meşru akit türleri üzerine inşa edilmesi noktasındadır. Tez kapsamında yer verilen değerlendirmeler neticesinde, sistemi icra eden firmaların müşterileriyle ve aynı zamanda müşterilerin kendi aralarında akdetmeleri gereken belirli akit türlerinin mevcut olduğu anlaşılmaktadır."
