abstract: "Hukuk, insanın insanla olan ilişkilerini düzenleyen ve toplumun genel yararını adaletle sağlamayı amaçlayan bir bilimdir. Bir hukuk sistemi olarak fıkıh, dinî ve sosyal bir müessese olması hasebiyle insanın insanla olan ilişkisinin yanında insanın Allah ile olan ilişkisini de düzenlemiş ve bu yönüyle de diğer hukuk sistemlerinden temayüz etmiştir. Fıkıh, mükellefler için kolaylığın sağlanması, hukukun beraberinde getirdiği zorluk ve katılıkların önüne geçilmesi ve hem dünya hem âhirette insanların yararlarını sağlamak üzere gelişim göstermiştir. Kaynak bakımından vahiy ve ictihada dayanması itibariyle de beşerî hukuktan temayüz eden fıkıh, insan hayatının her alanını kuşatacak şekilde; ibâdet, ahlak ve muâmelât ile ilgili genel kurallar vaz' etmiş ve özellikle insanların örf, âdet ve maslahatlarını dikkate almıştır. Kur'ân, sünnet ve icmâ gibi aslî kaynaklara dayanan İslâm fıkıh mezhepleri, mükelleflerin dünya ve âhiret yararlarını sağlama amacına binâen birbirlerinden temayüz ettikleri ferî deliller geliştirmişlerdir. Kuzey Afrika bölgesinde yaşayan Mâlikî fıkıh bilginleri, örf, maslahat ve zaruret gibi belirli gerekçelere dayanarak mezheplerinin meşhur görüşlerini terk etme işlemi olarak amel-i Fâsî anlayışını kullanmışlardır. Hanefîler ise nas, icmâ ve zaruret gibi gerekçelerle genel ve yerleşik kuralı terk edip uygun bir çözüm yolu bulma metodu olarak istihsan yöntemini geliştirmişlerdir. Dolayısıyla her iki anlayışın da temelde sıkıntı ve meşakkati izale etmek gibi ortak temelden hareket ettikleri görülmektedir. Bununla birlikte gerek metodolojik gerek uygulama yönünden birbirlerinden farklılaştıkları yönleri bulunmaktadır. Kendi muhitlerinde gelişip kabul gören iki anlayış da aslî kaynaklar ile uyumları, kapsam ve sınırlarının belirlenmesi cihetiyle tenkitlere de maruz kalmışlardır. Çalışmamızda Fas'ta yaşayan Mâlikî âlimlerin mezheplerinin râcih görüşlerini belirli gerekçelerle terk etme anlayışı amel-i Fâsî'nin tanımı, ortaya çıkma süreci ve hükümlere etkisi üzerinde durulmuştur. Buna mukabil Hanefîlerin sıkça başvurdukları bir hüküm istinbât metodu olan istihsan da tanım ve fikrî temelleri cihetinden ele alınmış ve söz konusu bu iki anlayış farklı açılardan mukayese edilmiştir."
