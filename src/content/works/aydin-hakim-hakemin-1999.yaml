abstract: "ÖZET Hukuk kurallarının uygulayıcıları başta hâkimler daha sonra da hakemlerdir. Hâkim ve hakemler tarih boyunca bütün toplumlarda önemli bir yere sahip olmuşlardır. Her hukuk sisteminde olduğu gibi İslam hukukunda da bu önemli görevi yerine getirecek kişilerde bazı vasıflar aranmış ve kendilerine bazı sorumluluklar yükleülrniştir. Bu tez çalışmasında güttüğümüz amaç İslâm hukukunda hâkim ve hakemde aranan vasıflan ve sorumluluklarını inceleyip bu açılardan aralarındaki farkları tespit etmek olmuştur. Giriş kısmında, hâkim ve hakemin yargılama hukukundaki yerini göstermek amacıyla İslâm hukukunda muhakeme mercileri ve asıl ve yardıma görevlileri ile ilgili kısaca bilgi verilmiştir. Birinci bölümde, Türk Pozitif hukuku ve İslâm hukukuna göre hâkim ve hakemin vasıflan incelenmiş ve vasıflan açısından hâkim ve hakemin mukayeseli değerlendirmesi yapılmıştır. İkinci bölümde, Türk Pozitif hukuku ve İslâm hukukuna göre hâkim ve hakemin sorumluluklan ele alınmış ve sorumtuluklan açısından hâkim ve hakemin mukayeseli değerlendirmesi yapılmıştır. Çalışmada ulaşılan sonuçlar“sonuç”kısmını oluşturmuştur. Konular incelenirken ilk kaynaklara ulaşılmaya çalışılmış, konulara ilgili farklı görüşler delilleri ile birlikte zikredilip bu görüşler arasında tercih yapılmıştır. İslâm hukukçularının çoğunluğu, hâkim ile hakem de aynı vasıflan aramışlar bu açıdan aralarında bir fark görmemişlerdir. Bu vasıflar ise kısaca şunladır Din, Erginlik, Akıl, Cinsiyet, Sağlık, Adalet, İlim. Türk Pozitif hukukunda olduğu gibi İslâm hukukunda da hâkim ve hakemin sorumluluklan yeterince ele alınmamıştır. Ancak bu konu ile ilgili azda olsa ulaşabildiğimiz bilgilere göre, hâkim ve hakemin, muhakeme usûlü kurallarına ve yoruma ihtiyaç göstermeyecek açık hükümlere aykın davranmalan durumlarında hukukî ve cezaî sorumluluklan vardır. Hukukî ve cezaî sorumluluğun kapsamı konusunda ise İslâm hukukçulan farklı görüşlere sahiptir"
