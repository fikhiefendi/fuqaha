abstract: "Bu tez, dijital dönüşümü ve dijital dönüşümün Filistin Devleti'nde faaliyet gösteren İslami bankalar üzerindeki etkisini tanımlamayı ve dijital İslami finansın finansal tabana yayılma ve bankacılık pazarlamasını geliştirmedeki rolünü belirlemeyi amaçlamıştır.Bunu başarmak için tanımlayıcı, analitik ve istatistiksel bir çalışma yapılmıştır. yaklaşımı, (214) anketin bir örneğe dağıtılması izlemiştir.Çalışma, dijital finansal teknoloji yeniliklerini ve bunların Filistin Devleti'ndeki İslami bankaların performansını geliştirmedeki rolünü incelemeyi amaçlamaktadır. Çalışmada, bilgi güvenliğini korumaya yönelik özel sistemlere ve cep telefonları ve tabletlerde etkili bankacılık uygulamalarına sahip olan Filistin İslami bankalarının dijital dönüşümü hayata geçirirken performansı üzerinde açık bir etkinin olduğu ve bu sonuçlara şu şekilde ulaşıldı: İslami bankalar müşterilerine hizmet vermek için finansal teknolojiyi kullanıyor ve bu, Dijital dönüşümün bankaların faaliyet hacmini artırmaya katkıda bulunduğunu, dijital dönüşümün pazarlama operasyonlarının verimliliğini artırmada önemli bir olumlu rol oynadığını ve dijital dönüşümün pazarlama operasyonlarının verimliliğini artırmada büyük bir olumlu rol oynadığını gösteriyor. Finansal tabana yayılmanın artırılmasında dijital dönüşümün olumlu rolü Çalışmada bir dizi öneriye ulaşıldı; bunlardan en önemlileri teknolojik gelişmeye ayak uydurmanın gerekliliği ve İslami bankaların dijital teknolojileri daha büyük ölçüde benimsemesi: bulut bilişim, yapay zeka ve Allah'ın makine öğrenimini öğrenme yeteneği. Bunun tam tersi, gelişmede geriliğe ve geriliğe düşmeye, ülkelerin ihtiyaçlarını dikkate alan yeni finansal finansman ürünleri ve İslami hizmetler icat etme zorunluluğuna yol açacaktır. Küresel düzeyde toplumun kesimlerine maliyet ve uygulama açısından uygun olmak."
