abstract: "Bu tez, Şâfiî mezhebinin önde gelen âlimlerinden Ebû'l-Hasen el-Mehâmilî'nin (ö. 415/1024) ve onun seçkin eseri el-Lübâb'ın analitik bir incelemesini konu edinmektedir. Araştırmanın temel amacı, müellifin İslam hukuku alanındaki konumunu ortaya koymak, fıkhî muhakemesini analiz etmek, meseleleri ele alış biçimini ve hüküm istinbat etme yöntemini incelemek, ayrıca Şâfiî fıkhının gelişimine yaptığı katkıları ortaya koymaktır. Tez, bir giriş ve üç ana bölümden oluşmaktadır. Giriş bölümünde tezin amacı, konusu, önemi ve sınırlılıkları ortaya konmuştur. Birinci bölümde İmam'ın hayatı, ailesi, yetiştiği ilmî çevre, hocaları ve talebeleri, el-Lübâb adlı eserin müellife nispeti, önemi ve ilmî değeri incelenmiştir. İkinci bölümde, İmam'ın el-Lübâb'daki usûlî yaklaşımı, şer'î delilleri kullanma biçimi, illet temelli akıl yürütme yöntemi ve istidlâl tarzı ele alınmıştır. Üçüncü bölümde, eserden çıkarılan fıkhî kaideler ve hükümler analiz edilmiş; İmam'ın tercihleri ile Şâfiî mezhebindeki muteber görüşler arasındaki uyum ve farklılıklar gösterilmeye çalışılmıştır. Üçüncü bölümde ise el-Lübâb'ın ilmî yapısı, metodolojisi, İmam'ın Şâfiî tabakatı içindeki yeri, eserlerinin fıkıh literatüründeki konumu ve meseleleri sunuş üslubu incelenmiştir. Araştırmada, İmam Mehâmilî'nin güvenilir ve yetkin bir fakih olarak ilmî otoritesinin teyidi, elLübâb'ın ona aidiyetinin ispatı ve hükümlerin tertip ve temellendirilmesindeki metodolojik üstünlüğü ortaya konulmaya çalışılmıştır. Böylece İmam'ın Şâfiî mezhebinin gelişimindeki rolünün daha sağlıklı biçimde anlaşılması amaçlanmaktadır ."
