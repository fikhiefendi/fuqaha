abstract: "Bu çalışmanın amacı, mikrofinans kurumlarının deneyimlerini analiz etmek ve gelecekteki beklentiler için hangi dersleri alacağımızı ortaya çıkarmak amacıyla Afganistan bağlamında Mikrofinans kurum uygulamalarına ve deneyimlerine kapsamlı bir bakış sunmaktır. Araştırma, Afganistan'da mikrofinans kurumlarının kurulmasından bu yana, misyonlarının belirli yönlerinde başarılı olduklarını, ancak aynı zamanda büyük sermaye kaybına, iflasa neden olan ve diğer şirketlerle birleşmek zorunda kalan zor koşullar ve başarısızlıklarla karşılaştıklarını göstermiştir. Bu çalışma, Afganistan'ın farklı Mikrofinans kurumlarının İcra Kurulu Başkanları, Uzmanlar, Kredi Başkanı, Planlama ve Stratejik Yöneticiler ve Kredi Müdürleri gibi yüksek hiyerarşiden veya üst düzey yönetimden çevrimiçi bir görüşmenin yapıldığı birincil kaynaklara dayanmaktadır. Araştırmanın gerçekleştirilmesi için olasılıksız örnekleme yöntemi kullanılmıştır çünkü katılımcılar belirli özelliklere göre seçilmiştir. Yanıtların analizi, Afganistan'daki Mikrofinans kurumlarının işleyişini olumsuz etkileyen iç ve dış faktörlerin olduğunu göstermiştir. Sonuçlar, Afganistan'da yıllardır çalışan farklı Mikrofinans Kurumlarına rağmen, yoksulluğun özellikle Afganistan'ın kırsal alanlarında hala büyük bir endişe olduğunu göstermektedir. Ayrıca, çalışma, ülkedeki dini inançların, yolsuzluğun ve güvenlik eksikliğinin Afganistan'daki Mikrofinans kurumlarının zorluklarının ve başarısızlıklarının arkasındaki temel nedenler olduğunu gösteren örnekler de getirdi. Bu temelde, Mikrofinans kurumlarının İslami ürün ve hizmetleri sunmayı düşünmesi önerilir çünkü Afganistan İslami inançların üstün olduğu bir ülke. Böyle bir ürünü piyasaya sürerek, mikrofinans kurumlarının potansiyel kullanılmayan pazarlarına ulaşmalarına da yardımcı olacaktır."
