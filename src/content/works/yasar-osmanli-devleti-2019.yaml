abstract: "Osmanlı Devleti'nin son dönemlerinde Antalya Hapishanesi, başlığını taşıyan tezde, Osmanlı Devleti'nde 19. Yüzyılın ikinci yarısından sonra meydana gelen hapishane reformu sürecinin Antalya hapishanesine etkileri saptanmıştır. Hapishaneler ile alakalı kaleme alınmış, Gültekin Yıldız'ın Mapusane ve Emine Gürsoy Naskali ile Hilal Oytun Altun'un editörlüğündeki makaleler derlemesi olan Hapishane Kitabı adlı eserlerini ana kaynak olarak kabul edebiliriz. Konuyla alakalı pek çok makale de yazılmıştır. Bunlar arasında Ali Rıza Gönüllü'nün, Osmanlı Devleti'nin Son Dönemlerinde Isparta Hapishanesi (1867-1920) ve Nurgül Bozkurt'un, 20. Yüzyıl Başlarında Kütahya Hapishanesinin Genel Durumu isimli çalışmaları yer alır. Bunun yanında kaleme alınan tezler de mevcuttur. Ufuk Adak'ın, 19. Yüzyılın Sonları 20. Yüzyılın Başlarında Aydın Vilayeti'ndeki Hapishaneler ve Nazmiye Akbey'in 19. Yüzyılın Sonları 20.Yüzyılın Başlarında Sinop Hapishanesi adlı çalışmaları da oldukça önemlidir. Bizim de Antalya hapishanesini ele aldığımız çalışmamız üç bölümden oluşmaktadır. Birinci bölümde, suçun kaynağına inerek ilk hangi duygularla ne zaman baş gösterdiğini ve nasıl geliştiğinin yanında, suç, ceza ve hapishane kavramlarını İslam Tarihi'nden başlayıp, Osmanlı Devleti'ne kadar getirerek tanımlarının yanı sıra, bu kavramların gelişimleri hakkında da bilgiler verilmiştir. Bunun yanında Avrupa'daki hapishanelerden ve oluşturulan çeşitli hapishane modellerinden bahsedilmiştir. Daha sonra suç, ceza ve hapishane kavramları tamamen Osmanlı Devleti açısından incelenmiştir. Hadd, ta'zir ve kısas suçlarının neler olduğu, bu suçu işleyen kişilere ne gibi cezaların uygulandığı, İslam Tarihi'nden de faydalanarak ifade edilmeye çalışılmıştır. Çünkü Osmanlı Devleti'nin uyguladığı yasaların tamamının tabanında, İslam Hukuku yer aldığından dolayı, aralarındaki bağ yadsınamazdır. Daha sonra zindandan hapishaneye geçiş sürecinin yaşandığı, Tanzimat Dönemi'ndeki ceza anlayışının ne gibi değişiklere uğradığını 1840,1851 ve 1858 tarihlerinde çıkarılan Ceza Kanunnameleri üzerinden değerlendirilmiştir. Ardından Osmanlı Devleti'nde hapishaneler adına gerçekleştirilen ıslahatlara yer vermiştir. İkinci bölümde, ilk olarak hapishanenin bulunduğu yer olan Antalya şehri hakkında kısaca bilgi verilmiştir. Daha sonra hapishanenin yeri ve yeniden inşası sürecinden erişebildiğimiz arşiv kaynaklarındaki bilgiler kadarıyla bahsedilmiştir. Hapishanenin geçirdiği tamir süreci, genişletilmesi, ek oda inşaatları ve bunun yanında gasilhane, abdesthane gibi mahkumlar için yapılan inşa faaliyetlerine de yer verilmiştir. Hemen ardından, tayinat konusundan ve yaşanılan sorunlardan detaylıca bahsedilmiştir. Son olarak da hapishane yönetiminde kimlerin olduğu, görevleri maaşları ve tayinleri mevzusu değerlendirilmiştir. Üçüncü bölümde, ulaşabildiğimiz arşiv belgeleri ışığında, Antalya hapishanesindeki mahkumlar tüm yönleriyle ele alınmaya çalışılmıştır."
