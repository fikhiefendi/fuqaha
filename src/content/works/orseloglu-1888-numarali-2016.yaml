abstract: "Bu tez çalışmasının amacı, 1888 Numaralı Trabzon Şer'ıyye Sicili'nin özet transkripsiyonu ve analizi ile Osmanlı ve Trabzon Tarihi'ndeki araştırmalara katkı sağlamaktır. Şer'ıyye Sicilleri, birinci dereceden kaynaklar arasında olması ve bu sayede genelde Osmanlı, özelde Trabzon Tarihi'ni daha iyi yorumlama bakımından oldukça önemli kaynaklardandır. Böylece bu çalışma dönemin tarihi panoramasını çıkarmada mevcut çalışmalara büyük oranda katkı sağlayacaktır. Çalışma üç bölümden oluşmaktadır. Birinci bölümde sicilde adı geçen yerlerin dökümü, önemli şahıslar ve görevleri kayıt numaraları ile verilmiştir. Bunlar hakkında kısa analizler yapılarak bu alanda çalışma yapacaklara davetiye çıkarılmıştır. İkinci bölümde ise sicildeki kayıtlar konularına göre tasnif edilerek tablolar eşliğinde yorumlanmıştır. Üçüncü bölümde kayıtların üslup ve biçim bakımından analizleri yapılarak, üslup ve biçimin hükmün en az kendisi kadar önemli olduğu üzerinde durulmuştur. Sicilin özet transkripsiyonu ise çalışmanın sonunda varak, kayıt numarası ve konu başlıkları ile verilmiştir."
