abstract: "İmâm-ı Rabbâni İslam ahkâmı ile tasavvufu birleştirmiş önemli bir İslâm mutasavvıfı ve âlimidir. Ona göre tasavvuf, İslam dini dışında ayrı bir yol değil; bizzat İslam'ın emir ve yasaklarını kolayca ve ihlaslı bir şekilde yapılmasını sağlayan Yüce Allah'a sevgi ve yakınlık yoludur. O,“tarikat ve hakikati'' şeriatın üçüncü parçası olan ”ihlas'' unsurunu tamamlamak ve ona hizmet etmek için gerekli olduğunu belirtmiş, tarikat ve hakikatten maksadın şeriatla ameli ihlaslı bir şekilde tamamlamak olduğunu söylemiştir. Tasavvuf yolunda bulunmanın amelleri yerine getirmede kolaylık sağladığını nefs-i emmâreden gelen tembellik ve isteksizliği yok etttiğini belirten İmâm-ı Rabbâni, tasavvufu sadece insanın imanının kuvvetlenmesi ve amelin ihlaslı bir şekilde yapılmasına yardımcı bir unsur olarak görmüştür. İmâm-ı Rabbâni; meşhur eseri Mektûbât'ında, insanların kıyamet gününde şeriattan sorumlu olacaklarını belirtmiş,“tarikat ve hakikat şeriatın hizmetindedir”anlayışını ortaya koyarak önce Ehl-i Sünnet anlayışı üzere itikadı düzeltmenin ve sonra fıkıh öğrenmenin gerekliliğini vurgulamıştır. Ona göre tarikat ve hakikat, şeriatın üçüncü unsuru olan ihlası tamamlamak hususunda bir hizmetçi konumundadır."
