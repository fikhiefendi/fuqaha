abstract: "Bu çalışmanın amacı, Türkiye'ye özgü bir hac fonu model önerisi yapmaktır. Bu amaca binaen, ilk olarak İslam iktisadında üçüncü sektör ekosistemi teorik bir çerçevede ele alınmıştır. Daha sonra iki ayrı saha araştırması gerçekleştirilmiştir. İlk saha araştırması, TÜBİTAK-2214 yurt dışı araştırma programı kapsamında dünyanın ilk ve en köklü hac fonu olan Tabung Haji'ye (TH) yönelik Malezya'da yapılmıştır. Bu araştırmada, TH çalışanları/yöneticileri ve müşterileri olmak üzere on sekiz (18) kişiyle nitel araştırma yöntemlerinden durum çalışması (case study) deseni tercih edilerek yarı yapılandırılmış görüşmeler gerçekleştirilmiştir. Bu bağlamda çalışmamız, TH üzerine derinlemesine görüşmelere dayalı literatürdeki ilk saha çalışması olma hüviyeti taşımaktadır. İkinci saha araştırması ise TH modelinin Türkiye'ye nasıl uyarlanacağını keşfetmek amacıyla Türkiye'deki ilgili aktörlerle görüşmelere dayalı olarak gerçekleştirilmiştir. Bu araştırmada, TH'nin tasarruf toplama, fon yönetme ve hac organize etme fonksiyonlarına karşılık gelen Türkiye'deki yirmi bir (21) kişi/kurumla yapılandırılmamış görüşmeler yapılmıştır. Bu iki saha çalışmalarından elde edilen bulgular ışığında, yapısal değişiklik gerektirmeyen- kısa vadeli ve yapısal değişiklik gerektiren-uzun vadeli iki Türkiye Hac Fonu modeli sunulmuş ve bu modellerin hayata geçirilmesini kolaylaştıracak politika önerileri yapılmıştır. Sunulan modellerde hac fonunun kapsamı, işleyişi, kurumsal yapısı, hukuki çerçevesi, paydaşlara sunulacak teşvikler ve fon büyüklüğüne yönelik örnek hesaplama yer almaktadır. Bu kapsamda, saha araştırmalarına dayalı olarak kaleme alınan bu tezin üç temel önemi bulunmaktadır: -İslam iktisadındaki üçüncü sektör ekosistemini kapsamlı bir teorik çerçevede ele alması, -Hâlihazırda varlığını koruyan modern bir ÜSK olan Tabung Haji'nin Türkiye'ye uygulanabilirliği üzerine ilk defa bir saha çalışması yapılmış olması, -Türkiye'deki ekosistemde bulunmayan bir kurum önerisi yapılması ve tasarruf açığı olan Türkiye ekonomisine oluşturulacak Türkiye Hac fonu ile ekonomik katkı sağlayacak olmasıdır."
