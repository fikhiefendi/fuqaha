abstract: "Bu tez, vakıf kavramını ve uygulamalarını, özellikle para vakıfları bağlamında, tarihsel, mukayeseli ve çağdaş bir perspektifle ele almaktadır. Çalışma, araştırmanın konusu, önemi ve amacı ile başlamakta; ardından Türkiye ve yurt dışında yapılan ilgili literatür taramasıyla devam etmektedir. Birinci bölümde, İslam hukukunda vakıf hukuku incelenmiş; vakfın tanımı, Kur'ân, sünnet ve icmâ ile meşruiyeti, özellikleri, hikmeti ve bağlayıcılığı ele alınmıştır. Ayrıca, vakfın tarihsel gelişimi, İslam öncesi uygulamalar, İslam dönemindeki evrimi ve Batı'daki benzer sistemlerle mukayesesi detaylandırılmıştır. Bu bölümde vakıflar; amaç, süre, kurucu ve malvarlığı türlerine göre sınıflandırılmıştır. İkinci bölüm, para vakıflarına odaklanarak, meşruiyeti, şerʿî amaçları ve fıkhî temellerini ele almıştır. Menkul malların vakfına ilişkin hükümler, mücevher ve nakit vakıflarına dair tartışmalar, tarihi perspektif ve İslam hukukundaki yerleri ayrıntılı şekilde incelenmiştir. Para vakıflarının ortaya çıkışı, gelişimi, duraklama dönemleri ve yeniden canlanışı özellikle Osmanlı dönemi uygulamaları çerçevesinde analiz edilmiştir. Ayrıca, literatür taraması yapılarak geleneksel ve modern dönem yazınındaki önemli eserler değerlendirilmiştir. Üçüncü bölümde, günümüzdeki para vakfı uygulamaları incelenmiştir. Endonezya'daki sukuk tabanlı vakıf modelleri, İslam Kalkınma Bankası'na bağlı uluslararası vakıf fonları ve tekâfül (katılım sigortası) gibi yenilikçi yaklaşımlar detaylandırılmıştır. Bunun yanı sıra, Batı'daki benzer modeller arasında Harvard Üniversitesi'nin vakıf yönetimi uygulamaları ele alınmış; bu modellerin finansal performansı, risk yönetimi ve sürdürülebilirlik açısından analizi yapılmıştır. Tez, para vakıflarının modern sosyo-ekonomik sorunları çözmedeki potansiyelini değerlendirmekte ve bu kurumların yönetişim, hukuki çerçeve ve küresel finans sistemleriyle entegrasyonunu optimize etmeye yönelik öneriler sunmaktadır. Tarihsel gelenekleri modern finansal araçlarla birleştiren bu çalışma, vakıfların sosyal refah ve ekonomik kalkınmada etkin bir mekanizma olarak rolünü güçlendirmeyi amaçlamaktadır."
