abstract: "Bu çalışmada, 1897-1898 (H. 1314-1315) yıllarını içeren 627 Numaralı Karahisar-ı Sahib Şer'iyye Sicili incelenmiştir. Şer'iyye sicilleri doğrudan halk ile ilgili orijinal bilgiler verdikleri için sosyo-ekonomik tarih açısından birinci derecede önemli kaynaklardır. Defterde 314 adet sicil kayıt belgesi değerlendirilmiştir. Hüccet, ilam ve arzlardan oluşan defterimizdeki kayıtların temel konusunu miras, velayet, nikâh, boşanma, nafaka gibi aile hukuku oluşturmaktadır. Ayrıca satış muameleleri, at hırsızlığının ağırlıkta olduğu şikâyetler, vakıf mütevelli işlemleri ve bazı izin belgeleri de mevcuttur. Verasetle ilgili belgelerin 2/3'ünü tereke kayıtları oluşturmaktadır. Bu kayıtlardan istifade edilerek tarım ürünleri, geçim kaynakları ve ev eşyaları fiyatlarıyla birlikte ele alınmıştır. Sosyal hayat, aile hukuku ile ilgili belgeler ışığında ortaya koyulmaya çalışılmıştır."
