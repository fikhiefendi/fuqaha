abstract: "İnsanoğlunun başlangıcından günümüze kadar her geçen gün değişen ve gelişen, hayatı anlamlı kılan, kültürlerin yayılmasına sebep olan en önemli iletişim aracı dildir. Bu bağlamda Arapça, Arap Yarım Adası'ndan doğan, tüm dünyaya yayılan İslâm Dininin dili, geçmişten geleceğe özgün, geniş, zengin kaynakları ile araştırmacıların ilgi odağı, konuşan kişi ve çevrelerin çoğaldığı bir dünya dilidir. Biz bu çalışmamızda Arapça dilbilimcilerinin önde gelenlerinden biri olan İbn Hişâm'ın dönemine kadar Arapça'nın geçirdiği aşamaları, İbn Hişâm'ın yaşadığı dönemin siyâsî, sosyal, iktisâdî, kültürel ve dinî yapısını, dil ekollerine bakış açısını, nahiv konularını işleyiş üslûbunu, kaynaklarının neler olduğunu, öncelik sıralarını ve bazı konularda diğer dilbilimcilere ve ekollerine yöneltmiş olduğu eleştirileri sunmaya ve tahlîl etmeye çalıştık."
