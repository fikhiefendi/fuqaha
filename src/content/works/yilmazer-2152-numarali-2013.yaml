abstract: "Bu çalışma, 1896-1900 (H. 1313-1317) yıllarına ait 2152 numaralı Safranbolu Şer?iyye Sicil Defteri esas alınarak hazırlanmıştır. Defterde toplam olarak 405 belge mevcuttur. Defterde toplamda dört ayrı kadı dönemine ait kararlar bulunmaktadır. Çalışmamız; içindekiler, giriş, belgelerin özet ve transkripsiyonu ile değerlendirme ve sonuç bölümlerinden oluşmaktadır. Giriş bölümünde Safranbolu?nun kısa bir tarihçesi, şer?iyye mahkemeleri ve şer?iyye sicilleri hakkında bilgiler yer almaktadır. Transkripsiyon öncesinde belgelerin kısaca özetleri verilmiş olup transkripsiyon, değerlendirme ve sonuç bölümüyle çalışmamız sonlandırılmıştır."
